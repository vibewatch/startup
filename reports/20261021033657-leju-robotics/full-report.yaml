              - CE011
              - CE015
      - number: '5.2'
        title: The differentiation thesis is vertical integration across body, control, and learning
        blocks:
          - type: paragraph
            body: >-
              Available descriptions point to an integrated architecture rather than a standalone robot shell. At the
              physical layer, Leju is associated with high-torque joint modules, bipedal locomotion, and a wheeled
              alternative. Perception and navigation descriptions add depth cameras, LiDAR, multimodal sensing, obstacle
              handling, and 3D SLAM. Above that, sources describe KaihongOS, derived from OpenHarmony, plus real-time
              control and large-model integration. The most strategically relevant layer is the reported
              teleoperation-to-imitation-learning pipeline: operators collect task data, GPU infrastructure trains
              skills, and trained packages return to the robot. If configuration-specific interfaces and training
              economics are validated, this stack could shorten adaptation across tasks. The current evidence does not
              isolate which components are proprietary, production-ready, open to customers, or dependent on Huawei,
              NVIDIA, or other external suppliers.
            claimRefs:
              - CE003
              - CE006
              - CE010
              - CE011
              - CE015
          - type: table
            tableRef: TE003
            claimRefs:
              - CE003
              - CE004
              - CE006
              - CE010
              - CE014
              - CE015
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE010
              - CE011
              - CE015
      - number: '5.3'
        title: Market-facing activity is evident; production maturity remains unresolved
        blocks:
          - type: paragraph
            body: >-
              Leju is not operating in private-only development: The Robot Report recorded KUAVO's presence at
              Automation World 2026, and Humanoid Index labels the company commercial. Other records describe intended
              manufacturing, logistics, research, retail, and service uses, and one sourcing directory lists a wide
              quotation range and a 60-90 day lead time. These indicators are evidence of market engagement, not proof
              of repeatable production economics or field reliability. The same pool contains a direct maturity
              conflict: BehindRobotics labels KUAVO a prototype, while ui44 reports no currently available listing. No
              retained source supplies configuration-level order history, acceptance-test results, mean time between
              failures, support response times, warranty reserves, upgrade policy, or a dated roadmap. Underwriting
              should treat current maturity as configuration-dependent until Leju reconciles these external labels with
              signed orders and fleet records.
            claimRefs:
              - CE002
              - CE005
              - CE007
              - CE008
              - CE012
              - CE013
      - number: '5.4'
        title: Safety and operational proof lag the breadth of technical claims
        blocks:
          - type: paragraph
            body: >-
              Trust and safety disclosures are the largest product-technology weakness in the assigned evidence.
              Humanoid.Guide says KUAVO 5-W is intended for shared industrial and service spaces and references EMC
              testing, but explicitly notes that no collaborative-safety certification was published. A separate
              technical profile lists no published environmental ratings, battery capacity, runtime, charge time,
              payload, grip force, or sensor layout for the family it describes. Those omissions matter because safe
              coexistence, duty cycle, manipulation envelope, and maintenance burden determine whether a humanoid can
              replace or merely supplement fixed automation. The pool also contains no public repository, package
              telemetry, issue tracker, security documentation, incident history, or practitioner-community signal. This
              is not evidence that incidents or controls are absent; it means architecture, cybersecurity, privacy,
              quality management, and field reliability require direct documentary diligence.
            claimRefs:
              - CE004
              - CE006
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Configuration-specific diligence is essential
            body: >-
              KUAVO family-level descriptions combine bipedal and wheeled products with materially different mobility,
              runtime, safety, and deployment assumptions; underwriting should be performed against the exact bill of
              materials and software release offered to each customer.
            calloutType: insight
            claimRefs:
              - CE003
              - CE011
          - type: callout
            title: Commercial status is not independently settled
            body: >-
              One external index labels Leju commercial, another catalog labels KUAVO a prototype, and a third records
              no available purchase listing. Signed-order, delivery, acceptance, and active-fleet evidence is needed to
              resolve the discrepancy.
            calloutType: risk
            claimRefs:
              - CE005
              - CE012
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer mix is broad in use case but concentrated in pre-scale demand
        blocks:
          - type: paragraph
            body: >-
              Leju's disclosed 2025 Kuavo revenue mix points to four distinct buyer contexts rather than one mature end
              market. Data-collection centers represented 45% of Kuavo revenue, followed by research and education at
              32.5%, commercial services at 18.7%, and industrial manufacturing at only 3.88%. The first two categories
              therefore supplied most current demand, while factory use remained an early-stage option rather than the
              economic center of the installed base. Smaller Roban and Aelos products add a separate education channel:
              reported 2025 volumes of 91 and 3,988 units, respectively, show that unit counts across the portfolio are
              not comparable without separating full-size, mid-size, and small educational robots. The segmentation
              table preserves those distinctions, and the journey map shows the different adoption surfaces without
              implying that every buyer follows one conversion funnel.
            claimRefs:
              - CU003
              - CU006
              - CU007
              - CU008
              - CU013
              - CU014
          - type: table
            tableRef: TU001
            claimRefs:
              - CU003
              - CU004
              - CU006
              - CU007
              - CU008
              - CU013
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU003
              - CU007
              - CU008
              - CU009
              - CU014
              - CU016
      - number: '6.2'
        title: Unit acceleration came with lower pricing and incomplete deployment denominators
        blocks:
          - type: paragraph
            body: >-
              Kuavo unit sales reportedly rose from 32 in 2024 to 577 in 2025, while Kuavo revenue reached RMB 178
              million and 69.5% of company revenue. That is strong shipment evidence, but it is not the same as active
              production use: the sources do not disclose how many units were operating, utilization by task, repeat
              orders, or the number of distinct customer organizations. Moreover, the reported 25.56% decline in average
              selling price means volume growth cannot be read as unchanged willingness to pay. Third-party directories
              add current commercial signals but conflict in maturity: one records no public ordering listing for the
              tracked Kuavo model, another gives an indicative USD 38,000-150,000 quotation range, and a separate
              product directory labels KUAVO 5-W as in production. The trajectory table therefore separates disclosed
              company metrics from unverified procurement listings.
            claimRefs:
              - CU001
              - CU002
              - CU005
              - CU009
              - CU010
              - CU014
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU002
              - CU005
              - CU006
      - number: '6.3'
        title: Deployment evidence ranges from named POC to unnamed operating claims
        blocks:
          - type: paragraph
            body: >-
              The strongest named industrial proof in the retained evidence is a 2025 Kuavo 4 Pro proof-of-concept at a
              FAW factory for tote handling and picking. The source explicitly characterizes industrial manufacturing as
              an early-stage use case, so the trial should not be upgraded into a production rollout or repeat order. A
              separate October 2026 article reports 15 robots on an automotive-parts loading line, a 98% success rate,
              and 1,000 hours of continuous operation, but it does not identify the customer or link the metric to
              primary test documentation. Commercial guidance and education references are also third-party descriptions
              rather than customer-issued case studies. The proof table therefore records identity, production status,
              reported outcome, and limitation separately instead of treating every mention as equivalent customer
              validation.
            claimRefs:
              - CU004
              - CU011
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU004
              - CU011
              - CU012
      - number: '6.4'
        title: Durability and expansion remain the central customer diligence gap
        blocks:
          - type: paragraph
            body: >-
              Public evidence does not establish gross or net revenue retention, churn, renewal rates, contract
              duration, repeat-purchase behavior, satisfaction, top-customer concentration, or channel economics. Leju's
              education-era direct and non-direct network may lower access and service friction for institutional
              buyers, but channel reuse is not evidence that full-size deployments renew or expand. The disclosed
              use-case concentration also matters: 45% of 2025 Kuavo revenue came from data collection, while the
              industrial share was 3.88%. In parallel, adverse industry reporting warns that Chinese humanoid capacity
              can run ahead of viable commercial demand. The underwriting case should therefore require customer-level
              order histories, active-unit and utilization cohorts, renewal or reorder evidence, and revenue
              concentration schedules before assigning durable land-and-expand economics.
            claimRefs:
              - CU003
              - CU007
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Shipment growth is not retention
            body: >-
              The 577-unit Kuavo sales figure lacks customer, active-unit, utilization, renewal, and repeat-order
              denominators; underwriting should not translate shipments into recurring deployment economics.
            calloutType: risk
            claimRefs:
              - CU001
              - CU016
          - type: callout
            title: Industrial proof remains mixed
            body: >-
              A named FAW proof-of-concept and an unnamed 1,000-hour deployment report are useful technical signals, but
              neither establishes broad paid production adoption.
            calloutType: insight
            claimRefs:
              - CU004
              - CU011
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked residual-risk view
        blocks:
          - type: paragraph
            body: >-
              The highest-priority risks are industrial reliability and product-safety readiness, followed by
              commercialization concentration, manufacturing scale-up, and strategic technology dependencies. A 16
              October 2026 article reports 15 robots operating on an automotive parts-loading line at a 98% success rate
              over 1,000 continuous hours, which is meaningful new evidence but remains a single, AI-drafted and
              human-reviewed report rather than a customer-issued acceptance record. Independent profiles also continue
              to describe the platform as a prototype or emphasize missing operating specifications. Investors should
              therefore treat the reported trial as a positive signal, not proof of fleet-wide reliability, certified
              safety, or attractive total cost of ownership. The thesis strengthens only when named customers publish
              repeatable uptime, intervention, defect, safety, and renewal data.
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR007
              - CR008
              - CR013
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR003
              - CR004
              - CR011
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.2'
        title: Regulatory, legal, and safety exposure
        blocks:
          - type: paragraph
            body: >-
              The assigned public evidence contains no regulator filing, court record, certification register, privacy
              policy, security audit, recall notice, or incident log. That is an evidence gap, not evidence that no
              issue exists. The risk becomes acute as Leju moves from supervised research settings into factories or
              foreign markets, where machinery safety, workplace liability, cybersecurity, data governance, radio
              approvals, export controls, and insurance terms can gate deployment. A high-reputation news source also
              identifies geopolitical uncertainty and trade tension as a major overseas headwind for Chinese robotics
              companies. Before underwriting international or safety-sensitive revenue, diligence should obtain a
              jurisdiction-by-jurisdiction certification matrix, product-liability coverage, incident and near-miss
              logs, an SBOM, penetration-test results, data-flow documentation, and an IP freedom-to-operate opinion.
            claimRefs:
              - CR007
              - CR014
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR007
              - CR014
              - CR016
      - number: '7.3'
        title: Operational, quality, and financial-model risk
        blocks:
          - type: paragraph
            body: >-
              Leju remains exposed to the classic hardware scale-up problem: reported demand and nominal capacity can
              expand faster than yield, field reliability, service capacity, and working capital. One independent
              analytical report describes a 2025 net loss of CNY 69.78 million on CNY 258 million revenue, while a
              component-sourcing profile says a new assembly plant was designed for up to 10,000 robots annually and
              cites a 30-minute takt time. Those figures describe ambition, not proven profitable throughput. Component
              allocation and end-of-life exposure add schedule and redesign risk, and public pricing signals remain
              inconsistent: one database records no official MSRP while a commercial sourcing page lists a very broad
              USD 38,000-150,000 range. Kill criteria should focus on widening losses, rising warranty claims, weak
              production yield, or trial performance that cannot be reproduced in customer-issued records.
            claimRefs:
              - CR001
              - CR006
              - CR009
              - CR011
              - CR012
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR005
              - CR007
              - CR011
              - CR012
      - number: '7.4'
        title: Partner, platform, and concentration dependencies
        blocks:
          - type: paragraph
            body: >-
              Public profiles point to three concentration vectors. First, the retained analysis says the customer base
              remains centered on research, education, and data collection, so the industrial transition may depend on a
              small number of pilots. Second, Schaeffler is a credible technology partner, but the public record
              reviewed here establishes a joint development relationship rather than production-scale revenue or
              customer acceptance. Third, KUAVO's OpenHarmony/Huawei alignment is strategically useful in China but ties
              a key layer of the software ecosystem to another company's roadmap and may complicate some overseas
              procurement. Meanwhile, Morgan Stanley's sharply increased China shipment forecast signals a
              faster-growing competitive supply base. Mitigation requires disclosed revenue concentration, signed
              production contracts, portable interfaces, qualified alternate components, and customer-validated
              economics rather than additional partnership announcements.
            claimRefs:
              - CR002
              - CR003
              - CR010
              - CR013
              - CR014
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR003
              - CR010
              - CR013
              - CR014
              - CR015
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Trial metric is not yet an underwriting metric
            body: >-
              The reported 98% success rate over 1,000 hours materially improves the evidence base, but the article does
              not provide task taxonomy, intervention frequency, denominator treatment, safety events, customer
              acceptance criteria, or economics. Require those fields before converting the report into a
              fleet-reliability assumption.
            calloutType: risk
            claimRefs:
              - CR004
              - CR005
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Decision and price discipline
        blocks:
          - type: paragraph
            body: >-
              The recommendation is research-more, not buy. Independent reporting derived from the IPO prospectus places
              Leju's latest post-money valuation at RMB 4.327 billion and its proposed IPO raise at RMB 2.6 billion,
              while the assigned evidence does not provide an offer price, fully diluted share count, preference stack,
              or primary filing text. That combination makes a target return, holding period, and valuation range
              impossible to calculate without false precision. The operating case has positive evidence: 2025 revenue
              reached RMB 258 million and the Kuavo line became the main revenue driver. Yet the same evidence reports a
              2025 net loss and negative operating cash flow. Entry discipline therefore requires audited prospectus
              reconciliation, security terms, dilution, and scenario-specific exit multiples before underwriting a
              price.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV011
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV004
              - CV010
              - CV014
              - CV015
              - CV016
      - number: '8.2'
        title: Thesis, anti-thesis, and comparable context
        blocks:
          - type: paragraph
            body: >-
              The thesis is that Leju may be entering public markets as commercialization accelerates: CNBC reported
              Morgan Stanley's 2026 forecast of 50,000 Chinese humanoid shipments and a USD 2 billion domestic market,
              while third-party coverage describes a manufacturing deployment involving 15 robots. The anti-thesis is
              that market enthusiasm is not company-level unit economics. Public price evidence for Kuavo is absent or
              inconsistent, the cited deployment performance is reported by a low-reputation AI-drafted article rather
              than a customer, and overseas expansion faces geopolitical and trade friction. UBTECH's October 2026
              market capitalization and AgiBot's historical private valuation are reference points, not direct
              multiples: their dates, liquidity, financial profiles, and security structures differ materially from
              Leju's prospective IPO.
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV008
              - CV009
              - CV010
              - CV012
              - CV013
      - number: '8.3'
        title: Bull, base, and bear cases
        blocks:
          - type: paragraph
            body: >-
              Because the entry price and fully diluted capitalization are unavailable, the scenarios are decision
              conditions rather than invented point valuations. The bull case requires prospectus-quality confirmation
              that Kuavo growth converts into repeat industrial demand, deployment reliability is customer-verified, and
              post-money dilution leaves an attractive return against a defensible exit multiple. The base case assumes
              continued revenue growth but persistent losses, opaque deployment economics, and a valuation that already
              discounts rapid sector expansion. The bear case combines commercialization slippage, continued cash
              consumption, public-comparable compression, and cross-border friction. Probability cannot be assigned
              responsibly from this pool; the observable signals instead define what must improve or deteriorate before
              capital is committed.
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV008
              - CV010
              - CV011
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV008
              - CV010
              - CV011
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Exit readiness, diligence asks, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              IPO acceptance and the proposed RMB 2.6 billion raise establish a plausible exit route, but acceptance is
              not pricing validation or proof of completion. Final diligence should obtain the current prospectus and
              regulator correspondence; reconcile pre- and post-money shares, options, convertibles, investor
              preferences, lockups, and use of proceeds; verify revenue quality, gross margin, working capital, cash
              balances, and operating cash flow; and secure customer-level evidence for repeat orders, uptime,
              intervention rates, warranty costs, and payback. The thesis breaks if industrial deployments fail to
              convert into repeat purchases, losses or operating cash outflow worsen despite scale, the IPO price
              implies a premium unsupported by audited growth and margins, or export and compliance constraints
              materially limit addressable demand.
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV007
              - CV011
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price is the gating variable
            body: >-
              Leju may be a credible company at an unattractive price. Without the IPO offer price, fully diluted
              ownership, preference stack, and prospectus-grade forecast bridge, public evidence supports continued
              diligence rather than a return claim.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV015
              - CV016
          - type: callout
            title: Do not equate sector forecasts with Leju economics
            body: >-
              A fast-growing China humanoid market can coexist with weak company-level margins, negative cash flow,
              deployment concentration, and multiple compression.
            calloutType: risk
            claimRefs:
              - CV004
              - CV008
              - CV010
              - CV011
