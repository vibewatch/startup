  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: >-
        CAC, sales cycle, channel fees, sales compensation, contribution margin, payback, repeat
        purchases, utilization, and service burden by customer and deployment type.
      whyItMatters: >-
        Without cohort-level economics, unit growth cannot be translated into scalable gross profit
        or cash payback.
      diligencePath: >-
        Obtain CRM cohort exports, signed-order and invoice data, costed bills of material, field
        service logs, and customer-level contribution-margin schedules.
      relatedQuestionRefs: [QI008]
      relatedTableRefs: [TI003]
    - type: missing-source
      severity: material
      topic: cost-structure
      missingEvidence: >-
        Audited COGS, gross margin, inventory turns, capex, warranty accruals, rework, installation,
        support, and working-capital data.
      whyItMatters: >-
        Hardware scale can consume cash even when unit deliveries grow, and public product pages do
        not quantify that exposure.
      diligencePath: >-
        Review audited financial statements, monthly management accounts, inventory aging,
        purchase commitments, warranty reserves, and SKU-level standard versus actual costs.
      relatedQuestionRefs: [QI005, QI008]
      relatedTableRefs: [TI003]
    - type: private-evidence-only
      severity: material
      topic: capital-adequacy
      missingEvidence: >-
        Current unrestricted cash, monthly burn, debt and project-finance obligations, committed
        capex, inventory funding, use of proceeds, downside runway, and next-round triggers.
      whyItMatters: >-
        Historical financing raised cannot determine current liquidity or the amount and timing of
        additional capital required.
      diligencePath: >-
        Reconcile financing proceeds to current cash, inspect debt and obligation schedules, and
        model monthly liquidity under base, delay, margin-compression, and downside cases.
      relatedQuestionRefs: [QI006, QI008]
      relatedTableRefs: [TI003]
