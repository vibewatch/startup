  - id: TI002
    title: Pricing and transaction benchmarks
    columns:
      - Source / product
      - Price or term
      - Basis
      - Limitation
    rows:
      - [Origin of Bots / KUAVO 4PRO, "$50,000–$150,000", "Estimated enterprise and research platform pricing", "Not an official quote or realized price"]
      - [Sourcebotics / KUAVO, "$38,000–$150,000; MOQ 1; 60–90 day lead time", "Sourcing-page configuration guidance", "Configuration, destination, support, and contract terms can change price"]
      - [Humanoid.Guide / KUAVO 5-W, "$80,000", "Directory listing", "No executed-order evidence or discount terms"]
      - [ui44 / Kuavo 5, "No numeric price; 0/1 listed available", "Database observation", "Active status does not establish purchase availability"]
    notes: >-
      Cross-source price observations are not normalized for configuration, geography, tax,
      accessories, integration, support, or contract date; no currency conversion is applied.
    claimRefs: [CI002, CI003, CI004, CI005, CI006, CI007, CI008]
  - id: TI003
    title: Unit economics and capital adequacy underwriting
    columns:
      - Metric
      - Public value / proxy
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - [Shipment traction, "32 units in 2024 and 577 in 2025 reported for KUAVO", Medium, "Shows reported volume growth but not revenue quality", "Reconcile orders, deliveries, acceptances, cancellations, and cash collections"]
      - [Industrial operating proxy, "15 robots; reported 98% success over 1,000 continuous hours", Medium, "Supports deployment maturity but not economic ROI", "Task-level throughput, human intervention, downtime, maintenance, and customer savings"]
      - [Gross margin and contribution margin, null, Low, "Core test of hardware scalability and service burden", "Audited COGS by SKU plus installation, warranty, support, and rework costs"]
      - [Capital adequacy, "Nearly CNY 1.5B / about $200M pre-IPO financing reported in 2025", Medium, "Funding raised does not establish current cash or runway", "Cash balance, monthly burn, debt, capex, inventory, obligations, and downside runway"]
    notes: >-
      Null means the metric was unavailable in the assigned public evidence, not zero; deployment
      performance and financing raised are proxies and are not accounting revenue, cash, or margin.
    claimRefs: [CI009, CI010, CI011, CI015]
figures:
  - id: FI001
    title: Publicly visible revenue-model bridge and missing gross-profit link
    type: flow
    summary: >-
      Public evidence reaches product configuration, indicative quotation terms, delivery, and
      deployment, but not recognized revenue or gross profit.
    data:
      nodes:
        - id: product-configuration
          label: Configured robot offering
          detail: KUAVO products are presented for research, education, industrial, and service scenarios.
        - id: price-indication
          label: External price indication
          value: "$38,000–$150,000"
          detail: The observed range comes from third-party directories and sourcing pages.
        - id: order-terms
          label: Order and lead-time terms
          value: "MOQ 1; 60–90 days"
          detail: Sourcebotics lists terms that remain configuration- and destination-dependent.
        - id: delivery
          label: Unit delivery
          value: "577 units reported for 2025"
          detail: Reported unit sales are not reconciled to acceptance, billing, or collections.
        - id: deployment
          label: Customer-site operation
          value: "15 robots; 98% over 1,000 hours"
          detail: The reported factory result is an operating proxy, not a unit-economics disclosure.
        - id: gross-profit
          label: Recognized revenue and gross profit
          value: Unavailable
          detail: ASP, discounts, COGS, warranty, support, and cash collection are not disclosed.
    approximationNotes: >-
      Ordered analytical flow only; it does not assert that the cited observations belong to one
      customer cohort or reconcile into a cumulative accounting bridge.
    claimRefs: [CI001, CI003, CI004, CI005, CI009, CI011, CI015, CI016]
callouts:
  - calloutType: risk
    title: Funding raised is not runway
    body: >-
      The reported 2025 pre-IPO financing does not establish current cash availability. Capital
      adequacy remains unquantified without cash, burn, debt, inventory, capex, and obligation data.
    claimRefs: [CI010, CI015]
  - calloutType: recommendation
    title: Gate underwriting on the accounting bridge
    body: >-
      Require invoice-to-cash reconciliation, gross margin by SKU and cohort, backlog conversion,
      warranty and field-service costs, customer concentration, and downside liquidity scenarios
      before assigning a revenue-quality or runway conclusion.
    claimRefs: [CI015, CI016]
