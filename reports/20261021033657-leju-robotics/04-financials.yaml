schemaVersion: "report-v2"
artifact: financials
slug: leju-robotics
runDate: 2026-10-21
company:
  name: Leju Robotics
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence indicates a quote-led hardware model with external price observations spanning
    roughly $38,000 to $150,000 and visible growth in KUAVO unit sales, but it does not disclose
    recognized revenue, gross margin, cash, burn, runway, or deployment-level unit economics.
    Reported financing therefore supports access to capital, not a conclusion on capital adequacy.
sections:
  - id: commercial-model-and-pricing
    title: Commercial model and pricing
    body: >-
      The visible commercial model is primarily configured robot sales rather than a disclosed
      subscription or usage-based model. RoboAtlas describes KUAVO configurations for research,
      education, industrial, and other deployment scenarios, while independent product directories
      show materially different price observations: Origin of Bots estimates $50,000–$150,000,
      Sourcebotics lists $38,000–$150,000, Humanoid.Guide lists $80,000 for KUAVO 5-W, and
      Humanoid Press cites about $50,000. These are third-party list or sourcing indications, not
      realized average selling prices, contracted consideration, or recognized revenue. Sourcebotics
      also lists a one-unit minimum order and a 60–90 day lead time, consistent with a
      configuration-and-quotation motion. No retained source discloses discounting, payment terms,
      service attach, warranty revenue, channel economics, or revenue-recognition policy.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI008, CI014, CI016]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-and-delivery-economics
    title: Traction and delivery economics
    body: >-
      Public traction is stronger at the unit and deployment level than at the accounting level.
      Origin of Bots reports that KUAVO sales increased from 32 units in 2024 to 577 in 2025, while
      RobotToday reports delivery of the hundredth full-size humanoid in 2025; the different scopes
      and issuer quality prevent treating those figures as a single reconciled shipment series.
      China Technology Review separately reports 15 humanoids operating on an automotive-parts
      loading line with a 98% success rate over 1,000 continuous hours. That deployment is a useful
      operating proof point, but it does not disclose contract value, labor substitution, uptime
      penalties, maintenance expense, utilization, or gross profit. The evidence therefore supports
      demand and technical-delivery proxies, not CAC payback or contribution margin.
    claimRefs: [CI009, CI011, CI012, CI015]
    tableRefs: [TI003]
  - id: capital-adequacy-and-cash-visibility
    title: Capital adequacy and cash visibility
    body: >-
      RoboAtlas reports a nearly CNY 1.5 billion, approximately $200 million, pre-IPO financing in
      October 2025. That amount is historical capital raised; it is not cash on hand, operating cash
      flow, or runway as of the report date. None of the retained financial evidence provides a
      balance-sheet cash figure, monthly or annual burn, debt balance, committed capex, inventory
      financing, planned use of proceeds, or a next-round trigger. Hardware production, inventory,
      integration, and support can create meaningful working-capital needs, but the available pages
      do not quantify them. Underwriting capital adequacy therefore requires management accounts,
      cash reconciliation from the financing close, debt schedules, inventory aging, committed
      purchase obligations, and a monthly liquidity plan.
    claimRefs: [CI010, CI015]
  - id: underwriting-verdict
    title: Underwriting verdict
    body: >-
      Revenue quality cannot yet be rated above preliminary. Multiple external price points and a
      quote-led ordering path indicate commercial intent, while shipment and factory-deployment
      reports indicate activity beyond laboratory demonstrations. However, ui44 records no numeric
      price and no available listing for its tracked model, and Behind Robotics labels KUAVO as a
      prototype; those signals caution against equating product visibility with repeatable,
      currently purchasable volume. The decisive missing bridge is from units and deployments to
      booked revenue, collections, warranty and service costs, and gross profit. Investment
      underwriting should remain conditional on audited revenue by product, backlog conversion,
      customer concentration, gross-margin cohorts, cash burn, and scenario-specific unit
      economics.
    claimRefs: [CI006, CI007, CI013, CI015, CI016]
