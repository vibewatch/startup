  topStrengths:
    - 据报道，2025 年收入达到 RMB 258 million（人民币 2.58 亿元）；KUAVO 销量增至 577 台，并成为主要收入来源。
    - KUAVO 覆盖科研、教育、商业服务和工业配置；近期报道显示，它已在实验室之外投入运行。
    - 据报道，公司融资基础较大，且创业板申请已获受理，为融资和潜在流动性提供了路径。
  topRisks:
    - Leju 2025 年仍在亏损，经营现金流为负，毛利率也有所下降；当前现金消耗和资本充足性尚不清楚。
    - 公开证据无法证明重复购买、留存、客户集中度或广泛的付费工业生产；工业制造仅占 2025 年 KUAVO 收入的 3.88%。
    - 留存证据尚未证明安全认证、事故记录、网络安全控制、知识产权实施自由、治理权利和完整的高管监督机制已经到位。
    - IPO 发行价、完全摊薄后的股本、证券条款和优先股堆叠均不可得，因此据报道的私募估值无法转化为可投资的回报情景。
  unresolvedGaps:
