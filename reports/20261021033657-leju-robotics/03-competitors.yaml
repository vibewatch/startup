      - ["Manipulation / payload", "5-W listing says 20 kg strength; base payload not published", "Higher payload described but not quantified in retained text", "Described for heavier industrial tasks; payload not retained", Unknown, "Configuration-level payload tests required"]
      - ["Software / ecosystem", "KaihongOS / OpenHarmony association and model integration", "No retained ecosystem detail", "No retained ecosystem detail", "Closed Tesla ecosystem reported", "Integration claims are not interoperability benchmarks"]
      - ["Commercial availability", "Variant-dependent: prototype, active, in-production and quoted lead-time labels coexist", "Reported shipping", "Reported enterprise-only", "Reported preorder", "Verify model, geography, support and delivery in a signed quote"]
      - ["Shared-space safety", "5-W listing says no collaborative safety certification published", Unknown, Unknown, Unknown, "No peer can be scored from current evidence"]
    notes: >-
      Cells reproduce or cautiously summarize retained source descriptors; unknown means the
      assigned evidence did not support the comparison, not that the capability is absent.
    claimRefs: [CP002, CP005, CP006, CP007, CP015, CP016]
  - id: TP003
    title: Public pricing and packaging comparison
    columns:
      - Product
      - Public price evidence
      - Availability label
      - Included capability context
      - Commercial unknowns
