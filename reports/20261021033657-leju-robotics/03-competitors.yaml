    rows:
      - ["Leju KUAVO base", "Official MSRP absent; unverified low-price discussion exists", "Pre-commercial in RobotOverflow", "Full-size research platform", "Configuration, support, warranty and actual transaction price", "Do not underwrite the rumored price"]
      - ["Leju KUAVO family", "USD 38,000-150,000 Sourcebotics range", "MOQ 1; 60-90 day lead time listed", "Variant and accessories unspecified", "Regional delivery and supplied configuration", "Range is sourcing guidance, not realized ASP"]
      - ["Leju KUAVO 5-W", "USD 80,000 on Humanoid.Guide", "In production", "Wheeled base, 40 DOF, six-hour listed runtime", "Certification, support and options", "Variant-specific listing cannot proxy base KUAVO"]
      - ["Unitree H1", "USD 90,000 in RobotOverflow comparison", "Reported shipping", "Faster movement and stronger actuation described", "Comparable support and configuration", "More visible reference price, but not quote-normalized"]
      - ["Fourier GR-2", "USD 150,000 in RobotOverflow comparison", "Enterprise-only", "Heavier industrial positioning described", "Contract, support and exact payload", "Premium positioning is not a performance benchmark"]
      - ["Tesla Optimus", "Undisclosed; approximately USD 20,000 target reported", "Preorder label in RobotOverflow", "Closed factory-oriented ecosystem", "Availability, configuration and realized price", "Target price is not purchasable market evidence"]
    notes: >-
      Public third-party indications only; prices refer to different variants and potentially
      different inclusions, while Leju's reported 2025 average selling price is not disclosed here.
    claimRefs: [CP003, CP004, CP010, CP015, CP016]
figures:
  - id: FP001
    title: Public-evidence commercialization positioning
    type: quadrant
    summary: >-
      Ordinal scores translate retained publication labels into a diligence map; they are not
      performance, affordability or market-share rankings.
    data:
      xAxis:
        label: Public price evidence clarity
        min: 1
        max: 3
      yAxis:
        label: Reported commercial availability
        min: 1
        max: 3
      points:
        - label: "KUAVO base"
          name: "KUAVO base"
          x: 1
          y: 1
          note: "Price undisclosed and pre-commercial in RobotOverflow."
        - label: "KUAVO family quote listing"
          name: "KUAVO family quote listing"
          x: 2
          y: 2
          note: "Wide sourcing range with MOQ and lead time, but variant unspecified."
        - label: "KUAVO 5-W"
          name: "KUAVO 5-W"
          x: 2
          y: 3
          note: "Numeric listing and in-production label on Humanoid.Guide."
        - label: "Unitree H1"
          name: "Unitree H1"
          x: 3
          y: 3
          note: "Numeric price and shipping label in RobotOverflow."
        - label: "Fourier GR-2"
          name: "Fourier GR-2"
          x: 3
          y: 2
          note: "Numeric price with enterprise-only availability."
        - label: "Tesla Optimus"
          name: "Tesla Optimus"
          x: 1
          y: 1
          note: "Undisclosed price with a reported target and preorder label."
    approximationNotes: >-
      Scores are analyst-coded from source words: price clarity 1=undisclosed or target,
      2=variant/range listing, 3=numeric model price; availability 1=prototype/pre-commercial or
      preorder, 2=enterprise-only or quoted lead time, 3=shipping or in production. Model and
      publisher differences limit comparability.
    claimRefs: [CP003, CP004, CP015, CP016]
