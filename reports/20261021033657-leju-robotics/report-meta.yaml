summary:
  headline: >-
    Leju shows credible product and shipment momentum, but weak primary disclosure, unproven repeat industrial demand,
    and unavailable IPO terms make further diligence necessary before investment.
  overallScore: 5.5
  recommendation: research-more
  confidence: medium
  riskRating: high
  valuationStance: stretched
