    headcount: null
  topStrengths:
    - >-
      Reported 2025 revenue reached RMB 258 million as KUAVO unit sales increased to 577 and the platform became the
      principal revenue line.
    - >-
      KUAVO spans research, education, commercial-service, and industrial configurations, with recent reports of
      operating deployments beyond the lab.
    - >-
      A large reported funding base and an accepted ChiNext application provide financing and potential liquidity
      pathways.
  topRisks:
    - >-
      Leju remained loss-making and operating-cash-flow negative in 2025 while gross margin declined, leaving current
      cash burn and capital adequacy unclear.
    - >-
      Public evidence does not establish repeat purchases, retention, customer concentration, or broad paid industrial
      production; industrial manufacturing represented only 3.88% of 2025 KUAVO revenue.
    - >-
      Safety certifications, incident history, cybersecurity controls, IP freedom-to-operate, governance rights, and
      complete executive oversight are not established by the retained evidence.
    - >-
      The IPO offer price, fully diluted capitalization, security terms, and preference stack are unavailable, so the
      reported private valuation cannot be translated into an investable return case.
  unresolvedGaps:
    - >-
      Current prospectus, audited financial statements, 2026 management accounts, cash balance, debt, burn, working
      capital, and downside runway.
    - >-
      IPO offer price, fully diluted share count, options, convertibles, preference stack, lockups, and pre- versus
      post-money ownership.
    - >-
      Customer-level revenue, concentration, active-unit, retention, repeat-order, utilization, contract-duration, and
      deployment-status cohorts.
    - >-
      SKU- and deployment-level gross margin, warranty, service burden, maintenance, contribution margin, and customer
      payback.
    - >-
      Product certifications, incident and near-miss history, cybersecurity and privacy controls, insurance, and IP
      freedom-to-operate documentation.
