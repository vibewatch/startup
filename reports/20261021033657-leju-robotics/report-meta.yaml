companyProfile:
  summary: >-
    Founded in Shenzhen in 2016, Leju Robotics is a privately held, pre-IPO robotics manufacturer led by founder Leng
    Xiaokun. Its KUAVO family spans bipedal, wheeled, and application-specific full-size humanoids, alongside smaller
    education-oriented platforms. Reported 2025 growth moved KUAVO beyond prototype-only activity, but public evidence
    still does not establish a diversified base of repeat industrial customers or durable unit economics.
