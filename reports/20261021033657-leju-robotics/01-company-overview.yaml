company:
  name: "Leju Robotics"
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    Leju Robotics is a Shenzhen humanoid-robot manufacturer founded in 2016 whose
    KUAVO platform has moved from product launch into reported commercial shipments.
    Third-party reporting indicates rapid 2025 revenue growth and a May 2026 ChiNext
    application, but declining gross margin, continuing losses, and thin public
    governance and customer disclosure materially limit confidence in the scale story.
sections:
  - id: "identity-and-operating-model"
    title: "Identity and operating model"
    body: >-
      Leju Robotics was founded in Shenzhen in 2016 by Leng Xiaokun with partners
      from the Harbin Institute of Technology Robot Club. The retained evidence
      describes a privately held, B2B manufacturer whose revenue model is primarily
      product sales. KUAVO is the central full-size humanoid platform, with bipedal,
      wheeled, and application-oriented variants aimed at industrial tasks, research,
      education, and service settings. RobotToday dates the KUAVO unveiling to
      December 2023, while two supplier-oriented profiles report that the company
      delivered its hundredth full-size humanoid during 2025. These profiles help
      establish product identity and milestones, but they are not independent proof
      of customer acceptance or realized deployment economics.
    claimRefs: ["CO001", "CO002", "CO003", "CO004", "CO005"]
  - id: "financing-and-scale"
    title: "Financing, scale, and IPO posture"
    body: >-
      The strongest current financial narrative comes from 36Kr's authorized
      republication of IT Juzi analysis. It reports revenue rising from RMB 54
      million in 2023 to RMB 258 million in 2025, with 577 KUAVO units contributing
      about RMB 178 million, or nearly 70% of the 2025 total. Growth did not eliminate
      financial pressure: the same source reports more than RMB 170 million of
      cumulative net loss over three years and a gross-margin decline from 50.45% to
      40.78%. Multiples reports USD 248 million raised across three rounded funding
      rounds. These currencies are not converted or combined, and neither funding
      raised nor a planned IPO raise should be treated as cash available.
    claimRefs: ["CO006", "CO007", "CO008", "CO009", "CO010", "CO011"]
    tableRefs: ["TO001"]
  - id: "leadership-and-governance"
    title: "Leadership and governance visibility"
    body: >-
      Public leadership evidence in the assigned pool is notably sparse. Leng
      Xiaokun is identified as founder and legal representative, and 36Kr says he
      founded the company with partners from the Harbin Institute of Technology
      Robot Club. The retained sources do not name those partners, a broader
      executive team, directors, board committees, or control rights. This creates
      a key-person and governance diligence issue rather than evidence that such
      structures do not exist. A complete management roster, capitalization table,
      related-party register, and board materials are required to assess succession,
      investor influence, and decision rights ahead of any financing decision.
    claimRefs: ["CO001", "CO012"]
    tableRefs: ["TO002"]
  - id: "stakeholders-and-verification-priorities"
    title: "Stakeholders and verification priorities"
    body: >-
      The financing roster spans strategic, state-linked, industrial, and financial
      investors, while 36Kr reports that Leju had made 13 external investments by
      August 2026. That ecosystem could strengthen component access, data, and
      deployment channels, but the same analysis says most investees were early
      stage and had not produced quantified collaborative revenue. Current scale
      disclosures also remain uneven: a supplier directory lists 500-1,000
      employees without official corroboration, commercial directories disagree in
      the completeness of price and availability data, and an October 2026 article
      reports an automotive deployment without naming the customer. The immediate
      diligence priority is therefore primary documentation, not extrapolation from
      directory claims.
    claimRefs: ["CO013", "CO014", "CO015", "CO016"]
    tableRefs: ["TO003"]
    figureRefs: ["FO001"]
