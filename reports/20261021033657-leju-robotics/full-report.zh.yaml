            body: >-
              Leju 披露的 2025 年 Kuavo 收入构成对应四类买方场景，而非一个成熟终端市场。数据采集中心占 Kuavo 收入 45%，科研和教育占 32.5%，商业服务占 18.7%，工业制造仅占
