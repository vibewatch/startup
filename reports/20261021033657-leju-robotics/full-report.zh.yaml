      - number: '5.2'
        title: 差异化逻辑在于机体、控制与学习的垂直整合
        blocks:
          - type: paragraph
            body: >-
              现有描述指向一套集成架构，而非单独的机器人外壳。物理层包括高扭矩关节模组、双足运动和轮式替代方案；感知与导航层包括深度相机、LiDAR、多模态感知、避障和 3D SLAM。更上层的资料提到源自
              OpenHarmony 的 KaihongOS、实时控制和大模型集成。最具战略意义的是据报道的遥操作到模仿学习流水线：操作员采集任务数据，GPU
              基础设施训练技能，再把训练包回传机器人。如果按配置的接口和训练经济性得到验证，这套栈可能缩短跨任务适配时间。但现有证据没有拆分哪些组件是自有、已量产、向客户开放，或依赖 Huawei、NVIDIA 等外部供应商。
