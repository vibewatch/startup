      - number: '1.4'
        title: 利益相关方与核验重点
        blocks:
          - type: paragraph
            body: >-
              融资名单覆盖战略、国资关联、产业和财务投资者；36Kr 称截至 2026 年 8 月，Leju 已对外投资 13
              次。这个生态可能增强零部件获取、数据和部署渠道，但同一分析称多数被投企业仍处早期，尚未产生量化的协同收入。当前规模披露也不均衡：供应商目录列出 500-1,000
              名员工但无官方佐证；商业目录对价格和供货信息的完整程度说法不一；2026 年 10 月一篇文章提到汽车部署，却未披露客户名称。因此，眼下应优先取得一手文件，而不是从目录说法外推。
