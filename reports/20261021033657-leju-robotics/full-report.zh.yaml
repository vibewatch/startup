chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与经营模式
        blocks:
          - type: paragraph
            body: >-
              Leju Robotics 由 Leng Xiaokun 与哈尔滨工业大学机器人俱乐部相关人士于 2016 年在深圳创办。现有证据将其描述为一家私营 B2B 制造商，收入主要来自产品销售。KUAVO
              是核心全尺寸人形机器人平台，提供双足、轮式和面向具体应用的版本，用于工业任务、科研、教育和服务场景。RobotToday 将 KUAVO 的首次亮相时间记为 2023 年 12 月；两份面向供应商的资料称，公司在
              2025 年交付了第 100 台全尺寸人形机器人。这些资料能证明产品身份和里程碑，但不能独立证明客户验收或实际部署经济性。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
      - number: '1.2'
        title: 融资、规模与 IPO 状态
        blocks:
          - type: paragraph
            body: >-
              当前最有力的财务叙事来自 36Kr 经授权转载的 IT Juzi 分析：收入从 2023 年的 RMB 54 million（5400 万元人民币）升至 2025 年的 RMB 258 million（2.58
              亿元人民币），其中 577 台 KUAVO 贡献约 RMB 178 million（1.78 亿元人民币），占 2025 年总额近 70%。增长没有消除财务压力：同一来源称三年累计净亏损超过 RMB 170
              million（1.7 亿元人民币），毛利率从 50.45% 降至 40.78%。Multiples 报道三轮融资合计 USD 248 million（2.48 亿美元）。这些币种不换算、不合并；已募资金或计划
              IPO 募资都不应视为可用现金。
