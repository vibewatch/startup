            body: >-
              Leju 并非只做封闭式开发：The Robot Report 记录 KUAVO 参加 Automation World 2026，Humanoid Index
              将公司标为商业化。其他资料描述其面向制造、物流、科研、零售和服务的用途，一份采购目录列出宽泛报价区间和 60-90
              天交付期。这些是进入市场的迹象，不是可重复量产经济性或现场可靠性的证明。同一证据池存在成熟度冲突：BehindRobotics 将 KUAVO 标为原型，ui44
              则称当前没有可购买列表。没有来源提供按配置的订单历史、验收测试、平均故障间隔、支持响应时间、保修准备金、升级政策或带日期路线图。在 Leju
              用签署订单和车队记录调和这些外部标签前，投资判断应将当前成熟度视为依配置而定。
            claimRefs:
