      - number: '4.2'
        title: 牵引力与交付经济性
        blocks:
          - type: paragraph
            body: >-
              从出货量和部署看，公开牵引力强于会计表现。Origin of Bots 称 KUAVO 销量从 2024 年的 32 台增至 2025 年的 577 台，RobotToday 则称 2025 年交付了第 100
              台全尺寸人形机器人；两者口径和发布方质量不同，不能视为同一条已核对的出货序列。China Technology Review 另称 15 台人形机器人运行在汽车零部件装载线上，连续 1,000 小时成功率为
              98%。这项部署是有用的运营验证点，但没有披露合同价值、劳动力替代、停机罚则、维护费用、利用率或毛利。因此，证据支持需求和技术交付代理指标，不支持 CAC 回本期或贡献毛利判断。
            claimRefs:
              - CI009
              - CI011
              - CI012
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI015
      - number: '4.3'
        title: 资本充足性与现金透明度
        blocks:
          - type: paragraph
            body: >-
              RoboAtlas 报道 2025 年 10 月完成近 CNY 1.5 billion、约 $200 million 的 IPO
              前融资。该金额是历史募资额，不是报告日的手头现金、经营现金流或现金跑道。保留的财务证据没有提供资产负债表现金、月度或年度消耗、债务余额、已承诺资本开支、库存融资、募资用途或下一轮融资触发条件。硬件生产、库存、集成和支持可能带来显著营运资金需求，但现有页面没有量化。因此，判断资本充足性需要管理账目、融资交割现金核对、债务明细、库存账龄、已承诺采购义务和月度流动性计划。
            claimRefs:
              - CI010
              - CI015
      - number: '4.4'
        title: 投资判断
        blocks:
          - type: paragraph
            body: >-
              收入质量尚不能高于初步评级。多个外部价格点和报价驱动的订购路径显示出商业意图，出货和工厂部署报道也表明活动已超出实验室演示。但 ui44 没有记录数字价格或当前可供购买的列表，Behind Robotics 将
              KUAVO
              标为原型；因此不能把产品曝光等同于可重复、当前可采购的销量。关键缺口是把出货和部署连接到确认收入、回款、保修和服务成本以及毛利。投资判断仍应以按产品审计的收入、积压订单转化、客户集中度、毛利率队列、现金消耗和情景单位经济性为条件。
            claimRefs:
              - CI006
              - CI007
              - CI013
              - CI015
              - CI016
      - number: '4.5'
        title: 展示
        blocks:
          - type: callout
            title: 募资额不等于现金跑道
            body: 已披露的 2025 年 IPO 前融资不能证明当前现金可用性。没有现金、消耗、债务、库存、资本开支和义务数据，资本充足性仍无法量化。
            calloutType: risk
            claimRefs:
              - CI010
              - CI015
          - type: callout
            title: 以会计桥接数据作为投资判断门槛
            body: 在判断收入质量或现金跑道前，必须取得发票到现金的核对、按 SKU 和队列划分的毛利率、积压订单转化、保修和现场服务成本、客户集中度以及下行流动性情景。
            calloutType: recommendation
            claimRefs:
              - CI015
              - CI016
  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合广度可见，但供货情况不明
        blocks:
          - type: paragraph
            body: >-
              对外可见的产品组合不止一款行走演示机。多个专业目录将 KUAVO 列为 Leju 的全尺寸人形系列，涵盖双足和轮式配置；供应商资料还描述了 AELOS 教育机器人和更小的 PANDO
              编程产品线。不同配置对应不同工作流：双足 KUAVO 面向具身 AI 研究和任务开发；KUAVO 5-W 用全向底盘替代双腿，适合更长时间的工业或服务移动；AELOS
              面向编程教学和竞赛。但产品广度不等于可购买性。ui44 只跟踪到一条活跃 KUAVO 记录，没有可供购买列表或数字价格，BehindRobotics
              则称该系列为原型。因此，产品尽调需要把配置清单与可订购性、支持任务、保修和部署验收标准绑定，而不是采用混合的系列级规格。
