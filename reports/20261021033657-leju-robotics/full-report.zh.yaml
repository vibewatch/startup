  - id: TV002
    title: 正论与反论
    columns:
      - 观察视角
      - 基于证据的论点
      - 哪些变化会改变判断
    rows:
      - - 正论
        - Leju 报道 2025 年收入快速增长，且 Kuavo 已成为其主要收入线。
        - 经审计的 2026 年业绩若显示工业复购订单增加、利润率改善、现金消耗下降，将强化这一论点。
      - - 市场支撑
        - Morgan Stanley 预测中国人形机器人商业化提速，2026 年对外出货量达到 50,000 台。
        - 若预测大幅下调，或证据显示出货仍停留在试用机阶段，市场支撑就会减弱。
      - - 反论
        - 公司 2025 年仍处于亏损状态，经营现金流为负。
        - 若经营现金流持续为正，且披露单位经济效益，这一担忧会缓解。
      - - 价格挑战
        - 公开渠道没有 Kuavo 的产品价格观察，或第三方来源给出的价格约为 38,000 至 150,000 美元。
        - 将制造商报价与配置、毛利率、保修和服务经济性关联起来，才能具备可比性。
      - - 可比公司挑战
        - UBTECH 和 AgiBot 可提供规模参照，但在流动性、成立时间、证券结构和经营画像上存在差异。
        - 基于招股书、统一收入、毛利和完全摊薄股权价值口径搭建可比公司桥接，将提高可比性。
    notes: 第三方产品价格仅具指示性，且取决于配置，并非经核实的成交价格；可比公司数据采用不同日期和资本结构。
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV008
      - CV009
      - CV010
      - CV012
      - CV013
  - id: TV003
    title: 牛市、基准和熊市情景条件
    columns:
      - 情景
      - 必要假设
      - 估值 / 回报逻辑
      - 下行触发因素或概率信号
    rows:
      - - 牛市
        - 复购工业订单、客户验证的可靠性、毛利率改善，以及清晰的证券结构。
        - 只有 IPO 价格在稀释后仍为相对同业调整的退出价值留下上行空间时，判断才有支撑。
        - 经审计的增长、经营现金流流出下降，以及客户层面的复购订单证据。
      - - 基准
        - 增长延续，但亏损和部署经济性的透明度不足仍在。
        - 不给出区间；需为执行、低流动性和定价证据不完整计入折价。
        - 收入扩大，但经营现金流仍为负，且部署情况仍缺乏充分验证。
      - - 熊市
        - 商业化放缓、公开市场机器人估值倍数收缩，或地缘政治限制阻碍扩张。
        - 若激进的 IPO 估值遇上更弱增长或进一步稀释，资本损失并非不可能。
        - 错过部署里程碑、现金使用恶化、下轮融资条款不利，或出口 / 合规限制。
    notes: 这些是定性投资判断条件，而非按概率加权的估值；缺少报价、股份数量、优先权条款和预测财务数据，无法输出数值化情景。
    claimRefs:
      - CV004
      - CV008
      - CV010
      - CV011
      - CV014
      - CV015
      - CV016
