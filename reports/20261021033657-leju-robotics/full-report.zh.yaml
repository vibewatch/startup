  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 排名后的剩余风险视图
        blocks:
          - type: paragraph
            body: >-
              最高优先级风险是工业可靠性和产品安全准备度，其次是商业化集中、制造规模化和战略技术依赖。2026 年 10 月 16 日文章称 15 台机器人在汽车零部件装载线上运行，连续 1,000 小时成功率为
              98%；这是有意义的新证据，但仍是一篇由 AI
              起草、人工审核的单一报道，而不是客户签发的验收记录。独立资料仍将该平台描述为原型，或强调运营规格缺失。因此，投资者应把该试验视为积极信号，而非车队级可靠性、认证安全或有吸引力的总拥有成本证明。只有当具名客户公布可重复的运行时间、人工干预、缺陷、安全和续约数据后，论点才会增强。
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR007
              - CR008
              - CR013
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR003
              - CR004
              - CR011
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.2'
        title: 监管、法律与安全暴露
        blocks:
          - type: paragraph
            body: >-
              指定公开证据中没有监管申报、法院记录、认证登记、隐私政策、安全审计、召回通知或事故日志。这是证据缺口，不证明不存在问题。随着 Leju
              从受监督的研究场景进入工厂或海外市场，机械安全、工作场所责任、网络安全、数据治理、无线电许可、出口管制和保险条款都可能成为部署门槛。高信誉新闻来源还将地缘政治不确定性和贸易紧张列为中国机器人公司海外发展的主要阻力。在判断国际或安全敏感收入前，应取得逐司法辖区认证矩阵、产品责任保险、事故和险情日志、SBOM、渗透测试结果、数据流文件以及
              IP 自由实施意见。
            claimRefs:
              - CR007
              - CR014
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR007
              - CR014
              - CR016
      - number: '7.3'
        title: 运营、质量与财务模型风险
        blocks:
          - type: paragraph
            body: >-
              Leju 仍面临典型的硬件规模化问题：已披露需求和名义产能可能增长得比良率、现场可靠性、服务能力和营运资金更快。一份独立分析称，Leju 2025 年收入为 CNY 258 million，净亏损 CNY
              69.78 million； 零部件采购资料称新装配厂设计年产能最高 10,000 台，并引用 30
              分钟节拍。这些数字体现的是雄心，盈利吞吐量尚未得到证明。零部件分配和生命周期末端风险增加排期与重新设计风险，公开价格信号也不一致：一个数据库没有官方 MSRP，商业采购页面则列出 USD
              38,000-150,000 的宽区间。止损标准应关注亏损扩大、保修索赔增加、生产良率疲弱，或无法在客户记录中复现的试验表现。
            claimRefs:
              - CR001
              - CR006
              - CR009
              - CR011
              - CR012
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR005
              - CR007
              - CR011
              - CR012
      - number: '7.4'
        title: 伙伴、平台与集中度依赖
        blocks:
          - type: paragraph
            body: >-
              公开资料指向三类集中度依赖。第一，保留分析称客户仍集中在科研、教育和数据采集，工业转型可能依赖少数试点。第二，Schaeffler
              是可信的技术伙伴，但此处审阅的公开记录证明的是联合开发关系，而非量产收入或客户验收。第三，KUAVO 与 OpenHarmony/Huawei
              的对齐在中国具有战略价值，却把软件生态的关键层绑定到另一家公司路线图，也可能使部分海外采购复杂化。与此同时，Morgan Stanley
              大幅上调的中国出货预测，意味着竞争供给基础增长更快。缓释风险需要披露收入集中度、签署量产合同、可移植接口、合格替代零部件和客户验证的经济性，而不是更多合作公告。
