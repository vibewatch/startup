          detail: 观察到的价格区间来自第三方目录和采购页面。
        - id: order-terms
          label: 订单与交付周期条款
          value: MOQ 1; 60–90 days
          detail: Sourcebotics 列出的条款仍取决于配置和目的地。
        - id: delivery
          label: 设备交付
          value: 577 units reported for 2025
          detail: 已报道的设备销售尚未与验收、开票或回款核对。
        - id: deployment
          label: 客户现场运行
          value: 15 robots; 98% over 1,000 hours
          detail: 已报道的工厂结果是运营代理指标，不是单位经济性披露。
        - id: gross-profit
          label: 确认收入和毛利
          value: Unavailable
          detail: ASP、折扣、COGS、保修、支持和现金回收均未披露。
    approximationNotes: 这只是有序的分析流程；并不声称所引用的观察属于同一客户群，也没有将其核对为累计会计桥接。
    claimRefs:
      - CI001
      - CI003
      - CI004
      - CI005
      - CI009
      - CI011
      - CI015
      - CI016
  - id: FE001
    title: 已报道的 KUAVO 产品架构栈
    type: stack
    summary: 已报道的架构栈把客户工作流连接到已部署的技能包、数据采集、算力与控制、感知和物理平台。
    data:
      layers:
        - label: 客户工作流
          modules:
            - label: 工业与物流任务
              detail: 资料描述了移动操作和物料搬运用例。
            - label: 研究、教育与服务
              detail: 资料描述了具身 AI 开发、教学和访客互动。
        - label: 任务技能与应用
          modules:
            - label: 已部署技能包
              detail: 据报道，学习到的行为训练后会回传到机器人。
            - label: 大模型集成
              detail: KUAVO 5-W 列出了 Huawei Pangu 和 Doubao 集成。
        - label: 学习与数据管线
          modules:
            - label: VR 远程操作
              detail: 据报道，操作员采集真实世界演示数据。
            - label: GPU 训练
              detail: 据报道，模仿学习模型在机器人之外完成训练。
        - label: 控制与算力
          modules:
            - label: KaihongOS / OpenHarmony
              detail: 来源称其运行环境基于 OpenHarmony。
            - label: 边缘算力
              detail: 5-W 列出了工业计算机和 NVIDIA 边缘模块。
        - label: 感知与导航
          modules:
            - label: 深度相机与 LiDAR
              detail: 传感器支持环境感知和建图。
            - label: 3D SLAM 与传感器融合
              detail: 据报道支持导航和多模态感知。
        - label: 物理机器人
          modules:
            - label: 双足 KUAVO
              detail: 腿式配置面向研究和应用任务开发。
            - label: 轮式 KUAVO 5-W
              detail: 全向底盘以稳定性和续航换取腿式移动能力。
    approximationNotes: 这是有证据支持的概念性架构栈，不是经过验证的物料清单、接口图、网络安全边界或供货配置。
    claimRefs:
      - CE010
      - CE011
      - CE015
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 不同买方触点从机构准入推进到部署证明，但续约和扩张仍未得到验证。
    data:
      items:
        - label: 教育切入
          detail: Aelos 和 Roban 建立了机构采购与培训关系。
          touchpoints:
            - 学校或大学采购
            - 编程课程
            - 售后支持
        - label: 研究平台
          detail: 大学和实验室使用人形机器人开展具身 AI 研究。
          touchpoints:
            - 研究评估
            - 机器人集成
            - 实验使用
        - label: 数据采集
          detail: 数据中心买方是 2025 年披露的 Kuavo 收入用途中最大的一类。
          touchpoints:
            - 购买机器人
            - 远程操作
            - 采集真实世界数据
        - label: 商业服务
          detail: 资料将引导和互动推广至展览、零售、银行及公共场所。
          touchpoints:
            - 现场试用
            - 访客引导
            - 服务运营
        - label: 工业 POC
          detail: 点名的 FAW 案例是用于搬运和拣选的概念验证。
          touchpoints:
            - 选择工作流
            - POC 部署
            - 可靠性验证
        - label: 扩张决策
          detail: 量产铺开、复购订单、续约和集中度均未披露。
          touchpoints:
            - 商业验收
            - 机队扩张
            - 续约或再次订购
    approximationNotes: 仅为概念性证据地图；项目顺序不代表普遍适用的漏斗、转化率、持续时间或按价值比例缩放的规模。
    claimRefs:
      - CU003
      - CU007
      - CU008
      - CU009
      - CU014
      - CU016
  - id: FR001
    title: 剩余风险热力图与缓解视角
    type: matrix
    summary: 截至运行日期，按影响、基于证据的可能性、缓解成熟度和剩余敞口，对六项影响核心论点的关键风险进行排序。
    data:
      columns:
        - 影响
        - 可能性信号
        - 缓解成熟度
        - 剩余敞口
      rows:
        - label: 工业安全与认证
          values:
            - label: 高
              detail: 工厂验收和伤害责任可能成为部署门槛。
            - label: Unknown
              detail: 未分配主要认证或事故记录。
            - label: 尚无证据
            - label: 高
        - label: 机队可靠性与质量
          values:
            - label: 高
            - label: 中
              detail: 最近一次已报道试验结果积极，但缺乏客户出具的佐证。
            - label: 起步阶段
            - label: 高
        - label: 工业转化与客户集中度
          values:
            - label: 高
            - label: 中高
              detail: 研究和教育仍是公开描述最清晰的客户基础。
            - label: 早期
            - label: 高
        - label: 制造与零部件放量
          values:
            - label: 高
            - label: 中
              detail: 已报道设计产能和品类短缺；实际良率未披露。
            - label: 已规划
            - label: 高
        - label: Huawei / OpenHarmony 依赖
          values:
            - label: 中高
            - label: 中
            - label: 部分
              detail: 存在生态对齐，但缺少可移植性证据。
            - label: 中高
        - label: 地缘政治与海外采购
          values:
            - label: 高
            - label: 中
              detail: 品类层面的报道将贸易紧张列为重大阻力。
            - label: 对 Leju 未知
            - label: 中高
    approximationNotes: 序数标签是分析师的风险判断，不是测量得到的概率；“未知”表示指定来源池缺少对该维度打分所需的主要证据。
    claimRefs:
      - CR003
      - CR004
      - CR011
      - CR013
      - CR014
      - CR015
      - CR016
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 证据从市场机会，经公司验证和未解决的价格输入，最终指向“需要进一步研究”的决定。
    data:
      nodes:
        - id: market
          label: 市场顺风
          detail: Morgan Stanley 预测 2026 年中国人形机器人出货量为 50,000 台，市场规模为 USD 2 billion。
        - id: growth
          label: 公司增长
          detail: 基于招股书的报道显示，2025 年收入为 RMB 258 million（2.58 亿元人民币），Kuavo 是主要收入线。
        - id: proof
          label: 商业证明
          detail: 一项已报道的工业部署颇具潜力，但指定证据中缺少客户出具的验证。
        - id: economics
          label: 经济性缺口
          detail: Leju 2025 年仍处于亏损状态，经营现金流为负。
        - id: price
          label: 价格缺口
          detail: 报价、完全摊薄资本结构、优先权以及一致的产品价格均无法取得。
        - id: decision
          label: 需要进一步研究
          detail: 在取得定价和主要尽调证据前，风险高且估值偏高或缺乏支撑。
    approximationNotes: 该流程是定性且有序的；不分配概率、转化率或数值化估值权重。
    claimRefs:
      - CV002
      - CV004
      - CV010
      - CV014
      - CV015
      - CV016
