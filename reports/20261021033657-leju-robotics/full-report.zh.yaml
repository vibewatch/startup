  summary: >-
    Leju Robotics 2016 年在深圳成立，是一家由创始人 Leng Xiaokun 领导、尚未 IPO 的私营机器人制造商。KUAVO 系列覆盖双足、轮式和应用专用的全尺寸人形机器人，另有面向教育的较小平台。已披露的
    2025 年增长显示 KUAVO 已不再只是原型产品，但公开证据仍不足以证明其拥有多元化的工业复购客户基础或可持续的单位经济性。
