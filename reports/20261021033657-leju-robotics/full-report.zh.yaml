            body: >-
              公开证据无法证明毛收入或净收入留存、流失、续约率、合同期限、复购行为、满意度、头部客户集中度或渠道经济性。Leju
              在教育时期建立的直销和非直销网络，可能降低机构买方的触达和服务摩擦，但渠道复用不证明全尺寸部署会续约或扩张。已披露的场景集中度也很重要：2025 年 Kuavo 收入的 45% 来自数据采集，工业占比仅
