      - number: '7.5'
        title: 展示
        blocks:
          - type: callout
            title: 试验指标尚未成为投资判断指标
            body: 已披露的 1,000 小时 98% 成功率显著改善了证据基础，但文章没有提供任务分类、干预频率、分母处理、安全事件、客户验收标准或经济性。在把该报道转化为车队可靠性假设前，必须补齐这些字段。
            calloutType: risk
            claimRefs:
              - CR004
              - CR005
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 决策与价格纪律
        blocks:
          - type: paragraph
            body: >-
              建议是继续研究，而不是买入。根据 IPO 招股书整理的独立报道，Leju 最新投后估值为 RMB 4.327 billion（43.27 亿元人民币），拟 IPO 募资 RMB 2.6 billion（26
              亿元人民币）；但指定证据没有发行价、完全摊薄股数、优先股堆叠或申报原文。在没有这些信息的情况下，计算目标回报、持有期和估值区间会制造虚假精确。经营层面有积极证据：2025 年收入达到 RMB 258
              million（2.58 亿元人民币），Kuavo 产品线成为主要收入驱动。但同一证据也报告 2025 年净亏损和经营现金流为负。因此，在判断价格前，需要审计级招股书核对、证券条款、稀释情况和情景化退出倍数。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV011
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV004
              - CV010
              - CV014
              - CV015
              - CV016
      - number: '8.2'
        title: 正向论点、反向论点与可比背景
        blocks:
          - type: paragraph
            body: >-
              正向论点是，随着商业化加速，Leju 可能正在进入公开市场：CNBC 报道 Morgan Stanley 预测 2026 年中国人形机器人出货 50,000 台、国内市场规模 USD 2
              billion；第三方报道还描述了一项涉及 15 台机器人的制造部署。反向论点是，市场热情不等于公司层面的单位经济性。Kuavo 的公开价格证据缺失或不一致，所引部署表现来自信誉较低、由 AI
              起草的文章而非客户，海外扩张还面临地缘政治和贸易摩擦。UBTECH 2026 年 10 月市值和 AgiBot 历史私募估值只能作参考，不能直接用作倍数：它们的日期、流动性、财务状况和证券结构与 Leju
              计划中的 IPO 有明显差异。
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV008
              - CV009
              - CV010
              - CV012
              - CV013
      - number: '8.3'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              由于入场价和完全摊薄资本结构不可得，这些情景是决策条件，不是臆造的点估值。乐观情景要求以招股书级证据确认 Kuavo
              增长能转化为工业复购需求、部署可靠性经客户验证，并且投后稀释后相对于有依据的退出倍数仍有吸引力回报。基准情景假设收入继续增长但亏损持续、部署经济性不透明，且估值已经计入行业快速扩张。悲观情景包括商业化延迟、现金持续消耗、公开可比估值压缩和跨境摩擦。根据当前证据池无法负责任地赋予概率；可观察信号只能界定投入资本前必须改善或恶化的事项。
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV008
              - CV010
              - CV011
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV008
              - CV010
              - CV011
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: 退出准备、尽调要求与论点失效触发器
        blocks:
          - type: paragraph
            body: >-
              IPO 申请获受理和拟募资 RMB 2.6 billion（26
              亿元人民币）构成一条可行退出路径，但获受理不等于定价得到验证，也不证明交易完成。最终尽调应取得当前招股书和监管往来文件；核对投前与投后股数、期权、可转债、投资者优先权、锁定期和募资用途；核实收入质量、毛利率、营运资金、现金余额和经营现金流；并取得客户层面的复购订单、运行时间、干预率、保修成本和回本证据。如果工业部署无法转化为复购、规模扩大仍伴随亏损或经营现金流出恶化、IPO
              价格相对经审计增长和利润率形成无依据溢价，或出口与合规限制明显压缩可服务需求，论点就会失效。
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV007
              - CV011
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: 展示
        blocks:
          - type: callout
            title: 价格是门槛变量
            body: Leju 可能是一家可信公司，但价格并不吸引人。没有 IPO 发行价、完全摊薄所有权、优先股堆叠和招股书级预测桥接，公开证据只能支持继续尽调，不能支持回报主张。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV015
              - CV016
          - type: callout
            title: 不要把行业预测等同于 Leju 的经济性
            body: 中国人形机器人市场快速增长，也可能与公司层面利润率疲弱、现金流为负、部署集中和估值倍数压缩同时存在。
            calloutType: risk
            claimRefs:
              - CV004
              - CV008
              - CV010
              - CV011
