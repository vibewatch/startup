        title: 领导层与治理透明度
        blocks:
          - type: paragraph
            body: >-
              指定证据中的公开领导层信息明显稀缺。Leng Xiaokun 被列为创始人和法定代表人，36Kr
              称他与哈尔滨工业大学机器人俱乐部成员共同创办公司。保留来源没有列出这些伙伴、更完整的管理团队、董事、董事会委员会或控制权。这构成关键人物和治理尽调问题，而不是这些架构不存在的证据。在任何融资决策前，需要完整的管理层名单、股权表、关联方登记册和董事会材料，以评估继任、投资者影响力和决策权。
