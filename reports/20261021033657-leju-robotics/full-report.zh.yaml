  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              Leju 所处的是分层机器人市场，而不是单一的人形机器人 TAM。核心业务是面向工业、商业服务、科研和具身 AI
              工作流销售全尺寸人形平台；教育机器人和编程玩具属于相邻品类，用户、预算和性能要求不同。市场边界应包括与 Leju 平台一同采购的硬件、任务集成、部署支持和开发者工具，但不包括传统固定自动化、独立 AI
              软件、未对外销售的原型以及广义消费玩具。固定工业自动化、专用移动机器人、人力和继续试点都是替代方案。把这些类别合并会夸大 Leju 可直接服务的需求。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
              - CM015
      - number: '2.2'
        title: 受证据约束的市场规模
        blocks:
          - type: paragraph
            body: >-
              保留的最强规模证据是 CNBC 报道的 Morgan Stanley 中国对外销售预测：2026 年人形机器人出货 50,000 台、市场规模 20 亿美元；到 2030 年升至 446,000 台和 150
              亿美元。两个美元端点意味着四年约 65.5% 的年化增长，但这是推导值，不是公布的 CAGR。预测排除原型、预订试用和内部使用生产，因此比 headline 产量更窄，也更适合投资分析。Omdia 估计 2025
              年全球出货约 13,000 台，提供另一历史出货量口径，并非可直接比较的美元分母。没有来源将中国预测分配给 Leju，也没有披露 Leju 可获得的份额，因此公司层面的 SAM 和 SOM 仍未量化。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM010
              - CM015
              - CM016
      - number: '2.3'
        title: 买方、用户、付费方与采用路径
        blocks:
          - type: paragraph
            body: >-
              各细分市场的采用路径并不相同。工业制造商和物流运营商可能为搬运或生产任务买单，工厂自动化团队和一线操作员则是使用者。商业服务部署覆盖展会、零售、银行和引导场景，资金可能来自运营或客户体验预算。大学、实验室和学校为开发者、教师和学生购买科研或教育平台。Sacra
              称工业销售依靠直接企业关系、试点和系统集成商参与，教育销售则依靠分销网络。由此可见，技术匹配只是起点；买方还要承担集成、工作流设计、安全审查、培训和维护成本。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM015
      - number: '2.4'
        title: 增长驱动、约束与估值意义
        blocks:
          - type: paragraph
            body: >-
              保留的独立报道将商业验证、政策支持和供应链反馈列为行业主要加速因素。中国制造商正进入工厂、物流、零售和服务场景，政策支持也降低融资和运营摩擦。但市场时点仍不确定，海外扩张面临地缘政治和贸易约束，公开产品价格也未标准化。一个目录没有公开数字
              MSRP 和当前可供购买的列表，其他目录则给出不可比的约 $50,000 和 $38,000-$150,000
              区间。这些只是配置线索，不是经验证的价格曲线。估值应打折，直到尽调证明生产部署可重复、集成由客户付费、实际售价和服务成本可核实，并明确 Leju 的外部销售份额。
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
              - CM016
      - number: '2.5'
        title: 展示
        blocks:
          - type: callout
            title: 行业增长不等于 Leju 的市场份额
            body: 150 亿美元的 2030 年预测是行业外部销售估计。在没有细分市场适配性、实际定价、赢单率和部署留存数据的情况下直接套用于 Leju，会制造虚假的精确 SOM。
            calloutType: risk
            claimRefs:
              - CM006
              - CM010
              - CM016
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 在分散市场中跻身出货量前四
        blocks:
          - type: paragraph
            body: >-
              TMTPost 称 Leju 2025 年售出 577 台 KUAVO，高于 2024 年的 32 台；Omdia 和 Counterpoint Research 均将其列为全球第四，仅次于
              Unitree、AgiBot 和 UBTECH。这证明出货规模可观，但不等于品类领导地位：同一报道将 Leju 2025 年收入列为 RMB 258 million（2.58 亿元人民币），而盈利的
              Unitree 为 RMB 1.708 billion（17.08 亿元人民币。Leju 官网覆盖科研、商业服务、工业和训练场景，独立目录则描述双足、轮式和应用专用
              KUAVO。直接竞争集包括中国全尺寸人形机器人同行；相邻选择包括科研平台和服务机器人。固定自动化、内部集成和延迟部署仍是买方替代方案，但指定公开证据没有量化其经济性，因此只作为未评分替代方案，不直接断言为竞争者。
            claimRefs:
              - CP001
              - CP002
              - CP008
              - CP009
              - CP014
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP008
              - CP009
              - CP014
              - CP015
      - number: '3.2'
        title: 产品广度可见，但部署可比性不足
        blocks:
          - type: paragraph
            body: >-
              Leju 的可见差异化在于平台广度及其与 OpenHarmony 软件的关联，而不是经独立验证的性能领先。第三方列表称其全向移动速度为 4.6 km/h、峰值关节扭矩为 360 N m；KUAVO 5-W
              还配备轮式底盘、40 个自由度和六小时续航。这些规格可用于配置筛选，但不是中立基准，且因型号而异。商业化标签也不一致：一个数据库称基础 KUAVO 尚未商业化，另一个将该系列标为原型，Humanoid.Guide
              称 5-W 已量产，Sourcebotics 则给出交付期。因此买方需要按型号完成集成和验证。未公开协作安全认证，对共享工业空间尤其重要，也阻碍了与同行进行清晰的信任或监管比较。
            claimRefs:
              - CP002
              - CP005
              - CP006
              - CP007
              - CP016
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP005
              - CP006
              - CP007
              - CP015
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP003
              - CP004
              - CP015
              - CP016
      - number: '3.3'
        title: 价格是武器，但公开产品包装不透明
        blocks:
          - type: paragraph
            body: >-
              最强的不利信号是靠价格扩张。TMTPost 称 Leju 采取更激进的市场定价策略后，KUAVO 2025 年平均售价下降 25.56%。公开目录价格不可比：ui44 没有官方
              MSRP，RobotOverflow 称 Kuavo 价格未披露，Sourcebotics 给出 38,000-150,000 美元的宽区间，Humanoid.Guide 为 5-W 列出 80,000
              美元。这些差异可能来自不同配置、配件、支持和商业条款，而不是真实价格分歧。Leju 可以复用教育市场的直销和间接渠道，但 2025 年应用构成以数据采集为主，工业制造只占 KUAVO 收入的
              3.88%。现有证据支持按报价包装和早期渠道借力，不支持标准化大众市场价格优势。
            claimRefs:
              - CP003
              - CP004
              - CP010
              - CP011
              - CP012
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP004
              - CP010
              - CP015
              - CP016
      - number: '3.4'
        title: 规模学习效应可信，但零部件和验证缺口削弱持续性
        blocks:
          - type: paragraph
            body: >-
              Leju 的出货加速、快速迭代以及对教育和数据采集买方的触达，可能带来学习效应，但公开证据没有显示持久锁定或自有分销。TMTPost 称，一项 FAW 部署仍处于概念验证阶段，且 2025 年一家供应商占
              Leju 关节模组采购的 82.82%。同一来源指出，Unitree 对成熟关节模组和灵巧手的内部生产更高。这个组合使 Leju
              暴露于零部件供应商议价和硬件利润被同行夺走的风险。真正的替代风险不只是更快的机器人，而是竞争者以相近运动能力叠加经验证的工业可靠性、安全认证、更低的零部件依赖和更清晰的总拥有成本。客户留存、转换成本、多归属和自研生产经济性仍缺乏私有证据。
            claimRefs:
              - CP008
              - CP012
              - CP013
              - CP014
      - number: '3.5'
        title: 展示
        blocks:
          - type: callout
            title: 出货排名不能证明持久护城河
            body: 2025 年销量激增同时伴随平均售价下降 25.56%、早期工业概念验证和集中采购关节模组。投资判断应区分靠降价买来的采用率与可重复的产品拉动。
            calloutType: risk
            claimRefs:
              - CP008
              - CP010
