      - number: '5.4'
        title: 安全与运营验证落后于技术主张的广度
        blocks:
          - type: paragraph
            body: >-
              信任与安全披露是指定证据中产品技术层面最大的弱点。Humanoid.Guide 称 KUAVO 5-W 面向共享工业和服务空间并提到 EMC
              测试，但明确指出没有公开协作安全认证。另一份技术资料没有列出环境等级、电池容量、续航、充电时间、负载、握力或传感器布局。安全共存、工作周期、操作范围和维护负担，决定人形机器人能否替代而不只是补充固定自动化。证据池也没有公开代码库、软件包遥测、问题跟踪器、安全文档、事故历史或从业者社区信号。这不证明事故或控制措施不存在，只说明架构、网络安全、隐私、质量管理和现场可靠性需要直接文件尽调。
