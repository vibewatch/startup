  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 商业模式与定价
        blocks:
          - type: paragraph
            body: >-
              可见商业模式主要是销售按配置提供的机器人，而非已披露的订阅或按使用量计费模式。RoboAtlas 描述 KUAVO 面向科研、教育、工业及其他部署场景的配置；独立产品目录给出的价格差异明显：Origin of
              Bots 估计 $50,000–$150,000，Sourcebotics 列出 $38,000–$150,000，Humanoid.Guide 为 KUAVO 5-W 列出 $80,000
              美元，Humanoid Press 则称约 $50,000。这些是第三方目录或采购线索，不是实际平均售价、合同对价或确认收入。Sourcebotics 还列出一台起订量和 60–90
              天交付期，符合按配置报价的销售方式。没有保留来源披露折扣、付款条款、服务搭售、保修收入、渠道经济性或收入确认政策。
            claimRefs:
