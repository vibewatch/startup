company:
  name: Leju Robotics
chapter:
  number: 7
  title: Risks
  summary: >-
    Leju's central risk is evidence quality around the transition from research-oriented
    humanoids to dependable industrial systems: a recent article reports strong automotive
    trial metrics, but the retained pool does not establish certifications, incident history,
    warranty scope, customer concentration, or independently verified production economics.
    Capital intensity, Huawei-stack dependence, component availability, pricing opacity, and
    rapid category expansion keep residual execution risk high.
sections:
  - id: ranked-risk-view
    title: Ranked residual-risk view
    body: >-
      The highest-priority risks are industrial reliability and product-safety readiness,
      followed by commercialization concentration, manufacturing scale-up, and strategic
      technology dependencies. A 16 October 2026 article reports 15 robots operating on an
      automotive parts-loading line at a 98% success rate over 1,000 continuous hours, which
      is meaningful new evidence but remains a single, AI-drafted and human-reviewed report
      rather than a customer-issued acceptance record. Independent profiles also continue to
      describe the platform as a prototype or emphasize missing operating specifications.
      Investors should therefore treat the reported trial as a positive signal, not proof of
      fleet-wide reliability, certified safety, or attractive total cost of ownership. The
      thesis strengthens only when named customers publish repeatable uptime, intervention,
      defect, safety, and renewal data.
    claimRefs: [CR003, CR004, CR005, CR007, CR008, CR013]
    figureRefs: [FR001]
  - id: regulatory-legal
    title: Regulatory, legal, and safety exposure
    body: >-
      The assigned public evidence contains no regulator filing, court record, certification
      register, privacy policy, security audit, recall notice, or incident log. That is an
      evidence gap, not evidence that no issue exists. The risk becomes acute as Leju moves
      from supervised research settings into factories or foreign markets, where machinery
      safety, workplace liability, cybersecurity, data governance, radio approvals, export
      controls, and insurance terms can gate deployment. A high-reputation news source also
      identifies geopolitical uncertainty and trade tension as a major overseas headwind for
      Chinese robotics companies. Before underwriting international or safety-sensitive
      revenue, diligence should obtain a jurisdiction-by-jurisdiction certification matrix,
      product-liability coverage, incident and near-miss logs, an SBOM, penetration-test
      results, data-flow documentation, and an IP freedom-to-operate opinion.
    claimRefs: [CR007, CR014, CR016]
    tableRefs: [TR001]
  - id: operations-financial-model
    title: Operational, quality, and financial-model risk
    body: >-
      Leju remains exposed to the classic hardware scale-up problem: reported demand and
      nominal capacity can expand faster than yield, field reliability, service capacity, and
      working capital. One independent analytical report describes a 2025 net loss of CNY
      69.78 million on CNY 258 million revenue, while a component-sourcing profile says a new
      assembly plant was designed for up to 10,000 robots annually and cites a 30-minute takt
      time. Those figures describe ambition, not proven profitable throughput. Component
      allocation and end-of-life exposure add schedule and redesign risk, and public pricing
      signals remain inconsistent: one database records no official MSRP while a commercial
      sourcing page lists a very broad USD 38,000-150,000 range. Kill criteria should focus on
      widening losses, rising warranty claims, weak production yield, or trial performance
      that cannot be reproduced in customer-issued records.
    claimRefs: [CR001, CR006, CR009, CR011, CR012]
    tableRefs: [TR002]
  - id: partners-concentration
    title: Partner, platform, and concentration dependencies
    body: >-
      Public profiles point to three concentration vectors. First, the retained analysis says
      the customer base remains centered on research, education, and data collection, so the
      industrial transition may depend on a small number of pilots. Second, Schaeffler is a
      credible technology partner, but the public record reviewed here establishes a joint
      development relationship rather than production-scale revenue or customer acceptance.
      Third, KUAVO's OpenHarmony/Huawei alignment is strategically useful in China but ties a
      key layer of the software ecosystem to another company's roadmap and may complicate some
      overseas procurement. Meanwhile, Morgan Stanley's sharply increased China shipment
      forecast signals a faster-growing competitive supply base. Mitigation requires disclosed
      revenue concentration, signed production contracts, portable interfaces, qualified
      alternate components, and customer-validated economics rather than additional
      partnership announcements.
    claimRefs: [CR002, CR003, CR010, CR013, CR014, CR015]
    tableRefs: [TR003]
