callouts:
  - calloutType: risk
    title: Trial metric is not yet an underwriting metric
    body: >-
      The reported 98% success rate over 1,000 hours materially improves the evidence base, but
      the article does not provide task taxonomy, intervention frequency, denominator treatment,
      safety events, customer acceptance criteria, or economics. Require those fields before
      converting the report into a fleet-reliability assumption.
    claimRefs: [CR004, CR005]
