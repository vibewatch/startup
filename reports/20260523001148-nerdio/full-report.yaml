chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Headquarters, and Product Portfolio
        blocks:
          - type: paragraph
            body: >
              Nerdio is a privately held, Chicago, Illinois–headquartered SaaS company that builds automated cloud
              management tools for Microsoft's end-user computing (EUC) ecosystem. Its two flagship products—Nerdio
              Manager for MSP and Nerdio Manager for Enterprise—sit on top of Azure Virtual Desktop (AVD), Windows 365,
              Microsoft Intune, and Microsoft 365, adding automation, cost-optimization, multi-tenant management, and
              compliance enforcement capabilities that Microsoft's native consoles do not provide natively. The company
              describes its mission as turning months of engineering complexity into repeatable workflows any IT team
              can manage, delivering cost savings of up to 80% on Azure compute and storage.

              Nerdio's corporate lineage begins with Adar, Inc., a managed service provider co-founded in 2005 by Vadim
              Vladimirskiy, Stuart Gabel, and Niall Keegan in the Chicago area to deliver online backup and cloud
              services to SMBs. In 2016, Nerdio technology was created as an internal product division within Adar to
              productize AVD management tooling for other MSPs. Joseph Landes joined as co-founder in 2018, bringing 23
              years of Microsoft executive experience. In January 2020, Nerdio was formally separated from Adar as an
              independent company; Adar was simultaneously acquired by private equity and ceased operating under its
              original name. Nerdio Manager for Enterprise was launched in 2020, shortly after the spin-off, expanding
              the addressable market to direct enterprise accounts.

              As a remote-first employer, Nerdio's team is distributed globally across North America, EMEA, and APAC.
              The company operates under the legal entity "Nerdio, Inc." and maintains a comprehensive legal hub
              covering GDPR, HIPAA, and CCPA compliance, including a Data Protection Addendum (DPA). As of May 2026,
              Nerdio's home page states 23,000+ customers and 6.5 million users in 50+ countries—up from 15,000+
              customers and 5M+ users cited in the March 2025 Series C press release. This chronological difference
              reflects genuine customer growth over the interval and should not be interpreted as conflicting data; both
              figures were sourced from company-issued disclosures at distinct points in time. Nerdio is listed on the
              Azure Marketplace and holds a published Microsoft partner case study, underscoring its deep integration
              with the Microsoft commercial ecosystem.
