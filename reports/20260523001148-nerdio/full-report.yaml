  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation, confidence, and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a constructive but disciplined stance. Nerdio is clearly not an early
              proof-of-concept company: the Series C round brought in $500 million of minority capital from General
              Atlantic, the company disclosed a $1 billion+ valuation floor, and within months it publicly crossed $100
              million ARR while repeating that it was profitable and debt-free. That combination makes a pure “avoid”
              verdict hard to defend from the available record. At the same time, the public set stops short of what
              would justify an automatic premium-growth underwriting case. The exact post-money valuation was not
              disclosed, the percentage stake sold is undisclosed, and there is still no public view into net revenue
              retention, gross margin, cash burn, or the preference stack that determines common-equity returns. The
              right chapter-level recommendation is therefore track / research-more with a constructive bias rather than
              strong-buy. Confidence is medium, not low, because the disclosed floor is real and corroborated; risk is
              high because Microsoft dependency and private-company opacity can still compress returns. Entry discipline
              matters more than company quality alone. A buyer near the public floor can plausibly argue for fair to
              attractive pricing, while a buyer materially above roughly $1.25-$1.5 billion would need private-data
              confirmation that growth, retention, and margin quality are strong enough to defend a higher multiple.
            claimRefs:
