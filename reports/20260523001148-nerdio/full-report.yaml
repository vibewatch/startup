        title: Financial verdict, capital intensity, and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The financial verdict is attractive on business quality and incomplete on disclosure quality. Public
              evidence strongly supports a recurring software model, a cost-savings-driven value proposition, meaningful
              channel leverage, and a business that had already reached profitability before taking a very large growth
              round. Capital intensity also appears lower than many infrastructure or vertical-software peers because
              Nerdio is not carrying visible manufacturing, inventory, or project-finance obligations; the cost base
              looks dominated by engineering, customer success, sales, partner enablement, and Azure-adjacent support.
              At the same time, there are real constraints on conviction. Microsoft is cutting Windows 365 SMB pricing,
              Azure Virtual Desktop remains the native pay-as-you-go baseline, and Nerdio still has to preserve enough
              ROI spread to justify an attach-layer subscription. Public reviews also show pricing sensitivity for
              smaller customers and reliance on Azure expertise. The remaining diligence blockers are the classic
              private-SaaS blind spots: gross margin, NRR, CAC/payback, revenue mix, geography mix, contract duration,
              concentration, and runway. Investors can underwrite that Nerdio is likely a good business; they cannot
              responsibly underwrite the exact quality of that business without private financial files.
