      - number: '3.3'
        title: Switching costs, lock-in, and distribution power
        blocks:
          - type: paragraph
            body: >
              Competitive durability in this category is driven less by raw feature count than by switching cost and
              route-to-market. Nerdio benefits from Microsoft-only specialization, but that same focus creates a
              structural dependency on one ecosystem. If a buyer is already committed to Azure, Windows 365, and Intune,
              Nerdio can lower operational pain quickly; if Microsoft bundles more administration, security, or cost
              tooling into the native stack, Nerdio's room to charge narrows. At the same time, coexistence is common:
              Microsoft explicitly supports Omnissa Horizon integration with Windows 365, Azure says AVD can modernize
              Citrix or Omnissa environments, and third-party market commentary shows many enterprises operating
              multiple desktop-delivery models in parallel. That reduces all-or-nothing replacement dynamics. Nerdio's
              counterweight is channel leverage. The PartNERD ecosystem, Nerdio University, CIS benchmark certification,
              and Carahsoft's public-sector distribution all reduce perceived deployment risk and make Nerdio more
              purchasable for MSPs and regulated customers than a generic script-your-own approach. Still, adverse
              reviews show that advanced automation can require specialized skills and may be overkill for very small
              environments.
            claimRefs:
