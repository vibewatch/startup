      - number: '7.4'
        title: Financial opacity and concentration uncertainty matter more than current distress signals
        blocks:
          - type: paragraph
            body: >-
              The financial risk case on Nerdio is unusual because the publicly visible top line is strong while the
              underwriteable middle is missing. Funding, ARR scale, and valuation are all visible enough to know that
              Nerdio is a serious company: the business raised $500 million in Series C at a disclosed north-of-$1
              billion valuation, had already raised $117 million in Series B and $8 million in Series A, and publicly
              crossed $100 million ARR in 2025. Those facts imply at least a ~10x ARR multiple on the public floor and
              therefore meaningful multiple-compression risk if growth slows or Microsoft competition intensifies. At
              the same time, the company’s profitability is only self-reported quality from public evidence: retained
              sources do not disclose gross margin, NRR, CAC, payback, burn, runway, or concentration. That gap is
              material because channel concentration is especially plausible in a partner-led, Microsoft-centric
              go-to-market motion, yet no reviewed source discloses top-partner or top-customer exposure. Review
              evidence adds another nuance: Nerdio is clearly valuable to many MSP users, but some third-party sources
              still flag small-business affordability, Azure lock-in, and skill requirements. The result is a risk
              profile where the company looks successful, but not fully priceable from public data alone.
            claimRefs:
