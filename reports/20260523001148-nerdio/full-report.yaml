        title: Exhibits
        blocks:
          - type: callout
            title: Unicorn Status with Rare Private Profitability
            body: >
              Nerdio achieved $1B+ valuation and $100M+ ARR while remaining profitable and debt-free— a rare combination
              for a high-growth SaaS company. The 85%+ ARR growth rate, combined with no-debt and positive cash
              generation, positions Nerdio as an efficient growth business rather than a burn-and-scale story.
            calloutType: strength
            claimRefs:
              - CO020
              - CO021
              - CO024
              - CO026
              - CO027
          - type: callout
            title: Single-Platform Dependency Creates Structural Vulnerability
            body: >
              Nerdio's entire product portfolio sits on top of Microsoft's proprietary cloud platforms. If Microsoft
              bundles native management capabilities into its admin consoles, adjusts API access policies, or shifts its
              channel strategy, Nerdio's value proposition could be significantly diluted with little structural
              recourse. This is the most material risk in the investment thesis and warrants specific contract and
              partner-rights due diligence.
            calloutType: risk
            claimRefs:
              - CO035
              - CO038
          - type: callout
            title: Valuation Anchored to Public $1B+ Figure; Precise Value Not Supported
            body: >
              This report uses "$1B+" as the supported valuation figure throughout. The $1.2B+ figure sometimes
              referenced in investor documentation is not confirmed in any publicly available Nerdio, General Atlantic,
              or media source retrieved during this research cycle. The analysis treats $1B+ as the safe anchor and
              flags $1.2B+ as unverified.
            calloutType: assumption
