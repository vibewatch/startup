      - number: '6.2'
        title: Adoption trajectory and named customer proof are real but uneven in quality
        blocks:
          - type: paragraph
            body: >-
              The top-line adoption story is strong. Nerdio's March 2025 Series C announcement said the platform served
              more than 5 million users across 15,000 customers in over 50 countries, and by May 2026 the homepage
              claimed 23,000+ customers and 6.5 million users. The June 2025 ARR milestone press release added another
              useful data point: over 400 new enterprise customers in the prior year. Named proof is broad enough to
              matter, but the quality of that proof varies. Official press materials list large brands such as Chevron,
              Kraft Heinz, ASDA, Carnival Cruise Line, Willis Towers Watson, Setfords, Sage, and Penn State, while
              TechCrunch adds PayPal, Sony, and Comcast. The deepest evidence comes from customer stories and homepage
              references where a specific operator, use case, and outcome are visible: Sage, Penn State, TeamLogic IT,
              Priority Worldwide, Kilpatrick IT, City of Corona, and an unnamed US local government deployment. Those
              cases support real production usage; logo-only press mentions support awareness and social proof, but much
              less about contract size or renewal durability.
