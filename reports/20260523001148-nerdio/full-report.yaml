      - number: '4.2'
        title: Sales-efficiency proxies and unit-economics signal
        blocks:
          - type: paragraph
            body: >-
              Because Nerdio is private, the most useful financial evidence after pricing comes from customer economics
              rather than disclosed margin tables. Those proxies are unusually consistent. TeamLogic IT describes 55-60%
              Azure compute savings and a quoting cycle that fell from weeks or more than a month to days. Priority
              Worldwide says Nerdio saves more than $20,000 per month and avoided hiring a specialized Azure engineer.
              Kilpatrick IT claims 200% ROI and 66% faster migrations, while the NComputing public-sector case says
              deployments fell from weeks to hours and average savings reached about $10,000 per month. Nerdio's own
              2026 migration business-case material adds a broader benchmark set, citing an ESG validation with 55% AVD
              cost reduction, 50% lower IT admin hours, and 36% lower support costs versus native management. These are
              not substitutes for CAC, payback, NRR, or gross margin, but they do show the economic mechanism: Nerdio
              wins when it compresses labor, reduces cloud waste, and makes Microsoft environments operable by more
              junior staff. That is a healthy unit-economics shape for software, even if the company still withholds the
              core SaaS metrics needed for full underwriting.
