      - number: '1.3'
        title: Funding History, Valuation, and Financial Profile
        blocks:
          - type: paragraph
            body: >
              Nerdio has raised $625 million across three rounds since its 2020 spin-off, positioning it among the most
              capitalized pure-play Microsoft cloud management ISVs globally. The Series A raised $8 million in February
              2020, led by MK Capital, which already had a board relationship through Adar's 2014 institutional funding.
              The Series B raised $117 million in December 2022 from Updata Partners, a Washington D.C.–based B2B SaaS
              growth equity firm; this round came despite a difficult macro environment and funded executive team
              expansion, headcount growth, and geographic expansion into the UK, EMEA, Australia, New Zealand, India,
              and Brazil. Updata's Carter Griffin joined the board.

              The Series C, announced March 18, 2025, raised $500 million from General Atlantic (lead investor), Lead
              Edge Capital, and StepStone. The company describes the valuation impact as quadrupling from the Series B
              level to "$1 billion+." In an interview with TechCrunch, CEO Vladimirskiy and CRO Landes confirmed the
              valuation is "north of $1 billion" but declined to disclose the precise figure. J.P. Morgan served as
              exclusive financial advisor to Nerdio. As part of the investment, General Atlantic took two board seats.
              The company is described as profitable, debt-free, and experiencing ongoing revenue growth. Total lifetime
              capital raised stands at $625 million.

              Financial opacity represents a material diligence limitation. Nerdio does not publicly disclose gross
              margin, net revenue retention (NRR), customer acquisition cost (CAC), or burn rate. The only confirmed
              financial metric is the $100M+ ARR milestone reached in June 2025. Without standard SaaS financial KPIs,
              triangulating the $1B+ valuation against industry multiples is difficult; at $100M ARR and a $1B+
              valuation, the implied ARR multiple is approximately 10x—reasonable for a high-growth profitable SaaS
              business but dependent on growth rate sustainability. All equity percentages and cap table details remain
              undisclosed.
