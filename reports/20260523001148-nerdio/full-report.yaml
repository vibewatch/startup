      - number: '3.2'
        title: Capability and packaging differences
        blocks:
          - type: paragraph
            body: >
              Nerdio's pitch is sharper than the broader VDI incumbents: one pane of glass for Microsoft cloud desktops,
              cost controls, policy automation, security enforcement, and multi-tenant administration. The product pages
              and third-party coverage consistently show where that lands best: MSPs and Microsoft-centric enterprise
              teams that want AVD, Windows 365, Intune, and Microsoft 365 handled together without writing their own
              scripts or bouncing across multiple admin centers. Microsoft native tools remain a real competitive threat
              because AVD already offers full control, multi-session efficiency, and pay-as-you-go infrastructure
              economics, while Windows 365 offers simpler per-seat packaging and Microsoft keeps lowering the barrier
              for SMB adoption. Citrix and Omnissa, by contrast, emphasize broader hybrid and multi-cloud support,
              richer legacy VDI continuity, and deeper cross-platform deployment options. That is a strength in complex,
              heterogeneous environments, but it also makes them less clearly optimized for buyers who have already
              standardized on the Microsoft stack and now care more about operating efficiency than about platform
              neutrality.
