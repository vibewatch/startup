  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Microsoft platform dependency and native competition are the central thesis risk
        blocks:
          - type: paragraph
            body: >-
              Nerdio’s biggest risk is structural, not incidental: the company is building an automation and
              orchestration layer on top of Microsoft-owned control planes rather than operating a stand-alone desktop
              platform. Public product pages, Microsoft’s marketplace listing, and Microsoft’s own partner case study
              all reinforce the same architecture story—Nerdio adds workflow compression, multi-tenant administration,
              cost optimization, and easier day-two operations around Azure Virtual Desktop, Windows 365, Intune, and
              broader Microsoft 365 administration. That has worked commercially because the Microsoft stack is powerful
              but still operationally messy for many MSPs and enterprise teams. The problem is that Microsoft also
              controls the baseline price, the underlying APIs, and the native admin experience. Microsoft’s 2026
              Windows 365 Business price cut, Azure’s persistent pay-as-you-go economics, and ongoing first-party
              feature expansion all show how easily the native floor can move. Nerdio’s flexible contracts and
              own-tenant deployment help at the margin, but they are not a structural hedge. If Microsoft closes enough
              of the workflow gap inside its own consoles or bundles equivalent management features more aggressively,
              Nerdio’s premium layer could re-rate quickly.
