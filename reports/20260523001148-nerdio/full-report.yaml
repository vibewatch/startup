      - number: '7.3'
        title: Rapid scaling has created a meaningful people and execution risk layer
        blocks:
          - type: paragraph
            body: >-
              Nerdio is no longer a tiny founder-led specialist, but it is also not yet a mature public-company machine.
              The company disclosed 82% headcount growth in 2025, added four new C-suite leaders in January 2026, and
              expanded its footprint into multiple new international regions while describing itself as remote-first and
              globally distributed. Those are positive signals of ambition and market pull, but historically they are
              also exactly the conditions under which integration and managerial-bandwidth problems surface. The risk
              here is not that any one new executive is weak; several hires came from strong backgrounds, including
              Microsoft and other large software companies. The risk is that an organization moving this quickly has to
              integrate new leadership, preserve product velocity, standardize operating rhythms across geographies, and
              avoid confusing the field while it is still scaling. Key-person exposure compounds that challenge. Vadim
              Vladimirskiy remains the primary strategic and product-facing founder voice, while Joseph Landes is still
              deeply associated with commercial credibility and ecosystem relationships even after shifting into the
              President role. If either left unexpectedly, the external signal would be much worse than a normal
              executive turnover event.
