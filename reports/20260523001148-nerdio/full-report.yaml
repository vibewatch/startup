  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope and customer jobs-to-be-done
        blocks:
          - type: paragraph
            body: >-
              Nerdio now presents as two closely related products aimed at different operators rather than as a single
              generic virtualization tool. Nerdio Manager for MSP is built around the managed-service workflow: pricing
              and assessing customer environments, onboarding tenants, standardizing policies, supporting users, and
              expanding into Microsoft 365 administration from the same console. Nerdio Manager for Enterprise is framed
              as an internal IT control plane for Azure Virtual Desktop, Windows 365, and Intune-managed endpoints, with
              published module pricing and a cost-modeling workflow that looks more mature than older third-party
              pricing references implied. The most important product-level shift is breadth. Public product and news
              materials show Nerdio has moved from a mostly AVD-oriented story toward a broader Microsoft-cloud
              administration layer that includes Modern Work functions, security baselines, and partner enablement. That
              breadth is meaningful for adoption because it lets Nerdio sell workflow consolidation, not just one-off
              VDI automation. It also means buyers can land the product with one Microsoft problem and expand usage
              later without changing vendors or admin habits.
