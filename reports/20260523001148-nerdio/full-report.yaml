      - number: '1.2'
        title: Leadership, Founders, and Governance
        blocks:
          - type: paragraph
            body: >
              Nerdio was co-founded by Vadim Vladimirskiy (Co-Founder and CEO) and Joseph Landes (Co-Founder and
              President as of January 2026). Vladimirskiy is the originating technical force, having built Adar from
              2005 and created the first Nerdio technology inside that MSP. Landes joined in 2018 after a 23-year career
              at Microsoft, where he held senior executive roles including work on the Microsoft partner and channel
              ecosystem. Both co-founders confirmed at the time of the Series C that they retain a "significant stake"
              in the business, though exact percentages are undisclosed.

              Following the $500M Series C in March 2025 and to support rapid post-funding scale, Nerdio announced four
              senior executive appointments in January 2026. Scott Manchester joined as Chief Product and Technology
              Officer (CPTO), bringing 25 years of Microsoft cloud platform experience. Bryan Law joined as Chief
              Marketing Officer from SentinelOne, where he had most recently served as CMO; he also held the CMO role at
              ZoomInfo and leadership positions at Salesforce, Google, Tableau, Rackspace, and Monitor Deloitte. Larry
              Sweeney, previously Nerdio's EVP of Enterprise Sales, was promoted to Chief Revenue Officer and also
              assumed oversight of Customer Success. Matt Tavlin joined as Chief People Officer with prior leadership
              experience at Cisco, VMware, Pure Storage, Cohesity, and Freshworks. Joseph Landes simultaneously
              transitioned from CRO to President, focusing on strategic partnerships and external evangelism.

              Nerdio's board of directors reflects both investor oversight and deep Microsoft ecosystem expertise.
              General Atlantic is represented by Aaron Goldman (Managing Director, Head of Enterprise Technology) and
              Asher Hecht (Principal). Updata Partners is represented by Carter Griffin (General Partner). MK Capital is
              represented by Bret Maxwell (Managing General Partner). Independent directors include Gavriella Schuster
              (former Microsoft Global Channel Chief) and Andy Lees (former Microsoft President and Corporate VP during
              a 23-year tenure). No adverse governance events—such as founder departures, board disputes, or regulatory
              action—were identified in publicly available records as of the research date. The January 2026 executive
              expansion is treated as a planned scaling of management bench, not a leadership crisis signal.
