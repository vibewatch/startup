  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / evidence
      - Transmission to valuation
      - Action implication
    rows:
      - - Microsoft native feature / bundle convergence
        - Nerdio loses workflow differentiation or pricing spread against Windows 365 / AVD management
        - Premium narrows quickly because platform dependency becomes a direct pricing problem
        - Re-rate toward mature or dependent-software multiples; pause new buying
      - - Net retention disappoints
        - Verified NRR below ~110% or materially weak cohort expansion
        - A high-growth software multiple becomes hard to defend even if headline ARR is large
        - Move from constructive to cautious until churn and expansion are explained
      - - Gross margin proves sub-scale
        - Blended gross margin lands materially below software norms, especially if services content is high
        - Public comps shift from SaaS/platform names toward lower-multiple service-adjacent software
        - Cut fair-value range and revisit whether Nerdio is truly software-like
      - - Concentration / cap-table overhang
        - Top partners or customers are concentrated, or preferred terms absorb much of exit value
        - Common-equity return math can look poor even when enterprise value rises
        - Demand concentration tables and full waterfall before investing
      - - Price escapes public support
        - Any new round or secondary clears materially above ~$1.5B without new disclosure
        - Return asymmetry deteriorates faster than fundamentals improve
        - Require private diligence package or walk away from the price
    notes: >-
      These are investment-discipline thresholds rather than management guidance. Each one would either compress the
      multiple, reduce exit-value capture, or both.
    claimRefs:
      - CV012
      - CV016
      - CV025
      - CV026
      - CV033
      - CV042
  - id: TV006
    title: Final diligence asks table
    columns:
      - Priority
      - Topic
      - Missing evidence
      - Why it matters
      - Diligence path
    rows:
      - - 1 (Critical)
        - Current ARR and growth bridge
        - No public 2026 ARR figure or month-by-month bridge from the June 2025 $100M milestone
        - Determines whether the business deserves 8x, 10x, or 15x ARR treatment
        - Request latest ARR, bookings, and trailing-12-month growth by quarter
      - - 2 (Critical)
        - NRR / GRR by segment
        - No public retention data for MSP, enterprise, or public-sector cohorts
        - Retention is one of the strongest drivers of durable software multiples
        - Review cohort tables, gross retention, and expansion by product and customer segment
      - - 3 (Critical)
        - Gross margin and services mix
        - Profitability is claimed, but gross margin and services attach remain private
        - Separates premium software economics from lower-multiple service-heavy economics
        - Request audited P&L, gross-margin bridge, and revenue mix by software vs. services
      - - 4 (Critical)
        - Exact Series C valuation, ownership sold, and preference stack
        - The round was minority and $1B+, but exact post-money and liquidation terms are undisclosed
        - Return capture can differ dramatically between enterprise value and common-equity value
        - Obtain cap table, term sheet summary, and waterfall analysis
      - - 5 (High)
        - Concentration and channel quality
        - No public top-customer or top-partner concentration, renewal, or attach-rate data
        - A Microsoft- and partner-led motion can hide material concentration risk
        - Request top-20 customer/partner exposure and renewal history
      - - 6 (High)
        - Cash flow quality and exit path
        - No public cash balance, burn, secondary-clearing data, or board-level liquidity timing
        - Investors cannot price time-to-liquidity or down-round risk without it
        - Review cash bridge, board materials, and any banker or secondary-market process data
    notes: >-
      Items 1-4 are blocking for conviction above the disclosed floor. Items 5-6 calibrate downside protection and
      realistic exit timing.
    claimRefs:
      - CV026
      - CV027
      - CV033
      - CV034
      - CV038
      - CV042
