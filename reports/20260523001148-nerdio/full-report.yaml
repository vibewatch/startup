      - number: '2.3'
        title: Growth drivers, constraints, and preserved diligence gaps
        blocks:
          - type: paragraph
            body: >
              The growth case is real, but it is not frictionless. Analyst and platform sources consistently point to
              hybrid work, BYOD, cloud delivery, security/compliance mandates, and Microsoft’s own continued push behind
              Azure Virtual Desktop and Windows 365 as demand drivers. Nerdio’s value proposition fits that environment
              because it promises simpler operations and better unit economics in Microsoft-native cloud estates. At the
              same time, the company’s market carries structural constraints that matter for valuation. First, Microsoft
              dependency is not a footnote: Nerdio rides a stack whose owner already ships native management surfaces
              and can improve them over time. Second, incumbent alternatives remain credible. Citrix and Omnissa still
              market full virtual desktop and DaaS solutions, while Microsoft documents coexistence paths with Omnissa
              Horizon rather than a clean one-way migration narrative. Third, skills and implementation complexity
              remain gating factors. Nerdio University, partner enablement content, and adverse reviews all suggest the
              product is most attractive once an organization already feels meaningful Azure/Microsoft operational pain.
              Fourth, broad market estimates should not be over-interpreted. A $10.26B low-end 2026 market and a $23.85B
              high-end 2026 market cannot both be treated as precise truth. The right diligence posture is to keep the
              contradictory estimates visible, treat the derived SAM as directional, and request private evidence on
              attach rates, segment mix, and pricing realization before claiming a crisp SOM.
