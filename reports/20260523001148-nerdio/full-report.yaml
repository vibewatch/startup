              MSP-led: Nerdio Manager for MSP is priced per tenant, marketed around multi-tenant administration, and
              reinforced by PartNERD partner benefits, training, and margin language aimed at practice builders rather
              than end-user companies. The second is direct enterprise IT, where Nerdio Manager for Enterprise is priced
