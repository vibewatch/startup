  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and competitor sets
        blocks:
          - type: paragraph
            body: >
              The most important competitive distinction is that Nerdio is not trying to replace every virtual-desktop
              product on earth; it is trying to own the Microsoft-specific automation and optimization layer around
              Azure Virtual Desktop, Windows 365, Intune, and broader Microsoft 365 administration. That means the
              direct field is unusually mixed. Microsoft itself is the default status-quo option because buyers can run
              AVD, Windows 365, and Intune directly through first-party admin surfaces and APIs without paying an ISV.
              Citrix and Omnissa are the incumbent enterprise alternatives, especially in heterogeneous or hybrid
              estates where on-premises legacy, multi-cloud support, or deep VDI policy control still matter. AWS
              WorkSpaces is a substitute platform rather than a direct feature-for-feature peer, while ControlUp,
              Lakeside, and Rimo3 are more accurately adjacent overlays for DEX, remediation, or app-readiness than
              primary Nerdio replacements. The chapter therefore treats Microsoft native tools as the most credible
              entrant from below, Citrix and Omnissa as incumbents above, and AWS plus DEX vendors as substitutes or
              complements depending on the workload.
            claimRefs:
              - CP001
              - CP003
              - CP012
              - CP013
              - CP015
