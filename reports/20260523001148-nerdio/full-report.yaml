              operations teams. The third is government and public sector, where Carahsoft and Microsoft-compatible
              Azure Government positioning appear to matter more than pure direct web acquisition. Public references
              also show sector breadth beyond classic software buyers, with proof in education, nonprofit, logistics,
              local government, and global enterprise brands. What remains undisclosed is the actual mix inside the
              23,000+ reported customers: Nerdio does not say how many are MSP partners, end enterprises, public-sector
