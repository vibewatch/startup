  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: realized pricing
    missingEvidence: Segment-level price book, discount ladders, bundling rules, and recent contract samples showing realized
      MSP and enterprise pricing.
    whyItMatters: List pricing is visible, but realized pricing determines ARR quality, ACV, and the durability of Nerdio's
      value capture.
    diligencePath: Request 20 recent contracts or quote packets across MSP, enterprise, and government customers plus a gross-to-net
      pricing waterfall.
    relatedTableRefs:
    - TI002
  - type: private-evidence-only
    severity: blocking
    topic: cash and runway
    missingEvidence: Current cash balance, monthly burn or generation, and base or downside runway.
    whyItMatters: A profitable, debt-free narrative still does not reveal how much cash is on hand or whether the next financing
      round is optional.
    diligencePath: Request the latest balance sheet, 13-week cash forecast, and 12-24 month operating budget tied to the post-Series
      C plan.
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: core unit economics
    missingEvidence: Gross margin by product and services, NRR or GRR, CAC, LTV, and payback by channel.
    whyItMatters: These are the metrics that determine whether Nerdio's recurring revenue is merely growing or compounding
      efficiently.
    diligencePath: Request product-level P&L, retention cohorts, and CAC or payback models split by MSP, enterprise, and public-sector
      motions.
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: revenue mix and recognition
    missingEvidence: ARR and bookings mix across MSP, enterprise, public sector, geography, and attached services, plus contract
      duration and recognition policy.
    whyItMatters: Mix drives margin path, concentration, seasonality, and the actual quality of the recurring revenue base.
    diligencePath: Request ARR bridge by segment, deferred-revenue roll-forward, standard contract templates, and top-customer
      concentration schedules.
    relatedTableRefs:
    - TI001
    - TI005
  - type: missing-source
    severity: minor
    topic: legal reserve detail
    missingEvidence: Any public disclosure of legal reserve, insurance recovery, or contingent liability sizing for the trademark
      dispute.
    whyItMatters: The docket confirms legal activity exists, but public sources do not size its cash relevance.
    diligencePath: Request counsel memo, reserve accounting, and insurance coverage summary for active or recent trademark
      matters.
    relatedTableRefs:
    - TI004

