- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Public value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - ARR
    - $100M+ as of June 2025
    - medium
    - Primary scale denominator for valuation and growth underwriting
    - Provide monthly ARR bridge through the current quarter
  - - YoY ARR growth
    - 85%+ as of March 2025
    - medium
    - Shows growth quality and supports Rule-of-40 style framing when paired with profitability
    - Provide quarterly revenue growth cadence and re-acceleration or deceleration history
  - - Minimum ARR per organization floor
    - '>$6.7k per year (>100M ARR / >15k organizations)'
    - medium
    - Helps anchor disclosed scale without assuming high enterprise ACV across the whole base
    - Provide ACV distribution by MSP, enterprise, and public-sector cohorts
  - - Operating profitability
    - Publicly described as profitable
    - medium
    - Reduces financing dependency and changes valuation framing materially
    - Provide EBITDA, operating margin, and free cash flow bridge
  - - Implied ARR multiple floor
    - ~10x ARR at $1B valuation floor and $100M ARR floor
    - medium
    - Shows that the disclosed round was not obviously priced at an extreme multiple for the growth rate
    - Provide latest preferred share price, 409A, and board valuation materials
  - - Gross margin
    - Unknown
    - low
    - Core test of software quality versus services/support drag
    - Provide gross margin by product, services, and support
  - - NRR / GRR
    - Unknown
    - low
    - Critical for determining whether the installed base compounds efficiently
    - Provide cohort retention by segment and product
  - - CAC / LTV / payback
    - Unknown
    - low
    - Key test of GTM efficiency and whether channel economics are truly capital-light
    - Provide CAC by channel, blended and net payback, and LTV assumptions
  - - Burn / runway
    - Unknown despite profitability claim
    - low
    - Needed to translate profitability messaging into actual financing risk
    - Provide cash balance, monthly burn or generation, and runway under current plan
  notes: The table intentionally separates disclosed metrics from derived floors and from unknowns. The most useful public
    inference is valuation-to-ARR and ARR-per-organization floors; the least visible facts are margin and retention.
