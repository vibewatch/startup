- id: TI004
  title: Capital adequacy table
  columns:
  - Metric
  - Public value / status
  - Why it matters
  - What is supportable publicly
  - Diligence ask
  rows:
  - - Total disclosed capital raised
    - $625M lifetime
    - Sets the size of external financing support behind the company
    - Publicly supportable from $8M Series A, $117M Series B, and $500M Series C
    - Confirm primary versus secondary split and exact close dates
  - - Latest round
    - $500M minority Series C at $1B+ valuation
    - Signals large balance-sheet capacity and strong investor appetite
    - Official March 2025 announcement from Nerdio, General Atlantic, and TechCrunch coverage
    - Confirm ownership sold, liquidation preferences, and any secondary component
  - - Use of funds
    - Product innovation, global expansion, engineering, and customer success
    - Shows where future cash will be consumed
    - Repeated explicitly in Nerdio and General Atlantic Series C materials
    - Provide detailed 24-month operating plan by function
  - - Profitability / debt status
    - Profitable and debt-free at Series C
    - Major indicator that financing dependency is lower than many growth SaaS peers
    - Official company and investor statements say no debt and ongoing profitability
    - Provide debt schedule, contingent liabilities, and audited profitability bridge
  - - Cash on hand
    - Undisclosed
    - The single most important missing input for runway
    - No public source discloses current cash balance
    - Provide latest balance sheet and unrestricted cash detail
  - - Burn / runway
    - Undisclosed
    - Needed to test whether the next raise is optional or necessary
    - No public monthly burn, cash generation, or runway range is disclosed
    - Provide monthly cash flow, budget, and downside runway scenario
  - - Next-round trigger
    - Not publicly stated
    - Determines financing dependency and fundraising timing risk
    - No public threshold, timetable, or financing objective is disclosed
    - Ask management whether future capital is optional, strategic, or likely required
  - - Non-operating obligations
    - No public project-finance burden; limited public trademark-litigation activity visible
    - Tests whether hidden cash uses sit outside ordinary operating spend
    - CourtListener shows a 2024-2025 trademark appeal docket, but no reserve or liability amount is public
    - Provide legal reserve schedule, contingent liabilities, and insurance coverage summary
  notes: Capital adequacy looks favorable directionally because the latest round was large, minority, and paired with profitability
    and no debt. It is still impossible to size runway precisely without private cash and burn data.
  claimRefs:
  - CI025
  - CI027
  - CI028
  - CI034
  - CI035
  - CI036
  - CI043
  - CI045
- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Public status
  - Underwriting impact
  - Exact diligence path
  rows:
  - - Gross margin by product and services
    - Undisclosed
    - Without margin split, investors cannot test whether software economics meaningfully outweigh services/support burden
    - Request segment gross margin bridge and cloud-hosting/support cost detail
  - - NRR / GRR
    - Undisclosed
    - No way to tell whether the installed base compounds through expansion or merely grows through new-logo acquisition
    - Request cohort retention model by MSP and enterprise segment
  - - CAC, LTV, and payback
    - Undisclosed
    - Channel-led stories sound efficient, but the company gives no verified GTM efficiency metrics
    - Request CAC by channel, payback by cohort, and partner incentive economics
  - - Cash balance, burn, and runway
    - Undisclosed
    - Prevents a hard judgment on financing dependency despite the profitable/debt-free narrative
    - Request latest balance sheet, 13-week cash forecast, and 12-24 month budget
  - - 'Revenue mix: MSP vs enterprise vs public sector vs services'
    - Undisclosed
    - Mix determines ACV, margin path, concentration risk, and durability of growth
    - Request ARR/bookings mix dashboard and top-20 account contribution
  - - Geography mix
    - Undisclosed
    - International expansion can improve growth but also changes sales efficiency and support costs
    - Request revenue by geography and local headcount footprint
  - - Contract structure and revenue recognition
    - Undisclosed
    - List pricing is not enough to know duration, prepayment, implementation recognition, or deferred-revenue quality
    - Request standard contract template, renewal terms, and revenue-recognition memo
  - - Customer concentration
    - Undisclosed beyond logo examples
    - Large-enterprise concentration could materially change the risk profile of the $100M+ ARR base
    - Request anonymized top-customer concentration table and logo retention history
  notes: These are the missing facts that keep Nerdio from being fully underwriteable on public information alone. The most
    important holes are margin, retention, GTM efficiency, and actual runway.
