- id: FI004
  title: Capital intensity / cash-flow map
  type: matrix
  layout: wide
  summary: Matrix showing where Nerdio appears to consume cash and where the public record remains thin.
  approximationNotes: This is a directional capital-intensity map, not a disclosed spend waterfall. Values are qualitative
    because Nerdio does not publish departmental opex or hosting costs.
  data:
    columns:
    - Cash intensity
    - Timing
    - Disclosure quality
    - Implication
    rows:
    - label: Cloud infrastructure / Azure-adjacent support
      values:
      - Medium variable
      - Monthly usage-linked
      - Indirectly supported by customer savings and AVD pricing evidence, not company COGS
      - Margin depends on ongoing Azure optimization and support efficiency
    - label: Engineering / product
      values:
      - High
      - Ongoing opex
      - Well supported by Series C use-of-funds and hiring narrative
      - Likely a major destination for new capital
    - label: Customer success / onboarding
      values:
      - Medium-high
      - Ongoing opex
      - Supported by customer onboarding stories and stated hiring plans
      - Supports renewals and expansion but can pressure margin if service-heavy
    - label: Sales / partner enablement
      values:
      - Medium
      - Ongoing opex
      - Supported by MSP motion, executive structure, and per-tenant monetization changes
      - Could be efficient if channel economics hold, but CAC is undisclosed
    - label: Legal / contingent items
      values:
      - Low visible, unknown total
      - Episodic
      - Trademark appeal is publicly visible but no reserve is disclosed
      - Small but real source of possible non-operating cash use
