runDate: '2026-05-23'
company:
  name: Nerdio
chapter:
  number: 4
  title: Financial Analysis
  summary: Public evidence supports that Nerdio is a high-growth, profitable, debt-free recurring software business with $100M+
    ARR and a very large 2025 Series C balance-sheet cushion, but not a fully underwriteable public financial profile. Pricing
    is now materially more visible on the MSP side than on enterprise, and customer case studies repeatedly support the platform's
    ROI and labor-leverage thesis. The biggest diligence blockers remain gross margin, NRR, CAC/payback, revenue mix, and
    current cash/runway, so the financial verdict is positive on business quality but still conditional on private data.
sections:
- id: revenue-model-and-pricing
  title: Revenue model, pricing visibility, and monetization quality
  body: 'Nerdio''s public financial story starts with revenue architecture rather than GAAP detail. The company is clearly
    monetizing a recurring software layer on top of Microsoft cloud infrastructure, not selling infrastructure itself and
    not operating a hardware-heavy or project-finance model. Official pricing now makes the MSP motion far more legible than
    it was in earlier years: Nerdio publicly shows tenant-based pricing for Microsoft 365 management, a government minimum,
    monthly and annual terms, and volume-discount language that confirms realized pricing still sits behind sales conversations.
    Enterprise pricing is less transparent. The best public anchors are a 2022 third-party report citing $3 per user per month
    and Nerdio''s own 2026 business-case guidance telling buyers to budget $6-$10 per user per month for a management layer.
    That combination is enough to conclude that Nerdio sells recurring software with meaningful price-to-value discipline,
    but not enough to know current realized ACV, gross-to-net discounting, services attach rate, or how much of the business
    comes from MSP multi-tenant subscriptions versus direct enterprise contracts. Financially, the quality signal is good;
    the precision is not.'
