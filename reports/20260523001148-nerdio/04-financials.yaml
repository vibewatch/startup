- id: traction-capital-and-range-estimates
  title: Public traction, capital adequacy, and estimate ranges
  body: 'The traction and capital story is strong on disclosed floors. Nerdio announced a $500M minority Series C in March
    2025 at a $1B+ valuation, described itself as profitable and debt-free, and said it was scaling at more than 85% year-over-year
    ARR growth. By June 2025 it reported crossing $100M ARR, adding 400+ enterprise customers over the prior year, and serving
    15,000+ organizations; by May 2026 the homepage claimed 23,000+ customers and 6.5M users. Lifetime disclosed funding is
    therefore $625M across the $8M Series A, $117M Series B, and $500M Series C. Public capital adequacy is favorable in a
    directional sense because a profitable, debt-free company raising $500M on minority terms is not behaving like an emergency
    financing candidate. But the current cash balance, burn, runway, and next-round trigger are all still hidden. That means
    range work has to stay scenario-based: the public floors imply about a 10x ARR multiple at the June 2025 milestone, while
    a hold-the-growth-rate thought experiment would compress that multiple meaningfully if ARR has continued to scale into
    2026. The business looks well-capitalized; the exact buffer remains private.'
