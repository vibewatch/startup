- id: FI003
  title: Financial estimate range
  type: range
  layout: standard
  summary: Public floors and scenario ranges for the key valuation inputs that can be derived without private financial statements.
  approximationNotes: High-end ARR and low-end ARR-multiple values are scenario outputs that assume the disclosed 85% growth
    rate broadly held for about a year after the 2025 disclosures. They are explicitly estimates, not reported current company
    figures.
  data:
    items:
    - label: Public ARR floor vs. scenario current ARR
