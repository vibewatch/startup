tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit / contract
  - Current public value / status
  - Revenue quality
  - Diligence ask
  rows:
  - - Nerdio Manager for MSP
    - Recurring cloud-management software for multi-tenant Microsoft 365, Intune, Defender, Entra ID, and AVD workflows
    - Tenant subscription with monthly or annual terms
    - Current MSP price page is live; per-tenant packaging now public
    - High recurring; channel-friendly and expandable across customer tenants
    - Provide ARR/bookings split by MSP module and attach rate by tenant
  - - Nerdio Manager for Enterprise
    - Recurring software for Azure Virtual Desktop, Windows 365, Intune, and Microsoft 365 management
    - Historically per user; current enterprise commercial unit not publicly posted
    - 2022 article cited $3 per user/month; 2026 official budgeting guide says budget $6-$10 per user/month; current realized
      price unknown
    - High recurring if sold as platform subscription, but current ACV is opaque
    - Provide current price book, average contract value, contract length, and renewal terms
  - - Government / regulated edition
    - Tenant-based MSP/government management offer for Azure Government and GCC High estates
    - Tenant minimum contract
    - Official page says Gov Edition starts at $250 per tenant/month minimum and offers volume discounts
    - High recurring, likely with stickier procurement cycles
    - Provide public-sector revenue mix, average deal size, and contract duration
  - - Professional services / onboarding / migration support
    - Attached implementation, migration design, onboarding, and optimization work around the platform
    - Project or onboarding scope, likely attached to software contracts
    - Business-case and customer stories clearly show onboarding and migration work, but no separate public pricing or mix
    - Lower-margin attached revenue that can help land software but dilute blended margin
    - Provide services revenue share, margin, and recognition timing
  - - Microsoft-influenced ecosystem revenue
    - Vendor-influenced Azure/M365 consumption enabled by Nerdio deployments and co-sell motion
    - Influenced spend, not necessarily recognized Nerdio revenue
    - Company says it influences $350M+ of Microsoft revenue annually
    - Useful ecosystem proof but not a substitute for Nerdio ARR quality
    - Clarify co-sell attribution rules and separate influenced revenue from GAAP revenue
  notes: The table separates recognized or likely-recognized Nerdio revenue streams from ecosystem influence metrics. Public
    pricing is much clearer on the MSP side than on enterprise, and the services component is visible operationally but not
    quantified financially.
