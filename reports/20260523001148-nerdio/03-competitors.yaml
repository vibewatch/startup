chapter:
  number: 3
  title: "Competitive Landscape"
  summary: >
    Nerdio competes in a crowded desktop-virtualization stack, but its real arena is the
    Microsoft-specific control layer between Azure Virtual Desktop, Windows 365, Intune,
    and the IT teams that need automation, cost governance, and multi-tenant operations.
    Citrix and Omnissa remain the heavyweight incumbents for heterogeneous and hybrid VDI,
    while Microsoft is simultaneously Nerdio's platform partner and the most credible
    native competitor because it already owns the underlying control planes, pricing, and
    user licensing. Nerdio's moat is strongest where MSPs, enterprises, and public-sector
    buyers want Microsoft-only specialization, but that moat is constrained by quote
    opacity, Microsoft dependency, and limited public win-rate data versus native or
    incumbent alternatives.

sections:
  - id: "landscape-and-competitor-sets"
    title: "Landscape and competitor sets"
    body: >
      The most important competitive distinction is that Nerdio is not trying to replace
      every virtual-desktop product on earth; it is trying to own the Microsoft-specific
      automation and optimization layer around Azure Virtual Desktop, Windows 365, Intune,
      and broader Microsoft 365 administration. That means the direct field is unusually
      mixed. Microsoft itself is the default status-quo option because buyers can run AVD,
      Windows 365, and Intune directly through first-party admin surfaces and APIs without
      paying an ISV. Citrix and Omnissa are the incumbent enterprise alternatives, especially
      in heterogeneous or hybrid estates where on-premises legacy, multi-cloud support, or
      deep VDI policy control still matter. AWS WorkSpaces is a substitute platform rather
      than a direct feature-for-feature peer, while ControlUp, Lakeside, and Rimo3 are more
      accurately adjacent overlays for DEX, remediation, or app-readiness than primary Nerdio
      replacements. The chapter therefore treats Microsoft native tools as the most credible
      entrant from below, Citrix and Omnissa as incumbents above, and AWS plus DEX vendors
      as substitutes or complements depending on the workload.
