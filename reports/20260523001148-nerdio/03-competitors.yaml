callouts:
  - calloutType: "strength"
    title: "Nerdio's clearest edge is not generic VDI breadth but Microsoft-only operating leverage"
    body: >
      The strongest differentiation is the combination of Azure cost control, multi-tenant MSP
      workflows, and one-platform administration across AVD, Windows 365, Intune, and adjacent
      Microsoft 365 services.
    claimRefs:
      - CP001
      - CP003
      - CP005
      - CP009
      - CP037

  - calloutType: "risk"
    title: "Microsoft can compress Nerdio's layer from below even while enabling it from above"
    body: >
      Because Microsoft already owns the first-party desktop, endpoint, licensing, and admin
      surfaces, every improvement in native packaging or management makes the baseline more
      competitive even if Nerdio remains more capable in complex deployments.
    claimRefs:
      - CP017
      - CP019
      - CP041
      - CP044

  - calloutType: "assumption"
    title: "Hybrid coexistence keeps the migration window open"
    body: >
      The retained evidence suggests that many enterprises are not choosing one permanent winner;
      they are running some mix of legacy VDI, AVD, and Windows 365, which gives Nerdio room to
      win the Microsoft-specific layer without displacing every incumbent platform outright.
    claimRefs:
      - CP020
      - CP025
      - CP042

