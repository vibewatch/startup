  - id: "moat-durability-and-verdict"
    title: "Moat durability and verdict"
    body: >
      The competitive verdict is favorable but narrow. Nerdio appears best positioned where
      customers want a Microsoft-native optimization layer rather than a full alternative VDI
      universe: MSPs that need multi-tenant control, enterprises migrating away from legacy
      VDI complexity, and public-sector teams that value policy automation, compliance, and
      Azure cost discipline. That is a real moat because Citrix and Omnissa are optimized for
      broader deployment flexibility, while Microsoft's own tools still create operational work
      that Nerdio packages into a more opinionated product. But the moat is not impregnable.
      Microsoft's native baseline is getting cheaper and easier to buy, public sources do not
      disclose precise current Nerdio list pricing or competitive win rates, and the hardest
      evidence still missing is whether Microsoft's improving admin surfaces are compressing
      renewal or expansion economics in the field. The right underwriting view is that Nerdio
      has a strong near-term niche and credible incumbents to displace, but its long-term
      pricing power depends on staying ahead of Microsoft in automation depth, MSP workflow, and
      governance rather than simply being easier to use than yesterday's Azure portal.
    claimRefs:
