  evidenceGaps:
    - type: "private-evidence-only"
      severity: "material"
      topic: "nerdio-pricing-transparency"
      missingEvidence: "Current public or customer-facing rate card for Nerdio Manager for MSP and Nerdio Manager for Enterprise, including discount ladders or minimum commitments."
      whyItMatters: "Without a current price sheet, buyers and investors cannot benchmark Nerdio's value proposition cleanly against native Microsoft packaging or incumbent quote-led alternatives."
      diligencePath: "Request the current MSP and enterprise pricing decks, reseller schedules, and one recent redacted quote for each product."
      relatedQuestionRefs: [QP018]
      relatedTableRefs: [TP003]
    - type: "private-evidence-only"
      severity: "material"
      topic: "competitive-win-rates"
      missingEvidence: "Quantified win-loss, conversion, and churn data by competitor class, especially versus Microsoft native tools, Citrix, and Omnissa."
      whyItMatters: "The moat thesis is much stronger if Nerdio is consistently displacing named rivals rather than merely riding general Microsoft cloud growth."
      diligencePath: "Request CRM-level win-loss reporting, top 20 displacement deals, and renewal data segmented by source platform or incumbent environment."
      relatedQuestionRefs: [QP024]
      relatedTableRefs: [TP004]
    - type: "missing-source"
      severity: "material"
      topic: "microsoft-native-encroachment"
      missingEvidence: "Evidence on which specific native Microsoft roadmap items are closing the feature gap and whether those changes are affecting Nerdio upsell, retention, or pricing."
      whyItMatters: "Microsoft is both partner and existential competitive risk, so feature compression matters more than almost any single external competitor headline."
      diligencePath: "Request product-gap tracking against AVD, Windows 365, and Intune releases plus renewal commentary from the sales and success teams."
      relatedQuestionRefs: [QP025]
      relatedTableRefs: [TP004]

