- id: scenario-ranges-and-return-math
  title: Bull, base, and bear ranges plus return math
  body: 'Scenario work has to be explicit about what is fact and what is modeling. The hard facts are limited: Nerdio disclosed a $1 billion+ valuation in March 2025, surpassed $100 million ARR by June 2025, and said it was growing at more than 85% year over year while remaining profitable and debt-free. From there, scenario analysis depends on assumptions about 2026 ARR, the durability of that growth, and what discount investors apply for Microsoft concentration and private-company opacity. The bear case assumes growth decelerates sharply, the market values Nerdio like a more platform-dependent or partially service-like software company, and the valuation drifts back toward the public floor. The base case assumes ARR keeps compounding into the mid-$100 millions, but the company still trades below premium public comps because disclosure quality and dependency risk remain unresolved. The bull case requires more than momentum: it needs evidence that Nerdio can sustain exceptional growth, preserve
    software-like economics, and show enough retention and margin quality to narrow the discount to premium cloud/security peers. That is why return math is highly entry-price sensitive. At or near the public floor the asymmetry can still work; at a materially higher undisclosed price, the upside compresses quickly unless private data confirm premium quality.'
