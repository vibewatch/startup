- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / evidence
  - Transmission to valuation
  - Action implication
  rows:
  - - Microsoft native feature / bundle convergence
    - Nerdio loses workflow differentiation or pricing spread against Windows 365 / AVD management
    - Premium narrows quickly because platform dependency becomes a direct pricing problem
    - Re-rate toward mature or dependent-software multiples; pause new buying
  - - Net retention disappoints
    - Verified NRR below ~110% or materially weak cohort expansion
    - A high-growth software multiple becomes hard to defend even if headline ARR is large
    - Move from constructive to cautious until churn and expansion are explained
  - - Gross margin proves sub-scale
    - Blended gross margin lands materially below software norms, especially if services content is high
    - Public comps shift from SaaS/platform names toward lower-multiple service-adjacent software
    - Cut fair-value range and revisit whether Nerdio is truly software-like
  - - Concentration / cap-table overhang
    - Top partners or customers are concentrated, or preferred terms absorb much of exit value
    - Common-equity return math can look poor even when enterprise value rises
    - Demand concentration tables and full waterfall before investing
  - - Price escapes public support
    - Any new round or secondary clears materially above ~$1.5B without new disclosure
    - Return asymmetry deteriorates faster than fundamentals improve
    - Require private diligence package or walk away from the price
  notes: These are investment-discipline thresholds rather than management guidance. Each one would either compress the multiple, reduce exit-value capture, or both.
