- id: TV006
  title: Final diligence asks table
  columns:
  - Priority
  - Topic
  - Missing evidence
  - Why it matters
  - Diligence path
  rows:
  - - 1 (Critical)
    - Current ARR and growth bridge
    - No public 2026 ARR figure or month-by-month bridge from the June 2025 $100M milestone
    - Determines whether the business deserves 8x, 10x, or 15x ARR treatment
    - Request latest ARR, bookings, and trailing-12-month growth by quarter
  - - 2 (Critical)
    - NRR / GRR by segment
    - No public retention data for MSP, enterprise, or public-sector cohorts
    - Retention is one of the strongest drivers of durable software multiples
    - Review cohort tables, gross retention, and expansion by product and customer segment
  - - 3 (Critical)
    - Gross margin and services mix
    - Profitability is claimed, but gross margin and services attach remain private
    - Separates premium software economics from lower-multiple service-heavy economics
    - Request audited P&L, gross-margin bridge, and revenue mix by software vs. services
  - - 4 (Critical)
    - Exact Series C valuation, ownership sold, and preference stack
    - The round was minority and $1B+, but exact post-money and liquidation terms are undisclosed
    - Return capture can differ dramatically between enterprise value and common-equity value
    - Obtain cap table, term sheet summary, and waterfall analysis
  - - 5 (High)
    - Concentration and channel quality
    - No public top-customer or top-partner concentration, renewal, or attach-rate data
    - A Microsoft- and partner-led motion can hide material concentration risk
    - Request top-20 customer/partner exposure and renewal history
  - - 6 (High)
    - Cash flow quality and exit path
    - No public cash balance, burn, secondary-clearing data, or board-level liquidity timing
    - Investors cannot price time-to-liquidity or down-round risk without it
    - Review cash bridge, board materials, and any banker or secondary-market process data
  notes: Items 1-4 are blocking for conviction above the disclosed floor. Items 5-6 calibrate downside protection and realistic exit timing.
