  - Status
  - Revenue / ARR anchor
  - Valuation / market cap anchor
  - Implied multiple
  - Comp relevance
  - Limitation
  rows:
  - - Nerdio
    - Private — Microsoft EUC management
    - $100M+ ARR (Jun 2025); public 2026 forward scenario likely higher
    - $1.0B+ disclosed floor (Mar 2025)
    - ~10x on disclosed ARR floor; lower on forward ARR
    - Subject company; category leader with profitability claim
    - Exact post-money and current ARR are undisclosed
  - - Qualys
    - Public — mature profitable cybersecurity software
    - TTM sales implied from market cap / PS ratio on May 22, 2026
    - ~$3.61B market cap; ~5.26x PS
    - ~5.3x sales
    - Useful mature, profitable software floor comp
    - Lower growth and different product scope than Nerdio
  - - Rapid7
    - Public — slower-growth cybersecurity platform
    - TTM sales implied from market cap / PS ratio on May 22, 2026
    - ~$486M market cap; ~0.57x PS
    - ~0.6x sales
    - Downside comp showing how hard multiples can compress when growth and leverage disappoint
    - Rapid7 is more distressed and more indebted than Nerdio appears to be
  - - Snowflake
    - Public — premium cloud data platform
    - TTM sales implied from market cap / PS ratio on May 22, 2026
    - ~$59.46B market cap; ~12.69x PS
    - ~12.7x sales
    - Upper-mid premium cloud benchmark for sustained growth
    - Much broader product scope and weaker profitability profile than Nerdio
  - - Datadog
    - Public — premium observability platform
    - TTM sales implied from market cap / PS ratio on May 22, 2026
    - ~$79.14B market cap; ~21.55x PS
    - ~21.6x sales
    - Shows how the market rewards broad platform control and high expansion potential
    - Not Microsoft-dependent and far more broadly horizontal
  - - CrowdStrike
    - Public — premium security platform
    - TTM sales implied from market cap / PS ratio on May 22, 2026
    - ~$168.87B market cap; ~35.09x PS
    - ~35.1x sales
    - Ceiling comp for category-defining security platform economics
    - Multiple reflects platform breadth and market leadership well beyond Nerdio's current disclosure set
  - - Axonius
    - Private — cyber asset intelligence
    - $151.5M 2024 revenue; $200M ARR milestone in May 2026
    - $2.6B valuation in 2024 Series E
    - ~17x on 2024 revenue; lower on later ARR milestone
    - Relevant late-stage private cyber platform reference near Nerdio's scale band
    - Valuation and ARR dates are not perfectly matched
  - - Cribl
    - Private — telemetry / data infrastructure
    - $100M+ ARR by Oct 2023; $200M ARR Jan 2025; $300M ARR Feb 2026
    - $3.5B valuation in Aug 2024 Series E
    - ~35x on $100M floor; materially lower on later ARR milestones
    - Shows private investors still pay premium multiples for rapid infra-software growth
    - Broader infrastructure category and multi-product adoption make it an aspirational, not direct, peer
  notes: Public company multiples come from May 22, 2026 stock-market data pages. Private rows use the latest publicly disclosed valuation and ARR/revenue milestones and therefore should be read as directional reference points rather than perfectly time-matched trading multiples.
