- id: TV004
  title: Comparable valuation table
  enumerationScope:
    coverage: partial
    basis: Covers the most decision-relevant public and private cloud/security software benchmarks with usable May 2026 valuation or revenue signals, but remains partial because many private Microsoft-partner and cybersecurity peers do not publish current ARR or exact post-money values.
  columns:
