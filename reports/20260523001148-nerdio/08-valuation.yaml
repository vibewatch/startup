- id: comparable-set-and-multiple-benchmarking
  title: Comparable set and multiple benchmarking
  body: 'The comparable set argues against two simplistic mistakes: treating Nerdio like a distressed niche tool or treating it like a fully disclosed best-in-class cloud platform. Mature profitable cybersecurity/software names such as Qualys trade in a mid-single-digit sales range, while Rapid7 shows how brutally the market discounts slower growth and leverage. By contrast, high-growth cloud and security leaders such as Snowflake, Datadog, and CrowdStrike still command double-digit to very high double-digit revenue multiples in May 2026. Nerdio''s disclosed 2025 floor multiple of roughly 10x ARR lands between those extremes. That is too high for a low-growth mature software vendor, but still meaningfully below premium public leaders that offer deeper disclosure and broader product control. Private milestone references tell a similar story. Axonius and Cribl have both shown that investors will pay strong double-digit ARR multiples for late-stage infrastructure/security leaders when growth
    and category ownership are evident. Yet those businesses are also broader category platforms with different data advantages and, in Cribl''s case, very strong reported NDR. The best reading is that Nerdio deserves a premium to mature cyber floors because of growth and capital efficiency, but also a platform-dependency and disclosure discount relative to the top public and private software outliers.'
