- id: thesis-breaks-and-final-diligence
  title: Thesis-break triggers, exit readiness, and final diligence asks
  body: 'The important valuation risks are concrete and monitorable. The first is Microsoft convergence risk: if Microsoft narrows the operational gap enough through Windows 365, Azure Virtual Desktop, Intune, or bundled management features, Nerdio''s convenience premium can compress fast. The second is hidden business-quality risk. A company can grow quickly and still be worth less than expected if net retention is weak, gross margins are below software norms, or partner/customer concentration is high. The third is security-holder economics: without the exact Series C ownership sold, cap-table waterfall, and preference terms, public observers cannot know how much exit value actually flows to common or new secondary buyers. Exit readiness is therefore not fully underwriteable from public evidence. There is no public S-1, tender history, or disclosed sale process. What the public record does show is that Nerdio is well-capitalized enough to choose timing rather than be forced into it. That
    makes the diligence path straightforward. Before paying above the disclosed floor, an investor should demand current ARR and NRR, gross-margin and cash-flow evidence, exact dilution/preference terms, segment mix, concentration data, and explicit proof that Microsoft platform dependence is creating defensible workflow lock-in rather than temporary convenience.'
