  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: post-money-range
    missingEvidence: Exact Series C ownership sold, exact post-money valuation, and any side-letter or structured preference terms.
    whyItMatters: Without the round math and liquidation stack, investors cannot convert enterprise-value scenarios into actual security-holder returns.
    diligencePath: Request the Series C term sheet summary, updated cap table, and waterfall analysis from management or lead investors.
    relatedQuestionRefs:
    - QV008
    - QV028
  - type: private-evidence-only
    severity: blocking
    topic: quality-of-revenue
    missingEvidence: Current ARR bridge, NRR / GRR by segment, gross margin, and software-versus-services mix.
    whyItMatters: These are the variables that determine whether Nerdio deserves a premium software multiple or a discounted platform-dependent multiple.
    diligencePath: Obtain cohort retention tables, audited P&L data, and management commentary on segment mix under NDA.
    relatedQuestionRefs:
    - QV025
    - QV027
  - type: private-evidence-only
    severity: material
    topic: liquidity-path
    missingEvidence: Any board-sanctioned IPO, tender, or sale process timeline plus recent secondary-clearing evidence.
    whyItMatters: Hold period and realized return depend on a credible liquidity path, not just a paper valuation range.
    diligencePath: Review banker materials, board minutes, and any secondary-market transaction history.
    relatedQuestionRefs:
    - QV029
  - type: conflicting-data
    severity: material
    topic: current-arr-vintage
    missingEvidence: A clean 2026 ARR datapoint that supersedes the June 2025 milestone and resolves whether scenario math should anchor to ~$100M, ~$150M, or higher.
    whyItMatters: Small changes in ARR assumptions materially change implied multiples and therefore the fair-value range.
    diligencePath: Request monthly ARR bridge and latest board-ready KPI pack.
    relatedQuestionRefs:
    - QV007
    - QV022
    - QV023
    - QV024
  - type: enumeration-incomplete
    severity: minor
    topic: comparable valuation table coverage
    missingEvidence: A broader set of private Microsoft-adjacent management-software peers with disclosed ARR and valuation data.
    whyItMatters: The current comparable set is decision-useful but still partial because many relevant private peers do not publish both valuation and revenue.
    diligencePath: Use paid databases or investor materials to expand the private comparable set and normalize revenue vintages.
    relatedQuestionRefs:
    - QV018
    - QV019
    - QV020
    relatedTableRefs:
    - TV004
