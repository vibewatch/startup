- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Dimension
  - Thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Growth quality
    - Nerdio disclosed >85% YoY ARR growth and crossed $100M ARR while staying profitable and debt-free.
    - Exact NRR, gross margin, and current growth rate are still private, so the public story may overstate quality-of-growth.
    - Release current ARR bridge, NRR, gross margin, and cohort retention.
  - - Financing quality
    - $500M of minority Series C capital from General Atlantic is consistent with offense, not rescue financing.
    - Exact ownership sold and post-money valuation remain undisclosed, so investors cannot fully price dilution or preference overhang.
    - Disclose stake sold, post-money value, and full preference terms.
  - - Category position
    - The company appears to be the leading Microsoft EUC management layer with strong customer and user scale.
    - Platform dependence on Microsoft can cap strategic control and justify a discount to broader horizontal SaaS leaders.
    - Show persistent win rates, workflow lock-in, and pricing power despite Microsoft native evolution.
  - - Customer value
    - Official and third-party sources repeatedly cite meaningful Azure cost savings and simplified operations.
    - Review sources also flag vendor lock-in, cost sensitivity for smaller buyers, and skill requirements.
    - Prove broad-market retention and expansion across SMB, MSP, and enterprise cohorts.
  - - Exit path
    - Profitability and large cash proceeds imply Nerdio can choose timing for an IPO or sale.
    - No public S-1, tender history, or sale process means liquidity timing and common-equity outcomes remain underdetermined.
    - Provide board-approved liquidity timeline and cap-table waterfall analysis.
  notes: This balance sheet is framed only from retained public evidence. Missing private-company disclosures are treated as unresolved underwriting variables rather than guessed away.
