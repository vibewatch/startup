evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: ownership structure
    missingEvidence: >
      Cap table showing equity percentages for all investor groups (MK Capital, Updata Partners, General Atlantic, Lead
      Edge Capital, StepStone) and the co-founders.
    whyItMatters: >
      Without ownership structure, it is impossible to assess alignment of interest, liquidation waterfall, or whether
      any single investor has blocking rights on strategic decisions.
    diligencePath: >
      Request cap table from Nerdio during due diligence; review investor rights agreement and certificate of
      incorporation for class structure and voting rights.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: SaaS financial metrics
    missingEvidence: >
      Gross margin percentage, net revenue retention (NRR), customer acquisition cost (CAC), customer lifetime value
      (LTV), and operating burn rate or cash flow statement.
    whyItMatters: >
      These are the standard metrics for SaaS valuation analysis. Without them, the $1B+ valuation cannot be
      triangulated against industry comps, and the quality of Nerdio's revenue growth cannot be assessed (e.g., high NRR
      would confirm land-and-expand; low NRR would flag churn risk).
    diligencePath: >
      Request management accounts and SaaS metrics dashboard during due diligence; compare to Rule of 40 benchmarks for
      comparable infrastructure SaaS companies.
    relatedQuestionRefs:
      - QO009
      - QO014
  - type: private-evidence-only
    severity: material
    topic: Series C valuation
    missingEvidence: >
      Precise post-money valuation from the Series C. The public record states only "$1B+" and "north of $1B"; whether
      this is $1.0B, $1.2B, or higher is not confirmed in any public source.
    whyItMatters: >
      Valuation precision matters for determining implied ARR multiple and comparative positioning against EUC software
      peers. A $1.0B vs $1.5B figure implies materially different investor return expectations.
    diligencePath: >
      Review Series C term sheet and investor presentation (Series C closing documents would disclose post-money
      valuation); alternatively, confirm through General Atlantic or JP Morgan relationships.
    relatedQuestionRefs:
      - QO006
  - type: missing-source
    severity: minor
    topic: regulatory certifications
    missingEvidence: >
      SOC 2 Type II audit report, ISO 27001 certificate, FedRAMP authorization status, and any HIPAA Business Associate
      Agreement (BAA) standard terms.
    whyItMatters: >
      Enterprise and government customers typically require these certifications; confirming their existence (or
      absence) affects Nerdio's addressable government market and enterprise security posture assessment.
    diligencePath: >
      Request from Nerdio directly; check their trust center or security documentation portal; review the legal hub for
      any SOC/ISO references.
    relatedQuestionRefs:
      - QO010
      - QO024
  - type: missing-source
    severity: minor
    topic: current pricing model
    missingEvidence: >
      Nerdio's current per-user or per-tenant pricing for Nerdio Manager for MSP and Nerdio Manager for Enterprise as of
      2026. The $3/user/month enterprise figure is from a 2022 press interview and may not reflect current pricing
      tiers.
    whyItMatters: >
      Pricing changes directly affect revenue model analysis, gross margin estimation, and competitive positioning
      against Citrix, Omnissa, and native Microsoft consoles.
    diligencePath: >
      Review current Nerdio pricing page (if public) or request current price book from sales team; compare to Azure
      Marketplace listing for any published pricing.
    relatedQuestionRefs:
      - QO022
  - type: missing-source
    severity: minor
    topic: Microsoft partnership terms
    missingEvidence: >
      Specific terms of Nerdio's Microsoft ISV, co-sell, and Azure Marketplace agreements, including revenue-sharing
      arrangements, exclusivity clauses, and API access terms.
    whyItMatters: >
      Microsoft's ability to modify API access, co-sell incentives, or platform bundling is Nerdio's core strategic
      risk; understanding the contractual protections (if any) is critical to evaluating the durability of Nerdio's
      competitive position.
    diligencePath: >
      Review Microsoft Partner Agreement and any co-sell addenda in due diligence; discuss directly with Nerdio's
      business development team responsible for the Microsoft relationship.
    relatedQuestionRefs:
      - QO019
      - QO020
  - type: missing-source
    severity: minor
    topic: milestone table completeness
    missingEvidence: >
      Nerdio has not published a complete corporate chronology. Internal product launches, individual major contract
      wins, regulatory events, and minor office openings may not be reflected in the milestone table, which is limited
      to publicly disclosed events.
    whyItMatters: >
      A complete milestone table supports pattern recognition of growth velocity, executive decision timing, and adverse
      event clustering. Missing milestones could obscure product delays, competitive responses, or adverse governance
      events.
    diligencePath: >
      Request board meeting minutes and management presentation history during due diligence; cross-reference LinkedIn
      company timeline and Wayback Machine archived pages for product launch dates and announcements not captured in
      press releases.
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: microsoft-euc-management-sam
    missingEvidence: >
      A public source that isolates AVD and Windows 365 deployed-seat counts plus attach rates for third-party
      management tools such as Nerdio.
    whyItMatters: >
      Without a direct installed-base and attach-rate source, the chapter can only offer directional SAM scenarios
      instead of a source-backed SAM or SOM.
    diligencePath: >
      Request Microsoft-installed-base disclosures, partner analytics, or internal Nerdio cohort data showing AVD/W365
      seats under management and attach rates to paid automation tooling.
    relatedQuestionRefs:
      - QM007
      - QM025
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: segment-mix
    missingEvidence: |
      Revenue, seat, and gross-margin mix split across MSP, enterprise, and public-sector customers.
    whyItMatters: >
      Buyer segmentation is central to valuation, but public proof of segment weighting is absent, making it impossible
      to convert the buyer map into a precise revenue-weighted SOM view.
    diligencePath: >
      Request management reporting that breaks ARR, seats, churn, and margin by segment and geography, then reconcile it
      against partner-channel pipeline data.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: minor
    topic: regional-network-readiness
    missingEvidence: >
      Public evidence tying broadband quality, latency, or cloud-desktop infrastructure readiness by region to actual
      Nerdio adoption outcomes.
    whyItMatters: >
      The chapter can show North America concentration and APAC growth, but it cannot cleanly quantify how network
      readiness or regional infrastructure limits adoption in practice.
    diligencePath: >
      Request regional deployment data, customer reference distributions, and support-ticket patterns that show whether
      latency or infrastructure quality affects win rates or expansion.
    relatedQuestionRefs:
      - QM021
    relatedTableRefs:
      - TM004
  - type: missing-source
    severity: minor
    topic: pricing-realization
    missingEvidence: >
      Current public price book and realized ARPU across Nerdio Manager for Enterprise and MSP products; the retained $3
      per-user figure is from 2022 and the MSP model has changed since then.
    whyItMatters: >
      The directional SAM scenario depends on price assumptions, so stale or unrepresentative pricing can materially
      distort the SAM lens.
    diligencePath: >
      Request the current product price book, discount policy, and realized net pricing by cohort; reconcile per-user
      and per-tenant models before using pricing in valuation work.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: market-size-definition-conflict
    missingEvidence: >
      A normalized analyst comparison that harmonizes VDI, desktop virtualization, DaaS, and management-tool definitions
      across the major reports.
    whyItMatters: >
      The retained analyst estimates are directionally useful but too inconsistent to average into a single confident
      TAM without losing important scope differences.
    diligencePath: >
      Obtain full analyst methodologies or build a normalized bottoms-up market map that separates infrastructure,
      platform, and management-software revenue pools before using a headline TAM in valuation.
    relatedQuestionRefs:
      - QM005
      - QM023
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: nerdio-pricing-transparency
    missingEvidence: >-
      Current public or customer-facing rate card for Nerdio Manager for MSP and Nerdio Manager for Enterprise,
      including discount ladders or minimum commitments.
    whyItMatters: >-
      Without a current price sheet, buyers and investors cannot benchmark Nerdio's value proposition cleanly against
      native Microsoft packaging or incumbent quote-led alternatives.
    diligencePath: >-
      Request the current MSP and enterprise pricing decks, reseller schedules, and one recent redacted quote for each
      product.
    relatedQuestionRefs:
      - QP018
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: competitive-win-rates
    missingEvidence: >-
      Quantified win-loss, conversion, and churn data by competitor class, especially versus Microsoft native tools,
      Citrix, and Omnissa.
    whyItMatters: >-
      The moat thesis is much stronger if Nerdio is consistently displacing named rivals rather than merely riding
      general Microsoft cloud growth.
    diligencePath: >-
      Request CRM-level win-loss reporting, top 20 displacement deals, and renewal data segmented by source platform or
      incumbent environment.
    relatedQuestionRefs:
      - QP024
    relatedTableRefs:
      - TP004
  - type: missing-source
    severity: material
    topic: microsoft-native-encroachment
    missingEvidence: >-
      Evidence on which specific native Microsoft roadmap items are closing the feature gap and whether those changes
      are affecting Nerdio upsell, retention, or pricing.
    whyItMatters: >-
      Microsoft is both partner and existential competitive risk, so feature compression matters more than almost any
      single external competitor headline.
