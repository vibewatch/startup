- id: trust-compliance-and-technical-risks
  title: Trust, compliance, and technical risks
  body: Trust signals are real but incomplete. Public materials support a privacy-policy baseline, CIS benchmark certification for a specific Nerdio Manager for MSP release, and public-sector marketing that positions the product for GDPR-, HIPAA-, and NIST-oriented environments. Training and partner-support materials also reduce adoption friction by showing that Nerdio has built an enablement layer around the product, not just the software itself. The gap is what is not publicly easy to inspect. In the reviewed source set, there was no accessible public SOC 2 Type II or ISO 27001 disclosure, and no clear public SLA, incident-history, or status-page evidence. Those omissions matter because Nerdio’s technical story is not infrastructure independence; it is a Microsoft-bound orchestration layer. That means platform dependence on Microsoft APIs, native feature expansion, and vendor-grade security/reliability documentation are all central diligence items, not side questions. The product can still
    be credible, but larger enterprise diligence will likely turn on private documentation rather than public website comfort signals.
