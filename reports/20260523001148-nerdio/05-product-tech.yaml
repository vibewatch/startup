  evidenceGaps:
  - type: missing-source
    severity: material
    topic: security-attestations
    missingEvidence: Customer-facing SOC 2 Type II, ISO 27001, DPA, or comparable audit-package artifacts.
    whyItMatters: Enterprise procurement and security underwriting usually need formal attestation documents, not just privacy-policy and benchmark-certification pages.
    diligencePath: Request Nerdio’s security portal package, most recent audit reports, bridge letters, DPA, and any customer-facing control mappings.
    relatedQuestionRefs:
