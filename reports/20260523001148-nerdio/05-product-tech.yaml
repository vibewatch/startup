  - type: missing-source
    severity: material
    topic: reliability-transparency
    missingEvidence: Public SLA language, status-page history, incident postmortems, or published RTO/RPO commitments.
    whyItMatters: These artifacts are needed to judge whether Nerdio’s control-plane role introduces meaningful operational or contractual risk for enterprise customers.
    diligencePath: Request the standard MSA/SLA, status-portal access, uptime history, and summaries of major incidents or support-severity escalations.
