- id: architecture-and-operating-model
  title: Architecture and operating model
  body: 'Technically, Nerdio appears to be an orchestration and workflow layer that sits on top of Microsoft control planes rather than a replacement infrastructure stack. Microsoft’s own documents show that Azure Virtual Desktop and Intune are cloud services with API-addressable control surfaces, and Microsoft Marketplace plus review material describe Nerdio as an Azure application or packaged Microsoft application deployed in the customer’s own tenant. That is an important architecture signal: the product’s value comes from simplifying configuration, standardizing policy, and automating repetitive work across AVD, Windows 365, Intune, and related Microsoft 365 surfaces. For MSPs, the operating flow starts with assessment and pricing, moves into deployment and policy setup, then shifts into monitoring, support, and cost optimization across many tenants. For enterprise buyers, the flow is more migration- and governance-centric. Either way, the product’s control model is cloud-native and
    Microsoft-bound, with very little public evidence of required on-prem control components.'
