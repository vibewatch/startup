summary:
  headline: >
    Nerdio is the category-leading Microsoft EUC management platform with $100M+ ARR, 85%+ growth, profitable
    operations, and unicorn status, but is subject to existential single-vendor risk from Microsoft and financial
    opacity that limits investment-grade due diligence.
