companyProfile:
  summary: >
    Nerdio is a Chicago-based SaaS company that helps managed service providers and enterprise
    IT teams automate and optimize Microsoft cloud environments—specifically Azure Virtual Desktop
    (AVD), Windows 365, Microsoft Intune, and Microsoft 365. Originally created as an internal
    division of managed service provider Adar in 2016, Nerdio was incorporated as an independent
    company in January 2020 by co-founders Vadim Vladimirskiy (CEO) and Joseph Landes (President).
    In March 2025, Nerdio raised $500M in a Series C led by General Atlantic at a $1B+ valuation,
    becoming a unicorn and reaching $100M+ ARR by June 2025.
  foundedDate: "2020-01-01"
  founders:
    - name: "Vadim Vladimirskiy"
      role: "Co-Founder & CEO"
      background: "Founded Adar MSP in 2005; built Nerdio technology within Adar from 2016"
      claimRefs:
        - CO009
    - name: "Joseph Landes"
      role: "Co-Founder & President"
      background: "23-year Microsoft executive; joined Adar/Nerdio as co-founder in 2018"
      claimRefs:
        - CO010
  foundingLocation: "Chicago, Illinois, USA"
  headquarters: "Chicago, Illinois, USA (remote-first)"
  productSummary: >
    Two products: Nerdio Manager for MSP (multi-tenant cloud management for managed service
    providers; auto-scaling, cost optimization, AVD/W365/Intune/M365 management from a single
    pane) and Nerdio Manager for Enterprise (direct enterprise IT management of AVD and Windows
    365 environments; automated provisioning, compliance, and cost optimization).
  customerFocus: >
    Managed service providers (MSPs) managing Microsoft cloud environments for SMB and enterprise
    clients; and enterprise IT teams at organizations with 1,000–100,000+ employees running or
    migrating to Azure Virtual Desktop or Windows 365.
  businessModel: >
    SaaS subscription. MSP product is priced per-MSP (flat rate per managed tenant or per
    organization, with usage-based scaling). Enterprise product is priced per-user-per-month
    (~$3/user/month as of 2022; current pricing undisclosed). Revenue is ARR-based and recurring.
  stage: "Series C (March 2025)"
  fundingStatus: >
    $625M total raised: $8M Series A (MK Capital, Feb 2020), $117M Series B (Updata Partners,
    Dec 2022), $500M Series C (General Atlantic lead + Lead Edge Capital + StepStone, Mar 2025);
    valuation $1B+ at Series C. Profitable and debt-free per company disclosure.
  disclosureProfile: "private-undisclosed"
