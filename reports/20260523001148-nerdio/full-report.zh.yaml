      - number: '8.3'
        title: 可比公司组和倍数基准
        blocks:
          - type: paragraph
            body: >-
              可比公司组反对两个简单错误：把 Nerdio 当成承压的利基工具，或把它当成披露充分的一流云平台。Qualys 这类成熟盈利的网络安全 / 软件公司，销售倍数处于中个位数区间；Rapid7
              则说明市场会多么严厉地折价较慢增长和杠杆。相反，Snowflake、Datadog 和 CrowdStrike 这类高增长云与安全领导者，在 2026 年 5 月仍享有两位数到很高两位数的收入倍数。Nerdio
              披露的 2025 年估值下限约为 10x ARR，落在两个极端之间。这个水平对低增长成熟软件厂商太高，但仍显著低于披露更深入、产品控制更广的高溢价上市领导者。私有市场里程碑引用也给出类似故事。Axonius 和
              Cribl 都证明，当增长和类别所有权清晰时，投资人愿意为后期基础设施 / 安全领导者支付强劲的两位数 ARR 倍数。不过，这些公司也是更宽的类别平台，数据优势不同；Cribl 还报道称有很强的
              NDR。最好的解读是，凭借增长和资本效率，Nerdio 应该较成熟网络安全公司的估值下限享有溢价；但相对顶级公私软件异常值，也应承受平台依赖和披露折价。
