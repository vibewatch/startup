      - number: '3.4'
        title: 护城河耐久性与结论
        blocks:
          - type: paragraph
            body: >
              竞争结论正面，但边界很窄。Nerdio 看起来最适合客户想要 Microsoft 原生优化层，而不是完整替代 VDI 宇宙的场景：需要多租户控制的 MSP、正从遗留 VDI
              复杂度中迁出的企业，以及重视策略自动化、合规和 Azure 成本纪律的公共部门团队。这是真实护城河，因为 Citrix 和 Omnissa 针对的是更宽的部署灵活性，而 Microsoft 自有工具仍会留下
              Nerdio 可以打包进更有主张产品的运维工作。但护城河并非牢不可破。Microsoft 原生基线正在变得更便宜、更容易购买，公开来源不披露当前 Nerdio 精确标价或竞争胜率，最缺的硬证据仍是
              Microsoft 不断改进的管理界面是否正在压缩一线续约或扩张经济性。正确的承销视角是：Nerdio 拥有强劲的近期利基和可替换的可信既有厂商，但长期定价权取决于在自动化深度、MSP 工作流和治理上持续领先
