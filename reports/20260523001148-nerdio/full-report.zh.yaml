      - number: '8.5'
        title: 论点破裂触发器、退出准备度和最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              关键估值风险具体且可监测。第一是 Microsoft 收敛风险：如果 Microsoft 通过 Windows 365、Azure Virtual Desktop、Intune
              或捆绑管理功能，把运营缺口缩窄到足够小，Nerdio 的便利性溢价会迅速压缩。第二是隐藏的业务质量风险。公司可以增长很快，但如果净留存偏弱、毛利率低于软件常模，或合作伙伴 /
              客户集中度高，价值仍可能低于预期。第三是证券持有人经济性：如果不知道 Series C
              出售的准确股权、股权结构表分配瀑布和优先权条款，公开观察者就无法知道退出价值有多少真正流向普通股或新的二级买方。因此，公开证据还无法充分承销退出准备度。没有公开
              S-1、要约回购历史或已披露出售流程。公开记录能说明的是，Nerdio 资本足够充裕，可以选择时点，而不是被迫行动。这让尽调路径很直接。在支付高于披露下限的价格之前，投资人应要求当前 ARR 和
              NRR、毛利率和现金流证据、准确稀释 / 优先权条款、客群结构、集中度数据，并明确证明 Microsoft 平台依赖正在形成可防御的工作流锁定，而不是临时便利。
