      - number: '4.4'
        title: 财务结论、资本强度与尽调阻塞点
        blocks:
          - type: paragraph
            body: >-
              财务结论是：商业质量有吸引力，披露质量不完整。公开证据强力支持经常性软件模型、成本节省驱动的价值主张、有意义的渠道杠杆，以及一家在接受巨额成长轮前已经盈利的公司。资本强度也看起来低于许多基础设施或垂直软件同行，因为
              Nerdio 没有可见的制造、库存或项目融资义务；成本基础看起来主要由工程、客户成功、销售、合作伙伴赋能和 Azure 相邻支持构成。同时，确信度确有约束。Microsoft 正在下调 Windows 365
              SMB 价格，Azure Virtual Desktop 仍是原生按量付费基线，Nerdio 还必须保留足够 ROI 差额，才能证明附着层订阅合理。公开评论也显示小客户存在价格敏感，并依赖 Azure
              专业能力。剩余尽调阻塞点是典型未上市 SaaS 盲区：毛利率、NRR、CAC / 回本、收入组合、地域组合、合同期限、集中度和现金跑道。投资人可以承销 Nerdio
              很可能是一门好生意；没有私有财务文件，就无法负责任地承销这门生意的精确质量。
