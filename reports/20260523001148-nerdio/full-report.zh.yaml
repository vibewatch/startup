      - number: '7.4'
        title: 财务不透明和集中度不确定性，比当前压力信号更重要
        blocks:
          - type: paragraph
            body: >-
              Nerdio 的财务风险案例不太寻常：公开可见的收入顶线很强，但可承销的中间层缺失。融资、ARR 规模和估值已足够可见，足以说明 Nerdio 是一家严肃公司：公司在 Series C 以披露的 10
              亿美元以上估值融资 $500M，此前已完成 $117M Series B 和 $8M Series A，并在 2025 年公开跨过 $100M ARR。这些事实意味着，在公开下限上至少约 10x
              ARR；如果增长放缓或 Microsoft
              竞争加剧，就有实质性的倍数压缩风险。与此同时，公开证据里公司的盈利能力只停留在自我陈述层面：保留下来的来源没有披露毛利率、NRR、CAC、回本期、烧钱速度、现金跑道或集中度。这个缺口很关键，因为在合作伙伴驱动、Microsoft
              中心的 GTM 动作里，渠道集中度尤其可能存在；但已审阅来源没有披露头部合作伙伴或头部客户暴露。评论证据还补充了另一层细微差别：Nerdio 显然对许多 MSP
              用户有价值，但部分第三方来源仍提示小企业负担能力、Azure 锁定和技能要求。结果是，公司看起来成功，却无法只靠公开数据完全定价。
