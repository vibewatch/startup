      - number: '1.4'
        title: 规模指标、经营里程碑与增长轨迹
        blocks:
          - type: paragraph
            body: >
              Nerdio 的增长轨迹显示出企业 SaaS 公司中的强劲速度。ARR 在 June 2025 超过 $100M，公司独立运营仅略超五年即达成这一水平。March 2025 C 轮时，Nerdio 披露 ARR
              同比增长 85%+，在 50+ 国家 / 地区拥有 15,000+ 客户。到 June 2025 的 ARR 里程碑新闻稿中，客户数仍写为 15,000+；而 May 2026 主页披露 23,000+ 客户和
              6.5M 用户，反映客户获取仍在快速推进。员工数在 2025 年增长 82%，March 2025 基数约 300 人，意味着 2025 年底约 546 人。公司已宣布各部门继续招聘。

              关键企业客户案例包括 Chevron、Kraft Heinz、ASDA、Carnival Cruise Line、Willis Towers Watson、Penn State
              University、Setfords、Sage 和 Teleperformance。MSP 牵引力由 PartNERD 合作伙伴计划和 Azure Marketplace 上架支撑。公司称每年影响超过
              $350M 的 Microsoft 收入（公司声称，未经 Microsoft 独立验证）。Nerdio 获得 2024 Microsoft Americas Partner of the Year 奖，并举办名为
              NerdioCon 的年度用户与合作伙伴大会。年度合作伙伴奖项计划（NerdioCon 2026 于 2026 年举办）显示生态正在成熟。

              地理上，Nerdio 已从 North America 扩展至 UK、EMEA（包括 Benelux、Southern Europe 和 UAE）、APAC（包括 Japan 和 Australia）以及
              Latin America（包括 Mexico 和 Brazil）的办公室或运营。Japan 国家经理 Tatsuro Sugiyama 于 November 2025 获任，标志着正式进入日本数字化转型市场。与
              Carahsoft 的合作把 Nerdio 的覆盖延伸到美国联邦政府和公共部门客户。
