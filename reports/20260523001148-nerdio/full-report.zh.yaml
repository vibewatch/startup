          - type: paragraph
            body: >-
              按已披露下限看，牵引力和资本故事很强。Nerdio 在 March 2025 宣布 $500M 少数股权 C 轮，估值 $1B+，称自身已盈利、无债务，并以超过 85% 的 ARR 同比增速扩张。到 June
              2025，公司披露 ARR 突破 $100M，过去一年新增 400+ 企业客户，并服务 15,000+ 组织；到 May 2026，主页声称 23,000+ 客户和 6.5M 用户。因此，公开披露的累计融资为
              $625M，来自 $8M A 轮、$117M B 轮 和 $500M C 轮。从方向上看，公开资本充足度有利，因为一家盈利、无债务的公司以少数股权条款融资
              $500M，并不像紧急融资候选者。但当前现金余额、烧钱速度、现金跑道和下一轮触发条件仍都隐藏。也就是说，区间测算必须保持情景化：公开下限意味着在 June 2025 里程碑时约 10x ARR
              倍数；如果用保持增长率的思想实验推演，ARR 若持续扩张到 2026 年，该倍数会明显压缩。业务看起来资本充足；精确缓冲仍属私有信息。
