              Nerdio 整个产品组合都架在 Microsoft 专有云平台之上。如果 Microsoft 把原生管理能力打包进管理控制台、调整 API 访问政策，或改变渠道策略，Nerdio
              的价值主张可能被显著稀释，且缺少结构性补救。这是投资逻辑中最重要的风险，值得对合同条款和合作伙伴权利做专项尽调。
