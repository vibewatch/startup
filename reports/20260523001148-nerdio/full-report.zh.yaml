  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议、信心和入场纪律
        blocks:
          - type: paragraph
            body: >-
              公开证据支持建设性但有纪律的立场。Nerdio 显然已经不是早期概念验证公司：Series C 从 General Atlantic 引入 $500M 少数股权资本，公司披露 10
              亿美元以上估值下限，几个月内又公开跨过 $100M
              ARR，并反复称自己盈利、无债。这个组合让单纯「回避」的结论很难从现有记录中站住脚。与此同时，公开材料还不足以支持自动给出高增长溢价承销。准确的投后估值没有披露，出售股权比例没有披露，外界仍看不到净收入留存、毛利率、现金消耗，或决定普通股回报的优先权结构。因此，本章层面的正确建议是带建设性倾向的跟踪
              / 继续研究，而不是强买入。信心为中等，不是低，因为披露的估值下限真实且有交叉佐证；风险为高，因为 Microsoft
              依赖和私人公司不透明仍可能压缩回报。入场纪律比公司质量本身更重要。接近公开下限买入的买方，可以合理主张定价公平到有吸引力；如果买入价显著高于约 $1.25-$1.5
              billion，则需要私有数据确认增长、留存和利润率质量足以支撑更高倍数。
