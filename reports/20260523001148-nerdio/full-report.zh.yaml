      - number: '2.3'
        title: 增长驱动、约束与保留的尽调缺口
        blocks:
          - type: paragraph
            body: >
              增长逻辑真实存在，但并非没有摩擦。分析师和平台来源一致指向混合办公、BYOD、云交付、安全 / 合规要求，以及 Microsoft 自身持续推动 Azure Virtual Desktop 和 Windows
              365，作为需求驱动。Nerdio 的价值主张适配这一环境，因为它承诺让 Microsoft 原生云环境运维更简单、单位经济性更好。同时，这个市场有影响估值的结构性约束。第一，Microsoft
              依赖不是脚注：Nerdio 搭乘的是一个由他人拥有的技术栈，而这个所有者已经提供原生管理界面，并且可以持续改进。第二，既有替代方案仍有可信度。Citrix 和 Omnissa 仍在营销完整虚拟桌面和 DaaS
              方案，而 Microsoft 也记录了与 Omnissa Horizon 共存的路径，并非只有单向迁移叙事。第三，技能和实施复杂度仍是门槛。Nerdio
              University、合作伙伴赋能内容和负面评论都显示，当组织已经感受到有意义的 Azure/Microsoft 运维痛点后，产品吸引力最强。第四，不能过度解读宽泛市场估计。一个 $10.26B 的低端 2026
              市场和一个 $23.85B 的高端 2026 市场，不可能都被当作精确真相。正确的尽调姿态，是保留这些相互矛盾的估算，把推导出的 SAM 视为方向性数字，并在声称清晰 SOM
              前要求公司提供关于附着率、细分市场组合和实际定价的私有证据。
