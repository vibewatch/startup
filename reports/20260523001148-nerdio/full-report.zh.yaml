  - id: FI002
    title: 单位经济模型桥
    type: flow
    layout: wide
    summary: 从渠道或企业评估，到客户节省、部署杠杆和经常性收入的定性单位经济循环。
    approximationNotes: 公开来源披露的是成果指标和工作流压缩，不是 CAC 或留存测算。因此，这座桥使用客户证据和运营逻辑，而不是完整的数字漏斗。
    data:
      nodes:
