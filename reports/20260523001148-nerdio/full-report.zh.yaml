            body: >-
              信任信号真实存在，但不完整。公开材料支持隐私政策基线、某一特定 Nerdio Manager for MSP 版本的 CIS 基准认证，以及面向 GDPR、HIPAA 和 NIST
              环境的公共部门营销。培训和合作伙伴支持材料也通过显示 Nerdio 已围绕产品构建赋能层，而不只是软件本身，来降低采用摩擦。缺口在于公开资料不易检查的部分。在已审阅来源集中，未看到可访问的公开 SOC 2
              Type II 或 ISO 27001 披露，也没有清晰的公开 SLA、事故历史或状态页证据。这些缺口重要，因为 Nerdio 的技术故事不是基础设施独立性；它是绑定 Microsoft 的编排层。这意味着对
              Microsoft API 的平台依赖、原生功能扩张，以及供应商级安全 / 可靠性文档，都是核心尽调项，而不是边缘问题。产品仍可能可信，但更大企业的尽调很可能取决于私有文档，而不是公开网站上的安慰信号。
