      - number: '8.4'
        title: 牛、基准、熊情景区间与回报测算
        blocks:
          - type: paragraph
            body: >-
              情景分析必须明确区分事实和建模。硬事实有限：Nerdio 披露 2025 年 3 月估值超过 $1 billion，2025 年 6 月 ARR 超过 $100 million，并称同比增长超过
              85%，同时保持盈利和无债。由此往后，情景分析取决于对 2026 ARR、增长耐久性，以及投资人如何折价 Microsoft 集中度和私人公司不透明的假设。熊情景假设增长急剧放缓，市场把 Nerdio
              按更依赖平台或带部分服务属性的软件公司定价，估值回落到公开下限附近。基准情景假设 ARR 继续复合到 $100M+
              区间中段，但由于披露质量和依赖风险仍未解决，公司仍低于高溢价上市可比公司交易。牛情景需要的不只是动能：必须有证据表明 Nerdio 能维持异常增长、保住软件型经济性，并展现足够留存和利润率质量，从而缩小与高溢价云
              / 安全同行的折价。因此，回报测算对入场价高度敏感。在公开下限或附近，非对称性仍可能成立；如果价格显著高于未披露水平，除非私有数据确认高溢价质量，否则上行空间会很快压缩。
