        - label: Intune / CIS 安全基线
          values:
            - 可信的细分强项
            - 中高 —— CIS 列表和公司博客提供具体证据
            - 认证功能集层面高
            - 中高
            - 证据聚焦具体功能，不是完整公司安全审计
        - label: 多租户 MSP 运营
          values:
            - 明确强项
            - 高 —— 在 MSP 产品、定价和应用市场材料中反复出现
            - 中等 —— 客户引述和评论聚合网站提供支撑
            - 相比原生管理分散度，高
            - 护城河取决于能否持续领先 Microsoft 管理用户体验（UX）
        - label: 企业报告 / 治理
          values:
            - 正在积极建设
            - 中等 —— 路线图和季度更新信号强
            - 有限 —— 深度独立验证仍少
            - 中等
            - 公开证据高度依赖路线图，且可能变化
    approximationNotes: 成熟度评级是分析判断，来自公开包装广度、独立佐证和路线图证据，而不是供应商披露的阶段标签。
    claimRefs:
      - CE003
      - CE009
      - CE016
      - CE023
      - CE030
      - CE041
      - CE045
  - id: FU001
    title: 客户旅程地图
    type: journey-map
    layout: wide
    summary: 公开旅程通常从 Microsoft 云运营痛点开始，经过试点或首个租户；只有当 Nerdio 进入上线后的日常管理，才会扩张。
    data:
      nodes:
        - id: discover
          label: 发现痛点
          detail: MSP、企业 IT 团队或公共部门买方面临 Azure、AVD 或 Microsoft 365 运营复杂度。
        - id: evaluate
          label: 估算和试点
          detail: 买方建模成本，评估一个租户或工作负载，并借助合作伙伴或 Microsoft 帮助来降低实施风险。
        - id: deploy
          label: 首个生产部署
          detail: 一个环境、租户、校园工作负载或市政部门上线，使用 Nerdio 管理的自动化和治理。
        - id: standardize
          label: 标准化运营
          detail: 团队把经常性管理工作、安全模板、监控和支持流程迁入 Nerdio，而不再只靠原生门户。
        - id: expand
          label: 扩大范围
          detail: 首个部署证明可靠后，客户会增加更多租户、用户、终端或相邻 Microsoft 云工作流。
        - id: advocate
          label: 推荐和生态循环
          detail: 成功客户成为案例研究、合作伙伴奖项或引用推荐，强化未来管线。
    approximationNotes: 这张旅程图综合自公开案例研究、合作伙伴项目页面、定价页面和评论主题，而不是来自公司披露的漏斗仪表盘。
    claimRefs:
      - CU008
      - CU010
      - CU017
      - CU019
      - CU022
      - CU026
      - CU029
      - CU042
      - CU048
  - id: FU002
    title: 采用 / 部署漏斗
    type: flow
    layout: wide
    summary: 发现阶段通常流向成本估算和试点工作，之后才进入标准化以及更广的租户或用户扩张。
    data:
      nodes:
        - id: n1
          label: 运营痛点出现
          detail: Azure、AVD 或 Microsoft 365 管理过于手工、缓慢或依赖专门人才。
        - id: n2
          label: 建立商业论证
          detail: 团队用成本估算器、合作伙伴输入或 Microsoft 转介绍来证明试用合理。
        - id: n3
          label: 试点或首个租户部署
          detail: 一个客户环境、一组租户或城市用例，通过引导式设置上线。
        - id: n4
          label: 形成生产运营模式
          detail: 自动化、监控、RBAC、支持工作流和基线策略进入日常使用。
        - id: n5
          label: 扩张动作启动
          detail: 更多租户、用户、安全模板或 Microsoft 365 工作负载附加到平台。
        - id: n6
          label: 推荐和伙伴杠杆
          detail: 成功部署转化为引用推荐、合作伙伴奖项和额外渠道需求。
      edges:
        - from: n1
          to: n2
          label: 证明变更合理
        - from: n2
          to: n3
          label: 跑首个部署
        - from: n3
          to: n4
          label: 验证运营
        - from: n4
          to: n5
          label: 扩大范围
        - from: n5
          to: n6
          label: 创造可复制 GTM 证据
    approximationNotes: 由于 Nerdio 不发布漏斗转化率，该流程映射 MSP、企业和公共部门参考中反复出现的定性阶段。
