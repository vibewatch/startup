  - id: TV005
    title: 打破投资假设与叫停触发因素表
    columns:
      - 触发因素
      - 阈值 / 证据
      - 估值传导
      - 行动含义
    rows:
      - - Microsoft 原生功能 / 套餐趋同
        - 相比 Windows 365 / AVD 管理，Nerdio 失去工作流差异化或定价价差
        - 平台依赖变成直接定价问题，溢价会迅速收窄
        - 重估至成熟软件或依赖型软件倍数；暂停新增买入
      - - 净留存不及预期
        - 经验证 NRR 低于约 110%，或分组扩张明显偏弱
        - 即便表观 ARR 很大，高增长软件倍数也难自圆其说
        - 在流失和扩张解释清楚前，从建设性转为谨慎
      - - 毛利率显示尚未成规模
        - 综合毛利率显著低于软件常态，尤其在服务占比高时
        - 上市可比从 SaaS/平台公司转向低倍数、服务相邻型软件
        - 下调公允价值区间，并重新判断 Nerdio 是否真像软件
      - - 集中度 / 股权结构悬置
        - 头部合作伙伴或客户集中，或优先权条款吸收大部分退出价值
        - 即使企业价值上升，普通股回报算出来也可能很差
        - 投资前要求集中度表和完整瀑布
      - - 价格脱离公开证据支撑
        - 任何新轮次或二级交易若在没有新增披露时明显高于约 $1.5B 成交
        - 回报不对称恶化会快于基本面改善
        - 要求私下尽调包，否则放弃该价格
    notes: 这些是投资纪律阈值，不是管理层指引。每一项都会压缩倍数、降低退出价值捕获，或两者同时发生。
    claimRefs:
      - CV012
      - CV016
      - CV025
      - CV026
      - CV033
      - CV042
  - id: TV006
    title: 最终尽调问题清单
    columns:
      - 优先级
      - 主题
      - 缺失证据
      - 重要性
      - 尽调路径
    rows:
      - - 1（关键）
        - 当前 ARR 和增长桥
        - 没有公开 2026 年 ARR 数字，也没有从 2025 年 6 月 $100M 里程碑到现在的逐月桥接
        - 决定公司该按 8x、10x 还是 15x ARR 定价
        - 索取按季度拆分的最新 ARR、预订额和过去 12 个月增长
      - - 2（关键）
        - 按细分市场的 NRR / GRR
        - MSP、企业和公共部门 cohort 没有公开留存数据
        - 留存是耐久软件倍数最强驱动因素之一
        - 审阅 cohort 表、毛留存，以及按产品和客户细分拆分的扩张
      - - 3（关键）
        - 毛利率和服务组合
        - 公司声称盈利，但毛利率和服务附加仍未公开
        - 区分溢价软件经济性与低倍数、服务偏重经济性
        - 索取经审计 P&L、毛利率桥接，以及软件 / 服务收入组合
      - - 4（关键）
        - C 轮确切估值、出让股权和优先权堆栈
        - 该轮为少数股权且估值 $1B+，但确切投后估值和清算条款未披露
        - 企业价值和普通股价值之间，回报捕获可能差异巨大
        - 获取股权结构表、条款清单摘要和瀑布分析
      - - 5（高）
        - 集中度和渠道质量
        - 没有公开头部客户或头部合作伙伴集中度、续约或附加率数据
        - Microsoft 和合作伙伴主导的销售动线可能掩盖重大集中度风险
        - 索取前 20 大客户 / 合作伙伴敞口和续约历史
      - - 6（高）
        - 现金流质量和退出路径
        - 没有公开现金余额、烧钱、二级交易成交数据或董事会层面的流动性时间安排
        - 缺少这些，投资人无法为流动性等待时间或下轮降价融资风险定价
        - 审阅现金桥、董事会材料，以及任何投行或二级市场流程数据
    notes: 第 1-4 项会决定能否在已披露底线之上建立信心。第 5-6 项用于校准下行保护和现实退出时点。
    claimRefs:
      - CV026
      - CV027
      - CV033
      - CV034
      - CV038
      - CV042
