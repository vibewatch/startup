chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、总部与产品组合
        blocks:
          - type: paragraph
            body: >
              Nerdio 是一家未上市 SaaS 公司，总部位于 Illinois 州 Chicago，面向 Microsoft 终端用户计算（EUC）生态构建自动化云管理工具。两款旗舰产品——Nerdio Manager
              for MSP 和 Nerdio Manager for Enterprise——架在 Azure Virtual Desktop (AVD)、Windows 365、Microsoft Intune 和
              Microsoft 365 之上，补上 Microsoft 原生控制台没有内置提供的自动化、成本优化、多租户管理和合规执行能力。公司将使命描述为：把数月工程复杂度变成任何 IT 团队都能管理的可重复工作流，并让
              Azure 计算与存储成本最高节省 80%。

              Nerdio 的公司脉络始于 Adar, Inc.。2005 年，Vadim Vladimirskiy、Stuart Gabel 和 Niall Keegan 在 Chicago
              地区共同创立这家托管服务提供商，为 SMB 提供在线备份和云服务。2016 年，Nerdio 技术作为 Adar 的内部产品部门诞生，目标是把 AVD 管理工具产品化后提供给其他 MSP。Joseph
              Landes 于 2018 年以联合创始人身份加入，带来 23 年 Microsoft 高管经验。January 2020，Nerdio 正式从 Adar 拆分为独立公司；Adar
              同时被私募股权收购，并停止沿用原名运营。拆分后不久，Nerdio Manager for Enterprise 于 2020 年推出，把可服务市场扩展到直接企业客户。

              作为远程优先雇主，Nerdio 团队分布在 North America、EMEA 和 APAC。公司以 “Nerdio, Inc.” 为法律实体运营，并维护覆盖 GDPR、HIPAA 和 CCPA
              合规的完整法律中心，其中包括 Data Protection Addendum (DPA)。截至 May 2026，Nerdio 主页披露 23,000+ 客户和 50+ 国家 / 地区的 6.5M 用户，高于
              March 2025 C 轮新闻稿中的 15,000+ 客户和 5M+ 用户。这个时间差反映了期间真实的客户增长，不应解读为数据冲突；两组数字都来自公司在不同时间点发布的披露。Nerdio 已上架 Azure
              Marketplace，并拥有公开的 Microsoft 合作伙伴案例研究，说明其与 Microsoft 商业生态的整合很深。
