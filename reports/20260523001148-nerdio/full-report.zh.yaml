        - id: evaluation
          label: 报价、迁移和上线
          detail: TeamLogic 将报价从数周压缩到数天；Kilpatrick 将迁移时间削减 66%
        - id: savings
          label: 客户节省和人力杠杆
          detail: 计算成本节省 55-60%，每月节省 >$20k，并降低对专门 Azure 人力的需求
        - id: expansion
          label: 经常性管理和优化
          detail: 持续的自动扩缩、策略、监控和管理支持创造经常性附加价值
        - id: outcome
          label: ARR 和盈利能力
          detail: 公开成果节点是 $100M+ ARR，且公司已披露盈利
      edges:
        - from: acquisition
