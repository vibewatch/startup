        - ~$1.3B-$1.7B
        - 50%
        - 高增长延续，但披露折扣和平台折扣仍在
      - - 牛
        - 2026 年 ARR 超过约 $180M，增速 50%+；留存和利润率证明质量可享受溢价
        - 约 11x-15x ARR；投资人奖励品类领导地位和清晰的私有公司指标
        - ~$2.0B-$2.8B
        - 25%
        - 私下尽调确认高 NRR、软件型毛利率和有限集中度
      - - 概率加权判断
        - 熊 25% / 基准 50% / 牛 25%
        - 估值重心仍高于独角兽底线，但低于一流溢价倍数
        - ~$1.35B-$1.65B
        - 100%
        - 一旦确切投后估值、NRR 和利润率数据明确，区间会明显移动
    notes: 区间是基于公开证据的估算，不是管理层指引。它们使用已披露的 2025 年估值和 ARR 锚点，并叠加 2026 年情景假设；这些假设必须在尽调中验证。
