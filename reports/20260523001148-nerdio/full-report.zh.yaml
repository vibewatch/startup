      - number: '7.2'
        title: 法律、商标和数据主权风险真实存在，但比平台风险更可管理
        blocks:
          - type: paragraph
            body: >-
              Nerdio 目前的法律与监管画像，并没有被执法行动或灾难性诉讼主导，但也不是一张白纸。法院记录显示，与 NerdIO Ltd. 的商标争议已经打到 Federal Circuit，之后在 2025 年 1
              月自愿撤诉；公开商标数据仍显示一项 NERDIO 申请正在处理中。这还不构成当前的生死级诉讼，却说明公司名称已经引发过真实法律摩擦。更重要的前瞻问题，是隐私和跨境执行。Nerdio
              隐私政策明确提到欧洲数据保护法律、向非充分保护司法辖区转移数据，以及通过监管机构投诉的权利；公司公告则显示其进入日本，并在欧洲、UAE、墨西哥等地继续扩张。这些事实不能证明合规失败，只能证明合规负担是真实的。保留下来的公开材料里有政策措辞、客户案例营销和
              Microsoft 租户架构主张，但没有完整的审计级认证包、区域托管架构图或详细的数据驻留控制。因此，投资人应把数据驻留和监管执行视为重尽调事项，而不能因为网站上的安抚信号就认定已经解决。
