  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局与竞争者分组
        blocks:
          - type: paragraph
            body: >
              最重要的竞争区分是，Nerdio 并不试图替代世界上每一种虚拟桌面产品；它要占住 Azure Virtual Desktop、Windows 365、Intune 和更广义 Microsoft 365 管理周边的
              Microsoft 专属自动化与优化层。因此，直接竞争场异常混杂。Microsoft 自身是默认现状选项，因为买方可以不向 ISV 付费，直接通过第一方管理界面和 API 运行 AVD、Windows 365 和
              Intune。Citrix 和 Omnissa 是既有企业替代方案，尤其在异构或混合环境中，本地遗留系统、多云支持或深度 VDI 策略控制仍然重要。AWS WorkSpaces
              更像替代平台，而不是逐功能直接对标的同类产品；ControlUp、Lakeside 和 Rimo3 更准确地说是 DEX、修复或应用就绪性的相邻叠加层，而不是主要 Nerdio 替代品。因此，本章把
              Microsoft 原生工具视为最可信的下方进入者，把 Citrix 和 Omnissa 视为上方既有厂商，把 AWS 加上 DEX 厂商视为替代品或补充品，具体取决于工作负载。
