  - id: FV001
    title: 投资建议逻辑
    type: flow
    layout: wide
    summary: 建议仍偏建设性，因为估值地板和经营动能确实存在；但最终只到观察 / 继续研究，因为确切价格和收入质量变量仍未公开。
    data:
      nodes:
        - id: floor
          label: 估值地板
          value: $1B+ disclosed in Mar 2025
        - id: traction
          label: 经营牵引力
          value: $100M+ ARR; >85% growth; profitable; debt-free
        - id: capital
          label: 融资质量
          value: $500M minority round; founders retained significant stake
        - id: gaps
          label: 披露缺口
          value: NRR, gross margin, exact post-money, cap table, concentration
        - id: risk
          label: 结构性折价
          value: Microsoft platform dependency and mixed SMB affordability signals
        - id: decision
          label: 决策
          value: Track / research-more; fair to attractive near floor, stretched well above it
      edges:
        - from: floor
          to: traction
          label: 证实规模
        - from: traction
          to: capital
          label: 支撑少数股权轮
        - from: capital
          to: decision
          label: 支撑建设性看法
        - from: gaps
          to: decision
          label: 阻止强买入
        - from: risk
          to: decision
          label: 维持折价
    approximationNotes: 这是一张基于保留公开证据搭建的投委会决策图，不是统计评分模型。
