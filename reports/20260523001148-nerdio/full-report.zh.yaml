    summary: 在没有私人财务报表的情况下，可推导出的关键估值输入的公开下限和情景区间。
    approximationNotes: 高端 ARR 和低端 ARR 倍数值是情景输出，假设已披露的 85% 增长率在 2025 年披露后大约一年内大体维持。它们明确是估算，不是公司当前报告数字。
