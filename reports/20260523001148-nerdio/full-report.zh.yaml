      - number: '1.2'
        title: 领导层、创始人与治理
        blocks:
          - type: paragraph
            body: >
              Nerdio 由 Vadim Vladimirskiy（联合创始人兼 CEO）和 Joseph Landes（截至 January 2026 为联合创始人兼总裁）共同创立。Vladimirskiy
              是最初的技术推动者：他从 2005 年开始打造 Adar，并在这家 MSP 内部创建了第一代 Nerdio 技术。Landes 于 2018 年加入，此前在 Microsoft 任职 23
              年，担任过高级管理岗位，包括参与 Microsoft 合作伙伴与渠道生态。两位联合创始人在 C 轮时确认仍持有公司“显著股权”，但具体比例未披露。

              March 2025 完成 $500M C 轮融资后，为支撑融资后的快速扩张，Nerdio 于 January 2026 宣布 4 项高管任命。Scott Manchester
              加入担任首席产品与技术官（CPTO），带来 25 年 Microsoft 云平台经验。Bryan Law 从 SentinelOne 加入担任首席营销官，此前最近担任 SentinelOne CMO；他也曾任
              ZoomInfo CMO，并在 Salesforce、Google、Tableau、Rackspace 和 Monitor Deloitte 担任领导职务。Larry Sweeney 此前为 Nerdio
              企业销售 EVP，后晋升为首席营收官，并同时负责客户成功。Matt Tavlin 加入担任首席人力官，此前在 Cisco、VMware、Pure Storage、Cohesity 和 Freshworks
              有领导经验。Joseph Landes 同期从 CRO 转任总裁，专注战略合作伙伴关系和对外布道。

              Nerdio 董事会同时体现投资人监督和深厚的 Microsoft 生态经验。General Atlantic 由 Aaron Goldman（董事总经理、企业技术负责人）和 Asher
              Hecht（Principal）代表。Updata Partners 由 Carter Griffin（普通合伙人）代表。MK Capital 由 Bret Maxwell（管理普通合伙人）代表。独立董事包括
              Gavriella Schuster（前 Microsoft 全球渠道负责人）和 Andy Lees（曾任 Microsoft 总裁兼企业副总裁，任职 23
              年）。截至研究日期，公开记录未发现创始人离职、董事会争议、监管行动等负面治理事件。January 2026 的高管扩编应视为管理梯队的计划性扩容，而不是领导危机信号。
