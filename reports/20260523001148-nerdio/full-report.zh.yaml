  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与规模测算视角
        blocks:
          - type: paragraph
            body: >
              Nerdio 的正确市场框架，首先要守住范围边界。Nerdio 既不出售所有桌面虚拟化支出，也不覆盖所有终端用户计算软件。它的产品架在 Microsoft 的 Azure Virtual
              Desktop、Windows 365、Intune 以及相邻 Microsoft 365 管理界面之上，因此最相关的市场，是围绕 Microsoft 云桌面和端点管理的自动化、优化与治理层。这个边界包括 VDI
              与 DaaS 软件、云 PC 运维、成本优化工具、策略执行，以及面向运行 Microsoft 云桌面栈组织的迁移 / 管理工作流。它不包括通用
              ERP、无关的端点安全品类、宽泛的基础设施即服务支出，也不包括没有产品化可重复管理能力的纯手工咨询。公开 TAM 估算可作为广义市场上限，但并不等同于 Nerdio 的
              SAM。Mordor、Fortune、The Business Research Company 和 Coherent 都发布了很大的 2026 市场规模数字，但差异明显，因为它们统计的
              VDI、桌面虚拟化、云交付和基础设施组合不同。这种差异本身就是分析发现。因此，更窄的 SAM 必须用视角推导，而不是直接搬用某一条分析师口径：Microsoft
              中心化的安装基础，需要第三方自动化和优化，并按用户或租户定价，而不是只看总虚拟化支出。
