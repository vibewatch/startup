              本报告全文采用 “$1B+” 作为有证据支撑的估值数字。投资人材料中有时引用的 $1.2B+，未能在本研究周期检索到的任何 Nerdio、General Atlantic 或媒体公开来源中得到确认。分析将
              $1B+ 作为安全锚点，并把 $1.2B+ 标记为未验证。
