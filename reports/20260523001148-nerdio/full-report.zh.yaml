      - number: '3.3'
        title: 切换成本、锁定效应与分销力量
        blocks:
          - type: paragraph
            body: >
              这个品类的竞争耐久性，与其说来自原始功能数量，不如说来自切换成本和商业化路径。Nerdio 受益于只做 Microsoft 的专精，但同一个聚焦也制造了对单一生态的结构性依赖。如果买方已经承诺使用
              Azure、Windows 365 和 Intune，Nerdio 能快速降低运维痛点；如果 Microsoft 把更多管理、安全或成本工具打包进原生栈，Nerdio
              的收费空间就会收窄。同时，共存很常见：Microsoft 明确支持 Omnissa Horizon 与 Windows 365 集成，Azure 称 AVD 可以现代化 Citrix 或 Omnissa
              环境，第三方市场评论也显示许多企业并行运行多种桌面交付模型。这会削弱非此即彼的替换动态。Nerdio 的对冲力量是渠道杠杆。PartNERD 生态、Nerdio University、CIS 基准认证和
              Carahsoft 公共部门分销，都降低了感知部署风险，让 MSP 和受监管客户更容易购买 Nerdio，而不是采用泛泛的自写脚本方法。不过，负面评论显示，高级自动化可能需要专门技能，对很小的环境也可能过度。
