  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品范围与客户任务
        blocks:
          - type: paragraph
            body: >-
              Nerdio 现在呈现为两条面向不同运营者、但关系紧密的产品线，而不是单一通用虚拟化工具。Nerdio Manager for MSP
              围绕托管服务工作流构建：为客户环境定价和评估、导入租户、标准化策略、支持用户，并从同一控制台扩展到 Microsoft 365 管理。Nerdio Manager for Enterprise 被定位为
              Azure Virtual Desktop、Windows 365 和 Intune 托管端点的内部 IT
              控制平面，公开模块定价和成本建模工作流看起来比旧第三方定价参考所暗示的更成熟。最重要的产品层面变化是广度。公开产品和新闻材料显示，Nerdio 已从主要围绕 AVD 的叙事，走向更宽的 Microsoft
              云管理层，涵盖 Modern Work 功能、安全基线和合作伙伴赋能。这种广度对采用有意义，因为它让 Nerdio 销售的是工作流整合，而不只是一次性 VDI 自动化。它也意味着买方可以用一个 Microsoft
              问题落地产品，之后扩大使用，而不必更换供应商或管理习惯。
