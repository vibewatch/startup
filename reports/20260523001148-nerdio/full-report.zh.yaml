      - number: '1.3'
        title: 融资历史、估值与财务画像
        blocks:
          - type: paragraph
            body: >
              Nerdio 自 2020 年拆分后完成三轮融资，共筹集 $625M，已跻身全球资本最充足的纯 Microsoft 云管理 ISV 之一。A 轮于 February 2020 融资 $8M，由 MK
              Capital 领投；MK Capital 早在 Adar 2014 年机构融资时就与董事会建立关系。B 轮于 December 2022 从 Washington D.C. 的 B2B SaaS 成长股权机构
              Updata Partners 融资 $117M；该轮融资发生在艰难的宏观环境中，用于扩充高管团队、扩大员工规模，并推进进入 UK、EMEA、Australia、New Zealand、India 和
              Brazil。Updata 的 Carter Griffin 加入董事会。

              C 轮于 March 18, 2025 宣布，从 General Atlantic（领投）、Lead Edge Capital 和 StepStone 融资 $500M。公司称估值较 B 轮水平翻了四倍，达到
              “$1 billion+”。在接受 TechCrunch 采访时，CEO Vladimirskiy 和 CRO Landes 确认估值“高于 $1 billion”，但拒绝披露精确数字。J.P. Morgan
              担任 Nerdio 独家财务顾问。作为投资的一部分，General Atlantic 获得两个董事会席位。公司被描述为已盈利、无债务，并保持收入增长。累计融资总额为 $625M。

              财务不透明是实质性尽调限制。Nerdio 不公开披露毛利率、净留存率（NRR）、获客成本（CAC）或烧钱速度。唯一确认的财务指标是 June 2025 达成的 $100M+ ARR 里程碑。缺少标准 SaaS
              财务 KPI 时，很难用行业倍数反推 $1B+ 估值；按 $100M ARR 和 $1B+ 估值计算，隐含 ARR 倍数约为 10x——对一家高增长且盈利的 SaaS
              公司来说合理，但取决于增长率能否持续。所有股权比例和股权结构细节仍未披露。
