  - id: TU005
    title: 扩张与集中风险表
    columns:
      - 扩张驱动或风险
      - 当前公开判断
      - 潜在影响
      - 尽调路径
    rows:
      - - MSP 与企业客户结构不透明
        - Nerdio 披露了总体客户数和部分新增企业客户，但没有按获客路径拆分存量客户结构
        - 公司实际可能更依赖渠道，或 ACV 低于表面客户数暗示
        - 要求按 MSP、企业和公共部门拆分客户数、ARR 和毛利率
      - - 头部客户集中度
        - 公开来源没有披露最大客户规模或前十大客户 ARR 占比
        - 少数大型企业或合作伙伴账户可能对增长和留存影响过大
        - 要求披露最大客户 ARR、前十大集中度，以及是否依赖单一合作伙伴
      - - 合作伙伴与 Microsoft 依赖
        - 合作伙伴计划、联合销售表述、Marketplace 位置，以及 Microsoft 介绍的概念验证（POC），都处在销售动作核心
        - 如果合作伙伴产能或与 Microsoft 的协同减弱，管线和扩张可能放慢
        - 要求披露获客管线结构、合作伙伴贡献 ARR，以及受 Microsoft 影响的预订额数据
      - - 证据质量偏斜
        - 最强的客户结果证据来自供应商撰写的案例研究，而不是第三方采购记录或客户域名公告
        - 公开案例可能夸大部署顺畅度，低估失败或停滞的上线
        - 要求安排客户访谈、客户域名佐证，以及流失分析数据
      - - 公共部门证据深度
        - 政府业务动作可见，但具名机构引用仍少，一篇重要案例还未披露城市名称
        - 这可能限制对采购耐久性或联邦渗透率的信心
        - 要求提供具名政府客户参考、合同工具，以及当前公共部门管线
      - - 评论网站摩擦
        - 公开投诉集中在更新、报表摩擦、复杂度和 Azure 锁定效应，而不是彻底部署失败
        - 可用性或复杂度问题仍可能拖慢成熟度较低客户环境里的上线
        - 要求提供支持工单趋势、价值实现时间指标，以及与产品复杂度相关的流失原因
    notes: 风险行把公开证据已经支持的内容，与仍需管理层披露的内容分开。缺少公开指标被视为未解决的尽调问题，而不是证明风险不存在。
