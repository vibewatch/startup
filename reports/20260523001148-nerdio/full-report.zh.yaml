              Nerdio 在保持盈利和无债务的同时达到 $1B+ 估值与 $100M+ ARR；这对一家高增长 SaaS 公司是少见组合。85%+ ARR 增长率叠加无债务和正向现金生成，让 Nerdio
              更像高效率增长企业，而不是靠烧钱换规模的故事。
