      - number: '1.5'
        title: 主要风险、治理缺口与未决尽调问题
        blocks:
          - type: paragraph
            body: >
              Nerdio 最突出的结构性风险，是对 Microsoft 的深度单一供应商依赖。整条产品价值链——AVD、Windows 365、Intune 和 M365——都建在 Microsoft 专有云基础设施和
              API 之上。一旦 Microsoft 在平台方向、定价、API 可用性或竞争姿态上出现不利变化，例如把竞争性管理能力原生打包进 Microsoft 365 Admin Center 或
              Intune，Nerdio 的可服务市场或定价权可能明显受损。公司叙事明确强调与 Microsoft 互补；如果关系恶化，几乎没有战略缓冲。这是一切单平台管理 ISV 的典型核心风险。

              财务不透明是第二个实质性尽调缺口。除 $100M+ ARR 和“85%+ 同比增长”外，公开资料没有毛利率、NRR、CAC
              或烧钱速度。公司未上市，意味着没有监管文件纪律来锚定估值或投资质量分析。第三个担忧是关键人物风险：公司叙事强烈绑定 Vladimirskiy（技术愿景和创始故事）与 Landes（商业化路径）。January
              2026 的高管扩编加深了团队，但快速扩张会带来执行风险，尤其是在 Nerdio 仍在建立存在感的地区和细分市场。

              一起商标纠纷——NERDIO LTD. v. NERDIO, INC.（Federal Circuit No. 24-2091）——于 2024 年提起，并在 January 2025
              经双方同意驳回，没有任何一方被判败诉。这提示在已有 “Nerdio” 名称使用的国际市场中，品牌可能存在冲突敞口。第三方产品评论还指出，Nerdio 的成本结构可能让很小的企业难以承受，而且平台需要专门的
              Microsoft Azure 专业能力才能充分发挥价值，这在一定程度上收窄了可服务市场，也提高了技术能力较弱客户的门槛。
