              Nerdio 至少面向三种商业上不同的销售动作。第一种、也是历史上最清晰的一种，是 MSP 主导：Nerdio Manager for MSP 按租户定价，围绕多租户管理营销，并由 PartNERD
              合作伙伴权益、培训和面向业务构建者而非终端用户公司的利润率语言强化。第二种是直接企业 IT，Nerdio Manager for Enterprise 按用户或托管端点模块定价，案例研究聚焦内部云、端点和 AVD
              运维团队。第三种是政府和公共部门，Carahsoft 和兼容 Microsoft 的 Azure Government
              定位似乎比纯直接网页获客更重要。公开案例也显示行业宽度超过经典软件买方，教育、非营利、物流、地方政府和全球企业品牌都有证明。未披露的是 23,000+ 报告客户内部的真实组合：Nerdio 没有说明其中多少是
              MSP 合作伙伴、终端企业、公共部门账户，或由 MSP 管理的下游客户租户。
