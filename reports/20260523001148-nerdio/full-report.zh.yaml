  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: Microsoft 平台依赖和原生竞争是最核心的论点风险
        blocks:
          - type: paragraph
            body: >-
              Nerdio 最大的风险是结构性的，不是偶发性的：公司不是在运营一个独立桌面平台，而是在 Microsoft 拥有的控制平面之上搭建自动化和编排层。公开产品页、Microsoft Marketplace
              页面，以及 Microsoft 自己的合作伙伴案例研究，都在强化同一个架构故事——Nerdio 围绕 Azure Virtual Desktop、Windows 365、Intune 和更广的 Microsoft
              365 管理，提供工作流压缩、多租户管理、成本优化和更轻松的上线后运维。商业上这条路跑通，是因为 Microsoft 技术栈很强，但很多 MSP 和企业团队在运营上仍觉得杂乱。问题在于，Microsoft
              同时掌控基础价格、底层 API 和原生管理体验。Microsoft 2026 年下调 Windows 365 Business 价格、Azure
              长期按量付费模式，以及第一方功能持续扩张，都说明原生底座可以轻易移动。Nerdio 的灵活合同和自有租户部署在边际上有帮助，但不是结构性对冲。如果 Microsoft
              在自有控制台里补足足够多的工作流缺口，或更激进地捆绑同等管理功能，Nerdio 的溢价层可能很快被重估。
