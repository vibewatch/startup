          label: MSP 经常性订阅
          detail: Microsoft 365 管理每租户每月 $50，加上按租户打包和模块附加
        - id: enterprise-subscriptions
          label: 企业经常性订阅
          detail: 历史锚点为每用户每月 $3，2026 预算口径为 $6-$10；但当前企业版标价未公开
        - id: gov-edition
          label: 政府 / 受监管版本
          detail: Gov Edition 每租户每月最低 $250，批量折扣按报价
        - id: attached-services
          label: 附带上线和迁移服务
