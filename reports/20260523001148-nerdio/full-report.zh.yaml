  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型、定价可见度与变现质量
        blocks:
          - type: paragraph
            body: >-
              Nerdio 的公开财务故事先从收入架构开始，而不是 GAAP 细节。公司显然在 Microsoft 云基础设施之上变现一层经常性软件，而不是出售基础设施本身，也不是运营硬件重或项目融资模式。官方定价现在让
              MSP 动作比早年清晰得多：Nerdio 公开展示面向 Microsoft 365
              管理的租户定价、政府最低消费、月付和年付条款，以及成交价仍需销售沟通决定的批量折扣措辞。企业定价透明度较低。最好的公开锚点，是一份 2022 年第三方报告提到 $3/user/month，以及 Nerdio
              自己的 2026 商业案例指引，建议买方为管理工具层预算 $6-$10/user/month。这个组合足以说明 Nerdio 销售具备有意义价格纪律的经常性软件，但不足以知道当前实际
              ACV、标价到净价折扣、服务附着率，或业务中多少来自 MSP 多租户订阅、多少来自直接企业合同。财务质量信号不错；精确度不够。
