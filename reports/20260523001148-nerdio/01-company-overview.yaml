  evidenceGaps:
    - type: "private-evidence-only"
      severity: "material"
      topic: "ownership structure"
      missingEvidence: >
        Cap table showing equity percentages for all investor groups (MK Capital, Updata
        Partners, General Atlantic, Lead Edge Capital, StepStone) and the co-founders.
      whyItMatters: >
        Without ownership structure, it is impossible to assess alignment of interest,
        liquidation waterfall, or whether any single investor has blocking rights on
        strategic decisions.
      diligencePath: >
        Request cap table from Nerdio during due diligence; review investor rights agreement
        and certificate of incorporation for class structure and voting rights.
      relatedQuestionRefs:
        - QO004
      relatedTableRefs:
        - TO002
        - TO003

    - type: "private-evidence-only"
      severity: "material"
      topic: "SaaS financial metrics"
      missingEvidence: >
        Gross margin percentage, net revenue retention (NRR), customer acquisition cost
        (CAC), customer lifetime value (LTV), and operating burn rate or cash flow statement.
      whyItMatters: >
        These are the standard metrics for SaaS valuation analysis. Without them, the
        $1B+ valuation cannot be triangulated against industry comps, and the quality
        of Nerdio's revenue growth cannot be assessed (e.g., high NRR would confirm
        land-and-expand; low NRR would flag churn risk).
      diligencePath: >
        Request management accounts and SaaS metrics dashboard during due diligence;
        compare to Rule of 40 benchmarks for comparable infrastructure SaaS companies.
      relatedQuestionRefs:
        - QO009
        - QO014

    - type: "private-evidence-only"
      severity: "material"
      topic: "Series C valuation"
      missingEvidence: >
        Precise post-money valuation from the Series C. The public record states only
        "$1B+" and "north of $1B"; whether this is $1.0B, $1.2B, or higher is not
        confirmed in any public source.
      whyItMatters: >
        Valuation precision matters for determining implied ARR multiple and comparative
        positioning against EUC software peers. A $1.0B vs $1.5B figure implies materially
        different investor return expectations.
      diligencePath: >
        Review Series C term sheet and investor presentation (Series C closing documents
        would disclose post-money valuation); alternatively, confirm through General
        Atlantic or JP Morgan relationships.
      relatedQuestionRefs:
        - QO006

    - type: "missing-source"
      severity: "minor"
      topic: "regulatory certifications"
      missingEvidence: >
        SOC 2 Type II audit report, ISO 27001 certificate, FedRAMP authorization status,
        and any HIPAA Business Associate Agreement (BAA) standard terms.
      whyItMatters: >
        Enterprise and government customers typically require these certifications;
        confirming their existence (or absence) affects Nerdio's addressable government
        market and enterprise security posture assessment.
      diligencePath: >
        Request from Nerdio directly; check their trust center or security documentation
        portal; review the legal hub for any SOC/ISO references.
