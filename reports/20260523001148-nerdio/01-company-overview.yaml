  - id: "scale-and-milestones"
    title: "Scale Metrics, Operating Milestones, and Growth Trajectory"
    body: >
      Nerdio's growth trajectory demonstrates strong velocity for an enterprise SaaS company.
      ARR surpassed $100 million in June 2025, reached in just over five years as a standalone
      company. At the time of the March 2025 Series C, Nerdio reported 85%+ year-over-year
      ARR growth and 15,000+ customers across 50+ countries. By June 2025, customer count was
      still cited at 15,000+ in the ARR milestone press release, while the May 2026 home page
      states 23,000+ customers and 6.5 million users—reflecting continued rapid acquisition.
      Headcount grew 82% in 2025, from a base of approximately 300 employees in March 2025,
      implying roughly 546 employees by year-end 2025. The company has announced continued
      hiring across all departments.

      Key enterprise customer references include Chevron, Kraft Heinz, ASDA, Carnival Cruise
      Line, Willis Towers Watson, Penn State University, Setfords, Sage, and Teleperformance.
      MSP traction is anchored by the PartNERD partner program and Azure Marketplace listing.
      The company reports influencing more than $350 million of Microsoft revenue annually
      (company-claimed; not independently verified by Microsoft). Nerdio won the 2024 Microsoft
      Americas Partner of the Year award and hosts an annual user and partner conference called
      NerdioCon. The annual partner awards program (NerdioCon 2026 held in 2026) demonstrates
      a maturing ecosystem.

      Geographically, Nerdio has expanded beyond North America with offices or operations in
      the UK, EMEA (including Benelux, Southern Europe, and UAE), APAC (including Japan and
      Australia), and Latin America (including Mexico and Brazil). Japan's Country Manager
      (Tatsuro Sugiyama) was appointed in November 2025, marking a formal entry point for the
      Japanese digital transformation market. Carahsoft partnership coverage extends Nerdio's
      reach into U.S. federal government and public sector accounts.
