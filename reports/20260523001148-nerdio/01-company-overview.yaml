  - id: "risks-and-gaps"
    title: "Key Risks, Governance Gaps, and Outstanding Diligence Questions"
    body: >
      Nerdio's most salient structural risk is deep single-vendor dependency on Microsoft. The
      entire product value chain—AVD, Windows 365, Intune, and M365—is built on Microsoft's
      proprietary cloud infrastructure and APIs. Any adverse change in Microsoft's platform
      direction, pricing, API availability, or competitive posture (for example, natively
      bundling competing management capabilities into Microsoft 365 Admin Center or Intune)
      could materially impair Nerdio's addressable market or pricing power. The company's
      narrative explicitly emphasizes complementarity with Microsoft, providing no strategic
      buffer if the relationship deteriorates. This is the canonical key risk for any
      single-platform management ISV.

      Financial opacity is a second material diligence gap. Beyond $100M+ ARR and "85%+ YoY
      growth," no gross margin, NRR, CAC, or burn rate metrics are publicly available. The
      company's private status means no regulatory filing discipline exists to anchor valuation
      or investment quality analysis. Key-person risk is a third concern: the company's
      narrative is strongly anchored to Vladimirskiy (technical vision and founding story) and
      Landes (commercial go-to-market). While the January 2026 executive expansion deepens the
      team, rapid scaling creates execution risk, especially in geographies and segments where
      Nerdio is still establishing its presence.

      A trademark dispute—NERDIO LTD. v. NERDIO, INC. (Federal Circuit No. 24-2091)—was filed
      in 2024 and dismissed by agreement in January 2025, without a judgment against either
      party. This signals potential brand exposure in international markets where pre-existing
      uses of the "Nerdio" name may create conflict. Third-party product reviewers note that
      Nerdio's cost structure may be prohibitive for very small businesses and that the platform
      requires specialized Microsoft Azure expertise to fully leverage, narrowing the addressable
      market somewhat and raising the barrier for less technically sophisticated customers.
