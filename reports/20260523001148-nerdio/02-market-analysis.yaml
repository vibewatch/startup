callouts:
  - calloutType: "insight"
    title: "The broad TAM is real, but Nerdio's investable market is the Microsoft-control layer"
    body: >
      The most useful conclusion is not that desktop virtualization is large; it is that
      Microsoft-centric cloud desktop operations create a narrower management category where
      automation, policy, and ROI matter enough to pay for third-party tooling.
    claimRefs:
      - "CM001"
      - "CM015"
      - "CM016"
      - "CM017"
      - "CM026"
      - "CM027"
      - "CM028"

  - calloutType: "risk"
    title: "Market growth does not remove platform and complexity risk"
    body: >
      Even if cloud desktop adoption grows, Nerdio still has to navigate native Microsoft
      overlap, incumbent alternatives, skills barriers, and regional concentration before
      broad TAM converts into durable economic share.
    claimRefs:
      - "CM029"
      - "CM030"
      - "CM031"
      - "CM032"
      - "CM033"
      - "CM036"

