  evidenceGaps:
    - type: "missing-source"
      severity: "material"
      topic: "microsoft-euc-management-sam"
      missingEvidence: >
        A public source that isolates AVD and Windows 365 deployed-seat counts plus attach
        rates for third-party management tools such as Nerdio.
      whyItMatters: >
        Without a direct installed-base and attach-rate source, the chapter can only offer
        directional SAM scenarios instead of a source-backed SAM or SOM.
      diligencePath: >
        Request Microsoft-installed-base disclosures, partner analytics, or internal Nerdio
        cohort data showing AVD/W365 seats under management and attach rates to paid
        automation tooling.
      relatedQuestionRefs:
        - "QM007"
        - "QM025"
      relatedTableRefs:
        - "TM002"

    - type: "private-evidence-only"
      severity: "material"
      topic: "segment-mix"
      missingEvidence: >
        Revenue, seat, and gross-margin mix split across MSP, enterprise, and public-sector
        customers.
      whyItMatters: >
        Buyer segmentation is central to valuation, but public proof of segment weighting is
        absent, making it impossible to convert the buyer map into a precise revenue-weighted
        SOM view.
      diligencePath: >
        Request management reporting that breaks ARR, seats, churn, and margin by segment and
        geography, then reconcile it against partner-channel pipeline data.
      relatedQuestionRefs:
        - "QM024"
      relatedTableRefs:
        - "TM003"

    - type: "missing-source"
      severity: "minor"
      topic: "regional-network-readiness"
      missingEvidence: >
        Public evidence tying broadband quality, latency, or cloud-desktop infrastructure
        readiness by region to actual Nerdio adoption outcomes.
      whyItMatters: >
        The chapter can show North America concentration and APAC growth, but it cannot
        cleanly quantify how network readiness or regional infrastructure limits adoption in
        practice.
      diligencePath: >
        Request regional deployment data, customer reference distributions, and support-ticket
        patterns that show whether latency or infrastructure quality affects win rates or
        expansion.
      relatedQuestionRefs:
        - "QM021"
      relatedTableRefs:
        - "TM004"

    - type: "missing-source"
      severity: "minor"
      topic: "pricing-realization"
      missingEvidence: >
        Current public price book and realized ARPU across Nerdio Manager for Enterprise and
        MSP products; the retained $3 per-user figure is from 2022 and the MSP model has
        changed since then.
      whyItMatters: >
        The directional SAM scenario depends on price assumptions, so stale or
        unrepresentative pricing can materially distort the SAM lens.
      diligencePath: >
        Request the current product price book, discount policy, and realized net pricing by
        cohort; reconcile per-user and per-tenant models before using pricing in valuation
        work.
      relatedQuestionRefs:
        - "QM008"
      relatedTableRefs:
        - "TM002"

    - type: "conflicting-data"
      severity: "material"
      topic: "market-size-definition-conflict"
      missingEvidence: >
        A normalized analyst comparison that harmonizes VDI, desktop virtualization, DaaS,
        and management-tool definitions across the major reports.
      whyItMatters: >
        The retained analyst estimates are directionally useful but too inconsistent to
        average into a single confident TAM without losing important scope differences.
      diligencePath: >
        Obtain full analyst methodologies or build a normalized bottoms-up market map that
        separates infrastructure, platform, and management-software revenue pools before
        using a headline TAM in valuation.
      relatedQuestionRefs:
        - "QM005"
        - "QM023"
      relatedTableRefs:
        - "TM002"

