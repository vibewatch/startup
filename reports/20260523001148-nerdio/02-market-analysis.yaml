company:
  name: "Nerdio"
chapter:
  number: 2
  title: "Market Analysis"
  summary: >
    Nerdio operates inside a broad but definitionally messy desktop virtualization market
    whose 2026 size spans roughly $10.26B to $23.85B depending on whether a source counts
    VDI, DaaS, infrastructure, and management tooling together. Its practical SAM is much
    narrower: Microsoft-centric automation and optimization for Azure Virtual Desktop,
    Windows 365, and Intune, where MSP, enterprise, and public-sector buyers care about
    deployment speed, policy control, and ROI more than raw seat volume. The biggest market
    diligence issue is that no retained analyst source isolates this Microsoft EUC
    management category, so the chapter preserves a directional SAM lens, contradictory TAM
    estimates, and unresolved attach-rate questions instead of pretending to precision.
sections:
  - id: "market-boundary-and-sizing"
    title: "Market boundary and sizing lenses"
    body: >
      The right market frame for Nerdio starts with scope discipline. Nerdio does not sell
      all desktop virtualization spend, nor all end-user computing software. Its products
      sit on top of Microsoft’s Azure Virtual Desktop, Windows 365, Intune, and adjacent
      Microsoft 365 administration surfaces, so the most relevant market is the automation,
      optimization, and governance layer around Microsoft cloud desktops and endpoint
      management. That boundary includes VDI and DaaS software, cloud PC operations,
      cost-optimization tooling, policy enforcement, and migration/management workflows for
      organizations running Microsoft’s cloud-desktop stack. It excludes generic ERP,
      unrelated endpoint security categories, broad infrastructure-as-a-service spend, and
      purely manual consulting work that does not productize repeatable management. Public
      TAM estimates for the broad market are useful as outer bounds, but they are not the
      same thing as Nerdio’s SAM. Mordor, Fortune, The Business Research Company, and
      Coherent all publish large 2026 market figures, yet they disagree materially because
      they count different mixes of VDI, desktop virtualization, cloud delivery, and
      infrastructure. That variance is itself an analytical finding. The narrower SAM must
      therefore be derived as a lens rather than imported from a single analyst line item: a
      Microsoft-centric install base that needs third-party automation and optimization,
      priced on a per-user or per-tenant basis rather than on total virtualization spend
      alone.
    claimRefs:
      - "CM001"
      - "CM002"
      - "CM003"
      - "CM004"
