figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: The public journey usually starts with Microsoft-cloud operational pain, passes through a pilot or first tenant, and expands only after Nerdio becomes part of day-two administration.
  data:
    nodes:
    - id: discover
      label: Pain discovered
      detail: An MSP, enterprise IT team, or public-sector buyer hits Azure, AVD, or Microsoft 365 operational complexity.
    - id: evaluate
      label: Estimate and pilot
      detail: The buyer models costs, evaluates a tenant or workload, and uses partner or Microsoft help to reduce implementation risk.
    - id: deploy
      label: First production deployment
      detail: One environment, tenant, campus workload, or city department goes live with Nerdio-managed automation and governance.
    - id: standardize
      label: Standardize operations
      detail: The team shifts recurring admin work, security templates, monitoring, and support flows into Nerdio rather than native portals alone.
    - id: expand
      label: Expand scope
      detail: Customers add more tenants, users, endpoints, or adjacent Microsoft-cloud workflows once the first deployment proves reliable.
    - id: advocate
      label: Reference and ecosystem loop
      detail: Successful customers become case studies, partner awards, or quoted references that strengthen future pipeline.
  approximationNotes: This journey map is synthesized from public case studies, partner-program pages, pricing pages, and review themes rather than from a disclosed funnel dashboard.
  claimRefs:
  - CU008
  - CU010
  - CU017
  - CU019
  - CU022
