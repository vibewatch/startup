company:
  name: Nerdio
chapter:
  number: 6
  title: Customers and Go-to-Market
  summary: 'Nerdio''s public customer evidence shows a broad but channel-heavy base: 23,000+ customers and 6.5 million users on the May 2026 homepage, up from 15,000+ customers and 5 million users at the March 2025 Series C announcement, with direct proof spanning MSPs, enterprises, higher education, nonprofits, and local government. The strongest go-to-market pattern is partner- and Microsoft-assisted acquisition—MSP per-tenant sales, enterprise per-user licensing, PartNERD programs, Carahsoft public-sector distribution, and Microsoft-introduced AVD deployments—backed by case studies that show meaningful cost, speed, and operational outcomes. The weakest part of the public record is customer-quality durability: Nerdio discloses no NRR, churn, contract length, segment mix, or top-customer concentration metrics, so this chapter can confirm adoption breadth far more confidently than retention economics.'
sections:
- id: customer-segments-and-routes
  title: Customer segments and the routes Nerdio uses to reach them
  body: 'Nerdio sells into at least three commercially distinct motions. The first and historically clearest is MSP-led: Nerdio Manager for MSP is priced per tenant, marketed around multi-tenant administration, and reinforced by PartNERD partner benefits, training, and margin language aimed at practice builders rather than end-user companies. The second is direct enterprise IT, where Nerdio Manager for Enterprise is priced per user or per managed endpoint module and case studies focus on internal cloud, endpoint, and AVD operations teams. The third is government and public sector, where Carahsoft and Microsoft-compatible Azure Government positioning appear to matter more than pure direct web acquisition. Public references also show sector breadth beyond classic software buyers, with proof in education, nonprofit, logistics, local government, and global enterprise brands. What remains undisclosed is the actual mix inside the 23,000+ reported customers: Nerdio does not say how many are MSP
    partners, end enterprises, public-sector accounts, or downstream client tenants managed through MSPs.'
