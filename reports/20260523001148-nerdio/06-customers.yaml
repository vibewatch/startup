- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver or risk
  - Current public reading
  - Potential impact
  - Diligence path
  rows:
  - - MSP-versus-enterprise mix opacity
    - Nerdio discloses aggregate customers and some enterprise adds but not installed-base mix by route
    - The company may be more channel-heavy or lower-ACV than the headline customer count suggests
    - Request customer count, ARR, and gross margin split across MSP, enterprise, and public sector
  - - Top-customer concentration
    - No public source discloses largest customer size or top-10 ARR share
    - A few large enterprise or partner accounts could matter disproportionately to growth and retention
    - Request largest-account ARR, top-10 concentration, and any single-partner dependency
  - - Partner and Microsoft dependence
    - Partner programs, co-sell language, marketplace placement, and Microsoft-introduced POCs are central to the motion
    - If partner productivity or Microsoft alignment weakens, pipeline and expansion could slow
    - Request sourced pipeline mix, partner-sourced ARR, and Microsoft-influenced bookings data
  - - Evidence-quality skew
    - The best customer-outcome evidence comes from vendor-authored case studies rather than third-party procurement or customer-domain announcements
    - Public references may overstate smooth deployments and understate failed or stalled rollouts
    - Request reference calls, customer-domain corroboration, and loss-analysis data
  - - Public-sector proof depth
    - Government motion is visible, but named agency references remain thin and one major case study keeps the city unnamed
    - Could limit confidence in procurement durability or federal penetration
    - Request named government references, contract vehicles, and current public-sector pipeline
  - - Review-site friction
    - Public complaints focus on updates, reporting friction, complexity, and Azure lock-in rather than on outright deployment failure
    - Usability or complexity issues can still slow rollout in lower-maturity customer environments
    - Request support-ticket trends, time-to-value metrics, and churn reasons tied to product complexity
  notes: Risk rows separate what public evidence supports from what still requires management disclosure. Lack of a public metric is treated as an unresolved diligence issue, not as proof that the risk is absent.
