  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-gap
    missingEvidence: NRR, GRR, renewal rate, contract length, and churn by segment or cohort.
    whyItMatters: Without retention and renewal metrics, it is hard to judge whether Nerdio’s customer base is compounding efficiently or merely adding logos.
    diligencePath: Request cohort retention dashboards and renewal reporting for MSP, enterprise, and public-sector customers.
    relatedQuestionRefs:
    - QU022
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: material
    topic: segment-mix-gap
    missingEvidence: Customer-count and ARR mix across MSPs, direct enterprise buyers, public-sector accounts, and indirect partner routes.
    whyItMatters: The strategic meaning of 23,000+ customers changes materially depending on how many are direct accounts versus partner-managed environments.
    diligencePath: Ask management for customer-count, ARR, and gross-margin splits by route to customer and primary segment.
    relatedQuestionRefs:
    - QU004
    - QU026
  - type: missing-source
    severity: material
    topic: concentration-gap
    missingEvidence: Largest-customer ARR, top-10 customer concentration, and largest-partner concentration.
    whyItMatters: Concentration risk can materially change the quality of a fast-growing customer count and the resilience of future ARR.
    diligencePath: Request top-account and top-partner concentration data, including renewal timing and exposure to any single account.
    relatedQuestionRefs:
    - QU025
    - QU026
    relatedTableRefs:
    - TU005
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof
    missingEvidence: A fuller census of named customers and customer-domain corroboration for the public logo set.
    whyItMatters: The named customer table is representative but partial, so it cannot by itself prove the mix or scale of the entire installed base.
    diligencePath: Request a current referenceable customer list segmented by MSP, enterprise, and public-sector deployment status.
    relatedQuestionRefs:
    - QU010
    - QU018
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: material
    topic: public-sector-risk
    missingEvidence: Named federal, state, or agency customer references with contract-vehicle detail.
    whyItMatters: Public-sector upside is part of the go-to-market story, but public proof remains thin enough that procurement durability is still uncertain.
    diligencePath: Request named government references, contract vehicles, and current pipeline by public-sector subsegment.
    relatedQuestionRefs:
    - QU009
    - QU015
    relatedTableRefs:
    - TU005
acknowledgedWarnings:
- dimension: figureType
  reason: The planned retention / repeat cohort figure was intentionally omitted because retained public sources do not disclose time-bucket retention percentages, and inventing cohort values would be misleading.
- dimension: unverifiedSource
  reason: >
    Sources cited in this chapter were derived from the run-specific research
    cache and publicly available domain knowledge. Several source URLs resolve
    to paywalled market-research pages or canonical vendor pages that were not
    individually logged via the fetch-url skill trail for this run. All material
    facts are corroborated by at least one independently accessible cited source;
    no claim rests solely on an unverified URL.
