- id: TU003
  title: Named customer proof table
  columns:
  - Customer
  - Segment
  - Deployment / use case
  - Production vs pilot
  - Outcome / impact
  - Limitation
  rows:
  - - Sage
    - Large enterprise software
    - Citrix migration and workload optimization with Nerdio-managed Azure environments
    - Production reference
    - Homepage cites 64% virtual-machine cost savings and nearly $1.5 million annual savings
    - Outcome is official-site proof rather than an independent customer filing
  - - Penn State University
    - Higher education
    - Azure Virtual Desktop management and analytics for university users
    - Production reference
    - Homepage cites 71% AVD-spend savings and 1,000 active users
    - Proof is official-site evidence with limited contract or renewal detail
  - - TeamLogic IT
    - Managed service provider
    - Multi-tenant cloud operations, quoting, and cost optimization for MSP clients
    - Production case study
    - 55% to 60% Azure compute savings for customers and quoting compressed from weeks to days
    - Vendor-authored case study; no independent customer-domain corroboration
  - - Priority Worldwide
    - Mid-market enterprise logistics
    - Shift from MSP-managed Azure to internal management with Nerdio Manager for Enterprise
    - Production case study
    - Over $20,000 per month compute savings and avoidance of an extra specialist Azure hire
    - Vendor-authored case study; spend base and contract structure are not disclosed
  - - Kilpatrick IT
    - Managed service provider
    - Forty-tenant Azure migration plus Microsoft 365 security standardization across 110 tenants
    - Production case study
    - 66% faster migrations, thousands of labor hours saved, and estimated 200% ROI
    - Vendor-authored case study; ROI estimate is customer-reported rather than audited
  - - Unnamed US local government
    - Public sector / local government
    - Azure Virtual Desktop proof-of-concept and broader municipal rollout
    - Pilot-to-production path
    - Over 600 users in the first month, deployments cut from weeks to hours, and average savings of $10,000 per month
    - The city is unnamed, which weakens referenceability despite concrete metrics
  - - City of Corona
    - Named municipality
    - Endpoint troubleshooting, security monitoring, and automation improvement
    - Production homepage reference
    - Named local-government reference with operator quote visible on the homepage
    - Homepage snippet does not provide quantified economics or rollout scale
  - - Teleperformance
    - Global enterprise / BPO
    - Transition from traditional VDI mindset to a cloud-based central management plane
    - Production customer quote in press release
    - Direct quote from Teleperformance virtualisation leadership supports enterprise production use
    - Proof is qualitative and does not disclose spend, seat count, or duration
  - - Make-A-Wish UK
    - Nonprofit
    - Azure cost reduction and digital-transformation support
    - Production homepage reference
    - Homepage cites 40% Azure-bill savings
    - Limited deployment detail beyond the savings claim
  - - Ceeva
    - Managed service provider
    - Azure Virtual Desktop delivery for midsized clients plus faster onboarding and simpler billing
    - Production case study
    - Two users up in 90 minutes and stronger ability to sell secure AVD to 30-to-150-user clients
    - Vendor-authored case study; commercial impact is directional rather than contracted revenue
  notes: This is a curated public sample of named customer proof visible on 2026-05-23. It is not a census of Nerdio customers, and proof quality varies from quantified case studies to lighter logo or quote references.
