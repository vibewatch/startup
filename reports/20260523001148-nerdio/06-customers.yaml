- id: customer-journey-and-channel-motion
  title: The customer journey usually starts with a practical Microsoft-cloud problem, then expands
  body: 'The strongest pattern in the evidence is not abstract brand affinity; it is workflow pain relief. MSP cases start with quoting, migration, tenant standardization, or security-template sprawl, then expand into broader Microsoft 365 and day-two operations once Nerdio becomes the operating console. Enterprise and public-sector stories start with Azure or AVD complexity, then broaden into cost governance, monitoring, endpoint management, or staff-level delegation. Microsoft appears in this journey as both platform dependency and route-to-market helper: the marketplace listing emphasizes Azure-application deployment in the customer''s own tenant, the local-government story says Microsoft introduced Nerdio into the proof-of-concept, and the enterprise partner program explicitly offers deal protection and co-selling. That pattern suggests a hybrid go-to-market engine rather than a single self-serve funnel. Customers can discover Nerdio through partners, Microsoft, or direct sales motions,
    but expansion depends on whether the product becomes embedded in everyday AVD, Windows 365, Intune, and Microsoft 365 operations.'
