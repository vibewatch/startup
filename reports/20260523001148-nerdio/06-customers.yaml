- id: durability-satisfaction-and-risks
  title: Durability, satisfaction, and concentration risk remain the least transparent parts of the story
  body: 'Public satisfaction signals are directionally positive. GetApp, Software Advice, TrustRadius, and SelectHub all present favorable user sentiment around ease of use, faster deployment, and cost optimization, which is consistent with the qualitative tone of Nerdio''s own case studies. But public review material also introduces useful caution: SelectHub notes intermittent product-update failures and inconvenient reporting split across Nerdio and the Azure portal, while ITQlick warns about Azure lock-in, small-business cost sensitivity, and the skills needed to exploit advanced automation fully. More importantly, the key retention metrics investors normally want are simply absent. No reviewed source disclosed NRR, GRR, logo churn, renewal rates, average contract length, or top-customer concentration. The result is a chapter where adoption breadth and use-case value are reasonably well evidenced, but customer-quality economics remain under-disclosed. That makes channel dependence, segment-mix
    opacity, and evidence-quality skew toward vendor-authored case studies the main unresolved diligence items.'
