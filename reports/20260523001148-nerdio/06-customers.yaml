tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Primary buyer / user / payer
  - Route to customer
  - Representative public proof
  - Strategic value
  - Key gap
  rows:
  - - MSP operators and their client estates
    - 'Buyer: MSP owner or cloud practice lead; user: MSP engineers and support teams; payer: MSP'
    - Direct MSP subscription plus PartNERD enablement
    - MSP pricing page; TeamLogic IT; Kilpatrick IT; Ceeva homepage reference
    - Likely the broadest-volume route and a strong distribution moat if partner retention holds
    - Nerdio does not disclose how much of the 23,000+ customer count is MSPs versus downstream client environments
  - - Direct enterprise IT
    - 'Buyer: CIO, cloud, EUC, or endpoint lead; user: internal IT admins; payer: enterprise IT budget'
    - Direct enterprise sales, per-user pricing, and partner-assisted deals
    - Enterprise pricing page; Priority Worldwide; Sage; Teleperformance quote; Chevron and Kraft Heinz brand references
    - Higher-ACV motion with clearer expansion into AVD, Windows 365, Intune, and Microsoft 365 operations
    - No public enterprise ACV, contract duration, or enterprise share of ARR
  - - Government and public sector
    - 'Buyer: public-sector IT and procurement; user: agency or municipal employees; payer: government IT budget'
    - Carahsoft distribution, Microsoft-introduced POCs, Azure Government-compatible deployment
    - Carahsoft page; unnamed US local government case study; City of Corona homepage reference
    - Important proof that Nerdio can sell into compliance-heavy and procurement-led environments
    - Named public-sector references are still sparse and one major case study keeps the city unnamed
  - - Education and nonprofit
    - 'Buyer: campus or nonprofit technology lead; user: staff, faculty, or nonprofit workers; payer: institutional IT budget'
    - Enterprise motion plus partner or Microsoft influence where relevant
    - Penn State and Make-A-Wish UK homepage references
    - Shows usefulness outside pure enterprise software buyers
    - Public references are strong on outcomes but weak on renewal economics or deployment scale beyond the cited metric
  - - Global enterprise brand references
    - 'Buyer: central IT or transformation team; user: broad employee base; payer: enterprise operations budget'
    - Direct enterprise and partner-assisted deals
    - Chevron, Kraft Heinz, ASDA, Carnival Cruise Line, Willis Towers Watson, Setfords, Sage, PayPal, Sony, Comcast
    - Brand validation helps enterprise credibility and later channel selling
    - Most logo references lack deployment scope, production maturity detail, or quantified outcomes
  - - Channel and alliance partners
    - 'Buyer: partner practice leader; user: partner sellers and engineers; payer: partner organization'
    - PartNERD MSP, PartNERD Enterprise, tech-alliance integrations, co-sell motions
    - Partners overview; Enterprise PartNERD program; NerdioCon partner awards
    - Partners extend reach and customer acquisition without Nerdio building every direct relationship itself
    - Partner-sourced pipeline share, partner attrition, and indirect-revenue dependence are undisclosed
  notes: This table mixes end-customer segments with the partner routes that bring those customers into Nerdio. The public record supports the segmentation, but not the exact percentage mix across the installed base.
