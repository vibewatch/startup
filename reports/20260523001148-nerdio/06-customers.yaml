- id: FU002
  title: Adoption / deployment funnel
  type: flow
  layout: wide
  summary: Discovery typically flows through cost estimation and pilot work before standardisation and broader tenant or user expansion.
  data:
    nodes:
    - id: n1
      label: Operational pain appears
      detail: Azure, AVD, or Microsoft 365 management is too manual, slow, or specialized.
    - id: n2
      label: Business case built
      detail: Teams use cost estimators, partner input, or Microsoft introductions to justify a trial.
    - id: n3
      label: Pilot or first tenant deployed
      detail: One customer environment, tenant set, or city use case goes live with guided setup.
    - id: n4
      label: Production operating model formed
      detail: Automation, monitoring, RBAC, support workflows, and baseline policies move into daily use.
    - id: n5
      label: Expansion motion starts
      detail: More tenants, users, security templates, or Microsoft 365 workloads attach to the platform.
    - id: n6
      label: Reference and partner leverage
      detail: Successful deployments turn into quoted references, partner awards, and additional channel demand.
