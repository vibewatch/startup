- id: TU006
  title: Channel and route-to-customer table
  columns:
  - Route
  - Primary buyer
  - Unit of sale / economics
  - Public proof
  - Why it matters
  - Dependency / gap
  rows:
  - - Direct MSP motion
    - MSP owner, cloud practice lead, or operations lead
    - Per tenant monthly pricing for Microsoft 365 management, AVD management, and Gov Edition minimums
    - MSP pricing page; TeamLogic IT; Kilpatrick IT
    - Explains how Nerdio can scale through many service providers without selling every end account directly
    - No disclosure of partner count, active-partner concentration, or partner churn
  - - Direct enterprise motion
    - Enterprise IT, EUC, cloud, or endpoint leader
    - Per user / per module pricing for AVD, Windows 365, and Unified Endpoint Management
    - Enterprise pricing page; Priority Worldwide; homepage enterprise references
    - Shows a clearer higher-ACV route than MSP tenant pricing alone
    - No public ACV, seat-expansion, or enterprise renewal data
  - - Partner-assisted enterprise
    - VAR, consultant, integrator, or reseller
    - Deal registration, partner support, co-sell, and enablement rather than simple referral
    - Enterprise PartNERD program; partner overview; partner awards
    - Suggests Nerdio can use indirect coverage to reach larger enterprise opportunities
    - Partner-sourced pipeline and win-rate uplift are not disclosed
  - - Microsoft-assisted opportunity creation
    - Joint Microsoft and customer IT stakeholders
    - Marketplace acquisition, internal-use licenses, or Microsoft-introduced proof-of-concepts
    - Marketplace listing; local-government case study; partner awards Microsoft alignment language
    - Strengthens acquisition efficiency inside the Microsoft ecosystem
    - Increases platform and ecosystem dependency
  - - Public-sector distribution
    - Agency procurement, reseller, or public-sector IT buyer
    - Carahsoft-led procurement plus Azure Government and compliance messaging
    - Carahsoft public-sector page; local-government and City of Corona proof
    - Important for agencies that prefer existing contract vehicles and trusted distributors
    - Named federal-agency proof is still absent from retained public sources
  notes: This extra table is a go-to-market lens rather than a pure customer census. It distinguishes who buys from Nerdio, how contracts appear to be structured, and where channel or Microsoft assistance likely affects conversion.
