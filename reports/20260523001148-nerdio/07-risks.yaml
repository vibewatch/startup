  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: customer-partner-concentration
    missingEvidence: Partner-level and customer-level revenue concentration, including top MSP cohort exposure and segment mix across MSP, enterprise, and public sector.
    whyItMatters: A concentrated partner or customer base would make revenue durability materially more fragile than the public growth story suggests.
    diligencePath: Request customer concentration schedule, partner-sourced ARR mix, top-10 cohort analysis, and contract duration by segment.
    relatedQuestionRefs:
    - QR006
    - QR029
  - type: private-evidence-only
    severity: material
    topic: microsoft-contractual-protection
    missingEvidence: Any contractual protections, API commitments, or change-notice rights Nerdio has with Microsoft for critical platform dependencies.
    whyItMatters: Without understanding dependency protections, investors cannot judge how much unilateral platform risk Microsoft can impose.
    diligencePath: Review Microsoft partnership agreements, API dependency map, and internal contingency plans for native-feature overlap or partner-term changes.
    relatedQuestionRefs:
    - QR026
  - type: private-evidence-only
    severity: material
    topic: regional-data-hosting
    missingEvidence: Region-by-region data-hosting architecture, transfer mechanisms, localization roadmap, and local support coverage for Europe, APAC, and the Middle East.
    whyItMatters: International growth can stall or backfire if residency, support, or transfer controls lag local enterprise or regulator expectations.
    diligencePath: Request architecture diagrams, DPA / SCC documentation, support SLAs, and customer references by region.
    relatedQuestionRefs:
    - QR027
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics-disclosure
    missingEvidence: NRR, gross margin, CAC, payback, burn, runway, renewal rates, and audited support for the profitability claim.
    whyItMatters: These metrics determine whether Nerdio merits a premium multiple or only a growth story with incomplete proof of durability.
    diligencePath: Obtain audited or board-level KPI packages, cohort retention analysis, gross-margin bridge, and cash-flow forecast.
    relatedQuestionRefs:
    - QR028
  - type: private-evidence-only
    severity: material
    topic: public-assurance-gap
    missingEvidence: Public or private audit attestations, SLA history, and incident-response evidence that go beyond website policy statements.
    whyItMatters: For regulated and enterprise buyers, privacy-policy language is not a substitute for assurance evidence and operational reliability proof.
    diligencePath: Request SOC 2 / ISO reports, customer security questionnaires, uptime / incident logs, and escalation runbooks.
    relatedQuestionRefs: []

