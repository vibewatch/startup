- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Microsoft native competition
    - First-party consoles absorb key Nerdio workflows
    - Two or more core admin / policy / cost workflows become meaningfully native with no compensating Nerdio price or capability lead
    - Re-rate moat and lower long-term pricing-power assumptions
  - - Microsoft pricing compression
    - Further Windows 365 or adjacent bundle price movement
    - Another >10% downmarket effective price cut or major bundle change into Microsoft suites
    - Stress-test SMB / midmarket elasticity and revise growth assumptions
  - - Key-person loss
    - Founder or commercial leader departure
    - Vadim Vladimirskiy or Joseph Landes exits or materially steps back without an orderly successor handoff
    - Pause underwriting and re-evaluate customer, partner, and product continuity
  - - Execution strain
    - Rapid-scaling integration begins to wobble
    - Executive turnover within 12 months, slowing release cadence, or visible reorg churn after 2026 hires
    - Haircut operating leverage and pipeline-conversion expectations
  - - Financial opacity persists
    - Core SaaS quality metrics remain unavailable in diligence
    - Management cannot provide credible private support for NRR, gross margin, CAC/payback, burn, and concentration
    - Maintain research-more stance and refuse a full premium multiple
  - - Concentration surprise
    - ARR dependence on top partners or customers proves high
    - Any single partner >5% ARR or top ten cohorts >40% without long-duration contractual support
    - Apply concentration discount and reassess churn downside
  - - Compliance or residency miss
    - International execution fails local requirements
    - Delayed support localization, DPA gaps, or customer pushback on data sovereignty in Europe, APAC, or the Middle East
    - Slow or cap international-growth underwriting until controls are proven
  notes: Thresholds are investor monitoring constructs derived from retained public evidence; they are not disclosed by Nerdio. The goal is to translate qualitative risk into observable red flags.
