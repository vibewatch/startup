summary:
  headline: |
    Nerdio 是 Microsoft EUC 管理平台里的品类领导者，ARR 超过 $100M，增速 85%+，已盈利且进入独角兽行列；但 Microsoft 单一供应商风险足以影响生死，财务也不透明，限制了投资级尽调。
