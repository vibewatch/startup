      - number: '2.2'
        title: TAM、SAM 和 SOM 框架
        blocks:
          - type: paragraph
            body: >-
              头部市场研究支持一个大且仍在扩张的漏斗顶端，但各家对市场口径并不一致。Research and Markets 称创作者经济 将从 2025 年的 $255.66 billion 增至 2026 年的
              $323.48 billion；The Business Research Company 则把口径更窄的 内容创作者经济定在 2026 年 $205.81 billion。Goldman Sachs
              仍方向性看多，认为受达人营销和平台打款驱动， 该品类可能从 2023 年约 $250 billion 扩到 2027 年 $480 billion。


              放到 Whop 身上，这些自上而下数字只是宽口径总可用市场（TAM）。更相关的可服务市场（SAM）是那些真正销售自有 数字体验、且需要集成商业轨道而不只是受众触达的创作者。Circle 的 2026 年变现结构和
              MBO 的创作者供给数据提示， 这个 SAM 主要落在会员驱动业务、课程、服务、软件访问，以及像微型 SMB 一样运营的创作者销售的数字商品上。 公开证据足以说明，SAM 明显小于宽口径创作者经济
              TAM，但仍在扩张；公开证据不足以钉死硬性的可获取市场（SOM）。 已审阅的 Whop 材料没有披露 GMV、活跃卖家数、退款率或移动端结账结构，因此任何精确市场份额数字都更像表演， 不像尽调。
