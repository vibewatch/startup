  - id: TV005
    title: 可比估值表
    columns:
      - 可比公司
      - 模型
      - 当前销售额倍数
      - 与 Whop 的相关性
      - 主要限制
    rows:
      - - Etsy
        - 聚合数字 / 实物卖家需求的市场平台
        - 约 2.21x P/S
        - 可作为买家发现、卖家信任和抽佣纪律的市场平台基准。
        - 实物商品敞口和成熟增长曲线，让它比 Whop 更不像软件。
      - - Shopify
        - 商业基础设施 / 软件平台
        - 约 12.4x P/S
        - 结账、支付和商户工具的最佳溢价基准。
        - 披露质量远高于 Whop、规模远大，质量也明显强于 Whop 当前公开证据。
      - - Fiverr
        - 数字服务市场平台
        - 约 0.95x P/S
        - 自由职业 / 数字收入市场平台变现的好参照。
        - 劳动力市场经济性不同于创作者产品变现。
      - - Wix
        - 创作者 / SMB 网站和商业工具
        - 约 1.21x P/S
        - 更适合参照创作者工具和 SMB 赋能，而不是市场发现。
        - 网站软件组合的审核风险更低，订阅经济性更成熟。
    notes: 公开可比视角刻意混合市场平台和商业基础设施公司，因为 Whop 横跨两者。倍数截至 2026 年 5 月，来源为 CompaniesMarketCap。
    enumerationScope:
