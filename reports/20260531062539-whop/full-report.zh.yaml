  - id: TI005
    title: 公开财务缺口表
    columns:
      - 缺失指标
      - 缺失原因
      - 承销影响
      - 精确尽调路径
      - 严重性
    rows:
      - - 毛利率 / 收入成本
        - 已审阅公开来源没有经审计 P&L 或管理层披露
        - 无法测试 Whop 更像软件、支付，还是低毛利市场混合体
        - 索取经审计利润表，并按支付、打款、支持和欺诈拆分收入成本
        - 重大
      - - CAC / 回本周期 / 销售效率
        - 没有公开获客成本、回本周期或销售周期披露
        - 无法判断市场分发是否真的降低获客成本
        - 索取付费 vs 自然获客组合、队列 CAC，以及按商户细分的回本周期
        - 重大
      - - 流失 / NRR / 队列留存
        - 私有公司，未公开队列表或留存评论
        - 无法给收入耐久度或商户 LTV 定价
        - 要求提供按品类和获客渠道拆分的月度商户留存、NRR 和流失
        - 重大
      - - 现金余额 / 烧钱速度 / 现金跑道
        - 公开融资公告未披露非受限现金或月度现金消耗
        - 资本充足性判断仍是定性而非定量
        - 要求提供董事会汇报包，包含现金桥、烧钱速度和现金跑道情景
        - 阻断性
      - - 按渠道拆分的实际抽成率
        - 公开信息只有标价费率和外部费率堆栈估算
        - 收入质量和利润率路径无法在市场与站外交易量之间归一比较
        - 要求提供按市场推荐、嵌入式结账、BNPL、FX 和出款拆分的 GMV、TPV 与净收入
        - 重大
      - - 用户和卖家指标定义桥
        - 公开来源引用的用户和卖家数量不同，但没有口径桥接
        - 连顶层规模指标都存在定义风险
        - 要求管理层给出 MAU、用户、卖家、活跃商户和产品的定义
        - 轻微
    notes: 因此，本章认可 Whop 的变现宽度，但在可由尽调支撑的盈利能力和现金跑道上保持谨慎。
