        - 显示在公开市场倍数压缩前，投资者曾为创作者分发工具支付高溢价。
        - 个人简介链接模式与 Whop 的支付和市场栈不可直接相比。
    notes: 这一交易视角是校准工具，不是直接公允价值捷径。较早的私人轮次发生在宽松得多的资本市场环境里。
