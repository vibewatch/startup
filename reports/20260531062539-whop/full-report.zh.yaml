companyProfile:
  summary: >-
    Whop 是一家私营创作者电商平台，Steven Schwartz、Cameron Zoub 和 Jack Sharkey 于 2021 年创办。
    公司最初是数字社区和互联网产品的市场，之后扩展为更宽的记录商户和支付栈，如今支持社区、课程、 软件、辅导和打款。公开来源显示公司位于纽约布鲁克林；融资路径很快，从 2023 年 $17M Series A 到 2026 年 2 月
    Tether 领投的 $200M 战略轮，估值约 $1.6B。Whop 的规模指标很强，但治理深度、 经审计财务表现和资本结构细节在公开记录里仍有限。
