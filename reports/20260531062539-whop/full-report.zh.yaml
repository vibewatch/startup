        title: 支付、审核和声誉风险
        blocks:
          - type: paragraph
            body: >-
              Whop 的支付风险和审核风险紧密相连。Buyer Terms、Seller Terms
              和定价披露显示，公司已经搭出一套明确机器，处理订阅、争议、冲正、准备金和多轨打款；这是优势，也意味着支付摩擦是一阶运营变量。卖家直接承担拒付和退款责任，争议指标恶化时，Whop
              或其金融合作伙伴可以设置准备金或暂停打款。纸面上，这保护了平台。实际中，外部评测界面说明风险为什么仍会落到 Whop
              品牌上：公开投诉已经提到未经授权扣费、取消摩擦、退款延迟、打款问题、虚假评论和垃圾化的市场质量。平台自己的政策也承认威胁，禁止虚假评论、平台操纵、欺骗性收益宣传和支付滥用。青少年安全规则也显示，Whop
              知道部分类别需要更严格处理，尤其是未成年人和体育博彩相关场景。开放问题在执行质量：公开证据没有显示审核人力、投诉解决
              SLA、准备金水平，或来自更高风险类别的争议占比。这让投资者要承保一个市场：声誉恶化的速度可能快于政策语言的约束速度。
