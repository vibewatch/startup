        title: 财务结论与尽调阻塞项
        blocks:
          - type: paragraph
            body: >-
              Whop 故事中可投资的部分很清楚：公开证据支持真实规模、多层变现栈，以及一门正从市场抽成走向更宽支付和打款基础设施的业务。
              不可投资的部分同样清楚：利润率路径、现金消耗、留存质量和渠道结构基本仍是私有信息。这里反向证据重要。评测来源提到打款投诉和 审核担忧，独立分析则强调 Whop
              暴露于剪辑、博彩相邻和其他灰色市场品类。这些品类短期可能变现很好，但会抬高合规成本、声誉风险和 损失率波动。我的财务判断因此是：对营收变现保持建设性，对收入质量保持谨慎。承销时应把 Whop
              视作快速增长的市场加支付平台， 拥有可信变现杠杆；但在假设持久盈利或干净现金跑道之前，必须拿到毛利率、退款 / 拒付、队列留存和不受限现金的硬数据。
