      - number: '2.3'
        title: 买方细分、用户和预算负责人
        blocks:
          - type: paragraph
            body: >-
              供给侧买家通常是创作者运营者：单人创作者、教育者、软件发行方，或希望直接变现而不是等待赞助或平台广告收入的
              小团队。需求侧终端用户则是购买社区、课程、信号、模板或软件访问权的会员、订阅者或客户。有些场景里买家和付款人 是同一个人；另一些场景里，创作者团队或运营者购买工具，终端会员通过经常性订阅或一次性购买为业务买单。


              这个切分重要，因为 Whop 卖给卖家的是基础设施，而卖家再向下游粉丝或商业用户变现。会员驱动业务看起来尤其契合平台： Circle 称 88% 的社区建设者现在靠付费会员变现，67%
              的会员仍通过社交平台发现社区，这意味着创作者既需要转化工具， 也需要站外分发。课程、辅导和类软件访问产品也适合同一套商业栈，因为它们都需要权限、支付、退款和交付。因此，
              预算负责人通常是供给侧的创作者业务，但最终收入付款人是需求侧的经常性会员或客户。
