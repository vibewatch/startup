      - number: '7.2'
        title: 监管、法律与政策边缘暴露
        blocks:
          - type: paragraph
            body: >-
              最尖锐的法律和合规风险，并不是 Whop 公开营销被禁金融产品；而是 Whop 公开营销外汇、期权、加密货币和体育博彩等类别，而自己的政策框架又为这些受监管活动边缘的教育或咨询产品留下空间。Prohibited
              Products 政策禁止未注册金融服务、直接数字资产销售和非法博彩运营，但明确允许教育性加密内容、博彩 picks 或分析，只要交易被包装成信息，而不是直接销售受监管工具。这个豁口很重要，因为 Whop
              还向联盟会员和 bounty 参与者付费推广产品；FTC、FINRA、SEC 和 CFTC 也持续警告，数字推广、背书、在家赚钱 offer 和股票提示内容都可能触发消费者保护或证券问题。Whop
              有有意义的缓释措辞：禁止欺骗性收益宣传，联盟会员必须披露报酬，卖家必须守法，Whop 可以暂停账户或扣留资金。但政策文本不等于已经验证的执行质量。没有类别级 GMV
              结构、执法统计或外部律师确认函时，只要市场过度偏向交易信号、快速致富或博彩相邻社区，投资者就应假设残余风险较高。
