  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 品类定位与格局结构
        blocks:
          - type: paragraph
            body: >-
              Whop 并不在一个整齐的 SaaS 盒子里竞争。保留下来的证据指向的是一个创作者电商操作系统：它把市场分发、结账、打款和 付费访问工作流合在一起，而多数替代品只专注这项任务中的一层。Gumroad、Stan 和
              Payhip 是更简单的数字产品店面或 个人简介链接工具。Patreon、Skool 和 Discord 更直接地变现付费社区，但不管理完整卖家运营。Kajabi 是价格更高的
              自有受众套件，面向课程、辅导和漏斗。Fourthwall 是商品和会员栈。Shopify 与 Lemon Squeezy 则是商业基础设施替代品， 适合那些更看重结账、订阅和合规，而不是发现或付费社区的卖家。


              这个结构重要，因为 Whop 最强的公开切入点并不是纯价格领先。Whop 收取按使用计费的支付费用，但也营销 22M+ MAU、 27,000+ 家企业以及覆盖 241+
              地区的集成打款。换句话说，公司卖的是打包触达和运营杠杆，不只是一个结账小组件。 这让它直接与拼装式创作者栈竞争：Patreon 或 Discord 负责社区，Shopify 或 Lemon Squeezy
              负责计费，Kajabi 负责 自有受众教育。买家的实际问题是他们最看重哪一层，因为很少有对手能同时覆盖发现、商业和打款。
