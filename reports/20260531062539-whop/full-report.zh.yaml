  - id: TV004
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 收入假设
      - 估值区间
      - 核心风险
      - 概率信号
    rows:
      - - 乐观
        - 支付网络粘性得到验证，经审计收入达到 ~$180M-$220M，抽佣率维持在 ~5.5%-6.0%，信任问题保持可控。
        - $180M - $220M
        - $1.6B - $2.2B
        - 只有 Whop 表现得更像 Shopify 而不是市场平台，溢价倍数才站得住。
        - 20% - 25%
      - - 基准
        - 经审计收入为 ~$120M-$150M，卖家增长保持健康，市场给予 7x-8.5x 的混合倍数。
        - $120M - $150M
        - $0.9B - $1.3B
        - 该情景仍假设执行扎实，但披露或利润率并非一流。
        - 45% - 50%
      - - 悲观
        - 收入落在 ~$80M-$100M，抽佣率压缩，审核 / 打款问题把市场判断推向市场平台倍数。
        - $80M - $100M
        - $0.3B - $0.6B
        - 股权结构优先级可能让普通股下行比表面区间更严重。
        - 25% - 35%
    notes: 情景概率只是定性信号，不代表预测精度。区间由当前上市可比公司和 Whop 特定不确定性推导，是分析师估计。
