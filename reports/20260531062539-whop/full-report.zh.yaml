      - number: '4.3'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              Whop 披露的融资历史足以显示它获得了大量支持，但不足以有把握地承销现金跑道。TechCrunch 报道 2023 年 $17M Series A； Sacra 列出 2026 年融资前 $67M 融资和
              $800M 估值；随后 Tether 宣布一笔与稳定币打款基础设施绑定的 $200M 战略投资。 这组信息强烈暗示，至少在非常近期，Whop
              不受资本约束，尤其是软件驱动的产品扩张。即便如此，公司财务仍不透明。本报告审阅的 公开来源没有提供不受限现金、月度烧钱、毛利率、债务或正式现金跑道；条款还强调，支付资金由第三方金融伙伴持有，而不是由 Whop
              自己持有。稳定币打款可能降低结算摩擦，并改善难服务地区的转化，但不能替代对底层商户质量、损失率或运营杠杆的证明。 用于尽调时，2026 年融资在定性上改善了资本充足性，但最重要的承销数学仍未披露。
