        - 官方标价，不是实际净抽成
      - - 国际卡附加费
        - +1.5%
        - 卖家 / 商户
        - 提高跨境需求收益
        - 可能被更低转化或更高争议风险抵消
      - - 货币兑换
        - 需要时 +1%
        - 卖家 / 商户
        - 变现跨币种交易量
        - 取决于 FX 组合和商户地理分布
      - - 融资 / BNPL
        - 每笔融资交易 15%
        - 卖家 / 商户通过结账经济账间接承担
        - 融资交易量上的名义收益率很高
        - 采用率和风险画像按品类未披露
      - - ACH 借记
        - 1.5%，封顶 $5
        - 卖家 / 商户
        - 高 AOV 本土交易的低成本替代
        - 公开文档未披露 ACH 占比
      - - 自动化 / 平台费
        - 自动化准入销售约 3%（第三方报道）
        - 卖家 / 创作者
        - 可能把实际抽成率抬到官方处理费之上
        - 官方定价页未说明；按外部估计处理
