    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份定位、产品面与创立故事
        blocks:
          - type: paragraph
            body: >-
              Whop 的公开足迹已经不只是一个简单的创作者店面工具。面向买家和卖家的官方页面把它描述为 社交电商和互联网业务平台：用户可以发现并购买数字社区、课程、工具、辅导、软件及其他线上产品的
              访问权。公司自己的术语很关键：每个卖家都会搭建一个「whop」，把聊天、论坛、直播辅导、结账和 分析打包到一个目的地；更大的网络页面则把 Whop 定位成企业的市场以及支付和分发层。这个框架与 2023 年
              Series A 以来第三方报道追踪到的公司演变一致。TechCrunch 和 CNBC 都把创立故事锚定在 Steven Schwartz 与 Cameron Zoub 早年的球鞋抢购机器人业务上，Jack
              Sharkey 则加入核心创始团队， 在 2021 年 3 月推出 Whop。公开商业档案显示公司位于纽约布鲁克林。因此，本章的身份判断不只是 Whop
              在卖数字商品；更重要的是，公司一直被重新包装为互联网原生业务的基础设施。后续章节也应把 店面、市场和支付轨道视为一个互联的产品系统，而不是几项彼此分离的赌注。
