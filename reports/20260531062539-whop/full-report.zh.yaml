  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 当前估值要求 Whop 达到高端基础设施的质量门槛，但它仍背着私募市场的不透明。
    data:
      nodes:
        - id: scale
          label: |-
            规模证明
            18.4M+ 用户 / 22M+ MAU
            27k+ 商家
          type: strength
        - id: payments
          label: |-
            支付栈
            100+ 种方式
            241 个地区
          type: strength
        - id: premium-price
          label: |-
            当前价格
            $1.6B = 约 11.3x 估计收入
          type: risk
        - id: opacity
          label: |-
            不透明
            无经审计收入，也无股权结构条款
          type: risk
        - id: quality
          label: |-
            信任 / 品类风险
            诈骗、争议、博彩 / 交易组合
          type: risk
        - id: public-bar
          label: |-
            公开市场标尺
            高于 Etsy / Fiverr / Wix
            接近 Shopify
          type: neutral
        - id: recommendation
          label: |-
            建议
            观察
            估值立场：偏高
          type: conclusion
    approximationNotes: 这是定性决策流，不是加权评分模型。节点位置反映证据基础推导出的投资判断逻辑。
    claimRefs:
