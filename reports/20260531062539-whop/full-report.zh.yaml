  - id: TP005
    title: 护城河耐久度 / 竞争风险清单
    columns:
      - Whop 护城河主张
      - 威胁或替代路径
      - 严重性
      - 留存来源中的证据
      - 含义 / 尽调问题
    rows:
      - - 发现与电商打包
        - 创作者可能只看重一层，转而买更简单的单一用途工具
        - 高
        - Gumroad、Stan、Payhip、Patreon 和 Discord 都用更窄的运营覆盖解决更窄的任务
        - 按卖家类型测试赢单率，不要假设存在一个通用竞争集
      - - 市场触达和网络效应
        - Whop 未披露 GMV 或卖家获取中有多少实际来自市场流量
        - 高
        - Whop 引用 22M+ MAU 和 27,000+ 商家，但未披露发现流量对 GMV 的贡献
        - 索取卖家级归因数据，以及与市场需求绑定的复购队列
      - - 支付和打款深度
        - 对软件或通用电商卖家，Lemon Squeezy 和 Shopify 是更强的基础设施选择
        - 高
        - Lemon Squeezy 的 MoR / 税务信息更清晰；Shopify 是覆盖更广的电商既有玩家
        - 将 Whop 销售管线拆分为创作者原生社区卖家与基础设施主导的软件卖家
      - - 社区相邻场景
        - 如果全部任务就是付费社区，Patreon、Skool 和 Discord 能赢
        - 中
        - 会员优先买家更容易理解这些平台
        - 衡量 Whop 社区产品相对纯结账产品的附加率
      - - 合规外包
        - Whop 卖家条款定义的 MoR 角色，比合规主导对手宣传的更窄
        - 高
        - 在支付结算之外，卖家仍是 VAT、销售税和消费者保护责任的供应方
        - 厘清税务、退款和消费者责任上，Whop 仍让卖家承担多少摩擦
      - - 周边和实体品牌扩张
        - Fourthwall 对创作者品牌讲出了更好的周边叙事
        - 中
        - Fourthwall 处理生产、发货、支持和社交周边货架分发
        - Whop 不应假设数字产品强势会自动迁移到周边占比高的品类
    notes: 严重性反映的是：若竞争对手在结构上最强的细分市场执行到位，可能对 Whop 竞争赢单率造成多大影响。
