        - 卖家 / 创作者
        - 金额不大，但对低 ARPU 创作者有实质影响
        - 需要官方确认，并给出提现金额分布
    notes: 第 1-5 行来自 Whop 官方定价 / 文档；第 6-7 行是 2026 年第三方定价观察，在管理层确认前只能作为方向性信息。
