      - number: '6.5'
        title: 扩张循环、投诉和集中度风险
        blocks:
          - type: paragraph
            body: >
              Whop 确实有可信的扩张机制。平台把支付、打款、钱包、聊天和 app 集成到一起；支持 100 多种支付方式；开放开发者 app 生态；还运行 Content Rewards
              和内置联盟流程，可以把创作者推向相邻产品、更多买家和更频繁的社区活动。这些循环解释了 Whop 为什么能维持市场宽度。但下行面同样清楚。收入生成高度集中：被追踪产品中只有 11% 真正变现，约 0.5% 超过
              $10K/month。曝光最高的类别也最考验信任：切片、交易、体育博彩、高客单价教练和商业机会类产品占据头部榜单。独立评测来源反复出现同一组负面主题——退款摩擦、打款延迟、垃圾信息、诈骗暴露和支持质量不均——说明信任负担同时压在卖家和买家身上。因此，集中度有两条轴线：经济上集中在少数产品，声誉上集中在容易带来拒付、低质供给或政策审查的类别。尽调最缺的关键数据，是卖家队列流失、头部卖家
