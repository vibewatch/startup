  - id: TI001
    title: 收入来源表
    columns:
      - 收入流
      - 机制
      - 公开信号 / 当前状态
      - 收入质量
      - 尽调问题
    rows:
      - - 市场发现 / 推荐抽成
        - 卖家为 Whop 市场带来的需求付费
        - 官方可见市场和评分页面；实际推荐经济账未披露
        - 如果复购买家能转化，收入质量可能较高；但渠道组合不公开
        - 拆出市场来源与自有来源销售的 GMV 和净收入
      - - 嵌入式结账处理
        - 卖家自有结账流程上的 2.7% + $0.30 卡处理层
        - Whop 定价页和文档页披露官方标价
        - 随规模大概率具备持续性，但企业商户存在费率压缩风险
        - 提供按队列划分的净支付收入、拒付损失和企业折扣
      - - 跨境和 FX 加价
        - 国际卡和 FX 兑换产生额外附加费
        - 官方公开 +1.5% 国际卡附加费和 +1% FX 费
        - 变现抓手好，但客户成本敏感
        - 展示国际交易量组合、FX 触发比例和跨境授权率
      - - 融资 / BNPL
        - Whop 在分期交易中赚取融资伙伴经济收益
        - 官方融资费为每笔成功融资交易 15%
        - 单笔收益率高，但潜在风险更高且品类相关
        - 披露 BNPL 渗透率、批准率和违约 / 拒付暴露
      - - 打款和结算工具
        - 打款方式、提现费和更快的全球结算增加变现层
        - 官方披露多轨打款覆盖；打款费用主要来自第三方解释
        - 支撑净抽成率，但对小创作者可能更重
        - 披露打款费收入、平均提现金额和卖家提现频率
    notes: 公开材料披露标价和打款能力，但没有披露各渠道净收入占比；因此若干行把官方事实与第三方费项栈估计分开。
