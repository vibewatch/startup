        - 22M+ MAU；27,000+ 家企业
        - 需要发现、结账和提现的多产品创作者
        - 市场、支付和提现集于一个工具栈
        - 相比合规卸载能力更强的竞争对手，MoR 范围有限
      - - Gumroad
        - 简单数字店面 / 市场
        - 保留的官方缓存中没有清晰的当前公司数量；二手比较引用 >$1B 的累计提现
        - 销售下载、课程和会员制的独立创作者
        - 零月费；Discover 加 MoR 税务处理
        - 抽成率远高于 Whop，原生社区/提现深度较轻
      - - Patreon
        - 会员制 / 社区平台
        - 保留的独立缓存中只有 Trustpilot 投诉信号
        - 通过独家内容和社区变现的粉丝订阅型创作者
        - 成熟的会员制功能，加上欺诈、争议和税务处理
        - 10% 标准抽成外加额外费用；商务模型更窄
      - - Kajabi
        - 一体化专家业务套件
        - 100K+ 家企业；赚取 $10B+；服务 75M+ 客户
        - 课程、教练和自有受众教育业务
        - 漏斗、电子邮件、AI 和社区集于一个套件
        - 该领域最高固定月成本，且没有市场发现信号
      - - Stan
        - 个人简介链接创作者店面
        - 保留来源中没有清晰的公开创作者数量披露
        - 以社交为先、销售下载、预约和轻量会员制的创作者
        - 快速设置且平台交易费为零
        - 没有免费计划，分析基础，没有市场覆盖
      - - Skool
        - 社区/课程平台
        - 除计划标签外，公开定价披露较少
        - 付费群组、同期班式社区和教练服务
        - 简单的社区优先 UX，配有联盟伙伴
        - 公开费用/合规披露不完整，商务轨道较轻
      - - Fourthwall
        - 周边商品、商店和会员制工具栈
        - 500,000+ 名创作者
        - 销售周边商品以及会员制或数字附加项的创作者品牌
        - 处理周边商品履约、社交购物和客户支持
        - 产品重心首先是周边商品，支付/提现深度证据较少
      - - Discord
        - 社区变现底层平台
        - 大规模社区平台，但保留缓存中没有清晰的创作者数量指标
        - 通过访问权限和福利变现的服务器社区
        - 深度参与界面和 90/10 收入分成
        - 变现入驻仅限美国，且有类别限制，也没有店面深度
      - - Shopify
        - 通用商务基础设施
        - 公开既有厂商；保留来源中未单独列出创作者专属规模
        - 需要广泛商务工具的品牌和社交卖家
        - 成熟的商务工具栈、社交销售和数字产品支持
        - 并非创作者社区原生，且本证据集中没有市场发现层
      - - Lemon Squeezy
        - SaaS 计费 / MoR
        - Stripe 托管支付更新是保留缓存中最清晰的公开规模信号
        - 软件、SaaS 和全球数字卖家
        - 强大的 MoR、订阅、客户门户和许可证密钥
        - 没有原生市场或社区层
      - - Payhip
        - 托管式创作者店面
        - 保留来源中没有清晰的公开规模披露
        - 面向预算敏感创作者的下载、课程和会员制
        - 免费计划姿态、即时提现和简单设置
        - 保留缓存中的公开费用阶梯较薄，发现/社区弱于 Whop
