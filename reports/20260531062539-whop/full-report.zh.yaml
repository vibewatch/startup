      - number: '8.4'
        title: 建议、入场纪律和尽调路径
        blocks:
          - type: paragraph
            body: >-
              证据支持以中等信心列为观察，在 $1.6 billion
              上一轮价格下，估值立场偏高。公司确有强项：很大的分发面、更有野心的支付基础设施、全球打款功能，以及足以支撑较慢速公开市场型公司之上溢价的增长证据。但当前价格已经假设高质量执行。公开数据仍过度依赖公司营销的用户数、分析师估计的收入，以及对类别结构、争议和资本结构的不完整背景。这还不足以支撑按标题价格直接买入。


              价格仍能让故事变得有吸引力。普通股等价入场区间在约 $0.9 billion-$1.2
              billion，更能匹配公开可比公司，也给执行风险留出空间。另一种选择是，投资者只有在拿到强下行保护、信息权，并明确优先级顺位及 Tether
              交易中授予的任何战略权利后，才接近当前价格参与。尽调路径因此很直接：核对 KPI 定义，取得审计收入和抽佣率细节，梳理完整股权结构表，测试 Whop Payments
              是否真的改善授权率、留存和跨境变现。如果这些检查结果干净，Whop 可以挣到溢价倍数。在此之前，正确姿态不是不相信公司，而是对价格保持纪律。
