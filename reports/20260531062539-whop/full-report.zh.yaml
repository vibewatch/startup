  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资背景与 GMV 到收入的转换
        blocks:
          - type: paragraph
            body: >-
              Whop 2026 年 2 月的融资很容易写成标题，却更难做投资判断。第三方报道把 Tether 投资描述为一张 $200 million 支票、估值 $1.6 billion；Tether
              自己的公告则更强调战略协同、稳定币基础设施和国际扩张，而不是轮次机制。这个区别很重要：市场知道标题价格，却不知道优先股堆叠、转换条款或下行保护。做估值时，公开记录因此给出了清晰的投后标记，却没有给出清晰的普通股标记。


              经营转换同样亮眼但噪声很大。官方页面称用户超过 18.4 million、年参与者收入约 $3 billion；network 站点现在营销 22M+ MAU 和 27,000+
              家企业。这些差异可能反映持续增长和不同指标定义，也说明标准化披露仍然薄弱。变现上，Whop 官方费率栈从国内卡 2.7% + $0.30
              起步，再叠加国际、外汇、编排、billing、联盟、融资和打款费用。因此，Sacra 对 2025 年初约 5.5% 混合抽佣率的估计，在方向上可信。用 Sacra 的 $142 million
              年化收入估计，对应上一轮约 ~11.3x 收入倍数；而公司自己的 >$1 billion 支付量下限意味着 <1.6x GMV。这是溢价价格，但如果 Whop
              能证明支付网络带来持久、类软件的变现，而不是薄利支付处理商经济性，就不算明显荒谬。
