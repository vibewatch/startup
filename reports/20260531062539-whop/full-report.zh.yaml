      - number: '2.5'
        title: 需求驱动因素与结构性逆风
        blocks:
          - type: paragraph
            body: >-
              市场的正向逻辑很直接：创作者活动在职业化，经常性会员模型在增强，更多创作者开始像全球分布的互联网企业那样运营。 Goldman 把增长与达人营销和平台打款联系起来；Research and Markets
              明确点名在线社区和创作者工具是增长驱动； The Business Research Company 将品类与在线视频消费上升相连；MBO 则显示创作者越来越多使用数字平台并服务全球客户。
              这些信号支持一个市场判断：更多卖家想要自有变现轨道，而不是完全依赖广告分成或品牌合作。


              逆风同样是结构性的。SignalFire 认为创作者工具已经饱和，新进入者很难突破，因为既有玩家拥有网络效应。FTC 披露和
              虚假评论规则提高了合规负担；任何承载创作者主张、用户证言或联盟推广的平台都要面对它。Whop 自己的条款已经禁止虚假评论、 操纵互动和误导性收入宣称，这说明信任与安全开销是商业模式的一部分，不是边缘案例。未通过
              KYC 或政策检查的卖家可能被 支付伙伴暂停；纠纷和退款会侵蚀本已偏薄的利润；应用商店或渠道原生会员收费还会进一步压缩创作者经济。市场增长是真的， 但能否转成持久 SOM，仍取决于信任、合规和费用纪律。
