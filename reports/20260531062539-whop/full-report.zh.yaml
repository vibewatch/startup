      - number: '8.3'
        title: 情景分析与稀释不确定性
        blocks:
          - type: paragraph
            body: >-
              承接不确定性的正确方式，是用情景来拿。乐观情景下，Whop 把当前支付和打款基础设施变成真正的商务操作系统：抽佣率守在 5% 中段，审计收入升向 $180 million-$220
              million，授权率改善真实存在，卖家质量扩展到争议更大的博彩和交易队列之外。在这种状态下，9x-11x 倍数可以支撑约 $1.6 billion-$2.2 billion
              价值，也就是说当前轮次可以成立，但容错空间不大。


              基准情景没那么慷慨。如果审计收入更接近 $120 million-$150 million，市场把 Whop 视为高速增长但仍有风险的混合市场 / 基础设施资产，7x-8.5x 倍数意味着约 $0.9
              billion-$1.3 billion。悲观情景才是投资判断的关键：如果收入低于预期，抽佣率向商品化支付经济性走弱，或信任和审核问题拖慢卖家留存，市场可能只愿意按 $80 million-$100
              million 收入支付 4x-6x，对应 $0.3 billion-$0.6
              billion。由于公开材料仍未披露优先权条款、反稀释权或清算瀑布，投资者应假设普通股等价敞口的真实下行，可能比标题估值区间显示的更糟。这里的股权结构表不只是法律脚注；它是核心估值变量之一。
            claimRefs:
