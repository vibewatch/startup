  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 围绕后期私募创作者商务投资最影响决策的维度，给出可直接提交 IC 的评分。
    data:
      items:
        - label: 需求 / 分发验证
          value: 8
          note: 用户和商家触达很强，但指标口径仍需对齐。
        - label: 变现深度
          value: 7
          note: 收费栈很宽，但产品层面的收入结构尚未经审计。
        - label: 支付基础设施优势
          value: 7
          note: 如果能证明授权率有可量化提升，全球出款覆盖和路由就具备战略价值。
        - label: 财务透明度
          value: 3
          note: 核心指标有披露，但经审计财务报表和股权结构条款缺失。
        - label: 品类质量 / 信任
          value: 4
          note: Trustpilot 和第三方报道让审核与争议风险始终摆在台前。
        - label: 战略上行空间
          value: 7
          note: 如果能加深变现，Tether 和跨境出款会带来真实期权价值。
        - label: 估值吸引力
          value: 4
          note: 当前价格相对多数上市可比公司偏贵，只有接近乐观情景的执行路径才说得通。
    approximationNotes: 评分为截至 2026-05-31 基于公开证据做出的 1-10 定性判断；它们概括而非替代正文中的详细投资逻辑。
    claimRefs:
      - CV032
      - CV041
      - CV047
