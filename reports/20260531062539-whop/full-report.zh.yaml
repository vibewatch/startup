      - number: '1.2'
        title: 创始人层面的领导可见度高，治理层面可见度低
        blocks:
          - type: paragraph
            body: >-
              Whop 在公开资料里首先还是一个创始人故事，其次才像一家机构。CNBC、TechCrunch、Fast Company 和 Forbes 解释公司时都围绕 Steven Schwartz 与 Cameron
              Zoub 的青少年线上商务经历；Wikipedia 当前公司档案列出 Schwartz 为 CEO、Zoub 为 CGO、Sharkey 为 CTO。这足以覆盖产品、增长和工程等
              创始职能，但不足以证明治理扎实。公司核心官方页面的重点是产品、定价、品类和买卖双方工作流， 而不是董事会构成、治理委员会或接班计划。运营层面的公开管理细节确实存在，例如 Whop 的支付发布
              文章引用了合作伙伴负责人和加密负责人；但缺少更完整的董事会或高管名单，外部投资者仍主要通过 创始人叙事看公司。由此形成熟悉的权衡：创始人-市场匹配看起来很强，因为创始团队就来自 Whop 服务的
              互联网商户文化；但关键人依赖也相应偏高，因为公开记录看不到创始人和少数职能负责人之外的多少 机构厚度。
