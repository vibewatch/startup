  - id: TM004
    title: 支付与创作者工具栈表
    columns:
      - 层级
      - 代表性工具 / 页面
      - 经济性信号
      - 运营影响
      - 与 Whop 的相关性
    rows:
      - - Whop 结账与付费墙
        - Whop 费用文档 + 文档概览
        - 2.7% + $0.30 国内银行卡
        - 前期入门门槛低，但标示价格只是第一层费用
        - Whop 核心经济性和转化切入点
      - - Whop 提现与联盟结算
        - Whop 提现页面 + 费用文档
        - 187+ 个提现国家；联盟提现 1.25%；争议和提醒费用不在标示费率内
        - 跨境卖家采用率提升，但提现和争议成本会叠加
        - 使 Whop 区别于纯店面工具
      - - Stripe 平台骨干
        - Stripe Connect 定价 + 欺诈/争议文档
        - $2 月活跃账户；0.25% + 25¢ 提现；欺诈/争议工具嵌入流程
        - 即使平台加价较低，底层市场成本基础仍然可观
        - Whop 或建立在支付基础设施上的同类公司不能忽视提现经济性
      - - 社区软件基准
        - Circle + Mighty 定价
        - $79–$199+ 月费，另加 2% 至 0.5% 交易费
        - 较高的 SaaS 固定费用会让纯社区工具对早期创作者更昂贵
        - Whop 通过将社区变现与支付运营打包来竞争
      - - 课程和数字产品基准
        - Gumroad, Kajabi, Teachable, Podia
        - 从每笔销售 10% + $0.50 到 $89/月外加支付处理商费用
        - 创作者在较高抽成率与较高固定 SaaS 费用、更大 DIY 负担之间权衡
        - 如果打包后的经济性优于拼装独立工具，Whop 可以胜出
      - - 平台原生会员制
        - Patreon, YouTube, Discord, Substack
        - Patreon 抽成 10% 外加处理费；退款或渠道通行费仍由平台控制
        - 上线快，但受众和变现规则仍更贴近宿主平台
        - 为尚未准备好拥有完整工具栈的创作者定义默认替代方案
    notes: 行中混合了 SaaS 订阅、交易费和提现成本，因为创作者业务会把它们作为有效抽成率堆栈整体感受，而不是孤立的单项费用。
