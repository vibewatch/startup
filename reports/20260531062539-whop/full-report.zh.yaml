  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              理解 Whop，最好把它看成创作者电商基础设施，而不是通用社交网络或纯数字下载店面。卖家条款和文档显示 两种分发模式：商户可以直接在 Whop 市场销售，也可以在自己的网站和社交主页上使用嵌入式 Whop 结账和
              支付工具。这把公司放在一个关键工作流里：创作者把注意力转成经常性会员、付费门槛社区、课程、软件访问、 提醒、模板和其他数字体验。


              因此，正确的市场边界应包括付费社区、创作者订阅、课程和辅导、类软件会员，以及其他直接数字产品变现流程； 在这些场景里，结账、访问权限管理、打款和合规都很重要。边界之外是纯广告型达人变现、人才经纪机构，
              以及从不转化为自有商业的通用社交触达。现状替代品不是一个平台，而是一套栈：Patreon、YouTube 会员、 Discord 服务器订阅、Substack、Circle、Mighty
              Networks、Gumroad、Kajabi、Teachable、Podia， 或由 Stripe 主导的自建 DIY 栈。这个广度重要，因为 Whop 争夺的是把受众信任转成直接收入的任务，而不是更大
              达人广告市场里的每一美元。
