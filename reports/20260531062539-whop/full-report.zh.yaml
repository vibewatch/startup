  - id: TR001
    title: 监管 / 法律风险登记表
    columns:
      - 风险
      - 公开证据
      - Whop 暴露原因
      - 缓释信号
      - 剩余暴露
    rows:
      - - 交易信号 / 投资建议边界风险
        - Discover 页面公开列出交易、外汇、期权和加密货币品类；政策禁止未注册金融服务，但允许部分教育类金融内容。
        - 即使上架文案避开这种表述，付费社区仍可能从教育滑向可执行建议或招揽。
        - 卖家合规义务、欺骗性声明禁令、提现冻结和品类下架权。
        - 高
      - - 体育投注推荐 / 博彩相邻风险
        - Whop 发现页包含体育投注与博彩品类；政策禁止非法博彩运营，但允许预测推荐或咨询内容。
        - 咨询式博彩社区仍可能招来消费者保护和支付伙伴审查。
        - 受限产品政策、未成年人限制和执法权。
        - 高
      - - 欺骗性收入 / 商业机会营销
        - Community Guidelines 禁止欺骗性收入声明；Earnings Terms 要求类似 FTC 的披露；FTC Business Opportunity Rule 仍然有效。
        - 联盟、赏金和内容奖励机制可能放大围绕赚钱产品的不现实收入叙事。
        - 强制披露话术、卖家责任，以及暂停或追回权。
        - 高
      - - 散户沟通审查
        - FINRA Rule 2210 规范面向散户的沟通，Investor.gov 在 2026 年警示社交媒体荐股骗局。
        - 即使 Whop 本身不是经纪交易商，只要市场产品像在向散户推荐或背书，沟通风险就会上升。
        - 反误导推广政策，以及平台酌情移除产品的权利。
        - 中高
      - - 未成年人安全 / 年龄门槛失效
        - Youth Safety Policy 阻止未成年人加入博彩相关群组，并称即将要求采集出生日期（DOB）。
        - 政策本身暗示实施和执行仍在推进，尚未被公开指标充分证明。
        - 年龄标记、父母同意、监护人 KYC 和信任安全升级。
        - 中高
      - - IP / 内容权利纠纷
        - 即使条款禁止侵权，市场上的数字产品和创作者社区仍会反复带来版权和下架暴露。
        - 低摩擦数字分发让侵权内容很容易先出现，正式下架随后才发生。
        - 条款禁止侵权；Whop 可移除内容并暂停账户。
        - 中
    notes: 剩余暴露为定性判断，仅反映公开证据。登记表并不完整，因为公开文件、传票日志或外部律师备忘录不可得。
