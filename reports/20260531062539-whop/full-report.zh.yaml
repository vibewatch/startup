  - id: TP004
    title: 替代组合与现状方案
    columns:
      - 替代品或组合
      - 买家选择场景
      - 复制了 Whop 的什么
      - 仍缺什么
      - 为什么重要
    rows:
      - - Discord + 独立结账
        - 社区就是核心产品
        - 付费准入、角色和服务器持续变现
        - 市场触达、卖家工具栈、全球打款灵活性
        - 业务从现有社区起步的创作者常用这种组合
      - - 仅 Kajabi
        - 受众已通过邮件或内容漏斗沉淀在自己手里
        - 课程、社区、漏斗和营销自动化
        - 市场发现和深度打款基础设施
        - 对强控流量入口的知识型业务，这是最像 Whop 的替代品
      - - 仅 Stan
        - 流量来自社交主页
        - 简单店面、预约、订阅和社区
        - 市场发现、高级打款覆盖和更宽的卖家运营
        - Instagram / TikTok 卖家的强低摩擦替代方案
      - - Shopify + 应用
        - 电商基础设施比封闭社区更重要
        - 店面、结账、link-in-bio 销售和数字产品
        - 原生创作者社区工作流和市场发现层
        - 品牌或商户长出创作者原生工具后，常回到这套既有工具栈
      - - Lemon Squeezy + 外部社区
        - 软件或 SaaS 变现是核心任务
        - 订阅、客户门户、税务处理和授权
        - 社区、发现和创作者原生前端界面
        - 当 Whop 被当作支付 / 计费基础设施评估时，这是最直接替代品
      - - 仅 Fourthwall
        - 周边和粉丝品牌电商主导收入结构
        - 店面、会员、社交周边货架和实体商品支持
        - 支付 / 打款覆盖和非周边创作者工具深度
        - 创作者品牌可以理性选择周边原生栈，而不是 Whop
      - - 仅 Gumroad 或 Payhip
        - 创作者需要快速搭一个便宜数字店面
        - 下载、会员、简单结账和基础营销
        - 市场 + 支付打包能力和更成熟的打款通道
        - 低复杂度入门产品压住 Whop 在市场底部的定价权
    notes: 这些是有证据支撑的替代模式，不是说所有创作者都会有意识地购买预先打包的工具栈。 重点是画出 Whop 在真实采购中如何被比较。
