      - number: '7.4'
        title: 运营集中度、依赖风险和投资逻辑破坏点
        blocks:
          - type: paragraph
            body: >-
              从运营看，Whop 比“简单市场”这个标签暗示的更集中。条款和解决方案页面显示，它依赖银行合作伙伴、PSP、打款轨道、税务和 KYC 流程、替代支付方式、BNPL
              提供商以及卖家表现。公司把这套复杂度包装成产品优势，承诺全球打款、自动化税务处理、支付编排和更少支付失败；这也意味着处理方降级、准备金上调或类别下架，可能很快传导到卖家流动性、流失和品牌伤害。公司还声称服务
              27,000 多家企业；即使卖家经济性保持分散，这也提高了信任安全人力、质量控制和一致执行的重要性。公开层面，投资者的正确姿态应是运营上保持怀疑，但不自动看空。Whop
              有清晰缓释：政策权利、争议工具、全球支付基础设施，以及扣留资金或清退类别的意愿。但投资逻辑破坏点很直接。若处理方关系收紧、投诉上升、风险类别占比扩大，或未成年人和推广披露引发事件，风险画像可能迅速重估。在
              Whop 披露争议率、敏感类别暴露、审核能力和卖家集中度之前，运营集中度风险应被视为实质性，而不是理论问题。
