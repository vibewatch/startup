  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型与公开变现栈
        blocks:
          - type: paragraph
            body: >-
              Whop 的公开材料显示，它是混合收入模型，而不是纯 SaaS 订阅业务。条款称商户可以在 Whop 市场销售，也可以在自有网站和 社交渠道使用嵌入式 Whop
              Payments；文档则把公司定位成支付、打款、钱包、聊天和应用分发基础设施。官方定价在处理器层面透明： 国内卡为 2.7% 加 $0.30，国际卡、FX、融资和 ACH
              有额外官方附加费。不透明的是按渠道实际实现的抽成率。第三方 2026 年 定价解读一致认为，自动化 / 平台、打款、欺诈、税务处理或融资层叠加后，创作者实际支付常常明显高于头部银行卡费率。 这个差异重要，因为
              Whop 收入质量取决于结构：站外结账交易量更像支付收入，而由市场发现、自动化、融资或跨境交易带来的量，
              应该能以更高有效费率变现。结果是一门看起来在交易栈多个层面变现的业务，但仍没有披露哪些层贡献了大部分报告收入。
