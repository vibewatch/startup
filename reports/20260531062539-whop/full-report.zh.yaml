  - id: TP003
    title: 定价 / 包装比较
    columns:
      - 平台
      - 公开入门经济性
      - 其他公开费用信号
      - 税务 / 提现姿态
      - 对 Whop 的影响
    rows:
      - - Whop
        - 2.7%+$0.30 国内银行卡
        - +1.5% 国际银行卡；1.5% ACH 最高 $5；附加编排和税费
        - 241+ 个地区；多种提现方式；有限的 MoR 范围
        - 与 Patreon/Gumroad 相比，基础支付处理有吸引力，但不是完整 MoR 替代品
      - - Gumroad
        - 直接销售收 10%+$0.50
        - 通过 Discover 市场收 30%
        - 作为全球税务义务的登记商户；直接入账或 PayPal 打款因国家而异
        - 相较按月 SaaS 工具，入门经济性更友好；但直接销售明显比 Whop 贵
      - - Patreon
        - 新创作者标准计划收 10%
        - 旧版 5% / 8% / 11% 计划在特定条件下继续存在；另收处理、打款和 FX 费用
        - Patreon 处理拒付、欺诈、税务和 16+ 种货币
        - 社区原生，但把完整费用栈算进去后成本偏高
      - - Kajabi
        - 月度计划价位 $89 至 $499
        - 定价页显示年付折扣
        - 未突出收入分成；处理费仍适用
        - 自有受众软件能力强，但收入产生前固定成本门槛最高
      - - Stan
        - $29 Creator / $99 Creator Pro
        - 官方定价博客显示平台交易费为零
        - 处理费仍适用；评测称没有免费计划
        - 社交卖家起量后效率高，但前置承诺削弱新手吸引力
      - - Skool
        - $9 Hobby / $99 Pro
        - Hobby 收 10%；Pro 页面可见 2.9%，但留存材料未完整解释
        - 这里没有清晰披露公开打款 / 税务立场
        - 是相关的付费社区替代方案，但经济账仍有部分未解
      - - Fourthwall
        - 永久免费，或 Pro 月付 $19 / 年付月均 $15
        - 免费层数字产品收 5%；Pro 免数字产品费
        - 目录商品由平台处理客服；第三方评测提到 MoR 支持
        - 周边商品优先的经济账对品牌型创作者有吸引力；对纯数字 Whop 卖家较弱
      - - Discord
        - 服务器订阅采用创作者 90/10 分成
        - 其他费用漏损来自 Stripe 和政策限制
        - 仅限美国入驻；需要单独 Stripe 账户
        - 社区变现强，但不适合作为主卖家操作系统
      - - Shopify
        - Starter 计划面向社交销售优化；可见免费到 $1 的促销试用信息
        - 可销售数字产品，无额外数字商品费
        - 是广义电商工具，不是创作者专用打款栈
        - 强大的通用电商替代品，但不是最清晰的逐费项 Whop 对比对象
      - - Lemon Squeezy
        - 每笔 5%+50¢
        - 留存定价材料显示没有月度电商费
        - 担任登记商户，处理全球销售税和合规
        - 在软件占比高的细分市场里，是对 Whop 最危险的合规主导替代品
      - - Payhip
        - 官方页面强调免费计划且不锁功能
        - 处理通道费用仍适用；第三方评测称入门费为 5%
