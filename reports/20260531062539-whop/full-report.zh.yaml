        - label: 打款与 KYC
          values:
            - 打款设置、账户链接、打款账户对象和打款 UI 元素已公开
            - 手动、周期性和即时打款路径已有文档
            - 没有披露准备金、打款延迟或合规吞吐量
        - label: 社群模块
          values:
            - 论坛、聊天认证、聊天元素和应用商店附加组件已公开
            - 社群功能延伸到移动端和连接 Discord 的访问
            - 没有披露审核精度或滥用筛查 KPI
        - label: 应用平台与 SDK
          values:
            - create-app 和 app-build 推广流程，以及 JS/Python/Go 界面已公开
            - 示例代码仓库和构建者 Discord 显示平台 GTM 活跃
            - 没有应用审核 SLA、灰度发布政策或 QA 证据
        - label: 信任与安全披露
          values:
            - 2FA、位置隐私、法律政策和事件历史可见
            - 公开评论网站呈现了真实用户投诉和支持互动
            - 没有公开安全认证、SLA 或审核有效性资料包
    approximationNotes: null
    claimRefs:
      - CE018
      - CE032
      - CE033
      - CE036
      - CE038
      - CE039
  - id: FU001
    title: 客户旅程图
    type: journey-map
    insight: |
      Whop 的客户旅程，卖家侧从业务设置开始，买家侧从发现开始。卖家在初始报价之上叠加支付、社群、联盟分销或 Content Rewards 时，扩张开始；信任问题、品类质量问题或打款 / 退款摩擦打断循环时，旅程失效。
    data:
      items:
        - id: seller-discovery
          label: 卖家发现
          actor: 创作者 / 小型企业
          description: |
            卖家带着现有技能、受众或小众产品想法而来，方向包括教练服务、软件、剪辑服务、交易或付费社群。
          channels:
            - Whop 博客和教育内容
            - 创作者之间的口碑
            - 市场案例和头部产品
        - id: storefront-setup
          label: 店面设置
          actor: 卖家
          description: |
            卖家使用 Whop 的一体化店面和文档栈，配置产品、结账、打款、聊天、社群和应用集成。
          channels:
            - Whop 应用
            - 文档和 API
            - Whop 仪表板
        - id: buyer-discovery
          label: 买家发现
          actor: 买家 / 成员
          description: |
            买家通过 Whop 市场、联盟分销、创作者营销、社群转介绍和 Content Rewards 活动发现店面。
          channels:
            - Discover / 市场
            - 联盟分销链接
            - Content Rewards 活动
            - 移动应用
        - id: purchase-and-access
          label: 购买与访问
          actor: 买家
          description: |
            买家购买一次性报价或周期性访问权，然后在同一环境中消费软件、内容、聊天、课程、社群或教练服务。
          channels:
            - 100+ 种支付方式
            - 移动应用
            - 聊天和门控社群
        - id: expansion-or-friction
          label: 扩张或摩擦
          actor: 卖家和买家
          description: |
            健康循环包括订阅、应用集成、加购、联盟分销和重复社群参与。摩擦点包括骗局、退款、打款争议、支持缺口，以及高风险品类中的信任问题。
          channels:
            - 订阅
            - 联盟分销
            - Content Rewards
            - 支持 / 争议工作流
    sourceRefs:
      - SU003
      - SU006
      - SU007
      - SU015
      - SU016
  - id: FU002
    title: 采用 / 部署漏斗
    type: funnel
    insight: |
      Whop 的供给侧高度偏斜。大量产品进入市场，但只有少数能有效变现，更少数能带来顶尖收入。
    data:
      items:
        - label: 被跟踪产品
          value: 100
          description: WhopTrends 跟踪 195,236 个产品，构成广泛的供给侧基础。
        - label: 产生任何收入的产品
          value: 11.2
          description: 195,236 个被跟踪产品中，21,805 个产生收入。
        - label: 月收入超过 $1K 的产品
          value: 2
          description: 3,964 个被跟踪产品超过 $1K/月。
        - label: 月收入超过 $10K 的产品
          value: 0.5
          description: 961 个被跟踪产品超过 $10K/月。
    sourceRefs:
      - SU017
  - id: FU003
    title: 客户证明矩阵
    type: matrix
    insight: |
      Whop 最有说服力的客户证明来自在线店面，因为它们同时暴露评分和成员数。品类宽度真实存在，但证明质量最强的是社群和教练服务，不是已发布的留存或集中度披露。
    data:
      columns:
        - 证据质量
        - 可见规模
        - 周期性 / 社群信号
        - 风险标记
      rows:
        - label: Call Her Closed
          values:
            - label: 高 — 在线店面，带成员数、评分、定价和评论
            - label: 可见规模为小到中等（111 名成员）
            - label: 中 — 教育社群可能涉及重复参与
            - label: 高客单、结果导向的报价会抬高退款敏感度
        - label: Brez Clips
          values:
            - label: 高 — 在线店面，公开评论量很大
            - label: 可见规模大（46.8K 名成员）
            - label: 高 — 免费社群形态鼓励重复访问
            - label: 剪辑服务质量可能差异很大，带来品类信任风险
        - label: Committed Coaches
          values:
            - label: 中高 — 产品分析加上独立收入背景
            - label: 可见规模大（13.8K 名成员；估计 $4.9M/月）
            - label: 中 — 教练服务产品可能包含持续问责
            - label: 高 — 高客单教练服务依赖强交付和退款处理
        - label: Content Rewards
          values:
            - label: 中 — 第一方社群证明，不是第三方客户证明
            - label: 可见规模很大（164.4K 名成员）
            - label: 高 — 活动和社群更新意味着重复活跃
            - label: 品牌安全和活动质量监督很重要
        - label: 市场长尾
          values:
            - label: 中 — 分析来源显示产品密度很高
            - label: 供给基础很大，但平均变现弱
            - label: 低 / 混合 — 没有公开队列留存数据
            - label: 高 — 经济成功集中在少数产品
    sourceRefs:
      - SU003
      - SU011
      - SU017
      - SU019
      - SU020
      - SU021
  - id: FR001
    title: Whop 风险热力图
    type: matrix
    layout: wide
    summary: 支付压力和监管边缘品类暴露是剩余风险最高的两项，因为它们会同时打击流动性、增长和信任。
    data:
      columns:
        - 可能性
        - 影响
        - 缓解成熟度
        - 剩余严重度
      rows:
        - label: 拒付 / 争议
          values:
            - label: 高
              tone: negative
              detail: Whop 条款和定价明确描述了争议、退款和准备金工具。
            - label: 高
              tone: negative
              detail: 直接影响卖家流动性、支持负载和品牌信任。
            - label: 中
              tone: warning
              detail: 控制已存在，但公开 KPI 未披露。
            - label: 高
              tone: negative
              detail: 准备金上调或打款延迟会迅速改变市场行为。
        - label: 交易 / 博彩边界
          values:
            - label: 中高
              tone: warning
              detail: 风险邻近品类在发现页中被公开售卖。
            - label: 高
              tone: negative
              detail: 会同时带来监管方、支付合作伙伴和声誉压力。
            - label: 中
              tone: warning
              detail: 政策禁止部分行为，但仍留下咨询边界地带。
            - label: 高
              tone: negative
              detail: 教育内容与建议口径之间的边界仍很难完全管住。
        - label: 创作者质量 / 垃圾内容
          values:
            - label: 高
              tone: warning
              detail: 多条公开评论提到垃圾式或低质量报价。
            - label: 中高
              tone: warning
              detail: 信任侵蚀是渐进的，但会复合成流失和投诉。
            - label: 中低
              tone: warning
              detail: 规则存在，但公开执行吞吐量未披露。
            - label: 中高
              tone: warning
              detail: 在审核指标可见之前，剩余风险仍然偏高。
        - label: 支付处理商 / 银行依赖
          values:
            - label: 中
              tone: warning
              detail: Whop 对外强调冗余，但仍依赖外部 PSP 和银行。
            - label: 高
              tone: negative
              detail: 支付处理商撤销交易或采取准备金措施，会影响出款和访问权限。
            - label: 中
              tone: warning
              detail: 多通道路由有帮助，但伙伴政策仍占主导。
            - label: 高
              tone: negative
              detail: 交易对手集中度就是产品本身的核心风险。
        - label: 未成年人安全 / 受限群体
          values:
            - label: 中
              tone: warning
              detail: Whop 有明确的青少年控制措施，但出生日期校验仍被描述为即将上线。
            - label: 高
              tone: negative
              detail: 一起严重事件就可能放大信任损失和法律损害。
            - label: 中
              tone: warning
              detail: 政策成熟度不错；运营证据有限。
            - label: 中高
              tone: warning
              detail: 品类结构里包含体育博彩场景，剩余风险不可忽视。
        - label: 口碑 / 投诉
          values:
            - label: 高
              tone: warning
              detail: 公开评价渠道已经记录计费、退款和刷评担忧。
            - label: 中高
              tone: warning
              detail: 品牌受损会推高 CAC，也会招来伙伴更严审查。
            - label: 中低
              tone: warning
              detail: 平台有客服回应，但公开投诉指标仍然可见。
            - label: 中高
              tone: warning
              detail: 如果不及时压住，投诉累积会自我强化。
    claimRefs:
      - CR004
      - CR007
      - CR013
      - CR017
      - CR020
      - CR045
      - CR046
      - CR048
      - CR049
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 最危险的路径从低质量或踩线供给开始，传导到投诉、争议、准备金措施、出款摩擦和品牌受损。
    data:
      nodes:
        - id: borderline_offers
          label: 踩线金融 / 博彩 / 收入类供给
        - id: paid_promotion
          label: 分销联盟、赏金任务与付费推广
        - id: buyer_misexpectation
          label: 买家预期差
        - id: complaints
          label: 投诉、退款、刷评指控
