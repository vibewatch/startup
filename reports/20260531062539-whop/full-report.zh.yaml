      - number: '4.2'
        title: 公开牵引力与单位经济代理指标
        blocks:
          - type: paragraph
            body: >-
              公开牵引力信号很强，但单位经济图景大多是间接的。Sacra 估计，年化收入在 2024 年退出时为 $56M，2025 年 10 月达到 $142M；支付量信号按年超过 $1B，月度 GMV 到 2025
              年春接近 $100M。Whop 自己的网络站点营销 22M+ MAU 和 27,000+ 家企业； 外部跟踪器看到一个很大但定义敏感的足迹，WhopScan 跟踪 70,000+ 个产品和 50,000+
              家公司，Sacra 则引用 18.4M+ 用户和 183,628 名卖家。卖家经济数据比总量更有信息量。WhopTrends 的 191,654 个产品数据集和 Built By Foundry
              的评测都指向陡峭的 幂律：大多数产品没有被跟踪到收入，中位数变现很低，极少数产品拿走了不成比例的平台美元。这说明 Whop 的市场可以产生大赢家
              并支撑强支付量，但平均卖家质量和耐久性可能比最大案例展示弱得多。没有毛利率、退款或队列数据时，公开记录更能支持 规模论，而不是利润论。
