      - number: '6.4'
        title: 留存、满意度和耐久性代理指标
        blocks:
          - type: paragraph
            body: >
              Whop 在获客上的公开证据远强于留存。没有留存来源披露平台级流失、净留存率（NRR）、总留存率（GRR）、续费率或卖家队列曲线。因此，最好的耐久性代理指标只能是间接信号：店铺成员数和评分、移动 app
              评论深度、偏社区的产品架构，以及订阅、付费群组和持续课程访问的存在。官方博客和评测报道显示，经常性会员和订阅产品是平台设计的核心；卖家一旦拿到付费用户基础，重复使用应会改善。正面看，iOS app 有 51K
              个评分，评分 4.8/5；Content Rewards 等一方社区中心显示有 164.4K 名成员、1,131 个评分。负面看，独立评测栈明显弱于 app-store 信号：Trustpilot 快照为
              1,251 条评论、评分 3.6/5；JustUseApp 认为 app 总体安全，但值得谨慎。实际结论是，一旦活跃社区成形，Whop
              很可能能留住它们；但平台没有给出足够的公开队列数据，无法把真实产品留存和不断涌入新卖家、新买家掩盖下的市场流失区分开。
