  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险概览与排序
        blocks:
          - type: paragraph
            body: >-
              Whop
              的风险栈并不由单一存亡级法律问题主导；真正主导的是支付、推广和市场质量交界处的控制系统问题。公开材料显示，这个平台把市场发现、平台外支付、全球打款、融资选项和庞大的长尾卖家群放在一起。这套架构可以快速放大，但也创造了多条失效路径：弱创作者或误导性供给会变成买家投诉；投诉会变成退款、拒付、准备金上调或支付处理方审查；即便
              Whop
              在合同上把主要责任推回卖家，这些摩擦仍会拖慢打款或伤害买家信任。热力图把支付风险和监管边缘类别暴露列为最严重风险，因为它们能同时打击收入、卖家流动性和声誉。创作者质量恶化和虚假评论动态位于下一档，因为它们可能悄悄累积，直到以投诉量、差留存或监管关注的形式爆出来。共同主题是，Whop
              的缓释手段重在政策和流程，但公开证据中支撑这些控制的运营指标仍然很薄。
