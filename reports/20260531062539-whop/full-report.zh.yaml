      - number: '1.4'
        title: 规模里程碑很强，但信任和审核仍是首要背景项
        blocks:
          - type: paragraph
            body: >-
              Whop 的公开规模叙事确实很强，但口径并不完全标准。CNBC 报道，到 2023 年 8 月，业务已每月促成 最高 $11.8M 的软件销售。Sacra 后来称，平台到 2025 年春接近每月 $100M
              商品交易总额（GMV），并引用 截至 2026 年 2 月的 18.4M+ 用户、183,628 名卖家和 $2.67B 累计生命周期 GMV。二级分析站点提供更多 侧面：WhopTrends 称 2025 年有
              143K+ 产品上线、110K+ 新创作者加入，估计月收入超过 $60M；其创作者 收入研究显示，收入排名前 1% 的产品拿走 56.5% 的收入。WhopScan 跟踪了 50,000+ 家公司旗下的
              70,000+ 个产品。这个广度支持一个判断：Whop 已不再是小众球鞋抢购机器人市场。但同一批公开记录也说明 为什么信任风险重要。TechCrunch 明确警告，不良行为者可能利用虚假评论或可疑 SEO
              销售诈骗性产品； Whop 自己的禁售政策禁止违法商品和体育博彩咨询服务；Trustpilot 显示退款和虚假广告投诉；BBB 仍维护着 布鲁克林实体的实时商业档案。因此，概览判断应保持平衡：Whop
              有真实动能和产品-市场匹配，但市场完整性、 纠纷解决和品类治理是核心运营模型的一部分，不只是声誉层面的附带问题。
