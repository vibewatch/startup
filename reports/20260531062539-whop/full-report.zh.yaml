      - number: '3.3'
        title: 能力、分发、信任与政策姿态
        blocks:
          - type: paragraph
            body: >-
              能力对比说明，Whop 为什么跨品类竞争，而不只是对抗其他店面工具。Whop 打包市场上架、支付和跨境打款。Patreon 的
              原生会员社区功能更强，围绕欺诈处理和多币种打款的文档更充分，但它仍以粉丝订阅为中心，而不是更宽的创作者商业。 Kajabi 是最强的自有受众套件，因为它把课程、社区、漏斗、邮件和 AI
              合在一起；但在保留的公开证据里，它没有明显的 市场发现层。Stan 针对个人简介链接带来的社交转化做了优化；Gumroad 和 Payhip 仍是更简单的托管店面，社区或打款深度较轻。 Fourthwall
              在面向创作者品牌销售商品和会员专属数字产品的社交购物界面上更突出。


              信任和政策姿态同样重要。Patreon 的 Trustpilot 快照释放了围绕订阅、支付和支持的反向服务质量信号。Discord 的
              变现文档显示另一类弱点：不是支持投诉，而是明确的运营约束，包括仅限美国入驻、单独的 Stripe 账户，以及对远程医疗、 政治活动和博彩相邻用途的政策排除。Lemon Squeezy 和 Shopify
              不是社区产品，但仍危险，因为它们从另一个方向攻击 买家问题：更深的计费或商业基础设施。因此，卖家想在一个地方同时获得社区相邻变现和严肃支付运营时，Whop 最强；
              买家主要想要自有受众营销软件或纯合规重型计费时，Whop 较弱。
