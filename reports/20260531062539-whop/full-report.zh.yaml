  - id: TV007
    title: 投资逻辑破裂和终止触发表
    columns:
      - 触发项
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 收入质量不达标
        - 经审计收入低于 ~$110M，或抽佣率大幅低于 ~5%。
        - 打破支撑当前价格所需的软件溢价承保逻辑。
        - 不要按接近上一轮估值标记的价格买入；按市场平台倍数重新承保。
      - - 信任 / 纠纷恶化
        - 打款延迟、诈骗投诉或退款摩擦变得持续且可衡量。
        - 卖家质量和留存走弱，同时压低 GMV 和估值倍数。
        - 暂停投资，或要求强下行保护。
      - - 类别集中度仍高
        - 高风险博彩 / 交易群体仍是核心 GMV 驱动，组合没有拓宽。
        - 监管、声誉和流失风险上升；限制倍数扩张。
        - 把 Whop 视作风险更高的垂直市场平台，而不是优质基础设施资产。
      - - 不利轮次条款浮出水面
        - 新尽调发现普通股之前存在强优先权、参与权或战略权利。
        - 普通股回报可能远低于表面企业价值或投后估值。
        - 重新定价进入点，或要求类似优先股的保护。
      - - 支付优势无法验证
        - 授权率或打款改善没有体现在卖家经济性中。
        - 失去支付 Shopify 式估值区间的主要理由。
        - 采用更低的公开可比区间，并下调信心。
    notes: 触发项可监测且与价格相关。每当 Whop 披露新轮次条款、经审计数据或 KPI 定义，都应重新审视。
    claimRefs:
      - CV035
      - CV046
      - CV047
  - id: TV008
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 股权结构表和轮次条款
        - 优先股堆叠、参与权、反稀释、MFN，以及任何 Tether 战略权利。
        - 只有表面估值不足以定价普通股等价下行。
        - 向法律顾问 / CFO 索取数据室股权结构表、条款清单和清算瀑布模型。
      - - 经审计收入桥
        - 经审计 FY2025 和 YTD FY2026 收入、毛利率、抽佣率，以及产品级变现组合。
        - Whop 更接近 4% 还是 6% 混合变现，会显著影响公允价值区间。
        - 获取经审计财务数据和月度管理账。
      - - 指标口径对齐
        - 用户、MAU、企业数、GMV、打款和创作者收入在所有公开界面的定义桥。
        - 当前营销口径方向性强，但尚未标准化到足以支撑投委会级模型。
        - 向财务和增长团队索取 KPI 字典及队列表。
      - - 质量和风险控制
        - 按卖家队列拆分的拒付、纠纷、退款和欺诈损失率；博彩 / 交易类别集中度。
        - 估值溢价取决于信任和类别耐久性，不只取决于 GMV 速度。
        - 与支付、合规和信任安全负责人做风险深挖。
      - - 支付网络验证
        - Whop Payments 带来的授权率提升、打款采用、国际转化提升和卖家留存影响的实测数据。
        - 这是支撑优质基础设施倍数所需的核心证据。
        - 审阅内部仪表盘、案例研究和处理机构级报告。
    notes: 这些问题旨在把建议从中等信心的观察，推向高信心承保判断——无论结论偏正面还是负面。
    claimRefs:
      - CV007
      - CV035
      - CV042
      - CV047
