        - 2026-02
        - $1.6B
        - 当前市场出清参照；显示战略资本愿意押注创作者支付基础设施。
        - 条款、优先权和战略权利未公开披露。
      - - Whop Series A
        - 2023-07
        - '>$100M'
        - 显示估值从早期规模到当前后期价格的跃升非常陡。
        - 早期轮次；不可与今天的收入基础直接相比。
      - - Patreon Series F
        - 2021-04
        - $4.0B
        - 说明创作者平台在周期高点如何按私人市场高倍数定价。
        - 时代和融资环境不同；公开市场已不那么容易支撑这些溢价。
      - - Kajabi 成长融资
        - 2021-05
        - '>$2.0B'
        - 优质私人市场定价的创作者商业 / 知识平台参照。
        - 周期高点融资，产品组合也不同。
      - - Linktree Series C
        - 2022-03
