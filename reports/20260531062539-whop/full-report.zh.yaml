      - number: '2.4'
        title: 支付和创作者工具栈经济学
        blocks:
          - type: paragraph
            body: >-
              Whop 的市场位置与它能削掉多少栈复杂度紧密相关。费用文档显示，当前国内交易的头部银行卡处理价格为 2.7% 加 $0.30， 国际卡、FX 转换、税务 /
              汇缴、联盟打款和纠纷另收费用。文档和产品页也说明，创作者为什么可能接受这种结构： 同一套栈覆盖会员、webhook、Apple Pay、iOS 支付、结账 SDK、付费墙、打款和全球出款。换句话说，Whop
              的竞争方式 不像单个 SaaS 席位，更像为数字产品变现打包的一层运营系统。


              对比集合很碎片化。Circle 和 Mighty Networks 把软件订阅与交易费结合；Gumroad 对每笔销售收取高得多的通行费； Kajabi 和 Teachable
              在部分套餐上降低或取消平台抽成，但仍留下处理费、拒付风险或高额月费；Patreon 和 YouTube 降低搭建摩擦，却拿走更多经常性会员经济，并让创作者更贴近平台原生规则。Stripe Connect
              在很多平台底层继续增加 打款和账户成本。因此，关键经济问题不只是 Whop 的标价费率，而是银行卡、打款、合规、纠纷处理和渠道通行费叠加之后， 创作者的全口径抽成率。
