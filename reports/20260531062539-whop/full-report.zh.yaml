      - number: '1.3'
        title: 融资历史显示估值阶跃式上升，战略重心转向支付和加密
        blocks:
          - type: paragraph
            body: >-
              最清晰的公开融资历史只包含少数被广泛引用的里程碑。TechCrunch 报道，2023 年 7 月公司完成 $17M Series A，估值超过 $100M，Insight Partners
              和一批知名天使参与。到 2024 年中，Wikipedia 和 Sacra 都指向一轮超过 $50M、由 Bain Capital Ventures 领投的 Series B，估值约 $800M。当前最
              重要的标记是 2026 年 2 月：Tether 正式披露战略投资及 Wallet Development Kit 集成，PYMNTS、 Inside Crypto 和 Wikipedia 则报道称该轮为
              $200M，Whop 估值约 $1.6B。CB Insights 的公司档案与 这条时间线方向一致，显示累计融资约 $218M，最近一轮为 $200M。由此有两点尽调含义。第一，Whop 的
              资本结构现在包括战略支付和稳定币伙伴，而不只是通用型风险投资人。第二，公开估值透明度仍主要停留在 融资公告层面；公开来源没有披露 2026 年交易的详细治理权、持股比例或附函经济条款。
              投资者可以凭公开证据判断趋势线，但不能读到细则。
