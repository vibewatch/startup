      - number: '3.2'
        title: 定价、打包和商户模型对比
        blocks:
          - type: paragraph
            body: >-
              公开的 2026 年定价披露把市场分成三种经济模型。第一类是百分比抽成平台：Whop、Gumroad、Patreon、Fourthwall 免费层、 Discord 服务器订阅和 Lemon Squeezy
              都从创作者收入中抽成，尽管细节差异很大。Whop 的公开网络定价从 国内 2.7%+$0.30 起，国际卡、ACH、编排和税务收取附加费。Gumroad 直接销售收 10%+$0.50，通过 Discover 收
              30%。 Patreon 标准套餐为 10% 加处理费、货币转换费、打款费和税费，并为老创作者保留 5%/8%/11% 的旧版套餐。 Lemon Squeezy 是 5%+50¢，但它把这项费率与比 Whop
              清晰得多的记录商户叙事捆在一起。


              第二类是固定费用套件：Kajabi、Stan、Skool Pro 和 Fourthwall Pro 把更多成本前置。Kajabi 当前标价从每月 $89 到 $499，是最清晰的高固定成本选项。Stan 定价为
              $29 和 $99，交易费为零；社交卖家一旦有可预测交易量，这会很有吸引力。 Skool 公开页面显示低价 Hobby 定价，但 Pro 费用披露不完整。第三类是混合或部分不透明模型，Payhip 属于这里：
              官方页面强调免费套餐、即时打款和不设功能门槛，但保留下来的截图没有清楚展示费用阶梯。对 Whop 来说，关键经济结论是： 它的头部支付费率相对 Patreon 或 Gumroad 有吸引力，但记录商户范围有限，使
              Lemon Squeezy、Gumroad，可能还有 Fourthwall，在合规卸载叙事上更强。
