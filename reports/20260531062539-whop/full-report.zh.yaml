  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户群细分与画像
        blocks:
          - type: paragraph
            body: >
              Whop 的客户群明确是双边的。公司把自己定位为基础设施，一边服务想建立互联网业务的卖家，一边服务想购买访问权、内容、工具和社区的
              买家。官方界面持续把卖家用例描述为辅导和课程、付费群组、服务、软件、实物产品、市场和远程医疗；博客和评测来源还补充了经常性订阅、 下载、模板、Discord
              访问、电子书和软件订阅。这个广度至少形成三类清晰卖家集群。第一类是提供辅导、课程和高级社区的知识 / 教育卖家。 第二类是集中在剪辑、交易、体育博彩、倒卖和商业策略细分里的绩效或机会型卖家。第三类是把 Whop
              用作支付加访问控制层的软件和自动化卖家。 买家侧，经常出现的画像包括购买商业教育的创业者、购买信号或社区的交易者和投注者、加入剪辑或联盟生态的创作者，以及为软件或持续社区
              付费而非一次性下载的会员。移动应用文案强化了一个判断：Whop 预期用户首次购买后会重复访问社区和产品，因为它把产品描述为建立、销售和 管理社区的一体化场所，而不是简单结账小组件。
