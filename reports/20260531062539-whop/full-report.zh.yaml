            body: >
              公开第三方指标显示 Whop 已达到有意义的规模，但这个市场远比营销文案单独暗示的更拥挤。Sacra 和 RockWater 收敛在 18.4M+ 用户、 约 183K 名卖家、到 2026 年 2 月
              $2.67B 生命周期 GMV，以及约 $3B 年创作者打款。RockWater 还补充，2025 年有 143K+ 产品上线、 110K+ 新创作者同期加入，公司已经为开发者应用商店增加 297 个应用，并有
