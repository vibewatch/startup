- id: milestones-scale-and-risk-context
  title: Scale milestones are strong, but trust and moderation remain first-order context items
  body: 'Whop’s public scale story is undeniably strong, but it is not perfectly standardized. CNBC reported that the business was already facilitating up to $11.8M per month in software sales by August 2023. Sacra later described a platform approaching $100M in monthly GMV by spring 2025 and cited 18.4M+ users, 183,628 sellers, and $2.67B of cumulative lifetime GMV by February 2026. Secondary analytics sites add even more color: WhopTrends said 2025 saw 143K+ products launched, 110K+ new creators, and more than $60M in estimated monthly revenue, while its creator-earnings study showed that the top 1% of products capture 56.5% of revenue. WhopScan tracked 70,000+ products across 50,000+ companies. That breadth supports the case that Whop is no longer a niche sneaker-bot marketplace, yet the same open record shows why trust risk matters. TechCrunch explicitly warned that bad actors could use fake reviews or dubious SEO to sell scammy products, Whop’s own prohibited-products policy bans unlawful
    goods and sports-betting advisory services, Trustpilot surfaces refund and false-advertising complaints, and the BBB maintains a live business profile for the Brooklyn entity. The overview judgment is therefore balanced: Whop has real momentum and product-market fit, but marketplace integrity, dispute resolution, and category policing are part of the core operating model, not merely reputational side issues.'
