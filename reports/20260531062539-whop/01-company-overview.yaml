company:
  name: Whop
chapter:
  number: 1
  title: Company Overview
  summary: Whop is a founder-led Brooklyn social-commerce and payments platform that has expanded from a 2021 digital-goods marketplace into a broader merchant-of-record stack for creators and online businesses. Public evidence supports a rapid capital progression from a $17M Series A in 2023 to a Tether-backed 2026 round valuing the company at about $1.6B, but governance disclosure remains thin and open-source scale metrics vary by surface. The most important overview takeaway is that Whop’s moat increasingly sits in integrated payments and seller tooling, while its main public risks center on marketplace trust, content screening, and dispute handling.
sections:
- id: identity-product-and-founding
  title: Identity, product surface, and founding story
  body: 'Whop’s public footprint is now wider than a simple creator storefront tool. Official buyer-facing and seller-facing pages describe it as a social-commerce and internet-business platform where people can discover and buy access to digital communities, courses, tools, coaching, software, and other online products. The company’s own terminology matters: each seller builds a "whop" that can bundle chat, forums, live coaching, checkout, and analytics into a single destination, while the broader network page positions Whop as both a marketplace and a payments-and-distribution layer for businesses. That framing is consistent with third-party reporting that has followed the company since its 2023 Series A raise. TechCrunch and CNBC both anchor the founding story in Steven Schwartz and Cameron Zoub’s early sneaker-bot businesses, with Jack Sharkey joining the core founding team that launched Whop in March 2021. Public business-profile sources place the company in Brooklyn, New York. The
    identity chapter point is therefore not just that Whop sells digital goods; it is that the company has been steadily re-cast as infrastructure for internet-native businesses, and later chapters should treat the storefront, marketplace, and payment rails as one interconnected product system rather than separate bets.'
