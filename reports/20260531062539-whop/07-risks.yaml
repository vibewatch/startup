  - type: private-evidence-only
    severity: material
    topic: incident-history
    missingEvidence: A twelve-month incident log for payment outages, processor migrations, payout delays, or material service degradations.
    whyItMatters: Whop sells payments uptime and payout reliability as a core feature, so hidden operational incidents would directly change underwriting confidence.
    diligencePath: Request postmortems, incident summaries, and partner-change history for the past twelve months from payments and support leadership.
