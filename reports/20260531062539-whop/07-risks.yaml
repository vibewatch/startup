    - Processor reserve hikes or offboarding can hit liquidity, access, and growth at once.
    - Whop markets orchestration and multi-rail redundancy.
    - high
  - - Global payout and tax stack
    - 187+ country payouts, 190+ country tax handling, and crypto/Venmo/wire payout options expand operational edge cases.
    - Complexity can create compliance failures, payout delays, or expensive manual support paths.
    - Integrated KYC, tax, and local payment tooling.
    - medium-high
  - - Category sensitivity to external policy
    - Financial partners can prohibit categories for legal, regulatory, reputational, or business reasons.
    - Even if Whop wants the GMV, external partners can still force category contraction.
    - Policy discretion and offboarding tools.
    - high
  - - Creator and category concentration opacity
    - Whop discloses scale claims but not top-seller GMV, dispute mix, or sensitive-category revenue share.
    - A small number of large creators or risky categories could dominate economics without public visibility.
    - No public mitigation beyond broad policy language.
    - high
  - - Trust-safety and compliance capacity opacity
    - Public pages describe policies but not staffing depth, review SLAs, or case-volume handling.
    - Control systems may be adequate, or they may be thin relative to scale; investors cannot verify publicly.
    - Detailed policy texts and some age-gating design work.
    - medium-high
