- id: TR005
  title: Mitigation and thesis-break criteria table
  columns:
  - Risk
  - Indicator to monitor
  - Threshold / event
  - Action implication
  rows:
  - - Payments stress
    - Processor reserve notices, payout delays, or rising dispute fees
    - Any processor offboarding, step-change reserve hike, or persistent payout lag
    - Pause aggressive underwriting until processor concentration and reserve data are supplied.
  - - Regulatory-borderline category mix
    - Share of GMV from trading, crypto, betting, or make-money offers
    - Sensitive categories become a large share of GMV or complaint volume
    - Re-rate compliance risk and require category-level revenue plus dispute disclosures.
  - - Promotion and disclosure failure
    - Affiliate or bounty campaigns lacking clear compensation disclosures
    - Repeated disclosure misses or creator earnings claims that violate platform policy
    - Treat as thesis-break for brand trust unless Whop shows strong enforcement logs.
  - - Creator-quality deterioration
    - Increase in spam complaints, fake-review accusations, or refund disputes
    - Complaint velocity rises faster than GMV or support resolution
    - Assume marketplace quality is weakening and that CAC or churn will worsen.
  - - Minor-safety incident
    - Underage access to restricted betting or adult-adjacent communities
    - Any serious incident indicating failed age-gating or trust-safety escalation
    - Escalate risk rating immediately; require incident postmortem and control remediation.
  - - Control-stack opacity
    - Management unwilling to share dispute, reserve, moderation, and concentration dashboards
    - Core metrics remain private late in diligence
    - Move from buy or track toward research-more or avoid because residual risk cannot be sized.
  notes: These triggers are intentionally monitorable and map to public-risk themes that can transmit into growth, liquidity, brand, and investability.
