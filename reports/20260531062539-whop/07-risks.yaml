- id: TR003
  title: Marketplace moderation and creator-quality risk register
  columns:
  - Risk
  - Public evidence
  - Failure mode
  - Mitigation maturity
  - Residual exposure
  rows:
  - - Get-rich-quick / low-quality community mix
    - Third-party reviewers describe spammy groups and get-rich-quick vibes; discover surfaces risk-adjacent categories.
    - Buyer trust erodes, quality creators are diluted, and complaints rise before revenue visibly slows.
