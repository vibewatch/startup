  - - Fake reviews and manufactured social proof
    - Guidelines ban fake reviews; JustUseApp reviews allege only positive reviews are surfaced.
    - Misleading social proof can accelerate bad purchases and later trigger refunds or reputational harm.
    - Low-medium — clear rule exists, but public proof of detection quality is limited.
    - high
  - - Seller-first refund model hurting platform trust
    - Buyer terms split payment-layer versus product-level issues, often sending buyers back to sellers for access or refund disputes.
    - Whop may avoid direct economic responsibility but still absorb blame in public complaint channels.
    - Medium — escalation paths exist, but user experience remains fragmented.
    - medium-high
  - - Underage exposure to restricted categories
    - Youth Safety policy blocks minors from betting-related groups and adds parental-consent controls for earnings.
    - If age gating lags policy, minors could still encounter inappropriate communities before removal.
    - Medium — policy is detailed, but implementation evidence is limited.
    - medium-high
  - - Complaint accumulation across public surfaces
    - Trustpilot, BBB, JustUseApp, and PissedConsumer all provide complaint or review surfaces for Whop.
    - Persistent complaints can increase CAC, payment-partner scrutiny, and seller churn.
    - Low-medium — support responses exist, but public complaint metrics remain visible.
    - medium-high
