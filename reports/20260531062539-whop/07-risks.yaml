  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: payment-loss-metrics
    missingEvidence: Monthly chargeback rate, reserve percentage, refund rate, dispute mix, and payout-delay metrics by category and by top sellers.
    whyItMatters: Without payment-loss KPIs, investors cannot tell whether public complaint signals are edge cases or a scaling economics problem.
    diligencePath: Request twelve months of processor dashboards, reserve notices, dispute ratios, and payout-delay logs segmented by product category.
    relatedQuestionRefs:
    - QR015
    - QR027
    relatedTableRefs:
    - TR002
    - TR004
  - type: missing-source
    severity: material
    topic: regulatory-enforcement-history
    missingEvidence: Outside-counsel memo or management representation covering any regulator inquiries, payment-monitoring escalations, or legal demand letters tied to Whop or its top creators.
    whyItMatters: The public perimeter is active, but investors still need to know whether Whop itself has already crossed any regulatory or partner risk thresholds.
    diligencePath: Ask counsel for a current litigation and regulator-inquiry schedule plus any merchant-monitoring or reserve correspondence from payment partners.
    relatedQuestionRefs:
    - QR020
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: moderation-capacity
    missingEvidence: Trust-safety staffing, moderation SLA metrics, review-removal rates, escalation volumes, and the split between automated and human review.
    whyItMatters: Policy language only matters if Whop can review, escalate, and remove risky listings before complaints and chargebacks compound.
    diligencePath: Request operating dashboards for trust-safety headcount, queue times, false-positive rates, and enforcement actions by category.
    relatedQuestionRefs:
    - QR021
    relatedTableRefs:
    - TR003
    - TR004
  - type: private-evidence-only
    severity: material
    topic: sensitive-category-and-creator-concentration
    missingEvidence: GMV, disputes, refund rates, and top-seller concentration for trading, crypto, sports-betting, and other regulator-sensitive categories.
    whyItMatters: A small set of high-risk categories or creators can dominate downside even when broad marketplace metrics look healthy.
    diligencePath: Request category-level GMV, refund, chargeback, and top-creator concentration tables for the trailing twelve months.
