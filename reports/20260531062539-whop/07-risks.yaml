- id: payments-moderation-and-reputation
  title: Payments, moderation, and reputation risk
  body: 'Whop''s payments and moderation risks are tightly linked. Buyer Terms, Seller Terms, and pricing disclosures show that the company has built an explicit machine for subscriptions, disputes, reversals, reserves, and multi-rail payouts; that is a strength, but it also means payment friction is a first-order operating variable. Sellers bear direct liability for chargebacks and refunds, and Whop or its financial partners can impose reserves or suspend payouts when dispute metrics worsen. On paper, that protects the platform. In practice, external review surfaces show why the risk still lands on Whop''s brand: public complaints already mention unauthorized charges, cancellation friction, refund delays, payout issues, fake reviews, and spammy marketplace quality. The platform''s own policies acknowledge the threat by banning fake reviews, platform manipulation, deceptive earnings claims, and payment abuse. Youth-safety rules also show that Whop knows some categories require stricter treatment,
    especially around minors and sports betting. The open concern is execution quality: public evidence does not show moderation staffing, complaint-resolution SLAs, reserve levels, or the share of disputes coming from higher-risk categories. That leaves investors underwriting a marketplace where reputation can deteriorate faster than policy language can contain it.'
