- id: TI003
  title: Unit Economics Table
  columns:
  - Metric / proxy
  - Public value
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Annualized revenue signal
    - $142M annualized in Oct-2025 vs $56M end-2024
    - Medium
    - Shows strong monetization momentum despite private-company opacity
    - Provide audited monthly revenue bridge by stream for 2024-2026
  - - Payment volume / GMV signal
    - '>$1B annual payments signal in Apr-2025; monthly GMV ~$80M to ~$100M in late-2024 / spring-2025'
    - Medium
    - Supports scale and implied throughput for fee revenue
    - Provide monthly GMV, TPV, and refund-adjusted net volume
  - - Seller outcome concentration
    - 87.8% of tracked products at $0 revenue; median earning product ~$74/mo
    - Medium
    - Suggests the marketplace is power-law distributed and average merchant quality is thin
    - Provide cohort retention and revenue concentration by top 1%, 5%, and 10% sellers
  - - Large-winner signal
    - 258 sellers reportedly crossed $1M earned on platform
    - Medium
    - Confirms Whop can support meaningful merchant scale
    - Disclose how many $1M+ sellers remain active after 12 and 24 months
  - - Creator payout scale
    - ~$3B annual payouts per Built By Foundry
    - Medium
    - Shows large gross flow even if Whop's own net revenue is smaller
    - Provide audited payout volume, reserves, and loss rates
  - - Realized take rate
    - Not publicly reported; only list-fee and external stack estimates are available
    - Medium
    - Critical for valuing revenue quality and gross margin potential
    - Disclose net revenue ÷ GMV by marketplace, off-platform, BNPL, and cross-border mix
  notes: This table intentionally mixes reported numbers with explicit null-like gaps because Whop is private and does not publish audited operating metrics.
