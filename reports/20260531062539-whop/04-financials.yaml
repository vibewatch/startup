- id: TI004
  title: Capital Adequacy Table
  columns:
  - Item
  - Public value / status
  - Evidence quality
  - Implication
  - Diligence ask
  rows:
  - - Series A capital
    - '2023: $17M Series A led by Insight Partners'
    - High-quality news source
    - Shows early institutional support but is small relative to current scale
    - Confirm post-money valuation and use of proceeds from the 2023 round
  - - Pre-Tether disclosed funding
    - Sacra lists $67M total funding before 2026
    - Medium
    - Implies at least one substantial intermediate round before Tether
    - Provide full round-by-round cap table and primary vs secondary split
  - - Implied intermediate round
    - ~$50M inferred between Series A and Tether
    - Low / estimated
    - Suggests Whop had already raised meaningful growth capital before 2026
    - Confirm exact 2024 round size, investor mix, and liquidation preferences
  - - Latest disclosed valuation
    - $1.6B after Tether strategic investment
    - Medium
    - Supports balance-sheet credibility and ability to recruit/invest
    - Disclose whether the 2026 deal included secondaries or structure that affects effective valuation
  - - Latest disclosed capital inflow
    - $200M strategic investment from Tether
    - Medium
    - Likely reduces near-term dependence on immediate fundraising
    - Provide closing date, cash received, and earmarked use of proceeds
  - - Cash on hand
    - Unavailable publicly
    - Low
    - Prevents direct runway analysis
    - Provide unrestricted cash, restricted cash, and any reserve balances
  - - Monthly burn / runway
    - Unavailable publicly
    - Low
    - Blocks a clean capital-adequacy underwriting view
    - Provide monthly burn, runway by scenario, and any minimum cash covenant
  notes: Funding chronology is only partially public; this table separates disclosed financing events from inferred estimates and explicitly marks cash/burn fields as unavailable.
