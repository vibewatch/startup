- id: TI005
  title: Public Financial Gaps Table
  columns:
  - Missing metric
  - Why it is missing
  - Underwriting impact
  - Exact diligence path
  - Severity
  rows:
  - - Gross margin / cost of revenue
    - No audited P&L or management disclosure in public sources reviewed
    - Cannot test whether Whop behaves like software, payments, or a lower-margin marketplace hybrid
    - Request audited income statements plus cost-of-revenue split by payments, payout, support, and fraud
    - Material
  - - CAC / payback / sales efficiency
    - No public acquisition-cost, payback, or sales-cycle disclosure
    - Cannot judge whether marketplace distribution truly lowers acquisition cost
    - Request paid vs organic acquisition mix, cohort CAC, and payback by merchant segment
    - Material
  - - Churn / NRR / cohort retention
    - Private company with no public cohort tables or retention commentary
    - Cannot value revenue durability or merchant lifetime value
    - Request monthly merchant retention, NRR, and churn by category and acquisition channel
    - Material
  - - Cash balance / burn / runway
    - Public funding announcements do not disclose unrestricted cash or monthly cash use
    - Capital adequacy remains qualitative instead of quantitative
    - Request board reporting pack with cash bridge, burn, and runway scenarios
    - Blocking
  - - Realized take rate by channel
    - Only list fees and external fee-stack estimates are public
    - Revenue quality and margin path are impossible to normalize across marketplace vs off-platform volume
    - Request GMV, TPV, and net revenue by marketplace referral, embedded checkout, BNPL, FX, and payouts
    - Material
  - - Metric-definition bridge for users and sellers
    - Public sources cite different user and seller counts with no reconciliation
    - Even top-line scale metrics have definition risk
    - Request management definitions for MAU, users, sellers, active merchants, and products
    - Minor
  notes: These gaps are the main reasons the chapter remains constructive on monetization breadth but cautious on underwritten profitability and runway.
  claimRefs:
  - CI020
  - CI028
  - CI044
  - CI045
  - CI046
