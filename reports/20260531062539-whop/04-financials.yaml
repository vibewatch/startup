- id: capital-adequacy
  title: Capital Adequacy and Financing Dependence
  body: Whop's disclosed financing history is enough to show substantial support, but not enough to underwrite runway with confidence. TechCrunch reported a $17M Series A in 2023, Sacra lists $67M of funding and an $800M valuation before the 2026 financing, and Tether then announced a $200M strategic investment tied to stablecoin payout infrastructure. That combination strongly suggests Whop is not capital-constrained in the very near term, especially for software-led product expansion. Even so, the company is still financially opaque. No public source reviewed here provides unrestricted cash, monthly burn, gross margin, debt, or formal runway, and the terms stress that payment funds are held by third-party financial partners rather than by Whop itself. Stablecoin-enabled payouts may lower settlement friction and improve conversion in harder-to-serve geographies, but they do not eliminate the need to prove underlying merchant quality, loss rates, or operating leverage. For diligence purposes,
    the 2026 round improves capital adequacy qualitatively, while leaving the most important underwriting math undisclosed.
  claimRefs:
