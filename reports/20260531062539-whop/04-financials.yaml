tables:
- id: TI001
  title: Revenue Streams Table
  columns:
  - Revenue stream
  - Mechanism
  - Public signal / current status
  - Revenue quality
  - Diligence ask
  rows:
  - - Marketplace discovery / referral take
    - Seller pays for demand generated on Whop marketplace
    - Officially visible marketplace and ratings surface; realized referral economics not disclosed
    - Potentially high quality if repeat buyers convert, but channel mix is private
    - Break out GMV and net revenue by marketplace-sourced versus self-sourced sales
  - - Embedded checkout processing
    - 2.7% + $0.30 card-processing layer on seller-owned checkout flows
    - Official list pricing disclosed on Whop pricing and docs pages
    - Likely recurring with scale, but fee compression risk exists for enterprise merchants
    - Provide net payment revenue, chargeback losses, and enterprise discounting by cohort
  - - Cross-border and FX uplift
    - Additional surcharges on international cards and FX conversion
    - Official surcharges of +1.5% international and +1% FX are public
    - Good monetization lever, but also customer-cost sensitive
    - Show international volume mix, FX incidence, and cross-border authorization rates
  - - Financing / BNPL
    - Whop earns financing-partner economics on installment transactions
    - Official financing fee listed at 15% per successful financing transaction
    - High yield per transaction, but potentially riskier and category-specific
    - Disclose BNPL penetration, approval rate, and defaults/chargeback exposure
  - - Payout and settlement tooling
    - Payout methods, withdrawal fees, and faster global settlement increase monetization layers
    - Official multi-rail payout footprint is public; payout fees mostly come from third-party explainers
    - Supportive of net take rate, but could be regressive for small creators
    - Disclose payout-fee revenue, average withdrawal size, and seller payout frequency
  notes: Public materials disclose list pricing and payout capabilities, but not net revenue share by channel; several rows therefore separate official facts from third-party fee-stack estimates.
  claimRefs:
  - CI001
  - CI003
  - CI004
  - CI005
  - CI039
  - CI042
  - CI045
- id: TI002
  title: Pricing / Monetization Table
  columns:
  - Layer
  - Public price / rate
  - Who pays
  - Margin implication
  - Caveat
  rows:
  - - Domestic card processing
    - 2.7% + $0.30
    - Seller / merchant
    - Baseline monetization layer; scalable if loss rates stay controlled
    - Official list price, not realized net take
  - - International card surcharge
    - +1.5%
    - Seller / merchant
    - Adds yield on cross-border demand
    - May be offset by lower conversion or higher dispute risk
  - - Currency conversion
    - +1% when required
    - Seller / merchant
    - Monetizes cross-currency volume
    - Dependent on FX mix and merchant geography
  - - Financing / BNPL
    - 15% per financed transaction
    - Seller / merchant indirectly via checkout economics
    - Very high headline yield on financed volume
    - Adoption and risk profile by category are undisclosed
  - - ACH debit
    - 1.5%, capped at $5
    - Seller / merchant
    - Low-cost alternative for higher-AOV domestic transactions
    - Public docs do not disclose ACH share
  - - Automation / platform fee
    - ~3% on automated gated sales (third-party reported)
    - Seller / creator
    - Could lift realized take rate above official processor pricing
    - Not stated on official pricing pages; treat as external estimate
  - - Payout withdrawal fee
    - $2.50-$23 per withdrawal (third-party reported)
    - Seller / creator
    - Small but material to low-ARPU creators
    - Needs official confirmation and payout-size distribution
  notes: Rows 1-5 come from Whop official pricing/docs; rows 6-7 are 2026 third-party pricing observations and should be treated as directional until management confirms them.
  claimRefs:
