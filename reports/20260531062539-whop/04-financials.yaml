- id: traction-unit-economics
  title: Public Traction and Unit-Economics Proxies
  body: 'Public traction signals are strong, but the unit-economics picture is mostly indirect. Sacra estimates annualized revenue reached $142M in October 2025 after exiting 2024 at $56M, while payment volume signals crossed $1B annually and monthly GMV approached $100M by spring 2025. Whop''s own network site markets 22M+ MAU and 27,000+ businesses; outside trackers see a large but definition-sensitive footprint, with WhopScan tracking 70,000+ products and 50,000+ companies while Sacra cites 18.4M+ users and 183,628 sellers. Seller-economics data is more revealing than the topline. WhopTrends'' 191,654-product dataset and Built By Foundry''s review both point to a steep power law: most products generate no tracked revenue, median monetization is low, and a very small minority drives a disproportionate share of platform dollars. That suggests Whop''s marketplace can produce large winners and supports strong payment volume, but average seller quality and durability are likely much weaker
    than the biggest case studies imply. Without gross margin, refund, or cohort data, the public record supports a scale thesis more confidently than a profitability thesis.'
  claimRefs:
