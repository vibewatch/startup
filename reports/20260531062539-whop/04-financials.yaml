  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: cash-burn
    missingEvidence: Current unrestricted cash balance, monthly burn, runway, and any debt or reserve facilities.
    whyItMatters: Without cash and burn, the Tether financing cannot be translated into quantified runway or financing need.
    diligencePath: Request the latest board pack or monthly finance dashboard showing cash, burn, and 12-24 month runway scenarios.
    relatedQuestionRefs:
    - QI014
    - QI015
    relatedTableRefs:
    - TI004
  - type: missing-source
    severity: material
    topic: gross-margin
    missingEvidence: Gross margin, cost of revenue, fraud loss, and refund / chargeback rates by channel.
    whyItMatters: These metrics determine whether Whop is converging toward software-like margins or staying closer to a lower-margin marketplace/payments blend.
    diligencePath: Request audited income statements plus revenue and cost-of-revenue segmentation for marketplace, off-platform, financing, FX, and payouts.
    relatedQuestionRefs:
    - QI022
    relatedTableRefs:
    - TI003
    - TI005
  - type: missing-source
    severity: material
    topic: sales-efficiency
    missingEvidence: CAC, payback, sales cycle, and paid-versus-organic acquisition mix by merchant cohort.
    whyItMatters: Marketplace reach may lower acquisition cost, but the public record does not prove it.
    diligencePath: Request acquisition-channel mix, cohort CAC, payback, and sales-efficiency dashboards by merchant segment.
    relatedQuestionRefs:
    - QI023
    relatedTableRefs:
    - TI003
    - TI005
  - type: missing-source
    severity: material
    topic: retention-quality
    missingEvidence: Merchant churn, NRR, customer concentration, and refund / dispute rates by category.
    whyItMatters: Revenue durability cannot be judged from GMV and payout scale alone, especially in grey-market or trend-driven categories.
    diligencePath: Request cohort retention tables, concentration statistics, and refund / dispute metrics split by category and top merchants.
    relatedQuestionRefs:
    - QI024
    relatedTableRefs:
    - TI003
    - TI005
  - type: conflicting-data
    severity: minor
    topic: metric-definitions
    missingEvidence: A reconciled definition bridge for MAU, users, active sellers, products, and tracked companies across Whop and third-party trackers.
    whyItMatters: Even optimistic top-line adoption claims are hard to compare without metric definitions, which weakens confidence in surface-level scale claims.
    diligencePath: Ask management to define each user and seller metric and reconcile them to marketplace-only versus whole-network surfaces.
    relatedQuestionRefs:
    - QI021
    relatedTableRefs:
    - TI005
  - type: private-evidence-only
    severity: material
    topic: realized-take-rate
    missingEvidence: Net revenue split between marketplace referral take, processing, financing, payout, FX, and other seller services.
    whyItMatters: Official list fees do not reveal the realized take rate or margin contribution of each monetization layer.
    diligencePath: Request a revenue bridge from GMV/TPV to net revenue by channel and monetization layer.
    relatedQuestionRefs:
    - QI006
    - QI021
    relatedTableRefs:
    - TI001
    - TI002
