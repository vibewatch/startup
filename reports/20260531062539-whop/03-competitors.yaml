- id: pricing-and-packaging
  title: Pricing, packaging and merchant-model comparison
  body: >-
    Public 2026 pricing disclosures split the field into three economic models. First, percentage-take platforms: Whop, Gumroad, Patreon, Fourthwall's free tier, Discord server subscriptions and Lemon Squeezy all monetize as a share of creator revenue, although the details vary sharply. Whop's public network pricing starts at 2.7%+$0.30 domestically with add-on fees for international cards, ACH, orchestration and tax collection. Gumroad charges 10%+$0.50 directly and 30% through Discover. Patreon's standard plan is 10% plus processing, currency conversion, payout fees and taxes, with legacy 5%/8%/11% plans preserved for older creators. Lemon Squeezy is 5%+50¢ but pairs that fee with a much clearer Merchant of Record pitch than Whop offers.


    Second, fixed-fee suites: Kajabi, Stan, Skool Pro and Fourthwall Pro move more cost upfront. Kajabi's current list prices span $89 to $499 per month and are the clearest high-fixed-cost option. Stan prices at $29 and $99 with zero transaction fees, which can be attractive for social sellers once they have predictable volume. Skool's public page shows low Hobby pricing but an incomplete Pro fee disclosure. Third, mixed or partially opaque models remain in Payhip, where the official page emphasizes a free plan, immediate payouts and no feature gating, but does not cleanly surface the fee ladder in the retained capture. For Whop, the key economic takeaway is that its headline payment fee looks attractive against Patreon or Gumroad, but its limited merchant-of-record scope leaves Lemon Squeezy, Gumroad and possibly Fourthwall with a stronger compliance-offloading story.
