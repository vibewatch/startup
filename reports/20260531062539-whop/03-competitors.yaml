  - - Patreon
    - Membership / community platform
    - Trustpilot complaint signal only in retained independent cache
    - Fan-subscription creators monetizing exclusive content and community
    - Mature membership features plus fraud, dispute and tax handling
    - 10% standard take plus extra fees; narrower commerce model
  - - Kajabi
    - All-in-one expert-business suite
    - 100K+ businesses; $10B+ earned; 75M+ customers served
    - Courses, coaching and owned-audience education businesses
    - Funnels, email, AI and community in one suite
    - Highest fixed monthly cost in this field and no marketplace discovery signal
  - - Stan
    - Link-in-bio creator storefront
    - No clean public creator-count disclosure in retained sources
    - Social-first creators selling downloads, bookings and lightweight memberships
    - Fast setup with zero platform transaction fees
    - No free plan, basic analytics, no marketplace reach
  - - Skool
    - Community/course platform
    - Public pricing disclosure is thin beyond plan labels
    - Paid groups, cohort-style communities and coaching
    - Simple community-first UX with affiliates
    - Incomplete public fee/compliance disclosure and lighter commerce rails
  - - Fourthwall
    - Merch, shop and membership stack
    - 500,000+ creators
    - Creator brands selling merch plus memberships or digital add-ons
    - Merch fulfillment, social shopping and customer support handled
    - Merch-first product focus and less evidence of payments/payout depth
  - - Discord
    - Community monetization substrate
    - Mass-scale community platform, but no clean creator-count metric in retained cache
    - Server communities monetizing access and perks
    - Deep engagement surface and 90/10 revenue split
    - US-only monetization onboarding plus category restrictions and no storefront depth
  - - Shopify
    - General commerce infrastructure
    - Public incumbent; creator-specific scale not isolated in retained sources
    - Brands and social sellers needing broad commerce tooling
    - Mature commerce stack, social selling and digital-product support
    - Not creator-community native and no marketplace-discovery layer in this evidence set
  - - Lemon Squeezy
    - SaaS billing / Merchant of Record
    - Stripe-managed-payments update is the clearest public scale signal in retained cache
    - Software, SaaS and global digital sellers
    - Strong MoR, subscriptions, customer portal and license keys
    - No native marketplace or community layer
  - - Payhip
    - Hosted creator storefront
    - No clean public scale disclosure in retained sources
    - Downloads, courses and memberships for budget-conscious creators
    - Free-plan posture, immediate payouts and simple setup
    - Public fee ladder is thin in retained cache and discovery/community are weaker than Whop
