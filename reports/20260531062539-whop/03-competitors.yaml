  evidenceGaps:
  - type: missing-source
    severity: material
    topic: payhip-pricing-transparency
    missingEvidence: A clean official Payhip pricing capture showing the current plan cards and exact fee tiers beyond the reader-rendered FAQ text.
    whyItMatters: Payhip is a realistic low-end substitute for Whop, so fee opacity weakens the starter-economics comparison.
    diligencePath: Fetch a cleaner official Payhip pricing render or archived HTML snapshot with visible plan cards and seller-of-record language.
    relatedQuestionRefs:
    - QP023
    relatedTableRefs:
    - TP003
  - type: access-blocked
    severity: material
    topic: skool-pro-fee-disclosure
    missingEvidence: A fuller Skool pricing capture that confirms what the visible 2.9% on the Pro plan means and whether other payout or tax fees apply.
    whyItMatters: Skool is a relevant paid-community substitute and an incomplete fee stack could overstate or understate its economics versus Whop.
    diligencePath: Refetch Skool pricing with a more complete render or find an official FAQ that explains the Pro fee stack.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: whop-discovery-mix
    missingEvidence: Marketplace-versus-seller-owned traffic mix, including what share of Whop GMV comes from Discover or network-led demand.
    whyItMatters: Whop's moat thesis depends on whether marketplace distribution is a meaningful acquisition engine or mostly a marketing claim.
    diligencePath: Request cohort-level seller data or internal marketplace attribution from management; corroborate with top-seller case studies.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP005
  - type: private-evidence-only
    severity: minor
    topic: creator-multi-homing
    missingEvidence: Observed creator multi-homing rates across Whop plus Discord, Kajabi, Shopify or Lemon Squeezy substitute bundles.
    whyItMatters: Switching-cost analysis is directionally clear, but hard multi-homing data would sharpen how durable Whop's workflow bundling really is.
    diligencePath: Interview active sellers and review onboarding/export behavior by segment; compare community and checkout overlap in management reporting.
    relatedQuestionRefs:
    - QP026
    relatedTableRefs:
    - TP004
