- id: TP005
  title: Moat durability / competitive risk register
  columns:
  - Whop moat claim
  - Threat or displacement vector
  - Severity
  - Evidence in retained sources
  - Implication / diligence ask
  rows:
  - - Bundled discovery plus commerce
    - Creators may value only one layer and buy a simpler single-purpose tool
    - High
    - Gumroad, Stan, Payhip, Patreon and Discord each solve narrower jobs with less operational breadth
    - Test win rates by seller archetype instead of assuming one universal competitive set
  - - Marketplace reach and network effects
    - Whop does not disclose how much GMV or seller acquisition actually comes from marketplace traffic
    - High
    - Whop cites 22M+ MAU and 27,000+ businesses, but not discovery contribution to GMV
    - Request seller-level attribution data and repeat-purchase cohorts tied to marketplace demand
  - - Payments and payout depth
    - Lemon Squeezy and Shopify are stronger infrastructure choices for software or general-commerce sellers
    - High
    - Lemon Squeezy has clearer MoR/tax messaging; Shopify is a broader commerce incumbent
    - Segment Whop's pipeline between creator-native community sellers and infrastructure-led software sellers
  - - Community adjacency
    - Patreon, Skool and Discord can win if paid community is the whole job
    - Medium
    - These platforms are simpler narratives for membership-first buyers
    - Measure attach rates for Whop community products versus checkout-only products
  - - Compliance outsourcing
    - Whop's seller terms define a narrower MoR role than stronger compliance-led rivals market
    - High
    - Seller remains supplier for VAT, sales tax and consumer protection outside payment settlement
    - Clarify how much seller friction Whop still carries on tax, refunds and consumer liability
  - - Merch and physical-brand expansion
    - Fourthwall owns a better merch narrative for creator brands
    - Medium
    - Fourthwall handles production, shipping, support and social merch shelf distribution
    - Whop should not assume digital-product strength automatically translates to merch-heavy categories
  notes: Severity reflects the likely impact on Whop's competitive win rate if the rival set executes cleanly in the segment where it is structurally strongest.
