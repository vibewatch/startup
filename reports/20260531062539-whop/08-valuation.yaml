artifact: valuation
slug: whop
runDate: '2026-05-31'
company:
  name: Whop
chapter:
  number: 8
  title: Valuation
  summary: |-
    Whop's February 2026 Tether-backed round sets a clear price but not a clean underwriting case: the reported $1.6B valuation implies roughly 11.3x Sacra's $142M annualized revenue estimate, a level that sits far above Etsy, Fiverr, and Wix and roughly in Shopify territory despite Whop still lacking audited financials and public cap-table detail. The company has enough evidence of real distribution, payments infrastructure, and cross-border payout ambition to justify a premium over slower public marketplaces, but the premium already looks close to a bull-case multiple rather than a base-case one.

    The price-sensitive call is TRACK with medium confidence and a stretched valuation stance at the current mark. A more attractive common-equivalent entry zone is roughly $0.9B-$1.2B, or alternatively current pricing with strong downside protection, information rights, and verified round terms. Public-market and private-transaction lenses together suggest that Whop is cheaper than peak-cycle creator-economy financings, but still rich versus today's audited comps unless it proves durable 5.5%+ take rates, broader seller quality, and materially better disclosure.
sections:
- id: financing-and-revenue-translation
  title: Financing context and GMV-to-revenue translation
  body: |-
    Whop's February 2026 financing is easy to headline but harder to underwrite. Third-party coverage ties the Tether investment to a $200 million check at a $1.6 billion valuation, while Tether's own announcement focuses more on strategic alignment, stablecoin infrastructure, and international expansion than on round mechanics. That distinction matters: the market knows the headline price, but not the preference stack, conversion terms, or downside protection. For valuation work, the public record therefore gives a clean post-money marker but not a clean common-equity marker.

    The operating translation is similarly impressive but noisy. Official surfaces cite more than 18.4 million users and approximately $3 billion in annual participant earnings, while the network site now markets 22M+ MAU and 27,000+ businesses. The differences likely reflect continued growth and different metric definitions, but they also show why normalized disclosure is still weak. On monetization, Whop's official fee stack starts at 2.7% + $0.30 on domestic cards and layers in international, FX, orchestration, billing, affiliate, financing, and payout charges. Sacra's estimate of a roughly 5.5% blended take rate in early 2025 is therefore directionally plausible. Using Sacra's $142 million annualized revenue estimate implies an ~11.3x revenue multiple at the last round, while the company's own >$1 billion payment-volume floor implies <1.6x GMV. That is a premium price, but not an obviously absurd one if Whop can prove that the payments network creates durable, software-like monetization rather than thin payment-processor economics.
