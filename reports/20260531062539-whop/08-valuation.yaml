    - Audited FY2025/FY2026 revenue and cap-table terms support current mark
  - - Confidence
    - medium
    - Key financial inputs still depend on company claims and analyst estimates
    - Audited statements plus reconciled KPI definitions
  - - Risk rating
    - high
    - Moderation, payout, and crypto-rail concentration risks can hit seller trust quickly
    - Demonstrated dispute control and broader seller-category mix
  - - Valuation stance
    - stretched
