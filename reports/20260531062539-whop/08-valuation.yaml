- id: TV007
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - Revenue quality shortfall
    - Audited revenue lands below ~$110M or take rate falls materially below ~5%.
    - Breaks the software-premium underwriting needed to justify current price.
    - Do not pay near the last-round mark; re-underwrite on marketplace multiples.
  - - Trust / dispute deterioration
    - Payout delays, scam complaints, or refund friction become persistent and measurable.
    - Seller quality and retention weaken, depressing GMV and the valuation multiple simultaneously.
    - Pause investment or demand strong downside protection.
  - - Category concentration stays high
    - High-risk betting / trading cohorts remain the core GMV driver without broadening mix.
    - Raises regulatory, reputation, and churn risk; limits multiple expansion.
    - Treat Whop as a riskier niche marketplace, not a premium infra asset.
  - - Adverse round terms surface
    - New diligence reveals strong preferences, participation, or strategic rights ahead of common.
    - Common-equity returns could sit far below headline enterprise or post-money value.
    - Reprice entry or require preferred-like protections.
  - - Payments edge fails to prove out
    - Authorization or payout improvements do not show up in seller economics.
    - Removes the main argument for paying Shopify-like valuation territory.
    - Use lower public-comp range and downgrade conviction.
  notes: Triggers are monitorable and price-relevant. They should be revisited whenever Whop discloses new round terms, audited numbers, or KPI definitions.
  claimRefs:
  - CV035
  - CV046
  - CV047
- id: TV008
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Cap table and round terms
    - Preference stack, participation rights, anti-dilution, MFN, and any Tether strategic rights.
    - Headline valuation is not enough to price common-equivalent downside.
    - Request data-room cap table, term sheets, and waterfall model from counsel / CFO.
  - - Audited revenue bridge
    - Audited FY2025 and YTD FY2026 revenue, gross margin, take rate, and product-level monetization mix.
    - The fair-value range moves materially depending on whether Whop is closer to 4% or 6% blended monetization.
    - Obtain audited financials and monthly management accounts.
  - - Metric reconciliation
    - Definition bridge for users, MAU, businesses, GMV, payouts, and creator earnings across all public surfaces.
    - Current marketing claims are directionally strong but not normalized enough for IC-grade modeling.
    - Ask finance and growth teams for KPI dictionary plus cohort tables.
  - - Quality and risk controls
    - Chargeback, dispute, refund, and fraud-loss rates by seller cohort; concentration in betting / trading categories.
    - Valuation premium depends on trust and category durability, not only GMV velocity.
    - Run risk deep dive with payments, compliance, and trust-and-safety owners.
  - - Payments network proof
    - Measured authorization lift, payout adoption, international conversion gains, and seller retention impacts from Whop Payments.
    - This is the core evidence required to justify a premium infrastructure multiple.
    - Review internal dashboards, case studies, and processor-level reporting.
  notes: These asks are designed to move the recommendation from medium-confidence tracking to a high-confidence underwriting view, one way or the other.
