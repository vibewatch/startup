- id: scenario-analysis-and-capital-stack
  title: Scenario analysis and dilution uncertainty
  body: |-
    The right way to hold the uncertainty is through scenarios. In the bull case, Whop turns the current payment-and-payout infrastructure into a real commerce operating system: take rate holds around the mid-5% range, audited revenue rises toward $180 million-$220 million, authorization gains are real, and seller quality broadens beyond the more controversial betting and trading cohorts. In that state, a 9x-11x multiple can support roughly $1.6 billion-$2.2 billion of value, which means the current round can work but does not leave huge room for error.

    The base case is less generous. If audited revenue settles closer to $120 million-$150 million and the market values Whop as a fast-growing but still risky blended marketplace/infrastructure asset, a 7x-8.5x multiple implies about $0.9 billion-$1.3 billion. The bear case is what matters for underwriting: if revenue proves lower, take rate softens toward commodity payment economics, or trust and moderation problems slow seller retention, the market could pay only 4x-6x on $80 million-$100 million of revenue, implying $0.3 billion-$0.6 billion. Because public materials still do not disclose preference terms, anti-dilution rights, or liquidation waterfalls, investors should assume the real downside for common-equivalent exposure could be worse than the headline valuation range suggests. The cap table is not just a legal footnote here; it is one of the core valuation variables.
