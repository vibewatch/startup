- id: TV005
  title: Comparable valuation table
  columns:
  - Comparable
  - Model
  - Current sales multiple
  - Relevance to Whop
  - Key limitation
  rows:
  - - Etsy
    - Marketplace for digital/physical seller demand aggregation
    - 2.21x P/S
    - Useful marketplace baseline for buyer discovery, seller trust, and take-rate discipline.
    - Physical-goods exposure and mature growth profile make it less software-like than Whop.
  - - Shopify
    - Commerce infrastructure / software platform
    - 12.4x P/S
    - Best premium benchmark for checkout, payments, and merchant tooling.
    - Far better disclosed, far larger, and much higher quality than Whop's current public evidence.
  - - Fiverr
    - Digital services marketplace
    - 0.95x P/S
    - Good comp for freelance/digital-income marketplace monetization.
    - Labor marketplace economics differ from creator-product monetization.
  - - Wix
    - Creator / SMB web and commerce tooling
    - 1.21x P/S
    - Relevant for creator tooling and SMB enablement rather than marketplace discovery.
    - Website-software mix has lower moderation risk and more mature subscription economics.
  notes: Public comp lens intentionally blends marketplace and commerce-infrastructure names because Whop straddles both. Multiples are current as of May 2026 from CompaniesMarketCap.
