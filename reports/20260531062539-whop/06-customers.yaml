figures:
  - id: FU001
    title: "Customer journey map"
    type: journey-map
    insight: >
      Whop's customer journey begins on the seller side with business setup and on the buyer side
      with discovery. Expansion happens when a seller layers payments, community, affiliates, or
      Content Rewards on top of an initial offer; breakdown happens when trust issues, category
      quality problems, or payout/refund friction interrupt the loop.
    data:
      items:
        - id: seller-discovery
          label: "Seller discovery"
          actor: "Creator / small business"
          description: >
            Sellers arrive with an existing skill, audience, or niche product idea in coaching,
            software, clipping, trading, or paid communities.
          channels:
            - "Whop blog and educational content"
            - "Word of mouth among creators"
            - "Marketplace examples and top products"
        - id: storefront-setup
          label: "Storefront setup"
          actor: "Seller"
          description: >
            Sellers configure products, checkout, payouts, chat, communities, and app integrations
            using Whop's all-in-one storefront and docs stack.
          channels:
            - "Whop app"
            - "Docs and APIs"
            - "Whop dashboard"
        - id: buyer-discovery
          label: "Buyer discovery"
          actor: "Buyer / member"
          description: >
            Buyers discover storefronts via Whop marketplaces, affiliates, creator marketing,
            community referrals, and Content Rewards campaigns.
          channels:
            - "Discover / marketplace"
            - "Affiliate links"
            - "Content Rewards campaigns"
            - "Mobile app"
        - id: purchase-and-access
          label: "Purchase and access"
          actor: "Buyer"
          description: >
            Buyers purchase one-time offers or recurring access, then consume software, content,
            chat, courses, communities, or coaching through the same environment.
          channels:
            - "100+ payment methods"
            - "Mobile app"
            - "Chat and gated communities"
        - id: expansion-or-friction
          label: "Expansion or friction"
          actor: "Seller and buyer"
          description: >
            Healthy loops include subscriptions, app integrations, upsells, affiliates, and repeat
            community participation. Friction points include scams, refunds, payout disputes,
            support gaps, and trust issues in high-risk categories.
          channels:
            - "Subscriptions"
            - "Affiliates"
            - "Content Rewards"
            - "Support / dispute workflows"
    sourceRefs:
      - SU003
      - SU006
      - SU007
      - SU015
      - SU016

  - id: FU002
    title: "Adoption / deployment funnel"
    type: funnel
    insight: >
      Whop's supply side is highly skewed. A very large population of products reaches the market,
      but only a small minority monetize meaningfully, and an even smaller minority produce elite
      incomes.
    data:
      items:
        - label: "Tracked products"
          value: 100
          description: "WhopTrends tracks 195,236 products as the broad supply-side base."
        - label: "Products generating any revenue"
          value: 11.2
          description: "21,805 of 195,236 tracked products generate revenue at all."
        - label: "Products earning $1K+/month"
          value: 2.0
          description: "3,964 tracked products exceed $1K/month."
        - label: "Products earning $10K+/month"
          value: 0.5
          description: "961 tracked products exceed $10K/month."
    sourceRefs:
      - SU017

  - id: FU003
    title: "Customer proof matrix"
    type: matrix
    insight: >
      Whop's most convincing customer proof comes from live storefronts that expose both ratings
      and member counts. Category breadth is real, but proof quality is strongest in communities
      and coaching, not in published retention or concentration disclosures.
