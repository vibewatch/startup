  evidenceGaps:
    - type: enumeration-incomplete
      severity: material
      topic: TU003-named-customer-proof-coverage
      missingEvidence: "A broader named sample of public storefronts across more categories, including sellers that now operate through private links or removed storefronts."
      whyItMatters: "The named customer proof table is intentionally partial because only some high-signal storefronts expose public members, ratings, or analytics at runDate."
      diligencePath: "Request an internal seller leaderboard with active storefronts, GMV, refund rates, and buyer counts by category to expand TU003 beyond public exemplars."
      relatedQuestionRefs:
        - QU010
        - QU025
      relatedTableRefs:
        - TU003

    - type: missing-source
      severity: material
      topic: retention-gap
      missingEvidence: "Platform-wide GRR, NRR, logo churn, seller churn, buyer repeat-purchase rate, and cohort curves by major seller segment."
      whyItMatters: "Without cohort metrics, visible storefront activity can prove acquisition but not durability or LTV quality."
      diligencePath: "Request cohort retention data for sellers and buyers, including renewal, churn, and repeat-purchase frequency by category."
      relatedQuestionRefs:
        - QU017
        - QU025
      relatedTableRefs:
        - TU004

    - type: missing-source
      severity: material
      topic: concentration-risk
      missingEvidence: "Top-10 and top-100 seller share of GMV, fee revenue, and dispute volume, plus category-level GMV mix."
      whyItMatters: "Whop's long-tail monetization profile suggests concentration, but the actual dependence on a small seller set is not publicly quantified."
      diligencePath: "Ask management for seller-decile GMV, fee revenue contribution, and category-level take-rate economics."
      relatedQuestionRefs:
        - QU020
        - QU021
        - QU025
      relatedTableRefs:
        - TU005

    - type: conflicting-data
      severity: material
      topic: seller-fees
      missingEvidence: "A definitive current fee schedule for direct sales versus Discover-sourced sales and any remaining marketplace commission."
      whyItMatters: "Third-party review sources describe different seller fee stacks, so seller CAC and contribution-margin assumptions may be wrong if taken at face value."
      diligencePath: "Reconcile management-provided fee schedules, seller statements, and current docs screenshots for each checkout path."
      relatedQuestionRefs:
        - QU024
      relatedTableRefs:
        - TU005

    - type: missing-source
      severity: material
      topic: buyer-seller-split
      missingEvidence: "A clean public split between browsing users, transacting buyers, active sellers, and monthly active community members."
      whyItMatters: "The platform reports large aggregate audience numbers, but underwriting customer quality requires knowing who actually buys, who only browses, and who actively sells."
      diligencePath: "Request MAU, transacting buyer count, active seller count, and repeat-buyer rates by quarter."
      relatedQuestionRefs:
        - QU001
        - QU025
      relatedTableRefs:
        - TU002

    - type: missing-source
      severity: material
      topic: dispute-rate
      missingEvidence: "Refund, chargeback, fraud, and seller-suspension rates by category and payment method."
      whyItMatters: "Independent reviews surface recurring trust issues, but there is no public way to tell whether those issues are isolated or systemic."
      diligencePath: "Request dispute-rate dashboards, support-resolution SLAs, and scam-removal / moderation metrics by product category."
      relatedQuestionRefs:
        - QU018
        - QU019
        - QU025
      relatedTableRefs:
        - TU006
