callouts:
  - title: "Whop has real customer density across multiple seller archetypes, not just one niche"
    body: >
      Whop's public evidence shows more than a marketplace full of speculative listings. Official
      product surfaces, app-store data, and live storefronts point to working seller cohorts in
      coaching, clipping, community subscriptions, software, and premium education. Visible proof
      ranges from 51K iOS ratings to storefronts with 111, 13.8K, 46.8K, and 164.4K visible
      members, while third-party analytics point to 18.4M+ users, 183K+ sellers, and a marketplace
      spanning roughly 195K products. That breadth makes Whop's customer base materially broader
      than a single-category creator tool.
    calloutType: strength
    claimRefs:
      - CU005
      - CU010
      - CU023
      - CU025
      - CU026
      - CU027
      - CU028

  - title: "Customer durability is less proven than customer acquisition, and concentration risk is real"
    body: >
      Whop can show adoption and named storefront activity, but not platform-wide retention.
      Public evidence stops short of NRR, GRR, churn, repeat-buyer curves, and top-seller GMV
      concentration. At the same time, monetization is heavily skewed: only 11% of tracked
      products earn anything, roughly 0.5% exceed $10K/month, and the most visible top performers
      sit in categories such as clipping, high-ticket coaching, trading, and sports betting.
      Independent review sources repeatedly flag refunds, payout delays, spam, scams, and uneven
      support quality. The result is a platform with strong customer acquisition loops but only
      partial proof of durable, low-risk customer quality.
    calloutType: risk
    claimRefs:
      - CU016
      - CU017
      - CU018
      - CU029
      - CU030
      - CU031
      - CU032
