schemaVersion: "report-v2"
artifact: customers
slug: whop
runDate: "2026-05-31"
company:
  name: Whop
chapter:
  number: 6
  title: Customers
  summary: >
    Whop has a broad but uneven two-sided customer base. On the supply side it serves creators,
    small online businesses, and niche operators selling coaching, courses, paid groups,
    software, trading products, clipping programs, and digital services. On the demand side it
    serves buyers who join communities, purchase digital products, subscribe to memberships, and
    increasingly use the mobile app as a persistent access layer. Public 2026 evidence supports
    real adoption at marketplace scale: Sacra and RockWater cite 18.4M+ users, 183K+ sellers,
    $2.67B lifetime GMV, and 195-country reach, while WhopTrends tracks roughly 195K products.
    The quality of customer durability evidence is weaker than the quality of customer acquisition
    evidence. Whop exposes strong production proof in named storefronts such as Call Her Closed,
    Brez Clips, and Committed Coaches, plus strong platform-level app ratings, but it does not
    publicly disclose NRR, GRR, churn, repeat purchase curves, or top-customer concentration. The
    adverse picture matters: Trustpilot, JustUseApp, Gridinsoft, and ScamAdviser all surface
    recurring complaints about refunds, payouts, spam, scam exposure, and seller suspensions.
    The core customer risk is concentration: only 11% of tracked products generate any revenue,
    fewer than 1% break through to $10K/month, and the most visible categories remain high-ticket
    coaching, clipping, trading, sports betting, and business-opportunity products that can drive
    GMV but also elevate regulatory, trust, and reputational volatility.

sections:
  - id: customer-base-segmentation-and-personas
    title: Customer base segmentation and personas
    body: >
      Whop's customer base is explicitly two-sided. The company positions itself as infrastructure
      for sellers who want to build internet businesses and for buyers who want to purchase access,
      content, tools, and communities. Official surfaces consistently describe seller use cases as
      coaching and courses, paid groups, services, software, physical products, marketplaces, and
      telehealth; blog and review sources add recurring subscriptions, downloads, templates,
      Discord access, ebooks, and software subscriptions. That breadth creates at least three clear
      seller clusters. First are knowledge/education sellers offering coaching, courses, and
      premium communities. Second are performance or opportunity sellers concentrated in clipping,
      trading, sports betting, reselling, and business-strategy niches. Third are software and
      automation sellers using Whop as a payments-plus-access-control layer. On the buyer side,
      recurring personas include entrepreneurs buying business education, traders and bettors
      buying signals or communities, creators joining clipping or affiliate ecosystems, and members
      paying for software or ongoing communities rather than one-off downloads. The mobile app copy
      reinforces that Whop expects repeat community and product access after first purchase,
      because it frames the product as an all-in-one place to build, sell, and manage communities
      rather than a simple checkout widget.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU005
      - CU006
      - CU034
      - CU035
      - CU036
      - CU039
    tableRefs:
      - TU001
    figureRefs:
      - FU001

  - id: adoption-density-and-marketplace-shape
    title: Adoption trajectory, density, and marketplace shape
    body: >
      Public third-party metrics show that Whop has reached meaningful scale, but the marketplace
      is far denser than its marketing copy alone implies. Sacra and RockWater converge on 18.4M+
      users, roughly 183K sellers, $2.67B in lifetime GMV by February 2026, and annual creator
      payouts around $3B. RockWater adds that 143K+ products launched during 2025, 110K+ new
      creators joined in the same period, and the company had already added 297 apps to its
      developer app store plus 780+ live Content Rewards campaigns. WhopTrends broadens the
      picture by showing just how crowded the supply side has become: it tracks roughly 195,236
      products and finds that only 21,805 generate any revenue at all, with 3,964 above $1K/month
      and only 961 above $10K/month. That distribution matters more than topline user growth,
      because it shows a marketplace where buyer demand is real but monetization success is
      concentrated. Category data suggests the densest and highest-earning segments are not generic
      creator tools; they are high-ticket coaching, clipping, trading, sports betting, ecommerce,
      and business-opportunity products. In practical terms, Whop already has marketplace density,
      but not evenly distributed demand across seller cohorts.
    claimRefs:
      - CU007
      - CU008
      - CU009
      - CU010
      - CU011
      - CU012
      - CU013
      - CU014
      - CU015
