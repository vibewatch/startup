  figureRefs: []
- id: mobile-community-and-trust-controls
  title: Mobile/community delivery and user-facing trust controls
  body: 'Whop’s mobile and community surfaces appear tightly coupled to the core membership model. Public docs say members can access their whops from the native app or mobile browser, while the store listings reinforce that the same surface is used to buy products, manage communities, and consume content. Community primitives are not hidden: forums, chat, Discord linking, and app-based experiences are all documented. On the trust side, public controls are more user-facing than enterprise-grade. End users can enable 2FA and hide approximate location, and the legal surface includes separate buyer, seller, developer, and youth-safety policies. But the strongest external risk signals come from outside Whop’s own docs: a public status-history entry on Discord-role delays and Trustpilot complaints around phishing and merchant disputes indicate that abuse handling and entitlement edge cases are practical product risks today.'
  claimRefs:
  - CE019
  - CE020
  - CE021
  - CE022
  - CE023
