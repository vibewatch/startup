figures:
- id: FE001
  title: Whop product architecture map
  type: stack
  layout: wide
  summary: Layered view of Whop’s public stack from seller setup and buyer checkout through payouts, community delivery, and builder extensions.
  data:
    layers:
    - id: layer-setup
      label: Seller setup & discovery
      detail: Creator creates a whop, adds apps, and publishes discover/storefront surfaces.
      sublayers:
      - id: setup-whop
        label: Whop / storefront
        detail: Primary seller home base for products, memberships, and experiences
      - id: setup-discover
        label: Discover marketplace
        detail: Buyer acquisition surface that sits alongside creator-managed pages
    - id: layer-transaction
      label: Checkout & billing
      detail: Hosted and embeddable transaction layer that creates plans, payments, and memberships.
      sublayers:
      - id: txn-checkout
        label: Embedded checkout
        detail: React iframe component plus configuration object for plans, promos, redirects, and affiliate logic
      - id: txn-membership
        label: Payments + memberships
        detail: Payment-state objects feed the entitlement layer that creates and updates memberships
    - id: layer-community
      label: Community & content delivery
      detail: Post-purchase experiences delivered through apps, chat, forums, courses, Discord linking, and mobile access.
      sublayers:
      - id: community-chat
        label: Chat / forums
        detail: Experience-scoped chat and forum modules with paywall and reaction support
      - id: community-mobile
        label: Mobile access
        detail: Members access whops and content via iOS, Android, or mobile web
    - id: layer-money-out
      label: Payouts & merchant ops
      detail: Seller cash-out, team pay, payout methods, and sub-merchant onboarding remain inside Whop-managed flows.
      sublayers:
      - id: money-account-links
        label: Hosted account links
        detail: KYC and payouts dashboard links for sub-merchants
      - id: money-payout-elements
        label: Payout elements
        detail: Reusable UI element for adding payout methods and cash-out options
    - id: layer-builder
      label: Developer extension layer
      detail: Apps, app builds, SDKs, webhooks, repos, and builder support extend Whop without exposing core rails.
      sublayers:
      - id: builder-apps
        label: Apps + builds
        detail: Create app objects and promote builds into production
      - id: builder-sdks
        label: SDKs + repos
        detail: JavaScript, Python, and Go surfaces plus examples and Discord support
  approximationNotes: Architecture layers are inferred from public docs and product pages rather than a company-published system diagram.
