  evidenceGaps:
  - type: missing-source
    severity: material
    topic: security-disclosure
    missingEvidence: A trust pack covering security certifications, uptime SLA, incident-process detail, and moderation effectiveness metrics.
    whyItMatters: Enterprise underwriting needs proof that Whop’s growing surface area is supported by repeatable security and trust operations, not just user-facing controls.
    diligencePath: Request SOC 2 or equivalent reports, uptime commitments, abuse-resolution metrics, and trust-center artifacts from management.
    relatedQuestionRefs:
    - QE020
  - type: missing-source
    severity: material
    topic: app-governance
    missingEvidence: A description of app review, QA, rollout, rollback, and developer support SLAs for third-party apps.
    whyItMatters: The app platform can deepen ecosystem lock-in, but weak review and rollout controls can turn the same surface into a reliability and safety liability.
    diligencePath: Ask product and developer-platform leads for app approval policy, release controls, rollback process, and support-response targets.
    relatedQuestionRefs:
    - QE024
  - type: missing-source
    severity: material
    topic: infrastructure-disclosure
    missingEvidence: A deeper system architecture description covering hosting choices, data residency, identity model, and payment-processor dependencies.
    whyItMatters: Without underlying architecture detail, it is hard to judge scalability, vendor concentration, and the degree to which Whop’s rails are uniquely defensible.
    diligencePath: Request an engineering architecture review, vendor map, and dependency register for identity, payments, data storage, and community integrations.
    relatedQuestionRefs:
    - QE025
  - type: private-evidence-only
    severity: minor
    topic: module-usage-depth
    missingEvidence: Module-level attach rates, conversion data, and retention by surface such as chat, forums, courses, and marketplace discovery.
    whyItMatters: Feature breadth is visible publicly, but the investment case depends on how much of that surface is actually used and retained by sellers and buyers.
    diligencePath: Request cohort-level module adoption, GMV by module, and seller retention by product configuration.
    relatedQuestionRefs:
    - QE015
