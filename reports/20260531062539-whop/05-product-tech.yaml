- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Public role
  - Key public interface
  - External dependency
  - Key risk
  rows:
  - - Discovery / storefront
    - Top-of-funnel marketplace and whop landing surfaces
    - Homepage, marketplace solution pages, app-store descriptions
    - Buyer discovery, ranking, and merchandising systems remain hosted by Whop
    - Search quality and fraud-screening logic are not public
  - - Checkout / billing
    - Collect payment and configure plans from hosted or embedded surfaces
    - WhopCheckoutEmbed, checkout configuration API, payments API
    - Card and wallet rails sit behind Whop-managed flows
    - Seller depends on Whop-controlled checkout availability and payment-method support
  - - Membership / entitlement
    - Turn payments into active access relationships and renewal logic
    - Memberships API and mobile access flow
    - Shared identity and billing state live inside Whop
    - No public entitlement-latency or consistency guarantees
  - - Community / content
    - Deliver chat, forums, courses, Discord-linked access, and app experiences
    - Chat auth, chat element, forums API, mobile app
    - Community features are routed through Whop experiences and linked third-party endpoints
    - Moderation and abuse-handling metrics are undisclosed
  - - Payout / KYC
    - Onboard merchants, verify payout accounts, and move funds out to sellers or teams
    - Account links, payout account object, payout UI elements, payout setup docs
    - Whop-hosted payouts dashboard plus KYC onboarding flows
    - Reserve policy, exception handling, and compliance throughput are not public
  - - Developer extension layer
    - Let third parties create apps, publish builds, call APIs, and receive events
    - Create-app API, app-build promotion, SDKs, webhooks, GitHub repos
    - Builder success depends on Whop-managed release, auth, and event infrastructure
    - App review, release gating, and platform support commitments are not public
