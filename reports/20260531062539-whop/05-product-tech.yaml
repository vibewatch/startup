callouts:
- calloutType: strength
  title: Integrated creator stack is the clearest product strength
  body: Whop publicly shows a single stack that spans storefronts, checkout, memberships, community apps, payouts, and mobile access, which reduces tool stitching for sellers and keeps more of the workflow on Whop-managed rails.
  claimRefs:
  - CE001
  - CE007
  - CE010
  - CE021
  - CE035
- calloutType: risk
  title: Abuse handling and entitlement edge cases are the most visible product risks
  body: The public incident log and adverse reviews point to Discord-role delays, scams, merchant disputes, and refund friction rather than a lack of features, implying the sharpest product risk is marketplace quality and support execution.
  claimRefs:
  - CE029
  - CE030
  - CE040
- calloutType: insight
  title: Moat is breadth plus shared rails, not a disclosed hard-tech secret
  body: Whop’s public moat comes from bundling many creator-commerce primitives into one identity and money-movement layer; the same public docs also show that many individual modules are understandable and therefore vulnerable to commodity replication.
  claimRefs:
  - CE035
  - CE036
  - CE037
  - CE041
