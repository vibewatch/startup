- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Whop surface
  - Public benefit signal
  - Limitation / risk
  rows:
  - - Launch a creator business
    - Create a whop, add apps, configure each experience, then publish
    - Homepage + add-apps docs + create-app API
    - One control plane for products, memberships, and community modules
    - No public evidence on average setup time or module attach rates
  - - Take payments on owned traffic
    - Embed Whop checkout on the seller site and pass users through plan configuration
    - Checkout embed docs + checkout configuration API
    - Seller can keep traffic on its own site while using Whop rails
    - Checkout performance and conversion data are not public
  - - Turn purchases into ongoing access
    - Buyer completes checkout and Whop creates the membership record
    - Memberships guide + mobile access docs
    - Shared entitlement layer spans web, app, and community surfaces
    - No public SLA on entitlement propagation
  - - Pay sellers and teammates
    - Funds flow into payout balances, then out via payout methods or team-pay tools
    - Payout setup, account links, team pay, payout elements
    - Unified money movement across seller cash-out and internal team splits
    - Reserve policies, payout latency distributions, and chargeback economics are not public
  - - Extend the product
    - Builder creates an app, ships a build, promotes it, and gets support from docs and Discord
    - Create-app API + app-build promotion + app examples
    - Extension path is public and documented instead of closed or partner-only
    - QA, approval, and staged-rollout standards are not disclosed
  notes: Benefit signals are qualitative because the reviewed public sources did not publish workflow-level conversion or retention benchmarks.
