      - number: '1.2'
        title: Leadership visibility is high at the founder level and low at the governance level
        blocks:
          - type: paragraph
            body: >-
              Whop remains publicly legible as a founder story first and an institution second. CNBC, TechCrunch, Fast
              Company, and Forbes all center Steven Schwartz and Cameron Zoub’s teenage online-commerce history when
              explaining the company, and Wikipedia’s current company profile lists Schwartz as CEO, Zoub as CGO, and
              Sharkey as CTO. That is enough to establish functional founder coverage across product, growth, and
              engineering, but not enough to establish robust governance. On the company’s core official pages, the
              emphasis is on products, pricing, categories, and seller/buyer workflows rather than on board composition,
              governance committees, or succession planning. Publicly visible management detail does exist at the
              operating level—for example, Whop’s payments launch post quotes a head of partnerships and a head of
              crypto—but the absence of a fuller board or executive roster means outside investors still see the company
              primarily through the founders’ narrative. That creates a familiar trade-off: founder-market fit appears
              strong because the founding team grew out of the exact internet-merchant culture Whop serves, yet
              key-person dependence is correspondingly high because the public record does not show much institutional
              depth beyond those founders and a handful of function heads.
