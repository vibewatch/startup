      - number: '3.4'
        title: Switching costs, multi-homing and substitute bundles
        blocks:
          - type: paragraph
            body: >-
              The public evidence suggests that Whop's switching costs come more from workflow bundling than from an
              irreproducible single feature. A creator using Whop for paid access plus marketplace exposure plus payouts
              has to replace several functions at once. By contrast, a creator whose primary job is a simple digital
              download can move to Gumroad or Payhip with relatively modest workflow change, and a social creator
              selling from a bio link can plausibly choose Stan instead. Kajabi is a stronger switch destination for
              coaching or knowledge businesses that already own their audience and care about funnels, email and course
              delivery. Fourthwall is a stronger destination for merch-led brands that want manufacturing, shipping and
              customer support handled. Discord and Skool are powerful complements or substitutes when community is the
              product, but they require more stitching if the creator also needs a serious checkout or payout stack.


              That multi-homing logic cuts both ways for Whop. It broadens the addressable job the company can win, but
              it also means Whop is often evaluated against bundles instead of single vendors: Shopify plus a paid
              community tool, Discord plus Stripe, or Lemon Squeezy plus an external membership surface. The company's
              public 22M+ MAU and marketplace framing imply a discovery flywheel, but the retained evidence does not
              disclose how much creator demand actually comes from Whop-managed traffic. Until that mix is clearer, the
              most defensible conclusion is that Whop lowers tool sprawl for multi-product creators, while simpler or
              more specialized substitutes remain credible for narrower use cases.
