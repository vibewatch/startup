      - number: '2.3'
        title: Buyer segments, users, and budget owners
        blocks:
          - type: paragraph
            body: >-
              The supply-side buyer is usually the creator-operator: a solo creator, educator, software publisher, or
              small team that wants to monetize directly rather than wait for sponsorships or platform ad revenue. On
              the demand side, the end user is the member, subscriber, or customer buying access to a community, course,
              signal, template, or piece of software. In some cases the buyer and payer are the same person; in others,
              a creator team or operator buys the tooling while end members fund the business through recurring
              subscriptions or one-off purchases.


              That split matters because Whop is selling infrastructure to sellers, while those sellers are monetizing
              fans or business users downstream. Membership-led businesses appear especially aligned with the platform:
              Circle says 88% of community builders now monetize through paid memberships, and 67% of members still
              discover communities via social platforms, which means creators need both conversion tooling and
              off-platform distribution. Courses, coaching, and software-like access products fit the same commerce
              stack because they all require entitlements, payments, refunds, and delivery. The budget owner is
              therefore usually a creator business on the supply side, but the ultimate revenue payer is the recurring
              member or customer on the demand side.
            claimRefs:
