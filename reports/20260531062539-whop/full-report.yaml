      - number: '6.5'
        title: Expansion loops, complaints, and concentration risks
        blocks:
          - type: paragraph
            body: >
              Whop does have credible expansion mechanisms. The platform combines payments, payouts, wallets, chat, and
              app integrations; it supports more than 100 payment methods; it exposes a developer app ecosystem; and it
              runs Content Rewards plus built-in affiliate workflows that can push creators toward adjacent products,
              more buyers, and more repeat community activity. Those loops help explain why Whop can sustain marketplace
              breadth. But the downside is just as visible. Revenue generation is highly concentrated, with only 11% of
              tracked products monetizing at all and roughly 0.5% clearing $10K/month. The highest-profile categories
              are also the riskiest from a trust perspective: clipping, trading, sports betting, high-ticket coaching,
              and business-opportunity products dominate top-performer lists. Independent review sources repeat the same
              adverse themes—refund friction, payout delays, spam, scam exposure, and uneven support quality—suggesting
              the trust burden lands on both sellers and buyers. Concentration therefore exists on two axes: economic
              concentration in a small minority of products and reputational concentration in categories that can
              attract chargebacks, low- quality offers, or policy scrutiny. For diligence, the key missing datasets are
              seller cohort churn, top-seller GMV share, dispute rates, and a clean current view of the fee stack that
              buyers and sellers actually face in Discover.
