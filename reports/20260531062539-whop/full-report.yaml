  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product surface, and founding story
        blocks:
          - type: paragraph
            body: >-
              Whop’s public footprint is now wider than a simple creator storefront tool. Official buyer-facing and
              seller-facing pages describe it as a social-commerce and internet-business platform where people can
              discover and buy access to digital communities, courses, tools, coaching, software, and other online
              products. The company’s own terminology matters: each seller builds a "whop" that can bundle chat, forums,
              live coaching, checkout, and analytics into a single destination, while the broader network page positions
              Whop as both a marketplace and a payments-and-distribution layer for businesses. That framing is
              consistent with third-party reporting that has followed the company since its 2023 Series A raise.
              TechCrunch and CNBC both anchor the founding story in Steven Schwartz and Cameron Zoub’s early sneaker-bot
              businesses, with Jack Sharkey joining the core founding team that launched Whop in March 2021. Public
              business-profile sources place the company in Brooklyn, New York. The identity chapter point is therefore
              not just that Whop sells digital goods; it is that the company has been steadily re-cast as infrastructure
              for internet-native businesses, and later chapters should treat the storefront, marketplace, and payment
              rails as one interconnected product system rather than separate bets.
