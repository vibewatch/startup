              Checkout is not only hosted but embeddable via a React component that mounts an iframe on the seller’s own
              site, and the configuration object exposes plan pricing, redirects, affiliate codes, and payment-method
              controls. Behind that, Whop documents payment state objects, membership issuance, payout setup, team
