      - - Stan only
        - Traffic comes from social profiles
        - Simple storefront, bookings, subscriptions and community
        - Marketplace discovery, advanced payout breadth and broader seller ops
        - Strong low-friction alternative for Instagram/TikTok sellers
      - - Shopify + apps
        - Commerce infrastructure matters more than gated community
        - Storefront, checkout, link-in-bio selling and digital products
        - Native creator community workflows and marketplace-discovery layer
        - Incumbent stack for brands or merchants that outgrow creator-native tools
      - - Lemon Squeezy + external community
        - Software or SaaS monetization is the core job
        - Subscriptions, customer portal, tax handling and licensing
        - Community, discovery and creator-native front-end surfaces
        - Most direct substitute when Whop is being evaluated as payment/billing infra
      - - Fourthwall only
        - Merch and fan-brand commerce dominate the revenue mix
        - Storefront, memberships, social merch shelf and support for physical goods
        - Payment/payout breadth and non-merch creator tooling depth
        - Creator brands can rationally choose a merch-native stack over Whop
