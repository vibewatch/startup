      - number: '2.2'
        title: TAM, SAM, and SOM framing
        blocks:
          - type: paragraph
            body: >-
              Headline market studies support a large and still-expanding top of funnel, but they disagree on what
              counts as the market. Research and Markets says the creator economy grows from $255.66 billion in 2025 to
              $323.48 billion in 2026, while The Business Research Company places the narrower content creator economy
              at $205.81 billion in 2026. Goldman Sachs remains directionally bullish, arguing the category could expand
              from about $250 billion in 2023 to $480 billion by 2027, driven by influencer marketing and platform
              payouts.


              For Whop, those top-down numbers are only the broad TAM. The more relevant SAM is the subset of creators
              who are actually selling owned digital experiences and who need integrated commerce rails rather than
              audience reach alone. Circle’s 2026 monetization mix and MBO’s creator-supply data suggest this SAM
              centers on membership-led businesses, courses, services, software access, and digital goods sold by
              creators operating like micro-SMBs. Public evidence is good enough to say the SAM is meaningfully smaller
              than the broad creator-economy TAM but still expanding. Public evidence is not good enough to pin down a
              hard SOM: the reviewed Whop materials do not disclose GMV, active seller count, refund rates, or mobile
              checkout mix, so any precise share-of-market number would be more theater than diligence.
            claimRefs:
              - CM006
              - CM007
              - CM009
              - CM010
              - CM011
              - CM012
