  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Public Monetization Stack
        blocks:
          - type: paragraph
            body: >-
              Whop's public materials show a hybrid revenue model rather than a pure SaaS subscription business. The
              terms say merchants can sell on the Whop marketplace or use embedded Whop Payments on their own sites and
              social channels, while the docs position the company as infrastructure for payments, payouts, wallets,
              chat, and app distribution. Official pricing is transparent at the processor layer: domestic cards are
              listed at 2.7% plus $0.30, with additional official surcharges for international cards, FX, financing, and
              ACH. What is not transparent is realized take rate by channel. Third-party 2026 pricing explainers
              consistently argue that creators often pay meaningfully more than the headline card rate once
              automation/platform, payout, fraud, tax-handling, or financing layers are added. That distinction matters
              because the quality of Whop's revenue depends on mix: off-platform checkout volume looks like payments
              revenue, while marketplace-discovered, automated, financed, or cross-border transactions should monetize
              at higher effective rates. The result is a business that appears to monetize at several layers of the
              transaction stack, but still does not disclose which layers drive most reported revenue.
