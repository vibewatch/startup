      - number: '3.3'
        title: Capabilities, distribution, trust and policy posture
        blocks:
          - type: paragraph
            body: >-
              Capability comparison shows why Whop competes across categories instead of just against other storefronts.
              Whop bundles marketplace listing, payments and cross-border payouts. Patreon is stronger on native
              membership community features and better documented around fraud handling and multi-currency payouts, but
              it is still centered on fan subscriptions rather than broader creator commerce. Kajabi is the strongest
              owned-audience suite because it combines courses, communities, funnels, email and AI, yet it offers no
              obvious marketplace discovery layer in the retained public evidence. Stan is optimized for social
              conversion from a bio link, while Gumroad and Payhip remain simpler hosted storefronts with lighter
              community or payout depth. Fourthwall stands out for creator brands selling merch and members-only digital
              products through social shopping surfaces.


              Trust and policy posture also matter. Patreon's Trustpilot snapshot is an adverse service-quality signal
              around subscriptions, payments and support. Discord's monetization docs show the opposite kind of
              weakness: not support complaints but explicit operating constraints, including US-only onboarding, a
              separate Stripe account and policy exclusions for telehealth, political activity and gambling-adjacent
              uses. Lemon Squeezy and Shopify are not community products, but they remain dangerous because they attack
              the buyer problem from the other direction: deeper billing or commerce infrastructure. That leaves Whop
              strongest where a seller wants both community-adjacent monetization and serious payment operations in one
              place, and weaker where the buyer mostly wants either owned-audience marketing software or pure
              compliance-heavy billing.
