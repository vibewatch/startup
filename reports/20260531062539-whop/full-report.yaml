  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >-
      IC-ready scoring across the most decision-relevant dimensions for a late-stage private creator-commerce
      investment.
    data:
      items:
        - label: Demand / distribution proof
          value: 8
          note: Very strong user and business reach, even if metric definitions need reconciliation.
        - label: Monetization depth
          value: 7
          note: Fee stack is broad, but product-level revenue mix remains unaudited.
        - label: Payments infrastructure edge
          value: 7
          note: Global payout coverage and routing are strategically important if they prove measurable authorization lift.
        - label: Financial transparency
          value: 3
          note: Headline metrics exist, but audited statements and cap-table terms are missing.
        - label: Category quality / trust
          value: 4
          note: Trustpilot and third-party coverage keep moderation and dispute risk front of mind.
        - label: Strategic upside
          value: 7
          note: Tether and cross-border payouts create real optionality if they deepen monetization.
        - label: Valuation attractiveness
          value: 4
          note: Current price looks rich versus most public comps and only works cleanly in a near-bull execution path.
    approximationNotes: >-
      Scores are qualitative 1-10 judgments derived from public evidence as of 2026-05-31. They summarize, rather than
      replace, the detailed written thesis.
    claimRefs:
      - CV032
      - CV041
      - CV047
