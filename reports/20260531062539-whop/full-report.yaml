        title: Financial Verdict and Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              The investable part of the Whop story is clear: public evidence supports real scale, a multi-layer
              monetization stack, and a business that is moving beyond marketplace take into broader payments and payout
              infrastructure. The non-investable part is just as clear: margin path, cash burn, retention quality, and
              channel mix remain largely private. Adverse evidence matters here. Review sources cite payout complaints
              and moderation concerns, and independent analyses highlight Whop's exposure to clipping, betting-adjacent,
              and other grey-market categories. Those categories may monetize well in the short term, but they can
              increase compliance cost, reputational risk, and volatility in loss rates. My financial read is therefore
              constructive on topline monetization and cautious on revenue quality. Underwriting should treat Whop as a
              fast-growing marketplace-plus-payments platform with credible monetization levers, but require hard data
              on gross margin, refunds/chargebacks, cohort retention, and unrestricted cash before assuming durable
              profitability or a clean runway.
