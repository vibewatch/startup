        - 20% - 25%
      - - Base
        - Revenue audits at ~$120M-$150M, seller growth remains healthy, and market awards a blended 7x-8.5x multiple.
        - $120M - $150M
        - $0.9B - $1.3B
        - This case still assumes solid execution but not best-in-class disclosure or margins.
        - 45% - 50%
      - - Bear
        - >-
          Revenue settles at ~$80M-$100M, take rate compresses, and moderation / payout issues push the market toward
          marketplace multiples.
        - $80M - $100M
        - $0.3B - $0.6B
        - Cap-table seniority could make common-equity downside worse than the headline range.
        - 25% - 35%
    notes: >-
      Scenario probabilities are qualitative signals, not forecasting precision. Ranges are analyst estimates built from
      current public comps and Whop-specific uncertainty.
