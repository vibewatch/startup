          sublayers:
            - id: setup-whop
              label: Whop / storefront
              detail: Primary seller home base for products, memberships, and experiences
            - id: setup-discover
              label: Discover marketplace
              detail: Buyer acquisition surface that sits alongside creator-managed pages
        - id: layer-transaction
          label: Checkout & billing
          detail: Hosted and embeddable transaction layer that creates plans, payments, and memberships.
          sublayers:
            - id: txn-checkout
              label: Embedded checkout
              detail: React iframe component plus configuration object for plans, promos, redirects, and affiliate logic
            - id: txn-membership
              label: Payments + memberships
              detail: Payment-state objects feed the entitlement layer that creates and updates memberships
        - id: layer-community
          label: Community & content delivery
          detail: Post-purchase experiences delivered through apps, chat, forums, courses, Discord linking, and mobile access.
          sublayers:
            - id: community-chat
              label: Chat / forums
              detail: Experience-scoped chat and forum modules with paywall and reaction support
            - id: community-mobile
              label: Mobile access
              detail: Members access whops and content via iOS, Android, or mobile web
        - id: layer-money-out
          label: Payouts & merchant ops
          detail: Seller cash-out, team pay, payout methods, and sub-merchant onboarding remain inside Whop-managed flows.
          sublayers:
            - id: money-account-links
              label: Hosted account links
              detail: KYC and payouts dashboard links for sub-merchants
            - id: money-payout-elements
              label: Payout elements
              detail: Reusable UI element for adding payout methods and cash-out options
        - id: layer-builder
          label: Developer extension layer
          detail: Apps, app builds, SDKs, webhooks, repos, and builder support extend Whop without exposing core rails.
          sublayers:
            - id: builder-apps
              label: Apps + builds
              detail: Create app objects and promote builds into production
            - id: builder-sdks
              label: SDKs + repos
              detail: JavaScript, Python, and Go surfaces plus examples and Discord support
    approximationNotes: >-
      Architecture layers are inferred from public docs and product pages rather than a company-published system
      diagram.
    claimRefs:
      - CE007
      - CE014
      - CE020
      - CE035
      - CE037
      - CE042
  - id: FE002
    title: Seller-to-buyer workflow / operating flow
    type: flow
    layout: wide
    summary: >-
      Publicly documented flow from creating a whop and adding apps through checkout, membership issuance, community
      access, and payout operations.
    data:
      nodes:
        - id: n1
          label: Create a whop
          detail: Seller stands up the core business surface and chooses the public storefront context
        - id: n2
          label: Add apps & configure plans
          detail: Seller adds apps such as chat or courses and configures plans, promos, and checkout behavior
        - id: n3
          label: Publish to storefront / discover
          detail: Buyer can arrive from the seller site or Whop’s marketplace discovery surface
        - id: n4
          label: Embedded or hosted checkout
          detail: Buyer completes payment through Whop-managed checkout rails
        - id: n5
          label: Membership issued
          detail: Checkout creates the active membership and billing relationship
        - id: n6
          label: Mobile + community access
          detail: Buyer opens chats, forums, courses, Discord links, and other app content
        - id: n7
          label: Seller payouts & team ops
          detail: Seller manages payouts, team payments, and payout methods after funds settle
      edges:
        - from: n1
          to: n2
          label: Business configured
        - from: n2
          to: n3
          label: Offer is live
        - from: n3
          to: n4
          label: Buyer starts purchase
        - from: n4
          to: n5
          label: Payment captured
        - from: n5
          to: n6
          label: Access granted
        - from: n5
          to: n7
          label: Funds accrue
    approximationNotes: null
    claimRefs:
