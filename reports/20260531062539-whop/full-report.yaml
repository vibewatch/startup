    rows:
      - - Whop
        - 2.7%+$0.30 domestic cards
        - +1.5% international cards; 1.5% ACH max $5; add-on orchestration and tax fees
        - 241+ territories; multiple payout methods; limited MoR scope
        - Attractive on raw processing vs Patreon/Gumroad, but not a full MoR substitute
