  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Whop is best understood as creator-commerce infrastructure rather than as a generic social network or a
              pure digital-download storefront. Its seller terms and documentation show two distribution modes:
              merchants can sell on the Whop marketplace itself, or they can use embedded Whop checkout and payment
              tools on their own websites and social profiles. That puts the company in the workflow where creators
              convert attention into recurring memberships, gated communities, courses, software access, alerts,
              templates, and other digital experiences.


              The right market boundary therefore includes paid communities, creator subscriptions, courses and
              coaching, software-like memberships, and other direct digital-product monetization flows where checkout,
              entitlement management, payouts, and compliance matter. It excludes ad-only influencer monetization,
              talent-management agencies, and general-purpose social reach that never converts into owned commerce.
              Status-quo substitutes are not one platform but a stack: Patreon, YouTube memberships, Discord server
              subscriptions, Substack, Circle, Mighty Networks, Gumroad, Kajabi, Teachable, Podia, or a direct
              Stripe-led DIY stack. That breadth matters because Whop competes for the job of turning audience trust
              into direct revenue, not for every dollar inside the much larger influencer-ad market.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM013
              - CM036
              - CM037
