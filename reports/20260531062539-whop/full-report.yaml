      - number: '6.4'
        title: Retention, satisfaction, and durability proxies
        blocks:
          - type: paragraph
            body: >
              Whop provides much better public evidence of customer acquisition than of customer retention. There is no
              retained source that discloses platform-wide churn, NRR, GRR, renewal rates, or seller cohort curves. The
              best durability proxies are therefore indirect: storefront member counts and ratings, mobile app review
              depth, community-oriented product architecture, and the existence of subscriptions, paid groups, and
              ongoing course access. Official blogs and review coverage show that recurring memberships and subscription
              products are core parts of the platform design, which should improve repeat usage once a seller has
              acquired a paying base. On the positive side, the iOS app carries 51K ratings at 4.8/5, and first-party
              community hubs such as Content Rewards show 164.4K members with 1,131 ratings. On the negative side, the
              independent review stack is materially weaker than the app-store signal: Trustpilot's snapshot sits at
              3.6/5 from 1,251 reviews, while JustUseApp flags the app as generally safe but worth caution. The
              practical takeaway is that Whop likely retains engaged communities once they form, but the platform has
              not supplied enough public cohort data to separate true product retention from marketplace churn masked by
              constant new seller and buyer inflow.
