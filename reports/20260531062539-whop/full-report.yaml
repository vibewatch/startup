  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The current mark requires Whop to clear a premium-infrastructure quality bar while still carrying private-market
      opacity.
    data:
      nodes:
        - id: scale
          label: |-
            Scale proof
            18.4M+ users / 22M+ MAU
            27k+ businesses
          type: strength
        - id: payments
          label: |-
            Payments stack
            100+ methods
            241 territories
          type: strength
        - id: premium-price
          label: |-
            Current price
            $1.6B = ~11.3x est. revenue
          type: risk
        - id: opacity
          label: |-
            Opacity
            No audited revenue or cap-table terms
          type: risk
        - id: quality
          label: |-
            Trust / category risk
            Scams, disputes, betting / trading mix
          type: risk
        - id: public-bar
          label: |-
            Public bar
            Above Etsy / Fiverr / Wix
            Near Shopify
          type: neutral
        - id: recommendation
          label: |-
            Recommendation
            TRACK
            Valuation stance: stretched
          type: conclusion
    approximationNotes: >-
      This is a qualitative decision flow, not a weighted scoring model. Node placement reflects the underwriting logic
      implied by the evidence base.
    claimRefs:
