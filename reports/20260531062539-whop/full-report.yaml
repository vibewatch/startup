  - id: TR001
    title: Regulatory / legal risk register
    columns:
      - Risk
      - Public evidence
      - Why Whop is exposed
      - Mitigation signals
      - Residual exposure
    rows:
      - - Trading-signal / investment-advice perimeter risk
        - >-
          Discover pages openly list trading, forex, options, and crypto categories; policy bans unregistered financial
          services but allows some educational financial content.
        - >-
          Paid communities can drift from education into actionable advice or solicitation even if listing text avoids
          that framing.
        - Seller compliance obligations, deceptive-claims ban, payout holds, and category-offboarding rights.
        - high
      - - Sports-betting picks / gambling-adjacent risk
        - >-
          Whop discovery includes a sports-betting-and-gambling category, while policy bans illegal gambling operations
          but allows picks or advisory content.
        - Advisory-style betting communities can still attract consumer-protection and payment-partner scrutiny.
        - Restricted products policy, minors restrictions, and enforcement powers.
        - high
      - - Deceptive earnings / business-opportunity marketing
        - >-
          Community Guidelines ban deceptive earnings claims; Earnings Terms require FTC-style disclosures; FTC Business
          Opportunity Rule remains active.
        - >-
          Affiliate, bounty, and content-reward mechanics can amplify unrealistic income narratives around make-money
          products.
        - Mandatory disclosure language, seller liability, and suspension or clawback rights.
        - high
      - - Retail-investor communication scrutiny
        - >-
          FINRA Rule 2210 governs retail communications and Investor.gov warns against social-media stock-tip scams in
          2026.
        - >-
          If marketplace offers resemble recommendations or testimonials to retail users, communications risk rises even
          if Whop is not itself a broker-dealer.
        - Policies against misleading promotions and platform discretion to remove offers.
        - medium-high
      - - Minor safety / age-gating failure
        - Youth Safety Policy blocks minors from betting-related groups and says DOB collection will soon be required.
        - The policy itself implies implementation and enforcement work is ongoing, not fully proven in public metrics.
        - Age flags, parental consent, guardian KYC, and trust-safety escalation.
        - medium-high
      - - IP / content-rights disputes
        - >-
          Marketplace digital products and creator communities create recurrent copyright and takedown exposure even
          when terms prohibit infringement.
        - >-
          Low-friction digital distribution makes it easy for infringing content to appear before formal takedowns
          occur.
        - Terms ban infringement; Whop can remove content and suspend accounts.
        - medium
    notes: >-
      Residual exposure is qualitative and reflects public evidence only. The register is partial because public
      filings, subpoena logs, or outside-counsel memos are not available.
    enumerationScope:
