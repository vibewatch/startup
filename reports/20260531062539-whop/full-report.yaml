      - number: '8.2'
        title: Public-market and transaction comp lenses
        blocks:
          - type: paragraph
            body: >-
              The public-market lens argues for caution. The most relevant public peers are not identical, but Etsy,
              Fiverr, Wix, and Shopify bracket the creator-commerce / commerce-infrastructure / SaaS-marketplace
              universe better than a generic fintech basket would. As of May 2026, Etsy trades around 2.21x sales,
              Fiverr around 0.95x, and Wix around 1.21x, while Shopify commands a much richer 12.4x multiple. Whop's
              implied ~11.3x multiple therefore sits close to Shopify rather than close to the marketplace cohort. That
              is only defensible if Whop is becoming a premium infrastructure company with higher-quality monetization,
              broader merchant diversification, and stronger retention economics than current public disclosures can
              prove.


              The transaction lens is more forgiving, but mostly because private creator-platform rounds were priced
              aggressively during the 2021-2022 cycle. Patreon reached $4 billion, Kajabi crossed $2 billion, and
              Linktree hit $1.3 billion, all on creator-economy narratives that public markets would not currently pay
              for without audited numbers and category leadership. Against that backdrop, Whop's $1.6 billion last round
              is not peak-cycle absurd. But it still looks like a premium clearing price rather than a bargain, because
              the company is asking investors to pay close to Shopify-like software multiples while carrying
              creator-marketplace moderation risk, crypto adjacency, and disclosure quality that remain much closer to a
              late-stage private marketplace than to a mature public infrastructure platform.
            claimRefs:
