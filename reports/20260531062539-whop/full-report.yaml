      - number: '7.2'
        title: Regulatory, legal, and policy-borderline exposure
        blocks:
          - type: paragraph
            body: >-
              The sharpest legal and compliance risk is not that Whop openly markets prohibited financial products; it
              is that Whop openly markets categories such as forex, options, crypto, and sports betting while its own
              policy framework leaves room for educational or advisory products at the boundary of those regulated
              activities. The Prohibited Products policy bans unregistered financial services, direct digital-asset
              sales, and illegal gambling operations, but it expressly allows educational crypto content and gambling
              picks or analysis so long as the transaction is framed as information rather than the direct sale of a
              regulated instrument. That carve-out matters because Whop also pays affiliates and bounty participants to
              promote products, and the FTC, FINRA, SEC, and CFTC all continue to warn that digital promotions,
              endorsements, work-at-home offers, and stock-tip content can trigger consumer-protection or securities
              issues. Whop has meaningful mitigation language: deceptive earnings claims are banned, affiliates must
              disclose compensation, sellers must comply with law, and Whop can suspend accounts or withhold funds. But
              policy text is not the same as proven enforcement quality. Without category-level GMV mix, enforcement
              statistics, or outside-counsel comfort letters, investors should assume the residual risk is high whenever
              the marketplace leans too hard into trading-signal, get-rich-quick, or gambling-adjacent communities.
