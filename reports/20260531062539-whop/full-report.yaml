      - number: '7.4'
        title: Operational concentration, dependency risk, and thesis-breakers
        blocks:
          - type: paragraph
            body: >-
              Operationally, Whop is more concentrated than a simple marketplace label implies. Terms and solution pages
              show dependence on bank partners, PSPs, payout rails, tax and KYC workflows, alternative payment methods,
              BNPL providers, and seller performance. The company markets this complexity as a product advantage,
              promising global payouts, automated tax handling, payment orchestration, and fewer failed payments; that
              also means a processor downgrade, reserve hike, or category offboarding could propagate quickly into
              seller liquidity, churn, and brand damage. The company also claims scale of 27,000-plus businesses, which
              increases the importance of trust-safety staffing, quality control, and consistent enforcement even if
              seller economics remain decentralized. Publicly, the right investor posture is therefore operationally
              skeptical but not automatically bearish. Whop has clear mitigations: policy rights, dispute tooling,
              global payment infrastructure, and a willingness to withhold funds or offboard categories. But the
              thesis-break triggers are straightforward. If processor relationships tighten, complaints rise,
              risky-category mix grows, or minors and promotional disclosures generate incidents, the risk profile can
              re-rate quickly. Until Whop discloses dispute rates, sensitive-category exposure, moderation capacity, and
              seller concentration, the operational concentration risk should be treated as material rather than
              theoretical.
