  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk overview and ranking
        blocks:
          - type: paragraph
            body: >-
              Whop's risk stack is not dominated by a single existential legal issue; it is dominated by a
              control-system problem that sits at the intersection of payments, promotion, and marketplace quality.
              Public materials show a platform that combines marketplace discovery, off-platform payments, global
              payouts, financing options, and a large long-tail seller base. That architecture can scale quickly, but it
              also creates multiple failure paths: a weak creator or misleading offer can become a buyer complaint;
              complaints can become refunds, chargebacks, reserve hikes, or processor scrutiny; and those frictions can
              slow payouts or damage buyer trust even if Whop contractually pushes primary liability back to the seller.
              The heatmap ranks payments and regulatory-borderline category exposure as the most severe risks because
              those risks can hit revenue, seller liquidity, and reputation at the same time. Creator-quality
              deterioration and fake-review dynamics are the next tier because they can quietly compound until they
              surface as complaint volume, poor retention, or regulator attention. The common theme is that Whop's
              mitigations are policy-heavy and process-heavy, but public evidence of operating metrics behind those
              controls remains thin.
