            body: >
              Whop's strongest customer evidence is not a generic logo wall; it is the presence of live, reviewable
              storefronts with member counts, ratings, pricing, and explicit use cases. Call Her Closed is a high-ticket
              sales-training offer for women priced at $7,800, with 111 members and 44 ratings at a 5.0 average. Brez
              Clips is a free clipping community with 46.8K members and 713 ratings at 4.7, showing how Whop can support
              top-of-funnel creator labor markets, not just paid subscriptions. Committed Coaches is a nutrition
              coaching business that WhopTrends identifies with 13,809 members, a $4,995 one-time price, and a 3.8
              rating; the same product is called out by RockWater as the platform's largest single product at an
              estimated $4.9M per month. These named examples map to three different customer jobs: premium skills
              training, clipping/content production, and high-ticket coaching. The buyer persona mix therefore spans
              aspiring sellers trying to learn or earn, consumers purchasing transformation or business outcomes, and
              members joining persistent communities rather than buying one-off files. The app layer further reinforces
              that customer proof is operational, not theoretical: Apple's listing shows a 4.8/5 rating from 51K
