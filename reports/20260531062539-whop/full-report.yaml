      - number: '6.2'
        title: Adoption trajectory, density, and marketplace shape
        blocks:
          - type: paragraph
            body: >
              Public third-party metrics show that Whop has reached meaningful scale, but the marketplace is far denser
              than its marketing copy alone implies. Sacra and RockWater converge on 18.4M+ users, roughly 183K sellers,
              $2.67B in lifetime GMV by February 2026, and annual creator payouts around $3B. RockWater adds that 143K+
              products launched during 2025, 110K+ new creators joined in the same period, and the company had already
              added 297 apps to its developer app store plus 780+ live Content Rewards campaigns. WhopTrends broadens
              the picture by showing just how crowded the supply side has become: it tracks roughly 195,236 products and
              finds that only 21,805 generate any revenue at all, with 3,964 above $1K/month and only 961 above
              $10K/month. That distribution matters more than topline user growth, because it shows a marketplace where
              buyer demand is real but monetization success is concentrated. Category data suggests the densest and
              highest-earning segments are not generic creator tools; they are high-ticket coaching, clipping, trading,
              sports betting, ecommerce, and business-opportunity products. In practical terms, Whop already has
              marketplace density, but not evenly distributed demand across seller cohorts.
