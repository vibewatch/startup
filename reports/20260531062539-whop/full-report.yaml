companyProfile:
  summary: >-
    Whop is a private creator-commerce platform founded in 2021 by Steven Schwartz, Cameron Zoub, and Jack Sharkey. The
    company started as a marketplace for digital communities and internet products, then expanded into a broader
    merchant-of-record and payments stack that now supports communities, courses, software, coaching, and payouts.
    Public sources place the company in Brooklyn, New York and show a rapid funding path from a $17M Series A in 2023 to
    a Tether-led $200M strategic round in February 2026 at about a $1.6B valuation. Whop's scale indicators are strong,
    but governance depth, audited financial performance, and capital-stack detail remain limited in the public record.
