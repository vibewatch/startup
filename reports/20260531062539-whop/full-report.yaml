        - 10%+$0.50 direct sales
        - 30% via Discover marketplace
        - Acts as merchant of record for global tax obligations; direct deposit or PayPal payouts vary by country
        - Easy starter economics vs monthly SaaS tools, but materially more expensive than Whop on direct sales
      - - Patreon
        - 10% standard plan for new creators
        - Legacy 5% / 8% / 11% plans persist under conditions; extra processing, payout and FX fees apply
        - Patreon handles chargebacks, fraud, taxes and 16+ currencies
        - Community-native but costly once the full fee stack is included
      - - Kajabi
        - $89 to $499 monthly plan points
        - Annual discounts shown on pricing page
        - No revenue sharing highlighted; processing fees still apply
        - Strong owned-audience software, but highest fixed-cost hurdle before revenue
      - - Stan
        - $29 Creator / $99 Creator Pro
        - Zero platform transaction fees on official pricing blog
        - Processing fees still apply; no free plan per review
        - Efficient for social sellers after revenue starts, but upfront commitment reduces beginner appeal
      - - Skool
        - $9 Hobby / $99 Pro
        - 10% Hobby fee; 2.9% visible on Pro page but not fully explained in retained capture
        - Public payout/tax posture not cleanly disclosed here
        - Relevant paid-community substitute, but economics remain partially unresolved
      - - Fourthwall
        - Free forever or Pro $19 monthly / $15 yearly
        - 5% fee on digital products in free tier; Pro removes digital-product fees
        - Customer support handled for catalog products; MoR support referenced in secondary review
        - Merch-first economics are compelling for brand creators, less so for digital-only Whop sellers
      - - Discord
        - 90/10 creator split on server subscriptions
        - Other fee leakage flows through Stripe and policy constraints
        - US-only onboarding; separate Stripe account required
        - Strong community monetization, but poor fit as a primary seller operating system
      - - Shopify
        - Starter plan optimized for social selling; promotional free-to-$1 trial messaging visible
        - Digital products can be sold without extra digital-goods fees
        - Broad commerce tooling rather than creator-specific payout stack
        - Powerful general-commerce substitute, but not the clearest fee-for-fee Whop comparison
      - - Lemon Squeezy
        - 5%+50¢ per transaction
        - No monthly ecommerce fee in retained pricing capture
        - Merchant of Record with global sales tax and compliance handling
        - Most dangerous compliance-led substitute to Whop in software-heavy segments
      - - Payhip
        - Official page emphasizes free plan and no feature gating
        - Processor fees still apply; third-party review reports 5% entry fee
        - Immediate payouts and EU VAT/UK handling are official; seller-of-record posture is still partly unresolved
        - Low-end starter substitute, but current public price capture is thinner than Whop or Gumroad
    notes: >-
      List prices and take rates are public 2026 disclosures from retained sources. Payment-processor fees, taxes or
      hidden policy costs can still widen all-in economics versus the headline price.
