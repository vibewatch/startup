  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Category positioning and landscape structure
        blocks:
          - type: paragraph
            body: >-
              Whop is not competing in one neat SaaS box. The retained evidence points to a creator-commerce operating
              system that combines marketplace distribution, checkout, payouts and paid-access workflows, while most
              alternatives specialize in only one layer of the job. Gumroad, Stan and Payhip are simpler storefront or
              link-in-bio tools for digital products. Patreon, Skool and Discord monetize paid communities more directly
              than they manage full seller operations. Kajabi is a higher-priced owned-audience suite for courses,
              coaching and funnels. Fourthwall is a merch and membership stack. Shopify and Lemon Squeezy are
              commerce-infrastructure substitutes for sellers who care more about checkout, subscriptions and compliance
              than about discovery or gated communities.


              That structure matters because Whop's strongest public wedge is not pure price leadership. Whop charges
              usage-based payments fees, but it also markets 22M+ MAU, 27,000+ businesses and integrated payouts across
              241+ territories. In other words, the company is selling bundled reach and operating leverage, not just a
              checkout widget. That puts it in direct competition with stitched-together creator stacks: Patreon or
              Discord for community, Shopify or Lemon Squeezy for billing, and Kajabi for owned-audience education. The
              practical question for buyers is which layer they value most, because few rivals match Whop across
              discovery, commerce and payouts simultaneously.
