  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base segmentation and personas
        blocks:
          - type: paragraph
            body: >
              Whop's customer base is explicitly two-sided. The company positions itself as infrastructure for sellers
              who want to build internet businesses and for buyers who want to purchase access, content, tools, and
              communities. Official surfaces consistently describe seller use cases as coaching and courses, paid
              groups, services, software, physical products, marketplaces, and telehealth; blog and review sources add
              recurring subscriptions, downloads, templates, Discord access, ebooks, and software subscriptions. That
              breadth creates at least three clear seller clusters. First are knowledge/education sellers offering
              coaching, courses, and premium communities. Second are performance or opportunity sellers concentrated in
              clipping, trading, sports betting, reselling, and business-strategy niches. Third are software and
              automation sellers using Whop as a payments-plus-access-control layer. On the buyer side, recurring
              personas include entrepreneurs buying business education, traders and bettors buying signals or
              communities, creators joining clipping or affiliate ecosystems, and members paying for software or ongoing
              communities rather than one-off downloads. The mobile app copy reinforces that Whop expects repeat
              community and product access after first purchase, because it frames the product as an all-in-one place to
              build, sell, and manage communities rather than a simple checkout widget.
