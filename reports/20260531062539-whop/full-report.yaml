      - CE007
      - CE009
      - CE010
      - CE021
      - CE024
  - id: FE003
    title: Critical dependency map
    type: dag
    layout: wide
    summary: >-
      Dependency graph of the public Whop workflow showing where hosted Whop rails mediate discovery, checkout,
      entitlements, community access, and seller cash-out.
    data:
      nodes:
        - id: d-seller-site
          label: Seller site / whop
          detail: Seller-controlled entry point or branded whop page
        - id: d-discover
          label: Discover / marketplace
          detail: Whop-managed buyer acquisition surface
        - id: d-checkout
          label: Whop checkout rails
          detail: Hosted or embedded checkout configuration and payment capture
        - id: d-membership
          label: Membership & identity layer
          detail: Entitlement object created after successful checkout
        - id: d-community
          label: Community / content apps
          detail: Chat, forums, courses, and Discord-linked experiences
        - id: d-payouts
          label: Payout + KYC services
          detail: Hosted payouts dashboard, payout methods, and sub-merchant onboarding
        - id: d-mobile
          label: iOS / Android / mobile web
          detail: Member-facing access channels into whops and content
        - id: d-builders
          label: Third-party apps & SDKs
          detail: Developers extend experiences through app APIs, repos, and SDKs
      edges:
        - from: d-seller-site
          to: d-checkout
          label: Embeds or links into checkout
          critical: true
        - from: d-discover
          to: d-checkout
          label: Marketplace demand converts via checkout
          critical: true
        - from: d-checkout
          to: d-membership
          label: Creates entitlement
          critical: true
        - from: d-membership
          to: d-community
          label: Unlocks app content
          critical: true
        - from: d-membership
          to: d-mobile
          label: Enables app and mobile-web access
          critical: true
        - from: d-checkout
          to: d-payouts
          label: Funds later route to seller balances
        - from: d-builders
          to: d-community
          label: Extend experiences
        - from: d-builders
          to: d-membership
          label: Read or act on platform objects
    approximationNotes: >-
      External payment processors and third-party identity vendors are not named in the reviewed public sources, so
      dependency nodes stop at the Whop-controlled interface layer.
    claimRefs:
      - CE014
      - CE029
      - CE030
      - CE037
      - CE038
      - CE040
  - id: FE004
    title: Product maturity / capability map
    type: matrix
    layout: wide
    summary: >-
      Capability-vs-evidence matrix showing which Whop surfaces look live and broad in public docs versus where public
      proof still stops short.
    data:
      columns:
        - Documented / live
        - Operational maturity signals
        - Missing public proof
      rows:
        - label: Checkout & plan config
          values:
            - Embedded React component and checkout configuration API are public
            - Supports multiple payment methods and configurable plan fields
            - No public conversion, fraud, or wallet-auth success metrics
        - label: Memberships & access
          values:
            - Membership lifecycle is documented and linked to checkout
            - Pause, resume, cancel, and mobile access flows are public
            - No public retention, renewal, or entitlement-SLA metrics
        - label: Payouts & KYC
          values:
            - Payout setup, account links, payout account object, and payout UI elements are public
            - Manual, recurring, and instant payout paths are documented
            - No reserve, payout-latency, or compliance-throughput disclosure
        - label: Community modules
          values:
            - Forums, chat auth, chat element, and app-store add-ons are public
            - Community features extend into mobile and Discord-linked access
            - No moderation precision or abuse-screening KPI disclosure
        - label: App platform & SDKs
          values:
            - Create-app and app-build promotion flows plus JS/Python/Go surfaces are public
            - Examples repo and builder Discord indicate active platform GTM
            - No app-review SLA, staged rollout policy, or QA evidence
        - label: Trust & safety disclosure
          values:
            - 2FA, location privacy, legal policies, and incident history are visible
            - Public review sites surface real user complaints and support interactions
            - No public security certification, SLA, or moderation-effectiveness pack
    approximationNotes: null
    claimRefs:
      - CE018
      - CE032
      - CE033
      - CE036
      - CE038
      - CE039
  - id: FU001
    title: Customer journey map
    type: journey-map
    insight: >
      Whop's customer journey begins on the seller side with business setup and on the buyer side with discovery.
      Expansion happens when a seller layers payments, community, affiliates, or Content Rewards on top of an initial
      offer; breakdown happens when trust issues, category quality problems, or payout/refund friction interrupt the
      loop.
    data:
      items:
        - id: seller-discovery
          label: Seller discovery
          actor: Creator / small business
          description: >
            Sellers arrive with an existing skill, audience, or niche product idea in coaching, software, clipping,
            trading, or paid communities.
          channels:
            - Whop blog and educational content
            - Word of mouth among creators
            - Marketplace examples and top products
        - id: storefront-setup
          label: Storefront setup
          actor: Seller
          description: >
            Sellers configure products, checkout, payouts, chat, communities, and app integrations using Whop's
            all-in-one storefront and docs stack.
          channels:
            - Whop app
            - Docs and APIs
            - Whop dashboard
        - id: buyer-discovery
          label: Buyer discovery
          actor: Buyer / member
          description: >
            Buyers discover storefronts via Whop marketplaces, affiliates, creator marketing, community referrals, and
            Content Rewards campaigns.
          channels:
            - Discover / marketplace
            - Affiliate links
            - Content Rewards campaigns
            - Mobile app
        - id: purchase-and-access
          label: Purchase and access
          actor: Buyer
          description: >
            Buyers purchase one-time offers or recurring access, then consume software, content, chat, courses,
            communities, or coaching through the same environment.
          channels:
            - 100+ payment methods
            - Mobile app
            - Chat and gated communities
        - id: expansion-or-friction
          label: Expansion or friction
          actor: Seller and buyer
          description: >
            Healthy loops include subscriptions, app integrations, upsells, affiliates, and repeat community
            participation. Friction points include scams, refunds, payout disputes, support gaps, and trust issues in
            high-risk categories.
          channels:
            - Subscriptions
            - Affiliates
            - Content Rewards
            - Support / dispute workflows
    sourceRefs:
      - SU003
      - SU006
      - SU007
      - SU015
      - SU016
  - id: FU002
    title: Adoption / deployment funnel
    type: funnel
    insight: >
      Whop's supply side is highly skewed. A very large population of products reaches the market, but only a small
      minority monetize meaningfully, and an even smaller minority produce elite incomes.
    data:
      items:
        - label: Tracked products
          value: 100
          description: WhopTrends tracks 195,236 products as the broad supply-side base.
        - label: Products generating any revenue
          value: 11.2
          description: 21,805 of 195,236 tracked products generate revenue at all.
        - label: Products earning $1K+/month
          value: 2
          description: 3,964 tracked products exceed $1K/month.
        - label: Products earning $10K+/month
          value: 0.5
          description: 961 tracked products exceed $10K/month.
    sourceRefs:
      - SU017
  - id: FU003
    title: Customer proof matrix
    type: matrix
    insight: >
      Whop's most convincing customer proof comes from live storefronts that expose both ratings and member counts.
      Category breadth is real, but proof quality is strongest in communities and coaching, not in published retention
      or concentration disclosures.
    data:
      columns:
        - Evidence Quality
        - Visible Scale
        - Recurring / Community Signal
        - Risk Flags
      rows:
        - label: Call Her Closed
          values:
            - label: High — live storefront with members, ratings, pricing, and reviews
            - label: Small-midsize visible scale (111 members)
            - label: Medium — education community likely involves repeat engagement
            - label: High-ticket outcome-based offer raises refund sensitivity
        - label: Brez Clips
          values:
            - label: High — live storefront with very large public review volume
            - label: Large visible scale (46.8K members)
            - label: High — free community format encourages repeat visits
            - label: Category trust risk because clipping quality can vary widely
        - label: Committed Coaches
          values:
            - label: Medium-high — product analytics plus independent revenue context
            - label: Large visible scale (13.8K members; est. $4.9M/mo)
            - label: Medium — coaching product likely includes ongoing accountability
            - label: High — high-ticket coaching relies on strong fulfillment and refund handling
        - label: Content Rewards
          values:
            - label: Medium — first-party community proof, not third-party customer proof
            - label: Very large visible scale (164.4K members)
            - label: High — campaigns and community updates imply repeat activity
            - label: Brand-safety and campaign-quality oversight matter
        - label: Marketplace long tail
          values:
            - label: Medium — analytics sources show broad product density
            - label: Very large supply base, weak average monetization
            - label: Low-mixed — no public cohort retention data
            - label: High — economic success is concentrated in a small minority
    sourceRefs:
      - SU003
      - SU011
      - SU017
      - SU019
      - SU020
      - SU021
  - id: FR001
    title: Whop risk heatmap
    type: matrix
    layout: wide
    summary: >-
      Payments stress and regulatory-borderline category exposure are the highest-residual risks because they can hit
      liquidity, growth, and trust simultaneously.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual severity
      rows:
        - label: Chargebacks / disputes
          values:
            - label: high
              tone: negative
              detail: Dispute, refund, and reserve tools are explicitly described in Whop terms and pricing.
            - label: high
              tone: negative
              detail: Directly affects seller liquidity, support load, and brand trust.
            - label: medium
              tone: warning
              detail: Controls exist, but public KPIs are undisclosed.
            - label: high
              tone: negative
              detail: Reserve hikes or payout delays can rapidly change marketplace behavior.
        - label: Trading / betting perimeter
          values:
            - label: medium-high
              tone: warning
              detail: Risk-adjacent categories are openly merchandised in discovery.
            - label: high
              tone: negative
              detail: Can create regulator, payment-partner, and reputation pressure at once.
            - label: medium
              tone: warning
              detail: Policies prohibit some conduct but leave advisory border zones.
            - label: high
              tone: negative
              detail: Borderline educational versus advice framing remains hard to police perfectly.
        - label: Creator quality / spam
          values:
            - label: high
              tone: warning
              detail: Multiple public reviews reference spammy or low-quality offers.
            - label: medium-high
              tone: warning
              detail: Trust erosion is gradual but can compound into churn and complaints.
            - label: low-medium
              tone: warning
              detail: Rules exist, but public enforcement throughput is not disclosed.
            - label: medium-high
              tone: warning
              detail: Residual risk stays elevated until moderation metrics are visible.
        - label: Processor / bank dependency
          values:
            - label: medium
              tone: warning
              detail: Whop markets redundancy but still depends on external PSPs and banks.
            - label: high
              tone: negative
              detail: Processor reversals or reserve actions can impair payouts and access.
            - label: medium
              tone: warning
              detail: Multi-rail orchestration helps, but partner policy still dominates.
            - label: high
              tone: negative
              detail: Counterparty concentration is core to the product itself.
        - label: Minor-safety / restricted groups
          values:
            - label: medium
              tone: warning
              detail: Whop has explicit youth controls, but DOB gating is still described as upcoming.
            - label: high
              tone: negative
              detail: One serious incident can create outsized trust and legal damage.
            - label: medium
              tone: warning
              detail: Policy maturity is good; operating evidence is limited.
            - label: medium-high
              tone: warning
              detail: Residual risk is meaningful because category mix includes sports-betting surfaces.
        - label: Reputation / complaints
          values:
            - label: high
              tone: warning
              detail: Public review surfaces already capture billing, refund, and fake-review concerns.
            - label: medium-high
              tone: warning
              detail: Brand damage increases CAC and invites stronger partner scrutiny.
            - label: low-medium
              tone: warning
              detail: Support responses exist, but public complaint metrics remain visible.
            - label: medium-high
              tone: warning
              detail: If not arrested, complaint accumulation can become self-reinforcing.
    claimRefs:
      - CR004
      - CR007
      - CR013
      - CR017
      - CR020
      - CR045
      - CR046
      - CR048
      - CR049
  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
