  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing context and GMV-to-revenue translation
        blocks:
          - type: paragraph
            body: >-
              Whop's February 2026 financing is easy to headline but harder to underwrite. Third-party coverage ties the
              Tether investment to a $200 million check at a $1.6 billion valuation, while Tether's own announcement
              focuses more on strategic alignment, stablecoin infrastructure, and international expansion than on round
              mechanics. That distinction matters: the market knows the headline price, but not the preference stack,
              conversion terms, or downside protection. For valuation work, the public record therefore gives a clean
              post-money marker but not a clean common-equity marker.


              The operating translation is similarly impressive but noisy. Official surfaces cite more than 18.4 million
              users and approximately $3 billion in annual participant earnings, while the network site now markets 22M+
              MAU and 27,000+ businesses. The differences likely reflect continued growth and different metric
              definitions, but they also show why normalized disclosure is still weak. On monetization, Whop's official
              fee stack starts at 2.7% + $0.30 on domestic cards and layers in international, FX, orchestration,
              billing, affiliate, financing, and payout charges. Sacra's estimate of a roughly 5.5% blended take rate in
              early 2025 is therefore directionally plausible. Using Sacra's $142 million annualized revenue estimate
              implies an ~11.3x revenue multiple at the last round, while the company's own >$1 billion payment-volume
              floor implies <1.6x GMV. That is a premium price, but not an obviously absurd one if Whop can prove that
              the payments network creates durable, software-like monetization rather than thin payment-processor
              economics.
            claimRefs:
              - CV001
