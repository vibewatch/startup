      - number: '1.3'
        title: Funding history shows step-function valuation growth and a strategic turn toward payments and crypto
        blocks:
          - type: paragraph
            body: >-
              The cleanest public funding history runs through a small number of widely cited milestones. TechCrunch
              reported a $17M Series A in July 2023 at a valuation above $100M, with Insight Partners and a high-profile
              angel roster participating. By mid-2024, Wikipedia and Sacra both pointed to a Series B of more than $50M
              led by Bain Capital Ventures at roughly an $800M valuation. The most important current marker is February
              2026: Tether formally disclosed a strategic investment and Wallet Development Kit integration, while
              PYMNTS, Inside Crypto, and Wikipedia reported that the round was $200M and valued Whop at about $1.6B. CB
              Insights’ company profile lines up directionally with that chronology, showing roughly $218M total raised
              and a last round of $200M. Two diligence implications follow. First, Whop’s capital stack now includes a
              strategic payments-and-stablecoin partner, not just generalist venture backers. Second, public valuation
              transparency is still strongest at the round-announcement level; open sources do not expose detailed
              governance rights, ownership percentages, or side-letter economics for the 2026 deal. Investors can
              underwrite the trend line, but not the fine print, from public evidence alone.
