  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Creator professionalization and supply growth
    - Growth driver
    - Now-2027
    - More creators operate like internet-native businesses that need direct monetization rails
    - Validate whether Whop is winning net-new serious sellers or just lighter hobbyist demand
  - - Membership-led monetization shift
    - Growth driver
    - Now-2027
    - Recurring communities and subscriptions increase demand for owned billing and entitlements
    - Measure renewal and churn behavior by product format
  - - Online-community and creator-tool expansion
    - Growth driver
    - Now-2027
    - Broad market reports explicitly cite communities and creator tools as market-growth inputs
    - Check whether Whop captures this with product breadth or only with pricing
  - - Cross-border creator work
    - Growth driver
    - Now-2027
    - Creators serving global clients value payouts, FX handling, and lower-friction onboarding
    - Quantify non-U.S. seller mix and payout corridor performance
  - - Tooling saturation and incumbent network effects
    - Constraint
    - Now
    - New entrants face crowded substitutes and entrenched ecosystems
    - Test win rates versus Circle, Patreon, Gumroad, and DIY Stripe stacks
  - - Fraud, refunds, disputes, and payout risk
    - Constraint
    - Ongoing
    - Digital goods can look high-margin but still suffer operational leakage through disputes and payout frictions
    - Request refund-rate, dispute-rate, and reserve-policy data by seller cohort
  - - FTC disclosure and fake-review enforcement
    - Constraint
    - Now
    - Creator claims, testimonials, and affiliate promotion create platform-level trust and enforcement exposure
    - Audit creator-policy enforcement workload and repeat-offender rates
  - - App-store and channel tolls
    - Constraint
    - Now-2027
    - Mobile or platform-native distribution can compress economics before Whop captures its own take
    - Ask what share of GMV flows through mobile IAP or other taxed channels
  notes: Timing and implications are synthesized from the cited sources; diligence asks identify the private operator data still needed to convert market context into underwriting confidence.
