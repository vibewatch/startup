  evidenceGaps:
  - type: missing-source
    severity: material
    topic: whop-som-visibility
    missingEvidence: Public GMV, active seller count, buyer count, and net take-rate disclosure by product category.
    whyItMatters: Without seller-scale and revenue-quality data, SOM stays narrative rather than quantifiable.
    diligencePath: Request seller cohort, GMV, net revenue, and repeat-purchase disclosure in management diligence or internal dashboards.
    relatedQuestionRefs:
    - QM021
    - QM025
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: mobile-and-channel-mix
    missingEvidence: Share of Whop transactions routed through mobile apps, app-store-taxed flows, or channel-native memberships.
    whyItMatters: Channel mix determines how much Apple, YouTube, or other platform tolls compress seller and platform economics.
    diligencePath: Ask for checkout mix by web vs. mobile app vs. third-party channel, plus gross-to-net fee bridge.
    relatedQuestionRefs:
    - QM019
    - QM025
    relatedTableRefs:
    - TM004
  - type: private-evidence-only
    severity: material
    topic: refunds-and-disputes
    missingEvidence: Refund, dispute, reserve, and payout-hold rates by seller cohort and product type.
    whyItMatters: Digital-product unit economics can look attractive until disputes, chargebacks, and reserves are layered in.
    diligencePath: Pull Stripe or internal risk dashboards segmented by product category, geography, and seller vintage.
    relatedQuestionRefs:
    - QM017
    - QM025
    relatedTableRefs:
    - TM004
  - type: conflicting-data
    severity: material
    topic: market-boundary-overlap
    missingEvidence: A single third-party breakdown isolating paid communities, courses, software access, and digital-product monetization inside the broader creator economy.
    whyItMatters: Broad TAM numbers can overstate what Whop can realistically address if the subsegments are not separated cleanly.
    diligencePath: Triangulate analyst data with internal seller mix, GMV by product type, and cohort-level pricing behavior.
    relatedQuestionRefs:
    - QM022
    - QM025
    relatedTableRefs:
    - TM002
    - TM003
