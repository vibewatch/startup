- id: TM004
  title: Payments and creator-tools stack table
  columns:
  - Layer
  - Representative tools / pages
  - Economics signal
  - Operational implication
  - Relevance to Whop
  rows:
  - - Whop checkout and paywall
    - Whop fee docs + docs overview
    - 2.7% + $0.30 domestic cards; +1.5% international; +1% FX
    - Low upfront entry, but headline price is only the first fee layer
    - Core Whop economics and conversion wedge
  - - Whop payouts and affiliate settlement
    - Whop payouts page + fee docs
    - 187+ payout countries; 1.25% affiliate payouts; dispute and alert fees sit outside headline rate
    - Cross-border seller adoption improves, but payout and dispute costs stack on top
    - Differentiates Whop from pure storefront tools
  - - Stripe platform backbone
    - Stripe Connect pricing + fraud/dispute docs
    - $2 monthly active account; 0.25% + 25¢ payout; fraud/dispute tooling embedded in flow
    - Underlying marketplace cost base remains meaningful even when platform markup is low
    - Whop or peers built on payment infrastructure cannot ignore payout economics
  - - Community software benchmarks
    - Circle + Mighty pricing
    - $79–$199+ monthly fees plus 2% to 0.5% transaction fees
    - Higher SaaS retainers can make pure community tools more expensive for early-stage creators
    - Whop competes by bundling community monetization with payment operations
  - - Course and digital-product benchmarks
    - Gumroad, Kajabi, Teachable, Podia
    - From 10% + $0.50 per sale to $89/month plus processor fees
    - Creators trade off higher take rates versus higher fixed SaaS fees and greater DIY burden
    - Whop can win if bundled economics beat assembling separate tools
  - - Platform-native memberships
    - Patreon, YouTube, Discord, Substack
    - 10% Patreon take plus processing; refunds or channel tolls remain platform-controlled
    - Fast to launch, but audience and monetization rules stay closer to the host platform
    - Defines the default alternative for creators not ready to own their full stack
  notes: Rows mix SaaS subscriptions, transaction fees, and payout costs because creator businesses experience them together as an effective take-rate stack rather than as isolated line items.
