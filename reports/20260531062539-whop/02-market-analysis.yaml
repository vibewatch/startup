- id: drivers-and-headwinds
  title: Demand drivers and structural headwinds
  body: |-
    The positive case for the market is straightforward: creator activity is professionalizing, recurring membership models are getting stronger, and more creators are behaving like globally distributed internet businesses. Goldman ties growth to influencer marketing and platform payouts; Research and Markets names online communities and creator tools as explicit growth drivers; The Business Research Company links the category to rising online-video consumption; and MBO shows creators increasingly using digital platforms and serving global clients. Those signals support a market where more sellers want owned monetization rails instead of relying entirely on ad sharing or brand deals.

    The headwinds are equally structural. SignalFire argues creator tools are already saturated and hard for newcomers because incumbents have network effects. FTC disclosure and fake-review rules raise the compliance burden for any platform that hosts creator claims, testimonials, or affiliate promotion. Whop’s own terms already prohibit fake reviews, manipulated engagement, and deceptive earnings claims, which is a sign that trust-and-safety overhead is part of the business model, not an edge case. Payment partners can suspend sellers that fail KYC or policy checks; disputes and refunds can erode already-thin margins; and app-store or channel-native membership tolls can compress creator economics further. Market growth is real, but conversion into durable SOM still depends on trust, compliance, and fee discipline.
