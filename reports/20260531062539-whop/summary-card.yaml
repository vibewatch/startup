  topStrengths:
    - Large creator and buyer distribution surface with public evidence of 18M+ users and significant seller breadth.
    - Product has expanded beyond storefronts into payments, payouts, wallet, chat, and app-platform tooling.
    - >-
      Strong recent financing signal from Tether adds strategic capital plus a stablecoin and cross-border payments
      angle.
    - Public growth proxies suggest Whop has scaled faster than many creator-commerce peers since 2023.
  topRisks:
    - >-
      Audited revenue, margin, cash, and cap-table terms are not public, limiting confidence in common-equity
      underwriting.
    - >-
      Marketplace trust risk remains live because complaint surfaces cite refunds, scams, false advertising, and payout
      disputes.
    - >-
      Sensitive seller categories such as trading, crypto, and betting-adjacent offers raise moderation and regulatory
      exposure.
    - >-
      Revenue and user metrics vary across Whop's own pages and third-party trackers, so KPI definitions need
      reconciliation.
    - >-
      The current valuation sits near premium software multiples while disclosure quality still looks more like a
      late-stage private marketplace.
  unresolvedGaps:
    - Audited FY2025 and YTD FY2026 revenue, gross margin, take rate, and cash-burn disclosure.
    - Full cap table, liquidation preferences, anti-dilution terms, and any special rights tied to the Tether round.
    - Category concentration, chargeback, refund, fraud-loss, and payout-delay metrics by seller cohort.
    - Reconciled KPI definitions for users, MAU, businesses, GMV, payouts, and creator earnings across public surfaces.
