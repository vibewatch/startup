evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board roster, committee structure, and formal governance calendar.
    whyItMatters: >-
      Public founder visibility is high, but governance quality and oversight depth cannot be assessed from open sources
      alone.
    diligencePath: Request board list, committee charters, governance calendar, and any observer-rights summary.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: A reliable current headcount broken down by geography and function.
    whyItMatters: >-
      Headcount intensity affects operating leverage, support capacity, and whether the company can police a broad
      marketplace safely.
    diligencePath: Request a headcount bridge by function, geography, and contractor status as of the run date.
    relatedQuestionRefs:
      - QO020
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: blocking
    topic: revenue-economics
    missingEvidence: Audited annual revenue, net take rate, gross margin, and chargeback/refund statistics.
    whyItMatters: >-
      Open-source GMV and revenue proxies are directionally helpful but insufficient for underwriting unit economics or
      quality of revenue.
    diligencePath: >-
      Request audited or board-level financial statements with revenue bridge, take-rate bridge, and refunds/chargebacks
      by category.
    relatedQuestionRefs:
      - QO021
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: scale-metrics and TO004 chronology
    missingEvidence: >-
      A management-defined metric glossary reconciling businesses, sellers, companies, users, and MAU, plus a
      management-verified chronology for when each public scale marker was first achieved.
    whyItMatters: >-
      Official and third-party pages use different scale labels, which makes both trend interpretation and milestone
      dating vulnerable to apples-to-oranges comparisons.
    diligencePath: >-
      Request a metric dictionary plus historical definitions for users, buyers, sellers, businesses, products, MAU, and
      the internal date log used for milestone reporting.
    relatedQuestionRefs:
      - QO018
      - QO025
    relatedTableRefs:
      - TO001
      - TO004
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: The exact terms, governance rights, and ownership effects of the 2026 Tether round.
    whyItMatters: >-
      The public funding story is clear, but strategic investor rights could materially affect control, product roadmap,
      and exit optionality.
    diligencePath: >-
      Request the Series C purchase agreement, side letters, current cap table, and any commercial partnership schedules
      tied to the financing.
    relatedQuestionRefs:
      - QO014
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
