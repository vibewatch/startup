              Kryptos；Sacra 还将 Alterya、Hexagate 和 Data Solutions 纳入 SaaS 模式。Sacra 称企业定价随公司规模、席位和数据需求变化，每席位约从 $10,000
              起，但这是分析师估算，不是官方目录价。 指定证据没有实际定价、折扣表、合同期限、实施费或收入确认政策。BNY Mellon 宣布使用全套合规套件，证明的是大型机构使用场景， 并非披露的合同价值或已确认收入。
