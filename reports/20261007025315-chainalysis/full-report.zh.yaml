              - CP008
              - CP009
              - CP010
          - type: callout
            title: 覆盖范围不等于准确率
            body: 供应商报告的链、桥、代币和资产数量使用不同分母，指定证据池没有对归因准确率或误报进行受控比较 [CP002, CP012]。
            calloutType: risk
            claimRefs:
              - CP002
              - CP012
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与合同证据
        blocks:
          - type: paragraph
            body: >-
