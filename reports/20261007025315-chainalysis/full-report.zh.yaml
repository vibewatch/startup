    title: 买家匹配图：已发布覆盖范围与套件广度
    type: quadrant
    summary: 这张受证据约束的序数图，将供应商报告的覆盖范围与指定比较中描述的监测和调查工作流广度分开。
    data:
      points:
        - label: Chainalysis
          x: 5
          'y': 5
          note: 已报告网络数量最高，且拥有广泛的集成套件
        - label: TRM Labs
          x: 4
          'y': 5
          note: 筛查覆盖广，并配有行为分析和调查工作流
        - label: Elliptic
          x: 3
          'y': 5
          note: 网络数量较少，但桥接覆盖广且工作流已集成
        - label: Merkle Science
          x: 3
          'y': 4
          note: 资产和桥接指标无法与区块链数量比较
        - label: Scorechain
          x: 2
          'y': 4
          note: 已报告链覆盖较窄，但监测工作流可配置
        - label: 内部栈加 API
          x: 1
          'y': 2
          note: 买家专属覆盖和工作流广度未量化
    approximationNotes: 分析师赋予的 1-5 序数分数仅使用 WalletInvestor 发布的覆盖和工作流描述。X 是相对报告覆盖度，而非统一单位基准；Y 是所描述的套件广度，而非测得的产品质量。
