      - number: '7.2'
        title: 模型质量与链异质性使剩余运营风险居高不下
        blocks:
          - type: paragraph
            body: >-
              产品可靠性不只取决于链覆盖广度。Chainalysis 自身的代币化分析描述了速度、成本波动、传染、非法暴露和治理之间的权衡， 并警告软最终性可能不同于基础层结算。其 OCC
              意见另称，确定性的结构结果与概率性的归因需要不同质量标准。独立采购指南还指出， 误报仍是分析师关切，监管机构的透明度要求各不相同，部署需要集成、校准、人员配置和审计文档。这些来源没有确认 Chainalysis
              特有的 错误率、正常运行时间或事故表现。在取得这些记录前，不应把广泛覆盖和营销规模当成稳定准确率或运营韧性的证明。
            claimRefs:
              - CR004
              - CR006
              - CR007
              - CR008
              - CR009
              - CR011
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR006
              - CR007
              - CR008
              - CR009
              - CR011
              - CR015
      - number: '7.3'
        title: 公开采用信号无法解决集中度或财务不透明
        blocks:
          - type: paragraph
            body: >-
              公开证据显示触达范围，却没有显示持久性。Chainalysis 当前声称拥有 1,500 多家客户，但其较早的 BNY Mellon 公告描述的是计划使用
              产品套件，而不是当前生产范围或续约证据。指定独立来源称订阅按报价定价，总成本是定制的，实施和咨询费用不公开。TechCrunch 记录了 2022 年 $170 million、$8.6 billion 估值的
              Series F，但这笔历史融资不能证明当前现金、消耗、盈利能力或估值。因此客户集中度、 续约行为、政府/私营收入组合、当前部署状态和资本需求仍是未量化的依赖项，而非可支持的结论。
            claimRefs:
              - CR009
              - CR010
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR009
              - CR010
              - CR012
              - CR013
              - CR014
      - number: '7.4'
        title: 缓释措施成熟度必须证明，不能推断
        blocks:
          - type: paragraph
            body: >-
              现有最强缓释措施是流程性的：将确定性输出与概率归因分开，在下游系统中保留置信度和来源，验证有代表性的链工作流，并在合同中约定 可量化的服务和事故义务。如果 Chainalysis
              无法提供独立错误特征、当前正常运行时间和事故历史，或机器可读的输出层级区分，投资逻辑应暂停。
              如果客户级尽调无法将声称的客户规模与续约、集中度和生产部署对上，也应暂停。定价、实施服务和用量递增条款需要买方专属的工作说明书。
              任何未披露的重大执法事项、反复未达到约定服务水平，或无法复现归因结果，都会破坏防御性前提，而不只是降低增长预期。
            claimRefs:
              - CR004
              - CR005
              - CR009
              - CR010
              - CR011
              - CR014
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR004
              - CR006
              - CR010
              - CR011
              - CR012
              - CR014
              - CR016
      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 以可复现性和运营证据作为投资逻辑门槛
            body: 在将监管嵌入或客户规模视为持久优势前，要求提供独立错误特征、输出层级来源、代表性链测试、事故和 SLA 历史、续约队列、 集中度数据以及定价后的工作说明书。
            calloutType: recommendation
            claimRefs:
              - CR004
              - CR005
              - CR009
