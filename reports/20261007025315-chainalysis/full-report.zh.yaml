  - id: TV002
    title: 投资论点与反论点
    columns:
      - 视角
      - 有证据支持的论点
      - 哪些信息会改变判断
    rows:
      - - 投资论点
        - 客户采用已形成规模、产品覆盖广，说明这可能是一项持久的加密情报资产。
        - 经审计的增长、留存和利润率证据将增强对公司质量的判断。
      - - 机构验证
        - BNY Mellon 宣布计划集成 Chainalysis 合规套件。
        - 必须通过参考客户访谈核实部署范围、续约、定价和可量化结果。
      - - 反论点
        - 历史高溢价定价和不透明的当前融资，可能压过原本强劲的公司质量。
        - 清晰的股权结构表、适度的优先股堆叠和大幅价格重置会降低风险。
      - - 证据冲突
        - 融资数据库说法不一，且低信誉评论提出了缺乏依据的当前估值输入。
        - 已签署的融资文件和当前股权结构表必须解决这一冲突。
    notes: 公司发布的采用说法被视为佐证，而非独立基准；在取得主要交易文件前，融资冲突仍未解决。
