  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类范围与替代方案
        blocks:
          - type: paragraph
            body: >-
              区块链数据情报市场位于反洗钱合规、威胁取证和监管分析的交叉地带。该边界内的支出包括链上交易监测软件订阅、
              实体聚类与归因数据库、刑事调查人员使用的取证追踪软件，以及商业市场情报数据流。相反，该品类不包括通用企业网络安全工具 （SIEM、端点检测、防火墙遥测）、缺乏原生图聚类算法的传统法币 AML/KYC
              名单筛查引擎，以及原始基础设施节点托管。 现状替代方案在公私部门都根深蒂固：执法机构常在发出传票要求披露的同时手工审查区块浏览器，传统金融机构则往往通过全面停止
              数字资产交易对手合作降低风险，而不是购买专门的监测软件 [CM001, CM002, CM003]。
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM011
              - CM013
      - number: '2.2'
        title: “TAM、SAM 和 SOM：不同视角下的市场规模”
        blocks:
          - type: paragraph
            body: >-
              评估区块链合规的可服务市场时，必须把公链上的总交易量与可变现的企业软件 ARR 分开。Chainalysis 估计，仅经调整的稳定币 交易量在 2025 年就达到 $28 trillion
              的有机经济活动，但监测和调查这些通道的商业软件支出只占网络总吞吐量的一小部分 [CM004, CM005]。分析师模型和行业基准预计，专业加密货币合规与调查软件的全球 TAM 在 $1.5 billion 至
              $2.8 billion 之间， 全球约 1,500 个活跃企业和政府客户标识支持这一估算 [CM006, CM007]。Chainalysis 的可服务市场（SAM）集中在约 330 个
              公共部门执法和监管机构，以及一级加密交易所和全球系统重要性银行；这些客户在 2025 年实现的 ARR 达到 $420 million [CM008,
              CM009]。规模尽调显示，乐观的供应商预测与第三方企业画像估算之间持续存在差异 [CM010]。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM006
              - CM009
              - CM010
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM006
              - CM009
              - CM010
      - number: '2.3'
        title: 买方细分、预算归属与采购路径
        blocks:
          - type: paragraph
            body: >-
              采购动态分为三类彼此不可替代的买方，其采购周期各不相同。执法和情报机构用没收款、取证设备预算或专门机构预算购买 Chainalysis Reactor，并要求严格的证据可采性和经 Daubert 检验的法律标准
              [CM001, CM008]。受监管的加密交易所和支付处理商 从合规、AML 和风险运营预算采购 Chainalysis KYT，价格随月度交易量和支持的区块链网络扩展 [CM011,
              CM012]。全球系统重要性银行 和资产服务商以 BNY Mellon 的数字资产平台部署为例，通过机构创新和风险管理预算购买企业套装 [CM013, CM014]。 所有情况下，合同谈判都包括可获得 15% 至
              30% 折扣的多年承诺，但会被 3% 至 7% 的年度涨价条款抵消 [CM015]。
            claimRefs:
              - CM001
              - CM008
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM008
              - CM011
              - CM013
              - CM014
      - number: '2.4'
        title: 结构性增长驱动因素与商业采用约束
        blocks:
          - type: paragraph
            body: >-
              行业扩张由结构性催化剂推动，尤其是美国 GENIUS Act、欧洲 MiCA 法规下的法定要求，以及跨境结算中稳定币支付的扩张 [CM004,
              CM009]。但采购惯性、客户集中度和集成开销会拖慢采用。第三方采购基准显示，计入实施、专业人员培训和 API 使用后， 总拥有成本通常比初始订阅费高 20% 至 40% [CM015,
              CM016]。此外，固定政府拨款限制了公共部门的定价能力，而私营部门的 加密市场波动会直接影响决定 KYT 收入的交易量档位 [CM009, CM012]。
            claimRefs:
              - CM004
              - CM009
              - CM012
              - CM015
              - CM016
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 吞吐量与软件变现之间的缺口
            body: >-
              区块链合规尽调的一个核心发现，是网络交易速度与软件预算实现之间存在巨大差距。稳定币在 2025 年处理了 $28 trillion 的经调整交易量，但商业软件收入仍取决于人工分析师席位、固定机构拨款和分层 API
              监测档位，而不是按交易量收取基点费 [CM004, CM012, CM015]。
            calloutType: insight
            claimRefs:
              - CM004
              - CM012
              - CM015
          - type: callout
            title: 采购摩擦与实施附加费
            body: >-
              企业软件买方部署区块链情报平台时会遇到明显阻力。除基础订阅费外，实施、定制 API 集成和专业调查员认证课程会使第一年 总拥有成本增加 20% 至 40%，加剧谈判摩擦并拉长企业采购周期 [CM015,
              CM016]。
            calloutType: risk
            claimRefs:
              - CM015
              - CM016
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 直接竞争者与实际替代方案
        blocks:
          - type: paragraph
            body: >-
              指定比较证据将 Elliptic、TRM Labs、Merkle Science 和 Scorechain 列为 Chainalysis 的主要直接替代者，并将五家公司都描述为 交易监测和调查工作流供应商
              [CP001, CP003]。同一证据还指出一种实际替代方案：已经运行案件管理、客户风险和制裁系统的买方， 可以采购 API 优先的区块链情报层，而不是替换更广泛的合规技术栈
              [CP015]。因此内部工具和手工区块浏览器是重要的现状选项， 但证据没有显示它们能复制商业实体归因数据。通用软件目录的噪声太大，不能用来界定市场，因为其抓取到的替代产品还包括无关的 会计、人力资源、CRM
              和薪资产品 [CP016]。
            claimRefs:
              - CP001
              - CP003
              - CP015
              - CP016
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP007
              - CP015
      - number: '3.2'
        title: 能力趋同与定位
        blocks:
          - type: paragraph
            body: >-
              领先供应商在钱包筛查、交易监测、跨链追踪、行为检测、调查、API 和案件管理方面日益趋同 [CP003]。公开覆盖范围仍不足以单独 排名：比较来源称 Chainalysis KYT 覆盖 400+ 个网络，TRM
              Labs 覆盖 184+ 个筛查网络和 65+ 个完整追踪网络，Elliptic 覆盖 65+ 条区块链和 250+ 个桥，Merkle Science 覆盖 10,000+ 种资产和 200
              个桥，Scorechain 覆盖 25+ 条区块链，但明确警告这些 分母不可直接比较 [CP002]。Chainalysis 还称其数据平台支撑调查和合规套件，说明买方购买的不只是工作流软件，也包括数据和归因
              [CP013]。因此产品选择应检验买方实际使用的链、桥、延迟、可解释性和告警工作量，而不是奖励最大的宣传数字。
            claimRefs:
              - CP002
              - CP003
              - CP013
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP003
              - CP013
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP003
              - CP015
      - number: '3.3'
        title: 定价不透明与分销能力
        blocks:
          - type: paragraph
            body: >-
              公开定价不够一致，无法进行干净的供应商成本排名。CostBench 将 Chainalysis 描述为定制定价，KYT 和 Reactor 分开规划， 成本随席位、公司规模和数据需求变化
              [CP004]。同一页面给出两个来源不同、且差异显著的基准：来自 16 次社区购买提及的 $18,500 年度中位数，以及归因于 Vendr 企业级交易流的 $174,709 年度合同价值中位数 [CP005,
              CP006]。两者都不是 ARR、 收入、现金或统一目录价。分销比定价更清楚：Chainalysis 声称有 1,500+ 家客户，十大加密交易所中的九家以及 50 多家监管机构 使用其数据 [CP007,
              CP008, CP009]。其公司发布的 BNY Mellon 公告还记录了一家全球系统重要性银行计划进行全套集成 [CP010]。
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP011
      - number: '3.4'
        title: 护城河持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              在这组证据中，Chainalysis 最强的可观察护城河是分销和工作流嵌入，而非已证明的准确率优势。公司报告的客户、交易所、监管机构 和银行采用信号说明集成程度与机构熟悉度较高，可能提高切换成本 [CP007,
              CP008, CP009, CP010]。但一份独立评测称其平台 昂贵、仅面向企业，并提醒地址归因和风险评分使用启发式方法，无法保证无误，还会引发隐私争议 [CP011, CP012]。
              功能趋同会带来多平台使用和模块化替代风险，尤其当买方可以保留现有合规技术栈、通过 API 消费风险数据时 [CP003, CP015]。
              指定证据池没有受控的误报率、召回率、归因错误或迁移基准，因此差异化持久性尚未得到证明，而不是已被证伪。
            claimRefs:
              - CP003
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
              - CP015
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 分销是最清晰的防御性信号
            body: >-
              公司披露声称拥有 1,500+ 家客户、十大加密交易所中的九家和 50 多家监管机构；BNY Mellon 公告则记录了一家全球系统重要性银行 计划进行全套集成 [CP007, CP008, CP009,
              CP010]。
            calloutType: strength
            claimRefs:
