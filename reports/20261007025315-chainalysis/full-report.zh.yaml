      - number: '4.3'
        title: 成本结构与资本充足性
        blocks:
          - type: paragraph
            body: >-
              成本基础只能看到方向。Chainalysis 称研发是其数据平台的核心，并描述全球运营版图，但其招聘页面抓取文本没有职位数量。
              这些信号与较高的技术和国际运营成本相符，却没有量化云基础设施、授权数据、服务交付人力、佣金、资本开支或营运资金。 Sacra 估计 Chainalysis 持有约 $200 million 现金，并在 2023
              年下半年消耗约 $40 million；这一历史现金消耗估算既不是会计亏损， 也不是当前现金跑道的证据。Sacra 还报告一笔约 $9 million 的 Hercules 高级担保融资，2028 年 10
              月到期，但指定证据没有公开 提取状态、利息、契约和抵押品细节。
