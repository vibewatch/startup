  - id: TV003
    title: 乐观、基准和悲观决策区间
    columns:
      - 情景
      - 明确假设
      - 估值与回报逻辑
      - 概率信号与下行触发条件
    rows:
      - - 乐观
        - 已验证的强劲增长、持久留存、有吸引力的利润率、清晰的优先股堆叠和广泛的客户分散度。
        - 历史上的 $8.6b 估值最多只能作为上限参考；准确区间要等经审计输入和目标回报要求确定后才能得出。
        - 信号是经审计的加速增长和退出准备度；触发条件是无法证实运营指标。
      - - 基准
        - 商业规模延续，但增长趋于正常化，非上市公司流动性仍有限。
        - 相比历史估值必须有大幅折价；现有证据不足以支持精确百分比或点估计。
        - 信号是续约和利润率稳定；触发条件是集中度高、留存弱或债务限制严苛。
      - - 悲观
        - 收入质量、集中度、杠杆或优先权顺位明显差于预期。
        - 在条款重置且下行保护形成文件前，不支持按价格进入。
        - 信号是融资或运营短缺；触发条件是在缺乏当前证据时依赖过时的 2022 年定价。
    notes: 这些是定性投资判断区间，而非预测；由于当前财务数据和交易条款不可得，精确估值区间和回报被有意保留为缺口。
    claimRefs:
