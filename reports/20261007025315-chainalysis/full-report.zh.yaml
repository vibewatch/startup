        - id: product-suite
          label: KYT、Reactor、Kryptos 及其他应用
          detail: 产品支持监测、调查和风险情报。
        - id: contract-basis
          label: 企业账户、席位与数据要求
          detail: Sacra 报告的定价维度；官方价目表不可得。
        - id: customer-use
          label: 机构部署
          detail: BNY Mellon 宣布计划使用完整合规套件。
        - id: recognized-revenue
          label: 已确认收入
          detail: 公开 ARR 估计未披露 GAAP 确认方式或收入流构成。
        - id: gross-profit
          label: 毛利
          detail: 公开资料不足以支持毛利率和交付成本拆分。
      edges:
        - from: data-services
          to: product-suite
        - from: product-suite
          to: contract-basis
        - from: contract-basis
          to: customer-use
        - from: customer-use
          to: recognized-revenue
        - from: recognized-revenue
          to: gross-profit
