  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 核心产品套件、企业模块与调查工作流
        blocks:
          - type: paragraph
            body: >-
              Chainalysis 提供一体化企业产品套件，将原始、假名化的分布式账本交易转化为可执行的身份归因和合规情报。平台运营核心由三套 主要应用及开发者集成界面组成：Chainalysis
              Reactor、Chainalysis KYT（Know Your Transaction）和 Chainalysis Kryptos。 Reactor
              是联邦执法机构、网络犯罪特别工作组和国家安全调查人员使用的可视化图取证与调查环境，用于追踪跨多跳、剥离链和混币服务
              的非法资金流。分析师可按交易哈希或钱包地址搜索、可视化实体集群，并将链上活动与已验证的现实服务标签关联。为持续监管合规， Chainalysis KYT 提供低延迟自动化 API 和 Web
              界面，供加密交易所、托管银行和金融科技公司实时开展反洗钱（AML）及反恐融资（CFT） 交易筛查。KYT 按可配置的风险分数阈值评估存款和提款，标记受制裁地址、暗网市场交易对手、混币器暴露和可疑交易结构。
              Chainalysis Kryptos 补充运营监测，为机构投资者、合规官和全球系统重要性银行（如 BNY Mellon）提供宏观层面的交易对手情报和风险画像，
              覆盖中心化交易所、流动性池和数字资产服务商。为减少不同情报工具之间的工作流摩擦，Chainalysis 与 Penlink 等外部数字取证供应商合作，
              让联合防务和执法客户能在统一的开源情报（OSINT）及地理空间调查环境中直接查询 Chainalysis 情报。
            claimRefs:
              - CE001
