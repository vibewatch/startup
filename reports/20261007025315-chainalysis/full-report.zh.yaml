      - number: '5.2'
        title: 技术架构、工程栈与双重部署模式
        blocks:
          - type: paragraph
            body: >-
              Chainalysis 的底层技术架构是一条端到端分布式数据处理与分析流水线，目标是在满足严格防务级运营标准的同时处理海量公链交易量。 数据摄取层连接 45
              条支持的区块链上的全节点，将原始区块事件和内存池交易流入由 Apache Kafka 及 Amazon Web Services（AWS）云服务
              驱动的事件流摄取骨干。在核心情报引擎中，专有启发式规则、交易聚类算法和机器学习实体解析模型持续将单个钱包地址聚合为一致的行为实体。 数据工程和分布式系统团队主要用 Go 和 Java 构建后端服务，并以
              Terraform 编排 AWS EC2、S3、EBS、Lambda 和 CloudFront 上的基础设施即代码。 交易状态和关系元数据由 PostgreSQL 集群管理，可观测性则通过
              Prometheus、Grafana、Datadog 和 Humio 维护。一个关键架构能力是 Chainalysis 的双重部署模式：商业加密交易所和金融机构访问云端托管的 SaaS 与 REST
              API，而国家安全和防务客户要求部署在完全 气隙隔离的政府本地环境中。为满足主权约束，Government Systems 工程组维护专用 Go CLI 安装工具和 Java 数据交付流水线，将多 TB
              区块链数据集、清单模板和容器镜像打包，自动配置到运行 RKE2、Helm、Kustomize 和 Flux CD 的气隙 Kubernetes 集群。气隙设施内的 系统管理员通过 Node.js 后端和
              React 前端驱动的隔离管理门户，配置基于角色的访问控制（RBAC）、多租户隔离和集群健康监测。
            claimRefs:
              - CE008
              - CE009
              - CE010
              - CE011
              - CE012
              - CE013
