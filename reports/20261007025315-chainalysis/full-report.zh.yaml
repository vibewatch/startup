      - number: '4.4'
        title: 财务结论与尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              募集资金不应视为可用现金。FundedIQ 跟踪四条已披露记录、合计 $370 million，并排除一笔没有公布金额的 2025 年 10 月轮次； Sacra、2026 年 8 月资料和 Private
              Market View 则报告了明显不同的累计总额：$536.6 million、$538.1 million 和 $587.4 million。
              这种分歧反映覆盖范围和方法不同，需要核对资本表，而不是取平均估算。Private Market View 给出的 2026 年 10 月估值为 $1.3 billion， 比所引用的后期 $8.6 billion
              估值低 85%，这是不利的市场信号，但不能证明经营恶化。财务结论因此是混合的：商业模式和机构触达 看起来可信，但收入质量、利润率路径、资本强度、现金跑道和债务能力仍未验证。应等到取得经审计报表、ARR 与
              GAAP 对账、客户队列 和已执行融资文件后再作投资判断。
