        title: 展示项
        blocks:
          - type: callout
            title: 价格是门槛事实
            body: 公司质量可能值得继续尽调，但公开证据不足以支持当前入场估值。在将“继续研究”立场转为可投资建议前，要求提供一手财务报表、 融资文件和优先股堆叠。
            calloutType: recommendation
            claimRefs:
              - CV001
