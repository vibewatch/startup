  - id: FE001
    title: Chainalysis 平台架构与运营技术栈
    type: stack
    summary: 架构概览展示从 45+ 条区块链摄取数据、分布式数据管道、核心聚类与 AI 引擎、双重部署交付以及应用接口。
    data:
      layers:
        - label: 应用与接口层
          detail: 提供调查取证、合规筛查和合作伙伴工作流的前端界面与开发者集成端点。
          modules:
            - Chainalysis Reactor（可视化图谱追踪）
            - Chainalysis KYT（实时交易筛查）
            - Chainalysis Kryptos（机构目录与尽职调查）
            - 合作伙伴集成（Penlink OSINT / 电信联合）
            - 开发者 REST API 与 Webhooks
          outputs:
            - 取证案件档案
            - 自动化 AML 风险告警
            - 交易对手风险画像
        - label: 交付与配置层
          detail: 自动化隔离环境软件打包与主权部署安装工具。
          modules:
            - 隔离环境政府安装器（Go CLI）
            - 清单渲染与镜像复制引擎
            - 云端打包与制品签名管道
          outputs:
            - 隔离环境部署包
            - 加密容器签名
        - label: 主权与云基础设施层
          detail: 双重运营模式，支持多租户云 SaaS 和隔离环境下的政府本地部署。
          modules:
            - 云 SaaS 基础设施（AWS EC2、S3、EBS、Lambda、CloudFront）
            - 本地 Kubernetes 集群（RKE2、Helm、Kustomize、Flux CD）
            - 管理门户 UI 与 RBAC 服务（React、Node.js、PostgreSQL）
          outputs:
            - 隔离的政府环境
            - FedRAMP 审计日志
        - label: 情报与启发式规则层
          detail: 将原始账本密码学数据与经过验证的现实世界实体及风险类型关联起来的核心分析引擎。
          modules:
            - 专有聚类启发式规则（多输入聚合）
            - 实体归因数据库（交易所、制裁、暗网）
            - AI 与预测性风险评分模型
            - 跨链图谱追踪算法
          outputs:
            - 已归因实体簇
            - 确定性风险评分
            - 符合 Daubert 标准的取证证据
        - label: 数据管道与存储层
          detail: 可扩展的事件驱动数据处理骨干和持久化关系状态存储。
          modules:
            - 事件流骨干（Apache Kafka）
            - 分布式数据库层（PostgreSQL）
            - 云数据打包服务（Java 服务）
          outputs:
            - 流式交易事件
            - 持久化元数据状态
        - label: 账本摄取层
          detail: 多链节点基础设施，持续摄取 45 条区块链上的原始区块和内存池事件。
          modules:
            - 多链全节点摄取（45 条区块链）
            - UTXO 与账户状态索引器
            - RPC 客户端池与节点健康检查器
          outputs:
            - 标准化交易事件流
            - 已签名、已打包的区块链数据档案
    approximationNotes: 架构反映技术岗位说明、官方平台文档和开发者集成资料。
    claimRefs:
      - CE001
      - CE002
      - CE008
      - CE009
      - CE010
      - CE011
      - CE012
      - CE013
      - CE014
  - id: FU001
    title: 企业客户采用路径与平台扩展循环
    type: journey-map
    summary: 可视化地图展示企业从初始交易筛查或调查试点，逐步走向深度嵌入式多产品平台采用。
    data:
      items:
        - label: 评估与合规试点
          description: 部门合规或取证团队针对具体监管要求或调查案件评估 Reactor 或 KYT
        - label: 初始生产部署
          description: 实施独立交易筛查或案件追踪，并通过 API 集成到内部工作流
        - label: 多产品扩展
          description: 采用相邻模块，包括用于交易对手尽调的 Kryptos 和用于自动化摄取的 Data Solutions
        - label: 企业平台锁定
          description: 通过定制风险规则集、受训认证调查员和共享情报包形成深度运营依赖
        - label: 续约与定价摩擦
          description: 合同续约价格上涨 10-15%，造成成本压力，并促使客户与 TRM Labs 和 Elliptic 进行多供应商对标
        - label: 生态协作
          description: 积极参与跨机构协作行动和共享行业威胁情报网络
    approximationNotes: 这些阶段综合了企业软件评测和投资者分析中记录的采购动态、多产品采用模式与定价阻力。
    claimRefs:
      - CU009
      - CU014
      - CU015
  - id: FR001
    title: 公开证据受限下的残余风险排序
    type: matrix
    summary: 定性排序区分有证据支持的暴露与缓解成熟度；不赋予数值概率。
    data:
      columns:
        - 证据
        - 影响
        - 缓解成熟度
        - 残余严重性
      rows:
        - label: 分析输出限定
          values:
            - label: 证据
              text: 详细的公司方案；缺乏独立实施证明
              tone: warning
            - label: 影响
              text: 高
              tone: negative
            - label: 缓解成熟度
              text: 发展中
              tone: warning
            - label: 残余严重性
              text: 高
              tone: negative
        - label: 跨链运营假设
          values:
            - label: 证据
              text: 公司文件记录了最终性、费用、传染和治理方面的权衡
              tone: neutral
            - label: 影响
              text: 对敏感工作流为高
              tone: negative
            - label: 缓解成熟度
              text: 未经客户工作流验证
              tone: warning
            - label: 残余严重性
              text: 中高
              tone: warning
        - label: 假阳性与透明度
          values:
            - label: 证据
              text: 独立采购警告；没有公司特定发生率
              tone: warning
            - label: 影响
              text: 高
              tone: negative
            - label: 缓解成熟度
              text: Unknown
              tone: warning
            - label: 残余严重性
              text: 高
              tone: negative
        - label: 部署经济性
          values:
            - label: 证据
              text: 独立来源称定价和 TCO 为定制化
              tone: warning
            - label: 影响
              text: 中高
              tone: warning
            - label: 缓解成熟度
              text: 取决于合同
              tone: neutral
            - label: 残余严重性
              text: 中等
              tone: warning
        - label: 客户集中度与持久性
          values:
            - label: 证据
              text: 公司总数与一项历史计划中的整合
              tone: warning
            - label: 影响
              text: 高
              tone: negative
            - label: 缓解措施成熟度
              text: 尚无公开验证
              tone: warning
            - label: 残余严重性
              text: 高
              tone: negative
        - label: 当前财务韧性
          values:
            - label: 证据
              text: 历史 2022 年融资轮；当前经营指标缺失
              tone: warning
            - label: 影响
              text: 高
              tone: negative
            - label: 缓解措施成熟度
              text: 需要私下尽调
              tone: neutral
            - label: 残余严重性
              text: 高度不确定
              tone: negative
    approximationNotes: 分析师仅依据指定来源池作出的定性映射；没有可用的数值概率、损失金额或经独立验证的缓解评分。
    claimRefs:
      - CR004
      - CR006
      - CR010
      - CR011
      - CR012
      - CR014
      - CR016
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 决策路径从已验证的经营规模出发，经过尚未解决的财务与交易证据，最终给出“继续研究”的建议。
    data:
      nodes:
        - id: product-scale
          label: 产品规模
          value: 27+ blockchains
          detail: 公司披露的 Reactor 覆盖范围显示其技术触达面广。
        - id: customer-proof
          label: 客户验证
          value: 1500+ customers
          detail: 公司披露的规模与机构采用情况支持其战略相关性。
        - id: historical-mark
          label: 历史估值参照
          value: $8.6B in 2022
          detail: 经独立交叉验证的融资参照，并非当前公允价值标记。
        - id: current-financing
          label: 当前融资
          value: Amount undisclosed
          detail: 保留的数据库记录了 2025 年 10 月的一次事件，但未披露可靠定价。
        - id: underwriting-gap
          label: 投资评估缺口
          value: ARR and terms unavailable
          detail: 当前经济状况、股权结构表、优先权安排和债务条款仍未经验证。
        - id: recommendation
          label: 建议
          value: Research more
          detail: 只有审阅主要财务与资本结构证据后，才能定价。
    approximationNotes: 该序列是一条分析决策路径；各数值保留来源时点，不应视为同一期间的量化序列。
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV007
      - CV015
      - CV016
