  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              证据支持“继续研究”，而非带价格的投资决策。Chainalysis 可指出拥有 1,500 多家客户、广泛渗透交易所，产品覆盖 27+ 条区块链，
              共同说明这是一个规模化且难以复制的运营资产。但这些优势没有解决价格问题。保留证据池中最后一个经独立佐证的估值，是 2022 年 5 月 $8.6 billion 的 Series F 估值；后续数据库记录了
              2025 年 10 月一笔未披露金额的融资。没有当前 ARR、增长、毛利率、留存率、 净债务、完全摊薄股份或优先权条款，就无法负责任地计算企业价值倍数或股权回报案例。因此入场纪律必须以文件为准：
              管理层补齐运营和资本化数据前，不批准任何价格。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV007
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV007
              - CV015
              - CV016
      - number: '8.2'
        title: 投资论点、反论点与融资背景
        blocks:
          - type: paragraph
            body: >-
              投资论点是，Chainalysis 已成为加密市场的规模化信任层：其材料描述了主要交易所、监管机构和金融机构的采用，Reactor 产品则把 广泛链覆盖与大型归因数据集结合起来。BNY Mellon
              集成公告提供了具体的机构使用信号。反论点并非产品是否有相关性，而是投资者在历史估值 高、2025
              年融资不透明、未知优先股堆叠压力和缺少当前财务报表的情况下，能否获得可接受回报。公开融资数据库对累计资本和轮次数也存在重大分歧。 一则信誉较低的评论声称后来发生了 $8.6b 交易及 20.5-times ARR
              multiple， ARR 估值，但这些输入与更强的保留记录冲突，应作为不利尽调线索，而非估值事实。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV009
              - CV013
              - CV014
              - CV015
      - number: '8.3'
        title: 牛市、基准与熊市情景
        blocks:
          - type: paragraph
            body: >-
              由于证据池无法支持精确的 2026 年估值区间，情景分析必须保留条件性。乐观情景下，经验证的增长、持久留存、吸引人的利润率和清晰的优先股堆叠 会让 2022
              年估值成为上限参考；客户和产品覆盖扩张则支持未来战略出售或上市退出。基准情景假定商业规模真实，但因定价陈旧、私有公司流动性
              不足和财务披露不完整，需要相对历史估值折价。悲观情景是在收入质量、集中度、杠杆或优先权级别不利时不入场。这些是决策区间，不是编造的点估计； 管理层数据必须决定实际区间和目标回报。
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV007
              - CV012
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV007
              - CV012
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: 退出准备度与论点破坏尽调
        blocks:
          - type: paragraph
            body: >-
              Chainalysis 展现出可能支持退出准备度的运营特征，包括全球版图、机构客户证明和广泛的调查平台。公开证据没有确认 IPO 或战略出售时间表
              所需的治理、审计准备度、可预测增长或融资条款。招聘页面抓取结果也没有职位数量，因此不能用招聘作为当前增长代理；独立数据库只提供 501 至 1,000 名员工的区间。最终尽调应取得经审计收入和 ARR
              桥接表、毛利率、留存率、客户集中度、债务文件、完全摊薄股权结构表、 清算优先权和二级转让历史。论点破坏触发因素包括重大增长缺口、留存疲弱、集中合同流失、优先股堆叠压力，或仍依赖 2022 年市场环境的入场价格。
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
