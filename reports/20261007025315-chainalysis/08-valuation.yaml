company:
  name: Chainalysis
chapter:
  number: 8
  title: Valuation
  summary: >-
    Chainalysis has credible product-scale and customer-proof signals, but the retained public
    evidence does not establish current ARR, margins, preference terms, or a reliable current
    equity price. The recommendation is therefore research-more with high valuation and liquidity
    risk: the $8.6 billion 2022 round is a historical reference, not a defensible 2026 entry mark.
sections:
  - id: recommendation-and-price-discipline
    title: Recommendation and price discipline
    body: >-
      The evidence supports a research-more recommendation rather than a priced investment
      decision. Chainalysis can point to 1,500-plus customers, broad exchange penetration, and a
      product that spans 27-plus blockchains, which together indicate a scaled and difficult-to-
      replicate operating asset. Those strengths do not resolve the price question. The last
      independently corroborated valuation in the retained pool is the $8.6 billion Series F mark
      from May 2022, while later databases record an October 2025 financing without a disclosed
      amount. Without current ARR, growth, gross margin, retention, net debt, fully diluted shares,
      or preference terms, neither an enterprise-value multiple nor an equity-return case can be
      calculated responsibly. Entry discipline should therefore be documentary: no price approval
      until management supplies the missing operating and capitalization data.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV007
      - CV015
      - CV016
    tableRefs:
      - TV001
  - id: thesis-and-anti-thesis
    title: Thesis, anti-thesis, and financing context
    body: >-
      The thesis is that Chainalysis occupies a scaled trust layer for crypto markets: its own
      materials describe adoption by major exchanges, regulators, and financial institutions, and
      the Reactor product combines broad chain coverage with a large attribution data set. A BNY
      Mellon integration announcement provides a concrete institutional-use signal. The anti-thesis
      is not primarily product relevance; it is whether an investor can obtain acceptable returns
      after a high historical valuation, opaque 2025 financing, unknown preference overhang, and
      absent current financial statements. Public funding databases also disagree materially on
      cumulative capital and round count. A low-reputation commentary asserts a later $8.6 billion
      transaction and a 20.5-times ARR multiple, but those inputs conflict with the stronger
      retained records and should be treated as an adverse diligence lead, not as a valuation fact.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
      - CV013
      - CV014
      - CV015
    tableRefs:
      - TV002
  - id: scenarios-and-return-logic
    title: Bull, base, and bear scenarios
    body: >-
      Scenario work must remain conditional because the evidence pool cannot support a precise
      2026 valuation range. In the bull case, verified growth, durable retention, attractive
      margins, and clean preferences would allow the 2022 mark to function as a ceiling reference,
      while expanding customer and product coverage would support an eventual strategic or public
      exit. The base case assumes that commercial scale is real but that a discount to the
      historical mark is required for stale pricing, private-company illiquidity, and incomplete
      financial disclosure. The bear case is a no-entry outcome if revenue quality, concentration,
      leverage, or preference seniority is unfavorable. These are decision bands rather than
      invented point estimates; management data must determine the actual range and target return.
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV007
      - CV012
      - CV014
      - CV015
      - CV016
    tableRefs:
      - TV003
  - id: exit-readiness-and-diligence
    title: Exit readiness and thesis-break diligence
    body: >-
      Chainalysis shows operating attributes that could support exit readiness, including a global
      footprint, institutional customer proof, and a broad investigation platform. Public evidence
      does not establish the governance, audit readiness, predictable growth, or financing terms
      required to underwrite an IPO or strategic-sale timetable. The job-openings fetch also
      provides no role count, so hiring cannot be used as a current growth proxy; an independent
      database supplies only a 501-to-1,000 employee band. Final diligence should obtain audited
      revenue and ARR bridges, gross margin, retention, customer concentration, debt documents,
      the fully diluted cap table, liquidation preferences, and secondary-transfer history. Thesis
      break triggers are a material growth shortfall, weak retention, concentrated contract loss,
      senior preference overhang, or an entry price that still relies on the 2022 market regime.
    claimRefs:
      - CV009
      - CV010
      - CV011
      - CV012
      - CV015
      - CV016
    figureRefs:
      - FV001
tables:
  - id: TV001
    title: Recommendation summary
    columns:
      - Decision field
      - Assessment
      - Decision implication
    rows:
      - - Recommendation
        - Research more
        - Do not approve a priced investment before financial and capitalization evidence is supplied.
      - - Confidence
        - Medium on company quality; low on price
        - Product and customer scale are visible, but current financial performance is not.
      - - Risk rating
        - High
        - Valuation, liquidity, dilution, preference, and concentration risks cannot be quantified publicly.
      - - Valuation stance
        - Indeterminate to stretched
        - Treat the $8.6 billion 2022 mark as historical context, not a current fair-value conclusion.
    notes: >-
      Assessments synthesize the retained public sources; no current share price, enterprise value,
      ARR, margin profile, preference stack, or fully diluted capitalization was available.
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV007
      - CV015
      - CV016
  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - Lens
      - Evidence-backed argument
      - What would change the view
    rows:
      - - Thesis
        - Scaled customer adoption and broad product coverage suggest a durable crypto-intelligence asset.
        - Audited growth, retention, and margin evidence would strengthen the quality assessment.
      - - Institutional proof
        - BNY Mellon announced plans to integrate the Chainalysis compliance suite.
        - Reference calls must verify deployment scope, renewal, pricing, and measurable outcomes.
      - - Anti-thesis
        - Historical premium pricing and opaque current financing can overwhelm otherwise strong company quality.
        - A clean cap table, modest preference stack, and a material price reset would reduce the risk.
      - - Evidence conflict
        - Funding databases disagree, and a low-reputation commentary asserts unsupported current valuation inputs.
        - Executed financing documents and a current capitalization schedule must resolve the conflict.
    notes: >-
      Company-issued adoption claims are treated as confirming evidence, not independent benchmarks;
      financing conflicts remain unresolved pending primary transaction documents.
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV007
      - CV009
      - CV013
      - CV014
      - CV015
  - id: TV003
    title: Bull, base, and bear decision bands
    columns:
      - Scenario
      - Explicit assumptions
      - Valuation and return logic
      - Probability signal and downside trigger
    rows:
      - - Bull
        - Verified strong growth, durable retention, attractive margins, clean preferences, and broad customer diversification.
        - The historical $8.6 billion mark may serve only as a ceiling reference; an exact range awaits audited inputs and target-return requirements.
        - Signal is audited acceleration and exit readiness; trigger is failure to substantiate the operating metrics.
      - - Base
        - Commercial scale persists, but growth normalizes and private-company liquidity remains limited.
        - Require a material discount to the historical mark; the evidence does not support a precise percentage or point estimate.
        - Signal is stable renewals and margins; trigger is concentration, weak retention, or restrictive debt.
      - - Bear
        - Revenue quality, concentration, leverage, or preference seniority is materially worse than expected.
        - No priced entry is supportable until terms reset and downside protection is documented.
        - Signal is a financing or operating shortfall; trigger is reliance on stale 2022 pricing without current proof.
    notes: >-
      These are qualitative underwriting bands, not forecasts; precise valuation ranges and returns
      are intentionally left as gaps because current financials and transaction terms are unavailable.
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV007
      - CV012
      - CV014
      - CV015
      - CV016
