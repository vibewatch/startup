  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: underwriting-gap
      missingEvidence: >-
        Current ARR and revenue, growth, gross margin, retention, cohort behavior, segment mix,
        contract duration, and customer concentration.
      whyItMatters: >-
        These inputs determine revenue quality, a supportable valuation multiple, and whether
        customer and product scale convert into durable equity value.
      diligencePath: >-
        Obtain audited financials, monthly ARR bridges, cohort and renewal schedules, segment
        margins, and top-customer concentration directly from management.
      relatedQuestionRefs:
        - QV003
      relatedTableRefs:
        - TV001
        - TV003
    - type: private-evidence-only
      severity: material
      topic: capitalization
      missingEvidence: >-
        Executed 2025 financing and debt documents, fully diluted capitalization, liquidation
        preferences, participation rights, option overhang, and secondary-transfer prices.
      whyItMatters: >-
        Common-equity value and downside protection cannot be inferred from total funding raised or
        an old post-money valuation.
      diligencePath: >-
        Review the current cap table, charter, investor-rights agreements, debt schedules, financing
        closing set, and recent secondary transaction records.
      relatedQuestionRefs:
        - QV004
        - QV005
      relatedTableRefs:
        - TV001
        - TV002
        - TV003
    - type: conflicting-data
      severity: material
      topic: financing-conflict
      missingEvidence: >-
        Primary confirmation of the October or December 2025 transaction date, security type,
        amount, valuation, and investor participation.
      whyItMatters: >-
        Conflicting public records prevent the latest transaction from serving as a reliable
        valuation comparable.
      diligencePath: >-
        Reconcile board approvals, executed purchase or credit agreements, cash receipts, and an
        investor-confirmed transaction summary.
      relatedQuestionRefs:
        - QV001
        - QV005
      relatedTableRefs:
        - TV002
    - type: missing-source
      severity: material
      topic: exit-readiness
      missingEvidence: >-
        Audited-control readiness, governance composition, banker mandate, legal preparedness, and a
        management-approved exit or hold timetable.
      whyItMatters: >-
        Customer scale and product breadth do not establish IPO readiness, strategic demand, or a
        realizable holding period.
      diligencePath: >-
        Interview the board and finance leadership, inspect audit and control workstreams, and obtain
        any formal IPO or strategic-alternative materials.
      relatedQuestionRefs:
        - QV007
      relatedTableRefs:
        - TV003
