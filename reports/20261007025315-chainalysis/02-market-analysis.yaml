callouts:
  - calloutType: "insight"
    title: "The Throughput-to-Software Monetization Gap"
    body: "A fundamental diligence insight in blockchain compliance is the extreme divergence between network transactional velocity and software budget realization. While stablecoins processed $28 trillion in adjusted volume in 2025, commercial software revenue remains tied to human analyst seats, fixed agency allocations, and tiered API monitoring bands rather than basis-point take rates on transaction volume [CM004, CM012, CM015]."
    claimRefs:
      - "CM004"
      - "CM012"
      - "CM015"
  - calloutType: "risk"
    title: "Procurement Frictions and Implementation Surcharges"
    body: "Enterprise software buyers face substantial friction when deploying blockchain intelligence platforms. Beyond base subscription fees, implementation, custom API integrations, and specialized investigator certification courses inflate first-year total cost of ownership by 20% to 40%, creating negotiation friction and elongating enterprise procurement timelines [CM015, CM016]."
    claimRefs:
      - "CM015"
      - "CM016"
