company:
  name: "Chainalysis"
chapter:
  number: 4
  title: "Financials"
  summary: "Public evidence supports an enterprise SaaS and data model, roughly $10,000-per-seat entry pricing, and substantial customer reach, but it does not establish current recognized revenue, gross margin, retention, or sales efficiency. Historical ARR, cash-burn, funding, and valuation estimates conflict or are stale, so audited statements, contract cohorts, and executed debt documents remain prerequisites for underwriting."
sections:
  - id: "revenue-model"
    title: "Revenue Model and Contract Evidence"
    body: "Chainalysis sells blockchain data, software, services, and research to government agencies, exchanges, financial institutions, insurers, and cybersecurity companies. Its named software suite includes KYT for continuous transaction monitoring, Reactor for investigations, and Kryptos for service-level risk intelligence; Sacra additionally describes Alterya, Hexagate, and Data Solutions within a SaaS model. Sacra reports that enterprise pricing varies with company size, seats, and data requirements and starts at roughly $10,000 per seat, but this is an analyst estimate rather than an official list price. The assigned evidence contains no realized pricing, discount schedule, contract duration, implementation fee, or revenue-recognition policy. BNY Mellon's announced plan to use the full compliance suite demonstrates a large-institution use case, not disclosed contract value or recognized revenue."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI005"
    tableRefs:
      - "TI001"
      - "TI002"
    figureRefs:
      - "FI001"
  - id: "traction-and-sales-efficiency"
    title: "Traction Is Visible; Sales Efficiency Is Not"
    body: "The official homepage claims more than 1,500 customers, more than 50 regulators, and adoption by nine of the ten largest crypto exchanges, indicating broad institutional reach across public and private buyers. Public financial estimates are much less comparable. Sacra estimates $190 million of ARR in 2023, up 35% from roughly $140 million in 2022, and records a management projection of $250 million for year-end 2024. A separate August 2026 tear sheet instead reproduces a $87 million September 2025 estimate labeled “revenue / ARR.” Different periods, definitions, and estimation methods prevent treating those values as a clean growth series. No assigned source discloses CAC, CAC payback, sales-cycle length, net revenue retention, logo churn, segment mix, or channel economics, so customer reach cannot yet be translated into efficient or durable growth."
    claimRefs:
      - "CI004"
      - "CI006"
      - "CI007"
      - "CI008"
      - "CI016"
    tableRefs:
      - "TI003"
  - id: "costs-and-capital"
    title: "Cost Structure and Capital Adequacy"
    body: "The cost base is only directionally visible. Chainalysis says research and development is central to its data platform and describes a global operating footprint, while its job-openings page exposes no vacancy count in the fetched text. Those signals are consistent with material technical and international operating costs but do not quantify cloud infrastructure, licensed data, service-delivery labor, commissions, capex, or working capital. Sacra estimates that Chainalysis held approximately $200 million of cash and burned about $40 million during the second half of 2023; that historical cash-consumption estimate is neither an accounting loss nor evidence of current runway. Sacra also reports an approximately $9 million senior secured Hercules facility maturing in October 2028, but draw status, interest, covenants, and collateral details are not public in the assigned evidence."
    claimRefs:
      - "CI009"
      - "CI010"
      - "CI013"
      - "CI014"
      - "CI016"
  - id: "underwriting-verdict"
    title: "Financial Verdict and Diligence Blockers"
    body: "Funding raised should not be treated as cash available. FundedIQ tracks $370 million across four disclosed records and excludes one October 2025 round with no announced amount, while Sacra, the August 2026 tear sheet, and Private Market View report materially different cumulative totals of $536.6 million, $538.1 million, and $587.4 million. The disagreement reflects coverage and methodology differences that require a cap-table reconciliation rather than an averaged estimate. Private Market View's October 2026 mark of $1.3 billion, down 85% from the referenced $8.6 billion later-stage valuation, is an adverse market signal but not proof of operating deterioration. The financial verdict is therefore mixed: the business model and institutional reach appear credible, while revenue quality, margin path, capital intensity, runway, and debt capacity remain unverified. Underwriting should wait for audited statements, ARR-to-GAAP reconciliation, customer cohorts, and executed financing documents."
    claimRefs:
      - "CI011"
      - "CI012"
      - "CI015"
      - "CI016"
