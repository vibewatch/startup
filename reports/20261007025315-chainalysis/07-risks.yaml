  evidenceGaps:
    - type: "missing-source"
      severity: "material"
      topic: "litigation-enforcement-incidents"
      missingEvidence: >-
        A complete current record of litigation, enforcement matters, outages, breaches,
        contractual service failures, and resulting customer or regulator actions.
      whyItMatters: >-
        Absence of an incident in the assigned pool does not establish absence, while undisclosed
        events could change legal exposure and confidence in operational resilience.
      diligencePath: >-
        Review company legal schedules, regulator and court dockets, cyber-insurance claims,
        status history, postmortems, customer notices, and incident-response records.
      relatedQuestionRefs:
        - "QR009"
      relatedTableRefs:
        - "TR001"
        - "TR002"
    - type: "private-evidence-only"
      severity: "material"
      topic: "model-quality-and-reliability"
      missingEvidence: >-
        Chainalysis-specific false-positive, false-negative, reproducibility, confidence
        calibration, uptime, latency, and incident metrics by chain and product.
      whyItMatters: >-
        Regulatory suitability and customer outcomes depend on measured performance, not solely
        on proposed standards, aggregate coverage, or product descriptions.
      diligencePath: >-
        Commission independent benchmark tests, inspect model-validation reports, and reconcile
        results with contractual SLAs and representative customer workflows.
      relatedQuestionRefs:
        - "QR002"
        - "QR008"
      relatedTableRefs:
        - "TR002"
    - type: "private-evidence-only"
      severity: "material"
      topic: "customer-durability-and-concentration"
      missingEvidence: >-
        Current production deployments, renewal cohorts, gross and net retention, customer
        concentration, and public-sector versus private-sector revenue mix.
      whyItMatters: >-
        A customer-count claim and historical planned integration do not show revenue durability,
        expansion, concentration, or current production use.
      diligencePath: >-
        Reconcile billing records with contracts, go-live status, renewal cohorts, reference
        calls, product usage, and top-customer revenue exposure.
      relatedQuestionRefs:
        - "QR005"
        - "QR007"
      relatedTableRefs:
        - "TR003"
    - type: "stale"
      severity: "material"
      topic: "current-financial-resilience"
      missingEvidence: >-
        Current revenue, ARR, gross margin, operating loss, cash balance, debt, burn, runway,
        cap table, preference stack, and current transaction-derived valuation evidence.
      whyItMatters: >-
        A 2022 funding round is not evidence of current cash availability, profitability,
        financing capacity, or enterprise value.
      diligencePath: >-
        Obtain audited statements, monthly management accounts, financing documents, debt
        covenants, board-approved forecast, cap table, and recent secondary transaction records.
      relatedQuestionRefs:
        - "QR006"
      relatedTableRefs:
        - "TR003"
    - type: "private-evidence-only"
      severity: "material"
      topic: "buyer-specific-total-cost"
      missingEvidence: >-
        Contracted subscription, implementation, support, usage-escalator, renewal, migration,
        and termination costs for representative buyer workloads.
      whyItMatters: >-
        Quote-based pricing and undisclosed service fees prevent a supportable view of customer
        payback, margin pressure, and switching risk.
      diligencePath: >-
        Obtain recent proposals and executed statements of work, then model total cost under
        base, peak-volume, extra-chain, renewal, and exit scenarios.
      relatedQuestionRefs:
        - "QR003"
      relatedTableRefs:
        - "TR003"
