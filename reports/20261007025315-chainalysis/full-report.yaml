              - CU013
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Entrenched Public-Sector and Institutional Moat
            body: >-
              Chainalysis has established an unparalleled network effect across 1,500+ client organizations, including
              330 government agencies and 9 of the top 10 global cryptocurrency exchanges. This structural footprint
              creates deep data feedback loops where investigative breakthroughs reinforce entity clustering accuracy,
              making replacement extraordinarily costly for compliance officers.
            calloutType: strength
            claimRefs:
              - CU006
              - CU008
              - CU010
          - type: callout
            title: Aggressive Renewal Pricing Sparks Multi-Vendor Pressure
            body: >-
              As Chainalysis positions for an IPO at an $8.6B valuation multiple on $420M ARR, enterprise accounts face
              10% to 15% pricing increases upon renewal. Combined with concerns over platform lock-in as Chainalysis
              expands into adjacent compliance modules, financial institutions are actively maintaining secondary vendor
              pilots with TRM Labs and Elliptic.
            calloutType: risk
            claimRefs:
              - CU014
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory qualification is both an opportunity and a control risk
        blocks:
          - type: paragraph
            body: >-
              Chainalysis is advocating rules that would make blockchain analytics part of tokenized securities
              surveillance and stablecoin supervision, but the assigned evidence contains company comments rather than
              adopted agency standards. Its July 2026 SEC submission asks for an alternative audit-trail rulemaking and
              a pseudonymous-first surveillance design. Its May 2026 OCC submission asks for mandatory analytics
              capabilities, distinct standards for structural and attribution outputs, and due diligence on analytics
              providers. These proposals support demand, yet also create qualification risk: future accuracy, privacy,
              audit, or interoperability requirements may differ from the company's preferred design. The investment
              case should therefore treat regulatory embedding as contingent upside, not as an established mandate,
              until final rules and examiner practices are available.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
      - number: '7.2'
        title: Model quality and chain heterogeneity keep residual operating risk high
        blocks:
          - type: paragraph
            body: >-
              Product reliability depends on more than breadth of chain coverage. Chainalysis's own tokenization
              analysis describes trade-offs across speed, cost volatility, contagion, illicit exposure, and governance,
              and warns that soft finality can differ from base-layer settlement. Its OCC comment separately argues that
              deterministic structural results and probabilistic attribution require different quality standards. An
              independent procurement guide adds that false positives remain an analyst concern, transparency
              expectations vary by regulator, and deployment requires integration, calibration, staffing, and audit
              documentation. These sources do not establish Chainalysis-specific error rates, uptime, or incident
              performance. Until those records are produced, broad coverage and marketing scale should not be treated as
              proof of consistent accuracy or operational resilience.
            claimRefs:
              - CR004
              - CR006
              - CR007
              - CR008
              - CR009
              - CR011
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
