      - number: '4.4'
        title: Financial Verdict and Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              Funding raised should not be treated as cash available. FundedIQ tracks $370 million across four disclosed
              records and excludes one October 2025 round with no announced amount, while Sacra, the August 2026 tear
              sheet, and Private Market View report materially different cumulative totals of $536.6 million, $538.1
              million, and $587.4 million. The disagreement reflects coverage and methodology differences that require a
              cap-table reconciliation rather than an averaged estimate. Private Market View's October 2026 mark of $1.3
              billion, down 85% from the referenced $8.6 billion later-stage valuation, is an adverse market signal but
              not proof of operating deterioration. The financial verdict is therefore mixed: the business model and
              institutional reach appear credible, while revenue quality, margin path, capital intensity, runway, and
              debt capacity remain unverified. Underwriting should wait for audited statements, ARR-to-GAAP
              reconciliation, customer cohorts, and executed financing documents.
