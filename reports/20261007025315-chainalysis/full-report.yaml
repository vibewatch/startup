              - CU008
      - number: '6.2'
        title: Adoption Trajectory and Enterprise Network Scale
        blocks:
          - type: paragraph
            body: >-
              The adoption trajectory of the Chainalysis platform reflects steady institutional expansion across global
              jurisdictions. From 750 verified customers in May 2022, documented customer accounts reached over 1,200
              organizations by late 2025 and 1,500 organizations by 2026 across more than 70 countries. Large enterprise
              accounts have scaled in tandem, with clients generating over $100k in annual recurring revenue expanding
              significantly. Usage intensity is concentrated across two flagship products: Chainalysis KYT for
              high-throughput automated transaction screening and Chainalysis Reactor for forensic investigations. Over
              1,500 organizations utilize KYT intelligence daily, screening more than $4 trillion in annualized
              transaction volume, while Reactor is deployed across 330 government agencies worldwide. However, total
              customer account metrics conflate departmental enterprise seats with small commercial subscriptions,
              leaving average contract value benchmarks and exact net revenue retention undisclosed.
            claimRefs:
              - CU003
              - CU005
              - CU006
              - CU007
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
