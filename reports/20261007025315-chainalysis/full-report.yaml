      - number: '5.2'
        title: Technology Architecture, Engineering Stack, and Dual Deployment Models
        blocks:
          - type: paragraph
            body: >-
              The underlying technology architecture of Chainalysis is structured as an end-to-end distributed data
              processing and analytical pipeline designed to handle massive public blockchain transaction volumes while
              meeting rigorous defense-grade operating criteria. The data ingestion layer connects to full nodes across
              45 supported blockchains, streaming raw block events and mempool transactions into an event-driven
              ingestion backbone powered by Apache Kafka and cloud services on Amazon Web Services (AWS). Within the
              core intelligence engine, proprietary heuristics, transaction clustering algorithms, and machine learning
              entity resolution models continuously aggregate individual wallet addresses into cohesive behavioral
              entities. Data engineers and distributed systems teams build backend services primarily in Go and Java,
              utilizing Terraform for infrastructure-as-code orchestration across AWS EC2, S3, EBS, Lambda, and
              CloudFront. Transaction state and relational metadata are managed in PostgreSQL clusters, while
              observability is maintained through Prometheus, Grafana, Datadog, and Humio. A critical architectural
              capability is Chainalysis's dual deployment model: while commercial crypto exchanges and financial
              institutions access software-as-a-service (SaaS) and REST APIs hosted in the cloud, national security and
              defense customers require deployments inside fully air-gapped on-premises government enclaves. To satisfy
              these sovereign constraints, the Government Systems engineering group maintains specialized Go CLI
              installer tooling and Java data delivery pipelines that package multi-terabyte blockchain datasets,
              manifest templates, and container images for automated provisioning into air-gapped Kubernetes clusters
              running RKE2, Helm, Kustomize, and Flux CD. System administrators inside air-gapped facilities interact
              with an isolated admin portal powered by a Node.js backend and React frontend to configure role-based
              access control (RBAC), multi-tenant isolation, and cluster health monitoring.
            claimRefs:
              - CE008
              - CE009
              - CE010
              - CE011
              - CE012
              - CE013
