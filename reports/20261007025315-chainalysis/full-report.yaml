      - number: '4.3'
        title: Cost Structure and Capital Adequacy
        blocks:
          - type: paragraph
            body: >-
              The cost base is only directionally visible. Chainalysis says research and development is central to its
              data platform and describes a global operating footprint, while its job-openings page exposes no vacancy
              count in the fetched text. Those signals are consistent with material technical and international
              operating costs but do not quantify cloud infrastructure, licensed data, service-delivery labor,
              commissions, capex, or working capital. Sacra estimates that Chainalysis held approximately $200 million
