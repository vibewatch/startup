  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Scope, and Substitutes
        blocks:
          - type: paragraph
            body: >-
              The market for blockchain data intelligence occupies a specialized intersection of anti-money laundering
              compliance, threat forensics, and regulatory analytics. Spend within this boundary encompasses software
              subscriptions for on-chain transaction monitoring, entity clustering and attribution databases, forensic
              tracing software for criminal investigators, and commercial market intelligence feeds. Conversely, the
              category excludes general enterprise cybersecurity tooling (SIEM, endpoint detection, firewall telemetry),
              standard fiat AML/KYC watchlist screening engines that lack native graph-clustering algorithms, and raw
              infrastructure node hosting. Status-quo alternatives remain firmly entrenched across both public and
              private sectors: law enforcement agencies frequently attempt manual block-explorer auditing alongside
              subpoena-driven disclosure requests, while traditional financial institutions routinely default to
              de-risking by wholesale offboarding digital asset counterparties rather than licensing dedicated
              monitoring software [CM001, CM002, CM003].
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM011
              - CM013
      - number: '2.2'
        title: 'Market Sizing: TAM, SAM, and SOM Under Conflicting Lenses'
        blocks:
          - type: paragraph
            body: >-
              Evaluating the addressable market for blockchain compliance requires separating gross transactional volume
              on public blockchains from captured enterprise software ARR. While Chainalysis estimates that adjusted
              stablecoin volume alone reached $28 trillion in organic economic activity in 2025, commercial software
              expenditures to monitor and investigate these rails represent a small fraction of overall network
              throughput [CM004, CM005]. Analyst models and industry benchmarks project the specialized cryptocurrency
              compliance and investigation software TAM between $1.5 billion and $2.8 billion globally, supported by
              approximately 1,500 active enterprise and government logos worldwide [CM006, CM007]. Chainalysis's
              serviceable addressable market (SAM) concentrates across roughly 330 public sector law enforcement and
              regulatory bodies alongside Tier-1 crypto exchanges and global systemically important banks, where
              realized ARR reached $420 million in 2025 [CM008, CM009]. Sizing diligence reveals persistent variance
              between optimistic vendor projections and third-party firmographic estimates [CM010].
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM006
              - CM009
              - CM010
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM006
              - CM009
              - CM010
      - number: '2.3'
        title: Buyer Segmentation, Budget Ownership, and Procurement Pathways
        blocks:
          - type: paragraph
            body: >-
              Purchasing dynamics fragment across three distinct buyer categories with non-interchangeable procurement
              cycles. Law enforcement and intelligence agencies fund Chainalysis Reactor from forfeiture funds, forensic
              equipment allocations, or dedicated agency budget lines, requiring strict evidence admissibility and
              Daubert-tested legal standards [CM001, CM008]. Regulated cryptocurrency exchanges and payment processors
              procure Chainalysis KYT through compliance, AML, and risk operations budgets, where pricing scales with
              monthly transaction volume and supported blockchain networks [CM011, CM012]. Global systemically important
              banks and asset servicers, exemplified by BNY Mellon's digital asset platform deployment, purchase
              enterprise bundles via institutional innovation and risk management budgets [CM013, CM014]. In all cases,
              contract negotiations feature multi-year commitments that unlock 15% to 30% discounts, offset by annual
              price escalation clauses of 3% to 7% [CM015].
            claimRefs:
              - CM001
              - CM008
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM008
              - CM011
              - CM013
              - CM014
      - number: '2.4'
        title: Structural Growth Drivers and Commercial Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              Sector expansion is driven by structural catalysts, notably statutory mandates under the U.S. GENIUS Act,
              European MiCA regulations, and the expansion of stablecoin payments across cross-border settlement [CM004,
              CM009]. However, adoption faces friction from procurement inertia, customer concentration, and integration
              overhead. Third-party procurement benchmarks indicate that total cost of ownership often exceeds initial
              subscription fees by 20% to 40% when accounting for implementation, specialized staff training, and API
              usage [CM015, CM016]. Furthermore, public-sector pricing power is tempered by fixed government
              appropriations, while private-sector crypto volatility directly impacts the transaction volume tiers that
              govern KYT revenue [CM009, CM012].
            claimRefs:
              - CM004
              - CM009
              - CM012
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Throughput-to-Software Monetization Gap
            body: >-
              A fundamental diligence insight in blockchain compliance is the extreme divergence between network
              transactional velocity and software budget realization. While stablecoins processed $28 trillion in
              adjusted volume in 2025, commercial software revenue remains tied to human analyst seats, fixed agency
              allocations, and tiered API monitoring bands rather than basis-point take rates on transaction volume
              [CM004, CM012, CM015].
            calloutType: insight
            claimRefs:
              - CM004
              - CM012
              - CM015
          - type: callout
            title: Procurement Frictions and Implementation Surcharges
            body: >-
              Enterprise software buyers face substantial friction when deploying blockchain intelligence platforms.
              Beyond base subscription fees, implementation, custom API integrations, and specialized investigator
              certification courses inflate first-year total cost of ownership by 20% to 40%, creating negotiation
              friction and elongating enterprise procurement timelines [CM015, CM016].
            calloutType: risk
            claimRefs:
              - CM015
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct Competitors and Practical Substitutes
        blocks:
          - type: paragraph
            body: >-
              The assigned comparison evidence names Elliptic, TRM Labs, Merkle Science, and Scorechain as the principal
              direct alternatives to Chainalysis, while describing all five as providers of transaction monitoring and
              investigation workflows [CP001, CP003]. The same evidence also identifies a practical substitute: a buyer
              that already operates case management, customer-risk, and sanctions systems may procure an API-first
              blockchain-intelligence layer rather than replace the wider compliance stack [CP015]. Internal tooling and
              manual blockchain explorers therefore matter as status-quo options, but the evidence does not show that
              they replicate commercial entity-attribution data. A generic software directory is too noisy to define
              this market because its fetched alternatives include unrelated accounting, HR, CRM, and payroll products
              [CP016].
            claimRefs:
              - CP001
              - CP003
              - CP015
              - CP016
          - type: table
