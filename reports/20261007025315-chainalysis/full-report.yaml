  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Core Product Suite, Enterprise Modules, and Investigative Workflows
        blocks:
          - type: paragraph
            body: >-
              Chainalysis delivers an integrated enterprise product suite engineered to transform raw, pseudonymous
              distributed ledger transactions into actionable identity attribution and compliance intelligence. The
              operational core of the platform is organized across three primary application suites alongside developer
              integration surfaces: Chainalysis Reactor, Chainalysis KYT (Know Your Transaction), and Chainalysis
              Kryptos. Reactor serves as the visual graph forensics and investigative environment utilized by federal
              law enforcement agencies, cybercrime task forces, and national security investigators to trace illicit
              fund flows across multi-hop hops, peel chains, and mixing services. It allows analysts to search by
              transaction hash or wallet address, visualize entity clusters, and correlate on-chain movements with
              verified real-world service tags. For continuous regulatory compliance, Chainalysis KYT provides an
              automated, low-latency API and web interface designed for cryptocurrency exchanges, custodian banks, and
              fintechs to conduct real-time anti-money laundering (AML) and counter-terrorist financing (CFT)
              transaction screening. KYT automatically evaluates deposits and withdrawals against configurable risk
              score thresholds, flagging sanctioned addresses, darknet market counterparties, mixer exposure, and
              suspicious transaction structuring patterns. Complementing operational monitoring, Chainalysis Kryptos
              provides institutional investors, compliance officers, and global systemically important banks—such as BNY
              Mellon—with macro-level counterparty intelligence and risk profiles covering centralized exchanges,
              liquidity pools, and digital asset service providers. To eliminate workflow friction across disparate
              intelligence tools, Chainalysis partners with external digital forensics providers such as Penlink,
              allowing joint defense and law enforcement customers to query Chainalysis intelligence directly within
              unified open-source intelligence (OSINT) and geospatial investigative environments.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
