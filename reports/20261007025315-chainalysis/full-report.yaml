  - id: FE001
    title: Chainalysis Platform Architecture and Operating Stack
    type: stack
    summary: >-
      Architectural overview illustrating data ingestion from 45+ blockchains, distributed data pipelines, core
      clustering and AI engines, dual deployment delivery, and application interfaces.
    data:
      layers:
        - label: Application & Interface Layer
          detail: >-
            Frontend interfaces and developer integration endpoints providing investigative forensics, compliance
            screening, and partner workflows.
          modules:
            - Chainalysis Reactor (Visual Graph Tracing)
            - Chainalysis KYT (Real-Time Transaction Screening)
            - Chainalysis Kryptos (Institutional Directory & Due Diligence)
            - Partner Integrations (Penlink OSINT / Telecom Federation)
            - Developer REST APIs & Webhooks
          outputs:
            - Forensic case dossiers
            - Automated AML risk alerts
            - Counterparty risk profiles
        - label: Delivery & Provisioning Layer
          detail: Automated air-gapped software packaging and sovereign installation tooling.
          modules:
            - Air-Gapped Government Installer (Go CLI)
            - Manifest Rendering & Image Mirroring Engines
            - Cloud Packaging & Artifact Signing Pipelines
          outputs:
            - Air-gapped deployment bundles
            - Cryptographic container signatures
        - label: Sovereign & Cloud Infrastructure Layer
          detail: Dual operating model supporting multi-tenant cloud SaaS and air-gapped on-premises government enclaves.
          modules:
            - Cloud SaaS Infrastructure (AWS EC2, S3, EBS, Lambda, CloudFront)
            - On-Premises Kubernetes Clusters (RKE2, Helm, Kustomize, Flux CD)
            - Admin Portal UI & RBAC Service (React, Node.js, PostgreSQL)
          outputs:
            - Isolated government enclaves
            - FedRAMP audit logging
        - label: Intelligence & Heuristics Layer
          detail: >-
            Core analytical engine that correlates raw ledger cryptography with verified real-world entities and risk
            typologies.
          modules:
            - Proprietary Clustering Heuristics (Multi-Input Aggregation)
            - Entity Attribution Database (Exchanges, Sanctions, Darknet)
            - AI & Predictive Risk Scoring Models
            - Cross-Chain Graph Tracing Algorithms
          outputs:
            - Attributed entity clusters
            - Deterministic risk scoring
            - Daubert-compliant forensic evidence
        - label: Data Pipeline & Storage Layer
          detail: Scalable event-driven data processing backbone and persistent relational state stores.
          modules:
            - Event Streaming Backbone (Apache Kafka)
            - Distributed Database Tier (PostgreSQL)
            - Cloud Data Packaging Services (Java Services)
          outputs:
            - Streamed transaction events
            - Persistent metadata state
        - label: Ledger Ingestion Layer
          detail: Multi-chain node infrastructure continuously ingesting raw blocks and mempool events across 45 blockchains.
          modules:
            - Multi-Chain Full Node Ingestion (45 Blockchains)
            - UTXO & Account State Indexers
            - RPC Client Pools & Node Health Checkers
          outputs:
            - Normalized transaction event streams
            - Signed, packaged blockchain data archives
    approximationNotes: >-
      Architecture reflects technical job specifications, official platform documentation, and developer integration
      literature.
