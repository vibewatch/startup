              - CU014
              - CU015
      - number: '6.3'
        title: Named Deployments, Expansion Dynamics, and Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              Production deployment case studies confirm mission-critical integration across premier institutions. The
              United States Department of Justice, IRS Criminal Investigation, and Homeland Security Investigations rely
              on Chainalysis Reactor for large-scale darknet takedowns and illicit fund seizures totaling over $34
              billion. In commercial finance, BNY Mellon selected the full Chainalysis software suite to support custody
              risk management as the first Global Systemically Important Bank to deploy the platform. High-volume
              cryptocurrency exchanges including Coinbase and Upbit have embedded Reactor and KYT directly into their
              automated transaction surveillance and anti-money laundering frameworks. Despite this entrenched
              footprint, customers face significant expansion friction. Industry intelligence briefs indicate enterprise
              renewals encounter 10% to 15% pricing increases as Chainalysis seeks to support aggressive pre-IPO
              valuation multiples. This pricing pressure, combined with high switching costs from cumulative address
              clustering and investigative workflows, elevates vendor lock-in risks and encourages compliance officers
              to evaluate multi-vendor architectures alongside TRM Labs and Elliptic.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
              - CU015
          - type: table
            tableRef: TU003
            claimRefs:
