              - CP005
              - CP006
              - CP011
      - number: '3.4'
        title: Moat Durability and Displacement Risk
        blocks:
          - type: paragraph
            body: >-
              Chainalysis's strongest observable moat in this evidence set is distribution and workflow entrenchment
              rather than a proven accuracy lead. The company-reported customer, exchange, regulator, and bank adoption
              signals imply integration and institutional familiarity that can raise switching costs [CP007, CP008,
              CP009, CP010]. Against that, an independent review characterizes the platform as expensive,
              enterprise-only software and cautions that address attribution and risk scoring use heuristics that are
              not infallible and raise privacy debates [CP011, CP012]. Feature convergence creates multi-homing and
              modular-substitution risk, especially where a buyer can retain its existing compliance stack and consume
              risk data by API [CP003, CP015]. The assigned pool contains no controlled false-positive, recall,
              attribution-error, or migration benchmark, so differentiation durability remains unproven rather than
              disproven.
            claimRefs:
              - CP003
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
              - CP015
