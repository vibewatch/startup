              - CR008
              - CR009
              - CR011
              - CR015
      - number: '7.3'
        title: Public adoption signals do not resolve concentration or financial opacity
        blocks:
          - type: paragraph
            body: >-
              Public evidence shows reach but not durability. Chainalysis currently claims more than 1,500 customers,
              while its older BNY Mellon announcement described a planned use of the product suite rather than evidence
              of current production scope or renewal. The assigned independent source says subscriptions are
              quote-based, total cost remains custom, and implementation and advisory fees are not public. TechCrunch
              documented a $170 million Series F at an $8.6 billion valuation in 2022, but that historical financing
              event does not establish present cash, burn, profitability, or valuation. Customer concentration, renewal
              behavior, government/private revenue mix, current deployment status, and capital needs therefore remain
              unquantified dependencies rather than supportable conclusions.
            claimRefs:
              - CR009
              - CR010
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR009
              - CR010
              - CR012
              - CR013
              - CR014
      - number: '7.4'
        title: Mitigation maturity must be demonstrated, not inferred
        blocks:
          - type: paragraph
            body: >-
              The strongest available mitigation is procedural: separate deterministic outputs from probabilistic
              attribution, preserve confidence and provenance through downstream systems, validate representative chain
              workflows, and contract for measurable service and incident obligations. The thesis should pause if
              Chainalysis cannot provide independent error characterization, current uptime and incident history, or a
              machine-readable distinction between output tiers. It should also pause if customer-level diligence cannot
              reconcile the claimed customer scale with renewals, concentration, and production deployments. Pricing,
              implementation services, and volume escalators require a buyer-specific statement of work. Any undisclosed
              material enforcement matter, repeated failure to meet contracted service levels, or inability to reproduce
              attribution results would break the defensibility premise rather than merely lower the growth case.
            claimRefs:
              - CR004
              - CR005
              - CR009
              - CR010
              - CR011
              - CR014
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
