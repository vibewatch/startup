      - number: '3.3'
        title: Pricing Opacity and Distribution Power
        blocks:
          - type: paragraph
            body: >-
              Public pricing is not sufficiently consistent for a clean vendor cost ranking. CostBench describes
              Chainalysis as custom-priced with separate KYT and Reactor plans, and says cost varies with seats, company
              size, and data requirements [CP004]. The same page gives two materially different benchmarks with
              different provenance: a $18,500 annual median from 16 community purchase mentions and a $174,709 median
              annual contract value attributed to Vendr deal flow for enterprise-scale access [CP005, CP006]. Neither
              number is ARR, revenue, cash, or a universal list price. Distribution is clearer than pricing: Chainalysis
              claims 1,500+ customers, nine of the top ten crypto exchanges, and more than 50 regulators use its data
              [CP007, CP008, CP009]. Its company-issued BNY Mellon announcement also documents a planned full-suite
              integration by a Global Systemically Important Bank [CP010].
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
          - type: table
            tableRef: TP003
            claimRefs:
