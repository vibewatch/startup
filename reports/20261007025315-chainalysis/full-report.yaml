    sections:
      - number: '1.1'
        title: Identity and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Chainalysis positions itself as a blockchain-data platform that combines data, AI-powered software,
              services, and research for government agencies, exchanges, financial institutions, and cybersecurity
              companies. Its company page claims operations in more than 70 countries, while a third-party profile
              places its founding in 2014 and headquarters in New York. The current homepage further claims more than
              1,500 customers. These facts establish a scaled, multi-segment compliance and investigations vendor, but
              they should not be read as audited commercial metrics: the geographic and customer figures are
              company-issued and the legal entity structure is not exposed in the assigned evidence.
