      - number: '3.2'
        title: Capability Convergence and Positioning
        blocks:
          - type: paragraph
            body: >-
              The leading vendors increasingly converge on wallet screening, transaction monitoring, cross-chain
              tracing, behavioral detection, investigations, APIs, and case management [CP003]. Published coverage
              remains a weak standalone ranking variable: the comparison source reports 400+ networks for Chainalysis
              KYT, 184+ screening networks and 65+ fully traced networks for TRM Labs, 65+ blockchains and 250+ bridges
              for Elliptic, 10,000+ assets and 200 bridges for Merkle Science, and 25+ blockchains for Scorechain, but
              explicitly warns that those denominators are not interchangeable [CP002]. Chainalysis also says its data
              platform underpins its investigation and compliance suite, reinforcing that buyers are purchasing data and
              attribution as well as workflow software [CP013]. Product selection should therefore test the buyer's
              actual chains, bridges, latency, explainability, and alert workload rather than reward the largest
              headline count.
            claimRefs:
              - CP002
              - CP003
              - CP013
