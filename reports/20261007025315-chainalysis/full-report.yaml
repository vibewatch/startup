              - CR006
              - CR010
              - CR011
              - CR012
              - CR014
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Gate the thesis on reproducibility and operating evidence
            body: >-
              Require independent error characterization, output-tier provenance, representative chain tests, incident
              and SLA history, renewal cohorts, concentration data, and a priced statement of work before treating
              regulatory embedding or customer scale as durable.
            calloutType: recommendation
            claimRefs:
              - CR004
              - CR005
              - CR009
              - CR011
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a research-more recommendation rather than a priced investment decision. Chainalysis
              can point to 1,500-plus customers, broad exchange penetration, and a product that spans 27-plus
              blockchains, which together indicate a scaled and difficult-to- replicate operating asset. Those strengths
              do not resolve the price question. The last independently corroborated valuation in the retained pool is
              the $8.6 billion Series F mark from May 2022, while later databases record an October 2025 financing
              without a disclosed amount. Without current ARR, growth, gross margin, retention, net debt, fully diluted
              shares, or preference terms, neither an enterprise-value multiple nor an equity-return case can be
              calculated responsibly. Entry discipline should therefore be documentary: no price approval until
              management supplies the missing operating and capitalization data.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV007
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV007
              - CV015
              - CV016
      - number: '8.2'
        title: Thesis, anti-thesis, and financing context
        blocks:
          - type: paragraph
            body: >-
              The thesis is that Chainalysis occupies a scaled trust layer for crypto markets: its own materials
              describe adoption by major exchanges, regulators, and financial institutions, and the Reactor product
              combines broad chain coverage with a large attribution data set. A BNY Mellon integration announcement
              provides a concrete institutional-use signal. The anti-thesis is not primarily product relevance; it is
              whether an investor can obtain acceptable returns after a high historical valuation, opaque 2025
              financing, unknown preference overhang, and absent current financial statements. Public funding databases
              also disagree materially on cumulative capital and round count. A low-reputation commentary asserts a
              later $8.6 billion transaction and a 20.5-times ARR multiple, but those inputs conflict with the stronger
              retained records and should be treated as an adverse diligence lead, not as a valuation fact.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV009
              - CV013
              - CV014
              - CV015
      - number: '8.3'
        title: Bull, base, and bear scenarios
        blocks:
          - type: paragraph
            body: >-
              Scenario work must remain conditional because the evidence pool cannot support a precise 2026 valuation
              range. In the bull case, verified growth, durable retention, attractive margins, and clean preferences
              would allow the 2022 mark to function as a ceiling reference, while expanding customer and product
              coverage would support an eventual strategic or public exit. The base case assumes that commercial scale
              is real but that a discount to the historical mark is required for stale pricing, private-company
              illiquidity, and incomplete financial disclosure. The bear case is a no-entry outcome if revenue quality,
              concentration, leverage, or preference seniority is unfavorable. These are decision bands rather than
              invented point estimates; management data must determine the actual range and target return.
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV007
              - CV012
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV007
              - CV012
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Exit readiness and thesis-break diligence
        blocks:
          - type: paragraph
            body: >-
              Chainalysis shows operating attributes that could support exit readiness, including a global footprint,
              institutional customer proof, and a broad investigation platform. Public evidence does not establish the
              governance, audit readiness, predictable growth, or financing terms required to underwrite an IPO or
              strategic-sale timetable. The job-openings fetch also provides no role count, so hiring cannot be used as
              a current growth proxy; an independent database supplies only a 501-to-1,000 employee band. Final
              diligence should obtain audited revenue and ARR bridges, gross margin, retention, customer concentration,
              debt documents, the fully diluted cap table, liquidation preferences, and secondary-transfer history.
              Thesis break triggers are a material growth shortfall, weak retention, concentrated contract loss, senior
              preference overhang, or an entry price that still relies on the 2022 market regime.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV007
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price is the gating fact
            body: >-
              Company quality may justify continued diligence, but public evidence does not justify a current entry
              valuation. Require primary financials, financing documents, and the preference stack before converting the
              research-more stance into an investable recommendation.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV015
              - CV016
