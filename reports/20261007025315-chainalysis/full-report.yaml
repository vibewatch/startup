            body: >-
              Company-issued disclosures claim 1,500+ customers, nine of the top ten crypto exchanges, and more than 50
              regulators, while the BNY Mellon announcement documents a planned full-suite integration at a Global
              Systemically Important Bank [CP007, CP008, CP009, CP010].
