  title: "Customers"
  summary: "Chainalysis has built the premier customer network in blockchain intelligence, spanning over 1,500 commercial and public-sector organizations across more than 70 countries. Adoption is anchored by high-retention public-sector agencies and top crypto exchanges, though expansion faces pricing resistance and vendor lock-in concerns."
sections:
  - id: "customer-segmentation-and-structure"
    title: "Customer Segmentation and Sector Distribution"
    body: "Chainalysis segments its enterprise customer base across three primary pillars: government agencies, cryptocurrency-native businesses, and traditional financial institutions. Public-sector customers represent approximately 40% of recurring revenue, driven by multi-year law enforcement and intelligence procurement across federal, state, and international jurisdictions. Crypto-native businesses such as centralized exchanges, custodians, and payment processors contribute 25% of revenue, where regulatory mandates require real-time transaction monitoring and wallet screening. Traditional financial institutions and asset servicers comprise the remaining 35% of revenue as Tier-1 global institutions integrate blockchain compliance suites for digital asset custody and risk management workflows. While government accounts provide durable revenue baselines insulated from crypto market drawdowns, private-sector demand exhibits higher sensitivity to trading volume cycles and regulatory clarity."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU004"
      - "CU008"
    tableRefs:
      - "TU001"
  - id: "adoption-trajectory-and-scale"
    title: "Adoption Trajectory and Enterprise Network Scale"
    body: "The adoption trajectory of the Chainalysis platform reflects steady institutional expansion across global jurisdictions. From 750 verified customers in May 2022, documented customer accounts reached over 1,200 organizations by late 2025 and 1,500 organizations by 2026 across more than 70 countries. Large enterprise accounts have scaled in tandem, with clients generating over $100k in annual recurring revenue expanding significantly. Usage intensity is concentrated across two flagship products: Chainalysis KYT for high-throughput automated transaction screening and Chainalysis Reactor for forensic investigations. Over 1,500 organizations utilize KYT intelligence daily, screening more than $4 trillion in annualized transaction volume, while Reactor is deployed across 330 government agencies worldwide. However, total customer account metrics conflate departmental enterprise seats with small commercial subscriptions, leaving average contract value benchmarks and exact net revenue retention undisclosed."
    claimRefs:
      - "CU003"
      - "CU005"
      - "CU006"
      - "CU007"
      - "CU009"
    tableRefs:
      - "TU002"
    figureRefs:
      - "FU001"
  - id: "named-deployments-and-retention-risks"
    title: "Named Deployments, Expansion Dynamics, and Concentration Risks"
    body: "Production deployment case studies confirm mission-critical integration across premier institutions. The United States Department of Justice, IRS Criminal Investigation, and Homeland Security Investigations rely on Chainalysis Reactor for large-scale darknet takedowns and illicit fund seizures totaling over $34 billion. In commercial finance, BNY Mellon selected the full Chainalysis software suite to support custody risk management as the first Global Systemically Important Bank to deploy the platform. High-volume cryptocurrency exchanges including Coinbase and Upbit have embedded Reactor and KYT directly into their automated transaction surveillance and anti-money laundering frameworks. Despite this entrenched footprint, customers face significant expansion friction. Industry intelligence briefs indicate enterprise renewals encounter 10% to 15% pricing increases as Chainalysis seeks to support aggressive pre-IPO valuation multiples. This pricing pressure, combined with high switching costs from cumulative address clustering and investigative workflows, elevates vendor lock-in risks and encourages compliance officers to evaluate multi-vendor architectures alongside TRM Labs and Elliptic."
    claimRefs:
      - "CU010"
      - "CU011"
      - "CU012"
      - "CU013"
      - "CU014"
      - "CU015"
    tableRefs:
      - "TU003"
