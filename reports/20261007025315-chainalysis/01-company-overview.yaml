callouts:
  - calloutType: risk
    title: Financing figures are not decision-grade
    body: >-
      Assigned sources report incompatible round histories and totals. Treat valuation
      and capital raised as open diligence items until cap-table and transaction
      documents identify the securities, dates, primary versus secondary proceeds,
      and post-money basis.
    claimRefs: [CO010, CO011, CO012, CO013]
  - calloutType: insight
    title: Scale is visible, economics are not
    body: >-
      Company-issued customer and geographic reach indicate a broad operating footprint,
      but the evidence does not establish current ARR, audited revenue, retention,
      headcount, or customer concentration.
    claimRefs: [CO002, CO005, CO014, CO015]
