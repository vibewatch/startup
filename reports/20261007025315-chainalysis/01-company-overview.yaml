company:
  name: Chainalysis
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Chainalysis describes itself as a blockchain-data platform serving investigation,
    compliance, and market-intelligence workflows in more than 70 countries. Public
    evidence supports broad customer reach and established leadership, but current
    financing, valuation, revenue, headcount, and governance remain materially
    uncertain because the assigned third-party sources conflict or disclose estimates
    without primary documentation.
sections:
  - id: identity-and-operating-footprint
    title: Identity and operating footprint
    body: >-
      Chainalysis positions itself as a blockchain-data platform that combines data,
      AI-powered software, services, and research for government agencies, exchanges,
      financial institutions, and cybersecurity companies. Its company page claims
      operations in more than 70 countries, while a third-party profile places its
      founding in 2014 and headquarters in New York. The current homepage further
      claims more than 1,500 customers. These facts establish a scaled, multi-segment
      compliance and investigations vendor, but they should not be read as audited
      commercial metrics: the geographic and customer figures are company-issued and
      the legal entity structure is not exposed in the assigned evidence.
    claimRefs: [CO001, CO002, CO003, CO004, CO005]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership and governance
    body: >-
      The public leadership picture is narrow. TechStackIPO identifies Michael
      Gronager as chief executive, while a Chainalysis partnership release identifies
      Jonathan Levin as co-founder and chief strategy officer. The assigned evidence
      does not establish the complete founder group, board membership, committee
      structure, voting rights, succession planning, or material leadership changes.
      Accordingly, founder-market fit can be inferred only from continuing executive
      roles, not from independently documented operating histories. Key-person risk
      remains open until management interviews and corporate records clarify decision
      rights, executive depth, and board oversight.
    claimRefs: [CO007, CO008]
    tableRefs: [TO002]
  - id: financing-scale-and-stakeholders
    title: Financing, scale, and stakeholders
    body: >-
      The financing record is internally inconsistent across the assigned independent
      sources. TechStackIPO reports $536 million of total funding and an $8.6 billion
      valuation, GetLatka describes a $170 million Series F in 2022, and Tokenization
      Compliance reports a separate $300 million Series F announced in December 2025
      at the same valuation. None is a filing or company financing announcement in
      this evidence set. Revenue is similarly uncertain: GetLatka labels $87 million
      for 2025 as an estimate, while the official careers page provides no current
      employee count. These values are therefore reported indicators, not canonical
      cover metrics, and should be reconciled against transaction documents.
    claimRefs: [CO010, CO011, CO012, CO013, CO014, CO015]
    tableRefs: [TO003]
  - id: milestones-and-diligence-implications
    title: Milestones and diligence implications
    body: >-
      The available chronology shows a company founded in 2014, a reported 2022
      financing, two workforce reductions during 2023, a 2025 revenue estimate, and
      a disputed late-2025 financing report. By 2026, Chainalysis was still described
      as private with no S-1 filed, while its own surfaces emphasized customer and
      geographic scale. A company-issued BNY Mellon announcement also demonstrates
      adoption by a systemically important bank, but its fetched text does not provide
      a publication date suitable for the dated timeline. The sequence supports
      category maturity, yet the layoffs and contradictory financing record make
      primary financial, governance, and workforce diligence prerequisites rather
      than optional follow-up.
    claimRefs: [CO002, CO003, CO005, CO006, CO009, CO010, CO012, CO013, CO014, CO016]
    figureRefs: [FO001]
