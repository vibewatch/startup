evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Complete founder, executive, board, committee, voting-rights, and succession records.
    whyItMatters: The current evidence cannot quantify key-person dependence or investor control.
    diligencePath: >-
      Obtain the current cap table, charter, bylaws, board minutes, committee charters, and management organization
      chart.
    relatedQuestionRefs:
      - QO002
      - QO003
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: funding
    missingEvidence: >-
      Primary financing documents reconciling the reported 2022 and 2025 Series F rounds, total capital, valuation
      basis, debt, and secondary proceeds.
    whyItMatters: Conflicting round histories prevent a reliable capital-raised or valuation cover metric.
    diligencePath: >-
      Review stock-purchase agreements, capitalization records, closing statements, debt schedules, and
      secondary-transfer ledgers.
    relatedQuestionRefs:
      - QO004
      - QO005
      - QO006
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: Current audited revenue, ARR, revenue mix, retention, customer definition, and customer concentration.
    whyItMatters: A third-party revenue estimate and company customer claim do not establish recurring economics or growth quality.
    diligencePath: >-
      Obtain audited statements, monthly recurring-revenue bridges, cohort retention, bookings, and customer-level
      concentration schedules.
    relatedQuestionRefs:
      - QO005
      - QO007
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: headcount
    missingEvidence: >-
      Current official headcount, location mix, functional allocation, and the size and timing of 2023 workforce
      reductions.
    whyItMatters: Workforce capacity and restructuring magnitude cannot be assessed from a jobs page and secondary summary.
    diligencePath: Request HRIS exports, payroll summaries, organization charts, and reduction-in-force notices.
    relatedQuestionRefs:
      - QO003
      - QO005
      - QO008
    relatedTableRefs:
      - TO001
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: milestones
    missingEvidence: >-
      Primary dates for the BNY Mellon integration and a complete dated product, regulatory, acquisition, and
      partnership chronology.
    whyItMatters: The source-constrained timeline cannot fully test execution cadence or sequence strategic changes.
    diligencePath: >-
      Reconcile board materials and newsroom archives against product-release, contract, acquisition, and regulatory
      records.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: segment-retention-metrics
    missingEvidence: >-
      Audited segment-by-segment customer renewal rates, net revenue retention (NRR), and gross logo churn across
      government vs. commercial exchange cohorts.
    whyItMatters: >-
      Without segmented retention data, assessing the stability of private-sector exchange spend versus sovereign
      government revenue remains speculative.
    diligencePath: >-
      Request confidential S-1 draft disclosures, investor deck cohort retention curves, or customer reference call
      data.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: competitor-scale-and-pricing
    missingEvidence: >-
      Comparable current funding, customer, deployment, and realized-pricing data for Elliptic, TRM Labs, Merkle
      Science, and Scorechain.
    whyItMatters: Without common denominators, scale, pricing power, and relative commercial momentum cannot be ranked.
    diligencePath: >-
      Request current cap tables or financing histories, customer references, deployment counts, and like-for-like
      quotes using one usage scenario.
    relatedQuestionRefs:
      - QP002
      - QP004
    relatedTableRefs:
      - TP001
      - TP003
  - type: conflicting-data
    severity: material
    topic: pricing
    missingEvidence: >-
      A contract-level reconciliation of the $18,500 community median and $174,709 Vendr enterprise median using
      matching product scope, buyer size, and contract period.
    whyItMatters: The two benchmarks use different populations and cannot support one normalized Chainalysis price point.
    diligencePath: >-
      Obtain anonymized order forms for KYT, Reactor, and bundled deployments and normalize seats, volume, products,
      term, and services.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: competitive-performance
    missingEvidence: >-
      Independent controlled tests of attribution precision, recall, false positives, latency, chain depth, and
      migration effort across the named vendors.
    whyItMatters: >-
      Feature presence and headline coverage do not establish detection quality, analyst productivity, or moat
      durability.
    diligencePath: >-
      Run a blinded proof of concept on the same labeled transaction set and production-like workload, with errors
      adjudicated by independent analysts.
    relatedQuestionRefs:
      - QP003
      - QP007
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: >-
      Audited GAAP revenue, gross margin, cloud and data costs, services labor, capex, working capital, CAC payback, and
      retention cohorts.
    whyItMatters: >-
      These inputs determine revenue quality, software operating leverage, capital intensity, and the credibility of a
      margin path.
    diligencePath: >-
      Obtain audited statements, ARR-to-GAAP reconciliation, COGS schedules, and customer-level acquisition and
      retention cohorts from the data room.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
    topic: revenue-comparability
    missingEvidence: >-
      A common-period reconciliation of recognized revenue, contracted ARR, acquired revenue, and management
      projections.
    whyItMatters: >-
      Public values use different labels and periods and therefore cannot support a defensible growth rate or valuation
      multiple.
    diligencePath: >-
      Reconcile monthly recurring revenue, bookings, deferred revenue, and GAAP revenue for 2022 through the latest
      month.
    relatedQuestionRefs:
      - QI004
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: >-
      Current unrestricted cash, monthly net cash burn, liquidity forecast, financing uses, next-round trigger, and
      executed Hercules facility terms.
    whyItMatters: Historical cash and burn estimates cannot establish present runway, covenant headroom, or financing dependency.
    diligencePath: >-
      Review the latest balance sheet, 24-month cash forecast, board financing plan, debt agreement, draw history,
      covenants, and collateral schedule.
    relatedQuestionRefs:
      - QI006
      - QI007
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
    topic: funding
    missingEvidence: >-
      A reconciled round-by-round ledger and fully diluted capitalization table explaining divergent cumulative funding
      totals.
    whyItMatters: >-
      Funding totals cannot be used as a proxy for liquidity and may include different treatment of debt, secondaries,
      or undisclosed rounds.
    diligencePath: >-
      Match signed financing documents and bank receipts to the cap table, separating primary equity, debt, and
      secondary transactions.
    relatedQuestionRefs:
      - QI007
  - type: missing-source
    severity: material
    topic: layer-2-coverage
    missingEvidence: >-
      Granular architectural documentation detailing multi-chain indexing throughput, block lag, and node resource
      consumption across emerging Layer-2 rollups.
    whyItMatters: >-
      Rapid proliferation of L2 rollups and modular blockchains introduces coverage lag that can impair transaction
      tracing completeness.
    diligencePath: Request engineering architectural benchmarks and L2 indexing SLAs during technical management diligence.
  - id: GE002
    type: private-evidence-only
    severity: minor
    topic: air-gapped-update-frequency
    missingEvidence: Data delivery latency metrics and physical delivery schedules for air-gapped government customer installations.
    whyItMatters: Air-gapped installations inevitably experience attribution latency relative to real-time cloud mempool ingestion.
    diligencePath: Review government customer support agreements and cryptographic data packaging delivery procedures.
  - type: private-evidence-only
    severity: material
    topic: retention-and-churn
    missingEvidence: >-
      Audited cohort net revenue retention (NRR), gross revenue retention (GRR), and logo churn rates across government
      and commercial customer cohorts.
    whyItMatters: >-
      Without segmented retention figures, it is difficult to determine whether enterprise revenue growth is driven by
      expanding contract values or masking churn in smaller commercial accounts.
    diligencePath: >-
      Review confidential pre-IPO S-1 registration drafts, investor presentation cohort retention disclosures, or
      audited financial statements during formal sponsor diligence.
    relatedQuestionRefs:
      - QU004
    relatedTableRefs:
      - TU002
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof-exhaustiveness
    missingEvidence: >-
      Comprehensive census of enterprise production accounts and contract values beyond the representative sample of
      named government, banking, and crypto exchange case studies.
    whyItMatters: >-
      A representative sample confirms product efficacy across leading institutions but leaves the broader tail of
      customer deployments unverified.
    diligencePath: Obtain an anonymized customer list stratified by sector, product module, and annual contract value.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: top-customer-concentration
    missingEvidence: >-
      Exact revenue contribution percentages and contract values for the top 5 and top 10 agency and commercial
      customers.
    whyItMatters: >-
      Significant reliance on individual federal agency contracts or major exchange accounts exposes revenue to severe
      procurement and regulatory renegotiation shocks.
    diligencePath: >-
      Request customer concentration schedules detailing top 10 accounts, annual contract values (ACVs), and renewal
      expiration dates.
    relatedQuestionRefs:
      - QU001
      - QU006
    relatedTableRefs:
      - TU001
  - type: missing-source
    severity: material
    topic: litigation-enforcement-incidents
    missingEvidence: >-
      A complete current record of litigation, enforcement matters, outages, breaches, contractual service failures, and
      resulting customer or regulator actions.
    whyItMatters: >-
      Absence of an incident in the assigned pool does not establish absence, while undisclosed events could change
      legal exposure and confidence in operational resilience.
    diligencePath: >-
      Review company legal schedules, regulator and court dockets, cyber-insurance claims, status history, postmortems,
      customer notices, and incident-response records.
    relatedQuestionRefs:
      - QR009
    relatedTableRefs:
      - TR001
      - TR002
  - type: private-evidence-only
    severity: material
    topic: model-quality-and-reliability
    missingEvidence: >-
      Chainalysis-specific false-positive, false-negative, reproducibility, confidence calibration, uptime, latency, and
      incident metrics by chain and product.
    whyItMatters: >-
      Regulatory suitability and customer outcomes depend on measured performance, not solely on proposed standards,
      aggregate coverage, or product descriptions.
    diligencePath: >-
      Commission independent benchmark tests, inspect model-validation reports, and reconcile results with contractual
      SLAs and representative customer workflows.
    relatedQuestionRefs:
      - QR002
      - QR008
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: customer-durability-and-concentration
    missingEvidence: >-
      Current production deployments, renewal cohorts, gross and net retention, customer concentration, and
      public-sector versus private-sector revenue mix.
    whyItMatters: >-
      A customer-count claim and historical planned integration do not show revenue durability, expansion,
      concentration, or current production use.
    diligencePath: >-
      Reconcile billing records with contracts, go-live status, renewal cohorts, reference calls, product usage, and
      top-customer revenue exposure.
    relatedQuestionRefs:
      - QR005
      - QR007
    relatedTableRefs:
      - TR003
  - type: stale
    severity: material
    topic: current-financial-resilience
    missingEvidence: >-
      Current revenue, ARR, gross margin, operating loss, cash balance, debt, burn, runway, cap table, preference stack,
      and current transaction-derived valuation evidence.
    whyItMatters: >-
      A 2022 funding round is not evidence of current cash availability, profitability, financing capacity, or
      enterprise value.
    diligencePath: >-
      Obtain audited statements, monthly management accounts, financing documents, debt covenants, board-approved
      forecast, cap table, and recent secondary transaction records.
    relatedQuestionRefs:
      - QR006
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: buyer-specific-total-cost
    missingEvidence: >-
      Contracted subscription, implementation, support, usage-escalator, renewal, migration, and termination costs for
      representative buyer workloads.
    whyItMatters: >-
      Quote-based pricing and undisclosed service fees prevent a supportable view of customer payback, margin pressure,
      and switching risk.
    diligencePath: >-
      Obtain recent proposals and executed statements of work, then model total cost under base, peak-volume,
      extra-chain, renewal, and exit scenarios.
    relatedQuestionRefs:
      - QR003
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: underwriting-gap
    missingEvidence: >-
      Current ARR and revenue, growth, gross margin, retention, cohort behavior, segment mix, contract duration, and
      customer concentration.
    whyItMatters: >-
      These inputs determine revenue quality, a supportable valuation multiple, and whether customer and product scale
      convert into durable equity value.
    diligencePath: >-
      Obtain audited financials, monthly ARR bridges, cohort and renewal schedules, segment margins, and top-customer
      concentration directly from management.
    relatedQuestionRefs:
      - QV003
    relatedTableRefs:
      - TV001
      - TV003
  - type: private-evidence-only
    severity: material
    topic: capitalization
    missingEvidence: >-
      Executed 2025 financing and debt documents, fully diluted capitalization, liquidation preferences, participation
      rights, option overhang, and secondary-transfer prices.
    whyItMatters: >-
      Common-equity value and downside protection cannot be inferred from total funding raised or an old post-money
      valuation.
    diligencePath: >-
      Review the current cap table, charter, investor-rights agreements, debt schedules, financing closing set, and
      recent secondary transaction records.
    relatedQuestionRefs:
      - QV004
      - QV005
    relatedTableRefs:
      - TV001
      - TV002
      - TV003
  - type: conflicting-data
    severity: material
    topic: financing-conflict
    missingEvidence: >-
      Primary confirmation of the October or December 2025 transaction date, security type, amount, valuation, and
      investor participation.
    whyItMatters: Conflicting public records prevent the latest transaction from serving as a reliable valuation comparable.
    diligencePath: >-
      Reconcile board approvals, executed purchase or credit agreements, cash receipts, and an investor-confirmed
      transaction summary.
    relatedQuestionRefs:
      - QV001
      - QV005
    relatedTableRefs:
      - TV002
  - type: missing-source
    severity: material
    topic: exit-readiness
    missingEvidence: >-
      Audited-control readiness, governance composition, banker mandate, legal preparedness, and a management-approved
      exit or hold timetable.
    whyItMatters: >-
      Customer scale and product breadth do not establish IPO readiness, strategic demand, or a realizable holding
      period.
    diligencePath: >-
      Interview the board and finance leadership, inspect audit and control workstreams, and obtain any formal IPO or
      strategic-alternative materials.
    relatedQuestionRefs:
      - QV007
    relatedTableRefs:
      - TV003
