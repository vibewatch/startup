      - number: '4.3'
        title: Financing extends strategic capacity, not proven runway
        blocks:
          - type: paragraph
            body: >-
              Digital Asset announced a $355 million funding round on June 11, 2026 and said the proceeds would expand
              Canton offerings, deepen engagement with developers and financial institutions, and support network
              growth. An independent article reported an approximately $2 billion valuation. The round size is gross
              financing raised; it is not equivalent to unrestricted cash on hand after transaction expenses, existing
              obligations, acquisitions, or operating use. The investor group includes financial institutions and
              market-infrastructure firms that are plausible ecosystem users, creating useful commercial alignment but
              also potential governance and pricing tension. Without a balance sheet, cash-flow statement, debt
              schedule, burn rate, or committed acquisition budget, the next financing trigger and runway remain
              unquantifiable.
            claimRefs:
              - CI001
              - CI002
              - CI009
              - CI012
              - CI015
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a credible enterprise product footprint and access to strategic capital, but not a
              revenue-quality or margin conclusion. The strongest adverse source explicitly notes that a roughly $2
              billion valuation is unsupported by disclosed revenue figures. The main underwriting error would be to
              treat network transaction volume, ecosystem participants, or funding raised as revenue, customers, or cash
              available. Until management supplies audited statements and contract-level cohort data, revenue mix, gross
              margin, implementation burden, customer concentration, CAC payback, working capital, and runway should
              remain unknown rather than estimated. A finance diligence package should reconcile recognized revenue to
              product and service streams and separately bridge opening cash, the 2026 financing, operating cash use,
              acquisition commitments, debt, and closing cash.
            claimRefs:
              - CI005
              - CI010
              - CI011
              - CI012
              - CI015
              - CI016
