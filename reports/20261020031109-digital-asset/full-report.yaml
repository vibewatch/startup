figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Eight dated milestones trace Digital Asset's shift from company formation to Daml, Canton, and increasingly large
      institutional financings.
    data:
      items:
        - date: 2014-10
          label: Founded in New York
          detail: Digital Asset was founded by five named co-founders.
          tone: neutral
          claimRefs:
            - CO001
            - CO002
        - date: '2019'
          label: Daml open sourced
          detail: The company opened its smart-contract language to external use.
          tone: positive
          claimRefs:
            - CO007
        - date: '2021'
          label: Series D
          detail: A growth round was led by 7RIDGE and Eldridge Industries.
          tone: positive
          claimRefs:
            - CO008
        - date: '2022-03-02'
          label: Daml 2.0 launched
          detail: The release introduced Canton-based privacy and cross-domain interoperability.
          tone: positive
          claimRefs:
            - CO009
        - date: '2023'
          label: Canton launched
          detail: The official timeline associates launch with more than 30 market participants.
          tone: positive
          claimRefs:
            - CO010
        - date: '2024'
          label: Public Layer 1 mainnet
          detail: The Global Synchronizer mainnet was launched.
          tone: positive
