  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              Digital Asset competes against more than named blockchain vendors. A buyer can adopt Canton, keep a
              standalone Daml application, connect an existing permissioned ledger, continue with bilateral messaging
              and reconciliation, or build a narrower internal workflow. Digital Asset describes Canton as
              infrastructure that connects independently controlled applications rather than requiring one vertically
              integrated stack. Its own Project Genesis example also shows Daml working across Hyperledger Fabric and
              Hyperledger Besu, which makes those technologies potential complements as well as substitutes. This is
              strategically important: coexistence can reduce migration friction, but it can also limit Digital Asset's
              ability to displace infrastructure already selected by an institution. The available pool supports these
              alternative classes but does not support a complete census of named competitors, their funding, or their
              installed bases.
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP016
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP006
              - CP007
              - CP015
              - CP016
      - number: '3.2'
        title: Capability, control, and trust posture
        blocks:
          - type: paragraph
            body: >-
              The clearest product-level distinction in the retained sources is control over visibility. Digital Asset
              says each application remains sovereign over users and data, while Daml permissions restrict participants
              to transaction-relevant information. That architecture is positioned against fully replicated networks,
              where the company argues institutions otherwise face a privacy-versus-atomicity trade-off. Third-party
              ecosystem profiles report substantial institutional use and governance outside Digital Asset, but those
              profiles are descriptive and promotional rather than controlled benchmarks. The resulting underwriting
              conclusion is narrower: Canton has a differentiated institutional design thesis, but this evidence set
              cannot establish superior performance, security, implementation cost, or regulatory outcomes relative to a
              named peer. Those unknowns are shown rather than scored as facts.
            claimRefs:
              - CP002
              - CP003
              - CP005
              - CP008
              - CP009
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP003
              - CP005
              - CP015
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
