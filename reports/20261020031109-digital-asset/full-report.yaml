              - CP004
              - CP005
              - CP014
              - CP016
      - number: '3.3'
        title: Pricing, packaging, and distribution power
        blocks:
          - type: paragraph
            body: >-
              Public commercial comparability is poor. A third-party project page reports that Digital Asset does not
              publish simple enterprise license pricing and directs prospects to sales or support, while Canton activity
              introduces a separate token-denominated usage-fee layer. Those are different economic units and must not
              be treated as one price. Digital Asset's current documentation also presents multiple applications and
              services, including asset issuance, a USDC bridge, and infrastructure support, indicating a broader
              packaging surface than a single protocol license. The company announced a $355 million round and says it
              works with more than 700 ecosystem participants; this may strengthen distribution, partnerships, and
              acquisition capacity, but funding raised is not evidence of customer revenue, cash available, or lower
              total cost of ownership.
            claimRefs:
              - CP006
              - CP007
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP015
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Portability and open-network positioning cut both ways. Digital Asset says Daml applications can remain
              standalone or connect later and that portability prevents lock-in to one provider. This lowers adoption
              risk, but it also weakens a simple proprietary-lock-in thesis. The more durable moat would need to come
              from ecosystem density, trusted governance, production integrations, and the cost of coordinating
              regulated multi-party workflows. The evidence is not yet strong enough to quantify any of those switching
              costs. Adverse evidence in the pool is limited to a CoinLaunch review that flags no roadmap and weak
              marketing and growth infrastructure; it is a low-reputation assessment, but it identifies a plausible
              execution risk as better-funded public-chain ecosystems and incumbent vendors pursue the same
              institutions. Investment diligence should therefore test usage, win/loss data, implementation effort, and
              renewal economics before treating ecosystem participation as durable competitive advantage.
            claimRefs:
              - CP008
              - CP010
              - CP014
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Comparative proof is the gating diligence issue
            body: >-
              The source pool supports Digital Asset's design thesis and ecosystem scale, but not a normalized peer
              benchmark for price, performance, security, implementation effort, or production economics.
            calloutType: risk
            claimRefs:
              - CP015
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue architecture is visible, but monetization is not
        blocks:
          - type: paragraph
            body: >-
              Digital Asset presents multiple surfaces that could support enterprise revenue: DA Registry for compliant
              asset issuance, USDCx Reserve for bridging USDC to Canton, Covalidation Service for high-availability
              infrastructure, and a broader set of applications and APIs. An independent developer-surface index also
              identifies four APIs and eleven published contracts. These observations support a multi-product enterprise
              model, but they do not establish whether customers pay subscriptions, licenses, implementation fees,
              consumption-based charges, validator fees, or negotiated bundles. Daml's company-described portability and
              reduced provider lock-in may aid adoption while also limiting purely proprietary switching-cost economics.
              Canton Coin fee mechanics are likewise network economics, not evidence that Digital Asset recognizes those
              fees as corporate revenue.
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI006
              - CI013
