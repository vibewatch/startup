            tableRef: TO002
            claimRefs:
              - CO002
              - CO005
      - number: '1.2'
        title: Capitalization, institutional backing, and missing scale metrics
        blocks:
          - type: paragraph
            body: >-
              Digital Asset announced a $355 million round on June 11, 2026 led by a16z crypto, with participation from
              institutions spanning banks, market infrastructure, trading firms, asset managers, and crypto investors. A
              separate editorial profile and a funding database report a valuation of about $2 billion, but the company
              announcement does not disclose valuation, so this remains a third-party-reported figure rather than a
              verified transaction term. The financing follows a company-listed $135 million raise in 2025 and other
              strategic investments. Funding raised is not cash available: the assigned evidence provides no cap table,
              preference stack, debt schedule, cash balance, burn rate, or runway. It also does not provide audited
              revenue, ARR, headcount, or a customer count. The company's statement that it works with more than 700
              ecosystem participants is not used as a customer denominator because participants and paying customers are
              different populations.
            claimRefs:
              - CO012
              - CO013
              - CO014
              - CO015
          - type: table
            tableRef: TO003
            claimRefs:
              - CO014
              - CO015
      - number: '1.3'
        title: Development and execution history
        blocks:
          - type: paragraph
            body: >-
              The available chronology shows a long transition from enterprise distributed ledgers toward a public
              institutional network. Digital Asset open-sourced Daml in 2019, completed a Series D in 2021, and
              announced Daml 2.0 in 2022 with Canton-based privacy and interoperability. Its official timeline places
              the Canton launch with more than 30 market participants in 2023 and the public Layer 1 mainnet launch in
              2024, followed by larger strategic financings in 2025 and 2026. This progression demonstrates durable
              product and financing activity, but the milestones are predominantly company-issued and do not by
              themselves establish production usage, recurring software economics, or durable customer retention.
              CoinLaunch separately flags the absence of a roadmap and weak marketing infrastructure; that is an adverse
              editorial assessment, not a benchmark or verified operating failure. The diligence priority is therefore
              to connect the visible milestone cadence to contracted revenue, live production workloads, and accountable
              corporate governance.
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
