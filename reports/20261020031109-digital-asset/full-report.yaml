  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and institutional workflows
        blocks:
          - type: paragraph
            body: >-
              Digital Asset delivers a layered product rather than a single application. Daml expresses multiparty
              rights, obligations, permissions, and atomic workflow actions; Canton connects participating ledgers while
              limiting visibility to authorized parties; and the current DA Apps documentation presents packaged
              services including DA Registry, USDCx Reserve, and Covalidation Service. In customer-workflow terms, the
              stack is intended to let institutions issue compliant assets, move tokenized collateral or cash, settle
              transactions, and operate wallet or application infrastructure without exposing every transaction to every
              network participant. The product breadth is visible, but the public pages reviewed here do not disclose
              SKU-level pricing, deployment counts, service-level commitments, or realized workflow savings. The
              matrices therefore distinguish described capability from verified production maturity and make the missing
              diligence evidence explicit.
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE008
              - CE009
              - CE010
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE008
              - CE009
              - CE010
              - CE015
          - type: table
            tableRef: TE002
            claimRefs:
              - CE004
              - CE007
              - CE008
              - CE009
      - number: '5.2'
        title: Architecture and technical differentiation
        blocks:
          - type: paragraph
            body: >-
              The architecture starts with Daml templates that define contract payloads, parties, choices, and atomic
              actions. Signed access tokens connect real-world actors to ledger party identities, while signatories and
              observers encode who may authorize or view a contract. Digital Asset describes Canton as distributing Daml
              ledgers through participation nodes and synchronizing state across otherwise separate domains while
              retaining sub-transaction privacy. That design directly targets regulated-market requirements: shared
              workflows without universal data replication, plus atomic composition across steps. Historical Daml 2.0
              materials also describe Postgres-compatible and blockchain integrations, portability, and early-access
              cross-application composability. These are meaningful design differentiators, but most architectural
              assertions come from Digital Asset's own technical materials; the retained third-party profiles summarize
              the model rather than independently benchmark throughput, fault tolerance, or privacy guarantees.
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE006
              - CE007
              - CE011
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
              - CE003
              - CE005
              - CE006
              - CE007
              - CE011
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE003
              - CE004
              - CE009
              - CE010
      - number: '5.3'
        title: Maturity, deployment signals, and roadmap
        blocks:
          - type: paragraph
            body: >-
              Maturity is unevenly evidenced. A 2022 product release described Daml 2.0 as launched while
              cross-application composition remained early access, and it named customer tests and planned production
              builds; those historical statements should not be treated as proof of current deployment status. In 2026,
              Digital Asset said it was working with more than 700 ecosystem participants and would direct new capital
              toward expanding Canton offerings, developer engagement, institutional engagement, and network growth.
              Tradeweb's publication of a product discussion with Digital Asset's CEO provides a current
              partner-engagement signal, not a production benchmark or customer acceptance test. The retained evidence
              therefore supports broad ecosystem activity and product direction, but not module-level adoption, release
              cadence, uptime, support performance, or milestone dates. A dated product roadmap and production
              deployment inventory remain material diligence requests.
            claimRefs:
              - CE008
              - CE013
              - CE014
              - CE015
      - number: '5.4'
        title: Trust, safety, compliance, and technical risk
        blocks:
          - type: paragraph
            body: >-
              Trust controls appear in both the programming model and the current application documentation. Daml
              materials describe explicit roles, permissions, signatories, observers, and need-to-know visibility, while
              DA Registry documentation exposes allowlist, blocklist, asset recovery, Proof of Transfer, security,
              audit, monitoring, and support surfaces. Those headings show that control functions are part of the
              product scope; they do not by themselves establish certification, audit coverage, remediation status,
              recovery objectives, or operational effectiveness. CoinLaunch reports that public security audits exist
              but provides no audit identity or findings in the retained text, and it separately flags the absence of a
              roadmap. No retained source supplies current penetration-test results, incident history, uptime
              statistics, independent scalability tests, or a public developer-activity metric. Technical underwriting
              should therefore remain conditional on audit artifacts, architecture review, service-level evidence, and
              reproducible performance tests.
            claimRefs:
              - CE003
              - CE006
              - CE010
              - CE012
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Differentiation is encoded in the workflow model
            body: >-
              Daml's explicit parties, rights, obligations, visibility, and atomic choices make the privacy thesis more
              concrete than a generic claim that Canton is institution-ready.
            calloutType: strength
            claimRefs:
              - CE001
              - CE003
              - CE004
              - CE006
          - type: callout
            title: Public proof trails the architecture narrative
            body: >-
              The retained sources do not provide independent current benchmarks, audit artifacts, uptime history,
              module adoption, or dated roadmap milestones, so technical diligence cannot rely on product descriptions
              alone.
            calloutType: risk
            claimRefs:
              - CE012
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Institutional reach spans buyers, operators, and builders
        blocks:
          - type: paragraph
            body: >-
              The visible customer surface is an institutional ecosystem rather than a single buyer category. Banks and
              asset managers appear as users of tokenization and workflow infrastructure; exchanges, clearinghouses, and
              other market operators appear as deployment owners; and developers or application operators consume Apps,
              APIs, and validation services. Digital Asset's documentation exposes Registry, USDCx Reserve, and
              Covalidation Service offerings, while its privacy design assigns transaction visibility by party role.
              This product shape fits regulated multi-party workflows, but public evidence does not identify which
              institutions pay Digital Asset directly, which participate only in Canton, or how revenue is distributed
              among software, services, and ecosystem activity.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
              - CU014
          - type: table
            tableRef: TU001
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
              - CU013
              - CU014
      - number: '6.2'
        title: Adoption signals are substantial but not directly comparable
        blocks:
          - type: paragraph
            body: >-
              The strongest current scale statement is Digital Asset's June 2026 claim that it works with more than 700
              ecosystem participants. That denominator is not defined as paying customers, active users, production
              deployments, or legal entities. Independent reporting supplies more specific but older signals: a 2024
              Canton pilot included asset managers, banks, custodians, exchanges, and a market-infrastructure provider,
              while Broadridge's DLR platform was reported to process roughly $120 billion of repo daily. These measures
              demonstrate institutional engagement and a live workflow, not a coherent customer-growth series. Industry
              context is also cautionary: only 25% of surveyed EU-bank DLT pilots had reached in-use status in 2023.
            claimRefs:
              - CU001
              - CU009
              - CU010
              - CU011
              - CU012
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU009
              - CU011
              - CU012
      - number: '6.3'
        title: Named proof ranges from prototypes to operating infrastructure
        blocks:
          - type: paragraph
            body: >-
              Named references establish that Digital Asset technology has entered consequential capital-markets
              workflows, but the proof quality varies. The 2022 company account described Goldman Sachs as using Daml
              for tokenized-asset infrastructure, Deutsche Börse as building a post-trade platform, and Xpansiv as
              building an ESG commodities exchange; it explicitly described Project Genesis for the BIS and Hong Kong
              Monetary Authority as a prototype. Independent reporting later identified Broadridge's DLR as a live
              high-volume workflow and described the Global Synchronizer as live in July 2024. A 2026 third-party
              profile lists a wider production-and-pilot footprint, but does not provide contract values, implementation
              dates, renewal evidence, or customer-verified outcomes for each name.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU010
              - CU011
              - CU014
              - CU015
          - type: table
            tableRef: TU003
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU011
              - CU014
              - CU015
      - number: '6.4'
        title: Commercial durability and concentration remain the central diligence gaps
        blocks:
          - type: paragraph
            body: >-
              Publicly visible ecosystem breadth does not establish retention or commercial durability. No retained
              source discloses NRR, GRR, churn, renewal rates, contract length, cohort behavior, customer acquisition
              cost, or the share of revenue attributable to the largest customers. Digital Asset says new capital will
              deepen engagement with developers and financial institutions and expand Canton offerings, which indicates
              an ecosystem-led expansion model rather than documented account expansion. The model also faces conversion
              risk: independent reporting notes low pilot-to-production rates across bank DLT projects and records the
              shelving of the ASX replacement. CoinLaunch's critique of roadmap and marketing visibility adds a
              lower-quality adverse signal, not proof of customer loss.
            claimRefs:
              - CU002
              - CU012
              - CU013
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU009
              - CU010
              - CU011
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Ecosystem breadth is not customer retention
            body: >-
              The 700-plus participant claim cannot be converted into customers, active deployments, or recurring
              revenue without a participant definition and account-level retention data.
            calloutType: risk
            claimRefs:
              - CU001
          - type: callout
            title: Production proof exists, but it is concentrated in a few visible workflows
            body: >-
              Broadridge provides the clearest independently reported production-scale reference, while several other
              named institutions are evidenced as builds, pilots, or prototypes.
            calloutType: insight
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU011
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              The evidence does not establish that Canton or the Canton Foundation lacks required authorization. It
              establishes only that an independent September 2026 profile found no licence or named regulator approval
              for either entity, while Digital Asset describes privacy, compliance, control, and interoperability as
              built into Canton. That distinction matters because technical compliance features are not substitutes for
              jurisdiction-specific legal authority. Canton Coin adds a separate classification and disclosure question:
              an independent profile states that the token's market value does not represent ownership of Canton's
              recorded repo assets. The investment posture should therefore remain conditional on a counsel-produced
              jurisdiction map, primary regulator evidence, token-rights analysis, and current privacy/security
              assurance documents.
            claimRefs:
              - CR003
              - CR004
              - CR007
              - CR008
          - type: table
            tableRef: TR001
            claimRefs:
              - CR003
              - CR004
              - CR007
              - CR008
              - CR013
      - number: '7.2'
        title: Operational, security, and verifiability risk
        blocks:
          - type: paragraph
            body: >-
              Privacy is simultaneously the product advantage and the largest verification constraint. Because outside
              observers cannot inspect all activity, aggregate volumes and asset values depend on reporting by the
              network or its members. Digital Asset's public documentation lists controls including blocklists,
              allowlists, asset recovery, proof of transfer, audits, monitoring, and status, but the assigned pool does
              not include the underlying audit reports, incident history, recovery tests, service levels, or control
              exceptions. The 2022 technical description also assigns confirmation collection to a central commit
              coordinator on the underlying ledger provider. Investors should test coordinator failure handling,
              validator failover, data-reconciliation controls, privileged access, and independent incident disclosure
              rather than inferring resilience from feature labels.
            claimRefs:
              - CR001
              - CR004
              - CR012
              - CR013
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR004
              - CR012
              - CR013
              - CR015
      - number: '7.3'
        title: Partner, concentration, and financial-model risk
        blocks:
          - type: paragraph
            body: >-
              The headline represented-asset figure is not diversified proof of demand. One independent profile
              attributed about $328 billion as of September 10, 2026 almost entirely to Broadridge's repo system, making
              counterparty and use-case concentration a first-order risk. A separate profile notes that many Digital
              Asset investors are also Canton participants, which aligns incentives but weakens the evidentiary value of
              partner announcements as independent market validation. Digital Asset announced $355 million of financing
              for ecosystem expansion, yet funding raised is neither revenue nor cash runway. Without audited revenue,
              burn, margin, contractual concentration, and capital-availability data, the investment case cannot
              quantify durability or the cost of maintaining institution-grade infrastructure.
            claimRefs:
              - CR002
              - CR005
              - CR006
              - CR009
              - CR010
              - CR014
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR009
              - CR010
              - CR014
              - CR016
      - number: '7.4'
        title: Monitoring indicators and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The risk program should track verifiable milestones rather than aggregate promotional metrics. Near-term
              indicators are a completed DTCC Treasury rollout, evidence that the planned GS DAP transition occurred
              without customer or control disruption, publication of current third-party security assurances,
              diversified represented and distributed activity, and audited company economics. A reviewer also flagged
              the absence of a roadmap, while Digital Asset's older product release described cross-application
              composition as early access; current production maturity needs direct confirmation. Thesis-break triggers
              are a material regulatory restriction, a severe unresolved privacy or settlement incident, failure of a
              major announced market-infrastructure deployment, sustained dependence on one platform for reported scale,
              or financing needs unsupported by recurring gross profit. None of those events is asserted to have
              occurred; they are monitorable decision rules.
            claimRefs:
              - CR002
              - CR011
              - CR012
              - CR014
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR014
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Scale is not externally auditable
            body: >-
              Private activity can be commercially valuable while still limiting diligence. Underwrite named production
              contracts and counterparty-verified activity, not aggregate network totals.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
          - type: callout
            title: Release capital only against evidence milestones
            body: >-
              Require primary regulatory confirmation, current security assurance, diversified production activity, and
              audited financials before treating adoption claims as durable enterprise value.
            calloutType: recommendation
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Decision and financing context
        blocks:
          - type: paragraph
            body: >-
              Digital Asset announced a $355 million financing led by a16z crypto in June 2026, and an independent
              tracker reports an approximately $2 billion valuation. That is strong financing validation, especially
              because the syndicate includes institutions active in banking, trading, market infrastructure, and digital
              assets. It is not sufficient price validation: Digital Asset's announcement did not state the valuation,
              and the earlier May report described a smaller contemplated raise with terms still subject to change. The
              financing amount establishes capital raised, not cash available, burn, or runway. Without audited
              operating economics or security-level terms, a precise ownership, dilution, return, or hold-period
              calculation would create false precision. The appropriate decision is to track the company and request
              private evidence before underwriting the reported mark.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV012
              - CV013
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV009
              - CV010
              - CV011
              - CV015
              - CV016
      - number: '8.2'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis is that Digital Asset combines a privacy-oriented technical architecture with unusually
              relevant strategic backers and a company- reported ecosystem of more than 700 participants. Its official
              product surfaces cover asset registry, reserve bridging, and infrastructure services, while Daml and
              Canton are designed to limit transaction visibility by role. Those attributes could support durable
              institutional workflows if they convert into recurring, high-margin revenue. The anti-thesis is equally
              important: network governance sits outside Digital Asset, Canton Coin is not company equity or a claim on
              corporate revenue, and privacy makes activity harder to verify independently. Strategic investor
              participation may represent ecosystem alignment rather than evidence of software revenue, retention, or
              defensible unit economics.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV011
              - CV012
      - number: '8.3'
        title: Scenarios and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The scenario framework is deliberately conditional because the evidence does not support a conventional
              revenue multiple or a probability-weighted intrinsic value. A bull outcome requires the company to connect
              ecosystem scale and differentiated privacy technology to audited recurring revenue, retention, gross
              margin, and efficient cash use. The base case treats the approximately $2 billion report as a financing
              marker, not independently demonstrated fair value, and keeps the company on a diligence track. A bear
              outcome emerges if network activity cannot be monetized by Digital Asset, if independent verification
              remains weak, or if preference and dilution terms transfer downside away from new common-equity investors.
              Entry should therefore be conditioned on economics and instrument terms, not on investor logos alone.
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV007
              - CV008
              - CV009
              - CV012
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV009
              - CV012
              - CV013
              - CV014
              - CV016
      - number: '8.4'
        title: Comparables, exit readiness, and final diligence
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence does not establish a defensible public-company, private-round, or M&A comparable
              set. Digital Asset spans enterprise software, network infrastructure, and ecosystem development, while
              Canton Coin is a separate exposure; applying token-network values to company equity would therefore be
              misleading. Exit timing and target returns are also not supportable without ownership, dilution,
              preference, revenue, and cash-flow data. Final diligence should request audited 2025-2026 financials, ARR
              and cohort retention, gross margin, burn and runway, the complete capitalization and preference stack,
              customer-level production revenue, Digital Asset's monetization rights relative to Canton governance, and
              board-approved operating plans. Thesis-break triggers are weak conversion of announced participation into
              paid production use, sustained cash burn without economic disclosure, or financing terms that subordinate
              new investors despite the reported valuation.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV010
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price-sensitive recommendation
            body: >-
              Track Digital Asset, but do not treat the reported approximately $2 billion financing mark as
              independently supported fair value until audited economics and security terms make ownership and return
              underwriting possible.
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV012
              - CV013
              - CV014
              - CV016
          - type: callout
            title: Funding is not runway
            body: >-
              The $355 million announcement establishes the size of a financing round; it does not establish cash
              available, burn rate, or runway.
            calloutType: risk
            claimRefs:
              - CV001
              - CV015
