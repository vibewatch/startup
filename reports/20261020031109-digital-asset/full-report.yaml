      - number: '4.2'
        title: Activity signals cannot be converted into sales efficiency
        blocks:
          - type: paragraph
            body: >-
              Digital Asset says it works with more than 700 ecosystem participants, and independent commentary points
              to substantial transaction activity on a Canton-based Broadridge repo platform. Those are meaningful
              adoption indicators, but neither participant count nor transaction value is company revenue, ARR, retained
              customer count, or gross profit. The reviewed careers content shows engineering, sales, customer-success,
              and client-experience functions, consistent with a technically demanding enterprise motion that may
              require implementation and support resources. Public materials do not disclose sales-cycle length,
              bookings, customer acquisition cost, payback, concentration, renewal, or net retention. Consequently, no
              defensible sales-efficiency ratio can be calculated from the assigned evidence.
