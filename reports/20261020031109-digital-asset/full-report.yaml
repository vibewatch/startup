  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The relevant market is institutional software and network infrastructure for multi-party, regulated asset
              and transaction workflows. Digital Asset describes Canton as a Daml interoperability protocol designed to
              preserve authorization and privacy while composing workflows across participants; its application
              portfolio focuses on compliant asset issuance, transfer, recovery, reserve bridging, and supporting
              infrastructure. That boundary includes software, APIs, and operating services used to create or coordinate
              regulated assets and workflows. It excludes the marketing-content repository category also abbreviated
              DAM, whose applications include sales enablement, publishing, photography, and e-commerce content. The
              practical substitutes are bilateral messaging with reconciliation, centralized databases, isolated
              ledgers, and internal builds. Company material identifies messaging-driven inconsistency and the
              privacy-versus-atomicity tradeoff as the problems to displace, but this framing is company-issued rather
              than an independent benchmark of buyer pain.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM006
              - CM011
              - CM012
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM006
              - CM011
              - CM012
              - CM014
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              No successful source in the assigned pool quantifies spending on Digital Asset's defined
              institutional-blockchain category, so a numeric TAM, SAM, or SOM would be invented. The strongest current
              scale indicator is Digital Asset's June 2026 claim that it works with more than 700 Canton ecosystem
              participants, but participant count is not a paid-customer count, budget pool, revenue base, or
              addressable-spend estimate. The same announcement says a $355 million financing will fund ecosystem
              adoption; financing is supply-side capacity, not market demand. Two analyst pages quantify or scope
              digital asset management software, but their buyers, workflows, and vendor sets are for media and
              marketing content, so those values are excluded rather than repurposed. The investable sizing case
              therefore requires bottom-up evidence on target institutions, addressable workflows, deployment economics,
              pricing, and conversion from ecosystem participation to paid production use.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM012
              - CM013
              - CM014
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM012
              - CM013
              - CM015
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM008
              - CM015
              - CM016
      - number: '2.3'
        title: Buyers, users, payers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The evidence points to a multi-sided adoption path rather than a single software buyer. Regulated
              financial institutions and market infrastructures are the likely economic buyers of production workflows;
              asset issuers and operations teams use issuance, transfer, settlement, collateral, and payment
              capabilities; developers build Daml applications; and participant or synchronizer operators supply network
              connectivity. Legal, compliance, and business stakeholders are also intended users because Daml contracts
              encode parties, rights, obligations, permissions, and atomic actions. The purchasing path is therefore
              likely to require alignment among a business sponsor, technology, security, legal, compliance, and
              operations before production deployment. The assigned evidence does not disclose which function owns
              budget, typical contract value, procurement duration, or how many of the reported ecosystem participants
              are paying customers. Those omissions prevent a credible SAM or near-term SOM conversion.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM007
              - CM008
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM005
              - CM008
              - CM011
      - number: '2.4'
        title: Drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              The adoption thesis rests on institutions moving real-world assets and regulated workflows onchain while
              retaining privacy, compliance, control, interoperability, and atomic execution. Digital Asset names
              tokenization, collateral mobility, settlement, payments, and other regulated workflows as expansion areas,
              while its technical material argues that partitioned state and federated synchronizers can address privacy
              and scaling concerns. The same requirements are also constraints: deployments must integrate across
              organizations, satisfy permissioning and data controls, recruit counterparties, and prove production
              economics against existing messaging and reconciliation processes. Historical company examples and
              repository activity show technical and ecosystem effort, not current independent proof of broad
              procurement or recurring spend. Valuation should therefore weight verified production deployments,
              workflow volume, contract economics, and participant-to- customer conversion more heavily than broad
              blockchain narratives or excluded DAM market estimates.
            claimRefs:
              - CM002
              - CM004
              - CM005
              - CM006
              - CM007
              - CM009
              - CM010
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not use media-content DAM estimates as blockchain TAM
            body: >-
              The analyst estimates in the assigned pool cover marketing and media asset repositories, not Digital
              Asset's institutional workflow infrastructure.
            calloutType: risk
            claimRefs:
              - CM012
              - CM013
              - CM014
          - type: callout
            title: Underwrite production conversion, not ecosystem breadth
            body: >-
              Request paid-customer, production-workflow, pricing, volume, and procurement data before assigning a
              numeric SAM, SOM, or adoption curve.
            calloutType: recommendation
            claimRefs:
              - CM008
