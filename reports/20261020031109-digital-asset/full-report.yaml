chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, leadership, and governance
        blocks:
          - type: paragraph
            body: >-
              Digital Asset was founded in New York in October 2014 by Yuval Rooz, Eric Saraniecki, Shaul Kfir, Sunil
              Hirani, and Don R. Wilson. The company builds distributed-ledger infrastructure for financial
              institutions: Daml is its smart-contract language, while Canton is the privacy-oriented network developed
              around that model. Rooz is identified as co-founder and chief executive; the retained sources also
              document that he succeeded Blythe Masters after her 2018 departure. The public record in this allocation
              is much thinner on the current executive bench, board composition, investor rights, and succession.
              Canton.Wiki describes the Canton Foundation, rather than Digital Asset, as the network-governance body and
              Digital Asset as one participant, an important distinction between influence over the ecosystem and formal
              control. That governance description is useful context, but it does not resolve corporate governance or
              key-person dependence at Digital Asset itself.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO006
          - type: table
            tableRef: TO001
            claimRefs:
              - CO003
