    title: Pricing and monetization evidence
    columns: [Offer, Public price, Realized price, Contract model, Discount evidence, Underwriting implication]
    rows:
      - [DA Registry, null, null, "Not disclosed", "Not disclosed", "Cannot infer recurring revenue or implementation intensity"]
      - [USDCx Reserve, null, null, "Not disclosed", "Not disclosed", "Network activity cannot be translated into corporate take rate"]
      - [Covalidation Service, null, null, "Not disclosed", "Not disclosed", "Infrastructure cost and service margin are unquantified"]
      - [Daml and APIs, null, null, "Not disclosed", "Not disclosed", "Portability supports adoption but may constrain lock-in"]
    notes: "Null means the assigned, successfully fetched public sources did not disclose the field; it does not mean zero."
    claimRefs: [CI003, CI004, CI005]
  - id: TI003
    title: Unit-economics and capital-adequacy checklist
    columns: [Metric, Public value, Confidence, Why it matters, Required diligence evidence]
    rows:
      - [Revenue and ARR, null, "No public value", "Establishes scale and recurring mix", "Audited revenue, ARR bridge, and recognition policy"]
      - [Gross margin, null, "No public value", "Tests software economics versus delivery burden", "Gross margin by product and services allocation"]
      - [CAC and payback, null, "No public value", "Tests enterprise sales efficiency", "Fully loaded CAC, sales cycle, and cohort payback"]
      - [Retention and concentration, null, "No public value", "Tests durability and strategic-customer dependence", "GRR, NRR, top-ten revenue share, and renewals"]
      - [Cash and burn, null, "No public value", "Separates financing raised from liquidity", "Bank cash, restricted cash, and monthly operating cash use"]
      - [Runway and obligations, null, "No public value", "Determines financing dependency", "Debt schedule, acquisition commitments, and downside runway"]
      - [Network activity conversion, null, "No public value", "Connects ecosystem usage to company economics", "Revenue attributable to applications, infrastructure, and network-related activity"]
    notes: "All null values are evidence gaps, not estimates; adoption and financing metrics are deliberately excluded as substitutes for unit economics."
    claimRefs: [CI005, CI007, CI008, CI010, CI011, CI012, CI016]
