company:
  name: Digital Asset
chapter:
  number: 4
  title: Financials
  summary: >-
    Digital Asset has a visible portfolio of institutional applications, APIs, and infrastructure
    services, but the reviewed public evidence does not disclose pricing, revenue, ARR, gross
    margin, cash, burn, or runway. The June 2026 financing provides substantial gross capital for
    expansion, yet it is not evidence of cash available or a self-funding operating model.
sections:
  - id: revenue-architecture
    title: Revenue architecture is visible, but monetization is not
    body: >-
      Digital Asset presents multiple surfaces that could support enterprise revenue: DA Registry
      for compliant asset issuance, USDCx Reserve for bridging USDC to Canton, Covalidation Service
      for high-availability infrastructure, and a broader set of applications and APIs. An
      independent developer-surface index also identifies four APIs and eleven published
      contracts. These observations support a multi-product enterprise model, but they do not
      establish whether customers pay subscriptions, licenses, implementation fees,
      consumption-based charges, validator fees, or negotiated bundles. Daml's company-described
      portability and reduced provider lock-in may aid adoption while also limiting purely
      proprietary switching-cost economics. Canton Coin fee mechanics are likewise network
      economics, not evidence that Digital Asset recognizes those fees as corporate revenue.
    claimRefs: [CI003, CI004, CI005, CI006, CI013, CI014]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-and-sales-efficiency
    title: Activity signals cannot be converted into sales efficiency
    body: >-
      Digital Asset says it works with more than 700 ecosystem participants, and independent
      commentary points to substantial transaction activity on a Canton-based Broadridge repo
      platform. Those are meaningful adoption indicators, but neither participant count nor
      transaction value is company revenue, ARR, retained customer count, or gross profit. The
      reviewed careers content shows engineering, sales, customer-success, and client-experience
      functions, consistent with a technically demanding enterprise motion that may require
      implementation and support resources. Public materials do not disclose sales-cycle length,
      bookings, customer acquisition cost, payback, concentration, renewal, or net retention.
      Consequently, no defensible sales-efficiency ratio can be calculated from the assigned
      evidence.
    claimRefs: [CI004, CI007, CI008, CI011, CI012, CI016]
    tableRefs: [TI003]
  - id: capital-adequacy
    title: Financing extends strategic capacity, not proven runway
    body: >-
      Digital Asset announced a $355 million funding round on June 11, 2026 and said the proceeds
      would expand Canton offerings, deepen engagement with developers and financial institutions,
      and support network growth. An independent article reported an approximately $2 billion
      valuation. The round size is gross financing raised; it is not equivalent to unrestricted
      cash on hand after transaction expenses, existing obligations, acquisitions, or operating
      use. The investor group includes financial institutions and market-infrastructure firms that
      are plausible ecosystem users, creating useful commercial alignment but also potential
      governance and pricing tension. Without a balance sheet, cash-flow statement, debt schedule,
      burn rate, or committed acquisition budget, the next financing trigger and runway remain
      unquantifiable.
    claimRefs: [CI001, CI002, CI009, CI012, CI015]
  - id: financial-verdict
    title: Financial verdict and diligence blockers
    body: >-
      The evidence supports a credible enterprise product footprint and access to strategic
      capital, but not a revenue-quality or margin conclusion. The strongest adverse source
      explicitly notes that a roughly $2 billion valuation is unsupported by disclosed revenue
      figures. The main underwriting error would be to treat network transaction volume,
      ecosystem participants, or funding raised as revenue, customers, or cash available. Until
      management supplies audited statements and contract-level cohort data, revenue mix, gross
      margin, implementation burden, customer concentration, CAC payback, working capital, and
      runway should remain unknown rather than estimated. A finance diligence package should
      reconcile recognized revenue to product and service streams and separately bridge opening
      cash, the 2026 financing, operating cash use, acquisition commitments, debt, and closing cash.
    claimRefs: [CI005, CI010, CI011, CI012, CI015, CI016]
