        - Comparison is Digital Asset-issued and not an independent benchmark
      - - Private or consortium blockchain
        - Permissioned-network substitute class
        - Unknown
        - Regulated consortia and closed workflows
        - Institutional control and restricted participation
        - Retained sources do not identify a comparable named offer or pricing
      - - Legacy messaging and reconciliation
        - Status quo
        - Existing internal and inter-firm systems; spend not disclosed
        - Institutions prioritizing continuity over network migration
        - Avoids protocol migration and token dependencies
        - Digital Asset, not an independent study, characterizes the inefficiency
      - - Bespoke internal workflow stack
        - Internal-build substitute
        - Unknown
        - Large institutions with engineering and integration capacity
        - Maximum local control over scope and sequencing
        - Time, cost, interoperability, and maintenance burden are unquantified
    notes: >-
      Coverage is a buyer-alternative map, not an exhaustive named-competitor
      census. Unknown cells reflect absent comparable evidence in the assigned
      source pool; funding and participant figures are company-issued.
