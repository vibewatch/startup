  - id: TP003
    title: Pricing and packaging comparison
    columns:
      - Offer or alternative
      - Price or unit
      - Included capability
      - Discount or unknown
      - Underwriting implication
    rows:
      - - Digital Asset enterprise software and support
        - Not publicly listed in retained evidence
        - Enterprise product access and support
        - Contract structure, minimums, discounts, and realized price unknown
        - Direct proposal and customer invoice testing are required
      - - Canton public-infrastructure activity
        - Usage fees paid in Canton Coin and burned
        - Trading, settlement, synchronization, or asset-transfer activity
        - Token exposure, traffic costs, and effective all-in unit cost unknown
        - Separate protocol usage economics from enterprise license economics
      - - DA application and API portfolio
        - Not publicly listed in retained evidence
        - Registry, USDCx Reserve, and Covalidation Service are shown in docs
        - Bundling and cross-product discounts unknown
        - Broader packaging can support expansion but complicates price comparison
      - - Competing protocol, consortium, or internal build
        - No comparable price retained
        - Scope varies by alternative
        - License, implementation, operations, and migration costs unknown
        - Require a same-scope total-cost-of-ownership comparison
    notes: >-
      Public list pricing is incomplete and the units are not comparable.
      Canton Coin usage fees must not be read as Digital Asset enterprise
      software pricing.
    claimRefs: [CP011, CP012, CP013, CP015]
figures:
  - id: FP001
    title: Evidence-constrained competitive positioning map
    type: quadrant
    summary: >-
      Analyst ordinal placement shows how the retained sources characterize
      workflow breadth and institutional privacy or control; it is not a measured
      market benchmark.
    data:
      xAxis:
        label: "Supported workflow breadth (1=narrow, 5=network-wide)"
        min: 1
        max: 5
      yAxis:
        label: "Institutional privacy and control evidence (1=weak, 5=strong)"
        min: 1
        max: 5
      points:
        - label: Digital Asset / Canton
          x: 5
          y: 5
          detail: Company-issued sources support cross-application scope and fine-grained privacy.
        - label: Standalone Daml application
          x: 2
          y: 4
          detail: Digital Asset supports standalone deployment with later connection.
        - label: Fabric or Besu connected through Daml
          x: 3
          y: 3
          detail: The Project Genesis example supports coexistence, not a general benchmark.
        - label: Fully replicated public-chain class
          x: 4
          y: 1
          detail: Placement reflects Digital Asset's privacy critique, not independent testing.
        - label: Private or consortium chain class
          x: 2
          y: 4
          detail: Institutional control is plausible, but comparative breadth is unverified.
        - label: Legacy messaging and reconciliation
          x: 1
          y: 2
          detail: Narrow placement reflects Digital Asset's description of siloed workflows.
    approximationNotes: >-
      Scores are analyst-authored ordinal values derived only from the retained
      source narratives. No independent quantitative benchmark was available;
      positions should be validated through controlled technical and commercial
      evaluation.
    claimRefs: [CP003, CP004, CP005, CP014, CP016]
callouts:
  - calloutType: risk
    title: Comparative proof is the gating diligence issue
    body: >-
      The source pool supports Digital Asset's design thesis and ecosystem scale,
      but not a normalized peer benchmark for price, performance, security,
      implementation effort, or production economics.
    claimRefs: [CP015]
