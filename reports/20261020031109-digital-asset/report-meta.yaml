  topStrengths:
    - >-
      Daml and Canton present a coherent privacy, authorization, interoperability, and atomic-workflow architecture for
      regulated institutions.
    - >-
      The June 2026 $355 million financing and strategically relevant investor syndicate provide substantial capital and
      institutional validation.
    - >-
      Named pilots, production workflows, current applications, and more than 700 company-reported ecosystem
