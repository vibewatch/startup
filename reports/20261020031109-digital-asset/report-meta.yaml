companyProfile:
  summary: >-
    Digital Asset is a New York financial-technology company founded in 2014 by Yuval Rooz, Eric Saraniecki, Shaul Kfir,
    Sunil Hirani, and Don R. Wilson. It created Daml and the Canton Network and now presents a portfolio of
    institutional applications, APIs, and infrastructure services for regulated multi-party financial workflows. Canton
    Foundation governance is distinct from Digital Asset corporate control, and public evidence does not establish
    Digital Asset's revenue capture from network activity.
