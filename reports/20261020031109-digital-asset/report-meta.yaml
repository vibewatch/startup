    - >-
      Private-by-design activity and heavy reliance on participant-reported metrics constrain independent verification
      of network scale.
    - >-
      Reported activity is concentrated in a major Broadridge workflow, while participant and investor relationships do
      not prove diversified paying demand.
    - >-
      Regulatory authorization, token classification, current security assurance, corporate governance, and financing
      preferences require primary documentation.
  unresolvedGaps:
