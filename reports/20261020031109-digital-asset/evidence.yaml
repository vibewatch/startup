evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: leadership and board roster
    missingEvidence: >-
      A current complete executive team, board roster, reporting lines, succession plan, and key-person dependency
      assessment.
    whyItMatters: >-
      Concentrated product and ecosystem leadership could create execution and governance risk that the partial public
      roster cannot measure.
    diligencePath: >-
      Request the current organizational chart, board materials, biographies, employment terms, and documented
      succession plans from management.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: investor map and capitalization
    missingEvidence: >-
      The complete cap table, ownership percentages, security classes, liquidation preferences, board rights, side
      letters, and any debt or credit facilities.
    whyItMatters: >-
      A list of financing participants cannot establish control, dilution, economic seniority, or proceeds still
      available to the business.
    diligencePath: >-
      Obtain the fully diluted cap table, financing documents, debt schedule, and investor-rights agreements through the
      company data room.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: operating scale and liquidity
    missingEvidence: >-
      Audited revenue, ARR, gross margin, customer count, headcount, cash balance, monthly burn, and runway for 2025 and
      2026.
    whyItMatters: >-
      Financing and ecosystem-participant counts do not establish recurring commercial traction, capital efficiency, or
      cash available.
    diligencePath: >-
      Request audited financials, monthly management accounts, customer and ARR reconciliations, payroll records, bank
      statements, and the operating plan.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: adverse legal and regulatory history
    missingEvidence: >-
      Primary legal, regulatory, outage, breach, and complaint records tied directly to Digital Asset rather than broad
      editorial assessments.
    whyItMatters: >-
      The assigned adverse search returned no retained primary record, so the absence of a recorded incident cannot be
      treated as proof of no incidents.
    diligencePath: >-
      Run jurisdiction-specific court, regulator, sanctions, cybersecurity, and service-incident checks during legal and
      technical diligence.
    relatedQuestionRefs:
      - QO008
  - type: private-evidence-only
    severity: material
    topic: market sizing
    missingEvidence: >-
      Bottom-up target-account counts, addressable workflows, pricing, production conversion, and contract-value
      distributions needed to derive TAM, SAM, and SOM.
    whyItMatters: >-
      Without a spend denominator and conversion evidence, market size and attainable share cannot be quantified without
      inventing values.
    diligencePath: >-
      Request management's market model and reconcile it to customer-level contracts, production workflows, and
      independently verifiable institution counts.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer economics
    missingEvidence: >-
      Named budget owners, procurement duration, deployment cost, pricing model, average contract value, renewal
      profile, and implementation-service burden by buyer segment.
    whyItMatters: >-
      Buyer economics determine whether technical interest converts into recurring spend and how quickly the serviceable
      market can be captured.
    diligencePath: >-
      Review a stratified sample of proposals, signed contracts, renewal records, implementation statements of work, and
      procurement timelines.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: adoption evidence
    missingEvidence: >-
      Independent current evidence separating ecosystem participants, developers, pilots, production deployments, paying
      customers, and transaction volume.
    whyItMatters: >-
      The company-reported participant count cannot by itself establish commercial adoption, repeat usage, or market
      penetration.
    diligencePath: >-
      Obtain participant definitions and cohort data, then verify production status and usage directly with a
      representative sample of institutions.
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: adoption constraints
    missingEvidence: >-
      Independent buyer evidence on regulatory approval, integration time, switching cost, counterparty coordination,
      implementation failure, and realized ROI.
    whyItMatters: These constraints govern adoption timing and the discount applied to a broad institutional-blockchain opportunity.
    diligencePath: >-
      Interview compliance, operations, technology, and procurement stakeholders at live customers, stalled pilots, and
      institutions that selected alternatives.
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Same-scope proposals, realized contract prices, implementation fees, support terms, discounts, and total operating
      costs for Digital Asset and at least two buyer alternatives.
    whyItMatters: >-
      Public protocol fees and undisclosed enterprise contracts cannot support a credible total-cost-of-ownership
      comparison.
    diligencePath: >-
      Obtain redacted proposals and invoices from Digital Asset and reference customers, then run a normalized
      three-year cost comparison.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: comparative-proof
    missingEvidence: >-
      Independent technical benchmark and buyer win-loss evidence comparing privacy, throughput, integration effort,
      security, and time to production.
    whyItMatters: >-
      Company positioning and ecosystem directories do not establish relative superiority or the durability of switching
      costs.
    diligencePath: Commission a controlled proof of concept and interview recent won, lost, renewed, and churned enterprise accounts.
    relatedTableRefs:
      - TP001
      - TP002
  - type: private-evidence-only
    severity: material
    topic: revenue-disclosure
    missingEvidence: Audited revenue, ARR, product mix, services mix, recognition policy, and customer concentration.
    whyItMatters: Without these data, the durability and quality of the commercial model cannot be underwritten.
    diligencePath: >-
      Obtain audited financial statements and reconcile bookings, billings, ARR, and recognized revenue by product and
      customer cohort.
    relatedQuestionRefs:
      - QI002
      - QI003
      - QI008
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin, delivery costs, CAC, payback, retention, working capital, and capitalized development policy.
    whyItMatters: The evidence cannot distinguish scalable software economics from implementation-heavy enterprise services.
    diligencePath: >-
      Review cohort contribution margins, time-sheet allocations, implementation staffing, support burden, and fully
      loaded sales costs.
    relatedQuestionRefs:
      - QI004
      - QI005
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Cash on hand, restricted cash, debt, acquisition commitments, monthly burn, downside runway, and next-round
      trigger.
    whyItMatters: Funding raised cannot be translated into current liquidity or financing independence.
    diligencePath: >-
      Reconcile opening cash through the 2026 financing to current cash and model base, downside, and acquisition
      scenarios.
    relatedQuestionRefs:
      - QI006
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: technical-proof-gaps
    missingEvidence: >-
      Current third-party security audits, penetration-test scope, remediation status, incident history, uptime,
      recovery objectives, and reproducible performance benchmarks.
    whyItMatters: >-
      Privacy, resilience, and scale are central product claims for regulated infrastructure, but feature headings and
      marketing statements do not demonstrate operational effectiveness.
    diligencePath: >-
      Review complete audit and penetration-test reports, twelve months of incident and SLA data, architecture diagrams,
      disaster-recovery tests, and benchmark methodology in a technical data room.
    relatedQuestionRefs:
      - QE004
      - QE006
      - QE008
    relatedTableRefs:
      - TE001
      - TE002
      - TE003
  - type: missing-source
    severity: material
    topic: roadmap-direction
    missingEvidence: >-
      A dated module-level roadmap with current release versions, milestone owners, dependencies, deprecations, and
      customer commitments.
    whyItMatters: >-
      A capital-allocation statement establishes direction but does not establish which capabilities will ship, when
      they will ship, or whether historical early-access features reached production.
    diligencePath: >-
      Obtain the board-approved roadmap, release notes, current support matrix, and milestone readout, then reconcile
      them with customer contracts and engineering delivery history.
    relatedQuestionRefs:
      - QE007
    relatedTableRefs:
      - TE001
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      A verifiable developer-signal source such as maintained public repositories, package downloads, release activity,
      contributor counts, forum traffic, or a credible practitioner-community proxy.
    whyItMatters: >-
      The assigned evidence pool contains product documentation but no public measure of developer adoption, release
      velocity, or practitioner engagement.
    diligencePath: >-
      Request repository and package telemetry, release cadence, contributor statistics, developer-support volumes, and
      references from external integration engineers.
    relatedQuestionRefs:
      - QE002
      - QE004
  - type: missing-source
    severity: material
    topic: workflow-outcomes
    missingEvidence: >-
      Production customer telemetry measuring implementation time, transaction performance, reconciliation reduction,
      capital efficiency, adoption, and support burden by workflow.
    whyItMatters: >-
      Public sources describe intended benefits but do not quantify realized outcomes or isolate Digital Asset's
      contribution from customer process changes.
    diligencePath: >-
      Validate three production deployments through customer interviews, contracts, pre-and-post operating metrics, and
      raw platform telemetry.
    relatedQuestionRefs:
      - QE001
      - QE008
    relatedTableRefs:
      - TE002
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: >-
      Account-level NRR, GRR, logo churn, renewal rates, contract duration, cohort expansion, satisfaction, and
      production-usage history.
    whyItMatters: >-
      Ecosystem participation and named deployments do not establish recurring revenue, durability, or expansion within
      retained accounts.
    diligencePath: >-
      Obtain an anonymized customer cohort export, contract schedule, renewal ledger, and production-usage report;
      reconcile them to billed revenue and interview representative renewed, churned, pilot, and production customers.
    relatedQuestionRefs:
      - QU004
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: >-
      Paying-customer count, revenue by customer and product, top-one and top-five customer shares, channel-attributed
      revenue, and overlap between investors, participants, and buyers.
    whyItMatters: >-
      Named institutional breadth may coexist with revenue concentration or non-commercial participation, materially
      changing customer and financing risk.
    diligencePath: >-
      Review the customer master, invoices, deferred-revenue schedule, partner agreements, and investor-related
      commercial contracts, then calculate concentration on recognized and contracted revenue bases.
    relatedQuestionRefs:
      - QU001
      - QU006
  - type: enumeration-incomplete
    severity: material
    topic: named-customers
    missingEvidence: >-
      Current production-versus-pilot status, implementation date, scope, outcome, and contract economics for every
      named institution.
    whyItMatters: >-
      Public references span prototypes, builds, pilots, network participation, and live workflows, so logo counts would
      overstate verified production adoption.
    diligencePath: >-
      Request a customer-by-customer deployment register and validate a sample with customer references, procurement
      records, production telemetry, and renewal documentation.
    relatedQuestionRefs:
      - QU003
      - QU008
    relatedTableRefs:
      - TU003
