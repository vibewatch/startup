  topStrengths:
    - Daml 和 Canton 为受监管机构提供了一套完整的隐私、授权、互操作和原子化工作流架构。
    - 2026 年 6 月的 $355 million 融资及其具有战略意义的投资人联合体，带来了充足资金和机构层面的验证。
    - 已点名的试点、生产工作流、现有应用以及公司报告的 700 多名生态参与者，显示出广泛参与。
  topRisks:
    - 收入、ARR、毛利率、现金、烧钱速度、现金跑道、定价和留存率仍未披露，无法评估经营质量和回报空间。
    - 隐私优先的活动设计，以及对参与者自报指标的高度依赖，限制了对网络规模的独立验证。
    - 据报活动集中在 Broadridge 的一项主要工作流上；参与者和投资人关系也不能证明付费需求已经多元化。
    - 监管授权、代币分类、当前安全保障、公司治理和融资优先权仍需一手文件佐证。
  unresolvedGaps:
    - 经审计的 2025-2026 年收入、ARR、毛利率、现金流、烧钱速度和现金跑道。
    - 2026 年 6 月融资的完整资本结构、所有权、稀释、优先股堆叠和董事会权利。
    - 付费客户数、生产状态、合同金额、留存率，以及按部署划分的客户集中度。
    - 监管、代币分类、隐私、安全审计、事件和恢复方面的一手证据。
    - 当前高管和董事会名单、继任计划，以及相对于 Canton 治理安排，Digital Asset 在合同上的商业化权利。
