company:
  name: Digital Asset
chapter:
  number: 6
  title: Customers
  summary: >-
    Digital Asset shows broad institutional reach through more than 700 claimed ecosystem
    participants, named capital-markets deployments, and a multi-category Canton pilot, but the
    evidence mixes participants, builders, pilots, investors, and production users. Public sources
    do not disclose paying-customer count, retention, contract duration, or revenue concentration,
    so commercial durability remains unproven.
sections:
  - id: customer-segments
    title: Institutional reach spans buyers, operators, and builders
    body: >-
      The visible customer surface is an institutional ecosystem rather than a single buyer
      category. Banks and asset managers appear as users of tokenization and workflow
      infrastructure; exchanges, clearinghouses, and other market operators appear as deployment
      owners; and developers or application operators consume Apps, APIs, and validation services.
      Digital Asset's documentation exposes Registry, USDCx Reserve, and Covalidation Service
      offerings, while its privacy design assigns transaction visibility by party role. This
      product shape fits regulated multi-party workflows, but public evidence does not identify
      which institutions pay Digital Asset directly, which participate only in Canton, or how
      revenue is distributed among software, services, and ecosystem activity.
    claimRefs: [CU003, CU004, CU005, CU006, CU007, CU014]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption signals are substantial but not directly comparable
    body: >-
      The strongest current scale statement is Digital Asset's June 2026 claim that it works with
      more than 700 ecosystem participants. That denominator is not defined as paying customers,
      active users, production deployments, or legal entities. Independent reporting supplies
      more specific but older signals: a 2024 Canton pilot included asset managers, banks,
      custodians, exchanges, and a market-infrastructure provider, while Broadridge's DLR platform
      was reported to process roughly $120 billion of repo daily. These measures demonstrate
      institutional engagement and a live workflow, not a coherent customer-growth series.
      Industry context is also cautionary: only 25% of surveyed EU-bank DLT pilots had reached
      in-use status in 2023.
    claimRefs: [CU001, CU009, CU010, CU011, CU012]
    tableRefs: [TU002]
  - id: named-customer-proof
    title: Named proof ranges from prototypes to operating infrastructure
    body: >-
      Named references establish that Digital Asset technology has entered consequential
      capital-markets workflows, but the proof quality varies. The 2022 company account described
      Goldman Sachs as using Daml for tokenized-asset infrastructure, Deutsche Börse as building a
      post-trade platform, and Xpansiv as building an ESG commodities exchange; it explicitly
      described Project Genesis for the BIS and Hong Kong Monetary Authority as a prototype.
      Independent reporting later identified Broadridge's DLR as a live high-volume workflow and
      described the Global Synchronizer as live in July 2024. A 2026 third-party profile lists a
      wider production-and-pilot footprint, but does not provide contract values, implementation
      dates, renewal evidence, or customer-verified outcomes for each name.
    claimRefs: [CU005, CU006, CU007, CU008, CU010, CU011, CU014, CU015]
    tableRefs: [TU003]
  - id: durability-and-concentration
    title: Commercial durability and concentration remain the central diligence gaps
    body: >-
      Publicly visible ecosystem breadth does not establish retention or commercial durability.
      No retained source discloses NRR, GRR, churn, renewal rates, contract length, cohort behavior,
      customer acquisition cost, or the share of revenue attributable to the largest customers.
      Digital Asset says new capital will deepen engagement with developers and financial
      institutions and expand Canton offerings, which indicates an ecosystem-led expansion model
      rather than documented account expansion. The model also faces conversion risk: independent
      reporting notes low pilot-to-production rates across bank DLT projects and records the
      shelving of the ASX replacement. CoinLaunch's critique of roadmap and marketing visibility
      adds a lower-quality adverse signal, not proof of customer loss.
    claimRefs: [CU002, CU012, CU013, CU016]
    figureRefs: [FU001]
