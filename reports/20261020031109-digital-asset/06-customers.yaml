figures:
  - id: FU001
    title: Institutional adoption journey and expansion surfaces
    type: journey-map
    summary: >-
      Public evidence shows a path from workflow selection through pilot and production, with
      ecosystem expansion possible but commercial conversion and retention undisclosed.
    data:
      nodes:
        - id: need
          label: Regulated workflow need
          detail: "Privacy, compliance, control, and multi-party coordination define the entry problem."
          touchpoints:
            - "Institutional product and operations teams"
            - "Daml privacy model"
        - id: build
          label: Build or integrate
          detail: "Apps, APIs, Registry, bridge, and covalidation services form visible adoption surfaces."
          touchpoints:
            - "DA Apps and APIs"
            - "Developer and integration teams"
        - id: pilot
          label: Pilot or prototype
          detail: "Multi-institution simulations and prototypes test coordinated workflows."
          touchpoints:
            - "Canton pilot"
            - "Project Genesis"
        - id: production
          label: Production deployment
          detail: "Named infrastructure such as Broadridge DLR provides the strongest operating proof."
          touchpoints:
            - "Production workflow"
            - "Live Global Synchronizer"
        - id: participate
          label: Ecosystem participation
          detail: "Digital Asset reports more than 700 ecosystem participants without a paying-user denominator."
          touchpoints:
            - "Institutions"
            - "Developers"
            - "Applications"
        - id: expand
          label: Expand across workflows
          detail: "Additional assets, applications, and counterparties are the stated expansion mechanism."
          touchpoints:
            - "Tokenization"
            - "Collateral mobility"
            - "Settlement and payments"
    approximationNotes: >-
      Conceptual sequence only; stages do not share a measured cohort, conversion rate, or time
      basis, and no retention or revenue progression is inferred.
    claimRefs: [CU002, CU003, CU004, CU009, CU010, CU011]
callouts:
  - calloutType: risk
    title: Ecosystem breadth is not customer retention
    body: >-
      The 700-plus participant claim cannot be converted into customers, active deployments, or
      recurring revenue without a participant definition and account-level retention data.
    claimRefs: [CU001]
  - calloutType: insight
    title: Production proof exists, but it is concentrated in a few visible workflows
    body: >-
      Broadridge provides the clearest independently reported production-scale reference, while
      several other named institutions are evidenced as builds, pilots, or prototypes.
    claimRefs: [CU005, CU006, CU007, CU008, CU011]
