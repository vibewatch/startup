  evidenceGaps:
    - type: enumeration-incomplete
      severity: material
      topic: leadership and board roster
      missingEvidence: >-
        A current complete executive team, board roster, reporting lines, succession
        plan, and key-person dependency assessment.
      whyItMatters: >-
        Concentrated product and ecosystem leadership could create execution and
        governance risk that the partial public roster cannot measure.
      diligencePath: >-
        Request the current organizational chart, board materials, biographies,
        employment terms, and documented succession plans from management.
      relatedQuestionRefs: [QO002]
      relatedTableRefs: [TO002]
    - type: enumeration-incomplete
      severity: material
      topic: investor map and capitalization
      missingEvidence: >-
        The complete cap table, ownership percentages, security classes, liquidation
        preferences, board rights, side letters, and any debt or credit facilities.
      whyItMatters: >-
        A list of financing participants cannot establish control, dilution, economic
        seniority, or proceeds still available to the business.
      diligencePath: >-
        Obtain the fully diluted cap table, financing documents, debt schedule, and
        investor-rights agreements through the company data room.
      relatedQuestionRefs: [QO004]
      relatedTableRefs: [TO003]
    - type: private-evidence-only
      severity: material
      topic: operating scale and liquidity
      missingEvidence: >-
        Audited revenue, ARR, gross margin, customer count, headcount, cash balance,
        monthly burn, and runway for 2025 and 2026.
      whyItMatters: >-
        Financing and ecosystem-participant counts do not establish recurring
        commercial traction, capital efficiency, or cash available.
      diligencePath: >-
        Request audited financials, monthly management accounts, customer and ARR
        reconciliations, payroll records, bank statements, and the operating plan.
      relatedQuestionRefs: [QO006]
      relatedTableRefs: [TO001]
    - type: missing-source
      severity: minor
      topic: adverse legal and regulatory history
      missingEvidence: >-
        Primary legal, regulatory, outage, breach, and complaint records tied directly
        to Digital Asset rather than broad editorial assessments.
      whyItMatters: >-
        The assigned adverse search returned no retained primary record, so the
        absence of a recorded incident cannot be treated as proof of no incidents.
      diligencePath: >-
        Run jurisdiction-specific court, regulator, sanctions, cybersecurity, and
        service-incident checks during legal and technical diligence.
      relatedQuestionRefs: [QO008]
