company:
  name: Digital Asset
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Digital Asset is a New York financial-technology company founded in 2014 that
    created Daml and the Canton Network. Its June 2026 $355 million financing and
    reported roughly $2 billion valuation signal strong institutional backing, while
    revenue, ARR, customer count, headcount, cash availability, and board composition
    remain undisclosed in the assigned evidence.
sections:
  - id: identity-leadership-and-governance
    title: Identity, leadership, and governance
    body: >-
      Digital Asset was founded in New York in October 2014 by Yuval Rooz, Eric
      Saraniecki, Shaul Kfir, Sunil Hirani, and Don R. Wilson. The company builds
      distributed-ledger infrastructure for financial institutions: Daml is its
      smart-contract language, while Canton is the privacy-oriented network developed
      around that model. Rooz is identified as co-founder and chief executive; the
      retained sources also document that he succeeded Blythe Masters after her
      2018 departure. The public record in this allocation is much thinner on the
      current executive bench, board composition, investor rights, and succession.
      Canton.Wiki describes the Canton Foundation, rather than Digital Asset, as the
      network-governance body and Digital Asset as one participant, an important
      distinction between influence over the ecosystem and formal control. That
      governance description is useful context, but it does not resolve corporate
      governance or key-person dependence at Digital Asset itself.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006]
    tableRefs: [TO001, TO002]
  - id: capitalization-and-scale
    title: Capitalization, institutional backing, and missing scale metrics
    body: >-
      Digital Asset announced a $355 million round on June 11, 2026 led by a16z
      crypto, with participation from institutions spanning banks, market
      infrastructure, trading firms, asset managers, and crypto investors. A
      separate editorial profile and a funding database report a valuation of about
      $2 billion, but the company announcement does not disclose valuation, so this
      remains a third-party-reported figure rather than a verified transaction term.
      The financing follows a company-listed $135 million raise in 2025 and other
      strategic investments. Funding raised is not cash available: the assigned
      evidence provides no cap table, preference stack, debt schedule, cash balance,
      burn rate, or runway. It also does not provide audited revenue, ARR, headcount,
      or a customer count. The company's statement that it works with more than 700
      ecosystem participants is not used as a customer denominator because
      participants and paying customers are different populations.
    claimRefs: [CO012, CO013, CO014, CO015]
    tableRefs: [TO003]
  - id: development-and-execution-history
    title: Development and execution history
    body: >-
      The available chronology shows a long transition from enterprise distributed
      ledgers toward a public institutional network. Digital Asset open-sourced Daml
      in 2019, completed a Series D in 2021, and announced Daml 2.0 in 2022 with
      Canton-based privacy and interoperability. Its official timeline places the
      Canton launch with more than 30 market participants in 2023 and the public
      Layer 1 mainnet launch in 2024, followed by larger strategic financings in
      2025 and 2026. This progression demonstrates durable product and financing
      activity, but the milestones are predominantly company-issued and do not by
      themselves establish production usage, recurring software economics, or
      durable customer retention. CoinLaunch separately flags the absence of a
      roadmap and weak marketing infrastructure; that is an adverse editorial
      assessment, not a benchmark or verified operating failure. The diligence
      priority is therefore to connect the visible milestone cadence to contracted
      revenue, live production workloads, and accountable corporate governance.
    claimRefs: [CO007, CO008, CO009, CO010, CO011, CO012, CO013, CO014, CO016]
    figureRefs: [FO001]
