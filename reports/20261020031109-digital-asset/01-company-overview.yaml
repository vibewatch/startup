callouts:
  - calloutType: strength
    title: Institutionally backed product continuity
    body: >-
      The company has sustained a decade-long product arc and attracted a broad
      group of financial-market investors, culminating in the 2026 round.
    claimRefs: [CO007, CO009, CO011, CO014]
  - calloutType: risk
    title: Valuation and financing outrun disclosed operating evidence
    body: >-
      The reported valuation is not confirmed in the company announcement, and the
      assigned evidence does not disclose audited revenue, ARR, burn, runway, or
      customer count.
    claimRefs: [CO014, CO015]
