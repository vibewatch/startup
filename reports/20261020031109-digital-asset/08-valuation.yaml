schemaVersion: "report-v2"
artifact: valuation
slug: digital-asset
runDate: 2026-10-20
company:
  name: Digital Asset
chapter:
  number: 8
  title: Valuation
  summary: >-
    Digital Asset's June 2026 $355 million financing and institutional investor
    syndicate support strategic relevance, but the approximately $2 billion
    valuation is third-party reported and the assigned public evidence does not
    disclose revenue, cash burn, preference terms, or a model-appropriate
    comparable set. The resulting stance is stretched and the recommendation is
    track/research-more rather than buy.
sections:
  - id: decision-and-financing-context
    title: Decision and financing context
    body: >-
      Digital Asset announced a $355 million financing led by a16z crypto in
      June 2026, and an independent tracker reports an approximately $2 billion
      valuation. That is strong financing validation, especially because the
      syndicate includes institutions active in banking, trading, market
      infrastructure, and digital assets. It is not sufficient price validation:
      Digital Asset's announcement did not state the valuation, and the earlier
      May report described a smaller contemplated raise with terms still subject
      to change. The financing amount establishes capital raised, not cash
      available, burn, or runway. Without audited operating economics or
      security-level terms, a precise ownership, dilution, return, or hold-period
      calculation would create false precision. The appropriate decision is to
      track the company and request private evidence before underwriting the
      reported mark.
    claimRefs: [CV001, CV002, CV003, CV005, CV012, CV013, CV015, CV016]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: thesis-and-anti-thesis
    title: Thesis and anti-thesis
    body: >-
      The thesis is that Digital Asset combines a privacy-oriented technical
      architecture with unusually relevant strategic backers and a company-
      reported ecosystem of more than 700 participants. Its official product
      surfaces cover asset registry, reserve bridging, and infrastructure
      services, while Daml and Canton are designed to limit transaction
      visibility by role. Those attributes could support durable institutional
      workflows if they convert into recurring, high-margin revenue. The
      anti-thesis is equally important: network governance sits outside Digital
      Asset, Canton Coin is not company equity or a claim on corporate revenue,
      and privacy makes activity harder to verify independently. Strategic
      investor participation may represent ecosystem alignment rather than
      evidence of software revenue, retention, or defensible unit economics.
    claimRefs: [CV004, CV005, CV006, CV007, CV008, CV009, CV010, CV011, CV012]
    tableRefs: [TV002]
  - id: scenarios-and-entry-discipline
    title: Scenarios and entry discipline
    body: >-
      The scenario framework is deliberately conditional because the evidence
      does not support a conventional revenue multiple or a probability-weighted
      intrinsic value. A bull outcome requires the company to connect ecosystem
      scale and differentiated privacy technology to audited recurring revenue,
      retention, gross margin, and efficient cash use. The base case treats the
      approximately $2 billion report as a financing marker, not independently
      demonstrated fair value, and keeps the company on a diligence track. A
      bear outcome emerges if network activity cannot be monetized by Digital
      Asset, if independent verification remains weak, or if preference and
      dilution terms transfer downside away from new common-equity investors.
      Entry should therefore be conditioned on economics and instrument terms,
      not on investor logos alone.
    claimRefs: [CV001, CV002, CV006, CV007, CV008, CV009, CV012, CV013, CV014, CV016]
    tableRefs: [TV003]
  - id: comparables-exit-and-diligence
    title: Comparables, exit readiness, and final diligence
    body: >-
      The assigned evidence does not establish a defensible public-company,
      private-round, or M&A comparable set. Digital Asset spans enterprise
      software, network infrastructure, and ecosystem development, while Canton
      Coin is a separate exposure; applying token-network values to company
      equity would therefore be misleading. Exit timing and target returns are
      also not supportable without ownership, dilution, preference, revenue, and
      cash-flow data. Final diligence should request audited 2025-2026 financials,
      ARR and cohort retention, gross margin, burn and runway, the complete
      capitalization and preference stack, customer-level production revenue,
      Digital Asset's monetization rights relative to Canton governance, and
      board-approved operating plans. Thesis-break triggers are weak conversion
      of announced participation into paid production use, sustained cash burn
      without economic disclosure, or financing terms that subordinate new
      investors despite the reported valuation.
    claimRefs: [CV006, CV007, CV008, CV010, CV012, CV013, CV014, CV015, CV016]
tables:
  - id: TV001
    title: Recommendation summary
    columns:
      - Decision field
      - Current assessment
      - Decision implication
    rows:
      - [Recommendation, "Track / research more", "Do not underwrite a buy until audited economics and security terms are available."]
      - [Confidence, "Medium on financing facts; low on fair value", "The round amount is corroborated, but the valuation and operating basis are not fully disclosed."]
      - [Risk rating, High, "Verification, monetization, governance, dilution, and liquidity remain material."]
      - [Valuation stance, Stretched, "Approximately $2B is a reported financing mark rather than a value supported by disclosed revenue or cash flow."]
      - [Entry discipline, "Private diligence required", "Require audited financials, cap-table and preference terms, and production-customer economics before pricing."]
    notes: >-
      Assessments use the June-July 2026 financing evidence and explicitly treat
      undisclosed revenue, cash, burn, ownership, dilution, and preferences as
      unavailable rather than estimated.
    claimRefs: [CV001, CV002, CV012, CV013, CV014, CV015, CV016]
  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - Lens
      - Evidence-based argument
      - What would change the view
    rows:
      - [Thesis, "A $355M financing supplies capital and institutional validation.", "Audited evidence that capital converts into durable recurring revenue would strengthen the thesis."]
      - [Thesis, "The investor roster spans banks, market infrastructure, trading, and crypto participants.", "Paid production adoption and renewal data would distinguish commercial demand from strategic alignment."]
      - [Thesis, "Daml and Canton emphasize role-based, sub-transaction privacy for regulated workflows.", "Independent production benchmarks and customer economics would validate defensibility."]
      - [Anti-thesis, "Network governance is separate from Digital Asset.", "Contractual evidence of durable company monetization rights would reduce value-capture risk."]
      - [Anti-thesis, "Canton Coin is not Digital Asset equity or a claim on company revenue.", "A documented economic bridge between network use and company revenue would narrow the disconnect."]
      - [Anti-thesis, "Privacy makes public activity harder to verify independently.", "Audited usage, revenue, and customer-retention reporting would reduce verification risk."]
    notes: >-
      Company-issued product and ecosystem claims are separated from independent
      reporting; the table does not treat strategic participation as independently
      verified revenue or customer retention.
    claimRefs: [CV004, CV005, CV006, CV007, CV008, CV009, CV011, CV012]
  - id: TV003
    title: Bull, base, and bear scenarios
    columns:
      - Scenario
      - Explicit assumptions
      - Valuation / return logic
      - Probability signal
      - Downside trigger
    rows:
      - [Bull, "Audited recurring revenue, strong retention and margins, efficient burn, and paid production adoption validate network-to-company monetization.", "At or above the reported ~$2B could become supportable only after economics and instrument terms establish value capture; no target return is currently calculable.", "Positive only if independent financial and customer evidence closes the principal gaps.", "Ecosystem participation fails to convert into paid recurring production use."]
      - [Base, "The financing extends runway and ecosystem development, but public operating economics and preference terms remain unavailable.", "Treat ~$2B as a financing marker, not demonstrated fair value; remain on track/research-more.", "Current evidence most directly supports this conditional posture, not a numeric probability.", "Continued nondisclosure of audited economics or an unfavorable preference stack."]
      - [Bear, "Network activity proves difficult to monetize, independent verification stays limited, or dilution and preferences weaken common-equity outcomes.", "Fair value could be below the reported mark or require a down round; the evidence cannot support a lower bound.", "Rises if burn, concentration, weak retention, or governance-value-capture gaps appear in diligence.", "Weak revenue conversion, sustained burn, adverse terms, or loss of strategic adoption."]
    notes: >-
      Scenario ranges remain qualitative because the assigned evidence provides
      no audited revenue, cash flow, ownership, preference, or comparable-transaction
      data; probability signals are observable conditions rather than invented percentages.
    claimRefs: [CV001, CV002, CV006, CV009, CV012, CV013, CV014, CV016]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Financing and technical differentiation are offset by missing economics and
      verification constraints, leading to a track/research-more decision.
    data:
      nodes:
        - id: financing
          label: "$355M financing"
          detail: "Corroborated round amount led by a16z crypto."
        - id: strategic-signal
          label: "Institutional strategic signal"
          detail: "Broad finance and market-infrastructure investor participation."
        - id: differentiation
          label: "Privacy-oriented product differentiation"
          detail: "Role-based visibility and a current institutional-app portfolio."
        - id: verification
          label: "Public verification constraint"
          detail: "Privacy complicates independent activity verification."
        - id: economics
          label: "Economics and terms missing"
          detail: "Revenue, burn, runway, cap table, and preferences are undisclosed."
        - id: decision
          label: "Track / research more"
          detail: "Require audited economics and instrument terms before pricing."
    approximationNotes: >-
      The ordered flow is qualitative and does not assign weights, probabilities,
      conversion rates, or a valuation estimate.
    claimRefs: [CV003, CV009, CV010, CV011, CV015, CV016]
callouts:
  - calloutType: recommendation
    title: Price-sensitive recommendation
    body: >-
      Track Digital Asset, but do not treat the reported approximately $2 billion
      financing mark as independently supported fair value until audited economics
      and security terms make ownership and return underwriting possible.
    claimRefs: [CV002, CV012, CV013, CV014, CV016]
  - calloutType: risk
    title: Funding is not runway
    body: >-
      The $355 million announcement establishes the size of a financing round; it
      does not establish cash available, burn rate, or runway.
    claimRefs: [CV001, CV015]
