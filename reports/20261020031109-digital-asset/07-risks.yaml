callouts:
  - calloutType: "risk"
    title: "Scale is not externally auditable"
    body: >-
      Private activity can be commercially valuable while still limiting diligence. Underwrite
      named production contracts and counterparty-verified activity, not aggregate network totals.
    claimRefs: [CR001, CR002]
  - calloutType: "recommendation"
    title: "Release capital only against evidence milestones"
    body: >-
      Require primary regulatory confirmation, current security assurance, diversified production
      activity, and audited financials before treating adoption claims as durable enterprise value.
    claimRefs: [CR003, CR004, CR005, CR016]
