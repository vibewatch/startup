company:
  name: "Digital Asset"
chapter:
  number: 7
  title: "Risks"
  summary: >-
    The central diligence risk is evidence opacity: Canton is designed to keep transaction data
    private, while the strongest available scale indicator is concentrated in one institutional
    repo platform. Digital Asset discloses substantial new funding and a broad control surface,
    but primary regulatory records, current security-assurance reports, audited financials, and
    counterparty-level economics remain unavailable in the assigned evidence.
sections:
  - id: "regulatory-and-legal-exposure"
    title: "Regulatory and legal exposure"
    body: >-
      The evidence does not establish that Canton or the Canton Foundation lacks required
      authorization. It establishes only that an independent September 2026 profile found no
      licence or named regulator approval for either entity, while Digital Asset describes
      privacy, compliance, control, and interoperability as built into Canton. That distinction
      matters because technical compliance features are not substitutes for jurisdiction-specific
      legal authority. Canton Coin adds a separate classification and disclosure question: an
      independent profile states that the token's market value does not represent ownership of
      Canton's recorded repo assets. The investment posture should therefore remain conditional
      on a counsel-produced jurisdiction map, primary regulator evidence, token-rights analysis,
      and current privacy/security assurance documents.
    claimRefs: [CR003, CR004, CR007, CR008]
    tableRefs: [TR001]
  - id: "operational-security-and-verifiability"
    title: "Operational, security, and verifiability risk"
    body: >-
      Privacy is simultaneously the product advantage and the largest verification constraint.
      Because outside observers cannot inspect all activity, aggregate volumes and asset values
      depend on reporting by the network or its members. Digital Asset's public documentation
      lists controls including blocklists, allowlists, asset recovery, proof of transfer, audits,
      monitoring, and status, but the assigned pool does not include the underlying audit reports,
      incident history, recovery tests, service levels, or control exceptions. The 2022 technical
      description also assigns confirmation collection to a central commit coordinator on the
      underlying ledger provider. Investors should test coordinator failure handling, validator
      failover, data-reconciliation controls, privileged access, and independent incident
      disclosure rather than inferring resilience from feature labels.
    claimRefs: [CR001, CR004, CR012, CR013, CR015]
    tableRefs: [TR002]
  - id: "dependencies-and-financial-model"
    title: "Partner, concentration, and financial-model risk"
    body: >-
      The headline represented-asset figure is not diversified proof of demand. One independent
      profile attributed about $328 billion as of September 10, 2026 almost entirely to
      Broadridge's repo system, making counterparty and use-case concentration a first-order risk.
      A separate profile notes that many Digital Asset investors are also Canton participants,
      which aligns incentives but weakens the evidentiary value of partner announcements as
      independent market validation. Digital Asset announced $355 million of financing for
      ecosystem expansion, yet funding raised is neither revenue nor cash runway. Without audited
      revenue, burn, margin, contractual concentration, and capital-availability data, the
      investment case cannot quantify durability or the cost of maintaining institution-grade
      infrastructure.
    claimRefs: [CR002, CR005, CR006, CR009, CR010, CR014, CR016]
    tableRefs: [TR003]
  - id: "monitoring-and-thesis-breaks"
    title: "Monitoring indicators and thesis-break triggers"
    body: >-
      The risk program should track verifiable milestones rather than aggregate promotional
      metrics. Near-term indicators are a completed DTCC Treasury rollout, evidence that the
      planned GS DAP transition occurred without customer or control disruption, publication of
      current third-party security assurances, diversified represented and distributed activity,
      and audited company economics. A reviewer also flagged the absence of a roadmap, while
      Digital Asset's older product release described cross-application composition as early
      access; current production maturity needs direct confirmation. Thesis-break triggers are a
      material regulatory restriction, a severe unresolved privacy or settlement incident,
      failure of a major announced market-infrastructure deployment, sustained dependence on one
      platform for reported scale, or financing needs unsupported by recurring gross profit.
      None of those events is asserted to have occurred; they are monitorable decision rules.
    claimRefs: [CR002, CR011, CR012, CR014, CR016]
    figureRefs: [FR001]
