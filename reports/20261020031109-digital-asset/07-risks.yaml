      - ["Capital and ecosystem participation", "Strategic investors and network members", "Funding, validation, and adoption", "Some backers are also participants", "Aligned announcements overstate independent demand validation", "High", "Track arm's-length paying deployments and renewals", "Medium-high"]
      - ["GS DAP transition", "Goldman Sachs ecosystem", "Major institutional platform", "A third party reported a planned standalone-company transition", "Transition delay or control disruption weakens a flagship proof point", "High", "Confirm legal completion, customer continuity, and operating controls", "High"]
      - ["Tokenized Treasury rollout", "DTCC", "Market-infrastructure deployment", "Rollout was targeted for the second half of 2026", "Delay or limited scope reduces a major adoption catalyst", "High", "Verify production launch, instrument scope, volume, and economics", "Medium-high"]
    notes: "Concentration signals are not revenue shares; public deployment milestones need contract, production, and economic confirmation."
    claimRefs: [CR002, CR009, CR010, CR014, CR016]
