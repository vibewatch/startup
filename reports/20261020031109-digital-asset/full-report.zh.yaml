  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 决策与融资背景
        blocks:
          - type: paragraph
            body: >-
              Digital Asset 于 2026 年 6 月宣布获得由 a16z crypto 领投的 $355 million 融资，独立追踪机构报告估值约为 $2
              billion。这是强劲的融资验证，尤其是因为投资团包含活跃于银行、交易、市场基础设施和数字资产领域的机构。但这不足以验证价格：Digital Asset 的公告没有写明估值，较早的 5
              月报道则称当时考虑的融资规模更小、条款仍可能变化。融资额证明募集了多少资本，不证明可用现金、烧钱或现金跑道。在缺少经审计经营数据或证券级条款的情况下，精确计算股权、稀释、回报或持有期会制造虚假精确。合适的决策是持续跟踪公司，并在评估这一报道估值前要求私有证据。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV012
              - CV013
              - CV015
              - CV016
