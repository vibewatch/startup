  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 融资和技术差异化被经济数据缺失与验证约束抵消，因此建议跟踪 / 继续研究。
    data:
      nodes:
        - id: financing
          label: $355M 融资
          detail: 由 a16z crypto 领投且金额获多方佐证的融资轮。
        - id: strategic-signal
          label: 机构战略信号
          detail: 金融和市场基础设施投资者广泛参与。
        - id: differentiation
          label: 隐私导向的产品差异化
          detail: 基于角色的可见性与当前机构应用组合。
        - id: verification
          label: 公开验证约束
          detail: 隐私机制使独立活动验证更复杂。
        - id: economics
          label: 经济数据与条款缺失
          detail: 收入、烧钱、现金续航、股权结构表和优先股堆叠均未披露。
        - id: decision
          label: 跟踪 / 继续研究
          detail: 定价前需要经审计的经济数据和工具条款。
    approximationNotes: 该有序流程是定性的，不赋予权重、概率、转化率或估值估计。
    claimRefs:
      - CV003
      - CV009
      - CV010
      - CV011
      - CV015
      - CV016
