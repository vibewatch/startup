            body: >-
              Digital Asset 提供的是分层产品，而不是单一应用。Daml 表达多方权利、义务、权限和原子工作流动作；Canton 连接参与账本，同时把可见性限制在获授权方；当前 DA Apps 文档则展示了 DA
