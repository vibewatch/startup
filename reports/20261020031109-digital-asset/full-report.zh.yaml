      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 规模无法接受外部审计
            body: 私有活动可以具有商业价值，却仍会限制尽调。应评估已命名的生产合同和交易对手核实的活动，而不是汇总网络总量。
