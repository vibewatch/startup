chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Digital Asset 于 2014 年 10 月在纽约由 Yuval Rooz、Eric Saraniecki、Shaul Kfir、Sunil Hirani 和 Don R. Wilson
              创立。公司为金融机构打造分布式账本基础设施：Daml 是其智能合约语言，Canton 则是围绕这一模型开发的隐私导向网络。Rooz 被列为联合创始人兼 CEO；保留的来源还记录了他在 Blythe Masters
              于 2018 年离职后接任。现有公开记录对当前高管团队、董事会构成、投资者权利和继任安排的披露要薄弱得多。Canton.Wiki 将 Canton Foundation 而不是 Digital Asset
              描述为网络治理机构，并将 Digital Asset 列为参与者；这清楚区分了生态影响力与正式控制权。这一治理描述有助于理解背景，但无法解决 Digital Asset 自身的公司治理或关键人物依赖问题。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO006
          - type: table
            tableRef: TO001
            claimRefs:
              - CO003
              - CO014
              - CO015
          - type: table
            tableRef: TO002
            claimRefs:
              - CO002
              - CO005
      - number: '1.2'
        title: 资本结构、机构支持与规模指标缺口
        blocks:
          - type: paragraph
            body: >-
              Digital Asset 于 2026 年 6 月 11 日宣布获得 a16z crypto 领投的 $355 million
              融资，参与方覆盖银行、市场基础设施机构、交易公司、资产管理公司和加密投资者。一篇独立编辑报道和一家融资数据库称估值约为 $2
              billion，但公司公告没有披露估值，因此这仍是第三方报道的数字，而非经核实的交易条款。本轮融资之前，公司披露过 2025 年的 $135 million
              融资及其他战略投资。融资额不等于可用现金：现有证据没有提供股权结构表、优先股堆叠、债务安排、现金余额、烧钱速度或现金跑道，也没有提供经审计收入、ARR、员工数或客户数。公司称其与 700
              多个生态参与者合作，但参与者和付费客户是不同人群，因此不能把参与者数当作客户分母。
            claimRefs:
              - CO012
              - CO013
              - CO014
              - CO015
          - type: table
            tableRef: TO003
            claimRefs:
              - CO014
              - CO015
      - number: '1.3'
        title: 发展与执行历史
        blocks:
          - type: paragraph
            body: >-
              现有时间线显示，公司长期从企业分布式账本转向公开的机构级网络。Digital Asset 于 2019 年将 Daml 开源，2021 年完成 Series D，2022 年宣布推出具备 Canton
              隐私和互操作能力的 Daml 2.0。其官方时间线显示，Canton 于 2023 年携 30 多家市场参与者上线，公共 Layer 1 主网于 2024 年上线，随后在 2025 年和 2026
              年完成规模更大的战略融资。这一路径证明了持续的产品和融资活动，但这些里程碑主要由公司自行发布，不能单独证明生产使用、经常性软件经济性或持久客户留存。CoinLaunch
              另行指出公司缺少路线图、营销基础设施薄弱；这属于负面的编辑评价，并非基准数据或经核实的经营失败。因此，尽调重点应是把可见的里程碑节奏与签约收入、实际生产工作负载和可问责的公司治理连接起来。
            claimRefs:
