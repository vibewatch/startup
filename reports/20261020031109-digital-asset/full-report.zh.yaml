      - - 正论
        - 投资者涵盖银行、市场基础设施、交易和加密行业参与者。
        - 付费生产采用与续约数据能区分商业需求和战略协同。
      - - 正论
        - Daml 与 Canton 强调面向受监管工作流、基于角色且细到子交易的隐私。
        - 独立生产基准和客户经济数据能验证其防御性。
      - - 反论
        - 网络治理与 Digital Asset 分离。
        - 若有合同证据证明公司拥有持久的变现权，价值捕获风险会下降。
