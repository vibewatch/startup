            body: >-
              风险计划应跟踪可验证里程碑，而不是汇总宣传指标。近期指标包括 DTCC Treasury 部署完成、计划中的 GS DAP
              迁移已完成且没有客户或控制中断、发布当前第三方安全保障、代表性和分布式活动更加多元，以及经审计的公司经营数据。评审者还指出缺少路线图，而 Digital Asset
              较早的产品发布将跨应用组合描述为早期开放；当前生产成熟度需要直接确认。论点失效触发器包括重大监管限制、严重且未解决的隐私或结算事件、重大已宣布市场基础设施部署失败、报告规模长期依赖单一平台，或融资需求没有经常性毛利支撑。没有任何一项被断言已经发生；它们只是可监测的决策规则。
            claimRefs:
              - CR002
              - CR011
              - CR012
              - CR014
              - CR016
