      - number: '8.2'
        title: 正向论点与反向论点
        blocks:
          - type: paragraph
            body: >-
              正向论点是，Digital Asset 将隐私导向的技术架构、异常相关的战略支持者，以及公司自称超过 700 名参与者的生态结合起来。其官方产品覆盖资产注册、储备桥接和基础设施服务，Daml 与 Canton
              则旨在按角色限制交易可见性。如果这些能力转化为经常性、高毛利收入，就可能支撑持久的机构工作流。反向论点同样重要：网络治理在 Digital Asset 之外，Canton Coin
              不是公司股权，也不是对公司收入的权利，而隐私使活动更难被独立验证。战略投资者的参与可能代表生态协同，而不是软件收入、留存或可防御单位经济性的证据。
            claimRefs:
              - CV004
              - CV005
