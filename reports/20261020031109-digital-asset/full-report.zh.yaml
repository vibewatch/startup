  - id: TV003
    title: 乐观、基准与悲观情景
    columns:
      - 情景
      - 明确假设
      - 估值 / 回报逻辑
      - 概率信号
      - 下行触发因素
    rows:
      - - 乐观
        - 经审计的经常性收入、强留存和利润率、高效烧钱，以及付费生产采用，共同验证网络向公司的变现路径。
        - 只有经济数据和工具条款证明了价值捕获能力，才能支撑达到或超过报道的约 $2B；目前无法计算目标回报。
        - 仅当独立财务和客户证据补上主要缺口时，信号才为正面。
        - 生态参与未能转化为付费的经常性生产使用。
      - - 基准
        - 融资延长了现金续航并支持生态发展，但公开运营经济性和优先权条款仍不可得。
        - 将约 $2B 视为融资标记，而非已证明的公允价值；维持跟踪 / 继续研究。
        - 当前证据最直接支持这一有条件的立场，而非某个数字概率。
        - 经审计经济数据继续不披露，或优先股堆叠不利。
      - - 悲观
        - 网络活动难以变现，独立验证仍受限，或稀释与优先权削弱普通股权益结果。
        - 公允价值可能低于报道的定价，或需要下轮融资；现有证据无法支持下限判断。
        - 若尽调发现烧钱、集中度、留存疲弱或治理价值捕获缺口，悲观信号会增强。
        - 收入转化弱、持续烧钱、条款不利，或战略采用流失。
    notes: 情景范围仍是定性的，因为指定证据没有提供经审计收入、现金流、所有权、优先权或可比交易数据；概率信号是可观察条件，不是臆造的百分比。
    claimRefs:
      - CV001
      - CV002
      - CV006
      - CV009
      - CV012
