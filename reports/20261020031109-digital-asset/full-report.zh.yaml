              - CV008
              - CV009
              - CV011
              - CV012
      - number: '8.3'
        title: 情景与进入纪律
        blocks:
          - type: paragraph
            body: >-
              情景框架有意保持条件性，因为证据不支持传统收入倍数或概率加权内在价值。乐观结果要求公司把生态规模和差异化隐私技术连接到经审计的经常性收入、留存、毛利率和高效现金使用。基准情景把约 $2 billion
              的报道视为融资标记，而非独立证明的公允价值，并继续将公司列入尽调跟踪。悲观结果可能出现在网络活动无法由 Digital Asset
              变现、独立验证持续薄弱，或优先权和稀释条款把下行风险转移给新的普通股投资者时。因此，进入应以经济性和工具条款为条件，而不能只看投资者标志。
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV007
              - CV008
              - CV009
              - CV012
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV009
              - CV012
              - CV013
              - CV014
              - CV016
      - number: '8.4'
        title: 可比公司、退出准备度与最终尽调
        blocks:
          - type: paragraph
            body: >-
              现有证据不能建立可信的上市公司、私募轮次或并购可比集合。Digital Asset 横跨企业软件、网络基础设施和生态开发，而 Canton Coin
              是独立风险敞口；因此，把代币网络估值套用到公司股权上会产生误导。没有所有权、稀释、优先权、收入和现金流数据，也无法支持退出时点和目标回报。最终尽调应索取 2025-2026 年经审计财务报表、ARR 和
              cohort 留存、毛利率、烧钱与现金跑道、完整资本化和优先股堆叠、客户层面的生产收入、Digital Asset 相对于 Canton
              治理的变现权利，以及经董事会批准的经营计划。论点失效触发器包括已宣布参与转化为付费生产使用的能力弱、没有经济披露却持续烧钱，或尽管存在报道估值，融资条款仍使新投资者处于次位。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV010
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 对价格敏感的建议
            body: 继续跟踪 Digital Asset，但在经审计经营数据和证券条款使股权和回报判断成为可能之前，不要把报道中的约 $2 billion 融资估值当作有独立支持的公允价值。
            calloutType: recommendation
            claimRefs:
