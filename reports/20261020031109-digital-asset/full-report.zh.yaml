              个已发布合约。这些观察支持多产品企业模式，但不能证明客户支付的是订阅费、许可费、实施费、按使用量计费、验证者费用还是议价打包费。Daml
              所谓的可移植性和较低的供应商锁定可能有助于采用，但也会限制纯粹依靠专有切换成本的经济性。Canton Coin 的费用机制同样属于网络经济，不能证明 Digital Asset 将这些费用确认为公司收入。
