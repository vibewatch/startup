      - number: '5.2'
        title: 架构与技术差异化
        blocks:
          - type: paragraph
            body: >-
              架构从定义合约负载、参与方、选择权和原子动作的 Daml 模板开始。签名访问令牌把现实世界的参与者连接到账本参与方身份，签署方和观察者则编码谁可以授权或查看合约。Digital Asset 将 Canton
              描述为通过参与节点分发 Daml 账本，并在原本分离的域之间同步状态，同时保留子交易隐私。该设计直接针对受监管市场的要求：无需全网复制数据即可共享工作流，并在多个步骤之间实现原子组合。历史 Daml 2.0
              材料还提到兼容 Postgres 和区块链的集成、可移植性，以及早期开放的跨应用组合能力。这些是有意义的设计差异，但大多数架构论断来自 Digital Asset
              自身的技术材料；保留的第三方资料只是概述该模型，没有独立对吞吐量、容错能力或隐私保证进行基准测试。
