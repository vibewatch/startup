  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              相关市场是面向多方受监管资产和交易工作流的机构软件与网络基础设施。Digital Asset 将 Canton 描述为基于 Daml
              的互操作协议，旨在保留授权和隐私，同时让参与方组合工作流；其应用组合聚焦于合规资产发行、转移、追回、储备桥接和配套基础设施。这个边界包括用于创建或协调受监管资产及工作流的软件、API
              和运营服务，但不包括同样简称为 DAM
              的营销内容资产库类别，后者服务于销售赋能、出版、摄影和电商内容。实际替代方案包括带对账的双边消息传递、集中式数据库、孤立账本和内部自建。公司材料将消息驱动的不一致，以及隐私与原子性之间的权衡，列为需要替代的问题，但这一框架来自公司自身，并非买方痛点的独立基准。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM006
              - CM011
              - CM012
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM006
              - CM011
              - CM012
              - CM014
      - number: '2.2'
        title: 受证据约束的市场规模
        blocks:
          - type: paragraph
            body: >-
              现有证据池中没有可靠来源量化 Digital Asset 所定义的机构区块链类别的支出，因此任何数字化 TAM、SAM 或 SOM 都会是臆测。目前最强的规模指标是 Digital Asset 在 2026 年
              6 月称其与 700 多个 Canton 生态参与者合作，但参与者数不等于付费客户数、预算池、收入基础或可触达支出。该公告还称 $355 million
              融资将用于推动生态采用；融资是供给侧能力，不是市场需求。两家分析页面量化或界定了数字资产管理软件，但其买方、工作流和供应商集合都属于媒体与营销内容领域，因此这些数字应排除，而不是挪用。可投资的规模判断仍需自下而上的证据，覆盖目标机构、可触达工作流、部署经济性、定价，以及生态参与转化为付费生产使用的比例。
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM012
              - CM013
              - CM014
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM012
              - CM013
              - CM015
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM008
              - CM015
              - CM016
      - number: '2.3'
        title: 买方、用户、付费方与采用路径
        blocks:
          - type: paragraph
            body: >-
              证据指向多边采用路径，而不是单一软件买方。受监管金融机构和市场基础设施机构可能是生产工作流的经济买方；资产发行方和运营团队使用发行、转移、结算、抵押品及支付能力；开发者构建 Daml
              应用；参与方或同步器运营方提供网络连接。法律、合规和业务利益相关者也属于目标用户，因为 Daml
              合约编码参与方、权利、义务、权限和原子操作。因此，在投入生产之前，采购过程很可能需要业务发起人、技术、安全、法律、合规和运营团队达成一致。现有证据没有披露哪个职能掌握预算、典型合同金额、采购周期，或报告中的生态参与者有多少是付费客户。这些缺口使可信的
              SAM 或近期 SOM 转化判断无法成立。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM007
              - CM008
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM005
              - CM008
              - CM011
      - number: '2.4'
        title: 驱动因素、约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              采用逻辑建立在机构把现实世界资产和受监管工作流搬上链，同时保留隐私、合规、控制权、互操作性和原子执行能力之上。Digital Asset
              将代币化、抵押品流动性、结算、支付及其他受监管工作流列为扩张方向，其技术材料则主张分区状态和联邦同步器可以解决隐私与扩展性问题。但同样的要求也是约束：部署必须跨组织集成，满足权限和数据控制要求，吸引交易对手，并与现有消息传递和对账流程相比证明生产经济性。历史上的公司案例和代码库活动说明存在技术与生态投入，却不是当前大范围采购或经常性支出的独立证明。因此，估值应更多权重于已验证的生产部署、工作流量、合同经济性，以及参与者转化为付费客户的比例，而不是宽泛的区块链叙事或被排除的
              DAM 市场估计。
            claimRefs:
              - CM002
              - CM004
              - CM005
              - CM006
              - CM007
              - CM009
              - CM010
              - CM016
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 不要把媒体内容 DAM 估计当作区块链 TAM
            body: 现有证据池中的分析估计覆盖营销和媒体资产库，不是 Digital Asset 的机构工作流基础设施。
            calloutType: risk
            claimRefs:
              - CM012
              - CM013
              - CM014
          - type: callout
            title: 评估生产转化，而非生态广度
            body: 在赋予数字化 SAM、SOM 或采用曲线之前，应索取付费客户、生产工作流、定价、业务量和采购数据。
            calloutType: recommendation
            claimRefs:
              - CM008
              - CM015
              - CM016
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争环境与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              Digital Asset 面对的竞争者不只是已命名的区块链供应商。买方可以采用 Canton，保留独立的 Daml
              应用，接入已有的许可型账本，继续使用双边消息传递和对账，或在内部搭建更窄的工作流。Digital Asset 将 Canton 描述为连接独立控制的应用，而不是要求采用一套垂直整合的技术栈。其 Project
              Genesis 案例还展示了 Daml 可以在 Hyperledger Fabric 和 Hyperledger Besu
              上运行，这使这些技术既可能是互补方案，也可能是替代方案。这一点具有战略意义：共存可以降低迁移摩擦，但也可能限制 Digital Asset
              替代机构已选基础设施的能力。现有证据池支持这些替代类别，却不足以完整盘点具体竞争者、其融资情况或装机基础。
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP016
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP006
              - CP007
              - CP015
              - CP016
      - number: '3.2'
        title: 能力、控制与信任姿态
        blocks:
          - type: paragraph
            body: >-
              保留来源中最清晰的产品级差异，是对可见性的控制。Digital Asset 称每个应用都对用户和数据保持主权，而 Daml
              权限将参与方限制在交易所需的信息范围内。公司将这一架构定位为对全量复制网络的替代，并认为后者会让机构陷入隐私与原子性的两难。第三方生态资料称机构使用广泛、治理也在 Digital Asset
              之外，但这些资料是描述性和宣传性的，而非受控基准。更审慎的判断是：Canton
              有差异化的机构设计逻辑，但这组证据无法证明其相较于具体竞争者在性能、安全性、实施成本或监管结果上更优。这些未知项应如实展示，而不是当作事实打分。
            claimRefs:
              - CP002
              - CP003
              - CP005
              - CP008
              - CP009
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP003
              - CP005
              - CP015
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP014
              - CP016
      - number: '3.3'
        title: 定价、打包与分销能力
        blocks:
          - type: paragraph
            body: >-
              公开商业可比性很差。一份第三方项目页面称 Digital Asset 没有公布简单的企业许可价格，而是引导潜在客户联系销售或支持团队；与此同时，Canton
              活动还引入了以代币计价的独立使用费层。这是不同的经济单位，不能合并成一个价格。Digital Asset 当前文档还展示了多种应用和服务，包括资产发行、USDC
              桥接和基础设施支持，说明其打包面比单一协议许可更广。公司宣布获得 $355 million 融资，并称其与 700
              多个生态参与者合作；这可能增强分销、合作和获客能力，但融资额不能证明客户收入、可用现金或更低的总拥有成本。
            claimRefs:
              - CP006
              - CP007
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP015
      - number: '3.4'
        title: 护城河持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              可移植性和开放网络定位具有两面性。Digital Asset 称 Daml
              应用可以保持独立运行或以后再接入，而可移植性可以避免锁定在单一供应商上。这降低了采用风险，却也削弱了简单的专有锁定逻辑。更持久的护城河需要来自生态密度、可信治理、生产集成，以及协调受监管多方工作流的成本。现有证据还不足以量化其中任何一项切换成本。证据池中的负面材料主要是一篇
              CoinLaunch
              评测，指出公司缺少路线图、营销和增长基础设施薄弱；这是证据池中的反向证据，虽然信誉较低，但确实提示了一个合理的执行风险：资金更充足的公链生态和在位供应商正在争夺同一批机构。投资尽调应先验证使用情况、胜负单数据、实施投入和续约经济性，再把生态参与视为持久竞争优势。
            claimRefs:
              - CP008
              - CP010
              - CP014
              - CP015
              - CP016
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 可比证明是尽调的关键门槛
            body: 证据池支持 Digital Asset 的设计逻辑和生态规模，但不足以形成覆盖价格、性能、安全、实施投入和生产经济性的标准化同业基准。
            calloutType: risk
            claimRefs:
              - CP015
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入架构可见，但变现方式不明
        blocks:
          - type: paragraph
            body: >-
