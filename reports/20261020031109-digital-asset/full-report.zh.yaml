            - 参与节点
            - 跨域同步
            - 隐私执行
          detail: 网络协议在不同域之间协调已授权状态。
    approximationNotes: 概念分层遵循保留的产品文档；不代表完整的部署拓扑或经过测量的性能。
    claimRefs:
      - CE003
      - CE004
      - CE009
      - CE010
  - id: FU001
    title: 机构采用路径与扩展面
    type: journey-map
    summary: 公开证据显示了从工作流选择到试点再到生产的路径；生态可能扩张，但商业转化和留存尚未披露。
    data:
      nodes:
        - id: need
          label: 受监管工作流需求
          detail: 隐私、合规、控制和多方协作定义了切入问题。
          touchpoints:
            - Institutional product and operations teams
            - Daml privacy model
        - id: build
          label: 构建或集成
          detail: 应用、API、Registry、桥接和协同验证服务构成可见的采用入口。
          touchpoints:
            - DA Apps and APIs
            - Developer and integration teams
        - id: pilot
          label: 试点或原型
          detail: 多机构模拟和原型测试协同工作流。
          touchpoints:
            - Canton pilot
            - Project Genesis
        - id: production
          label: 生产部署
          detail: Broadridge DLR 等已命名基础设施提供了最强的运营证明。
          touchpoints:
            - Production workflow
            - Live Global Synchronizer
        - id: participate
          label: 生态参与
          detail: Digital Asset 报告生态参与者超过 700 个，但没有付费用户分母。
          touchpoints:
            - Institutions
            - Developers
            - Applications
        - id: expand
          label: 跨工作流扩展
          detail: 增加资产、应用和交易对手是其所述的扩展机制。
          touchpoints:
            - Tokenization
            - Collateral mobility
            - Settlement and payments
    approximationNotes: 仅为概念性顺序；各阶段没有共同的测量队列、转化率或时间基准，也不推断留存或收入进展。
    claimRefs:
      - CU002
      - CU003
      - CU004
      - CU009
      - CU010
      - CU011
  - id: FR001
    title: 剩余风险热力图
    type: matrix
    summary: 在考虑公开描述的缓释措施后，对六个有证据支持的风险主题进行定性排序。
    data:
