  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: technical-proof-gaps
      missingEvidence: Current third-party security audits, penetration-test scope, remediation status, incident history, uptime, recovery objectives, and reproducible performance benchmarks.
      whyItMatters: Privacy, resilience, and scale are central product claims for regulated infrastructure, but feature headings and marketing statements do not demonstrate operational effectiveness.
      diligencePath: Review complete audit and penetration-test reports, twelve months of incident and SLA data, architecture diagrams, disaster-recovery tests, and benchmark methodology in a technical data room.
      relatedQuestionRefs: [QE004, QE006, QE008]
      relatedTableRefs: [TE001, TE002, TE003]
    - type: missing-source
      severity: material
      topic: roadmap-direction
      missingEvidence: A dated module-level roadmap with current release versions, milestone owners, dependencies, deprecations, and customer commitments.
      whyItMatters: A capital-allocation statement establishes direction but does not establish which capabilities will ship, when they will ship, or whether historical early-access features reached production.
      diligencePath: Obtain the board-approved roadmap, release notes, current support matrix, and milestone readout, then reconcile them with customer contracts and engineering delivery history.
      relatedQuestionRefs: [QE007]
      relatedTableRefs: [TE001]
    - type: missing-source
      severity: material
      topic: developer-signal
      missingEvidence: A verifiable developer-signal source such as maintained public repositories, package downloads, release activity, contributor counts, forum traffic, or a credible practitioner-community proxy.
      whyItMatters: The assigned evidence pool contains product documentation but no public measure of developer adoption, release velocity, or practitioner engagement.
      diligencePath: Request repository and package telemetry, release cadence, contributor statistics, developer-support volumes, and references from external integration engineers.
      relatedQuestionRefs: [QE002, QE004]
    - type: missing-source
      severity: material
      topic: workflow-outcomes
      missingEvidence: Production customer telemetry measuring implementation time, transaction performance, reconciliation reduction, capital efficiency, adoption, and support burden by workflow.
      whyItMatters: Public sources describe intended benefits but do not quantify realized outcomes or isolate Digital Asset's contribution from customer process changes.
      diligencePath: Validate three production deployments through customer interviews, contracts, pre-and-post operating metrics, and raw platform telemetry.
      relatedQuestionRefs: [QE001, QE008]
      relatedTableRefs: [TE002]
