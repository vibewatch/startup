  - id: TE003
    title: Technology and operating architecture
    columns:
      - Layer or component
      - Role
      - Key dependency
      - Principal technical risk
    rows:
      - [Institutional apps and APIs, Package issuance bridging validation and lifecycle functions, Product-specific integrations and operator adoption, Uneven maturity and undisclosed service levels]
      - [Daml templates and choices, Encode facts rights obligations authorization and atomic actions, Correct contract modeling and secure application code, Logic defects or permission-model errors]
      - [Party identity and access, Bind real-world actors to ledger parties through signed tokens, Identity provider key management and API enforcement, Credential compromise or incorrect party mapping]
      - [Participant ledgers and storage, Maintain authorized ledger state on database or blockchain backends, Backend availability and implementation correctness, Divergent behavior across ledger providers]
      - [Canton synchronization, Coordinate privacy-preserving cross-domain transactions, Participation nodes protocols and network governance, Liveness interoperability and correlated-node failures]
    notes: "Architecture is reconstructed only from Digital Asset technical materials and retained third-party descriptions; it is not an independent design review."
    claimRefs: [CE002, CE003, CE005, CE006, CE007, CE011]
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: Six product layers connect institutional applications to Canton synchronization, with controls and dependencies preserved at each layer.
    data:
      layers:
        - label: Institutional applications
          items: [DA Registry, USDCx Reserve, Covalidation Service]
          detail: Packaged applications and APIs exposed to issuers wallet operators and institutions.
        - label: Asset and compliance controls
          items: [Allowlist, Blocklist, Asset recovery, Proof of Transfer]
          detail: Registry lifecycle and verifiability controls shown in current documentation.
        - label: Smart-contract workflow
          items: [Templates, Contract instances, Choices, Atomic actions]
          detail: Daml encodes agreement state and multiparty workflow behavior.
        - label: Authorization and privacy
          items: [Parties, Signatories, Observers, Explicit permissions]
          detail: Party roles determine authorization and need-to-know visibility.
        - label: Ledger and integration layer
          items: [Signed API tokens, Database backends, Blockchain backends]
          detail: Access credentials and ledger implementations connect applications to state.
        - label: Canton synchronization
          items: [Participation nodes, Cross-domain synchronization, Privacy enforcement]
          detail: Network protocols coordinate authorized state across separate domains.
    approximationNotes: "Conceptual layering follows retained product documentation; it does not assert a complete deployment topology or measured performance."
    claimRefs: [CE003, CE004, CE009, CE010]
callouts:
  - calloutType: strength
    title: Differentiation is encoded in the workflow model
    body: Daml's explicit parties, rights, obligations, visibility, and atomic choices make the privacy thesis more concrete than a generic claim that Canton is institution-ready.
    claimRefs: [CE001, CE003, CE004, CE006]
  - calloutType: risk
    title: Public proof trails the architecture narrative
    body: The retained sources do not provide independent current benchmarks, audit artifacts, uptime history, module adoption, or dated roadmap milestones, so technical diligence cannot rely on product descriptions alone.
    claimRefs: [CE012, CE016]
