chapter:
  number: 5
  title: Product & Technology
  summary: Digital Asset's product stack combines Daml's rights-and-obligations smart-contract model, Canton's privacy-aware synchronization layer, and a newer portfolio of institutional applications and APIs. The technical thesis is specific and coherent, but the retained evidence is predominantly company-issued and does not independently establish current performance, reliability, security-audit scope, or roadmap execution.
sections:
  - id: product-surface-and-workflows
    title: Product surface and institutional workflows
    body: >-
      Digital Asset delivers a layered product rather than a single application. Daml expresses
      multiparty rights, obligations, permissions, and atomic workflow actions; Canton connects
      participating ledgers while limiting visibility to authorized parties; and the current DA
      Apps documentation presents packaged services including DA Registry, USDCx Reserve, and
      Covalidation Service. In customer-workflow terms, the stack is intended to let institutions
      issue compliant assets, move tokenized collateral or cash, settle transactions, and operate
      wallet or application infrastructure without exposing every transaction to every network
      participant. The product breadth is visible, but the public pages reviewed here do not
      disclose SKU-level pricing, deployment counts, service-level commitments, or realized
      workflow savings. The matrices therefore distinguish described capability from verified
      production maturity and make the missing diligence evidence explicit.
    claimRefs: [CE001, CE002, CE004, CE008, CE009, CE010]
    tableRefs: [TE001, TE002]
  - id: architecture-and-differentiation
    title: Architecture and technical differentiation
    body: >-
      The architecture starts with Daml templates that define contract payloads, parties, choices,
      and atomic actions. Signed access tokens connect real-world actors to ledger party identities,
      while signatories and observers encode who may authorize or view a contract. Digital Asset
      describes Canton as distributing Daml ledgers through participation nodes and synchronizing
      state across otherwise separate domains while retaining sub-transaction privacy. That design
      directly targets regulated-market requirements: shared workflows without universal data
      replication, plus atomic composition across steps. Historical Daml 2.0 materials also describe
      Postgres-compatible and blockchain integrations, portability, and early-access cross-application
      composability. These are meaningful design differentiators, but most architectural assertions
      come from Digital Asset's own technical materials; the retained third-party profiles summarize
      the model rather than independently benchmark throughput, fault tolerance, or privacy guarantees.
    claimRefs: [CE003, CE004, CE005, CE006, CE007, CE011]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity-deployment-and-roadmap
    title: Maturity, deployment signals, and roadmap
    body: >-
      Maturity is unevenly evidenced. A 2022 product release described Daml 2.0 as launched while
      cross-application composition remained early access, and it named customer tests and planned
      production builds; those historical statements should not be treated as proof of current
      deployment status. In 2026, Digital Asset said it was working with more than 700 ecosystem
      participants and would direct new capital toward expanding Canton offerings, developer
      engagement, institutional engagement, and network growth. Tradeweb's publication of a product
      discussion with Digital Asset's CEO provides a current partner-engagement signal, not a
      production benchmark or customer acceptance test. The retained evidence therefore supports
      broad ecosystem activity and product direction, but not module-level adoption, release cadence,
      uptime, support performance, or milestone dates. A dated product roadmap and production
      deployment inventory remain material diligence requests.
    claimRefs: [CE008, CE013, CE014, CE015]
  - id: trust-safety-and-technical-risk
    title: Trust, safety, compliance, and technical risk
    body: >-
      Trust controls appear in both the programming model and the current application documentation.
      Daml materials describe explicit roles, permissions, signatories, observers, and need-to-know
      visibility, while DA Registry documentation exposes allowlist, blocklist, asset recovery, Proof
      of Transfer, security, audit, monitoring, and support surfaces. Those headings show that control
      functions are part of the product scope; they do not by themselves establish certification,
      audit coverage, remediation status, recovery objectives, or operational effectiveness.
      CoinLaunch reports that public security audits exist but provides no audit identity or findings
      in the retained text, and it separately flags the absence of a roadmap. No retained source
      supplies current penetration-test results, incident history, uptime statistics, independent
      scalability tests, or a public developer-activity metric. Technical underwriting should
      therefore remain conditional on audit artifacts, architecture review, service-level evidence,
      and reproducible performance tests.
    claimRefs: [CE003, CE006, CE010, CE012, CE016]
