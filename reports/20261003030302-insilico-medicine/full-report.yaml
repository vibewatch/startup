              - CI006
              - CI009
              - CI013
              - CI016
      - number: '4.2'
        title: H1 2026 inflected sharply, but durability is unproven
        blocks:
          - type: paragraph
            body: >-
              FY2025 revenue fell 34.5% to US$56.2 million as pipeline-development revenue declined, and gross margin
              fell to 81.5% because lower-margin drug-discovery work became a larger share. H1 2026 then reversed
              direction: the company reported US$106.3 million of revenue, 90.3% gross margin, US$35.54 million IFRS net
              profit, and US$51.23 million adjusted non-IFRS net profit. The period demonstrates that upfront and
              milestone receipts can produce high margins, but it does not establish a stable run rate. Management
              explicitly declined to provide revenue or profit guidance because results depend on therapeutic
              out-licensing decisions. Investors therefore should not annualize the half-year result or treat one
              profitable period as evidence of recurring profitability.
            claimRefs:
              - CI002
              - CI003
              - CI010
              - CI011
              - CI014
      - number: '4.3'
        title: Liquidity improved while development obligations remain capital intensive
        blocks:
          - type: paragraph
            body: >-
              The 2025 filing shows the cost base is dominated by research activity: R&D expense was US$81.379 million,
              including US$47.130 million of third-party contracting costs and US$26.293 million of labor costs. Net
              operating cash outflow was US$76.8 million in FY2025, even though year-end bank balances and cash reached
              US$393.338 million after the Global Offering. By H1 2026, management reported US$79 million of cash from
              operating activities and US$584.8 million of cash and cash-management reserves. The balance sheet had no
              bank borrowings at FY2025 year-end, but lease liabilities were US$6.0 million. The Global Offering
              earmarked HK$2.3503 billion for clinical development, AI models, laboratory expansion, other pipeline R&D,
              and working capital, underscoring that liquidity is intended to fund multi-year development rather than
              constituting distributable surplus.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI012
              - CI015
              - CI016
          - type: table
            tableRef: TI003
            claimRefs:
              - CI003
              - CI006
              - CI007
              - CI008
              - CI010
              - CI012
              - CI015
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              Revenue quality is mixed. Asset licensing can generate large, high-margin cash events, and the H1 2026
              results materially reduce near-term financing pressure. However, the retained evidence does not disclose
              contract-level revenue recognition, milestone probability, customer concentration, realized royalty
              economics, CAC, sales-cycle duration, payback, or contribution margin by stream. The company said only
              US$308 million had been received against US$11 billion of signed deal value as of June 30, 2026, with
              US$10.6 billion described as potential future milestones. That denominator makes clear why total deal
              value cannot be used as a revenue or liquidity proxy. Underwriting should anchor on cash received,
              recognized revenue, operating cash flow, and committed clinical spend, with contract schedules and audited
              segment economics required before assigning a durable earnings multiple.
            claimRefs:
              - CI012
              - CI013
              - CI014
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not capitalize headline deal value as revenue
            body: >-
              Management described US$11 billion of signed deal value but only US$308 million received through June 30,
              2026; the remaining US$10.6 billion was characterized as future milestones. Those contingent amounts are
              neither recognized revenue nor cash available today.
            calloutType: risk
            claimRefs:
              - CI013
          - type: callout
            title: Underwriting stance
            body: >-
              Treat H1 2026 as evidence that the model can produce profitable periods, not as a durable run rate.
              Require audited contract waterfalls, customer concentration, program budgets, and normalized cash
              conversion before underwriting sustained profitability.
            calloutType: recommendation
            claimRefs:
              - CI007
