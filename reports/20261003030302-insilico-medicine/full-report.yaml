      - number: '1.2'
        title: Executive Leadership, Governance Structure, and Functional Coverage
        blocks:
          - type: paragraph
            body: >-
              Corporate governance and executive leadership at Insilico Medicine are steered by Founder, Chairman,
              Co-CEO, and Chief Business Officer Alex Zhavoronkov, PhD, alongside Co-CEO and Chief Scientific Officer
              Feng Ren, PhD [CO004]. Zhavoronkov brings deep domain expertise in biogerontology, physics, and generative
              neural network architectures, having authored the foundational iPANDA algorithm in 2016 that established
              pathway activation scoring for target discovery [CO001]. Ren, an organic chemist by training with
              executive leadership experience at GlaxoSmithKline, directs internal drug discovery programs, medicinal
              chemistry optimization, and global clinical operations across the company's extensive pipeline [CO004,
              CO008]. Scientific co-founder Alex Aliper, PhD, serves as President, leading bioinformatics infrastructure
              and translational research partnerships [CO001]. Because Insilico's strategy, technical vision, and
              business development dealmaking have historically centered around Zhavoronkov's public thought leadership,
              key-person concentration remains a prominent diligence consideration [CO004]. However, the co-CEO
              management structure established with Ren provides critical functional separation between commercial
              platform expansion and regulated pharmaceutical development [CO004].
            claimRefs:
              - CO001
              - CO004
              - CO008
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO004
              - CO005
              - CO008
      - number: '1.3'
        title: Financing History, HKEX Public Listing, and Stakeholder Structure
        blocks:
          - type: paragraph
            body: >-
              Prior to its public listing, Insilico Medicine raised over US$400 million in private venture capital from
              leading healthcare and technology institutional investors, including early seed backers, an $8.26 million
              financing by 2017, a $37 million Series B in 2019 co-led by Qiming Venture Partners and Eight Roads, and a
              $255 million Series C round in 2021 led by Warburg Pincus [CO013]. Following its December 2025 HKEX
              listing, which raised approximately US$293 million in gross proceeds, the company's shareholder base
              broadened to include institutional public equity investors and strategic government-linked entities such
              as the Hong Kong Investment Corporation [CO002, CO006]. Audited results for the year ended December 31,
              2025, reflected revenue of US$56.2 million alongside an accounting net loss of US$352.3 million, which was
              primarily driven by non-cash fair value losses of US$296.7 million incurred upon the mandatory conversion
              of preferred shares into ordinary shares upon listing rather than operational cash burn [CO010]. In July
              2026, Insilico issued a positive profit alert forecasting revenue of US$102.5 million to US$106.5 million
              ahead of final reporting [CO011]. Commercial momentum accelerated sharply into 2026, reinforced by a
              landmark March 2026 agreement with Eli Lilly valued at up to US$2.75 billion, which delivered US$115
              million in upfront capital [CO007]. As of June 30, 2026, Insilico held US$584.8 million in total cash and
              investment portfolio assets, providing substantial liquidity to fund ongoing Phase III trials [CO005].
            claimRefs:
              - CO002
              - CO005
              - CO006
              - CO007
              - CO010
              - CO011
              - CO013
