  - id: TR003
    title: Partner and Commercial Dependency Risk Register
    columns:
      - Dependency Category
      - Counterparty
      - Strategic Role
      - Concentration Level
      - Failure Scenario
      - Severity
      - Mitigation
      - Residual Exposure
    rows:
      - - Clinical Commercialization
        - Eli Lilly and Company
        - Exclusive global manufacturing and marketing for oral AI-designed therapies
        - High ($2.75B total headline value, $115M upfront)
        - Partner deprioritizes therapeutic class or terminates partnership pre-commercialization
        - High
        - Non-refundable $115M upfront fee and retained IP reversion rights
        - Unrealized downstream milestone payments and loss of commercial validation
      - - Neuroimmune Co-Development
        - SK Biopharmaceuticals
        - Late-stage clinical trials and global commercialization for CNS programs
        - Medium ($2.5B headline potential, up to $18M upfront/near-term)
        - Clinical failure in Phase I/II trials or delayed regulatory filings in US/APAC
        - Medium
