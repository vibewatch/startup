      - number: '1.4'
        title: Operational Milestones, Pipeline Scaling, and International Footprint
        blocks:
          - type: paragraph
            body: >-
              Insilico Medicine's operational evolution demonstrates a rapid transition from algorithmic
              proof-of-concept to clinical-stage pharmaceutical delivery [CO008]. Between 2014 and 2019, the
              organization concentrated primarily on computational target discovery and AI algorithms, before launching
              an internal therapeutics pipeline in 2019 [CO001, CO013]. Since 2021, the company has nominated 33
              preclinical candidates (PCCs) and achieved 13 Investigational New Drug (IND) clearances, operating at an
              average nomination timeline of 12 to 18 months per program while synthesizing only 60 to 200 molecules per
              campaign [CO008]. The company's flagship asset, Rentosertib (ISM001-055), is a first-in-class
              small-molecule inhibitor of TNIK for idiopathic pulmonary fibrosis that successfully entered Phase III
              clinical trials in China following positive Phase IIa data [CO008]. Geopolitically, while Insilico
              operated an R&D subsidiary in Russia that received Skolkovo Foundation grants between 2016 and 2022, the
              company completed a full divestment of the entity by October 2022, systematically re-anchoring its global
              operations across the United States, Greater China, the Middle East, and Canada [CO006]. In recognition of
              its technological impact and commercial maturation, Fast Company named Insilico Medicine the #3 Most
              Innovative Biotech Company of 2026 [CO014].
