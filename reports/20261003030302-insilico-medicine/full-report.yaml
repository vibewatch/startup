              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Repeat CMS activity is the clearest expansion signal
            body: >-
              A second CMS collaboration within three months is direct evidence of one counterparty expanding its
              relationship. It is not portfolio-level retention evidence because no cohort, renewal, spend, or
              realized-revenue denominator is public.
            calloutType: insight
            claimRefs:
              - CU001
              - CU002
              - CU011
          - type: callout
            title: Headline deal value is not durable customer revenue
            body: >-
              The Lilly, CMS, Qilu, and SK figures combine upfront and contingent structures with different disclosure
              levels. Only the Lilly excerpt identifies an upfront amount; the remaining potential values should not be
              treated as realized revenue, ARR, or cash available.
            calloutType: risk
            claimRefs:
