chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Founding History, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Insilico Medicine is a clinical-stage biotechnology company founded in 2014 by Alex Zhavoronkov, PhD,
              currently operating executive headquarters in Cambridge, Massachusetts, with strategic facilities across
              Hong Kong, Abu Dhabi, New York, Montreal, and Taipei [CO001]. The enterprise has built an AI-native
              operating model centered on its proprietary Pharma.AI software suite, which integrates three foundational
              engines: Biology42 (anchored by PandaOmics for novel target identification and omics analysis),
              Chemistry42 (de novo generative molecular design and physics-based scoring), and Science42 (scientific
              reasoning models, automated literature synthesis, and MMAI Gym benchmark training) [CO009]. Unlike
              pure-play computational chemistry software vendors, Insilico operates a dual-engine commercial
              architecture combining proprietary therapeutics development with high-value out-licensing and
              co-development partnerships [CO007]. On December 30, 2025, the company achieved a critical corporate
              milestone by listing on the Main Board of the Hong Kong Stock Exchange under stock code HKEX: 3696,
              completing the largest biotechnology public offering in Hong Kong for that year [CO002]. In the first half
              of 2026, Insilico crossed the operational profitability watershed, reporting total revenue of US$106.3
              million—representing a 287.2% year-over-year increase—and realizing net profit of US$35.54 million,
              supported by upfront and milestone proceeds from multinational pharmaceutical collaborations [CO003]. The
              company scheduled its formal interim earnings conference call for late August 2026 to review these
              operational achievements with international capital market investors [CO012].
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO007
              - CO009
              - CO012
