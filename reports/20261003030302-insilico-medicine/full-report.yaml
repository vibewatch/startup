      - number: '2.3'
        title: Buyer, User, Payer, and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              The practical buyers are pharmaceutical R&D, external-innovation, and business-development leaders; users
              are computational chemists, biologists, medicinal chemists, and portfolio teams; and the payer is normally
              a pharma or well-funded biotech R&D organization. Academic researchers are plausible users but a weaker
              commercial segment. Procurement differs by offering: software requires workflow integration and
              expert-user acceptance, discovery collaborations require jointly defined targets and milestones, and asset
              licensing requires biological, preclinical, or clinical de-risking. The 59-customer figure disclosed for
              2024 indicates adoption, but the pool does not separate software customers, collaborators, renewals, or
              customer concentration.
            claimRefs:
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
      - number: '2.4'
        title: Growth Drivers, Constraints, and Valuation Relevance
        blocks:
          - type: paragraph
            body: >-
              The strongest adoption argument is economic: Insilico reports shorter candidate-nomination timelines,
              fewer synthesized molecules, and materially lower preclinical-candidate costs than traditional benchmarks.
              These are company claims, even when repeated through a syndicated release, and should be validated program
              by program rather than capitalized as proven customer ROI. Adoption is also constrained by
              model-governance and regulated-system documentation, integration with existing scientific workflows, long
              clinical validation cycles, and buyers' ability to compare AI output with established methods. Valuation
              should therefore distinguish recurring software economics from milestone-dependent collaboration and asset
              economics, and should not treat headline market growth as cash realization.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Do Not Capitalize Broad Forecasts as Company TAM
            body: >-
              The retained forecasts mix software categories with therapeutic end markets and do not disclose a
              company-specific obtainable share. Valuation should use verified revenue, renewal, milestone, and
              pipeline-probability evidence rather than summing these endpoints.
            calloutType: risk
            claimRefs:
              - CM002
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
