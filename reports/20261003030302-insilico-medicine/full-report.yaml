  - id: TV001
    title: Recommendation Summary Table
    columns:
      - Decision dimension
      - Assessment
      - Evidence basis
      - Decision implication
    rows:
      - - Recommendation
        - Track / research more
        - Listing and financing are visible, but current entry-price evidence is incomplete
        - Do not issue a buy call from the assigned public evidence
      - - Confidence
        - Medium on evidence limits; low on numerical value
        - Forge, EquityZen, and Clay expose different but incomplete valuation views
        - Treat any precise target as unsupported until filings and live pricing are reviewed
      - - Risk rating
        - High
        - Limited market activity, unknown diluted capitalization, and clinical-stage execution risk
        - Require a larger diligence margin before capital allocation
      - - Valuation stance
        - Insufficient public price support
        - A $1 billion last-known mark is not an independently verified executable market price
        - Anchor future work on market capitalization and enterprise value, not stale private marks
      - - Return / hold / exit
        - Not quantifiable
        - Entry price, diluted shares, cash, debt, and audited operating data are absent from the assigned evidence
        - Set return and hold-period targets only after the missing inputs are obtained
    notes: >-
      Assessment uses only the assigned prefetched evidence; unavailable pricing and financial inputs are shown as gaps
      rather than estimated.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV011
      - CV012
      - CV013
      - CV015
      - CV016
  - id: TV002
    title: Thesis / Anti-Thesis Table
    columns:
      - Argument
      - Evidence-supported thesis
      - Anti-thesis or limit
      - What would change the view
    rows:
      - - Platform model
        - Company materials present an end-to-end, platform-centric discovery model
        - Company-issued architecture claims do not prove economic returns
        - Audited segment economics and external customer retention
      - - Financing access
        - The March 2025 Series E raised $110 million
        - Funding raised is not cash currently available
        - Latest audited cash, debt, and operating cash flow
      - - Pipeline scale
        - The company reported 33 PCC nominations since 2021 and 13 IND approvals or clearances
        - Company-reported nomination velocity is not clinical efficacy
        - Independent trial outcomes and regulator-confirmed progression
      - - Partner economics
        - A Menarini transaction included a reported $20 million upfront payment
        - More than $550 million of potential value was contingent
        - Contract schedules separating paid and contingent consideration
      - - Commercial portfolio
        - Insilico described four out-licensing agreements above $2.1 billion in collective headline value
        - Headline value is not revenue, ARR, or guaranteed cash
        - Audited recognized revenue and collected milestone cash by contract
    notes: >-
      Company-issued platform and partnership claims are identified as such; headline deal values are not treated as
      realized revenue.
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
      - CV015
  - id: TV003
    title: Bull / Base / Bear Scenario Table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Probability signal and downside trigger
    rows:
      - - Bull
        - Pipeline progression continues and contingent partnerships convert into disclosed cash and recognized revenue
        - Range not supportable until live price, diluted shares, net cash, and audited revenue are available
        - 'Positive signal: independent clinical validation; trigger: failed readout or cancelled partnership'
      - - Base
        - Financing access and development continue, but commercial conversion remains uneven
        - Track without a return target because the evidence does not establish an entry enterprise value
        - 'Neutral signal: steady disclosures; trigger: cash use or dilution outpaces milestones'
      - - Bear
        - Limited liquidity combines with clinical delay, weak milestone conversion, or dilutive capital needs
        - Downside cannot be bounded by a fabricated cash floor because audited cash and liabilities are unavailable
        - 'Negative signal: partner deprioritization, clinical setback, or financing below the prior mark'
    notes: >-
      Scenarios are directional rather than probability-weighted because the assigned evidence lacks audited financials,
      live pricing, and a diluted capitalization table.
    claimRefs:
      - CV002
      - CV004
      - CV007
      - CV010
      - CV013
      - CV015
      - CV016
