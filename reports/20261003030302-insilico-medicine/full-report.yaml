  - id: FU001
    title: Evidence-bounded customer journey from research need to expansion
    type: journey-map
    summary: >-
      The observable path combines expert product use with project-based co-development, while conversion, renewal, and
      realized milestone rates remain undisclosed.
    data:
      items:
        - label: 1. Research need
          detail: A pharma or biotech team frames a target, molecule, or laboratory workflow problem.
          touchpoints:
            - Target discovery
            - Molecule design
            - Experimental workflow
        - label: 2. Scoped engagement
          detail: The parties select a platform-assisted project or broader discovery collaboration.
          touchpoints:
            - PandaOmics
            - Chemistry42
            - LabClaw
        - label: 3. Joint discovery work
          detail: Insilico contributes AI and discovery capabilities while scientists retain decision checkpoints.
          touchpoints:
            - Target prioritization
            - Candidate generation
            - Human review
        - label: 4. Program transaction
          detail: A counterparty may co-develop or license a program under upfront, milestone, and royalty terms.
          touchpoints:
            - Upfront payment
            - Development milestones
            - Royalties
        - label: 5. Partner execution
          detail: Clinical, regulatory, and commercialization work depends on the counterparty and program progress.
          touchpoints:
            - Clinical development
            - Regulatory submission
            - Commercialization
        - label: 6. Relationship expansion
          detail: A subsequent program may deepen the account, as reported for the second CMS collaboration.
          touchpoints:
            - Additional indication
            - Additional program
            - Expanded relationship
