      - number: '6.2'
        title: Named Relationships and Adoption Signals
        blocks:
          - type: paragraph
            body: >-
              The strongest customer evidence is contractual rather than usage-based. PharmExec reported that CMS
              entered a second CNS-focused collaboration with Insilico within three months, with the new program
              carrying up to approximately $177 million in milestones plus royalties. STAT separately reported a Lilly
              agreement with $115 million upfront and $2.75 billion in total potential payments. PharmExec also
              summarized 2026 agreements with Qilu and SK Biopharmaceuticals. These announcements demonstrate
              willingness by named pharmaceutical counterparties to transact and, in CMS's case, to expand a
              relationship. They do not establish realized milestone receipts, recurring platform use, production
              deployment, renewal, or end-customer outcomes because those denominators and operating details were not
              disclosed.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU011
              - CU015
              - CU016
          - type: table
            tableRef: TU002
            claimRefs:
