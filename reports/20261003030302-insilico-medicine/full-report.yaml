              - CU002
              - CU003
              - CU015
              - CU016
      - number: '6.3'
        title: Durability, Retention, and Concentration
        blocks:
          - type: paragraph
            body: >-
              Public durability evidence is materially weaker than transaction evidence. The reviewed allocation
              contains no ARR, NRR, GRR, logo churn, cohort renewal, contract-length distribution, active-seat count,
              top-customer revenue share, or realized milestone schedule. A repeat CMS agreement is a useful
              land-and-expand indicator for one relationship, but one expansion event cannot establish portfolio-wide
              retention. Similarly, large headline values are contingent consideration rather than revenue and reveal
              little about timing or probability. The most explicit adverse signal is qualitative: a STAT reporter wrote
              that she had not fully understood what Insilico does or why it is popular, highlighting external clarity
              risk even as the same excerpt noted the Lilly transaction. Investor diligence therefore needs
              customer-level contract and usage evidence before assigning recurring value.
            claimRefs:
              - CU003
              - CU004
              - CU011
              - CU012
              - CU016
      - number: '6.4'
        title: Customer Journey and Investment Implications
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a cautious journey model: an expert research need enters through a platform or
              scoped discovery engagement; Insilico contributes target identification, molecule generation, and
              laboratory workflow capabilities; a counterparty may then fund co-development or license an asset;
              milestones and royalties can follow only if contractual and development events occur; and a successful
              first engagement may lead to another program. The official case study describes a shift from software
              provider toward a full-stack biotechnology model, consistent with this blended motion. However, public
              materials do not show conversion rates between stages. The underwriting implication is to value
              demonstrated upfront commitments separately from contingent milestones and to treat product-output
              statistics, such as candidate nominations, as operational evidence rather than customer adoption.
            claimRefs:
              - CU005
              - CU006
              - CU008
              - CU010
              - CU011
              - CU013
              - CU016
          - type: figure
            figureRef: FU001
