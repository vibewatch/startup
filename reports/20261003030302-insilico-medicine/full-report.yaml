  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status-Quo Alternatives
        blocks:
          - type: paragraph
            body: >-
              The relevant market begins with target identification and generative chemistry, extends through
              clinical-outcome prediction and preclinical candidate creation, and ends before routine care delivery,
              commercial manufacturing, or supply-chain operations. Within that boundary, Insilico addresses two
              different budget pools: hosted or on-premise software subscriptions and project-, collaboration-, or
              asset-based drug-development spending. The status quo is not a single competitor. Buyers can keep
              discovery in-house, use point computational-chemistry tools, contract wet-lab work to CROs, or license a
              later-stage asset. This makes broad AI market forecasts directionally useful but insufficient for
              estimating revenue available to Insilico.
            claimRefs:
              - CM001
              - CM002
              - CM007
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM007
      - number: '2.2'
        title: Evidence-Constrained Sizing Lenses
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence supports six reported sizing lenses, not a nested TAM/SAM/SOM model. PharmaNow
              reports separate 2023-to-2028 forecasts for AI oncology discovery, computational chemistry software,
              generative AI drug design, and AI clinical-trial optimization. Company materials add indication-level
              forecasts for IPF and dyslipidemia through 2032. These categories overlap, use different periods, and do
              not disclose a common geography or methodology in the retained text. They therefore must not be summed.
              The most decision-useful conclusion is that multiple adjacent budgets are growing; the unresolved task is
              determining what share is addressable through Insilico's software, collaboration, and licensing models.
            claimRefs:
              - CM011
              - CM012
