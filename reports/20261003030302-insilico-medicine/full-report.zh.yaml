      - number: '1.2'
        title: 高管领导层、治理架构与职能分工
        blocks:
          - type: paragraph
            body: >-
              Insilico Medicine 的公司治理与高管领导层由创始人、董事长、联席 CEO 兼首席商务官 Alex Zhavoronkov 博士，以及联席 CEO 兼首席科学官 Feng Ren 博士共同执掌
              [CO004]。Zhavoronkov 在生物老年医学、物理学及生成式神经网络架构领域拥有深厚专业积累，曾于 2016 年创立奠基性的 iPANDA 算法，确立了用于靶点发现的通路激活评分方法
              [CO001]。Ren 拥有有机化学学术背景及 GlaxoSmithKline 高管领导经验，主管公司庞大管线中的自研药物发现项目、药物化学优化及全球临床运营 [CO004, CO008]。科学联合创始人
              Alex Aliper 博士担任总裁，主导生物信息学基础设施与转化研究合作 [CO001]。由于 Insilico 的战略、技术愿景和商务拓展交易历来高度依托 Zhavoronkov
              的公开行业影响力，关键人员集中度仍是尽调中的突出考量项 [CO004]。不过，与 Ren 共同建立的联席 CEO 管理架构，为商业化平台拓展与强监管药物研发之间提供了关键的职能切分 [CO004]。
            claimRefs:
              - CO001
              - CO004
              - CO008
