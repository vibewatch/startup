      - number: '1.4'
        title: 运营里程碑、管线扩张与全球布局
        blocks:
          - type: paragraph
            body: >-
              Insilico Medicine 的运营演进历程展现了从算法概念验证向临床阶段药物交付的快速跨越 [CO008]。2014 年至 2019 年间，该机构主要专注于计算靶点发现与 AI 算法，随后于 2019
              年启动自研治疗管线 [CO001, CO013]。自 2021 年以来，公司已提名 33 个临床前候选化合物（PCC）并获得 13 项新药临床试验申请（IND）批准，每个项目的平均提名周期仅为 12 至 18
              个月，单次研发战役仅合成 60 至 200 个分子 [CO008]。              公司的旗舰管线资产 Rentosertib (ISM001-055)
              是一款用于特发性肺纤维化、首创（first-in-class）的 TNIK 小分子抑制剂，在获得积极的 Phase IIa 数据后已在中国成功进入 Phase III 临床试验
              [CO008]。面对地缘政治变动，尽管 Insilico 曾于 2016 年至 2022 年间在俄罗斯运营过一家获得 Skolkovo Foundation 资助的研发子公司，但公司已于 2022 年 10
              月前完成对该实体的全面剥离，系统性地将全球运营重心重新布局至美国、大中华区、中东和加拿大 [CO006]。为表彰其技术影响力与商业化成熟度，Fast Company 将 Insilico Medicine 评为
              2026 年最具创新力生物技术公司第 3 名（#3 Most Innovative Biotech Company of 2026）[CO014]。
