        - label: 应用层与自主智能体
          detail: Science42 DORA 多智能体科研助手及对话式智能工具。
        - label: 基准测评与评估框架
          detail: MMAI Gym 训练环境、TargetBench 1.0、ScienceAI Bench 及 DDB 数据门户。
        - label: 预测分析与临床预测
          detail: Medicine42 inClinico Transformer 模型，用于预测 II 期至 III 期临床转化概率。
        - label: 生成式化学与基础模型
          detail: Chemistry42 生成式分子引擎与 Nach01 多模态 3D 空间基础模型。
        - label: 靶点发现与多组学引擎
          detail: Biology42 PandaOmics 跨 8,000 种适应症与多组学数据集进行疾病靶点排序。
        - label: 计算基础设施与机器人执行
          detail: Amazon SageMaker、Microsoft Azure Discovery 及 Life Star 闭环机器人自动化实验室。
