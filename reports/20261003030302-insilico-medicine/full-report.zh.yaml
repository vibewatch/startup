  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              相关市场始于靶点发现与生成式化学，延伸至临床结局预测及临床前候选分子构建，并在常规诊疗交付、商业化生产或供应链运营之前终止。在该边界内，Insilico
              面向两类不同的预算池：托管或本地部署的软件订阅，以及基于项目、合作或资产的药物研发支出。现状替代方案并非单一竞争对手。买方既可保留内部自主研发、使用单点计算化学工具，也可将湿实验外包予
              CRO，或直接引进后期在研资产。这使得宽泛的 AI 市场预测仅具方向性参考价值，不足以据此估算 Insilico 可获取的潜在收入。
            claimRefs:
              - CM001
              - CM002
              - CM007
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM007
      - number: '2.2'
        title: 受限证据下的市场规模评估视角
        blocks:
          - type: paragraph
            body: >-
              所分配的证据支持六项据报道的市场规模评估视角，而非嵌套的 TAM/SAM/SOM 模型。PharmaNow 分别报道了针对 AI 肿瘤学发现、计算化学软件、生成式 AI 药物设计以及 AI 临床试验优化的
              2023 至 2028 年预测。公司材料还补充了截至 2032 年针对 IPF
              及血脂异常的适应症层面预测。这些类别相互重叠、统计周期各异，且在保留的文本中未披露统一的地理范围或测算方法，因此绝不可直接加总。最具决策参考价值的结论在于多项相邻预算正在扩张；尚未解决的核心任务，是厘清
              Insilico 借助软件、合作及授权模式究竟能触达其中多大份额。
