        - 中（名义潜在总额 $2.5B，首付款及近期款项至多 $18M）
        - I/II 期临床试验受挫，或美洲及亚太地区监管申报延误
        - 中
        - 涵盖多靶点的合作范围及个位数净销售额分成
        - 资本回收大幅延后，合作方里程碑收入确认推迟
      - - 大中华区商业化
        - TaiGen Biotechnology
        - ISM4808 在大中华区的独家开发与商业化权利
        - 中等（区域对外授权合作方）
        - 慢性肾病（CKD）贫血试验患者入组缓慢或监管审批滞后
        - 中
        - I 期临床试验首例受试者已成功给药
        - 区域里程碑收入及商业分成推迟
      - - 技术基础设施
        - 云与算力服务商（AWS / Microsoft）
        - 承载 Nach01 基础模型与可扩展机器学习训练环境
        - 中等（多云部署架构）
        - 算力价格上涨或区域云服务中断影响模型训练
        - 低
        - 横跨 AWS Marketplace、Azure 与 Google Cloud 的多云架构
        - 大规模筛选期间计算通量暂时受限
    notes: 按严重程度排序。总结各大对外授权与共同开发交易中的对手方依赖及里程碑风险。
    claimRefs:
      - CR013
      - CR014
      - CR015
      - CR016
  - id: TV001
    title: 投资建议汇总表
    columns:
      - 决策维度
      - 评估结论
      - 证据依据
      - 决策含义
    rows:
      - - 投资建议
        - 观察 / 继续研究
        - 上市与融资情况明确，但当前入场价证据并不完整
        - 依据既有公开证据，不宜给出买入评级
      - - 置信度
        - 证据边界置信度为中；具体估值数值置信度为低
        - Forge、EquityZen 与 Clay 给出的估值口径各异且均不完整
        - 在审查申报文件与实时行情前，任何精确目标价均缺乏证据支撑
      - - 风险评级
        - 高
        - 二级市场交投有限、完全稀释后股本不明，且面临临床阶段执行风险
        - 在配置资金前需预留更充分的尽调安全边际
      - - 估值立场
        - 公开价格支撑不足
        - 最近已知的 $1 billion 估值标记并非经独立验证的可成交市价
        - 后续跟踪应锚定市值与企业价值，而非过时的一级市场估值标记
      - - 预期回报 / 持有周期 / 退出
        - 无法量化
        - 入场价格、稀释后股本、现金、负债及经审计运营数据均未在所给证据中披露
        - 需补齐上述缺失指标后，方可设定预期回报与持有周期目标
    notes: 评估仅基于既有预取证据；无法获取的定价及财务输入项直接作为缺口呈现，不做主观推算。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV011
      - CV012
      - CV013
      - CV015
      - CV016
  - id: TV002
    title: 核心逻辑与反向逻辑对照表
    columns:
      - 争论焦点
      - 有证据支撑的核心逻辑
      - 反向逻辑或边界
      - 何种变量会改变判断
    rows:
      - - 平台型模式
        - 公司材料展示了端到端、以平台为核心的药物发现模式
        - 公司自行披露的架构主张无法证明商业回报
        - 经审计的分部财务数据与外部客户留存率
      - - 融资能力
        - 2025 年 3 月 Series E 轮完成 $110 million 融资
        - 历史融资金额不等于当前可用现金
        - 最新经审计的现金、负债及经营性现金流
      - - 管线规模
        - 据公司披露，2021 年以来累计完成 33 个 PCC 提名与 13 项 IND 批准或许可
        - 公司披露的候选药物产出速度不代表临床疗效
        - 独立的临床试验结果及监管机构确认的推进进展
      - - 合作商业条款
        - Menarini 交易据报包含 $20 million 首付款
        - 超过 $550 million 的潜在总额取决于里程碑达成情况
        - 区分已付对价与或有对价的合同明细表
      - - 商业化组合
        - 据 Insilico 称，其四项对外授权协议合计名义价值超过 $2.1 billion
        - 名义交易额不等于实际收入、ARR 或确定性现金
        - 按合同拆分的经审计已确认收入与已收里程碑现金
    notes: 公司自行披露的平台与合作主张均已标明口径；名义交易额不作为已实现收入处理。
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
      - CV015
  - id: TV003
    title: 乐观 / 基准 / 悲观情景分析表
    columns:
      - 情景
      - 核心假设
      - 估值 / 回报逻辑
      - 概率信号与下行触发条件
    rows:
      - - 乐观
        - 管线持续推进，合作协议中的或有款项逐步转化为披露现金与已确认收入
        - 在获得实时价格、稀释后股本、净现金及经审计收入前，无法给出估值区间
        - 积极信号：独立的临床验证；触发条件：临床读数失利或合作终止
      - - 基准
        - 融资渠道与研发推进保持畅通，但商业化转化节奏依然分化
        - 因现有证据无法确立入场企业价值，维持跟踪且不设预期回报目标
        - 中性信号：披露稳步推进；触发条件：现金消耗或股权稀释速度快于里程碑兑现
      - - 悲观
        - 流动性受限，叠加热点管线临床延误、里程碑转化乏力或高稀释性融资需求
        - 由于无法获取经审计的现金与负债数据，下行风险无法人为设定现金底部支撑
        - 负面信号：合作方降低研发优先级、临床遇阻，或融资估值低于前轮标记
    notes: 因所给证据缺少经审计财务数据、实时行情及完全稀释股权结构表，各情景仅作为方向性判断，未做概率加权。
    claimRefs:
      - CV002
      - CV004
      - CV007
      - CV010
      - CV013
      - CV015
      - CV016
figures:
  - id: FO001
    title: 公司里程碑时间线（2014-2026）
    type: timeline
    summary: 记录 Insilico Medicine 成立、平台迭代、融资历程、港交所（HKEX）上市及临床进展的大事记。
    approximationNotes: null
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO006
      - CO007
      - CO008
    data:
      items:
        - date: '2014'
          label: 公司成立
          detail: Alex Zhavoronkov 创立 Insilico Medicine，将深度学习与基因组学应用于药物发现。
          tone: positive
        - date: '2016'
          label: 发表 iPANDA 算法
          detail: 在《Nature Communications》上发表通路活化网络分解分析（iPANDA）算法。
          tone: neutral
        - date: '2019'
          label: Series B 轮融资与启动自研管线
          detail: 完成由 Qiming 与 Eight Roads 领投的 $37 million Series B 轮融资；启动自研治疗药物管线。
          tone: positive
        - date: '2021'
          label: Series C 轮融资与发现 ISM001-055
          detail: 完成由 Warburg Pincus 领投的 $255 million Series C 轮融资；提名首个由 AI 设计的临床前候选药物。
          tone: positive
        - date: '2022'
          label: Series D 轮融资与全球实体架构重组
          detail: 完成 $60 million Series D 轮融资；设立蒙特利尔中心，扩大阿联酋业务，并剥离俄罗斯实体。
          tone: neutral
        - date: '2023'
          label: II 期临床试验与阿布扎比中心
          detail: 启动 ISM001-055 的 Phase IIa 试验，并在阿布扎比启用区域总部。
          tone: positive
        - date: '2025-12-30'
          label: 香港联交所 IPO
          detail: 完成在港交所（HKEX）挂牌上市（股票代码：3696），募资近 $293 million。
          tone: positive
        - date: 2026-03
          label: 与 Eli Lilly 达成 $2.75B 战略合作
          detail: 与 Eli Lilly 签署全球对外授权及共同开发协议（首付款 $115M）。
          tone: positive
        - date: 2026-08
          label: H1 2026 实现商业化盈利
          detail: 实现中期整体盈利，营业收入达 $106.3M（同比增长 287.2%），净利润达 $35.54M。
          tone: positive
