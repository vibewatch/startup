      - number: '2.3'
        title: 买方、用户、付费方与采纳路径
        blocks:
          - type: paragraph
            body: >-
              实际买方为药企研发、外部创新及商务拓展负责人；用户为计算化学家、生物学家、药物化学家及管线组合团队；付费方通常为大型药企或资金充裕的生物技术研发机构。学术研究人员虽是潜在用户，但属于商业变现偏弱的细分客群。各类产品的采购逻辑各不相同：软件需要工作流集成及专家用户认可，研发合作需要共同确立靶点与里程碑，资产授权则要求完成生物学、临床前或临床层面的风险释放。2024
              年披露的 59 家客户数据表明产品已被采纳，但该客群池并未拆分软件客户、合作方、续约情况或客户集中度。
            claimRefs:
              - CM003
              - CM004
              - CM005
