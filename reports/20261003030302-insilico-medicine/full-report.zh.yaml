      - number: '3.3'
        title: 商业化产品包装、护城河持久度与负面市场风险
        blocks:
          - type: paragraph
            body: >-
              Insilico 的商业模式兼顾软件订阅收入、高上行潜力的药物研发合作以及管线对外授权协议。2025 年软件解决方案收入达到 $4.9 million，较 2024 年的 $4.0 million 同比增长
              23.8%，拥有 181 家订阅客户，其中包括与全球前 20 大药企中 13 家建立的软件授权合作。对外授权与联合开发协议是最大的收入贡献项，以与 Fosun Pharma、Exelixis、Menarini 及
              TaiGen 签署的四项主要协议为代表，同时还与 Eli Lilly、Sanofi 和 Servier 达成了多靶点研发合作。尽管里程碑付款潜力巨大，Insilico
              仍面临显著的竞争与财务下行风险。公开市场股票分析强调，InSilico Medicine Cayman TopCo 的市净率（P/B）达到 8.5x，较区域同业均值 3.0x 及亚洲生命科学行业均值 2.6x
              存在显著溢价，而其在 $56.239 million 营收的基础上录得 $352.316 million 的年度净亏损。此外，采购情报平台观察到，重点 B2B 软件评测名录中缺少经核实的 Insilico
              供应商词条，企业级定价的不透明也使得客户难以直接对照竞品研发平台评估总体拥有成本。竞争护城河的持久度高度依赖核心管线资产（如 rentosertib /
              ISM001-055）的临床概念验证读数，因为一旦竞争对手的基础模型使从头分子生成走向大众化，计算设计的速度优势便将被削弱。
