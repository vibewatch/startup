            title: 不可将宽泛预测资本化为公司 TAM
            body: 所保留的预测数据混杂了软件类别与治疗终端市场，且未披露公司特有的可获取份额。估值应采用经过验证的收入、续约、里程碑及管线成功概率证据，而非直接对这些终端数据进行简单加总。
            calloutType: risk
