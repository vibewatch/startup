      - number: '1.3'
        title: 融资历史、HKEX 上市与股东结构
        blocks:
          - type: paragraph
            body: >-
              在公开上市前，Insilico Medicine 从头部医疗健康和科技机构投资者处筹集了超过 US$400 million 的私募风险资本，包括早期天使投资、截至 2017 年的 $8.26 million
              融资、2019 年由 Qiming Venture Partners 与 Eight Roads 联合领投的 $37 million B 轮融资，以及 2021 年由 Warburg Pincus 领投的
              $255 million C 轮融资 [CO013]。在 2025 年 12 月 HKEX 上市募资约 US$293 million 总额后，公司股东基础进一步扩大，引入了公开市场机构投资者以及 Hong
              Kong Investment Corporation 等具有政府背景的战略实体 [CO002, CO006]。截至 2025 年 12 月 31 日止年度的经审计业绩显示，营收为 US$56.2
              million，账面净亏损为 US$352.3 million；该亏损主要由上市时优先股强制转换为普通股产生的 US$296.7 million 非现金公允价值变动损失所致，而非经营性现金消耗
              [CO010]。2026 年 7 月，Insilico 在正式财报前发布盈利预喜，预计营收将在 US$102.5 million 至 US$106.5 million 之间 [CO011]。商业化动能在 2026
              年急剧加速，2026 年 3 月与 Eli Lilly 达成的里程碑合作总价值高达 US$2.75 billion，并带来了 US$115 million 的首期资金 [CO007]。截至 2026 年 6 月
              30 日，Insilico 持有 US$584.8 million 的现金及投资组合资产总额，为推进中的 Phase III 试验提供了充裕的流动性支持 [CO005]。
