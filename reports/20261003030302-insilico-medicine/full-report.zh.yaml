              Pharma.AI 的部署架构支持多种运行环境，涵盖专用本地硬件一体机到可扩展的云端集成。对于要求严格数据本地化的企业客户，Insilico 提供用于安全本地部署的 PandaOmics Box；而 SaaS
              及混合交付则在 ISO 27001 信息安全管理体系保障下，于客户指定的虚拟私有云（VPC）内运行。在云基础设施上，Insilico 将其机器学习训练管线迁移至 Amazon
              SageMaker，将模型迭代与部署周期从 50 天压缩至 3 天，并实现了并行化多节点训练。为拓展生态连通性，Insilico 将其多模态基础模型 Nach01 部署至 Microsoft Discovery
