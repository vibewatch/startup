        title: 验证缺口、技术风险与合规短板
        blocks:
          - type: paragraph
            body: >-
              尽管 Insilico 展现出迅速的内部管线推进能力——已推进包括 ISM0900 及旗舰 TNIK 抑制剂 rentosertib 在内的 30
              多个临床前候选化合物——但独立技术审查揭示了平台治理与合规方面的实质性缺口。至关重要的是，第三方评估显示，公开文件并未将 Pharma.AI 描述为具备 21 CFR Part 11 审计追踪或正式
              FDA/EMA 计算机系统验证的合格 GxP 系统。此外，未见针对训练数据投毒或模型反演攻击等对抗性 AI
              威胁设立专门防御措施的公开证据，亦未见规定生产环境模型是持续更新还是基于冻结权重运行的成文变更控制流程。另外，虽然 Insilico 大力宣传 DORA
              等多智能体研究工具，但独立评估观察到，其实际商业工作流依赖于结构化的模块化步骤，而非拥有不受限规划权限的自主多智能体系统。
