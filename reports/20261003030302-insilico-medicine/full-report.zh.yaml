              - CP013
      - number: '3.2'
        title: 能力差异化、实验室自动化与基础模型
        blocks:
          - type: paragraph
            body: >-
              Insilico 区别于纯计算软件供应商之处，在于将干实验（in silico）生成式算法与专有湿实验机器人及多模态基础模型深度融合。公司于 2022 年 12 月推出了无人值守的全自动机器人实验室 Life
              Star 1，随后于 2025 年 9 月将其升级为 Life Star 2，具备跨岛设备协同与多工作流并行处理能力，用于验证分子设计并生成专有生物学反馈数据集。为拓宽分析边界，Insilico 推出了
              PandaClaw，将自主 AI 智能体与生物学工作流深度结合，实现自然语言靶点发现、适应症拓展及实时自动化假说生成。该计算套件还在 AWS Marketplace 上线了多模态基础模型
              Nach01，融合化学智能与自然语言推理，并配备与 Liquid AI、Human Longevity 等伙伴合作开发的 Science MMAI Gym 训练环境。在 2021 年至 2024 年间涵盖 20
              多个自研项目的临床前基准测试中，Insilico 展现了从项目启动到临床前候选化合物（PCC）提名平均仅需 12 至 18 个月的交付速度，每个项目仅需合成并测试 60 至 200
              个分子。然而，外部市场评估指出，尽管 PandaOmics 的靶点发现易用性广受好评，但企业级采购成本与工作流复杂度限制了小型团队的采纳，且高阶合作项目仍依赖 Insilico 交付定制化科研服务。
