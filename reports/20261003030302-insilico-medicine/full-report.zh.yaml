  - number: 4
    title: 财务分析
    sections:
      - number: '4.1'
        title: 营收架构以资产为导向，而非传统 SaaS 模式
        blocks:
          - type: paragraph
            body: >-
              Insilico
              主要借助药物发现与管线开发合作、软件订阅以及小规模的其他研发业务实现商业变现。上市申报文件将合作经济收益描述为首付款、开发、监管及商业化里程碑款以及销售提成；软件客户则为平台访问权或本地部署权支付订阅费。这一架构使得资产研发进展与交易达成时点成为核心收入引擎，而非单靠经常性软件收入。在
              FY2025，药物发现与管线开发在 US$56.239 million 总营收中贡献了 US$48.837 million，而软件业务贡献了 US$4.913 million。所保留的 2026 年 H1
              新闻稿显示，药物发现与管线开发贡献了 US$103.1 million，相比之下软件业务贡献了 US$2.70 million。因此，合同名义总金额属于附带触发条件的或有商业机会集，并非
              ARR、已确认收入或可用于日常运营的现金。
