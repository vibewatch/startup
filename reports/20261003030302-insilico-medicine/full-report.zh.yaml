          - type: paragraph
            body: >-
              公开的业务持久度证据实质上弱于交易证据。已审阅的材料未包含 ARR、NRR、GRR、客户流失率、同客群续约率、合同期限分布、活跃席位数、前大客户收入占比或已实现的里程碑排期表。与 CMS
              的二次合作是单客关系深化的有益信号，但单一客户拓展事件不能确立整体客群层面的留存表现。同样，巨额的名义交易总额属于附带触发条件的或有对价而非确定收入，几乎无法揭示兑现时点或概率。最明确的负面信号来自定性评价：一位
              STAT 记者写道，她并未完全理解 Insilico 究竟从事什么业务或为何备受追捧；尽管该报道同一节选也提及了 Lilly
              的交易，但仍凸显出外部认知清晰度风险。因此，投资者尽调在赋予经常性价值之前，需要获取客户层面的合同与使用情况证据。
            claimRefs:
              - CU003
              - CU004
              - CU011
              - CU012
              - CU016
      - number: '6.4'
        title: 客户旅程与投资研判启示
        blocks:
          - type: paragraph
            body: >-
              现有证据支持一种审慎的旅程模型：专家的科研需求借助平台或特定范围的研发合作切入；Insilico
              输出靶点发现、分子生成及实验室工作流能力；交易对手方随后可能出资联合开发或引进某项资产；仅在合同与研发事件达成时，后续里程碑款与销售提成方可兑现；首次合作成功可能促成下一项目的开展。官方案例研究描述了公司从软件提供商向全栈生物技术模式的转变，这与此种混合推进路径相吻合。然而，公开资料并未展示各阶段之间的转化率。对投资研判的启示在于，应将已明确兑现的首期付款承诺与或有里程碑分开估值，并将候选化合物提名等产品产出统计数据视为运营证据而非客户采纳证明。
            claimRefs:
              - CU005
              - CU006
              - CU008
              - CU010
              - CU011
              - CU013
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU005
              - CU006
              - CU008
              - CU010
              - CU011
              - CU016
      - number: '6.5'
        title: 图表展示
        blocks:
          - type: callout
            title: CMS 的再次合作是业务拓展的最明确信号
            body: 在三个月内达成第二项 CMS 合作，是一个交易对手方深化合作关系的直接证据。但这并非整体客户群层面的留存证据，因为未公开任何同客群、续约、支出或已确认收入分母。
            calloutType: insight
            claimRefs:
              - CU001
              - CU002
              - CU011
          - type: callout
            title: 名义交易总额并非可持续的客户收入
            body: Lilly、CMS、Qilu 和 SK 的相关数据结合了首付款与或有付款结构，且披露程度各异。仅有 Lilly 的节选明确指出了首付款金额；其余潜在价值不应被视为已确认收入、ARR 或可用现金。
            calloutType: risk
            claimRefs:
              - CU002
              - CU003
              - CU012
              - CU015
  - number: 7
    title: 风险分析
    sections:
      - number: '7.1'
        title: 管理层核心风险排序与管线脆弱性
        blocks:
          - type: paragraph
            body: >-
              评估 Insilico Medicine 需要权衡其生成式 AI 管线推进速度与后期药物开发及跨国药企运营中固有的高淘汰率。10
              个临床阶段资产已获得临床验证，公司也签下名义总价值达数十亿美元的里程碑式商业联盟，但临床试验执行、合作伙伴集中度和专利披露之间仍留有实质风险。肿瘤和纤维化适应症历来是生物技术中淘汰率最高的领域；算法设计再高效，也替代不了按阶段推进的前瞻性人体试验。此外，公司的双引擎模式高度依赖大型药企合作伙伴承担后期研发及商业化支出，使
              Insilico 承受着合作伙伴管线优先级调整及非承诺性里程碑结构的风险敞口。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.2'
        title: 监管、法律与知识产权风险敞口
        blocks:
          - type: paragraph
            body: >-
              监管审批与知识产权保护构成了 Insilico 企业估值的基石。近期针对特发性肺纤维化（IPF）进入 Phase III 临床试验的核心化合物 rentosertib (ISM001-055)
              等临床阶段资产，必须经受美国 FDA 与中国国家药品监督管理局（NMPA/CDE）严格的双重司法管辖区审查。在知识产权保护上，法律学者指出 Insilico
              在学术成果宣传与商业秘密保护之间面临尖锐的战略权衡：尽管公司在《Nature Biotechnology》上发表了关于 rentosertib 的详尽 PandaOmics 和 Chemistry42
              研发历程，但其已获授权的物质组成专利（US11530197 B2）却省略了算法推导过程，以避免暴露专有筛选机制或引发发明人资格争议。此外，Pharma.AI 计算平台目前缺乏正式的 21 CFR Part 11
              验证以及公开的 GxP 审计追踪技术规范，未经外部 CRO 验证，软件输出不能直接作为受监管的临床试验记录。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR001
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
      - number: '7.3'
        title: 运营、实验质量与模型治理风险
        blocks:
          - type: paragraph
            body: >-
              Insilico 的运营模式依托于计算生成式建模与自动化实体湿实验室之间紧密耦合的反馈闭环，包括由 LabClaw 和 PandaClaw 等多智能体系统协同调度的 Life Star
              自动化机器人实验室。尽管该基础设施将临床前候选化合物（PCC）提名周期大幅压缩至 12–18 个月，且每个项目仅合成 60 至 200 个分子，但独立审查强调其公开 AI
              治理文档存在实质性缺口。具体而言，Pharma.AI
              未在公开文档中说明正式的算法偏差检测模块、人口统计学亚群公平性指标或面向用户的特征归因可解释性工具。此外，跨越剑桥、纽约、香港、阿布扎比和蒙特利尔的分散式实验室及计算中心运营，带来了地缘政治摩擦、数据出境合规阻碍以及运营复杂性，在跨境贸易摩擦期间可能会扰乱湿实验验证吞吐效率。
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR002
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.4'
        title: 合作伙伴交易对手方集中度与财务可持续性
        blocks:
          - type: paragraph
            body: >-
              Insilico 的商业战略高度依托于重磅对外授权与联合开发联盟，包括与 Eli Lilly（交易总值 $2.75 billion，首付款 $115 million）和 SK
              Biopharmaceuticals（名义价值 $2.5 billion，包含最高 $18 million 的首付款及近期付款承诺）达成的大额交易。尽管这些合作为 Pharma.AI
              的商业可行性提供了佐证，但名义交易总额的绝大部分属于后端的监管与销售里程碑款项，依然取决于外部合作伙伴的履约投入与临床成功。财务上，Insilico 在 2026 年上半年展现了强劲的顶线营收加速，在 2025
              年录得 $352.3 million 净亏损（主要受在香港交易所上市时可转换优先股公允价值变动所致）之后，预计实现营收 $102.5 million 至 $106.5 million，净利润 $33.5
              million 至 $39.5 million。尽管如此，维持长期经营盈利仍需要持续兑现里程碑、对各合作伙伴保持严格的信用管控，并在缺乏正式套期保值政策的情况下应对外汇波动。
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: 图表展示
        blocks:
          - type: callout
            title: Phase III 损耗是股权价值面临的主要下行风险诱因
            body: >-
              核心临床资产 rentosertib (ISM001-055) 正进入针对特发性肺纤维化（IPF）的 Phase III 试验。鉴于复杂疾病领域历史上仅有 5.1% 至 20.9%
              的临床推进成功率，若无法在规模更大、异质性更强的患者群体中复现 Phase IIa 的疗效，将动摇 Pharma.AI 平台的临床立论根基。
            calloutType: risk
            claimRefs:
              - CR001
              - CR005
          - type: callout
            title: 名义交易总额掩盖了非对称的里程碑兑现时点
            body: >-
              Insilico 在 2026 年宣布了与 Eli Lilly 和 SK Biopharmaceuticals 达成的高达逾 $5 billion 的名义合作协议。然而，预付现金占潜在总价值的比例不足
              3%，近期现金流能否生成，仍取决于运营里程碑能否兑现以及费用能否严控。
            calloutType: insight
            claimRefs:
              - CR013
              - CR014
  - number: 8
    title: 估值分析
    sections:
      - number: '8.1'
        title: 对价格敏感的投资建议
        blocks:
          - type: paragraph
            body: >-
              投资建议为保持跟踪并进一步研究，对证据评估抱有中等置信度，但对任何具体的数值估值置信度均偏低。Forge 显示其 2026 年 1 月的最近已知估值为 $1
              billion，但也同时将市场交易活跃度归类为受限，未显示可用的 Forge Price 或最近撮合成交价，并提示其估值数据点不一定代表可执行的市场价格。Clay 另行表示当前估值尚未公开披露，而
              EquityZen 则将当前估值及股价数据置于注册墙之后。这些记录表明资本市场存在关注度，但并不意味着所分配的证据能够支撑当前的买入价位。Insilico 官方发布的公告确认已在 HKEX
              上市，但在缺少实时股价、稀释后总股本、经审计财务数据或优先条款的情况下，给出公允价值或回报目标只能是虚假精度。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV011
              - CV012
              - CV013
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV011
              - CV012
              - CV013
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV004
              - CV007
              - CV013
              - CV015
              - CV016
      - number: '8.2'
        title: 核心论点与反方观点
        blocks:
          - type: paragraph
            body: >-
              核心论点在于，Insilico 将端到端药物研发平台与持续获取外部资本及合作伙伴经济效益的能力相结合。公司资料描述了一种跨越靶点发现、分子生成及临床预测、以平台为中心的商业模式。Insilico 与
              MobiHealthNews 独立报道均提及了 $110 million 的 E 轮融资，公司表示所得款项将用于支持其研发管线、AI
              模型及自动化实验室。反方观点则认为，技术广度与名义交易金额并不等同于经常性收入或临床成功。MobiHealthNews 报道称，在与 Menarini 的一笔交易中首付款为 $20
              million，而潜在总价值超过 $550 million；Insilico 另外还提及四项合计价值超过 $2.1 billion 的对外授权协议。这些均属于附带触发条件的交易金额，并非
              ARR、已确认收入、现金或有保证的确定对价。
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV015
      - number: '8.3'
        title: 情景假设与可比公司分析准则
        blocks:
          - type: paragraph
            body: >-
              在获取交易价格与经审计的经营数据之前，乐观、基准和悲观情景必须保持定性分析。乐观信号将是临床及管线进展持续推进，且附带触发条件的合作关系逐步转化为已披露的现金和已确认收入。基准情景是持续拥有融资渠道并推进管线开发，但缺乏足够信息来对投资回报做出确定性判断。悲观情景则交织了流动性疲软、临床或商业化挫折，以及在未知估值水平下的股权稀释。Forge
              的对比面板并未解决该问题：其将该领域归类为医疗健康软件（Healthcare Software），却将 Oura 与 Iambic Therapeutics、TRexBio、City Therapeutics 和
              Affinia Therapeutics 混在一起。该清单虽有助于探索行业标的，但未提供统一的收入、管线阶段、现金或企业价值基准分母，因此并非适用于估值模型的可比上市公司标的池。
            claimRefs:
              - CV002
              - CV004
              - CV007
              - CV010
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV004
              - CV007
              - CV010
              - CV013
              - CV015
              - CV016
      - number: '8.4'
        title: 退出成熟度与尽调前置门槛
        blocks:
          - type: paragraph
            body: >-
              2025 年 12 月在 HKEX
              上市证明其拥有退出渠道，但仅凭上市地位本身并不能确立可用的流动性、具有吸引力的买入价位或目标回报率。最直接的前置审核资料包应包含最新的交易所公告文件与交易记录：经审计的营收与亏损、现金与债务、经营性现金流、已发行及完全稀释后股份、期权与认股权证排期表、禁售期、优先股转换历史以及当前市值。投资者还应将每项名义合作金额逐一核对并拆分为首付现金、研发资助、开发里程碑、商业化里程碑、销售提成分成以及已确认收入。唯有在这些文件能够证实充足的现金跑道、具有防守性的每股买入价格以及可复制的商业化路径时，投资观点方可改善；若出现临床挫折、合作取消、非计划性稀释，或有证据表明所引用的交易金额在很大程度上仍遥不可及，投资观点则将进一步转弱。
            claimRefs:
              - CV003
              - CV008
              - CV009
              - CV010
              - CV013
              - CV015
              - CV016
      - number: '8.5'
        title: 图表展示
        blocks:
          - type: callout
            title: 做出买入建议前设立的价格门槛
            body: 公开上市与报道的历史估值，代替不了经核实的入场价格和完全稀释企业价值。只有在最新交易所数据与经审计财务报表填补这些缺口之后，投资建议才可能走出「观察」阶段。
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV013
              - CV015
              - CV016
