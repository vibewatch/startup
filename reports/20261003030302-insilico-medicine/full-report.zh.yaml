chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 企业属性、创立历史与商业模式
        blocks:
          - type: paragraph
            body: >-
              Insilico Medicine 是一家处于临床阶段的生物技术公司，由 Alex Zhavoronkov 博士于 2014
              年创立，目前管理总部设在马萨诸塞州剑桥，并在香港、阿布扎比、纽约、蒙特利尔和台北设有战略分支机构 [CO001]。公司构建了以专有 Pharma.AI 软件套件为核心的 AI
              原生运营模式，该套件整合三大基础引擎：Biology42（以用于新靶点发现及组学分析的 PandaOmics 为核心）、Chemistry42（从头生成式分子设计与基于物理学的评分）以及
              Science42（科学推理模型、自动化文献综合与 MMAI Gym 基准训练）[CO009]。与纯计算化学软件供应商不同，Insilico
              采用双引擎商业架构，将自研治疗药物开发与高价值对外授权及共同开发合作相结合 [CO007]。2025 年 12 月 30 日，公司达成关键企业里程碑，在香港联合交易所主板挂牌上市，股票代码为 HKEX:
              3696，完成香港当年规模最大的生物技术 IPO [CO002]。2026 年上半年，Insilico 跨越运营盈利分水岭，在跨国药企合作的首付款及里程碑收益支持下，录得总营收 US$106.3
              million——同比增长 287.2%——并实现净利润 US$35.54 million [CO003]。公司计划于 2026 年 8 月下旬召开正式中期业绩电话会，与国际资本市场投资者共同回顾这些运营成果
              [CO012]。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO007
              - CO009
              - CO012
