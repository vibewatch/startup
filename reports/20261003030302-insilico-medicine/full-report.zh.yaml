  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局：直接同行、老牌巨头与新兴 TechBio
        blocks:
          - type: paragraph
            body: >-
              围绕 Insilico Medicine 的竞争格局涵盖四类不同阵营：以资产为核心的 TechBio
              同行、计算生物物理学老牌巨头、环境感知与临床智能提供商，以及大型生物医药企业的内部计算化学团队。Insilico 将自身市场定位界定为全栈双引擎企业，既是推进自研资产的生物技术药物研发商，又是对外授权
              Biology42、Chemistry42、Medicine42 和 Science42 等 Pharma.AI 套件的模块化软件提供商。在生成式生物学与 TechBio 同行阵营中，直接竞争对手包括
              Recursion Pharmaceuticals，该公司构建了庞大的自动化成像基础设施，并借助收购 Exscientia 扩展了其计算化学技术栈。在计算生物物理学与分子建模领域，Schrödinger
              作为老牌企业级标准，凭借基于物理学的自由能微扰（FEP+）及 LiveDesign 等分子动力学模拟软件深度绑定客户工作流。新兴商业名录还将 Insilico 与 ConcertAI、Truveta、Tempus
              及 PathAI 等相邻医疗健康 AI 供应商进行横向对比，不过这些厂商主要解决临床真实世界证据、病理诊断及电子病历数据治理问题，而非从头生成式化学与临床前靶点发现。在前 20
              大跨国药企赞助方中，内部自研威胁始终构成一道长期壁垒，这些药企在采购供应商服务的同时，往往频繁部署内部化学信息学脚本与开源模型。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
          - type: table
            tableRef: TP001
