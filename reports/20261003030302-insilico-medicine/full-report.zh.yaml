              业绩实质性缓解了近期融资压力。然而，所保留的证据并未披露合同层面的收入确认、里程碑实现概率、客户集中度、已实现的销售提成分成、CAC、销售周期时长、投资回收期或各业务线的边际贡献率。公司称截至 2026 年 6
