      - number: '2.4'
        title: 增长驱动因素、制约瓶颈与估值相关性
        blocks:
          - type: paragraph
            body: >-
              最有力的采纳论据来自经济效益：Insilico
              报告称其候选分子提名周期更短、合成化合物更少，且临床前候选分子成本显著低于传统基准。这些属于公司口径声明，即使在联合通稿中被多次转述，也应逐个项目予以核实，而不应直接将其资本化为已获证实的客户
              ROI。采纳过程还受到多重制约：模型治理与强监管系统文档要求、与现有科学工作流的集成难度、漫长的临床验证周期，以及买方将 AI
              输出与成熟方法进行对照评估的能力。因此，估值应严格区分经常性软件经济效益与依赖里程碑的合作及资产经济效益，不应将表面上的市场规模增长直接等同于现金兑现。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
