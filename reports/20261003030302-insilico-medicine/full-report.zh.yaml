        title: Pharma.AI 架构与研发运营模式
        blocks:
          - type: paragraph
            body: >-
              Insilico Medicine 将其计算药物研发产品整合为 Pharma.AI 套件，划分为四大互联支柱：Biology42、Chemistry42、Medicine42 和
              Science42。在生物靶点发现上，PandaOmics 利用多组学数据集及覆盖 8,000 种疾病适应症的 23
              个疾病专有模型，按置信度、成药性、商业可行性及机制明确度对靶点进行排序。在分子生成上，Chemistry42
              采用生成对抗自编码器与强化学习，而非暴力虚拟筛选，以此设计并合成用于命中指定生物通路的全新化学结构。在临床分析上，inClinico 使用基于历史 Phase II 临床数据集训练的 Transformer
              架构，评估前瞻性试验成功率。整个计算流程接入 Life Star 自动化实验室：干实验（in silico）候选分子在生物实验中完成合成、筛选和验证，再反哺预测算法。
