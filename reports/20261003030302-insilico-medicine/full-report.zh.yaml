      - number: '4.2'
        title: 2026 年 H1 出现大幅反转，但持续性尚未得到证实
        blocks:
          - type: paragraph
            body: >-
              由于管线开发收入下滑，FY2025 营收下降 34.5% 至 US$56.2 million；同时因利润率较低的药物研发业务占比上升，毛利率降至 81.5%。随后 2026 年 H1 出现强劲反转：公司报告营收达
              US$106.3 million，毛利率为 90.3%，IFRS 净利润为 US$35.54 million，经调整非国际财务报告准则（Non-IFRS）净利润达 US$51.23
              million。该报告期表明，首付款与里程碑进账能够带来高利润率，但这尚未确立稳定的可持续年化水平（run
              rate）。管理层明确拒绝提供营收或利润指引，因为业绩高度依赖治疗药物的对外授权决策。因此，投资者不应将半年度业绩简单年化，也不应将单个盈利期直接视为经常性盈利能力的证据。
