    Insilico Medicine 是一家处于临床阶段的生物技术公司，将 Pharma.AI 软件栈与自研药物研发及湿实验机器人相结合，用于识别靶点、设计分子并推进合作与自研治疗方案。公司现已上市，于 2025 年 12 月在
