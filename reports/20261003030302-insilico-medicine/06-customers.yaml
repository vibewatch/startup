runDate: "2026-10-03"
company:
  name: "Insilico Medicine"
chapter:
  number: 6
  title: "Customers"
  summary: "Public evidence supports a customer model centered on pharmaceutical co-development, asset licensing, and expert-facing discovery tools, with repeat CMS activity and large Lilly deal terms providing the clearest commercial signals. The evidence does not disclose active paid customer counts, realized milestone revenue, production usage, retention, or concentration, so relationship breadth should not be mistaken for durable recurring adoption."

sections:
  - id: "customer-segments-and-buyers"
    title: "Customer Segments and Buying Motions"
    body: "Insilico Medicine addresses several related but distinct constituencies. Pharmaceutical and biotechnology companies appear to be the principal economic buyers for target-discovery, molecule-design, co-development, and licensing work; the public commercial descriptions emphasize upfront payments, milestones, and royalties rather than a standardized self-serve price. Scientists and research teams are the direct users of PandaOmics, Chemistry42, and the newer LabClaw workflow, while development and commercialization partners supply clinical, regulatory, and market-access capabilities. A smaller ecosystem motion is visible through named MMAI Gym partners. This segmentation is supported by product and deal descriptions, but the source set does not quantify paid accounts, users, seats, geographies, vertical mix, or revenue by segment."
    claimRefs:
      - "CU005"
      - "CU006"
      - "CU007"
      - "CU008"
      - "CU009"
      - "CU014"
    tableRefs:
      - "TU001"

  - id: "named-relationships-and-adoption"
    title: "Named Relationships and Adoption Signals"
    body: "The strongest customer evidence is contractual rather than usage-based. PharmExec reported that CMS entered a second CNS-focused collaboration with Insilico within three months, with the new program carrying up to approximately $177 million in milestones plus royalties. STAT separately reported a Lilly agreement with $115 million upfront and $2.75 billion in total potential payments. PharmExec also summarized 2026 agreements with Qilu and SK Biopharmaceuticals. These announcements demonstrate willingness by named pharmaceutical counterparties to transact and, in CMS's case, to expand a relationship. They do not establish realized milestone receipts, recurring platform use, production deployment, renewal, or end-customer outcomes because those denominators and operating details were not disclosed."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU011"
      - "CU015"
      - "CU016"
    tableRefs:
      - "TU002"
      - "TU003"

  - id: "durability-and-concentration"
    title: "Durability, Retention, and Concentration"
    body: "Public durability evidence is materially weaker than transaction evidence. The reviewed allocation contains no ARR, NRR, GRR, logo churn, cohort renewal, contract-length distribution, active-seat count, top-customer revenue share, or realized milestone schedule. A repeat CMS agreement is a useful land-and-expand indicator for one relationship, but one expansion event cannot establish portfolio-wide retention. Similarly, large headline values are contingent consideration rather than revenue and reveal little about timing or probability. The most explicit adverse signal is qualitative: a STAT reporter wrote that she had not fully understood what Insilico does or why it is popular, highlighting external clarity risk even as the same excerpt noted the Lilly transaction. Investor diligence therefore needs customer-level contract and usage evidence before assigning recurring value."
    claimRefs:
      - "CU003"
      - "CU004"
      - "CU011"
      - "CU012"
      - "CU016"

  - id: "journey-and-investment-implications"
    title: "Customer Journey and Investment Implications"
    body: "The evidence supports a cautious journey model: an expert research need enters through a platform or scoped discovery engagement; Insilico contributes target identification, molecule generation, and laboratory workflow capabilities; a counterparty may then fund co-development or license an asset; milestones and royalties can follow only if contractual and development events occur; and a successful first engagement may lead to another program. The official case study describes a shift from software provider toward a full-stack biotechnology model, consistent with this blended motion. However, public materials do not show conversion rates between stages. The underwriting implication is to value demonstrated upfront commitments separately from contingent milestones and to treat product-output statistics, such as candidate nominations, as operational evidence rather than customer adoption."
    claimRefs:
      - "CU005"
      - "CU006"
      - "CU008"
      - "CU010"
      - "CU011"
      - "CU013"
      - "CU016"
    figureRefs:
      - "FU001"

