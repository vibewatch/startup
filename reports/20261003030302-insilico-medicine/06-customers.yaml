      - "CU002"
      - "CU011"
  - calloutType: "risk"
    title: "Headline deal value is not durable customer revenue"
    body: "The Lilly, CMS, Qilu, and SK figures combine upfront and contingent structures with different disclosure levels. Only the Lilly excerpt identifies an upfront amount; the remaining potential values should not be treated as realized revenue, ARR, or cash available."
