    title: "Repeat CMS activity is the clearest expansion signal"
    body: "A second CMS collaboration within three months is direct evidence of one counterparty expanding its relationship. It is not portfolio-level retention evidence because no cohort, renewal, spend, or realized-revenue denominator is public."
    claimRefs:
