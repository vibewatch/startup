    title: "The Dual-Engine Paradox: Software Vendor vs. Clinical Biotech"
    body: "Insilico Medicine’s dual-engine model provides resilience by monetizing software licenses ($4.9M in 2025) while pursuing multi-billion-dollar out-licensing deals. However, this structure creates positioning tension: software buyers face high custom pricing and services dependency, while equity investors evaluate Insilico against unprofitable biotech multiples with heavy R&D burn."
    claimRefs:
      - "CP004"
      - "CP011"
      - "CP012"
      - "CP013"
  - calloutType: "risk"
    title: "Valuation Multiple Premium in Public Equity Markets"
    body: "Following its late-2025 HKEX listing, InSilico Medicine traded at a Price-to-Book multiple of 8.5x, significantly exceeding the regional peer average of 3.0x and the Asian Life Sciences average of 2.6x. With 2025 annual net losses reaching $352.3M, sustaining this premium requires flawless clinical execution across lead assets like rentosertib."
