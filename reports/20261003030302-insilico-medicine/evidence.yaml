evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance-shareholder-breakdown
    missingEvidence: >-
      Comprehensive post-IPO share register showing exact beneficial equity stakes and voting rights for Alex
      Zhavoronkov, Warburg Pincus, and Eli Lilly.
    whyItMatters: >-
      Determines minority shareholder protections, governance voting control, and potential overhang risk upon lockup
      expiration.
    diligencePath: >-
      Inspect HKEX Disclosure of Interests filings and Section 336 register filings for InSilico Medicine Cayman TopCo
      (HKEX: 3696).
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-mapping-completeness
    missingEvidence: Complete breakdown of non-cornerstone institutional investors and employee share option scheme (ESOP) allocations.
    whyItMatters: Provides visibility into dilution dynamics, secondary market liquidity, and talent retention incentives.
    diligencePath: >-
      Review annual report disclosure of share option schemes and major shareholdings upon release of full 2026 annual
      report.
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: company-specific-sam-som
    missingEvidence: >-
      Offering-level pricing, eligible buyer counts, sales capacity, pipeline probability, geographic rights, and
      customer conversion data needed to calculate company-specific SAM and SOM.
    whyItMatters: >-
      The retained category forecasts overlap and cannot establish the revenue pool that Insilico can actually serve or
      win.
    diligencePath: >-
      Obtain management's bottom-up market model and reconcile it to customer cohorts, contracted programs, asset
      rights, and recognized revenue.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: validated-market-capture
    missingEvidence: >-
      Current audited offering-level revenue, software renewal and retention, customer concentration, realized milestone
      cash, and customer-validated ROI.
    whyItMatters: >-
      Without these measures, reported market growth and company efficiency claims cannot be translated into durable
      market share or valuation.
    diligencePath: >-
      Review the full 2025 annual report and customer contracts, then interview reference customers and reconcile
      headline deal values to cash receipts.
    relatedQuestionRefs:
      - QM010
  - type: private-evidence-only
    severity: material
    topic: monetization
    missingEvidence: >-
      Contract-level upfront receipts, milestone triggers and probabilities, revenue recognition schedules, royalty
      bases, customer concentration, and realized pricing.
    whyItMatters: >-
      Headline deal values cannot be converted into durable revenue, gross profit, or cash-flow forecasts without these
      terms.
    diligencePath: >-
      Obtain the executed material contracts, revenue-recognition memos, customer-level revenue bridge, backlog
      schedule, and milestone probability assessment.
    relatedQuestionRefs:
      - QI002
      - QI009
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: >-
      CAC, sales-cycle duration, win rate, channel cost, renewal rate, NRR, and payback by drug-discovery, pipeline,
      software, and other-discovery stream.
    whyItMatters: The public record does not permit assessment of GTM scalability or recurring software economics.
    diligencePath: >-
      Request cohort-level CRM exports, sales and marketing allocation, contract renewal history, discount logs, and
      customer acquisition cost calculations.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-needs
    missingEvidence: >-
      Monthly liquidity forecast, restricted-cash detail, committed trial spend, program-level budgets, and downside
      runway under delayed licensing milestones.
    whyItMatters: >-
      Funding raised and managed investments do not establish cash available or runway after clinical commitments and
      working-capital requirements.
    diligencePath: >-
      Obtain the 24-month board-approved cash forecast, bank and investment statements, clinical commitments ledger,
      lease schedule, and downside financing plan.
    relatedQuestionRefs:
      - QI007
      - QI008
      - QI009
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: robotic-automation-operations
    missingEvidence: >-
      Audited throughput statistics, robotic mechanical failure rates, reagent batch quality, and operational capex for
      the Life Star autonomous laboratory.
    whyItMatters: >-
      Without empirical equipment uptime and operational yield data, underwriters cannot verify whether closed-loop
      robotic wet labs generate cost efficiencies or require heavy physical maintenance.
    diligencePath: >-
      Request Life Star operational logs, annual robotic instrument maintenance contracts, and third-party facility
      inspection audits under non-disclosure agreements.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE003
