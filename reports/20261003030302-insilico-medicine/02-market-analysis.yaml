company:
  name: "Insilico Medicine"
chapter:
  number: 2
  title: "Market Analysis"
  summary: "Insilico addresses a hybrid market spanning drug-discovery software, collaborative discovery programs, and asset licensing rather than one clean software TAM. The available forecasts indicate rapid category growth, but they are non-nested secondary or company-issued estimates and do not establish a defensible company-specific SAM or SOM."
sections:
  - id: "market-boundary"
    title: "Market Boundary and Status-Quo Alternatives"
    body: >-
      The relevant market begins with target identification and generative chemistry, extends through
      clinical-outcome prediction and preclinical candidate creation, and ends before routine care
      delivery, commercial manufacturing, or supply-chain operations. Within that boundary, Insilico
      addresses two different budget pools: hosted or on-premise software subscriptions and
      project-, collaboration-, or asset-based drug-development spending. The status quo is not a
      single competitor. Buyers can keep discovery in-house, use point computational-chemistry
      tools, contract wet-lab work to CROs, or license a later-stage asset. This makes broad AI
      market forecasts directionally useful but insufficient for estimating revenue available to
      Insilico.
    claimRefs:
      - "CM001"
      - "CM002"
      - "CM007"
    tableRefs:
      - "TM001"
  - id: "sizing-lenses"
    title: "Evidence-Constrained Sizing Lenses"
    body: >-
      The assigned evidence supports six reported sizing lenses, not a nested TAM/SAM/SOM model.
      PharmaNow reports separate 2023-to-2028 forecasts for AI oncology discovery, computational
      chemistry software, generative AI drug design, and AI clinical-trial optimization. Company
      materials add indication-level forecasts for IPF and dyslipidemia through 2032. These
      categories overlap, use different periods, and do not disclose a common geography or
      methodology in the retained text. They therefore must not be summed. The most decision-useful
      conclusion is that multiple adjacent budgets are growing; the unresolved task is determining
      what share is addressable through Insilico's software, collaboration, and licensing models.
    claimRefs:
      - "CM011"
      - "CM012"
      - "CM013"
      - "CM014"
      - "CM015"
      - "CM016"
    tableRefs:
      - "TM002"
    figureRefs:
      - "FM001"
  - id: "buyers-and-adoption"
    title: "Buyer, User, Payer, and Adoption Path"
    body: >-
      The practical buyers are pharmaceutical R&D, external-innovation, and business-development
      leaders; users are computational chemists, biologists, medicinal chemists, and portfolio
      teams; and the payer is normally a pharma or well-funded biotech R&D organization. Academic
      researchers are plausible users but a weaker commercial segment. Procurement differs by
      offering: software requires workflow integration and expert-user acceptance, discovery
      collaborations require jointly defined targets and milestones, and asset licensing requires
      biological, preclinical, or clinical de-risking. The 59-customer figure disclosed for 2024
      indicates adoption, but the pool does not separate software customers, collaborators,
      renewals, or customer concentration.
    claimRefs:
      - "CM003"
      - "CM004"
      - "CM005"
    tableRefs:
      - "TM003"
  - id: "drivers-constraints-and-valuation"
    title: "Growth Drivers, Constraints, and Valuation Relevance"
    body: >-
      The strongest adoption argument is economic: Insilico reports shorter candidate-nomination
      timelines, fewer synthesized molecules, and materially lower preclinical-candidate costs than
      traditional benchmarks. These are company claims, even when repeated through a syndicated
      release, and should be validated program by program rather than capitalized as proven customer
      ROI. Adoption is also constrained by model-governance and regulated-system documentation,
      integration with existing scientific workflows, long clinical validation cycles, and buyers'
      ability to compare AI output with established methods. Valuation should therefore distinguish
      recurring software economics from milestone-dependent collaboration and asset economics, and
      should not treat headline market growth as cash realization.
    claimRefs:
      - "CM005"
      - "CM006"
      - "CM007"
      - "CM008"
      - "CM009"
      - "CM010"
