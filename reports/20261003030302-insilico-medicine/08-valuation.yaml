  - id: "TV003"
    title: "Bull / Base / Bear Scenario Table"
    columns:
      - "Scenario"
      - "Assumptions"
      - "Valuation / return logic"
      - "Probability signal and downside trigger"
    rows:
      - - "Bull"
        - "Pipeline progression continues and contingent partnerships convert into disclosed cash and recognized revenue"
        - "Range not supportable until live price, diluted shares, net cash, and audited revenue are available"
        - "Positive signal: independent clinical validation; trigger: failed readout or cancelled partnership"
      - - "Base"
        - "Financing access and development continue, but commercial conversion remains uneven"
        - "Track without a return target because the evidence does not establish an entry enterprise value"
        - "Neutral signal: steady disclosures; trigger: cash use or dilution outpaces milestones"
      - - "Bear"
        - "Limited liquidity combines with clinical delay, weak milestone conversion, or dilutive capital needs"
        - "Downside cannot be bounded by a fabricated cash floor because audited cash and liabilities are unavailable"
        - "Negative signal: partner deprioritization, clinical setback, or financing below the prior mark"
    notes: "Scenarios are directional rather than probability-weighted because the assigned evidence lacks audited financials, live pricing, and a diluted capitalization table."
    claimRefs:
