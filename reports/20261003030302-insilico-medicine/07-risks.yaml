callouts:
  - calloutType: "risk"
    title: "Phase III Attrition Represents Primary Equity Downside Driver"
    body: "Lead clinical asset rentosertib (ISM001-055) is entering Phase III trials for idiopathic pulmonary fibrosis (IPF). Given the historical 5.1% to 20.9% clinical transition rates across complex disease areas, any failure to reproduce Phase IIa efficacy in a larger, heterogeneous patient cohort would undermine the clinical premise of the Pharma.AI platform."
    claimRefs:
      - "CR001"
      - "CR005"
  - calloutType: "insight"
    title: "Headline Deal Values Mask Asymmetric Milestone Timing"
    body: "Insilico has announced over $5 billion in headline partnership agreements across Eli Lilly and SK Biopharmaceuticals in 2026. However, upfront cash represents under 3% of aggregate potential value, meaning that near-term cash generation remains heavily reliant on operational milestone execution and disciplined expense management."
    claimRefs:
      - "CR013"
      - "CR014"
