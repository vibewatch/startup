schemaVersion: "report-v2"
artifact: financials
slug: insilico-medicine
runDate: 2026-10-03
company:
  name: Insilico Medicine
chapter:
  number: 4
  title: Financials
  summary: >-
    Insilico Medicine moved from a weak, cash-consuming FY2025 to company-reported
    profitability and positive operating cash flow in H1 2026, but the improvement
    was driven mainly by upfront and milestone-heavy collaboration revenue. Liquidity
    appears substantial, while revenue durability, realized contract economics,
    customer concentration, and sales efficiency remain material underwriting gaps.
sections:
  - id: revenue-architecture
    title: Revenue architecture is asset-led, not conventional SaaS
    body: >-
      Insilico monetizes through drug discovery and pipeline-development arrangements,
      software subscriptions, and a small other-discovery business. The filing describes
      collaboration economics as upfront payments, development, regulatory and commercial
      milestones, and royalties; software customers pay subscription fees for platform
      access or on-premise rights. This structure makes asset progression and deal timing
      the primary revenue engine rather than recurring software alone. In FY2025, drug
      discovery and pipeline development contributed US$48.837 million of US$56.239
      million total revenue, while software contributed US$4.913 million. The retained
      H1 2026 release reported US$103.1 million from drug discovery and pipeline
      development versus US$2.70 million from software. Accordingly, headline contract
      value is a contingent opportunity set, not ARR, recognized revenue, or cash
      available for operations.
    claimRefs: [CI001, CI004, CI005, CI011, CI013]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: revenue-quality
    title: H1 2026 inflected sharply, but durability is unproven
    body: >-
      FY2025 revenue fell 34.5% to US$56.2 million as pipeline-development revenue
      declined, and gross margin fell to 81.5% because lower-margin drug-discovery work
      became a larger share. H1 2026 then reversed direction: the company reported
      US$106.3 million of revenue, 90.3% gross margin, US$35.54 million IFRS net profit,
      and US$51.23 million adjusted non-IFRS net profit. The period demonstrates that
      upfront and milestone receipts can produce high margins, but it does not establish
      a stable run rate. Management explicitly declined to provide revenue or profit
      guidance because results depend on therapeutic out-licensing decisions. Investors
      therefore should not annualize the half-year result or treat one profitable period
      as evidence of recurring profitability.
    claimRefs: [CI002, CI003, CI010, CI011, CI014]
  - id: cost-and-capital
    title: Liquidity improved while development obligations remain capital intensive
    body: >-
      The 2025 filing shows the cost base is dominated by research activity: R&D expense
      was US$81.379 million, including US$47.130 million of third-party contracting costs
      and US$26.293 million of labor costs. Net operating cash outflow was US$76.8 million
      in FY2025, even though year-end bank balances and cash reached US$393.338 million
      after the Global Offering. By H1 2026, management reported US$79 million of cash
      from operating activities and US$584.8 million of cash and cash-management reserves.
      The balance sheet had no bank borrowings at FY2025 year-end, but lease liabilities
      were US$6.0 million. The Global Offering earmarked HK$2.3503 billion for clinical
      development, AI models, laboratory expansion, other pipeline R&D, and working
      capital, underscoring that liquidity is intended to fund multi-year development
      rather than constituting distributable surplus.
    claimRefs: [CI006, CI007, CI008, CI009, CI012, CI015, CI016]
    tableRefs: [TI003]
  - id: underwriting-verdict
    title: Financial verdict and diligence blockers
    body: >-
      Revenue quality is mixed. Asset licensing can generate large, high-margin cash
      events, and the H1 2026 results materially reduce near-term financing pressure.
      However, the retained evidence does not disclose contract-level revenue recognition,
      milestone probability, customer concentration, realized royalty economics, CAC,
      sales-cycle duration, payback, or contribution margin by stream. The company said
      only US$308 million had been received against US$11 billion of signed deal value as
      of June 30, 2026, with US$10.6 billion described as potential future milestones.
      That denominator makes clear why total deal value cannot be used as a revenue or
      liquidity proxy. Underwriting should anchor on cash received, recognized revenue,
      operating cash flow, and committed clinical spend, with contract schedules and
      audited segment economics required before assigning a durable earnings multiple.
    claimRefs: [CI012, CI013, CI014, CI016]
tables:
  - id: TI001
    title: Revenue streams and disclosed mix
    columns: [Stream, Mechanism / unit, FY2025 revenue, H1 2026 status, Revenue quality, Diligence ask]
    rows:
      - [Drug discovery, Project and collaboration consideration, "US$24.952m", "Included in US$103.1m combined drug-discovery and pipeline-development revenue", Deal-timed and project-based, Contract-level recognition schedule and customer concentration]
      - [Pipeline development, Upfront and milestone consideration; potential royalties, "US$23.885m", "Included in US$103.1m combined drug-discovery and pipeline-development revenue", High upside but milestone-dependent, Probability-weighted milestone schedule and retained rights]
      - [Software solutions, Subscription access or on-premise platform rights, "US$4.913m", "US$2.70m", More recurring in form but small in mix, "ARR, renewal, NRR, realized price, and support cost"]
      - [Other discovery, Non-pharma discovery services and collaborations, "US$2.489m", Not separately disclosed in retained H1 evidence, Diversifying but immaterial in FY2025, "Backlog, delivery cost, and repeat-customer evidence"]
    notes: >-
      FY2025 values are audited-period figures from the annual-results announcement;
      H1 2026 values are company-reported interim figures. Contract value and future
      milestones are excluded because they are not recognized revenue.
    claimRefs: [CI001, CI004, CI005, CI011]
  - id: TI002
    title: Pricing and monetization mechanics
    columns: [Mechanism, Price / unit / contract basis, Public evidence, Realized economics, Underwriting implication]
    rows:
      - [Asset out-licensing, Per-asset negotiated contract, "Upfront, milestones, and royalties disclosed as standard components", Contract-specific terms mostly undisclosed, Model only receipts and milestones with disclosed triggers]
      - [Drug-discovery collaboration, Project or multi-year negotiated agreement, Upfront and success-based payments may apply, Delivery obligations and gross margin by project unavailable, Do not equate maximum deal value with revenue]
      - [Commercial royalties, Tiered percentage of future net sales, Management said most deal royalties range from high single digits to mid-teens, No commercial royalty base disclosed, Long-dated and contingent on approval and sales]
      - [Software access, Subscription or on-premise usage right, "181 subscription customers and US$4.9m FY2025 software revenue", "ARR, discounts, NRR, and contract duration unavailable", Recurring potential is not yet underwritable]
      - [MMAI Gym and model co-development, Bespoke collaboration, Company described revenue-generating collaborations in 2026, Pricing and contribution margin unavailable, Treat as project revenue until repeatability is evidenced]
    notes: >-
      Public sources describe contract forms and selected headline values, not a
      standardized price list or realized net pricing. All undisclosed economics are
      marked as unavailable rather than estimated.
    claimRefs: [CI004, CI005, CI012, CI013]
  - id: TI003
    title: Unit economics and capital adequacy scorecard
    columns: [Metric, Period / value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Gross margin, "FY2025: 81.5%", Filing-based, Shows strong headline economics but sensitivity to revenue mix, Margin by stream and allocation policy]
      - [Gross margin, "H1 2026: 90.3%", Company-reported interim, Reflects a licensing-heavy period, Bridge from cash receipts to recognized revenue and gross profit]
      - [R&D expense, "FY2025: US$81.379m", Filing-based, Core recurring investment exceeds FY2025 revenue, Program-level budget and committed trial spend]
      - [Operating cash flow, "FY2025: US$(76.8)m; H1 2026: US$79m", Filing plus management transcript, Demonstrates material period-to-period volatility, Monthly cash bridge and working-capital normalization]
      - [Cash and managed investments, "H1 2026: US$584.8m", Company-reported interim, Provides a substantial liquidity buffer, "Restricted balances, maturities, and board-approved minimum cash"]
      - [Bank debt / leases, "FY2025: no bank borrowings; US$6.0m lease liabilities", Filing-based, Conventional leverage was low at year-end, "Post-period debt, guarantees, and lease schedule"]
      - [CAC and payback, null, Unavailable, Sales efficiency cannot be assessed, "Customer acquisition cost, sales-cycle duration, win rate, and payback by stream"]
    notes: >-
      Values use different periods and bases and are not a conversion funnel. H1 2026
      figures are not annualized; null means the retained public evidence did not disclose
      the metric.
    claimRefs: [CI003, CI006, CI007, CI008, CI010, CI012, CI015]
figures:
  - id: FI001
    title: Asset-led revenue realization path
    type: flow
    summary: >-
      The business model converts funded R&D and asset progression into negotiated,
      milestone-dependent receipts rather than a smooth subscription-only revenue stream.
    data:
      nodes:
        - id: internal-r-and-d
          label: Internal R&D and platform investment
          detail: "FY2025 R&D expense was US$81.379m."
        - id: asset-or-project
          label: Asset or collaboration project
          detail: "Drug candidates, discovery projects, software, and model-development engagements."
        - id: negotiated-contract
          label: Negotiated contract
          detail: "Terms may include upfront payments, project fees, milestones, and royalties."
        - id: recognized-revenue
          label: Recognized revenue
          detail: "Timing depends on deal execution and satisfaction of performance obligations."
        - id: gross-profit
          label: Gross profit
          detail: "Margin varies with mix; FY2025 was 81.5% and H1 2026 was 90.3%."
        - id: reinvestment
          label: Pipeline and platform reinvestment
          detail: "Offering proceeds were allocated largely to trials, models, laboratory capacity, and pipeline R&D."
    approximationNotes: >-
      Ordered conceptual flow based on disclosed contract mechanics; it is not a forecast
      and does not imply that headline contract value converts fully or on a fixed schedule.
    claimRefs: [CI005, CI006, CI009, CI013, CI016]
callouts:
  - calloutType: risk
    title: Do not capitalize headline deal value as revenue
    body: >-
      Management described US$11 billion of signed deal value but only US$308 million
      received through June 30, 2026; the remaining US$10.6 billion was characterized as
      future milestones. Those contingent amounts are neither recognized revenue nor cash
      available today.
    claimRefs: [CI013]
  - calloutType: recommendation
    title: Underwriting stance
    body: >-
      Treat H1 2026 as evidence that the model can produce profitable periods, not as a
      durable run rate. Require audited contract waterfalls, customer concentration,
      program budgets, and normalized cash conversion before underwriting sustained
      profitability.
    claimRefs: [CI007, CI010, CI012, CI014, CI016]
