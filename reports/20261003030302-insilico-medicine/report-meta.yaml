  topStrengths:
    - H1 2026 revenue, gross margin, and net profit show the model can generate meaningful cash and earnings.
    - The HKEX listing and large cash balance reduce near-term financing pressure.
    - >-
      Pharma.AI and the partner network create multiple commercialization paths across software, collaboration, and
      assets.
  topRisks:
    - Rentosertib Phase III execution remains a major binary clinical risk.
    - >-
      Revenue is still heavily weighted toward collaboration and milestone economics rather than durable recurring
      software.
    - Valuation, dilution, and fully diluted ownership remain opaque after the listing.
    - Key-person concentration and cross-border operational complexity remain material.
  unresolvedGaps:
    - Audited contract waterfalls and segment economics for software versus collaboration revenue.
    - Phase III protocol design, powering, enrollment pace, and readout timeline for rentosertib.
    - Current market capitalization, fully diluted share count, and preference overhang after the HKEX listing.
    - A current, company-wide customer count plus retention metrics such as renewals and NRR.
    - A current headcount breakdown by region and function.
