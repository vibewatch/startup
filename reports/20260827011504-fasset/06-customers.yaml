callouts:
- calloutType: insight
  title: The customer base looks broad; the durable base is still unproven
  body: Fasset has enough public evidence to show real customers across retail, payout, investing, and enterprise surfaces. What it does not show is how many of those customers remain active, repeat, or economically valuable over time.
  claimRefs:
  - CU011
  - CU016
  - CU021
  - CU039
- calloutType: risk
  title: Support quality may be the hidden churn driver
  body: 'Multiple complaint surfaces raise the same themes: card activation friction, delayed withdrawals, frozen funds, and slow support. In a financial product, these are not cosmetic UX issues—they are direct threats to repeat trust and word-of-mouth growth.'
  claimRefs:
  - CU024
  - CU025
  - CU026
  - CU028
