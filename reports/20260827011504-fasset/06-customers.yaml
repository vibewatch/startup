- id: expansion-loops-and-concentration-risk
  title: Expansion loops, concentration risk, and durability verdict
  body: 'Fasset’s best expansion logic is product adjacency. A user who begins with cross-border receipt can expand into holding USD, spending through the card, buying tokenized assets, or using local payout rails. A small business can start with receiving or treasury workflows and later add contractor payout, OTC conversion, or embedded API products. The named partner proofs also suggest channel-led expansion: halal-investing partners can feed investing customers, while remittance and payout partners can deepen corridor activity. That product ladder is strategically attractive because it creates multiple chances to grow ARPU without reacquiring a new customer from scratch.


    The durability gap is concentration visibility. Public sources do not reveal top-customer exposure, corridor concentration, enterprise renewal rates, or what share of wallets are active and funded. The enterprise count could represent a healthy recurring-revenue base or a very shallow long tail. Likewise, a large wallet count could hide low activation or high dormant rates. Support friction raises a second durability concern: customer acquisition can look strong while repeat trust remains weak. The customer verdict is therefore similar to the company-wide verdict: promising scale and multi-surface expansion logic, but too little public evidence on retention and concentration to underwrite durability confidently.'
  claimRefs:
