company:
  name: Fasset
chapter:
  number: 4
  title: Financials
  summary: Fasset’s public financial story is stronger on payment-flow scale and monetization surfaces than on audited financial disclosure. The company has many plausible revenue lines—FX spread, transfer and payout fees, card issuance, OTC spread, enterprise settlement and API fees, and asset-investing monetization—and by August 2026 it claimed over $40 billion of annualized transaction volume, more than 3 million wallets, 1,000 enterprises, and more than twelve consecutive months of profitability in at least one secondary summary. But it does not publicly disclose net revenue, gross margin, burn, cash balance, take rate, or customer concentration, so the core underwriting problem is still evidence scarcity. The financial upside is meaningful if even low take rates on large corridor volume are durable; the core risk is that heavy compliance, liquidity, payout, and support costs consume more of the economics than the flow headline suggests.
sections:
- id: revenue-streams-and-monetization-surfaces
  title: Revenue streams and monetization surfaces
  body: 'Fasset presents more monetization surfaces than a simple wallet or exchange. The company can plausibly earn on FX conversion, transfer and payout fees, card issuance, OTC spread, treasury and enterprise settlement fees, and investment-product economics. Public pages support this mosaic even when they do not disclose complete take rates. The Fasset Card page discloses a 9.99 USDT issuance fee and zero promo per-transaction fee. Pakistan and ACH materials disclose a 0.35% FX fee on some non-USD flows and a 9.99 one-time USD IBAN issuance fee. OTC materials explicitly say pricing varies by trade size and asset. Fasset Pay markets 60%–80% lower costs and 99% shorter settlement times, implying an enterprise pricing envelope even if the actual contract structure is undisclosed. The likely revenue model is therefore usage-based and mixed: retail fees on specific rails plus negotiated B2B monetization layered over gross payment flow.


    The important caveat is recognition quality. Fasset’s reported transaction volume is gross flow, not revenue, and the public materials do not reveal what portion of pricing is passed through to liquidity providers, card networks, banks, custody vendors, or payout partners. A business can process very large payment volume and still generate thin contribution margins if most of the economics sit with counterparties. For that reason, the company’s revenue model is legible, but revenue quality is not yet verifiable from public evidence alone.'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
