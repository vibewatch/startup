callouts:
- calloutType: insight
  title: The business model is legible before it is auditable
  body: Fasset has enough public pricing fragments and workflow detail to show how it probably makes money. What is missing is not the outline of monetization but the board-grade numbers that reveal whether the company keeps enough of those economics after partners, support, and compliance costs.
  claimRefs:
  - CI001
  - CI008
  - CI017
  - CI034
- calloutType: risk
  title: Large flow can still mask thin or fragile economics
  body: The annualized volume headline is directionally valuable, but it can easily overstate financial quality if a large share of the economics sits with banks, liquidity providers, card programs, and payout partners or if customer support costs remain high.
  claimRefs:
  - CI011
  - CI018
  - CI021
  - CI038
