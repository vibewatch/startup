  - - Preferred entry discipline
    - Near the current round price or after disclosure improvement
    - Waiting for proof may be better than paying ahead of evidence.
  - - Upgrade trigger
    - Audited monetization and cap-table transparency
    - Would convert a plausible mark into a more underwritable value.
  - - Primary downside trigger
    - Support / regulation / concentration evidence disappoints
    - Could justify a discount back below the unicorn threshold.
  notes: 'This table is explicitly price-sensitive: it separates company quality from what current public evidence supports at the quoted mark.'
