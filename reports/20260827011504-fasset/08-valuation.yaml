  rows:
  - - Recommendation
    - research-more / track
    - Continue diligence, but do not pre-commit to paying a premium above the latest round without deeper proof.
  - - Valuation stance
    - fair at the round / stretched above it
    - The $1B mark is plausible; much higher pricing needs audited support.
  - - Confidence
    - medium
    - Direction of the story is clear; precision of fair value is not.
  - - Risk rating
    - high
    - Regulatory, operational, and disclosure risks all feed directly into valuation confidence.
