- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Regulatory-scope mismatch
    - Management cannot map core products and corridors to valid local permissions
    - Undermines the regulated-infrastructure premium embedded in the story
    - Pause or reprice the investment case
  - - Operational trust deterioration
    - Persistent payout, freeze, or support failures without clean SLA improvement
    - Damages customer durability and raises the discount rate
    - Apply downside case or avoid
  - - Concentration surprise
    - Top corridors, enterprise customers, or partners drive outsized volume share
    - Makes reported scale less durable than headline metrics suggest
    - Demand concentration discount
  - - Monetization shortfall
    - GMV-to-revenue or revenue-to-gross-profit bridge is materially weaker than implied
    - Breaks the economics behind the unicorn price
    - Reset valuation below round mark
  - - Capital-opacity persists
    - No credible burn, cash, reserve, or cap-table disclosure is provided
    - Blocks underwritten late-stage pricing
    - Stay at research-more / track
  - - Strategic-round fragility
    - SBI-led round does not translate into live corridor or enterprise traction
    - Turns strategic premium into one-off signaling rather than proof
    - Cut premium assumptions
  notes: These triggers convert qualitative concerns into concrete diligence thresholds.
