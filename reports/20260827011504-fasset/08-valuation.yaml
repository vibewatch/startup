- id: scenario-range-entry-discipline-and-downside
  title: Scenario range, entry discipline, and downside logic
  body: 'Because disclosure is incomplete, scenario analysis is more useful than false precision. The base case should sit only modestly around the current unicorn mark: roughly $0.90-1.15 billion. That assumes the 2026 growth story is substantially real, regulatory posture remains intact, and corridor or enterprise concentration does not prove worse than the current public record implies. In that case, the recent round is a usable anchor, but not a clear bargain.


    The bull case can justify roughly $1.25-1.60 billion, but only if Fasset turns product breadth into audited monetization proof: a believable take-rate bridge, stable support and settlement quality, deeper SBI or bank distribution conversion, and evidence that enterprise or corridor volume is not narrowly concentrated. The bear case sits closer to $0.55-0.85 billion if operational trust issues, regulatory-scope uncertainty, or capital-opacity concerns cause the current financing enthusiasm to fade. That downside is why entry discipline matters. Investors are not deciding whether Fasset is interesting; they are deciding whether the present price already discounts too much future proof.'
