  - - MNT-Halan
    - Private valuation, 2025-2026 reporting
    - ~US$1.0B-US$1.2B
    - Useful regional consumer-fintech unicorn reference near Fasset’s scale band.
    - Different product mix, heavier lending exposure, and Egypt-led economics.
  - - Rain
    - Private valuation, 2026 reporting
    - ~US$500M
    - Useful regulated regional crypto-brokerage comparator below Fasset’s mark.
    - Narrower product suite and less neobank breadth than Fasset.
  - - NymCard
    - Private valuation, 2025-2026 reporting
    - ~US$132M-US$198M
    - Infrastructure-style MENA fintech reference for lower-scale payment rails.
    - Earlier stage and more B2B-infrastructure focused.
  - - Tabby
    - Private valuations, 2025-2026
    - US$3.3B official round; ~US$4.5B secondary-share-sale reporting
    - Shows the high end of what MENA fintech leaders can command when growth and breadth are strong.
    - Consumer BNPL / shopping-app model differs materially from stablecoin corridors.
  - - Nu Holdings
    - Public market cap, Aug 2026
    - US$73.28B
    - Illustrates the size of the long-run digital-bank prize.
    - A public, audited Latin American bank is not a direct pricing formula for Fasset.
  - - Coinbase
    - Public market cap, Aug 2026
    - US$47.96B
    - Relevant for crypto-market sensitivity and regulated digital-asset exposure.
    - More trading-cycle exposure and far richer disclosure.
  - - PayPal
    - Public market cap, Aug 2026
    - US$52.87B
    - Relevant for payments-scale and investor expectations around reliability and margin.
    - Mature global incumbent with very different growth and risk profile.
  - - Robinhood
    - Public market cap, Aug 2026
    - US$97.58B
    - Useful for platform-multiple imagination around multi-product retail finance.
    - US retail brokerage economics and market structure differ sharply from Fasset.
  notes: The table is meant to bracket plausibility and discipline, not to imply that Fasset should mechanically trade at public-company multiples.
