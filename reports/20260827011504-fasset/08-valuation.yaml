- id: recommendation-and-final-diligence-conditions
  title: Recommendation and final diligence conditions
  body: 'The clean recommendation is research-more / track with medium confidence, high risk, and a stretched valuation stance above the current round price. The company appears more substantive than many crypto-adjacent startups because it combines regulatory surface area, real product breadth, and credible institutional backers. That supports continued diligence rather than dismissal. But the current valuation is not yet backed by enough public proof to justify an affirmative buy call. Too many price-critical variables remain opaque: revenue, take rate, gross margin, net revenue retention, corridor concentration, partner concentration, cash, burn, reserve policy, and the exact rights embedded in the late-stage cap table.


    That means the next diligence step has to be concrete. Investors should request audited FY2025 and trailing-2026 financials, GMV-to-revenue and revenue-to-gross-profit bridges, corridor-level concentration data, major partner economics, complaint and payout dashboards, regulator correspondence, and a fully diluted cap table with preferences. If that package validates the narrative, the company could deserve a buy case near or moderately above the current mark. If management cannot provide it, the right stance is not “the company is bad”; it is that the price is outrunning the evidence.'
