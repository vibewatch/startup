- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Audited financials
    - FY2025 and trailing-2026 audited P&L, balance sheet, cash flow
    - Needed to test whether $1B is cheap, fair, or stretched on actual economics.
    - CFO / finance room
  - - Monetization bridge
    - GMV-to-revenue, revenue-to-gross-profit, and by-product take rates
    - Shows whether reported volume translates into durable value creation.
    - Finance + product
  - - Concentration map
    - Volume, revenue, and gross-profit concentration by corridor, customer, and partner
    - Tests fragility of the network and quality of scale.
    - BizOps / finance
  - - Risk pack
    - Complaint resolution, payout success, freeze rates, fraud losses, and regulator correspondence
    - Risk-adjusted valuation depends on control quality, not just growth.
    - Risk / compliance / ops
  - - Cap table and terms
    - Fully diluted ownership, liquidation preferences, side letters, and investor rights
    - Late-stage price support depends on what security investors are actually buying.
    - Legal / investor relations
  - - Strategic proof
    - Documented SBI, bank, telecom, or enterprise integrations that are live, not just announced
    - Determines whether strategic premium should persist or compress.
    - Partnerships / GTM
  notes: If management cannot produce most of this pack quickly, the evidence quality does not justify a decisive buy recommendation.
