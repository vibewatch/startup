  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入来源与变现界面
        blocks:
          - type: paragraph
            body: >-
              Fasset 呈现的变现界面多于简单钱包或交易所。公司有可能从外汇兑换、转账和出款费、发卡、OTC 价差、资金管理和企业结算费，以及投资产品经济性中赚钱。公开页面支持这个拼图，哪怕没有披露完整抽佣率。Fasset
              Card 页面披露 9.99 USDT 发卡费和推广期单笔交易 0 费用。Pakistan 和 ACH 材料披露部分非 USD 资金流收 0.35% FX 费用，以及一次性 9.99 USD IBAN
              签发费。OTC 材料明确称定价随交易规模和资产而变。Fasset Pay 宣传成本降低 60%–80%、结算时间缩短
              99%，暗示存在企业定价区间，即便实际合同结构未披露。因此，可能的收入模式是基于使用量的混合模式：特定轨道上的零售费用，加上叠在总支付流上的协商式 B2B 变现。


              关键保留意见在于收入确认质量。Fasset
              报告的交易量是总资金流，不是收入；公开材料也没有说明定价中有多少会转给流动性提供方、卡网络、银行、托管供应商或出款伙伴。一家公司可以处理很大的支付量，但如果大部分经济性留在交易对手那里，贡献利润率仍可能很薄。因此，公司收入模式看得懂，但仅靠公开证据还无法验证收入质量。
