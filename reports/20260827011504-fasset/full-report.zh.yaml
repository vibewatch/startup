  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 按客户工作流定义产品
        blocks:
          - type: paragraph
            body: >-
              Fasset 首先是一个工作流产品，其次才是单一应用功能。消费者端，客户旅程从进入一个受监管账户开始；这个账户可以用 USD 账户、USDT/USDC、Visa
              支持的卡，以及代币化或经过筛选的投资产品来接收、持有、转移、消费和投资价值。企业端，工作流扩展到资金运营：专用账户、OTC 换汇、批量结算、本地出款、API 集成和报告。核心任务不是「交易
              crypto」，而是在同一操作界面里连接数字美元、受监管轨道、本地法币入口和合规投资。因此，消费者钱包、企业账户、OTC 交易台、银行卡、Fasset Pay 和 API
              应作为同一个金融操作系统的模块分析，而不是分开的产品。


              公开材料展示了很宽的模块图谱。消费者模块包括钱包余额、卡消费、代币化黄金和股票，以及经过伊斯兰教法筛选的资产入口。企业模块包括 OTC 执行、跨境结算、本地出入金、出款编排和 API 主导的集成。公司的 Own
              Network 概念把这些模块连成伙伴织网，连接银行、电信、支付服务商、托管和流动性。因此，本章核心产品结论是：Fasset 的差异化来自工作流集成和监管拼装，而不是单一狭窄 SKU。
