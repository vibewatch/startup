      - number: '6.3'
        title: 留存、复用、满意度与摩擦
        blocks:
          - type: paragraph
            body: >-
              公开留存能见度很弱，所以满意度和复用线索比平时更重要。正向信号是真实的。应用和 Trustpilot 评论里，有用户描述自己反复使用卡、美元账户或投资功能；也有人明确说把资金留在
              Fasset，或用应用买菜、点外卖、做个人投资。应用商店页面也强调近期性能和稳定性更新，说明公司在根据用户反馈迭代。评论证据不是队列数据，但至少显示，在一部分案例中，这个产品不只是被拿来做一次性投机。


              负向信号同样重要。Google Play 和 Trustpilot
              反复出现几类投诉：卡激活费、存取款延迟、支付失败、账户受限，以及客服响应慢或模板化。多条投诉特别提到，资金已经扣除，但客服处理拖了好几天。JustUseApp
              也把平台描述成资产覆盖广、兑换便利，这与公司叙事一致，却抵消不了运营层面的投诉。结果是，Fasset
              的客户面可能很宽，但信任和服务质量仍有明显脆弱性。在没有披露流失率或净留存率（NRR）的情况下，这些评论页面不是零散轶事，而是重要警示灯。
