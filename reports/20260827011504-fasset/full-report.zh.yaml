      - number: '1.2'
        title: 创始人、领导层与实体版图
        blocks:
          - type: paragraph
            body: >-
              创始人故事在 Fasset 的商业化叙事中异常关键。公开资料显示，Mohammad Raafi Hossain 曾任阿联酋总理办公室顾问，在 Berkeley 和 Harvard
              接受过经济学和可持续发展训练；独立人物资料和公司关联报道把这段政策背景与 Fasset 对金融普惠、汇款和新兴市场基础设施的关注连在一起。Daniel Ahmed 是联合创始人兼 COO，Forbes
              Middle East 另行把他描述为一名英国和阿联酋背景的运营者：他帮助 Fasset 在印尼启动业务，支持区域 Mastercard 卡合作，并在 2023 年末推动总部迁至阿联酋。


              公开材料还显示，Fasset 不是由单一国家壳承接业务，而是由多个法律实体运营。隐私政策和帮助中心材料列出迪拜的 Fasset FZE、马来西亚的 Fasset Labuan Limited、印尼的 PT
              Gerbang Aset Digital、一个土耳其实体、一个立陶宛实体，以及巴林的 Fasset Financial Services W.L.L. 这张实体图谱与 Fasset
              关于产品受到区域监管的说法一致，但董事会构成、投票控制权，以及迪拜、Labuan 和早期美国业务之间的确切切分仍未披露。2026 年 5 月仍有部分媒体把公司描述为总部在美国或由美国创始团队创办，而 2026 年
              8 月报道和公司最新事实都以迪拜为中心。最可能的解释是近期品牌或实体中心迁移，而非事实矛盾；但这仍是尽调项，因为司法辖区会影响牌照、税务和可执行性。
