      - number: '6.4'
        title: 扩张循环、集中度风险与耐久性判断
        blocks:
          - type: paragraph
            body: >-
              Fasset 最有说服力的扩张逻辑是产品相邻。用户先从跨境收款开始，之后可以扩展到持有美元、刷卡消费、购买代币化资产，或使用本地打款通道。小企业可以先用收款或资金管理流程，再叠加承包商付款、OTC 兑换或嵌入式
              API 产品。具名合作伙伴也显示了渠道驱动的扩张：清真投资伙伴能导入投资客户，汇款和打款伙伴能加深走廊活跃度。这条产品阶梯有战略吸引力，因为公司不必重新获客，也能多次拉升 ARPU。


              耐久性的缺口在于集中度不可见。公开资料没有披露头部客户敞口、走廊集中度、企业续约率，也没有说明有多少钱包真正活跃且有余额。超过 1,000
              家企业可能代表健康的经常性收入底座，也可能只是很浅的长尾。同样，大量钱包可能掩盖低激活率或高休眠率。客服摩擦带来第二个耐久性问题：获客看起来强，复用信任却可能弱。因此，客户侧结论与公司整体结论相似：规模和多触点扩张逻辑有吸引力，但留存和集中度的公开证据太少，尚不足以有把握地承销耐久性。
