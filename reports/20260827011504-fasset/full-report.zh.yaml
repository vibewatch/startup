        - 只有用户数、没有活跃度，会遮住变现潜力
        - 索取 MAU、入金用户、活跃企业和流失率
      - - 头部客户集中度
        - 高
        - 少数企业 logo 可能贡献不成比例的交易量
        - 索取按 GMV 和收入占比排名的前 20 大客户
      - - 客服成本和投诉经济性
        - 中
        - 客户摩擦成本会摧毁零售经济性
        - 按市场索取工单量、退款、欺诈损失和解决成本
    notes: 核心阻碍不是没有商业模式，而是缺少经审计或董事会级别的指标。
