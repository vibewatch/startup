      - number: '2.3'
        title: 买方细分与使用场景
        blocks:
          - type: paragraph
            body: >-
              买方细分很重要，因为 Fasset 向不同参与者销售不同形式的价值。消费者和海外侨民汇款人看重更便宜的汇款、更快到账，以及能抵御本币贬值的数字 USD 或稳定币余额。自由职业者和远程工作者看重具名 USD
              账户、面向美国和欧洲客户的更低收款摩擦，以及等汇率有利时再换汇的能力。中小企业和成长型公司拿到的是更偏运营的产品：多币种账户、承包商薪资、资金配置、OTC 换汇，以及带合规和对账支持的批量放款。平台和
              fintech 公司看到的 API 和 Fasset Pay 界面，则指向一笔基础设施销售——一次集成就增加收款、出款、外汇、稳定币轨道和代币化资产能力，买方无需从零搭牌照、托管或流动性关系。


              公开证据对使用场景匹配的指向在各来源之间一致。Pakistan 和 ACH 页面聚焦需要低成本美元收款和本地出款的自由职业者与家庭。企业页面瞄准支付全球团队、管理闲置资金的创始人。Payfuture 和
              Tazapay 独立指出，供应商发票、资金调拨、市场平台出款、采购和薪资是稳定币 ROI 最强的类别。这个组合说明 Fasset
              不是单一客群业务：它试图在同一走廊网络下统一零售获客、中小企业变现和平台基础设施。这可以放大 TAM，但也抬高商业化复杂度，并增加公司必须管好的监管界面数量。
