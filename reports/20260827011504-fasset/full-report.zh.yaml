      - number: '2.2'
        title: 机会规模：TAM、SAM 和 SOM 视角
        blocks:
          - type: paragraph
            body: >-
              最宽的市场口径来自 FXC Intelligence，其预测 2025 年全球批发和零售跨境支付市场为 $208 trillion。这个数字能方向性展示跨境价值流规模，但单靠它无法支撑风险投资承销，因为其中包含
              Fasset 并不直接变现的银行间、批发、银行卡和零售类别。下一层口径更相关：Tazapay 估计稳定币跨境支付的总可用市场（TAM）为 $16.5
              trillion，并认为潜力最高的走廊流向新兴市场、或在新兴市场之间流动，那里传统银行摩擦最重。Goldman 和 Brookings 进一步强化了定性判断：全球稳定币供应约 $290 billion，其中约
              66% 被新兴市场持有，全球汇款量已增至约 $892 billion。


              由此往下，Fasset 的可服务市场还要更窄。产品组合最清晰地贴合的是服务不足跨境资金流中的零售 / 中小企业 / 市场平台切片：汇款、自由职业收入、贸易付款、资金结算，以及无法可靠获得 USD
              银行账户用户的价值储存。一个合理的自下而上框架是：全球跨境资金流（TAM）→ 稳定币可覆盖资金流（SAM-lite）→ 新兴市场中合规的出入金走廊，用户需要 USD 账户、本地出款和受监管资产入口（Fasset
              SAM）→ Fasset 当前超过 $40 billion 的年化交易量足迹（SOM
              证据）。可变现收入池的精确规模仍不确定，因为公开来源给的是总资金流指标，而不是抽佣率或净收入；但市场显然足够大，关键问题不是自上而下需求是否充足，而是执行和监管耐久性。
