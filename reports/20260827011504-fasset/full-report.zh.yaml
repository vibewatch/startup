      - number: '4.3'
        title: 成本结构、营运资本与资本充足性
        blocks:
          - type: paragraph
            body: >-
              公开材料强烈暗示 Fasset 的成本堆栈很复杂。多司法辖区模型需要牌照、合规人员、KYC 和制裁工具、客户支持、资金运营、银行关系、流动性提供方、卡项目支持、托管和企业实施。Fasset FZE 文件指向
              Fireblocks MPC 托管和正式虚拟资产筛查标准，订单执行政策和监管页面则暗示 VARA 规则下持续的
              best-execution、监控和审计义务。这些控制提高信任和企业就绪度，也抬高固定运营成本。营运资本需求也真实存在。任何承诺在多条走廊中提供本地出款、OTC
              换汇或即时结算的平台，都必须在链条某处维持流动性、伙伴余额或预融资安排，即便面向客户的体验隐藏了这种复杂性。


              因此，资本充足性是关键未解问题。公司 2026 年 5 月宣布 $51 million Series B，8 月又以 $1 billion 估值完成 $68 million Series C，使 2026
              年融资总额达到 $119 million，累计融资超过 $150
              million。这应当提供真实运营现金跑道，尤其在盈利说法准确的情况下。但没有公开来源披露账上现金、月度烧钱速度、走廊级盈利能力或信用暴露。最稳妥的判断是，Fasset
              改善了资本可得性，并且可能已降低短期现金跑道风险；但投资人仍无法从公开证据承销流动性、烧钱速度或准备金充足性。
