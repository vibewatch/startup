      - number: '4.2'
        title: 公开牵引、定价信号与单位经济代理指标
        blocks:
          - type: paragraph
            body: >-
              最好的公开牵引信号是规模代理指标，而不是会计结果。2026 年 5 月，Fasset 称年化交易量超过 $32 billion，钱包超过 2 million 个，中小企业客户超过 1,000 家；到 2026 年
              8 月，这变成超过 $40 billion、超过 3 million 个钱包和超过 1,000 家企业。Seedtable 对 2026 年 8
              月报道的综合增加了一个尤其重要、但仍只算中等可靠的信号：据报道有人评论称，过去一年收入大约增长 6 倍，公司已连续 12 个月盈利。如果属实，融资解读会显著改变，因为一家盈利公司筹集战略 Series
              C，与一个烧钱增长故事不同。但该说法没有通过监管文件或经审计报表独立佐证，因此应视为有希望，而不是已证明。


              因此，单位经济推断必须从可观察的定价和工作流设计倒推。支付改走稳定币路线，可以去掉部分代理行成本、压缩结算时间，从而支撑毛利率潜力。但 KYC 和 AML
              运营、本地出款伙伴、托管、卡项目成本、客户支持，以及多走廊资金运营会抵消部分利润率。如果企业结算量有意义且支持成本受控，可能经济性好过传统低利润汇款应用；但如果多数资金流是低价值零售活动，实际经济性也可能弱于表面
              GMV。投资人因此应围绕抽佣率、毛利率和支持负担建宽区间模型，而不是只锚定资金流数字。
