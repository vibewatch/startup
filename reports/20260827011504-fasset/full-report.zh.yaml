      - number: '1.3'
        title: 融资、规模与监管状态
        blocks:
          - type: paragraph
            body: >-
              Fasset 披露的资本形成在 2026 年明显提速。公司 2026 年 5 月宣布完成 $51 million Series B，SBI Group、Arz
              Portfoy、Investcorp、Speedinvest 和家族办公室参投；8 月又完成由 SBI Group 领投、估值 $1 billion 的 $68 million Series C。Series C
              公告称，2026 年融资总额已达到 $119 million，累计融资超过 $150 million。更早的独立资料，包括 Forbes Middle East 2024 年榜单条目，只提到已融资 $26.7
              million、用户超过 100,000 人，这为观察 2024 年末以来资本和产品扩张速度提供了有用基线。


              运营规模数字很强，但仍主要来自公司口径。2026 年 5 月 Fasset 称年化交易量超过 $32 billion，覆盖 125 个国家的 2 million 多个钱包，并服务 1,000 多家中小企业客户；到
              2026 年 8 月，这变成超过 $40 billion、超过 3 million 个钱包，以及超过 1,000 家企业。监管状态更可验证。公司帮助中心披露称，Fasset 在完成临时、准备和运营阶段后，于
              2023 年 11 月获得 Dubai VARA 的全市场产品牌照；公开登记册和第三方 UAE 评测材料确认 Fasset FZE 持有经纪交易商服务牌照，牌照号 VL/23/07/002。公司材料还提到
              LFSA Malaysia、CBB Bahrain，以及 Indonesia、Pakistan、Türkiye 和 EU 的批准。
