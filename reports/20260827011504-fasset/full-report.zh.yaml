      - number: '1.4'
        title: 当前优势与待解尽调问题
        blocks:
          - type: paragraph
            body: >-
              公司概况章节里最强的战略信号，是 Fasset 试图在面向新兴市场的同一个受监管伞架下，把消费者新银行
              UX、企业支付轨道和代币化投资合在一起。产品宽度超过一款走廊汇款应用，运营落地也比纯代币市场更扎实。公司似乎也在投机构级控制，而不只是拉消费者增长：Fasset FZE
              披露的虚拟资产标准会筛查流动性、制裁、协议安全和发行方背景；文件页面称托管保护依赖 Fireblocks MPC 和硬件隔离；订单执行政策则显示，在 VARA 规则下采用 matched-principal
              路由、best-execution 义务和披露的全包定价逻辑。


              主要尽调缺口是：公开披露恰好在投资人最需要承销信心的地方很薄。没有公开董事会名单，没有股权结构表细节，没有当前员工数，没有实际收入披露，也没有独立验证的企业留存指标。用户情绪来源也显示真实摩擦。Trustpilot
              评论提到冻结账户、支持响应慢和卡支付争议；Google Play 评论抱怨卡激活费、提现受限和 KYC
              摩擦。这些反向信号不能否定产品市场匹配，但确实说明运营成熟度可能落后于公司的增长叙事。后续章节的优先级，是检验 Fasset
              所称的基础设施优势和走廊规模能否转化为耐久客户、健康经济性和具备投资价值的风险调整后估值。
