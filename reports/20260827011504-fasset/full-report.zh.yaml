      - number: '8.4'
        title: 建议与最终尽调条件
        blocks:
          - type: paragraph
            body: >-
              最清晰的建议是继续研究 / 观察：中等置信度、高风险，且相对当前轮次价格，估值立场偏高。相比许多加密相邻创业公司，Fasset
              看起来更有实体分量，因为它同时具备监管覆盖、真实产品宽度和可信机构背书。因此应继续尽调，而不是直接否定。但当前估值还没有足够公开证据支撑明确买入判断。太多价格关键变量仍不透明：收入、抽佣率、毛利率、净留存率、走廊集中度、伙伴集中度、现金、烧钱速度、准备金政策，以及后期股权结构表里嵌入的具体权利。


              下一步尽调必须具体。投资者应索要经审计的 FY2025 和过去 2026 年财务数据、GMV
              到收入和收入到毛利的桥接、走廊级集中度数据、主要伙伴经济条款、投诉和打款看板、监管往来，以及带优先权的完全稀释股权结构表。如果这套材料验证叙事，公司或许配得上接近或适度高于当前价格的买入案例。如果管理层拿不出来，正确立场不是「公司很差」，而是「价格跑在证据前面」。
