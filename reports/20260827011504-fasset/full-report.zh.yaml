    columns:
      - 可比对象
      - 状态 / 日期
      - 估值或市值锚点
      - 参考意义
      - 局限
    enumerationScope:
      coverage: partial
      basis: >-
        Combines the most decision-useful regional private-fintech references and broad public fintech/crypto platforms
        available as of 2026-08-27, rather than every possible exchange, remittance, or neobank comp.
    rows:
      - - Fasset 当前轮次
        - 私募轮次，Aug 2026
        - US$1.0B 估值
        - 被评估资产的当前定价锚。
        - 未披露公开收入、利润率或股权结构表分母。
      - - MNT-Halan
        - 私募估值，2025-2026 报道
        - ~US$1.0B-US$1.2B
        - 在 Fasset 规模带附近，可作为区域消费金融科技独角兽参照。
        - 产品组合不同，信贷敞口更重，经济性由埃及主导。
      - - Rain
        - 私募估值，2026 报道
        - ~US$500M
        - Fasset 估值标记下方，可作为区域受监管加密资产经纪可比对象。
        - 产品套件更窄，新银行广度弱于 Fasset。
      - - NymCard
        - 私募估值，2025-2026 报道
        - ~US$132M-US$198M
        - 较低规模支付通道的基础设施型 MENA 金融科技参照。
        - 阶段更早，也更偏 B2B 基础设施。
      - - Tabby
        - 私募估值，2025-2026
        - US$3.3B 官方轮次；~US$4.5B 老股交易报道
        - 显示增长和业务广度强时，MENA 金融科技龙头能拿到的高端区间。
        - 消费 BNPL / 购物 App 模式与稳定币走廊差异很大。
      - - Nu Holdings
        - 公开市场市值，Aug 2026
        - US$73.28B
        - 展示长期数字银行机会的体量。
        - 一家公开上市、经审计的拉美银行，不能直接变成 Fasset 的定价公式。
      - - Coinbase
        - 公开市场市值，Aug 2026
        - US$47.96B
        - 可参照加密市场敏感性和受监管数字资产敞口。
        - 交易周期敞口更高，披露也丰富得多。
      - - PayPal
        - 公开市场市值，Aug 2026
        - US$52.87B
        - 可参照支付规模，以及投资人对可靠性和利润率的预期。
        - 成熟全球在位者，增长和风险画像差异很大。
      - - Robinhood
        - 公开市场市值，Aug 2026
        - US$97.58B
        - 对多产品零售金融平台倍数想象有参考意义。
        - 美国零售券商经济性和市场结构与 Fasset 差异很大。
    notes: 这张表用于框定合理性和纪律，不表示 Fasset 应机械套用上市公司倍数。
    claimRefs:
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
      - CV016
      - CV017
      - CV018
      - CV019
      - CV020
      - CV021
  - id: TV005
    title: 投资逻辑破裂与否决触发项表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 监管范围不匹配
        - 管理层无法把核心产品和走廊映射到有效本地许可
        - 削弱叙事中嵌入的受监管基础设施溢价
        - 暂停或重新定价投资案例
      - - 运营信任恶化
        - 出款、冻结或客服故障持续存在，且 SLA 没有明确改善
        - 损害客户留存韧性并抬高折现率
        - 采用下行情景或回避
      - - 集中度意外
        - 头部走廊、企业客户或合作伙伴贡献过高交易量占比
        - 让披露规模不如表面指标看上去那么耐打
        - 需求集中度折价
      - - 变现短板
        - GMV 到收入、收入到毛利的转化链条明显弱于隐含假设
        - 打断支撑独角兽价格的经济账
        - 估值下调至本轮标记以下
      - - 资本透明度仍不足
        - 拿不出可信的烧钱速度、现金、准备金或股权结构披露
        - 阻断可承销的后期定价
        - 维持继续研究 / 观察
      - - 战略轮脆弱性
        - SBI 领投轮没有转化为已上线通道或企业端牵引力
        - 战略溢价变成一次性信号，而不是验证
        - 下调溢价假设
    notes: 这些触发项把定性担忧转成具体尽调阈值。
    claimRefs:
      - CV024
      - CV029
      - CV031
      - CV033
      - CV034
      - CV035
      - CV036
      - CV037
      - CV038
      - CV039
  - id: TV006
    title: 最终尽调索要清单
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人或尽调路径
    rows:
      - - 经审计财务报表
        - FY2025 和 2026 年滚动期经审计损益表、资产负债表、现金流量表
        - 需要用它检验：按真实经济账，$1B 是便宜、合理还是偏高。
        - CFO / 财务资料室
      - - 变现桥
        - GMV 到收入、收入到毛利，以及分产品抽成率
        - 看披露交易量能否转成可持续价值创造。
        - 财务 + 产品
      - - 集中度地图
        - 按通道、客户和合作伙伴拆分的交易量、收入和毛利集中度
        - 检验网络脆弱性和规模质量。
        - 业务运营 / 财务
      - - 风险资料包
        - 投诉解决、出款成功率、冻结率、欺诈损失和监管往来函件
        - 风险调整后估值看控制质量，不只看增长。
        - 风险 / 合规 / 运营
      - - 股权结构表和条款
        - 完全稀释后持股、清算优先权、附函和投资人权利
        - 后期价格能否撑住，取决于投资人实际买到的证券权益。
        - 法务 / 投资者关系
      - - 战略验证
        - 有文件支撑且已经上线的 SBI、银行、电信或企业集成，不能只是公告
        - 决定战略溢价该保留还是压缩。
        - 合作伙伴 / GTM
    notes: 如果管理层无法快速交出这套资料的大部分，证据质量不足以支撑明确买入建议。
    claimRefs:
      - CV004
      - CV008
      - CV025
      - CV026
      - CV031
      - CV037
      - CV038
      - CV039
      - CV040
      - CV041
      - CV042
