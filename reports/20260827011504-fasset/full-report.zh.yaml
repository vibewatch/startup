      - number: '4.4'
        title: 收入质量、利润率路径与阻碍项的财务结论
        blocks:
          - type: paragraph
            body: >-
              公开财务案例足以支持继续尽调，但不足以支撑承销信心。公司有多个真实变现界面，有可信证据显示资金流很大，并且至少有一个强二级信号提示公司可能已经盈利。这些信号好过许多同龄
              fintech。相比纯交易所同行，该业务似乎也更适合变现企业资金流、资金运营和嵌入式出款基础设施，经济性可能优于一次性零售交易量。


              同时，本章的阻碍项很根本。没有经审计收入披露，没有抽佣率历史，没有毛利率序列，没有烧钱速度或现金跑道数字，没有备抵或损失历史，没有头部客户集中度，也没有零售与企业经济性的分段。公开评论界面还显示客户摩擦风险，可能抬高支持成本或流失。正确结论是：资金流和变现架构有吸引力，但财务质量证据不足。决定投资前，管理层应提供按细分和走廊拆分的月度
              GMV、按产品拆分的净收入、按轨道拆分的毛利率、烧钱速度和现金跑道、现金余额，以及前 20 大客户集中度。
