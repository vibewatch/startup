      - number: '7.2'
        title: 运营、质量与安全风险
        blocks:
          - type: paragraph
            body: >-
              运营可靠性是公开资料里最清晰的反向信号。Trustpilot 和 Google Play
              反复出现投诉：资金冻结、提现延迟、卡激活或认证失败、入金没有按时到账、客服响应慢。金融科技产品里，这类问题不是表面烦恼；如果长期不解决，它们会直接威胁留存、声誉，甚至引来监管关注。条款和政策部分解释了摩擦来源：公司需要交易监控、制裁筛查、账户限制和跨司法辖区合规闸门。控制本身必不可少，但如果误报太多或人工审核太重，就会形成客服负担，客户感知到的就是不可靠。


              安全和控制信号好坏并存。Fasset FZE 文件、订单执行政策、隐私政策和托管表述，暗示公司有正式控制层、Fireblocks MPC
              和机构级防护。但公开记录仍缺少硬性的可靠性指标、事故历史或泄露披露。也就是说，投资者能看到控制类别，却看不到控制质量的实测结果。运营风险因此来自产品复杂度和证据不透明的叠加：伙伴很多、走廊很多、检查很多，但公开数据很少说明这台机器在真实运行中多常失灵。
