      - number: '7.3'
        title: 伙伴、人员与执行风险
        blocks:
          - type: paragraph
            body: >-
              Fasset 的模式天生重伙伴。托管依赖 Fireblocks 等外部供应商，卡栈依赖 Visa 和发卡方关系，法币打款依赖银行和本地通道，结算质量依赖流动性提供方和 OTC 对手方，分销也会受到 SBI
              Remit、Musaffa、Tether
              或其他生态节点的实质影响。相比全部自建，这能更快做出触达和产品宽度，也带来脆弱性。一旦关键银行关闭通道、流动性提供方拉宽点差、发卡方修改条款，或监管方收窄产品范围，用户体验会很快变差。


              人员风险叠在其上。创始人叙事在融资和定位中仍异常核心，而创始人以下的公开治理深度偏薄。公司要跨多个司法辖区、产品模块和合规界面增长，法务、资金、客服和工程都需要足够厚的运营梯队。招聘信息和扩张说法显示公司在动作，但不能证明它已经搭出足够的中层管理，能在规模化时吸收错误。因此，执行风险不只是「能不能增长」，而是「能不能在增长时不从运营或监管层面打断支撑这组产品的信任闭环」。
