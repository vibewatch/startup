  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接同行、既有玩家与替代品
        blocks:
          - type: paragraph
            body: >-
              Fasset 面对的不是一个干净的同业集合。它与企业稳定币基础设施玩家、区域加密货币交易所和钱包、汇款和出款钱包、多币种消费者 fintech 应用，甚至银行内部主导的资金工作流都有重叠。最接近的直接战略同行是
              Rain，后者把自己定位为企业级稳定币支付基础设施，覆盖发卡、钱包、出款和监管对齐。区域重叠来自 BitOasis 和 Pyypl：BitOasis 是受监管的 MENA
              加密货币交易所，在数字资产零售和机构端有可信度；Pyypl 是面向银行服务不足用户的钱包和支付平台，拥有大规模移动分发和企业基础设施雄心。Hubpay 从 MENAP 汇款角度切入走廊钱包层。Baraka
              在支付上竞争较少，但会争夺来自海湾、希望用移动端投资全球市场的富裕用户或重视伊斯兰教法合规的用户。


              替代集合更宽。Wise 和 Revolut 并不把自己营销成稳定币新银行，但它们设定了透明外汇、账户易用性和主流消费者信任的基准。很多用户眼里的「竞争对手」根本不是另一个加密原生产品，而是银行账户加
              Wise，或通过既有银行轨道打款的资金团队，或一次搭一个本地出款集成的公司。这一点重要，因为 Fasset
              卖的是融合：一个账户、多条走廊、稳定币、卡、OTC、投资和企业工具。如果集成成本真实存在，融合可以形成护城河；如果买方更偏好各层的最佳单点工具，融合也可能变成负担。
