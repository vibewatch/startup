chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、定位与产品范围
        blocks:
          - type: paragraph
            body: >-
              Fasset 目前把自己定位为一家总部位于迪拜、AI 驱动的稳定币新银行平台。个人、企业和机构可以用一个账户跨币种、市场和资产类别收款、持有、转移、消费和投资。消费者端覆盖全球 USD 账户、USDC/USDT
              存款、Visa 支持的卡，以及加密货币、代币化黄金、股票、基金和大宗商品入口。企业端叠加多币种账户、公司卡、承包商薪资、OTC 结算，以及 API 驱动的资金管理和支付基础设施。Fasset
              在官网上反复把这套产品定义为免息、符合伊斯兰教法的金融入口，而不是纯加密货币交易所；相较 Rain、BitOasis 等区域交易所，这是一个重要定位差异。


              产品组合底层是 Own Network。2026 年 8 月材料把它描述为受监管金融基础设施，连接银行、电信运营商、支付机构、流动性提供方、托管伙伴和结算网络，覆盖 100 多条银行走廊。更早的 2026 年 5
              月材料称覆盖 50 多条走廊，意味着同一年内扩张速度很快。Fasset Pay 和 API 页面清楚展示了目标运营模式：开发者接入一个 API，Fasset
              在幕后提供牌照、合规、流动性、托管和银行轨道。这个叙事支持一个判断：Fasset 想掌握结算和编排层，而不只是做钱包 UX。
