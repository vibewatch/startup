      - number: '7.4'
        title: 财务 / 模型风险与缓释视角
        blocks:
          - type: paragraph
            body: >-
              财务模型风险格外难打分，因为公开证据既有吸引力，又不完整。正面看，Fasset
              声称有很大的年化支付流水、相当宽的客户覆盖，以及强劲的新融资。另有一个二级信号显示，公司可能已经连续十二个月盈利。负面看，公开资料看不到烧钱速度、走廊级利润率、准备金充足性、欺诈损失率或头部客户集中度。这意味着几类风险互相缠在一起：如果客服或打款摩擦高，可变成本可能比预期更差；如果企业交易量集中在少数渠道，收入耐久性可能被高估；如果监管收紧，公司可能面对昂贵整改或更慢的上线节奏。


              从实际缓释看，局面是好坏参半，不是纯粹悲观。Fasset
              看起来确实搭了法律和政策脚手架，拿到真实牌照，并围绕托管、投诉、制裁和执行列出了控制措施。上述基础降低了彻底失序的概率。但走廊特定、伙伴特定或客服驱动的客户体验断裂，仍可能发生。因此，投资者应把风险监控视为投资逻辑的核心。正确尽调动作不是自动离场，而是索要可衡量指标：投诉解决时间、打款成功率、监管往来记录、按走廊和客户划分的集中度、流动性备援方案，以及应对运营意外的资本缓冲。
