        - 高
        - 没有它，支付资金流规模无法转成经济质量判断
        - 索取过去 24 个月按产品线拆分的月度净收入
      - - 按轨道 / 走廊拆分的毛利率
        - 高
        - 走廊经济性决定规模是在创造杠杆，还是在烧钱
        - 索取扣除流动性、出款、托管和客服成本后的毛利率
      - - 现金余额和现金跑道
        - 高
        - 直接关系到融资风险和下行保护
        - 索取当前不受限现金、受限现金和现金跑道情景模型
      - - 活跃用户和企业活动分母
