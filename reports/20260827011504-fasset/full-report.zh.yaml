  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              应把 Fasset
              作为跨境金融入口公司分析，而不是泛泛的新银行。它试图解决的工作结合了新兴市场格外尖锐的三类痛点：接收并持有硬通货价值、绕开多日代理行摩擦跨境转移资金，以及把这些资金转化为本地消费或投资能力。因此，这个市场包括跨币种和司法辖区边界的零售汇款、自由职业者和创作者收款、中小企业供应商付款、资金调拨、市场平台出款，以及代币化投资资金流。国内吸收存款、传统消费贷款和纯现货加密货币投机不应作为主要需求驱动。


              现状仍是 SWIFT 与代理行体系，再叠加汇款机构、移动钱包、数字银行和卡网络。Fasset 自己的解释页与独立市场描述一致：SWIFT 是一个由 200 多个国家超过 11,000
              家机构使用的报文网络，但资金仍要经中介银行流转，带来隐藏费用、外汇加价、合规延误和低可见性。小额汇款人和新兴市场中小企业的实际替代品，是 Wise 这类透明外汇应用、Revolut 式多币种账户、Pyypl
              等区域钱包服务商，以及以 cash-out 为核心的汇款服务。Fasset 的差异化主张是：稳定币加本地轨道，可以把链条压缩成更简单、更快、更可编程的结算模式。
