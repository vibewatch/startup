      - number: '8.2'
        title: 可比公司组与估值纪律
        blocks:
          - type: paragraph
            body: >-
              区域内未上市可比公司让 Fasset 的估值方向上说得通。Tabby 2025 年官方轮次估值 $3.3 billion，随后 2026 年二级股份出售报道约 $4.5
              billion，说明中东和北非投资人愿意为有规模、有产品宽度、有增长的金融科技平台支付数十亿美元估值。Fintech News 和 FurtherArabia 还把 MNT-Halan 放在约 $1.0-1.2
              billion，Rain 约 $500 million，NymCard 在数亿美元低段。放在这个区域阶梯里，Fasset 的 $1 billion
              轮次不显得荒唐；它更像一个合理的低位独角兽价格，故事是受监管、跨境基础设施，但阶段更早、披露少于区域最大赢家。


              上市公司估值纪律则把结论往另一边拉。Nu、Coinbase、PayPal 和 Robinhood 的市值都比 Fasset
              的私募估值高出数百亿美元，但它们有更丰富的披露、流动市场检验和更清楚的经济模型。这些公司不能直接套成 Fasset
              的估值公式；真正用途是提醒投资者，后期金融科技价值既靠野心，也靠透明度挣来。相比更小的私有加密券商同业，Fasset 的市场叙事或许值得溢价关注；但缺少经审计收入或利润率数据，上市可比迁移必须保守。
