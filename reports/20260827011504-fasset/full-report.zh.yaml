  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 按买方、用户、付款方和使用场景划分客户
        blocks:
          - type: paragraph
            body: >-
              Fasset
              的客户版图明显跨多个细分人群。零售用户最显眼：应用、卡、评论和教育页面都直接面向个人，他们接收、持有、消费并投资数字美元余额。零售端至少有三类用例：自由职业者和远程工作者收取跨境收入；汇款发送方或接收方跨境转移资金；注重伊斯兰教法合规的储蓄者或投资者，把钱包、卡和投资功能当作更完整的金融入口。产品材料还指向中小企业和早期企业，它们需要多币种账户、承包商付款或资金管理灵活性。最后，公司通过
              Fasset Pay 和 API 面向企业、金融科技公司和平台销售基础设施，并称拥有超过 1,000 家企业客户。


              购买方、用户和付款方需要拆开看。零售场景里，三者通常是同一个人。中小企业里，购买方可能是创始人或财务负责人，终端用户则包括承包商或财务人员。企业和 API
              用例中，买单的往往是产品、支付或资金团队，真正收款的是下游客户、卖家或员工。这样的组合能放大总可用市场（TAM），也能带来扩张机会；但不同细分市场的获客和支持成本大概率差异很大。公开证据足以画出客户分层，却不足以测算各层的收入贡献。
