  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值锚点与独角兽标记的真实含义
        blocks:
          - type: paragraph
            body: >-
              Fasset 目前的估值锚点，标题层面异常清楚，底层信息却异常不完整。标题事实是：SBI Group 在 2026 年 8 月领投 $68 million Series C 轮，估值 $1 billion；此前
              5 月公司完成 $51 million Series B 轮。多个来源都指向这些事实，管理层也把本轮融资与 Own Network 扩张、AI
              驱动的银行编排、更广泛的稳定币支付基础设施挂钩。狭义上，独角兽标签是真实的：成熟投资人最近确实按这个价给公司定价。


              问题在于，融资价格不等于被完整承销过的内在价值。公开证据仍没有披露投后股权结构表、支撑定价的收入分母、利润率结构、亏损画像，也没有给出钱包与企业交易量的队列质量视角。即便最常被引用的经营数据——300
              万个钱包、1,000 多家企业、超过 $40 billion 年化交易量——仍是公司说法，不是经审计披露。因此，正确读法不是二元判断，而是价格敏感：本轮融资让 $1 billion
              估值变得可信，但在缺少更深入尽调包时，还不能证明新投资者应在这个价格之上支付大幅溢价。
