          label: 存在真实融资锚点
          detail: SBI 领投 2026 年新一轮 $68M 融资，估值标记为 $1B。
        - id: n2
          label: 规模叙事可能很大
          detail: 钱包、企业客户、走廊和交易量说法若获验证，将指向真实触达。
        - id: n3
          label: 披露缺口仍然很大
          detail: 经审计的收入、利润率、现金或股权结构资料包均未公开。
        - id: n4
          label: 风险组合影响估值
          detail: 监管边界清晰度、合作伙伴依赖和运营信任仍然权重很高。
        - id: n5
          label: 高于本轮的溢价需要证据
