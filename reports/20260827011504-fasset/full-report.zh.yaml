      - number: '5.3'
        title: 信任、安全、合规与质量控制
        blocks:
          - type: paragraph
            body: >-
              信任和合规在这里是核心产品功能，不是后台细节。公开来源反复强调：每项资产上架前都会审查，平台在具名牌照下运营，客户活动要经过受监管控制。帮助中心材料称，Fasset
              在多个司法辖区获得牌照或批准，产品出现在应用前会同时按监管和伊斯兰教法标准评估。Fasset FZE 文件和订单执行政策补充了更多运营细节：matched-principal
              执行、全包定价逻辑、路线选择、资产筛查，以及包括 Fireblocks MPC 和硬件隔离在内的托管措施。投诉处理和风险警示材料进一步说明，公司已把出问题时的服务和披露流程制度化。


              从软件角度看，质量控制披露仍不足。公开来源没有披露正常运行时间、延迟、事故率、结算失败率、工程人员数或发布质量指标。不过，这些材料披露了 Fasset
              认为重要的控制类别：制裁、合规、托管、投诉、伊斯兰教法监督和特定监管者运营许可。这足以支持一个判断：Fasset
              在运营上严肃，但不足以把产品视为技术风险已降低。尽调下一步应要求提供事件指标、变更管理流程、SDLC 细节、安全审计和支持 SLA。
