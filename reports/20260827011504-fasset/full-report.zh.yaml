  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              监管精度是最重要的风险类别，因为 Fasset 的整套产品叙事都建立在持牌、合规运营的信任上。公开记录支持公司确实取得了监管进展：VARA 牌照可见，帮助中心列出多个司法辖区，用户条款把
              AML/CTF、制裁、资格和暂停逻辑深嵌进客户关系。但同一套记录也说明，范围混淆很容易发生。公司把自己定位成全球数字银行和稳定币新银行，而可见的迪拜登记信息明确指向经纪交易商服务。这个差异不能证明不合规，却会制造解释风险：哪些产品在哪里受到监管？某项功能不可用或发生争议时，用户到底拥有哪些权利？


              法律文件还凸显了几类面向用户的风险：条款允许暂停或终止服务；用卡受到限制，并受 OFAC
              式制裁管控约束；公司可以按披露的修订机制调整未来费用或利息；争议解决由合同主导，并不总是偏向客户。风险披露明确提醒用户，加密资产波动大，并不适合所有人。隐私和用户协议材料显示，公司会在多个司法辖区与服务商和主管机关广泛共享数据。合在一起看，法律框架很厚，但也意味着监管、合同和司法辖区问题会直接传导到客户信任、走廊可用性和执法敞口。
