      - number: '5.2'
        title: 运营架构与关键依赖
        blocks:
          - type: paragraph
            body: >-
              可见架构是分层的，而不是深度代码披露的。前端界面包括移动应用、卡界面、企业账户、OTC 请求工作流，以及面向开发者的 API /
              文档界面。其后是编排层，处理入驻、账户入金、资产路由、出款发起和投资入口。最重要的运营层则出现在合规和资产控制堆栈中：KYB/KYC、制裁筛查、钱包筛查、资产上架前审查、托管控制、执行政策和监管特定许可。Fasset
              自己的 OTC、出入金和出款解释页展示了交易如何从法币入金到稳定币兑换，再到本地银行结算；文档和 Fasset FZE 材料则说明处理模型已经形式化，而不是临时拼凑的交易所式运营。


              这些能力依赖外部伙伴。Fasset FZE 文件明确提到 Fireblocks MPC 托管。Visa 支撑卡层。AED、Pakistan
              和其他走廊结算需要本地银行和出款轨道。大额执行和换汇质量取决于流动性提供方和 OTC 对手方。这里的开发者信号有价值：Fasset API 和文档界面说明，部分产品被设计成可嵌入第三方系统，这提高了稳定 API
              行为、集成支持和机器可读对账的价值。这是真实架构，但它既是生态架构，也是软件架构。
