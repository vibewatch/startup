- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / evidence
  - Diligence ask
  rows:
  - - Own Network corridor integration
    - Rain or other infra players replicate stablecoin rails with better enterprise distribution
    - High
    - Fasset claims 100+ corridors and 1,000+ enterprises; breadth is real if operationally integrated
    - What percentage of corridors are exclusive, direct, or volume-critical?
  - - Consumer + enterprise + investing bundle
    - Best-of-breed competitors win one layer each and force customer multi-homing
    - High
    - One-account workflow and local payout paths create convenience lock-in
    - What share of active customers use 2+ product modules?
  - - Regulatory assembly across markets
    - Rule changes narrow license scope or delay expansion
    - High
    - VARA and multi-jurisdiction disclosures give some credibility
    - Which licenses are mission-critical for top 10 corridors?
  - - Shariah-compliant framing
    - Mainstream competitors add screened investing or interest-free wrappers
    - Medium
    - Current combination of stablecoin banking and Shariah narrative is still uncommon
    - How much conversion comes specifically from faith-based product differentiation?
  - - OTC / treasury capabilities
    - Enterprise buyers prefer specialist infra vendors like Rain
    - Medium
    - OTC, Fasset Pay, and business pages show a credible B2B stack
    - How many of the 1,000+ enterprises are active recurring revenue accounts?
  - - Retail wallet distribution
    - Support issues or payout failures trigger fast switching
    - High
    - 3M+ wallets imply reach, but public reviews show friction
    - What is 90-day active retention and complaint resolution rate by corridor?
  notes: Fasset’s moat is bundle-and-operations heavy rather than IP heavy; the key diligence question is whether multi-product adoption is deep enough to offset specialist competitors.
