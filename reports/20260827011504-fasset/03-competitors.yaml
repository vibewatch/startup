callouts:
- calloutType: insight
  title: Fasset wins on bundle breadth, not on category singularity
  body: Few regional fintechs combine stablecoin banking, OTC, local payout, card spending, and halal-oriented investing in one surface. That makes Fasset unusually broad. But each sub-layer has specialists with stronger public proof, so the company must convert breadth into actual multi-product lock-in rather than assume breadth alone is enough.
  claimRefs:
  - CP011
  - CP015
  - CP026
  - CP039
- calloutType: risk
  title: The moat is operationally heavy and therefore fragile if support quality slips
  body: Bundle moats are only durable when the combined workflow feels meaningfully better than stitching together multiple tools. If payout failures, KYC friction, or weak support raise the perceived cost of staying, customers can multi-home with specialist providers and the moat weakens quickly.
  claimRefs:
  - CP028
  - CP030
  - CP037
  - CP038
