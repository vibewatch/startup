  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: multi-product-adoption
    missingEvidence: Public sources do not show what percentage of Fasset customers use multiple modules, which is critical to evaluating bundle lock-in.
    whyItMatters: If most users only use one surface, the bundle moat is much weaker than the marketing suggests.
    diligencePath: Request cohort data showing product penetration per customer and module attach rates for top retail and enterprise segments.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP004
  - type: private-evidence-only
    severity: material
    topic: enterprise-logos-and-revenue
    missingEvidence: Public sources do not identify active enterprise logos, contract values, or retention strong enough to prove B2B durability.
    whyItMatters: Competitive strength in enterprise payments depends on production customers, renewal behavior, and revenue concentration, not just partner announcements.
    diligencePath: Request active enterprise logo list, ARR by segment, renewal rate, and top-10 customer concentration.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP001
    - TP004
  - type: conflicting-data
    severity: minor
    topic: price-transparency-comparison
    missingEvidence: Public pricing transparency varies widely across competitors, making like-for-like effective cost comparison incomplete.
    whyItMatters: A pricing comparison can overstate or understate competitiveness when corridors, spreads, and in-app fees are not fully visible.
