  rows:
  - - Retail remittances and family support
    - Cross-border person-to-person transfers, migrant support, diaspora payouts
    - Domestic wallet top-ups and domestic bill pay
    - Workers abroad, diaspora households
    - Core fit where speed, FX leakage, and local cash-out matter
  - - Freelancer and creator earnings
    - Client payments, platform payouts, USD collection, contractor income
    - Domestic salary payroll
    - Freelancers, remote workers, creator platforms
    - Matches Fasset USD account, ACH, and local payout story
  - - SME and trade payments
    - Supplier invoices, contractor payroll, treasury transfers, trade settlement
    - Large-bank cash management and domestic AP only
    - Founders, finance teams, operations leads
    - Matches Fasset Business, OTC, treasury, and bulk settlement surfaces
  - - Platform and fintech infrastructure
    - Collections, payouts, FX, tokenized asset access, stablecoin settlement
    - On-prem bank core software, domestic-only acquiring
    - Fintech product teams, brokers, marketplaces
    - Matches API/Fasset Pay one-integration model
  - - Dollar-access and value-storage layer
    - Holding USD or stablecoins before conversion or spending
    - Pure speculative crypto trading
    - Consumers and SMEs in volatile-currency markets
    - Important because value storage is part of the product, not just transfer
  - - Tokenized-investment access
    - Funding and holding tokenized gold, stocks, ETFs, commodities
    - Traditional local brokerage accounts only
    - Retail investors and affluent users
    - Adjacency that lifts ARPU but is not the whole market
