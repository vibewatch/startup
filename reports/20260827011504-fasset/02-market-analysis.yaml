callouts:
- calloutType: insight
  title: The real market is not all payments; it is the pain-adjusted corridor subset
  body: A $208 trillion top-down TAM sounds impressive, but it is not the relevant underwriting number. Fasset matters in the slice where people and SMEs cannot get cheap, fast, compliant dollar access through legacy rails. That narrower market is still large enough to matter, but the corridor and payout details determine whether the company wins.
  claimRefs:
  - CM011
  - CM013
  - CM034
  - CM035
- calloutType: risk
  title: Stablecoin adoption solves one layer of friction while creating another
  body: Stablecoin rails can compress cost and settlement time, but they shift the hardest problem to regulation, off-ramp liquidity, AML controls, and local partner reliability. A provider that wins the “on-chain” story but fails the local conversion and compliance layer will not hold market share for long.
  claimRefs:
  - CM008
  - CM028
  - CM029
  - CM031
