companyProfile:
  summary: Fasset is a Dubai-headquartered stablecoin neobanking and digital-asset infrastructure company founded in 2019 that combines consumer accounts, cross-border transfers, cards, enterprise payout rails, and tokenized-investment access on top of a regulated corridor network aimed at emerging markets. Its strongest current public proof is the August 2026 SBI-led unicorn round, paired with large but still company-claimed scale metrics and a visibly expanding regulatory and partner footprint.
  foundedDate: '2019-01-01'
  founders:
    - name: Mohammad Raafi Hossain
      role: Co-founder and CEO
      background: Former adviser to the UAE Prime Minister's Office with public policy and ethical-finance background tied to Fasset's inclusion and remittance narrative.
      claimRefs: [CO001, CO011]
    - name: Daniel Ahmed
      role: Co-founder and COO
      background: Public profiles link him to AI and blockchain work connected to the UAE Prime Minister's Office before co-founding Fasset; Forbes Middle East later recognized him in its 30 Under 30 list.
      claimRefs: [CO001, CO012, CO013]
  foundingLocation: Los Angeles, United States
  headquarters: Dubai, United Arab Emirates
  productSummary: Fasset sells a multi-product financial stack spanning digital-dollar accounts, transfers, corridor payments, card spending, enterprise payout and API infrastructure, OTC settlement, and tokenized or Shariah-oriented investment access.
  customerFocus: Retail wallet users, freelancers and remote earners, remittance users, SMEs, and enterprise payout or treasury teams in emerging-market corridors.
  businessModel: Transaction, FX, spread, payments, card, treasury, custody, and investment-fee economics built on stablecoin settlement and regulated partner rails.
  stage: late-stage private / Series C
  fundingStatus: Fasset announced a $68 million SBI-led Series C at a $1 billion valuation in August 2026 after a $51 million Series B in May; company materials also said lifetime funding had surpassed $150 million.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO003, CO004, CO006, CO007, CO008, CO009, CO010, CO021, CU005, CU006, CV001]
