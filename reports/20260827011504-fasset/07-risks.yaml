callouts:
- calloutType: risk
  title: License precision is a thesis-level issue, not a footnote
  body: A regulated fintech can survive many product problems, but it is much harder to survive ambiguity about what exactly is licensed where. Fasset’s marketing breadth makes this a critical diligence item even though the underlying license progress appears real.
  claimRefs:
  - CR001
  - CR002
  - CR004
  - CR006
- calloutType: insight
  title: The most visible adverse evidence is operational, not strategic
  body: The strongest public negative signals are not that customers reject the product concept—they are that some users experience delays, freezes, and weak support. That makes operational execution the most urgent risk to monitor because it can turn a strong market story into a trust problem quickly.
  claimRefs:
  - CR012
  - CR013
  - CR014
  - CR017
