- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Support / payout reliability
    - Complaint resolution time
    - '>72 hours median for 2 consecutive months'
    - Freeze aggressive growth assumptions and demand ops remediation plan
  - - Regulatory-scope mismatch
    - Legal mapping gaps
    - Cannot map key products to valid local permissions
    - Treat valuation and go-to-market plan as impaired until resolved
  - - Partner concentration
    - Top corridor or partner dependency
    - Single partner or corridor drives outsized GMV / revenue share
    - Apply concentration discount and require fallback contracts
  - - Liquidity / settlement quality
    - Failed or materially delayed conversions
    - Repeated same-corridor settlement misses beyond policy SLA
    - Assume higher working-capital need and weaker customer durability
  - - Security / custody failure
    - Material incident or unexplained asset-access disruption
    - Any unresolved customer-asset incident or regulator notice
    - Pause investment process immediately
  - - Capital adequacy opacity
    - No cash / runway disclosure despite diligence request
    - Management cannot produce credible monthly cash and burn data
    - Shift to research-more / avoid stance
  notes: These kill criteria translate abstract fintech risk into monitorable investment gates.
