company:
  name: Fasset
chapter:
  number: 7
  title: Risks
  summary: Fasset’s risk profile is dominated by regulatory precision, partner dependence, operational reliability, and evidence gaps rather than by one obvious existential flaw. The company’s regulated positioning is a strength, but it also creates a high-stakes mismatch risk if broad “digital bank” marketing outruns the exact permissions of broker-dealer or local-license scopes. Operationally, public complaint surfaces repeatedly mention delayed support, frozen funds, and card or payout friction—dangerous failure modes in a financial product built on trust. Partner dependence is high across custody, card issuance, local payout rails, banks, liquidity providers, and strategic distribution. Financially, the business may have meaningful scale and even profitability, but public visibility into burn, reserves, loss exposure, and concentration remains poor. The investable question is therefore whether Fasset’s control framework is strong enough to keep expansion risk lower than product and market
    upside.
sections:
- id: regulatory-and-legal-risk
  title: Regulatory and legal risk
  body: 'Regulatory precision is the most important risk category because Fasset’s entire product story depends on trust in licensed, compliant operation. The public record supports real regulatory progress: VARA licensing is visible, the help centre enumerates multiple jurisdictions, and user terms embed AML/CTF, sanctions, eligibility, and suspension logic deeply into the customer relationship. But the same record also shows how easy it would be for scope confusion to arise. The company markets itself as a global digital bank and stablecoin neobank, while the visible Dubai register specifically references broker-dealer services. That gap does not prove non-compliance, but it creates interpretation risk around what exact products are regulated where, and what rights users actually have if a feature is unavailable or a dispute arises.


    The legal documentation also highlights several user-facing risk vectors: terms permit suspension or termination, card usage is restricted and subject to OFAC-style sanctions controls, future fee or interest changes can be introduced under disclosed amendments, and dispute resolution is contract-governed rather than always customer-friendly. Risk disclosures explicitly remind users that crypto assets are volatile and not suitable for everyone. Privacy and user-agreement materials show broad data sharing with service providers and authorities across multiple jurisdictions. Taken together, the legal stack looks substantial, but it also means regulatory, contractual, and jurisdictional issues can transmit directly into customer trust, corridor availability, and enforcement exposure.'
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
  - CR006
  - CR007
  - CR008
  - CR009
  - CR010
