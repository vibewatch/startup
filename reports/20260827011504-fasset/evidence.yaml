evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Current board composition, board observers, investor rights, and cap-table concentration are not publicly
      disclosed.
    whyItMatters: >-
      Control rights and liquidation preferences can materially change how investable a unicorn-priced private round
      really is.
    diligencePath: >-
      Request current cap table, board list, shareholder agreement summary, and post-Series C financing terms from
      management.
    relatedQuestionRefs:
      - QO021
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: Current employee count, functional split, and post-Series B hiring progress are not publicly disclosed.
    whyItMatters: Headcount is a key proxy for burn, execution capacity, and whether corridor expansion is capital-efficient.
    diligencePath: Request updated org chart, headcount by function/geography, and monthly net hiring since the Series B.
    relatedQuestionRefs:
      - QO022
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: blocking
    topic: revenue-quality
    missingEvidence: Recognized revenue, gross margin, take rate, burn, and cash runway are not public.
    whyItMatters: Volume and wallet figures alone cannot support a $1 billion valuation without revenue-quality context.
    diligencePath: Request monthly revenue bridge, gross margin by product, cash balance, and 18-month operating plan.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: minor
    topic: headquarters-framing
    missingEvidence: >-
      A management explanation for why some 2026 sources still described the company as U.S.-headquartered while later
      sources center Dubai.
    whyItMatters: >-
      Jurisdictional clarity affects tax, licensing, enforcement, and which entity ultimately issues customer-facing
      obligations.
    diligencePath: >-
      Request current legal-entity chart with headquarters designation, major employees by jurisdiction, and historical
      HQ-change timeline.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: segment-mix
    missingEvidence: >-
      Public sources do not break Fasset's $40B+ annualized volume into remittance, SME, institutional, or investing
      segments.
    whyItMatters: >-
      Without mix data it is impossible to tell which buyer segment truly drives monetization and whether the business
      is concentrated in a single corridor or customer class.
    diligencePath: Request GMV/volume split by product line, top corridor, and customer segment for the last 12 months.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: take-rate
    missingEvidence: No public evidence isolates Fasset's take rate, revenue pool, or gross-profit capture inside its disclosed volume.
    whyItMatters: >-
      A large payment-flow market can still be unattractive if unit economics are thin or dominated by interchange, FX,
      or partner pass-through costs.
    diligencePath: Request net revenue by product, implied take rate by segment, and gross margin by corridor.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: minor
    topic: market-size-lens
    missingEvidence: >-
      Public sources use incompatible denominators—total flows, remittances, stablecoin TAM, and company annualized
      volume.
    whyItMatters: >-
      Overstating TAM is an easy analytical error; investors need a consistent lens before converting size into
      valuation logic.
    diligencePath: >-
      Standardize diligence to one denominator set: gross payment volume, monetizable payment volume, and net revenue
      pool by corridor.
    relatedQuestionRefs:
      - QM007
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: multi-product-adoption
    missingEvidence: >-
      Public sources do not show what percentage of Fasset customers use multiple modules, which is critical to
      evaluating bundle lock-in.
    whyItMatters: If most users only use one surface, the bundle moat is much weaker than the marketing suggests.
    diligencePath: >-
      Request cohort data showing product penetration per customer and module attach rates for top retail and enterprise
      segments.
    relatedQuestionRefs:
      - QP024
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: material
    topic: enterprise-logos-and-revenue
    missingEvidence: >-
      Public sources do not identify active enterprise logos, contract values, or retention strong enough to prove B2B
      durability.
    whyItMatters: >-
      Competitive strength in enterprise payments depends on production customers, renewal behavior, and revenue
      concentration, not just partner announcements.
    diligencePath: Request active enterprise logo list, ARR by segment, renewal rate, and top-10 customer concentration.
    relatedQuestionRefs:
      - QP025
    relatedTableRefs:
      - TP001
      - TP004
  - type: conflicting-data
    severity: minor
    topic: price-transparency-comparison
    missingEvidence: >-
      Public pricing transparency varies widely across competitors, making like-for-like effective cost comparison
      incomplete.
    whyItMatters: >-
      A pricing comparison can overstate or understate competitiveness when corridors, spreads, and in-app fees are not
      fully visible.
    diligencePath: Run a corridor-by-corridor mystery-shop exercise on top 10 send and receive routes.
    relatedQuestionRefs:
      - QP011
      - QP012
      - QP013
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: No public source discloses net revenue, take rate, or gross margin by product or corridor.
    whyItMatters: Flow scale cannot be converted into valuation logic without knowing how much economics Fasset actually retains.
    diligencePath: Request monthly net revenue, take rate, and gross margin by product and top 10 corridors for 24 months.
    relatedQuestionRefs:
      - QI016
      - QI017
      - QI021
    relatedTableRefs:
      - TI001
      - TI003
      - TI005
  - type: private-evidence-only
    severity: material
    topic: cash-and-runway
    missingEvidence: Public materials do not disclose unrestricted cash, restricted liquidity, burn, runway, or debt commitments.
    whyItMatters: Capital adequacy and downside protection cannot be underwritten from fundraising headlines alone.
    diligencePath: Request current cash balances, monthly burn, runway bridge, and any debt, guarantees, or prefunding obligations.
    relatedQuestionRefs:
      - QI013
      - QI015
      - QI022
    relatedTableRefs:
      - TI004
      - TI005
  - type: conflicting-data
    severity: minor
    topic: profitability-signal
    missingEvidence: >-
      The profitability and six-fold revenue-growth signal appears in a secondary synthesis rather than an audited
      filing or primary interview transcript retained in the corpus.
    whyItMatters: This claim materially changes the financing interpretation, so evidence quality matters.
    diligencePath: >-
      Obtain the original interview transcript or board-ready KPI deck supporting profitability and revenue-growth
      claims.
    relatedQuestionRefs:
      - QI007
      - QI020
    relatedTableRefs:
      - TI003
      - TI004
  - type: private-evidence-only
    severity: material
    topic: software-quality-metrics
    missingEvidence: Public materials do not disclose uptime, latency, incident rates, settlement-failure rates, or API SLA history.
    whyItMatters: >-
      A fintech product with partner-heavy workflows can appear polished while still suffering fragile operational
      reliability.
    diligencePath: >-
      Request reliability dashboards, incident postmortems, API uptime/SLA logs, and settlement success rates by
      corridor.
    relatedQuestionRefs:
      - QE014
      - QE015
      - QE022
    relatedTableRefs:
      - TE003
      - TE004
  - type: private-evidence-only
    severity: material
    topic: security-and-sdlc
    missingEvidence: >-
      Public sources do not describe SDLC controls, code-review practices, penetration-test cadence, or internal
      security org depth.
    whyItMatters: Custody and payout controls are only as strong as the engineering and change-management process behind them.
    diligencePath: >-
      Request SDLC policy, external security-audit summaries, pen-test findings, key rotation process, and
      change-approval workflow.
    relatedQuestionRefs:
      - QE016
      - QE024
      - QE025
    relatedTableRefs:
      - TE003
      - TE004
  - type: private-evidence-only
    severity: minor
    topic: integration-depth
    missingEvidence: >-
      API/docs presence is visible, but endpoint coverage, sandbox fidelity, versioning policy, and integration success
      metrics are not public.
    whyItMatters: >-
      Developer-friendly claims can be materially overstated without strong docs, stable versioning, and support
      response quality.
    diligencePath: Request API reference, sandbox access, changelog, versioning policy, and enterprise integration case studies.
    relatedQuestionRefs:
      - QE005
      - QE020
    relatedTableRefs:
      - TE003
      - TE005
  - type: private-evidence-only
