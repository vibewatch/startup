company:
  name: Fasset
chapter:
  number: 5
  title: Product & Tech
  summary: 'Fasset’s product stack is best understood as a regulated stablecoin-banking workflow layered across consumer wallet, enterprise treasury, card, OTC, payout, and tokenized-investing modules. The visible architecture is not a deeply disclosed software stack; it is an operating architecture: app and account surfaces feed into KYB/KYC, asset screening, custody, liquidity, execution, local payout, and regulatory-control layers. The strongest public differentiation is not raw protocol invention but integration of digital-dollar settlement, local rails, and Shariah-oriented asset access under one umbrella. The main technical diligence gap is that public materials reveal process and controls, but little about uptime, incident metrics, internal data architecture, engineering depth, or release cadence.'
sections:
- id: product-definition-and-module-map
  title: Product definition in customer workflow terms
  body: 'Fasset is a workflow product before it is a single app feature. On the consumer side, the customer journey starts with onboarding into a regulated account that can receive, hold, move, spend, and invest value using USD accounts, USDT/USDC, a Visa-powered card, and tokenized or screened investment products. On the enterprise side, the workflow expands into treasury operations: dedicated accounts, OTC conversion, bulk settlement, local payout, API integrations, and reporting. The core job is not “trade crypto”; it is to bridge digital dollars, regulated rails, local fiat access, and compliant investing inside one operating surface. That is why the consumer wallet, business account, OTC desk, card, Fasset Pay, and API should be analyzed as modules of one financial operating system rather than separate products.


    Public materials show a broad module map. Consumer modules include wallet balances, card spending, tokenized gold and stocks, and Shariah-screened asset access. Enterprise modules include OTC execution, cross-border settlement, local on/off-ramps, payout orchestration, and API-led integration. The company’s Own Network concept ties these together as the partner fabric linking banks, telecoms, payment providers, custody, and liquidity. The chapter’s core product conclusion is therefore that Fasset differentiates through workflow integration and regulatory assembly, not through a narrow single SKU.'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
