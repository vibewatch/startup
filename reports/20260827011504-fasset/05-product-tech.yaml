callouts:
- calloutType: insight
  title: Fasset’s real architecture is operational integration
  body: 'The public materials do not expose microservice diagrams or database choices, but they do reveal something arguably more important for this business: a coherent control-and-routing architecture that links compliance, custody, conversion, payout, and investing workflows.'
  claimRefs:
  - CE011
  - CE012
  - CE018
  - CE023
- calloutType: risk
  title: Technical opacity remains material despite strong control signaling
  body: The company discloses many policy and control layers but almost no hard software quality metrics. Without uptime, incident, release, and API reliability data, investors cannot separate polished workflow design from truly mature technical operations.
  claimRefs:
  - CE028
  - CE030
  - CE031
  - CE032
