    - User friction if identity, region, or wallet setup fails
  - - Business orchestration layer
    - Payout initiation, OTC requests, treasury workflows, reporting
    - Internal workflow engine and partner APIs
    - Operational breakage if routing or reconciliation is unreliable
  - - Developer surface
    - API docs, integration touchpoints, possible embedded finance flows
    - Stable API contracts and documentation quality
    - Integration churn if docs or endpoints change without governance
  - - Compliance controls
    - KYC/KYB, sanctions, wallet screening, transaction review
    - Regulators, screening vendors, internal ops teams
    - False positives, onboarding delay, or enforcement exposure
  - - Custody and asset control
    - Safeguards user assets and transaction approval
    - Fireblocks MPC and internal controls
    - Counterparty and operational risk if custody or key controls fail
  - - Liquidity and execution
    - Converts assets and handles on/off-ramp or OTC settlement
    - Liquidity providers, banks, counterparties
    - Spread deterioration or failed settlement if partners degrade
  notes: This is an operating-architecture table, not a disclosed software bill of materials. Public evidence reveals process and partner layers more clearly than code internals.
