- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Fasset solution
  - Measurable benefit
  - Limitation
  rows:
  - - Receive international earnings
    - Client pays via wire or payout platform with FX friction
    - Named USD account / ACH-style collection / stablecoin receive
    - Faster collection, lower visible fees, better USD retention
    - Actual activation and payout success rates undisclosed
  - - Send local payout from digital-dollar balance
    - Manual bank conversion and slow wire or MTO
    - Stablecoin or account balance converted into local payout rail
    - Potentially faster and cheaper settlement
    - Corridor-level fees and reliability vary
  - - Spend digital balance globally
    - Withdraw to bank first, then spend locally
    - Visa virtual card funded by USDT / wallet balance
    - Immediate spending without separate off-ramp step
    - Card region restrictions and promo-period economics uncertain
  - - Move treasury in size
    - Public exchange slippage or manual bank conversion
    - OTC quote and regulated settlement flow
    - Price certainty and faster settlement for larger blocks
    - Requires verification and minimum size thresholds
  - - Automate business payouts
    - Manual CSV, bank portals, fragmented reconciliation
    - API / Fasset Pay / business account workflows
    - Batch execution and better machine-readable audit trail
    - Public API depth and implementation effort under-disclosed
  - - Access compliant investing
    - Separate broker, exchange, and screening tool
    - Tokenized or screened assets inside same account
    - Convenience and aligned Shariah framing
    - Portfolio controls, AUM, and post-trade reporting undisclosed
  notes: Benefits are workflow-level and mostly directionally supported; public sources do not provide audited time-to-value or reliability benchmarks.
