callouts:
- calloutType: strength
  title: Fasset is building a settlement-and-compliance layer, not just a wallet
  body: 'The API, Fasset Pay, OTC, and business-banking pages all point to the same strategy: own the licensed orchestration layer across fiat, stablecoins, and tokenized assets, then package it through multiple product surfaces. That is strategically stronger than a single use-case wallet if execution holds.'
  claimRefs:
  - CO003
  - CO004
  - CO029
  - CO030
- calloutType: strength
  title: 2026 financing momentum materially changed the company's category
  body: The jump from a May 2026 Series B to an August 2026 SBI-led unicorn round suggests that Fasset moved from an emerging-market crypto-fintech story into a globally notable infrastructure financing story within one quarter. That step-change matters for hiring, corridor expansion, and partner credibility.
  claimRefs:
  - CO008
  - CO009
  - CO010
- calloutType: risk
  title: Scale claims are strong, but public revenue and governance disclosure remain thin
  body: Wallet, corridor, and volume metrics are plentiful, but they are mostly company-originated. Investors still lack public revenue, margin, burn, cap-table, board, and top-customer data, which makes the current $1B valuation difficult to underwrite on fundamentals alone.
  claimRefs:
  - CO006
  - CO007
  - CO010
  - CO036
- calloutType: risk
  title: User-support friction is visible in public review channels
  body: Trustpilot, Google Play, and App Store reviews show repeated complaints about frozen funds, delayed card activation, withdrawal friction, and slow support. Even if absolute complaint volumes are small relative to claimed user base, they are early signals that rapid product expansion may be straining operations or compliance processes.
  claimRefs:
  - CO034
  - CO035
