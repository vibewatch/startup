company:
  name: Fasset
chapter:
  number: 1
  title: Company Overview
  summary: Fasset is a Dubai-headquartered stablecoin neobanking and digital-asset infrastructure company founded in 2019 by Mohammad Raafi Hossain and Daniel Ahmed. By August 2026 it had raised a $68 million Series C at a $1 billion valuation after a $51 million Series B in May, claimed more than 3 million wallets, 1,000 enterprise clients, 125-country reach, and over $40 billion in annualized transaction volume, and positioned Own Network as the regulated settlement rail behind its banking, payments, card, and tokenized-investment products. The key diligence tension is that scale and regulatory footprint are heavily company-claimed while governance, headcount, board structure, and realized revenue remain publicly opaque.
sections:
- id: identity-and-product-scope
  title: Identity, positioning, and product scope
  body: 'Fasset currently presents itself as a Dubai-headquartered, AI-powered stablecoin neobanking platform that lets individuals, businesses, and institutions receive, hold, move, spend, and invest across currencies, markets, and asset classes from one account. The consumer surface spans a global USD account, USDC/USDT deposits, a Visa-powered card, and access to crypto, tokenized gold, stocks, funds, and commodities. The enterprise surface adds multi-currency accounts, corporate cards, contractor payroll, OTC settlement, and API-driven treasury and payments infrastructure. Across the website, Fasset repeatedly frames this as interest-free and Shariah-compliant financial access rather than a pure crypto exchange, which is an important positioning distinction against regional exchanges such as Rain and BitOasis.


    Underneath the product suite is Own Network, described in August 2026 materials as regulated financial infrastructure connecting banks, telecom operators, payment providers, liquidity providers, custody partners, and settlement networks across more than 100 banking corridors. Earlier May 2026 materials described a 50-plus-corridor footprint, implying expansion velocity inside the same calendar year. The Fasset Pay and API pages show the intended operating model clearly: developers integrate one API, while Fasset supplies licensing, compliance, liquidity, custody, and banking rails behind the scenes. That framing supports the view that Fasset is trying to own settlement and orchestration, not just wallet UX.'
