      - number: '7.4'
        title: Financial / model risk and mitigation view
        blocks:
          - type: paragraph
            body: >-
              Financial-model risk is unusually difficult to score because public evidence is simultaneously promising
              and incomplete. On the positive side, Fasset claims very large annualized payment flow, significant
              customer breadth, and strong fresh funding. There is also a secondary signal that the company may have
              been profitable for twelve months. On the negative side, there is no public view into burn, corridor-level
              margin, reserve sufficiency, fraud loss rates, or top-customer concentration. That means several risks
              remain intertwined: if support or payout friction is high, variable cost may be worse than expected; if
              enterprise volume is concentrated in a few channels, revenue durability may be overstated; if regulation
              tightens, the company could face expensive remediation or slower rollout.


              The practical mitigation view is mixed rather than bleak. Fasset appears to have built genuine legal and
              policy scaffolding, real licenses, and named controls around custody, complaints, sanctions, and
              execution. That reduces the probability of a purely chaotic failure. But it does not eliminate the chance
              of a corridor-specific, partner-specific, or support-driven break in the customer experience. Investors
              should therefore treat risk monitoring as thesis-critical. The right diligence response is not to walk
              away automatically, but to demand measurable indicators: complaint resolution time, payout success rate,
              regulator correspondence history, concentration by corridor and customer, liquidity fallback plans, and
              capital buffers for operational surprises.
            claimRefs:
              - CR031
              - CR032
