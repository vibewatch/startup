  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              Fasset should be analyzed as a cross-border financial-access company, not as a generic neobank. The job it
              is trying to solve combines three pain points that are unusually acute in emerging markets: receiving and
              holding hard-currency value, moving funds across borders without multi-day correspondent-bank friction,
              and turning those funds into local spending or investing power. The relevant market therefore includes
              retail remittances, freelancer and creator payouts, SME supplier payments, treasury transfers, marketplace
              disbursements, and tokenized-investment funding flows that cross currency and jurisdiction boundaries. It
              excludes domestic deposit-taking, conventional consumer lending, and pure spot-crypto speculation as
              primary demand drivers.


              The status quo remains the SWIFT and correspondent-banking stack, supplemented by money transfer
              operators, mobile wallets, digital banks, and card networks. Fasset’s own explainer pages match
              independent market descriptions: SWIFT is a messaging network used by more than 11,000 institutions across
              over 200 countries, but funds still move through intermediary banks, creating hidden fees, FX markups,
              compliance delays, and poor visibility. For smaller senders and emerging-market SMEs, the practical
              substitutes are Wise-like transparent FX apps, Revolut-style multi-currency accounts, regional wallet
              providers such as Pyypl, and cash-out-driven remittance services. Fasset’s differentiation claim is that
              stablecoins plus local rails can compress the chain into a simpler, faster, more programmable settlement
              model.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM007
              - CM018
              - CM021
              - CM022
