      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The real market is not all payments; it is the pain-adjusted corridor subset
            body: >-
              A $208 trillion top-down TAM sounds impressive, but it is not the relevant underwriting number. Fasset
              matters in the slice where people and SMEs cannot get cheap, fast, compliant dollar access through legacy
              rails. That narrower market is still large enough to matter, but the corridor and payout details determine
              whether the company wins.
            calloutType: insight
            claimRefs:
              - CM011
              - CM013
              - CM034
              - CM035
          - type: callout
            title: Stablecoin adoption solves one layer of friction while creating another
            body: >-
              Stablecoin rails can compress cost and settlement time, but they shift the hardest problem to regulation,
              off-ramp liquidity, AML controls, and local partner reliability. A provider that wins the “on-chain” story
              but fails the local conversion and compliance layer will not hold market share for long.
            calloutType: risk
            claimRefs:
              - CM008
              - CM028
              - CM029
              - CM031
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct peers, incumbents, and substitutes'
        blocks:
          - type: paragraph
            body: >-
              Fasset is not competing against one clean peer set. It overlaps with enterprise stablecoin infrastructure
              players, regional crypto exchanges and wallets, remittance and payout wallets, multi-currency consumer
              fintech apps, and even internal bank-led treasury workflows. The closest direct strategic peer is Rain,
              which positions itself as enterprise-grade stablecoin payments infrastructure with card issuing, wallets,
              payouts, and regulatory alignment. Regional overlap comes from BitOasis and Pyypl: BitOasis is a regulated
              MENA crypto exchange with retail and institutional credibility in digital assets, while Pyypl is an
              underbanked wallet-and-payments platform with large mobile distribution and enterprise infrastructure
              ambitions. Hubpay attacks the corridor-wallet layer from a MENAP remittance angle. Baraka competes less on
              payments but does compete for the affluent or Shariah-conscious user who wants mobile access to global
              investing from the Gulf.


              The substitute set is broader still. Wise and Revolut do not market themselves as stablecoin neobanks, but
              they set the baseline for transparent FX, account usability, and mainstream consumer trust. For many
              users, “the competitor” is not another crypto-native product at all; it is a bank account plus Wise, or a
              treasury team wiring through incumbent bank rails, or a company building one local payout integration at a
              time. This matters because Fasset is selling convergence: one account, multiple corridors, stablecoins,
              card, OTC, investing, and enterprise tooling. Convergence can be a moat if integration cost is real. It
              can also be a liability if buyers prefer best-of-breed tools in each layer.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
