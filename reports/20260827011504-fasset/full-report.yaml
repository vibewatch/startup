  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Regulatory-scope mismatch
        - Management cannot map core products and corridors to valid local permissions
        - Undermines the regulated-infrastructure premium embedded in the story
        - Pause or reprice the investment case
      - - Operational trust deterioration
        - Persistent payout, freeze, or support failures without clean SLA improvement
        - Damages customer durability and raises the discount rate
        - Apply downside case or avoid
      - - Concentration surprise
        - Top corridors, enterprise customers, or partners drive outsized volume share
        - Makes reported scale less durable than headline metrics suggest
        - Demand concentration discount
      - - Monetization shortfall
        - GMV-to-revenue or revenue-to-gross-profit bridge is materially weaker than implied
        - Breaks the economics behind the unicorn price
        - Reset valuation below round mark
      - - Capital-opacity persists
        - No credible burn, cash, reserve, or cap-table disclosure is provided
        - Blocks underwritten late-stage pricing
        - Stay at research-more / track
      - - Strategic-round fragility
        - SBI-led round does not translate into live corridor or enterprise traction
        - Turns strategic premium into one-off signaling rather than proof
        - Cut premium assumptions
    notes: These triggers convert qualitative concerns into concrete diligence thresholds.
    claimRefs:
      - CV024
      - CV029
      - CV031
      - CV033
      - CV034
      - CV035
      - CV036
      - CV037
      - CV038
      - CV039
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Audited financials
        - FY2025 and trailing-2026 audited P&L, balance sheet, cash flow
        - Needed to test whether $1B is cheap, fair, or stretched on actual economics.
        - CFO / finance room
      - - Monetization bridge
        - GMV-to-revenue, revenue-to-gross-profit, and by-product take rates
        - Shows whether reported volume translates into durable value creation.
        - Finance + product
      - - Concentration map
        - Volume, revenue, and gross-profit concentration by corridor, customer, and partner
        - Tests fragility of the network and quality of scale.
        - BizOps / finance
      - - Risk pack
        - Complaint resolution, payout success, freeze rates, fraud losses, and regulator correspondence
        - Risk-adjusted valuation depends on control quality, not just growth.
        - Risk / compliance / ops
      - - Cap table and terms
        - Fully diluted ownership, liquidation preferences, side letters, and investor rights
        - Late-stage price support depends on what security investors are actually buying.
        - Legal / investor relations
      - - Strategic proof
        - Documented SBI, bank, telecom, or enterprise integrations that are live, not just announced
        - Determines whether strategic premium should persist or compress.
        - Partnerships / GTM
    notes: >-
      If management cannot produce most of this pack quickly, the evidence quality does not justify a decisive buy
      recommendation.
    claimRefs:
