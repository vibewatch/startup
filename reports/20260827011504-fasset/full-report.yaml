            title: Scale claims are strong, but public revenue and governance disclosure remain thin
            body: >-
              Wallet, corridor, and volume metrics are plentiful, but they are mostly company-originated. Investors
              still lack public revenue, margin, burn, cap-table, board, and top-customer data, which makes the current
              $1B valuation difficult to underwrite on fundamentals alone.
            calloutType: risk
            claimRefs:
