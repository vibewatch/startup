      - number: '3.3'
        title: Switching costs, lock-in, and distribution power
        blocks:
          - type: paragraph
            body: >-
              Fasset’s switching-cost story is partially real and partially unproven. It is real because corridor
              configuration, compliance onboarding, stablecoin funding routes, card activation, recurring payout
              templates, and business reconciliation flows all create operational inertia once a customer is live. A
              company using Fasset for OTC settlement, bulk stablecoin payouts, local off-ramp, and treasury reporting
              is not changing providers casually. Likewise, a retail user who receives ACH into a named USD account,
              stores value in USDT, spends through a Visa card, and buys tokenized assets inside one app has more
              embedded workflow than a user making one-off exchange trades.


              But the lock-in is not absolute. Much of the underlying infrastructure—Visa cards, stablecoin wallets,
              local payouts, on/off-ramp services, OTC desks—can be assembled by other well-capitalized fintechs. Rain
              is proving that enterprise buyers can adopt a different stablecoin stack at scale. Wise and Revolut show
              that trust and usability can overcome feature deficits if the core use case is simpler. Pyypl and Hubpay
              demonstrate that strong corridor distribution or financial-inclusion positioning can attract
              emerging-market users without matching every feature. Fasset’s distribution power therefore depends less
              on any one feature and more on how hard it is to replicate the full bundle across its 100-plus corridors
              with local compliance, liquidity, and payout partners. That is a meaningful but execution-heavy moat.
            claimRefs:
