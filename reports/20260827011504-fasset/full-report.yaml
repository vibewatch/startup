  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segmentation by buyer, user, payer, and use case
        blocks:
          - type: paragraph
            body: >-
              Fasset’s customer footprint is visibly multi-segment. Retail users are the most obvious surface because
              the app, card, reviews, and educational pages all speak directly to individuals receiving, holding,
              spending, and investing digital-dollar balances. Within retail, there are at least three relevant use
              cases: freelancers and remote workers receiving international earnings; remittance senders or recipients
              moving value across borders; and Shariah-conscious savers or investors using the wallet-card-investment
              stack as a broader financial hub. The product literature also points to SMEs and early-stage businesses
              that need multi-currency accounts, contractor payouts, or treasury flexibility. Finally, the company
              explicitly markets infrastructure to enterprises, fintechs, and platforms through Fasset Pay and API
              surfaces, and claims more than 1,000 enterprise customers.


              The buyer-user-payer distinction matters. A retail user is usually all three. In SMEs, the buyer may be a
              founder or finance lead while end users include contractors or finance staff. In enterprise and API use
              cases, the product buyer is likely a product, payments, or treasury team, while the end users are the
              downstream customers, sellers, or employees receiving funds. This mix can widen TAM and create expansion
              opportunities, but it also means the business likely has very different acquisition and support economics
              across segments. Public evidence is strong enough to map the segments, but not to size their revenue
              contribution.
