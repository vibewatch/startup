        title: Exhibits
        blocks:
          - type: callout
            title: The customer base looks broad; the durable base is still unproven
            body: >-
              Fasset has enough public evidence to show real customers across retail, payout, investing, and enterprise
              surfaces. What it does not show is how many of those customers remain active, repeat, or economically
              valuable over time.
            calloutType: insight
