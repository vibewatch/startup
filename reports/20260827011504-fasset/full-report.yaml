      - number: '1.4'
        title: Current strengths and open diligence questions
        blocks:
          - type: paragraph
            body: >-
              The strongest strategic signal in the overview chapter is that Fasset is trying to combine consumer
              neobanking UX, enterprise payments rails, and tokenized investing under one regulated umbrella aimed at
              emerging markets. The product breadth is broader than a corridor remittance app and more operationally
              grounded than a token-only marketplace. The company also appears to be investing in institutional controls
              rather than just consumer growth: Fasset FZE’s disclosed virtual-asset standards screen liquidity,
              sanctions, protocol security, and issuer background; the documents page says custody protection relies on
              Fireblocks MPC and hardware isolation; and the order-execution policy shows matched-principal routing,
              best-execution duties, and disclosed all-in pricing logic under VARA rules.


              The main diligence gap is that public disclosure is thin precisely where an investor would want
              underwriting confidence. There is no public board list, no cap-table detail, no current headcount, no
              realized revenue disclosure, and no independently verified enterprise-retention metric. User-sentiment
              sources also show real friction. Trustpilot reviews cite frozen accounts, slow support, and card-payment
              disputes, while Google Play reviews complain about card activation fees, restricted withdrawals, and KYC
              friction. Those adverse signals do not disprove product-market fit, but they do show that operational
              maturity may lag the company’s growth narrative. For later chapters, the priority is to test whether
              Fasset’s claimed infrastructure advantage and corridor scale translate into durable customers, healthy
              economics, and investable risk-adjusted valuation.
            claimRefs:
              - CO025
              - CO026
              - CO028
              - CO034
              - CO035
              - CO036
