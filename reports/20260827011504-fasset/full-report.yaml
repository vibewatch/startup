      - number: '3.4'
        title: Moat durability and competitive verdict
        blocks:
          - type: paragraph
            body: >-
              The most credible moat elements are regulatory assembly, corridor operations, and product convergence.
              Fasset’s announced 100-plus banking corridors, 1,000-plus enterprises, and 3 million-plus wallets imply
              distribution and operations work that cannot be reproduced overnight. The SBI Group relationship also
              matters strategically because it supports both capital access and distribution logic into cross-border
              Asian payments. Product convergence around stablecoin banking, cards, OTC, payouts, and Shariah-framed
              investing is differentiated relative to single-surface rivals.


              The anti-thesis is that most of these moats are integrative, not proprietary. There is little public
              evidence of deep protocol IP, exclusive network ownership, or hard customer lock-in. Rain has already
              built a stronger public enterprise infrastructure narrative. Wise and Revolut keep raising user
              expectations on price transparency and reliability. Regional wallets can undercut on one corridor, and
              crypto exchanges can undercut on one asset pair. If Fasset stumbles on support quality, regulation, or
              payout reliability, customers may multi-home instead of commit. The verdict is that Fasset has a
              defendable position, but it is a bundle-and-execution moat rather than an untouchable technology moat.
              That supports cautious respect, not complacency.
            claimRefs:
              - CP034
              - CP035
              - CP036
