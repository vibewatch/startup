      - number: '7.3'
        title: Partner, people, and execution risk
        blocks:
          - type: paragraph
            body: >-
              Fasset’s model is partner-heavy by design. Custody relies on external providers such as Fireblocks, the
              card stack relies on Visa and an issuer relationship, fiat payout depends on banks and local rails,
              settlement quality depends on liquidity providers and OTC counterparties, and distribution can be
              materially shaped by partners such as SBI Remit, Musaffa, Tether, or other ecosystem nodes. This creates
              reach and product breadth faster than building everything internally, but it also creates fragility. If a
              key bank closes a rail, a liquidity provider widens spreads, an issuer changes terms, or a regulator
              narrows product scope, the user experience can degrade quickly.


              People risk layers on top of this. Founder narrative remains unusually central to fundraising and
              positioning, while public governance depth below the founders is thin. Growth across multiple
              jurisdictions, product modules, and compliance surfaces demands deep operating benches in legal, treasury,
              support, and engineering. Job postings and expansion claims show activity, but not whether the company has
              already built enough middle-layer management to absorb mistakes at scale. Execution risk is therefore not
              merely “can they grow”; it is “can they grow without operationally or regulatorily breaking the trust loop
              that holds the bundle together?”
            claimRefs:
