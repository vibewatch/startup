  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition in customer workflow terms
        blocks:
          - type: paragraph
            body: >-
              Fasset is a workflow product before it is a single app feature. On the consumer side, the customer journey
              starts with onboarding into a regulated account that can receive, hold, move, spend, and invest value
              using USD accounts, USDT/USDC, a Visa-powered card, and tokenized or screened investment products. On the
              enterprise side, the workflow expands into treasury operations: dedicated accounts, OTC conversion, bulk
              settlement, local payout, API integrations, and reporting. The core job is not “trade crypto”; it is to
              bridge digital dollars, regulated rails, local fiat access, and compliant investing inside one operating
              surface. That is why the consumer wallet, business account, OTC desk, card, Fasset Pay, and API should be
              analyzed as modules of one financial operating system rather than separate products.


              Public materials show a broad module map. Consumer modules include wallet balances, card spending,
              tokenized gold and stocks, and Shariah-screened asset access. Enterprise modules include OTC execution,
              cross-border settlement, local on/off-ramps, payout orchestration, and API-led integration. The company’s
              Own Network concept ties these together as the partner fabric linking banks, telecoms, payment providers,
              custody, and liquidity. The chapter’s core product conclusion is therefore that Fasset differentiates
              through workflow integration and regulatory assembly, not through a narrow single SKU.
