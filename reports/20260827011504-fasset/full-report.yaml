            body: >-
              Trust and compliance are core product features here, not back-office details. Public sources repeatedly
              emphasize that every asset is reviewed before listing, that the platform operates under named licenses,
              and that customer activities pass through regulated controls. The help-centre materials say Fasset is
              licensed or approved across multiple jurisdictions and that products are evaluated for both regulatory and
              Shariah criteria before they appear in the app. The Fasset FZE documents and order-execution policy add
              more operational detail: matched-principal execution, all-in pricing logic, route selection, asset
              screening, and custody measures including Fireblocks MPC and hardware isolation. The complaint-handling
              and risk-warning materials further suggest the company has codified service and disclosure processes for
              things going wrong.


              Quality control is still under-disclosed in software terms. Public sources do not reveal uptime, latency,
              incident rates, settlement failure rates, engineering headcount, or release quality metrics. They do,
              however, reveal the categories of control Fasset thinks matter: sanctions, compliance, custody,
              complaints, Shariah oversight, and regulator-specific operating permissions. That is enough to support a
              view of Fasset as operationally serious, but not enough to treat the product as technically de-risked. In
              diligence, the next step should be to request incident metrics, change-management process, SDLC details,
              security audits, and support SLAs.
