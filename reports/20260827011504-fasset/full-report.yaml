        - id: n4
          label: Risk pack is valuation-relevant
          detail: Regulatory precision, partner dependence, and operational trust still matter heavily.
        - id: n5
          label: Premium above round needs proof
          detail: Investors should not pay far above the latest mark on narrative alone.
        - id: n6
          label: 'Recommendation: research-more / track'
          detail: Fair near the round; stretched above it until evidence improves.
        - id: n7
          label: Upgrade trigger
          detail: Audited monetization, concentration, and cap-table transparency.
