  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Probability signal
      - Valuation range
      - What must be true
      - Main failure mode
    rows:
      - - Bear
        - 25%
        - US$0.55B-US$0.85B
        - >-
          Operational trust issues or regulatory friction weaken investor willingness to fund the story at a unicorn
          premium.
        - Current round proves ephemeral and the discount rate rises sharply.
      - - Base
        - 50%
        - US$0.90B-US$1.15B
        - >-
          Scale claims are directionally right, no major new regulatory issue emerges, and monetization is decent but
          still not fully transparent.
        - The company remains credible but not disclosed well enough for a meaningful premium.
      - - Bull
        - 25%
        - US$1.25B-US$1.60B
        - >-
          Audited revenue conversion, strong corridor economics, and deeper strategic distribution proof arrive within
          the next diligence cycle.
        - Investors still view the business as too opaque or too risk-sensitive for premium pricing.
      - - Probability-weighted central view
        - 100%
        - approx. US$0.95B-US$1.05B
        - The round is broadly fair, but upside remains contingent on proof rather than promise.
        - Paying well above that level before disclosure arrives erodes margin of safety.
    notes: >-
      Ranges are analyst judgment bands anchored on the current financing fact pattern, regional private-comp
      references, public-comp discipline, and the unresolved risk pack.
