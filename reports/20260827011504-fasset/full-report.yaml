  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation anchor and what the unicorn mark actually means
        blocks:
          - type: paragraph
            body: >-
              Fasset’s current valuation anchor is unusually clear at the headline level and unusually incomplete
              underneath. The headline is that SBI Group led a $68 million Series C in August 2026 at a $1 billion
              valuation, following a $51 million Series B in May. Multiple sources converge on those facts, and
              management also ties the round to expansion of Own Network, AI-enabled banking orchestration, and broader
              stablecoin payment infrastructure. That makes the unicorn label real in the narrow sense that
              sophisticated investors have recently priced the company there.


              The problem is that a financing mark is not the same as a fully underwritten intrinsic value. Public
              evidence still does not disclose the post-money cap table, the revenue denominator against which the price
              was set, margin structure, loss profile, or a cohort-quality view of wallets versus enterprise volume.
              Even the most cited operating statistics—3 million wallets, 1,000-plus enterprises, and more than $40
              billion annualized transaction volume—remain company claims rather than audited disclosures. The right
              reading is therefore price-sensitive rather than binary: the round makes a $1 billion valuation plausible,
              but it does not yet prove that investors should pay a large premium above that mark without a much deeper
              diligence package.
            claimRefs:
              - CV001
              - CV002
