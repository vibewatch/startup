        title: Exhibits
        blocks:
          - type: callout
            title: Fasset is building a settlement-and-compliance layer, not just a wallet
            body: >-
              The API, Fasset Pay, OTC, and business-banking pages all point to the same strategy: own the licensed
              orchestration layer across fiat, stablecoins, and tokenized assets, then package it through multiple
              product surfaces. That is strategically stronger than a single use-case wallet if execution holds.
