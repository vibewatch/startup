      - number: '5.2'
        title: Operating architecture and critical dependencies
        blocks:
          - type: paragraph
            body: >-
              The visible architecture is layered rather than deeply code-disclosed. Front-end surfaces include the
              mobile app, card interface, business accounts, OTC request workflow, and developer-facing API/docs
              surfaces. Behind that sits an orchestration layer that handles onboarding, account funding, asset routing,
              payout initiation, and investment access. The most important operational layers then appear in the
              compliance and asset-control stack: KYB/KYC, sanctions screening, wallet screening, asset review before
              listing, custody controls, execution policies, and regulator-specific permissions. Fasset’s own OTC,
              on/off-ramp, and payout explainers show how transactions move from fiat funding to stablecoin conversion
              to local bank settlement, while the docs and Fasset FZE materials suggest a formalized handling model
              rather than ad hoc exchange-style operations.


              These capabilities depend on external partners. Fireblocks MPC custody is explicitly named in Fasset FZE
              documents. Visa powers the card layer. Local banking and payout rails are required for AED, Pakistan, and
              other corridor settlements. Liquidity providers and OTC counterparties matter for block execution and
              conversion quality. The developer-signal here is useful: the Fasset API and docs surfaces indicate that
              some of the product is designed to be embedded into third-party systems, which raises the value of stable
              API behavior, integration support, and machine-readable reconciliation. This is a real architecture, but
              it is ecosystem architecture as much as software architecture.
