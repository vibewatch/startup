  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Dimension
      - Argument
      - Anti-thesis
      - What would change the view
    rows:
      - - Funding signal
        - SBI-led financing validates serious investor interest and strategic relevance.
        - A branded strategic round can still overpay for option value without proving fundamentals.
        - Disclose round terms, governance rights, and investor concentration.
      - - Scale narrative
        - 3M wallets, 1,000+ enterprises, and $40B annualized volume imply real platform reach.
        - Those metrics are company claims with limited public denominator detail and no audited conversion to revenue.
        - Provide audited KPI glossary and monetization bridge.
      - - Category position
        - Stablecoin neobanking for emerging-market corridors is a timely category with structural demand.
        - Strong theme alone cannot overcome weak disclosure or corridor economics that disappoint.
        - Show corridor-level unit economics and repeat enterprise usage.
      - - Regulatory posture
        - Visible licenses and policy stack reduce the odds of a purely speculative operation.
        - License scope and local-entity mapping still matter enormously to valuation durability.
        - Provide product-by-jurisdiction legal mapping and regulator correspondence summary.
      - - Comparable support
        - Regional fintech comps make unicorn status plausible.
        - >-
          Fasset is less disclosed than the strongest regional winners and should not inherit their premium
          automatically.
        - Show retention, margin, and capital-efficiency proof closer to late-stage leaders.
      - - Public-comp ambition
        - Public fintech market caps imply large long-run upside if Fasset compounds.
        - Public comps are audited and liquid; Fasset is neither today.
        - Show IPO-grade revenue, risk, and governance readiness.
    notes: The anti-thesis is driven more by missing proof and risk transmission than by disbelief in product relevance.
    claimRefs:
      - CV006
      - CV007
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
      - CV016
      - CV020
