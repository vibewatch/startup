      - number: '7.2'
        title: Operational, quality, and security risk
        blocks:
          - type: paragraph
            body: >-
              Operational reliability is the clearest adverse signal visible in public sources. Trustpilot and Google
              Play contain repeated complaints about frozen funds, delayed withdrawals, card activation or
              authentication failures, deposits not landing on time, and slow support responses. In a fintech product,
              these are not superficial annoyances; they are direct threats to retention, reputation, and even regulator
              attention if unresolved. The terms and policies partly explain why this friction may exist: the company
              operates with transaction monitoring, sanctions checks, account restrictions, and cross-jurisdiction
              compliance gates. Those controls are necessary, but if they produce too many false positives or too much
              manual review, they can create a support burden that looks to customers like unreliability.


              Security and control signals are mixed. The Fasset FZE documents, order-execution policy, privacy policy,
              and custody references imply formal control layers, Fireblocks MPC, and institutional-style safeguards.
              But the public record still lacks hard reliability metrics, incident history, or breach disclosures. That
              means investors can see the control categories but not the measured quality of those controls. The
              operational risk is therefore a combination of product complexity and evidence opacity: many partners,
              many corridors, and many checks, with limited public data on how often the machine fails in practice.
            claimRefs:
              - CR012
              - CR013
