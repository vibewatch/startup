      - number: '1.2'
        title: Founders, leadership, and entity footprint
        blocks:
          - type: paragraph
            body: >-
              The founder story is unusually central to Fasset’s go-to-market narrative. Mohammad Raafi Hossain is
              publicly documented as a former adviser to the UAE Prime Minister’s Office with Berkeley and Harvard
              training in economics and sustainable development; independent profiles and company-linked coverage
              connect that policy background to Fasset’s focus on financial inclusion, remittances, and emerging-market
              infrastructure. Daniel Ahmed, the co-founder and COO, is separately profiled by Forbes Middle East as a
              British-UAE operator who helped launch Fasset in Indonesia, supported a regional Mastercard card
              partnership, and helped move the headquarters to the UAE in late 2023.


              Public materials also show that Fasset operates through multiple legal entities rather than a single
              national shell. The privacy-policy and help-centre materials name Fasset FZE in Dubai, Fasset Labuan
              Limited in Malaysia, PT Gerbang Aset Digital in Indonesia, a Turkey entity, a Lithuania entity, and Fasset
              Financial Services W.L.L. in Bahrain. That entity map is consistent with Fasset’s claim that the product
              is regionally regulated, but board composition, voting control, and the exact split between Dubai, Labuan,
              and legacy U.S. operations remain undisclosed. Some May 2026 media still described the company as
              U.S.-headquartered or American-founded, whereas August 2026 coverage and current company facts center
              Dubai. The likeliest interpretation is a recent branding or entity-centre shift rather than a factual
              contradiction, but it is still a diligence item because jurisdiction affects licensing, tax, and
              enforceability.
            claimRefs:
