            title: Support quality may be the hidden churn driver
            body: >-
              Multiple complaint surfaces raise the same themes: card activation friction, delayed withdrawals, frozen
              funds, and slow support. In a financial product, these are not cosmetic UX issues—they are direct threats
              to repeat trust and word-of-mouth growth.
            calloutType: risk
