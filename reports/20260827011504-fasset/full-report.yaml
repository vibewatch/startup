            title: User-support friction is visible in public review channels
            body: >-
              Trustpilot, Google Play, and App Store reviews show repeated complaints about frozen funds, delayed card
              activation, withdrawal friction, and slow support. Even if absolute complaint volumes are small relative
              to claimed user base, they are early signals that rapid product expansion may be straining operations or
              compliance processes.
