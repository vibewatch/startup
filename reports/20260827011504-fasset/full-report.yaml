        title: Financial verdict on revenue quality, margin path, and blockers
        blocks:
          - type: paragraph
            body: >-
              The public financial case is credible enough to justify continued diligence, but not strong enough to
              justify underwriting confidence. There are multiple real monetization surfaces, credible evidence of large
              flow, and at least one strong secondary signal that the company may already be profitable. Those are
              better signals than many fintechs at similar age. The business also appears better positioned than pure
              exchange peers to monetize enterprise flows, treasury operations, and embedded payout infrastructure,
              which can support better economics than one-off retail trading volume.


              At the same time, the chapter’s blocking issues are fundamental. There is no audited revenue disclosure,
              no take-rate history, no gross-margin series, no burn or runway number, no allowance or loss history, no
              top-customer concentration, and no segmentation between retail and enterprise economics. Public review
              surfaces also show customer-friction risk that could raise support cost or churn. The right verdict is
              therefore: attractive flow and monetization architecture, but financial quality remains under-evidenced.
              Before any investment decision, management should provide monthly GMV by segment and corridor, net revenue
              by product, gross margin by rail, burn and runway, cash balances, and top-20 customer concentration.
