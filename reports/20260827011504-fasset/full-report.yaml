            title: License precision is a thesis-level issue, not a footnote
            body: >-
              A regulated fintech can survive many product problems, but it is much harder to survive ambiguity about
              what exactly is licensed where. Fasset’s marketing breadth makes this a critical diligence item even
              though the underlying license progress appears real.
