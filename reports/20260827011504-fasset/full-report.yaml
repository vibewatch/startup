chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, positioning, and product scope
        blocks:
          - type: paragraph
            body: >-
              Fasset currently presents itself as a Dubai-headquartered, AI-powered stablecoin neobanking platform that
              lets individuals, businesses, and institutions receive, hold, move, spend, and invest across currencies,
              markets, and asset classes from one account. The consumer surface spans a global USD account, USDC/USDT
              deposits, a Visa-powered card, and access to crypto, tokenized gold, stocks, funds, and commodities. The
              enterprise surface adds multi-currency accounts, corporate cards, contractor payroll, OTC settlement, and
              API-driven treasury and payments infrastructure. Across the website, Fasset repeatedly frames this as
              interest-free and Shariah-compliant financial access rather than a pure crypto exchange, which is an
              important positioning distinction against regional exchanges such as Rain and BitOasis.


              Underneath the product suite is Own Network, described in August 2026 materials as regulated financial
              infrastructure connecting banks, telecom operators, payment providers, liquidity providers, custody
              partners, and settlement networks across more than 100 banking corridors. Earlier May 2026 materials
              described a 50-plus-corridor footprint, implying expansion velocity inside the same calendar year. The
              Fasset Pay and API pages show the intended operating model clearly: developers integrate one API, while
              Fasset supplies licensing, compliance, liquidity, custody, and banking rails behind the scenes. That
              framing supports the view that Fasset is trying to own settlement and orchestration, not just wallet UX.
            claimRefs:
