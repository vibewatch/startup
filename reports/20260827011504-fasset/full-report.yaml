      - number: '2.2'
        title: 'Sizing the opportunity: TAM, SAM, and SOM lenses'
        blocks:
          - type: paragraph
            body: >-
              The broadest market lens comes from FXC Intelligence, which projected the global wholesale and retail
              cross-border payments market at $208 trillion in 2025. That figure is directionally useful for showing how
              much value crosses borders, but it is too broad to support venture underwriting by itself because it
              includes interbank, wholesale, card, and retail categories that Fasset does not directly monetize. The
              next lens is more relevant: Tazapay estimates the total addressable market for stablecoin cross-border
              payments at $16.5 trillion, arguing that the highest-potential corridors run into and between emerging
              markets where legacy banking friction is most severe. Goldman and Brookings then sharpen the qualitative
              case by showing why those corridors matter: roughly $290 billion in stablecoin supply exists globally,
              around 66% is held in emerging markets, and remittance volumes have grown to roughly $892 billion
              globally.


              From there, Fasset’s serviceable market is narrower still. Its product suite aligns most clearly with the
              retail/SME/marketplace slice of underserved cross-border flows: remittances, freelancer earnings, trade
              payments, treasury settlement, and value storage for users without reliable USD bank access. A plausible
              bottom-up framing is: global cross-border flows (TAM) → stablecoin-addressable flows (SAM-lite) →
              emerging-market compliant on/off-ramp corridors where users need USD accounts, local payout, and regulated
              asset access (Fasset SAM) → Fasset’s current more-than-$40 billion annualized volume footprint (SOM
              evidence). The precise monetizable revenue pool remains uncertain because public sources give gross flow
              metrics, not take rate or net revenue, but the market is clearly large enough that the critical question
              is execution and regulatory durability, not top-down demand sufficiency.
