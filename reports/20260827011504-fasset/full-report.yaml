  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue streams and monetization surfaces
        blocks:
          - type: paragraph
            body: >-
              Fasset presents more monetization surfaces than a simple wallet or exchange. The company can plausibly
              earn on FX conversion, transfer and payout fees, card issuance, OTC spread, treasury and enterprise
              settlement fees, and investment-product economics. Public pages support this mosaic even when they do not
              disclose complete take rates. The Fasset Card page discloses a 9.99 USDT issuance fee and zero promo
              per-transaction fee. Pakistan and ACH materials disclose a 0.35% FX fee on some non-USD flows and a 9.99
              one-time USD IBAN issuance fee. OTC materials explicitly say pricing varies by trade size and asset.
              Fasset Pay markets 60%–80% lower costs and 99% shorter settlement times, implying an enterprise pricing
              envelope even if the actual contract structure is undisclosed. The likely revenue model is therefore
              usage-based and mixed: retail fees on specific rails plus negotiated B2B monetization layered over gross
              payment flow.


              The important caveat is recognition quality. Fasset’s reported transaction volume is gross flow, not
              revenue, and the public materials do not reveal what portion of pricing is passed through to liquidity
              providers, card networks, banks, custody vendors, or payout partners. A business can process very large
              payment volume and still generate thin contribution margins if most of the economics sit with
              counterparties. For that reason, the company’s revenue model is legible, but revenue quality is not yet
              verifiable from public evidence alone.
