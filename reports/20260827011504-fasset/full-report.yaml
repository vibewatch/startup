      - number: '6.3'
        title: Retention, repeat usage, satisfaction, and friction
        blocks:
          - type: paragraph
            body: >-
              Public retention visibility is weak, so satisfaction and repeat-usage clues matter more than usual. The
              positive signals are real. App and Trustpilot reviews include users describing repeated use of the card,
              USD account, or investing features, and some reviewers explicitly say they keep funds in Fasset or use the
              app for groceries, food delivery, and personal investing. App-store listings also emphasize recent
              performance and stability updates, which suggests the company is iterating against user feedback. These
              are not the same as cohort data, but they do show a product used for more than one-off speculation in at
              least some cases.


              The negative signals are equally important. Google Play and Trustpilot contain repeated complaints about
              card activation fees, deposit or withdrawal delays, payment failures, restricted accounts, and slow or
              templated support responses. Several complaints specifically mention that funds were deducted while
              support resolution lagged for days. JustUseApp also frames the platform around broad asset access and
              conversion ease, which is consistent with the company narrative but does not offset operational
              complaints. The consequence is that Fasset’s customer base may be broad while still carrying a meaningful
              trust and service-quality fragility. In the absence of disclosed churn or NRR, these review surfaces
              become important caution flags rather than mere anecdotes.
            claimRefs:
              - CU021
              - CU022
