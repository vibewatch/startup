      - number: '4.2'
        title: Public traction, pricing signals, and unit-economics proxies
        blocks:
          - type: paragraph
            body: >-
              The best public traction signals are scale proxies rather than accounting outputs. In May 2026 Fasset said
              it had more than $32 billion of annualized transaction volume, more than 2 million wallets, and more than
              1,000 SME clients; by August 2026 this became more than $40 billion, more than 3 million wallets, and more
              than 1,000 enterprises. Seedtable’s synthesis of August 2026 coverage adds an especially important but
              still only moderately reliable signal: a reported comment that revenue had grown roughly six-fold over the
              past year and that the company had been profitable for twelve consecutive months. If true, that changes
              the financing interpretation dramatically, because a profitable company raising a strategic Series C is
              different from a cash-burning growth story. But the claim is not independently corroborated through
              filings or audited statements, so it should be treated as promising rather than proven.


              Unit-economics inference therefore has to work backwards from observable pricing and workflow design.
              Payments routed through stablecoins can remove some correspondent-bank costs and compress settlement time,
              which supports gross-margin potential. But that margin is partially offset by KYC and AML operations,
              local payout partners, custody, card-program costs, customer support, and treasury operations across
              multiple corridors. The likely economics are better than a traditional low-margin remittance app if
              enterprise settlement volume is meaningful and support costs are controlled, yet worse than the headline
              GMV might imply if most flows are low-value retail activity. Investors should therefore model a wide range
              around take rate, gross margin, and support burden rather than anchoring on the flow number alone.
