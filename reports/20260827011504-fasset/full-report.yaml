      - number: '1.3'
        title: Funding, scale, and regulatory status
        blocks:
          - type: paragraph
            body: >-
              Fasset’s disclosed capital formation accelerated sharply in 2026. The company announced a $51 million
              Series B in May 2026 with participation from SBI Group, Arz Portfoy, Investcorp, Speedinvest, and family
              offices, then followed it in August 2026 with a $68 million Series C led by SBI Group at a $1 billion
              valuation. The Series C announcement said total 2026 fundraising had reached $119 million and lifetime
              funding had surpassed $150 million. Earlier independent profiles, including Forbes Middle East’s 2024
              ranking entry, referenced only $26.7 million raised and 100,000-plus users, which gives a useful baseline
              for the speed of capital and product scaling since late 2024.


              The operating scale figures are strong but still primarily company-originated. In May 2026 Fasset said it
              processed more than $32 billion in annualized transaction volume, served more than 2 million wallets
              across 125 countries, and had more than 1,000 SME clients; by August 2026 this became more than $40
              billion, more than 3 million wallets, and more than 1,000 enterprises. The regulatory posture is more
              verifiable. Company help-centre disclosures say Fasset obtained a full-market-product license from Dubai
              VARA in November 2023 after completing provisional, preparatory, and operating stages, while the public
              register and third-party UAE review materials identify Fasset FZE as licensed for broker-dealer services
              under license number VL/23/07/002. Company materials also cite LFSA Malaysia and CBB Bahrain alongside
              approvals in Indonesia, Pakistan, Türkiye, and the EU.
