      - number: '4.3'
        title: Cost structure, working capital, and capital adequacy
        blocks:
          - type: paragraph
            body: >-
              Public materials strongly imply a complex cost stack. Fasset’s multi-jurisdiction model requires
              licensing, compliance staff, KYC and sanctions tooling, customer support, treasury operations, banking
              relationships, liquidity providers, card-program support, custody, and enterprise implementation. The
              Fasset FZE documents point to Fireblocks MPC custody and formal virtual-asset screening standards, while
              the order-execution policy and regulatory pages imply ongoing best-execution, monitoring, and audit
              obligations under VARA. Those controls increase trust and enterprise readiness but also increase fixed
              operating cost. Working capital needs are also real. Any platform promising local payout, OTC conversion,
              or instant settlement across many corridors must maintain liquidity, partner balances, or prefunding
              arrangements somewhere in the chain, even if the customer-facing experience hides that complexity.


              Capital adequacy is therefore the critical unresolved issue. The company announced $51 million Series B in
              May 2026 and a $68 million Series C in August 2026 at a $1 billion valuation, bringing 2026 fundraising to
              $119 million and lifetime funding to more than $150 million. That should provide real operating runway,
              especially if the profitability claim is accurate. But no public source discloses cash on hand, monthly
              burn, corridor-level profitability, or credit exposure. The most defensible view is that Fasset has
              improved access to capital and may have de-risked short-term runway, but investors still cannot underwrite
              liquidity, burn, or reserve sufficiency from public evidence.
