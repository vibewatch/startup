- id: incumbent-pressure
  title: Incumbent pressure is more about distribution, financing, and field reach than raw feature lists
  body: Public sources suggest Huawei, BYD, and Enphase pressure Polarium in different ways. Huawei is the clearest telecom benchmark because it pairs batteries with rectifiers, generators, PV, and remote O&M. BYD represents balance-sheet scale and manufacturing credibility. Enphase represents brand trust, channel muscle, and polished distributed-energy packaging. None of those proofs automatically disqualifies Polarium, but together they show that competition is not just about whether a battery works. Long-lived infrastructure buyers care about financing, warranties, support coverage, and whether the vendor can execute at fleet scale. That is why channel partnerships, project-development capability, and local leadership hires show up repeatedly in Polarium's own evidence. A smaller vendor can still win, but it usually must win on use-case fit, deployment speed, and software leverage rather than brute-force distribution.
  claimRefs:
  - CP002
  - CP010
  - CP011
  - CP012
  - CP013
