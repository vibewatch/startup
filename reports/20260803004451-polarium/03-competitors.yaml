  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: win-loss-data
    missingEvidence: Segment-by-segment win/loss reasons against Huawei, BYD, Enphase, EPC substitutes, and diesel-retrofit alternatives.
    whyItMatters: Without competitive displacement data, differentiation claims remain more conceptual than underwritten.
    diligencePath: Request CRM-coded win/loss analysis by segment, geography, and competitor class for 2024-2026.
    relatedQuestionRefs:
    - QP017
    - QP016
    - QP022
    - QP023
    relatedTableRefs:
