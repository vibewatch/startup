callouts:
- calloutType: insight
  title: Polarium's real rival is fragmentation, not one single giant
  body: 'The company must win very different buying motions: tower uptime, industrial power-quality economics, installer-led home energy, and charging-grid support. Its reusable stack is a strength only if it remains credible across all of them.'
  claimRefs:
  - CP001
  - CP006
  - CP039
- calloutType: risk
  title: Channels and financing can beat superior engineering
  body: In storage infrastructure, a larger vendor or local EPC can win with warranties, financing, or distribution reach even when the smaller platform is more elegant. That makes realized pricing and win/loss data crucial diligence items.
  claimRefs:
  - CP023
  - CP026
  - CP032
- calloutType: strength
  title: RWE is more than a logo
  body: The RWE partnership materially improves Polarium's posture because it shows a path from installed hardware to aggregated flexibility revenues, which many battery vendors still describe more vaguely than they prove.
