    whyItMatters: Software and services are central to differentiation but not yet financially or operationally quantified publicly.
    diligencePath: Request MAU / active-site metrics, service penetration, uptime, and support-cost data by software surface.
    relatedQuestionRefs:
      - QE011
      - QE015
      - QE024
      - QE025
    relatedTableRefs:
