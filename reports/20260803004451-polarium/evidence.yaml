evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-disclosure
    missingEvidence: Named board roster, committee composition, independence status, and board minutes or governance policies.
    whyItMatters: >-
      Late-stage hardware businesses with amended credit facilities and frequent leadership changes need clear
      governance visibility for underwriting.
    diligencePath: >-
      Request the current board pack, committee charters, shareholder agreement governance rights, and biographies for
      all directors.
    relatedQuestionRefs:
      - QO008
      - QO025
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: blocking
    topic: capital-structure
    missingEvidence: >-
      Cap table, share-class waterfall, convertible preference terms, and lender covenant package related to the amended
      credit facilities.
    whyItMatters: Without these documents investors cannot model dilution, downside protection, or refinancing risk.
    diligencePath: >-
      Request the cap table, latest shareholder agreement, term sheets for outstanding convertibles/preference shares,
      and facility agreements.
    relatedQuestionRefs:
      - QO013
      - QO014
      - QO025
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: financial-reporting-scope
    missingEvidence: >-
      Reconciled bridge between management-reported 2024 metrics and registry-filed 2024 metrics, including entity scope
      and accounting basis.
    whyItMatters: >-
      Core diligence questions on growth, margin improvement, and employee efficiency depend on knowing which
      denominator is correct.
    diligencePath: >-
      Obtain audited 2024 consolidated statements and a management bridge that maps company communications to
      legal-entity or group reporting lines.
    relatedQuestionRefs:
      - QO017
      - QO018
    relatedTableRefs:
      - TO005
  - type: missing-source
    severity: material
    topic: current-footprint
    missingEvidence: A current list of active manufacturing sites, ownership/lease status, and each site's output role.
    whyItMatters: >-
      Manufacturing footprint affects working capital, geopolitical exposure, and the credibility of scaling claims in
      later chapters.
    diligencePath: >-
      Request a 2026 manufacturing and supply-chain map covering Sweden, Vietnam, South Africa, and any legacy Mexico
      footprint.
    relatedQuestionRefs:
      - QO020
      - QO025
    relatedTableRefs:
      - TO004
      - TO005
  - type: missing-source
    severity: material
    topic: segment-revenue-mix
    missingEvidence: Revenue mix, gross margin, and pipeline by Telecom, C&I, Residential, and flexibility-market activities.
    whyItMatters: >-
      Without segment economics it is impossible to convert attractive market stories into a defendable SAM or
      contribution-margin thesis.
    diligencePath: Request 2024-2026 segment revenue mix, gross margins, backlog, and pipeline conversion by business area.
    relatedQuestionRefs:
      - QM017
      - QM025
    relatedTableRefs:
      - TM002
      - TM005
  - type: conflicting-data
    severity: material
    topic: ci-market-size
    missingEvidence: >-
      Independent corroboration for the 37 GWh European C&I market estimate cited in the Stella Futura acquisition
      release.
    whyItMatters: The company-supplied C&I lens is directionally useful but too important to accept without third-party support.
    diligencePath: >-
      Cross-check with independent European BESS market reports or grid-connection data segmented to behind-the-meter
      C&I storage.
    relatedQuestionRefs:
      - QM019
      - QM024
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: operator-fleet-data
    missingEvidence: >-
      Named operator and towerco fleet counts, refresh cycles, savings realized, and renewal rates for telecom
      deployments.
    whyItMatters: >-
      Telecom is the most credible historic market for Polarium, but public evidence does not reveal how repeatable or
      concentrated that business is.
    diligencePath: >-
      Request customer cohort data for towercos and operators, including active sites, installed capacity, and renewal
      behavior.
    relatedQuestionRefs:
      - QM018
      - QM025
    relatedTableRefs:
      - TM005
  - type: private-evidence-only
    severity: minor
    topic: funnel-conversion-data
    missingEvidence: Lead-to-pilot-to-production conversion rates by segment and average deployment timelines.
    whyItMatters: The adoption funnel is analytically plausible but cannot be quantified from public cases alone.
    diligencePath: Request CRM funnel metrics and deployment-duration data by segment and geography.
    relatedQuestionRefs:
      - QM007
      - QM025
    relatedTableRefs:
      - TM004
      - TM005
  - type: private-evidence-only
    severity: material
    topic: win-loss-data
    missingEvidence: >-
      Segment-by-segment win/loss reasons against Huawei, BYD, Enphase, EPC substitutes, and diesel-retrofit
      alternatives.
    whyItMatters: Without competitive displacement data, differentiation claims remain more conceptual than underwritten.
    diligencePath: Request CRM-coded win/loss analysis by segment, geography, and competitor class for 2024-2026.
    relatedQuestionRefs:
      - QP017
      - QP016
      - QP022
      - QP023
    relatedTableRefs:
      - TP001
      - TP004
  - type: missing-source
    severity: material
    topic: realized-pricing
    missingEvidence: Realized pricing, discounting behavior, service attach rates, and warranty economics versus named competitors.
    whyItMatters: >-
      Pricing power is central to moat durability, yet public packaging evidence is far stronger than price realization
      evidence.
    diligencePath: Request quote-to-booking data, gross margin by segment, and bundled-software attach rates.
    relatedQuestionRefs:
      - QP006
      - QP011
      - QP023
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: renewal-and-switching
    missingEvidence: Renewal, churn, fleet replacement, and expansion data after initial deployment by segment.
    whyItMatters: Switching-cost arguments are plausible but cannot be validated without cohort or fleet-replacement evidence.
    diligencePath: Request renewal cohorts, replacement wins, and installed-fleet churn versus incumbent alternatives.
    relatedQuestionRefs:
      - QP009
      - QP019
      - QP023
    relatedTableRefs:
      - TP004
  - type: unsupported-claim
    severity: minor
    topic: competitor-feature-gaps
    missingEvidence: >-
      Direct retained-source proof for some competitor capabilities outside their core segments, especially EV-charging
      and VPP claims.
    whyItMatters: Several matrix cells are intentionally marked Unknown; overfilling them would create false precision.
    diligencePath: Expand official-source set competitor by competitor before making stronger parity or superiority claims.
    relatedQuestionRefs:
      - QP003
      - QP014
    relatedTableRefs:
      - TP002
  - type: conflicting-data
    severity: material
    topic: 2024-revenue-reconciliation
    missingEvidence: >-
      A reconciled audited bridge explaining why Polarium's turnaround article cites SEK 1,332M while Allabolag lists
      SEK 1,515.1M.
    whyItMatters: Top-line disagreement corrupts every downstream financial ratio and valuation input.
    diligencePath: >-
      Request audited 2024 financial statements and a management explanation of any scope, entity, or recognition
      differences.
    relatedQuestionRefs:
      - QI009
      - QI020
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: cash-burn-and-runway
    missingEvidence: Current cash balance, monthly burn, covenant headroom, debt maturities, and runway under base/downside cases.
    whyItMatters: Capital adequacy is the central unresolved financial risk.
    diligencePath: Request monthly cash bridge, debt schedule, covenant summary, and board-approved financing trigger plan.
    relatedQuestionRefs:
      - QI015
      - QI016
      - QI019
      - QI025
    relatedTableRefs:
      - TI004
      - TI005
  - type: private-evidence-only
    severity: material
    topic: segment-unit-economics
    missingEvidence: Segment revenue mix, gross margins, channel discounts, CAC, warranty reserves, and service attach rates.
    whyItMatters: Without these metrics, improving revenue cannot be converted into a credible profitability thesis.
    diligencePath: Request segment P&L, channel economics, warranty policy, and service-penetration metrics for 2024-2026.
    relatedQuestionRefs:
      - QI001
      - QI003
      - QI006
      - QI011
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: private-evidence-only
    severity: minor
    topic: project-backlog-and-conversion
    missingEvidence: >-
      Booked backlog, weighted pipeline, conversion rates, and working-capital assumptions for Germany, C&I, and EV
      charging.
    whyItMatters: Growth initiatives can absorb cash before they prove returns.
    diligencePath: Request backlog aging, win rates, and project cash-conversion assumptions by segment.
    relatedQuestionRefs:
      - QI012
      - QI014
      - QI018
    relatedTableRefs:
      - TI001
      - TI004
  - type: private-evidence-only
    severity: material
    topic: reliability-and-certifications
    missingEvidence: >-
      Third-party certifications by product line, measured field-failure rates, warranty-claim history, and SLA
      commitments.
    whyItMatters: >-
