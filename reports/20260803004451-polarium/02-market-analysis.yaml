callouts:
- calloutType: insight
  title: The market is best read as several adjacent wedges, not one monolithic TAM
  body: Telecom uptime, industrial price protection, EV-charging capacity support, and residential self-consumption are different buying motions. Polarium wins when one battery-and-software stack can cross those motions without forcing separate products or sales organizations for each.
  claimRefs:
  - CM001
  - CM003
  - CM034
- calloutType: risk
  title: Public market data is still too coarse for precision underwriting
  body: The best open-source numbers are adjacent-demand lenses—towerco spend, policy growth, projected portfolio MWh—not Polarium-specific segment TAM, SAM, or conversion rates. Investors should expect a large opportunity, but not pretend they can price it precisely from public data alone.
  claimRefs:
  - CM019
  - CM021
  - CM022
  - CM023
  - CM036
- calloutType: strength
  title: Backup economics are giving way to platform economics
  body: The RWE agreement is strategically important because it shows how Polarium can turn already-deployed batteries from insurance assets into dispatchable infrastructure, materially improving the market narrative versus a one-off hardware sale.
  claimRefs:
  - CM018
  - CM023
  - CM027
