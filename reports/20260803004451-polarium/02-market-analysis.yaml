  rows:
  - - Telecom reserve power
    - Battery cabinets, BMS, monitoring, service, hybrid site-power controls
    - Macro-grid generation, tower steel, core network hardware
    - Towercos, telecom operators, infrastructure owners
    - Original Polarium wedge and strongest public proof base
  - - Commercial & industrial BESS
    - On-site storage, EMS, reserve power, peak shaving, grid-services readiness
    - Process machinery, pure solar EPC, utility-scale front-of-meter plants
    - Plant owners, facility managers, energy leads
    - Expands TAM beyond telecom and into higher-value optimization workflows
  - - Residential home energy
    - Battery, app, installer channel, tariff and self-consumption optimization
    - Rooftop PV modules, generic smart-home hardware without storage
    - Homeowners via installer / channel partners
    - Channel-driven volume market with software-led user experience
  - - EV charging support
    - BESS, power boost, EMS, depot or forecourt integration
    - Charging hardware alone, raw grid-upgrade capex
    - Charge-point operators, fuel retailers, depot owners
    - Fastest proof that storage solves grid constraints beyond backup
  - - Flexibility / VPP monetization
    - Aggregation software, dispatch, trading-market access, telemetry
    - Wholesale generation ownership, transmission assets
    - Aggregators, traders, storage owners
    - Converts installed backup assets into recurring economic assets
  notes: 'Boundary is analytical: it focuses on distributed storage plus control software and services, not the full battery or utility-infrastructure value chain.'
