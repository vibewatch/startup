- id: constraints-and-gaps
  title: Adoption constraints remain real, and open-source market data is still incomplete
  body: None of the growth drivers remove the practical constraints. Batteries remain capital-intensive, and Polarium itself had to recapitalize in 2024, which reminds us that supplier financing strength is part of the buyer decision. Industrial deployments can also be slowed by insurance, emergency-service approvals, and project-specific engineering. Residential scale depends on trusted channel partners and software integrations, not just product specifications. Meanwhile, large incumbents like Huawei, BYD, and Enphase define what buyers now expect around uptime, power-electronics integration, warranties, and remote operations. The biggest analytical limitation is that several of the market numbers available to the public are company-supplied or adjacent-demand proxies rather than independent segment-sized estimates. We do not have Polarium's segment revenue mix, contract durations, conversion rates, or churn by vertical. That means the market thesis is directionally attractive and increasingly
    multi-segment, but precise underwriting still requires private cohort, pipeline, and segment-margin data.
  claimRefs:
  - CM029
  - CM030
  - CM031
  - CM032
  - CM033
  - CM036
