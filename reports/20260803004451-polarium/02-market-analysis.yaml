- id: evidence-constrained-sizing
  title: Sizing must be lens-based because no single clean TAM is public
  body: 'Public evidence supports several useful market lenses, but not a clean one-line TAM. The strongest telecom-demand lens comes from tower infrastructure: American Tower says it has invested more than $350 million in Africa since 2018 on renewables, energy storage, and efficiency, reducing diesel use by 43.5 million litres annually. That does not tell us Polarium''s SAM directly, but it proves that power modernization around telecom sites already commands hundreds of millions of dollars at fleet scale. The strongest distributed-BESS lens comes from Germany, where RWE expects Polarium''s virtual-battery portfolio to scale from 50 MW / 135 MWh in late 2026 toward roughly 300 MW / 810 MWh across more than 10,000 systems. The strongest broader growth lens comes from policy and adjacent market commentary: the European Commission expects global battery demand to rise 14x by 2030, while Polarium says the European C&I market alone could reach 37 GWh by 2030. Together these lenses justify a
    large and growing opportunity, but they are not interchangeable, and investors should resist collapsing them into one falsely precise TAM figure.'
  claimRefs:
  - CM018
  - CM019
  - CM020
  - CM021
  - CM022
  - CM023
  - CM024
  - CM036
  tableRefs:
  - TM002
- id: growth-drivers
  title: Growth drivers are converging across telecom, industrial, residential, and charging segments
  body: 'The same secular forces keep reappearing across Polarium''s evidence base. In telecom, unreliable grids and diesel dependence make uptime and fuel savings the primary adoption triggers. In C&I and residential, the key driver becomes electricity-price volatility and the value of storing cheap or self-generated power for later use. In EV charging, the problem shifts again toward connection constraints, capacity tariffs, and the need to deliver high-power charging before the grid is upgraded. Overlaying those use cases is a broader software-led driver: once batteries are digitally connected, backup assets can also earn value in balancing or flexibility markets. That is what turns storage from insurance to an operating asset. Regulation reinforces the trend rather than creating it from zero. The European battery framework adds lifecycle and circularity obligations while also validating that batteries are becoming strategic infrastructure. The result is a market where the reasons to
    buy differ by segment, but the direction of travel is consistent: distributed storage is moving from niche green hardware toward core energy-system infrastructure.'
  claimRefs:
  - CM009
  - CM011
  - CM013
  - CM015
  - CM016
  - CM025
  - CM026
  - CM027
  - CM028
  - CM037
