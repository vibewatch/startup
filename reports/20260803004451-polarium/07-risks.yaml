callouts:
- calloutType: risk
  title: The biggest risk is combination risk
  body: Polarium becomes most fragile when capital strain, field-quality uncertainty, and partner dependence reinforce each other. That combination would hit customers, margins, and fundraising at once.
  claimRefs:
  - CR008
  - CR011
