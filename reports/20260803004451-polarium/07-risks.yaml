- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Liquidity stress
    - New financing under visibly weak terms or covenant stress
    - Emergency raise, covenant breach, or opaque refinancing
    - Pause or re-price investment case immediately
  - - Field reliability / safety
    - Material fire / propagation / recall / widespread failure event
    - One severe public incident or pattern of repeated field failures
    - Escalate to red diligence; thesis may break
  - - Partner concentration
    - Flagship partner slowdown or exit
    - RWE / ATC / key channel materially reduces scope or ends program
    - Reassess growth and proof durability assumptions
  - - Execution overload
    - Multiple new initiatives slip simultaneously
    - Repeated delays across Germany, residential, and charging rollouts
    - Assume slower revenue conversion and higher burn
  - - Regulatory / privacy event
    - GDPR complaint, enforcement, or material compliance gap
    - Formal regulator action or credible customer data incident
    - Demand remediation proof before continuing
  notes: Triggers are intentionally concrete so the investment committee can observe them after a decision.
