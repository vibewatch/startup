              展示充电站点相关性。这些证明深度不一，但合在一起说明公司服务的不止一个小众场景。更广泛的案例页面和反复出现的住宅发布，也暗示管理层正在有意识地建立可复用证明库。公开证据还没有给出分母：类似站点有多少、案例重复频率如何，以及具名参考之外的采用是广泛还是集中。因此，这套证明足以验证相关性，但还不足以回答组合形状问题。
