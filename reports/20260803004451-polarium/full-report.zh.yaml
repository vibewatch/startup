      - number: '2.5'
        title: 采用约束仍然真实，开源市场数据也不完整
        blocks:
          - type: paragraph
            body: >-
              增长驱动并没有消除实际约束。电池仍然资本密集，Polarium 自身在 2024
              年也不得不资本重组，这提醒我们，供应商融资能力本身就是买方决策的一部分。工业部署还可能被保险、应急服务审批和项目专属工程拖慢。住宅规模靠可信渠道伙伴和软件集成，不只是产品规格。同时，Huawei、BYD、Enphase
              等大型既有厂商，已经定义了买方对在线率、电力电子集成、质保和远程运营的预期。最大的分析限制在于，公开可得的若干市场数字来自公司口径或相邻需求代理，而非独立分部规模估算。我们没有 Polarium
              按垂直场景拆分的收入、合同期限、转化率或流失率。因此，市场命题方向上有吸引力，也越来越多分部化；但精确投资判断仍需要私有的 cohort、管线和分部毛利数据。
