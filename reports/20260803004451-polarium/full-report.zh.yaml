  - id: TV005
    title: 论点破裂与终止触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对论点的传导
      - 行动含义
    rows:
      - - 弱条款融资事件
        - 紧急融资或贷款契约压力
        - 证实资本结构弱于基准情景
        - 退出，或要求大幅重置价格
      - - 收入质量不及预期
        - 经调节的审计收入或毛利明显弱于隐含水平
        - 同时压缩倍数和信心
        - 重切基准与熊市情景
      - - 旗舰项目停滞
        - RWE / 渠道 / 充电项目未能拓宽
        - 削弱平台上行叙事
        - 按纯硬件集成商处理
      - - 集中度意外
        - 头部客户或伙伴暴露远高于预期
        - 提高脆弱性，并压低应得倍数
        - 要求多元化折价
    notes: 终止标准聚焦最快改变价值的事件，而不仅是公司质量。
    claimRefs:
      - CV037
      - CV039
      - CV041
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 审计收入对账
        - 解决官方与注册资料来源之间的 2024 年收入冲突
        - 所有倍数和情景都从这里开始
        - 要求提供审计财务报表和调节桥
      - - 现金、债务和契约
        - 当前流动性和再融资风险未知
        - 决定下行空间与价格纪律
        - 要求提供贷款方资料包和资金续航模型
      - - 分部毛利
        - 需要了解电信、C&I、户用和服务各分部经济性
        - 区分平台上行与硬件负担
        - 要求提供分部 P&L
      - - 留存与集中度
        - 需要伙伴和客户持久性数据
        - 决定应给验证点多少价值
        - 要求提供 cohort 和前十大暴露
      - - 可靠性与认证
        - 需要证明安装基数耐用且安全
        - 支撑或削弱估值溢价
        - 要求提供认证资料包和保修历史
    notes: 这些是认真价格谈判前的最低要求。
    claimRefs:
