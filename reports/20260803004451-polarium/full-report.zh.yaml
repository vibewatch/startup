              相比纯愿景型气候科技故事，Polarium
              看起来真实得多：有可观收入、大量已安装基础、客户证明和新的战略动能。但财务画像仍难以完整判断，因为可得证据刚好停在最关键数字之前。我们没有可靠的分部收入组合、实际定价、毛利、质保准备金、订单储备、现金、烧钱或债务条款。甚至
