  summary: >-
    Polarium 是一家总部在斯德哥尔摩、2015 年成立的瑞典私营储能公司。公司从电信备用电源起步，已扩展到商业和工业储能、住宅电池、EV
    充电支撑，以及类似虚拟电厂的灵活性工作流。公开证据支撑其真实已安装基础、可观收入、现有投资人在 2024 年 10 月 SEK 500M 资本重组中的继续输血，以及 RWE、KP Energy 等合作和 Stella Futura
    收购带来的可信战略动能。核心尽调张力在于，Polarium 看起来运营真实、战略上也有吸引力，但公司仍未披露足够多的经调节财务和资本结构细节，无法支撑激进且精确的估值判断。
