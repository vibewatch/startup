        title: 法规和法律风险理论上可控，但前提是运营成熟速度跟得上战略
        blocks:
          - type: paragraph
            body: >-
              电池生命周期和可追溯规则正在收紧。Home 应用让公司直接面对 GDPR 和数据处理者责任。跨境传输、分析和客服数据都需要有纪律的控制。Polarium 有可见缓释措施——隐私政策、SCC
              条款表述和举报渠道——但这些并不能证明产品级合规和事件响应已经达到工业级。公开来源也没有展示详细认证包或逐产品法规矩阵。参与电网服务又加了一层复杂度，因为辅助服务市场规则可能脱离 Polarium
              的产品路线图独立变化。时间点同样重要。合规错误往往出现得晚，通常在产品已经部署或渠道已经放大之后才暴露；即便公司最终仍能合规，整改也可能昂贵且分散管理层注意力。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR019
              - CR020
              - CR038
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR019
              - CR038
          - type: figure
            figureRef: FR003
            claimRefs:
              - CR014
              - CR015
              - CR016
              - CR017
              - CR019
              - CR026
      - number: '7.3'
        title: 运营质量风险结构性偏高，因为这些是部署在现场的关键任务能源资产
        blocks:
          - type: paragraph
            body: >-
              通信站点、工业设施和快充系统使用的电池，需要在复杂现场环境里长期保持安全、可靠、可远程可见，并且可维护。Polarium 的公开材料有帮助：它描述了 BMS 控制、服务、防盗和生命周期支持，也显示
              Kempower
              等买方重视蔓延防护和可部署性。但这些来源也点出了底层风险：公司负责的不只是一个硬件箱。它承担了一部分安全逻辑、云端可视化、投运流程和安装后支持负担。公开证据显示公司有实质控制，但缺少现场故障、事故、SLA
              和保修索赔数据，投资人必须把可靠性视为未决问题。因此，尽调应聚焦公司能否快速发现、隔离并修复故障。在关键任务基础设施里，只有好的产品故事、没有记录充分的事件处理能力，远远不够。
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR021
              - CR022
              - CR023
              - CR032
