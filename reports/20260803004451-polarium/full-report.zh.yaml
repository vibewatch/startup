  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争边界：Polarium 是横跨多个相邻市场的小众集成挑战者
        blocks:
          - type: paragraph
            body: >-
              只有把市场分层，Polarium 的竞争者集合才说得通。在电信备用电源中，最相关的比较对象是 Huawei 这类集成站点电源既有厂商，以及柴油加铅酸电池的现状方案。C&I 储能中，竞争场扩大到项目开发商、EPC
              和技术中立的储能供应商。住宅中，战场更接近应用体验、安装商渠道和品牌信任。充电基础设施中，电池既要对抗其他 BESS 厂商，也要对抗昂贵但有时无法绕开的电网升级。这意味着 Polarium
              不是在击败一个通用对手，而是在证明自己的模块化硬件加软件栈能在不同工作流中击败不同替代方案。这个战略方向有吸引力，但也意味着公司很少在所有场景都有单一压倒性优势。最合理的表述是：一个小众集成挑战者，拥有若干强证明点；而不是一个已经控制品类的平台。
