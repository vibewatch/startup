        blocks:
          - type: paragraph
            body: >-
              只看客户验证，Polarium
              比许多未上市气候科技公司更站得住脚。它能拿出具名部署、客户引用叙事、伙伴背书用例，以及在通信、工商业储能、家庭能源和充电场景里的近期进展。这样的宽度很有价值，因为它降低了公司只是单一客户或单一用例故事的风险。但更难的尽调问题还没有消失。我们仍不知道客户账户的规模分布、通信电池组合的续约模式、家庭渠道的商业耐久度，也不知道任何单一战略伙伴贡献了多少收入。因此，审慎投资人的结论应是正面但不完整：Polarium
              已经证明多种场景里的客户需要这类产品，但还没有公开足够的分群证据，来证明留存稳固、先落地再扩张的打法可规模化，或客户集中度已经安全分散。
