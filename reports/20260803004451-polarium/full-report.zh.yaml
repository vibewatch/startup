      - number: '2.4'
        title: 增长驱动正在电信、工业、住宅和充电场景汇合
        blocks:
          - type: paragraph
            body: >-
              同几股长期力量在 Polarium 的证据基础中反复出现。电信里，不可靠电网和柴油依赖让在线率和节油成为首要采用触发点。C&I 和住宅中，关键驱动变成电价波动，以及把低价或自发电力存起来以后使用的价值。EV
              充电中，问题又转向连接受限、容量电价，以及在电网升级前提供高功率充电的需求。叠加在这些用例之上的，是一个更偏软件的驱动：电池一旦数字化连接，备电资产也能在平衡或灵活性市场里赚取价值。储能因此从保险资产变成运营资产。监管是在强化趋势，而不是从零创造趋势。欧洲电池框架增加生命周期和循环义务，同时也确认电池正在成为战略基础设施。结果是，各分部购买理由不同，但方向一致：分布式储能正在从小众绿色硬件走向核心能源系统基础设施。
