      - number: '7.6'
        title: 图表
        blocks:
          - type: callout
            title: 最大风险是组合风险
            body: 资本压力、现场质量不确定性和伙伴依赖彼此强化时，Polarium 最脆弱。这样的组合会同时打击客户、利润率和融资能力。
            calloutType: risk
