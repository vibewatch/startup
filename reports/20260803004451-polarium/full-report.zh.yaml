          pain: Diesel cost, price volatility, grid limits, or outage exposure
          outcome: Search for storage-based solution
        - label: 2. 合作伙伴或渠道评估
          stage: 评估
          actor: Polarium + 合作伙伴生态
          action: Case studies, installer/distributor route, or technical-fit review
          pain: Need credible proof and local support
          outcome: Pilot or direct project selection
        - label: 3. 部署
          stage: 部署
          actor: 安装商 / 站点团队 / 项目团队
          action: Battery system installed and commissioned
          pain: Project complexity and integration risk
          outcome: Operational energy storage asset
        - label: 4. 运营使用
          stage: 运行使用
          actor: 运营团队 / 屋主 / 充电运营商
          action: Uses battery for uptime, savings, or charging support
          pain: Need trust in reliability and controls
          outcome: Outcome proof and daily workflow adoption
        - label: 5. 扩张 / 变现
