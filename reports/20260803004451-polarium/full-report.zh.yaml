        - 重新评估增长与验证持久性的假设
      - - 执行超载
        - 多个新项目同时延期
        - 德国、户用和充电铺开反复延误
        - 假设收入转化更慢、烧钱更高
      - - 监管 / 隐私事件
        - GDPR 投诉、执法或重大合规缺口
        - 监管正式行动或可信的客户数据事件
        - 继续前要求整改证据
    notes: 触发因素故意写得具体，便于投资委员会在决策后观察。
