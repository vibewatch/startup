  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义：Polarium 销售的是储能系统，不只是电芯或机架
        blocks:
          - type: paragraph
            body: >-
              Polarium
              的公开资料清楚说明，公司并不试图孤立销售原始电池组件。它围绕客户结果定义产品：电信在线率、工业优化、住宅灵活性，以及受限电网下的充电支撑。产品组合覆盖低压电信电池、模块化高压储能系统、家用电池和运营服务。每一种场景里，只有硬件、控制和支持结合起来，产品才算完整。这一点重要，因为判断产品成熟度不能只看模块规格，还要看
              Polarium 连接电池、监控、控制逻辑和部署工作流的效果。公司的战略页面也强化了这个方向，把储能描述为优化和编排问题，而不是商品化箱体。这个叙事可信，但也抬高了尽调门槛：集成系统需要比纯硬件 SKU
              更强的可靠性、可服务性和软件质量证明。
