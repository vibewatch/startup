        title: 切换成本存在，但公开证据仍指向中等而非绝对锁定
        blocks:
          - type: paragraph
            body: >-
              这个市场确实有切换摩擦。电信或工业系统一旦获批、安装并接入远程监控工作流，买方可能偏好已经验证过的供应商。但这些摩擦不应被误读为软件垄断。技术中立的项目开发、化学体系中立的架构和项目制定价，都会限制可见锁定。公开来源没有显示足够强的专利墙、专有标准或披露的续约数据，来证明持久定价权。相反，Polarium
              的护城河更适合描述为执行型：垂直整合、分部专门经验，以及在硬件之上增加服务或灵活性价值的能力。这有帮助，但如果更大对手补上软件层，或本地 EPC 渠道继续保持买方议价权，它仍容易被商品化挤压。
