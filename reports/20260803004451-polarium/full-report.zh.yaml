  - id: TV003
    title: 牛 / 基准 / 熊情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 牛市
        - RWE 式变现放大，毛利改善，户用 / C&I 渠道顺畅转化
        - 支撑 ~$1.1B-$1.3B 结果，且相对陈旧估值可能有上行
        - 执行与营运资本风险必须受控
        - 有可能，但需要新证据
      - - 基准
        - 公司真实，轨迹在改善，但仍偏硬件且披露不足
        - 支撑 ~$0.7B-$0.95B 区间，低于陈旧公开锚点
        - 毛利、现金和集中度仍未解决
        - 从公开证据看最可信
      - - 熊市
        - 流动性压力再现，旗舰项目不及预期，或披露弱于预期
        - 支撑 ~$0.3B-$0.6B 区间，相对独角兽锚点下行显著
        - 融资与集中度成为主导风险
        - 若风险叠加，该情景可信
