      - number: '1.2'
        title: 领导层重置与治理可见度
        blocks:
          - type: paragraph
            body: >-
              重整期内，领导层变化很大。2022 年扩大股东基础的公告中，Stefan Jansson 仍以创始人兼 CEO 身份出现；2024 年 10 月融资公告引用的 CEO 已是 Clas Gunneberg；到
              2025 年 5 月和 2026 年 5 月，Polarium 对外主角变成 Leif Ottosson，显示重置期内经历了快速接班。2026 年 1 月，公司又任命 Jens Bruno 为 CFO，并提拔
              Pontus Winberg 负责住宅和 C&I 业务；2026 年 5 月，Jan Roschek
              出任德国董事总经理。这些任命说明公司正在围绕更宽的垂直场景和地理市场专业化，而不只是围绕电信。薄弱点在治理披露。Polarium 的投资者关系页面只泛泛说明董事会和 CEO
              职责，却不公布董事姓名、委员会构成、独立监督或详细治理政策。对于一家有独角兽时代估值主张、又修改过信贷安排的公司，这种治理透明度不足是真正的尽调缺口，不是表面瑕疵。
