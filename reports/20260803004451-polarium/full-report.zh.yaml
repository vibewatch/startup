      - number: '2.2'
        title: 买方地图和采用路径在各分部差异很大
        blocks:
          - type: paragraph
            body: >-
              Polarium 各分部的买方、用户和付款方并不固定，因此单一销售打法模板会失效。在电信中，经济买方通常是通信塔公司或网络运营商，用户则是重视在线率、降油耗和远程监控的站点运营团队。在 C&I
              中，买方通常是希望控制电能质量、峰值成本暴露和停机风险的工厂业主或运营经理。住宅场景里，用户和付款方合并为屋主，但市场路径要经过安装商、零售商，以及 Tibber 等能源应用。EV
              充电中，经济买方可能是无法为更大电网连接等待的充电点运营商或燃油零售商。采用路径也会变化：电信往往在规格获批后按全网扩展，工业场景可能从单个设施起步再扩张，住宅销量取决于安装商渠道，灵活性变现则只会在电池完成部署并数字化连接后出现。这些差异意味着，Polarium
              参与的是多个相邻市场；它们共享硬件 DNA，却有不同预算负责人和证明要求。
