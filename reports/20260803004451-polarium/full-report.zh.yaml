              NRR、GRR、流失率、续约率、合同长度或账户扩张曲线。有充分理由相信一些切换成本存在——电信集成深度、应用绑定行为、已安装电池资产群和服务关系都不是轻易能拆掉的——但公开证据还没有用 cohort
              形式证明它们。即便 Home app 和 Home Assistant
              集成这类社区信号，也只能显示安装后互动，不能证明商业持久度。这在产品相关性和收入质量之间留下持续缺口。投资者可以合理得出结论：Polarium
              赢下了真实用例；但还不能判断这些胜利有多粘、续约频率如何，或一次初始部署是否通常会带来更广的多站点足迹。这是客户章节中最关键的缺失层。
