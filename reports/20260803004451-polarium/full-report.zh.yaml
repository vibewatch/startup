        title: 收入模型：多条硬件主导的收入流，叠加一层薄但重要的服务层
        blocks:
          - type: paragraph
            body: >-
              Polarium 的公开资料指向一个多分部收入模型，核心是储能硬件和相关项目交付。电信电池仍是最老、也最清楚的业务。更新的收入流包括 C&I 储能、EV
              充电支撑，以及通过渠道销售的住宅家用电池。服务、监控和能源优化能力显然存在，但公司没有披露它们是单独收费、捆进产品毛利，还是只留给 RWE tolling
              等特定伙伴结构。这一点很重要，因为核心投资判断问题在于：Polarium
              主要是一个带少量软件的项目和硬件供应商，还是软件、编排和灵活性收入最终能抬高利润率并改善经常性收入质量。公开证据支撑这条上行路径存在，但不支撑当前贡献度。因此，投资者应把经常性收入潜力视为真实但早期，而不是今天已经被证明的主导驱动。
