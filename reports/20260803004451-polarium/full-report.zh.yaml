      - number: '7.4'
        title: 伙伴依赖能加速增长，也会切碎责任归属
        blocks:
          - type: paragraph
            body: >-
              Polarium 近期扩张策略明显由伙伴驱动。RWE 推动灵活性商业化。KP Energy 和住宅生态扩大分销。Tibber 关联行为帮助住宅价值兑现。Kempower 和 VAROPreem
              扩展充电场景相关性。这些关系在战略上合理，但也带来依赖风险，因为客户体验、数据流、铺开节奏和叙事新鲜度都可能由第三方居中调节。Polarium
              越依赖伙伴分销和编排，就越需要跨越不受自己控制的公司来协调。投资人应假设，伙伴驱动的规模既带来杠杆，也带来不透明。它能加快市场进入，但也会让人更难看清客户所有权、服务责任和经济控制权究竟在 Polarium
              手里，还是在别人手里。
            claimRefs:
              - CR014
              - CR015
              - CR016
              - CR017
              - CR024
              - CR025
              - CR026
              - CR027
              - CR033
              - CR035
