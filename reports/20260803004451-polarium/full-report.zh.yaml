            body: 2024 年资本重组是真实的，但公开证据仍没有披露当前现金、烧钱速度或契约余量。这使任何可辩护的资金续航估计都无法成立，也让融资风险继续成为故事核心。
            calloutType: risk
            claimRefs:
              - CI015
              - CI016
              - CI017
