chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份定位与分部演进
        blocks:
          - type: paragraph
            body: >-
              更准确地看，Polarium 是一家瑞典后期私营储能平台：先从电信备用电源做起，再有意迁移到更广的分布式储能工作流。公司称其 2015
              年成立于斯德哥尔摩，现在销售模块化锂离子系统，覆盖电信备电、商业和工业能源优化，以及住宅电池。官网把这条路径讲得很清楚：2019 年在电信备用电源市场取得领先，2020 年走出电信，2021
              年达到收入里程碑并在越南建厂，到 2025–2026 年，新应用已延伸到家用电池、EV 充电和虚拟电厂聚合。公开规模信号有分量，但并不完全干净。管理层对外宣传 80 个国家超过 540,000 块已安装电池、约
              400 名员工；投资者关系材料则称已安装基础覆盖 75 多个国家，全球足迹横跨四大洲。大方向清楚——Polarium 已不只是电信电池供应商——但若干数字披露仍停留在营销层面，还不是完全调节过的公司报告口径。
