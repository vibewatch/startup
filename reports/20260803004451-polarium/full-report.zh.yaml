      - number: '1.5'
        title: 现在的里程碑指向更宽的分布式能源平台
        blocks:
          - type: paragraph
            body: >-
              Polarium 最新公开里程碑显示，公司正尝试让同一套电池和软件栈在电信备电之外创造更多收入。RWE 协议把德国至少 1,600 套系统聚合为 50 MW / 135 MWh
              虚拟电池，把投资命题从硬件销售推向持续性灵活性变现。Näst Energy Lab 项目让 Polarium 进入本地能源一体化和车网互动环境；VAROPreem 合作则用模块化 BESS 加 EMS
              绕开受限电网连接，支撑 EV 充电。住宅端，KP Energy 合作和随后北欧备货公告，为 Polarium Home 打开了更清晰的分销路径。Stella Futura 收购把这种拓宽进一步延伸到 C&I
              系统设计和 EPC 执行，并带有 100 MW 区域部署目标。这些都是可信的平台化雄心信号。它们没有抹掉旧有电信 DNA，但确实说明 Polarium
              的战略目的地是分布式能源基础设施，而不是单一产品电池小众市场。
