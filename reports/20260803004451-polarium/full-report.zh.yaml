    rows:
      - - 真实安装基数、新增长面，以及通往软件 / 灵活性上行的可信路径
        - 若经审计的毛利、留存和现金可见度清楚，将增强判断
      - - 业务偏硬件、重资本且披露不足，今天未必配得上完整独角兽估值
        - 若价格大幅下调或披露明显改善，将削弱该反向判断
      - - 伙伴质量带来战略杠杆
        - 若旗舰项目未能扩展为多元收入，将削弱判断
      - - 转型改善看起来真实，但风险尚未完全解除
        - 若盈利能力和流动性进展有独立文件佐证，将增强判断
