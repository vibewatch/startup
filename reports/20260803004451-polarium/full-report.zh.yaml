  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层：一个平台，几类很不同的买方
        blocks:
          - type: paragraph
            body: >-
              Polarium 的客户资料足够多元，简单报一个客户数会误导。公司销售对象包括电信基础设施、工业能源用户、家庭、充电运营商，以及一层正在增长的渠道伙伴。在电信中，最可信的买方证明是 ATC
              关系：基础设施业主是买方，电信网络从更强电力韧性中受益。工业场景中，买方更接近寻求韧性和能源成本控制的设施运营方。住宅中，屋主受益，但激活要经过安装商、分销商和电价管理应用编成的网络。充电中，经济买方通常是受电网经济性约束的网络或燃油零售站点业主。这个分层重要，因为客户持久度、销售周期和扩张逻辑在不同垂直场景中差异很大。因此，评价
              Polarium 时，不应把它看作单一客户资产，而应看作一组客户动作的组合，它们共享同一个底层储能平台。
            claimRefs:
              - CU001
