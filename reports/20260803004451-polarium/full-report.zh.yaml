            body: >-
              即便缺少 cohort 数据，Polarium 的公开扩张逻辑仍然可见。住宅增长似乎绑定于 KP Energy 分销、Tibber 关联行为，以及 Greenely、GoSol、Soltech Home
              等相邻安装商或能源伙伴。充电扩张似乎借助 Kempower 和 VAROPreem 等知名品牌。电信和分布式资产群扩张则搭在 ATC 和 RWE 这类重量级关系上。这在战略上合理，因为 Polarium
              可以借用更知名交易对手的分销和信任。但它也引入集中度和依赖风险。旗舰关系可能主导外部感知，同时遮住账本里仍有多少业务不成熟或块状波动。同样，进入住宅可能让
              客户名头更分散，却增加对相对少数分销渠道的依赖。因此，公开证据善于展示扩张入口，却不善于说明客户基础到底有多均衡。
