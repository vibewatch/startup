        blocks:
          - type: paragraph
            body: >-
              Polarium 最强的论点，不是电池化学体系独一无二，而是架构可复用。公司称其内部整合电池模块、BMS、云控制、EMS 和 VPP
              服务。这形成了一条连贯故事：一批最初为在线率部署的电池资产，之后可以被监控、优化，并最终通过电网服务或虚拟电池合同变现。RWE 安排重要，正因为它展示了这种转变。与此同时，Stella Futura
              收购也暴露了原模型的边界：只有软件和电池模块，还不足以保证本地 C&I
              执行能力。住宅证据带来另一重张力。应用体验和分销渠道很重要，但竞争生态也更容易复制这些要素，难度低于复制电信级可靠性记录。因此，Polarium
              的差异化看起来真实但有条件：当模块化部署和软件变现必须同时成立时，它最强。
