              和渠道生态等标杆交易对手。实际看，投委会不应把这些类别分开处理。如果可靠性稳住且融资充足，单季收入偏软还可管理；但如果流动性紧，或一个标杆伙伴项目放缓，同样的疲软会危险得多。
