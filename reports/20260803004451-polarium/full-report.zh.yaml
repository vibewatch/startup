      - number: '1.4'
        title: 2024 年运营重置与披露冲突
        blocks:
          - type: paragraph
            body: >-
              管理层对 2024 年的表述是：稳定确实发生了，但还不完整。Polarium 称销售额增长 15% 至 SEK 1,332M，成本基数削减 40%，负经营现金流从 SEK -655M 改善到 SEK
              -148M。Leif Ottosson 后来告诉 Di，利润率改善，成本基数实际上已削减 50%，2025
              年预算指向正收益。对于资本密集型硬件公司，这些都是有意义的正面信号。但备案快照和叙事并未完全对齐。Allabolag 报告 2024 年收入为 SEK 1,515.1M，EBITDA 为 SEK
              -324.3M，财务项目后结果为 SEK -475M，报告口径下只有 144
              名员工。最合理的解释，是集团沟通口径与法人实体或合并备案口径不同，但公开材料从未调节这些差异。这意味着投资者可以说趋势在改善，却还无法在没有经审计、映射到实体的财务报表前，判断改善的精确速度，甚至无法锁定一致的分母。
