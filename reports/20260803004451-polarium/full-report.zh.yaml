      - number: '2.3'
        title: 没有单一干净 TAM，市场测算必须分镜头看
        blocks:
          - type: paragraph
            body: >-
              公开证据支撑几组有用的市场镜头，但没有一条干净的 TAM。最强的电信需求镜头来自通信塔基础设施：American Tower 称其自 2018 年以来在非洲的可再生能源、储能和效率项目上投入超过
              $350M，每年减少 43.5M 升柴油消耗。这不能直接给出 Polarium 的 SAM，但证明电信站点周边的电力现代化在全网规模下已经对应数亿美元支出。最强的分布式 BESS 镜头来自德国：RWE 预计
              Polarium 的虚拟电池组合将从 2026 年末的 50 MW / 135 MWh，扩至超过 10,000 套系统、约 300 MW / 810 MWh。更广增长镜头来自政策和相邻市场评论：欧盟委员会
              预计全球电池需求到 2030 年增长 14x，而 Polarium 称欧洲 C&I 市场单独到 2030 年可达 37
              GWh。合在一起，这些镜头足以支撑一个巨大且增长中的机会，但它们不能相互替代，投资者也不应把它们压成一个虚假的精确 TAM 数字。
