  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：围绕关键任务在线率和灵活用能的分布式储能
        blocks:
          - type: paragraph
            body: >-
              Polarium
              不应被放进整个全球电池价值链。它真正相关的市场边界，是分布式固定式储能层：电池、控制软件和电力电子一起用于保障在线率、降低能源成本，并越来越多地把灵活性变现。公司从电信备用电源起步，问题很直接：电网薄弱或缺失时让网络站点不断电，同时降低柴油和维护成本。但同一套架构现在已延伸到
              C&I 削峰和备电、住宅自发自用和电价套利、EV
              充电容量支撑，以及虚拟电厂聚合。因此，纳入的支出不只是电池模块本身；还包括机柜、集成、监控、EMS、服务，以及某些场景下的灵活性商业化。排除项应包括上游电芯制造、纯太阳能组件销售，以及 Polarium
              并非天然业主的独立公用事业级 megapack 开发。这个更宽但仍有纪律的市场边界很重要，因为它解释了为什么只看电信案例已经低估 Polarium 的战略野心。
