  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反逻辑：战略可选性强，定价证据弱
        blocks:
          - type: paragraph
            body: >-
              Polarium
              的核心投资逻辑很直接。它是一家真实的后期储能公司，收入有规模，装机基础大，战略动能新鲜，并且有一条从后备电源硬件走向更高质量软件和灵活性收益的可信路径。反逻辑也同样直接：尽管这些要素有吸引力，公司披露仍不足，资本开支重，而且比起完整对齐的财务证据，更依赖合作伙伴验证过的叙事。这两件事可以同时成立。Polarium
              可以是一家高质量公司，但如果价格太高，仍可能是糟糕投资。因此，估值判断必须对价格和证据都敏感，而不是给出泛泛的欣赏分。换句话说，估值争论的重点不在于公司是否真实存在、需求是否真实，而在于战略承诺和股权价值之间还压着多少不确定性。
            claimRefs:
              - CV010
              - CV011
              - CV019
              - CV020
              - CV034
              - CV040
          - type: table
            tableRef: TV002
            claimRefs:
              - CV011
              - CV019
              - CV020
              - CV023
              - CV024
          - type: figure
            figureRef: FV004
            claimRefs:
              - CV034
              - CV035
              - CV036
              - CV040
              - CV041
      - number: '8.2'
        title: 当前估值背景真实但过时，价格发现信号偏弱
        blocks:
          - type: paragraph
            body: >-
              最好的公开估值锚点仍是 2022 年独角兽估值，Tracxn 和 Polarium 股东披露都沿用了这一点。2024
              年融资确实显示投资人继续支持，但这轮资金来自现有支持者，并且伴随信贷额度延期，因此不像一次新的广泛市场重定价。也就是说，投资人看到的是一个过时公开标记，加上后来一轮内部支持融资，而不是干净的新价格。收入背景也仍然混乱，因为公司自己的
              2024 年净销售额与公开登记摘要冲突。这个估值标记可能仍有方向性价值，但不应被当作精确公允价值。可见的头条估值与新鲜价格发现偏弱之间的落差，正是避免过度精确的核心原因。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV021
              - CV022
          - type: table
            tableRef: TV001
            claimRefs:
              - CV034
              - CV035
              - CV036
              - CV041
          - type: figure
            figureRef: FV003
            claimRefs:
              - CV001
              - CV031
              - CV032
              - CV033
      - number: '8.3'
        title: 公开可比公司支持折价，而不是直接迁移估值
        blocks:
          - type: paragraph
            body: >-
              公开可比公司能给讨论划边界，但不能解决问题。Enphase 对渠道和分布式能源软件质量有参考价值。Fluence 更适合作为储能基础设施参照。Tesla
              太宽、太大，不能直接锚定价值。这些公司还享有公开市场透明度和更清晰披露，而 Polarium 目前不具备。这个差异和产品范围一样重要。结果是，在管理层关闭关键尽调缺口之前，Polarium
              应该承受明显的不透明和执行折价。在这个框架下，乐观情景仍可支持超过独角兽的结果，但基准情景应低于过时公开标记，悲观情景则应明显低于它。把这些可比公司当作情景设计护栏，比当作公式更安全。
            claimRefs:
              - CV013
              - CV014
              - CV015
              - CV016
              - CV025
