      - number: '7.5'
        title: 风险结论：只有对流动性、可靠性和伙伴转化做硬跟踪，才适合投资
        blocks:
          - type: paragraph
            body: >-
              现有证据足以相信 Polarium
              有真实产品、真实客户，运营动能也在改善。但证据还不足以让人默认它的风险系统已经成熟。若出现条款偏弱的新融资、重大现场安全或隐私事件、无法把标杆关系转成更广泛且可重复的收入，或发现隐性集中度，投资逻辑都会迅速受损。同样重要的是，正向进展也应被明确跟踪。流动性、认证、伙伴多元化和留存的证据更强，并不会消除风险，但足以支持把公司从高警戒状态，转向更标准的后期运营风险画像。
            claimRefs:
              - CR028
              - CR029
              - CR031
              - CR034
