              生产证据很重要，因为储能硬件在产品页上可能看起来相似，到了现场表现却很不同。在这里，Polarium 有相当多证明。通过 ATC 的电信部署展示了弱电网环境下的现场使用。RWE
              证明了分布式资产群规模的编排能力。家庭能源、充电和工业场景中的具名案例，显示同一套控制和电池思路被复用在不同工作流里。移动应用界面也重要，因为它展示安装商和终端用户在部署后如何真正与系统交互。不过，成熟度曲线并不均匀。电信和核心电池模块看起来最成熟。家庭能源应用生态、消费级
