      - number: '8.4'
        title: 建议：跟踪 / 继续研究；除非价格重置或尽调补齐缺口
        blocks:
          - type: paragraph
            body: >-
              基于目前可得证据，最干净的结论不是买入，而是跟踪 / 继续研究；如果价格明显低于过时独角兽锚点，或尽调补齐最大已知缺口，再愿意接触。原因不是 Polarium
              缺乏战略质量，而是影响价值最大的太多输入——对齐口径后的收入、现金、契约条款、分业务利润率、留存和集中度——仍处于私有或冲突状态。这让当前信心等级只能是中等。投资人应把公司放进雷达，但不能把这误认为可以为尚未承销的上行支付价格。这个建议刻意保守，因为后期私募亏损通常来自在不确定性上付高价，而不是完全错过一家好公司。
            claimRefs:
              - CV034
              - CV035
              - CV036
              - CV037
              - CV040
              - CV041
          - type: table
            tableRef: TV005
            claimRefs:
              - CV037
              - CV039
              - CV041
          - type: table
            tableRef: TV006
            claimRefs:
              - CV037
              - CV038
              - CV039
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV011
              - CV019
              - CV034
              - CV041
      - number: '8.5'
        title: 什么会改变观点：更强证据，或更好价格
        blocks:
          - type: paragraph
            body: >-
              两种截然不同的情况会改善观点。第一，更强证据：经审计的收入口径对账、当前流动性和契约可见度、分业务毛利率、可靠性统计，以及灵活性或服务层确实加深回报的证据。第二，更好价格：如果入场价格显著低于过时公开独角兽锚点，投资人可能因未决风险获得补偿，而不是为这些风险付出溢价。相反，如果融资压力回归、标杆项目无法扩展为可重复收入，或公司被证明比叙事显示得更集中、利润率更低，观点会恶化。关键在于，证据和价格都能改变答案，但两者都不应被预先假设。
            claimRefs:
              - CV037
              - CV038
              - CV039
              - CV041
      - number: '8.6'
        title: 图表
        blocks:
          - type: callout
            title: 当前最佳结论：跟踪，不是买入
            body: Polarium 足够有意思，值得密切观察；但仅凭公开证据，还不足以支撑投资人支付完整的过时独角兽价格。
            calloutType: recommendation
            claimRefs:
              - CV034
              - CV035
              - CV041
          - type: callout
            title: 过时估值标记是陷阱
            body: 即便公司真实存在，如果最显眼的价格锚点已经老旧、由内部支持，并且高于当前披露质量能支撑的水平，它仍可能是弱投资。
            calloutType: risk
            claimRefs:
              - CV001
              - CV002
              - CV021
              - CV031
          - type: callout
            title: 回到上行仍有路径
            body: 如果 Polarium 证明类经常性变现、披露利润率，并持续把标杆关系转成多元化收入，超过独角兽估值的情景并非不合理。
            calloutType: strength
            claimRefs:
              - CV011
              - CV018
              - CV032
              - CV038
