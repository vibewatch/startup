      - number: '1.3'
        title: 资本基础、估值锚点与重整融资
        blocks:
          - type: paragraph
            body: >-
              资本故事分三层：2022 年独角兽时期股权、2024 年重整资本，以及 2026 年扩张可选性。2022 年，Polarium 称 Alecta、Formica 和 Absolute Unlisted 以与
              2022 年春夏融资相同的条款买入超过 SEK 1.1B 旧股，并称更早的 AMF SEK 955M 投资确立了 $1B 估值。这是最干净的公开独角兽锚点。到 2024 年 10
              月，语气已经改变：Polarium 从现有投资人处募集 SEK 500M 可转换优先资本，Reuters 称该业务仍亏损，DNB Carnegie
              披露同一流程还修改并延长了信贷安排。此后，公开数据库对累计融资额的说法出现分歧。Tracxn 报告五轮已披露融资合计约 $274M，暗示公开讨论里部分更大的 SEK
              数字很可能把一级融资和二级股权交易混在一起。结论是，Polarium 仍能从支持性内部股东处获得资本，但准确的优先权栈、债务契约和当前稀释经济账，在公开来源中仍不透明。
