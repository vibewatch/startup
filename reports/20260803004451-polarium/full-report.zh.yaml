            body: >-
              公司有足够公开牵引力信号，说明它不是尚未产生收入的故事。Polarium 称 2024 年净销售额为 SEK 1,332M，已在 80 多个国家部署超过 540,000 块电池。RWE 又通过德国 1,600
              多套系统的虚拟电池组合，提供了新的规模信号。但披露栈很乱。Allabolag 报告 2024 年收入 SEK 1,515.1M，与公司自己的扭转文章存在重大冲突；该登记来源还报告了沉重 EBITDA
              和税前亏损。Reuters 补充了一个正面但更窄的事实——2024 年 9 月是重组后第一个盈利月份——而 Placera 将管理层 2025
              年计划描述为目标全年为正。这些都是有用信号，但不能合成一个干净的投资判断基线。正确解读是改善伴随未解决的披露不一致，而不是已证明的稳态盈利能力。
