  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-disclosure
    missingEvidence: Named board roster, committee composition, independence status, and board minutes or governance policies.
    whyItMatters: Late-stage hardware businesses with amended credit facilities and frequent leadership changes need clear governance visibility for underwriting.
    diligencePath: Request the current board pack, committee charters, shareholder agreement governance rights, and biographies for all directors.
    relatedQuestionRefs:
    - QO008
    - QO025
    relatedTableRefs:
    - TO002
  - type: private-evidence-only
    severity: blocking
    topic: capital-structure
    missingEvidence: Cap table, share-class waterfall, convertible preference terms, and lender covenant package related to the amended credit facilities.
    whyItMatters: Without these documents investors cannot model dilution, downside protection, or refinancing risk.
    diligencePath: Request the cap table, latest shareholder agreement, term sheets for outstanding convertibles/preference shares, and facility agreements.
    relatedQuestionRefs:
    - QO013
    - QO014
    - QO025
    relatedTableRefs:
    - TO003
  - type: conflicting-data
    severity: material
    topic: financial-reporting-scope
    missingEvidence: Reconciled bridge between management-reported 2024 metrics and registry-filed 2024 metrics, including entity scope and accounting basis.
    whyItMatters: Core diligence questions on growth, margin improvement, and employee efficiency depend on knowing which denominator is correct.
    diligencePath: Obtain audited 2024 consolidated statements and a management bridge that maps company communications to legal-entity or group reporting lines.
