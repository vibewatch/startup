- id: operational-reset-and-disclosure-conflicts
  title: 2024 operational reset and disclosure conflicts
  body: Management's 2024 message is one of real, but incomplete, stabilization. Polarium said sales rose 15% to SEK 1,332 million, the cost base was cut 40%, and negative operating cash flow improved to SEK -148 million from SEK -655 million. Leif Ottosson later told Di that margins improved, the cost base had effectively been cut 50%, and the 2025 budget pointed to positive earnings. Those are meaningful positives for a capital-intensive hardware company. Yet the filing snapshots are not fully aligned with the narrative. Allabolag reports 2024 revenue of SEK 1,515.1 million, EBITDA of SEK -324.3 million, result after financial items of SEK -475 million, and only 144 employees in the reporting perimeter. The most plausible explanation is differing scope between group communications and the legal entity or consolidated filing basis, but public materials never reconcile the differences. That means investors can say the trajectory is improving, but they cannot yet underwrite the exact pace
    or even the consistent denominator without audited, entity-mapped financial statements.
  claimRefs:
  - CO024
  - CO025
  - CO026
  - CO027
  - CO028
