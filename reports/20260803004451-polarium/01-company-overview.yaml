callouts:
- calloutType: strength
  title: Strategic breadth is now real, not aspirational
  body: 'By 2026 Polarium was no longer relying only on telecom towers: RWE virtual-battery aggregation, VAROPreem charging deployments, Stella Futura, and KP Energy distribution all show multiple commercial paths for the same underlying battery-and-software stack.'
  claimRefs:
