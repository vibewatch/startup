- calloutType: risk
  title: Disclosure quality still lags valuation history
  body: Public sources disagree on 2024 revenue, employee count, legal naming, and manufacturing footprint. That does not disprove the turnaround, but it does mean the underwriting burden remains high until Polarium provides reconciled audited materials.
  claimRefs:
  - CO006
  - CO028
  - CO038
- calloutType: assumption
  title: Treat the 2022 $1B valuation as the last clean public mark
  body: Open sources support unicorn status via the 2022 AMF round and later owner disclosures, but the 2024 capital raise did not publish a refreshed post-money valuation. Any current valuation thesis should therefore anchor on 2022 and adjust for execution since then rather than assume a new step-up.
  claimRefs:
  - CO022
  - CO023
