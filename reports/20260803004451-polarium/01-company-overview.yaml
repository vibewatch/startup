- id: leadership-and-governance
  title: Leadership reset and governance visibility
  body: Leadership changed materially during the turnaround period. Stefan Jansson still appeared as founder-CEO in the 2022 owner-broadening release, while the October 2024 financing quoted Clas Gunneberg as CEO; by May 2025 and May 2026, Polarium was publicly fronted by Leif Ottosson, suggesting a rapid succession sequence during the reset. In January 2026 the company also added Jens Bruno as CFO and elevated Pontus Winberg to lead the Residential and C&I unit, while Jan Roschek took the Managing Director role for Germany in May 2026. Those appointments show a company professionalizing around broader verticals and geography, not just telecom. The weak point is governance disclosure. Polarium's investor-relations page explains board and CEO responsibilities in generic terms but does not publish named directors, committee composition, independent oversight, or detailed governance policies. For a company with unicorn-era valuation claims and amended credit facilities, that lack of governance
    transparency is a real diligence gap rather than a cosmetic omission.
  claimRefs:
  - CO011
  - CO012
  - CO013
