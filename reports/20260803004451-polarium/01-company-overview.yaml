company:
  name: Polarium
chapter:
  number: 1
  title: Company Overview
  summary: Polarium is a Stockholm-based private Swedish energy-storage company founded in 2015 that began in telecom reserve power and has expanded into commercial, industrial, residential, EV-charging, and virtual-power-plant applications. Public evidence shows a genuine 2024 operational reset—SEK 500 million of convertible preference financing, better cash burn, and multiple 2025-2026 expansion milestones—but governance disclosure, capital structure, and even some reported revenue and footprint facts remain inconsistent across public sources.
sections:
- id: identity-and-evolution
  title: Identity and segment evolution
  body: 'Polarium is best understood as a late-stage private Swedish energy-storage platform that started in telecom reserve power and has been deliberately migrating into broader distributed-storage workflows. The company says it was founded in 2015 in Stockholm and now sells modular lithium-ion systems for telecom backup, commercial and industrial energy optimization, and residential batteries. The official site frames that journey explicitly: market leadership in telecom reserve power by 2019, expansion beyond telecom in 2020, a revenue milestone and Vietnam manufacturing in 2021, and new applications ranging from home batteries to EV charging and virtual-power-plant aggregation by 2025-2026. Public scale signals are meaningful but not perfectly clean. Management markets 540,000-plus installed batteries across 80 countries and roughly 400 employees, while investor-relations materials describe an installed base across 75-plus countries and a global footprint spanning four continents. The
    broad direction is clear—Polarium is no longer only a telecom battery vendor—but several numeric disclosures are still marketing-level rather than fully reconciled corporate reporting.'
  claimRefs:
