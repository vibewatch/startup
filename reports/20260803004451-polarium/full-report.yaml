      - number: '4.4'
        title: Capital adequacy remains the central forward financial question
        blocks:
          - type: paragraph
            body: >-
              The 2024 financing package is the key hard fact for forward underwriting. Polarium raised SEK 500 million
              from existing investors and simultaneously amended and extended credit facilities. That combination is
              telling: the company could access supportive capital, but it still needed a broader balance-sheet reset
              rather than just incremental growth capital. Since then, Polarium has expanded ambitions across Germany,
              residential channels, C&I execution, and charging. Those moves can improve strategic position, yet they
              also consume working capital before they reliably throw off cash. Public sources do not disclose cash on
              hand, burn, inventory turns, debt covenants, or runway. So capital adequacy cannot be answered from the
              outside with precision. The best evidence-based stance is that the turnaround bought time and preserved
              strategic options, but future funding needs will remain closely tied to delivery pace, inventory
              discipline, and how quickly new segments convert from announced partnerships into cash-generating
              deployments.
