      - number: '3.4'
        title: Switching costs exist, but public evidence still points to moderate rather than absolute lock-in
        blocks:
          - type: paragraph
            body: >-
              There are genuine switching frictions in this market. Once telecom or industrial systems are approved,
              installed, and integrated into remote-monitoring workflows, buyers may prefer proven suppliers. But those
              frictions should not be confused with a software monopoly. Technology-agnostic project development,
              chemistry-agnostic architecture, and project-based pricing all limit visible lock-in. Public sources do
              not show a patent wall, proprietary standard, or disclosed renewal data strong enough to prove durable
              pricing power. Instead, Polarium's moat is better described as executional: vertical integration,
              segment-specific know-how, and the ability to add service or flexibility value on top of hardware. That is
