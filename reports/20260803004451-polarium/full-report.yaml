      - number: '2.3'
        title: Sizing must be lens-based because no single clean TAM is public
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports several useful market lenses, but not a clean one-line TAM. The strongest
              telecom-demand lens comes from tower infrastructure: American Tower says it has invested more than $350
              million in Africa since 2018 on renewables, energy storage, and efficiency, reducing diesel use by 43.5
              million litres annually. That does not tell us Polarium's SAM directly, but it proves that power
              modernization around telecom sites already commands hundreds of millions of dollars at fleet scale. The
              strongest distributed-BESS lens comes from Germany, where RWE expects Polarium's virtual-battery portfolio
              to scale from 50 MW / 135 MWh in late 2026 toward roughly 300 MW / 810 MWh across more than 10,000
              systems. The strongest broader growth lens comes from policy and adjacent market commentary: the European
              Commission expects global battery demand to rise 14x by 2030, while Polarium says the European C&I market
              alone could reach 37 GWh by 2030. Together these lenses justify a large and growing opportunity, but they
              are not interchangeable, and investors should resist collapsing them into one falsely precise TAM figure.
            claimRefs:
              - CM018
              - CM019
              - CM020
              - CM021
              - CM022
              - CM023
              - CM024
              - CM036
          - type: table
            tableRef: TM002
            claimRefs:
              - CM019
              - CM020
              - CM021
              - CM022
              - CM023
              - CM024
      - number: '2.4'
        title: Growth drivers are converging across telecom, industrial, residential, and charging segments
        blocks:
          - type: paragraph
            body: >-
              The same secular forces keep reappearing across Polarium's evidence base. In telecom, unreliable grids and
              diesel dependence make uptime and fuel savings the primary adoption triggers. In C&I and residential, the
              key driver becomes electricity-price volatility and the value of storing cheap or self-generated power for
              later use. In EV charging, the problem shifts again toward connection constraints, capacity tariffs, and
              the need to deliver high-power charging before the grid is upgraded. Overlaying those use cases is a
              broader software-led driver: once batteries are digitally connected, backup assets can also earn value in
              balancing or flexibility markets. That is what turns storage from insurance to an operating asset.
              Regulation reinforces the trend rather than creating it from zero. The European battery framework adds
              lifecycle and circularity obligations while also validating that batteries are becoming strategic
              infrastructure. The result is a market where the reasons to buy differ by segment, but the direction of
              travel is consistent: distributed storage is moving from niche green hardware toward core energy-system
              infrastructure.
            claimRefs:
              - CM009
              - CM011
              - CM013
              - CM015
              - CM016
              - CM025
              - CM026
              - CM027
              - CM028
              - CM037
          - type: table
            tableRef: TM004
            claimRefs:
              - CM009
              - CM011
              - CM013
              - CM015
              - CM016
              - CM025
              - CM026
              - CM027
              - CM028
              - CM029
              - CM030
      - number: '2.5'
        title: Adoption constraints remain real, and open-source market data is still incomplete
        blocks:
          - type: paragraph
            body: >-
              None of the growth drivers remove the practical constraints. Batteries remain capital-intensive, and
              Polarium itself had to recapitalize in 2024, which reminds us that supplier financing strength is part of
              the buyer decision. Industrial deployments can also be slowed by insurance, emergency-service approvals,
              and project-specific engineering. Residential scale depends on trusted channel partners and software
              integrations, not just product specifications. Meanwhile, large incumbents like Huawei, BYD, and Enphase
              define what buyers now expect around uptime, power-electronics integration, warranties, and remote
              operations. The biggest analytical limitation is that several of the market numbers available to the
              public are company-supplied or adjacent-demand proxies rather than independent segment-sized estimates. We
              do not have Polarium's segment revenue mix, contract durations, conversion rates, or churn by vertical.
              That means the market thesis is directionally attractive and increasingly multi-segment, but precise
              underwriting still requires private cohort, pipeline, and segment-margin data.
            claimRefs:
              - CM029
              - CM030
              - CM031
              - CM032
              - CM033
              - CM036
      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: The market is best read as several adjacent wedges, not one monolithic TAM
            body: >-
              Telecom uptime, industrial price protection, EV-charging capacity support, and residential
              self-consumption are different buying motions. Polarium wins when one battery-and-software stack can cross
              those motions without forcing separate products or sales organizations for each.
            calloutType: insight
            claimRefs:
              - CM001
              - CM003
              - CM034
          - type: callout
            title: Public market data is still too coarse for precision underwriting
            body: >-
              The best open-source numbers are adjacent-demand lenses—towerco spend, policy growth, projected portfolio
              MWh—not Polarium-specific segment TAM, SAM, or conversion rates. Investors should expect a large
              opportunity, but not pretend they can price it precisely from public data alone.
            calloutType: risk
            claimRefs:
              - CM019
              - CM021
              - CM022
              - CM023
              - CM036
          - type: callout
            title: Backup economics are giving way to platform economics
            body: >-
              The RWE agreement is strategically important because it shows how Polarium can turn already-deployed
              batteries from insurance assets into dispatchable infrastructure, materially improving the market
              narrative versus a one-off hardware sale.
            calloutType: strength
            claimRefs:
              - CM018
              - CM023
              - CM027
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive boundary: Polarium is a niche integrated challenger across several adjacent markets'
        blocks:
          - type: paragraph
            body: >-
              Polarium's competitor set only makes sense when the market is segmented. In telecom reserve power, the
              most relevant comparison is with integrated site-power incumbents such as Huawei and with status-quo
              diesel-plus-lead-acid systems. In C&I storage, the field broadens to project developers, EPCs, and
              technology-agnostic storage suppliers. In residential, the fight moves closer to app quality, installer
              channels, and brand trust. In charging infrastructure, batteries compete against both rival BESS vendors
              and expensive but sometimes unavoidable grid upgrades. This means Polarium is not trying to beat one
              universal rival so much as prove that its modular hardware-plus-software stack can beat different
              alternatives in different workflows. That is strategically attractive, but it also means the company
              rarely enjoys a single dominant advantage everywhere. The most reasonable framing is a niche integrated
              challenger with some strong proof points, not a platform that already controls the category.
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP007
              - CP008
              - CP039
