              Open sources support unicorn status via the 2022 AMF round and later owner disclosures, but the 2024
              capital raise did not publish a refreshed post-money valuation. Any current valuation thesis should
              therefore anchor on 2022 and adjust for execution since then rather than assume a new step-up.
