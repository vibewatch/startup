      - number: '1.3'
        title: Capital base, valuation anchor, and turnaround financing
        blocks:
          - type: paragraph
            body: >-
              The capital story splits into three layers: 2022 unicorn-era equity, 2024 turnaround capital, and 2026
              expansion optionality. In 2022 Polarium said Alecta, Formica, and Absolute Unlisted bought more than SEK
              1.1 billion of existing shares on the same terms as the spring and summer 2022 raises, and that an earlier
              AMF investment of SEK 955 million had established a $1 billion valuation. That is the cleanest public
              unicorn anchor. By October 2024 the tone had changed: Polarium raised SEK 500 million of convertible
              preference capital from existing investors, Reuters called the business loss-making, and DNB Carnegie
              disclosed that the same process also amended and extended credit facilities. Public databases then diverge
              on total capital raised. Tracxn reports roughly $274 million across five disclosed rounds, implying that
              some larger SEK figures in public discourse likely mix primary financing with secondary share sales. The
              bottom line is that Polarium has been able to keep attracting capital from supportive insiders, but the
              exact preference stack, debt covenants, and current dilution economics remain opaque from open sources.
            claimRefs:
              - CO017
              - CO018
              - CO019
              - CO020
              - CO021
              - CO022
              - CO023
