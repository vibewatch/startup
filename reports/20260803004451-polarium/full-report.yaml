            body: >-
              Polarium's public surfaces point to a multi-segment revenue model built on energy-storage hardware and
              associated project delivery. Telecom batteries remain the oldest and most legible business. Newer streams
              now include C&I storage, EV-charging support, and residential home batteries sold through channels.
              Services, monitoring, and energy-optimization capabilities clearly exist, but the company does not
              disclose whether they are billed separately, bundled into product gross margin, or reserved for specific
              partner structures such as RWE tolling. That matters because the core underwriting question is whether
              Polarium is mainly a project-and-hardware vendor with some software attached, or whether software,
              orchestration, and flexibility revenue can eventually raise margins and recurring revenue quality. Public
