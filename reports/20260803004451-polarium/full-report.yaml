  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: distributed storage around mission-critical uptime and flexible energy use'
        blocks:
          - type: paragraph
            body: >-
              Polarium does not belong in the entire global battery value chain. Its relevant market boundary is the
              distributed stationary-storage layer where batteries, control software, and power electronics are used to
              secure uptime, reduce energy cost, and increasingly monetize flexibility. The company began in telecom
              reserve power, where the problem is straightforward: keep network sites alive when the grid is weak or
              absent, while lowering diesel and maintenance costs. But the same architecture now stretches into C&I peak
              shaving and backup, residential self-consumption and tariff arbitrage, EV-charging capacity support, and
              virtual-power-plant aggregation. That means the included spend is not just the battery module itself; it
              includes cabinets, integration, monitoring, EMS, service, and in some cases flexibility commercialization.
              Excluded spend should include upstream cell manufacturing, pure solar module sales, and stand-alone
              utility-scale megapack development where Polarium is not the obvious natural owner. This broader but still
              disciplined market boundary matters because it explains why telecom case studies alone now understate
              Polarium's strategic ambition.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM022
              - CM034
