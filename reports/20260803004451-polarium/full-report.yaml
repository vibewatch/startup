      - number: '2.2'
        title: Buyer map and adoption path vary sharply by segment
        blocks:
          - type: paragraph
            body: >-
              The buyer, user, and payer are not constant across Polarium's segments, which is why a single go-to-market
              template would fail. In telecom, the economic buyer is often a tower company or network operator, while
              the user is the site-operations team that values uptime, fuel reduction, and remote monitoring. In C&I,
              the buyer is usually a plant owner or operations manager trying to control power quality, peak-cost
              exposure, and downtime risk. In residential, the user and payer collapse into the homeowner, but the route
              to market runs through installers, retailers, and energy apps such as Tibber. In EV charging, the economic
              buyer can be a charge-point operator or fuel retailer that cannot justify waiting for a larger grid
              connection. The adoption path also changes: telecom often scales fleetwide after specification approval,
              industrial sites may start with one facility and then expand, residential volumes depend on installer
              channels, and flexibility monetization only appears after batteries are deployed and digitally connected.
              Those differences mean Polarium participates in several adjacent markets that share hardware DNA but have
              different budget owners and proof requirements.
            claimRefs:
              - CM006
              - CM007
              - CM010
              - CM012
              - CM014
              - CM017
              - CM035
