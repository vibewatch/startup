  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: 'Customer segmentation: one platform, several very different buyer types'
        blocks:
          - type: paragraph
            body: >-
              Polarium's customer surface is diverse enough that a simple customer-count claim would mislead. The
              company sells into telecom infrastructure, industrial energy users, households, charging operators, and a
              growing layer of channel partners. In telecom, the most credible buyer proof is the ATC relationship,
              where the infrastructure owner is the buyer and telecom networks benefit from better power resilience. In
              industrial settings, the buyer is closer to the facility operator seeking resilience and energy-cost
              control. In residential, the homeowner benefits, but activation runs through a mesh of installers,
              distributors, and tariff-management apps. In charging, the economic buyer is often a network or
              fuel-retail site owner constrained by grid economics. This segmentation matters because customer
              durability, sales cycles, and expansion logic differ sharply by vertical. Polarium should therefore be
              judged less as a single customer franchise and more as a portfolio of customer motions sharing the same
              underlying energy-storage platform.
