      - number: '3.2'
        title: Polarium differentiates most through reuse of one stack across telecom, C&I, home, and flexibility use cases
        blocks:
          - type: paragraph
            body: >-
              The strongest case for Polarium is not that its batteries are chemically unique, but that its architecture
              is reusable. The company says it combines battery modules, BMS, cloud controls, EMS, and VPP services
              in-house. That creates a coherent story: a fleet first deployed for uptime can later be monitored,
              optimized, and eventually monetized through grid services or virtual-battery contracts. The RWE
              arrangement matters because it demonstrates exactly that transition. At the same time, the Stella Futura
              acquisition shows a limit to the original model: software and battery modules alone were not enough to
              guarantee local C&I execution strength. Residential evidence creates another tension. The app experience
              and distribution channel matter, but those are also easier for a rival ecosystem to copy than a
              telecom-grade reliability track record. So Polarium's differentiation looks real but conditional: it is
              strongest where modular deployment and software monetization matter together.
            claimRefs:
              - CP005
              - CP006
              - CP015
              - CP016
              - CP024
              - CP035
