      - number: '1.5'
        title: Milestones now point to a broader distributed-energy platform
        blocks:
          - type: paragraph
            body: >-
              Polarium's newest public milestones show a company trying to monetize the same battery-and-software stack
              in more ways than telecom backup alone. The RWE agreement aggregates at least 1,600 German systems into a
              50 MW / 135 MWh virtual battery, which moves the thesis from hardware sales toward recurring flexibility
              monetization. The Näst Energy Lab project places Polarium in an integrated local-energy and
              vehicle-to-grid environment, while the VAROPreem partnership uses modular BESS plus EMS to work around
              constrained grid connections for EV charging. On the residential side, the KP Energy partnership and
              subsequent Nordic stocking announcement created a clearer distribution route for Polarium Home. The Stella
              Futura acquisition extends that broadening further into C&I system design and EPC execution, with a 100 MW
              regional deployment target. These are credible signs of platform ambition. They do not remove the old
              telecom DNA, but they do suggest that Polarium's strategic destination is distributed energy
              infrastructure rather than a single-product battery niche.
