  topStrengths:
    - Polarium 拥有可观装机基础和长期电信经验，真实部署证据足以把它同概念化电池故事区分开。
    - 公司已拓展到住宅、工商业、EV 充电和灵活性用例，备用电源硬件之外也有可信上行空间。
    - 现有投资者在 2024 年资本重组中继续支持公司，RWE 等合作伙伴也给出新证据，说明平台可能承载质量更高的变现层。
  topRisks:
    - 最好的公开估值锚点仍是 2022 年过时的独角兽标记，新一轮外部价格发现薄弱，且主要由内部投资者主导。
    - 财务披露仍不均衡：公开来源对 2024 年收入说法冲突，也没有厘清现金、债务契约或优先股堆叠经济条款。
    - 业务仍偏硬件、资本密集，执行失误或再次出现流动性压力，都可能迅速压缩股权价值。
    - 住宅、工商业、充电和灵活性业务提高了选择权，但在经济性完全跑通前，也会增加营运资本需求和执行复杂度。
  unresolvedGaps:
    - 需要经审计的 2024 年收入与报告范围调节，才能依赖任何单一公开倍数基准。
    - 需要看清当前现金、债务、债务契约和优先股堆叠，才能承保下行与稀释风险。
    - 需要分部毛利率、留存、合作伙伴或客户集中度数据，判断 Polarium 该享受平台溢价还是硬件折价。
    - 需要 2025-2026 年新的独立估值标记或广泛定价交易，替换过时的独角兽锚点。
