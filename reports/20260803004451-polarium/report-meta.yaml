    - "The business remains hardware-heavy and capital intensive, so execution mistakes or renewed liquidity stress could compress equity value quickly."
    - "Residential, C&I, charging, and flexibility expansion improve optionality but also increase working-capital needs and execution complexity before economics are fully proven."
  unresolvedGaps:
