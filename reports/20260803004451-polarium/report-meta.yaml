companyProfile:
  summary: >-
    Polarium is a Stockholm-based private Swedish energy-storage company founded in 2015 that started in telecom reserve power and has expanded into commercial and industrial storage, residential batteries, EV-charging support, and virtual-power-plant style flexibility workflows. Public evidence supports a real installed base, meaningful revenue, continued insider financial support through the October 2024 SEK 500M recapitalization, and credible strategic momentum through partnerships such as RWE and KP Energy plus the Stella Futura acquisition. The core diligence tension is that Polarium looks operationally real and strategically interesting, but the company still does not disclose enough reconciled financial and capital-structure detail to justify aggressive valuation precision.
