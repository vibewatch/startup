  topStrengths:
    - "Polarium has a meaningful installed base, long telecom heritage, and enough real deployment proof to separate it from speculative battery narratives."
    - "The company has broadened into residential, C&I, EV-charging, and flexibility use cases, creating plausible upside beyond reserve-power hardware alone."
    - "Existing investors continued to support the company through a 2024 recapitalization, and partners such as RWE provide fresh evidence that the platform can support higher-quality monetization layers."
  topRisks:
    - "The best public valuation anchor is still the stale 2022 unicorn mark, while fresh external price discovery remains weak and insider-led."
