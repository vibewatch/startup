- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Company solution
  - Measurable benefit
  - Limitation
  rows:
  - - Keep telecom site online
    - Diesel + lead-acid backup with manual servicing
    - Connected lithium battery plus remote fleet management
    - Lower diesel dependence, improved monitoring, better uptime
    - Public proof lacks published SLA / failure-rate detail
  - - Run industrial site more efficiently
    - Buy grid power, absorb peaks, add manual backup
    - Modular BESS with EMS and services
    - Peak management, resilience, energy optimization
    - Project economics vary by site and are not public
  - - Deliver charging on constrained grid
    - Wait for grid upgrade or limit charger power
    - BESS plus EMS for peak and capacity management
    - Higher charging power without full grid reinforcement
    - Long-run utilization economics not public
  - - Optimize home self-consumption
    - Solar without flexible storage control
    - Home battery with app and energy-platform integration
    - Tariff arbitrage, flexibility, visibility
    - Consumer support and app-retention data not public
  - - Monetize distributed battery fleet
    - Backup-only installed assets
    - VPP / tolling orchestration with partner trader
    - Additional value beyond insurance use case
    - Commercial terms and realized margins undisclosed
  notes: Benefits are outcome categories evidenced by retained sources, not generalized ROI claims.
