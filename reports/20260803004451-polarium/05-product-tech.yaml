- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / certification / quality metric
  - Status
  - Scope
  - Gap
  rows:
  - - Privacy policy and GDPR process
    - publicly documented
    - Company-wide, with explicit Home app data handling
    - No external privacy audit detail retained
  - - Standard contractual clauses for extra-EEA transfers
    - publicly documented
    - Personal-data transfers outside EU/EEA
    - Does not itself prove broader security posture
  - - Home app third-party analytics disclosure
    - publicly documented
    - Residential app usage improvement
    - Need vendor list, retention policy, and opt-out controls detail
  - - Battery-regulation backdrop
    - external requirement
    - Lifecycle and traceability obligations across battery value chain
    - Need product-specific compliance roadmap
  - - Sustainability framing
    - publicly documented
    - Lifecycle, impact, and stakeholder positioning
    - Need harder public certification / quality metrics
  - - Field reliability statistics
    - not publicly disclosed
    - Installed product fleet
    - Major diligence gap before underwriting durability
  notes: Publicly documented trust controls are real, but they do not substitute for third-party certification depth or failure-rate disclosure.
