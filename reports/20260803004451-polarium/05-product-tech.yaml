- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Battery modules / strings
    - Store energy and provide electrical backbone
    - Cell supply, pack assembly, thermal design
    - Commodity pressure and field-failure risk
  - - BMS
    - Controls safety, state-of-charge, and state-of-health behavior
    - Embedded software and sensors
    - Incorrect controls can create safety or reliability exposure
  - - Connectivity / cloud layer
    - Enables monitoring, remote updates, and fleet management
    - Network availability, cloud services, telemetry pipeline
    - Outages degrade service visibility and control
  - - EMS / orchestration
    - Optimizes dispatch, charging, and flexibility use
    - Data quality, forecasting, partner interfaces
    - Poor control logic can reduce value capture or stress assets
  - - Operational services
    - Engineering, commissioning, O&M, lifecycle support
    - Partner / field-service execution
    - Service inconsistency can erode customer trust
  - - Apps / UX layer
    - Installer and homeowner interaction surface
    - Mobile software, analytics tooling, energy-platform integrations
    - UX or privacy issues can hurt adoption and trust
  notes: This table focuses on the operating stack visible in public evidence, not every internal subsystem.
