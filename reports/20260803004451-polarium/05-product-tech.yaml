  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: reliability-and-certifications
    missingEvidence: Third-party certifications by product line, measured field-failure rates, warranty-claim history, and SLA commitments.
    whyItMatters: These are the documents and metrics that distinguish a credible integrated platform from a merely polished product story.
    diligencePath: Request certification pack, reliability dashboard, warranty reserve history, and field incident log by product family.
    relatedQuestionRefs:
    - QE010
    - QE023
    - QE025
    relatedTableRefs:
    - TE004
    - TE005
  - type: private-evidence-only
    severity: material
    topic: software-economics
    missingEvidence: Attach rates, monetization, uptime, and support-cost economics for Connect, Home, fleet-management, and orchestration layers.
    whyItMatters: Software and services are central to differentiation but not yet financially or operationally quantified publicly.
    diligencePath: Request MAU / active-site metrics, service penetration, uptime, and support-cost data by software surface.
    relatedQuestionRefs:
    - QE011
    - QE015
    - QE024
    - QE025
    relatedTableRefs:
    - TE003
    - TE005
  - type: missing-source
    severity: material
    topic: partner-service-depth
    missingEvidence: Independent evidence on global field-service capacity and support responsiveness outside named showcase deployments.
    whyItMatters: Public partner and deployment proof does not by itself prove service scalability across geographies.
    diligencePath: Request service footprint map, partner-certification standards, and mean-time-to-repair statistics.
    relatedQuestionRefs:
    - QE012
    - QE020
    relatedTableRefs:
    - TE002
    - TE004
