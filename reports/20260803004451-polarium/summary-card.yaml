  topStrengths:
    - >-
      Polarium has a meaningful installed base, long telecom heritage, and enough real deployment proof to separate it
      from speculative battery narratives.
    - >-
      The company has broadened into residential, C&I, EV-charging, and flexibility use cases, creating plausible upside
      beyond reserve-power hardware alone.
    - >-
      Existing investors continued to support the company through a 2024 recapitalization, and partners such as RWE
      provide fresh evidence that the platform can support higher-quality monetization layers.
  topRisks:
    - >-
      The best public valuation anchor is still the stale 2022 unicorn mark, while fresh external price discovery
      remains weak and insider-led.
    - >-
      Financial disclosure remains uneven: public sources conflict on 2024 revenue and do not resolve cash, debt
      covenants, or preference-stack economics.
    - >-
      The business remains hardware-heavy and capital intensive, so execution mistakes or renewed liquidity stress could
      compress equity value quickly.
    - >-
      Residential, C&I, charging, and flexibility expansion improve optionality but also increase working-capital needs
      and execution complexity before economics are fully proven.
  unresolvedGaps:
    - Need audited reconciliation of 2024 revenue and reporting scope before relying on any single public multiple base.
    - Need current cash, debt, covenant, and preference-stack visibility to underwrite downside and dilution risk.
    - >-
      Need segment gross margins, retention, and partner or customer concentration data to judge whether Polarium
      deserves a platform premium or a hardware discount.
    - >-
      Need a fresh 2025-2026 independent valuation mark or broadly priced transaction to replace the stale unicorn
      anchor.
