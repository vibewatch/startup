figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Journey varies by segment, but most paths run through a partner or infrastructure owner before reaching sustained operational use.
  data:
    items:
    - label: 1. Problem discovery
      stage: Discovery
      actor: Towerco / facility operator / homeowner / charging network
      action: Recognizes weak-grid, tariff, resilience, or charging-constraint problem
      pain: Diesel cost, price volatility, grid limits, or outage exposure
      outcome: Search for storage-based solution
    - label: 2. Partner or channel evaluation
      stage: Evaluation
      actor: Polarium + partner ecosystem
      action: Case studies, installer/distributor route, or technical-fit review
      pain: Need credible proof and local support
      outcome: Pilot or direct project selection
    - label: 3. Deployment
      stage: Deployment
      actor: Installers / site teams / project teams
      action: Battery system installed and commissioned
      pain: Project complexity and integration risk
      outcome: Operational energy storage asset
    - label: 4. Operational use
      stage: Live use
      actor: Operations team / homeowner / charging operator
      action: Uses battery for uptime, savings, or charging support
      pain: Need trust in reliability and controls
      outcome: Outcome proof and daily workflow adoption
    - label: 5. Expansion / monetization
      stage: Expansion
      actor: Customer, distributor, or trader
      action: Adds more sites, more channels, or flexibility monetization
      pain: Economics and partner dependence
      outcome: Higher account value or fleet-scale programs
