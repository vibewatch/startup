  - - Telecom infrastructure
    - Towerco buyer; network operations users; infra budget payer
    - Reserve power, diesel reduction, uptime
    - ATC relationship since 2017 plus factory context
    - Historically core and strategically credible
    - No operator-level cohort or revenue split disclosed
  - - Industrial / C&I
    - Facility owner / operations team / energy budget
    - Resilience, peak management, grid services
    - Grönlunds production case
    - Proof of broader monetization than backup-only
    - No project win-rate or repeat-purchase data
  - - Residential households
    - Homeowner user; installer / channel influences purchase
    - Self-consumption, tariff arbitrage, flexibility
    - Homevolt, Magnerholt, Lindberg & Son, KP Energy distribution
    - Logo-count diversification and ecosystem expansion
    - No activation, churn, or channel-margin data
  - - EV charging / fuel retail
    - Charging operator or fuel network
    - Grid-constrained high-power charging
    - Kempower and VAROPreem proofs
    - Strategic adjacency with rising electrification demand
    - Site counts and economics remain thin
  - - Flexibility / distributed fleets
    - Portfolio operator or trader
    - Dispatchable distributed storage
    - RWE virtual battery
    - High signaling value and recurring-value potential
    - Current revenue contribution and contract durability unknown
  notes: Scale signal means visible public proof, not disclosed revenue size.
