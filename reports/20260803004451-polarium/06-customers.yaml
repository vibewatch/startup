company:
  name: Polarium
chapter:
  number: 6
  title: Customers
  summary: 'Polarium has real production customer proof across telecom, industrial storage, residential home energy, and charging infrastructure. The strongest public evidence is specific and outcome-linked rather than logo-only, especially in the ATC and RWE relationships. The major remaining gap is not adoption proof but durability proof: public sources still do not disclose retention, expansion cohorts, or concentration by customer and channel.'
sections:
- id: customer-segmentation
  title: 'Customer segmentation: one platform, several very different buyer types'
  body: Polarium's customer surface is diverse enough that a simple customer-count claim would mislead. The company sells into telecom infrastructure, industrial energy users, households, charging operators, and a growing layer of channel partners. In telecom, the most credible buyer proof is the ATC relationship, where the infrastructure owner is the buyer and telecom networks benefit from better power resilience. In industrial settings, the buyer is closer to the facility operator seeking resilience and energy-cost control. In residential, the homeowner benefits, but activation runs through a mesh of installers, distributors, and tariff-management apps. In charging, the economic buyer is often a network or fuel-retail site owner constrained by grid economics. This segmentation matters because customer durability, sales cycles, and expansion logic differ sharply by vertical. Polarium should therefore be judged less as a single customer franchise and more as a portfolio of customer motions
    sharing the same underlying energy-storage platform.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: named-proof-and-adoption
  title: Named proof is real and multi-segment, with strongest evidence at production outcome level
  body: 'The positive surprise in Polarium''s public customer evidence is that it is not limited to logos. The strongest proofs contain specific use cases and outcomes: ATC shows long-lived telecom fleet use and diesel-reduction context, RWE shows dispatchable German distributed storage, Grönlunds shows industrial optimization and grid-service participation, Homevolt shows end-user behavior tied to Tibber, and Kempower plus VAROPreem show charging-site relevance. These proofs differ in depth, but together they establish that the company is serving more than a single niche. The broader cases surface and recurring residential releases further suggest that management is consciously building a repeatable proof library. What public evidence does not yet show is the denominator: how many similar sites exist, how often cases repeat, and whether adoption beyond the named references is broad or concentrated. The proof base is therefore strong enough to validate relevance, but not yet broad enough
    to answer portfolio-shape questions.'
  claimRefs:
  - CU007
  - CU008
  - CU009
  - CU010
  - CU011
  - CU012
  - CU013
  - CU014
