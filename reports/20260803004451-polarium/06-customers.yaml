- id: retention-and-durability
  title: Retention and durability remain the thinnest part of the public customer story
  body: Customer-proof quality is not the same thing as customer durability. Public sources do not disclose NRR, GRR, churn, renewal rates, contract lengths, or account-expansion curves. There are good reasons to believe some switching costs exist—telecom integration depth, app-linked behavior, installed battery fleets, and service relationships are not trivial to unwind—but public evidence stops short of proving those in cohort form. Even community signals such as the Home app and Home Assistant integration only show post-installation engagement, not commercial durability. This leaves a persistent gap between product relevance and revenue quality. Investors can reasonably conclude that Polarium has won real use cases; they cannot yet conclude how sticky those wins are, how often they renew, or whether one initial deployment typically leads to a broader multi-site footprint. That is the single biggest missing layer in the customer chapter.
  claimRefs:
  - CU018
  - CU019
  - CU020
  - CU028
  - CU032
  tableRefs:
  - TU004
  figureRefs:
  - FU004
- id: expansion-and-concentration
  title: Expansion likely runs through ecosystems and flagship accounts, which also creates concentration risk
  body: Polarium's public expansion logic is visible even if its cohort data is not. Residential growth appears tied to ecosystem distribution through KP Energy, Tibber-linked behavior, and adjacent installer or energy partners such as Greenely, GoSol, and Soltech Home. Charging expansion appears to leverage recognized brands like Kempower and VAROPreem. Telecom and distributed-fleet expansion ride on heavyweight relationships such as ATC and RWE. This is strategically sensible because it lets Polarium borrow distribution and trust from better-known counterparties. But it also introduces concentration and dependence risk. Flagship relationships can dominate external perception while hiding how much of the book is still immature or lumpy. Likewise, a move into residential may diversify logo count while increasing dependence on a relatively small set of distribution channels. Public evidence is therefore good at showing expansion surfaces and weak at showing how balanced the customer base
    actually is.
  claimRefs:
  - CU021
  - CU022
  - CU023
  - CU024
  - CU025
  - CU026
  - CU027
  - CU034
  tableRefs:
  - TU005
  figureRefs: []
- id: customer-verdict
  title: 'Customer verdict: real production proof across segments, but durability and concentration remain under-disclosed'
  body: 'Polarium compares favorably with many private climate-tech companies on customer proof alone. It can point to named deployments, customer-quoted narratives, partner-backed use cases, and recent momentum across telecom, industrial storage, home energy, and charging. That breadth is valuable because it reduces the risk that the company is a one-customer or one-use-case story. Yet it does not eliminate the harder diligence questions. We still do not know the size distribution of accounts, the renewal pattern of telecom fleets, the commercial durability of home channels, or how much revenue any single strategic partner represents. As a result, the prudent investor conclusion is positive but incomplete: Polarium has established that customers want the product in multiple contexts, but it has not publicly shown enough cohort evidence to prove durable retention, scalable land-and-expand motion, or safely diversified customer concentration.'
  claimRefs:
  - CU017
  - CU031
  - CU033
  - CU035
  tableRefs: []
