callouts:
- calloutType: risk
  title: 'The most important number is still missing: cash'
  body: The 2024 recapitalization is real, but public evidence still does not disclose current cash, burn, or covenant headroom. That prevents any defensible runway estimate and keeps financing risk central to the story.
  claimRefs:
  - CI015
  - CI016
  - CI017
  - CI032
- calloutType: insight
  title: Polarium has a revenue-quality upgrade path, but it is not proven yet
  body: RWE tolling, services, and optimization layers show how the company could move up the quality stack from one-off hardware toward recurring monetization. Today, however, public evidence still points to a hardware-led revenue base.
  claimRefs:
  - CI003
  - CI021
  - CI036
- calloutType: risk
  title: Disclosure inconsistency is itself a diligence signal
  body: When the company's own 2024 revenue figure conflicts materially with a public registry summary, investors should demand a reconciled audited bridge before relying on any forward model.
  claimRefs:
  - CI007
  - CI008
  - CI009
