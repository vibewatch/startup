  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: 2024-revenue-reconciliation
    missingEvidence: A reconciled audited bridge explaining why Polarium's turnaround article cites SEK 1,332M while Allabolag lists SEK 1,515.1M.
