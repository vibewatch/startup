  - FI003
- id: cost-structure-and-unit-economics
  title: Cost structure is clearly heavy; unit economics are mostly hidden
  body: 'Polarium is not a software company wearing battery branding. The public record implies real hardware, inventory, manufacturing, logistics, installation, support, and warranty obligations. Cape Town manufacturing, segment expansion, and app maintenance all point to a layered cost base. The sparse GitHub surface reinforces that software is strategically important but not publicly monetized as an independent platform ecosystem. At the same time, key unit-economics fields remain unavailable: gross margin by segment, channel margin splits, CAC, payback, warranty reserve ratios, and service attach rates. That means the market can see cost categories without seeing whether they are efficiently absorbed. In diligence terms, the right conclusion is not that the unit economics are bad; it is that public evidence is insufficient to know whether improving top-line scale is translating into structurally better contribution margins.'
  claimRefs:
  - CI013
  - CI014
  - CI019
  - CI020
  - CI029
  - CI030
  - CI031
  - CI033
  tableRefs: []
  figureRefs:
  - FI002
- id: capital-adequacy
  title: Capital adequacy remains the central forward financial question
  body: 'The 2024 financing package is the key hard fact for forward underwriting. Polarium raised SEK 500 million from existing investors and simultaneously amended and extended credit facilities. That combination is telling: the company could access supportive capital, but it still needed a broader balance-sheet reset rather than just incremental growth capital. Since then, Polarium has expanded ambitions across Germany, residential channels, C&I execution, and charging. Those moves can improve strategic position, yet they also consume working capital before they reliably throw off cash. Public sources do not disclose cash on hand, burn, inventory turns, debt covenants, or runway. So capital adequacy cannot be answered from the outside with precision. The best evidence-based stance is that the turnaround bought time and preserved strategic options, but future funding needs will remain closely tied to delivery pace, inventory discipline, and how quickly new segments convert from announced
    partnerships into cash-generating deployments.'
  claimRefs:
  - CI015
  - CI016
  - CI017
  - CI018
  - CI032
  - CI034
  tableRefs:
  - TI004
  figureRefs:
  - FI004
- id: financial-verdict
  title: 'Financial verdict: improved trajectory, but still not fully underwritable from public evidence'
  body: 'Polarium looks substantially more real than a purely aspirational climate-tech story: there is meaningful revenue, a large installed base, customer proof, and fresh strategic momentum. But the financial profile is still difficult to underwrite because the available evidence stops just short of the numbers that matter most. We do not have reliable segment revenue mix, realized pricing, gross margin, warranty reserves, backlog, cash, burn, or debt terms. Even the top-line 2024 revenue figure is inconsistent across public sources. The implication for investors is straightforward. Polarium may be on the right path operationally, and the capital raise plus credit reset show investor willingness to continue supporting that path. Yet until management provides a cleaner bridge from revenue to gross profit to cash generation, the company should be treated as a promising but still evidence-constrained turnaround rather than as a financially de-risked scale-up.'
  claimRefs:
  - CI023
  - CI024
  - CI025
