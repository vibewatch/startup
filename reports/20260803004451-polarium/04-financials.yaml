company:
  name: Polarium
chapter:
  number: 4
  title: Financials
  summary: Polarium has clear evidence of meaningful revenue and a genuine 2024 turnaround effort, but the business remains capital intensive and under-disclosed. Public sources show a SEK 500 million recapitalization, amended credit facilities, mixed profitability signals, and a material discrepancy between official and registry revenue figures. The financial story is promising but still not clean enough to underwrite confidently without audited reconciliation, cash data, and segment-level unit economics.
sections:
- id: revenue-model
  title: 'Revenue model: multiple hardware-led streams with a thin but important service layer'
  body: Polarium's public surfaces point to a multi-segment revenue model built on energy-storage hardware and associated project delivery. Telecom batteries remain the oldest and most legible business. Newer streams now include C&I storage, EV-charging support, and residential home batteries sold through channels. Services, monitoring, and energy-optimization capabilities clearly exist, but the company does not disclose whether they are billed separately, bundled into product gross margin, or reserved for specific partner structures such as RWE tolling. That matters because the core underwriting question is whether Polarium is mainly a project-and-hardware vendor with some software attached, or whether software, orchestration, and flexibility revenue can eventually raise margins and recurring revenue quality. Public evidence supports the existence of that upside path, but not the current contribution. Investors therefore should treat recurring-revenue potential as real but early rather
    than as a proven dominant driver today.
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  - CI006
  - CI021
  - CI022
  - CI036
  tableRefs:
  - TI001
  - TI002
  figureRefs:
  - FI001
- id: public-traction-and-disclosure
  title: Public traction exists, but disclosure quality is uneven and sometimes conflicting
  body: The company has enough public traction signals to show that it is not a pre-revenue story. Polarium says 2024 net sales were SEK 1,332 million and that more than 540,000 batteries have been deployed in over 80 countries. RWE adds a fresh scale signal in Germany through a 1,600-plus-system virtual-battery portfolio. Yet the disclosure stack is messy. Allabolag reports 2024 revenue of SEK 1,515.1 million, which conflicts materially with the company's own turnaround article, and the registry source also reports heavy EBITDA and pre-tax losses. Reuters adds a positive but narrower fact—that September 2024 was the first profitable month after restructuring—while Placera frames management's 2025 plan as targeting a positive year. These are useful signals, but they do not combine into a single clean underwriting baseline. The correct reading is improvement with unresolved disclosure inconsistency, not proven steady-state profitability.
  claimRefs:
  - CI007
  - CI008
  - CI009
  - CI010
  - CI011
  - CI012
  - CI026
  - CI027
  - CI028
