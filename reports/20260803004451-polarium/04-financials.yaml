  - - Cash, burn, and runway
    - Blocks downside and financing-risk analysis
    - Request monthly cash bridge since recapitalization and current liquidity
  - - Debt terms and covenants
    - Blocks cap-stack and equity-risk analysis
    - Request facility agreement summary and covenant headroom
  - - Channel economics
    - Blocks view on residential margin durability
    - Request distributor discounts, returns, activation, and attach metrics
  - - Service attach and software monetization
    - Blocks upside case for recurring revenue
    - Request installed-base services penetration and annualized revenue
  - - Warranty / failure-cost history
    - Blocks true hardware contribution analysis
    - Request claims rates, reserve history, and field-failure metrics
  notes: These are the minimum data needed before a private investor can convert the turnaround narrative into a financial model.
