    - Supports ~$0.7B-$0.95B range, below stale public anchor
    - Margin, cash, and concentration remain unresolved
    - most plausible from public evidence
  - - Bear
    - Liquidity stress reappears, flagship programs underdeliver, or disclosure proves weaker than hoped
    - Supports ~$0.3B-$0.6B range with significant downside from unicorn anchor
    - Financing and concentration become dominant
    - credible if risk stack compounds
