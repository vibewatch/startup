  - CV042
  - CV043
  tableRefs:
  - TV003
  - TV004
  figureRefs:
  - FV002
- id: recommendation
  title: 'Recommendation: track / research-more unless price resets or diligence closes gaps'
  body: Given the evidence currently available, the cleanest call is not buy. It is track / research-more, with willingness to engage if either price moves clearly below the stale unicorn anchor or diligence closes the largest known gaps. The reason is not that Polarium lacks strategic quality. The reason is that too many of the inputs that most affect value—reconciled revenue, cash, covenants, segment margins, retention, and concentration—are still private or conflicting. That makes the current confidence level only medium. Investors should want the company on the radar, but not confuse that with permission to pay for upside that is not yet underwritten. That recommendation is intentionally conservative because late-stage private losses usually come from paying through uncertainty, not from missing a good company entirely.
  claimRefs:
  - CV034
  - CV035
  - CV036
  - CV037
  - CV040
  - CV041
  tableRefs:
  - TV005
  - TV006
  figureRefs:
  - FV001
- id: what-would-change-the-view
  title: 'What would change the view: either stronger proof or a better price'
  body: 'The view would improve for two very different reasons. First, stronger proof: audited reconciliation of revenue, current liquidity and covenant visibility, segment gross margins, reliability statistics, and evidence that flexibility or service layers truly deepen returns. Second, a better price: if entry moves materially below the stale public unicorn anchor, investors may be paid for unresolved risk rather than paying through it. Conversely, the view would worsen if financing stress returns, flagship programs fail to broaden into repeatable revenue, or the company proves to be more concentrated and lower-margin than the narrative suggests. The key is that both proof and price can change the answer, but neither should be assumed in advance.'
  claimRefs:
  - CV037
  - CV038
  - CV039
  - CV041
