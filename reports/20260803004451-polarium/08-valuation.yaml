  - - Fluence
    - Public market cap
    - ~$2.56B as of Aug 2026
    - Useful storage-infrastructure comp
    - Still larger and more transparent than Polarium
  - - Tesla
    - Public market cap
    - ~$1.229T as of Aug 2026
    - Shows public market rewards for energy-platform scale
    - Too broad and too large for direct anchoring
  - - SolarEdge
    - Public market cap
    - ~$2.51B as of Jul 31 2026
    - Shows another distributed-energy valuation reference and comp dispersion
    - Solar-and-monitoring mix is still not a direct Polarium analog
  - - Polarium
    - Private stale public mark
    - ~$1B unicorn anchor as of May 2022
    - Best direct public context for current private mark
    - Stale and not refreshed by broad 2024 price discovery
