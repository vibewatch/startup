- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Weak-term financing event
    - Emergency raise or covenant stress
    - Confirms capital stack is weaker than base case
    - Step away or require steep price reset
  - - Revenue-quality disappointment
    - Reconciled audited revenue or margin materially worse than implied
    - Compresses multiple and confidence simultaneously
    - Re-cut base and bear cases
  - - Flagship program stagnation
    - RWE / channel / charging programs fail to broaden
    - Undermines platform-upside narrative
    - Treat as hardware-only integrator
  - - Concentration surprise
    - Top-customer or partner exposure far above expectation
    - Raises fragility and lowers deserved multiple
    - Demand diversification discount
  notes: Kill criteria focus on events that most quickly change value, not just company quality.
  claimRefs:
  - CV037
  - CV039
  - CV041
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Audited revenue reconciliation
    - Resolve 2024 revenue conflict between official and registry sources
    - Every multiple and scenario starts here
    - Request audited financial statements and bridge
  - - Cash, debt, and covenants
    - Current liquidity and refinancing risk are unknown
    - Determines downside and price discipline
    - Request lender package and runway model
  - - Segment gross margins
    - Need to know economics by Telecom, C&I, Residential, and services
    - Separates platform upside from hardware burden
    - Request segment P&L
  - - Retention and concentration
    - Need partner and customer durability data
    - Determines how much value should be assigned to proof points
    - Request cohorts and top-10 exposure
  - - Reliability and certification
    - Need evidence that installed base is durable and safe
    - Supports or weakens valuation premium
    - Request certification pack and warranty history
  notes: These are the minimum asks before serious price negotiation.
  claimRefs:
  - CV037
  - CV038
  - CV039
