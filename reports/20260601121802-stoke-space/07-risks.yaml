- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Technical first flight
    - Integrated mission milestones
    - If Nova has not completed a first successful orbital launch by end-2026 or suffers repeated hardware redesign loops after initial attempts
    - Thesis moves from execution delay to architecture risk; pause underwriting full-reuse advantage
  - - Schedule / launch readiness
    - Dated launch campaign disclosure
    - If Stoke keeps speaking in pad-activation terms without a dated launch campaign after the next major update cycle
    - Downgrade confidence and treat schedule as management-opacity risk, not just engineering risk
  - - Regulatory / reusable phase 2
    - Supplemental review kickoff
    - If phase-2 environmental work has not started promptly after first orbit or if scope widens beyond a bounded reuse concept
    - Assume reuse economics slip materially and underwrite only expendable or partially reusable service
  - - Mission assurance / NSSL
    - SSC eligibility milestone
    - If first-flight success does not quickly convert into Lane 1 task-order eligibility or tailored mission-assurance acceptance
    - Do not model government backlog as near-term revenue
  - - Capital intensity
    - Cash runway and debt discipline
    - If management returns to market before first-flight proof without materially better disclosure on customers or readiness
    - Treat capital raised as bridge funding rather than durable de-risking
  - - Supply chain / industrialization
    - Long-lead and logistics exceptions
    - If long-lead suppliers, transport handoffs, or pad systems repeatedly become the pacing item
    - Assume cadence stays low and margin benefits from reuse arrive later than forecast
  - - Customer disclosure
    - Named customer evidence
    - If no meaningful customer names, deposits, or launch windows are disclosed as first flight approaches
    - Keep the commercial-demand case at medium/low confidence and cap valuation upside
  - - Competitive pressure
    - Peer readiness delta
    - If Neutron, Firefly, or other substitutes accumulate customer wins while Nova remains pre-orbit
    - Assume customer acquisition gets harder and pricing power compresses
  notes: These are the investor-facing thesis-break triggers; each is intentionally monitorable from public milestones or targeted diligence asks.
