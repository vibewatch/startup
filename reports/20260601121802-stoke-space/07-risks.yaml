  title: Regulatory / legal risk register
  columns:
  - Rank
  - Rule / case / approval
  - Jurisdiction
  - Current status
  - Likelihood
  - Severity
  - Mitigation
  - Residual exposure
  - Diligence path
  rows:
  - - '1'
    - Reusable phase-2 supplemental environmental review
    - FAA / Space Force
    - Phase 1 analyzed as expendable; reusable operations still outside reviewed scope
    - High
    - Critical
    - Reach orbit first, then launch supplemental review immediately with a narrowed reuse concept and pre-negotiated study plan
    - Full-reuse economics, downmass, and cadence stay deferred until phase-2 review closes
    - Request the phase-2 NEPA workplan, agency owners, and a dated critical path
  - - '2'
    - FAA vehicle operator licensing stack
    - FAA
    - Vehicle operator license is a separate authorization layer for launch/reentry operations
    - Medium
    - High
    - Front-load Part 450 application work and lock down safety-element dependencies before pad activation completes
    - Pad readiness without matched launch authorization would still delay revenue service
    - Ask for current application status, pre-application meetings, and remaining data packages
  - - '3'
    - Historic-property and preservation obligations at SLC-14
    - Federal licensing / preservation law
    - Pad sits on a nationally significant historic site with shared-use museum obligations
    - Medium
    - High
    - Use phased construction packages, preservation-friendly design changes, and early consultation on any visible alterations
    - Late design changes or preservation objections can slow modifications at the margin
    - Request the preservation compliance log, any consultation memos, and the change-control board
  - - '4'
    - Floodplain, wetlands, and habitat mitigation compliance
    - Space Force environmental oversight
    - Mitigations are defined but site constraints remain physical and ongoing
    - Medium
    - Medium
    - Track wetland-credit purchases, ESA reporting, and construction sequencing tightly around sensitive areas
    - Future modifications or higher-cadence use could reopen environmental scrutiny
    - Request the mitigation tracker and any open findings from site monitoring
  - - '5'
    - Mission-assurance eligibility for government revenue
    - SSC / Space Force
    - Lane 1 entry achieved, but task-order competition waits on first successful launch
    - High
    - Critical
    - Treat mission-assurance workstream as launch-critical, not post-launch paperwork
    - Government demand exists but is not monetizable until first-flight success is recognized
    - Request the tailored mission-assurance deliverables and the pass/fail criteria SSC will use
  notes: Severity-ranked using the reviewed 2024-2026 regulatory corpus; rows emphasize gating items rather than every routine permit.
  enumerationScope:
    coverage: exhaustive
    basis: Cross-checked against FAA license pages, the SLC-14 EA/FONSI, Title 51 launch law, NHPA historic-property text, and SSC/NSSL program documents in the reviewed corpus.
