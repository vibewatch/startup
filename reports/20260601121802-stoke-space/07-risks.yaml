- id: capital-customer-and-competition
  title: Capital, customer-disclosure, and competitive pressure
  body: Capital is a mitigant, but it does not remove execution risk because the company still needs to turn financing into flight proof, then flight proof into revenue proof. Stoke’s disclosed capital base is now large enough to matter, and the board/CFO additions increase institutional discipline. Even so, the public evidence remains much stronger on money raised than on customers served. Management says a substantial contracted commercial manifest exists, yet the reviewed public materials do not identify the counterparties or contract economics, which leaves investors unable to test concentration, pricing, deposits, or cancellation protection. That disclosure gap matters more because the market is not standing still. Firefly already sells a flying product, while Rocket Lab, Firefly MLV, Relativity, and other substitutes all advertise 2026-oriented readiness or responsive-launch claims. Meanwhile, TechCrunch’s defense framing suggests that the easiest narrative for new capital is now national security relevance rather than clear commercial demand. The company can still win from this position, but the burden of proof has moved from concept differentiation to commercial conversion and program execution.
