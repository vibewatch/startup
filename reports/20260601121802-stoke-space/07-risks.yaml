- id: technical-schedule-operations
  title: Technical, schedule, and operating-system risk
  body: Stoke has real technical evidence, but it is still evidence of components and subscale or bounded campaigns rather than of a full orbital operating system. Hopper2 showed that the upper-stage philosophy is more than PowerPoint, and the booster engine hotfire is a serious propulsion milestone. Even so, the data disclosed publicly still leaves a large integration gap between a 15-second hop, a first hotfire, and a repeatable orbital launch stack that can survive ascent, staging, recovery, and turnaround economics. The schedule signal reinforces that caution. External reporting framed 2025 as the initial first-launch target, yet by the 2025 Series D and its 2026 extension the public message had shifted to early-2026 pad activation without a published launch date. That does not break the thesis by itself, but it makes the next milestone more binary. Operationally, the system also spans Kent manufacturing, Moses Lake test activity, and Florida launch ops, with off-site fabrication and cross-country transport embedded in the workflow. Until that distributed operating model proves itself under launch-campaign pressure, supply-chain and handoff risk remain high.
