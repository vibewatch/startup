chapter:
  number: 7
  title: Risks
  summary: 'Stoke’s risk stack is dominated by one linked sequence: first orbital proof, then mission-assurance and customer conversion, then reusable-economics expansion. The company has meaningful mitigants in capital, government signal, and infrastructure progress, but the public evidence still leaves high residual exposure around integrated flight, schedule certainty, customer disclosure, and the timing of reusable operations.'
sections:
- id: risk-ranking
  title: Ranked risk picture
  body: 'The risk stack is led by technical first-flight execution, schedule compression, and the fact that the most attractive parts of the upside case still sit behind gates rather than inside them. Stoke has raised enough money to keep building and has won signal-bearing government awards, but those are mitigants, not substitutes for orbital proof. The decisive issue is that the company’s core differentiator is not merely getting Nova off the pad once; it is proving that the architecture can graduate from an expendable phase-1 launch service into a reusable system with mission-assurance credibility and eventually customer-visible cadence. That means the top-ranked risks are tightly linked: if integrated vehicle performance slips, schedule slips; if schedule slips, Lane 1 task-order eligibility and commercial proof slip; if those slip, the next financing or valuation conversation arrives before the company has converted disclosure-light demand claims into operating evidence. The right investment posture is therefore milestone-based, with explicit triggers rather than open-ended faith in technical ambition.'
