  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: commercial-manifest-disclosure
    missingEvidence: Named launch customers, launch dates, deposits, cancellation rights, and pricing or margin terms for the claimed contracted commercial manifest.
    whyItMatters: Customer disclosure is the cleanest public proof that Stoke can convert technical milestones into durable revenue rather than just raising capital against a roadmap.
    diligencePath: Request the top ten contracted missions with customer names, orbit classes, launch windows, cancellation terms, and cash collected to date under NDA if required.
    relatedQuestionRefs:
    - QR019
    - QR020
    - QR028
  - type: missing-source
    severity: material
    topic: lane2-like-readiness
    missingEvidence: A dated roadmap for dual-range capability, vertical integration, and any certification steps beyond Lane 1 mission assurance.
    whyItMatters: Without a concrete path beyond Lane 1, government demand may remain narrative support rather than near-term contracted revenue at the most strategic end of the market.
    diligencePath: Ask management for the capability matrix showing what remains to reach Lane 2-like mission classes, including east/west coast pad plans and integration requirements.
    relatedQuestionRefs:
    - QR010
  - type: private-evidence-only
    severity: material
    topic: integrated-reuse-proof
    missingEvidence: Integrated mission-duty-cycle data for the upper stage, booster, stage separation, recovery operations, and turnaround time under flight-like thermal and structural loads.
    whyItMatters: Stoke’s differentiation depends on rapid full reuse; without integrated proof, the company can still become another partially reusable or expendable launch provider.
    diligencePath: Request the internal test matrix for mission-duty-cycle completion, the remaining integrated milestones before orbit, and the expected timing of reuse demonstrations after first orbit.
    relatedQuestionRefs:
    - QR013
  - type: missing-source
    severity: minor
    topic: supplier-concentration
    missingEvidence: A vendor map for long-lead propulsion, tankage, avionics, and Florida ground-system components, including dual-source coverage and lead-time assumptions.
    whyItMatters: The disclosed footprint shows long logistics handoffs, but the public corpus does not say whether Stoke has redundancy for the components most likely to constrain cadence.
    diligencePath: Ask for the top twenty long-lead items, source count per item, make-or-buy decisions, and the current longest supplier lead time in weeks.
    relatedQuestionRefs:
    - QR023
