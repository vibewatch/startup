      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The financing stack has bought Stoke real strategic time
            body: >-
              Very few pre-orbit launch companies have raised over a billion dollars without going public. That does not
              validate the current price on its own, but it materially improves Stoke’s probability of getting to its
              next proof points without immediate financing stress.
            calloutType: strength
            claimRefs:
              - CV001
              - CV002
              - CV003
          - type: callout
            title: At $3.42B, buyers are paying for future proof rather than present cash flow
            body: >-
              The current secondary mark is not crazy relative to the sector, but it is demanding relative to Stoke’s
              disclosed economics. Without revenue, backlog detail, or orbital proof, today’s value is mostly option
              premium.
            calloutType: risk
            claimRefs:
              - CV005
              - CV032
              - CV033
              - CV041
          - type: callout
            title: Track, not buy
            body: >-
              The differentiated product thesis and government anchor merit continued attention, but the
              evidence-adjusted price is still too full for a clean buy recommendation. A cheaper entry or stronger
              operating proof would change that.
            calloutType: recommendation
            claimRefs:
              - CV027
              - CV039
              - CV045
