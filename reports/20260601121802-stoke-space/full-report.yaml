      - number: '4.2'
        title: Cost Structure, Unit Economics, and Capital Intensity
        blocks:
          - type: paragraph
            body: >-
              The financial burden at Stoke is dominated by fixed assets and development throughput long before
              recurring launch revenue can scale. Official pages describe a 168,000-square-foot vertically integrated
              headquarters, a Washington test site, and active launch operations buildout in Florida; third-party
              coverage adds a 75-acre Moses Lake facility and a launch site designed to handle multiple vehicles. The
              LC-14 buildout alone includes a horizontal integration facility, launch mount, 121-foot umbilical tower,
              propellant systems, and other permanent infrastructure. The public regulatory record further shows that
              early operations are expected to start in a phased, expendable configuration, with full reusable
              operations deferred until a supplemental environmental review. That matters financially because Stoke’s
              full-reuse thesis is the mechanism that should eventually compress cost per launch and support margin
              expansion; if early flights are expendable, then some of the near-term economics look more like a
              conventional development-heavy launcher than the eventual end-state pitch. On top of hardware and site
              capex, launch licensing requires separate insurance or financial-responsibility capacity, which adds
              another cash burden as flight operations approach.
