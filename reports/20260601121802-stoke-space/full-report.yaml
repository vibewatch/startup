  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk picture
        blocks:
          - type: paragraph
            body: >-
              The risk stack is led by technical first-flight execution, schedule compression, and the fact that the
              most attractive parts of the upside case still sit behind gates rather than inside them. Stoke has raised
              enough money to keep building and has won signal-bearing government awards, but those are mitigants, not
              substitutes for orbital proof. The decisive issue is that the company’s core differentiator is not merely
              getting Nova off the pad once; it is proving that the architecture can graduate from an expendable phase-1
              launch service into a reusable system with mission-assurance credibility and eventually customer-visible
              cadence. That means the top-ranked risks are tightly linked: if integrated vehicle performance slips,
              schedule slips; if schedule slips, Lane 1 task-order eligibility and commercial proof slip; if those slip,
              the next financing or valuation conversation arrives before the company has converted disclosure-light
              demand claims into operating evidence. The right investment posture is therefore milestone-based, with
              explicit triggers rather than open-ended faith in technical ambition.
            claimRefs:
              - CR027
              - CR030
              - CR032
              - CR035
              - CR036
