  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct peers, incumbents, substitutes, and likely entrants'
        blocks:
          - type: paragraph
            body: >-
              The relevant competitive set for Stoke is broader than a list of medium-lift startups. The nearest direct
              comparison class is reusable or partially reusable vehicles targeting commercial and government missions
              in the small-to-medium payload range: Rocket Lab's Neutron, Firefly's Eclipse, and Relativity's Terran R.
              SpaceX matters twice over: Falcon 9 is the current market-clearing benchmark for reusable launch,
              rideshare packaging, and schedule certainty, while Starship represents the only retained architecture that
              explicitly matches Stoke on full-system reusability and then extends it to much larger payload classes.
              Incumbents ULA and Arianespace compete differently, leaning on mission assurance, institutional
              relationships, and sovereign-access narratives rather than startup-style disruption. Substitutes also
              matter. For smaller payloads, Falcon 9 rideshare and Rocket Lab Electron can solve the launch job without
              a dedicated Nova mission, especially when price or schedule dominates. The field is unlikely to stay
              static: ESA's launcher challenge shows governments are actively trying to create more regional options,
              which means Stoke is entering a market where both startup peers and sovereign-backed challengers keep
              accumulating.
            claimRefs:
