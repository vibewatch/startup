  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model, Pricing, and Disclosed Traction
        blocks:
          - type: paragraph
            body: >-
              Stoke’s public revenue story is still mostly a pipeline story rather than an operating-income story. The
              company’s product is Nova: a reusable medium-lift launch system positioned for on-demand orbital
              insertion, cargo return, and other in-space mobility missions. Publicly disclosed monetization proxies
              come from government work and management commentary rather than completed commercial launches. Stoke has
              disclosed a $4.5 million DIU prototype award and a $5 million NSSL Lane 1 task order, and management has
              repeatedly pointed to a substantial manifest of contracted commercial launches. What is missing is the
              information that matters most for underwriting: who the commercial customers are, what they are paying,
              whether they have posted deposits, and how much revenue is recognized before launch versus after mission
              completion. Boltline adds optionality, but public sources only show it as a product the company is
              funding, not a stand-alone revenue line with named customers. Taken together, the evidence supports real
              demand signals, but not proof of realized launch-service revenue as of the canonical run date.
