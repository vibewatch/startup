  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and what counts as launch demand
        blocks:
          - type: paragraph
            body: >-
              The first task is to define what “the market” is before accepting any TAM figure. Retained launch-services
              sources consistently include the pre-launch and post-launch services required to put payloads into orbit
              across LEO, MEO, GEO, and beyond GEO for commercial, military, and government users. That includes mission
              integration, payload processing, range and launch execution, telemetry, and related support sold as launch
              services. It does not include upstream satellite manufacturing, ground equipment, or downstream
              satellite-service revenue, even though those markets are adjacent and often grow together. For Stoke
              Space, the practical boundary is narrower still: the relevant market is orbital launch demand for
              satellite customers that need repeated access to orbit, not the entire space-technology stack. Commercial
              communications payloads dominate the present volume base, but government and national-security demand
              still shape infrastructure, certification requirements, and pricing discipline for the whole category.
              That distinction matters because volume growth can outpace addressable revenue growth. That distinction
              matters because volume growth can outpace addressable revenue growth.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM011
