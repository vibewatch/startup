      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Top risk remains integrated orbital proof
            body: >-
              Series D capital and government signal help, but they do not change the order of operations: Stoke still
              needs a successful orbital launch before the market can price in NSSL revenue or credible full-reuse
              timing.
