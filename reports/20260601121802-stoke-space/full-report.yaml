      - number: '1.4'
        title: Milestones, government validation, and execution risk
        blocks:
          - type: paragraph
            body: >-
              The milestone record shows a company that has moved quickly on technical progress, government validation,
              and launch-site construction, while still carrying obvious first-flight execution risk. On the technical
              side, Stoke’s public record spans the Hopper2 upper-stage flight test in September 2023, the first
              full-flow staged-combustion engine hotfire in June 2024, and subsequent propulsion milestones that the
              company says pushed Zenith and Andromeda closer to flight configuration. On the validation side, DIU
              backed Stoke with a $4.5 million responsive-space-delivery award in 2024, and the Space Force added it to
              NSSL Phase 3 Lane 1 in March 2025 with a $5 million task order and future competition eligibility once the
              vehicle flies successfully. Infrastructure has advanced in parallel: the environmental package for SLC-14
              cleared in October 2024 and Stoke has been rebuilding the historic site for Nova. The main caution is that
              the public end-state story still runs ahead of realized operations. TechCrunch’s read of the draft EA
              showed Phase 1 missions were still modeled as expendable, reusable launch operations would require
              supplemental analysis, and the retained June 2026 record still described first orbital launches as
              upcoming rather than completed.
