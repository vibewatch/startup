    rows:
      - - Stoke Space
        - Direct medium-lift challenger
        - Private; $1.34B total capital raised after 2026 Series D extension
        - Commercial and government missions needing dedicated medium-lift launch plus on-orbit mobility
        - 100% reusable Nova architecture including reusable upper stage and return-from-orbit pitch
        - No public launch cadence, backlog depth, or realized price proof yet
      - - SpaceX (Falcon 9 + Starship)
        - Dominant direct benchmark and long-term heavy substitute
        - About half of global orbital launches in 2025; visible rideshare packaging and heavy-lift roadmap
        - Everything from smallsat rideshare to very large payloads and exploration missions
        - Falcon 9 cadence plus public rideshare pricing; Starship markets full-system reusability and 100+ t to orbit
        - >-
          Starship commercial reliability is still emerging; Falcon 9 does not publicly offer reusable upper-stage
          operations
      - - Rocket Lab (Electron + Neutron)
        - Direct peer spanning small dedicated and medium lift
        - 88 Electron launches; 21 Electron/HASTE launches in 2025; Neutron backed by Rocket Lab launch heritage
        - Smallsats needing dedicated launch, constellations, cargo, and government missions
        - >-
          Electron precision and schedule control today; Neutron promises 13 t to LEO with reusable first stage and
          fairing
        - Neutron slipped to no earlier than Q4 2026 after tank-test failure
      - - Firefly Aerospace (Alpha + Eclipse)
        - Responsive launch peer with incumbent-backed medium vehicle
        - Northrop invested $50M; prior Series D valued Firefly above $2B
        - Responsive national-security, civil, and commercial missions from 1 t class up to medium lift
        - Alpha markets rapid-response launch; Eclipse targets 16.3 t to LEO with Northrop partnership
        - Eclipse remains preflight and public pricing is still opaque
      - - Relativity Space (Terran R)
        - Large reusable entrant
        - More than $3B in launch service agreements; private company focusing resources on Terran R
        - LEO constellation deployments, GTO missions, future government work
        - Large reusable vehicle with 23.5 t reusable LEO capacity and large fairing
        - Delayed NSSL participation and first flight still targeted no earlier than 2026
      - - ULA (Vulcan)
        - Incumbent mission-assurance alternative
        - Incumbent operator serving national-security, civil, and commercial markets
        - Risk-sensitive government and commercial payloads needing precision and custom configurations
        - Broad configuration range, multi-manifest options, and strong trust posture
        - No simple public list price and little reuse differentiation in retained materials
      - - Arianespace (Ariane 6)
        - Incumbent sovereign-access alternative
        - 40+ years serving commercial and institutional customers; EU and Amazon support for Ariane 6
        - European institutional missions, telecom, navigation, and large constellation deployments
        - Sovereign-access story, customized launch services, and large batch deployment capability
        - Economics framed as competitive but not exposed in public price cards
      - - Likely entrants / regional challengers
        - Future crowding risk
        - ESA preselected five challengers eligible for up to €169M each under the Launcher Challenge
        - European institutional payloads and future sovereign launch demand
        - Government-sponsored competition can create new regional alternatives quickly
        - None of the five selected challengers had yet reached orbit in retained 2025 reporting
