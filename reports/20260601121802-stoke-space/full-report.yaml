            title: Upper-stage reuse is the clearest real wedge
            body: >-
              Among the retained sources, Stoke and SpaceX Starship are the only architectures explicitly marketing full
              reusability through the upper stage, and Stoke adds a return-from-orbit and on-demand-operations story at
              medium-lift scale.
