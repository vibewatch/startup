      - number: '2.3'
        title: Buyer, user, and payer segmentation by mission type
        blocks:
          - type: paragraph
            body: >-
              Launch is not bought by one monolithic customer. In LEO broadband, the buyer is typically a constellation
              operator or program office that pays from a network-build or replenishment budget and values manifest
              certainty above headline payload maximums. Amazon Leo and Telesat Lightspeed show how these buyers
              contract across multiple missions because deployment speed determines when capacity goes live and when
              revenue starts. In national security, the buyer is a procurement authority such as Space Systems Command,
              the user is a defense or intelligence mission, and the payer is the federal budget; certification,
              reliability, and range integration matter more than lowest advertised price. GEO operators create a
              different but still material segment where fewer, higher-value spacecraft support telecom, government, and
              resilience use cases. Finally, small and medium satellite operators split into cost-first rideshare users
              and time-sensitive dedicated-launch buyers who pay for orbit control, schedule control, or responsive
              access.
