      - number: '2.4'
        title: Growth drivers, adoption constraints, and what matters in buying decisions
        blocks:
          - type: paragraph
            body: >-
              The strongest tailwind is frequency demand. BryceTech and SIA both show a launch system already dominated
              by commercial, communications-heavy activity, while Amazon and Telesat illustrate how constellation
              economics create recurring multi-launch demand. Grand View and Mordor both reinforce that reusable
              vehicles, lower launch costs, and demand for satellite-based applications are structural growth drivers.
              But the market is not won on price alone. Rocket Lab’s own positioning around tailored orbits, schedule
              control, and responsive launch illustrates why some buyers pay a premium for precision and timing, while
              rideshare remains the default for cost-sensitive payloads. On the constraint side, GAO and CRS show that
              national-security demand depends on certification, payload-processing capacity, and launch-range
              infrastructure; Mordor adds debris, congestion, export controls, and pad availability. For Stoke Space,
              the relevant question is not whether launch demand exists—it clearly does—but whether the company can earn
              buyer trust in the slices where cadence, reliability, responsiveness, and certification unlock share.
            claimRefs:
