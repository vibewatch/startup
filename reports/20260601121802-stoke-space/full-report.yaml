    sections:
      - number: '1.1'
        title: Identity, stage, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Stoke Space’s identity is unusually clear for a private launch startup even though some key commercial
              metrics remain opaque. The legal and public records point to a company incorporated in 2019 but publicly
              narrating its launch around 2020, which matters because later sources often use the “founded in 2019” and
              “launched in 2020” markers interchangeably. The company’s own pages frame the product as low-cost,
              on-demand transport to, through, and from space rather than a single-use launcher. That positioning rests
              on Nova’s full-reuse architecture: a medium-lift two-stage vehicle, a reusable upper-stage system designed
              for on-demand orbital mobility and return missions, and hardware choices aimed at aircraft-like
              turnaround. The operating footprint is also material. By 2025-2026 SEC filings, Stoke’s principal place of
              business was in Kent, Washington; official pages add a 168,000-square-foot headquarters, a Moses Lake test
              site, and Cape Canaveral launch operations. The right stage label is therefore late-stage pre-launch
              developer: the company has large disclosed capital, meaningful infrastructure, and government validation,
              but not yet an orbital launch or public operating KPI set.
