  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Nova architecture and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Nova is best understood as a transportation product, not just a launch vehicle. Stoke is selling routine
              access to orbit, dynamic in-space maneuvering, and eventual return from orbit, with the rocket
              architecture designed around that end state from the beginning. Public product materials frame Nova as a
              fully reusable medium-lift vehicle whose reusable configuration targets about 3 metric tons to LEO and
              whose non-reused maximum-payload mode stretches to about 7 metric tons, with a smaller GTO figure also
              disclosed. The differentiator is that both stages are meant to come back, which forces architecture
              choices that look unusual versus peers: steel tanks instead of composite primary structure, a reusable
              upper stage instead of a disposable hydrogen stage, and an integrated stage interface built around hot
              staging. In customer terms, this is aimed at operators that want more than a single satellite insertion.
              Stoke is explicitly pitching access to, through, and from space, which makes Nova part launcher and part
              reusable space logistics system. That positioning is why defense cargo and downmass narratives show up
              alongside ordinary commercial launch messaging. Stoke also markets Nova's LNG/LOX booster and LH2/LOX
              upper stage as a cleaner propellant stack than kerosene- or solid-heavy alternatives, reinforcing that the
              product pitch is about repeatable space mobility rather than a one-off launch slot.
            claimRefs:
              - CE001
