            body: >-
              Stoke has accumulated an unusually large capital base for a private launcher, but the structure of that
              capital also makes timing critical. Company disclosures move the cumulative total from $480 million after
              the January 2025 Series C, to $990 million after the October 2025 Series D, to $1.34 billion after the
              February 2026 extension of that same Series D. The October 2025 announcement also disclosed a $100 million
              Silicon Valley Bank debt facility, which is important because it introduces leverage into a business that
              is still pre-routine-service. Management explicitly framed the 2025 financing as runway to complete
              development and demonstrate Nova through first flights, which implies that the capital plan is
              milestone-based rather than tied to already proven cash generation. The public record shows no current
              cash balance, no monthly burn figure, and no numeric runway months. That means the practical underwriting
              question is not whether Stoke has raised enough capital historically, but whether the existing balance
