    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Commercial contract economics
        - Named counterparties, launch count, pricing, deposits, cancellation rights
        - Turns company manifest language into underwritable backlog
        - Request customer schedule by mission and contract stage
      - - Revenue bridge
        - Any disclosed or board-level view of first revenue timing and gross margin shape
        - Necessary for moving from option value to cash-flow underwriting
        - Request management bridge from first flight to first paid mission
      - - Cap table / preferences
        - Full preference stack, conversion mechanics, secondary transfer restrictions
        - Determines what common-equivalent value the headline mark really implies
        - Request latest cap table and financing docs
      - - NSSL mission probability
        - Actual RFP timing and internal probability of win after first launch
        - Needed to quantify government-anchor NPV instead of hand-waving it
        - Request procurement roadmap and assumptions
      - - Reuse economics
        - Inspection scope, refurbishment cost, and expected flight cadence after first recovery
        - Core to whether the technology creates valuation-worthy margin expansion
        - Request operations model and post-flight turnaround plan
      - - Governance / financing risk
        - Conditions under which the company would raise again before meaningful revenue
        - Critical for downside case and dilution modeling
        - Request runway, burn, and contingency financing triggers
    notes: These diligence asks are the difference between a narrative-driven mark and an investable underwriting case.
