companyProfile:
  summary: >-
    Stoke Space is developing Nova, a fully reusable medium-lift orbital launch vehicle that aims to recover both its
    booster and upper stage. Founded in 2019 by ex-Blue Origin engineers Andy Lapsa and Tom Feldman, the company has
    raised about $1.34B through its Series D-2 extension, won entry into the U.S. Space Force's NSSL Phase 3 Lane 1
    program, and is preparing Nova for first orbital flights from Launch Complex 14 at Cape Canaveral while expanding
    production and test infrastructure in Washington.
