      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Frequency demand is real, but the open market is narrower than the headline TAM
            body: >-
              The evidence shows a launch market already dominated by commercial, communications-heavy activity, but a
              meaningful share of that volume is either captive to vertically integrated operators or gated by
              certification and infrastructure. The investable question for Stoke is therefore the size of the
              serviceable recurring slice, not the size of the outer shell.
            calloutType: insight
            claimRefs:
              - CM012
