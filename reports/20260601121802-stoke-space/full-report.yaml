      - number: '1.3'
        title: Funding history, valuation visibility, and stakeholder map
        blocks:
          - type: paragraph
            body: >-
              Stoke’s financing record is the strongest quantitative part of the public company-overview file. The
              January 2025 Series C was disclosed at $260 million and brought claimed lifetime funding to $480 million;
              the accompanying Form D showed the round was not yet fully sold at the time of filing, which is useful
              because it separates announcement language from securities-filing mechanics. The October 2025 Series D was
              larger again: Stoke disclosed $510 million of equity financing led by Thomas Tull’s USIT plus a separate
              $100 million debt facility led by Silicon Valley Bank, taking claimed total capital to $990 million. The
              February 2026 extension added another $350 million and brought the Series D aggregate to $860 million and
              total capital raised to $1.34 billion. What is still missing is the valuation bridge. Stoke did not
              disclose post-money valuation or pricing terms for the 2025-2026 financings, while Forge’s June 2026
              secondary-market page supplied only a low-confidence indicative valuation and a lagging funding total.
              That makes the capital history well supported, but the exact ownership, dilution, leverage terms, and
              current valuation remain partially public at best.
