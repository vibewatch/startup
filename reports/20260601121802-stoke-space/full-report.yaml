      - number: '8.2'
        title: Comparable benchmarks support relevance, but not obvious cheapness
        blocks:
          - type: paragraph
            body: >-
              The best public benchmark is Rocket Lab because it is an already orbit-proven launch and space-systems
              company with audited public filings and real revenue. The reviewed public data does not yield a single
              canonical number for Rocket Lab’s value, but it does provide a useful band: Macrotrends shows a $13.64
              billion market cap in December 2024, and Yahoo’s historical valuation table shows $8.23 billion as of
              March 31, 2025. Yahoo’s quote page also shows Q1 FY26 revenue of about $200 million. The direction is what
              matters: a functioning public launch company with flight heritage and revenue trades well above Stoke,
              which suggests room for upside if Stoke executes—but only after a lot of proof is earned.


              Private benchmarks fill in the rest of the map. Sierra Space’s March 2026 round at $8 billion sits clearly
              above Stoke’s secondary mark and reflects a more mature national-security and hardware platform. Firefly’s
              2023 $1.5 billion mark sits below Stoke, which shows how much additional option value investors are
              ascribing to Nova’s full-reuse thesis and fundraising strength. Relativity’s last clean widely cited
              valuation at $4.2 billion is close enough to Stoke’s current mark to be uncomfortable: it demonstrates
              that high-concept launch companies can reach multi-billion prices before durable economics are public, but
              it also warns that valuation can outrun proof.
            claimRefs:
              - CV012
