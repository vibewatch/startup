      - number: '7.2'
        title: Regulatory, legal, and mission-assurance gates
        blocks:
          - type: paragraph
            body: >-
              Regulatory risk is no longer about whether Stoke can touch SLC-14 at all; the phase-1 environmental
              pathway has moved materially forward. The remaining issue is that the reviewed public path is narrower
              than the company’s long-term thesis. The EA and related approvals support a bounded phase-1 program, while
              the reusable phase still needs more environmental work and eventually a license stack that matches live
              operations. The historic status of SLC-14 also adds preservation sensitivity: changes at the pad are not
              being made on an empty greenfield site but on a nationally significant launch complex with ongoing
              public-use obligations. On the government-demand side, the NSSL award is commercially meaningful only
              after first-flight success and mission-assurance acceptance. SSC’s framing is constructive but
              disciplined: Stoke has been invited into the portfolio and paid for initial mission-assurance work, yet
              actual launch task orders remain gated. The residual exposure is therefore not abstract regulatory
              hostility; it is sequential dependency, where each next permission or revenue stream requires the prior
              milestone to close first.
            claimRefs:
