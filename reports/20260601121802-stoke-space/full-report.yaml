      - number: '3.3'
        title: Distribution power, regulatory posture, and switching costs
        blocks:
          - type: paragraph
            body: >-
              Launch is not sold only on payload charts. Distribution power comes from pads, mission assurance, launch
              history, procurement eligibility, and the ability to fit within a customer's scheduling model. That favors
              incumbent operators and the best-capitalized challengers. SpaceX combines rideshare frequency with a
              launch record customers already understand. ULA and Arianespace package trust differently: ULA stresses
              national-security, civil, and commercial precision, while Arianespace ties Ariane 6 to European autonomous
              access and long institutional relationships. Rocket Lab's advantage is narrower but tangible, with
              Electron heritage, a dedicated Neutron pad in Virginia, and explicit Space Force on-ramping into NSSL Lane
              1. Firefly and Relativity are further behind on trust accumulation even though they have real
              momentum—Northrop backing in Firefly's case and meaningful launch-service agreements in Relativity's. The
              FAA licensing stack and the new user-fee regime matter here because launch providers must clear operator
              licensing, payload review, environmental review, and financial responsibility hurdles before they can sell
              missions at scale. Switching costs for buyers are therefore real but not absolute: once a vehicle is
              baselined around payload adapters, mission assurance, and a schedule window, changing providers is
              painful, yet the market still allows multi-homing because few public sources show exclusivity or deep
              software-like lock-in.
            claimRefs:
              - CP015
              - CP022
              - CP023
              - CP024
              - CP027
              - CP028
              - CP037
              - CP038
              - CP039
      - number: '3.4'
        title: Moat durability and adverse competitive evidence
        blocks:
          - type: paragraph
            body: >-
              The moat case for Stoke is strongest when the mission values what Nova alone says it can do: rapid reuse
              with an orbital upper stage that can reposition, loiter, and bring payloads back. If that functionality
              proves operationally real, it is more than a cost story; it is a product expansion of what launch can
              include. However, the retained adverse evidence shows why that moat is not yet durable enough to
              underwrite on architecture alone. SpaceNews' 2026 reporting makes clear that peers still think first about
              competing with SpaceX, not with one another, because SpaceX sets the dominant price and cadence frame. The
              same reporting also shows that the market has already washed out many under-capitalized entrants, which
              cuts both ways for Stoke: fewer surviving rivals helps, but it also highlights how unforgiving launch
              economics remain. Neutron, Eclipse, and Terran R all carry schedule risk, yet each also has real
              assets—pad progress, government pathways, strategic investors, or multibillion-dollar agreements—that can
              convert into pressure quickly if execution turns. The practical conclusion is that Stoke's moat is
              promising but unproven. Public evidence still lacks Nova backlog depth, realized pricing, launch cadence,
              and customer retention data strong enough to demonstrate that upper-stage reusability translates into a
              durable commercial edge rather than an elegant technical claim.
            claimRefs:
