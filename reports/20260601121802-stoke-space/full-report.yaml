      - number: '6.4'
        title: The remaining customer questions are conversion, concentration, and durability
        blocks:
          - type: paragraph
            body: >-
              The main underwriting gap is not whether buyers exist in the abstract, but whether Stoke can turn today’s
              public customer signals into durable revenue. Lane 1 provides a powerful anchor because it proves the U.S.
              government wants more launch capacity and is willing to create procurement pathways for emerging
              providers. Yet the same public record also says Stoke must first complete a successful launch before it
              can compete for those missions. Via Satellite’s January 2026 coverage of SpaceX task orders gives a sense
              of why that matters: real Lane 1 awards are large, mission-specific, and concentrated among providers that
              can already fly.


              That leaves three unresolved questions. First, concentration: the identifiable customer base is dominated
              by U.S. government programs, so a delay in government qualification would ripple through the whole
              commercialization story. Second, durability: no public data shows repeat purchases, renewals, or retention
              because no public Stoke orbital service record exists yet. Third, conversion: commercial manifest claims
              remain unattributed. The appropriate diligence posture is therefore to credit Stoke for having real
              customer traction at the government-procurement and market-demand layers while still withholding full
              confidence on revenue durability until a named mission book and at least one successful flight exist.
