  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Government anchor customers provide the only hard public proof today
        blocks:
          - type: paragraph
            body: >-
              Stoke’s customer chapter is unusually asymmetric: the public proof is strong on buyer identity but still
              weak on awarded mission volume. The clearest evidence is government-side. In March 2025 the U.S. Space
              Force added Stoke to NSSL Phase 3 Lane 1, and SSC plus DVIDS both confirm the same core facts: Stoke is in
              the IDIQ pool, it received a $5 million initial mission-assurance task order, and it still must complete
              one successful launch before it can bid for actual launch-service task orders. That distinction matters.
              The award is not booked launch revenue, but it is far more concrete than a generic memorandum of
              understanding because it puts Stoke inside the government’s formal launch-procurement machinery.


              The DIU contract is the other hard proof point. It is smaller at $4.5 million, but it shows a real defense
              buyer is willing to fund Stoke around a specific mission need: responsive cargo delivery to, through, and
              from space. That customer problem is adjacent to Stoke’s reusable upper-stage thesis and broadens the
              buyer map beyond conventional payload deployment. Taken together, the Space Force and DIU records show
              that the company has crossed the line from pure technology startup into actual procurement consideration.
              What they do not yet show is that Stoke has converted eligibility into a launch order, completed a flight
              for a paying orbital customer, or demonstrated service repeatability.
