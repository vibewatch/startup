      - number: '2.2'
        title: TAM, SAM, and contradictory sizing lenses
        blocks:
          - type: paragraph
            body: >-
              Public market estimates are directionally useful but too inconsistent to collapse into one number. Grand
              View’s retained market report and press release support a broad launch-services TAM reaching $41.31
              billion by 2030, while The Business Research Company’s 2026 report points to a much lower $24.42 billion
              by 2030. SIA’s 2026 industry release adds a realized 2025 commercial launch-revenue baseline of $12.4
              billion and BryceTech reports 325 orbital launches in 2025, 87% of them commercial, which is a better
              anchor for near-term serviceable demand than generic top-down TAM alone. A serviceable lens for Stoke
              Space therefore sits inside the broader launch-services shell and is concentrated in recurring
              constellation deployment and replenishment, durable government manifests, steady GEO replacement, and
              premium schedule-control missions. The public record can frame that SAM qualitatively, but it cannot
              produce a clean Stoke-specific SOM without private data on target orbit mix, win rates, pricing, and
              expected annual cadence.
