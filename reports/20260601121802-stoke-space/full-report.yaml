  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Orbital first-flight slip
        - '>12 months beyond current investor expectation window'
        - Pushes commercialization and government-task-order timing to the right while burning capital
        - Move underwriting toward bear range and demand financing update
      - - No customer conversion after first flight
        - No disclosed mission awards or named commercial counterparties within 12 months of orbit
        - Would show technical success is not translating into revenue support
        - Keep or downgrade recommendation despite technical progress
      - - Down-round / rescue financing
        - Capital raised below or far under current secondary mark
        - Would undermine today’s private-market signal and increase dilution risk
        - Re-mark below base range until cap-table terms are clear
      - - Competitive price compression
        - New data show launch scarcity easing without Stoke’s costs falling commensurately
        - Weakens economic rationale for current option premium
        - Lower fair-value range and demand clearer unit-economics proof
      - - Government qualification setback
        - Lane 1 pathway stalls or mission-assurance process fails to convert into bidding eligibility
        - Removes the most credible early revenue anchor
        - Reassess entire government-premium component of valuation
    notes: These are monitorable, investment-relevant triggers rather than generalized operational risks.
