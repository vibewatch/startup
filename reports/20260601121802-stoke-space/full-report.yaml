  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: The current price signal is real enough to matter but too thin to treat as a clean mark
        blocks:
          - type: paragraph
            body: >-
              The strongest current valuation signal is the secondary-market cluster rather than any new priced primary
              round. Forge shows a $3.42 billion valuation on 2026-06-01, while Public and Nasdaq Private Market both
              place Stoke’s share price in the low-$50 range during spring 2026. That is not the same thing as a broad
              clearing market. These platforms are useful precisely because they are imperfect: they show that price
              discovery exists and is directionally convergent, but they also expose how little audited context sits
              underneath the headline mark.


              The financing chronology does at least provide a real underlying narrative. Stoke raised $260 million in
              January 2025, then $510 million in October 2025, then a $350 million extension in February 2026. Official
              company releases and independent coverage all line up on the large facts: total funding reached $990
              million after the first Series D and $1.34 billion after the extension. That gives the company an
              unusually well-capitalized balance sheet for a pre-orbit launcher. But capital raised is not revenue, and
              a high cash balance should be read as runway plus option value, not proof that the current secondary mark
              is cheap.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV006
              - CV007
