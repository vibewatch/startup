- id: capability-and-pricing-comparison
  title: Capability comparison and pricing transparency
  body: 'Stoke''s core product thesis is not simply lower launch cost, but a specific type of vehicle capability: Nova is marketed as a fully reusable medium-lift rocket whose upper stage can reach orbit, maneuver, stay on orbit, and return payloads. That is a materially different pitch from Falcon 9, whose public launch economics are visible through the rideshare program but whose retained materials do not market reusable upper-stage operations, and from Neutron, which emphasizes first-stage return and captive-fairing reuse rather than orbital-stage recovery. Firefly and Relativity also position around responsiveness, affordability, or large-payload economics, but the retained materials place more weight on launch performance, schedule, and customer fit than on upper-stage reuse. The problem for Stoke is that public price transparency is overwhelmingly concentrated at SpaceX. Falcon 9 rideshare provides a visible reference point—$350,000 for 50 kilograms to sun-synchronous orbit with additional
    mass at $7,000 per kilogram—while most rivals, including Stoke, sell through negotiated contracts. That weakens direct public benchmarking and means the strongest supportable comparison today is packaging logic and capability scope, not provable all-in mission price. In other words, Stoke can argue architectural differentiation, but it cannot yet prove that the architecture wins a broad price war.'
