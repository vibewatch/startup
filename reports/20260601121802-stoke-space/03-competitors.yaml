  - type: private-evidence-only
    severity: material
    topic: stoke-backlog-and-trust
    missingEvidence: Booked backlog by customer class, first-launch timing confidence, mission-assurance artifacts, and any public launch commitments beyond general government on-ramping.
    whyItMatters: Commercial durability in launch depends as much on trust and schedule proof as on vehicle design, especially when incumbents already own the strongest channels.
    diligencePath: Request signed launch agreements, launch-site readiness milestones, mission-assurance documentation, and customer references from risk-sensitive buyers.
    relatedQuestionRefs:
    - QP020
    - QP025
