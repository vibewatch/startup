company:
  name: Stoke Space
chapter:
  number: 3
  title: Competitors
  summary: Stoke Space sits in a crowded launch stack where Falcon 9 sets the price-and-cadence umbrella, Starship and Nova are the only retained vehicles explicitly promising full reusability through the upper stage, and Neutron, Eclipse, Terran R, Vulcan, and Ariane 6 cover adjacent medium-to-heavy mission bands. Stoke's differentiation is real—reusable upper-stage mobility, return-from-orbit capability, and a medium-lift profile—but the moat is still architectural rather than commercial because public proof on cadence, booked backlog, and realized pricing remains thin. Competitive pressure is therefore high even with rival schedule slips, because launch buyers can multi-home and because incumbents own the strongest distribution, regulatory familiarity, and mission-assurance brands.
sections:
- id: landscape-and-player-classes
  title: 'Landscape: direct peers, incumbents, substitutes, and likely entrants'
  body: 'The relevant competitive set for Stoke is broader than a list of medium-lift startups. The nearest direct comparison class is reusable or partially reusable vehicles targeting commercial and government missions in the small-to-medium payload range: Rocket Lab''s Neutron, Firefly''s Eclipse, and Relativity''s Terran R. SpaceX matters twice over: Falcon 9 is the current market-clearing benchmark for reusable launch, rideshare packaging, and schedule certainty, while Starship represents the only retained architecture that explicitly matches Stoke on full-system reusability and then extends it to much larger payload classes. Incumbents ULA and Arianespace compete differently, leaning on mission assurance, institutional relationships, and sovereign-access narratives rather than startup-style disruption. Substitutes also matter. For smaller payloads, Falcon 9 rideshare and Rocket Lab Electron can solve the launch job without a dedicated Nova mission, especially when price or schedule
    dominates. The field is unlikely to stay static: ESA''s launcher challenge shows governments are actively trying to create more regional options, which means Stoke is entering a market where both startup peers and sovereign-backed challengers keep accumulating.'
