    severity: material
    topic: switching-cost-proof
    missingEvidence: Direct evidence on migration cost, payload-adapter recertification burden, exclusivity terms, and whether buyers actually multi-home across launch providers.
    whyItMatters: Switching-cost depth determines whether Stoke can convert technical differentiation into recurring commercial leverage rather than one-off mission wins.
    diligencePath: Interview launch customers, review standard launch contracts, and request examples of payloads that switched providers after qualification work began.
