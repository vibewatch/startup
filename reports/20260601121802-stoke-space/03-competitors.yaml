- id: distribution-regulation-and-switching-costs
  title: Distribution power, regulatory posture, and switching costs
  body: 'Launch is not sold only on payload charts. Distribution power comes from pads, mission assurance, launch history, procurement eligibility, and the ability to fit within a customer''s scheduling model. That favors incumbent operators and the best-capitalized challengers. SpaceX combines rideshare frequency with a launch record customers already understand. ULA and Arianespace package trust differently: ULA stresses national-security, civil, and commercial precision, while Arianespace ties Ariane 6 to European autonomous access and long institutional relationships. Rocket Lab''s advantage is narrower but tangible, with Electron heritage, a dedicated Neutron pad in Virginia, and explicit Space Force on-ramping into NSSL Lane 1. Firefly and Relativity are further behind on trust accumulation even though they have real momentum—Northrop backing in Firefly''s case and meaningful launch-service agreements in Relativity''s. The FAA licensing stack and the new user-fee regime matter here
    because launch providers must clear operator licensing, payload review, environmental review, and financial responsibility hurdles before they can sell missions at scale. Switching costs for buyers are therefore real but not absolute: once a vehicle is baselined around payload adapters, mission assurance, and a schedule window, changing providers is painful, yet the market still allows multi-homing because few public sources show exclusivity or deep software-like lock-in.'
