- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - moat claim
  - threat
  - severity
  - mitigation/diligence ask
  rows:
  - - Upper-stage reuse creates a distinct product wedge
    - Starship also explicitly markets full-system reuse and much higher payload
    - High
    - Request Nova mission classes where reusable upper-stage operations matter enough to offset Starship or Falcon substitutes
  - - Medium-lift right-sizing avoids overkill from heavy launchers
    - Neutron, Eclipse, and Terran R are all converging on the same medium-to-large payload band
    - High
    - Request Stoke win-loss analysis versus named medium-lift peers by payload class and orbit
  - - Full reusability should drive best-in-class economics
    - Public evidence does not yet show Nova list pricing, realized $/kg, or turnaround cost
    - High
    - Request pricing model, refurbishment assumptions, and first 10-flight cost curve
  - - Government pathways deepen trust and distribution
    - NSSL Lane 1 still requires a successful first launch before task-order competition
    - High
    - Request mission-assurance roadmap, launch-site status, and timing to first certified bid
  - - On-orbit mobility and return capability raise switching costs
    - Customers can still multi-home because contracts appear negotiated and not deeply exclusive
    - Medium
    - Request contract length, exclusivity terms, payload-adapter lock-in, and evidence of migration cost
  - - Market expansion should support multiple winners
    - Adverse market evidence still warns of launch-company shakeout and SpaceX-centered competition
    - High
    - Request booked backlog, target cadence, and verticals where Stoke avoids pure price competition
  notes: Severity is an analytical judgment drawn from retained evidence, not a company-reported risk score. Each row names the diligence artifact needed to convert architecture claims into underwriting proof.
