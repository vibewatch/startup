- id: moat-durability-and-adverse-evidence
  title: Moat durability and adverse competitive evidence
  body: 'The moat case for Stoke is strongest when the mission values what Nova alone says it can do: rapid reuse with an orbital upper stage that can reposition, loiter, and bring payloads back. If that functionality proves operationally real, it is more than a cost story; it is a product expansion of what launch can include. However, the retained adverse evidence shows why that moat is not yet durable enough to underwrite on architecture alone. SpaceNews'' 2026 reporting makes clear that peers still think first about competing with SpaceX, not with one another, because SpaceX sets the dominant price and cadence frame. The same reporting also shows that the market has already washed out many under-capitalized entrants, which cuts both ways for Stoke: fewer surviving rivals helps, but it also highlights how unforgiving launch economics remain. Neutron, Eclipse, and Terran R all carry schedule risk, yet each also has real assets—pad progress, government pathways, strategic investors, or multibillion-dollar
    agreements—that can convert into pressure quickly if execution turns. The practical conclusion is that Stoke''s moat is promising but unproven. Public evidence still lacks Nova backlog depth, realized pricing, launch cadence, and customer retention data strong enough to demonstrate that upper-stage reusability translates into a durable commercial edge rather than an elegant technical claim.'
