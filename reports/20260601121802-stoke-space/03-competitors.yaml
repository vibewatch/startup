- id: TP003
  title: Pricing / packaging comparison
  columns:
  - provider
  - price/unit/contract model
  - included capabilities
  - discount or unknowns
  - implication
  rows:
  - - Stoke Space
    - Custom mission contract; no retained public price card
    - Dedicated medium-lift launch, reusable upper-stage operations, potential return from orbit
    - No public realized $/kg, mission minimum, or reflight economics
    - Architecture may justify premium or lower cost floor, but public benchmarking is weak
  - - SpaceX Falcon 9 rideshare
    - $350k for 50 kg to SSO plus $7k/kg additional mass; missions about every 4 months
    - Shared launch plate, frequent schedule, booking workflow, licensing information
    - Dedicated-mission economics not shown on this page
    - Sets the clearest public smallsat benchmark and substitute option
  - - SpaceX Starship
    - Custom sales for most missions; lunar and Mars cargo start no earlier than 2028 at $100M per metric ton
    - Very large payload capacity, deep-space mission packaging, full-system reuse story
    - No generic LEO commercial list price disclosed
    - Long-term ceiling for capability, but not yet a broad public apples-to-apples price reference
  - - Rocket Lab
    - Negotiated launch sales for Electron and Neutron in retained source set
    - Dedicated small launch today, medium-lift launch later, precision orbit options via Kick Stage
    - No simple public price card retained for either vehicle
    - Competes on dedicated service and mission fit more than on public list pricing
  - - Firefly
    - Competitive pricing language, but retained official pages do not disclose a fee card
    - Responsive launch, mobile launch systems, Alpha and Eclipse mission packaging
    - No disclosed mission minimum or reusable-economics detail
    - Useful challenger where quick response matters, but difficult to benchmark publicly
  - - Relativity Space
    - Negotiated launch agreements; no public fee card retained
    - Large fairing, reusable vehicle story, commercial and government launch services
    - No public list pricing despite large contract tally
    - Positioning relies on future economics rather than visible current pricing
  - - ULA / Arianespace
    - Custom mission pricing and institutional contracting
    - Precise insertion, heavy mission assurance, sovereign or national-security fit, multi-manifest options
    - No easy public apples-to-apples price cards retained
    - Often wins on trust or policy fit rather than transparent advertised price
  notes: Only SpaceX rideshare exposes a simple public smallsat price reference in the retained source set. All other rows preserve unknowns instead of fabricating comparable mission prices.
