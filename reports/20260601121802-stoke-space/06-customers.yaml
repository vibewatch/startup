- id: commercial-demand
  title: Commercial demand exists at the market level, but public named-logo proof remains thin
  body: |-
    Commercial demand for launch capacity is not the problem Stoke needs to solve; conversion is. Company releases repeatedly describe a substantial manifest of contracted commercial launches and say Nova is being developed for satellite constellation deployment, in-space mobility, and downmass. Independent market work is directionally supportive: McKinsey projects a major increase in active satellites by 2030 and argues medium and heavy vehicles remain economically suited to deploying large constellations. Space Capital’s 2026 market note similarly frames demand for additional launch providers as plausible once incumbent capacity is consumed by internal constellations and rising national-security needs.

    However, the public evidence boundary is stark. Stoke has not named those commercial launch customers, disclosed launch counts, published deposit schedules, or identified the specific constellations and operators in queue. That leaves commercial proof in a middle state: stronger than pure aspiration because the company is willing to state a contracted manifest in financing materials, but far weaker than a named backlog with public mission dates. Investors should therefore treat commercial demand as validated at the market level and only partially validated at the company level. The one fully underwritten commercial fact today is that a real market exists for more launch supply; the still-unresolved question is how much of that demand Stoke specifically controls.
  claimRefs:
  - CU010
  - CU011
  - CU012
  - CU013
  - CU021
  - CU022
  - CU030
  - CU033
  - CU038
