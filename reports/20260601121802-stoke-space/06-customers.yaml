- id: pricing-and-segmentation
  title: Customer economics are defined by SpaceX’s price umbrella and a crowded dedicated-launch menu
  body: |-
    Nova’s buyer proposition has to be understood against the menu customers can already buy. On the low-mass end, SpaceX advertises rideshare access at $350,000 for 50 kilograms to SSO, with additional mass at $7,000 per kilogram and regular SSO opportunities. That pricing is hard for any newcomer to ignore because it gives customers a transparent fallback option for many smallsat deployments. Below Nova’s class, Rocket Lab’s Electron and Firefly’s Alpha already market dedicated access for small payloads. At the higher end of Stoke’s intended segment, Rocket Lab’s Neutron and Firefly’s MLV are also selling reusable or scale-oriented medium-lift narratives.

    This is why Stoke’s own public language around full reusability matters. Its leadership has argued in public that the company must compete with SpaceX on price and that full reuse is the route to the lowest long-run cost floor. That is strategically coherent, but the burden of proof sits with execution. Until Nova flies, commercial buyers are being asked to underwrite a future price-and-service promise rather than a current offering. The practical implication is that Stoke’s first customers are likely to skew toward missions that value strategic diversification, schedule access, or mission-specific responsiveness enough to tolerate newcomer risk rather than pure lowest-cost commodity launch buying.
  claimRefs:
