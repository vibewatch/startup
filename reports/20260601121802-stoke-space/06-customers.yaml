tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Named buyer / user / payer
  - Primary use case
  - What public proof shows
  - Strategic value
  - Key gap
  rows:
  - - U.S. Space Force / SSC Lane 1
    - Buyer and payer are SSC / U.S. Space Force; users are national-security payload programs
    - Non-high-priority national-security launches to easier orbits
    - Stoke is in the IDIQ pool and has a mission-assurance task order
    - Best public anchor because it is a formal launch-procurement pathway
    - No competed mission order yet; first successful launch still required
  - - Defense Innovation Unit / NRSD
    - Buyer and payer are DIU; user is DoD logistics and responsive-space missions
    - Responsive cargo delivery to, through, and from space
    - DIU paid Stoke to prototype a specific dual-use capability
    - Proves a second government buyer sees mission relevance in the architecture
    - Small development contract, not recurring launch-service revenue
  - - Commercial constellation operators
    - Buyer would be the constellation owner; users are broadband, Earth observation, and mobility networks
    - Batch deployment and replenishment of multi-satellite networks
    - Company claims a contracted commercial manifest and public demand studies support need for more launch supply
    - Largest eventual TAM if Nova reaches service
    - No named operators, dates, or contract values disclosed
  - - Civil and in-space-mobility missions
    - Buyer could be civil agencies or commercial in-space operators; user is mission operator
    - Orbit insertion, repositioning, long dwell, and return-of-assets missions
    - Nova marketing explicitly includes in-space mobility and downmass use cases
    - Expands customer set beyond one-way launch
    - No public mission awards or named counterparties
  - - Price-sensitive smallsat buyers
    - Buyer is satellite startup or mission integrator; user is payload owner
    - Rideshare or dedicated small launch
    - SpaceX, Electron, and Alpha already provide alternatives today
    - Shows Stoke must sell more than generic launch capacity
    - Nova is not yet flying and cannot yet offer a live booking comparison
  notes: Segments separate public government proof from market-level commercial demand. Stoke’s strongest evidence today is procurement access, not disclosed recurring launch revenue.
