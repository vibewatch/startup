figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Stoke’s path from customer need to repeat launch is bottlenecked at first-flight proof; everything before that is stronger in the public record than everything after it.
  data:
    nodes:
    - id: need
      label: Mission need
      detail: Government buyers need resilient launch capacity and responsive-space options; commercial buyers need cadence, orbit access, and competitive price.
    - id: screen
      label: Vehicle fit screening
      detail: Buyers test whether Nova’s medium-lift class, reuse thesis, and orbit flexibility fit launch or cargo missions.
    - id: access
      label: Procurement or contracting access
      detail: Relationship takes the form of a Lane 1 on-ramp, a prototype contract, or an undisclosed commercial reservation.
    - id: milestone
      label: Vehicle maturity checkpoint
      detail: Because Nova has not yet flown to orbit, buyers wait on first-flight proof before assigning high-consequence missions.
    - id: award
      label: Mission award or launch assignment
      detail: This stage is public for incumbents in Lane 1, but not yet public for Stoke.
    - id: repeat
      label: Repeat use / expansion
      detail: Only after successful missions can Stoke move from eligibility and intent to retention and expansion economics.
  approximationNotes: The stages synthesize procurement mechanics and launch-customer buying logic from reviewed public sources.
