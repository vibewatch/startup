  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: commercial-manifest
    missingEvidence: Named commercial customers, mission counts, and contract values behind the disclosed manifest.
    whyItMatters: Without counterparties and economics, investors cannot distinguish soft reservations from durable booked demand.
    diligencePath: Request manifest by customer, orbit, mission year, deposit status, and cancellation terms.
    relatedQuestionRefs:
    - QU009
    - QU025
    relatedTableRefs:
    - TU003
    - TU004
  - type: missing-source
    severity: material
    topic: retention-gap
    missingEvidence: Any repeat-flight, renewal, or post-mission customer-satisfaction data.
    whyItMatters: Durability is central to launch economics, especially for a reusable-service thesis.
    diligencePath: Request customer reference calls plus any internal rebooking pipeline or LOI-to-contract conversion data.
    relatedQuestionRefs:
    - QU018
    - QU025
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: material
    topic: pricing-thesis
    missingEvidence: Nova pricing targets, standard reservation terms, and refund / rebooking policies by mission type.
    whyItMatters: SpaceX’s transparent rideshare price sets a visible benchmark that Stoke must answer with either lower cost or differentiated service.
    diligencePath: Obtain customer deck with target $/kg, minimum mission size, deposit schedule, and schedule-assurance terms.
    relatedQuestionRefs:
    - QU011
    - QU020
    - QU024
    relatedTableRefs:
    - TU005
  - type: stale
    severity: minor
    topic: lane1-demand
    missingEvidence: Updated 2026-2027 Lane 1 RFP timing and whether Stoke has advanced from on-ramp into active competitions.
    whyItMatters: The procurement path is real, but timing determines when the government anchor can become revenue.
    diligencePath: Check future SSC solicitations, ask management for RFP participation timeline, and monitor first-launch milestone.
    relatedQuestionRefs:
    - QU004
    - QU016
    relatedTableRefs:
    - TU002
