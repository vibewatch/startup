evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-control-map
    missingEvidence: >-
      A current fully diluted cap table, exact board roster, committee map, and investor-control rights summary after
      the 2025-2026 financings.
    whyItMatters: >-
      Public sources show credible leadership and several directors, but not who controls the company or how new
      investors and debt providers shape governance.
    diligencePath: >-
      Request the latest board list, shareholder agreement summary, cap table by series, and any debt or investor
      protective provisions.
