      February 2026 extension.
    whyItMatters: The chapter can support capital raised, but not precise dilution, ownership transfer, valuation, or leverage risk.
    diligencePath: >-
      Request signed financing documents, the board financing memo, debt facility summary, and any internal mark
      schedule used after the extension.
    relatedQuestionRefs:
      - QO018
    relatedTableRefs:
      - TO003
