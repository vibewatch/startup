- id: valuation-stance-and-disclosure-gaps
  title: Valuation Stance and Disclosure Gaps
  body: 'The strongest financial conclusion is not that Stoke lacks demand, but that the company remains difficult to underwrite cleanly because it is pre-revenue on recurring launch services, capital intensive, and thinly disclosed. Secondary-market reference points cluster around roughly $52 per share and about $3.42 billion of implied valuation on Yahoo Finance, Forge, and Nasdaq Private Market, but those same sources lag the company’s own cumulative funding disclosure of $1.34 billion and provide no useful visibility into preference stack, liquidation rights, or debt treatment. That makes them helpful sentiment markers, not valuation truth. The adverse evidence matters as well: launch financing is harder than it was in the early 2020s, and Stoke still has to execute first flight, certification, and eventually the transition from expendable early missions to reusable economics. Until management opens the data room on pricing, backlog, payment milestones, cash, burn, debt terms, and post-flight
    unit economics, any valuation stance should be framed as option value on a technically promising but still pre-service launch platform.'
  claimRefs:
