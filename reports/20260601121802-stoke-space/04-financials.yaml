  title: Financials
  summary: 'Stoke Space remains pre-revenue on recurring orbital launch services as of 2026-06-01: public sources show government awards and a commercial launch manifest, but Nova has not yet reached first orbital service and pricing is undisclosed. Official disclosures put cumulative capital raised at $1.34B, including a disclosed $100M Silicon Valley Bank debt facility inside the October 2025 Series D. The investment case therefore hinges on capital intensity, first-flight and certification timing, and unusually large disclosure gaps around cash, burn, backlog economics, and unit margins.'
