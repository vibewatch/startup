- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Value or range
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Headquarters / manufacturing footprint
    - 168,000 sq ft HQ
    - High
    - Signals large fixed cost before launch cadence ramps
    - Request facility lease/ownership costs and major equipment depreciation
  - - Operating footprint
    - Seattle-area manufacturing + Moses Lake test site + Cape Canaveral launch ops
    - High
    - Multiple active sites imply ongoing engineering, operations, and travel overhead
    - Request site-level opex split and staffing by location
  - - Additional test footprint
    - 75-acre Moses Lake test facility
    - Medium
    - Large test infrastructure usually correlates with continuing maintenance and test spend
    - Request annual test-site operating cost and capitalized equipment list
  - - Authorized launch cadence
    - Up to 10 launches per year after startup phase
    - High
    - Sets the outer bound for revenue capacity, pad utilization, and fixed-cost absorption
    - Request ramp schedule from first flight to steady-state cadence
  - - Initial flight model
    - Phase 1 flights modeled as expendable before reuse approvals
    - High
    - Delays proof that full-reuse economics can drive margin improvement
    - Request cost delta between early expendable flights and intended reusable end state
  - - Launch insurance / financial responsibility
    - Up to $500M third-party and $100M government caps under statute
    - High
    - Adds working-capital and insurance requirements near licensed operations
    - Request modeled maximum probable loss and planned insurance program
  - - Per-mission commercial launch price
    - Undisclosed publicly
    - Low
    - Without price, deposits, or payment timing there is no clean payback math
    - Provide signed contract economics or at least target ASP by payload class
  - - Gross margin / per-launch cost
    - Undisclosed publicly
    - Low
    - Unit-margin visibility is the core missing input for underwriting
    - Provide flight cost build, refurbishment assumptions, and margin bridge by phase
  notes: Public evidence supports capacity and fixed-cost proxies, but not realized launch price or gross margin.
