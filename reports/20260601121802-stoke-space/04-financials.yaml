  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway
    missingEvidence: Current cash balance, debt draw status, and a monthly cash bridge since the February 2026 extension.
    whyItMatters: Without those numbers, runway dependency cannot be converted from management narrative into a solvency view.
    diligencePath: Request current cash, debt utilization, and monthly cash-flow statements through the latest close.
    relatedQuestionRefs:
    - QI019
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: blocking
    topic: pricing-and-recognition
    missingEvidence: Per-mission launch price, deposits, payment milestones, and accounting policy for pre-launch revenue recognition.
    whyItMatters: Price and timing determine whether the commercial manifest is economically attractive or just strategically interesting.
    diligencePath: Review standard launch contracts, booking terms, and revenue-recognition memos for at least two customer agreements.
    relatedQuestionRefs:
    - QI005
    - QI006
    relatedTableRefs:
    - TI001
    - TI002
  - type: private-evidence-only
    severity: material
    topic: backlog-quality
    missingEvidence: Commercial customer names, backlog value, launch dates, deposits, and cancellation terms.
    whyItMatters: Without counterparty identity and economics, the disclosed manifest cannot be translated into credible forward revenue.
    diligencePath: Request a backlog schedule with customer, mission, contract value, deposit status, and termination rights.
    relatedQuestionRefs:
    - QI003
    relatedTableRefs:
    - TI001
    - TI005
  - type: missing-source
    severity: material
    topic: debt-terms
    missingEvidence: Credit agreement terms for the disclosed Silicon Valley Bank facility, including collateral, covenants, pricing, warrants, and amortization.
    whyItMatters: Debt can tighten downside liquidity or subordinate equity even when the headline raise looks large.
    diligencePath: Request the signed facility agreement and a schedule of draws, repayments, and compliance certificates.
    relatedQuestionRefs:
    - QI013
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Per-flight cost build, refurbishment assumptions, and margin bridge from early expendable missions to later reusable operations.
    whyItMatters: The investment thesis depends on reuse-driven cost compression, but Phase 1 public records do not prove those economics.
    diligencePath: Request detailed mission cost models for Phase 1 and target reusable-state operations, including refurbishment labor and turnaround time.
    relatedQuestionRefs:
    - QI025
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: material
    topic: valuation-structure
    missingEvidence: Cap table, preferred-share rights, liquidation preferences, and internal valuation support for the latest extension round.
    whyItMatters: Secondary quotes are noisy and can materially misstate common-equivalent value without security-level rights.
    diligencePath: Request the latest cap table, charter documents, and board materials supporting the most recent financing valuation.
    relatedQuestionRefs:
    - QI022
    - QI023
    relatedTableRefs:
    - TI005
sections:
- id: revenue-model-and-traction
  title: Revenue Model, Pricing, and Disclosed Traction
  body: 'Stoke’s public revenue story is still mostly a pipeline story rather than an operating-income story. The company’s product is Nova: a reusable medium-lift launch system positioned for on-demand orbital insertion, cargo return, and other in-space mobility missions. Publicly disclosed monetization proxies come from government work and management commentary rather than completed commercial launches. Stoke has disclosed a $4.5 million DIU prototype award and a $5 million NSSL Lane 1 task order, and management has repeatedly pointed to a substantial manifest of contracted commercial launches. What is missing is the information that matters most for underwriting: who the commercial customers are, what they are paying, whether they have posted deposits, and how much revenue is recognized before launch versus after mission completion. Boltline adds optionality, but public sources only show it as a product the company is funding, not a stand-alone revenue line with named customers. Taken
    together, the evidence supports real demand signals, but not proof of realized launch-service revenue as of the canonical run date.'
  claimRefs:
  - CI017
  - CI018
  - CI019
  - CI020
  - CI021
  - CI022
  - CI044
  - CI045
  - CI046
  tableRefs:
