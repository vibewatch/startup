    - One-off government prototype contract under NRSD
    - Disclosed at $4.5M
    - Awarded in 2024; development work underway
    - Medium — real dollars, but not recurring orbital service revenue
    - Review award scope, milestone schedule, and whether any option value remains
  - - NSSL Lane 1 task order and IDIQ gateway
    - $5M task order plus eligibility to compete for launch missions
    - Disclosed at $5M task order; broader launch pricing undisclosed
    - On-ramped; monetization beyond task order depends on certification and task awards
    - Medium — credible government demand signal, but most economics remain pipeline
    - Confirm certification path, task-order timing, and mission-level pricing assumptions
  - - Contracted commercial launch manifest
    - Future Nova launch reservations or launch service contracts
    - Per-mission price, deposits, and backlog value undisclosed
    - Management cites a substantial manifest, but customer names are not public
    - Medium-low — demand signal without named customers or cash evidence
    - Obtain customer list, signed contracts, deposit schedule, and cancellation rights
  - - Core Nova launch services
    - Payload delivery and potentially return / mobility missions once Nova flies regularly
    - Launch fee undisclosed
    - Pre-first-flight; no public recurring launch revenue yet
    - Low until first orbital mission and repeat cadence are demonstrated
    - Request price card, revenue-recognition policy, and per-mission payment milestones
  - - Boltline software / tooling
    - Software for engineering and manufacturing mentioned as an investment target
    - External pricing undisclosed
    - Product exists, but public sources do not show external customers or revenue
    - Low — monetization not evidenced publicly
    - Clarify whether Boltline is internal-only, bundled, or sold as stand-alone software
  notes: Government awards are disclosed; commercial pricing, deposits, and backlog remain private.
