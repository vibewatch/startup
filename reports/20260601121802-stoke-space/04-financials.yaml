- id: cost-structure-and-capital-intensity
  title: Cost Structure, Unit Economics, and Capital Intensity
  body: The financial burden at Stoke is dominated by fixed assets and development throughput long before recurring launch revenue can scale. Official pages describe a 168,000-square-foot vertically integrated headquarters, a Washington test site, and active launch operations buildout in Florida; third-party coverage adds a 75-acre Moses Lake facility and a launch site designed to handle multiple vehicles. The LC-14 buildout alone includes a horizontal integration facility, launch mount, 121-foot umbilical tower, propellant systems, and other permanent infrastructure. The public regulatory record further shows that early operations are expected to start in a phased, expendable configuration, with full reusable operations deferred until a supplemental environmental review. That matters financially because Stoke’s full-reuse thesis is the mechanism that should eventually compress cost per launch and support margin expansion; if early flights are expendable, then some of the near-term economics
    look more like a conventional development-heavy launcher than the eventual end-state pitch. On top of hardware and site capex, launch licensing requires separate insurance or financial-responsibility capacity, which adds another cash burden as flight operations approach.
  claimRefs:
  - CI025
  - CI027
  - CI028
  - CI029
  - CI030
  - CI031
  - CI032
  - CI043
  tableRefs:
  - TI003
  figureRefs:
  - FI002
  - FI004
- id: capital-adequacy-and-runway-dependency
  title: Capital Adequacy, Debt Facility, and Runway Dependency
  body: Stoke has accumulated an unusually large capital base for a private launcher, but the structure of that capital also makes timing critical. Company disclosures move the cumulative total from $480 million after the January 2025 Series C, to $990 million after the October 2025 Series D, to $1.34 billion after the February 2026 extension of that same Series D. The October 2025 announcement also disclosed a $100 million Silicon Valley Bank debt facility, which is important because it introduces leverage into a business that is still pre-routine-service. Management explicitly framed the 2025 financing as runway to complete development and demonstrate Nova through first flights, which implies that the capital plan is milestone-based rather than tied to already proven cash generation. The public record shows no current cash balance, no monthly burn figure, and no numeric runway months. That means the practical underwriting question is not whether Stoke has raised enough capital historically,
    but whether the existing balance sheet can bridge vehicle completion, first flight, certification, and conversion of a not-yet-identified commercial manifest into paid, repeat launches without another financing event under worse terms.
