- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact on investment decision
  - Exact diligence path
  rows:
  - - Current cash balance and unrestricted liquidity
    - Without cash visibility, there is no reliable view of runway or downside cushion
    - Request current cash, debt draw status, and monthly cash bridge since the February 2026 extension
  - - Monthly burn and site / program spend split
    - Cannot test whether Series D proceeds truly cover first flights and certification
    - Request trailing 12-month burn by engineering, manufacturing, launch-site, test, and SG&A buckets
  - - Commercial manifest customer names, backlog value, and deposits
    - Demand quality cannot be underwritten without counterparty and cancellation detail
    - Request signed contract schedules with customer name, mission date, contract value, deposit amount, and termination clauses
  - - Per-mission price, payment milestones, and revenue-recognition policy
    - Blocks any credible payback, margin, or working-capital model
    - Request standard contract economics and accounting policy for pre-launch milestones versus post-launch recognition
  - - Debt facility terms, covenants, and collateral package
    - The disclosed 100M debt line could materially change downside outcomes
    - Request credit agreement, draw schedule, amortization, interest margin, warrants, and collateral coverage
  - - Early-flight cost structure and post-reuse margin bridge
    - Stoke’s thesis depends on future reuse economics that Phase 1 flights do not yet prove
    - Request costed flight model for expendable Phase 1, reusable target state, and refurbishment assumptions by vehicle stage
  - - Cap table and preferred-share terms behind secondary marks
    - A quoted secondary price is not enough to convert to fair value
    - Request most recent capitalization table, series rights, liquidation preferences, and any shadow valuation analyses
  notes: These are the missing private inputs most likely to change the underwriting outcome.
