chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Public evidence supports a large and growing global launch-services market, but not one canonical TAM: retained sources place the outer shell anywhere from about $24.4 billion to $41.3 billion by 2030, while current commercial launch revenue was $12.4 billion in 2025. The serviceable market relevant to a new entrant like Stoke Space is narrower than those headlines and is concentrated in recurring LEO-constellation demand, government and national-security launches, GEO replenishment, and schedule-sensitive small/medium satellite missions. Across those buyer groups, cadence, reliability, certification, and orbit control are often more decision-useful than nominal payload alone.
sections:
  - id: market-boundary
    title: Market boundary and what counts as launch demand
    body: >-
      The first task is to define what “the market” is before accepting any TAM figure. Retained launch-services sources consistently include the pre-launch and post-launch services required to put payloads into orbit across LEO, MEO, GEO, and beyond GEO for commercial, military, and government users. That includes mission integration, payload processing, range and launch execution, telemetry, and related support sold as launch services. It does not include upstream satellite manufacturing, ground equipment, or downstream satellite-service revenue, even though those markets are adjacent and often grow together. For Stoke Space, the practical boundary is narrower still: the relevant market is orbital launch demand for satellite customers that need repeated access to orbit, not the entire space-technology stack. Commercial communications payloads dominate the present volume base, but government and national-security demand still shape infrastructure, certification requirements, and pricing discipline for the whole category. That distinction matters because volume growth can outpace addressable revenue growth. That distinction matters because volume growth can outpace addressable revenue growth.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM005
      - CM006
      - CM011
    tableRefs:
      - TM001
  - id: sizing-lenses
    title: TAM, SAM, and contradictory sizing lenses
    body: >-
      Public market estimates are directionally useful but too inconsistent to collapse into one number. Grand View’s retained market report and press release support a broad launch-services TAM reaching $41.31 billion by 2030, while The Business Research Company’s 2026 report points to a much lower $24.42 billion by 2030. SIA’s 2026 industry release adds a realized 2025 commercial launch-revenue baseline of $12.4 billion and BryceTech reports 325 orbital launches in 2025, 87% of them commercial, which is a better anchor for near-term serviceable demand than generic top-down TAM alone. A serviceable lens for Stoke Space therefore sits inside the broader launch-services shell and is concentrated in recurring constellation deployment and replenishment, durable government manifests, steady GEO replacement, and premium schedule-control missions. The public record can frame that SAM qualitatively, but it cannot produce a clean Stoke-specific SOM without private data on target orbit mix, win rates, pricing, and expected annual cadence.
    claimRefs:
      - CM007
      - CM008
      - CM009
      - CM010
      - CM012
      - CM013
      - CM014
      - CM015
      - CM041
      - CM042
      - CM043
    tableRefs:
      - TM002
    figureRefs:
      - FM001
      - FM002
  - id: buyer-motion
    title: Buyer, user, and payer segmentation by mission type
    body: >-
      Launch is not bought by one monolithic customer. In LEO broadband, the buyer is typically a constellation operator or program office that pays from a network-build or replenishment budget and values manifest certainty above headline payload maximums. Amazon Leo and Telesat Lightspeed show how these buyers contract across multiple missions because deployment speed determines when capacity goes live and when revenue starts. In national security, the buyer is a procurement authority such as Space Systems Command, the user is a defense or intelligence mission, and the payer is the federal budget; certification, reliability, and range integration matter more than lowest advertised price. GEO operators create a different but still material segment where fewer, higher-value spacecraft support telecom, government, and resilience use cases. Finally, small and medium satellite operators split into cost-first rideshare users and time-sensitive dedicated-launch buyers who pay for orbit control, schedule control, or responsive access.
    claimRefs:
      - CM016
      - CM017
