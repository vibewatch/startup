callouts:
  - calloutType: insight
    title: Frequency demand is real, but the open market is narrower than the headline TAM
    body: >-
      The evidence shows a launch market already dominated by commercial, communications-heavy activity, but a meaningful share of that volume is either captive to vertically integrated operators or gated by certification and infrastructure. The investable question for Stoke is therefore the size of the serviceable recurring slice, not the size of the outer shell.
    claimRefs:
      - CM012
      - CM016
      - CM043
  - calloutType: risk
    title: Government demand is durable but hardest to access
    body: >-
      National-security manifests are large and funded, yet they reward mission assurance, certification, and range integration more than simple price claims. New entrants only capture this demand after they clear those institutional gates.
    claimRefs:
      - CM021
      - CM023
      - CM047
