tables:
  - id: TM001
    title: Market definition table
    columns:
      - segment/category
      - included spend
      - excluded spend
      - buyer/payer
      - relevance
    rows:
      - - Global launch services
        - Pre-launch and post-launch services for orbital payload deployment across LEO, MEO, GEO, and beyond GEO
        - Satellite manufacturing, ground equipment, in-orbit operations, and downstream satellite-service revenue
        - Commercial satellite operators, governments, defense buyers
        - Outer TAM shell; useful ceiling but too broad to equal Stoke's served market.
      - - Commercial satellite launch demand
        - Launch execution for communications, EO, navigation, and other commercial payloads
        - Non-launch portions of the space-technology stack
        - Constellation operators, satellite companies, launch aggregators
        - Current volume base is heavily commercial and communications-led.
      - - National security and civil government launch
        - Missions for NRO, GPS, WGS, defense, and science payloads
        - Non-orbital defense systems or broader defense IT budgets
        - Procurement authorities and government agencies
        - Durable payer segment; high reliability and certification requirements.
      - - LEO constellation deployment and replenishment
        - Multi-mission launch procurement for broadband and proliferated constellations
        - Subscriber-service revenue and satellite manufacturing spend
        - Network operator or constellation program office
        - Major frequency driver and a key cadence-sensitive buyer class.
      - - GEO replenishment and hybrid architectures
        - Replacement and augmentation launches for GEO telecom and government satellites
        - Terrestrial telecom revenue or non-launch satcom services
        - GEO operator, sovereign comms program, defense buyer
        - Smaller than LEO by volume but still relevant for higher-value missions.
      - - Dedicated small/medium satellite launch
        - Missions bought for orbit precision, schedule control, or responsive access
        - Payload sharing that accepts generic rideshare constraints
        - Smallsat operator, defense customer, satellite integrator
        - Relevant where buyers value timing and tailored orbit over lowest unit cost.
    notes: >-
      Boundary is service-based rather than ecosystem-wide: values and claims in this chapter refer to launch services, not the entire space economy or satellite-services revenue stack.
