  - id: FM004
    title: Adoption funnel or value-chain map
    type: funnel
    layout: standard
    summary: Launch demand converts to revenue only after buyers clear mission need, vehicle fit, certification, manifest, and deployment steps.
    data:
      items:
        - label: Mission need defined
          value: 1
          detail: A constellation milestone, GEO replacement, national-security payload, or smallsat mission creates demand.
          tone: neutral
        - label: Orbit and schedule screened
          value: 2
          detail: Buyer decides whether rideshare is acceptable or dedicated control is required.
          tone: neutral
        - label: Reliability and certification gate
          value: 3
          detail: High-value government missions and risk-intolerant buyers narrow the provider set sharply.
          tone: warning
        - label: Manifest and integration reserved
          value: 4
          detail: Pad access, payload processing, and launch-range capacity determine whether demand converts on time.
          tone: warning
        - label: Launch and replenishment flywheel
          value: 5
          detail: Once the buyer trusts cadence and deployment quality, launches become recurring rather than one-off.
          tone: positive
    approximationNotes: >-
      The funnel is conceptual rather than probabilistic; it maps the gating steps buyers repeatedly face in public constellation and government launch examples.
