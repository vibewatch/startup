  - id: TM004
    title: Growth drivers and constraints table
    columns:
      - driver or constraint
      - direction
      - timing
      - implication
      - diligence ask
    rows:
      - - LEO constellation rollout and replenishment
        - tailwind
        - current
        - Creates recurring launch cadence rather than one-off missions.
        - What share of Stoke's pipeline is tied to replenishment versus first-time deployment?
      - - Reusable launch cost compression
        - tailwind
        - current
        - Lower marginal costs expand the buyer pool and make more frequent launches economical.
        - What recurring-cost assumptions does Stoke underwrite at target cadence?
      - - National security proliferated-space demand
        - tailwind
        - 2026-2029
        - Durable public budgets support a multi-year manifest but favor certified, trusted providers.
        - When can Stoke credibly compete for Lane 1 or national-security-adjacent work?
      - - GEO and hybrid architecture renewal
        - tailwind
        - 2026-2030
        - GEO replacement adds steadier higher-value missions alongside LEO volume growth.
        - Which GEO or hybrid mission profiles fit Stoke's targeted performance envelope?
      - - Dedicated-launch value for precise orbits
        - tailwind
        - current
        - Buyers with timing or orbital constraints will pay for schedule control.
        - How often does Stoke win when orbit precision matters more than raw price?
      - - Range, pad, and payload-processing bottlenecks
        - headwind
        - current
        - Infrastructure strain can delay launches even when end demand is strong.
        - What launch-site and processing capacity does Stoke control or contract today?
      - - Certification and mission-assurance barriers
        - headwind
        - current
        - High-value buyers remain gated by qualification, reliability history, and range approval.
        - What milestone path clears Stoke into government and risk-intolerant missions?
      - - Debris, congestion, and export-control rules
        - headwind
        - current
        - Regulatory friction can lengthen sales cycles and constrain addressable missions.
        - Which regulatory approvals or debris rules most affect Stoke's target customers?
      - - Rideshare and captive-capacity competition
        - headwind
        - current
        - Some headline satellite growth is already captured by integrated incumbents or low-cost rideshare.
        - Where does Stoke win versus bundled or vertically integrated alternatives?
    notes: >-
      Several constraints are supply-side rather than demand-side: launch windows, certification, pad access, and infrastructure can cap realized share even when market demand is visibly growing.
