  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: som-gap
      missingEvidence: Stoke-specific pricing assumptions, target annual cadence, mission win rates, and qualified orbit classes needed for a numeric SOM.
      whyItMatters: Without these inputs, open evidence can bound buyer segments but cannot support a credible market-share capture model.
      diligencePath: Request internal pipeline segmentation, target price bands, mission-class roadmap, and cadence assumptions by year.
      relatedQuestionRefs:
        - QM022
        - QM023
      relatedTableRefs:
        - TM002
    - type: conflicting-data
      severity: material
      topic: contradictory-estimates
      missingEvidence: Full underlying methodologies behind the retained public launch-market forecasts and any narrower commercial-only forecast definitions.
      whyItMatters: The public TAM band is wide enough to change valuation framing, so the methodological reason for the gap matters.
      diligencePath: Obtain full analyst reports or analyst calls for Grand View, Business Research Company, and related commercial-launch forecasts.
      relatedQuestionRefs:
        - QM005
        - QM006
        - QM025
      relatedTableRefs:
        - TM002
    - type: missing-source
      severity: material
      topic: geo-replenishment
      missingEvidence: Current disclosed GEO operator orderbooks or launch manifests that isolate how much GEO replenishment is actually entering the market each year.
      whyItMatters: GEO is clearly non-zero demand, but the open record here is weaker than the LEO and government evidence.
      diligencePath: Pull operator annual reports, fleet-renewal disclosures, and satellite-manufacturer order announcements for SES, Intelsat, Eutelsat, Viasat, and EchoStar.
      relatedQuestionRefs:
        - QM015
      relatedTableRefs:
        - TM002
    - type: missing-source
      severity: material
      topic: dedicated-vs-rideshare
      missingEvidence: Public contract-level data showing how often buyers choose dedicated launch over rideshare by mission type, orbit, and schedule urgency.
      whyItMatters: The value of a Stoke-like offer depends on how large the premium control segment is versus the cost-first rideshare segment.
      diligencePath: Collect win-loss data, customer interviews, and disclosed contract awards from Rocket Lab, SpaceX rideshare, Firefly, and responsive-launch procurements.
      relatedQuestionRefs:
        - QM017
        - QM022
      relatedTableRefs:
        - TM003
        - TM004
