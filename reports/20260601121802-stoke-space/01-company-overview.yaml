  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-control-map
    missingEvidence: A current fully diluted cap table, exact board roster, committee map, and investor-control rights summary after the 2025-2026 financings.
    whyItMatters: Public sources show credible leadership and several directors, but not who controls the company or how new investors and debt providers shape governance.
    diligencePath: Request the latest board list, shareholder agreement summary, cap table by series, and any debt or investor protective provisions.
    relatedQuestionRefs:
    - QO009
    relatedTableRefs:
    - TO002
    - TO003
  - type: private-evidence-only
    severity: material
    topic: series-d-valuation-terms
    missingEvidence: Price per share, post-money valuation, investor allocations, and full debt terms for the October 2025 Series D and February 2026 extension.
    whyItMatters: The chapter can support capital raised, but not precise dilution, ownership transfer, valuation, or leverage risk.
    diligencePath: Request signed financing documents, the board financing memo, debt facility summary, and any internal mark schedule used after the extension.
    relatedQuestionRefs:
    - QO018
    relatedTableRefs:
    - TO003
  - type: private-evidence-only
    severity: material
    topic: commercial-manifest-and-operating-kpis
    missingEvidence: Named customers, contracted launch counts, backlog economics, revenue or ARR, customer count, and current employee count.
    whyItMatters: Investability and valuation depend on whether the capital base is matched by real demand, operating scale, and execution efficiency.
    diligencePath: Request the signed launch manifest, customer pipeline by mission, revenue bridge, headcount by function, and internally defined operating KPI pack.
    relatedQuestionRefs:
    - QO025
    relatedTableRefs:
    - TO001
    - TO003
  - type: missing-source
    severity: material
    topic: launch-readiness-path
    missingEvidence: A current FAA vehicle operator license path, supplemental environmental-analysis status for reusable operations, and a dated first-orbit plan.
    whyItMatters: The public corpus supports site redevelopment and competition eligibility, but it does not close the gap from infrastructure readiness to licensed orbital operations.
    diligencePath: Request licensing workback schedules, FAA correspondence, range-integration milestones, and the latest first-flight readiness review.
    relatedQuestionRefs:
    - QO022
    relatedTableRefs:
    - TO004
