company:
  name: Stoke Space
chapter:
  number: 1
  title: Company Overview
  summary: Stoke Space is a Kent, Washington-based launch developer legally formed in 2019 by former Blue Origin engineers Andy Lapsa and Tom Feldman and publicly framed by the company as launched in 2020, with a vertically integrated headquarters, Moses Lake test operations, and the SLC-14 launch-site program at Cape Canaveral. The retained record shows unusually large disclosed financing for a pre-launch vehicle program—$260 million Series C in January 2025, a $510 million Series D plus $100 million debt facility in October 2025, and a $350 million extension in February 2026 that lifted claimed cumulative capital to $1.34 billion—alongside DIU and Space Force validation. The biggest remaining overview gaps are governance/control transparency, exact Series D valuation terms, named commercial customers, and the fact that first orbital launch and full-reuse operations were still pending in the June 2026 public record.
sections:
- id: identity-stage-and-operating-footprint
  title: Identity, stage, and operating footprint
  body: 'Stoke Space’s identity is unusually clear for a private launch startup even though some key commercial metrics remain opaque. The legal and public records point to a company incorporated in 2019 but publicly narrating its launch around 2020, which matters because later sources often use the “founded in 2019” and “launched in 2020” markers interchangeably. The company’s own pages frame the product as low-cost, on-demand transport to, through, and from space rather than a single-use launcher. That positioning rests on Nova’s full-reuse architecture: a medium-lift two-stage vehicle, a reusable upper-stage system designed for on-demand orbital mobility and return missions, and hardware choices aimed at aircraft-like turnaround. The operating footprint is also material. By 2025-2026 SEC filings, Stoke’s principal place of business was in Kent, Washington; official pages add a 168,000-square-foot headquarters, a Moses Lake test site, and Cape Canaveral launch operations. The right stage
    label is therefore late-stage pre-launch developer: the company has large disclosed capital, meaningful infrastructure, and government validation, but not yet an orbital launch or public operating KPI set.'
