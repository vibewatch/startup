- id: founders-leadership-and-governance
  title: Founders, leadership bench, and governance visibility
  body: Founder and board visibility is better than the cap-table picture but still incomplete. Andy Lapsa is consistently identifiable as CEO and co-founder, while retained independent coverage identifies both Lapsa and Tom Feldman as former Blue Origin veterans and continues to anchor Feldman as the other founder and technical leader. Stoke also made a meaningful operating-bench addition in April 2024 when it appointed Paul Croci as chief financial officer and brought retired U.S. Space Force Lt. Gen. John E. Shaw onto the board. The current public team page goes further by naming Christian Garcia, Hans Koenigsmann, and Matt White alongside Shaw as directors, giving investors a view into defense, venture, SpaceX, and industrial-finance influence. Even so, governance transparency is only partial. Later Form D related-person lists include names that do not appear on the simplified public board page, implying the real governance surface is broader than the website disclosure. The practical conclusion is that Stoke’s senior bench and outside-board
    credibility are reasonably well evidenced, while exact control rights, investor ownership, committee structure, and the full current board map still require diligence-room evidence.
