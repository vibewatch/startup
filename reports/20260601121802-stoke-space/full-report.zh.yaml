      - number: '5.4'
        title: 差异化、风险和控制环境
        blocks:
          - type: paragraph
            body: >-
              Stoke 的差异化真实存在，但与风险不可分割。相较 Neutron、Terran R、RS1、Alpha、MLV 和 Vulcan，Stoke
              在中型运力级别上对上面级全复用采取了最激进的公开立场，其钢贮箱加一体化热盾选择也形成可见的架构身份。同样的选择也把执行风险集中到几个耦合系统：氢处理、热分离耦合、上面级再入、可复用周转人工，以及从初始发射走向实际回收运营的监管路径。公开控制主要是工程和项目层面的，而不是重合规型。Stoke
              把证据阶梯从 Hopper2 铺到 Zenith，再到任务工况循环测试和结构资质验证；它也围绕可重复处理而非临时共享发射台来设计
              LC-14。仍缺失的是投资者希望在这些硬件成果旁边看到的机构控制层：正式质量认证、发射运营网络安全和隐私控制、可复用着陆批准，以及量化的翻修数据。这意味着护城河可信，但尚未被公开流程成熟度完全承销。
