      - number: '7.3'
        title: 技术、日程和运营系统风险
        blocks:
          - type: paragraph
            body: >-
              Stoke 的技术证据是真的，但这些证据仍停留在组件、较小规模或边界清晰的试验活动上，还不足以证明它已经跑通完整的轨道级运营系统。Hopper2 证明上面级路线不只是
              PowerPoint，助推级发动机热试车也是严肃的推进里程碑。即便如此，公开披露的数据仍在 15
              秒跳跃试飞、首次热试车与一套可重复的轨道发射系统之间留下很大的集成缺口；后者还必须扛住上升段、级间分离、回收，并证明周转经济性。进度信号也支持谨慎判断。外部报道曾把 2025 年写成首次发射初始目标，但到
              2025 年 Series D 和 2026 年延期融资时，公开口径已经转向 2026 年初启用发射台，仍未公布发射日期。这本身不推翻投资逻辑，但会把下一个里程碑变得更二元。运营上，这套系统还横跨 Kent
              制造、Moses Lake 测试和 Florida 发射运营，流程里嵌着异地制造和跨美国运输。在这套分布式运营模型能在发射任务压力下自证之前，供应链和交接风险仍然很高。
