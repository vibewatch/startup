      - number: '3.2'
        title: 能力对比和定价透明度
        blocks:
          - type: paragraph
            body: >-
              Stoke 的核心产品逻辑不只是降低发射成本，而是一种特定的飞行器能力：Nova 被营销为完全可重复使用的中型运力火箭，其上面级能够入轨、机动、留轨并带回有效载荷。这与 Falcon 9
              的卖点有实质差异：Falcon 9 的公开发射经济性可通过拼单项目观察，但保留资料并未营销可复用上面级运营；Neutron 则强调一级返回和自带整流罩复用，而不是轨道级回收。Firefly 和
              Relativity 也围绕响应能力、可负担性或大载荷经济性定位，但保留资料更看重发射性能、日程和客户匹配，而不是上面级复用。Stoke 的问题在于，公开价格透明度压倒性集中在 SpaceX。Falcon 9
              拼单提供了清晰参考点——50 公斤送至太阳同步轨道价格为 $350,000，额外质量按 $7,000/公斤计费——而包括 Stoke
              在内的大多数对手都通过协商合同销售。这削弱了公开直接对标的力度，也意味着今天最能支撑的比较是打包逻辑和能力范围，而不是可证明的一价全包任务价格。换句话说，Stoke
              可以主张架构差异化，但还无法证明这套架构能赢下广泛价格战。
