      - number: '8.3'
        title: NSSL 锚点重要，但不足以抹掉收入前风险
        blocks:
          - type: paragraph
            body: >-
              今天给 Stoke 估值，最可辩护的方式是把它视为里程碑和期权资产。NSSL Lane 1 奖项很重要，因为它不只是品牌背书：它把 Stoke 放进了真实的政府发射采购通道。SSC 文件和 Stoke
              自己的公告都显示，初始任务订单为 $5 million；一次成功发射之后，公司有路径竞争更大的任务池。Via Satellite 关于 SpaceX 2026 年 1 月 Lane 1
              奖项的报道，把验证和经济性接了起来：这个通道里的实际任务订单在项目层面可以累计到数亿美元，这意味着哪怕赢下一两个任务，对 Stoke 当前体量也可能有财务意义。


              但这仍是一座桥，不是终点。当前估值不能按这些任务已经拿下、或商业客户已经按披露条款支付定金来承销。乐观情景需要多件事按顺序做对：成功入轨，证明复用能降低成本且不压垮载荷经济性，拿下政府任务，最后完成商业转化。悲观情景需要的假设少得多：首飞滑期，面对更强价格压力，在收入真实出现前再次融资。公司融资历史异常强劲，但情景区间仍然很宽，原因就在这种不对称。
