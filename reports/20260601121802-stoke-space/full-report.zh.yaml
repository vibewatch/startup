      - number: '6.3'
        title: 客户经济性由 SpaceX 价格伞和拥挤的专属发射菜单定义
        blocks:
          - type: paragraph
            body: >-
              理解 Nova 的买方主张，必须放到客户已经能购买的菜单中。低质量端，SpaceX 广告价格为 50 公斤送至 SSO 收费 $350,000，额外质量 $7,000/公斤，并提供常规 SSO
              机会。任何新进入者都很难忽视这个价格，因为它给许多小卫星部署提供了透明的后备选项。在 Nova 级别之下，Rocket Lab 的 Electron 和 Firefly 的 Alpha
              已经为小载荷营销专属接入。在 Stoke 目标细分的更高端，Rocket Lab 的 Neutron 和 Firefly 的 MLV 也在销售可复用或规模导向的中型运力叙事。


              这就是 Stoke 自己围绕全复用的公开语言为何重要。其领导层曾公开表示，公司必须在价格上与 SpaceX 竞争，而全复用是通向最低长期成本底线的路径。这个战略逻辑自洽，但证明负担在执行上。在 Nova
              飞行之前，商业买方承销的是未来的价格和服务承诺，而不是当前可交付产品。实际含义是，Stoke
              的首批客户可能更偏向那些足够看重战略分散、日程接入或特定任务响应能力，因而愿意容忍新进入者风险的任务，而不是纯最低成本商品化发射买方。
