        title: 创始人、管理梯队和治理可见度
        blocks:
          - type: paragraph
            body: >-
              创始人和董事会的公开可见度好于股权结构，但仍不完整。Andy Lapsa 一直可被确认是 CEO 和联合创始人；保留的独立报道则同时确认 Lapsa 和 Tom Feldman 都是前 Blue Origin
              老将，并持续把 Feldman 定位为另一位创始人和技术负责人。2024 年 4 月，Stoke 还补强了运营班底，任命 Paul Croci 为首席财务官，并让退役美国 Space Force 中将 John
              E. Shaw 加入董事会。当前公开团队页进一步列出 Christian Garcia、Hans Koenigsmann 和 Matt White 与 Shaw 同为董事，让投资者可以看到防务、风投、SpaceX
              和工业金融力量的影响。不过，治理透明度仍只是部分可见。后续 Form D 关联人士名单包含一些未出现在简化版公开董事会页面上的姓名，说明真实治理面比网站披露更宽。实际结论是，Stoke
              高管团队和外部董事会信誉有相当证据支撑，但确切控制权、投资者持股、委员会结构和当前完整董事会地图仍需要尽调室材料验证。
