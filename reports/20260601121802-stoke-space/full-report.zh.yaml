      - number: '2.3'
        title: 按任务类型划分的买方、用户和付款方
        blocks:
          - type: paragraph
            body: >-
              发射服务不是由一个单一客户购买。在 LEO 宽带场景，买方通常是星座运营商或项目办公室，用网络建设或补网预算付款，看重任务清单确定性胜过标称最大载荷。Amazon Leo 和 Telesat Lightspeed
              展示了这类买方如何跨多次任务签约，因为部署速度决定容量何时上线、收入何时开始。国家安全场景中，买方是 Space Systems Command
              等采购机构，用户是防务或情报任务，付款方是联邦预算；认证、可靠性和发射场整合比最低广告价格更重要。GEO
              运营商形成另一类虽少但仍重要的细分市场：更少、更高价值的航天器服务电信、政府和韧性用例。最后，中小卫星运营商会分成两类：成本优先的拼单用户，以及愿意为轨道控制、日程控制或响应式接入付费的时效敏感专属发射买方。
