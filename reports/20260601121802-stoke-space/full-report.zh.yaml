  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 商业合同经济性
        - 具名交易对手、发射次数、定价、订金、取消权
        - 使公司任务清单从叙事变成可用于投资测算的在手订单
        - 按任务和合同阶段索取客户排期
      - - 收入桥
        - 任何已披露或董事会层面的首笔收入时间和毛利率形态判断
        - 这是从期权价值转向现金流测算的必要前提
        - 要求管理层提供从首飞到首个付费任务的桥接计划
      - - 股权结构表 / 优先权
        - 完整优先股堆叠、转换机制、老股转让限制
        - 决定名义估值实际隐含的普通股等值价值
        - 索取最新股权结构表和融资文件
      - - NSSL 任务概率
        - 实际 RFP 时间，以及首飞后的内部中标概率
        - 用来量化政府锚点的 NPV，而不是只做笼统假设
        - 索取采购路线图和假设
      - - 复用经济性
        - 首次回收后的检查范围、翻修成本和预期飞行频率
        - 决定这项技术能否带来足以支撑估值的利润率扩张
        - 索取运营模型和飞行后周转计划
      - - 治理 / 融资风险
        - 公司在实现有意义收入前再次融资的触发条件
        - 对悲观情景和稀释模型很关键
        - 索取现金跑道、烧钱速度和应急融资触发条件
    notes: 这些尽调问题决定估值标记到底只是叙事驱动，还是能进入可投资测算。
    claimRefs:
      - CV032
      - CV033
      - CV035
      - CV036
      - CV045
      - CV048
