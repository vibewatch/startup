              最强的财务结论不是 Stoke 缺少需求，而是公司仍难以干净承销：经常性发射服务仍处于收入前阶段，资本强度高，披露很薄。Yahoo Finance、Forge 和 Nasdaq Private Market
              的二级市场参考点集中在每股约 $52、隐含估值约 $3.42 billion，但这些资料同样滞后于公司自己披露的 $1.34 billion
