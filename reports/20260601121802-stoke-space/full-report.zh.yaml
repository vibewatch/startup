  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序图
        blocks:
          - type: paragraph
            body: >-
              风险栈最上层是技术首次飞行执行、日程压缩，以及上行案例中最有吸引力的部分仍在闸门之后而不是闸门之内。Stoke
              已经筹到足够继续建设的资金，也拿到带信号意义的政府奖励，但这些是缓释因素，不能替代轨道证明。决定性问题在于，公司的核心差异化不只是让 Nova 离开发射台一次；它要证明这套架构能够从一次性 Phase 1
              发射服务，毕业为具备任务保障信誉、并最终能被客户看见发射节奏的可复用系统。这意味着排名最高的风险彼此紧密相连：整箭性能滑点，日程就滑；日程滑，Lane 1
              任务订单资格和商业证明就滑；这些再滑，下一轮融资或估值对话就会在公司把披露很少的需求主张转化成运营证据之前到来。因此，正确的投资姿态应以里程碑为基础，设置明确触发条件，而不是对技术雄心保持开放式信仰。
