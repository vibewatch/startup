      - number: '1.4'
        title: 里程碑、政府验证和执行风险
        blocks:
          - type: paragraph
            body: >-
              里程碑记录显示，Stoke 在技术进展、政府验证和发射场建设上推进很快，但首次飞行执行风险依然显眼。技术侧，Stoke 的公开记录包括 2023 年 9 月 Hopper2 上面级飞行测试、2024 年 6
              月首次全流量分级燃烧发动机点火试车，以及公司称把 Zenith 和 Andromeda 推近飞行构型的后续推进里程碑。验证侧，DIU 在 2024 年以 $4.5 million 响应式太空投送奖励支持
              Stoke；Space Force 又在 2025 年 3 月把公司纳入 NSSL Phase 3 Lane 1，给出 $5 million
              任务订单，并在飞行器成功飞行后赋予未来竞标资格。基础设施同步推进：SLC-14 的环境文件在 2024 年 10 月获批，Stoke 一直在为 Nova
              重建这个历史场址。主要提醒是，公开的终局叙事仍跑在已实现运营之前。TechCrunch 对草案 EA 的解读显示，Phase 1 任务仍按一次性使用建模，可重复使用发射运营还需要补充分析；保留的 2026 年 6
              月记录也仍把首次轨道发射描述为即将到来，而非已经完成。
