  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 重要性
      - 什么会改变判断
    rows:
      - - 在这一载荷级别，唯一可见地追求上面级完全复用运营的公司
        - 如果跑通，可能形成结构性成本和服务优势
        - 需要轨道证明和翻修证据，而不只是架构
      - - 通过 NSSL Lane 1 获得政府锚点
        - 形成真实采购路径，能降低早期收入风险
        - 需要首次成功发射，随后拿到实际任务订单
      - - 行业资本背景仍有支撑
        - 后期航天资产仍能获得资本和战略兴趣
        - 如果 Stoke 飞起来前市场胃口降温，现金跑道质量也会打折
      - - 私募市场估值已经假设公司取得了相当进展
        - 当前价格下，新买家的安全边际受限
        - 更低入场价或更高证据水平会降低这一担忧
      - - 潜在供给过剩与 SpaceX 价格伞
        - 即便 Nova 投入服务，也可能压缩客户经济性
        - Stoke 必须拿出成本底线和差异化任务适配，而不只是复用叙事
    notes: 反向逻辑不是 Stoke 没有故事，而是当前价格太大一部分压在未来执行上。
