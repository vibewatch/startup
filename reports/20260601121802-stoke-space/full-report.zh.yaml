  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - Nova 按计划入轨，展示可信复用路径，赢得早期政府任务，并转化具名商业积压订单
        - 平台期权价值转为运营价值后，支撑 ~US$4.5B-6.5B 区间
        - 复用比预期更难；客户仍在等待
        - 需要多个里程碑依次兑现
      - - 基准
        - 公司资金仍充足并成功入轨，但商业披露仍有限，任务授予逐步爬坡
        - 支撑 ~US$2.5B-4.0B 区间；当前老股交易标记接近公允价值上半区
        - 证据薄弱继续压制确信度
        - 最符合当前公开记录
      - - 悲观
        - 首次飞行延期，竞争加剧，收入可见前还需要再融资
        - 在稀释和转化延迟风险下，支撑 ~US$1.0B-2.0B 区间
        - 融资与价格压缩
        - 只要少数事项出错，就会落到这一情景
      - - NSSL 锚点叠加
        - 一两个按在位玩家披露订单量级定价的 Lane 1 任务会有帮助，但不足以完全支撑今天的估值标记
        - 增加上行支撑，但不能完全覆盖估值
        - 进入项目不等于已确认收入
        - 有用，但次于轨道证明
    notes: 情景区间是投资测算范围，不是隐含市场出清价格。设计目的是在极端里程碑不确定性下维持决策纪律。
