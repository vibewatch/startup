      - number: '2.2'
        title: TAM、SAM 和相互冲突的市场规模口径
        blocks:
          - type: paragraph
            body: >-
              公开市场估算方向上有用，但分歧太大，不能压成一个数字。Grand View 保留的市场报告和新闻稿支持一个宽口径发射服务 TAM：到 2030 年达到 $41.31 billion；The Business
              Research Company 的 2026 年报告则给出低得多的 2030 年 $24.42 billion。SIA 的 2026 年行业发布补充了 2025 年已实现商业发射收入基线：$12.4
              billion；BryceTech 报告 2025 年有 325 次轨道发射，其中 87% 为商业发射。相比泛化的自上而下 TAM，这些是更好的近期可服务需求锚点。因此，Stoke Space
              的可服务口径位于更广的发射服务外壳之内，集中在反复星座部署与补网、持久政府任务清单、稳定 GEO 替换，以及愿意为日程控制付费的高价值任务。公开记录可以定性勾勒这个
              SAM，但没有目标轨道组合、赢单率、定价和预期年发射节奏等私有数据，就无法给出干净的 Stoke 专属 SOM。
