  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 政府锚定客户提供了今天唯一坚实的公开证明
        blocks:
          - type: paragraph
            body: >-
              Stoke 的客户章节异常不对称：买方身份的公开证明很强，但已授予任务量仍弱。最清楚的证据在政府侧。2025 年 3 月，美国 Space Force 把 Stoke 纳入 NSSL Phase 3 Lane
              1；SSC 和 DVIDS 也确认同一组核心事实：Stoke 进入 IDIQ 池，获得 $5 million
              初始任务保障任务订单，并且仍必须完成一次成功发射，才能竞标实际发射服务任务订单。这个区别很重要。该奖励不是已入账发射收入，但远比泛泛的谅解备忘录具体，因为它把 Stoke 放进了政府正式发射采购机器。


              DIU 合同是另一项硬证据。金额较小，为 $4.5 million，但它显示一个真实防务买方愿意围绕特定任务需求给 Stoke 提供资金：到达、穿越并返回太空的响应式货物投送。这个客户问题毗邻 Stoke
              的可复用上面级逻辑，也把买方地图拓宽到传统有效载荷部署之外。合在一起，Space Force 和 DIU 记录显示，公司已经从纯技术初创跨进实际采购考虑范围。它们尚未显示的是，Stoke
              已把资格转化成发射订单、为付费轨道客户完成飞行，或证明服务可重复。
