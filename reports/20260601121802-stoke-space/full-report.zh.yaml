  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界，以及什么才算发射需求
        blocks:
          - type: paragraph
            body: >-
              在接受任何 TAM 数字之前，第一项任务是先定义「市场」是什么。保留的发射服务资料口径一致：发射服务包括把有效载荷送入 LEO、MEO、GEO 以及超越 GEO
              轨道所需的发射前和发射后服务，面向商业、军事和政府用户。这包括任务整合、有效载荷处理、发射场和发射执行、遥测，以及作为发射服务出售的配套支持。不包括上游卫星制造、地面设备或下游卫星服务收入，尽管这些相邻市场常常一起增长。对
              Stoke Space
              来说，实际边界还要更窄：市场只包括需要反复入轨的卫星客户带来的轨道发射需求，而不是整个太空技术栈。商业通信载荷主导当前量级基础，但政府和国家安全需求仍塑造整个品类的基础设施、认证要求和定价纪律。这个区别重要，因为发射量增长可能跑赢可寻址收入增长。这个区别重要，因为发射量增长可能跑赢可寻址收入增长。
