      - CU010
      - CU023
      - CU030
      - CU032
  - id: FU003
    title: 客户证据矩阵
    type: matrix
    layout: wide
    summary: 政府项目在具名买家质量上得分最高；商业证据强在市场逻辑，弱在披露深度。
    data:
      columns:
        - 具名交易对手质量
        - 当前金额证据
        - 近期转化可见度
        - 复用可见度
        - 核心判断
      rows:
        - label: SSC / NSSL Lane 1
          values:
            - 高
            - 中
            - 中
            - None
            - 最佳锚点；路径真实，但还不是任务订单
        - label: DIU / NRSD
          values:
            - 高
            - 低
            - 中低
            - None
            - 真实买家且任务匹配，但仅是原型规模
        - label: 商业发射清单（未披露）
          values:
            - None
            - Unknown
            - 低
            - None
            - 展示的是公司声称的需求，不是经过独立核验的客户
        - label: 更广泛星座市场
          values:
            - 市场层面高
            - 既有供应商高
            - 中
            - 仅既有供应商中
            - 需求存在，但 Stoke 份额尚不可见
        - label: 价格敏感拼车发射买家
          values:
            - 替代供应商高
            - 既有供应商高
            - 既有供应商可立即转化
            - 既有供应商高
            - SpaceX 已用透明定价服务这类买家
    approximationNotes: 评级描述的是公开来源中的证据质量，不是客户本身的吸引力。
    claimRefs:
      - CU010
      - CU014
      - CU023
      - CU030
      - CU032
      - CU034
      - CU038
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 最高剩余严重性集中在首飞执行、进度确定性，以及只有轨道验证后才能把政府需求变现。
    data:
      columns:
        - 中等可能性
        - 高可能性
        - 极高可能性
        - 关卡已触发
      rows:
        - label: 关键影响
          values:
            - null
            - label: 任务保障
              tone: high
              detail: Lane 1 收入要等首次成功发射并获得验收。
            - label: 技术首飞
              tone: critical
              detail: 助推器、上面级、发射台和运营还没有一起飞过。
            - label: 进度 / 首次发射
              tone: critical
              detail: 2025 年预期已推至 2026 年初启用，但还没有带日期的发射活动。
        - label: 高影响
          values:
            - label: 竞争
              tone: medium
              detail: 已运营和目标 2026 年上线的替代方案挤占相近买家预算。
            - label: 资本强度
              tone: high
              detail: 大额融资有帮助，但收入证据出现前仍会持续烧钱。
            - label: 客户披露
              tone: high
              detail: 发射清单停留在文字层面，缺少具名交易对手和经济性。
            - label: 监管 / 复用
              tone: high
              detail: 第二阶段复用仍卡在补充环境工作之后。
        - label: 中等影响
          values:
            - label: 人员带宽
              tone: medium
              detail: 多地点扩张依赖快速、相对精简的运营模式。
            - label: 供应链
              tone: high
              detail: 华盛顿制造加佛罗里达启用，拉长交接链条。
            - null
            - null
        - label: 已在手缓释因素
          values:
            - label: 资本 + 治理
              tone: positive
              detail: Series D 资本、DIU/NSSL 中标和董事会新增成员提升了韧性。
            - null
            - null
            - null
    approximationNotes: null
    claimRefs:
      - CR046
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 同一次发射延期可能连锁拖慢政府变现、削弱商业证据，并重新抬高融资压力。
    data:
      nodes:
        - id: technical
          label: 技术验证
          detail: 入轨成功和回收的集成证据
        - id: schedule
          label: 发射进度
          detail: 带日期的发射活动和发射节奏信心
        - id: regulatory
          label: 复用审批
          detail: 补充审查和许可顺序
        - id: nssl
          label: NSSL 变现
          detail: Lane 1 任务订单资格和任务保障
        - id: commercial
          label: 商业证据
          detail: 具名客户、日期和发射经济性
        - id: valuation
          label: 现金 / 估值
          detail: 追加资本需求和可支撑估值
      edges:
        - from: technical
          to: schedule
          label: 首飞结果决定节奏
        - from: technical
          to: nssl
          label: 首次成功解锁资格
        - from: schedule
          to: commercial
          label: 客户等待确定性
        - from: regulatory
          to: commercial
          label: 复用经济性继续后置
        - from: nssl
          to: valuation
          label: 政府收入时点很关键
        - from: commercial
          to: valuation
          label: 披露把叙事转成证据
        - from: schedule
          to: valuation
          label: 延期拉长证据前烧钱期
    approximationNotes: null
    claimRefs:
      - CR047
  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: Nova 就绪取决于华盛顿制造 / 测试节点、佛罗里达发射基础设施和外部主管机构之间的同步交接。
    data:
      nodes:
        - id: kent
          label: Kent 工厂
          detail: 运载器制造与最终总装准备
        - id: moses
          label: Moses Lake 测试
          detail: 推进和系统测试活动
        - id: cape
          label: Cape 发射运营
          detail: HIF、发射台、地面系统和发射活动
        - id: suppliers
          label: 长周期供应商
          detail: 推进、结构、航电和地面硬件
        - id: regulators
          label: FAA / Space Force
          detail: 许可、环境和任务保障关卡
        - id: customers
          label: 发射客户
          detail: 商业和政府需求转化
      edges:
        - from: suppliers
          to: kent
          label: 制造输入
        - from: kent
          to: moses
          label: 测试硬件和经验
        - from: kent
          to: cape
          label: 飞行级段跨美国运输
        - from: moses
          to: cape
          label: 合格硬件和数据
        - from: regulators
          to: cape
          label: 发射与场地关卡
        - from: cape
          to: customers
          label: 服务交付和证据
        - from: suppliers
          to: cape
          label: 发射台和地面系统硬件
    approximationNotes: null
    claimRefs:
      - CR050
  - id: FV001
    title: 投资建议逻辑
    type: flow
    layout: standard
    summary: 投资建议从真实老股交易价格和强资本支持出发，穿过巨大的证据缺口，落到观察结论。
    approximationNotes: 该流程概括证据层级；不是概率树。
    data:
      nodes:
        - id: a
          label: 存在老股交易价格
          detail: Forge、Public 和 Nasdaq 都显示，2026 年春 Stoke 交易价格在低 $50/share 区间附近。
        - id: b
          label: 融资支持强
          detail: Series C 加上 Series D/D-2，把累计融资推到约 $1.34B。
        - id: c
          label: 技术和客户证据缺口仍在
          detail: 没有公开轨道任务、发射收入，也没有已披露的商业积压订单经济性。
        - id: d
          label: 政府锚点有帮助
          detail: NSSL Lane 1 在成功发射后，为未来任务收入打开路径。
        - id: e
          label: 可比公司证明相关性，不证明便宜
          detail: Rocket Lab、Sierra、Firefly 和 Relativity 显示 Stoke 估值处在合适邻域，但谈不上明显折价。
        - id: f
          label: 结论：观察 / 偏高
          detail: 当前定价已经在清晰证据出现前资本化了大量未来执行。
      edges:
        - from: a
          to: f
          label: 设定入场价格
        - from: b
          to: f
          label: 改善现金跑道
        - from: c
          to: f
          label: 限制确信度
        - from: d
          to: f
          label: 支撑可选性
        - from: e
          to: f
          label: 压缩安全边际
    claimRefs:
      - CV002
      - CV005
      - CV008
      - CV027
      - CV039
      - CV041
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 敏感性条形图把当前价格与下行、基准和上行里程碑并列比较。
    approximationNotes: 数值是本章投研测算节点，单位为十亿美元；除当前老股交易条外，不是观测到的市场交易。
    data:
      items:
        - label: 悲观情景中点
          value: 1.5
        - label: 基准情景中点
          value: 3.25
        - label: 当前 Forge 价格
          value: 3.42
        - label: 乐观情景中点
          value: 5.5
        - label: Sierra Space 2026 价格
          value: 8
    claimRefs:
      - CV005
      - CV017
      - CV042
      - CV043
      - CV044
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: Stoke 在当前证据阶段的悲观、基准和乐观测算区间。
    approximationNotes: 区间是证据调整后的投研测算区间。定价对里程碑敏感，因此刻意设得较宽。
    data:
      items:
        - label: 悲观 — 延期 / 稀释
          low: 1
          high: 2
          unit: $B
        - label: 基准 — 资金到位但尚未服务
          low: 2.5
          high: 4
          unit: $B
        - label: 乐观 — 入轨 + 客户转化
          low: 4.5
          high: 6.5
          unit: $B
    claimRefs:
      - CV042
      - CV043
      - CV044
      - CV045
      - CV046
      - CV047
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: IC 风格评分卡，采用 1-5 分。技术和资本支持得分高于证据质量和估值安全边际。
    approximationNotes: 评分是基于来源记录的编辑判断，不是机械模型输出。
    data:
      items:
        - label: 技术差异化
          value: 4
          note: 上面级完全复用仍然真正差异化
        - label: 客户证据
          value: 3
          note: 政府锚点存在，但已授予任务和商业客户名称仍缺失
        - label: 收入证据
          value: 1
          note: 没有公开发射收入或已披露积压订单经济性
        - label: 资本支持
          value: 5
          note: $1.34B 累计融资给这家私人发射公司带来少见现金跑道
        - label: 可比公司支撑
          value: 3
          note: 可比公司支撑相关性，但看不出明确便宜
        - label: 证据质量
          value: 2
          note: 老股定价有信息量，但样本薄，且高度依赖方法
        - label: 估值安全边际
          value: 2
          note: 当前价格落在基准情景内，但不是明确折价
    claimRefs:
      - CV002
      - CV005
      - CV016
      - CV027
      - CV032
      - CV039
      - CV040
      - CV041
