            body: >-
              Stoke 为一家私人运载火箭公司积累了异常庞大的资本基础，但资本结构也让时点变得关键。公司披露显示，累计总额从 2025 年 1 月 Series C 后的 $480 million，升至 2025 年 10
              月 Series D 后的 $990 million，再到 2026 年 2 月同一 Series D 延期融资后的 $1.34 billion。2025 年 10 月公告还披露了 Silicon Valley
              Bank 的 $100 million 债务工具；这很重要，因为它把杠杆带入一个尚未形成常规服务的业务。管理层明确把 2025 年融资描述为支持完成开发并通过首次飞行展示 Nova
              的现金跑道，这意味着资本计划基于里程碑，而不是绑定在已经证明的现金生成能力上。公开记录没有当前现金余额、没有月烧钱数字，也没有量化现金跑道月数。因此，实际承销问题不是 Stoke
              过去是否筹到足够资本，而是现有资产负债表能否撑过飞行器完工、首次飞行、认证，以及把尚未具名的商业任务清单转化为付费、重复发射，且不必在更差条款下再次融资。
