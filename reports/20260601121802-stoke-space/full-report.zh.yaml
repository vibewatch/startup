      - number: '5.2'
        title: 推进、上面级复用和测试证据
        blocks:
          - type: paragraph
            body: >-
              Stoke 架构中最难的部分是可复用上面级，而现有证据在这里最强。Andromeda 2 把推进和热防护结合起来：在金属底部热盾周围嵌入推力器，并用液氢再生冷却。Stoke 称，重设计把推力器数量从 30 个降到
              24 个，提高了发动机效率，也让发动机更易维护，同时保住核心赌注：上面级可以在没有烧蚀或瓦片式翻修周期的情况下挺过再入。Hopper2
              重要，因为它不只是一次跳跃测试；它公开整合了氢氧发动机、热盾、差分节流控制、航电、软件和地面系统。这个证明阶梯早在飞行前就已公开：2022 年 12 月，Stoke 称下一个重大里程碑是针对这些子系统的
              Hopper VTVL 测试；2024 年 3 月 NASASpaceFlight 访谈则明确，公司正围绕 24 小时周转目标设计 Nova，并且没有为飞行间检查或翻修留时间预算。Zenith
              是互补的一级赌注：一台全流量分级燃烧发动机，其点火试车序列已经从 2024 年中首次点火，推进到后续垂直点火，再到据报道在类飞行硬件上完成任务工况循环测试。去风险叙事是连贯的，但缺失证明同样清楚。地面加热、亚尺度
              VTVL 和发动机点火试车，不等于完成一次轨道任务、让两级再入，并展示真实的复飞周转。
