        title: 收入模式、定价和已披露牵引力
        blocks:
          - type: paragraph
            body: >-
              Stoke 的公开收入故事目前仍主要是管线故事，而不是经营收入故事。公司的产品是
              Nova：一个可复用中型运力发射系统，定位于按需轨道插入、货物返回和其他太空机动任务。公开披露的商业化代理指标来自政府工作和管理层表述，而不是已完成的商业发射。Stoke 披露了 $4.5 million DIU
              原型奖励和 $5 million NSSL Lane 1
              任务订单；管理层也反复提到一份规模可观的已签约商业发射任务清单。缺失的是承销最关键的信息：商业客户是谁、支付什么价格、是否已缴纳定金，以及多少收入在发射前确认、多少在任务完成后确认。Boltline
              增加了可选性，但公开资料只显示它是公司出资推进的产品，而不是拥有具名客户的独立收入线。合在一起，证据支持真实需求信号，但截至标准运行日期，还不能证明已实现发射服务收入。
