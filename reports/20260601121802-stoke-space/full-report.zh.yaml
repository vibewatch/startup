        title: 融资历史、估值可见度和利益方图谱
        blocks:
          - type: paragraph
            body: >-
              Stoke 的融资记录是公开公司概况中最强的定量部分。2025 年 1 月 Series C 披露金额为 $260 million，并把公司声称的累计融资推至 $480 million；随附 Form D
              显示，该轮在申报时尚未完全售出，这有用，因为它把公告措辞和证券申报机制区分开来。2025 年 10 月 Series D 规模更大：Stoke 披露由 Thomas Tull 的 USIT 领投 $510
              million 股权融资，另有 Silicon Valley Bank 牵头的 $100 million 债务工具，把公司声称的总资本推至 $990 million。2026 年 2 月延期融资又加入 $350
              million，使 Series D 合计达到 $860 million，累计融资达到 $1.34 billion。仍缺失的是估值桥。Stoke 没有披露 2025–2026
              年融资后的投后估值或定价条款；Forge 2026 年 6 月的二级市场页面只给出低置信度指示性估值和滞后的融资总额。因此，资本历史支撑充分，但确切所有权、稀释、杠杆条款和当前估值最多只能算部分公开。
