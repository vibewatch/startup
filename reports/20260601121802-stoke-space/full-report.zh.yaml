  - id: TV005
    title: 投资逻辑破坏与终止触发项表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 轨道首次飞行延期
        - '>12 个月超出当前投资人预期窗口'
        - 烧钱继续，商业化和政府任务订单时间点右移
        - 将投资测算推向悲观区间，并要求更新融资情况
      - - 首次飞行后没有客户转化
        - 入轨后 12 个月内没有披露任务授予或具名商业交易对手
        - 说明技术成功没有转化为收入支撑
        - 即便技术有进展，也维持或下调建议
      - - 降价轮 / 救助融资
        - 融资额低于，甚至远低于当前老股交易估值
        - 会削弱当前私募市场信号，并抬高稀释风险
        - 在股权结构条款清楚前，将估值标记下调至基准区间以下
      - - 竞争压价
        - 新数据显示发射稀缺性在缓解，但 Stoke 成本没有同步下降
        - 削弱当前期权溢价的经济依据
        - 下调公允价值区间，并要求更清楚的单位经济性证明
      - - 政府资质受挫
        - Lane 1 路径停滞，或任务保障流程没能转化为投标资格
        - 拿掉最可信的早期收入锚点
        - 重估估值中的全部政府溢价部分
    notes: 这些是可跟踪、与投资相关的触发器，而非泛化的运营风险。
