      - - 为何不买入
        - —
        - —
        - —
        - 证据仍处于收入前、入轨前，定价来自流动性很薄的老股市场
      - - 什么会改善判断
        - —
        - —
        - —
        - 成功轨道飞行，加上披露的任务斩获或具名商业交易对手
      - - 什么会恶化判断
        - —
        - —
        - —
        - 重大进度滑坡、融资压力，或首次飞行后客户转化证据薄弱
    notes: 本表概括本章结论，而不是重复每一个估值数据点。核心问题是按证据调整后的价格敏感性。
