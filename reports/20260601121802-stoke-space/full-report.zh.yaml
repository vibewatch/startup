      - number: '8.2'
        title: 可比基准支撑相关性，但看不出明显便宜
        blocks:
          - type: paragraph
            body: >-
              最好的公开基准是 Rocket Lab，因为它已经证明能入轨，业务覆盖发射和空间系统，有经审计的公开文件和真实收入。留存的公开数据无法给出 Rocket Lab
              价值的唯一标准数字，但给出了一条有用区间：Macrotrends 显示其 2024 年 12 月市值为 $13.64 billion，Yahoo 的历史估值表显示 2025 年 3 月 31 日为 $8.23
              billion。Yahoo 行情页还显示 FY26 Q1 收入约 $200 million。重要的是方向：一家能正常运营、有飞行履历和收入的公开发射公司，交易价值显著高于 Stoke；这说明如果 Stoke
              执行到位，上行空间存在——但前提是先拿出大量证据。


              私人市场基准补上了剩余地图。Sierra Space 2026 年 3 月按 $8 billion 融资，明显高于 Stoke 的老股交易估值，也反映出一个更成熟的国家安全和硬件平台。Firefly 2023 年
              $1.5 billion 的估值低于 Stoke，说明投资者给 Nova 完全复用逻辑和募资能力赋予了多少额外期权价值。Relativity 上一次被广泛引用的干净估值为 $4.2 billion，离 Stoke
              当前估值近到让人不舒服：它证明高概念发射公司可以在耐久经济性公开前达到数十亿美元价格，也提醒估值可能跑在证据前面。
