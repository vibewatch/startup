      - number: '6.2'
        title: 商业需求在市场层面存在，但公开具名客户证明仍薄
        blocks:
          - type: paragraph
            body: >-
              Stoke 需要解决的问题不是市场是否需要发射能力，而是能否转化。公司新闻稿反复描述一份规模可观的已签约商业发射任务清单，并称 Nova
              正为卫星星座部署、太空机动和下行载荷开发。独立市场研究在方向上支持这个说法：McKinsey 预测到 2030 年在轨活跃卫星会大幅增加，并认为中型和重型运载火箭在部署大型星座时仍具经济性。Space
              Capital 的 2026 年市场笔记也认为，一旦存量运力被内部星座和上升的国家安全需求消化，额外发射服务商的需求就有现实基础。


              不过，公开证据边界很硬。Stoke
              没有命名这些商业发射客户，没有披露发射次数，没有公布定金安排，也没有识别排队中的具体星座和运营商。这让商业证明停在中间状态：强于纯愿景，因为公司愿意在融资材料中声称已签约任务清单；但远弱于有公开任务日期的具名订单。投资者因此应把商业需求视为在市场层面已验证、在公司层面只部分验证。今天唯一完全可承销的商业事实是，更多发射供给确有真实市场；仍未解决的问题是，这些需求中有多少由
              Stoke 具体掌控。
