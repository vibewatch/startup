      - number: '5.3'
        title: 制造版图、发射场整合和 2026 年路线图
        blocks:
          - type: paragraph
            body: >-
              Stoke 的运营模型依赖三个相互连接的节点：Kent 负责垂直整合制造，Moses Lake 负责快速测试，Florida 的 LC-14 负责最终整合和发射。公司自己的发射台导览披露度异乎寻常。Stoke
              没有搭建一个最低配置的共享发射台初创方案；它在建设多飞行器处理用水平整合设施、重型发射台座、121
              英尺脐带塔、水冷火焰偏导硬件，以及一个为简化可重复地面运营而布置的推进剂农场。如果目标产品是反复复用，而不是少数一次性飞行，这就说得通。融资时间线也紧贴产品执行：Series C 跟随 Zenith 进展，并支持
              Kent、Moses Lake 和 Florida 升级；Series D 转向产能、供应链、Boltline 和首次飞行准备；2026 年延期融资为尚未描述的未来路线图元素提供资金。截至运行日期，公开目标是在
              2026 年初激活 LC-14，之后开展 Nova 首次飞行。主要提醒是，同一公开记录也显示，首次 Cape 活动是分阶段过渡，而不是最终可复用终态。
