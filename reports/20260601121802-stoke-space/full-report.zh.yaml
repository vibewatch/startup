      - number: '6.4'
        title: 剩余客户问题是转化、集中度和耐久性
        blocks:
          - type: paragraph
            body: >-
              主要承销缺口不是抽象意义上是否有买方，而是 Stoke 能否把今天的公开客户信号转化成耐久收入。Lane 1
              提供了强大的锚，因为它证明美国政府想要更多发射能力，也愿意为新兴服务商创造采购路径。但同一公开记录也表明，Stoke 必须先完成一次成功发射，才能竞争这些任务。Via Satellite 2026 年 1 月对
              SpaceX 任务订单的报道说明了这一点为何重要：真实的 Lane 1 奖励规模大、针对具体任务，并集中在已经能飞的服务商手中。


              因此还有三个未解决问题。第一，集中度：可识别客户基础由美国政府项目主导，政府资质认证延误会波及整个商业化故事。第二，耐久性：由于公开记录中尚无 Stoke
              轨道服务履历，没有公开数据能显示重复购买、续约或留存。第三，转化：商业任务清单主张仍未归属到具体客户。合适的尽调姿态是承认 Stoke
              在政府采购和市场需求层面有真实客户牵引力，但在具名任务书和至少一次成功飞行出现前，仍不对收入耐久性给出完全信心。
