  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: Nova 架构和客户工作流
        blocks:
          - type: paragraph
            body: >-
              理解 Nova，最好把它看成运输产品，而不只是运载火箭。Stoke 销售的是常规入轨、动态太空机动，以及最终从轨道返回；火箭架构从一开始就围绕这个终局设计。公开产品材料把 Nova
              描述为完全可重复使用的中型运力飞行器：可复用构型目标约 3 公吨送入 LEO，非复用最大载荷模式可拉到约 7 公吨，另有较小的 GTO
              数字披露。差异点在于两级都要回来，这迫使它做出一些相较同行显得不寻常的架构选择：用钢贮箱而非复合材料主结构，用可复用上面级而非一次性氢上面级，并围绕热分离打造一体化级间接口。放到客户语境中，Stoke
              瞄准的是希望获得不止一次卫星插入的运营商。Stoke 明确宣传「到达、穿越并返回太空」，这让 Nova
              既是发射器，也是可复用太空物流系统的一部分。正因如此，防务货运和下行载荷叙事会与普通商业发射信息并列出现。Stoke 还把 Nova 的 LNG/LOX 助推级和 LH2/LOX
              上面级营销为比煤油或固体燃料占比高的替代方案更清洁的推进剂组合，进一步强化产品卖点是可重复太空机动，而不是一次性发射档期。
