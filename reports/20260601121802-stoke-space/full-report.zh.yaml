  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图：直接同行、存量巨头、替代方案和潜在进入者
        blocks:
          - type: paragraph
            body: >-
              Stoke 的竞争集不只是中型运力初创公司的清单。最接近的直接可比类别，是瞄准小到中型载荷商业和政府任务的可复用或部分可复用飞行器：Rocket Lab 的 Neutron、Firefly 的
              Eclipse、Relativity 的 Terran R。SpaceX 有两重意义：Falcon 9 是当前可复用发射、拼单打包和日程确定性的市场出清标杆；Starship
              则是保留资料中唯一在全系统复用上明确对标 Stoke、并进一步延伸到更大载荷级别的架构。存量巨头 ULA 和 Arianespace
              的竞争方式不同，更倚重任务保障、机构关系和主权接入叙事，而不是初创式颠覆。替代方案也重要。对较小载荷来说，Falcon 9 拼单和 Rocket Lab Electron 可以在没有专属 Nova
              任务的情况下完成发射工作，尤其当价格或日程占主导时。格局不太可能保持静止：ESA 的运载火箭挑战显示，各国政府正积极试图创造更多区域选项，这意味着 Stoke
              进入的是一个初创同行和主权支持挑战者都在持续累积的市场。
