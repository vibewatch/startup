      - number: '8.5'
        title: 展项
        blocks:
          - type: callout
            title: 融资堆栈为 Stoke 买到了真正的战略时间
            body: 极少有尚未入轨的发射公司能在不上市的情况下融到超过 $1 billion。这本身不能验证当前价格，但显著提高了 Stoke 在没有即时融资压力下走到下一组验证点的概率。
            calloutType: strength
            claimRefs:
              - CV001
              - CV002
              - CV003
          - type: callout
            title: 在 $3.42B，买家付的是未来证据，不是当前现金流
            body: 当前老股交易估值相对行业不算疯狂，但相对 Stoke 已披露的经济性很高。没有收入、订单积压细节或轨道验证，今天的价值主要是期权溢价。
            calloutType: risk
            claimRefs:
              - CV005
              - CV032
              - CV033
