  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前价格信号足够真实，必须重视，但太薄，不能当作清晰估值锚
        blocks:
          - type: paragraph
            body: >-
              当前最强的估值信号来自老股交易市场的价格集中区间，而不是任何新一轮定价融资。Forge 显示 2026-06-01 的估值为 $3.42 billion；Public 和 Nasdaq Private
              Market 也都把 Stoke 在 2026 年春季的股价放在 $50
              出头区间。这不等于一个广泛清算的市场。这些平台恰恰因为不完美才有用：它们说明价格发现存在，并且方向上趋同，但也暴露出标题估值之下几乎没有经过审计的上下文。


              融资时间线至少给了一个真实的底层叙事。Stoke 在 2025 年 1 月融到 $260 million，2025 年 10 月又融到 $510 million，2026 年 2 月再拿到 $350
              million 延期融资。公司官方稿和独立报道在大事实上相互吻合：第一次 Series D 后累计融资达到 $990 million，延期后达到 $1.34
              billion。这让公司在尚未入轨的发射公司里拥有异常充足的资产负债表。但融资不是收入，高现金余额应理解为现金跑道加期权价值，而不是当前老股交易估值便宜的证明。
