      - number: '2.4'
        title: 增长驱动、采用约束和购买决策真正看重什么
        blocks:
          - type: paragraph
            body: >-
              最强顺风是频次需求。BryceTech 和 SIA 都显示，当前发射系统已由商业、通信密集型活动主导；Amazon 和 Telesat 则说明星座经济如何制造反复多次发射需求。Grand View 和
              Mordor 也强化了一个判断：可重复使用飞行器、更低发射成本，以及基于卫星的应用需求，都是结构性增长驱动。但市场不是只靠价格赢。Rocket Lab
              围绕定制轨道、日程控制和响应式发射的定位说明，部分买方会为精度和时点支付溢价，而拼单发射仍是成本敏感载荷的默认选择。约束侧，GAO 和 CRS
              显示，国家安全需求依赖认证、有效载荷处理能力和发射场基础设施；Mordor 还补充了碎片、拥堵、出口管制和发射台可用性。Stoke Space
              要回答的不是发射需求是否存在——它显然存在——而是公司能否在发射节奏、可靠性、响应能力和认证能解锁份额的切片里赢得买方信任。
