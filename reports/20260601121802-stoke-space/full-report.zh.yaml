      - number: '3.4'
        title: 护城河耐久性和反向竞争证据
        blocks:
          - type: paragraph
            body: >-
              Stoke 的护城河逻辑在任务看重 Nova
              自称能独有完成的事情时最强：用可在轨重定位、留轨并带回有效载荷的上面级实现快速复用。如果这项功能在运营上被证明真实，它就不只是成本故事，而是把「发射」能包含的产品范围扩大了。不过，保留的反向证据也解释了为什么这条护城河还不足以只凭架构承销。SpaceNews
              2026 年报道清楚表明，同行仍首先想着和 SpaceX 竞争，而不是彼此竞争，因为 SpaceX 设定了主导价格和节奏框架。同一报道还显示，市场已经淘汰了许多资本不足的进入者，这对 Stoke
              有双重含义：幸存对手更少是好事，但也凸显发射经济性依然残酷。Neutron、Eclipse 和 Terran R
              都有日程风险，但各自也拥有真实资产——发射台进展、政府路径、战略投资者或数十亿美元协议——一旦执行转向，就能很快变成压力。实际结论是，Stoke 的护城河有前景但尚未被证明。公开证据仍缺少足够强的 Nova
              订单深度、已实现定价、发射节奏和客户留存数据，无法证明上面级复用会转化为耐久商业边，而不只是一个优雅的技术主张。
