      - number: '4.2'
        title: 成本结构、单位经济性和资本强度
        blocks:
          - type: paragraph
            body: >-
              在经常性发射收入能够放大之前很久，Stoke 的财务负担就已由固定资产和研发吞吐主导。官方页面描述了 168,000 平方英尺的垂直整合总部、Washington 测试场，以及 Florida
              的发射运营建设；第三方报道还补充了 75 英亩 Moses Lake 设施，以及一个为处理多台飞行器设计的发射场。仅 LC-14 建设就包括水平整合设施、发射台座、121
              英尺脐带塔、推进剂系统和其他永久基础设施。公开监管记录进一步显示，早期运营预计以分阶段、一次性使用构型启动，完整可复用运营要等补充环境审查之后。财务上，这一点很重要，因为 Stoke
              的全复用逻辑本应最终压低单次发射成本并支撑利润率扩张；如果早期飞行是一次性的，那么部分近期经济性就更像传统的重研发发射公司，而不是终局叙事。除硬件和场址资本开支外，发射许可还要求单独的保险或财务责任能力，随着飞行运营临近，这会增加另一重现金负担。
