companyProfile:
  summary: >-
    Stoke Space 在开发 Nova，这是一款完全可重复使用的中型运力轨道运载火箭，目标是同时回收助推级和上面级。公司由前 Blue Origin 工程师 Andy Lapsa 和 Tom Feldman 于 2019
    年创立，截至 Series D-2 延期融资已累计融资约 $1.34B，进入美国 Space Force 的 NSSL Phase 3 Lane 1 项目，并正准备让 Nova 从 Cape Canaveral 的 Launch
    Complex 14 执行首次轨道飞行，同时在 Washington 扩建生产和测试基础设施。
  foundedDate: '2019-01-01'
  founders:
