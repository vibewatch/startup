      - number: '8.4'
        title: 观察：技术差异化和资本实力都不弱，但当前估值缺少安全边际
        blocks:
          - type: paragraph
            body: >-
              本章结论不是说 Stoke 在真空里被炒过头。结论是，$3.42 billion 的估值在公司交付轨道发射服务、具名披露大多数商业客户、或披露收入和利润率结构之前，就已经计入了相当一部分上行空间。相信 Nova
              很快入轨、且上面级完全复用确实能创造其他发射商无法击穿的成本底线的投资者，仍可能赚到钱。问题在于，公开记录还不足以支持在这个价格给出买入判断。技术承诺和现金兑现之间缺的东西太多。


              因此，观察是正确建议。它承认技术逻辑稀缺、融资支持异常强、政府锚点真实存在；同时保留对估值安全边际的纪律。更便宜的老股交易切入点，或证据更充分的公司，都会改变判断。具体说，一次成功的轨道任务叠加披露客户转化，会让今天的估值更站得住。反过来，如果再次延误，或在出现有意义收入前再次融资，估值区间可能很快压缩。下一轮尽调应聚焦合约经济性、股权结构表悬垂，以及政府资格在什么确切条件下会变成已入账发射收入。
