        - 覆盖小卫星拼车、超大载荷和探索任务
        - Falcon 9 有发射节奏和公开拼车价格；Starship 主打全系统复用和 100+ t 入轨
        - Starship 的商业可靠性仍在形成；Falcon 9 未公开提供可复用上面级运营
      - - Rocket Lab (Electron + Neutron)
        - 横跨小型专属发射和中型运力的直接同业
        - Electron 已发射 88 次；2025 年 Electron/HASTE 发射 21 次；Neutron 有 Rocket Lab 发射履历背书
        - 需要专属发射的小卫星、星座、货运和政府任务
        - Electron 现在提供精确入轨和排期控制；Neutron 承诺 13 t 至 LEO、一级和整流罩可复用
        - 储箱测试失败后，Neutron 推迟至不早于 2026 年 Q4
      - - Firefly Aerospace (Alpha + Eclipse)
        - 快速响应发射同业，中型火箭有既有玩家背书
        - Northrop 投资 $50M；此前 Series D 对 Firefly 估值超过 $2B
        - 覆盖 1 t 级至中型运力的快速响应国家安全、民用和商业任务
        - Alpha 主打快速响应发射；Eclipse 借 Northrop 合作瞄准 16.3 t 至 LEO
        - Eclipse 仍未首飞，公开定价仍不透明
      - - Relativity Space (Terran R)
        - 大型可复用新进入者
        - 发射服务协议超过 $3B；私营公司正把资源集中到 Terran R
        - LEO 星座部署、GTO 任务、未来政府业务
        - 大型可复用火箭，具备 23.5 t 可复用 LEO 运力和大整流罩
        - NSSL 参与推迟，首飞目标仍不早于 2026 年
      - - ULA (Vulcan)
        - 既有任务保障替代方案
        - 服务国家安全、民用和商业市场的既有运营商
        - 需要精确入轨和定制配置、风险敏感的政府与商业载荷
        - 配置范围广、多任务清单选项、信任基础强
        - 没有简单公开标价；保留资料中复用差异化不多
      - - Arianespace (Ariane 6)
        - 既有主权准入替代方案
        - 服务商业和机构客户 40+ 年；EU 和 Amazon 支持 Ariane 6
        - 欧洲机构任务、电信、导航和大型星座部署
        - 主权准入叙事、定制化发射服务和大批量部署能力
        - 经济性被表述为有竞争力，但未在公开价目表中披露
      - - 潜在进入者 / 区域挑战者
        - 未来拥挤风险
        - ESA 预选 5 家挑战者，在 Launcher Challenge 下每家最高可获 €169M
        - 欧洲机构载荷和未来主权发射需求
        - 政府赞助的竞争可能快速催生新的区域替代方案
        - 保留的 2025 年报道中，5 家入选挑战者均尚未入轨
