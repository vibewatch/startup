    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、阶段和运营版图
        blocks:
          - type: paragraph
            body: >-
              即便若干关键商业指标仍不透明，Stoke Space 作为一家私人发射初创公司的身份也异常清楚。法律和公开记录指向一家 2019 年注册成立、但公开叙事常把启动时间放在 2020
              年前后的公司；这一点重要，因为后续资料经常把「2019 年创立」和「2020
              年启动」两个标记混用。公司自己的页面把产品定位为低成本、按需实现「到达、穿越并返回太空」的运输能力，而不是一次性运载火箭。这个定位建立在 Nova
              的全复用架构之上：中型运力两级火箭、为按需在轨机动和返回任务设计的可复用上面级系统，以及面向飞机式周转的硬件选择。运营版图同样关键。根据 2025–2026 年 SEC 文件，Stoke 的主要营业地点在
              Washington 州 Kent；官方页面还披露了 168,000 平方英尺总部、Moses Lake 测试场，以及 Cape Canaveral
              发射运营。更准确的阶段标签因此是后期、发射前开发商：公司披露资本规模很大，基础设施有实质进展，也获得政府验证，但尚未完成轨道发射，也没有公开运营 KPI 体系。
