          tone: neutral
        - label: 筛选轨道与排期
          value: 2
          detail: 买方判断拼车发射是否可接受，还是必须要专属控制。
          tone: neutral
        - label: 可靠性与认证门槛
          value: 3
          detail: 高价值政府任务和低风险容忍买方会大幅缩小供应商集合。
          tone: warning
        - label: 预留任务清单与集成
          value: 4
