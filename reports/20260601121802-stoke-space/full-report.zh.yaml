      - number: '3.3'
        title: 分销力量、监管姿态和切换成本
        blocks:
          - type: paragraph
            body: >-
              发射服务不只靠载荷图表销售。分销力量来自发射台、任务保障、发射历史、采购资格，以及适配客户排期模型的能力。这有利于存量运营商和资本最充足的挑战者。SpaceX 把拼单频次与客户已经理解的发射记录结合起来。ULA
              和 Arianespace 以不同方式打包信任：ULA 强调国家安全、民用和商业精度，Arianespace 则把 Ariane 6 绑定欧洲自主接入和长期机构关系。Rocket Lab 的优势更窄但真实，来自
              Electron 传承、Virginia 专属 Neutron 发射台，以及明确进入 Space Force NSSL Lane 1 的路径。Firefly 和 Relativity
              在信任积累上更落后，尽管也有真实势头——Firefly 有 Northrop 背书，Relativity 有有意义的发射服务协议。FAA
              许可栈和新的用户收费制度在这里很关键，因为发射服务商必须通过运营商许可、有效载荷审查、环境审查和财务责任门槛，才能大规模销售任务。因此，买方切换成本真实存在但并非绝对：一旦某型火箭围绕有效载荷适配器、任务保障和日程窗口被基线化，换供应商会很痛；但市场仍允许多归属，因为很少有公开资料显示排他性或软件式深度锁定。
            claimRefs:
