      - number: '7.4'
        title: 资金、客户披露与竞争压力
        blocks:
          - type: paragraph
            body: >-
              资本能缓释风险，但不能消掉执行风险，因为公司仍要把融资转成飞行证据，再把飞行证据转成收入证据。Stoke 披露的资本底座已经大到不能忽视，董事会和 CFO
              增补也提高了机构化纪律。即便如此，公开证据在募资层面远强于客户服务层面。管理层称已有一份可观的签约商业发射清单，但留存的公开材料没有说明交易对手或合约经济性，投资者因此无法检验客户集中度、定价、定金或取消保护。市场没有停下来，这让披露缺口更关键。Firefly
              已经在卖一款能飞的产品，Rocket Lab、Firefly MLV、Relativity 以及其他替代方案也都在宣传面向 2026 年的就绪度或响应式发射能力。与此同时，TechCrunch
              的国防叙事暗示，新资金最容易讲通的故事已经变成国家安全相关性，而不是清晰的商业需求。公司仍可能从当前位置胜出，但举证责任已经从概念差异化转向商业转化和项目执行。
