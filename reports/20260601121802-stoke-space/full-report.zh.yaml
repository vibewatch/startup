  - id: TI005
    title: 公开财务缺口表
    columns:
      - 缺失的私有指标
      - 对投资决策的影响
      - 精确尽调路径
    rows:
      - - 当前现金余额和无限制流动性
        - 没有现金可见性，就无法可靠判断现金跑道或下行缓冲
        - 调取当前现金、债务提款状态，以及 2026 年 2 月延展轮以来的月度现金流桥
      - - 月度烧钱速度和场址 / 项目支出拆分
        - 无法检验 Series D 资金是否真正覆盖首飞和认证
        - 调取过去 12 个月烧钱，按工程、制造、发射场、测试和 SG&A 桶拆分
      - - 商业发射清单客户名称、待交付订单价值和订金
        - 没有交易对手和取消条款细节，就无法承保需求质量
        - 调取已签合同排期，包含客户名称、任务日期、合同金额、订金金额和终止条款
      - - 单任务价格、付款里程碑和收入确认政策
        - 卡住任何可信的回本、利润率或营运资本模型
        - 调取标准合同经济性，以及发射前里程碑与发射后确认之间的会计政策
      - - 债务额度条款、契约和抵押品包
        - 已披露的 100M 债务额度可能实质改变下行情景
        - 调取信贷协议、提款计划、摊还、利差、认股权证和抵押品覆盖
      - - 早期飞行成本结构和复用后利润率桥
        - Stoke 的投资逻辑依赖未来复用经济性，而 Phase 1 飞行尚不能证明
        - 调取成本化飞行模型，覆盖一次性 Phase 1、可复用目标状态，以及按火箭级段拆分的翻修假设
      - - 支撑二级市场报价的股权结构表和优先股条款
        - 单个二级报价不足以换算公允价值
        - 调取最新股权结构表、各轮权利、清算优先权，以及任何影子估值分析
    notes: 这些缺失的私有输入最可能改变承保结论。
    enumerationScope:
      coverage: sample
      basis: Selected the highest-impact diligence blockers for a private launch company; not a full diligence request list.
    claimRefs:
      - CI035
      - CI036
      - CI041
      - CI044
      - CI045
      - CI047
