          - type: callout
            title: 观察，而不是买入
            body: 差异化产品逻辑和政府锚点值得继续跟踪，但按证据调整后的价格仍然太满，支撑不了干净的买入建议。更便宜的切入点或更强的运营证据会改变结论。
            calloutType: recommendation
            claimRefs:
