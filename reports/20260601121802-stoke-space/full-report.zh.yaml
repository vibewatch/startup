              监管风险不再是 Stoke 能否触碰 SLC-14；Phase 1 环境路径已经实质推进。剩余问题在于，已审查的公开路径比公司长期逻辑更窄。EA 和配套批准支持一个有边界的 Phase 1
              项目，而可复用阶段仍需要更多环境工作，并最终需要一套匹配现场运营的许可栈。SLC-14
              的历史地位也增加了保护敏感性：发射台改造不是发生在一块空白绿地上，而是在一个具全国意义、且仍有公共使用义务的发射综合体上。政府需求侧，NSSL 奖励只有在首次飞行成功和任务保障获认可之后才具有商业意义。SSC
              的框架建设性但有纪律：Stoke 已被邀请进入组合，并获得初始任务保障工作付款，但实际发射任务订单仍被闸门控制。因此，剩余暴露不是抽象的监管敌意，而是顺序依赖：每下一项许可或收入流，都要求前一个里程碑先闭环。
