companyProfile:
  summary: >-
    Stoke Space is developing Nova, a fully reusable medium-lift orbital launch vehicle that aims
    to recover both its booster and upper stage. Founded in 2019 by ex-Blue Origin engineers Andy
    Lapsa and Tom Feldman, the company has raised about $1.34B through its Series D-2 extension,
    won entry into the U.S. Space Force's NSSL Phase 3 Lane 1 program, and is preparing Nova for
    first orbital flights from Launch Complex 14 at Cape Canaveral while expanding production and
    test infrastructure in Washington.
  foundedDate: '2019-01-01'
  founders:
    - name: Andy Lapsa
      role: Co-founder and CEO
      background: Former Blue Origin engineer and propulsion leader.
      claimRefs: [CO018, CO061]
    - name: Tom Feldman
      role: Co-founder and CTO
      background: Former Blue Origin engineer and vehicle systems leader.
      claimRefs: [CO019, CO061]
  foundingLocation: Kent, WA
  headquarters: Kent, WA
  productSummary: >-
    Nova is a fully reusable two-stage orbital launch vehicle designed for medium-lift missions,
    with a reusable upper stage intended for on-demand access to orbit, in-space maneuvering, and
    eventual return-from-orbit use cases.
  customerFocus: U.S. government launch and responsive-space programs plus commercial satellite and constellation operators
  businessModel: Launch-as-a-service and future in-space mobility services
  stage: Series D (pre-launch)
