summary:
  headline: >-
    Stoke Space's reusable upper-stage thesis is a real differentiator and its financing base is
    unusually strong, but a ~$3.42B secondary valuation already prices in significant execution
    before orbital proof, named customer conversion, or revenue disclosure are public.
