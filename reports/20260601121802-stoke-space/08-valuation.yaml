company:
  name: Stoke Space
chapter:
  number: 8
  title: Valuation
  summary: 'Stoke’s spring-2026 secondary pricing is coherent enough to take seriously: Forge, Public, and Nasdaq Private Market all cluster around a low-$50/share signal, with Forge showing a $3.42B valuation on 2026-06-01. But the public record still lacks the operating evidence that would justify treating that mark as cheap—there is no disclosed launch revenue, no named commercial backlog economics, and no orbital customer-service proof. The right posture is Track / stretched: the technology and funding base justify continued attention, yet the current price already capitalizes a meaningful portion of the upside before the hardest proof points are public.'
sections:
- id: secondary-mark-and-funding-context
  title: The current price signal is real enough to matter but too thin to treat as a clean mark
  body: |-
    The strongest current valuation signal is the secondary-market cluster rather than any new priced primary round. Forge shows a $3.42 billion valuation on 2026-06-01, while Public and Nasdaq Private Market both place Stoke’s share price in the low-$50 range during spring 2026. That is not the same thing as a broad clearing market. These platforms are useful precisely because they are imperfect: they show that price discovery exists and is directionally convergent, but they also expose how little audited context sits underneath the headline mark.

    The financing chronology does at least provide a real underlying narrative. Stoke raised $260 million in January 2025, then $510 million in October 2025, then a $350 million extension in February 2026. Official company releases and independent coverage all line up on the large facts: total funding reached $990 million after the first Series D and $1.34 billion after the extension. That gives the company an unusually well-capitalized balance sheet for a pre-orbit launcher. But capital raised is not revenue, and a high cash balance should be read as runway plus option value, not proof that the current secondary mark is cheap.
