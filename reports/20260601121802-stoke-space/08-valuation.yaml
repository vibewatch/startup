- id: final-investment-view
  title: 'Track: differentiated technology, serious capital, but little margin of safety at today’s mark'
  body: |-
    The chapter’s conclusion is not that Stoke is overhyped in a vacuum. It is that a $3.42 billion mark already prices in a meaningful portion of the upside before the company has delivered orbital service, named most of its commercial customers, or disclosed revenue and margin structure. That can still work for investors who believe Nova reaches orbit soon and that full upper-stage reuse truly creates a cost floor other launchers cannot undercut. The problem is that the public record does not yet justify a Buy call at that price. There is too much missing between technical promise and cash realization.

    Track is therefore the right recommendation. It credits the rarity of the technical thesis, the unusually strong financing support, and the reality of the government anchor. It also preserves discipline around valuation margin of safety. A cheaper secondary entry, or a higher-evidence company, would change the call. Specifically, a successful orbital mission plus disclosed customer conversion would make today’s mark more defensible. Conversely, another delay or another financing before meaningful revenue would likely compress the valuation range quickly. The next diligence cycle should focus on contract economics, cap-table overhang, and the exact conditions under which government eligibility becomes booked launch revenue.
