- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - Nova reaches orbit on schedule, demonstrates credible reuse path, wins early government missions, and converts named commercial backlog
    - Supports ~US$4.5B-6.5B range as platform option value becomes operating value
    - Reuse proves harder than expected; customers still wait
    - Requires multiple milestones to hit in sequence
  - - Base
    - Company remains well funded, reaches orbit but commercial disclosure stays limited and mission awards ramp gradually
    - Supports ~US$2.5B-4.0B range; current secondary mark sits near the upper half of fair value
    - Thin evidence continues to cap conviction
    - Most consistent with current public record
  - - Bear
    - First flight slips, competition intensifies, and another financing is needed before revenue is tangible
    - Supports ~US$1.0B-2.0B range on dilution and delayed conversion risk
    - Fundraising and price compression
    - Only a few things need to go wrong to reach this case
  - - NSSL anchor overlay
    - One or two Lane 1 missions at disclosed incumbent order-of-magnitude would help but not fully justify today’s mark
    - Adds upside support, not full valuation coverage
    - Program access does not equal booked revenue
    - Useful but secondary to orbital proof
  notes: Scenario bands are underwriting ranges rather than implied market-clearing prices. They are designed for decision discipline under extreme milestone uncertainty.
