- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Why it matters
  - What would change the view
  rows:
  - - Only company visibly pursuing fully reusable upper-stage operations in this payload class
    - Could create a structural cost and service advantage if it works
    - Need orbital proof and refurbishment evidence rather than architecture alone
  - - Government anchor through NSSL Lane 1
    - Creates a real procurement path that can de-risk early revenue
    - Need first successful launch and then actual task-order wins
  - - Sector capital backdrop remains supportive
    - Late-stage space assets still have access to capital and strategic interest
    - If market appetite cools before Stoke flies, runway quality matters less
  - - Private-market mark already assumes substantial progress
    - Limits margin of safety for new buyers at current pricing
    - A lower entry price or higher evidence level would reduce this concern
  - - Potential oversupply and SpaceX price umbrella
    - Could compress customer economics even if Nova reaches service
    - Stoke must show cost floor and differentiated mission fit, not just reusability rhetoric
  notes: The anti-thesis is not that Stoke lacks a narrative; it is that too much of the current price rests on future execution.
