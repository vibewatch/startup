- id: scenario-underwriting-and-nssl-anchor
  title: The NSSL anchor matters, but not enough to erase pre-revenue risk
  body: |-
    The most defensible way to value Stoke today is as a milestone-and-option asset. The NSSL Lane 1 award is important because it is more than branding: it places Stoke inside a real government launch procurement channel. SSC’s documentation and Stoke’s own release both show a $5 million initial task order and a path to compete for a much larger mission pool after one successful launch. Via Satellite’s reporting on SpaceX’s January 2026 Lane 1 awards provides the bridge from validation to economics: actual task orders in this lane can add up to hundreds of millions of dollars at the program level, implying that even one or two wins could become financially meaningful for a company of Stoke’s current scale.

    But it is still a bridge, not a destination. The current valuation cannot be underwritten as if those missions are already won or as if commercial customers are already paying deposits on disclosed terms. The bull case requires multiple things to go right in sequence: orbital success, proof that reuse lowers cost without crushing payload economics, government mission capture, and finally commercial conversion. The bear case requires far fewer assumptions: slip first flight, face more competitive price pressure, and raise capital again before revenue is real. That asymmetry is why the scenario range remains wide even though the company’s financing history is unusually strong.
