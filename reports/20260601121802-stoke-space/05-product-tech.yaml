- id: propulsion-and-reuse-system
  title: Propulsion, upper-stage reuse, and test evidence
  body: 'The hardest part of Stoke''s architecture is the reusable upper stage, and the available evidence is strongest there. Andromeda 2 combines propulsion and thermal protection by embedding thrusters around a metallic base heat shield that is regeneratively cooled with liquid hydrogen. Stoke says the redesign cut the thruster count from 30 to 24, improved engine efficiency, and made the engine more serviceable while preserving the core bet that the upper stage can survive reentry without an ablative or tile-based refurbishment cycle. Hopper2 matters because it was not just a hop test; it publicly integrated the hydrogen-oxygen engine, heat shield, differential-throttle control, avionics, software, and ground systems. That proof ladder was public well before the flight: in December 2022 Stoke said the next major milestone was a Hopper VTVL test for exactly those subsystems, and a March 2024 NASASpaceFlight interview made explicit that the company is designing Nova around a 24-hour-turnaround goal with no time budget for between-flight inspections or refurbishment. Zenith is the complementary first-stage bet: a full-flow staged-combustion engine whose hotfire sequence has moved from first ignition in mid-2024 to later vertical firing and then to reported mission-duty-cycle testing on flight-like hardware. The de-risking story is coherent, but the missing proof is equally clear. Ground heating, subscale VTVL, and engine hotfires are not the same as completing an orbital mission, reentering both stages, and demonstrating a real reflown turnaround.'
