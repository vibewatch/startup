- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process
  - Role
  - Primary dependency
  - Product / technical risk
  rows:
  - - Steel tank primary structure
    - Supports repeated thermal and pressure cycling for reusable stages
    - Stoke materials and manufacturing execution
    - Mass and fabrication trade-offs versus composites must still close economically
  - - Zenith booster propulsion
    - Provides reusable first-stage lift and ascent performance
    - FFSC engine qualification and long-life operation
    - High-complexity engine development before first orbital flight
  - - Andromeda propulsion + heat shield
    - Combines upper-stage thrust, reentry protection, and landing capability
    - Hydrogen cooling channels, embedded thrusters, and serviceability design
    - Orbital reentry and refurbishment loop remain unproven
  - - Hot-stage interface
    - Reduces interstage mass and improves performance
    - Precise plume management and stage coupling
    - Integration margins are tighter than in conventional stage separation
  - - Kent-to-Moses-Lake development loop
    - Speeds design, test, and redesign cycles
    - Coordinated manufacturing and nearby private test infrastructure
    - Throughput or single-site outages could slow multiple subsystems at once
  - - LC-14 ground systems
    - Integrates vehicle, propellant, data, and launch processing
    - HIF, launch mount, tower, flame diverter, and propellant farms
    - Pad activation and reuse assumptions depend on all subsystems working together
  - - Program phasing
    - Uses early launches as bridge to reusable end state
    - Supplemental environmental work and future FAA approvals
    - Commercial story weakens if reusable phase slips materially
  notes: 'This table focuses on system coupling, which is the central Stoke question: the company is not only building a rocket, but a reusable operating system whose weakest linked subsystem can delay the whole program.'
