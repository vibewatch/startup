- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Stoke solution
  - Measurable benefit
  - Limitation
  rows:
  - - Dedicated satellite deployment
    - Buy an expendable launch and discard both stages after insertion
    - Launch on Nova with reusable architecture aimed at lower-cost recurring access
    - Potentially lower recurring launch cost if reuse is achieved
    - No public reused-flight evidence yet
  - - Responsive national-security launch
    - Rely on existing certified providers with limited emerging capacity
    - Nova is positioned for NSSL competition after vehicle demonstration
    - Adds medium-lift capacity option if certified
    - Certification is future, not current
  - - Dynamic space operations / downmass
    - Most small launchers stop at payload deployment
    - Reusable upper stage is pitched for repositioning, long dwell, and return from orbit
    - Expands product beyond one-way launch
    - Commercial demand and certification timeline are unproven
  - - Point-to-point defense cargo
    - Use airlift or experimental cargo concepts
    - DIU-backed concept aligns Nova upper-stage architecture with cargo return and unconventional orbit access
    - Potential new mission class with defense sponsorship
    - Program interest does not equal deployable service
  - - High-cadence recurrent operations
    - Shared pads or bespoke campaign setup for each launch
    - Permanent pad, HIF, and repeatable ground systems designed for recurrent processing
    - Lower pad reset burden if systems work as designed
    - Regulatory and refurbishment loops are not yet demonstrated
  notes: Use cases mix current launch-service positioning with future capabilities Stoke is explicitly marketing; only the first category is close to near-term revenue in public evidence.
