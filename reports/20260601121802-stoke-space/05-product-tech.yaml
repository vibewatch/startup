- id: footprint-integration-and-roadmap
  title: Manufacturing footprint, launch-site integration, and 2026 roadmap
  body: 'Stoke''s operating model depends on three linked nodes: Kent for vertically integrated manufacturing, Moses Lake for rapid testing, and LC-14 in Florida for final integration and launch. The company''s own pad walkthrough is unusually revealing. Stoke is not building a minimal shared-pad startup configuration; it is building a horizontal integration facility for multi-vehicle processing, a heavy launch mount, a 121-foot umbilical tower, water-cooled flame-diverter hardware, and a propellant farm arranged to simplify repeatable ground operations. That makes sense if the intended product is recurring reuse rather than a handful of expendable flights. The funding chronology also maps closely to product execution: Series C followed Zenith progress and supported Kent, Moses Lake, and Florida upgrades; Series D shifted to production capacity, supply chain, Boltline, and first-flight readiness; the 2026 extension funds future roadmap elements not yet described. As of the run date, the public target is activation of LC-14 in early 2026 with Nova first flights thereafter. The main caveat is that the same public record also shows the first Cape campaign is a phased bridge, not the final reusable end state.'
