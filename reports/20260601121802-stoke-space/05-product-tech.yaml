  - type: private-evidence-only
    severity: material
    topic: cyber-quality-controls
    missingEvidence: Public materials do not disclose formal quality certifications, launch-operations cybersecurity controls, or privacy controls for customer and mission data.
    whyItMatters: Institutional diligence needs these controls to evaluate whether Stoke can convert technical demonstrations into insurable, repeatable service for government and commercial customers.
    diligencePath: Request AS9100 or equivalent quality documentation, cyber control mappings, payload data-handling policies, and any customer security accreditation packages.
    relatedQuestionRefs:
