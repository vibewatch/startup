  evidenceGaps:
  - type: missing-source
    severity: material
    topic: reusable-operations-approval
    missingEvidence: No public supplemental environmental analysis, reusable landing profile, or FAA reusable-operations license package is available for Nova beyond the phased initial launch program.
    whyItMatters: The step from expendable first flights to actual reusable operations is a gating product milestone, not a paperwork footnote, because it determines where and how Stoke can prove the full business model.
    diligencePath: Request the latest Space Force or FAA reusable-operations approval schedule, landing concept of operations, and any supplemental NEPA scope documents.
    relatedQuestionRefs:
