  - type: missing-source
    severity: material
    topic: turnaround-proof
    missingEvidence: No public source discloses actual refurbishment hours, post-flight inspection scope, or a completed full reuse loop for either Nova stage.
    whyItMatters: Rapid turnaround is central to the investment thesis, so the absence of measured refurbishment data leaves the most important operating assumption unverified.
    diligencePath: Ask management for refurbishment workcards, estimated labor hours, consumables replacement lists, and the criteria for declaring a stage ready for reflown service.
