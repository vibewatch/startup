- id: differentiation-risks-and-controls
  title: Differentiation, risks, and control environment
  body: 'Stoke''s differentiation is real but inseparable from its risk. Versus Neutron, Terran R, RS1, Alpha, MLV, and Vulcan, Stoke is taking the most aggressive public position on full upper-stage reuse in the medium-lift class, and its steel-tank plus integrated-heat-shield choices create a visible architectural identity. The same choices also concentrate execution risk into a few coupled systems: hydrogen handling, hot-stage coupling, upper-stage reentry, reusable turnaround labor, and the regulatory path from initial launches to actual recovery operations. The public controls are mostly engineering and programmatic rather than compliance-heavy. Stoke has staged its evidence ladder from Hopper2 to Zenith to mission-duty-cycle testing and structural qualification, and it has designed LC-14 around repeatable processing rather than ad hoc pad sharing. What is still missing is the institutional-control layer investors would want to see alongside those hardware wins: formal quality certifications, launch-ops cybersecurity and privacy controls, reusable-landing approvals, and measured refurbishment data. That means the moat is plausible, but not yet fully underwritten by public process maturity.'
