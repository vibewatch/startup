- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / requirement
  - Status
  - Scope
  - Gap / implication
  rows:
  - - Space Force environmental approval for initial LC-14 program
    - Publicly documented
    - Pad development and phased initial launch concept
    - Does not clear the later reusable operating concept by itself
  - - FAA vehicle operator licensing under Part 450 framework
    - Framework public; Stoke-specific final vehicle license not disclosed here
    - Launch, reentry, and pre/post-flight operations
    - Need actual license status and conditions
  - - Supplemental environmental work for reusable operations
    - Still pending publicly
    - Booster or upper-stage landing and recovery operations
    - Core product thesis cannot be fully validated until this path is cleared
  - - Pad durability controls
    - Publicly described
    - Water-cooled flame diverter, heavy launch mount, pressure-builder propellant system
    - Engineering intent is strong, but no recurrent launch data yet
  - - Quality / cyber / privacy controls
    - Not publicly disclosed in reviewed material
    - Manufacturing process, launch ops, customer and mission data handling
    - Leaves a diligence blocker for insurability and government mission assurance
  - - High-cadence refurbishment controls
    - Aspirational only in public sources
    - Turnaround labor, inspection scope, and parts replacement after flight
    - No measured post-flight work package is public
  notes: Public controls are strongest for site design and program phasing, and weakest for institutional process maturity such as quality certification, cyber controls, and measured refurbishment procedures.
