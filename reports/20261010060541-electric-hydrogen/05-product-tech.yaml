  title: "Product & Technology"
  summary: "Electric Hydrogen engineers a modular 100 MW PEM electrolysis plant delivering up to 45 metric tons of clean hydrogen daily, targeting $800–$900/kW installed capex. Its core technological advantage relies on proprietary high-power-density cell stacks built in Devens, Massachusetts, combined with modular balance-of-plant skids fabricated by Titan in Texas, though commercial delivery remains exposed to European power electronics supply chains and broader market financing delays."
sections:
  - id: "section-turnkey-plant-scope"
    title: "Turnkey 100 MW Electrolysis Plant Scope and Product Definition"
    body: >-
      Electric Hydrogen designs and manufactures fully integrated, industrial-scale water electrolysis plants engineered specifically for high-capacity industrial decarbonization. The company's flagship product is a turnkey 100 MW plant rated to produce up to 45 metric tons of high-purity green hydrogen per day. Unlike conventional equipment vendors that sell unintegrated electrolyzer stack skids and shift complex engineering, procurement, and construction responsibilities onto developers, Electric Hydrogen supplies a standardized, all-inclusive package. This pre-engineered scope includes electrochemical cell stacks, multi-megawatt power conversion equipment, gas-liquid separators, thermal management circuits, deionized water treatment systems, and centralized plant automation controls. By packaging the entire electrolysis train into modular units designed for standard over-the-road freight, the company seeks to compress on-site installation timelines down to approximately five months, targeting an installed capital cost between $800 and $900 per kilowatt compared to prevailing industry benchmarks exceeding $1,700 to $2,000 per kilowatt.
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE007"
      - "CE012"
      - "CE013"
    tableRefs:
      - "TE001"
    figureRefs:
      - "FE001"
  - id: "section-electrochemical-stack-architecture"
    title: "Electrochemical Cell Architecture and Balance-of-Plant Engineering"
    body: >-
      At the core of Electric Hydrogen's technological differentiation is a proprietary proton exchange membrane (PEM) cell architecture engineered to operate at unprecedented current density. While conventional commercial PEM and alkaline electrolyzers typically operate within conservative current densities between 1 and 3 A/cm² to manage thermal and structural stresses, Electric Hydrogen pushes cell-level electrochemistry to much higher throughput per unit active area while maintaining electrical efficiency between 75% and 85%. This elevated power density allows the company to significantly shrink physical stack dimensions, economizing on expensive catalyst-coated membranes, titanium plates, and noble metal catalysts including platinum and iridium. The balance of plant is arranged in robust modular skids that manage multi-phase fluid dynamics, separating hydrogen and oxygen gases and deoxygenating the product stream. The electrical architecture requires heavy industrial infrastructure, including custom kiloamp-level AC and DC bussing systems, underground conduit networks, and medium-voltage power transformers configured to meet strict NFPA, IEEE, and UL industrial standards.
    claimRefs:
      - "CE002"
      - "CE004"
      - "CE009"
      - "CE010"
    tableRefs:
      - "TE003"
  - id: "section-industrial-workflow-and-grid-coupling"
    title: "Industrial Customer Workflow Integration and Grid Coupling Dynamics"
    body: >-
      Electric Hydrogen targets large industrial commodity producers whose core manufacturing workflows demand continuous, high-volume hydrogen feedstocks, specifically green ammonia synthesis, e-fuel manufacturing, methanol production, and petroleum refining. In ammonia production, on-site 100 MW electrolyzers replace fossil steam methane reforming, eliminating direct carbon dioxide emissions from fertilizer synthesis. Because modern PEM electrolysis stacks can modulate power consumption rapidly without external battery storage buffers, Electric Hydrogen's plants can follow variable wind and solar generation profiles. However, coupling large-scale 100 MW loads to regional electrical grids introduces substantial operating constraints. Academic research highlights that electric-hydrogen integrated energy systems cannot be decoupled from transmission interconnection limits, local inertia shortages, and power curtailment risks. Industrial facilities must carefully balance flexible hydrogen production schedules against downstream chemical synthesis processes like Haber-Bosch loops, which traditionally require stable continuous feed gas.
    claimRefs:
      - "CE001"
      - "CE008"
      - "CE010"
      - "CE011"
    tableRefs:
      - "TE002"
  - id: "section-manufacturing-scaleup-and-technical-risks"
    title: "Manufacturing Scaling, Independent Validation, and Execution Risks"
    body: >-
      To bridge the gap between laboratory innovation and industrial deployment, Electric Hydrogen operates a dual-hub manufacturing strategy. The company produces its proprietary cell stacks at its gigafactory in Devens, Massachusetts, while partnering with Titan Production Equipment in Columbus, Texas to fabricate and assemble the large-scale chemical processing and balance-of-plant skids. This model leverages established Gulf Coast oil and gas equipment manufacturing capacity, ensuring modules are pre-assembled and pre-tested prior to dispatch. On the technical assurance front, the company achieved independent design validation from DNV following a rigorous engineering assessment of its HYPRPlant design. Nevertheless, critical execution and technical risks remain. Electric Hydrogen sources its multi-megawatt power conversion systems primarily from European vendors, meaning approximately half of the plant's total capital value is exposed to overseas supply chain constraints, shipping schedules, and import tariffs. Furthermore, broad green hydrogen deployment across the United States has slowed due to project finance bottlenecks, uncertain federal tax credit rules, and high power prices, testing the company's delivery cadence.
    claimRefs:
      - "CE003"
      - "CE005"
      - "CE006"
      - "CE007"
      - "CE014"
