      - number: '6.3'
        title: Named Customer Deployments and Operational Proof Points
        blocks:
          - type: paragraph
            body: >-
              The cornerstone of Electric Hydrogen's commercial proof is Infinium's Project Roadrunner in Pecos, Texas,
              a 100MW power-to-liquids plant that reached final investment decision in May 2025. Electric Hydrogen
              partnered with Titan Production Equipment in Texas to fabricate and assemble modular 100MW process skids,
              enabling rapid on-site assembly within six months. Beyond Project Roadrunner, the company has accumulated
              substantial pre-FID commercial momentum, securing preferred electrolyzer vendor status with Perdaman for
              the Project Helios ammonia development in Western Australia, alongside technology selections with Synergen
              Green Energy for a 240MW US green ammonia project and HIF Global for Texas e-fuels.
