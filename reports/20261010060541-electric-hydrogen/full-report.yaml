      - number: '5.2'
        title: Electrochemical Cell Architecture and Balance-of-Plant Engineering
        blocks:
          - type: paragraph
            body: >-
              At the core of Electric Hydrogen's technological differentiation is a proprietary proton exchange membrane
              (PEM) cell architecture engineered to operate at unprecedented current density. While conventional
              commercial PEM and alkaline electrolyzers typically operate within conservative current densities between
              1 and 3 A/cm² to manage thermal and structural stresses, Electric Hydrogen pushes cell-level
              electrochemistry to much higher throughput per unit active area while maintaining electrical efficiency
              between 75% and 85%. This elevated power density allows the company to significantly shrink physical stack
              dimensions, economizing on expensive catalyst-coated membranes, titanium plates, and noble metal catalysts
              including platinum and iridium. The balance of plant is arranged in robust modular skids that manage
              multi-phase fluid dynamics, separating hydrogen and oxygen gases and deoxygenating the product stream. The
              electrical architecture requires heavy industrial infrastructure, including custom kiloamp-level AC and DC
              bussing systems, underground conduit networks, and medium-voltage power transformers configured to meet
              strict NFPA, IEEE, and UL industrial standards.
            claimRefs:
              - CE002
              - CE004
              - CE009
              - CE010
          - type: table
            tableRef: TE003
