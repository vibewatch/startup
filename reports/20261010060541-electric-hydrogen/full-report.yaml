      - number: '6.2'
        title: Commercial Adoption Trajectory from Reservations to FIDs
        blocks:
          - type: paragraph
            body: >-
              Electric Hydrogen's commercial trajectory mirrors the broader hydrogen macro cycle, shifting from initial
              hype into an industry-wide trough of disillusionment. In 2022 and 2023, initial market enthusiasm enabled
              the company to secure millions of dollars in multi-year capacity reservation deposits from developers such
              as Intersect Power and AES in a seller's market. However, as capital costs escalated and project
              unbankability emerged globally, developers struggled to secure non-recourse project finance for
              first-of-a-kind electrolyzer facilities. Electric Hydrogen adapted by targeting balance-sheet buyers
              willing to deploy corporate equity and by establishing an integrated project financing partnership with
              Generate Capital following its acquisition of Ambient Fuels.
            claimRefs:
              - CU003
              - CU005
