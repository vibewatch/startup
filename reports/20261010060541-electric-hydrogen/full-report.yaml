              - CV014
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Investment Stance: Track Pending Commercial Proof'
            body: >-
              Electric Hydrogen represents one of the most credible technology platforms in the Western electrolyzer
              sector, but deploying capital at a unicorn valuation in the midst of an industrial green hydrogen project
              finance slowdown exposes investors to severe downside. We recommend tracking the company until the 100 MW
              Project Roadrunner installation completes full commercial commissioning in 2027.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV007
              - CV008
