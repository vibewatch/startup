      - number: '6.4'
        title: Customer Concentration, Retention Dynamics, and Procurement Friction
        blocks:
          - type: paragraph
            body: >-
              Despite high-profile technology selections across four continents, Electric Hydrogen faces severe revenue
              concentration in the near term. Turnkey sales cycles span three to five years from initial screening to
              commissioning, and Project Roadrunner is the company's only 100MW plant under active commercial
              construction. Customer retention and net revenue expansion metrics remain unproven in the field because no
              commercial plant has achieved steady-state operation prior to Roadrunner's planned 2027 commercial
              operation date. Sustained growth depends on navigating severe procurement friction, maintaining low
              modular installed costs, and converting multi-hundred-megawatt pipeline agreements into binding turnkey
              procurement orders.
            claimRefs:
              - CU004
