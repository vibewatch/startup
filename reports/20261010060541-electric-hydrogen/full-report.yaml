              - CU006
              - CU007
          - type: callout
            title: Single-Asset Commercial Concentration at Project Roadrunner
            body: >-
              While Electric Hydrogen holds preferred vendor status across several gigawatt-scale initiatives, Project
              Roadrunner represents its sole confirmed 100MW commercial deployment under construction. Commercial
              viability hinges on successful 2027 commissioning and subsequent conversion of non-binding pipeline
              selections.
            calloutType: risk
