      - number: '7.3'
        title: Partner Concentration and Supply Chain Dependencies
        blocks:
          - type: paragraph
            body: >-
              Electric Hydrogen's modular delivery model relies on key external manufacturing partnerships and
              specialized international supply chains. To manufacture the non-stack balance-of-plant process skids, the
              company formed an exclusive strategic partnership with Texas-based fabricator Titan Production Equipment.
              While this collaboration leverages Titan's chemical process manufacturing infrastructure and Gulf Coast
              workforce, it concentrates skid assembly and physical integration within a single vendor's Columbus, Texas
              facility. Furthermore, approximately half of the overall dollar value of the plant comprises specialized
              European electrical equipment, including high-power rectifiers, transformers, and power distribution
              systems. This geographic dispersion exposes plant delivery schedules to transatlantic freight bottlenecks,
              currency fluctuations, and trade policy adjustments. To buffer against partner and financing friction,
              Electric Hydrogen acquired Ambient Fuels and forged a co-development partnership with Generate Capital,
              creating an internal project financing mechanism to assist commercial counterparties.
            claimRefs:
