              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Macroeconomic and Subsidy Uncertainty Constrain Broad Market Adoption
            body: >-
              The green hydrogen industry's broader transition into a market trough highlights significant execution
              hazards for high-capex electrolyzer plants. In the absence of finalized 45V additionality regulations and
              clear project financing structures, customer commitments remain fragile.
            calloutType: risk
