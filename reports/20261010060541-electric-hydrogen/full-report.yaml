            title: Preference Overhang and Debt Service Priorities
            body: >-
              With $100M in corporate bank debt, $50M in equipment debt financing, and senior Series C/C-1 preferred
              stock liquidation preferences, early equity holders face significant structural subordination if customer
              conversion timelines continue to slip.
            calloutType: risk
            claimRefs:
