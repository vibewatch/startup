        title: Exhibits
        blocks:
          - type: callout
            title: The Shift from Capacity Reservations to Balance-Sheet Buyers
            body: >-
              Electric Hydrogen's early commercial model relied on developers paying multi-million-dollar deposits to
              reserve manufacturing slots. As global hydrogen sentiment entered a trough of disillusionment, the company
              pivoted to targeting balance-sheet sponsors capable of absorbing technology risk without third-party
              project finance.
            calloutType: insight
            claimRefs:
              - CU003
