              - CE008
              - CE010
              - CE011
      - number: '5.4'
        title: Manufacturing Scaling, Independent Validation, and Execution Risks
        blocks:
          - type: paragraph
            body: >-
              To bridge the gap between laboratory innovation and industrial deployment, Electric Hydrogen operates a
              dual-hub manufacturing strategy. The company produces its proprietary cell stacks at its gigafactory in
              Devens, Massachusetts, while partnering with Titan Production Equipment in Columbus, Texas to fabricate
              and assemble the large-scale chemical processing and balance-of-plant skids. This model leverages
              established Gulf Coast oil and gas equipment manufacturing capacity, ensuring modules are pre-assembled
              and pre-tested prior to dispatch. On the technical assurance front, the company achieved independent
              design validation from DNV following a rigorous engineering assessment of its HYPRPlant design.
              Nevertheless, critical execution and technical risks remain. Electric Hydrogen sources its multi-megawatt
              power conversion systems primarily from European vendors, meaning approximately half of the plant's total
              capital value is exposed to overseas supply chain constraints, shipping schedules, and import tariffs.
              Furthermore, broad green hydrogen deployment across the United States has slowed due to project finance
              bottlenecks, uncertain federal tax credit rules, and high power prices, testing the company's delivery
              cadence.
            claimRefs:
              - CE003
              - CE005
              - CE006
              - CE007
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Capital Expenditure Advantage Through Power Density
            body: >-
              Electric Hydrogen's core technical differentiation lies in operating its PEM electrolyzer stacks at
              significantly higher current density than conventional commercial units. By maximizing hydrogen production
              rate per unit cell area, the company claims to achieve up to 60% lower installed balance-of-plant capex,
              projecting $800 to $900 per kilowatt fully installed compared to industry averages exceeding $1,700 to
              $2,000 per kilowatt.
            calloutType: strength
            claimRefs:
              - CE001
              - CE004
              - CE012
          - type: callout
            title: Supply Chain Exposure in European Power Electronics
            body: >-
              Approximately half of the total capital value of Electric Hydrogen's 100 MW plant is tied to power
              conversion systems sourced from European suppliers. This geographic concentration exposes project delivery
              schedules to European manufacturing lead times, maritime logistics delays, and potential trade tariff
              volatility as U.S. project sites prepare for commissioning.
            calloutType: risk
            claimRefs:
              - CE006
              - CE009
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Industrial Customer Landscape and Target Market Segmentation
        blocks:
          - type: paragraph
            body: >-
              Electric Hydrogen focuses its commercial strategy exclusively on heavy industrial sectors where direct
              electrification is technically infeasible and fossil hydrogen replacement is critical. Target verticals
              comprise synthetic power-to-liquids e-fuels, green ammonia, chemical manufacturing, oil refining, and
              industrial green steelmaking. Across these sectors, the primary customer archetype is not a merchant
              utility but an industrial project developer or commodity producer requiring 100MW-scale installations to
              reach commercial plant viability. In markets such as Europe, strict regulatory mandates under the European
              Delegated Acts compel chemical consumers to transition to electrolytic hydrogen, establishing firmer
              customer offtake commitments than US policy frameworks that rely primarily on production tax credits.
            claimRefs:
              - CU001
              - CU002
