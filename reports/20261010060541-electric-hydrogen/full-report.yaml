              - CE011
      - number: '5.3'
        title: Industrial Customer Workflow Integration and Grid Coupling Dynamics
        blocks:
          - type: paragraph
            body: >-
              Electric Hydrogen targets large industrial commodity producers whose core manufacturing workflows demand
              continuous, high-volume hydrogen feedstocks, specifically green ammonia synthesis, e-fuel manufacturing,
              methanol production, and petroleum refining. In ammonia production, on-site 100 MW electrolyzers replace
              fossil steam methane reforming, eliminating direct carbon dioxide emissions from fertilizer synthesis.
              Because modern PEM electrolysis stacks can modulate power consumption rapidly without external battery
              storage buffers, Electric Hydrogen's plants can follow variable wind and solar generation profiles.
              However, coupling large-scale 100 MW loads to regional electrical grids introduces substantial operating
              constraints. Academic research highlights that electric-hydrogen integrated energy systems cannot be
              decoupled from transmission interconnection limits, local inertia shortages, and power curtailment risks.
              Industrial facilities must carefully balance flexible hydrogen production schedules against downstream
              chemical synthesis processes like Haber-Bosch loops, which traditionally require stable continuous feed
              gas.
            claimRefs:
              - CE001
              - CE008
              - CE010
              - CE011
          - type: table
            tableRef: TE002
            claimRefs:
