  - id: FE001
    title: Electric Hydrogen Integrated 100 MW Electrolyzer Plant Architecture Stack
    type: stack
    summary: >-
      Hierarchical architecture of Electric Hydrogen's 100 MW electrolysis plant spanning physical balance of plant,
      power conversion, electrochemical stacks, and supervisory controls.
    claimRefs:
      - CE001
      - CE002
      - CE004
      - CE006
      - CE009
    approximationNotes: >-
      Layer hierarchy reflects system architectural specifications published in Electric Hydrogen technical whitepapers
      and engineering job postings.
    data:
      layers:
        - label: 'Layer 1: Renewable Grid & Substation Interconnect'
          detail: Connects multi-megawatt plant to renewable power sources and regional transmission networks
          modules:
            - Medium-Voltage Substation Interconnect
            - IEEE and NFPA Compliant Switchgear
            - Liquid-Filled Transformers
        - label: 'Layer 2: Power Conversion & DC Rectification'
          detail: Converts AC grid power into high-amperage direct current for electrochemical water splitting
          modules:
            - European Multi-Megawatt Rectifier Units
            - High-Amperage AC/DC Converters
            - Kiloamp-Level DC Busbars & Underground Conduits
        - label: 'Layer 3: Electrochemical Cell Stack Array'
          detail: Splits purified water into hydrogen and oxygen across high-power-density PEM stacks
          modules:
            - High-Current-Density PEM Electrolyzer Stacks
            - Catalyst-Coated Membranes (CCM)
            - Bipolar Plates & Flow Field Assemblies
        - label: 'Layer 4: Balance of Plant (BOP) Process Skids'
          detail: Separates, purifies, and dries product gases in factory-assembled modular process skids
          modules:
            - Titan Modular Gas-Liquid Separators
            - Deoxygenation & Hydrogen Purification Skids
            - Deionized Water Treatment & Circulation Units
        - label: 'Layer 5: Thermal Management & Heat Rejection'
          detail: Dissipates excess electrochemical heat and regulates stack operating temperatures
          modules:
            - Closed-Loop Cooling Circuit Heat Exchangers
            - Chiller & Evaporative Cooling Modules
            - Process Waste Heat Recovery Interfaces
        - label: 'Layer 6: Supervisory Plant Automation & Safety'
          detail: Coordinates dynamic load following, balance-of-plant automation, and emergency shutdown
          modules:
            - Automated Distributed Control System (DCS)
            - Dynamic Renewable Dispatch Optimization
            - Safety Instrumented System & Gas Detection Loops
  - id: FU001
    title: Customer journey and deployment lifecycle
    type: journey-map
    summary: Six-stage commercial engagement pathway from initial project feasibility to multi-plant operational expansion.
    claimRefs:
      - CU004
      - CU006
      - CU007
      - CU011
      - CU012
      - CU013
    data:
      items:
        - label: 1. Project Origination & Feasibility
          stage: Origination
          summary: Industrial developer evaluates clean hydrogen site power availability and offtake economics.
          touchpoints:
            - Renewable power tariff screening
            - Preliminary plant sizing and LCOH modeling
            - Regulatory mandate assessment (e.g. EU Delegated Acts)
        - label: 2. Technology Selection & Capacity Reservation
          stage: Selection
          summary: Developer selects 100MW HYPRPlant architecture and secures factory production slots.
          touchpoints:
            - Technical validation review (DNV verification)
            - Multi-million-dollar capacity reservation agreement
            - Pre-FEED engineering package definition
        - label: 3. Financing & Capital Structuring
          stage: Financing
          summary: Addressing project finance unbankability through balance-sheet capital or partner financing.
          touchpoints:
            - Assessment of balance-sheet sponsor risk appetite
            - Generate Capital co-development and financing structuring
            - Subsidies, tax credits (IRA 45V), and grant alignment
        - label: 4. Final Investment Decision & Turnkey Order
          stage: Contracting
          summary: Customer commits balance-sheet capital, placing firm equipment purchase orders.
          touchpoints:
            - Final Investment Decision (FID) milestone
            - Binding supply agreement for 100MW modular units
            - EPC partner mobilization (e.g. Weitz execution)
        - label: 5. Skid Fabrication & Rapid Construction
          stage: Deployment
          summary: Titan pre-assembles process skids in Texas with under six months of on-site plant installation.
          touchpoints:
            - Off-site modular fabrication at Titan facility
            - Factory pre-commissioning and testing
            - On-site skid delivery and balance-of-plant hookup
        - label: 6. Commercial Commissioning & Fleet Expansion
          stage: Expansion
          summary: Hydrogen plant begins commercial output with customer scaling to subsequent multi-plant phases.
          touchpoints:
            - Pre-startup safety review and hydrogen gas generation
            - Downstream e-fuel / ammonia synthesis integration
            - Multi-hundred-megawatt fleet expansion evaluation
