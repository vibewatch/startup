company:
  name: "Electric Hydrogen"
chapter:
  number: 4
  title: "Financials"
  summary: "Electric Hydrogen operates as an industrial clean-tech OEM selling turnkey 100 MW electrolyzer plants and balance-of-plant process packages, supported by over $600 million in equity funding, $150 million in debt and credit facilities, and non-dilutive federal grants. However, the company remains pre-profitability with private GAAP financials, facing market-wide customer final investment decision delays that constrain forward revenue visibility."
sections:
  - id: "revenue-streams-and-commercial-model"
    title: "Revenue Streams and Commercial Model"
    body: "Electric Hydrogen generates revenue primarily through capital equipment sales of its flagship 100 MW HYPRPlant electrolytic hydrogen production systems, engineered specifically for large-scale industrial decarbonization. The commercial monetization model centers on multi-million-dollar turnkey plant delivery, encompassing proprietary proton exchange membrane (PEM) electrolysis stacks manufactured in Devens, Massachusetts, combined with modularized balance-of-plant skids built by manufacturing partner Titan in Texas. In addition to upfront hardware sales, the company structures long-term service agreements (LTSAs) for ongoing performance monitoring, preventative maintenance, replacement parts, and periodic stack refurbishment over a twenty-year facility operating lifetime. In response to industry-wide project financing headwinds, Electric Hydrogen transitioned its go-to-market motion away from speculative early-stage capacity reservations toward binding purchase orders with balance-sheet-funded industrial customers in point-source compliance markets, such as synthetic aviation fuels and refinery hydroprocessing. While third-party aggregators model 2025 revenue at approximately $93.1 million, recognized GAAP revenue and product line margin distributions remain undisclosed private company data."
    claimRefs:
      - CI004
      - CI005
      - CI006
      - CI008
    tableRefs:
      - TI001
    figureRefs:
      - FI001
  - id: "pricing-structure-and-plant-monetization"
    title: "Pricing Structure and Plant Monetization"
    body: "Electric Hydrogen prices its 100 MW plant systems on a negotiated turnkey basis rather than through standardized public catalog pricing, tailoring commercial contract terms to site-specific power interconnection, water treatment, and gas processing requirements. The company's strategic value proposition is anchored on delivering green hydrogen at a levelized cost of hydrogen (LCOH) under $1.50 per kilogram, designed to undercut conventional fossil-derived grey hydrogen without requiring perpetual policy subsidies. To achieve this cost threshold, Electric Hydrogen partnered with Texas-based Titan Production Equipment to standardize process skid manufacturing, targeting up to a 60% reduction in total installed plant capital expenditures compared to conventional multi-contractor PEM installations. Pricing schedules incorporate milestone-based progress billing tied to factory fabrication, factory acceptance testing, on-site skid delivery, and commissioning milestones. Contract structures for commercial deployments such as Infinium's Project Roadrunner include performance guarantees on system availability, hydrogen output purity, and energy conversion efficiency."
    claimRefs:
      - CI003
      - CI004
      - CI005
    tableRefs:
      - TI002
  - id: "cost-structure-and-unit-economics"
    title: "Cost Structure and Unit Economics"
    body: "The operating cost structure of Electric Hydrogen is characterized by high fixed capital intensity associated with operating its 1.2 GW per year gigafactory in Devens, Massachusetts, alongside variable bill-of-materials expenditures for precision balance-of-plant components and cell fabrication. Stack manufacturing economics depend critically on factory utilization and throughput yield to amortize capital investments in automated tooling and cell stacking machinery. A critical variable cost risk resides in upstream commodity exposure to scarce platinum group metals, particularly iridium and platinum catalysts utilized in the high-current-density PEM cell design, where localized global supply concentration in Southern Africa poses pricing volatility and supply-chain bottlenecks. Operating expenses are further driven by a specialized engineering and operations workforce of approximately 300 to 354 employees distributed between corporate headquarters in Devens, cell engineering in Natick, and pilot plant testing facilities in San Jose. Moving from module assembly to volume production requires continuous engineering to reduce iridium catalyst loading and shorten supply lead times for balance-of-plant subsystems."
    claimRefs:
      - CI003
      - CI011
      - CI012
      - CI013
    tableRefs:
      - TI003
  - id: "capital-adequacy-and-financing-dependency"
    title: "Capital Adequacy and Financing Dependency"
    body: "Electric Hydrogen maintains a comparatively well-capitalized balance sheet relative to pure-play clean hydrogen peers, having accumulated over $600 million in total equity funding alongside substantial non-dilutive and credit-backed financing structures. Following its $380 million Series C equity financing in October 2023 at a $1.0 billion post-money valuation, the company diversified its capital base in 2024 by securing a $100 million credit facility from syndication partners HSBC, J.P. Morgan, Stifel, and Hercules Capital, supplemented by $50 million in equipment debt from Trinity Capital and a $46.3 million manufacturing grant from the U.S. Department of Energy. In private secondary markets, Forge recorded a May 2025 Series C-1 transaction priced at $6.89 per share, implying an equity valuation of approximately $1.39 billion. Nevertheless, capital consumption remains elevated due to ongoing factory scaling and customer deployment timelines, while macroeconomic interest rate pressures and regulatory uncertainty regarding Treasury Section 45V production tax credit rules continue to delay customer final investment decisions across the broader sector. Diligence underwriting is constrained by the absence of public cash burn, operating runway, and realized contract margin disclosures."
    claimRefs:
      - CI001
      - CI002
      - CI007
      - CI009
      - CI010
      - CI014
