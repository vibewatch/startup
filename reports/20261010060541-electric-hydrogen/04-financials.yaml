callouts:
  - calloutType: risk
    title: "Policy Sensitivity and Slowing Green Hydrogen Project Final Investment Decisions"
    body: "Electric Hydrogen's commercial expansion is heavily contingent upon customer project financing, which has stalled across North America due to protracted regulatory delays surrounding the U.S. Inflation Reduction Act Section 45V clean hydrogen production tax credit guidance and electric grid interconnection queues. The company has responded by tightening sales criteria toward balance-sheet-funded industrial customers."
    claimRefs:
      - CI005
      - CI007
      - CI014
  - calloutType: insight
    title: "Modular Equipment Partnerships Lower Upfront Balance-of-Plant Capital Requirements"
    body: "By partnering with Titan in Texas for process module manufacturing rather than constructing an in-house balance-of-plant assembly facility, Electric Hydrogen limits fixed overhead and leverages established oil and gas fabrication infrastructure. This structure enables modular plant assembly near primary Gulf Coast customers and reduces total installed capital expenditures by up to 60% relative to traditional field-erected electrolyzer installations."
    claimRefs:
      - CI003
      - CI005
      - CI006
