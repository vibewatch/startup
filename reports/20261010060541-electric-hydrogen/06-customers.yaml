chapter:
  number: 6
  title: "Customers"
  summary: "Electric Hydrogen has transitioned from speculative capacity reservations to executing its first commercial 100MW electrolyzer plant for Infinium's Project Roadrunner, but customer adoption remains constrained by green hydrogen unbankability and concentrated in a handful of balance-sheet sponsors."
sections:
  - id: "customer-landscape-and-segmentation"
    title: "Industrial Customer Landscape and Target Market Segmentation"
    body: "Electric Hydrogen focuses its commercial strategy exclusively on heavy industrial sectors where direct electrification is technically infeasible and fossil hydrogen replacement is critical. Target verticals comprise synthetic power-to-liquids e-fuels, green ammonia, chemical manufacturing, oil refining, and industrial green steelmaking. Across these sectors, the primary customer archetype is not a merchant utility but an industrial project developer or commodity producer requiring 100MW-scale installations to reach commercial plant viability. In markets such as Europe, strict regulatory mandates under the European Delegated Acts compel chemical consumers to transition to electrolytic hydrogen, establishing firmer customer offtake commitments than US policy frameworks that rely primarily on production tax credits."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU004"
      - "CU011"
    tableRefs:
      - "TU001"
  - id: "commercial-adoption-trajectory"
    title: "Commercial Adoption Trajectory from Reservations to FIDs"
    body: "Electric Hydrogen's commercial trajectory mirrors the broader hydrogen macro cycle, shifting from initial hype into an industry-wide trough of disillusionment. In 2022 and 2023, initial market enthusiasm enabled the company to secure millions of dollars in multi-year capacity reservation deposits from developers such as Intersect Power and AES in a seller's market. However, as capital costs escalated and project unbankability emerged globally, developers struggled to secure non-recourse project finance for first-of-a-kind electrolyzer facilities. Electric Hydrogen adapted by targeting balance-sheet buyers willing to deploy corporate equity and by establishing an integrated project financing partnership with Generate Capital following its acquisition of Ambient Fuels."
    claimRefs:
      - "CU003"
      - "CU005"
      - "CU006"
      - "CU007"
      - "CU012"
    tableRefs:
      - "TU002"
    figureRefs:
      - "FU001"
  - id: "named-deployments-and-customer-proof"
    title: "Named Customer Deployments and Operational Proof Points"
    body: "The cornerstone of Electric Hydrogen's commercial proof is Infinium's Project Roadrunner in Pecos, Texas, a 100MW power-to-liquids plant that reached final investment decision in May 2025. Electric Hydrogen partnered with Titan Production Equipment in Texas to fabricate and assemble modular 100MW process skids, enabling rapid on-site assembly within six months. Beyond Project Roadrunner, the company has accumulated substantial pre-FID commercial momentum, securing preferred electrolyzer vendor status with Perdaman for the Project Helios ammonia development in Western Australia, alongside technology selections with Synergen Green Energy for a 240MW US green ammonia project and HIF Global for Texas e-fuels."
    claimRefs:
      - "CU002"
      - "CU008"
      - "CU009"
      - "CU010"
      - "CU013"
    tableRefs:
      - "TU003"
  - id: "retention-expansion-and-concentration-risks"
    title: "Customer Concentration, Retention Dynamics, and Procurement Friction"
    body: "Despite high-profile technology selections across four continents, Electric Hydrogen faces severe revenue concentration in the near term. Turnkey sales cycles span three to five years from initial screening to commissioning, and Project Roadrunner is the company's only 100MW plant under active commercial construction. Customer retention and net revenue expansion metrics remain unproven in the field because no commercial plant has achieved steady-state operation prior to Roadrunner's planned 2027 commercial operation date. Sustained growth depends on navigating severe procurement friction, maintaining low modular installed costs, and converting multi-hundred-megawatt pipeline agreements into binding turnkey procurement orders."
    claimRefs:
      - "CU004"
      - "CU006"
      - "CU012"
      - "CU014"
