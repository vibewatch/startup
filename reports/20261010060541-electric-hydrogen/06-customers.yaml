callouts:
  - calloutType: "insight"
    title: "The Shift from Capacity Reservations to Balance-Sheet Buyers"
    body: "Electric Hydrogen's early commercial model relied on developers paying multi-million-dollar deposits to reserve manufacturing slots. As global hydrogen sentiment entered a trough of disillusionment, the company pivoted to targeting balance-sheet sponsors capable of absorbing technology risk without third-party project finance."
    claimRefs:
      - "CU003"
      - "CU005"
      - "CU006"
      - "CU007"
  - calloutType: "risk"
    title: "Single-Asset Commercial Concentration at Project Roadrunner"
    body: "While Electric Hydrogen holds preferred vendor status across several gigawatt-scale initiatives, Project Roadrunner represents its sole confirmed 100MW commercial deployment under construction. Commercial viability hinges on successful 2027 commissioning and subsequent conversion of non-binding pipeline selections."
    claimRefs:
      - "CU002"
      - "CU014"
