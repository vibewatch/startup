  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、产品范围与工业脱碳目标
        blocks:
          - type: paragraph
            body: >-
              Electric Hydrogen 将产品定位在重工业脱碳市场，主动避开分布式交通和小型燃料电池应用，专注多兆瓦工业基础设施。公司制造标准化 100MW 质子交换膜（PEM）电解槽工厂，品牌为
              HYPRPlant，目标是在工业规模上生产绿色氢。核心客户包括氨合成、合成航空燃料（e-SAF）、炼油加氢处理和大宗化工合成等点源工业设施。市场边界包括高压电解槽电堆、完整辅助系统撬块（电力转换、水处理、热管理和气体分离）以及模块化现场部署；不包括本地零售加氢设备、低压商用电解槽、轻型车辆推进系统和长距离输氢管道建设。经济逻辑是用现场直接生产的电解绿色氢替代蒸汽甲烷重整制得的化石灰氢，前提是电力成本和安装资本开支能充分压低。
            claimRefs:
              - CM001
              - CM009
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM009
              - CM010
      - number: '2.2'
        title: 市场规模、增长预测与全球电解槽供给过剩
        blocks:
          - type: paragraph
            body: >-
              清洁氢电解槽的市场规模预测，明显分化于长期理论模型和眼前商业现实。第三方研究预计，2030 年全球电解槽设备需求在保守基础设施分析师估算的 $13.8 billion 与激进净零脱碳预测的 $78.0
              billion 之间，预计复合年增长率超过 60%。但国际能源署汇总的全球部署数据显示，截至 2024 年末全球仅约有 2.0GW 电解槽在运行。相反，西方和中国制造商在 2025
              年前后把全球制造能力激进扩张至超过 50GW，造成 25 倍的产能过剩和显著利润压力。开发商在截至 2025 年第四季度的一年中撤回了全球约 4.9 million tonnes
              的低排放制氢项目产能，短期市场进一步恶化。Electric Hydrogen 的公司披露明确承认，生产税收抵免政策含糊以及对稀缺并网可再生电力的竞争加剧，使项目开发商迟迟无法作出最终投资决定。
            claimRefs:
              - CM002
              - CM003
              - CM006
              - CM007
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM003
              - CM006
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM014
      - number: '2.3'
        title: 买方分层、单位经济与项目可融资性约束
        blocks:
          - type: paragraph
            body: >-
              大规模 100MW 电解槽的商业采用，受客户资产负债表约束和严峻的平准化成本动态支配。多数地区当前绿色氢生产成本为每公斤 $5 至 $7，约为传统化石灰氢每公斤约 $1.50
              的三倍。可再生电力采购占平准化总成本的 60% 至 75%，因此仅靠设备资本开支降本，无法在缺少监管支持时追平灰氢。美国围绕《通胀削减法案》第 45V
              条生产税收抵免的漫长规则制定和政策不确定性，使商业项目长期停滞。近期商业活动因此转向欧洲强制要求（如 RED-III 和 ReFuelEU
              Aviation）以及合成航空燃料、绿色氨等高价值衍生品出口项目。为缓解客户将资本密集型设备记入资产负债表的顾虑，Electric Hydrogen 收购 Ambient Fuels 并与 Generate
              Capital 合作，提供最高 $400 million 的专项客户项目融资。
            claimRefs:
              - CM004
              - CM005
              - CM008
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM011
              - CM012
              - CM013
