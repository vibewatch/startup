            title: 下游融资作为创造需求的机制
            body: Electric Hydrogen 与 Generate Capital 的合作及对 Ambient Fuels 的收购，体现行业从纯设备销售转向交钥匙项目融资，以缓解资本密集型工业客户的资产负债表顾虑。
