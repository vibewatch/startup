        title: 展示材料
        blocks:
          - type: callout
            title: 电解槽产能过剩与项目融资瓶颈
            body: 长期脱碳要求支撑多千兆瓦预测，但眼下绿色氢行业相对在运装机存在 25 倍的制造过剩。高电价和补贴政策不明，仍在推迟客户最终投资决定。
            calloutType: risk
