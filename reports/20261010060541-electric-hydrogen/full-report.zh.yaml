      - number: '1.2'
        title: 创始团队与高管治理
        blocks:
          - type: paragraph
            body: >-
              Electric Hydrogen 由清洁技术老将 David Eaglesham、Raffi Garabedian 和 Derek Warnick
              创立，三人都曾把工业太阳能制造从早期开发推向千兆瓦级产能。首席执行官 Raffi Garabedian 和首席技术官 David Eaglesham 都曾任 First Solar
              CTO，负责建设多千兆瓦制造产能，并将组件制造成本降至每瓦二十美分以下。大尺寸标准化、而非定制项目工程，是 Electric Hydrogen 制造规模化方法的核心。管理团队还包括前 Breakthrough
              Energy Ventures 公司创建者、首席财务官 Derek Warnick；曾任 Leeward Renewable Energy 和 First Solar 高管的首席法务官 Beth
              Deane；以及曾负责 SunPower 企业销售的高级副总裁 Jason Mortimer。这套团队为公用事业级项目执行提供了很强的技术可信度，但公司仍高度依赖技术创始人。
            claimRefs:
              - CO001
              - CO004
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO004
      - number: '1.3'
        title: 资本结构、估值与投资人联盟
        blocks:
          - type: paragraph
            body: >-
              Electric Hydrogen 累计动员超过 $700 million 资本，资产负债表在全球电解槽制造商中相当稳健。2023 年 10 月，公司完成由 Fortescue、Fifth Wall 和
              Energy Impact Partners 领投的 $380 million C 轮股权融资，United Airlines Ventures、Microsoft Climate Innovation
              Fund、BP Ventures 和 Rio Tinto 等战略企业参与，投后估值为 $1.0 billion。2025 年 5 月，私募流动性平台上的二级股份交易显示 C-1 轮估值为 $1.39
              billion，但公司尚未公开确认 2023 年后的定价。除风险股权外，公司还获得 $64.6 million 美国能源部拨款和可转让税收抵免等非稀释性支持，并于 2024 年 5 月从 HSBC、J.P.
              Morgan、Stifel 和 Hercules Capital 等组成的银团获得 $100 million 企业信贷额度。不过，详细股权结构表的分配、清算优先权倍数和运营现金消耗仍属于严格保密的私营公司数据。
