      - number: '8.4'
        title: 图表
        blocks:
          - type: callout
            title: 投资立场：等待商业化验证，继续跟踪
            body: >-
              Electric Hydrogen 是西方电解槽行业最可信的技术平台之一，但在工业绿色氢项目融资放缓期间，以独角兽估值投入资本会让投资者面临严重下行风险。我们建议持续跟踪公司，直到 100 MW Project
              Roadrunner 装置在 2027 年完成全面商业调试。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV007
              - CV008
              - CV014
          - type: callout
            title: 优先权悬置与债务偿付顺序
            body: 公司拥有 $100M 银行公司债务、$50M 设备债务融资，且 C / C-1 轮优先股享有高顺位清算优先权；如果客户转化时间表继续延误，早期股东将面临显著的结构性次级地位。
            calloutType: risk
            claimRefs:
              - CV006
