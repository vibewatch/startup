  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与电解槽类型
        blocks:
          - type: paragraph
            body: >-
              工业水电解市场按电池化学体系、系统封装方式和供应商规模策略分化。Nel Hydrogen
              等欧洲老牌制造商在常压碱性和质子交换膜（PEM）设备上拥有成熟商业记录，但历史上功率密度较低，辅助系统工程也较为分散，导致项目安装资本强度达到 ,700–,000/kW。Sunfire 和 Ohmium
              等西方新创公司采取不同技术路径：Sunfire 同时开发加压碱性和高温固体氧化物电解（SOEC），Ohmium 则专注更小型的互锁式模块化 PEM
              模块。与此同时，中国碱性制造商主导大批量国内制造，以很低价格提供未安装硬件，但负荷跟随灵活性较弱。Electric Hydrogen
              瞄准氨合成、绿色钢铁直接还原和可持续航空燃料（SAF）等数百兆瓦级工业点源，以标准化 100 MW 工厂架构弥合与化石灰氢之间的资本开支差距。
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP008
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP007
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP004
              - CP009
      - number: '3.2'
        title: 技术架构与资本强度
        blocks:
          - type: paragraph
            body: >-
              电解槽竞争力取决于电池电流密度、系统占地、辅助系统优化和动态电力电子集成。传统商用 PEM 电堆在 1.7–2.0 V 下的电流密度为 1–3 A/cm²，需要大量昂贵的铂族金属和特殊钛涂层。Electric
              Hydrogen 的专有电堆架构实现超过 3 A/cm² 的高电流密度，同时减少关键矿物用量，直接降低每公斤氢的原料强度。与交付需要现场定制架构工程的散装电堆部件不同，公司与得州工业制造商 Titan
              合作，交付完整标准化 100 MW 套装。预组装模块化方案把电力转换、气液分离器、热管理和脱氧净化集成到可运输标准撬块中。把现场施工转移到受控工厂环境后，公司目标是实现 00–00/kW 的指示性全安装
              capex，显著低于传统多供应商现场组装工厂。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP006
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP008
      - number: '3.3'
        title: 商业封装、定价与门槛回报率
        blocks:
          - type: paragraph
            body: >-
              绿色氢经济性必须跨过未经减排灰氢建立的基准；在美国，其交付批发价为每公斤 .00 至 .00。达到这一门槛，需要把电解槽安装资本开支压到 ,000/kW 以下，同时获得低成本可再生电力。Electric
              Hydrogen 的指示性工厂价格为 00–00/kW，远低于国际能源署历史估算的碱性 ,700/kW 和西方 PEM ,000/kW；但公司仍需克服高额绝对承诺成本，因为单座 100 MW 工厂意味着
              0M–0M 的设备承诺。清洁氢行业还遭遇 FID 延迟、第 45V 条逐小时匹配规则不明和债务银团谨慎等下行压力，因此客户采购从投机性产能预留转向由资信良好企业资产负债表支持的正式采购订单。
            claimRefs:
              - CP002
              - CP003
