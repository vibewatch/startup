      - number: '3.4'
        title: 护城河持久性、商品化与替代风险
        blocks:
          - type: paragraph
            body: >-
              Electric Hydrogen 的长期竞争护城河来自电堆电化学、标准化辅助系统撬块和系统级热电控制方面的知识产权。独立工程公司 DNV 完成全面技术评估并验证 HYPRPlant 平台，为 Synergen
              Green Energy 的 240 MW 氨项目及澳大利亚 Perdaman Project Helios
              等重大客户承诺提供工程可信度。不过，技术替代和既有势力仍对差异化构成结构性威胁。在交通和低温供热应用中，直接电气化与电池储能的往返效率达到 85% 至 95%，明显优于热力学能量损失为 60% 至 70%
              的电解制氢路径。绿色氢对氨、甲醇和化学还原仍不可或缺，但 Electric Hydrogen 还必须应对亚洲低成本碱性电解槽制造，以及可变可再生电力周期下尚未验证的长期商业电堆耐久性。
            claimRefs:
              - CP007
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
      - number: '3.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 资本强度与补贴依赖
            body: >-
