            body: >-
              多兆瓦绿色氢基础设施的商业化时间表与区域补贴和复杂监管框架紧密相连。美国《通胀削减法案》第 45V
              条清洁氢生产税收抵免指南，围绕新增性、时间匹配和可交付性要求的争论久拖不决，导致机构项目开发商和企业赞助方推迟国内主要氢能枢纽的最终投资决定。公用事业级电解槽工厂还要满足多司法辖区合规要求，包括地方分区许可、高压电网并网审查、取水许可，以及美国机械工程师学会锅炉和压力容器认证。Electric
              Hydrogen 因此寻求欧盟可再生非生物来源燃料标准等具有约束力的监管市场，同时标准化撬块工程以符合严格工业规范。
            claimRefs:
              - CR001
              - CR002
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
              - CR002
              - CR003
              - CR013
      - number: '7.2'
        title: 运营可靠性与规模化风险
        blocks:
          - type: paragraph
            body: >-
              以空前的 100MW 规模部署高功率 PEM 电解槽，会带来显著技术和制造规模化风险。核心挑战是膜电极组件在高强度动态循环、尤其是接入间歇性可再生能源时的寿命和衰减率。Electric Hydrogen 已在
              San Jose 示范设施对全尺寸商业电堆进行了数千小时严格压力测试，在现场部署前发现潜在失效模式。全球保证服务商 DNV 的独立技术尽调确认 HYPRPlant
              架构达到高性能基准并能提供有竞争力的商业保证。但要把示范设备规模化为 Devens
              超级工厂持续千兆瓦级生产，必须保持自动化质量控制不打折。任何未发现的膜针孔、流场分布不均或热斑，都可能引发停机、昂贵保修责任，并损害早期采用者的项目经济性。
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR008
      - number: '7.3'
        title: 伙伴集中度与供应链依赖
        blocks:
          - type: paragraph
            body: >-
              Electric Hydrogen 的模块化交付依赖外部制造伙伴和专业化国际供应链。为制造非电堆辅助系统工艺撬块，公司与得州 Titan Production Equipment 建立独家战略合作。该合作利用
              Titan 的化工工艺制造基础设施和墨西哥湾沿岸劳动力，但也把撬块组装和物理集成集中在单一供应商的得州 Columbus
              工厂。此外，工厂总价值约一半是欧洲专业电气设备，包括高功率整流器、变压器和配电系统。这种地域分散使工厂交付计划暴露于跨大西洋货运瓶颈、汇率波动和贸易政策调整。为缓冲伙伴与融资摩擦，Electric
              Hydrogen 收购 Ambient Fuels，并与 Generate Capital 建立联合开发合作，形成帮助商业交易对手的内部项目融资机制。
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR015
      - number: '7.4'
        title: 市场幻灭、资本强度与执行重点
        blocks:
          - type: paragraph
            body: >-
              清洁氢行业正处于有记录的幻灭低谷，宏观项目融资障碍、高电价和监管延迟让开发商热情降温。为保护资产负债表，Electric Hydrogen
              取消不具约束力的产能预留，专注于资本充足、能在没有第三方项目债务时为工厂建设出资的工业客户正式采购订单。近期商业部署则转向点源工业气体用户，尤其是执行催化加氢处理的炼油厂，以及满足可持续航空燃料掺混要求的先进设施。从资本角度看，公司用
              $65 million 能源部拨款和税收抵免，加上机构贷款人的 $100 million
              商业信贷额度，为资本密集型制造扩建提供资金。不过，公司仍是私营企业，财务报表未公开，二级交易流动性有限，因此持续资本消耗和现金跑道仍是关键监测指标。
            claimRefs:
              - CR001
              - CR009
              - CR010
              - CR011
              - CR012
              - CR014
