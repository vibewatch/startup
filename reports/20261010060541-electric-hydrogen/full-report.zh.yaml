      - number: '5.3'
        title: 工业客户工作流集成与电网耦合动态
        blocks:
          - type: paragraph
            body: >-
              Electric Hydrogen 面向需要连续、大量氢原料的工业大宗商品生产商，重点是绿色氨合成、电子燃料制造、甲醇生产和炼油。氨生产中，现场 100 MW
              电解槽替代化石蒸汽甲烷重整，消除化肥合成的直接二氧化碳排放。现代 PEM 电解槽可快速调节功耗而无需外部电池缓冲，因此工厂能够跟随风电和太阳能的波动曲线。但把大规模 100 MW
              负荷接入区域电网会带来显著运营约束。学术研究指出，电氢一体化能源系统无法脱离输电并网限制、当地转动惯量不足和弃电风险。工业设施必须在灵活制氢排程与下游化工合成（如传统上要求稳定连续进料气的 Haber-Bosch
              循环）之间谨慎平衡。
            claimRefs:
              - CE001
