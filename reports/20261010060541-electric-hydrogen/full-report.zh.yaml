            body: >-
              Electric Hydrogen 的运营成本结构具有较高固定资本强度，既要运营马萨诸塞州 Devens 年产 1.2 GW
              的超级工厂，也要承担精密辅助系统部件和电池制造的可变物料成本。电堆制造经济性高度取决于工厂利用率和产出率，以摊销自动化工具与电池堆叠设备的资本投入。一个关键可变成本风险是稀缺铂族金属，尤其是高电流密度 PEM
              电池所用铱和铂催化剂；全球供应集中于南部非洲，带来价格波动和供应链瓶颈。约 300 至 354 名工程与运营人员分布在 Devens 总部、Natick 电池工程团队和 San Jose
