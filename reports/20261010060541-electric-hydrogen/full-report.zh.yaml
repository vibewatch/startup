chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与运营版图
        blocks:
          - type: paragraph
            body: >-
              Electric Hydrogen（EH2）成立于 2020 年，明确要通过开发高性价比、高产能的绿色制氢系统，减少重工业对化石燃料的依赖。不同于专注小型分布式电解槽的开发商，Electric Hydrogen
              设计并制造完整集成的 100 MW 质子交换膜（PEM）电解槽工厂，直接面向化肥、化工、炼钢和可持续航空燃料等高用量工业承购方。公司总部位于马萨诸塞州
              Devens，并在那里启用先进制造超级工厂，生产自有高电流密度电堆；加州 San Jose 和 San Carlos 的设施负责配套研发、电力电子工程和原型测试。Electric Hydrogen
              在北美以及欧洲、澳大利亚的核心商业枢纽拥有超过 300 名员工，已形成能够交付模块化多兆瓦系统的工业运营版图。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO011
