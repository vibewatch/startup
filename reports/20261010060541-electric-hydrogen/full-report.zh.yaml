      - number: '4.4'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              相比纯清洁氢同行，Electric Hydrogen 资产负债表资本较为充足：累计股权融资超过 $600 million，并配有大量非稀释性和信用支持融资。公司在 2023 年 10 月以 $1.0
              billion 投后估值完成 $380 million C 轮融资后，于 2024 年从 HSBC、J.P. Morgan、Stifel 和 Hercules Capital 银团取得 $100 million
              信贷额度，另有 Trinity Capital 提供的 $50 million 设备债务，以及美国能源部 $46.3 million 制造拨款。Forge 记录的私募二级市场交易显示，2025 年 5 月 C-1
