      - number: '5.2'
        title: 电化学电池架构与辅助系统工程
        blocks:
          - type: paragraph
            body: >-
              Electric Hydrogen 技术差异化的核心，是可在前所未有电流密度下运行的专有 PEM 电池架构。传统商用 PEM 和碱性电解槽通常以 1 至 3 A/cm²
              的保守电流密度运行，以控制热和结构应力；Electric Hydrogen 则把单位活性面积的电化学吞吐推得更高，同时维持 75% 至 85%
              的电效率。更高功率密度让公司缩小电堆尺寸，减少昂贵的催化剂涂覆膜、钛板和铂铱等贵金属催化剂。辅助系统采用坚固模块化撬块，管理多相流体，分离氢氧气体并对产物流脱氧。电气架构还需要重型工业基础设施，包括定制千安级
              AC、DC 母线、地下管网和符合 NFPA、IEEE、UL 严格工业标准的中压变压器。
            claimRefs:
              - CE002
              - CE004
              - CE009
              - CE010
