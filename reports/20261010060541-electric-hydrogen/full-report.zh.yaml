      - number: '8.2'
        title: 融资历史与估值背景
        blocks:
          - type: paragraph
            body: >
              Electric Hydrogen 于 2023 年 10 月完成超额认购的 $380M C 轮融资，发行价为每股 $5.74，投后估值达到 $1.0B。资本结构记录显示，C 轮股份附带 1.0x
              不参与型清算优先权、优先级最高的清算顺位，以及 6.0% 非累积股息权。2024 年 5 月，公司向资产负债表注入非稀释性资本，从 HSBC、J.P. Morgan、Stifel 和 Hercules
              Capital 获得 $100M 公司授信额度，另由 Trinity Capital 提供 $50M 设备债务融资。随后，二级市场数据提供商记录了 2025 年 5 月的增量 C-1 轮融资，价格为每股
              $6.89，对应投后估值 $1.39B。


              未经验证的数据聚合商传播了投前跟踪档案，声称公司随后完成融资并达到最高 $6.5B 的估值；但公司一手披露、州注册文件和经过核验的债务登记均未提供独立文件，证明存在超出 $1.0B 至 $1.39B
              区间的私募股权或夹层融资交易。考虑到 Nel ASA、ITM Power 和 Plug Power 等上市电解槽制造商整体估值压缩，Electric Hydrogen
              隐含的私募市场倍数相对于已实现的历史设备出货仍然偏高。在公司未披露历史收入、已确认积压订单转化计划或经审计的制造毛利率的情况下，以 $1.0B 及以上估值进行股权投资判断，需要对客户项目融资和 2027
              年商业部署作出激进假设。
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV009
              - CV010
              - CV011
              - CV012
              - CV015
      - number: '8.3'
        title: 估值情景与决策框架
        blocks:
          - type: paragraph
            body: >
              为覆盖合理的经营环境，我们评估乐观、基准和悲观三种经营情景。乐观情景（概率 25%）下，Electric Hydrogen 按期完成 100 MW Roadrunner 工厂调试，在持续商业运营中实现低于 0.5
              公吨 / MW 的目标材料效率和 60% CAPEX 节省，并将与 Perdaman、Synergen 和 HIF Global 的意向书及首选供应商资格转化为确定的设备出货，对应股权价值 $2.2B 至
              $2.8B。基准情景（概率 50%）下，Project Roadrunner 在 2027
              年前后开始初步运营，但面临常见的调试延误，客户项目融资审批也持续拖延；在此条件下，公司实现中等规模电堆出货，保住资本，但合理股权估值为 $0.8B 至 $1.1B。


              悲观情景（概率 25%）下，宏观监管瓶颈长期存在、利率高企，客户取消尚未完成融资的电子燃料和氨项目，导致巨型工厂的电堆产能闲置。如果早期运营中出现技术性电堆衰减或保修准备金，公司很可能需要重组资本，或以
              $0.3B 至 $0.5B 的惩罚性下轮融资，届时普通股初级股东将大幅次于优先股清算优先权及 $150M 有担保授信和设备债务。基于此，决策框架给出跟踪建议：在 Roadrunner
              的现场调试遥测数据验证电堆耐久性、客户交易对手完成融资交割前，潜在投资者应暂缓新增资本承诺。
            claimRefs:
              - CV002
              - CV003
              - CV007
              - CV008
              - CV012
              - CV013
              - CV014
              - CV016
