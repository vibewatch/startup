        - Roadrunner 实现 COD，仅有轻微调试摩擦；商业转化较慢；积压订单为 300-500 MW。
        - $0.8B - $1.1B
        - 监管政策摩擦（IRS 45V、欧盟授权法案）；客户 FID 谈判拉长。
        - 50%
      - - 悲观情景
        - 项目大规模取消；电解槽技术发生降解故障；偿债压力下流动性承压。
        - $0.3B - $0.5B
        - 下轮折价重组、授信额度契约违约、优先股堆叠被稀释。
        - 25%
    notes: 情景估值反映基于里程碑达成情况和市场条件建模的股权价值区间。
    claimRefs:
      - CV001
      - CV006
      - CV007
      - CV008
      - CV011
      - CV012
      - CV013
      - CV014
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Electric Hydrogen 从 2020 年成立到 2026 年的关键运营、融资及商业规模化里程碑。
    data:
      items:
        - label: 公司成立
          date: 2020-12
          detail: 由前 First Solar 高管 David Eaglesham 和 Raffi Garabedian 在加州创立，并获得 Breakthrough Energy Ventures 支持。
          tone: positive
          claimRefs:
            - CO001
        - label: Series A 融资
          date: 2021-06
          detail: 完成 $23.9M Series A 融资，由 Breakthrough Energy Ventures、Prelude Ventures 和 Capricorn Partners 领投。
          tone: positive
          claimRefs:
            - CO001
            - CO007
        - label: Series B 轮
          date: 2022-06
          detail: 完成 $198M Series B 融资，由 Fifth Wall 领投，用于加快原型开发和工业测试。
          tone: positive
          claimRefs:
            - CO007
        - label: 独角兽 Series C 融资
          date: 2023-10
          detail: 完成 $380M Series C 融资，投后估值 $1.0B，由 Fortescue、Fifth Wall 和 Energy Impact Partners 领投。
          tone: positive
          claimRefs:
            - CO005
        - label: DOE 赠款与税收抵免
          date: 2024-03
          detail: 获得 $46.3M DOE 清洁电解制氢赠款，以及用于 Devens 超级工厂的 $18.3M 48C 可转让制造业税收抵免。
          tone: positive
          claimRefs:
            - CO008
        - label: 公司债务融资工具
          date: 2024-05
          detail: 获得 HSBC、J.P. Morgan、Stifel Bank 和 Hercules Capital 提供的 $100M 公司授信额度。
          tone: positive
          claimRefs:
            - CO007
        - label: Titan 模块化制造联盟
          date: 2025-03
          detail: 与得州的 Titan Production Equipment 合作，制造并组装模块化 100 MW 电解槽工艺撬装。
          tone: positive
          claimRefs:
