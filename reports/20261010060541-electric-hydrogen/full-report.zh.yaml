            body: >-
              Electric Hydrogen 按协商的交钥匙方式为 100 MW
              工厂定价，而不是采用标准化公开目录价格，并根据现场电力并网、供水处理和气体加工要求定制合同条款。公司的战略价值主张是把绿色氢平准化成本（LCOH）降至每公斤 $1.50
              以下，在不依赖永久政策补贴的情况下压过化石灰氢。为达到这一门槛，公司与得州 Titan Production Equipment 合作标准化工艺撬块制造，目标是相较传统多承包商 PEM
              安装，把工厂总安装资本开支最多降低 60%。价格计划采用里程碑进度付款，节点包括工厂制造、工厂验收测试、现场撬块交付和调试。Infinium Project Roadrunner
              等商业部署的合同还包括系统可用性、氢气产物纯度和能量转换效率保证。
