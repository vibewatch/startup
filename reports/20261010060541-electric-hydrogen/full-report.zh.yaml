  - id: FV001
    title: 估值逻辑与建议流程
    type: flow
    summary: 将技术验证、市场逆风与资本结构串联起来，系统呈现支持“持续跟踪”建议的决策流程。
    data:
      nodes:
        - id: n1
          label: 核心技术优势
          detail: 100 MW HYPRPlant 架构可将安装 CAPEX 最多降低 60%，并配套 1.2 GW 的超级工厂产能。
          tone: positive
        - id: n2
          label: 宏观市场逆风
          detail: 项目融资延迟与监管不确定性，拖慢氢能客户群的商业 FID。
          tone: negative
        - id: n3
          label: 未经验证的运营记录
          detail: Project Roadrunner 计划于 2027 年投入商业运营；目前没有多年工业遥测数据。
          tone: warning
        - id: n4
          label: 资本结构与立场
          detail: 已确认的 $1.0B-$1.39B 估值标记，加上 $150M 的债务负担，使估值立场显得偏高。
          tone: neutral
        - id: n5
          label: 下行资本风险
          detail: 在执行延迟情景下，高级清算优先权与 $150M 有担保债务会排在股权之前受偿。
          tone: risk
        - id: n6
          label: 投资判断建议
          detail: 评级为持续跟踪，置信度中等；在商业投产得到确认前暂缓投入资本。
          tone: neutral
      edges:
        - from: n1
          to: n2
          label: 面对
        - from: n2
          to: n3
          label: 叠加
        - from: n3
          to: n4
