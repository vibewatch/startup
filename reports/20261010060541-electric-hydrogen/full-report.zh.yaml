        title: 收入来源与商业模式
        blocks:
          - type: paragraph
            body: >-
              Electric Hydrogen 主要通过销售旗舰 100 MW HYPRPlant 电解制氢系统取得收入，产品专为大规模工业脱碳设计。商业变现围绕数百万美元级交钥匙工厂交付，包括在马萨诸塞州 Devens
              制造的专有 PEM 电解槽电堆，以及得州制造伙伴 Titan
              建造的模块化辅助系统撬块。除前期硬件销售外，公司还签订长期服务协议（LTSAs），覆盖持续性能监测、预防性维护、备件和工厂二十年运营期内的定期电堆翻新。面对全行业项目融资逆风，Electric Hydrogen
              将市场进入方式从投机性早期产能预留转向由资产负债表出资的工业客户正式采购订单，目标是合成航空燃料和炼厂加氢处理等点源合规市场。第三方聚合商预计 2025 年收入约为 $93.1 million，但已确认的
              GAAP 收入和产品线利润率分布仍未公开。
