  - id: FM001
    title: 市场规模视角
    type: pyramid
    summary: 受约束的市场规模层级，从假设性的 2030 年市场预测逐步下探至运营中的公用事业部署和已融资的 100MW 管线承诺。
    data:
      items:
        - label: 假设性 2030 年全球 TAM（$78.0B）
          detail: 顶层激进的行业估计，假设全球监管全面执行，且绿色电力立即可用。
        - label: 保守的 2030 年基准 TAM（$13.8B）
          detail: 自下而上的预测，受到资本开支逆风、更高利率及工业 FID 转化较慢的约束。
        - label: 全球电解槽制造产能（50+ GW）
          detail: 截至 2025 年，西方及中国制造商的全球已建制造布局，代表相对于 2024 年部署量 25 倍的供给过剩。
        - label: 撤回 / 停滞的项目管线（约 4.9M 吨）
          detail: 在 2025 年第四季度之前的 12 个月内，全球取消或延期的低排放氢能项目规模。
        - label: 全球运营中电解槽基数（2.0 GW）
          detail: 国际能源署审计的截至 2024 年底全球实际部署、正在运行的公用事业及工业规模电解槽。
        - label: Electric Hydrogen 已融资共同开发管线（$400M）
          detail: Generate Capital 于 2025 年设立的项目融资工具，用于资助具备银行融资条件的客户安装，并将预留转化为确定订单。
    approximationNotes: 理论 TAM 数值反映已发布的第三方估计；近期管线层级反映已宣布、但仍取决于最终投资决策的客户预留。
    claimRefs:
      - CM002
      - CM003
      - CM004
      - CM005
      - CM006
      - CM014
  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 按安装资本强度和可再生能源运营灵活性，展示电解制氢与清洁氢能替代方案的战略定位。
    data:
      points:
        - label: Electric Hydrogen
          x: 8.5
          'y': 8
          detail: 100 MW 模块化 PEM 工厂，具有高电流密度和集成式厂务系统
        - label: Ohmium
          x: 8
          'y': 5.5
          detail: 模块化互锁 PEM 电解槽堆，灵活性高但分布式规模受限
        - label: Sunfire
          x: 6
          'y': 4.5
          detail: 碱性与 SOEC 双重产品组合，在效率与较高安装成本之间取舍
        - label: Nel Hydrogen
          x: 5
          'y': 4
          detail: 传统碱性与 PEM 标杆，业绩记录成熟但安装资本开支更高
        - label: 中国碱性电解槽 OEM
          x: 2.5
          'y': 7
          detail: 未安装设备资本开支低，但动态响应迟缓且占地大
        - label: 灰氢（SMR）
          x: 1.5
          'y': 9
          detail: 化石能源现状方案，资本投入最低但动态灵活性为零且排放高
        - label: 直接电池储能
          x: 9.5
          'y': 2
          detail: 往返效率高的替代方案，但仅适用于电力和短时储能
    approximationNotes: 坐标轴代表基于已披露安装资本开支基准和动态跟随负荷能力得出的 1-10 序数评分；X 轴越高，表示对间歇性可再生能源的负荷调节可在分钟内完成；Y 轴越高，表示每 kW 总安装资本成本越低。
    claimRefs:
      - CP001
      - CP004
      - CP009
  - id: FI001
    title: 收入模式桥接图
    type: flow
    summary: 从初始客户资格评估，经工厂制造和调试，到长期售后服务的商业转化流程。
    data:
      nodes:
        - id: n1
          label: 客户资格评估与项目可行性
          detail: 面向炼化和 e-SAF 领域、资产负债表实力强且已锁定电力接入的工业运营商
          note: 已从投机性预留协议转向确定性采购订单
        - id: n2
          label: 交钥匙工厂合同执行
          detail: 集成式 100 MW HYPRPlant 系统的数百万美元设备销售
          note: 按里程碑计费，进度款与制造和交付里程碑挂钩
        - id: n3
          label: 自动化电解槽制造（马萨诸塞州 Devens）
          detail: 在马萨诸塞州 1.2 GW/年超级工厂制造高密度 PEM 电解槽堆
          note: 核心自研 IP 与自动化生产捕捉规模经济
        - id: n4
          label: 厂务系统撬装组装（得州 Titan）
          detail: 在得州 Columbus 制造并预先测试模块化工艺设备
          note: 采用标准化油气工程实践，目标是将安装资本开支最多降低 60%
        - id: n5
          label: 现场交付与快速模块化调试
          detail: 模块直接运至客户现场，约 5 个月内完成组装
          note: 预先测试的模块化设计减少现场工程工作和部署周期
        - id: n6
          label: 生命周期服务与电解槽翻新
          detail: 长期服务协议提供运营监控、零部件和电解槽大修
          note: 在工厂 20+ 年运营寿命内形成高毛利的经常性售后收入流
      edges:
        - from: n1
          to: n2
        - from: n2
          to: n3
        - from: n3
          to: n4
        - from: n4
          to: n5
        - from: n5
          to: n6
    approximationNotes: 根据公司披露和公开高管评论，展示商业里程碑顺序及运营交接。
    claimRefs:
      - CI002
      - CI005
      - CI011
  - id: FE001
    title: Electric Hydrogen 集成式 100 MW 电解槽工厂架构
    type: stack
    summary: Electric Hydrogen 100 MW 电解工厂的分层架构，覆盖物理厂务系统、电力转换、电化学电解槽堆及监控控制。
    claimRefs:
      - CE001
      - CE002
      - CE004
      - CE006
      - CE009
    approximationNotes: 层级架构反映 Electric Hydrogen 技术白皮书和工程岗位招聘信息中发布的系统架构规格。
    data:
      layers:
        - label: 第 1 层：可再生电网与变电站互联
          detail: 将兆瓦级工厂连接至可再生能源和区域输电网络
          modules:
            - 中压变电站互联
            - 符合 IEEE 和 NFPA 的开关设备
            - 充液式变压器
        - label: 第 2 层：电力转换与直流整流
          detail: 将交流电网电力转换为用于电化学水分解的大电流直流电
          modules:
            - 欧洲多兆瓦整流器单元
            - 大电流 AC/DC 转换器
            - 千安级直流母线与地下管道
        - label: 第 3 层：电化学电池堆阵列
          detail: 通过高功率密度 PEM 电解槽堆将纯化水分解为氢气和氧气
          modules:
            - 高电流密度 PEM 电解槽堆
            - 催化剂涂覆膜（CCM）
            - 双极板与流场组件
        - label: 第 4 层：厂务系统（BOP）工艺撬装
          detail: 在工厂组装的模块化工艺撬装中分离、纯化并干燥产品气体
          modules:
            - Titan 模块化气液分离器
            - 脱氧与氢气纯化撬装
            - 去离子水处理与循环单元
        - label: 第 5 层：热管理与散热
          detail: 散去多余电化学热量并调节电解槽运行温度
          modules:
            - 闭式冷却回路换热器
            - 冷水机与蒸发冷却模块
            - 工艺余热回收接口
        - label: 第 6 层：工厂监控自动化与安全
          detail: 协调动态跟随负荷、厂务系统自动化及紧急停机
          modules:
            - 自动化分布式控制系统（DCS）
            - 可再生能源动态调度优化
            - 安全仪表系统与气体检测回路
  - id: FU001
    title: 客户旅程与部署生命周期
    type: journey-map
    summary: 六阶段商业合作路径，从初始项目可行性评估到多工厂运营扩张。
    claimRefs:
      - CU004
      - CU006
      - CU007
      - CU011
      - CU012
      - CU013
    data:
      items:
        - label: 1. 项目发起与可行性评估
          stage: 发起
          summary: Industrial developer evaluates clean hydrogen site power availability and offtake economics.
          touchpoints:
            - 可再生能源电价筛选
            - 初步工厂规模与 LCOH 建模
            - 监管要求评估（例如欧盟授权法案）
        - label: 2. 技术选择与产能预留
          stage: 选择
          summary: Developer selects 100MW HYPRPlant architecture and secures factory production slots.
          touchpoints:
            - 技术验证审查（DNV 验证）
            - 数百万美元产能预留协议
            - Pre-FEED 工程包定义
        - label: 3. 融资与资本结构设计
          stage: 融资
          summary: Addressing project finance unbankability through balance-sheet capital or partner financing.
          touchpoints:
            - 评估资产负债表出资方的风险偏好
            - Generate Capital 共同开发与融资结构设计
            - 补贴、税收抵免（IRA 45V）及赠款对接
        - label: 4. 最终投资决策与交钥匙订单
          stage: 签约
          summary: Customer commits balance-sheet capital, placing firm equipment purchase orders.
          touchpoints:
            - 最终投资决策（FID）里程碑
            - 100MW 模块化单元的约束性供应协议
            - EPC 合作伙伴动员（例如 Weitz 执行）
        - label: 5. 撬装制造与快速建设
          stage: 部署
          summary: Titan pre-assembles process skids in Texas with under six months of on-site plant installation.
          touchpoints:
            - Titan 工厂场外模块化制造
            - 工厂预调试与测试
            - 现场撬装交付与厂务系统接驳
        - label: 6. 商业调试与设备群扩张
          stage: 扩张
          summary: Hydrogen plant begins commercial output with customer scaling to subsequent multi-plant phases.
          touchpoints:
            - 投产前安全审查与氢气制备
            - 下游电子燃料 / 氨合成集成
            - 数百兆瓦级设备群扩张评估
