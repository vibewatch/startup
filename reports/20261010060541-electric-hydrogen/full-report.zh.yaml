      - number: '1.4'
        title: 商业里程碑与宏观逆风
        blocks:
          - type: paragraph
            body: >-
              Electric Hydrogen 的商业化已从技术原型快速推进到工业设备交付，关键合作和项目开发商收购是主要驱动。2025 年 3 月，公司与得州 Titan Production Equipment
              建立运营制造联盟，在得州 Columbus 组装模块化 100 MW 工艺撬块，借助墨西哥湾沿岸油气制造基础设施降低交付成本。为应对商业项目融资障碍，公司于 2025 年 9 月收购开发商 Ambient
              Fuels，并与 Generate Capital 建立联合开发安排。尽管公司已被 Infinium、Perdaman 和 Synergen Green Energy
              等重要承购方选为优选供应商，整个绿色氢能行业仍处于明显放缓期。高资本成本、尚未解决的清洁氢补贴框架和客户最终投资决定延迟造成商业瓶颈，迫使 Electric Hydrogen 在提升工厂产能的同时严格管理现金。
