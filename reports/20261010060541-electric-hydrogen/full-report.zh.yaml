      - number: '7.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 宏观经济与补贴不确定性限制广泛采用
            body: 绿色氢行业转入市场低谷，凸显高 capex 电解槽工厂的重大执行风险。在第 45V 条新增性规则最终确定、项目融资结构清晰之前，客户承诺仍很脆弱。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR009
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >
              Electric Hydrogen 的核心投资逻辑建立在自有高功率密度质子交换膜（PEM）技术上：公司把电解槽堆封装进标准化的 100 MW HYPRPlant
              系统。该架构目标是相较传统方案将总安装资本开支最多压降 60%，直击经济性这一根本障碍——长期以来，电解制清洁氢只能停留在小规模示范项目。公司与得州 Titan
              等重型设备制造专家合作，组装标准化的配套设备撬块，同时在 Devens 巨型工厂进行高产量电堆制造，由此打造了工业化设备交付模式。该模式已在多个高关注度能源转型项目中拿下商业供应商资格，包括 Infinium 的
              Project Roadrunner 旗下电转液设施、HIF Global 的电子燃料设施、Synergen Green Energy 的 240 MW 绿色氨项目，以及西澳大利亚的 Perdaman
              Project Helios。


              反过来看，投资反论点指出，风险投资支持的清洁技术估值倍数，与工业绿色氢项目融资环境恶化之间存在严重错配。全球清洁氢开发商普遍推迟最终投资决策（FID），原因包括监管落地规则复杂、补贴政策存在不确定性，以及争抢可再生电网电力的竞争激烈。Electric
              Hydrogen 只做配套设备和电堆供应商，因此其资产负债表会暴露于客户项目融资取消、持续数年的 EPC 采购周期，以及电堆在 20 年运营寿命中的耐久性尚未验证等风险。其旗舰 100 MW Project
              Roadrunner 计划于 2027 年达到商业运营日期（COD），因此公司尚未证明能实现多年商业运行时间、抵抗电堆衰减，或在规模化情况下取得正的单位毛利。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV007
              - CV008
              - CV013
