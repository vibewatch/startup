    body: "While long-term decarbonization mandates support multi-gigawatt forecasts, the immediate green hydrogen sector suffers from a 25-fold manufacturing overcapacity gap relative to operating installations. High electricity costs and policy ambiguity around subsidies continue to delay customer final investment decisions."
