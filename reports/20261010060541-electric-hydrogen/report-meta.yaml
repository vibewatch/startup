companyProfile:
  summary: >-
    Electric Hydrogen designs and manufactures standardized 100 MW PEM electrolyzer plants for industrial hydrogen
    developers and heavy-industry off-takers. The company is headquartered in Devens, Massachusetts; was founded in 2020
