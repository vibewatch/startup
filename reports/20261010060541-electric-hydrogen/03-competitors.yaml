      - "CP007"
  - calloutType: "insight"
    title: "System-Level Scope as Competitive Moat"
    body: "Rather than selling bare electrolyzer stacks into fragmented EPC integration cycles, Electric Hydrogen delivers complete standardized plants with pre-integrated power conversion and gas separation. This prefabricated approach shifts execution risk away from project developers, defending margins against low-cost component commoditization from overseas alkaline manufacturers."
