    title: "Capital Intensity and Subsidy Dependence"
    body: "While Electric Hydrogen's 100 MW architecture targets an indicative installed cost of 00–00/kW—well below the ,700–,000/kW conventional benchmark—the company's commercial viability remains highly vulnerable to project finance delays and regulatory uncertainty surrounding clean hydrogen tax credits, particularly during an industry-wide market slowdown."
