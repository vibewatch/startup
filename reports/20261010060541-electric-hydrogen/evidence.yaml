evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-performance
    missingEvidence: >-
      Audited financial statements detailing recognized commercial revenues, gross margin structure, operational cash
      burn, and remaining cash runway.
    whyItMatters: >-
      Without audited financial disclosures, investors cannot assess unit economics, gross margins on manufactured
      electrolyzer skids, or the timing of cash-flow breakeven.
    diligencePath: >-
      Request confidential management financial accounts, manufacturing cost breakdown per megawatt, and quarterly cash
      burn projections under non-disclosure agreement.
    relatedQuestionRefs:
      - QO009
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder-map
    missingEvidence: >-
      Complete cap table and preference stack detailing liquidation preferences, conversion rights, and post-2023
      secondary market transactions.
    whyItMatters: >-
      Private financing rounds and secondary trades may feature senior liquidation preferences that impact common equity
      holders and secondary market valuations.
    diligencePath: >-
      Review confidential shareholder agreements, certificate of incorporation amendments in Delaware, and updated cap
      table exhibits from Series C lead investors.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: commercial-conversion-tracking
    missingEvidence: >-
      Audited multi-year project conversion figures, firm delivery milestones, and commercial operating uptime for
      contracted 100MW plant customer reservations.
    whyItMatters: >-
      Without independent commissioning verification, long-term addressable market penetration and plant-in-a-box
      deployment timelines cannot be confirmed.
    diligencePath: >-
      Review off-taker EPC contracts, project financing financial close filings, and initial customer facility
      operational telemetry.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: commercial-commissioning-data
    missingEvidence: >-
      Audited third-party operational data documenting continuous stack efficiency, degradation rates, and availability
      factors across multi-thousand-hour commercial runs of the 100 MW plant.
    whyItMatters: >-
      Without multi-year field operational logs, industrial off-takers and project debt lenders must price unproven
      technology risk into financing terms, slowing final investment decision (FID) conversion.
    diligencePath: >-
      Obtain commissioning logs, availability warranties, and degradation curve schedules from early commercial customer
      installations such as the initial Texas deployment.
    relatedQuestionRefs:
      - QP005
      - QP007
    relatedTableRefs:
      - TP001
      - TP002
  - type: conflicting-data
    severity: minor
    topic: uninstalled-vs-installed-capex
    missingEvidence: >-
      Standardized accounting breakdowns comparing uninstalled stack hardware costs against balance-of-plant and EPC
      civil works across Western and Asian electrolyzer vendors.
    whyItMatters: >-
      Comparing headline equipment pricing from Chinese alkaline vendors against fully installed package pricing from
      Electric Hydrogen obscures true delivered project economics.
    diligencePath: >-
      Request itemized plant capital expenditure schedules from EPC contractors and engineering feasibility studies for
      GW-scale projects.
    relatedQuestionRefs:
      - QP001
      - QP003
    relatedTableRefs:
      - TP002
      - TP003
  - type: private-evidence-only
    severity: material
    topic: recognized-financials
    missingEvidence: >-
      Audited financial statements detailing GAAP recognized revenue, cost of goods sold, gross margin, operating cash
      burn, and cash runway.
    whyItMatters: >-
      As a privately held venture-backed entity, Electric Hydrogen does not publicly file financial disclosures,
      preventing independent underwriting of plant unit gross margins, warranty liabilities, and operational
      self-sufficiency.
    diligencePath: >-
      Obtain historical audited income and cash flow statements, trailing twelve-month management accounts, and internal
      24-month cash projections under mutual non-disclosure agreement.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: contract-terms
    missingEvidence: >-
      Realized purchase contract documentation for 100 MW HYPRPlant deployments, including milestone billing schedules,
      performance guarantees, and cancellation clauses.
    whyItMatters: >-
      Reported commercial traction relies on customer announcements such as Project Roadrunner, but realized contract
      values, payment milestones, and warranty retention terms remain confidential.
    diligencePath: >-
      Review redacted customer master equipment agreements, performance warranty covenants, and EPC interface schedules
      in a virtual data room.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI001
      - TI002
  - type: access-blocked
    severity: minor
    topic: stack-durability-costs
    missingEvidence: >-
      Empirical degradation curves, operational stack lifetime data, and precious metal loading requirements under
      intermittent renewable power operation.
    whyItMatters: >-
      Electrolyzer levelized cost assumptions require validation of stack efficiency decay and iridium catalyst
      degradation under fluctuating power inputs.
    diligencePath: >-
      Request third-party independent engineering reports (such as DNV validation datasets) and accelerated life-testing
      logs from the Devens and San Jose testing facilities.
    relatedQuestionRefs:
      - QI004
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: commercial-plant-commissioning-data
    missingEvidence: >-
      Audited public field operating data and stack degradation logs for the commercial 100 MW HYPRPlant under
      multi-month dynamic operation.
    whyItMatters: >-
      Validating long-term cell voltage stability, membrane degradation rates, and real-world efficiency under
      intermittent renewable power cycling requires operational field data.
    diligencePath: >-
      Request customer commissioning logs, stack lifetime test reports, and third-party warranty verification for the
      Texas and Australian commercial installations.
  - type: missing-source
    severity: material
    topic: supply-chain-single-source-dependency
    missingEvidence: >-
      Component-level bill of materials and supplier contract terms for European power conversion systems and precious
      metal catalysts.
    whyItMatters: >-
      European sourcing of power converters accounts for roughly half of plant value, exposing delivery schedules to
      supply chain bottlenecks and trade tariffs.
    diligencePath: >-
      Review vendor agreements, secondary supplier qualifications, and inventory buffers for power electronics and
      catalyst coated membranes.
  - type: missing-source
    severity: material
    topic: retention-and-operational-metrics
    missingEvidence: >-
      Audited figures on contract duration, customer retention rates, net expansion, and equipment operating uptime
      across deployed commercial units.
    whyItMatters: >-
      Without historical cohort retention or operating uptime metrics, long-term customer economics and recurring
      aftermarket revenue cannot be verified.
    diligencePath: >-
      Review customer service level agreements, aftermarket parts contracts, and operating logs from initial commercial
      deployments during technical diligence.
    relatedQuestionRefs:
      - QU009
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof-and-order-backlog
    missingEvidence: >-
      Comprehensive audit of all executed customer capacity reservations, preferred vendor agreements, and binding
      equipment supply contracts.
    whyItMatters: >-
      Public announcements reflect memorandum of understanding or preferred supplier selections that may not translate
      into binding purchase orders or project FIDs.
    diligencePath: >-
      Inspect Electric Hydrogen's full commercial order book, customer deposit escrow accounts, and binding milestone
      schedules under NDA.
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: regulatory-legal-risk-register
    missingEvidence: >-
      Public verification of local zoning, air quality permits, and environmental impact assessments across
      multi-jurisdictional customer deployment sites.
    whyItMatters: >-
      Large electrolyzer projects face site-specific permitting delays that can extend installation timelines and
      increase development costs.
    diligencePath: >-
      Request site-specific permit registers, environmental impact studies, and local interconnection approvals from
