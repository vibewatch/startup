    relatedQuestionRefs:
      - QR008
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: commercial-commissioning-and-burn
    missingEvidence: >-
      Audited financial statements, gross margin metrics, cash burn rate, and verified multi-megawatt customer site
      commissioning telemetry.
    whyItMatters: >-
      Without audited financial statements and real-world commercial run data, true manufacturing margin structure and
