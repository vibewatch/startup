chapter:
  number: 1
  title: "Company Overview"
  summary: "Electric Hydrogen is a Boston-area industrial electrolyzer manufacturer that has raised over $700 million to deploy standardized 100 MW green hydrogen plants. Founded in 2020 by former First Solar executives and backed by major industrial strategics, the company has scaled manufacturing in Massachusetts and Texas while navigating macroeconomic delays in customer final investment decisions."
sections:
  - id: "identity-and-operating-footprint"
    title: "Corporate Identity and Operating Footprint"
    body: "Electric Hydrogen (EH2) was founded in 2020 with the explicit mission to eliminate fossil-fuel dependence across heavy industry by developing cost-effective, high-capacity green hydrogen generation systems. Unlike developers focused on smaller distributed electrolyzers, Electric Hydrogen designs and manufactures fully integrated 100 MW proton exchange membrane (PEM) electrolyzer plants targeted directly at high-volume industrial off-takers in fertilizer, chemicals, steelmaking, and sustainable aviation fuels. The company is headquartered in Devens, Massachusetts, where it brought an advanced manufacturing gigafactory online to produce its proprietary high-current-density cell stacks. Complementary research, power electronics engineering, and prototype testing take place across facilities in San Jose and San Carlos, California. Electric Hydrogen employs over 300 professionals across North America and key commercial hubs in Europe and Australia, establishing a scaled industrial operating footprint capable of delivering modular multi-megawatt systems."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO011"
    tableRefs:
      - "TO001"
    figureRefs: []
  - id: "founding-and-executive-governance"
    title: "Founding Pedigree and Executive Governance"
    body: "Electric Hydrogen was founded by clean technology veterans David Eaglesham, Raffi Garabedian, and Derek Warnick, drawing heavily on their collective background scaling industrial solar manufacturing from early-stage development to gigawatt volumes. Chief Executive Officer Raffi Garabedian and Chief Technology Officer David Eaglesham both served as CTOs at First Solar, where they oversaw multi-gigawatt manufacturing buildouts and cost reductions that lowered module manufacturing expenses below twenty cents per watt. This manufacturing scaling discipline is central to Electric Hydrogen’s approach, prioritizing large-format standardization over bespoke project engineering. The core executive team is rounded out by Chief Financial Officer Derek Warnick, former company builder at Breakthrough Energy Ventures, Chief Legal Officer Beth Deane, formerly of Leeward Renewable Energy and First Solar, and Senior Vice President Jason Mortimer, who previously directed enterprise commercial sales at SunPower. This executive concentration brings exceptional technical credibility to utility-scale project execution, though key-person dependency on its technical founders remains high."
    claimRefs:
      - "CO001"
      - "CO004"
    tableRefs:
      - "TO002"
    figureRefs: []
  - id: "capitalization-and-investor-syndicate"
    title: "Capital Structure, Valuation, and Investor Syndicate"
    body: "Electric Hydrogen has mobilized more than $700 million in total capital, establishing one of the most robust balance sheets among global electrolyzer manufacturers. In October 2023, the company raised $380 million in Series C equity financing led by Fortescue, Fifth Wall, and Energy Impact Partners, alongside strategic corporate participants including United Airlines Ventures, Microsoft Climate Innovation Fund, BP Ventures, and Rio Tinto, valuing the enterprise at $1.0 billion post-money. Secondary share transactions recorded on private liquidity platforms in May 2025 indicated a Series C-1 valuation of $1.39 billion, although the company has not publicly confirmed post-2023 pricing. In addition to venture equity, Electric Hydrogen secured non-dilutive support comprising $64.6 million in Department of Energy grants and transferable tax credits, as well as a $100 million corporate credit facility closed in May 2024 with a syndicate including HSBC, J.P. Morgan, Stifel, and Hercules Capital. However, detailed cap table allocations, liquidation preference multiples, and operating cash burn remain strictly confidential private company data."
    claimRefs:
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO008"
      - "CO014"
    tableRefs:
      - "TO003"
    figureRefs: []
  - id: "strategic-milestones-and-market-headwinds"
    title: "Commercial Milestones and Macro Headwinds"
    body: "Electric Hydrogen’s commercialization strategy has progressed rapidly from technology prototyping to industrial equipment delivery, highlighted by key partnerships and project developer acquisitions. In March 2025, the company formed an operational manufacturing alliance with Texas-based Titan Production Equipment to assemble modular 100 MW process skids in Columbus, Texas, capitalizing on Gulf Coast oil-and-gas manufacturing infrastructure to lower delivery expenses. To address commercial project finance hurdles, Electric Hydrogen acquired developer Ambient Fuels and established a co-development arrangement with Generate Capital in September 2025. Despite securing preferred vendor selections with prominent off-takers including Infinium, Perdaman, and Synergen Green Energy, the enterprise operates within a broader green hydrogen industry currently confronting a pronounced market slowdown. High capital costs, unresolved clean hydrogen subsidy frameworks, and delayed customer final investment decisions have created commercial bottlenecks, forcing Electric Hydrogen to maintain disciplined cash management while scaling factory throughput."
    claimRefs:
      - "CO009"
      - "CO010"
      - "CO012"
      - "CO013"
    tableRefs: []
    figureRefs:
      - "FO001"
