artifact: valuation
slug: d360-bank
runDate: 2026-10-23
company:
  name: D360 Bank
chapter:
  number: 8
  title: Valuation
  summary: D360 has credible licensing, strategic sponsorship, and reported financing momentum, but public evidence does not disclose audited operating economics or the terms behind the reported post-money valuation. The evidence supports a track/research-more stance rather than a price-insensitive buy.
sections:
  - id: investment-case
    title: Investment case and anti-thesis
    body: >-
      D360's investable case rests on a regulated operating position, a strategic shareholder base,
      and a funding plan aimed at expanding lending and SME coverage. Saudipedia records the
      February 15, 2022 licensing decision and approximately SAR1.65 billion initial capital, while
      the Saudi Press Agency records SAMA permission to begin banking operations in December 2024.
      PIF describes the bank as Sharia-compliant and focused on individuals, entrepreneurs, and
      SMEs. The anti-thesis is that public disclosure remains too thin to connect user growth or
      capital raised to sustainable revenue, credit performance, profitability, or risk-adjusted
      returns. The reported financing valuation therefore remains a market signal, not a verified
      intrinsic value.
    claimRefs: [CV001, CV002, CV003]
    tableRefs: [TV001, TV002]
  - id: valuation-context
    title: Financing and valuation context
    body: >-
      The strongest current valuation datapoint is EnterpriseAM's report that a SAR1.5 billion
      issuance would imply SAR4.5 billion pre-money and SAR6 billion post-money, approximately
      US$1.6 billion, alongside reported customer and deposit figures. That account attributes the
      figures to sources familiar with the matter rather than audited financial statements. A
      separate June 2026 account reports a 38.9% capital increase from SAR2.1 billion to SAR2.91
      billion and approximately SAR1.49 billion of subscription proceeds, with an employee share
      plan still subject to approvals. These are material financing signals, but the pool does not
      contain cap-table preference terms, revenue, net income, net interest margin, capital ratios,
      or a public valuation model. Finro's Q1 2026 dataset offers broad fintech context, not a
      D360-specific comp valuation.
    claimRefs: [CV007, CV008, CV009, CV010, CV011]
    tableRefs: [TV003]
  - id: scenarios-and-decision
    title: Scenario discipline and decision
    body: >-
      A scenario framework is more defensible than a point estimate because the public record
      leaves core bank economics unresolved. The bull case requires the reported capital to convert
      into profitable lending, durable deposits, and controlled credit losses while the bank reaches
      its stated expansion objectives. The base case assumes strategic capital supports continued
      growth but that monetization and risk metrics remain unproven, warranting monitoring rather
      than underwriting at the reported post-money mark. The bear case is a combination of dilution,
      slower SME monetization, funding or margin pressure, and adverse credit or regulatory
      outcomes. The recommendation is track/research-more: a buyer should require audited
      financials, cohort activity, capital and asset-quality metrics, and financing terms before
      accepting the reported valuation as investable.
    claimRefs: [CV012, CV013, CV014, CV015]
  - id: exit-and-diligence
    title: Exit readiness and diligence asks
    body: >-
      Exit optionality is described, not established. EnterpriseAM reports a potential public
      listing in three years, while Arab News reports a goal of four million account holders ahead
      of a potential listing within four years. These aspirational horizons do not constitute a
      verified exit plan. D360's regulated status
      and Saudi digital-payment adoption support a credible market backdrop, but they do not
      establish listing readiness, governance readiness, liquidity, or a realizable return. The
      immediate diligence path is to obtain the latest audited accounts, a bridge from accounts to
      active customers and deposits, credit and capital-adequacy data, the Series A share and
      preference documents, and board-approved projections. Thesis-break triggers should include
      materially weaker asset quality, inability to raise required capital on acceptable terms, or
      failure to demonstrate monetization despite continued user growth.
    claimRefs: [CV016, CV017, CV018, CV019]
    figureRefs: [FV001]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Assessment, Evidence basis, Decision implication]
    rows:
      - [Recommendation, track / research-more, "Reported financing momentum but no audited operating economics in the assigned pool", "Do not underwrite a buy at an unverified price"]
      - [Confidence, medium-low, "Licensing and financing evidence is stronger than profitability and return evidence", "Require primary financial and cap-table diligence"]
      - [Risk rating, high, "Banking, credit, dilution, disclosure, and execution exposures remain material", "Use explicit downside triggers and monitoring"]
      - [Valuation stance, stretched / unverified, "Reported approximately US$1.6B post-money valuation lacks disclosed unit economics", "Seek price discipline or better evidence before entry"]
    notes: "Synthesized from assigned sources; the reported valuation is not an audited mark and unavailable operating metrics are not treated as zero."
    claimRefs: [CV007, CV010, CV011, CV012]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Argument, Supporting evidence, What would change the view, Current implication]
    rows:
      - [Regulated platform, "SAMA permission to start banking operations and 2022 licensing record", "Regulatory restriction, enforcement, or loss of license", "Supports platform credibility"]
      - [Strategic capital and market access, "PIF and Derayah are identified as investors; capital increase reported", "Terms show excessive dilution or capital is insufficient for the plan", "Positive sponsorship, not proof of returns"]
      - [Growth opportunity, "SME lending expansion and digital-payment adoption are reported", "Weak active-user conversion, deposit quality, or credit performance", "Opportunity is plausible but unpriced"]
      - [Valuation risk, "Reported post-money valuation and undisclosed financial metrics", "Audited revenue, margins, losses, and preference terms validate the mark", "Primary reason to defer a buy"]
    notes: "Rows separate platform quality from valuation support; no row implies that strategic backing guarantees commercial performance."
    claimRefs: [CV001, CV002, CV003, CV007, CV009, CV011]
  - id: TV003
    title: Bull / base / bear valuation scenarios
    columns: [Scenario, Explicit assumptions, Valuation / return logic, Probability signal, Key risk or trigger]
    rows:
      - [Bull, "Capital funds scalable SME and consumer lending; monetization and credit quality become transparent", "Reported post-money can be defended only if audited economics support it and later growth creates upside", "Low-to-medium; requires multiple unverified milestones", "Failure to show profitable growth or controlled losses"]
      - [Base, "Strategic capital sustains regulated growth while operating metrics remain incompletely disclosed", "Treat reported approximately US$1.6B post-money as an unverified reference, not a target", "Medium; closest to current public evidence", "Continued disclosure gap and uncertain return path"]
      - [Bear, "Dilution, slower lending adoption, margin pressure, or credit/regulatory setbacks", "Downside cannot be quantified responsibly without accounts, liabilities, and preference terms", "Medium; several triggers are plausible but unmeasured", "Capital need, asset-quality deterioration, or failed commercialization"]
      - [Diligence gate, "Audited accounts, active-user cohorts, capital/asset quality, and financing documents obtained", "Re-rate only after a model can link price to earnings, book, or risk-adjusted cash generation", "Required before buy", "Any missing primary input keeps the stance at track/research-more"]
    notes: "Scenario ranges are intentionally qualitative because the assigned evidence does not disclose a defensible revenue, earnings, book-value, or cash-flow base."
    claimRefs: [CV010, CV011, CV012, CV013, CV014, CV015]
