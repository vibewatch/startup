callouts:
  - calloutType: recommendation
    title: Price-sensitive conclusion
    body: The public record supports continued diligence and monitoring, not a buy at the reported approximately US$1.6 billion post-money valuation without audited economics and financing terms.
    claimRefs: [CV007, CV011, CV012]
  - calloutType: risk
    title: Primary valuation risk
    body: User, deposit, and capital-growth signals can coexist with weak or unproven risk-adjusted returns; the missing bridge is audited profitability, asset quality, and dilution/preference detail.
    claimRefs: [CV009, CV010, CV011, CV015]
