  "chapter": {
    "number": 2,
    "title": "Market Analysis",
    "summary": "Saudi digital-finance adoption has strong policy and payment tailwinds, but the available market estimates measure materially different revenue pools. The evidence supports a growing category while leaving D360-specific SAM, SOM, market share and unit economics unquantified."
  },
  "sections": [
    {
      "id": "market-boundary",
      "title": "Market boundary, adjacencies and substitutes",
      "body": "The investable boundary is narrower than all Saudi fintech activity. D360 is positioned as a Sharia-compliant digital bank serving individuals, entrepreneurs and small-to-medium-sized enterprises, so the core market is digitally delivered deposit, payment, transfer, card, financing and related account services for those groups. Broader fintech pools that include investments, insurtech or technology vendors are context, not a direct D360 revenue denominator. Adjacent products include digital wallets and embedded finance, while incumbent mobile-banking applications, branch relationships and cash remain status-quo substitutes. This boundary prevents software implementation spend or unrelated fintech revenue from being counted as bank opportunity merely because it is digital.",
      "claimRefs": [
        "CM001",
        "CM002",
        "CM007"
      ],
      "tableRefs": [
        "TM001"
      ]
    },
    {
      "id": "sizing-lenses",
      "title": "Sizing lenses, not a synthetic TAM",
      "body": "The retained estimates cannot be averaged or stacked into a defensible TAM/SAM/SOM. PS Market Research estimates the Saudi digital-banking market at USD 108.8 million in 2025 and USD 255.5 million by 2032. Mordor Intelligence measures a broader in-Kingdom fintech service-revenue pool at USD 2.85 billion in 2025, rising to USD 6.08 billion in 2031. Verified Market Research publishes a much larger USD 63.85 billion 2024 fintech value. Mordor itself notes that publisher totals vary with category boundaries and revenue treatment. These are alternative lenses, not corroborating observations; none isolates D360's addressable balances, revenue pool or obtainable share.",
      "claimRefs": [
        "CM004",
        "CM005",
        "CM006",
        "CM007",
        "CM008"
      ],
      "tableRefs": [
        "TM002"
      ],
      "figureRefs": [
        "FM001"
      ]
    },
    {
      "id": "buyer-map",
      "title": "Buyer, user and payer segmentation",
      "body": "D360's stated audience spans three economically distinct groups. In retail, the account holder is generally buyer, user and payer, with convenience, transfers and mobile account access shaping adoption. Entrepreneurs may buy for both personal and business workflows, while an SME's owner or finance lead can choose the institution even when employees use payment or expense functions. The Saudi Times reported an intention to expand SME services, but the retained evidence does not quantify D360's segment mix or SME product economics. Corporate banking is a growing market adjacency in one publisher's forecast, yet it should not be treated as D360's present core without company-specific proof.",
      "claimRefs": [
        "CM002",
        "CM012"
      ],
      "tableRefs": [
        "TM003"
      ]
    },
    {
      "id": "drivers-and-constraints",
      "title": "Adoption drivers, constraints and valuation relevance",
      "body": "The demand backdrop is supportive: one market report cites smartphone penetration above 90% and a 70% non-cash transaction rate reached by 2023, while Mordor reports that electronic payments represented 79% of retail transactions in 2024. A young, highly urban population and continuing digital-data coverage reinforce the potential distribution base. Adoption is not frictionless, however. Open-banking consent, personal-data rules and cybersecurity standards raise the compliance threshold, while implementation, integration and maintenance needs add operating cost. For valuation, these category tailwinds cannot substitute for evidence on D360's active users, deposits, retention, acquisition cost, revenue or margin; those private metrics determine whether market growth converts into economic value.",
      "claimRefs": [
        "CM009",
        "CM010",
        "CM011",
        "CM013",
        "CM014",
        "CM015",
        "CM016"
      ]
    }
  ],
