    title: Customer journey and evidence breakpoints
    type: journey-map
    summary: >-
      Public evidence covers acquisition and selected transaction surfaces, while activation,
      retention, and expansion economics remain unreported.
    data:
      items:
        - label: Discover
          detail: "Integrated media mandate seeks broader reach, credibility, and consideration."
          touchpoints: [Paid media, Brand messaging]
        - label: Open account
          detail: "Aggregate customer counts show reach, but no registration-to-funded conversion is disclosed."
          touchpoints: [Mobile onboarding, Identity verification]
        - label: Bank digitally
          detail: "Residents are the core stated audience for user-friendly digital banking."
          touchpoints: [Mobile app, Everyday account]
        - label: Transfer internationally
          detail: "Thunes partnership supports remittance to Europe, the United States, and the Middle East."
          touchpoints: [Beneficiary setup, Cost disclosure, Arrival confirmation]
        - label: Add credit products
          detail: "Individual and SME lending was reported as a planned expansion in 2025."
          touchpoints: [Credit application, Underwriting]
        - label: Retain and expand
          detail: "No public cohort retention, churn, balances, cross-sell, or concentration metrics were found."
          touchpoints: [Repeat use, Cross-sell, Renewal]
    approximationNotes: >-
      Ordered qualitative journey only; stages do not represent a measured funnel, conversion
      rate, or common customer population.
    claimRefs: [CU002, CU004, CU005, CU008, CU015]
