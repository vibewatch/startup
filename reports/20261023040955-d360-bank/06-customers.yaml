artifact: customers
slug: d360-bank
runDate: 2026-10-23
company:
  name: D360 Bank
chapter:
  number: 6
  title: Customers
  summary: >-
    D360 Bank's public customer case is strongest on top-of-funnel scale: a September 2026
    partner announcement reports more than 3.4 million customers in under eighteen months,
    versus an earlier report of more than 1 million users. The evidence identifies retail
    residents and SMEs as intended segments, but it does not disclose active-user,
    retention, cohort, contract, or customer-concentration metrics, and no named end-customer
    outcome was found in the assigned evidence.
sections:
  - id: customer-segments
    title: Retail scale first, with SMEs as an expansion segment
    body: >-
      Public positioning spans Saudi individuals, entrepreneurs, and small and medium-sized
      enterprises, but the evidence indicates different levels of maturity across those
      segments. PIF's portfolio page describes all three as intended clientele, while a D360
      executive characterized the product as designed for digitally savvy residents and
      SMEs. The clearest deployed use case is consumer-facing digital banking and
      international remittance through the mobile app. By contrast, 2025 reporting described
      full lending for individuals and SMEs as planned rather than proven in production.
      Market context is favorable but not company-specific: Saudi SME facilities reached
      SAR383.2 billion in Q1 2025, and surveyed SME digital-payment acceptance was reported
      at 99%. These figures indicate addressable demand, not D360 penetration or monetization.
    claimRefs: [CU003, CU004, CU005, CU008, CU009, CU012]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Rapid reported acquisition, with denominator ambiguity
    body: >-
      Two public snapshots imply rapid account acquisition. Reporting tied to a June 2025
      funding story put D360 above 1 million users and stated a target of 4 million account
      holders before a potential listing. A September 2026 announcement from D360's newly
      appointed media agency reported more than 3.4 million customers in under eighteen
      months since operations began in 2024. The later figure is fresher, but neither source
      defines whether the count means registered, verified, funded, monthly active, or
      revenue-generating accounts. The snapshots also use different labels, "users,"
      "account holders," and "customers," so they should not be treated as a cohort or
      retention series. The defensible conclusion is strong reported acquisition, not proven
      engagement quality.
    claimRefs: [CU001, CU006, CU007, CU013]
    tableRefs: [TU002]
  - id: customer-proof
    title: Use cases are visible; named customer outcomes are not
    body: >-
      The Thunes relationship provides concrete workflow evidence: D360 app users were
      expected to send funds to beneficiaries in Europe, the United States, and the Middle
      East, with upfront cost transparency and arrival confirmation described by the bank.
      That supports a real remittance proposition but does not disclose transaction volume,
      successful-transfer rates, customer satisfaction, or economic outcomes. The assigned
      evidence contains aggregate account counts and broad segment declarations rather than
      named retail, entrepreneur, or SME references. Even the strongest proof objects are
      therefore cohort-level claims, not customer-verified case studies. A nationally sampled
      financial-inclusion survey can benchmark the wider market, but its household methodology
      cannot establish D360-specific adoption or customer quality.
    claimRefs: [CU004, CU014, CU016]
    tableRefs: [TU003]
    figureRefs: [FU001]
  - id: durability-and-expansion
    title: Acquisition investment is visible, while durability remains unproven
    body: >-
      D360 is investing in further customer acquisition: Initiative's appointment covers an
      integrated media mandate centered on trust, consideration, and growth. Expansion paths
      also include cross-border payments and the previously announced move into individual
      and SME lending. However, the reviewed sources do not disclose net or gross revenue
      retention, churn, renewal behavior, customer tenure, account activity, deposit balances,
      acquisition cost, payback, or revenue concentration. They also do not identify the share
      of acquisition attributable to media, partners, referrals, or organic demand. This
      makes the 3.4 million headline useful as reach evidence but insufficient for underwriting
      durability. Diligence should reconcile registered, funded, active, and paying accounts
      by monthly cohort before assigning value to the reported scale.
    claimRefs: [CU002, CU008, CU015]
callouts:
  - calloutType: risk
    title: Customer count is not a retention metric
    body: >-
      The latest public count lacks an active-account definition, cohort history, balances,
      revenue, and churn; valuation work should not convert it into recurring customer value
      without private operating data.
    claimRefs: [CU001, CU013, CU015]
tables:
  - id: TU001
    title: Customer segmentation and evidence maturity
    columns:
      - Segment
      - Buyer / user / payer
      - Publicly evidenced use case
      - Scale or strategic value
      - Evidence gap
    rows:
      - [Saudi retail residents, "Individual account holder; payer not separately disclosed", "Mobile-first banking and international remittance", "Core acquisition base; aggregate count only", "Active, funded, paying, and balance-bearing account mix"]
      - [Underserved residents, "Individual user; payer not separately disclosed", "Digital financial access and cross-border transfers", "Stated target cohort, not separately quantified", "Eligibility, activation, utilization, and outcome by underserved cohort"]
      - [Entrepreneurs, "Owner-operator or business principal", "General digital banking", "Named by PIF as intended clientele", "No entrepreneur account count, product usage, or outcome evidence"]
      - [SMEs, "Business owner or finance team; business is payer", "B2B payments, remittance, and planned lending", "Large Saudi credit pool and strategic expansion path", "No D360 SME customer count, production lending volume, retention, or revenue"]
    notes: >-
      Segments combine D360/PIF positioning with independent market context; aggregate market
      metrics are not D360 penetration, and null operating metrics remain diligence gaps.
    claimRefs: [CU003, CU004, CU005, CU008, CU009, CU012]
  - id: TU002
    title: Customer growth and adoption trajectory
    columns:
      - Metric
      - Value
      - Period / source context
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - ["Reported D360 users", "More than 1 million", "2025 funding coverage; source publication date not retained for one copy", Medium, "Shows early account acquisition", "Registered versus verified, funded, active, or paying"]
      - ["Target account holders", "4 million", "Forward target reported in 2025 coverage", Low, "Signals acquisition ambition, not achieved adoption", "Target date mechanics, marketing spend, and conversion funnel"]
      - ["Reported D360 customers", "More than 3.4 million", "21 September 2026 partner announcement; under eighteen months since 2024 operations", Medium, "Supports rapid top-of-funnel scale", "Active rate, cohort retention, balances, revenue, and duplicate-account treatment"]
      - ["Saudi SME facilities", "SAR383.2 billion; +31% year on year", "Q1 2025 market context", Medium, "Indicates a large expanding credit pool", "D360 share, eligible borrowers, approvals, losses, and revenue"]
    notes: >-
      Values preserve each source's original metric label and period; "users," "account holders,"
      and "customers" are not assumed to be equivalent or directly comparable.
    claimRefs: [CU001, CU006, CU007, CU009, CU013]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer / cohort
      - Segment
      - Deployment or use case
      - Production versus pilot
      - Reported outcome
      - Limitation
    rows:
      - ["Unnamed aggregate of more than 3.4 million customers", Retail-led aggregate, "Digital banking; source does not disaggregate products", "Operations live; account activity not defined", "Scale reached in under eighteen months", "Partner announcement, no named customer or active-use denominator"]
      - ["Unnamed D360 mobile-app users", "Retail and business remittance users", "Cross-border transfers through Thunes infrastructure", "Partnership described as enabling service; volume not disclosed", "Upfront cost transparency and arrival confirmation claimed", "No customer quote, transaction KPI, or independently measured outcome"]
      - ["Unnamed aggregate of more than 1 million users", "Retail and SME mix not disclosed", "General digital banking", "Bank serving users; segment deployment not separated", "Earlier scale snapshot and 4 million target", "No named reference, cohort reconciliation, retention, or revenue"]
    notes: >-
      Sample is exhaustive only for the strongest customer-proof objects in the assigned pool,
      not for D360's full customer base; no named end-customer case study was available.
    enumerationScope:
      coverage: sample
      basis: >-
        Strongest public customer-proof objects in the assigned prefetched evidence through
        the run date, excluding unsupported logo inference.
    claimRefs: [CU001, CU004, CU006, CU007, CU013, CU014]
figures:
