  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention-and-concentration
      missingEvidence: >-
        Monthly registered, verified, funded, active, paying, retained, and churned accounts by
        acquisition cohort, segment, product, and channel, plus NRR/GRR where applicable.
      whyItMatters: >-
        Without cohort reconciliation, reported customer growth cannot establish durable
        engagement, recurring economics, or acquisition quality.
      diligencePath: >-
        Obtain a management data-room export, reconcile it to core-banking records, and sample
        cohort activity, balances, revenue, churn, and acquisition spend through September 2026.
      relatedQuestionRefs: [QU004, QU005]
    - type: enumeration-incomplete
      severity: material
      topic: named-customer-proof
      missingEvidence: >-
        Named and consented retail, entrepreneur, and SME references with production status,
        tenure, products used, volumes, outcomes, and renewal or repeat-use evidence.
      whyItMatters: >-
        Aggregate counts and partner announcements do not validate production depth, customer
        satisfaction, or measurable outcomes for any identifiable customer.
      diligencePath: >-
        Request at least three references across retail, entrepreneur, and SME cohorts and
        verify usage and outcomes directly with each reference.
      relatedQuestionRefs: [QU003]
      relatedTableRefs: [TU003]
    - type: missing-source
      severity: material
      topic: customer-economics
      missingEvidence: >-
        Segment-level deposits, balances, transaction volume, lending utilization, revenue,
        acquisition cost, payback, cross-sell, and top-customer or top-channel concentration.
      whyItMatters: >-
        Customer scale cannot be translated into economic value or concentration risk without
        monetization and exposure denominators.
      diligencePath: >-
        Reconcile segment and channel KPI packs to audited general-ledger totals and inspect
        concentration, unit economics, and cohort trends by quarter.
      relatedQuestionRefs: [QU005, QU006]
