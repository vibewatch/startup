evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: identity
    missingEvidence: >-
      A primary corporate or regulatory record reconciling the 2020 founded date with the PIF page's 2022 establishment
      date.
    whyItMatters: >-
      The founding and licensing sequence anchors the company's age, operating history, and interpretation of early
      capitalization.
    diligencePath: >-
      Request the certificate of incorporation, SAMA license chronology, and shareholder agreement dates from
      management.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: disclosure
    missingEvidence: >-
      Audited financial statements, prudential ratios, active-customer definitions, and complete board and financing
      terms.
    whyItMatters: >-
      Reported scale and transaction valuation cannot be converted into sustainable economics or governance confidence
      without these denominators.
    diligencePath: >-
      Obtain the latest audited accounts, SAMA prudential returns, customer cohort definitions, cap table, and
      transaction documents under NDA.
    relatedQuestionRefs:
      - QO004
      - QO008
    relatedTableRefs:
      - TO001
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: leadership
    missingEvidence: >-
      Founder identities, a complete current executive roster, board biographies, committee assignments, and succession
      plans.
    whyItMatters: >-
      Incomplete leadership coverage prevents assessment of founder-market fit, functional depth, governance
      independence, and key-person concentration.
    diligencePath: >-
      Request the current organization chart, board register, executive biographies, committee charters, and succession
      plan from management.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: sizing-methodology
    missingEvidence: D360-specific addressable market, active users by segment, balances, revenue and market share.
    whyItMatters: Without company-specific denominator data, published national market estimates cannot support a D360 SAM or SOM.
    diligencePath: Request management’s segment definitions, active-user cohorts, balances, revenue by product and share estimates.
    relatedQuestionRefs:
      - QM008
  - type: conflicting-data
    severity: material
    topic: market-size
    missingEvidence: A reconciled definition and methodology for the digital-banking versus fintech market estimates.
    whyItMatters: The published values differ by orders of magnitude and could materially change valuation framing.
    diligencePath: Obtain report methodologies and reconcile category, currency, geography, revenue basis and forecast period.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: stale
    severity: minor
    topic: digital-adoption
    missingEvidence: Current 2026 official payment, internet and smartphone adoption data.
    whyItMatters: Some retained adoption statistics are 2023 or early-2024 observations and may not describe the refresh date.
    diligencePath: Retrieve current SAMA, CST and official Vision 2030 datasets for 2026.
    relatedQuestionRefs:
      - QM007
  - type: private-evidence-only
    severity: material
    topic: moat-evidence
    missingEvidence: >-
      D360 cohort retention, active-account ratio, customer-acquisition cost, contribution margin, and partner
      exclusivity by product.
    whyItMatters: >-
      Without these measures, reported account or user counts cannot establish repeat usage, profitable distribution, or
      switching costs against STC Bank and specialist alternatives.
    diligencePath: >-
      Request monthly active-account cohorts, product penetration, CAC and payback by channel, contribution margin by
      product, churn, and signed partner-exclusivity schedules.
    relatedQuestionRefs:
      - QP007
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: Comparable public or diligence-room fee schedules and realized pricing for D360 and its main alternatives.
    whyItMatters: >-
      Promotional statements about low fees or free transfers do not show net revenue, spread, discounting, or whether
      price-led acquisition is sustainable.
    diligencePath: >-
      Collect current retail and SME tariff sheets, interchange and FX economics, lending rates, waivers, discounts, and
      realized take rates for each major product.
    relatedQuestionRefs:
      - QP004
      - QP008
    relatedTableRefs:
      - TP003
  - type: enumeration-incomplete
    severity: minor
    topic: competitor-landscape
    missingEvidence: >-
      A complete inventory of Saudi incumbent-bank digital products, payment wallets, and internal-build alternatives
      beyond the prominent standalone players retained here.
    whyItMatters: >-
      The selected set captures prominent direct and adjacent players but cannot establish that no other incumbent or
      status-quo substitute materially affects D360's competitive position.
    diligencePath: >-
      Refresh the landscape against SAMA license records, incumbent tariff and product pages, procurement evidence, and
      app-store usage data.
    relatedQuestionRefs:
      - QP001
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: blocking
    topic: revenue-quality
    missingEvidence: Audited statements with revenue mix, net interest income, fee income, operating expenses, and net income.
    whyItMatters: >-
      Without audited results, revenue quality and profitability cannot be separated from strategic claims or sector
      benchmarks.
    diligencePath: Obtain the latest audited financial statements and management accounts.
    relatedQuestionRefs:
      - QI002
      - QI004
      - QI008
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Current regulatory capital ratios, risk-weighted assets, liquidity, deposits, and funding commitments.
    whyItMatters: A capital increase or funding round is not proof of regulatory headroom, cash availability, or runway.
    diligencePath: Request the latest SAMA capital and liquidity submissions plus a 24-month funding plan.
    relatedQuestionRefs:
      - QI006
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Customer cohorts, CAC, payback, active users, product contribution margins, and credit-loss vintages.
    whyItMatters: Growth into SMEs can destroy value if acquisition, servicing, or losses exceed financing and fee income.
    diligencePath: Request cohort-level economics by product, channel, customer segment, and vintage.
    relatedQuestionRefs:
      - QI002
      - QI003
      - QI004
      - QI008
    relatedTableRefs:
      - TI002
      - TI003
  - type: conflicting-data
    severity: material
    topic: capitalization
    missingEvidence: >-
      Reconciliation of reported capital figures, issuance proceeds, and shareholder funding across dates and legal
      instruments.
    whyItMatters: The reported SAR and USD figures may describe different periods or instruments and cannot be summed safely.
    diligencePath: Reconcile the capitalization table, board approvals, regulatory approvals, and bank-account funding evidence.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
