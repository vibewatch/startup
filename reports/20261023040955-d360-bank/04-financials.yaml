company:
  name: D360 Bank
chapter:
  number: 4
  title: Financials
  summary: D360 has a regulated digital-bank model, substantial shareholder support, and a stated intention to expand SME services, but public evidence does not disclose audited revenue, earnings, margin, credit-quality, or realized unit-economics data. The underwriting conclusion is therefore that capital access and market tailwinds are visible while profitability and capital adequacy remain unproven.
sections:
  - id: revenue-and-monetization
    title: Revenue model and monetization visibility
    body: >-
      D360 describes itself as a Sharia-compliant digital banking institution serving individuals,
      entrepreneurs, and small and medium-sized enterprises. Its public materials support a banking
      operating model rather than a pure software subscription model: the institution is licensed,
      supervised by SAMA, and positioned around user-friendly digital banking services. The available
      evidence does not publish a revenue split between financing income, fees, payments, deposits,
      or other services, and official pricing evidence is not available in the assigned pool. A
      company statement about planned SME expansion is a strategic intention, not evidence of realized
      SME revenue or contribution margin. Consequently, list or account features cannot be converted
      into revenue, ARR, or gross-margin estimates without contracts, financial statements, and
      product-level volumes.
    claimRefs: [CI001, CI002, CI003, CI004, CI005]
    tableRefs: [TI001, TI002]
  - id: capital-and-cost-structure
    title: Capital adequacy, funding dependency, and cost structure
    body: >-
      The capital picture shows meaningful shareholder backing but not cash availability or runway.
      Argaam reports that D360 was capitalized at SAR 1.65 billion and that a Series A was planned
      for the first quarter of 2026. Jawlah reports that shareholders later approved a 38.9%
      capital increase from SAR 2.1 billion to SAR 2.91 billion through new shares, with
      approximately SAR 1.49 billion of contemplated subscription proceeds. D360's current official
      page still states capital of SAR 2.1 billion, so the assigned evidence does not establish
      whether the approved increase completed. These
      accounts are not interchangeable with cash on hand, regulatory capital ratios, or operating
      runway. Public evidence also does not identify staffing, technology, funding, credit-loss,
      servicing, or branch-equivalent costs. The principal financial dependency is therefore the
      ability to fund regulated balance-sheet growth while building an SME lending operation before
      public profitability evidence exists.
    claimRefs: [CI006, CI007, CI008, CI009, CI010]
    tableRefs: [TI003]
  - id: underwriting-verdict
    title: Underwriting verdict and diligence blockers
    body: >-
      Sector evidence is supportive but cannot substitute for D360-specific underwriting. S&P
      coverage summarized by Economy Saudi Arabia expects Saudi bank lending to grow 10% in 2026,
      while also warning that loan-to-deposit ratios may rise beyond 113%, non-performing loans may
      reach 1.6%-1.7%, and profitability may face lower-rate pressure. A separate sector report
      cites Moody's expectations of approximately 8% credit growth and 1.3% NPLs. Those are
      system-level benchmarks, not D360 outcomes. The banking opportunity is also structurally
      relevant: the Saudi SME financing share was reported at just over 9% of total loans in 2024,
      while D360 has said it wants to expand SME services. Yet no assigned source establishes D360's
      CAC, payback, active-to-registered ratio, net interest margin, loss rate, deposit mix, or
      capital-adequacy ratio. The financial verdict is track/research-more: capital support and
      demand are credible, but revenue quality, margin path, and balance-sheet risk cannot yet be
      underwritten with conviction.
    claimRefs: [CI011, CI012, CI013, CI014, CI015]
    figureRefs: [FI001]
tables:
