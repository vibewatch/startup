          value: "Capital support reported; cash balance unavailable"
        - id: financing-and-payments
          label: "Financing and payment activity"
          value: "SME expansion planned; volumes unavailable"
        - id: revenue
          label: "Revenue"
          value: "Not disclosed"
        - id: gross-profit
          label: "Gross profit"
          value: "Not disclosed"
      edges:
        - [customer-accounts, digital-services]
        - [digital-services, deposits-and-funding]
        - [deposits-and-funding, financing-and-payments]
        - [financing-and-payments, revenue]
        - [revenue, gross-profit]
    approximationNotes: "This is an evidence-backed operating-model map, not a quantitative bridge; unavailable values are not estimated."
    claimRefs: [CI001, CI002, CI003, CI004, CI005]
callouts:
  - calloutType: strength
    title: Shareholder and sector support
    body: "PIF and Derayah backing, reported capital initiatives, and Saudi digital-banking demand provide a credible platform for expansion, especially into SMEs."
    claimRefs: [CI006, CI007, CI011, CI012]
  - calloutType: risk
    title: Underwriting data gap
    body: "No assigned evidence establishes D360 revenue, margin, loss experience, capital adequacy, deposit concentration, or cash runway; funding raised must not be treated as cash available."
    claimRefs: [CI008, CI009, CI010, CI014, CI015]
  - calloutType: recommendation
    title: Financial diligence priority
    body: "Require audited statements, regulatory capital and credit-quality schedules, cohort economics, and a funding plan before underwriting valuation or profitability."
    claimRefs: [CI013, CI014, CI015]
