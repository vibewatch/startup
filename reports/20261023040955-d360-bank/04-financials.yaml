    title: Revenue model bridge
    type: flow
    summary: "Public evidence supports a regulated digital-bank operating model, but the conversion from customers and lending activity to revenue and gross profit remains unquantified."
    data:
      nodes:
        - id: customer-accounts
          label: "Individuals, entrepreneurs, and SMEs"
          value: "Customer segments disclosed; active mix unavailable"
        - id: digital-services
          label: "Digital banking services"
          value: "Services described; revenue not disclosed"
        - id: deposits-and-funding
