      - [Retail banking, "Digital accounts and banking services", "No public revenue or volume disclosed", "Unverified", "Obtain audited segment revenue and active-account volumes"]
      - [SME banking, "Planned expansion of services to SMEs", "Strategic intent reported; realized revenue not disclosed", "Company-claimed", "Obtain SME balances, yields, fees, losses, and cohorts"]
      - [Financing income, "Sharia-compliant banking and future lending", "No D360 net financing income or margin disclosed", "Unavailable", "Obtain product-level yield, funding cost, and NIM bridge"]
      - [Payments and fees, "Potential bank fee lines; peer evidence only", "No D360 fee revenue disclosed", "Unavailable", "Obtain fee schedule, realized take rates, and transaction volumes"]
    notes: "D360-specific revenue streams are described qualitatively; no assigned source provides audited revenue, revenue mix, realized pricing, or margin."
    claimRefs: [CI001, CI002, CI003, CI004, CI005]
  - id: TI002
    title: Pricing and monetization evidence
    columns: [Metric, Public evidence, Value, Confidence, Diligence ask]
    rows:
      - [Account pricing, "Official about page and footer", null, "Unavailable", "Provide current tariff and fee schedule"]
      - [SME lending price, "SME expansion reported by Argaam", null, "Unavailable", "Provide approved pricing bands and realized yield"]
      - [List versus realized pricing, "No customer contracts or pricing page in assigned evidence", null, "Unavailable", "Reconcile list prices, waivers, discounts, and net revenue"]
      - [Payments take rate, "No D360 transaction economics disclosed", null, "Unavailable", "Provide volume, fee, interchange, and partner-share data"]
    notes: "Null values mean the assigned successful sources did not disclose a measurable D360 price or realized monetization value; they are not zero."
    claimRefs: [CI002, CI003, CI005]
  - id: TI003
    title: Unit economics and capital adequacy
    columns: [Metric, Value, Confidence, Why it matters, Diligence ask]
    rows:
      - [CAC and payback, null, "Unavailable", "Determines whether customer growth consumes or creates capital", "Provide cohort CAC, payback, and channel economics"]
      - [Gross margin or contribution margin, null, "Unavailable", "Separates scale from profitable scale", "Provide product-level income statement and servicing costs"]
      - [Net interest margin, null, "Unavailable", "Core driver of bank revenue quality", "Provide asset yield, funding cost, and hedge assumptions"]
      - [Non-performing financing ratio, null, "Unavailable", "Measures credit-loss risk as lending expands", "Provide vintage-level delinquency, NPF, and provisioning data"]
      - [Capital adequacy ratio, null, "Unavailable", "Tests regulatory headroom for balance-sheet growth", "Provide latest SAMA capital ratios and risk-weighted assets"]
      - [Cash runway, null, "Unavailable", "Tests financing dependency before profitability", "Provide cash, liquid assets, burn, commitments, and next-round trigger"]
    notes: "The unit-economics fields are intentionally null because the assigned sources do not disclose D360-specific values; each null has a targeted diligence request."
    claimRefs: [CI006, CI007, CI008, CI009, CI010, CI014, CI015]
