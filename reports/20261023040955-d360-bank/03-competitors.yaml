      - [D360 Bank, Direct licensed digital bank, "More than 1 million customers reported; 4 million target described", "Individuals, entrepreneurs, and SMEs", "Sharia-compliant full-bank scope, mobile onboarding, cards, transfers, lending ambition", "Retention, pricing, and unit economics are not publicly disclosed"]
      - [Barq, Payment-led neobank, "More than 10 million users and SAR 73 billion transaction volume reported", "Consumers, travelers, and remittance users", "Cross-border transfers, cards, rewards, and travel benefits", "Not described as a licensed digital bank; user activity and economics may differ from D360"]
      - [Hala, SME-focused neobank, "More than 150,000 customers and over US$8 billion annual transactions reported", "MSMEs, freelancers, and business owners", "Embedded finance, POS, payroll, expense control, and data-linked financing", "Narrower SME workflow focus than a consumer full bank"]
      - [Vision Bank, Newly licensed digital bank, "More than 50,000 Google Play downloads reported; formal user metrics not disclosed", "Consumers and SMEs", "Savings, family banking, deposits, and digital assistant", "Recent entrant with limited public scale and operating history"]
      - [Meem / NEO, Incumbent-bank digital arms, "Not quantified in retained competitor evidence", "Existing retail and business banking customers", "Potentially combine digital interfaces with incumbent banking relationships", "Retained source names but explicitly excludes these arms from its standalone-player review"]
      - [Existing bank / internal workflow, Status quo and internal substitute, "Not quantified in retained competitor evidence", "Consumers and SMEs not actively switching providers", "Avoids migration effort and can preserve existing operating routines", "No comparable scale, cost, or satisfaction evidence in the assigned source pool"]
    notes: "Coverage is a sourced sample of prominent Saudi standalone digital-bank and neobank alternatives described by Fintech News UAE and regulator/news sources; reported user and transaction figures are not harmonized for date, activity, or definition."
    enumerationScope:
      coverage: partial
      basis: "Prominent Saudi standalone digital banks and neobanks described in the assigned 2026 competitor coverage, excluding traditional-bank digital arms."
    claimRefs: [CP001, CP002, CP003, CP004, CP005, CP006]
  - id: TP002
    title: Feature and capability matrix
    columns: [Buying criterion, D360 Bank, STC Bank, Barq, Hala, Vision Bank]
    rows:
      - [Licensed digital-bank scope, "Yes; SAMA approval in December 2024", "Yes; full launch approved after beta", "No full-bank license stated in source", "No full-bank license stated in source", "Yes; SAMA non-objection in September 2025"]
      - [Consumer accounts and payments, "Accounts, bill pay, cards, local and international transfers", "Accounts, transfers, bills, cards, savings, and financing", "Digital account, cards, P2P transfers, and cross-border transfers", "Business accounts, payment acceptance, and transfers", "Current accounts, deposits, transfers, and payments"]
      - [SME or business proposition, "Business accounts and planned lending expansion to SMEs", "Business banking described; scope and economics not quantified", "Business scope not established by retained sources", "Core focus on MSMEs, freelancers, and business owners", "Dedicated SME banking solutions reported"]
      - [Distribution advantage, "Waitlist demand and more than 1 million users reported", "STC Pay conversion and telecom distribution", "Large user and transaction claims reported", "SME workflow and merchant/POS distribution", "New entrant; downloads used only as an interest proxy"]
      - [Trust and regulatory posture, "SAMA-supervised licensed bank; Sharia-compliant positioning", "SAMA-approved licensed bank; former STC Pay", "E-wallet license reported, not equivalent to a bank license", "Embedded-finance platform; bank-equivalent prudential status not established", "SAMA non-objection; capital, liquidity, governance, cybersecurity and data rules apply"]
    notes: "Cells summarize only retained source evidence; unsupported feature, pricing, and integration comparisons are intentionally not filled. Regulatory approval dates are historical milestones, not current performance measures."
    claimRefs: [CP007, CP008, CP009, CP010, CP011, CP012, CP014]
  - id: TP003
    title: Pricing and packaging comparison
    columns: [Provider, Price or fee evidence, Packaging model, Discount or unknowns, Competitive implication]
    rows:
      - [D360 Bank, "Competitive exchange rates, no-cost local transfers, and low fees described in launch coverage", "Consumer and SME digital bank with cards, transfers, savings, lending ambition, and BaaS", "Realized prices, spreads, discounts, and lending rates unknown", "Promotional price language may aid acquisition but does not prove durable advantage"]
      - [STC Bank, "No comparable price schedule in retained sources", "Wallet-to-bank migration plus personal and business banking", "List and realized pricing unknown", "Distribution can lower acquisition friction even without a disclosed price edge"]
      - [Barq, "No annual or international fees reported; travel benefits and rewards described", "Consumer payment account, cards, cross-border transfers, marketplace and rewards", "Eligibility, unit economics, and realized cost unknown", "Strong use-case packaging can substitute for a full bank in travel and payments"]
      - [Hala, "No comparable list price in retained sources", "Embedded SME finance, payments, POS, payroll, expenses, and financing", "Contract pricing, take rate, and financing terms unknown", "Workflow depth may support retention in a narrow segment"]
    notes: "The table distinguishes promotional or feature language from realized pricing. No retained source provides a like-for-like fee schedule across providers, so unknowns are decision-relevant gaps rather than zero prices."
    claimRefs: [CP013, CP014, CP015, CP016]
figures:
  - id: FP001
    title: Competitive positioning by breadth and distribution
    type: quadrant
    summary: D360 sits in the broad licensed-bank cluster, while STC Bank has the clearest distribution scale and adjacent providers occupy narrower but potentially sticky use cases.
    data:
      xAxis: "Breadth of licensed banking and financial capabilities (ordinal 1-5)"
      yAxis: "Observed distribution or usage scale (ordinal 1-5)"
      points:
        - {label: "D360 Bank", x: 4, y: 3, detail: "Licensed full-bank scope and more than 1 million users reported; retention and active usage unknown"}
        - {label: "STC Bank", x: 4, y: 5, detail: "Broad bank offering plus telecom-derived migration; over 3 million customers reported"}
        - {label: "Barq", x: 2, y: 5, detail: "Payment-led proposition with more than 10 million users reported; not described as a full digital bank"}
        - {label: "Hala", x: 3, y: 2, detail: "Deep SME embedded-finance workflow; more than 150,000 customers reported"}
        - {label: "Vision Bank", x: 4, y: 1, detail: "Licensed digital-bank proposition; formal user metrics undisclosed and over 50,000 downloads reported"}
        - {label: "D360 BaaS", x: 3, y: 1, detail: "Third-party branded financial infrastructure is reported, but no public distribution or adoption metric is disclosed"}
    approximationNotes: "Ordinal scores are analyst judgments anchored to disclosed licensing, product breadth, and reported customer, migration, transaction, download, or adoption signals. A score of 1 can mean that distribution is undisclosed; scores are not market-share measurements or proportional distances."
    claimRefs: [CP002, CP003, CP004, CP005, CP009, CP010]
callouts:
  - calloutType: insight
    title: Distribution is the immediate battleground
    body: "STC Bank's reported migration from a telecom wallet gives it a distribution advantage that D360's broad product scope does not automatically neutralize."
    claimRefs: [CP007, CP008]
  - calloutType: risk
    title: A provisional moat
    body: "The retained evidence does not disclose D360 retention, realized pricing, acquisition cost, or lending economics, while new licensed and adjacent providers continue to add credible substitutes."
    claimRefs: [CP013, CP016]
