company:
  name: D360 Bank
chapter:
  number: 1
  title: Company Overview
  summary: D360 Bank is a Riyadh-based, privately held Saudi digital bank with a Sharia-compliant mobile-first proposition, PIF and Derayah backing, and a June 2026 capital increase that implies a SAR 6 billion post-money valuation. Public evidence supports rapid customer and capital growth, but audited operating economics, governance depth, and detailed financing terms remain incomplete.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: >-
      D360 Bank is described by the Public Investment Fund as a Saudi digital
      banking institution that adheres to Sharia principles, with investors
      including PIF and Derayah Financial. The available company profile places
      the bank in Riyadh, founded in 2020, and serving Saudi Arabia through a
      mobile-first platform rather than a conventional branch network. Its
      stated product scope spans current and savings accounts, cards, domestic
      and international transfers, bill payments, personal-finance tools, and
      digitally delivered services for entrepreneurs and small businesses. The
      PIF account says the bank was established in 2022, which conflicts with
      the profile's 2020 founding date and should not be silently reconciled.
      The evidence therefore supports a Saudi digital-bank identity and
      operating model, while the exact corporate founding event and date remain
      a diligence item.
    claimRefs: [CO001, CO002, CO003, CO004, CO005]
    tableRefs: [TO001]
  - id: leadership-capital-and-governance
    title: Leadership, capital, and governance
    body: >-
      Public materials identify Taha Abdullah Al-Kuwaiz as chairman and Eze
      Szafir as chief executive in the bank's customer milestone announcement.
      They also identify Derayah Financial and PIF-linked shareholders as core
      backers, with the PIF portfolio page describing local and international
      expertise but not providing a complete board or executive roster. The
      June 2026 capital increase is the clearest current financing evidence:
      72,916,667 new ordinary shares at SAR 20.57 generated approximately SAR
      1.5 billion, with an additional 8,750,000 ESOP shares subject to
      regulatory approvals. Maaal reports a fully diluted pre-money valuation
      of SAR 4.5 billion and an implied post-money valuation of SAR 6 billion;
      Derayah planned SAR 100 million and its stake was expected to fall from
      20.4% to 16.35%. These are transaction-implied values, not audited
      revenue or earnings multiples.
    claimRefs: [CO006, CO007, CO008, CO009, CO010, CO011]
    tableRefs: [TO002, TO003]
  - id: scale-milestones-and-gaps
    title: Scale milestones and evidence gaps
    body: >-
      The strongest public scale signal is the bank's announcement that it
      exceeded one million customers within four months of official launch and
      processed more than 51 million transactions across over 100 countries,
      with transaction volume above SAR 50 billion. Later June 2026 reporting
      cites three million customers and SAR 3 billion in deposits as of April
      2026, but that figure is attributed to a bourse disclosure report and
      sources familiar with the matter rather than audited bank financial
      statements. The June capital raise is intended to support lending,
      consumer finance, SME lending, and API banking. Arab News also reported
      that former JPMorgan banker Mohammed Nazer was appointed chief financial
      officer to lead the planned Series A process. No retained source provides
      audited revenue, net income, net interest margin, capital adequacy,
      non-performing financing, current headcount, active-user methodology, or
      complete governance disclosures. The appropriate underwriting stance is
      therefore growth-positive but evidence-constrained.
    claimRefs: [CO012, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
