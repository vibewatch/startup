artifact: product-tech
slug: d360-bank
runDate: 2026-10-23
company:
  name: D360 Bank
chapter:
  number: 5
  title: Product & Technology
  summary: D360 Bank is a Saudi, Sharia-compliant digital bank built around an app-led account and financing experience, with SAMA authorization and a stated ambition to serve individuals, entrepreneurs, and SMEs. Public evidence verifies the operating model at a high level, but gives limited visibility into core banking architecture, reliability controls, integrations, and measurable customer outcomes.
sections:
  - id: customer-product
    title: Customer product and operating model
    body: >-
      D360 Bank delivers banking through a mobile-first product rather than a branch-led workflow. The available evidence describes digital bank accounts, personal financing, savings and domestic or international transfers, while the company app description reproduced by Sensor Tower claims account opening in less than two minutes and promotes avoiding branch visits. This is a concrete customer workflow: onboarding, account control, and routine payments are brought into the app, with Sharia compliance presented as a product requirement rather than an optional feature. The service is intended for individuals, entrepreneurs, and small and medium-sized enterprises, although the public materials do not show separate product-line service levels, eligibility rules, or customer-support performance. Sensor Tower identifies the iOS app as a free Finance-category application with Arabic and English support; its public page reports an 18 October 2026 update, but its engagement metrics are gated. The product therefore appears operational and recently updated, while the public record is insufficient to underwrite reliability, retention, or unit-level usage.
    claimRefs: [CE001, CE002, CE003, CE004, CE006, CE008, CE013]
    tableRefs: [TE001, TE002]
  - id: architecture-and-maturity
    title: Architecture, dependencies, and maturity
    body: >-
      The public architecture is best understood as an app-led banking operating model with regulated-bank infrastructure behind it, not as a disclosed software stack. SAMA's no-objection to commence operations establishes regulatory permission to operate, while PIF's portfolio description points to data-driven strategies, digital innovation, and secure, user-friendly services. Those descriptions do not disclose the core banking vendor, cloud topology, API surface, identity stack, fraud controls, service-level objectives, disaster recovery design, or integration dependencies. The iOS update dated 18 October 2026 is a useful maintenance signal, but one release record does not prove production resilience. Saudi Arabia's broader fintech ecosystem includes a regulator-backed Open Banking Lab, and the World Bank identifies the digital economy and SME strategy within its Saudi advisory coverage; neither point proves that D360 has completed its own integrations or controls. A diligence review should treat the product as live but technically opaque, with the most important unknowns concentrated in platform resilience, security assurance, and operational scaling.
    claimRefs: [CE005, CE006, CE007, CE008, CE011, CE014, CE016]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: differentiation-and-risks
    title: Differentiation, trust, and technical risk
    body: >-
      D360's defensible product attributes in the public record are its Saudi banking authorization, Sharia-compliant positioning, local strategic backing, and app-based access. Regulatory permission and the stated financial-inclusion objective are meaningful trust and permissioning assets, but they do not substitute for evidence of security certifications, privacy governance, incident history, uptime, or customer-service quality. PIF describes active ownership and risk governance across its portfolio, but the assigned evidence does not show how those practices operate at D360. The bank also faces a competitive digital-banking market: Arab News reported three licensed digital banks in Saudi Arabia, including D360, STC Bank, and Vision Bank. That context makes execution quality and differentiated customer economics important, yet the assigned evidence provides no verified performance benchmark. No source in this pool establishes a breach, outage, or product failure; that evidence boundary is not proof that none occurred. The central underwriting risk is therefore limited transparency around controls and operating outcomes, not a demonstrated technical incident.
    claimRefs: [CE005, CE008, CE009, CE010, CE012, CE015]
    callouts: []
tables:
  - id: TE001
    title: Product module / asset matrix
    columns: [Module or asset, User, Status or maturity, Differentiation, Diligence gap]
    rows:
      - ["Digital bank account", "Individuals", "Live mobile product", "Saudi digital-bank access with Sharia-compliant positioning", "Verify onboarding completion, KYC exceptions, and account activation funnel"]
      - ["Personal financing", "Individuals", "Listed product", "Financing within a regulated digital-bank proposition", "Obtain underwriting policy, approval rates, and servicing outcomes"]
      - ["Savings accounts", "Individuals", "Listed product", "App-led savings access", "Confirm product terms, balances, and realized customer usage"]
      - ["Domestic and international transfers", "Individuals and SMEs", "Listed product", "Digital transfer workflow", "Verify rails, limits, failure rates, and reconciliation controls"]
      - ["Banking as a Service", "Entrepreneurs and SMEs", "Listed by public profile", "Potential platform extension beyond retail banking", "Confirm live customers, APIs, SLAs, and revenue model"]
    notes: Public sources establish the listed products and target users, but not separate production adoption or performance for each module; listed status is not equivalent to independently verified commercial scale.
    claimRefs: [CE001, CE002, CE003]
  - id: TE002
    title: Workflow / use-case table
    columns: [User job, Current workflow, Company solution, Measurable benefit, Limitation]
    rows:
      - ["Open a bank account", "Branch or conventional onboarding", "App-based opening described as taking less than two minutes", "Faster access is company/app copy rather than a measured cohort result", "Completion and abandonment rates are undisclosed"]
      - ["Manage day-to-day finances", "Branch and fragmented digital channels", "Control finances through the D360 app", "Centralized mobile access", "DAU, retention, and support outcomes are gated or undisclosed"]
      - ["Send money domestically or internationally", "Separate transfer workflows", "Digital transfer products are listed", "Convenience and reach are the intended benefit", "Rail coverage, limits, and exception rates are not public"]
      - ["Access personal financing", "Conventional bank application process", "Personal financing is listed as a bank product", "Digital application may reduce friction", "Approval, pricing, credit losses, and servicing data are unavailable"]
      - ["Serve an SME financial need", "Traditional bank relationship", "Public profiles state a focus on entrepreneurs and SMEs", "Broader inclusion is the stated objective", "Live SME deployments and outcomes are not evidenced"]
    notes: The table separates stated workflow benefits from unreported outcome metrics; null performance fields require direct company or regulator evidence.
    claimRefs: [CE001, CE002, CE003, CE004, CE010, CE013]
  - id: TE003
    title: Technology / operating architecture table
    columns: [Layer or process, Role, Dependency, Risk or diligence ask]
    rows:
      - ["Regulated banking entity", "Hold license and deliver banking services", "SAMA supervision and Saudi banking law", "Obtain license scope, governance controls, and supervisory findings"]
      - ["Mobile application", "Customer onboarding and account interaction", "iOS distribution and supported Arabic/English client software", "Validate release controls, crash rates, and mobile security testing"]
      - ["Digital identity and onboarding", "Account opening and KYC workflow", "Customer identity and compliance systems", "Request KYC exception rates, fraud controls, and manual-review volumes"]
      - ["Payments and transfers", "Domestic and international movement of funds", "Banking rails and reconciliation processes", "Test failure handling, settlement controls, and transaction limits"]
      - ["Financing and savings products", "Product delivery and balance-sheet activity", "Credit, pricing, and servicing processes", "Request underwriting, provisioning, and customer-outcome evidence"]
    notes: This is an evidence-bounded operating architecture, not a claim about undisclosed vendors or cloud components; every unverified dependency should be tested through technical and regulatory diligence.
    claimRefs: [CE005, CE006, CE007, CE008, CE011, CE016]
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: D360's public product architecture runs from regulated banking permission through mobile delivery to customer financial workflows; undisclosed control layers remain the principal diligence gap.
    data:
      layers:
        - id: regulated-foundation
          label: Regulated foundation
          detail: SAMA-supervised digital bank; no-objection to commence operations is publicly reported.
        - id: customer-platform
          label: Customer platform
          detail: Mobile banking application; the iOS listing supports Arabic and English and reports an October 2026 update.
        - id: identity-and-controls
          label: Identity and controls
          detail: Onboarding, KYC, fraud, and privacy controls are required but not publicly specified in the assigned evidence.
        - id: financial-products
          label: Financial products
          detail: Accounts, financing, savings, and transfers are listed in public profiles.
        - id: customer-workflows
          label: Customer workflows
          detail: Public investor and company descriptions identify individuals, entrepreneurs, and SMEs as intended customer groups.
        - id: operating-proof
          label: Operating proof
          detail: Uptime, incidents, retention, and service outcomes remain unverified.
    claimRefs: [CE001, CE005, CE006, CE007, CE008, CE012, CE016]
callouts:
  - calloutType: strength
    title: Live regulated product with local fit
    body: D360 combines a Saudi digital-bank authorization, Sharia-compliant positioning, and an actively maintained bilingual mobile application.
    claimRefs: [CE001, CE005, CE006]
  - calloutType: risk
    title: Technical transparency is the bottleneck
    body: The assigned public evidence does not disclose the core stack, control effectiveness, uptime, incident history, or measurable product outcomes.
    claimRefs: [CE007, CE008, CE012]
  - calloutType: recommendation
    title: Require control and performance evidence
    body: Before underwriting product maturity, request architecture diagrams, security assurance, resilience testing, incident registers, and module-level adoption and service metrics.
    claimRefs: [CE007, CE008, CE012]
