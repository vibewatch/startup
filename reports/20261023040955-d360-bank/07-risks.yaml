company:
  name: D360 Bank
chapter:
  number: 7
  title: Risks
  summary: D360 Bank's principal risks are regulatory execution, cyber and operational resilience, funding and margin pressure, and dependence on continued capital support. Public evidence shows a maturing Saudi framework and a sizeable capital base, but does not disclose bank-specific capital adequacy, loss, incident, or concentration metrics.
sections:
  - id: risk-ranking
    title: Ranked risk posture
    body: "D360's highest-consequence exposure is the combination of regulated-bank execution and limited public operating disclosure. SAMA's open-banking framework standardizes payment-initiation responsibilities and secure service delivery, while the 2026 licensing transition described by Clyde & Co adds expectations around API performance, data security, consent management, governance, cybersecurity, risk management, and operational resilience. These are not evidence of a D360 breach or failure; they define the control surface on which execution can fail. A second material risk is funding economics: Fitch reported that Saudi-sector funding competition increased, cost of funding rose 30 basis points to 3.5% in 3Q25, and sector net interest margin compressed about 20 basis points in 9M25. D360's SAR 1.5 billion capital increase strengthens loss-absorption capacity, but the public record does not disclose its capital-adequacy ratio, non-performing-financing ratio, deposit concentration, or cash-burn equivalent."
    claimRefs: [CR001, CR002, CR003, CR004]
    tableRefs: [TR001]
    figureRefs: [FR001]
  - id: regulatory-operational
    title: Regulatory, legal, and operational exposure
    body: "The regulatory risk is not that licensing is absent: Hala Capital describes D360 as licensed by the Saudi Central Bank, and SAMA's second Open Banking Framework release covers Payment Initiation Services and clarifies stakeholder responsibilities. The risk is continuing compliance as the ecosystem moves from framework guidance toward formal supervision. Clyde & Co reports that firms entering the new open-banking licensing regime must demonstrate governance, risk management, cybersecurity, operational resilience, API interoperability, data management, and customer-protection controls. Ghazzawi & Partners further identifies consent, Personal Data Protection Law obligations, licensing of third-party providers, liability allocation, dispute resolution, breach response, audits, penetration tests, and third-party risk assessments as legal and implementation considerations. ICLG reports that the PDPL applies to local and foreign companies handling residents' data and describes fines, suspension, and possible criminal liability for non-compliance. No retained source confirms a D360-specific enforcement action, outage, breach, lawsuit, or failed deployment; those remain diligence gaps rather than negative findings."
    claimRefs: [CR005, CR006, CR007, CR008, CR015, CR016]
    tableRefs: [TR002]
  - id: dependencies-and-financial-model
    title: Dependency and financial-model risks
    body: "D360's capital and shareholder structure are strategic strengths but also create dependency questions. The Sharikat Mubasher report, citing a Derayah Financial disclosure, says shareholders approved a SAR 1.5 billion increase through 72.9 million new shares at SAR 20.57 per share, valuing the bank at SAR 4.5 billion before the increase and SAR 6 billion on completion. PIF identifies itself and Derayah Financial among the investors, while describing D360's target users as individuals, entrepreneurs, and small-to-medium-sized enterprises. This supports a capital-provider and execution-dependency risk register, not a conclusion that support will continue indefinitely. Fitch's sector data shows rising funding competition, a loans/deposits ratio of 108% at end-3Q25, and expected margin pressure into 2026. D360-specific deposits, loan mix, impairments, liquidity, profitability, customer concentration, and partner concentration are not disclosed in the retained evidence and should be obtained before underwriting."
    claimRefs: [CR009, CR010, CR011, CR012]
    tableRefs: [TR003]
  - id: monitoring-and-kill-criteria
    title: Monitoring, mitigations, and thesis-break triggers
    body: "The practical mitigation is evidence-led monitoring rather than assuming that a license or capital raise eliminates risk. Management should provide current capital and liquidity ratios, asset-quality and loss metrics, deposit and customer concentration, incident history, service-level performance, and open-banking control attestations. The monitoring set should also track SAMA releases and licensing requirements, consent and data-protection incidents, material outages, funding costs, net interest margin, and the timing and terms of additional capital. A thesis break would be a confirmed material regulatory action, a repeated customer-data or payment-control failure, a material outage without effective remediation, deterioration in capital or asset quality, or inability to raise/retain funding on acceptable terms. These triggers are proposed diligence criteria, not observed events in the retained sources."
    claimRefs: [CR013, CR014]
    evidenceGaps:
      - type: missing-source
        severity: material
        topic: bank-specific risk metrics
        missingEvidence: Current D360 capital adequacy, liquidity, non-performing-financing, deposit-concentration, loss, and profitability metrics.
        whyItMatters: Without bank-specific prudential and earnings data, sector benchmarks cannot establish D360's residual financial risk.
        diligencePath: Obtain current management accounts, SAMA reporting extracts, capital ratios, liquidity ratios, asset-quality schedules, and audited financial statements under NDA.
      - type: missing-source
        severity: material
        topic: incidents-and-controls
        missingEvidence: D360-specific record of outages, cyber incidents, privacy events, enforcement, complaints, and open-banking control attestations.
        whyItMatters: Public framework requirements describe expected controls but do not prove D360's implementation or operating history.
        diligencePath: Request an incident register, remediation logs, penetration-test summaries, SOC or equivalent assurance, complaint data, and regulator correspondence.
      - type: missing-source
        severity: material
        topic: funding-and-concentration
        missingEvidence: Deposit, customer, shareholder, supplier, and platform concentration plus capital-raise terms.
        whyItMatters: Concentration can amplify liquidity, governance, execution, and refinancing risk even when headline capital increases are large.
        diligencePath: Review the cap table, financing documents, deposit and loan concentration schedules, material contracts, and contingency funding plan.
tables:
  - id: TR001
    title: Operational / quality / security risk register
    columns: [Failure mode, Likelihood, Impact, Mitigation maturity, Residual exposure, Investment implication]
    rows:
      - ["Regulatory and open-banking compliance execution", Medium, High, "Framework requirements are documented; D360-specific control evidence is not public", "High until control attestations and regulator correspondence are reviewed", "Delay conviction until current compliance evidence is obtained"]
      - ["Cybersecurity, privacy, and payment-control failure", Medium, High, "SAMA framework and legal guidance define security, consent, and incident expectations", "High because no D360-specific incident or test record is retained", "Require independent control and incident evidence"]
      - ["Funding-cost and margin compression", Medium, High, "Capital increase strengthens the capital base; sector funding conditions remain pressured", "Medium-high because D360 margins and liquidity are undisclosed", "Stress-test funding and margin before underwriting"]
      - ["Asset-quality and loss exposure", Unknown, High, "Sector asset quality was strong in Fitch's benchmark, but D360 data are unavailable", "High due to missing bank-specific loss and NPF metrics", "Do not infer D360 credit performance from sector averages"]
    notes: "Likelihood and residual exposure are analytical judgments anchored to the cited regulatory and sector evidence; unknown D360 metrics remain explicitly unresolved."
    claimRefs: [CR001, CR003, CR007, CR011]
  - id: TR002
    title: Regulatory / legal risk register
    columns: [Rule or failure mode, Jurisdiction, Status, Severity, Mitigation, Residual exposure, Diligence path]
    rows:
      - ["Open-banking PIS and stakeholder responsibilities", Saudi Arabia, "SAMA second release issued 2024-09-02", High, "Follow framework releases and verify implementation", "Medium-high", "Obtain D360 PIS control map and SAMA compliance evidence"]
      - ["Open-banking licensing and operational-resilience requirements", Saudi Arabia, "Formal licensing regime described in 2026 legal update", High, "Governance, risk, cybersecurity, API, and resilience controls", "High until D360-specific evidence is reviewed", "Confirm D360's licensing scope and latest supervisory correspondence"]
      - ["Personal-data consent, privacy, and third-party access", Saudi Arabia, "PDPL and open-banking obligations described by legal source", High, "Consent, access controls, contracts, audits, and breach response", High, "Review DPA, consent logs, vendor assessments, and privacy incidents"]
      - ["Service outage, unauthorized transaction, or dispute", Saudi Arabia, "Framework and legal commentary identify liability and dispute requirements", High, "Contractual allocation, complaint handling, incident response", "Medium-high", "Request outage history, complaints, disputes, and remediation evidence"]
    enumerationScope:
      coverage: partial
      basis: "Publicly documented Saudi banking and open-banking rules and failure modes retained for this chapter as of 2026-10-23; not a complete legal inventory."
    notes: "Rows summarize public framework and legal commentary; a status entry does not confirm D360 implementation or absence of enforcement."
    claimRefs: [CR005, CR006, CR007, CR008, CR015, CR016]
  - id: TR003
    title: Partner and dependency risk register
    columns: [Dependency, Counterparty, Role, Concentration question, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - [Capital support, PIF and Derayah Financial, Investors/shareholders, "Ownership and future support terms are not disclosed", "Capital need or slower shareholder support during expansion", High, "Maintain capital and liquidity buffers; monitor shareholder commitments", High]
      - [Regulatory infrastructure, SAMA, Licensor and supervisor, "Single primary banking regulator", "Failure to meet evolving licensing or control expectations", High, "Regulatory change management and direct compliance reporting", Medium-high]
      - [Open-banking connectivity, Licensed TPPs and API ecosystem, Data/payment counterparties, "Counterparty and API dependency are not disclosed", "Interoperability, fraud, consent, or service failure", High, "Third-party risk assessments, testing, and fallback procedures", Medium-high]
      - [Funding and liquidity, Saudi banking funding market, Depositors and capital markets, "D360 deposit mix and concentration are not disclosed", "Higher funding cost, liquidity strain, or margin compression", High, "Contingency funding plan and matched-liability monitoring", High]
    notes: "Dependency roles are supported by the retained investor, regulatory, and sector sources; concentration levels and contractual mitigations require private diligence."
    claimRefs: [CR009, CR010, CR011, CR012]
figures:
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: Public evidence places regulatory, cyber, funding, and asset-quality risks in the high-impact band, with D360-specific likelihood and mitigation evidence incomplete.
    data:
      columns: [Likelihood, Impact, Residual exposure]
      rows:
        - {label: Regulatory/open-banking execution, values: [Medium, High, High]}
        - {label: Cyber/privacy/payment controls, values: [Medium, High, High]}
        - {label: Funding cost and margin pressure, values: [Medium, High, Medium-high]}
        - {label: Asset quality and losses, values: [Unknown, High, High]}
        - {label: Capital-provider and liquidity dependency, values: [Medium, High, High]}
        - {label: Customer and partner concentration, values: [Unknown, High, High]}
    claimRefs: [CR001, CR003, CR005, CR007, CR011]
callouts:
  - calloutType: risk
    title: Primary thesis-break trigger
    body: A confirmed material regulatory action, repeated customer-data or payment-control failure, or deterioration in capital, asset quality, or liquidity would break the current watch-and-verify posture.
    claimRefs: [CR013, CR014]
  - calloutType: assumption
    title: Sector data are not bank data
    body: Fitch's Saudi-sector ratios and margin observations provide context only; they do not establish D360's own capital, funding, losses, or profitability.
    claimRefs: [CR003, CR011]
