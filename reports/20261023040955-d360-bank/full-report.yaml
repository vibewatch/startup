chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              D360 Bank is described by the Public Investment Fund as a Saudi digital banking institution that adheres
              to Sharia principles, with investors including PIF and Derayah Financial. The available company profile
              places the bank in Riyadh, founded in 2020, and serving Saudi Arabia through a mobile-first platform
              rather than a conventional branch network. Its stated product scope spans current and savings accounts,
              cards, domestic and international transfers, bill payments, personal-finance tools, and digitally
              delivered services for entrepreneurs and small businesses. The PIF account says the bank was established
              in 2022, which conflicts with the profile's 2020 founding date and should not be silently reconciled. The
              evidence therefore supports a Saudi digital-bank identity and operating model, while the exact corporate
              founding event and date remain a diligence item.
