  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and scale
        blocks:
          - type: paragraph
            body: >-
              Saudi digital banking is no longer a single-challenger market. Fintech News UAE identifies STC Bank, D360
              Bank, Barq, Hala, and Vision Bank as prominent standalone digital-bank or neobank players, while
              explicitly excluding banking arms of traditional lenders such as NEO and Meem. Its account of STC Bank
              describes a wallet-to-bank transition with more than 3 million customers, whereas D360 is described as
              serving more than 1 million customers. The same source positions Barq around international transfers and
              consumer rewards, Hala around MSMEs and embedded finance, and Vision Bank around licensed mobile banking
              and savings. This creates overlapping alternatives rather than a clean peer set: STC owns distribution and
              migration scale, D360 competes on a broad digital-bank experience, and the adjacent players can win
              specific use cases without matching D360's full-bank scope. D360's own investor description confirms its
              focus on individuals, entrepreneurs, and SMEs, while independent reporting says it planned to expand
              lending services to individuals and SMEs. The competitor set therefore spans direct licensed banks,
              payment-led substitutes, specialist SME platforms, and incumbent-bank digital arms such as NEO and Meem.
              Existing bank relationships and internally managed finance workflows are also status-quo substitutes, but
              the assigned evidence does not quantify their scale, switching cost, or economics; those alternatives are
              kept visible as gaps rather than assigned unsupported performance claims.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
      - number: '3.2'
        title: Capability, distribution, and regulatory posture
        blocks:
          - type: paragraph
            body: >-
              The strongest observable competitive axis is distribution, not a proven product feature monopoly. STC Bank
              inherited a large STC Pay user base: Arab News reports that it began as STC Pay, received approval to
              transition to a bank, and later received full operational approval. Fintech News UAE reports 15 million
              STC Pay users were eligible to upgrade and two million migrated within three months, a scale advantage
              that D360 would need to offset through acquisition, engagement, or superior economics. D360 has meaningful
              breadth: the company-issued launch material describes accounts, bill pay, transfers, cards, personalized
              services, and a fully digital operating model, while the independent competitor review also describes
              individual and business accounts, savings, lending, cards, international transfers, and
              Banking-as-a-Service infrastructure. Regulatory authorization is becoming table stakes: SAMA approved D360
              in December 2024, STC Bank's full launch followed a beta period, and SPA records SAMA's September 2025
              non-objection for Vision Bank. Vision Bank's approval also illustrates that digital banks remain subject
              to capital, liquidity, governance, risk, cybersecurity, and data-protection requirements. Those
              requirements can raise trust and compliance barriers, but they do not by themselves create a D360-specific
              moat.
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP002
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP005
              - CP009
              - CP010
      - number: '3.3'
        title: Pricing pressure and moat durability
        blocks:
          - type: paragraph
            body: >-
              Public pricing evidence is thin, so the competitive conclusion should not be framed as a verified price
              advantage. D360's launch coverage uses promotional language about competitive exchange rates, no-cost
              local transfers, and low fees, but does not provide a durable price card or realized customer economics.
              STC Bank's described product set includes transfers, cards, financing, and savings; Barq emphasizes no
              annual or international fees, travel benefits, and rewards; and Hala monetizes a business workflow through
              payment acceptance, POS, payroll, expense controls, and financing. These are different packaging
              strategies that can support multi-homing and segment-specific substitution. D360's potential advantages
              are its licensed full-bank scope, Sharia-compliant positioning, app-led onboarding, and a broad
              consumer-to-SME ambition. The evidence does not show retention cohorts, switching costs, realized
              interchange or lending spreads, customer acquisition cost, or partner exclusivity. A material adverse
              signal is therefore not a reported product failure but the speed with which regulators and adjacent
              providers are adding credible alternatives. D360's moat is best treated as provisional until it
              demonstrates repeat usage, profitable distribution, and differentiated risk or service capabilities that
              competitors cannot readily replicate.
            claimRefs:
              - CP013
              - CP014
              - CP015
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP013
              - CP014
              - CP015
              - CP016
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: paragraph
            body: >-
              The analysis separates documented competitor facts from analyst judgments. Where a source reports a
              customer count, transaction figure, or regulatory milestone, the value is retained with its period and
              issuer. Unknown pricing, retention, and realized economics remain explicitly unknown rather than being
              inferred from promotional claims. The positioning map is an evidence-backed ordinal comparison of
              disclosed breadth and distribution signals, not a measured market-share chart. It is intended to expose
              evidence quality as well as competitive position. Investment diligence should therefore focus on
              active-account cohorts, channel-level acquisition cost, realized fee and spread economics, product-level
              engagement, and exclusivity or dependency in partner distribution before treating early account growth as
              durable advantage.
            claimRefs:
              - CP002
              - CP007
              - CP013
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Distribution is the immediate battleground
            body: >-
              STC Bank's reported migration from a telecom wallet gives it a distribution advantage that D360's broad
              product scope does not automatically neutralize.
            calloutType: insight
            claimRefs:
              - CP007
              - CP008
          - type: callout
            title: A provisional moat
            body: >-
              The retained evidence does not disclose D360 retention, realized pricing, acquisition cost, or lending
              economics, while new licensed and adjacent providers continue to add credible substitutes.
            calloutType: risk
            claimRefs:
              - CP013
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization visibility
        blocks:
          - type: paragraph
            body: >-
              D360 describes itself as a Sharia-compliant digital banking institution serving individuals,
              entrepreneurs, and small and medium-sized enterprises. Its public materials support a banking operating
              model rather than a pure software subscription model: the institution is licensed, supervised by SAMA, and
              positioned around user-friendly digital banking services. The available evidence does not publish a
              revenue split between financing income, fees, payments, deposits, or other services, and official pricing
              evidence is not available in the assigned pool. A company statement about planned SME expansion is a
              strategic intention, not evidence of realized SME revenue or contribution margin. Consequently, list or
              account features cannot be converted into revenue, ARR, or gross-margin estimates without contracts,
              financial statements, and product-level volumes.
            claimRefs:
