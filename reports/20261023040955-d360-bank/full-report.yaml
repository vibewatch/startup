        title: Leadership, capital, and governance
        blocks:
          - type: paragraph
            body: >-
              Public materials identify Taha Abdullah Al-Kuwaiz as chairman and Eze Szafir as chief executive in the
              bank's customer milestone announcement. They also identify Derayah Financial and PIF-linked shareholders
              as core backers, with the PIF portfolio page describing local and international expertise but not
              providing a complete board or executive roster. The June 2026 capital increase is the clearest current
              financing evidence: 72,916,667 new ordinary shares at SAR 20.57 generated approximately SAR 1.5 billion,
              with an additional 8,750,000 ESOP shares subject to regulatory approvals. Maaal reports a fully diluted
              pre-money valuation of SAR 4.5 billion and an implied post-money valuation of SAR 6 billion; Derayah
              planned SAR 100 million and its stake was expected to fall from 20.4% to 16.35%. These are
