      - number: '1.3'
        title: Scale milestones and evidence gaps
        blocks:
          - type: paragraph
            body: >-
              The strongest public scale signal is the bank's announcement that it exceeded one million customers within
              four months of official launch and processed more than 51 million transactions across over 100 countries,
              with transaction volume above SAR 50 billion. Later June 2026 reporting cites three million customers and
              SAR 3 billion in deposits as of April 2026, but that figure is attributed to a bourse disclosure report
              and sources familiar with the matter rather than audited bank financial statements. The June capital raise
              is intended to support lending, consumer finance, SME lending, and API banking. Arab News also reported
              that former JPMorgan banker Mohammed Nazer was appointed chief financial officer to lead the planned
              Series A process. No retained source provides audited revenue, net income, net interest margin, capital
              adequacy, non-performing financing, current headcount, active-user methodology, or complete governance
