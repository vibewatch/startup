        title: Exhibits
        blocks:
          - type: callout
            title: Category growth does not establish D360 share
            body: >-
              Digital-payment adoption supports demand, but the retained evidence cannot convert national category
              growth into D360 revenue or obtainable share.
            calloutType: insight
            claimRefs:
