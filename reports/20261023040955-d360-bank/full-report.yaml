      - number: '4.2'
        title: Capital adequacy, funding dependency, and cost structure
        blocks:
          - type: paragraph
            body: >-
              The capital picture shows meaningful shareholder backing but not cash availability or runway. Argaam
              reports that D360 was capitalized at SAR 1.65 billion and that a Series A was planned for the first
              quarter of 2026. Jawlah reports that shareholders later approved a 38.9% capital increase from SAR 2.1
              billion to SAR 2.91 billion through new shares, with approximately SAR 1.49 billion of contemplated
              subscription proceeds. D360's current official page still states capital of SAR 2.1 billion, so the
              assigned evidence does not establish whether the approved increase completed. These accounts are not
              interchangeable with cash on hand, regulatory capital ratios, or operating runway. Public evidence also
              does not identify staffing, technology, funding, credit-loss, servicing, or branch-equivalent costs. The
              principal financial dependency is therefore the ability to fund regulated balance-sheet growth while
              building an SME lending operation before public profitability evidence exists.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
          - type: table
            tableRef: TI003
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
              - CI014
              - CI015
      - number: '4.3'
        title: Underwriting verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              Sector evidence is supportive but cannot substitute for D360-specific underwriting. S&P coverage
              summarized by Economy Saudi Arabia expects Saudi bank lending to grow 10% in 2026, while also warning that
              loan-to-deposit ratios may rise beyond 113%, non-performing loans may reach 1.6%-1.7%, and profitability
              may face lower-rate pressure. A separate sector report cites Moody's expectations of approximately 8%
              credit growth and 1.3% NPLs. Those are system-level benchmarks, not D360 outcomes. The banking opportunity
              is also structurally relevant: the Saudi SME financing share was reported at just over 9% of total loans
              in 2024, while D360 has said it wants to expand SME services. Yet no assigned source establishes D360's
              CAC, payback, active-to-registered ratio, net interest margin, loss rate, deposit mix, or capital-adequacy
              ratio. The financial verdict is track/research-more: capital support and demand are credible, but revenue
              quality, margin path, and balance-sheet risk cannot yet be underwritten with conviction.
            claimRefs:
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Shareholder and sector support
            body: >-
              PIF and Derayah backing, reported capital initiatives, and Saudi digital-banking demand provide a credible
              platform for expansion, especially into SMEs.
            calloutType: strength
            claimRefs:
              - CI006
              - CI007
              - CI011
              - CI012
          - type: callout
            title: Underwriting data gap
            body: >-
              No assigned evidence establishes D360 revenue, margin, loss experience, capital adequacy, deposit
              concentration, or cash runway; funding raised must not be treated as cash available.
            calloutType: risk
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI014
              - CI015
          - type: callout
            title: Financial diligence priority
            body: >-
              Require audited statements, regulatory capital and credit-quality schedules, cohort economics, and a
              funding plan before underwriting valuation or profitability.
            calloutType: recommendation
            claimRefs:
              - CI013
              - CI014
              - CI015
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Customer product and operating model
        blocks:
          - type: paragraph
            body: >-
              D360 Bank delivers banking through a mobile-first product rather than a branch-led workflow. The available
              evidence describes digital bank accounts, personal financing, savings and domestic or international
              transfers, while the company app description reproduced by Sensor Tower claims account opening in less
              than two minutes and promotes avoiding branch visits. This is a concrete customer workflow: onboarding,
              account control, and routine payments are brought into the app, with Sharia compliance presented as a
              product requirement rather than an optional feature. The service is intended for individuals,
              entrepreneurs, and small and medium-sized enterprises, although the public materials do not show separate
              product-line service levels, eligibility rules, or customer-support performance. Sensor Tower identifies
              the iOS app as a free Finance-category application with Arabic and English support; its public page
              reports an 18 October 2026 update, but its engagement metrics are gated. The product therefore appears
              operational and recently updated, while the public record is insufficient to underwrite reliability,
              retention, or unit-level usage.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE006
              - CE008
              - CE013
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE010
              - CE013
      - number: '5.2'
        title: Architecture, dependencies, and maturity
        blocks:
          - type: paragraph
            body: >-
              The public architecture is best understood as an app-led banking operating model with regulated-bank
              infrastructure behind it, not as a disclosed software stack. SAMA's no-objection to commence operations
              establishes regulatory permission to operate, while PIF's portfolio description points to data-driven
              strategies, digital innovation, and secure, user-friendly services. Those descriptions do not disclose the
              core banking vendor, cloud topology, API surface, identity stack, fraud controls, service-level
              objectives, disaster recovery design, or integration dependencies. The iOS update dated 18 October 2026 is
              a useful maintenance signal, but one release record does not prove production resilience. Saudi Arabia's
              broader fintech ecosystem includes a regulator-backed Open Banking Lab, and the World Bank identifies the
              digital economy and SME strategy within its Saudi advisory coverage; neither point proves that D360 has
              completed its own integrations or controls. A diligence review should treat the product as live but
              technically opaque, with the most important unknowns concentrated in platform resilience, security
              assurance, and operational scaling.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE011
              - CE014
              - CE016
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE011
              - CE016
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE005
              - CE006
              - CE007
              - CE008
              - CE012
              - CE016
      - number: '5.3'
        title: Differentiation, trust, and technical risk
        blocks:
          - type: paragraph
            body: >-
              D360's defensible product attributes in the public record are its Saudi banking authorization,
              Sharia-compliant positioning, local strategic backing, and app-based access. Regulatory permission and the
              stated financial-inclusion objective are meaningful trust and permissioning assets, but they do not
              substitute for evidence of security certifications, privacy governance, incident history, uptime, or
              customer-service quality. PIF describes active ownership and risk governance across its portfolio, but the
              assigned evidence does not show how those practices operate at D360. The bank also faces a competitive
              digital-banking market: Arab News reported three licensed digital banks in Saudi Arabia, including D360,
              STC Bank, and Vision Bank. That context makes execution quality and differentiated customer economics
              important, yet the assigned evidence provides no verified performance benchmark. No source in this pool
              establishes a breach, outage, or product failure; that evidence boundary is not proof that none occurred.
              The central underwriting risk is therefore limited transparency around controls and operating outcomes,
              not a demonstrated technical incident.
            claimRefs:
              - CE005
              - CE008
              - CE009
              - CE010
              - CE012
              - CE015
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Live regulated product with local fit
            body: >-
              D360 combines a Saudi digital-bank authorization, Sharia-compliant positioning, and an actively maintained
              bilingual mobile application.
            calloutType: strength
            claimRefs:
              - CE001
              - CE005
              - CE006
          - type: callout
            title: Technical transparency is the bottleneck
            body: >-
              The assigned public evidence does not disclose the core stack, control effectiveness, uptime, incident
              history, or measurable product outcomes.
            calloutType: risk
            claimRefs:
              - CE007
              - CE008
              - CE012
          - type: callout
            title: Require control and performance evidence
            body: >-
              Before underwriting product maturity, request architecture diagrams, security assurance, resilience
              testing, incident registers, and module-level adoption and service metrics.
            calloutType: recommendation
            claimRefs:
              - CE007
              - CE008
              - CE012
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Retail scale first, with SMEs as an expansion segment
        blocks:
          - type: paragraph
            body: >-
              Public positioning spans Saudi individuals, entrepreneurs, and small and medium-sized enterprises, but the
              evidence indicates different levels of maturity across those segments. PIF's portfolio page describes all
              three as intended clientele, while a D360 executive characterized the product as designed for digitally
              savvy residents and SMEs. The clearest deployed use case is consumer-facing digital banking and
              international remittance through the mobile app. By contrast, 2025 reporting described full lending for
              individuals and SMEs as planned rather than proven in production. Market context is favorable but not
              company-specific: Saudi SME facilities reached SAR383.2 billion in Q1 2025, and surveyed SME
              digital-payment acceptance was reported at 99%. These figures indicate addressable demand, not D360
              penetration or monetization.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU008
              - CU009
              - CU012
          - type: table
            tableRef: TU001
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU008
              - CU009
              - CU012
      - number: '6.2'
        title: Rapid reported acquisition, with denominator ambiguity
        blocks:
          - type: paragraph
            body: >-
              Two public snapshots imply rapid account acquisition. Reporting tied to a June 2025 funding story put D360
              above 1 million users and stated a target of 4 million account holders before a potential listing. A
              September 2026 announcement from D360's newly appointed media agency reported more than 3.4 million
              customers in under eighteen months since operations began in 2024. The later figure is fresher, but
              neither source defines whether the count means registered, verified, funded, monthly active, or
              revenue-generating accounts. The snapshots also use different labels, "users," "account holders," and
              "customers," so they should not be treated as a cohort or retention series. The defensible conclusion is
              strong reported acquisition, not proven engagement quality.
            claimRefs:
              - CU001
              - CU006
              - CU007
              - CU013
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU006
              - CU007
              - CU009
              - CU013
      - number: '6.3'
        title: Use cases are visible; named customer outcomes are not
        blocks:
          - type: paragraph
            body: >-
              The Thunes relationship provides concrete workflow evidence: D360 app users were expected to send funds to
              beneficiaries in Europe, the United States, and the Middle East, with upfront cost transparency and
              arrival confirmation described by the bank. That supports a real remittance proposition but does not
              disclose transaction volume, successful-transfer rates, customer satisfaction, or economic outcomes. The
              assigned evidence contains aggregate account counts and broad segment declarations rather than named
              retail, entrepreneur, or SME references. Even the strongest proof objects are therefore cohort-level
              claims, not customer-verified case studies. A nationally sampled financial-inclusion survey can benchmark
              the wider market, but its household methodology cannot establish D360-specific adoption or customer
              quality.
            claimRefs:
              - CU004
              - CU014
              - CU016
          - type: table
            tableRef: TU003
            claimRefs:
              - CU001
              - CU004
              - CU006
              - CU007
              - CU013
              - CU014
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU002
              - CU004
              - CU005
              - CU008
              - CU015
      - number: '6.4'
        title: Acquisition investment is visible, while durability remains unproven
        blocks:
          - type: paragraph
            body: >-
              D360 is investing in further customer acquisition: Initiative's appointment covers an integrated media
              mandate centered on trust, consideration, and growth. Expansion paths also include cross-border payments
              and the previously announced move into individual and SME lending. However, the reviewed sources do not
              disclose net or gross revenue retention, churn, renewal behavior, customer tenure, account activity,
              deposit balances, acquisition cost, payback, or revenue concentration. They also do not identify the share
              of acquisition attributable to media, partners, referrals, or organic demand. This makes the 3.4 million
              headline useful as reach evidence but insufficient for underwriting durability. Diligence should reconcile
              registered, funded, active, and paying accounts by monthly cohort before assigning value to the reported
              scale.
            claimRefs:
              - CU002
              - CU008
              - CU015
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Customer count is not a retention metric
            body: >-
              The latest public count lacks an active-account definition, cohort history, balances, revenue, and churn;
              valuation work should not convert it into recurring customer value without private operating data.
            calloutType: risk
            claimRefs:
              - CU001
              - CU013
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk posture
        blocks:
          - type: paragraph
            body: >-
              D360's highest-consequence exposure is the combination of regulated-bank execution and limited public
              operating disclosure. SAMA's open-banking framework standardizes payment-initiation responsibilities and
              secure service delivery, while the 2026 licensing transition described by Clyde & Co adds expectations
              around API performance, data security, consent management, governance, cybersecurity, risk management, and
              operational resilience. These are not evidence of a D360 breach or failure; they define the control
              surface on which execution can fail. A second material risk is funding economics: Fitch reported that
              Saudi-sector funding competition increased, cost of funding rose 30 basis points to 3.5% in 3Q25, and
              sector net interest margin compressed about 20 basis points in 9M25. D360's SAR 1.5 billion capital
              increase strengthens loss-absorption capacity, but the public record does not disclose its
              capital-adequacy ratio, non-performing-financing ratio, deposit concentration, or cash-burn equivalent.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR003
              - CR007
              - CR011
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR007
              - CR011
      - number: '7.2'
        title: Regulatory, legal, and operational exposure
        blocks:
          - type: paragraph
            body: >-
              The regulatory risk is not that licensing is absent: Hala Capital describes D360 as licensed by the Saudi
              Central Bank, and SAMA's second Open Banking Framework release covers Payment Initiation Services and
              clarifies stakeholder responsibilities. The risk is continuing compliance as the ecosystem moves from
              framework guidance toward formal supervision. Clyde & Co reports that firms entering the new open-banking
              licensing regime must demonstrate governance, risk management, cybersecurity, operational resilience, API
              interoperability, data management, and customer-protection controls. Ghazzawi & Partners further
              identifies consent, Personal Data Protection Law obligations, licensing of third-party providers,
              liability allocation, dispute resolution, breach response, audits, penetration tests, and third-party risk
              assessments as legal and implementation considerations. ICLG reports that the PDPL applies to local and
              foreign companies handling residents' data and describes fines, suspension, and possible criminal
              liability for non-compliance. No retained source confirms a D360-specific enforcement action, outage,
              breach, lawsuit, or failed deployment; those remain diligence gaps rather than negative findings.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR015
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR015
              - CR016
      - number: '7.3'
        title: Dependency and financial-model risks
        blocks:
          - type: paragraph
            body: >-
              D360's capital and shareholder structure are strategic strengths but also create dependency questions. The
              Sharikat Mubasher report, citing a Derayah Financial disclosure, says shareholders approved a SAR 1.5
              billion increase through 72.9 million new shares at SAR 20.57 per share, valuing the bank at SAR 4.5
              billion before the increase and SAR 6 billion on completion. PIF identifies itself and Derayah Financial
              among the investors, while describing D360's target users as individuals, entrepreneurs, and
              small-to-medium-sized enterprises. This supports a capital-provider and execution-dependency risk
              register, not a conclusion that support will continue indefinitely. Fitch's sector data shows rising
              funding competition, a loans/deposits ratio of 108% at end-3Q25, and expected margin pressure into 2026.
              D360-specific deposits, loan mix, impairments, liquidity, profitability, customer concentration, and
              partner concentration are not disclosed in the retained evidence and should be obtained before
              underwriting.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.4'
        title: Monitoring, mitigations, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The practical mitigation is evidence-led monitoring rather than assuming that a license or capital raise
              eliminates risk. Management should provide current capital and liquidity ratios, asset-quality and loss
              metrics, deposit and customer concentration, incident history, service-level performance, and open-banking
              control attestations. The monitoring set should also track SAMA releases and licensing requirements,
              consent and data-protection incidents, material outages, funding costs, net interest margin, and the
              timing and terms of additional capital. A thesis break would be a confirmed material regulatory action, a
              repeated customer-data or payment-control failure, a material outage without effective remediation,
              deterioration in capital or asset quality, or inability to raise/retain funding on acceptable terms. These
              triggers are proposed diligence criteria, not observed events in the retained sources.
            claimRefs:
              - CR013
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Primary thesis-break trigger
            body: >-
              A confirmed material regulatory action, repeated customer-data or payment-control failure, or
              deterioration in capital, asset quality, or liquidity would break the current watch-and-verify posture.
            calloutType: risk
            claimRefs:
              - CR013
              - CR014
          - type: callout
            title: Sector data are not bank data
            body: >-
              Fitch's Saudi-sector ratios and margin observations provide context only; they do not establish D360's own
              capital, funding, losses, or profitability.
            calloutType: assumption
            claimRefs:
              - CR003
              - CR011
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment case and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              D360's investable case rests on a regulated operating position, a strategic shareholder base, and a
              funding plan aimed at expanding lending and SME coverage. Saudipedia records the February 15, 2022
              licensing decision and approximately SAR1.65 billion initial capital, while the Saudi Press Agency records
              SAMA permission to begin banking operations in December 2024. PIF describes the bank as Sharia-compliant
              and focused on individuals, entrepreneurs, and SMEs. The anti-thesis is that public disclosure remains too
              thin to connect user growth or capital raised to sustainable revenue, credit performance, profitability,
              or risk-adjusted returns. The reported financing valuation therefore remains a market signal, not a
              verified intrinsic value.
            claimRefs:
              - CV001
              - CV002
              - CV003
          - type: table
            tableRef: TV001
            claimRefs:
              - CV007
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV007
              - CV009
              - CV011
      - number: '8.2'
        title: Financing and valuation context
        blocks:
          - type: paragraph
            body: >-
              The strongest current valuation datapoint is EnterpriseAM's report that a SAR1.5 billion issuance would
              imply SAR4.5 billion pre-money and SAR6 billion post-money, approximately US$1.6 billion, alongside
              reported customer and deposit figures. That account attributes the figures to sources familiar with the
              matter rather than audited financial statements. A separate June 2026 account reports a 38.9% capital
              increase from SAR2.1 billion to SAR2.91 billion and approximately SAR1.49 billion of subscription
              proceeds, with an employee share plan still subject to approvals. These are material financing signals,
              but the pool does not contain cap-table preference terms, revenue, net income, net interest margin,
              capital ratios, or a public valuation model. Finro's Q1 2026 dataset offers broad fintech context, not a
              D360-specific comp valuation.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV003
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
      - number: '8.3'
        title: Scenario discipline and decision
        blocks:
          - type: paragraph
            body: >-
              A scenario framework is more defensible than a point estimate because the public record leaves core bank
              economics unresolved. The bull case requires the reported capital to convert into profitable lending,
              durable deposits, and controlled credit losses while the bank reaches its stated expansion objectives. The
              base case assumes strategic capital supports continued growth but that monetization and risk metrics
              remain unproven, warranting monitoring rather than underwriting at the reported post-money mark. The bear
              case is a combination of dilution, slower SME monetization, funding or margin pressure, and adverse credit
              or regulatory outcomes. The recommendation is track/research-more: a buyer should require audited
              financials, cohort activity, capital and asset-quality metrics, and financing terms before accepting the
              reported valuation as investable.
            claimRefs:
              - CV012
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: Exit readiness and diligence asks
        blocks:
          - type: paragraph
            body: >-
              Exit optionality is described, not established. EnterpriseAM reports a potential public listing in three
              years, while Arab News reports a goal of four million account holders ahead of a potential listing within
              four years. These aspirational horizons do not constitute a verified exit plan. D360's regulated status
              and Saudi digital-payment adoption support a credible market backdrop, but they do not establish listing
              readiness, governance readiness, liquidity, or a realizable return. The immediate diligence path is to
              obtain the latest audited accounts, a bridge from accounts to active customers and deposits, credit and
              capital-adequacy data, the Series A share and preference documents, and board-approved projections.
              Thesis-break triggers should include materially weaker asset quality, inability to raise required capital
              on acceptable terms, or failure to demonstrate monetization despite continued user growth.
            claimRefs:
              - CV016
              - CV017
              - CV018
              - CV019
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV007
              - CV011
              - CV012
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price-sensitive conclusion
            body: >-
              The public record supports continued diligence and monitoring, not a buy at the reported approximately
              US$1.6 billion post-money valuation without audited economics and financing terms.
            calloutType: recommendation
            claimRefs:
              - CV007
              - CV011
              - CV012
          - type: callout
            title: Primary valuation risk
            body: >-
              User, deposit, and capital-growth signals can coexist with weak or unproven risk-adjusted returns; the
              missing bridge is audited profitability, asset quality, and dilution/preference detail.
            calloutType: risk
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV015
