- id: switching-costs-and-distribution
  title: Switching costs rise sharply once a decision core is embedded
  body: |-
    The central competitive question is not whether banks can source identity, fraud, or AML tools from many vendors—they can. The real question is where multi-homing ends and orchestration lock-in begins. Customer evidence from the TrustDecision banking case and Alloy’s orchestration positioning suggests that the moment a vendor becomes the coordinating decision layer—routing data, models, rules, and case handling—switching costs rise meaningfully. Replacement then implies more than buying a new score: it means rebuilding integration logic, retraining operations, re-validating models, and re-earning compliance trust. That is exactly where Tongdun appears to want to compete.

    Distribution power amplifies this. OneConnect can sell from a broader incumbent-style digital-finance posture; global vendors such as Alloy and Jumio lean on ecosystem breadth, partner networks, and clearer global brand surfaces; Tongdun’s distribution advantage appears more local and workflow-specific, built around Chinese and regional bank-risk credibility. The risk for Tongdun is that global brand clarity and ecosystem openness can be powerful substitutes in cross-border RFPs. The offset is that local bank integration depth and regulatory nuance can still matter more than sleek global marketing in highly regulated deployments.
