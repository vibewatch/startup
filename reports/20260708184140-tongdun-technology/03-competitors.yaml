chapter:
  number: 3
  title: Competitors
  summary: 'Tongdun competes across overlapping layers: broad financial-digitization incumbents like OneConnect, decision-intelligence or orchestration peers like Quantexa and Alloy, and narrower identity, AML, or merchant-fraud specialists such as ADVANCE.AI, SEON, Socure, Jumio, ComplyAdvantage, and Riskified. The strongest moat case is in local bank workflow depth and decision-core stickiness, while the weakest flank is in crowded edge layers such as identity verification and AML.'
sections:
- id: landscape
  title: Competitive landscape spans incumbents, specialists, and orchestration platforms
  body: |-
    Tongdun does not face one clean peer set. The public evidence points to at least three overlapping competitive arenas. First are broad financial-infrastructure or bank-digitalization players such as OneConnect, which sell into banks with a wider digital-transformation story that includes banking, insurance, government, and enterprise workflows. Second are decisioning and orchestration peers such as Quantexa, Alloy, and in some respects TrustDecision itself, which frame the problem as a unified risk or decision layer connecting data, rules, workflows, and policy. Third are narrower but potent specialists such as Jumio, Socure, Mitek, Onfido, SEON, ComplyAdvantage, Riskified, and FraudNet that enter through identity, AML, merchant fraud, or enterprise fraud use cases.

    That structure matters because Tongdun’s competitive edge will vary by deal type. In a Chinese or Southeast Asian bank looking for an integrated anti-fraud, credit-risk, and model-governance stack, Tongdun can look like a platform vendor with local workflow credibility. In a global digital-onboarding or merchant-fraud RFP, it may instead look like one among many identity and fraud providers competing against better-known English-language brands. Chapter 3 therefore treats competition as a spectrum from broad incumbents to focused specialists rather than pretending Tongdun has one static peer group.
