  - FE004
- id: trust-and-evidence-gaps
  title: Trust signals exist, but they remain policy-heavy and code-light
  body: |-
    On trust and compliance, the public record is mixed. The privacy policy is more useful than typical vendor copy because it spells out controller-versus-processor roles, lists sensitive data categories, and mentions DPIAs. The device-intelligence page also claims privacy-centric design, no-PII collection for that module, and client-side protection via WebAssembly. Those are meaningful signals because they show the company knows how its controls should be described in regulated settings.

    Still, the evidence base is more policy-heavy than audit-heavy. The fetched set does not expose public repositories, public status telemetry, or an externally visible certification register that would let an outsider validate engineering quality at a deeper level. GitHub offers essentially no open-source surface, which means technical diligence must rely on customer deployment proof and private document review. That does not invalidate the product thesis; it just means the buyer should require architecture review, security questionnaires, and operating-control evidence before treating Tongdun’s technical claims as fully underwritten.
