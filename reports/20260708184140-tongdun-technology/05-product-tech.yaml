- id: architecture-and-workflow
  title: The architecture appears to center on client data collection, signal enrichment, and orchestration
  body: |-
    The cleanest architecture evidence comes from the privacy policy and the product pages together. TrustDecision says its clients send data through APIs and place SDKs on selected client-site pages, while the policy details the categories of information that move through the system: identity, payment, transaction, behavioral, device, and connection data. That means Tongdun’s public operating model starts with data instrumentation inside customer environments. On top of that collection layer sit identity enrichment, device intelligence, model scoring, strategy rules, knowledge-graph or relationship logic, and case-management or portfolio workflows.

    The workflow evidence is similarly broad. Account Protection describes graph-based ring detection and account-takeover control, Device Intelligence adds real-time device and behavior scoring, Global Risk Persona adds IP/email/phone risk APIs, and the payment and credit surfaces extend decisioning beyond onboarding into transaction monitoring and portfolio control. The architecture therefore looks like a layered decision system: data enters via API/SDK, is enriched by device and identity services, is evaluated by models and graph logic, and is then routed by Archer/Argus/Pistis into approval, decline, review, or downstream servicing workflows. That picture is specific enough to underwrite the product thesis directionally, but not enough to validate every internal dependency or model-control practice.
  claimRefs:
  - CE009
  - CE010
