  - type: private-evidence-only
    severity: blocking
    topic: architecture-review
    missingEvidence: A current technical architecture review covering data flows, model-monitoring processes, graph infrastructure, and control boundaries.
    whyItMatters: Public pages support the high-level stack but cannot validate hidden dependencies or model-governance quality.
    diligencePath: Request architecture diagrams, DFDs, model-governance documentation, and system-dependency inventories.
