- id: deployment-support-and-maturity
  title: Deployment and support look enterprise-heavy and production-grade
  body: |-
    Tongdun’s delivery model appears enterprise-heavy. The banking case study and partner pages show large production throughput and low-latency operation, while the implementation evidence shows that getting there requires data work, interfaces, testing, models, and performance tuning. Professional Services and Support & Training make that explicit by marketing advisory, custom development, workflow configuration, patching, vulnerability alerts, and 24/7 support. This is a system that expects to live inside complicated financial environments, not a lightweight self-serve widget.

    That supports a fairly strong maturity read in core workflows. Public evidence includes bank-scale production metrics, multiple named platforms, and detailed module pages across finance and digital commerce. But maturity is not the same as visibility. The public set does not provide a forward release calendar, a public status page, or a named certification list that would let outside diligence verify controls at a deeper level. So the chapter’s technical verdict is nuanced: Tongdun likely operates a mature decisioning stack in production, but implementation cost, private infrastructure details, and trust-verification gaps remain material.
  claimRefs:
  - CE014
  - CE015
  - CE016
  - CE017
  - CE018
  - CE019
  - CE035
  - CE036
  - CE039
