- id: recommendation-and-scenarios
  title: Recommendation should be price-sensitive, evidence-sensitive, and upgradeable
  body: |-
    The recommendation from the public file is track / research more. That is not a soft answer; it is a price-sensitive answer. Tongdun could become investable at a disciplined entry if management privately proves software-like recurring revenue quality, contains its legal and governance overhang, and shows enough customer concentration and retention data to justify premium multiples. It could also remain too risky if those proofs fail. In other words, the key variable is not whether Tongdun is an interesting company. It is whether enough missing evidence can be converted into durable underwriting confidence.

    The scenario framing should therefore stay explicit. A bull case requires real software economics and contained trust risk. A base case assumes a solid but partly services-heavy enterprise risk platform. A bear case assumes that opacity, concentration, or legal friction pull fair value well below unicorn status. That range-based approach is more honest than a single target price and more useful for IC discussion than vague admiration for the company’s strategic position.
  claimRefs:
  - CV018
