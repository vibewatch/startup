- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Adverse legal / regulatory action
    - Any material enforcement or admitted misuse finding
    - Damages trust and procurement
    - Pause or walk
  - - Weak audited economics
    - Revenue or margin far below implied premium band
    - Breaks unicorn-quality case
    - Re-cut valuation lower
  - - Customer concentration shock
    - Top accounts or vertical exposure too concentrated
    - Raises downside sensitivity
    - Demand bigger price discount
  - - Cash / runway weakness
    - Runway too short without plan
    - Creates financing dependency
    - Treat as capital-dependent
  - - Governance mismatch
    - Management cannot reconcile entity changes or case status
    - Raises hidden-liability risk
    - Escalate or stop diligence
  notes: Every trigger is chosen because it can be validated directly in diligence and has immediate valuation consequences.
  claimRefs:
  - CV024
  - CV025
  - CV033
  - CV039
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Audited financials
    - Current revenue, margin, cash, runway
    - Core valuation support
    - Management + auditor
  - - Customer concentration
    - Top-20 revenue and renewal table
    - Determines downside concentration
    - Management / finance
  - - Legal status
    - Current counsel memo and case register
    - Controls trust overhang
    - External counsel
  - - Retention quality
    - NRR, GRR, churn, attach rates
    - Distinguishes software from services-heavy model
    - RevOps / finance
  - - Governance map
    - Entity-control rights and change rationale
    - Reduces hidden-liability risk
    - Board / legal
  - - Control artifacts
    - SOC/ISO reports, incident history
    - Validates premium trust claims
    - Security / compliance
  notes: These asks are prioritized by how much they can change the valuation call, not by convenience.
