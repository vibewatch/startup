chapter:
  number: 8
  title: Valuation
  summary: Tongdun looks strategically relevant and plausibly valuable, but the public file does not justify a premium-price conviction call. Comparable public fraud and identity vendors show that a low-single-digit or sub-single-digit billion valuation band can be plausible for scaled operators, yet Tongdun’s revenue, margin, cash, and legal-status opacity mean the right recommendation is track / research more with high risk, medium-low confidence, and a strict valuation-discount requirement.
sections:
- id: thesis-vs-antithesis
  title: The company thesis is real, but the anti-thesis is stronger than the price support
  body: |-
    Tongdun has a real thesis. Public sources support that it built a scaled risk-decisioning business with meaningful financial-institution penetration, broad product scope, and customer deployments that look materially more serious than slideware. That matters because many private AI companies cannot even clear the first hurdle of proving they are real operating businesses. Tongdun can. The stronger parts of the file are customer scale, workflow breadth, and evidence that at least some production deployments are large and operationally meaningful.

    The problem is that the anti-thesis attacks the parts of the story that matter most for paying a premium price. Public trackers disagree on funding and valuation markers, current revenue and margin are undisclosed, and governance / legal overhang remains unresolved. In valuation terms, that means the company can deserve strategic attention without deserving a fast-moving buy recommendation. The narrative quality is higher than the evidence quality, and valuation discipline has to respect that gap.
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV006
  - CV007
