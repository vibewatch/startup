- id: sizing-lenses
  title: 'Sizing lenses: strong macro growth, weak China-specific precision'
  body: |-
    The fetched market reports are directionally strong but category definitions vary materially. MarketsandMarkets provides the cleanest APAC identity-verification anchor, taking the category from US$2.73 billion in 2025 to US$6.02 billion by 2030 at a 17.1% CAGR, with BFSI as the largest vertical and access control/user monitoring as the fastest-growing application. The Business Research Company gives a broader global identity-verification view at US$14.78 billion in 2025, US$17.33 billion in 2026, and US$32.48 billion by 2030, while IMARC gives a narrower e-KYC line at US$948.8 million in 2025 and US$3.85 billion by 2034. The AML-software adjacency is also sizable, rising from US$3.4 billion in 2025 to US$3.92 billion in 2026 and US$6.85 billion by 2030.

    These are useful anchors, but they cannot be dropped directly into a Tongdun valuation model without adjustment. Each publisher defines the market a little differently: some emphasize identity verification, some fraud-detection software, some AML automation, and some e-KYC onboarding. Tongdun sits across multiple layers. The right analytical move is therefore to preserve the contradiction rather than smoothing it away: use the broad public numbers to establish that Tongdun sells into a growing category complex, but treat China-only market share and a clean company-specific SAM as unresolved until a primary industry study or management data room gives better bottom-up segmentation.
