  figureRefs: []
- id: dependency-and-model-risk
  title: Dependencies, sector concentration, and model opacity can transmit risk quickly
  body: |-
    Partner and dependency risk matters because Tongdun’s offering appears woven into outside infrastructure and data ecosystems. Huawei and AWS support delivery, Visa and Mastercard support dispute workflows, credit bureaus and third-party data providers enrich decisions, and customer-embedded APIs or SDKs determine what the system can actually see. Any degradation in those links can affect detection quality, customer operations, or regional compliance. The company’s bank-heavy proof mix adds a second layer of dependence by tying commercial success to regulated-finance budgets and procurement cycles.

    Model risk is intertwined with those dependencies. If data feeds are noisy, rules are brittle, or model logic becomes too opaque for customers to trust, the consequences show up not only in false positives and fraud losses but also in lost renewals and slower sales. Public evidence supports that Tongdun has meaningful mitigations, yet it also supports that the residual model and dependency risk is material because the business is so embedded in consequential customer decisions.
  claimRefs:
  - CR012
  - CR013
  - CR014
  - CR016
  - CR023
  - CR024
  - CR025
  - CR026
  - CR027
  - CR030
  - CR031
  - CR036
