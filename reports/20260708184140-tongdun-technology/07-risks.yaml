chapter:
  number: 7
  title: Risks
  summary: Tongdun’s main public-file risks cluster around legal/privacy overhang, service-heavy operational execution, dependence on partner and customer integrations, and governance opacity following 2025 entity changes. The company also shows meaningful mitigation signals—localization posture, claimed certifications, major partners, support operations, and real production scale—but the public set is still too light on independently verifiable audit, incident, and legal-resolution evidence. This is a diligence-gated risk profile rather than an outright red flag or clean pass.
sections:
- id: legal-regulatory-risk
  title: Legal and regulatory risk is the primary thesis threat
  body: |-
    Tongdun’s biggest public-file risk is not product irrelevance; it is legal and regulatory exposure around a business model that processes sensitive data, drives consequential decisions, and sells into highly regulated customers. The privacy policy makes that plain by listing identity, payment, behavioral, device, and other sensitive categories, while Chinese data-security rules make formal protection obligations unavoidable. Even without a visible enforcement action in the fetched set, Tongdun operates in a zone where a privacy or data-processing failure could rapidly become commercial, regulatory, and reputational at the same time.

    That general compliance load is amplified by the litigation and controversy cluster. Multiple adverse sources describe disputes around credit-reporting or data-related issues connected to Tongdun and/or its founder. Investors should not overread any single article, but the cluster itself matters because bank procurement committees and counterparties rarely wait for final legal clarity before reassessing trust. The risk conclusion is therefore straightforward: legal and regulatory scrutiny is the top residual exposure until management can privately prove clean controls, current case status, and durable buyer confidence.
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
  - CR019
  - CR020
  - CR021
  - CR022
  - CR034
  tableRefs:
  - TR001
  figureRefs:
  - FR001
- id: operational-security-risk
  title: Operational risk sits in implementation complexity, support burden, and limited external reliability visibility
  body: |-
    Operational risk is elevated because Tongdun does not appear to sell lightweight software. The banking case and service pages show deployments that depend on data integration, interface work, model or rule tuning, hardware or infrastructure alignment, and ongoing support. That is good for stickiness but risky for execution: projects can slip, hidden support effort can eat margins, and customer dissatisfaction can grow if vendor dependence becomes too high.

    The public file adds one more cautionary signal: many mitigation claims are real but not deeply verifiable. Company pages describe 24/7 support, local nodes, certifications, and human-in-the-loop workflows, yet the fetched set still lacks the kind of public status telemetry, detailed control reports, or incident archives that would let an outsider test those claims rigorously. This means investors can accept that Tongdun has a risk-management apparatus, but they should not yet accept that the apparatus is fully evidenced.
  claimRefs:
  - CR006
  - CR007
  - CR008
  - CR009
  - CR010
  - CR011
  - CR015
  - CR032
  - CR033
  - CR035
