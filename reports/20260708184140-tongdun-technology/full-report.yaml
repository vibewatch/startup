      - number: '2.4'
        title: Growth drivers are powerful, but compliance and data friction stay real
        blocks:
          - type: paragraph
            body: >-
              The strongest demand drivers are easy to identify: digital banking, online payments, remote onboarding,
              real-time payments, and the rising sophistication of fraud attacks. Public reports also show that buyers
              increasingly need integrated Fraud+AML operating models rather than stand-alone tools. DataVisor’s 2026
              survey is particularly useful because it translates this from theory into operator pain: most leaders fear
              AI-driven fraud, many lack data quality to respond well, and nearly half still struggle with fragmentation
              even while trying to converge fraud and AML processes. In other words, the demand pull is not only that
              the market is growing; it is that the threat model is outpacing the legacy operating model.


              The main constraints are just as important. MarketsandMarkets and IMARC both highlight privacy, biometric
              governance, and local data-control demands, while the TrustDecision banking case and KPMG China AML-law
              note show how Chinese institutions face layered obligations across PIPL, data-security, AML, KYC,
              transaction monitoring, and beneficial-ownership enforcement. Those constraints do not kill demand; they
              shape it. They create a market where on-premises, hybrid, explainable, and auditable deployments remain
              valuable, where country-by-country rollout can be slow, and where overseas expansion is attractive
              precisely because regulatory fragmentation is hard. For Tongdun, that means the company sells into a
              growing market, but the winning play is likely disciplined regulated-workflow execution rather than
              uncontrolled horizontal expansion.
            claimRefs:
