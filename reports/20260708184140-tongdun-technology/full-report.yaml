  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: regulated decisioning, not generic AI'
        blocks:
          - type: paragraph
            body: >-
              Tongdun’s real market is best understood as regulated decisioning infrastructure rather than as
              undifferentiated AI software or broad cybersecurity. The product surfaces visible across Tongdun and
              TrustDecision span fraud management, credit-risk decisioning, identity verification, onboarding, AML,
              knowledge-graph analysis, and real-time transaction monitoring. Those functions sit inside
              high-consequence customer workflows where banks, fintechs, and regulated digital businesses have to make
              fast yes-or-no or step-up decisions under both fraud pressure and compliance scrutiny. In other words,
              Tongdun competes where model quality, latency, explainability, and deployment governance matter more than
              generic analytics features.


              That boundary excludes large swaths of enterprise AI and even large swaths of cybersecurity spending. It
              does not make sense to count endpoint security, SIEM, or horizontal data platforms as addressable spend
              just because some buyers share a CISO or data-office budget. The cleaner framing is a layered market: a
              broad digital identity / fraud / AML / decisioning TAM, a narrower APAC BFSI-centered SAM where Tongdun’s
              workflow fit is strongest, and a tighter SOM where banks and licensed lenders are willing to buy a
              third-party decisioning stack instead of depending entirely on internal tooling or point vendors. That
              layered framing prevents the report from turning useful macro growth data into a falsely precise Tongdun
              market-share story.
            claimRefs:
              - CM001
              - CM023
              - CM024
