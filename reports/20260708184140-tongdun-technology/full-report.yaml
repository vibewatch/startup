chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, brand architecture, and current corporate surface
        blocks:
          - type: paragraph
            body: >-
              Tongdun’s core identity is still easiest to establish through its own web properties rather than through
              any single registry or tracker. Tongdun.com continues to describe the company as an AI-based
              decision-intelligence provider focused on financial risk, security risk, and government-governance
              scenarios, while the tongdun.cn estate now resolves into Xiaodun Future branding and a footer naming
              Zhejiang Xiaodun Future Technology Co., Ltd. The English company page for Tongdun in Indonesia keeps the
              older Tongdun label, describes the group as a third-party intelligent risk-management and decision-making
              provider headquartered in Hangzhou, and says more than 10,000 corporate clients have adopted its products.
              Taken together, the public surface suggests the business still commercially trades on the Tongdun brand,
              but that domestic web identity and legal-entity presentation have become more layered than they were
              during the company’s 2019 funding cycle.


              That layering matters because later diligence questions depend on which entity or brand actually owns the
              customer contracts, IP, compliance obligations, and international go-to-market activity. For chapter 1,
              the safest synthesis is that Tongdun is the umbrella operating identity investors and customers would
              recognize, Xiaodun Future is a newer domestic corporate presentation visible on the Chinese site, and
              TrustDecision is the outward-facing international brand used for overseas fraud, credit-risk, and
              compliance products. The existence of multiple live brand surfaces is not fatal, but it does create a real
              diligence need around contract chain, governance, and disclosure hygiene before any investor treats the
              public web narrative as a fully clean corporate map.
