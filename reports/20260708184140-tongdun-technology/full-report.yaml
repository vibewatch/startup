      - number: '3.2'
        title: Capability overlap is real, but each vendor clusters around a different center of gravity
        blocks:
          - type: paragraph
            body: >-
              Capability overlap across the market is unmistakable. SEON, Alloy, Socure, Jumio, Mitek, and Onfido all
              speak to identity or fraud layers. ComplyAdvantage and SEON both push AML explicitly. Quantexa claims
              decision intelligence. OneConnect goes broader into digital banking and insurance transformation.
              ADVANCE.AI focuses on onboarding, KYC, AML, and customer journeys. Tongdun’s own stack—especially as
              described through Tongdun and TrustDecision—sits across multiple of these buckets at once, combining
              fraud, credit, identity, graph, and decisioning. That breadth can be a strength in bank-centered buying
              motions, but it also means Tongdun competes on several fronts simultaneously.


              The packaging signals are also telling. Across the reviewed public sites, price transparency is almost
              nonexistent. Vendors overwhelmingly emphasize demos, consultations, partner ecosystems, workflow
              configurability, and enterprise outcomes rather than simple list prices. That strongly suggests
              enterprise-custom packaging and long implementation cycles rather than self-serve SaaS. In practice, this
              compresses competitive advantage toward product fit, deployment quality, explainability, and ecosystem
              leverage instead of toward simple sticker-price competition. Tongdun’s challenge is therefore not only to
              match features, but to prove that its broader stack is easier to trust, deploy, and expand than specialist
              alternatives.
