      - number: '7.4'
        title: Governance and talent risk are manageable only with private evidence
        blocks:
          - type: paragraph
            body: >-
              The 2025 entity and management changes make governance risk impossible to ignore. A founder can retain
              strong influence while operational responsibilities move around the group, but investors need to know why
              those changes happened, whether bank customers noticed, and how control and oversight now work across the
              operating entities. That is especially important in a technically dense company where specialized product,
              model, data, and regulatory talent is hard to replace.


              The good news is that Tongdun still appears commercially active and technically deep. The bad news is that
              public evidence cannot answer the hardest questions about governance quality, financial resilience, or the
              true status of the legal overhang. That is why the risk chapter lands on a disciplined conclusion: this is
              not an avoid-on-sight risk profile, but it is absolutely a diligence-gated one, with clear thesis-break
              triggers around legal action, customer trust, and governance disruption.
