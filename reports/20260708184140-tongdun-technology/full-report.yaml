      - number: '8.2'
        title: Public valuation context says “possible unicorn,” not “clearly underpriced unicorn”
        blocks:
          - type: paragraph
            body: >-
              A ~US$1 billion-style private mark is not inherently implausible for Tongdun. Public comps show that
              fraud, identity, and risk vendors can sit below, around, or above that band depending on breadth,
              profitability, and trust. Mitek and Riskified trade in the sub-US$1 billion neighborhood, while much
              larger incumbents like NICE and Fiserv sit far above because they are broader, more mature, and more
              transparent. OneConnect is useful as a business-model adjacency comp for China financial technology, but
              it is not a clean apples-to-apples match.


              That context cuts both ways. It protects Tongdun from the claim that a unicorn-ish mark is absurd on its
              face. But it also prevents investors from claiming the price is obviously cheap. Without audited revenue,
              margin, retention, and cash metrics, the valuation case cannot be precision-led. It can only be range-led
              and scenario-led. That is why the right stance is conditional rather than enthusiastic.
            claimRefs:
              - CV011
              - CV012
