  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal and regulatory risk is the primary thesis threat
        blocks:
          - type: paragraph
            body: >-
              Tongdun’s biggest public-file risk is not product irrelevance; it is legal and regulatory exposure around
              a business model that processes sensitive data, drives consequential decisions, and sells into highly
              regulated customers. The privacy policy makes that plain by listing identity, payment, behavioral, device,
              and other sensitive categories, while Chinese data-security rules make formal protection obligations
              unavoidable. Even without a visible enforcement action in the fetched set, Tongdun operates in a zone
              where a privacy or data-processing failure could rapidly become commercial, regulatory, and reputational
              at the same time.


              That general compliance load is amplified by the litigation and controversy cluster. Multiple adverse
              sources describe disputes around credit-reporting or data-related issues connected to Tongdun and/or its
              founder. Investors should not overread any single article, but the cluster itself matters because bank
              procurement committees and counterparties rarely wait for final legal clarity before reassessing trust.
              The risk conclusion is therefore straightforward: legal and regulatory scrutiny is the top residual
              exposure until management can privately prove clean controls, current case status, and durable buyer
              confidence.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR019
              - CR020
              - CR021
              - CR022
              - CR034
