      - number: '1.3'
        title: Funding history, valuation anchors, and tracker conflicts
        blocks:
          - type: paragraph
            body: >-
              Tongdun’s capital history is well populated through 2019 and much thinner after that. The cleanest public
              event remains the April 2019 round of more than US$100 million, reported by 36Kr and echoed by EqualOcean,
              RegTech Analyst, and Taihe Capital, with stated use of proceeds including product innovation, AI research,
              global expansion, and talent recruitment. 36Kr also preserves a usable pre-2019 chronology covering angel,
              A+, B, B+, and C rounds. Tracxn adds a June 2019 later-stage round and a US$1 billion post-money valuation
              marker, which is the best directly fetched valuation anchor available in this run.


              The complication is that private-company trackers disagree on lifetime capital raised. Tracxn and The
              Company Check converge around roughly US$246 million across seven rounds, while PitchBook reports US$362
              million. Because PitchBook’s page does not expose the full underlying round math as clearly as the
              disclosed-round chronology, this chapter treats US$246 million as the conservative disclosed-round tally
              and the higher PitchBook number as unresolved tracker divergence rather than as settled truth. For later
              valuation work, the practical implication is that Tongdun still screens as a late-stage private unicorn
              with real institutional backing, but present-day entry price and preference-stack analysis cannot be
              completed from public evidence alone.
