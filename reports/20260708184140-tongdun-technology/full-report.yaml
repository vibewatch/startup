      - number: '1.2'
        title: Founder history, leadership continuity, and governance changes
        blocks:
          - type: paragraph
            body: >-
              Founder identity is one of the clearest parts of Tongdun’s story. Baidu Baike and long-form interview
              material both point to Jiang Tao as the founder who left Alibaba’s anti-fraud and security work to start
              Tongdun in 2013 after earlier engineering roles at IBM. That background is strategically important because
              it explains why Tongdun entered the market with fraud and risk-control credibility rather than with a
              generic enterprise-software narrative. It also helps explain why Tongdun’s product language consistently
              emphasizes decision engines, anti-fraud, graph analytics, and full-lifecycle financial-risk tooling rather
              than pure data-brokerage or pure consulting services.


              At the same time, 2025 reporting introduces a meaningful governance wrinkle: Tencent coverage says
              Tongdun’s legal representative, director, and manager roles moved from Jiang Tao to Wu Lei, while Jiang
              still retained 99.98% of Tongdun Holding. This implies that operating control and statutory role
              visibility may no longer be perfectly aligned. Publicly, that does not prove a control break or distress
              event, but it does mean later diligence cannot treat the founder title alone as a sufficient governance
              map. Chapter 1 therefore records two truths simultaneously: Jiang remains the central founder-figure and
              likely ultimate controller, while the visible legal-representative surface changed enough in 2025 to
              warrant direct follow-up on board structure, delegated authority, and why the company reduced public role
              concentration.
