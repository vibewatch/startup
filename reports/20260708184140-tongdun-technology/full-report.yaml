      - number: '8.4'
        title: Exit readiness is not yet publicly proven
        blocks:
          - type: paragraph
            body: >-
              Tongdun’s public file supports strategic relevance and possible future exit optionality, but it does not
              support near-term exit readiness in the public-market sense. For that, investors would need cleaner
              legal-status disclosure, audited current financials, clearer governance, and a better evidence trail
              around retention and concentration. Public markets do not just reward growth stories; they reward
              explainable stories with fewer hidden liabilities.


              That does not mean Tongdun lacks optionality. It means any investor should treat an eventual IPO or
              strategic exit as a contingent upside, not as a near-term base-case assumption. The diligence asks at the
              end of this chapter are therefore not housekeeping—they are the specific items that would convert Tongdun
              from an intriguing private asset into a priceable one. They also define the minimum evidence threshold for
              any investment committee memo that wants to move from watchlist interest to an actionable term-sheet
              posture.
            claimRefs:
              - CV031
              - CV032
              - CV034
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Tongdun is investable only as a conditional case, not a conviction case
            body: >-
              The public file supports strategic relevance but not premium-price confidence. Price discount or major
              evidence upgrade is required.
            calloutType: insight
            claimRefs:
              - CV017
              - CV020
