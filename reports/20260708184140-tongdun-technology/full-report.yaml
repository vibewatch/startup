          - type: callout
            title: Opacity, not lack of market, is the main valuation problem
            body: >-
              The company can be real, scaled, and still too hard to price. Missing audited economics and unresolved
              legal-status questions are the core blockers.
            calloutType: risk
            claimRefs:
