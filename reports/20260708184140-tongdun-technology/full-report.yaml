        title: Tongdun is selling a decisioning stack, not a single fraud point tool
        blocks:
          - type: paragraph
            body: >-
              The public product surface is broad and layered. Tongdun does not describe itself as a narrow anti-fraud
              vendor; it describes a decision-intelligence stack that spans financial risk, security risk, and
              government-governance scenarios, while the international TrustDecision surface packages platforms,
              solutions, products, services, and industry bundles. That matters because it changes how the company
              should be underwritten technically. The relevant question is not whether one model or one rule engine is
              good. The relevant question is whether Tongdun has built a reusable operating layer that can combine data
              collection, identity and device signals, graph intelligence, decision orchestration, and support services
              across multiple customer workflows.


              Public module breadth supports that reading. Archer appears to be the orchestration OS; Argus the
              fraud-operations layer; Pistis the credit and portfolio layer; surrounding products cover identity
              verification, application fraud, account protection, device intelligence, credit scoring, credit data, and
              payment-fraud prevention. In other words, Tongdun’s product story is about workflow control across the
              customer lifecycle, not just point detection. That gives it a plausible differentiation story versus
              narrower tools, but it also makes implementation, privacy, and roadmap diligence more important.
