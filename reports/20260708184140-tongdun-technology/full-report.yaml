      - number: '2.3'
        title: Buyers, users, and payers cluster around regulated financial workflows
        blocks:
          - type: paragraph
            body: >-
              The buyer map is relatively consistent across the fetched evidence. Banks and lenders buy Tongdun-like
              systems because they need better onboarding controls, transaction fraud screening, risk-based approvals,
              AML controls, and explainable monitoring inside increasingly digital channels. The operational users are
              usually risk teams, fraud teams, compliance teams, data and model teams, and platform or IT groups
              responsible for system integration and production reliability. The economic payer can vary: sometimes the
              fraud or risk budget owns the problem, sometimes a digital-transformation program does, and sometimes the
              decision expands only after early wins prove value. That is why these platforms often land through one
              acute workflow and then expand into broader decisioning.


              TrustDecision’s own finance positioning and banking case study are useful here because they show the
              purchase path from fragmented fraud tooling toward a unified decisioning layer. The old substitute is not
              “no spend”; it is a messy stack of siloed rules engines, bank-built scripts, legacy monitoring systems,
              and manual review queues. Expansion logic flows from the same infrastructure needs: once a bank trusts a
              vendor’s data integration, scoring, and low-latency execution path for transaction fraud, it becomes
              easier to extend into credit, AML, or identity modules. That makes the market attractive, but it also
              means buyer trust, regulatory fit, and deployment quality matter as much as raw model accuracy.
            claimRefs:
              - CM010
              - CM023
