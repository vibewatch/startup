      - number: '7.2'
        title: >-
          Operational risk sits in implementation complexity, support burden, and limited external reliability
          visibility
        blocks:
          - type: paragraph
            body: >-
              Operational risk is elevated because Tongdun does not appear to sell lightweight software. The banking
              case and service pages show deployments that depend on data integration, interface work, model or rule
              tuning, hardware or infrastructure alignment, and ongoing support. That is good for stickiness but risky
              for execution: projects can slip, hidden support effort can eat margins, and customer dissatisfaction can
              grow if vendor dependence becomes too high.


              The public file adds one more cautionary signal: many mitigation claims are real but not deeply
              verifiable. Company pages describe 24/7 support, local nodes, certifications, and human-in-the-loop
              workflows, yet the fetched set still lacks the kind of public status telemetry, detailed control reports,
              or incident archives that would let an outsider test those claims rigorously. This means investors can
              accept that Tongdun has a risk-management apparatus, but they should not yet accept that the apparatus is
              fully evidenced.
            claimRefs:
              - CR006
