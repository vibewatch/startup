- id: founder-governance
  title: Founder history, leadership continuity, and governance changes
  body: |-
    Founder identity is one of the clearest parts of Tongdun’s story. Baidu Baike and long-form interview material both point to Jiang Tao as the founder who left Alibaba’s anti-fraud and security work to start Tongdun in 2013 after earlier engineering roles at IBM. That background is strategically important because it explains why Tongdun entered the market with fraud and risk-control credibility rather than with a generic enterprise-software narrative. It also helps explain why Tongdun’s product language consistently emphasizes decision engines, anti-fraud, graph analytics, and full-lifecycle financial-risk tooling rather than pure data-brokerage or pure consulting services.

    At the same time, 2025 reporting introduces a meaningful governance wrinkle: Tencent coverage says Tongdun’s legal representative, director, and manager roles moved from Jiang Tao to Wu Lei, while Jiang still retained 99.98% of Tongdun Holding. This implies that operating control and statutory role visibility may no longer be perfectly aligned. Publicly, that does not prove a control break or distress event, but it does mean later diligence cannot treat the founder title alone as a sufficient governance map. Chapter 1 therefore records two truths simultaneously: Jiang remains the central founder-figure and likely ultimate controller, while the visible legal-representative surface changed enough in 2025 to warrant direct follow-up on board structure, delegated authority, and why the company reduced public role concentration.
  claimRefs:
  - CO006
  - CO007
  - CO008
  - CO034
  - CO038
  tableRefs:
  - TO002
  figureRefs:
  - FO002
- id: funding-valuation
  title: Funding history, valuation anchors, and tracker conflicts
  body: |-
    Tongdun’s capital history is well populated through 2019 and much thinner after that. The cleanest public event remains the April 2019 round of more than US$100 million, reported by 36Kr and echoed by EqualOcean, RegTech Analyst, and Taihe Capital, with stated use of proceeds including product innovation, AI research, global expansion, and talent recruitment. 36Kr also preserves a usable pre-2019 chronology covering angel, A+, B, B+, and C rounds. Tracxn adds a June 2019 later-stage round and a US$1 billion post-money valuation marker, which is the best directly fetched valuation anchor available in this run.

    The complication is that private-company trackers disagree on lifetime capital raised. Tracxn and The Company Check converge around roughly US$246 million across seven rounds, while PitchBook reports US$362 million. Because PitchBook’s page does not expose the full underlying round math as clearly as the disclosed-round chronology, this chapter treats US$246 million as the conservative disclosed-round tally and the higher PitchBook number as unresolved tracker divergence rather than as settled truth. For later valuation work, the practical implication is that Tongdun still screens as a late-stage private unicorn with real institutional backing, but present-day entry price and preference-stack analysis cannot be completed from public evidence alone.
  claimRefs:
  - CO009
  - CO010
  - CO011
