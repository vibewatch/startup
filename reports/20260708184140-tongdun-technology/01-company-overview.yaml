  evidenceGaps:
  - type: missing-source
    severity: material
    topic: board-governance
    missingEvidence: A current board roster, observer map, and delegated-authority structure for the parent and operating entities.
    whyItMatters: The 2025 legal-representative changes could be benign or significant; without a board map, governance risk remains under-specified.
    diligencePath: Obtain current corporate registry extracts, board materials, and management explanation for 2025 personnel changes.
    relatedQuestionRefs:
    - QO022
    relatedTableRefs:
    - TO002
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: A current audited revenue, ARR, margin, and cash profile tied to the actual operating entity.
    whyItMatters: Chapter 1 can establish scale and customer relevance, but not current monetization quality or runway.
    diligencePath: Request audited FY2024/FY2025 financials and management KPI packs.
    relatedQuestionRefs:
    - QO024
  - type: conflicting-data
    severity: material
    topic: capital-history
    missingEvidence: A reconciled capitalization table that explains why public trackers disagree on lifetime funding totals and whether post-2019 financing occurred.
    whyItMatters: Later valuation work depends on a clean total-raised figure, preference stack, and any subsequent secondary or structured financing.
    diligencePath: Request board-approved financing history and cap-table export; reconcile against Tracxn and PitchBook.
    relatedQuestionRefs:
    - QO021
    - QO023
    relatedTableRefs:
    - TO003
