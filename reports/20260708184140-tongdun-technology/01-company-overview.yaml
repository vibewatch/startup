- id: scale-milestones-and-adverse-context
  title: Scale, milestone progression, and why adverse events belong in chapter 1
  body: |-
    Public scale signals are strong enough to establish Tongdun as more than a niche vendor even if they are not strong enough to underwrite current revenue. Official material says the company serves more than 10,000 corporate clients and has offices across major Chinese cities plus Singapore and Jakarta. 36Kr said in 2019 that Tongdun already worked with more than 300 banks, while the international page says overseas services now cover more than 300 clients across markets including Singapore, Indonesia, Vietnam, the Philippines, India, Thailand, Mexico, and the United States. Customer-case material adds useful operating proof: one bank case claims annual detected or prevented losses near RMB200 million, and a long-form interview says a 2021 anti-fraud project helped freeze RMB670 million of suspected fraud funds for a joint-stock bank.

    But chapter 1 also has to record the fact that Tongdun’s public profile is no longer only about growth and scale. OECD.AI and several Chinese outlets reported in March 2024 that Tongdun and several executives faced prosecution linked to personal-information infringement. That event belongs in the chapter-1 timeline because it changes the baseline interpretation of later chapters: product strength, customer reach, and regulatory opportunity all now sit alongside live compliance and trust questions. The company can still be strategically relevant, but every later judgment has to incorporate this adverse context rather than treating it as a narrow legal footnote.
