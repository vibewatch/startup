  title: Installed-base signal is real even without audited revenue disclosure
  body: Official pages, customer cases, and 2019 press coverage consistently point to a large enterprise footprint, especially in banking. That makes Tongdun materially different from a speculative pre-scale AI vendor.
  claimRefs:
