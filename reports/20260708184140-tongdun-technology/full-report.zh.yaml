      - number: '5.2'
        title: 架构似乎以客户数据采集、信号增强和编排为中心
        blocks:
          - type: paragraph
            body: >-
              最干净的架构证据来自隐私政策与产品页面合读。TrustDecision 称客户通过 API 发送数据，并在选定客户端页面放置
              SDK；政策则详细列出系统中流动的信息类别：身份、支付、交易、行为、设备和连接数据。这意味着 Tongdun
              的公开运营模型始于客户环境内的数据埋点。在采集层之上，是身份增强、设备智能、模型评分、策略规则、知识图谱或关系逻辑，以及案件管理或组合工作流。


              工作流证据同样很宽。Account Protection 描述基于图谱的团伙识别和账户接管控制，Device Intelligence 增加实时设备与行为评分，Global Risk Persona 增加 IP
              / email / phone 风险 API，支付和信用表层则把决策从开户延伸到交易监控和组合控制。因此，架构看起来像一套分层决策系统：数据通过 API / SDK
              进入，经设备和身份服务增强，由模型与图谱逻辑评估，再由 Archer / Argus / Pistis
              路由到批准、拒绝、审核或下游服务工作流。这一图景足以方向性承销产品逻辑，但不足以验证每个内部依赖或模型控制实践。
