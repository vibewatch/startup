      - number: '8.2'
        title: 公开估值语境指向“可能是独角兽”，而不是“明显低估的独角兽”
        blocks:
          - type: paragraph
            body: >-
              约 US$1B 量级的私募估值标记，对 Tongdun 并非天然不合理。公开可比公司显示，欺诈、身份和风险厂商可以低于、接近或高于这一区间，取决于产品宽度、盈利能力和信任水平。Mitek 和 Riskified
              交易估值在低于 US$1B 的附近，而 NICE、Fiserv 等更大的在位者远高于此，因为它们更宽、更成熟，也更透明。OneConnect 可作为中国金融科技商业模式相邻可比，但不是完全可比对象。


              这个语境两面都切。它能挡住“独角兽级估值荒唐”的说法；但也让投资者无法声称价格显然便宜。没有经审计收入、利润率、留存和现金指标，估值论证就不能靠精确数字驱动，只能靠区间和情景驱动。因此，正确姿态是有条件，而不是热情追捧。
            claimRefs:
              - CV011
