        title: 融资历史可见；当前资本充足性不可见
        blocks:
          - type: paragraph
            body: >-
              2019 年前的资本历史锚定得较好，最近一轮明确披露融资的资金用途也很清楚：产品创新、AI 研究、扩张和招聘。这支持一个判断：Tongdun 用风险资本加深软件能力并扩大地域覆盖，而不是给表内信贷账本融资。但
              2019 年后，公开可见性急剧下降。数据平台对累计融资额有分歧，已抓取材料没有披露干净的后续融资轮次，也没有公开现金、烧钱速度、现金跑道或债务图景。


              这项缺失很关键，因为它把财务尽调变成一个二元问题：要么管理层能提供当前经审计财务和现金数据；要么外部投资者只能靠客户规模、产品深度和过时资本标记来承销。2025
              年资本减少和法定代表人变更报道并不能证明压力，但确实提高了直接核验资产负债表证据的必要性。因此，本章结论偏谨慎：Tongdun 看起来是一家真实、规模化的软件业务，确有客户
              ROI，但公开信息远不足以判断利润率质量、现金充足性，或未来融资事件的时间和必要性。
