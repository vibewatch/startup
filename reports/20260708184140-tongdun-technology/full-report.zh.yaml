      - number: '2.2'
        title: 规模口径：宏观增长强，中国口径精度弱
        blocks:
          - type: paragraph
            body: >-
              已抓取的市场报告方向上都很强，但类别定义差异很大。MarketsandMarkets 给出最清楚的 APAC 身份核验锚点：该类别从 2025 年 US$2.73 billion 增至 2030 年
              US$6.02 billion，CAGR 为 17.1%；BFSI 是最大垂直行业，访问控制 / 用户监控是增长最快的应用。The Business Research Company
              给出更宽的全球身份核验视角：2025 年 US$14.78 billion、2026 年 US$17.33 billion、2030 年 US$32.48 billion；IMARC 则给出更窄的 e-KYC
              口径，2025 年 US$948.8 million、2034 年 US$3.85 billion。AML 软件相邻市场也不小，从 2025 年 US$3.4 billion 增至 2026 年 US$3.92
              billion，并在 2030 年达到 US$6.85 billion。


              这些都是有用锚点，但不能不加调整地直接放进 Tongdun 估值模型。各发布方对市场定义略有不同：有的强调身份核验，有的强调欺诈检测软件，有的强调 AML 自动化，有的强调 e-KYC 开户。Tongdun
              横跨多层。正确做法不是抹平矛盾，而是保留矛盾：用公开大数证明 Tongdun 所售产品处在增长中的类别组合里；但中国单市场市占率和公司专属、干净的
              SAM，必须等到一手行业研究或管理层资料室给出更好的自下而上拆分后再定。
