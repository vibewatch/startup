      - number: '2.4'
        title: 增长驱动很强，但合规与数据摩擦仍然真实
        blocks:
          - type: paragraph
            body: >-
              最强需求驱动很容易识别：数字银行、在线支付、远程开户、实时支付，以及欺诈攻击越来越复杂。公开报告还显示，买方越来越需要集成式欺诈 + AML 运营模型，而不是单点工具。DataVisor 的 2026
              年调查尤其有用，因为它把理论转成运营者痛点：多数领导者担心 AI 驱动欺诈，许多人缺少足够数据质量来有效应对，近半数即便在尝试融合欺诈和 AML
              流程，仍受碎片化困扰。换句话说，需求拉力不只是市场在增长，而是威胁模型正在跑赢传统运营模型。


              主要约束同样重要。MarketsandMarkets 和 IMARC 都强调隐私、生物识别治理和本地数据控制要求；TrustDecision 银行案例和 KPMG China AML 法律说明则显示，中国机构面对
              PIPL、数据安全、AML、KYC、交易监控和受益所有人执行等多层义务。这些约束不会扼杀需求，而是塑造需求。它们创造了一个市场：本地部署、混合部署、可解释和可审计部署仍有价值；按国家推进会很慢；海外扩张之所以有吸引力，恰恰因为监管碎片化很难处理。对
              Tongdun 而言，这意味着公司确实卖进增长市场，但胜负手很可能是纪律严明的受监管工作流落地，而不是不受控的横向扩张。
