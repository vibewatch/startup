  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: Tongdun 卖的是决策栈，不是单一欺诈点工具
        blocks:
          - type: paragraph
            body: >-
              公开产品表层很宽，也很分层。Tongdun 并没有把自己描述为狭窄反欺诈供应商；它描述的是一套决策智能栈，横跨金融风险、安全风险和政府治理场景，而国际 TrustDecision
              表层则把平台、解决方案、产品、服务和行业套件打包呈现。这很关键，因为它改变了技术承销方式。相关问题不是某一个模型或某一个规则引擎好不好，而是 Tongdun
              是否搭出了一层可复用运营层，能把数据采集、身份与设备信号、图谱智能、决策编排和支持服务组合到多个客户工作流中。


              公开模块宽度支持这一读法。Archer 看起来是编排 OS；Argus 是欺诈运营层；Pistis
              是信用和组合层；周边产品覆盖身份核验、申请欺诈、账户保护、设备智能、信用评分、信用数据和支付欺诈防控。换句话说，Tongdun
              的产品故事是围绕客户生命周期做工作流控制，而不只是单点识别。这让它相对于更窄工具拥有一个可信差异化故事，但也让实施、隐私和路线图尽调更重要。
