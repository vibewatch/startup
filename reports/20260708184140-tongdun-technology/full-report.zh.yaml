      - number: '8.4'
        title: 退出准备度尚未被公开证明
        blocks:
          - type: paragraph
            body: >-
              Tongdun
              的公开材料支持战略相关性和未来退出可选性，但不支持公开市场意义上的近期退出准备度。要做到这一点，投资者需要更干净的法律状态披露、经审计的当前财务、更清晰的治理，以及围绕留存和集中度的更好证据链。公开市场奖励的不只是增长故事；它奖励负债暗坑更少、能讲清楚的故事。


              这不意味着 Tongdun 没有可选性。它意味着任何投资者都应把未来 IPO 或战略退出视为或有上行，而不是近期基准情景假设。因此，本章末尾的尽调问题不是例行清单——它们是把 Tongdun
              从一个有意思的私营资产转化为可定价资产的具体事项，也定义了任何想从观察名单兴趣推进到可执行 投资条款书姿态的投委会备忘录所需最低证据门槛。
