      - number: '7.3'
        title: 依赖、行业集中和模型不透明会快速传导风险
        blocks:
          - type: paragraph
            body: >-
              合作伙伴和依赖风险很关键，因为 Tongdun 的产品似乎织进了外部基础设施和数据生态。Huawei 和 AWS 支撑交付，Visa 和 Mastercard
              支撑争议处理工作流，征信机构和第三方数据提供商丰富决策，嵌入客户系统的 API 或 SDK
              决定系统实际能看见什么。任何一环退化，都会影响检测质量、客户运营或区域合规。公司证明材料偏重银行，又叠加了一层依赖：商业成功系于受监管金融机构的预算和采购周期。


              模型风险和这些依赖缠在一起。数据源噪声太大、规则太脆，或模型逻辑不透明到客户难以信任，后果不仅是误报和欺诈损失，也会体现为续约流失和销售放慢。公开证据支持 Tongdun
              有实质缓释措施，但也说明剩余模型和依赖风险不小，因为这门生意深度嵌入客户的关键决策。
