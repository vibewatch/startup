        title: GTM 看起来由银行牵引、企业销售很重，牵引代理指标强但不完美
        blocks:
          - type: paragraph
            body: >-
              Tongdun 的销售推进方式看起来是企业销售很重、以银行为中心，而不是走量
              SaaS。管理层描述过参与银行招标和依靠声誉获取企业客户，客户案例也描述了持续一年的建设，结合数据集成、接口工作、性能调优、模型训练和运营流程重构。这不是即插即用的消费者软件动作，更接近把关键任务风险栈卖进受监管机构，其中采购和价值证明比病毒式采用更重要。


              牵引代理指标是真实的，即便还不足以承销。36Kr 报道，2019 年时客户超过 10,000 家、信贷客户超过 5,000 家、累计调用量 70 billion 次、日均调用量 100 million 次；还称
              2018 年收入较 2017 年翻倍，并引用了超过 95% 的续约率。国际侧，Huawei 的 TrustDecision
              页面和银行案例补充了生产规模吞吐量和损失规避指标。这些信号有用，因为它们说明了真实采用和工作负载密度；但它们仍不够，因为没有披露每客户收入、毛利率，或交付负担中有多少仍落在 Tongdun 服务组织上。
