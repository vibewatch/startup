            body: >-
              从公开资料合理推断，Tongdun 的成本结构不像贷款机构或 BNPL 资产发起方那样依赖资产负债表，但在 R&D、集成和企业交付上可能相当重。最清楚的证据是定性而非数字。Tongdun
              公开材料强调自研产品集群、AI 研究、知识图谱、模型平台、决策引擎、隐私计算系统，以及与复杂金融环境的兼容性。2023 年访谈还指向近 1,000 件专利申请、近 500
              项软件著作权和技术权重很高的员工结构。这些事实不能揭示利润率，但强烈暗示工程费用会持续存在。


              实施负担又增加一层成本。银行案例描述了数据采集、软件接口、硬件部署、性能调优和长项目周期。TrustDecision
              产品页面同样强调无代码配置、测试、可审计性和组合监控，说明其运营模型是为大型、要求高的机构服务，而不是小型自助客户。这可以带来良好留存和更深钱包份额，但也意味着不能套用泛企业软件剧本来假设毛利率和回本周期。
