      - number: '7.4'
        title: 治理和人才风险只有靠私下证据才能判断是否可控
        blocks:
          - type: paragraph
            body: >-
              2025
              年实体和管理层变化让治理风险无法忽视。创始人可以在运营职责于集团内调整时仍保留强影响力，但投资者需要知道这些变化为何发生、银行客户是否注意到，以及控制和监督现在如何跨运营实体运转。这对一家技术密度高的公司尤其重要，因为专业产品、模型、数据和监管人才都很难替代。


              好消息是 Tongdun
              看起来仍有商业活跃度和技术深度。坏消息是，公开证据回答不了治理质量、财务韧性或法律悬而未决问题真实状态这些最难的问题。因此风险章节落在一个克制结论上：这不是一眼否决的风险画像，但绝对是一个必须过尽调门槛的机会；法律行动、客户信任和治理扰动都是清晰的投资假设破裂触发点。
