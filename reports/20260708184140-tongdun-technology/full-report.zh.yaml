  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户证据在受监管金融中最深，但表层不只覆盖银行
        blocks:
          - type: paragraph
            body: >-
              客户基础看起来以受监管金融为中心。银行、消费贷款机构、保险公司和其他金融相邻机构主导了最具体的公开引用，从 Tongdun 自己的案例清单，到 2025 年 QQ 文章和 2019 年 36Kr
              访谈都是如此。这意味着 Tongdun 最可防守的买方关系，仍是需要决策、欺诈控制或模型治理基础设施的受监管风险团队。也意味着客户集中风险更可能是行业性，而不是依赖某一个知名标杆客户。


              但表层并非只有银行。国际简介描述了数十个国家的 22 个行业和 118
              个场景，公开案例和解决方案页面也延伸到电商、游戏、票务、航空、出行和其他数字平台。正确读法因此是一个分层客户基础：金融仍是锚定细分市场，也很可能是最高信任收入来源；数字商业和相邻行业提供扩张可选性。宽口径客户数说法有用，但不如具名或结果明确的部署证据质量重要。主页也再次说明，公司仍面向多个风险密集型客户画像进行营销。
