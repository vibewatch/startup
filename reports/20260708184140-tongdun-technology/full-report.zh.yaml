      - number: '1.4'
        title: 规模、里程碑推进，以及为什么反向事件必须放进第 1 章
        blocks:
          - type: paragraph
            body: >-
              公开规模信号足以证明 Tongdun 不只是一个利基供应商，尽管还不足以承销当前收入。官方材料称公司服务超过 10,000 家企业客户，并在中国主要城市以及新加坡、雅加达设有办公室。36Kr 在 2019 年称
              Tongdun 已与 300 多家银行合作；国际页面则称海外服务现在覆盖新加坡、印度尼西亚、越南、菲律宾、印度、泰国、墨西哥和美国等市场的 300
              多个客户。客户案例材料也提供了有用的运营证明：一个银行案例声称每年识别或阻断损失接近 RMB200 million，一篇长篇访谈称 2021 年反欺诈项目曾帮助一家股份制银行冻结 RMB670 million
              涉嫌欺诈资金。


              但第 1 章也必须记录：Tongdun 的公开形象已经不再只是增长和规模故事。OECD.AI 和多家中国媒体在 2024 年 3 月报道称，Tongdun 及数名高管因涉嫌侵犯个人信息被起诉。该事件属于第 1
              章时间线，因为它改变了后续章节的基线解读：产品实力、客户覆盖和监管机会，如今都要与仍在场的合规和信任问题并列。公司仍可能具备战略相关性，但所有后续判断都必须纳入这层反向背景，不能把它当作狭窄法律脚注。
