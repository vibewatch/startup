  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：受监管决策，不是泛 AI
        blocks:
          - type: paragraph
            body: >-
              Tongdun 的真实市场，更应理解为受监管的决策基础设施，而不是无差别 AI 软件或宽泛网络安全。Tongdun 与 TrustDecision
              可见的产品表层覆盖欺诈管理、信用风险决策、身份核验、开户、AML、知识图谱分析和实时交易监控。这些功能嵌入高后果客户工作流：银行、金融科技公司和受监管数字业务，必须在欺诈压力和合规审查下快速做出通过、拒绝或加强验证的判断。换句话说，Tongdun
              竞争的地方，模型质量、延迟、可解释性和部署治理，比泛分析功能更重要。


              这条边界排除了企业 AI 的大部分支出，甚至也排除了网络安全的大部分支出。不能因为部分买方共享 CISO 或数据办公室预算，就把终端安全、SIEM
              或横向数据平台都算作可服务支出。更干净的框架是一层层看市场：宽口径的数字身份 / 欺诈 / AML / 决策 TAM；更窄的、以 APAC BFSI 为中心且 Tongdun 工作流匹配度最强的
              SAM；以及更紧的 SOM，即银行和持牌贷款机构愿意购买第三方决策栈，而不是完全依赖内部工具或单点供应商的部分。这个分层框架能防止报告把有用的宏观增长数据，扭成貌似精确的 Tongdun 市占率故事。
