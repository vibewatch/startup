      - number: '1.2'
        title: 创始人历史、领导层延续与治理变化
        blocks:
          - type: paragraph
            body: >-
              创始人身份是 Tongdun 故事中最清楚的部分之一。Baidu Baike 和长篇访谈材料都指向 Jiang Tao：他此前在 Alibaba 做反欺诈与安全工作，更早在 IBM 任工程岗位，2013
              年离开后创办 Tongdun。这段背景有战略意义，因为它解释了为什么 Tongdun 入场时带着欺诈和风控可信度，而不是泛企业软件叙事。也解释了为什么 Tongdun
              的产品语言一直强调决策引擎、反欺诈、图谱分析和全生命周期金融风险工具，而不是纯数据经纪或纯咨询服务。


              与此同时，2025 年报道引入了一个重要治理褶皱：Tencent 报道称，Tongdun 的法定代表人、董事和经理职务从 Jiang Tao 转给 Wu Lei，而 Jiang 仍持有 Tongdun
              Holding 99.98% 股权。这意味着经营控制和法定职务可见性可能不再完全重合。公开层面看，这并不能证明控制权断裂或公司陷入困境，但也意味着后续尽调不能只凭创始人头衔来画治理图。第 1
              章因此同时记录两个事实：Jiang 仍是核心创始人形象，也很可能是最终控制人；但 2025 年可见法定代表人表层变化足够明显，董事会结构、授权安排以及公司为何降低公开职务集中度，都需要直接追问。
