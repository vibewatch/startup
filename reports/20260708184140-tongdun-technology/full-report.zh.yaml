      - number: '1.3'
        title: 融资历史、估值锚点与数据平台冲突
        blocks:
          - type: paragraph
            body: >-
              Tongdun 的资本历史到 2019 年之前资料充足，之后明显变薄。最清楚的公开事件仍是 2019 年 4 月超过 US$100 million 的融资，36Kr 报道后 EqualOcean、RegTech
              Analyst 和 Taihe Capital 也有呼应；披露募资用途包括产品创新、AI 研究、全球扩张和人才招聘。36Kr 还保留了可用的 2019 年前轮次时间线，覆盖天使轮、A+、B、B+ 和 C
              轮。Tracxn 补充了 2019 年 6 月后期轮次和 US$1 billion 投后估值标记，这是本次可直接抓取的最佳估值锚点。


              难点在于，私营公司数据平台对累计融资额意见不一。Tracxn 和 The Company Check 大致收敛在七轮约 US$246 million，PitchBook 则报告 US$362 million。由于
              PitchBook 页面没有像已披露轮次时间线那样清楚展示底层轮次数学，本章把 US$246 million 视为保守的已披露轮次合计，把更高的 PitchBook
              数字视为未解决的数据平台分歧，而不是确定事实。对后续估值工作而言，实际含义是：Tongdun 仍筛选为一家有真实机构支持的后期私营独角兽，但当下入场价格和优先股堆叠分析，无法只靠公开证据完成。
