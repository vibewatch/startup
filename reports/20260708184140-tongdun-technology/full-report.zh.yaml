  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型很宽、定制化强，软件与服务大概率混合
        blocks:
          - type: paragraph
            body: >-
              尽管公开记录不能支持一个干净的当前收入数字，但它足以支持一个相当清楚的变现机制结论。Tongdun 似乎通过软件平台、决策引擎、模型管理工具、图谱和分析能力，以及配套实施或咨询服务组合变现。36Kr
              明确描述客户购买的内容从软件、平台到信息、模型和业务策略都有；Tongdun 和 TrustDecision 材料也强调端到端工作流解决方案，而不是狭窄
              API。这一组合意味着收入流横跨平台授权、项目实施以及持续运营或优化支持，而不是纯自助 SaaS 模式。


              定价看起来高度定制化。管理层曾告诉
              36Kr，收费会随客户类型、用例和项目而变化，这与公开网站没有展示的内容一致：已抓取材料中基本看不到透明标价。这是企业工作流软件的典型信号，通常伴随长销售周期和定制化部署范围。对尽调而言，含义有两面。定制包装可以支撑更高
              ACV 和黏性扩张，但也往往把经常性软件经济性与较重服务内容和更长实施尾巴混在一起，让外部更难承销收入质量。
