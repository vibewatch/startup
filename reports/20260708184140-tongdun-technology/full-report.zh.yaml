chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、品牌架构与当前公司表层
        blocks:
          - type: paragraph
            body: >-
              Tongdun 的核心身份仍然最容易从自有网站确认，而不是靠单一注册信息或数据平台。Tongdun.com 继续把公司描述为基于 AI 的决策智能提供商，聚焦金融风险、安全风险和政府治理场景；tongdun.cn
              站点则已经转向 Xiaodun Future 品牌，页脚列出 Zhejiang Xiaodun Future Technology Co., Ltd.。Tongdun 面向印度尼西亚的英文公司页仍保留较早的
              Tongdun 名称，把集团描述为总部位于杭州的第三方智能风险管理与决策提供商，并称超过 10,000 家企业客户已经采用其产品。合在一起看，公开表层说明该业务商业上仍借 Tongdun
              品牌展开，但国内网站身份和法律实体呈现，已经比 2019 年融资周期时更分层。


              这一分层很关键，因为后续尽调要先弄清究竟是哪一个实体或品牌拥有客户合同、IP、合规义务和国际市场拓展活动。就第 1 章而言，最稳妥的综合判断是：Tongdun 是投资者和客户会识别的伞状运营身份，Xiaodun
              Future 是中国站点上可见的较新国内公司呈现，TrustDecision
              则是海外反欺诈、信用风险和合规产品使用的对外国际品牌。多个活跃品牌表层并不致命，但确实让合同链条、治理和披露规范成为真实尽调事项；投资者不能把公开网站叙事直接当成一张完全清晰的公司地图。
