  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律和监管风险是投资假设的首要威胁
        blocks:
          - type: paragraph
            body: >-
              公开材料里，Tongdun
              最大风险不是产品无关紧要，而是其商业模式带来的法律和监管暴露：它处理敏感数据、影响重大决策，又卖给高度受监管的客户。隐私政策列出身份、支付、行为、设备等敏感类别，已经把问题讲得很清楚；中国数据安全规则也让正式保护义务无法回避。即便抓取材料中没有看到明确执法行动，Tongdun
              仍处在一个高敏感区：隐私或数据处理一旦失守，商业、监管、声誉风险会同时放大。


              一般合规负担又被一组诉讼和争议信号放大。多个负面来源描述了与 Tongdun
              和/或其创始人相关的征信或数据争议。投资者不应过度解读任一单篇文章，但这一组争议信号本身重要，因为银行采购委员会和交易对手很少等到最终法律结论才重新评估信任。因此风险结论很直接：管理层能私下证明控制干净、案件状态清晰、买方信心稳固之前，法律和监管审视都是最大剩余暴露。
