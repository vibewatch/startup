      - number: '8.3'
        title: 建议应对价格敏感、对证据敏感，并可在证据改善后上调
        blocks:
          - type: paragraph
            body: >-
              仅看公开材料，建议是跟踪 / 继续研究。这不是软答案，而是价格敏感的答案。如果管理层能私下证明软件式经常性收入质量、压住法律和治理悬而未决问题，并拿出足够的客户集中度和留存数据来支撑溢价倍数，Tongdun
              可以在纪律性入场价下变得可投。若这些证明失败，它也可能继续过于高风险。换句话说，关键变量不是 Tongdun 是否有意思，而是足够多缺失证据能否转化为持久的投资判断信心。


              因此，情景框架应保持明确。牛市情景需要真实的软件经济性和可控的信任风险；基准情景假设它是一个扎实但部分偏服务的企业风险平台；熊市情景假设不透明、集中度或法律摩擦把公允价值拉到远低于独角兽状态。基于区间的方法比单一目标价更诚实，也比对公司战略位置的模糊赞赏更适合
