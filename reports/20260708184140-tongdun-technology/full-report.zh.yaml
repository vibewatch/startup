        title: 本地决策深度可能构成护城河，但边缘层商品化风险真实存在
        blocks:
          - type: paragraph
            body: >-
              Tongdun 的护城河论证，在买方需要银行专属、全生命周期决策而不是单点方案时最强。公开客户案例材料强调模型管理、知识图谱、银行中台控制和多渠道欺诈运营——这些能力一旦嵌入，就会变得黏性很强。Quantexa
              是决策智能雄心上最明显的概念同业，OneConnect 则是中国金融数字化中最明显的广义既有挑战者。相比之下，Riskified、Jumio、ComplyAdvantage 或 Mitek
              等供应商可以在较窄切片里很强，却未必会取代 Tongdun 的整套栈。


              在身份核验和 AML 上，护城河论证会变弱，因为市场明显拥挤，专业厂商拥有全球化叙事、合作伙伴和合规工具。公开证据也没有展示直接客户重叠中的胜率、定价权或流失。因此，正确结论不是 Tongdun
              拥有牢不可破的护城河；而是 Tongdun 很可能在受监管银行工作流中拥有可防守的本地平台位置，同时仍在单项能力层面对真实商品化压力，也在市场拓展上面对更知名全球同业的真实压力。
