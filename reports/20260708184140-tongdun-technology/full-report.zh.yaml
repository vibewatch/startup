  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图横跨既有巨头、专业厂商和编排平台
        blocks:
          - type: paragraph
            body: >-
              Tongdun 面对的不是一个干净同业集合。公开证据至少指向三个重叠竞技场。第一类是 OneConnect
              这样的广义金融基础设施或银行数字化玩家，它们用更宽的数字化转型故事卖给银行，覆盖银行、保险、政府和企业工作流。第二类是 Quantexa、Alloy 以及某种意义上的 TrustDecision
              这样的决策与编排同业，它们把问题描述为连接数据、规则、工作流和政策的统一风险或决策层。第三类是更窄但很强的专业厂商，如
              Jumio、Socure、Mitek、Onfido、SEON、ComplyAdvantage、Riskified 和 FraudNet，从身份、AML、商户欺诈或企业欺诈用例切入。


              这种结构很重要，因为 Tongdun 的竞争优势会随交易类型变化。中国或东南亚银行如果寻找集成式反欺诈、信用风险和模型治理栈，Tongdun 可能像一个有本地工作流可信度的平台供应商。全球数字开户或商户欺诈
              RFP 中，它可能只是众多身份和欺诈提供商之一，且要面对更知名的英文品牌。第 3 章因此把竞争视为从广义既有巨头到聚焦专业厂商的光谱，而不是假装 Tongdun 只有一个静态同业组。
