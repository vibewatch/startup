      - number: '3.3'
        title: 决策核心一旦嵌入，切换成本会急剧上升
        blocks:
          - type: paragraph
            body: >-
              核心竞争问题不是银行能否从许多供应商那里采购身份、欺诈或 AML 工具——它们当然可以。真正的问题是，多供应商并用在哪里结束，编排锁定又在哪里开始。TrustDecision 银行案例和 Alloy
              编排定位中的客户证据显示，一旦某个供应商成为协调决策层——路由数据、模型、规则和案件处理——切换成本就会显著上升。替换不再只是买一个新评分：它意味着重建集成逻辑、重新训练运营、重新验证模型，并重新赢得合规信任。Tongdun
              看起来正想在这里竞争。


              分销力量会放大这一点。OneConnect 可以从更宽的既有金融数字化姿态销售；Alloy、Jumio 等全球供应商依赖生态宽度、合作伙伴网络和更清晰的全球品牌表层；Tongdun
              的分销优势看起来更本地、更工作流导向，建立在中国及区域银行风控可信度上。Tongdun 的风险在于，全球品牌清晰度和生态开放度，在跨境 RFP
              中可能成为强替代。抵消因素是，在高度受监管部署里，本地银行集成深度和监管细微差异，仍可能比光鲜全球营销更重要。
