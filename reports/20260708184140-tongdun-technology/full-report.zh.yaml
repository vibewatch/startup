            body: >-
              运营风险偏高，因为 Tongdun
              看起来卖的不是轻量软件。银行案例和服务页面显示，部署依赖数据集成、接口开发、模型或规则调优、硬件或基础设施适配，以及持续支持。这有利于黏性，但执行风险也高：项目可能延期，隐性支持投入会吃掉利润率，供应商依赖过高时客户不满也会累积。


              公开材料还有一个警示信号：很多缓释主张成立，但可验证深度不足。公司页面描述了 24/7
              支持、本地节点、认证和人工介入工作流，但抓取材料仍缺少公开状态遥测、详细控制报告或事故档案，外部人无法严格测试这些主张。也就是说，投资者可以承认 Tongdun
              有一套风险管理体系，但还不能认为这套体系已有充分证据。
            claimRefs:
              - CR006
              - CR007
