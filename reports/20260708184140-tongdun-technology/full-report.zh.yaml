  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 公司投资逻辑真实存在，但反面逻辑比价格支撑更强
        blocks:
          - type: paragraph
            body: >-
              Tongdun 有真实的投资逻辑。公开来源支持它已经做出一门规模化风险决策业务：金融机构渗透有分量，产品覆盖广，客户部署看起来也明显不是幻灯片式项目。这一点重要，因为很多私营 AI
              公司连证明自己是真实运营业务的第一道门槛都过不了。Tongdun 可以过。材料中更强的部分是客户规模、工作流宽度，以及至少部分生产部署规模大、运营意义明确的证据。


              问题在于，反面逻辑攻击的是支撑溢价最关键的叙事部分。公开追踪平台对融资和估值标记并不一致，当前收入和利润率未披露，治理 /
              法律悬而未决问题也没有解决。放到估值里，这意味着公司值得战略关注，但还不值得快速给出买入建议。叙事质量高于证据质量，估值纪律必须尊重这个缺口。
            claimRefs:
              - CV001
