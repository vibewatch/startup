- id: deployment-proof
  title: The strongest customer evidence comes from outcome-specific production deployments
  body: |-
    Tongdun’s best customer proof is not the raw customer count. It is the set of production deployments with quantified outcomes. The bank cases show large-scale decisioning and fraud-control usage inside Chinese financial institutions; the Indonesian lending case shows a clear international lending deployment; the e-commerce and mobility cases show the stack being used outside pure finance; and the digital-commerce account-protection pages surface another ticketing example with measurable fraud-blocking impact. These are stronger than logos because they tie a workflow to a result.

    The weakness is that many of the proofs are anonymized or partially anonymized. That does not make them worthless, especially when they include concrete metrics, but it does mean investors cannot easily map proof quality to logo quality, contract size, or renewal value. So the customer chapter should be read as follows: Tongdun has credible production proof across multiple segments, but public evidence remains much better at proving usage than at proving customer identity, concentration, or economics.
  claimRefs:
