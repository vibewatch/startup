- id: retention-and-expansion
  title: Retention looks plausible; expansion paths are visible; hard durability metrics are missing
  body: |-
    Public evidence suggests Tongdun’s relationships can be sticky. The clearest signal is the 95%+ renewal claim from 36Kr, and the deeper signal is architectural: once a bank, lender, merchant, or platform embeds APIs, device intelligence, rule logic, and operational workflows, switching costs rise materially. Cross-sell pathways also show up clearly in the product/customer surface: onboarding can expand into login protection, payments, portfolio monitoring, and dispute operations.

    Still, the public file does not give investors the metrics they would normally want. There is no NRR, GRR, segment churn, contract term, or cohort data. Case studies prove that customers can get value, but they do not prove that those customers renew at scale, expand spend predictably, or avoid concentration in a few regulated verticals. The practical implication is that customer durability must be diligence-led, not inferred from product depth alone.
  claimRefs:
  - CU025
  - CU026
  - CU027
  - CU028
  - CU029
  - CU032
  - CU034
