  - FU004
- id: procurement-and-trust-friction
  title: Procurement freshness is real, but trust and anonymity still create friction
  body: |-
    The 2025 QQ article is useful because it suggests Tongdun continues to win bank-related projects and expand into other regulated customers. That reduces the risk that the company’s customer story is frozen in a 2019 venture narrative. But it does not answer the hard commercial questions: how large are those deals, how many are production deployments, and how many convert into durable multi-year accounts.

    Trust and governance also matter because Tongdun sells into regulated buyers. Privacy, governance, or entity-change controversies can slow procurement, especially when public customer proof is already somewhat anonymized. That is why customer diligence must focus on top-account revenue, renewal cohorts, deployment stage by logo, and pipeline conversion by segment. Public evidence supports real adoption; it does not close the case on concentration or durability.
  claimRefs:
