chapter:
  number: 6
  title: Customers
  summary: Tongdun’s customer evidence is strongest in regulated finance but extends into e-commerce, ticketing, mobility, and other digital-platform segments. Public sources support real customer scale and several production deployments with concrete outcomes, including Chinese bank cases, an Indonesian lending case, an e-commerce promo-abuse case, and an EV charging case. The main weaknesses are anonymized customer identity, missing cohort retention data, and unresolved concentration risk.
sections:
- id: segments-and-scale
  title: Customer proof is deepest in regulated finance, but the surface is broader than banking alone
  body: |-
    The customer base appears centered on regulated finance. Banks, consumer lenders, insurers, and other finance-adjacent institutions dominate the most concrete public references, from Tongdun’s own case inventory to the 2025 QQ article and the 2019 36Kr interview. That implies Tongdun’s most defensible buyer relationship is still the regulated risk team that needs decisioning, fraud control, or model-governance infrastructure. It also means customer concentration risk is more likely to be sectoral than dependent on one famous logo.

    That said, the surface is not bank-only. The international profile describes 22 industries and 118 scenarios across dozens of countries, while public cases and solution pages reach into e-commerce, gaming, ticketing, airlines, mobility, and other digital platforms. The right reading is therefore a layered customer base: finance remains the anchor segment and likely the highest-trust revenue source, while digital-commerce and adjacent sectors provide expansion optionality. The broad customer-count claims are useful, but they are less important than the quality of named or outcome-specific deployment evidence. The homepage also reinforces that the company still markets itself to multiple risk-heavy customer archetypes.
