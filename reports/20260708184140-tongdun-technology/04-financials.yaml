- id: gtm-and-traction-proxies
  title: GTM looks bank-led and enterprise-heavy, with strong but imperfect traction proxies
  body: |-
    Tongdun’s go-to-market motion looks enterprise-heavy and bank-centered rather than volume SaaS. Management described participation in bank tenders and reputation-led enterprise acquisition, and customer cases describe year-long builds that combine data integration, interface work, performance tuning, model training, and operating-process redesign. This is not a plug-and-play consumer software motion. It is closer to selling a mission-critical risk stack into regulated institutions, where procurement and proof of value matter more than viral adoption.

    The traction proxies are real even if they are not enough for underwriting. 36Kr reported over 10,000 clients, over 5,000 credit clients, 70 billion cumulative calls, and 100 million average daily calls by 2019. It also said 2018 revenue doubled versus 2017 and quoted a reported renewal rate above 95%. On the international side, Huawei’s TrustDecision page and the banking case add production-scale throughput and loss-avoidance metrics. Those signals are useful because they show real adoption and workload density. They are insufficient because they do not reveal revenue per client, gross margin, or how much of the delivery burden still sits on Tongdun’s services organization.
