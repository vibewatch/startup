chapter:
  number: 4
  title: Financials
  summary: Tongdun’s public evidence supports a real platform business with broad client scale, high workflow intensity, and meaningful customer-ROI examples, but not a current underwriteable P&L. The likely model is a customized platform-plus-services mix with strong recurring characteristics and high R&D / integration demands, while cash, margins, runway, and post-2019 financing remain opaque.
sections:
- id: revenue-model
  title: Revenue model is broad, customized, and probably mixed between software and services
  body: |-
    The public record supports a surprisingly clear conclusion about monetization mechanics even though it does not support a clean current revenue number. Tongdun appears to monetize a mix of software platforms, decision engines, model-management tools, graph and analytics capabilities, and associated implementation or advisory services. 36Kr explicitly described customers buying everything from software and platforms to information, models, and business strategies, while Tongdun and TrustDecision materials emphasize end-to-end workflow solutions rather than narrow APIs. That combination implies revenue streams spanning platform licensing, project implementation, and ongoing operational or optimization support rather than a pure self-serve SaaS model.

    Pricing appears highly customized. Management told 36Kr that charging varies by customer type, use case, and project, which fits what the public websites do not show: there is effectively no transparent list pricing anywhere in the fetched set. That is a classic sign of enterprise workflow software with long sales cycles and tailored deployment scopes. For diligence, the implication is two-sided. Custom packaging can support higher ACVs and sticky expansion, but it also tends to mix recurring software economics with heavier services content and longer implementation tails, making revenue quality harder to underwrite from outside.
