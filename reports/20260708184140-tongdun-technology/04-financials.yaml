- id: cost-structure-and-operating-model
  title: Cost structure likely remains R&D-heavy and integration-heavy
  body: |-
    A reasonable public read is that Tongdun’s cost structure is not balance-sheet-heavy in the way a lender or BNPL originator would be, but it is probably meaningfully heavy in R&D, integration, and enterprise delivery. The clearest evidence is qualitative rather than numerical. Tongdun’s public materials emphasize proprietary product clusters, AI research, knowledge graphs, model platforms, decision engines, privacy-computing systems, and compatibility with complex financial environments. The 2023 interview also points to nearly 1,000 patent applications, nearly 500 software copyrights, and a very technically weighted workforce. Those facts do not reveal margins, but they do strongly imply persistent engineering expense.

    Implementation burden adds another cost layer. The bank case describes data collection, software interfaces, hardware deployment, performance tuning, and long project cycles. TrustDecision’s product pages similarly emphasize no-code configuration, testing, auditability, and portfolio monitoring, all of which suggest an operating model built to serve large, demanding institutions rather than small self-serve customers. That can create good retention and deeper wallet share, but it also means gross margin and payback cannot be assumed from generic enterprise-software playbooks.
