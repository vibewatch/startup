- id: capital-and-underwriting-gaps
  title: Funding history is visible; current capital adequacy is not
  body: |-
    Capital history through 2019 is reasonably well anchored, and the use of proceeds from the last clearly disclosed round is explicit: product innovation, AI research, expansion, and hiring. That supports the view that Tongdun used venture capital to deepen software capability and widen geographic coverage, not to finance an on-balance-sheet credit book. But public visibility drops off sharply after 2019. Trackers disagree on lifetime funding totals, no clean later financing round is disclosed in the fetched set, and there is no public cash, burn, runway, or debt picture.

    That absence matters because it turns financial diligence into a binary exercise: either management can supply current audited financials and cash data, or outside investors are left underwriting on customer scale, product depth, and stale capital markers alone. The 2025 report of capital reduction and legal-representative change does not prove stress, but it does increase the need for direct balance-sheet evidence. The chapter’s verdict is therefore cautious: Tongdun appears to be a real, scaled software business with genuine customer ROI, but public information is nowhere near enough to judge margin quality, cash sufficiency, or the timing and necessity of a future financing event.
