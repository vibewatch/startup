    approximationNotes: "The nested order is an analytical presentation of distinct evidence lenses, not a proportional or additive market calculation."
    claimRefs: [CM005, CM007, CM008]
callouts:
  - calloutType: insight
    title: The addressable unit is the vehicle program
    body: "DeepRoute.ai's market access is best evaluated through model-program wins, approved deployment, and repeatable per-vehicle economics rather than the gross value of mobility services."
    claimRefs: [CM001, CM003, CM010]
  - calloutType: assumption
    title: SAM and SOM remain open
    body: "A defensible SAM/SOM requires current OEM pipeline, contract scope, pricing, geography, and customer concentration evidence that the retained public sources do not disclose."
    claimRefs: [CM009, CM014]
