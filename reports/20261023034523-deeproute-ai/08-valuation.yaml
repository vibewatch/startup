company:
  name: DeepRoute.ai
chapter:
  number: 8
  title: Valuation
  summary: DeepRoute.ai shows meaningful production traction and strategic OEM funding, but public evidence does not disclose revenue, margins, cash runway, cap-table terms, or a current company valuation. The evidence therefore supports a track/research-more posture rather than a price-insensitive buy.
sections:
  - id: recommendation
    title: Price-sensitive recommendation
    body: >-
      The investable signal is commercial scale, not a verified valuation. DeepRoute.ai said it was on track to exceed 200,000 equipped production vehicles by the end of 2025 and reported nearly 40% of China's third-party urban autonomous-driving supplier segment in October, while an independent 36Kr report described Great Wall Motor and Leapmotor as two core customers. Those facts support a credible route from engineering capability to OEM volume. They do not establish revenue recognition, per-vehicle pricing, gross margin, cash conversion, or an ownership-adjusted entry price. The recommendation is therefore track, with research-more diligence before underwriting a buy.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV016]
    tableRefs: [TV001]
  - id: thesis-antithesis
    title: Thesis, anti-thesis, and financing context
    body: >-
      The thesis is that production deployment, repeatable OEM integration, and a unified platform could create operating leverage as volume expands. DeepRoute.ai disclosed $450 million raised in total, including $100 million in Series C1 funding, and CnEVPost reported that the Series C1 investor was Great Wall Motor after DeepRoute became a supplier. The anti-thesis is that strategic financing may reflect customer alignment more than arm's-length price discovery, while independent coverage described a narrowing capital window, converging technical paradigms, rising compute and data costs, and possible pressure to list before the market reprices the category. Without a current financing price or financial statements, a fair-value conclusion remains conditional.
    claimRefs: [CV006, CV007, CV008, CV009, CV010, CV011]
    tableRefs: [TV002]
  - id: scenarios-and-diligence
    title: Scenarios and decision gates
    body: >-
      The scenarios below are decision frameworks rather than forecasts. The bull case requires production volume to convert into disclosed recurring or per-vehicle economics, sustained OEM adoption, and a credible expansion path into robotaxi or other physical-AI applications. The base case assumes commercial traction continues but valuation remains bounded by customer concentration, strategic capital, and opaque profitability. The bear case is triggered by weak economics, internalized OEM stacks, regulatory or safety setbacks, or an IPO process that exposes a lower-quality financial profile. A price-sensitive investor should require a current cap table, latest round price, liquidation preferences, revenue by customer, gross margin, burn, runway, and IPO filing evidence before setting a target return.
    claimRefs: [CV012, CV013, CV014, CV015]
    tableRefs: [TV003]
    figureRefs: [FV001]
