    columns: [Argument, Evidence, What would change the view]
    rows:
      - [Production scale can support a repeatable OEM business, "Company reported more than 200,000 production vehicles targeted by year-end 2025; Smart coverage reported more than 30,000 equipped vehicles in four months.", "Audited vehicle-to-revenue conversion, pricing, gross margin, and renewal or model-cycle evidence."]
      - [Strategic capital can accelerate commercialization, "Series C1 raised US$100 million from a Chinese automotive OEM; CnEVPost identified Great Wall Motor.", "Arm's-length round terms, ownership, preference stack, and cash balance."]
      - [The market may reward broader physical-AI positioning, "36Kr/KrASIA described RoadAGI and physical-AI positioning alongside a potential Hong Kong listing.", "Filed prospectus, segment economics, and evidence that new applications produce revenue rather than narrative value."]
      - [Valuation may compress despite technical traction, "36Kr/KrASIA reported converging technical paradigms, a narrowing capital window, and rising compute/data costs.", "Independent valuation comps, financing marks, and a demonstrated path to positive gross profit."]
    notes: >-
      Independent reporting is quoted as market context; company-issued releases are treated as company claims rather than independent validation.
    claimRefs: [CV002, CV006, CV007, CV008, CV009, CV010]
  - id: TV003
    title: Bull / base / bear scenario framework
    columns: [Scenario, Explicit assumptions, Valuation / return logic, Key risk or trigger, Probability signal]
    rows:
      - ["Bull", "Production volume converts to disclosed high-margin OEM software or platform revenue; OEM pipeline expands; robotaxi or RoadAGI becomes monetizable.", "Upside is supportable only after a current round or IPO price and revenue denominator establish an entry multiple.", "Internalized OEM stack, safety event, or failed commercialization.", "Low-to-medium; several operating milestones are company-reported and monetization is unverified."]
      - ["Base", "Production deployment continues, but customer concentration and strategic financing remain material; no verified valuation anchor emerges.", "Track rather than buy; wait for price, revenue, margin, cap-table, and runway evidence.", "Flat or compressed category multiples and delayed listing.", "Medium; best fit to current evidence quality."]
      - ["Bear", "Volume growth fails to produce cash economics or an IPO exposes weak margins; regulation, safety, or OEM insourcing disrupts demand.", "Downside is open-ended without liquidation preferences, cash, debt, and ownership data.", "Down round, listing delay, customer loss, or material incident.", "Medium; adverse pathways are plausible but not quantified."]
    notes: >-
      These are qualitative scenarios, not probability-weighted valuation outputs. No precise valuation range is authored because the retained evidence lacks a current price and financial denominator.
    claimRefs: [CV011, CV012, CV013, CV014, CV015]
