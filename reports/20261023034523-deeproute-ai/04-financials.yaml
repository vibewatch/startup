company:
  name: DeepRoute.ai
chapter:
  number: 4
  title: Financials
  summary: DeepRoute.ai has disclosed multiple monetization paths, rising production deployment, and access to strategic capital, but the assigned public evidence does not disclose recognized revenue, realized pricing, gross margin, cash, burn, or runway. The financial case therefore remains a scale thesis rather than an underwritable earnings or liquidity case.
sections:
  - id: monetization-and-traction
    title: Monetization and observable traction
    body: >-
      CNBC described three historical monetization paths: passenger charges or revenue
      sharing for robotaxis, one-time and annual fees for autonomous-driving systems sold
      to automakers, and either operated fleets or technology sales in logistics. The
      production evidence is newer but remains nonfinancial. DeepRoute.ai said about
      20,000 DeepRoute IO-equipped vehicles had been delivered since August 2024, while
      EVmagz later reported about 200,000 vehicles fitted with urban NOA and a nearly 40%
      share of the third-party urban-NOA supplier market in October 2025. These figures
      have different products, dates, and issuers, so they cannot be combined into a
      growth rate or converted into recognized revenue. 36Kr also identified Great Wall
      and Leapmotor as core customers, making contract mix and customer concentration
      central diligence questions.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006]
    tableRefs: [TI001]
  - id: pricing-costs-and-margin-path
    title: Pricing, costs, and margin path
    body: >-
      The only quantitative pricing evidence in the assigned pool concerns historical
      system cost, not customer price. TechCrunch reported in 2022 that DeepRoute.ai had
      reduced the stated cost of an L4 package by about 70% to $3,000. The same report,
      using a company-provided breakdown, put five lidar sensors at about 50% of package
      cost and the chip at 30%. That establishes hardware sensitivity for one older L4
      configuration, but it does not reveal current bill of materials, realized license
      price, discounts, integration labor, cloud and data costs, warranty expense, or
      gross margin. 36Kr's account adds an adverse industry signal: compute investment
      and data closed-loop costs were rising as suppliers competed on scale. Public
      deployment therefore supports commercial relevance, not software-like unit
      economics.
    claimRefs: [CI007, CI008, CI012]
    tableRefs: [TI002]
    figureRefs: [FI001]
  - id: capital-adequacy-and-underwriting
    title: Capital adequacy and underwriting blockers
    body: >-
      Strategic financing has funded development, but funding raised is not cash
      available. DeepRoute.ai's 2024 release said its $100 million Series C1 would support
      research and development, global automaker collaboration, robotaxi exploration, and
      hiring. CNBC and Wikipedia also corroborate a $300 million Alibaba-led Series B in
      2021. Neither disclosure supplies a current cash balance, monthly burn, debt,
      restricted proceeds, committed capex, or runway. 36Kr reported that DeepRoute.ai
      submitted Hong Kong listing materials by the end of 2025 and described a colder
      private funding market alongside rising capital needs. EquityZen and Caplight expose
      only gated or blank public financial fields, while Simplify's percentage headcount
      trend lacks an absolute employee denominator. The evidence supports financing
      access, but not capital adequacy.
    claimRefs: [CI009, CI010, CI011, CI013, CI014, CI015, CI016]
    tableRefs: [TI003]
tables:
  - id: TI001
    title: Revenue streams and observable evidence
    columns: [Stream, Mechanism, Unit or basis, Public status, Evidence quality, Diligence ask]
    rows:
      - [Robotaxi service, "Passenger charge or ride-hailing revenue share", trip or fleet, "Historical mechanism reported in 2021; no current revenue disclosed", third-party-reported, "Obtain current trip volume, utilization, take rate, and fleet contribution margin"]
      - [OEM system sales, "One-time system fee plus annual service fee", vehicle or model program, "Historical mechanism reported; realized price and recognition terms undisclosed", third-party-reported, "Reconcile contracted, installed, activated, paid, and recognized units by OEM"]
      - [Logistics autonomy, "Operate a fleet or sell driverless technology", fleet or vehicle, "Historical option; no current financial contribution disclosed", third-party-reported, "Request active contracts, asset ownership, utilization, and service-delivery costs"]
      - [Production intelligent driving, "Embedded DeepRoute IO or urban-NOA deployment", delivered or fitted vehicle, "About 20,000 vehicles in the 2024 company release versus about 200,000 reported later by EVmagz", mixed and noncomparable, "Reconcile product scope, dates, paid units, revenue, and OEM concentration"]
    notes: "Vehicle and deployment counts are not revenue; the two counts have different dates, product scopes, and issuers, and null financial values are not inferred as zero."
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006]
  - id: TI002
    title: Pricing and unit-economics evidence
    columns: [Metric, Public value, Period and denominator, Confidence, Underwriting implication, Diligence ask]
    rows:
      - [L4 package stated cost, "$3,000", "2022 package; about 70% below the prior stated cost", medium, "Historical cost-down evidence, not customer price or revenue", "Obtain current BOM, customer invoice, discount schedule, and volume tier"]
      - [Five-lidar share of package cost, "About 50%", "Company-provided split for the 2022 L4 package", medium, "Sensor procurement was a material margin driver for that configuration", "Provide current sensor count, supplier terms, rebates, and inventory obligations"]
      - [Chip share of package cost, "About 30%", "Company-provided split for the 2022 L4 package", medium, "Compute choice was a second material hardware cost driver", "Provide current chip cost, minimum commitments, and platform migration expense"]
      - [Recognized gross margin, null, "No public period or denominator in the assigned evidence", low, "Software leverage cannot be separated from hardware, integration, and support burden", "Provide gross margin by product, OEM, and contract cohort"]
    notes: "The $3,000 figure and component shares are historical company-provided cost signals reported by TechCrunch; they are not list price, realized price, revenue, or current gross margin."
    claimRefs: [CI007, CI008, CI012]
  - id: TI003
    title: Capital adequacy and underwriting inputs
    columns: [Input, Public value or proxy, Confidence, Why it matters, Diligence ask]
    rows:
      - [Current revenue or ARR, null, low, "Required to connect vehicle deployment with financial scale", "Obtain audited revenue and a bridge by OEM, product, and recognition milestone"]
      - ["Cash, burn, debt, and runway", null, low, "Determines whether development and delivery depend on another financing event", "Obtain latest balance sheet, monthly cash flow, debt schedule, restricted cash, and next-round trigger"]
      - [Strategic capital use, "$100 million Series C1 assigned to R&D, OEM collaboration, robotaxi exploration, and hiring", medium, "Shows intended uses but not remaining liquidity", "Reconcile gross proceeds to net cash received, spend to date, and committed uses"]
      - [Headcount direction, "-2% over six months; 0% over one year; 1% over two years", low, "A directional cost proxy without an employee-count denominator", "Provide monthly headcount, compensation, contractors, hiring plan, and functional mix"]
    notes: "Funding raised is not cash available; nulls identify unavailable public evidence, and Simplify's headcount percentages lack an absolute employee denominator."
    claimRefs: [CI009, CI010, CI011, CI013, CI014, CI015, CI016]
