  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product and customer workflow
        blocks:
          - type: paragraph
            body: >-
              DeepRoute.ai delivers intelligent-driving systems embedded in production passenger vehicles rather than a
              retrofit consumer application. The operating workflow is OEM-led: the company supplies higher-level
              driving algorithms and an integrated platform, the automaker industrializes the vehicle and user
              experience, and the deployed fleet generates driving data for subsequent model iteration. Company
              materials describe three business lines—consumer vehicle platforms, robotaxi services, and RoadAGI—built
              on a unified technical framework, while independent coverage ties current commercialization to urban
              navigation-on-autopilot (NOA) programs in multiple vehicle models. This makes the current product a
              production-integration business first, with robotaxi and broader physical-AI applications dependent on
              scale, data, safety validation, and regulatory acceptance.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE005
              - CE006
              - CE012
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE005
              - CE006
              - CE007
              - CE012
      - number: '5.2'
        title: Architecture, model loop, and differentiation
        blocks:
          - type: paragraph
            body: >-
              DeepRoute IO 2.0 is described as a VLA-powered platform with multi-chip and multi-sensor configurations
              that can support LiDAR-equipped and pure-vision vehicle designs. The 2026 GTC release further describes a
              40-billion-parameter VLA foundation model that combines perception, reasoning, and action, and assigns the
              model driver, analyst, and critic roles in a self-evolving data loop. Those are specific architectural and
              workflow claims, but the cited materials do not independently verify model quality, safety performance, or
              whether the data-loop cycle time persists across production programs. The strategic differentiation is
              therefore better framed as an integration and iteration thesis than as a proven moat.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE006
              - CE009
              - CE010
              - CE011
              - CE012
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE005
              - CE006
              - CE009
              - CE012
      - number: '5.3'
        title: Deployment, integrations, and roadmap
        blocks:
          - type: paragraph
            body: >-
              Deployment maturity is strongest where DeepRoute.ai has production evidence: reporting says it contributed
              to more than a dozen vehicle models and delivered around 200,000 vehicles fitted with urban NOA, while a
              36Kr interview links current scale to Great Wall and Geely programs. The platform remains
              dependency-heavy. Black Sesame is described as supplying automotive-grade compute and a toolchain while
              DeepRoute.ai ports and optimizes higher-level algorithms; DeepRoute IO 2.0 is initially tied to NVIDIA
              DRIVE AGX Thor, and CNBC previously reported use of NVIDIA Orin. The roadmap toward robotaxi and RoadAGI
              is explicit, but future deployment targets remain company claims rather than independently audited
              outcomes.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
      - number: '5.4'
        title: Trust, safety, and technical diligence
        blocks:
          - type: paragraph
            body: >-
              The technology is exposed to both system-level and policy-level risks. MIIT guidance reported by
              CarNewsChina prohibits public beta programs without approval, restricts autonomous-driving terminology,
              bans unsupervised remote parking and summoning, requires hands-on detection and driver monitoring, and
              constrains OTA updates. These controls can slow iteration and narrow feature claims for every supplier,
              including DeepRoute.ai. The evidence pool contains no independent safety benchmark, incident-rate series,
              cybersecurity assessment, formal certification inventory, production SLA, or contract-level allocation of
              data and IP rights. Before underwriting technical maturity, an investor should obtain those artifacts by
              vehicle program and distinguish company targets from validated operating performance.
            claimRefs:
              - CE013
              - CE014
              - CE015
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Production integration is a real technical asset
            body: >-
              Independent and partner reporting ties the platform to mass-production vehicle programs and around 200,000
              urban-NOA-equipped vehicles, giving the product more implementation evidence than a laboratory-only
              autonomy stack.
            calloutType: strength
            claimRefs:
              - CE009
              - CE010
          - type: callout
            title: Safety and portability are not yet independently demonstrated
            body: >-
              The evidence does not establish independent safety performance, cybersecurity controls, processor
              portability, or data-rights boundaries, while MIIT controls can constrain testing, marketing, and OTA
              iteration.
            calloutType: risk
            claimRefs:
              - CE013
              - CE014
              - CE015
              - CE016
          - type: callout
            title: Underwrite programs, not model narratives
            body: >-
              Diligence should be organized by OEM program and processor configuration, requiring production logs,
              safety cases, intervention data, contracts, and permits before treating VLA or RoadAGI claims as durable
              product differentiation.
            calloutType: recommendation
            claimRefs:
              - CE006
              - CE010
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer and user segments
        blocks:
          - type: paragraph
            body: >-
              DeepRoute.ai sells intelligent-driving software and related development capability to automakers, while
              vehicle owners are the end users and automaker programs determine production scale. The clearest public
              buyer evidence is Great Wall Motor's Series C investment and deployment of city NOA across Wey and Tank
              models, alongside the Geely Galaxy M9 launch and Smart's development agreement. This is an OEM-led
              enterprise motion rather than a direct-to-consumer product. The disclosed customer set spans Chinese
              domestic brands, a Mercedes-Benz/Geely-backed Smart program, and an undisclosed full-line
              standard-configuration customer, but public sources do not identify contract values, procurement stages,
              or the share of revenue represented by each account.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU009
              - CU011
      - number: '6.2'
        title: Adoption and deployment trajectory
        blocks:
          - type: paragraph
            body: >-
              The adoption trajectory is unusually concrete for a private autonomy supplier: one source reports
              approximately 20,000 integrated vehicles delivered since August 2024, another reports more than 30,000 in
              four months, and later coverage reports 200,000 cumulative mass-produced vehicles. China Daily's account
              of roughly 30,000–35,000 October 2025 urban-NOA installations and about 38% of third-party supplier
              deployments provides an external market frame. These figures are not interchangeable: some are company or
              partner statements, some are market estimates, and the time windows differ. There is no public
              active-vehicle denominator, utilization series, or repeat-purchase cohort, so deployment should not be
              read as retention or recurring revenue.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU015
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU010
              - CU015
          - type: figure
            figureRef: FU001
            claimRefs: []
      - number: '6.3'
        title: Named proof, expansion, and durability
        blocks:
          - type: paragraph
            body: >-
              Named production evidence is stronger than a logo list. Wey Lanshan, Wey Gaoshan, Tank 500, and Geely
              Galaxy M9 are tied in public reporting to city-NOA-equipped production vehicles, while Smart's agreement
              covers joint development, overseas road testing, and future deployment. The reported Lanshan and Gaoshan
              sales outcomes are vehicle-model sales, not DeepRoute.ai customer retention or software revenue. Expansion
              is visible in additional models, brands, and a stated full-line program, but the available record does not
              establish contract duration, renewal, gross retention, net expansion, pricing, or whether OEMs can replace
              the stack internally.       April 2025 reporting on regulatory tightening also described adoption friction
              through restrictions on public testing, terminology, driver monitoring, and OTA updates; the assigned
              evidence does not establish whether every reported restriction remained unchanged at the run date. Those
              constraints make production validation valuable while leaving future rollout pace uncertain.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
              - CU016
          - type: table
            tableRef: TU003
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU010
              - CU011
              - CU012
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Production proof is real but concentrated
            body: >-
              Public evidence supports production deployment across multiple named vehicle programs, with the deepest
              disclosed relationship being Great Wall Motor.
            calloutType: strength
            claimRefs:
              - CU001
              - CU005
              - CU009
              - CU010
          - type: callout
            title: Adoption is not retention
            body: >-
              No assigned source discloses NRR, GRR, churn, renewal rates, contract length, customer revenue
              concentration, or active utilization; those are material diligence gaps.
            calloutType: risk
            claimRefs:
              - CU013
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk priorities and thesis breaks
        blocks:
          - type: paragraph
            body: >-
              DeepRoute.ai's risk profile is dominated by the gap between commercial scaling and the evidence available
              to underwrite safety, economics, and governance. Company and third-party materials describe production
              deployment, strategic OEM financing, and an intended IPO, while government and independent reporting shows
              tighter validation, marketing, and operating boundaries for assisted-driving systems. The
              highest-consequence thesis break is a safety or quality event that triggers recalls, deployment pauses, or
              OEM trust loss. A second is regulatory delay or reclassification that slows product releases or the
              proposed listing. A third is OEM insourcing, concentration, or weak unit economics that prevents scale
              from converting into durable licensing revenue. These risks should be monitored with release approvals,
              incident disclosures, customer concentration, gross-margin, and cash-runway evidence.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR013
              - CR014
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR004
              - CR011
              - CR013
              - CR015
              - CR016
      - number: '7.2'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              Chinese authorities are moving toward more explicit controls over autonomous-vehicle testing,
              assisted-driving terminology, software updates, and safety accountability. Xinhua reports that Beijing's
              local regulation provides a framework for Level 3 and higher systems, while two independent reports on an
              April 2025 Ministry of Industry and Information Technology meeting describe testing, approval,
              terminology, and update requirements. These measures are not evidence of a DeepRoute.ai violation, but
              they increase compliance cost and the probability that product messaging or OTA cadence must change. The
              confidential IPO reporting also says Beijing is tightening oversight on some overseas offerings. A
              diligence review should obtain DeepRoute.ai's permits, homologation records, incident history, update
              controls, privacy and data-rights terms, and current listing status.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR013
      - number: '7.3'
        title: Operational, safety, and dependency risks
        blocks:
          - type: paragraph
            body: >-
              The operating model puts safety performance, validation quality, and partner execution on the critical
              path. Government reporting describes safety, data privacy, and AI misjudgment as core industry challenges,
              while Shanghai's commercial robotaxi rules show that paid driverless operations remain geographically
              designated and may still require safety personnel. A company-issued financing release ties capital to
              research, OEM collaboration, future robotaxi work, and hiring, while 36Kr identifies Great Wall and
              Leapmotor as core customers and describes rising model-development costs. This creates a two-sided
              dependency: OEMs determine distribution and model-cycle access, while regulators determine where and how
              systems can operate. The evidence does not quantify supplier, cloud, data, or customer concentration, so
              these remain material diligence gaps rather than measured exposures.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR006
              - CR009
              - CR010
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR004
              - CR011
              - CR012
              - CR014
              - CR015
              - CR016
      - number: '7.4'
        title: Monitoring indicators and diligence asks
        blocks:
          - type: paragraph
            body: >-
              The most useful monitoring plan converts the risks into observable gates. Regulatory monitoring should
              track new permit classes, naming and marketing requirements, OTA validation obligations, and any recall or
              production-stop notices. Operating monitoring should track safety incidents per deployed vehicle,
              disengagements, software rollback rates, deployment geography, and the share of vehicles requiring human
              supervision. Commercial monitoring should track OEM programs entering production, renewal and pricing
              terms, revenue concentration, and evidence that deployment volume produces repeatable gross margin rather
              than only vehicle counts. Financing monitoring should track IPO progress, cash balance, burn, debt, and
              reliance on strategic investors. Until those data are disclosed, the appropriate posture is to require
              evidence before treating scale claims as durable economics.
            claimRefs:
              - CR002
              - CR003
              - CR006
              - CR009
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Evidence boundary
            body: >-
              Public sources establish sector-level regulatory and safety pressure, but they do not establish
              DeepRoute.ai-specific incident frequency, contract concentration, cash runway, or litigation status.
            calloutType: insight
            claimRefs:
              - CR006
              - CR009
              - CR012
              - CR013
              - CR015
          - type: callout
            title: Required before underwriting
            body: >-
              Require current permits, safety and recall records, OEM contract and concentration data, privacy and
              data-rights terms, and cash-runway evidence before upgrading the risk rating.
            calloutType: recommendation
            claimRefs:
              - CR006
              - CR009
              - CR011
              - CR012
              - CR014
              - CR015
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Price-sensitive recommendation
        blocks:
          - type: paragraph
            body: >-
              The investable signal is commercial scale, not a verified valuation. DeepRoute.ai said it was on track to
              exceed 200,000 equipped production vehicles by the end of 2025 and reported nearly 40% of China's
              third-party urban autonomous-driving supplier segment in October, while an independent 36Kr report
              described Great Wall Motor and Leapmotor as two core customers. Those facts support a credible route from
              engineering capability to OEM volume. They do not establish revenue recognition, per-vehicle pricing,
              gross margin, cash conversion, or an ownership-adjusted entry price. The recommendation is therefore
              track, with research-more diligence before underwriting a buy.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV006
              - CV008
              - CV012
      - number: '8.2'
        title: Thesis, anti-thesis, and financing context
        blocks:
          - type: paragraph
            body: >-
              The thesis is that production deployment, repeatable OEM integration, and a unified platform could create
              operating leverage as volume expands. DeepRoute.ai disclosed $450 million raised in total, including $100
              million in Series C1 funding, and CnEVPost reported that the Series C1 investor was Great Wall Motor after
              DeepRoute became a supplier. The anti-thesis is that strategic financing may reflect customer alignment
              more than arm's-length price discovery, while independent coverage described a narrowing capital window,
              converging technical paradigms, rising compute and data costs, and possible pressure to list before the
              market reprices the category. Without a current financing price or financial statements, a fair-value
              conclusion remains conditional.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
      - number: '8.3'
        title: Scenarios and decision gates
        blocks:
          - type: paragraph
            body: >-
              The scenarios below are decision frameworks rather than forecasts. The bull case requires production
              volume to convert into disclosed recurring or per-vehicle economics, sustained OEM adoption, and a
              credible expansion path into robotaxi or other physical-AI applications. The base case assumes commercial
              traction continues but valuation remains bounded by customer concentration, strategic capital, and opaque
              profitability. The bear case is triggered by weak economics, internalized OEM stacks, regulatory or safety
              setbacks, or an IPO process that exposes a lower-quality financial profile. A price-sensitive investor
              should require a current cap table, latest round price, liquidation preferences, revenue by customer,
              gross margin, burn, runway, and IPO filing evidence before setting a target return.
            claimRefs:
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV006
              - CV012
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Decision
            body: >-
              Track, with research-more diligence before any buy decision; valuation stance is unknown rather than
              attractive or expensive because no current price or financial denominator is disclosed in the retained
              evidence.
            calloutType: recommendation
            claimRefs:
              - CV012
              - CV015
          - type: callout
            title: Thesis-break trigger
            body: >-
              A failed IPO process, a down round, loss of a core OEM, a material safety or regulatory event, or evidence
              that production volume does not convert to acceptable gross profit would break the current scale-to-value
              thesis.
            calloutType: risk
            claimRefs:
              - CV009
              - CV013
              - CV014
