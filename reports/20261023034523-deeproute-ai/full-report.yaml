  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and buying unit
        blocks:
          - type: paragraph
            body: >-
              The defensible market boundary is OEM-embedded intelligent-driving software and associated integration for
              passenger and commercial vehicles, with adjacent opportunities in robotaxi and autonomous logistics
              services. The boundary excludes the full value of vehicles, ride-hailing fares, freight revenue, and
              generic AI infrastructure unless DeepRoute.ai captures that spend directly. This distinction matters
              because the company is described as an AI company developing smart-driving solutions, while the commercial
              buyer is generally an automaker integrating a stack into a production vehicle. The 2026 market evidence
              shows urban NOA moving into lower-priced vehicle segments, which expands unit volume but can also
              intensify price pressure. The relevant adoption unit is therefore a vehicle program or model platform,
              with automaker engineering, product, safety, and procurement functions controlling approval. Fleet and
              logistics operators are a secondary buyer group for constrained L4 deployments; consumers are users, not
              necessarily the payer.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
      - number: '2.2'
        title: Sizing through multiple lenses
        blocks:
          - type: paragraph
            body: >-
              No retained source provides a complete company-specific TAM, SAM, or SOM. Instead, three evidence lenses
              bound the opportunity. First, deployment scale is visible: an industry report says more than 30,000
              vehicles were equipped with DeepRoute IO in four months and expected 200,000 in the year, while a later
              company profile claims 200,000 mass-produced vehicles with Navigate on Autopilot as of November 2025.
              Second, the broader operating environment is expanding: China had issued 16,000 autonomous vehicle test
              licenses and opened about 32,000 kilometers of roads by August 2024, according to a government article.
              Third, monetization is constrained by the licensing channel: the Road to Autonomy index assigns DeepRoute
              a revenue sub-index of 55/100 and a scale sub-index of 73/100, but this is an external scoring methodology
              rather than reported revenue. These lenses support a material market but not a precise dollar TAM. Any
              investor model should keep vehicle volume, software take rate, non-recurring engineering, and service
              revenue as separate assumptions.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM007
              - CM008
      - number: '2.3'
        title: Buyers, drivers, and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              The buying path runs from an automaker's product and engineering teams through safety validation,
              regulatory approval, sourcing, and model launch. A production partnership with Smart illustrates the
              trigger: automakers seek complex-scenario capability and a faster route to intelligent-driving deployment,
              while the supplier seeks repeated model integration and overseas road testing. Industry demand is
              strengthened when intelligent driving becomes a standard feature rather than an optional upgrade, but the
              same transition creates commoditization and price competition. Regulation is a material timing constraint.
              China's proposed national standards cover Level 3 and Level 4 systems and would require safety management,
              data storage, validation, and safety-case evidence; separate reporting describes restrictions on public
              beta tests, marketing terminology, remote functions, and OTA updates. These rules can increase
              qualification costs and lengthen sales cycles even as they make approved deployment more scalable. The
              principal diligence gaps are per-vehicle pricing, contract duration, customer concentration, software
              versus hardware economics, and conversion from announced programs to recognized revenue.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM010
              - CM011
              - CM012
              - CM013
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The addressable unit is the vehicle program
            body: >-
              DeepRoute.ai's market access is best evaluated through model-program wins, approved deployment, and
              repeatable per-vehicle economics rather than the gross value of mobility services.
            calloutType: insight
            claimRefs:
