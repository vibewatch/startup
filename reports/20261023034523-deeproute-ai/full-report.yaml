      - number: '4.3'
        title: Capital adequacy and underwriting blockers
        blocks:
          - type: paragraph
            body: >-
              Strategic financing has funded development, but funding raised is not cash available. DeepRoute.ai's 2024
              release said its $100 million Series C1 would support research and development, global automaker
              collaboration, robotaxi exploration, and hiring. CNBC and Wikipedia also corroborate a $300 million
              Alibaba-led Series B in 2021. Neither disclosure supplies a current cash balance, monthly burn, debt,
              restricted proceeds, committed capex, or runway. 36Kr reported that DeepRoute.ai submitted Hong Kong
              listing materials by the end of 2025 and described a colder private funding market alongside rising
              capital needs. EquityZen and Caplight expose only gated or blank public financial fields, while Simplify's
              percentage headcount trend lacks an absolute employee denominator. The evidence supports financing access,
              but not capital adequacy.
            claimRefs:
