      - number: '1.1'
        title: Identity, footprint, and operating model
        blocks:
          - type: paragraph
            body: >-
              DeepRoute.ai was founded in 2019 and is headquartered in Shenzhen, with company-disclosed offices in
              Beijing and Fremont, California. A current Fremont job listing provides an operating address and describes
              work on planning modules, simulation, real-world integration, robustness, and delivery management, but it
              does not establish total headcount. The business model reported by TechCrunch is a per-vehicle technology
              licensing fee paid by automakers, coupled with vehicle-data collection for model training. That places the
              current commercial wedge inside OEM production programs rather than in a separately evidenced robotaxi
              fleet. The retained evidence does not disclose legal-entity structure, active site staffing, customer
              count, or a current product-level revenue split.
