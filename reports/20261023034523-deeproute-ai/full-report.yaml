        title: Exhibits
        blocks:
          - type: callout
            title: Financial underwriting remains blocked
            body: >-
              Public deployment and financing signals do not establish recognized revenue, realized per-vehicle pricing,
              gross margin, cash, burn, runway, debt, or customer-level economics; these inputs should remain diligence
              conditions rather than modeled values.
            calloutType: risk
            claimRefs:
              - CI014
