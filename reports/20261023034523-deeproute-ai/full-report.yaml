  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and scale
        blocks:
          - type: paragraph
            body: >-
              DeepRoute.ai competes in a concentrated Chinese third-party urban-NOA supplier market rather than in a
              single undifferentiated autonomous-driving category. China Daily, citing a China Automotive New Supply
              Chain Research Institute white paper, places Momenta, DeepRoute.ai, and Huawei HI as the top three
              third-party providers by cumulative urban-NOA deployments in January-October 2025; it also reports that
              DeepRoute.ai and Momenta each had roughly 30,000-35,000 October installations and about 38% of third-party
              supplier deployments. This is a market-position signal, not a measure of revenue, margin, or software
              quality. A 36Kr interview reports DeepRoute.ai's own claim of 200,000 mass-produced vehicles delivered by
              the end of 2025 and roughly 40% October software share, while the interview describes the company's core
              competitive set as three players. Those figures are not directly interchangeable because the sources use
              different populations and measurement definitions. CarNewsChina reports that Momenta had 170 model design
              wins and 68 models in mass production by the end of 2025, indicating that DeepRoute.ai faces a peer with
              both broader program breadth and multinational automaker backing. Adjacent robotaxi competition is
              broader: Reuters reports Waymo reached 15 million rides in 2025 across six U.S. metropolitan areas, while
              CNBC TV18 describes WeRide pilots or tests in 30 cities across seven countries. Status quo alternatives
              remain OEM-developed stacks, integrated suppliers such as Huawei, and human-supervised driving without a
              third-party urban-NOA license.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP016
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP010
              - CP012
              - CP016
      - number: '3.2'
        title: Buyer trade-offs, capability, and monetization
        blocks:
          - type: paragraph
            body: >-
              For an OEM buyer, the immediate decision is whether to buy a production-ready third-party stack, build
              internally, or combine an incumbent supplier with proprietary vehicle integration. DeepRoute.ai's public
              materials emphasize map-free or end-to-end driving and a path from mass-produced vehicles to unsupervised
              robotaxis. Its 2024 funding release said approximately 20,000 DeepRoute IO vehicles had been delivered
              since August and that more than ten additional model series were planned with OEM customers; the release
              is company-issued and should be treated as a capability and commercial-intent claim, not independent
              validation. The 36Kr interview gives the counterweight: CEO Zhou Guang says the company was previously
              rejected for lacking mass-production experience, that Great Wall Motor and another major automaker
              supplied engineering training, and that software architectures are converging. He also says DeepRoute will
              not develop its own chips and instead maintains relationships with Qualcomm, Horizon, and Nvidia. This
              division-of-labor posture can reduce capital intensity relative to vertical integration, but it leaves the
              company dependent on chip partners and OEM access. Simplify's own critical assessment identifies OEM
              internalization of ADAS stacks as a threat to DeepRoute.ai's licensing model, although the page provides
              no contract-level evidence for its two-model-cycle assertion. Public pricing is sparse: CnEVPost reports
              an earlier robotaxi kit price below $10,000 and a possible further cost reduction, while no current
              realized OEM license price or contract economics are disclosed.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP014
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP007
              - CP008
              - CP009
              - CP011
              - CP013
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP008
              - CP009
              - CP011
              - CP014
      - number: '3.3'
        title: Differentiation durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              DeepRoute.ai's strongest current moat is deployment learning tied to OEM programs, not a publicly
              demonstrated exclusive technology boundary. China Daily reports rapid deployment growth for DeepRoute.ai
              in 2025, and the 36Kr interview links mass-production data accumulation to the company's robotaxi
              objective. That creates a plausible data-and-engineering flywheel, but the same interview says the
              difference between 500,000 and one million units is not clearly decisive and that other OEMs may also
              succeed. The competitive threat is therefore two-sided: Momenta and Huawei can contest supplier scale,
              while OEMs can internalize more of the stack. The adjacent robotaxi field adds proof that safety and
              regulatory execution remain gating factors: Reuters reports an NHTSA investigation after a Waymo vehicle
              struck a child, and CNBC TV18 identifies weather, complex intersections, pedestrian behavior, accidents,
              and proposed U.S. restrictions on Chinese vehicle software and hardware as material hurdles.
              DeepRoute.ai's planned robotaxi expansion should consequently be underwritten as an option on additional
              commercialization, not as an established recurring revenue stream. Current valuation, customer
              concentration, switching costs, and realized pricing remain insufficiently disclosed.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP010
              - CP012
              - CP015
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Deployment is the current moat, not a proven lock-in
            body: >-
              DeepRoute.ai's strongest evidence is rapid OEM deployment and the resulting data loop; retained sources do
              not establish exclusive contracts, switching costs, realized pricing, or a durable technical lead.
            calloutType: insight
            claimRefs:
              - CP002
              - CP006
              - CP010
              - CP014
          - type: callout
            title: Robotaxi is an option with execution and safety risk
            body: >-
              The retained evidence supports robotaxi ambition and industry scale-up, but adjacent operators' safety and
              regulatory obstacles show why future robotaxi value should not be treated as current recurring revenue.
            calloutType: risk
            claimRefs:
              - CP005
              - CP011
              - CP013
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Monetization and observable traction
        blocks:
          - type: paragraph
            body: >-
              CNBC described three historical monetization paths: passenger charges or revenue sharing for robotaxis,
              one-time and annual fees for autonomous-driving systems sold to automakers, and either operated fleets or
              technology sales in logistics. The production evidence is newer but remains nonfinancial. DeepRoute.ai
              said about 20,000 DeepRoute IO-equipped vehicles had been delivered since August 2024, while EVmagz later
              reported about 200,000 vehicles fitted with urban NOA and a nearly 40% share of the third-party urban-NOA
              supplier market in October 2025. These figures have different products, dates, and issuers, so they cannot
              be combined into a growth rate or converted into recognized revenue. 36Kr also identified Great Wall and
              Leapmotor as core customers, making contract mix and customer concentration central diligence questions.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI006
          - type: table
            tableRef: TI001
            claimRefs:
