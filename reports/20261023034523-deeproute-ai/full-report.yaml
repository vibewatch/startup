              - CI006
      - number: '4.2'
        title: Pricing, costs, and margin path
        blocks:
          - type: paragraph
            body: >-
              The only quantitative pricing evidence in the assigned pool concerns historical system cost, not customer
              price. TechCrunch reported in 2022 that DeepRoute.ai had reduced the stated cost of an L4 package by about
              70% to $3,000. The same report, using a company-provided breakdown, put five lidar sensors at about 50% of
              package cost and the chip at 30%. That establishes hardware sensitivity for one older L4 configuration,
              but it does not reveal current bill of materials, realized license price, discounts, integration labor,
              cloud and data costs, warranty expense, or gross margin. 36Kr's account adds an adverse industry signal:
              compute investment and data closed-loop costs were rising as suppliers competed on scale. Public
              deployment therefore supports commercial relevance, not software-like unit economics.
            claimRefs:
              - CI007
              - CI008
              - CI012
          - type: table
            tableRef: TI002
            claimRefs:
              - CI007
              - CI008
              - CI012
