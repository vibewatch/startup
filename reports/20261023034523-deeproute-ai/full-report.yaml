        blocks:
          - type: paragraph
            body: >-
              CNBC reported that Alibaba led a $300 million round in 2021 that valued DeepRoute.ai above $1 billion. In
              November 2024, the company announced another $100 million strategic financing from an unnamed automotive
              OEM; CNBC, citing PitchBook, identified Great Wall Motor as the lead investor, while TechCrunch also
              reported Great Wall as the backer. Those two cited rounds sum to at least $400 million, but that subtotal
