  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Production proof and strategic funding support monitoring, while missing price and unit-economics evidence blocks
      a buy conclusion.
    data:
      nodes:
        - id: scale
          label: Production scale
          detail: More than 200,000 production vehicles targeted by year-end 2025
        - id: funding
          label: Strategic funding
          detail: US$100 million Series C1; US$450 million raised in total
        - id: gaps
          label: Valuation evidence gap
          detail: No current valuation, revenue, margin, runway, or cap-table terms
        - id: decision
          label: Track / research more
          detail: Require price and financial diligence before buy
        - id: price
          label: Entry price
          detail: Current price and capitalization terms are undisclosed
        - id: economics
          label: Unit economics
          detail: Revenue, margin, burn, and runway are undisclosed
      edges:
        - from: scale
          to: decision
        - from: funding
          to: decision
        - from: gaps
          to: decision
        - from: price
          to: decision
        - from: economics
          to: decision
    claimRefs:
      - CV002
      - CV006
      - CV012
      - CV016
