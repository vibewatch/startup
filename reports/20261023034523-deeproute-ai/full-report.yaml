  - id: FM001
    title: Evidence-constrained market sizing lens
    type: pyramid
    summary: Deployment, enabling infrastructure, and monetization evidence form nested lenses rather than an additive TAM.
    data:
      nodes:
        - id: lens-activity
          label: China and supplier deployment activity
          value: 200,000 vehicles claimed; 16,000 test licenses
          valueNote: Different periods and sources; not additive
        - id: lens-access
          label: Operating access
          value: 32,000 km of roads opened for testing
          valueNote: Testing access is not production demand
        - id: lens-monetization
          label: Licensing monetization signal
          value: Revenue sub-index 55/100
          valueNote: External index score, not reported revenue
        - id: lens-commercial
          label: Commercial channel
          value: Commercial sub-index 66/100
          valueNote: External index score, not reported revenue
        - id: lens-safety
          label: Safety signal
          value: Safety sub-index 54/100
          valueNote: External index score, not a certification
        - id: lens-integration
          label: Integration signal
          value: Integration sub-index 20/100
          valueNote: External index score; switching-cost inputs are not public
    approximationNotes: >-
      The nested order is an analytical presentation of distinct evidence lenses, not a proportional or additive market
      calculation.
    claimRefs:
      - CM005
      - CM007
      - CM008
  - id: FP001
    title: Evidence-backed competitive positioning
    type: quadrant
    summary: >-
      Ordinal positioning separates urban-NOA supplier scale from robotaxi operating evidence; scores are analytical
      proxies, not market-share measurements.
    data:
      xAxis: Urban-NOA supplier deployment evidence (ordinal 0-10)
      yAxis: Robotaxi operating evidence (ordinal 0-10)
      points:
        - label: DeepRoute.ai
          x: 8
          'y': 2
          note: >-
            Deployment evidence is strong; retained pool supports future or planned robotaxi expansion rather than
            scaled operations
        - label: Momenta
          x: 8
          'y': 4
          note: Top-three supplier evidence; retained CarNewsChina text describes robotaxi collaborations and plans
        - label: Huawei HI
          x: 7
          'y': 1
          note: Top-three supplier evidence; robotaxi operating evidence not established in pool
        - label: Waymo
          x: 2
          'y': 10
          note: Robotaxi ride evidence is strong, but it is not a comparable Chinese urban-NOA supplier
        - label: WeRide
          x: 3
          'y': 7
          note: Pilot and testing footprint is reported across 30 cities and seven countries
        - label: Baidu Apollo Go
          x: 2
          'y': 9
          note: TechCrunch describes Apollo Go as the robotaxi leader in its cited scorecard
    approximationNotes: >-
      Scores are authorial ordinal proxies based on source-backed deployment, ride, and pilot evidence; unlike-for-like
      populations and periods are not assumed.
    claimRefs:
      - CP001
      - CP003
      - CP004
      - CP010
      - CP012
      - CP015
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Customer activity can lead to several revenue mechanisms, but public evidence does not quantify the conversion
      from deployment to recognized revenue or gross profit.
    data:
      nodes:
        - id: oem-program
          label: OEM program
          detail: Automaker contract, model selection, and integration work
          value: Contract economics undisclosed
        - id: deployed-vehicle
          label: Deployed vehicle
          detail: Delivered, fitted, or activated intelligent-driving system
          value: Public counts use different scopes
        - id: monetization-event
          label: Monetization event
          detail: One-time fee, annual service fee, ride share, or fleet service
          value: Mechanisms reported; prices undisclosed
        - id: recognized-revenue
          label: Recognized revenue
          detail: Accounting recognition under customer contract milestones
          value: Not publicly disclosed
        - id: delivery-cost
          label: Delivery cost
          detail: Hardware, compute, data loop, integration, support, and warranty
          value: Only one historical package split disclosed
        - id: gross-profit
          label: Gross profit
          detail: Recognized revenue less attributable delivery costs
          value: Not publicly disclosed
    approximationNotes: >-
      Ordered mechanism only; node order does not imply conversion rates, comparable populations, revenue amounts, or
      gross margin.
    claimRefs:
      - CI001
      - CI002
      - CI004
      - CI008
      - CI012
      - CI016
  - id: FE001
    title: DeepRoute.ai product architecture and operating loop
    type: stack
    summary: >-
      The disclosed product stack connects vehicle inputs and compute to IO 2.0, a VLA model and data loop, OEM
      deployment, and planned autonomy applications.
    data:
      layers:
        - label: Vehicle inputs and compute
          detail: Vehicle sensors and automotive compute form the hardware boundary for the software stack.
          items:
            - label: Multi-sensor inputs
              detail: LiDAR-equipped or pure-vision configurations are described for IO 2.0.
            - label: Automotive compute
              detail: >-
                Initial IO 2.0 deployment is described on NVIDIA DRIVE AGX Thor; Black Sesame provides another compute
                and toolchain dependency.
        - label: Platform
          detail: DeepRoute IO 2.0 packages the disclosed smart-driving functions for OEM deployment.
          items:
            - label: DeepRoute IO 2.0
              detail: VLA-powered smart-driving platform for OEM vehicle integration.
            - label: Urban NOA
              detail: Production-oriented urban navigation-on-autopilot capability reported across vehicle programs.
        - label: Model and data loop
          detail: The VLA model and closed loop are presented as the core iteration and decision layer.
          items:
            - label: 40B VLA foundation model
              detail: Company-reported architecture unifies perception, reasoning, and action.
            - label: Driver / analyst / critic
              detail: The model is described as acting, mining events, diagnosing causes, and scoring behavior.
        - label: Commercial deployment
          detail: OEM programs and fleet telemetry connect the platform to production vehicles and later model updates.
          items:
            - label: OEM production programs
              detail: Great Wall, Geely, and other automaker programs are described in the evidence.
            - label: Fleet data accumulation
              detail: Mass-production vehicles are presented as the data base for later autonomy.
        - label: Expansion applications
          detail: Robotaxi and RoadAGI are forward applications rather than independently verified current revenue lines.
          items:
            - label: Robotaxi
              detail: Planned operations and future unsupervised capability remain roadmap claims.
            - label: RoadAGI
              detail: Broader physical-world applications are described as a development direction.
        - label: Governance and safety
          detail: Regulatory controls and missing independent assurance evidence remain gating conditions for scale.
          items:
            - label: Driver monitoring
              detail: Reported MIIT guidance requires monitoring to remain enabled and supports risk mitigation.
    claimRefs:
      - CE005
      - CE006
      - CE009
      - CE012
  - id: FU001
    title: Customer adoption and expansion journey
    type: journey-map
    summary: >-
      Public evidence traces DeepRoute.ai from early vehicle integrations through multi-OEM production deployment and
      intended robotaxi expansion.
    data:
      nodes:
        - id: early-integration
          label: Early integrations
          date: Since August 2024
          details: Approximately 20,000 vehicles integrated with DeepRoute IO were reported in the Series C1 release.
          touchpoints:
