    title: Risk heatmap
    summary: >-
      Regulatory, safety, operational, and financing exposures are concentrated in high-impact areas where mitigation
      evidence is incomplete.
    type: matrix
    data:
      columns:
        - Risk
        - Impact
        - Likelihood
        - Mitigation maturity
      rows:
