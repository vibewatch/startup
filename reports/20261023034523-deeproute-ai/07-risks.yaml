callouts:
  - calloutType: insight
    title: Evidence boundary
    body: Public sources establish sector-level regulatory and safety pressure, but they do not establish DeepRoute.ai-specific incident frequency, contract concentration, cash runway, or litigation status.
    claimRefs: [CR006, CR009, CR012, CR013, CR015]
  - calloutType: recommendation
    title: Required before underwriting
