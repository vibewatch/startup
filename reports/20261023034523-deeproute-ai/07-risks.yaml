chapter:
  number: 7
  title: Risks
  summary: DeepRoute.ai's principal risks are tighter assisted-driving controls, safety and liability exposure as deployments scale, and dependence on a small set of OEM relationships and external capital. Public evidence establishes sector-level requirements and reported financing activity, but not DeepRoute.ai-specific incident rates, contract protections, cash runway, margins, or customer concentration.
sections:
  - id: risk-priorities
    title: Risk priorities and thesis breaks
    body: >-
      DeepRoute.ai's risk profile is dominated by the gap between commercial scaling and the evidence available to underwrite safety, economics, and governance. Company and third-party materials describe production deployment, strategic OEM financing, and an intended IPO, while government and independent reporting shows tighter validation, marketing, and operating boundaries for assisted-driving systems. The highest-consequence thesis break is a safety or quality event that triggers recalls, deployment pauses, or OEM trust loss. A second is regulatory delay or reclassification that slows product releases or the proposed listing. A third is OEM insourcing, concentration, or weak unit economics that prevents scale from converting into durable licensing revenue. These risks should be monitored with release approvals, incident disclosures, customer concentration, gross-margin, and cash-runway evidence.
    claimRefs: [CR001, CR002, CR003, CR004, CR013, CR014, CR015, CR016]
    figureRefs: [FR001]
  - id: regulatory-legal
    title: Regulatory and legal exposure
    body: >-
      Chinese authorities are moving toward more explicit controls over autonomous-vehicle testing, assisted-driving terminology, software updates, and safety accountability. Xinhua reports that Beijing's local regulation provides a framework for Level 3 and higher systems, while two independent reports on an April 2025 Ministry of Industry and Information Technology meeting describe testing, approval, terminology, and update requirements. These measures are not evidence of a DeepRoute.ai violation, but they increase compliance cost and the probability that product messaging or OTA cadence must change. The confidential IPO reporting also says Beijing is tightening oversight on some overseas offerings. A diligence review should obtain DeepRoute.ai's permits, homologation records, incident history, update controls, privacy and data-rights terms, and current listing status.
    claimRefs: [CR004, CR005, CR006, CR007, CR008, CR013]
    tableRefs: [TR001]
  - id: operational-and-partner
    title: Operational, safety, and dependency risks
    body: >-
      The operating model puts safety performance, validation quality, and partner execution on the critical path. Government reporting describes safety, data privacy, and AI misjudgment as core industry challenges, while Shanghai's commercial robotaxi rules show that paid driverless operations remain geographically designated and may still require safety personnel. A company-issued financing release ties capital to research, OEM collaboration, future robotaxi work, and hiring, while 36Kr identifies Great Wall and Leapmotor as core customers and describes rising model-development costs. This creates a two-sided dependency: OEMs determine distribution and model-cycle access, while regulators determine where and how systems can operate. The evidence does not quantify supplier, cloud, data, or customer concentration, so these remain material diligence gaps rather than measured exposures.
    claimRefs: [CR009, CR010, CR011, CR012, CR014, CR015, CR016]
    tableRefs: [TR002, TR003]
  - id: monitoring-and-diligence
    title: Monitoring indicators and diligence asks
    body: >-
      The most useful monitoring plan converts the risks into observable gates. Regulatory monitoring should track new permit classes, naming and marketing requirements, OTA validation obligations, and any recall or production-stop notices. Operating monitoring should track safety incidents per deployed vehicle, disengagements, software rollback rates, deployment geography, and the share of vehicles requiring human supervision. Commercial monitoring should track OEM programs entering production, renewal and pricing terms, revenue concentration, and evidence that deployment volume produces repeatable gross margin rather than only vehicle counts. Financing monitoring should track IPO progress, cash balance, burn, debt, and reliance on strategic investors. Until those data are disclosed, the appropriate posture is to require evidence before treating scale claims as durable economics.
    claimRefs: [CR002, CR003, CR006, CR009, CR012, CR013, CR014, CR015, CR016]
