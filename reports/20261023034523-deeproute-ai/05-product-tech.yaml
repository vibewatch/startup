company:
  name: DeepRoute.ai
chapter:
  number: 5
  title: Product & Technology
  summary: DeepRoute.ai has moved from autonomous-driving R&D into OEM-integrated urban NOA deployments, with DeepRoute IO 2.0 and a 40B VLA foundation model extending the platform toward robotaxi and broader physical-AI use cases. The strongest evidence is still a mix of company-reported scale and independent coverage; chip dependence, regulatory controls, and unproven safety and economics remain material diligence constraints.
sections:
  - id: product-definition
    title: Product and customer workflow
    body: >-
      DeepRoute.ai delivers intelligent-driving systems embedded in production passenger vehicles rather than a retrofit consumer application. The operating workflow is OEM-led: the company supplies higher-level driving algorithms and an integrated platform, the automaker industrializes the vehicle and user experience, and the deployed fleet generates driving data for subsequent model iteration. Company materials describe three business lines—consumer vehicle platforms, robotaxi services, and RoadAGI—built on a unified technical framework, while independent coverage ties current commercialization to urban navigation-on-autopilot (NOA) programs in multiple vehicle models. This makes the current product a production-integration business first, with robotaxi and broader physical-AI applications dependent on scale, data, safety validation, and regulatory acceptance.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001, TE002]
  - id: architecture-and-differentiation
    title: Architecture, model loop, and differentiation
    body: >-
      DeepRoute IO 2.0 is described as a VLA-powered platform with multi-chip and multi-sensor configurations that can support LiDAR-equipped and pure-vision vehicle designs. The 2026 GTC release further describes a 40-billion-parameter VLA foundation model that combines perception, reasoning, and action, and assigns the model driver, analyst, and critic roles in a self-evolving data loop. Those are specific architectural and workflow claims, but the cited materials do not independently verify model quality, safety performance, or whether the data-loop cycle time persists across production programs. The strategic differentiation is therefore better framed as an integration and iteration thesis than as a proven moat.
    claimRefs: [CE005, CE006, CE007, CE008]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: deployment-roadmap
    title: Deployment, integrations, and roadmap
    body: >-
      Deployment maturity is strongest where DeepRoute.ai has production evidence: reporting says it contributed to more than a dozen vehicle models and delivered around 200,000 vehicles fitted with urban NOA, while a 36Kr interview links current scale to Great Wall and Geely programs. The platform remains dependency-heavy. Black Sesame is described as supplying automotive-grade compute and a toolchain while DeepRoute.ai ports and optimizes higher-level algorithms; DeepRoute IO 2.0 is initially tied to NVIDIA DRIVE AGX Thor, and CNBC previously reported use of NVIDIA Orin. The roadmap toward robotaxi and RoadAGI is explicit, but future deployment targets remain company claims rather than independently audited outcomes.
    claimRefs: [CE009, CE010, CE011, CE012]
  - id: trust-risk-gaps
    title: Trust, safety, and technical diligence
    body: >-
      The technology is exposed to both system-level and policy-level risks. MIIT guidance reported by CarNewsChina prohibits public beta programs without approval, restricts autonomous-driving terminology, bans unsupervised remote parking and summoning, requires hands-on detection and driver monitoring, and constrains OTA updates. These controls can slow iteration and narrow feature claims for every supplier, including DeepRoute.ai. The evidence pool contains no independent safety benchmark, incident-rate series, cybersecurity assessment, formal certification inventory, production SLA, or contract-level allocation of data and IP rights. Before underwriting technical maturity, an investor should obtain those artifacts by vehicle program and distinguish company targets from validated operating performance.
    claimRefs: [CE013, CE014, CE015, CE016]
