callouts:
  - calloutType: strength
    title: Production integration is a real technical asset
    body: Independent and partner reporting ties the platform to mass-production vehicle programs and around 200,000 urban-NOA-equipped vehicles, giving the product more implementation evidence than a laboratory-only autonomy stack.
    claimRefs: [CE009, CE010]
  - calloutType: risk
    title: Safety and portability are not yet independently demonstrated
    body: The evidence does not establish independent safety performance, cybersecurity controls, processor portability, or data-rights boundaries, while MIIT controls can constrain testing, marketing, and OTA iteration.
    claimRefs: [CE013, CE014, CE015, CE016]
  - calloutType: recommendation
    title: Underwrite programs, not model narratives
    body: Diligence should be organized by OEM program and processor configuration, requiring production logs, safety cases, intervention data, contracts, and permits before treating VLA or RoadAGI claims as durable product differentiation.
    claimRefs: [CE006, CE010, CE016]
