    notes: Public sources establish named programs and intended users, but not payer economics, account revenue bands, or contract duration; null gaps are not zero values.
    claimRefs: [CU001, CU002, CU003, CU004, CU009, CU011]
  - id: TU002
    title: Customer growth and adoption trajectory
    columns: [Metric, Value, Date / period, Source posture, Implication, Missing denominator]
    rows:
      - ["Integrated vehicles delivered", "Approximately 20,000", "Since August 2024", "Company-issued funding release", "Early production validation", "Active vehicles and model-level split"]
      - ["Integrated vehicles in Smart partnership coverage", "Over 30,000", "Four months; article published January 2025", "Partner reporting", "Rapid early deployment claim", "Whether the figure is cumulative or overlapping with the 20,000"]
      - ["Urban NOA production vehicles", "200,000 cumulative", "Reported at Auto Guangzhou / late 2025 coverage", "Independent trade reporting", "Material scale and stronger OEM proof", "Active use and customer-level allocation"]
      - ["Third-party urban-NOA supplier share", "Nearly 40%", "October 2025", "Company/interview and partner coverage", "Indicates competitive relevance among third-party suppliers", "Market definition and denominator"]
      - ["Urban NOA installations", "Roughly 30,000–35,000", "October 2025", "China Daily citing industry white paper", "External market benchmark", "Corroborates a leading deployment position; exact methodology and customer split"]
      - ["Vehicles reported with Urban NOA", "300,000", "By April 2026", "Two secondary aggregators repeating a company figure", "Suggests continued installation growth after 2025", "No customer, model, active-use, or revenue breakdown"]
    notes: Values have different scopes and periods; deployment, supplier share, model count, and vehicle sales are not equivalent customer or revenue metrics. Reported figures should not be summed.
    claimRefs: [CU005, CU006, CU007, CU008, CU010, CU015]
  - id: TU003
    title: Named customer proof table
    columns: [Customer / program, Segment, Deployment or use case, Production vs pilot, Outcome or signal, Limitation]
    rows:
      - ["Great Wall Motor / Wey Lanshan", "Domestic OEM", "City NOA system in Wey Lanshan", "Production", "Monthly sales reported at 6,019 after launch", "Sales are vehicle-model sales and are not attributable solely to software"]
      - ["Great Wall Motor / Wey Gaoshan", "Domestic OEM", "City NOA-equipped MPV", "Production", "Sales reportedly climbed nearly tenfold to about 10,000 units in October", "Timing and causal contribution are not independently audited"]
      - ["Great Wall Motor / Tank 500", "Domestic OEM", "City NOA-equipped SUV", "Production", "Model reportedly entered the top ten of its segment", "Ranking period and software contribution are not disclosed"]
      - ["Geely Galaxy M9", "Domestic OEM", "City NOA across more than 300 cities", "Production launch", "Deliveries reportedly surpassed 10,000 units within three months", "User-testing pass rate and deliveries are reported claims without denominator detail"]
      - ["Smart", "International OEM brand", "Joint development including parking, traffic circles, missing lane markings, and overseas testing", "Development / deployment path; production scope not established", "Agreement expands potential OEM funnel and validation surface", "Public evidence does not prove paid production deployment"]
    notes: "Enumeration is partial rather than exhaustive: it covers named public programs found in the assigned pool, not the full customer base. Production labels reflect the source description and do not prove renewal or software revenue."
    enumerationScope:
      coverage: partial
      basis: Named customer programs reported in assigned prefetched sources through 2026-10-23
    claimRefs: [CU001, CU002, CU003, CU004, CU010, CU011, CU012]
figures:
  - id: FU001
    title: Customer adoption and expansion journey
    type: journey-map
    summary: Public evidence traces DeepRoute.ai from early vehicle integrations through multi-OEM production deployment and intended robotaxi expansion.
    data:
      nodes:
        - id: early-integration
          label: Early integrations
          date: "Since August 2024"
          details: Approximately 20,000 vehicles integrated with DeepRoute IO were reported in the Series C1 release.
          touchpoints: [Initial OEM production validation, Data collection from human-supervised driving]
        - id: gwm-production
          label: GWM production
          date: "2024–2025"
          details: Wey Lanshan, Wey Gaoshan, and Tank 500 were reported with DeepRoute city NOA systems.
          touchpoints: [Series C investment, Multi-model deployment]
        - id: smart-development
          label: Smart cooperation
          date: "2025"
          details: Smart and DeepRoute announced joint intelligent-driving development and overseas road-testing ambitions.
          touchpoints: [International OEM funnel, Validation and deployment path]
        - id: galaxy-m9
          label: Galaxy M9 launch
          date: "2025"
          details: Galaxy M9 launched with city NOA coverage across more than 300 cities.
          touchpoints: [Additional OEM brand, Production vehicle adoption]
        - id: scale
          label: Deployment scale
          date: "Late 2025"
          details: Coverage reported 200,000 cumulative production vehicles and more than 10 models.
          touchpoints: [Supplier share, Market-scale proof]
        - id: robotaxi-path
          label: Robotaxi path
          date: "2026 plan"
          details: Company and media sources describe robotaxi operations as a future expansion path.
          touchpoints: [Reuse of production data, Unproven paid utilization]
callouts:
  - calloutType: strength
    title: Production proof is real but concentrated
    body: Public evidence supports production deployment across multiple named vehicle programs, with the deepest disclosed relationship being Great Wall Motor.
    claimRefs: [CU001, CU005, CU009, CU010]
  - calloutType: risk
    title: Adoption is not retention
    body: No assigned source discloses NRR, GRR, churn, renewal rates, contract length, customer revenue concentration, or active utilization; those are material diligence gaps.
    claimRefs: [CU013, CU014]
