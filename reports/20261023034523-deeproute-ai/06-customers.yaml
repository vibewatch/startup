company:
  name: DeepRoute.ai
chapter:
  number: 6
  title: Customers
  summary: DeepRoute.ai has moved from pilot-scale validation into production vehicle deployments with Great Wall Motor, Geely, Smart, and other automaker programs. Public evidence supports meaningful adoption and a widening OEM funnel, but it does not disclose customer-level revenue, renewal, retention, or concentration denominators.
sections:
  - id: customer-segments
    title: Buyer and user segments
    body: >-
      DeepRoute.ai sells intelligent-driving software and related development
      capability to automakers, while vehicle owners are the end users and
      automaker programs determine production scale. The clearest public buyer
      evidence is Great Wall Motor's Series C investment and deployment of city
      NOA across Wey and Tank models, alongside the Geely Galaxy M9 launch and
      Smart's development agreement. This is an OEM-led enterprise motion rather
      than a direct-to-consumer product. The disclosed customer set spans Chinese
      domestic brands, a Mercedes-Benz/Geely-backed Smart program, and an
      undisclosed full-line standard-configuration customer, but public sources
      do not identify contract values, procurement stages, or the share of
      revenue represented by each account.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption and deployment trajectory
    body: >-
      The adoption trajectory is unusually concrete for a private autonomy
      supplier: one source reports approximately 20,000 integrated vehicles
      delivered since August 2024, another reports more than 30,000 in four
      months, and later coverage reports 200,000 cumulative mass-produced
      vehicles. China Daily's account of roughly
      30,000–35,000 October 2025 urban-NOA installations and about 38% of
      third-party supplier deployments provides an external market frame. These
      figures are not interchangeable: some are company or partner statements,
      some are market estimates, and the time windows differ. There is no public
      active-vehicle denominator, utilization series, or repeat-purchase cohort,
      so deployment should not be read as retention or recurring revenue.
    claimRefs: [CU005, CU006, CU007, CU008, CU015]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: named-proof-and-durability
    title: Named proof, expansion, and durability
    body: >-
      Named production evidence is stronger than a logo list. Wey Lanshan,
      Wey Gaoshan, Tank 500, and Geely Galaxy M9 are tied in public reporting
      to city-NOA-equipped production vehicles, while Smart's agreement covers
      joint development, overseas road testing, and future deployment. The
      reported Lanshan and Gaoshan sales outcomes are vehicle-model sales, not
      DeepRoute.ai customer retention or software revenue. Expansion is visible
      in additional models, brands, and a stated full-line program, but the
      available record does not establish contract duration, renewal, gross
      retention, net expansion, pricing, or whether OEMs can replace the stack
      internally.       April 2025 reporting on regulatory tightening also described adoption
      friction through restrictions on public testing, terminology, driver
      monitoring, and OTA updates; the assigned evidence does not establish
      whether every reported restriction remained unchanged at the run date.
      Those constraints make production validation valuable while leaving
      future rollout pace uncertain.
    claimRefs: [CU009, CU010, CU011, CU012, CU013, CU014, CU016]
    tableRefs: [TU003]
    figureRefs: []
