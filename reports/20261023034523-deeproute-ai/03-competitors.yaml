callouts:
  - calloutType: insight
    title: Deployment is the current moat, not a proven lock-in
    body: DeepRoute.ai's strongest evidence is rapid OEM deployment and the resulting data loop; retained sources do not establish exclusive contracts, switching costs, realized pricing, or a durable technical lead.
    claimRefs: [CP002, CP006, CP010, CP014]
  - calloutType: risk
    title: Robotaxi is an option with execution and safety risk
    body: The retained evidence supports robotaxi ambition and industry scale-up, but adjacent operators' safety and regulatory obstacles show why future robotaxi value should not be treated as current recurring revenue.
    claimRefs: [CP005, CP011, CP013]
