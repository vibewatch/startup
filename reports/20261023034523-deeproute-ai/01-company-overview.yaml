callouts:
  - calloutType: strength
    title: Production evidence has moved beyond pilot scale
    body: "Multiple issuers report deployment growth from more than 20,000 vehicles in 2024 to company-attributed figures of around 200,000 in October 2025 and 300,000 by April 2026, although definitions still require reconciliation."
    claimRefs: [CO010, CO011, CO012]
  - calloutType: risk
    title: Capital and scale do not reveal economic quality
    body: "Known financing rounds are not cash availability, and no assigned source establishes current revenue, gross margin, customer concentration, burn, runway, or valuation."
    claimRefs: [CO007, CO008, CO009]
  - calloutType: recommendation
    title: Verify governance and IPO status before underwriting
    body: "The board, founder ownership, investor rights, and reported Hong Kong filing require primary documents before they can anchor control or valuation conclusions."
    claimRefs: [CO003, CO013]
