company:
  name: DeepRoute.ai
chapter:
  number: 1
  title: Company Overview
  summary: DeepRoute.ai is a Shenzhen-headquartered intelligent-driving supplier that pivoted from Level 4 robotaxi research toward OEM-embedded Level 2+/Level 3 systems. Public evidence supports production deployment and at least $400 million across two disclosed rounds, but current revenue, valuation, cash availability, ownership, and governance remain material gaps.
sections:
  - id: identity-footprint-and-model
    title: Identity, footprint, and operating model
    body: >-
      DeepRoute.ai was founded in 2019 and is headquartered in Shenzhen, with
      company-disclosed offices in Beijing and Fremont, California. A current
      Fremont job listing provides an operating address and describes work on
      planning modules, simulation, real-world integration, robustness, and
      delivery management, but it does not establish total headcount. The
      business model reported by TechCrunch is a per-vehicle technology
      licensing fee paid by automakers, coupled with vehicle-data collection
      for model training. That places the current commercial wedge inside OEM
      production programs rather than in a separately evidenced robotaxi fleet.
      The retained evidence does not disclose legal-entity structure, active
      site staffing, customer count, or a current product-level revenue split.
    claimRefs: [CO001, CO002, CO004, CO005]
    tableRefs: [TO001]
  - id: capital-stage-and-disclosure
    title: Capital history, stage, and disclosure limits
    body: >-
      CNBC reported that Alibaba led a $300 million round in 2021 that valued
      DeepRoute.ai above $1 billion. In November 2024, the company announced
      another $100 million strategic financing from an unnamed automotive OEM;
      CNBC, citing PitchBook, identified Great Wall Motor as the lead investor,
      while TechCrunch also reported Great Wall as the backer. Those two cited
      rounds sum to at least $400 million, but that subtotal is neither total
      lifetime funding nor cash currently available. A later 36Kr report said
      listing materials were submitted by the end of 2025 for a Hong Kong IPO.
      Without an exchange filing or prospectus in the assigned evidence, the
      company should be treated as private with reported IPO preparation, not
      as a confirmed listing candidate with a current valuation.
    claimRefs: [CO007, CO008, CO009, CO013]
    tableRefs: [TO003]
  - id: leadership-governance-and-execution
    title: Leadership, governance, and execution capacity
    body: >-
      Maxwell Zhou is the only named current executive repeatedly identified in
      the retained sources, appearing as CEO in both the company financing
      release and CNBC's independent coverage. That visibility supports his
      role as the principal public spokesperson for financing and product
      direction, but it also makes key-person dependence difficult to assess
      because co-founders, the board, succession arrangements, and executive
      ownership are not disclosed. Meegle's vendor case study describes a large
      automotive-software process burden of more than 3,800 pages of
      documentation and over 5,000 requirements, with an unnamed Project
      Director discussing traceability and defect workflows. This indicates
      operational process depth, but the source is a partner case study rather
      than independent verification of engineering quality or organizational
      resilience.
    claimRefs: [CO003, CO006]
    tableRefs: [TO002]
  - id: deployment-milestones-and-regulation
    title: Deployment milestones and regulatory exposure
    body: >-
      The deployment trajectory is directionally positive but cannot be read as
      one audited series. TechCrunch reported the first production model in
      August 2024, and company and independent sources placed deployments above
      20,000 vehicles by November. EV Magazine later reported around 200,000
      vehicles with urban NOA in October 2025, while Simplify presented a
      company claim of 300,000 by April 2026. The values use different dates,
      products, and reporting channels, so they do not prove activation,
      utilization, or revenue. Independent trade publications also report
      relationships with Smart and Black Sesame Technologies, broadening the
      OEM and compute ecosystem. Against that scale narrative, CarNewsChina
      reported April 2025 MIIT restrictions on public beta testing, marketing,
      remote functions, driver monitoring, and OTA updates, creating a
      compliance constraint that could affect launch cadence and feature scope.
    claimRefs: [CO010, CO011, CO012, CO014, CO015]
    figureRefs: [FO001]
