evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Current revenue, per-vehicle pricing, gross margin, burn rate, cash balance, debt, and runway.
    whyItMatters: Deployment scale and historical funding do not establish economic quality or current liquidity.
    diligencePath: Request audited statements, management accounts, OEM contract economics, debt schedules, and a cash forecast.
    relatedQuestionRefs:
      - QO003
      - QO004
      - QO006
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: >-
      Current founders, board roster, ownership, investor rights, succession plan, and executive biographies beyond the
      CEO.
    whyItMatters: Control, strategic-investor influence, and key-person dependence cannot be underwritten from one named executive.
    diligencePath: Request the cap table, shareholder-rights summary, board minutes or roster, and executive succession materials.
    relatedQuestionRefs:
      - QO002
      - QO003
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: deployment
    missingEvidence: A reconciled schedule defining produced, delivered, activated, and Urban NOA-equipped vehicles by OEM and date.
    whyItMatters: The 20,000, 200,000, and 300,000 figures use different periods, definitions, and issuers.
    diligencePath: Obtain OEM-by-OEM production and activation data with product definitions and third-party audit support.
    relatedQuestionRefs:
      - QO004
      - QO007
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: IPO
    missingEvidence: An HKEX filing, prospectus, hearing document, or issuer confirmation of the reported Hong Kong process.
    whyItMatters: Unverified listing activity cannot support a current valuation, timing, or liquidity conclusion.
    diligencePath: Check HKEX records and obtain written confirmation from the issuer or listing advisers.
    relatedQuestionRefs:
      - QO003
      - QO010
  - type: missing-source
