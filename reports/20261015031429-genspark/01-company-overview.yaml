company:
  name: Genspark
chapter:
  number: 1
  title: Company Overview
  summary: Genspark has pivoted quickly from AI search into an agentic workspace narrative backed by aggressive company-reported scale claims and repeated fundraising, but the public record still leans heavily on company-controlled or secondary sources for valuation, cap-table, and governance detail.
sections:
- id: identity-and-positioning
  title: Identity, positioning, and stage
  body: 'Genspark now presents itself as an all-in-one AI workspace rather than a point AI search product. Across its landing page, business site, January 2026 launch release, and later Gen-1 Slides post, the company describes a workflow where users state an outcome and agents return finished work across slides, documents, spreadsheets, media, voice, and chat. That positioning matters because the evidence trail shows a real category shift: OpenAI and an external company profile both say the product started as AI search and pivoted to agentic AI in April 2025. The company is therefore best understood today as a fast-scaling Series B agentic productivity platform with a broad workspace ambition, not merely a search assistant.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO007
  - CO012
  - CO004
  tableRefs:
  - TO001
- id: leadership-footprint-and-governance
  title: Leadership, operating footprint, and governance visibility
  body: 'The named leadership record in the assigned pool centers on co-founders Eric Jing and Kay Zhu. Jing anchors the public launch narrative as CEO, while Zhu appears as the technical spokesperson in OpenAI’s case study and in secondary profiles describing the product architecture. Operating footprint is clearer than governance: sources place the company in Palo Alto, and the January 2026 release says Genspark was building a local team in Japan. What remains thin is board and control disclosure. None of the assigned sources surfaced a board roster, cap table, liquidation preferences, or voting rights, so later diligence should treat governance and ownership as open workstreams rather than established facts.'
  claimRefs:
  - CO002
  - CO010
  - CO013
  - CO014
  - CO015
  tableRefs:
  - TO002
  - TO003
- id: funding-scale-and-refresh-readout
  title: Funding, scale claims, and milestone readout
  body: The refresh evidence reinforces a pattern of unusually fast scale claims paired with incomplete public substantiation. Company-controlled material announced a $275 million Series B at a $1.25 billion post-money valuation in late 2025, then said Genspark surpassed $100 million ARR within nine months by January 2026. An external profile extends that story to a June 2026 $100 million Series B extension at a $2.6 billion post-money valuation and $645 million total raised, while Sacra independently warns that incumbent bundling and workspace commoditization could pressure expansion and pricing power. In practical terms, the top-line narrative is credible enough to treat Genspark as a heavily financed growth company, but not yet transparent enough to treat valuation, recurring revenue quality, or governance economics as fully verified.
  claimRefs:
  - CO004
  - CO005
  - CO006
  - CO008
  - CO009
  - CO011
  - CO016
  figureRefs:
  - FO001
