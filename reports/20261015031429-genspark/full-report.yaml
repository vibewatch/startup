      - number: '1.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The investable story is a category pivot backed by repeated financing, not just a usage spike.
            body: >-
              The assigned pool consistently supports a fast move from AI search into an agentic workspace, then layers
              successive product and financing announcements on top of that pivot.
            calloutType: insight
