        - medium
        - high
        - watchlist
        - A lower entry mark can compensate for missing proof faster than narrative growth alone can.
    notes: >-
      Rows distinguish today's public-evidence call from what would change the call; they are not independent investment
      recommendations.
    claimRefs:
      - CV004
      - CV006
      - CV010
      - CV014
      - CV015
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Side
      - Argument
      - What would change the view
    rows:
      - - Thesis
        - >-
          Growth proof is unusually strong for stage: company disclosures cite $100M ARR by January 2026 and $250M
          annualized run rate / 7,000 business clients by July, while Sacra estimated $250M annualized revenue in March.
        - Independent or audited retention and margin disclosure would make this proof more valuation-relevant.
      - - Thesis
        - >-
          The product is broad enough to support platform aspirations: official pages position autonomous agents,
          AI-native productivity surfaces, and 200+ integrations inside one workspace.
        - >-
          Reference customers, net expansion data, and usage-to-paid conversion evidence would strengthen the platform
          case.
      - - Anti-thesis
        - >-
          The valuation ramp from $1.25B in November 2025 to $2.6B by June/July 2026 outpaced public disclosure on
          cap-table terms, retention, gross margin, and burn.
        - A signed cap-table summary plus audited economics could justify paying closer to the latest mark.
      - - Anti-thesis
        - >-
          Sacra's downside lens is credible: Microsoft/Google bundling and broader commoditization can pressure both
          price and margin in AI productivity.
        - Sustained premium pricing, durable win rates, and contribution-margin proof would reduce compression risk.
    notes: >-
      This table separates operating proof from price support because growth and valuation support are not the same
      thing.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV006
      - CV007
      - CV010
      - CV011
      - CV012
      - CV013
      - CV016
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          The 7,000-business-client and $250M annualized-run-rate narrative reflects durable enterprise revenue, strong
          retention, acceptable margins, and non-punitive financing terms.
        - >-
          Supportable value can move toward or above the latest $2.6B private mark only if diligence proves the revenue
          quality and economics behind it.
        - Execution misses, margin drag from compute, or hidden preference overhang would break the bull case.
        - Needs audited revenue-quality disclosure plus clean cap-table evidence.
      - - Base
        - >-
          Genspark is growing quickly, but public evidence remains dominated by company-controlled disclosures and
          third-party estimates rather than audited recurring-revenue proof.
        - >-
          No defensible numeric underwriting range is supportable from the retained public evidence; verified economics
          or a lower negotiated entry price must supply the margin of safety.
        - Opacity on retention, gross margin, burn, and dilution keeps the mark vulnerable to discounting.
        - Most consistent with the current evidence set.
      - - Bear
        - >-
          Business adoption is real but less monetizable or less durable than the headline narrative implies, while
          incumbents bundle competing features into existing suites.
        - >-
          The current private mark compresses, and a later financing could reset below the latest extension narrative if
          economics disappoint.
        - Bundling, commoditization, slower paid expansion, or weak contribution margins.
        - Becomes more likely if diligence cannot verify pricing power or paid-seat durability.
    notes: >-
      Ranges are expressed qualitatively because the retained public evidence does not provide audited
      recurring-revenue, margin, or preference data for false-precision modeling.
    claimRefs:
      - CV001
      - CV004
      - CV006
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
      - CV016
