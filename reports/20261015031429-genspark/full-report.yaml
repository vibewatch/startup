              - CU013
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU009
              - CU011
              - CU013
      - number: '6.2'
        title: Adoption looks broad, but the metrics are not fully comparable
        blocks:
          - type: paragraph
            body: >-
              The strongest public signal is breadth, not clean cohort quality. Company-controlled surfaces move from
              more than 1,000 organizations using AI Workspace in January 2026 to 7,000-plus teams on the business page
              and more than 7,000 business clients in the July 2026 launch release. Sacra adds an outside estimate of
              more than 2 million monthly active users and roughly 100,000 paying seats, while the U365 review cites
              more than 1 million Google Play downloads and about 101,000 reviews. Together these imply real adoption,
              but they mix organizations, teams, clients, MAUs, seats, downloads, and reviews rather than one audited
              denominator.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
      - number: '6.3'
        title: Named customer proof exists, but most of it is still company-shaped
        blocks:
          - type: paragraph
            body: >-
              Named proof is present but uneven. The best concrete case in the assigned pool is ADK Marketing Solutions
              in Japan, where the January 2026 press release says teams cut data-analysis and document-creation
              workloads by roughly 80 percent over a period of months. Beyond that, the official business page mostly
              teases user stories, while the affiliate landing page offers anecdotal testimonials from creators and
              product users rather than procurement-grade references. That is enough to show the product is being used
              across solo, departmental, and enterprise-style contexts, but not enough to establish repeatable
              production depth, contract size, or renewal quality across the base.
            claimRefs:
              - CU008
              - CU010
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU008
              - CU010
              - CU012
      - number: '6.4'
        title: Expansion path is visible; durability and concentration are not
        blocks:
          - type: paragraph
            body: >-
              The product clearly has an expansion story from a free or lightly paid wedge into Team and Enterprise
              controls, but the public record still leaves the core durability questions open. The U365 review
              highlights missing per-run price transparency for Super Agent and recurring billing complaints, while none
              of the retained sources disclose NRR, GRR, logo churn, cohort retention, renewal rates, top-customer
              concentration, or channel dependence. That means outside observers can see acquisition momentum and
              packaging logic, but cannot yet verify whether Genspark is retaining seats, deepening deployment, or
              concentrating revenue in a small number of large customers.
            claimRefs:
              - CU009
              - CU011
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Office-tool adjacency is the clearest wedge
            body: >-
              The cleanest bottom-up motion in the assigned pool is not abstract "AI agents" but Genspark embedded where
              users already work, especially Docs and Sheets, then expanded with team collaboration and admin controls.
            calloutType: insight
            claimRefs:
              - CU002
              - CU010
              - CU013
          - type: callout
            title: Breadth is visible; durability is not
            body: >-
              Public evidence is strong enough to show broad adoption signals, but still too thin to verify renewal
              quality, customer concentration, or whether the largest logos are expanding or churning.
            calloutType: risk
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
