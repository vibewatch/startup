chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, positioning, and stage
        blocks:
          - type: paragraph
            body: >-
              Genspark now presents itself as an all-in-one AI workspace rather than a point AI search product. Across
              its landing page, business site, January 2026 launch release, and later Gen-1 Slides post, the company
              describes a workflow where users state an outcome and agents return finished work across slides,
              documents, spreadsheets, media, voice, and chat. That positioning matters because the evidence trail shows
              a real category shift: OpenAI and an external company profile both say the product started as AI search
              and pivoted to agentic AI in April 2025. The company is therefore best understood today as a fast-scaling
              Series B agentic productivity platform with a broad workspace ambition, not merely a search assistant.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO007
              - CO012
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO002
              - CO005
              - CO006
              - CO007
              - CO009
              - CO010
      - number: '1.2'
        title: Leadership, operating footprint, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              The named leadership record in the assigned pool centers on co-founders Eric Jing and Kay Zhu. Jing
              anchors the public launch narrative as CEO, while Zhu appears as the technical spokesperson in OpenAI’s
              case study and in secondary profiles describing the product architecture. Operating footprint is clearer
              than governance: sources place the company in Palo Alto, and the January 2026 release says Genspark was
              building a local team in Japan. What remains thin is board and control disclosure. None of the assigned
              sources surfaced a board roster, cap table, liquidation preferences, or voting rights, so later diligence
              should treat governance and ownership as open workstreams rather than established facts.
            claimRefs:
              - CO002
              - CO010
              - CO013
              - CO014
              - CO015
          - type: table
            tableRef: TO002
            claimRefs:
