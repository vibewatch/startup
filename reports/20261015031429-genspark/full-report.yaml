              - CO006
              - CO009
              - CO015
      - number: '1.3'
        title: Funding, scale claims, and milestone readout
        blocks:
          - type: paragraph
            body: >-
              The refresh evidence reinforces a pattern of unusually fast scale claims paired with incomplete public
              substantiation. Company-controlled material announced a $275 million Series B at a $1.25 billion
              post-money valuation in late 2025, then said Genspark surpassed $100 million ARR within nine months by
              January 2026. An external profile extends that story to a June 2026 $100 million Series B extension at a
              $2.6 billion post-money valuation and $645 million total raised, while Sacra independently warns that
              incumbent bundling and workspace commoditization could pressure expansion and pricing power. In practical
              terms, the top-line narrative is credible enough to treat Genspark as a heavily financed growth company,
              but not yet transparent enough to treat valuation, recurring revenue quality, or governance economics as
              fully verified.
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO008
              - CO009
              - CO011
              - CO016
