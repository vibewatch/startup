  - id: FM001
    title: Constrained market sizing lens
    type: pyramid
    summary: >-
      Public evidence narrows from a broad knowledge-work universe to disclosed adoption and pricing signals rather than
      a defendable standalone TAM/SAM/SOM stack.
    data:
      items:
        - label: Broad knowledge-work boundary
          value: 1000000000
          unit: global knowledge workers+
          note: Business Wire releases describe Genspark as serving more than one billion global knowledge workers.
          tone: neutral
        - label: Current active-user lens
          value: 2000000
          unit: MAUs (Sacra est.)
          note: External estimate of top-of-funnel reach, not an audited company filing.
          tone: neutral
        - label: Monetized seat lens
          value: 100000
          unit: paying seats (Sacra est.)
          note: External estimate; conversion and retention remain undisclosed.
          tone: neutral
        - label: Early enterprise cohort
          value: 1000
          unit: organizations+
          note: Business Wire said more than 1,000 organizations had begun using AI Workspace after the business launch.
          tone: neutral
        - label: Current business-client base
          value: 7000
          unit: business clients+
          note: Business Wire later said Genspark served more than 7,000 business clients.
          tone: neutral
        - label: Commercial pricing floor
          value: 30
          unit: USD per seat per month
          note: Official Team pricing; enterprise contracts are custom and typically much larger.
          tone: neutral
    approximationNotes: >-
      This is a constrained evidence lens, not a mathematically nested TAM/SAM/SOM funnel: the retained sources disclose
      a broad knowledge-worker boundary, adoption counts, and pricing, but not a segment-by-segment spend model or a
      fully comparable sequence of population units.
    claimRefs:
      - CM010
      - CM011
      - CM012
      - CM013
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: Ordinal map of execution depth versus embedded workflow distribution using only assigned evidence.
    data:
      xAxis:
        label: Autonomous execution depth
        min: 1
        max: 5
        low: Assistive chat / manual routing
        high: Finished multi-step execution
        description: Ordinal score synthesized from cited execution breadth and workflow-completion evidence.
        scale: ordinal
      yAxis:
        label: Embedded workflow distribution
        min: 1
        max: 5
        low: Mostly standalone surface
        high: Native incumbent work surface
        description: Ordinal score synthesized from cited bundle, suite, and in-file embed evidence.
        scale: ordinal
      points:
        - label: Genspark
          x: 5
          'y': 3
          context: >-
            Strongest cited end-to-end execution depth, but daily usage still relies on a dedicated workspace plus
            selective embeds.
        - label: Microsoft Copilot
          x: 3
          'y': 5
          context: >-
            TomorrowDesk calls this the most strategically significant threat because Office distribution is already
            installed.
        - label: Google Workspace with Gemini
          x: 3
          'y': 5
          context: >-
            Bundled suite AI and the surrounding Workspace surface make Google the clearest low-friction procurement
            alternative.
        - label: Notion AI
          x: 3
          'y': 4
          context: Adjacent execution around pages and databases, backed by an existing collaborative workspace.
        - label: Perplexity / ChatGPT class
          x: 2
          'y': 2
          context: Research and answer quality matter, but the user still finishes routing, formatting, and action steps.
        - label: Internal build / manual stack
          x: 1
          'y': 4
          context: Lives inside existing tools but leaves orchestration, verification, and packaging with the user.
    approximationNotes: >-
      Axes are ordinal 1-5 judgments synthesized from cited execution and distribution evidence; they are not
      market-share, NPS, or feature-count measurements.
    claimRefs:
      - CP003
      - CP004
      - CP005
      - CP006
      - CP012
      - CP013
      - CP015
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence points to a hybrid funnel from freemium usage into seats, enterprise contracts, and adjacent
      monetization, but the bridge to margin remains unproven.
    data:
      nodes:
        - label: Freemium usage base
          detail: Sacra estimates more than 2M monthly active users and about 100k paying seats.
        - label: Team conversion
          detail: Self-serve Team plan is listed at $30 per seat per month with 10,000 credits and 60 GB storage.
        - label: Enterprise contracts
          detail: Enterprise is custom-priced, typically six figures annually, with unlimited-seat annual contracts.
        - label: Workflow-embedded distribution
          detail: >-
            Microsoft 365 plugins, Azure-backed delivery, and 200+ enterprise connectors aim to keep usage inside
            existing workflows.
        - label: Usage cost layer
          detail: >-
            Bundled credits and partner infrastructure imply that realized gross profit depends on workload intensity
            and vendor terms.
        - label: Underwriting proof gap
          detail: >-
            Company-claimed $250M annualized run rate and 7,000+ business clients outpace the public disclosure of
            retention, gross margin, burn, and runway.
    approximationNotes: >-
      The figure is a qualitative sequence, not a quantified conversion funnel; public sources do not disclose stage
      conversion rates or contribution margins.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI008
      - CI013
      - CI014
  - id: FE001
    title: Product architecture map from context to governed output
    type: stack
    summary: >-
      Six public-facing layers show how Genspark packages context, orchestration, tools, and output applications into an
      enterprise workspace.
    data:
      layers:
        - label: Input surfaces
          detail: Web research, email, meetings, files, voice, calls, and connected business systems
          items:
            - Web and files
            - Email and meetings
            - Voice and calls
        - label: Persistent context
          detail: SecondBrain and AI Drive retain connected context and generated work
          items:
            - SecondBrain
            - AI Drive
            - Project memory
        - label: Agent orchestration
          detail: Super Agent plans tasks and routes work across a changing set of third-party models
          items:
            - Task planning
            - Model routing
            - Multi-agent execution
        - label: Tool and connector layer
          detail: Tools, native integrations, and MCP-compatible endpoints connect agents to action surfaces
          items:
            - Integrated tools
            - Business connectors
            - MCP endpoints
        - label: Output applications
          detail: Native products return editable business artifacts and communications
          items:
            - Slides, sheets, docs
            - Media and design
            - Apps and email
        - label: Governance and deployment
          detail: Enterprise controls govern identity, access, isolation, logs, keys, and deployment region
          items:
            - SSO and SCIM
            - Roles and audit logs
            - Isolation and residency
    approximationNotes: >-
      This is a functional map synthesized from public product descriptions, not a disclosed infrastructure diagram;
      layer ordering does not imply a verified runtime sequence.
    claimRefs:
      - CE001
      - CE005
      - CE012
      - CE015
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Public evidence points to a bottom-up wedge that expands into team collaboration and enterprise controls, with
      durability checks still unresolved.
    data:
      items:
        - label: Individual discovery and trial
          tone: positive
          actor: Prosumer / creator
          stage: Entry
          touchpoints:
            - Free account or social-proof discovery through affiliate and app surfaces
            - Tests research, slides, calls, or app-building from a prompt
        - label: Embedded office workflow wedge
          tone: positive
          actor: Analyst / marketer / ops user
          stage: Wedge
          touchpoints:
            - Google Docs and Sheets sidebar adoption inside existing files
            - Plain-language edits, formulas, charts, summaries, and translations
        - label: Paid self-serve seat
          tone: neutral
          actor: Individual or small-team admin
          stage: Monetization
          touchpoints:
            - Free account required; paid plans unlock higher limits and more frontier models
            - Team plan packages credits, storage, billing, analytics, and connector management
        - label: Departmental collaboration
          tone: positive
          actor: Manager plus functional team
          stage: Expansion
          touchpoints:
            - Shared agents, docs, knowledge, and admin controls move usage from solo to team
            - Genspark Teams and Team plan create a collaboration and seat-expansion path
        - label: Governed enterprise rollout
          tone: positive
          actor: IT / security / procurement
          stage: Scale
          touchpoints:
            - SAML, SCIM, RBAC, audit logs, residency, advanced reporting, and dedicated CSM
            - Custom annual contracts and six-figure enterprise packaging support broader rollout
        - label: Durability and concentration check
          tone: risk
          actor: Finance / procurement / investor
          stage: Risk
          touchpoints:
            - No public NRR, GRR, churn, cohort, or concentration disclosure in retained sources
            - Billing complaints and unreconciled customer-count metrics keep durability unproven
    approximationNotes: null
    claimRefs:
      - CU001
      - CU009
      - CU011
      - CU013
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Residual risk remains concentrated in partner dependence, monetization opacity, and the execution burden implied
      by the 2026 growth narrative.
    data:
      columns:
        - label: Likelihood
        - label: Residual severity
        - label: Current mitigation state
      rows:
        - label: Compliance proof gap
          values:
            - label: Medium
              tone: warning
              note: >-
                Enterprise controls are marketed, but the most specific dated compliance disclosure retained here is
                still roadmap-style.
            - label: High
              tone: warning
              note: >-
                Enterprise controls are marketed, but the most specific dated compliance disclosure retained here is
                still roadmap-style.
            - label: Partial
              tone: warning
              note: Current mitigations are mostly promises and positioning rather than independently cited proof.
        - label: Support / quota opacity
          values:
            - label: High
              tone: high
              note: >-
                Independent review flags fair-use caps and weak support while marketplace materials still point to
                monthly quotas.
            - label: High
              tone: high
              note: Heavy-use teams may discover hidden entitlement ceilings before proving ROI.
            - label: Limited
              tone: warning
              note: Public evidence discloses quotas but not SLA or support-performance proof.
        - label: Model / API dependency
          values:
            - label: High
              tone: critical
              note: OpenAI models and Realtime API are described as central to Super Agent despite multi-model positioning.
            - label: Very high
              tone: critical
              note: Partner outages or repricing could hit both product quality and unit economics.
            - label: Moderate
              tone: positive
              note: Multi-model routing offers some architectural diversity, but redundancy is not quantified.
        - label: Product-surface sprawl
          values:
            - label: Medium
              tone: warning
              note: Memory, hardware, email, design, and custom software launches expand the QA and security burden.
            - label: High
              tone: warning
              note: Each added surface increases change-management and permission-review complexity.
            - label: Partial
              tone: warning
              note: >-
                Broad suite ambition is clear, but the retained pool does not show reliability metrics across those
                surfaces.
        - label: Valuation execution gap
          values:
            - label: Medium
              tone: critical
              note: Public claims moved from >$100M ARR in January to $250M ARR and $2.6B valuation by July 2026.
            - label: Very high
              tone: critical
              note: >-
                Missing public unit-economics detail makes a narrative reset more plausible if retention or margin
                quality lags.
            - label: Narrow
              tone: warning
              note: >-
                Capital raised is substantial, but the assigned evidence does not bridge to runway or cash-burn
                durability.
        - label: Incumbent bundle pressure
          values:
            - label: High
              tone: high
              note: Sacra argues Microsoft and Google can underprice or bundle adjacent AI features.
            - label: High
              tone: high
              note: Platform incumbents can attack both pricing and distribution at once.
            - label: Limited
              tone: warning
              note: >-
                Genspark's differentiation is real, but the retained pool does not show durable moat evidence against
                suite bundles.
    claimRefs:
      - CR007
      - CR008
      - CR009
      - CR010
      - CR011
      - CR012
      - CR015
      - CR016
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Operating momentum is real, but undisclosed unit economics and financing terms block a full-price recommendation.
    data:
      nodes:
        - id: proof-1
          label: Growth proof
          note: >-
            $100M ARR by Jan-2026, a $250M annualized-revenue estimate in Mar-2026, and a $250M annualized-run-rate
            company claim by Jul-2026.
        - id: proof-2
          label: Platform breadth
          note: Official positioning combines autonomous agents, AI-native productivity tools, and 200+ integrations.
        - id: proof-3
          label: Commercial signal
          note: Public materials cite 1,000+ organizations earlier in 2026 and 7,000+ business clients by Jul-2026.
        - id: risk-1
          label: Disclosure gap
          note: No retained public source discloses retention, gross margin, burn, or 2026 preference terms.
        - id: risk-2
          label: Compression risk
          note: Independent analysis warns that Microsoft/Google bundling and commoditization can pressure premium pricing.
        - id: decision
          label: Recommendation
          note: Research more; valuation stretched until diligence proves revenue quality and financing economics.
      edges:
        - from: proof-1
          to: proof-2
          label: supports upside narrative
        - from: proof-2
          to: proof-3
          label: can explain adoption
        - from: proof-3
          to: risk-1
          label: still needs proof
        - from: risk-1
          to: risk-2
          label: amplifies downside
        - from: risk-2
          to: decision
          label: sets entry discipline
    claimRefs:
      - CV002
      - CV003
      - CV006
      - CV007
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
