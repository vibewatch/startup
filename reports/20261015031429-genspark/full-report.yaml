              - CP006
              - CP012
              - CP013
              - CP015
      - number: '3.2'
        title: Execution breadth is differentiated, but the price benchmark is messy
        blocks:
          - type: paragraph
            body: >-
              The strongest public differentiation is not raw model quality but task completion breadth. Genspark's
              cited surfaces span autonomous agents, slides, docs, sheets, email, voice, and phone calls, which is
              materially broader than the research-first or chat-first substitutes described in the independent reviews.
              The harder comparison is economic: Sacra and TomorrowDesk place team pricing around $30 per user per
              month, while Google Workspace with Gemini is described as folded into a $14 per user per month Business
              Standard bundle. Cybernews also flags limited pricing visibility and rapid credit consumption on heavier
              workloads, so the effective price to beat the incumbent stack is still not cleanly observable from public
              evidence.
            claimRefs:
              - CP003
              - CP005
              - CP010
              - CP011
              - CP013
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP005
              - CP010
              - CP011
              - CP013
              - CP014
      - number: '3.3'
        title: Distribution and trust posture decide whether execution breadth can convert
        blocks:
          - type: paragraph
            body: >-
              Microsoft and Google look most dangerous where enterprises already live inside Office or Workspace and
              procurement prefers adding one bundled capability over introducing a new system of work. TomorrowDesk
              explicitly identifies Microsoft Copilot as the most strategically significant comparison because of native
              Office distribution, and Sacra makes the same point for Google Workspace with Gemini. Genspark does have
              some public answers to the embed gap: its Google Workspace marketplace listing shows in-file Docs, Sheets,
              and Slides usage, and the same listing emphasizes current-only permissions and auditable edits. Those
              signals help on trust, but they do not yet prove large-scale suite displacement or durable lock-in against
              the incumbents' existing workflow base.
            claimRefs:
              - CP004
              - CP006
              - CP007
              - CP008
              - CP009
              - CP014
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
              - CP004
              - CP006
              - CP007
              - CP008
              - CP012
              - CP013
      - number: '3.4'
        title: Moat durability still hinges on proving economics and displacement
        blocks:
          - type: paragraph
            body: >-
              The adverse evidence is not that Genspark lacks a differentiated product; it is that the differentiator
              may be expensive to sustain and easy for powerful suites to narrow. Cybernews highlights pricing opacity,
              fast credit burn, hallucination risk, and slow support, while TomorrowDesk says Claw's dedicated
              cloud-computer model is expensive to operate and notes hard-to-predict credit consumption from early
              users. Sacra adds the broader strategic threat: incumbents can bundle AI below market rates and adjacent
              suites are rapidly adding their own agents. Without public data on realized enterprise discounts,
              multi-year contracts, or verified migrations away from Microsoft and Google, the moat thesis remains
              promising but unproven.
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Execution is the real comparison set
            body: >-
              The public wedge is not 'better chat' but fewer handoffs: Genspark is strongest when buyers want a
              finished artifact or action rather than another answer box.
            calloutType: insight
            claimRefs:
              - CP002
              - CP003
          - type: callout
            title: Bundled suites can compress willingness to pay
            body: >-
              Google's cited $14 bundle and Microsoft's installed Office footprint are the sharpest public threats
              because Genspark still has not disclosed the contract terms or migration proof needed to show durable
              pricing power.
            calloutType: risk
            claimRefs:
              - CP004
              - CP005
              - CP013
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Monetization surfaces and pricing
        blocks:
          - type: paragraph
            body: >-
              Public monetization is clearer on list pricing than on realized economics. Genspark's current business
              page shows a Team plan at $30 per seat per month with 10,000 credits and 60 GB of storage per seat, while
              Enterprise is custom-priced, typically six figures annually, and sold on unlimited-seat annual contracts
              with a larger bundled credit allowance. Sacra separately describes a freemium funnel with more than 2
              million monthly active users and an estimated 100,000 paying seats. That mix implies the company is
              selling a hybrid of self-serve seats, enterprise commitments, and at least one incremental add-on rather
              than a pure usage-metered API business.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI009
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
