      items:
        - date: '2023'
          label: Founded in Palo Alto
          detail: MainFunc / Genspark was founded in 2023 and is described as Palo Alto-based.
          tone: positive
          claimRefs:
            - CO002
        - date: '2024'
          label: AI search launch era
          detail: External sources say Genspark began as an AI search engine before expanding toward autonomous work.
          tone: neutral
          claimRefs:
            - CO003
        - date: 2024-06
          label: Seed financing
          detail: External financing table lists a $60M seed round at a $260M post-money valuation.
          tone: positive
          claimRefs:
            - CO006
        - date: 2025-02
          label: Series A disclosed
          detail: External profile lists a $100M Series A at a $530M post-money valuation.
          tone: positive
          claimRefs:
            - CO006
        - date: 2025-04
          label: Pivot to agentic AI
          detail: OpenAI and an external profile both place the pivot away from search in April 2025.
          tone: opportunity
          claimRefs:
            - CO003
        - date: 2025-11
          label: AI Workspace launch and unicorn round
          detail: Official material announced AI Workspace alongside a $275M Series B at a $1.25B post-money valuation.
          tone: positive
