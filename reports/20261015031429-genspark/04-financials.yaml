- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Public ARR / run-rate trajectory
    - $36M ARR in 45 days (OpenAI); $100M ARR in 9 months (company); $250M annualized run rate by Jul-2026 (company)
    - Medium
    - Shows unusually fast commercial ramp, but mixes partner and company claims with no audited bridge
    - Provide audited revenue waterfall from launch through current period, split by recurring vs non-recurring revenue
  - - Seat-monetization proxy
    - ~100k paying seats at $30/month implies roughly $36M annualized team-plan revenue
    - Medium
    - Tests how much of the revenue story can be explained by public seat math before enterprise upsell
    - Provide paying-seat count by plan, realized ARPU, and enterprise share of recognized revenue
  - - Gross margin / burn / runway
    - null
    - Low
    - Capital adequacy cannot be underwritten without cloud/API cost structure, support burden, and cash consumption
    - Provide gross margin, monthly burn, cash balance, runway, and any debt or cloud-commitment obligations
  - - Sales efficiency / retention
    - null
    - Low
    - No public CAC, payback, logo concentration, or cohort retention means scaling quality is still unproven
    - Provide CAC, payback, pipeline conversion, net revenue retention, churn, and top-customer concentration
  notes: Computed seat-revenue proxy uses Sacra's paying-seat estimate and the current $30 Team list price; null entries mark metrics absent from the assigned public evidence.
