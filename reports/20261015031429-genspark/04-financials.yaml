figures:
- id: FI001
  title: Revenue model bridge
  type: flow
  summary: Public evidence points to a hybrid funnel from freemium usage into seats, enterprise contracts, and adjacent monetization, but the bridge to margin remains unproven.
  data:
    nodes:
    - label: Freemium usage base
      detail: Sacra estimates more than 2M monthly active users and about 100k paying seats.
    - label: Team conversion
      detail: Self-serve Team plan is listed at $30 per seat per month with 10,000 credits and 60 GB storage.
    - label: Enterprise contracts
      detail: Enterprise is custom-priced, typically six figures annually, with unlimited-seat annual contracts.
    - label: Workflow-embedded distribution
      detail: Microsoft 365 plugins, Azure-backed delivery, and 200+ enterprise connectors aim to keep usage inside existing workflows.
    - label: Usage cost layer
      detail: Bundled credits and partner infrastructure imply that realized gross profit depends on workload intensity and vendor terms.
    - label: Underwriting proof gap
      detail: Company-claimed $250M annualized run rate and 7,000+ business clients outpace the public disclosure of retention, gross margin, burn, and runway.
  approximationNotes: The figure is a qualitative sequence, not a quantified conversion funnel; public sources do not disclose stage conversion rates or contribution margins.
