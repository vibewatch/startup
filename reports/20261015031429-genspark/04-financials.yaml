callouts:
- calloutType: insight
  title: Revenue surface breadth is ahead of proof quality
  body: Genspark now exposes multiple monetization surfaces — self-serve seats, enterprise contracts, partner-embedded workflow distribution, and hardware — but public evidence still says far more about list pricing and reported ARR than about realized revenue composition or retention.
  claimRefs:
  - CI001
  - CI003
  - CI008
  - CI009
  - CI013
  - CI014
- calloutType: risk
  title: Margin durability is still a model-supply bet
  body: The assigned evidence supports rapid growth, but it also shows dependence on model and platform partners, lower-priced bundled competitors, and a missing public margin/runway picture. That combination makes the capital story strong and the unit-economics story incomplete.
  claimRefs:
  - CI010
  - CI012
  - CI015
  - CI016
