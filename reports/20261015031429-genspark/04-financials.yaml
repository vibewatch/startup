schemaVersion: report-v2
artifact: financials
slug: genspark
runDate: '2026-10-15'
company:
  name: Genspark
chapter:
  number: 4
  title: Financials
  summary: 'Genspark now discloses enough list pricing and top-line growth milestones to sketch the revenue model: $30-per-seat Team pricing, custom enterprise contracts, and at least one hardware add-on alongside rapid company-claimed ARR and client growth. But most proof remains company-issued, while gross margin, burn, runway, retention, and cap-table economics are still missing, so revenue quality and capital efficiency are not yet publicly underwritable.'
sections:
- id: monetization-surfaces-and-pricing
  title: Monetization surfaces and pricing
  body: Public monetization is clearer on list pricing than on realized economics. Genspark's current business page shows a Team plan at $30 per seat per month with 10,000 credits and 60 GB of storage per seat, while Enterprise is custom-priced, typically six figures annually, and sold on unlimited-seat annual contracts with a larger bundled credit allowance. Sacra separately describes a freemium funnel with more than 2 million monthly active users and an estimated 100,000 paying seats. That mix implies the company is selling a hybrid of self-serve seats, enterprise commitments, and at least one incremental add-on rather than a pure usage-metered API business.
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  - CI009
  tableRefs:
  - TI001
  - TI002
  figureRefs:
  - FI001
- id: traction-and-go-to-market-proxies
  title: Traction and go-to-market proxies
  body: The growth narrative is strong but still largely company-shaped. In January 2026, Genspark said it had crossed $100 million ARR within nine months and had more than 1,000 organizations on the platform soon after launching business plans. By July 2026, the company said it had reached $250 million in annualized run rate and more than 7,000 business clients. OpenAI's case study adds an earlier datapoint of $36 million ARR in 45 days for Super Agent. Commercial distribution increasingly rides inside existing workflows through Microsoft 365 plugins, Azure-backed delivery, and a connector-heavy enterprise control plane, which supports adoption velocity but does not substitute for public CAC, payback, or cohort expansion evidence.
  claimRefs:
  - CI006
  - CI007
  - CI008
  - CI013
- id: cost-structure-and-unit-economics-blind-spots
  title: Cost structure and unit-economics blind spots
  body: Public disclosures show that usage is packaged through bundled credits and delivered across partner infrastructure and third-party models, so realized gross profit should depend heavily on workload intensity and vendor terms. Yet none of the assigned sources publish gross margin, cloud/API spend, support burden, or working-capital dynamics. Silicon Valley Invest Club explicitly says no public profitability disclosure was found, while TechTimes says Genspark has not published broad task-success or retention data. Sacra also highlights the risk that Microsoft and Google can bundle comparable AI productivity features at lower prices. The result is a persuasive growth story with limited proof that the revenue base is durable or efficiently monetized.
  claimRefs:
  - CI002
  - CI003
  - CI012
  - CI014
  - CI015
  - CI016
  tableRefs:
  - TI003
- id: capital-adequacy-and-underwriting-verdict
  title: Capital adequacy and underwriting verdict
  body: 'The financing story is easier to observe than the cash story. Genspark''s April 2026 Microsoft partnership release still cited $545 million of total funding, while the July 2026 launch cited $645 million after a $100 million Series B extension at a $2.6 billion valuation. That likely gives the company meaningful growth capital, but the assigned pool does not disclose cash on hand, burn, runway, debt obligations, or minimum cloud commitments, and Silicon Valley Invest Club says the shareholder register is not public. Financial verdict: top-line momentum and distribution breadth look impressive, but revenue quality, margin path, and financing dependency remain underwriting blockers until management data closes the core evidence gaps.'
  claimRefs:
  - CI010
  - CI011
  - CI012
