    - type: private-evidence-only
      severity: material
      topic: conversion-economics
      missingEvidence: Conversion, retention, expansion, and budget-owner data that connects self-serve usage to durable paid-seat or enterprise revenue cohorts.
      whyItMatters: Market quality depends on repeatable conversion and expansion, not just topline ARR or user counts.
