figures:
  - id: FM001
    title: Constrained market sizing lens
    type: pyramid
    summary: Public evidence narrows from a broad knowledge-work universe to disclosed adoption and pricing signals rather than a defendable standalone TAM/SAM/SOM stack.
    data:
      items:
        - label: Broad knowledge-work boundary
          value: 1000000000
          unit: global knowledge workers+
          note: Business Wire releases describe Genspark as serving more than one billion global knowledge workers.
          tone: neutral
        - label: Current active-user lens
          value: 2000000
          unit: MAUs (Sacra est.)
          note: External estimate of top-of-funnel reach, not an audited company filing.
          tone: neutral
        - label: Monetized seat lens
          value: 100000
          unit: paying seats (Sacra est.)
          note: External estimate; conversion and retention remain undisclosed.
          tone: neutral
        - label: Early enterprise cohort
          value: 1000
          unit: organizations+
          note: Business Wire said more than 1,000 organizations had begun using AI Workspace after the business launch.
          tone: neutral
        - label: Current business-client base
          value: 7000
          unit: business clients+
          note: Business Wire later said Genspark served more than 7,000 business clients.
          tone: neutral
        - label: Commercial pricing floor
          value: 30
          unit: USD per seat per month
          note: Official Team pricing; enterprise contracts are custom and typically much larger.
          tone: neutral
    approximationNotes: >-
      This is a constrained evidence lens, not a mathematically nested TAM/SAM/SOM funnel: the retained sources disclose a broad
      knowledge-worker boundary, adoption counts, and pricing, but not a segment-by-segment spend model or a fully comparable
      sequence of population units.
    claimRefs:
      - CM010
      - CM011
      - CM012
      - CM013
callouts:
  - calloutType: insight
    title: Market wedge is workflow completion, not chat
    body: >-
      The assigned pool consistently positions Genspark around finished deliverables and cross-tool execution, which makes the
      relevant market closer to AI workspaces and copilot layers for knowledge teams than to generic chat or search products.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM011
  - calloutType: risk
    title: Public sizing evidence is traction-heavy and segment-light
    body: >-
      The available pool is strong on ARR, client, and pricing signals but weak on independent segment-by-segment market spend,
      conversion, retention, and budget expansion data, leaving valuation-sensitive market sizing partially unproven.
    claimRefs:
      - CM009
      - CM010
      - CM012
      - CM013
