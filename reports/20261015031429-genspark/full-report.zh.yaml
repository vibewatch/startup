      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - 7,000 家商业客户和 $250M 年化运行率的叙事，反映出持久的企业收入、强劲留存、可接受的利润率和不苛刻的融资条款。
        - 只有尽调验证了背后的收入质量和经济性，合理支撑的价值才可能接近或超过最新的 $2.6B 私募估值。
        - 执行失误、算力拖累利润率，或隐藏的优先权负担，都会破坏乐观情景。
        - 需要经审计的收入质量披露和清晰的股权表证据。
      - - 基准
        - Genspark 增长很快，但公开证据仍主要来自公司控制的披露和第三方估算，而非经审计的经常性收入证明。
        - 现有公开证据不足以支撑可辩护的数值投资区间；必须靠经验证的经济性或更低的协商入场价提供安全边际。
        - 留存率、毛利率、烧钱和稀释情况不透明，使该估值容易被打折。
        - 与当前证据集最一致。
      - - 悲观
        - 业务确有采用，但变现能力或持久性不如标题叙事所暗示；同时，现有巨头将竞争功能捆绑进现有套件。
        - 当前私募估值下调；如果经济性令人失望，后续融资可能把估值重置到最新增发叙事以下。
        - 捆绑销售、商品化、付费扩张放缓或贡献利润率疲弱。
        - 如果尽调无法验证定价权或付费席位的持久性，这一情景就更可能发生。
    notes: 由于保留的公开证据没有提供经审计的经常性收入、利润率或优先权数据，区间以定性方式表达，避免制造虚假的精确模型。
