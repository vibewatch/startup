      - number: '8.4'
        title: 情景与尽调触发点
        blocks:
          - type: paragraph
            body: >-
              情景分析应围绕证据质量，而不是激进外推。乐观情景需要 2026 年 7 月客户数和年化运行率叙事转化为具有可接受留存和利润率的持久企业收入，并证明 2026 年融资结构没有隐藏惩罚性优先权或稀释压力。基准情景是
              Genspark
              确实存在，但仍过于不透明，无法干净地判断价格，因此更适合观察名单或深入尽调，而非立即投入高确信度资本。悲观情景不是需求归零，而是高端席位定价、捆绑压力和不完整经济披露共同导致倍数压缩或未来下轮融资。论点破坏触发点是可衡量的：企业留存弱、贡献利润率薄、隐藏的优先权拖累，或商业客户数无法转化为粘性付费扩张。
            claimRefs:
              - CV006
              - CV008
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 公开增长证明真实存在，但价格支撑不完整
            body: 核心争论不是 Genspark 是否在增长，而是保留的公开证据是否足以在没有验证留存、利润率或融资经济性的情况下，支持按接近最新私人估值的价格买入。
            calloutType: recommendation
            claimRefs:
              - CV006
              - CV010
              - CV014
              - CV015
          - type: callout
            title: 捆绑与商品化是最清晰的下行渠道
            body: 如果 Microsoft / Google 把类似工作流打包进现有套件的速度快于 Genspark 证明溢价留存和利润率持久性，即使产品使用量保持高位，估值倍数也可能压缩。
            calloutType: risk
            claimRefs:
              - CV012
              - CV013
              - CV015
