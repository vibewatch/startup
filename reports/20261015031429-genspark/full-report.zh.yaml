      - number: '5.3'
        title: 编排、上下文、工具与依赖
        blocks:
          - type: paragraph
            body: >-
              已披露的运营模式是多代理系统，在第三方模型之间路由任务，并调用庞大的工具和连接器层。官方材料称连接器和兼容 MCP 的端点超过 200 个；其他公司发布则根据发布日期和产品范围，分别称模型超过 30 个或 70
              个。SecondBrain 从已连接系统加入持久上下文，AI Drive
              为输出提供存储和协作界面。架构的差异化在于编排和工作流打包，而非已披露的专有基础模型。因此，它依赖外部模型供应商、连接器权限、云可用性和可靠的文件转换。指定来源没有提供延迟、正常运行时间、评测、模型路由准确率、连接器失败率或各模块成本数据，因此可扩展性和质量控制主张仍未得到验证。
