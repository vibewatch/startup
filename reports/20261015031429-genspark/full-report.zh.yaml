  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 真正的竞争是既有工作流的控制权，而不只是聊天质量
        blocks:
          - type: paragraph
            body: >-
              指定证据始终把 Genspark 放在比“AI 搜索”或聊天机器人更广的竞争场中。Cybernews 称，该产品适合想要一个工作空间、而非在 ChatGPT、Notion 和 Google Slides
              之间来回切换的团队；TomorrowDesk 则称，首次使用者的预期由 ChatGPT、Perplexity 和 Notion AI 塑造。与此同时，Genspark 自己的材料和 OpenAI
              合作伙伴案例研究把产品定义为执行层：把一个请求转化为完成的幻灯片、电子表格、文档、电话和工作流输出。因此，实际竞争环境包括直接的 AI
              工作空间、已经掌握文件和身份层的既有套件、研究助手，以及在现有工具之间手工拼接提示词的现状技术栈。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
