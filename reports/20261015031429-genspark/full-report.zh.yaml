  - id: FM001
    title: 受限的市场规模视角
    type: pyramid
    summary: 公开证据从广义知识工作者群体逐步收窄到已披露的采用和定价信号，而不是构建可辩护的独立 TAM/SAM/SOM 漏斗。
    data:
      items:
        - label: 广义知识工作者边界
          value: 1000000000
          unit: global knowledge workers+
          note: Business Wire 公告称，Genspark 服务全球超过 10 亿名知识工作者。
          tone: neutral
        - label: 当前活跃用户视角
          value: 2000000
          unit: MAUs (Sacra est.)
          note: 外部对漏斗顶部触达范围的估算，并非经审计的公司申报。
          tone: neutral
        - label: 变现席位视角
          value: 100000
          unit: paying seats (Sacra est.)
          note: 外部估算；转化率和留存率尚未披露。
          tone: neutral
        - label: 早期企业群体
          value: 1000
          unit: organizations+
          note: Business Wire 称，业务上线后已有超过 1,000 家组织开始使用 AI Workspace。
          tone: neutral
        - label: 当前商业客户基础
          value: 7000
          unit: business clients+
          note: Business Wire 后续称 Genspark 服务超过 7,000 家商业客户。
          tone: neutral
        - label: 商业定价下限
          value: 30
          unit: USD per seat per month
          note: 官方 Team 定价；企业合同按需定制，通常规模大得多。
          tone: neutral
    approximationNotes: 这是受限的证据视角，不是数学嵌套的 TAM/SAM/SOM 漏斗：保留来源披露了广义知识工作者边界、采用数量和价格，但没有提供分细分市场的支出模型，也没有提供完全可比的人群单位序列。
    claimRefs:
      - CM010
      - CM011
      - CM012
      - CM013
  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 仅基于指定证据，按序数标出执行深度与嵌入式工作流分发的位置。
    data:
      xAxis:
        label: 自主执行深度
        min: 1
        max: 5
        low: 辅助式聊天 / 手动路由
        high: 完成多步骤执行
        description: Ordinal score synthesized from cited execution breadth and workflow-completion evidence.
        scale: ordinal
      yAxis:
        label: 嵌入式工作流分发
        min: 1
        max: 5
        low: 主要是独立界面
        high: 原生巨头工作界面
        description: Ordinal score synthesized from cited bundle, suite, and in-file embed evidence.
        scale: ordinal
      points:
        - label: Genspark
          x: 5
          'y': 3
          context: >-
            Strongest cited end-to-end execution depth, but daily usage still relies on a dedicated workspace plus
            selective embeds.
        - label: Microsoft Copilot
          x: 3
          'y': 5
          context: >-
            TomorrowDesk calls this the most strategically significant threat because Office distribution is already
            installed.
        - label: Google Workspace 与 Gemini
          x: 3
          'y': 5
          context: >-
            Bundled suite AI and the surrounding Workspace surface make Google the clearest low-friction procurement
            alternative.
        - label: Notion AI
          x: 3
          'y': 4
          context: Adjacent execution around pages and databases, backed by an existing collaborative workspace.
        - label: Perplexity / ChatGPT 类
          x: 2
          'y': 2
          context: Research and answer quality matter, but the user still finishes routing, formatting, and action steps.
        - label: 内部构建 / 手动技术栈
          x: 1
          'y': 4
          context: Lives inside existing tools but leaves orchestration, verification, and packaging with the user.
    approximationNotes: 坐标轴是根据引用的执行和分发证据综合出的 1–5 序数判断，不是市场份额、NPS 或功能数量测量。
    claimRefs:
      - CP003
      - CP004
      - CP005
      - CP006
      - CP012
      - CP013
      - CP015
  - id: FI001
    title: 收入模型桥接
    type: flow
    summary: 公开证据指向一条从免费增值使用延伸到席位、企业合同及邻近变现的混合漏斗，但通往利润率的桥梁仍未得到验证。
    data:
      nodes:
        - label: 免费增值使用基础
          detail: Sacra 估算月活用户超过 2M，付费席位约 100k。
        - label: Team 转化
          detail: 自助式 Team 方案标价为每席位每月 $30，含 10,000 积分和 60 GB 存储。
        - label: 企业合同
          detail: Enterprise 按需定价，年费通常为六位数，并提供不限席位的年度合同。
        - label: 嵌入工作流的分发
          detail: Microsoft 365 插件、Azure 支持的交付以及 200 多个企业连接器，旨在让使用留在既有工作流中。
        - label: 使用成本层
          detail: 捆绑积分和合作伙伴基础设施意味着，实际毛利取决于工作负载强度和供应商条款。
        - label: 投资判断证据缺口
          detail: 公司声称年化运行率为 $250M、商业客户超过 7,000 家，但留存率、毛利率、烧钱和现金跑道的公开披露没有跟上。
    approximationNotes: 该图是定性序列，不是量化转化漏斗；公开来源没有披露各阶段转化率或贡献利润率。
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI008
      - CI013
      - CI014
  - id: FE001
    title: 从上下文到受治理输出的产品架构图
    type: stack
    summary: 六个面向用户的层次展示 Genspark 如何把上下文、编排、工具和输出应用打包进企业工作空间。
    data:
      layers:
        - label: 输入界面
          detail: 网络研究、电子邮件、会议、文件、语音、通话和已连接的业务系统
          items:
            - 网络与文件
            - 电子邮件与会议
            - 语音与通话
        - label: 持久上下文
          detail: SecondBrain 和 AI Drive 保留已连接的上下文与生成的工作成果
          items:
            - SecondBrain
            - AI Drive
            - 项目记忆
        - label: 代理编排
          detail: Super Agent 规划任务，并在不断变化的第三方模型集合中路由工作
          items:
            - 任务规划
            - 模型路由
            - 多代理执行
        - label: 工具与连接器层
          detail: 工具、原生集成和兼容 MCP 的端点把代理连接到行动界面
          items:
            - 集成工具
            - 业务连接器
            - MCP 端点
        - label: 输出应用
          detail: 原生产品返回可编辑的业务成果和沟通内容
          items:
            - 演示文稿、表格、文档
            - 媒体与设计
            - 应用与电子邮件
        - label: 治理与部署
          detail: 企业控制管理身份、访问、隔离、日志、密钥和部署区域
          items:
            - SSO 与 SCIM
            - 角色与审计日志
            - 隔离与数据驻留
    approximationNotes: 这是根据公开产品描述综合出的功能图，不是已披露的基础设施图；层次顺序不代表已验证的运行时序列。
    claimRefs:
      - CE001
      - CE005
      - CE012
      - CE015
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 公开证据指向一条自下而上的切入路径，逐步扩展到团队协作和企业控制，但持久性验证仍未解决。
    data:
      items:
        - label: 个人发现与试用
          tone: positive
          actor: 专业消费者 / 创作者
          stage: 入口
          touchpoints:
            - 通过联盟和应用界面，以免费账户或社会证明发现产品
            - 用提示词测试研究、演示文稿、通话或应用构建
        - label: 嵌入式办公工作流切入
          tone: positive
          actor: 分析师 / 营销人员 / 运营用户
          stage: 切入
          touchpoints:
            - 在现有文件中采用 Google Docs 和 Sheets 侧边栏
            - 用自然语言完成编辑、公式、图表、摘要和翻译
        - label: 付费自助席位
          tone: neutral
          actor: 个人或小团队管理员
          stage: 变现
          touchpoints:
            - 必须使用免费账户；付费方案解锁更高限额和更多前沿模型
            - Team 方案打包提供积分、存储、计费、分析和连接器管理
        - label: 部门协作
          tone: positive
          actor: 经理与职能团队
          stage: 扩张
          touchpoints:
            - 共享代理、文档、知识和管理员控制，把使用从个人扩展到团队
            - Genspark Teams 和 Team 方案构建协作及席位扩张路径
        - label: 受治理的企业推广
          tone: positive
          actor: IT / 安全 / 采购
          stage: 规模化
          touchpoints:
            - SAML、SCIM、RBAC、审计日志、数据驻留、高级报告和专属 CSM
            - 定制年度合同和六位数企业方案支持更广泛推广
        - label: 持久性与集中度检查
          tone: risk
          actor: 财务 / 采购 / 投资者
          stage: 风险
          touchpoints:
            - 保留来源没有公开 NRR、GRR、流失率、群组或集中度披露
            - 计费投诉和未核对的客户数量指标，使持久性仍未得到验证
    approximationNotes: null
    claimRefs:
      - CU001
      - CU009
      - CU011
      - CU013
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 剩余风险集中在合作伙伴依赖、变现不透明，以及 2026 年增长叙事所暗示的执行负担。
    data:
      columns:
        - label: 可能性
        - label: 剩余严重性
        - label: 当前缓解状态
      rows:
        - label: 合规证明缺口
          values:
            - label: 中
              tone: warning
              note: 企业控制被用于营销，但这里保留的最具体、带日期的合规披露仍只是路线图式承诺。
            - label: 高
              tone: warning
              note: 企业控制被用于营销，但这里保留的最具体、带日期的合规披露仍只是路线图式承诺。
            - label: 部分
              tone: warning
              note: 当前缓解措施主要是承诺和定位，而非独立引用的证明。
        - label: 支持 / 配额不透明
          values:
            - label: 高
              tone: high
              note: 独立评测指出公平使用上限和支持薄弱，而市场材料仍显示存在月度配额。
            - label: 高
              tone: high
              note: 高强度使用团队可能在证明 ROI 前就发现隐藏的权益上限。
            - label: 有限
              tone: warning
              note: 公开证据披露了配额，但没有 SLA 或支持表现证明。
        - label: 模型 / API 依赖
          values:
            - label: 高
              tone: critical
              note: 尽管定位为多模型，资料仍称 OpenAI 模型和 Realtime API 是 Super Agent 的核心。
            - label: 极高
              tone: critical
              note: 合作伙伴宕机或重新定价可能同时打击产品质量和单位经济性。
            - label: 中等
              tone: positive
              note: 多模型路由带来一定架构多样性，但冗余程度未量化。
        - label: 产品界面扩张
          values:
            - label: 中
              tone: warning
              note: 记忆、硬件、电子邮件、设计和定制软件的发布，增加了 QA 和安全负担。
            - label: 高
              tone: warning
              note: 每增加一个界面，就会提高变更管理和权限审查的复杂度。
            - label: 部分
              tone: warning
              note: 套件化野心很明确，但保留证据没有显示这些界面的可靠性指标。
        - label: 估值执行缺口
          values:
            - label: 中
              tone: critical
              note: 公开说法从 1 月的 >$100M ARR，发展到 2026 年 7 月的 $250M ARR 和 $2.6B 估值。
            - label: 极高
              tone: critical
              note: 单位经济性细节未公开；若留存率或利润率质量落后，叙事重置的可能性更高。
            - label: 窄
              tone: warning
              note: 融资规模可观，但指定证据无法连接到现金跑道或烧钱持久性。
        - label: 巨头捆绑压力
          values:
            - label: 高
              tone: high
              note: Sacra 认为 Microsoft 和 Google 可以低价销售或捆绑邻近的 AI 功能。
            - label: 高
              tone: high
              note: 平台巨头可以同时攻击定价和分发。
            - label: 有限
              tone: warning
              note: Genspark 的差异化确实存在，但保留证据没有显示其对抗套件捆绑的持久护城河。
    claimRefs:
      - CR007
      - CR008
      - CR009
      - CR010
      - CR011
      - CR012
      - CR015
      - CR016
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 经营势头真实存在，但单位经济性和融资条款未披露，阻碍按全价推荐。
    data:
      nodes:
        - id: proof-1
          label: 增长证据
          note: 2026 年 1 月 ARR 为 $100M、2026 年 3 月年化收入估算为 $250M，以及公司声称 2026 年 7 月年化运行率为 $250M。
        - id: proof-2
          label: 平台广度
          note: 官方定位结合了自主代理、AI 原生生产力工具和 200 多个集成。
        - id: proof-3
          label: 商业信号
          note: 公开材料称 2026 年早些时候有超过 1,000 家组织，至 2026 年 7 月有超过 7,000 家商业客户。
        - id: risk-1
          label: 披露缺口
          note: 没有保留的公开来源披露留存率、毛利率、烧钱或 2026 年优先权条款。
        - id: risk-2
          label: 压缩风险
          note: 独立分析警告，Microsoft / Google 的捆绑销售和商品化可能挤压溢价定价。
        - id: decision
          label: 推荐
          note: 继续研究；在尽调证明收入质量和融资经济性之前，估值偏高。
      edges:
        - from: proof-1
          to: proof-2
          label: 支撑上行叙事
        - from: proof-2
          to: proof-3
          label: 可解释采用
        - from: proof-3
          to: risk-1
          label: 仍需证明
        - from: risk-1
          to: risk-2
          label: 放大下行
        - from: risk-2
          to: decision
          label: 设定入场纪律
    claimRefs:
      - CV002
      - CV003
      - CV006
      - CV007
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
