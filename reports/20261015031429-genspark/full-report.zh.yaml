      - number: '4.3'
        title: 成本结构与单位经济盲点
        blocks:
          - type: paragraph
            body: >-
              公开披露显示，用量以捆绑积分计价，并依托合作伙伴基础设施和第三方模型交付，因此实际毛利很大程度取决于工作负载强度和供应商条款。但指定来源均未发布毛利率、云 / API 支出、支持负担或营运资本动态。Silicon
              Valley Invest Club 明确称未找到公开盈利披露，TechTimes 则称 Genspark 尚未发布广泛的任务成功率或留存数据。Sacra 还强调，Microsoft 和 Google
              可以以更低价格捆绑类似的 AI 生产力功能。结果是增长故事有说服力，但收入基础是否持久、变现是否高效，证据有限。
