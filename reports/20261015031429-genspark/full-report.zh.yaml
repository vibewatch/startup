  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代品
        blocks:
          - type: paragraph
            body: >-
              指定资料池支持的边界不只是“AI 搜索”，而是一个 AI 工作空间层，自动化研究、起草、电子表格、演示文稿、收件箱任务和现实执行等多步骤知识工作。Genspark 商业页面明确销售一个包含自主代理、AI
              原生文档、表格和幻灯片以及智能代理浏览器的工作空间；Google Workspace 的定位则显示，切入点更窄，位于 Docs、Sheets 和 Slides 内，而不是创建全新的工作流类别。Lindy 和
              Fello 的独立解释也描述了从单一聊天机器人或搜索框转向成品交付的同一趋势。这对估值的意义在于，相关替代品已经变成单点生产力工具、办公套件内的副驾驶，以及手工分析 / 运营劳动，而不只是搜索变现。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM006
              - CM011
      - number: '2.2'
        title: 买家、用户与采用路径
        blocks:
          - type: paragraph
            body: >-
              买家路径分两阶段。外围是自助用户，他们通过市场研究、幻灯片、表格和电话等面向消费者的代理场景接触 Genspark；OpenAI 案例研究和第三方解释强化了这一切入点。但可变现的重心在团队和企业部署：商业网站突出
              Team、Enterprise 套餐、管理员控制、连接器管理、区域部署和身份功能；Google Workspace
              插件则让用户先在现有文档工作流中试用，再扩大部署。终端用户包括分析师、营销人员、运营人员、创始人和财务团队；产品进入受治理的企业使用后，经济审批会先转向职能经理，再转向 IT / 安全团队。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM004
              - CM005
              - CM006
              - CM007
      - number: '2.3'
        title: 规模信号、增长驱动与约束
        blocks:
          - type: paragraph
            body: >-
              最强的公开规模证据来自采用视角，而非经典的自下而上 SAM 或自上而下分析师 TAM。公司发布称，Genspark 在九个月内突破 $100M ARR，商业业务上线后不久超过 1,000 家组织，之后达到
              $250M 年化运行率和 7,000 多家商业客户。Sacra 另给出 200 万月活用户和约 100,000 个付费席位的外部估计，有助于界定从广泛用户兴趣到付费席位的漏斗。这些信号支持一个真实的 AI
              工作空间市场，但没有披露按细分市场划分的支出、转化、留存或各 cohort
              的付费意愿。主要采用驱动因素是嵌入式工作流界面、席位定价和企业控制；主要约束是按积分计量的高强度使用、部署复杂度，以及缺少经审计的细分经济数据。
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
