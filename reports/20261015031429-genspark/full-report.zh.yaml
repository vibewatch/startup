        title: 信任控制与产品风险
        blocks:
          - type: paragraph
            body: >-
              Genspark 商业页面声称具备 SOC 2 Type II 和 ISO 27001 认证、租户隔离、加密、SAML
              SSO、SCIM、基于角色的访问、审计日志、区域部署和可选的客户管理密钥。这些是有意义的企业采购功能，但在指定证据中大多属于供应商自述。第三方能力评测对 Claw
              的描述更窄：它提到持久会话、无人值守计划、计算机访问，以及审查危险计划的指引；同时未找到该产品界面按操作审批政策或可导出的操作审计轨迹。这是范围区别，并不证明企业审计日志不存在。尽调应测试哪些控制覆盖每个工作空间模块、日志是否记录下游操作、提示注入防御如何运作，以及事故和可靠性历史。资料池中没有事故来源，不等于没有事故。
            claimRefs:
              - CE009
              - CE010
              - CE011
