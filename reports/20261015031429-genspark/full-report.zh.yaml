  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 从意图到成品
        blocks:
          - type: paragraph
            body: >-
              Genspark 的定位不像对话助手，更像执行层：用户描述目标，工作空间协调研究、模型、工具和输出应用，返回可编辑成果物。支持的工作流覆盖网页研究、邮件、会议、文件和语音等输入；由 Super Agent
              处理；输出包括幻灯片、表格、文档、媒体和应用。独立测试支持其在边界明确的成果物上的核心价值主张，称其能快速创建演示文稿、文档和简单应用。但这不是全面质量基准：同一评测发现导出可能丢失格式，复杂应用需要人工修复，或超出构建器的实际能力。可投资的产品论点因此是快速完成初稿，而不是经验证可以替代专业生产软件。
            claimRefs:
              - CE001
              - CE006
              - CE007
              - CE008
