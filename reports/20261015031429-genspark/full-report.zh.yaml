      - number: '3.2'
        title: 执行广度有差异化，但价格基准混乱
        blocks:
          - type: paragraph
            body: >-
              最强的公开差异化不是原始模型质量，而是任务完成广度。Genspark 覆盖自主代理、幻灯片、文档、表格、邮件、语音和电话，明显宽于独立评测中描述的研究优先或聊天优先替代品。更难的是经济比较：Sacra 和
              TomorrowDesk 将团队定价放在每用户每月约 $30，而 Google Workspace with Gemini 被描述为打包进每用户每月 $14 的 Business Standard
              套餐。Cybernews 还指出价格透明度有限、重度工作负载会快速消耗积分，因此从公开证据仍无法清楚观察击败既有技术栈的有效价格。
            claimRefs:
              - CP003
              - CP005
              - CP010
              - CP011
              - CP013
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP005
              - CP010
              - CP011
              - CP013
              - CP014
      - number: '3.3'
        title: 分发与信任姿态决定执行广度能否转化
        blocks:
          - type: paragraph
            body: >-
              企业已经在 Office 或 Workspace 中工作时，Microsoft 和 Google 最具威胁；采购方更愿意增加一个捆绑能力，而不是引入新的工作系统。TomorrowDesk 明确把
              Microsoft Copilot 列为战略上最重要的比较对象，因为它原生分发于 Office；Sacra 对 Google Workspace with Gemini 也作出同样判断。Genspark
              对嵌入缺口已有一些公开回应：其 Google Workspace marketplace 页面显示可在文件内使用 Docs、Sheets 和
              Slides，并强调仅限当前文件的权限和可审计编辑。这些信号有助于建立信任，但尚未证明能大规模取代套件，或相对于既有厂商工作流基础形成持久锁定。
            claimRefs:
              - CP004
              - CP006
              - CP007
              - CP008
              - CP009
              - CP014
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
              - CP004
              - CP006
              - CP007
              - CP008
              - CP012
              - CP013
      - number: '3.4'
        title: 护城河的持久性仍取决于经济性和替代证据
        blocks:
          - type: paragraph
            body: >-
              反向证据并不是 Genspark 没有差异化产品，而是这种差异化可能成本高昂、难以维持，也容易被强大的套件缩小。Cybernews 强调价格不透明、积分快速消耗、幻觉风险和支持缓慢；TomorrowDesk 称
              Claw 的专用云计算机模式运营成本高，并指出早期用户难以预测积分消耗。Sacra 补充了更广泛的战略威胁：既有厂商可以低于市场价格捆绑 AI，相邻套件也在快速增加自己的代理。在缺少实际企业折扣、多年合同或从
              Microsoft、Google 迁出的验证数据前，护城河论点仍有潜力但尚未得到证明。
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 执行才是真正的比较集合
            body: 公开切入点不是“更好的聊天”，而是更少的交接：当买家要的是完成的成果物或行动，而不是另一个答案框时，Genspark 最有优势。
            calloutType: insight
            claimRefs:
              - CP002
              - CP003
          - type: callout
            title: 捆绑套件可能压低付费意愿
            body: Google 的 $14 套餐和 Microsoft 已安装的 Office 基础是最尖锐的公开威胁，因为 Genspark 尚未披露足以证明持久定价能力的合同条款或迁移证据。
            calloutType: risk
            claimRefs:
              - CP004
              - CP005
              - CP013
              - CP014
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 变现界面与定价
        blocks:
          - type: paragraph
            body: >-
              公开变现的标价比实际经济性更清楚。Genspark 当前商业页面显示，Team 套餐每席位每月 $30，含 10,000 积分和每席位 60 GB 存储；Enterprise
              定制定价，通常每年六位数，按不限席位的年度合同销售，并包含更大的积分额度。Sacra 另称，该公司拥有超过 200 万月活用户、估计 100,000
              个付费席位的免费增值漏斗。这种组合意味着公司销售的是自助席位、企业承诺和至少一种增量附加服务的混合模式，而不是纯粹按用量计费的 API 业务。
