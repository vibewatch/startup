      - number: '8.2'
        title: 公开证据支持什么
        blocks:
          - type: paragraph
            body: >-
              案例最强的部分是运营动能。公司博客披露 2025 年 11 月 $275M B 轮、$1.25B 投后估值；Business Wire 转述 Genspark 的说法，称其截至 2026 年 1 月九个月内超过
              $100M ARR；Sacra 估计 2026 年 3 月年化收入达到 $250M。2026 年 7 月公司发布又称年化运行率为 $250M、商业客户超过 7,000 家、融资 $645M、估值
              $2.6B。官方商业页面还显示，如果经济性为真，产品形态可能支撑溢价定价：自主代理、AI 原生生产力界面和 200+
              集成指向平台抱负，而非单一功能工具。上行案例并非假设；这些高度依赖发行方的证据是否足以支撑当前入场价格，尚未得到验证。
            claimRefs:
              - CV001
