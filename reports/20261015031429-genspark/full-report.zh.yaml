  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              公开记录足以支持对显著产品和商业动能的投资判断，但不足以在当前价格下把私人估值视为可投资。公司控制的披露从 2025 年 11 月 $1.25B 投后估值的 B 轮，升级为 2026 年 1 月九个月达到
              $100M ARR 的主张，再到 2026 年 7 月围绕 $645M 累计融资、$2.6B 估值和 12 个月内 $250M
              年化运行率的融资叙事。因此建议取决于价格，而不是泛泛的公司质量评分：业务可能很强，但由于留存、利润率、烧钱和股权结构经济性仍未披露，公开证据支持“继续研究”，而非买入。估值姿态偏高，直到尽调补齐这些缺口，风险评级仍维持高位。
            claimRefs:
