      - number: '4.4'
        title: 资本充足性与投资判断
        blocks:
          - type: paragraph
            body: >-
              融资故事比现金故事更容易观察。Genspark 2026 年 4 月的 Microsoft 合作发布仍引用 $545M 累计融资，而 2026 年 7 月发布称，在 $2.6B 估值完成 $100M B
              轮追加后，累计融资为 $645M。这很可能给公司带来可观的增长资本，但指定资料池没有披露手头现金、烧钱、现金跑道、债务义务或最低云承诺；Silicon Valley Invest Club
              称股东登记册不公开。财务结论：顶线动能和分发广度令人印象深刻，但在管理层数据补齐核心证据缺口前，收入质量、利润率路径和融资依赖仍是投资判断的阻碍。
            claimRefs:
              - CI010
              - CI011
              - CI012
