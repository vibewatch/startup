              - CM012
              - CM013
      - number: '2.4'
        title: 展示项
        blocks:
          - type: callout
            title: 市场切入点是完成工作流，而不是聊天
            body: 指定资料池持续把 Genspark 定位在成品交付和跨工具执行上，因此相关市场更接近面向知识团队的 AI 工作空间和智能副驾层，而不是通用聊天或搜索产品。
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM011
          - type: callout
            title: 公开规模证据偏重采用牵引力，细分数据偏少
            body: 现有资料池在 ARR、客户和定价信号上较强，但在独立的逐细分市场支出、转化、留存和预算扩张数据上较弱，使对估值敏感的市场规模仍有一部分尚未得到验证。
            calloutType: risk
            claimRefs:
              - CM009
              - CM010
              - CM012
