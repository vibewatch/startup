  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序概览
        blocks:
          - type: paragraph
            body: >-
              最高的剩余风险是：Genspark 正在扩张一个异常广泛的 AI 工作空间，同时依赖外部模型供应商、配额及企业治理承诺，而这些承诺在公开材料中只有部分得到佐证。保留来源显示公司确实在缓解风险，包括 Google
              Workspace 仅限当前文件的权限、不训练承诺、区域部署选项和企业套餐中的客户管理密钥。但同一证据也显示范围迅速扩展到记忆、硬件、邮件、设计和定制软件界面，且自报
              ARR、融资和客户数大幅上升。因此，下行风险不在于某一个二元事件，而在于支持质量、安全文档和利润质量能否跟上 2026 年叙事中的雄心。
            claimRefs:
              - CR003
              - CR007
              - CR011
              - CR015
              - CR016
