              - CI014
          - type: callout
            title: 利润率持久性仍押注模型供应
            body: 指定证据支持快速增长，但也显示公司依赖模型和平台合作伙伴、低价捆绑竞争者，以及缺失的公开利润率 / 跑道图景。这使资本故事强劲，而单位经济故事仍不完整。
            calloutType: risk
            claimRefs:
