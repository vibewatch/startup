      - number: '1.3'
        title: 融资、规模主张与里程碑
        blocks:
          - type: paragraph
            body: >-
              本次更新的证据再次呈现出一个模式：规模主张异常迅速，但公开佐证并不完整。公司控制的材料在 2025 年末宣布 $275M B 轮融资，投后估值 $1.25B；随后称截至 2026 年 1 月，Genspark
              在九个月内突破 $100M ARR。一份外部简介把叙事延伸到 2026 年 6 月：$100M B 轮追加融资、$2.6B 投后估值和 $645M 累计融资；与此同时，Sacra
              独立提醒，既有厂商的套装捆绑和工作空间商品化可能挤压扩张和定价能力。实际而言，顶线叙事可信度足以把 Genspark 视为资金充足的成长公司，但透明度还不足以确认估值、经常性收入质量或治理经济性。
