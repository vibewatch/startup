chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、定位与阶段
        blocks:
          - type: paragraph
            body: >-
              Genspark 如今把自己定位成一体化 AI 工作空间，而不是单点 AI 搜索产品。在落地页、商业网站、2026 年 1 月发布稿及之后的 Gen-1 Slides
              文章中，公司描述了一种工作流：用户说出目标，代理便跨幻灯片、文档、电子表格、媒体、语音和聊天返回成品。这一定位很重要，因为证据链显示类别确实发生了变化：OpenAI 和一份外部公司简介都称，该产品最初是 AI
              搜索，并在 2025 年 4 月转向智能代理 AI。因此，今天更准确的理解是：Genspark 是一家快速扩张的 B 轮智能代理生产力平台，目标是成为广泛的工作空间，而不只是搜索助手。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO007
              - CO012
              - CO004
