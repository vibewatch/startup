      - number: '8.3'
        title: 当前估值为何无法形成信心
        blocks:
          - type: paragraph
            body: >-
              缺失的恰恰是估值纪律所需的证明。保留的公开来源均未提供 2026
              年追加融资的股权表或优先权安排；审阅过的官方页面和发布稿也未披露毛利率、烧钱、跑道或净收入留存。因此，最新估值标记只能靠公司控制的叙事和第三方估计解释，而非经由持久的经常性收入桥接。Sacra
              的不利视角很关键：它警告 Microsoft 和 Google 可借助捆绑挤压定价，如果智能代理工作空间的差异化收窄到体验和成本，商品化可能压缩利润率。Silicon Valley Invest Club
              列出广泛的科技 IPO 标尺，但其离散性和不同商业模式并不能建立一个可辩护的 Genspark 区间。这些理由足以拒绝无依据的精确估值，却不足以全盘否定公司。
            claimRefs:
              - CV009
