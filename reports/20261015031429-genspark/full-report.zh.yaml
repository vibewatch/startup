        title: 展示项
        blocks:
          - type: callout
            title: 收入界面广度领先于证据质量
            body: Genspark 现在呈现多个变现界面——自助席位、企业合同、合作伙伴嵌入式工作流分发和硬件——但公开证据对标价和披露 ARR 的描述，仍远多于对实际收入构成或留存的说明。
            calloutType: insight
            claimRefs:
              - CI001
