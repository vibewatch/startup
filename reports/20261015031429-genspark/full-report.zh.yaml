  - id: TV002
    title: 论点 / 反论点表
    columns:
      - 立场
      - 论点
      - 哪些情况会改变判断
    rows:
      - - 论点
        - 对这一阶段而言，增长证据异常强：公司披露称截至 2026 年 1 月 ARR 达 $100M、截至 7 月年化收入运行率达 $250M 且拥有 7,000 家商业客户；Sacra 则在 3 月估算年化收入为 $250M。
        - 独立或经审计的留存率和利润率披露，会让这项证据更能支撑估值。
      - - 论点
        - 产品覆盖面足以支撑平台化目标：官方页面把自主代理、AI 原生生产力界面和 200 多个集成放进同一工作空间。
        - 参考客户、净扩张数据以及从使用到付费的转化证据，会强化平台论据。
      - - 反论点
        - 估值从 2025 年 11 月的 $1.25B 飙升至 2026 年 6/7 月的 $2.6B，但股权表条款、留存率、毛利率和烧钱情况的公开披露没有跟上。
        - 经签署的股权表摘要加上经审计的经济数据，或可支持按接近最新估值的价格投资。
      - - 反论点
        - Sacra 对下行风险的判断可信：Microsoft / Google 的捆绑销售及 AI 生产力领域更广泛的商品化，可能同时挤压价格和利润率。
        - 持续的溢价定价、稳定的赢单率和贡献利润率证据，能降低压缩风险。
    notes: 这张表把经营证据与价格支撑分开，因为增长支撑和估值支撑不是一回事。
