        title: 领导层、运营足迹与治理可见度
        blocks:
          - type: paragraph
            body: >-
              指定资料池中的领导层记录主要围绕联合创始人 Eric Jing 和 Kay Zhu。Jing 以 CEO 身份主导公开发布叙事，Zhu 则在 OpenAI
              案例研究及介绍产品架构的二手资料中担任技术发言人。运营足迹比治理情况清晰：资料将公司定位在 Palo Alto，2026 年 1 月发布稿称 Genspark
              正在日本组建本地团队。董事会和控制权披露仍然薄弱。指定来源没有披露董事会名单、股权结构表、清算优先权或投票权，因此后续尽调应把治理与所有权视为待解决工作流，而不是既定事实。
