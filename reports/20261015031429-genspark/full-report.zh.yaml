        blocks:
          - type: paragraph
            body: >-
              Genspark 明确在销售给重视隐私、安全和数据边界控制的企业工作流，但公开证据更偏向承诺，而非第三方证明。商业页面宣传不训练承诺、客户管理密钥和区域部署。Google Workspace
              页面进一步收窄范围，称插件只能触碰当前打开的文件，这是该界面的真实缓解措施。即便如此，保留资料池中最具体的有日期合规披露仍是 2025 年 11 月博客：其中把 SOC 2 Type II 和 ISO
              里程碑列为目标，把 GDPR 和 HIPAA 列为路线图事项。这不能证明存在合规失败，但意味着投资者应索取当前证书、DPA 条款、审计范围和事故处理证据，而不是仅凭营销文案评估控制体系。
