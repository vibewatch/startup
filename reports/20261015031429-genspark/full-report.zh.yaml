      - number: '4.2'
        title: 采用牵引力与市场进入代理指标
        blocks:
          - type: paragraph
            body: >-
              增长叙事很强，但仍主要由公司塑造。2026 年 1 月，Genspark 称其在九个月内突破 $100M ARR，商业套餐上线后不久平台上的组织数超过 1,000 家。到 2026 年 7
              月，公司称年化运行率达到 $250M，商业客户超过 7,000 家。OpenAI 案例研究补充了更早的数据点：Super Agent 在 45 天内达到 $36M ARR。商业分发越来越嵌入既有工作流，包括
              Microsoft 365 插件、Azure 支持的交付和连接器密集型企业控制平面，这支持采用速度，却不能替代公开的 CAC、回本期或 cohort 扩张证据。
