      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 第三方模型依赖是结构性的
            body: >-
              Genspark 营销多模型路由，但保留的合作伙伴证据仍将 OpenAI 模型和 Realtime API 描述为 Super Agent
              的核心。投资者应尽调故障切换、供应商组合和利润率敏感性，而不能假定路由本身消除了依赖。
            calloutType: risk
            claimRefs:
              - CR008
              - CR016
          - type: callout
            title: 变现不透明可能演变为留存风险
            body: 公开记录已经显示支持和续约问题的构成要素：六位数企业定价、部分界面的月度配额，以及独立报告中的积分大量消耗、公平使用上限和支持薄弱。只有当真实客户价值显著超过意外使用成本时，这种模式才可控。
            calloutType: risk
            claimRefs:
              - CR002
              - CR009
              - CR010
              - CR011
          - type: callout
            title: 终止标准应聚焦证明，而不是增长标题
            body: 不要让 2026 年 ARR 和估值叙事取代对已完成合规材料、支持指标、毛利率、供应商集中度和客户留存的尽调。如果这些指标落后于公开增长故事，它们最可能打破投资论点。
            calloutType: recommendation
            claimRefs:
