      - number: '7.4'
        title: 商业与融资风险
        blocks:
          - type: paragraph
            body: >-
              商业风险不在于是否存在需求，而在于需求质量能否支撑公开估值里程碑所暗示的速度。Genspark 声称 2026 年 1 月在九个月内超过 $100M ARR，随后又称截至 2026 年 7 月 ARR 达到
              $250M、商业客户超过 7,000 家、融资 $645M、估值 $2.6B。Sacra 认为 Microsoft 和 Google 可以低于市场价格捆绑 AI
              生产力功能，从而同时挤压定价和利润率。同时，公开资料池仍未闭合经审计 ARR
              质量、毛利率、烧钱、跑道、留存或客户集中度的证据链。这留下了一个典型的后期软件风险：如果留存、支持或算力经济性低于预期，公司可能发现增长表象比持久的现金生成质量更容易发布。
