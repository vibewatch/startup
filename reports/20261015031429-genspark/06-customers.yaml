schemaVersion: report-v2
artifact: customers
slug: genspark
runDate: 2026-10-15
company:
  name: Genspark
chapter:
  number: 6
  title: Customers
  summary: >-
    Genspark shows a visible land-to-expand customer design: self-serve and document-embedded usage feed Team and Enterprise plans with progressively heavier admin, security, and support controls. Public adoption proof is broad but not cleanly reconciled, moving from more than 1,000 organizations in January 2026 to 7,000-plus teams or business clients later in 2026, while external estimates point to a much larger MAU funnel. Durability remains the core gap because no public NRR, GRR, churn, cohort, or concentration disclosure was found in the assigned pool.
sections:
  - id: segment-mix
    title: Segment mix and who actually buys
    body: >-
      The customer surface is not a single monolith. Official packaging separates self-serve users from Team and Enterprise deployments, while the Google Workspace listing shows a bottom-up wedge into writers, analysts, marketers, consultants, founders, finance, ops, and customer-success teams already living in Docs or Sheets. The business page then moves upmarket with centralized admin, usage analytics, connector management, SAML, audit logs, residency, and a dedicated customer success manager. That pattern implies buyer progression from individual users and departmental managers toward IT, security, and procurement once usage becomes persistent and shared.
    claimRefs: [CU001, CU002, CU009, CU013]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-trajectory
    title: Adoption looks broad, but the metrics are not fully comparable
    body: >-
      The strongest public signal is breadth, not clean cohort quality. Company-controlled surfaces move from more than 1,000 organizations using AI Workspace in January 2026 to 7,000-plus teams on the business page and more than 7,000 business clients in the July 2026 launch release. Sacra adds an outside estimate of more than 2 million monthly active users and roughly 100,000 paying seats, while the U365 review cites more than 1 million Google Play downloads and about 101,000 reviews. Together these imply real adoption, but they mix organizations, teams, clients, MAUs, seats, downloads, and reviews rather than one audited denominator.
    claimRefs: [CU003, CU004, CU005, CU006, CU007]
    tableRefs: [TU002]
  - id: named-proof
    title: Named customer proof exists, but most of it is still company-shaped
    body: >-
      Named proof is present but uneven. The best concrete case in the assigned pool is ADK Marketing Solutions in Japan, where the January 2026 press release says teams cut data-analysis and document-creation workloads by roughly 80 percent over a period of months. Beyond that, the official business page mostly teases user stories, while the affiliate landing page offers anecdotal testimonials from creators and product users rather than procurement-grade references. That is enough to show the product is being used across solo, departmental, and enterprise-style contexts, but not enough to establish repeatable production depth, contract size, or renewal quality across the base.
    claimRefs: [CU008, CU010, CU012]
    tableRefs: [TU003]
  - id: durability-risks
    title: Expansion path is visible; durability and concentration are not
    body: >-
      The product clearly has an expansion story from a free or lightly paid wedge into Team and Enterprise controls, but the public record still leaves the core durability questions open. The U365 review highlights missing per-run price transparency for Super Agent and recurring billing complaints, while none of the retained sources disclose NRR, GRR, logo churn, cohort retention, renewal rates, top-customer concentration, or channel dependence. That means outside observers can see acquisition momentum and packaging logic, but cannot yet verify whether Genspark is retaining seats, deepening deployment, or concentrating revenue in a small number of large customers.
    claimRefs: [CU009, CU011]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Scale signal
      - Revenue / strategic value
      - Gap
    rows:
      - - Individual self-serve users
        - Buyer=user=payer for creators, researchers, and prosumers
        - Research pages, slides, docs, calls, and lightweight app-building from prompts
        - Product Hunt-style 4.4/5 social proof and 2.1K+ followers on an affiliate landing page
        - Top-of-funnel awareness that can convert into paid plan upgrades
        - No disclosed free-to-paid conversion, retention, or spend by cohort
      - - Google Workspace embedded users
        - Department lead or individual buyer; docs/sheets-heavy operators as users
        - Drafting, summarizing, translating, formulas, analysis, and charts inside open files
        - Marketplace listing explicitly targets writers, analysts, marketers, PMs, consultants, founders, finance, ops, and customer-success teams
        - Low-friction wedge into existing office workflows without a full platform switch
        - No public install, DAU, or paid-seat disclosure for the add-on
      - - Team / departmental deployments
        - Manager or functional lead buys; knowledge workers use; team budget often pays
        - Shared agents, docs, knowledge, connector management, usage analytics, admin and billing
        - Official Team plan is built for smaller teams and departmental deployments at $30 per seat per month
        - Clear seat-based monetization and land-within-a-function motion
        - Average deployment size, expansion pace, and renewal quality are undisclosed
      - - Governed enterprise rollouts
        - IT, security, procurement, and business sponsor buy; cross-functional users consume
        - SAML, SCIM, RBAC, audit logs, residency, advanced reporting, and dedicated CSM
        - Enterprise plan is custom, typically six figures annually, with unlimited seats on annual contracts
        - Strategic ACV and enterprise-standard control set support upmarket expansion
        - No public concentration, contract length, or logo-retention disclosure
    notes: Company-issued packaging is mixed with partner-marketplace evidence; segments overlap and are not a mutually exclusive customer taxonomy.
    claimRefs: [CU001, CU002, CU009, CU013]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Business-launch account base
        - More than 1,000 organizations using AI Workspace
        - "2026-01-28"
        - Genspark press release on Business Wire
        - Medium
        - Early enterprise traction across consulting, advertising, and related knowledge industries
        - No split between paid production deployments, pilots, or free trials
      - - Current official business claim
        - 7,000+ world-class teams
        - Accessed 2026-10-15
        - Genspark business page
        - Medium
        - Official surface signals a materially larger business-installed base later in 2026
        - '"Teams" is undefined and may include small or lightly deployed accounts'
      - - Later launch claim
        - More than 7,000 business clients
        - "2026-07-21"
        - Genspark Workspace 6.0 press release on Business Wire
        - Medium
        - Suggests continued B2B scale-up after the January launch wave
        - '"Business clients" is not reconciled to teams, organizations, or paying seats'
      - - Third-party user/pay-seat estimate
        - More than 2M monthly active users and about 100,000 paying seats
        - Accessed 2026-10-15
        - Sacra
        - Low
        - Indicates a much larger self-serve funnel than the named B2B-account counts alone
        - Methodology is external and not audited by the company
      - - Mobile consumer signal
        - About 101,000 reviews and more than 1M downloads on Google Play
        - Read 2026-09-28
        - U365 review citing Google Play
        - Medium
        - Shows consumer/mobile reach beyond enterprise packaging
        - App installs and ratings do not equal recurring paid workspace usage
    notes: Rows intentionally mix organizations, teams, clients, MAUs, paying seats, downloads, and reviews; this is an adoption snapshot, not a comparable funnel.
    claimRefs: [CU003, CU004, CU005, CU006, CU007]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - - ADK Marketing Solutions Inc.
        - Agency / enterprise account in Japan
        - Data analysis and document creation workflows under local support and customer-success coverage
        - In use over the past few months per company release; production-like but company-described
        - Approximately 80% reduction in data-analysis and document-creation workloads
        - Single company-issued case with no seat count, contract value, or retention detail
      - - Todd Bogert
        - Solo / SMB builder
        - Website creation and launch workflows using Genspark AI
        - User-story teaser only
        - Official page frames him as having built 8,000 websites and now launching his own platform with Genspark
        - No deployment depth, spend, or measured ROI in the retained excerpt
      - - James O'Connor
        - Product lead / individual prosumer
        - Meeting-to-deck workflow
        - Anecdotal testimonial, status unstated
        - Claims the deck was ready on drive by the time he needed it
        - Affiliate page, no employer verification or proof of paid production usage
      - - Sofia Rivera
        - Indie founder / individual prosumer
        - Real phone-call automation
        - Anecdotal testimonial, status unstated
        - Says the voice agent rescheduled a dentist appointment convincingly
        - Affiliate page, no deployment breadth, spend, or retention evidence
    notes: This enumeration mixes company-issued case material with testimonial-style anecdotes; only the ADK row gives a quantified business outcome.
    enumerationScope:
      coverage: partial
      basis: Named references retained from the assigned pool only; the pool contains one quantified enterprise case plus teaser or testimonial-style individual examples rather than a full customer roster.
    claimRefs: [CU008, CU010, CU012]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: Public evidence points to a bottom-up wedge that expands into team collaboration and enterprise controls, with durability checks still unresolved.
    data:
      items:
        - label: Individual discovery and trial
          tone: positive
          actor: Prosumer / creator
          stage: Entry
          touchpoints:
            - Free account or social-proof discovery through affiliate and app surfaces
            - Tests research, slides, calls, or app-building from a prompt
        - label: Embedded office workflow wedge
          tone: positive
          actor: Analyst / marketer / ops user
          stage: Wedge
          touchpoints:
            - Google Docs and Sheets sidebar adoption inside existing files
            - Plain-language edits, formulas, charts, summaries, and translations
        - label: Paid self-serve seat
          tone: neutral
          actor: Individual or small-team admin
          stage: Monetization
          touchpoints:
            - Free account required; paid plans unlock higher limits and more frontier models
            - Team plan packages credits, storage, billing, analytics, and connector management
        - label: Departmental collaboration
          tone: positive
          actor: Manager plus functional team
          stage: Expansion
          touchpoints:
            - Shared agents, docs, knowledge, and admin controls move usage from solo to team
            - Genspark Teams and Team plan create a collaboration and seat-expansion path
        - label: Governed enterprise rollout
          tone: positive
          actor: IT / security / procurement
          stage: Scale
          touchpoints:
            - SAML, SCIM, RBAC, audit logs, residency, advanced reporting, and dedicated CSM
            - Custom annual contracts and six-figure enterprise packaging support broader rollout
        - label: Durability and concentration check
          tone: risk
          actor: Finance / procurement / investor
          stage: Risk
          touchpoints:
            - No public NRR, GRR, churn, cohort, or concentration disclosure in retained sources
            - Billing complaints and unreconciled customer-count metrics keep durability unproven
    approximationNotes: null
    claimRefs: [CU001, CU009, CU011, CU013]
callouts:
  - calloutType: insight
    title: Office-tool adjacency is the clearest wedge
    body: The cleanest bottom-up motion in the assigned pool is not abstract "AI agents" but Genspark embedded where users already work, especially Docs and Sheets, then expanded with team collaboration and admin controls.
    claimRefs: [CU002, CU010, CU013]
  - calloutType: risk
    title: Breadth is visible; durability is not
    body: Public evidence is strong enough to show broad adoption signals, but still too thin to verify renewal quality, customer concentration, or whether the largest logos are expanding or churning.
    claimRefs: [CU003, CU004, CU005, CU006, CU011]
