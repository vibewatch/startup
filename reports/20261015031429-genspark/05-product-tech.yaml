  evidenceGaps:
    - type: missing-source
      severity: material
      topic: developer-surface
      missingEvidence: >-
        Public API documentation, SDKs, repository or package activity, release telemetry,
        practitioner-community evidence, or other developer-signal for the platform.
      whyItMatters: >-
        Without a public developer surface or credible proxy, extensibility, ecosystem depth,
        release discipline, and integration ownership cannot be independently assessed.
      diligencePath: >-
        Request private API and SDK documentation, connector architecture, release logs,
        developer adoption metrics, and references from integration engineers.
      relatedQuestionRefs: [QE003, QE004]
    - type: private-evidence-only
      severity: material
      topic: reliability
      missingEvidence: >-
        Service-level objectives, uptime history, incident records, latency distributions,
        task success rates, human-intervention rates, and evaluation results by module.
      whyItMatters: >-
        Public feature breadth does not establish that long-running, multi-model workflows
        complete reliably or economically in production.
      diligencePath: >-
        Obtain twelve months of status and incident data, module-level success metrics,
        evaluation methodology, model-routing tests, and three enterprise reference calls.
      relatedQuestionRefs: [QE004, QE008]
    - type: conflicting-data
      severity: material
      topic: agent-governance
      missingEvidence: >-
        A module-by-module control matrix showing whether enterprise audit logs and approval
        controls capture every Claw, connector, browser, terminal, email, and scheduled action.
      whyItMatters: >-
        Workspace-level governance claims do not resolve the third-party finding that Claw
        lacks documented per-action approval and exportable action history.
      diligencePath: >-
        Review SOC 2 control mappings, audit-log samples, retention settings, approval-policy
        configuration, and red-team results for prompt injection and unattended actions.
      relatedQuestionRefs: [QE006, QE008]
    - type: missing-source
      severity: material
      topic: product-maturity
      missingEvidence: >-
        Active-user, retention, reliability, support-volume, and paid-adoption metrics for each
        major module, especially newer hardware, memory, email, design, and app-building products.
      whyItMatters: >-
        Launch frequency and portfolio breadth can conceal shallow adoption or uneven quality
        across a rapidly expanding product surface.
      diligencePath: >-
        Request monthly active and paid users, cohort retention, support tickets, release-stage
        definitions, deprecation history, and roadmap commitments by product line.
      relatedQuestionRefs: [QE002, QE007]
