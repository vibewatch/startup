      Six public-facing layers show how Genspark packages context, orchestration, tools, and
      output applications into an enterprise workspace.
    data:
      layers:
        - label: Input surfaces
          detail: "Web research, email, meetings, files, voice, calls, and connected business systems"
          items: ["Web and files", "Email and meetings", "Voice and calls"]
        - label: Persistent context
          detail: "SecondBrain and AI Drive retain connected context and generated work"
          items: ["SecondBrain", "AI Drive", "Project memory"]
        - label: Agent orchestration
          detail: "Super Agent plans tasks and routes work across a changing set of third-party models"
          items: ["Task planning", "Model routing", "Multi-agent execution"]
        - label: Tool and connector layer
          detail: "Tools, native integrations, and MCP-compatible endpoints connect agents to action surfaces"
          items: ["Integrated tools", "Business connectors", "MCP endpoints"]
        - label: Output applications
          detail: "Native products return editable business artifacts and communications"
          items: ["Slides, sheets, docs", "Media and design", "Apps and email"]
        - label: Governance and deployment
          detail: "Enterprise controls govern identity, access, isolation, logs, keys, and deployment region"
          items: ["SSO and SCIM", "Roles and audit logs", "Isolation and residency"]
    approximationNotes: >-
      This is a functional map synthesized from public product descriptions, not a disclosed
      infrastructure diagram; layer ordering does not imply a verified runtime sequence.
    claimRefs: [CE001, CE005, CE012, CE015]
