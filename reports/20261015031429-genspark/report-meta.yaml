companyProfile:
  summary: >-
    Genspark is a private, disclosure-forward AI workspace company that has broadened from AI search into an all-in-one
    agentic productivity suite for documents, slides, spreadsheets, mail, note-taking, and enterprise workflows. Its
    public surface now emphasizes Team and Enterprise packaging, rapid adoption, and a large credit-based usage model,
    but the company still leaves key economics and durability questions unanswered.
