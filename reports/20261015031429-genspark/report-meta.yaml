  topStrengths:
    - >-
      Publicly visible adoption remains strong, with 7,000-plus teams / business clients and a broad Team-to-Enterprise
      funnel.
    - >-
      The product has clear monetization surfaces, including Team list pricing, enterprise contracts, and several
      adjacent paid surfaces.
    - >-
      The company continues to ship new product surfaces and expand the workspace scope beyond its original AI search
      roots.
  topRisks:
    - >-
      The disclosed valuation and growth narrative still outpace independent proof of durable retention, margins, and
      cap-table terms.
    - >-
      Public evidence on unit economics and true recurring ARR remains incomplete, making quality of growth hard to
      underwrite.
    - >-
      The business depends on external model/platform partners and faces commoditization pressure from larger
      productivity suites.
  unresolvedGaps:
    - Audited bridge from annualized run rate to true recurring ARR, including customer retention and seat expansion.
    - Exact cap table, preferences, and economics across the 2026 Series B extension.
    - Current gross margin, cloud-compute cost structure, and burn / runway profile.
    - Verified customer concentration, cohort retention, and Cloud Computer attach rates.
