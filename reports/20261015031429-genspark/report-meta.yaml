    controls into one product surface.
  customerFocus: >-
    Individuals, teams, departments, and enterprise buyers that need document-centric productivity and lightweight
    workflow automation.
  businessModel: Freemium-to-paid SaaS with Team seat subscriptions, custom Enterprise contracts, and credit-based usage limits.
