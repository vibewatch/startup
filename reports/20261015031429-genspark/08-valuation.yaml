company:
  name: "Genspark"
chapter:
  number: 8
  title: "Valuation"
  summary: "Public evidence supports a real growth narrative: company-controlled disclosures moved from a $1.25B post-money Series B in November 2025 to a July 2026 narrative of $645M total funding, a $2.6B valuation, and $250M annualized run rate. The problem is price support: the retained evidence does not disclose retention, gross margin, burn, or 2026 preference economics, so the supportable call remains research-more with a stretched valuation stance."
sections:
  - id: "recommendation-and-price-discipline"
    title: "Recommendation and price discipline"
    body: |-
      The public record is good enough to underwrite meaningful product and commercial momentum, but not good enough to underwrite the current private valuation as investable on price today. Company-controlled disclosures escalated from a $1.25B post-money Series B in November 2025 to a January 2026 claim of $100M ARR in nine months and a July 2026 financing narrative around $645M total funding, a $2.6B valuation, and $250M annualized run rate within 12 months. That makes the recommendation price-sensitive rather than a generic company-quality score: the business may be strong, yet the public evidence supports research-more instead of buy because retention, margin, burn, and cap-table economics remain undisclosed. The valuation stance is stretched and the risk rating stays high until diligence closes those gaps.
    claimRefs: ["CV001", "CV002", "CV004", "CV006", "CV010", "CV014", "CV015"]
    tableRefs: ["TV001"]
    figureRefs: ["FV001"]
  - id: "what-the-public-evidence-does-support"
    title: "What the public evidence does support"
    body: |-
      The strongest part of the case is operating momentum. The company blog disclosed a $275M Series B at a $1.25B post-money valuation in November 2025, Business Wire carried Genspark's statement that it surpassed $100M ARR within nine months by January 2026, and Sacra estimated annualized revenue reached $250M by March 2026. A July 2026 company release then claimed $250M in annualized run rate, more than 7,000 business clients, $645M in funding, and a $2.6B valuation. The official business page also shows a product shape that could support premium pricing if the economics are real: autonomous agents, AI-native productivity surfaces, and 200+ integrations point to a platform aspiration rather than a single-feature tool. The upside case is not hypothetical; what remains unproven is whether this issuer-heavy evidence is strong enough for the current entry price.
    claimRefs: ["CV001", "CV002", "CV003", "CV004", "CV005", "CV006", "CV007", "CV008", "CV009"]
    tableRefs: ["TV002"]
  - id: "what-blocks-conviction-at-the-current-mark"
    title: "What blocks conviction at the current mark"
    body: |-
      The missing proof is exactly the proof valuation discipline needs. None of the retained public sources provides a cap-table or preference schedule for the 2026 extensions, and the reviewed official pages and releases do not disclose gross margin, burn, runway, or net revenue retention. The latest valuation marks are therefore being interpreted through company-controlled narratives and third-party estimates rather than through a durable recurring-revenue bridge. Sacra's adverse lens matters: it warned that Microsoft and Google can use bundling to pressure pricing and that commoditization could compress margins if agentic-workspace differentiation narrows to experience and cost. Silicon Valley Invest Club lists broad technology IPO yardsticks, but their dispersion and differing business models do not establish a defensible Genspark range. These are reasons to reject unsupported precision, not to reject the company outright.
    claimRefs: ["CV009", "CV010", "CV011", "CV012", "CV013", "CV014", "CV015", "CV016"]
    tableRefs: ["TV003"]
  - id: "scenarios-and-diligence-triggers"
    title: "Scenarios and diligence triggers"
    body: |-
      The scenario stack should be framed around evidence quality, not aggressive extrapolation. A bull case needs the July 2026 client and annualized-run-rate narrative to convert into durable enterprise revenue with acceptable retention and margins, plus proof that the 2026 financing stack does not hide punitive preferences or dilution overhang. The base case is that Genspark is real but still too opaque for a clean price call, which argues for a watchlist or deeper diligence rather than immediate conviction capital. The bear case is not zero demand; it is that premium seat pricing, bundling pressure, and incomplete economic disclosure converge into multiple compression or a future down-round. Thesis-break triggers are measurable: weak enterprise retention, thin contribution margins, hidden preference drag, or evidence that the business-client count does not translate into sticky paid expansion.
    claimRefs: ["CV006", "CV008", "CV010", "CV011", "CV012", "CV013", "CV014", "CV015", "CV016"]
