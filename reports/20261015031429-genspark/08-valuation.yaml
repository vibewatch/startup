callouts:
  - calloutType: "recommendation"
    title: "Public growth proof is real, but price support is incomplete"
    body: "The core debate is not whether Genspark is growing; it is whether the retained public evidence is strong enough to justify paying near the latest private mark without verified retention, margins, or financing economics."
    claimRefs: ["CV006", "CV010", "CV014", "CV015"]
  - calloutType: "risk"
    title: "Bundling and commoditization are the cleanest downside channels"
    body: "If Microsoft/Google bundle similar workflows into existing suites faster than Genspark proves premium retention and margin durability, the multiple can compress even if product usage stays high."
    claimRefs: ["CV012", "CV013", "CV015"]
