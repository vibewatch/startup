evidenceGaps:
  - type: missing-source
    severity: material
    topic: revenue-quality
    missingEvidence: >-
      An audited bridge from company-reported ARR or annualized revenue to GAAP revenue, plus retention and expansion
      detail.
    whyItMatters: >-
      The assigned pool contains fast growth claims, but not the underlying revenue quality needed to judge durability
      or valuation support.
    diligencePath: >-
      Request finance KPI pack with ARR definition, cohort retention, seat expansion, and recognized revenue
      reconciliation.
    relatedQuestionRefs:
      - QO005
  - type: missing-source
    severity: material
    topic: cap-table-and-control
    missingEvidence: Current cap table, board composition, liquidation preferences, and economics across the 2026 Series B extensions.
    whyItMatters: >-
      Fundraising velocity is visible, but control and downside protection determine real governance power and common
      equity outcomes.
    diligencePath: Request board deck, cap table, financing documents, and legal summary of investor rights.
    relatedQuestionRefs:
      - QO004
      - QO009
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-roster
    missingEvidence: A fuller executive and board roster beyond the two co-founders that are corroborated in the assigned pool.
    whyItMatters: >-
      Leadership concentration and succession risk are hard to judge when the public record names only a narrow slice of
      the operating and governance team.
    diligencePath: Request board list, executive org chart, and role coverage for GTM, finance, legal, and operations leaders.
    relatedQuestionRefs:
      - QO003
      - QO009
    relatedTableRefs:
      - TO002
  - type: stale
    severity: minor
    topic: headcount
    missingEvidence: A current employee count and functional or geographic split after the March 2026 proxy.
    whyItMatters: >-
      The refresh needs current scale context because a stale headcount can understate operating complexity or hiring
      needs.
    diligencePath: Request HRIS export or updated org chart with headcount by region and function.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: customer-quality
    missingEvidence: Current paying-customer count, customer concentration, retention, and enterprise expansion metrics.
    whyItMatters: Official adoption counts do not distinguish free users, teams, seats, or durable enterprise revenue concentration.
    diligencePath: Request customer cohort table, top-account revenue share, logo list, and net retention analysis.
    relatedQuestionRefs:
      - QO005
      - QO007
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      Independent segmented market-spend data that can isolate TAM, SAM, and SOM for agentic AI workspaces by buyer
      cohort and geography.
    whyItMatters: Without a defensible spend model, valuation must lean on traction signals instead of clear market-share headroom.
    diligencePath: >-
      Obtain current analyst market reports or internal board materials that break the opportunity into user cohorts,
      spend pools, and explicit geographic assumptions.
    relatedQuestionRefs:
      - QM006
  - type: private-evidence-only
    severity: material
    topic: conversion-economics
    missingEvidence: >-
      Conversion, retention, expansion, and budget-owner data that connects self-serve usage to durable paid-seat or
      enterprise revenue cohorts.
    whyItMatters: Market quality depends on repeatable conversion and expansion, not just topline ARR or user counts.
    diligencePath: >-
      Request cohort dashboards, free-to-paid conversion by channel, net retention by segment, and enterprise
      pilot-to-rollout conversion rates from management.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: Real enterprise discount ladders, seat minimums, and contract-length terms for Genspark Team or Enterprise.
    whyItMatters: List pricing alone cannot show whether Genspark has durable willingness to pay versus bundled incumbents.
    diligencePath: Review three recent customer order forms or MSAs plus the current sales deck's package matrix.
    relatedQuestionRefs:
      - QP004
      - QP008
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
