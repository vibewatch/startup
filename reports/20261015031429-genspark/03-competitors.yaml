    title: "Execution is the real comparison set"
    body: "The public wedge is not 'better chat' but fewer handoffs: Genspark is strongest when buyers want a finished artifact or action rather than another answer box."
    claimRefs: ["CP002", "CP003"]
  - calloutType: "risk"
    title: "Bundled suites can compress willingness to pay"
    body: "Google's cited $14 bundle and Microsoft's installed Office footprint are the sharpest public threats because Genspark still has not disclosed the contract terms or migration proof needed to show durable pricing power."
