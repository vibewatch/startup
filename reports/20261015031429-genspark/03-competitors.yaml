      - ["Genspark Team", "$30 per user per month (third-party reported)", "Centralized billing, shared workspace, and admin controls", "Organizational deployment path for teams that want a common AI work layer", "Assigned evidence does not disclose discount ladders, seat minimums, or multi-year terms", "Priced like a premium productivity seat, so ROI must come from workflow replacement"]
