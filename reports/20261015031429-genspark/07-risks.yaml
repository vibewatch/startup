callouts:
- calloutType: risk
  title: Third-party model dependence is structural
  body: Genspark markets multi-model routing, but the retained partner evidence still describes OpenAI models and Realtime API as central to Super Agent. Investors should diligence failover behavior, vendor mix, and margin sensitivity rather than assuming routing alone eliminates dependency.
  claimRefs:
  - CR008
  - CR016
- calloutType: risk
  title: Monetization opacity can become a retention risk
  body: 'The public record already shows the ingredients of a support and renewal problem: six-figure enterprise pricing, monthly quotas for some surfaces, and independent reports of steep credit burn, fair-use caps, and weak support. That is manageable only if real customer value materially outruns surprise usage costs.'
  claimRefs:
  - CR002
  - CR009
  - CR010
  - CR011
- calloutType: recommendation
  title: Kill criteria should focus on proof, not momentum headlines
  body: Do not let the 2026 ARR and valuation narrative substitute for diligence on completed compliance artifacts, support metrics, gross margin, vendor concentration, and customer retention. Those are the datapoints most likely to break the thesis if they lag the public growth story.
  claimRefs:
  - CR005
  - CR007
  - CR015
  - CR016
