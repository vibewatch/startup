    - 'High: 2026 claims moved quickly from >$100M ARR and a $300M Series B to $250M ARR, $645M funding, and $2.6B valuation.'
    - If retention, support, or compute economics lag, the next financing or price discovery could reset expectations sharply.
    - High
    - Large funding base and visible demand offer some buffer.
    - The retained pool still lacks audited ARR bridge, burn, runway, and preference-stack detail.
  notes: Dependencies include suppliers, platforms, and financing counterparties when they materially shape delivery, pricing power, or downside funding risk.
