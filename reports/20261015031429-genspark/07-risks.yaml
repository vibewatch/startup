    - Vendor outage, price increase, policy change, or degraded latency harms flagship workflows and margin structure.
    - High
    - Model routing and broad tool coverage reduce single-model dependence somewhat.
    - The pool does not quantify failover readiness, vendor share of spend, or contractual protections.
  - - Workspace and connector ecosystem
    - Google Workspace and 200+ connected systems
    - User context, in-document actions, and workflow reach across customer stacks
    - 'Medium to high: integrations are part of the value proposition and some platforms are also competitors.'
    - Platform policy changes, permission tightening, or bundle competition reduce distribution leverage and switching incentives.
    - High
    - Current-file scopes and connector breadth improve usability and limit one add-on surface.
    - Incumbents can still bundle adjacent AI capabilities below market and constrain expansion economics.
  - - Capital markets and valuation narrative
    - Current and future investors / financing counterparties
