  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: governance-gap
    missingEvidence: Current third-party certificates, audit reports, DPA terms, and regulator-facing attestations that would make the regulatory/legal table closer to exhaustive.
    whyItMatters: Enterprise security and privacy posture is a major underwriting variable, and marketing claims are not substitutes for audited proof.
    diligencePath: Request the latest SOC 2 / ISO reports, DPA, subprocessor list, breach-notification terms, and any customer security review packets.
    relatedQuestionRefs:
    - QR001
    - QR002
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Audited bridge from ARR and business-client counts to retention, gross margin, compute cost, burn, and runway.
    whyItMatters: The public valuation trajectory is difficult to judge without knowing whether growth quality and cash efficiency support it.
    diligencePath: Obtain board-level KPI pack, cohort retention, revenue recognition bridge, margin walk, and runway model used for the latest financing.
    relatedQuestionRefs:
    - QR005
    - QR007
    relatedTableRefs:
    - TR003
  - type: missing-source
    severity: material
    topic: customer-durability
    missingEvidence: Customer concentration, renewal rates, support SLA performance, and seat-expansion data for enterprise accounts.
    whyItMatters: Quota friction and support quality only become investment-grade if customers still renew, expand, and tolerate the cost structure.
    diligencePath: Interview current enterprise customers, request churn / NRR data, and review support ticket response metrics and escalation patterns.
    relatedQuestionRefs:
    - QR005
    - QR007
    relatedTableRefs:
    - TR002
    - TR003
  - type: missing-source
    severity: material
    topic: partner-concentration
    missingEvidence: Vendor concentration by model spend, contractual protections with strategic partners, and documented failover behavior for agent workflows.
    whyItMatters: Model and platform dependence is a top-ranked risk, but the assigned public sources do not quantify how much redundancy actually exists.
    diligencePath: Request architecture review, vendor concentration dashboard, outage playbooks, pricing protections, and evidence of multi-vendor failover tests.
