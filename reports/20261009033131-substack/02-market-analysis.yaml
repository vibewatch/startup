    title: "Convergence of Creator Subscriptions and Brand Media Spend"
    body: "Substack's addressable opportunity is expanding beyond creator-funded subscription billing into corporate marketing budgets. With brands reporting open rates of 40% to 60% and direct non-social partnership spending growing 56% in 2026, Substack is capturing enterprise sponsorship allocations previously restricted to social ad feeds [CM004, CM009, CM016]."
    claimRefs:
      - "CM004"
      - "CM009"
      - "CM016"
  - calloutType: "risk"
    title: "Security Incidents as Structural Headwinds to Audience Trust"
    body: "The breach of customer email addresses and phone numbers disclosed in February 2026 highlights the operational vulnerability of direct-to-consumer publishing networks. Because writer-subscriber relationships depend on data privacy and email deliverability, uncontained security exposures represent a direct threat to creator retention and subscriber trust [CM017]."
    claimRefs:
      - "CM017"
