evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-transparency
    missingEvidence: >-
      Audited financial statements confirming Substack's company-level GAAP revenue, net platform take rate, gross
      margins, cash burn, and runway.
    whyItMatters: >-
      Without audited financial disclosures, enterprise valuation multiples and underlying platform unit economics
      remain dependent on secondary estimates.
    diligencePath: >-
      Request confidential audited historical financial statements and monthly management accounts under non-disclosure
      agreement.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: cap-table-governance
    missingEvidence: >-
      Full capitalization table disclosing founder equity percentages, liquidation preferences, voting control
      agreements, and unallocated option pool size.
    whyItMatters: >-
      Prevents independent modeling of structural downside dilution, preference overhang, and voting control dynamics
      across share classes.
    diligencePath: Review comprehensive cap table and investor rights agreements directly from company counsel.
    relatedQuestionRefs:
      - QO002
      - QO003
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: creator-cohort-retention
    missingEvidence: Audited longitudinal cohort retention and net churn data across monetized Substack publications.
    whyItMatters: >-
      Without verified cohort churn metrics, platform gross billings growth cannot be definitively separated from new
      creator influx vs sustainable publication longevity.
    diligencePath: Request anonymized creator cohort retention data and gross payment volume decay curves during diligence access.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: earnings-concentration
    missingEvidence: >-
      Granular distribution breakdown of creator earnings across the 50,000 monetized publications outside the top 10
      earners.
    whyItMatters: >-
      High revenue concentration among top creators creates disintermediation and platform departure risks if top
      earners migrate to self-hosted alternatives.
    diligencePath: Analyze tier-based GMV concentration percentiles (top 1%, 5%, 10%, 20%) in management diligence review.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: creator-churn-metrics
    missingEvidence: >-
      Audited annualized publication retention rates, cohort churn metrics, and gross merchandise value (GMV) defection
      rates from Substack to beehiiv or Ghost.
    whyItMatters: >-
      Without private platform churn data, it is impossible to verify whether creator defection to flat-rate competitors
      is economically material or confined to a vocal minority of high earners.
    diligencePath: >-
      Request creator cohort retention waterfalls, gross churn percentages, and net revenue retention (NRR) from
      management in underwriting diligence.
    relatedQuestionRefs:
      - QP006
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: blocking
    topic: cash-burn-and-runway
    missingEvidence: >-
      Audited financial statements detailing Substack's current cash reserves, monthly net burn rate, gross margin
      percentages, and runway duration.
    whyItMatters: >-
      Without primary cash balance and burn rate disclosures, underwriting cannot ascertain how long Substack can
      operate before requiring additional capital or whether Series C proceeds are being depleted by multimedia
      infrastructure.
    diligencePath: >-
      Request management accounts, quarterly income statements, cash flow statements, and forward 24-month budget plans
      under an NDA.
    relatedQuestionRefs:
      - QI007
  - type: missing-source
    severity: material
    topic: architecture-reliability-roadmap
    missingEvidence: >-
      Current architecture diagrams, public API or webhook documentation, deployment process, service-level objectives,
      status history, support metrics, integration inventory, and dated product roadmap.
    whyItMatters: >-
      Without these records, public evidence cannot establish scalability, reliability, integration depth, support
      quality, or whether funding translates into product delivery.
    diligencePath: >-
      Request an engineering architecture review, twelve months of availability and incident data, integration
      documentation, release history, support KPIs, and the board-approved product roadmap.
    relatedQuestionRefs:
      - QE005
  - type: private-evidence-only
    severity: material
    topic: security-controls
    missingEvidence: >-
      Incident root cause, affected-user count, forensic scope, remediation plan, independent control testing, retention
      rules, and detection telemetry for the 2025 breach.
    whyItMatters: >-
      The disclosed incident establishes unauthorized access but does not show whether the vulnerable path was fully
      remediated or whether detection coverage is now effective.
    diligencePath: >-
      Obtain the incident report, penetration-test results, access-control design, audit-log coverage, remediation
      evidence, and any regulator or customer notifications under NDA.
    relatedQuestionRefs:
      - QE007
  - type: private-evidence-only
    severity: material
    topic: cohort-retention-nrr
    missingEvidence: >-
      Audited net revenue retention (NRR), gross revenue retention (GRR), and long-term paid subscriber churn curves
      across creator cohorts.
    whyItMatters: >-
      Direct customer retention curves determine the terminal enterprise value and customer lifetime value (LTV) of
      Substack's publisher network.
    diligencePath: Review internal Stripe billing cohort data and publisher dashboard renewal telemetry.
    relatedQuestionRefs:
      - QU004
  - type: private-evidence-only
    severity: material
    topic: long-tail-revenue-distribution
    missingEvidence: Median and quartile gross annual earnings per monetizing publication across the ~100,000 active creator base.
    whyItMatters: >-
      Reveals whether the creator middle class is economically viable or if platform revenue is hyper-concentrated in a
      tiny fraction of top writers.
    diligencePath: Request anonymized distribution of creator payout percentiles from Substack financial disclosures.
    relatedQuestionRefs:
      - QU008
  - type: enumeration-incomplete
    severity: minor
    topic: enterprise-custom-domains
    missingEvidence: >-
      Comprehensive census of enterprise software and brand customers using custom Substack subdomains beyond the 2,727
      identified crawl matches.
    whyItMatters: Evaluates potential expansion into B2B company communication software and brand media hosting.
    diligencePath: Query comprehensive DNS reverse-lookup and HTTP response header databases for Substack platform signatures.
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: regulatory-and-legal-records
    missingEvidence: |
      Primary regulator, court, licensing, policy, insurance, and claims-register evidence.
    whyItMatters: >
      Without primary records, legal likelihood, jurisdiction, reserves, and mitigation maturity cannot be ranked
      reliably.
    diligencePath: >
      Request the legal claims register and regulator correspondence, then run jurisdiction-specific regulator and
      court-record searches.
    relatedQuestionRefs:
      - QR003
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: incident-scope
    missingEvidence: >
      Forensic root cause, affected-user denominator, notification record, log coverage, and independent remediation
      test for the October 2025 breach.
    whyItMatters: |
      These records determine residual privacy exposure and whether the reported fix addressed the full failure path.
    diligencePath: >
      Review the incident report, notification matrix, relevant logs, penetration test, and control owner's signed
      closure evidence under NDA.
    relatedQuestionRefs:
      - QR002
    relatedTableRefs:
      - TR001
      - TR002
  - type: private-evidence-only
    severity: material
    topic: operational-controls
    missingEvidence: >
      Service map, recovery objectives, failover tests, backup restores, payment reconciliation, idempotency controls,
      and endpoint-change governance.
    whyItMatters: |
      Generic reliability frameworks cannot establish Substack's actual control coverage or recovery performance.
    diligencePath: >
      Run architecture walkthroughs and inspect the last two disaster-recovery, restore, and payment reconciliation
      exercises.
    relatedQuestionRefs:
      - QR004
      - QR005
    relatedTableRefs:
      - TR002
      - TR003
  - type: private-evidence-only
    severity: material
    topic: creator-churn
    missingEvidence: |
      Audited paid-subscriber and creator cohorts by tenure, publication size, pricing, and channel.
    whyItMatters: |
      The retained churn estimate is tertiary and cannot support a durable revenue or concentration conclusion.
    diligencePath: >
      Reconcile internal subscription cohorts to processor records and review gross and net retention by creator
      segment.
    relatedQuestionRefs:
      - QR006
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: cash-runway
    missingEvidence: |
      Current cash, monthly net burn, debt, committed obligations, preference terms, and downside plan.
    whyItMatters: |
      Capital raised and valuation do not establish liquidity, cash burn, or financing capacity.
    diligencePath: >
      Reconcile bank statements to the general ledger, inspect the cap table and financing documents, and test a
      24-month downside cash plan.
    relatedQuestionRefs:
      - QR007
    relatedTableRefs:
      - TR003
