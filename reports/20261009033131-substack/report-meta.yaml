  topStrengths:
    - Large and growing paid-subscription creator network with durable brand recognition.
    - Clear monetization model through a 10% platform take rate and related product expansion.
    - Visible financing support from major venture investors and strategic backers.
  topRisks:
    - Audited revenue, margins, burn, and headcount remain undisclosed, limiting underwriting precision.
    - Creator churn and platform dependency could compress retention and monetization economics.
    - Security and moderation controversies create reputational, legal, and partner risk.
  unresolvedGaps:
    - >-
      Audited revenue, margin, burn, runway, and creator-concentration metrics are not public, leaving the underwriting
      case dependent on estimates.
    - >-
      The full cap table, liquidation preferences, board rights, and option-pool structure remain undisclosed, limiting
      clean downside and dilution analysis.
    - >-
      Exact 2026 headcount, broader executive-bench depth, and formal succession planning are not visible from retained
      public sources.
    - >-
      Long-term creator retention, subscriber cohort durability, and post-breach regulatory follow-up remain
      insufficiently disclosed for a high-confidence investment call.
