  summary: >-
    Substack is a San Francisco-based creator publishing platform founded in 2017 that enables writers and other
    creators to distribute newsletters, podcasts, video, and community products directly to audiences. It monetizes
    primarily through a 10% fee on paid subscriptions, has scaled to more than 5 million paid subscriptions and nearly
    100,000 earning publications, and has expanded product breadth while remaining privately held with limited
    disclosure on financials and ownership.
