schemaVersion: "report-v2"
artifact: risks
slug: substack
runDate: 2026-10-09
company:
  name: Substack
chapter:
  number: 7
  title: Risks
  summary: >
    The strongest evidenced risk is the October 2025 user-data breach, whose affected-user count,
    root cause, and monitoring basis remained undisclosed in the retained February 2026 report.
    Other material exposures are partner and creator-economics dependencies, but the assigned
    evidence does not establish Substack-specific controls, cash runway, or regulatory outcomes.
sections:
  - id: security-privacy-and-legal
    title: Security, privacy, and legal exposure
    body: >
      TechCrunch reported that an unauthorized third party accessed Substack account email
      addresses, phone numbers, and internal metadata in October 2025, while Substack identified
      the issue in February 2026. The company said payment-card data, passwords, and other financial
      information were unaffected, that the problem was fixed, and that an investigation began.
      Those statements narrow the known data categories but do not quantify affected users,
      identify the technical cause, or explain what logs supported the claim that misuse had not
      been observed. The detection interval and disclosure gaps therefore make privacy response
      the highest-priority diligence item. The assigned pool contains no regulator filing, court
      record, enforcement notice, or primary policy document, so this chapter does not assert that
      litigation or enforcement occurred. The legal register is explicitly a sample of evidenced
      issues and open paths, not an exhaustive docket search.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR005
      - CR006
      - CR013
    tableRefs:
      - TR001
  - id: operational-resilience-and-controls
    title: Operational resilience and control maturity
    body: >
      The retained evidence does not disclose Substack's redundancy, incident-response objectives,
      backup tests, payment reconciliation controls, or external security assurance. Independent
      technical essays in the assigned pool provide a useful control framework rather than proof
      of Substack's implementation: dependency failures and bad deploys should be treated as normal
      conditions; reliable execution requires recoverability and reconstructable evidence; and
      durable workflows can add a distributed coordination system that must itself be operated.
      A separate essay argues that the generator should not be its own sole validator. Applied to
      Substack, these principles support diligence tests for isolation, rollback, idempotency,
      auditable state, and independent verification, but they cannot establish that any control is
      absent or present. Residual ratings below are consequently qualitative and should be replaced
      with measured recovery, detection, and reconciliation results.
    claimRefs:
      - CR001
      - CR005
      - CR006
      - CR009
      - CR010
      - CR011
      - CR012
    tableRefs:
      - TR002
    figureRefs:
      - FR001
  - id: partner-and-financial-dependencies
    title: Partner, creator-economics, and financial dependencies
    body: >
      The World Data identifies Stripe as Substack's payment processor and reports a 10% platform
      take rate alongside processor fees, making payment availability and creator economics linked
      dependencies. The same tertiary source attributes an approximately 50% annual paid-subscription
      churn estimate to Sacra; because neither the underlying cohort definition nor Sacra material is
      in the assigned pool, that number is a low-confidence diligence signal rather than a benchmark.
      An independent open-source integration roadmap adds a separate technical signal: live Substack
      endpoint compatibility should not be inferred from mocked tests. Tracxn reports $190 million
      raised over six rounds and a $100 million Series C at a $1.1 billion post-money valuation in
      July 2025. Funding raised is not cash available, and no retained source discloses burn, runway,
      margins, working capital, or counterparty concentration. The investment case therefore remains
      exposed to private financial and contract evidence.
    claimRefs:
      - CR007
      - CR008
      - CR014
      - CR015
      - CR016
    tableRefs:
      - TR003
  - id: monitoring-and-thesis-breaks
    title: Monitoring priorities and thesis-break triggers
    body: >
      Near-term monitoring should start with breach remediation evidence: a scoped forensic report,
      affected-user denominator, notification record, root-cause closure, and independent test of
      detection coverage. Operational diligence should then measure recovery objectives, failed-payment
      reconciliation, duplicate-charge prevention, backup restoration, and endpoint-change controls.
      Commercial diligence should obtain creator and paid-subscriber cohorts by tenure and publication
      size, while financial diligence should reconcile bank cash, committed obligations, monthly net
      burn, and the Series C preference stack. Thesis-break triggers are a material repeat privacy
      incident, evidence that required notifications or controls were deficient, inability to restore
      core publishing or payments within board-approved objectives, sustained creator-cohort contraction,
      or a runway shortfall that requires financing on materially adverse terms. These are proposed
      decision rules, not claims that the events have occurred.
    claimRefs:
      - CR005
      - CR006
      - CR007
      - CR008
      - CR014
      - CR015
      - CR016
