      - number: '7.2'
        title: 运营韧性与控制成熟度
        blocks:
          - type: paragraph
            body: >
              保留证据没有披露 Substack 的冗余、事故响应目标、备份测试、支付对账控制或外部安全保证。指定材料收录的独立技术文章只提供控制框架，并不能证明 Substack
              已实施这些控制：依赖故障和糟糕部署应视为正常情况；可靠执行需要可恢复性和可重建证据；持久工作流还可能增加一个必须自行运营的分布式协调系统。另一篇文章认为，生成器不应成为自己的唯一验证器。将这些原则用于
              Substack，可支持对隔离、回滚、幂等性、可审计状态和独立验证进行尽调测试，但不能证明任何控制缺失或存在。因此，下文的剩余评级只是定性判断，应以实测恢复、检测和对账结果替代。
