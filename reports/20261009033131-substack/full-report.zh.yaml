  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、直接范围与相邻结构
        blocks:
          - type: paragraph
            body: >-
              Substack 的可寻址机会处在独立数字出版、创作者经济订阅计费和新兴直达消费者品牌赞助渠道的交叉点
              [CM001]。核心可服务市场包括创作者所有的新闻通讯、连载出版物、音频播客和直接付费会员；读者定期付费以获取独家分析、社区讨论和媒体内容 [CM002,
              CM003]。按这一核心定义，纳入的支出包括消费者直接定期订阅费（Substack 从中抽取 10% 平台费率）以及为编辑版位协商的创作者原生品牌赞助 [CM003,
              CM004]。相反，排除的支出包括高流量程序化广告网络、传统印刷发行物流、企业内容管理软件套件，以及关系所有权与内容创作者脱钩的商品化群发邮件基础设施 [CM001,
              CM005]。关键相邻类别包括创作者营销机构和社交媒体管理平台；品牌将营销预算转向值得信任的细分声音时，这些类别会与 Substack 的创作者基础对接 [CM006, CM001]。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
