      - number: '1.3'
        title: 资本化历史与利益相关方梳理
        blocks:
          - type: paragraph
            body: >-
              Substack 通过五轮主要机构融资及一次创新的社区众筹，累计获得超过 $185M–$200M 的资本承诺。2018 年种子轮之后，Andreessen Horowitz 领投 A 轮（$15.3M）和 B
              轮（2021 年以 $650M 估值融资 $65M）。在 2022—2023 年科技市场估值重置期间，Substack 于 2023 年春季发起 Wefunder 社区轮，从作者和散户支持者处以折价 $585M
              估值募集 $5M–$8M。2025 年 7 月，BOND 与 The Chernin Group 联合领投 $100M C 轮，估值迅速回升至 $1.1B 投后。C 轮的战略个人投资者包括 Rich Paul 和
              Jens Grede。完整股权结构表、清算优先权顺位和期权池分配仍属私有信息。
