      - number: '2.4'
        title: 增长催化剂、采用约束与平台信任漏洞
        blocks:
          - type: paragraph
            body: >-
              Substack 的采用势头由较高的读者参与度推动：出版物打开率为 40%—60%，高于数字营销 21.5% 的广泛基准 [CM016]。此外，2026 年初品牌认知和跨平台讨论增长 30%，Bluesky、X
              等网络渠道的社交提及总量超过 500 万次 [CM010]。但这些结构性顺风受到订阅疲劳、严重的幂律收入集中和关键数据安全风险的制衡 [CM003, CM011, CM017]。2026 年 2
              月，Substack 披露一起不利安全事件：第三方未经授权访问了客户邮箱和电话号码，时间可追溯至 2025 年 10 月
              [CM017]。邮件送达和受众信任是创作者出版模式的根基，安全事件披露延迟及客户数据暴露会加剧平台治理摩擦，推高创作者流失并压低长期订阅留存 [CM017]。因此，长期市场捕获取决于 Substack
              在超越纯文字订阅、扩展变现的同时能否守住机构层面的平台信任 [CM003, CM017]。
            claimRefs:
              - CM003
              - CM010
              - CM011
              - CM016
              - CM017
