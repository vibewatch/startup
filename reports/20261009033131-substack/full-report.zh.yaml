              - CV003
              - CV008
              - CV010
              - CV015
      - number: '8.2'
        title: 反向论点、流失暴露与情景建模
        blocks:
          - type: paragraph
            body: >-
              Substack 估值的核心反向论点集中在僵化抽成模式的脆弱性、结构性流失和平台依赖上。平台付费订阅在 2025 年 3 月突破 5M，但第三方研究基准显示创作者订阅者年流失率接近
              50%，迫使作者不断奔波于订阅者获客。高利润头部创作者承受来自 Ghost、beehiiv 等低费率替代方案的经济压力；前 10 位作者仅其自身就产生 $40M
              总账单，因此出走风险并不对称。此外，Substack 于 2026 年 2 月确认了源自 2025 年 10 月的数据泄露，暴露用户邮箱和电话号码。2026
              年宏观资本环境体现出更严格的私募市场纪律，机构配置者大幅折价看待非盈利订阅资产。若视频扩张并增长 35%，乐观情景下企业价值可达 $1.8B（按 $100M ARR 为 18x）；温和增长且抽成稳定的基准情景支持
              $800M–$1.0B 合理价值区间（按 $65M ARR 为 14x）；创作者出走且流失加剧的悲观情景则意味着 $450M–$550M 估值（按 $50M ARR 为 10x）。
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV008
              - CV009
              - CV011
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV007
              - CV008
              - CV010
              - CV012
      - number: '8.3'
        title: 退出准备度、可比倍数与尽调核验
        blocks:
          - type: paragraph
            body: >-
              Substack 最终可能通过 IPO 退出，也可能被多元化媒体集团或社交生态战略收购。在 IPO 前二级市场，EquityZen
              等平台上的股份交易显示私人投资者仍感兴趣，但市场整体私募信贷和围绕超大市值平台产品的风投集中，使流动性受到严重限制。可比数字媒体和 SaaS 出版基准按未来收入的 4—8
              倍交易；如果公开市场退出窗口仍然挑剔，Substack 的私有估值标记容易收缩。在投入资本前，关键尽调包括取得经审计的 GAAP
              财务报表以确定真实贡献利润率，检查创作者队列留存和净收入留存曲线，并评估股权表清算优先权，以确认普通股是否承受下行悬置。
            claimRefs:
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: 展示项
        blocks:
          - type: callout
            title: 价格敏感性要求尽调，而非猜测
            body: Substack 11 亿美元的标价估值，要求以证据核实现金消耗、创作者队列持久性和毛利率，而不能只依赖订阅者总量增长势头。
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV010
              - CV015
