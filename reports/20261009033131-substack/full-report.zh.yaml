      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 融资额不是现金跑道指标
            body: |
              已披露的 1.9 亿美元募资和 2025 年 7 月 C 轮说明的是融资历史，而非当前流动性；银行现金、烧钱、债务、优先权和已承诺义务仍待核实。
