        - 高（约 55%）
      - - 悲观情景
        - 头部创作者转向 Ghost/beehiiv；ARR 在 $50M 附近停滞；漏洞整改升级
        - 9x–11x ARR 倍数反映媒体模式放缓和平台风险上升
        - $450M - $550M
        - 需要下轮融资；清算优先权负担损害普通股权益
        - 中（约 25%）
    notes: 情景估值假设 Substack 将 10% 平台抽成率应用于不同留存率和估值倍数情景下的订阅总额。
    claimRefs:
      - CV003
      - CV004
      - CV007
      - CV008
      - CV010
      - CV012
figures:
  - id: FO001
    title: Substack 公司发展与里程碑时间线
    type: timeline
    summary: 2017 年创立至 2026 年期间塑造 Substack 的关键公司、融资、产品和监管里程碑。
    data:
      items:
        - label: 公司创立
          date: 2017-07
          detail: Chris Best、Hamish McKenzie 和 Jairaj Sethi 在旧金山创立公司，旨在颠覆广告支持的媒体模式。
          tone: neutral
        - label: 种子轮融资
          date: 2018-02
          detail: 从 Y Combinator、The Chernin Group、Fifty Years 和 Zhen Fund 获得 $2M 种子轮融资。
          tone: positive
        - label: Series A 融资
          date: 2019-07
          detail: 完成由 Andreessen Horowitz 领投、规模约 $15.3M 的 Series A，以扩大作者获取。
          tone: positive
        - label: Series B 与网络扩张
          date: 2021-03
          detail: 疫情期间通讯业务加速，在 $650M 估值下完成由 a16z 领投的 $65M Series B。
          tone: positive
        - label: 社区众筹
          date: 2023-05
          detail: 创作者通过 Wefunder 融资 $5M–$8M，调整后估值为 $585M。
          tone: neutral
        - label: Series C 独角兽里程碑
          date: 2025-07
          detail: 完成由 BOND 和 The Chernin Group 共同领投的 $100M Series C，估值达到 $1.1B。
          tone: positive
        - label: 原生广告转向
          date: 2025-12
          detail: 引入原生广告集成，让变现不再局限于纯订阅。
          tone: neutral
        - label: Substack TV 应用
          date: 2026-01
          detail: 在 Apple TV 和 Google TV 推出独立 Substack TV 应用，扩大视频分发。
          tone: positive
        - label: 数据安全漏洞披露
          date: 2026-02
          detail: 披露 2025 年 10 月事件，用户电子邮件、电话号码和内部元数据遭到暴露。
          tone: negative
        - label: 编辑争议升级
          date: 2026-02
          detail: 围绕极端主义通讯变现的调查引发新一轮民权反弹。
          tone: negative
    approximationNotes: 日期对应公开公告和机构媒体披露；内部开发日期可能早于公开发布。
    claimRefs:
      - CO001
      - CO010
      - CO011
      - CO012
      - CO014
      - CO015
      - CO016
  - id: FM001
    title: 市场规模视角架构
    type: pyramid
    summary: 从宏观数字内容软件到平台订阅量的分层市场规模框架。
    data:
      items:
        - label: 全球社交媒体管理 TAM（2026 年 $39.14B）
          value: 39.14
          unit: USD B
          valueNote: 宏观企业内容发布和分析软件支出按 19.70% CAGR 增长
          tone: neutral
        - label: 全球创作者经济整体（2026 年 £255B）
          value: 255
          unit: GBP B
          valueNote: 创作者变现和工具活动总额预计到 2030 年达到 £645B
          tone: positive
        - label: 直接创作者合作 SAM（£32.9B 美国创作者广告支出）
          value: 32.9
          unit: GBP B
          valueNote: 品牌与创作者合作、非社交直接赞助支出同比激增 56%
          tone: opportunity
        - label: Substack 创作者订阅 SOM（£337M 平台 GMV）
          value: 337
          unit: GBP M
          valueNote: 5 万个变现出版物的订阅总额；Substack 抽取 10% 费用
          tone: positive
        - label: 头部出版物层级捕获（£30M 头部 10 家出版物）
          value: 30
          unit: GBP M
          valueNote: 幂律集中度明显，头部 10 家出版物贡献订阅 GMV 总额的近 9%
          tone: warning
        - label: 高支出订阅者群组（$9.6k/年多订阅支出）
          value: 9600
          unit: USD/yr
          valueNote: 观察到机构 / 交易员个人订阅者在 20 多份专业付费研究通讯上的支出
          tone: positive
    approximationNotes: 数据按报道汇总自行业分析师估算和平台披露，涵盖 USD 与 GBP。
    claimRefs:
      - CM003
      - CM008
      - CM009
      - CM011
      - CM012
      - CM013
  - id: FP001
    title: 竞争定位矩阵：发现能力 vs. 定制与控制
    type: quadrant
    summary: 比较各发布平台对内部网络发现的利用能力，以及设计灵活性、自动化和变现控制。
    data:
      xAxis: 定制、自动化与变现控制（低至高）
      yAxis: 原生发现与网络效应（低至高）
      points:
        - label: Substack
          x: 20
          'y': 85
          group: Creator Network
          description: 借助 Notes 和 Recommendations 实现较强的原生发现，但定制能力受限，收入抽成率为 10%。
        - label: beehiiv
          x: 75
          'y': 65
          group: Specialized Newsletter
          description: 增长工具完善，内置广告网络，平台抽成率为 0%，推荐闭环正在形成。
        - label: Ghost
          x: 90
          'y': 15
          group: Open-Source CMS
          description: 设计完全自主，可选择自托管，会员费率为 0%，但完全依赖外部流量。
        - label: Kit (ConvertKit)
          x: 80
          'y': 35
          group: Marketing Suite
          description: 深度可视化自动化和数字产品交易，并提供次级创作者网络推荐。
        - label: Mailercloud
          x: 70
          'y': 10
          group: Email Marketing
          description: 自动化程度高，提供收件箱送达分析和统一定价，但没有内置消费者发现引擎。
        - label: WordPress 自托管版
          x: 95
          'y': 5
          group: Status Quo CMS
          description: 架构和插件完全自由且不抽取收入，但技术负担重，也没有网络效应。
    approximationNotes: 平台坐标反映基于已验证功能集、定价模式和网络能力得出的比较序数评分。
    claimRefs:
      - CP001
      - CP003
      - CP004
      - CP007
      - CP008
