      - number: '2.2'
        title: 可寻址市场规模：总量、可服务量与平台捕获量
        blocks:
          - type: paragraph
            body: >-
              评估 Substack 的增长空间，需要将市场规模拆成三个不同层次，而不能依赖笼统的宏观预测 [CM008]。最宽的总可寻址边界内，全球社交媒体管理市场 2025 年达到 $32.48B，预计从 2026 年的
              $39.14B 扩大至 2034 年的 $164.52B，复合年增长率为 19.70% [CM008]。在创作者经济内部，全球创作者经济活动 2026 年估值为 £255B，预计 2030 年达到
              £645B；美国创作者经济广告支出预计 2026 年达到 £32.9B [CM009]。在可服务边界，品牌在社交信息流之外的直接合作支出 2026 年增长 56%，为 Substack
              的原生赞助测试和创作者合作带来即时顺风 [CM009]。在 Substack 眼下可捕获的平台范围内，超过 5 万个变现出版物和逾 5M 付费订阅产生约 £337M（相当于
              $440M）的年度创作者订阅商品总值，Substack 从中抽取 10% 软件平台费 [CM003, CM010, CM011]。但市场扩张受极端幂律约束：前 10 个出版物年收入超过
              £30M，长尾变现高度依赖自助转化 [CM003, CM012]。
            claimRefs:
              - CM003
              - CM008
              - CM009
              - CM010
              - CM011
