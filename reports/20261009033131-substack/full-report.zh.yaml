      - number: '7.4'
        title: 监测重点与论点失效触发器
        blocks:
          - type: paragraph
            body: >
              近期监测应从泄露修复证据开始：范围明确的取证报告、受影响用户分母、通知记录、根因关闭情况，以及对检测覆盖率的独立测试。运营尽调随后应测量恢复目标、失败支付对账、重复扣款预防、备份恢复和端点变更控制。商业尽调应按任期和出版物规模获取创作者及付费订阅者队列；财务尽调应核对银行现金、已承诺义务、月度净烧钱和
              C
              轮优先股堆叠。论点失效触发器包括重大隐私事件再次发生、证据显示通知或控制不足、无法在董事会批准的目标内恢复核心出版或支付、创作者队列持续收缩，或跑道不足而必须以显著不利条款融资。这些是拟议决策规则，不是声称相关事件已经发生。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR014
