      - number: '4.3'
        title: 资本充足性、历史融资信号与投资判断风险
        blocks:
          - type: paragraph
            body: >-
              Substack 的资产负债表轨迹呈现风险资本化与创作者社区融资的交替周期。整个机构融资生命周期内，Substack 累计股权融资约 2.22 亿美元，最终在 BOND 和 The Chernin Group
              领投下，于 2025 年 7 月宣布 1 亿美元 C 轮，投后估值 11 亿美元。此前包括 2021 年 6.5 亿美元估值下的 6500 万美元 B 轮，以及 2023 年 3 月在 Wefunder 发起的
              500 万美元股权众筹，定价为 5.85 亿美元投前估值（相当于过去 2000 万美元收入的 30 倍）。然而，公开来源无法审计 Substack
              当前现金储备、月度运营烧钱、现金跑道长度或清算优先权。再加上订阅疲劳和 2025 年 10 月发生、2026 年 2 月披露且暴露用户联系记录的严重网络安全泄露，Substack
              的未来财务状况仍高度依赖私募股权流动性或最终上市退出准备度。
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
      - number: '4.4'
        title: 展示项
        blocks:
          - type: callout
            title: 平台租金挤压与大型创作者流失风险
            body: >-
              Substack 固定 10% 的收入分成模式会随着出版物扩大而形成结构性流失压力。零前期软件成本能吸引新兴创作者，但月收入 $100,000 的成熟出版商每月要向 Substack 支付 $10,000
              平台费（年付 $120,000），还要承担 Stripe 处理费。自托管替代方案和 beehiiv、Ghost 等固定费率平台只收固定 SaaS 费用（每月 $80–$250），因此 Substack
              面临逆向选择风险：当订阅者基础稳定后，收入最高、能创造利润的创作者可能迁出平台。
