chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Substack 由 Chris Best、Hamish McKenzie 和 Jairaj Sethi 于 2017
              年创立，是一家总部位于美国加州旧金山、以创作者为先的数字出版平台。公司的核心经济架构建立在作者与主动订阅读者的直接关系之上，将新闻通讯、音频和视频直接送达收件箱与 App，不依赖算法信息流中介。Substack
              采用平台抽成变现模式：从付费订阅总收入中抽取 10%，外部支付处理商 Stripe 另扣标准交易费，创作者获得剩余部分。到 2026 年初，全球网络规模已超过 500 万付费订阅，支撑接近 10
              万个全球变现出版物。然而，公司层面的经审计收入、GAAP 盈利能力和创作者集中度指标仍属未披露的私有数据，因此必须严格区分已报告的平台规模指标与未经验证的公司汇总财务数据。
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO005
              - CO006
              - CO007
