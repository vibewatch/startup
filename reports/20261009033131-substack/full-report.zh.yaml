  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点、资本化历史与估值投资判断
        blocks:
          - type: paragraph
            body: >-
              Substack 的创作者经济投资论点颇具吸引力，支柱是可信的直达受众变现、记者群体中的高品牌认知，以及通过 Notes 和原生 App 实现的网络驱动发现。Substack 以透明的 10%
              平台抽成取代算法信息流广告模式，已扩展到超过 50,000 个盈利出版物，并有超过 50 位创作者年收入超过 $1M。TechCrunch 和 EquityZen 的历史融资记录显示，资本化从 2021 年以
              $650M 估值完成的 $65M B 轮，经过 2023 年 3 月 $5M 社区众筹扩展，发展到 BOND 与 The Chernin Group 领投、于 2025 年 7 月完成的 $100M C
              轮，后者以 $1.1B 投后估值确立独角兽地位。机构与社区累计募资在 $190M–$222M 之间。然而，若对照估计的 $45M–$60M 年化净平台收入，$1.1B 投资判断估值对应 18x–24x
              ARR；在宏观风投市场，经验丰富的投资者会要求经过验证的盈利能力、受控的单位利润率和清晰的清算瀑布，这一估值要求不低。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
