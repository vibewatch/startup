  - id: FE001
    title: 已验证产品体验栈
    type: stack
    summary: 该架构将可观察的用户界面层与留存证据未披露的内部实现分开。
    data:
      layers:
        - label: 创作者界面
          detail: 可观察的出版物页面用于长篇架构、产品管理和技术文档内容。
          modules:
            - 托管或自定义域名出版物
            - 订阅入口
        - label: 内容格式
          detail: 可观察的长篇和播客界面与第三方报道的视频和直播能力并列。
          modules:
            - 通讯和播客格式
            - 视频和直播格式
        - label: 权限
          detail: 创作者页面可见地为付费订阅者设置周期性专业系列的访问门槛，但实现细节仍未披露。
          modules:
            - 付费内容门槛
            - 订阅者入口
        - label: 发现
          detail: 可见官方主题目录；Notes 的信息来自第三方汇编，而排名逻辑仍未披露。
          modules:
            - 顶级科技目录
            - Notes 发现界面
        - label: 创作者可迁移性
          detail: 自定义域名和订阅者名单导出由第三方报道；完整性和迁移控制仍未经验证。
          modules:
            - 自定义域名身份
            - 订阅者名单导出
        - label: 信任边界
          detail: 据报道，2025 年事件暴露了账户联系数据和内部元数据；底层控制并未公开。
          modules:
            - 电子邮件和电话数据
            - 未披露的内部实现
    approximationNotes: 概念排序反映已验证的产品体验，而非推断的服务、数据库、云厂商或网络连接。
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE008
      - CE012
      - CE013
  - id: FU001
    title: Substack 从读者到订阅者的转化与扩张旅程
    type: journey-map
    summary: 展示从网页 / 电子邮件发现到付费订阅、周期性支持和跨通讯扩张的路径。
    data:
      items:
        - label: 发现
          detail: 通过 Substack Notes、社交链接和网页搜索触达漏斗上层用户
        - label: 免费订阅
          detail: 读者提供电子邮件地址，以接收无门槛的通讯文章
        - label: 互动
          detail: 通过移动应用阅读和社区讨论串形成习惯性消费
        - label: 付费墙转化
          detail: 读者撞上付费墙后，转为每月 $5–$10 的周期性付费订阅
        - label: 支持扩张
          detail: 忠实粉丝升级为 Founding Member，每年支付 $100–$300
        - label: 网络交叉传播
          detail: 推荐闭环将订阅者引向相关细分出版物
    approximationNotes: 根据出版商案例和创作者变现指南，展示平台的典型转化路径。
    claimRefs:
      - CU002
      - CU003
      - CU012
      - CU013
  - id: FR001
    title: 定性剩余风险热力图
    type: matrix
    summary: |
      六项优先风险按定性方式排序；由于指定证据缺少事件频率、控制测试和财务分母，可能性未表示为概率。
    data:
      columns:
        - 风险
        - 可能性
        - 影响
        - 缓解措施成熟度
        - 剩余风险
      rows:
        - label: 隐私事件复发
          values:
            - 既往事件已确认
            - Unknown
            - 高
            - 声称已修复并调查；没有保证
            - 重大
        - label: 监管或法律后续行动
          values:
            - 未留存一手记录
            - Unknown
            - 可能较高
            - 无证据支持
            - 未量化
        - label: 核心依赖项中断
          values:
            - 框架风险，并非有报道的 Substack 事件
            - Unknown
            - 高
            - 无证据支持
            - 在完成恢复测试前仍属重大
        - label: 支付处理商中断
          values:
            - Stripe 关系有报道
            - Unknown
            - 高
            - 未见替代方案证据
            - 重大
        - label: 创作者与订阅者流失
          values:
            - 仅有三手估算
            - Unknown
            - 高
            - 未见队列控制证据
            - 重大
        - label: 现金跑道或融资压力
          values:
            - 已披露融资，但现金余额与烧钱情况缺失
            - Unknown
            - 高
            - Series C 已于 2025 年 7 月完成
            - 未量化
    approximationNotes: |
      仅作定性评估；没有根据公开来源推断数值化可能性、损失估算或控制评分。
    claimRefs:
      - CR001
      - CR005
      - CR006
      - CR007
      - CR008
      - CR009
      - CR010
      - CR012
      - CR014
      - CR015
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 这条逻辑链把 Substack 的规模、财务估值与平台风险串起来，最终导向“继续研究”的建议。
    data:
      nodes:
        - id: scale
          label: 创作者规模（5M+ 付费订阅用户）
          detail: 超过 50,000 个创收出版物，活跃订阅超过 5,000 万
          tone: positive
        - id: valuation
          label: 估值基准（$1.1B）
          detail: Series C 融资估值达到估算平台 ARR 的 18x–24x
          tone: neutral
        - id: macro
          label: 宏观风险投资纪律
          detail: 机构资金向盈利的后期平台集中
          tone: neutral
        - id: risks
          label: 核心脆弱点
          detail: 年流失率 50%、数据泄露披露，以及未经验证的私营公司利润率
          tone: risk
        - id: discipline
          label: 投资判断纪律
          detail: 没有经审计的单位经济模型，就不把高价私募估值计入投资判断
          tone: neutral
        - id: recommendation
          label: 建议：继续研究
          detail: 在完成经审计财务与股权表尽调前，维持跟踪立场
          tone: neutral
      edges:
        - from: scale
          to: valuation
          relationship: 驱动
        - from: valuation
          to: macro
          relationship: 由……界定
        - from: macro
          to: risks
          relationship: 加剧
        - from: risks
          to: discipline
          relationship: 使……成为必要
        - from: discipline
          to: recommendation
          relationship: 得出结论
    approximationNotes: 这是一条顺序逻辑链，将平台的实证规模与投资判断风险、估值立场结合起来。
    claimRefs:
      - CV001
      - CV003
      - CV008
      - CV010
      - CV015
