      - number: '2.3'
        title: 受众分层、预算归属与采用机制
        blocks:
          - type: paragraph
            body: >-
              Substack 的多边经济模式连接三类主要客户：独立创作者出版商、个人付费订阅者和企业品牌营销团队 [CM001,
              CM004]。独立创作者既是平台用户，也是供给侧业务建设者；他们通过自助入驻获得直接的邮件名单所有权，并绕开第三方社交算法风险 [CM003,
              CM012]。个人订阅者是零售端和专业端的最终付费者，购买决策取决于个人可支配学习预算或专业研究预算 [CM002,
              CM013]。交易和研究读者的实际行为显示，活跃散户投资者愿意持续投入可观金额——例如同时持有超过 20 个订阅、年支出超过 $9,600——以获得高确信度市场分析和超额收益
              [CM013]。与此同时，零售、时尚和科技领域的品牌营销预算持有人（包括 Walmart、Shopify 和 Rare Beauty）通过赞助期刊和品牌数字杂志进入
              Substack，在拥挤的社交信息流之外培育持久的社区信任 [CM004, CM014]。整合 Substack 5 万个变现出版物自动发现功能的影响者营销工具，进一步强化了这种机构采用 [CM004,
              CM015]。
