      - number: '3.4'
        title: 切换成本、平台锁定与护城河持久性
        blocks:
          - type: paragraph
            body: >-
              Substack 的竞争护城河建立在网络效应和读者可迁移性约束上，而非专有邮件分发基础设施。Substack 通过支持完整导出邮件订阅者 CSV 和 Stripe
              客户支付令牌来倡导创作者自主所有权，使创作者无需重新录入信用卡即可顺畅迁移到 Ghost 或 beehiiv；但创作者无法导出社交关系图谱。离开 Substack 会切断推荐网络、历史评论存档和 Notes
              粉丝的访问，形成软锁定；出版物的社区关系越深，锁定越强。反过来，Substack 的防御力容易受到头部创作者出走的冲击：当受众规模降低 Substack
              推荐引擎的增量发现价值后，高收入出版物会获得强烈的经济动机，转向自托管或固定费率技术栈。此外，平台审核争议和数据安全担忧也曾周期性推动知名创作者迁往去中心化替代方案。
            claimRefs:
              - CP002
              - CP004
              - CP008
              - CP010
              - CP014
              - CP015
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 抽成惩罚与高收入创作者迁移风险
            body: >-
              Substack 10% 的收入抽成会形成自然的经济上限：头部创作者最终会超过平台发现能力带来的收益。当出版物年付费订阅总收入超过 10 万美元后，每年向 Substack 支付 1
              万美元以上的成本，可能超过推荐网络带来的边际订阅者增量，持续把流失压力推向 Ghost、beehiiv 等固定费率架构。
            calloutType: risk
            claimRefs:
