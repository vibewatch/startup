              - CP003
              - CP004
              - CP007
              - CP008
      - number: '3.3'
        title: 功能能力、工作流自动化与分发力量
        blocks:
          - type: paragraph
            body: >-
              对功能深度的考察显示，Substack 与现代邮件营销平台在工具理念上差异明显。Substack
              优先减少编辑摩擦并进行广播式分发，刻意不提供复杂自动化序列、多变量标题测试和高级行为分层。作者无法原生根据读者不活跃触发入门漏斗，也无法按自定义购买历史分发内容。相较之下，Mailercloud、MailerLite
              和 Kit 等邮件营销替代平台提供可视化自动化构建器、收件箱到达率追踪和细粒度标签。Substack 的强差异化来自推荐网络和 Notes 生态，它们连接超过 3500
              万个活跃订阅并推动关联出版物交叉导流。但创作者称，随着网络竞争加剧，平台自然发现速度已经放缓，运营者被迫在 LinkedIn 和 X 上搭建外部分发飞轮，而不能只依赖内部算法信息流。
