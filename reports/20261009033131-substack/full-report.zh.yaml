        title: 展示项
        blocks:
          - type: callout
            title: 创作者订阅与品牌媒体支出的汇流
            body: >-
              Substack 的可寻址机会正从创作者付费的订阅计费扩展到企业营销预算。品牌报告的打开率为 40%—60%，且非社交直接合作支出在 2026 年增长 56%；Substack
              因而正在承接此前局限于社交广告信息流的企业赞助预算 [CM004, CM009, CM016]。
            calloutType: insight
            claimRefs:
              - CM004
              - CM009
              - CM016
          - type: callout
            title: 安全事件对受众信任构成结构性逆风
            body: 2026 年 2 月披露的客户邮箱和电话号码泄露，凸显直达消费者出版网络的运营脆弱性。作者与订阅者的关系依赖数据隐私和邮件送达能力，未受控制的安全暴露会直接威胁创作者留存和订阅者信任 [CM017]。
            calloutType: risk
            claimRefs:
              - CM017
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局分类与替代架构
        blocks:
          - type: paragraph
            body: >-
              创作者出版和订阅媒体市场分为几种架构范式：原生发现网络、零抽成专用新闻通讯平台、模块化开源内容管理系统、多产品创作者营销套件，以及传统企业邮件服务商。Substack 将自己定位为闭环订阅网络，把读者发现、通过
              Stripe 的支付处理和内容分发打包在一起。直接挑战者 beehiiv 面向增长型数字创作者，以零平台订阅费搭配内置广告网络和推荐基础设施。Ghost 等开源 CMS 为独立媒体组织提供自托管和固定费率
              SaaS 层级，完全消除收入分成。与此同时，Kit
              等创作者平台强调多产品商业化和工作流自动化，传统营销套件则提供细粒度分层且不锁定社交网络。竞争者和创作者会从定价摩擦、受众所有权可迁移性、自动化成熟度和内置发现能力等维度评估替代方案。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP007
              - CP008
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP007
      - number: '3.2'
        title: 变现模式、平台抽成与创作者经济
        blocks:
          - type: paragraph
            body: >-
              变现架构是 Substack 与替代方案之间的主要经济战场。Substack 对全部付费订阅总收入收取固定 10% 平台费；再加上 Stripe 标准信用卡处理费（每笔 2.9% 加
              $0.30，以及针对新创作者新增的 0.7% 计费费），创作者获得收入前总订阅流水约有 13%—14% 被扣除。在基础收入水平，Substack
              提供零边际成本托管；但规模扩大后，按比例抽成相较固定费率竞争者会变得惩罚性更强。beehiiv、Ghost 和 Mailercloud 对付费订阅收入收取 0% 平台费，改收可预期的月度软件费。因此，一个月收入
              $5,000 的出版物每月约向 Substack 支付 $500，而替代平台以每月 $10–$49 的固定层级提供相当或更好的出版基础设施。此外，Substack 对自定义网站域名映射收取一次性 $50
              费用，竞争者则通常把定制品牌和原生广告变现直接打包进基础层级。
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP009
              - CP010
              - CP011
