        title: 管理层、创始人与董事会治理
        blocks:
          - type: paragraph
            body: >-
              Substack 由三位主要联合创始人领导：首席执行官 Chris Best（曾任通讯应用 Kik 的联合创始人兼 CEO）、首席写作官 Hamish McKenzie（负责编辑传播和创作者倡导）以及首席技术官
              Jairaj Sethi（负责技术架构与基础设施）。董事会治理体现主要机构融资方的影响，Andreessen Horowitz 的 Andrew Chen 和 BOND 的 Mood Rowghani
              与执行创始人共同参与。尽管聚合网站偶尔会列出第三方贡献者，机构控制权和投票治理仍集中在三位联合创始人与一线风投发起方手中。单个创始人的持股比例、正式继任计划及更广泛的管理层梯队信息从未公开，初始领导团队因而存在显著的关键人依赖。
            claimRefs:
