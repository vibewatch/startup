            title: 声誉与安全治理漏洞
            body: >-
              2025 年 10 月数据泄露直到 2026 年 2
              月才披露，订阅者联系记录因此暴露，凸显基础设施和安全风险，并直接挑战读者信任。加上平台内容审核立场持续遭受反弹，机构尽调必须严格核实订阅者留存的持久性及潜在平台责任。
