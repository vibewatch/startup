      - number: '4.2'
        title: 单位经济、利润率压力与服务成本动态
        blocks:
          - type: paragraph
            body: >-
              Substack 的财务效率依赖网络驱动的自然获客，但会受到带宽和多媒体托管开销的反向制约。为抵御 beehiiv 等新兴竞争者和传统新闻通讯，Substack 于 2026 年 3
              月扩展原生视频录制和播客分发，引入工作室工具及 AI 驱动的片段生成。早期平台数据表明，采用多媒体工具的创作者收入增长比纯文字出版商快
              50%；但与轻量文字分发相比，视频和高保真音频会显著抬高云计算、转码和内容分发网络成本。关键是，Substack
              没有披露合并毛利率、托管基础设施支出、获客成本或净收入留存队列。缺乏可审计的单位层面利润率，掩盖了多媒体扩张究竟带来增量毛利，还是稀释平台贡献利润率。
