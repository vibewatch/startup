              - CP002
              - CP010
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、抽成经济学与变现结构
        blocks:
          - type: paragraph
            body: >-
              Substack 通过按交易分成的收入架构变现创作者受众，而不是采用定期软件订阅层级。核心商业引擎对新闻通讯、播客和视频出版物的每一美元定期付费订阅收入收取不可协商的 10% 平台抽成。除 Substack 的
              10% 平台费外，创作者还承担 Stripe 的第三方商户处理费：每笔标准为 2.9% 加 0.30 美元，2024 年 7 月后发起的订阅另有 0.7% 定期计费附加费。对于典型的每月 5.00
              美元订阅，平台和支付处理扣款合计 0.99 美元（即总账单的 19.8%），作者最终获得 4.01
              美元净收入。这一结构让新作者可以在免费层级以零边际成本入驻，却会从高流量出版物中悄然抽走越来越多的绝对金额，促使成熟创作者评估低费率替代方案。
            claimRefs:
              - CI001
