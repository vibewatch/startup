      - number: '7.3'
        title: 伙伴、创作者经济与财务依赖
        blocks:
          - type: paragraph
            body: >
              World Data 将 Stripe 列为 Substack 的支付处理商，并报告 10% 的平台抽成及处理费，使支付可用性与创作者经济形成相互关联的依赖。同一第三方来源将约 50%
              的年度付费订阅流失估计归因于 Sacra；由于指定材料没有底层队列定义或 Sacra 原文，该数字只是低置信度尽调信号，而非基准。独立的开源集成路线图还提供了另一项技术信号：不应从模拟测试推断实时
              Substack 端点兼容性。Tracxn 报告六轮融资共募得 1.9 亿美元，以及 2025 年 7 月以 11 亿美元投后估值完成的 1 亿美元 C
              轮。募资额不等于可用现金，且没有保留来源披露烧钱、跑道、利润率、营运资金或交易对手集中度。因此，投资判断仍暴露于私有财务和合同证据不足。
            claimRefs:
              - CR007
