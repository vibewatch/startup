            body: >
              TechCrunch 报道称，未经授权的第三方于 2025 年 10 月访问了 Substack 账户邮箱、电话号码和内部元数据，而 Substack 于 2026 年 2
              月确认问题。公司称支付卡数据、密码和其他财务信息未受影响，问题已经修复并启动调查。这些说法缩小了已知数据类别，但没有量化受影响用户、确定技术原因，也没有解释哪些日志支持“尚未观察到滥用”的说法。因此，检测间隔和披露缺口使隐私响应成为最高优先级尽调事项。指定材料中没有监管申报、法院记录、执法通知或主要政策文件，所以本章不声称诉讼或执法已经发生。法律登记表明确只是已证实问题和开放路径的样本，不是穷尽性的案卷检索。
