      - number: '1.4'
        title: 平台里程碑与不利风险画像
        blocks:
          - type: paragraph
            body: >-
              Substack 从最初的文字新闻通讯分发，逐步演变为覆盖播客、通过 Notes 提供移动发现信息流以及 2026 年初上线专属电视应用的多媒体网络。但网络快速扩张也带来运营和治理摩擦。2026 年 2
              月，Substack 确认一宗源于 2025 年 10 月入侵的数据安全泄露，内部元数据、用户邮箱和电话号码遭到暴露。与此同时，围绕宽松内容审核的持续公开争议——包括 2026 年 2
              月对可变现极端主义和反犹出版物的新一轮批评——在 Substack 扩大原生广告和品牌赞助时，带来声誉与广告主方面的阻力。
            claimRefs:
              - CO014
              - CO015
              - CO016
