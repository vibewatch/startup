  evidenceGaps:
    - type: "missing-source"
      severity: "material"
      topic: "architecture-reliability-roadmap"
      missingEvidence: "Current architecture diagrams, public API or webhook documentation, deployment process, service-level objectives, status history, support metrics, integration inventory, and dated product roadmap."
      whyItMatters: "Without these records, public evidence cannot establish scalability, reliability, integration depth, support quality, or whether funding translates into product delivery."
      diligencePath: "Request an engineering architecture review, twelve months of availability and incident data, integration documentation, release history, support KPIs, and the board-approved product roadmap."
      relatedQuestionRefs:
        - "QE005"
    - type: "private-evidence-only"
      severity: "material"
      topic: "security-controls"
      missingEvidence: "Incident root cause, affected-user count, forensic scope, remediation plan, independent control testing, retention rules, and detection telemetry for the 2025 breach."
      whyItMatters: "The disclosed incident establishes unauthorized access but does not show whether the vulnerable path was fully remediated or whether detection coverage is now effective."
      diligencePath: "Obtain the incident report, penetration-test results, access-control design, audit-log coverage, remediation evidence, and any regulator or customer notifications under NDA."
      relatedQuestionRefs:
        - "QE007"
