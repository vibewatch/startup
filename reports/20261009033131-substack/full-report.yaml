              - CU003
              - CU012
              - CU013
      - number: '6.3'
        title: 'Commercial Deployment Proof: B2B Adopters and Independent Publishers'
        blocks:
          - type: paragraph
            body: >-
              While individual newsletters form Substack's ideological core, third-party web crawlers identified 9,600
              live domains running Substack publications in late 2026, including 5,541 custom domains and 2,727 matched
              corporate organizations. Enterprise software providers including Gainsight Inc. publish customer-success
              newsletters such as [Un]Churned via unchurned.gainsight.com, dbt Labs publishes its Analytics Engineering
              Roundup at roundup.getdbt.com, and political organizations such as the Democratic National Committee
              operate The Blue Print at blueprint.democrats.org. Simultaneously, consumer brands including Shopify,
              Walmart, and Rare Beauty maintain branded Substacks or sponsor top newsletters, validating the platform's
              utility as a high-trust customer communication asset.
            claimRefs:
              - CU009
              - CU010
              - CU011
          - type: table
            tableRef: TU003
            claimRefs:
              - CU009
              - CU010
              - CU011
      - number: '6.4'
        title: Retention Dynamics, Platform Expansion Loops, and Creator Friction
        blocks:
          - type: paragraph
            body: >-
              Substack's customer retention and organic expansion rely heavily on its proprietary Recommendation Network
              and Substack Notes feed, which drive substantial discovery and conversion without paid external marketing.
              However, commercial durability faces distinct headwinds. Top-tier creators generating six-figure and
              seven-figure annual billings face steep platform fee drag under Substack's 10% take-rate model relative to
              flat-fee open-source alternatives such as Ghost. Revenue concentration remains elevated, with the top 10
              publications alone generating over $40 million in gross annual billings. Additionally, historical creator
              advance subsidies under Substack Pro created elevated operational cash burn and publisher friction,
              forcing Substack to experiment with native opt-in newsletter sponsorship rails in late 2025 to capture
              off-platform brand budgets.
            claimRefs:
              - CU012
              - CU013
              - CU014
              - CU015
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The 10% Marketing Tax Trade-Off
            body: >-
              Substack's 10% platform take rate is accepted by emerging and mid-tier writers because the Recommendation
              Network and Notes social layer drive upwards of 20% to 50% of new subscriber conversions. However, for
              elite creators generating over $1 million annually, the take rate functions as an expensive fee drag that
              incentivizes self-hosted migration unless offset by proprietary network discovery.
            calloutType: insight
            claimRefs:
              - CU003
              - CU013
          - type: callout
            title: Publisher Revenue Concentration and Platform Burn
            body: >-
              With the top 10 creators driving over $40 million in gross subscriber revenue, Substack's enterprise
              revenue remains concentrated in an elite cadre of high-profile authors. Historical reliance on Substack
              Pro advances increased company burn rates in lean macroeconomic periods, highlighting vulnerability to
              creator defection.
            calloutType: risk
            claimRefs:
              - CU014
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Security, privacy, and legal exposure
        blocks:
          - type: paragraph
            body: >
              TechCrunch reported that an unauthorized third party accessed Substack account email addresses, phone
              numbers, and internal metadata in October 2025, while Substack identified the issue in February 2026. The
              company said payment-card data, passwords, and other financial information were unaffected, that the
              problem was fixed, and that an investigation began. Those statements narrow the known data categories but
              do not quantify affected users, identify the technical cause, or explain what logs supported the claim
              that misuse had not been observed. The detection interval and disclosure gaps therefore make privacy
              response the highest-priority diligence item. The assigned pool contains no regulator filing, court
              record, enforcement notice, or primary policy document, so this chapter does not assert that litigation or
              enforcement occurred. The legal register is explicitly a sample of evidenced issues and open paths, not an
              exhaustive docket search.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
