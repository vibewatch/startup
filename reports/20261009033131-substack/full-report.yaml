  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Key Operating Assumptions
      - Valuation & Multiple Logic
      - Implied Valuation Range
      - Downside / Key Risks
      - Probability Signal
    rows:
      - - Bull Case
        - Video adoption surges; paid subs reach 8M; ARR expands to $100M+ with lower churn
        - 18x forward ARR multiple supported by premium creator network moat and IPO readiness
        - $1.8B - $2.0B
        - Hosting infrastructure costs outpace take-rate revenue; competitor feature parity
        - Low to Moderate (~20%)
      - - Base Case
        - Steady 20-25% subscriber growth; ARR reaches $65M; 50% churn persists; breakeven cash flow
        - 13x - 15x ARR multiple reflecting healthy creator platform growth with SaaS multiple discount
        - $850M - $1.0B
        - Macro subscription fatigue; creator defection; secondary market price contraction
        - High (~55%)
      - - Bear Case
        - Top creators defect to Ghost/beehiiv; ARR stalls near $50M; breach remediation escalates
        - 9x - 11x ARR multiple reflecting slowing media model and elevated platform risk
        - $450M - $550M
        - Down-round financing required; liquidation preference overhang impairs common equity
        - Moderate (~25%)
    notes: >-
      Scenario valuations assume Substack's 10% platform take rate applied to gross subscription volume under varying
      retention and multiple regimes.
