              - CO011
              - CO012
      - number: '1.4'
        title: Platform Milestones and Adverse Risk Profile
        blocks:
          - type: paragraph
            body: >-
              The evolution of Substack spans key transitions from initial text newsletter delivery to a multimedia
              network encompassing podcasting, mobile discovery feeds via Notes, and dedicated television applications
              launched in early 2026. However, rapid network scaling has introduced operational and governance
              frictions. In February 2026, Substack confirmed a data security breach originating from an October 2025
              compromise that exposed internal metadata, user email addresses, and phone numbers. Concurrently,
              persistent public controversies regarding hands-off content moderation—including renewed criticism in
              February 2026 over monetized extremist and antisemitic publications—pose reputational and advertiser
              friction as Substack expands into native advertising and brand sponsorships.
            claimRefs:
              - CO014
              - CO015
              - CO016
      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Reputational and Security Governance Vulnerabilities
            body: >-
              The disclosure of an October 2025 data breach in February 2026, which exposed subscriber contact records,
              underscores infrastructure and security risks that directly challenge reader trust. Combined with ongoing
              backlash over platform content moderation stances, institutional diligence requires rigorous verification
              of subscriber retention durability and potential platform liability.
            calloutType: risk
            claimRefs:
              - CO015
              - CO016
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Direct Scope, and Adjacency Structure
        blocks:
          - type: paragraph
            body: >-
              Substack's addressable opportunity sits at the intersection of independent digital publishing,
              creator-economy subscription billing, and emerging direct-to-consumer brand sponsorship channels [CM001].
              The core serviceable market comprises creator-owned newsletters, serialized publications, audio podcasts,
              and direct paid memberships where readers pay recurring fees to access exclusive analysis, community
              discussion, and media [CM002, CM003]. Under this core definition, included spend spans direct consumer
              recurring subscription fees (of which Substack takes a 10% platform take rate) and creator-native brand
              sponsorships negotiated for editorial placements [CM003, CM004]. Conversely, excluded spend covers
              high-volume programmatic ad networks, legacy print distribution logistics, enterprise content management
              software suites, and commodity broadcast email infrastructure where relationship ownership is decoupled
              from the content creator [CM001, CM005]. Key adjacent categories include creator marketing agencies and
              social media management platforms, which interface with Substack's creator base as brands shift marketing
              allocations toward trusted niche voices [CM006, CM001].
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: 'Addressable Market Sizing: Total, Serviceable, and Platform-Captured Volume'
        blocks:
          - type: paragraph
            body: >-
              Evaluating Substack's growth runway requires triangulating three distinct market sizing layers rather than
              relying on an undifferentiated macro projection [CM008]. At the broadest total addressable layer, the
              global social media management market reached $32.48 billion in 2025 and is projected to expand from
              $39.14 billion in 2026 to $164.52 billion by 2034, registering a 19.70% CAGR [CM008]. Within the creator
              economy specifically, global creator economic activity is valued at £255 billion in 2026 with a trajectory
              toward £645 billion by 2030, supported by U.S. creator economy advertising expenditure forecast to reach
              £32.9 billion in 2026 [CM009]. At the serviceable addressable boundary, brand spending on direct
              partnerships beyond social media feeds is expanding by 56% in 2026, creating an immediate tailwind for
              Substack's native sponsorship beta and creator collaborations [CM009]. Within Substack's immediate
              platform-captured domain, over 50,000 monetized publications and more than 5 million paid subscriptions
              generate an estimated £337 million ($440 million equivalent) in annual creator subscription gross
              merchandise value, from which Substack extracts its 10% software platform fee [CM003, CM010, CM011].
              However, addressable market expansion is disciplined by extreme power laws where the top 10 publications
              generate over £30 million annually, leaving long-tail monetization heavily dependent on self-serve
              customer conversion [CM003, CM012].
            claimRefs:
              - CM003
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM008
              - CM009
              - CM010
              - CM011
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
