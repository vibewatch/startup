      - number: '7.2'
        title: Operational resilience and control maturity
        blocks:
          - type: paragraph
            body: >
              The retained evidence does not disclose Substack's redundancy, incident-response objectives, backup tests,
              payment reconciliation controls, or external security assurance. Independent technical essays in the
              assigned pool provide a useful control framework rather than proof of Substack's implementation:
              dependency failures and bad deploys should be treated as normal conditions; reliable execution requires
              recoverability and reconstructable evidence; and durable workflows can add a distributed coordination
              system that must itself be operated. A separate essay argues that the generator should not be its own sole
              validator. Applied to Substack, these principles support diligence tests for isolation, rollback,
              idempotency, auditable state, and independent verification, but they cannot establish that any control is
              absent or present. Residual ratings below are consequently qualitative and should be replaced with
              measured recovery, detection, and reconciliation results.
            claimRefs:
              - CR001
              - CR005
              - CR006
              - CR009
              - CR010
