  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Stance
      - Core Argument
      - Supporting Evidence
      - Vulnerability / Counter-Argument
      - What Would Change The View
    rows:
      - - Thesis
        - Creator Network Effects & Direct Monetization Scale
        - Over 5M paid subscriptions, 50k earning publications, $40M top-10 author earnings
        - Flat 10% fee penalizes high-earning writers, incentivizing self-hosted migration
        - Demonstrated multi-year creator cohort expansion and reduced churn below 30%
      - - Thesis
        - Multimedia Expansion Diversifies Addressable Market
        - March 2026 video studio launch yields 50% faster creator revenue growth
        - Heavy hosting, transcoding, and CDN costs threaten unverified gross margins
        - Audited proof that multimedia features generate accretive gross margin contributions
      - - Anti-Thesis
        - High Subscriber Churn Creates Replacement Treadmill
        - Independent research documents ~50% annual paid subscription churn rate
        - Substack Notes and in-app discovery generated 32M new subscribers in 3 months
        - Sustained net revenue retention above 115% across mature publication cohorts
      - - Anti-Thesis
        - Premium Multiple Disconnect from Fundamental Financials
        - $1.1B valuation implies >18x ARR while public peers trade at 4x-8x revenue
        - Unique cultural cachet and strategic investment from BOND, TCG, and prominent angels
        - Accelerating top-line revenue growth exceeding 60% YoY with audited positive cash flow
    notes: >-
      Thesis and anti-thesis points reflect platform scale statistics, multimedia product rollouts, and third-party
      churn benchmarks.
