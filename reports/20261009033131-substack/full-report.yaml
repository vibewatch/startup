      - number: '1.3'
        title: Capitalization History and Stakeholder Mapping
        blocks:
          - type: paragraph
            body: >-
              Substack has accumulated more than $185M to $200M in lifetime capital commitments across five primary
              institutional rounds and an innovative community crowdfunding campaign. Following its 2018 seed round,
              Andreessen Horowitz led its Series A ($15.3M) and Series B ($65M at a $650M valuation in 2021). Amid the
              2022-2023 tech market valuation reset, Substack conducted a Wefunder community round in spring 2023,
              raising $5M-$8M at a discounted $585M valuation from writers and retail supporters. Valuation rebounded
              sharply in July 2025 when BOND and The Chernin Group co-led a $100M Series C financing, elevating Substack
              to a post-money valuation of $1.1B. Strategic individual investors in Series C include Rich Paul and Jens
              Grede. Full cap table details, liquidation preference seniority, and option pool allocations remain
              private.
            claimRefs:
