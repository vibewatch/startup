chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity and Business Model
        blocks:
          - type: paragraph
            body: >-
              Substack was founded in 2017 by Chris Best, Hamish McKenzie, and Jairaj Sethi as a creator-first digital
              publishing platform headquartered in San Francisco, California. The company's core economic architecture
              centers on direct relationships between writers and opt-in readers, distributing newsletters, audio, and
              video directly to inboxes and apps without algorithmic feed mediation. Substack operates a platform
              take-rate monetization model: it extracts a 10% cut of gross paid subscription revenue, with external
              payment processor Stripe deducting standard transaction fees, allowing creators to keep the remainder.
              Across its global network, platform scale has expanded beyond 5 million paid subscriptions, supporting
              nearly 100,000 monetizing publications globally by early 2026. However, company-level audited revenue,
              GAAP profitability, and creator concentration metrics remain undisclosed private data, necessitating
              disciplined separation between reported platform scale indicators and unverified aggregate company
              financials.
