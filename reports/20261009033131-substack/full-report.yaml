    title: Recommendation summary table
    columns:
      - Evaluation Dimension
      - Analytical Finding
      - Underlying Evidence Base
      - Risk Assessment
      - Decision Implication
    rows:
      - - Recommendation
        - Research-More
        - Over 5M paid subscriptions, $100M Series C, but unaudited financials and heavy churn
        - High operational risk from unverified margins and defection
        - Defer capital deployment until audited financial statements and cohort curves are inspected
      - - Valuation Stance
        - Expensive
