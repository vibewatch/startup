      - number: '5.2'
        title: Evidence-Bounded Operating Model
        blocks:
          - type: paragraph
            body: >-
              The retained sources reveal customer-facing layers rather than Substack's production architecture.
              Publication pages expose creator content and subscriber entry points; the technology directory exposes a
              curated discovery surface; paid-series copy demonstrates entitlement gating; and third-party reporting
              describes custom domains, subscriber-list export, Notes, and multiple media formats. Practitioner
              publications provide a useful developer-signal proxy because technical professionals actively use the
              platform, but they are customer-issued content, not Substack engineering documentation. No retained source
              identifies cloud vendors, databases, service boundaries, deployment topology, public APIs, webhooks,
              uptime objectives, incident history, or quality-assurance controls. The architecture exhibit therefore
              maps verified experience layers and marks implementation as unknown instead of presenting a speculative
              software stack.
            claimRefs:
              - CE002
              - CE003
              - CE005
              - CE006
              - CE007
              - CE012
              - CE013
