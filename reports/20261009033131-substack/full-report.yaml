      - number: '1.2'
        title: Leadership, Founders, and Board Governance
        blocks:
          - type: paragraph
            body: >-
              Substack is led by its three primary co-founders: Chief Executive Officer Chris Best (previously
              co-founder and chief executive of messaging application Kik), Chief Writing Officer Hamish McKenzie (who
              oversees editorial communications and creator advocacy), and Chief Technology Officer Jairaj Sethi (who
              directs technical architecture and infrastructure). Board governance reflects major institutional
              financing leads, featuring Andrew Chen of Andreessen Horowitz and Mood Rowghani of BOND alongside the
              executive founders. Although aggregators occasionally list third-party contributors, institutional control
              and voting governance remain concentrated among the co-founding trio and tier-one venture sponsors.
              Individual founder equity percentages, formal succession plans, and broader executive bench details have
              never been publicly disclosed, creating notable key-person dependence upon the initial leadership group.
            claimRefs:
              - CO001
