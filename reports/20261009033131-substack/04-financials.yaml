callouts:
  - calloutType: "risk"
    title: "Platform Rent Squeeze and Large-Creator Churn Vulnerability"
    body: "Substack's flat 10% revenue-share model creates structural churn pressure as publications scale. While zero upfront software cost attracts emerging creators, an established publisher generating $100,000 monthly pays $10,000 in monthly platform fees ($120,000 annually) to Substack, in addition to Stripe processing. Because self-hosted alternatives and flat-fee platforms like beehiiv or Ghost charge fixed SaaS fees ($80–$250/month), Substack risks adverse selection where its highest-earning, margin-generating creators migrate off-platform once their subscriber base stabilizes."
    claimRefs:
      - "CI001"
      - "CI003"
      - "CI004"
      - "CI008"
