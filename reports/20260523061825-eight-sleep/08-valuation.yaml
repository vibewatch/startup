- id: exit-readiness-and-diligence-asks
  title: Exit readiness, diligence asks, and thesis-break triggers
  body: 'Eight Sleep is not public-market ready on the evidence package available today. Unlike every public comparable used in this chapter, the company does not publish an annual report, segment mix, or retention pack. That makes the next diligence step obvious. Investors need a revenue bridge that separates hardware, membership, accessories, and any enterprise or medical pilots; cohort-level membership retention and attach-rate data; and a cap-table view showing liquidation preferences, participation rights, and anti-dilution terms left behind by the 2021, 2025, and 2026 rounds. The regulatory story also needs to move from ambition to documentation: management says it is pursuing FDA filings for sleep-apnea detection and mitigation, but public evidence does not show clearance. The investment thesis should break if the next financing is flat to down, if churn reveals the membership is more nuisance than moat, if AI-health features continue to erode trust, or if the regulatory path stalls
    long enough that the market re-rates Eight Sleep back toward premium-hardware rather than health-platform comps. Until those asks are cleared, the company remains interesting, but not yet cleanly underwritten above track. '
