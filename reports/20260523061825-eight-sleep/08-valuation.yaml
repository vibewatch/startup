- id: financing-context-and-comparable-lens
  title: Financing context, comp framing, and entry discipline
  body: 'Eight Sleep now has two late-stage price anchors: a 2025 $100M round that management said doubled valuation from the 2021 $500M Series C base, and a March 2026 strategic round explicitly priced at $1.5B. That is a real mark, but it is still a negotiated private round rather than transparent public price discovery. Public comps are instructive precisely because they force disclosure. Sleep Number and Peloton show what connected-hardware narratives look like after growth disappointment and multiple compression. Somnigroup shows what a scaled premium sleep-products platform commands without a recurring software narrative. ResMed and DexCom show what investors will pay for health-data businesses with strong margins, recurring monitoring logic, and public financial disclosure. Against that set, Eight Sleep needs a disclosure discount. If annual revenue were only around $150M, the round implies roughly 10x sales; if revenue were closer to $300M, the implied multiple falls toward 5x and
    becomes more defensible. Because public sources do not reveal the actual revenue base, disciplined entry should require a bridge from hardware sell-through and membership revenue to current annualized revenue, plus evidence that the subscription layer is meaningful enough to keep Eight Sleep out of the Sleep Number/Peloton comp bucket.'
