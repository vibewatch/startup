  evidenceGaps:
  - type: stale
    severity: material
    topic: regulatory-upside
    missingEvidence: FDA filing identifiers, study endpoints, and current status for sleep-apnea detection and mitigation.
    whyItMatters: Medical optionality is part of the premium narrative, but the public record here only shows pursuit, not clearance or documented milestone progress.
    diligencePath: Request regulatory workplan, filing receipts, and external regulatory counsel memo.
    relatedQuestionRefs:
    - QV010
  - type: private-evidence-only
    severity: blocking
    topic: cap-table-overhang
    missingEvidence: Fully diluted cap table, liquidation preferences, participation rights, and anti-dilution terms across all major rounds.
    whyItMatters: A private-round valuation does not map cleanly to common-equity returns without the waterfall and preference stack.
    diligencePath: Obtain cap table export and counsel-prepared waterfall scenarios before underwriting the entry price.
    relatedQuestionRefs:
    - QV026
  - type: private-evidence-only
    severity: material
    topic: membership-retention
    missingEvidence: Cohort retention, attach-rate, downgrade, and churn data for the paid membership base.
    whyItMatters: The recurring-revenue thesis depends on the subscription being a durable moat rather than customer friction.
    diligencePath: Request cohort dashboard and monthly retention tables segmented by product generation.
    relatedQuestionRefs:
    - QV027
  - type: private-evidence-only
    severity: material
    topic: gross-profit-mix
    missingEvidence: Gross margin split across hardware, membership, accessories, and any enterprise or medical revenue.
    whyItMatters: Valuation depends on whether Eight Sleep deserves a hardware multiple, a premium consumer-tech multiple, or a health-platform premium.
    diligencePath: Request product P&L bridge and unit-economics model with contribution margin by line.
    relatedQuestionRefs:
    - QV028
  - type: enumeration-incomplete
    severity: minor
    topic: comparable valuation table coverage
    missingEvidence: A fuller set of private secondaries, M&A clears, and truly like-for-like sleep-tech exits.
    whyItMatters: The public comp table is useful but still imperfect because no listed company matches Eight Sleep exactly.
    diligencePath: Add private-market clearing data and recent sleep or connected-wellness transactions if available.
    relatedTableRefs:
    - TV004
