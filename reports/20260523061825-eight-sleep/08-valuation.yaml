company:
  name: Eight Sleep
chapter:
  number: 8
  title: Valuation
  summary: 'Eight Sleep''s March 2026 $50M strategic round fixed a real price anchor at a $1.5B valuation, but public evidence still leaves the denominator problem unsolved: the company discloses free-cash-flow positivity, 34+ countries served, and more than $500M of cumulative Pod sales, yet not annual revenue, ARR, gross margin mix, or retention. Public comparables span distressed connected hardware and mattress players at roughly 0.7x-2.7x EV/sales to sleep and sensor-led medical platforms at roughly 5.3x-5.6x, implying the current mark is only comfortably supported if Eight Sleep is already much closer to medtech-quality recurring economics than public evidence proves. The recommendation is track with low confidence, high risk, and a stretched valuation stance until diligence closes revenue-quality, membership-retention, and preference-stack gaps.'
sections:
- id: recommendation-thesis-and-anti-thesis
  title: Recommendation, investment thesis, and anti-thesis
  body: 'The core valuation question is not whether Eight Sleep is an interesting company, but whether the March 2026 $1.5B price is justified on public evidence. The thesis has real support. Eight Sleep has raised fresh capital twice in seven months, was free-cash-flow positive in 2025, ships to more than 34 countries, and has built a premium hardware-plus-subscription sleep platform with differentiated cooling, snore mitigation, and biometric data collection. The anti-thesis is that these proof points still stop short of a public-grade underwriting package. The company has not disclosed annual revenue, ARR, churn, gross-margin mix, or the preference stack embedded in prior rounds. Product trust is also not clean: the Verge documented factually wrong AI guidance and gamified sleep features that could weaken consumer trust exactly as Eight Sleep tries to expand from consumer wellness into predictive health. At $1.5B, the right stance is therefore price-sensitive rather than narrative-sensitive:
    track the company, but do not treat the round mark as obviously attractive until deeper diligence proves that recurring economics and brand durability warrant a premium to public sleep-hardware comps.'
