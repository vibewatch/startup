tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Current read
  - Evidence basis
  - Decision implication
  rows:
  - - Recommendation
    - Track
    - Known private price, but undisclosed annual revenue, ARR, churn, and cap-table terms keep underwriting incomplete.
    - Keep company active in pipeline but do not treat the March 2026 mark as a must-own entry.
  - - Confidence
    - Low
    - Public evidence confirms financing and product momentum, but not the revenue-quality denominator that converts narrative into value.
    - Require deeper diligence before converting interest into conviction.
  - - Risk rating
    - High
    - Premium hardware, mandatory subscription, AI-feature trust risk, and unproven regulatory upside increase downside dispersion.
    - Underwrite with downside protection, not premium-growth optimism.
  - - Valuation stance
    - Stretched
    - At $1.5B, implied sales multiples remain rich unless current revenue is already near upper assumption bands and recurring economics are unusually strong.
    - Avoid paying above the March 2026 mark without private revenue and margin proof.
  - - Entry discipline
    - Prefer at or below current mark after diligence
    - Current round can be acceptable only if diligence proves strong membership retention, healthy gross profit mix, and manageable preferences.
    - Seek information rights, downside protections, and valuation discipline rather than speed.
  - - Upgrade trigger
    - Public-grade disclosure package
    - Need revenue bridge, cohort retention, gross-margin split, and cap-table waterfall before moving from track toward buy.
    - Without those items, upside is too assumption-heavy.
  notes: This table is judgmental because the recommendation depends on what is not yet disclosed as much as on what is disclosed.
