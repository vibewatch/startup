- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Key assumptions
  - Valuation range
  - Return logic vs. $1.5B entry
  - Probability signal
  - Downside trigger
  rows:
  - - Bear
    - Hardware remains the main value driver; membership retention disappoints; AI trust issues persist; FDA path stalls.
    - $0.6B-$1.0B
    - Capital impairment if new money or exit buyers price Eight Sleep closer to Peloton / Sleep Number style connected-hardware multiples.
    - 25%
    - Down round, poor retention, or regulatory slippage
  - - Base
    - FCF discipline holds; revenue base reaches roughly $220M-$300M-equivalent; subscription layer proves sticky enough for modest premium valuation.
    - $1.1B-$1.7B
    - Current round is roughly fair to slightly rich, with only modest upside until economics become more transparent.
    - 50%
    - Growth slows before recurring-margin proof appears
  - - Bull
    - Predictive AI materially improves retention; FDA path opens regulated-health channel; software-like gross profit share rises; global scale sustains growth.
    - $1.8B-$2.6B
    - Meaningful upside exists, but only if Eight Sleep earns a partial bridge toward sleep-health medtech multiples.
    - 25%
    - Medical path fails or premium hardware demand normalizes
  notes: Ranges are author-derived valuation brackets anchored on the disclosed $1.5B round and public comp bands rather than on a disclosed current revenue figure.
