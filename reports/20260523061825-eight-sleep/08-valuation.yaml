    - ~1.26x EV/sales
    - Best hardware-plus-subscription cautionary comp
    - Post-COVID reset and content model differ from sleep category
  - - Somnigroup (Tempur Sealy)
    - May 2026 market data / TTM
    - Market cap $14.07B; EV $20.49B
    - $7.67B TTM revenue
    - ~2.67x EV/sales
    - Premium sleep-products and mattress incumbent baseline
    - No meaningful recurring software or health-data layer
  - - ResMed
    - May 2026 market data / TTM
    - Market cap $30.18B; EV $29.36B
    - $5.54B TTM revenue
    - ~5.30x EV/sales
    - Sleep-focused health-technology ceiling with strong margins
    - Regulated, reimbursed model is more proven than Eight Sleep
  - - DexCom
    - May 2026 market data / TTM
    - Market cap $27.82B; EV $26.79B
    - $4.82B TTM revenue
    - ~5.56x EV/sales
    - Premium sensor and data-platform ceiling for health monitoring
    - Diabetes CGM economics are not directly comparable to consumer sleep hardware
  - - Eight Sleep March 2026 round
    - Primary private round
    - Valuation $1.5B
    - Current annual revenue not publicly disclosed
    - Implied multiple ranges from 15x at $100M revenue to 5x at $300M revenue
    - Actual current price investors paid
    - Private round lacks the disclosure quality of every public comp above
