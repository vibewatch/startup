- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold or event
  - Transmission to thesis
  - Action implication
  rows:
  - - Flat or down round
    - Next primary financing at or below $1.5B
    - Signals growth narrative or investor appetite has weakened materially.
    - Re-rate toward bear case and pause any premium entry.
  - - Membership weakness
    - Material churn, low attach rates, or frequent downgrades once disclosed
    - Collapses the recurring-revenue and switching-cost part of the thesis.
    - Move comp lens closer to premium hardware rather than software-enabled health.
  - - AI trust failure
    - Repeat episodes of unsafe advice, intrusive gamification, or elevated customer backlash
    - Undermines brand credibility just as Eight Sleep tries to sell predictive health.
    - Discount monetization assumptions and demand product-governance proof.
  - - Regulatory delay
    - FDA path slips materially without visible filing progress
    - Removes the biggest bridge toward health-tech premium multiples.
    - Treat regulated-health upside as out of scope for valuation.
  - - Margin disappointment
    - Hardware-heavy gross profit mix or weak contribution margin once disclosed
    - Prevents public-comp bridge to higher-quality medtech names.
    - Cap value closer to Somnigroup or Peloton-style bands.
  - - Operational stumble
    - Service, outage, or supply-chain issues materially hurt premium brand perception
    - Weakens willingness to pay at Eight Sleep’s premium price points.
    - Tighten downside case and customer-acquisition assumptions.
  notes: These are monitorable kill triggers intended for investment committee use, not generic operating risks.
