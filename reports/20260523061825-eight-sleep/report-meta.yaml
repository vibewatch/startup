companyProfile:
  summary: >-
    Eight Sleep is a sleep-fitness company founded in 2014 in San Francisco and now headquartered
    in New York City. Its core product line is the Pod smart sleep system: a mattress-cover-based
    platform with active hydro temperature regulation, biometric sensing, and AI-driven Autopilot
    adjustments sold direct to consumers through a hardware-plus-subscription model. The company
    has used recent capital to expand globally, launch Pod 5 and adjacent sleep accessories, and
    position the platform as both a premium consumer product and a longer-term AI-health business.
    Public financing anchors are real and recent, but public-company-grade financial disclosure is
    still absent.
