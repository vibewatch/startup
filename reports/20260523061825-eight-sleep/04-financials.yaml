    {
      "id": "capital-adequacy-and-funding-dependence",
      "title": "Recent funding and the 2025 cash-flow claim improve the capital story, but public liquidity is still unknown",
      "body": "The strongest public capital signal is recent fundraising, not balance-sheet disclosure. TechCrunch and Business Wire describe a $50 million strategic round in March 2026 at a $1.5 billion valuation, following a $100 million Series D in August 2025 and an $86 million Series C in 2021. Public use-of-funds messaging is also directionally constructive: management says capital will be deployed into predictive-model R&D, clinical and regulatory pathways, and global partnerships, and multiple sources say the business turned free-cash-flow positive in 2025. That combination suggests financing dependence has fallen from the classic venture-burn case. But investors still cannot see the core liquidity bridge. Public databases disagree on total capital raised, headcount, and even current revenue scale. More importantly, none of the retained sources provides cash on hand, runway months, debt obligations, gross margin, or covenant detail. So while Eight Sleep no longer looks obviously capital-starved, public evidence still supports only a cautious conclusion: capital adequacy appears improved, but not verifiable enough to underwrite without management data-room access.",
