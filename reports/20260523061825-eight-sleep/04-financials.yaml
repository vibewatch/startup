    {
      "id": "traction-and-unit-economics-proxies",
      "title": "Public traction and unit-economics proxies are real, but they stop short of a margin model",
      "body": "Eight Sleep has enough public operating signal to show that it is not a niche pre-revenue project, but not enough to let an investor underwrite the margin stack. Official and third-party sources point to meaningful adoption and data scale: current official pages highlight more than thirty thousand reviews, while Business Wire and Sleep Review cite more than one billion hours of sleep data from users across more than thirty-five countries. Older Craft operating metrics also show that the company has long disclosed usage-style milestones such as customers, tracked nights, and data volume. Those signals support the idea that recurring analytics and algorithm improvement can matter economically, especially because the company cites server, data-storage, and R&D expense as reasons for the membership model. Still, the unit-economics bridge remains incomplete. Public sources offer no gross margin, contribution margin, refund rate, warranty reserve, CAC, or payback disclosure. The best current view is therefore a high-AOV consumer hardware business with software-like recurring elements and non-trivial support, cloud, and replacement-cost obligations.",
