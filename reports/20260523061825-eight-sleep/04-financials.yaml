  "chapter": {
    "number": 4,
    "title": "Financials",
    "summary": "Eight Sleep\u2019s public financial picture supports a premium hardware-plus-subscription model with unusually visible price surfaces, strong recent funding, and a company-claimed free-cash-flow inflection in 2025. But core underwriting inputs remain opaque: public sources conflict on revenue, funding totals, and headcount, while no retained source discloses cash, burn, debt, gross margin, or sales-efficiency metrics. The chapter verdict is therefore that revenue quality is directionally better than a one-time mattress sale, yet still not investable without internal financial disclosure."
  },
  "sections": [
    {
      "id": "revenue-model-and-price-surface",
      "title": "Revenue model and price surface show a premium hardware sale wrapped in recurring software economics",
      "body": "Eight Sleep\u2019s public monetization surface is clearer than its financial statements. The company sells a premium Pod system directly through its own site, then layers Autopilot software and analytics on top of the hardware sale. Official pages describe the Pod as a high-ticket, temperature-regulating system, while the Standard Autopilot page explicitly lists a recurring $15-per-month annualized membership for two users and ties key functionality to ongoing software access. Financing and return policies matter here because this is not an impulse purchase: Eight Sleep advertises 0% APR options, a queen Cover example at $3,049, and a 30-day return window with prepaid labels. The economic read-through is mixed but useful. On the positive side, the model has both upfront hardware revenue and renewable software revenue. On the cautionary side, realized ASP, discounting, subscription attach, churn, and financing-partner economics are not disclosed, so public pricing is still list-surface evidence rather than proof of realized revenue quality.",
