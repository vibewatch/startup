    {
      "id": "financial-verdict-and-diligence-blockers",
      "title": "The financial verdict is promising on monetization architecture but still blocked on core underwriting data",
      "body": "The adverse lens on Eight Sleep is not visible distress; it is opacity paired with ownership-risk friction. Independent reviewers consistently argue that the product can work well for temperature-driven sleep problems, yet they also highlight the uncomfortable economics of a premium upfront price, mandatory or strongly encouraged subscription spend, and cloud dependence. TechCrunch\u2019s account of the October 2025 AWS outage sharpens that concern because it shows how service interruptions can become product-performance incidents for a connected bed. At the same time, public market-data pages disagree materially on funding totals, employee count, and revenue scale. That means the investor is being asked to accept a premium valuation and a hardware-plus-subscription story without the normal supporting bridge of ASP realization, subscription attach, churn, gross margin, warranty reserve, CAC, payback, cash, burn, and debt. The financial verdict is therefore conditional. Revenue quality is likely better than a one-time gadget sale, but the missing private metrics are still substantial enough to block a serious underwriting recommendation.",
