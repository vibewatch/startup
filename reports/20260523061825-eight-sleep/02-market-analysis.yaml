  - id: market-sizing-lenses
    title: "Market Sizing: Multiple Lenses and Contradictory Estimates"
    body: >
      No single market estimate reliably bounds Eight Sleep's addressable opportunity. Analyst scope
      definitions vary by 2x to 10x — a gap far too large to paper over with a midpoint. Diligence
      should preserve the full spread and stress-test each frame's implications for valuation.

      In the smart mattress segment, Global Market Insights (January 2026) is the most current
      narrow-scope estimate: $1.87B globally in 2026, growing to $3.34B by 2035 at 6.6% CAGR. The
      Business Research Company's parallel report puts 2026 closer to $2.5B. The divergence reflects
      different inclusions for hospitality (hotel/hospital smart beds) and differing revenue vs.
      shipment-value methodologies. Neither can be reconciled without methodology transparency not
      publicly available.

      In the broader sleep-tech devices frame, three 2026 estimates cluster around $27–32B globally.
      Research Nester projects $30.74B (CAGR 15.5% through 2035); Global Market Insights corroborates
      with $32B+; SNS Insider (April 2026 press release) places the 2025 base at $31.35B. The US
      sub-market alone is projected at $9.29B in 2025 (SNS Insider). The SleepTech 2026 Strategic
      Overview (healthcare.digital) synthesizes these as confirming a 2026 size exceeding $30B. Eight
      Sleep competes in the non-wearable sub-segment of this market, which accounted for 42.7% of
      revenue and is expected to grow fastest.

      The sleep apnea medical device market ($8.66B–$10B globally in 2026 per GMI and Research and
      Markets) is a distinct but adjacent opportunity Eight Sleep is pursuing through FDA Class II
      clearance for sleep apnea detection. If cleared, this would open a clinical reimbursement channel
      that is today inaccessible; however, the timeline and probability of clearance are not confirmed.
      The US sub-market for sleep apnea devices is projected at $3.11B (MarketsandMarkets 2026).

      The premium/luxury mattress global market is estimated at $18.7B in 2026 by Technavio and
      MarkWide Research, while the overall US mattress market (all tiers) is projected at $18.95B
      (MattressNut, April 2026 citing Market Data Forecast). Specialty mattresses average $2,167
      per NapLab; Eight Sleep Pod 5 (cover + hub) starts at $2,849, positioning it in the top price
      tier. However, Eight Sleep hardware is a mattress enhancement, not a mattress replacement,
      which limits its head-to-head overlap with Tempur Sealy ($4.89B 2024 revenue) and Sleep Number
      ($1.68B 2024 revenue, down 11% YoY).

      The menopause wellness market — a specific adjacent segment where Eight Sleep's active temperature
      control addresses night sweats — is valued at $18.74B globally in 2026 (Business Research Insights)
      with a CAGR of 10.3% through 2035. No primary source quantifies what fraction is addressable
      by sleep hardware, but the menopause care devices segment (wearables and hardware) is projected
      at $2.3B–$3.15B (2025–2032, CAGR 4.6%).
