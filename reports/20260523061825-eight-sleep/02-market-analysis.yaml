  - id: market-constraints
    title: Market Constraints and Structural Risks
    body: >
      Five structural constraints limit Eight Sleep's addressable market, conversion rate, and retention,
      and at least two — data privacy and subscription fatigue — are potentially adversarial to brand trust.

      The mattress replacement cycle is the most fundamental constraint. Consumers replace mattresses
      every 7–10 years (expected 9.6 years per Sleep Savvy consumer research), and the US mattress
      market in 2026 is shipping approximately 30 million units annually versus a normalized demand
      of 34–35 million, reflecting macroeconomic and housing-market headwinds. The US market grew only
      3.73% CAGR in nominal terms and contracted in real terms. Eight Sleep partially sidesteps this
      constraint because the Pod cover sits atop an existing mattress, but the household's overall
      bedding budget is bounded, and consumers who recently purchased a new mattress are less likely
      to also purchase a $2,849–$6,099 smart cover.

      Subscription fatigue is an acute consumer-level risk. In 2026, 47% of US consumers canceled
      at least one subscription, and the average household perceives its subscription costs at 2.5x
      the actual spend — a signal of budget surprise and latent dissatisfaction (readless.app, 2026).
      Eight Sleep introduced a mandatory subscription in February 2023, retroactively restricting
      features for existing Pod owners. This policy generated sustained community backlash documented
      across Reddit and review platforms and represents a potential churn risk for the recurring
      revenue that underpins Eight Sleep's valuation.

      Data privacy and trust risk are structurally material. Eight Sleep's biometric sleep data
      (heart rate, HRV, respiratory rate, movement) is transmitted to company servers and, per the
      privacy policy, may be shared with third-party analytics and marketing partners. Eight Sleep's
      CEO publicly used aggregated user sleep data to comment on public events — documented by
      404 Media in 2023 — demonstrating that the company views this data as a business asset.
      Under GDPR, sleep data is sensitive health data requiring explicit, granular consent; EU expansion
      brings GDPR compliance costs and potential enforcement exposure. Consumer trust in biometric
      data monetization is declining across the industry.

      Consumer skepticism about health claims is growing. Eight Sleep's clinical claims (up to 44%
      faster sleep onset, 34% more deep sleep) are company-reported and not independently peer-reviewed.
      Regulatory scrutiny of health tech marketing claims has increased post-pandemic, and the
      FTC has brought actions against other wellness devices making unsubstantiated clinical claims.
      Eight Sleep's AI-generated health advice criticism in May 2026 (cited in chapter 1) adds a
      reputational layer to this risk.

      Competitive commoditization risk is emerging. SomniGroup — formed from the Tempur Sealy + Mattress
      Firm merger in February 2026, creating an $8B entity — controls the mattress retail stack
      through 2,300+ showrooms and could bundle smart-bed capabilities into its product line at scale.
      Sleep Number's existing SleepIQ technology has 8%+ smart mattress market share already. Purple
      Innovation's Q1 2026 revenue declined 8.1%, its market cap collapsed to ~$110M from a 2021 peak,
      showing that standalone DTC bedding brands are vulnerable to both capital constraints and category
      sentiment swings. Eight Sleep's premium price point provides margin buffer but limits volume.
