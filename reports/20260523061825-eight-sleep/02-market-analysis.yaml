callouts:
  - calloutType: strength
    title: Non-Wearable Form Factor Aligned with Fastest-Growing Sleep-Tech Sub-Segment
    body: >
      The non-wearable sleep-tracker segment is forecast to grow at 16.04% CAGR (2026–2035) — the
      fastest sub-category in the sleep-tech device market — driven by consumer preference for passive,
      overnight monitoring without a wearable device. Eight Sleep's core design (sensor-embedded mattress
      cover, no body-worn hardware) uniquely addresses this preference. Unlike Oura Ring or WHOOP,
      which require nightly charging and device wear, the Pod operates passively. This structural
      alignment between product design and market trend is a durable advantage if execution on sensor
      accuracy and AI personalization quality is maintained.
    claimRefs:
      - CM012
      - CM046

  - calloutType: risk
    title: Subscription Fatigue and Retroactive Policy Risk Create Structural Churn Exposure
    body: >
      Eight Sleep's business model depends on a mandatory, recurring subscription ($17–$33/month)
      on top of a $2,849–$6,099 hardware purchase. In 2026, 47% of US consumers canceled at least
      one subscription, and the average household significantly underestimates its total subscription
      spend — a signal of latent dissatisfaction. The company's February 2023 retroactive feature lock
      for existing Pod owners created documented community backlash and raised concerns about the
      company's willingness to change the value proposition post-purchase. Without disclosed churn
      data, the scale of this risk is unverifiable in diligence. The mandatory subscription is both
      Eight Sleep's primary path to recurring revenue and its highest reputation risk.
    claimRefs:
      - CM017
      - CM024
      - CM034

  - calloutType: insight
    title: Market Sizing Uncertainty Is Itself a Diligence Signal
    body: >
      The 2x–10x spread between smart mattress ($1.87B narrow) and broad sleep-tech ($31B+) TAM
      estimates is not a rounding problem — it reflects genuine definitional ambiguity about whether
      Eight Sleep's market is hardware, subscription software, health data, or a platform combining
      all three. Investors who use the broad TAM to justify the $1.5B valuation must explain why
      Eight Sleep captures a meaningful share of the wearable-dominated sleep-tech universe rather
      than only the smart mattress sub-segment where Sleep Number already has 8%+ share. The most
      rigorous frame is a bottom-up SAM defined by income-qualified US households, premium WTP,
      and annual conversion — an estimate that produces a much more modest near-term opportunity.
    claimRefs:
      - CM002
      - CM039
      - CM040
      - CM044

  - calloutType: assumption
    title: International Expansion Contribution to Near-Term Revenue Is Unverified
    body: >
      Eight Sleep describes 2026 as its "year of scale" and is shipping to 34+ countries. However,
      no country-level revenue breakdown, gross margin by geography, or customer count by region has
      been publicly disclosed. GDPR compliance costs for EU markets, local warranty obligations,
      shipping duties, and lower brand awareness outside the US are material friction factors. Until
      Eight Sleep discloses international revenue share, the contribution of the 2026 global expansion
      to total company economics is an open diligence question.
    claimRefs:
      - CM020
      - CM035

