figures:
  - id: FM001
    title: Eight Sleep Market Sizing Pyramid — TAM / SAM / SOM
    type: pyramid
    layout: standard
    summary: >
      Three nested market frames illustrate the wide range of defensible Eight Sleep TAM definitions.
      The smart mattress frame ($1.87B) is the most conservative and most defensible; the broad
      sleep-tech frame ($31B+) is too large to be meaningful without scope adjustment.
    data:
      items:
        - label: "TAM — Broad Sleep-Tech Devices (All Forms, Global 2026)"
          value: 31.35
          unit: "$B"
          description: >
            Global sleep tracking device market base, SNS Insider April 2026. Includes wearables (57%),
            non-wearables, and clinical devices. Eight Sleep competes in the non-wearable sub-segment only.
          claimRefs: [CM010]
        - label: "SAM — Non-Wearable Sleep Tech + Smart Mattress (Global 2026)"
          value: 7.0
          unit: "$B"
          description: >
            Estimated serviceable market: smart mattress ($1.87B, GMI) plus non-wearable sleep tracker
            sub-segment (~$13B × 40% overlap factor for bed-embedded form factors). Author-blended estimate;
            low confidence.
          claimRefs: [CM002, CM012]
        - label: "SOM — Eight Sleep Realistic US Market Capture (2026–2030 Horizon)"
          value: 0.8
          unit: "$B"
          description: >
            Bottom-up US SOM: ~37M US households above $100K income × 1–2% annual conversion × average
            Pod revenue ~$3.5K. Range $600M–$2B depending on conversion assumptions. Author-derived;
            not independently validated.
          claimRefs: [CM016, CM019]
    approximationNotes: >
      SAM is author-blended; SOM is illustrative. All values in nominal USD billions (2026). Smart mattress
      TAM ($1.87B, GMI) is the only primary-sourced narrow figure; the pyramid should be read as illustrative
      of scope uncertainty, not precise addressability.
