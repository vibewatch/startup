  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: revenue
      missingEvidence: >
        Eight Sleep's own revenue, gross margin, churn rate, subscription renewal rate, and customer
        count are not publicly disclosed. All financial metrics are company-claimed or third-party inferred.
      whyItMatters: >
        Without revenue data, TAM penetration, SAM capture, and unit economics cannot be independently
        validated; the $1.5B valuation cannot be benchmarked against real revenue multiples.
      diligencePath: >
        Request audited financials as part of data room access; specifically seek subscription renewal
        rate, gross margin by product line, and international revenue contribution.
      relatedQuestionRefs: [QM006, QM007, QM023]

    - type: conflicting-data
      severity: material
      topic: market-sizing-methodology
      missingEvidence: >
        No analyst has published a scope-normalized, methodology-transparent TAM estimate that
        precisely bounds Eight Sleep's serviceable addressable market.
      whyItMatters: >
        The 2x–10x spread between smart mattress ($1.87B) and sleep-tech all-forms ($32B+) estimates
        makes it impossible to independently validate market share claims or growth projections
        without knowing which scope each investor is using.
      diligencePath: >
        Require management to present their own TAM definition with explicit exclusions; compare
        against GMI January 2026 narrow-scope estimate as the most defensible floor.
      relatedQuestionRefs: [QM021, QM027]
      relatedTableRefs: [TM002, TM003]

    - type: missing-source
      severity: material
      topic: international-expansion
      missingEvidence: >
        No country-level revenue breakdown, gross margin by geography, or customer count by region
        has been publicly disclosed for Eight Sleep's international operations.
      whyItMatters: >
        Eight Sleep describes 2026 as its "year of scale" for international expansion, but without
        revenue or customer data from EU, UK, and Australia operations, the economic contribution
        of the international strategy is unverifiable.
      diligencePath: >
        Request country-level revenue and unit shipment data; assess GDPR compliance posture and
        EU operational cost structure; verify whether Australian, UK, and EU customers are active
        or just shipping-eligible.
      relatedQuestionRefs: [QM016, QM024, QM030]

    - type: missing-source
      severity: material
      topic: replacement-cycle-smart-beds
      missingEvidence: >
        No primary source documents the upgrade cycle for smart bed consumers specifically
        (Pod 3 → Pod 4 → Pod 5), which may be materially shorter than the 7–10 year conventional
        mattress replacement cycle if tech obsolescence drives earlier upgrades.
      whyItMatters: >
        A shorter upgrade cycle would positively impact Eight Sleep's LTV and hardware revenue
        cadence; absence of data makes this an open assumption in any DCF model.
      diligencePath: >
        Request cohort-level hardware upgrade data from management; specifically the % of Pod 3/4
        customers who upgraded to Pod 5 within 2–3 years.
      relatedQuestionRefs: [QM028]

    - type: missing-source
      severity: minor
      topic: menopause-segment
      missingEvidence: >
        No published data exists on Eight Sleep's current sales to menopausal women or to households
        purchasing specifically for night-sweat relief, nor any clinical study of Pod cooling efficacy
        for vasomotor symptoms.
      whyItMatters: >
        If this segment is large and underserved, targeted marketing and clinical validation could
        materially expand Eight Sleep's SAM without product changes; absence of data makes it
        speculative.
      diligencePath: >
        Review customer survey data and app user demographics for hormonal sleep pattern prevalence;
        assess whether any femtech partnership or clinical study is in progress.
      relatedQuestionRefs: [QM020]
      relatedTableRefs: [TM004]
