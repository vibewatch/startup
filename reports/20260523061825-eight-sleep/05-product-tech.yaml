    - Mechanical durability, fail-safe behavior, and field reliability are not disclosed publicly
  - - Blanket + Pillow Cover
    - Users seeking head-to-toe thermal coverage
    - GA accessories
    - Extends temperature coverage above the torso and to the pillow rather than only under-body control
    - Accessory attach rates and long-term reliability are not disclosed
  - - Autopilot software
    - All active members
    - GA and mandatory for first year
    - Overnight temperature automation, paired-user profiles, reports, alarms, and now predictive control inputs
    - Subscription requirement turns core functionality into an ongoing service dependency
  - - Health Check
    - Elite members / wellness-focused users
    - GA within Elite tier since 2025
    - Adds respiratory and cardiovascular disturbance reporting without wearables
    - Public materials do not fully disclose sensor stack, validation boundaries, or regulatory posture
