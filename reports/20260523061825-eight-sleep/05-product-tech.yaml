  evidenceGaps:
  - type: missing-source
    severity: material
    topic: sensor-detail-gap
    missingEvidence: Public engineering or regulatory detail that identifies the exact sensors and validation protocol used for snoring, respiratory, and cardiovascular monitoring.
    whyItMatters: The product now markets proactive health and snoring outcomes, so diligence needs to know what is directly measured, what is inferred, and how false positives are managed.
    diligencePath: Request technical documentation or validation reports covering the sensing stack, training data, and alert thresholds for Health Check and snoring mitigation.
    relatedQuestionRefs:
    - QE023
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: public-disclosure-gaps
    missingEvidence: A public or diligence-room security artifact covering security certifications, data residency, privacy operations, and cloud control posture.
    whyItMatters: The product experience depends on app and cloud continuity, so privacy and operational security controls matter as much as mattress-surface hardware.
    diligencePath: Request a security packet covering certifications, data-hosting locations, retention, incident response, and any third-party assessments.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: service-reliability
    missingEvidence: Any public or customer-sharable uptime SLA, status-history, or reliability disclosure for the Autopilot-connected service.
    whyItMatters: A connected sleep product that mediates core automation through the app and cloud can create nightly user friction if service reliability is weak.
    diligencePath: Request internal uptime metrics, major incident history, status-page exports, and support escalation data for the app and Autopilot services.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE003
  - type: missing-source
    severity: minor
    topic: developer-surface
    missingEvidence: Official API or integration documentation that clarifies supported endpoints, rate limits, change management, and partner support boundaries.
    whyItMatters: Without a supported developer surface, integrations may be brittle and expensive to maintain for advanced users or channel partners.
    diligencePath: Ask for official integration docs, partner program materials, and a roadmap for supported versus unsupported automation interfaces.
    relatedQuestionRefs:
    - QE026
    relatedTableRefs:
    - TE003
