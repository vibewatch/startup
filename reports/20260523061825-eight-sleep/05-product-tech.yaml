figures:
- id: FE001
  title: Product Architecture Map
  type: stack
  layout: wide
  summary: Eight Sleep's architecture stacks thermal textiles and motion hardware under a software layer that interprets biometric and environmental signals, then exposes results primarily through the consumer app.
  data:
    layers:
    - label: Sleep Surface Layer
      detail: Pod Cover on top of an existing mattress with split thermal zones and embedded sensing functions.
    - label: Accessory Layer
      detail: Base for elevation and sound, Blanket for above-body thermal coverage, and Pillow Cover for head cooling.
    - label: Hydronic / Hub Layer
      detail: Reservoirs, pumps, thermal engine, connectivity hardware, and processing chips circulate water and execute thermal control.
    - label: Automation Layer
      detail: Autopilot uses sleep-stage, profile, and environment signals to change temperature and, where available, elevation.
    - label: Application Layer
      detail: The iOS and Android apps handle onboarding, profiles, reports, alarms, and membership-gated features.
    - label: External Context Layer
      detail: Apple Health and Google Health Connect now feed predictive Autopilot 4.0 inputs, while unofficial community tools sit outside the supported stack.
  claimRefs:
  - CE009
  - CE014
  - CE015
  - CE021
  - CE022
  - CE029
  - CE036
- id: FE002
  title: Customer Workflow / Operating Flow
  type: flow
  layout: wide
  summary: The nighttime workflow starts with user setup and split profiles, passes through thermal and motion automation during sleep, and ends with app-native morning reports.
  data:
    nodes:
    - id: setup
      label: Install cover + hub + app
      detail: User fits the cover to an existing mattress, places the hub, and pairs through the mobile app.
    - id: profiles
      label: Create one or two profiles
      detail: Autopilot links sleepers to split thermal zones and profile-specific preferences.
    - id: overnight-sensing
      label: Sense sleep + snoring
      detail: The system monitors sleep state, snoring events, and other body signals during the night.
    - id: thermal-adjustment
      label: Adjust temperature automatically
      detail: Autopilot changes each side's thermal setting throughout the night.
    - id: motion-adjustment
      label: Elevate when needed
      detail: If the Base is present, the bed can move into reading, sleep, or snore-mitigation positions.
    - id: morning-report
      label: Surface morning reports
      detail: The app shows sleep stages, heart rate, HRV, respiratory or snoring trends, and Health Check results where eligible.
    - id: subscription-loop
      label: Continue service via membership
      detail: Core automation and newer features remain tied to Autopilot membership and app connectivity.
    edges:
    - from: setup
      to: profiles
      label: onboard
    - from: profiles
      to: overnight-sensing
      label: start night
    - from: overnight-sensing
