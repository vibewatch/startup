company:
  name: Eight Sleep
chapter:
  number: 5
  title: Product & Technology
  summary: Eight Sleep's current Pod 5 is a hydronic mattress-cover system layered with mandatory Autopilot software, optional elevation and sound hardware, and accessory thermal surfaces that sit on top of an existing bed. Public product pages, design notes, patents, FCC records, app listings, and community tooling support a full-stack architecture spanning sensors, pumps, thermal control, mobile software, cloud algorithms, and health reporting, with recent roadmap steps including 2025 Health Check and 2026 predictive Autopilot 4.0. The differentiation is real, but public diligence still lacks stable official APIs, sensor-level validation detail, explicit security or data-residency commitments, and uptime disclosures.
sections:
- id: system-definition-and-user-workflow
  title: Delivered System and Customer Workflow
  body: 'Eight Sleep is not selling a standalone mattress so much as a connected sleep layer that wraps around the customer''s existing bed. The current Pod 5 cover sits on top of an existing mattress, while optional add-ons extend the system into an adjustable base, a hydro-powered blanket, and a separate pillow cover. The operational workflow is therefore multi-surface and software-led: the user installs the cover and hub, enrolls in Autopilot, sets up one or two sleep profiles in the app, and then lets the system manage overnight temperature, alarms, and snore mitigation. Public product and app-store pages consistently present the value proposition as dual-side thermal control plus automated adjustment, not just manual cooling. This matters for diligence because the delivered product is a recurring-service sleep stack whose utility comes from automation, paired-user coordination, and overnight reports rather than from passive textile hardware alone.'
