  topStrengths:
    - >-
      Eight Sleep has a differentiated premium sleep product that combines active cooling, passive biometric sensing,
      and software-driven personalization rather than a commodity mattress SKU.
    - >-
      The company has two recent financing anchors, including an explicit $1.5B valuation in March 2026, which reduces
      existential capital-risk concerns.
    - >-
      Hardware plus subscription economics create a plausible recurring-revenue layer that most mattress competitors do
      not have.
  topRisks:
    - >-
      Public disclosure still does not provide revenue, gross margin, retention, CAC, payback, or audited cash-flow
      detail.
    - >-
      The required subscription, privacy sensitivity of sleep data, and prior outage backlash can weaken trust and
      willingness to pay.
    - >-
      The current valuation assumes strong execution in premium hardware, subscriptions, and future AI-health expansion
      without public proof on the denominator.
  unresolvedGaps:
    - Current revenue, ARR, gross margin, and free-cash-flow durability remain undisclosed.
    - Churn, attach-rate, and cohort retention for Autopilot subscriptions are not publicly quantified.
    - Current customer count and normalized headcount are not cleanly disclosed across public sources.
