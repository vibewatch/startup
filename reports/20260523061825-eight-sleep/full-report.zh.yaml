      - number: '7.4'
        title: 合作伙伴、资本与执行风险
        blocks:
          - type: paragraph
            body: >-
              Eight Sleep 的外部依赖图谱比产品营销暗示的更宽。融资合作伙伴重要，因为公司在一款经常性订阅之外、动辄数千美元的产品上宣传月付和 0% APR。云和 app 平台依赖重要，因为关键产品功能通过 app
              和 hub 路由，而不是完全本地的控制平面。资本市场也重要，因为管理层正在同时推进 高端硬件刷新、国际扩张和与 FDA 相关的预测健康路线图。2026 年 Tether 领投轮，以及 TechCrunch
              报道公司 2025 年自由现金流为正， 都是有帮助的缓解因素，但并不能消除执行压力。事实上，向 30 多个国家发货、制造消费硬件、支持高接触退换货和保修、为临床验证提供资金，
              这些事项叠加起来意味着多线作战负荷。公开记录没有给出足够细节，无法判断支付结构集中度、融资合作伙伴依赖，或监管和支持职能背后的组织深度。 因此，外部依赖和人员风险表仍和法律风险清单一样重要。
