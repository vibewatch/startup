  - id: FU001
    title: 客户旅程地图
    type: journey-map
    layout: wide
    summary: 从意识到睡眠问题到复购扩张共有五步；订阅和 App 层既是护城河，也是故障点。
    data:
      items:
        - label: 问题触发
          detail: 睡觉过热、伴侣温度偏好不一致、训练后过热、潮热或打鼾，会推动家庭寻找主动温控方案。
          claimRefs:
            - CU002
            - CU017
            - CU032
        - label: 证据收集
          detail: 购买前，潜在客户会比较官方评价、名人和运动员背书、应用商店评分，以及媒体实测评测。
          claimRefs:
            - CU005
            - CU006
            - CU010
            - CU011
            - CU024
        - label: 硬件购买
          detail: 买家先购买适配现有床垫的床罩加 Hub；免费配送、免费退货和 30 晚试睡降低下单阻力。
          claimRefs:
            - CU004
            - CU030
        - label: 引导设置与日常使用
          detail: 床要先注水启动，配置两个档案后，Autopilot 开始独立调节两侧；App 同时推送报告和闹钟。
          claimRefs:
            - CU002
            - CU003
            - CU021
        - label: 扩张或流失
          detail: 满意的家庭会加购配件或更高软件档位；不满用户则会碰到订阅疲劳、升级怀疑，或因宕机产生信任问题。
          claimRefs:
            - CU025
            - CU029
            - CU031
            - CU036
    claimRefs:
      - CU002
      - CU003
      - CU024
      - CU025
      - CU030
      - CU031
  - id: FU002
    title: 采用 / 部署流程
    type: flow
    layout: standard
    summary: 公开可见的路径是：从高端睡眠痛点出发，完成硬件采用和 App 引导设置，进入经常性变现，最后走向扩张或信任受损。
    data:
      nodes:
        - id: pain
          label: 睡眠问题
          detail: 过热、伴侣偏好不一致、潮热、打鼾或恢复需求会催生需求。
          tone: warning
        - id: proof
          label: 社会证明 + 评测
          detail: 官方证言、运动员背书、App 评分和媒体实测评测降低感知风险。
          tone: positive
        - id: sale
          label: 硬件销售
          detail: 客户为现有床垫购买床罩、Hub，有时还会加购配件。
          tone: positive
        - id: onboarding
          label: App 引导设置
          detail: 日常使用前，必须完成注水启动、Wi-Fi 设置和档案创建。
          tone: neutral
        - id: membership
          label: 经常性会员
          detail: Autopilot、追踪、闹钟和延长保修推动经常性变现。
          tone: positive
        - id: expansion
          label: 扩张循环
          detail: Base、Blanket、Pillow Cover、Enhanced 或 Elite 档位，以及 HSA/FSA 式健康使用场景，都会抬高家庭价值。
          tone: positive
        - id: failure
          label: 失败模式
          detail: 订阅疲劳、宕机或云依赖，可能把满意用户变成批评者。
          tone: warning
      edges:
        - from: pain
          to: proof
        - from: proof
          to: sale
        - from: sale
          to: onboarding
        - from: onboarding
          to: membership
        - from: membership
          to: expansion
        - from: failure
          to: membership
    claimRefs:
      - CU003
      - CU024
      - CU025
      - CU029
      - CU030
      - CU031
