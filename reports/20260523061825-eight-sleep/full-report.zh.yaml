        - 全床舒适度、可调节性、门店、分期付款和服务覆盖
        - 加装友好度较低，也更难按公开标价横向比较
      - - Bryte
        - 高端自适应智能床垫
        - 私营；2022 年由 Tempur Sealy 领投 $20M，2023 年披露累计融资 40M+
        - 自适应床垫、主动减压、分区硬度、AI 管家
        - 以询价 / 起售价定位为主，而不是清晰公开价目表
        - 不用穿戴设备，也能提供减压和引导式舒适调节
        - 可见渠道覆盖更小，公开规模披露有限
      - - Sleepme
        - 直营加装式温控同业
        - 私营；公开材料强调产品线深度，而非公司规模
        - 带自动化的水循环床铺冷却垫，可选追踪器套装
        - 产品线起价 $699 / 旗舰 Chilipad 2.0 为 $1,599；无订阅
        - 成本更低的水循环温控，保留现有床垫
        - 支撑、止鼾干预和集成生物指标不如 Eight Sleep 完整
      - - BedJet
        - 加装式风循环替代品
        - 私营；披露已售出 200k+ 台、拥有 11 项专利
        - 床单下强制送风加热 / 制冷
        - 基于评测的预算型领先方案，配置多在 $1k 以下；无订阅
        - 气流快、能烘干汗湿、床垫兼容性广、安装简单
        - 相比智能床，追踪和深度自动化较弱
      - - Oura Ring
        - 穿戴式追踪替代品
        - 私营；已售出 5.5M+ 枚戒指，2024 年收入 $500M+，最近估值 $5.2B
        - 基于戒指的睡眠、压力、活动和健康洞察
        - 每月 $5.99 会员费 + 戒指硬件
        - 面向不需要换床用户的高规模数据层
        - 不改变温度、支撑或姿势
