  - id: FE001
    title: 产品架构图
    type: stack
    layout: wide
    summary: Eight Sleep 的架构把热控织物和运动硬件叠在软件层之下；软件层解读生物识别和环境信号，再主要通过消费者 app 呈现结果。
    data:
      layers:
        - label: 睡眠表面层
          detail: Pod Cover 覆盖在现有床垫上，具备分区热控和嵌入式感应功能。
        - label: 配件层
          detail: Base 负责抬升和声音，Blanket 覆盖身体上方热控，Pillow Cover 负责头部降温。
        - label: 水循环 / Hub 层
          detail: 水箱、泵、热引擎、连接硬件和处理芯片循环水流并执行热控。
        - label: 自动化层
          detail: Autopilot 利用睡眠阶段、用户画像和环境信号调整温度；在有硬件支持时，也会调整抬升。
        - label: 应用层
          detail: iOS 和 Android app 处理入门设置、用户档案、报告、闹钟和会员门槛功能。
        - label: 外部上下文层
          detail: Apple Health 和 Google Health Connect 现在为 Autopilot 4.0 输入预测信号，非官方社区工具则位于受支持栈之外。
