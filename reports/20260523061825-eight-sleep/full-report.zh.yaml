      - number: '7.2'
        title: 监管、法律与数据治理风险
        blocks:
          - type: paragraph
            body: >-
              对一家床垫周边消费公司来说，Eight Sleep 的法律和监管栈异常宽。产品记录睡眠阶段、心率、HRV、呼吸频率和其他健康邻近信号， 公司又公开谈论用于健康和 FDA 路径的预测
              AI。加州隐私法已把生物识别和健康信息视为敏感个人信息，CPPA 也在继续实施并执行这一制度。 联邦层面，FTC 的 Health Breach Notification Rule
              很关键，因为它瞄准的是个人健康记录供应商及相邻主体，而不只是医院。 消费者订阅法也很重要。FTC 的负面选项规则和加州自动续订法都强调经常性付款披露、确认和取消必须清楚。Eight Sleep 同时组合订阅、
              折扣营销和分期，因此这些规则直接相关。风险不只是理论上的：Chopra 诉状指称持续虚假折扣和加州消费者法违规，另一起无障碍诉讼和 Orion 专利案则显示 Eight Sleep
              的公开法律暴露是多线的。如果面向 FDA 的睡眠呼吸暂停声称继续推进，合规边界还可能进一步超出传统消费品法。
