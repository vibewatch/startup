              公开留存证据弱于公开采用证据。公司没有披露 NRR、GRR、流失率、续约或队列曲线，因此尽调只能依赖满意度代理指标和长期用户叙事。 这些代理指标偏正面：app 有 16,000 条 iOS 评分，均分
              4.7/5；官方情侣页面显示 30,215 条评价，均分 4.5 星；Sleep Foundation 给出 8.9/10，BOXROX 给出 88%，Cybernews 给出 4.2/5。使用 730 多晚和
              1,400 多晚的独立用户称，核心温控价值真实存在。但反向证据不是表面瑕疵。 Kinja、MattressNut、Michael Kummer 和 BOXROX
              都把订阅视为最大后悔来源，尤其是取消订阅会拿走多数智能功能。更重要的是， 2025 年 10 月 AWS 故障显示，当睡眠产品依赖云连接时，客户信任会被快速破坏。Eight Sleep
              事后增加了故障缓解措施，但这次事件仍是持久信号： 产品市场契合和可靠性不是一回事。
