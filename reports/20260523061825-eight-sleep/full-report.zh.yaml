  - id: TV003
    title: 牛 / 基准 / 熊情景表
    columns:
      - 情景
      - 核心假设
      - 估值区间
      - 相对 $1.5B 入场价的回报逻辑
      - 概率信号
      - 下行触发项
    rows:
      - - 熊
        - 硬件仍是主要价值驱动；会员留存不及预期；AI 信任问题持续；FDA 路径停滞。
        - $0.6B-$1.0B
        - 如果新钱或退出买家按接近 Peloton / Sleep Number 的联网硬件倍数定价 Eight Sleep，资本可能受损。
        - 25%
        - 下调估值轮、留存差或监管滑坡
      - - 基准
        - FCF 纪律守住；收入基数大致达到 $220M-$300M 等价水平；订阅层足够黏，能支撑温和估值溢价。
        - $1.1B-$1.7B
        - 当前轮大致公平到略偏贵；在经济性更透明前，上行空间有限。
        - 50%
        - 经常性利润率证据出现前，增长先放缓
      - - 牛
        - 预测 AI 显著改善留存；FDA 路径打开受监管健康渠道；类软件毛利占比上升；全球规模继续支撑增长。
        - $1.8B-$2.6B
        - 存在可观上行，但前提是 Eight Sleep 至少部分打通通往睡眠健康医疗科技倍数的桥。
        - 25%
        - 医疗路径失败，或高端硬件需求回归常态
    notes: 区间是作者推导的估值范围，锚定已披露的 $1.5B 融资轮和公开可比公司倍数区间，而不是已披露的当前收入数字。
