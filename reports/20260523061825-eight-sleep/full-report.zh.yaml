      - number: '8.2'
        title: 融资背景、可比框架与入场纪律
        blocks:
          - type: paragraph
            body: >-
              Eight Sleep 现在有两个后期价格锚：2025 年 $100M 轮，管理层称该轮把估值较 2021 年 $500M Series C 基础翻倍； 以及 2026 年 3 月明确定价为 $1.5B
              的战略轮。这是真实标记，但仍是协商形成的私募轮，而不是透明的公开价格发现。 公开可比公司有启发性，正因为它们被迫披露。Sleep Number 和 Peloton 展示了联网硬件叙事在增长失望和倍数压缩后的样子。
              Somnigroup 展示了一个规模化高端睡眠产品平台在没有经常性软件叙事时能获得的估值。ResMed 和 DexCom 展示了投资人愿意为具备强毛利、
              经常性监测逻辑和公开财务披露的健康数据业务支付什么价格。放在这组公司旁边，Eight Sleep 需要披露折价。如果年收入只有约 $150M， 本轮隐含约 10x 销售额；如果收入接近 $300M，隐含倍数降至约
              5x，就更可辩护。由于公开来源没有揭示实际收入基础， 有纪律的入场应要求一座桥：从硬件销售消化和会员收入桥接到当前年化收入，并证明订阅层足够有意义，能让 Eight Sleep 不落入 Sleep
              Number/Peloton 可比篮子。
