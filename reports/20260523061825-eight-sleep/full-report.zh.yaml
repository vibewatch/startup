          detail: 水冷床垫套、Hub、Blanket 和电动 Base 通过 DTC 销售，起价 $2,849。
          tone: positive
        - id: subscription
          label: 强制订阅（$17–$33/月）
          detail: 解锁 Autopilot AI、健康分析和保修；2023 年在用户反对声中推出。
