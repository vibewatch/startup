      - number: '4.2'
        title: 公开业务牵引力和单位经济代理指标真实存在，但还不足以拼出利润率模型
        blocks:
          - type: paragraph
            body: >-
              Eight Sleep 有足够公开运营信号，说明它不是小众的收入前项目；但这些信号还不足以让投资人承销完整利润率栈。 官方和第三方来源指向有意义的采用度和数据规模：当前官方页面突出超过 30,000
              条评论，Business Wire 和 Sleep Review 引用来自超过 35 个国家用户的超过 10 亿小时睡眠数据。较早的 Craft 运营指标也显示，公司长期披露过客户数、
              追踪夜晚数和数据量等使用型里程碑。这些信号支持经常性分析和算法改进可能有经济意义，尤其是公司把服务器、 数据存储和 R&D
              支出列为会员模式理由。不过，单位经济桥梁仍不完整。公开来源没有提供毛利率、贡献利润率、退款率、 保修准备金、CAC 或回本周期披露。因此，当前最好的判断是：这是一家高 AOV 消费硬件公司，带有类软件经常性元素，
              同时承担不低的支持、云和替换成本义务。
