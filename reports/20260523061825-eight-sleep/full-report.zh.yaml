      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >
              Eight Sleep 由四人共同创立，背景覆盖法律、创业和工程。意大利出生的创业者 Matteo Franceschetti 担任 CEO，是公司最显眼的公众面孔；他在 X
              上直接与客户沟通，也是融资公告中的主要发言人。 联合创始人 Alexandra Zatarain 担任品牌与营销 VP，TechCrunch 报道中也称其为 CMO；她的职责使其成为
              产品定位和健康数据隐私上的主要对外声音。Massimo Andreasi Bassi 是联合创始人兼 CTO。Andrea Ballarini 在 Wikipedia 和 TechCrunch
              中被列为联合创始人，但近年媒体曝光较少。

              关键人物风险集中在 Franceschetti。他亲自发布 2025 年 10 月 AWS 故障的公开道歉，谈判 Series D 和 Series D-II 条款，并且是每一项主要投资者公告中的具名
              CEO。Eight Sleep 未公开披露董事会完整构成； Valor Equity Partners 的 Antonio Gracias 在 2021 年 Series C
              相关交易中加入董事会，但当前董事名单尚未得到 独立验证。标准私营公司 VC 安排之外的治理结构没有公开记录。CFO 职位（第三方数据库报道称为 Nicolas
              Chammas）尚未由一手来源独立确认，应视为开放尽调项。董事会独立性、保护性条款和投票权均未公开。
