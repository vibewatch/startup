  - id: FM001
    title: Eight Sleep 市场规模金字塔 — TAM / SAM / SOM
    type: pyramid
    layout: standard
    summary: |
      三个嵌套市场框架展示 Eight Sleep 可辩护 TAM 定义的宽窄区间。智能床垫框架（$1.87B）最保守、也最站得住；宽口径睡眠科技框架（$31B+）过大，若不调整范围，参考意义有限。
    data:
      items:
        - label: TAM — 宽口径睡眠科技设备（所有形态，全球 2026）
          value: 31.35
          unit: $B
          description: |
            以 SNS Insider 2026 年 4 月全球睡眠追踪设备市场为基准。包含可穿戴设备（57%）、非可穿戴设备和临床设备。Eight Sleep 只参与非可穿戴子细分。
          claimRefs:
            - CM010
        - label: SAM — 非可穿戴睡眠科技 + 智能床垫（全球 2026）
          value: 7
          unit: $B
          description: |
            估算可服务市场：智能床垫（$1.87B，GMI）加非可穿戴睡眠追踪子细分（约 $13B × 40% 床内嵌形态重叠系数）。作者混合估算；信心低。
          claimRefs:
            - CM002
            - CM012
        - label: SOM — Eight Sleep 可现实获取的美国市场（2026–2030 年期）
          value: 0.8
          unit: $B
          description: |
            自下而上的美国 SOM：约 37M 户收入高于 $100K 的美国家庭 × 1–2% 年转化率 × 平均 Pod 收入约 $3.5K。区间 $600M–$2B，取决于转化假设。作者推导；未独立验证。
          claimRefs:
            - CM016
            - CM019
    approximationNotes: |
      SAM 为作者混合估算；SOM 仅作示意。所有数值均为 2026 年名义美元十亿美元。智能床垫 TAM（$1.87B，GMI）是唯一来自一手来源的窄口径数字；这座金字塔应理解为范围不确定性的示意，而非精确可触达市场。
