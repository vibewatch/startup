  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议、投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              核心估值问题不是 Eight Sleep 是否有意思，而是 2026 年 3 月 $1.5B 的价格能否被公开证据支撑。正向逻辑确实有支撑。 Eight Sleep 在七个月内两次获得新资本，2025
              年自由现金流为正，发货到 34 多个国家，并搭建了高端“硬件 + 订阅”睡眠平台，
              具备差异化制冷、止鼾和生物识别数据采集。反向逻辑在于，这些证明点仍不足以构成公开市场级的承销包。公司没有披露年收入、ARR、流失率、 毛利率结构，或前几轮嵌入的优先股堆叠。产品信任也不干净：The Verge
              记录了事实错误的 AI 指引和游戏化睡眠功能，这些可能在 Eight Sleep 从消费者健康扩展到预测健康时削弱消费者信任。在 $1.5B 估值上，正确立场因此是价格敏感，而不是叙事敏感：跟踪公司，
              但在更深尽调证明经常性经济和品牌耐久性足以支撑相较公开睡眠硬件可比公司的溢价之前，不要把本轮定价视为显然有吸引力。
