companyProfile:
  summary: >-
    Eight Sleep 是一家睡眠健身公司，2014 年创立于 San Francisco，目前总部位于 New York City。其核心产品线是 Pod 智能睡眠系统：一个以床垫套为载体的平台，集主动水循环温控、生物识别传感和
    AI 驱动的 Autopilot 自动调节于一体，通过硬件加订阅模式直面消费者销售。公司把最近融资用于全球扩张、发布 Pod 5 和相邻睡眠配件，并把平台同时定位为高端消费产品和更长期的 AI 健康业务。公开融资锚点真实且近期，
    但上市公司级别的财务披露仍然缺位。
