  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 已交付系统与客户工作流
        blocks:
          - type: paragraph
            body: >-
              Eight Sleep 卖的不是一张独立床垫，更像是包在客户现有床上的联网睡眠层。当前的 Pod 5 cover 铺在现有床垫上，
              可选配件把系统延伸到可调节底座、水循环驱动的毯子和单独的枕套。实际工作流因此是多表面、软件主导的：用户安装 cover 和 hub， 开通 Autopilot，在 app
              里设置一个或两个睡眠档案，然后让系统整夜管理温度、闹钟和止鼾。公开产品页和应用商店页面持续把价值主张
              描述为双侧温控加自动调节，而不只是手动制冷。尽调时这点重要，因为交付产品是一套经常性服务型睡眠技术栈，效用来自自动化、双人协调和夜间报告， 而不是单纯来自被动纺织硬件。
