      - number: '2.5'
        title: 市场约束与结构性风险
        blocks:
          - type: paragraph
            body: >
              五个结构性约束限制 Eight Sleep 的可触达市场、转化率和留存，其中至少两个——数据隐私和订阅疲劳——可能直接消耗品牌信任。

              床垫更换周期是最根本约束。消费者每 7–10 年更换床垫（Sleep Savvy 消费者研究预期为 9.6 年），而 2026 年美国床垫市场 年出货约 3000 万件，低于 3400 万–3500
              万件的正常化需求，反映宏观经济和住房市场逆风。美国市场名义 CAGR 仅 3.73%， 实际口径收缩。Eight Sleep 部分绕开这一约束，因为 Pod 床垫套放在现有床垫之上；但家庭整体寝具预算有上限，
              刚买新床垫的消费者不太可能再购买 $2,849–$6,099 的智能床垫套。

              订阅疲劳是尖锐的消费者层面风险。2026 年，47% 的美国消费者至少取消过一项订阅，普通家庭感知到的订阅成本是实际支出的 2.5x——这说明预算意外和潜在不满（readless.app，2026
              年）。Eight Sleep 于 2023 年 2 月引入强制订阅， 追溯限制现有 Pod 用户功能。该政策在 Reddit 和评论平台上引发持续社区反弹，构成潜在流失风险， 而经常性收入正是支撑 Eight
              Sleep 估值的基础。

              数据隐私与信任风险具有结构性重要性。Eight Sleep 的生物识别睡眠数据（心率、HRV、呼吸频率、动作）会传输到公司服务器； 按隐私政策，数据可能与第三方分析和营销合作伙伴共享。Eight Sleep
              CEO 曾公开使用聚合用户睡眠数据评论公共事件——404 Media 在 2023 年记录了这一点——显示公司把这些数据视为业务资产。GDPR 下，睡眠数据属于敏感健康数据，需要明确且细粒度的同意； 欧盟扩张带来
              GDPR 合规成本和潜在执法暴露。消费者对生物识别数据变现的信任正在全行业下降。

              消费者对健康宣称的怀疑也在加深。Eight Sleep 的临床宣称（入睡最多加快 44%、深睡增加 34%）来自公司报告， 未经过独立同行评审。疫情后监管机构加强了对健康科技营销宣称的审查，FTC
              已对其他提出无证据临床宣称的健康设备采取行动。 2026 年 5 月 Eight Sleep 的 AI 生成健康建议批评（见第 1 章）又给这一风险增加了声誉层。

              竞争商品化风险正在出现。SomniGroup 于 2026 年 2 月由 Tempur Sealy + Mattress Firm 合并而成，形成一个 $8B 实体， 掌控 2,300+
              家门店的床垫零售栈，能够规模化地把智能床能力打包进产品线。Sleep Number 的现有 SleepIQ 技术已经拥有 8%+ 智能床垫市场份额。Purple Innovation 2026 年 Q1 收入下降
              8.1%，市值从 2021 年峰值跌至约 $110M， 说明独立 DTC 寝具品牌同时易受资本约束和品类情绪波动冲击。Eight Sleep 的高端定价提供毛利缓冲，但限制销量。
