      - number: '2.2'
        title: 市场规模：多重口径与相互矛盾的估算
        blocks:
          - type: paragraph
            body: >
              没有单一市场估算能可靠框住 Eight Sleep 的可触达机会。分析师的范围定义相差 2x 到 10x——这个缺口太大， 不能用中位数糊过去。尽调应保留完整区间，并压力测试每个框架对估值的含义。

              在智能床垫细分，Global Market Insights（2026 年 1 月）是最新的狭义口径估算：2026 年全球 $1.87B， 按 6.6% CAGR 增至 2035 年 $3.34B。The
              Business Research Company 的平行报告把 2026 年规模放在更接近 $2.5B。差异来自酒店 / 医院智能床是否纳入，以及收入口径与出货价值方法不同。缺乏公开方法透明度时，
              两者无法调和。

              在更广义的睡眠科技设备框架下，三个 2026 年估算集中在全球 $27–32B。Research Nester 预测 $30.74B （到 2035 年 CAGR 15.5%）；Global Market
              Insights 以 $32B+ 印证；SNS Insider（2026 年 4 月新闻稿） 把 2025 年基数放在 $31.35B。仅美国子市场就预计 2025 年 $9.29B（SNS
              Insider）。SleepTech 2026 Strategic Overview（healthcare.digital）综合这些估算，确认 2026 年规模超过 $30B。Eight Sleep
              竞争的是该市场的非穿戴子细分，占收入 42.7%，并预计增长最快。

              睡眠呼吸暂停医疗设备市场（按 GMI 和 Research and Markets，2026 年全球 $8.66B–$10B）是 Eight Sleep 正通过 FDA Class II
              睡眠呼吸暂停检测许可追逐的相邻机会。如果获批，将打开当前无法进入的临床报销渠道； 但许可时间线和成功概率尚未确认。美国睡眠呼吸暂停设备子市场预计为 $3.11B（MarketsandMarkets 2026）。

              Technavio 和 MarkWide Research 估计 2026 年全球高端 / 奢华床垫市场为 $18.7B，而美国整体床垫市场 （所有层级）预计 $18.95B（MattressNut，2026 年
              4 月引用 Market Data Forecast）。按 NapLab， 专用床垫均价 $2,167；Eight Sleep Pod 5（cover + hub）起价 $2,849，落在最高价格层级。不过
              Eight Sleep 硬件是床垫增强件，不是床垫替代品，这限制了它与 Tempur Sealy（2024 年收入 $4.89B）和 Sleep Number （2024 年收入 $1.68B，同比下降
              11%）的正面重叠。

              更年期健康市场是一个具体相邻细分，Eight Sleep 的主动温控可缓解夜间盗汗；Business Research Insights 估计其 2026 年全球规模 $18.74B，2035 年前 CAGR
              10.3%。没有一手来源量化其中有多少可由睡眠硬件触达， 但更年期护理设备细分（可穿戴与硬件）预计为 $2.3B–$3.15B（2025–2032 年，CAGR 4.6%）。
