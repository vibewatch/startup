  - id: TV002
    title: 投资假设 / 反假设表
    columns:
      - 维度
      - 正向假设
      - 反向假设
      - 改变判断的证据
    rows:
      - - 产品验证
        - Pod 5 把温控、打鼾缓解、生物识别传感和 AI 引导优化放进差异化的高端形态。
        - 如果 app 层制造信任摩擦或新鲜感疲劳，高价和功能密度未必能沉淀长期价值。
        - 证明续费和附加购买行为能持续，同时没有退货或反弹升高。
      - - 商业模式
        - 硬件叠加强制会员，可能把一次性设备经济性变成经常性收入和切换成本。
        - 如果价值不够明显，强制订阅也会推高流失、反感和使用疲劳。
        - 披露队列留存、付费附加率和会员贡献的毛利。
      - - 资本与执行
        - 近期融资、自由现金流转正和 34+ 个国家分销，显示运营动能真实存在。
        - 公司仍不公布年收入或利润率细节，私募融资可能掩盖分母偏弱。
        - 提供经审计或投资人级财务，包含当前 run-rate 和利润率桥。
      - - 医疗上行
        - FDA 申报和预测健康定位，可能把 Eight Sleep 推向质量更高的睡眠健康可比公司。
        - 目前还没有公开 FDA clearance，受监管健康上行只是期权，不是有证据支撑的基准情景。
        - 公布申报编号、研究终点和按概率加权的商业化路径。
      - - 可比公司支撑
        - 一流睡眠公司或传感器驱动的医疗科技可比公司，支撑比床垫零售商更高的估值上限。
        - 这些高端可比公司披露更多，已验证的经济性也强于 Eight Sleep 公开展示的水平。
        - 证明收入组合和经济性更接近 ResMed 或 DexCom，而不是 Peloton 或 Sleep Number。
      - - 品牌与信任
        - 产品解决真实痛点，也拥有热情的高端用户。
        - The Verge 记录了错误 AI 建议和用户不想要的游戏化，足以快速侵蚀健康科技品牌。
        - 展示 AI 安全护栏、客户满意度趋势和功能回滚纪律。
    notes: 各行刻意把正向运营信号，与仍让判断无法转向看多的披露缺口和信任证据放在一起。
