      - number: '8.3'
        title: 乐观、基准与悲观情景及明确区间逻辑
        blocks:
          - type: paragraph
            body: >-
              情景分析比点估计更重要，因为 Eight Sleep 的估值已知，但公开分母未知。悲观情景假设公司仍主要是一门高端硬件业务，带有订阅摩擦、 AI
              信任问题和未经证明的监管路径。在这种世界里，公开市场买方很可能把它映射到 Peloton、Sleep Number，或至多给 Somnigroup 小幅溢价， 形成大约 $0.6B-$1.0B
              的区间。基准情景假设 2025 年自由现金流为正不是一次性事件，国际扩张和 Pod 5 升级把年收入基础抬到数亿美元低位， 会员经济也创造足够粘性，可以部分桥接到质量更高的睡眠健康可比公司；这支持大约
              $1.1B-$1.7B。乐观情景需要更雄心勃勃、也更具体的证明： 软件和健康监测毛利正在变得具有战略意义，FDA 申报转化成受监管的睡眠呼吸暂停路径，全球规模和预测 AI 显著扩大变现面。只有到那时，
              $1.8B-$2.6B 的区间才有承做基础。按当前 $1.5B 标记，上行空间存在，但没有私有尽调时安全边际很薄。
