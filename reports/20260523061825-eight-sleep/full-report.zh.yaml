  - id: FE002
    title: 客户工作流 / 操作流程
    type: flow
    layout: wide
    summary: 夜间工作流从用户设置和分区档案开始，睡眠中经过热控和运动自动化，最后以 app 内早晨报告收尾。
    data:
      nodes:
        - id: setup
          label: 安装床垫套 + Hub + app
          detail: 用户把床垫套装到现有床垫上，放置 Hub，并通过移动 app 配对。
        - id: profiles
          label: 创建一个或两个档案
          detail: Autopilot 将睡眠者关联到分区热控区域和个人偏好。
        - id: overnight-sensing
          label: 感知睡眠 + 鼾声
          detail: 系统在夜间监测睡眠状态、鼾声事件和其他身体信号。
        - id: thermal-adjustment
          label: 自动调节温度
          detail: Autopilot 整夜调整每侧温度设置。
        - id: motion-adjustment
          label: 需要时抬升
          detail: 如果配有 Base，床可以切换到阅读、睡眠或减轻鼾声的位置。
        - id: morning-report
          label: 呈现晨间报告
          detail: 符合条件时，app 显示睡眠阶段、心率、HRV、呼吸或鼾声趋势，以及 Health Check 结果。
        - id: subscription-loop
          label: 通过会员持续服务
          detail: 核心自动化和较新功能仍绑定 Autopilot 会员和 app 连接。
      edges:
        - from: setup
          to: profiles
          label: 入门设置
        - from: profiles
          to: overnight-sensing
          label: 开始夜晚
        - from: overnight-sensing
          to: thermal-adjustment
          label: 睡眠信号驱动温控
        - from: overnight-sensing
          to: motion-adjustment
          label: 鼾声可触发运动
        - from: thermal-adjustment
          to: morning-report
          label: 汇总结果
        - from: motion-adjustment
          to: morning-report
          label: 汇总事件
