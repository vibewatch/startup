      - number: '2.3'
        title: 买方与用户分层
        blocks:
          - type: paragraph
            body: >
              Eight Sleep 的买方、用户和付款方关系在不同细分中差异明显。公司 2026 年营销策略正从科技偶像背书转向
              包含医生、舞者和教师在内的「真实人群」细分，说明其有意拓宽漏斗。不过，$2,849–$6,099 的硬件价格
              加上强制年度订阅（$199–$399/year），结构性地把可触达市场限制在有足够可支配收入、且对睡眠优化有高支付意愿 （WTP）的家庭。

              核心买方是高收入健康消费人群：专业人士、运动员、生物黑客，以及冷热偏好不一致的伴侣。Eight Sleep 自身统计显示， 13% 客户年龄为 18–24 岁，主力人群集中在 25–45
              岁职场专业人士。运动员是已有记录的细分：职业体育队 （NFL、NBA）公开认可 Pod 用于恢复优化，Eight Sleep 也借助 Formula 1 车队和其他运动员赞助。该细分愿意把 Pod 视作类似
              Peloton 或 Theragun 的资本开支。

              伴侣构成结构上强势的买方类型：Pod 5 的双区温控——两侧可在 55°F 到 110°F 之间独立调节——为一方怕热、 另一方怕冷的家庭创造非对称价值。这个购买触发点不要求双方都是健康优化者；以解决不适为框架，
              降低了采用门槛，不再只面向健康爱好者。

              更年期和女性健康细分仍被低估，但正在增长。夜间盗汗是围绝经期和绝经后女性的主要睡眠扰动，Eight Sleep 的主动制冷无需药物干预即可直接缓解。随着 femtech 接受度提高、更年期健康市场以 10.3%
              CAGR 扩张， 面向该细分的定向营销和临床验证策略，可能显著扩大 SAM。Eight Sleep 没有公开财务披露量化该细分当前贡献。

              34+ 个国家的国际买家是增长向量。Eight Sleep 称 2026 年是其「规模之年」，英国、欧盟、澳大利亚和加拿大是主要市场。 2026 年 3 月的 $50M Series D-II
              明确用于全球扩张。国际定价、本地分销复杂度，以及生物识别数据收集的 GDPR 合规，都会增加美国 DTC 模型在本土没有遇到的摩擦。

              临床 / 医疗细分仍处早期。如果 Eight Sleep 获得 FDA Class II 睡眠呼吸暂停筛查许可，买方将部分从消费者转向 医疗服务提供者或保险方。这条路径会创造由报销驱动的新
              TAM，但监管时间线不确定，睡眠呼吸暂停诊断的临床标准 （多导睡眠监测）对非穿戴床垫套传感器而言门槛很高。
