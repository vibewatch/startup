  - id: TV005
    title: 投资假设破裂与终止触发项表
    columns:
      - 触发项
      - 阈值或事件
      - 对投资假设的传导
      - 行动含义
    rows:
      - - 平轮或降价轮
        - 下一次一级融资估值不高于 $1.5B
        - 表明增长叙事或投资者胃口已明显转弱。
        - 按熊情景重估，并暂停任何溢价入场。
      - - 会员疲弱
        - 一旦披露出现高流失、低附加率或频繁降级
        - 经常性收入和切换成本这部分假设会坍塌。
        - 可比视角转向高端硬件，而不是软件赋能健康。
      - - AI 信任失灵
        - 不安全建议、侵入式游戏化或客户反弹升高反复出现
        - Eight Sleep 正要销售预测健康时，品牌可信度被削弱。
        - 下调变现假设，并要求产品治理证据。
      - - 监管延误
        - FDA 路径实质滑坡，且看不到申报进展
        - 通往健康科技溢价倍数的最大桥梁被拿掉。
        - 估值时不再纳入受监管健康上行。
      - - 利润率不及预期
        - 一旦披露显示毛利组合偏硬件，或贡献利润率偏弱
        - 无法向更高质量医疗科技上市可比公司搭桥。
        - 估值上限压向 Somnigroup 或 Peloton 式区间。
      - - 运营失误
        - 服务、宕机或供应链问题实质伤害高端品牌感知
        - 削弱用户为 Eight Sleep 高端价位付费的意愿。
        - 收紧下行情景和获客假设。
    notes: 这些是供投委会使用、可监控的终止触发项，不是泛泛的经营风险。
    claimRefs:
