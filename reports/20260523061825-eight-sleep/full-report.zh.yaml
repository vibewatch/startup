      - number: '2.7'
        title: 图表与材料
        blocks:
          - type: callout
            title: 非穿戴形态契合增长最快的睡眠科技子细分
            body: >
              非穿戴睡眠追踪器细分预计 2026–2035 年 CAGR 16.04%，是睡眠科技设备市场中增长最快的子类别，驱动来自消费者偏好 无需穿戴设备的被动夜间监测。Eight Sleep
              的核心设计（内嵌传感器的床垫套、没有佩戴在身上的硬件）精准对应这一偏好。 不同于 Oura Ring 或 WHOOP 需要每晚充电并佩戴，Pod 被动运行。如果传感器准确性和 AI 个性化质量执行到位，
              产品设计与市场趋势之间的结构性匹配会成为持久优势。
            calloutType: strength
            claimRefs:
              - CM012
              - CM046
          - type: callout
            title: 订阅疲劳与追溯政策风险带来结构性流失暴露
            body: >
              Eight Sleep 的商业模式是在 $2,849–$6,099 硬件购买之外，再依赖强制经常性订阅（$17–$33/month）。 2026 年，47%
              的美国消费者至少取消过一项订阅，普通家庭显著低估自身订阅总支出——这是潜在不满的信号。 公司 2023 年 2 月对既有 Pod
              用户追溯锁定功能，留下有记录的社区反弹，也引发对公司是否会在购买后改变价值主张的担忧。 在没有披露流失数据前，尽调无法验证该风险规模。强制订阅既是 Eight Sleep 通往经常性收入的主路径，
              也是其最高声誉风险。
            calloutType: risk
            claimRefs:
              - CM017
              - CM024
              - CM034
          - type: callout
            title: 市场规模不确定性本身就是尽调信号
            body: >
              狭义智能床垫（$1.87B）与广义睡眠科技（$31B+）TAM 估算之间有 2x–10x 差距，这不是四舍五入问题， 而是对 Eight Sleep
              市场究竟是硬件、订阅软件、健康数据，还是三者合一的平台存在真实定义歧义。 用广义 TAM 支撑 $1.5B 估值的投资人必须解释：为什么 Eight Sleep 能在可穿戴主导的睡眠科技宇宙中拿到有意义份额，
              而不只是局限在 Sleep Number 已有 8%+ 份额的智能床垫子细分。最严谨的框架，是按收入达标美国家庭、 高端 WTP 和年度转化自下而上定义 SAM；该估算给出的近期机会要温和得多。
            calloutType: insight
            claimRefs:
              - CM002
              - CM039
              - CM040
              - CM044
          - type: callout
            title: 国际扩张对近期收入的贡献尚未验证
            body: >
              Eight Sleep 将 2026 年称为其「规模之年」，并向 34+ 个国家发货。不过，公司没有公开披露国家层面收入拆分、 各地区毛利率或地区客户数。欧盟市场的 GDPR
              合规成本、本地保修义务、运输关税，以及美国以外更低的品牌认知， 都是实质摩擦。在 Eight Sleep 披露国际收入占比之前，2026 年全球扩张对公司整体经济性的贡献仍是开放尽调问题。
            calloutType: assumption
            claimRefs:
