      - number: '2.6'
        title: 既有厂商基准与相邻市场背景
        blocks:
          - type: paragraph
            body: >
              理解 Eight Sleep 的市场位置，需要拿主要既有厂商公开披露的财务数据做基准，尽管 Eight Sleep 自身没有披露收入。

              Sleep Number Corporation（2024 年收入 $1.68B、毛利 $1.003B、毛利率 59.6%）是最接近的上市可比： 直面消费者的智能床平台。其 2024 年收入下滑 11%、净亏损
              $20.3M 且仍在重组，说明智能床市场并不能免疫 宏观住房疲弱和消费收紧。Sleep Number 每年投入约 $45M 研发，并继续按收入领先美国智能床细分。关键差异在于， Sleep Number
              销售完整替换床垫系统（$999–$5,000+），而 Eight Sleep 销售可覆盖任意床垫的床垫套——意味着两者面对 不同的更换周期暴露和零售分销要求。

              全球最大床垫公司 Tempur Sealy International 2024 年收入 $4.89B，并在 2026 年初与 Mattress Firm 合并， 以约 $8B 综合规模组成
              SomniGroup。SomniGroup 现在控制制造、品牌（Tempur-Pedic、Sealy、Stearns & Foster） 和 2,300+ 家零售门店。纵向整合给了 SomniGroup 一项
              Eight Sleep 无法用 DTC-only 模型匹配的分销优势。 如果 SomniGroup 在高端层级加入温控或生物识别功能，它可以用零售足迹压制 Eight Sleep 的直面消费者定位。

              Purple Innovation（2024 年收入 $0.50B，截至 2026 年 Q1 市值约 $110M，2026 年 Q1 收入下降 8.1%）是一个警示样本。 尽管产品（GelFlex
              Grid）差异化、DTC 起点强、早期投资者热情高，Purple 仍受困于盈利能力、分销成本， 以及 DTC 新进入者和大众市场品牌的竞争。Eight Sleep 应把 Purple
              轨迹作为风险情景：小众高端床垫品牌如果不能足够快地 扩大 TAM，就可能无法覆盖成本结构。

              Oura Health 的 $11B 估值（Bloomberg，2025 年）来自一枚带 $6/month 订阅的可穿戴睡眠追踪戒指， 证明睡眠健康平台可以拿到高端倍数。Eight Sleep 的 $1.5B
              估值（2026 年 3 月）意味着，在可比的睡眠数据定位下， 它相对 Oura 仍有明显估值差距，尽管戒指与完整床垫套 / hub 系统在硬件 COGS 和制造成本结构上差异很大。
