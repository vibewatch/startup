      - number: '8.4'
        title: 退出准备度、尽调问题与投资逻辑失效触发器
        blocks:
          - type: paragraph
            body: >-
              以今天可见的证据包看，Eight Sleep 还没有准备好进入公开市场。不同于本章使用的所有公开可比公司，公司不发布年度报告、分部结构或留存资料包。
              因此，下一步尽调很明确。投资人需要一座收入桥，把硬件、会员、配件以及任何企业或医疗试点分开；需要队列级会员留存和附加率数据； 还需要股权结构视图，展示 2021、2025 和 2026
              年各轮留下的清算优先权、参与权和反稀释条款。监管叙事也要从雄心走向文件： 管理层称正在为睡眠呼吸暂停检测和缓解推进 FDA
              申报，但公开证据没有显示已获许可。若下一轮融资持平或下行，若流失率显示会员更像麻烦而非护城河， 若 AI 健康功能继续侵蚀信任，或监管路径停滞到足以让市场把 Eight Sleep
              重新估回高端硬件而非健康平台可比公司，投资逻辑就应失效。 在这些问题清掉之前，公司仍有意思，但还不足以支持高于“观察”的干净承做结论。
