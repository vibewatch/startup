  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局、同业集合与替代路径
        blocks:
          - type: paragraph
            body: >-
              Eight Sleep 的竞争集合比消费者比较中常见的直接智能床品牌名单更宽。最接近的集成式替代品是 Sleep Number 和
              Bryte，因为两者都把舒适硬件、数据收集和一定程度的自动响应放进床本身。但买方也可以通过 Sleepme 和 BedJet 等改装式温控系统解决同一需求，保留已经拥有的床垫；或者选择 Oura、WHOOP 和
              Apple Watch 等追踪优先的替代品， 在不改变睡眠环境的情况下监测睡眠。因此，真正的决策不只是品牌 A 对品牌 B，而是买方想要一体化高端床平台、 更窄的气候控制层，还是可以叠在现状之上的更便宜数据层。


              这个更宽边界降低了任何一家供应商完全锁定品类的概率。Sleep Number 的门店和存量用户基础带来既有厂商可信度。 Bryte 争夺想要自适应支撑、引导放松和酒店级定位的高端买方。Sleepme 和
              BedJet 让怕热睡眠者在不接受订阅、 不更换床垫的情况下解决最痛的问题。可穿戴设备持续抽走只为分析付费的预算。实践中，买方可以混搭：保留现有床垫，
              增加改装制冷，再戴戒指或腕带获取数据。这种多路径购买逻辑意味着评估 Eight Sleep 的护城河时，必须把多类替代方案纳入， 而不只是直接床品同业。
