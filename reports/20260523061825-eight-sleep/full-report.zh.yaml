        title: 财务结论在变现架构上可看，但仍卡在核心承做数据
        blocks:
          - type: paragraph
            body: >-
              Eight Sleep 的反向视角不是可见的财务困境，而是信息不透明叠加持有风险摩擦。独立评测者持续认为，这款产品能较好解决温度驱动的睡眠问题；
              但他们也指出，高昂的前置价格、强制或强鼓励的订阅支出，以及对云端的依赖，构成了不舒服的经济账。TechCrunch 对 2025 年 10 月 AWS
              故障的报道进一步放大了这一担忧：联网床一旦服务中断，产品性能本身就会出事。与此同时，公开市场数据页面在融资总额、员工数和收入规模上 存在明显分歧。也就是说，投资人被要求接受一个高端估值和“硬件 +
              订阅”的叙事，却拿不到常规支撑桥：ASP 兑现、订阅附加率、流失率、 毛利率、保修准备金、CAC、回本周期、现金、烧钱速度和债务。财务结论因此是有条件的。收入质量可能好于一次性设备销售，
              但缺失的私有指标仍多到足以阻止形成严肃的投资建议。
