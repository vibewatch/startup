  - id: TV001
    title: 投资建议摘要表
    columns:
      - 维度
      - 当前判断
      - 证据基础
      - 决策含义
    rows:
      - - 建议
        - 跟踪
        - 私募价格已知，但年收入、ARR、流失率和股权结构条款未披露，测算仍不完整。
        - 保持在项目管线中跟踪，但不要把 2026 年 3 月估值当成必须入场的价格。
      - - 置信度
        - 低
        - 公开证据能确认融资和产品动能，但缺少把叙事折成价值的收入质量分母。
        - 需要更深尽调，才能把兴趣转成信心。
      - - 风险评级
        - 高
        - 高端硬件、强制订阅、AI 功能信任风险和未经验证的监管上行，都会放大下行情景分散度。
        - 以底部保护测算，而不是押注高端增长乐观情景。
      - - 估值态度
        - 偏高
        - 在 $1.5B 估值下，除非当前收入已接近假设上沿且经常性经济性异常强，否则隐含销售倍数仍偏高。
        - 没有私有收入和利润率证据前，避免按高于 2026 年 3 月估值入场。
      - - 入场纪律
        - 尽调后优先选择不高于当前估值入场
        - 只有尽调证明会员留存强、毛利组合健康且优先权可控，当前轮价格才可接受。
        - 争取信息权、下行保护和估值纪律，不要为速度让步。
      - - 上调触发项
        - 达到上市公司级别的信息披露包
        - 从「跟踪」转向「买入」前，需要收入桥、队列留存、毛利率拆分和股权结构清算瀑布。
        - 缺少这些材料，上行空间过度依赖假设。
    notes: 表中判断色彩较强，因为建议很大程度取决于未披露内容，也取决于已披露内容。
