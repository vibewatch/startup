        blocks:
          - type: paragraph
            body: >-
              Eight Sleep 客户经济账中有吸引力的一面，是一个家庭内部存在多条可行扩张循环：首次购买 cover 之后，可以扩展到 Base、Blanket、 Pillow Cover、更高 Autopilot
              档位，以及可能由 HSA 或 FSA 支持的健康用例，例如更年期支持。到 2026 年 3 月，全球覆盖扩大到 34 个国家；2026 年 4 月随中国发布又增至 35
              多个国家。公司称这是历史上最大的一次市场扩张，并新增 JD.com、Tmall 和 WeChat 作为 DTC 渠道。2026 年 3 月的 IRONMAN Europe 合作强化了运动员获客循环：Eight
              Sleep 在欧洲铁人三项赛事现场激活，触达 100,000 多名 IRONMAN 运动员，并点名 Kristian Blummenfelt 和 Tadej Pogačar
              为精英用户。风险在于，多数公开证据仍聚集在一小组买方画像 和每个地区单一自有 DTC 渠道上。公开证明集中在愿意购买睡眠科技、接受经常性软件费、并容忍卧室里接入 app 系统的富裕家庭。 评测者反复质疑 Pod
              4 用户是否应该升级到 Pod 5，这削弱了硬件刷新叙事。同时，本章没有找到按地域、渠道、订阅档位或队列拆分客户的公开数据，
              也没有公开企业或保险公司客户名册。结果不是经典的大客户集中，而是细分人群集中、直营渠道依赖，以及耐久性可见度不足。
