    title: 工作流 / 使用场景表
    columns:
      - 用户任务
      - 当前做法
      - Eight Sleep 解决方案
      - 已发布收益 / 信号
      - 限制
    rows:
      - - 在稳定温度下入睡
        - 手动调 HVAC、被褥或风扇
        - Pod 整夜自动为两侧降温或加热
        - 官方页面宣传 55°F–110°F 双侧控制和全身热覆盖
        - 舒适度主张大多来自公司口径，缺少独立基准
      - - 不吵醒伴侣地减少打鼾
        - 打鼾造成打扰后才发现，再手动换姿势
        - Base 检测打鼾振动并自动抬高头部
        - Eight Sleep 宣传打鼾最多减少 45%，并提供每日打鼾报告
        - 具体感知方法和误报率公开材料没有量化
      - - 不用响亮手机闹钟醒来
        - 使用床头闹钟或可穿戴震动
        - 热感和震动闹钟通过 Pod 生态运行
        - 应用商店页面描述热唤醒和胸部高度震动唤醒
        - 闹钟流程仍依赖 App 和订阅
      - - 追踪睡眠和健康趋势
        - 使用可穿戴设备或手动日志
        - App 报告睡眠阶段、心率、HRV、呼吸趋势和 Health Check 异常值
        - 应用商店页面和 Health Check 博客突出夜间报告和异常值提示
        - Health Check 的健康输出不能替代医疗级诊断
      - - 协调需求不同的两名睡眠者
        - 在室温或寝具上妥协
        - 两个档案和分区温控让两侧独立运行
