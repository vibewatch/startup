      - number: '7.5'
        title: 缓解措施、终止标准与尽调问题
        blocks:
          - type: paragraph
            body: >-
              公开可见的缓解措施确实存在。Eight Sleep 有详细隐私政策、能缓解价格摩擦的现行分期计划、明确退货政策、已发布保修条款，以及故障后用于有限本地控制的 Bluetooth 备援。2026
              年融资轮和自由现金流为正披露也降低了近期偿付焦虑。但公司仍留下多个投资关键问题没有回答。公开材料没有 RMA 或漏水率序列， 没有清晰准备金历史，没有披露分期附加率，也没有详细 FDA
              申报时间表。这些遗漏重要，因为投资逻辑可能通过几条可测路径破裂：又一次导致床控失效的故障、 FDA
              延迟使支撑估值的预测健康上行空间消失、虚假折扣案出现重大和解、失去有吸引力的分期方案，或在可见投诉流存在的情况下仍无法量化保修暴露。 因此，正确的尽调立场不是 Eight Sleep
              已经坏掉，而是：只有管理层能把这些公开症状转化为量化的内部运营指标和可信控制证据，这家公司才可投资。
