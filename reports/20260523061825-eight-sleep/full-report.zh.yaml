  - id: FO002
    title: 公司快照逻辑
    type: flow
    layout: standard
    summary: |
      Eight Sleep 的价值链把 DTC 硬件、强制软件订阅和不断扩大的 AI 健康数据层连在一起；云依赖风险、订阅争议和未经验证的医疗监管路径共同限制这条链。
    data:
      nodes:
        - id: hardware
