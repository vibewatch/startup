      - number: '4.3'
        title: 近期融资和 2025 年现金流说法改善了资本叙事，但公开流动性仍未知
        blocks:
          - type: paragraph
            body: >-
              最强的公开资本信号来自近期融资，而不是资产负债表披露。TechCrunch 和 Business Wire 称，Eight Sleep 在 2026 年 3 月 以 $1.5 billion 估值完成 $50
              million 战略轮，此前还在 2025 年 8 月完成 $100 million Series D，并在 2021 年完成 $86 million Series
              C。公开的资金用途口径也偏正面：管理层称资金将投向预测模型研发、临床和监管路径、 全球合作，多家来源还称公司 2025 年已实现自由现金流为正。这组信号说明，Eight Sleep 对融资的依赖已经低于典型的
              风投烧钱案例。但投资人仍看不见核心流动性桥。公开数据库在累计融资、员工数，甚至当前收入规模上互相冲突。更重要的是， 留存来源没有一个披露现金余额、现金跑道月份、债务义务、毛利率或契约条款细节。因此，Eight
              Sleep 已不再明显像缺钱的公司， 但公开证据仍只能支持谨慎结论：资本充足性看起来改善了，但可验证性还不足以在没有管理层资料室访问权的情况下支撑投资判断。
