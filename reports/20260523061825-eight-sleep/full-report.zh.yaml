    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、创立与商业模式
        blocks:
          - type: paragraph
            body: >
              Eight Sleep 是一家美国健康科技公司，率先把「睡眠健身」商业化：它把主动水循环温控硬件、 内置生物识别传感器、云端 AI 和经常性软件订阅整合进一套床系统。公司 2014 年创立于 California
              州 San Francisco，运营总部在 New York City。Eight Sleep 自称「全球第一家睡眠健身公司」， 把床定义为预防性健康平台，而不是被动家具。

              核心产品线是 Pod——一款水冷床垫套，可覆盖在任何现有床垫上，连接床边 Hub，并通过 Eight Sleep app 通信。2025 年 5 月发布的 Pod 5 起售价
              $2,849，是当前旗舰系统。它包含水动力 Blanket、 带内置环绕声的电动 Base（检测到鼾声时会自动抬高头部），以及 55°F 到 110°F 的双区温控。
              床垫套中的内置传感器可被动追踪睡眠阶段、心率、心率变异性、呼吸频率和动作，不要求用户佩戴任何设备。 官网临床宣称用户入睡最多可加快 44%，深睡增加 34%，鼾声减少 45%。

              Eight Sleep 直接面向消费者销售硬件，并绑定强制性持续订阅。硬件通过 eightsleep.com 销售； 截至 2026 年，订阅档位从 $17/month（Standard）到
              $25/month（Enhanced）再到 $33/month（Elite），解锁 Autopilot AI、健康分析和保修延长。值得注意的是，Eight Sleep 在 2023 年 2
              月引入这项强制订阅，并追溯锁住了此前 Pod 用户无需付费即可使用的功能； 该政策引发持续用户反弹，尽调必须计入。公司还销售与医生 Peter Attia 合作开发的补剂， 并在 2022 年收购健康教练公司
              Span Health。
