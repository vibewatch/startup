      - CV042
      - CV045
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 收入桥
        - 当前年化收入在硬件、会员、配件以及任何企业或医疗试点之间的拆分
        - 需要用它把 $1.5B 价格换算成真实销售倍数和增长判断。
        - 管理层资料室 / 财务尽调
      - - 会员留存
        - 队列流失、续费、附加率和 ARPU 数据
        - 决定经常性收入是护城河，还是额外摩擦层。
        - 增长 / 订阅分析复核
      - - 毛利组合
        - 硬件利润率、订阅利润率、综合毛利率，以及保修或服务负担
        - 决定 Eight Sleep 应拿医疗科技式溢价，还是被打硬件折扣。
        - 财务尽调加单位经济性拆解
      - - 股权结构表与优先权
        - 清算优先权、参与权、反稀释条款和员工期权摊薄压力
        - 没有清算瀑布，私募轮估值不等于普通股回报。
        - 法务尽调 / 股权结构表复核
      - - 监管证据
        - 睡眠呼吸暂停功能的 FDA 申报标识、研究设计、终点和商业化路径
        - 医疗期权是上行情景的重要部分，但目前还未获批。
        - 由律师或顾问做监管尽调
      - - 客户信任
        - NPS、退货率、投诉趋势、AI 治理流程和宕机整改指标
        - 高端估值取决于持久付费意愿，以及用户对健康场景品牌的信任。
        - CX 尽调、评价抽样和产品治理复核
    notes: 每项问题都直接连着可能改变建议或估值态度的变量，而不是泛泛的好奇项。
    claimRefs:
      - CV032
      - CV040
      - CV041
      - CV042
      - CV043
      - CV044
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: |
      Eight Sleep 公开时间线从 2014 年创立、2015 年众筹开始，随后经历十年硬件代际发布、三次后期融资，以及 2025-2026 年一组负面事件；尽调必须把这些事件纳入公司核心叙事。
    data:
      items:
        - date: '2014'
          label: 创立于旧金山
          detail: 四位联合创始人确立睡眠健身概念。
          tone: positive
        - date: '2015'
          label: 众筹活动
          detail: 首个产品迭代在 VC 进入前获得消费者需求验证。
          tone: positive
        - date: '2018'
          label: Series B（$14M）；Khosla 加入
          detail: 首次获得大型机构 VC 背书；硬件制造开始规模化。
          tone: positive
        - date: '2019'
          label: Pod 产品线发布
          detail: 主要收入驱动；到 2025 年累计销售额 $500M+。
          tone: positive
        - date: 2021-08
          label: Series C 轮（$86M，估值约 $500M）
          detail: Valor 领投；SoftBank、Khosla、Founders Fund、General Catalyst 跟投。
          tone: positive
        - date: 2023-02
          label: 强制订阅推出
          detail: 原本免费的功能改入付费墙；客户大范围反弹。
          tone: warning
        - date: 2025-05
          label: Pod 5 发布（$2,849 起）
          detail: 当前旗舰，配备水循环毯、环绕声和 AI 健康检查。
          tone: positive
        - date: 2025-08
          label: Series D 轮（$100M；估值约 $1B）
          detail: HSG 领投；Founders Fund、Valor、YC、Atreides 以及体育界人士跟投。
          tone: positive
        - date: 2025-10
          label: AWS 中断——床体过热
          detail: 云依赖暴露；CEO 道歉；公司承诺离线模式，但进度延后。
          tone: warning
        - date: 2026-03
          label: Series D-II 轮（$50M，估值 $1.5B；独角兽）
          detail: Tether 领投确认独角兽身份；覆盖 34+ 个国家；2025 年 FCF 转正。
          tone: positive
        - date: 2026-05
          label: AI 建议争议
          detail: AI 摘要因不安全健康说法受批；排行榜引发反弹。
          tone: warning
