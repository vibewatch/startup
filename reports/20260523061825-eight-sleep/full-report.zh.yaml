  - id: FM004
    title: Eight Sleep 消费者采用漏斗
    type: funnel
    layout: standard
    summary: |
      展示从意识到睡眠问题的美国成年人到付费订阅者的逐层收窄。每一层都是结构性转化挑战；考虑到 2023 年追溯政策引发反弹，订阅门槛是风险最高的转化点。
