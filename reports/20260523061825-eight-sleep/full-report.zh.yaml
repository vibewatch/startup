      - number: '7.3'
        title: 运营、质量与云依赖风险
        blocks:
          - type: paragraph
            body: >-
              最清楚的运营风险证明是 AWS 故障，因为它显示 Eight Sleep 的核心客户体验会以物理方式失效，而不只是数字服务失效。多家媒体报道了闹钟、 温度过冷或过热、床位姿态问题；公司则回应称将推出
              Bluetooth 断网模式。这是有意义的缓解，但还不是完整降险：公开描述的备援仍只恢复一小组功能。 硬件栈也带来耐久性风险。Eight Sleep
              自己的保修设置了两年基础覆盖期，更长保护被付费会员锁定。独立评测反复把该产品描述为高成本、 重订阅，并依赖 app 和 hub；BBB 投诉显示支持纠纷有可测量的流量，且至少有一个横跨多代 Pods
              的详细重复漏水叙事。这些都不能证明系统性缺陷率， 但足以证明，保修、更换、云可靠性和客服运营是业务经济账的核心，而不是边缘案例。尽调缺失的是队列级故障率和准备金数据。
