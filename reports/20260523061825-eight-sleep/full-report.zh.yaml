      - number: '5.4'
        title: 信任、质量与技术风险
        blocks:
          - type: paragraph
            body: >-
              Eight Sleep 有信任和质量信号，但这些信号在公开材料中的分布并不均衡。正面看，公司发布了正式保修条款，app 政策明确覆盖睡眠数据和 电子身体监测数据，Pod 和 Base 有专利标识，FCC
              文件也确认了 Pod 4 的无线电硬件类别和制造商。公开产品页还把止鼾和健康监测的 用户侧逻辑解释得足够清楚，能看懂工作流。风险在于，同一批官方页面没有公布联网服务的安全认证、正常运行时间承诺或数据驻留声明，
              对呼吸和心血管监测背后的具体传感器栈或验证方案也只做了部分说明。社区工具提供了另一层风险视角：高级用户今天可以逆向未公开端点， 但缺少稳定公开
              API，且存在速率限制，意味着集成可能失效或长期得不到支持。这组信号让核心护城河有吸引力，也意味着技术尽调不能只看纺织硬件， 还要花时间验证服务可靠性、隐私运营和集成耐久性。
