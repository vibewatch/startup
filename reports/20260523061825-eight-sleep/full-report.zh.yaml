  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义
        blocks:
          - type: paragraph
            body: >
              界定 Eight Sleep 的可触达市场，至少要在三个不可互换的框架中选择：狭义智能床垫硬件市场、 广义睡眠科技设备宇宙，以及高端床垫层级。每个框架都会给出差异极大的总可用市场（TAM）数字，
              并对竞争强度、替换周期风险和增长轨迹得出不同含义。

              狭义智能床垫框架（Global Market Insights，2026 年 1 月）把市场定义为带嵌入传感器、 主动温控或连接功能的消费与酒店智能床。该框架给出 2026 年全球市场 $1.87B，2035
              年达到 $3.34B， 对应 CAGR 6.6%。2025 年，Eight Sleep、Sleep Number、Emma Sleep、Somni Group International 和 Hilding
              Anders 合计约持有该市场 30%，其中 Sleep Number 以 8%+ 份额领先。这个框架是评估 Eight Sleep 硬件业务最站得住脚的可比口径，因为它与 Eight Sleep
              共享单位经济和竞争集合。

              广义睡眠科技设备框架把 Eight Sleep 视为非穿戴睡眠追踪平台，与 Oura Ring、Withings、Samsung、 Apple Watch 以及临床 CPAP/APAP
              设备竞争。在该口径下，2026 年 TAM 介于 $27B（Coherent Market Insights） 到 $32B（Global Market Insights / Research Nester）再到
              $31.35B（SNS Insider）。在这一宇宙中， 可穿戴设备占收入 57%，非穿戴设备——也就是 Eight Sleep 的精确细分——预计 2026–2035 年 CAGR 16%，
              是增长最快的子细分。这个框架抬高 TAM，但夸大了可触达集合，因为 Eight Sleep 无法替代智能手表的移动监测。

              高端床垫框架把 Eight Sleep 放在 Tempur-Pedic、Purple、Saatva 和其他高端 DTC 品牌旁边， 参照美国床垫市场 2026 年估计 $18.95B，以及全球奢华 /
              高端床垫市场 $18.7B。Eight Sleep Pod 5 起价 $2,849，高于专用床垫均价（NapLab 估算 $2,167），因此在该框架中属于高价层级产品。不过 Pod
              覆盖在现有床垫上，部分绕开更换周期；消费者仍需另行拥有或购买床垫，限制了直接替代。

              最站得住脚的可服务市场（SAM）把智能床垫框架与家庭收入筛选结合：年收入超过 $100,000 的美国家庭——按 Census 估计约 37M 户——构成 Eight Sleep
              的主要国内可服务市场。假设该群体年转化率 1–2%， 仅美国的可获取市场（SOM）上限就是每年 370K–740K 台，按 Pod 5 定价折合硬件收入约 $1B–$2B。
              这个自下而上的框架由作者推导，尚未得到独立验证；它高度依赖收入弹性、重复升级行为，以及强制订阅带来的流失。
