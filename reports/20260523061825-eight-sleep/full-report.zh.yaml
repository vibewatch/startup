        - 私营；2026 年有 2.5M+ 会员、估值 $10.1B
        - 基于腕带的睡眠、恢复、负荷和健康平台
        - 每年 $199-$359 会员，含硬件
        - 经常性参与模型强，恢复叙事覆盖更广
        - 没有床端干预，仍需持续订阅支出
    notes: 各行覆盖审阅的 2025-2026 年公开证据中可见的主要直接智能床同业、加装式温控系统和规模化穿戴设备。价格单元格在可用时使用公开标价；公开价格透明度弱的地方，明确标注询价缺口。
