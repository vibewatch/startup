        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              Eight Sleep 的客户群更应理解为高端 DTC 家庭，而不是具名企业账户。买方和付款方通常是同一个家庭：先为 cover、hub 和可选配件支付数千美元， 再承诺持续支付 Autopilot
              订阅。用户可以是单个睡眠者，但公开证据显示，最强、最反复出现的契合点是温度偏好不一致的双人家庭： 官方页面、iOS app、Reader’s Digest 和 The Verge
              都强调双区控制、独立闹钟和两个档案。由此再分出多个高支付意愿子群： 怕热睡眠者、伴侣、更年期和潮热人群、优化恢复的运动员，以及被数据吸引的 biohacker 或高管用户。明显缺失的是大型酒店、保险公司、
              雇主或医疗系统客户群的公开证明。这个缺口重要，因为它说明 Eight Sleep 的公开牵引力仍像一个消费者高端健康故事，带有用户画像集中风险， 即便单个账户集中度可能较低。
