      - number: '1.3'
        title: 融资历史、投资方与估值
        blocks:
          - type: paragraph
            body: >
              Eight Sleep 的融资历史从 2015 年众筹延续到 2025–2026 年一年内两轮后期融资。公司在 2021 年 8 月完成 $86M Series C，由 Valor Equity Partners
              领投，投后估值约 $500M；SoftBank、Khosla Ventures、 Founders Fund 和 General Catalyst 也参投。具名个人支持者包括运动员 Alex
              Rodriguez、科技人士 Naval Ravikant 和 Kyle Vogt，以及喜剧演员 Kevin Hart。

              2025 年 8 月 19 日宣布的 Series D 融资 $100M，由 HSG 领投，Valor Equity Partners、Founders Fund、 Y Combinator 和 Atreides
              参投。知名体育人物 Charles Leclerc 和 Zak Brown 也参与。Eight Sleep 未披露该轮具体估值，但称较 Series C 的 $500M 基线翻倍，意味着约
              $1B。TechCrunch 按 Crunchbase 数据估计，该轮后累计融资约 $260M。

              Series D-II 于 2026 年 3 月 4 日关闭，由 Tether Investments 领投，以明确的 $1.5B 估值融资 $50M， 使 Eight Sleep 成为独角兽。截至 2026 年
              3 月，TechCrunch 和 Crunchbase 显示累计融资约 $310M。 稳定币公司 Tether 还宣布战略合作，将在其 QVAC 边缘架构上构建 AI 功能。Eight Sleep 报告 2025
              年自由现金流转正； 结合公司首次披露这一里程碑，说明规模化后的单位经济可能正在改善。
