  - id: FE003
    title: 关键依赖图
    type: dag
    layout: wide
    summary: Eight Sleep 不只靠睡眠硬件本身，还依赖制造、移动端 / 云端软件、可穿戴平台数据导入，以及不受官方支持的社区集成。
    data:
      nodes:
        - id: eight-sleep-core
          label: Eight Sleep 平台核心
          detail: 产品设计、Autopilot 逻辑、会员体系和移动端体验都由其掌控。
        - id: manufacturer
          label: BoShiJie 制造
          detail: 公开 FCC 材料把中国惠州的一家第三方制造商列为 Pod 4 硬件制造方。
        - id: customer-home
          label: 客户家中安装
          detail: 卧室里需要已有床垫、电源、Wi-Fi，并完成 App 引导设置。
        - id: mobile-app
          label: iOS / Android 应用
          detail: 设置、报告、闹钟和持续自动化主要都在这个官方支持界面完成。
        - id: membership
          label: Autopilot 订阅
          detail: 核心自动化和 Health Check 等新功能要靠订阅长期保持可用。
        - id: health-platforms
          label: Apple Health / Google Health Connect 数据接口
          detail: 为预测型 Autopilot 4.0 提供来自其他设备和日间活动的上下文。
        - id: community-api
          label: 社区集成层
          detail: 非官方工具可以调用未公开端点，但会遇到限流和接口变更风险。
      edges:
