            body: >-
              公开设计说明和专利更支持“水循环 + 软件”架构，而不是简单的电阻加热毯。hub 被描述为控制中心，负责让冷水或热水在 cover 中循环， 并容纳水箱、泵、热管理引擎、连接硬件和处理芯片。Eight Sleep
              的 2024 年 hub 改版明确提到更强的固态热泵和新的散热器； Pod 4 Ultra 发布报道也强化了同一信息：公司在同步改善制冷能力、噪声和身体姿态。软件侧，Autopilot 位于硬件之上，是决策层：
              官方页面称它用生物识别和环境信号个性化温度，第三方 2026 年报道则称 Autopilot 4.0 现在会导入 Apple Health 或 Google Health Connect
              的日间情境来做预测性调整。结果是一种垂直一体化运行模型：热管理硬件、睡眠传感、机器学习和移动软件全部耦合在一起。
