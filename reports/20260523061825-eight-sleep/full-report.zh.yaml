  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重性排序的风险概览
        blocks:
          - type: paragraph
            body: >-
              Eight Sleep 的残余风险不是单一产品 bug，而是高端消费硬件模式、经常性订阅经济、敏感生物识别数据采集，以及新扩张的预测健康叙事之间的相互作用。 公司现在把一笔昂贵的床周边硬件购买，与 app
              控制、持续会员费、云端依赖和用于降低标价冲击的分期方案组合在一起。这套栈带来多项耦合风险。 第一，消费者保护暴露真实存在：公司已面对一起虚假折扣集体诉讼，而 FTC
              的负面选项规则和加州自动续订法都提高了监管方对经常性付款、取消流程和 促销定价的审查。第二，运营可靠性风险已经被证明，不是假设，因为 2025 年 10 月 AWS 故障可见地扰动了正在使用的床。第三，
              Eight Sleep 当前的缓解叙事并不完整：两年之外的保修延长取决于持续会员，断网模式只恢复有限的 Bluetooth 控制，公开缺陷率披露缺席。 第四，2026 年融资和面向 FDA
              的健康推进可能增加上行空间，但也扩大了监管、执行和资本承诺面。
