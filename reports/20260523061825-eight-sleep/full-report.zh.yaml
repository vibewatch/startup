      - number: '1.4'
        title: 里程碑、产品历史与负面事件
        blocks:
          - type: paragraph
            body: >
              Eight Sleep 的产品与融资历史，从 2014 年创立延续到十年硬件迭代和多次融资事件。2015 年最早的众筹验证了市场。 2018 年 Series B 融资约 $14M，Khosla Ventures
              参与。Pod 产品线于 2019 年推出，并成为公司主要收入驱动； 截至 2025 年 8 月，Pod 累计销售额超过 $500M。公司从「Eight」更名为「Eight Sleep」，并接入 Amazon
              Echo 设备。2022 年收购健康教练公司 Span Health，扩展服务层。Pod 4 于 2024 年发布， Pod 5 随后在 2025 年 5 月推出。

              负面事件记录在尽调中需要明确覆盖。2023 年 2 月，Eight Sleep 推出强制订阅，并追溯把现有设备上此前免费的功能 置于付费墙之后，引发持续用户反弹和长期差评。2025 年 10 月 20 日，AWS
              故障导致美国各地 Eight Sleep Pod 过热——部分达到 110°F——且无响应；用户无法降温或调整床位。CEO Franceschetti 在 X 上公开道歉，并承诺推出 离线备用功能，但
              Wikipedia 报道称截至 2026 年 1 月，承诺功能尚未上线生产环境。2025 年 3 月，集体诉讼 （Chopra et al. v. Eight Sleep, Inc., Case
              5:25-cv-02808, N.D. Cal.）提起，指控其折扣定价做法违反 California 法；案件于 2025 年 9 月终止。2026 年 5 月，Eight Sleep 新推出的 AI
              生成睡眠摘要遭 The Verge 和社区论坛批评，原因是系统据称建议饮酒会减少打鼾——这与既有健康指导相冲突。公司还推出「Sleep Fitness
              Leaderboard」，比较伴侣的睡眠统计，用户认为这是对休息的不受欢迎的游戏化。
