  - id: section-leadership
    title: Founders, Leadership, and Governance
    body: >
      Eight Sleep was co-founded by four individuals whose backgrounds span law, entrepreneurship,
      and engineering. Matteo Franceschetti, an Italian-born entrepreneur, serves as CEO and is
      the most visible public face of the company; he communicates directly with customers on X
      and is the primary spokesperson in fundraising announcements. Alexandra Zatarain, also a
      co-founder, is VP of Brand and Marketing and has been referred to as CMO in TechCrunch
      coverage; her role makes her the principal external voice on product positioning and health
      data privacy. Massimo Andreasi Bassi is co-founder and CTO. Andrea Ballarini is credited as
      a co-founder in Wikipedia and TechCrunch, though he is less prominent in recent press.

      Key-person risk is concentrated on Franceschetti. He personally issued the public apology
      for the October 2025 AWS outage, negotiated the Series D and Series D-II terms, and is the
      named CEO in every major investor announcement. Eight Sleep has not publicly disclosed the
      full composition of its board of directors; Valor Equity Partners' Antonio Gracias joined
      the board in connection with the 2021 Series C, but no current board slate has been
      independently verified. Governance structure beyond the standard private-company VC
      arrangements is not on the public record. The CFO role (reportedly Nicolas Chammas per
      third-party databases) has not been independently confirmed from primary sources, and should
      be treated as an open diligence item. Board independence, protective provisions, and voting
      rights are all non-public.
    claimRefs:
      - CO009
      - CO010
