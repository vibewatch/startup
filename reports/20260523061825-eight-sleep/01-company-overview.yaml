callouts:
  - calloutType: risk
    title: Cloud dependency is a verified product liability
    body: >-
      The October 2025 AWS outage proved that Eight Sleep pods have no local fallback; beds
      overheated at 110°F and became unresponsive. The promised offline mode was still not in
      production as of January 2026. Any investor or buyer must treat cloud dependency as a
      material operational and reputational risk, especially as the company pursues medical-grade
      positioning.
    claimRefs:
      - CO032
      - CO033
      - CO034

  - calloutType: risk
    title: Mandatory subscription created lasting customer trust deficit
    body: >-
      The February 2023 retroactive subscription rollout paywalled features users had paid for
      upfront. Third-party reviews and community forums show persistent negative sentiment. The
      AI health advice controversy in May 2026 compounds this: if Eight Sleep's core value
      proposition shifts to health intelligence, it cannot afford repeated trust incidents.
    claimRefs:
      - CO026
      - CO037
      - CO038

  - calloutType: strength
    title: Free cash flow positivity at scale is an underappreciated milestone
    body: >-
      Eight Sleep's declaration of FCF positivity in 2025 — alongside two late-stage financing
      events and 34+ country distribution — suggests the hardware-plus-subscription model has
      achieved sufficient scale to self-fund operations. This materially reduces the dilution
      risk of future rounds and strengthens the company's negotiating position with investors
      and medical partners.
    claimRefs:
      - CO020
      - CO022
      - CO023

  - calloutType: insight
    title: Tether partnership introduces crypto-adjacent reputational and compliance exposure
    body: >-
      Tether Investments, the investment arm of the stablecoin issuer Tether, led the $50M Series
      D-II. Eight Sleep gains QVAC edge-AI collaboration and a valuation-affirming unicorn round,
      but must absorb due diligence scrutiny about AML/KYC exposure, regulatory optics, and any
      contractual obligations embedded in the "strategic" framing of the investment.
    claimRefs:
      - CO016

