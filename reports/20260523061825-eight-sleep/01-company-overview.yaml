  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: financials and unit economics
      missingEvidence: >-
        Eight Sleep's annual revenue, gross margin, contribution margin per Pod, and burn rate;
        the ~$146M 2025 revenue figure cited in third-party databases has not been confirmed by
        the company and should be treated as an estimate.
      whyItMatters: >-
        Without gross margin and unit economics, the sustainability of the hardware-plus-subscription
        model cannot be independently assessed. The path to profitability and capital efficiency
        depend on these undisclosed metrics.
      diligencePath: >-
        Request audited financials from management; seek cohort-level revenue split between
        hardware and subscription; review any Form D or state securities filings.
      relatedQuestionRefs:
        - QO018
        - QO027

    - type: private-evidence-only
      severity: material
      topic: governance structure and cap table
      missingEvidence: >-
        Full board composition, investor voting rights, protective provisions, anti-dilution terms,
        and cap table percentages post-Series D-II dilution; CFO identity unconfirmed from primary
        sources.
      whyItMatters: >-
        Without governance structure details, the ability of investors to influence direction or
        remove management cannot be evaluated. The Tether strategic investment also introduces
        new governance complexities that require primary-source confirmation.
      diligencePath: >-
        Request cap table, board charter, voting rights summary, and most recent shareholder
        agreement; confirm CFO from primary company-authored source.
      relatedQuestionRefs:
        - QO024

    - type: missing-source
      severity: minor
      topic: headcount as of May 2026
      missingEvidence: >-
        Eight Sleep has not publicly disclosed its employee count since the 100+ FTE figure in
        August 2025 press coverage. The ~125 estimate used in the snapshot table is derived from
        third-party HR databases and has not been confirmed by the company.
      whyItMatters: >-
        Headcount change since August 2025 would indicate whether the Series D capital has been
        deployed in team expansion or retained for product/R&D investment, both relevant to
        burn-rate assessment.
      diligencePath: >-
        Request headcount from management; cross-reference with LinkedIn employee count trends
        as a directional proxy.
      relatedQuestionRefs:
        - QO010

    - type: missing-source
      severity: moderate
      topic: offline mode production release status
      missingEvidence: >-
        Eight Sleep has not issued any public statement confirming production release of the
        offline mode promised after the October 2025 AWS outage. Wikipedia flagged the gap as
        of January 2026 and the March 2026 Series D-II materials make no reference to it.
      whyItMatters: >-
        Cloud dependency is a product liability and a medical-positioning risk if Eight Sleep
        pursues FDA clearance for health-monitoring features. A still-absent offline mode is a
        diligence flag for enterprise and health-system buyers.
      diligencePath: >-
        Request technical documentation of Outage Access feature rollout; review support
        community forums and app release notes for production confirmation.
      relatedQuestionRefs:
        - QO028

