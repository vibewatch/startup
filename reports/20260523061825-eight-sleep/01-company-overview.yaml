  - id: section-milestones
    title: Milestones, Product History, and Adverse Events
    body: >
      Eight Sleep's product and financing history runs from a 2014 founding through a decade of
      hardware iteration and multiple financing events. The original crowdfunding campaign in 2015
      validated the market. A Series B raised approximately $14M in 2018 with Khosla Ventures.
      The Pod product line launched in 2019 and became the company's primary revenue driver;
      cumulative Pod sales exceeded $500M as of August 2025. The company rebranded from "Eight"
      to "Eight Sleep" and integrated with Amazon Echo devices. A health coaching acquisition
      (Span Health, 2022) expanded the service layer. Pod 4 launched in 2024, followed by Pod 5
      in May 2025.

      The adverse event record requires explicit coverage in diligence. In February 2023, Eight
      Sleep introduced a mandatory subscription that retroactively paywalled previously free
      features on existing devices, generating sustained user backlash and lasting negative
      reviews. On October 20, 2025, an AWS outage caused Eight Sleep pods across the United
      States to overheat — some reaching 110°F — and become unresponsive; users were unable to
      cool or reposition their beds. CEO Franceschetti apologized publicly on X and promised an
      offline fallback feature, but Wikipedia reported as of January 2026 that the promised
      feature had not been released to production. In March 2025, a class action lawsuit (Chopra
      et al. v. Eight Sleep, Inc., Case 5:25-cv-02808, N.D. Cal.) was filed alleging false
      discount pricing practices under California law; the case was terminated in September 2025.
      In May 2026, eight Sleep's new AI-generated sleep summaries drew criticism from The Verge
      and community forums after the system reportedly advised that alcohol consumption reduced
      snoring — contradicting established health guidance. The company also rolled out a "Sleep
      Fitness Leaderboard" comparing partners' sleep statistics, which users described as
      unwelcome gamification of rest.
