  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: defect-incidence
    missingEvidence: Installed-base failure rates, RMA rates, leak-replacement cohorts, and warranty reserve history.
    whyItMatters: Public complaints prove failure modes exist, but without cohort-level incidence the investor cannot size margin drag, replacement liability, or whether issues are isolated or systemic.
    diligencePath: Request quarterly RMA data by Pod generation, leak root-cause analysis, warranty reserve policy, and any board-quality reliability dashboard.
    relatedQuestionRefs:
    - QR027
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: financing-attachment-rate
    missingEvidence: Share of orders financed through external installment partners, approval rates, and any subsidy cost borne by Eight Sleep.
    whyItMatters: The product is expensive and heavily marketed on monthly payment terms, so attachment-rate opacity makes it hard to judge conversion sensitivity if lender appetite weakens.
    diligencePath: Request checkout mix by payment method, lender concentration, subsidy economics, and any recent decline in approval rates or promotional APR support.
    relatedQuestionRefs:
    - QR028
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: fda-filing-status
    missingEvidence: Exact FDA filing number, submission stage, study endpoints, predicate strategy, and management’s expected decision timeline.
    whyItMatters: Health-device upside is part of the valuation narrative, but without filing-stage detail investors cannot judge approval risk, timing, or whether the clinical roadmap is realistically financeable.
    diligencePath: Request the current regulatory plan, pre-submission correspondence, study design, advisor roster, and updated milestone calendar for sleep-apnea and related indications.
    relatedQuestionRefs:
    - QR029
    relatedTableRefs:
    - TR001
  - type: missing-source
    severity: material
    topic: security-incident-history
    missingEvidence: A public trust center, independent audit summary, or management incident log confirming whether any health-data or app-security incidents have occurred.
    whyItMatters: Eight Sleep handles sensitive sleep and biometric data, so absence of a documented security history makes it impossible to distinguish a quiet record from a merely undisclosed one.
    diligencePath: Request the last 24 months of incident logs, any breach-notice analyses, penetration-test summaries, cyber-insurance limits, and encryption or key-management architecture.
    relatedQuestionRefs:
    - QR030
    relatedTableRefs:
    - TR002
  - type: enumeration-incomplete
    severity: minor
    topic: regulatory-legal-register-coverage
    missingEvidence: A full internal litigation, regulator, and policy-change register covering all states and foreign markets where Eight Sleep sells or plans to sell.
    whyItMatters: The public risk register captures the main exposed surfaces but cannot prove that no additional consumer, privacy, or IP proceedings exist in the long tail of jurisdictions.
    diligencePath: Request management’s internal legal tracker and outside-counsel summary, then reconcile it against the public register before underwriting reserve or insurance assumptions.
    relatedQuestionRefs:
    - QR029
    relatedTableRefs:
    - TR001
