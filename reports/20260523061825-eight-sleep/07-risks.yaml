company:
  name: Eight Sleep
chapter:
  number: 7
  title: Risks
  summary: 'Eight Sleep’s public risk profile is material across four linked areas: consumer-protection and data-governance exposure, cloud and hardware reliability risk, financing and premium-price dependence, and an execution burden widened by predictive-health ambitions. The strongest public signals are the 2025 false-discount complaint, the AWS outage that disrupted live beds, a two-year base warranty with longer coverage tied to paid membership, and a 2026 funding / FDA narrative that raises both opportunity and regulatory complexity. Public mitigations exist, but strict diligence should still focus on defect rates, financing attachment, and exact FDA-stage evidence before underwriting the health-tech upside.'
sections:
- id: severity-ranked-risk-overview
  title: Severity-ranked risk overview
  body: 'Eight Sleep’s residual risk is not a single product bug; it is the interaction of a premium consumer hardware model, recurring subscription economics, sensitive biometric data collection, and a newly expanded predictive-health narrative. The company now combines an expensive bed-adjacent hardware purchase with app control, ongoing membership fees, cloud dependence, and financing offers designed to reduce sticker shock. That stack creates several coupled risks. First, consumer-protection exposure is real: the company is already facing a false-discount class action, while both the FTC’s negative-option rule and California’s automatic-renewal law heighten scrutiny around recurring payments, cancellation, and promotional pricing. Second, operational reliability risk is proven rather than hypothetical because the October 2025 AWS outage visibly disrupted live beds. Third, Eight Sleep’s current mitigation story is incomplete: warranty extension beyond two years depends on continuing membership,
    outage mode restores only limited Bluetooth controls, and public defect-rate disclosure is absent. Fourth, the 2026 funding and FDA-oriented health push may increase upside, but they also widen the regulatory, execution, and capital-commitment surface.'
