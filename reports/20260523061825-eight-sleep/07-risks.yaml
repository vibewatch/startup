- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Cloud-control dependency
    - Second severe product-control outage
    - Temperature or base control is materially impaired again for live users
    - Treat as thesis-break unless full offline control and incident metrics are produced
  - - False-discount litigation
    - Adverse procedural or settlement outcome
    - Restitution, injunction, or surviving core deception claims
    - Re-underwrite conversion, refund exposure, and marketing-governance cost
  - - FDA / predictive-health roadmap
    - Regulatory delay or rejection
    - Material slip or rejection of the flagship health filing
    - Remove health upside from valuation and lower confidence in roadmap
  - - Reliability and warranty economics
    - No defect or reserve transparency
    - Management cannot quantify RMA, leak, or reserve history during diligence
    - Treat as a hard diligence blocker before committing capital
  - - Financing dependence
    - Checkout financing weakens
    - Promotional APR support disappears or approval rates fall materially
    - Cut demand assumptions on premium configurations
  - - Support and international scale
    - Service quality deteriorates as footprint grows
    - Complaint backlog, replacement times, or regional service failures trend up
    - Pause underwriting of expansion efficiency and margin leverage
  notes: These triggers are intentionally operational and observable; they are designed to stop investment drift caused by an otherwise appealing consumer-health narrative.
