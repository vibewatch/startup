- id: regulatory-legal-and-data-governance-risk
  title: Regulatory, legal, and data-governance risk
  body: 'Eight Sleep’s legal and regulatory stack is unusually broad for a mattress-adjacent consumer company because the product records sleep stages, heart rate, HRV, respiratory rate, and other health-adjacent signals while the company talks publicly about predictive AI for health and FDA pathways. California privacy law already treats biometric and health information as sensitive personal information, and the CPPA continues to implement and enforce that regime. At the federal level, the FTC’s Health Breach Notification Rule matters because it is aimed at vendors of personal health records and adjacent entities, not just hospitals. Consumer-subscription law is also material. The FTC’s negative-option rule and California’s automatic-renewal law both emphasize clear recurring-payment disclosure, acknowledgement, and cancellation. That matters because Eight Sleep combines subscriptions, discount marketing, and financing. The risk is not merely theoretical: the Chopra complaint alleges continuous
    false discounting and California consumer-law violations, while a separate accessibility complaint and an Orion patent case show that Eight Sleep’s public legal exposure is multi-vector. If FDA-facing sleep-apnea claims advance, the compliance perimeter could widen further beyond classic consumer-product law.'
