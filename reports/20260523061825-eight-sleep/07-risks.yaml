- id: mitigations-kill-criteria-and-diligence-asks
  title: Mitigations, kill criteria, and diligence asks
  body: 'Publicly visible mitigations do exist. Eight Sleep has a detailed privacy policy, a live financing program that softens price friction, an explicit return policy, a published warranty, and a post-outage Bluetooth fallback for limited local control. The 2026 financing round and free-cash-flow-positive disclosure also reduce near-term solvency anxiety. But the company still leaves several investment-critical questions unanswered. There is no public RMA or leak-rate series, no clear reserve history, no disclosed financing attachment rate, and no detailed FDA filing timeline. Those omissions matter because the thesis could break through several measurable paths: another outage that disables bed control, an FDA delay that removes the predictive-health upside used to justify valuation, a material settlement in the false-discount case, loss of attractive financing offers, or inability to quantify warranty exposure despite a visible complaint stream. The right diligence stance is therefore
    not that Eight Sleep is broken; it is that the business is investable only if management can convert these public symptoms into quantified internal operating metrics and credible control evidence.'
