  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: Net revenue retention, gross retention, subscription churn, hardware return rates, and renewal by cohort or plan tier.
    whyItMatters: Without true retention metrics, the positive review proxies cannot be converted into durable customer economics.
    diligencePath: Request cohort dashboards by hardware vintage and Autopilot tier, plus monthly cancellation, downgrade, and warranty-claim data.
    relatedQuestionRefs:
    - QU009
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: segment-and-channel-concentration
    missingEvidence: Revenue or order mix by geography, segment, channel, and top referral source, plus share of customers buying add-ons or upgrading generations.
    whyItMatters: The public evidence suggests persona concentration and direct-channel dependence, but not how much either one drives revenue.
    diligencePath: Request a board-style customer mix deck showing orders, revenue, CAC, churn, and accessory attach by country, cohort, and channel.
    relatedQuestionRefs:
    - QU013
    relatedTableRefs:
    - TU001
    - TU005
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: Independent production references or procurement-style validation beyond celebrity testimonials and editorial hands-on reviews.
    whyItMatters: Named household proof exists, but it is too curated to fully validate breadth, repeatability, or enterprise adjacency.
    diligencePath: Request customer reference calls, verified review exports, and any hotel, employer, payer, or provider deployment documents.
    relatedQuestionRefs:
    - QU005
    - QU024
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: minor
    topic: institutional-buyers
    missingEvidence: Public evidence of enterprise, hotel, insurer, employer, or clinical customer deployments with named operators and outcome data.
    whyItMatters: Institutional traction would materially reduce the current dependence on premium consumer households and widen the expansion story.
    diligencePath: Ask management for the commercial pipeline, signed pilots, and any institutional customer case studies tied to measurable outcomes.
    relatedQuestionRefs:
    - QU024
    relatedTableRefs:
    - TU001
    - TU003
