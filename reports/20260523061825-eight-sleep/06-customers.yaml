    - Production-style household use
    - Official testimonial says the Pod reduced hot flashes and overheating
    - Anecdotal and company-curated
  - - Lynn Allendorf
    - Couple with temperature mismatch
    - Dual-zone use for one hot and one cold sleeper
    - Production-style household use
    - Official social quote says thermostat alone did not solve the mismatch problem
    - Anecdotal and company-curated
  - - Charles Leclerc / Taylor Fritz
    - Professional athletes
    - Recovery, performance, and premium sleep optimization
    - Ongoing use or endorsement, not a pilot
    - Company says products are trusted by named athletes
    - Sponsorship or ambassador status is not fully disclosed
  - - Susan Lacke (Triathlete reviewer)
    - Endurance athlete
    - Four-month use during heavy training and perimenopause
    - Long-form hands-on review
    - Reported fewer wakeups and better overnight sleep continuity
    - Media test, not necessarily a normal paid customer
  - - Michael Kummer household
    - Biohacker family / long-term owners
    - More than 1,400 nights of household use across Pod generations
    - Long-term owner use
    - Reports durable sleep-quality gains and gifting an older Pod to friends
    - Affiliate reviewer and not representative of the broad base
  notes: Named proof exists, but much of it is celebrity-heavy or editorial. Eight Sleep has visible household and athlete usage, yet it does not publicly provide the sort of independent production references or procurement records that would fully validate breadth and durability.
