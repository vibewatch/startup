- id: retention-satisfaction-and-failure-modes
  title: Retention, satisfaction proxies, and adverse evidence
  body: 'Public retention evidence is weaker than public adoption evidence. There is no disclosed NRR, GRR, churn, renewal, or cohort curve, so diligence must rely on satisfaction proxies and long-term owner narratives. Those proxies skew positive: the app had 16,000 iOS ratings at 4.7 out of 5, the official couples page displayed 30,215 reviews at 4.5 stars, Sleep Foundation scored the product 8.9 out of 10, BOXROX gave it 88 percent, and Cybernews scored it 4.2 out of 5. Independent owners with 730-plus nights and 1,400-plus nights of use say the core temperature-control value is real. But the adverse evidence is not cosmetic. Kinja, MattressNut, Michael Kummer, and BOXROX all converge on the subscription as the biggest source of regret, especially because canceling strips away most smart features. More importantly, the October 2025 AWS outage showed that customer trust can be damaged quickly when a sleep product depends on cloud connectivity. Eight Sleep added outage mitigation afterward,
    but the event remains a durable signal that product-market fit and reliability are not the same thing.'
