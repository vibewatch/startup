- id: adoption-proof-and-trajectory
  title: Adoption proof, trajectory, and named user evidence
  body: The chapter’s strongest adoption proof comes from a mix of company-disclosed scale indicators and a wide set of independent reviewers. On the official side, Eight Sleep said it had surpassed $500 million in Pod sales by August 2025, grown revenue tenfold since the product launched in 2019, and reached more than 30 countries, then 34 countries by March 2026. Those claims are corroborated directionally across TechCrunch, Business Wire, HLTH, MedCity News, and Engadget, which together show a company expanding internationally while adding Pod 5, a thermal blanket, and a pillow cover. Public customer proof is real, but it is uneven in quality. The wall-of-love provides named users such as Mark Zuckerberg, Bryan Johnson, and couple-specific testimonials, while the athlete set is supported by official references to Charles Leclerc and Taylor Fritz plus third-party athlete reviews. The limiting factor is that most named proof is either company-curated or media-test driven, not procurement-style
    documentation. In other words, Eight Sleep has visible household adoption and strong social proof, but not a deep bench of independently verified production references.
