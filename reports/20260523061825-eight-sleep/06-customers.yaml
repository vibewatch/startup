- id: TU005
  title: Expansion and concentration risk table
  columns:
  - expansion driver
  - concentration risk
  - impact
  - diligence path
  rows:
  - - 'Accessory stack: Base, Blanket, Pillow Cover'
    - Value accrues mainly in households willing to buy the full premium system
    - Raises lifetime value and differentiates the platform from a basic cooling pad
    - Ask for accessory attach rates and attach by customer cohort
  - - Mandatory membership tiers
    - Recurring revenue becomes stronger only if customers accept software lock-in
    - Raises LTV but can also create year-two churn and negative word of mouth
    - Ask for month-13 retention, downgrade rates, and canceled-but-still-active hardware units
  - - International expansion to 34 countries
    - Support, logistics, and regulatory complexity rise faster than brand awareness
    - Adds new markets but can pressure returns, service, and compliance costs
    - Ask for country-level returns, support tickets, and contribution margin
  - - Couples / temperature-mismatch use case
    - Public evidence is heavily concentrated in this household pattern
    - Strong fit and referral potential, but could narrow the effective SAM
    - Ask for share of single-sleeper versus two-sleeper orders
  - - Menopause and health positioning
    - Condition-specific claims invite higher evidence standards and regulatory scrutiny
    - Could unlock HSA/FSA and health budgets if substantiated
    - Ask for conversion, repeat purchase, and physician-referral data by condition
  - - Athlete and influencer halo
    - Celebrity-heavy proof may not scale CAC efficiently into mainstream households
    - Powerful awareness engine, but could overstate everyday-user demand
    - Ask for channel mix, influencer CAC, and referral-driven conversion
  - - Cloud and app dependence
    - Outages or app friction can damage trust in a mission-critical sleep product
    - Can raise support burden and churn even if thermal performance is strong
    - Ask for incident frequency, outage-mode adoption, and support ticket severity
  - - Institutional expansion still sparse
    - Business remains publicly concentrated in premium DTC households
    - Leaves the company with limited diversification away from consumer demand
    - Ask for hotel, provider, payer, or employer pilot pipeline and win rate
  notes: The main risk is not a single giant customer but dependence on a narrow premium-consumer cohort, a recurring-software model, and a mostly owned e-commerce channel. Expansion upside is real, but public disclosure is too thin to size it precisely.
