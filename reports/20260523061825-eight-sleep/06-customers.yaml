tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - segment
  - buyer / user / payer
  - primary use case
  - scale / proof signal
  - revenue or strategic value
  - gap
  rows:
  - - Affluent hot sleepers
    - Household buyer and payer; one primary user
    - Solve overheating or cold discomfort without changing the whole mattress
    - Repeated across official pages and nearly every long-term review
    - Core premium DTC base with willingness to pay for hardware plus software
    - No disclosed demographic or income mix
  - - Couples with different temperature preferences
    - One household pays; two users on separate sides
    - Dual-zone control, separate alarms, and different schedules
    - Official couples page, app, Reader’s Digest, HGTV, and The Verge all reinforce this
    - High referral value and strong fit for add-ons such as Base and Blanket
    - No disclosed share of orders that are two-sleeper households
  - - Menopause / hot-flash sufferers
    - Household payer; symptom-driven user often female
    - Rapid cooling and Hot Flash Mode for nighttime overheating
    - Official clinical-marketing push plus named household testimonial
    - Could expand into HSA/FSA and health-budget spending
    - No public revenue, user-count, or repeat-purchase disclosure by segment
  - - Performance athletes / recovery buyers
    - Household or sponsored user
    - Cooling, recovery optimization, snore mitigation, and sleep analytics
    - Named athlete references plus Triathlete and BOXROX reviews
    - Strong brand halo and influencer reach
    - Sponsorship and editorial testing blur the line between endorsement and paid-customer proof
  - - Biohackers / executives
    - Individual household buyer
    - Sleep optimization, biometrics, and daily performance tracking
    - Wall-of-love includes Zuckerberg, Bryan Johnson, Paul Graham, and other high-visibility users
    - Powerful top-of-funnel awareness among premium buyers
    - Celebrity-heavy proof is not representative of the median customer
  - - International premium consumers
    - Direct household buyer outside the US
    - Import premium sleep tech with app-driven support
    - 34-country shipping footprint and Engadget launch-market list
    - Expands TAM beyond US wellness users
    - No country-by-country revenue, return, or support metrics disclosed
  - - Institutional / clinical buyers
    - Provider, payer, hotel, or employer would pay if this channel matures
    - Future regulated health or hospitality deployment
    - Public proof is sparse relative to DTC proof
    - Potential diversification vector if real
    - No public customer roster or deployment case studies found
  notes: Segmentation combines official product pages, named testimonials, launch coverage, and independent long-term reviews. The public proof set is strongest for DTC households and weakest for institutional channels.
