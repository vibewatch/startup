evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financials and unit economics
    missingEvidence: >-
      Eight Sleep's annual revenue, gross margin, contribution margin per Pod, and burn rate; the ~$146M 2025 revenue
      figure cited in third-party databases has not been confirmed by the company and should be treated as an estimate.
    whyItMatters: >-
      Without gross margin and unit economics, the sustainability of the hardware-plus-subscription model cannot be
      independently assessed. The path to profitability and capital efficiency depend on these undisclosed metrics.
    diligencePath: >-
      Request audited financials from management; seek cohort-level revenue split between hardware and subscription;
      review any Form D or state securities filings.
    relatedQuestionRefs:
      - QO018
      - QO027
  - type: private-evidence-only
    severity: material
    topic: governance structure and cap table
    missingEvidence: >-
      Full board composition, investor voting rights, protective provisions, anti-dilution terms, and cap table
      percentages post-Series D-II dilution; CFO identity unconfirmed from primary sources.
    whyItMatters: >-
      Without governance structure details, the ability of investors to influence direction or remove management cannot
      be evaluated. The Tether strategic investment also introduces new governance complexities that require
      primary-source confirmation.
    diligencePath: >-
      Request cap table, board charter, voting rights summary, and most recent shareholder agreement; confirm CFO from
      primary company-authored source.
    relatedQuestionRefs:
      - QO024
  - type: missing-source
    severity: minor
    topic: headcount as of May 2026
    missingEvidence: >-
      Eight Sleep has not publicly disclosed its employee count since the 100+ FTE figure in August 2025 press coverage.
      The ~125 estimate used in the snapshot table is derived from third-party HR databases and has not been confirmed
      by the company.
    whyItMatters: >-
      Headcount change since August 2025 would indicate whether the Series D capital has been deployed in team expansion
      or retained for product/R&D investment, both relevant to burn-rate assessment.
    diligencePath: Request headcount from management; cross-reference with LinkedIn employee count trends as a directional proxy.
    relatedQuestionRefs:
      - QO010
  - type: missing-source
    severity: moderate
    topic: offline mode production release status
    missingEvidence: >-
      Eight Sleep has not issued any public statement confirming production release of the offline mode promised after
      the October 2025 AWS outage. Wikipedia flagged the gap as of January 2026 and the March 2026 Series D-II materials
      make no reference to it.
    whyItMatters: >-
      Cloud dependency is a product liability and a medical-positioning risk if Eight Sleep pursues FDA clearance for
      health-monitoring features. A still-absent offline mode is a diligence flag for enterprise and health-system
      buyers.
    diligencePath: >-
      Request technical documentation of Outage Access feature rollout; review support community forums and app release
      notes for production confirmation.
    relatedQuestionRefs:
      - QO028
  - type: enumeration-incomplete
    severity: minor
    topic: leadership and founder table completeness
    missingEvidence: >-
      Current board roster beyond the Series C-era Valor board seat, CFO identity from primary sources, and full C-suite
      roster are not publicly documented.
    whyItMatters: >-
      Key-person dependency on the CEO is high; without a full governance roster, succession planning and board-level
      oversight of strategic bets (FDA, Tether partnership) cannot be evaluated.
    diligencePath: >-
      Request current board composition and executive roster from management; confirm CFO role from official company
      communications.
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder or investor map completeness
    missingEvidence: >-
      Stake sizes, post-Series D-II dilution percentages, and secondary market activity for all investors are private;
      SoftBank's continued participation post-Series C has not been confirmed; Tether strategic terms are not publicly
      disclosed.
    whyItMatters: >-
      Without a confirmed cap table, economic concentration and control rights cannot be mapped; the Tether relationship
      introduces crypto-adjacent compliance exposure that requires contractual transparency.
    diligencePath: >-
      Request official cap table, term sheet abstracts for Series D and D-II, and any SoftBank secondary confirmation
      from the company.
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: milestone table completeness
    missingEvidence: >-
      Exact Series B amount, Series A details, crowdfunding campaign total, and precise 2017 rebrand date are not
      documented from primary sources; partnership milestones with healthcare systems or employers are not on the public
      record.
    whyItMatters: >-
      A complete chronology is needed for later chapter authors to reuse without re-researching early-stage history;
      gaps create ambiguity about the company's capital efficiency in early years.
    diligencePath: >-
      Review SEC Form D filings for Series A and B; search archived press releases on BusinessWire and PR Newswire for
      2016-2018.
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: blocking
    topic: revenue
    missingEvidence: >
      Eight Sleep's own revenue, gross margin, churn rate, subscription renewal rate, and customer count are not
      publicly disclosed. All financial metrics are company-claimed or third-party inferred.
    whyItMatters: >
      Without revenue data, TAM penetration, SAM capture, and unit economics cannot be independently validated; the
      $1.5B valuation cannot be benchmarked against real revenue multiples.
    diligencePath: >
      Request audited financials as part of data room access; specifically seek subscription renewal rate, gross margin
      by product line, and international revenue contribution.
    relatedQuestionRefs:
      - QM006
      - QM007
      - QM023
  - type: conflicting-data
    severity: material
    topic: market-sizing-methodology
    missingEvidence: >
      No analyst has published a scope-normalized, methodology-transparent TAM estimate that precisely bounds Eight
      Sleep's serviceable addressable market.
    whyItMatters: >
      The 2x–10x spread between smart mattress ($1.87B) and sleep-tech all-forms ($32B+) estimates makes it impossible
      to independently validate market share claims or growth projections without knowing which scope each investor is
      using.
    diligencePath: >
      Require management to present their own TAM definition with explicit exclusions; compare against GMI January 2026
      narrow-scope estimate as the most defensible floor.
    relatedQuestionRefs:
      - QM021
      - QM027
    relatedTableRefs:
      - TM002
      - TM003
  - type: missing-source
    severity: material
    topic: international-expansion
    missingEvidence: >
      No country-level revenue breakdown, gross margin by geography, or customer count by region has been publicly
      disclosed for Eight Sleep's international operations.
    whyItMatters: >
      Eight Sleep describes 2026 as its "year of scale" for international expansion, but without revenue or customer
      data from EU, UK, and Australia operations, the economic contribution of the international strategy is
      unverifiable.
    diligencePath: >
      Request country-level revenue and unit shipment data; assess GDPR compliance posture and EU operational cost
      structure; verify whether Australian, UK, and EU customers are active or just shipping-eligible.
    relatedQuestionRefs:
      - QM016
      - QM024
      - QM030
  - type: missing-source
    severity: material
    topic: replacement-cycle-smart-beds
    missingEvidence: >
      No primary source documents the upgrade cycle for smart bed consumers specifically (Pod 3 → Pod 4 → Pod 5), which
      may be materially shorter than the 7–10 year conventional mattress replacement cycle if tech obsolescence drives
      earlier upgrades.
    whyItMatters: >
      A shorter upgrade cycle would positively impact Eight Sleep's LTV and hardware revenue cadence; absence of data
      makes this an open assumption in any DCF model.
    diligencePath: >
      Request cohort-level hardware upgrade data from management; specifically the % of Pod 3/4 customers who upgraded
      to Pod 5 within 2–3 years.
    relatedQuestionRefs:
      - QM028
  - type: missing-source
    severity: minor
    topic: menopause-segment
    missingEvidence: >
      No published data exists on Eight Sleep's current sales to menopausal women or to households purchasing
      specifically for night-sweat relief, nor any clinical study of Pod cooling efficacy for vasomotor symptoms.
