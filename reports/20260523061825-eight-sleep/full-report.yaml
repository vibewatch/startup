  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Delivered System and Customer Workflow
        blocks:
          - type: paragraph
            body: >-
              Eight Sleep is not selling a standalone mattress so much as a connected sleep layer that wraps around the
              customer's existing bed. The current Pod 5 cover sits on top of an existing mattress, while optional
              add-ons extend the system into an adjustable base, a hydro-powered blanket, and a separate pillow cover.
              The operational workflow is therefore multi-surface and software-led: the user installs the cover and hub,
              enrolls in Autopilot, sets up one or two sleep profiles in the app, and then lets the system manage
              overnight temperature, alarms, and snore mitigation. Public product and app-store pages consistently
              present the value proposition as dual-side thermal control plus automated adjustment, not just manual
              cooling. This matters for diligence because the delivered product is a recurring-service sleep stack whose
              utility comes from automation, paired-user coordination, and overnight reports rather than from passive
              textile hardware alone.
