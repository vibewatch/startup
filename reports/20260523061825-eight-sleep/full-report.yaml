      - number: '1.3'
        title: Funding History, Investors, and Valuation
        blocks:
          - type: paragraph
            body: >
              Eight Sleep's capital history spans from a 2015 crowdfunding campaign through two late-stage rounds in a
              single year (2025-2026). The company raised an $86M Series C in August 2021 led by Valor Equity Partners
              at approximately $500M post-money valuation, with SoftBank, Khosla Ventures, Founders Fund, and General
              Catalyst also participating. Named individual backers include athlete Alex Rodriguez, tech figures Naval
              Ravikant and Kyle Vogt, and comedian Kevin Hart.

              The Series D, announced August 19, 2025, raised $100M, with HSG leading and participation from Valor
              Equity Partners, Founders Fund, Y Combinator, and Atreides. Notable sports figures Charles Leclerc and Zak
              Brown also participated. Eight Sleep did not disclose a specific valuation for this round but said it had
              doubled from the Series C $500M baseline, implying approximately $1B. TechCrunch estimated total funding
              at approximately $260M after this round per Crunchbase data.

              The Series D-II, closed March 4, 2026 and led by Tether Investments, raised $50M at an explicit $1.5B
              valuation — making Eight Sleep a unicorn. Total funding reached approximately $310M per TechCrunch and
              Crunchbase as of March 2026. Tether, the stablecoin company, also announced a strategic collaboration to
              build AI features on its QVAC edge architecture. Eight Sleep reported it was free cash flow positive in
              2025, which, alongside the company's first statement of this milestone, suggests improving unit economics
              at scale.
