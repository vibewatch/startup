  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer, user, and payer segmentation
        blocks:
          - type: paragraph
            body: >-
              Eight Sleep’s customer base is best understood as premium direct-to-consumer households rather than named
              enterprise accounts. The buyer and payer are usually the same household that pays several thousand dollars
              upfront for the cover, hub, and optional accessories, then commits to a recurring Autopilot subscription.
              The user can be one sleeper, but public evidence shows the strongest and most repeated fit is two-person
              households with mismatched temperature preferences: official pages, the iOS app, Reader’s Digest, and The
              Verge all emphasize dual-zone control, separate alarms, and two profiles. From there, the public segment
              picture branches into high-WTP sub-groups: hot sleepers, couples, menopause and hot-flash sufferers,
              athletes optimizing recovery, and biohacker or executive users drawn to data. What is notably missing is
              public proof of a large hotel, insurer, employer, or health-system customer base. That absence matters
              because it means Eight Sleep’s public traction still reads like a consumer premium-wellness story with
              persona concentration risk, even though individual account concentration is likely low.
