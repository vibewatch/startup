          mix, and manageable preferences.
        - Seek information rights, downside protections, and valuation discipline rather than speed.
      - - Upgrade trigger
        - Public-grade disclosure package
        - >-
          Need revenue bridge, cohort retention, gross-margin split, and cap-table waterfall before moving from track
          toward buy.
