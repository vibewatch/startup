  - id: FE001
    title: Product Architecture Map
    type: stack
    layout: wide
    summary: >-
      Eight Sleep's architecture stacks thermal textiles and motion hardware under a software layer that interprets
      biometric and environmental signals, then exposes results primarily through the consumer app.
    data:
      layers:
        - label: Sleep Surface Layer
          detail: Pod Cover on top of an existing mattress with split thermal zones and embedded sensing functions.
        - label: Accessory Layer
          detail: Base for elevation and sound, Blanket for above-body thermal coverage, and Pillow Cover for head cooling.
        - label: Hydronic / Hub Layer
          detail: >-
            Reservoirs, pumps, thermal engine, connectivity hardware, and processing chips circulate water and execute
            thermal control.
        - label: Automation Layer
          detail: >-
            Autopilot uses sleep-stage, profile, and environment signals to change temperature and, where available,
            elevation.
        - label: Application Layer
          detail: The iOS and Android apps handle onboarding, profiles, reports, alarms, and membership-gated features.
        - label: External Context Layer
          detail: >-
            Apple Health and Google Health Connect now feed predictive Autopilot 4.0 inputs, while unofficial community
            tools sit outside the supported stack.
    claimRefs:
      - CE009
      - CE014
      - CE015
      - CE021
      - CE022
      - CE029
      - CE036
