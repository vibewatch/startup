      - number: '5.2'
        title: Operating Architecture and Automation Layer
        blocks:
          - type: paragraph
            body: >-
              Public design notes and patents support a hydronic-and-software architecture rather than a simple
              resistive heated blanket. The hub is described as the control center that circulates chilled or heated
              water through the cover and houses reservoirs, pumps, the thermal engine, connectivity hardware, and
              processing chips. Eight Sleep's 2024 hub redesign explicitly called out stronger solid-state heat pumps
              and a new heat sink, while launch coverage of Pod 4 Ultra reinforced the message that the company was
              improving cooling power, noise, and body positioning in parallel. On the software side, Autopilot sits
              above the hardware as the decisioning layer: official pages say it personalizes temperature using
              biometric and environmental signals, and third-party 2026 coverage says Autopilot 4.0 now imports daytime
              context from Apple Health or Google Health Connect to make predictive changes. The result is a vertically
              integrated operating model in which thermal hardware, sleep sensing, machine learning, and mobile software
              are all coupled.
