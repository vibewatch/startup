      - number: '7.4'
        title: Partner, capital, and execution risk
        blocks:
          - type: paragraph
            body: >-
              Eight Sleep’s external dependency map is broader than the product marketing suggests. Financing partners
              matter because the company advertises monthly payments and 0% APR framing on a product that can cost
              thousands of dollars before a recurring subscription is added. Cloud and app-platform dependence matters
              because key product features route through the app and hub rather than a fully local control plane.
              Capital markets also matter because management is simultaneously pushing premium hardware refreshes,
              international expansion, and an FDA-linked predictive-health roadmap. The 2026 Tether-led round and
              TechCrunch’s report that the company was free-cash-flow positive in 2025 are helpful mitigations, but they
              do not remove execution strain. In fact, the combination of shipping to more than 30 countries, building
              consumer hardware, supporting high-touch returns and warranties, and funding clinical validation suggests
              a multi-front operating load. The public record does not provide enough detail on payment-mix
              concentration, financing-partner dependence, or the organizational depth behind regulatory and support
              functions. That is why the external-dependency and people-risk tables remain as important as the legal
