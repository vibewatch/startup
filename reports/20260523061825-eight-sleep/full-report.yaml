  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      Five-step path from sleep problem awareness to recurring expansion, with the subscription and app layer acting as
      both moat and failure point.
    data:
      items:
        - label: Problem trigger
          detail: >-
            Hot sleeping, partner temperature mismatch, post-training overheating, hot flashes, or snoring push the
            household to look for an active thermal solution.
          claimRefs:
            - CU002
            - CU017
            - CU032
        - label: Proof gathering
          detail: >-
            Prospects compare official reviews, celebrity and athlete references, app-store ratings, and editorial
            hands-on reviews before buying.
          claimRefs:
            - CU005
            - CU006
            - CU010
            - CU011
            - CU024
        - label: Hardware purchase
          detail: >-
            The buyer enters through a cover-plus-hub sale that fits an existing mattress, helped by free shipping, free
            returns, and a 30-night trial.
          claimRefs:
            - CU004
            - CU030
        - label: Onboarding and daily use
          detail: >-
            The bed is primed with water, two profiles are configured, and Autopilot begins adjusting each side
            independently while the app delivers reports and alarms.
          claimRefs:
            - CU002
            - CU003
            - CU021
        - label: Expansion or churn
          detail: >-
            Satisfied households add accessories or higher software tiers, while frustrated users hit subscription
            fatigue, upgrade skepticism, or outage-related trust issues.
          claimRefs:
            - CU025
            - CU029
            - CU031
            - CU036
    claimRefs:
      - CU002
      - CU003
      - CU024
      - CU025
      - CU030
      - CU031
  - id: FU002
    title: Adoption / deployment flow
    type: flow
    layout: standard
    summary: >-
      Publicly visible flow from premium sleep pain point to hardware adoption, app onboarding, recurring monetization,
      and either expansion or trust erosion.
    data:
      nodes:
        - id: pain
          label: Sleep problem
          detail: Overheating, partner mismatch, hot flashes, snoring, or recovery needs create demand.
          tone: warning
        - id: proof
          label: Social proof + reviews
          detail: >-
            Official testimonials, athlete references, app ratings, and hands-on editorial reviews reduce perceived
            risk.
          tone: positive
        - id: sale
          label: Hardware sale
          detail: Customer buys the cover, hub, and sometimes accessories for an existing mattress.
          tone: positive
        - id: onboarding
          label: App onboarding
          detail: Water priming, Wi-Fi setup, and profile creation are required before daily use.
          tone: neutral
        - id: membership
          label: Recurring membership
          detail: Autopilot, tracking, alarms, and expanded warranty drive recurring monetization.
          tone: positive
        - id: expansion
          label: Expansion loop
          detail: >-
            Base, Blanket, Pillow Cover, Enhanced or Elite tiers, and HSA/FSA-style health use cases raise household
            value.
          tone: positive
        - id: failure
          label: Failure mode
          detail: Subscription fatigue, outages, or cloud dependence can convert a satisfied owner into a detractor.
          tone: warning
      edges:
        - from: pain
          to: proof
        - from: proof
          to: sale
        - from: sale
          to: onboarding
        - from: onboarding
          to: membership
        - from: membership
          to: expansion
        - from: failure
          to: membership
    claimRefs:
      - CU003
      - CU024
      - CU025
      - CU029
      - CU030
      - CU031
