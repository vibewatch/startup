  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Revenue bridge
        - >-
          Current annualized revenue split across hardware, membership, accessories, and any enterprise or medical
          pilots
        - Needed to convert the $1.5B price into a real sales multiple and growth view.
        - Management data room / finance diligence
      - - Membership retention
        - Cohort churn, renewal, attach-rate, and ARPU data
        - Determines whether recurring revenue is a moat or just an added friction layer.
        - Growth / subscription analytics review
      - - Gross profit mix
        - Hardware margin, subscription margin, blended gross margin, and warranty or service burden
        - Sets whether Eight Sleep deserves a medtech-like premium or a hardware discount.
        - Finance diligence plus unit-economics teardown
      - - Cap table and preferences
        - Liquidation preferences, participation rights, anti-dilution terms, and employee-option overhang
        - Private-round value does not equal common-equity return without the waterfall.
        - Legal diligence / cap-table review
      - - Regulatory evidence
        - FDA filing identifiers, study design, endpoints, and commercialization path for sleep-apnea features
        - Medical optionality is a major part of the upside case but is not yet cleared.
        - Regulatory diligence with counsel or consultant
      - - Customer trust
        - NPS, return rates, complaint trends, AI-governance process, and outage remediation metrics
        - Premium valuation depends on durable willingness to pay and trust in a health-facing brand.
        - CX diligence, review sampling, and product-governance review
    notes: >-
      Each ask is tied directly to the variables that could move the recommendation or valuation stance, rather than to
      general curiosity items.
