  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk overview
        blocks:
          - type: paragraph
            body: >-
              Eight Sleep’s residual risk is not a single product bug; it is the interaction of a premium consumer
              hardware model, recurring subscription economics, sensitive biometric data collection, and a newly
              expanded predictive-health narrative. The company now combines an expensive bed-adjacent hardware purchase
              with app control, ongoing membership fees, cloud dependence, and financing offers designed to reduce
              sticker shock. That stack creates several coupled risks. First, consumer-protection exposure is real: the
              company is already facing a false-discount class action, while both the FTC’s negative-option rule and
              California’s automatic-renewal law heighten scrutiny around recurring payments, cancellation, and
              promotional pricing. Second, operational reliability risk is proven rather than hypothetical because the
              October 2025 AWS outage visibly disrupted live beds. Third, Eight Sleep’s current mitigation story is
              incomplete: warranty extension beyond two years depends on continuing membership, outage mode restores
              only limited Bluetooth controls, and public defect-rate disclosure is absent. Fourth, the 2026 funding and
              FDA-oriented health push may increase upside, but they also widen the regulatory, execution, and
              capital-commitment surface.
