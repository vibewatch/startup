  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation, investment thesis, and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The core valuation question is not whether Eight Sleep is an interesting company, but whether the March
              2026 $1.5B price is justified on public evidence. The thesis has real support. Eight Sleep has raised
              fresh capital twice in seven months, was free-cash-flow positive in 2025, ships to more than 34 countries,
              and has built a premium hardware-plus-subscription sleep platform with differentiated cooling, snore
              mitigation, and biometric data collection. The anti-thesis is that these proof points still stop short of
              a public-grade underwriting package. The company has not disclosed annual revenue, ARR, churn,
              gross-margin mix, or the preference stack embedded in prior rounds. Product trust is also not clean: the
              Verge documented factually wrong AI guidance and gamified sleep features that could weaken consumer trust
              exactly as Eight Sleep tries to expand from consumer wellness into predictive health. At $1.5B, the right
              stance is therefore price-sensitive rather than narrative-sensitive: track the company, but do not treat
              the round mark as obviously attractive until deeper diligence proves that recurring economics and brand
              durability warrant a premium to public sleep-hardware comps.
