  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: Decision flow from price anchor and product proof through disclosure and trust gaps to a track recommendation.
    data:
      nodes:
        - id: n1
          label: 'Known price: $1.5B round'
        - id: n2
          label: 'Real proof: FCF positive, 34+ countries, product differentiation'
        - id: n3
          label: 'Missing denominator: no public revenue, ARR, churn, or cap table'
        - id: n4
          label: 'Trust constraint: adverse AI-summary evidence exists'
        - id: n5
          label: 'Comp lens: could be hardware floor or sleep-health premium'
        - id: n6
          label: 'Recommendation: Track; low confidence; stretched valuation'
      edges:
        - from: n1
          to: n5
          label: sets price anchor
        - from: n2
          to: n5
          label: supports upside case
        - from: n3
          to: n6
          label: limits conviction
        - from: n4
          to: n6
          label: raises risk
        - from: n5
          to: n6
          label: requires disclosure discount
    approximationNotes: Flow is interpretive and synthesizes the evidence chain rather than adding new numerical facts.
