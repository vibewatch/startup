      - number: '2.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Non-Wearable Form Factor Aligned with Fastest-Growing Sleep-Tech Sub-Segment
            body: >
              The non-wearable sleep-tracker segment is forecast to grow at 16.04% CAGR (2026–2035) — the fastest
              sub-category in the sleep-tech device market — driven by consumer preference for passive, overnight
              monitoring without a wearable device. Eight Sleep's core design (sensor-embedded mattress cover, no
              body-worn hardware) uniquely addresses this preference. Unlike Oura Ring or WHOOP, which require nightly
              charging and device wear, the Pod operates passively. This structural alignment between product design and
              market trend is a durable advantage if execution on sensor accuracy and AI personalization quality is
              maintained.
            calloutType: strength
            claimRefs:
              - CM012
              - CM046
          - type: callout
            title: Subscription Fatigue and Retroactive Policy Risk Create Structural Churn Exposure
            body: >
              Eight Sleep's business model depends on a mandatory, recurring subscription ($17–$33/month) on top of a
              $2,849–$6,099 hardware purchase. In 2026, 47% of US consumers canceled at least one subscription, and the
              average household significantly underestimates its total subscription spend — a signal of latent
              dissatisfaction. The company's February 2023 retroactive feature lock for existing Pod owners created
              documented community backlash and raised concerns about the company's willingness to change the value
              proposition post-purchase. Without disclosed churn data, the scale of this risk is unverifiable in
              diligence. The mandatory subscription is both Eight Sleep's primary path to recurring revenue and its
              highest reputation risk.
            calloutType: risk
            claimRefs:
              - CM017
              - CM024
              - CM034
          - type: callout
            title: Market Sizing Uncertainty Is Itself a Diligence Signal
            body: >
              The 2x–10x spread between smart mattress ($1.87B narrow) and broad sleep-tech ($31B+) TAM estimates is not
              a rounding problem — it reflects genuine definitional ambiguity about whether Eight Sleep's market is
              hardware, subscription software, health data, or a platform combining all three. Investors who use the
              broad TAM to justify the $1.5B valuation must explain why Eight Sleep captures a meaningful share of the
              wearable-dominated sleep-tech universe rather than only the smart mattress sub-segment where Sleep Number
              already has 8%+ share. The most rigorous frame is a bottom-up SAM defined by income-qualified US
              households, premium WTP, and annual conversion — an estimate that produces a much more modest near-term
              opportunity.
            calloutType: insight
            claimRefs:
              - CM002
              - CM039
              - CM040
              - CM044
          - type: callout
            title: International Expansion Contribution to Near-Term Revenue Is Unverified
            body: >
              Eight Sleep describes 2026 as its "year of scale" and is shipping to 34+ countries. However, no
              country-level revenue breakdown, gross margin by geography, or customer count by region has been publicly
              disclosed. GDPR compliance costs for EU markets, local warranty obligations, shipping duties, and lower
              brand awareness outside the US are material friction factors. Until Eight Sleep discloses international
              revenue share, the contribution of the 2026 global expansion to total company economics is an open
              diligence question.
            calloutType: assumption
            claimRefs:
              - CM020
              - CM035
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape, Peer Set, and Substitute Paths
        blocks:
          - type: paragraph
            body: >-
              Eight Sleep’s competitive set is wider than the direct-smart-bed names that usually show up in consumer
              comparisons. The closest integrated alternatives are Sleep Number and Bryte because both combine comfort
              hardware, data collection, and some degree of automated response inside the bed itself. But buyers can
              also attack the same job through retrofit thermal systems such as Sleepme and BedJet, which preserve the
              mattress they already own, or through tracking-first substitutes such as Oura, WHOOP, and Apple Watch,
              which monitor sleep without changing the sleep environment. That means the real decision is not just brand
              A versus brand B; it is whether the buyer wants an all-in-one premium bed platform, a narrower
              climate-control layer, or a cheaper data layer that can ride on top of the status quo.


              This broader boundary lowers the chance that any one vendor can fully lock up the category. Sleep Number’s
              stores and installed base bring incumbent credibility. Bryte competes for premium buyers who want adaptive
              support, guided relaxation, and hotel-grade positioning. Sleepme and BedJet let hot sleepers solve the
              most painful problem without accepting a subscription or replacing the mattress. Wearables keep siphoning
              away the analytics-only budget. In practice, the buyer can mix and match: keep an existing mattress, add
              retrofit cooling, and wear a ring or band for data. That multi-path buying logic is why Eight Sleep’s moat
              must be judged against multiple classes of alternative, not only direct bed peers.
