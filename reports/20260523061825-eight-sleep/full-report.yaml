            body: >-
              The clearest operational proof of risk is the AWS outage, because it showed that Eight Sleep’s core
              customer experience can fail in a way that becomes physical rather than merely digital. Multiple outlets
              reported alarms, freezing or overheating temperatures, and bed-position problems, and the company
              responded by rolling out a Bluetooth outage mode. That is a meaningful mitigation, but not a full
              de-risking: the publicly described fallback still restores only a narrow set of functions. The hardware
              stack also creates durability risk. Eight Sleep’s own warranty sets a two-year base coverage term, and
              longer protection is gated behind paid membership. Independent reviews repeatedly frame the product as
              high-cost, subscription-heavy, and reliant on its app and hub, while BBB complaints show a measurable
              stream of support disputes and at least one detailed repeat-leak narrative across multiple generations of
              Pods. None of that proves a systemic defect rate, but it does prove that warranty, replacements, cloud
              reliability, and support operations are central to the economics of the business rather than edge cases.
