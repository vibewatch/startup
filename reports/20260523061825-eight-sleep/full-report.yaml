            body: >-
              The attractive part of Eight Sleep's customer economics is the number of plausible expansion loops inside
              one household: an initial cover purchase can expand into a Base, Blanket, Pillow Cover, higher Autopilot
              tiers, and potentially HSA or FSA-backed health use cases such as menopause support. Global reach expanded
              to 34 countries by March 2026 and then to 35-plus countries by April 2026 with the China launch —
              described as the largest market expansion in company history — adding JD.com, Tmall, and WeChat as new DTC
              channels. The March 2026 IRONMAN Europe partnership reinforces the athlete acquisition loop: Eight Sleep
              activated at European triathlon races to reach 100,000-plus IRONMAN athletes and named Kristian
              Blummenfelt and Tadej Pogačar as elite users. The risk is that most of the public evidence still clusters
              around a narrow set of buyer personas and a single owned DTC channel per geography. Public proof is
              concentrated in affluent households willing to buy sleep technology, accept recurring software fees, and
              tolerate an app-connected system in the bedroom. Reviewers repeatedly question whether a Pod 4 owner
              should upgrade to Pod 5, which weakens the hardware refresh story. At the same time, the chapter found no
              public breakdown of customers by geography, channel, subscription tier, or cohort, and no public
              enterprise or insurer book of record. The consequence is not classic top-customer concentration, but
              segment concentration, direct-channel dependence, and incomplete durability visibility.
