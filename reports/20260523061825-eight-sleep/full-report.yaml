            body: >-
              Eight Sleep’s public monetization surface is clearer than its financial statements. The company sells a
              premium Pod system directly through its own site, then layers Autopilot software and analytics on top of
              the hardware sale. Official pages describe the Pod as a high-ticket, temperature-regulating system, while
              the Standard Autopilot page explicitly lists a recurring $15-per-month annualized membership for two users
              and ties key functionality to ongoing software access. Financing and return policies matter here because
              this is not an impulse purchase: Eight Sleep advertises 0% APR options, a queen Cover example at $3,049,
              and a 30-day return window with prepaid labels. The economic read-through is mixed but useful. On the
              positive side, the model has both upfront hardware revenue and renewable software revenue. On the
              cautionary side, realized ASP, discounting, subscription attach, churn, and financing-partner economics
              are not disclosed, so public pricing is still list-surface evidence rather than proof of realized revenue
