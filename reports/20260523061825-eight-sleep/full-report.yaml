      - - Confidence
        - Low
        - >-
          Public evidence confirms financing and product momentum, but not the revenue-quality denominator that converts
          narrative into value.
        - Require deeper diligence before converting interest into conviction.
      - - Risk rating
        - High
        - >-
          Premium hardware, mandatory subscription, AI-feature trust risk, and unproven regulatory upside increase
          downside dispersion.
        - Underwrite with downside protection, not premium-growth optimism.
      - - Valuation stance
        - Stretched
        - >-
          At $1.5B, implied sales multiples remain rich unless current revenue is already near upper assumption bands
          and recurring economics are unusually strong.
        - Avoid paying above the March 2026 mark without private revenue and margin proof.
      - - Entry discipline
        - Prefer at or below current mark after diligence
        - >-
