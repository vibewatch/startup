      - number: '5.4'
        title: Trust, Quality, and Technical Risks
        blocks:
          - type: paragraph
            body: >-
              Trust and quality signals are present, but they are unevenly distributed across public materials. On the
              positive side, Eight Sleep publishes formal warranty terms, an app policy that explicitly covers sleep and
              electronic body-monitoring data, patent marking for the Pod and Base, and FCC documentation confirming the
              Pod 4 radio hardware class and manufacturer. The public product pages also explain the user-facing logic
              for snoring mitigation and health monitoring clearly enough to understand the workflow. The risk side is
              that the same official surfaces do not publish a public security certification, uptime commitment, or
              data-residency statement for the connected service, and they only partially describe the exact sensor
              stack or validation protocol behind respiratory and cardiovascular monitoring. Community tooling adds
              another risk lens: power users can reverse-engineer undocumented endpoints today, but the lack of a stable
              public API and the presence of rate limiting suggest integrations may break or remain unsupported. That
              combination makes the core moat attractive, but it also means technical diligence should spend time on
              service reliability, privacy operations, and integration durability rather than only on the textile
              hardware.
