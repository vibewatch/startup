      - number: '8.3'
        title: Bull, base, and bear cases with explicit range logic
        blocks:
          - type: paragraph
            body: >-
              Scenario work matters more than point estimates because Eight Sleep has a known valuation but an unknown
              public denominator. The bear case assumes the company remains primarily a premium hardware business with
              subscription friction, AI trust issues, and an unproven regulatory path. In that world, public-market
              buyers would likely map it closer to Peloton, Sleep Number, or at best a modest premium to Somnigroup,
              producing a roughly $0.6B-$1.0B range. The base case assumes that 2025 free-cash-flow positivity was not a
              one-off, that international expansion and Pod 5 upgrades lift the annual revenue base into the low
              hundreds of millions, and that membership economics create enough stickiness to justify a partial bridge
              toward higher-quality sleep-health comps; that supports roughly $1.1B-$1.7B. The bull case requires
              something more ambitious and more specific: credible proof that software and health-monitoring gross
              profit is becoming strategically important, that FDA filings convert into a regulated sleep-apnea pathway,
              and that global scale plus predictive AI meaningfully expand the monetization surface. Only then does a
              $1.8B-$2.6B range become underwriteable. At the current $1.5B mark, upside exists, but the margin of
              safety is thin without private diligence.
            claimRefs:
              - CV028
              - CV029
              - CV030
