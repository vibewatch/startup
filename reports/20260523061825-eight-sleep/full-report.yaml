            title: Cloud dependency is a verified product liability
            body: >-
              The October 2025 AWS outage proved that Eight Sleep pods have no local fallback; beds overheated at 110°F
              and became unresponsive. The promised offline mode was still not in production as of January 2026. Any
              investor or buyer must treat cloud dependency as a material operational and reputational risk, especially
              as the company pursues medical-grade positioning.
