      - number: '3.2'
        title: Capability, Packaging, and Price Transparency
        blocks:
          - type: paragraph
            body: >-
              Eight Sleep’s strongest public differentiation remains the way it layers temperature control, non-wearable
              biometrics, and software-led automation onto an existing mattress. The official Pod pages still present a
              premium hardware-plus-membership model: the cover starts at $2,649, Autopilot is mandatory for the first
              year, and higher software tiers add warranty length and health-monitoring features. Sleep Number’s
              approach is structurally different because the company sells a full mattress with embedded adjustability,
              temperature balancing, sensors, and smart-base accessories. Bryte also sells the whole mattress
              experience, leaning harder into active pressure relief, zoned firmness, and AI-guided comfort. Those
              integrated systems ask the buyer to replace the sleep surface, but they also solve support and
              pressure-relief jobs that Eight Sleep’s cover does not.


              The retrofit systems and wearables widen the price ladder beneath that premium tier. Sleepme’s Chilipad
              2.0 publishes a $1,599 starting point, 55°F–115°F range, automation, and no recurring subscription.
              BedJet’s air-based system attacks the same hot-sleeper pain point without water, while Oura and WHOOP pull
              the competitive comparison into recurring wearable memberships instead of bed hardware. Public
              transparency is uneven, however. Eight Sleep, Sleepme, Oura, and WHOOP post clear list prices, while Bryte
              and Sleep Number remain more quote- or review-driven in public material. That matters because the
              category’s economics are shaped not only by feature breadth but also by how much upfront hardware,
              warranty, and recurring software commitment the buyer is willing to accept.
