  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Definition
        blocks:
          - type: paragraph
            body: >
              Defining Eight Sleep's addressable market requires choosing among at least three non-interchangeable
              frames: the narrow smart mattress hardware market, the broad sleep-tech devices universe, and the premium
              mattress tier. Each frame yields radically different TAM numbers and different implications for
              competitive intensity, replacement-cycle risk, and growth trajectory.

              The narrow smart mattress frame (Global Market Insights, January 2026) defines the market as consumer and
              hospitality smart beds with embedded sensors, active temperature regulation, or connectivity features.
              This frame yields a 2026 global market of $1.87B and a CAGR of 6.6% through 2035 ($3.34B endpoint). Eight
              Sleep, Sleep Number, Emma Sleep, Somni Group International, and Hilding Anders collectively held
              approximately 30% of this market in 2025, with Sleep Number leading at 8%+ share. This frame is the most
              defensible comparator for Eight Sleep's hardware business because it shares Eight Sleep's unit economics
              and competitive set.

              The broad sleep-tech devices frame treats Eight Sleep as a non-wearable sleep tracking platform competing
              alongside Oura Ring, Withings, Samsung, Apple Watch, and clinical CPAP/APAP devices. Here the 2026 TAM
              ranges from $27B (Coherent Market Insights) to $32B (Global Market Insights / Research Nester) to $31.35B
              (SNS Insider). Within this universe, wearables capture 57% of revenue and non-wearables — Eight Sleep's
              exact segment — are forecast to grow at 16% CAGR (2026–2035), the fastest sub-segment. This framing
              flatters TAM but overstates the addressable set because Eight Sleep cannot replace a smartwatch for
              on-the-go monitoring.

              The premium mattress frame positions Eight Sleep against Tempur-Pedic, Purple, Saatva, and other premium
              DTC brands within the US mattress market estimated at $18.95B in 2026 and the global luxury/premium
              mattress market at $18.7B. Eight Sleep Pod 5 starts at $2,849, which is above specialty-mattress averages
              ($2,167 per NapLab), making it a premium-tier product within this frame. However, the Pod fits over an
              existing mattress, which partially bypasses the replacement cycle; consumers must still own or purchase a
              mattress separately, limiting direct substitution.

              The most defensible SAM combines the smart mattress frame with a household-income filter: US households
              earning above $100,000 annually — approximately 37M households per Census estimates — represent Eight
              Sleep's primary domestic serviceable market. Assuming 1–2% annual conversion among this group, the
              US-alone SOM ceiling is 370K–740K units per year, or roughly $1B–$2B in hardware revenue at Pod 5 pricing.
              This bottom-up frame is author-derived and not independently validated; it depends critically on income
              elasticity, repeat upgrade behavior, and churn from the mandatory subscription.
