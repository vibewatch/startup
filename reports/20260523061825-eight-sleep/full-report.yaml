chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Founding, and Business Model
        blocks:
          - type: paragraph
            body: >
              Eight Sleep is an American health technology company that pioneered the commercial concept of "sleep
              fitness," combining active hydro-thermal regulation hardware, embedded biometric sensors, cloud AI, and a
              recurring-revenue software subscription into a single bed system. The company was founded in 2014 in San
              Francisco, California; its operational headquarters are in New York City. The company markets itself as
              the "world's first sleep-fitness company" and frames the bed as a preventive health platform rather than a
              passive piece of furniture.

              The core product line is the Pod — a water-cooled mattress cover that fits over any existing mattress,
              connects to a bedside Hub, and communicates through the Eight Sleep app. The Pod 5, launched in May 2025
              starting at $2,849, is the current flagship system. It includes a hydro-powered Blanket, a motorized Base
              with built-in surround sound that automatically elevates the head when snoring is detected, and dual-zone
              temperature control between 55°F and 110°F. The embedded sensors in the cover track sleep stages, heart
              rate, heart-rate variability, breathing rate, and movement passively, without requiring the user to wear
              any device. Clinical claims on the official website state users see up to 44% faster sleep onset, 34% more
              deep sleep, and 45% reduction in snoring.

              Eight Sleep's business model is direct-to-consumer hardware plus a mandatory recurring subscription.
              Hardware is sold through eightsleep.com; as of 2026 subscription tiers run from $17/month (Standard) to
              $25/month (Enhanced) to $33/month (Elite), unlocking Autopilot AI, health analytics, and warranty
              extensions. Notably, Eight Sleep introduced this mandatory subscription in February 2023, retroactively
              locking features that prior Pod owners had used without payment; this policy generated sustained user
              backlash that diligence must account for. The company also sells supplements developed with physician
              Peter Attia and acquired health coaching company Span Health in 2022.
