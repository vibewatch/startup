slug: flying-tulip
runDate: '2026-07-09'
company:
  name: Flying Tulip
chapter:
  number: 7
  title: Risks
  summary: |
    Flying Tulip's risk profile at run date is defined by seven high-severity risk vectors: (1) regulatory action against
    the perpetual-put SAFT / public-sale structure in the U.S. (SEC / CFTC) and against DeFi protocols in the EU (MiCA)
    and internationally (FATF, U.S. Treasury); (2) smart-contract exploit risk on a novel cross-margin engine plus five
    product modules whose independent audit reports are not publicly disclosed at run date; (3) reserve-yield concentration
    risk on Aave, Ethena, and Spark, which together back the design-target ~US$40M/yr yield stream that funds operations;
    (4) key-person concentration on André Cronje, whose past DeFi projects have generated both major traction and public
    controversy; (5) Sonic Labs related-party concentration, since Sonic is both launch chain and subsidy source while
    Cronje is a co-architect; (6) tokenomics fragility if secondary FT sellers stress the redemption reserve queue and
    rate limits; and (7) liquidity mismatch between demand-liability redemption reserve and on-chain yield positions.
    The precedent that anchors the regulatory tail — the U.S. Treasury's 2022 sanctions of the Tornado Cash smart
    contracts — remains the reference case for how far U.S. authorities can push against a decentralised DeFi protocol.
sections:
  - id: regulatory-and-legal-risk
    title: Regulatory and Legal Risk
    body: |
      Flying Tulip's regulatory perimeter is unusually wide. In the U.S., the SEC Enforcement Division's ongoing "important
      initiatives" surface targets crypto issuances, staking, and unregistered exchanges; a SAFT sold to non-accredited
      U.S. persons plus a global public sale plus a perpetual-put option that arguably functions as an investment
      contract combines multiple risk vectors under Howey. CFTC July 2026 press releases already cite active enforcement
      of foreign exchanges transacting with U.S. customers, a directly relevant precedent for a global on-chain super-app.
      In the EU, MiCA's requirements on crypto-asset service providers, stablecoin issuers, and reserve attestation apply
      once ftUSD circulates to EU persons; Coinspeaker referenced OFAC screening and tax reporting features, but the
      compliance stack is not publicly named. Internationally, FATF's virtual-asset guidance imposes travel-rule and
      VASP-style expectations that permissionless DeFi does not naturally satisfy, and the U.S. Treasury's 2023 DeFi
      Illicit Finance Risk Assessment explicitly warns that DeFi protocols evade AML/CFT and sanctions controls. The
      benchmark precedent is the August 2022 OFAC sanctioning of the Tornado Cash smart contracts, subsequently partially
      unwound by a November 2024 U.S. federal appeals court decision (per Wikipedia's dossier). That case establishes
      both the willingness of U.S. authorities to sanction protocol code and the appellate resistance to that approach —
      a live legal ambiguity Flying Tulip inherits.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR005
      - CR006
      - CR007
      - CR008
      - CR009
