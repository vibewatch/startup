    - type: private-evidence-only
      severity: material
      topic: audit-disclosure-TR002
      missingEvidence: Public audit reports for the redemption reserve, cross-margin engine, ftUSD, and Witnessnet contracts.
      whyItMatters: The single largest operational and security gap; Aave and Uniswap publish multiple audit rounds, Flying Tulip has not linked any at run date.
      diligencePath: Request Sherlock/OpenZeppelin/Trail of Bits reports plus formal-verification coverage per module.
      relatedQuestionRefs:
        - QR007
    - type: private-evidence-only
      severity: material
      topic: compliance-lead-TR004
      missingEvidence: Named CCO or general counsel plus OFAC screening technology, travel-rule integration, and MiCA legal opinion.
      whyItMatters: Regulatory tail risk is high; a named compliance lead is the baseline institutional-diligence expectation.
      diligencePath: Request CCO, outside counsel firm, and compliance stack.
      relatedQuestionRefs:
        - QR019
    - type: private-evidence-only
      severity: material
      topic: cto-security-lead-TR004
      missingEvidence: Named CTO / head of engineering / head of security.
