  - id: partner-dependency-people-and-mitigation
    title: Partner Dependency, People, and Mitigation
    body: |
      Flying Tulip's dependency graph converges on a small number of counterparties whose failure would materially
      impair the protocol. Sonic Labs is the launch-chain and subsidy source and is a Cronje-adjacent related party;
      any change in Sonic's fee-monetisation policy or a Sonic outage cuts Flying Tulip's zero-fee retail acquisition
      window immediately. Reserve yield concentrates on Aave v3, Ethena, and Spark; a single-venue exploit or peg break
      is a first-order threat. Prop-market maker overlap (Susquehanna Crypto, Selini, DWF Labs, FalconX are simultaneously
      SAFT investors and likely market makers) means a large MM exit could compress liquidity and investor confidence
      simultaneously. Cross-chain bridges are the historical loss category and will apply to Ethereum, Base, Avalanche,
      BNB Chain, and Solana rollout. Regulators (SEC, CFTC, MiCA, FATF, OFAC) are dependencies in the sense that any
      hostile action against the perpetual-put SAFT or against the ftUSD stablecoin would compress adoption. People and
      execution risk concentrates on André Cronje: he is the only named principal in reviewed sources, no cofounder or
      CTO is disclosed, and no named legal-compliance lead exists — for a US$1B FDV protocol running a global public
      sale, this is a material governance gap. Mitigations: perpetual-put reserve is architecturally segregated;
      redemption queues and rate limits protect solvency; team compensation aligns with performance via buyback flow;
      OFAC screening and tax reporting are referenced. Kill criteria that a diligence team should monitor include (a)
      any SEC or CFTC enforcement action naming Flying Tulip; (b) a redemption-run event exceeding queue rate limits;
      (c) Cronje's departure or public exit; (d) a Sonic Labs policy change to fee monetisation; (e) any Aave/Ethena/
      Spark peg break or exploit; and (f) FT trading below the US$0.10 put-implied floor for a sustained window.
