callouts:
  - calloutType: risk
    title: The Tornado Cash sanctions precedent is the single most important regulatory anchor
    body: |
      Wikipedia's Tornado Cash dossier records the August 2022 OFAC sanctioning of the protocol's smart contracts and
      the November 2024 U.S. federal appeals court decision partially unwinding that sanction. That case shows both
      (i) that U.S. authorities are willing to sanction protocol code and (ii) that the appellate posture is unsettled.
      Flying Tulip's ftUSD, redemption reserve, and cross-margin contracts inherit this exact regulatory ambiguity;
      it is the single most important tail scenario in the register.
    claimRefs:
      - CR003
      - CR009
  - calloutType: risk
    title: Independent audit reports are the single largest unresolved security gap
    body: |
      Aave, Uniswap, and Ethena publicly link multiple audit rounds from their docs; Chainalysis documents that DeFi
      exploits historically caused multi-billion-dollar losses concentrated in bridges and lending. Flying Tulip's
      audits are not publicly linked from docs.flyingtulip.com at run date, and neither Sherlock nor Code4rena publicly
      list Flying Tulip audits. For a US$1B FDV protocol running a global public sale, absence of public audit is the
      single largest unresolved operational and security gap.
    claimRefs:
      - CR010
