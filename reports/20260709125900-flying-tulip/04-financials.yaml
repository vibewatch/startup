  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: audited-financials
      missingEvidence: Audited financial statements, protocol P&L, and monthly opex breakdown for Flying Tulip.
      whyItMatters: Without audited financials the US$1B FDV cannot be tied to any revenue-quality metric; the diligence file resembles a pre-revenue token, not an operating exchange.
      diligencePath: Request most recent management P&L, monthly opex, audit letter, and any pre-launch investor deck.
      relatedQuestionRefs:
        - QI025
        - QI028
    - type: missing-source
      severity: material
      topic: on-chain-revenue-dashboard
      missingEvidence: A publicly available on-chain revenue dashboard (Dune, Token Terminal) covering fees, TVL, and buyback flow.
      whyItMatters: DeFi protocols are unusually well-instrumented on-chain; the absence of a public dashboard for Flying Tulip is a diligence red flag.
      diligencePath: Request or build a Dune dashboard from Flying Tulip's on-chain contracts.
      relatedQuestionRefs:
        - QI028
    - type: conflicting-data
      severity: material
      topic: mexc-soft-commitment
      missingEvidence: Independent corroboration of MEXC's US$1.3B public-sale soft-commitment figure and MEXC's US$25.5M Series-A extension figure.
      whyItMatters: Single-source figures materially change disclosed total capital and demand signal for the public sale.
      diligencePath: Request auditor-reconciled public-sale settlement report and Series-A term sheets.
      relatedQuestionRefs:
        - QI011
    - type: private-evidence-only
      severity: material
      topic: sonic-subsidy-terms
      missingEvidence: The commercial subsidy contract between Flying Tulip and Sonic Labs and disclosure of Cronje's economic exposure to both entities.
      whyItMatters: Sonic subsidy is the single largest driver of Flying Tulip's zero-fee posture and post-subsidy unit economics; related-party terms are material.
      diligencePath: Request the subsidy contract, related-party disclosure, and any advisory role Sonic Labs has in Flying Tulip governance.
      relatedQuestionRefs:
        - QI028
    - type: private-evidence-only
      severity: material
      topic: reserve-allocation-policy
      missingEvidence: Reserve venue split across Aave, Ethena, Spark and any concentration limits or hedges.
      whyItMatters: Reserve allocation determines actual APY and concentration risk on the sole spendable cash inflow.
      diligencePath: Request reserve venue allocation policy, monthly APY attribution, and any concentration limits.
      relatedQuestionRefs:
        - QI003
    - type: private-evidence-only
      severity: material
      topic: team-comp-schedule
      missingEvidence: Team compensation schedule tied to buyback flow (rate limits, vesting, cliffs).
      whyItMatters: Team retention and dilution equivalent cannot be underwritten without this.
      diligencePath: Request the team buyback rate limit, vesting curve, and any performance-based unlocks.
      relatedQuestionRefs:
        - QI022
    - type: private-evidence-only
      severity: minor
      topic: apy-volatility
      missingEvidence: Historical realised APY at Aave, Ethena, and Spark and how far Flying Tulip's target 4% could drop in stress.
      whyItMatters: Yield-stream fragility is a direct governance risk if APY compresses in bear markets.
      diligencePath: Model APY sensitivity using Ethena basis history and Aave utilisation curves.
      relatedQuestionRefs:
        - QI029
    - type: private-evidence-only
      severity: minor
      topic: recognition-policy
      missingEvidence: How Flying Tulip will accountingly recognise protocol fees into buyback flow versus GAAP revenue if it ever adopts an audited structure.
      whyItMatters: Long-term valuation requires a GAAP-comparable revenue line.
      diligencePath: Request the future audited-revenue recognition policy once the operating entity is disclosed.
      relatedQuestionRefs:
        - QI006
    - type: private-evidence-only
      severity: minor
      topic: coinbase-comparability
      missingEvidence: A cleaner side-by-side of Flying Tulip's future take rate versus Coinbase's disclosed transaction take rate.
      whyItMatters: The most credible benchmark for a public crypto exchange is Coinbase's 10-K.
      diligencePath: Pull Coinbase's most recent 10-K transaction-revenue disclosure and reconstruct a like-for-like model.
      relatedQuestionRefs:
        - QI007
        - QI013
    - type: private-evidence-only
      severity: minor
      topic: pre-launch-retention
      missingEvidence: Pre-launch retention proxies (wallet stickiness, LP retention, unique addresses over time).
      whyItMatters: Retention is the pacing metric for sustainable revenue post-subsidy.
      diligencePath: Request unique-address retention curves and LP-return distributions.
      relatedQuestionRefs:
        - QI014
