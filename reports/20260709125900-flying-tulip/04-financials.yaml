  - calloutType: risk
    title: No S-1, no audited financials, no on-chain revenue dashboard — the diligence file is unusually thin
    body: |
      Comparable public crypto exchanges (Coinbase) publish quarterly and annual SEC filings with audited revenue, take rate,
      and custody disclosures. Flying Tulip has none of these; even the closest analytical parallel — a Dune-style on-chain
      revenue dashboard — is not yet public. That is a defensible posture pre-launch but is a hard diligence gap for
      underwriting the US$1B FDV.
    claimRefs:
      - CI025
      - CI026
      - CI027
      - CI031
