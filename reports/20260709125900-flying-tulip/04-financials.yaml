  - id: gtm-motion-and-sales-efficiency-proxies
    title: GTM Motion, Traction, and Sales-Efficiency Proxies
    body: |
      Flying Tulip does not sell to enterprise buyers in a traditional sense; its GTM motion is a token-and-liquidity flywheel
      similar to Uniswap and Hyperliquid rather than a sales-cycle motion similar to Coinbase Institutional. The measurable
      efficiency proxies are: (i) TVL captured versus dollar of incentive spent; (ii) trading volume captured versus dollar
      of fee subsidy; and (iii) retention curve after each fee-schedule change. Direct data at run date is thin. TVL at TGE
      (per MEXC) was about US$126 million and accumulated yield was about US$85,000 before full platform launch. The
      accumulated yield of US$85,000 across the January-February 2026 window implies an implied annualized yield-on-TVL
      close to the reserve target (~4%) but at a fraction of the potential base, which is expected pre-launch. Public-sale
      "soft commitments" over US$1.3 billion (MEXC) would imply an unusually high CAC-multiple efficiency if converted,
      but the single-source corroboration is a real gap. Channel economics are Sonic-subsidy-dependent for the first
      window: Cronje explicitly says "fee monetisation and subsidies allow Flying Tulip to offer zero-fee trading" on
      Sonic before wider deployment. Compared with Coinbase's disclosed take rate in its SEC filings, Flying Tulip's zero
      -fee posture is a marketing loss leader, not a stable unit-economic reality. The nearest realistic sales-efficiency
      proxy is DEX volume captured relative to reserve-yield spent on FT buybacks; that ratio cannot yet be measured in
      public data.
