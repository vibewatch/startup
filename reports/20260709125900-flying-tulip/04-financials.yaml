slug: flying-tulip
runDate: '2026-07-09'
company:
  name: Flying Tulip
chapter:
  number: 4
  title: Financials
  summary: |
    Flying Tulip has no traditional revenue base because the perpetual-put reserve structure Cronje announced on 29 September
    2025 makes the US$200 million SAFT raise effectively unspendable — Cronje told The Block "actual raised is zero". The
    protocol economics are instead pass-through: up to ~US$1 billion of contributed capital is deployed into Aave, Ethena,
    Spark, and comparable venues at a ~4% target APY, projecting ~US$40 million per year in yield that funds incentives,
    operations, and open-market FT buybacks. Additional revenue streams from trading fees, lending spreads, ftUSD yield,
    liquidations, and insurance premiums are described in press coverage but are contingent on live volume; MEXC reports
    TGE-time TVL of ~US$126 million with ~US$85,000 of accumulated yield "even before full platform launch". No S-1, no
    Coinbase-style 10-K, and no audited financials exist for Flying Tulip; the only comparable filing evidence for a DeFi
    exchange business comes from Coinbase's SEC filings, which anchor gross-margin, custody, and compliance-cost norms for
    the vertical. Capital adequacy is unusual: reserve principal is legally earmarked to redeemers, so runway is only the
    yield stream, and every dollar of secondary-market FT selling migrates put-invalidated principal into buyback flow.
sections:
  - id: revenue-model-and-recognition
    title: Revenue Model and Recognition
    body: |
      Flying Tulip's revenue model is a two-layer construct. Layer one is the reserve-yield stream: Cronje told The Block
      that up to US$1 billion of raised principal is deployed into on-chain yield venues (Aave, Ethena, Spark) at an
      approximately 4% target APY, producing a design-target US$40 million per year of yield that is not customer revenue
      in an accounting sense but is the sole spendable cash inflow while the perpetual-put remains active. Layer two is
      the protocol-level revenue Cronje enumerates in press interviews and the BSC News overview: trading and lending fees,
      liquidation penalties, ftUSD yield capture, and on-chain insurance premiums. None of layer-two revenue is
      independently verifiable at the run date because the FT token has only been transferable since 23 February 2026,
      Sonic launch trading is subsidised to zero fee, and Flying Tulip has not published on-chain revenue dashboards or a
      Dune-style analytics disclosure comparable to Uniswap Labs or Aave. Recognition is therefore best treated as
      "reserve yield accounted as buyback fuel + protocol-fee revenue capitalised into token buybacks", not GAAP revenue.
      For diligence purposes the Coinbase 10-K SEC filing chain is the nearest analogue for how a public crypto exchange
      recognises trading fees, stablecoin float income, and custody revenue — Flying Tulip's mix will look similar in
      structure but with a fully on-chain fee capture rather than fiat-onramp fees, and with the redemption reserve as
      an unusually large non-operating capital pool.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI006
      - CI007
    tableRefs:
