callouts:
  - calloutType: strength
    title: Zero-team-allocation and buyback-funded compensation is one of the cleanest team-token alignment structures in DeFi
    body: |
      Flying Tulip's team gets no initial FT allocation; instead team members earn compensation via scheduled protocol-revenue
      -funded open-market buybacks. This ties team economics to actual protocol usage, is publicly disclosed in the official
      press release, and mitigates the classic "founder dump" risk that has hurt prior Cronje-adjacent projects. It is a
      structurally rare choice in DeFi.
    claimRefs:
      - CI019
      - CI028
  - calloutType: risk
    title: Design-target US$40M/yr yield is a fragile top line
    body: |
      The perpetual-put mechanism means the reserve principal cannot be spent; the ~US$40M/yr yield stream is the only
      spendable cash. If on-chain APY compresses (Ethena basis, Aave utilisation), operating runway compresses in lockstep.
      BIS's DeFi analysis and the U.S. Treasury 2023 risk review both flag yield volatility and liquidity mismatch as
      first-order DeFi financial-stability risks. Any bear-market APY squeeze is a direct governance risk.
    claimRefs:
      - CI015
      - CI016
