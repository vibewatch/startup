      - number: '8.3'
        title: 退出准备、最终尽调事项与论点破坏触发器
        blocks:
          - type: paragraph
            body: >
              Flying Tulip 的退出准备不同于传统风险投资持仓，因为 FT 代币已经可转让（2026 年 2 月 23 日），且一级销售持有人可通过 Perpetual PUT 获得 US$0.10
              的赎回底价。二级市场卖家会失去 PUT，出售所得流入回购并销毁。标准退出路径都可能成立： 在流动 FT 市场中二级出售、一级销售持有人通过 PUT 赎回，或未来经营实体
              M&A；但每条路径的经济性不同。最终尽调事项集中在风险章节 （第 7 章）已标出的七个缺口：（i）储备和跨保证金引擎的独立审计报告；（ii）具名 CCO 和总法律顾问，以及 MiCA 法律意见；
              （iii）Aave、Ethena、Spark 之间的储备场所拆分政策；（iv）Sonic Labs 补贴合同条款和 Cronje 的 Sonic 关联方披露； （v）具名 CTO / 工程负责人 /
              安全负责人，以及漏洞赏金计划；（vi）绑定回购流的团队薪酬时间表；（vii）经审计师调节的公开销售结算报告 和 Series A 扩展轮印证。论点破坏触发器从软到硬升级：任何点名 Flying Tulip 的
              SEC / CFTC 执法函、任何 OFAC 行动、 任何储备漏洞利用、Cronje 离开、Sonic 补贴撤回、任何 Aave / Ethena / Spark 脱锚或被攻击，或 FT 在持续窗口内低于
              US$0.10 的 PUT 隐含底价，都足以单独支持退出仓位。Chainalysis 的历史 DeFi 损失数据和 BIS 关于杠杆 / 流动性错配的评论， 是判断赎回挤兑事件传播速度的锚点。
