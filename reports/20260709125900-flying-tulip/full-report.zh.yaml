  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 参考意义
      - 局限
    rows:
      - - Hyperliquid (HYPE)
        - 永续 DEX L1；HYPE 供应量 1B
        - 可公开交易；据 CoinGecko，HYPE 代币已在 Hyperliquid 和 Coinbase 交易
        - 跨保证金永续架构上最接近的对手
        - Hyperliquid 自筹资金，没有外部资本，因此作为投资人可比对象有限
      - - dYdX
        - 自有 Cosmos 链的永续 DEX
        - 自有代币；据 dydx.exchange，累计交易量 US$1.5T、未平仓合约 US$200M、市场 220+
        - 永续 DEX 规模参照
        - 链和治理机制不同
      - - Aave (AAVE)
        - 借贷既有玩家；据 CoinLaw，V3 TVL 约 US$12.1B
        - AAVE 治理代币可公开交易
        - 借贷垂直赛道基准
        - AAVE 是治理代币，不是收入分成工具
      - - Uniswap (UNI)
        - 现货 DEX 类别龙头
        - UNI 治理代币；Uniswap Labs 到 2022 年募资约 US$165M
        - 现货 AMM 估值参照
        - UNI 目前不向持有人分配费用
      - - Ethena (ENA / USDe)
        - 生息稳定币
        - ENA 治理代币；USDe 是 delta 中性稳定币
        - sftUSD 的生息稳定币同类
        - USDe 基差压缩是已知周期风险
      - - Curve (CRV)
        - 稳定币兑换 AMM；ve(3,3) 治理
        - CRV 可公开交易
        - 稳定币兑换可比对象
        - 治理模型不同
      - - Coinbase Global（COIN，申报基准）
        - 公开 CEX 交易所申报文件（SEC EDGAR）
        - 10-K 披露为费率基准提供锚点
        - 收入披露质量的公开基准
        - 链下托管模型差异很大
      - - Infinex (INX)
        - DeFi 超级应用同类（MEXC 引用的可比对象）
        - 据 MEXC，INX FDV 交易价为 US$121M，低于 US$300M ICO 估值——早期参与者亏损 60%
        - DeFi 超级应用上线的直接反面可比
        - 单一渠道引用
      - - Sonic Labs (S)
        - 上线链和 Cronje 关联生态
        - Sonic 代币可公开交易；据 Coinspeaker，TradingView 跟踪 S/USD 交易对
        - 关联方生态可比对象
        - 关联方经济关系
      - - Solana (SOL)
        - Flying Tulip 多链部署目标中的 L1
        - SOL 可公开交易；市值数十亿美元级
        - 散户获取潜力的锚点
        - 不是 DeFi 协议的直接估值可比
    notes: |
      可比集合横跨架构对手、基于申报文件的公开基准（Coinbase），以及一个直接的 DeFi 超级应用反面可比（Infinex）。由于代币经济设计差异，倍数不能直接迁移。
    enumerationScope:
      coverage: partial
      basis: |
        Rows enumerate the most-cited named tokens and filings that anchor Flying Tulip's valuation logic; long-tail
        crypto tokens and non-comparable public equities are omitted.
