  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品套件与客户工作流
        blocks:
          - type: paragraph
            body: >
              Flying Tulip 被有意设计成单钱包目的地，覆盖五类最高频 DeFi
              任务。零售交易者连接钱包，存入可接受资产（USDC、USDT、USDS、USDe、USDtb、WETH、WBTC、cbBTC、SOL/jupSOL、AVAX/wAVAX，见术语表），随后执行：在自适应曲线 AMM
              上做现货 swap；在 CLOB 上用钱包跨保证金开多或开空永续仓位；在动态 LTV 货币市场借入或供给；铸造 ftUSD（或质押 sftUSD，在 Sonic 上获得约 6% APY）作为 delta
              中性收益稳定币；针对智能合约风险开启链上保险保障；并且（按术语表）参与由 Witnessnet TLS 证明裁决的二元预测市场。跨保证金引擎允许任何已接受资产作为抵押品，支持任一产品中的头寸，这正是 Cronje
              最常被引用的统一资本效率主张（The Block、Blockhead）。截至报告日期，用户界面是 docs.flyingtulip.com 加链上合约；它没有可与 Coinbase 或 Binance
              对比的传统网页应用，因为余额和订单都在链上结算。与既有玩家相比，工作流差异在于，同一份抵押品不必在 Uniswap、Aave、dYdX 和 Ethena 等独立场所之间移动。
