      - number: '3.3'
        title: 壁垒耐久性、切换成本与不利竞品证据
        blocks:
          - type: paragraph
            body: >
              Flying Tulip 的壁垒主张包括：（i）统一跨保证金带来的资本效率；（ii）Cronje 的建设者品牌；（iii）perpetual-put 融资原语；（iv）以 ftUSD
              为锚的结算轨道。任何一项单独看都不持久。跨保证金资本效率在技术上可以复制：任何有共享风险引擎的协议都能统一抵押品，专业竞品（Hyperliquid、dYdX）已经在各自永续产品内运行跨保证金；Aave 和
              Morpho 也在朝多抵押品池移动。perpetual-put 原语可以被其他发行方采用——Blockhead 上的 Lemniscap 评论明确把它称为一项实验，「可能重塑 DeFi
              融资轮结构」，暗示扩散。Cronje 的品牌是真实但个人化的壁垒，第 1 章已经标出关键人风险。Uniswap、Curve 和 Aave 的切换成本很高，因为 LP 资本黏且经过审计；Flying Tulip 的
              Sonic 零手续费启动是补贴，不是永久壁垒。分发权在既有玩家手里：Uniswap 前端已有用户基础，PancakeSwap 把持 BNB Chain 上零售流量，Coinbase/Binance
              仍发起大多数法币入金交易量。DeFi 用户常多栖使用（同时在 3-5 个场所交易），这进一步限制 Flying Tulip 锁定用户的能力。不利竞品证据包括：Hyperliquid 的吞吐领先、dYdX 的
              US$1.5T 累计成交量、Aave 的 US$12.1B TVL、Uniswap 的协议主导地位都有公开记录；Ethena 是 delta 中性收益稳定币的先发者。TGE 前预测市场（据 MEXC）只给
              Flying Tulip 约 50-50 的概率守住 US$400M 以上 FDV，隐含市场认为专业既有玩家更可能守住份额。
