      - number: '8.2'
        title: 牛市、基准与熊市情景及可比锚点
        blocks:
          - type: paragraph
            body: >
              本次报告日，具名代币估值分布很宽。Hyperliquid（HYPE，CoinGecko 称其为一条支持现货和永续合约、最高供应 1B 代币的 Layer-1 区块链） 在 Hyperliquid 和
              Coinbase 交易；Aave（多十亿美元 TVL 的借贷既有龙头）、Uniswap（现货 DEX 品类领导者）、Ethena （Delta 中性 USDe 稳定币）、dYdX（公司网站称累计永续交易量
              US$1.5T）和 Curve（稳定币 AMM）都有公开交易的治理代币， 但收入挂钩机制不同。Flying Tulip 的 FT 约以 US$0.10 交易，对应约 US$1B
              FDV；这个估值机械锚定在储备上，而不是可比代币倍数。 基准情景假设：（i）Sonic 补贴窗口让零费率零售获客持续一到两个季度；（ii）Cronje 指引的完整超级应用产品套件在 2026 年下半年交付；
              （iii）储备在 US$1B 上获得约 4% APY，产生约 US$40M/yr；（iv）没有 SEC / CFTC 执法行动；（v）稳态协议收入接近 DeFi 总费用池的约 5-10%（CoinLaw 称
              TTM 为 US$24.9B）——意味着超级应用可争夺 US$1.2-2.5B 的可触达年费。牛市情景假设跨保证金释放资本效率， 拉动当前 US$126M TVL 的 5-10 倍，MiCA
              合规路径打开欧盟机构资本，回购销毁复利推动 FDV 走向 US$3-5B。熊市情景假设 SEC 或 OFAC 针对 Perpetual PUT SAFT 或 ftUSD
              采取行动，出现审计触发的漏洞利用，或发生赎回挤兑事件；每种情况都会把 FT 压到 US$0.10 底价以下，考验队列和速率限制机制，并把 FDV 压向预测市场最初定价的 US$400M 水平。
