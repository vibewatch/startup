      - number: '4.2'
        title: GTM 动作、牵引力与销售效率代理指标
        blocks:
          - type: paragraph
            body: >
              Flying Tulip 不按传统方式卖给企业买家；它的 GTM 动作更像 Uniswap 和 Hyperliquid 的代币与流动性飞轮，而不是 Coinbase Institutional
              那样的销售周期打法。可衡量的效率代理指标是：（i）每 1 美元激励支出捕获的 TVL；（ii）每 1 美元手续费补贴捕获的交易量；（iii）每次费率表调整后的留存曲线。截至报告日期，直接数据很薄。TGE 时
              TVL（据 MEXC）约 US$126 million，完整平台上线前累计收益约 US$85,000。2026 年 1-2 月窗口内 US$85,000 累计收益意味着 TVL 的隐含年化收益率接近储备目标（约
              4%），但基数只是潜在规模的一小部分；这在上线前符合预期。若 MEXC 所称超过 US$1.3 billion 的公开发售「软承诺」能够转化，会意味着异常高的 CAC
              倍数效率，但只有单一来源印证，这是实质缺口。首个窗口的渠道经济依赖 Sonic 补贴：Cronje 明确说，「手续费变现和补贴让 Flying Tulip 能在 Sonic
              上提供零手续费交易」，之后再拓展部署。与 Coinbase 在 SEC 报告中披露的抽佣率相比，Flying Tulip 的零手续费姿态是营销引流亏损品，不是稳定的单位经济现实。最现实的销售效率代理指标，是
              DEX 成交量相对于储备收益中用于 FT 回购的花费；公开数据还无法测量这个比率。
