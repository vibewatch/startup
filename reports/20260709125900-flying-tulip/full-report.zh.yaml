  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点、反论点与建议
        blocks:
          - type: paragraph
            body: >
              Flying Tulip 的正向论点是：André Cronje 的声誉资本、为投资者提供本金保护的新型 Perpetual PUT 融资原语、既有龙头没有的统一跨保证金超级应用、 Sonic
              首发零费率补贴，以及覆盖宏观（Brevan Howard Digital）、TradFi 自营（Susquehanna Crypto）、加密原生 VC （CoinFund 和另外 10 家）与做市商（DWF
              Labs、Selini、FalconX）的广泛 SAFT 财团，会共同复利成一个持久的 DeFi 平台； 其每年约 US$40M 的储备收益流可以在不稀释团队的情况下启动协议采用。反论点是：（i）Flying
              Tulip 进入的每个垂直都有专业既有龙头， 在 TVL、交易量和审计成熟度上领先；（ii）Perpetual PUT 原语可复制，Lemniscap 已把这次融资称为实验；（iii）Cronje 的关键人物集中
              与 Sonic Labs 关联方关系不可分割；（iv）截至本次报告日，docs.flyingtulip.com 没有公开链接独立审计报告；（v）FDV
              是机械锚定到储备池，而不是任何收入指标；（vi）预测市场认为上市估值守住 US$400M FDV 的概率大约 50-50，远低于 US$1B 的内部人标记； （vii）美国财政部 DeFi 风险评估、BIS 的
              DeFi 分析、FATF 虚拟资产指南和 Tornado Cash 制裁先例共同构成大型监管尾部风险。 本次报告日建议为跟踪，置信度中等，估值姿态偏高；总分处于 6-7 分区间；风险评级高。
