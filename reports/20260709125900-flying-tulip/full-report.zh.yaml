      - number: '2.4'
        title: 增长驱动、采用约束与缺口
        blocks:
          - type: paragraph
            body: >
              最大顺风来自机构和受监管资金流入场：欧盟 Markets in Crypto-Assets（MiCA）框架、美国现货 Bitcoin
              ETF，以及传统银行的稳定币结算试点，正在把机构资本拉进合规链上通道；Mordor 把预测 CAGR 中约 +7.2% 归因于这一单一驱动。Layer-2 费用压缩和 Sonic
              这类高吞吐链降低了零售交易者切换成本。永续 DEX 增长（Thrive 称 YoY 约 346%）表明链上衍生品是增长最快的子板块，也是 Flying Tulip 跨保证金设计最有差异化的地方。逆风侧，美国财政部
              2023 年 DeFi Illicit Finance Risk Assessment 和 FATF 虚拟资产指引都把 DeFi 协议单独拎出来，关注 AML/CFT、制裁和消费者保护；SEC 对 DeFi
              项目（发行、质押、未注册交易所）的执法仍在继续。智能合约风险长期存在：Chainalysis 的 2024 年犯罪报告记录了数十亿美元级 DeFi 黑客事件，集中在跨链桥和借贷协议；Flying Tulip
              的跨保证金设计比单一产品 DEX 集中了更多攻击面。切换成本很高，因为既有 AMM 流动性深且黏（Uniswap 主导现货 DEX 成交量；Curve 主导稳定币 swap；Aave 主导借贷）。

              仍需保留的尽调缺口：（i）统一超级应用的真实可寻址支出无法直接衡量，因为没有分析师报告追踪这一特定组合；（ii）Grand View Research 的 US$26.94B 2025 年基数与 Mordor 的
              US$188.67B 2025 年基数相差约 7x；（iii）MEXC 的 US$1.3B 公开发售软承诺数字缺少第二来源交叉印证。
