  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >
              Flying Tulip 的监管边界异常宽。在美国，SEC 执法部仍在推进的“重要举措”指向加密发行、质押和未注册交易所； 向非合格美国人士出售的 SAFT、全球公开销售，以及一个可被主张构成投资合同的
              Perpetual PUT 期权，在 Howey 框架下叠加了多条风险向量。 CFTC 2026 年 7 月新闻稿已经提到，正积极执法与美国客户交易的境外交易所，这对一个全球链上超级应用是直接相关的先例。在欧盟，
              ftUSD 一旦流通到欧盟人士手中，MiCA 对加密资产服务提供商、稳定币发行人和储备证明的要求就会适用；Coinspeaker 提到 OFAC 筛查和税务报告功能，但合规栈没有公开点名。国际上，FATF
              虚拟资产指南施加旅行规则和类似 VASP 的预期， 无许可 DeFi 天然难以满足；美国财政部 2023 年 DeFi 非法金融风险评估明确警告，DeFi 协议会绕开 AML/CFT 和制裁控制。 基准先例是
              2022 年 8 月 OFAC 制裁 Tornado Cash 智能合约，随后 2024 年 11 月美国联邦上诉法院部分撤销该制裁 （据 Wikipedia
              档案）。该案同时说明两点：美国当局愿意制裁协议代码，而上诉层面对这种做法仍有抵抗——这是 Flying Tulip 继承的现实法律模糊区。
