    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、创立与产品范围
        blocks:
          - type: paragraph
            body: >
              Flying Tulip 更该被理解为 André Cronje 把多种 DeFi 原语压进单一跨保证金平台的最新尝试，而不是一个专业 DEX。多家独立媒体都把该项目描述为 Cronje 领导的 DeFi
              技术公司，叙事总部指向纽约，运营一套全栈链上交易所，在同一个跨保证金系统下整合原生稳定币 ftUSD、现货交易、永续合约和期权、借贷和货币市场，以及链上保险。协议承接 Deriswap——Cronje 2020
              年提出的概念，最早主张把多种 DeFi 功能并入一个平台——但这次把设计重心改写为 Cronje 所说的「从零重建借贷、交易、AMM、CLOB、衍生品、保险和稳定币」。多项来源确认，第一阶段部署发生在 Sonic
              Labs，并由手续费变现补贴初期零手续费交易；Ethereum、Base、Avalanche、BNB Chain 和 Solana 也被列为上线支持网络。截至本次报告日期，官方 flyingtulip.com
              几乎没有营销文字；文档放在 docs.flyingtulip.com，并把 Flying Tulip 包装成一个教育型 DeFi
              hub。独立追踪器和官方新闻稿复述了同一套产品分类，因此身份与产品范围得到交叉印证，尽管创始团队层面的披露仍然很薄。
