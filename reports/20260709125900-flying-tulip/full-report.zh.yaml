            body: >
              Flying Tulip 团队没有初始 FT 分配；团队成员改为通过按计划由协议收入支持的公开市场回购获得薪酬。这个设计把团队经济利益绑定到真实协议使用上，官方新闻稿已公开披露，也缓解了伤害过 Cronje
