      - number: '4.3'
        title: 成本结构、营运资本与资本充足性
        blocks:
          - type: paragraph
            body: >
              Flying Tulip 披露的成本结构有三条腿。第一是协议运营成本——Cronje 所说约 15 人的分布式团队，加上智能合约审计（未披露）、预言机和节点费用，以及 Sonic gas /
              补贴结算。第二是激励支出——LP 和交易者激励，资金来自储备收益流，最终来自协议费用。第三是回购支出——储备收益加收入被导向公开市场 FT
              回购，也用于支付团队薪酬。传统实物资产意义上的资本开支不存在；最接近的类比是智能合约审计和形式化验证成本。营运资本很轻，因为多数协议操作都在链上结算，储备池持有资产负债表的大部分。资本充足性是两层问题：赎回储备（约
              US$200M 私募 + 最高 US$800M 公开发售）在法律上留给赎回者，不能动用，因此运营余量受收益生成减运营成本约束。在约 US$40 million/年设计收益下，若每年把 US$40 million
              用于人员、审计、安全和回购支持的激励，金库净增长基本为零。链上 APY 一旦下降（BIS 的 DeFi 分析和 Ethena 报道都记录其跨周期波动很大），运营余量会被直接压缩。债务侧没有披露的公司债务义务，但
              perpetual-put 储备像一笔按需负债，由队列和速率限制控制赎回；一旦出现赎回挤兑，收益会被消耗，Flying Tulip 也可能被迫以不利价格解除储备头寸。BIS 和美国财政部都把这种流动性错配列为一阶
              DeFi 金融稳定风险。
