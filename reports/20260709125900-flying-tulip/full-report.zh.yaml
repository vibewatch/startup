  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >
              Flying Tulip 没有真正一对一竞品，因为目前没有既有 DeFi 协议把现货 AMM、订单簿永续、动态 LTV 借贷、收益型稳定币和链上保险做成一个跨保证金产品。因此，竞争格局必须按垂直环节逐一重建。现货
              DEX 上，Uniswap 仍是类别基准：DeFiLlama 的协议页面称其为「领先的去中心化加密交易协议」，Wikipedia 记录 Uniswap v4 于 2025 年 1 月 31 日上线，并继续在
              Ethereum、Base、Polygon 和 Avalanche 上占据主导。PancakeSwap 主导 BNB Chain，Curve 主导稳定币 swap。永续 DEX 上，Hyperliquid
              是最可信的既有玩家——其文档描述了一个运行 HyperBFT 共识的专用 layer-1，具备完全链上订单簿，「支持每秒 200k 笔订单」——其次是 dYdX，其官网声称累计成交量为
              US$1.5T、未平仓合约为 US$200M、覆盖 220+ 个市场，以及 GMX，DeFiLlama 称其为「领先的链上永续和现货交易所」，在 Arbitrum、Avalanche 和 Solana 上拥有
              80+ 集成。借贷上，Aave 是主导者（CoinLaw 记录 Aave V3 TVL 为 US$12.10 billion），Morpho Blue 的开源 Solidity
              代码（在其首页可见）展示了一种无需许可的隔离市场借贷原语。收益型稳定币上，Ethena 的 USDe/sUSDe 是 sftUSD 约 6% APY 的直接竞争对手。保险上，Nexus Mutual 和
              Sherlock 是链上保障场所的参考系。现状替代方案 Binance 和 Coinbase 仍是零售与机构用户的主流交易和托管目的地。内部自建也是一个真实但被低估的竞争者：任何 DAO
              或协议集成方只要工程能力足够，今天就能组合 Aave + Curve + Ethena + Nexus Mutual，而无需使用 Flying Tulip。
