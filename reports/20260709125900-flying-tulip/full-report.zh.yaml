companyProfile:
  summary: >-
    Flying Tulip 是 André Cronje 打造的去中心化金融超级应用，在同一套跨保证金系统里整合现货交易、永续合约、借贷、delta 中性收益型稳定币 ftUSD 和链上保险。公司成立于 2025 年，2025 年 9
    月 29 日以 $1B 完全稀释代币估值完成 $200M seed SAFT；投资方是广泛的加密原生联合体，没有单一领投，成员包括 Brevan Howard Digital、CoinFund、Susquehanna
    Crypto、DWF Labs、FalconX、Hypersphere、Lemniscap、Nascent、Republic Digital、Selini、Sigil Fund、Tioga Capital 和 Virtuals
    Protocol。每一枚一级销售 FT 代币都带有 Perpetual PUT 赎回权；团队没有初始 FT 分配，薪酬来自协议收入支持的公开市场回购。协议首先在 Sonic Labs 上线，并以零手续费交易启动；ftUSD 已于
    2026 年 1 月 23 日上线，FT 代币在 2026 年 2 月 23 日 TGE 后可转让。
  foundedDate: '2025-08-14'
  founders:
    - name: André Cronje
      role: 创始人
      background: >-
        Yearn Finance（2020 年 7 月）创造者，Fantom Foundation 及其 Sonic 品牌重塑的共同架构者；2020 年 Deriswap 概念的作者，Flying Tulip
        正是在复活这一设计。市场普遍认为他是最高产的 DeFi 建设者之一；他的履历同时写着重大牵引力和阶段性公开争议。
  foundingLocation: null
  headquarters: null
  productSummary: >-
    一套统一链上金融系统，把五个产品里的定价、信用和风险标准化：自适应曲线现货 AMM、跨保证金 CLOB 永续合约、动态 LTV 货币市场、ftUSD / sftUSD delta 中性收益型稳定币、链上保险；另有由新型
    Witnessnet TLS 证明 HTTPS 预言机框架裁决的二元预测市场。FT 总供应固定为 10 billion 枚，一级销售 FT 附带 Perpetual PUT 赎回权，并由储备收益和协议收入支持回购销毁机制。
  customerFocus: 零售交易者、链上流动性提供者、DAO 财库、机构自营做市商，以及 DeFi 协议集成方。
  businessModel: >-
    储备本金（最高 $1B）部署到 Aave、Ethena 和 Spark，设计目标约 ~4% APY（约 ~$40M/yr），用于支付运营成本、激励和 FT 回购。Sonic
    零手续费补贴窗口结束后，第二层协议收入来自交易费、借贷利差、ftUSD 收益截留、清算罚金和保险保费。
  stage: Seed
  fundingStatus: >-
    $200M 私募 SAFT 于 2025 年 9 月 29 日完成，FDV 为 $1B；最高 $800M 的公开发售于 2026 年 2 月 16 日开启，估值同为 $1B；TGE 为 2026 年 2 月 23 日，价格
    $0.10/FT。仅 MEXC 报道称，公开发售软承诺超过 $1.3B，另有来自 Amber Group、Fasanara Digital 和 Paper Ventures 的 $25.5M Series A 延展轮，以及
    Impossible Finance Curated 的 $50M 批次。
  disclosureProfile: stealth
