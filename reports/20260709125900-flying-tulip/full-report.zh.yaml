  - id: TV005
    title: 打破投资假设与终止触发项表
    columns:
      - 触发项
      - 阈值
      - 对投资假设的传导
      - 行动含义
    rows:
      - - SEC / CFTC / OFAC 针对 SAFT 或 ftUSD 采取行动
        - 任何执法函或制裁名单列名
        - 监管尾部风险兑现；用户流失
        - 退出头寸；下调为回避
      - - 储备或跨保证金引擎被攻击
        - 任何攻击事件
        - 偿付能力承压；PUT 信任被打破
        - 退出头寸；一级持有人强制行使 PUT 赎回
      - - 赎回挤兑压力
        - 队列和限速超过 72 小时
        - BIS 所称流动性错配情形
        - 降低敞口；核查储备投放场所
      - - Cronje 离开或公开退出
        - 公告或 30+ 天沉默
        - 营销声量和 Sonic 协同同时收缩
        - 降低敞口；索取继任计划
      - - Sonic 补贴撤回
        - 费用变现补贴有任何变化
        - 零费用获客结束；单位经济改变
        - 重建补贴后单位经济模型
      - - 储备投放场所受损
        - Aave / Ethena / Spark 被攻击或脱锚 > 2%
        - 收益流压缩
        - 调整储备配置；向 LP 披露
      - - FT 交易价持续低于 US$0.10
        - 持续低于底价交易（14+ 天）
        - 赎回压力上升，公众信心破裂
        - 核查队列健康度
      - - MM 退出
        - 具名 MM 退出或价差扩大
        - 流动性收缩
        - 确认 MM 承诺
      - - 桥攻击
        - 桥合作方受损
        - 多链上线停滞
        - 暂停跨链活动
      - - 审计暴露此前未披露缺陷
        - 公开审计披露严重发现
        - 信任收缩
        - 等待修复
      - - 截至 2026-Q4 末仍无公开审计披露
        - 未发布审计
        - 安全态势仍不透明
        - 在审计前下调为回避
    notes: |
      每个触发项都可监测，并配有明确行动含义。合起来，它们把建议表中的下调条件落到操作层。
    claimRefs:
