      - number: '2.3'
        title: 买方、用户与付费方分层
        blocks:
          - type: paragraph
            body: >
              Flying Tulip 的「用户」和「付费方」在智能合约里常常重合，但尽调需要的分层仍然很清楚。零售交易者（Mordor：2025 年 DeFi 市场份额
              62.12%）是最大的成交量分层；他们通过买卖价差、资金费率和 swap 费用支付隐性费用，采用触发点是 UX——一个不用在协议之间跨桥的「超级应用」。流动性提供者（LP）和做市商从赚取或放弃 swap
              费用的角度，是协议收入的「付费方」；机构自营做市商（Susquehanna Crypto、Selini、DWF Labs）也出现在 Flying Tulip 的 SAFT
              投资方名单中，激励边界因此变得模糊。DAO 财库和机构资产管理人（Mordor：到 2031 年 CAGR 32.55%）越来越多地把 DeFi 借贷和稳定币收益场所当作现金管理工具；ftUSD 可选择收益（约
              6% APY）直接瞄准这一分层。协议集成方（其他 DeFi 协议把 Flying Tulip 原语当作构件）是第四类。各分层采用路径是：（i）LP 和做市商为 Sonic
              上零手续费交易播下流动性；（ii）零售交易者进来捕捉零手续费现货和杠杆永续；（iii）DAO 财库和小型机构把稳定币资本停进 sftUSD 赚收益；（iv）集成方把 ftUSD
              嵌入为结算抵押品。预算决策权在代币持有人、交易对手方或 DAO 财库负责人手里，而不是传统采购职能。
