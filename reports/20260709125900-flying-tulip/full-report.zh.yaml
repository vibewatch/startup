      - number: '8.4'
        title: 图表
        blocks:
          - type: callout
            title: 只要储备模型按设计运转，US$1B FDV 在机制上可以自洽
            body: >
              大多数代币发行的 FDV 都带有投机色彩，Flying Tulip 的 US$1B 则直接连接到可部署储备池。每个 FT 一级销售持有人都有按面值赎回的 Perpetual PUT
              权利。只要（i）储备智能合约经过审计且保持偿付能力，（ii）收益场所（Aave、Ethena、Spark）维持 APY， （iii）没有监管机构强制解除储备仓位，这个 FDV 确实比任何可比 DeFi
              代币发行都更有资产支撑。
            calloutType: strength
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV017
          - type: callout
            title: TGE 前预测市场对 US$400M 是 50-50——市场怀疑 US$1B
            body: >
              MEXC 的 TGE 帖指出，上市前预测市场认为 Flying Tulip 交易价高于 US$400M FDV 的概率只有约 50-50，明显低于 US$1B 的内部人标记。
              这是少见的独立、市场定价的不利信号。因此，基准情景不应使用 US$1B 锚点，而应采用向储备机制底价倾斜的概率加权组合。
            calloutType: risk
            claimRefs:
              - CV004
              - CV011
          - type: callout
            title: 六个未解尽调阻碍使建议停留在跟踪，而非买入
            body: >
              独立审计披露、具名 CCO / CTO、储备场所分配政策、Sonic 补贴合同条款、MiCA 合规栈，以及公开销售结算只由 MEXC 印证，
              是让建议停留在跟踪的六个阻碍。只要其中任意三个得到解决，即可在估值偏高但可辩护的前提下上调至买入。
            calloutType: risk
