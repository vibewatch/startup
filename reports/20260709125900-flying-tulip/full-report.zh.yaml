      - number: '1.2'
        title: 领导层、团队与关键人依赖
        blocks:
          - type: paragraph
            body: >
              公开领导层档案异常单薄，依赖几乎集中在一个人身上。所有已审阅来源都把 André Cronje 认定为创始人和公开门面；The Block、Blockhead、BSC News、Coinspeaker 和
              Ventureburn 都大量引用他对战略、代币经济、竞争框架和上线节奏的表述。Cronje 也被描述为 Yearn Finance（2020）的开发者、Fantom Foundation 及其 Sonic
              品牌重塑的共同架构者，以及 Flying Tulip 所复活的 2020 年 Deriswap 原始概念作者。Cronje 之外，记录基本沉默：他告诉 The Block，Flying Tulip 目前「约 15
              人，分布在美国、欧洲和亚洲」，并在积极招聘，但已审阅来源没有公开具名联合创始人、CTO、总法律顾问、工程负责人或董事会成员。参与投资的 VC 之一 Lemniscap 在自家博客里公开承认，Flying
              Tulip 的融资原语依赖「一个拥有声誉、影响力和信任、足以吸引」大额资本的关键人物或团队；这等于直接承认，这里的底层尽调风险落在 Cronje 个人身上。关键人集中是重要治理信号，因为 Cronje 曾在
              2022 年 3 月公开退出 DeFi 后又回归；他的过往项目（Yearn、Solidly/Fantom）也不时围绕代币经济、安全事件和个人行为引发争议，并后来传导到他相关的协议。
