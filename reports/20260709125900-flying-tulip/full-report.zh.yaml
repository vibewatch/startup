  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >
              Flying Tulip 的产品范围迫使市场边界拉得异常宽。交易轴上，它同时面对现货 DEX（Uniswap、Curve、PancakeSwap）和永续
              DEX（Hyperliquid、dYdX、GMX）；借贷轴上面对 Aave、Compound 和 Morpho；稳定币轴上面对 USDC、USDT、DAI，以及 Ethena 的 USDe
              等收益型同行；链上保险轴上面对 Nexus Mutual 和 Sherlock。它还在聚合轴上与中心化交易所（Coinbase、Binance）竞争，Cronje
              本人也在媒体报道中把这些交易所称为整体性竞争对手。

              因此，承销 Flying Tulip 时合适的市场边界不是泛泛的「DeFi」，而是（1）链上交易、（2）抵押借贷、（3）收益型美元流动性的交集；这个交集大致可由 DeFiLlama 的 DEX + lending
              + stablecoin 分类捕捉。纯 NFT 市场、预测市场和通过中心化场所清算的链下加密衍生品不应纳入边界。现状替代方案是带链下托管的中心化交易所（CEX）交易，后者仍主导结算量；Chainalysis 和
              Reuters 数据显示，2025-2026 年 CEX 对 DEX 现货比例才刚收窄到 5:1 区间。思考 Flying Tulip
              可寻址支出时，这组替代方案才是正确分母，因为多数零售和机构交易流仍从中心化轨道出发。
