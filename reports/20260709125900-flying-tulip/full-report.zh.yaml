      - number: '2.2'
        title: TAM、SAM 与规模测算口径
        blocks:
          - type: paragraph
            body: >
              分析机构对 DeFi 的规模测算分歧异常大，因此没有单一数字能锚定 Flying Tulip 的 TAM。Mordor Intelligence 预计 DeFi 市场 2026 年为 US$238.54
              billion，到 2031 年增至 US$770.56 billion，CAGR 为 26.43%；领先子切片包括借贷（2025 年份额 27.33%）、储蓄 /
              收益耕作（36.52%）、零售用户（62.12%）和北美（42.78%）。Grand View Research 则把 2025 年基数只放在 US$26.94 billion，并预测以更陡的 68.2%
              CAGR 增至 2033 年 US$1.42 trillion，主要驱动来自协议费变现。两组估计几乎差一个数量级，因此我们把 Flying Tulip 的 SAM
              锚定在链上可观测收入和资本，而不是分析师市场规模猜测：DeFiLlama 报告，截至 2026 年 6 月的过去 365 天，DeFi 协议总费用为 US$24.91 billion，合计 TVL 为
              US$71.77 billion，RWA TVL 为 US$26.01 billion，稳定币流通供应为 US$314 billion。仅永续 DEX 成交量在 2025 年就达到 US$6.7
              trillion（Thrive 称 YoY 346%），CoinLaw 和 Thrive 称月度永续 DEX 成交量如今在 US$10-50 billion 区间。对 Flying Tulip 四产品套件（现货
              DEX + 永续 DEX + 借贷 + 稳定币）而言，保守 SAM 因此围绕约 US$25 billion 年度链上协议费，加上稳定币收益利差。第一年 SOM 受 TGE 时约 US$126 million
              TVL（据 MEXC）约束。
