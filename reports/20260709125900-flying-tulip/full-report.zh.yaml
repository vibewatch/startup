      - number: '1.4'
        title: 里程碑、上线与不利信号
        blocks:
          - type: paragraph
            body: >
              Flying Tulip 有日期标记的公开记录很短，却已经出现几个承重事件。私募 SAFT 于 2025 年 8 月 14 日开启、9 月 29 日关闭；项目在关闭时公布 $200M 融资及其
              perpetual-put 机制。2025 年 10 月至 2026 年 1 月，团队在 Sonic 上加固部署，并于 2026 年 1 月 23 日上线 ftUSD，这是一种 USDC 支持、可选择收益的
              delta 中性稳定币（Sonic 上初始上限 1 million ftUSD，APY 约 6%）。公开发售于 2026 年 2 月 16 日开启；MEXC 的 TGE 解释稿称软承诺超过 $1.3B；FT
              代币于 2026 年 2 月 23 日以 $0.10 上线价格变为可转让，对应约 ~$1B FDV，并很快稳定在 $0.10 的 put 隐含底价附近。不利信号包括：（i）perpetual-put
              设计靠新型智能合约队列和速率限制执行，带来偿付能力和技术攻击面，Lemniscap 在披露中明确点出这一点；（ii）FT 在 TGE 附近交易时先跌到约 $0.08 后才回到
              $0.10，说明所谓「保证底价」从第一天就被测试；（iii）上线前预测市场只给 Flying Tulip 约 50-50 的概率守住 $400M 以上 FDV，与 $1B 内部标记反差强烈；（iv）Cronje
              的履历包括 2022 年 3 月高调退出 DeFi，以及过往项目相邻争议，监管者、记者和怀疑者都曾点名；（v）DeFi 监管态度仍然强硬——美国财政部 2023 年 DeFi Illicit Finance
              Risk Assessment 和 FATF 虚拟资产指引都明确把 DeFi 协议列为 AML/CFT、制裁和消费者保护执法的高风险对象。
