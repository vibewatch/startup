  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与确认
        blocks:
          - type: paragraph
            body: >
              Flying Tulip 的收入模型是两层结构。第一层是储备收益流：Cronje 告诉 The Block，最高 US$1 billion
              的募资本金会部署到链上收益场所（Aave、Ethena、Spark），目标 APY 约 4%，产生设计目标 US$40 million/年收益；这在会计意义上不是客户收入，却是在 perpetual-put
              仍有效时唯一可支配现金流入。第二层是 Cronje 在媒体采访和 BSC News 概览中列举的协议级收入：交易和借贷费用、清算罚金、ftUSD
              收益截留，以及链上保险保费。截至本次报告日期，第二层收入都无法独立验证，因为 FT 代币直到 2026 年 2 月 23 日才可转让，Sonic 上线交易被补贴到零手续费，Flying Tulip 也没有发布类似
              Uniswap Labs 或 Aave 的链上收入看板或 Dune 式分析披露。因此，收入确认最好被视作「储备收益计作回购燃料 + 协议费收入资本化为代币回购」，而不是 GAAP 收入。

              尽调上，最接近的类比是 Coinbase 10-K 等 SEC 报告链如何确认交易费、稳定币浮存收入和托管收入——Flying Tulip
              的组合在结构上会相似，但费用捕获完全在链上，而不是来自法币入金费用；同时赎回储备是一块异常大的非经营资本池。
