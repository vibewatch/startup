      - number: '6.3'
        title: 留存、扩张与集中度风险
        blocks:
          - type: paragraph
            body: >
              Flying Tulip 目前还算不出留存数据：截至本次报告日，FT 代币交易不足五个月，交易模块仍在 Sonic 上爬坡， 也没有公开的分群级分析看板。扩张抓手在结构上很强：（i）Sonic
              零费率补贴拉动零售获客； （ii）sftUSD 的可选收益吸引 DAO 和机构稳定币资本；（iii）跨保证金引擎让同一钱包内的产品间交叉销售成为可能； （iv）向
              Ethereum、Base、Avalanche、BNB Chain 和 Solana 的多链扩展拓宽 LP 侧触达面。集中度风险在多条轴线上都异常高： （a）Sonic Labs
              集中——首发链是关联方，Cronje 是其共同架构者，零费率补贴依赖单一伙伴； （b）自营做市商与 SAFT 投资者重叠——Susquehanna、Selini、DWF、FalconX
              既提供资本又提供流动性，做市商退出会压缩点差质量； （c）收益场所集中——Aave、Ethena 和 Spark 是储备场所，任一单一场所被攻击或脱锚都会压缩约 US$40M/yr 的收益流； （d）André
              Cronje 关键人物集中是面向客户的风险，因为 Cronje 的公众形象就是主要营销界面。钱包用户的使用摩擦基本为零， 但机构用户的门槛不低：他们需要 MiCA
              合规、托管保证和已审计资产支持；截至本次报告日，这些都没有完整披露。不利背景是： BIS 的 DeFi 分析和美国财政部 DeFi 风险评估都点出 DeFi
              客户风险，包括流动性错配、非法金融敞口和未经审计的原语。
