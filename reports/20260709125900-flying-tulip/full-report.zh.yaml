              Capital、Virtuals Protocol）， 以及 2026 年 2 月 16 日开放的公开销售出资池（MEXC 报道软承诺超过 US$1.3B）。每个一级销售 FT 仓位都带 Perpetual
              PUT 赎回权。第二类是链上流动性提供方和做市商，其中一部分与第一类重合——Susquehanna Crypto、 Selini、DWF Labs 和 FalconX 同时是 SAFT
              出资者和自营做市商；其下游交易与报价事实上构成客户关系。 第三类是 TGE（2026 年 2 月 23 日）进入的零售交易者，他们在 Sonic 上使用零费率现货和跨保证金永续合约；
              这些是匿名钱包，不是具名账户。第四类是把 ftUSD/sftUSD 当作收益场所的 DAO 金库和小型机构；据 Stablecoin Insider，Sonic 上 sftUSD 质押余额已突破最初 1M
              ftUSD 上限。第五个边界案例是 Sonic Labs： 它既是合作伙伴，也因 Flying Tulip 早期收入和 TVL 都经过 Sonic 链而成为隐含的生态客户。截至本次报告日，
