      - number: '1.3'
        title: 融资历史、代币经济与投资方基础
        blocks:
          - type: paragraph
            body: >
              Flying Tulip 的资本故事在轮次形态和工具上都不寻常。Cronje 告诉 The Block，此轮融资于 2025 年 8 月 14 日开启、9 月 29 日关闭，承诺金额 $200M，完全稀释代币估值
              $1B，工具是未来代币简单协议（SAFT），而非股权轮，且没有单一领投方。具名联合体横跨加密原生基金（CoinFund、Hypersphere、Lemniscap、Nascent、Republic
              Digital、Tioga Capital、Sigil Fund）、做市商（DWF Labs、Selini、FalconX）、传统金融加密部门（Brevan Howard Digital、Susquehanna
              Crypto）和生态代币方（Virtuals Protocol）。核心结构特征是链上「perpetual put」赎回权：每一位私募轮和公开销售投资者都可以随时销毁 FT
              代币，按原始出资本金上限赎回其贡献资产（ETH、USDC 等）。Cronje 明确告诉 The Block，「实际融资额是零」，因为支撑赎回的储备不能作为运营资本花掉；相反，最高约 $1B
              的潜在募资会部署到链上收益场所（Aave、Ethena、Spark），目标约 ~4% APY，预计每年产生约 $40M 收益，用于激励和公开市场回购。团队成员明确没有初始 FT
              分配，薪酬来自按计划由协议收入支持的回购。官方公告描述了一项最高 $800M、同样 $1B 估值的公开发售计划；MEXC 对 2026 年 2 月 23 日 TGE 的报道还提到后续更小批次（Amber
              Group、Fasanara Digital、Paper Ventures 参与的 Series A，以及 Impossible Finance Curated 轮），但这些后续批次的来源一致性较弱。
