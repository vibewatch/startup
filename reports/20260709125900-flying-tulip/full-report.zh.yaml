          low: 20
          mid: 40
          high: 60
        - label: 规模化后的协议费用捕获（US$M/yr）
          low: 10
          mid: 100
          high: 500
    approximationNotes: |
      低位 FDV 锚定 TGE 前预测市场区间（US$0.4B）；基准锚定当前储备隐含 FDV（US$1B）；
      高位锚定跨保证金解锁叠加 MiCA 驱动的资金流入（US$3B）。储备收益区间假设 US$1B 上的 APY 为 2%-6%。
      规模化后的协议费用捕获假设在 US$24.9B TTM DeFi 费用池的一个子集中拿到 5-25% 份额。
