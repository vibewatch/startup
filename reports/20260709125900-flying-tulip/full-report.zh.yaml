      - number: '7.3'
        title: 伙伴依赖、人员与缓释
        blocks:
          - type: paragraph
            body: >
              Flying Tulip 的依赖图收敛到少数交易对手，任何一方失效都会实质性削弱协议。Sonic Labs 是首发链和补贴来源， 也是 Cronje 相关的关联方；Sonic 的费用变现政策一旦变化，或
              Sonic 出现宕机，Flying Tulip 的零费率零售获客窗口会立即收窄。 储备收益集中在 Aave v3、Ethena 和 Spark；单一场所被攻击或脱锚就是一阶威胁。自营做市商重叠
              （Susquehanna Crypto、Selini、DWF Labs、FalconX 同时是 SAFT 投资者，也可能是做市商）意味着大型做市商退出会同时压缩流动性和投资者信心。
              跨链桥是历史损失大类，Ethereum、Base、Avalanche、BNB Chain 和 Solana 扩展都会碰到。监管机构 （SEC、CFTC、MiCA、FATF、OFAC）也是一种依赖：任何针对
              Perpetual PUT SAFT 或 ftUSD 稳定币的敌对行动都会压缩采用。 人员和执行风险集中在 André Cronje 身上：他是已审阅来源中唯一具名负责人，没有披露联合创始人或
              CTO，也没有具名法律合规负责人—— 对一个运行全球公开销售、FDV 达 US$1B 的协议来说，这是重要治理缺口。缓释因素包括：Perpetual PUT 储备在架构上隔离；
              赎回队列和速率限制保护偿付能力；团队薪酬通过回购流与表现对齐；文件提到 OFAC 筛查和税务报告。尽调团队应监控的止损条件包括： （a）任何点名 Flying Tulip 的 SEC 或 CFTC
              执法行动；（b）超过队列速率限制的赎回挤兑事件；（c）Cronje 离开或公开退出； （d）Sonic Labs 改变费用变现政策；（e）任何 Aave/Ethena/Spark 脱锚或被攻击；（f）FT
              在持续窗口内低于 US$0.10 的 PUT 隐含底价。
