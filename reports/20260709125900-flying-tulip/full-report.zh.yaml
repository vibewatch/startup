        - Sonic 补贴窗口延长 1–2 个季度；完整超级应用在 2026 年下半年上线；储备在 US$1B 上赚取约 4% APY；无执法行动；协议费用收敛到 US$24.9B TTM DeFi 费用池的约 5–10%
        - FDV 守在 US$1B 储备隐含底价附近，回购销毁带来有限上行
        - 收益场所任何攻击；MiCA 分类；审计缺口
        - 温和——预测市场提示 US$400M 以上是 50-50
      - - 乐观
        - 跨保证金把 TVL 从 US$126M 拉高 5–10 倍；MiCA 合规路径打开欧盟机构资金；ftUSD 供应突破 1M 上限
        - 回购销毁持续复利，协议收入支撑 US$3–5B FDV 倍数；二级市场 FT 价格明显高于 US$0.10 底价
        - 永久卖权原语出现仿盘；既有玩家转向跨保证金
        - 上线前偏低；若所有产品模块按时交付，仍说得通
      - - 悲观
        - SEC / CFTC / OFAC 针对 SAFT 或 ftUSD 采取行动；审计触发攻击；出现赎回挤兑；Cronje 离开；Sonic 撤回补贴
        - FT 跌向面向一级销售持有者的 US$0.10 卖权隐含底价；二级卖家承担卖权失效损失；FDV 压缩到 US$400M 预测市场区间
        - 连锁清算；桥攻击
        - 预测市场在 TGE 前已计价
      - - 深度悲观
        - 多重失败同时发生——审计暴露攻击、监管行动、储备场所受损
        - 赎回储备偿付能力承压；队列和限速机制失效
        - 储备被迫在不利价格平仓；类似 Chainalysis / BIS 流动性错配情形
        - 概率低，但 Tornado Cash 与 BIS 评论让这种尾部情形有历史参照
    notes: |
      情景锚定公开记录信号（预测市场评级、MEXC TVL、DeFi 费用池）。悲观和深度悲观行保留尾部，不把风险抹平。
