      - number: '5.2'
        title: 架构、储备部署与 Sonic 集成
        blocks:
          - type: paragraph
            body: >
              Flying Tulip 技术栈有五层。第 1 层是赎回储备：SAFT 和公开发售贡献的本金由链上储备合约持有，并部署到外部低风险场所（术语表明确点名 Aave v3 获取保守收益；The Block 补充
              Ethena 和 Spark）。第 2 层是跨保证金风险引擎，在各产品之间统一抵押品。第 3 层是产品套件（自适应曲线 AMM、CLOB 永续、动态 LTV
              货币市场、ftUSD/sftUSD、保险、预测市场）。第 4 层是 Witnessnet——一个智能合约可验证的 TLS 证明框架；术语表称，它让合约使用「AEAD 认证 TLS
              记录」和有效服务器证书作为证据，从而把任何 HTTPS 端点变成「隐式预言机」。第 5 层是链部署：Sonic 作为上线链（由 Cronje 共同架构）提供零手续费补贴、吞吐和初始资本效率；The Block 和
              Ventureburn 称，Ethereum、Base、Avalanche、BNB Chain 和 Solana
              是后续部署目标。赎回储备通过队列和速率限制保护偿付能力：如果储备暂时不足，请求进入透明队列，并在资本补足时处理。按术语表，团队薪酬通过由支持资本收益盈余和协议收入支持的回购销毁合约流转。FT 总供应固定为 10
              billion 枚预铸代币，供应在流通与非流通桶之间移动，而不是新增铸造。
