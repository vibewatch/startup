      - number: '5.5'
        title: 图表
        blocks:
          - type: callout
            title: 文档术语表暴露出不寻常的技术野心——Witnessnet TLS 证明预言机
            body: >
              docs.flyingtulip.com 术语表把「Witnessnet」描述为一个框架，让智能合约通过 AEAD 认证 TLS 记录、有效证书和 Finished-message 验证在链上验证 HTTPS
              响应——从而让「任何 HTTPS 端点成为隐式预言机」。如果按文档交付，它会是比 Chainlink Functions 或 TLSNotary
              明显更通用的预言机原语，可同时供给预测市场和储备证明。它也技术难度很高，且尚未经过独立基准测试。
            calloutType: strength
            claimRefs:
              - CE015
              - CE016
          - type: callout
            title: 固定 10B FT 供应加回购销毁，是一套真正通缩的代币设计
            body: >
              按术语表，FT 总供应固定为 100 亿枚，预铸后不再通胀。支撑资本产生的收益盈余、协议收入， 以及 PUT 失效后释放的资本，都会流入回购并销毁合约，永久减少流通供应。再加上每一枚一级发行 FT
              都由真实资产组成的赎回储备托底，这几乎是 DeFi 里最干净的供应设计之一。
            calloutType: strength
            claimRefs:
              - CE013
              - CE014
              - CE028
          - type: callout
            title: 截至本次报告日没有公开审计报告，与既有龙头形成鲜明反差
            body: >
              Aave、Uniswap 和 Ethena 都在文档中公开链接多份第三方审计报告。Flying Tulip 自己的文档 （docs.flyingtulip.com）截至本次报告日没有链接审计报告；Sherlock
              和 Code4rena 在已审阅公开来源中 也没有公开列出 Flying Tulip 审计。赎回储备、跨保证金引擎和 Witnessnet 原语都很新，而且都是承重模块，
