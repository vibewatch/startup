      - CV032
      - CV033
      - CV034
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 独立审计
        - Sherlock / OpenZeppelin / Trail of Bits 针对储备、跨保证金、ftUSD、现货 AMM、永续 CLOB、保险的报告
        - 每个既有玩家都发布多轮审计
        - 向 Cronje / Flying Tulip 法务索取
      - - 具名法律 / 合规负责人
        - CCO 或总法律顾问，以及 OFAC 筛查技术伙伴
        - 监管尾部风险需要具名责任人
        - 向投资人（CoinFund、Brevan Howard）询问姓名
      - - 储备投放场所配置政策
        - Aave、Ethena、Spark 之间的拆分，以及集中度上限和对冲
        - 收益流脆弱，却是运营生命线
        - 索取储备配置备忘录
      - - Sonic 补贴合同条款
        - 合约期限、续约选项及 Cronje 关联方披露
        - 零费率散户获客依赖该合约
        - 向 Sonic Labs 治理方索取
      - - 具名 CTO / 工程负责人 / 安全负责人
        - 工程领导层与漏洞赏金计划
        - 小团队支撑五个产品并跨多链运营
        - 向 Cronje 索取角色覆盖说明
      - - 团队薪酬安排表
        - 回购速率上限、归属曲线与解锁安排
        - 团队留任与等效稀释
        - 向基金会法律顾问索取
      - - 公开销售结算报告
        - 经审计师调节的公开销售结束报告
        - MEXC 披露的 US$1.3B 软承诺数字缺少独立佐证
        - 向 Flying Tulip 法务索取
      - - Series-A 延展轮佐证
        - Amber Group、Fasanara Digital、Paper Ventures 的独立新闻稿
        - US$25.5M 延展轮仅有 MEXC 引用
        - 要求各参与方公开确认
      - - ftUSD 的 MiCA 法律意见书
        - EBA 分类（EMT vs ART）及储备证明频率
        - 欧盟机构资金准入门槛
        - 向欧盟法律顾问索取
      - - 公开链上收入看板
        - Flying Tulip 的 Dune / Token Terminal 同类看板
        - 标准 DeFi 透明度信号
        - 基于 Flying Tulip 合约发布 Dune 看板
    notes: |
      每一行把缺失的具体证据材料与尽调路径配对。该表可直接放入资料室索取清单。
