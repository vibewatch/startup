      - number: '5.3'
        title: 部署、集成、可靠性与路线图
        blocks:
          - type: paragraph
            body: >
              Flying Tulip 的部署顺序是先 Sonic、再多链；Cronje 公开概括为：「先在 Sonic 上加固，因为手续费变现和补贴让 Flying Tulip
              能提供零手续费交易，然后再把完整套件部署到其他链」（The Block、Blockhead）。第一个已交付产品是 ftUSD，2026 年 1 月 23 日在 Sonic 上线，初始上限 1M ftUSD，由
              USDC 支持（据 Stablecoin Insider）。FT 代币在 2026 年 2 月 23 日 TGE 时变为可转让（MEXC）。Cronje 还描述了进一步路线图雄心：随着 ftUSD
              供应增长，加入更高级收益策略并覆盖更多链。截至报告日期，集成包括 Aave、Ethena、Spark 和 Sonic；术语表列出 jupSOL、wAVAX、cbBTC、USDe、USDtb、USDS，以及多种
              wrapped BTC/ETH 变体作为可接受资产。可靠性和可观测性取决于 Sonic 的 HyperCore 式吞吐（Sonic
              docs）、储备智能合约审计（截至报告日期审计报告未公开披露）以及外部收益场所的可靠性；这些场所审计成熟，但各自都带有智能合约风险。支持界面包括文档站、文档术语表、社交渠道和社区支持渠道。Cronje 对 The
              Block 描述上线时点时说：「比人们想的更快，比人们希望的更晚」。Aave 文档和 Uniswap 文档给出了成熟 DeFi 在生产级可靠性、审计披露和集成打磨上的基准；Flying Tulip
              自家文档很新，也更薄，但正在快速补齐。
