      - number: '7.2'
        title: 运营、安全与财务模型风险
        blocks:
          - type: paragraph
            body: >
              Flying Tulip 把运营和安全风险集中到两个异常承重的系统里：（i）跨保证金风险引擎，把现货、永续、借贷、保险和预测市场的抵押品统一起来； （ii）Perpetual PUT
              赎回储备，虽然设有队列和速率限制，但压力下必须保持偿付能力。截至本次报告日，docs.flyingtulip.com 没有公开链接这两个系统的独立审计报告；Aave、Uniswap Labs 和 Ethena
              则都发布过多轮审计。Chainalysis 的 2025 Crypto Crime Report 记录了历史上数十亿美元级 DeFi 黑客活动，损失集中在桥和借贷协议——Flying Tulip
              的多链路线图和动态 LTV 设计都会继承这两类风险。财务模型风险来自收益来源集中：Aave 利用率、熊市中 Ethena 基差压缩，以及 Spark 对 Sky/USDS 生态的依赖，都可能把储备 APY
              腰斩。储备本金在法律上指定给赎回者，因此收益压缩 200 个基点大约会压掉每年 US$20M 的运营开支。没有具名 CCO / 总法律顾问，加上私营公司的披露姿态，抬高了欺诈和内控风险。营运资本本质上就是收益流；
              熊市 APY 压缩一旦叠加 opex 上升，公司一到两个季度内就得削减支出。
