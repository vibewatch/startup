      - number: '4.4'
        title: 财务结论与尽调阻断项
        blocks:
          - type: paragraph
            body: >
              截至报告日期，财务结论是：Flying Tulip 是一个设计目标 US$40 million/年收益捕获机制，还没有证明运营收入，却以 US$1 billion FDV 定价；这个 FDV
              机械等于它不能花掉的储备池。这不是收入倍数，而是一张期权，押注 Cronje 能把储备收益支持的激励转化为协议收入，并且速度快过既有 DEX
              和借贷竞争者的响应。上线前收入质量天然低，因为零手续费补贴按设计压低当前费用捕获。作为 DeFi
              协议，利润率路径在结构上很高（每笔交易边际成本近零），但只有补贴窗口关闭且持续成交量留存后才能看见。传统意义上资本密集度低，但储备池制造出一张很大的非经营资产负债表，如何管理这张表才是主导风险。

              尽调阻断项：（i）没有审计财报、没有 Dune 式链上收入看板、没有协议 P&L；（ii）与回购流绑定的团队薪酬表未披露；（iii）没有确认的储备管理政策（Aave、Ethena、Spark
              的占比未公布）；（iv）US$1.3B 软承诺和 US$25.5M Series-A 延展轮只有 MEXC 印证；（v）Sonic Labs 商业补贴条款未披露，且 Cronje 在 Sonic
              的共同架构者角色制造关联方动态。不利侧，BIS Quarterly Review 明确警告，DeFi 漏洞「可能很严重，因为高杠杆、流动性错配、内建互联性，以及缺少银行等冲击吸收器」；美国财政部 2023 年
              DeFi Risk Review 也从 AML/CFT 角度呼应了这些担忧。
