  - id: TM004
    title: 增长驱动因素和约束表
    columns:
      - 驱动因素或约束
      - 方向
      - 时点
      - 对 Flying Tulip 的影响
      - 尽调问题
    rows:
      - - 欧盟 MiCA 框架 + 美国现货 Bitcoin ETF 获批
        - 驱动
        - 短期（<= 2 年）
        - 将机构资本拉入合规链上通道；Mordor 将 DeFi CAGR 约 +7.2% 归因于此
        - 确认 Flying Tulip 合规栈（OFAC 筛查、Coinspeaker 新闻稿所称税务报告）能支持 MiCA 和 MiFID 对手方
      - - 核心垂直 DeFi TVL 上升
        - 驱动
        - 中期（2–4 年）
        - 历史上往往伴随更大的兑换和借贷费用池
        - 按季度跟踪 TVL 与 DeFi 总量，验证相对现有玩家的份额提升
      - - Layer-2 和 Sonic 费用压缩
        - 驱动
        - 短期
        - 降低从 CEX 切换的成本，扩大可跑通的用例；Flying Tulip 在 Sonic 零费率启动要靠它
        - 确认 Sonic 补贴合约能顶住费用返还治理决策
      - - 永续 DEX 增长（2025 年同比约 346%）
        - 驱动
        - 短期
        - 增长最快的子赛道；Flying Tulip 的跨保证金永续模块直接打这里
        - 上线后跟踪 Flying Tulip 永续合约相对 Hyperliquid 的市场份额
      - - RWA TVL 增长（链上约 US$26B）
        - 驱动
        - 中期
        - 可作为 ftUSD 和借贷抵押品；扩大机构进入面
        - 确认 ftUSD 储备政策容纳 BUIDL / USYC 级代币化 T-bill
      - - 美国财政部 DeFi 风险评估 / FATF 虚拟资产指引
        - 约束
        - 持续
        - AML/CFT 与制裁要求直接威胁无许可产品设计
        - 索取 AML 方案设计、旅行规则合规路径，以及任何 OFAC 筛查证据
      - - SEC 对 DeFi 发行方、质押和未注册交易所的活跃执法
        - 约束
        - 持续
        - 面向公众销售的 SAFT 结构在美国暴露证券注册风险
        - 索取 SAFT 公售和美国人士参与的法律意见
      - - 智能合约漏洞利用风险（Chainalysis 称过去 DeFi 黑客事件损失达数十亿美元）
        - 约束
        - 持续
        - 跨保证金组合集中攻击面；一次漏洞利用就可能打穿赎回储备
        - 索取审计报告、形式化验证覆盖范围，以及暂停 / 熔断机制
      - - 现有 AMM 流动性的切换成本
        - 约束
        - 中期
        - Uniswap、Curve、Aave 锁住黏性 LP 资本；Flying Tulip 必须补贴冷启动
        - 确认零费率窗口预算，以及补贴到期后的 LP 留存计划
      - - 分析师市场规模差异（Mordor 2025 基准 vs. Grand View 2025 基准）
        - 约束
        - 持续
        - 选错基准会扭曲估值倍数
        - 估值锚定链上可观测收入，不锚定分析师标题数字
    notes: |
      驱动因素和约束都标注时点，便于把现金收益、产品上线节奏与 Flying Tulip 的估值风险串起来。分析师口径差异作为约束保留，不在这里消解。
