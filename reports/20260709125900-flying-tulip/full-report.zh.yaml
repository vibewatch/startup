      - number: '3.2'
        title: 能力、定价与 GTM 对比
        blocks:
          - type: paragraph
            body: >
              Flying Tulip 的产品路线图覆盖的能力面比任何单一既有玩家都宽，但拆到任一单轴，既有玩家都领先。Uniswap v4 hooks、集中流动性和长期形成的 LP 经济，构成了现货 DEX
              能力领先；Flying Tulip 的自适应曲线 AMM 还没有在生产环境证明自己。永续合约上，Hyperliquid 的 HyperCore 吞吐（其文档称每秒 200k 笔订单）和自有 layer-1
              给它带来撮合引擎与 MEV 抵抗优势，Flying Tulip 必须靠跨链部署复制这一点。借贷上，Aave 的动态利率曲线和多抵押品跨链部署已广泛审计；Morpho Blue
              引入无需许可的隔离市场设计（可在其已发布 Solidity 合约中看到），Flying Tulip 自己的动态 LTV 借贷模块也在呼应这一路线。DeFi 定价通常趋向零显性用户费用（交易者和 LP
              通过买卖价差、资金费率和 swap 价差付费）；Flying Tulip 初期 Sonic 零手续费窗口直接借鉴了 Hyperliquid 早期促销结构和 dYdX 返利安排。GTM 差异很大：Uniswap 和
              Aave 依赖有机开发者集成；Hyperliquid 从自有 L1 上跑积分与空投飞轮；dYdX 分发治理代币并给质押奖励。Flying Tulip 的 GTM 差异点是 Cronje 的声誉资本，加上
              perpetual-put 赎回权——一种其他竞争者没有采用的融资原语。信任和监管姿态是 Flying Tulip 最落后的地方：Aave、Uniswap Labs 和 Coinbase
              都有具名领导层、公开审计和成熟法律合规层；Flying Tulip 的领导层档案很薄（第 1 章），其合规栈也只是通过 Coinspeaker 新闻稿里的 OFAC / 税务申报措辞被间接提及。
