      - 目标细分市场
      - 差异化
      - 局限
    rows:
      - - Uniswap Labs
        - 直接 — 现货 DEX（AMM）
        - >-
          Uniswap Labs 到 2022 年融资约 US$165M（Andreessen Horowitz、Paradigm、Union Square Ventures、ParaFi）； DeFiLlama
          页面将其列为品类领先协议
        - EVM 链上的散户和机构现货兑换用户
        - v4 hooks、集中流动性、最大的 LP 资本底盘
        - 永续 / 借贷 / 稳定币覆盖依赖外部（Uniswap 仍以现货为先）
      - - PancakeSwap
        - 直接 — 现货 DEX（AMM）
        - 多链 DEX，在 BNB Chain 上日交易量高
        - BNB Chain 散户交易者和收益农场用户
        - 零费率促销、深厚的 BNB 原生 LP 资本
        - Ethereum 主网资本较弱
      - - Curve Finance
        - 直接 — 稳定币 AMM
        - 数十亿美元 TVL；受 ve(3,3) 启发的治理
        - 稳定币兑换用户和 LSD 流动性提供者
        - 同类最佳低滑点稳定币 AMM
        - 不是完整交易超级应用
      - - Hyperliquid
        - 直接 — 永续 DEX（自有 L1）
        - 专用 L1；HyperBFT 共识；自有代币空投；2024–2026 年势头强
        - 散户和自营永续交易者
        - 文档称 HyperCore 撮合引擎达每秒 200k 订单，L1 体验统一
        - 自定义 L1 抬高跨链交易者的可迁移风险
      - - dYdX
        - 直接 — 永续 DEX（Cosmos 链）
        - v4 起使用自有 Cosmos 链；官网称累计交易量 US$1.5T；未平仓量 US$200M；220+ 个市场；MegaVault TVL US$12M
        - 专业永续交易者和量化交易台
        - CLOB、激励计划和 API 深度
        - Cosmos 链不在 EVM 可组合性内
      - - GMX
        - 直接 — 永续 + 现货 DEX
        - DeFiLlama 列出 Arbitrum、Avalanche、Solana 上 80+ 个集成；隔离池与多资产池；平均池 APY 8.05%
        - 散户和 DAO 永续交易者
        - 无许可 LP 模型和多链覆盖
        - 基于模型的定价（由预言机驱动）可能把亏损集中到 GLP 式 LP 身上
      - - Vertex Protocol
        - 直接 — 混合 CLOB / AMM 永续
        - Series A 量级融资；多链部署
