      - number: '5.4'
        title: 差异化、信任与安全控制
        blocks:
          - type: paragraph
            body: >
              Flying Tulip 的技术差异化主张包括：（i）覆盖现货、永续、借贷、稳定币和保险的统一跨保证金风险引擎；（ii）由隔离赎回储备支持的链上「perpetual put」；（iii）Witnessnet
              TLS 证明型 HTTPS 预言机框架；（iv）固定 10B FT 供应加回购销毁通缩机制；（v）二元预测市场的链上裁决机制。每一项在架构上都新，但如第 3 章所示，Hyperliquid、dYdX 和
              Vertex 也在追求跨保证金思路；perpetual put 是一种融资原语，Lemniscap 称其为可能被复制的实验；Witnessnet 的 TLS 证明路径是新模式，但没有 IP 保护（可类比
              Chainlink Functions 和 TLSNotary）。信任与安全姿态包括：经审计智能合约、带队列和速率限制的赎回、预测市场无需许可裁决，以及 Coinspeaker 新闻稿提及的 OFAC
              筛查和税务申报。不利比较点是：Aave、Uniswap 和 Ethena 都发布大量审计报告（Aave 文档列出多轮审计；Uniswap 的 GitHub 组织展示带独立审计的 v4 core；Ethena
              文档描述储备证明）；截至报告日期，Flying Tulip 自己的审计报告没有从 docs.flyingtulip.com 公开链接，Sherlock、Code4rena 或 OpenZeppelin
              在已审阅来源中也没有公开列出 Flying Tulip 审计。这是产品技术材料里最大的单一安全与质量缺口。
