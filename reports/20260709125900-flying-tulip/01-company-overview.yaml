  - id: leadership-team-and-key-person-dependence
    title: Leadership, Team, and Key-Person Dependence
    body: |
      The public leadership file is unusually thin and concentrates dependence on one individual. Every
      reviewed source identifies André Cronje as founder and public face; The Block, Blockhead, BSC News,
      Coinspeaker, and Ventureburn all quote him extensively on strategy, tokenomics, competitive framing,
      and launch timing. Cronje is also described as the developer behind Yearn Finance (2020), a
      co-architect of the Fantom Foundation and its Sonic rebrand, and the author of the original 2020
      Deriswap concept that Flying Tulip resurrects. Beyond Cronje the record is essentially silent:
      Cronje told The Block that Flying Tulip currently employs "about 15 people across the U.S., Europe,
      and Asia" and is actively hiring, but no cofounder, CTO, general counsel, head of engineering, or
      board member is publicly named in the reviewed source set. Lemniscap, one of the participating VCs,
      publicly acknowledged in its own blog that Flying Tulip's fundraising primitive depends on "a key
      person or team with the reputation, influence, and trust to attract" large capital, which is a
      direct concession that the underlying diligence risk here is Cronje-specific. That key-person
      concentration is a material governance signal because Cronje publicly quit DeFi in March 2022 before
      returning, and because his past projects (Yearn, Solidly/Fantom) have periodically generated
      controversy around token economics, security incidents, and personal conduct that later cascaded
      into the protocols he was associated with.
