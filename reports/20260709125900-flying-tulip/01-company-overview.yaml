  evidenceGaps:
    - type: missing-source
      severity: material
      topic: leadership-disclosure-TO002
      missingEvidence: A public roster of cofounders, senior executives, and any board or foundation directors beyond André Cronje.
      whyItMatters: The reviewed public sources name exactly one principal, which is an unusually thin org file for a protocol raising $200M with a public retail sale ahead.
      diligencePath: Request the operating entity's founding documents, senior-hire announcements, and the foundation's board composition and charter.
      relatedQuestionRefs:
        - QO005
      relatedTableRefs:
        - TO002
        - TO003
    - type: private-evidence-only
      severity: material
      topic: legal-entity
      missingEvidence: Identity of the Flying Tulip operating entity, its jurisdiction of incorporation, and the foundation issuing the FT token.
      whyItMatters: Perpetual-put SAFTs sold to global retail buyers create securities-law and consumer-protection exposure that cannot be assessed without the issuer's legal identity.
      diligencePath: Request formation documents, foundation charter, and legal opinion on the SAFT and public-sale structure.
      relatedQuestionRefs:
        - QO002
      relatedTableRefs:
        - TO001
    - type: conflicting-data
      severity: minor
      topic: post-saft-tranches
      missingEvidence: Independent confirmation of the alleged $25.5M Series-A extension from Amber Group, Fasanara Digital, and Paper Ventures and the $50M Impossible Finance tranche.
      whyItMatters: These tranches are cited only in a single secondary source (MEXC blog) and materially change the disclosed total capital.
      diligencePath: Request term sheets or press releases from the alleged participants and reconcile against the public-sale settlement report.
      relatedQuestionRefs:
        - QO021
    - type: private-evidence-only
      severity: material
      topic: sonic-related-party
      missingEvidence: The commercial terms of any subsidy or partnership between Flying Tulip and Sonic Labs, and disclosure of Cronje's economic exposure to both entities.
      whyItMatters: Cronje is a co-architect of Sonic and Sonic subsidises Flying Tulip's zero-fee trading; related-party economics are material to underwriting.
      diligencePath: Request the Sonic subsidy contract, any Flying Tulip governance or advisory role Sonic holds, and Cronje's Sonic token exposure disclosure.
      relatedQuestionRefs:
        - QO023
    - type: missing-source
      severity: minor
      topic: investor-portfolio-disclosure
      missingEvidence: Explicit portfolio-page confirmation from CoinFund and other named investors that Flying Tulip is a live portfolio company.
      whyItMatters: Investor portfolios often lag press announcements; public confirmation would corroborate press-cited commitments.
      diligencePath: Ask CoinFund and other participants to publish Flying Tulip on their portfolio pages.
      relatedQuestionRefs:
        - QO027
