company:
  name: Flying Tulip
chapter:
  number: 1
  title: Company Overview
  summary: |
    Flying Tulip is a pre-launch DeFi protocol founded in 2025 by André Cronje, the creator of Yearn Finance
    and a co-architect of the Fantom/Sonic ecosystem, that closed a $200 million private SAFT round at a
    $1 billion fully diluted token valuation on 29 September 2025 with an unusually broad crypto-native
    investor syndicate (Brevan Howard Digital, CoinFund, Susquehanna Crypto, DWF Labs, FalconX, Hypersphere,
    Lemniscap, Nascent, Republic Digital, Selini, Sigil Fund, Tioga Capital, and Virtuals Protocol). The
    protocol is pitched as a full-stack on-chain exchange combining spot, perpetuals, lending, a native
    yield-bearing stablecoin (ftUSD), options, and on-chain insurance in one cross-margin system, with a
    perpetual-put "on-chain redemption right" that lets FT holders burn tokens to reclaim their original
    principal. The token generation event took place on 23 February 2026 on Sonic, but core enterprise
    disclosures beyond Cronje and a self-reported ~15-person team remain private-company thin.
sections:
  - id: identity-founding-and-product-scope
    title: Identity, Founding, and Product Scope
    body: |
      Flying Tulip should be understood as the latest attempt by André Cronje to collapse multiple DeFi
      primitives into a single cross-margin platform, not as a specialist DEX. Multiple independent outlets
      describe the project as a DeFi technology company led by Cronje, headquartered narrative in New York,
      that operates a full-stack on-chain exchange integrating a native stablecoin (ftUSD), spot trading,
      perpetuals and options, lending and money markets, and on-chain insurance under one cross-margin
      system. The protocol builds on Deriswap, a 2020 Cronje concept that first proposed merging multiple
      DeFi functions into one platform, but reframes the design around what Cronje calls a "ground-up
      rebuild of lending, trading, AMM, CLOB, derivatives, insurance, and stablecoins." Multiple sources
      confirm that first-phase deployment happened on Sonic Labs with initial zero-fee trading subsidised
      by fee monetization, and that Ethereum, Base, Avalanche, BNB Chain, and Solana were named as
      launch-supported networks. The official flyingtulip.com site itself carries almost no marketing prose
      as of the run date; documentation lives on docs.flyingtulip.com, which markets Flying Tulip as an
      educational DeFi hub. Independent trackers and the official press release reproduce the same product
      taxonomy, so the identity and product scope claims are cross-corroborated even though founder-level
      disclosure remains lean.
