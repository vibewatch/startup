callouts:
  - calloutType: strength
    title: A one-of-one fundraising primitive backed by a broad, credible crypto-native syndicate
    body: |
      Flying Tulip closed US$200M at a US$1B FDV in six weeks with 13 named investors spanning macro (Brevan Howard Digital),
      TradFi prop (Susquehanna Crypto), crypto-native venture (CoinFund, Hypersphere, Lemniscap, Nascent, Republic Digital, Tioga,
      Sigil), and market makers (DWF Labs, Selini, FalconX). The on-chain perpetual-put mechanism, which lets holders redeem
      principal at any time, is a genuinely novel primitive designed to address the founder-token misalignment Cronje personally
      experienced at Yearn and Sonic.
    claimRefs:
      - CO016
      - CO017
      - CO018
      - CO019
      - CO020
      - CO022
  - calloutType: risk
    title: Leadership disclosure is thin and Cronje-dependent
    body: |
      Every reviewed source identifies exactly one named principal — André Cronje. No cofounder, CTO, head of legal, or board
      member is publicly named. The team is self-reported at ~15 people across three continents with no external verification.
      For a protocol pitching institutional-grade market structure, absence of a disclosed org chart is a first-order governance
      gap and creates real key-person risk given Cronje's history of high-profile exits and returns.
    claimRefs:
      - CO007
      - CO013
      - CO014
      - CO015
  - calloutType: risk
    title: FDV is set by the redemption floor, not by product traction
    body: |
      At TGE the FT token traded at US$0.10, dipped to ~US$0.08, and stabilised at the put-implied floor of US$0.10, giving a
      ~US$1B FDV that mechanically mirrors the deployable reserve pool rather than any product metric. Prediction markets ahead
      of TGE gave Flying Tulip only about a 50-50 chance of holding above a US$400M FDV, and TVL at TGE was reported at only
      about US$126M — well below the FDV. Valuation should be underwritten as an option on Cronje plus the reserve's yield
      compounding, not as a revenue multiple.
