  - id: deployment-integration-and-roadmap
    title: Deployment, Integrations, Reliability, and Roadmap
    body: |
      Flying Tulip's deployment sequence is Sonic-first-then-multi-chain, publicly summarised by Cronje as "hardened on
      Sonic, where fee monetisation and subsidies allow Flying Tulip to offer zero-fee trading, before the full suite is
      deployed to other chains" (The Block, Blockhead). The first shipped product is ftUSD, launched on Sonic on 23
      January 2026 with a 1M ftUSD initial cap, backed by USDC (per Stablecoin Insider). The FT token became transferable
      at TGE on 23 February 2026 (MEXC). Cronje described further roadmap ambition to add advanced yield strategies and
      cover more chains as ftUSD supply grows. Integrations at run date include Aave, Ethena, Spark, and Sonic; the glossary
      lists jupSOL, wAVAX, cbBTC, USDe, USDtb, USDS, and multiple wrapped BTC/ETH variants as accepted assets. Reliability
      and observability depend on Sonic's HyperCore-style throughput (Sonic docs), the audits of the reserve smart contract
      (audit reports not publicly disclosed as of run date), and the reliability of external yield venues, which are all
      well-audited but each carry their own smart-contract risk. Support surfaces are the docs site, the docs glossary,
      social channels, and community-support channels. Cronje explicitly described launch timing to The Block as "sooner
      than people think, later than people hope". Aave's docs and Uniswap's docs provide the mature-DeFi baseline for
      what production-grade reliability, audit disclosure, and integration polish look like; Flying Tulip's own docs are
      recent and thinner but rapidly filling in.
    claimRefs:
      - CE017
      - CE018
      - CE019
      - CE020
      - CE021
      - CE022
      - CE023
