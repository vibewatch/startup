        - Adaptive curve tuned to volatility rather than constant-product only
        - No independent live benchmarks vs. Uniswap v4
      - - Cross-margin perpetual futures (CLOB)
        - Retail and prop-market perp traders
        - Under development; expected during Sonic launch window
        - Cross-margin unifies collateral against spot and lending
        - Order-book depth and matching-engine performance not publicly benchmarked
      - - Dynamic-LTV money market
        - Borrowers and lenders
        - Under development
        - Utilisation-driven rate curve with cross-margin against trading positions
        - Rate curve parameters undisclosed
      - - ftUSD / sftUSD yield stablecoin
        - Retail savers and DAO treasuries
        - Live on Sonic since 23 Jan 2026; 1M ftUSD cap at launch
        - Delta-neutral yield without third-party attestation; ~6% APY at launch
        - Reserve composition and hedge cost not fully disclosed
      - - On-chain insurance
        - Users hedging protocol risk
        - Included in product taxonomy per official press release; not yet live
        - Bundled coverage within the super-app
        - Underwriting capacity and reinsurance policy not disclosed
      - - Binary prediction markets
        - Retail traders resolving Yes/No events
        - Referenced in the glossary; not yet publicly live
        - Permissionless resolution via Witnessnet TLS proofs
