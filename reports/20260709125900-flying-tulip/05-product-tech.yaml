artifact: product-tech
slug: flying-tulip
runDate: '2026-07-09'
company:
  name: Flying Tulip
chapter:
  number: 5
  title: Product and Technology
  summary: |
    Flying Tulip is architected as an on-chain "super-app" whose five primary product surfaces — an adaptive-curve spot
    AMM, cross-margin perpetual futures with a CLOB, a dynamic-LTV money market, the ftUSD/sftUSD delta-neutral yield
    stablecoin, and an on-chain insurance module — all settle inside a single cross-margin risk engine and are backed
    by a shared reserve of contributed capital. Its official documentation (docs.flyingtulip.com) exposes a distinctive
    glossary of building blocks including "Witnessnet" TLS-proof HTTPS oracles, "Backing Capital Yield", "Capital
    Allocation (PCA)", binary prediction markets, and a Perpetual PUT redemption right. The protocol launched first
    on Sonic Labs with initial zero-fee trading subsidised by Sonic and integrations with Aave, Ethena, and Spark for
    reserve-yield deployment. Multi-chain support at launch spans Ethereum, Base, Avalanche, BNB Chain, Sonic, and
    Solana (per The Block and MEXC). Product maturity is highest on ftUSD (live since 23 January 2026) and on the FT
    token (transferable since 23 February 2026); the trading modules were still ramping at run date, and public
    third-party audit reports for the redemption reserve, cross-margin risk engine, and Witnessnet TLS proofs are not
    yet publicly disclosed.
sections:
  - id: product-suite-and-workflow
    title: Product Suite and Customer Workflow
    body: |
      Flying Tulip is intentionally structured as a single-wallet destination for the five most-used DeFi jobs. A retail
      trader connects a wallet, deposits accepted assets (USDC, USDT, USDS, USDe, USDtb, WETH, WBTC, cbBTC, SOL/jupSOL,
      AVAX/wAVAX per the glossary), and then executes: spot swaps on an adaptive-curve AMM; long or short perpetual
      positions on a CLOB with cross-margin against the wallet; borrows or supplies on a dynamic-LTV money market;
      mints ftUSD (or stakes sftUSD for ~6% APY on Sonic) as a delta-neutral yield stablecoin; opens on-chain insurance
      cover against smart-contract risk; and (per the glossary) participates in binary prediction markets resolved via
      Witnessnet TLS proofs. The cross-margin engine lets collateral in any accepted asset back positions in any product,
      which is Cronje's most-cited unified capital-efficiency claim (The Block, Blockhead). The user surface as of the
      run date is docs.flyingtulip.com plus the on-chain contracts; there is no traditional web-app comparison to
      Coinbase or Binance because balances and orders settle on-chain. The workflow difference vs. incumbents is that
      the same collateral does not need to be moved between separate Uniswap, Aave, dYdX, and Ethena venues.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
      - CE006
      - CE007
    tableRefs:
      - TE001
      - TE002
    figureRefs:
      - FE002
  - id: architecture-and-operating-model
    title: Architecture, Reserve Deployment, and Sonic Integration
    body: |
      The Flying Tulip stack has five layers. Layer 1 is the redemption reserve: contributed principal from the SAFT and
      public sale is held in on-chain reserve contracts and deployed to external low-risk venues (the glossary explicitly
      names Aave v3 for conservative yield; The Block adds Ethena and Spark). Layer 2 is the cross-margin risk engine
      that unifies collateral across products. Layer 3 is the product suite (adaptive-curve AMM, CLOB perpetuals, dynamic
      -LTV money market, ftUSD/sftUSD, insurance, prediction markets). Layer 4 is Witnessnet — a smart-contract-verifiable
      TLS proof framework the glossary describes as letting contracts consume "AEAD-authenticated TLS records" and a
      valid server certificate as evidence, so any HTTPS endpoint becomes an "implicit oracle". Layer 5 is chain
      deployment: the Sonic launch chain (co-architected by Cronje) provides zero-fee subsidies, throughput, and initial
      capital efficiency, with Ethereum, Base, Avalanche, BNB Chain, and Solana as later deployment targets per The Block
      and Ventureburn. The redemption reserve is queue-and-rate-limited to protect solvency: if reserves are temporarily
      insufficient, requests enter a transparent queue and are processed as capital replenishes. Team compensation flows
      through the buyback-and-burn contract funded by backing-capital yield surplus and protocol revenue, per the
      glossary. The FT total supply is fixed at 10 billion pre-mint, with supply moving between circulating and
      non-circulating buckets rather than being newly minted.
    claimRefs:
      - CE008
      - CE009
      - CE010
      - CE011
