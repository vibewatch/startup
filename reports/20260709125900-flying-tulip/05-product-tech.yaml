  evidenceGaps:
    - type: missing-source
      severity: material
      topic: audit-disclosure-TE005
      missingEvidence: Public independent audit reports for Flying Tulip's redemption reserve, cross-margin engine, ftUSD, spot AMM, and Witnessnet contracts.
      whyItMatters: Aave, Uniswap, and Ethena publicly link multiple audit reports; the absence of comparable disclosure for a US$1B FDV protocol is the single largest security-and-quality gap.
      diligencePath: Request Sherlock, OpenZeppelin, and Trail of Bits reports plus formal-verification coverage per module and confirm listings on Sherlock and Code4rena.
      relatedQuestionRefs:
        - QE016
      relatedTableRefs:
        - TE005
    - type: missing-source
      severity: material
      topic: bug-bounty
      missingEvidence: A publicly disclosed bug bounty program on Immunefi or Sherlock for Flying Tulip.
      whyItMatters: Bug bounty programs are the standard exploit-cost signalling mechanism in DeFi; absence indicates immature security posture at a US$1B FDV.
      diligencePath: Request the Immunefi/Sherlock bug bounty listing or equivalent program.
      relatedQuestionRefs:
        - QE017
    - type: private-evidence-only
      severity: material
      topic: rate-limit-parameters
      missingEvidence: Numeric queue and rate-limit parameters that govern redemption reserve solvency protection.
      whyItMatters: Redemption behaviour under stress cannot be modelled without the concrete parameters.
      diligencePath: Request rate-limit parameters, queue timing, and any circuit-breaker thresholds.
      relatedQuestionRefs:
        - QE014
    - type: private-evidence-only
      severity: material
      topic: bridge-security-multi-chain
      missingEvidence: Which cross-chain bridges Flying Tulip will use for Ethereum/Base/Avalanche/BNB/Solana rollout and their audit history.
      whyItMatters: DeFi's largest historical loss category is bridge exploits.
      diligencePath: Request bridge vendor list, audit reports, and any circuit-breaker mechanisms.
      relatedQuestionRefs:
        - QE025
    - type: private-evidence-only
      severity: material
      topic: witnessnet-benchmark
      missingEvidence: Live benchmarks and gas-cost data for Witnessnet TLS-proof verification on-chain.
      whyItMatters: Witnessnet is a materially novel primitive; its economics and reliability under real network conditions are not yet public.
      diligencePath: Request benchmark data for Witnessnet proof gas cost, latency, and dispute economics.
