  - id: TE003
    title: Technology / Operating Architecture Table
    columns:
      - Layer / component
      - Role
      - Dependency
      - Risk
    rows:
      - - Redemption reserve contracts
        - Hold backing capital; process Perpetual PUT redemptions
        - Ethereum + multi-chain smart contract, queue and rate limits
        - Solvency risk in redemption run; audit reports not public
      - - Backing-capital deployment adapter
        - Route reserve principal to Aave, Ethena, Spark
        - External protocol integrations; on-chain adapters
        - Yield-source concentration and third-party smart-contract exposure
      - - Cross-margin risk engine
        - Unify collateral across spot, perpetuals, lending, insurance
        - Oracle price feeds, funding-rate infrastructure, liquidation bots
        - Cascading liquidations under stress; oracle manipulation
      - - Adaptive-curve AMM
        - Spot swap execution with volatility-aware curve
        - LP capital, oracle price, on-chain liquidity
        - Impermanent loss dynamics may differ from constant-product
      - - CLOB perpetuals
        - Order-book matching for perpetual futures
        - Matching engine, market-maker liquidity, funding-rate oracle
        - Throughput and CEX-competitive latency undisclosed
      - - Dynamic-LTV money market
        - Utilisation-driven interest-rate curve
        - Oracle price feeds, liquidation infrastructure
        - Adverse selection if LTV parameters mis-tuned
      - - ftUSD / sftUSD contracts
        - Delta-neutral stablecoin issuance and staking
        - USDC reserve, delta-neutral hedge strategies, Aave/Ethena adapters
        - Basis compression in bear markets; USDC peg risk
      - - Witnessnet TLS oracle
        - Verify HTTPS responses on-chain via AEAD-authenticated records
        - TLS certificate chains and off-chain proof submitters
        - Proof gas cost, certificate revocation handling
      - - Prediction market contracts
        - Resolve binary Yes/No markets via Witnessnet proofs
        - Witnessnet, accepted-source list, resolver economics
        - Resolver disagreement or ambiguity
      - - Insurance module contracts
        - Underwrite smart-contract failure cover for users
        - Underwriting capital pool, claims-resolution mechanism
        - Claim capacity and adverse selection
      - - Sonic Labs runtime + subsidy
        - Provide throughput and zero-fee subsidy at launch
        - Sonic Labs governance and fee monetisation policy
        - Related-party dynamics (Cronje's Sonic role); subsidy expiry
      - - Multi-chain deployment adapters
        - Enable Ethereum / Base / Avalanche / BNB Chain / Solana
        - Bridges, IBC-style messaging, Solana Wormhole
        - Bridge exploits (historical DeFi loss concentration)
    notes: |
      Each component preserves a dependency-risk pairing so the architecture cannot be read without seeing the failure
      mode alongside the design.
