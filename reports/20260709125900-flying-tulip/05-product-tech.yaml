  - id: TE002
    title: Workflow / Use-Case Table
    columns:
      - User job
      - Current DeFi workflow
      - Flying Tulip solution
      - Measurable benefit
      - Limitation
    rows:
      - - Swap between crypto assets
        - Uniswap or Curve on separate front-end; pay swap fee
        - Adaptive-curve AMM inside the super-app with cross-margin collateral
        - Zero explicit fee during Sonic launch
        - Post-subsidy fee schedule undisclosed
      - - Trade perpetuals with leverage
        - Hyperliquid or dYdX; separate collateral deposit
        - CLOB perps that share margin with spot and lending
        - Unified collateral reduces capital requirement
        - CLOB depth and matching-engine performance unproven at run date
      - - Borrow crypto against collateral
        - Aave or Compound; separate collateral pool
        - Dynamic-LTV money market backed by the same wallet
        - Faster switching between LTV levels and trading positions
        - Rate curve and liquidation cascade behaviour not stress-tested publicly
      - - Earn yield on stablecoin savings
        - USDe on Ethena; sDAI on Sky/Spark
        - Mint ftUSD then stake to sftUSD for ~6% APY
        - Yield without third-party attestation
        - Initial supply cap of 1M ftUSD on Sonic
      - - Hedge smart-contract failure risk
        - Nexus Mutual cover on a separate protocol
        - Bundled insurance module inside Flying Tulip
        - Single-venue underwriting
        - Underwriting capacity not disclosed
      - - Resolve verifiable off-chain facts
        - Chainlink price feeds or manual oracles
        - Witnessnet TLS proofs settled on-chain
        - Permissionless third-party proof submission
        - Latency and cost per verification not published
      - - Contribute capital to primary sale
        - Traditional token pre-sale platforms
        - PCA fixed rate 10 FT per US$1 in accepted assets
        - Perpetual PUT protects downside
        - Redemption reserve is capped and could enter a queue
      - - Sell FT on secondary market
        - Any DEX or CEX listing FT
        - Sell forfeits Perpetual PUT; proceeds flow to buyback-and-burn
        - Deflationary tokenomics for holders
        - Selling reduces retail's implicit floor protection
    notes: |
      Each workflow row pairs the incumbent option, the Flying Tulip alternative, and preserves the diligence limitation
      column rather than smoothing it away.
