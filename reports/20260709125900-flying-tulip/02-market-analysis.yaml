  evidenceGaps:
    - type: conflicting-data
      severity: material
      topic: analyst-sizing-dispersion-TM002
      missingEvidence: A reconciled methodology showing how Mordor's US$188.67B 2025 base and Grand View's US$26.94B 2025 base can differ by 7x.
      whyItMatters: Underwriting Flying Tulip's TAM depends on a defensible denominator; the analyst dispersion means either can be used to argue any narrative.
      diligencePath: Request each publisher's segment definition, revenue-versus-TVL rulebook, and geographic scope; anchor internal models to on-chain observable revenue.
      relatedQuestionRefs:
        - QM024
        - QM004
        - QM005
      relatedTableRefs:
        - TM002
    - type: missing-source
      severity: material
      topic: super-app-tam
      missingEvidence: A direct analyst estimate of the addressable spend for a unified DeFi super-app that bundles spot, perp, lending, stablecoin, and insurance.
      whyItMatters: Flying Tulip's most differentiated positioning has no cleanly measurable market denominator today.
      diligencePath: Request on-chain-derived internal TAM based on segment-level fee pools and stablecoin float share.
      relatedQuestionRefs:
        - QM023
    - type: conflicting-data
      severity: minor
      topic: cex-dex-ratio
      missingEvidence: A reliable current CEX-to-DEX volume ratio that pins substitute pressure to a single denominator.
      whyItMatters: Substitution risk on the retail-trader side depends on how tight the CEX-DEX ratio is trending.
      diligencePath: Pull CoinGecko and Chainalysis quarterly CEX/DEX ratio series and cross-check against DeFiLlama's DEX-volume dashboard.
      relatedQuestionRefs:
        - QM026
    - type: private-evidence-only
      severity: minor
      topic: sftusd-vs-usde
      missingEvidence: Head-to-head yield sourcing and reserve-composition data comparing sftUSD to Ethena's USDe and sDAI.
      whyItMatters: Ethena's incumbent lead in yield-bearing stablecoins directly compresses ftUSD's share capture.
      diligencePath: Pull Ethena's USDe reserve reports, sDAI backing, and sftUSD reserve-attestation cadence.
      relatedQuestionRefs:
        - QM027
    - type: conflicting-data
      severity: minor
      topic: mexc-soft-commitment
      missingEvidence: An independent second source confirming MEXC's US$1.3B public-sale soft-commitment figure.
      whyItMatters: If Flying Tulip's public-sale demand is inflated, MEXC's headline overstates market pull.
      diligencePath: Request the public-sale settlement report and any auditor's reconciliation.
