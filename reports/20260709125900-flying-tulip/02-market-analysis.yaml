  - id: TM004
    title: Growth Drivers and Constraints Table
    columns:
      - Driver or constraint
      - Direction
      - Timing
      - Implication for Flying Tulip
      - Diligence ask
    rows:
      - - MiCA framework in EU + U.S. spot Bitcoin ETF approvals
        - Driver
        - Short term (<= 2 years)
        - Pulls institutional capital into compliant on-chain channels; Mordor attributes about +7.2% of DeFi CAGR
        - Confirm Flying Tulip's compliance stack (OFAC screening, tax reporting per Coinspeaker press release) supports MiCA and MiFID counterparties
      - - Rising DeFi TVL across core verticals
        - Driver
        - Medium term (2-4 years)
        - Historically correlated with higher swap and lending fee pools
        - Track quarterly TVL versus DeFi aggregate to verify share gains vs. incumbents
      - - Layer-2 and Sonic fee compression
        - Driver
        - Short term
        - Reduces switching cost from CEX and expands viable use-cases; Flying Tulip's zero-fee Sonic launch depends on it
        - Confirm Sonic subsidy contract survives fee-rebate governance decisions
      - - Perpetual DEX growth (about 346% YoY 2025)
        - Driver
        - Short term
        - Fastest-growing sub-segment; Flying Tulip's cross-margin perp module targets it directly
        - Track Flying Tulip's perp market share vs. Hyperliquid post launch
      - - RWA TVL growth (about US$26B on-chain)
        - Driver
        - Medium term
        - Potential collateral for ftUSD and lending; enlarges institutional entry surface
        - Confirm ftUSD reserve policy accommodates BUIDL/USYC-class tokenised T-bills
      - - U.S. Treasury DeFi Risk Assessment / FATF virtual-asset guidance
        - Constraint
        - Ongoing
        - AML/CFT and sanctions expectations directly threaten permissionless product design
        - Request AML program design, travel-rule compliance path, and any OFAC screening evidence
      - - Active SEC enforcement against DeFi issuers, staking, and unregistered exchanges
        - Constraint
        - Ongoing
        - Public-sale SAFT structure exposed to securities-registration risk in the U.S.
        - Request legal opinion on SAFT public sale and U.S. persons participation
      - - Smart-contract exploit risk (billions in past DeFi hacks per Chainalysis)
        - Constraint
        - Ongoing
        - Cross-margin bundle concentrates attack surface; one exploit could break the redemption reserve
        - Request audit reports, formal-verification coverage, and pause/circuit-breaker mechanisms
      - - Switching cost from incumbent AMM liquidity
        - Constraint
        - Medium term
        - Uniswap, Curve, Aave hold sticky LP capital; Flying Tulip must subsidise bootstrap
        - Confirm zero-fee window budget and LP retention plan after subsidies expire
      - - Analyst market-size dispersion (Mordor 2025 base vs. Grand View 2025 base)
        - Constraint
        - Ongoing
        - Distorts valuation multiples if the wrong benchmark is chosen
        - Anchor valuation to on-chain observable revenue, not analyst headlines
    notes: |
      Drivers and constraints are tagged with timing so cash-yield and product-launch sequencing can be traced to Flying Tulip's
      valuation risk. Analyst-dispersion is preserved as a constraint rather than resolved.
