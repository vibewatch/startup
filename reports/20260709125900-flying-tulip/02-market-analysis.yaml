callouts:
  - calloutType: strength
    title: A fast-growing perp DEX pool anchors Flying Tulip's most differentiated product
    body: |
      Perpetual DEX volume grew about 346% year-over-year to US$6.7 trillion in 2025 and monthly perpetual DEX volume now ranges
      US$10-50 billion. Flying Tulip's cross-margin perp module targets exactly this pool, and it enters against a still-immature
      set of specialist competitors (Hyperliquid, dYdX). Coupled with Sonic's fee-subsidy runway, this is the market slice where
      Flying Tulip's super-app claim has the most numerical support.
    claimRefs:
      - CM014
      - CM015
      - CM027
  - calloutType: risk
    title: Analyst sizing dispersion means the "TAM" number you pick can be off by 7x
    body: |
      Mordor puts the 2025 DeFi market at US$188.67 billion; Grand View Research puts it at US$26.94 billion. Both are widely
      cited. The right anchor for underwriting Flying Tulip is on-chain observed protocol fees (US$24.9B TTM) and TVL (US$71.8B
      in Jun 2026), not either analyst headline. Any valuation model that uses "DeFi TAM" without a definition should be treated
      as unreliable.
    claimRefs:
      - CM007
      - CM008
      - CM009
      - CM010
  - calloutType: risk
    title: Switching cost from Uniswap, Curve, and Aave is the pacing constraint on TVL capture
    body: |
      Incumbent AMM and lending liquidity is deep and sticky. Uniswap dominates spot DEX volume; Curve dominates stablecoin swaps;
      Aave dominates lending. Flying Tulip's zero-fee Sonic launch is a bootstrap subsidy, but after the subsidy window expires,
      LP capital retention is the pacing constraint. Track LP TVL retention after each fee-schedule change, not headline TVL.
    claimRefs:
      - CM024
      - CM032
