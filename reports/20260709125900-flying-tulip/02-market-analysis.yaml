        - Wallet → dApp → swap or leverage
        - Wallet holder
        - Zero-fee spot trading on Sonic; unified UX across spot/perp/lending
      - - Liquidity providers
        - LP / market maker
        - Same
        - LP earns/forgoes fees
        - Wallet → LP pool → periodic rebalance
        - LP treasury
        - Attractive fee tier + emissions from FT buybacks
      - - Prop and quant market makers
        - Institutional MM (Susquehanna Crypto, Selini, DWF Labs)
        - Trading desks
        - MM books P&L
        - API → CLOB / cross-margin execution
        - Trading desk P&L
        - CLOB depth + cross-margin capital efficiency
      - - DAO treasuries
        - DAO multi-sig or executive
        - DAO members
        - DAO treasury
        - Multi-sig → sftUSD staking → yield
        - DAO governance
        - Auditable on-chain yield without third-party attestation
      - - Institutional asset managers
        - Registered manager (Brevan Howard Digital, Fasanara)
        - Portfolio manager
        - Fund / fund investors
        - Custody → allowlisted contract → position
        - Fund investment committee
        - MiCA compliance path + on-chain reporting
      - - Protocol integrators
        - Other DeFi protocols
        - Integrating protocol's users
        - Integrator (via revenue share)
        - Contract composition
        - Integrating protocol
        - ftUSD as unit-of-account and cross-collateral rail
