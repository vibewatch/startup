tables:
  - id: TM001
    title: Market Definition Table
    columns:
      - Segment / category
      - Included spend
      - Excluded spend
      - Buyer / payer
      - Relevance to Flying Tulip
    rows:
      - - Spot decentralized exchange (AMM + CLOB)
        - Swap fees, LP incentive spend on Uniswap/Curve/PancakeSwap and comparable spot DEXs
        - CEX spot volume (Binance, Coinbase spot), OTC block trades
        - Retail traders and LP counterparties
        - Direct — Flying Tulip's AMM/CLOB hybrid competes head-on
      - - Perpetual / derivatives DEX
        - Perp maker/taker fees, funding rate spreads on Hyperliquid, dYdX, GMX, Vertex, Aevo
        - CEX-cleared perps (Binance Futures, Bybit, OKX), CME crypto futures
        - Retail and prop traders paying implicit funding cost
        - Direct — Flying Tulip's cross-margin perp module targets exactly this pool
      - - On-chain lending and money markets
        - Borrow spreads and interest on Aave, Compound, Morpho, Spark
        - CeFi lending (Nexo, BlockFi legacy), bank-based collateralised loans
        - Borrowers paying rate spread; lenders capturing yield
        - Direct — Flying Tulip's dynamic-LTV money market competes on rate
      - - Yield-bearing stablecoins
        - Yield on USDe, sDAI, USDY, sUSDS and similar
        - Non-yield stablecoins (USDC, USDT float held for payments), traditional MMFs
        - Retail savers and DAO treasuries
        - Direct — sftUSD (~6% APY) sits in this pool
      - - On-chain insurance
        - Premium spend on Nexus Mutual, Sherlock, InsurAce
        - CeFi custody insurance (Coinbase Custody insurance), traditional cyber insurance
        - Protocols and users hedging smart-contract risk
        - Direct — Flying Tulip bundles an insurance module
      - - Real-world assets (RWA) tokenisation
        - Yield spreads on tokenised T-bill funds like BUIDL, USYC, USDY
        - Off-chain money-market funds, traditional custody accounts
        - DAO treasuries and institutional asset managers
        - Adjacent — could become a ftUSD reserve category
      - - Centralised exchange trading
        - Binance, Coinbase, OKX spot + derivatives volume
        - Everything on-chain
        - Retail and institutional traders using off-chain custody
        - Substitute — dominant status-quo Flying Tulip must displace
      - - Traditional prime brokerage and OTC
        - Cash equities-style prime services for crypto (Fidelity Digital Assets, Galaxy Digital)
        - Bank prime brokerage for non-crypto assets
        - Institutional funds
        - Substitute for institutional buyers Flying Tulip must eventually reach
    notes: |
      Boundary intentionally spans four product verticals plus two adjacencies because Flying Tulip's super-app pitch touches
      each. Substitutes are called out explicitly so sizing does not double-count CEX volume as Flying Tulip's TAM.
