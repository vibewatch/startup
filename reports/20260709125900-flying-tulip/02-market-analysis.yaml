company:
  name: Flying Tulip
chapter:
  number: 2
  title: Market Analysis
  summary: |
    Flying Tulip enters a DeFi trading and money-market landscape that is large in absolute dollar terms but structurally
    volatile and boundary-contested. DeFiLlama's June 2026 snapshot places total DeFi TVL at about US$71.77 billion across
    453 chains (down 37.3% year-to-date from US$114.49 billion) with 24-hour DEX volume of about US$7.20 billion, while
    analyst estimates of the "DeFi market" range from US$188-238 billion in 2025-2026 (Mordor) to a widely divergent
    US$26.94 billion 2025 base (Grand View Research), forecasts to US$770 billion by 2031 at ~26.4% CAGR, and to
    US$1.42 trillion by 2033 at ~68% CAGR. Flying Tulip specifically targets the intersection of DEX (spot + perpetuals),
    lending, stablecoins, and on-chain insurance — a "unified super-app" segment where perpetual DEX volume grew about
    346% year-over-year to US$6.7 trillion in 2025. Buyers are heterogeneous (crypto-native traders, LPs, DAOs, institutional
    prop and hedge funds under MiCA/ETF rails); adoption is gated by regulatory posture (SEC, CFTC, FATF), smart-contract
    risk, and switching costs anchored in incumbent AMM liquidity.
sections:
  - id: market-boundary-and-substitutes
    title: Market Boundary and Status-Quo Substitutes
    body: |
      Flying Tulip's product scope forces an unusually wide market boundary. On the trading axis it competes with spot
      DEXs (Uniswap, Curve, PancakeSwap) and perpetual DEXs (Hyperliquid, dYdX, GMX); on the lending axis with Aave,
      Compound, and Morpho; on the stablecoin axis with USDC, USDT, DAI, and yield-bearing peers like Ethena's USDe;
      and on the on-chain insurance axis with Nexus Mutual and Sherlock. It also competes on the aggregation axis with
      centralized exchanges (Coinbase, Binance) that Cronje himself named as holistic competitors in press coverage.
      The right market boundary for underwriting Flying Tulip is therefore not "DeFi" writ large but the intersection of
      (1) on-chain trading, (2) collateralised lending, and (3) yield-bearing dollar liquidity, together roughly captured
      by DeFiLlama's DEX + lending + stablecoin categories. Excluded from the boundary are pure NFT marketplaces, prediction
      markets, and off-chain crypto derivatives cleared through centralized venues. The status-quo substitute is
      centralized-exchange (CEX) trading with off-chain custody, which still dominates settled volume; Chainalysis and
      Reuters data show CEX-to-DEX spot ratios only recently closing to a 5:1 range in 2025-2026. This substitute set is
      the correct denominator when reasoning about Flying Tulip's addressable spend, because most retail and institutional
      trading flows still originate on centralized rails.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM005
      - CM006
    tableRefs:
      - TM001
  - id: tam-sam-and-sizing-lenses
    title: TAM, SAM, and Sizing Lenses
    body: |
      Analyst sizing of DeFi is unusually divergent, so no single number can anchor Flying Tulip's TAM. Mordor Intelligence
      projects the DeFi market at US$238.54 billion in 2026 growing to US$770.56 billion by 2031 at a 26.43% CAGR, with
      lending/borrowing (27.33% share in 2025), savings/yield farming (36.52%), retail users (62.12%), and North America
      (42.78%) as leading sub-slices. Grand View Research puts the 2025 base at only US$26.94 billion and forecasts a
      much steeper 68.2% CAGR to US$1.42 trillion by 2033, driven mainly by protocol-fee monetisation. Because these two
      estimates disagree by nearly an order of magnitude, we anchor Flying Tulip's SAM to on-chain-observable revenue and
      capital rather than analyst market-size guesses: DeFiLlama reports total DeFi protocol fees of US$24.91 billion over
      the last 365 days ending June 2026, aggregate TVL of US$71.77 billion, RWA TVL of US$26.01 billion, and stablecoin
      circulating supply of US$314 billion. Perpetual DEX volume alone reached US$6.7 trillion in 2025 (346% YoY per Thrive)
      and monthly perpetual DEX volume now ranges US$10-50 billion, according to CoinLaw and Thrive. A conservative SAM
      for Flying Tulip's four-product suite (spot DEX + perp DEX + lending + stablecoin) therefore centres on the roughly
      US$25 billion of annual on-chain protocol fees plus stablecoin yield spreads. SOM in year one is bounded by
      documented TVL of about US$126 million at TGE (per MEXC).
