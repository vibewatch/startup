  - id: moat-durability-and-adverse-competitor-evidence
    title: Moat Durability, Switching Cost, and Adverse Competitor Evidence
    body: |
      Flying Tulip's moat claims are (i) unified cross-margin capital efficiency, (ii) Cronje's builder brand, (iii) the
      perpetual-put fundraising primitive, and (iv) an ftUSD-anchored settlement rail. None of these is durable in
      isolation. Cross-margin capital efficiency is technically replicable: any protocol with a shared risk engine can
      unify collateral, and specialist competitors (Hyperliquid, dYdX) already operate cross-margin within their perp
      product; Aave and Morpho are moving toward multi-collateral pools. The perpetual-put primitive can be adopted by
      other issuers — the Blockhead Lemniscap commentary explicitly describes it as an experiment that "could reshape how
      DeFi funding rounds are structured", implying diffusion. Cronje's brand is a real but personal moat and Chapter 1
      already flags key-person risk. Switching cost from Uniswap, Curve, and Aave is high because LP capital is sticky
      and audited; Flying Tulip's Sonic zero-fee bootstrap is a subsidy, not a permanent moat. Distribution power sits
      with the incumbents: Uniswap's front-end has an existing user base, PancakeSwap owns retail flow on BNB Chain, and
      Coinbase/Binance still originate most fiat-onboarded trading volume. Multi-homing is common in DeFi (users trade
      on 3-5 venues simultaneously), which further limits Flying Tulip's ability to lock users in. Adverse competitor
      evidence: Hyperliquid's throughput lead, dYdX's US$1.5T lifetime volume, Aave's US$12.1B TVL, and Uniswap's protocol
      dominance are all publicly documented; Ethena is a first-mover on delta-neutral yield stablecoins. Prediction markets
      pre-TGE (per MEXC) gave Flying Tulip only about a 50-50 chance of holding above a US$400M FDV, an implicit market
      view that specialist incumbents are more likely to hold share.
