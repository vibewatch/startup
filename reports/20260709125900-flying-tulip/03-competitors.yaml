callouts:
  - calloutType: strength
    title: Flying Tulip is the only bundled super-app in DeFi
    body: |
      No reviewed incumbent covers spot + perp + lending + yield stablecoin + insurance under one cross-margin roof. Uniswap
      is spot; Hyperliquid and dYdX are perp; Aave, Compound, Morpho are lending; Ethena is stablecoin; Nexus Mutual is
      insurance. Flying Tulip's cross-margin design, if it ships as documented, is the only plausible one-stop super-app
      today and captures capital efficiency gains that specialist competitors cannot replicate without breaking their own
      product boundary.
    claimRefs:
      - CP001
      - CP014
      - CP015
      - CP021
  - calloutType: risk
    title: Incumbents lead on every single vertical Flying Tulip enters
    body: |
      Uniswap leads spot; Hyperliquid leads perps by throughput; dYdX leads perps by lifetime volume; Aave leads lending;
      Ethena leads yield stablecoins; Nexus Mutual leads insurance. Each incumbent has a multi-billion TVL, mature audits,
      and sticky LP capital. Flying Tulip's US$126M TGE TVL is a fraction of any single incumbent's book.
    claimRefs:
      - CP002
      - CP009
      - CP010
      - CP011
      - CP014
      - CP015
  - calloutType: risk
    title: Cross-margin capital efficiency is the moat — and it is technically copyable
    body: |
      Cronje's own framing acknowledges that specialist competitors "operate at a different capacity". Cross-margin capital
      efficiency is not IP-protected; Aave, Morpho, Hyperliquid, and dYdX are all publicly moving toward multi-collateral
      pools. The perpetual-put is novel but Lemniscap already describes it as an experiment likely to be copied. Neither
      moat is legally defensible.
    claimRefs:
      - CP024
      - CP026
      - CP028
