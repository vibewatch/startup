    rows:
      - - Uniswap Labs
        - Direct — spot DEX (AMM)
        - Uniswap Labs raised about US$165M by 2022 (Andreessen Horowitz, Paradigm, Union Square Ventures, ParaFi); DeFiLlama page lists it as leading protocol category
        - Retail and institutional spot swappers across EVM chains
        - v4 hooks, concentrated liquidity, largest LP capital base
        - Perp/lending/stablecoin coverage is external (Uniswap remains spot-first)
      - - PancakeSwap
        - Direct — spot DEX (AMM)
        - Multi-chain DEX with high daily volume on BNB Chain
        - BNB Chain retail traders and yield farmers
        - Zero fees promotions, deep BNB-native LP capital
        - Weaker on Ethereum mainnet capital
      - - Curve Finance
        - Direct — stablecoin AMM
        - Multi-billion TVL; ve(3,3) inspired governance
        - Stablecoin swappers and LSD liquidity providers
        - Best-in-class low-slippage stablecoin AMM
        - Not a full trading super-app
      - - Hyperliquid
        - Direct — perp DEX (own L1)
        - Purpose-built L1; HyperBFT consensus; own token airdrop; large 2024-2026 momentum
        - Retail and prop-market perp traders
        - HyperCore matching engine at 200k orders/second per its docs, unified L1 experience
        - Custom L1 raises portability risk for cross-chain traders
      - - dYdX
        - Direct — perp DEX (Cosmos chain)
        - Own Cosmos chain since v4; US$1.5T lifetime volume per site; US$200M open interest; 220+ markets; US$12M MegaVault TVL
        - Pro perp traders and quant desks
        - CLOB, incentive programs, and API depth
        - Cosmos chain outside EVM composability
      - - GMX
        - Direct — perp + spot DEX
        - DeFiLlama lists 80+ integrations across Arbitrum, Avalanche, Solana; isolated & multi-asset pools; average pool APY 8.05%
        - Retail and DAO perp traders
        - Permissionless LP model and multi-chain footprint
        - Model-based pricing (oracle-driven) can concentrate loss on GLP-style LPs
      - - Vertex Protocol
        - Direct — hybrid CLOB/AMM perp
        - Series-A-scale funding; multi-chain deployment
        - Retail perp traders seeking CLOB + AMM
        - Cross-margin between spot, perp, and lending on a single venue
        - Less brand than Hyperliquid or dYdX
      - - Aave
        - Direct — on-chain lending
        - US$12.10B V3 TVL per CoinLaw; largest lending protocol
        - Institutional and retail borrowers/depositors
        - GHO stablecoin, cross-chain deployment, deep audits
        - Not a trading front-end
      - - Compound
        - Direct — on-chain lending
        - Multi-billion in TVL; original lending primitive
        - Retail lenders/borrowers
        - Simpler primitive, established audits
        - Feature velocity has slowed relative to Morpho
      - - Morpho Blue
        - Direct — permissionless isolated-market lending
        - Open-source Solidity contracts (visible in Morpho home page)
        - LPs, curators, structured products
        - Isolated markets with independent risk parameters
        - Less brand than Aave
      - - Spark (MakerDAO)
        - Direct — lending + stablecoin
        - Multi-billion TVL; part of Sky/Maker ecosystem
        - DAO treasuries and sDAI holders
        - Deep composability with sDAI and USDS
        - Stablecoin design constrained by Sky governance
      - - Ethena
        - Direct — yield-bearing stablecoin
        - Delta-neutral USDe/sUSDe; multi-billion in USDe supply
        - Retail and DAO yield seekers
        - First-mover in delta-neutral yield stablecoins
        - Basis-trade yield can compress in bear markets
      - - Nexus Mutual
        - Direct — on-chain insurance
        - Long-standing on-chain smart-contract coverage
        - Users hedging protocol risk
        - Established underwriting community
        - Coverage limits and slow claims cadence
      - - Sherlock
        - Direct — on-chain insurance / audit
        - Coverage tied to audit contests
        - Protocol integrators
        - Combines audit and cover
        - Smaller coverage pool
      - - Binance (CEX)
        - Substitute — centralised exchange
        - Largest CEX by spot and derivatives volume
        - Retail and institutional traders globally
        - Deep liquidity, fiat rails, and custody
        - Off-chain custody, regulatory scrutiny (U.S. exit, SEC/CFTC actions)
      - - Coinbase (CEX)
        - Substitute — centralised exchange
        - Largest U.S. CEX by regulated volume
        - U.S. retail and institutional
        - Regulated posture, ETF pipeline, Base L2 developer flow
        - Higher fees than DEX; still off-chain custody
      - - Internal build (compose Aave + Curve + Ethena + Nexus)
        - Substitute — DIY
        - Zero incremental cost for a sufficiently large DAO
        - Sophisticated protocol integrators
        - Full control and audit customisation
        - Engineering and audit cost is real
    notes: |
      Rows enumerate the material competitor set spanning direct, incumbent, adjacent, substitute, and internal-build alternatives.
