company:
  name: Flying Tulip
chapter:
  number: 3
  title: Competitors
  summary: |
    Flying Tulip enters a mature and stratified DeFi landscape in which no single incumbent bundles spot AMM, order-book
    perps, lending, stablecoin issuance, and on-chain insurance under one cross-margin roof, but each vertical has a
    well-capitalised, battle-tested leader that Flying Tulip must displace on its own axis. Direct spot-DEX peers are
    Uniswap (protocol-fee category leader; multi-billion in TVL and >US$7B daily aggregate DEX volume per DeFiLlama)
    and PancakeSwap on BNB Chain; direct perp-DEX peers are Hyperliquid (own L1 with a 200k orders/second throughput
    HyperCore), dYdX (over US$1.5T lifetime volume; US$200M open interest per dydx.exchange), and GMX (perp+spot with
    an 80+ integration base per DeFiLlama); direct lending peers are Aave (~US$12.1B TVL), Compound, Morpho Blue,
    and Spark; direct yield-stablecoin peers are Ethena (USDe/sUSDe) and MakerDAO/Spark (sDAI); direct on-chain
    insurance peers are Nexus Mutual and Sherlock; the status-quo substitute is centralized-exchange trading on
    Binance and Coinbase. Flying Tulip's differentiation is a unified cross-margin design plus the perpetual-put
    tokenomics primitive, not any single product-level breakthrough — durability depends on execution against
    incumbents whose network effects, LP capital, and audit maturity Flying Tulip does not yet have.
sections:
  - id: competitive-landscape-overview
    title: Competitive Landscape Overview
    body: |
      Flying Tulip has no true one-to-one peer because no incumbent DeFi protocol currently offers spot AMM, order-book
      perpetuals, dynamic-LTV lending, a yield-bearing stablecoin, and on-chain insurance as a single cross-margin
      product. The landscape therefore has to be reconstructed vertical by vertical. On spot DEX, Uniswap remains the
      category benchmark: DeFiLlama's protocol page describes it as "the leading decentralized crypto trading protocol"
      and Wikipedia records the launch of Uniswap v4 on 31 January 2025 with continued dominance across Ethereum, Base,
      Polygon, and Avalanche. PancakeSwap dominates BNB Chain, and Curve dominates stablecoin swaps. On perpetual DEX,
      Hyperliquid is the most credible incumbent — its docs describe a purpose-built layer-1 running HyperBFT consensus
      with fully on-chain order books "supporting 200k orders/second" — followed by dYdX, whose own site claims US$1.5T
      lifetime volume, US$200M open interest, and 220+ markets, and GMX, described by DeFiLlama as "a leading onchain
      exchange for perpetual and spot trading" with 80+ integrations across Arbitrum, Avalanche, and Solana. On lending,
      Aave is the dominant incumbent (CoinLaw records US$12.10 billion in Aave V3 TVL), and Morpho Blue's open-source
      Solidity code (visible on its home page) shows a permissionless isolated-market lending primitive. On yield-bearing
      stablecoins, Ethena's USDe/sUSDe is the direct competitor to sftUSD's ~6% APY. On insurance, Nexus Mutual and
      Sherlock are the reference on-chain coverage venues. The status-quo alternatives — Binance and Coinbase — remain
      the dominant trading and custody destinations for both retail and institutional users. Internal build is a real
      but underestimated competitor: any DAO or protocol integrator with sufficient engineering can compose Aave + Curve
      + Ethena + Nexus Mutual today without buying Flying Tulip.
