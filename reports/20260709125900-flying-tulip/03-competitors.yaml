  - id: TP004
    title: Moat Durability and Competitive Risk Register
    columns:
      - Moat claim
      - Threat
      - Severity
      - Mitigation / diligence ask
    rows:
      - - Unified cross-margin capital efficiency
        - Specialist competitors (Hyperliquid, dYdX) already offer cross-margin inside their perp product; Aave and Morpho are moving to multi-collateral pools
        - High
        - Confirm Flying Tulip's shared risk engine is materially more efficient than best specialist; ask for on-chain P&L attribution vs multi-venue baseline
      - - Cronje's builder brand
        - Key-person risk; past exits and public disputes; brand is not inheritable if Cronje departs
        - High
        - Diligence Cronje's contractual commitment, non-compete, and successor plan; test what happens to the redemption reserve if Cronje leaves
      - - Perpetual-put redemption right primitive
        - Novel; other issuers can and likely will copy it
        - Medium
        - Confirm IP posture and audit robustness of the redemption smart contract; monitor for copycat launches
      - - ftUSD as unified settlement rail
        - Ethena's USDe has a first-mover multi-billion supply lead; sDAI has DeFi composability
        - High
        - Track sftUSD reserve growth vs. USDe; confirm delta-neutral yield source is independent of Ethena
      - - Sonic zero-fee bootstrap
        - Subsidy-driven; ends when Sonic changes fee monetisation policy
        - Medium
        - Confirm fee-subsidy contract term with Sonic Labs; model unit economics post-subsidy
      - - Deep LP capital
        - Incumbent AMM liquidity (Uniswap, Curve) is deeply sticky
        - High
        - Track Flying Tulip LP retention after each fee-schedule change
      - - Regulatory / compliance stack
        - Aave, Uniswap Labs, and Coinbase all have named CCO / legal counsel; Flying Tulip does not disclose
        - High
        - Request name of legal / compliance lead, OFAC screening technology, and travel-rule integration path
      - - Audit maturity
        - Incumbents have multiple public audit rounds; Flying Tulip's audits are not yet public
        - High
        - Request Sherlock / OpenZeppelin / Trail of Bits audit reports and any formal verification coverage before scale
      - - Insurance integration
        - Nexus Mutual and Sherlock dominate on-chain cover
        - Medium
        - Confirm whether Flying Tulip's own insurance module competes with or reinsures on Nexus Mutual
      - - Distribution power
        - Uniswap, PancakeSwap, and CEX front-ends already originate retail traffic
        - High
        - Request Flying Tulip's cost of user acquisition and retention curve during Sonic subsidy window
    notes: |
      Every moat claim carries at least one plausible threat with a diligence ask; severity is calibrated to how directly the threat
      is documented in reviewed public sources.
