  - id: TV003
    title: Bull / Base / Bear Scenario Table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Base
        - Sonic subsidy window extends 1-2 quarters; full super-app ships in H2 2026; reserve captures ~4% APY on US$1B; no enforcement action; protocol fees converge to ~5-10% of the US$24.9B TTM DeFi fee pool
        - FDV held near reserve-implied floor of US$1B with modest upside from buyback burn
        - Any yield-venue exploit; MiCA classification; audit gaps
        - Modest — prediction markets flagged 50-50 above US$400M
      - - Bull
        - Cross-margin unlocks 5-10x TVL growth from US$126M; MiCA compliance path opens EU institutional capital; ftUSD supply expands beyond 1M cap
        - Buyback burn compounds, protocol revenue supports US$3-5B FDV multiple; secondary FT trades materially above US$0.10 floor
        - Copycat launches of perpetual-put primitive; incumbents move to cross-margin
        - Low pre-launch but plausible if all product modules ship on time
      - - Bear
        - SEC / CFTC / OFAC action against SAFT or ftUSD; audit-triggered exploit; redemption-run event; Cronje departure; Sonic subsidy withdrawn
        - FT collapses toward US$0.10 put-implied floor for primary-sale holders; secondary sellers eat the put invalidation loss; FDV compresses toward US$400M prediction-market band
        - Cascading liquidations; bridge exploit
        - Priced by prediction markets pre-TGE
      - - Deep bear
        - Multiple simultaneous failures — audit exploit plus regulatory action plus reserve venue impairment
        - Redemption reserve solvency stress; queue and rate limits fail
        - Reserve unwind at adverse prices; Chainalysis / BIS liquidity-mismatch analog
        - Low but tail case that Tornado Cash and BIS commentary make historically salient
    notes: |
      Scenarios are anchored to publicly documented signals (prediction market rating, MEXC TVL, DeFi fee pool). Bear and
