callouts:
  - calloutType: strength
    title: The US$1B FDV is mechanically defensible if the reserve model works as designed
    body: |
      Unlike most token launches where FDV is speculative, Flying Tulip's US$1B is directly linked to the deployable reserve
      pool. Every FT primary-sale holder has a Perpetual PUT redemption right at par. Provided (i) the reserve smart
      contracts are audited and solvent, (ii) yield venues (Aave, Ethena, Spark) hold their APY, and (iii) no regulator
      forces reserve unwind, the FDV is genuinely more asset-backed than any comparable DeFi token launch.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV017
  - calloutType: risk
    title: Prediction markets pre-TGE were 50-50 on US$400M — the market is skeptical of the US$1B
    body: |
      MEXC's TGE post noted that prediction markets gave Flying Tulip only about a 50-50 chance of trading above a US$400M
      FDV pre-launch, well below the US$1B insider mark. That is a rare, independent, market-priced adverse signal. The
      base case therefore should not be the US$1B anchor but a probability-weighted mix skewed toward the reserve-mechanic
      floor.
    claimRefs:
      - CV004
      - CV011
  - calloutType: risk
    title: Six unresolved diligence blockers separate TRACK from BUY
    body: |
      Independent audit disclosure, named CCO / CTO, reserve venue allocation policy, Sonic subsidy contract terms, MiCA
      compliance stack, and MEXC-only public-sale settlement corroboration are the six blockers that keep the
      recommendation at TRACK. Any three of these being resolved would justify upgrading to BUY at a stretched but
      defensible valuation.
    claimRefs:
      - CV028
      - CV029
      - CV030
      - CV031
      - CV032
      - CV033
