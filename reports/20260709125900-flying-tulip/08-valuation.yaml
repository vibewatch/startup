  - id: bull-base-bear-scenarios-and-comps
    title: Bull, Base, and Bear Scenarios and Comparable Anchors
    body: |
      Comparable named-token valuations at run date sit across a wide dispersion. Hyperliquid (HYPE, described by
      CoinGecko as a layer-one blockchain with a 1B token maximum supply supporting spot and perpetuals) trades on
      Hyperliquid and Coinbase; Aave (multi-billion TVL lending incumbent), Uniswap (spot DEX category leader), Ethena
      (delta-neutral USDe stablecoin), dYdX (US$1.5T lifetime perpetual volume per the company's site), and Curve
      (stablecoin AMM) each carry publicly tradable governance tokens with different revenue tie mechanics. Flying
      Tulip's FT trades at ~US$0.10 for a ~US$1B FDV mechanically anchored to the reserve, not comparable-token
      multiples. The base case assumes (i) the Sonic subsidy window keeps zero-fee retail acquisition open for one to
      two quarters; (ii) full super-app product suite ships in H2 2026 as Cronje guided; (iii) reserve yield captures
      ~4% APY on US$1B and generates ~US$40M/yr; (iv) no SEC / CFTC enforcement action; and (v) protocol revenue at
      steady state approaches ~5-10% of aggregate DeFi fee pool (US$24.9B TTM per CoinLaw) — implying US$1.2-2.5B of
      addressable annual fees the super-app can compete for. Bull case assumes cross-margin unlocks capital efficiency
      that pulls 5-10x today's US$126M TVL, MiCA compliance path opens EU institutional capital, and buyback burn
      compounds toward a US$3-5B FDV. Bear case assumes SEC or OFAC action against the perpetual-put SAFT or against
      ftUSD, an audit-triggered exploit, or a redemption-run event, in each case pushing FT below the US$0.10 floor,
      testing queue and rate-limit mechanics, and compressing FDV toward the US$400M level prediction markets originally
      priced.
