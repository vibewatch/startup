  - id: TV004
    title: Comparable Valuation Table
    columns:
      - Comparable
      - Metric
      - Multiple / valuation / status
      - Relevance
      - Limitation
    rows:
      - - Hyperliquid (HYPE)
        - Perp DEX layer-one; HYPE 1B supply
        - Publicly tradable; HYPE token has traded on Hyperliquid and Coinbase per CoinGecko
        - Closest architectural rival for cross-margin perp
        - Hyperliquid is self-funded with no external capital, so investor-comparable is limited
      - - dYdX
        - Perp DEX with own Cosmos chain
        - Own token; US$1.5T lifetime volume, US$200M open interest, 220+ markets per dydx.exchange
        - Perp DEX scale reference
        - Different chain and governance mechanics
      - - Aave (AAVE)
        - Lending incumbent; ~US$12.1B V3 TVL per CoinLaw
        - Publicly tradable AAVE governance token
        - Lending vertical baseline
        - Aave is a governance token, not a revenue-share instrument
      - - Uniswap (UNI)
        - Spot DEX category leader
        - UNI governance token; Uniswap Labs raised ~US$165M by 2022
        - Spot AMM valuation reference
        - UNI does not currently carry a fee-share to holders
      - - Ethena (ENA / USDe)
        - Yield-bearing stablecoin
        - ENA governance token; USDe is a delta-neutral stablecoin
        - Yield-stablecoin peer for sftUSD
        - USDe basis compression is a known cycle risk
      - - Curve (CRV)
        - Stableswap AMM; ve(3,3) governance
        - Publicly tradable CRV
        - Stablecoin swap comparable
        - Different governance model
      - - Coinbase Global (COIN, filing base)
        - Public CEX exchange filing (SEC EDGAR)
        - 10-K disclosures anchor take-rate benchmarking
        - Public benchmark for revenue disclosure quality
        - Off-chain custody model differs materially
      - - Infinex (INX)
        - DeFi super-app peer (MEXC-referenced comparable)
        - INX FDV traded at US$121M vs US$300M ICO valuation per MEXC — 60% loss for early participants
        - Direct anti-comparable for DeFi super-app launches
        - Single-outlet citation
      - - Sonic Labs (S)
        - Launch chain and Cronje-adjacent ecosystem
        - Publicly tradable Sonic token; token pair S/USD tracked by TradingView per Coinspeaker
        - Related-party ecosystem comparable
        - Related-party economics
      - - Solana (SOL)
        - L1 for Flying Tulip's multi-chain deployment target
        - Publicly tradable SOL; multi-billion market cap
        - Anchor for retail acquisition potential
        - Not a direct valuation comp for DeFi protocols
    notes: |
      Comparable set spans architectural rivals, filing-based public benchmarks (Coinbase), and one direct DeFi super-app
      anti-comparable (Infinex). Multiples are not directly transferable due to differences in tokenomics.
