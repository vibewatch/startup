company:
  name: Flying Tulip
chapter:
  number: 8
  title: Valuation
  summary: |
    Flying Tulip's US$1 billion fully diluted valuation is mechanically anchored to the perpetual-put redemption reserve
    rather than to any traditional revenue multiple: the FT token launched at US$0.10 on 23 February 2026, dipped to
    about US$0.08 in early trading before stabilising near the put-implied floor, and prediction markets pre-TGE gave
    Flying Tulip only about a 50-50 chance of holding above a US$400M FDV. The valuation therefore should be underwritten
    as an option on Cronje's ability to translate a design-target ~US$40M/yr reserve-yield stream and future protocol
    fees into buyback-driven token demand faster than incumbent DEX and lending competitors can respond. Comparable
    named-token valuations offer no clean multiple anchor because incumbents on any single vertical (Hyperliquid, dYdX,
    Aave, Uniswap, Ethena) trade with materially different tokenomics, product surface, and float mechanics. The
    recommendation at run date is TRACK with medium confidence and stretched valuation stance, high risk rating,
    contingent on public audit disclosure, MiCA / OFAC compliance stack, and post-subsidy retention data. The single
    largest thesis-break trigger is any SEC / CFTC / OFAC action against the perpetual-put SAFT or against ftUSD.
sections:
  - id: investment-thesis-and-anti-thesis
    title: Investment Thesis, Anti-Thesis, and Recommendation
    body: |
      The thesis for Flying Tulip is that André Cronje's reputation capital, a novel perpetual-put fundraising primitive
      that gives investors principal protection, a unified cross-margin super-app that no incumbent offers, a zero-fee
      Sonic launch subsidy, and a broad SAFT syndicate spanning macro (Brevan Howard Digital), TradFi prop (Susquehanna
      Crypto), crypto-native venture (CoinFund and 10 others), and market makers (DWF Labs, Selini, FalconX) collectively
      compound into a durable DeFi platform whose ~US$40M/yr reserve-yield stream can bootstrap protocol adoption without
      diluting the team. The anti-thesis is that (i) every vertical Flying Tulip enters has a specialist incumbent
      leading on TVL, volume, and audit maturity; (ii) the perpetual-put primitive is copyable and Lemniscap already
      calls the fundraise an experiment; (iii) key-person concentration on Cronje is inseparable from the Sonic Labs
      related-party relationship; (iv) no independent audit reports are publicly linked from docs.flyingtulip.com at
      run date; (v) the FDV is mechanically anchored to the reserve pool rather than any revenue metric; (vi) prediction
      markets rated the launch valuation as roughly 50-50 to hold at a US$400M FDV, well below the US$1B insider mark;
      and (vii) the U.S. Treasury's DeFi Risk Assessment, BIS's DeFi analysis, FATF's virtual-asset guidance, and the
      Tornado Cash sanctions precedent together create a large regulatory tail. Recommendation at run date is TRACK with
      medium confidence and stretched valuation stance; overall score in the 6-7 band; risk rating high.
