  - id: TV002
    title: Thesis / Anti-Thesis Table
    columns:
      - Argument
      - Category
      - What would change the view
    rows:
      - - Cronje's reputation capital and history with Yearn, Solidly, and Sonic give Flying Tulip an outsized marketing surface
        - Thesis
        - Cronje departure or public exit
      - - Perpetual-put redemption right is a novel primitive that solves founder / investor misalignment
        - Thesis
        - Widespread copycat launches diluting the primitive advantage
      - - Cross-margin super-app design is uniquely broad in DeFi
        - Thesis
        - Incumbents (Hyperliquid, dYdX, Aave, Ethena) launch cross-margin in their own domains at scale
      - - Zero-fee Sonic subsidy enables retail acquisition without dilutive incentives
        - Thesis
        - Sonic Labs changes fee-monetisation policy or subsidy ends
      - - US$200M SAFT from a top-tier syndicate signals institutional legitimation
        - Thesis
        - A named MM exits or lock-up terms disclosed as unusually short
      - - Team's zero initial FT allocation ties compensation to protocol performance
        - Thesis
        - Team turnover from insufficient buyback flow
      - - Every vertical Flying Tulip enters has a specialist incumbent leading on TVL / volume / audit
        - Anti-thesis
        - Flying Tulip captures a specific incumbent's TVL or volume through cross-margin capital efficiency
      - - Perpetual-put primitive is copyable and Lemniscap calls it an experiment
        - Anti-thesis
        - Legal or IP posture makes the primitive materially harder to copy at scale
      - - Independent audit reports are not publicly linked at run date
        - Anti-thesis
        - Sherlock, OpenZeppelin, or Trail of Bits reports are published on docs.flyingtulip.com
      - - FDV is mechanically anchored to the reserve pool rather than revenue
        - Anti-thesis
        - Protocol fees ramp to a level that supports FDV multiples above the reserve floor
      - - Prediction markets rated launch valuation as 50-50 to hold above US$400M FDV
        - Anti-thesis
        - Sustained trading above US$0.10 with growing TVL for 90+ days
      - - U.S. Treasury / BIS / FATF and Tornado Cash precedent create regulatory tail risk
        - Anti-thesis
        - Clear MiCA / OFAC compliance disclosure and no adverse enforcement action for four consecutive quarters
    notes: |
      Each argument has a paired condition that would flip the view; the pair is the operating unit of the thesis, not
      the argument alone.
