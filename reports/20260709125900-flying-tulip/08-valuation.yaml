  - id: TV005
    title: Thesis-Break and Kill Triggers Table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - SEC / CFTC / OFAC action against SAFT or ftUSD
        - Any enforcement letter or sanction listing
        - Regulatory tail materialises; users leave
        - Position exit; downgrade to AVOID
      - - Reserve or cross-margin engine exploit
        - Any exploit event
        - Solvency stress; PUT trust broken
        - Position exit; force PUT redemption for primary holders
      - - Redemption-run stress
        - Queue and rate-limit exceeded > 72 hours
        - Liquidity-mismatch scenario per BIS
        - Reduce exposure; investigate reserve venues
      - - Cronje departure or public exit
        - Announcement or 30+ days of silence
        - Marketing surface and Sonic co-ordination compressed simultaneously
        - Reduce exposure; request successor plan
      - - Sonic subsidy withdrawal
        - Any change to fee-monetisation subsidy
        - Zero-fee acquisition ends; unit economics change
        - Rebuild post-subsidy unit-economics model
      - - Reserve venue impairment
        - Aave / Ethena / Spark exploit or peg break > 2%
        - Yield-stream compression
        - Rebalance reserve; disclose to LPs
      - - FT trading below US$0.10 for sustained period
        - Sustained below-floor trading (14+ days)
        - Redemption pressure and public confidence break
        - Investigate queue health
      - - MM exit
        - Named MM withdrawal or spread widening
        - Liquidity compression
        - Confirm MM commitments
      - - Bridge exploit
        - Bridge partner compromise
        - Multi-chain rollout stalls
        - Halt cross-chain activity
      - - Audit exposure of previously undisclosed flaw
        - Public audit reveals critical finding
        - Trust compression
        - Wait for remediation
      - - No public audit disclosure by end of 2026-Q4
        - No published audit
        - Security posture stays opaque
        - Downgrade to AVOID pending audit
    notes: |
      Each trigger is monitorable and has an explicit action implication. Together they operationalise the recommendation
      table's downgrade conditions.
