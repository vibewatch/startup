  - id: TU005
    title: Expansion and Concentration Risk Table
    columns:
      - Expansion driver
      - Concentration risk
      - Impact
      - Diligence path
    rows:
      - - Zero-fee Sonic subsidy attracting retail
        - Sonic Labs is the single-partner subsidy source
        - Post-subsidy retention step-change if subsidy expires
        - Confirm subsidy contract term and any renewal option
      - - sftUSD ~6% APY attracting DAO / institutional stablecoin capital
        - Aave / Ethena / Spark are the three reserve venues
        - Yield-venue exploit or peg break compresses the ~US$40M/yr yield stream
        - Confirm concentration limits and hedging policy per venue
      - - Cross-margin engine enabling product-to-product cross-sell
        - Cross-margin engine is untested at production scale
        - Cascading liquidations could destroy user wallet balances
        - Request stress-test outputs and any circuit breakers
      - - Multi-chain rollout to Ethereum / Base / Avalanche / BNB Chain / Solana
        - Cross-chain bridge risk
        - Historical DeFi loss concentrated in bridges
        - Confirm bridge vendor list and audit history
      - - Institutional MiCA path via Brevan Howard Digital, Fasanara
        - No named CCO or legal-compliance lead
        - MiCA / OFAC compliance gap blocks institutional adoption
        - Request compliance vendor list and legal opinion
      - - Prop-market maker overlap with SAFT investors
        - MM exit could compress spread and depth
        - Sudden drop in liquidity quality if a large MM withdraws
        - Confirm MM commitments and lock-up terms
      - - Andre Cronje's public reputation and thought-leadership
        - Key-person concentration risk
        - Cronje departure would compress marketing surface immediately
        - Request Cronje's contractual commitment, successor plan, and non-compete
      - - Impossible Finance Curated venue as retail distribution
        - Single-venue reliance for retail public sale
        - Regulator action or venue outage delays sale close
        - Confirm alternate retail-distribution venues
    notes: |
      Every driver has a matched concentration risk; the table is designed to be paired with the risks chapter for buyer
      due diligence.
