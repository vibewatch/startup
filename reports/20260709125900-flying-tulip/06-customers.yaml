    title: Customer Segmentation Table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Scale
      - Revenue / strategic value
      - Gap
    rows:
      - - Primary-sale institutional investors (SAFT)
        - Institutional VCs / hedge funds
        - Provide contributed principal to redemption reserve
        - 13 named investors; US$200M private
        - High strategic value (credibility) but no direct fee revenue
        - Post-put invalidation flow not yet observed
      - - Public-sale contributors (PCA)
        - Retail and institutional wallets
        - Contribute at 10 FT per US$1 in accepted assets
        - MEXC reports soft commitments over US$1.3B
        - Fund reserve principal for yield deployment
        - Public-sale settlement report not published
      - - Institutional prop-market makers
        - Susquehanna Crypto, Selini, DWF Labs, FalconX
        - Seed liquidity and quoting on Sonic launch
        - 4 named MMs; sizes undisclosed
        - Provide execution depth and cross-margin capacity
        - Market-making agreements and rebate terms undisclosed
      - - Retail traders
        - Anonymous on-chain wallets
        - Spot swaps and perp trades on Sonic
        - Zero-fee cohort at TGE; unique-address curve not public
        - Foundation of future fee capture post-subsidy
        - No cohort or retention data available
      - - LPs and yield farmers
        - Wallet holders providing liquidity
        - Deposit assets into AMM, LP pools, and lending markets
        - Post-launch unique LP count undisclosed
        - Direct fee earners in exchange for capital
        - LP-level TVL retention not measurable yet
      - - DAO treasuries
        - Multi-sig DAOs
        - Stake sftUSD for yield or use ftUSD as settlement
        - Not named individually
        - ftUSD sits in DAO treasuries as opt-in yield
        - No named DAO customer disclosure
      - - Institutional stablecoin holders
        - MiCA-compliant asset managers
        - Hold ftUSD or sftUSD for treasury yield
        - Not observed at run date
        - Long-term higher-scale customer
        - MiCA compliance stack not disclosed
      - - Protocol integrators (composable)
        - Other DeFi protocols
        - Embed ftUSD as settlement rail
        - Not observed at run date
        - Multiplier effect on ftUSD adoption
        - No integrator case study published
      - - Sonic Labs (partner / ecosystem customer)
        - Sonic Labs governance
        - Provides fee monetisation and subsidy
        - Single named partner
        - Central to launch economics
        - Related-party disclosure incomplete
    notes: |
      Segmentation preserves the fact that the same wallet can be buyer, user, and payer. Named entities appear where the
      reviewed public sources support them; anonymous wallets are called out as such.
