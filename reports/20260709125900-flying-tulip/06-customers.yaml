  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: named-end-user-customer-TU003
      missingEvidence: Named DAO-treasury, corporate, or institutional end-user customer references with outcome-specific case studies.
      whyItMatters: Pre-launch DeFi protocols can survive without named end-user references, but underwriting expansion requires them.
      diligencePath: Request 1-2 institutional pilot customers willing to be named after the zero-fee subsidy window ends.
      relatedQuestionRefs:
        - QU004
      relatedTableRefs:
        - TU003
    - type: private-evidence-only
      severity: material
      topic: retention-analytics-TU004
      missingEvidence: Cohort-level retention analytics for FT holders, ftUSD stakers, LPs, and trading wallets.
      whyItMatters: Retention is the single most predictive customer metric; its absence blocks durability underwriting.
      diligencePath: Publish a Dune or Token Terminal dashboard with monthly cohort retention.
      relatedQuestionRefs:
        - QU016
        - QU017
      relatedTableRefs:
        - TU004
    - type: conflicting-data
      severity: material
      topic: mexc-only-tranches
      missingEvidence: Independent corroboration of MEXC's Series-A extension and Impossible Finance tranche figures.
      whyItMatters: MEXC-only citations materially change the disclosed customer set and total capital committed.
      diligencePath: Request press releases from Amber Group, Fasanara Digital, Paper Ventures, and Impossible Finance.
      relatedQuestionRefs:
        - QU010
        - QU011
        - QU012
    - type: missing-source
      severity: material
      topic: coinfund-portfolio-disclosure
      missingEvidence: CoinFund's own portfolio page does not explicitly list Flying Tulip at run date.
      whyItMatters: Investor portfolio pages are the highest-signal customer-proof surface for a SAFT participant.
      diligencePath: Ask CoinFund to publicly list Flying Tulip in its portfolio.
