callouts:
  - calloutType: strength
    title: The named investor syndicate is a top-tier customer-proof surface in DeFi
    body: |
      Thirteen named investors — Brevan Howard Digital, CoinFund, DWF Labs, FalconX, Hypersphere, Lemniscap, Nascent,
      Republic Digital, Selini, Sigil Fund, Susquehanna Crypto, Tioga Capital, Virtuals Protocol — span macro-fund
      crypto arms, TradFi prop-firm crypto arms, crypto-native VCs, market makers, and ecosystem tokens. For a
      pre-launch DeFi protocol that is the strongest publicly-verifiable customer proof surface available, and it is
      corroborated across at least ten independent outlets.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU005
  - calloutType: risk
    title: There is no named end-user or DAO-treasury customer case study
    body: |
      Coinbase Institutional, Aave, and Snowflake all publish outcome-specific customer case studies. Flying Tulip's
      customer proof is investor-heavy and partner-heavy; there is no named DAO treasury, no named institutional
      allocator, and no named integrator publicly referenced as a Flying Tulip customer at run date. That gap is
      normal for a pre-launch protocol but material for underwriting.
    claimRefs:
      - CU005
      - CU006
      - CU008
      - CU014
  - calloutType: risk
    title: Retention data will remain a diligence gap for at least two more quarters
    body: |
      The FT token has traded for less than five months; ftUSD has been live for less than six months; the trading
      modules are only just ramping. Every row of the retention table is a diligence gap and cannot be filled without
      more time-elapsed adoption. Underwriting Flying Tulip's durability at run date is therefore based on structural
      arguments (cross-margin capital efficiency, deflationary tokenomics) rather than observed retention.
