schemaVersion: report-v2
artifact: customers
slug: flying-tulip
runDate: '2026-07-09'
company:
  name: Flying Tulip
chapter:
  number: 6
  title: Customers
  summary: |
    Flying Tulip's "customer" surface is unusual because the protocol has no enterprise sales cycle; its customers are
    on-chain wallets grouped into four buyer archetypes: (i) SAFT investors and public-sale contributors that funded the
    US$200M private round and the 16 Feb 2026 public sale, (ii) LPs and prop-market makers seeding liquidity for the
    Sonic launch, (iii) retail traders who arrived at TGE to capture zero-fee spot and cross-margin perps, and (iv) DAO
    treasuries and small institutions using ftUSD/sftUSD as a yield rail. The strongest named proof comes from the SAFT
    investor syndicate (Brevan Howard Digital, CoinFund, Susquehanna Crypto, DWF Labs, FalconX, Hypersphere, Lemniscap,
    Nascent, Republic Digital, Selini, Sigil Fund, Tioga Capital, Virtuals Protocol) and from the Sonic Labs launch
    partnership. MEXC-reported soft commitments of over US$1.3B on the public sale and TVL of ~US$126M at TGE are the
    strongest early usage metrics, but both come from a single outlet. Named institutional customer references — the
    kind that would populate a Coinbase Institutional case-study page — do not exist at run date. Retention and cohort
    data cannot yet be pulled because the FT token has traded for less than five months as of the run date, so all
    retention rows are diligence gaps.
sections:
  - id: customer-base-segmentation
    title: Customer Base Segmentation
    body: |
      Flying Tulip's customer taxonomy has four segments. Segment one is the primary-sale contributor cohort — 13 named
      institutional investors from the private SAFT round (Brevan Howard Digital, CoinFund, DWF Labs, FalconX, Hypersphere,
      Lemniscap, Nascent, Republic Digital, Selini, Sigil Fund, Susquehanna Crypto, Tioga Capital, Virtuals Protocol) and
      the public-sale contributor pool that opened 16 February 2026 (MEXC reports soft commitments over US$1.3B). Every
      primary-sale FT position carries the Perpetual PUT redemption right. Segment two is on-chain liquidity providers
      and market makers, some of which overlap with segment one — Susquehanna Crypto, Selini, DWF Labs, and FalconX are
      simultaneously SAFT contributors and prop-market makers whose downstream trading and quoting is a de facto customer
      relationship. Segment three is retail traders who arrived at TGE (23 February 2026) to access zero-fee spot and
      cross-margin perpetuals on Sonic; these are anonymous wallets rather than named accounts. Segment four is DAO
      treasuries and small institutions using ftUSD/sftUSD as a yield venue; sftUSD staked balance passed the initial 1M
      ftUSD cap on Sonic per Stablecoin Insider. A fifth boundary case is Sonic Labs itself, which is both a partner and
      an implicit ecosystem customer given that Flying Tulip's early revenue and TVL flow through the Sonic chain. No
      named enterprise customer of the type that would appear on a Coinbase Institutional or Aave DAO case study exists
      in reviewed public sources at run date.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU005
      - CU006
      - CU007
      - CU008
    tableRefs:
      - TU001
    figureRefs:
      - FU001
  - id: adoption-trajectory-and-named-proof
    title: Adoption Trajectory and Named Customer Proof
    body: |
      The trajectory of live adoption is thin but directionally coherent. ftUSD launched on Sonic on 23 January 2026 with
      a 1M ftUSD initial supply cap and ~6% APY on sftUSD; Stablecoin Insider reports circulating supply approached the
      cap "with total value locked exceeding $700,000 across supported chains" and MEXC's TGE post reports overall Flying
      Tulip TVL of approximately US$126M at the 23 February 2026 TGE with "accumulated yield exceeding $85,000 even
      before the full platform launch". The public sale opened 16 February 2026 at 10 FT per US$1 in accepted assets and
      MEXC-only reporting says "soft commitments exceeding $1.3 billion" — a headline demand signal but corroborated by
      a single secondary outlet. Named customer proof beyond the investor syndicate is very limited: (i) Sonic Labs is
      the launch chain and effective ecosystem partner; (ii) Aave v3 is explicitly named in the Flying Tulip docs
      glossary as a reserve-yield venue; (iii) Ethena, Spark, and Aave receive reserve principal per Cronje's Block
      interview; (iv) Amber Group, Fasanara Digital, and Paper Ventures are cited by MEXC as Series-A extension
      participants; (v) Impossible Finance is cited by MEXC as the Curated-round venue. Each is a proof point but none
      of them provide the outcome-specific "customer wins X because of Flying Tulip" narrative a Coinbase or Snowflake
      customer page would carry.
    claimRefs:
      - CU009
      - CU010
      - CU011
      - CU012
      - CU013
      - CU014
      - CU015
      - CU016
    tableRefs:
      - TU002
      - TU003
    figureRefs:
      - FU002
      - FU003
  - id: retention-expansion-and-concentration
    title: Retention, Expansion, and Concentration Risk
    body: |
      Retention data cannot yet be computed for Flying Tulip: the FT token has traded for less than five months at run
      date, the trading modules are still ramping on Sonic, and no cohort-level analytics dashboard is public. Expansion
      levers are structurally strong: (i) the zero-fee Sonic subsidy pulls retail acquisition; (ii) sftUSD's opt-in
      yield pulls DAO and institutional stablecoin capital; (iii) the cross-margin engine enables product-to-product
      cross-sell within the same wallet; (iv) multi-chain rollout to Ethereum, Base, Avalanche, BNB Chain, and Solana
      broadens the LP-side surface. Concentration risk is unusually high on multiple axes: (a) Sonic Labs concentration
      — the launch chain is a related party where Cronje is a co-architect, and the zero-fee subsidy is a single-partner
      dependency; (b) prop-market maker overlap with SAFT investors — Susquehanna, Selini, DWF, FalconX serve both as
      capital sources and liquidity providers, so a market-maker exit could compress spread quality; (c) yield-venue
      concentration — Aave, Ethena, and Spark are the reserve venues, and any single-venue exploit or peg break
      compresses the ~US$40M/yr yield stream; (d) André Cronje key-person concentration is a customer-facing risk
      because Cronje's public persona is the primary marketing surface. Procurement friction is essentially zero for
      wallet users but non-trivial for institutional users, who need MiCA compliance, custody assurance, and audited
      backing — none of which is fully disclosed at run date. Adverse context: BIS's DeFi analysis and the U.S.
      Treasury's DeFi Risk Assessment both flag DeFi customer risks around liquidity mismatches, illicit-finance
      exposure, and unaudited primitives.
    claimRefs:
