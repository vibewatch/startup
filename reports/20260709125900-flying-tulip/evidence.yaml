evidenceGaps:
  - type: missing-source
    severity: material
    topic: leadership-disclosure-TO002
    missingEvidence: A public roster of cofounders, senior executives, and any board or foundation directors beyond André Cronje.
    whyItMatters: >-
      The reviewed public sources name exactly one principal, which is an unusually thin org file for a protocol raising
      $200M with a public retail sale ahead.
    diligencePath: >-
      Request the operating entity's founding documents, senior-hire announcements, and the foundation's board
      composition and charter.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: legal-entity
    missingEvidence: >-
      Identity of the Flying Tulip operating entity, its jurisdiction of incorporation, and the foundation issuing the
      FT token.
    whyItMatters: >-
      Perpetual-put SAFTs sold to global retail buyers create securities-law and consumer-protection exposure that
      cannot be assessed without the issuer's legal identity.
    diligencePath: Request formation documents, foundation charter, and legal opinion on the SAFT and public-sale structure.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: minor
    topic: post-saft-tranches
    missingEvidence: >-
      Independent confirmation of the alleged $25.5M Series-A extension from Amber Group, Fasanara Digital, and Paper
      Ventures and the $50M Impossible Finance tranche.
    whyItMatters: >-
      These tranches are cited only in a single secondary source (MEXC blog) and materially change the disclosed total
      capital.
    diligencePath: >-
      Request term sheets or press releases from the alleged participants and reconcile against the public-sale
      settlement report.
    relatedQuestionRefs:
      - QO021
  - type: private-evidence-only
    severity: material
    topic: sonic-related-party
    missingEvidence: >-
      The commercial terms of any subsidy or partnership between Flying Tulip and Sonic Labs, and disclosure of Cronje's
      economic exposure to both entities.
    whyItMatters: >-
      Cronje is a co-architect of Sonic and Sonic subsidises Flying Tulip's zero-fee trading; related-party economics
      are material to underwriting.
    diligencePath: >-
      Request the Sonic subsidy contract, any Flying Tulip governance or advisory role Sonic holds, and Cronje's Sonic
      token exposure disclosure.
    relatedQuestionRefs:
      - QO023
  - type: missing-source
    severity: minor
    topic: investor-portfolio-disclosure
    missingEvidence: >-
      Explicit portfolio-page confirmation from CoinFund and other named investors that Flying Tulip is a live portfolio
      company.
    whyItMatters: Investor portfolios often lag press announcements; public confirmation would corroborate press-cited commitments.
    diligencePath: Ask CoinFund and other participants to publish Flying Tulip on their portfolio pages.
    relatedQuestionRefs:
      - QO027
  - type: conflicting-data
    severity: material
    topic: analyst-sizing-dispersion-TM002
    missingEvidence: >-
      A reconciled methodology showing how Mordor's US$188.67B 2025 base and Grand View's US$26.94B 2025 base can differ
      by 7x.
    whyItMatters: >-
      Underwriting Flying Tulip's TAM depends on a defensible denominator; the analyst dispersion means either can be
      used to argue any narrative.
    diligencePath: >-
      Request each publisher's segment definition, revenue-versus-TVL rulebook, and geographic scope; anchor internal
      models to on-chain observable revenue.
    relatedQuestionRefs:
      - QM024
      - QM004
      - QM005
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: super-app-tam
    missingEvidence: >-
      A direct analyst estimate of the addressable spend for a unified DeFi super-app that bundles spot, perp, lending,
      stablecoin, and insurance.
    whyItMatters: Flying Tulip's most differentiated positioning has no cleanly measurable market denominator today.
    diligencePath: Request on-chain-derived internal TAM based on segment-level fee pools and stablecoin float share.
    relatedQuestionRefs:
      - QM023
  - type: conflicting-data
    severity: minor
    topic: cex-dex-ratio
    missingEvidence: A reliable current CEX-to-DEX volume ratio that pins substitute pressure to a single denominator.
    whyItMatters: Substitution risk on the retail-trader side depends on how tight the CEX-DEX ratio is trending.
    diligencePath: >-
      Pull CoinGecko and Chainalysis quarterly CEX/DEX ratio series and cross-check against DeFiLlama's DEX-volume
      dashboard.
    relatedQuestionRefs:
      - QM026
  - type: private-evidence-only
    severity: minor
    topic: sftusd-vs-usde
    missingEvidence: Head-to-head yield sourcing and reserve-composition data comparing sftUSD to Ethena's USDe and sDAI.
    whyItMatters: Ethena's incumbent lead in yield-bearing stablecoins directly compresses ftUSD's share capture.
    diligencePath: Pull Ethena's USDe reserve reports, sDAI backing, and sftUSD reserve-attestation cadence.
    relatedQuestionRefs:
      - QM027
  - type: conflicting-data
    severity: minor
    topic: mexc-soft-commitment
    missingEvidence: An independent second source confirming MEXC's US$1.3B public-sale soft-commitment figure.
    whyItMatters: If Flying Tulip's public-sale demand is inflated, MEXC's headline overstates market pull.
    diligencePath: Request the public-sale settlement report and any auditor's reconciliation.
    relatedQuestionRefs:
      - QM025
  - type: missing-source
    severity: material
    topic: flying-tulip-audit-disclosure
    missingEvidence: >-
      Public audit reports for Flying Tulip's spot AMM, perp CLOB, dynamic-LTV lending, ftUSD, insurance, and
      redemption-reserve smart contracts.
    whyItMatters: >-
      Incumbents (Aave, Uniswap Labs, dYdX) publish multiple audit rounds; the absence of comparable disclosure for
      Flying Tulip is a direct diligence gap against every incumbent's security posture.
    diligencePath: >-
      Request Sherlock/OpenZeppelin/Trail of Bits audit reports and any formal verification coverage for each product
