          - type: callout
            title: Incumbents lead on every single vertical Flying Tulip enters
            body: >
              Uniswap leads spot; Hyperliquid leads perps by throughput; dYdX leads perps by lifetime volume; Aave leads
              lending;

              Ethena leads yield stablecoins; Nexus Mutual leads insurance. Each incumbent has a multi-billion TVL,
              mature audits,

              and sticky LP capital. Flying Tulip's US$126M TGE TVL is a fraction of any single incumbent's book.
