          - type: callout
            title: Switching cost from Uniswap, Curve, and Aave is the pacing constraint on TVL capture
            body: >
              Incumbent AMM and lending liquidity is deep and sticky. Uniswap dominates spot DEX volume; Curve dominates
              stablecoin swaps;

              Aave dominates lending. Flying Tulip's zero-fee Sonic launch is a bootstrap subsidy, but after the subsidy
              window expires,

              LP capital retention is the pacing constraint. Track LP TVL retention after each fee-schedule change, not
              headline TVL.
            calloutType: risk
