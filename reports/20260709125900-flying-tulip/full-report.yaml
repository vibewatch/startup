  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Suite and Customer Workflow
        blocks:
          - type: paragraph
            body: >
              Flying Tulip is intentionally structured as a single-wallet destination for the five most-used DeFi jobs.
              A retail

              trader connects a wallet, deposits accepted assets (USDC, USDT, USDS, USDe, USDtb, WETH, WBTC, cbBTC,
              SOL/jupSOL,

              AVAX/wAVAX per the glossary), and then executes: spot swaps on an adaptive-curve AMM; long or short
              perpetual

              positions on a CLOB with cross-margin against the wallet; borrows or supplies on a dynamic-LTV money
              market;

              mints ftUSD (or stakes sftUSD for ~6% APY on Sonic) as a delta-neutral yield stablecoin; opens on-chain
              insurance

              cover against smart-contract risk; and (per the glossary) participates in binary prediction markets
              resolved via

              Witnessnet TLS proofs. The cross-margin engine lets collateral in any accepted asset back positions in any
              product,

              which is Cronje's most-cited unified capital-efficiency claim (The Block, Blockhead). The user surface as
              of the

              run date is docs.flyingtulip.com plus the on-chain contracts; there is no traditional web-app comparison
              to

              Coinbase or Binance because balances and orders settle on-chain. The workflow difference vs. incumbents is
              that

              the same collateral does not need to be moved between separate Uniswap, Aave, dYdX, and Ethena venues.
            claimRefs:
