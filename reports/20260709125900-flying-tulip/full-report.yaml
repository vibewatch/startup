      - number: '4.4'
        title: Financial Verdict and Diligence Blockers
        blocks:
          - type: paragraph
            body: >
              The financial verdict at run date is: Flying Tulip is a design-target US$40 million/year yield capture
              with no proven

              operating revenue, priced at a US$1 billion FDV that mechanically equals the reserve pool it cannot spend.
              That is

              not a revenue multiple; it is an option on Cronje's ability to translate reserve-yield-funded incentives
              into

              protocol revenue faster than incumbent DEX and lending competitors can respond. Revenue quality is
              inherently low

              pre-launch because zero-fee subsidies mean the current fee capture is by design suppressed. Margin path is

              structurally high for a DeFi protocol (near-zero marginal cost per transaction), but only visible after
              the

              subsidy window closes and sustained volume is retained. Capital intensity is low in a traditional sense
              but the

              reserve pool creates a large non-operating balance sheet whose stewardship is the dominant risk factor.

              Diligence blockers: (i) no audited financials, no Dune-style on-chain revenue dashboard, and no protocol
              P&L; (ii)

              undisclosed team compensation schedule tied to buyback flow; (iii) no confirmed reserve-management policy
              (Aave vs

              Ethena vs Spark share is not published); (iv) MEXC-only corroboration for US$1.3B soft commitments and
              US$25.5M

              Series-A extension; (v) Sonic Labs commercial-subsidy terms are undisclosed and Cronje's co-architect role
              at Sonic

              creates a related-party dynamic. On the adverse side, BIS's Quarterly Review explicitly warns that DeFi
              vulnerabilities

              "can be severe because of high leverage, liquidity mismatches, built-in interconnectedness and the lack of
              shock

              absorbers such as banks", and the U.S. Treasury's 2023 DeFi Risk Review echoes those concerns from an
              AML/CFT angle.
