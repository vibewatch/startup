      - number: '3.2'
        title: Capability, Pricing, and Go-to-Market Comparison
        blocks:
          - type: paragraph
            body: >
              Flying Tulip's product roadmap covers a broader capability surface than any single incumbent, but on any
              one axis

              an incumbent leads. Uniswap's v4 hooks, concentrated liquidity, and long-standing LP economics represent a
              spot-DEX

              capability lead that Flying Tulip's adaptive-curve AMM has yet to prove in production. On perps,
              Hyperliquid's

              HyperCore throughput (200k orders/second per its docs) and its own layer-1 give it a matching-engine and
              MEV-resistance

              advantage that Flying Tulip must replicate through cross-chain deployment. On lending, Aave's
              dynamic-interest-rate

              curve and multi-collateral cross-chain deployment are widely audited; Morpho Blue introduces a
              permissionless

              isolated-market design (visible in its published Solidity contracts) that Flying Tulip's own dynamic-LTV
              lending

              module echoes. Pricing across DeFi tends toward zero explicit user fee (traders and LPs pay via bid-ask,
              funding,

              and swap spreads); Flying Tulip's initial Sonic zero-fee window is directly modelled on Hyperliquid's
              early promo

              structure and dYdX's rebate schedules. Go-to-market varies materially: Uniswap and Aave rely on organic
              developer

              integration; Hyperliquid runs a points-and-airdrop flywheel from its own L1; dYdX distributes a governance
              token

              and stakes rewards. Flying Tulip's GTM differentiator is Cronje's reputation capital plus the
              perpetual-put

              redemption right — a fundraising primitive that no other competitor uses. Trust and regulatory posture is
              where

              Flying Tulip lags most: Aave, Uniswap Labs, and Coinbase all have named leadership, published audits, and
              mature

              legal-compliance layers; Flying Tulip's leadership file is thin (Chapter 1) and its compliance stack is
              only

              obliquely referenced through the OFAC/tax-reporting language in the Coinspeaker press release.
