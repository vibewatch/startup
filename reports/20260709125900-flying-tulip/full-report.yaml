      - number: '1.3'
        title: Funding History, Tokenomics, and Investor Base
        blocks:
          - type: paragraph
            body: |
              Flying Tulip's capital story is unusual on both the round shape and the instrument. Cronje told The
              Block that the raise opened on 14 August 2025 and closed on 29 September 2025 with $200 million
              committed at a $1 billion fully diluted token valuation, structured as a Simple Agreement for
              Future Tokens (SAFT) rather than an equity round, with no single lead investor. The named syndicate
              spans crypto-native funds (CoinFund, Hypersphere, Lemniscap, Nascent, Republic Digital, Tioga
              Capital, Sigil Fund), market makers (DWF Labs, Selini, FalconX), traditional-finance crypto arms
              (Brevan Howard Digital, Susquehanna Crypto), and ecosystem tokens (Virtuals Protocol). A defining
              structural feature is the on-chain "perpetual put" redemption right: every private-round and public
              -sale investor can burn FT tokens at any time to redeem up to their original principal in the
              contributed asset (ETH, USDC, etc.). Cronje explicitly told The Block "actual raised is zero"
              because the reserve backing redemptions cannot be spent as operating capital; instead up to about
              $1 billion of potential proceeds are deployed into on-chain yield venues (Aave, Ethena, Spark)
              targeting ~4% APY, projecting roughly $40 million per year of yield to fund incentives and open-
              market buybacks. Team members explicitly receive zero initial FT allocation and are compensated
              through scheduled protocol-revenue-funded buybacks. A planned public sale of up to $800 million at
              the same $1 billion valuation is described in official announcements, and MEXC coverage of the 23
              February 2026 TGE also references additional smaller subsequent tranches (Series A from Amber
              Group, Fasanara Digital, and Paper Ventures; and an Impossible Finance Curated round) though these
              later tranches are less consistently sourced.
