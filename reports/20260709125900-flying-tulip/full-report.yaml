      - number: '4.3'
        title: Cost Structure, Working Capital, and Capital Adequacy
        blocks:
          - type: paragraph
            body: >
              Flying Tulip's disclosed cost structure has three legs. First, protocol operating cost — a ~15-person
              distributed

              team, per Cronje, plus smart-contract audits (undisclosed), oracle and node fees, and Sonic gas/subsidy
              true-up.

              Second, incentive spend — LP and trader incentives funded from the reserve-yield stream and eventually
              from

              protocol fees. Third, buyback expenditure — reserve yield plus revenue is directed at open-market FT
              buybacks

              that also fund team compensation. There is no capex in the traditional physical-asset sense; the closest
              analogue

              is smart-contract audit and formal-verification cost. Working capital is trivial because most protocol
              operations

              settle on-chain and the reserve pool holds most of the balance sheet. Capital adequacy is a two-tier
              problem:

              the redemption reserve (~US$200M private + up to US$800M public) is legally earmarked to redeemers and
              cannot be

              spent, so operational runway is bounded by yield generation minus operating cost. At the ~US$40
              million/year

              design yield, spending US$40 million per year across headcount, audits, security, and buyback-funded
              incentives

              would produce essentially zero net treasury growth. Any decline in on-chain APY (documented in BIS's DeFi

              analysis and Ethena reporting as materially variable across cycles) directly compresses runway. On the
              debt side

              there are no disclosed corporate debt obligations, but the perpetual-put reserve behaves like a demand
              liability

              with a queue-and-rate-limit-controlled redemption mechanism; a run on redemptions would consume yield and
              force

              Flying Tulip to unwind reserve positions at potentially adverse prices. The BIS and U.S. Treasury both
              flag this

              liquidity-mismatch dynamic as a first-order DeFi financial-stability risk.
