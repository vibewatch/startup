      - number: '2.2'
        title: TAM, SAM, and Sizing Lenses
        blocks:
          - type: paragraph
            body: >
              Analyst sizing of DeFi is unusually divergent, so no single number can anchor Flying Tulip's TAM. Mordor
              Intelligence

              projects the DeFi market at US$238.54 billion in 2026 growing to US$770.56 billion by 2031 at a 26.43%
              CAGR, with

              lending/borrowing (27.33% share in 2025), savings/yield farming (36.52%), retail users (62.12%), and North
              America

              (42.78%) as leading sub-slices. Grand View Research puts the 2025 base at only US$26.94 billion and
              forecasts a

              much steeper 68.2% CAGR to US$1.42 trillion by 2033, driven mainly by protocol-fee monetisation. Because
              these two

              estimates disagree by nearly an order of magnitude, we anchor Flying Tulip's SAM to on-chain-observable
              revenue and

              capital rather than analyst market-size guesses: DeFiLlama reports total DeFi protocol fees of US$24.91
              billion over

              the last 365 days ending June 2026, aggregate TVL of US$71.77 billion, RWA TVL of US$26.01 billion, and
              stablecoin

              circulating supply of US$314 billion. Perpetual DEX volume alone reached US$6.7 trillion in 2025 (346% YoY
              per Thrive)

              and monthly perpetual DEX volume now ranges US$10-50 billion, according to CoinLaw and Thrive. A
              conservative SAM

              for Flying Tulip's four-product suite (spot DEX + perp DEX + lending + stablecoin) therefore centres on
              the roughly

              US$25 billion of annual on-chain protocol fees plus stablecoin yield spreads. SOM in year one is bounded
              by

              documented TVL of about US$126 million at TGE (per MEXC).
