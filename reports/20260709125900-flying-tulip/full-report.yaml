      - number: '7.2'
        title: Operational, Security, and Financial-Model Risk
        blocks:
          - type: paragraph
            body: >
              Flying Tulip concentrates operational and security risk into two unusually load-bearing systems: (i) the
              cross-margin

              risk engine that unifies collateral across spot, perpetuals, lending, insurance, and prediction markets;
              and (ii)

              the perpetual-put redemption reserve that is queue-and-rate-limited but must remain solvent under stress.
              Independent

              audit reports for either system are not publicly linked from docs.flyingtulip.com as of the run date, in
              contrast

              to Aave, Uniswap Labs, and Ethena which publish multiple audit rounds. Chainalysis's 2025 Crypto Crime
              Report

              documents multi-billion-dollar historical DeFi hack activity concentrated in bridges and lending protocols
              — both

              of which Flying Tulip's multi-chain roadmap and dynamic-LTV design will inherit. Financial-model risk
              stems from

              the yield-source concentration: Aave utilisation rates, Ethena basis compression in bear markets, and
              Spark's

              dependence on the Sky/USDS ecosystem could each cut the reserve APY in half. Because reserve principal is
              legally

              earmarked to redeemers, a 200bps compression compresses roughly US$20M/yr of operating spending. Fraud and
              internal

              control risk is elevated by the absence of a named CCO / general counsel and the private-company
              disclosure

              posture. Working capital is essentially the yield stream, so any bear-market APY compression combined with
              rising

              opex forces spending cuts within one to two quarters.
