      - number: '6.3'
        title: Retention, Expansion, and Concentration Risk
        blocks:
          - type: paragraph
            body: >
              Retention data cannot yet be computed for Flying Tulip: the FT token has traded for less than five months
              at run

              date, the trading modules are still ramping on Sonic, and no cohort-level analytics dashboard is public.
              Expansion

              levers are structurally strong: (i) the zero-fee Sonic subsidy pulls retail acquisition; (ii) sftUSD's
              opt-in

              yield pulls DAO and institutional stablecoin capital; (iii) the cross-margin engine enables
              product-to-product

              cross-sell within the same wallet; (iv) multi-chain rollout to Ethereum, Base, Avalanche, BNB Chain, and
              Solana

              broadens the LP-side surface. Concentration risk is unusually high on multiple axes: (a) Sonic Labs
              concentration

              — the launch chain is a related party where Cronje is a co-architect, and the zero-fee subsidy is a
              single-partner

              dependency; (b) prop-market maker overlap with SAFT investors — Susquehanna, Selini, DWF, FalconX serve
              both as

              capital sources and liquidity providers, so a market-maker exit could compress spread quality; (c)
              yield-venue

              concentration — Aave, Ethena, and Spark are the reserve venues, and any single-venue exploit or peg break

              compresses the ~US$40M/yr yield stream; (d) André Cronje key-person concentration is a customer-facing
              risk

              because Cronje's public persona is the primary marketing surface. Procurement friction is essentially zero
              for

              wallet users but non-trivial for institutional users, who need MiCA compliance, custody assurance, and
              audited

              backing — none of which is fully disclosed at run date. Adverse context: BIS's DeFi analysis and the U.S.

              Treasury's DeFi Risk Assessment both flag DeFi customer risks around liquidity mismatches, illicit-finance

              exposure, and unaudited primitives.
