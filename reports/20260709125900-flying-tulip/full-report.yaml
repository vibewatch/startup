      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: A one-of-one fundraising primitive backed by a broad, credible crypto-native syndicate
            body: >
              Flying Tulip closed US$200M at a US$1B FDV in six weeks with 13 named investors spanning macro (Brevan
              Howard Digital),

              TradFi prop (Susquehanna Crypto), crypto-native venture (CoinFund, Hypersphere, Lemniscap, Nascent,
              Republic Digital, Tioga,

              Sigil), and market makers (DWF Labs, Selini, FalconX). The on-chain perpetual-put mechanism, which lets
              holders redeem

              principal at any time, is a genuinely novel primitive designed to address the founder-token misalignment
              Cronje personally

              experienced at Yearn and Sonic.
