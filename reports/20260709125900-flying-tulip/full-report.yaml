      - number: '1.4'
        title: Milestones, Launch, and Adverse Signals
        blocks:
          - type: paragraph
            body: |
              Flying Tulip's dated public record is short but has already produced several load-bearing events.
              The private SAFT opened on 14 August 2025 and closed on 29 September 2025, when the project
              publicised the $200 million raise and its perpetual-put mechanism. Between October 2025 and January
              2026 the team hardened deployment on Sonic and released ftUSD on 23 January 2026 as a delta-neutral,
              USDC-backed, opt-in yield stablecoin (approx. 6% APY on Sonic under a 1 million ftUSD initial cap).
              The public sale opened on 16 February 2026 with soft commitments reported by MEXC's TGE explainer
              to exceed $1.3 billion, and the FT token became transferable on 23 February 2026 at a $0.10 launch
              price implying a ~$1 billion FDV, quickly stabilising around the $0.10 put-implied floor. Adverse
              signals include: (i) the perpetual-put design is enforced by novel smart-contract queues and rate
              limits that create solvency and technical attack surface Lemniscap explicitly flags in its
              disclosure; (ii) FT trading behaviour around the TGE saw an initial dip to about $0.08 before
              recovering to $0.10, showing that the "guaranteed floor" was tested from day one; (iii) prediction
              markets ahead of launch gave Flying Tulip only a ~50-50 chance of holding above a $400 million FDV,
              a stark contrast with the $1 billion insider mark; (iv) Cronje's history includes his high-profile
              March 2022 exit from DeFi and past project-adjacent controversies, which regulators, journalists,
              and skeptics have flagged; and (v) DeFi regulatory posture remains hostile — the U.S. Treasury's
              2023 DeFi Illicit Finance Risk Assessment and FATF's virtual-asset guidance both explicitly cite
              DeFi protocols as high-risk for AML/CFT, sanctions, and consumer-protection enforcement.
