              Every reviewed source identifies exactly one named principal — André Cronje. No cofounder, CTO, head of
              legal, or board

              member is publicly named. The team is self-reported at ~15 people across three continents with no external
              verification.

              For a protocol pitching institutional-grade market structure, absence of a disclosed org chart is a
              first-order governance

              gap and creates real key-person risk given Cronje's history of high-profile exits and returns.
