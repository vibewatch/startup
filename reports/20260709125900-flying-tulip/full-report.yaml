      - number: '5.4'
        title: Differentiation, Trust, and Security Controls
        blocks:
          - type: paragraph
            body: >
              Flying Tulip's technical differentiation claims are (i) a unified cross-margin risk engine covering spot,
              perpetuals,

              lending, stablecoin, and insurance, (ii) the on-chain "perpetual put" backed by a segregated redemption
              reserve,

              (iii) the Witnessnet TLS-proof HTTPS oracle framework, (iv) a fixed 10B FT supply with a buyback-and-burn
              deflation

              mechanism, and (v) an on-chain resolution mechanism for binary prediction markets. Each is architecturally
              novel

              but as Chapter 3 shows, the cross-margin idea is being pursued by Hyperliquid, dYdX, and Vertex; the
              perpetual put

              is a fundraising primitive that Lemniscap describes as an experiment likely to be copied; Witnessnet's TLS
              proof

              approach is a new but not IP-protected pattern (comparable to Chainlink Functions and TLSNotary). Trust
              and safety

              posture: audited smart contracts, queue-and-rate-limited redemption, permissionless resolution for
              prediction

              markets, and the Coinspeaker press-release reference to OFAC screening and tax reporting. Adverse
              comparison

              points: Aave, Uniswap, and Ethena publish extensive audit reports (Aave's docs list multiple audit rounds;

              Uniswap's GitHub organisation shows the v4 core with independent audits; Ethena's docs describe reserve

              attestation); Flying Tulip's own audit reports are not publicly linked from docs.flyingtulip.com as of the
              run

              date, and Sherlock, Code4rena, or OpenZeppelin do not publicly list Flying Tulip audits in reviewed
              sources. That

              is the biggest single security-and-quality gap in the product-tech file.
