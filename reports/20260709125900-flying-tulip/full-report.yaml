      - number: '8.3'
        title: Exit Readiness, Final Diligence Asks, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >
              Exit readiness for Flying Tulip differs from a traditional venture holding because the FT token is already

              transferable (23 February 2026) and has a redemption floor of US$0.10 via the Perpetual PUT for
              primary-sale

              holders. Secondary-market sellers forfeit the PUT and their proceeds fund buyback-and-burn. Standard exit
              paths

              (secondary sale in liquid FT market, redemption via PUT for primary-sale holders, or eventual M&A of the
              operating

              entity) are all possible but each has different economics. Final diligence asks concentrate on the seven
              gaps

              already flagged in Risks (Chapter 7): (i) independent audit reports for reserve and cross-margin engine;
              (ii)

              named CCO and general counsel plus MiCA legal opinion; (iii) reserve venue split policy across Aave,
              Ethena, Spark;

              (iv) Sonic Labs subsidy contract terms and Cronje's Sonic-related-party disclosure; (v) named CTO / head
              of

              engineering / head of security plus bug-bounty program; (vi) team compensation schedule tied to buyback
              flow; (vii)

              auditor-reconciled public-sale settlement report and Series-A extension corroboration. Thesis-break
              triggers

              escalate from soft to hard: any SEC / CFTC enforcement letter naming Flying Tulip, any OFAC action, any
              reserve

              exploit, any Cronje departure, any Sonic subsidy withdrawal, any Aave / Ethena / Spark peg break or
              exploit, or

              FT trading below the US$0.10 put-implied floor for a sustained window would each individually justify a
              position

              exit. Historical DeFi loss data from Chainalysis and BIS's leverage/liquidity-mismatch commentary is the
              anchor

              for how quickly a redemption-run event can propagate.
