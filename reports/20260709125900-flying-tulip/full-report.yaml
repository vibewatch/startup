  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis, Anti-Thesis, and Recommendation
        blocks:
          - type: paragraph
            body: >
              The thesis for Flying Tulip is that André Cronje's reputation capital, a novel perpetual-put fundraising
              primitive

              that gives investors principal protection, a unified cross-margin super-app that no incumbent offers, a
              zero-fee

              Sonic launch subsidy, and a broad SAFT syndicate spanning macro (Brevan Howard Digital), TradFi prop
              (Susquehanna

              Crypto), crypto-native venture (CoinFund and 10 others), and market makers (DWF Labs, Selini, FalconX)
              collectively

              compound into a durable DeFi platform whose ~US$40M/yr reserve-yield stream can bootstrap protocol
              adoption without

              diluting the team. The anti-thesis is that (i) every vertical Flying Tulip enters has a specialist
              incumbent

              leading on TVL, volume, and audit maturity; (ii) the perpetual-put primitive is copyable and Lemniscap
              already

              calls the fundraise an experiment; (iii) key-person concentration on Cronje is inseparable from the Sonic
              Labs

              related-party relationship; (iv) no independent audit reports are publicly linked from
              docs.flyingtulip.com at

              run date; (v) the FDV is mechanically anchored to the reserve pool rather than any revenue metric; (vi)
              prediction

