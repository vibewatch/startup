        title: Exhibits
        blocks:
          - type: callout
            title: A fast-growing perp DEX pool anchors Flying Tulip's most differentiated product
            body: >
              Perpetual DEX volume grew about 346% year-over-year to US$6.7 trillion in 2025 and monthly perpetual DEX
              volume now ranges

              US$10-50 billion. Flying Tulip's cross-margin perp module targets exactly this pool, and it enters against
              a still-immature

              set of specialist competitors (Hyperliquid, dYdX). Coupled with Sonic's fee-subsidy runway, this is the
              market slice where

              Flying Tulip's super-app claim has the most numerical support.
            calloutType: strength
            claimRefs:
              - CM014
              - CM015
              - CM027
          - type: callout
            title: Analyst sizing dispersion means the "TAM" number you pick can be off by 7x
            body: >
              Mordor puts the 2025 DeFi market at US$188.67 billion; Grand View Research puts it at US$26.94 billion.
              Both are widely

              cited. The right anchor for underwriting Flying Tulip is on-chain observed protocol fees (US$24.9B TTM)
              and TVL (US$71.8B

              in Jun 2026), not either analyst headline. Any valuation model that uses "DeFi TAM" without a definition
              should be treated

              as unreliable.
            calloutType: risk
            claimRefs:
              - CM007
              - CM008
              - CM009
