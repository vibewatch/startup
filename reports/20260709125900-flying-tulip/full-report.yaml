      - number: '5.2'
        title: Architecture, Reserve Deployment, and Sonic Integration
        blocks:
          - type: paragraph
            body: >
              The Flying Tulip stack has five layers. Layer 1 is the redemption reserve: contributed principal from the
              SAFT and

              public sale is held in on-chain reserve contracts and deployed to external low-risk venues (the glossary
              explicitly

              names Aave v3 for conservative yield; The Block adds Ethena and Spark). Layer 2 is the cross-margin risk
              engine

              that unifies collateral across products. Layer 3 is the product suite (adaptive-curve AMM, CLOB
              perpetuals, dynamic

              -LTV money market, ftUSD/sftUSD, insurance, prediction markets). Layer 4 is Witnessnet — a
              smart-contract-verifiable

              TLS proof framework the glossary describes as letting contracts consume "AEAD-authenticated TLS records"
              and a

              valid server certificate as evidence, so any HTTPS endpoint becomes an "implicit oracle". Layer 5 is chain

              deployment: the Sonic launch chain (co-architected by Cronje) provides zero-fee subsidies, throughput, and
              initial

              capital efficiency, with Ethereum, Base, Avalanche, BNB Chain, and Solana as later deployment targets per
              The Block

              and Ventureburn. The redemption reserve is queue-and-rate-limited to protect solvency: if reserves are
              temporarily

              insufficient, requests enter a transparent queue and are processed as capital replenishes. Team
              compensation flows

              through the buyback-and-burn contract funded by backing-capital yield surplus and protocol revenue, per
              the

              glossary. The FT total supply is fixed at 10 billion pre-mint, with supply moving between circulating and

              non-circulating buckets rather than being newly minted.
