      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: >-
              Zero-team-allocation and buyback-funded compensation is one of the cleanest team-token alignment
              structures in DeFi
            body: >
              Flying Tulip's team gets no initial FT allocation; instead team members earn compensation via scheduled
              protocol-revenue

              -funded open-market buybacks. This ties team economics to actual protocol usage, is publicly disclosed in
              the official

              press release, and mitigates the classic "founder dump" risk that has hurt prior Cronje-adjacent projects.
              It is a

              structurally rare choice in DeFi.
            calloutType: strength
            claimRefs:
              - CI019
              - CI028
          - type: callout
            title: Design-target US$40M/yr yield is a fragile top line
            body: >
              The perpetual-put mechanism means the reserve principal cannot be spent; the ~US$40M/yr yield stream is
              the only

              spendable cash. If on-chain APY compresses (Ethena basis, Aave utilisation), operating runway compresses
              in lockstep.

              BIS's DeFi analysis and the U.S. Treasury 2023 risk review both flag yield volatility and liquidity
              mismatch as

              first-order DeFi financial-stability risks. Any bear-market APY squeeze is a direct governance risk.
            calloutType: risk
            claimRefs:
              - CI015
              - CI016
              - CI017
              - CI023
              - CI024
          - type: callout
            title: No S-1, no audited financials, no on-chain revenue dashboard — the diligence file is unusually thin
            body: >
              Comparable public crypto exchanges (Coinbase) publish quarterly and annual SEC filings with audited
              revenue, take rate,

              and custody disclosures. Flying Tulip has none of these; even the closest analytical parallel — a
              Dune-style on-chain

              revenue dashboard — is not yet public. That is a defensible posture pre-launch but is a hard diligence gap
              for

              underwriting the US$1B FDV.
