      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The US$1B FDV is mechanically defensible if the reserve model works as designed
            body: >
              Unlike most token launches where FDV is speculative, Flying Tulip's US$1B is directly linked to the
              deployable reserve

              pool. Every FT primary-sale holder has a Perpetual PUT redemption right at par. Provided (i) the reserve
              smart

              contracts are audited and solvent, (ii) yield venues (Aave, Ethena, Spark) hold their APY, and (iii) no
              regulator

              forces reserve unwind, the FDV is genuinely more asset-backed than any comparable DeFi token launch.
