      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The docs glossary reveals unusual technical ambition — Witnessnet TLS-proof oracles
            body: >
              The docs.flyingtulip.com glossary describes "Witnessnet" as a framework letting smart contracts verify
              HTTPS

              responses on-chain via AEAD-authenticated TLS records, valid certificates, and Finished-message
              verification —

              making "any HTTPS endpoint an implicit oracle". If it ships as documented, that is a materially more
              general

              oracle primitive than Chainlink Functions or TLSNotary and could feed both prediction markets and reserve

              attestations. It is also technically hard and not yet independently benchmarked.
            calloutType: strength
            claimRefs:
              - CE015
              - CE016
          - type: callout
            title: Fixed 10B FT supply plus buyback-and-burn is a genuinely deflationary token design
            body: >
              Per the glossary, the total FT supply is fixed at 10 billion pre-mint and does not inflate.
              Backing-capital yield

              surplus, protocol revenue, and put-invalidated released capital all flow through buyback-and-burn
              contracts that

              permanently reduce circulating supply. Combined with the redemption reserve backing every primary-issued
              FT with

              real assets, this is one of the cleanest supply designs in DeFi.
            calloutType: strength
            claimRefs:
              - CE013
              - CE014
              - CE028
          - type: callout
            title: No public audit reports at run date, in stark contrast to incumbents
            body: >
              Aave, Uniswap, and Ethena publicly link multiple third-party audit reports from their docs. Flying Tulip's
              own docs

              (docs.flyingtulip.com) do not link an audit report as of the run date; Sherlock and Code4rena do not
              publicly list

              Flying Tulip audits in reviewed public sources. Given the redemption reserve, the cross-margin engine, and
              the

              Witnessnet primitive are all novel and load-bearing, absence of public audit is the single largest
              security-and

              -quality gap in the product-tech file.
