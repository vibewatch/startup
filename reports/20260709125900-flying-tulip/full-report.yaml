          - type: callout
            title: Cross-margin capital efficiency is the moat — and it is technically copyable
            body: >
              Cronje's own framing acknowledges that specialist competitors "operate at a different capacity".
              Cross-margin capital

              efficiency is not IP-protected; Aave, Morpho, Hyperliquid, and dYdX are all publicly moving toward
              multi-collateral

              pools. The perpetual-put is novel but Lemniscap already describes it as an experiment likely to be copied.
