              At TGE the FT token traded at US$0.10, dipped to ~US$0.08, and stabilised at the put-implied floor of
              US$0.10, giving a

              ~US$1B FDV that mechanically mirrors the deployable reserve pool rather than any product metric.
              Prediction markets ahead

              of TGE gave Flying Tulip only about a 50-50 chance of holding above a US$400M FDV, and TVL at TGE was
              reported at only

              about US$126M — well below the FDV. Valuation should be underwritten as an option on Cronje plus the
              reserve's yield

              compounding, not as a revenue multiple.
