      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Flying Tulip is the only bundled super-app in DeFi
            body: >
              No reviewed incumbent covers spot + perp + lending + yield stablecoin + insurance under one cross-margin
              roof. Uniswap

              is spot; Hyperliquid and dYdX are perp; Aave, Compound, Morpho are lending; Ethena is stablecoin; Nexus
              Mutual is

              insurance. Flying Tulip's cross-margin design, if it ships as documented, is the only plausible one-stop
              super-app

              today and captures capital efficiency gains that specialist competitors cannot replicate without breaking
              their own

              product boundary.
            calloutType: strength
            claimRefs:
              - CP001
              - CP014
