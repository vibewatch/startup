companyProfile:
  summary: >-
    Flying Tulip is a decentralized finance super-app built by André Cronje that unifies spot trading, perpetual
    futures, lending, a delta-neutral yield-bearing stablecoin (ftUSD), and on-chain insurance in one cross-margin
    system. Founded in 2025, it closed a $200M seed SAFT at a $1B fully diluted token valuation on 29 September 2025
    with a broad crypto-native investor syndicate led (without a single lead) by Brevan Howard Digital, CoinFund,
    Susquehanna Crypto, DWF Labs, FalconX, Hypersphere, Lemniscap, Nascent, Republic Digital, Selini, Sigil Fund, Tioga
    Capital, and Virtuals Protocol. Every primary-sale FT token carries a Perpetual PUT redemption right; team members
    receive no initial FT allocation and are compensated through open-market buybacks funded by protocol revenue. The
    protocol launched first on Sonic Labs with initial zero-fee trading; ftUSD is live since 23 January 2026 and the FT
    token became transferable at TGE on 23 February 2026.
  foundedDate: '2025-08-14'
  founders:
    - name: André Cronje
      role: Founder
      background: >-
        Creator of Yearn Finance (July 2020) and co-architect of the Fantom Foundation and its Sonic rebrand; author of
        the 2020 Deriswap concept that Flying Tulip resurrects. Widely regarded as one of the most prolific DeFi
        builders, with a documented history of both major traction and periodic public controversy.
  foundingLocation: null
  headquarters: null
  productSummary: >-
    A unified on-chain financial system standardising pricing, credit, and risk across a suite of five products —
    adaptive-curve spot AMM, cross-margin CLOB perpetuals, dynamic-LTV money market, ftUSD / sftUSD delta-neutral yield
    stablecoin, and on-chain insurance — plus binary prediction markets resolved via a novel Witnessnet TLS-proof HTTPS
    oracle framework. Fixed 10 billion FT total supply with a Perpetual PUT redemption right on primary-sale FT plus a
    buyback-and-burn mechanism funded by reserve yield and protocol revenue.
  customerFocus: >-
    Retail traders, on-chain liquidity providers, DAO treasuries, institutional prop-market makers, and DeFi protocol
    integrators.
  businessModel: >-
    Reserve principal (up to $1B) is deployed to Aave, Ethena, and Spark at a design-target ~4% APY (~$40M/yr), funding
    operating costs, incentives, and FT buybacks. Layer-two protocol revenue comes from trading fees, lending spreads,
    ftUSD yield capture, liquidation penalties, and insurance premiums once the Sonic zero-fee subsidy window ends.
  stage: Seed
  fundingStatus: >-
    $200M private SAFT closed 29 Sep 2025 at $1B FDV; up to $800M planned public sale opened 16 Feb 2026 at same $1B
    FDV; TGE 23 Feb 2026 at $0.10/FT. MEXC-only reporting cites public-sale soft commitments over $1.3B and a $25.5M
    Series-A extension from Amber Group, Fasanara Digital, and Paper Ventures plus a $50M Impossible Finance Curated
    tranche.
  disclosureProfile: stealth
