      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >
              Flying Tulip's "user" and "payer" often coincide inside the smart contract, but the diligence-relevant
              segmentation

              still splits cleanly. Retail traders (Mordor: 62.12% of 2025 DeFi market share) are the largest volume
              segment; they

              pay implicit fees via bid-ask spread, funding rate, and swap fees, and their adoption trigger is UX (a
              "super app"

              that avoids bridging across protocols). Liquidity providers (LPs) and market makers are the "payer" of
              protocol

              revenue in the sense that they earn or forgo swap fees; institutional prop-market makers (Susquehanna
              Crypto, Selini,

              DWF Labs) also appear as investors in Flying Tulip's SAFT, blurring the incentive line. DAO treasuries and
              institutional

              asset managers (Mordor: 32.55% CAGR through 2031) increasingly use DeFi lending and stablecoin yield
              venues as

              cash-management tools; ftUSD's opt-in yield (~6% APY) directly targets this segment. Protocol integrators
              (other

              DeFi protocols using Flying Tulip primitives as building blocks) are the fourth segment. The adoption path
              across

              segments is: (i) LPs and market makers seed liquidity for zero-fee trading on Sonic; (ii) retail traders
              arrive to

              capture zero-fee spot and levered perps; (iii) DAO treasuries and small institutions park stablecoin
              capital in

              sftUSD for yield; (iv) integrators embed ftUSD as settlement collateral. Budget ownership sits with the
              token holder,

              trading counterpart, or DAO treasurer, not a traditional procurement function.
            claimRefs:
