  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >
              Flying Tulip's product scope forces an unusually wide market boundary. On the trading axis it competes
              with spot

              DEXs (Uniswap, Curve, PancakeSwap) and perpetual DEXs (Hyperliquid, dYdX, GMX); on the lending axis with
              Aave,

              Compound, and Morpho; on the stablecoin axis with USDC, USDT, DAI, and yield-bearing peers like Ethena's
              USDe;

              and on the on-chain insurance axis with Nexus Mutual and Sherlock. It also competes on the aggregation
              axis with

              centralized exchanges (Coinbase, Binance) that Cronje himself named as holistic competitors in press
              coverage.

              The right market boundary for underwriting Flying Tulip is therefore not "DeFi" writ large but the
              intersection of

              (1) on-chain trading, (2) collateralised lending, and (3) yield-bearing dollar liquidity, together roughly
              captured

              by DeFiLlama's DEX + lending + stablecoin categories. Excluded from the boundary are pure NFT
              marketplaces, prediction

              markets, and off-chain crypto derivatives cleared through centralized venues. The status-quo substitute is

              centralized-exchange (CEX) trading with off-chain custody, which still dominates settled volume;
              Chainalysis and

              Reuters data show CEX-to-DEX spot ratios only recently closing to a 5:1 range in 2025-2026. This
              substitute set is

              the correct denominator when reasoning about Flying Tulip's addressable spend, because most retail and
              institutional

              trading flows still originate on centralized rails.
            claimRefs:
              - CM001
              - CM002
