      - number: '2.4'
        title: Growth Drivers, Adoption Constraints, and Gaps
        blocks:
          - type: paragraph
            body: >
              The dominant tailwind is the arrival of institutional and regulated flows: the EU's Markets in
              Crypto-Assets (MiCA)

              framework, U.S. spot Bitcoin ETFs, and stablecoin settlement pilots by traditional banks are pulling
              institutional

              capital into compliant on-chain channels; Mordor attributes about +7.2% of forecast CAGR to that single
              driver.

              Layer-2 fee compression and Sonic-class high-throughput chains reduce switching cost for retail traders.
              Perpetual

              DEX growth (about 346% YoY per Thrive) shows that on-chain derivatives are the fastest-growing sub-segment
              and the

              one where Flying Tulip's cross-margin design is most differentiated. On the headwind side, the U.S.
              Treasury's 2023

              DeFi Illicit Finance Risk Assessment and FATF's virtual-asset guidance both single out DeFi protocols for
              AML/CFT,

              sanctions, and consumer-protection concern, and SEC enforcement against DeFi projects (issuance, staking,
              unregistered

              exchanges) remains active. Smart-contract risk is chronic: Chainalysis's 2024 crime report documented
              multi-billion-

              dollar DeFi hacks concentrated in cross-chain bridges and lending protocols; Flying Tulip's cross-margin
              design

              concentrates far more attack surface than a single-product DEX. Switching cost is high because incumbent
              AMM liquidity

              is deep and sticky (Uniswap dominates spot DEX volume; Curve dominates stablecoin swaps; Aave dominates
              lending).

              Preserved diligence gaps: (i) the true addressable spend for a unified super-app is not directly
              measurable because

              no analyst reports track that specific bundle; (ii) Grand View Research's US$26.94B 2025 base and Mordor's
              US$188.67B

              2025 base disagree by roughly 7x; (iii) MEXC's US$1.3B public-sale soft-commitment figure lacks a second
              corroborating

              source.
