  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Recognition
        blocks:
          - type: paragraph
            body: >
              Flying Tulip's revenue model is a two-layer construct. Layer one is the reserve-yield stream: Cronje told
              The Block

              that up to US$1 billion of raised principal is deployed into on-chain yield venues (Aave, Ethena, Spark)
              at an

              approximately 4% target APY, producing a design-target US$40 million per year of yield that is not
              customer revenue

              in an accounting sense but is the sole spendable cash inflow while the perpetual-put remains active. Layer
              two is

              the protocol-level revenue Cronje enumerates in press interviews and the BSC News overview: trading and
              lending fees,

              liquidation penalties, ftUSD yield capture, and on-chain insurance premiums. None of layer-two revenue is

              independently verifiable at the run date because the FT token has only been transferable since 23 February
              2026,

              Sonic launch trading is subsidised to zero fee, and Flying Tulip has not published on-chain revenue
              dashboards or a

              Dune-style analytics disclosure comparable to Uniswap Labs or Aave. Recognition is therefore best treated
              as

              "reserve yield accounted as buyback fuel + protocol-fee revenue capitalised into token buybacks", not GAAP
              revenue.

              For diligence purposes the Coinbase 10-K SEC filing chain is the nearest analogue for how a public crypto
              exchange

              recognises trading fees, stablecoin float income, and custody revenue — Flying Tulip's mix will look
              similar in

              structure but with a fully on-chain fee capture rather than fiat-onramp fees, and with the redemption
              reserve as

              an unusually large non-operating capital pool.
