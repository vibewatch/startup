  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >
              Flying Tulip's regulatory perimeter is unusually wide. In the U.S., the SEC Enforcement Division's ongoing
              "important

              initiatives" surface targets crypto issuances, staking, and unregistered exchanges; a SAFT sold to
              non-accredited

              U.S. persons plus a global public sale plus a perpetual-put option that arguably functions as an
              investment

              contract combines multiple risk vectors under Howey. CFTC July 2026 press releases already cite active
              enforcement

              of foreign exchanges transacting with U.S. customers, a directly relevant precedent for a global on-chain
              super-app.

              In the EU, MiCA's requirements on crypto-asset service providers, stablecoin issuers, and reserve
              attestation apply

              once ftUSD circulates to EU persons; Coinspeaker referenced OFAC screening and tax reporting features, but
              the

              compliance stack is not publicly named. Internationally, FATF's virtual-asset guidance imposes travel-rule
              and

              VASP-style expectations that permissionless DeFi does not naturally satisfy, and the U.S. Treasury's 2023
              DeFi

              Illicit Finance Risk Assessment explicitly warns that DeFi protocols evade AML/CFT and sanctions controls.
              The

              benchmark precedent is the August 2022 OFAC sanctioning of the Tornado Cash smart contracts, subsequently
              partially

              unwound by a November 2024 U.S. federal appeals court decision (per Wikipedia's dossier). That case
              establishes

              both the willingness of U.S. authorities to sanction protocol code and the appellate resistance to that
              approach —

              a live legal ambiguity Flying Tulip inherits.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
