            body: >
              MEXC's TGE post noted that prediction markets gave Flying Tulip only about a 50-50 chance of trading above
              a US$400M

              FDV pre-launch, well below the US$1B insider mark. That is a rare, independent, market-priced adverse
              signal. The

              base case therefore should not be the US$1B anchor but a probability-weighted mix skewed toward the
              reserve-mechanic

              floor.
