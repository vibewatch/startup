          detail: Investor diligence requires reconciled customer, cohort, and concentration data.
          touchpoints: [Active-account definition, Named references, Concentration schedule]
    claimRefs: [CU001, CU002, CU007, CU008, CU010, CU012, CU013]
callouts:
