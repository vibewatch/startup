schemaVersion: "report-v2"
artifact: customers
slug: konfio
runDate: 2026-10-22
company:
  name: Konfío
chapter:
  number: 6
  title: Customers
  summary: Konfío targets underserved Mexican SMEs with digitally originated working-capital finance and an expanding financial-services bundle. Public evidence supports reach into first-time formal borrowers and some customer segmentation, but it does not establish current active accounts, retention, outcomes, or concentration.
sections:
  - id: customer-segments
    title: Buyer and user segments
    body: >-
      The available evidence consistently places Konfío in Mexican small-business finance rather than consumer lending. Triodos describes working-capital loans for small and medium-sized enterprises and identifies a large addressable SME population with limited formal-credit access. VEF adds useful segmentation detail: sole proprietors represent 41% of the described customer base, women-owned businesses 30%, and owners under 34 17%; the source does not state the measurement date or denominator beyond its customer description. This supports a thesis centered on underbanked micro and small businesses, but it does not establish the current mix by industry, geography, payer, or revenue band. The segmentation table therefore separates what the sources actually disclose from the fields an investor would still need to test.
    claimRefs: [CU001, CU003, CU004, CU005, CU006]
    tableRefs: [TU001]
  - id: adoption-and-proof
    title: Adoption trajectory and named proof
    body: >-
      Konfío has evidence of meaningful historical distribution, but the quality of proof varies. IDB Invest describes a proposed facility to purchase loans originated through Konfío for MSMEs and entrepreneurial activities, which is stronger evidence of an institutional financing channel than a logo or marketing claim. Kaszek says the network had connected a large portion of the market and provided working-capital loans to tens of thousands of businesses during the period described, while the 2026 syndicated company release says thousands of businesses used flexible financing during COVID-19. These statements indicate scale and use cases, not current active customers, repeat usage, production outcomes, or net retention. No assigned source names an end-customer organization or provides a measured before/after operating outcome, so the named-proof table records that limitation rather than converting investor or lender references into customer case studies.
    claimRefs: [CU007, CU008, CU009, CU010, CU011]
    tableRefs: [TU002, TU003]
    figureRefs: [FU001]
  - id: durability-and-expansion
    title: Retention, expansion, and concentration
    body: >-
      The product bundle creates a plausible expansion path from working-capital credit into cards, point-of-sale payments, software, and potentially banking services. The assigned evidence supports the existence of those offerings, but it does not disclose customer-level conversion, renewal, churn, gross or net retention, contract duration, utilization, contribution margin, or cross-sell rates. Similarly, there is no current top-customer list, revenue concentration table, channel share, or partner dependency schedule. The customer thesis should therefore distinguish product breadth from demonstrated land-and-expand behavior. A diligence process should request cohort-level repayment and renewal data, product attach rates, customer concentration by revenue and exposure, and evidence that new banking services deepen relationships without increasing credit or operational risk.
    claimRefs: [CU008, CU011, CU012, CU013, CU014, CU015]
    callouts:
      - calloutType: risk
        title: Durability is not publicly demonstrated
        body: Public sources support historical reach and a broad SME proposition, but no assigned source supplies current retention, churn, renewal, or concentration metrics.
        claimRefs: [CU012, CU013, CU014, CU015]
  - id: customer-diligence
    title: Investor interpretation and diligence path
    body: >-
      The customer evidence is directionally positive on problem selection and historical access expansion, yet incomplete on economic durability. Konfío appears positioned to serve businesses that traditional lenders have not consistently reached, and institutional financing records show that its origination model has been financeable. The main diligence question is whether historical acquisition and credit access translate into profitable, repeat customer relationships across cycles. Before underwriting a stronger customer conclusion, an investor should reconcile the date and denominator for all customer counts, obtain active-account and repeat-borrower definitions, inspect vintage performance and recoveries, and map revenue and credit exposure by customer, vertical, geography, channel, and product. Adverse diligence should also test failed pilots, complaints, declined renewals, and any concentration created by institutional or platform partners.
    claimRefs: [CU003, CU007, CU012, CU013, CU014, CU015]
    callouts:
      - calloutType: recommendation
        title: Treat customer traction as promising but unproven
        body: The evidence supports tracking Konfío's SME reach while withholding a stronger adoption or retention conclusion until current cohort and concentration data are provided.
        claimRefs: [CU007, CU012, CU013, CU014, CU015]
