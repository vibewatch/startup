      - [Underserved SMEs and sole traders, Mexican small businesses, Unsecured loans and access to formal financing, Customer segment described by an investor, Access inclusion is asserted, No customer name or measured business outcome, "SU008; SU002"]
      - [SMEs using corporate cards and point-of-sale services, Mexican SMEs, Broader financial-services bundle, Product availability described by company-issued material, Product expansion is asserted, "No named deployment, attach rate, or retention metric", "SU004; SU006"]
    enumerationScope:
      coverage: partial
      basis: "Partial public sample of customer and counterparty evidence found in the assigned 2026 refresh pool; no exhaustive customer list is disclosed."
    notes: "The assigned pool contains no independently named end-customer case study; institutional counterparties and broad segments are not substitutes for customer references."
    claimRefs: [CU007, CU008, CU010, CU011]
