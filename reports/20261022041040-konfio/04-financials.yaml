callouts:
  - calloutType: strength
    title: "Multiple monetization surfaces"
    body: "Credit, cards, payments, and a described accounting platform create potential cross-sell and revenue diversification, although public disclosures do not quantify mix or realized margin."
    claimRefs: [CI001, CI003, CI004]
  - calloutType: risk
    title: "Portfolio economics are the underwriting blocker"
    body: "Current delinquency, charge-offs, recoveries, reserve methodology, cost of funds, and liquidity headroom are not disclosed in the assigned public evidence."
    claimRefs: [CI008, CI014, CI015]
  - calloutType: recommendation
    title: "Require reconciled management accounts"
    body: "Before underwriting valuation or runway, reconcile originations, active borrowers, revenue by stream, facility balances, cash, burn, and vintage-level credit performance."
    claimRefs: [CI009, CI010, CI014, CI015]

