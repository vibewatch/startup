schemaVersion: "report-v2"
artifact: financials
slug: konfio
runDate: 2026-10-22
company:
  name: "Konfío"
chapter:
  number: 4
  title: Financials
  summary: "Public evidence supports a multi-product SME-finance model built around interest income, payments, and card economics, with approximately MXN 11 billion of loan originations reported in May 2026 and company-claimed profitability since 2024. The underwriting case remains constrained by missing current financial statements, portfolio-quality vintages, realized pricing, funding costs, and liquidity disclosures."
sections:
  - id: revenue-model
    title: Revenue model and monetization
    body: "Konfío's public model is primarily credit-led, with adjacent payment products. A 2023 investor-backed profile describes interest revenue from credit lines and interchange revenue from business cards and point-of-sale terminals, while reporting a 31.6% average APR on a line-of-credit product, a 67.4% APR on its business card, and card-terminal commissions of 1.35% to 3.5% plus VAT. Those are reported list or average pricing figures, not realized yield, net revenue, or contribution margin. The 2026 PesoMXN article says Konfío originated about MXN 11 billion in loans over the prior year and kept payments as a complement to its business focus. This combination suggests a revenue bridge from SME borrowing and payment activity, but public material does not disclose product mix, average balances, fee waivers, funding spread, or accounting recognition. Official and investor descriptions also place software and payments alongside lending, so the underwriting request should separate recurring software fees, transaction revenue, interest income, and ancillary fees rather than assume a SaaS-like ARR model."
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: efficiency-and-costs
    title: Sales efficiency, credit costs, and operating leverage
    body: "The available evidence supports digital origination and data-driven risk analysis, but not a complete unit-economics calculation. ReadEmergent reports rapid digital credit decisions, a portfolio of 45,000 loans to more than 27,600 SMEs, and a broader count of 70,000 businesses supported; those denominators and dates are not aligned enough to derive conversion, repeat borrowing, or revenue per account. IDB Invest records a proposed USD 40 million equivalent facility to a trust purchasing loans originated by Konfío, indicating that warehouse or structured funding has been part of the operating model, but the public record does not provide the facility's current utilization, pricing, advance rate, covenants, or loss allocation. The 2026 PesoMXN source says the company uses transactional data and risk analysis and claims profitability since 2024; that remains company-reported and is not an audited margin disclosure. Cost of capital, acquisition spend, servicing expense, collections performance, charge-offs, recoveries, and reserve methodology are therefore the key missing inputs to any CAC/payback or contribution-margin model."
    claimRefs: [CI005, CI006, CI007, CI008]
    tableRefs: [TI003]
  - id: traction-and-capital
    title: Public traction and capital adequacy
    body: "Public traction is meaningful but financially incomplete. ReadEmergent reports 45,000 loans to more than 27,600 SMEs, 70,000 businesses and SMEs supported, and 25% year-over-year growth for SME clients. These figures are historical or source-dated rather than a current audited operating snapshot, and the source does not reconcile them to revenue, outstanding principal, active customers, or cash generation. The 2026 PesoMXN article reports approximately MXN 11 billion of loan originations over the prior year, while Kaszek describes a network that has given working-capital access to tens of thousands of businesses and includes an accounting platform and B2B payments. Originations are loan production, not revenue or cash available. The capital picture remains opaque: the latest public materials do not disclose cash on hand, monthly burn, runway, debt balances, refinancing dates, or current facility headroom. The banking-license application described by company-issued 2026 releases could expand funding and deposit options if approved, but it also raises capital, governance, operational-resilience, and regulatory-readiness requirements."
    claimRefs: [CI009, CI010, CI011, CI012]
  - id: financial-verdict
    title: Underwriting verdict and diligence blockers
    body: "The financial profile merits continued diligence but is not underwritable on public evidence alone. The positive case is a focused SME segment, multiple monetization surfaces, institutional financing relationships, reported lending scale, and a company-claimed transition to profitability. The negative case is equally material: a low-reputation adverse page labels Konfío a unit-economics failure but supplies no supporting analysis in the fetched text, so the allegation is a diligence signal rather than a verified conclusion. Separately, the World Economic Forum describes the first product as a fixed-installment term loan capped at USD 50,000. The available evidence does not establish net interest margin, portfolio yield after losses, delinquency by vintage, cost of funds, or free cash flow. A bank transition may improve product breadth and funding resilience, but it can increase fixed compliance and control costs before deposits or treasury revenue scale. A financing decision should require current management accounts, reconciled originations and active-account data, portfolio vintage curves, reserve and recovery schedules, facility documents, liquidity forecasts, and a downside scenario for rates, defaults, and funding access."
    claimRefs: [CI009, CI013, CI014, CI015, CI016]

tables:
  - id: TI001
    title: Revenue streams
    columns: [Stream, Mechanism, Unit or pricing signal, Current public status, Quality, Diligence ask]
    rows:
      - [Working-capital credit, "Interest on lines and term loans", "31.6% average APR reported in 2023 profile", "Core product; current mix unavailable", "Third-party reported; historical", "Current effective yield, balances, funding spread, and loss-adjusted margin"]
      - [Business credit card, "Interest and interchange", "67.4% APR reported in 2023 profile", "Product described; realized economics unavailable", "Third-party reported; historical", "Active cards, spend, revolvers, interchange share, and charge-offs"]
      - [Payment terminal, "Transaction commission", "1.35%-3.5% plus VAT reported in 2023 profile", "Payments retained as complement in 2026 coverage", "Third-party reported plus current press coverage", "Volume, take rate, processor costs, refunds, and contribution margin"]
      - [Software / accounting, "SaaS or bundled platform revenue", null, "Kaszek describes an accounting platform", "Investor description; pricing unknown", "Contracts, standalone revenue, retention, and gross margin"]
    notes: "Pricing figures are reported product APRs or commissions, not realized revenue, net yield, or margin; null means no public value was found in the assigned sources."
    claimRefs: [CI001, CI002, CI003, CI004]
  - id: TI002
    title: Pricing and monetization evidence
    columns: [Product, Price or contract signal, List versus realized, Discount or unknown, Implication]
    rows:
      - [Credit line, "31.6% average APR", "Reported average product APR", "Customer-specific pricing and funding cost unknown", "Revenue quality depends on losses and cost of funds"]
      - [Business credit card, "67.4% APR", "Reported product APR", "Utilization, revolver mix, and waivers unknown", "High nominal price does not establish contribution margin"]
      - [Payment terminal, "1.35%-3.5% plus VAT commission", "Reported commission range", "Volume tiers and processor economics unknown", "Transaction scale and net take rate require verification"]
      - [Banking services, "No public price found", "Unavailable", "License timing and future deposit/treasury pricing unknown", "Do not model deposit economics before approval and launch evidence"]
    notes: "The table separates published or reported price signals from realized revenue. Unknown values are diligence gaps, not zeroes."
    claimRefs: [CI001, CI002, CI003, CI016]
  - id: TI003
    title: Unit economics and underwriting inputs
    columns: [Metric, Public value or null, Confidence, Why it matters, Diligence ask]
    rows:
      - [Loan originations, "About MXN 11 billion over the prior year", medium, "Measures production but not revenue or cash conversion", "Reconcile by product, cohort, currency, and period"]
      - [Loans issued, "45,000", medium, "Signals historical activity", "Reconcile with outstanding principal, repeat loans, and repayment status"]
      - [SMEs reached through loans, "More than 27,600", medium, "Provides a historical borrower denominator", "Define active borrower, geography, and date"]
      - [Cost of funds, null, low, "Determines spread and liquidity sensitivity", "Provide facility rates, fees, hedges, and weighted-average cost"]
      - [CAC / payback, null, low, "Tests whether digital distribution scales profitably", "Provide acquisition spend, funded conversion, repeat rate, and gross contribution"]
      - [Vintage loss and recovery, null, low, "Determines risk-adjusted yield", "Provide delinquency, charge-off, recovery, and reserve curves by cohort"]
    notes: "Public quantities are not normalized to one period or denominator. Null fields are unavailable private evidence and each requires the specified diligence request."
    claimRefs: [CI005, CI006, CI007, CI008, CI009, CI010, CI014]

