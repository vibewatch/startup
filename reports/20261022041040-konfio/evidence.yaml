evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A current executive, board, committee, and succession register with appointment dates and responsibilities.
    whyItMatters: Key-person dependence and control readiness cannot be assessed from founder mentions alone.
    diligencePath: >-
      Request the current organizational chart, board minutes or roster, committee mandates, and executive employment or
      succession disclosures.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: Current revenue, product mix, spread and fee economics, audited profitability, and cash position.
    whyItMatters: Funding raised and historical valuation do not establish current operating performance or liquidity.
    diligencePath: >-
      Obtain audited financial statements, management accounts, product-level contribution margins, and a current
      cash-and-debt schedule under NDA.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: minor
    topic: identity
    missingEvidence: A primary incorporation record or dated company chronology reconciling 2013 and 2014 founding references.
    whyItMatters: The discrepancy changes age-at-funding and milestone interpretation.
    diligencePath: Request the incorporation certificate, operating-launch record, and an authoritative company timeline.
    relatedQuestionRefs:
      - QO002
  - type: stale
    severity: material
    topic: banking-license
    missingEvidence: Current status, conditions, expected timing, and governance requirements for the banking-license application.
    whyItMatters: License conversion could materially change funding, compliance, liquidity, and operating-risk assumptions.
    diligencePath: >-
      Obtain written confirmation from Konfío or the relevant Mexican authority and review the implementation plan for
      capital, risk, AML, and treasury controls.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO003
  - type: access-blocked
    severity: minor
    topic: adverse
    missingEvidence: Readable, source-attributed detail behind the adverse unit-economics assessment.
    whyItMatters: The existence of an adverse title is a diligence signal but cannot quantify losses or prove failure.
    diligencePath: >-
      Obtain the underlying analysis or corroborate its allegations against cohort loss, delinquency, recovery, and
      reserve data.
    relatedQuestionRefs:
      - QO007
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      A current, independently sourced Mexican MSME financial-services market estimate split by product, geography, and
      eligible borrower.
    whyItMatters: The broad SME universe and historical facility do not establish current SAM, SOM, or a market-share forecast.
    diligencePath: >-
      Obtain current origination, eligibility, product-mix, and independent market-spend data, then reconcile top-down
      and bottom-up sizing.
    relatedQuestionRefs:
      - QM004
      - QM008
      - QM010
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: economics-gap
    missingEvidence: Current cohort-level approval, utilization, delinquency, loss, recovery, and contribution-margin data.
    whyItMatters: Adoption may be real while risk-adjusted economics remain unattractive or uneven across segments.
    diligencePath: >-
      Request vintage-level portfolio tapes, reserve methodology, pricing, funding cost, recoveries, and segment-level
      contribution margins.
    relatedQuestionRefs:
      - QM007
      - QM008
    relatedTableRefs:
      - TM003
  - type: stale
    severity: minor
    topic: banking-license
    missingEvidence: Current official status, scope, and timetable for the reported banking-license application.
    whyItMatters: >-
      A license could change the buyer, payer, and product boundary, but an application alone does not demonstrate
      approval or readiness.
    diligencePath: Verify status with the relevant Mexican authority and obtain the approved operating scope and implementation plan.
    relatedQuestionRefs:
      - QM009
  - type: access-blocked
    severity: minor
    topic: formal-finance-access
    missingEvidence: The full Mack Meyer analysis beyond the accessible excerpt.
    whyItMatters: >-
      The excerpt supports the access-gap thesis but cannot independently validate the author's broader market
      conclusions.
    diligencePath: Review the full article or replace it with an accessible independent study of Mexican SME credit access.
    relatedQuestionRefs:
      - QM001
      - QM007
  - type: missing-source
    severity: material
    topic: comparator-data
    missingEvidence: >-
      Named Mexican SME lenders, incumbent banks, card providers, and payment processors with current pricing, approval,
      loss, retention, and distribution metrics.
    whyItMatters: >-
      Without matched peer evidence, Konfío’s claimed access and product breadth cannot be translated into a relative
      moat or valuation advantage.
    diligencePath: >-
      Build a peer pack from current official pricing, regulatory filings, customer references, and matched
      mystery-shopper or procurement evidence.
    relatedQuestionRefs:
      - QP002
      - QP004
      - QP008
    relatedTableRefs:
      - TP001
      - TP002
      - TP003
  - type: missing-source
    severity: material
    topic: switching-cost
    missingEvidence: >-
      Product-level retention, cross-sell, provider overlap, migration duration, and customer churn by lending, cards,
      payments, and banking workflows.
    whyItMatters: >-
      Product breadth only creates durable economics if customers consolidate activity or face meaningful migration
      friction.
    diligencePath: Request cohort retention and attach-rate data, then interview churned and multi-homed SMEs.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP003
  - type: stale
    severity: material
    topic: regulation
    missingEvidence: >-
      Current banking-license status, approval conditions, capital requirements, implementation milestones, and
      control-readiness evidence as of the report date.
    whyItMatters: >-
      The charter could expand distribution and product depth, but delay or failure could leave Konfío exposed to
      specialist lenders and incumbent response.
    diligencePath: >-
      Verify the application and authorization record with Mexican financial authorities and obtain management’s
      implementation plan.
    relatedQuestionRefs:
      - QP006
      - QP009
  - type: missing-source
    severity: material
    topic: adverse
    missingEvidence: >-
      Independent current evidence on competitor displacement, Konfío unit economics, credit performance, or customer
      complaints.
    whyItMatters: >-
      A single adverse source title is insufficient to assess whether the business has a structural economics problem or
      merely an execution risk.
    diligencePath: >-
      Obtain independent portfolio-performance data, adverse customer evidence, and current peer responses before
      upgrading the competitive view.
    relatedQuestionRefs:
      - QP007
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: >-
      Current product-level revenue, effective yield, funding cost, charge-offs, recoveries, reserves, and contribution
      margin by cohort.
    whyItMatters: Nominal APR and origination volume cannot establish risk-adjusted profitability or cash generation.
    diligencePath: >-
      Obtain monthly management accounts and vintage-level portfolio files, then reconcile revenue to principal, fees,
      losses, and funding expense.
    relatedQuestionRefs:
      - QI004
      - QI006
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: Cash balance, burn, runway, debt schedule, facility covenants, utilization, and refinancing calendar.
    whyItMatters: A lending platform can appear scaled while liquidity or warehouse capacity remains the binding constraint.
    diligencePath: >-
      Review treasury forecast, lender agreements, borrowing-base reports, covenant certificates, and downside liquidity
      scenarios.
    relatedQuestionRefs:
      - QI005
      - QI006
  - type: stale
    severity: material
    topic: traction
    missingEvidence: A current reconciliation of originations, active borrowers, outstanding principal, revenue, and customer counts.
    whyItMatters: Public metrics have different dates and denominators and cannot be safely combined into current growth or ARR.
    diligencePath: Request a dated KPI bridge from the latest month-end back to the prior reportable periods.
    relatedQuestionRefs:
      - QI003
  - type: missing-source
    severity: material
    topic: regulatory
    missingEvidence: The current status, conditions, timeline, and capital plan for the banking-license application.
    whyItMatters: License timing changes both the funding thesis and the cost and control burden.
    diligencePath: >-
      Obtain the application status, regulator correspondence, target operating model, and implementation budget under
      confidentiality.
    relatedQuestionRefs:
      - QI007
  - type: missing-source
    severity: material
    topic: reliability
    missingEvidence: >-
      Production uptime, incident history, recovery objectives, implementation timelines, and integration service
      levels.
    whyItMatters: A digital financial platform's operational resilience affects customer trust and regulated-service readiness.
    diligencePath: Request twelve-month SLO and incident reports, architecture runbooks, RTO/RPO tests, and integration contracts.
    relatedQuestionRefs:
      - QE005
      - QE010
  - type: private-evidence-only
    severity: material
    topic: trust-controls
    missingEvidence: Security, privacy, model-governance, and banking-control artifacts.
    whyItMatters: The planned deposit and treasury surface raises control requirements beyond lending and payments.
    diligencePath: >-
      Obtain SOC or ISO evidence, penetration-test summaries, privacy impact assessments, model-validation packs, and
      license-readiness workpapers.
    relatedQuestionRefs:
      - QE009
      - QE010
  - type: missing-source
    severity: minor
    topic: product-maturity
    missingEvidence: Module-level adoption, activation, attach, retention, and production-versus-pilot status.
    whyItMatters: A broad product catalog does not prove usage, integration depth, or commercial durability.
    diligencePath: Request product analytics by module, cohort definitions, customer references, and roadmap delivery history.
    relatedQuestionRefs:
      - QE002
      - QE007
  - type: missing-source
    severity: blocking
    topic: retention
    missingEvidence: >-
      Current cohort-level renewal, churn, repayment, and repeat-borrower data segmented by product and origination
      vintage.
    whyItMatters: Historical reach does not establish durable customer economics or credit-cycle resilience.
    diligencePath: >-
      Request monthly cohort files with active accounts, renewals, repeat borrowing, delinquency, recoveries, and
      product attach rates.
    relatedQuestionRefs:
      - QU005
  - type: enumeration-incomplete
    severity: material
    topic: named-proof
    missingEvidence: At least three independently verifiable named customer deployments with production status and measured outcomes.
    whyItMatters: Institutional financing and broad segment descriptions do not prove end-customer value realization.
    diligencePath: Obtain consented customer references, contracts or procurement records, and before/after operating metrics.
    relatedQuestionRefs:
      - QU004
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: concentration
    missingEvidence: Customer and channel concentration by revenue, receivables, outstanding principal, and partner originations.
    whyItMatters: A concentrated book or acquisition channel could make growth and credit performance fragile.
    diligencePath: Request top-10 and top-25 customer and partner concentration schedules with definitions and period-end dates.
    relatedQuestionRefs:
      - QU007
  - type: stale
    severity: material
    topic: customer-count
