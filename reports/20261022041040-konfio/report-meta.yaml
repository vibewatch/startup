companyProfile:
  summary: >-
    Konfío is a Mexican fintech serving small and medium-sized businesses with digital credit and an expanding set of
    card, payments, software, and financial-service products. The evidence supports meaningful institutional financing
    and product breadth, but public disclosures do not establish current profitability, credit-vintage performance, or
    the economics and controls required for a broader banking model.
