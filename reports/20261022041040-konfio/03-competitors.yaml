  evidenceGaps:
    - type: missing-source
      severity: material
      topic: comparator-data
      missingEvidence: Named Mexican SME lenders, incumbent banks, card providers, and payment processors with current pricing, approval, loss, retention, and distribution metrics.
      whyItMatters: Without matched peer evidence, Konfío’s claimed access and product breadth cannot be translated into a relative moat or valuation advantage.
      diligencePath: Build a peer pack from current official pricing, regulatory filings, customer references, and matched mystery-shopper or procurement evidence.
      relatedQuestionRefs: [QP002, QP004, QP008]
      relatedTableRefs: [TP001, TP002, TP003]
    - type: missing-source
      severity: material
      topic: switching-cost
      missingEvidence: Product-level retention, cross-sell, provider overlap, migration duration, and customer churn by lending, cards, payments, and banking workflows.
      whyItMatters: Product breadth only creates durable economics if customers consolidate activity or face meaningful migration friction.
      diligencePath: Request cohort retention and attach-rate data, then interview churned and multi-homed SMEs.
      relatedQuestionRefs: [QP005]
      relatedTableRefs: [TP003]
    - type: stale
      severity: material
      topic: regulation
      missingEvidence: Current banking-license status, approval conditions, capital requirements, implementation milestones, and control-readiness evidence as of the report date.
      whyItMatters: The charter could expand distribution and product depth, but delay or failure could leave Konfío exposed to specialist lenders and incumbent response.
      diligencePath: Verify the application and authorization record with Mexican financial authorities and obtain management’s implementation plan.
      relatedQuestionRefs: [QP006, QP009]
    - type: missing-source
      severity: material
      topic: adverse
      missingEvidence: Independent current evidence on competitor displacement, Konfío unit economics, credit performance, or customer complaints.
      whyItMatters: A single adverse source title is insufficient to assess whether the business has a structural economics problem or merely an execution risk.
      diligencePath: Obtain independent portfolio-performance data, adverse customer evidence, and current peer responses before upgrading the competitive view.
      relatedQuestionRefs: [QP007]
