        - label: Substantiated adverse analyses
          value: 0
          unit: retained analyses
          detail: "The adverse page contributes a title but no supporting body text."
    approximationNotes: >-
      Counts describe disclosure in this chapter's eight-source retained set, not the broader public record or an assertion that the underlying business metric is zero.
    claimRefs: [CP003, CP006, CP011, CP012]
