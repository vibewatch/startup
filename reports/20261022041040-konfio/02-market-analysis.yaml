company:
  name: Konfío
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Konfío addresses a documented access-to-formal-finance gap among Mexican
    micro, small, and medium enterprises, using digital underwriting and a
    broader financial-services bundle. The evidence supports a large market
    boundary, but public sources do not isolate a current Konfío SAM or SOM,
    and several available market figures are company- or partner-originated.
sections:
  - id: market-boundary
    title: Market boundary and status quo
    body: >-
      The defensible market boundary is Mexican MSME financial services: formal
      working-capital and term lending, business payments, and adjacent
      operating tools such as accounting software. IDB Invest describes Konfío
      as an online platform helping micro, small, and medium enterprises access
      formal financing through technology, data science, and digital
      transactions. That boundary excludes consumer lending, large-enterprise
      treasury, and general-purpose banking spend unless a product is explicitly
      used by an MSME. The status quo is not only another fintech: traditional
      banks, manual documentation, informal credit, delayed approvals, and
      self-financed working capital are substitutes. The available evidence
      indicates that the initial wedge is underserved formal credit, while
      payments and software increase the addressable workflow rather than prove
      a larger monetizable market.
    claimRefs: [CM001, CM002, CM003, CM004, CM006, CM008, CM009]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Sizing lenses and evidence limits
    body: >-
      Sizing requires separating an ecosystem universe from an investable
      lending opportunity. Kaszek presents a market of more than 4 million
      Mexican SMEs with a US$125 billion value, but that is a broad partner
      description and does not establish annual financial-services spend,
      credit demand, or Konfío's serviceable share. VEF adds customer
      composition statistics and describes a population that historically
      lacked formal financing. IDB Invest supplies a concrete financing
      instrument—up to US$40 million equivalent in MXN in 2019 for a trust
      purchasing Konfío-sourced loans—but a facility is funding capacity, not
      TAM, revenue, or current demand. These lenses support market existence
      and segmentation, not a current SAM/SOM. A defensible underwriting case
      therefore needs current originations, repeat usage, take rates, loss
      curves, and geography/product eligibility before converting the broad
      universe into a forecast.
    claimRefs: [CM005, CM007, CM012, CM013, CM014]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-drivers-constraints
    title: Buyers, adoption drivers, and constraints
    body: >-
      The economic buyer is generally the owner or finance decision-maker of a
      micro or small business; the user is the operator managing liquidity,
      inventory, payroll, or payments; and the payer is the business that
      repays credit or pays for an operating service. Konfío's described
      adoption trigger is speed and reduced friction: data from social media,
      online payments, and traditional sources support real-time loan
      approvals, while the product set extends from credit to cards, point of
      sale, and software. The adoption constraint is underwriting and trust:
      unsecured lending to thin-file businesses requires risk controls, and the
      available sources do not disclose cohort losses, recoveries, or current
      unit economics. A potential banking-license path could broaden deposits
      and treasury relationships, but the cited source only reports an
      application, not approval or operating readiness.
    claimRefs: [CM006, CM008, CM009, CM010, CM011, CM015]
    tableRefs: [TM003]
callouts:
  - calloutType: insight
    title: Large boundary, constrained sizing
    body: >-
      The evidence supports a meaningful Mexican MSME-finance opportunity, but
      the published figures do not support a precise current TAM/SAM/SOM
      conversion or a market-share forecast.
    claimRefs: [CM005, CM007, CM014]
  - calloutType: risk
    title: Credit economics remain the market gate
    body: >-
      Faster access and broader products may expand adoption, but public
      evidence does not establish whether risk-adjusted returns remain
      attractive across borrower cohorts.
    claimRefs: [CM013, CM014, CM015]
