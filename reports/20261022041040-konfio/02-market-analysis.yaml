    notes: >-
      Values preserve the source's units and qualifiers. No CAGR is reported
      in the retained texts; null means not disclosed, not zero.
    claimRefs: [CM003, CM004, CM005, CM007, CM008]
  - id: TM003
    title: Segment and buyer map
    columns: [Segment, Buyer, User, Payer, Workflow, Budget owner, Adoption trigger]
    rows:
      - [Sole proprietors, "Owner", "Owner/operator", "Business owner", "Working-capital and cash-flow management", "Owner", "Fast decision and fewer traditional-bank barriers"]
      - [Thin-file MSMEs, "Owner or finance lead", "Finance/admin operator", "Business", "Formal credit application and repayment", "Owner or finance lead", "Alternative data and real-time assessment"]
      - [Growing small businesses, "Owner or finance lead", "Operations and finance staff", "Business", "Credit, cards, payments, and inventory/payroll liquidity", "Owner or finance lead", "One digital ecosystem across workflows"]
      - [Young business owners, "Owner", "Owner/operator", "Business owner", "First formal financial-service relationship", "Owner", "Access where prior formal credit scoring is absent"]
    notes: >-
      Roles and triggers are synthesized from the retained descriptions of
      customer composition, product scope, and underwriting; public sources do
      not disclose segment-level budgets or conversion rates.
    claimRefs: [CM002, CM003, CM004, CM006, CM009, CM010]
figures:
  - id: FM001
    title: Market sizing lens
    type: pyramid
    summary: >-
      The evidence moves from a broad SME universe to Konfío's documented
      product and financing wedge; the layers are not additive or directly
      comparable.
    data:
      nodes:
        - label: Mexican SME universe
          value: "more than 4 million"
          unit: businesses
          detail: "Kaszek market description"
        - label: Reported SME value lens
          value: "US$125Bn"
          unit: value
          detail: "Kaszek market description"
        - label: Underserved formal-finance segment
          value: "many customers"
          unit: businesses
          detail: "VEF describes customers without prior formal financing"
        - label: Customer composition lens
          value: "41%"
          unit: sole proprietors
          detail: "VEF customer composition"
        - label: Konfío-sourced loan facility
          value: "up to US$40m"
          unit: facility
          detail: "IDB Invest 2019 guaranteed facility"
        - label: Initial product wedge
          value: "$50,000 maximum"
          unit: first term-loan limit
          detail: "WEF description of first product"
    approximationNotes: >-
      Layers combine business counts, a broad value statement, composition
      percentages, a financing facility, and a product limit. The pyramid is a
      directional market-boundary visualization, not a proportional funnel or
      additive TAM/SAM/SOM calculation.
    claimRefs: [CM005, CM007, CM008, CM012]
