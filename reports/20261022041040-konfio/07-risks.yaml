company:
  name: Konfío
chapter:
  number: 7
  title: Risks
  summary: Konfío's principal risks are credit-cycle execution, funding and governance discipline, and the regulatory complexity of seeking a banking license. Public evidence shows meaningful institutional financing and governance remediation, but it does not disclose the cohort-level loss, liquidity, control, or licensing evidence needed to reduce residual exposure.
sections:
  - id: risk-ranking
    title: Ranked risk posture
    body: >-
      The evidence supports a high residual-risk posture for a private SME lender, even though the company has institutional backing and has taken governance steps. Konfío's model serves small businesses that may have thin records and depends on pricing credit accurately; an independent profile describes the core challenge as deciding quickly using transaction and tax data, while also warning that defaults can accumulate when the data is misread. The same source notes that higher interest rates and economic weakness after 2021 increased the difficulty of funding loans. This creates a linked exposure: underwriting error, funding cost, and borrower affordability can reinforce one another. The appropriate monitoring set is therefore cohort delinquency and loss performance, net interest and fee economics, funding availability, and liquidity headroom rather than headline valuation or product breadth alone.
    claimRefs: [CR001, CR002, CR003, CR004]
    figureRefs: [FR001]
  - id: regulatory-legal
    title: Regulatory, legal, and governance exposure
    body: >-
      Konfío's regulatory transition is material because the company has applied for a banking license, but the available evidence describes an application and a conditional future outcome, not an approval. The March 2026 syndicated release says approval would be required for Konfío to become a bank purpose-built for Mexican SMEs. The IDB Invest record separately identifies the operating entity as Red Amigo Dal, SAPI de CV, SOFOM, ENR, and records a USD 40 million equivalent guaranteed facility considered for a trust that purchases Konfío-sourced loans. These facts leave open the scope of any license, the timing of approval, the controls required for deposits and treasury products, and how the existing lending structure would interact with a bank. A 2024 BID Invest case study reports significant corporate-governance changes intended to reassure customers, investors, and creditors, which is a mitigation signal but not evidence that all control or compliance risks are closed.
    claimRefs: [CR005, CR006, CR007, CR008]
    tableRefs: [TR001]
  - id: operational-dependency
    title: Operational, partner, and dependency risks
    body: >-
      The platform's breadth increases operational surface area. Kaszek describes Konfío as integrating financial services, software, and payments, while the 2026 release describes lending, corporate cards, and point-of-sale solutions delivered digitally without physical branches. That breadth may improve cross-sell, but it also creates dependencies across underwriting, payment processing, software integrations, data governance, customer support, and external capital providers. The IDB Invest record shows a financing structure involving a management and source-of-payment trust and a guaranteed facility, while the independent profile says IFC and Goldman Sachs provided debt to fund loans. Public evidence does not establish concentration by lender, processor, cloud provider, or customer, nor does it establish outage, cyber-incident, recovery-time, or vendor-continuity performance. Those missing controls should be treated as material diligence gaps rather than as evidence of no incident.
    claimRefs: [CR009, CR010, CR011, CR012]
    tableRefs: [TR002, TR003]
  - id: thesis-breaks
    title: Monitoring indicators and thesis-break triggers
    body: >-
      The risk thesis breaks if Konfío cannot demonstrate that its underwriting remains profitable through a stressed credit cycle, or if the proposed banking transition advances without evidence of licensing milestones, governance accountability, operational resilience, and sufficient liquidity. The most decision-useful indicators are vintage delinquency and net loss by product, reserve and recovery methodology, funding maturity and covenant headroom, license status and conditions, material incidents and remediation, and concentration in capital or distribution partners. A private-company valuation above one billion dollars has been reported in the source pool, but that milestone is not a liquidity resource and cannot substitute for current financial statements or a cap table. Until those records are available, the residual exposure remains high and the diligence path should be explicit.
    claimRefs: [CR013, CR014, CR015, CR016]

tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns: [Risk area, Evidence and current status, Likelihood, Severity, Mitigation or control signal, Residual exposure, Diligence path]
    rows:
      - [Banking-license transition, "Application reported; approval is conditional and not evidenced as granted.", High, Critical, "Public application narrative; no approval record or milestone plan retained.", High, "Obtain regulator filings, license status, conditions, governance map, and launch controls."]
      - [Credit-loss and affordability cycle, "Small-business lending relies on rapid data-driven decisions; source warns defaults can rise if data is misread and funding costs increase.", High, Critical, "Alternative-data underwriting and product diversification are described; cohort results are not disclosed.", High, "Review vintage loss curves, delinquency, recoveries, reserves, pricing, and stress tests."]
      - [Governance and fiduciary controls, "BID Invest case study reports significant governance-practice changes intended to reassure stakeholders.", Medium, High, "Governance remediation is a positive signal but not a current control assessment.", Medium-High, "Request board materials, internal-control testing, related-party policy, and compliance findings."]
      - [Financing-structure and legal-entity complexity, "IDB Invest records a trust structure and Red Amigo Dal, SAPI de CV, SOFOM, ENR as sponsor.", Medium, High, "Institutional facility and guarantee structure provide formal oversight signals.", Medium-High, "Map entities, servicing duties, covenants, security interests, and recourse."]
    notes: "Sources mix a 2024 governance case study, a 2019 IDB Invest project record, and current company-distributed licensing claims; status and severity are analytical judgments, not regulator findings."
    enumerationScope:
      coverage: partial
      basis: "Publicly disclosed legal, governance, licensing, and financing-structure items located in the assigned 2019-2026 source pool"
    claimRefs: [CR005, CR006, CR007, CR008]
  - id: TR002
    title: Operational, quality, and security risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - [Underwriting model drift or data error, High, Critical, Partial, High, "No current vintage, calibration, override, or stress-performance disclosure."]
      - [Funding-cost and liquidity compression, High, High, Partial, High, "No current debt maturity, covenant, warehouse, or liquidity-headroom disclosure."]
      - [Payment or digital-service outage, Medium, High, Low, Medium-High, "No incident history, uptime, recovery-time, or business-continuity evidence in the pool."]
      - ["Privacy, cyber, or data-governance failure", Medium, High, Low, High, "No current security certification, incident, DPA, or control-testing evidence in the pool."]
    notes: "The table separates documented operating-model exposures from unverified incident status; absence of an incident record is not evidence that no incident occurred."
    claimRefs: [CR001, CR002, CR009, CR010, CR011]
  - id: TR003
    title: Partner and dependency risk register
    columns: [Dependency, Counterparty or role, Failure scenario, Severity, Mitigation signal, Residual exposure, Diligence path]
    rows:
      - [Debt and loan funding, "IFC, Goldman Sachs, and other institutional capital providers described in the assigned profile", "Funding withdrawal, repricing, covenant breach, or maturity mismatch constrains originations.", High, "Institutional backing and formal facility structures are reported.", High, "Obtain lender concentration, maturities, covenants, advance rates, and backup facilities."]
      - [Trust and servicing structure, "Management and source-of-payment trust; Red Amigo Dal sponsor", "Servicing, collateral, payment-waterfall, or recourse failure disrupts collections or financing.", High, "IDB Invest project record identifies a defined trust and guarantee structure.", Medium-High, "Review trust deed, servicing standards, waterfall, triggers, and contingency servicer."]
      - [Payments and software ecosystem, "Payment tools, point-of-sale solutions, and management software", "Third-party integration or processor failure degrades customer value and cross-sell.", Medium-High, "Product breadth and digital delivery are publicly described.", Medium-High, "Request dependency map, SLAs, vendor concentration, resilience tests, and incident logs."]
      - [Banking regulator and approval process, "Mexican financial authorities", "Approval delay, conditions, or denial postpones deposits and treasury expansion.", High, "Application is publicly stated; no outcome is evidenced.", High, "Obtain application stage, conditions precedent, capital plan, and compliance readiness."]
    notes: "Counterparties and roles are retained only where the assigned sources name them or describe the structure; concentration and contractual protections remain unverified."
    claimRefs: [CR006, CR009, CR010, CR014, CR015]

