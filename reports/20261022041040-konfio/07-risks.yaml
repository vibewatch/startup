    claimRefs: [CR001, CR005, CR009, CR013, CR016]

callouts:
  - calloutType: risk
    title: Highest residual risk
    body: "Credit performance and funding resilience are inseparable until Konfío provides cohort-level loss, reserve, recovery, pricing, and liquidity evidence."
    claimRefs: [CR001, CR002, CR003, CR013]
  - calloutType: assumption
    title: Licensing is not approval
    body: "The available 2026 source reports an application for a banking license and a conditional future outcome; it does not establish that a license was granted."
    claimRefs: [CR005, CR006]
  - calloutType: recommendation
    title: Diligence gate
    body: "Keep the risk posture high until regulator evidence, current credit-vintage performance, financing covenants, and operational-control testing are obtained."
    claimRefs: [CR013, CR014, CR015, CR016]

