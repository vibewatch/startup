  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              The available evidence consistently places Konfío in Mexico's small-business finance market, but dates its
              founding differently. A 2026 company-distributed release says David Arana and Francisco Padilla founded
              the fintech in 2013, whereas Tracxn records a 2014 founding. The World Economic Forum separately dates the
              first product launch to 2014; that does not resolve whether 2013 is the incorporation year and 2014 the
              operating launch. A company-distributed release says the offering expanded beyond lending into corporate
              credit cards and point-of-sale solutions, while investor Kaszek describes an integrated platform spanning
              financial services, software, and payments. The official site identifies Red Amigo DAL as a SOFOM, ENR and
              gives a Miguel Hidalgo, Mexico City address, but its fetched text is primarily a legal footer rather than
              a complete current product or corporate profile.
