      - number: '5.3'
        title: Deployment, integration, and roadmap
        blocks:
          - type: paragraph
            body: >-
              The evidence points to a digitally delivered model with no physical branches, direct sales, and a broker
              network. Temporal, CRM, contact-center tools, and payment operations imply multiple integration surfaces,
              while the public product descriptions indicate that customers interact with credit, card, and payment
              capabilities through an online ecosystem. The forward roadmap is materially regulatory: a 2024 application
              for a banking license was reported, and a March 2026 interview described Konfío as waiting for the
              regulator while planning deposit and treasury services. The roadmap is therefore partly outside the
              product team's control. No retained source establishes uptime, incident history, API documentation,
              implementation time, integration SLAs, release cadence, or production-versus-pilot status for the named
              initiatives. These omissions matter because adding deposits and treasury increases reconciliation,
              access-control, liquidity, and operational-resilience requirements beyond the current lending-and-payments
              surface.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
      - number: '5.4'
        title: Differentiation, trust, and control maturity
        blocks:
          - type: paragraph
            body: >-
              Konfío's defensible product thesis is the combination of fast, data-driven SME underwriting with adjacent
              payment and expense tools for businesses underserved by traditional banks. Sources describe advanced
              algorithms and data-based scoring, and the company profile links current projects to fraud resolution,
              delinquency reduction, chargeback recovery, and credit-scoring development. Those signals support a
              risk-and-workflow differentiation hypothesis, but not a quantified model lift, proprietary-data moat,
              approval-rate improvement, or loss performance. The strongest current technical risk signal is the
              profile's description of fraud, delinquency, default, chargeback, and operational risk as active
              challenges, including a new Fraud Resolution Lead role. Security certifications, penetration-test results,
              privacy controls, model-governance documentation, recovery performance, and banking-license control
              evidence are not public in the assigned sources and should be obtained before underwriting a
              technology-led expansion.
            claimRefs:
              - CE013
              - CE014
              - CE015
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Integrated SME workflow
            body: >-
              Credit, cards, and payments give Konfío multiple workflow entry points around the same SME financial
              relationship, with a stated ambition to add deposits and treasury if licensed.
            calloutType: strength
            claimRefs:
              - CE001
              - CE009
          - type: callout
            title: Control maturity is the gating issue
            body: >-
              Public hiring signals explicitly connect current work to fraud, delinquency, default, chargeback, and
              operational risk, while banking expansion would add regulated deposit and treasury processes.
            calloutType: risk
            claimRefs:
              - CE007
              - CE014
          - type: callout
            title: Require production proof before crediting the moat
            body: >-
              Request architecture diagrams, model-validation evidence, security attestations, incident metrics, and
              banking-readiness controls before assigning value to inferred tooling or the license roadmap.
            calloutType: recommendation
            claimRefs:
              - CE008
              - CE012
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer and user segments
        blocks:
          - type: paragraph
            body: >-
              The available evidence consistently places Konfío in Mexican small-business finance rather than consumer
              lending. Triodos describes working-capital loans for small and medium-sized enterprises and identifies a
              large addressable SME population with limited formal-credit access. VEF adds useful segmentation detail:
              sole proprietors represent 41% of the described customer base, women-owned businesses 30%, and owners
              under 34 17%; the source does not state the measurement date or denominator beyond its customer
              description. This supports a thesis centered on underbanked micro and small businesses, but it does not
              establish the current mix by industry, geography, payer, or revenue band. The segmentation table therefore
              separates what the sources actually disclose from the fields an investor would still need to test.
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU005
              - CU006
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU005
              - CU006
      - number: '6.2'
        title: Adoption trajectory and named proof
        blocks:
          - type: paragraph
            body: >-
              Konfío has evidence of meaningful historical distribution, but the quality of proof varies. IDB Invest
              describes a proposed facility to purchase loans originated through Konfío for MSMEs and entrepreneurial
              activities, which is stronger evidence of an institutional financing channel than a logo or marketing
              claim. Kaszek says the network had connected a large portion of the market and provided working-capital
              loans to tens of thousands of businesses during the period described, while the 2026 syndicated company
              release says thousands of businesses used flexible financing during COVID-19. These statements indicate
              scale and use cases, not current active customers, repeat usage, production outcomes, or net retention. No
              assigned source names an end-customer organization or provides a measured before/after operating outcome,
              so the named-proof table records that limitation rather than converting investor or lender references into
              customer case studies.
            claimRefs:
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
              - CU008
              - CU009
              - CU010
          - type: table
            tableRef: TU003
            claimRefs:
              - CU007
              - CU008
              - CU010
              - CU011
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU002
              - CU007
              - CU008
              - CU010
              - CU012
              - CU013
      - number: '6.3'
        title: Retention, expansion, and concentration
        blocks:
          - type: paragraph
            body: >-
              The product bundle creates a plausible expansion path from working-capital credit into cards,
              point-of-sale payments, software, and potentially banking services. The assigned evidence supports the
              existence of those offerings, but it does not disclose customer-level conversion, renewal, churn, gross or
              net retention, contract duration, utilization, contribution margin, or cross-sell rates. Similarly, there
              is no current top-customer list, revenue concentration table, channel share, or partner dependency
              schedule. The customer thesis should therefore distinguish product breadth from demonstrated
              land-and-expand behavior. A diligence process should request cohort-level repayment and renewal data,
              product attach rates, customer concentration by revenue and exposure, and evidence that new banking
              services deepen relationships without increasing credit or operational risk.
            claimRefs:
              - CU008
              - CU011
              - CU012
              - CU013
              - CU014
              - CU015
      - number: '6.4'
        title: Investor interpretation and diligence path
        blocks:
          - type: paragraph
            body: >-
              The customer evidence is directionally positive on problem selection and historical access expansion, yet
              incomplete on economic durability. Konfío appears positioned to serve businesses that traditional lenders
              have not consistently reached, and institutional financing records show that its origination model has
              been financeable. The main diligence question is whether historical acquisition and credit access
              translate into profitable, repeat customer relationships across cycles. Before underwriting a stronger
              customer conclusion, an investor should reconcile the date and denominator for all customer counts, obtain
              active-account and repeat-borrower definitions, inspect vintage performance and recoveries, and map
              revenue and credit exposure by customer, vertical, geography, channel, and product. Adverse diligence
              should also test failed pilots, complaints, declined renewals, and any concentration created by
              institutional or platform partners.
            claimRefs:
              - CU003
              - CU007
              - CU012
              - CU013
              - CU014
              - CU015
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Historical reach is stronger than current durability evidence
            body: >-
              Konfío's assigned sources support SME access, institutional financing, and a multi-product proposition;
              they do not establish present active-customer scale or repeat economics.
            calloutType: insight
            claimRefs:
              - CU007
              - CU008
              - CU010
              - CU012
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk posture
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a high residual-risk posture for a private SME lender, even though the company has
              institutional backing and has taken governance steps. Konfío's model serves small businesses that may have
              thin records and depends on pricing credit accurately; an independent profile describes the core challenge
              as deciding quickly using transaction and tax data, while also warning that defaults can accumulate when
              the data is misread. The same source notes that higher interest rates and economic weakness after 2021
              increased the difficulty of funding loans. This creates a linked exposure: underwriting error, funding
              cost, and borrower affordability can reinforce one another. The appropriate monitoring set is therefore
              cohort delinquency and loss performance, net interest and fee economics, funding availability, and
              liquidity headroom rather than headline valuation or product breadth alone.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR005
              - CR009
              - CR013
              - CR016
      - number: '7.2'
        title: Regulatory, legal, and governance exposure
        blocks:
          - type: paragraph
            body: >-
              Konfío's regulatory transition is material because the company has applied for a banking license, but the
              available evidence describes an application and a conditional future outcome, not an approval. The March
              2026 syndicated release says approval would be required for Konfío to become a bank purpose-built for
              Mexican SMEs. The IDB Invest record separately identifies the operating entity as Red Amigo Dal, SAPI de
              CV, SOFOM, ENR, and records a USD 40 million equivalent guaranteed facility considered for a trust that
              purchases Konfío-sourced loans. These facts leave open the scope of any license, the timing of approval,
              the controls required for deposits and treasury products, and how the existing lending structure would
              interact with a bank. A 2024 BID Invest case study reports significant corporate-governance changes
              intended to reassure customers, investors, and creditors, which is a mitigation signal but not evidence
              that all control or compliance risks are closed.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR001
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
      - number: '7.3'
        title: Operational, partner, and dependency risks
        blocks:
          - type: paragraph
            body: >-
              The platform's breadth increases operational surface area. Kaszek describes Konfío as integrating
              financial services, software, and payments, while the 2026 release describes lending, corporate cards, and
              point-of-sale solutions delivered digitally without physical branches. That breadth may improve
              cross-sell, but it also creates dependencies across underwriting, payment processing, software
              integrations, data governance, customer support, and external capital providers. The IDB Invest record
              shows a financing structure involving a management and source-of-payment trust and a guaranteed facility,
              while the independent profile says IFC and Goldman Sachs provided debt to fund loans. Public evidence does
              not establish concentration by lender, processor, cloud provider, or customer, nor does it establish
              outage, cyber-incident, recovery-time, or vendor-continuity performance. Those missing controls should be
              treated as material diligence gaps rather than as evidence of no incident.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR009
              - CR010
              - CR011
          - type: table
            tableRef: TR003
            claimRefs:
              - CR006
              - CR009
              - CR010
              - CR014
              - CR015
      - number: '7.4'
        title: Monitoring indicators and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The risk thesis breaks if Konfío cannot demonstrate that its underwriting remains profitable through a
              stressed credit cycle, or if the proposed banking transition advances without evidence of licensing
              milestones, governance accountability, operational resilience, and sufficient liquidity. The most
              decision-useful indicators are vintage delinquency and net loss by product, reserve and recovery
              methodology, funding maturity and covenant headroom, license status and conditions, material incidents and
              remediation, and concentration in capital or distribution partners. A private-company valuation above one
              billion dollars has been reported in the source pool, but that milestone is not a liquidity resource and
              cannot substitute for current financial statements or a cap table. Until those records are available, the
              residual exposure remains high and the diligence path should be explicit.
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Highest residual risk
            body: >-
              Credit performance and funding resilience are inseparable until Konfío provides cohort-level loss,
              reserve, recovery, pricing, and liquidity evidence.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR013
          - type: callout
            title: Licensing is not approval
            body: >-
              The available 2026 source reports an application for a banking license and a conditional future outcome;
              it does not establish that a license was granted.
            calloutType: assumption
            claimRefs:
              - CR005
              - CR006
          - type: callout
            title: Diligence gate
            body: >-
              Keep the risk posture high until regulator evidence, current credit-vintage performance, financing
              covenants, and operational-control testing are obtained.
            calloutType: recommendation
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The positive case is a scaled, digitally delivered SME-finance platform with multiple products and
              institutional financing relationships. Mexico Business reported in December 2024 that Konfío had secured
              MX$7.42 billion in debt financing from Goldman Sachs, JPMorgan Chase, and Afore Sura Mexico, while IDB
              Invest records a contemplated guaranteed facility of up to the MXN equivalent of US$40 million for
              purchasing Konfío-sourced loans. These are financing signals, not equity value or cash available to common
              shareholders. Kaszek describes a platform spanning financial services, software, and payments, and its
              stated market context is more than four million Mexican SMEs. Konfío's 2021 impact report also reports
              2021 revenue growth of 115% versus 2020 and a 25% average sales increase among clients 15 months after a
              loan, but those figures are company-reported and historical. The anti-thesis is equally material: the
              latest valuation identified in the pool is the September 2021 US$1.3 billion Series E mark, while current
              revenue, margin, delinquency, recoveries, reserves, and post-2021 financing terms are not publicly
              established here. A skeptical valuation case also has to account for the fact that the public evidence
              includes a critique explicitly titled "Why Konfío Failed: Unit Economics," making unit economics a
              diligence prerequisite rather than an assumption.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV005
              - CV012
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV006
              - CV007
              - CV012
      - number: '8.2'
        title: Price discipline and scenario framing
        blocks:
          - type: paragraph
            body: >-
              Entry discipline should be anchored to a current financing mark and the economics of the loan book, not to
              the historical unicorn label. The December 2024 financing report gives maturities through February 2028
              for Goldman Sachs' expanded credit line and May 2027 for JPMorgan's increased line; that supports funding
              continuity but does not disclose pricing, covenants, utilization, loss-sharing, or equity dilution. The
              2021 impact report provides useful operating inputs, including more than 45,000 working capital loans,
              10,800 business credit cards, 1,192 employees, and 8.2% of revenue invested in R&D and innovation, but the
              period and company-reported basis must be preserved. IDB Invest's 2019 project record documents a proposed
              loan-purchase facility, and the 2024 report describes a planned banking-license transition; neither source
              supplies a current equity valuation. Accordingly, the bull case depends on verified credit performance,
              sustainable funding spreads, and successful bank execution; the base case assumes the platform remains
              strategically useful but requires a price supported by normalized earnings or loan-book economics; the
              bear case assumes losses, funding costs, or regulatory execution compress returns. Quantitative ranges
              should wait for current financial and cap-table disclosure.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV007
              - CV008
              - CV010
              - CV012
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV012
              - CV013
      - number: '8.3'
        title: Decision, exit readiness, and diligence asks
        blocks:
          - type: paragraph
            body: >-
              The appropriate decision is research-more, with low confidence in any current valuation stance and a high
              risk rating driven by information gaps rather than a verified insolvency event. A buyer should request the
              current cap table, the full preference and liquidation stack, every post-2021 equity or secondary
              transaction, debt-facility covenants and utilization, cohort delinquency and net-loss curves, reserve
              methodology, contribution margin by product, and the banking-license timetable and conditions. The lender
              relationships and IDB Invest record show that institutional counterparties have engaged with the platform,
              but they do not substitute for shareholder returns analysis. The adverse and thinly disclosed evidence
              means exit readiness is not demonstrated: there is no public current revenue run-rate, audited
              profitability bridge, or liquidity event path in the retained sources. The thesis should move toward track
              or buy only after those inputs support a return case at the proposed entry price; it should move toward
              avoid if normalized losses, refinancing dependence, or regulatory delays make the required return
              unattainable.
            claimRefs:
              - CV012
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Decision
            body: 'Research-more: the public record supports a real platform, but not a current price-sensitive buy.'
            calloutType: recommendation
            claimRefs:
              - CV012
              - CV013
          - type: callout
            title: Financing signal
            body: >-
              The 2024 financing disclosure identifies MX$7.42 billion of debt financing and maturities extending into
              2027–2028.
            calloutType: strength
            claimRefs:
              - CV001
              - CV007
          - type: callout
            title: Valuation gap
            body: >-
              The latest identified valuation is a September 2021 US$1.3 billion mark; a current equity mark is not
              evidenced.
            calloutType: risk
            claimRefs:
              - CV005
              - CV013
          - type: callout
            title: Scenario limitation
            body: >-
              No numeric bull/base/bear valuation range is presented because current revenue, margin, loss, and
              cap-table inputs are missing.
            calloutType: assumption
            claimRefs:
              - CV010
              - CV014
