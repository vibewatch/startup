  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Konfío's public evidence points from SME financial products through risk and workflow systems to cloud and service
      operations, with control evidence still missing.
    data:
      layers:
        - label: Customer products
          detail: Publicly described SME-facing financial products.
          items:
            - label: SME credit
              detail: Working-capital credit with online application and data-led decisioning.
            - label: Corporate card
              detail: Expense payment, invoice reconciliation, and role or permission controls.
            - label: Payments
              detail: Payment-terminal acceptance for SME merchants.
            - label: Deposits and treasury
              detail: Intended expansion dependent on banking-license authorization.
        - label: Risk and workflow
          detail: Public hiring-data signals for decisioning and recovery processes.
          items:
            - label: Credit scoring
              detail: Public hiring-data signal for scoring-model development.
            - label: Fraud resolution
              detail: Public hiring-data signal for automated fraud-resolution agents.
            - label: Dispute recovery
              detail: Public hiring-data signal for chargeback and dispute recovery.
        - label: Data and orchestration
          detail: Publicly associated machine-learning and workflow technologies.
          items:
            - label: ML and AI
              detail: SageMaker, Bedrock, and LangGraph are associated with the public stack profile.
            - label: Workflow runtime
              detail: Temporal is associated with the public stack profile.
        - label: Cloud and service operations
          detail: Publicly associated runtime, sales, and support technologies.
          items:
            - label: Cloud and applications
              detail: AWS, Python, Node.js, TypeScript, Flutter, Docker, and Kubernetes are associated with the profile.
            - label: Sales and support
              detail: Salesforce, Amazon Connect, and Genesys are associated with the profile.
        - label: Distribution and control
          detail: Public signals for channels and active risk-control work.
          items:
            - label: Direct and broker channels
              detail: Direct sales and broker-network growth are reported operating surfaces.
            - label: Risk controls
              detail: Fraud, delinquency, default, and chargeback controls are active diligence topics.
        - label: Evidence boundary
          detail: Production maturity and control attestations require management evidence.
          items:
            - label: Unverified controls
              detail: Security, privacy, reliability, and model-governance artifacts are not in the assigned sources.
    approximationNotes: >-
      The stack is a public-signal synthesis, not a certified production architecture; component roles and dependencies
      require management confirmation.
