  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              The relevant competitive set is broader than digital lenders. Konfío began as an online lending platform
              for Mexican SMEs and now describes an ecosystem that includes corporate cards, payment solutions, and a
              proposed bank charter. That makes traditional banks the clearest evidenced incumbent alternative, while
              specialist lenders, card issuers, payment providers, and internal finance processes are analytically
              relevant categories whose named participants are not established by the retained sources. The evidence
              indicates that Konfío targets firms underserved by conventional underwriting: Inforcapital says businesses
              can apply with three months of invoicing history rather than the up to two years often required by
              traditional banks, and VEF says traditional banks continue to shun some small-business borrowers.
              Operating without formal financing is therefore an evidenced status quo. These access claims do not prove
              that customers consolidate products or that rivals cannot match Konfío.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
      - number: '3.2'
        title: Capability, distribution, and trust comparison
        blocks:
          - type: paragraph
            body: >-
              Konfío’s proposed advantage is a bundled workflow: company-issued material describes data-driven credit
              decisions, digital delivery without physical branches, corporate cards, and point-of-sale solutions, while
              an investor profile describes an SME platform integrating financial services, software, and payments. This
              breadth differentiates Konfío from a single-product proposition, but the evidence does not establish a
              head-to-head win rate, realized price advantage, customer retention advantage, underwriting-loss
              advantage, or distribution exclusivity. Trust and regulatory posture are transitional: multiple retained
              sources say the company has applied for a banking license, but none establishes approval or operational
              readiness. The most defensible comparison is therefore between Konfío’s claimed speed and integrated scope
              and the conventional-bank access friction reported by Inforcapital and VEF. Any stronger relative ranking
              would require current primary evidence from named competitors.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP005
              - CP006
              - CP007
              - CP008
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP003
              - CP006
              - CP011
              - CP012
      - number: '3.3'
        title: Switching costs, packaging, and moat durability
        blocks:
          - type: paragraph
            body: >-
              Switching costs are plausible but unquantified. A business using lending, cards, payments, and future
              treasury services in one relationship could face workflow friction when moving providers, but the retained
              sources provide no retention, churn, migration-cost, data-portability, or provider-overlap measurements.
              Product breadth therefore supports only a relationship-depth hypothesis, not demonstrated lock-in. The
              proposed bank conversion could deepen that relationship, yet the sources establish an application rather
              than an approval, operating timetable, or control readiness. The only adverse item is a low-reputation
              page titled “Why Konfío Failed: Unit Economics”; its fetched text contains no supporting body, so it is a
              diligence lead rather than evidence that Konfío failed. Current competitor pricing, approval rates, loss
              performance, distribution access, and customer switching behavior remain material gaps, and the retained
              release copies do not independently corroborate company claims.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Differentiation is bundled access, not a proven price moat
            body: >-
              Konfío’s strongest evidenced distinction is serving SMEs facing conventional-bank access friction through
              digital underwriting and a broader product bundle; the retained sources do not prove a sustainable price,
              loss, or distribution advantage against named peers.
            calloutType: insight
            claimRefs:
              - CP002
              - CP005
              - CP011
          - type: callout
            title: The bank strategy raises both upside and execution exposure
            body: >-
              The evidence establishes a banking-license application and strategic intent, not approval or operating
              readiness; controls, funding economics, competitor response, and the adverse unit-economics allegation
              remain unresolved.
            calloutType: risk
            claimRefs:
              - CP006
              - CP012
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              Konfío's public model is primarily credit-led, with adjacent payment products. A 2023 investor-backed
              profile describes interest revenue from credit lines and interchange revenue from business cards and
              point-of-sale terminals, while reporting a 31.6% average APR on a line-of-credit product, a 67.4% APR on
              its business card, and card-terminal commissions of 1.35% to 3.5% plus VAT. Those are reported list or
              average pricing figures, not realized yield, net revenue, or contribution margin. The 2026 PesoMXN article
              says Konfío originated about MXN 11 billion in loans over the prior year and kept payments as a complement
              to its business focus. This combination suggests a revenue bridge from SME borrowing and payment activity,
              but public material does not disclose product mix, average balances, fee waivers, funding spread, or
              accounting recognition. Official and investor descriptions also place software and payments alongside
              lending, so the underwriting request should separate recurring software fees, transaction revenue,
              interest income, and ancillary fees rather than assume a SaaS-like ARR model.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI016
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI003
              - CI004
              - CI008
      - number: '4.2'
        title: Sales efficiency, credit costs, and operating leverage
        blocks:
          - type: paragraph
            body: >-
              The available evidence supports digital origination and data-driven risk analysis, but not a complete
              unit-economics calculation. ReadEmergent reports rapid digital credit decisions, a portfolio of 45,000
              loans to more than 27,600 SMEs, and a broader count of 70,000 businesses supported; those denominators and
              dates are not aligned enough to derive conversion, repeat borrowing, or revenue per account. IDB Invest
              records a proposed USD 40 million equivalent facility to a trust purchasing loans originated by Konfío,
              indicating that warehouse or structured funding has been part of the operating model, but the public
              record does not provide the facility's current utilization, pricing, advance rate, covenants, or loss
              allocation. The 2026 PesoMXN source says the company uses transactional data and risk analysis and claims
              profitability since 2024; that remains company-reported and is not an audited margin disclosure. Cost of
              capital, acquisition spend, servicing expense, collections performance, charge-offs, recoveries, and
              reserve methodology are therefore the key missing inputs to any CAC/payback or contribution-margin model.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
              - CI014
      - number: '4.3'
        title: Public traction and capital adequacy
        blocks:
          - type: paragraph
            body: >-
              Public traction is meaningful but financially incomplete. ReadEmergent reports 45,000 loans to more than
              27,600 SMEs, 70,000 businesses and SMEs supported, and 25% year-over-year growth for SME clients. These
              figures are historical or source-dated rather than a current audited operating snapshot, and the source
              does not reconcile them to revenue, outstanding principal, active customers, or cash generation. The 2026
              PesoMXN article reports approximately MXN 11 billion of loan originations over the prior year, while
              Kaszek describes a network that has given working-capital access to tens of thousands of businesses and
              includes an accounting platform and B2B payments. Originations are loan production, not revenue or cash
              available. The capital picture remains opaque: the latest public materials do not disclose cash on hand,
              monthly burn, runway, debt balances, refinancing dates, or current facility headroom. The banking-license
              application described by company-issued 2026 releases could expand funding and deposit options if
              approved, but it also raises capital, governance, operational-resilience, and regulatory-readiness
              requirements.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
      - number: '4.4'
        title: Underwriting verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The financial profile merits continued diligence but is not underwritable on public evidence alone. The
              positive case is a focused SME segment, multiple monetization surfaces, institutional financing
              relationships, reported lending scale, and a company-claimed transition to profitability. The negative
              case is equally material: a low-reputation adverse page labels Konfío a unit-economics failure but
              supplies no supporting analysis in the fetched text, so the allegation is a diligence signal rather than a
              verified conclusion. Separately, the World Economic Forum describes the first product as a
              fixed-installment term loan capped at USD 50,000. The available evidence does not establish net interest
              margin, portfolio yield after losses, delinquency by vintage, cost of funds, or free cash flow. A bank
              transition may improve product breadth and funding resilience, but it can increase fixed compliance and
              control costs before deposits or treasury revenue scale. A financing decision should require current
              management accounts, reconciled originations and active-account data, portfolio vintage curves, reserve
              and recovery schedules, facility documents, liquidity forecasts, and a downside scenario for rates,
              defaults, and funding access.
            claimRefs:
              - CI009
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Multiple monetization surfaces
            body: >-
              Credit, cards, payments, and a described accounting platform create potential cross-sell and revenue
              diversification, although public disclosures do not quantify mix or realized margin.
            calloutType: strength
            claimRefs:
              - CI001
              - CI003
              - CI004
          - type: callout
            title: Portfolio economics are the underwriting blocker
            body: >-
              Current delinquency, charge-offs, recoveries, reserve methodology, cost of funds, and liquidity headroom
              are not disclosed in the assigned public evidence.
            calloutType: risk
            claimRefs:
              - CI008
              - CI014
              - CI015
          - type: callout
            title: Require reconciled management accounts
            body: >-
              Before underwriting valuation or runway, reconcile originations, active borrowers, revenue by stream,
              facility balances, cash, burn, and vintage-level credit performance.
            calloutType: recommendation
            claimRefs:
              - CI009
              - CI010
              - CI014
              - CI015
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Konfío's public product surface is a financial-services workflow rather than a single software SKU. The
              offering described across the retained sources includes working-capital credit, a corporate card for
              expenses and permissions, and a payment terminal for accepting card payments. The customer journey
              therefore links application and underwriting to disbursement, spending or acceptance, reconciliation, and
              recovery. A 2023 product account describes an online portal for credit, card controls for expenses and
              invoice reconciliation, and payment acceptance with a stated commission range; those are product
              mechanisms, not evidence of realized pricing or service quality. A 2026 report says the intended next step
              is to place credit, payments, and deposit accounts in one SME platform, subject to regulatory
              authorization. This creates a plausible cross-sell loop, but the public record does not disclose
              activation, attach, retention, or failure-rate denominators.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE009
              - CE010
          - type: table
