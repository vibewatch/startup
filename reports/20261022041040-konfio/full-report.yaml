      - number: '5.2'
        title: Data-led operating architecture
        blocks:
          - type: paragraph
            body: >-
              Public hiring and company-data signals describe an AWS-centered stack with Python, Node.js, TypeScript,
              Flutter, Docker, Kubernetes, GitLab, Temporal, SageMaker, Bedrock, and LangGraph, alongside Salesforce,
              Amazon Connect, and Genesys for sales and service. The same profile attributes projects to credit-scoring
              development, automated fraud-resolution agents, dispute and chargeback recovery, and broker-network
              growth. This is useful evidence of an operating model that combines risk decisioning, workflow
              orchestration, customer operations, and channels; it is not a verified production architecture diagram or
              a service-level commitment. The profile explicitly says the stack and project figures are inferred from
              public hiring and company data and are estimates that refresh over time. Consequently, the architecture
              map below separates observed or reported components from diligence gaps rather than treating inferred
              tooling as a certified control environment.
            claimRefs:
              - CE005
              - CE006
