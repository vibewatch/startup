            body: >-
              The retained evidence names David Arana and Francisco Padilla as founders, and Tracxn identifies Arana as
              co-founder and CEO. It does not provide a complete current executive roster, board composition, committee
              structure, succession plan, or documented leadership-change history. That gap is material for a lending
              platform whose credit, compliance, funding, and prospective banking operations depend on institutional
              controls rather than founder continuity alone. Stakeholder evidence is stronger: Tracxn lists QED
