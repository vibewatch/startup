chapter:
  number: 5
  title: Product & Technology
  summary: Konfío combines digitally originated SME credit with corporate cards, payment terminals, and an intended deposit-and-treasury expansion. Public evidence supports a data-led underwriting and payments operating model, but the detailed production architecture, reliability controls, security attestations, and banking-readiness controls remain largely undisclosed.
sections:
  - id: product-surface
    title: Product surface and customer workflow
    body: >-
      Konfío's public product surface is a financial-services workflow rather than a single software SKU. The offering described across the retained sources includes working-capital credit, a corporate card for expenses and permissions, and a payment terminal for accepting card payments. The customer journey therefore links application and underwriting to disbursement, spending or acceptance, reconciliation, and recovery. A 2023 product account describes an online portal for credit, card controls for expenses and invoice reconciliation, and payment acceptance with a stated commission range; those are product mechanisms, not evidence of realized pricing or service quality. A 2026 report says the intended next step is to place credit, payments, and deposit accounts in one SME platform, subject to regulatory authorization. This creates a plausible cross-sell loop, but the public record does not disclose activation, attach, retention, or failure-rate denominators.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001, TE002]
  - id: operating-architecture
    title: Data-led operating architecture
    body: >-
      Public hiring and company-data signals describe an AWS-centered stack with Python, Node.js, TypeScript, Flutter, Docker, Kubernetes, GitLab, Temporal, SageMaker, Bedrock, and LangGraph, alongside Salesforce, Amazon Connect, and Genesys for sales and service. The same profile attributes projects to credit-scoring development, automated fraud-resolution agents, dispute and chargeback recovery, and broker-network growth. This is useful evidence of an operating model that combines risk decisioning, workflow orchestration, customer operations, and channels; it is not a verified production architecture diagram or a service-level commitment. The profile explicitly says the stack and project figures are inferred from public hiring and company data and are estimates that refresh over time. Consequently, the architecture map below separates observed or reported components from diligence gaps rather than treating inferred tooling as a certified control environment.
    claimRefs: [CE005, CE006, CE007, CE008]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: deployment-and-roadmap
    title: Deployment, integration, and roadmap
    body: >-
      The evidence points to a digitally delivered model with no physical branches, direct sales, and a broker network. Temporal, CRM, contact-center tools, and payment operations imply multiple integration surfaces, while the public product descriptions indicate that customers interact with credit, card, and payment capabilities through an online ecosystem. The forward roadmap is materially regulatory: a 2024 application for a banking license was reported, and a March 2026 interview described Konfío as waiting for the regulator while planning deposit and treasury services. The roadmap is therefore partly outside the product team's control. No retained source establishes uptime, incident history, API documentation, implementation time, integration SLAs, release cadence, or production-versus-pilot status for the named initiatives. These omissions matter because adding deposits and treasury increases reconciliation, access-control, liquidity, and operational-resilience requirements beyond the current lending-and-payments surface.
    claimRefs: [CE009, CE010, CE011, CE012]
  - id: differentiation-and-controls
    title: Differentiation, trust, and control maturity
    body: >-
      Konfío's defensible product thesis is the combination of fast, data-driven SME underwriting with adjacent payment and expense tools for businesses underserved by traditional banks. Sources describe advanced algorithms and data-based scoring, and the company profile links current projects to fraud resolution, delinquency reduction, chargeback recovery, and credit-scoring development. Those signals support a risk-and-workflow differentiation hypothesis, but not a quantified model lift, proprietary-data moat, approval-rate improvement, or loss performance. The strongest current technical risk signal is the profile's description of fraud, delinquency, default, chargeback, and operational risk as active challenges, including a new Fraud Resolution Lead role. Security certifications, penetration-test results, privacy controls, model-governance documentation, recovery performance, and banking-license control evidence are not public in the assigned sources and should be obtained before underwriting a technology-led expansion.
    claimRefs: [CE013, CE014, CE015, CE016]
callouts:
  - calloutType: strength
    title: Integrated SME workflow
    body: Credit, cards, and payments give Konfío multiple workflow entry points around the same SME financial relationship, with a stated ambition to add deposits and treasury if licensed.
    claimRefs: [CE001, CE009]
  - calloutType: risk
    title: Control maturity is the gating issue
    body: Public hiring signals explicitly connect current work to fraud, delinquency, default, chargeback, and operational risk, while banking expansion would add regulated deposit and treasury processes.
    claimRefs: [CE007, CE014]
  - calloutType: recommendation
    title: Require production proof before crediting the moat
    body: Request architecture diagrams, model-validation evidence, security attestations, incident metrics, and banking-readiness controls before assigning value to inferred tooling or the license roadmap.
    claimRefs: [CE008, CE012, CE016]
