slug: konfio
runDate: 2026-10-22
company:
  name: Konfío
chapter:
  number: 8
  title: Valuation
  summary: >-
    Konfío has evidence of meaningful SME lending scale, institutional debt support,
    and a broadening product platform, but the public record does not establish a
    current equity price, cap table, preference stack, or current credit economics.
    The evidence therefore supports research-more rather than a price-insensitive buy.
sections:
  - id: investment-thesis
    title: Investment thesis and anti-thesis
    body: >-
      The positive case is a scaled, digitally delivered SME-finance platform with
      multiple products and institutional financing relationships. Mexico Business
      reported in December 2024 that Konfío had secured MX$7.42 billion in debt
      financing from Goldman Sachs, JPMorgan Chase, and Afore Sura Mexico, while
      IDB Invest records a contemplated guaranteed facility of up to the MXN
      equivalent of US$40 million for purchasing Konfío-sourced loans. These are
      financing signals, not equity value or cash available to common shareholders.
      Kaszek describes a platform spanning financial services, software, and
      payments, and its stated market context is more than four million Mexican
      SMEs. Konfío's 2021 impact report also reports 2021 revenue growth of 115%
      versus 2020 and a 25% average sales increase among clients 15 months after a
      loan, but those figures are company-reported and historical. The anti-thesis
      is equally material: the latest valuation identified in the pool is the
      September 2021 US$1.3 billion Series E mark, while current revenue, margin,
      delinquency, recoveries, reserves, and post-2021 financing terms are not
      publicly established here. A skeptical valuation case also has to account for
      the fact that the public evidence includes a critique explicitly titled
      "Why Konfío Failed: Unit Economics," making unit economics a diligence
      prerequisite rather than an assumption.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006]
    tableRefs: [TV001, TV002]
  - id: price-and-scenarios
    title: Price discipline and scenario framing
    body: >-
      Entry discipline should be anchored to a current financing mark and the
      economics of the loan book, not to the historical unicorn label. The
      December 2024 financing report gives maturities through February 2028 for
      Goldman Sachs' expanded credit line and May 2027 for JPMorgan's increased
      line; that supports funding continuity but does not disclose pricing,
      covenants, utilization, loss-sharing, or equity dilution. The 2021 impact
      report provides useful operating inputs, including more than 45,000 working
      capital loans, 10,800 business credit cards, 1,192 employees, and 8.2% of
      revenue invested in R&D and innovation, but the period and company-reported
      basis must be preserved. IDB Invest's 2019 project record documents a
      proposed loan-purchase facility, and the 2024 report describes a planned
      banking-license transition; neither source supplies a current equity
      valuation. Accordingly, the bull case depends on verified credit performance,
      sustainable funding spreads, and successful bank execution; the base case
      assumes the platform remains strategically useful but requires a price
      supported by normalized earnings or loan-book economics; the bear case
      assumes losses, funding costs, or regulatory execution compress returns.
      Quantitative ranges should wait for current financial and cap-table
      disclosure.
    claimRefs: [CV007, CV008, CV009, CV010, CV011]
    tableRefs: [TV003]
    figureRefs: [FV001]
  - id: decision-and-diligence
    title: Decision, exit readiness, and diligence asks
    body: >-
      The appropriate decision is research-more, with low confidence in any
      current valuation stance and a high risk rating driven by information gaps
      rather than a verified insolvency event. A buyer should request the current
      cap table, the full preference and liquidation stack, every post-2021 equity
      or secondary transaction, debt-facility covenants and utilization, cohort
      delinquency and net-loss curves, reserve methodology, contribution margin by
      product, and the banking-license timetable and conditions. The lender
      relationships and IDB Invest record show that institutional counterparties
      have engaged with the platform, but they do not substitute for shareholder
      returns analysis. The adverse and thinly disclosed evidence means exit
      readiness is not demonstrated: there is no public current revenue run-rate,
      audited profitability bridge, or liquidity event path in the retained
      sources. The thesis should move toward track or buy only after those inputs
      support a return case at the proposed entry price; it should move toward
      avoid if normalized losses, refinancing dependence, or regulatory delays
      make the required return unattainable.
    claimRefs: [CV012, CV013, CV014, CV015]

tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Assessment, Decision implication]
    rows:
      - [Recommendation, research-more, "Do not underwrite a buy without current price and operating evidence."]
      - [Confidence, low, "The evidence supports platform scale but not a current equity return case."]
      - [Risk rating, high, "Credit performance, funding terms, and license execution remain material unknowns."]
      - [Valuation stance, unknown, "The last identified mark is historical and no current price is evidenced."]
    notes: "Assessment reflects retained public sources through 2026-10-22; unknown means the evidence is insufficient, not zero value."
    claimRefs: [CV001, CV005, CV012, CV013]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Argument, Supporting evidence, What would change the view]
    rows:
      - ["Scaled SME platform", "Debt financing, historical loan volume, and multi-product platform evidence.", "Current cohort economics and repeat usage would validate durable scale."]
      - ["Institutional funding access", "Goldman Sachs, JPMorgan Chase, Afore Sura Mexico, and IDB Invest records.", "Facility pricing, covenants, utilization, and refinancing dependence."]
      - ["Product expansion upside", "Business cards, payments, software, and a proposed banking-license transition.", "License approval, deposits, adoption, and controlled operating execution."]
      - ["Valuation risk", "US$1.3 billion mark is identified for September 2021, not the current date.", "Current transaction price, cap table, preferences, and normalized earnings."]
      - ["Unit-economics downside", "An adverse source is explicitly focused on Konfío unit economics.", "Audited cohort losses, recoveries, reserves, and contribution margins."]
    notes: "The table separates company or partner claims from independent and adverse evidence; it does not infer a comparable-company multiple."
    claimRefs: [CV002, CV003, CV005, CV006, CV007, CV012]
  - id: TV003
    title: Bull, base, and bear scenarios
    columns: [Scenario, Operating assumptions, Valuation / return logic, Key risks, Probability signal]
    rows:
      - [Bull, "Credit losses are controlled; funding remains available; banking execution adds deposits and product cross-sell.", "A current price could be justified only if normalized earnings and growth support the required return.", "Regulatory execution and loss volatility.", "Possible but unverified."]
      - [Base, "Platform remains relevant to Mexican SMEs, but current economics and financing terms stay only partly disclosed.", "Require a negotiated entry discount and verified loan-book economics; no numeric range is supportable.", "Information asymmetry and refinancing terms.", "Most defensible pending diligence."]
      - [Bear, "Losses, funding costs, or license delays weaken growth and capital efficiency.", "Downside is permanent impairment or dilution if refinancing and losses exceed available support.", "Credit deterioration, down-round risk, and delayed license.", "Material risk; not quantified."]
    notes: "Scenarios are qualitative because the pool does not disclose current revenue, margins, loss curves, cap table, preference stack, or transaction price."
    claimRefs: [CV005, CV007, CV008, CV010, CV012, CV015]

