company:
  name: Konfío
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Konfío is a Mexico-focused SME-finance platform that combines digital lending,
    business payments, and a corporate card proposition. The evidence supports a
    substantial private-company financing history and institutional backing, while
    current revenue, credit performance, governance detail, and the outcome of its
    banking-license effort remain incompletely disclosed.
sections:
  - id: identity-and-business-model
    title: Identity and business model
    body: >-
      The available evidence consistently places Konfío in Mexico's small-business
      finance market, but dates its founding differently. A 2026 company-distributed
      release says David Arana and Francisco Padilla founded the fintech in 2013,
      whereas Tracxn records a 2014 founding. The World Economic Forum separately
      dates the first product launch to 2014; that does not resolve whether 2013 is
      the incorporation year and 2014 the operating launch. A company-distributed
      release says the offering expanded beyond lending into corporate credit cards
      and point-of-sale solutions, while investor Kaszek describes an integrated
      platform spanning financial services, software, and payments. The official
      site identifies Red Amigo DAL as a SOFOM, ENR and gives a Miguel Hidalgo,
      Mexico City address, but its fetched text is primarily a legal footer rather
      than a complete current product or corporate profile.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006, CO007]
    tableRefs: [TO001]
  - id: leadership-and-stakeholders
    title: Leadership, governance, and stakeholders
    body: >-
      The retained evidence names David Arana and Francisco Padilla as founders, and
      Tracxn identifies Arana as co-founder and CEO. It does not provide a complete
      current executive roster, board composition, committee structure, succession
      plan, or documented leadership-change history. That gap is material for a
      lending platform whose credit, compliance, funding, and prospective banking
      operations depend on institutional controls rather than founder continuity
      alone. Stakeholder evidence is stronger: Tracxn lists QED Investors, Tarsadia,
      IFC, VEF, Kaszek, Lightrock, and SoftBank Group around the 2021 Series E, while
      IDB Invest records a contemplated facility for a trust purchasing
      Konfío-sourced MSME loans. These relationships show institutional reach, but
      they do not disclose the current cap table, board rights, covenants, or control
      positions.
    claimRefs: [CO001, CO008, CO009, CO015]
    tableRefs: [TO002, TO003]
  - id: funding-scale-and-milestones
    title: Funding, scale, and milestone chronology
    body: >-
      Tracxn reports $378 million of total funding across 11 rounds, including a
      $110 million Series E on September 29, 2021 at a $1.3 billion post-money
      valuation and a $10 million conventional-debt round on May 19, 2022. Those
      figures are database-reported and should not be treated as current cash
      available, current valuation, or audited capitalization. The same source
      displays 1,134 employees "as of May 26" without specifying a year, so it
      cannot support a May 2026 headcount. The company-distributed March 2026 release
      says Konfío applied for a banking license; no retained regulator source
      confirms approval or timing. IDB Invest's earlier record shows a 2019
      contemplated $40 million facility. The evidence therefore supports a
      substantial historical financing base and a proposed strategic transition,
      but not current revenue, liquidity, credit performance, license outcome, or
      the economics of a banking conversion.
    claimRefs: [CO009, CO010, CO011, CO012, CO013, CO014]
    figureRefs: [FO001]
