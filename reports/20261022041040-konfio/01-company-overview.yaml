callouts:
  - calloutType: strength
    title: Institutional financing base
    body: >-
      The evidence supports meaningful institutional participation, including a
      reported 2021 Series E, development-finance relationships, and later debt
      financing, although current terms remain private.
    claimRefs: [CO008, CO009, CO010, CO011, CO012]
  - calloutType: risk
    title: Current operating and governance visibility
    body: >-
      Current revenue, credit performance, board structure, cap table, debt
      covenants, and banking-license status are not established by the assigned
      public evidence and should remain diligence priorities.
    claimRefs: [CO013, CO014, CO016]
