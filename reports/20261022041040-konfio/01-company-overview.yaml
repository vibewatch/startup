    notes: >-
      The assigned evidence does not enumerate a complete current leadership team or
      board; the table is a sourced minimum, not an exhaustive governance register.
    claimRefs: [CO001, CO015]
  - id: TO003
    title: Stakeholder or investor map
    enumerationScope:
      coverage: partial
      basis: "Institutional and regulatory stakeholders named in retained sources; current cap table unavailable"
    columns: [Stakeholder, Role, Control or economic importance, Diligence ask]
    rows:
      - [QED Investors, "Series E investor", "Institutional equity investor listed by Tracxn", "Confirm current ownership and preference rights"]
      - [Tarsadia, "Series E lead investor", "Lead investor listed for the 2021 $110M round", "Confirm board, consent, and liquidation terms"]
      - [IFC, "Investor / development-finance stakeholder", "Listed among Series E participants and institutional backers", "Confirm current exposure and covenants"]
      - [IDB Invest, "Contemplated financing provider", "2019 record describes a guaranteed facility of up to $40M equivalent", "Verify whether facility closed, remains outstanding, and its collateral structure"]
      - [CNBV / Mexican financial authorities, "Supervisory and licensing stakeholders", "Official site identifies the SOFOM legal form; 2026 release says a banking-license application was made", "Obtain application status, conditions, and control-readiness plan"]
    notes: >-
      Investor and stakeholder roles are limited to what the retained sources state;
      no current cap table, debt covenant schedule, or license decision was disclosed.
    claimRefs: [CO003, CO008, CO009, CO012, CO014]
