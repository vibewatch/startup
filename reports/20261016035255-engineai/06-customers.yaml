schemaVersion: "report-v2"
artifact: customers
slug: engineai
runDate: 2026-10-16
company:
  name: EngineAI
chapter:
  number: 6
  title: Customers
  summary: >-
    EngineAI has moved beyond pure demo-stage visibility into initial home-market shipment proof:
    company and independent sources say the first T800 batch left the Shenzhen line in May 2026 and
    the line is set up for rapid output. The customer picture is still early and thin, though, because
    public evidence mostly shows target segments, quote channels, retail placements, and factory-pilot
    surfaces rather than named production customers, retention metrics, or concentration disclosures.
sections:
  - id: customer-segments
    title: Customer segments are visible before customer names are
    body: >-
      The assigned evidence shows where EngineAI is trying to sell before it proves who is already
      buying at scale. Official materials position the T800 toward industrial manufacturing, logistics,
      inspection, commercial-service, research, and education workflows, while independent buyer guides
      narrow the near-term fit toward factory deployment, industrial R&D, and enterprise pilots. That
      is enough to segment the buyer and user base into industrial operators, commercial-service venues,
      and evaluation-oriented research users, but it is not enough to prove durable payer concentration
      or segment-level revenue mix. The strongest cross-source conclusion is that EngineAI has a broad
      top-of-funnel across industrial and evaluation use cases, with weak public disclosure on who the
      paying reference accounts actually are.
    claimRefs: [CU003, CU004, CU008, CU011]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-proof
    title: Shipment proof exists, but adoption metrics remain shallow
    body: >-
      Commercialization evidence has advanced from spectacle to at least initial fulfillment. The
      company said the first T800 batch rolled off the Shenzhen line on 2026-05-29, and multiple
      independent outlets repeated the one-robot-every-15-minutes manufacturing claim. That matters
      because it is stronger than a preorder page or pure CES launch narrative. Even so, the public
      record in this worker pool does not disclose shipped units, active accounts, utilization, backlog,
      customer count, or renewal behavior. Public demand proof therefore rests on supply-side readiness
      and scattered deployment surfaces rather than on denominator-backed adoption metrics.
    claimRefs: [CU001, CU002, CU005, CU011, CU013]
    tableRefs: [TU002, TU003]
  - id: durability-and-concentration
    title: Retention, overseas channel durability, and concentration are still open questions
    body: >-
      The most decision-useful negative signal in the pool is not a churn event but the absence of
      basic durability disclosure. BotInfo describes the T800 as quote-only outside China, says there is
      no manufacturer-appointed North American distributor, and reports no FCC equipment authorization on
      record as of its August 2026 check. The official product page also warns that some example features
      are still under development and that buyers should understand the technology's limitations before
      purchase. Together with independent caution that demo performance is not the same as validated duty
      cycles, these sources imply that overseas rollout, after-sales support, and retention quality are
      not yet publicly proven. No assigned source discloses NRR, GRR, churn, contract term, or top-customer
      exposure, so concentration risk has to stay as an unresolved diligence item rather than a quantified conclusion.
    claimRefs: [CU006, CU007, CU009, CU010, CU012]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Scale signal
      - Revenue / strategic value
      - Gap
    rows:
      - - Industrial manufacturers and inspection operators
        - Buyer and payer appear to be enterprise operations teams; users are frontline industrial staff
        - Assembly, logistics, inspection, material handling
        - First batch shipped; factory line built for rapid output
        - Likeliest near-term commercial wedge for T800
        - No named factory customer, contract size, or repeat-order disclosure
      - - Commercial-service venues
        - Buyer likely venue operator or systems integrator; users are service staff
        - Retail "Cyber Staff" and broader commercial services
        - Company cites commercial-service partners; BotInfo says some units were placed in retail stores in Shenzhen
        - Shows segment breadth beyond pure factory use
        - Placement evidence does not disclose payer identity, unit count, or renewal
      - - Education and research users
        - Buyer and payer appear to be universities or R&D labs; users are researchers and developers
        - Research, education, secondary development
        - Quote-only Eco edition and UKRL access path discussed by BotInfo
        - Useful ecosystem seeding and developer familiarity
        - Access path can be free or evaluation-oriented rather than recurring revenue
      - - Overseas evaluators
        - Buyer is procurement lead; users are evaluation teams; payer uncertain
        - Quote requests for non-China delivery
        - BotInfo handles written quotes, purchase orders, and net terms outside China
        - Tests export demand without local channel buildout
        - No disclosed foreign shipments, distributor network, or local service footprint
    notes: >-
      Public evidence identifies target segments and channel surfaces, not segment revenue mix; "scale
      signal" reflects disclosed shipment or availability proof rather than verified account count.
    claimRefs: [CU003, CU004, CU008, CU011]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Home-market shipment status
        - First batch of T800 units rolled off Shenzhen line; mass delivery began
        - "2026-05-29"
        - EngineAI release; BotInfo recap
        - High
        - Stronger than preorder proof because shipment is claimed to be live
        - Units shipped, customers served, and reorder behavior
      - - Production cadence
        - About one robot every 15 minutes on the Shenzhen line
        - "2026-05 to 2026-10 public record"
        - Robot D; Interesting Engineering; RobotsBeat
        - Medium
        - Suggests manufacturing readiness for enterprise demand
        - Actual uptime, utilization, and sell-through
      - - Capacity expansion plan
        - Shenzhen ramp plus planned 10,000-unit Zhengzhou line
        - "2026-05 public reporting"
        - Robot D; Interesting Engineering; RobotsBeat
        - Medium
        - Signals supply-side ambition and broader market-service intent
        - Signed backlog and committed customer volumes
      - - Overseas commercial path
        - Quote-only outside China; no published US price or North American distributor
        - "2026-10 update"
        - BotInfo
        - Medium
        - Limits proof that current demand is portable into Western channels
        - Conversion from quotes to deliveries and support response times
    notes: >-
      The table mixes shipment proof, production cadence, and channel status because the pool lacks
      customer-count, cohort, or utilization disclosures; missing-denominator entries mark what is still
      required before treating these signals as adoption metrics.
    claimRefs: [CU001, CU002, CU006, CU007, CU013]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer / proof surface
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - - Retail stores in Shenzhen
        - Commercial services
        - Retail "Cyber Staff"
        - Early production placement
        - BotInfo says some T800 units have been placed in retail stores in Shenzhen
        - Store operator, unit count, contract structure, and repeat usage are undisclosed
      - - Universities and R&D labs
        - Education / research
        - Research and secondary development via Eco edition or UKRL access
        - Evaluation or pilot access
        - BotInfo says the Eco edition is suitable for universities and R&D labs and that UKRL can provide access
        - Access path is not the same as a named paying production customer
      - - Unnamed factory users
        - Industrial manufacturing
        - Factory pilots, inspection, material handling
        - Shipment plus pilot-stage proof
        - Company and third-party sources show first-batch shipments and factory-focused use cases
        - No named factory customer, no production KPI, and no renewal evidence
    notes: >-
      This enumeration is intentionally partial because the assigned public record does not disclose
      named paying customers; rows capture the best available proof surfaces rather than validated
      enterprise references.
    enumerationScope:
      coverage: partial
      basis: >-
        Partial enumeration of public customer-proof surfaces visible in the assigned prefetched pool as
        of 2026-10-16; EngineAI does not publicly list named production customers in these sources.
    claimRefs: [CU004, CU005, CU006, CU011, CU012]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      The evidence supports a staged path from ecosystem awareness into home-market shipment, with the
      biggest drop-off at named references and overseas support proof.
    data:
      items:
        - label: CES awareness and evaluation
          tone: neutral
          actor: Industry partners, developers, media
          phase: Top of funnel
          channel: CES 2026 demonstrations
          touchpoints:
            - Booth demos generated "significant interest" and technical exchanges.
            - Interest validates awareness, not paid deployment.
        - label: Official segment positioning
          tone: neutral
          actor: Industrial, service, education, research prospects
          phase: Solution fit
          channel: Product and press materials
          touchpoints:
            - EngineAI positions T800 across industrial, commercial-service, research, and education contexts.
            - Segment breadth is visible before named customer depth.
        - label: China home-market fulfillment
          tone: positive
          actor: Domestic buyers
          phase: Initial commercial conversion
          channel: Shenzhen manufacturing base
          touchpoints:
            - First batch shipped from Shenzhen in May 2026.
            - Delivery proof is stronger than a preorder narrative.
        - label: Early deployment surfaces
          tone: positive
          actor: Retail venues and factory evaluators
          phase: Usage proof
          channel: Retail placements and factory pilots
          touchpoints:
            - Public proof surfaces include retail placements in Shenzhen and factory-pilot framing.
            - Named paying accounts remain undisclosed.
        - label: Overseas quote path
          tone: risk
          actor: Non-China buyers
          phase: Procurement friction
          channel: BotInfo quote desk
          touchpoints:
            - Outside China the T800 is quote-only.
            - No published US price or appointed North American distributor is disclosed.
        - label: Durable expansion proof
          tone: risk
          actor: Existing customers and follow-on buyers
          phase: Renewal and scale
          channel: Not publicly evidenced
          touchpoints:
            - No public NRR, GRR, churn, contract-length, or concentration metrics appear in the assigned pool.
            - This is the main missing link between shipment claims and durable customer quality.
    approximationNotes: null
    claimRefs: [CU004, CU006, CU011, CU012]
