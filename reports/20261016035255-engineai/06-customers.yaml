      relatedQuestionRefs: [QU004]
      relatedTableRefs: [TU003]
    - type: missing-source
      severity: material
      topic: retention-and-concentration-gap
      missingEvidence: NRR, GRR, churn, renewal timing, contract length, and top-customer revenue concentration
      whyItMatters: Without retention and concentration data, customer quality cannot be distinguished from one-time pilot demand
      diligencePath: Obtain cohort, renewal, and concentration schedules from management and reconcile them to signed contracts or invoicing records
      relatedQuestionRefs: [QU005, QU008]
