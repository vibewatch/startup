      severity: material
      topic: overseas-channel-readiness
      missingEvidence: Foreign shipment counts, distributor terms, support SLAs, and radio-compliance documentation for export markets
      whyItMatters: Quote-only overseas access does not prove that EngineAI can convert interest into durable international deployments
      diligencePath: Ask for export compliance files, distributor or direct-support arrangements, and completed overseas delivery references by region
