  evidenceGaps:
    - type: missing-source
      severity: material
      topic: certification-proof
      missingEvidence: Named CE, UL, or Chinese industrial safety certificate numbers and the underlying test documents for the T800 SKUs marketed for industrial use.
      whyItMatters: Third-party certification evidence is needed to separate commercial positioning from actually approved deployment scope and compliance readiness.
      diligencePath: Request certificate IDs, covered SKUs, and issuing bodies from EngineAI, then verify them against certifier or regulator records.
      relatedQuestionRefs: [QE006, QE008]
    - type: private-evidence-only
      severity: material
      topic: developer-tooling
      missingEvidence: Public SDK/API documentation, version history, sample integrations, and support artifacts for the trims that advertise secondary development.
      whyItMatters: Integration readiness and developer lock-in risk cannot be underwritten from a secondary-development checkbox alone.
      diligencePath: Request access to the SDK portal, API references, release notes, and a live integration example from a pilot customer or systems integrator.
      relatedQuestionRefs: [QE003, QE007]
    - type: missing-source
      severity: material
      topic: field-reliability
      missingEvidence: Measured uptime, MTBF, service response SLAs, and named long-duration production deployment references for T800 installations.
      whyItMatters: Factory QA and spec disclosures do not show whether the robot sustains industrial duty cycles after shipment.
      diligencePath: Obtain pilot logs, warranty/service metrics, and named deployment references with operating hours and failure history.
      relatedQuestionRefs: [QE004, QE008]
