      - Current workflow
      - Company solution
      - Measurable benefit
      - Limitation
    rows:
      - ["Factory collaboration / material handling", "Repetitive heavy lifting, transfer, and line-side assistance", "Full-size humanoid with high-torque joints and industrial-grade bearings", "Up to 450 N·m torque; marketed 3-5h battery life", "No public throughput, error-rate, or named production customer data"]
      - ["Warehouse / logistics mobility", "Move goods across human-scale aisles and mixed environments", "173 cm biped with marketed 3 m/s mobility and 4-5h endurance envelope", "3 m/s listed by independent catalogs; 4-5h runtime repeatedly cited", "No public picking accuracy, uptime, or shift-level utilization proof"]
      - ["Retail / service assistance", "Customer guidance and in-store support", "Human-scale humanoid marketed for retail, hotel service, and commercial roles", "173 cm body and omnidirectional sensing aim to fit human environments", "No disclosed service KPI, staffing ROI, or deployment count"]
      - ["R&D / extreme algorithm testing", "Evaluate locomotion, balance, and manipulation under stress", "Open Source / higher trims plus highly dynamic motions and dexterous hands", "25-46 DOF range and 450 N·m power envelope", "No public SDK/API detail or benchmarked autonomy stack"]
    notes: >-
      Benefits are preserved as disclosed specs or marketed operating envelopes,
      not audited customer outcomes; public evidence for production economics and
      repeatability is still thin.
    claimRefs: [CE001, CE003, CE004, CE006, CE007, CE008, CE009, CE012]
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / process
      - Role
      - Dependency
      - Risk
    rows:
      - ["Actuation and joints", "Self-developed joint modules, high-speed motors, and high-load bearings convert compute into full-body motion", "In-house mechatronics and thermal design", "No public cycle-life, maintenance interval, or field failure-rate data"]
      - [Perception, "Binocular cameras, 3D LiDAR, and depth-camera summaries provide environment sensing", "Sensor fusion quality and calibration", "No public perception benchmark, obstacle-case test set, or safety envelope"]
      - [Compute and control, "Edge compute ranges from Orin NX 16G to AGX Orin 64G with higher-trim upgrade path", "NVIDIA/Intel compute stack and internal autonomy software", "No public model stack, latency, or fallback-mode disclosure"]
      - ["Power and thermal", "Modular battery pack plus active cooling aims to sustain high-load operation", "Battery chemistry, cooling performance, and swap/service process", "No third-party duty-cycle validation or degradation data"]
      - ["Manufacturing and QA", "Shenzhen plant integrates assembly, testing, logistics, and after-sales workflow", "Factory ramp, component supply, and QA discipline", "No public scrap rate, warranty claim rate, or supplier concentration detail"]
      - ["Support and extensibility", "Higher trims advertise secondary development and connectivity for updates/monitoring", "SDK/API availability and post-sale support resources", "No public documentation portal, release-note cadence, or support SLA"]
    notes: >-
      The retained evidence is strongest on hardware disclosure and weakest on
      software, integration, and support-process detail, so several risks are
      diligence asks rather than contradicted facts.
    claimRefs: [CE004, CE005, CE006, CE007, CE008, CE009, CE010, CE011, CE013, CE014]
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      The public product stack is legible from workflow-facing trims down to
      mechatronics, sensing, compute, power, and factory QA, but software and
      support detail remains sparse.
    data:
      layers:
        - label: Workflow layer
          detail: Factory collaboration, logistics, retail/service, and R&D testbed positioning.
          modules:
            - Heavy industrial assistance
            - Warehouse mobility
            - Commercial service
            - Dynamic research / demonstrations
        - label: Commercial configuration layer
          detail: Basic, Open Source, Pro, and Max trims segment the same chassis for different access levels.
          modules:
            - Basic
            - Open Source
            - Pro
            - Max
        - label: Motion and actuation layer
          detail: In-house joint modules, high-load bearings, and up to 450 N·m torque anchor locomotion and manipulation.
          outputs:
            - 25-46 total DOF depending on trim
            - 7-DOF dexterous hands on higher trims
            - Up to 3 m/s listed mobility
        - label: Perception layer
          detail: Official materials disclose binocular cameras and 3D LiDAR on higher trims, with independent summaries adding depth-camera references.
          outputs:
            - Binocular cameras
            - 3D LiDAR
            - Omnidirectional sensing references
        - label: Compute and power layer
          detail: Edge AI compute, modular batteries, and active cooling are the core operating envelope.
          outputs:
            - Orin NX 16G on Basic
            - AGX Orin 64G on higher trims
            - 3-5h marketed battery life
            - Full-leg active cooling
        - label: Industrialization layer
          detail: The Shenzhen plant and pre-shipment QA process are the main public signals that the product is moving toward scaled delivery.
          outputs:
            - 79 quality checks
            - 46 simulation tests
            - One robot every 15 minutes
            - After-sales workflow inside the plant
    approximationNotes: >-
      This is a disclosure map, not a software architecture or control-loop
      diagram; public evidence does not expose middleware, model topology, or
      safety-case internals.
    claimRefs: [CE001, CE002, CE004, CE005, CE006, CE007, CE008, CE009, CE010, CE011]
