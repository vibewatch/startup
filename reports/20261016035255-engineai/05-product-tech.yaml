schemaVersion: "report-v2"
artifact: product-tech
slug: engineai
runDate: 2026-10-16
company:
  name: EngineAI
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    EngineAI's T800 is presented as a full-size, general-purpose humanoid sold
    into factory, logistics, retail, and service workflows, with unusually
    specific public disclosures on trim structure, actuation, sensing, and
    cooling for a young robotics company. The strongest product signal is that
    EngineAI pairs that spec detail with a Shenzhen production ramp and named
    QA workflow, but the public record still lacks third-party certification
    proof, public SDK/API detail, and field reliability data that would turn a
    strong demo platform into a fully underwritten industrial deployment story.
sections:
  - id: commercial-scope
    title: Commercial scope and workflow fit
    body: |-
      T800 is not disclosed as a single-purpose showpiece. Across the official
      product page and independent catalogs, EngineAI positions it as a
      full-size general-purpose humanoid for factory collaboration, logistics,
      retail, hotel-service, and research or demonstration use cases. The
      configuration structure matters because it suggests EngineAI is already
      segmenting the platform for different buyer types rather than selling one
      monolithic robot: the official page shows Basic, Open Source, Pro, and Max
      trims, with higher versions adding more degrees of freedom, dexterous
      hands, 3D LiDAR, and secondary-development support. Entry pricing around
      CNY 180,000 or about $25,000 is aggressive for a 173 cm full-size
      humanoid, but the public materials still stop at spec-sheet positioning
      rather than documented production customer outcomes.
    claimRefs: [CE001, CE002, CE003, CE012]
    tableRefs: [TE002, TE001]
  - id: disclosed-stack
    title: Disclosed stack and operating model
    body: |-
      Public disclosures give a more concrete hardware picture than a typical
      early-stage robotics page, but they remain much thinner on software and
      integration. Official materials repeatedly anchor the robot on up to
      450 N·m peak torque, 173 cm height, full-leg active cooling, and roughly
      4-5 hours of marketed endurance, while the higher trims add binocular
      cameras, 3D LiDAR, AGX Orin compute, and secondary-development support.
      Independent summaries add detail such as Intel depth-camera references,
      omnidirectional sensing, and connectivity for remote monitoring, which is
      directionally helpful but not equivalent to seeing released SDKs,
      reference integrations, or measured autonomy benchmarks. The result is a
      visible mechatronic stack with a still-opaque application software stack.
    claimRefs: [CE003, CE004, CE005, CE006, CE007, CE008, CE009]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity-controls-gaps
    title: Maturity signals, controls, and open risks
    body: |-
      The most credible maturity signal in the retained evidence is EngineAI's
      move from product-page rhetoric to disclosed factory operations.
      RobotsBeat reports a Shenzhen facility that integrates assembly,
      pre-shipment testing, logistics, and after-sales service, with each unit
      passing 79 quality checks and 46 simulation tests before shipment. That
      is a stronger operating signal than a pure prototype reveal, but it does
      not fully close the diligence gap. The official page still says some
      example features remain under development, testing, and refinement, and
      public sources do not provide a primary certification document, public
      SDK/API release surface, uptime data, or support SLA. Even maturity labels
      conflict across independent directories, reinforcing that the
      commercialization story is moving faster than the public proof package.
    claimRefs: [CE010, CE011, CE013, CE014, CE015, CE016]
callouts:
  - calloutType: strength
    title: Stronger-than-usual public hardware disclosure
    body: >-
      EngineAI publicly discloses trim-by-trim mechanical, sensing, battery, and
      compute details, which is deeper than many humanoid vendors that stay at
      the demo-video level.
    claimRefs: [CE002, CE004, CE005, CE006, CE008]
  - calloutType: risk
    title: Commercial proof still trails the spec sheet
    body: >-
      The public record shows manufacturing ramp signals, but it still lacks
      third-party certification proof, public developer tooling, and field
      reliability data, while independent maturity labels remain inconsistent.
    claimRefs: [CE010, CE013, CE015, CE016]
