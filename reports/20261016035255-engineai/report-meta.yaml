  topStrengths:
    - Factory launch and first-batch shipment evidence show the company is beyond pure demo theater.
    - Reported $200 million Series B and manufacturing partnerships provide capital and execution credibility.
    - The T800 gives EngineAI a visible flagship product with clear industrial positioning.
  topRisks:
    - Public revenue, backlog, and margin disclosure remain absent.
    - Certification and jurisdiction-specific compliance evidence is still incomplete.
    - Named customer adoption and post-sale support proof remain thin.
    - Valuation depends on scale expectations that have not yet been fully proven commercially.
  unresolvedGaps:
    - No verified commercial deployment unit count or active recurring customer contract disclosed as of October 2026
    - >-
      No formal safety certification (CE, UL, or Chinese GB standard) documentation identified in public record for T800
      industrial use
    - HKEX IPO filing is confidential — timeline, pricing band, and pre-IPO investor lock-up terms unknown
    - Revenue visibility absent — no commercial contract values, pricing realization, or gross margin data disclosed
    - Founding team depth and succession plan not publicly documented
