companyProfile:
  summary: >-
    EngineAI is a Shenzhen-based humanoid robotics company that has moved from viral product demos into a late private
    scale-up phase anchored by the T800 flagship, a reported $200 million Series B, and a public manufacturing ramp. The
    company still lacks broad public disclosure on revenue, customer count, headcount, and formal certification
    packages, so its commercial progress is easier to observe than to underwrite.
