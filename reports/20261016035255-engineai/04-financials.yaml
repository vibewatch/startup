      - ["After-sales / deployment services", "Industrial deployment, testing, logistics, and after-sales workflow imply service revenue potential", "project / annual service", "No public fee schedule or attach rate", "Low — service need is evident, revenue capture is not", "Request service pricing, spare-parts revenue, and support gross margin"]
