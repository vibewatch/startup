    claimRefs: [CI003, CI005, CI006, CI007, CI012, CI013]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Offer / route
      - Price / unit / contract
      - List vs realized pricing
      - Discounts / unknowns
      - Source
    rows:
      - ["T800 home-market launch", "CNY 180,000 starting list price", "List price only", "Realized transaction price, deposits, and payment timing undisclosed", "EngineAI launch article; BotInfo"]
      - ["Overseas BotInfo route", "Quote only", "No public US list price", "Landed cost depends on shipping, duties, compliance, and support", "BotInfo"]
      - ["RobotSourced dollar framing", "$25,000 converted launch anchor", "Derived from RMB 180,000 launch price", "Configuration, dexterous hands, and Western shipping/duties extra", "RobotSourced"]
      - ["Pro / Enhanced edition", "Not publicly priced", "Higher-spec tier announced but no posted ASP", "Compute and perception upsell economics undisclosed", "EngineAI launch article"]
      - ["Max / Flagship edition", "Not publicly priced", "Industrial-grade tier announced but no posted ASP", "Duty-cycle economics, warranty burden, and support package unknown", "EngineAI launch article"]
    notes: "Rows separate list-price anchors from channels where realized pricing is unavailable; unknown means undisclosed, not zero."
    claimRefs: [CI005, CI006, CI007]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - ["Public revenue disclosure", null, "Low", "Without disclosed revenue, investors cannot test absorption of factory fixed costs", "Request monthly revenue, bookings, and contract value by robot family"]
      - ["Gross margin / BOM", null, "Low", "Battery, cooling, sensors, actuators, and field support likely drive a heavy hardware cost stack", "Request BOM, warranty reserve, service gross margin, and yield assumptions"]
      - ["Factory throughput proxy", "≈1 robot every 15 minutes; 10,000-unit initial capacity target", "Medium", "Utilization drives whether manufacturing scale improves or damages unit economics", "Request actual line yield, utilization, scrap, and rework rates"]
      - ["Export ASP realization", null, "Low", "Quote-only routing means list price is a weak proxy for realized price", "Request recent quotations, dealer margin, and win/loss conversion data"]
      - ["Working capital / inventory", null, "Low", "Hardware manufacturing can trap cash in inventory, receivables, and component commitments", "Request inventory turns, supplier terms, and receivable aging"]
      - ["Cash runway / debt obligations", null, "Low", "Series B and IPO intent show financing activity but not capital adequacy", "Request cash balance, monthly burn, debt facilities, and covenant headroom"]
    notes: "Null values mean the assigned public evidence does not disclose the metric; the throughput row is a public proxy, not a realized unit-economics outcome."
    claimRefs: [CI001, CI002, CI004, CI006, CI009, CI011, CI015]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: "Public evidence shows how announced product pricing becomes shipped hardware, but not how it converts into realized margin."
    data:
      nodes:
        - id: sku-ladder
          label: Four-edition product ladder
          detail: "Basic, Eco/Open Source, Pro, and Max widen willingness-to-pay capture, but per-edition ASPs are not public."
        - id: home-market-price
          label: Home-market list price from CNY 180k
          detail: "Official launch pricing anchors the entry point, not the blended realized ASP."
        - id: export-route
          label: Overseas monetization is quote-led
          detail: "BotInfo posts no US list price, and third-party coverage says shipping, duties, and configuration are extra."
        - id: factory-output
          label: Shenzhen line converts orders into shipped units
          detail: "First-batch shipments started in 2026, with public throughput targets of roughly one robot every 15 minutes."
        - id: gross-profit
          label: Gross profit depends on utilization and service burden
          detail: "Cooling, battery, sensors, and after-sales workflow suggest hardware absorption is the key margin variable."
        - id: disclosure-gap
          label: Public underwriting stops at disclosure gaps
          detail: "Revenue, gross margin, cash balance, CAC/payback, and customer concentration are not disclosed publicly."
      edges:
        - from: sku-ladder
          to: home-market-price
          label: "SKU mix shapes the headline price ladder"
        - from: home-market-price
          to: export-route
          label: "Export channels do not publish a posted realized price"
        - from: export-route
          to: factory-output
          label: "Quote conversion must translate into shipped units"
        - from: factory-output
          to: gross-profit
          label: "Utilization determines fixed-cost absorption"
        - from: gross-profit
          to: disclosure-gap
          label: "Missing KPIs block a clean underwrite"
    claimRefs: [CI004, CI005, CI006, CI007, CI009, CI015]
callouts:
  - calloutType: insight
    title: Public monetization is hardware-first
    body: >-
      The cleanest public revenue evidence is a hardware price ladder plus a quote-led
      export route; there is no public indication that EngineAI already has software-like
      recurring revenue or a disclosed service attach rate large enough to change that
      profile.
    claimRefs: [CI005, CI006, CI007, CI009]
  - calloutType: risk
    title: Capital adequacy cannot be proven from public evidence yet
    body: >-
      The Series B, factory build-out, and IPO filing show access to capital, but the
      public record still lacks the cash-balance, burn, backlog, and margin disclosures
      needed to judge whether that capital is enough to reach self-funding scale.
    claimRefs: [CI001, CI002, CI011, CI014, CI015]
