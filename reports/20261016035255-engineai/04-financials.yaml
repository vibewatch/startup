schemaVersion: "report-v2"
artifact: financials
slug: engineai
runDate: 2026-10-16
company:
  name: EngineAI
chapter:
  number: 4
  title: Financials
  summary: >-
    EngineAI's public financial story is still a forward-looking hardware scale-up rather
    than an underwritten operating model. Official and independent sources support a
    180,000-yuan starting list price, first-batch T800 shipments from Shenzhen, and a
    confidential Hong Kong IPO after a $200 million Series B, but they do not disclose
    revenue, gross margin, CAC/payback, cash balance, or customer concentration.
sections:
  - id: revenue-model-and-pricing
    title: Revenue model and pricing visibility
    body: >-
      The public monetization evidence points to a hardware-first model built around
      selling T800 humanoid units rather than a software-led recurring-revenue story.
      EngineAI's launch materials say the T800 line starts at 180,000 yuan and spans
      four editions, while BotInfo says overseas buyers must request a quote and that it
      does not publish a US price. RobotSourced adds that the often-cited $25,000 figure
      is only a currency-converted launch anchor and excludes shipping, duties, and
      configuration upgrades. That leaves a usable list-price floor but no public view
      into realized ASP, discounting, deposits, service attach, or export channel margin.
      Public revenue quality is therefore not yet underwritten by disclosed bookings,
      contract values, or recognized revenue. 
    claimRefs: [CI005, CI006, CI007, CI009, CI010, CI015]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: delivery-economics-and-traction
    title: Delivery economics and public traction proxies
    body: >-
      Public traction is visible mainly through manufacturing readiness and shipment
      start, not through customer or margin disclosure. TNW, BotInfo, and RobotsBeat
      each report that EngineAI opened its Shenzhen factory and shipped the first batch
      of T800 units around the turn of June 2026. RobotsBeat and BotInfo also describe a
      line cadence of roughly one robot every 15 minutes, with RobotsBeat citing up to
      10,000 units of initial capacity. EngineAI's own product page highlights a
      full-size humanoid with active cooling, LiDAR/camera sensing, and multi-hour
      battery runtime, which supports the view that cost of goods, field support, and
      utilization are the key financial variables. Those variables remain opaque because
      public sources do not disclose gross margin, yield, warranty reserves, or line
      utilization. 
    claimRefs: [CI003, CI004, CI008, CI009, CI012, CI013, CI015]
    tableRefs: [TI003]
  - id: capital-needs-and-underwriting-gaps
    title: Capital needs and underwriting gaps
    body: >-
      As referenced in Company Overview, EngineAI's funding chronology culminated in an
      April 2026 Series B; the financial question here is whether that capital is enough
      to bridge from factory launch to repeatable demand. Bloomberg and TNW reported a
      confidential Hong Kong IPO filing in June 2026, and RobotsBeat says Series B
      proceeds are being directed to manufacturing expansion, research, and commercial
      deployment. That combination implies the company is still financing scale-up, not
      yet demonstrating self-funded operating leverage. The most important adverse signal
      is TNW's warning that supply is racing ahead of proven demand in a crowded humanoid
      market. Without public revenue, backlog, cash-balance, burn, debt, or customer
      concentration data, investors cannot reliably underwrite runway or the margin path
      from prototype economics to industrial deployment. 
    claimRefs: [CI001, CI002, CI011, CI014, CI015]
