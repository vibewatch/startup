company:
  name: EngineAI
chapter:
  number: 8
  title: Valuation
  summary: >-
    Public evidence supports EngineAI as a credible, well-funded humanoid robotics
    contender, but the valuation case still rests on a 2026 private mark, early
    factory shipments, and product-level excitement rather than disclosed recurring
    economics. That keeps the most supportable call at track with medium confidence
    and a stretched valuation stance until repeat orders, revenue visibility, and
    IPO terms become public.
sections:
  - id: current-mark-and-support
    title: What the current mark is buying
    body: >-
      The current public valuation context is clear enough to anchor discipline but
      not clear enough to justify paying a premium. Independent 2026 reporting
      places EngineAI's latest private mark above RMB10 billion, framed at roughly
      $1.4 billion to $1.5 billion depending on source and FX convention, after a
      reported $200 million Series B. That mark is not detached from operating
      progress: the company has opened a Shenzhen factory, reported first T800
      shipments, and positioned the line for much higher output. Even so, the same
      public record remains thin on recurring revenue, customer count, gross
      margin, and contract value. The valuation therefore reflects option value on
      industrial humanoid adoption and financing momentum more than disclosed
      commercial proof.
    claimRefs: [CV001, CV002, CV004, CV009, CV010]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: recommendation-and-entry-discipline
    title: Recommendation, confidence, and entry discipline
    body: >-
      The investable tension is that EngineAI looks increasingly real as a
      manufacturer while still looking early as a business. The official product
      and third-party coverage support the view that T800 is a serious platform on
      specifications, pricing ambition, and scale-up intent. However, quote-only
      overseas channels, reported FCC-authorization uncertainty in the United
      States, and independent warnings that viral demos are not the same as
      validated industrial duty cycles all weaken the case for paying above the
      last private mark today. On that evidence, the right posture is to track the
      company and underwrite only at or below the last known range unless new
      disclosures prove repeat demand and monetization quality.
    claimRefs: [CV005, CV006, CV007, CV008, CV011, CV012]
    tableRefs: [TV002]
  - id: scenario-framing
    title: Bull, base, and bear framing
    body: >-
      Scenario framing should stay qualitative because public evidence is still
      missing the variables that would make tighter math credible. The bull case is
      not simply that humanoid robotics is exciting; it is that first shipments,
      manufacturing throughput, and financing access convert into disclosed repeat
      orders and clean IPO execution. The base case keeps the company around its
      last reported private mark while investors wait for revenue and customer
      proof. The bear case is a stalled IPO or financing reset before those proof
      points appear, which would expose the valuation to down-round or structured
      terms risk. Those cases are more decision-useful than false precision.
    claimRefs: [CV001, CV004, CV009, CV010, CV013, CV014]
    tableRefs: [TV003]
  - id: exit-readiness-and-diligence
    title: Exit readiness and final diligence asks
    body: >-
      Exit optionality exists, but the public trail still looks like financing
      readiness rather than exit readiness. A confidential Hong Kong filing can be
      directionally positive because it tests market appetite and may create a
      liquid benchmark, yet it does not answer the questions that matter most for
      underwriting: order quality, conversion from pilots to production use,
      customer concentration, margin structure, and preference-stack discipline.
      The final diligence asks are therefore straightforward: obtain customer
      contracts or at least disclosed order metrics, verify revenue and gross
      margin progression, inspect any IPO or pre-IPO terms for liquidation or
      anti-dilution complexity, and confirm which geographies can actually be
      served compliantly. Until those items move from implied to evidenced, the
      chapter's price-sensitive answer remains cautious.
    claimRefs: [CV007, CV009, CV010, CV012, CV013, CV014]
