      - [Valuation stance, Stretched, "Last private mark is visible; premium justification is not", "Prefer entry at or below the last known range"]
      - [Entry discipline, Price-sensitive, "Upgrade only after repeat orders, revenue disclosure, and cleaner exit terms", "Do not pay for narrative momentum without operating proof"]
    notes: >-
      Recommendation fields synthesize sourced claims; valuation stays qualitative
      because public evidence does not disclose revenue, margins, or IPO terms.
    claimRefs: [CV001, CV004, CV007, CV010, CV012]
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Lens
      - Thesis
      - Anti-thesis
      - What would change the view
    rows:
      - ["Manufacturing proof", "Shenzhen production launch and first shipments show the company is beyond prototype theater", "Throughput capacity is not the same as sustained sell-through or field reliability", "Disclose repeat orders, utilization, and customer references"]
      - ["Product positioning", "T800's published specifications and aggressive home-market starting price can widen adoption interest", "Quote-only overseas availability and compliance uncertainty limit near-term monetization breadth", "Show compliant channel readiness and delivered pricing outside China"]
      - ["Capital access", "A reported $200M Series B and confidential HK IPO filing keep financing optionality open", "IPO secrecy leaves valuation, dilution, and preference overhang unanswered", "Publish cleaner financing or listing terms with no stress signals"]
      - ["Commercial proof", "Pilot-delivery framing and deployment ambitions suggest a route to scale", "Public evidence still lacks revenue, margin, and active-customer disclosure", "Provide contract value, renewal, and unit-economics evidence"]
    notes: >-
      Rows contrast the strongest pro-valuation and anti-valuation evidence rather
      than attempting unsupported numeric weighting.
    claimRefs: [CV002, CV004, CV005, CV006, CV007, CV009, CV010, CV011, CV013]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Core assumptions
      - Valuation / return logic
      - Probability signal
      - Downside trigger
    rows:
      - ["Bull", "First T800 shipments convert into disclosed repeat industrial orders, revenue visibility improves, and the HK IPO process stays open", "Public market optionality and commercialization proof support a premium to the last private mark", "Customer disclosures, revenue evidence, and clean listing terms appear", "Factory ramp outpaces customer proof or financing becomes more structured than expected"]
      - ["Base", "Manufacturing progress continues but public disclosures stay limited to fundraising, pricing, and shipment milestones", "Business merits staying around the last reported private range while investors wait for harder proof", "More product and factory milestones arrive without major negative surprises", "Evidence gap on contracts, margins, and customer count persists too long"]
      - ["Bear", "IPO timing slips or new capital is needed before recurring-economics proof is public", "Valuation resets below the last reported mark or requires investor-protective structure", "Confidential filing remains opaque and proof metrics stay absent", "Down-round, structured financing, or stalled commercialization becomes visible"]
    notes: >-
      Scenario ranges are intentionally directional because the reviewed sources do
      not disclose enough operating data for a tighter model.
    claimRefs: [CV001, CV004, CV007, CV009, CV010, CV014]
