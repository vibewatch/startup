    - type: private-evidence-only
      severity: material
      topic: disclosed-unit-economics
      missingEvidence: "Recurring revenue, gross margin, active customer count, contract value, and renewal data."
      whyItMatters: "Those metrics determine whether the current private mark is growth-backed or still mostly option value on future adoption."
      diligencePath: "Request board or investor materials showing booked orders, revenue bridge, margin profile, and customer concentration."
      relatedQuestionRefs: [QV008]
    - type: private-evidence-only
      severity: material
      topic: capital-structure
      missingEvidence: "IPO timing, pre-IPO round terms, liquidation preferences, anti-dilution clauses, and any structured capital features."
      whyItMatters: "An apparently unchanged headline valuation can still imply weak forward returns if the preference stack or new-money terms are investor-protective."
      diligencePath: "Review draft offering materials or the latest financing documents for share class rights and any pay-to-play or ratchet mechanics."
      relatedQuestionRefs: [QV008]
