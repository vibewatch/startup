      - number: '4.3'
        title: Capital needs and underwriting gaps
        blocks:
          - type: paragraph
            body: >-
              As referenced in Company Overview, EngineAI's funding chronology culminated in an April 2026 Series B; the
              financial question here is whether that capital is enough to bridge from factory launch to repeatable
              demand. Bloomberg and TNW reported a confidential Hong Kong IPO filing in June 2026, and RobotsBeat says
              Series B proceeds are being directed to manufacturing expansion, research, and commercial deployment. That
              combination implies the company is still financing scale-up, not yet demonstrating self-funded operating
              leverage. The most important adverse signal is TNW's warning that supply is racing ahead of proven demand
              in a crowded humanoid market. Without public revenue, backlog, cash-balance, burn, debt, or customer
              concentration data, investors cannot reliably underwrite runway or the margin path from prototype
              economics to industrial deployment. 
            claimRefs:
              - CI001
              - CI002
              - CI011
              - CI014
              - CI015
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Public monetization is hardware-first
            body: >-
              The cleanest public revenue evidence is a hardware price ladder plus a quote-led export route; there is no
              public indication that EngineAI already has software-like recurring revenue or a disclosed service attach
              rate large enough to change that profile.
            calloutType: insight
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI009
          - type: callout
            title: Capital adequacy cannot be proven from public evidence yet
            body: >-
              The Series B, factory build-out, and IPO filing show access to capital, but the public record still lacks
              the cash-balance, burn, backlog, and margin disclosures needed to judge whether that capital is enough to
              reach self-funding scale.
            calloutType: risk
            claimRefs:
              - CI001
              - CI002
              - CI011
