  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence shows how announced product pricing becomes shipped hardware, but not how it converts into
      realized margin.
    data:
      nodes:
        - id: sku-ladder
          label: Four-edition product ladder
          detail: Basic, Eco/Open Source, Pro, and Max widen willingness-to-pay capture, but per-edition ASPs are not public.
        - id: home-market-price
          label: Home-market list price from CNY 180k
          detail: Official launch pricing anchors the entry point, not the blended realized ASP.
        - id: export-route
          label: Overseas monetization is quote-led
          detail: BotInfo posts no US list price, and third-party coverage says shipping, duties, and configuration are extra.
        - id: factory-output
          label: Shenzhen line converts orders into shipped units
          detail: First-batch shipments started in 2026, with public throughput targets of roughly one robot every 15 minutes.
        - id: gross-profit
          label: Gross profit depends on utilization and service burden
          detail: Cooling, battery, sensors, and after-sales workflow suggest hardware absorption is the key margin variable.
        - id: disclosure-gap
          label: Public underwriting stops at disclosure gaps
          detail: Revenue, gross margin, cash balance, CAC/payback, and customer concentration are not disclosed publicly.
      edges:
        - from: sku-ladder
          to: home-market-price
          label: SKU mix shapes the headline price ladder
        - from: home-market-price
          to: export-route
          label: Export channels do not publish a posted realized price
        - from: export-route
          to: factory-output
          label: Quote conversion must translate into shipped units
        - from: factory-output
          to: gross-profit
          label: Utilization determines fixed-cost absorption
        - from: gross-profit
          to: disclosure-gap
          label: Missing KPIs block a clean underwrite
