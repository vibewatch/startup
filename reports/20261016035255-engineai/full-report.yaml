      - number: '4.2'
        title: Delivery economics and public traction proxies
        blocks:
          - type: paragraph
            body: >-
              Public traction is visible mainly through manufacturing readiness and shipment start, not through customer
              or margin disclosure. TNW, BotInfo, and RobotsBeat each report that EngineAI opened its Shenzhen factory
              and shipped the first batch of T800 units around the turn of June 2026. RobotsBeat and BotInfo also
              describe a line cadence of roughly one robot every 15 minutes, with RobotsBeat citing up to 10,000 units
              of initial capacity. EngineAI's own product page highlights a full-size humanoid with active cooling,
              LiDAR/camera sensing, and multi-hour battery runtime, which supports the view that cost of goods, field
              support, and utilization are the key financial variables. Those variables remain opaque because public
              sources do not disclose gross margin, yield, warranty reserves, or line utilization. 
            claimRefs:
              - CI003
              - CI004
