      - number: '6.3'
        title: Retention, overseas channel durability, and concentration are still open questions
        blocks:
          - type: paragraph
            body: >-
              The most decision-useful negative signal in the pool is not a churn event but the absence of basic
              durability disclosure. BotInfo describes the T800 as quote-only outside China, says there is no
              manufacturer-appointed North American distributor, and reports no FCC equipment authorization on record as
              of its August 2026 check. The official product page also warns that some example features are still under
              development and that buyers should understand the technology's limitations before purchase. Together with
              independent caution that demo performance is not the same as validated duty cycles, these sources imply
              that overseas rollout, after-sales support, and retention quality are not yet publicly proven. No assigned
              source discloses NRR, GRR, churn, contract term, or top-customer exposure, so concentration risk has to
              stay as an unresolved diligence item rather than a quantified conclusion.
            claimRefs:
              - CU006
              - CU007
              - CU009
              - CU010
              - CU012
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and commercialization gates
        blocks:
          - type: paragraph
            body: >-
              EngineAI's public materials do not show a clean, globally cleared commercialization path yet. Official
              pages tell users to understand the technology's limitations and comply with local laws, while BotInfo says
              the T800 is quote-only in the US, no FCC authorization is on record, and US commercialization is gated by
              conditional approval rather than a posted checkout flow. A third-party directory lists CE, but the
              assigned pool does not include a primary certificate package or standard-by-standard evidence, so
              compliance confidence still depends on diligence rather than on a published approval stack. For investors,
              the near-term gating item is not only demand generation; it is whether EngineAI can assemble
              jurisdiction-specific approval, safety, and support documentation quickly enough to turn interest into
              executable orders.
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR005
              - CR006
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR006
      - number: '7.2'
        title: Scale-up and product maturity
        blocks:
          - type: paragraph
            body: >-
              Operationally, EngineAI has moved beyond pure concept-stage theater. Independent reporting says the
              Shenzhen line can produce one robot every fifteen minutes, the first batch has already come off the line,
              and each unit passes 79 inspections plus 46 simulation tests before shipment. Those are meaningful
              mitigation signals, but they sit beside official caveats that some showcased features remain under
              development and a third-party commercial listing that still labels the T800 Basic as a prototype. Startup
              Fortune also argues that the labor-substitution economics of a roughly $25,000 humanoid remain unproven at
              the delivery volumes EngineAI is projecting. The residual risk is that manufacturing throughput scales
              faster than validated industrial duty-cycle performance, customer ROI proof, and service readiness.
            claimRefs:
              - CR002
              - CR007
              - CR008
              - CR009
              - CR010
              - CR014
