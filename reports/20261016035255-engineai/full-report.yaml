  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      The evidence supports a staged path from ecosystem awareness into home-market shipment, with the biggest drop-off
      at named references and overseas support proof.
    data:
      items:
        - label: CES awareness and evaluation
          tone: neutral
          actor: Industry partners, developers, media
          phase: Top of funnel
          channel: CES 2026 demonstrations
          touchpoints:
            - Booth demos generated "significant interest" and technical exchanges.
            - Interest validates awareness, not paid deployment.
        - label: Official segment positioning
          tone: neutral
          actor: Industrial, service, education, research prospects
          phase: Solution fit
          channel: Product and press materials
          touchpoints:
            - EngineAI positions T800 across industrial, commercial-service, research, and education contexts.
            - Segment breadth is visible before named customer depth.
        - label: China home-market fulfillment
          tone: positive
          actor: Domestic buyers
          phase: Initial commercial conversion
          channel: Shenzhen manufacturing base
          touchpoints:
            - First batch shipped from Shenzhen in May 2026.
            - Delivery proof is stronger than a preorder narrative.
        - label: Early deployment surfaces
          tone: positive
          actor: Retail venues and factory evaluators
          phase: Usage proof
          channel: Retail placements and factory pilots
          touchpoints:
            - Public proof surfaces include retail placements in Shenzhen and factory-pilot framing.
            - Named paying accounts remain undisclosed.
        - label: Overseas quote path
          tone: risk
          actor: Non-China buyers
          phase: Procurement friction
          channel: BotInfo quote desk
          touchpoints:
            - Outside China the T800 is quote-only.
            - No published US price or appointed North American distributor is disclosed.
        - label: Durable expansion proof
          tone: risk
          actor: Existing customers and follow-on buyers
          phase: Renewal and scale
          channel: Not publicly evidenced
          touchpoints:
            - No public NRR, GRR, churn, contract-length, or concentration metrics appear in the assigned pool.
            - This is the main missing link between shipment claims and durable customer quality.
