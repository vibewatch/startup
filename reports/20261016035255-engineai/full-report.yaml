      - number: '2.3'
        title: Adoption path points to operations-led buyers with workflow-specific triggers
        blocks:
          - type: paragraph
            body: >-
              The buyer map implied by the retained sources starts with operators that can justify a humanoid through
              repetitive, physically demanding, or labor-constrained workflows. Factory and inspection deployments
              appear first because the public coverage ties the Shenzhen ramp to industrial and inspection use cases
              where repeatability matters more than generalized autonomy. Warehousing, hospitality, and retail appear as
              adjacent channels in database and review coverage, while a research or open-source segment is visible
              through the Eco edition. What is missing is named procurement proof: public sources describe workflow
              categories and purchase paths, but they do not identify the specific customers, budget holders, contract
              sizes, or deployment cohorts that would let diligence convert this segment map into a verified pipeline
              model.
            claimRefs:
              - CM002
              - CM003
              - CM007
              - CM009
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM003
              - CM007
              - CM009
              - CM014
      - number: '2.4'
        title: Commercial constraints are price comparability, export readiness, and immature proof
        blocks:
          - type: paragraph
            body: >-
              The strongest disconfirming evidence is not that the market is small, but that the public record is too
              immature to support a simple winner-take-all growth story. BotInfo treats the robot as quote-only in the
              US and flags unresolved compliance questions, which means international pricing and channel readiness are
              still evidence gaps rather than closed facts. Public price references also conflict: the home-market
              launch anchor is RMB 180,000, independent summaries often translate that to roughly $25,000, and
              Humanoid.Guide shows an $85,000 figure without reconciling configuration or landed-cost differences.
              EngineAI's own product page adds another caution by stating that some example features remain under
              development and that humanoid robotics is still in a global early-stage exploration phase. Taken together,
              those signals argue for a narrow near-term serviceable market and for diligence that tests customer proof
              and exported unit economics before accepting any large TAM narrative.
            claimRefs:
              - CM010
              - CM011
              - CM015
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive set is broader than one robot-vs-robot spec fight
        blocks:
          - type: paragraph
            body: >-
              The evidence pool points to three practical comparison layers. First is the direct Chinese benchmark: both
              RoboHuman and Mike Kalil treat Unitree as the nearest live rival, with the G1 and H1 framing the most
              immediate price-versus-performance comparison for buyers who want an already announced humanoid rather
              than a concept platform. Second are high-visibility global incumbents such as Tesla Optimus and Boston
              Dynamics Atlas, which matter because they anchor expectations for autonomy and technical ambition even
              when they are not yet like-for-like commercial alternatives. Third is the status quo path of fixed
              automation and human labor, which RoboHuman uses as the real ROI hurdle for any factory deployment. Within
              EngineAI's own line, PM01 is the developer and education wedge while T800 is the current full-size
              industrial flagship; that split matters because it means some of EngineAI's lowest published prices do not
              actually buy the flagship platform investors are underwriting.
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
