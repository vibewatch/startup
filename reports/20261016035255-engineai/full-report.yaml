      - number: '1.2'
        title: Leadership, governance, and control surfaces
        blocks:
          - type: paragraph
            body: >-
              Public leadership disclosure is still founder-centric. Zhao Tongyang is the central operator in the
              assigned sources, with prior Dogotix and XPeng robotics experience forming the main published
              founder-market-fit evidence, while Ren Guowen appears as the co-founder attached to the
              manufacturing-network narrative. That is enough to show relevant robotics operating context, but not
              enough to map a full management bench, board composition, or succession depth; for diligence purposes,
              governance looks as though it is formalizing around an IPO path faster than public disclosure is
              broadening around the underlying organization chart.
