        title: Maturity signals, controls, and open risks
        blocks:
          - type: paragraph
            body: |-
              The most credible maturity signal in the retained evidence is EngineAI's
              move from product-page rhetoric to disclosed factory operations.
              RobotsBeat reports a Shenzhen facility that integrates assembly,
              pre-shipment testing, logistics, and after-sales service, with each unit
              passing 79 quality checks and 46 simulation tests before shipment. That
              is a stronger operating signal than a pure prototype reveal, but it does
              not fully close the diligence gap. The official page still says some
              example features remain under development, testing, and refinement, and
              public sources do not provide a primary certification document, public
              SDK/API release surface, uptime data, or support SLA. Even maturity labels
