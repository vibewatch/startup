              - CP003
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
      - number: '3.2'
        title: Price-performance is the clearest wedge, but comparability is uneven
        blocks:
          - type: paragraph
            body: >-
              On public evidence, EngineAI's best competitive argument is not unique software proof but the combination
              of full-size hardware, visible manufacturing ramp, and launch pricing that sits far below what Western
              humanoid programs are typically assumed to cost. The official T800 page and multiple independent profiles
              consistently describe a 173 cm platform with 450 N·m peak torque and roughly four to five hours of
              runtime, while independent 2026 coverage repeatedly ties the China launch price to RMB 180,000, or about
              $25,000. That puts T800 above PM01 on industrial seriousness, but it also means EngineAI is simultaneously
              competing against its own cheaper developer robot and against Unitree's lower-cost compact G1. The result
              is a market in which headline specs and entry price are relatively legible, but true like-for-like package
              comparison remains thin once support scope, realized performance, and customer deployment terms matter.
            claimRefs:
              - CP001
              - CP002
              - CP003
