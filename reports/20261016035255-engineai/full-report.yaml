      - number: '6.2'
        title: Shipment proof exists, but adoption metrics remain shallow
        blocks:
          - type: paragraph
            body: >-
              Commercialization evidence has advanced from spectacle to at least initial fulfillment. The company said
              the first T800 batch rolled off the Shenzhen line on 2026-05-29, and multiple independent outlets repeated
              the one-robot-every-15-minutes manufacturing claim. That matters because it is stronger than a preorder
              page or pure CES launch narrative. Even so, the public record in this worker pool does not disclose
              shipped units, active accounts, utilization, backlog, customer count, or renewal behavior. Public demand
              proof therefore rests on supply-side readiness and scattered deployment surfaces rather than on
              denominator-backed adoption metrics.
            claimRefs:
              - CU001
              - CU002
              - CU005
              - CU011
              - CU013
