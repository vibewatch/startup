  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments are visible before customer names are
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence shows where EngineAI is trying to sell before it proves who is already buying at
              scale. Official materials position the T800 toward industrial manufacturing, logistics, inspection,
              commercial-service, research, and education workflows, while independent buyer guides narrow the near-term
              fit toward factory deployment, industrial R&D, and enterprise pilots. That is enough to segment the buyer
              and user base into industrial operators, commercial-service venues, and evaluation-oriented research
              users, but it is not enough to prove durable payer concentration or segment-level revenue mix. The
              strongest cross-source conclusion is that EngineAI has a broad top-of-funnel across industrial and
              evaluation use cases, with weak public disclosure on who the paying reference accounts actually are.
            claimRefs:
