      - number: '3.3'
        title: Durability depends more on channel, compliance, and proof of work than on viral motion demos
        blocks:
          - type: paragraph
            body: >-
              The same sources that make EngineAI look disruptive also show why the moat is still fragile. RobotsBeat
              gives the company a credible manufacturing story, including first batch production and a 10,000-unit
              target line, which is stronger operational evidence than many early humanoid peers disclose. But BotInfo
              and RobotSourced both underline the missing buyer infrastructure: quote-only overseas procurement, no
              published North American checkout path, unresolved FCC diligence, thin support history, and no public
              record in this pool of validated industrial duty cycles or named scaled customers. That means
              commoditization risk is real: if Unitree or larger incumbents narrow the price gap or prove better channel
              execution, EngineAI's current advantage can compress quickly because much of the narrative still rides on
              spectacle, early manufacturing readiness, and China-market affordability rather than on already
              demonstrated global delivery depth.
