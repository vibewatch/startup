      - number: '1.4'
        title: Milestones and what later chapters should treat as gaps
        blocks:
          - type: paragraph
            body: >-
              The chapter timeline is dense for a company barely three years old: foundation in 2023, a 2024
              test-machine reference, the February 2025 PM01 front-flip moment, December 2025 T800 launch pricing, CES
              2026, April 2026 financing, May 2026 factory commissioning, and June 2026 IPO reporting. What later
              chapters should not assume from that pace is equivalent revenue maturity. The assigned pool still does not
              publish a recurring customer base, unit sell-through, headcount, revenue run rate, or a detailed board
              roster, so those remain explicit diligence asks rather than reusable facts.
