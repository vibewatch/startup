  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary is task-specific enterprise humanoid labor, not a broad consumer category
        blocks:
          - type: paragraph
            body: >-
              The retained evidence consistently frames the T800 as a full-size, general-purpose humanoid for industrial
              and commercial scenarios instead of a home or entertainment device. EngineAI's own materials emphasize
              broad enterprise applications, while third-party databases place the robot in logistics, hotel service,
              retail, warehouse, and industrial-inspection workflows. That matters for valuation because it narrows the
              addressable market to buyers with labor-substitution or workflow-automation budgets, not to the much
              larger but unsupported idea of immediate consumer humanoid adoption. Sector context also points the same
              way: ChinaBizInsider describes 2025 humanoid financing as concentrated among a small set of firms pushing
              hardware from laboratory validation toward commercial deployment, which is consistent with EngineAI
              competing inside an early but increasingly capitalized enterprise category rather than a mature
              mass-market segment.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM014
      - number: '2.2'
        title: Sizing has to rely on price, delivery, and capacity proxies instead of a clean TAM
        blocks:
          - type: paragraph
            body: >-
              The assigned pool does not contain a reliable independent market model for humanoid robotics spending, so
              the strongest sizing approach is bottom-up and explicitly constrained. Public sources anchor the T800
              launch price at RMB 180,000, describe a 2026 target of 4,000-5,000 deliveries, and cite a Shenzhen
              facility sized for 10,000 units of initial annual capacity. Those inputs do not prove demand, but they do
              create a bounded commercialization frame: roughly RMB 720 million to RMB 900 million of gross hardware
              value if the delivery target is met at the entry price, and a theoretical RMB 1.8 billion ceiling if the
              plant reaches full stated capacity at the same price floor. The figure is useful as a serviceable-market
              proxy, not as TAM, because it excludes software, services, discounts, product-mix shifts, and any
              geography-specific channel economics.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM012
              - CM013
