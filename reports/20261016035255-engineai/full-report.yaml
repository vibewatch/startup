            tableRef: TR002
            claimRefs:
              - CR002
              - CR007
              - CR008
              - CR010
              - CR012
              - CR013
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR005
              - CR010
              - CR013
              - CR015
              - CR016
      - number: '7.3'
        title: Dependency, channel, and capital concentration
        blocks:
          - type: paragraph
            body: >-
              Execution risk is concentrated in a small number of counterparties and milestones. Startup Fortune ties
              the Series B and factory buildout to Luxshare Precision and says Luxshare has already improved production
              efficiency, while RobotsBeat describes a second Zhengzhou line as the next leg of the scale narrative.
              That creates upside if the ecosystem stays aligned, but it also means supply-chain execution, partner
              continuity, and capex timing matter unusually early for a company founded only in 2023. The same pattern
              appears in go-to-market: Western distribution is still forming, so channel build-out and compliance
              paperwork can bottleneck revenue realization even if engineering progress and investor appetite remain
              strong.
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR004
              - CR013
              - CR015
              - CR016
      - number: '7.4'
        title: Kill criteria and diligence priorities
        blocks:
          - type: paragraph
            body: >-
              The thesis improves only if EngineAI can show primary certification documents, named production
              deployments, field reliability data, support coverage, and evidence that funding and IPO preparation are
              converting into repeatable shipment economics rather than one-off launch momentum. The thesis breaks if
              regulatory approvals stall, if pilot-to-production conversion lags the factory narrative, or if the
              Luxshare and Zhengzhou scale plan slips materially. Until those items are documented, the right
              underwriting stance is to treat current manufacturing progress as a proof-of-execution signal, not as
              proof that legal, channel, and customer-adoption risks are already solved.
            claimRefs:
              - CR004
              - CR005
              - CR010
              - CR013
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: US commercialization is still approval-led
            body: >-
              The biggest near-term gating item is not nominal demand or factory throughput but whether EngineAI can
              produce jurisdiction-specific compliance and support documents that let counterparties buy without bespoke
              diligence.
            calloutType: risk
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR016
          - type: callout
            title: Factory progress is a mitigation, not a moat
            body: >-
              One-robot-per-fifteen-minutes throughput, first-batch shipment, and extensive pre-shipment testing are
              meaningful execution signals, but they do not by themselves prove durable customer ROI, low field-failure
              rates, or post-sale support readiness.
            calloutType: insight
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: What the current mark is buying
        blocks:
          - type: paragraph
            body: >-
              The current public valuation context is clear enough to anchor discipline but not clear enough to justify
              paying a premium. Independent 2026 reporting places EngineAI's latest private mark above RMB10 billion,
              framed at roughly $1.4 billion to $1.5 billion depending on source and FX convention, after a reported
              $200 million Series B. That mark is not detached from operating progress: the company has opened a
              Shenzhen factory, reported first T800 shipments, and positioned the line for much higher output. Even so,
              the same public record remains thin on recurring revenue, customer count, gross margin, and contract
              value. The valuation therefore reflects option value on industrial humanoid adoption and financing
              momentum more than disclosed commercial proof.
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV009
              - CV010
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV007
              - CV010
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV009
              - CV010
              - CV012
      - number: '8.2'
        title: Recommendation, confidence, and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The investable tension is that EngineAI looks increasingly real as a manufacturer while still looking
              early as a business. The official product and third-party coverage support the view that T800 is a serious
              platform on specifications, pricing ambition, and scale-up intent. However, quote-only overseas channels,
              reported FCC-authorization uncertainty in the United States, and independent warnings that viral demos are
              not the same as validated industrial duty cycles all weaken the case for paying above the last private
              mark today. On that evidence, the right posture is to track the company and underwrite only at or below
              the last known range unless new disclosures prove repeat demand and monetization quality.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV006
              - CV007
              - CV009
              - CV010
              - CV011
              - CV013
      - number: '8.3'
        title: Bull, base, and bear framing
        blocks:
          - type: paragraph
            body: >-
              Scenario framing should stay qualitative because public evidence is still missing the variables that would
              make tighter math credible. The bull case is not simply that humanoid robotics is exciting; it is that
              first shipments, manufacturing throughput, and financing access convert into disclosed repeat orders and
              clean IPO execution. The base case keeps the company around its last reported private mark while investors
              wait for revenue and customer proof. The bear case is a stalled IPO or financing reset before those proof
              points appear, which would expose the valuation to down-round or structured terms risk. Those cases are
              more decision-useful than false precision.
            claimRefs:
              - CV001
              - CV004
              - CV009
              - CV010
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV004
              - CV007
              - CV009
              - CV010
              - CV014
      - number: '8.4'
        title: Exit readiness and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              Exit optionality exists, but the public trail still looks like financing readiness rather than exit
              readiness. A confidential Hong Kong filing can be directionally positive because it tests market appetite
              and may create a liquid benchmark, yet it does not answer the questions that matter most for underwriting:
              order quality, conversion from pilots to production use, customer concentration, margin structure, and
              preference-stack discipline. The final diligence asks are therefore straightforward: obtain customer
              contracts or at least disclosed order metrics, verify revenue and gross margin progression, inspect any
              IPO or pre-IPO terms for liquidation or anti-dilution complexity, and confirm which geographies can
              actually be served compliantly. Until those items move from implied to evidenced, the chapter's
              price-sensitive answer remains cautious.
            claimRefs:
              - CV007
              - CV009
              - CV010
              - CV012
              - CV013
              - CV014
