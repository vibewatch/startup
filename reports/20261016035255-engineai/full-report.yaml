chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, stage, and current scope
        blocks:
          - type: paragraph
            body: >-
              EngineAI presents itself as a general-purpose embodied-intelligence company founded in Shenzhen in October
              2023, with Zhao Tongyang as the founder-chief executive and a product line spanning smaller research and
              service robots through the full-size T800 humanoid. Across official and independent profiles, the stable
              ground-truth is that the company is now in a late private scale-up phase: it has a named flagship product,
              a factory launch, a reported April 2026 Series B, and a reported June 2026 confidential Hong Kong IPO
              filing, but no public financial disclosure that would let later chapters treat it as a proven
              revenue-scale company.
            claimRefs:
              - CO001
              - CO002
              - CO004
