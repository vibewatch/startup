      - number: '1.3'
        title: Capital, manufacturing ramp, and commercialization posture
        blocks:
          - type: paragraph
            body: >-
              The strongest externally corroborated scale markers are financial and manufacturing rather than
              recurring-commercial metrics. Independent coverage says EngineAI raised a USD 200 million Series B at a
              valuation above RMB 10 billion, with Luxshare Precision and Henan Investment Group's Huirong Fund
              positioned as material participants, while the company says its Shenzhen base can roll a humanoid off the
              line every 15 minutes and that the T800 line starts at RMB 180,000. Those are material signals for
              industrial ambition, but the same source set still frames the US channel as quote-only and unresolved on
              compliance, which means public evidence supports "manufacturing ramp with strategic backers" more strongly
              than "broadly validated commercial deployment."
