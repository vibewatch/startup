  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Recommendation turns on whether financing and factory proof outrun the still missing commercial economics and
      channel clearance.
    data:
      nodes:
        - id: mark
          label: Last reported private mark
          value: RMB10B+ / roughly $1.4B-$1.5B
          note: Independent 2026 coverage anchors the valuation context.
        - id: capital
          label: Funding and IPO option
          value: $200M Series B + confidential HK filing
          note: Keeps access to capital open but does not disclose terms.
        - id: manufacturing
          label: Factory and shipment proof
          value: First T800 batch + one robot every 15 minutes target
          note: Shows execution progress beyond demo videos.
        - id: product
          label: Product and pricing signal
          value: RMB180,000 starting price / quote-only overseas
          note: Ambitious positioning, but landed channel economics remain unclear.
        - id: gaps
          label: Commercial proof gap
          value: No public revenue, margin, or active-customer disclosure
          note: Limits support for a premium entry price.
        - id: call
          label: Recommendation
          value: Track / stretched / high risk
          note: Upgrade requires repeat orders, cleaner disclosures, and exit-term clarity.
      edges:
        - from: mark
          to: capital
          relationship: sets price anchor
        - from: capital
          to: manufacturing
          relationship: funds scale-up
        - from: manufacturing
          to: product
          relationship: supports launch narrative
        - from: product
          to: gaps
          relationship: fails to close economics gap on its own
        - from: gaps
          to: call
          relationship: keeps recommendation cautious
    claimRefs:
      - CV001
      - CV004
      - CV006
      - CV009
      - CV010
      - CV012
