  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing visibility
        blocks:
          - type: paragraph
            body: >-
              The public monetization evidence points to a hardware-first model built around selling T800 humanoid units
              rather than a software-led recurring-revenue story. EngineAI's launch materials say the T800 line starts
              at 180,000 yuan and spans four editions, while BotInfo says overseas buyers must request a quote and that
              it does not publish a US price. RobotSourced adds that the often-cited $25,000 figure is only a
              currency-converted launch anchor and excludes shipping, duties, and configuration upgrades. That leaves a
              usable list-price floor but no public view into realized ASP, discounting, deposits, service attach, or
              export channel margin. Public revenue quality is therefore not yet underwritten by disclosed bookings,
              contract values, or recognized revenue. 
