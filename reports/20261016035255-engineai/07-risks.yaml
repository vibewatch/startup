callouts:
  - calloutType: "risk"
    title: "US commercialization is still approval-led"
    body: "The biggest near-term gating item is not nominal demand or factory throughput but whether EngineAI can produce jurisdiction-specific compliance and support documents that let counterparties buy without bespoke diligence."
    claimRefs: ["CR001", "CR004", "CR005", "CR016"]
  - calloutType: "insight"
    title: "Factory progress is a mitigation, not a moat"
    body: "One-robot-per-fifteen-minutes throughput, first-batch shipment, and extensive pre-shipment testing are meaningful execution signals, but they do not by themselves prove durable customer ROI, low field-failure rates, or post-sale support readiness."
    claimRefs: ["CR007", "CR008", "CR009", "CR010"]
