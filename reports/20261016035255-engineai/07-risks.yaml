chapter:
  number: 7
  title: "Risks"
  summary: "EngineAI's risk profile is dominated by commercialization readiness rather than pure product hype: public evidence shows real factory scale-up and capital support, but compliance, certification, support coverage, and customer-proof remain underdocumented. The practical investment question is whether the company can convert a fast manufacturing narrative into legally marketable, supportable, repeatable deployments before IPO-era expectations harden."
sections:
  - id: "regulatory-commercialization-gates"
    title: "Regulatory and commercialization gates"
    body: >-
      EngineAI's public materials do not show a clean, globally cleared commercialization path yet. Official pages tell users to understand the technology's limitations and comply with local laws, while BotInfo says the T800 is quote-only in the US, no FCC authorization is on record, and US commercialization is gated by conditional approval rather than a posted checkout flow. A third-party directory lists CE, but the assigned pool does not include a primary certificate package or standard-by-standard evidence, so compliance confidence still depends on diligence rather than on a published approval stack. For investors, the near-term gating item is not only demand generation; it is whether EngineAI can assemble jurisdiction-specific approval, safety, and support documentation quickly enough to turn interest into executable orders.
    claimRefs: ["CR001", "CR003", "CR004", "CR005", "CR006", "CR015"]
    tableRefs: ["TR001"]
  - id: "scale-up-and-product-maturity"
    title: "Scale-up and product maturity"
    body: >-
      Operationally, EngineAI has moved beyond pure concept-stage theater. Independent reporting says the Shenzhen line can produce one robot every fifteen minutes, the first batch has already come off the line, and each unit passes 79 inspections plus 46 simulation tests before shipment. Those are meaningful mitigation signals, but they sit beside official caveats that some showcased features remain under development and a third-party commercial listing that still labels the T800 Basic as a prototype. Startup Fortune also argues that the labor-substitution economics of a roughly $25,000 humanoid remain unproven at the delivery volumes EngineAI is projecting. The residual risk is that manufacturing throughput scales faster than validated industrial duty-cycle performance, customer ROI proof, and service readiness.
    claimRefs: ["CR002", "CR007", "CR008", "CR009", "CR010", "CR014"]
    tableRefs: ["TR002"]
    figureRefs: ["FR001"]
  - id: "dependency-channel-and-capital"
    title: "Dependency, channel, and capital concentration"
    body: >-
      Execution risk is concentrated in a small number of counterparties and milestones. Startup Fortune ties the Series B and factory buildout to Luxshare Precision and says Luxshare has already improved production efficiency, while RobotsBeat describes a second Zhengzhou line as the next leg of the scale narrative. That creates upside if the ecosystem stays aligned, but it also means supply-chain execution, partner continuity, and capex timing matter unusually early for a company founded only in 2023. The same pattern appears in go-to-market: Western distribution is still forming, so channel build-out and compliance paperwork can bottleneck revenue realization even if engineering progress and investor appetite remain strong.
    claimRefs: ["CR011", "CR012", "CR013", "CR015", "CR016"]
    tableRefs: ["TR003"]
  - id: "kill-criteria-and-diligence-priorities"
    title: "Kill criteria and diligence priorities"
    body: >-
      The thesis improves only if EngineAI can show primary certification documents, named production deployments, field reliability data, support coverage, and evidence that funding and IPO preparation are converting into repeatable shipment economics rather than one-off launch momentum. The thesis breaks if regulatory approvals stall, if pilot-to-production conversion lags the factory narrative, or if the Luxshare and Zhengzhou scale plan slips materially. Until those items are documented, the right underwriting stance is to treat current manufacturing progress as a proof-of-execution signal, not as proof that legal, channel, and customer-adoption risks are already solved.
    claimRefs: ["CR004", "CR005", "CR010", "CR013", "CR015", "CR016"]
