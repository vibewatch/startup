  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界是面向具体任务的企业级人形劳动力，而非宽泛的消费品类
        blocks:
          - type: paragraph
            body: >-
              留存证据始终将 T800 描述为面向工业和商业场景的全尺寸通用人形机器人，而非家用或娱乐设备。EngineAI
              自有材料强调广泛的企业应用，第三方数据库则将其归入物流、酒店服务、零售、仓储和工业巡检流程。这一点会影响估值：可服务市场应限定为拥有劳动力替代或工作流自动化预算的买方，而不是扩大到缺乏依据的“消费者马上会采用人形机器人”。行业背景也指向同一方向：ChinaBizInsider
              称，2025 年人形机器人融资集中在少数几家公司，它们正推动硬件从实验室验证走向商业部署；这与 EngineAI 所处的早期但资本日益充足的企业级品类相符，而不是成熟的大众市场。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM014
      - number: '2.2'
        title: 市场规模只能依靠价格、交付和产能代理指标，而非清晰的 TAM
        blocks:
          - type: paragraph
            body: >-
              本次资料没有可靠的独立人形机器人支出市场模型，因此最稳妥的估算方式是自下而上，并明确限定范围。公开来源将 T800 上市价格锚定在 RMB 180,000，描述 2026 年 4,000-5,000
              台的交付目标，并称深圳工厂初始年产能为 10,000 台。这些输入不能证明需求，却能划定商业化边界：若所有交付都按入门价成交，达到交付目标对应的硬件总价值约为 RMB 720 million 至 RMB 900
              million；若工厂按同一价格底线达到所述满产能，理论上限为 RMB 1.8 billion。这个数字可作为可服务市场代理指标，而不是 TAM，因为它排除了软件、服务、折扣、产品组合变化和各地渠道经济性。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM012
              - CM013
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM012
              - CM013
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM012
      - number: '2.3'
        title: 采用路径指向由运营团队主导、触发点明确的工作流买方
        blocks:
          - type: paragraph
            body: >-
              留存来源所暗示的买方地图，首先是那些能通过重复性、体力要求高或劳动力紧缺的工作流为人形机器人找到经济性的运营方。工厂和巡检部署最先出现，因为公开报道将深圳产能爬坡与工业和巡检场景相连，在这些场景里，可重复性比通用自主性更重要。数据库和测评报道还将仓储、酒店和零售列为相邻渠道；Eco
              版本则显示出科研或开源细分市场。缺少的是具名采购证据：公开来源描述了工作流类别和购买路径，却没有指出具体客户、预算负责人、合同规模或部署批次，尽调因此无法把这张细分市场地图转换成已验证的销售管线模型。
            claimRefs:
              - CM002
              - CM003
              - CM007
              - CM009
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM003
              - CM007
              - CM009
              - CM014
      - number: '2.4'
        title: 商业化约束在于价格可比性、出口准备度和不成熟的证据
        blocks:
          - type: paragraph
            body: >-
              最有力的反证不是市场太小，而是公开记录尚不成熟，无法支撑简单的赢家通吃增长故事。BotInfo
              将该机器人在美国列为仅接受询价，并指出合规问题尚未解决。因此，国际价格和渠道准备度仍是证据缺口，尚非已经确认的事实。公开价格也互相冲突：本土上市锚点为 RMB 180,000，独立摘要常将其换算为约
              $25,000，而 Humanoid.Guide 给出 $85,000，却没有解释配置或到岸成本差异。EngineAI
              自有产品页面还提醒，部分示例功能仍在开发中，人形机器人整体仍处于全球早期探索阶段。综合来看，近期可服务市场应保持狭窄；在接受任何大型 TAM 叙事前，尽调需要先检验客户证据和出口单机经济性。
            claimRefs:
              - CM010
              - CM011
              - CM015
              - CM016
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争集合不只是机器人之间的参数对比
        blocks:
          - type: paragraph
            body: >-
              证据池指向三个实际比较层。第一是中国直接基准：RoboHuman 和 Mike Kalil 都把 Unitree 视为最接近的现实竞争者，G1 和 H1
              为希望购买已宣布人形机器人、而非概念平台的客户提供最直接的价格—性能对比。第二是 Tesla Optimus、Boston Dynamics Atlas
              等高曝光全球既有厂商；即便它们还不是可直接类比的商业替代品，也会锚定市场对自主性和技术野心的预期。第三是固定自动化与人工劳动力这条现状路径，RoboHuman 将其视为任何工厂部署必须跨过的真正 ROI 门槛。在
              EngineAI 自有产品线内，PM01 是开发者和教育切入口，T800 则是当前全尺寸工业旗舰；这一划分很重要，因为 EngineAI 公布的部分最低价格，实际买到的并不是投资人正在评估的旗舰平台。
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
          - type: table
            tableRef: TP001
            claimRefs:
              - CP002
              - CP003
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
      - number: '3.2'
        title: 性价比是最清晰的切入口，但可比性并不均衡
        blocks:
          - type: paragraph
            body: >-
              从公开证据看，EngineAI 最有力的竞争论据不是独特的软件证明，而是全尺寸硬件、可见的制造爬坡，以及远低于西方人形机器人项目通常假设成本的上市价格组合。官方 T800 页面和多份独立资料都将其描述为身高
              173 cm、峰值扭矩 450 N·m、续航约四到五小时的平台；独立的 2026 年报道也反复将中国上市价与 RMB 180,000、约 $25,000 联系起来。这使 T800 在工业严肃性上高于
              PM01，但也意味着 EngineAI 同时要面对自家更便宜的开发者机器人，以及 Unitree 成本更低的紧凑型
              G1。结果是，市场对纸面参数和入门价格相对容易理解，但一旦把支持范围、实际性能和客户部署条款纳入比较，真正同类对比的资料仍然稀薄。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
              - CP010
      - number: '3.3'
        title: 持久竞争力更取决于渠道、合规和工作成果，而非走红的动作演示
        blocks:
          - type: paragraph
            body: >-
              让 EngineAI 看起来具备颠覆性的同一批来源，也说明了护城河为何仍然脆弱。RobotsBeat 给出了一套可信的制造故事，包括首批生产和 10,000
              台目标产线，这比许多早期人形机器人同行披露的运营证据更强。但 BotInfo 和 RobotSourced 都指出买方基础设施仍然缺失：海外采购仅接受询价，没有公开的北美结账路径，FCC
              尽调尚未解决，支持历史有限，本次资料也没有经验证的工业工作周期或具名规模化客户公开记录。因此商品化风险真实存在：如果 Unitree 或更大的既有厂商缩小价格差距，或证明渠道执行更强，EngineAI
              当前优势可能迅速收窄，因为其叙事很大程度仍建立在视觉冲击、早期制造准备度和中国市场的可负担性上，而不是已经证明的全球交付深度。
            claimRefs:
              - CP003
              - CP005
              - CP006
              - CP011
              - CP012
              - CP013
          - type: table
