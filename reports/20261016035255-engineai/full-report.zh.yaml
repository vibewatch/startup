      - number: '4.3'
        title: 资本需求与投资判断缺口
        blocks:
          - type: paragraph
            body: >-
              如公司概览所述，EngineAI 的融资时间线在 2026 年 4 月完成 Series B；这里的财务问题是，这笔资本是否足以把公司从工厂启动带到可重复的需求。Bloomberg 和 TNW 报道称，公司于
              2026 年 6 月提交了保密香港 IPO 申请；RobotsBeat 称 Series B
              资金将用于制造扩张、研发和商业部署。这一组合意味着公司仍在为规模化融资，而不是已经证明具备自筹资金的运营杠杆。最重要的不利信号来自 TNW
              的警告：在人形机器人竞争拥挤的市场中，供应正跑在已验证需求之前。缺少公开收入、订单积压、现金余额、现金消耗、债务或客户集中度数据，投资人就无法可靠评估资金续航，也无法判断从原型经济性走向工业部署的利润路径；换句话说，公司尚未证明自己能靠经营杠杆自我造血。
