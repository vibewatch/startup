  - id: FI001
    title: 收入模型桥接
    type: flow
    summary: 公开证据展示了已宣布的产品定价如何转化为已交付硬件，但尚未展示其如何转化为实际利润率。
    data:
      nodes:
        - id: sku-ladder
          label: 四版本产品梯
          detail: Basic、Eco/Open Source、Pro 和 Max 扩大了对不同支付意愿的覆盖，但各版本 ASP 未公开。
        - id: home-market-price
          label: 中国市场挂牌价，起价 CNY 180k
          detail: 官方发布价格锚定了入门点，而不是混合实际 ASP。
        - id: export-route
          label: 海外变现由询价驱动
          detail: BotInfo 未公布美国挂牌价，第三方报道称运费、关税和配置费另计。
        - id: factory-output
          label: 深圳产线把订单转为发货量
          detail: 首批发货始于 2026 年，公开吞吐目标约为每 15 分钟一台机器人。
        - id: gross-profit
          label: 毛利取决于利用率和服务负担
          detail: 冷却、电池、传感器和售后流程表明，硬件吸收能力是利润率的关键变量。
        - id: disclosure-gap
          label: 公开投资判断止步于披露缺口
          detail: 收入、毛利率、现金余额、CAC/回本期和客户集中度均未公开披露。
      edges:
        - from: sku-ladder
          to: home-market-price
          label: SKU 组合塑造表面价格梯度
        - from: home-market-price
          to: export-route
          label: 出口渠道不公布已实现成交价
        - from: export-route
          to: factory-output
          label: 询价转化必须落到已发货单元
        - from: factory-output
          to: gross-profit
          label: 利用率决定固定成本吸收
        - from: gross-profit
          to: disclosure-gap
          label: KPI 缺失阻碍清晰的投资判断
