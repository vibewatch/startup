            body: >-
              公开进展主要体现在制造准备度和开始发货，而非客户或利润披露。TNW、BotInfo 和 RobotsBeat 都报道 EngineAI 在深圳开设工厂，并在 2026 年 6 月前后发出首批
              T800。RobotsBeat 和 BotInfo 还描述了约每 15 分钟一台的产线节奏，RobotsBeat 称初始产能最高可达 10,000 台。EngineAI
