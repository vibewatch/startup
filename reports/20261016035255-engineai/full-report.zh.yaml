              当前公开估值背景足以约束投资纪律，却不足以证明应支付溢价。独立的 2026 年报道将 EngineAI 最新私有估值置于 RMB10 billion 以上；根据来源和汇率口径不同，约为 $1.4 billion
              至 $1.5 billion，此前据报道完成了 $200 million Series B。这一估值并非脱离运营进展：公司已经在深圳开设工厂，报告了首批 T800
              发货，并为产能大幅提升做了布局。但同一公开记录对经常性收入、客户数量、毛利率和合同价值仍披露很少。因此，这一估值更多反映工业人形机器人采用的期权价值和融资势能，而不是已披露的商业证据。
