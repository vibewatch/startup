      - number: '1.4'
        title: 里程碑，以及后续章节应视为缺口的内容
        blocks:
          - type: paragraph
            body: >-
              对一家成立还不到三年的公司而言，这条时间线相当密集：2023 年成立、2024 年测试机记录、2025 年 2 月 PM01 前空翻、2025 年 12 月 T800 发布及定价、CES 2026、2026 年
              4 月融资、2026 年 5 月工厂投产，以及 2026 年 6 月 IPO 报道。但后续章节不能把这样的速度等同于收入成熟度。本次资料仍未披露经常性客户基础、单机实际售出量、员工人数、收入 run rate
              或详细董事会名单，因此这些都是明确的尽调问题，而不是可重复使用的事实。
            claimRefs:
              - CO001
