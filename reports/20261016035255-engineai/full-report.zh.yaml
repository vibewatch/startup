      - number: '1.3'
        title: 资本、制造爬坡与商业化姿态
        blocks:
          - type: paragraph
            body: >-
              经外部交叉验证最有力的规模信号来自融资和制造，而不是经常性商业指标。独立报道称，EngineAI 以高于 RMB 10 billion 的估值完成了 USD 200 million 的 Series
              B，Luxshare Precision 与 Henan Investment Group 旗下 Huirong Fund 据称是重要参与方；公司则称深圳基地每 15 分钟可下线一台人形机器人，T800 起售价为
              RMB 180,000。这些都是工业化野心的重要信号，但同一资料集仍将美国渠道描述为仅接受询价，且合规问题未解决。因此，公开证据更有力地支持“有战略投资方支撑的制造爬坡”，而不是“商业部署已得到广泛验证”。
            claimRefs:
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
              - CO015
              - CO016
