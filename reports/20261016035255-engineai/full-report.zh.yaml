    columns:
      - 情景
      - 核心假设
      - 估值 / 回报逻辑
      - 概率信号
      - 下行触发因素
    rows:
      - - 乐观
        - 首批 T800 发货转化为已披露的工业客户复购订单，收入可见度提升，香港 IPO 进程仍有空间
        - 公开市场选择权与商业化证明支持其估值高于上一轮私募定价
        - 客户披露、收入证据和清晰的上市条款出现
        - 工厂爬坡快于客户验证，或融资结构化程度超出预期
      - - Base
        - 制造进展延续，但公开披露仍局限于募资、定价和发货里程碑
        - 在投资者等待更硬证据期间，企业价值仍大致停留在上一轮披露的私募区间
        - 更多产品和工厂里程碑出现，且没有重大负面意外
        - 合同、利润率和客户数量的证据缺口持续过久
      - - Bear
        - IPO 时间表延后，或在经常性经济性证据公开前就需要新资本
        - 估值跌破上一轮披露的定价，或需要保护投资者的结构化条款
        - 保密申报仍不透明，验证指标依旧缺失
        - 下轮融资、结构化融资或商业化停滞变得可见
    notes: 由于审阅来源没有披露足够的经营数据，情景区间有意只作方向性参考，无法建立更紧的模型。
