        blocks:
          - type: paragraph
            body: >-
              情景分析应保持定性，因为公开证据仍缺少足以支撑精确计算的变量。乐观情景不只是人形机器人令人兴奋，而是首批发货、制造吞吐量和融资渠道最终转化为已披露的重复订单，并顺利执行
              IPO。基准情景是公司维持在上次报告的私有估值附近，投资人等待收入和客户证据。悲观情景则是在这些证据出现前 IPO 停滞或融资重置，使估值暴露于 down-round
              或结构化条款风险。这些情景比虚假的精确度更有决策价值。
