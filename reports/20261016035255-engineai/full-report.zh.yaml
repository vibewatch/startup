chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、阶段与当前范围
        blocks:
          - type: paragraph
            body: >-
              EngineAI 将自己定位为一家通用具身智能公司，2023 年 10 月在深圳成立，由 Zhao Tongyang 担任创始人兼 CEO，产品线从小型科研及服务机器人延伸至全尺寸 T800
              人形机器人。官方资料与独立画像共同指向一个相对确定的结论：公司已进入后期私有化扩张阶段——拥有明确的旗舰产品、已启动工厂、据报道于 2026 年 4 月完成 Series B，并据报道于 2026 年 6
              月提交保密香港 IPO 申请；但尚无公开财务披露，足以让后续章节把它视为已验证的规模化收入公司。
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO005
              - CO009
              - CO010
              - CO016
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO009
              - CO010
              - CO012
              - CO016
      - number: '1.2'
        title: 领导层、治理与控制面
        blocks:
          - type: paragraph
            body: >-
              公开领导层披露仍以创始人为中心。在本次资料中，Zhao Tongyang 是核心操盘者；他此前在 Dogotix 和 XPeng 的机器人经历，构成目前主要的创始人—市场匹配证据。Ren Guowen
              则作为与制造网络叙事相关的联合创始人出现。这足以证明其具备相关机器人运营背景，但还不足以梳理完整管理团队、董事会构成或继任深度；从尽调角度看，围绕 IPO
              路径形成治理架构的速度，似乎快于围绕底层组织图谱扩充公开披露的速度。
            claimRefs:
              - CO002
              - CO003
              - CO007
              - CO009
              - CO016
