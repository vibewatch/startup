        - 如果买方重视性价比和本地交付，这是近期最佳路径
      - - 将 T800 进口到北美
        - 必须解决询价、物流、关税和服务问题
        - 指定材料池中没有公布经销商结账路径或指定渠道
        - 根据 BotInfo，FCC / 无线电合规仍未解决
        - 即使目录价看起来有吸引力，摩擦也会把竞争推向支持更完善的现有厂商
      - - 先选择 PM01 或其他开发者机器人
        - 资本支出更低，但不太适合全尺寸工业任务
        - 相比完整工业化落地，开发者路径更清晰
        - 适合研究，但不能替代生产 ROI 证明
        - 适合实验，但不太适合直接替代工厂作业
      - - 等待 Optimus 或 Atlas 类现有厂商
        - 可能要长时间等待商业供应
        - 此处没有显示在售路径
        - 品牌信任可能更高，但采购时间不确定
        - 只有买方在这些选项成为真正替代品前采取行动，EngineAI 才能赢得试点
      - - 继续使用固定自动化 / 人工劳动
        - 无需人形机器人集成或安全再培训
        - 现有供应商 / 劳动力关系已经建立
        - 信任来自已知工作流，而不是机器人新颖性
        - 人形机器人的 ROI 必须超过已知基线，而不只是胜过其他机器人演示
    notes: 由于指定材料池对渠道和信任摩擦的支持比对跨供应商数值坐标的支持更清晰，本附加展品替代了原计划的象限图。
