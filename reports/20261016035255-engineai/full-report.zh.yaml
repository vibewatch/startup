      - number: '8.4'
        title: 退出准备度与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              退出选择权存在，但公开轨迹看起来仍是融资准备度，而非退出准备度。保密香港申请在方向上可能是积极信号，因为它能测试市场胃口，并可能形成流动性基准；但它没有回答投资判断最关心的问题：订单质量、试点转生产使用的转化、客户集中度、利润结构和优先权结构纪律。因此，最终尽调问题很直接：取得客户合同或至少已披露的订单指标，核实收入和毛利率进展，检查
              IPO 或上市前融资条款中是否存在清算或反稀释复杂性，并确认哪些地理市场确实能够合规服务。在这些事项从隐含变成证据前，本章对价格敏感的结论仍应谨慎。
