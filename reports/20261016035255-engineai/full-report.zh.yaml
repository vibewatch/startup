    data:
      items:
        - label: CES 认知与评估
          tone: neutral
          actor: 行业合作伙伴、开发者、媒体
          phase: 漏斗顶部
          channel: CES 2026 演示
          touchpoints:
            - 展台演示引发“浓厚兴趣”和技术交流。
            - 兴趣验证的是认知，不是付费部署。
        - label: 官方细分市场定位
          tone: neutral
          actor: 工业、服务、教育、研究领域潜在客户
          phase: 解决方案匹配
          channel: 产品和新闻材料
          touchpoints:
            - EngineAI 将 T800 定位于工业、商业服务、研究和教育场景。
            - 在明确客户深度出现前，细分市场覆盖面已经可见。
        - label: 中国本土市场履约
          tone: positive
          actor: 国内买家
          phase: 初始商业转化
          channel: 深圳制造基地
          touchpoints:
            - 首批产品于 2026 年 5 月从深圳发货。
            - 交付证明比预售叙事更有力。
        - label: 早期部署场景
          tone: positive
          actor: 零售场所和工厂评估方
          phase: 使用证明
          channel: 零售落地和工厂试点
          touchpoints:
            - 公开证明包括深圳零售场所落地和工厂试点表述。
            - 已明确的付费账户仍未披露。
        - label: 海外询价路径
          tone: risk
          actor: 中国境外买家
          phase: 采购摩擦
          channel: BotInfo 询价台
          touchpoints:
            - 在中国境外，T800 只能询价。
            - 没有公布美国价格，也未披露指定的北美分销商。
        - label: 持续扩张证明
          tone: risk
          actor: 现有客户和后续买家
          phase: 续约与规模化
          channel: 尚无公开证据
          touchpoints:
            - 指定证据池中没有公开 NRR、GRR、流失率、合同期限或集中度指标。
            - 这是发货主张与客户质量能否持续之间最主要的缺口。
    approximationNotes: null
    claimRefs:
      - CU004
      - CU006
      - CU011
      - CU012
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 合规、部署证明和合作伙伴集中度仍跑在工厂叙事前面，因此剩余风险敞口在这些领域最高。
    data:
      columns:
        - 可能性
        - 影响
        - 剩余风险敞口
      rows:
        - label: 美国 / 管辖区合规门槛
          note: 只能询价的渠道、没有公布美国授权，以及买方侧合规表述，使这一风险仍未解决。
          values:
            - label: 高
              tone: high
            - label: 高
              tone: critical
            - label: 高
              tone: high
              note: 指定证据池中没有出现主要审批材料包。
        - label: 工业工作周期与 ROI 证明
          note: 独立报道质疑计划规模下的劳动力替代经济性。
          values:
            - label: 中
              tone: medium
            - label: 高
              tone: high
            - label: 高
              tone: high
              note: 吞吐量证明领先于续约和现场性能证明。
        - label: 合作伙伴与产能集中度
          note: Luxshare 和郑州扩建项目处于规模化的关键路径上。
          values:
            - label: 中
              tone: medium
            - label: 高
              tone: high
            - label: 中-高
              tone: high
        - label: 认证证明缺口
          note: 存在第三方 CE 引用，但指定证据池中没有主要证书文件。
          values:
            - label: 中
              tone: medium
            - label: 高
              tone: high
            - label: 高
              tone: high
        - label: IPO 预期错配
          note: 当融资和估值先于可重复的部署证据到来时，上市准备可能跑在商业证明前面。
          values:
            - label: 中
              tone: medium
            - label: 高
              tone: high
            - label: 中-高
              tone: high
        - label: 支持与渠道准备度
          note: 年轻公司的支持覆盖面和仍在成形的西方分销网络可能拖慢商业化。
          values:
            - label: 高
              tone: high
            - label: 中-高
              tone: high
            - label: 高
              tone: high
    claimRefs:
      - CR005
      - CR010
      - CR013
      - CR015
      - CR016
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 建议取决于融资和工厂证明是否跑在尚缺的商业经济性与渠道放行前面。
    data:
      nodes:
        - id: mark
          label: 上一轮披露的私募定价
          value: RMB10B+ / roughly $1.4B-$1.5B
          note: 独立的 2026 年报道锚定了估值背景。
        - id: capital
          label: 融资与 IPO 选项
          value: $200M Series B + confidential HK filing
          note: 保持资本获取渠道开放，但没有披露条款。
        - id: manufacturing
          label: 工厂与发货证明
          value: First T800 batch + one robot every 15 minutes target
          note: 展示了超越演示视频的执行进展。
        - id: product
          label: 产品与定价信号
          value: RMB180,000 starting price / quote-only overseas
          note: 定位进取，但落地后的渠道经济性仍不清楚。
        - id: gaps
          label: 商业证明缺口
          value: No public revenue, margin, or active-customer disclosure
          note: 限制了溢价入场价格的支撑。
        - id: call
          label: 建议
          value: Track / stretched / high risk
          note: 若要上调判断，需要复购订单、更清晰的披露和退出条款明确。
      edges:
        - from: mark
          to: capital
          relationship: 设定价格锚点
        - from: capital
          to: manufacturing
          relationship: 为规模化提供资金
        - from: manufacturing
          to: product
          relationship: 支撑发布叙事
        - from: product
          to: gaps
          relationship: 单靠自身无法弥合经济性缺口
        - from: gaps
          to: call
          relationship: 让建议保持谨慎
    claimRefs:
      - CV001
      - CV004
      - CV006
      - CV009
      - CV010
      - CV012
