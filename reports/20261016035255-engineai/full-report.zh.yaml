  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价透明度
        blocks:
          - type: paragraph
            body: >-
              公开变现证据指向以硬件为先的模式，核心是销售 T800 人形机器人，而不是软件驱动的经常性收入故事。EngineAI 上市材料称 T800 起价为 180,000 元，共有四个版本；BotInfo
              称海外买家必须询价，且公司没有公布美国价格。RobotSourced 补充称，常被引用的 $25,000 只是货币换算后的上市锚点，不包括运输、关税和配置升级。因此，市场有一个可用的标价底线，却看不到实际
              ASP、折扣、定金、服务附加率或出口渠道利润。              没有公开披露的已确认订单、合同金额或确认收入，因此收入质量尚未得到验证。
