      - ["Tesla Optimus", "Global incumbent / likely entrant", "High-visibility autonomy reference but not yet for sale", "Future enterprise automation programs", "Stronger autonomy and data narrative in public discourse", "No public commercial availability in this pool, so it is a reference platform more than an immediate substitute"]
      - ["Boston Dynamics Atlas", "Global incumbent / R&D benchmark", "Well-known electric Atlas successor but framed here as an R&D platform", "Advanced robotics R&D and boundary-pushing demos", "Agility benchmark and technical prestige", "Commercial productization remains less explicit than EngineAI's sales pitch"]
      - ["Fixed automation or human labor", "Status quo substitute", "Existing operating baseline rather than a vendor-specific rival", "Warehouses, factories, and repetitive service workflows", "Known process economics and no humanoid integration burden", "Lacks the reprogrammable general-purpose upside EngineAI is selling"]
    notes: >-
      Mixed source set from official product materials plus independent reviews/news; unsupported funding,
      deployment, or contract specifics are marked as unknown rather than inferred.
