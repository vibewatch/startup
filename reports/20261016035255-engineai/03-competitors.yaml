company:
  name: EngineAI
chapter:
  number: 3
  title: Competitors
  summary: >-
    The assigned evidence places EngineAI's closest direct benchmark inside China's humanoid cohort,
    especially Unitree's G1/H1 line, while Tesla Optimus and Boston Dynamics Atlas remain the best-known
    global reference points rather than price-transparent commercial substitutes. EngineAI's current edge is
    aggressive China launch pricing plus local manufacturing scale, but the same pool leaves channel depth,
    compliance, and validated industrial duty cycles materially less proven than the marketing pace.
sections:
  - id: competitive-set
    title: Competitive set is broader than one robot-vs-robot spec fight
    body: >-
      The evidence pool points to three practical comparison layers. First is the direct Chinese benchmark:
      both RoboHuman and Mike Kalil treat Unitree as the nearest live rival, with the G1 and H1 framing the
      most immediate price-versus-performance comparison for buyers who want an already announced humanoid
      rather than a concept platform. Second are high-visibility global incumbents such as Tesla Optimus and
      Boston Dynamics Atlas, which matter because they anchor expectations for autonomy and technical ambition
      even when they are not yet like-for-like commercial alternatives. Third is the status quo path of fixed
      automation and human labor, which RoboHuman uses as the real ROI hurdle for any factory deployment.
      Within EngineAI's own line, PM01 is the developer and education wedge while T800 is the current full-size
      industrial flagship; that split matters because it means some of EngineAI's lowest published prices do not
      actually buy the flagship platform investors are underwriting.
    claimRefs: [CP007, CP008, CP009, CP010, CP011]
    tableRefs: [TP001]
  - id: capability-and-pricing
    title: Price-performance is the clearest wedge, but comparability is uneven
    body: >-
      On public evidence, EngineAI's best competitive argument is not unique software proof but the combination
      of full-size hardware, visible manufacturing ramp, and launch pricing that sits far below what Western
      humanoid programs are typically assumed to cost. The official T800 page and multiple independent profiles
      consistently describe a 173 cm platform with 450 N·m peak torque and roughly four to five hours of runtime,
      while independent 2026 coverage repeatedly ties the China launch price to RMB 180,000, or about $25,000.
      That puts T800 above PM01 on industrial seriousness, but it also means EngineAI is simultaneously competing
      against its own cheaper developer robot and against Unitree's lower-cost compact G1. The result is a market
      in which headline specs and entry price are relatively legible, but true like-for-like package comparison
      remains thin once support scope, realized performance, and customer deployment terms matter.
    claimRefs: [CP001, CP002, CP003, CP004, CP005, CP008]
    tableRefs: [TP002, TP003]
  - id: durability-and-buying-frictions
    title: Durability depends more on channel, compliance, and proof of work than on viral motion demos
    body: >-
      The same sources that make EngineAI look disruptive also show why the moat is still fragile. RobotsBeat
      gives the company a credible manufacturing story, including first batch production and a 10,000-unit target
      line, which is stronger operational evidence than many early humanoid peers disclose. But BotInfo and
      RobotSourced both underline the missing buyer infrastructure: quote-only overseas procurement, no published
      North American checkout path, unresolved FCC diligence, thin support history, and no public record in this
      pool of validated industrial duty cycles or named scaled customers. That means commoditization risk is real:
      if Unitree or larger incumbents narrow the price gap or prove better channel execution, EngineAI's current
      advantage can compress quickly because much of the narrative still rides on spectacle, early manufacturing
      readiness, and China-market affordability rather than on already demonstrated global delivery depth.
    claimRefs: [CP003, CP005, CP006, CP011, CP012, CP013]
    tableRefs: [TP004]
    figureRefs: [FP001]
