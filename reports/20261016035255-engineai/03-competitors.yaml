figures:
  - id: FP001
    title: Procurement accessibility vs deployment readiness (ordinal positioning)
    type: quadrant
    summary: >-
      Ordinal map of how the assigned evidence portrays near-term buyability versus deployment credibility
      across EngineAI and the most cited alternatives.
    data:
      points:
        - label: EngineAI T800
          x: 3
          y: 4
          detail: Quote-only outside China, but supported by visible factory ramp and explicit industrial positioning.
        - label: EngineAI PM01
          x: 4
          y: 2
          detail: Cheapest and clearest developer path in the lineup, but not the flagship industrial workhorse.
        - label: Unitree G1
          x: 4
          y: 3
          detail: Public entry price and mature brand help access, while the compact form factor limits direct full-size comparison.
        - label: Unitree H1
          x: 2.5
          y: 3.5
          detail: Closest direct Chinese full-size benchmark on performance, but public pricing and channel terms are thin in this pool.
        - label: Tesla Optimus
          x: 1
          y: 3
          detail: Strong autonomy narrative, yet not for sale in the assigned evidence.
        - label: Boston Dynamics Atlas
          x: 1
          y: 2.5
          detail: Prestigious R&D benchmark, but less clearly a current commercial procurement option than EngineAI's pitch.
    approximationNotes: >-
      Ordinal 1-5 scores reflect public procurement accessibility on the horizontal axis and sourced deployment
      readiness on the vertical axis. They are evidence-backed analyst judgments built from explicit price or
      quote-path disclosure, manufacturing proof, and commercialization posture in the assigned pool rather than
      measured benchmark data.
    claimRefs: [CP003, CP005, CP006, CP009, CP010, CP012, CP013]
