    summary: >-
      EngineAI's public narrative compresses founding, flagship launch,
      fundraising, manufacturing, and IPO-prep signals into less than three
      years.
    data:
      items:
        - date: "2023-10"
          label: Founded in Shenzhen
          detail: Zhao Tongyang founded EngineAI in Shenzhen and became its public chief executive.
          tone: neutral
        - year: "2024"
          label: First test machine referenced
          detail: Later manufacturing disclosures describe 2024 as the year of EngineAI's first test machine.
          tone: neutral
        - date: "2025-02"
          label: PM01 front-flip demo draws attention
          detail: The PM01 front flip became the visibility event that put the company on the global humanoid map.
          tone: opportunity
        - date: "2025-12-08"
          label: T800 launch opens with RMB 180,000 starting price
          detail: EngineAI's launch page opened four T800 variants and framed the robot as ready for industrial deployment.
          tone: opportunity
        - date: "2026-01"
          label: T800 makes global CES debut
          detail: CES 2026 marked the T800's first global showcase alongside PM01.
          tone: opportunity
        - date: "2026-04"
          label: Series B reported at USD 200 million
          detail: Independent coverage tied the round to valuation above RMB 10 billion and strategic investors.
          tone: opportunity
        - date: "2026-05-29"
          label: Shenzhen manufacturing base launches
          detail: The company said the 12,000 square meter base could roll one humanoid off the line every 15 minutes.
          tone: positive
        - date: "2026-06-12"
          label: Confidential Hong Kong IPO filing reported
          detail: Public reporting signaled a push toward public-market governance before revenue disclosure is visible.
          tone: warning
    approximationNotes: null
    claimRefs: [CO001, CO006, CO008, CO009, CO010, CO012, CO013, CO014]
