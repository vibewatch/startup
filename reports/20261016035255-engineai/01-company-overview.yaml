    - type: private-evidence-only
      severity: material
      topic: leadership and governance disclosure
      missingEvidence: Current board roster, committee structure, equity splits, and named executive org chart.
      whyItMatters: Founder concentration and investor rights matter for control-risk, succession planning, and IPO readiness.
      diligencePath: Request the latest cap table, board materials, and management org chart from the company or lead investor.
      relatedQuestionRefs: [QO009]
      relatedTableRefs: [TO002, TO003]
    - type: private-evidence-only
      severity: material
      topic: commercial traction and scale metrics
      missingEvidence: Revenue, customer count, shipped-unit count, contract values, backlog, and headcount disclosures.
      whyItMatters: Without these metrics, later chapters can assess manufacturing ambition but not proven commercial scale or operating efficiency.
      diligencePath: Request a monthly revenue bridge, customer list with deployment status, shipped-unit cohort data, and headcount by function.
      relatedQuestionRefs: [QO009]
      relatedTableRefs: [TO001]
