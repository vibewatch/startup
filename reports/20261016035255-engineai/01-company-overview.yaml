schemaVersion: report-v2
artifact: company-overview
slug: engineai
runDate: 2026-10-16
company:
  name: EngineAI
chapter:
  number: 1
  title: Company Overview
  summary: >-
    EngineAI is a Shenzhen humanoid robotics startup founded in October 2023 by
    Zhao Tongyang that has moved unusually quickly from demo-led visibility to
    a reported USD 200 million Series B, a Shenzhen manufacturing base, and a
    confidential Hong Kong IPO filing. The assigned evidence supports a real
    scale-up story, but it still leaves revenue, customer traction, headcount,
    board composition, and North American commercialization readiness only
    partially disclosed.
sections:
  - id: identity-stage
    title: Identity, stage, and current scope
    body: >-
      EngineAI presents itself as a general-purpose embodied-intelligence
      company founded in Shenzhen in October 2023, with Zhao Tongyang as the
      founder-chief executive and a product line spanning smaller research and
      service robots through the full-size T800 humanoid. Across official and
      independent profiles, the stable ground-truth is that the company is now
      in a late private scale-up phase: it has a named flagship product, a
      factory launch, a reported April 2026 Series B, and a reported June 2026
      confidential Hong Kong IPO filing, but no public financial disclosure
      that would let later chapters treat it as a proven revenue-scale company.
    claimRefs: [CO001, CO002, CO004, CO005, CO009, CO010, CO016]
    tableRefs: [TO001]
  - id: leadership-governance
    title: Leadership, governance, and control surfaces
    body: >-
      Public leadership disclosure is still founder-centric. Zhao Tongyang is
      the central operator in the assigned sources, with prior Dogotix and
      XPeng robotics experience forming the main published founder-market-fit
      evidence, while Ren Guowen appears as the co-founder attached to the
      manufacturing-network narrative. That is enough to show relevant robotics
      operating context, but not enough to map a full management bench, board
      composition, or succession depth; for diligence purposes, governance looks
      as though it is formalizing around an IPO path faster than public
      disclosure is broadening around the underlying organization chart.
    claimRefs: [CO002, CO003, CO007, CO009, CO016]
    tableRefs: [TO002, TO003]
  - id: capital-commercialization
    title: Capital, manufacturing ramp, and commercialization posture
    body: >-
      The strongest externally corroborated scale markers are financial and
      manufacturing rather than recurring-commercial metrics. Independent
      coverage says EngineAI raised a USD 200 million Series B at a valuation
      above RMB 10 billion, with Luxshare Precision and Henan Investment
      Group's Huirong Fund positioned as material participants, while the
      company says its Shenzhen base can roll a humanoid off the line every 15
      minutes and that the T800 line starts at RMB 180,000. Those are material
      signals for industrial ambition, but the same source set still frames the
      US channel as quote-only and unresolved on compliance, which means public
      evidence supports "manufacturing ramp with strategic backers" more
      strongly than "broadly validated commercial deployment."
    claimRefs: [CO010, CO011, CO012, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
  - id: milestone-read-through
    title: Milestones and what later chapters should treat as gaps
    body: >-
      The chapter timeline is dense for a company barely three years old:
      foundation in 2023, a 2024 test-machine reference, the February 2025
      PM01 front-flip moment, December 2025 T800 launch pricing, CES 2026,
      April 2026 financing, May 2026 factory commissioning, and June 2026 IPO
      reporting. What later chapters should not assume from that pace is
      equivalent revenue maturity. The assigned pool still does not publish a
      recurring customer base, unit sell-through, headcount, revenue run rate,
      or a detailed board roster, so those remain explicit diligence asks
      rather than reusable facts.
    claimRefs: [CO001, CO006, CO008, CO009, CO010, CO012, CO013, CO014, CO016]
