evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: leadership and governance disclosure
    missingEvidence: Current board roster, committee structure, equity splits, and named executive org chart.
    whyItMatters: Founder concentration and investor rights matter for control-risk, succession planning, and IPO readiness.
    diligencePath: Request the latest cap table, board materials, and management org chart from the company or lead investor.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: commercial traction and scale metrics
    missingEvidence: Revenue, customer count, shipped-unit count, contract values, backlog, and headcount disclosures.
    whyItMatters: >-
      Without these metrics, later chapters can assess manufacturing ambition but not proven commercial scale or
      operating efficiency.
    diligencePath: >-
      Request a monthly revenue bridge, customer list with deployment status, shipped-unit cohort data, and headcount by
      function.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: customer-proof
    missingEvidence: Named customers, deployment cohort sizes, contract values, and the specific budget owner for early T800 purchases.
    whyItMatters: >-
      Without customer proof, the buyer map remains directional and cannot be translated into verified demand quality or
      repeatability.
    diligencePath: >-
      Request customer references, signed pilot or purchase-order evidence, and deployment case studies broken out by
      workflow and buyer.
    relatedQuestionRefs:
      - QM004
      - QM008
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: material
    topic: pricing
    missingEvidence: >-
      A reconciled price sheet showing edition-level list prices, delivered export quotes, and whether public dollar
      figures include shipping, duties, or support.
    whyItMatters: >-
      Pricing comparability directly affects affordability, gross-value sizing, and competitive positioning across
      geographies.
    diligencePath: >-
      Obtain current quotes for each edition in China and export channels, plus signed channel terms that specify
      duties, support, and compliance responsibilities.
    relatedQuestionRefs:
      - QM002
      - QM007
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: tam-sam-som
    missingEvidence: >-
      A credible independent market model or management cohort analysis that bridges the T800 use cases to a defensible
      TAM, SAM, and near-term SOM.
    whyItMatters: >-
      The chapter can bound commercialization with price and capacity proxies, but it cannot validate long-run market
      size or growth with the assigned public evidence alone.
    diligencePath: >-
      Ask management for internal cohort sizing by workflow and geography, then cross-check with independent industry
      research or customer budget data.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: enterprise-deployment-proof
    missingEvidence: Named production customers, recurring order volume, and documented task-level KPIs for T800 deployments.
    whyItMatters: >-
      Without verified deployment proof, the buyer cannot tell whether price-performance headlines translate into
      repeatable factory ROI.
    diligencePath: Request reference customers, pilot outcome dashboards, and contract scope from EngineAI or channel partners.
    relatedQuestionRefs:
      - QP005
      - QP006
      - QP008
  - type: missing-source
    severity: material
    topic: global-channel-comparison
    missingEvidence: Like-for-like channel, service, and warranty terms for Unitree H1, T800 exports, and Western incumbents.
    whyItMatters: Distribution and service execution can outweigh launch price once a humanoid moves from demo to fleet purchase.
    diligencePath: >-
      Collect written quote packs and after-sales terms from each vendor before underwriting any cross-vendor TCO
      conclusion.
    relatedQuestionRefs:
      - QP004
      - QP005
      - QP008
  - type: missing-source
    severity: minor
    topic: likely-entrants
    missingEvidence: Additional source-backed profiles of likely entrants beyond Unitree, Tesla Optimus, and Boston Dynamics Atlas.
    whyItMatters: >-
      The chapter can identify visible benchmark classes, but it cannot yet map a full likely-entrant set or emerging
      partner ecosystem.
    diligencePath: Expand future competitor sweeps to other Chinese and Western humanoid vendors using the same evidence standards.
    relatedQuestionRefs:
      - QP001
      - QP007
  - type: missing-source
    severity: material
    topic: revenue-quality
    missingEvidence: Recognized revenue, bookings, revenue mix by edition/channel, and revenue-recognition policy.
    whyItMatters: Without realized revenue and mix data, list pricing cannot be converted into a credible base-case model.
    diligencePath: Request monthly revenue bridge, signed contract log, and SKU/channel mix from management.
    relatedQuestionRefs:
      - QI001
      - QI002
      - QI005
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin, BOM, warranty reserve, service attach rate, utilization, and line-yield data.
    whyItMatters: Factory scale only improves equity value if hardware margin and support burden are understood.
    diligencePath: Request BOM by edition, yield and scrap reports, warranty assumptions, and service P&L.
    relatedQuestionRefs:
      - QI004
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: runway
    missingEvidence: Cash balance, monthly burn, debt facilities, project-finance obligations, and covenant headroom.
    whyItMatters: >-
      The Series B and IPO filing show fundraising activity, but not whether the company can fund capacity until demand
      scales.
    diligencePath: Obtain latest management accounts, capex plan, debt schedule, and 12- to 18-month cash runway model.
    relatedQuestionRefs:
      - QI006
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: demand-conversion
    missingEvidence: Customer count, backlog, conversion funnel, vertical mix, and customer concentration.
    whyItMatters: Capacity expansion is financially attractive only if order conversion and concentration risk are visible.
    diligencePath: Request customer roster by vertical, backlog report, pipeline stages, and concentration metrics.
    relatedQuestionRefs:
      - QI003
      - QI005
      - QI007
      - QI008
    relatedTableRefs:
      - TI001
      - TI003
  - type: missing-source
    severity: material
    topic: certification-proof
    missingEvidence: >-
      Named CE, UL, or Chinese industrial safety certificate numbers and the underlying test documents for the T800 SKUs
      marketed for industrial use.
    whyItMatters: >-
      Third-party certification evidence is needed to separate commercial positioning from actually approved deployment
      scope and compliance readiness.
    diligencePath: >-
      Request certificate IDs, covered SKUs, and issuing bodies from EngineAI, then verify them against certifier or
      regulator records.
    relatedQuestionRefs:
      - QE006
      - QE008
  - type: private-evidence-only
    severity: material
    topic: developer-tooling
    missingEvidence: >-
      Public SDK/API documentation, version history, sample integrations, and support artifacts for the trims that
      advertise secondary development.
    whyItMatters: >-
      Integration readiness and developer lock-in risk cannot be underwritten from a secondary-development checkbox
      alone.
    diligencePath: >-
      Request access to the SDK portal, API references, release notes, and a live integration example from a pilot
      customer or systems integrator.
    relatedQuestionRefs:
      - QE003
      - QE007
  - type: missing-source
    severity: material
    topic: field-reliability
    missingEvidence: >-
      Measured uptime, MTBF, service response SLAs, and named long-duration production deployment references for T800
      installations.
    whyItMatters: Factory QA and spec disclosures do not show whether the robot sustains industrial duty cycles after shipment.
    diligencePath: >-
      Obtain pilot logs, warranty/service metrics, and named deployment references with operating hours and failure
      history.
    relatedQuestionRefs:
      - QE004
      - QE008
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: Named production customers, deployment locations, unit counts, and outcome KPIs for T800 accounts
    whyItMatters: >-
      Public shipment and placement signals are materially weaker than named references when judging durability and
      reference quality
    diligencePath: >-
      Request a customer list with deployment stage, site count, contract value, and operator references; verify at
      least three by direct outreach
    relatedQuestionRefs:
      - QU004
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: retention-and-concentration-gap
    missingEvidence: NRR, GRR, churn, renewal timing, contract length, and top-customer revenue concentration
    whyItMatters: Without retention and concentration data, customer quality cannot be distinguished from one-time pilot demand
    diligencePath: >-
      Obtain cohort, renewal, and concentration schedules from management and reconcile them to signed contracts or
      invoicing records
    relatedQuestionRefs:
      - QU005
      - QU008
  - type: missing-source
    severity: material
    topic: overseas-channel-readiness
    missingEvidence: Foreign shipment counts, distributor terms, support SLAs, and radio-compliance documentation for export markets
    whyItMatters: >-
      Quote-only overseas access does not prove that EngineAI can convert interest into durable international
      deployments
    diligencePath: >-
      Ask for export compliance files, distributor or direct-support arrangements, and completed overseas delivery
      references by region
    relatedQuestionRefs:
      - QU006
  - type: missing-source
    severity: material
    topic: certification-documentation
    missingEvidence: >-
      Primary FCC, CE, GB, UL, or equivalent jurisdiction-specific approval documents tied to actual T800 hardware
      variants and radios.
    whyItMatters: >-
      Without first-party approval records, legal marketability and safety readiness remain inference-heavy and can
      delay orders or importability.
    diligencePath: >-
      Obtain declaration and certificate numbers, test lab reports, radio module filings, and outside counsel
      confirmation for each target market.
    relatedQuestionRefs:
      - QR001
      - QR002
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: field-reliability-and-support
    missingEvidence: >-
      Named production deployments, uptime and failure-rate data, warranty claims, spare-parts coverage, and service
      SLAs by region.
    whyItMatters: >-
      Throughput and first-batch shipment claims do not prove that robots survive industrial duty cycles or that
      post-sale economics are supportable.
    diligencePath: >-
      Request top-customer references, fleet uptime dashboards, RMAs, field-failure logs, and regional service-partner
      agreements.
    relatedQuestionRefs:
      - QR003
      - QR004
      - QR007
  - type: missing-source
    severity: material
    topic: partner-and-capacity-concentration
    missingEvidence: >-
      Luxshare manufacturing agreement terms, Zhengzhou commissioning milestones, and any capacity, exclusivity, or
      contingency-supplier provisions.
    whyItMatters: >-
      A large share of the scale thesis appears to run through a small set of manufacturing and regional-capital
      relationships.
    diligencePath: >-
      Review supply and JV agreements, capex budget, plant commissioning timeline, and fallback suppliers before
      underwriting volume assumptions.
    relatedQuestionRefs:
      - QR006
      - QR008
  - type: private-evidence-only
    severity: material
    topic: disclosed-unit-economics
    missingEvidence: Recurring revenue, gross margin, active customer count, contract value, and renewal data.
    whyItMatters: >-
      Those metrics determine whether the current private mark is growth-backed or still mostly option value on future
      adoption.
    diligencePath: >-
      Request board or investor materials showing booked orders, revenue bridge, margin profile, and customer
      concentration.
    relatedQuestionRefs:
      - QV008
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: >-
      IPO timing, pre-IPO round terms, liquidation preferences, anti-dilution clauses, and any structured capital
      features.
    whyItMatters: >-
      An apparently unchanged headline valuation can still imply weak forward returns if the preference stack or
      new-money terms are investor-protective.
    diligencePath: >-
      Review draft offering materials or the latest financing documents for share class rights and any pay-to-play or
      ratchet mechanics.
    relatedQuestionRefs:
      - QV008
  - type: access-blocked
    severity: material
    topic: export-and-channel-readiness
    missingEvidence: Primary regulatory documentation for overseas radio/compliance clearance and authorized distribution coverage.
    whyItMatters: >-
      Channel access affects who can actually buy the robot and whether quote-only international demand can convert into
      compliant revenue.
    diligencePath: >-
      Obtain written compliance filings, distributor agreements, and geography-specific shipment restrictions from the
      company or channel partners.
    relatedQuestionRefs:
      - QV008
