      - number: '1.3'
        title: 规模信号、收入质量与控制缺口
        blocks:
          - type: paragraph
            body: >-
              Mercor 于 2026 年 5 月称年化收入运行率超过 $1 billion；Sacra 于 2026 年 6 月估算年化毛收入为 $2 billion [CO009] [CO010]。这些不是
              ARR，也不能视为 Mercor 留存的净收入。公司页面显示付款规模变化：5 月每天向超过 30,000 名周活跃承包商支付超过 $2 million；当前主页则声称每日付款超过 $4 million、专家超过
              30,000 名 [CO011]。主页另称已创建 507,000 个岗位 [CO012]；招聘页曾发布英国远程商业运营专家职位，时薪 $150 [CO013]。隐私声明明确将 work.mercor.com
              排除在网站声明范围外 [CO014]。公司付款复盘承认人工对账和站外数据已超出早期控制 [CO015]。第三方估计承包商获得毛账单的 60% 至
              70%，意味着公司实际留存比例明显更低，但公开资料没有经审计的毛转净桥接表 [CO016]。
            claimRefs:
              - CO009
