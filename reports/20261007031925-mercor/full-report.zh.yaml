  - id: TV003
    title: 乐观、基准与悲观情景框架
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 概率信号
      - 关键风险或下行触发因素
    rows:
      - - 乐观
        - 据报道的融资完成；>$2B 收入运行率转化为持久的净收入、利润率、留存和多元化需求。
        - 只有在经济性得到验证、能够计算退出倍数和目标回报后，$20B+ 才有支撑。
        - 中低：据报道的条款清单和产品广度是积极因素，但缺少经审计的经济性数据。
        - 若无法验证净收入或客户多元化，乐观情景即告终止。
      - - 基准
        - 规模延续，但融资条款和收入质量仍属非公开信息。
        - $10B-$20B 是最近一次确认估值与据报道的融资讨论之间的参考区间，不是公允价值估计。
        - 中：区间两端都有公开报道，但只有较低端对应已完成融资。
        - 在融资和单位经济性尽调完成前，维持观察状态。
      - - 悲观
        - 总收入到净收入的转化不及预期、主要客户继续暂停合作，或泄露诉讼造成重大成本或流失。
        - 低于 $10B 代表下轮融资区间；现有证据不足以支持精确底价。
        - 重大下行信号：据报道的诉讼和客户中断仍在持续，而最终责任尚未确定。
        - 客户流失、不利的法律结果、控制措施失效，或融资低于 C 轮估值。
    notes: 情景区间是以据报道的私募市场估值为锚的决策阈值，不是独立的公允价值估计；不会从缺失的非公开数据推断概率百分比、退出价值或目标回报。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV012
      - CV013
      - CV014
      - CV015
