      - number: '8.2'
        title: 投资逻辑、反向逻辑与融资背景
        blocks:
          - type: paragraph
            body: >-
              投资逻辑是：Mercor 正把大型专家网络扩展到评估、基准和企业智能体工作流，平台价值可能超过单纯劳动力市场。反向逻辑是：收入质量可能显著弱于
              headline——毛收入含承包商付款，公开工作市场展示项目制报酬，第三方融资总额也不一致。Tracxn 报告融资 $492 million，RevenueMemo 报告 $483.6 million，Exa
              目录仍称仅三轮融资 $136 million。这些差异不改变已确认的 $350 million C 轮，却说明在评估进入价格或稀释前，必须取得一手融资文件和完全摊薄股权结构表。
            claimRefs:
              - CV002
