chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份、运营模式与领导层
        blocks:
          - type: paragraph
            body: >-
              Mercor 的法定实体为 Mercor.io Corporation，所在地列为旧金山 [CO001]。公司描述的是双边市场：AI 实验室和企业购买全球专家承包商的服务，同时提供人类数据、评估、基准测试和企业
              AI 产品 [CO002]。独立资料显示公司成立于 2023 年 1 月，三位联合创始人为 Brendan Foody、Adarsh Hiremath 和 Surya Midha [CO003]；资料还称前
              Uber 首席产品官 Sundeep Jain 于 2025 年 5 月加入，担任首任总裁
              [CO004]。证据支持“创始人主导、配有一名资深运营高管”，但无法确认各创始人的当前分工、完整管理层、董事会构成、投票控制权或继任安排。快速扩张和创始人知识集中可能造成公开资料无法消除的执行与治理依赖。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
