      - number: '1.2'
        title: 融资与公司里程碑
        blocks:
          - type: paragraph
            body: >-
              公开资料显示融资进展陡峭：2024 年 9 月完成 $30 million A 轮，投后估值 $250 million [CO005]；2025 年 2 月完成 $100 million B 轮，估值 $2
              billion [CO006]；2025 年 10 月完成 $350 million C 轮，估值 $10 billion [CO007]。后续独立审阅称，截至 2026 年 10 月 1 日，按 $20
              billion 估值融资 $500 million 的谈判仍未确认交割 [CO008]。因此，现有证据支持的最近定价估值是 $10 billion；$20 billion
              只是据报道的谈判数字，并非更新后的估值事实或公司可用现金。融资史显示投资者愿意支持 Mercor
              增长，但未披露老股出售机制、债务或授信、清算优先权、持股比例、投票权或现任董事会。利益相关方图只记录经济相关性，不推断未公开的控制条款。
            claimRefs:
