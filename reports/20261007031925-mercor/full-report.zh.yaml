          detail: 统一的档案数据支持硬筛选、语义检索、词法检索和排序。
          modules:
            - MongoDB Atlas
            - Vector Search
            - Lucene 搜索
          outputs:
            - 排序后的候选人和任务
        - label: 新鲜度与模型服务
          detail: 事件驱动的更新刷新向量嵌入；托管语言模型支持评分和综合。
          modules:
            - Kafka CDC
            - Voyage AI 向量嵌入
            - Fireworks AI 托管
          outputs:
            - 当前索引
            - 已评分档案
        - label: 评测产品
          detail: APEX 基准和评测工作流衡量模型在专业工作上的表现。
          modules:
            - APEX-Agents
            - APEX-Accounting
            - APEX-SWE
          outputs:
            - 分数
            - 评测资产
        - label: 企业交付
          detail: 前置部署工程、集成和持续优化，将输出接入企业工作流。
          modules:
            - 企业集成
            - 数据变现
            - 智能体部署
          outputs:
            - 生产环境 AI 工作流
    approximationNotes: 概念栈基于指定公开来源；不是经过验证的系统图，也不意味着所有模块共享同一运行时。
