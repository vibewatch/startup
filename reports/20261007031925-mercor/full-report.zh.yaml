      - number: '8.4'
        title: 退出准备度与最终尽调
        blocks:
          - type: paragraph
            body: >-
              现有证据无法证明已具备退出准备度。RevenueMemo 称 Mercor 仍是私有公司，尚未提交 IPO 文件；据报道的 2026 年融资也尚未宣布。安全事件后又出现至少七起据报道的集体诉讼，加上 Meta
              据报道暂停合作，因此客户留存、网络控制、保险和或有负债需要更高证明门槛。在估值建议转为买入前，尽调应取得经审计毛收入和净收入、毛利率、队列留存、头部客户集中度、当前现金和债务、完全摊薄股权结构表、优先及老股条款、诉讼状态、网络补救证据，以及董事会批准的退出或流动性计划。在溢价估值下，无法调和这些事项就会打破投资逻辑。
