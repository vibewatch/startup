              - CV012
              - CV013
      - number: '8.3'
        title: 情景与回报逻辑
        blocks:
          - type: paragraph
            body: >-
              下行情景以最近确认的 $10 billion 估值和据报道的 $20 billion
              讨论为边界，是决策锚点，不是公允价值估算。乐观情景要求融资完成，且管理层声称的运行率转化为持久净收入、毛利、留存和客户多元化。基准情景把公开估值作为参考区间，不设目标回报。若毛转净经济性令人失望，或法律与客户后果持续，悲观情景是价格低于上一轮。由于完全摊薄持股和优先条款不可得，没有公开证据支持可辩护的持有期、退出收益或回报分布。
            claimRefs:
