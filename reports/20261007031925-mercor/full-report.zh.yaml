  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资判断
        blocks:
          - type: paragraph
            body: >-
              证据支持“观察 / 继续研究”，而不是不计价格买入。Mercor 的规模信号异常强：管理层称年化收入运行率超过 $2 billion，报道还称早期融资讨论的估值是最近确认估值的两倍。但 headline
              比率不是可投资倍数。公开报道称毛收入包含转付给专家的报酬，而公开证据没有毛转净桥接、毛利率、客户集中度、优先股堆叠或已完成的 2026 年融资。若估值达到据报道的 $20
              billion，这些信息缺失是核心问题而非边际问题。决策应继续取决于经验证的经济质量和可执行的融资条款。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV014
