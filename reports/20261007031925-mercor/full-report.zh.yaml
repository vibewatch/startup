              审阅的内部文件称，2026 年上半年毛收入约 $614 million，6 月毛收入年化运行率超过 $2 billion。这些不是 ARR，不能按经常性软件收入估值。同一报道称 OpenAI 和
              Anthropic 约占上半年总额的 91%，收入质量因此依赖少数前沿实验室预算。Mercor 未披露产品收入结构、合同期限、续约率或确认政策。
