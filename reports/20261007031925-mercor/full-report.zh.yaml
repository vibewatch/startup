  - id: FU001
    title: 已观察到的客户旅程触点与未解决的扩张闭环
    type: journey-map
    summary: 公开证据覆盖从专家招募到企业评测，但没有衡量转化为续约或账户扩张的比例。
    data:
      nodes:
        - id: expert-discovery
          label: 发现专家
          detail: Mercor 称其网络覆盖数百个专业领域，共有五百万人。
          touchpoints:
            - Company homepage
            - Newsroom
        - id: role-matching
          label: 岗位匹配
          detail: 当前列表展示多个专业领域的项目制、按小时和按任务计费机会。
          touchpoints:
            - Explore opportunities
            - Application and matching
        - id: human-data
          label: 人工数据与评测
          detail: Mercor 将其专业评测业务描述为拥有 30,000 多名专家的运营池。
          touchpoints:
            - Expert work
            - Evaluation
        - id: workflow-diagnostic
          label: 企业诊断
          detail: 已发布的证明材料包括工作流映射和价值创造评估。
          touchpoints:
            - Book a demo
            - Workflow diagnostic
        - id: readiness-evaluation
          label: 准备度与部署
          detail: 案例记录包括专家评分的智能体运行结果，以及 SRE 部署结果。
          touchpoints:
            - Production-readiness evaluation
            - Enterprise integration
        - id: renewal-expansion
          label: 续约与扩张
          detail: 公开证据未披露转化、续约、NRR、GRR 或账户扩张。
          touchpoints:
