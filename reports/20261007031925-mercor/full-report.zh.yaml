  - id: FR001
    title: 风险热力图：残余严重程度与可能性评估
    type: matrix
    summary: 以可能性和影响两个维度，直观展示 Mercor 的核心运营、法律、合作伙伴和估值风险。
    data:
      columns:
        - 可能性低
        - 可能性中
        - 可能性高
      rows:
        - label: 灾难性 / 生存性影响
          values:
            - label: 云服务商系统性中断
              tone: neutral
            - label: 前沿实验室客户全部冻结
              tone: critical
            - label: 供应链泄露与大规模集体诉讼
              tone: critical
        - label: 严重影响
          values:
            - label: 模型架构过时
              tone: neutral
            - label: 前三大实验室永久流失
              tone: risk
            - label: 高管团队流失
              tone: risk
        - label: 高影响
          values:
            - label: 欧盟《人工智能法案》下的监管处罚
              tone: warning
            - label: 生物识别数据被武器化
              tone: risk
            - label: 企业采购冻结
              tone: risk
        - label: 中等影响
          values:
            - label: 承包商费率与工资上涨
              tone: neutral
            - label: 工作站监控审查
              tone: warning
            - label: 网络安全审计开销增加
              tone: warning
        - label: 低影响
          values:
            - label: 门户界面轻微中断
              tone: neutral
            - label: 零星承包商计费问询
              tone: neutral
            - label: 常规网站政策更新
              tone: neutral
        - label: 可忽略影响
          values:
            - label: 标准域名续费
              tone: neutral
            - label: 社交媒体品牌名称抢注
              tone: neutral
            - label: 非关键开源漏洞报告
              tone: neutral
    approximationNotes: 在计入 Mercor 已宣布的安全补救和信用监控防御措施后，评估残余风险严重程度。
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR007
      - CR008
      - CR010
      - CR014
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 据报道的规模和产品广度要先经过收入质量、价格和风险检查，才会得到有条件的观察建议。
    data:
      nodes:
        - id: scale-signal
          label: 规模信号
          detail: 管理层披露的年化收入运行率超过 $2B
        - id: product-signal
          label: 产品信号
          detail: 人工数据、评测、基准和企业工作流
        - id: quality-check
          label: 收入质量检查
          detail: 据报道的总收入包含代付给专家的款项
        - id: price-check
          label: 价格检查
          detail: 已确认的 $10B 估值与据报道的 $20B 讨论
        - id: risk-overlay
          label: 风险调整
          detail: 泄露诉讼和据报道的客户暂停合作
        - id: recommendation
          label: 观察 / 继续研究
          detail: 要求提供净经济性、融资条款和风险解决证据
    approximationNotes: 这是定性决策序列；节点顺序不代表数值权重，也不意味着据报道的融资已经完成。
    claimRefs:
      - CV001
      - CV004
      - CV006
      - CV007
      - CV013
      - CV016
