  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义、范围边界与支出分类
        blocks:
          - type: paragraph
            body: >-
              Mercor 位于传统专业技术招聘机构与专业 AI 数据基础设施供应商之间的新兴市场层。其核心商业引擎把医生、企业律师、专业工程师和研究科学家等领域专家，连接到需要人工反馈来训练模型、强化学习和基准评估的前沿
              AI 实验室及企业模型开发者。评估商业机会和估值倍数时，必须把市场支出拆成不同预算类别，而不能混成一个笼统的 AI 市场。可计入的支出包括前沿模型 RLHF、专家编写的评估基准（如 Mercor 的
              APEX）、企业工作流与运营数据授权，以及专业承包商招聘；低技能众包标注、企业内部工程薪资、标准 SaaS 订阅、计算硬件和推理托管资本开支则明确排除。替代方案包括
              Toptal、Andela、Upwork、实验室内部招聘流程和合成数据标注竞争者。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: 市场规模口径、增长预测与经济现实
        blocks:
          - type: paragraph
            body: >-
              评估 Mercor 的市场规模需要多个互补口径，而不是一个推测性的自上而下数字。全球专业招聘和人力资本管理支出约 $650 billion，但 Mercor 可服务市场受限于专业 AI
              训练劳动力、强化学习评估和企业领域专家管线，估计为 $12 billion 至 $18 billion；可获取市场，即专家 RLHF 与企业工作流数据变现，目前约 $3.0 billion 至 $4.5
              billion。Mercor 称截至 2026 年 6 月毛年化收入超过 $2.0 billion，四个月前为 $1.0 billion；其活跃网络包括超过 30,000 名周活跃承包商和 300,000
              名注册专业人士，每日付款 $1.5 million 至 $4.0 million。然而，这属于承包商毛账单，不是高毛利软件 ARR。市场分析师估计 Mercor 对代付承包商款项收取约 30%
              的招聘费和抽成，因此净收入只是 headline 毛额的一部分。Surge AI（估值 $15 billion、收入超过 $1 billion）和 Scale AI（估值 $29
              billion）被私募市场按基础设施倍数定价，而 Mercor 还要在价格发现加剧时守住毛利率。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
      - number: '2.3'
        title: 买方分层、预算配置与采用路径
        blocks:
          - type: paragraph
            body: >-
              Mercor 的采购权分散在标准和预算各异的组织买方手中。OpenAI、Anthropic、Google DeepMind 等前沿 AI
              模型实验室是快速扩张的主要经济引擎；首席科学家、技术人员和研究主管使用研发预算购买经过领域验证的人工反馈与专有评估数据集。主要触发点是模型能力遇到瓶颈：合成数据或公开网络语料无法推进复杂推理，因而需要经过认证的法律、医疗和数学判断。金融、医疗和物流企业则由
              CIO、CTO 和企业自动化负责人采购，用 IT 创新、流程转型及部门运营预算部署领域 AI 智能体并变现内部工作流。企业销售周期通常为 60 至 180 天，还需严格的数据治理、经验证的 SOC 2 和 ISO
              合规认证，以及证明能替代成本的投资回报，才能把试点转入生产。
            claimRefs:
              - CM002
              - CM005
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM005
              - CM010
              - CM011
      - number: '2.4'
        title: 采用驱动、结构性瓶颈与集中度逆风
        blocks:
          - type: paragraph
            body: >-
              前沿 AI 行业的顺风来自预训练公开网页文本逐渐耗尽后，对高水平专家人工监督的迫切需求；Meta 投资 Scale AI $14 billion 后，前沿实验室的中立性担忧也给 Mercor
              打开了商业窗口。企业对会计、法律和医疗工作流中经验证的 AI 智能体需求，进一步把采用扩展到非工程垂直行业。但结构性约束和运营漏洞威胁持续增长：2026 年 3 月，受损的开源 LiteLLM
              依赖引发供应链事件，导致 4 TB Mercor 平台数据、承包商个人身份信息和实验室专有训练方法被盗。事件引发多起联邦集体诉讼，Meta 无限期暂停与 Mercor
              的所有在进行工作，暴露出极高的交易对手集中风险。长期被合成数据替代、LinkedIn 和 Upwork 等平台商品化，以及买方定价表不透明，也构成需要持续尽调的采用阻力。
            claimRefs:
              - CM004
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: 证据图表
        blocks:
          - type: callout
            title: 毛收入运行率与平台净利润现实
            body: >-
              Mercor 快速达到 $2.0 billion 年化收入运行率，但投资者必须把毛账单与软件式净收入分开。其业务主要是人才代付网络，每天向数万名专业承包商支付超过 $1.5 million 至 $4.0
              million。按约 30% 市场抽成估算，净收入约 $600 million；在 $10 billion 至 $20 billion 资本估值下，这会显著改变估值倍数的解读。
            calloutType: insight
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: callout
            title: 前沿实验室供应链信任的脆弱性
            body: >-
              2026 年 3 月 LiteLLM 供应链泄露事件证明，Mercor 商业模式极易受到企业信任冲击。4 TB 数据被外泄，包括承包商个人信息和机密模型评估工作流；Meta 无限期暂停 Mercor
              合同，也暴露出少数前沿模型实验室主导的市场存在客户集中的生存风险。
            calloutType: risk
            claimRefs:
              - CM012
              - CM013
              - CM014
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 后训练格局与市场结构
        blocks:
          - type: paragraph
            body: >-
              Meta 于 2025 年 6 月以 $14.3B 收购 Scale AI 49% 股权后，AI 训练数据与模型评估市场重新分层 [CP001]。中立性担忧促使 Google、OpenAI 等前沿实验室把后训练和
              RLHF 预算转向独立供应商 [CP001, CP005]。随着前沿模型从图像分类、边界框等低技能批量采集转向复杂推理，后训练瓶颈越来越需要医生、律师、金融人士和专业软件工程师等持证专家 [CP004,
              CP005]。Mercor 直接面对 Scale AI、Surge AI，也承受 Handshake AI 等人才市场、专业招聘网络和实验室自建团队的压力 [CP001, CP006,
              CP007]。其差异化在于自动 AI 面试与匹配市场，快速撮合专家工时；Surge AI 更偏精品数据集交付，Scale AI 则提供打包的企业数据平台 [CP001, CP002, CP008]。
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP004
              - CP005
      - number: '3.2'
        title: 竞争对手画像与战略定位
        blocks:
          - type: paragraph
            body: >-
              Scale AI 曾是自动驾驶和早期 LLM 的主导训练数据供应商，但前沿实验室后训练量流失后，转向国防、受监管企业工作负载和机器人 [CP001]。Surge AI 是前沿实验室的主要质量基准，拥有约
              50,000 名高度筛选的专家，专注任务级质控、评分标准和 Tuesday Work Index 等复杂推理基准 [CP001]。Handshake AI 和 micro1
              是低成本或校园导向的挑战者，能以有竞争力的价格获取量化和工程人才 [CP001, CP005]。Refery 等传统招聘网络则体现员工搜索与 Mercor 专家招聘、AI 评估及企业 AI 交付之间的边界
              [CP007]。面对买方变化，Mercor 大幅增加旧金山工程团队，107 个职位中 63 个属于工程，显示其正积极投入自研软件评估和智能体强化学习环境 [CP003, CP006]。
            claimRefs:
              - CP001
              - CP003
              - CP005
              - CP006
              - CP007
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP004
              - CP005
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP007
      - number: '3.3'
        title: 商业模式、定价动态与切换成本
        blocks:
          - type: paragraph
            body: >-
              人类数据市场的商业条款对应不同价值单位：Mercor 按专家工时收费，平台抽成约 30% 至 35%；Surge AI 按任务或项目收取完成数据集费用；Scale AI 则把企业平台授权费与浮动劳动力加价打包
              [CP001, CP002, CP005]。Mercor 专家报价从 2026 年 6 月每小时 $141 降至 8 月 $109，平台每日付款超过 $4M，网络已创建岗位超过 500k [CP001,
              CP009, CP010]。Mercor 能快速灵活地组建领域专家小组，但前沿实验室切换成本仍低：它们会同时使用多个供应商来比较质量、避免单一供应商依赖并套利工价；项目机密性高时，也会直接维系专家池或自建评估团队
              [CP001, CP005]。
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP009
              - CP010
          - type: table
            tableRef: TP003
            claimRefs:
              - CP001
              - CP002
              - CP007
      - number: '3.4'
        title: 护城河持久性与不利风险
        blocks:
          - type: paragraph
            body: >-
              Mercor 的长期防御力面临两重结构性脆弱性：一侧是信任和平台安全，另一侧是客户绕过平台或服务商品化 [CP001, CP005]。2026 年 3 月 27 日，LiteLLM 开源发布管线遭恶意入侵，约 4
              TB Mercor 数据被外泄，包括承包商候选人资料、个人数据、源代码和 API 密钥 [CP001]。事件导致 Meta 立即暂停工作、承包商提起联邦诉讼，并促使企业重新审查数据隔离和第三方软件供应链治理
              [CP001]。Mercor 聘请 Mandiant 和 Latacora 收紧网络控制、轮换凭证，但事件说明市场平台承担系统性的企业数据责任
              [CP001]。软件化强化学习环境和合成数据的兴起，也持续威胁人工评估劳动力的商品化，迫使 Mercor 投资智能体测试基准和软件基础设施，以守住估值倍数 [CP001, CP005]。
            claimRefs:
              - CP001
              - CP005
      - number: '3.5'
        title: 证据图表
        blocks:
          - type: callout
            title: 前沿实验室多供应商采购与抽成率压缩
            body: >-
              前沿 AI 实验室不会为后训练人类数据授予独家供应商地位。实验室会同时比较 Surge AI、Scale AI、Handshake AI 和 Mercor，并保留内部数据整理团队；随着任务规格标准化，Mercor
