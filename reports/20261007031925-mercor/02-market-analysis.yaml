callouts:
  - calloutType: "insight"
    title: "Gross Run-Rate Versus Net Platform Margin Realities"
    body: "Mercor's swift progression to a $2.0 billion annualized revenue run-rate represents one of the fastest commercial accelerations in software history, but investors must separate gross billing volume from software-like net revenue. The underlying business operates largely as a pass-through talent network paying out over $1.5 million to $4.0 million daily to tens of thousands of professional contractors. At an indicative 30 percent marketplace take-rate, net revenue approximates $600 million, which significantly alters valuation multiple interpretations at a $10 billion to $20 billion capital valuation."
    claimRefs:
      - "CM005"
      - "CM006"
      - "CM007"
      - "CM008"
  - calloutType: "risk"
    title: "Fragility of Frontier Lab Supply-Chain Trust"
    body: "The March 2026 LiteLLM supply-chain breach demonstrated the acute vulnerability of Mercor's business model to enterprise trust shocks. With 4 terabytes of data exfiltrated—including contractor personal information and confidential model evaluation workflows—Meta's indefinite suspension of Mercor contracts exemplifies the existential risk of client concentration in a market dominated by a handful of frontier model research labs."
    claimRefs:
      - "CM012"
      - "CM013"
      - "CM014"
