callouts:
  - calloutType: "insight"
    title: "Gross volume is not ARR"
    body: >-
      The $2 billion figure is described as annualized gross revenue before contractor
      disbursements. A third-party estimate that contractors receive 60% to 70% of billings
      illustrates why valuation work needs an audited gross-to-net bridge rather than a SaaS-style
      ARR multiple.
    claimRefs:
      - "CO010"
      - "CO016"
  - calloutType: "risk"
    title: "Governance remains a diligence gap"
    body: >-
      Public evidence identifies three founders and one experienced president, but does not resolve
      board composition, founder voting control, delegated authority, or succession. Those documents
      are required before treating management depth as institutionalized.
    claimRefs:
      - "CO003"
      - "CO004"
