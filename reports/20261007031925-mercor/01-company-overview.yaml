company:
  name: "Mercor"
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    Mercor is a San Francisco-based expert-work marketplace that says it connects AI labs and
    enterprises with global specialists, while also expanding into evaluations and enterprise AI
    workflows. Its latest confirmed priced valuation in the reviewed evidence is $10 billion from
    the October 2025 Series C; 2026 reporting of a possible $20 billion financing remained unclosed,
    and the public scale metrics are predominantly company claims or gross-volume estimates.
sections:
  - id: "identity-model-and-leadership"
    title: "Identity, Operating Model, and Leadership"
    body: >-
      Mercor identifies its legal entity as Mercor.io Corporation and lists San Francisco as its
      location [CO001]. The company describes a two-sided marketplace in which AI labs and
      enterprises buy access to global expert contractors, complemented by human-data, evaluation,
      benchmark, and enterprise-AI offerings [CO002]. Independent profiles date the company's
      founding to January 2023 and name Brendan Foody, Adarsh Hiremath, and Surya Midha as its three
      co-founders [CO003]. They also report that former Uber Chief Product Officer Sundeep Jain
      joined as Mercor's first president in May 2025 [CO004]. The evidence therefore supports a
      founder-led company with one named experienced operating executive, but it does not establish
      current functional remits for each founder, a complete leadership roster, board composition,
      voting control, or succession arrangements. Those omissions matter because rapid scale and
      concentrated founder knowledge can create execution and governance dependencies that cannot
      be resolved from public profiles alone.
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
    tableRefs:
      - "TO001"
      - "TO002"
  - id: "capital-and-milestones"
    title: "Capital Formation and Corporate Milestones"
    body: >-
      Public profiles describe a steep financing progression: a $30 million Series A at a
      $250 million post-money valuation in September 2024 [CO005], a $100 million Series B at
      $2 billion in February 2025 [CO006], and a $350 million Series C at $10 billion in October
      2025 [CO007]. A later independent review reported that talks for a $500 million raise at a
      $20 billion valuation had not produced a confirmed closing by October 1, 2026 [CO008].
      Consequently, $10 billion is the latest priced valuation supported by the assigned evidence;
      the $20 billion figure is a reported negotiation, not an updated valuation fact or cash
      available to the company. The financing history demonstrates investor willingness to fund
      Mercor's growth, but the evidence does not disclose secondary-sale mechanics, debt or credit
      facilities, liquidation preferences, ownership percentages, voting rights, or the current
      board. The stakeholder map therefore records economic relevance without implying control
      terms that have not been published.
    claimRefs:
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO008"
    tableRefs:
      - "TO003"
    figureRefs:
      - "FO001"
  - id: "scale-quality-and-control-gaps"
    title: "Scale Signals, Revenue Quality, and Control Gaps"
    body: >-
      Mercor said in May 2026 that it had crossed $1 billion in annualized revenue run rate, while
      Sacra separately estimated $2 billion of annualized gross revenue in June 2026 [CO009]
      [CO010]. These are not ARR figures and should not be read as net revenue retained by Mercor.
      Company pages also show a changing payout scale: more than $2 million per day to over 30,000
      weekly active contractors in May, versus a current homepage claim of more than $4 million in
      daily payouts and 30,000-plus experts [CO011]. The homepage separately claims 507,000 roles
      created [CO012], and a company job page advertised a remote UK commercial-operations expert
      contract at $150 per hour [CO013]. Mercor's privacy notice expressly excludes the
      work.mercor.com service from its website-notice scope [CO014]. Its own payments retrospective
      acknowledges that manual reconciliation and off-platform data had outgrown early controls
      [CO015]. Third-party estimates that contractors receive 60% to 70% of gross billings imply a
      materially smaller retained take, but no audited gross-to-net bridge is public [CO016].
    claimRefs:
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO013"
      - "CO014"
      - "CO015"
      - "CO016"
