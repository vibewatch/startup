  title: "Risks"
  summary: "Mercor faces compounding post-breach legal, operational, and customer concentration liabilities following the March 2026 LiteLLM supply-chain compromise, which exposed contractor PII and biometrics, prompted multiple federal class actions and customer scrutiny, and revealed extreme reliance on frontier AI labs."
sections:
  - id: "severity-ranked-risk-taxonomy"
    title: "Severity-Ranked Risk Taxonomy and Valuation Implications"
    body: "Mercor's risk posture underwent a structural deterioration in March 2026 when a software supply-chain backdoor in the open-source LiteLLM dependency enabled unauthorized threat actors to access internal systems. This incident exposed sensitive contractor PII, tax identifiers, and video interview biometrics across its expert marketplace. For a high-velocity talent and human-data marketplace whose private valuation reached $10B on the premise of being the trusted data and human intelligence layer for frontier AI models, security and compliance are existential prerequisites. Customer confidence, enterprise procurement standards, and regulatory exposure under emerging artificial intelligence and data privacy frameworks represent material hurdles. The resulting fallout spans multi-jurisdictional class-action litigation, enterprise procurement freeze risk, and extreme customer concentration among a handful of frontier model labs whose workflow shifts could break the core investment thesis."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR007"
      - "CR008"
    tableRefs:
      - "TR001"
    figureRefs:
      - "FR001"
  - id: "regulatory-and-legal-exposures"
    title: "Regulatory, Legal, and Compliance Exposures"
    body: "The legal fallout from the security incident materialized immediately across federal courts. Between April 1 and April 7, 2026, five distinct class-action lawsuits landed in federal district courts across California and Texas against Mercor.io Corporation, including Deboni v. Mercor.io Corporation, Gill v. Mercor.io Corporation, and Esson v. Mercor.io Corporation in the Northern District of California, alongside White and Beltran v. Mercor.io Corp. in the Northern District of Texas. The complaints allege negligence, inadequate encryption, absence of robust multi-factor authentication, and widespread failure to protect contractor PII, W-9 tax forms, and biometric interview assets. Plaintiffs also allege secondary exposure through contractor monitoring software, while law firms such as Dapeer Law initiated broader formal investigations following Mercor's notification letters and report to the California Attorney General offering 24 months of TransUnion credit monitoring."
    claimRefs:
      - "CR004"
      - "CR005"
      - "CR006"
      - "CR009"
    tableRefs:
      - "TR002"
  - id: "operational-security-and-counterparty-dependencies"
    title: "Operational Security and Counterparty Dependency Vulnerabilities"
    body: "Beyond immediate courtroom defense, Mercor's operational architecture exposes systemic vulnerabilities inherent to modern AI supply chains. Attackers compromised PyPI publishing credentials for open-source LiteLLM versions 1.82.7 and 1.82.8, injecting backdoors that harvested cloud credentials and API keys within build pipelines, which threat actors subsequently leveraged against Mercor's data stores. While Mercor announced comprehensive remediation—including auditing dependencies, rotating access credentials, deploying restrictive cloud security policies, engaging Mandiant and Latacora, and implementing 24/7 managed detection—the operational blowback highlighted heavy counterparty dependency. Frontier labs like Meta paused ongoing projects pending security reviews, illustrating how customer concentration among foundational model creators amplifies counterparty risk."
    claimRefs:
      - "CR010"
      - "CR011"
      - "CR012"
      - "CR013"
      - "CR014"
      - "CR015"
    tableRefs:
      - "TR003"
