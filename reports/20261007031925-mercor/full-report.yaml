              - CU007
              - CU010
              - CU012
              - CU014
      - number: '6.2'
        title: Scale indicators are large but use different denominators
        blocks:
          - type: paragraph
            body: >-
              The strongest current adoption signals are company-reported operating measures rather than audited
              customer metrics. Mercor's newsroom states that more than $4 million is paid to its expert network each
              day and that the broader network contains more than five million domain experts. Its homepage separately
              shows an average contracted rate of $108 per hour, 507,000 roles created, and 30,000-plus experts for
              human-data and evaluation work. These measures indicate substantial marketplace throughput, but none
              provides active buyer count, active expert count, completed-role count, gross billings, take rate, or
              repeat usage. Serval's supplier-authored case study adds operational evidence: it says Mercor automated
              onboarding for more than 4,000 contractors, supporting scale but not buyer retention.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU011
              - CU016
          - type: table
            tableRef: TU002
            claimRefs:
