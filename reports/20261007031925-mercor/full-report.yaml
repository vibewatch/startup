              - CU004
              - CU005
              - CU016
      - number: '6.3'
        title: Enterprise proof is quantified but anonymized
        blocks:
          - type: paragraph
            body: >-
              UsagePricing's record of Mercor's enterprise page describes six case studies, up from three, and reports
              quantified outputs across diagnostics, value-creation assessments, production-readiness evaluation, and an
              SRE deployment. The examples show that buyers have used Mercor for real analytical and evaluation work: 25
              candidate workflows across seven functions, 132 expert-graded HR-agent runs, and identified value or
              mitigation improvements. However, the retained text does not name the external clients, disclose contract
              values, or establish which engagements became recurring production deployments. The evidence therefore
              supports engagement breadth and concrete project outputs, not a claim of durable software adoption or
              realized customer economics.
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU015
          - type: table
            tableRef: TU003
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU015
      - number: '6.4'
        title: Retention, concentration, and marketplace durability are open
        blocks:
          - type: paragraph
            body: >-
              The retained evidence does not establish NRR, GRR, churn, renewal rates, contract length, repeat-project
              frequency, or top-customer revenue concentration. Built In's explicitly AI-generated and unreviewed
              summary nevertheless flags reliance on a small set of frontier labs and large technology buyers, so it is
              a low-confidence risk signal rather than independent verification of concentration. On the supply side,
              Breaking Even reports a 138-post spike dominated by empty-queue complaints, indicating that recruiting
              reach does not guarantee steady utilization for experts. Mercor's website privacy notice also excludes the
              work.mercor.com service and points readers to a separate Expert Privacy Notice, leaving service-specific
              controls outside the reviewed source set. Customer-level cohort data and direct buyer references are
              required to resolve durability.
            claimRefs:
              - CU009
              - CU010
              - CU013
              - CU014
              - CU015
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Scale does not establish customer durability
            body: >-
              Large network, payout, and role-creation figures coexist with low-confidence concentration signals and
              independent reports of empty expert queues. The investment case requires buyer-level retention and
              concentration data rather than treating marketplace throughput as recurring demand.
            calloutType: risk
            claimRefs:
              - CU002
              - CU004
              - CU009
              - CU010
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-Ranked Risk Taxonomy and Valuation Implications
        blocks:
          - type: paragraph
            body: >-
              Mercor's risk posture underwent a structural deterioration in March 2026 when a software supply-chain
              backdoor in the open-source LiteLLM dependency enabled unauthorized threat actors to access internal
              systems. This incident exposed sensitive contractor PII, tax identifiers, and video interview biometrics
              across its expert marketplace. For a high-velocity talent and human-data marketplace whose private
              valuation reached $10B on the premise of being the trusted data and human intelligence layer for frontier
              AI models, security and compliance are existential prerequisites. Customer confidence, enterprise
              procurement standards, and regulatory exposure under emerging artificial intelligence and data privacy
              frameworks represent material hurdles. The resulting fallout spans multi-jurisdictional class-action
              litigation, enterprise procurement freeze risk, and extreme customer concentration among a handful of
              frontier model labs whose workflow shifts could break the core investment thesis.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR007
              - CR008
          - type: table
            tableRef: TR001
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR009
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR007
              - CR008
              - CR010
              - CR014
      - number: '7.2'
        title: Regulatory, Legal, and Compliance Exposures
        blocks:
          - type: paragraph
            body: >-
              The legal fallout from the security incident materialized immediately across federal courts. Between April
              1 and April 7, 2026, five distinct class-action lawsuits landed in federal district courts across
              California and Texas against Mercor.io Corporation, including Deboni v. Mercor.io Corporation, Gill v.
              Mercor.io Corporation, and Esson v. Mercor.io Corporation in the Northern District of California,
              alongside White and Beltran v. Mercor.io Corp. in the Northern District of Texas. The complaints allege
              negligence, inadequate encryption, absence of robust multi-factor authentication, and widespread failure
              to protect contractor PII, W-9 tax forms, and biometric interview assets. Plaintiffs also allege secondary
              exposure through contractor monitoring software, while law firms such as Dapeer Law initiated broader
              formal investigations following Mercor's notification letters and report to the California Attorney
              General offering 24 months of TransUnion credit monitoring.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR009
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR010
              - CR011
              - CR012
              - CR013
      - number: '7.3'
        title: Operational Security and Counterparty Dependency Vulnerabilities
        blocks:
          - type: paragraph
            body: >-
              Beyond immediate courtroom defense, Mercor's operational architecture exposes systemic vulnerabilities
              inherent to modern AI supply chains. Attackers compromised PyPI publishing credentials for open-source
              LiteLLM versions 1.82.7 and 1.82.8, injecting backdoors that harvested cloud credentials and API keys
              within build pipelines, which threat actors subsequently leveraged against Mercor's data stores. While
              Mercor announced comprehensive remediation—including auditing dependencies, rotating access credentials,
              deploying restrictive cloud security policies, engaging Mandiant and Latacora, and implementing 24/7
              managed detection—the operational blowback highlighted heavy counterparty dependency. Frontier labs like
              Meta paused ongoing projects pending security reviews, illustrating how customer concentration among
              foundational model creators amplifies counterparty risk.
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR003
              - CR007
              - CR008
              - CR014
              - CR015
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Supply-Chain Blast Radius in AI Data Operations
            body: >-
              The LiteLLM security incident demonstrates that AI data platforms operate with an expansive threat
              surface: compromising an upstream utility package can expose proprietary client workflows, contractor
              biometrics, and internal system credentials, undermining enterprise trust.
            calloutType: risk
            claimRefs:
              - CR001
              - CR010
              - CR012
              - CR013
          - type: callout
            title: Customer Concentration Amplifies Incident Shock
            body: >-
              Because frontier model developers represent a disproportionate share of high-margin human data and
              evaluation spend, even a temporary investigation pause by a single marquee client creates immediate
              operational and financial headwinds.
            calloutType: insight
            claimRefs:
              - CR003
              - CR008
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment judgment
        blocks:
          - type: paragraph
            body: >-
              The evidence supports TRACK / RESEARCH MORE, not a price-insensitive buy. Mercor has an unusually strong
              scale signal: management said annualized revenue run rate exceeded $2 billion, and reporting described an
              early financing discussion at twice the last confirmed valuation. Yet the headline ratio is not an
              investable multiple. Public reporting says gross revenue includes compensation passed through to experts,
              while public evidence does not provide the gross-to-net bridge, gross margin, customer concentration,
              preference stack, or a closed 2026 financing. At a reported $20 billion mark, that missing information is
              central rather than incremental. The decision should remain conditional on verified economic quality and
              enforceable financing terms.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV014
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV012
              - CV013
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV007
              - CV013
              - CV016
      - number: '8.2'
        title: Thesis, anti-thesis, and financing context
        blocks:
          - type: paragraph
            body: >-
              The thesis is that Mercor is extending a large expert network into evaluations, benchmarks, and enterprise
              agent workflows, which could make the platform more valuable than a labor marketplace alone. The
              anti-thesis is that reported revenue quality may be materially weaker than the headline: contractor
              payouts are embedded in gross revenue, the public work marketplace displays project-based compensation,
              and third-party funding totals disagree. Tracxn reports $492 million raised, RevenueMemo reports $483.6
              million, and Exa's directory still reports $136 million through only three rounds. These discrepancies do
              not change the confirmed $350 million Series C, but they show why primary financing documents and a fully
              diluted cap table are required before underwriting entry price or dilution.
            claimRefs:
              - CV002
              - CV004
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV007
              - CV012
              - CV013
      - number: '8.3'
        title: Scenarios and return logic
        blocks:
          - type: paragraph
            body: >-
              The scenario bands below are decision anchors bounded by the last confirmed $10 billion mark and the
              reported $20 billion discussion; they are not estimates of fair value. A bull case requires the reported
              financing to close and management's run-rate claim to translate into durable net revenue, margin,
              retention, and customer diversification. The base case treats the public marks as a reference interval
              while withholding a target return. The bear case is a repricing below the last round if gross-to-net
              economics disappoint or legal and customer fallout persists. No public evidence supports a defensible
              holding period, exit proceeds, or return distribution because fully diluted ownership and preference terms
              are not available.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV012
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: Exit readiness and final diligence
        blocks:
          - type: paragraph
            body: >-
              Exit readiness is not established by the available evidence. RevenueMemo reports that Mercor remains
              private and has not filed for an IPO, while the reported 2026 round was still unannounced. A security
              incident followed by at least seven reported class actions and a reported Meta pause raises the required
              proof threshold for customer retention, cyber controls, insurance, and contingent liabilities. Before a
              valuation recommendation can move to invest, diligence should obtain audited gross and net revenue, gross
              margin, cohort retention, top-customer concentration, current cash and debt, the fully diluted cap table,
              preference and secondary terms, lawsuit status, cyber-remediation evidence, and a board-approved exit or
              liquidity plan. Failure to reconcile those items is a thesis-break condition at a premium valuation.
            claimRefs:
              - CV001
              - CV012
              - CV013
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price-sensitive recommendation
            body: >-
              Do not convert company quality into a buy recommendation without a gross-to-net revenue bridge, fully
              diluted ownership, preference terms, customer concentration, and a supportable exit path.
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV013
              - CV016
