      The thesis uses company claims only as claims; the anti-thesis preserves third-party attribution and does not
      treat filed allegations as adjudicated facts.
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV007
      - CV012
      - CV013
  - id: TV003
    title: Bull, base, and bear scenario framework
    columns:
      - Case
      - Assumptions
      - Valuation / return logic
      - Probability signal
      - Key risks or downside trigger
    rows:
      - - Bull
        - >-
          Reported financing closes; >$2B run rate converts into durable net revenue, margin, retention, and diversified
          demand.
        - $20B+ is supportable only after verified economics make an exit multiple and target return calculable.
        - 'Low-to-medium: a reported term sheet and product breadth are positive, but audited economics are absent.'
        - Failure to validate net revenue or customer diversification ends the bull case.
      - - Base
        - Scale persists, but financing terms and revenue quality remain private.
        - >-
          $10B-$20B is a reference band between the last confirmed mark and reported discussion, not a fair-value
          estimate.
        - 'Medium: both endpoints have public reporting, but only the lower endpoint is a completed financing.'
        - Remain on track status until financing and unit-economics diligence closes.
      - - Bear
        - >-
          Gross-to-net conversion disappoints, a major customer remains paused, or breach litigation creates material
          cost or churn.
        - Below $10B denotes a down-round zone; the evidence does not support a precise floor.
        - >-
          Material downside signal: reported lawsuits and customer disruption are current, while ultimate liability is
          unresolved.
        - Customer loss, adverse legal outcomes, control failures, or a financing below the Series C mark.
    notes: >-
      Scenario bands are decision thresholds anchored to reported private-market marks, not independent fair-value
      estimates; no probability percentages, exit values, or target returns are inferred from missing private data.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV012
      - CV013
      - CV014
      - CV015
