      - number: '5.2'
        title: Architecture and operating model
        blocks:
          - type: paragraph
            body: >-
              The most concrete architecture evidence comes from MongoDB's supplier case study. It describes a unified
              candidate collection on MongoDB Atlas, semantic retrieval through Vector Search and Voyage AI embeddings,
              Lucene-backed full-text retrieval, hard filters, and Mercor ranking logic. It also describes Kafka-based
              change-data capture that updates candidate embeddings when profiles or interviews change. Reported results
              include a reduction in profile latency from roughly thirteen seconds to milliseconds, a move from six-hour
              search-index delays to near-immediate availability, and database growth from 100 GB to more than 2 TB by
              May 2026. These are supplier-reported operating outcomes, not independently reproduced benchmarks, so they
              support architecture maturity more strongly than they support service-level reliability.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
          - type: table
            tableRef: TE003
            claimRefs:
              - CE003
              - CE005
              - CE006
              - CE009
              - CE010
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE004
              - CE005
              - CE006
              - CE009
              - CE016
      - number: '5.3'
        title: Differentiation, maturity, and roadmap
        blocks:
          - type: paragraph
            body: >-
              Mercor's differentiation appears to combine a large expert network, automated screening, workflow-specific
              data capture, hybrid retrieval, and proprietary evaluation products. A current engineering role describes
              intended code-task retrieval using dense embeddings, BM25, ranking, reranking, model routing, and quality
              guardrails; because this is a hiring specification, it should be treated as roadmap and capability intent
              rather than proof that every component is in production. Independent commentary supports the strategic
              logic of expert-led post-training but also identifies a durability risk: synthetic data, software-built
              reinforcement-learning environments, and customer cost pressure could reduce the value of
              human-intermediation workflows. The only public developer artifact in the assigned evidence is an
              unaffiliated assessment simulator, which is useful as ecosystem signal but does not establish Mercor code
              quality, release cadence, or API adoption.
            claimRefs:
              - CE009
              - CE011
              - CE012
              - CE014
      - number: '5.4'
        title: Trust, security, privacy, and quality controls
        blocks:
          - type: paragraph
            body: >-
              Mercor markets automated anonymization across more than sixty categories of sensitive identifiers and says
              customers retain control over shared data. Its website privacy notice also discloses extensive website
              telemetry, including session replay, while explicitly excluding the separate work.mercor.com service from
              that notice. The assigned sources therefore do not provide a unified description of contractor-data
              handling, model-training data boundaries, audit logs, retention, incident response, or independent
              certifications. This gap matters because an independent tertiary source summarizes reports of a March 2026
              supply-chain incident and related customer pauses; that source is not sufficient to quantify scope or
              remediation, but it raises the diligence threshold. Investment-grade validation requires the
              platform-specific privacy notice, control reports, penetration-test summary, incident postmortem, and
              benchmark quality-governance documentation.
            claimRefs:
              - CE003
              - CE010
              - CE013
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Concrete scaling evidence
            body: >-
              The supplier case study provides unusually specific architecture and before-and-after operating metrics,
              although the results remain supplier-reported.
            calloutType: strength
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: callout
            title: Controls are less evidenced than product breadth
            body: >-
              Public materials describe anonymization and website privacy practices, but do not close platform-security,
              incident-remediation, or benchmark-governance diligence.
            calloutType: risk
            claimRefs:
              - CE003
              - CE010
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: A two-sided customer and expert network
        blocks:
          - type: paragraph
            body: >-
              Mercor's public surfaces distinguish the paying demand side from the expert supply side. The company says
              it connects expertise to frontier AI labs and brings the same network to Fortune 2000 companies deploying
              AI, while its current marketplace lists project-based work across generalist, sales, quality,
              data-science, and specialist roles. The reported five-million-person domain-expert network is broader than
              the 30,000-plus experts described for human data and evaluations; these are different populations and
              should not be combined into one active-user count. Enterprise buyers are routed into human-data,
              evaluation, workflow-diagnostic, deployment, and data-monetization offerings, but public buyer pricing is
              not disclosed.
            claimRefs:
              - CU001
              - CU003
              - CU005
              - CU006
              - CU008
              - CU012
              - CU016
          - type: table
            tableRef: TU001
            claimRefs:
