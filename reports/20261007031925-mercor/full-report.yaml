  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Operating Model, and Leadership
        blocks:
          - type: paragraph
            body: >-
              Mercor identifies its legal entity as Mercor.io Corporation and lists San Francisco as its location
              [CO001]. The company describes a two-sided marketplace in which AI labs and enterprises buy access to
              global expert contractors, complemented by human-data, evaluation, benchmark, and enterprise-AI offerings
              [CO002]. Independent profiles date the company's founding to January 2023 and name Brendan Foody, Adarsh
              Hiremath, and Surya Midha as its three co-founders [CO003]. They also report that former Uber Chief
              Product Officer Sundeep Jain joined as Mercor's first president in May 2025 [CO004]. The evidence
              therefore supports a founder-led company with one named experienced operating executive, but it does not
              establish current functional remits for each founder, a complete leadership roster, board composition,
              voting control, or succession arrangements. Those omissions matter because rapid scale and concentrated
              founder knowledge can create execution and governance dependencies that cannot be resolved from public
              profiles alone.
