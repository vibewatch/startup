      - number: '1.2'
        title: Capital Formation and Corporate Milestones
        blocks:
          - type: paragraph
            body: >-
              Public profiles describe a steep financing progression: a $30 million Series A at a $250 million
              post-money valuation in September 2024 [CO005], a $100 million Series B at $2 billion in February 2025
              [CO006], and a $350 million Series C at $10 billion in October 2025 [CO007]. A later independent review
              reported that talks for a $500 million raise at a $20 billion valuation had not produced a confirmed
              closing by October 1, 2026 [CO008]. Consequently, $10 billion is the latest priced valuation supported by
              the assigned evidence; the $20 billion figure is a reported negotiation, not an updated valuation fact or
              cash available to the company. The financing history demonstrates investor willingness to fund Mercor's
              growth, but the evidence does not disclose secondary-sale mechanics, debt or credit facilities,
              liquidation preferences, ownership percentages, voting rights, or the current board. The stakeholder map
              therefore records economic relevance without implying control terms that have not been published.
            claimRefs:
