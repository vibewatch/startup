      - number: '1.3'
        title: Scale Signals, Revenue Quality, and Control Gaps
        blocks:
          - type: paragraph
            body: >-
              Mercor said in May 2026 that it had crossed $1 billion in annualized revenue run rate, while Sacra
              separately estimated $2 billion of annualized gross revenue in June 2026 [CO009] [CO010]. These are not
              ARR figures and should not be read as net revenue retained by Mercor. Company pages also show a changing
              payout scale: more than $2 million per day to over 30,000 weekly active contractors in May, versus a
              current homepage claim of more than $4 million in daily payouts and 30,000-plus experts [CO011]. The
              homepage separately claims 507,000 roles created [CO012], and a company job page advertised a remote UK
              commercial-operations expert contract at $150 per hour [CO013]. Mercor's privacy notice expressly excludes
              the work.mercor.com service from its website-notice scope [CO014]. Its own payments retrospective
              acknowledges that manual reconciliation and off-platform data had outgrown early controls [CO015].
              Third-party estimates that contractors receive 60% to 70% of gross billings imply a materially smaller
              retained take, but no audited gross-to-net bridge is public [CO016].
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
              - CO015
              - CO016
      - number: '1.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Gross volume is not ARR
            body: >-
              The $2 billion figure is described as annualized gross revenue before contractor disbursements. A
              third-party estimate that contractors receive 60% to 70% of billings illustrates why valuation work needs
              an audited gross-to-net bridge rather than a SaaS-style ARR multiple.
            calloutType: insight
            claimRefs:
              - CO010
              - CO016
          - type: callout
            title: Governance remains a diligence gap
            body: >-
              Public evidence identifies three founders and one experienced president, but does not resolve board
              composition, founder voting control, delegated authority, or succession. Those documents are required
              before treating management depth as institutionalized.
