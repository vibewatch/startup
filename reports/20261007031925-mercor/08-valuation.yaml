        an independent benchmark or a defensible exit multiple.
      diligencePath: >-
        Build a banker-supported comparable set using audited net revenue,
        contribution margin, growth, concentration, and transaction terms.
      relatedQuestionRefs: [QV009]
    - type: private-evidence-only
      severity: material
      topic: breach-litigation
      missingEvidence: >-
        Current case docket, claimed damages, insurance coverage, remediation
        testing, customer-restoration status, and any legal reserve.
      whyItMatters: >-
        Public reporting establishes allegations and disruption but not ultimate
        liability, remediation effectiveness, or continuing revenue impact.
      diligencePath: >-
        Review counsel letters, cyber-insurance policies, forensic reports,
        control-test results, and customer renewal or reinstatement evidence.
      relatedQuestionRefs: [QV006]
