        retention, receivables quality, and top-customer concentration.
      whyItMatters: >-
        Pass-through expert compensation makes headline revenue an unreliable
        standalone denominator for valuation and return underwriting.
      diligencePath: >-
        Reconcile audited financial statements to customer invoices and expert
        payouts, then inspect product-level cohorts and customer concentration.
      relatedQuestionRefs: [QV003, QV007]
    - type: private-evidence-only
      severity: material
      topic: financing-terms
      missingEvidence: >-
        Fully diluted capitalization, liquidation preferences, participation,
        anti-dilution, secondary-sale terms, current cash, debt, and closing
        documents for any 2026 financing.
      whyItMatters: >-
        Headline post-money valuation does not establish the effective price,
