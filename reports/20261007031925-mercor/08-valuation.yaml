schemaVersion: "report-v2"
artifact: valuation
slug: mercor
runDate: 2026-10-07
company:
  name: Mercor
chapter:
  number: 8
  title: Valuation
  summary: >-
    Mercor's last confirmed financing valued it at $10 billion, while July 2026
    reporting described early talks at $20 billion against a company-reported
    annualized revenue run rate above $2 billion. The valuation case remains
    unready for price-specific underwriting because reported gross revenue
    includes expert pass-through, financing terms are undisclosed, and breach-
    related litigation and a reported customer pause add material downside.
sections:
  - id: investment-judgment
    title: Investment judgment
    body: >-
      The evidence supports TRACK / RESEARCH MORE, not a price-insensitive buy.
      Mercor has an unusually strong scale signal: management said annualized
      revenue run rate exceeded $2 billion, and reporting described an early
      financing discussion at twice the last confirmed valuation. Yet the
      headline ratio is not an investable multiple. Public reporting says gross
      revenue includes compensation passed through to experts, while public
      evidence does not provide the gross-to-net bridge, gross margin, customer
      concentration, preference stack, or a closed 2026 financing. At a reported
      $20 billion mark, that missing information is central rather than
      incremental. The decision should remain conditional on verified economic
      quality and enforceable financing terms.
    claimRefs: [CV001, CV002, CV003, CV004, CV014, CV016]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: thesis-and-financing-context
    title: Thesis, anti-thesis, and financing context
    body: >-
      The thesis is that Mercor is extending a large expert network into
      evaluations, benchmarks, and enterprise agent workflows, which could make
      the platform more valuable than a labor marketplace alone. The anti-thesis
      is that reported revenue quality may be materially weaker than the headline:
      contractor payouts are embedded in gross revenue, the public work
      marketplace displays project-based compensation, and third-party funding
      totals disagree. Tracxn reports $492 million raised, RevenueMemo reports
      $483.6 million, and Exa's directory still reports $136 million through only
      three rounds. These discrepancies do not change the confirmed $350 million
      Series C, but they show why primary financing documents and a fully diluted
      cap table are required before underwriting entry price or dilution.
    claimRefs: [CV002, CV004, CV006, CV007, CV008, CV009, CV010, CV011]
    tableRefs: [TV002]
  - id: scenarios-and-return-logic
    title: Scenarios and return logic
    body: >-
      The scenario bands below are decision anchors bounded by the last confirmed
      $10 billion mark and the reported $20 billion discussion; they are not
      estimates of fair value. A bull case requires the reported financing to
      close and management's run-rate claim to translate into durable net
      revenue, margin, retention, and customer diversification. The base case
      treats the public marks as a reference interval while withholding a target
      return. The bear case is a repricing below the last round if gross-to-net
      economics disappoint or legal and customer fallout persists. No public
      evidence supports a defensible holding period, exit proceeds, or return
      distribution because fully diluted ownership and preference terms are not
      available.
    claimRefs: [CV001, CV002, CV003, CV004, CV012, CV013, CV014, CV015, CV016]
    tableRefs: [TV003]
  - id: exit-readiness-and-diligence
    title: Exit readiness and final diligence
    body: >-
      Exit readiness is not established by the available evidence. RevenueMemo
      reports that Mercor remains private and has not filed for an IPO, while the
      reported 2026 round was still unannounced. A security incident followed by
      at least seven reported class actions and a reported Meta pause raises the
      required proof threshold for customer retention, cyber controls, insurance,
      and contingent liabilities. Before a valuation recommendation can move to
      invest, diligence should obtain audited gross and net revenue, gross margin,
      cohort retention, top-customer concentration, current cash and debt, the
      fully diluted cap table, preference and secondary terms, lawsuit status,
      cyber-remediation evidence, and a board-approved exit or liquidity plan.
      Failure to reconcile those items is a thesis-break condition at a premium
      valuation.
    claimRefs: [CV001, CV012, CV013, CV015, CV016]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Evidence-based view, Decision implication]
    rows:
      - [Recommendation, "TRACK / RESEARCH MORE", "Do not underwrite the reported $20B discussion without verified net economics and signed terms."]
      - [Confidence, "Medium-low", "Strong scale reporting is offset by an unclosed financing and private financial inputs."]
      - [Risk rating, "High", "Apply a material risk overlay for breach litigation, customer fallout, and revenue-quality uncertainty."]
      - [Valuation stance, "Stretched at the reported $20B discussion; $10B is the last confirmed mark", "Reconsider only with a lower risk-adjusted entry or evidence that supports durable net revenue and margin."]
      - [Return / hold / exit, "No defensible public-data target", "Require ownership, preferences, dilution, liquidity timing, and exit assumptions before calculating returns."]
    notes: >-
      Judgments use public evidence through 2026-10-07; the reported financing
      discussion is not treated as a completed round, and missing private inputs
      are not estimated.
    claimRefs: [CV001, CV002, CV003, CV004, CV012, CV013, CV015]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Side, Argument, What would change the view]
    rows:
      - [Thesis, "Management-reported annualized revenue run rate exceeded $2B.", "Validate recognized net revenue, collection, retention, and customer concentration."]
      - [Thesis, "Mercor markets human data, evaluations, benchmarks, and enterprise AI workflows.", "Show independent enterprise adoption, software mix, and contribution margin by offering."]
      - [Anti-thesis, "Reported gross revenue includes expert compensation passed through by Mercor.", "Provide an audited gross-to-net bridge and gross margin by product."]
      - [Anti-thesis, "A third-party breach was followed by reported litigation and a Meta work pause.", "Demonstrate resolved litigation exposure, restored customer activity, and independently tested controls."]
      - [Anti-thesis, "The 2026 $20B financing remained reported rather than announced.", "Provide executed financing documents, capitalization, preferences, and secondary-sale mechanics."]
    notes: >-
      The thesis uses company claims only as claims; the anti-thesis preserves
      third-party attribution and does not treat filed allegations as adjudicated
      facts.
    claimRefs: [CV001, CV003, CV004, CV007, CV012, CV013]
  - id: TV003
    title: Bull, base, and bear scenario framework
    columns: [Case, Assumptions, Valuation / return logic, Probability signal, Key risks or downside trigger]
    rows:
      - [Bull, "Reported financing closes; >$2B run rate converts into durable net revenue, margin, retention, and diversified demand.", "$20B+ is supportable only after verified economics make an exit multiple and target return calculable.", "Low-to-medium: a reported term sheet and product breadth are positive, but audited economics are absent.", "Failure to validate net revenue or customer diversification ends the bull case."]
      - [Base, "Scale persists, but financing terms and revenue quality remain private.", "$10B-$20B is a reference band between the last confirmed mark and reported discussion, not a fair-value estimate.", "Medium: both endpoints have public reporting, but only the lower endpoint is a completed financing.", "Remain on track status until financing and unit-economics diligence closes."]
      - [Bear, "Gross-to-net conversion disappoints, a major customer remains paused, or breach litigation creates material cost or churn.", "Below $10B denotes a down-round zone; the evidence does not support a precise floor.", "Material downside signal: reported lawsuits and customer disruption are current, while ultimate liability is unresolved.", "Customer loss, adverse legal outcomes, control failures, or a financing below the Series C mark."]
    notes: >-
      Scenario bands are decision thresholds anchored to reported private-market
      marks, not independent fair-value estimates; no probability percentages,
      exit values, or target returns are inferred from missing private data.
    claimRefs: [CV001, CV002, CV003, CV004, CV012, CV013, CV014, CV015]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Reported scale and product breadth pass through revenue-quality, price, and
      risk checks before reaching a conditional tracking recommendation.
    data:
      nodes:
        - id: scale-signal
          label: "Scale signal"
          detail: "Management-reported annualized revenue run rate above $2B"
        - id: product-signal
          label: "Product signal"
          detail: "Human data, evaluations, benchmarks, and enterprise workflows"
        - id: quality-check
          label: "Revenue-quality check"
          detail: "Reported gross revenue includes expert pass-through"
        - id: price-check
          label: "Price check"
          detail: "$10B confirmed mark versus reported $20B discussion"
        - id: risk-overlay
          label: "Risk overlay"
          detail: "Breach litigation and reported customer pause"
        - id: recommendation
          label: "TRACK / RESEARCH MORE"
          detail: "Require net economics, financing terms, and risk resolution"
    approximationNotes: >-
      This is a qualitative decision sequence; node order does not assign numeric
      weights or imply that the reported financing has closed.
    claimRefs: [CV001, CV004, CV006, CV007, CV013, CV016]
callouts:
  - calloutType: recommendation
    title: Price-sensitive recommendation
    body: >-
      Do not convert company quality into a buy recommendation without a
      gross-to-net revenue bridge, fully diluted ownership, preference terms,
      customer concentration, and a supportable exit path.
    claimRefs: [CV004, CV013, CV016]
