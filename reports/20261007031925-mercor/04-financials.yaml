      missingEvidence: Current cash, restricted cash, monthly burn, working capital, capex, acquisition obligations, and runway.
      whyItMatters: Funding raised is not cash available, so the next financing requirement cannot be estimated.
      diligencePath: Obtain bank statements, a 24-month cash plan, monthly cash-flow statements, and financing triggers.
      relatedQuestionRefs: [QI006]
      relatedTableRefs: [TI003]
    - type: conflicting-data
      severity: minor
      topic: funding
      missingEvidence: A company-confirmed, round-by-round capitalization schedule reconciling the $455 million and $483.6 million totals.
      whyItMatters: The discrepancy limits confidence in external funding trackers, though neither total establishes current liquidity.
      diligencePath: Reconcile the cap table, wire receipts, primary versus secondary proceeds, and transaction expenses.
      relatedQuestionRefs: [QI006]
    - type: missing-source
      severity: material
      topic: profitability
      missingEvidence: Audited income statements and cash-flow statements supporting historical and current profitability.
      whyItMatters: A reported accounting profit does not establish cash generation, sustainable margins, or current burn.
      diligencePath: Obtain audited annuals, monthly management accounts, and a bridge from operating income to free cash flow.
