      whyItMatters: The public gross-revenue figures cannot establish recognized revenue or gross margin.
      diligencePath: Reconcile monthly customer invoices to expert payouts and audited revenue-recognition schedules.
      relatedQuestionRefs: [QI010]
      relatedTableRefs: [TI001, TI003]
