      topic: software-mix
      missingEvidence: Revenue split among human data, benchmarks, data monetization, enterprise software, and implementation services.
      whyItMatters: Recurrence, services intensity, and valuation comparability depend on the product mix.
      diligencePath: Obtain product-level monthly revenue, bookings, gross profit, contract duration, and renewal cohorts.
      relatedQuestionRefs: [QI010]
      relatedTableRefs: [TI001]
    - type: private-evidence-only
