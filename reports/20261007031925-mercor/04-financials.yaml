      - ["Data science listing", "$100-$150", "per hour", "Expert compensation", "Realized blended rate or demand volume"]
      - ["Cricket evaluator listing", "$20", "per task", "Expert compensation", "Task duration or customer price"]
      - ["Football evaluator listing", "$105-$140", "per task", "Expert compensation", "Task duration, repeat volume, or margin"]
    notes: >-
      The marketplace was observed on 2026-10-07; displayed contractor rates are not client list
      prices, realized revenue, or evidence of completed and paid utilization.
    claimRefs: [CI006, CI007]
  - id: TI003
    title: Unit economics and capital-adequacy scoreboard
    columns:
      - Metric
      - Public value
      - Confidence
      - Underwriting interpretation
      - Diligence ask
    rows:
      - ["H1 2026 gross revenue", "~$614M", "Medium", "Large transaction volume; internal-document reporting, not audited", "Monthly gross-to-net bridge and revenue-recognition policy"]
      - ["June 2026 annualized gross revenue", ">$2B", "Medium", "Run-rate snapshot, not ARR or annual realized revenue", "Monthly cohort revenue and contract duration"]
      - ["OpenAI and Anthropic concentration", "~91% of H1 2026 gross revenue", "Medium", "Material buyer concentration", "Top-10 concentration, commitments, termination rights, and receivables"]
      - ["Contractor share of gross revenue", "60%-70%", "Medium", "Primary delivery cost consumes most quoted gross revenue", "Payouts, rebates, refunds, and pass-through accounting by product"]
      - ["Residual before company overhead", "30%-40% inferred", "Low", "Not gross margin; excludes unquantified operating costs", "Audited gross margin and contribution margin"]
      - ["Current cash balance", null, "Unavailable", "Funding raised cannot be treated as cash available", "Bank statements, treasury schedule, and restricted cash"]
      - ["Burn and runway", null, "Unavailable", "Capital adequacy cannot be determined", "Monthly cash flow, hiring plan, acquisition cash needs, and next-round trigger"]
    notes: >-
      Gross metrics and contractor share come from independent reporting; the 30%-40% residual is
      arithmetic only and is explicitly not a reported gross margin. Null means no usable public
      figure was present in the assigned evidence.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI009, CI010, CI011, CI012]
figures:
  - id: FI001
    title: Publicly supportable gross-to-net revenue bridge
    type: flow
    summary: >-
      Public evidence supports the direction of the cash-flow chain and the contractor share, but
      not customer pricing, company overhead, gross profit, or free cash flow.
    data:
      nodes:
        - id: customer-spend
          label: Customer project spend
          value: null
          unit: USD
          detail: Realized client pricing and discounts are not public.
        - id: gross-revenue
          label: Reported gross revenue
          value: 100
          unit: "% indexed"
          detail: Gross basis includes the expert payout component.
        - id: expert-payout
          label: Contractor compensation
          value: "60-70"
          unit: "% of gross revenue"
          detail: Third-party-reported range, not an audited cost-of-revenue disclosure.
        - id: residual
          label: Residual before company overhead
          value: "30-40"
          unit: "% of gross revenue"
          detail: Arithmetic complement only; not reported gross margin.
        - id: company-overhead
          label: Company operating costs
          value: null
          unit: USD
          detail: Payroll, recruiting, fraud, compliance, product, legal, and other costs are unquantified.
        - id: free-cash-flow
          label: Free cash flow
          value: null
          unit: USD
          detail: Cash conversion, working capital, capex, and current burn are not public.
    approximationNotes: >-
      The indexed bridge uses reported contractor-share bounds; it does not estimate company gross
      margin, operating profit, cash burn, or free cash flow.
    claimRefs: [CI001, CI002, CI004, CI005, CI013, CI016]
callouts:
  - calloutType: risk
    title: Gross revenue is not ARR
    body: >-
      Mercor's most visible growth metrics include expert compensation and are described as gross
      revenue or annualized gross revenue. They cannot be treated as recurring software revenue
      without contract, renewal, and product-mix evidence.
    claimRefs: [CI001, CI002, CI004, CI015]
  - calloutType: recommendation
    title: Make the gross-to-net bridge the first financial diligence request
    body: >-
      Require customer-level billings, expert payouts, refunds, credits, cost allocation, and
      product-level gross profit before underwriting revenue quality or the next financing need.
    claimRefs: [CI003, CI004, CI005, CI009, CI010]
