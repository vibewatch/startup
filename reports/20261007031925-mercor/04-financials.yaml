schemaVersion: "report-v2"
artifact: financials
slug: mercor
runDate: 2026-10-07
company:
  name: Mercor
chapter:
  number: 4
  title: Financials
  summary: >-
    Mercor's public traction is large but reported primarily as gross revenue that includes expert
    payouts: third-party coverage puts first-half 2026 gross revenue near $614 million and June
    annualized gross revenue above $2 billion. The investable financial picture remains incomplete
    because realized client pricing, gross margin, customer concentration detail, cash, burn,
    runway, and the recurring software mix are not publicly disclosed.
sections:
  - id: revenue-model
    title: Revenue model and revenue quality
    body: >-
      Mercor presents three commercial surfaces: human data and evaluations for AI developers,
      data monetization for enterprises, and enterprise AI deployment supported by forward-deployed
      engineers. Public evidence is strongest for the first surface. AI Weekly, summarizing internal
      documents reviewed by The Information, reported about $614 million of gross revenue in the
      first half of 2026 and a June annualized gross-revenue run rate above $2 billion. Those labels
      are not ARR and should not be valued as recurring software revenue. The same coverage reported
      that OpenAI and Anthropic represented roughly 91% of the first-half total, making revenue
      quality dependent on a concentrated set of frontier-lab budgets. Mercor discloses no
      product-level revenue mix, contract duration, renewal rate, or recognition policy.
    claimRefs: [CI001, CI002, CI003, CI008]
    tableRefs: [TI001]
  - id: pricing-and-gtm
    title: Pricing, contractor economics, and GTM
    body: >-
      Public pricing is visible on the supply side rather than the customer side. Mercor's website
      reports an average contracted expert rate of $108 per hour and more than $4 million in daily
      payouts, while the live opportunity marketplace displays hourly and task-based rates ranging
      from $20 per task to as much as $150 per hour in the sampled listings. These are contractor
      compensation points, not customer list prices or realized net revenue. The available evidence
      therefore supports a project-led, usage-linked service model, but it does not establish sales
      cycle, CAC, payback, discounting, channel economics, or enterprise contract minimums. Buyer
      concentration further weakens the usefulness of gross growth as a standalone sales-efficiency
      proxy.
    claimRefs: [CI003, CI006, CI007]
    tableRefs: [TI002]
  - id: unit-economics
    title: Gross-to-net bridge and cost structure
    body: >-
      The best public gross-to-net clue is AI Weekly's report that contractors keep roughly 60% to
      70% of quoted gross revenue. Arithmetically, that leaves approximately 30% to 40% before
      Mercor's own payroll, recruiting incentives, payment operations, fraud controls, insurance,
      legal costs, product development, and other overhead; it is not a disclosed gross margin.
      Mercor's privacy notice also describes data-security, compliance, marketing, and service-
      provider activities, but provides no expense amounts. Sector reporting that 45% of hiring
      assessments were flagged for integrity issues is not Mercor-specific, yet it illustrates why
      screening and fraud-control costs cannot be assumed immaterial. Audited gross margin,
      contribution margin, operating expenses, working capital, capex, and cash conversion remain
      unavailable.
    claimRefs: [CI004, CI005, CI013, CI016]
    tableRefs: [TI003]
    figureRefs: [FI001]
  - id: capital-adequacy
    title: Capital adequacy and underwriting verdict
    body: >-
      Funding trackers do not agree on cumulative capital: RevenueMemo reports $483.6 million across
      four announced equity rounds, while FundedIQ records $455 million across three rounds. The
      difference appears to reflect round coverage rather than cash available today, and neither
      figure establishes unrestricted cash. RevenueMemo reports no disclosed debt, cites a
      third-party report of $6 million in first-half 2025 profit, and says a roughly $500 million
      financing at a $20 billion valuation was discussed in 2026 but had not been announced. None of
      those items supplies a current balance sheet, cash-flow statement, burn rate, runway, or
      financing trigger. The financial verdict is therefore high growth with plausible positive
      unit spread, offset by weak metric comparability, concentrated demand, and insufficient
      evidence to underwrite margin durability or capital adequacy.
    claimRefs: [CI009, CI010, CI011, CI012, CI014, CI015]
