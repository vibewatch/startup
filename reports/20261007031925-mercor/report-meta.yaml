  topStrengths:
    - AI labor marketplace demand remains strong, with Mercor positioned in the high-value expert-feedback layer.
    - Automated vetting and search infrastructure support speed, scale, and product extensibility.
    - Revenue scale and contractor payouts are large enough to show real market traction.
  topRisks:
    - Gross-to-net economics, software mix, and margin quality remain opaque.
    - Customer concentration and multi-homing pressure bargaining power.
    - Security, privacy, and contractor-data exposure remain material reputational risks.
    - The valuation already assumes continued hypergrowth and better economics than public evidence proves.
  unresolvedGaps:
    - Gross-to-net revenue bridge, take rate, gross margin, and any recurring software revenue split are not public.
    - Top-10 customer concentration, paused-account detail after the breach, and product-level retention are not public.
    - Independent evidence of post-breach trust remediation and control improvements remains limited.
    - Contractor-jurisdiction mix, dispute rates, and any legal reserves for labor or privacy exposure are not public.
    - Cap-table terms, preference stack, and secondary pricing mechanics at the $10B mark are not public.
