chapter:
  number: 6
  title: "Customers"
  summary: "Mercor presents a two-sided network: frontier-model and enterprise buyers purchase expert data, evaluations, and deployment work, while professionals supply the underlying expertise. Public scale and engagement evidence is substantial, but named-customer identity, buyer retention, contract duration, pricing, and concentration remain unverified."
sections:
  - id: "customer-segments"
    title: "A two-sided customer and expert network"
    body: >-
      Mercor's public surfaces distinguish the paying demand side from the expert supply side. The company says it connects expertise to frontier AI labs and brings the same network to Fortune 2000 companies deploying AI, while its current marketplace lists project-based work across generalist, sales, quality, data-science, and specialist roles. The reported five-million-person domain-expert network is broader than the 30,000-plus experts described for human data and evaluations; these are different populations and should not be combined into one active-user count. Enterprise buyers are routed into human-data, evaluation, workflow-diagnostic, deployment, and data-monetization offerings, but public buyer pricing is not disclosed.
    claimRefs:
      - "CU001"
      - "CU003"
      - "CU005"
      - "CU006"
      - "CU008"
      - "CU012"
      - "CU016"
    tableRefs:
      - "TU001"
    figureRefs:
      - "FU001"
  - id: "adoption-trajectory"
    title: "Scale indicators are large but use different denominators"
    body: >-
      The strongest current adoption signals are company-reported operating measures rather than audited customer metrics. Mercor's newsroom states that more than $4 million is paid to its expert network each day and that the broader network contains more than five million domain experts. Its homepage separately shows an average contracted rate of $108 per hour, 507,000 roles created, and 30,000-plus experts for human-data and evaluation work. These measures indicate substantial marketplace throughput, but none provides active buyer count, active expert count, completed-role count, gross billings, take rate, or repeat usage. Serval's supplier-authored case study adds operational evidence: it says Mercor automated onboarding for more than 4,000 contractors, supporting scale but not buyer retention.
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU011"
      - "CU016"
    tableRefs:
      - "TU002"
  - id: "enterprise-proof"
    title: "Enterprise proof is quantified but anonymized"
    body: >-
      UsagePricing's record of Mercor's enterprise page describes six case studies, up from three, and reports quantified outputs across diagnostics, value-creation assessments, production-readiness evaluation, and an SRE deployment. The examples show that buyers have used Mercor for real analytical and evaluation work: 25 candidate workflows across seven functions, 132 expert-graded HR-agent runs, and identified value or mitigation improvements. However, the retained text does not name the external clients, disclose contract values, or establish which engagements became recurring production deployments. The evidence therefore supports engagement breadth and concrete project outputs, not a claim of durable software adoption or realized customer economics.
    claimRefs:
      - "CU006"
      - "CU007"
      - "CU008"
      - "CU015"
    tableRefs:
      - "TU003"
  - id: "durability-and-friction"
    title: "Retention, concentration, and marketplace durability are open"
    body: >-
      The retained evidence does not establish NRR, GRR, churn, renewal rates, contract length, repeat-project frequency, or top-customer revenue concentration. Built In's explicitly AI-generated and unreviewed summary nevertheless flags reliance on a small set of frontier labs and large technology buyers, so it is a low-confidence risk signal rather than independent verification of concentration. On the supply side, Breaking Even reports a 138-post spike dominated by empty-queue complaints, indicating that recruiting reach does not guarantee steady utilization for experts. Mercor's website privacy notice also excludes the work.mercor.com service and points readers to a separate Expert Privacy Notice, leaving service-specific controls outside the reviewed source set. Customer-level cohort data and direct buyer references are required to resolve durability.
    claimRefs:
      - "CU009"
      - "CU010"
      - "CU013"
      - "CU014"
      - "CU015"
