evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: leadership-and-founder-table
    missingEvidence: >-
      A complete current executive roster, individual founder remits, departures, succession coverage, and reporting
      lines.
    whyItMatters: Management depth and key-person dependence cannot be assessed from a four-person public sample.
    diligencePath: Obtain the current organization chart, executive employment agreements, delegation matrix, and succession plan.
    relatedQuestionRefs:
      - QO002
      - QO007
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: stakeholder-or-investor-map
    missingEvidence: >-
      Current cap table, board roster, voting agreements, preference stack, secondary-sale records, and debt or credit
      facilities.
    whyItMatters: Financing announcements do not establish ownership, governance control, dilution, or cash presently available.
    diligencePath: >-
      Review the fully diluted cap table, charter, investor rights agreements, board materials, debt schedule, and bank
      statements.
    relatedQuestionRefs:
      - QO003
      - QO007
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: cover-metrics
    missingEvidence: >-
      Audited gross-to-net revenue bridge, recurring software revenue, gross margin, unique customer count,
      concentration, and current full-time headcount.
    whyItMatters: >-
      Gross marketplace volume and contractor activity do not establish retained revenue quality, diversification, or
      operating leverage.
    diligencePath: >-
      Request audited financials, monthly cohort revenue, customer-level billings, contractor payouts, payroll roster,
      and revenue-recognition policy.
    relatedQuestionRefs:
      - QO004
      - QO005
  - type: private-evidence-only
    severity: material
    topic: gross-to-net-revenue-bridge
    missingEvidence: >-
      Audited breakdown of Mercor's gross contractor billing versus net platform fee revenue and realized gross margin
      percentages.
    whyItMatters: >-
      Gross billing exaggerates enterprise software scale and obscures the true operating margin and economic take-rate
      of the marketplace.
    diligencePath: >-
      Request management's audited GAAP financial statements including revenue recognition policies, gross profit, and
      contractor cost of sales.
    relatedQuestionRefs:
      - QM006
      - QM007
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: Percentage revenue contribution from top 5 customer accounts, specifically OpenAI, Anthropic, and Google DeepMind.
    whyItMatters: >-
      Concentration in a small cadre of AI model builders exposes Mercor to severe revenue volatility if training
      priorities shift.
    diligencePath: Review customer revenue concentration schedule and multi-year master service agreement renewal terms.
    relatedQuestionRefs:
      - QM003
      - QM005
      - QM008
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Audited revenue breakdown by customer and project retention rates across OpenAI, Anthropic, Google, and Meta
      post-March 2026 breach.
    whyItMatters: >-
      High customer concentration among 3 to 5 frontier labs leaves Mercor vulnerable to rapid revenue churn if labs
      vertically integrate evaluation operations or reallocate budgets.
    diligencePath: >-
      Review confidential customer audit schedules, master service agreements, and cohort volume retention disclosures
      under non-disclosure agreement.
    relatedQuestionRefs:
      - QP006
  - id: GP002
    type: missing-source
    severity: minor
    topic: contractor-misclassification
    missingEvidence: >-
      Comprehensive legal settlement terms or dispute reserves regarding contractor classification claims and pending
      breach lawsuits.
    whyItMatters: >-
      Independent contractor status disputes and wage litigation across AI data vendors could compress platform take
      rates or impose statutory employment liabilities.
    diligencePath: >-
      Inspect litigation dockets, arbitration filings, and contingent liability provisions in Mercor's financial
      records.
    relatedQuestionRefs:
      - QP007
  - type: private-evidence-only
    severity: material
    topic: gross-to-net
    missingEvidence: Customer-level gross billings, refunds, credits, expert payouts, and net revenue by product.
    whyItMatters: The public gross-revenue figures cannot establish recognized revenue or gross margin.
    diligencePath: Reconcile monthly customer invoices to expert payouts and audited revenue-recognition schedules.
    relatedQuestionRefs:
      - QI010
    relatedTableRefs:
      - TI001
      - TI003
  - type: private-evidence-only
    severity: material
    topic: software-mix
    missingEvidence: Revenue split among human data, benchmarks, data monetization, enterprise software, and implementation services.
    whyItMatters: Recurrence, services intensity, and valuation comparability depend on the product mix.
    diligencePath: Obtain product-level monthly revenue, bookings, gross profit, contract duration, and renewal cohorts.
    relatedQuestionRefs:
      - QI010
    relatedTableRefs:
      - TI001
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-10 customer revenue, contractual commitments, termination rights, receivables, and post-period changes.
    whyItMatters: Reported concentration among two frontier labs could make growth and working capital volatile.
    diligencePath: Review customer-level monthly cohorts, signed contracts, pipeline, and accounts-receivable aging.
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: Current cash, restricted cash, monthly burn, working capital, capex, acquisition obligations, and runway.
    whyItMatters: Funding raised is not cash available, so the next financing requirement cannot be estimated.
    diligencePath: Obtain bank statements, a 24-month cash plan, monthly cash-flow statements, and financing triggers.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: minor
    topic: funding
    missingEvidence: >-
      A company-confirmed, round-by-round capitalization schedule reconciling the $455 million and $483.6 million
      totals.
    whyItMatters: >-
      The discrepancy limits confidence in external funding trackers, though neither total establishes current
      liquidity.
    diligencePath: Reconcile the cap table, wire receipts, primary versus secondary proceeds, and transaction expenses.
    relatedQuestionRefs:
      - QI006
  - type: missing-source
    severity: material
    topic: profitability
    missingEvidence: Audited income statements and cash-flow statements supporting historical and current profitability.
    whyItMatters: A reported accounting profit does not establish cash generation, sustainable margins, or current burn.
    diligencePath: Obtain audited annuals, monthly management accounts, and a bridge from operating income to free cash flow.
  - type: private-evidence-only
    severity: material
    topic: reliability
    missingEvidence: Service-level history, uptime, recovery objectives, support response times, and independent load-test results.
    whyItMatters: Supplier-reported speed improvements do not establish production reliability or support quality.
    diligencePath: >-
      Request twelve months of status history, severity-one incident records, SLO attainment, and disaster-recovery test
      results.
    relatedQuestionRefs:
      - QE004
  - type: missing-source
    severity: material
    topic: security-controls
    missingEvidence: >-
      Platform-specific privacy terms, current SOC 2 or equivalent control report, penetration-test summary, and the
      March 2026 incident postmortem.
    whyItMatters: The public website notice excludes the work platform and cannot validate contractor or customer-data controls.
    diligencePath: >-
      Review the expert-platform privacy notice, subprocessors, data-flow map, audit report, and remediation evidence in
      a security data room.
    relatedQuestionRefs:
      - QE006
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      Mercor-owned repositories, API documentation, changelog, package usage, release history, or other attributable
      developer adoption evidence.
    whyItMatters: An unaffiliated prototype cannot demonstrate product engineering quality or ecosystem traction.
    diligencePath: >-
      Request a private repository and release review, API customer references, deployment cadence, defect metrics, and
      developer-usage telemetry.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: benchmark-governance
    missingEvidence: >-
      Independent review of APEX task construction, contamination controls, scorer calibration, versioning, and
      reproducibility.
    whyItMatters: Published scores are not enough to establish that the benchmark is durable, unbiased, or decision-grade.
    diligencePath: >-
      Obtain benchmark cards, task provenance, scorer agreement statistics, version history, and an external
      replication.
    relatedQuestionRefs:
      - QE002
      - QE005
  - type: private-evidence-only
    severity: material
    topic: retention-opacity
    missingEvidence: >-
      Buyer-level NRR, GRR, logo churn, renewal rate, contract duration, repeat-project frequency, and expansion
      cohorts.
    whyItMatters: Without cohort durability, marketplace throughput cannot be translated into recurring customer demand.
    diligencePath: >-
      Obtain monthly buyer cohorts, contract schedules, renewal histories, and revenue bridges from management and
      reconcile them to invoices.
    relatedQuestionRefs:
      - QU007
  - type: enumeration-incomplete
    severity: material
    topic: reference-quality
    missingEvidence: >-
      Named customers, production status, contract values, measurement baselines, and realized outcomes for all six
      published enterprise case studies.
    whyItMatters: Anonymized identified-impact examples do not establish referenceability, deployment durability, or realized ROI.
    diligencePath: >-
      Conduct reference calls under NDA and inspect statements of work, deployment logs, outcome baselines, and renewal
      records.
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-1, top-5, and top-10 customer revenue shares by month, together with buyer and vertical concentration.
    whyItMatters: >-
      A low-confidence public signal of frontier-lab concentration cannot quantify exposure to project pauses or vendor
      reallocation.
    diligencePath: >-
      Request customer-level billings and gross-profit concentration, then test revenue loss under top-account and
      project-cycle scenarios.
  - type: private-evidence-only
    severity: material
    topic: litigation-reserves
    missingEvidence: >-
      Total accrued legal defense expenditures, statutory class settlement reserves, and liability insurance coverage
      limits.
    whyItMatters: >-
      Five federal class-action lawsuits pose potentially material financial liabilities that could impair cash runway
      or force equity dilution.
    diligencePath: >-
      Request legal accrual schedule, audited loss reserve footnotes, and cyber risk insurance policy limits in
      management diligence.
    relatedQuestionRefs:
      - QR002
  - type: conflicting-data
    severity: material
    topic: customer-retention-post-breach
    missingEvidence: Audited monthly recurring revenue by customer and contract renewal rates from Q1 2026 to Q3 2026.
    whyItMatters: >-
      Third-party reports cite Fortune 500 contract terminations and Meta pauses, whereas Mercor claims frontier labs
      expanded work volume.
    diligencePath: >-
      Inspect anonymized customer revenue concentration schedules, paused account logs, and contract churn metrics under
      NDA.
    relatedQuestionRefs:
      - QR003
      - QR004
  - type: enumeration-incomplete
    severity: minor
    topic: regulatory-legal-risk-register
    missingEvidence: >-
      Complete list of state attorney general inquiries and potential international data protection authority filings
      outside California.
    whyItMatters: >-
      Multi-state or GDPR regulatory enforcement can result in statutory fines and mandatory operational consent
      decrees.
    diligencePath: Review company regulatory disclosure logs and state AG inquiry letters during legal confirmatory diligence.
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: >-
      Audited gross-to-net revenue bridge, gross margin by offering, cohort retention, receivables quality, and
      top-customer concentration.
    whyItMatters: >-
      Pass-through expert compensation makes headline revenue an unreliable standalone denominator for valuation and
      return underwriting.
    diligencePath: >-
      Reconcile audited financial statements to customer invoices and expert payouts, then inspect product-level cohorts
      and customer concentration.
    relatedQuestionRefs:
      - QV003
      - QV007
  - type: private-evidence-only
    severity: material
    topic: financing-terms
    missingEvidence: >-
      Fully diluted capitalization, liquidation preferences, participation, anti-dilution, secondary-sale terms, current
      cash, debt, and closing documents for any 2026 financing.
    whyItMatters: >-
      Headline post-money valuation does not establish the effective price, ownership, dilution, or downside protection
      available to a new investor.
    diligencePath: >-
      Obtain the signed term sheet, financing documents, cap-table model, debt schedule, and management's
      sources-and-uses bridge.
    relatedQuestionRefs:
      - QV010
  - type: missing-source
    severity: material
    topic: comparable-set
    missingEvidence: >-
      Comparable public-company revenue-quality metrics, disclosed private round terms, and relevant M&A transaction
      multiples on consistent net revenue and margin definitions.
    whyItMatters: >-
      Mercor's own financing history brackets market marks but does not provide an independent benchmark or a defensible
      exit multiple.
    diligencePath: >-
      Build a banker-supported comparable set using audited net revenue, contribution margin, growth, concentration, and
      transaction terms.
    relatedQuestionRefs:
      - QV009
  - type: private-evidence-only
    severity: material
    topic: breach-litigation
    missingEvidence: >-
      Current case docket, claimed damages, insurance coverage, remediation testing, customer-restoration status, and
      any legal reserve.
    whyItMatters: >-
      Public reporting establishes allegations and disruption but not ultimate liability, remediation effectiveness, or
      continuing revenue impact.
    diligencePath: >-
      Review counsel letters, cyber-insurance policies, forensic reports, control-test results, and customer renewal or
      reinstatement evidence.
    relatedQuestionRefs:
      - QV006
