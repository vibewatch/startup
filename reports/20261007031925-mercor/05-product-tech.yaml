  - id: TE003
    title: Technology and operating architecture
    columns: [Layer or process, Role, Publicly described implementation, Dependency, Principal risk]
    rows:
      - [Expert intake and profile synthesis, "Create a unified candidate view", "Resumes, professional profiles, social accounts, and AI-scored interviews", "Source-data access and scoring models", "Bias, consent, provenance, and model-error controls are not independently evidenced"]
      - [Candidate data and retrieval, "Match people and tasks under hard constraints", "MongoDB Atlas, Vector Search, Voyage AI embeddings, Lucene full-text search, and ranking", "MongoDB, Voyage AI, index quality, and metadata completeness", "Supplier concentration and relevance drift"]
      - [Freshness pipeline, "Make profile and interview changes searchable", "Kafka-based change-data capture and embedding refresh", "Managed Kafka, event integrity, and embedding availability", "No public recovery objective or failure-mode data"]
      - [Code-task search roadmap, "Retrieve and route code tasks", "Dense code embeddings, BM25, ranking, reranking, and model selection described in a hiring brief", "Specialized models, indexes, and evaluation harnesses", "Roadmap language may overstate deployed capability"]
      - [Privacy and data control, "Limit exposure of enterprise and website data", "Sensitive-identifier masking is claimed; website notice describes telemetry and privacy choices", "Anonymization quality, third-party processors, and policy scope", "Platform-specific controls and post-incident remediation are not public"]
    notes: "Architecture is reconstructed from company and supplier descriptions; supplier-reported components are not an independent security or reliability audit."
    claimRefs: [CE003, CE005, CE006, CE009, CE010]
