        - label: Enterprise delivery
          detail: "Forward-deployed engineering, integrations, and continuous optimization connect outputs to enterprise workflows."
          modules: ["Enterprise integrations", "Data monetization", "Agent deployment"]
          outputs: ["Production AI workflows"]
    approximationNotes: "Conceptual stack based on assigned public sources; it is not a verified system diagram and does not imply all modules share one runtime."
    claimRefs: [CE001, CE004, CE005, CE006, CE009, CE016]
