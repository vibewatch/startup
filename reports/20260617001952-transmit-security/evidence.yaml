evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: valuation
    missingEvidence: >-
      A company-approved financing summary or investor legal document that reconciles whether the 2021 valuation should
      be read as pre-money or post-money and whether $2.2B or $2.3B is the canonical figure.
    whyItMatters: Valuation framing is central to stage assessment, investor returns math, and comparables benchmarking.
    diligencePath: Request the 2021 term sheet, cap-table summary, or board materials from management and lead investors.
    relatedQuestionRefs:
      - QO012
  - type: private-evidence-only
    severity: material
    topic: customer-count
    missingEvidence: A current paid-customer count or active-enterprise-account figure broken out by segment and geography.
    whyItMatters: Named logos prove relevance but not breadth, concentration risk, or sales efficiency.
    diligencePath: Request a current customer list, ARR-by-account cohort, and top-20 concentration schedule from management.
    relatedQuestionRefs:
      - QO015
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: Audited or board-level revenue, ARR, net retention, burn, and gross-margin data.
    whyItMatters: Capital raised alone does not show commercial durability or path to profitability.
    diligencePath: Request monthly recurring revenue, audited financial statements, and board KPI packs.
    relatedQuestionRefs:
      - QO016
      - QO025
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: minor
    topic: headcount
    missingEvidence: A company-certified employee count by function and geography as of the run date.
    whyItMatters: Headcount affects burn, services dependence, and global execution capacity.
    diligencePath: Request HRIS headcount exports and an org chart matched to cost centers.
    relatedQuestionRefs:
      - QO017
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A full board roster, committee structure, and investor governance-right summary.
    whyItMatters: Governance quality matters for control analysis, follow-on financing dynamics, and founder dependency assessment.
    diligencePath: >-
      Request board observer lists, governance docs, reserved-matters schedule, and post-Series A shareholder
      agreements.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO002
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-table coverage
    missingEvidence: >-
      A complete internal chronology covering early product launches, executive changes, and any undisclosed regulatory
      or legal events that did not surface in public materials.
    whyItMatters: The milestone table is public-evidence based and may omit internal but decision-relevant chronology.
    diligencePath: >-
      Request a management timeline that reconciles product launches, board changes, and major commercial milestones
      against the public record.
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: Transmit-specific SOM
    missingEvidence: Segment-level pipeline, ACV, win-rate, and regional revenue data needed to isolate Transmit's actual SAM and SOM.
    whyItMatters: >-
      Public TAM ranges are too broad to support valuation without knowing which vertical and geographic slices Transmit
      actually converts.
    diligencePath: >-
      Request management cohort data by vertical, geography, deal size, and deployment type, plus current passkey
      activation and fraud-module attach rates.
    relatedQuestionRefs:
      - QM022
      - QM026
  - type: missing-source
    severity: material
    topic: buyer-budget split
    missingEvidence: >-
      Independent quantitative evidence on how identity, fraud, product, and compliance teams split budget ownership by
      vertical.
    whyItMatters: >-
      Transmit sells across multiple buyer centers, and budget ownership affects sales-cycle length, pricing power, and
      expansion paths.
    diligencePath: >-
      Look for procurement documents, customer case studies, or survey data showing budget-owner mix in banking,
      e-commerce, and public-sector deployments.
    relatedQuestionRefs:
      - QM010
      - QM026
  - type: conflicting-data
    severity: material
    topic: CIAM TAM disagreement
    missingEvidence: >-
      A harmonized methodology that maps which public studies include fraud detection, analytics, identity verification,
      and workforce IAM.
    whyItMatters: >-
      The difference between narrow and broad market definitions changes TAM by tens of billions of dollars and can
      distort valuation narratives.
    diligencePath: >-
      Normalize the leading analyst reports by scope line item before using any single headline figure in an investment
      memo.
    relatedQuestionRefs:
      - QM007
      - QM024
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: minor
    topic: passkey activation by segment
    missingEvidence: >-
      Public cohort data showing how many eligible consumer accounts actually register and use passkeys by vertical and
      device mix.
    whyItMatters: >-
      Availability of passkeys is rising quickly, but conversion from capability to actual usage determines whether
      Transmit captures budget and ROI.
    diligencePath: >-
      Ask management for deployment benchmarks or customer case studies with registration, recovery, and sign-in-success
      metrics by segment.
    relatedQuestionRefs:
      - QM013
      - QM025
  - type: private-evidence-only
    severity: material
    topic: transmit-switching-costs
    missingEvidence: >-
      Cohort-level renewal rates, module attach rates, and win-loss data showing whether Transmit displaces incumbent
      CIAM plus separate fraud stacks after initial deployment.
    whyItMatters: >-
      The public thesis is that unified fraud plus CIAM creates lock-in, but without renewal and expansion evidence the
      moat could still be more conceptual than economic.
    diligencePath: >-
      Request customer-cohort retention, expansion by module, and at least three named migration case studies from
      incumbent CIAM or orchestration competitors.
    relatedQuestionRefs:
      - QP015
  - type: missing-source
    severity: material
    topic: ping-forgerock-integration-proof
    missingEvidence: >-
      Current customer evidence showing whether Ping-ForgeRock unification has improved selling efficiency or created
      migration friction in 2025-2026 deployments.
    whyItMatters: >-
      The merged scope raises competitive pressure on Transmit, but integration drag could delay execution and change
      the real threat level.
    diligencePath: >-
      Ask for post-merger pipeline mix, attach rates for DaVinci into former ForgeRock accounts, and references from
      customers who expanded after the combination.
    relatedQuestionRefs:
      - QP023
  - type: private-evidence-only
    severity: blocking
    topic: realized-pricing-and-win-rates
    missingEvidence: >-
      Realized MAU, per-auth, and platform-bundle pricing plus discount bands for Transmit, Ping, and large-enterprise
      Auth0 or Okta customer-identity deals.
    whyItMatters: >-
      List-price availability is uneven, so underwriting competitive intensity without realized commercial data risks
      overstating or understating both moat and margin durability.
    diligencePath: >-
      Obtain redlined proposals, recent renewals, and at least one head-to-head bake-off dataset covering price,
      implementation effort, and attach assumptions.
    relatedQuestionRefs:
      - QP025
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: Revenue split across identity, fraud, identity verification, services, and channel-assisted deals.
    whyItMatters: Without revenue mix, list prices cannot be converted into a view on realized ACV quality or blended gross margin.
    diligencePath: >-
      Request monthly revenue by product line, services attach, and top-20 customer concentration from the finance data
      room.
    relatedQuestionRefs:
