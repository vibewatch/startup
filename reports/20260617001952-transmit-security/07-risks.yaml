- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Privacy / biometric governance failure
    - Regulator inquiry, DPIA exception, or breach notice involving biometric or IDV flows
    - Any named enforcement action, or any incident requiring FTC or EU authority escalation tied to customer-identity data
    - Move risk rating materially higher; require incident file, remediation plan, and customer churn assessment before underwriting further
  - - Availability and dependency reality worse than headline SLA
    - Sev1 cadence, SLA-credit history, or third-party root-cause share
    - Two quarters of material sev1 dependency incidents, or practical uptime materially below 99.99 because excluded systems dominate
    - Treat reliability moat as overstated and haircut expansion or renewal assumptions
  - - Microsoft ecosystem dependency becomes a chokepoint
    - Product roadmap, packaging, or partner-status deterioration
    - Loss of committed-spend leverage, deprecation pressure, or decline in Microsoft-enabled win paths
    - Re-underwrite channel leverage and assume higher CAC and longer sales cycles
  - - Reference-customer concentration breaks
    - Flagship bank churn, down-scope, or refusal to serve as reference
    - Any major named bank defection or failure of marquee ROI case to renew or expand
    - Raise concentration discount and demand cohort-level gross retention / NRR data
  - - Premium pricing stops covering delivery burden
    - Implementation time stretches, support load rises, or discounting accelerates
    - Launch timelines lengthen materially while pricing transparency and reviewer friction both worsen
    - Assume margin compression and lower valuation support unless management proves counter-trend with cohort economics
  - - Geopolitical continuity fails over poorly
    - Regional disruption affects support, releases, or contractual response obligations
    - Any multi-day interruption attributable to Israel-linked continuity issues without demonstrated regional failover
    - Treat BCP as insufficient and require region-by-region operating map plus tested contingency ownership
  notes: Thresholds are intentionally thesis-oriented rather than legal definitions. They tell an investor when to move from routine monitoring into active re-underwriting or a stop decision.
