callouts:
- calloutType: risk
  title: Liability caps leave a large share of identity-event downside with the customer
  body: The public contracts cap liability to roughly the preceding twelve months of fees even though identity vendors can sit inside fraud, outage, and privacy events whose economic impact is far larger. That does not make the product weak, but it does mean underwriting should assume a meaningful gap between platform value and recoverable damages. Investors and buyers should ask what insurance, indemnity, and customer-side controls fill that gap before treating the contract as a complete risk transfer tool.
  claimRefs:
  - CR008
  - CR015
- calloutType: risk
  title: Microsoft is both an accelerator and a concentration point
  body: 'Transmit''s public Microsoft materials are strong: committed-spend discounts, Azure AD B2C and Entra integration, Sentinel logging, and marketplace packaging all help enterprise adoption. The same evidence also shows concentration. If Microsoft changes packaging, roadmap priority, or partner economics, the channel can shift from accelerator to chokepoint quickly, especially for passkey-led programs that are architected directly on Microsoft identity primitives.'
  claimRefs:
  - CR025
  - CR027
  - CR028
  - CR040
  - CR042
- calloutType: recommendation
  title: Request three non-public files before underwriting scale economics
  body: 'Public evidence is good enough to rank Transmit''s key risks, but not good enough to close underwriting. The minimum data-room ask should be: a customer concentration and renewal cohort by revenue; a sev1/sev2 incident and SLA-credit history split by root cause; and a regional headcount plus follow-the-sun continuity map showing how much critical execution still depends on Israel-linked teams.'
