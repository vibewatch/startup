- id: people-execution-and-geopolitical-exposure
  title: People, execution, and geopolitical exposure
  body: 'The people risk is less about named-founder succession than about where specialist knowledge resides and which legal or operating centers anchor delivery. Public terms show a split between Boston, Tel Aviv, and Vancouver entities, with non-American customers routed through the Israeli entity. That by itself is not a problem, but it means regional disruption can have legal, support, and execution consequences. The June 2026 State Department advisory still tells travelers to reconsider travel to Israel because of terrorism and civil unrest, and to avoid multiple nearby conflict zones entirely. In a vendor whose product sits inside authentication, fraud response, and identity proofing, the continuity question is not abstract: customers expect 24x7 support, coordinated incident response, and uninterrupted rollout work during high-risk periods. Reviewer evidence adds a second people-execution angle: orchestration depth and per-application rule building raise the premium on scarce solution-engineering
    talent and customer-success discipline. If custom-policy specialists, fraud-ops experts, or regional support coverage become constrained, deployment timelines and renewal confidence can deteriorate before headline outage metrics visibly worsen.'
  claimRefs:
