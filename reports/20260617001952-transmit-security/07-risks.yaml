company:
  name: Transmit Security
chapter:
  number: 7
  title: Risks
  summary: Transmit Security's risk profile is dominated by contract-surface mismatch, Microsoft-layer dependency, and premium-platform execution burden rather than by obvious capital distress. Public evidence shows strong controls and serious enterprise traction, but the same evidence also shows biometric/privacy exposure, custom-policy integration complexity, subprocessor concentration, and flagship-bank reference concentration that can break the thesis faster than generic cybersecurity competition.
sections:
- id: regulatory-privacy-and-contract-surface
  title: Regulatory, privacy, and contract-surface risk
  body: 'Transmit Security''s highest hard-to-insure risk is not simple feature competition; it is the combination of biometric processing, heavily regulated financial-institution customers, and contract terms that leave a large portion of downside outside the vendor''s liability envelope. The privacy statement confirms that users can upload government IDs and selfies and that Transmit processes biometric identifiers derived from those images. The DPA then shows how much sensitive data can flow through the stack by default, including device information, ID-document details, selfie photos, date of birth, and network or interaction data, while default retention remains ninety days unless the customer chooses otherwise. That is manageable when customers configure governance tightly, but it is risky when implementations drift, retention expands, or fallback methods introduce more data collection than originally assumed. Regulatory expectations are moving too: the FTC expects financial-institution
    customers to contractually monitor service providers and report qualifying breaches within thirty days, while EBA and EDPB materials show that SCA and biometric handling are still evolving rather than settled. Contractually, recovery is capped to roughly twelve months of paid fees, which is a clear mismatch against the size of fraud, outage, or privacy-loss scenarios that identity vendors can sit inside.'
  claimRefs:
