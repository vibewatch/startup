  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Current revenue concentration by top customer, top ten customers, and Microsoft-influenced channel share.
    whyItMatters: The public proof set is concentrated in very large banks, so retention and bargaining power cannot be underwritten from reference stories alone.
    diligencePath: Request customer cohort, top-account revenue percentages, renewal dates, and reference-account expansion history.
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: incident-history
    missingEvidence: Sev1 and sev2 incident history, SLA credits paid, and root-cause attribution across first-party versus third-party dependencies.
    whyItMatters: The published 99.99% target and multi-cloud claims are directionally helpful, but investors need actual operational performance to test reliability quality.
    diligencePath: Request the last 12-24 months of incident postmortems, status-page history if any, and SLA-credit ledger.
  - type: private-evidence-only
    severity: material
    topic: regional-continuity
    missingEvidence: Regional headcount split, critical-team locations, and tested business-continuity ownership outside Israel.
    whyItMatters: Geopolitical exposure matters only to the extent mission-critical delivery or incident response remains concentrated in affected regions.
    diligencePath: Request org chart by region, on-call model, backup-site ownership, and evidence from recent continuity tests.
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin by module, services attach, and implementation-cost profile for large regulated accounts.
    whyItMatters: Premium pricing is plausible, but public evidence does not show whether margins remain attractive after deployment and support burden.
    diligencePath: Request cohort-level implementation duration, services margin, support cost per active enterprise account, and discounting policy.
