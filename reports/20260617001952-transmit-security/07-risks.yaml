- id: financial-model-and-underwriting-risk
  title: Financial-model and underwriting risk
  body: The financial risk is not that Transmit lacks a premium product story; it is that public evidence still leaves investors underwriting a complex enterprise platform with limited live transparency. The pricing page confirms MAU- or event-volume monetization and enterprise-grade uptime positioning, while review surfaces still say pricing details are not public and total cost can vary with support levels, geography, or data-residency needs. That means gross-margin quality and realized price discipline remain opaque even though the company claims strong customer ROI. The historical capital base is significant — the 2021 Series A brought in $543 million at a $2.2 billion pre-money valuation — but that round is now old relative to the current run date, and no retained source here provides a current priced round, public burn profile, or customer concentration by revenue. Meanwhile, the liability cap remains tied to trailing fees, not to downstream fraud or regulatory loss magnitude. Put
    differently, Transmit may be economically valuable enough to command premium ACVs, but public evidence still does not let an outside investor cleanly size how much of that value converts into resilient margin, diversified renewal risk, or downside protection.
