- id: scale-signals-and-public-metrics
  title: Scale signals, customer proof, and public metric limits
  body: 'Public evidence gives a useful but incomplete picture of operating scale. Official orchestration and platform pages claim the product is used by eight of the top ten financial organizations in the United States, that it orchestrates hundreds of millions of customer interactions each day, and that some deployments support organizations with over 100 million customers. Third-party sources also name major institutions or brands such as Citi, UBS, MassMutual, Lowe’s, and Santander in deployment narratives. Those references indicate real enterprise penetration, but the company does not publicly disclose a canonical live customer count, revenue, or ARR. Headcount is likewise only partially supportable: Dealroom lists 194 employees, while official pages only confirm a global team and distributed offices. As a result, this chapter treats customer breadth and product maturity as directionally strong, while leaving key commercial metrics explicitly unsupported.'
  claimRefs:
  - CO014
  - CO025
  - CO026
  - CO027
  - CO034
  - CO035
  - CO036
