company:
  name: Transmit Security
chapter:
  number: 1
  title: Company Overview
  summary: Transmit Security is a private identity-security software company founded in 2014 by Mickey Boodaei and Rakesh Loonkar, with Boston headquarters, deep Tel Aviv roots, and a current product suite centered on the Mosaic customer-identity, fraud-prevention, and identity-verification platform. Public evidence strongly supports its 2021 $543 million Series A and blue-chip investor roster, but current revenue, customer count, headcount, board composition, and any post-2021 valuation update remain only partially disclosed.
sections:
- id: identity-product-and-model
  title: Identity, product scope, and business model
  body: 'Transmit Security presents itself as an enterprise identity-security vendor built around customer identity, authentication, fraud prevention, and identity verification. Official product pages position Mosaic as a single SaaS-native platform that combines CIAM, fraud controls, and identity-proofing rather than selling only a narrow authentication point tool. The company says it was founded in 2014, is led by its original co-founders, and serves highly regulated enterprises that need digital onboarding, login, recovery, and transaction flows to be secure without adding friction. Pricing is enterprise-oriented and quote-based: the public pricing page advertises customized plans, MAU or event-volume pricing, and a 99.99% uptime SLA rather than self-serve list pricing. That combination supports a business model centered on large-account SaaS and usage-linked platform revenue, with professional deployment and orchestration depth acting as differentiators. Public scale messaging is ambitious,
    but it is still mostly company-claimed rather than independently audited.'
  claimRefs:
  - CO001
  - CO002
  - CO005
  - CO006
  - CO007
  - CO008
  - CO009
  - CO010
  - CO011
  - CO012
