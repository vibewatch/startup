- id: milestones-adverse-signals-and-open-gaps
  title: Milestones, adverse signals, and open diligence gaps
  body: 'The company milestone pattern is straightforward: founding in 2014, a major product step with BindID in early 2021, a record-setting Series A in mid-2021, added blue-chip investors later that year, public Microsoft passkey-partnership messaging in early 2025, and 2025 analyst recognition around access management. Those milestones show category ambition and continued platform expansion, but adverse evidence is still important. Peer review sources cite real implementation friction: rule building can be application-specific, the platform can be technically demanding for non-specialists, pricing is considered premium, and scalability can become tricky as workflows grow more complex. None of those points invalidate the company’s market position, but they do mean buyers and investors should diligence deployment burden, services dependence, and commercial efficiency. The largest unresolved issues remain current revenue, customer count, headcount, board composition, and exact 2021 valuation
    denominator.'
