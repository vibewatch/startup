  - CO049
  - CO050
  figureRefs:
  - FO002
- id: founders-leadership-and-governance
  title: Founders, leadership, and governance visibility
  body: 'Founder continuity is a major feature of the company story. Official pages and investor materials consistently name Mickey Boodaei and Rakesh Loonkar as 2014 co-founders, with Mickey still serving as CEO and Rakesh as President as of the run date. The current public leadership bench also includes CFO Mirit Barak, CLO Kiran Judge, CTO Shmulik Regev, Chief Customer Officer Ashley Arbuckle, Chief Identity Officer David Mahdi, and regional commercial leaders. That lineup suggests the company has grown beyond a pure founder shop into a more functionally complete operating team. Even so, governance disclosure is thin relative to the scale of capital raised: the reviewed official materials do not publish a full board roster, investor control rights, or a clear executive-change chronology. David Mahdi is publicly identified as CIO in late 2025 analyst-recognition press coverage, but broader succession, board committee, and governance mechanics remain diligence items rather than verified
    public facts.'
  claimRefs:
  - CO002
  - CO003
  - CO004
  - CO015
  - CO016
  - CO032
  tableRefs:
  - TO002
- id: capitalization-and-investor-base
  title: Capitalization, investors, and valuation evidence
  body: 'Transmit Security is one of the most visibly capitalized private identity-security vendors of its cohort. The best-supported financing event is the June 22, 2021 Series A, where official and independent reporting align on $543 million raised, led by Insight Partners and General Atlantic, with Cyberstarts, Geodesic, SYN Ventures, Vintage, and Artisanal Ventures also named. A September 2021 company update added Citi Ventures and Goldman Sachs as additional investors in the same round. Where evidence diverges is valuation framing: TechCrunch cites a $2.2 billion pre-money valuation, SYN Ventures cites $2.3 billion pre-money, and Tracxn records a $2.2 billion valuation for the round without fully reconciling pre- versus post-money treatment. No later priced round, credit facility, or debt package was surfaced in reviewed sources, so the public capital story is clear through 2021 financing but materially less clear afterward.'
  claimRefs:
  - CO017
  - CO018
