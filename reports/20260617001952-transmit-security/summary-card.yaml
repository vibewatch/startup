  topStrengths:
    - Founders have strong identity and fraud pedigree from Trusteer and adjacent cybersecurity companies.
    - Mosaic unifies CIAM, orchestration, fraud prevention, and identity verification in one enterprise platform.
    - >-
      Public customer proof includes large-scale banking and insurer deployments with measurable ROI and passkey
      adoption outcomes.
    - >-
      The company raised an unusually large $543M Series A, giving it more historical capital support than most identity
      startups.
    - >-
      Partnership and marketplace positioning with Microsoft, AWS, and Google Cloud can help procurement and integration
      in regulated accounts.
  topRisks:
    - Public revenue, ARR, gross margin, NRR, burn, and runway remain too opaque for clean underwriting.
    - >-
      A 2021-era $2.2B to $2.7B valuation frame looks expensive against current public identity-security comparables
      unless hidden revenue is much higher.
    - >-
      Product breadth and orchestration depth can create implementation complexity, application-specific rule burden,
      and pricing friction.
    - >-
      Privacy, biometric-processing, and retention obligations create meaningful regulatory and contractual exposure for
      a vendor embedded in customer journeys.
    - >-
      Microsoft ecosystem dependence and concentration in flagship financial references raise platform and narrative
      concentration risk.
  unresolvedGaps:
    - Current ARR or revenue bridge, net retention, gross margin by module, and cash runway.
    - >-
      Customer concentration, renewal durability, and the share of bookings sourced through hyperscaler or partner
      channels.
    - >-
      Current cap table, liquidation preferences, secondary activity, and whether any post-2021 financing reset the
      effective valuation.
    - >-
      Exact current headcount and how much delivery or support cost is required to sustain complex regulated-enterprise
      deployments.
