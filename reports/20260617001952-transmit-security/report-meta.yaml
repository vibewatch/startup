  foundingLocation: Tel Aviv, Israel
  headquarters: Boston, MA, USA
  productSummary: >-
    Mosaic is a unified CIAM, identity-orchestration, fraud-prevention, and identity-verification platform supporting
    passkeys, authentication, onboarding, risk scoring, AML or PEP screening, and customer-journey automation for B2C and B2B deployments.
  customerFocus: >-
    Large regulated enterprises, especially banks, insurers, healthcare providers, retailers, and other customer-facing brands
    that need identity, fraud, and verification controls across digital journeys.
  businessModel: >-
    Enterprise SaaS sold on customized contracts, with pricing tied to monthly active users or event volume such as logins and ID checks.
