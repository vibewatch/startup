  rows:
  - - Direct CIAM / customer identity orchestration
    - Registration, login, account management, consent, customer lifecycle journeys
    - Internal workforce IAM, generic PAM, unrelated endpoint security
    - Digital product + identity/security + compliance budgets
    - Core category explicitly addressed by Mosaic
  - - Passwordless authentication / passkeys
    - FIDO/WebAuthn sign-in, MFA replacement, lifecycle and recovery controls
    - Standalone hardware-key programs not connected to customer journeys
    - Identity/security team; sometimes product growth owner
    - Key adoption wedge because it touches fraud, conversion, and support costs
  - - Identity verification
    - KYC, document checks, step-up identity proofing in onboarding and recovery
    - Back-office AML platforms unrelated to customer account journeys
    - Fraud, risk, onboarding, compliance budgets
    - Adjacent category often bundled into customer-journey orchestration
  - - Fraud prevention for account journeys
    - Account takeover defense, behavioral risk, transaction or sign-in fraud controls
    - Card-network fraud platforms and unrelated enterprise fraud suites
    - Fraud/risk owner with security and product co-sponsorship
    - Relevant because MarketsandMarkets and Transmit both place fraud inside the practical buying set
  - - Broader IAM / workforce identity
    - Employee SSO, admin access, directory and workforce governance
    - Most consumer-account workflows
    - CIO/CISO internal IT budgets
    - Context market only; too broad to use as direct TAM
  notes: 'Boundary is intentionally strict: Transmit''s practical market includes CIAM plus closely coupled passkey, verification, and fraud layers, but excludes most workforce IAM and unrelated security spend.'
