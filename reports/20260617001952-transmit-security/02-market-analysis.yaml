company:
  name: Transmit Security
chapter:
  number: 2
  title: Market Analysis
  summary: 'Transmit Security sits in the overlap between CIAM, passwordless authentication, identity verification, and fraud prevention for customer-facing journeys. Published market numbers disagree sharply: a narrow 2026 CIAM lens starts near USD 12.6B while broader consumer-IAM studies imply more than USD 40B, so the usable conclusion is not one TAM number but a boundary-aware range. Demand is strongest where fraud losses, GDPR/CCPA privacy duties, and PSD2-style authentication rules coincide, but passkey recovery, lifecycle control, and segment-specific pricing data remain material adoption constraints.'
sections:
- id: market-boundary
  title: Market Boundary and Substitutes
  body: 'Transmit''s own platform positioning is a useful anchor for the market boundary: the company says Mosaic combines identity management, identity verification, fraud prevention, orchestration, and secure authentication across the entire user lifecycle. That matters because the direct market relevant to Transmit is not the whole identity-and-access-management universe. MarketsandMarkets defines consumer IAM to include identity administration, PII management and analytics, access management, fraud detection, and services, while Grand View and Meticulous publish narrower CIAM market estimates. The broader IAM category is larger because it also includes workforce and administrative access. Identity verification is adjacent rather than fully included, and many buyers still solve the problem with substitutes such as passwords plus OTP, federated sign-in, self-operated identity stacks, or point fraud and IDV tools. For this chapter, the included spend is customer-facing identity orchestration
    and authentication plus closely linked fraud and identity-verification layers, while excluded spend is generic workforce IAM and unrelated enterprise-security tooling.'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
  - CM016
  - CM041
  - CM042
  tableRefs:
  - TM001
- id: sizing-lenses
  title: Multiple Sizing Lenses and Evidence-Constrained TAM
  body: 'The evidence does not support a single clean TAM for Transmit''s market. Grand View puts CIAM at USD 8.12B in 2023 and USD 26.72B by 2030, Meticulous puts CIAM at USD 12.6B in 2026 and USD 40.2B by 2036, while The Business Research Company says consumer IAM was already USD 41.75B in 2025 and reaches USD 101.15B by 2030. Those numbers are too far apart to treat as interchangeable, so the most defensible approach is to preserve the disagreement and carry a range: low case USD 12.6B, working midpoint roughly USD 19B, and broad-definition ceiling around USD 41.75B for 2026-like direct category spend. Precedence''s broader IAM estimate of USD 25.89B in 2026 and Grand View''s separate identity-verification market add context that the full digital-identity journey budget is larger than narrow CIAM alone. For Transmit, that means the near-term opportunity is not the whole broader IAM stack, but the regulated and high-volume customer-journey wedge where passkeys, orchestration, identity
    verification, and fraud controls are bought together.'
