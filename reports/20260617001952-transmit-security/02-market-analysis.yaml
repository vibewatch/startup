- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - GDPR and CCPA privacy duties
    - Accelerator
    - Active now
    - Turns identity, consent, and data handling into a budgeted compliance requirement
    - How much of Transmit's demand is privacy-led versus fraud-led?
  - - PSD2-style strong customer authentication
    - Accelerator
    - Active in EU payments; still relevant to regulated sectors
    - Makes customer-auth UX and assurance strategically important for banks and fintechs
    - What share of pipeline is tied to payments and regulated recovery flows?
  - - Passkey platform availability
    - Accelerator
    - 2024-2026
    - Large platform support reduces technical excuses for rollout
    - What share of customers have activated passkeys beyond pilots?
  - - AI-driven identity fraud and deepfakes
    - Accelerator
    - 2024-2026
    - Raises urgency for stronger authentication plus fraud controls
    - Which verticals buy Transmit for fraud outcomes rather than CIAM modernization alone?
  - - Conversion and support-cost ROI from passwordless
    - Accelerator
    - Current
    - Lets product and security teams fund projects jointly
    - Are buyers seeing measurable lift in sign-in success or support cost reduction?
  - - Account recovery and lifecycle friction
    - Constraint
    - Current
    - Slows enterprise and regulated rollout even when passkeys are available
    - How does Transmit handle recovery, delegation, and cross-device fallback?
  - - Governance and device-visibility limits for synced passkeys
    - Constraint
    - Current
    - Reduces comfort in highly controlled environments
    - Can admins audit where credentials reside and how they are revoked?
  - - Missing public data on segment penetration and pricing
    - Constraint
    - Persistent
    - Prevents clean public SOM modeling and forces management diligence
    - Request win rates, ACV by vertical, and passkey activation by cohort
  notes: The mix intentionally includes both external market drivers and internal diligence blockers because adoption speed matters more than headline TAM for valuation work.
