  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手
      - 类型
      - 规模 / 融资信号
      - 目标客户
      - 差异化
      - 局限 / 方向
    rows:
      - - Transmit Security
        - 直接同业 / 研究对象
        - $543M Series A；大型企业银行与消费者规模信号
        - 银行、金融科技、保险，以及其他高欺诈消费者旅程
        - 在一个运行时中统一 CIAM + 欺诈 + 验证 + 编排
        - 企业定价不透明；公开证据集小于最大型既有厂商
      - - Okta / Auth0
        - 规模化直接既有厂商
        - FY2026 收入 $2.919B；生态和开发者熟悉度
        - 企业员工身份，加上客户身份建设者
        - 可扩展性、应用生态、成熟打包、强开发者触达
        - 企业定价需询价；模块蔓延，加上历史事故 / 可靠性包袱
      - - Ping Identity / ForgeRock
        - 直接既有厂商 / 编排权重高
        - 覆盖超过半数 Fortune 100；合并后范围包括 CIAM + 员工身份 + 治理
        - 需要混合部署或重标准身份的受监管企业
        - 不绑定厂商的编排、混合部署、深度联邦身份能力
        - 并购后平台统一仍是执行变量
      - - Microsoft Entra External ID
        - 捆绑权重高的既有厂商
        - 装机基础庞大；External ID 前 50k MAU 免费
        - 已标准化采用 Azure 和 Microsoft 365 的企业
        - 捆绑杠杆、采购熟悉度、跨产品控制平面
        - 外部身份迁移仍在演进；更深 CIAM 可能需要额外 SKU
      - - Descope
        - 开发者优先的相邻玩家
        - 数千家组织；从初创公司到 Fortune 500 的叙事
        - B2B SaaS、产品团队、外部身份建设者
        - 可视化工作流、快速迁移、强 B2B CIAM 构件
        - 公开信任与规模证明仍弱于头部既有厂商
      - - Stytch
        - 开发者优先的替代品
        - $90M Series B，估值 $1B；3,500+ 开发者
        - 绿地产品团队和无密码优先建设者
        - API 优先打法、透明免费层、低摩擦采用
        - 大型受监管企业替换获胜的公开证据较少
      - - CyberArk
        - 相邻既有厂商
        - 收入 $1.361B；ARR $1.44B；广泛的身份安全套件
        - 购买平台化身份安全的大型企业
        - 客户访问，加上 B2B、生命周期、治理和机器身份相邻能力
        - 目前并不是最清晰的纯 CIAM 替代品
      - - Keycloak / 内部自建
        - 现状替代品
        - 开源软件加内部工程时间
        - 优先考虑控制权、自托管或低现金支出的团队
        - 无许可费、标准支持强、可广泛定制
        - 运维负担、升级复杂度，以及较弱的封装欺诈能力
    notes: 选取的 2026 年格局覆盖直接同业、既有厂商、开发者优先的相邻玩家，以及主要自托管替代品；各行比较的是威胁形态，不是经审计的市场份额。
    enumerationScope:
      coverage: partial
      basis: >-
        Selected 2026 competitor set built from retained official and independent sources across direct peers,
        incumbents, developer-first adjacents, and self-hosted substitutes; not a census of every regional IAM vendor.
