      - number: '4.6'
        title: 财务结论
        blocks:
          - type: paragraph
            body: >
              Transmit Security 的公开财务图景质量有吸引力，但完整度偏弱。有吸引力的部分很直接：企业标价真实存在，在大型银行和保险公司的客户证据可信，案例研究显示可衡量的经济结果，应能支撑溢价 ACV
              和扩张销售。薄弱部分同样重要：公开证据无法让投资人有信心测算当前收入、组合、毛利率、CAC、净留存、burn 或 runway。


              因此，财务结论是有条件的，而不是看多或看空。公司已经规模化服务受监管企业，收入质量看起来优于早期 product-market-fit
              故事；但披露质量明显低于承销所需。本章可以通过商业可行性门槛，但还达不到财务就绪门槛。管理层 data room 对收入组合、按模块毛利率、现金余额、burn 和下一轮触发条件的披露，是硬性尽调阻断点。
            claimRefs:
