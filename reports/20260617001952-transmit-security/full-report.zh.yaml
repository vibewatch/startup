  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 公开证据拉出一个很宽的区间：一端是隐含倍数，另一端是要证明历史私募估值合理所需的收入门槛。
    data:
      items:
        - label: $2.2B 估值对应公开收入区间
          low: 22
          high: 65.9
          unit: x revenue
          note: 基于 $100M 高端和 $33.4M 低端公开收入信号得出的隐含倍数。
        - label: $2.7B 估值对应公开收入区间
          low: 27
          high: 80.8
          unit: x revenue
          note: 基于同一公开收入区间得出的隐含倍数。
        - label: $2.2B 估值在 6.1x-10.2x 下所需收入
          low: 215.7
          high: 360.7
          unit: USDm revenue
          note: 覆盖溢价身份公司和成熟公开 CIAM 倍数的支撑区间。
        - label: $2.7B 估值在 6.1x-10.2x 下所需收入
          low: 264.7
          high: 442.6
          unit: USDm revenue
          note: 更高的历史估值需要更大的隐含规模。
    approximationNotes: 低 / 高值是刻意给出的区间，来自第三方公开收入信号和公开可比倍数；不应误读为公司披露的指引。
    claimRefs:
      - CV017
      - CV031
      - CV032
      - CV033
      - CV034
      - CV035
      - CV036
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: IC 风格记分卡，汇总 Transmit Security 估值判断背后的证据。
    data:
      items:
        - label: 产品验证
          value: 8
          score: 8
          detail: 大型银行、欺诈和 passkey 案例显示，产品具备企业级相关性。
        - label: 客户验证
          value: 8
          score: 8
          detail: 具名或被引用的客户以及商业规模，说明部署深度真实存在。
        - label: 定价权
          value: 7
          score: 7
          detail: 标价从六位数 ACV 起步，但实际折扣不透明。
        - label: 证据质量
          value: 3
          score: 3
          detail: 当前 ARR、NRR、利润率和股权结构数据未公开披露。
        - label: 退出准备度
          value: 3
          score: 3
          detail: 保留来源中没有出现公开申报路径或达到申报级别的披露。
        - label: 估值支撑
          value: 2
          score: 2
          detail: 按当前可见收入区间，公开可比倍数撑不起过时私募估值。
    approximationNotes: 分数是基于保留证据集作出的 0-10 定性判断，目的是支撑 IC 讨论，而不是作为审计指标。
    claimRefs:
      - CV019
      - CV022
      - CV023
      - CV027
      - CV039
      - CV040
      - CV041
