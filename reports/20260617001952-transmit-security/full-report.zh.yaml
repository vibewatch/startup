      - number: '5.2'
        title: 模块地图与运行架构
        blocks:
          - type: paragraph
            body: >-
              公开文档中支撑最强的架构事实是，Mosaic API-first 且服务分离。Transmit 发布了清晰的服务拓扑：文档识别 identity management and journeys、fraud
              prevention 和 identity verification 等服务族；服务总览则列出 distinct Authentication、Identity Management、Detection and
              Response、Identity Verification 和 Identity Orchestration offerings。结果是一张更模块化、而非单体化的产品地图。SDK 和 API
              文档也强化了这一点：它们为编排、风险、身份核验和 WebAuthn 描述了不同的服务端路径和模块。


              开发者姿态也强于许多私有供应商的营销网站。公开文档发布 sandbox endpoint、分地区生产 host、受 RBAC 保护的 API 界面、mTLS 和 private-key-JWT
              选项，以及按模块拆分的 SDK import。npm 包和 GitHub 版图说明，公司不只是声称自己是 API platform；它在公开维护 SDK、wrapper 和 training
              repo。需要注意的是，公司仍主要通过集成界面披露架构，而不是深度系统设计文档。投资人能看到服务边界和开发者工具，但看不到数据存储、模型管线或租户隔离设计背后的完整内部结构。
