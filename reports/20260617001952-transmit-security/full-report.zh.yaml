      - number: '4.3'
        title: 成本结构与毛利率驱动
        blocks:
          - type: paragraph
            body: >
              成本结构只能推断，但方向清晰。核心 CIAM 和编排模块看起来像软件业务，但 Transmit 并不是只卖极简认证 API。其产品集在核心登录流程上叠加欺诈评分、行为分析、身份核验和 active-active
              多云韧性。每项功能都可能增加托管、模型推理、遥测或第三方核验费用，而纯 passwordless toolkit 不会承担这些成本。身份核验的公开标价明确按每 100,000 次 ID
              检查计费，这进一步说明至少部分收入模型带有直接事件挂钩交付成本。


              保留证据中最好的公开 benchmark 是 Okta 的 2026 10-K：总毛利率 77%，订阅毛利率 80%，销售与营销等于收入的 35%，且人工和第三方托管在订阅收入成本中仍占重要比例。这不能证明
              Transmit 的毛利结构，但能框定一个合理的软件区间，同时提醒我们，云身份业务在交付和 go-to-market 上仍重投入。
            claimRefs:
              - CI018
