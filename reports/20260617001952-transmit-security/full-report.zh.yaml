      - number: '5.4'
        title: 差异化、路线图与能力成熟度
        blocks:
          - type: paragraph
            body: >-
              Transmit 最清晰的公开差异化是栈整合。官方和独立材料都把平台描述为一种尝试：把通常由多家供应商组成的身份栈，压进一个由编排牵引的系统里；核心
              CIAM、自适应认证、身份核验和欺诈控制应协同工作，而不是采购后再粘合。这个定位在高欺诈受监管行业尤其可信，因为客户故事反复强调通行密钥、行为信号、设备智能和 step-up 核验的组合，而不是任何单一功能。官方
              Microsoft 内容以及 Aflac 和银行案例研究都强化了这一点：Transmit 卖的是结果包，不是孤立组件。


              对私有供应商而言，路线图证据也异常可见。公开 release-notes 网站显示，2026 年公司仍在交易监控、浏览器接管保护、治理、编排灵活性和风险分析上活跃迭代。结合公开 GitHub 活动和当前 SDK
              packaging，这说明背后是一个仍在运转的产品组织，而不是陈旧 brochureware 表面。较弱的领域是最新主张的成熟度披露，尤其是 machine-and-automation
              ITDR。功能页很详细，但相较较成熟的通行密钥和欺诈界面，该模块的公开客户证据、采用数量和独立验证仍偏薄。
