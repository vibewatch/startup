  - id: TM004
    title: 增长驱动与约束表
    columns:
      - 驱动 / 约束
      - 方向
      - 时间
      - 含义
      - 尽调问题
    rows:
      - - GDPR 与 CCPA 隐私义务
        - 加速因素
        - 已生效
        - 身份、同意和数据处理变成有预算的合规要求
        - Transmit 需求中，隐私驱动与欺诈驱动各占多少？
      - - PSD2 式强客户认证
        - 加速因素
        - 欧盟支付已生效；对受监管行业仍然相关
        - 客户认证 UX 和保障能力对银行及金融科技企业具备战略重要性
        - 管线中有多少与支付和受监管的找回流程有关？
      - - Passkey 平台可用性
        - 加速因素
        - 2024-2026
        - 大型平台支持减少了推迟上线的技术借口
        - 客户中有多少已在试点之外激活 passkeys？
      - - AI 驱动的身份欺诈与深伪
        - 加速因素
        - 2024-2026
        - 更强认证叠加欺诈控制变得更急迫
        - 哪些垂直行业购买 Transmit，是为了欺诈结果，而不只是 CIAM 现代化？
      - - 无密码带来的转化与支持成本 ROI
        - 加速因素
        - 当前
        - 产品和安全团队可以共同出资
        - 买方是否看到登录成功率或支持成本下降的可量化改善？
      - - 账号找回与生命周期摩擦
        - 约束
        - 当前
        - 即使 passkeys 可用，企业与受监管场景的上线速度仍会被拖慢
        - Transmit 如何处理找回、委托和跨设备兜底？
      - - 同步 passkeys 的治理与设备可见性限制
        - 约束
        - 当前
        - 高度受控环境中的接受度会下降
        - 管理员能否审计凭证位于何处，以及如何吊销？
      - - 细分渗透率与定价缺少公开数据
        - 约束
        - 持续
        - 无法做干净的公开 SOM 建模，只能依赖管理层尽调
        - 要求提供按垂直行业划分的胜率、ACV，以及按队列划分的 passkey 激活率
    notes: 这组因素有意同时纳入外部市场驱动和内部尽调障碍；做估值时，采用速度比表面 TAM 更关键。
