  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 用工作流定义产品
        blocks:
          - type: paragraph
            body: >-
              Transmit Security 现在更像把 Mosaic 呈现为统一身份安全操作层，而不是点状 CIAM
              产品。官方平台和文档界面持续把身份管理、欺诈防控和身份核验打包在一个品牌下，再把编排作为控制平面，用来决定在注册、登录、账户恢复、支付或其他高风险动作中应由哪项服务介入。这个框架重要，因为客户买的不只是登录
              SDK；他们买的是一个工作流引擎，可在同一旅程中选择通行密钥、OTP、身份核验、设备智能和欺诈控制。


              从具体用户工作流看，公开界面显示五项核心任务。第一，Mosaic 用通行密钥、OTP、移动生物识别、magic links
              和社交登录处理基础认证。第二，它跨客户和业务场景管理身份与用户库。第三，它在认证前、中、后插入风险和欺诈控制。第四，它为开户注册和 step-up
              事件执行身份核验。第五，它把这些思路延伸到机器和自动化访问，而不是把 API 和 agent 当成事后补丁。因此，产品宽到足以对银行和保险公司产生战略意义，也宽到让实施质量和治理与功能数量同等重要。
