      - number: '2.3'
        title: 买方、用户和付款方分层
        blocks:
          - type: paragraph
            body: >-
              客户身份软件由机构购买，却由机构的终端客户使用，这让买方地图比多数安全品类更复杂。MarketsandMarkets 明确围绕关键利益相关方、购买标准、采用障碍和终端垂直行业来描述 consumer
              IAM。在企业部署中，Microsoft 文档显示通行密钥 rollout 由策略驱动、由管理员启用，因此 champion
              通常是身份或安全领导。在消费者应用中，用户是登录的账户持有人，但买方和付款方是应用运营方的产品、安全、欺诈和合规职能。采用也按阶段推进：支持 WebAuthn 的设备和浏览器、MFA
              注册、relying-party-domain 配置、通行密钥注册流程，然后是完整生命周期管理。最迫切的买方来自拥有大规模消费者账户和可衡量欺诈敞口的行业——银行与 fintech、电商与
              marketplace、旅行与酒店、医疗与公共服务，以及其他拥有转化敏感认证漏斗的数字平台。当这些行业希望用一个控制平面覆盖登录、核验、欺诈、同意和客户生命周期编排，而不是拼接点产品时，Transmit
              的相关性最强。
