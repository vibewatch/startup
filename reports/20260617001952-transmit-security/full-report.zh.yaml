  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、隐私与合同边界风险
        blocks:
          - type: paragraph
            body: >-
              Transmit Security
              最难承保的硬风险，不是简单的功能竞争，而是三件事叠在一起：生物识别处理、客户多为重监管金融机构、合同条款把很大一部分下行情景留在供应商责任范围之外。隐私声明确认，用户可以上传政府 ID 和自拍照，Transmit
              会处理从这些图像中提取的生物识别标识符。DPA 随后显示，默认情况下可能有大量敏感数据流经技术栈，包括设备信息、ID
              文件细节、自拍照片、出生日期、网络或交互数据；默认留存期为九十天，除非客户另行选择。客户如果把治理配置得很紧，这可以管理；但一旦实施漂移、留存扩张，或备用方法引入比最初假设更多的数据采集，风险就会放大。监管预期也在变化：FTC
              要求金融机构客户通过合同监控服务提供商，并在三十天内报告符合条件的违规事件；EBA 和 EDPB 材料则显示，SCA
              和生物识别处理仍在演进，并未尘埃落定。合同上，可追回金额封顶在约十二个月已付费用，这与身份供应商可能卷入的欺诈、宕机或隐私损失场景规模明显不匹配。
