      - - 身份验证
        - 面向身份核验和类 KYC 场景的订阅 / 交易定价
        - 以 100K 次 ID 检查为基线
        - 已明确商业化，并有独立 SKU
        - 可能低于纯软件毛利率，因为使用量按次计费
        - 提供验证供应商成本栈与转嫁经济性
      - - 实施 / 支持服务
        - 无公开价格表；企业上线与支持承诺暗示存在
        - null
        - 经济上重要，但未披露
        - 可能显著影响毛利率和现金转化
        - 提供服务收入占比、可计费费率与附加比例
      - - 合作伙伴辅助采购
        - 不是独立收入来源；影响软件销售和预算归属
        - 已披露 Microsoft 承诺支出 / 生态杠杆
        - 采购加速器，而非独立收入线
