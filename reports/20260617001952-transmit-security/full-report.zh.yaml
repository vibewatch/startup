      - number: '5.3'
        title: 部署、集成、可靠性与支持
        blocks:
          - type: paragraph
            body: >-
              从部署角度看，Transmit 的公开细节足以显示企业化意图。文档列出 sandbox 和多个生产地理区域，并支持自定义域名；SLA 给出正式的 99.99% 可用性目标、24x7 运营表述、一小时
              severity-1 响应目标，并提到具备冗余网络和电力的韧性设施。这套组合比纯营销 trust page 更强，因为它出现在合同和技术文档里，而不只是首页文案。它支撑了这样一个判断：Mosaic
              旨在作为云服务接入生产客户旅程，而不是轻量工具包。


              同时，部署容易度不应被过度销售。客户故事显示快速上线可行：Aflac 用 SDK 在约两个月内把通行密钥嵌入自家网站，官方案例研究也描述了超大规模银行
              rollout。但独立评测反复指出，产品仍需要专业集成知识、审慎工作流设计，并且某些用例需要更好的文档。正确解读是：Transmit 已为拥有解决方案架构能力的团队做好企业级准备，但不是零摩擦
              plug-and-play 开发者工具。这个缺口是核心尽调点，因为当身份逻辑在应用间扩散时，工作流能力可能变成实施负担。
