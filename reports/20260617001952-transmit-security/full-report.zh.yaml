      - number: '4.2'
        title: GTM Motion 与销售效率代理指标
        blocks:
          - type: paragraph
            body: >
              Transmit 的公开证据指向直接企业销售、重解决方案工程的 go-to-market motion，并选择性借助伙伴杠杆。最强证据不是广泛客户数披露，而是一组很窄但体量很大的部署和引用故事：一家覆盖 2
              亿客户和七个 app 的全球银行，一家美国领先银行提到欺诈减少 98%、一个月达成 time to value，Aflac 报告通行密钥采用率 32%、登录成功率
              96%，并在约两个月内上线。这些都是扩张收入和高管销售的强 proof points，但不是典型 SaaS 效率指标。


              Microsoft 合作文章补充了一个财务上重要的采购线索：Transmit
              试图搭乘已承诺云支出和伙伴折扣，这可能压缩受监管企业漏斗顶部的销售摩擦。同时，评测反复指出产品需要专业能力来集成、集中管理规则和扩展。这种组合通常意味着更大的初始 deal size 和强 ROI
              故事，但也意味着昂贵的售前、开户注册和客户成功 motion；公开来源从未用 CAC 或 payback 量化这些成本。
