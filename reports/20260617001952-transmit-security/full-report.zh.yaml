      - number: '4.5'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >
              资本充足性是本章最难用公开证据承销的部分。历史事实很强：Transmit 在 bootstrap 之后，于 2021 年由 Insight Partners 和 General Atlantic 领投的单轮
              Series A 中融资 $543 million。对一家私有身份供应商来说，这是一笔很大的资本基础；保留新闻和 Tracxn 也没有显示后续已披露融资轮。这些事实反驳了资产负债表明显脆弱的判断。


              但这些事实没有回答投资人真正需要的前瞻问题：这笔资本还剩多少，当前 burn 画像如何，公司是否自由现金流为正，什么触发条件会迫使下一轮融资。没有保留公开来源给出现金余额、月 burn、runway
              月数、债务或二级流动性细节。实际结论是，Transmit 公开上不像陷入困境，但 2021 年之后的融资依赖仍未解决，直到管理层提供当前现金桥和预测。
            claimRefs:
