  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点、反论点与建议
        blocks:
          - type: paragraph
            body: >-
              Transmit Security 仍有真实投资论点。公开定价显示，它卖的不是商品化开发者小组件，而是年合同起步达六位数的企业身份平台。客户证明也可信：公司公布了覆盖 2 亿客户和 7
              个应用的全球银行部署，一个美国领先银行案例称 ROI 达 1300%、新账户欺诈下降 98%，Aflac passkey 项目则报告约两个月内采用率 32%、登录成功率 96%。Microsoft
              合作表述还提供了另一个正面线索，因为已承诺支出折扣和采购杠杆，能缩短受监管客户的企业采购周期。


              反论点在于，商业证明尚未转化为公开估值透明度。独立来源对当前规模仍分歧很大，从 2025 年收入 $33.4 million，到 ARR / 类收入规模超过 $100
              million；同时，没有任何保留来源披露净留存、毛利率、burn、现金、债务或清算优先权。独立评测也提醒，平台扩展可能复杂，并缺少部分邮件 / SMS
              集成灵活性。合在一起，证据支持新资金「继续研究」判断、中等信心、高风险评级，以及在任何仍依赖 2021 年融资且缺少新披露的估值标记上持「昂贵」立场。
