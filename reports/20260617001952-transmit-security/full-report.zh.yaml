  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与同业类别
        blocks:
          - type: paragraph
            body: >-
              Transmit 面对的不是一组干净的竞争对手。证据把市场分成五类。第一类是直接 CIAM 和编排同业：Okta/Auth0 与
              Ping/ForgeRock，二者都能把客户身份加工作流工具卖进同一套企业评估。第二类是分发能力很强的既有厂商，如 Microsoft Entra 和 CyberArk；它们未必从同样的产品 DNA
              出发，但能用更广的身份或安全套件吸收相邻支出。第三类是开发者优先的相邻玩家，如 Descope 和 Stytch，强调快速迁移、灵活 API，以及透明或半透明的用量定价。第四类是替代方案，如 Keycloak
              和内部自建，可以覆盖核心登录、联合和用户管理需求，无需购买大型商业平台。第五类是更广义身份安全栈中的潜在进入者，它们能把客户访问交叉销售到既有账户。


              这个分层重要，因为买家同时关注欺诈压力和编排时，Transmit 的胜场最清晰。公开和独立证据都指向一个统一栈，覆盖 CIAM、身份核验、欺诈和重通行密钥旅程。这比泛泛的“identity
              platform”更窄，也更值钱。反过来，只需要商品化登录、合作伙伴 SSO 或低摩擦 greenfield 开发者工具的买家，有很多可信替代方案。公开规模也偏向既有厂商：Okta 和 CyberArk
              提供十亿美元收入锚点，Ping 服务超过半数 Fortune 100，Microsoft 的 bundle gravity 是小厂商无法匹配的。
