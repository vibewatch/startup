      - number: '8.3'
        title: 可比视角与市场倍数现实
        blocks:
          - type: paragraph
            body: >-
              最好的公开锚点不是私有数据库标记，而是已披露的身份公司可比对象。Okta 2026 年 6 月公开数据指向约 6.1x EV / revenue，收入约 $3 billion，同比增长 11%。CyberArk
              更贵，2025 年收入 $1.361 billion，ARR 为 $1.44 billion，2026 年 6 月市值约 $20.6
              billion；即使使用市值而非企业价值，也意味着十几倍中段收入倍数，反映的是高端安全平台画像，而不是普通 CIAM 供应商。行业报告进一步拉宽视角：Windsor Drake 2026
              年研究显示，上市网络安全收入倍数中位数接近 7.8x，表现最佳的 cyber 公司接近 11.9x；其 IAM 报告则突出 SailPoint 约 10x 的上市身份参考点，以及 Okta 的中个位数倍数。


              Transmit Security 自身公开收入证据很难舒服地落进这些区间。按保留的第三方区间 $33.4 million 到超过 $100 million 计算，$2.2 billion 标记意味着约 22x
              到 66x 收入，$2.7 billion 标记意味着约 27x 到 81x。这些水平高于当前公开 CIAM，甚至高于许多高端软件公司，除非隐藏收入远高于公开估计。正确的读法不是 Transmit
              缺少战略价值，而是证明责任现在落在管理层身上：它需要展示远高于当前公开记录支持的规模。
