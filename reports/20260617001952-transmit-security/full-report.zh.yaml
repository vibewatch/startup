  - id: TP004
    title: 护城河耐久性 / 竞争风险登记表
    columns:
      - 护城河主张
      - 支撑证据
      - 威胁 / 替代品
      - 严重性
      - 尽调问题
    rows:
      - - 统一 CIAM + 欺诈 + 验证运行时
        - Transmit 产品功能面和 CIAM Compass 都强调一个运行时
        - Auth0、Descope、Stytch 或 Keycloak 能以更低成本覆盖低欺诈 CIAM
        - 高
        - 量化欺诈感知编排在多大频率上改变胜率，或减少点工具数量
      - - 企业银行 / 金融科技适配
        - Transmit 融资新闻稿和独立评测都聚焦高欺诈金融用例
        - Microsoft 和 Ping 仍可借捆绑或混合身份控制点进入同一批账户
        - 高
        - 要求提供在受监管消费者环境中对 Microsoft、Ping 和 Okta 的可背调获胜案例
      - - 工作流速度作为差异化
        - Transmit、Ping 和 Descope 都营销可视化或无代码编排
        - 编排本身正成为直接和相邻竞争对手的基本配置
        - 中
        - 要求提供按旅程衡量的部署时间优势，以及转化 / 欺诈提升
      - - 多模块采用带来的切换成本
        - 多个模块上线后，统一运行时意味着粘性
        - 公开证据未披露 Transmit 留存、附加率或扩张队列
        - 高
        - 获取队列留存和模块附加数据，验证经济锁定
      - - 既有厂商可靠性与信任缺口创造机会
        - Okta 事故历史和持续状态事件显示，既有厂商信任并不完美
        - 大型既有厂商仍保有规模、采购熟悉度，以及买方可能偏好的状态透明度
        - 中
        - 映射目标账户中的事故响应和可靠性预期，而不是假设买方已厌倦既有厂商
      - - 平台相邻风险目前仍可控
        - CyberArk 范围广，但仍属相邻；Ping 集成仍在推进中
        - 相邻能力可通过交叉销售、收购和捆绑压力快速加深
        - 中
        - 每次重大平台发布或并购后里程碑后，重新检查竞争威胁
    notes: 严重性反映的是 Transmit 相对护城河的下行风险，而非厂商整体质量。若干行有意把产品差异化与经济证据拆开，因为公开证据对前者的支撑强于后者。
