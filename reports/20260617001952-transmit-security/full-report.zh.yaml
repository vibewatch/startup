      - number: '7.5'
        title: 财务模型与承保风险
        blocks:
          - type: paragraph
            body: >-
              财务风险不是 Transmit 缺少高端产品叙事，而是公开证据仍让投资者在有限实时透明度下承保一个复杂企业平台。定价页确认，公司按 MAU 或事件量货币化，并强调企业级 uptime
              定位；评测页面仍称定价细节不公开，总成本会随支持层级、地区或数据驻留需求变化。这意味着，即便公司声称客户 ROI 很强，毛利质量和实际价格纪律仍不透明。历史资本基础很大——2021 年 Series A 以
              $2.2 billion 投前估值融入 $543 million——但相对当前运行日期，这轮融资已经很旧；本文保留的来源也没有给出当前定价轮、公开 burn
              曲线或按收入划分的客户集中度。同时，责任上限仍绑定尾随费用，而不是下游欺诈或监管损失规模。换句话说，Transmit 可能具备足以支撑高 ACV
              的经济价值，但公开证据仍无法让外部投资者清楚测算，其中多少价值能转化为韧性利润率、分散的续约风险或下行保护。
