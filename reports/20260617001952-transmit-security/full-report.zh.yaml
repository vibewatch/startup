      - number: '2.2'
        title: 多重测算口径与受证据约束的 TAM
        blocks:
          - type: paragraph
            body: >-
              证据不足以给 Transmit 的市场推出一个干净的单一 TAM。Grand View 估计 CIAM 在 2023 年为 USD 8.12B、到 2030 年为 USD 26.72B；Meticulous 估计
              CIAM 在 2026 年为 USD 12.6B、到 2036 年为 USD 40.2B；The Business Research Company 则称 consumer IAM 在 2025 年已达 USD
              41.75B，2030 年达到 USD 101.15B。这些数字相差太大，不能互换使用，因此最可辩护的做法是保留分歧并带入区间：低情形 USD 12.6B，工作中点约 USD 19B，广义定义下 2026
              年左右直接品类支出的天花板约 USD 41.75B。Precedence 对更广义 IAM 的 2026 年估计 USD 25.89B，以及 Grand View
              单独的身份核验市场估计，都补充说明完整数字身份旅程预算大于狭义 CIAM。对 Transmit 来说，近期机会不是整个更广义 IAM
              栈，而是受监管、高流量客户旅程中的楔子：通行密钥、编排、身份核验和欺诈控制被一起采购。
