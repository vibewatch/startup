      - number: '8.4'
        title: 牛市、基准与熊市情景
        blocks:
          - type: paragraph
            body: >-
              可以构建一个可辩护的牛市情景，但条件很强。要让旧的私有估值标记成立，Transmit 需要隐藏经常性收入达到高端可比视角所要求的至少数亿美元门槛，还要证明增长质量、留存和毛利率足以让买方愿意支付战略或 IPO
              溢价。在 12x 到 15x 区间下，$2.2 billion 到 $2.7 billion 的标记需要约 $147 million 到 $225 million
              收入，这些门槛明显高于当前公开估计来源显示的水平。


              因此，新投资者的基准情景不是「2021 年融资错了」，而是「2021 年融资尚未被证明」。如果实际经常性收入只是刚刚超过当前公开上沿、略高于 $100 million，那么即便用 7.8x 到 10.2x
              的市场视角，公允价值仍低于旧标记。熊市情景更严厉：如果真实规模更接近低端 $33.4 million
              公开估计，当前公开倍数只意味着数亿美元企业价值和严重下调。由于已披露融资锚点与今天公开证据之间差距太大，情景分析应被视为门槛框架，而不是精确模型。
