      - number: '3.4'
        title: 护城河耐久度与负面证据
        blocks:
          - type: paragraph
            body: >-
              护城河问题的核心，不是 Transmit
              是否拥有有价值的产品功能，而是当身份变得更可组合时，这些功能是否仍然稀缺。最强的看多论点是，重欺诈客户旅程受益于认证、身份核验、编排和欺诈决策之间共享状态，单一运行时能在安全性和转化率上胜过拼接栈。最强的看空论点是，许多买家并不需要完整栈。欺诈较低时，基础
              CIAM 可以来自 Auth0、Descope、Stytch、Microsoft，甚至 Keycloak，评估摩擦明显更低，且往往有公开免费层或既有 bundle 杠杆。


              负面证据让这个担忧更尖锐。Okta 过去的支持系统 breach 和持续的状态事件说明，成熟既有厂商仍有平台和集中度风险。Microsoft 的 bundle 力量与 Keycloak
              的开源可用性，为无差异登录压住价格伞。Ping 合并后的范围在战略上可信，但其集成路线图也意味着客户会继续追问重叠和可选性，而不是凭信念接受单一套件未来。CyberArk
              随身份安全套件拓宽，又带来一个相邻威胁。承销结论是：只有当 Transmit 持续证明，在欺诈敏感旅程上结果优于更便宜或分发更深的替代方案时，其护城河才耐久。公开证据方向上支持该
              thesis，但还没有赢率、实际定价或留存证据，足以把护城河称为闭式结论。
