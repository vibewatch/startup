  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: 商业验证和定价权支撑战略相关性，但披露缺口和倍数压缩又把建议拉回“继续研究”。
    data:
      nodes:
        - id: proof
          label: 商业验证
          detail: 大型银行、保险公司和 ROI 案例显示，产品在企业级规模上跑得通。
        - id: pricing
          label: 定价权
          detail: 公开标价起点为每年 $50K-$200K，取决于模块和使用计量单位。
        - id: distribution
          label: 分销杠杆
          detail: Microsoft 承诺消费和合作伙伴折扣能降低采购摩擦。
        - id: estimate_band
          label: 公开规模区间
          detail: 第三方来源仍只把收入 / 类 ARR 规模放在 $33.4M 到 >$100M 之间。
        - id: market_multiples
          label: 公开可比现实
          detail: 2026 年 6 月，身份 / 网络安全倍数集中在约 6x 到 12x，而不是 20x-80x。
        - id: opacity
          label: 披露缺口
          detail: NRR、毛利率、烧钱速度、现金跑道和优先权结构均未公开。
        - id: call
          label: 建议
          detail: 新资金应继续研究；按过时私募估值买入偏贵。
      edges:
        - from: proof
          to: pricing
          label: 跑通的产品能拿到溢价定价
        - from: pricing
          to: distribution
          label: 企业 ACV 需要可扩张的销售打法
        - from: distribution
          to: estimate_band
          label: 但公开规模仍只是宽泛估计
        - from: estimate_band
          to: market_multiples
          label: 规模必须跨过公开可比门槛
        - from: market_multiples
          to: opacity
          label: 披露不足让溢价承销站不住
        - from: opacity
          to: call
          label: 价格纪律压过品牌质量叙事
    approximationNotes: 这条流程是定性框架，用来展示建议如何由产品验证、规模证据、可比倍数和剩余披露缺口拼出来。
    claimRefs:
      - CV008
      - CV009
      - CV017
      - CV022
      - CV023
      - CV027
      - CV037
      - CV040
