      - number: '8.2'
        title: 历史融资锚点与价格纪律测试
        blocks:
          - type: paragraph
            body: >-
              正式估值锚点已经陈旧，但规模异常大。Transmit Security 最后一次披露的 primary financing 是 2021 年 6 月 22 日 Series A；官方和独立报道都指向 $543
              million 融资额。Business Wire 和 TechCrunch 都将该事件表述为约 $2.2 billion 投前估值，后续公司更新还把 Citi Ventures 和 Goldman Sachs
              列为同一轮融资的新增投资者。PitchBook 仍把最新交易类型标为 Series A、状态为私营；Tracxn 仍只列出这单 $543 million 融资和与 2021 年相关的 $2.2 billion
              估值日期。Dealroom 继续把公司归为独角兽，但只落在 $1 billion 到 $2.5 billion 的宽泛区间内，而不是新的定价轮。


              这给投资者留下一个棘手的价格纪律问题。没有公开证据表明公司已上调估值、接受 down round、披露债务、完成正式二级交易，或给出能重置估值的审计收入。由于 2021
              年估值是在软件倍数更高的时期敲定，应把它视为历史参考点，而不是当前公允价值。缺少 cap table 细节同样重要：没有优先权栈、二级交易和 runway
              数据，投资者无法判断历史估值在出售时到底有多少会归属于新的优先股投资者，或归属于普通股等价持有人。
