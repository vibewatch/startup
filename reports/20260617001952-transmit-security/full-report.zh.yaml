      - number: '3.3'
        title: 定价、分发与切换
        blocks:
          - type: paragraph
            body: >-
              商业结构是最清晰的竞争分界之一。Transmit、Ping 和企业版 Okta 客户身份包仍以报价为主；Microsoft、Auth0、Descope 和 Stytch 都至少公开部分用量或免费层锚点。其中
              Microsoft 战略上最重要，因为其前 50,000 MAU 免费层嵌在更大的 bundle 故事里：买家必须考虑 Azure 或 Microsoft 365 内的增量 Entra
              成本，而不只是标价。VendorBenchmark 明确认为，这会改变每一家独立身份供应商的谈判框架。Okta 仍重要，因为其身份覆盖和生态让它成为许多企业的默认
              benchmark，但其打包方式也带来模块蔓延和续约压力风险。Auth0、Descope 和 Stytch 更透明、更开发者友好，即使企业折扣仍然重要，也会降低评估摩擦。


              分发和切换成本则朝另一方向作用。Ping 触达超过半数 Fortune 100，Microsoft 拥有装机基础引力，二者都有强大的账户级入口。CyberArk 从相邻身份安全方向带来同样风险。公开证据对
              Transmit 切换成本的支撑是方向性的，而非结论性的：一旦欺诈、核验和 CIAM 交织在一起，统一运行时应带来粘性，但公开来源没有提供续约 cohort 或 attach-rate
              证据。因此，多宿主是现实的基准情形。买家可以用点工具、厂商中立编排或自托管替代方案保留谈判杠杆，尤其当其工作负载不足以支撑为欺诈感知编排支付溢价时。
