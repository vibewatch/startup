      - number: '3.2'
        title: 能力、信任与买方匹配
        blocks:
          - type: paragraph
            body: >-
              能力宽度是 Transmit 仍具实质差异化的地方。官方产品证据和独立评测都显示，Mosaic 在一个运行时里合并 CIAM、编排、身份核验、通行密钥和欺诈控制。Ping
              在编排开放性和混合灵活性上竞争最强：其公开材料强调 vendor-agnostic flows、多云与本地集成，以及把外部风险和核验服务接入 no-code 层的能力。Okta/Auth0
              在成熟开发者扩展性和生态熟悉度上竞争最强；Microsoft 则把外部身份折叠进 Azure 和 Microsoft 365 买家已经熟悉的更广控制平面和定价模型。Descope 和 Stytch
              把市场拉向相反方向，突出可视化工作流、SDK、API，以及更快的迁移或 rollout 路径。


              信任姿态也不均衡。每家主要既有厂商都有公开企业采购界面，但释放的强项不同。Okta 和 Microsoft 直接暴露运营状态与事故历史，这对尽调有价值，也让可靠性集中风险可见。Ping 和 CyberArk
              依靠企业广度、混合支持，以及相邻治理或机器身份能力。Descope 已经打包 trust-center 体验；而在已审阅证据中，Transmit
              最强的公开信任信号来自金融服务适配、通行密钥准备度和重欺诈用例，而不是广泛的公开认证。实际结果是：在受监管、高欺诈的 B2C 旅程中，Transmit 看起来最强；开放性或 bundle 杠杆占主导时，Ping
              和 Microsoft 更强；开发者主导或迁移速度主导的 motion 中，Descope 或 Stytch 更强。
