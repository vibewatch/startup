    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品范围与商业模式
        blocks:
          - type: paragraph
            body: >-
              Transmit Security 将自己定位为企业身份安全供应商，围绕客户身份、认证、欺诈防控和身份核验构建。官方产品页把 Mosaic 定位为单一 SaaS 原生平台，合并
              CIAM、欺诈控制和身份核验，而不是只卖狭窄的认证点工具。公司称其成立于 2014
              年，仍由原始联合创始人领导，服务高度受监管企业；这些企业需要让数字开户注册、登录、恢复和交易流程足够安全，同时不增加摩擦。定价面向企业、以报价为主：公开定价页宣传定制方案、MAU 或事件量定价，以及 99.99%
              uptime SLA，而不是自助式标价。上述组合支撑了以大客户 SaaS 和用量挂钩平台收入为核心的商业模式，专业部署和编排深度则构成差异化。公开规模叙事很有野心，但目前仍主要来自公司口径，未经过独立审计。
