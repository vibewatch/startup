  - id: TV005
    title: 论点失效与否决触发因素表
    columns:
      - 触发因素
      - 阈值或事件
      - 重要性
      - 行动含义
    rows:
      - - 收入支撑失效
        - 经核验的经常性收入明显低于约 $100M，或增长质量偏弱。
        - 在当前公开倍数区间下，历史估值标记无法再自圆其说。
        - 不要按接近旧私募估值来承销。
      - - 价格发现不利
        - 下轮融资、折价二级交易或结构化融资把价值重置到 2021 年锚点以下。
        - 新价格发现会取代陈旧的历史叙事。
        - 按新观察到的交易重新切估值。
      - - 股权结构包袱
        - 优先股堆栈、债务或清算瀑布比预期更苛刻。
        - 账面估值未必能转化成普通股等价经济收益。
        - 投资前先完整建模完全摊薄与清算情景。
      - - 实施负担恶化
        - 独立客户证据显示扩张慢、增购弱或集成疲劳。
        - 如果部署强度压低利润率和留存，高 ACV 的吸引力会下降。
        - 下调增长质量假设和可比倍数。
      - - 缺少退出路径证据
        - 现金需求上升时，没有申报进展、投行流程或战略兴趣浮现。
        - 估值支撑转弱的同时，持有期和流动性风险上升。
        - 从可跟踪持有转为回避 / 下调估值立场。
    notes: 这些是尽调阶段的否决触发因素，不只是经营 KPI。任一因素都足以让新投资人的高估值论点失效。
    claimRefs:
      - CV019
      - CV021
      - CV037
      - CV038
      - CV040
      - CV041
      - CV042
  - id: TV006
    title: 最终尽调索要清单
    columns:
      - 议题
      - 缺失证据
      - 重要性
      - 尽调路径
    rows:
      - - 当前 ARR 与收入桥
        - 2024 年以来的月度或季度经常性收入、GAAP 收入与订单桥。
        - 必须用真实规模替代第三方估算区间。
        - 索取董事会材料、财务包和最新管理账。
      - - 留存质量
        - 按客户分群拆分的 NRR、GRR、cohort 扩张和流失。
        - 高身份领域倍数需要可持续增购支撑，而不只是客户品牌质量。
        - 索取客户 cohort 表和前 20 大账户历史。
      - - 按产品和服务拆分的毛利率
        - CIAM、欺诈、验证和实施 / 服务的毛利率拆分。
        - 决定六位数定价能否转化为软件式经济性。
        - 索取毛利率瀑布，以及托管成本 / 第三方成本明细。
      - - 流动性与现金 runway
        - 账面现金、burn、现金 runway、债务和融资触发条件。
        - 2021 年大额融资并不证明当前资产负债表安全。
        - 索取现金桥、债务明细和下行情景经营计划。
      - - 股权结构与优先权
        - 优先股堆栈、清算优先权、二级交易、SAFEs / 票据和员工期权包袱。
        - 账面估值可能高估新投资人或普通股等价持有人的真实价值。
        - 索取股权结构表、章程、附函，以及最近一次 409A / 董事会估值。
      - - 退出流程准备度
        - 投行材料、审计准备度、董事会讨论，以及任何 IPO / 战略接触状态。
        - 没有退出路径时，高私募估值更难变现。
        - 索取达到申报准备度或战略流程准备的路线图。
    notes: 每项索要都是把建议从继续研究推向买入，甚至以高置信度进入中性跟踪的直接阻塞点。
    claimRefs:
      - CV005
      - CV037
      - CV038
      - CV040
      - CV041
      - CV042
