      - number: '7.3'
        title: 合作伙伴、平台与子处理方依赖风险
        blocks:
          - type: paragraph
            body: >-
              Transmit 主打强互操作性，但公开证据也显示出有意义的依赖集中。最显眼的依赖是 Microsoft：marketplace 列表和集成教程把 Transmit 架在 Azure AD B2C 和 Entra
              External ID 之上，公司自己的合作伙伴博客也推广 Microsoft 已承诺支出采购和合作伙伴折扣。这形成了有用渠道，但也意味着 Transmit 的一部分 passkey 动作暴露在
              Microsoft 产品路线图调整、打包变化和合作伙伴优先级决定之下。再往下看，DPA 披露了一个宽泛的第三方运营网络：AWS、Google Cloud、MongoDB
              Atlas、Cloudflare、Veriff、Salesforce
              和外包支持提供商都处在交付路径的某个位置。多云和会话内故障切换能缓解部分单云宕机风险，但无法消除对子处理方性能、定价或合同可用性的依赖。公开客户证明也集中在少数超大型金融机构。一家银行部署覆盖 2 亿客户和 7
              个应用；另一家声称一个月内 ROI 达 1300%、欺诈下降 98%。这些参考案例很强，但也意味着，即使只失去少数旗舰客户或渠道关系，也可能带来过大的叙事和商业影响。
