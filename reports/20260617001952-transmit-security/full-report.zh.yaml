            body: >-
              到了持久性，公开客户叙事就弱很多。评测平台整体认可产品能力和客户支持，公开案例也反复强调呼叫中心来电下降、密码重置减少、欺诈降低、用户体验改善。Aflac 是当下最干净的证明点：passkey 采用率
              32%，登录成功率 96%，发布时未报告登录失败。即便如此，Transmit 仍未披露 NRR、GRR、总 logo 流失、标准合同期限、续约节奏或按模块留存。负面证据也不是噪音：PeerSpot 和 G2
              评测者认为规则构建仍有应用专属性，扩展取决于工作流复杂度，价格偏高，集成需要专业能力。TrustRadius
              还补充了更新节奏和设置丢失等较小但值得注意的抱怨。这些不否定客户价值，但确实说明，扩张和持久性可能更依赖技术成熟的大型企业买方，而不是低摩擦自助销售动作。
