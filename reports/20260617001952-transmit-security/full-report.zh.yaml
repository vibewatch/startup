      - number: '4.4'
        title: 公开牵引力与私有指标缺口
        blocks:
          - type: paragraph
            body: >
              公开牵引力比公开财务更容易证明。新闻和案例研究材料中点名或引用的客户包括大型金融机构和保险公司；FeaturedCustomers 称该平台支持的品牌每年负责超过 $2 trillion
              商业交易；Business Wire 称美国前十大银行中的七家信任 Transmit；公开客户故事也显示极大规模的生产使用。难点在于，这些牵引力信号无法调和成可靠收入基数。保留数据库和估算网站给出的范围从
              $33.4 million 收入，到 $60.8 million 收入，再到超过 $100 million ARR；员工数估计则从 308 到 368。


              这个区间太宽，无法做干净承销，也没有已审计财务报表来锚定模型。SEC EDGAR 没有为 Transmit 本身提供明显 public-issuer
              轨迹；保留的公司、评测和数据库来源也不披露毛利率、burn、runway、NRR、客户集中度或模块组合。因此，公开牵引力支撑商业相关性，但不能精确判断当前规模或效率。
