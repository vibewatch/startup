        - 管理层证明经常性收入约 $180M 或更高，留存扎实，并具备可信的 IPO 或战略退出准备度。
        - 按 12x-15x 收入计算，旧的 $2.2B-$2.7B 区间变得可支撑，且可能有温和上行。
        - 没有新披露时概率低。
        - 只有隐藏规模显著高于当前公开估算，2021 年估值才守得住。
      - - 基准
        - 管理层证明收入高于当前公开估算上限，但低于明确溢价阈值；利润率和留存透明度好坏参半。
        - 按约 7.8x-10.2x 视角，除非规模远高于公开估算，否则公允价值很可能仍低于旧私募区间。
        - 缺少数据室证据时，这是最可能情形。
        - 新资金应谈折价或暂缓。
      - - 熊市
        - 真实规模更接近公开估算低端，或 down-round / 不利二级交易重置价格发现。
        - 按 $33.4M-$60M 规模、约 6.1x-7.8x 计算，价值会压缩到数亿美元低段。
        - 如果披露不及预期，风险很实质。
        - 对新买方而言，陈旧的 2021 年估值会造成经济误导。
    notes: 场景按阈值搭建，因为当前 ARR 和利润率数据没有公开披露。它们用于框定披露需要证明什么，而不是编造隐藏指标。
