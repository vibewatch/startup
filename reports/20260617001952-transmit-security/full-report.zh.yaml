      - number: '8.5'
        title: 退出准备度、终止触发器与最终尽调索取项
        blocks:
          - type: paragraph
            body: >-
              披露质量够强时，身份资产可以实现不错退出。SailPoint 清楚展示了这种模式：Thoma Bravo 在 2022 年以约 $6.9 billion 将其私有化；到 2025 年 2 月，公司在披露此前九个月
              $621 million 收入后，能够以 $12.8 billion 市值重返公开市场。Transmit 在公开层面还没有呈现这种准备度。PitchBook 仍显示私营状态和 2021
              年最新交易；保留来源集也没有浮现 S-1、F-1 或其他附带已披露财务的活跃 IPO 流程。


              这不意味着公司坏了；而是尽调瓶颈只能靠管理层披露解决。如果新融资或二级交易显示估值较旧标记大幅折让，如果当前 ARR 明显低于公开可比对象隐含门槛，如果留存或毛利率显示软件经济性偏弱，或隐藏优先权栈让
              headline valuation 在经济上误导，论点就会破裂。因此，最终尽调索取项很直接：管理层必须提供 ARR 与收入桥、cohort 留存、按模块和服务拆分的毛利率、现金 / runway
              桥，以及当前清算 waterfall。没有这些，fresh investor 不应在接近历史标记的价格承保公司。
