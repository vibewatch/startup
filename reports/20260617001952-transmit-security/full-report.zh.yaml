      - number: '6.5'
        title: 扩张路径、渠道依赖与集中度风险
        blocks:
          - type: paragraph
            body: >-
              上行情景很直接：Transmit 可以在大型受监管企业内部，从登录扩到编排、欺诈、身份验证、恢复、呼叫中心流程和跨渠道安全。Microsoft
              合作带来具体的采购切口，因为已承诺的云支出和合作伙伴折扣，能让已经标准化到 Azure AD B2C 或 Entra External ID
              的企业更容易启动采购。下行同样清楚。公开证明集中在少数大型参考客户，其中很多是银行或保险公司；公司仍未披露客户数量，也未披露最大客户敞口。三个承保风险因此没有解决：第一，少数灯塔客户是否贡献了过高比例的
              ARR；第二，Microsoft 和其他合作伙伴是否足以影响采购，从而削弱公司对客户关系的直接所有权；第三，实施复杂度是否把可服务基础收窄到拥有大型安全和身份团队的组织。Transmit 看起来有
              land-and-expand 能力，但公开记录仍无法区分覆盖广度和客户集中度。
            claimRefs:
