  - id: TR005
    title: 缓解措施与否决标准表
    columns:
      - 风险
      - 可监控触发因素
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 隐私 / 生物特征治理失效
        - 涉及生物特征或 IDV 流程的监管询问、DPIA 例外或泄露通知
        - 任何点名执法行动，或任何因客户身份数据而需要上报 FTC 或 EU 监管机构的事件
        - 将风险评级实质性上调；继续承销前要求提供事件档案、整改计划和客户流失评估
      - - 可用性和依赖现实差于表面 SLA
        - sev1 频率、SLA 抵扣历史或第三方根因占比
        - 连续两个季度出现重大 sev1 依赖事件，或因排除系统占主导，实际 uptime 明显低于 99.99%
        - 将可靠性护城河视为被高估，并下调扩张或续约假设
      - - Microsoft 生态依赖变成瓶颈
        - 产品路线图、打包方式或伙伴身份恶化
        - 失去承诺支出杠杆、面临弃用压力，或 Microsoft 带来的 win path 下滑
        - 重新承销渠道杠杆，并假设 CAC 更高、销售周期更长
      - - 标杆客户集中度破裂
        - 旗舰银行流失、缩小范围或拒绝担任标杆
        - 任何被点名的大型银行流失，或明星 ROI 案例未能续约或扩张
        - 提高集中度折价，并要求提供 cohort 级 gross retention / NRR 数据
      - - 溢价定价无法覆盖交付负担
        - 实施时间拉长、支持负载上升或折扣加速
        - 上线周期显著拉长，同时定价透明度和评测摩擦都恶化
        - 除非管理层用 cohort economics 证明逆势，否则假设利润率承压、估值支撑下降
      - - 地缘政治连续性故障切换失败
        - 区域扰动影响支持、发布或合同响应义务
        - 任何因以色列关联连续性问题造成的多日中断，且未展示区域故障切换
        - 将 BCP 视为不足，并要求提供逐区域运营地图和已测试的应急责任归属
    notes: 阈值有意围绕投资主题，而不是法律定义。它们告诉投资者，何时应从例行监控转向主动重新承销或停止决策。
