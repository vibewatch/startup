      - number: '7.2'
        title: 运营可靠性、安全执行与控制平面复杂度
        blocks:
          - type: paragraph
            body: >-
              公司的产品承诺在运营上很激进。Transmit
              卖的不是一个登录小组件；它主张在整个客户旅程中提供编排、passkey、欺诈预防、身份验证、设备智能和自适应决策。这种广度带来真实上行，但也扩大了故障面。Microsoft marketplace
              页面明确承认，passkey 项目在注册、账号恢复、设备丢失场景和加强认证不足时仍有漏洞。Microsoft Learn 也说得很清楚：最知名的欺诈和 passkey 集成需要 Azure AD B2C
              自定义策略和专用 Transmit 租户，这会把部署推向专家实施工作，而不是纯即开即用 SaaS。已发布 SLA 的目标可用性为
              99.99%、一级严重事件一小时响应目标，体面但排除项很关键：第三方服务、客户系统、定制化、试用和 POC 都不在最干净的 uptime
              承诺内。评测证据从另一侧强化了同一个运营主题：规则构建可能变成应用专属，工作流越复杂扩展越棘手，非技术用户体验仍需打磨。对于卖进大型银行的平台，这些不是表面问题，而是部署摩擦和运营负担风险。
