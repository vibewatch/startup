  - id: TP003
    title: 定价 / 打包对比
    columns:
      - 厂商
      - 公开定价姿态
      - 商业锚点
      - GTM / 分销
      - 切换或多归属含义
    rows:
      - - Transmit Security
        - 无公开标价
        - 企业报价；独立报道称最低合同额为六位数
        - 面向欺诈较重的 B2C 账户直销企业客户
        - 只有在欺诈、验证和 CIAM 交织后，粘性才可能较强
      - - Okta / Auth0
        - 部分透明
        - Okta 企业询价，加上 Auth0 MAU / 免费层阶梯
        - 大型企业现场销售，加上强开发者漏斗
        - 扩展模块和生态熟悉度抬高切换摩擦
      - - Ping / ForgeRock
        - 报价驱动
        - 演示驱动的打包，配合伙伴和现场销售打法
        - Fortune 100 企业触达和既有混合部署资产
        - 开放性可降低重写风险，但平台深度仍会带来迁移成本
      - - Microsoft Entra External ID
        - 入口透明，真实总成本不透明
        - 前 50k MAU 免费，加上 Azure/M365 捆绑经济性
        - EA 驱动、Azure 消费牵引的分销
        - 捆绑杠杆可能迫使独立厂商降价或丢份额
      - - Descope
        - 用量入口透明
        - 免费起步、超量收费、高阶迁移和 FGA 上售
        - 产品驱动，加上向 B2B SaaS 的企业扩张
        - 快速迁移姿态降低试用摩擦，并保留买方选择权
      - - Stytch
        - 用量入口透明
        - 10k MAU 免费，无价格悬崖，超过后按用量收费
        - 开发者牵引的绿地打法
        - 企业治理需求较轻时，易于试点或多归属
      - - CyberArk
        - 报价驱动的套件定价
        - 围绕更广身份安全的平台销售
        - 安全套件与渠道驱动的企业打法
        - 相邻能力可赢得预算整合，但不总是干净的 CIAM 替换
      - - Keycloak / 内部自建
        - 软件无许可费
        - 现金成本低；人工和集成成本高
        - 自助采用，加 SI / 内部工程
        - 厂商支出低，但一旦深度定制，运维锁定高
    notes: 本表比较公开定价可见度和上市路径，不比较实际合同价格。企业 CIAM 交易的准确生产定价仍是尽调缺口，因为多家厂商只披露部分锚点。
