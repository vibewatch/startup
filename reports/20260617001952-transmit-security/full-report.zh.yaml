  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入流、定价与收入质量
        blocks:
          - type: paragraph
            body: >
              Transmit Security 现在披露的定价细节，足以建立粗略收入架构，尽管公司仍未披露实际定价、折扣和模块组合。公司显然在销售高客单价企业平台，而非自助式开发者 SKU：完整 Mosaic 套件标价从
              $200,000 起，identity-only SKU 为 $100,000，fraud and threat detection 为 $100,000，identity verification 为
              $50,000，计费与 MAU、登录量或 ID 检查次数挂钩。这种结构指向经常性订阅收入，但也意味着实际 ACV 会随部署架构和用量画像出现明显差异。


              尚未得到支撑的是核心 CIAM 订阅、欺诈模块、身份核验，以及任何付费实施或支持服务之间的组合。公开来源没有披露 bookings 中有多少比例来自最大银行部署与较小企业账户，Microsoft
              或其他合作伙伴是否影响 take rate，或专业服务与软件收入各占多少。因此，财务承销能确认标价质量，但不能确认实际收入质量。
