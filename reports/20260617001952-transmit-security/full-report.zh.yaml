      - number: '5.5'
        title: 信任、安全、隐私与合规控制
        blocks:
          - type: paragraph
            body: >-
              信任故事在控制类别上较强，在完整透明度上较弱。积极的一面是，法律和标准证据真实存在。Transmit 发布隐私声明，清楚区分其何时作为 processor、何时作为 controller；其 SLA
              也用企业条款描述变更管理流程、紧急维护和支持覆盖。公司的通行密钥叙事也与外部标准一致：FIDO、W3C、passkeys.dev、Microsoft 和 NIST
              都描述了同一种抗钓鱼、公钥凭证模型，Transmit 正围绕该模型构建。上述证据不能证明每个实施细节，但说明产品与当前认证范式一致，而不是发明自有标准。


              缺失部分同样重要。本次审阅的公开材料没有给出丰富的 trust-center
              工件集，无法像部分更大同业一样覆盖独立认证、详细分处理方治理或事故历史披露。评测内容还显示，低代码叙事并没有完全抽象掉工作流治理和可用性问题。因此，投资人结论应保持平衡：平台看起来安全原生且符合标准，但在把每项控制主张视为已完全承销前，供应商尽调仍需要更深入的
              trust-center 工件、实施引用和按模块证据。
