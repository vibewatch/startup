              更容易赢。没有公开的是付费客户总数、银行与非银行账户之间的拆分，或任何收入区间分层。因此，分层故事可以由用例和垂直行业支撑，但仍不能由已披露 logo 数、ACV cohort 或客户集中度表支撑。
