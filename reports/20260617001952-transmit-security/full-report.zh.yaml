  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代品
        blocks:
          - type: paragraph
            body: >-
              Transmit 自己的平台定位是界定市场边界的有用锚点：公司称 Mosaic 覆盖整个用户生命周期，把身份管理、身份核验、欺诈防控、编排和安全认证合在一起。这一点重要，因为与 Transmit
              直接相关的市场并不是整个身份与访问管理宇宙。MarketsandMarkets 将 consumer IAM 定义为包含身份管理、PII 管理与分析、访问管理、欺诈检测和服务；Grand View 与
              Meticulous 则发布更窄的 CIAM 市场估计。更广义的 IAM 品类更大，因为还包含员工身份和管理访问。身份核验与其相邻，但不完全包含其中，许多买家仍用密码加 OTP、联合登录、自建身份栈，或点状欺诈和
              IDV 工具来解决问题。本章纳入的支出是面向客户的身份编排和认证，以及紧密相连的欺诈与身份核验层；排除的是通用员工 IAM 和无关企业安全工具。
            claimRefs:
              - CM001
