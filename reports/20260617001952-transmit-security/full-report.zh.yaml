companyProfile:
  summary: >-
    Transmit Security 是一家私有身份安全软件公司，2014 年由 Mickey Boodaei 和 Rakesh Loonkar 创立，总部在 Boston，运营根基深扎 Tel Aviv，平台战略围绕 Mosaic
    展开。Mosaic
    把客户身份与访问管理、身份编排、欺诈防控和身份核验合在一个企业级、基于微服务的平台里，主要卖给大型受监管企业。公开证据显示客户相关性很强，尤其在银行和保险领域；历史融资支持也异常充足。但当前财务透明度落后于公司的产品和客户证据。
