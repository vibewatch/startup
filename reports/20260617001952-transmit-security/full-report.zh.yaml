      - number: '2.4'
        title: 增长驱动、采用约束与开放缺口
        blocks:
          - type: paragraph
            body: >-
              需求上升的原因很具体，不是停留在理论层面。FIDO 称超过 150 亿个线上账户可利用通行密钥，Mobile ID World 报道认知提升和主要平台 rollout。欺诈压力也体现在硬货币损失上：FTC
              称美国消费者 2024 年报告的欺诈损失超过 USD 12.5B，UK Finance 称 2023 年欺诈损失为 GBP 1.17B。Signicat 调查还显示，AI 已深度卷入身份欺诈，包括
              deepfake。这些驱动与 GDPR、CCPA 和 PSD2 式认证要求交汇，使客户身份成为横跨风险、合规和增长的预算项。但可用不等于采用。USENIX 和 MDPI
              都描述了恢复摩擦、技术问题、监管要求和用户感知问题导致 rollout 缓慢；Microsoft 还指出，管理员仍不能完全看到或控制同步通行密钥存放在哪里。因此需要保留这个矛盾：市场显然在扩张，但
              Transmit 特定的精确 SOM、买方预算拆分，以及各细分通行密钥激活率仍披露不足，需要管理层尽调，而不是表格外推。
