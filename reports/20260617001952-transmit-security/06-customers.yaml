company:
  name: Transmit Security
chapter:
  number: 6
  title: Customers
  summary: 'Transmit Security’s public customer proof is credible but concentrated: it has several high-signal production references in banking, insurance, and consumer finance, yet still withholds customer count, retention, and concentration disclosure. The best evidence comes from named or richly described deployments such as Citi, BRED, NN, America’s Car-Mart, and Aflac, while broad “top banks / top insurers / $2T commerce” claims remain logo-level signals rather than customer-base transparency.'
sections:
- id: customer-segmentation
  title: Customer Segmentation and Public Buyer Map
  tableRefs:
  - TU001
  figureRefs:
  - FU001
  body: Transmit Security’s customer evidence points to a concentrated but high-value buyer map. The company’s own materials repeatedly frame banks, insurers, retailers, and other large digital brands as the core customer set, while the named public references skew even more heavily toward regulated financial services and insurance. The practical buyer is usually a digital identity, fraud, security, or customer-platform team buying for consumer-facing login, onboarding, account recovery, or transaction journeys; the end user is the enterprise’s own customer, not an internal employee. Public proof also suggests Transmit wins where enterprises have fragmented identity stacks, large consumer bases, and meaningful fraud pressure. What is not public is the total number of paying customers, the split between banking versus non-banking accounts, or any revenue-band segmentation. So the segmentation story is supportable by use case and vertical, but still not by disclosed logo count, ACV cohort,
    or customer concentration schedule.
  claimRefs:
  - CU001
  - CU002
  - CU005
  - CU006
