- id: adoption-and-scale
  title: Adoption Trajectory and Public Scale Signals
  tableRefs:
  - TU002
  figureRefs:
  - FU002
  body: 'Transmit Security’s public adoption proof is strongest in deployment snapshots rather than in a single disclosed customer-count KPI. Official briefs say the platform serves many of the world’s largest banks, insurers, and retailers, collectively tied to more than $2 trillion in annual commerce, while later company-issued press language adds that seven of the top ten U.S. banks trust the platform. Those are large-scale signals, but they are not the same as a disclosed customer count. The better evidence comes from named deployments and case-study denominators: a global bank using Transmit across 200 million client accounts in more than 160 countries, an unnamed leading U.S. bank using the fraud stack to detect more than 12,000 bad accounts in a one-month trial, NN citing 18 million customers, and Aflac disclosing more than 265,000 enrolled passkey users after launch. This is enough to show real enterprise-scale adoption, but not enough to harmonize active logos, live modules per
    logo, or revenue retention by cohort.'
  claimRefs:
  - CU001
  - CU002
