  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: customer-count-gap
    missingEvidence: Current total paying-customer count, active-logo count, and segment split by banking, insurance, retail, and other verticals.
    whyItMatters: Without a customer-count baseline, large lighthouse deployments can look broader than the actual installed base.
    diligencePath: Request a current customer-count bridge with active logos, live modules, and revenue concentration by segment.
    relatedQuestionRefs:
    - QU003
  - type: private-evidence-only
    severity: material
    topic: retention-gap
    missingEvidence: NRR, GRR, logo churn, renewal timing, and standard contract length by customer cohort.
    whyItMatters: Public satisfaction signals and launch metrics do not prove recurring-revenue durability.
    diligencePath: Request customer-retention dashboards, renewal cohorts, and top-20 account renewal schedule.
    relatedQuestionRefs:
    - QU009
    relatedTableRefs:
    - TU005
  - type: private-evidence-only
    severity: material
    topic: concentration-gap
    missingEvidence: Top-customer exposure, top-vertical ARR mix, and partner-sourced ARR / pipeline share.
    whyItMatters: A handful of large regulated logos could drive a disproportionate share of revenue and support burden.
    diligencePath: Request top-10 customer ARR, top-vertical mix, and direct-versus-partner-sourced bookings and renewals.
    relatedQuestionRefs:
    - QU019
    relatedTableRefs:
    - TU006
  - type: enumeration-incomplete
    severity: minor
    topic: proof-quality
    missingEvidence: A fuller named reference list showing which public case studies are active production accounts versus historical pilots or marketing references.
    whyItMatters: The public set is good enough to prove capability but not enough to show how representative the visible references are.
    diligencePath: Ask management for a referenceable-customer roster segmented by vertical, production status, module, and reference-call availability.
    relatedQuestionRefs:
    - QU017
    relatedTableRefs:
    - TU003
