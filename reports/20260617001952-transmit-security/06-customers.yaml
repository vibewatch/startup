- id: TU001
  title: Customer segmentation table
  description: Transmit Security segmented by primary buyer, end-user context, and quality of public proof.
  columns:
  - Segment
  - Buyer / user / payer
  - Core job
  - Public proof
  - Strategic value
  - Gap
  rows:
  - - Global banks
    - 'Buyer: digital identity, fraud, security, or customer-platform leaders; user: bank customers; payer: enterprise IT/security budget'
    - Passwordless login, fraud reduction, account recovery, orchestration across apps and channels
    - 'Strongest public proof: Citi, unnamed global bank, unnamed leading US bank, BRED'
    - Highest-value and most repeatable reference segment
    - No disclosed count of bank customers or banking share of ARR
  - - Insurers
    - 'Buyer: digital platform / IAM / security teams; user: policyholders and agents; payer: enterprise budget'
    - Secure policyholder login, onboarding, MFA modernization, compliance-heavy journeys
    - Named proof from NN, Cattolica, and Aflac
    - Shows fit for high-trust regulated CX with multi-channel users
    - No insurer cohort count, renewal data, or insurer revenue mix disclosed
  - - Retail / consumer-finance brands
    - 'Buyer: customer-platform or security team; user: shoppers / borrowers; payer: enterprise digital budget'
    - Low-friction authentication and fraud-aware account journeys
    - America’s Car-Mart case plus official retail references
    - Demonstrates utility outside pure banking
    - Named non-FSI proof is thin versus financial-services proof
  - - Large multi-app enterprises
    - 'Buyer: central identity architecture teams; user: external customers across many apps'
    - Unify fragmented authentication stacks and policy logic
    - Citi says it had several thousand apps; official briefs emphasize orchestration across channels
    - Supports land-and-expand from one journey into enterprise-wide architecture
    - No public module-attach or expansion-rate disclosure
  - - Passkey-forward enterprises
    - 'Buyer: security and CX teams modernizing login'
    - Replace passwords, hard tokens, and legacy MFA with passkeys and device biometrics
    - Global bank, BRED, and Aflac examples; BindID listed by FIDO Alliance
    - Clear wedge for measurable support-cost and CX improvements
    - No public conversion from passkey adoption into multi-module ARR
  - - Partner-assisted enterprises
    - 'Buyer: enterprises already on Microsoft identity stack; payer: same enterprise budget'
    - Procure Transmit through Microsoft-aligned passkey and orchestration programs
    - Microsoft-oriented Transmit blog cites committed-spend discounts and procurement savings
    - Channel can shorten sales cycles and increase reach
    - Partner-sourced pipeline, margin split, and renewal ownership are undisclosed
  notes: Segmentation is best supported by vertical, buyer function, and use case rather than by disclosed customer count or revenue band.
