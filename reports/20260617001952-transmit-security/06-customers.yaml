- id: TU004
  title: Customer-proof quality ladder
  description: How different classes of customer evidence should be weighted in diligence.
  columns:
  - Evidence class
  - What it includes here
  - Reliability for production proof
  - What it can support
  - What it cannot support
  rows:
  - - Production case study with metrics
    - Aflac, global bank PDF, leading U.S. bank, BRED, NN
    - High
    - Real deployment, specific workflow, quantified outcome, implied budget seriousness
    - Portfolio-wide customer count, renewal, or concentration
  - - Named customer quote / architecture talk
    - Citi video and Gartner-rollout discussion
    - Medium-high
    - Relationship depth, enterprise architecture problem, expansion intent
    - Audited ROI, deployment breadth across the whole logo, or retention
  - - Partner-oriented procurement narrative
    - Microsoft passkey / committed-spend article
    - Medium
    - Channel leverage, procurement friction reduction, platform positioning
    - Named customer deployment count or direct ARR impact
  - - Review-aggregator sentiment
    - PeerSpot, G2, TrustRadius, FeaturedCustomers
    - Medium
    - Implementation pain points, pricing friction, broad satisfaction direction
    - Representative retention metrics or verified top-account outcomes
  - - Sector / logo-style marketing claim
    - Official briefs saying top banks, insurers, retailers, and >$2T commerce
    - Low-medium
    - Target segment, ambition, and rough enterprise tier
    - Named deployment, production status, contract duration, or account concentration
  notes: This table provides the explicit production-versus-event-talk-versus-logo-only distinction requested for the chapter.
  claimRefs:
  - CU003
  - CU004
  - CU022
  - CU023
  - CU032
  - CU047
- id: TU005
  title: Retention / repeat usage / satisfaction and friction table
  description: What the public record does and does not show about durability.
  columns:
  - Lens
  - Public value
  - Evidence quality
  - What it suggests
  - Durability gap / diligence ask
  rows:
  - - Aflac passkey adoption
    - 32% adoption; 96% login success; no reported login failures
    - High
    - Users accepted a new auth method quickly and with little help burden
    - Request 6/12/24-month active usage, re-authentication rates, and module expansion after launch
  - - BRED support burden proxy
    - Lower support-call volume after 7-day BindID rollout
    - Medium
    - Transmit can reduce login friction for customer service teams
    - Request baseline versus post-launch support-ticket counts and renewal status
  - - Global bank support-cost proxy
    - Significant reduction in password-related call-center calls; tens of millions saved annually
    - High
    - Large enterprises can achieve meaningful operating leverage after passwordless migration
    - Request audited savings and contract economics rather than vendor-curated ranges
  - - Peer sentiment on support
    - Review sources are broadly positive on support and deployment quality
    - Medium
    - Customer satisfaction appears directionally good
    - Request renewal and reference-call data because review positivity is not retention
  - - Implementation burden
    - G2 and PeerSpot say integrations require expertise and application-specific rule-building
    - Medium
    - Expansion may work best in technically mature enterprises
    - Request professional-services mix, average implementation duration, and time-to-value by segment
  - - Pricing friction
    - PeerSpot and G2 say pricing is high / needs improvement; CyberSecurityO calls it premium priced
    - Medium
    - Procurement may be harder outside the highest-value regulated accounts
    - Request win/loss reasons, discount bands, and competitor displacement data
  - - Public NRR / GRR / churn / term disclosure
    - null
    - Low
    - These durability metrics are not publicly disclosed in retained sources
    - Request logo churn, gross and net retention, term length, and top-customer renewal schedule
  notes: Where the value is null, the metric is genuinely undisclosed rather than missing from authoring. This table substitutes for unavailable public cohort-retention disclosure.
