- id: TU003
  title: Named customer proof table
  description: Highest-signal named Transmit Security customer deployments with explicit evidence quality distinctions.
  columns:
  - Customer
  - Segment
  - Deployment / use case
  - Production vs pilot
  - Outcome / quote
  - Limitation
  enumerationScope:
    coverage: partial
    basis: Rows cover the strongest currently fetched named customer references with deployment details or quantified outcomes; Transmit does not publish a full customer roster or audited deployment list.
  rows:
  - - Citi
    - Global banking
    - Modular authentication platform across several thousand apps; passwordless rollout discussed at Gartner IAM
    - Production deployment with event-talk overlay
    - Citi leaders said the prior auth stack was fragmented and that Transmit could serve as a uniform platform; rollout discussed for 200M clients in 160 countries
    - Public proof is strong on architecture and relationship depth, but most detailed scale numbers sit in Transmit-curated materials rather than customer SEC filings
  - - BRED Banque Populaire
    - Retail banking
    - BindID passwordless login for payment keyring / accessible banking service
    - Production deployment
    - 7-day integration; no usernames, no passwords, no app download; bank cited lower support-call volume and fraud risk
    - No public retention, contract, or user-count disclosure
  - - Nationale-Nederlanden
    - Insurance / banking
    - Identity orchestration for compliant multi-channel CIAM journeys
    - Production deployment
    - NN said customer experience and adoption rates improved; case study cites 18M+ customers and KuppingerCole recognition
    - Outcome proof is qualitative on adoption and does not disclose direct ROI or renewal terms
  - - America's Car-Mart
    - Consumer finance / auto retail
    - Passwordless and MFA services supporting digital marketplace and financing journeys
    - Production deployment
    - Case study ties the rollout to omnichannel buying, financing approval, lower support requests, and reduced fraud
    - Public evidence is mainly vendor-authored and lacks quantified user-adoption data
  - - Aflac
    - Insurance
    - Passkey authentication for policyholder login
    - Production deployment
    - 32% adoption within days / first week, 96% login success, 265K+ enrollments, no reported login failures
    - The strongest metrics are still launch-phase rather than multi-year retention evidence
  notes: This enumeration intentionally excludes unnamed bank stories from the row set even when they are large, because the chapter must distinguish named proof from marketing-grade proof.
