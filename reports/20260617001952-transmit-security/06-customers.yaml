- id: durability-and-friction
  title: Durability, Satisfaction, and Procurement Friction
  tableRefs:
  - TU005
  body: 'Durability is where the public customer story becomes much weaker. Review platforms are generally positive on capability and customer support, and public case studies repeatedly emphasize lower call-center volume, fewer password resets, reduced fraud, and improved user experience. Aflac is the cleanest contemporary proof point, with 32% passkey adoption, 96% login success, and no reported login failures at the time of publication. Even so, Transmit does not disclose NRR, GRR, gross logo churn, standard contract length, renewal cadence, or retention by module. The downside evidence is also meaningful rather than trivial: PeerSpot and G2 reviewers say rule-building still feels application-specific, scaling depends on workflow complexity, pricing is high, and integrations demand expertise. TrustRadius adds smaller but notable complaints around update cadence and lost settings. These do not negate customer value, but they do imply that expansion and durability may depend on technically
    mature enterprise buyers rather than on a low-friction self-serve motion.'
  claimRefs:
  - CU020
  - CU024
  - CU025
  - CU026
  - CU027
  - CU028
  - CU029
  - CU030
  - CU040
  - CU044
  - CU048
- id: expansion-and-concentration
  title: Expansion Paths, Channel Dependence, and Concentration Risk
  tableRefs:
  - TU006
  body: 'The upside case is straightforward: Transmit can expand inside large regulated enterprises from login into orchestration, fraud, identity verification, recovery, call-center flows, and cross-channel security. The Microsoft partnership adds a concrete procurement wedge because committed cloud spend and partner discounts can make initial buying easier for enterprises already standardizing on Azure AD B2C or Entra External ID. The downside case is equally clear. Public proof is concentrated in a small set of large reference accounts, many of them banks or insurers, and the company still discloses neither customer count nor top-customer exposure. That leaves three underwriting risks unresolved: first, whether a few lighthouse accounts drive an outsized share of ARR; second, whether Microsoft and other partners influence procurement enough to weaken direct ownership of the customer relationship; and third, whether implementation complexity narrows the addressable base to organizations
    with large security and identity teams. Transmit looks capable of land-and-expand, but the public record still cannot separate breadth from concentration.'
  claimRefs:
  - CU017
  - CU031
  - CU032
  - CU033
  - CU034
  - CU048
