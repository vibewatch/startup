  - CU020
  - CU024
  - CU025
  - CU026
  - CU027
  - CU028
  - CU029
  - CU030
  - CU040
- id: TU006
  title: Expansion and concentration risk table
  description: Key expansion drivers and the unresolved concentration risks behind them.
  columns:
  - Expansion driver
  - Why it matters
  - Concentration / channel risk
  - Impact
  - Diligence path
  rows:
  - - Land from authentication into orchestration and fraud
    - Named cases often start with login or passwordless and then widen into broader journey control
    - Public sources do not quantify module attach or post-land ARR expansion
    - High
    - Request module penetration and attach-rate by cohort
  - - Microsoft-aligned procurement
    - Committed-spend discounts and Azure / Entra alignment can reduce buying friction
    - Partner influence may weaken direct ownership of procurement and renewal
    - High
    - Request partner-sourced ARR, margin, and renewal ownership
  - - FSI and insurance depth
    - Large regulated logos can support high ACV and strong references
    - Named proof is concentrated in banking and insurance, increasing vertical concentration risk
    - High
    - Request ARR by vertical and top 10 customers by revenue
  - - Passkey and passwordless wedge
    - Aflac, BRED, and the global bank show clear CX and support-cost benefits
    - Public evidence does not show whether passkey projects expand into broader platform spend consistently
    - Medium
    - Request conversion from passkey project to broader Mosaic adoption
  - - Fast implementation stories
    - BRED in 7 days and Aflac in ~2 months can speed initial deals
    - Review sources warn that rule-building and integration complexity can still slow larger enterprise programs
    - Medium
    - Request median deployment length and implementation resources by customer size
  - - Unnamed lighthouse banks
    - Huge unnamed bank stories prove capability at scale
    - They can overstate breadth if a few reference accounts drive the narrative and revenue base
    - High
    - Request named reference list, concentration schedule, and independent customer calls
  notes: Expansion upside is real, but the public record still cannot distinguish broad platform penetration from concentration in a handful of flagship regulated accounts.
  claimRefs:
  - CU010
  - CU017
  - CU031
  - CU032
  - CU033
  - CU034
