    - ~$6.9B transaction value
    - Shows continued PE willingness to own scaled identity assets.
    - Different product mix and 2022 market backdrop.
  - - SailPoint re-IPO
    - February 2025 public return
    - ~$12.8B market value after $1.38B IPO
    - Shows the valuation upside available once identity vendors disclose public-grade metrics.
