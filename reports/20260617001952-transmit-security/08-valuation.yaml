tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Evidence basis
  - Decision implication
  rows:
  - - Recommendation
    - Research-more for new money
    - Commercial proof is real, but public valuation support is still too weak to underwrite a fresh entry confidently.
    - Do not invest off the 2021 mark without management disclosure or a materially lower price.
  - - Confidence
    - Medium
    - Evidence is strong on product proof and weak on current financial disclosure.
    - Confidence can improve quickly if management provides audited or board-level metrics.
  - - Risk rating
    - High
    - 'Key underwriting inputs remain undisclosed: ARR, NRR, gross margin, burn, runway, and preference stack.'
    - Treat the investment as high-uncertainty until the data room closes those gaps.
  - - Valuation stance
    - Expensive
    - Public comp and revenue-estimate lenses leave the old private mark well above currently evidenced support.
    - Require either much higher disclosed revenue or a discount to the historical mark.
  - - Entry discipline
    - Supportable only if recurring revenue is roughly $150M+ under premium multiples, or if entry price resets lower
    - A 12x-15x premium lens still needs about $147M-$180M revenue to justify the old range.
    - Use thresholds, not headline brand quality, to frame negotiations.
  - - Existing-holder read-through
    - Hold / monitor if no forced-liquidity need
    - Product proof and customer quality keep upside alive, but disclosure still constrains exit certainty.
    - Push for disclosure before marking the asset at premium public-multiple assumptions.
  notes: This table is a price-sensitive recommendation, not a generic company-quality score. Thresholds are derived from public comp multiples and should be updated with management data-room metrics.
