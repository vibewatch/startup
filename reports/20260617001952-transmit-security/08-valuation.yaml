- id: comparable-lenses
  title: Comparable lenses and market-multiple reality
  body: 'The best public anchors are not private database marks but disclosed identity comparables. Okta''s June 2026 public data points to roughly 6.1x EV/revenue on about $3 billion of revenue and 11% year-over-year growth. CyberArk is richer, with $1.361 billion of 2025 revenue, $1.44 billion of ARR, and about a $20.6 billion market capitalization in June 2026; even using market cap rather than enterprise value, that implies a mid-teens revenue multiple and reflects a premium security platform profile rather than a normal CIAM vendor. Sector reports then widen the lens: Windsor Drake''s 2026 work places median public cybersecurity revenue multiples near 7.8x and top-performing cyber names near 11.9x, while its IAM report highlights SailPoint around a roughly 10x public-identity reference point and Okta around a mid-single-digit multiple.


    Transmit Security''s own public revenue evidence does not fit comfortably inside those bands. Using the retained third-party range of $33.4 million to more than $100 million, a $2.2 billion mark implies roughly 22x to 66x revenue, and a $2.7 billion mark implies roughly 27x to 81x. Those levels are above current public CIAM and even above many premium software names unless hidden revenue is far higher than public estimates suggest. The right read-through is not that Transmit lacks strategic value, but that the burden of proof now sits with management to show substantially more scale than the public record currently supports.'
