  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: later-financing-and-cap-table
    missingEvidence: Any post-2021 debt, secondary pricing, 409A marks, and the full liquidation preference stack.
    whyItMatters: A fresh investor cannot tell whether the headline historical mark still represents current economic value without seeing updated price discovery and preference seniority.
    diligencePath: Request cap table, charter, side letters, any SAFE/note schedules, and the most recent board or 409A valuation memo.
    relatedQuestionRefs:
    - QV003
    - QV025
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: blocking
    topic: current-arr-and-revenue
    missingEvidence: A current ARR, GAAP revenue, and bookings bridge by quarter.
    whyItMatters: Public estimates span too wide a band to judge whether the 2021 mark is stretched or supportable.
    diligencePath: Request management accounts, board reporting, and a revenue bridge from 2024 through the latest quarter.
    relatedQuestionRefs:
    - QV005
    relatedTableRefs:
    - TV006
  - type: missing-source
    severity: material
    topic: ipo-readiness
    missingEvidence: Any filing prep timeline, banker engagement, audit-readiness plan, or strategic-process materials.
    whyItMatters: Exit readiness is a core part of underwriting premium private marks in identity software.
    diligencePath: Request board materials, audit status, banker list, and an IPO-or-sale readiness workback plan.
    relatedQuestionRefs:
    - QV022
    relatedTableRefs:
    - TV005
    - TV006
  - type: missing-source
    severity: material
    topic: software-economics
    missingEvidence: Current NRR, GRR, gross margin by module, services mix, and CAC / payback data.
    whyItMatters: Without those metrics, investors cannot know whether premium list pricing translates into premium software economics.
    diligencePath: Request cohort retention tables, gross-margin waterfalls, services attach, and sales-efficiency reporting.
    relatedQuestionRefs:
    - QV023
    - QV027
    - QV030
    relatedTableRefs:
    - TV001
    - TV006
  - type: conflicting-data
    severity: material
    topic: public-scale-dispersion
    missingEvidence: A management-signed explanation reconciling the gap between $33.4M revenue estimates and >$100M ARR-like claims.
    whyItMatters: The current valuation call is highly sensitive to whether the true scale is closer to the low or high end of the public estimate band.
    diligencePath: Request the company revenue bridge and reconcile third-party estimates against audited or board-level numbers.
    relatedQuestionRefs:
    - QV004
    - QV021
    relatedTableRefs:
    - TV003
    - TV004
