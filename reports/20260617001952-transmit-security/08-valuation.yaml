- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold or event
  - Why it matters
  - Action implication
  rows:
  - - Revenue support fails
    - Verified recurring revenue lands materially below ~$100M or growth quality is weak.
    - The historical mark becomes impossible to defend with current public multiple bands.
    - Do not underwrite near the old private mark.
  - - Adverse price discovery
    - A down-round, discounted secondary, or structured financing resets value below the 2021 anchor.
    - Fresh price discovery would supersede stale historical narratives.
    - Re-cut valuation off the new observed transaction.
  - - Cap-table overhang
    - Preference stack, debt, or liquidation waterfall is more punitive than expected.
    - Headline valuation may not translate into common-equivalent economics.
    - Model fully diluted and liquidation outcomes before investing.
  - - Implementation burden worsens
    - Independent customer evidence shows slow scaling, poor expansion, or integration fatigue.
    - Premium ACV is less attractive if deployment intensity suppresses margin and retention.
    - Downgrade growth-quality assumptions and comp multiple.
  - - No exit path evidence
    - No filing progress, banker process, or strategic interest emerges while cash needs rise.
    - Holding period and liquidity risk increase while valuation support weakens.
    - Shift from monitorable hold to avoid / mark-down stance.
  notes: These are diligence-stage kill triggers, not operating KPIs alone. Any one of them can invalidate the premium-valuation thesis for a new investor.
  claimRefs:
  - CV019
  - CV021
  - CV037
  - CV038
  - CV040
  - CV041
  - CV042
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Diligence path
  rows:
  - - Current ARR and revenue bridge
    - Monthly or quarterly recurring revenue, GAAP revenue, and bookings bridge since 2024.
    - Needed to replace third-party estimate ranges with actual scale.
    - Request board deck, finance pack, and latest management accounts.
  - - Retention quality
    - NRR, GRR, cohort expansion, and churn by customer segment.
    - Premium identity multiples require durable expansion, not just logo quality.
    - Request customer cohort tables and top-20 account histories.
  - - Gross margin by product and services
    - Gross margin split for CIAM, fraud, verification, and implementation/services.
    - Determines whether six-figure pricing translates into software-like economics.
    - Request gross margin waterfall and hosted-cost / third-party-cost detail.
  - - Liquidity and runway
    - Cash on hand, burn, runway, debt, and financing triggers.
    - A large 2021 raise does not prove present balance-sheet safety.
    - Request cash bridge, debt schedule, and downside operating plan.
  - - Cap table and preferences
    - Preferred stack, liquidation preferences, secondaries, SAFEs/notes, and employee-option overhang.
    - Headline valuation can overstate true value to a new investor or common-equivalent holder.
    - Request cap table, charter, side letters, and most recent 409A / board mark.
  - - Exit process readiness
    - Banker materials, audit readiness, board discussions, and any IPO / strategic-outreach status.
    - Without an exit path, a premium private mark is harder to monetize.
    - Request roadmap to filing readiness or strategic-process preparation.
  notes: Each ask is a direct blocker to moving the recommendation from research-more toward buy or even neutral track with high confidence.
