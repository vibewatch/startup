- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Explicit assumptions
  - Valuation logic
  - Probability signal
  - Read-through
  rows:
  - - Bull
    - Management proves recurring revenue at or above roughly $180M, solid retention, and credible IPO or strategic-exit readiness.
    - At 12x-15x revenue, the old $2.2B-$2.7B range becomes supportable and modest upside is possible.
    - Low without fresh disclosure.
    - The 2021 mark can hold only if hidden scale is materially above current public estimates.
  - - Base
    - Management proves revenue above the current public upper band but below clear premium thresholds, with mixed transparency on margins and retention.
    - At roughly 7.8x-10.2x lenses, fair value likely stays below the old private range unless scale is far higher than public estimates suggest.
    - Most likely absent data-room evidence.
    - New money should negotiate a discount or defer.
  - - Bear
    - True scale is closer to the low-end public estimate, or a down-round / adverse secondary resets price discovery.
    - At roughly 6.1x-7.8x on $33.4M-$60M scale, value compresses into the low hundreds of millions.
    - Material risk if disclosure disappoints.
    - The stale 2021 mark would be economically misleading for new buyers.
  notes: Scenarios are threshold-based because current ARR and margin data are not publicly disclosed. They are designed to bracket what disclosure would need to show, not to invent hidden metrics.
