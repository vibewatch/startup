company:
  name: Transmit Security
chapter:
  number: 8
  title: Valuation
  summary: 'Transmit Security enters the 2026 valuation chapter with strong commercial proof but weak price support. The last disclosed financing remains the June 2021 $543 million Series A, framed at roughly a $2.2 billion pre-money valuation, while third-party current-scale signals still span only $33.4 million of 2025 revenue at GetLatka to more than $100 million of ARR/revenue-like scale at SIG. June 2026 public identity benchmarks are far lower: Okta trades near 6.1x EV/revenue, sector reports place broad cyber medians around 7.8x and top-performer IAM/cyber bands around 10x-12x, and even a premium 15x strategic lens would require roughly $147 million to $180 million of recurring revenue to justify the old $2.2 billion to $2.7 billion private marks. The evidence therefore supports a research-more recommendation for new money, medium confidence, high risk, and an expensive valuation stance until management discloses current ARR, retention, gross margin, cash runway, and cap-table overhang.'
sections:
- id: thesis-recommendation
  title: Investment thesis, anti-thesis, and recommendation
  body: 'Transmit Security still has a real investment thesis. Public pricing shows it is not selling a commodity developer widget but an enterprise identity platform that starts at six-figure annual contract levels. Customer proof is also credible: the company publishes a global-bank deployment spanning 200 million customers and seven apps, a leading U.S. bank case citing 1300% ROI and a 98% reduction in new-account fraud, and an Aflac passkey program reporting 32% adoption and 96% login success within roughly two months. Microsoft partnership language adds another positive clue because committed-spend discounts and procurement leverage can shorten enterprise buying cycles for regulated customers.


    The anti-thesis is that commercial proof has not translated into public valuation transparency. Independent sources still disagree sharply on current scale, ranging from $33.4 million of 2025 revenue to more than $100 million of ARR/revenue-like scale, while no retained source discloses net retention, gross margin, burn, cash, debt, or liquidation preferences. Independent reviews also warn that the platform can be complex to scale and lacks some mail/SMS integration flexibility. Taken together, the evidence supports a research-more call for new money, medium confidence, a high risk rating, and an expensive valuation stance at any mark that still leans on the 2021 round without fresh disclosure.'
