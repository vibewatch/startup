- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Dimension
  - Thesis
  - Anti-thesis
  - What changes the view
  rows:
  - - Commercial proof
    - Large-bank and insurer references show production relevance at meaningful scale.
    - Case studies prove usefulness, not the current revenue base or margin quality.
    - Disclose top-customer ARR, deployment count, and renewal expansion rates.
  - - Pricing power
    - Public list pricing starts at six-figure annual contract levels, suggesting premium ACVs.
    - List prices do not show realized discounting, services mix, or gross margin by module.
    - Provide standard discount bands and services attach rates.
  - - Go-to-market leverage
    - Microsoft committed-spend and partner-discount language suggests procurement leverage in regulated enterprise sales.
    - Integration-heavy rollouts can still consume costly solution-engineering and onboarding resources.
    - Show CAC payback, implementation duration, and partner-sourced bookings mix.
  - - Independent customer feedback
    - Reviews are broadly positive and indicate enterprise fit.
    - Independent reviewers still cite mail/SMS integration gaps, application-specific rule building, and scaling complexity.
    - Show product roadmap closure on integration gaps and implementation burden.
  - - Valuation support
    - A premium identity asset can exit well, as SailPoint's take-private and re-IPO show.
    - Transmit lacks the disclosed revenue and filing-grade transparency that made SailPoint marketable.
    - Disclose ARR, retention, margins, and exit-process readiness.
  notes: The thesis is commercially credible, but the anti-thesis remains stronger on price because the public record still lacks current-scale and capital-structure disclosure.
