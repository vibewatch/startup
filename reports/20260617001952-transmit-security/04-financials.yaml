- id: cost-structure-margin-drivers
  title: Cost Structure and Gross-Margin Drivers
  body: |
    The cost structure is only inferable, but the direction is clear. The core CIAM and orchestration modules look software-like, yet Transmit is not selling a minimalist authentication API alone. Its product set layers fraud scoring, behavioral analytics, identity verification, and active-active multi-cloud resilience on top of core login flows. Each of those features can add hosting, model-inference, telemetry, or third-party verification expense that a pure passwordless toolkit would not bear. Public list pricing for identity verification is explicitly per 100,000 ID checks, which reinforces the idea that at least part of the revenue model carries direct event-linked delivery cost.

    The best public benchmark in the retained evidence is Okta's 2026 10-K, which shows 77% total gross margin, 80% subscription gross margin, and sales and marketing equal to 35% of revenue, with labor and third-party hosting still material inside cost of subscription revenue. That does not prove Transmit's margin structure, but it does frame a plausible software envelope while reminding us that cloud identity businesses still spend heavily on both delivery and go-to-market.
  claimRefs:
  - CI018
  - CI034
  - CI035
  - CI036
  - CI037
  figureRefs:
  - FI004
- id: traction-vs-private-gaps
  title: Public Traction Versus Private-Metric Gaps
  body: |
    Public traction is easier to prove than public financials. Named or referenced customers in news and case-study materials include large financial institutions and insurers; FeaturedCustomers says the platform supports brands responsible for more than $2 trillion in annual commerce; Business Wire says Transmit is trusted by seven of the top ten U.S. banks; and public customer stories show production usage at extreme scale. The challenge is that these traction signals do not reconcile to a dependable revenue base. Retained databases and estimate sites range from $33.4 million revenue to $60.8 million revenue to more than $100 million ARR, while headcount estimates range from 308 to 368.

    That spread is too wide for clean underwriting, and there is no audited financial statement to anchor the model. SEC EDGAR provides no obvious public-issuer trail for Transmit itself, and retained company, review, and database sources do not disclose gross margin, burn, runway, NRR, customer concentration, or module mix. Public traction therefore supports commercial relevance, but not precision on current scale or efficiency.
