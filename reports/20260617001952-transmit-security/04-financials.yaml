company:
  name: Transmit Security
chapter:
  number: 4
  title: Financials
  summary: Transmit Security now discloses enough enterprise list pricing and customer-outcome evidence to show a credible high-ACV revenue model, but public financial visibility remains poor. Third-party estimates place current scale anywhere from $33.4M to over $100M of revenue/ARR and 308 to 368 employees, while no retained source discloses actual gross margin, cash, burn, or runway. The company looks commercially real and historically well-funded after its $543M 2021 Series A, yet financing dependency cannot be underwritten without management data-room disclosure.
sections:
- id: revenue-pricing
  title: Revenue Streams, Pricing, and Revenue Quality
  body: |
    Transmit Security now shows enough pricing detail to establish the rough revenue architecture even though it still withholds realized pricing, discounting, and module mix. The company is clearly selling a high-ticket enterprise platform rather than a self-serve developer SKU: list pricing starts at $200,000 for the full Mosaic suite, $100,000 for the identity-only SKU, $100,000 for fraud and threat detection, and $50,000 for identity verification, with billing tied to MAUs, login volumes, or ID-check counts. That structure suggests recurring subscription revenue, but it also implies that realized ACV can vary materially by deployment architecture and usage profile.

    What remains unsupported is the mix between core CIAM subscriptions, fraud modules, identity verification, and any paid implementation or support services. Public sources do not disclose what percentage of bookings comes from the largest-bank deployments versus smaller enterprise accounts, whether Microsoft or other partners influence take rates, or how much revenue is professional services versus software. Financial underwriting can therefore establish list-price quality, but not realized revenue quality.
  claimRefs:
