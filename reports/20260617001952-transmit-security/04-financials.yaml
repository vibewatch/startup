- id: capital-adequacy
  title: Capital Adequacy and Financing Dependency
  body: |
    Capital adequacy is the hardest part of this chapter to underwrite from public evidence. The historical fact pattern is strong: Transmit raised $543 million in a single 2021 Series A round led by Insight Partners and General Atlantic, after operating as a bootstrapped company. That is a very large capital base for a private identity vendor, and retained news plus Tracxn do not show any later disclosed financing round. Those facts argue against an obviously fragile balance sheet.

    However, they do not answer the forward question investors actually need: how much of that capital is left, what the current burn profile is, whether the company is free-cash-flow positive, and what trigger would force a next round. No retained public source gives cash on hand, monthly burn, runway months, debt, or secondary-liquidity details. The practical conclusion is that Transmit does not look publicly distressed, but financing dependency after 2021 is still unresolved until management provides a current cash bridge and forecast.
  claimRefs:
  - CI020
  - CI021
  - CI023
  - CI039
  - CI040
  - CI042
  tableRefs:
  - TI004
- id: financial-verdict
  title: Financial Verdict
  body: |
    Transmit Security's public financial picture is attractive in quality but weak in completeness. The attractive part is straightforward: enterprise list pricing is real, customer proof at very large banks and insurers is credible, and case studies show measurable economic outcomes that should support premium ACVs and expansion selling. The weak part is equally important: public evidence does not let an investor size current revenue, mix, gross margin, CAC, net retention, burn, or runway with confidence.

    Accordingly, the financial verdict is conditional rather than bullish or bearish. Revenue quality appears better than an early product-market-fit story because the company is already serving regulated enterprises at scale, yet disclosure quality is materially below what is needed for underwriting. This chapter clears a commercial-plausibility bar, but not a finance-readiness bar. Management data-room disclosure on revenue mix, gross margin by module, cash balance, burn, and next-round triggers is a hard diligence blocker.
  claimRefs:
  - CI028
  - CI029
  - CI039
  - CI040
  - CI041
