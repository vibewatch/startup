  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: Revenue split across identity, fraud, identity verification, services, and channel-assisted deals.
    whyItMatters: Without revenue mix, list prices cannot be converted into a view on realized ACV quality or blended gross margin.
    diligencePath: Request monthly revenue by product line, services attach, and top-20 customer concentration from the finance data room.
    relatedQuestionRefs:
    - QI018
    - QI025
    relatedTableRefs:
    - TI001
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: gross-margin
    missingEvidence: Company-level and module-level gross margin, including services margin.
    whyItMatters: Gross margin is the core test of software revenue quality and is necessary to judge whether fraud, verification, and uptime commitments dilute software economics.
    diligencePath: Request monthly gross margin by module, cost-of-revenue components, and any third-party verification or hosting pass-through terms.
    relatedQuestionRefs:
    - QI019
    - QI025
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: CAC, sales payback, net retention, quota attainment, and channel mix.
    whyItMatters: Case studies suggest strong ROI, but underwriting needs actual customer-acquisition economics and expansion quality rather than marketing outcomes alone.
    diligencePath: Request CAC by cohort, payback by segment, net dollar retention, and channel-assisted bookings split.
    relatedQuestionRefs:
    - QI020
    - QI025
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: cash-and-runway
    missingEvidence: Current cash balance, gross burn, net burn, and runway months under base and downside plans.
    whyItMatters: The 2021 funding round is large, but capital adequacy cannot be judged from stale fundraising alone.
    diligencePath: Request a current cash bridge, 13-week cash forecast, FY2026 operating plan, and management runway assumptions.
    relatedQuestionRefs:
    - QI022
    - QI023
    - QI025
    relatedTableRefs:
    - TI004
    - TI005
  - type: missing-source
    severity: material
    topic: next-round-trigger
    missingEvidence: Any public description of debt, secondary liquidity, covenant constraints, or the trigger for a next financing event.
    whyItMatters: A company can look commercially strong and still need capital sooner than expected if cash conversion, services intensity, or growth targets are misaligned.
    diligencePath: Request board materials covering financing strategy, debt schedules, secondaries, and downside cash scenarios since the 2021 round.
    relatedQuestionRefs:
    - QI023
    - QI025
    relatedTableRefs:
    - TI004
    - TI005
  - type: conflicting-data
    severity: material
    topic: scale-estimates
    missingEvidence: A management-confirmed revenue, ARR, and headcount snapshot that reconciles conflicting public databases.
    whyItMatters: Current public estimates span too wide a range to anchor valuation, productivity, or runway models.
    diligencePath: Request a dated KPI sheet with ARR, GAAP revenue, employees, and bookings plus definitions for each metric.
    relatedQuestionRefs:
    - QI008
    - QI009
    - QI024
    relatedTableRefs:
    - TI003
    - TI005
