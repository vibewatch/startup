- id: gtm-sales-efficiency
  title: GTM Motion and Sales-Efficiency Proxies
  body: |
    Transmit's public evidence points to a direct-enterprise, solution-engineering-heavy go-to-market motion with selective partner leverage. The strongest proof is not broad customer-count disclosure but a narrow set of very large deployments and reference stories: a global bank spanning 200 million clients and seven apps, a leading U.S. bank citing 98% fraud reduction and one-month time to value, and Aflac reporting 32% passkey adoption, 96% login success, and a roughly two-month launch. Those are strong proof points for expansion revenue and executive selling, but they are not classic SaaS efficiency metrics.

    The Microsoft partnership article adds a procurement clue that matters financially: Transmit is trying to ride committed cloud spend and partner discounts, which can compress sales friction at the top of the funnel for regulated enterprises. At the same time, reviews repeatedly say the product takes expertise to integrate, rule centrally, and scale. That combination usually means larger initial deal sizes and strong ROI stories, but also expensive pre-sales, onboarding, and customer-success motions that public sources never quantify with CAC or payback.
  claimRefs:
