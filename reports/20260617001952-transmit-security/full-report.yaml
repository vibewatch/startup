      - number: '3.3'
        title: Pricing, distribution, and switching
        blocks:
          - type: paragraph
            body: >-
              Commercial structure is one of the clearest competitive divides. Transmit, Ping, and enterprise Okta
              customer-identity packages remain quote-led, while Microsoft, Auth0, Descope, and Stytch all publish at
              least some usage or free-tier anchors. Microsoft is the most strategically important of these because its
              first-50,000-MAU free tier sits inside a larger bundle story: buyers must think in terms of incremental
              Entra cost within Azure or Microsoft 365, not just list price. VendorBenchmark explicitly argues that this
              changes the negotiation frame for every standalone identity vendor. Okta still matters because its
              identity footprint and ecosystem make it the default benchmark in many enterprises, but its packaging also
              creates module-creep and renewal-pressure risk. Auth0, Descope, and Stytch are more transparent and more
              developer-friendly, which lowers evaluation friction even when enterprise discounts still matter.


              Distribution and switching cut the other way. Ping’s reach into more than half of the Fortune 100 and
              Microsoft’s installed-base gravity give both vendors powerful account-level entry points. CyberArk brings
              the same risk from an adjacent identity-security direction. Public evidence for Transmit’s switching costs
              is directional rather than conclusive: the unified runtime should create stickiness once fraud,
              verification, and CIAM are intertwined, but public sources do not provide renewal cohorts or attach-rate
              evidence. That makes multi-homing a real base case. Buyers can use point tools, vendor-agnostic
              orchestration, or self-hosted substitutes to keep negotiating leverage, especially when their workload
              does not justify paying a premium for fraud-aware orchestration.
