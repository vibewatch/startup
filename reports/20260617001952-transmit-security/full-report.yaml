            body: >-
              The trust story is stronger on control categories than on full transparency. On the positive side, the
              legal and standards evidence is real. Transmit publishes a privacy statement that clearly differentiates
              when it acts as processor versus controller, and its SLA describes change-management procedures, emergency
              maintenance, and support coverage in enterprise terms. The company's passkey narrative also lines up with
              external standards: FIDO, W3C, passkeys.dev, Microsoft, and NIST all describe the same phishing-resistant,
              public-key-credential model that Transmit is building around. This does not prove every implementation
              detail, but it does show the product is aligned to current authentication doctrine rather than inventing a
              proprietary standard.


