            title: Liability caps leave a large share of identity-event downside with the customer
            body: >-
              The public contracts cap liability to roughly the preceding twelve months of fees even though identity
              vendors can sit inside fraud, outage, and privacy events whose economic impact is far larger. That does
              not make the product weak, but it does mean underwriting should assume a meaningful gap between platform
              value and recoverable damages. Investors and buyers should ask what insurance, indemnity, and
              customer-side controls fill that gap before treating the contract as a complete risk transfer tool.
