  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold or event
      - Why it matters
      - Action implication
    rows:
      - - Revenue support fails
        - Verified recurring revenue lands materially below ~$100M or growth quality is weak.
        - The historical mark becomes impossible to defend with current public multiple bands.
        - Do not underwrite near the old private mark.
      - - Adverse price discovery
        - A down-round, discounted secondary, or structured financing resets value below the 2021 anchor.
        - Fresh price discovery would supersede stale historical narratives.
        - Re-cut valuation off the new observed transaction.
      - - Cap-table overhang
        - Preference stack, debt, or liquidation waterfall is more punitive than expected.
        - Headline valuation may not translate into common-equivalent economics.
        - Model fully diluted and liquidation outcomes before investing.
      - - Implementation burden worsens
        - Independent customer evidence shows slow scaling, poor expansion, or integration fatigue.
        - Premium ACV is less attractive if deployment intensity suppresses margin and retention.
        - Downgrade growth-quality assumptions and comp multiple.
      - - No exit path evidence
        - No filing progress, banker process, or strategic interest emerges while cash needs rise.
        - Holding period and liquidity risk increase while valuation support weakens.
        - Shift from monitorable hold to avoid / mark-down stance.
    notes: >-
      These are diligence-stage kill triggers, not operating KPIs alone. Any one of them can invalidate the
      premium-valuation thesis for a new investor.
