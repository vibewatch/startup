      - number: '6.4'
        title: Durability, Satisfaction, and Procurement Friction
        blocks:
          - type: paragraph
            body: >-
              Durability is where the public customer story becomes much weaker. Review platforms are generally positive
              on capability and customer support, and public case studies repeatedly emphasize lower call-center volume,
              fewer password resets, reduced fraud, and improved user experience. Aflac is the cleanest contemporary
              proof point, with 32% passkey adoption, 96% login success, and no reported login failures at the time of
              publication. Even so, Transmit does not disclose NRR, GRR, gross logo churn, standard contract length,
              renewal cadence, or retention by module. The downside evidence is also meaningful rather than trivial:
              PeerSpot and G2 reviewers say rule-building still feels application-specific, scaling depends on workflow
              complexity, pricing is high, and integrations demand expertise. TrustRadius adds smaller but notable
              complaints around update cadence and lost settings. These do not negate customer value, but they do imply
              that expansion and durability may depend on technically mature enterprise buyers rather than on a
              low-friction self-serve motion.
