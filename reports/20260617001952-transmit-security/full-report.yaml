      - number: '6.5'
        title: Expansion Paths, Channel Dependence, and Concentration Risk
        blocks:
          - type: paragraph
            body: >-
              The upside case is straightforward: Transmit can expand inside large regulated enterprises from login into
              orchestration, fraud, identity verification, recovery, call-center flows, and cross-channel security. The
              Microsoft partnership adds a concrete procurement wedge because committed cloud spend and partner
              discounts can make initial buying easier for enterprises already standardizing on Azure AD B2C or Entra
              External ID. The downside case is equally clear. Public proof is concentrated in a small set of large
              reference accounts, many of them banks or insurers, and the company still discloses neither customer count
              nor top-customer exposure. That leaves three underwriting risks unresolved: first, whether a few
              lighthouse accounts drive an outsized share of ARR; second, whether Microsoft and other partners influence
              procurement enough to weaken direct ownership of the customer relationship; and third, whether
              implementation complexity narrows the addressable base to organizations with large security and identity
              teams. Transmit looks capable of land-and-expand, but the public record still cannot separate breadth from
              concentration.
