    title: Valuation / return range
    type: range
    layout: wide
    summary: >-
      Public evidence creates a wide band between implied multiples and the revenue thresholds needed to justify
      historical private marks.
    data:
      items:
        - label: $2.2B mark on public revenue band
          low: 22
          high: 65.9
          unit: x revenue
          note: Implied multiple on $100M high-end and $33.4M low-end public revenue signals.
        - label: $2.7B mark on public revenue band
          low: 27
          high: 80.8
          unit: x revenue
          note: Implied multiple on the same public revenue band.
        - label: Revenue needed for $2.2B at 6.1x-10.2x
          low: 215.7
          high: 360.7
          unit: USDm revenue
          note: Support range across premium identity and mature public CIAM multiples.
        - label: Revenue needed for $2.7B at 6.1x-10.2x
          low: 264.7
          high: 442.6
          unit: USDm revenue
          note: Higher historical mark requires even more hidden scale.
    approximationNotes: >-
      Low/high values are deliberate ranges derived from third-party public revenue signals and public comp multiples;
      they should not be mistaken for disclosed company guidance.
