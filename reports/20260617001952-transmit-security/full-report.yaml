      - number: '7.6'
        title: Mitigations, monitoring indicators, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              There are real mitigants here, and they matter. Transmit publishes a serious control stack: a 99.99%
              production availability target, a one-hour severity-one response objective, audit rights in the DPA,
              formal breach-notification duties, multi-cloud continuity claims, and concrete data-return or deletion
              provisions. The Microsoft and CISA materials also show that the company is selling into a directionally
              favorable architecture shift toward phishing-resistant MFA rather than defending legacy SMS or push flows.
              But the underwriting bar should remain explicit. Investors should monitor whether the Microsoft channel
              remains an accelerator rather than a chokepoint, whether customer proofs extend beyond a handful of
              flagship banks, whether biometric and retention practices stay tightly governed, and whether reviewer
              complaints around complexity start to show up in slower launches or weaker reference quality. Thesis-break
              triggers should be concrete: a material privacy or safeguards-related enforcement event, repeated
              inability to hit the practical 99.99% experience because exclusions or dependencies dominate, visible
              de-prioritization by Microsoft, a flagship-bank defection or failure to renew a major program, or evidence
              that premium pricing no longer offsets the deployment and support burden required to make the platform
              work in production.
