          - type: callout
            title: New money should wait for disclosure or a lower price
            body: >-
              The evidence does not say Transmit lacks value; it says the current public record cannot justify paying on
              the old private mark. A fresh investor should require verified ARR, retention, margins, liquidity, and
              cap-table detail before underwriting near that price.
            calloutType: recommendation
