      - number: '7.2'
        title: Operational reliability, security execution, and control-plane complexity
        blocks:
          - type: paragraph
            body: >-
              The company's product promise is operationally ambitious. Transmit is not selling only a login widget; it
              is claiming orchestration, passkeys, fraud prevention, identity verification, device intelligence, and
              adaptive decisioning across the entire customer journey. That breadth creates real upside, but it also
              widens the failure surface. The Microsoft marketplace pages explicitly acknowledge that passkey programs
              still have vulnerabilities during registration, account recovery, lost-device scenarios, and insufficient
              step-up authentication. Microsoft Learn also makes clear that the best-known fraud and passkey
              integrations require Azure AD B2C custom policies and a dedicated Transmit tenant, which pushes
              deployments toward specialist implementation work rather than pure turnkey SaaS. The published SLA is
              respectable at 99.99% target availability with a one-hour severity-one response objective, but the
              exclusions matter: third-party services, customer systems, customizations, trials, and POCs sit outside
              the cleanest uptime promise. Reviewer evidence reinforces the same operational theme from the other side:
              rule building can become application-specific, scaling gets tricky as workflows grow more complex, and
              non-technical usability still needs work. For a platform sold into large banks, these are not cosmetic
              concerns; they are deployment-friction and operational-burden risks.
