  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, privacy, and contract-surface risk
        blocks:
          - type: paragraph
            body: >-
              Transmit Security's highest hard-to-insure risk is not simple feature competition; it is the combination
              of biometric processing, heavily regulated financial-institution customers, and contract terms that leave
              a large portion of downside outside the vendor's liability envelope. The privacy statement confirms that
              users can upload government IDs and selfies and that Transmit processes biometric identifiers derived from
              those images. The DPA then shows how much sensitive data can flow through the stack by default, including
              device information, ID-document details, selfie photos, date of birth, and network or interaction data,
              while default retention remains ninety days unless the customer chooses otherwise. That is manageable when
              customers configure governance tightly, but it is risky when implementations drift, retention expands, or
              fallback methods introduce more data collection than originally assumed. Regulatory expectations are
              moving too: the FTC expects financial-institution customers to contractually monitor service providers and
              report qualifying breaches within thirty days, while EBA and EDPB materials show that SCA and biometric
              handling are still evolving rather than settled. Contractually, recovery is capped to roughly twelve
              months of paid fees, which is a clear mismatch against the size of fraud, outage, or privacy-loss
              scenarios that identity vendors can sit inside.
            claimRefs:
