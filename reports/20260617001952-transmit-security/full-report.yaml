        - The 2021 mark can hold only if hidden scale is materially above current public estimates.
      - - Base
        - >-
          Management proves revenue above the current public upper band but below clear premium thresholds, with mixed
          transparency on margins and retention.
        - >-
          At roughly 7.8x-10.2x lenses, fair value likely stays below the old private range unless scale is far higher
          than public estimates suggest.
        - Most likely absent data-room evidence.
        - New money should negotiate a discount or defer.
      - - Bear
