  - id: FU003
    title: Public-proof maturity matrix
    type: matrix
    layout: wide
    summary: >-
      The matrix compares proof maturity across named accounts and also highlights how breadth disclosure remains weaker
      than deployment quality.
    data:
      columns:
        - Deployment maturity
        - Outcome specificity
        - Retention visibility
        - Breadth signal
      rows:
        - label: Citi
          values:
            - label: high
              tone: positive
              detail: Named enterprise relationship with customer executive quotes and long-term rollout discussion.
            - label: medium
              tone: neutral
              detail: Strong architecture context, but fewer audited commercial metrics than Aflac.
            - label: low
              tone: warning
              detail: No public renewal, term, or spend data.
            - label: medium
              tone: neutral
              detail: Large-scale reference, but one logo does not reveal customer-base breadth.
        - label: BRED
          values:
            - label: high
              tone: positive
              detail: Explicit production rollout with 7-day integration and login design details.
            - label: medium
              tone: positive
              detail: Support-call and fraud-risk improvements are clear but not fully quantified.
            - label: low
              tone: warning
              detail: No public retention or contract data.
            - label: low
              tone: neutral
              detail: One smaller named bank does not prove portfolio breadth alone.
        - label: NN
          values:
            - label: high
              tone: positive
              detail: Production orchestration deployment in a large insurer/bank context.
            - label: medium
              tone: positive
              detail: Improved adoption and engagement are claimed, but ROI is qualitative.
            - label: low
              tone: warning
              detail: No public renewal or ACV disclosures.
            - label: medium
              tone: neutral
              detail: Confirms insurer relevance beyond one geography.
        - label: America's Car-Mart
          values:
            - label: medium
              tone: positive
              detail: Live omnichannel transformation use case is described, though mainly by the vendor.
            - label: medium
              tone: neutral
              detail: Fraud reduction and lower support load are directionally clear but not deeply quantified.
            - label: low
              tone: warning
              detail: No public retention or post-launch adoption metrics.
            - label: medium
              tone: neutral
              detail: Useful proof outside classic banking and insurance.
        - label: Aflac
          values:
            - label: high
              tone: positive
              detail: Named production deployment with customer executive support and external press release.
            - label: high
              tone: positive
              detail: 32% adoption, 96% success, 265K+ enrollments, and no reported failures are unusually specific.
            - label: low
              tone: warning
              detail: Launch-phase metrics do not equal multi-year renewal proof.
            - label: medium
              tone: positive
              detail: Shows the platform can succeed in insurance outside anonymous bank references.
