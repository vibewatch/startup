      - number: '4.5'
        title: Capital Adequacy and Financing Dependency
        blocks:
          - type: paragraph
            body: >
              Capital adequacy is the hardest part of this chapter to underwrite from public evidence. The historical
              fact pattern is strong: Transmit raised $543 million in a single 2021 Series A round led by Insight
              Partners and General Atlantic, after operating as a bootstrapped company. That is a very large capital
              base for a private identity vendor, and retained news plus Tracxn do not show any later disclosed
              financing round. Those facts argue against an obviously fragile balance sheet.


              However, they do not answer the forward question investors actually need: how much of that capital is
              left, what the current burn profile is, whether the company is free-cash-flow positive, and what trigger
              would force a next round. No retained public source gives cash on hand, monthly burn, runway months, debt,
              or secondary-liquidity details. The practical conclusion is that Transmit does not look publicly
              distressed, but financing dependency after 2021 is still unresolved until management provides a current
              cash bridge and forecast.
