companyProfile:
  summary: >-
    Transmit Security is a private identity-security software company founded in 2014 by Mickey Boodaei and Rakesh
    Loonkar, with Boston headquarters, deep Tel Aviv operating roots, and a platform strategy centered on Mosaic. Mosaic
    combines customer identity and access management, identity orchestration, fraud prevention, and identity
    verification in one enterprise-grade, microservices-based platform sold primarily to large regulated enterprises.
    Public evidence shows strong customer relevance, especially in banking and insurance, plus unusually large
    historical funding support, but current financial transparency lags the company’s product and customer proof.
  foundedDate: '2014-01-01'
  founders:
    - name: Mickey Boodaei
      role: CEO and Co-founder
      background: >-
        Co-founded Trusteer before its sale to IBM and is part of the founding team behind Imperva-era security
        businesses.
      claimRefs:
        - CO002
        - CO003
    - name: Rakesh Loonkar
      role: President and Co-founder
      background: Co-founded Trusteer and helped build earlier cybersecurity companies before starting Transmit Security.
      claimRefs:
