        blocks:
          - type: paragraph
            body: >
              Transmit Security now shows enough pricing detail to establish the rough revenue architecture even though
              it still withholds realized pricing, discounting, and module mix. The company is clearly selling a
              high-ticket enterprise platform rather than a self-serve developer SKU: list pricing starts at $200,000
              for the full Mosaic suite, $100,000 for the identity-only SKU, $100,000 for fraud and threat detection,
              and $50,000 for identity verification, with billing tied to MAUs, login volumes, or ID-check counts. That
              structure suggests recurring subscription revenue, but it also implies that realized ACV can vary
              materially by deployment architecture and usage profile.


              What remains unsupported is the mix between core CIAM subscriptions, fraud modules, identity verification,
              and any paid implementation or support services. Public sources do not disclose what percentage of
              bookings comes from the largest-bank deployments versus smaller enterprise accounts, whether Microsoft or
