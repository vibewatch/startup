      - Diligence path
    rows:
      - - Current ARR and revenue bridge
        - Monthly or quarterly recurring revenue, GAAP revenue, and bookings bridge since 2024.
        - Needed to replace third-party estimate ranges with actual scale.
        - Request board deck, finance pack, and latest management accounts.
      - - Retention quality
        - NRR, GRR, cohort expansion, and churn by customer segment.
        - Premium identity multiples require durable expansion, not just logo quality.
        - Request customer cohort tables and top-20 account histories.
      - - Gross margin by product and services
        - Gross margin split for CIAM, fraud, verification, and implementation/services.
        - Determines whether six-figure pricing translates into software-like economics.
        - Request gross margin waterfall and hosted-cost / third-party-cost detail.
      - - Liquidity and runway
        - Cash on hand, burn, runway, debt, and financing triggers.
        - A large 2021 raise does not prove present balance-sheet safety.
        - Request cash bridge, debt schedule, and downside operating plan.
      - - Cap table and preferences
        - Preferred stack, liquidation preferences, secondaries, SAFEs/notes, and employee-option overhang.
        - Headline valuation can overstate true value to a new investor or common-equivalent holder.
        - Request cap table, charter, side letters, and most recent 409A / board mark.
      - - Exit process readiness
        - Banker materials, audit readiness, board discussions, and any IPO / strategic-outreach status.
        - Without an exit path, a premium private mark is harder to monetize.
        - Request roadmap to filing readiness or strategic-process preparation.
    notes: >-
      Each ask is a direct blocker to moving the recommendation from research-more toward buy or even neutral track with
      high confidence.
    claimRefs:
      - CV005
      - CV037
      - CV038
      - CV040
      - CV041
      - CV042
