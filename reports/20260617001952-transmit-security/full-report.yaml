      - number: '2.4'
        title: Growth Drivers, Adoption Constraints, and Open Gaps
        blocks:
          - type: paragraph
            body: >-
              Demand is rising for reasons that are concrete rather than theoretical. FIDO says more than 15 billion
              online accounts could leverage passkeys, while Mobile ID World reports growing awareness and
              major-platform rollout. Fraud pressure is also visible in hard currency: the FTC says U.S. consumers
              reported losing more than USD 12.5B to fraud in 2024, and UK Finance says GBP 1.17B was lost to fraud in
              2023. Signicat's survey adds that AI is now deeply involved in identity fraud, including deepfakes. Those
              drivers intersect with GDPR, CCPA, and PSD2-style authentication requirements, making customer identity a
              cross-functional risk, compliance, and growth budget line. But availability does not equal adoption.
              USENIX and MDPI both describe slow rollout caused by recovery friction, technical issues, regulatory
              requirements, and user-perception problems, while Microsoft notes that administrators still cannot fully
              see or control where synced passkeys live. The resulting contradiction should be preserved: the market is
              clearly expanding, yet precise Transmit-specific SOM, buyer-budget split, and passkey activation rates by
              segment remain under-disclosed and need management diligence rather than spreadsheet extrapolation.
