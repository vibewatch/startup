  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and peer classes
        blocks:
          - type: paragraph
            body: >-
              Transmit does not face one clean rival set. The evidence breaks the market into five classes. First are
              direct CIAM and orchestration peers: Okta/Auth0 and Ping/ForgeRock, both of which can sell customer
              identity plus workflow tooling into the same enterprise evaluation. Second are distribution-heavy
              incumbents such as Microsoft Entra and CyberArk, which may not start from the same product DNA but can use
              broader identity or security suites to absorb adjacent spend. Third are developer-first adjacents such as
              Descope and Stytch that emphasize fast migration, flexible APIs, and transparent or semi-transparent usage
              pricing. Fourth are substitutes such as Keycloak and internal-build approaches that can cover core login,
              federation, and user-management needs without buying a large commercial platform. Fifth are likely
              entrants from broader identity-security stacks that can cross-sell customer access into existing accounts.


              This segmentation matters because Transmit wins most clearly when the buyer cares about fraud pressure and
              orchestration at the same time. Its public and independent evidence both point to a unified stack for
              CIAM, identity verification, fraud, and passkey-heavy journeys. That is a narrower and more valuable wedge
              than “identity platform” in general. In contrast, buyers who only need commodity login, partner SSO, or a
              lower-friction greenfield developer tool have many credible alternatives. Public scale also tilts toward
              incumbents: Okta and CyberArk provide billion-dollar revenue anchors, Ping serves over half of the Fortune
              100, and Microsoft brings bundle gravity that smaller vendors cannot match.
