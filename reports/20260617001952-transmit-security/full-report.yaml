  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      Transmit typically lands in a customer-facing identity pain point, then expands into broader fraud, orchestration,
      and cross-channel journeys.
    data:
      nodes:
        - id: pain
          label: Pain point
          detail: >-
            Enterprise starts with login friction, account recovery weakness, fraud exposure, or fragmented identity
            tooling.
          tone: warning
        - id: pilot
          label: Initial project
          detail: Transmit lands with passwordless login, fraud detection, or orchestration for one high-value journey.
          tone: neutral
        - id: deploy
          label: Production deployment
          detail: Named logos put the solution live for retail-banking, insurance, financing, or policyholder journeys.
          tone: positive
        - id: expand
          label: Platform expansion
          detail: >-
            Accounts widen from authentication into orchestration, identity verification, call-center flows, or fraud
            controls.
          tone: positive
        - id: renew
          label: Durability test
          detail: >-
            Renewal quality depends on procurement ease, implementation burden, and whether lighthouse wins generalize
            across the base.
          tone: warning
    approximationNotes: null
