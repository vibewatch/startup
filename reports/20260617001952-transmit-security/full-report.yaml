  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: >-
      Commercial proof and pricing power support strategic relevance, but disclosure gaps and multiple compression pull
      the recommendation back to research-more.
    data:
      nodes:
        - id: proof
          label: Commercial proof
          detail: Large-bank, insurer, and ROI case studies show the product works at enterprise scale.
        - id: pricing
          label: Pricing power
          detail: Public list pricing starts at $50K-$200K per year depending module and usage unit.
        - id: distribution
          label: Distribution leverage
          detail: Microsoft committed-spend and partner discounts can reduce procurement friction.
        - id: estimate_band
          label: Public scale band
          detail: Third-party sources still span only $33.4M to >$100M of revenue/ARR-like scale.
        - id: market_multiples
          label: Public comp reality
          detail: June 2026 identity/cyber multiples cluster around ~6x to ~12x, not 20x-80x.
        - id: opacity
          label: Disclosure gap
          detail: No public NRR, gross margin, burn, runway, or preference stack.
        - id: call
          label: Recommendation
          detail: Research-more for new money; expensive at stale private marks.
      edges:
        - from: proof
          to: pricing
          label: Working product can command premium pricing
        - from: pricing
          to: distribution
          label: Enterprise ACV needs scalable selling motion
        - from: distribution
          to: estimate_band
          label: But public scale remains loosely estimated
        - from: estimate_band
          to: market_multiples
          label: Scale must clear public comp thresholds
        - from: market_multiples
          to: opacity
          label: Lack of disclosure prevents premium underwriting
        - from: opacity
          to: call
          label: Price discipline overrides brand-quality narrative
    approximationNotes: >-
      The flow is qualitative and designed to show how the recommendation is assembled from product proof, scale
      evidence, comp multiples, and remaining disclosure gaps.
    claimRefs:
      - CV008
      - CV009
      - CV017
      - CV022
      - CV023
