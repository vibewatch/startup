      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: The stale private mark needs far more revenue than the public record currently shows
            body: >-
              At a $2.2B to $2.7B mark, Transmit would need roughly $147M to $180M of recurring revenue even under a 15x
              premium lens, and roughly $361M to $443M under an Okta-like 6.1x lens. The retained public revenue band
              still spans only $33.4M to >$100M, leaving a large proof gap.
            calloutType: risk
            claimRefs:
