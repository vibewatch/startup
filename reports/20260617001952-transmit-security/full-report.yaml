      - number: '2.2'
        title: Multiple Sizing Lenses and Evidence-Constrained TAM
        blocks:
          - type: paragraph
            body: >-
              The evidence does not support a single clean TAM for Transmit's market. Grand View puts CIAM at USD 8.12B
              in 2023 and USD 26.72B by 2030, Meticulous puts CIAM at USD 12.6B in 2026 and USD 40.2B by 2036, while The
              Business Research Company says consumer IAM was already USD 41.75B in 2025 and reaches USD 101.15B by
              2030. Those numbers are too far apart to treat as interchangeable, so the most defensible approach is to
              preserve the disagreement and carry a range: low case USD 12.6B, working midpoint roughly USD 19B, and
              broad-definition ceiling around USD 41.75B for 2026-like direct category spend. Precedence's broader IAM
              estimate of USD 25.89B in 2026 and Grand View's separate identity-verification market add context that the
              full digital-identity journey budget is larger than narrow CIAM alone. For Transmit, that means the
              near-term opportunity is not the whole broader IAM stack, but the regulated and high-volume
              customer-journey wedge where passkeys, orchestration, identity verification, and fraud controls are bought
              together.
