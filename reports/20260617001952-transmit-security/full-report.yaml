        title: Cost Structure and Gross-Margin Drivers
        blocks:
          - type: paragraph
            body: >
              The cost structure is only inferable, but the direction is clear. The core CIAM and orchestration modules
              look software-like, yet Transmit is not selling a minimalist authentication API alone. Its product set
              layers fraud scoring, behavioral analytics, identity verification, and active-active multi-cloud
              resilience on top of core login flows. Each of those features can add hosting, model-inference, telemetry,
