      - number: '8.2'
        title: Historical financing anchor and price-discipline test
        blocks:
          - type: paragraph
            body: >-
              The formal valuation anchor is stale but unusually large. Transmit Security's last disclosed primary
              financing was the June 22, 2021 Series A, where official and independent reporting align on $543 million
              raised. Business Wire and TechCrunch both frame that event at about a $2.2 billion pre-money valuation,
              and later company updates add Citi Ventures and Goldman Sachs as additional investors in the same
              financing. PitchBook still labels the latest deal type as Series A and private status, while Tracxn still
              lists only that single $543 million round and a $2.2 billion valuation date tied to 2021. Dealroom
              continues to classify the company as a unicorn, but only within a broad $1 billion to $2.5 billion band
              rather than a new priced round.


              That leaves investors with a hard price-discipline problem. There is no public evidence that the company
              has repriced upward, taken a down round, disclosed debt, run a formal secondary, or produced audited
              revenue that would reset the mark. Because the 2021 valuation was struck during a richer software-multiple
              regime, it should be treated as a historical reference point rather than current fair value. The absence
              of cap-table detail is equally important: without preference-stack, secondary, and runway data, investors
              cannot tell how much of the historical mark would actually accrue to a new preferred investor or to
              common-equivalent holders in a sale.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
