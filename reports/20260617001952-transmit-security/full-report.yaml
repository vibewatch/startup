  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Substitutes
        blocks:
          - type: paragraph
            body: >-
              Transmit's own platform positioning is a useful anchor for the market boundary: the company says Mosaic
              combines identity management, identity verification, fraud prevention, orchestration, and secure
              authentication across the entire user lifecycle. That matters because the direct market relevant to
              Transmit is not the whole identity-and-access-management universe. MarketsandMarkets defines consumer IAM
              to include identity administration, PII management and analytics, access management, fraud detection, and
              services, while Grand View and Meticulous publish narrower CIAM market estimates. The broader IAM category
              is larger because it also includes workforce and administrative access. Identity verification is adjacent
              rather than fully included, and many buyers still solve the problem with substitutes such as passwords
              plus OTP, federated sign-in, self-operated identity stacks, or point fraud and IDV tools. For this
              chapter, the included spend is customer-facing identity orchestration and authentication plus closely
              linked fraud and identity-verification layers, while excluded spend is generic workforce IAM and unrelated
              enterprise-security tooling.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
