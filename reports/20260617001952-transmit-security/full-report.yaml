  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis, anti-thesis, and recommendation
        blocks:
          - type: paragraph
            body: >-
              Transmit Security still has a real investment thesis. Public pricing shows it is not selling a commodity
              developer widget but an enterprise identity platform that starts at six-figure annual contract levels.
              Customer proof is also credible: the company publishes a global-bank deployment spanning 200 million
              customers and seven apps, a leading U.S. bank case citing 1300% ROI and a 98% reduction in new-account
              fraud, and an Aflac passkey program reporting 32% adoption and 96% login success within roughly two
              months. Microsoft partnership language adds another positive clue because committed-spend discounts and
              procurement leverage can shorten enterprise buying cycles for regulated customers.


              The anti-thesis is that commercial proof has not translated into public valuation transparency.
              Independent sources still disagree sharply on current scale, ranging from $33.4 million of 2025 revenue to
              more than $100 million of ARR/revenue-like scale, while no retained source discloses net retention, gross
              margin, burn, cash, debt, or liquidation preferences. Independent reviews also warn that the platform can
              be complex to scale and lacks some mail/SMS integration flexibility. Taken together, the evidence supports
              a research-more call for new money, medium confidence, a high risk rating, and an expensive valuation
              stance at any mark that still leans on the 2021 round without fresh disclosure.
