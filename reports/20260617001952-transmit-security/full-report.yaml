chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product scope, and business model
        blocks:
          - type: paragraph
            body: >-
              Transmit Security presents itself as an enterprise identity-security vendor built around customer
              identity, authentication, fraud prevention, and identity verification. Official product pages position
              Mosaic as a single SaaS-native platform that combines CIAM, fraud controls, and identity-proofing rather
              than selling only a narrow authentication point tool. The company says it was founded in 2014, is led by
              its original co-founders, and serves highly regulated enterprises that need digital onboarding, login,
              recovery, and transaction flows to be secure without adding friction. Pricing is enterprise-oriented and
              quote-based: the public pricing page advertises customized plans, MAU or event-volume pricing, and a
              99.99% uptime SLA rather than self-serve list pricing. That combination supports a business model centered
              on large-account SaaS and usage-linked platform revenue, with professional deployment and orchestration
              depth acting as differentiators. Public scale messaging is ambitious, but it is still mostly
              company-claimed rather than independently audited.
