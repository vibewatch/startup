            body: >
              Transmit Security's public financial picture is attractive in quality but weak in completeness. The
              attractive part is straightforward: enterprise list pricing is real, customer proof at very large banks
              and insurers is credible, and case studies show measurable economic outcomes that should support premium
              ACVs and expansion selling. The weak part is equally important: public evidence does not let an investor
              size current revenue, mix, gross margin, CAC, net retention, burn, or runway with confidence.


