  - id: FU002
    title: Adoption / deployment funnel
    type: flow
    layout: wide
    summary: >-
      Public evidence shows a path from enterprise identity pain to production rollout, then to wider procurement and
      platform expansion.
    data:
      nodes:
        - id: need
          label: Security and CX need
          detail: Banks, insurers, and retailers seek lower friction and lower fraud.
          tone: warning
        - id: selection
          label: Platform selection
          detail: Transmit is chosen for passwordless login, orchestration, or combined identity-plus-fraud needs.
          tone: neutral
        - id: launch
          label: Initial launch
          detail: Examples include BRED in 7 days and Aflac in roughly 2 months.
          tone: positive
        - id: scale
          label: Scaled live usage
          detail: Global bank and Aflac cases show very large user populations or measurable adoption.
          tone: positive
        - id: channel
          label: Expansion and channel leverage
          detail: >-
            Microsoft-aligned procurement and broader journey orchestration can widen scope, but also obscure
            concentration.
