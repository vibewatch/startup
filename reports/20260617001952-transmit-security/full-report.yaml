        title: Capitalization, investors, and valuation evidence
        blocks:
          - type: paragraph
            body: >-
              Transmit Security is one of the most visibly capitalized private identity-security vendors of its cohort.
              The best-supported financing event is the June 22, 2021 Series A, where official and independent reporting
              align on $543 million raised, led by Insight Partners and General Atlantic, with Cyberstarts, Geodesic,
              SYN Ventures, Vintage, and Artisanal Ventures also named. A September 2021 company update added Citi
              Ventures and Goldman Sachs as additional investors in the same round. Where evidence diverges is valuation
              framing: TechCrunch cites a $2.2 billion pre-money valuation, SYN Ventures cites $2.3 billion pre-money,
              and Tracxn records a $2.2 billion valuation for the round without fully reconciling pre- versus post-money
              treatment. No later priced round, credit facility, or debt package was surfaced in reviewed sources, so
              the public capital story is clear through 2021 financing but materially less clear afterward.
