      - number: '8.5'
        title: Exit readiness, kill triggers, and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              Identity assets can exit well when disclosure quality is strong. SailPoint shows the pattern clearly:
              Thoma Bravo paid about $6.9 billion to take it private in 2022, and by February 2025 the company could
              return to public markets at a $12.8 billion market value after disclosing $621 million of revenue for the
              prior nine months. Transmit does not yet present that level of readiness in public. PitchBook still shows
              private status and a 2021 latest deal, while the retained source set does not surface an S-1, F-1, or
              other active IPO process with disclosed financials.


              That does not mean the company is broken; it means the diligence bottleneck is solvable only with
              management disclosure. The thesis breaks if a new financing or secondary reveals a sharp discount to the
              old mark, if current ARR is materially below the thresholds implied by public comps, if retention or gross
              margin shows weak software economics, or if a hidden preference stack makes the headline valuation
              economically misleading. The final diligence asks are therefore straightforward: management must provide
              an ARR and revenue bridge, cohort retention, gross margin by module and services, a cash/runway bridge,
              and the current liquidation waterfall before a fresh investor should underwrite the company at anything
              close to the historical mark.
            claimRefs:
              - CV027
              - CV028
              - CV029
              - CV037
              - CV038
              - CV040
              - CV041
