        blocks:
          - type: paragraph
            body: >-
              Founder continuity is a major feature of the company story. Official pages and investor materials
              consistently name Mickey Boodaei and Rakesh Loonkar as 2014 co-founders, with Mickey still serving as CEO
              and Rakesh as President as of the run date. The current public leadership bench also includes CFO Mirit
              Barak, CLO Kiran Judge, CTO Shmulik Regev, Chief Customer Officer Ashley Arbuckle, Chief Identity Officer
              David Mahdi, and regional commercial leaders. That lineup suggests the company has grown beyond a pure
              founder shop into a more functionally complete operating team. Even so, governance disclosure is thin
              relative to the scale of capital raised: the reviewed official materials do not publish a full board
              roster, investor control rights, or a clear executive-change chronology. David Mahdi is publicly
              identified as CIO in late 2025 analyst-recognition press coverage, but broader succession, board
              committee, and governance mechanics remain diligence items rather than verified public facts.
