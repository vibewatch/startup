        title: Moat durability and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              The moat question is less about whether Transmit has valuable product features and more about whether
              those features remain scarce as identity becomes more composable. The strongest bullish case is that
              fraud-heavy customer journeys benefit from shared state across authentication, identity verification,
              orchestration, and fraud decisioning, and that a single runtime can outperform stitched stacks on both
              security and conversion. The strongest bearish case is that many buyers do not need that full stack. When
              fraud is lower, basic CIAM can be sourced from Auth0, Descope, Stytch, Microsoft, or even Keycloak at
              materially lower evaluation friction, often with published free tiers or pre-existing bundle leverage.


              Adverse evidence sharpens that concern. Okta’s past support-system breach and ongoing status incidents
              show that mature incumbents still carry platform and concentration risk. Microsoft’s bundle power and
              Keycloak’s open-source availability cap the price umbrella for undifferentiated login. Ping’s merged scope
              is strategically credible, but its integration roadmap also means customers will keep probing for overlap
              and optionality rather than accept a single-suite future on faith. CyberArk adds another adjacency threat
              as identity-security suites broaden. The underwriting conclusion is that Transmit’s moat is durable only
              if it keeps proving better fraud-sensitive journey outcomes than cheaper or more deeply distributed
              alternatives. Public evidence supports that thesis directionally, but not yet with the win-rate,
              realized-pricing, or retention proof needed to call the moat closed-form.
