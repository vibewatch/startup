              Production-grade evidence is strongest where Transmit publishes concrete deployment details or customer
              quotes: Citi discussing several thousand apps and a long-term rollout path, BRED disclosing a seven-day
              BindID integration, NN citing better adoption after orchestration, America’s Car-Mart tying authentication
              to online financing flows, and Aflac publishing adoption and success metrics for passkeys. Event-talk
              marketing proof sits one level below that: Citi’s Gartner-stage passwordless discussion and
              Microsoft-oriented passkey partnership content are useful indicators of enterprise seriousness, yet they
              are still curated marketing rather than audited customer reporting. Logo- or sector-level proof is weaker
              again: official briefs and the homepage repeatedly invoke top banks, insurers, retailers, and
              annual-commerce totals without naming most accounts or proving renewal. The right diligence posture is
              therefore to treat the company as having strong production proof in a handful of reference accounts,
              broader but shallower sector proof beyond that, and material disclosure gaps on how representative those
              lighthouse deployments are.
