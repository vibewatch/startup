      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >-
              Customer identity software is bought by institutions but used by their end customers, which makes the
              buyer map more complex than most security categories. MarketsandMarkets explicitly frames consumer IAM
              around key stakeholders, buying criteria, adoption barriers, and end-use verticals. In enterprise
              deployments, Microsoft documentation shows passkey rollout is policy-driven and admin-enabled, so the
              champion is usually identity or security leadership. In consumer applications, the user is the account
              holder signing in, but the buyer and payer are the app operator's product, security, fraud, and compliance
              functions. Adoption also follows a staged path: WebAuthn-capable devices and browsers, MFA enrollment,
              relying-party-domain setup, passkey registration flows, and then full lifecycle management. The most
              urgent buyers are sectors with large consumer account bases and measurable fraud exposure — banking and
              fintech, e-commerce and marketplaces, travel and hospitality, healthcare and public services, and other
              digital platforms with conversion-sensitive authentication funnels. Transmit's relevance is strongest
              where those sectors want one control plane spanning login, verification, fraud, consent, and customer
              lifecycle orchestration rather than separate point products.
