        title: Bull, base, and bear scenarios
        blocks:
          - type: paragraph
            body: >-
              A defensible bull case exists, but only conditionally. To make the old private marks work, Transmit would
              need hidden recurring revenue at least in the high-hundreds of millions threshold required by premium comp
              lenses, plus evidence that growth quality, retention, and gross margin are good enough for buyers to pay a
              strategic or IPO premium. Under a 12x to 15x range, the $2.2 billion to $2.7 billion marks need about $147
              million to $225 million of revenue, and those thresholds are materially above what public estimate sources
              currently show.


              The base case for a new investor is therefore not 'the 2021 round was wrong' but 'the 2021 round is
              unproven.' If actual recurring revenue only clears the current public upper band of just above $100
              million, then even 7.8x to 10.2x market lenses still leave fair value below the old mark. The bear case is
              harsher: if true scale is closer to the low-end $33.4 million public estimate, current public multiples
              imply only a few hundred million dollars of enterprise value and a severe mark-down. Because the gap
              between the disclosed round anchor and today's public evidence is so wide, scenario analysis should be
              read as a threshold framework rather than a precision model.
