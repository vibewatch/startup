  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: IC-style scorecard summarizing the evidence behind Transmit Security’s valuation call.
    data:
      items:
        - label: Product proof
          value: 8
          score: 8
          detail: Large-bank, fraud, and passkey case studies show enterprise-grade product relevance.
        - label: Customer proof
          value: 8
          score: 8
          detail: Named or referenced customers and commerce scale indicate real deployment depth.
        - label: Pricing power
          value: 7
          score: 7
          detail: List pricing starts at six-figure ACVs, but realized discounting is opaque.
        - label: Evidence quality
          value: 3
          score: 3
          detail: Current ARR, NRR, margins, and cap-table data are not publicly disclosed.
        - label: Exit readiness
          value: 3
          score: 3
          detail: No public filing path or filing-grade disclosure surfaced in retained sources.
        - label: Valuation support
          value: 2
          score: 2
          detail: Public-comp multiples do not support stale private marks on currently visible revenue ranges.
    approximationNotes: >-
      Scores are qualitative 0-10 judgments derived from the retained evidence set and are intended to support IC
      discussion rather than serve as audited metrics.
    claimRefs:
      - CV019
      - CV022
      - CV023
      - CV027
      - CV039
      - CV040
      - CV041
