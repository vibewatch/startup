      - number: '7.3'
        title: Partner, platform, and subprocessor dependency risk
        blocks:
          - type: paragraph
            body: >-
              Transmit markets strong interoperability, but public evidence also shows meaningful dependency
              concentration. The most visible dependency is Microsoft: the marketplace listings and integration
              tutorials position Transmit on top of Azure AD B2C and Entra External ID, while the company's own partner
              blog promotes Microsoft committed-spend procurement and partner discounts. That creates a useful channel,
              yet it also means a slice of Transmit's passkey motion is exposed to Microsoft product roadmap shifts,
              packaging changes, and partner-priority decisions. Beneath that, the DPA discloses a broad third-party
              operating web: AWS, Google Cloud, MongoDB Atlas, Cloudflare, Veriff, Salesforce, and outsourced support
              providers all sit somewhere in the delivery path. Multi-cloud and in-session failover mitigate some
              single-cloud outage risk, but they do not eliminate dependency on subprocessor performance, pricing, or
              contractual availability. Public customer proof also clusters around a small number of extremely large
              financial institutions. One bank deployment spans 200 million customers and seven apps; another claims
              1300% ROI and 98% fraud reduction in one month. Those are impressive references, but they also imply that
              losing even a small number of flagship accounts or channel relationships could carry outsized narrative
              and commercial impact.
