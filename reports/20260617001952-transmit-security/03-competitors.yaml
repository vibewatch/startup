- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Supporting evidence
  - Threat / substitute
  - Severity
  - Diligence ask
  rows:
  - - Unified CIAM + fraud + verification runtime
    - Transmit product surface and CIAM Compass both emphasize one runtime
    - Auth0, Descope, Stytch, or Keycloak cover lower-fraud CIAM more cheaply
    - High
    - Quantify how often fraud-aware orchestration changes win rates or reduces point-tool count
  - - Enterprise banking / fintech fit
    - Transmit funding release and independent review both center high-fraud financial use cases
    - Microsoft and Ping can still land in the same accounts via bundle or hybrid identity control points
    - High
    - Request reference wins against Microsoft, Ping, and Okta in regulated consumer environments
  - - Workflow speed as differentiator
    - Transmit, Ping, and Descope all market visual or no-code orchestration
    - Orchestration itself is becoming table stakes across direct and adjacent competitors
    - Medium
    - Ask for measured deployment-time advantages and conversion/fraud lift by journey
  - - Switching costs from multi-module adoption
    - Unified runtime implies stickiness after multiple modules are live
    - Public evidence does not disclose Transmit retention, attach, or expansion cohorts
    - High
    - Obtain cohort retention and module-attach data to validate economic lock-in
  - - Incumbent reliability and trust gaps create openings
    - Okta incident history and ongoing status events show incumbent trust is not perfect
    - Large incumbents still retain scale, procurement familiarity, and status transparency buyers may prefer
    - Medium
    - Map incident-response and reliability expectations in target accounts rather than assume incumbent fatigue
  - - Platform adjacency risk remains manageable today
    - CyberArk is broad but still adjacent, and Ping integration is still in flight
    - Adjacencies can deepen quickly through cross-sell, acquisitions, and bundle pressure
    - Medium
    - Re-check competitive threat after each major platform release or post-merger milestone
  notes: Severity reflects downside to Transmit's relative moat, not overall vendor quality. Several rows intentionally separate product differentiation from economic proof because public evidence supports the former more than the latter.
