  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: transmit-switching-costs
    missingEvidence: Cohort-level renewal rates, module attach rates, and win-loss data showing whether Transmit displaces incumbent CIAM plus separate fraud stacks after initial deployment.
    whyItMatters: The public thesis is that unified fraud plus CIAM creates lock-in, but without renewal and expansion evidence the moat could still be more conceptual than economic.
    diligencePath: Request customer-cohort retention, expansion by module, and at least three named migration case studies from incumbent CIAM or orchestration competitors.
    relatedQuestionRefs:
    - QP015
  - type: missing-source
    severity: material
    topic: ping-forgerock-integration-proof
    missingEvidence: Current customer evidence showing whether Ping-ForgeRock unification has improved selling efficiency or created migration friction in 2025-2026 deployments.
    whyItMatters: The merged scope raises competitive pressure on Transmit, but integration drag could delay execution and change the real threat level.
    diligencePath: Ask for post-merger pipeline mix, attach rates for DaVinci into former ForgeRock accounts, and references from customers who expanded after the combination.
    relatedQuestionRefs:
    - QP023
  - type: private-evidence-only
    severity: blocking
    topic: realized-pricing-and-win-rates
    missingEvidence: Realized MAU, per-auth, and platform-bundle pricing plus discount bands for Transmit, Ping, and large-enterprise Auth0 or Okta customer-identity deals.
    whyItMatters: List-price availability is uneven, so underwriting competitive intensity without realized commercial data risks overstating or understating both moat and margin durability.
    diligencePath: Obtain redlined proposals, recent renewals, and at least one head-to-head bake-off dataset covering price, implementation effort, and attach assumptions.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP003
