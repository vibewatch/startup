- id: TP001
  title: Competitor profile table
  columns:
  - Competitor
  - Class
  - Scale / funding signal
  - Target customer
  - Differentiation
  - Limitation / direction
  rows:
  - - Transmit Security
    - Direct peer / subject
    - $543M Series A; large-enterprise banking and consumer scale signals
    - Banks, fintechs, insurers, and other high-fraud consumer journeys
    - Unified CIAM + fraud + verification + orchestration in one runtime
    - Opaque enterprise pricing; smaller public proof set than largest incumbents
  - - Okta / Auth0
    - Scaled direct incumbent
    - $2.919B FY2026 revenue; ecosystem and developer familiarity
    - Enterprise workforce plus customer-identity builders
    - Extensibility, app ecosystem, mature packaging, strong developer reach
    - Enterprise pricing inquiry; module creep and past incident/reliability baggage
  - - Ping Identity / ForgeRock
    - Direct incumbent / orchestration-heavy
    - Over half of Fortune 100; merged CIAM + workforce + governance scope
    - Regulated enterprises needing hybrid or standards-heavy identity
    - Vendor-agnostic orchestration, hybrid deployment, federation depth
    - Post-merger platform unification remains an execution variable
  - - Microsoft Entra External ID
    - Bundle-heavy incumbent
    - Massive installed base; first 50k MAUs free for External ID
    - Azure and Microsoft 365 standardized enterprises
    - Bundle leverage, procurement familiarity, cross-product control plane
    - External identity transition still evolving; deeper CIAM may need extra SKUs
  - - Descope
    - Developer-first adjacent
    - 1000s of orgs; startup-to-Fortune-500 messaging
    - B2B SaaS, product teams, and external-identity builders
    - Visual workflows, fast migration, strong B2B CIAM building blocks
    - Public trust and scale proof remain lighter than top incumbents
  - - Stytch
    - Developer-first substitute
    - $90M Series B at $1B valuation; 3,500+ developers
    - Greenfield product teams and passwordless-first builders
    - API-first motion, transparent free tier, low-friction adoption
    - Less public evidence of large regulated-enterprise replacement wins
  - - CyberArk
    - Adjacent incumbent
    - $1.361B revenue; $1.44B ARR; broad identity-security suite
    - Large enterprises buying platformized identity security
    - Customer access plus B2B, lifecycle, governance, and machine identity adjacency
    - Not positioned as the cleanest pure-play CIAM replacement today
  - - Keycloak / internal build
    - Status quo substitute
    - Open-source software plus internal engineering time
    - Teams optimizing for control, self-hosting, or low cash spend
    - No license fee, strong standards support, broad customization
    - Operational burden, upgrade complexity, and weaker packaged fraud capabilities
  notes: Selected 2026 landscape spanning direct peers, incumbents, developer-first adjacents, and the main self-hosted substitute; rows compare threat shape, not audited market share.
