- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Vendor
  - Public pricing stance
  - Commercial anchor
  - GTM / distribution
  - Switching or multi-homing implication
  rows:
  - - Transmit Security
    - No public list pricing
    - Enterprise quote; six-figure minimums reported independently
    - Direct enterprise sales into fraud-heavy B2C accounts
    - Likely sticky only after fraud, verification, and CIAM are intertwined
  - - Okta / Auth0
    - Partial transparency
    - Okta enterprise inquiry plus Auth0 MAU/free-tier ladders
    - Large enterprise field sales plus strong developer funnel
    - Expansion modules and ecosystem familiarity raise switching friction
  - - Ping / ForgeRock
    - Quote-led
    - Demo-driven packaging with partner and field-sales motion
    - Fortune-100 enterprise reach and existing hybrid estates
    - Openness can reduce rewrite risk, but platform depth still creates migration cost
  - - Microsoft Entra External ID
    - Transparent entry, opaque true total cost
    - Free first 50k MAUs plus bundled Azure/M365 economics
    - EA-driven and Azure-consumption-led distribution
    - Bundle leverage can force standalone vendors to discount or lose share
  - - Descope
    - Transparent usage entry
    - Free start, usage overages, higher-tier migration and FGA upsell
    - Product-led plus enterprise expansion into B2B SaaS
    - Fast migration posture lowers trial friction and preserves buyer optionality
  - - Stytch
    - Transparent usage entry
    - Free 10k MAUs with no pricing cliffs and usage overages above that
    - Developer-led greenfield motion
    - Easy to pilot or multi-home when enterprise governance needs stay light
  - - CyberArk
    - Quote-led suite pricing
    - Platform sale oriented around broader identity security
    - Security-suite and channel-driven enterprise motion
    - Adjacency can win budget consolidation, but not always a clean CIAM swap
  - - Keycloak / internal build
    - Software is license-free
    - Cash cost low; labor and integration cost high
    - Self-serve adoption plus SI / internal engineering
    - Low vendor spend but high operational lock-in once heavily customized
  notes: This table compares public pricing visibility and route-to-market, not realized contract prices. Exact production pricing for enterprise CIAM deals remains a diligence gap because several vendors only expose partial anchors.
