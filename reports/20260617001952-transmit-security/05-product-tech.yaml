- id: TE002
  slug: workflow-use-case-table
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow signal
  - Transmit solution
  - Measurable benefit
  - Limitation
  rows:
  - - Customer registration / onboarding
    - Journey orchestration plus identity verification
    - Orchestrate registration and invoke IDV or risk checks when trust is low
    - Can collapse onboarding, fraud, and proofing into one journey
    - No public conversion or abandonment benchmarks across broad customer base
  - - Login and re-authentication
    - Passkeys, biometrics, OTP, magic links, and fallback logic
    - Use orchestration to prefer low-friction methods and step up only when risk requires it
    - Official stories cite 30%+ fewer auth failures and 70% fewer support calls
    - Outcome numbers come from selected official stories rather than independent measurement
  - - Large-bank passwordless rollout
    - Global bank case with 200M users across 7 apps
    - Authentication Services plus FIDO2 / passkeys and later call-center / risk extensions
    - Demonstrates multi-app scale and consolidation of login tooling
    - Named customer remains anonymized and architecture details are sparse
  - - Fraud attack response
    - Detection and Response with behavioral analytics and device signals
    - Replace or consolidate legacy rules engines with adaptive scoring and prebuilt decisioning
    - Official bank story cites 98% lower new-account fraud and one-month time to value
    - No public precision-recall or model-governance detail
  - - Consumer passkey UX at insurer
    - Aflac embedded branded passkeys in existing website
    - Developer SDK plus passkey security layer and UI customization
    - 32% adoption, 96% login success, launch in ~2 months
    - Single flagship case does not prove repeatability across all sectors
  notes: Benefits are sourced from official case studies and partner content; they indicate plausible value but are not a substitute for cohort-level customer analytics.
