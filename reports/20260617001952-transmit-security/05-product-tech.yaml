- id: deployment-reliability-developer-platform
  title: Deployment, integration, reliability, and support
  body: |-
    From a deployment standpoint, Transmit offers enough public detail to show enterprise intent. The documentation names a sandbox plus multiple production geographies and supports custom domains, while the SLA gives a formal 99.99% availability target, 24x7 operations language, one-hour severity-1 response objectives, and references to resilient facilities with redundant network and power. That package is stronger than a pure marketing trust page because it lives in contractual and technical documentation, not only in homepage copy. It supports the view that Mosaic is meant to be a cloud service integrated into production customer journeys rather than a thin toolkit.

    At the same time, deployment ease should not be oversold. Customer stories show fast launches are possible: Aflac used the SDK to embed passkeys inside its own website in roughly two months, and official case studies describe very large-scale bank rollouts. But independent reviews repeatedly say the product still demands specialist integration knowledge, careful workflow design, and better documentation for some use cases. The right read is that Transmit is enterprise-ready for teams with solution architecture muscle, not a frictionless plug-and-play developer utility. That gap is a core diligence point because workflow power can become implementation burden when identity logic proliferates across applications.
