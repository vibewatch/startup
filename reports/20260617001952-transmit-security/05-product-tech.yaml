  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: machine-itdr-adoption
    missingEvidence: Named customer references, production deployment counts, and commercial maturity signals for Machine and Automation ITDR.
    whyItMatters: The feature page is detailed, but investors still need proof that the product is adopted beyond marketing copy before assigning material value to this adjacency.
    diligencePath: Ask management for GA dates, current ARR/customers for the module, and at least two reference customers.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE005
  - type: missing-source
    severity: material
    topic: trust-center-depth
    missingEvidence: Independent certifications, current subprocessor list, public incident history, and penetration-test or control-summary artifacts.
    whyItMatters: Security-native positioning is credible, but vendor-risk review remains incomplete without trust-center depth comparable to larger enterprise peers.
    diligencePath: Request the current SOC 2 / ISO package, subprocessor register, security whitepaper, and prior-12-month status / incident export.
    relatedQuestionRefs:
    - QE026
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: minor
    topic: deployment-topology
    missingEvidence: Detailed tenant-isolation and failover architecture beyond endpoint regions, custom domains, and SLA language.
    whyItMatters: Public docs show enterprise intent but not enough low-level design detail to independently assess multi-region failover or isolation boundaries.
    diligencePath: Request an architecture review with control-plane, data-plane, and regional-failover diagrams.
    relatedQuestionRefs:
    - QE014
    relatedTableRefs:
