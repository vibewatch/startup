- id: module-map-architecture
  title: Module map and operating architecture
  body: |-
    The best publicly documented architectural fact is that Mosaic is API-first and service-separated. Transmit publishes a clear service topology: the docs identify service families such as identity management and journeys, fraud prevention, and identity verification, while the services overview spells out distinct Authentication, Identity Management, Detection and Response, Identity Verification, and Identity Orchestration offerings. The result is a product map that looks modular rather than monolithic. That is reinforced by the SDK and API documentation, which describe different server paths and modules for orchestration, risk, identity verification, and WebAuthn.

    The developer posture is also stronger than many private-vendor marketing sites. Public docs publish a sandbox endpoint, region-specific production hosts, RBAC-protected API surfaces, mTLS and private-key-JWT options, and module-specific SDK imports. The npm package and GitHub estate show the company is not merely claiming an API platform; it is maintaining SDKs, wrappers, and training repos in public. The caveat is that the company still discloses architecture mostly through integration surfaces rather than through deep system-design documents. Investors can see the service boundaries and developer affordances, but not the full internals behind data stores, model pipelines, or tenant-isolation design.
