- id: TE004
  slug: trust-quality-compliance-table
  title: Trust / quality / compliance table
  columns:
  - Control / standard
  - Public status
  - Scope
  - Gap / risk
  - Diligence ask
  rows:
  - - Privacy role boundaries
    - Published privacy statement
    - Explains controller vs processor posture for website data, customer data, users, Identity Network Profile, and some service-improvement flows
    - Controller boundaries inside IDV-related service improvement still need contract review
    - Request DPA, controller/processor matrix, and data-retention schedules by module
  - - Passkey / phishing-resistant alignment
    - Strong external standards support
    - FIDO, W3C, Microsoft, passkeys.dev, and NIST align on passkeys as phishing-resistant public-key credentials
    - Alignment to standards does not alone prove perfect implementation quality
    - Request threat model, account-recovery controls, and passkey sync-abuse mitigations
  - - Availability commitment
    - Published contractual target
    - SLA states 99.99% availability target and 24x7 severity-1 response handling
    - No public incident history or achieved uptime statistics reviewed here
    - Request prior-12-month uptime reports and postmortems
  - - Operational resilience
    - Published process language
    - SLA references resilient facilities, redundant network/power, and formal change management
    - Does not disclose concrete cloud topology or region failover design
    - Request architecture review covering tenant isolation and region failover
  - - Independent trust artifacts
    - Partial public coverage only
    - Legal docs exist, but reviewed public set did not surface a rich trust-center artifact bundle
    - Subprocessors, independent certifications, and incident-disclosure depth remain thin publicly
    - Request SOC 2 / ISO reports, subprocessor list, penetration-test summary, and status-history export
  notes: This table separates what is explicitly published from what still requires private diligence artifacts.
