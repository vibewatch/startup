tables:
- id: TE001
  slug: product-module-asset-matrix
  title: Product module / asset matrix
  columns:
  - Module / SKU
  - Primary user / buyer
  - Public status / maturity
  - Differentiation signal
  - Diligence gap
  rows:
  - - Identity Orchestration
    - Identity, security, and digital-product teams
    - Core public pillar with dedicated solution page and no-code journey builder
    - Control-plane framing across registration, login, payments, and step-ups
    - Need customer evidence on how orchestration scales across many apps and tenants
  - - Authentication Services / passkeys
    - Consumer and workforce login owners
    - Mature and repeatedly featured in customer stories
    - Combines passkeys, biometrics, magic links, OTP, and fallback orchestration
    - Need breakdown of fallback rates and fraud outcomes outside flagship cases
  - - Identity Management / Organizations
    - CIAM and B2B admins
    - Documented in API reference and services overview
    - Unified user-store plus organizations/B2B surface in the same docs hub
    - Need clearer public detail on tenant isolation and admin-audit features
  - - Identity Verification
    - Onboarding, KYC, and fraud teams
    - Broad capability page plus API and SDK references
    - 10,000+ ID templates, liveness, deepfake detection, digital credentials
    - Need independent accuracy benchmarks and false-positive rates
  - - Fraud Prevention / Detection and Response
    - Fraud ops and risk teams
    - Mature with banking case study proof
    - Behavioral analytics, device signals, bot detection, and passkey-hijack protection
    - Need architecture detail on scoring, explainability, and model operations
  - - Machine and Automation ITDR
    - Security teams managing APIs, bots, and agents
    - Newer public surface with detailed feature page but thin customer proof
    - JIT identities, API inventory, shadow-agent controls, runtime behavior analysis
    - Need live customer references, GA dates, and adoption evidence
  notes: Rows distinguish well-documented mature modules from newer modules whose capability claims outpace public adoption proof.
