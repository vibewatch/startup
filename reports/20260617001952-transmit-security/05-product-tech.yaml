- id: differentiation-roadmap
  title: Differentiation, roadmap, and capability maturity
  body: |-
    Transmit's clearest public differentiation is stack consolidation. Both official and independent materials describe the platform as an attempt to collapse what is often a multi-vendor identity stack into one orchestration-led system: core CIAM, adaptive authentication, identity proofing, and fraud controls are meant to work together rather than be glued together after procurement. That positioning is especially credible in high-fraud regulated sectors, where customer stories repeatedly emphasize the combination of passkeys, behavioral signals, device intelligence, and step-up verification rather than any single feature. The official Microsoft content and the Aflac and bank case studies all reinforce that Transmit sells outcome bundles, not isolated widgets.

    Roadmap evidence is also unusually visible for a private vendor. The public release-notes site shows active 2026 changes in transaction monitoring, browser takeover protection, governance, orchestration flexibility, and risk analysis. Combined with public GitHub activity and current SDK packaging, that suggests a live product organization rather than a stale brochureware surface. The weaker area is maturity disclosure for the newest claims, especially machine-and-automation ITDR. The feature page is detailed, but public customer proof, adoption counts, and independent validation for that module remain thin relative to the older passkey and fraud surfaces.
  claimRefs:
