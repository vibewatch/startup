- id: trust-security-privacy-compliance
  title: Trust, safety, security, privacy, and compliance controls
  body: |-
    The trust story is stronger on control categories than on full transparency. On the positive side, the legal and standards evidence is real. Transmit publishes a privacy statement that clearly differentiates when it acts as processor versus controller, and its SLA describes change-management procedures, emergency maintenance, and support coverage in enterprise terms. The company's passkey narrative also lines up with external standards: FIDO, W3C, passkeys.dev, Microsoft, and NIST all describe the same phishing-resistant, public-key-credential model that Transmit is building around. This does not prove every implementation detail, but it does show the product is aligned to current authentication doctrine rather than inventing a proprietary standard.

    The missing pieces are just as important. Public materials reviewed here do not give a rich trust-center artifact set covering independent certifications, detailed subprocessor governance, or incident-history disclosure at the same depth some larger peers provide. Review content also shows that workflow governance and usability are not fully abstracted away by the low-code story. That means the investor conclusion should be balanced: the platform appears security-native and standards-aligned, but vendor diligence still needs deeper trust-center artifacts, implementation references, and module-specific proof before treating every control claim as fully underwritten.
