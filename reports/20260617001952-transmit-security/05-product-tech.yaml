callouts:
- calloutType: strength
  title: Real product breadth is visible in public developer surfaces
  body: Transmit is unusually explicit for a private identity vendor about API boundaries, region hosts, SDK modules, and public sample code. That does not replace a security architecture review, but it does separate Mosaic from vendors that market orchestration without exposing credible integration primitives.
  claimRefs:
  - CE011
  - CE012
  - CE016
  - CE017
  - CE018
  - CE019
- calloutType: risk
  title: Workflow power still appears to require specialist implementation muscle
  body: Independent reviews repeatedly say Transmit can become complex when rules, workflows, or app-by-app integrations proliferate. The product may reduce vendor sprawl, but that does not automatically reduce implementation burden for customers without strong solution-architecture teams.
  claimRefs:
  - CE037
  - CE039
- calloutType: recommendation
  title: Treat machine ITDR and trust-center depth as diligence workstreams, not settled facts
  body: The newest adjacency is machine-and-automation ITDR, and the thinnest public evidence is around independent trust artifacts such as certifications, subprocessors, and incident history. Management should provide customer references, GA/maturity dates, and the current trust packet before this chapter is considered fully underwritten.
  claimRefs:
  - CE010
  - CE028
  - CE040
