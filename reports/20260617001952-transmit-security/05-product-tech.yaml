chapter:
  number: 5
  title: Product & Technology
  summary: 'Transmit Security presents Mosaic as a genuinely broad identity-security platform: orchestration, authentication, fraud prevention, identity verification, and now machine-identity controls all sit on one API-first surface with active 2026 release evidence and public SDKs. The strongest proof is around passkeys, orchestration, and fraud outcomes at banks and insurers; the weakest proof is around low-level architecture transparency, trust-center depth, and customer adoption of the newer machine-and-automation ITDR offer.'
sections:
- id: product-definition
  title: Product definition in workflow terms
  body: |-
    Transmit Security now presents Mosaic less as a point CIAM product and more as a unified identity-security operating layer. The official platform and documentation surfaces consistently bundle identity management, fraud prevention, and identity verification under one brand, then expose orchestration as the control plane that determines which service should intervene during registration, login, account recovery, payments, or other high-risk actions. That framing matters because customers are not just buying a login SDK; they are buying a workflow engine that can choose among passkeys, OTP, identity proofing, device intelligence, and fraud controls inside one journey.

    In concrete user-workflow terms, the public surface shows five core jobs. First, Mosaic handles baseline authentication with passkeys, OTP, mobile biometrics, magic links, and social login. Second, it manages identities and user stores across customer and business contexts. Third, it inserts risk and fraud controls before, during, and after authentication. Fourth, it performs identity proofing for onboarding and step-up events. Fifth, it extends those ideas into machine and automation access rather than treating APIs and agents as an afterthought. The product is therefore broad enough to matter strategically for banks and insurers, but broad enough that implementation quality and governance become as important as feature count.
