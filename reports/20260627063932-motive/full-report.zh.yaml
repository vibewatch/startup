      - number: '6.4'
        title: 扩张轨迹与集中度风险
        blocks:
          - type: paragraph
            body: >-
              企业客户增长是 Motive 估值最核心的驱动项：494 个大客户（同比 +58%）意味着该客群到 2026 年 9 月可能超过 750 个，接近 Samsara 2021 年 IPO 时的 715 个大客户。按
              126% NDR 计算，每个大客户每年带来约 $79K 的增量 ARR，企业 ARR 贡献会继续复利放大。2024–2025
              年的关键企业客户胜利包括在卡车运输、油气等垂直行业替换传统供应商（Omnitracs、PeopleNet）。2025 年 9 月，Motive 在 ITC 专利案中击败
              Samsara，移除了企业销售阻力；此前因诉讼不确定性暂停评估的客户，也得以重启采购沟通。客户集中度风险看起来有限：市场认为没有单一客户超过 ARR 的 5%（与 Samsara 这类车队远程信息处理 SaaS
              的先例一致），但二级来源尚未明确确认，仍需在 S-1
              风险因素中核验。北美地理集中度长期看是扩张机会（欧洲、拉美、亚太），但如果国际增长需要在监管合规和本地销售基础设施上追加大量投入，也会带来执行风险。Motive 服务覆盖美国 50 个州；卡车运输 SMB
              客群带来广泛地域覆盖，相比纯企业客户模型，收入更分散。
            claimRefs:
              - CU002
