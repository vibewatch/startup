      - number: '8.2'
        title: 估值方法与可比公司组
        blocks:
          - type: paragraph
            body: >-
              Motive 的主要估值方法是 NTM ARR 倍数分析，这也符合高增长车队远程信息处理 SaaS 公司在 IPO 阶段的估值方式。按 $501M 过去 ARR 对应 $3.08B 隐含估值（6.1x），以及估算
              $635M NTM ARR（4.9x），Motive 位于公开 SaaS 市场中位数（6–7x EV/NTM Revenue）。主要可比公司是 Samsara（NYSE: IOT），交易倍数为 13–14x
              EV/Revenue，ARR 增长 29–30%，GAAP 盈利，毛利率 78%；其估值溢价由 3.5 倍 ARR 规模优势和盈利里程碑支撑。次要可比公司包括 Geotab（私有，估算 ARR
              ~$1B+，若上市估算 6–10x ARR）和 Verizon Connect（嵌在 Verizon 内，独立估算 3–6x ARR）。车队远程信息处理 M&A 交易（Mix
              Telematics/PowerFleet 约 4x 收入；PeopleNet/Trimble）给出的 M&A 底部为 $1.5–2.5B，明显低于当前进入估值。按 Rule of 40 框架，Motive
              得分约 13–18（28% 增长 + FCF 利润率改善），低于 35+ 的 SaaS 前四分位基准，但在改善中，也与 6–7x 倍数一致。Motive 每员工收入 $95K，而 Samsara 为
              $136K，显示 30% 效率差距，也意味着 IPO 后存在利润率改善机会。
