        title: 图表与证据
        blocks:
          - type: callout
            title: 市场处于中期采用阶段，仍有显著空间
            body: >-
              北美商用车渗透率 2023 年为 53.3%，预计 2028 年升至 80.6%，车队管理市场仍保留大量空白机会。既有龙头 Samsara 拥有 $1.46B ARR，却估计自身只拿下 $96B+ TAM 约
              1%；这意味着 Motive 的市场份额同样可能只是个位数百分比，双方都有巨大增长空间，不必陷入零和竞争。
            calloutType: insight
            claimRefs:
              - CM008
              - CM017
          - type: callout
            title: TAM 定义膨胀风险
            body: >-
              Motive 宣称的 $100B+ TAM 纳入了设备监控、支出管理和员工模块，但这些模块尚未产生实质收入。投资者应使用更窄的 $21B 北美商用车车联网 SAM 作为近期估值锚点，把 $100B+
              数字留给长期可选性。
            calloutType: insight
            claimRefs:
              - CM004
              - CM015
              - CM037
          - type: callout
            title: ELD 续约周期创造切换机会
            body: >-
              2017–2019 年初始 ELD 强制要求以 5 年合同推动车队采用。2024–2026 年续约窗口是少见的切换时点——车队运营商正在评估，是继续使用传统 ELD
              供应商（Omnitracs、Trimble），还是升级到 Motive 和 Samsara 这类 AI-native 平台。这个续约周期是结构性顺风，但可能不会以同等规模重复。
            calloutType: insight
