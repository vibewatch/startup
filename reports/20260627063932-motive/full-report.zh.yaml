      - number: '3.3'
        title: 切换成本与锁定机制
        blocks:
          - type: paragraph
            body: >
              车队车联网呈现多层切换成本，强烈有利于既有供应商留存。硬件替换（车辆网关和 AI 行车记录仪）仅资本成本就要每车 $200-500；对中型运营商而言，整支车队更换就是数十万美元级决策。合规数据——多年
              ELD、HOS、IFTA 和安全检查记录——存放在供应商平台；迁移历史数据很复杂，并在切换期带来监管过渡风险。与第三方调度、薪资、ERP 和货运板系统的工作流集成，在更换供应商后需要重建，增加 IT
              成本和运营停机。司机和车队经理再培训会消耗大量生产力。Motive 大客户 126% NDR 直接量化了装机基础的黏性——客户不是流失，而是扩大支出——并优于 Samsara 同 cohort 的 120%
              NRR。Motive 和 Verizon Connect 都执行标准多年合同（通常 2-3 年），作为额外合同锁定层，进一步强化切换的经济和运营壁垒。
            claimRefs:
              - CP012
              - CP013
              - CP018
              - CP024
              - CP030
