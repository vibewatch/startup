  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础分层与规模
        blocks:
          - type: paragraph
            body: >-
              截至 2025 年 9 月，Motive 服务超过 100,000 家客户，连接司机 1.3 million。客户基础横跨五个主要垂直：卡车运输（历史锚点，主要是 SMB 个体车主和 LTL/TL
              承运商）、油气（Halliburton、KLX Energy）、建筑（Ernst Concrete、Davey Tree）、现场服务（KONE、Cintas、ABM Industries）和物流（FedEx
              Freight、Maersk）。地理集中度主要在北美，S-1 未披露重大国际 ARR。整体平均 ACV 约每客户 $5,010（= $501M ARR / 100K 账户），反映历史客户基础中 SMB
              权重很高。分布高度双峰：494 个大型企业账户（ACV >$100K）平均每账户约 $304K，贡献总 ARR 约 30%；其余 99,500+ 个 SMB 账户年支出平均约 $3,500。SMB
              客户通过自助数字渠道获取（ELD 合规强制要求推动自然需求），企业账户则需要专门的现场销售团队、6-18 个月销售周期和多站点试点项目。Motive 销售组织分为内勤销售（SMB /
              中端市场）、中端市场团队（50-500 辆车）和现场企业团队（500+ 辆车）。卡车 SMB 细分受益于 FMCSA ELD
              强制合规这一监管底线，即便没有主动扩张，也能确保低流失、耐久订阅。油气和建筑垂直每次部署 ACV 最高，企业账户数增长最快。
