      - number: '1.4'
        title: 规模、里程碑与不利事件
        blocks:
          - type: paragraph
            body: >
              Motive 服务约 100,000 家企业客户，覆盖卡车运输、建筑、能源、现场服务、制造和公共部门，平台上活跃司机超过 1.3 million。公司 S-1 披露，截至 2025 年 9 月 30 日，公司拥有
              9,201 个核心客户（年合同价值 >$7,500，同比增长 17 %）和 494 个大型企业客户（ACV >$100,000，同比增长 58 %）。大客户 Net Dollar Retention 达 126
              %，核心客户为 110 %。毛利率约 70 %。截至 2025 年 9 月的过去十二个月收入约 $429 million，前九个月净亏损 $138.5 million。公司称 2024 年末已实现现金流转正。


              公司在 2024 年举办首届 Vision 24 客户大会，吸引近 500 名车队负责人，并发布 AI Omnivision 套件和 AI Coach 产品。2025 年 4 月 Vision 25
              上，Motive 推出扩展版 AI 产品套件，包括 Fatigue Index 检测、Lane Swerving Detection、Unsafe Parking Detection，以及 AI
              Workforce Management 系统。公司于 2025 年收购 InceptEV，补强 EV 车队管理能力，包括续航预测和充电规划。


              不利事件方面，Samsara 于 2024 年 1 月提起联邦诉讼，指控专利侵权、虚假广告、商业秘密盗窃和未经授权访问平台（Samsara 称 Motive 员工用虚假账户访问其平台超过 20,600
              次）。Motive 同月反诉。2025 年 4 月，San Francisco 陪审团一致认定 Motive 未侵犯 Omnitracs/Solera 提出的专利主张。2025 年 9 月 8 日，ITC 法官
              Doris Johnson Hines 认定不存在有效的 Samsara 专利侵权，也不存在 Section 337 违规。不过，Samsara 在 Delaware
              联邦法院关于商业秘密、虚假广告和不正当竞争的案件仍在进行。Delaware 法院还在 2025 年单独裁定，Motive 的网络责任保险公司必须为其 Samsara 诉讼提供抗辩，但不覆盖 Motive
              自己的主动诉讼。截至 2025 年 9 月 30 日，员工数为 4,508；公司还在 India 扩大研发，并于 2025 年 8 月进入 UK 市场。
