companyProfile:
  summary: >
    Motive Technologies（前身 KeepTruckin）是面向实体经济的 AI 驱动 Physical Operations Cloud 平台，服务卡车运输、油气、建筑和现场服务等行业。平台把 AI 视频安全（AI
    Dashcam Plus，由 Qualcomm Dragonwing QCS6490 驱动）、FMCSA 认证的 ELD/HOS 合规、GPS 车队管理和支出管理（燃油卡）整合进一个云原生系统。Motive 拥有 $501M
    ARR（同比增长 28%）、100K+ 客户、大客户 126% NDR，并已提交 S-1（2025 年 12 月），是与 Samsara 并列的两大 AI 车联网市场领导者之一。
  foundedDate: '2013-01-01'
  founders:
    - name: Shoaib Makani
      role: CEO 兼联合创始人
      background: |
        2013 年创立 KeepTruckin，将卡车运输合规数字化；随后带领公司更名为 Motive Technologies，并转向 AI 驱动的 Physical Operations Cloud。
      claimRefs:
