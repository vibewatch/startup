              分析师在内的负面声音指出，货运周期逆风和未决诉讼会在 $3.08B 进入点形成显著估值压制。若 Motive 实现 $620-640M NTM ARR，且公开市场重新定价到 7-8x NTM
              倍数，隐含股权价值将为 $4.3-5.1 billion，较 $3.08B 二级估值有 40-65% 上行。IPO 将是公开投资者的首次重大价格发现事件。关键机构投资者 Sequoia
