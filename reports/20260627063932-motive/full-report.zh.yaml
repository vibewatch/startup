      - number: '1.2'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >
              Shoaib Makani（CEO 兼联合创始人）毕业于 London School of Economics，曾任职于 Khosla Ventures、AdMob 和 Google，之后联合创立
              KeepTruckin。他仍与 Motive 的战略高度绑定；Samsara 2024 年诉讼还点名指控他指挥竞争不当行为。Obaid Khan（联合创始人兼 COO）有立法事务背景；Ryan
              Johns（技术联合创始人）曾任 Tapjoy 工程副总裁。三位联合创始人仍担任核心职务，构成原始创始团队，也意味着关键人集中风险较高。


              Chirag Shah 担任 CFO；公司正推进 IPO 准备和面向公开市场的多年审计，他是关键招聘。首席法务官 Shu White 在 ITC 作出不利于 Samsara 的裁定后主导了 Motive
              的对外沟通。董事会层面，Kleiner Perkins 合伙人 Ilya Fushman 于 2025 年 7 月重新加入董事会；他曾在 2015 年领投 Motive Series A。前 HP 和 eBay
              CEO Meg Whitman 于 2025 年加入董事会，在 IPO 前补强了重要的上市公司治理经验。公开资料未披露除上述人士外的完整董事会构成。
