          - type: callout
            title: 误报与 AI 偏见风险
            body: >
              用户评论持续提到误报（把安全驾驶错误标记为风险）是实质性产品质量问题。警报疲劳会降低司机采用和配合使用辅导系统的意愿，削弱核心安全价值主张。工会对 AI
              司机监控系统偏见和可解释性的审查日益增强，构成监管风险，可能要求 Motive 在产品路线图中加入可解释性功能和偏见审计，从而推高开发成本。
