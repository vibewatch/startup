              $500M ARR）下，$500M+ 基数上毛利率或运营效率每改善 1 个百分点，就会产生 $5M+ 年化 EBIT 影响，意味着盈利路径主要取决于收入规模和固定成本杠杆，而非结构性模式变化。公司未在 S-1
