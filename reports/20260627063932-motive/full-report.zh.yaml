      - number: '2.2'
        title: 市场规模与渗透率
        blocks:
          - type: paragraph
            body: >
              对 Motive 来说，北美车队管理市场是最相关的地理细分，贡献全球商用车车联网收入约 34%。截至 2023 年，北美商用车中部署的活跃车队管理单元估计为 17.4 million，非私有商用车渗透率为
              53.3%。预计到 2028 年，渗透率将升至 80.6%，意味着单元数仍将以 11.9% CAGR 强劲增长——五年内从 17.4 million 增至 30.5 million。


              美国底层卡车运输行业 2024 年货运收入为 $906 billion，注册卡车 14.89 million 辆，活跃机动车承运商约 580,000 家。其中 91.5% 运营 10
              辆或更少卡车——这一集中结构长期塑造了 Motive 以 SMB 为重心的 go-to-market 策略。美国有超过 1.1 million 家公司运营至少五辆商用车，构成 Motive
              这类平台可触达的车队运营商总体。


              ELD 强制要求创造了合规底线：截至 2024 年，美国约 4.8 million 辆卡车配备 ELD 单元，受监管长途承运商几乎全面采用。2025 年全球 ELD 市场规模为 $7.6
              billion。不过，Samsara 的市场分析（以其当前 $1.46B ARR 约占 $96B+ TAM 的 1% 为依据）显示，即便最成功玩家也只拿下可触达机会的一小部分，说明市场仍处于早到中期采用阶段。
