            body: >
              截至 2025 年 9 月 30 日的九个月净亏损为 $138.5 million（按确认收入计净利率 -42%），主要由大规模获客的销售和营销投入，以及 AI 产品开发 R&D 支出驱动。尽管 GAAP
              净亏损，Motive 称自 2024 年末以来经营现金流为正——这是关键里程碑，说明已安装 SaaS 订阅基础产生的现金足以覆盖运营成本，新增增量投资流向增长。2025 年 7 月 $150M 融资（约
