        - label: 收入验证
          value: 4 / 5
          unit: score
          detail: ARR 增长 28%；NDR 126%；FCF 转正；100K+ 客户
        - label: 竞争护城河
          value: 3 / 5
          unit: score
          detail: 中等护城河；切换成本强；AI 护城河可被 Samsara 复制
        - label: 单位经济性
          value: 4 / 5
          unit: score
          detail: 70% 毛利率；持续改善；FCF 转正；大型客户 NDR 126%
        - label: 风险评估
          value: 2 / 5
          unit: score
          detail: 高：诉讼进行中；仍在亏损；竞争劣势；受 SMB 周期影响
        - label: 估值纪律
          value: 4 / 5
          unit: score
          detail: 6x NTM ARR，位于市场中位数；入场估值合理、不算拉伸
        - label: 证据质量
          value: 3 / 5
          unit: score
          detail: 已提交 S-1；未披露 GRR；诉讼风险敞口未量化
