      - number: '2.3'
        title: 买方与细分格局
        blocks:
          - type: paragraph
            body: >
              车队管理买方横跨广泛行业、规模和采购模式。在运输与物流（占车联网市场 >43%）中，买方是承运商和 3PL 的车队经理或 VP 级运营高管。在建筑、油气和制造中，买方包括负责设备利用率和合规的
              HSE（健康、安全与环境）总监、运营经理和 CFO。预算负责人通常是运营或安全团队；超过 $250K 的总拥有成本批准由财务掌握。


              美国多数机动车承运商（91.5% 运营 ≤10 辆卡车）是个体车主或微型企业，技术决策看重成本、合规必要性和易用性，而不是企业级功能广度。这个 SMB 细分是 Motive 的历史强项，平均 ACV 接近每年
              $5,000。相比之下，大型企业（>100 辆卡车，占承运商 <0.7%，但贡献不成比例的车队收入）带来更高 ACV 和多产品采用，是 Motive 通过企业 go-to-market 投资追逐的扩张市场。


              非卡车垂直——建筑、油气和制造——数字化转型阶段早于受监管卡车运输。这些行业需要同时监控道路车辆和非道路重型设备（挖掘机、叉车、钻井设备），其车队管理软件采用受安全强制要求、保险成本压力和运营效率 ROI
              拉动。它们为 Motive 提供了超出监管驱动卡车基本盘的有意义 TAM 扩张机会。
