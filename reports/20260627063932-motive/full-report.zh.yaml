  foundingLocation: San Francisco, California
  headquarters: San Francisco, California
  productSummary: >
    Motive 平台由四个集成模块组成：AI Dashcam Plus（Qualcomm QCS6490、30+ AI 模型、立体视觉、1440p/ALPR）、ELD/HOS 合规（FMCSA 认证 Driver App）、Fleet
    Management（GPS 跟踪、资产跟踪、IFTA、调度）和 Spend Management（品牌燃油卡、费用跟踪）。专有 AI Omni 模型基于 1.3M+ 互联司机的实体经济运营数据训练。
  customerFocus: |
    主要服务卡车承运商和个体车主；正扩展到油气、建筑、现场服务，以及任何运营实体资产的企业。关键企业客户包括 FedEx Freight、Maersk、Halliburton、KONE、Cintas、Davey Tree 和 ABM。
  businessModel: |
    硬件加 SaaS 订阅模式（AI 行车记录仪按硬件成本销售，并收取持续 SaaS 费用），同时由燃油卡交换费带来交易型支出管理收入。先落地再扩张的销售路径推动大客户 NDR 达 126%、核心客户达 110%。
