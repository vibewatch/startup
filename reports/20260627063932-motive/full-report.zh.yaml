            body: >
              Motive 约 70% 的毛利率反映出硬件加软件的商业模式。硬件（车辆网关、AI 行车记录仪、资产追踪器）通常按成本或接近成本出售，毛利主要来自高毛利 SaaS 订阅。这在结构上类似 Samsara IPO
              时的模式，不过随着软件占比随规模提升，Samsara 毛利率已提高到 77-78%。整体平均 ACV 约 $5,010（= $501M ARR / 100K+ 客户），受 Motive 历史上以 SMB /
              卡车运输为重心驱动。不过，494 个大客户（ACV >$100K，同比增长 58%）构成快速增长的高 ACV cohort，平均每账户约 $304K——与 Samsara 同规模细分 $323K 平均 ARPU
              趋同。大客户 126% NDR 和核心客户 110% NDR 证实装机基础内扩张收入动能强，为公司提供耐久的有机增长引擎。
