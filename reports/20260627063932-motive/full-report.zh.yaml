    type: bar
    title: 估值敏感性——ARR 倍数情景
    summary: 以基准情形 NTM ARR $635M 测算，展示不同 NTM ARR 倍数（4x 至 10x）下 Motive 隐含股权价值。
    layout: standard
    approximationNotes: $635M NTM ARR 假设在 $501M 过去 ARR 基础上增长 27%；所列数值只是敏感性示例点，不是目标价格。
    claimRefs:
      - CV009
      - CV010
      - CV011
      - CV004
    data:
      items:
        - label: 4x NTM ARR 情景
          value: 2540
          detail: 弱熊情景；严重诉讼结果或增长失速
        - label: 5x NTM ARR 情景
          value: 3175
          detail: 熊市情景；ARR 减速 + 诉讼折价
        - label: 6x NTM ARR 情景
          value: 3810
          detail: 基准情景；市场中位倍数
        - label: 7x NTM ARR 情景
          value: 4445
          detail: 偏强基准；诉讼解决；利润率扩张
        - label: 8x NTM ARR 情景
          value: 5080
          detail: 牛市情景；企业客户加速 + 诉讼解决
        - label: 10x NTM ARR 情景
          value: 6350
          detail: 强牛情景；走出可比 Samsara 的增长和盈利路径
  - id: FV003
    type: range
    title: 估值 / 回报区间——熊市到牛市情景
    summary: 给出低 / 基准 / 高估值区间，明确情景假设并计算期望值。
    layout: standard
    approximationNotes: 情景价值来自 NTM ARR 倍数分析；概率权重为分析师估计（熊市 20%、基准 50%、牛市 30%）。
    claimRefs:
      - CV009
      - CV010
      - CV011
      - CV037
    data:
      items:
        - label: 隐含股权价值（$B）
          low: 3
          mid: 3.8
          high: 5.4
          detail: 以 5x、6x、8x NTM ARR 倍数对应熊市 / 基准 / 牛市情景
        - label: 从 $3.08B 入场估值计算的总回报（%）
          low: -2.6
          mid: 23
          high: 75
          detail: 下行有限；若诉讼解决，上行可观
        - label: EV 加权回报（%）
          low: 0
          mid: 30
          high: 0
          detail: 概率加权期望回报（20/50/30 权重）
