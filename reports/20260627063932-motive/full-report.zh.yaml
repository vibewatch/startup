      - number: '5.5'
        title: 图表与证据
        blocks:
          - type: callout
            title: 集成平台形成多层护城河
            body: >
              Motive 把 AI Dashcam、ELD 合规、车队跟踪和支出管理集成在单一 AWS 托管平台上，形成的切换成本远高于任一单独模块。车队运营商积累多年合规数据、AI
              辅导下的司机行为记录和燃油支出分析，这些数据难以轻易迁移。由 Qualcomm QCS6490 驱动、同时运行 30+ 行为检测器的 AI Omni 模型，代表了硬件 AI
              边缘能力；纯软件竞争者若没有类似芯片投入，很难复制。
