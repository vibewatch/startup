  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >
              Motive 所处市场竞争层级清晰。Samsara（NYSE: IOT）是首要直接对手，ARR 规模为 Motive 的 3×（$1.46B vs.
              $501M），在中端市场和企业车队细分正面竞争，产品范围高度重叠——两家公司都想成为「Physical Operations Clouds」。Geotab 按联网车辆数（4.6M）是最大私营玩家，收入
              $681M，但缺少 Motive 对 AI 安全的强调。Verizon Connect 把 Verizon 的运营商基础设施带入车队管理，定价低于
              Motive（$20-28/vehicle/month），重可靠性而非 AI 创新。Lytx 是视频车联网专家，正通过 2025/2026 年 Lytx+ 和 LytxOne 发布转向完整车队平台，直接挑战
              Motive 的行车记录仪领导地位。Trimble 占据企业货运 / TMS 空间，为大型承运商提供深度 ERP 集成。Platform Science 等 OEM 内嵌平台（由 Volvo 和 Daimler
              truck groups 支持）通过提供原厂安装软件生态，在更长周期上威胁 Motive 的硬件层。2025 年末，Geotab 收购 Verizon Connect 国际业务单元，推动车联网市场整合，并可能扩大
              Geotab 的直销覆盖。
