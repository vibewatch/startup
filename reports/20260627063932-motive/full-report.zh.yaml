      - number: '8.4'
        title: 推翻投资逻辑触发项与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              若发生以下任何事件，投资逻辑即告破裂：（1）Samsara 商业秘密案裁决不利，包含重大损害赔偿（>$200M）或要求重做功能的产品禁令——立即重审投资逻辑；（2）IPO 后 ARR 增长连续两个季度低于
              18%——提示结构性减速；（3）IPO 定价低于 $2.5B 隐含估值——提示机构投资者拒绝该逻辑；（4）IPO 路演期间，一个大型企业客户（>$5M ACV）公开转投 Samsara。IPO
              后关键监测指标包括：企业客户数（>$100K ACV）增长率、季度 NDR 披露、Samsara 诉讼日程节点、毛利率轨迹、印度工程团队人数质量指标。投资前的最终尽调问题包括：完整审阅 S-1
              风险因素以量化诉讼敞口；获取独立于 NDR 的总收入留存率（GRR）数据以确认自愿留存；S-1 后企业销售管线拆分（2026 年 Q1 签约额）；Samsara 商业秘密案时间表的独立法律意见；印度工程质量与 6
              个月流失 KPI；确认前十大客户收入集中度（确认没有单一客户 >5% ARR）。除此之外，退出准备度较强：S-1 已提交、投资者基础具备机构质量、FCF 为正、NDR 强劲、企业客户增长叙事清晰。
