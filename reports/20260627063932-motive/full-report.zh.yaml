chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与使命
        blocks:
          - type: paragraph
            body: >
              Motive Technologies 于 2013 年 6 月 1 日在 California 州 San Francisco 注册成立，最初名为 KeepTruckin。Shoaib
              Makani（CEO）、Obaid Khan（COO）和 Ryan Johns（技术联合创始人）共同创立公司，目标是把卡车运输运营搬到线上；最早产品是电子日志应用，用于满足联邦 ELD 强制要求下的
              hours-of-service（HOS）合规。


              2022 年 4 月，公司更名为 Motive，使命从卡车运输扩展到整个「实体经济」——覆盖卡车运输与物流、建筑、油气、农业、现场服务、制造、公用事业和公共部门。更名与 $150 million Series F
              同步完成，也明确了 Automated Operations Platform 的愿景：把车辆、设备和设施接入云端，用 AI 在单一集成系统里自动化安全、合规、车联网、支出管理和员工监督。


              截至报告日期，Motive 总部位于 1355 Market Street, 11th Floor, San Francisco, CA 94103。公司在 2025 年 12 月提交 S-1，计划以 MTVE
              为代码在 NYSE 上市，目前仍为私营公司。公司产品标语是「Integrated Operations Platform for the Physical Economy」。CEO Shoaib Makani
              将平台描述为「实体经济企业的中央操作系统，把车辆、司机和设备的数据统一到一个界面」。
