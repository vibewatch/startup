      - number: '1.3'
        title: 融资历史与资本
        blocks:
          - type: paragraph
            body: >
              自 2013 年以来，Motive 多轮股权融资累计约 $717 million。核心投资方是 Kleiner Perkins（2015 年领投 Series A，并领投 2025 年 7
              月延展轮），共同投资方包括 Google Ventures（GV）、Insight Partners、Greenoaks、Index Ventures、G2 Venture
              Partners、BlackRock、IVP、Scale Venture Partners，以及最新加入的 AllianceBernstein。


              关键一轮是 2022 年 5 月 Series F，以 $2.85 billion 投后估值融资 $150 million，巩固了 Motive 的独角兽地位，倍数约 2.85x。此前 2021 年 6 月完成
              $190 million Series E（由 G2VP 和 BlackRock 领投）。2025 年 7 月，Motive 又融资 $150 million，仍由 Kleiner Perkins
              领投，AllianceBernstein 作为新投资方加入。2025 年这轮融资与公司自 2024 年末以来现金流转正、ARR 接近 $500 million 一并宣布，更像一轮战略性 IPO
              前融资，而非单纯由流动性驱动。Forge 二级市场截至 2025 年 7 月隐含的 Series F 优先股估值为 $3.08 billion。


              Motive 于 2025 年 9 月 2 日保密提交 IPO，并于 2025 年 12 月 23 日公开提交 S-1，目标是在 NYSE 以 MTVE 为代码上市，簿记管理人为 J.P.
              Morgan、Citi、Barclays、Jefferies 等。S-1 显示公司计划至少募集 $100 million。截至 2026 年 5 月，IPO 尚未定价或开始公开交易，二级市场指示价接近
              $20/share。
