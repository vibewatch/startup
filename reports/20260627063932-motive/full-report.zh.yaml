      - number: '5.2'
        title: AI Dashcam Plus——硬件与边缘 AI 技术
        blocks:
          - type: paragraph
            body: >
              AI Dashcam Plus 是 Motive 的核心硬件产品和技术差异化点。它由 Qualcomm Dragonwing QCS6490 处理器驱动——这是一款商用 IoT 级芯片，处理能力为 Motive
              上一代行车记录仪的 3x，可同时运行超过 30 个 AI 模型，实时检测风险驾驶行为。Dragonwing QCS6490
              专为边缘计算机视觉打造，提供车载推理，降低延迟，并能在不等待云端往返的情况下立即发出车内警报。两个同步前向镜头提供立体视觉和深度感知，可准确检测 Forward Collision Warning、Lane
              Swerving 和 Close Following。1440p 变焦镜头支持 Automated License Plate Recognition（ALPR，2026 年推出）。双 SIM、多运营商 LTE
              确保即便在单一运营商覆盖有限的乡村走廊，也能持续上传视频和跟踪。内置备用电池和防篡改检测机制在事故和线缆断开场景下保持录制连续性，确保保险和诉讼证据完整。夜视、降噪音频和 Driver Privacy Mode
              补齐了功能集。
