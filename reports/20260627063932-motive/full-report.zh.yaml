      - number: '8.3'
        title: 牛市、基准与熊市情景
        blocks:
          - type: paragraph
            body: >-
              三个估值情景框定投资回报。熊市情景（$3.0B，下行 2.6%）：ARR 增长降至 20%，NTM ARR 为 $600M，5x 倍数反映诉讼结果不利或市场降级——基本持平于当前 $3.08B
              进入估值。基准情景（$3.8B，上行 23%）：ARR 增长维持 27%，NTM ARR 为 $635M，6x 倍数反映企业客户动能延续，且诉讼在没有不利裁决的情况下被管理住。牛市情景（$5.4B，上行
              75%）：ARR 增长加速至 35%，诉讼有利解决，NTM ARR 为 $675M，8x 倍数反映企业优先叙事重估以及毛利率改善至 72–74%。概率加权期望值：熊 20%、基准 50%、牛 30% →
              隐含价值约 $4.0B（上行 30%）。牛市情景的关键催化剂包括：（1）Samsara 商业秘密案有利和解或驳回；（2）2026 年企业客户数量持续增长 40–50%；（3）毛利率扩张至
              72%+，验证软件收入占比提升；（4）到 2026 年下半年看清 GAAP 盈利时间表。如果诉讼风险可被圈定，下行不对称（熊市仅比进入价低 2.6%）与上行空间（牛市 75%）构成有吸引力的风险回报。
