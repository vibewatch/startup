              million，较约 $391M 同比增长 28%。已确认 LTM 收入约 $429 million，反映了签约 ARR 与确认收入之间正常的 SaaS 递延收入差。2025 年前九个月收入为 $327.3
              million，同比增长 22%。公司目标以 MTVE 为代码在 NYSE 上市，J.P. Morgan 为主承销商。ARR 增速已从 2021-2022 年的 40%+ 放缓到 2025 年的
