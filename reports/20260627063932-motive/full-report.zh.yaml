      - number: '6.3'
        title: 留存、满意度与扩张动态
        blocks:
          - type: paragraph
            body: >-
              Motive 大客户 Net Dollar Retention 为 126%，核心客户为 110%，显示先落地再扩张机制强。扩张路径遵循可预测的模块采用顺序：ELD/HOS 合规（强制入口点、低 ACV）→
              GPS 车队跟踪 → AI 行车记录仪安全 → 资产跟踪 → 司机工作流 → 支出管理（燃油卡 + 费用）。随着车队规模增长和额外模块采用，这一路径可把账户从每年 $5K 合同推高到 $100K+。Spend
              Management 产品（2023-2024 年推出）是近期交叉销售项，每账户每年增加 $5-20K，并推动大客户 126% NDR。G2 在多个 2024-2025 季度将 Motive 评为 #1
              车队管理领导者，2,900+ 条评论评分 4.4/5，客户满意度分数高出 Samsara 15-18%。Capterra 上 Motive 1,600+ 条评论评分 4.5/5。不过，Comparably 独立
              NPS 为 29，在 Motive、Samsara（34）、Lytx（54）和 Spireon（52）中排第 4，显示满意度缺口，尤其在 SMB。Capterra 和 BBB
              的负面评论集中在账单纠纷、合同取消困难和客服响应时间。三年期多年企业合同形成合同留存，支撑披露的 NDR 指标，但可能遮蔽自愿留存率；公司未单独披露该指标。客户支持为 24/7 电话加应用内聊天，企业账户配专属
              CSM；Forbes Advisor 指出，支持响应时间是 SMB 客户反复提到的负面主题。
