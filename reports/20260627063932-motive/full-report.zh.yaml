      - number: '3.2'
        title: Samsara 是首要直接竞争者
        blocks:
          - type: paragraph
            body: >
              Samsara 是 Motive 最关键的竞争对手。Samsara 拥有 $1.46B ARR 和 $20B 市值，在 R&D、销售和 AI 模型训练上资源明显更强。Samsara FY2025 处理 14
              trillion 个数据点（同比增长 50%），而 Motive 拥有 1.3M 互联司机；这个数据量差距长期可能累积成安全评分和预测性维护上的 AI 模型准确率优势。Samsara 自行发布的对比把
              Motive 描述为企业可扩展性和 API 深度较弱。不过，Motive 以更具竞争力的中端车队价格、更高 NDR（大客户 126%，而 Samsara 大客户 NRR 为 120%），以及 2025 年 9 月
              ITC 胜诉（认定 Motive 行车记录仪产品不侵犯 Samsara 专利）反击。平行的 Delaware 商业秘密诉讼仍在进行：Samsara 指控 Motive 高管用虚假客户账户访问 Samsara
              机密系统，并招募员工提取专有数据；Motive 否认该主张。两家公司 ARR 同比增长均为 28-33%，说明市场仍在扩张，而非纯粹零和竞争。
