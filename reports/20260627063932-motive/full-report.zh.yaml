    type: kpi
    title: 投资 KPI——可提交 IC 的评分
    summary: 从市场地位、验证、护城河、经济性、风险、估值和证据质量维度，形成投资委员会评分看板。
    layout: standard
    approximationNotes: 评分为分析师按 1-5 分制评估，并非公司披露评级。
