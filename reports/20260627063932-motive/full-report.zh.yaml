  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与边界
        blocks:
          - type: paragraph
            body: >
              Motive Technologies 竞争的市场是其所称的「physical operations
              management」——一个宽泛类别，涵盖管理车辆车队、移动设备、实体资产和现场员工所需的软件、硬件和数据服务，面向卡车运输、物流、建筑、油气、制造、农业、公用事业和政府等重资产行业。该类别属于更大的商用车车联网和车队管理市场，但不同分析报告对范围的定义差异很大。


              较窄定义聚焦商用车的车队跟踪、ELD 合规、司机安全和维护管理，对应市场规模估计从 $24.3 billion（GMI，2024）到 $61.5 billion（GVR，2024）不等；差异主要来自是否纳入
              OEM 内嵌系统和更广义的联网车辆硬件。Motive 和 Samsara 在公开文件中采用的更宽实体运营定义，把 TAM 扩大到超过 $96 billion（Samsara S-1，2021）至超过 $100
              billion（Motive S-1，2025），原因是纳入设备监控、支出管理、员工工时考勤，以及道路车辆和非道路设备的资产可视化。


              尽调中最相关的市场边界是：（1）面向商用机动车承运商的 ELD / HOS 合规软件（核心市场，美国受监管细分已接近饱和）；（2）AI 驱动的车队安全和车联网（增长细分；行车记录仪、司机
              coaching、事故预防）；（3）超出道路车辆的设备和资产监控；（4）车队支出管理（燃油卡、费用控制）。每一层都会提高单客户收入，并把可服务市场显著推高到 ELD 基线之上。
