      - number: '7.5'
        title: 展示材料
        blocks:
          - type: callout
            title: Samsara 商业秘密案是严重程度最高的未决风险
            body: >-
              $30.3M 虚假广告仲裁损害赔偿已经确认，且可管理。北加州联邦法院尚未解决的商业秘密盗用主张，是严重程度最高的开放风险；损害赔偿敞口尚未量化，可能高达数亿美元。不利裁决若附带禁令救济，可能要求产品重做，并对
              IPO 造成实质挫折。这是该投资最核心的推翻投资逻辑风险。
