      - number: '7.2'
        title: 竞争与市场结构风险
        blocks:
          - type: paragraph
            body: >-
              Motive 是该品类第二名，而第一名 Samsara 按 ARR 计大 3.5 倍（$1.75B vs $501M），已达到 GAAP 盈利，毛利率更高（78% vs 70%），企业客户数超过 5
              倍。Samsara 的规模优势让其能在 AI 模型训练（更多驾驶员数据）、企业销售和产品宽度扩张上投入更多。这一竞争压力是 Motive 企业上行战略的主要风险。Platform Science 获
              Volkswagen 支持，并与 Navistar、Kenworth 等 OEM 集成，构成长期结构性威胁：新商用卡车预装 Platform Science 软件后，Motive
              硬件加软件模型可争取的后装设备机会会收缩。不过，约 1,300 万辆商用车存量提供了足够长的跑道，OEM 替代在变得重要之前仍需时间。Geotab（$681M 收入）和 Verizon Connect（42K
              客户）在 SMB 和中端市场竞争。AI 模型商品化是中期风险：随着 Google、NVIDIA 和开源通用视觉 AI 模型改进，Motive 基于实体经济训练数据形成的专有 AI
              优势可能被侵蚀，除非其持续补充更多边缘案例和垂直行业数据。Samsara 的诉讼压力叠加竞争规模优势，使竞争环境长期保持高压。
