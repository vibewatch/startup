  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律与诉讼风险
        blocks:
          - type: paragraph
            body: >-
              Motive 当前最严重的活跃风险，是北加州联邦法院的 Samsara 诉讼组合（从 Delaware 转入，案号 1:24-cv-00084）。该案始于 2024
              年，指控包括盗用商业秘密、专利侵权、虚假广告和不正当竞争。2025 年 9 月，ITC 对专利请求作出有利于 Motive 的裁决——这是重大胜利，移除了进口禁令威胁。但截至 2026 年 5
              月，商业秘密盗用主张仍未解决。另一起仲裁中，仲裁员认定 Motive 作出「字面虚假」陈述，裁定其向 Samsara 支付 $30.3M 损害赔偿，并永久禁令要求移除一项 AI 行车记录仪对比基准研究。这笔
              $30.3M 负债已确认并在 S-1 中披露；剩余商业秘密敞口尚未量化，取决于被指盗用的范围，可能从数千万美元到数亿美元不等。Samsara 还在推进 IPR2026-00034 程序，试图在 ITC 裁决后使
              Motive 专利无效。Omnitracs 案已于 2025 年 4 月排除。诉讼负担合在一起，会带来法律抗辩成本、管理层分心，并在 IPO
              阶段形成实质估值压制。如果商业秘密裁决不利，并包含要求重做产品功能的禁令，IPO 后运营风险将相当显著。
