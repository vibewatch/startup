company:
  name: Spirit AI
chapter:
  number: 2
  title: Market Analysis
  summary: 'Spirit AI''s real addressable market is not the full global humanoid fantasy but a narrower China-first wedge in semi-structured

    industrial, logistics, and commercial-service workflows where robots create both operational ROI and proprietary training data.

    Public evidence supports real demand tailwinds — China already dominates industrial robot deployment, published humanoid forecasts

    are growing quickly, and Spirit has named partners in CATL, JD, and Bosch — but it does not yet support a clean Spirit-specific

    SAM or SOM. The central diligence conclusion is that Spirit may have a credible market-entry lane precisely because it is not

    trying to monetize every humanoid use case at once, even as headline TAM numbers remain noisy and often overstated for its present scope.'
sections:
- id: market-boundary-and-status-quo
  title: Market boundary, included spend, and status-quo substitutes
  body: 'Spirit AI should not be valued against the entire global robotics market just because its stated mission is broad.

    The public evidence is narrower. Today the company has disclosed a wheeled force-controlled humanoid, a battery-line

    deployment at CATL, a retail-service deployment with JD, and a two-year industrial data-and-component partnership with

    Bosch. Those facts define a real market boundary: semi-structured factory, logistics, and commercial-service workflows

    where a robot can either replace repetitive manual handling or produce proprietary action data under supervision.

    Included spend therefore covers robot hardware, integration, deployment services, teleoperation infrastructure, data

    collection, and ongoing model updates tied to those workflows. Excluded spend includes the much larger pool of fixed-arm

    industrial automation, generic warehouse software, and speculative consumer-home robot demand that has not yet been

    validated by Spirit AI''s public evidence. In its current form, the company competes first against human labor,

    purpose-built industrial automation, kiosks, and mobile-manipulation substitutes rather than against a fully formed

    household robot market.'
