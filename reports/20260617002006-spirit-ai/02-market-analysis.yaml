tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Why it matters for Spirit AI
  rows:
  - - Battery-line embodied automation
    - Robot hardware, deployment, line integration, teleop/data collection, ongoing model tuning
    - Generic MES software, fixed-arm cells with no mobility/data loop, upstream battery chemistry R&D
    - Battery manufacturers and plant operations leaders
    - Matches the CATL proof point and shows where ROI can be measured today
  - - Factory and logistics embodied platforms
    - Sensors, actuators, robot brains, site deployment, component validation, multi-site factory data loops
    - Traditional AGV fleets without manipulation, generic warehouse management software, consumer robots
    - Industrial automation teams and ecosystem partners such as Bosch
    - Bosch partnership indicates this is a core channel for scale-up
  - - Retail and commercial service robots
    - Store deployment, remote operations, service workflow software, multimodal data collection, fleet support
    - Pure kiosks, static signage, generic chatbots without physical interaction
    - Retail operations and innovation teams such as JD
    - This is Spirit AI's clearest non-factory proof surface today
  - - Future household robots
    - Potential long-run consumer hardware, support, and cloud intelligence services
    - All current disclosed B2B spend; any unvalidated consumer subscription TAM
    - Unknown; consumer buyer not yet evidenced
    - Important to vision but unsupported by current deployment evidence
  notes: Boundary is drawn from Spirit AI's disclosed partnerships and deployments, not from the company's long-run aspiration alone.
