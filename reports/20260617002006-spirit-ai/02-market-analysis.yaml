  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: spirit-initial-sam
    missingEvidence: Public unit economics, contract values, deployment counts, and task-level revenue contribution for CATL, JD, and Bosch-linked programs.
    whyItMatters: Without these numbers, Spirit AI's serviceable market and any near-term SOM remain narratives rather than underwriting inputs.
    diligencePath: Request customer-by-customer deployment counts, payback assumptions, and signed commercial terms for disclosed partner programs.
    relatedQuestionRefs:
    - QM009
    - QM024
    - QM025
  - type: missing-source
    severity: material
    topic: autonomy-versus-teleop-split
    missingEvidence: A scenario-by-scenario breakdown of how much Moz1 work is autonomous, shared autonomy, or fully teleoperated in production conditions.
    whyItMatters: Teleoperation can be a rational go-to-market bridge, but its cost and operational overhead materially change gross-margin and scale assumptions.
    diligencePath: Ask for operating playbooks and labor models for CATL and JD deployments, including teleoperator minutes per task hour.
    relatedQuestionRefs:
    - QM013
    - QM017
    - QM018
  - type: stale
    severity: minor
    topic: consumer-roadmap-timing
    missingEvidence: An updated public roadmap explaining when Spirit AI expects to move beyond B2B industrial and retail environments toward consumer ownership.
    whyItMatters: The company's mission statement is consumer-flavored, but current evidence is enterprise-first; reconciling the two affects narrative and valuation timing.
    diligencePath: Request a milestone roadmap showing required safety, battery, data, and channel gates before any home-market launch.
    relatedQuestionRefs:
    - QM019
