- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - China supply-chain density and EV-adjacent components
    - Driver
    - Current
    - Speeds prototyping, lowers part costs, and helps fast iteration
    - Verify which Spirit AI subsystems are internally controlled versus partner-supplied
  - - Partner-owned live environments (CATL, JD, Bosch)
    - Driver
    - Current
    - Improves data collection and shortens path from demo to task-specific production proof
    - Request conversion metrics from pilot tasks to contracted multi-site rollouts
  - - Industrial safety and labor-substitution ROI
    - Driver
    - Current
    - Hazardous precision work creates measurable willingness to pay
    - Quantify uptime, scrap reduction, and labor replacement on disclosed tasks
  - - Battery life, reliability, and uptime limits
    - Constraint
    - Current
    - Keep deployments in bounded, supervised, or intermittently charged environments
    - Request runtime, failure-rate, and maintenance data for Moz1
  - - Shared autonomy and teleoperation dependence
    - Constraint
    - Current
    - Raises operating cost and weakens the case for general-purpose autonomy claims
    - Disclose how much of each deployment is teleoperated versus autonomous
  - - Early market estimate divergence
    - Constraint
    - Current
    - Makes TAM-led valuation arguments fragile without bottom-up proof
    - Build Spirit-specific SAM from real workflow economics rather than headline TAMs
  - - Home/consumer trust and safety gap
    - Constraint
    - Long-dated
    - Keeps the consumer narrative aspirational even if the long-term vision is large
    - Clarify whether the roadmap prioritizes B2B before any household motion
  notes: Rows mix macro drivers with execution constraints because the relevant question for Spirit AI is not whether humanoids are a large future category, but how quickly constrained workflows can convert into repeatable enterprise demand.
