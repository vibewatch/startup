- id: TM003
  title: Segment / buyer map
  columns:
  - Segment
  - Economic buyer
  - User
  - Payer / budget logic
  - Workflow
  - Adoption trigger
  rows:
  - - Battery PACK line task automation
    - Plant operations / automation leader at battery manufacturer
    - Line operators and maintenance staff
    - CapEx / productivity / safety budget
    - High-voltage connector insertion and line-side inspection
    - Fewer defects, safer handling, worker-level takt time
  - - Factory / logistics embodied data loops
    - Manufacturing innovation, automation, or robotics center
    - Warehouse or factory operators
    - Pilot plus integration budget with component and data-loop upside
    - Real-world task capture, model iteration, component validation
    - Need for repeatable data, hardware validation, and flexible automation
  - - Retail service deployment
    - Retail operations or innovation team
    - Store staff plus teleoperators
    - Opex / marketing / service experimentation budget
    - Customer-facing demos such as coffee service, guidance, and product interaction
    - Need for differentiated service and training data
  - - Ecosystem / partner channel
    - Strategic partner or shareholder with industrial footprint
    - Partner engineering and solution teams
    - Shared commercialization and channel-development logic
    - Co-development, supply-chain access, channel expansion
    - Desire to internalize embodied AI capability without building core models from scratch
  notes: Buyer-user-payer roles differ materially by scenario; Spirit AI's current go-to-market is best read as enterprise workflow adoption rather than generalized robot purchasing.
