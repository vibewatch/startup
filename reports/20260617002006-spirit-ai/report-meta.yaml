  productSummary: Embodied-AI stack centered on Moz1 force-controlled humanoid hardware, Spirit VLA foundation models, teleoperation/data-capture tooling, and developer-facing SDK and simulation resources.
  customerFocus: Industrial manufacturers, logistics operators, retail scenario partners, and technically sophisticated early adopters needing supervised embodied-AI automation in structured environments.
  businessModel: Hardware deployments plus integration, teleoperation and data-collection services, and model fine-tuning / software workflow support.
