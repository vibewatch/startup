  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              Spirit AI should not be valued against the entire global robotics market just because its stated mission
              is broad.

              The public evidence is narrower. Today the company has disclosed a wheeled force-controlled humanoid, a
              battery-line

              deployment at CATL, a retail-service deployment with JD, and a two-year industrial data-and-component
              partnership with

              Bosch. Those facts define a real market boundary: semi-structured factory, logistics, and
              commercial-service workflows

              where a robot can either replace repetitive manual handling or produce proprietary action data under
              supervision.

              Included spend therefore covers robot hardware, integration, deployment services, teleoperation
              infrastructure, data

              collection, and ongoing model updates tied to those workflows. Excluded spend includes the much larger
              pool of fixed-arm

              industrial automation, generic warehouse software, and speculative consumer-home robot demand that has not
              yet been

              validated by Spirit AI's public evidence. In its current form, the company competes first against human
              labor,

              purpose-built industrial automation, kiosks, and mobile-manipulation substitutes rather than against a
              fully formed

              household robot market.
