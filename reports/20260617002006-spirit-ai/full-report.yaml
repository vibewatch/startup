          - type: callout
            title: The biggest risk is denominator quality
            body: >-
              The current mark may be reasonable in a hot sector, but without audited revenue, margin, or preference
              terms investors still do not know whether they are paying for operating performance or just protected
              strategic upside.
            calloutType: risk
            claimRefs:
