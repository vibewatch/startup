      - number: '2.3'
        title: Buyer, user, and payer map across current disclosed segments
        blocks:
          - type: paragraph
            body: >-
              Spirit AI's disclosed segments are structurally different on the buying side even though they all
              reinforce the same

              model-and-data flywheel. In the CATL and Bosch-like industrial path, the budget owner is a plant
              operations, automation,

              or manufacturing-innovation leader who cares about throughput, precision, safety, and labor substitution.
              Operators on

              the line are users, not economic buyers. In JD-style service deployments, enterprise operations or
              innovation teams own

              the budget while store staff and teleoperators handle day-to-day use. That distinction matters because
              adoption does not

              start with a general-purpose robot purchase order; it starts with a workflow owner willing to fund
              teleoperated pilots,

              integration, and data collection until the robot can run enough of the task autonomously to prove ROI. The
              public

              evidence also suggests that ecosystem partners are buyers of another sort: Bosch brings channels and
              components, while

              JD and CATL bring live environments that function as both customers and training grounds.
