      - number: '7.3'
        title: Export-control exposure and ecosystem dependence
        blocks:
          - type: paragraph
            body: >-
              Spirit AI is not publicly identified as an Entity List target, but that does not eliminate export-control
              risk. BIS and CSIS make clear that advanced AI and compute restrictions

              on China are an active, evolving policy instrument aimed at constraining access to the kinds of chips,
              tooling, and high-performance systems that matter for embodied-AI training

              and inference. Spirit's own disclaimer explicitly tells users to comply with export-control laws, which
              signals that management sees this as relevant even if it has not disclosed

              a public compliance program. GAO says BIS has already needed industry feedback to clarify the
              semiconductor rules and address compliance challenges, while CFR argues January

              2026 AI-chip policy toward China remains strategically incoherent and potentially unenforceable. The
              company is also strategically dependent on external ecosystems: Bosch

              for components and industrial channels, CATL for a marquee manufacturing use

              case, JD for teleoperated retail data, and a broader shareholder set for access to scenarios and
              distribution. Those relationships are strengths, but they are also single points

              of failure. Any geopolitically driven component restriction, partner reprioritization, or
              customer-procurement slowdown would hit Spirit harder than a diversified vendor with

              disclosed manufacturing scale and a wider base of independent contracts.
