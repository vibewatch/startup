      - number: '2.4'
        title: Growth drivers, commercialization tailwinds, and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              The bull case for Spirit AI is easy to articulate: China is the densest global supply chain for humanoid
              hardware, policy

              is becoming more structured through HEIS 2026, labor shortages and hazardous precision work create real
              automation demand,

              and Spirit has assembled partners that provide factories, retail sites, and data. Those are meaningful
              advantages.

              The restraint is that the independent industry literature remains sober. Bain still sees most humanoids in
              pilots, IEEE

              says the hardest problem is not assembly capacity but demand, reliability, and safety, and shared-autonomy
              usage is still

              common in public demonstrations. Even the most visible competitors still talk in the language of early
              customers, pilot

              lines, and staged capacity ramps. Spirit AI may therefore have a strong initial wedge without yet having
              evidence of a

              wide general-purpose market. The near-term commercialization opportunity is real, but it is still best
              thought of as a

              constrained industrial and service wedge expanding outward through better data, reliability, and partner
              conversion.
