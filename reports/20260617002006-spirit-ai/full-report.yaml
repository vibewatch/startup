      - number: '8.3'
        title: Comparable set and relative valuation
        blocks:
          - type: paragraph
            body: >-
              Spirit AI’s most useful comparable set is mixed by design. Figure anchors the high end of private
              hype-adjusted value: its last disclosed private mark in the retained set is $2.6 billion, supported by BMW
              pilot proof, Helix branding, and stronger global AI narrative. But even Figure’s own BMW relationship is
              explicitly staged: the 2024 commercial agreement started with use-case selection before Spartanburg
              deployment, and BMW said in 2026 that it was only then extending humanoid pilots into Leipzig for battery
              and component production. Apptronik is a useful middle comp because it raised $350 million yet still
              described its partnerships as pilot-stage and its sub-$50,000 target price as not yet achieved; its
              Mercedes agreement likewise called Apollo’s first publicly announced commercial deployment a pilot.
              Agility is more commercially grounded than most of the private field because it has a formal GXO/Spanx
              post-pilot RaaS deployment and a Schaeffler relationship with 100-plant ambition. Agility’s own materials
              sharpen that contrast: GXO was framed as the first formal commercial humanoid deployment, while Amazon
              testing and 2025 availability targets show how long the path from trial to scaled rollout can be. Unitree
              and UBTECH are the more demanding Chinese comps because they publish real financial or valuation context:
              CNBC cites Unitree’s 1.708 billion yuan of 2025 operating income and IPO plan, while UBTECH’s filing
              discloses 2.001 billion yuan of 2025 revenue, 820.6 million yuan of humanoid revenue, and 37.7% gross
              margin; CompaniesMarketCap places UBTECH at about $6.90 billion in June 2026. A fresh Humanoid.guide
              synthesis reaches the same directional conclusion: the best-disclosed Chinese peers already show whether
              they are industrial-integration businesses or developer-platform businesses. Against that field, Spirit’s
              roughly $1.4 billion mark does not look absurdly rich, but it does look expensive for a company with
              weaker disclosure than Unitree or UBTECH and weaker commercial proof than Agility’s paid deployment model.
