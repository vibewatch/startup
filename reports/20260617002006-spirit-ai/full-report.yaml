      - number: '7.2'
        title: Hardware scale-up, runtime, and physical safety risk
        blocks:
          - type: paragraph
            body: >-
              Spirit AI's own materials are unusually useful because they make clear how much operational discipline is
              required around Moz1. Users are told to train on emergency stops,

              keep distance, wear PPE, avoid powered maintenance, and manage a set of explicit residual hazards
              including strikes, tip-overs, overheating, and electromagnetic interference.

              That is not a criticism by itself; it is the normal reality of a powerful mobile robot. The risk comes
              from trying to scale that reality into mainstream deployment faster than

              the organization, customers, or integrators can absorb it. CATL is a positive proof point, but it is still
              one narrow task in a controlled environment. Independent category

              evidence remains sober on runtime and reliability: Bain still sees roughly two-hour endurance as common,
              while A3 argues that today's safety standards do not fully cover

              dynamically stable humanoids working close to people. A3's own standards documentation also shows
              deployer-side requirements are still moving: ANSI/A3 R15.06-2025 was

              only recently revised, Parts 1 and 2 are available now, and Part 3 on robot-cell use is still coming soon.
              Spirit's wheeled architecture may reduce some fall risk versus

              bipedal peers, but the absence of disclosed runtime, MTBF, or field-service metrics keeps residual
              hardware risk high.
            claimRefs:
