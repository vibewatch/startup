  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and the real buyer choice set
        blocks:
          - type: paragraph
            body: >-
              Spirit AI is not competing in a single clean lane. The real buyer choice set spans at least four solution
              classes: low-cost humanoid bodies that can be paired with other intelligence stacks; industrial humanoid
              incumbents that emphasize factory reliability and workflow integration; full-stack embodied-AI platforms
              that try to own the model, robot, and operating environment together; and the buyer’s own internal build
              path, where a large OEM absorbs the model layer in house. Spirit AI’s public materials push it toward the
              intelligence-and-data layer inside that stack. Its best public evidence is not a mass-market robot catalog
              or a public list price, but a combination of data-scale claims, RoboChallenge model proof, and deployment
              examples with CATL, JD, and Bosch-linked scenarios. That creates a differentiated but vulnerable position.
              Spirit can look more flexible than a body-first vendor when tasks change, yet it also depends heavily on
              partner channels and partner environments to prove value. In China’s 2024 robot market, where the country
              represented 54% of global industrial robot deployments and local suppliers took 57% domestic share, that
              dependence matters because the same market scale that helps Spirit also attracts many well-funded rivals.
