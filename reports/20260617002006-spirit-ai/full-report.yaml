      - number: '2.2'
        title: 'Sizing lenses: broad TAMs are real, but Spirit-specific SAM remains fuzzy'
        blocks:
          - type: paragraph
            body: >-
              The public market numbers around humanoids are directionally useful but not decision-ready on their own.
              At the broadest

              layer, IFR's industrial-robot data confirms that automation demand is real and that China is the global
              center of robot

              deployment. At the humanoid layer, however, published figures diverge sharply. One IDC-cited estimate puts
              2025 global

              sales at roughly 18,000 units and US$440 million of hardware revenue, while another cited figure lands
              closer to 13,000

              units. Broader TAM forecasts are even wider: about US$15 billion by 2030 in one projection versus US$35.4
              billion by

              2033 in a more bullish one. China-specific figures also depend on scope, with a roughly US$2.8 billion
              2026 domestic

              humanoid estimate sitting inside a much larger US$14.2 billion robotics market. These numbers show a
              market that is

              definitely growing, but they do not establish Spirit AI's own SAM. The company's accessible slice is
              bounded by a small

              number of documented factory and retail scenarios, so any Spirit-specific SOM remains an evidence gap
              rather than a fact.
