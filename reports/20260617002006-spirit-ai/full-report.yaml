      - number: '8.2'
        title: Current mark and valuation context
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports an approximate, not exact, mark. Spirit AI’s retained sources converge on roughly
              2 billion yuan of fresh capital and roughly 10 billion yuan of valuation, but the round-size reporting
              differs by about $10 million across otherwise similar stories. That discrepancy is small enough to accept
              the mark as “about $1.4 billion” while still rejecting false precision. More important is what the mark
              represents. Spirit has disclosed technical and deployment progress but not the income-statement or
              balance-sheet data that would justify a conventional multiple. That forces investors to use a different
              frame: comparable private marks, public robotics disclosure quality, and the strength of operational proof
              in structured environments. The wider sector backdrop is supportive. IFR reports record industrial robot
              value and China remains the center of gravity for deployment. A newer IFR position paper on humanoids
              explicitly tries to separate vision from reality even while noting government and investor enthusiasm, and
              Morgan Stanley argues controlled job sites may let humanoids commercialize faster than autonomous vehicles
              while still warning that social acceptance and market viability may take years to decades. Yet Bain, IEEE,
              and The Robot Report all warn that most humanoid deployments remain structured, pilot-heavy, and short of
              broad autonomous commercialization. That combination—large strategic market, controlled-environment
              progress, and a still-long scale path—explains why Spirit can command a real unicorn mark while still
              being too opaque for a clean buy call.
