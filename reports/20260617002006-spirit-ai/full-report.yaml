  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Commercial Surface
        blocks:
          - type: paragraph
            body: >-
              Spirit AI's public artifacts suggest a broader commercial surface than simply "sell humanoid robots." The
              product page, teleoperation docs, developer resources, and open-resource workflow all point to at least
              four monetizable layers: hardware (Moz and related embodiments), deployment integration, teleoperation and
              data-capture services, and model / fine-tuning enablement. This matters because it implies that Spirit AI
              may capture value both upstream and downstream of the robot body itself. A partner could pay for pilot
              hardware, for the workflow engineering required to put that hardware into a CATL or JD scenario, for the
              data infrastructure that keeps improving the model, or for some packaged combination of all three.  The
              problem is that none of the reviewed public sources discloses what the company actually charges or which
              model dominates. There is no public confirmation of whether Moz1 is sold outright, leased, wrapped inside
              a managed-service relationship, or subsidized to accelerate data collection. Third-party robot directories
              attach an indicative US$150,000 price point to Moz1, but Spirit AI does not publish a price sheet or a
              contract model. That means Spirit AI's revenue model is visible in form, yet still opaque in economics.
