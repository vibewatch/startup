        title: Deployment Burden, Data Engine, and Unit-Economic Proxies
        blocks:
          - type: paragraph
            body: >-
              Spirit AI's docs are unusually revealing about the labor required to make the system work. Quick-start and
              teleoperation pages walk through network setup, controller access, user-role management, VR configuration,
              and troubleshooting steps. The open-resource workflow goes further, showing that developers need
              checkpoint downloads, dataset-stat calculations, environment management, ROS2, and separate execution
              paths for inference versus real-robot integration. This is not a consumer-electronics-style product with
              zero-touch deployment. It is a field-engineering and enablement stack, which implies meaningful
              implementation and support cost until the platform is much more standardized.  The best public
              unit-economic proxies therefore come from data and compute rather than from revenue. Spirit AI says it
              already has more than 200,000 hours of interaction data, aims for more than one million hours by end-2026,
              and has cut data-collection cost by 90% with wearables. GitHub materials show A100-class compute and
              multi-GPU training recommendations. JD's data-center ambitions and its retail deployment with Moz suggest
              Spirit AI is trying to lower marginal model-improvement cost by locking in privileged scenario data. That
              could be a real moat, but public evidence still does not reveal whether these efficiencies translate into
              positive gross margins or short payback periods.
