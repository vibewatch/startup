      - number: '4.4'
        title: Peer Benchmarks and Sector Economics
        blocks:
          - type: paragraph
            body: >-
              Because Spirit AI itself discloses so little financial detail, public peer evidence is necessary to frame
              what healthy or at least plausible economics might look like. UBTECH is the most useful peer because it is
              public and already farther along commercially. Its FY2025 filing shows RMB2.0 billion of revenue, RMB820.6
              million of humanoid-product revenue, a 37.7% gross margin, and a still-heavy RMB789.8 million loss. Its
              delivery press release also references more than RMB800 million of orders and plans for 5,000 units of
              annual capacity by 2026. In other words, even a scaled Chinese humanoid peer with real revenue and factory
              throughput is still loss-making.  U.S. peers tell a similar capital-intensity story from a different
              angle. Figure raised US$675 million at a US$2.6 billion valuation, Apptronik raised US$350 million to
              scale manufacturing, and Agility's commercial progress still relied on relatively small, structured
              deployments. CNBC's Unitree coverage adds another important marker: the company is seeking RMB4.2 billion
              in IPO proceeds and already gets more than 40% of revenue outside China. Taken together, peers imply that
              Spirit AI probably needs both additional time and additional capital before it can plausibly show
              self-sustaining economics.
