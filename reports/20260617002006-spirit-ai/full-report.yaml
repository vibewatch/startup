companyProfile:
  summary: >-
    Spirit AI is a China-based embodied-intelligence startup founded in January 2024 that positions itself as the
    builder of a universal robot brain rather than only a single humanoid body. Public evidence supports a full-stack
    offer spanning Moz1 hardware, Spirit VLA models, teleoperation and data-collection workflows, and partner
    deployments with CATL, JD, and Bosch-linked industrial scenarios. The company has raised a large amount of capital
    quickly for its age, but public disclosure remains thin on revenue, margins, headcount, governance, and the exact
    economics of later 2026 fundraising.
