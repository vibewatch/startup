      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Why the call is research-more rather than avoid
            body: >-
              Spirit has enough real proof—data scale, benchmark results, CATL execution, and Bosch-linked industrial
              access—to avoid an outright dismissive call. What it lacks is not narrative momentum but disclosed
              economics.
            calloutType: recommendation
            claimRefs:
