      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Spirit AI does have a moat case, but it is narrower than a generic “AI leader” narrative suggests. The
              moat is strongest where data collection, industrial adaptation, and force-control deployment reinforce
              each other: more than 200,000 interaction hours, lower collection cost, public CATL proof, and
              Bosch-linked access to additional scenarios all help Spirit learn faster than a startup with only lab
              videos. But those advantages do not eliminate displacement risk. Bain and IEEE both caution that the
              sector is still pilot-heavy and not yet broadly reliable in unstructured environments. That matters
              because Spirit is still competing in a market where better-capitalized full-stack platforms can
              internalize the model layer, low-cost vendors can reset customer expectations on price, and industrial
              incumbents can move from pilots to production with stronger workflow software and service organizations.
              The biggest unresolved risk is concentration opacity: public sources do not disclose whether Spirit’s
              apparent traction depends on a few anchor accounts, nor do they disclose realized pricing or renewal
              economics. In other words, Spirit may have a real data flywheel, but the durability of that flywheel still
              depends on whether partner scenarios convert into repeatable paid deployments before rivals do the same at
              larger scale.
