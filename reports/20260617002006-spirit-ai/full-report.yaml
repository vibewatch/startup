            body: >-
              Because later Spirit financing headlines are less primary and not fully reconciled across sources, this
              chapter anchors on the better-corroborated roughly 2 billion yuan / 10 billion yuan frame and refuses to
              extrapolate beyond it.
            calloutType: assumption
