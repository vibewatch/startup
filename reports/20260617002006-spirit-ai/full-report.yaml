  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              Spirit AI’s latest public mark is real enough to anchor valuation discussion, but not robust enough to
              justify a bullish call on public evidence alone. Multiple independent reports put the early-2026 financing
              at roughly 2 billion yuan and the valuation at about 10 billion yuan, which means the company has crossed
              the threshold where investors are explicitly pricing platform optionality rather than seed-stage promise.
              That said, the valuation is not underwritten by disclosed revenue, gross margin, burn, or cash balance.
              The company’s strongest public positives are technical and operational: a large data-collection claim,
              RoboChallenge model proof, CATL task performance, and partner-backed deployment pathways through Bosch and
              JD-linked scenarios. Those are meaningful, but they do not eliminate denominator risk. Without financial
              disclosure, the question is not whether Spirit is interesting; it is whether the current price already
              assumes commercialization success that public evidence has not yet proved. On that narrower question, the
              disciplined answer is research-more, with medium confidence, high risk, and a stretched valuation stance.
            claimRefs:
