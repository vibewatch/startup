- id: durability-expansion-and-concentration
  title: Durability, expansion, and concentration are the main unresolved underwriting risks
  body: 'The public evidence is much better on task-level outcomes than on account durability. CATL offers concrete performance
    numbers and JD offers concrete workflow detail, but public sources do not disclose renewal rates, customer count, deployed-fleet
    size, contract length, NRR, or satisfaction scores. That leaves investors with a concentration question: is Spirit AI
    building a repeatable customer engine, or are a few ecosystem relationships carrying most of the visible proof? The answer
    is not knowable from public material alone. What can be said is that the company currently depends on a small number of
    strategic relationships for its best reference stories, and those stories still appear to rely on teleoperation or intensive
    integration support. That mix can still be valuable in a frontier robotics company, but it means gross-margin durability
    and repeatability should be treated as open diligence items rather than assumed strengths, especially when the visible
    evidence base is still heavily scenario-driven. Until management discloses account-level rollout data, the right underwriting
    stance is to treat these counterparties as evidence of relevance and not yet as proof of a broadly diversified, self-sustaining
    customer engine.'
  claimRefs:
