- id: adverse-context
  title: 'Adverse context: real proof exists, but frontier-humanoid customer evidence is still thin'
  body: Spirit AI does have more public deployment proof than many frontier humanoid teams, yet the adverse context still
    matters. Third-party profiles treat Moz1 as prototype-stage or under-verified, and industry coverage argues that humanoid
    programs frequently remain small pilots that never become large durable fleets. Those warnings do not negate CATL or JD;
    instead, they frame how much weight to assign them. The most responsible conclusion is that Spirit AI has crossed the
    line from pure lab narrative to real scenario validation, but it has not yet provided the customer-data density that a
    later-stage underwriter would expect. Investors should therefore model the current public customer base as early but meaningful
    proof of relevance, not as conclusive proof of broad market adoption or retention. The next diligence step is not to doubt
    the existence of deployments; it is to verify how repeatable, profitable, and geographically diverse those deployments
    really are.
