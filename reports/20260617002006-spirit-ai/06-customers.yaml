  evidenceGaps:
  - type: missing-source
    severity: material
    topic: durability-gap
    missingEvidence: Public renewal, churn, contract-length, NRR, or customer-satisfaction metrics.
    whyItMatters: Without durability metrics it is impossible to tell whether named scenarios are becoming sticky recurring
      accounts.
    diligencePath: Request cohort tables, renewal schedules, contract terms, and customer references willing to discuss uptime
      and ROI.
    relatedQuestionRefs:
    - QU011
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: material
    topic: customer-enumeration
    missingEvidence: A complete list of active customers, locations, and proof status across production, pilot, and prospect
      accounts.
    whyItMatters: The public record may overweight a few flashy counterparties and understate concentration or pipeline fragility.
    diligencePath: Ask management for an account list with stage, live date, revenue contribution, and referenceability.
    relatedQuestionRefs:
    - QU010
    - QU021
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: geography
    missingEvidence: Evidence of diversified non-China deployments with comparable specificity to CATL and JD.
    whyItMatters: International diversification changes channel risk, regulatory exposure, and customer concentration.
    diligencePath: Request export customers, overseas pilots, and channel-partner conversion metrics by geography.
    relatedQuestionRefs:
    - QU024
    relatedTableRefs:
    - TU001
  - type: conflicting-data
    severity: minor
    topic: maturity-risk
    missingEvidence: Independent verification of how much teleoperation remains in day-to-day customer operations after deployment.
    whyItMatters: If human support stays high, gross margin and scalability can look very different from a software-like deployment
      story.
    diligencePath: Request supervised-hours per deployment, autonomy progression metrics, and labor assumptions by use case.
    relatedQuestionRefs:
    - QU023
    relatedTableRefs:
    - TU005
