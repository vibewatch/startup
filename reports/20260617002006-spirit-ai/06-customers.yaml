company:
  name: Spirit AI
chapter:
  number: 6
  title: Customers
  summary: 'Spirit AI has real but still narrow public customer proof: CATL is the clearest confirmed production deployment,
    JD MALL is a limited but concrete retail-service deployment with heavy teleoperation, and Bosch is strategically important
    but best treated as a partner and future channel rather than a proven live customer. Public evidence is strongest on task-level
    outcomes and weakest on durability metrics, customer count, and concentration disclosure, so the customer story today
    is early-scenario validation rather than scaled recurring-account proof.'
sections:
- id: visible-customer-segments
  title: Visible customer segments are strategic ecosystems, not a broad disclosed base
  body: 'Spirit AI’s public customer record should not be read as a classic enterprise software customer roster. The visible
    set clusters around a few high-value ecosystems: CATL for industrial manufacturing validation, JD for retail-service teleoperation
    and scenario data, Bosch for industrial environments and component supply, and a looser set of developer or evaluator
    users drawn in by GitHub, Hugging Face, and robot-resource documentation. That mix matters because the buyer, user, and
    payer can differ sharply across rows. CATL looks like a real operating site; JD combines retail showcase, scenario access,
    and data-loop value; Bosch looks more like a strategic partner and future channel; and developer-facing assets make technically
    sophisticated early adopters plausible even without many published enterprise references. Public marketing still mentions
    household and general service aspirations, but named live proof is concentrated in enterprise settings that can tolerate
    supervised iteration and scenario-specific customization.'
  claimRefs:
  - CU001
  - CU002
  - CU023
  - CU025
  - CU026
  tableRefs:
  - TU001
  - TU002
  figureRefs:
  - FU001
- id: confirmed-vs-prospective-proof
  title: Confirmed deployments versus partner and prospect proof
  body: 'The cleanest way to read Spirit AI’s public customer proof is to separate confirmed live workflows from strategically
    useful but lower-confidence counterparties. CATL is the strongest confirmed deployment because multiple sources place
    Moz on a live battery-pack production line and provide specific task and outcome detail. JD MALL is also confirmed, but
    at a more limited maturity level: the disclosed use case centers on coffee-service demonstrations with teleoperator support
    and explicit data capture. Bosch belongs in a different bucket. The partnership is commercially important because it contributes
    factories, logistics centers, sensors, and actuators, yet the public disclosures stop short of proving a live Bosch-site
    Moz installation. JD Pharmacy is even weaker still because it is framed as an exploration target. This sorting discipline
    prevents the customer chapter from overcounting ecosystem partners as production customers.'
  claimRefs:
  - CU003
  - CU004
  - CU007
  - CU008
  - CU009
  - CU011
  - CU012
  - CU013
  - CU033
  - CU035
