- id: TU003
  title: Named customer proof table
  columns:
  - Customer / counterparty
  - Segment
  - Deployment / use case
  - Production vs pilot
  - Outcome
  - Limitation
  rows:
  - - CATL Zhongzhou base
    - Industrial manufacturing
    - Moz performs battery-pack EOL and DCR high-voltage connector tasks
    - Production deployment
    - '>99% success rate and ~3x daily workload'
