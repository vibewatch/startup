- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Scale signal
  - Revenue / strategic value
  - Gap
  rows:
  - - Industrial manufacturing operators
    - Plant / line team / enterprise operations budget
    - Battery-pack EOL and DCR testing
    - One named CATL production line with concrete metrics
    - Best proof that Spirit can solve high-value, high-risk industrial tasks
    - No public fleet size across additional factories
  - - Retail-service scenario partner
    - Retail scenario owner / teleoperators / partner budget
    - Coffee-service demo and public interaction in JD MALL
    - One named retail deployment with workflow detail
    - Valuable as data loop and public demo surface
    - Does not yet show autonomous multi-store rollout
  - - Industrial ecosystem partner
    - Partner strategy team / Spirit deployment teams / joint project budgets
    - Factories, logistics centers, components, and industrial rollout support via Bosch
    - Multi-year strategic partnership announced
    - Could widen scenario access and lower component friction
    - Not a confirmed paying live-customer deployment
  - - Developer or evaluator users
    - Research / robotics team / project budget
    - Inspect model, docs, SDK assets, and adaptation path
    - Public GitHub, Hugging Face, docs, resource pack
    - Creates technical credibility and quasi-customer pull among advanced users
    - Indirect customer proof and unclear monetization path
  - - Household or general service prospects
    - Future consumer or service buyers / unknown / unknown
    - Home chores, office tidying, and service automation
    - Marketing references rather than named buyers
    - Large TAM if product hardens
    - No named paying public references
  notes: The public segmentation is anchored on named counterparties and technical surfaces rather than disclosed account
    counts or revenue buckets.
