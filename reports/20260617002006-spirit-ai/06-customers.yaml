- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - CATL industrial proof
    - A single flagship manufacturing reference can dominate the narrative
    - If the CATL program stalls, public industrial proof weakens materially
    - Request number of additional manufacturing accounts and conversion rates from line trials
  - - JD retail scenario access
    - Retail proof may still depend on teleoperators and one partner ecosystem
    - Could overstate autonomy and understate labor intensity
    - Request autonomous-task share and number of active JD sites
  - - Bosch industrial partnership
    - Partner value may not convert into paying customer volume
    - Scenario access and component support could be strategically useful but commercially indirect
    - Request paid project count, component contracts, and conversion milestones
  - - Developer-facing assets
    - Technical attention may not translate into paying deployments
    - Strong developer interest can create noise around true demand
    - Request usage, lead, and conversion data from technical channels
  - - China-centric public proof
    - Geographic concentration can raise policy, channel, and customer-risk exposure
    - International scaling could be harder than domestic pilot success suggests
    - Request deployment pipeline by geography and regulatory dependency
  notes: The risks focus on concentration and proof quality rather than on whether the named scenarios exist at all.
