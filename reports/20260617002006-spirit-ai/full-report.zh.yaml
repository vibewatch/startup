      - number: '8.3'
        title: 可比公司组与相对估值
        blocks:
          - type: paragraph
            body: >-
              Spirit AI 最有用的可比组，本来就应当混合搭建。Figure 锚定私营市场情绪调整后估值的高端：保留样本中其最后披露的私营估值为 $2.6B，背后有 BMW 试点证明、Helix 品牌和更强的全球 AI
              叙事支撑。但即便是 Figure 与 BMW 的关系，也明确分阶段推进：2024 年商业协议先从用例选择开始，再进入 Spartanburg 部署；BMW 到 2026 年才表示，正把人形机器人试点扩展到
              Leipzig 的电池和组件生产。Apptronik 是有用的中位可比，因为它融资 $350M，却仍把合作关系描述为试点阶段，低于 $50,000 的目标价格也尚未实现；其 Mercedes 协议同样把
              Apollo 第一个公开宣布的商业部署称为试点。Agility 比多数私营同行更接近商业落地，因为它有正式的 GXO/Spanx 试点后 RaaS 部署，也有 Schaeffler 的合作关系和 100
              家工厂雄心。Agility 自己的材料进一步拉开差异：GXO 被表述为首个正式商业人形机器人部署，而 Amazon 测试和 2025 年可用性目标则说明，从试用走向规模化推广路径仍然很长。Unitree 和
              UBTECH 是要求更高的中国可比对象，因为它们发布了真实财务或估值背景：CNBC 引用 Unitree 2025 年经营收入 17.08 亿元人民币及 IPO 计划；UBTECH 申报文件披露 2025 年收入
              20.01 亿元人民币、人形机器人收入 8.206 亿元人民币、毛利率 37.7%；CompaniesMarketCap 将 UBTECH 2026 年 6 月估值置于约
              $6.90B。Humanoid.guide 最新综合也得出同向结论：披露最充分的中国同行，已经能看出自己是工业集成业务还是开发者平台业务。放在这个可比场里，Spirit 约 $1.4B
              的估值并不离谱地贵，但对于一家披露弱于 Unitree 或 UBTECH、商业证明弱于 Agility 付费部署模型的公司来说，价格确实偏高。
