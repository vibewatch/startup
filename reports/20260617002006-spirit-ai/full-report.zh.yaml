      - number: '7.2'
        title: 硬件扩产、续航与物理安全风险
        blocks:
          - type: paragraph
            body: >-
              Spirit AI 自有材料很有用，因为它清楚说明 Moz1 周边需要多少运营纪律。用户被要求接受急停培训、保持距离、穿戴 PPE、避免带电维护，并管理一组明确剩余危险，包括撞击、倾倒、过热和电磁干扰。

              这本身不是批评；这是强力移动机器人正常现实。风险来自试图把这种现实扩展到主流部署，而且速度超过组织、客户或集成商的吸收能力。CATL
              是正面证明点，但它仍是在受控环境中的一个狭窄任务。独立品类证据对续航和可靠性仍然清醒：Bain 仍认为约两小时续航很常见，A3 则认为今天的安全标准尚未完全覆盖与人近距离工作的动态稳定人形机器人。A3
              自己的标准文档也显示部署方要求仍在变化：ANSI/A3 R15.06-2025 刚刚修订，Parts 1 和 2 现在可用，关于机器人单元使用的 Part 3 仍即将推出。Spirit
              的轮式架构相较双足同业可能降低部分跌倒风险，但未披露续航、MTBF 或现场服务指标，仍让剩余硬件风险维持高位。
