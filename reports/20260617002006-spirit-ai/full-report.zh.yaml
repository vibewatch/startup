        title: 部署负担、数据引擎与单位经济代理指标
        blocks:
          - type: paragraph
            body: >-
              Spirit AI 的文档非常清楚地暴露了让系统跑起来所需的人力。快速上手和遥操作页面讲解网络设置、控制器访问、用户角色管理、VR 配置和故障排查步骤。开放资源流程更进一步，显示开发者需要下载
              checkpoint、计算数据集统计、管理环境、使用
              ROS2，并为推理和真实机器人集成走不同执行路径。这不是一款零接触部署的消费电子式产品，而是一套现场工程和赋能栈。这意味着在平台大幅标准化之前，实施和支持成本会很可观。因此，最好的公开单位经济代理指标来自数据和算力，而不是收入。Spirit
              AI 称已拥有超过 200,000 小时交互数据，目标到 2026 年底超过 100 万小时，并用可穿戴设备把数据采集成本降低 90%。GitHub 材料显示 A100 级算力和多 GPU 训练建议。JD
              的数据中心雄心以及其用 Moz 做零售部署，表明 Spirit AI 正试图锁定特权场景数据，以降低边际模型改进成本。这可能是真实护城河，但公开证据仍没有显示这些效率能否转化为正毛利或短回收期。
