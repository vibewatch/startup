  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与真实买方选择集
        blocks:
          - type: paragraph
            body: >-
              Spirit AI 并不在一条干净赛道里竞争。真实买方选择集至少横跨四类方案：可与其他智能栈搭配的低成本人形本体；强调工厂可靠性和流程集成的工业人形在位者；试图同时掌握模型、机器人和运营环境的全栈具身 AI
              平台；以及买方自建路径——大型 OEM 在内部吸收模型层。Spirit AI 的公开材料把它推向这套栈中的智能和数据层。最好的公开证据不是大众市场机器人目录或公开标价，而是数据规模说法、RoboChallenge
              模型证明，以及 CATL、JD 和 Bosch 相关场景的部署案例。这形成了一个差异化但脆弱的位置。任务变化时，Spirit 可能比本体优先的厂商更灵活；但它也高度依赖伙伴渠道和伙伴环境来证明价值。2024
              年中国机器人市场占全球工业机器人部署 54%，本土供应商拿下国内 57% 份额。在这样的市场里，这种依赖很重要，因为同样的市场规模既帮助 Spirit，也会吸引许多资金充足的对手。
