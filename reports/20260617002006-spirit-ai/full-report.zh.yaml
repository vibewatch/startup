companyProfile:
  summary: >-
    Spirit AI 是一家中国具身智能创业公司，成立于 2024 年 1 月。公司把自己定位为通用机器人“大脑”的构建者，而不只是做单一人形本体。公开证据支撑其全栈方案：Moz1 硬件、Spirit VLA
    模型、遥操作和数据采集流程，以及与 CATL、JD 和 Bosch 相关工业场景的伙伴部署。以公司年龄看，Spirit AI 融资速度和规模都很大，但公开披露仍缺少收入、利润率、员工数、治理结构，以及 2026
    年后续融资的具体经济条款。
