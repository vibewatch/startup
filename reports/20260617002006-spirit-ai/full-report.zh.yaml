            body: >-
              当前企业验证更偏向那些发布更多流程细节或更大客户引用的对手。UBTECH 称 Walker S 围绕 41 个力反馈关节打造，用于装配线同步；UBTECH 后来又宣布 Walker S2 交付数百台，自 2025
              年初以来订单超过 8 亿元人民币。Figure 的故事不同：借 Helix 建立更强的软件品牌，拥有 20 公斤载荷和 5 小时续航，并在 BMW 推出一项从五个狭窄制造任务起步的部署。Agility
              更多靠系统集成竞争，而不只是炫目规格。其 Digit 机器人与 Arc 流程软件搭配，TechCrunch 把 GXO/Spanx 部署描述为正式的后试点 RaaS 交易，而不是一次性演示。Boston
              Dynamics 仍是载荷、续航和企业集成方面的在位标杆；AgiBot 则通过把机器人、数据集、仿真和编排打包进单一平台叙事，扩大压力。面对这个竞争场，Spirit 最强证明仍是 CATL
