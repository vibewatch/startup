      - number: '4.4'
        title: 同业基准与行业经济性
        blocks:
          - type: paragraph
            body: >-
              Spirit AI 自身披露的财务细节太少，因此需要用公开同业证据来框定健康或至少合理的经济性可能长什么样。UBTECH 是最有用同业，因为它已上市且商业化走得更远。其 FY2025 文件显示收入人民币 20
              亿元、人形产品收入人民币 8.206 亿元、毛利率 37.7%，同时仍录得人民币 7.898 亿元重亏。其交付新闻稿还提到订单超过人民币 8 亿元，并计划到 2026 年形成 5,000
              台年产能。换句话说，即便一家已具规模、有真实收入和工厂产出的中国人形同业，仍在亏损。美国同业从另一角度讲述类似的资本密集故事。Figure 以 US$2.6 billion 估值融资 US$675
              million，Apptronik 融资 US$350 million 用于扩大制造，Agility 的商业进展仍依赖相对小型、结构化的部署。CNBC 对 Unitree
              的报道又提供了一个重要标记：公司寻求人民币 42 亿元 IPO 募资，并且超过 40% 收入已来自中国以外。合在一起，同业暗示 Spirit AI 可能还需要更多时间和更多资本，才可能展示自我维持的经济性。
