      - number: '2.2'
        title: 规模测算：广义 TAM 真实存在，但 Spirit 专属 SAM 仍模糊
        blocks:
          - type: paragraph
            body: >-
              人形机器人周边的公开市场数字有方向性价值，但单独看还不足以支撑决策。最宽一层，IFR 的工业机器人数据确认自动化需求真实存在，中国也是全球机器人部署中心。但到了人形机器人层，已发布数字分歧很大。一个 IDC
              引用的估算把 2025 年全球销量放在约 18,000 台、硬件收入 US$440 million；另一个被引用数字则接近 13,000 台。更宽口径的 TAM 预测跨度更大：一种预测到 2030 年约
              US$15 billion，另一种更乐观预测到 2033 年为 US$35.4 billion。中国专属数字也取决于口径：2026 年国内人形机器人约 US$2.8 billion 的估算，嵌在大得多的
              US$14.2 billion 机器人市场中。这些数字说明市场确实在增长，但并不能证明 Spirit AI 自己的 SAM。公司的可触达切片被少数已记录工厂和零售场景所约束，因此任何 Spirit 专属 SOM
              仍是证据缺口，而不是事实。
