  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与商业表面
        blocks:
          - type: paragraph
            body: >-
              Spirit AI 的公开材料显示，它的商业表面比“卖人形机器人”更宽。产品页、遥操作文档、开发者资源和开放资源流程都指向至少四个可变现层：硬件（Moz 及相关形态）、部署集成、遥操作和数据采集服务，以及模型 /
              微调赋能。这一点重要，因为它意味着 Spirit AI 可能同时在机器人本体的上游和下游捕获价值。伙伴可以为试点硬件付费，为把硬件放进 CATL 或 JD
              场景所需的流程工程付费，为持续改进模型的数据基础设施付费，也可能为三者的某种打包组合付费。问题在于，已审阅公开来源没有披露公司实际如何收费，或哪种模式占主导。公开材料没有确认 Moz1
              是一次性出售、租赁、包在托管服务关系里，还是为了加速数据采集而被补贴。第三方机器人目录给 Moz1 挂了一个指示性 US$150,000 价格点，但 Spirit AI
              没有发布价目表或合同模型。因此，Spirit AI 的收入模式在形态上可见，经济性仍不透明。
