        title: 出口管制暴露与生态依赖
        blocks:
          - type: paragraph
            body: >-
              公开资料没有显示 Spirit AI 是 Entity List 目标，但出口管制风险并未因此消失。BIS 和 CSIS 都明确指出，针对中国的先进 AI
              与算力限制仍是活跃且持续演变的政策工具，目的在于限制中国获得对具身 AI 训练和推理至关重要的芯片、工具链和高性能系统。Spirit
              自己的免责声明也明确要求用户遵守出口管制法律；即便公司没有披露公开合规计划，这也说明管理层认为该议题与自身业务有关。GAO 称，BIS 已经需要借助行业反馈来澄清半导体规则并处理合规挑战；CFR 则认为，2026
              年 1 月面向中国的 AI 芯片政策仍存在战略不连贯，也可能难以执行。公司还在战略上依赖外部生态：Bosch 提供组件和工业渠道，CATL 提供标杆制造场景，JD
              提供远程操控零售数据，更广泛的股东网络则带来场景和分发入口。这些关系是优势，也是单点故障。任何由地缘政治驱动的组件限制、合作伙伴重新排序，或客户采购放缓，都会比对一家已披露制造规模、独立合同基础更分散的供应商更重地打到
