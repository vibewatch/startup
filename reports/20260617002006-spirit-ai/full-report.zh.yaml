        title: 产品表面与客户实际获得的东西
        blocks:
          - type: paragraph
            body: >-
              Spirit AI 不只是在营销一个通用人形机器人。公开材料显示其交付物分层：Moz1 是物理机器人，Spirit v1.5 是具身模型家族，另有遥操作工具、MozRobot SDK 和 URDF
