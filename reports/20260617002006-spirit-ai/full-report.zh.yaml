      - number: '5.4'
        title: 依赖、安全控制与仍然缺失的内容
        blocks:
          - type: paragraph
            body: >-
              Spirit AI 的公开材料也显示尽调风险仍落在哪里。公司高度依赖伙伴拥有的环境和部件：CATL 贡献一个困难工业用例，JD 贡献一个遥操作零售数据循环，Bosch
              贡献工业场地以及传感器和执行器。文档展示了真实安全流程，例如急停检查和受控启动；第三方目录也承认力控和碰撞处理等安全运动概念。但同样的第三方来源也强调了缺失的运营规格和原型级成熟度信号。当前公开包没有披露正式安全认证、网络安全控制、uptime
              保证或详细维护指标。对买方而言，这意味着技术故事最强的部分是架构、数据循环理念和早期场景验证，最弱的部分是可审计生产硬化。结果是一套方向上令人印象深刻、开放度越来越高的栈，但公开企业验证仍处早期，尤其是对那些在铺开前需要记录化可服务性和合规的买方。也就是说，采购风险很可能不在模型本身，而在现场支持、维护负担和合规文档；这些因素可能决定有前景的试点能否转化为规模账户。
