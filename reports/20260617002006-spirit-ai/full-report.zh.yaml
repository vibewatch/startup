      - number: '2.3'
        title: 当前已披露细分中的买方、用户与付款方地图
        blocks:
          - type: paragraph
            body: >-
              Spirit AI 已披露细分在采购侧结构不同，尽管它们都强化同一个模型和数据飞轮。在 CATL 和类似 Bosch
              的工业路径中，预算所有者是关注产出、精度、安全和劳动力替代的工厂运营、自动化或制造创新负责人。产线操作员是用户，不是经济买方。在 JD
              式服务部署中，企业运营或创新团队掌握预算，门店员工和遥操作员负责日常使用。这一区分重要，因为采用并不是从一张通用机器人采购订单开始，而是从一个流程负责人愿意为遥操作试点、集成和数据采集付费开始，直到机器人能自主完成足够多任务、证明
              ROI。公开证据还显示，生态伙伴也是另一种买方：Bosch 带来渠道和部件，JD 与 CATL 带来真实环境，这些环境既是客户，也是训练场。
