              操作流程都很重要。产品页强调力控硬件和 VLA 智能，文档则展示了遥操作控制、端口、API 参考、仿真挂钩和机器人资源下载等具体实施表面。用尽调语言说，Spirit AI
              交付的是一个带有多种工件和运营层的平台，而不是一个单一封闭设备。
            claimRefs:
              - CE001
              - CE002
