      - number: '1.3'
        title: 资本基础与战略利益相关方
        blocks:
          - type: paragraph
            body: >-
              Spirit AI 的融资节奏，是公司迅速获得能见度的原因之一。百度百科梳理了 2024 年和 2025 年的天使轮、Angel+、Pre-A 和 JD 领投 Pre-A+ 等早期阶段；而 The AI
              Insider 和 China Biz Insider 在 2026 年 2 月的报道则汇聚到一个大得多的事件：两轮快速连续融资合计近人民币 20 亿元，约 US$280-290 million，估值约人民币
              100 亿元。这些 2 月报道是最可防守的公开融资锚点，因为它们由多个独立媒体相互印证，也与公司扩张数据、模型和部署能力的需求一致。但此后，资本故事明显变得不那么干净。百度百科描述了 2026-04-07
              的另一轮人民币 10 亿元融资，估值超过人民币 200 亿元；Pandaily 后来又用更醒目的标题称 30 天内获 US$420 million，背后有雷军和 Jack Ma
              相关基金支持。已审阅证据集中，没有任何后续叙事得到主要备案或新的公司公告印证，因此审慎尽调应保留冲突，而不是强行归并成一个数字。更清楚的是股东和伙伴基础的战略形态。JD 既像融资方也像部署伙伴，Bosch
              提供工业验证和硬件系统杠杆，更广泛的投资人组合把创投、产业和国资混在一起，可能提升场景准入，但也会让股权结构解读更复杂。
