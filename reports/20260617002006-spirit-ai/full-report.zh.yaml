  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              不能只因为 Spirit AI 的使命表述很宽，就拿整个全球机器人市场给它估值。

              公开证据更窄。公司目前披露的是轮式力控人形机器人、在 CATL 的电池产线部署、与 JD 的零售服务部署，以及与 Bosch
              为期两年的工业数据和部件合作。这些事实划出了真实市场边界：半结构化工厂、物流和商业服务流程。在这些场景中，机器人要么替代重复性人工搬运，要么在监督下生产专有动作数据。

              因此，纳入支出覆盖机器人硬件、集成、部署服务、遥操作基础设施、数据采集，以及与这些流程绑定的持续模型更新。排除支出则包括更大的固定臂工业自动化池、通用仓储软件，以及尚未被 Spirit AI
              公开证据验证的猜想性家庭消费机器人需求。按当前形态，公司首先竞争的是人力、专用工业自动化、 kiosk 和移动操作替代方案，而不是一个已经成型的家用机器人市场。
