  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 商业化集中与场景狭窄
        blocks:
          - type: paragraph
            body: >-
              Spirit AI 有足够公开证据证明自己不只是幻灯片公司，但同一组证据也显示证明基础仍高度集中。

              具名引用基本只有三个：CATL 对应一个高价值电池产线流程，JD 对应遥操作零售服务数据采集，Bosch 对应一项为期两年的工业伙伴关系。Bosch
              这项合作有意义，但仍被表述为项目式协作，而不是成熟机队收入。这种集中度重要，因为它让商业化变得脆弱：任何一个伙伴放慢铺开、改变优先级或决定内化，Spirit 对外可见叙事都会迅速收缩。

              更广泛的人形机器人市场背景并不能消除这一风险。独立来源仍把多数领先厂商描述为处在试点、早期采用者协议或边界清晰的工厂测试中。换句话说，品类还没有成熟到足以让 Spirit
              消失在标准化企业需求的大潮中。公司可能有一个可信楔子，但它仍然只是楔子。
