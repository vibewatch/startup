      - number: '1.4'
        title: 里程碑、商业化与风险信号
        blocks:
          - type: paragraph
            body: >-
              这条里程碑曲线比典型前沿机器人创业公司材料更有实质。公开来源把 Spirit AI 的早期时间线连到 2024 年 7 月 Moz0 亮相、2025 年 3 月 Spirit v1 早期访问里程碑、2025 年
              6 月 Moz1 发布、2025 年 12 月 CATL 产线部署，以及 2026 年 2 月至 6 月的融资和合作里程碑。公司官方融资叙事还称拥有超过 200,000 小时交互数据，计划到 2026 年底超过
              100 万小时，并借助自研可穿戴设备把采集成本降低 90%。对一家私有具身 AI 公司来说，这些说法异常具体，也解释了为什么投资人和伙伴把数据准入视为 Spirit
              论点的核心部分。与此同时，公开记录仍需要谨慎。官方和第三方描述并不一致：Moz1 到底应主要被理解为轮式人形，还是双足人形；第三方机器人目录还给出约 US$150,000 的价格标签，但 Spirit
              本身没有确认。独立负面来源也指出，更广泛的人形品类仍处早期，可靠性、安全性、电池和需求密度约束没有解决。这并不否定 Spirit AI
              的进展，但界定了正确的尽调姿态：这是一家节奏很快、连接资源很强、且有真实部署信号的公司，但还不是一家透明披露的规模化企业。
