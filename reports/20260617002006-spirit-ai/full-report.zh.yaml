            - 认证和正常运行时间披露稀少
            - 公开证据最弱的领域
            - 需要管理层尽调
    claimRefs:
      - CE016
      - CE021
      - CE024
      - CE033
      - CE036
  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: Spirit AI 当前公开客户旅程如何从技术可信度，走向有监督的真实世界场景验证。
    data:
      items:
        - label: 技术可信度
          detail: 基准测试领先、GitHub、模型卡、文档
        - label: 场景入口
          detail: 战略合作伙伴提供工厂、门店和数据闭环
        - label: 监督式部署
          detail: 远程操作辅助，或范围严格限定的现场任务推广
        - label: 任务结果证据
          detail: 客户故事强调成功率、工作量或演示完成
        - label: 规模验证
          detail: 仍缺公开留存、机队和多账户耐久性指标
    claimRefs:
      - CU025
      - CU026
      - CU031
      - CU034
  - id: FU002
    title: 采用 / 部署漏斗
    type: funnel
    layout: standard
    summary: 从战略兴趣走向持久重复部署时，公开证据逐级变薄。
    data:
      items:
        - label: 战略生态兴趣
          value: 100
          detail: Bosch、JD、CATL 和开发者关注，让漏斗顶部很宽
        - label: 具名场景入口
          value: 70
          detail: 具体工厂和零售流程可见，但数量有限
        - label: 现场监督式部署
          value: 45
          detail: CATL 产线任务和 JD MALL 服务演示，是已确认的公开案例
        - label: 可复制多站点证据
          value: 20
          detail: 多站点重复转化的公开证据仍薄
        - label: 留存和 cohort 耐久性
          value: 5
          detail: 未披露公开续约或 cohort 指标
    claimRefs:
