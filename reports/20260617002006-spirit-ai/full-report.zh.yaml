  - id: TV005
    title: 论点破裂与否决触发项表
    columns:
      - 触发项
      - 为什么重要
      - 对论点的传导
      - 行动含义
    rows:
      - - 经审计收入远低于投资人预期
        - 会说明当前价格并非建立在商业转化之上
        - 削弱当前估值标记中的隐含期权价值
        - 从继续研究转向回避，除非价格重置
      - - CATL / Bosch / JD 类客户从试点到生产的转化弱
        - 会说明技术验证无法按经济性规模化
        - 打破支撑论点的最强运营证据
        - 投资前要求新的部署 cohort 数据
      - - 关键伙伴场景丧失或削弱
        - 会同时降低数据和分销杠杆
        - 压缩护城河，并放慢模型改进
        - 将 Spirit 重新定价到更小的独立平台供应商附近
      - - 中国人形机器人可比公司下调估值
        - 即使没有 Spirit 特定坏消息，也会改变市场出清参照系
        - 压缩私募轮溢价定价空间
        - 要求下行保护，或等待重置出清
      - - 出现保护投资人的优先权堆栈
        - 意味着名义估值高估普通股价值
        - 改变当前进入价格的经济性
        - 加钱前坚持拿到股权结构细节
    notes: 触发项聚焦会改变价格支撑的经营和融资事实，而不是机器人领域的宽泛观点。
    claimRefs:
      - CV005
      - CV018
      - CV050
      - CV051
      - CV053
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - 收入质量
        - 经审计 FY2025 收入和当前 YTD 分业务收入
        - 需要用真实分母证据替代融资估值推理
        - 要求提供审计包或董事会批准的管理账
      - - 利润率结构
        - 按部署类型和服务负担拆分的毛利率
        - 需要检验数据 / 护城河是否真正转化为经济质量
        - 要求提供 CATL 类和零售类项目的贡献利润率桥
      - - 客户集中度
        - 头部客户敞口和重复订单历史
        - 需要评估耐久性和伙伴依赖
        - 要求提供前 10 大客户 cohort 表和转化时间线
      - - 股权结构 / 优先权
        - 清算优先权、反稀释和 pro-rata 权利
        - 需要判断名义估值是否等于普通股价值
        - 要求提供已签署条款清单摘要或最新股权结构模型
      - - 试点转化
        - 试点到付费机队的转化指标和铺开节奏
        - 需要判断技术验证是否正在变成商业验证
        - 要求提供部署漏斗和季度 cohort 扩张数据
    notes: 这些要求是把判断从继续研究上调所需的最低集合；没有这些证据，当前估值仍是战略期权价值下注。
    claimRefs:
      - CV005
      - CV042
      - CV053
      - CV055
