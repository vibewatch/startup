      - number: '8.2'
        title: 当前估值标记与估值背景
        blocks:
          - type: paragraph
            body: >-
              公开证据支持的是近似估值，而不是精确标记。Spirit AI 保留来源大体指向约 20 亿元人民币新增资本、约 100 亿元人民币估值，但在相似报道之间，轮次规模相差约 $10M。这个差异小到足以接受「约
              $1.4B」这一标记，同时仍要拒绝虚假精确。更重要的是这个标记代表什么。Spirit
              披露了技术和部署进展，却没有披露足以支撑传统倍数的利润表或资产负债表数据。投资者因此只能换框架：看可比私营估值、机器人公司公开披露质量，以及结构化环境下运营证明的强度。更大的行业背景是顺风的。IFR
              报告称工业机器人价值创纪录，中国仍是部署重心。IFR 关于人形机器人的较新立场文件，一方面提到政府和投资者热情，另一方面也明确试图区分愿景与现实；Morgan Stanley
              则认为，受控作业场地可能让人形机器人比自动驾驶汽车更快商业化，但也警告社会接受度和市场可行性可能需要数年到数十年。与此同时，Bain、IEEE 和 The Robot Report
              都警告，大多数人形机器人部署仍是结构化、试点密集，距离广泛自主商业化还有距离。大型战略市场、受控环境进展、仍然漫长的规模化路径三者叠加，解释了为什么 Spirit
              可以拿到真实独角兽估值，同时又过于不透明，无法给出干净的买入结论。
