      - number: '3.4'
        title: 护城河耐久度与替代风险
        blocks:
          - type: paragraph
            body: >-
              Spirit AI 确实有护城河论点，但比泛泛的“AI 领导者”叙事更窄。数据采集、工业适配和力控部署相互强化时，护城河最强：超过 200,000 小时交互数据、更低采集成本、公开 CATL 证明，以及
              Bosch 相关更多场景准入，都帮助 Spirit 比只有实验室视频的创业公司学得更快。但这些优势并不能消除替代风险。Bain 和 IEEE
              都提醒，行业仍然试点密集，尚未在非结构化环境中达到广泛可靠。这一点重要，因为 Spirit
              仍在一个市场里竞争：资本更充足的全栈平台可以把模型层内化，低成本厂商可以重设客户价格预期，工业在位者可以凭更强流程软件和服务组织从试点走向生产。最大的未解风险是集中度不透明：公开来源没有披露 Spirit
              的表面进展是否依赖少数锚定账户，也没有披露实际定价或续约经济性。换句话说，Spirit 可能拥有真实数据飞轮，但这个飞轮能否耐久，仍取决于伙伴场景能否在竞争对手以更大规模做同样事情之前，转化为可重复付费部署。
