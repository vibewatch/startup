      - number: '8.4'
        title: 情景区间、论点失效与最终尽调
        blocks:
          - type: paragraph
            body: >-
              由于没有公开收入，情景框架必须保持定性且保守。牛市情景下，Spirit 把伙伴支持的试点转化为可重复工业部署，守住数据优势，并获得更接近私营可比高端区间的后续融资或战略期权。基准情景下，Spirit
              仍具战略相关性，但披露依旧不足，估值支撑维持在上一轮估值附近。熊市情景下，试点转化缓慢、经济性弱于预期，或行业整体降估值，会把 Spirit 拉向披露更充分的工业同行，而不是更高 AI
              溢价群体。最大的论点失效触发器不是意识形态，而是运营：最终收入披露偏弱，从工厂证明到付费机队转化缓慢，关键场景伙伴流失，或中国人形机器人估值整体重置。尽调答案同样务实。在高于当前估值标记继续投新钱之前，投资者需要审计后的收入和毛利、客户集中度、股权结构条款，以及证据证明
              CATL 和 Bosch 类场景正在转化为可重复的付费部署，而不是停留在技术上亮眼但经济性狭窄的试点。
