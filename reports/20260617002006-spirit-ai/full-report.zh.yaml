      - number: '5.2'
        title: 架构与运营模式
        blocks:
          - type: paragraph
            body: >-
              公开开发者表面支撑了对 Spirit AI 运营架构的一个具体判断。Spirit v1.5 被描述为统一 VLA 栈，包含视觉语言主干、动作头和 policy API；代码仓库布局还加入训练代码、数据集处理和
              RoboChallenge 运行路径。文档随后通过遥操作、仿真和机器人端推理流程，把模型层连接到机器人运营。遥操作指南尤其有信息量，因为它明确了 VR 硬件、网络默认值、端口和启动顺序；OpenPI
              适配指南则记录了为 Moz1
              微调和服务策略的实用路径。这些来源合在一起，暗示了一条循环：人工遥操作和场景采集喂给训练，训练喂给模型发布，模型发布再喂给基准测试和真实机器人试验。因此，架构是全栈且以数据为中心的，但看起来仍需要较多现场操作，而不是交钥匙。
