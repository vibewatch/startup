  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 推荐结论来自一个冲突：技术验证很强，但财务披露很弱，而估值已经打到实打实的独角兽水平。
    data:
      nodes:
        - id: n1
          label: |-
            技术验证
            （RoboChallenge、CATL、Bosch）
        - id: n2
          label: |-
            市场顺风
            （中国机器人需求）
        - id: n3
          label: |-
            财务不透明
            （未披露收入 / 利润率）
        - id: n4
          label: |-
            板块需谨慎
            （商业化以试点为主）
        - id: n5
          label: |-
            当前估值
            ~RMB 10B / ~$1.4B
        - id: n6
          label: |-
            结论
            继续研究 / 偏贵
