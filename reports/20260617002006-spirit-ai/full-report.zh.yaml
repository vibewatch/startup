  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 评估
      - 决策含义
    rows:
      - - 建议
        - 继续研究
        - 保留 Spirit AI 跟进，但不要只凭公开证据就把最新一轮价格视为已被充分验证。
      - - 置信度
        - 中
        - 融资事实有较合理佐证，但收入和股权结构经济性没有。
      - - 风险评级
        - 高
        - 商业化、集中度、优先权和电池 / 就绪度风险仍然重要。
      - - 估值立场
        - 偏高
        - 当前价格在公开收入证据出现前，已经计入了相当多的未来成功。
      - - 什么会抬高判断
        - 经审计经济性与重复部署
        - 具名客户转化、利润率和重复订单会让当前标记更容易辩护。
      - - 什么会打破判断
        - 收入转化弱或可比公司下调
        - 从验证走向付费机队的路径若更慢，估值会很快被重定价。
    notes: 这明确是围绕当前公开估值标记的价格敏感判断，不是泛泛判断 embodied AI 是否有意思。
