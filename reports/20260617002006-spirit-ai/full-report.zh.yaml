      - number: '1.2'
        title: 创始人、领导层与运营模式
        blocks:
          - type: paragraph
            body: >-
              创始人与市场的匹配，是 Spirit AI 公开叙事中最强的部分之一。独立报道把韩凤涛识别为创始人兼 CEO，此前曾在 Rokae Robotics 担任高级运营角色；高阳则反复作为学术和具身模型锚点出现，拥有
              Berkeley 和清华背景。百度百科补充了联合创始人兼 COO 郑凌吟，具备商业化和海外机器人经验。合在一起看，公司似乎搭起了一支混合型创始团队，覆盖工业机器人执行、前沿具身模型研究，以及
              go-to-market 或运营经验。这正是投资人在该赛道希望看到的组合：难点不在发布一个基准分数，而在把分数转化为可靠的物理部署。运营模式线索也异常具体。Spirit AI 招聘页显示，公司在招 VR
              遥操作、数据算法、大规模训练基础设施、机器学习平台、控制系统、硬件和制造相邻岗位。文档确认遥操作和现场集成属于真实工作流，而不只是实验室演示。这在战略上重要，因为它暗示公司的护城河正在数据采集、模型训练、部署工程和伙伴准入的交叉点上累积。负面在于披露质量：已审阅来源没有提供公开董事会名单、正式治理图谱，也没有清楚说明
              2024-2026 年融资序列后谁控制公司。
