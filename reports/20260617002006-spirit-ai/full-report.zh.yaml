        title: 财务结论与尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              最能支撑的财务结论是谨慎尊重，而不是确信。Spirit AI 有多个真实公司质量指标：能吸引资本的创始人 / 科学家班底，可能复利成独特训练数据的伙伴准入，以及 CATL、JD 和 Bosch
              相关工业验证中的真实场景。这些都是有意义的正面因素。但证据仍未达到投资人承销收入质量、利润率路径或资本充足性所需的水平。公开材料没有收入桥、没有 bookings 到 revenue
              的转化、没有现金或烧钱披露，也没有调和后的 2026
              年融资时间线。负面行业证据推动判断更保守。独立观察者持续认为，人形机器人的需求密度、uptime、安全和电池约束尚未解决，许多部署仍是试点或高度结构化的验证，而非持久的广泛市场铺开。如果 Spirit AI
              的数据优势足够快地复利，公司仍可能成为赢家之一。但今天，公开证据只能支持一个结论：公司在战略上有意思，且大概率融资充足；不能证明其业务已经能按传统 venture-growth 指标做财务承销。
