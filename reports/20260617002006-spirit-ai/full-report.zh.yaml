        title: 耐久性、扩张与集中度是主要未解承销风险
        blocks:
          - type: paragraph
            body: >-
              公开证据在任务级结果上强得多，在账户耐久性上弱得多。CATL 提供具体性能数字，JD 提供具体流程细节，但公开来源没有披露续约率、客户数量、已部署机队规模、合同期限、NRR
              或满意度分数。这给投资人留下一个集中度问题：Spirit AI
              是在建立可重复客户引擎，还是少数生态关系承载了大部分可见证明？单靠公开材料无法回答。可以说的是，公司目前依赖少数战略关系来提供最好的参考故事，而这些故事看起来仍依赖遥操作或高强度集成支持。在前沿机器人公司中，这种组合仍可能有价值，但它意味着毛利耐久性和可重复性应被视为开放尽调项，而不是默认优势，尤其当可见证据基础仍高度由场景驱动。在管理层披露账户级铺开数据之前，正确承销姿态是把这些交易对手视为相关性证据，而不是广泛多元、自我维持客户引擎的证明。
