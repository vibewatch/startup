  - id: TR005
    title: 缓释与否决标准表
    columns:
      - 风险
      - 可监测触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 商业集中度
        - 公开披露仍围绕同三家伙伴打转
        - 到 2027 年中仍没有具名的第四家独立生产客户
        - 降低对广泛商业化的信心，把护城河视为关系驱动
      - - 硬件 / 运行时短板
        - 未披露续航、正常运行时间或服务指标
        - 到下一轮融资周期，公司仍无法发布现场可靠性
        - 将规模假设视为投机，并压低估值倍数
      - - 隐私 / 遥操作合规缺口
        - 未出现隐私通知、DPA 模板或数据留存政策
        - 客户或监管方要求 Spirit 拿不出文件化控制
        - 升级尽调；出资前要求补齐合同和治理
      - - 出口管制 / 供应来源暴露
        - 组件来源或算力获取受限
        - 任一供应商或客户提示受限来源风险，或出现新的管制事件
        - 重新评估地域策略和资本开支时点
      - - 品类需求 / 竞争失利
        - 同行拿下最显眼的工业合同，而 Spirit 仍故事多、指标少
        - 又有两家竞争对手披露规模，Spirit 却没有等量产能证据
        - 将 Spirit 视为技术上有意思、商业上落后的标的
    notes: 这些触发项来自外部且可监测，因为当前公开证据太少，不能依赖内部 KPI。
