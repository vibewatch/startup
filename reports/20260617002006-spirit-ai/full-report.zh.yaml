      - number: '7.5'
        title: 监测指标、执行负担与论点失效触发器
        blocks:
          - type: paragraph
            body: >-
              判断 Spirit AI
              的风险画像，最有用的办法是把已经可见的内容和仍属私有的信息拆开。可见的是：公司有真实合作伙伴、真实融资、真实文档，以及至少一个真实工业工作流。仍属私有的是：转化率、收入集中度、运行时长、装机可靠性、隐私治理、出口管制流程和制造能力。这一缺口构成核心监测议程。投资者应持续寻找证据：远程操控依赖是否在下降，合作伙伴集中度是在缓解而非加深，安全
              / 合规基础设施是否更明确，至少一个已披露场景是否从展示性部署转成可重复的合同化推广。如果公司仍依赖少数叙事很强但经济性不透明的关系，如果标准和隐私义务收紧速度快过 Spirit
              的合规姿态，或者资本更充足的同行在 Spirit 披露可防御规模优势前就抢走稀缺真实需求，投资论点就会失效。
