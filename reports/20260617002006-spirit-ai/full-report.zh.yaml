  - id: TV003
    title: 牛市 / 基准 / 熊市场景表
    columns:
      - 场景
      - 概率信号
      - 假设
      - 估值逻辑
      - 示意区间
    rows:
      - - 牛市
        - 25%
        - 伙伴支持的工业场景转化为重复付费机队，Spirit 守住数据优势，后续轮次也得到更强披露佐证。
        - Spirit 取得更接近强势私有可比公司的溢价，但仍低于最亢奋的 AI 估值标记。
        - RMB 12B–RMB 18B
      - - 基准
        - 50%
        - 技术验证仍然真实，但到下一轮尽调周期，收入和优先权细节仍不透明。
        - 最新一轮估值仍是主要锚点，因为公开证据既不能支撑大幅溢价，也不能迫使折价。
        - RMB 9B–RMB 12B
      - - 熊市
        - 25%
        - 试点转化缓慢、经济性令人失望，或行业可比公司下修。
        - 投资人把 Spirit 重新定价到披露更充分的工业同行，而不是 AI 溢价私募轮。
        - RMB 6B–RMB 9B
      - - 概率加权
        - —
        - 基准情形证据占主导，因为正面因素真实但不完整。
        - 上述场景组的加权中点。
        - ~RMB 9.5B–RMB 11B
    notes: 场景区间是基于公开估值标记、部署验证和不利商业化证据给出的判断区间，不是收入倍数模型输出。
