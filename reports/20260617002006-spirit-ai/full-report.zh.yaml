  - id: TV002
    title: 正向论点 / 反向论点表
    columns:
      - 论点
      - 正向论点
      - 什么会改变判断
    rows:
      - - 数据护城河
        - 20 万小时以上数据、更低采集成本和公开基准胜利，可能复利放大模型优势。
        - 如果证据显示同行已经追平数据质量，或 Spirit 无法把数据转化为更好的部署，护城河会被削弱。
      - - 工业验证
        - CATL 和 Bosch 相关场景说明，公司已经不只是实验室演示。
        - 如果这些场景停留在狭窄试点，无法重复扩展为付费项目，验证力度会明显削弱。
      - - 市场背景
        - 中国仍是全球最大的机器人部署场，能支撑战略需求。
        - 如果中国需求增长只利好资本更足或披露更充分的竞争对手，Spirit 的市场顺风价值会下降。
      - - 披露缺口
        - 反向论点主要是财务不透明，而不是技术野心不足。
        - 经审计收入、毛利率和客户集中度数据会收窄最大折价。
      - - 资本市场纪律
        - 真实独角兽估值能证明市场胃口，但不能证明价格公平。
        - 优先权披露，以及来自更强一手来源的后续融资信息，会说明当前投资人买的是价格还是保护。
      - - 商业化现实
        - 全行业证据显示，部署仍高度结构化、试点占比高。
        - 如果能清楚走通从试点到机队经济性的转换，反向权重会下降。
    notes: 反向论点聚焦分母质量和承销纪律，并不是否认 Spirit AI 有真实技术进展。
    claimRefs:
