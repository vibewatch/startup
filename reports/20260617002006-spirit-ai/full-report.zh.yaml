        title: 附录
        blocks:
          - type: callout
            title: 为什么结论是继续研究而不是回避
            body: Spirit 已有足够真实证明——数据规模、基准结果、CATL 执行，以及 Bosch 关联工业入口——不应被直接否定。它缺的不是叙事动能，而是披露出来的经济性。
