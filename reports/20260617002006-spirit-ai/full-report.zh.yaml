  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 最新披露估值 / 状态
      - 商业验证信号
      - 为什么重要
      - 局限
    rows:
      - - Spirit AI
        - 最新私募估值约 RMB 10B / ~$1.4B
        - CATL 验证、Bosch 合作、JD 演示，未披露收入
        - 标的自身直接估值，也是当前最好锚点
        - 无经审计收入、利润率、现金或优先权披露
      - - Figure
        - 2024 年 Series B 轮估值 $2.6B
        - BMW 试点，加上 Helix 软件品牌和已发布规格
        - 高端私有 embodied-AI 参照
        - 美国资本通道和更强 AI 品牌让它成为偏宽松可比项
      - - Apptronik
        - 2025 年宣布 $350M Series A 轮
        - 试点伙伴关系和低于 $50k 的长期目标价格
        - 有用的阶段可比项，显示资本强度和商业化有限
        - 融资额不等于估值
      - - Agility Robotics
        - 私有战略投资；估值未披露
        - 正式付费 GXO 部署和 Schaeffler 网络野心
        - 保留私有样本中商业化质量最好的可比项
        - 未披露当前市场估值
      - - Unitree
        - 2026 年上海 IPO 申报，拟募 RMB 4.2B
        - 2025 年营业收入 RMB1.708B，且公开低价 G1 定价
        - 中国披露和价格透明度的强基准
        - IPO 招股书势头不等于长期盈利稳定
      - - UBTECH
        - 2026 年 6 月公开市值约 $6.90B
        - 2025 年收入 RMB2.001B，人形机器人收入 RMB820.6M，毛利率 37.7%
        - 工业人形机器人中披露最好的中国公开可比公司
        - 公开市值每日波动，且包含更宽的业务组合
    notes: 可比公司组合有意混合私募轮次和有公开披露支撑的同行，因为 Spirit 自身缺少已披露财务分母。
    enumerationScope:
      coverage: partial
      basis: >-
        Rows focus on the most decision-relevant private and public humanoid references retained in this evidence set,
        not every robotics company with a valuation headline.
