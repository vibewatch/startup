            body: >-
              2026 年 2 月融资是 Spirit AI 资本故事的锚定事件：据报道，公司在两轮快速融资中筹得近人民币 20 亿元，约 US$280-290 million，估值约人民币 100
              亿元。官方融资表述称，这笔资金用于扩大通用具身模型部署；这与招聘、文档和伙伴证据方向一致。但此后公开证据变得不干净得多。百度百科描述 2026 年 4 月一轮人民币 10 亿元融资，估值超过人民币 200
              亿元；Pandaily 后来使用“30 天 US$420 million”的标题；Gasgoo 6 月提到人民币 15 亿元 A+
              轮。这些报道可能都指向相关融资、重叠交割或部分披露，但公开记录没有把它们调和起来。因为存在冲突，Spirit AI
              的资本充足性无法从公开来源归一。我们不知道当前账上现金、月度烧钱、跑道或任何下一轮触发条件。也没有证据显示 Spirit 专属债务、可转债或项目融资义务。正确框架因此是二元的：相对于年龄，Spirit AI
              几乎肯定拥有可观资本准入；但资产负债表的准确状态仍是尽调问题，而不是公开事实。
