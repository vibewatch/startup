              Spirit AI 的公开客户记录不应被理解为经典企业软件客户名单。可见集合集中在少数高价值生态：CATL 用于工业制造验证，JD 用于零售服务遥操作和场景数据，Bosch
              用于工业环境和部件供应，以及一组更松散的开发者或评估用户，他们由 GitHub、Hugging Face 和机器人资源文档吸引而来。这个组合重要，因为买方、用户和付款方在不同条目中可能差异很大。CATL
              看起来像真实运营场地；JD 结合零售展示、场景准入和数据循环价值；Bosch
              更像战略伙伴和未来渠道；面向开发者的资产则让高技术早期采用者变得可信，即使公开企业引用不多。公开营销仍提到家庭和通用服务愿景，但具名实证集中在能够容忍有人监督迭代和场景定制的企业环境。
