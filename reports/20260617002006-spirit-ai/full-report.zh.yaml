      - number: '2.4'
        title: 增长驱动、商业化顺风与采用约束
        blocks:
          - type: paragraph
            body: >-
              Spirit AI 的多头叙事很容易讲清楚：中国拥有全球最密集的人形硬件供应链，HEIS 2026 让政策更结构化，劳动力短缺和危险精密作业创造真实自动化需求，而 Spirit
              已经聚起能提供工厂、零售点和数据的伙伴。这些都是有意义的优势。

              约束在于，独立行业文献仍很清醒。Bain 仍认为多数人形机器人处在试点阶段，IEEE
              认为最难的问题不是组装产能，而是需求、可靠性和安全性，公开演示中共享自治仍很常见。即便最显眼的竞争对手，也仍在用早期客户、试点线和分阶段扩产的语言叙事。因此，Spirit AI
              可能有一个强初始楔子，但还没有证明存在广阔的通用市场。近期商业化机会是真实的，但更适合被理解为一个受约束的工业和服务楔子，靠更好的数据、可靠性和伙伴转化向外扩张。
