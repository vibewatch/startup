      - number: '3.2'
        title: 产品、定价与能力压力
        blocks:
          - type: paragraph
            body: >-
              公开定价和规格披露让同业对比格外清晰。Unitree 是最明确的价格破坏者：其公开商店列出 G1 售价 $13,500，配置 23 到 43 个关节，机身约 35 公斤，手臂载荷仅约 2 公斤。G1
              重要，并不是因为它能直接替代每一个 Spirit 部署，而是因为它为低成本人形本体价格设定了公开锚点。Fourier 则从灵巧性一侧给 Spirit 施压。GR-1 被宣传为量产人形机器人，拥有 44 个关节和
              230 N.m 峰值扭矩；GR-2 进一步增加到 53 个关节、12-DoF 灵巧手、触觉传感，以及约两小时电池窗口。Spirit 的 Moz1 更像是力控 26-DoF
              部署机器人，而不是参与广泛公开规格竞赛。缺失项是价格：Spirit 尚未发布 Moz1 标价或合同结构，因此买方和投资人无法判断 Spirit
              胜在整体系统经济性、高端能力，还是补贴型试点转化。对早期战略轮而言，这种不透明尚可管理，但面对公布硬件价格或更深部署规格的对手，会削弱 Spirit 的位置。
