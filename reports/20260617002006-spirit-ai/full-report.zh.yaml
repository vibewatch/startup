chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品与布局
        blocks:
          - type: paragraph
            body: >-
              Spirit AI 在官网、关于页面、产品中心和 Bosch
              合作稿中的自我描述保持一致：公司要为机器人打造通用大脑，并创造下一代智能劳动力。这一点重要，因为公开材料读起来并不像一家只卖一款人形本体的单硬件公司。公司展示的是一套栈：Spirit
              模型家族、遥操作和数据采集流程、Moz 机器人硬件、SDK 和开发者文档，以及通过工业和零售部署采集的场景数据。官方文档还显示，产品界面已经包含快速上手说明、仿真挂钩、SDK
              参考和模型微调流程。这比只有营销落地页更能说明公司在实际运行。地理布局可支撑，但仍有些混乱。Spirit AI
              官方关于页面列出杭州、北京和深圳地址，百度百科则称总部在杭州。两者合在一起，指向一个以杭州为法律或运营中心、北京和深圳承担研发、业务拓展或生态接入的布局。公开记录对法律实体结构的披露弱于办公地点，也没有清楚解释杭州、北京及其他关联实体如何组织。即便如此，这一布局已足以把公司锚定为一家中国具身
              AI 创业公司，并且具备有意义的多城触达。
