  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              Spirit AI 最新公开估值足以作为估值讨论锚点，但仅凭公开证据，还不足以支撑看多结论。多家独立报道把 2026 年初融资规模放在约 20 亿元人民币、估值约 100
              亿元人民币；这意味着公司已经越过一个门槛，投资者定价的重点不再是种子期承诺，而是平台期权。问题在于，这一估值没有披露收入、毛利率、烧钱速度或现金余额来支撑。公司公开层面最强的正面证据集中在技术和运营：大规模数据采集说法、RoboChallenge
              模型证明、CATL 任务表现，以及 Bosch 和 JD 关联场景带来的伙伴支持型部署路径。这些都重要，但没有消除分母风险。没有财务披露时，问题不是 Spirit
              有没有意思，而是当前价格是否已经预设了公开证据尚未证明的商业化成功。在这个更窄的问题上，有纪律的答案是继续研究（research-more）：中等信心、高风险，估值立场偏紧。
