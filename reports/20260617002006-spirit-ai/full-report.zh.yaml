            body: >-
              Spirit AI 的文档呈现出真实的远程操控和数据栈，而不是一个模糊的自主性故事。公开材料里能看到 VR
              硬件、网络设置、控制端口、多模态感知、关节轨迹、力反馈采集和受控数据集访问。这在战略上有价值，因为远程操控仍是生成高质量具身数据最清晰的路径之一。但它同时带来合规负担。已审阅的公开来源没有抓取到覆盖远程操控数据的
              Spirit 专属 DPA、留存政策或隐私通知；独立法律评论却指出，机器人公司可能处理视频、音频、地理位置、生物识别和设备关联数据，从而触发隐私、安全和合同义务。MLT Aikins
              进一步指出，联网机器人会把一次技术事故放大为停机、监管审查、保险问题和供应链合同争议，因为安全与网络安全越来越重叠。JD
              的工作流让风险更高：远程操作者跨地点行动，机器人同时在和顾客及实体物体互动。一旦发生隐私事件、安全漏洞、任务执行不佳或人身伤害，责任可能在机器人制造商、操作者、客户和软件栈之间扩散，而法律仍在界定这条责任链。
