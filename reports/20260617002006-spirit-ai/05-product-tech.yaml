- id: deployment-maturity
  title: Deployment Maturity and Evidence of Technical Readiness
  body: 'The strongest product-maturity evidence comes from scenarios where public sources show the model and robot stack
    interacting with real environments instead of staged clips. CATL is the clearest case: reporting ties Moz to specific
    battery-pack EOL and DCR tasks and gives concrete outcome metrics such as greater than 99 percent connection success and
    a roughly threefold workload increase. JD MALL is weaker but still useful evidence because it shows a retail-service workflow
    with teleoperators, data capture, and fine-grained manipulation rather than only a showroom display. Bosch is strategically
    important but should be read as an enablement partnership, not a proven customer deployment, because disclosed scope centers
    on industrial environments, components, and data loops over the next two years. Benchmark leadership and open-source release
    assets add technical credibility, but they do not remove the need to verify commercial runtime performance on more than
    a few public scenarios.'
  claimRefs:
  - CE015
  - CE016
