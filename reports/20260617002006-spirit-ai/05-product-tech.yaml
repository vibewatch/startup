- id: dependencies-safety-gaps
  title: Dependencies, Safety Controls, and What Is Still Missing
  body: 'Spirit AI’s public materials also show where diligence risk still sits. The company depends heavily on partner-owned
    environments and components: CATL contributes a hard industrial use case, JD contributes a teleoperated retail data loop,
    and Bosch contributes industrial sites plus sensors and actuators. The docs demonstrate real safety procedures such as
    emergency-stop checks and controlled startup, and third-party directories acknowledge safe motion concepts like force
    control and collision handling. But those same third-party sources also highlight missing operating specifications and
    prototype-level maturity signals. The current public package does not disclose formal safety certifications, cybersecurity
    controls, uptime guarantees, or detailed maintenance metrics. For a buyer, that means the technical story is strongest
    on architecture, data-loop philosophy, and early scenario validation, and weakest on auditable production hardening. The
    result is a stack that looks directionally impressive and increasingly open, but still early in disclosed enterprise proof,
    especially for buyers that need documented serviceability and compliance before rollout. It also means procurement risk
    likely sits outside the model itself: field support, maintenance burden, and compliance documentation could decide whether
    promising pilots convert into scaled accounts.'
  claimRefs:
  - CE009
  - CE010
  - CE033
  - CE034
  - CE035
  - CE036
  - CE038
  - CE041
