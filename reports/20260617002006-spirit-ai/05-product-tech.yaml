company:
  name: Spirit AI
chapter:
  number: 5
  title: Product & Technology
  summary: 'Spirit AI publicly ships a coherent but still-young embodied stack: Moz1 hardware, Spirit v1.5 VLA software, teleoperation
    and simulation docs, and a versioned Moz resource pack for developer workflows. The strongest technical proof is the combination
    of benchmark leadership, open-source repo and model-card artifacts, and named scenario deployments at CATL and JD; the
    biggest diligence gaps are missing audited operating specs, formal certifications, and partner-concentration risk around
    Bosch, CATL, and JD.'
sections:
- id: product-surfaces
  title: Product Surfaces and What the Customer Actually Receives
  body: 'Spirit AI is not just marketing a generic humanoid. Public materials show a layered deliverable set: Moz1 as the
    physical robot, Spirit v1.5 as the embodied model family, teleoperation tooling, a MozRobot SDK and URDF resource pack,
    and an OpenPI-based adaptation path for finetuning and inference. That matters because the visible customer workflow is
    not simply “buy a robot and turn it on.” The current offer looks closer to a full-stack deployment package in which hardware,
    model weights, simulation assets, and human-in-the-loop operating procedures all matter. The product page emphasizes force-control
    hardware and VLA intelligence, while the docs show concrete implementation surfaces such as teleop controls, ports, API
    references, simulation hooks, and robot-resource downloads. In diligence terms, Spirit AI is shipping a platform with
    multiple artifacts and operating layers, not a single closed appliance.'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE011
  - CE012
  - CE037
  tableRefs:
  - TE001
  - TE002
  figureRefs:
  - FE001
- id: architecture-operating-model
  title: Architecture and Operating Model
  body: The public developer surface supports a specific view of Spirit AI’s operating architecture. Spirit v1.5 is described
    as a unified VLA stack with a vision-language backbone, action head, and policy API; the repo layout adds training code,
    dataset handling, and a RoboChallenge runtime path. The docs then connect that model layer to robot operations through
    teleoperation, simulation, and on-robot inference workflows. The teleop guide is especially revealing because it specifies
    VR hardware, network defaults, ports, and startup order, while the OpenPI adaptation guide documents a practical route
    for fine-tuning and serving policies for Moz1. Together these sources imply a loop in which human teleoperation and scenario
    collection feed training, training feeds model releases, and model releases feed both benchmark runs and real robot trials.
    The architecture is therefore full-stack and data-centric, but it still appears operationally hands-on rather than turnkey.
  claimRefs:
  - CE004
  - CE005
  - CE006
  - CE007
  - CE008
  - CE013
