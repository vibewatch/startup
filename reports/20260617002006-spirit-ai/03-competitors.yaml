- id: product-pricing-and-capability-pressure
  title: Product, pricing, and capability pressure
  body: 'Public pricing and spec disclosure make the contrast with peers unusually visible. Unitree is the clearest price spoiler: its public store lists the G1 at $13,500, with a 23-to-43-joint configuration, about 35 kilograms of body weight, and only about 2 kilograms of arm payload. That makes G1 important not because it is a direct substitute for every Spirit deployment, but because it sets a public anchor for what a low-cost humanoid body can cost. Fourier pressures Spirit from the dexterity side instead. GR-1 is marketed as a mass-produced humanoid with 44 joints and 230 N.m peak torque, while GR-2 adds 53 joints, 12-DoF hands, tactile sensing, and a roughly two-hour battery window. Spirit’s Moz1 is presented more as a force-controlled 26-DoF deployment robot than as a broad public specs race. The missing piece is price: Spirit has not published Moz1 list pricing or contract structure, so buyers and investors cannot tell whether Spirit wins on total-system economics, premium capability,
    or subsidized pilot conversion. That opacity is manageable for an early strategic round, but it weakens Spirit’s position against rivals who publish either hardware prices or deeper deployment specifications.'
