- id: enterprise-proof-and-distribution
  title: Enterprise proof and distribution power
  body: 'Enterprise proof currently favors rivals that publish more workflow detail or larger customer references. UBTECH says Walker S is built around 41 force-feedback joints for assembly-line synchronization, and UBTECH later announced several-hundred-unit Walker S2 deliveries with more than 800 million yuan of orders since early 2025. Figure’s story is different: a stronger software brand through Helix, a 20 kilogram payload and five-hour runtime, plus a BMW rollout that began with a narrow five-task manufacturing scope. Agility competes more through systems integration than through flashy specs alone. Its Digit robot is paired with Arc workflow software, and TechCrunch described the GXO/Spanx deployment as a formal post-pilot RaaS deal rather than a one-off demo. Boston Dynamics remains the incumbent benchmark on payload, runtime, and enterprise integrations, while AgiBot broadens pressure by bundling robots, datasets, simulation, and orchestration into a single platform narrative.
    Against this field, Spirit’s strongest proof is still industrial adaptation at CATL and partner-backed scenario access, not yet a publicly documented repeatable enterprise fleet program of its own.'
