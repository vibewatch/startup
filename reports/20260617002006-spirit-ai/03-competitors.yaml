  evidenceGaps:
  - type: missing-source
    severity: material
    topic: spirit-pricing-opacity
    missingEvidence: Public Moz1 pricing, contract structure, and service terms.
    whyItMatters: Without pricing the market cannot tell whether Spirit wins on economics, capability, or subsidized pilots.
    diligencePath: Request a current customer proposal, SKU sheet, or signed SOW summary with hardware, software, and service line items.
    relatedQuestionRefs:
    - QP021
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Customer-level revenue concentration and repeat-order data.
    whyItMatters: A moat built on a few anchor accounts is less durable than one built on broad repeat demand.
    diligencePath: Request top-10 customer share, renewal history, and pilot-to-production conversion by account.
    relatedQuestionRefs:
    - QP017
    - QP025
  - type: conflicting-data
    severity: minor
    topic: spirit-funding-amount
