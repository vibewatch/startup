company:
  name: Spirit AI
chapter:
  number: 1
  title: Company Overview
  summary: Spirit AI is a Hangzhou-founded embodied-intelligence startup that publicly frames itself as the builder of a universal robot brain rather than a single demo robot. Official pages, developer artifacts, and independent coverage support a 2024 founding, a full-stack strategy built around teleoperation data and Spirit VLA models, and real deployments with CATL, JD, and Bosch-linked industrial scenarios. The public record also shows unusually strong momentum in fundraising and partnerships, but board governance, headcount, revenue, and the exact post-February 2026 valuation remain materially opaque because later-round reports conflict with one another.
sections:
- id: identity-product-and-footprint
  title: Identity, Product, and Footprint
  body: 'Spirit AI''s self-description is consistent across its homepage, about page, product center, and Bosch partnership release: the company exists to build a universal brain for robots and to create a next-generation intelligent workforce. That matters because the public file does not read like a single-hardware startup selling one humanoid body. The company presents a stack: a Spirit model family, teleoperation and data-collection workflows, Moz robot hardware, SDK and developer documentation, and scenario data gathered through industrial and retail deployments. Official docs further show that the product surface already includes quick-start instructions, simulation hooks, SDK references, and model fine-tuning workflows, which is a stronger operating signal than a marketing-only landing page.  Geography is supportable but still a little messy. Spirit AI''s official about page lists addresses in Hangzhou, Beijing, and Shenzhen, while Baidu Baike identifies Hangzhou as headquarters.
    That combination suggests a Hangzhou-centered legal or operating base with Beijing and Shenzhen nodes for research, business development, or ecosystem access. The public record is thinner on legal-entity structure than on office locations, and it does not clearly explain how the Hangzhou, Beijing, and any other affiliate entities are organized. Even so, the footprint is credible enough to anchor the company as a China-based embodied-AI startup with meaningful multi-city reach.'
