- calloutType: risk
  title: Capital momentum is strong, but the most important 2026 numbers do not reconcile cleanly
  body: The February 2026 financing event is real enough to anchor the current company story, but later April and June 2026 reports point to materially different capital-raised and valuation outcomes without a clean primary-source reconciliation. At the same time, Spirit AI still does not disclose revenue, cash, headcount, or board structure. For underwriting, that means strong momentum but low transparency.
