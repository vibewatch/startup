- id: founders-leadership-and-operating-model
  title: Founders, Leadership, and Operating Model
  body: 'Founder-market fit is one of the strongest parts of Spirit AI''s public narrative. Independent coverage identifies Han Fengtao as founder and CEO after senior operating roles at Rokae Robotics, while Gao Yang is repeatedly presented as the academic and embodied-model anchor with Berkeley and Tsinghua credentials. Baidu Baike adds Zheng Lingyin as co-founder and COO with commercialization and overseas robotics experience. Taken together, the company appears to have assembled a hybrid founding bench spanning industrial robotics execution, frontier embodied-model research, and go-to-market or operating experience. That mix is exactly what investors want to see in a sector where the hardest problem is not publishing a benchmark score but converting that score into dependable physical deployment.  The operating-model clues are unusually concrete. Spirit AI''s careers page shows hiring for VR teleoperation, data algorithms, large-scale training infrastructure, machine-learning platforms,
    control systems, hardware, and manufacturing-adjacent roles. The docs confirm that teleoperation and field integration are part of the real workflow, not just a lab experiment. This is strategically important because it suggests the company''s moat is being built at the intersection of data collection, model training, deployment engineering, and partner access. The negative side is disclosure quality: none of the reviewed sources provide a public board roster, formal governance map, or a clean picture of who controls the company after the 2024-2026 financing sequence.'
  claimRefs:
  - CO007
  - CO013
