- id: milestones-commercialization-and-risk-signals
  title: Milestones, Commercialization, and Risk Signals
  body: 'The milestone arc is more substantive than a typical frontier-robotics startup file. Public sources tie Spirit AI''s early timeline to a July 2024 Moz0 appearance, a March 2025 Spirit v1 early-access milestone, a June 2025 Moz1 release, a December 2025 CATL production-line deployment, and February-to-June 2026 financing plus partnership milestones. The company''s official fundraising narrative also claims more than 200,000 hours of interaction data, a path to more than one million hours by end-2026, and 90% lower collection costs via proprietary wearables. Those are unusually specific claims for a private embodied-AI company and help explain why investors and partners treat data access as a central part of Spirit''s thesis.  At the same time, the public record still warrants caution. Official and third-party descriptions disagree about whether Moz1 should be thought of primarily as a wheeled humanoid or a bipedal humanoid, and third-party robot directories attach a roughly US$150,000
    price tag that Spirit itself does not confirm. Independent adverse sources also argue that the broader humanoid category remains early, with unresolved reliability, safety, battery, and demand-density constraints. That does not invalidate Spirit AI''s progress, but it does frame the right diligence posture: this is a fast-moving, well-connected company with real deployment signals, not yet a transparently disclosed scale business.'
