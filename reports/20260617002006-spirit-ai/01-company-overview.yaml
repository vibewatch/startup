- id: capital-base-and-strategic-stakeholders
  title: Capital Base and Strategic Stakeholders
  body: 'Spirit AI''s financing pace is one reason the company has become visible so quickly. Baidu Baike lays out a staged early history of angel, Angel+, Pre-A, and JD-led Pre-A+ financing across 2024 and 2025, while February 2026 reporting from The AI Insider and China Biz Insider converges on a far larger event: nearly RMB2 billion, or roughly US$280-290 million, raised across two fast back-to-back rounds at about a RMB10 billion valuation. Those February reports are the most defensible public funding anchor because they are corroborated by multiple independent outlets and line up with the company''s stated need to expand data, model, and deployment capacity.  After that point, however, the capital story becomes materially less clean. Baidu Baike describes a 2026-04-07 round of another RMB1 billion at a valuation above RMB20 billion, while Pandaily later used an even splashier headline claiming US$420 million in 30 days backed by Lei Jun and Jack Ma-linked funds. None of those later
    narratives is corroborated by a primary filing or a fresh company release in the reviewed evidence set, so the prudent diligence stance is to preserve the conflict rather than force a single number. What is clearer is the strategic shape of the shareholder and partner base. JD appears both as a financier and deployment partner, Bosch provides industrial validation and hardware-system leverage, and the broader investor set mixes venture, industrial, and state capital in a way that likely improves scenario access but may also complicate cap-table interpretation.'
