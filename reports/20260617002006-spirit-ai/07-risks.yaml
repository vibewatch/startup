- id: monitoring-and-thesis-breakers
  title: Monitoring indicators, execution burden, and thesis-break triggers
  body: 'The most useful way to hold Spirit AI''s risk profile is to separate what is already visible from what remains private. Visible: the company has real partners, real funding,

    real documentation, and at least one real industrial workflow. Private: conversion rates, revenue concentration, runtime, installed-base reliability, privacy governance,

    export-control process, and manufacturing capacity. That gap creates the core monitoring agenda. Investors should watch for proof that teleoperation dependence is falling,

    that partner concentration is easing rather than deepening, that safety/compliance infrastructure is becoming more explicit, and that at least one disclosed scenario converts

    from showcase deployment into repeatable contracted rollout. The thesis breaks if the company remains dependent on a few narrative-rich but economically opaque relationships,

    if standards and privacy obligations harden faster than Spirit''s compliance posture, or if better-capitalized peers capture the scarce real demand before Spirit discloses a

    defensible scale advantage.'
