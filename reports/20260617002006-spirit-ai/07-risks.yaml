  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: privacy-governance
    missingEvidence: Spirit-specific privacy notice, DPA template, biometric-data handling policy, cross-border transfer map, and retention/destruction schedule for teleoperation data.
    whyItMatters: Teleoperation and multimodal data collection are core to Spirit's current operating model, so governance gaps can block customers or trigger liability.
    diligencePath: Request data-flow architecture, privacy policy pack, DPIA / PIA templates, and customer-facing DPA language.
    relatedQuestionRefs:
    - QR017
    - QR018
    - QR027
  - type: enumeration-incomplete
    severity: material
    topic: export-control-and-sourcing
    missingEvidence: A sourced component map showing which chips, sensors, and compute dependencies are vulnerable to export controls or provenance screening.
    whyItMatters: Without component-level visibility, investors cannot judge whether export-control shocks are a remote macro risk or a direct operational blocker.
    diligencePath: Obtain bill-of-materials provenance, outside export-counsel review, and a restricted-supplier contingency plan.
    relatedQuestionRefs:
    - QR010
    - QR011
    - QR027
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: field-reliability-and-capacity
    missingEvidence: Runtime, uptime, MTBF, service cost, installed-base count, manufacturing capacity, and deployment-conversion metrics for Moz1.
    whyItMatters: These metrics determine whether Spirit AI is scaling a business or only scaling a narrative around a few strong partner logos.
    diligencePath: Request operating metrics by site plus manufacturing and service-readiness dashboards.
    relatedQuestionRefs:
    - QR015
    - QR022
  - type: private-evidence-only
    severity: material
    topic: customer-concentration-and-revenue
    missingEvidence: Customer concentration, contract values, renewal logic, and revenue contribution by CATL, JD, Bosch-related programs, and any other named customers.
    whyItMatters: Commercial concentration is currently one of the largest visible risks, but public evidence is too sparse to quantify it.
    diligencePath: Review signed contracts, pipeline split by vertical, and partner-conversion assumptions for the next financing cycle.
    relatedQuestionRefs:
    - QR001
    - QR022
    - QR023
