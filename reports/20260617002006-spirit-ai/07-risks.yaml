- id: data-privacy-teleoperation-and-compliance
  title: Data, privacy, teleoperation, and accountability risk
  body: 'Spirit AI''s documentation shows a real teleoperation and data stack rather than a vague autonomy story. VR hardware, network settings, control ports, multimodal sensing,

    joint trajectories, force-feedback capture, and gated dataset access all appear in public materials. That is strategically valuable because teleoperation remains one of the

    clearest ways to generate high-quality embodied data. It is also a compliance burden. The reviewed public sources do not surface a fetched Spirit-specific DPA, retention policy,

    or privacy notice covering teleoperation data, even though independent legal commentary says robotics companies may process video, audio, geolocation, biometric, and device-linked

    data that triggers privacy, security, and contractual obligations. MLT Aikins adds that connected robots can turn a technical incident into downtime, regulatory scrutiny,

    insurance questions, and supply-chain contractual disputes because safety and cybersecurity increasingly overlap. JD''s workflow raises the stakes because teleoperators are acting

    across locations while the robot interacts with

    customers and physical objects. If anything goes wrong — privacy incident, security breach, poor task execution, or physical harm — accountability can spread across the robot maker,

    the operator, the customer, and the software stack in ways that are still being negotiated by the law.'
  claimRefs:
  - CR030
