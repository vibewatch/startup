- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Commercial concentration
    - Public disclosures still revolve around the same three partners
    - No named fourth independent production customer by mid-2027
    - Reduce conviction on broad commercialization and treat moat as relationship-driven
  - - Hardware / runtime weakness
    - No disclosed runtime, uptime, or service metrics
    - Company still cannot publish field reliability by the next financing cycle
    - Treat scale assumptions as speculative and tighten valuation multiples
  - - Privacy / teleop compliance gap
    - No privacy notice, DPA template, or data-retention policy appears
    - A customer or regulator asks for controls Spirit cannot document
    - Escalate diligence; require contractual and governance remediation before capital deployment
  - - Export-control / sourcing exposure
    - Component provenance or compute access becomes constrained
    - Any supplier or customer flags restricted-origin risk or new control event
    - Reassess geography strategy and capex timing
  - - Category demand / competitive loss
    - Peers win most visible industrial contracts while Spirit remains story-rich but metric-poor
    - Two additional competitor scale disclosures land without equivalent Spirit capacity evidence
    - Treat Spirit as technically interesting but commercially trailing
  notes: The triggers are external and monitorable because current public evidence is too sparse to rely on internal KPIs.
