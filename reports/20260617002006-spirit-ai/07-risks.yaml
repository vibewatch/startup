company:
  name: Spirit AI
chapter:
  number: 7
  title: Risks
  summary: 'Spirit AI''s main risk is not a lack of narrative momentum but the fragility of converting a few high-profile partner scenarios into repeatable, compliant, economically durable deployment.

    Public evidence shows real progress — CATL, JD, Bosch, strong funding, detailed teleop docs — yet the same evidence reveals concentration, narrow industrial proof, unresolved privacy/accountability

    questions, evolving humanoid safety standards, and meaningful exposure to export-controlled compute and partner-owned channels. The investment case therefore hinges on whether Spirit can reduce

    teleoperation and compliance friction while widening beyond a handful of scenario-rich but economically opaque relationships before faster-scaling Chinese incumbents set the market pace.'
sections:
- id: commercialization-and-concentration-risk
  title: Commercialization concentration and scenario narrowness
  body: 'Spirit AI has enough public evidence to show that it is more than a slide-deck company, but the same evidence shows how concentrated the proof base still is.

    The named references are essentially three: CATL for one high-value battery-line workflow, JD for teleoperated retail-service data collection, and Bosch for a two-year

    industrial partnership that is meaningful but still framed as programmatic collaboration rather than mature fleet revenue. That concentration matters because it makes

    commercialization fragile: if any one partner slows rollout, changes priorities, or decides to insource, Spirit''s externally visible narrative shrinks quickly. The wider

    humanoid market context does not remove this risk. Independent sources still describe most leading vendors as living in pilots, early adopter agreements, or carefully

    bounded factory tests. In other words, the category is not yet mature enough to let Spirit disappear into a broad tide of standardized enterprise demand. The company may

    have a credible wedge, but it is still a wedge.'
