  evidenceGaps:
  - type: missing-source
    severity: blocking
    topic: financial-opacity
    missingEvidence: Audited revenue, gross margin, and cash figures for Spirit AI.
    whyItMatters: Without an actual denominator the current public mark cannot be judged as fair, attractive, or expensive with high confidence.
    diligencePath: Request audited FY2025 statements plus current management accounts and a revenue bridge by scenario.
    relatedQuestionRefs:
    - QV008
    - QV030
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: preference-overhang
    missingEvidence: Latest term-sheet economics, liquidation preferences, anti-dilution, and cap-table waterfall.
    whyItMatters: Headline valuation can materially overstate the common-equity economics if later investors bought strong downside protection.
    diligencePath: Request a redacted term-sheet summary or cap-table model from counsel or the lead investor.
    relatedQuestionRefs:
    - QV024
    relatedTableRefs:
    - TV005
    - TV006
  - type: missing-source
    severity: material
    topic: pilot-conversion
    missingEvidence: Pilot-to-paid-fleet conversion metrics by customer and use case.
    whyItMatters: The thesis rests on technical proof becoming repeatable enterprise economics, and that conversion is not yet visible publicly.
    diligencePath: Request cohort data showing initial pilot date, paid conversion date, current fleet size, and retention.
    relatedQuestionRefs:
    - QV006
    - QV026
    - QV030
    relatedTableRefs:
    - TV005
    - TV006
  - type: conflicting-data
    severity: minor
    topic: round-size-precision
    missingEvidence: Primary company financing ledger reconciling the $280 million and $290 million descriptions of the same financing window.
    whyItMatters: The discrepancy is not thesis-breaking but should be cleaned up before any investment memo claims exact round mechanics.
    diligencePath: Request the company financing timeline from management or the lead investor.
    relatedQuestionRefs:
    - QV003
    - QV023
    relatedTableRefs:
    - TV004
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer share, repeat-order mix, and named-account dependency.
    whyItMatters: Partner-backed proof can still mask concentrated exposure, which would make the current valuation more fragile.
    diligencePath: Request a concentration schedule and repeat-order history for top accounts.
