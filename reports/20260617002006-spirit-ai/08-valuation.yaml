- id: scenario-range-and-thesis-breaks
  title: Scenario range, thesis breaks, and final diligence
  body: 'Because public revenue is absent, the scenario framework must stay qualitative and conservative. In the bull case, Spirit converts its partner-backed pilots into repeatable industrial deployments, preserves its data edge, and earns follow-on financing or strategic optionality closer to the upper private-comparable range. In the base case, Spirit remains strategically relevant but still underdisclosed, so valuation support stays around the last round mark. In the bear case, slow pilot conversion, weaker-than-expected economics, or a sector markdown pull Spirit toward better-disclosed industrial peers rather than toward the higher AI-premium cohort. The largest thesis-break triggers are not ideological but operational: weak eventual revenue disclosure, slow conversion from factory proof to paid fleets, loss of a key scenario partner, or a broader reset in Chinese humanoid valuations. The due-diligence answer is equally practical. Before adding new money above the current mark, investors
    need audited revenue and margin, customer concentration, cap-table terms, and evidence that CATL- and Bosch-like scenarios are converting into repeatable paid deployment rather than remaining technically impressive but economically narrow pilots.'
