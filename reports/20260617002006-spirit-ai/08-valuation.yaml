callouts:
- calloutType: recommendation
  title: Why the call is research-more rather than avoid
  body: Spirit has enough real proof—data scale, benchmark results, CATL execution, and Bosch-linked industrial access—to avoid an outright dismissive call. What it lacks is not narrative momentum but disclosed economics.
  claimRefs:
  - CV006
  - CV008
  - CV009
  - CV010
  - CV044
- calloutType: risk
  title: The biggest risk is denominator quality
  body: The current mark may be reasonable in a hot sector, but without audited revenue, margin, or preference terms investors still do not know whether they are paying for operating performance or just protected strategic upside.
  claimRefs:
  - CV005
  - CV042
  - CV053
- calloutType: assumption
  title: Treat later funding headlines conservatively
  body: Because later Spirit financing headlines are less primary and not fully reconciled across sources, this chapter anchors on the better-corroborated roughly 2 billion yuan / 10 billion yuan frame and refuses to extrapolate beyond it.
