    - Spirit earns a premium closer to the stronger private-comparable set while still below the most exuberant AI marks.
    - RMB 12B–RMB 18B
  - - Base
    - 50%
    - Technical proof remains real, but revenue and preference details remain opaque through the next diligence cycle.
    - The latest round mark stays the main anchor because public evidence neither justifies a large premium nor a forced discount.
    - RMB 9B–RMB 12B
  - - Bear
    - 25%
    - Pilot conversion is slow, economics disappoint, or sector comps reset downward.
    - Investors re-rate Spirit toward better-disclosed industrial peers rather than toward AI-premium private rounds.
    - RMB 6B–RMB 9B
  - - Probability-weighted
    - —
    - Base-case evidence dominates because the positives are real but incomplete.
    - Weighted midpoint of the above scenario set.
    - ~RMB 9.5B–RMB 11B
  notes: Scenario ranges are judgment ranges anchored to public marks, deployment proof, and adverse commercialization evidence; they are not revenue-multiple outputs.
