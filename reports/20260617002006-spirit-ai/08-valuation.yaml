- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Decision implication
  rows:
  - - Recommendation
    - research-more
    - Keep Spirit AI live, but do not treat the latest round price as fully underwritten on public evidence alone.
  - - Confidence
    - medium
    - Round facts are reasonably corroborated, but revenue and cap-table economics are not.
  - - Risk rating
    - high
    - Commercialization, concentration, preference, and battery/readiness risks remain material.
  - - Valuation stance
    - stretched
    - The current mark prices meaningful future success before public revenue proof exists.
  - - What moves the call up
    - Audited economics and repeat deployments
    - Named customer conversion, margins, and repeat orders would make the mark easier to defend.
  - - What breaks the call
    - Weak revenue conversion or comp markdown
    - A slower path from proof to paid fleets would force a re-rating quickly.
  notes: This is explicitly a price-sensitive judgment about the current public mark, not a generic judgment that embodied AI is interesting.
