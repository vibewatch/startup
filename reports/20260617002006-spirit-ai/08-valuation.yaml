- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Why it matters
  - Transmission to thesis
  - Action implication
  rows:
  - - Audited revenue far below investor expectations
    - Would show that current price is not grounded in commercial conversion
    - Undercuts the implied option value in the current mark
    - Move from research-more toward avoid unless price resets
  - - Weak pilot-to-production conversion at CATL/Bosch/JD-like accounts
    - Would show technical proof is not scaling economically
    - Breaks the strongest operational support for the thesis
    - Demand new deployment cohort data before committing capital
  - - Loss or weakening of a key partner scenario
    - Would reduce data and distribution leverage simultaneously
    - Compresses the moat and slows model improvement
    - Re-rate Spirit closer to a smaller standalone platform vendor
  - - Comparable-company markdown in China humanoids
    - Would change the market-clearing reference frame even without Spirit-specific bad news
    - Shrinks room for private-round premium pricing
    - Require downside protection or wait for the reset to clear
  - - Investor-protective preference stack emerges
    - Would mean headline valuation overstates common-equity value
    - Changes the economics of the current entry price
    - Insist on cap-table detail before adding new money
  notes: Triggers focus on operating and financing facts that would change price support, not on broad opinions about robotics.
  claimRefs:
  - CV005
  - CV018
  - CV050
  - CV051
  - CV053
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Revenue quality
    - Audited FY2025 and current YTD revenue by stream
    - Needed to replace round-mark reasoning with actual denominator evidence
    - Request audit package or board-approved management accounts
  - - Margin profile
    - Gross margin by deployment type and service burden
    - Needed to test whether data/moat actually translates into economic quality
    - Request contribution margin bridge for CATL-like and retail-like work
  - - Customer concentration
    - Top-customer exposure and repeat-order history
    - Needed to assess durability and partner dependence
    - Request cohort table for top 10 accounts and conversion timelines
  - - Cap table / preferences
    - Liquidation preferences, anti-dilution, and pro-rata rights
    - Needed to judge whether headline valuation equals common-equity value
    - Request signed term sheet summary or latest cap-table model
  - - Pilot conversion
    - Pilot-to-paid-fleet conversion metrics and rollout pace
    - Needed to judge whether technical proof is becoming commercial proof
    - Request deployment funnel and quarterly cohort expansion data
  notes: These asks are the minimum set required to move the call up from research-more; without them, the current mark remains a strategic option value bet.
