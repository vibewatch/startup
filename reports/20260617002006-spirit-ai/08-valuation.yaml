company:
  name: Spirit AI
chapter:
  number: 8
  title: Valuation
  summary: 'Spirit AI’s current public mark is best understood as a real but still underwritten-on-optionality unicorn price: roughly 2 billion yuan of early-2026 financing at about a 10 billion yuan valuation, with meaningful technical and deployment proof but no disclosed revenue denominator. Relative to private peers like Figure and Apptronik, and disclosure-backed Chinese comparables like Unitree and UBTECH, Spirit’s price is not absurdly rich, but it is still stretched for the evidence currently available. The disciplined call is research-more with medium confidence and high risk: preserve upside from CATL/Bosch/JD-backed proof, but refuse to underwrite a stronger stance until audited economics, cap-table terms, and pilot-to-fleet conversion data appear.'
sections:
- id: recommendation-and-price-discipline
  title: Recommendation and price discipline
  body: 'Spirit AI’s latest public mark is real enough to anchor valuation discussion, but not robust enough to justify a bullish call on public evidence alone. Multiple independent reports put the early-2026 financing at roughly 2 billion yuan and the valuation at about 10 billion yuan, which means the company has crossed the threshold where investors are explicitly pricing platform optionality rather than seed-stage promise. That said, the valuation is not underwritten by disclosed revenue, gross margin, burn, or cash balance. The company’s strongest public positives are technical and operational: a large data-collection claim, RoboChallenge model proof, CATL task performance, and partner-backed deployment pathways through Bosch and JD-linked scenarios. Those are meaningful, but they do not eliminate denominator risk. Without financial disclosure, the question is not whether Spirit is interesting; it is whether the current price already assumes commercialization success that public evidence
    has not yet proved. On that narrower question, the disciplined answer is research-more, with medium confidence, high risk, and a stretched valuation stance.'
