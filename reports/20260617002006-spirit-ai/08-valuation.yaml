- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Latest disclosed valuation / status
  - Commercial proof signal
  - Why it matters
  - Limitation
  rows:
  - - Spirit AI
    - ~RMB 10B / ~$1.4B latest private mark
    - CATL proof, Bosch tie-up, JD demos, no disclosed revenue
    - Direct subject mark and best current anchor
    - No audited revenue, margin, cash, or preference disclosure
  - - Figure
    - 2024 Series B at $2.6B
    - BMW pilot plus Helix software branding and published specs
    - High-end private embodied-AI reference
    - U.S. capital access and stronger AI brand make it a generous comp
  - - Apptronik
    - $350M Series A announced in 2025
    - Pilot partnerships and sub-$50k long-term target price
    - Useful stage comp showing capital intensity and limited commercialization
    - Funding amount is not the same as valuation
  - - Agility Robotics
    - Private strategic investment; valuation undisclosed
    - Formal paid GXO deployment and Schaeffler network ambition
    - Best commercialization-quality comp in the retained private set
    - No disclosed current market valuation
  - - Unitree
    - 2026 Shanghai IPO filing seeking RMB 4.2B
    - 2025 operating income of RMB1.708B and public low-cost G1 pricing
    - Strong China disclosure and pricing-transparency benchmark
    - IPO prospectus momentum does not equal stable long-term profitability
  - - UBTECH
    - Public market cap about $6.90B in June 2026
    - 2025 revenue RMB2.001B, humanoid revenue RMB820.6M, GM 37.7%
    - Best disclosed China public comp for industrial humanoids
    - Public market cap moves daily and includes a broader business mix
  notes: Comparable set is intentionally mixed across private rounds and public disclosure-backed peers because Spirit lacks its own disclosed financial denominator.
  enumerationScope:
    coverage: partial
    basis: Rows focus on the most decision-relevant private and public humanoid references retained in this evidence set, not every robotics company with a valuation headline.
