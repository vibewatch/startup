- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Thesis
  - What would change the view
  rows:
  - - Data moat
    - 200k+ hours, lower collection cost, and public benchmark wins can compound model advantage.
    - Evidence that peers have matched data quality or that Spirit cannot convert data into better deployments would weaken the moat.
  - - Industrial proof
    - CATL and Bosch-linked scenarios show the company is beyond lab demos.
    - If those scenarios stay narrow pilots without repeat paid expansion, the proof weakens sharply.
  - - Market backdrop
    - China remains the world’s largest robotics deployment arena, helping strategic demand.
    - If China demand growth benefits only better-capitalized or better-disclosed rivals, Spirit’s market tailwind becomes less valuable.
  - - Disclosure gap
    - The anti-thesis is mainly financial opacity rather than a lack of technical ambition.
    - Audited revenue, gross margin, and customer concentration data would narrow the biggest discount.
  - - Capital-market discipline
    - A real unicorn mark proves appetite, but not fairness.
    - Preference disclosure and later rounds from stronger primary sources would clarify whether current investors bought price or protection.
  - - Commercialization realism
    - Sector-wide evidence says deployments are still structured and pilot-heavy.
    - A clear transition from pilot to fleet economics would reduce this adverse weight.
  notes: The anti-thesis focuses on denominator quality and underwriting discipline, not on denying that Spirit AI has real technical progress.
