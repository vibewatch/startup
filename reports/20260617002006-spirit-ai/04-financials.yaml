- id: financial-verdict-and-diligence-blockers
  title: Financial Verdict and Diligence Blockers
  body: 'The most supportable financial verdict is cautious respect rather than conviction. Spirit AI has multiple indicators of genuine company quality: a founder / scientist bench that attracts capital, partner access that could compound into unique training data, and real scenarios with CATL, JD, and Bosch-linked industrial validation. Those are meaningful positives. But the evidence still stops short of what an investor would need to underwrite quality of revenue, margin path, or capital sufficiency. No revenue bridge, no bookings-to-revenue conversion, no cash or burn disclosure, and no reconciled 2026 financing chronology are publicly available.  Adverse sector evidence pushes toward conservatism. Independent observers continue to argue that humanoid demand density, uptime, safety, and battery constraints are not solved, and that many deployments remain pilots or tightly structured proofs rather than durable broad-market rollouts. Spirit AI could still become one of the winners if
    its data advantages compound fast enough. Today, however, the public evidence only supports a conclusion that the company is strategically interesting and probably well financed, not that its business is already financially underwritable on conventional venture-growth metrics.'
