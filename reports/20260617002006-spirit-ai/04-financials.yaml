callouts:
- calloutType: insight
  title: Spirit AI's strongest financial asset may be privileged scenario data, not disclosed current revenue
  body: 'JD''s planned data-center scale, CATL''s real production-line tasks, and Bosch-linked industrial validation all point to the same economic thesis: Spirit AI could win by compounding training data faster than rivals, even before it can show public margin disclosures. That is strategically attractive, but it is still a pre-underwriting thesis rather than a proven financial result.'
  claimRefs:
  - CI009
  - CI010
  - CI011
  - CI040
- calloutType: risk
  title: Revenue quality and runway remain unjudgeable from open evidence
  body: The company's financing momentum is real, but public evidence never closes the loop from pilots and partnerships to revenue recognition, gross margin, or cash runway. The later 2026 financing conflict makes that opacity worse rather than better. Investors should treat Spirit AI as well positioned, not yet financially de-risked.
  claimRefs:
