    topic: revenue and margin disclosure
    missingEvidence: Revenue, ARR, bookings, hardware gross margin, service gross margin, and revenue-recognition policy.
    whyItMatters: Without these numbers, public evidence cannot distinguish strong strategic positioning from an economically weak business model.
    diligencePath: Request a quarterly KPI pack with bookings, revenue, gross-margin segmentation, and pilot-to-production conversion rates.
