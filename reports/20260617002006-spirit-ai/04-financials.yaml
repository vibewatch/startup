company:
  name: Spirit AI
chapter:
  number: 4
  title: Financials
  summary: 'Spirit AI has assembled unusually strong capital access for a two-year-old humanoid-robotics company, but open evidence still does not reveal revenue, margins, cash, burn, or runway. Public materials support a hardware-plus-data-plus-deployment model built around Moz1, teleoperation, model fine-tuning, and partner scenarios with JD, CATL, and Bosch, while peer disclosures from UBTECH, Figure, Apptronik, Unitree, and Agility underline that scaled humanoid commercialization remains capital intensive and often loss-making. The underwriting conclusion is therefore mixed: Spirit AI looks strategically well positioned and well funded, but later-round financing reports conflict and the metrics needed to judge revenue quality or capital adequacy remain undisclosed.'
sections:
- id: revenue-model-and-commercial-surface
  title: Revenue Model and Commercial Surface
  body: 'Spirit AI''s public artifacts suggest a broader commercial surface than simply "sell humanoid robots." The product page, teleoperation docs, developer resources, and open-resource workflow all point to at least four monetizable layers: hardware (Moz and related embodiments), deployment integration, teleoperation and data-capture services, and model / fine-tuning enablement. This matters because it implies that Spirit AI may capture value both upstream and downstream of the robot body itself. A partner could pay for pilot hardware, for the workflow engineering required to put that hardware into a CATL or JD scenario, for the data infrastructure that keeps improving the model, or for some packaged combination of all three.  The problem is that none of the reviewed public sources discloses what the company actually charges or which model dominates. There is no public confirmation of whether Moz1 is sold outright, leased, wrapped inside a managed-service relationship, or subsidized
    to accelerate data collection. Third-party robot directories attach an indicative US$150,000 price point to Moz1, but Spirit AI does not publish a price sheet or a contract model. That means Spirit AI''s revenue model is visible in form, yet still opaque in economics.'
