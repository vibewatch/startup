- id: financing-history-and-capital-adequacy
  title: Financing History and Capital Adequacy
  body: 'The February 2026 financing is the anchor event for Spirit AI''s capital story: the company was reported to have raised nearly RMB2 billion, or roughly US$280-290 million, across two rapid rounds at about a RMB10 billion valuation. Official funding language says the capital is meant to scale the deployment of general-purpose embodied models, which is directionally consistent with the hiring, docs, and partner evidence. But public evidence becomes much less clean after that point. Baidu Baike describes an April 2026 RMB1 billion round at a valuation above RMB20 billion, Pandaily later used a US$420 million-in-30-days headline, and Gasgoo in June referenced a RMB1.5 billion A+ round. Those reports may all refer to related financings, overlapping closes, or partial disclosures, but the open record does not reconcile them.  Because of that conflict, Spirit AI''s capital adequacy cannot be normalized from public sources. We do not know current cash on hand, monthly burn, runway, or any
    next-round trigger. We also do not have evidence of Spirit-specific debt, convert notes, or project-finance obligations. The right framing is therefore binary: Spirit AI almost certainly has substantial capital access relative to its age, but the exact state of the balance sheet is still a diligence question, not a public fact.'
