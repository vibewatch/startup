- id: TI005
  title: Public Financial Gaps Table
  columns:
  - Missing private metric
  - Impact
  - Exact diligence path
  rows:
  - - Revenue / ARR / bookings
    - Cannot judge revenue quality or growth durability
    - Request monthly revenue bridge, bookings, and pilot-to-production conversion funnel.
  - - Gross margin by hardware vs services
    - Cannot assess whether scale improves or dilutes economics
    - Request segment margin split for hardware, deployment, and data services.
  - - Cash / burn / runway
    - Cannot judge capital adequacy or next-round urgency
    - Request current treasury position and 12-month cash forecast.
  - - Contract model (sale, lease, RaaS, managed service)
    - Cannot map GTM motion to capital efficiency
    - Request standard commercial terms and customer payment profile.
  - - Order backlog and installed base
    - Cannot separate pilot hype from scalable demand
    - Request deployed robots, active pilots, backlog, and churn / expansion metrics.
  - - Robot BOM, runtime, service staffing, and uptime
    - Cannot estimate payback, reliability economics, or field-support burden
    - Request current Moz1 unit-cost model and support SLA data.
  notes: These are the exact missing metrics that prevent a conventional underwriting model despite Spirit AI's strong strategic momentum.
