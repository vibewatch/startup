  topStrengths:
    - >-
      Spirit AI shows a coherent full-stack thesis spanning robot hardware, embodied models, teleoperation, and
      deployment data loops rather than a one-demo product story.
    - >-
      Public evidence includes real operating scenarios with CATL, JD, and Bosch-linked industrial environments, which
      is stronger than benchmark-only proof.
    - >-
      Founding-team fit is credible across industrial robotics, robot learning, and commercialization, and the company
      has attracted strong strategic investors quickly.
    - >-
      Open developer artifacts, benchmark claims, and resource-pack documentation suggest unusually high technical
      execution for a 2024-founded startup.
  topRisks:
    - >-
      Revenue, gross margin, burn, runway, headcount, and cap-table protections are not publicly disclosed, so investors
      cannot cleanly underwrite the current mark.
    - >-
      The public customer story is concentrated in a few strategic ecosystems, with little evidence yet of a diversified
      base of repeat production accounts.
    - >-
      Many visible workflows still depend on teleoperation, supervised data capture, and structured environments,
      leaving autonomy and unit economics unresolved.
    - >-
      Later 2026 funding and valuation headlines conflict across sources, increasing uncertainty around the true current
      capitalization and dilution picture.
  unresolvedGaps:
    - Audited revenue by stream, gross margin, cash burn, runway, and working-capital needs for scaled robot production.
    - >-
      Exact round sequencing, security terms, dilution, and post-February 2026 cap-table changes across the reported
      April and June 2026 financings.
    - >-
      Customer count, contract duration, repeat order behavior, and pilot-to-production conversion rates beyond CATL and
      JD.
    - >-
      Verified Moz1 operating specs such as runtime, payload, uptime, safety certification status, and fleet reliability
      in live deployments.
