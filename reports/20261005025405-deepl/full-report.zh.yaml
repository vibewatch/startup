        title: 图表与附录
        blocks:
          - type: callout
            title: 缺少原生翻译记忆库带来长期成本劣势
            body: >-
              DeepL
              在欧洲语言上保持明显的语言流畅度优势，但没有内置翻译记忆系统，意味着企业客户必须在开发迭代中反复翻译并重复支付相同短语和周期性文档。对于拥有结构化、高频重复文档的组织，这种架构会持续抬高运营支出，相比本地化管理套件或自建缓存架构处于劣势。
