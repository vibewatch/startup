      - number: '3.3'
        title: 定价经济性与套餐比较
        blocks:
          - type: paragraph
            body: >-
              各翻译供应商的定价反映了不同的成本结构和计费机制。传统机器翻译 API 严格按字符数计费，而基于 LLM 的翻译 API 按输入和输出 token 计费。DeepL 的商业 API 采用结构化月度方案，例如
              Growth 档每月 $32.50，包含 1,000,000 个字符，超出部分按每 1,000,000 个字符 $27.50 计费。相比之下，Google Cloud Translation 在每月永久
              500,000 字符额度之后，按每百万个字符 $20.00 的固定用量价格收费。Microsoft Translator 则以每百万个字符 $10.00 的价格显著低于两者，并提供每月永久 2,000,000
              字符免费额度。

              在预算档，GPT-4o-mini 等轻量级 LLM（每百万个输入 token $0.15，每百万个输出 token
              $0.60）在高效批处理请求时，能够以接近或低于传统按字符计费机器翻译引擎的总成本提供上下文感知翻译。面向企业用户的 DeepL Pro 按席位订阅，覆盖 Starter、Advanced 和 Ultimate
              档，凭借文档版式保留（DOCX、PPTX、PDF）以及符合 GDPR 的不记录保证来支撑溢价。然而，没有原生翻译记忆库意味着，翻译重复文档的组织相比会存储并去重既有片段的平台，成本会不断累积。
            claimRefs:
              - CP013
              - CP014
              - CP015
              - CP016
