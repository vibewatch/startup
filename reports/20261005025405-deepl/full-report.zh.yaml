      - number: '1.3'
        title: 历史里程碑、监管定位与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              DeepL 的发展轨迹显示，公司从算法基准优势逐步走向企业级合规和欧洲主权定位。DeepL
              在德国运营，直接遵循欧盟《通用数据保护条例》（GDPR）及正在成形的欧盟《人工智能法案》治理框架。为降低金融服务、医疗、公共管理等受监管行业的企业采购阻力，公司取得了 SOC 2 Type II、ISO
              27001 以及德国联邦信息安全办公室（BSI）C5 Type 2 等外部安全和隐私认证，并于 2025 年 5 月实现美国医疗工作流所需的 HIPAA 合规。企业商业条款还保证客户数据隔离，确认 DeepL
              Pro 订阅下提交的输入不会被保留用于机器学习训练。

              尽管运营执行力较强，潜在公开市场和私募投资者仍面临核心投资判断不确定性。主要尽调缺口包括：没有经审计的财务报表来核对面向专业消费者的自助订阅与企业合同收入；未披露 Series C
              清算优先权层级和老股交易的资本结构细节；以及缺乏正式董事会构成、投票权分配、创始人与机构股东之间保护性契约的透明度。这些都是后续尽调必须优先调查的维度。
