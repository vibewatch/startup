            body: >-
              DeepL 的企业条款给出了营销页面没有提供的边界。为提供服务所需的内容可以临时存储；符合条件的调试场景允许加密存储最长 72 小时。同一条款规定，收费服务年度平均可用性目标为 97%，Business Plan
              为 99%，但受排除项约束，同时不保证 API
              响应或处理内容正确。这些条款使客户侧复核、故障回退、数据分类和同意控制成为部署架构的一部分，尤其适用于法律、医疗、金融和实时语音场景。外部证据也说明需要按工作负载验证：Phrase
              认为机器翻译质量会因语言对、内容和定制方式而变，人工后编辑仍然重要。Wikipedia 对 WMT24++ 的总结称，前沿通用模型在 55 种语言和方言上排名高于包括 DeepL
              在内的传统机器翻译系统，但该排名采用自动指标、没有人工评估，这是关键限制。因此，不能仅凭笼统质量主张评估其护城河。
