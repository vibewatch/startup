  - id: TV003
    title: 乐观、基准与悲观情景
    columns:
      - 情景
      - 定性估值区间
      - 所需假设
      - 概率信号
      - 下行或升级触发条件
    rows:
      - - 乐观
        - 高于 2024 年 $2B 估值
        - 经审计的增长、强劲毛利率、稳定留存和企业扩张支撑历史溢价。
        - 公开证据无法赋予概率。
        - 取得达到申报文件质量的财务数据和经验证的队列经济性后升级判断。
      - - 基准
        - 等于或低于 2024 年 $2B 估值
        - 在捆绑和合规成本仍可控的情况下，增长追上此前倍数。
        - 默认尽调情景，不是概率估计。
        - 只有当前收入和条款支持该估值时才维持。
      - - 悲观
        - 大幅折价或下轮融资
        - 增长放缓、独立定价被压缩，或企业采用减弱。
        - 该判断可信，因为估值已过时且当前老股交易证据缺失。
        - 留存疲弱、利润率收缩或惩罚性融资条款触发下行。
    notes: 这些是定性价格区间，不是预测；公开证据不支持数值概率、当前收入倍数或目标回报。
