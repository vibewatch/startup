            body: >-
              DeepL 如今呈现的是一个套件，而不只是单一翻译器。API 层将 Translate、Write 和 Voice 分开：Translate 嵌入文本和文档翻译，Write 重写并调整风格或语气，Voice
              支持实时语音翻译和转写。公司称 Translate 覆盖超过 100
              种语言，并能保留受支持文件类型的格式。这些能力既覆盖直接面向终端用户的应用，也覆盖嵌入企业的工作流，因此产品既可以作为生产力应用，也可以作为网站、内部工具、支持系统和通信渠道中的基础设施。Codecademy
              教程为文本、文档和术语表工作流提供了有限的从业者信号，但不能证明生产环境 API 采用。DeepL 首页声称有超过 200,000 家企业使用服务，只说明触达广泛，不代表任何单一模块的成熟度、留存或工作负载结构。
