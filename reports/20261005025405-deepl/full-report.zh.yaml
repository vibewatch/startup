          - type: callout
            title: 前沿 LLM token 经济性正在改写大批量本地化预算
            body: >-
              轻量级前沿模型 token 价格快速下降，以 GPT-4o-mini 每百万个输入 token $0.15 为例，软件工程团队可以用接近或低于传统按字符计费机器翻译引擎的成本实现上下文感知本地化。DeepL
              的定价能力越来越依赖关键任务文档的版式处理、不记录数据的安全合规和企业工作流集成，而不只是原始翻译吞吐量。
            calloutType: insight
