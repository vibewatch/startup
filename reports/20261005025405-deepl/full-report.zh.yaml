            body: >-
              企业采用由 Klarna、Mazda、FIFA、NVIDIA 和国际商业航空公司等知名全球品牌的已记录部署支撑 [CU009, CU010]。在高后果行业，DeepL 被嵌入生产合规工作流，而不是供员工随意浏览
              [CU002]。例如，跨国制药客户使用 DeepL 翻译临床试验和监管申报档案，语言准确性会直接决定申报进度和收入实现 [CU002]。同样，全球商业航空运营商在把飞机转移并重新营销到海外司法辖区时，用
              DeepL 翻译完整的飞机维护文档 [CU010]。学术实证评估显示，在工程学生群体中，将 DeepL Write 与 Claude AI 搭配部署，可显著改善论证和正式句法（t = -43.72, p <
              0.001）[CU004]。不过，已命名客户证明了关键任务环境中的生产效用，公开客户案例很少披露合同金额、ACV 区间或长期多年承诺 [CU009, CU015]。
            claimRefs:
              - CU002
              - CU004
              - CU009
              - CU010
              - CU015
          - type: table
            tableRef: TU003
            claimRefs:
              - CU002
              - CU004
              - CU009
              - CU010
      - number: '6.4'
        title: 留存动态、扩张摩擦与智能体颠覆
        blocks:
          - type: paragraph
            body: >-
              DeepL 主要依靠产品驱动的落地扩张路径：最初采用往往来自营销、地区子公司或本地化团队等单一部门，之后才扩展到法务、产品和工程部门 [CU010, CU012]。为提高每个企业席位贡献的钱包份额，DeepL
              正从核心机器翻译扩展至自主工作流解决方案，重点包括 DeepL Agent 和企业 Customization Hub [CU012]。但 MIT 的独立行业评估和企业研究调查提醒，企业生成式 AI 试点中最高
              95% 未能证明可量化的财务 ROI，64% 的知识工作者称 AI 生成任务增多令工作负担上升 [CU016]。因此，DeepL 进入智能体自动化会遭遇组织摩擦、预算审查和企业概念验证疲劳
              [CU016]。关键的是，DeepL 对净收入留存（NRR）、总收入留存（GRR）、客户流失率和前 10 大账户集中度严格保密，投资者只能依赖代理指标，而非经审计的留存队列 [CU013, CU015]。
            claimRefs:
              - CU010
              - CU012
              - CU013
              - CU015
              - CU016
      - number: '6.5'
        title: 图表与附录
        blocks:
          - type: callout
            title: 企业留存与流失遥测存在不成比例的尽调缺口
            body: >-
              DeepL 经常强调服务超过 200,000 家企业、覆盖 Fortune 500 近一半，但没有提供关于净收入留存（NRR）、总留存或客户集中度的可审计披露 [CU001, CU002,
              CU013]。缺少队列披露时，投资者无法核实企业收入是在可持续扩张，还是因企业超大规模云厂商嵌入原生 LLM 而流失 [CU013]。
            calloutType: risk
            claimRefs:
              - CU001
              - CU002
              - CU013
          - type: callout
            title: 高风险合规中的语言精准度可抵御纯 LLM 商品化
            body: >-
              在翻译错误会带来严重监管或法律责任的领域，例如制药申报、飞机维护记录和具有约束力的并购合同，DeepL 的企业持久性更强 [CU002, CU010]。在这些场景中，专门的准确性基准（Slator 评分
              96.4/100）形成了通用对话式 LLM 难以轻易复制的切换成本 [CU008, CU010]。
            calloutType: insight
            claimRefs:
              - CU002
              - CU008
              - CU010
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险姿态与证据边界
        blocks:
          - type: paragraph
            body: >-
              最高优先级风险并不是 DeepL 已被证明按某个特定比例失败；现有证据没有提供这样的分母。相反，DeepL
              自身条款不保证机器输出正确，而两家翻译供应商声称，长文档完整性、术语控制或云部署存在限制。这两家供应商是竞争对手，不是独立基准，因此其主张应触发受控产品测试，不能当作已核验的事故证据。2024
              年一篇文献综述论文对总体准确度的评价更有利，但它是二手研究，不是当前生产审计。投资含义是一个后果高、频率未知的输出保障风险：在评估企业采用能否持续前，须对受监管或高后果工作流进行代表性验收测试、完整性检查和人工复核。
            claimRefs:
              - CR003
              - CR010
              - CR011
              - CR012
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR003
              - CR009
              - CR010
              - CR011
              - CR016
      - number: '7.2'
        title: 法律、合同与数据处理风险
        blocks:
          - type: paragraph
            body: >-
              DeepL 的已发布条款把重要风险分配给客户。条款称 API 响应和处理内容不保证正确，允许在 DeepL 或第三方云基础设施上处理（除非另有约定，地点由 DeepL
              决定），并允许在规定控制措施下将调试内容加密存储 72
              小时。条款还保留因来自受限地区而阻止访问或终止服务的权利。公开合同文字也限制救济和责任，但谈判后的企业协议可能不同，当前版本在此不可得。这些条款说明风险如何分配，并不证明发生过数据泄露、执法行动或客户损失。因此，在评估隐私、监管或诉讼风险概率前，尽调应取得当前主协议、数据处理附录、子处理商清单、安全审计材料、保险限额和理赔历史。
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR009
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR009
              - CR011
      - number: '7.3'
        title: 运营质量、可用性与缓解成熟度
        blocks:
          - type: paragraph
            body: >-
              运营风险分为三层。第一，必须按语言对、文档类型和风险等级验证输出质量，因为 DeepL 不保证正确性，竞争对手的主张也未获独立佐证。第二，一份较早的北美条款页描述收费服务年度平均正常运行时间目标为
              97%，Business 方案为 99%，并有排除项；由于该页面明确属于历史信息，不能说明当前服务水平。第三，DeepL
              一名员工的公开资料称其负责开发者体验和质量保证。这是积极的缓解信号，但属于自报信息，没有披露测试覆盖率、事故历史、恢复目标或控制有效性。若完整性测试失败、重大错误率超过约定阈值，或当前合同可用性与救济措施无法支持目标工作流，即应停止投资。
            claimRefs:
              - CR003
              - CR007
              - CR010
              - CR011
              - CR012
              - CR014
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR005
              - CR007
              - CR010
              - CR011
              - CR012
              - CR014
              - CR015
      - number: '7.4'
        title: 依赖、财务未知数与决策门槛
        blocks:
          - type: paragraph
            body: >-
              DeepL 允许使用第三方云基础设施，并免除对第三方应用的责任，由此形成供应商和集成依赖；现有证据没有披露依赖集中度。公司发布的 2026 年报告称，Censuswide 调查覆盖五国 5,005 名高管：68%
              使用人工流程或传统工具，71% 将工作流自动化列为 2026 年优先事项，36%
              称其为高优先级。这些是公司赞助研究中的需求和执行信号，不是收入、转化、留存或利润率数据。现有来源没有量化烧钱速度、现金跑道、毛利率、客户集中度、欺诈暴露、营运资金需求或基础设施承诺。因此，投资批准应要求经审计财务、客户和云集中度明细、当前正常运行时间与事故证据，以及已签署的合同保护；拿不到这些材料是投资逻辑破裂的触发条件，而不是编造估算的依据。
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR008
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR008
              - CR011
      - number: '7.5'
        title: 图表与附录
        blocks:
          - type: callout
            title: 输出保障是首要否决测试
            body: 不要把流畅输出等同于经核验的完整性：对高后果用例，应要求文档级核对、领域专属错误阈值和人工批准。
            calloutType: risk
            claimRefs:
              - CR003
              - CR010
              - CR012
              - CR015
          - type: callout
            title: 没有事故证据不等于没有事故
            body: 现有证据池没有独立监管机构、法院、数据泄露、宕机历史或客户流失记录；本章无法量化这些概率。
            calloutType: assumption
            claimRefs:
              - CR016
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 公开估值锚点与融资背景
        blocks:
          - type: paragraph
            body: >-
              最强的公开锚点是 2024 年 5 月融资：多个独立来源称 DeepL 募集 $300 million，投后估值为 $2 billion，是 2023 年 1 月约 $1 billion
              估值的两倍。这笔交易是历史价格，不是当前清算价。Forge 没有显示 DeepL 的价格，并称市场交易有限，因此没有可用于 2026 年 10 月的二级市场估值。不同数据集的融资总额也不同：Multiples 和
              Sacra 报告约 $400 million，Tracxn 则报告五轮累计 $415 million。这些数字代表募集资本，不是当前可用现金。因此，公开记录支持交易历史，但不足以确定精确的当前企业价值。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV010
              - CV012
              - CV013
              - CV014
      - number: '8.2'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              投资逻辑建立在商业触达能力和持续的产品扩张之上。DeepL 官网自称拥有超过 200,000 家企业客户，关于 2024
              年融资轮的报道称，募集资金将用于地域扩张和进一步研发。这些信号总体偏正面，但没有披露付费席位构成、留存、毛利率或现金创造能力。反向逻辑在于，超大规模云厂商的捆绑销售可能挤压独立翻译供应商的定价空间，而监管碎片化会抬高服务全球企业的成本。DeepL
              过往的企业条款还声明不保证服务持续运行或完全无错误，并将通常情况下的累计责任上限限定为前十二个月已支付或应支付的费用；这对关键任务部署构成尽调问题，但不等于已有实际事故证据。
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV013
      - number: '8.3'
        title: 情景与价格纪律
        blocks:
          - type: paragraph
            body: >-
              现有证据不足以支持传统的收入倍数估值。Multiples 记录 2023 年 1 月收入为 $50 million，并以当时 $1 billion 估值计算出 20.0x 倍数，但脚注说明该字段可能代表收入或
              ARR，也可能采用运行率或已报告的过去十二个月数值。因此，它既不是干净的 ARR 披露，也不是当前收入分母。下文采用定性价格区间，而非制造虚假精确度：溢价情景需要经审计的增长、利润率和留存证明；2024
              年估值标记需要证据表明业绩已追上此前倍数；若捆绑销售、合规成本或企业采用率走弱，下行情景意味着大幅折价或下轮融资。
            claimRefs:
              - CV006
              - CV007
              - CV010
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV006
              - CV007
              - CV010
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: 建议与退出准备度
        blocks:
          - type: paragraph
            body: >-
              建议为继续研究，信心中等，投资评估风险高，按最近披露的估值标记看估值偏高。这是对价格敏感的判断，并非否定产品质量：融资和客户信号可信，但用于评估目标回报的公开信息仍然缺失。投资前，应取得经审计的收入及毛利桥接表、队列留存、烧钱速度和现金跑道、最新股权结构表、清算优先权、参与权，以及
              2024 年融资轮中新股与老股交易的构成。退出准备度同样未经证实，因为审阅的 Forge 页面没有当前价格或融资轮数据。一笔有明确价格的老股交易，或达到监管文件质量的财务资料包，都将显著提升信心。
            claimRefs:
              - CV003
              - CV007
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV008
              - CV010
              - CV012
              - CV013
              - CV014
      - number: '8.5'
        title: 展品
        blocks:
          - type: callout
            title: 不要仅依据 2024 年估值标记定价
            body: 在把公司质量转化为入场价格前，要求提供经审计的最新财务数据、留存队列、股权结构表和完整融资条款。
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV007
              - CV012
              - CV013
              - CV014
