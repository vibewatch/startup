              现有证据支持采用代理指标，而非可比的市场规模估算。DeepL 目前称有超过 200,000 家企业信任其平台；2024 年 4 月 Write Pro 发布时称超过 100,000 家公司采用，Slator
              则报道 2021 年已有超过 10 亿人使用 DeepL 服务。这些数据的日期、群体和分母不同：人数不是企业数，注册用户或累计用户不是付费席位，企业 logo
