        - 外部插件和 AI 助手可能中介访问 DeepL 服务。
        - 按集成和客户工作流划分的情况未知。
        - 集成弃用、缺陷、凭据滥用或供应商中断会影响端到端服务。
        - 对嵌入式分发而言为中高风险。
        - 从客户角度看风险较低，因为 DeepL 不承担第三方应用责任。
        - 客户体验可能在 DeepL 合同控制之外失效。
      - - '3'
        - 企业买方工作流转化
        - 本地化、法务、产品、支持和采购团队必须替代手工或传统流程。
        - 调查显示需求广泛；收入和客户集中度未披露。
        - 优先级不会自动转化为生产使用、续约或可接受的单位经济性。
        - 在取得转化和留存证据前，风险为中等。
        - 公司赞助的调查证明存在需求，但不能证明 DeepL 的具体转化。
        - 销售周期、采用、留存和财务模型暴露仍无法量化。
    notes: 这项针对 5,005 名高管的调查由 DeepL 发起，Censuswide 于 2025 年夏季在美国、英国、法国、德国和日本开展； 它不是客户转化或收入队列。
    claimRefs:
