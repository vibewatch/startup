  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              DeepL 的可服务市场应以产品和合同实际覆盖的工作流来界定：文本和文档翻译、写作辅助、实时语音翻译，以及通过 API 进行的程序化翻译。UsagePricing
              为这些工作流列出三种商业计量方式——应用席位、Voice 分钟数和 API 字符数；DeepL 的条款也确认 Translator、Write、Voice 和 API
              是独立服务。因此，相关支出池是企业语言软件和机器处理支出，而不是整个语言服务经济。现状替代方案包括人工翻译和语言服务商、内部起草与后编辑、免费网页翻译器，以及更广泛技术平台捆绑的翻译功能。Slator 对
              DeepL Pro 的介绍显示，市场历史上从免费广告支持模式转向 B2B 经常性订阅，这解释了消费端触达可以形成漏斗，但不等于可服务的付费收入。
