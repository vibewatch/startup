      - number: '2.3'
        title: 买方分群、预算路径与采用驱动
        blocks:
          - type: paragraph
            body: >-
              证据指向多个采购中心，而不是一个统一的语言技术预算。语言本地化和语言管理团队购买翻译应用及工作流功能；工程和产品团队购买 API 容量；沟通及知识工作者职能可以增加 Write；协作或 IT 团队可以采购
              Voice。Slator 的 Deutsche Bahn 案例提供了语言管理负责人主导企业日常使用的具体证据。DeepL
              自有报告按汽车、制造、法律、生命科学、公共部门、零售、专业服务和金融服务等行业列出市场用例，但这份目录只能说明目标客户，不足以独立验证每个垂直行业的需求。采用由重复的多语种工作流、术语一致性、与现有软件集成，以及降低成本和缩短周转时间的可能性驱动。收益幅度仍是尽调事项，因为证据池中最强的
              ROI 百分比只出现在厂商托管的摘要里。
