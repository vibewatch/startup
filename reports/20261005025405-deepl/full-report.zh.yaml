figures:
  - id: FO001
    title: DeepL 战略演进与公司里程碑时间线（2008–2026）
    type: timeline
    summary: 梳理 DeepL 从双语语料库项目发展为多产品企业级语言 AI 平台的关键公司、融资、产品和基础设施里程碑。
    data:
      items:
        - label: 2008–2009：Linguee 成立
          date: '2009-04-01'
          detail: Gereon Frahling 和 Leonard Fink 在科隆创立 Linguee，开发网络爬取基础设施并整理双语句对。
          tone: neutral
        - label: 2017 年 8 月：DeepL Translator 公开发布
          date: '2017-08-28'
          detail: 神经机器翻译系统覆盖七种欧洲语言上线，在盲测基准中胜过 Google 和 Microsoft。
          tone: positive
        - label: 2018 年 3 月：DeepL Pro 商业化
          date: '2018-03-20'
          detail: 推出付费订阅层级，提供开发者 API 访问，并以企业隐私保证禁止留存用户文本。
          tone: positive
        - label: 2019 年 7 月：领导层交接至 Kutylowski
          date: '2019-07-01'
          detail: Jaroslaw Kutylowski 被任命为 CEO；Linguee 联合创始人 Gereon Frahling 不再负责高管层面的研究运营。
          tone: neutral
        - label: 2021 年：转制为 Societas Europaea
          date: '2021-06-01'
          detail: 公司重组将 DeepL GmbH 转为 DeepL SE，建立统一的泛欧洲公司治理框架。
          tone: positive
        - label: 2023 年 1 月：IVP 领投独角兽融资
          date: '2023-01-11'
          detail: 以 $1B 估值（€1B）融资超过 $100M，IVP 联合 Bessemer、Atomico 和 WiL 领投；DeepL Write 开启公开测试。
          tone: positive
        - label: 2024 年 5 月：$300M C 轮，估值 $2.0B
          date: '2024-05-22'
          detail: 由 Index Ventures 领投、ICONIQ Growth 和 Teachers' Venture Growth 参与，融资 $300M；客户覆盖达到 100,000 家企业。
          tone: positive
        - label: 2024 年 11 月：DeepL Voice 发布
          date: '2024-11-13'
          detail: 在首届 DeepL Dialogues 活动上发布面向虚拟会议和实时口语交流的实时语音翻译套件。
          tone: positive
        - label: 2025 年 5–8 月：医疗与数据主权安全认证
          date: '2025-08-26'
          detail: 先取得美国医疗领域 HIPAA 合规，随后取得德国联邦 BSI C5 Type 2 云安全鉴证。
          tone: positive
        - label: 2025 年 10 月：潜在 $5B 美国 IPO 传闻
          date: '2025-10-02'
          detail: Bloomberg 和 Reuters 报道称，公司与顾问就潜在美国上市进行初步讨论，目标估值最高 $5B。
          tone: neutral
        - label: 2025 年 11 月：DeepL Agent 与高管任命
          date: '2025-11-05'
          detail: >-
            推出面向知识工作的自主 DeepL Agent；任命 Martino Cadoni 为 CFO、Goncalo Gaiolas 为 CPO，之后又任命 Gavin Mee 为 COO、Detlef Krause 为
            CRO。
          tone: positive
        - label: 2026 年 4–9 月：语音到语音扩张
          date: '2026-09-15'
          detail: 在 30 多种语言中发布新一代语音保留功能和桌面应用；为 Dreamforce 2026 提供实时翻译。
          tone: positive
    approximationNotes: 日期来自官方新闻稿和新闻出版物。2021 年具体公司注册日只是对 SE 生效申报窗口的近似。
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO005
      - CO007
      - CO008
      - CO009
      - CO010
      - CO013
      - CO014
