      - number: '1.2'
        title: 资本结构、规模指标与公开市场抱负
        blocks:
          - type: paragraph
            body: >-
              DeepL 的机构资本化基础是从欧洲和北美一线风投机构累计募集的超过 $400 million 股权资金。2018 年，Benchmark 与早期投资者 btov Partners
              共同提供了最初的机构支持。2023 年 1 月，DeepL 完成一轮超过 $100 million 的融资，由 IVP 领投，估值约为 $1 billion（€1 billion），Bessemer
              Venture Partners、Atomico 和 WiL 参与。2024 年 5 月，公司又完成一轮由 Index Ventures 领投、认购额大幅超额的 $300 million Series C
              融资，投后估值为 $2.0 billion。Series C 银团引入了 ICONIQ Growth 和 Teachers' Venture Growth（Ontario Teachers' Pension
              Plan 的风险投资部门）等后期交叉投资机构，IVP、Atomico 和 WiL 也继续跟投。2025 年末的公开报道称，DeepL 已与财务顾问就潜在的美国 IPO 进行初步探索性讨论，目标估值最高或达
              $5.0 billion，但公司尚未提交注册声明或正式招股说明书。

              商业规模指标显示全球企业客户快速扩张，但经核验的财务披露仍很有限。公司企业客户和组织数量从 2024 年 5 月覆盖 60 个市场的约 100,000 家，增至 2025 年年中全球超过 200,000
              个企业账户，并自报已有数百万活跃日用户。GetLatka 等第三方行业聚合平台发布了 ARR 和收入估算，包括模型推算的 2024 年年度收入运行率 $185.2 million；但 DeepL
              作为私营公司，并未公开发布经审计的 GAAP 或 IFRS 财务报表、正式 ARR 拆分、毛利率或净收入留存指标。员工数在 2024 年 5 月约为 900 人，至 2025 年末接近 1,000
              人，并在科隆、纽约和旧金山设立专业技术中心。
