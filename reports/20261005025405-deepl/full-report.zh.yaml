chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份、产品演进与治理
        blocks:
          - type: paragraph
            body: >-
              DeepL SE 总部位于德国科隆，依据欧洲公司法运营（自 2021 年起为 Societas Europaea），最初由 Linguee GmbH 发展而来。公司的运营根源可追溯至 Linguee：该公司由前
              Google 研究科学家 Gereon Frahling 和 Leonard Fink 于 2008 至 2009 年间在科隆创立，最初是一款双语语料检索搜索引擎。Jaroslaw 'Jarek'
              Kutylowski 于 2016 年加入并领导机器翻译工程工作，主导神经网络架构，于 2017 年 8 月 28 日公开推出 DeepL Translator。商业化后，Linguee GmbH 更名为
              DeepL GmbH；Kutylowski 于 2019 年 7 月出任 CEO，Frahling 则退出运营层面的研究领导岗位。DeepL 于 2021 年转为 DeepL
              SE，将公司法主体改造成支持欧洲大陆业务和国际子公司的泛欧架构。

              DeepL 最初是一款 AI 翻译工具，凭借质量胜过 Google、Microsoft 的传统统计和早期神经引擎；如今已扩展成多产品企业通信套件。商业平台涵盖 DeepL Translator Pro、DeepL
              Write Pro（2023 年 1 月推出 beta、2024 年 4 月面向企业商业化的 AI 写作和语法优化助手）、DeepL Voice（2024 年末推出语音到语音和实时会议转写，随后于 2025 和
              2026 年加入 Voice API 及会议集成）、DeepL API 开发者基础设施，以及 DeepL Agent（2025 年末推出，用于自主完成知识工作者任务）。为支持全球市场扩张，管理层在 2025
              年末至 2026 年初完成制度化建设，新增 CFO Martino Cadoni、CPO Goncalo Gaiolas、COO Gavin Mee 和 CRO Detlef Krause。创始人兼 CEO
              Kutylowski 仍掌握主要战略和技术方向，但管理团队的广度已明显超越最初的研究核心。
