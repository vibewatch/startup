      - number: '2.4'
        title: 采用约束与估值关联
        blocks:
          - type: paragraph
            body: >-
              市场转化受到产品质量、语言覆盖、采购条款和定价透明度限制。DeepL 企业条款明确不保证机器生成内容的正确性或准确性，因此受监管和高后果工作流仍需人工审查与治理。条款还规定，收费服务按合理努力保证年度可用性
              97%，Business 客户为 99%，这对评估关键任务部署的买方很重要。一份 Reddit 讨论的证据强度较弱，不能作为基准，但记录了反复出现的买方担忧：DeepL 覆盖语言少于 Google
              Translate，且不同语言对的表现存在差异。最后，两个独立定价页面给出了明显不同的 API
              基础费用安排。可能的解释是版本不同，但两个页面都没有清晰的发布日期。因此，估值应锚定经核验的付费使用量、留存、收入结构和当前合同，而不是广泛用户触达、营销 ROI 或未经核验 TAM 的推算份额。
            claimRefs:
              - CM011
              - CM012
              - CM014
              - CM015
              - CM016
