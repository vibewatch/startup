          detail: 公司声称拥有超过 200,000 家企业客户。
        - id: denominator
          label: 估值分母偏弱
          detail: 可获得的 $50M 入场估值来自 2023 年 1 月，收入或 ARR 的计算基础不明确。
        - id: current-price
          label: 没有当前成交价
          detail: Forge 没有显示价格，市场交易活动也很有限。
        - id: terms
          label: 融资条款缺失
          detail: 优先权、参与权以及新股与老股的拆分情况均未公开。
        - id: decision
          label: 继续研究
          detail: 信心中等、风险高，且按最近一次披露的估值看价格偏高。
    approximationNotes: 该序列是分析逻辑，不是量化评分模型，也不代表交易概率。
