company:
  name: "DeepL"
chapter:
  number: 4
  title: "Financials"
  summary: "DeepL monetizes language software through subscriptions and metered API and voice usage, while its website claims adoption by more than 200,000 businesses. The assigned public evidence does not disclose recognized revenue, ARR, revenue mix, gross margin, retention, cash, burn, or runway, so the financial case remains unsuitable for valuation underwriting without private-company records."
sections:
  - id: "revenue-model-and-pricing"
    title: "Revenue model and pricing mechanics"
    body: >-
      DeepL has several monetizable product surfaces rather than one disclosed revenue line:
      Translator Pro and Write Pro subscriptions, API access, and Voice services. A prior
      North American enterprise agreement establishes the underlying mechanics: fixed base
      remuneration is due at the start of a billing period, API text usage can create
      usage-dependent charges, and speech services are charged by audio minutes with
      fractional minutes rounded up. The same prior terms allowed annual charge increases
      of no more than 7% with notice. These are contractual mechanisms, not evidence of
      current list prices, realized enterprise discounts, recognized revenue, or product
      mix. Those commercial quantities remain unavailable in the assigned evidence.
    claimRefs:
      - "CI001"
      - "CI003"
      - "CI004"
      - "CI005"
      - "CI012"
    tableRefs:
      - "TI001"
      - "TI002"
    figureRefs:
      - "FI001"
  - id: "gtm-and-cost-base"
    title: "Go-to-market motion and cost-base proxies"
    body: >-
      The clearest sales-efficiency evidence is directional and dated. In May 2024,
      TechCrunch reported that DeepL had grown largely through inbound demand and intended
      to build a stronger outbound function; the same report said financing proceeds would
      support sales and marketing as well as research and development. It also reported
      that about 60% of staff were technologists at that time. DeepL's current LinkedIn
      profile lists a broad 1,001-5,000 employee band, but neither source supplies selling
      expense, CAC, payback, quota attainment, or implementation cost. Staffing and GTM
      direction are therefore cost-base proxies only, not unit-economics measurements.
    claimRefs:
      - "CI009"
      - "CI010"
      - "CI011"
      - "CI014"
    tableRefs:
      - "TI003"
    figureRefs: []
  - id: "traction-and-capital"
    title: "Public traction and capital adequacy"
    body: >-
      DeepL's homepage says it is trusted by more than 200,000 businesses globally. That is
      a company-issued adoption indicator, not a verified count of paying customers, and it
      lacks cohort, contract-value, usage, and retention definitions. The latest financing
      evidence is clearer: TechCrunch, UpMarket, and Tracxn support a $300 million May 2024
      financing and a $2 billion post-money valuation, while Tracxn reports $415 million of
      cumulative funding across five rounds. Funding raised is not cash available. EquityZen
      describes pre-IPO access through sales by existing shareholders, so secondary-market
      availability likewise should not be treated as new cash to DeepL. Current cash,
      operating burn, debt, and runway remain unverified.
    claimRefs:
      - "CI002"
      - "CI006"
      - "CI007"
      - "CI013"
      - "CI015"
    tableRefs: []
    figureRefs: []
  - id: "financial-verdict"
    title: "Financial verdict and diligence blockers"
    body: >-
      The public record supports a scaled product footprint and substantial equity backing,
      but not revenue quality or a margin path. TechCrunch described DeepL as unprofitable
      in May 2024; that historical observation cannot establish its October 2026 status.
      No assigned source provides audited revenue, ARR, gross margin, renewal behavior,
      customer concentration, working capital, capex, or service-delivery cost. An archived
      Trustpilot page contains adverse complaints about support, billing, and translation
      quality, but it is an old, self-selected page rather than a retention benchmark. The
      underwriting priority is therefore audited financials and cohort-level economics,
      not extrapolation from customer claims, total funding, or secondary-market access.
    claimRefs:
      - "CI008"
      - "CI016"
      - "CI002"
      - "CI013"
      - "CI015"
    tableRefs: []
    figureRefs: []
