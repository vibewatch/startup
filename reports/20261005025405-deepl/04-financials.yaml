callouts:
  - calloutType: "risk"
    title: "Funding is not runway"
    body: "The reported $415 million cumulative funding total cannot establish current cash availability, and secondary transactions by existing holders do not finance DeepL. Cash, burn, debt, and primary-versus-secondary round composition remain diligence requirements."
    claimRefs:
      - "CI013"
      - "CI015"
  - calloutType: "recommendation"
    title: "Gate valuation work on private financial evidence"
    body: "Do not infer revenue or margins from the 200,000-business adoption claim or the $2 billion financing valuation. Require audited statements, revenue cohorts, product mix, gross margin, retention, and cash-flow records before applying a revenue multiple."
    claimRefs:
      - "CI002"
      - "CI007"
      - "CI008"
