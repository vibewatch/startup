  evidenceGaps:
    - type: missing-source
      severity: material
      topic: independent-benchmark
      missingEvidence: >-
        A current, independently reproducible benchmark by language pair, content
        type, model version, latency tier, and human evaluation protocol.
      whyItMatters: >-
        Generic quality claims cannot establish performance for a buyer's
        production workload or show whether specialization remains defensible.
      diligencePath: >-
        Run a blind benchmark on the buyer's corpus against named alternatives
        and retain raw outputs, reviewer instructions, and statistical results.
      relatedQuestionRefs: [QE005, QE007]
    - type: private-evidence-only
      severity: material
      topic: service-availability
      missingEvidence: >-
        Product-level historical uptime, latency percentiles, incident history,
        recovery performance, and contractual service-credit schedules.
      whyItMatters: >-
        Annual availability targets with broad exclusions do not quantify
        operational risk for embedded or real-time workflows.
      diligencePath: >-
        Request 24 months of status history and incident postmortems, then
        reconcile them to customer logs and proposed SLA language.
      relatedQuestionRefs: [QE004, QE006]
    - type: private-evidence-only
      severity: material
      topic: security-and-privacy
      missingEvidence: >-
        Current independent audit reports, architecture boundaries, subprocessors,
        retention controls by product, and evidence of control testing.
      whyItMatters: >-
        Contract terms describe selected controls but do not establish their
        operating effectiveness for sensitive text, documents, or audio.
      diligencePath: >-
        Review the latest SOC 2 report, ISO scope, penetration-test summary,
        data-flow diagrams, DPA, and product-specific retention configuration.
      relatedQuestionRefs: [QE006, QE007]
    - type: missing-source
      severity: minor
      topic: developer-signal
      missingEvidence: >-
        Public SDK repository activity, package downloads, release cadence,
        issue-resolution metrics, and active developer-community participation.
      whyItMatters: >-
        A tutorial proves discoverability but not API ecosystem health,
        implementation quality, or developer retention.
      diligencePath: >-
        Obtain official SDK and package identifiers, then review releases,
        contributors, open issues, downloads, and deprecation history.
      relatedQuestionRefs: [QE008]
