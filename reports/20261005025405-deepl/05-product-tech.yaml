      - Role
      - Dependency
      - Principal risk
    rows:
      - [Context and customization, Inject terminology document context and domain information, "Customer glossaries and usable context", "Incomplete or incorrect context can degrade output"]
      - [Specialized model layer, Balance source fidelity with target-language fluency, "Proprietary architectures curated bilingual and monolingual data", "Claims are not independently reproducible from the public evidence set"]
      - [Inference orchestration, Batch requests and schedule language-specific model capacity, "GPU capacity routing software and demand forecasting", "Latency and utilization tradeoffs can affect service quality"]
      - [Trust and service controls, Govern storage availability and downstream review, "Enterprise terms customer controls and fallback design", "Accuracy is not warranted and availability targets include exclusions"]
    notes: "Architecture is synthesized from a founder interview, an independent case study, and contract terms; it is not a verified system diagram or security audit."
    claimRefs: [CE008, CE009, CE010, CE011, CE012, CE013, CE014]
