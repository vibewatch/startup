callouts:
  - calloutType: "risk"
    title: "Disproportionate Diligence Gap in Enterprise Retention and Churn Telemetry"
    body: "While DeepL frequently emphasizes that it serves over 200,000 businesses and nearly half of the Fortune 500, it provides no auditable disclosures regarding net revenue retention (NRR), gross retention, or customer concentration [CU001, CU002, CU013]. In the absence of cohort disclosures, investors cannot verify whether enterprise revenue is expanding sustainably or experiencing attrition from native LLM embedding by enterprise hyperscalers [CU013]."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU013"
  - calloutType: "insight"
    title: "Linguistic Precision in High-Stakes Compliance Shields Against Pure LLM Commoditization"
    body: "DeepL's enterprise durability is reinforced where translation errors carry severe regulatory or legal liabilities, such as pharmaceutical drug submissions, aircraft maintenance records, and binding M&A contracts [CU002, CU010]. In these domains, specialized accuracy benchmarks (96.4/100 by Slator) create defensible switching costs that general-purpose conversational LLMs cannot easily replicate [CU008, CU010]."
    claimRefs:
      - "CU002"
      - "CU008"
      - "CU010"
