chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Product Evolution, and Governance
        blocks:
          - type: paragraph
            body: >-
              DeepL SE is a Cologne, Germany-headquartered Language AI company operating under European corporate law
              (Societas Europaea since 2021) after originally evolving from Linguee GmbH. The business traces its
              operational roots to Linguee, founded in Cologne between 2008 and 2009 by former Google research scientist
              Gereon Frahling and Leonard Fink as a bilingual concordance search engine. Jaroslaw 'Jarek' Kutylowski
              joined to lead the machine-translation engineering effort in 2016, spearheading the neural network
              architecture that launched publicly as DeepL Translator on August 28, 2017. Following commercial adoption,
              Linguee GmbH was renamed DeepL GmbH, and Kutylowski assumed the role of Chief Executive Officer in July
              2019 while Frahling stepped back from operational research leadership. DeepL transitioned its corporate
              legal form to DeepL SE in 2021, providing a pan-European structure that supports governance across
              continental operations and international subsidiaries.


              From its origins as an AI translation utility outperforming legacy statistical and early neural engines
              from Google and Microsoft, DeepL has expanded into a multi-product enterprise communications suite. The
              commercial platform spans DeepL Translator Pro, DeepL Write Pro (an AI writing and grammatical refinement
              assistant launched in beta in January 2023 and commercialized for enterprises in April 2024), DeepL Voice
              (speech-to-speech and real-time meeting transcription launched in late 2024 with subsequent Voice API and
              meeting integrations in 2025 and 2026), DeepL API developer infrastructure, and DeepL Agent (unveiled in
              late 2025 for autonomous knowledge-worker task automation). Executive leadership has undergone structured
              institutionalization to support global go-to-market scaling, adding Chief Financial Officer Martino
              Cadoni, Chief Product Officer Goncalo Gaiolas, Chief Operating Officer Gavin Mee, and Chief Revenue
              Officer Detlef Krause across late 2025 and early 2026. While founder-CEO Kutylowski maintains primary
              strategic and technical direction, executive management breadth has deepened significantly beyond its
              original research core.
            claimRefs:
