            - label: Low-latency voice serving
        - label: Data, evaluation, and controls
          detail: Curated data, human language expertise, service terms, and customer-side review bound quality and risk
          outputs:
            - label: Quality evaluation
            - label: Data-handling controls
            - label: Human review and fallback
