          Content may be processed on DeepL or third-party cloud infrastructure; processing location can depend on
          capacity and user location.
        - Depends on customer, user, data class, and applicable privacy or sovereignty regime.
        - Allowed architecture is documented; actual routing and concentration are unknown.
        - High for sovereignty-constrained or highly sensitive workloads.
        - 'Moderate on paper: temporary storage, encryption, and access controls are described.'
        - Subprocessor, transfer, residency, and audit requirements may constrain deployment.
        - >-
          Obtain the current DPA, subprocessor inventory, transfer mechanism, data-flow map, and independent control
          reports.
      - - '3'
        - DeepL may block access or terminate service when use is detected from restricted territories.
        - Territories and sanctions regimes listed or incorporated by the published terms.
        - Contractual control exists; false-positive and enforcement history are unknown.
        - Medium, rising for globally distributed users or resellers.
        - Documented policy; implementation evidence was not assigned.
        - Access interruption, customer support burden, and reseller compliance exposure.
        - Test geofencing, sanctions screening, escalation, notice, and customer-remediation procedures.
    notes: >-
      Severity is an underwriting judgment tied to the stated contractual consequence; likelihood is left unknown where
      the sources provide no incident denominator. Coverage is partial and negotiated customer agreements may differ.
    enumerationScope:
      coverage: partial
      basis: >-
        Material legal and regulatory exposures evidenced by the assigned current and prior DeepL terms plus a
        competitor data-sovereignty critique.
    claimRefs:
      - CR003
      - CR004
      - CR005
      - CR006
      - CR009
      - CR011
  - id: TR002
    title: Operational / quality / security risk register
    columns:
      - Priority
      - Failure mode
      - Likelihood
      - Impact severity
      - Mitigation maturity
      - Residual exposure
      - Monitor / kill criterion
    rows:
      - - '1'
        - Incorrect or incomplete translation enters a consequential workflow.
        - Unknown; official terms disclaim correctness and competitor allegations are not independent benchmarks.
        - High where omitted or mistranslated content changes obligations or decisions.
        - 'Unproven: general accuracy evidence exists, but workflow-specific controls are not disclosed.'
        - Fluent output may pass superficial review without proving completeness.
        - Kill deployment if representative tests miss content or exceed an agreed material-error threshold.
      - - '2'
        - Service availability falls below workflow requirements.
        - Unknown; a prior terms page states 97% and 99% annual targets with exclusions, not observed uptime.
        - Medium-to-high for embedded real-time or business-critical use.
        - Historical contractual target only; current SLA, credits, redundancy, RTO, and RPO are gaps.
        - Annual averages and exclusions can mask shorter severe disruptions.
        - Require current SLA and 24-month regional uptime; kill if remedies or recovery targets miss workflow needs.
      - - '3'
        - Sensitive content is retained or accessed during technical diagnosis.
        - Exceptional processing is contractually permitted; occurrence rate is unknown.
        - High for restricted data classes.
        - 'Moderate on paper: 72-hour maximum, encryption, logged approval, selected staff, and deletion are described.'
        - Control design is visible, but operating effectiveness is not independently verified here.
        - Require control report evidence and test deletion, key access, incident response, and customer notice.
      - - '4'
        - Quality engineering does not scale with the expanding product surface.
        - Unknown; one employee self-reports QA and Developer Experience leadership.
        - Medium, potentially high if release defects affect embedded customers.
        - Early signal only; staffing, coverage, defect escape rate, and recovery performance are undisclosed.
        - Named ownership does not prove control effectiveness.
        - Review quality staffing, automated coverage, severity-one defects, change failure rate, and time to restore.
    notes: >-
      The competitor sources are treated as low-confidence adverse leads, the academic source as secondary literature,
      and the employee profile as a self-reported mitigation signal; none supplies a production incident rate.
    claimRefs:
      - CR003
      - CR005
      - CR007
      - CR010
      - CR011
      - CR012
      - CR014
      - CR015
  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Priority
      - Dependency
      - Counterparty / role
      - Concentration
      - Failure scenario
      - Impact severity
      - Mitigation maturity
      - Residual exposure
    rows:
      - - '1'
        - Cloud processing infrastructure
        - Unnamed third-party cloud providers may process customer content and host DeepL models.
        - Unknown; no provider or spend schedule is assigned.
        - Provider outage, capacity constraint, price change, or residency conflict disrupts service or economics.
        - High if material workloads or regions are concentrated.
        - Unknown; terms preserve subcontracting flexibility but do not evidence redundancy.
        - Operational, compliance, and margin exposure cannot be quantified without vendor-level data.
      - - '2'
        - Third-party application integrations
        - External plugins and AI assistants can mediate access to DeepL services.
        - Unknown by integration and customer workflow.
        - Integration deprecation, defect, credential misuse, or vendor outage affects the end-to-end service.
        - Medium-to-high for embedded distribution.
        - Low from the customer's perspective because DeepL disclaims responsibility for third-party applications.
        - Customer experience can fail outside DeepL's contractual control.
      - - '3'
        - Enterprise buyer workflow conversion
        - Localization, legal, product, support, and procurement teams must replace manual or traditional processes.
        - Broad demand is surveyed; revenue and customer concentration are not disclosed.
        - Priority does not convert into production usage, renewals, or acceptable unit economics.
        - Medium until conversion and retention evidence is obtained.
        - Company-sponsored survey supports need, not DeepL-specific conversion.
        - Sales-cycle, adoption, retention, and financial-model exposure remain unquantified.
    notes: >-
      The 5,005-executive survey was issued by DeepL and conducted by Censuswide in summer 2025 across the United
      States, United Kingdom, France, Germany, and Japan; it is not a customer-conversion or revenue cohort.
    claimRefs:
      - CR001
      - CR002
      - CR004
      - CR008
      - CR011
  - id: TV001
    title: Recommendation summary
    columns:
      - Dimension
      - Assessment
      - Evidence basis
      - Decision implication
    rows:
      - - Recommendation
        - Research more
        - The 2024 round is well corroborated but current operating evidence is incomplete.
        - Do not underwrite a purchase at the historical mark yet.
      - - Confidence
        - Medium
        - Independent sources agree on the round; current financial and term data are absent.
        - Use staged diligence before setting a price.
      - - Risk rating
        - High
        - Private-market illiquidity, bundling pressure, and contractual limitations remain material.
        - Require downside protection and verified enterprise economics.
      - - Valuation stance
        - Stretched
        - The last disclosed $2B mark is from May 2024 and lacks a current clean revenue denominator.
        - A premium needs audited growth and margin evidence.
      - - Entry discipline
        - Evidence-gated
        - No usable current secondary price or preference stack is public.
        - Price only after cap-table, terms, and financial review.
    notes: >-
      Assessments are analyst judgments based on the cited public evidence; the $2 billion figure is a May 2024
      post-money mark, not a current market quote.
    claimRefs:
      - CV001
      - CV003
      - CV007
      - CV010
      - CV012
      - CV013
      - CV014
  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - Side
      - Argument
      - Evidence signal
      - What would change the view
    rows:
      - - Thesis
        - Enterprise reach
        - DeepL claims more than 200,000 businesses globally.
        - Verify paid organizations, ACV distribution, and renewal cohorts.
      - - Thesis
        - Product and geographic expansion
        - The 2024 financing was described as supporting expansion and further development.
        - Show expansion-driven revenue and gross-margin contribution.
      - - Anti-thesis
        - Bundled competition
        - Sacra identifies Microsoft, Google, and Amazon bundling as a pricing risk.
        - Demonstrate durable win rates and pricing against bundled alternatives.
      - - Anti-thesis
        - Regulatory fragmentation
        - Sacra identifies varying localization and AI rules as a compliance-cost risk.
        - Provide jurisdiction-level compliance costs and blocked-market exposure.
      - - Anti-thesis
        - Enterprise contract allocation
        - Prior terms disclaim uninterrupted operation and cap ordinary cumulative liability.
        - Provide current negotiated SLA, credits, indemnities, and enterprise exceptions.
    notes: >-
      Customer count is company-issued, and risk statements are source-reported or inferred diligence implications
      rather than quantified loss estimates.
    claimRefs:
      - CV008
      - CV009
      - CV010
      - CV011
      - CV013
  - id: TV003
    title: Bull, base, and bear scenarios
    columns:
      - Scenario
      - Qualitative valuation range
      - Required assumptions
      - Probability signal
      - Downside or upgrade trigger
    rows:
      - - Bull
        - Premium to the $2B 2024 mark
        - >-
          Audited growth, strong gross margin, durable retention, and enterprise expansion support the historical
          premium.
        - Not assignable from public evidence.
        - Upgrade after filing-quality financials and verified cohort economics.
      - - Base
        - At or below the $2B 2024 mark
        - Growth catches up with the earlier multiple while bundling and compliance costs remain manageable.
        - Default diligence case, not a probability estimate.
        - Hold the mark only if current revenue and terms support it.
      - - Bear
        - Material discount or down round
        - Growth slows, standalone pricing compresses, or enterprise adoption weakens.
        - Credible because the mark is stale and current secondary evidence is absent.
        - Trigger on weak retention, margin compression, or punitive financing terms.
    notes: >-
      These are qualitative price bands, not forecasts; public evidence does not support numerical probabilities, a
      current revenue multiple, or target returns.
    claimRefs:
      - CV003
      - CV006
      - CV007
      - CV010
      - CV014
