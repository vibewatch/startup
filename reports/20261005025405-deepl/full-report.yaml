figures:
  - id: FO001
    title: DeepL Strategic Evolution and Corporate Milestone Timeline (2008–2026)
    type: timeline
    summary: >-
      Key corporate, financing, product, and infrastructure milestones tracing DeepL's progression from a bilingual
      corpus project to a multi-product enterprise Language AI platform.
    data:
      items:
        - label: '2008–2009: Linguee Foundation'
          date: '2009-04-01'
          detail: >-
            Gereon Frahling and Leonard Fink establish Linguee in Cologne, developing web crawling infrastructure and
            curated bilingual sentence pairs.
          tone: neutral
        - label: 'August 2017: DeepL Translator Public Launch'
          date: '2017-08-28'
          detail: >-
            Neural machine translation system launches across seven European languages, outperforming Google and
            Microsoft in blind evaluation benchmarks.
          tone: positive
        - label: 'March 2018: DeepL Pro Commercialization'
          date: '2018-03-20'
          detail: >-
            Launches paid subscription tier with developer API access and enterprise privacy guarantee prohibiting user
            text retention.
          tone: positive
        - label: 'July 2019: Leadership Transition to Kutylowski'
          date: '2019-07-01'
          detail: >-
            Jaroslaw Kutylowski appointed CEO as Linguee co-founder Gereon Frahling transitions away from executive
            research operations.
          tone: neutral
        - label: '2021: Societas Europaea Conversion'
          date: '2021-06-01'
          detail: >-
            Corporate restructuring transforms DeepL GmbH into DeepL SE, establishing a unified pan-European corporate
            governance framework.
          tone: positive
        - label: 'January 2023: Unicorn Financing Led by IVP'
          date: '2023-01-11'
          detail: >-
            Raises over $100M at a $1B valuation (€1B) with IVP leading alongside Bessemer, Atomico, and WiL; launches
            DeepL Write in public beta.
          tone: positive
        - label: 'May 2024: $300M Series C at $2.0B Valuation'
          date: '2024-05-22'
          detail: >-
            Secures $300M led by Index Ventures with ICONIQ Growth and Teachers' Venture Growth; customer footprint
            reaches 100,000 businesses.
          tone: positive
        - label: 'November 2024: Launch of DeepL Voice'
          date: '2024-11-13'
          detail: >-
            Unveils real-time voice translation suite for virtual meetings and live spoken conversations at inaugural
            DeepL Dialogues event.
          tone: positive
        - label: 'May–August 2025: Healthcare & Sovereign Security Certifications'
          date: '2025-08-26'
          detail: >-
            Achieves HIPAA compliance for US healthcare followed by German Federal BSI C5 Type 2 cloud security
            attestation.
          tone: positive
        - label: 'October 2025: Potential $5B US IPO Rumors'
          date: '2025-10-02'
          detail: >-
            Bloomberg and Reuters report preliminary discussions with advisers regarding a potential US public listing
            seeking up to $5B valuation.
          tone: neutral
        - label: 'November 2025: DeepL Agent & C-Suite Appointments'
          date: '2025-11-05'
          detail: >-
            Launches autonomous DeepL Agent for knowledge work; appoints CFO Martino Cadoni, CPO Goncalo Gaiolas, and
            later COO Gavin Mee and CRO Detlef Krause.
          tone: positive
        - label: 'April–September 2026: Voice-to-Voice Expansion'
          date: '2026-09-15'
          detail: >-
            Releases next-generation voice preservation and desktop application across 30+ languages; powers live
            translation at Dreamforce 2026.
          tone: positive
    approximationNotes: >-
      Dates reflect official press announcements and news publications. Exact corporate registration day in 2021
      approximates the effective SE filing window.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO005
      - CO007
      - CO008
      - CO009
      - CO010
      - CO013
      - CO014
