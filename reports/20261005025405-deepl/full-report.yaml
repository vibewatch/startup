              discussion is weak evidence rather than a benchmark, but it records a recurring buyer concern: DeepL
              covers fewer languages than Google Translate and performance varies by language pair. Finally, two
              independent pricing pages describe materially different API base-fee schedules. The likely explanation is
              differing vintages, but neither page supplies a clean publication date. Valuation should therefore be
              anchored to verified paid usage, retention, mix, and current contracts—not broad user reach, marketing
              ROI, or an inferred share of an unverified TAM.
