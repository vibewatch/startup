  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status-Quo Alternatives
        blocks:
          - type: paragraph
            body: >-
              DeepL's addressable market is best bounded by the workflows its products and contracts actually cover:
              text and document translation, writing assistance, real-time voice translation, and programmatic
              translation through an API. UsagePricing describes three commercial meters for these workflows—seats for
              applications, minutes for Voice, and characters for the API—while DeepL's terms confirm separate
              Translator, Write, Voice, and API services. The relevant spend pool is therefore enterprise language
              software and machine-processing spend, not the whole language-services economy. Status-quo alternatives
              include human translation and language-service providers, internal drafting and post-editing, free web
              translators, and translation functions bundled into broader technology platforms. Slator's account of
              DeepL Pro describes the historical move from free, ad-supported use toward recurring B2B subscriptions,
              which explains why consumer reach can create a funnel without itself representing addressable paid
              revenue.
