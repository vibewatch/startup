  - id: FU001
    title: DeepL enterprise customer journey and expansion loop architecture
    type: journey-map
    summary: >-
      Visual map tracing enterprise customer onboarding from self-service freemium trials to compliance-locked
      enterprise agreements and agentic workflow integration.
    data:
      nodes:
        - label: Freemium & Individual Trial
          touchpoints:
            - Free web translator and browser extension testing
            - Ad-hoc single-user document translation
          summary: Individual knowledge worker encounters translation quality advantage over legacy web engines.
        - label: Departmental Pro Adoption
          touchpoints:
            - Credit card purchase of DeepL Translator Pro
            - Creation of shared team glossaries and terminology
          summary: Localized team adoption within marketing, legal, or regional sales operations.
        - label: Enterprise Security Audit
          touchpoints:
            - Review of strict non-persistence DPA terms
            - Enforcement of 72-hour encrypted debugging caps
          summary: Centralized IT, security, and legal review to approve corporate data processing covenants.
        - label: Full Enterprise Deployment
          touchpoints:
            - SSO integration, custom API provisioning
            - Global rollout across thousands of knowledge seats
          summary: Master enterprise agreement covering Fortune 500 operational and regulatory workflows.
        - label: Agentic Workflow Expansion
          touchpoints:
            - Customization Hub proprietary fine-tuning
            - Autonomous DeepL Agent implementation across emails
          summary: Expansion into multi-agent productivity, subject to corporate AI ROI scrutiny.
        - label: Enterprise Renewal & Review
          touchpoints:
            - Annual contract renewal negotiation
            - Security re-certification and SOC2 / ISO compliance audits
          summary: Periodic enterprise account review evaluating ROI, seat utilization, and volume tier commitments.
    approximationNotes: >-
      Illustrates canonical enterprise procurement progression derived from Terms and Conditions and executive
      commentary.
