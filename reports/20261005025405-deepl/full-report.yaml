      - number: '2.4'
        title: Adoption Constraints and Valuation Relevance
        blocks:
          - type: paragraph
            body: >-
              Market conversion is constrained by product quality, language coverage, procurement terms, and pricing
              clarity. DeepL's enterprise terms expressly avoid guaranteeing the correctness or accuracy of
              machine-generated output, so regulated and high-consequence workflows still require review and governance.
              Those terms also describe reasonable-endeavor annual availability of 97% for fee-based services and 99%
