companyProfile:
  summary: >-
    DeepL is a Cologne-based Language AI company that grew out of Linguee and now spans translation, writing, voice,
    API, and agentic workflows for enterprise and developer users. The business monetizes through seats and usage-based
    contracts, has publicly disclosed a May 2024 round at a $2 billion post-money valuation, and reports adoption across
    more than 200,000 businesses, but it does not publicly disclose audited revenue, ARR, margin, retention, or
    cash-flow metrics.
