        - "Contractual exposure is documented; error frequency is unknown."
        - "High for legal, medical, financial, or other consequential content."
        - "Low-to-moderate: customer-side validation is necessary, but control performance is undisclosed."
        - "Customer may bear losses beyond available vendor remedies."
        - "Review negotiated agreements, indemnities, insurance, claims history, and use-case acceptance criteria."
      - - "2"
        - "Content may be processed on DeepL or third-party cloud infrastructure; processing location can depend on capacity and user location."
        - "Depends on customer, user, data class, and applicable privacy or sovereignty regime."
        - "Allowed architecture is documented; actual routing and concentration are unknown."
        - "High for sovereignty-constrained or highly sensitive workloads."
        - "Moderate on paper: temporary storage, encryption, and access controls are described."
        - "Subprocessor, transfer, residency, and audit requirements may constrain deployment."
        - "Obtain the current DPA, subprocessor inventory, transfer mechanism, data-flow map, and independent control reports."
      - - "3"
        - "DeepL may block access or terminate service when use is detected from restricted territories."
        - "Territories and sanctions regimes listed or incorporated by the published terms."
        - "Contractual control exists; false-positive and enforcement history are unknown."
