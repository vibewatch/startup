        - "Documented policy; implementation evidence was not assigned."
        - "Access interruption, customer support burden, and reseller compliance exposure."
        - "Test geofencing, sanctions screening, escalation, notice, and customer-remediation procedures."
    notes: "Severity is an underwriting judgment tied to the stated contractual consequence; likelihood is left unknown where the sources provide no incident denominator. Coverage is partial and negotiated customer agreements may differ."
    enumerationScope:
      coverage: "partial"
      basis: "Material legal and regulatory exposures evidenced by the assigned current and prior DeepL terms plus a competitor data-sovereignty critique."
