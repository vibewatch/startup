company:
  name: "DeepL"
chapter:
  number: 7
  title: "Risks"
  summary: "DeepL's clearest underwritable risks are output assurance, contractual risk allocation, cloud and third-party dependencies, and enterprise execution. Published terms make accuracy and availability limits visible, but the assigned evidence does not establish incident rates, litigation, regulatory action, customer concentration, burn, or runway; those remain diligence gaps rather than evidence of absence."
sections:
  - id: "risk-posture"
    title: "Risk posture and evidence limits"
    body: >-
      The highest-priority risk is not that DeepL has been shown to fail at a
      particular rate; no such denominator appears in the assigned evidence.
      Rather, DeepL's own terms do not warrant machine-output correctness, while
      two translation vendors allege limitations in long-document completeness,
      terminology control, or cloud deployment. Those vendors are competitors,
      not independent benchmarks, so their allegations should trigger controlled
      product testing rather than be treated as verified incident evidence. A
      2024 literature-review paper is more favorable on general accuracy but is
      secondary research rather than a current production audit. The investment
      implication is a high-consequence, unknown-frequency output-assurance risk:
      require representative acceptance tests, completeness checks, and human
      review for regulated or consequential workflows before underwriting durable
      enterprise adoption.
    claimRefs:
      - "CR003"
      - "CR010"
      - "CR011"
      - "CR012"
      - "CR015"
    figureRefs:
      - "FR001"
  - id: "legal-contractual"
    title: "Legal, contractual, and data-handling exposure"
    body: >-
      DeepL's published terms allocate meaningful risk to customers. They state
      that API responses and processed content are not guaranteed correct, allow
      processing on DeepL or third-party cloud infrastructure with location
      determined by DeepL unless otherwise agreed, and permit encrypted debugging
      storage for up to 72 hours under stated controls. The same terms reserve
      access blocking or termination for use from restricted territories. The
      published contractual language also limits remedies and liability, although
      negotiated enterprise agreements may differ and were not available here.
      These clauses are evidence of risk allocation, not evidence that a breach,
      enforcement action, or customer loss occurred. Diligence should therefore
      obtain the current master agreement, data-processing addendum, subprocessor
      list, security audit package, insurance limits, and claims history before
      assigning a probability to privacy, regulatory, or litigation exposure.
    claimRefs:
      - "CR003"
      - "CR004"
      - "CR005"
      - "CR006"
      - "CR009"
      - "CR016"
    tableRefs:
      - "TR001"
  - id: "operational-quality"
    title: "Operational quality, availability, and mitigation maturity"
    body: >-
      Operational exposure has three distinct layers. First, output quality must
      be validated per language pair, document type, and risk tier because DeepL
      disclaims correctness and the competitor allegations are not independently
      corroborated. Second, a prior North American terms page describes annual
      average uptime targets of 97% for fee-based services and 99% for Business
      plans, with exclusions; because that page is explicitly historical, it
      cannot establish the current service level. Third, a DeepL employee's public
      profile reports leadership responsibility for Developer Experience and
      Quality Assurance. That is a positive mitigation signal, but it is
      self-reported and does not disclose test coverage, incident history, recovery
      objectives, or control effectiveness. Kill criteria are failed completeness
      tests, material error rates above an agreed threshold, or current contractual
      availability and remedies that do not support the target workflow.
    claimRefs:
      - "CR003"
      - "CR007"
      - "CR010"
      - "CR011"
      - "CR012"
      - "CR014"
      - "CR015"
    tableRefs:
      - "TR002"
  - id: "dependencies-and-decision-gates"
    title: "Dependencies, financial unknowns, and decision gates"
    body: >-
      DeepL permits use of third-party cloud infrastructure and disclaims
      responsibility for third-party applications, creating vendor and integration
      dependencies whose concentration is not disclosed in the assigned evidence.
      The company-issued 2026 report says its Censuswide survey covered 5,005
      executives across five countries: 68% used manual processes or traditional
      tools, while 71% made workflow automation a 2026 priority and 36% called it
      a high priority. These are demand and execution signals from a
      company-sponsored study, not revenue, conversion, retention, or margin data.
      No assigned source quantifies burn, runway, gross margin, customer
      concentration, fraud exposure, working-capital needs, or infrastructure
      commitments. Investment approval should therefore require audited financials,
      customer and cloud concentration schedules, current uptime and incident
      evidence, and signed contractual protections; failure to obtain them is a
      thesis-break trigger rather than a basis for invented estimates.
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR004"
      - "CR008"
      - "CR016"
    tableRefs:
      - "TR003"
callouts:
  - calloutType: "risk"
    title: "Output assurance is the primary kill test"
    body: "Do not equate fluent output with verified completeness: require document-level reconciliation, domain-specific error thresholds, and human approval for consequential use cases."
    claimRefs:
      - "CR003"
      - "CR010"
      - "CR012"
      - "CR015"
  - calloutType: "assumption"
    title: "No incident evidence is not evidence of no incidents"
    body: "The assigned pool contains no independent regulator, court, breach, outage-history, or customer-loss record; the chapter leaves those probabilities unquantified."
    claimRefs:
      - "CR016"
