schemaVersion: "report-v2"
artifact: valuation
slug: deepl
runDate: "2026-10-05"
company:
  name: DeepL
chapter:
  number: 8
  title: Valuation
  summary: >-
    DeepL's last disclosed financing was a $300 million round at a $2 billion
    post-money valuation in May 2024, but the assigned public evidence does not
    establish a current revenue base, secondary price, or investor preference
    stack. The resulting recommendation is research-more with medium confidence:
    the company has credible enterprise traction, while the last private mark
    remains stretched until operating and financing evidence supports it.
sections:
  - id: public-mark-and-financing-context
    title: Public mark and financing context
    body: >-
      The strongest public anchor is the May 2024 financing: multiple independent
      sources report that DeepL raised $300 million at a $2 billion post-money
      valuation, double the roughly $1 billion mark reported for January 2023.
      That transaction is historical rather than a current clearing price.
      Forge displays no DeepL price and describes market activity as limited,
      leaving no usable secondary mark for October 2026. Funding totals also
      differ by dataset: Multiples and Sacra report about $400 million, while
      Tracxn reports $415 million across five rounds. Those figures describe
      capital raised, not cash currently available. The public record therefore
      supports the deal history but not a precise current enterprise value.
    claimRefs: [CV001, CV002, CV003, CV004, CV005]
    tableRefs: [TV001]
  - id: thesis-and-anti-thesis
    title: Thesis and anti-thesis
    body: >-
      The thesis rests on commercial reach and continued product expansion.
      DeepL's own site claims more than 200,000 business customers, and reporting
      on the 2024 round said proceeds would support geographic expansion and
      further development. Those signals are directionally positive, but they do
      not reveal paid-seat mix, retention, gross margin, or cash generation.
      The anti-thesis is that hyperscaler bundling can pressure a standalone
      translation vendor's pricing while regulatory fragmentation raises the
      cost of serving global enterprises. DeepL's prior enterprise terms also
      disclaim uninterrupted or error-free operation and cap ordinary cumulative
      liability at fees paid or payable during the preceding twelve months,
      creating a diligence issue for mission-critical deployments rather than
      evidence of an actual incident.
    claimRefs: [CV008, CV009, CV010, CV011]
    tableRefs: [TV002]
  - id: scenario-and-price-discipline
    title: Scenario and price discipline
    body: >-
      A conventional revenue-multiple valuation is not supportable from the
      assigned evidence. Multiples records $50 million for January 2023 and a
      20.0x ratio against the then-$1 billion valuation, but its footnote says
      the field may represent revenue or ARR and may use run-rate or reported
      LTM values. It is therefore neither a clean ARR disclosure nor a current
      revenue denominator. The scenarios below use qualitative price bands
      instead of false precision: a premium requires audited growth, margin, and
      retention proof; the 2024 mark requires evidence that performance caught up
      with the earlier multiple; and downside implies a material discount or
      down round if bundling, compliance costs, or enterprise adoption weaken.
    claimRefs: [CV006, CV007, CV010, CV014, CV015, CV016]
    tableRefs: [TV003]
  - id: recommendation-and-exit-readiness
    title: Recommendation and exit readiness
    body: >-
      The recommendation is research-more, with medium confidence, high
      underwriting risk, and a stretched valuation stance at the last disclosed
      mark. This is a price-sensitive judgment, not a negative view of product
      quality: the financing and customer signals are credible, but the public
      inputs needed to underwrite a target return are missing. Before investment,
      obtain audited revenue and gross-margin bridges, cohort retention, burn and
      runway, a current cap table, liquidation preferences, participation rights,
      and the primary-versus-secondary composition of the 2024 round. Exit
      readiness is likewise unproven because the reviewed Forge page has no
      current price or funding-round data. A priced secondary transaction or a
      filing-quality financial package would materially improve confidence.
    claimRefs: [CV003, CV007, CV012, CV013, CV014, CV015, CV016]
    figureRefs: [FV001]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Assessment, Evidence basis, Decision implication]
    rows:
      - [Recommendation, Research more, "The 2024 round is well corroborated but current operating evidence is incomplete.", "Do not underwrite a purchase at the historical mark yet."]
      - [Confidence, Medium, "Independent sources agree on the round; current financial and term data are absent.", "Use staged diligence before setting a price."]
      - [Risk rating, High, "Private-market illiquidity, bundling pressure, and contractual limitations remain material.", "Require downside protection and verified enterprise economics."]
      - [Valuation stance, Stretched, "The last disclosed $2B mark is from May 2024 and lacks a current clean revenue denominator.", "A premium needs audited growth and margin evidence."]
      - [Entry discipline, Evidence-gated, "No usable current secondary price or preference stack is public.", "Price only after cap-table, terms, and financial review."]
    notes: >-
      Assessments are analyst judgments based on the cited public evidence; the
      $2 billion figure is a May 2024 post-money mark, not a current market quote.
    claimRefs: [CV001, CV003, CV007, CV010, CV012, CV013, CV014]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Side, Argument, Evidence signal, What would change the view]
    rows:
      - [Thesis, Enterprise reach, "DeepL claims more than 200,000 businesses globally.", "Verify paid organizations, ACV distribution, and renewal cohorts."]
      - [Thesis, Product and geographic expansion, "The 2024 financing was described as supporting expansion and further development.", "Show expansion-driven revenue and gross-margin contribution."]
      - [Anti-thesis, Bundled competition, "Sacra identifies Microsoft, Google, and Amazon bundling as a pricing risk.", "Demonstrate durable win rates and pricing against bundled alternatives."]
      - [Anti-thesis, Regulatory fragmentation, "Sacra identifies varying localization and AI rules as a compliance-cost risk.", "Provide jurisdiction-level compliance costs and blocked-market exposure."]
      - [Anti-thesis, Enterprise contract allocation, "Prior terms disclaim uninterrupted operation and cap ordinary cumulative liability.", "Provide current negotiated SLA, credits, indemnities, and enterprise exceptions."]
    notes: >-
      Customer count is company-issued, and risk statements are source-reported
      or inferred diligence implications rather than quantified loss estimates.
    claimRefs: [CV008, CV009, CV010, CV011, CV013]
  - id: TV003
    title: Bull, base, and bear scenarios
    columns: [Scenario, Qualitative valuation range, Required assumptions, Probability signal, Downside or upgrade trigger]
    rows:
      - [Bull, "Premium to the $2B 2024 mark", "Audited growth, strong gross margin, durable retention, and enterprise expansion support the historical premium.", "Not assignable from public evidence.", "Upgrade after filing-quality financials and verified cohort economics."]
      - [Base, "At or below the $2B 2024 mark", "Growth catches up with the earlier multiple while bundling and compliance costs remain manageable.", "Default diligence case, not a probability estimate.", "Hold the mark only if current revenue and terms support it."]
      - [Bear, "Material discount or down round", "Growth slows, standalone pricing compresses, or enterprise adoption weakens.", "Credible because the mark is stale and current secondary evidence is absent.", "Trigger on weak retention, margin compression, or punitive financing terms."]
    notes: >-
      These are qualitative price bands, not forecasts; public evidence does not
      support numerical probabilities, a current revenue multiple, or target returns.
    claimRefs: [CV003, CV006, CV007, CV010, CV014, CV015, CV016]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The recommendation follows from verified financing and traction signals,
      then discounts missing current pricing, financial, and term evidence.
    data:
      nodes:
        - id: financing
          label: Verified financing
          detail: "$300M at a $2B post-money valuation in May 2024."
        - id: traction
          label: Enterprise traction signal
          detail: "Company-issued claim of more than 200,000 businesses."
        - id: denominator
          label: Weak valuation denominator
          detail: "The available $50M entry is from January 2023 and has ambiguous revenue or ARR basis."
        - id: current-price
          label: No current clearing price
          detail: "Forge shows no price and limited market activity."
        - id: terms
          label: Financing terms missing
          detail: "Preferences, participation, and primary-versus-secondary split are not public."
        - id: decision
          label: Research more
          detail: "Medium confidence, high risk, and stretched at the last disclosed mark."
    approximationNotes: >-
      The sequence is analytical logic, not a quantified scoring model or a
      representation of transaction probability.
    claimRefs: [CV001, CV008, CV010, CV012, CV013, CV014]
callouts:
  - calloutType: recommendation
    title: Do not price off the 2024 mark alone
    body: >-
      Require audited current financials, retention cohorts, a cap table, and
      full financing terms before translating company quality into an entry price.
    claimRefs: [CV003, CV007, CV012, CV013, CV014]
