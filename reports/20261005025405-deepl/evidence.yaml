evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosures
    missingEvidence: >-
      Audited financial statements confirming FY2024 and FY2025 GAAP/IFRS revenue, net income/loss, gross margins, and
      official ARR bridge.
    whyItMatters: >-
      Third-party estimates such as GetLatka's $185.2M ARR figure cannot substitute for audited financials when
      assessing valuation multiples for a prospective $5B IPO.
    diligencePath: >-
      Review audited Bundesanzeiger corporate filings for DeepL SE or obtain confidential financial disclosures under
      non-disclosure agreement.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: governance-rights
    missingEvidence: >-
      Full capitalization table breakdown, liquidation preference ranking, board seat distribution, and founder voting
      rights agreements.
    whyItMatters: >-
      Understanding structural downside protections and governance dynamics between CEO Kutylowski and lead investors
      Index Ventures and IVP is vital for institutional underwriting.
    diligencePath: >-
      Obtain articles of association and investor rights agreements from the German commercial register
      (Handelsregister) or primary syndicate counsel.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      A current, methodologically transparent dollar market estimate with included categories, geography, period, CAGR,
      and separate software-versus-services denominators.
    whyItMatters: >-
      Without comparable market and paid-demand denominators, TAM, SAM, SOM, market share, and valuation-growth
      assumptions would be invented rather than evidenced.
    diligencePath: >-
      Obtain the underlying Slator market report or another independent market study, then reconcile it with DeepL paid
      accounts, seat and API usage, ACV, retention, and segment revenue from management.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: api-pricing
    missingEvidence: >-
      A dated first-party order form or pricing capture reconciling the API base fee, included usage, overage rate,
      currency, and billing cadence.
    whyItMatters: >-
      The independent pages report different schedules, preventing a reliable current low-volume cost and monetization
      comparison.
    diligencePath: >-
      Request a current API quote and invoices for representative customers, preserving region, currency, plan, billing
      term, and usage.
    relatedQuestionRefs:
      - QM006
  - type: private-evidence-only
    severity: blocking
    topic: revenue-quality
    missingEvidence: >-
      Audited recognized revenue, ARR, product and geography mix, discounts, contract duration, and revenue-recognition
      policy.
    whyItMatters: >-
      Without these records, adoption claims cannot be translated into revenue scale, growth, recurrence, or valuation
      multiples.
    diligencePath: Request FY2024-FY2026 audited statements plus an ARR-to-revenue bridge and contract-level revenue schedule.
    relatedQuestionRefs:
      - QI003
    relatedTableRefs:
      - TI001
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: >-
      Gross margin, compute and hosting COGS, implementation and support cost, CAC, payback, GRR, NRR, and customer
      concentration.
    whyItMatters: >-
      These inputs determine whether enterprise expansion creates durable gross profit or adds sales and delivery costs
      faster than revenue.
    diligencePath: >-
      Obtain monthly management accounts, cohort retention, sales productivity, and product-level contribution-margin
      schedules.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: >-
      Current unrestricted cash, operating burn, debt and credit facilities, capex commitments, and board-approved
      runway plan.
    whyItMatters: >-
      Cumulative funding and secondary-share availability do not establish liquidity or the timing and size of another
      financing need.
    diligencePath: >-
      Request the latest balance sheet, 24-month cash forecast, debt schedule, cap table, and May 2024 sources-and-uses
      statement.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: stale
    severity: material
    topic: customer-retention
    missingEvidence: Current representative support, billing, renewal, and product-quality outcomes segmented by paid customer cohort.
    whyItMatters: >-
      The archived review page is self-selected and historical, so it cannot quantify present churn or enterprise
      retention.
    diligencePath: Review support SLAs and ticket data, billing disputes, cancellation cohorts, renewal surveys, GRR, and NRR.
    relatedQuestionRefs:
      - QI009
  - type: missing-source
    severity: material
    topic: independent-benchmark
    missingEvidence: >-
      A current, independently reproducible benchmark by language pair, content type, model version, latency tier, and
      human evaluation protocol.
    whyItMatters: >-
      Generic quality claims cannot establish performance for a buyer's production workload or show whether
      specialization remains defensible.
    diligencePath: >-
      Run a blind benchmark on the buyer's corpus against named alternatives and retain raw outputs, reviewer
      instructions, and statistical results.
    relatedQuestionRefs:
      - QE005
      - QE007
  - type: private-evidence-only
    severity: material
    topic: service-availability
    missingEvidence: >-
      Product-level historical uptime, latency percentiles, incident history, recovery performance, and contractual
      service-credit schedules.
    whyItMatters: >-
      Annual availability targets with broad exclusions do not quantify operational risk for embedded or real-time
      workflows.
    diligencePath: >-
      Request 24 months of status history and incident postmortems, then reconcile them to customer logs and proposed
      SLA language.
    relatedQuestionRefs:
      - QE004
      - QE006
  - type: private-evidence-only
    severity: material
    topic: security-and-privacy
    missingEvidence: >-
      Current independent audit reports, architecture boundaries, subprocessors, retention controls by product, and
      evidence of control testing.
    whyItMatters: >-
      Contract terms describe selected controls but do not establish their operating effectiveness for sensitive text,
      documents, or audio.
    diligencePath: >-
      Review the latest SOC 2 report, ISO scope, penetration-test summary, data-flow diagrams, DPA, and product-specific
      retention configuration.
    relatedQuestionRefs:
      - QE006
      - QE007
  - type: missing-source
    severity: minor
    topic: developer-signal
    missingEvidence: >-
