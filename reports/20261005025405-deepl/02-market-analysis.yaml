figures:
  - id: "FM001"
    title: "Evidence-Constrained Market Sizing Pyramid"
    type: "pyramid"
    summary: "A non-proportional hierarchy separating broad need, product-addressable workflows, adoption proof, monetization, and the still-unverified obtainable market."
    data:
      items:
        - label: "Broad multilingual communication need"
          value: "Not quantified"
          detail: "The assigned evidence does not size all global language-services or communication spend."
        - label: "Language services and machine translation category"
          value: "No comparable dollar estimate"
          detail: "Human services, free tools, and software are economically distinct and cannot be combined from this pool."
        - label: "DeepL-addressable software workflows"
          value: "4 product families"
          detail: "Translator, Write, Voice, and API define the supported software boundary."
        - label: "Historical reach proxy"
          value: ">1 billion people"
          detail: "Slator's 2021 report; cumulative users, not paid users."
        - label: "Current business adoption proxy"
          value: ">200,000 businesses"
          detail: "Current company claim; contract value and paid-seat count are undisclosed."
        - label: "Paid obtainable market and share"
          value: "Not disclosed"
          detail: "Requires paid accounts, usage, retention, ACV, and segment revenue."
    approximationNotes: "The pyramid is a logical evidence hierarchy, not a proportional funnel. Values have different populations and periods; no conversion rate, market share, or dollar market size is inferred."
    claimRefs:
      - "CM001"
      - "CM003"
      - "CM005"
      - "CM006"
callouts:
  - calloutType: "risk"
    title: "Reach Is Not Market Size"
    body: "The pool contains large user and business-reach claims but no common paid-user denominator, contract value, segment revenue, or independent dollar TAM. Treating those figures as interchangeable would overstate addressability."
    claimRefs:
      - "CM003"
      - "CM004"
      - "CM005"
  - calloutType: "insight"
    title: "Pricing Evidence Requires a Vintage Check"
    body: "UsagePricing and Metronome report different API subscription floors and usage prices. The divergence is consistent with a pricing change, but absent reliable publication dates the current contract should be verified directly before underwriting demand or margin."
    claimRefs:
      - "CM011"
      - "CM012"
