      - [Finance administration, "Invoicing, accounting, expense control, payroll, and tax tools", "Bespoke ERP and enterprise finance transformation", "Owner-manager, bookkeeper, or finance lead; business pays", "Cross-sell and workflow-retention layer"]
      - [Credit access, "Marketplace and embedded short-term credit access", "Unrelated corporate lending and large-enterprise capital markets", "Business borrower; lender economics are not disclosed", "Addresses cash-flow needs without defining Tide as the sole balance-sheet lender"]
      - [Savings and investment adjacency, "Savings and the Tide Investment Account platform fee", "Fund manufacturing and general consumer wealth management", "Business owner acting for the company; business assets fund the account", "Extends monetisation of surplus cash through regulated partners"]
      - [International treasury and FX, "Supported international transfers and foreign-currency card use", "Full multi-currency wallets and specialist global treasury", "Internationally trading SME", "Partially served; a specialist provider remains a substitute"]
    notes: >-
      Scope is an analyst classification from the retained product and review
      sources; partner economics, revenue by workflow, and active usage are not
      disclosed.
    claimRefs: [CM001, CM008, CM009, CM010, CM016]
  - id: TM002
    title: Population and penetration sizing lenses
    columns:
      - Publisher
      - Period
      - Geography
      - Value
      - CAGR
      - Methodology
      - Confidence
      - Limitation
    rows:
      - [Tide, "May 2026", "United Kingdom", "5.2m small businesses; 900k Tide members; stated 15% share", "Not disclosed", "Company-reported market backdrop and member count", "Medium", "Company-issued; denominator and active-member definition not disclosed"]
      - [FinanceX Magazine, "Start of 2025 / July 2026 article", "United Kingdom", "5.69m SMEs; article also cites 900k Tide users", "Not disclosed", "Article attributes the population estimate to government Business Population Estimates", "Medium", "Underlying government table is not in the assigned pool"]
      - [Tide, "May 2026", "India", ">1.1m Tide members; 72m official and 140m unofficial MSMEs", "Not disclosed", "Company-reported member and population lenses", "Low", "Unofficial estimate is especially uncertain; no paying or active-member rate"]
      - [Tide, "May 2026", "Germany and France", "5.5m German SMEs; no France denominator; >EUR50m credit disbursed across both markets", "Not disclosed", "Company-reported expansion and credit-intermediation signals", "Low", "No member count, penetration, take rate, or country split"]
      - [Multiples, "September 2025", "Global company metric", "$225m recorded revenue and $1.5bn valuation; 6.7x stated multiple", "Not disclosed", "Private-market database value recorded alongside the funding round", "Low", "Publisher says such values may be run-rate or LTM; it is not a market-size estimate"]
    notes: >-
      Values retain each publisher's period, geography, denominator, and stated
      uncertainty. They are separate sizing lenses and must not be summed or
      treated as comparable TAM, SAM, and SOM layers.
    claimRefs: [CM002, CM003, CM005, CM006, CM011, CM012, CM013]
  - id: TM003
    title: Segment and buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - ["UK domestic sole trader or micro-SME", "Owner-manager", "Owner and bookkeeper", "Business", "GBP account, invoicing, tax, and payments", "Owner-manager", "Fast onboarding and low entry price"]
      - ["UK SME with employees", "Owner or finance lead", "Employees, finance staff, and accountant", "Business", "Cards, expenses, payroll, accounting, and credit", "Finance lead or owner", "Need to consolidate recurring administration"]
      - ["Internationally trading UK SME", "Owner or finance lead", "Finance and purchasing staff", "Business", "GBP banking plus foreign payments", "Finance lead", "Domestic convenience, offset by need for multi-currency capability"]
      - ["Indian micro or informal business", "Owner-manager", "Owner and operating staff", "Business; exact fee path undisclosed", "Registration, payments, lending access, and admin", "Owner-manager", "Digital formalisation and access to financial tools"]
      - ["SME with surplus cash", "Owner-manager or finance lead", "Authorised business decision-maker", "Business assets; platform and fund fees apply", "Investing through an existing Tide profile", "Owner-manager or finance lead", "Idle cash and reduced separate-provider onboarding"]
    notes: >-
      Segmentation is evidence-constrained and not exhaustive; payer and budget
      ownership are inferred from the cited workflows because Tide does not
      publish buyer research or product-level revenue in the assigned evidence.
    claimRefs: [CM001, CM003, CM008, CM009, CM010, CM016]
figures:
  - id: FM001
    title: Customer-population and adoption lenses
    type: pyramid
    summary: >-
      Six separately sourced population or membership observations show the
      scale of Tide's current and adjacent geographies without implying a
      conversion funnel.
    data:
      items:
        - label: India official MSME population
          value: 72000000
          unit: businesses
          note: "Tide-reported official population lens, May 2026"
        - label: Germany SME population
          value: 5500000
          unit: businesses
          note: "Tide-reported adjacency lens, May 2026"
        - label: UK small-business population
          value: 5200000
          unit: businesses
          note: "Tide-reported backdrop, May 2026"
        - label: Global Tide members
          value: 2000000
          unit: members
          note: "Company reported more than this threshold in May 2026"
        - label: India Tide members
          value: 1100000
          unit: members
          note: "Company reported more than this threshold in May 2026"
        - label: UK Tide members
          value: 900000
          unit: SME members
          note: "Company-reported count, May-June 2026"
    approximationNotes: >-
      These are not nested TAM/SAM/SOM layers: they mix geographies and
      population versus member definitions. Values shown with "more than" in the
      source are plotted at the disclosed lower bound, and the pyramid order is
      descriptive rather than a conversion or revenue model.
    claimRefs: [CM002, CM003, CM004, CM005, CM014]
callouts:
  - calloutType: risk
    title: Population is not monetisable market size
    body: >-
      The retained evidence does not disclose active-member definitions, paid
      conversion, product-level revenue, buyer budgets, or serviceable digital
      adoption. Population and member counts therefore cannot support a precise
      revenue TAM, SAM, or SOM.
    claimRefs: [CM007, CM015]
