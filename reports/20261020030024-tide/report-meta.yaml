companyProfile:
  summary: >-
    Tide is a London-headquartered private fintech serving small businesses through a partner-enabled finance and
    administration platform. It is not a bank: regulated account, e-money, card, investment, and related services depend
    on Tide entities and external providers. Tide reported more than two million members by May 2026, split between the
    UK and India, while expanding its product set and selected European presence.
