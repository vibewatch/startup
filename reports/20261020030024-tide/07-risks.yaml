            - value: "Medium"
            - value: "Unverified"
        - id: "capital-execution"
          label: "Capital and expansion execution shortfall"
          note: "The reported round mixed primary and secondary capital; cash proceeds are not disclosed."
          values:
            - value: "High"
            - value: "Medium"
            - value: "Partial"
    approximationNotes: >-
      Matrix values are qualitative analyst synthesis based on retained public evidence as of 2026-10-20. Unknown does
      not mean low, and no cell asserts that a breach, outage, enforcement action, or loss event occurred.
    claimRefs: [CR004, CR006, CR008, CR010, CR012, CR014, CR016]
callouts:
  - calloutType: "risk"
    title: "Evidence-sensitive kill criteria"
    body: >-
      Pause investment if Tide cannot evidence tested core-provider portability, material-incident and complaint
      performance, jurisdiction-level permissions, partner concentration, and a bridge from primary financing proceeds
      to consolidated burn and runway. The current pool establishes exposure pathways, not event frequency.
    claimRefs: [CR001, CR004, CR006, CR012, CR014, CR016]
