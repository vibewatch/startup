company:
  name: "Tide"
chapter:
  number: 7
  title: "Risks"
  summary: >-
    Tide's principal underwritten risk is architectural rather than a documented single incident: customer access,
    regulated account services, lending, integrations, and international expansion span multiple counterparties and
    jurisdictions. Public evidence shows active control design and fresh growth capital, but does not quantify
    outages, fraud and credit losses, partner concentration, regulatory cases, or consolidated burn and runway.
sections:
  - id: "priority-risk-frame"
    title: "Priority risk frame"
    body: >-
      The highest residual exposure is the regulated-partner operating model. Tide's own terms place business
      accounts and savings with ClearBank or another banking provider, while an independent competitor review also
      describes a split between ClearBank bank accounts and PPS e-money services. This structure can accelerate
      product breadth, but it creates correlated continuity, compliance, and contractual dependencies across the
      customer journey. The risk is amplified by scale: Tide said it crossed 2 million members in May 2026, with
      more than 1.1 million in India and 900,000 in the UK. The heatmap therefore treats partner continuity and
      cross-market conduct as high-residual risks even though the assigned evidence does not establish a breach,
      outage, enforcement action, or loss event. The investment implication is to condition conviction on primary
      regulator records, incident metrics, and counterparty concentration data rather than infer safety from the
      absence of a reported event.
    claimRefs: [CR001, CR002, CR006, CR007, CR014, CR016]
    figureRefs: [FR001]
  - id: "regulatory-legal"
    title: "Regulatory, legal, and conduct exposure"
    body: >-
      Tide's legal perimeter is layered. Its membership terms describe products offered with partners and support
      provided on behalf of ClearBank and Adyen in specified cases; the same terms permit suspension when fraud,
      criminal use, regulatory breach, or restricted-country exposure is suspected. Those provisions are ordinary
      controls, not proof of misconduct, but they show that member access can be affected by compliance decisions
      spanning Tide and external institutions. A company-authored quality-assurance job post points to Consumer Duty,
      complaints, escalations, and regulatory monitoring across the UK, India, and Germany, which is evidence of
      control intent rather than control effectiveness. The assigned pool contains no regulator decision, licence
      register extract, court docket, or jurisdiction-by-jurisdiction permissions map. Legal and regulatory status
      therefore remains only partially verified, and the register below keeps that gap explicit.
    claimRefs: [CR001, CR003, CR005, CR007, CR008, CR016]
    tableRefs: [TR001]
  - id: "operational-quality-security"
    title: "Operational, quality, and security exposure"
    body: >-
      Service continuity and customer remediation deserve direct diligence because the platform is digital-first and
      operationally distributed. Tide's terms state that access is supplied on an as-available basis and disclaim a
      warranty of uninterrupted or error-free service; this is contractual allocation of risk, not evidence that an
      outage occurred. The QA role shows that Tide monitors complaints, escalations, recurring issues, and agent
      interactions across several countries, while the company LinkedIn page identifies a broad office and technology
      footprint. Independent reviews add product-friction signals: limited telephone support, cash-handling costs, a
      GBP-centred account structure, and no multi-currency wallet. These constraints may increase support load and
      customer attrition in complex cases, but the pool provides no incident frequency, mean-time-to-recovery, fraud
      loss, complaint uphold rate, or security audit result. Those metrics are required before assigning probability
      from observed performance.
    claimRefs: [CR004, CR006, CR008, CR009, CR010, CR011, CR016]
    tableRefs: [TR002]
  - id: "partner-financial-execution"
    title: "Partner, financial-model, and execution exposure"
    body: >-
      Tide's breadth depends on banking, payment, lending, accounting, and data counterparties. Sacra specifically
      identifies dependence on ClearBank and on third-party platforms and APIs; Tide's terms separately state that
      third-party services include providers such as ClearBank, Adyen, and Sage. Capital reduces near-term financing
      pressure only imperfectly: FinTech Magazine reported a US$120 million transaction combining primary and
      secondary investment, so the headline amount cannot be treated as cash added to Tide, and the same report says a
      TPG representative joined the board. The kill criteria are measurable: unresolved material partner
      concentration, repeated severity-one service events, regulator restrictions on core permissions, sustained
      complaint deterioration, or inability to reconcile primary cash proceeds with group burn and runway should
      pause investment. Mitigation requires audited counterparty inventories, exit and portability tests, service-level
      performance, board-rights disclosure, and a consolidated liquidity bridge.
    claimRefs: [CR001, CR003, CR012, CR013, CR014, CR015, CR016]
    tableRefs: [TR003]
