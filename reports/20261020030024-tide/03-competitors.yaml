schemaVersion: "report-v2"
artifact: competitors
slug: tide
runDate: 2026-10-20
company:
  name: Tide
chapter:
  number: 3
  title: Competitors
  summary: >-
    Tide competes less as a standalone bank than as an SME operating layer spanning accounts,
    admin, payments, and credit access. Its breadth and claimed two-million-member scale are
    meaningful advantages, but bank partners, similar fintech integrations, easy multi-homing,
    and stronger specialist foreign-exchange propositions limit durable lock-in.
sections:
  - id: landscape-and-buyer-alternatives
    title: Landscape and buyer alternatives
    body: >-
      A UK SME can solve Tide's core job through several routes: mobile-first banks such as
      Starling, e-money and cross-border specialists such as Revolut Business and WorldFirst,
      established-SME challengers such as Allica, high-street banks, or an existing bank paired
      with separate invoicing and accounting software. The assigned comparison evidence places
      Tide toward the integrated-admin end of this set, while Revolut and WorldFirst emphasize
      international currency handling and Allica emphasizes savings, lending, and relationship
      banking. This makes the competitive boundary wider than "business current accounts."
      Internal assembly remains a credible substitute because the major components can be
      bought separately, although the assigned evidence does not quantify the integration or
      operating cost of doing so.
    claimRefs: [CP006, CP007, CP016]
    tableRefs: [TP001]
  - id: differentiation-and-trust
    title: Product breadth and trust architecture
    body: >-
      Tide's differentiation is the connected workflow around the account rather than ownership
      of a bank licence. Its official disclosures say Tide operates the app but is not a bank;
      current and savings accounts are powered by ClearBank, while some e-money accounts use
      PrePay Technologies and safeguarding. The same disclosures and company-issued app listing
      describe invoicing, accounting integrations, expense controls, savings, payments, and
      finance access. This partner architecture accelerates breadth, but it also means trust and
      protection depend on the member's specific account structure. Buyers therefore need to
      distinguish eligible ClearBank deposits from safeguarded e-money instead of treating every
      Tide balance as economically identical.
    claimRefs: [CP001, CP002, CP003, CP005, CP012]
    tableRefs: [TP002]
  - id: pricing-distribution-and-switching
    title: Pricing, distribution, and switching
    body: >-
      Pricing evidence is directionally useful but not clean enough for an underwritten
      apples-to-apples comparison. A 2026 competitor-authored review reports four Tide plans from
      free to GBP69.99 per month and highlights plan-dependent foreign-exchange charges; an older
      2023 review reports lower paid tiers and obsolete international limitations. Another
      October 2026 article contradicts itself on whether support is available continuously.
      These conflicts make the current official rate card and service terms a diligence item.
      Switching costs also appear limited: a business can keep Tide for GBP operations while
      adding a specialist currency account, so distribution and convenience may drive retention
      more than contractual lock-in.
    claimRefs: [CP008, CP009, CP010, CP011, CP015]
    tableRefs: [TP003]
  - id: moat-and-displacement-risk
    title: Moat durability and displacement risk
    body: >-
      Tide's strongest moat evidence is scale combined with product breadth. The company reports
      more than two million members, including 900,000 UK SMEs, and presents a broad suite from
      registration through payroll, payments, credit, and website tools. That footprint can
      improve cross-sell and data-driven product development, but the evidence does not establish
      cohort retention, primary-account share, or superior unit economics. Comparable rivals
      already offer fast onboarding and accounting feeds, full banks can differentiate on deposit
      protection and lending, and currency specialists can sit alongside Tide without forcing a
      full switch. The result is a useful convenience moat, not yet proof of proprietary or
      irreversible lock-in. Comparable competitor funding, customer scale, and product adoption
      remain unavailable in the assigned pool.
    claimRefs: [CP004, CP005, CP013, CP014, CP015, CP016]
    figureRefs: [FP001]
tables:
  - id: TP001
    title: Competitor and substitute profile
    columns:
      - Alternative
      - Class
      - Scale or funding evidence
      - Target segment
      - Differentiation in assigned evidence
      - Principal limitation or unknown
    rows:
      - [Tide, "Direct platform", "2m+ members claimed; competitor funding not comparable", "Sole traders and SMEs", "Integrated account, admin, payments, and credit access", "No disclosed retention or primary-account share"]
      - [Starling Business, "Direct bank", "Not established", "UK SMEs", "Full-bank protection, free account, accounting feeds", "Limited international capability and relationship coverage reported"]
      - [Revolut Business, "Direct / adjacent fintech", "Not established", "Internationally active businesses", "Multi-currency and foreign-exchange capability", "UK protection and current licence status require verification"]
      - [Allica Bank, "Adjacent challenger bank", "Not established", "Established SMEs", "Savings, lending, and relationship model", "Admin-platform breadth not established"]
      - [WorldFirst, "Adjacent currency specialist", "Not established", "Cross-border SMEs and marketplace sellers", "Multi-currency holding and supplier payments", "Competitor-authored evidence; not a full Tide substitute"]
      - [High-street bank, "Incumbent / status quo", "Not applicable", "SMEs valuing branches and broad banking", "Relationship banking and broader product range", "Slower onboarding and weaker integrated admin reported"]
      - [Existing bank plus software, "Internal-build substitute", "Not applicable", "SMEs willing to assemble a stack", "Choice of separate accounting, invoicing, and FX tools", "Integration cost and workflow burden not quantified"]
    notes: >-
      Partial landscape based only on the assigned sources; "Not established" means comparable
      scale or funding was not evidenced, and vendor comparisons are not independent benchmarks.
    claimRefs: [CP004, CP005, CP006, CP007, CP009, CP016]
  - id: TP002
    title: Capability and trust matrix
    columns:
      - Buying criterion
      - Tide
      - Starling Business
      - Revolut Business
      - Allica Bank
      - Evidence limitation
    rows:
      - ["UK balance protection", "ClearBank deposits eligible; some e-money safeguarded", "FSCS-protected bank deposits reported", "Safeguarding rather than FSCS reported", "FSCS-protected bank deposits reported", "Provider and account structure must be checked"]
      - ["Integrated SME administration", "Broad invoicing, accounting, expense, payroll, and registration suite", "Unknown beyond accounting feeds", "Unknown beyond accounting feeds", "Unknown", "Only Tide breadth is directly described in depth"]
      - ["Accounting integrations", "Xero, QuickBooks, and Sage reported", "Xero, QuickBooks, and FreeAgent reported", "Xero and QuickBooks reported", "Xero reported", "Availability and plan eligibility may change"]
      - ["International / multi-currency", "GBP-centered; no multi-currency wallet reported", "Some international capability reported", "Multi-currency and FX positioned as strengths", "Unknown", "WorldFirst is an interested competitor source"]
      - ["Lending and finance access", "Credit marketplace and selected finance products reported", "Overdraft and loans reported for eligible firms", "Unknown", "Savings and lending positioned as strengths", "Terms and approval rates are not evidenced"]
      - ["Relationship / branch support", "Digital-first and tiered support", "No dedicated manager for most tiers reported", "Unknown", "Relationship model reported", "No service-level benchmark was available"]
    notes: >-
      Snapshot of evidenced capabilities, not a product certification. Unknown cells are preserved
      where the assigned pool did not support a comparison; regulatory protection varies by product.
    claimRefs: [CP001, CP002, CP003, CP005, CP007, CP009, CP012]
  - id: TP003
    title: Reported pricing and packaging comparison
    columns:
      - Provider
      - Reported entry price
      - Reported paid tiers or unit fees
      - Included capability emphasis
      - Source posture
      - Diligence implication
    rows:
      - [Tide, "GBP0 monthly", "Smart GBP12.49; Pro GBP27.49; Max GBP69.99 in 2026 competitor review", "Admin tools and increasing transfer / accounting benefits", "Competitor-authored and contradicted by older reviews", "Verify official live rate card and realized fees"]
      - [Starling Business, "Free", "Not established", "FreeAgent and core bank account", "Independent comparison", "Verify eligibility and international fees"]
      - [Revolut Business, "Free", "GBP19+ reported", "Multi-currency and FX", "Independent comparison", "Verify UK protection structure and limits"]
      - [Allica Bank, "Free", "Not established", "Savings and lending", "Independent comparison", "Verify eligibility for established SMEs"]
      - [Cashplus Business, "From GBP9.95 monthly", "Not established", "Access for credit-impaired applicants", "Independent comparison", "Verify current plan and product scope"]
    notes: >-
      Prices are reported list prices, not realized customer cost, and do not share a single
      verification date. Tide pricing differs across the assigned sources, so no blended price
      or precise savings estimate is inferred.
    claimRefs: [CP008, CP009, CP010, CP011, CP013]
figures:
  - id: FP001
    title: Competitive positioning by currency reach and SME-admin breadth
    type: quadrant
    summary: >-
      Evidence-backed ordinal scoring places Tide high on integrated SME administration but below
      currency specialists on international capability.
    data:
      xAxis:
        label: International and currency capability
        min: 1
        max: 5
        lowLabel: Domestic / GBP centered
        highLabel: Multi-currency specialist
        description: Analyst ordinal score from the assigned comparison evidence
      yAxis:
        label: Integrated SME-admin breadth
        min: 1
        max: 5
        lowLabel: Account or point solution
        highLabel: Broad connected workflow
        description: Analyst ordinal score from described invoicing, accounting, expense, payroll, and registration tools
      points:
        - label: Tide
          x: 2
          y: 5
          detail: "Broad admin suite; GBP-centered international proposition in competitor evidence."
        - label: Starling Business
          x: 2
          y: 3
          detail: "Core bank and accounting integrations; international capability described as limited."
        - label: Revolut Business
          x: 5
          y: 3
          detail: "Multi-currency and FX strength; narrower admin evidence than Tide."
        - label: Allica Bank
          x: 2
          y: 2
          detail: "Relationship, savings, and lending focus; admin breadth not established."
        - label: WorldFirst
          x: 5
          y: 1
          detail: "Currency and cross-border point solution positioned to complement Tide."
        - label: High-street status quo
          x: 3
          y: 1
          detail: "Broad traditional banking but weaker integrated admin evidence."
    approximationNotes: >-
      Scores are analyst-assigned ordinal positions from qualitative source descriptions, not
      measured benchmarks, market ranks, or value-proportional distances; unsupported dimensions
      are scored conservatively and should be validated with current product testing.
    claimRefs: [CP006, CP007, CP015, CP016]
callouts:
  - calloutType: strength
    title: Breadth is the clearest differentiation
    body: >-
      Tide combines the account with multiple administrative workflows, creating more daily
      touchpoints than a current-account-only proposition.
    claimRefs: [CP005, CP012, CP014]
  - calloutType: risk
    title: Multi-homing weakens lock-in
    body: >-
      A customer can retain Tide for domestic operations while adding a currency specialist,
      limiting the switching barrier created by the account itself.
    claimRefs: [CP009, CP015]
