callouts:
  - calloutType: recommendation
    title: Price conviction requires private evidence
    body: >-
      The $1.5 billion financing mark is observable, but a buy case is not:
      reconcile the operating denominator and capital structure before setting
      entry price, target return, hold period or exit assumptions.
    claimRefs: [CV001, CV004, CV007, CV015, CV016]
