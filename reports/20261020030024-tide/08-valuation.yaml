artifact: valuation
slug: tide
runDate: 2026-10-20
company:
  name: Tide
chapter:
  number: 8
  title: Valuation
  summary: >-
    Tide's $1.5 billion September 2025 financing mark is supported by both company
    and third-party sources, but the public record does not support a precise
    return target. Track rather than buy: reported scale is substantial, while
    revenue quality, total funding, preference terms, dilution, and exit economics
    remain too uncertain for price conviction.
sections:
  - id: decision-and-entry-discipline
    title: Decision and entry discipline
    body: >-
      The appropriate public-evidence decision is track, with high underwriting
      risk and a valuation stance of full pending verification. Tide and two
      third-party datasets place the September 2025 financing value at $1.5
      billion, while Multiples reports a $225 million metric and derives a 6.7x
      multiple. That denominator is not decision-grade: the publisher says
      round-linked figures may be revenue or ARR and may represent run-rate or
      LTM values. Independent trackers also disagree materially on cumulative
      funding. Entry should therefore be conditioned on audited consolidated
      revenue, margin and cash conversion, a fully diluted cap table, and the
      financing waterfall. Without those items, the financing mark is evidence
      of investor appetite, not proof that a new investor can earn a target
      return at the same or a higher price.
    claimRefs: [CV001, CV003, CV004, CV007, CV015]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: thesis-and-anti-thesis
    title: Thesis and anti-thesis
    body: >-
      The thesis is scale plus product breadth. Tide says it has crossed two
      million global members, including 900,000 in the UK and more than 1.1
      million in India, and claims a 15% UK share. Its regulated-partner model
      also lets it combine accounts, administration and financing access without
      operating as a bank. The anti-thesis is that scale does not establish
      monetisation quality or durable unit economics. Tide's Google Play copy
      describes more than two million UK users, which conflicts with the
      company's own global and UK breakdown. A competitor-authored review also
      identifies a GBP-only structure and no multi-currency wallet as weaknesses
      for internationally active SMEs. Those signals make member activity,
      retention, geographic revenue mix and cross-border economics essential
      diligence rather than optional upside analysis.
    claimRefs: [CV008, CV009, CV010, CV011, CV012]
    tableRefs: [TV002]
  - id: scenarios-and-comparable-context
    title: Scenarios and comparable context
    body: >-
      Scenario valuation should remain relative to the verified $1.5 billion
      financing mark, not be converted into a false point estimate. A bull case
      requires the reported member scale to translate into independently verified
      recurring revenue, attractive retention and profitable international
      expansion; only then could a premium be considered. The base case treats
      $1.5 billion as a negotiating ceiling until the $225 million denominator
      and 6.7x calculation are reconciled to audited group accounts. The bear case
      assumes weaker monetisation, costly internationalisation or adverse
      preference terms and therefore requires a discount or no investment.
      Historical rounds show rapid mark expansion from undisclosed valuation in
      2017 to reported billion-dollar discussions in 2025, but public and private
      comparables in the retained dataset use mixed business models and metric
      definitions, so they are context rather than a defensible pricing formula.
    claimRefs: [CV001, CV003, CV004, CV013, CV014, CV016]
    tableRefs: [TV003]
  - id: final-diligence-and-thesis-breaks
    title: Final diligence and thesis-breaks
    body: >-
      Final underwriting should request the signed September 2025 financing
      documents, primary-versus-secondary allocation, liquidation preferences,
      anti-dilution rights, option-pool treatment, debt terms, audited
      consolidated accounts and a bridge from members to active primary accounts,
      revenue and contribution margin by geography. It should also reconcile the
      $181 million and $312 million funding totals and the contradictory member
      geography claims. Thesis-break triggers are an inability to reconcile the
      financing waterfall, evidence that the cited revenue metric is ARR or
      run-rate rather than audited revenue, deteriorating retention, continuing
      losses hidden by entity-level reporting, or international growth that does
      not generate positive unit economics. Exit readiness remains unproven
      because the available evidence supplies a private financing mark rather
      than an observable public-market price.
    claimRefs: [CV002, CV005, CV006, CV007, CV010, CV014, CV016]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Assessment, Decision implication]
    rows:
      - [Recommendation, Track, "Do not underwrite a new entry until private financial and cap-table evidence is supplied."]
      - [Confidence, Medium-low, "The financing mark is corroborated, but its operating denominator is not."]
      - [Risk rating, High, "Metric-definition, preference, dilution and exit uncertainties can change returns materially."]
      - [Valuation stance, Full pending verification, "Treat $1.5B as a negotiating ceiling rather than an independently proven fair value."]
      - [Return and hold case, Not publicly supportable, "Set target return, hold period and exit route only after audited economics and waterfall review."]
    notes: "Assessment uses the September 2025 private financing mark; no audited consolidated revenue, preference stack, dilution schedule, target return, hold period, or exit price was available in the assigned evidence."
    claimRefs: [CV001, CV003, CV004, CV007, CV015, CV016]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Lens, Evidence-backed argument, What would change the view]
    rows:
      - [Thesis, "Company-reported global membership exceeds 2 million, with scale in both the UK and India.", "Verify active members, primary-account share, retention and revenue per active member by geography."]
      - [Thesis, "The platform combines regulated accounts with accounting, payroll, payments, savings and partner-led finance.", "Demonstrate attach rates and positive contribution margin for the broader product suite."]
      - [Anti-thesis, "Official materials conflict on whether the two-million figure is global or UK-only.", "Provide a dated, geography-consistent member ledger and definitions for member, SME and active account."]
      - [Anti-thesis, "A competitor-authored review describes GBP-only currency handling as a limitation for international users.", "Show cross-border usage, FX economics, churn reasons and roadmap evidence from neutral customer data."]
    notes: "Membership and market-share figures are company claims; the international limitation comes from a competitor-authored comparison and is used as an adverse diligence signal, not an independent benchmark."
    claimRefs: [CV008, CV009, CV010, CV011, CV012]
  - id: TV003
    title: Bull, base and bear scenarios
    columns: [Case, Explicit assumptions, Valuation / return logic, Key risks and downside triggers, Probability signal]
    rows:
      - [Bull, "Audited group revenue validates or exceeds the reported $225M metric; retention and margins are strong; India and Europe become profitable.", "A premium to the $1.5B mark may be defensible only after verified growth, margin and exit evidence establishes the target return.", "Expansion costs, regulation and weak cross-border economics negate operating leverage.", "Unsupported today; requires audited economics and cohort proof."]
      - [Base, "Member scale is real but monetisation and international contribution remain only partly verified.", "Use $1.5B as a ceiling, with entry conditional on a price or terms that absorb denominator and preference uncertainty.", "The reported 6.7x multiple is not comparable if its denominator is run-rate, ARR or non-consolidated revenue.", "Most consistent with the current mixed evidence."]
      - [Bear, "Revenue quality, retention or margins underperform; funding and preference reconciliation reveals greater dilution or seniority.", "Require a material discount to the $1.5B mark or decline to invest; no precise range is supportable from public data.", "Down round, delayed liquidity, weak geographic unit economics or an unreconciled financing waterfall.", "Plausible enough to block a buy recommendation."]
    notes: "Scenarios are conditional decision frames, not forecasts; no numeric probabilities or valuation ranges are assigned because audited consolidated financials, cap-table terms, and comparable metric definitions are unavailable."
    claimRefs: [CV001, CV003, CV004, CV007, CV008, CV009, CV012, CV015, CV016]
