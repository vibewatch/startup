schemaVersion: "report-v2"
artifact: financials
slug: tide
runDate: 2026-10-20
company:
  name: Tide
chapter:
  number: 4
  title: Financials
  summary: >-
    Tide appears to monetize through subscriptions, transaction and payment fees,
    credit economics, and newer partner-enabled products, while its UK operation
    supplies most revenue and was reported profitable. Public evidence still does
    not establish consolidated revenue, gross margin, unit economics, cash, burn,
    runway, or debt obligations, so capital adequacy cannot be underwritten.
sections:
  - id: revenue-model-and-pricing
    title: Revenue model and pricing
    body: >-
      Tide is a regulated financial platform rather than a bank, combining
      ClearBank-powered accounts and e-money arrangements with administrative
      software and partner-enabled products. The clearest monetization evidence is
      a four-tier UK plan ladder, transaction and international-payment charges,
      credit economics, and a newly reported investment-account platform fee.
      Third-party reporting describes the overall model as transaction fees,
      subscriptions, and credit margins. This mix can diversify revenue, but public
      list prices do not reveal realized pricing, discounts, attach rates, revenue
      recognition, or the contribution of each stream. The Free tier also means
      member growth is not equivalent to paying-customer or revenue growth.
    claimRefs: [CI001, CI002, CI003, CI004, CI008, CI013, CI014]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-and-revenue-quality
    title: Traction and revenue quality
    body: >-
      Public scale has advanced to more than two million members, split between
      900,000 UK SMEs and more than 1.1 million Indian SMEs as of May 2026. Tide
      says the UK still contributes most revenue, while an independent article
      reported that the UK business was profitable in September 2025. A market-data
      profile reports £177.2 million of 2024 turnover and 55% growth for the UK
      operating entity, but that is not a disclosed consolidated group revenue
      figure. Member count, market share, and credit facilitated are useful traction
      indicators; none supplies ARPU, paid conversion, churn, net retention, take
      rate, credit loss, or gross margin.
    claimRefs: [CI005, CI006, CI007, CI009, CI014, CI015]
    tableRefs: [TI003]
  - id: cost-structure-and-sales-efficiency
    title: Cost structure and sales efficiency
    body: >-
      Partner infrastructure is central to delivery economics. Mambu says Tide
      selected its cloud core, underpinned by AWS, to manage a growing ledger,
      lending portfolios, accounting, and reporting; the partner also says a
      revolving-credit product was built and launched in three months. This
      suggests lower build time and configurable capacity, but it also introduces
      platform, cloud, and partner costs that public sources do not quantify.
      Similarly, the retained evidence gives no CAC, payback period, sales cycle,
      support cost per member, credit-loss allocation, or channel revenue share.
      International FX limitations identified by a competitor review may create
      pricing pressure among cross-border SMEs.
    claimRefs: [CI012, CI013, CI016]
  - id: capital-adequacy
    title: Capital adequacy and financing dependency
    body: >-
      Tide raised $120 million in September 2025 at a $1.5 billion valuation, but
      the round combined primary and secondary capital and the exact split was not
      disclosed. Therefore the headline raise cannot be treated as cash added to
      the balance sheet. Reporting says the financing is intended to accelerate
      international expansion, product development, and AI, all of which can
      increase near-term capital requirements. Public evidence does not disclose
      cash on hand, burn, runway, primary proceeds, debt balances, covenants, or a
      next-round trigger. Capital adequacy remains an open diligence item rather
      than an inference from valuation or total funding headlines.
    claimRefs: [CI010, CI011, CI016]
  - id: financial-verdict
    title: Financial verdict
    body: >-
      The available evidence supports a credible, increasingly diversified
      monetization architecture and meaningful UK scale, with reported UK
      profitability offering a positive signal. Revenue quality is nevertheless
      unproven at group level: Tide has not publicly bridged members to paid plans,
      transaction volume, net revenue, gross profit, or cash generation. Partner
      infrastructure and lending distribution can reduce direct build and balance
      sheet intensity, yet contractual costs, credit-risk allocation, and take
      rates are unavailable. The financial stance is therefore constructive on
      model breadth but cautious on margins and capital intensity pending
      consolidated accounts, cohort economics, and a cash-and-obligations bridge.
    claimRefs: [CI004, CI005, CI007, CI009, CI010, CI012, CI016]
tables:
  - id: TI001
    title: Revenue streams and evidence quality
    columns:
      - Stream
      - Mechanism
      - Public value or status
      - Revenue quality
      - Diligence ask
    rows:
      - [Subscriptions, "Free-to-paid monthly plans", "£0 to £69.99 list price", "Potentially recurring; paid attach and realized price unknown", "Revenue and members by plan, discounts, churn, and deferred revenue"]
      - [Payments and transactions, "Transfer, payment-processing, card, and FX fees", "Plan-specific transfer and FX charges are publicly listed", "Usage-linked and potentially volatile", "Payment volume, net take rate, scheme costs, fraud loss, and contribution margin"]
      - [Credit, "Marketplace/intermediation and reported credit margins", "More than £1.75bn of credit access claimed; economics undisclosed", "Partner-enabled, but principal-risk allocation is unclear", "Originations, approvals, take rate, loss allocation, funding source, and net revenue"]
      - [Administrative software, "Accounting, invoicing, expense, payroll, and company services", "Bundled across plan tiers and products", "May support retention and upsell; stand-alone revenue unknown", "SKU revenue, attach rate, support cost, and retention uplift"]
      - [Investment account, "Platform fee on partner-managed investment products", "0.3% to 0.6% reported by subscription tier", "New fee stream with partner economics", "Assets under administration, net fee after partners, adoption, and regulatory cost"]
    notes: >-
      Values are public list prices or reported platform activity, not audited
      realized revenue; stream mix, recognition policy, and partner revenue shares
      remain unavailable.
    claimRefs: [CI002, CI003, CI004, CI008, CI014, CI015]
  - id: TI002
    title: UK plan pricing and selected variable charges
    columns:
      - Plan
      - Monthly list fee
      - Included transfers
      - Foreign-currency card FX fee
      - International transfer FX markup
    rows:
      - [Free, "£0", "5 per month, then 20p each", "2.75%", "1.50%"]
      - [Smart, "£12.49", "30 per month", "0%", "1.25%"]
      - [Pro, "£27.49", Unlimited, "0%", "0.75%"]
      - [Max, "£69.99", Unlimited, "0%", "0.50%"]
    notes: >-
      WorldFirst reported these Tide list prices on 20 August 2026; the source is
      a competitor review, and realized pricing, promotions, taxes, and route-level
      transaction fees require confirmation against Tide contracts.
    claimRefs: [CI002, CI003, CI013]
  - id: TI003
    title: Unit-economics and capital-underwriting status
    columns:
      - Metric
      - Public value or status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - ["UK operating-entity turnover", "£177.2m in 2024; 55% reported growth", Low, "Entity-level growth signal, not consolidated group revenue", "Filed accounts and entity-to-group reconciliation"]
      - ["UK profitability", "Reported profitable; definition and period detail unavailable", Medium, "Suggests mature-market viability but not group cash generation", "Audited operating profit, EBITDA, net income, and free cash flow"]
      - ["Members and revenue concentration", ">2m global members; UK contributes the majority of revenue", Medium, "Shows scale but not monetization per active member", "Active and paid members, ARPU, churn, NRR, and country cohorts"]
      - ["Credit facilitated", ">£1.75bn claimed as access for UK small businesses", Medium, "Distribution scale is not Tide revenue, assets, or credit exposure", "Originations, balances, take rate, defaults, and risk-sharing terms"]
      - ["Cash, burn, runway, and debt obligations", null, Low, "Required to judge financing dependency and downside capacity", "Cash bridge, monthly burn, runway, debt schedule, covenants, and primary round proceeds"]
    notes: >-
      Null means no usable public value was found in the assigned evidence pool;
      confidence describes the public evidence, not management data that may exist.
    claimRefs: [CI005, CI006, CI007, CI009, CI015, CI016]
figures:
  - id: FI001
    title: Member activity to revenue and gross-profit evidence bridge
    type: flow
    summary: >-
      Public evidence identifies monetization routes but does not disclose the
      conversion rates or costs needed to bridge members to gross profit.
    data:
      nodes:
        - id: member-base
          label: Global member base
          detail: "More than 2 million members; activity and paid status are not disclosed."
        - id: account-and-admin-use
          label: Account and administration use
          detail: "Accounts, invoicing, accounting, expense, payroll, and registration tools."
        - id: paid-plan-conversion
          label: Paid plan conversion
          detail: "Free, Smart, Pro, and Max tiers; conversion and churn are unavailable."
        - id: transaction-monetization
          label: Transaction monetization
          detail: "Transfers, cards, payment processing, and foreign-exchange charges."
        - id: partner-product-monetization
          label: Partner-product monetization
          detail: "Credit, savings, insurance, and investment products use partner infrastructure."
        - id: recognized-revenue
          label: Recognized revenue
          detail: "UK operating-entity turnover is reported; consolidated revenue and mix are unavailable."
        - id: gross-profit-conversion
          label: Gross-profit conversion
          detail: "Partner costs, funding costs, losses, support costs, and gross margin are undisclosed."
    approximationNotes: >-
      Ordered qualitative flow only; no conversion rate, revenue amount, or
      gross-profit amount is inferred from member or credit-volume metrics.
    claimRefs: [CI001, CI004, CI006, CI008, CI012, CI016]
callouts:
  - calloutType: strength
    title: Multiple monetization surfaces
    body: >-
      Subscriptions, transaction charges, credit economics, and investment fees
      create several potential revenue pools rather than a single account fee.
    claimRefs: [CI002, CI004, CI008]
  - calloutType: risk
    title: Funding raised is not cash available
    body: >-
      The $120 million round mixed primary and secondary investment, so the
      publicly announced amount cannot be used as a runway numerator.
    claimRefs: [CI010, CI016]
