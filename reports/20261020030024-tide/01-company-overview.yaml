company:
  name: "Tide"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Tide is a London-headquartered SME finance and business-management platform that operates through a regulated partner structure rather than as a bank. By May 2026, Tide reported more than 2 million members and 15% UK SME share, while its September 2025 financing established a $1.5 billion valuation; total capital raised, consolidated group revenue, ownership rights, and full governance remain incompletely evidenced."
sections:
  - id: "identity-and-operating-model"
    title: "Identity and operating model"
    body: >-
      Tide Platform Limited operates the Tide website and app but is not itself a bank. Its UK proposition combines Tide's own FCA permissions with regulated infrastructure from ClearBank and PrePay entities, so the legal and safeguarding position depends on the specific account or product. The commercial proposition is broader than a current account: Tide presents an integrated SME platform spanning invoicing, accounting, expense management, payroll, payments, savings, credit access, and adjacent sales tools. That breadth may improve workflow retention, but it also creates partner, product-governance, and regulatory dependencies that should not be collapsed into a single "banking" label. The entity was incorporated in London in May 2015 and the app launched in January 2017.
    claimRefs: ["CO001", "CO002", "CO003", "CO004"]
    tableRefs: ["TO001"]
  - id: "leadership-and-governance"
    title: "Leadership and governance"
    body: >-
      Tide's public leadership surface identifies Oliver Prill as group CEO, George Schmidt as UK/Europe CEO, and Sir Donald Brydon as chair; a third-party review identifies George Bevis as founder. Prill joined in 2018 and brings more than two decades in financial services, while Brydon contributes extensive listed-company, audit-review, and financial-sector board experience. The September 2025 financing also added TPG partner Yemi Lalude to the board, increasing institutional-investor representation. Public evidence does not provide a complete board roster, committee composition, voting rights, founder ownership, or succession framework. The visible concentration of strategy around Prill therefore creates a diligence question, not proof of unmanaged key-person risk.
    claimRefs: ["CO008", "CO010"]
    tableRefs: ["TO002"]
  - id: "capital-and-stakeholders"
    title: "Capital and stakeholder structure"
    body: >-
      The clearest financing milestone is the September 2025 $120 million transaction led by TPG's Rise Funds with participation from Apax Digital, which valued Tide at $1.5 billion. Reporting indicates that the transaction mixed primary and secondary capital, so the headline amount cannot be treated wholly as cash added to the balance sheet. Lifetime funding is unresolved: Tide says more than $300 million of investment, Multiples records $312 million across seven rounds, and Silicon Valley Investclub reports more than $411 million. Different treatment of debt, grants, convertibles, and secondary proceeds may explain the spread, but the retained evidence does not reconcile it. The capital stack, liquidation preferences, dilution, and investor-control rights require direct company documentation.
    claimRefs: ["CO009", "CO010", "CO011", "CO012", "CO013"]
    tableRefs: ["TO003"]
  - id: "scale-and-milestones"
    title: "Scale, footprint, and milestones"
    body: >-
      On 27 May 2026, Tide reported more than 2 million members globally, split between 900,000 UK SMEs and more than 1.1 million businesses in India. It also claimed 15% UK SME share, a majority of company revenue from the UK, and more than 2,800 employees. These are company-reported scale indicators rather than audited customer, active-account, or consolidated financial measures. Product and geographic expansion has continued through India, Germany, France, the Funding Options and Onfolk acquisitions, and a June 2026 investment account powered by Seccl and Vanguard. A competitor-authored review highlights Tide's GBP-centered structure, lack of a multi-currency wallet, and absence of a traditional overdraft; that source is useful as adverse product context but is not an independent benchmark.
    claimRefs: ["CO005", "CO006", "CO007", "CO014", "CO015", "CO016"]
    figureRefs: ["FO001"]
