evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      A complete current board and executive roster, committee mandates, founder ownership, succession plans, and
      investor voting or veto rights.
    whyItMatters: >-
      Public biographies show functional coverage but cannot establish control, oversight independence, or resilience to
      leadership changes.
    diligencePath: >-
      Request the current organisation chart, board and committee packs, articles, shareholder agreement, cap table, and
      succession documentation.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: total-funding
    missingEvidence: >-
      A round-by-round capital reconciliation separating primary equity, secondary proceeds, debt or securitisation,
      grants, and convertible instruments.
    whyItMatters: >-
      Published totals range from more than $300 million to more than $411 million, and funding raised cannot be assumed
      to equal cash available.
    diligencePath: >-
      Reconcile audited cash-flow statements, financing agreements, shareholder registers, and transaction closing
      statements with management.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: cover-metrics
    missingEvidence: >-
      Audited consolidated group revenue, ARR where applicable, gross margin, cash, debt, runway, active-primary-account
      rate, retention, and regional unit economics.
    whyItMatters: >-
      Member scale and a financing valuation do not establish monetisation, profitability, liquidity, or customer
      engagement.
    diligencePath: >-
      Obtain consolidated audited accounts and a management KPI pack with definitions and UK, India, Germany, and France
      cohorts.
    relatedQuestionRefs:
      - QO004
      - QO006
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: market-sizing-gap
    missingEvidence: >-
      Independent category-spend data, serviceable digital-SME counts, active member definitions, paid conversion, ARPU,
      and product revenue by country.
    whyItMatters: >-
      Without these inputs, population and account counts cannot be converted into a defensible monetary TAM, SAM, SOM,
      or adoption forecast.
    diligencePath: >-
      Obtain Tide's board market model and cohort pack, then triangulate them against government business-population
      microdata and independent SME banking, accounting, payments, credit, and payroll spend datasets.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: sizing-methodology
    missingEvidence: >-
      Consistent dated definitions for SME population, member, active member, primary account, and market share across
      the UK and India.
    whyItMatters: >-
      Published denominators and share claims vary by date and definition, preventing reliable penetration and
      whitespace calculations.
    diligencePath: >-
      Request Tide's country-level metric dictionary and monthly active-member bridge, and reconcile each denominator to
      the original government table.
    relatedQuestionRefs:
      - QM002
      - QM003
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-economics
    missingEvidence: >-
      Buyer research, budget ownership, acquisition cost, retention, paid-plan conversion, product attach rates, and
      partner revenue-share economics.
    whyItMatters: >-
      These data determine whether broad member acquisition produces durable, high-margin monetisation rather than
      low-activity accounts.
    diligencePath: >-
      Review customer research, pricing tests, channel attribution, cohort retention, and unit economics by geography,
      plan, and product.
    relatedQuestionRefs:
      - QM004
      - QM005
      - QM006
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: competitor-scale-and-funding
    missingEvidence: >-
      Comparable current customer scale, funding, revenue, retention, primary-account share, and product adoption
      metrics for each material competitor.
    whyItMatters: >-
      Without comparable denominators, Tide's company-reported scale cannot establish relative competitive strength or
      customer quality.
    diligencePath: >-
      Obtain current filings, investor materials, and management KPI packs for Tide and the named direct competitors
      using a common geography and active-customer definition.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP001
  - type: conflicting-data
    severity: material
    topic: pricing-and-international
    missingEvidence: >-
      A current official Tide rate card and product terms that reconcile plan prices, international transfer support,
      foreign-exchange charges, and support entitlements.
    whyItMatters: The assigned third-party sources conflict across vintages, preventing a reliable total-cost comparison.
    diligencePath: >-
      Capture Tide's live official pricing and terms for a representative UK limited company, then price matched
      domestic and international transaction baskets.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: access-blocked
    severity: minor
    topic: regulatory-posture
    missingEvidence: Readable text from the allocated FCA register page showing Tide's current permissions.
    whyItMatters: >-
      The assigned fetch returned only a JavaScript loading shell, so the official Tide page and third-party
      descriptions could not be checked against the register text.
    diligencePath: >-
      Export the FCA register record through an accessible official format and verify every permission and
      firm-reference number before investment committee use.
    relatedQuestionRefs:
      - QP003
  - type: missing-source
    severity: material
    topic: switching-and-multihoming
    missingEvidence: >-
      Customer cohort data on churn, primary-account usage, multi-homing, switching frequency, and attach rates for paid
      admin products.
    whyItMatters: Product breadth is not proof of retention, pricing power, or defensible distribution.
    diligencePath: >-
      Request monthly cohorts by geography and plan, bank-feed activity, product attach, gross retention, and reasons
      for account dormancy or closure.
    relatedQuestionRefs:
      - QP006
      - QP007
      - QP008
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      CAC, payback, sales cycle, active and paid member cohorts, ARPU, churn, net revenue retention, gross margin, and
      support cost by market and product.
    whyItMatters: >-
      Member growth and list pricing cannot establish efficient acquisition, durable recurring revenue, or contribution
      margin without cohort economics.
    diligencePath: >-
      Obtain monthly cohort dashboards and reconcile acquisition spend, active paid members, net revenue, gross profit,
      churn, and support costs by country.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Consolidated cash, monthly burn, runway, primary proceeds from the 2025 round, debt balances, maturity schedule,
      covenants, and next-round triggers.
    whyItMatters: >-
      A mixed primary-secondary financing headline and valuation do not establish liquidity available to fund
      international expansion or absorb downside.
    diligencePath: >-
      Review current management accounts, bank statements, financing documents, debt agreements, covenant certificates,
      and a 24-month cash forecast.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
    topic: revenue-consolidation
    missingEvidence: >-
      Audited reconciliation from reported UK operating-entity turnover to consolidated group revenue, including
      intercompany items and revenue mix.
    whyItMatters: >-
      Entity-level turnover and company-wide member counts cannot be combined into a reliable group growth, ARPU,
      margin, or valuation denominator.
    diligencePath: >-
      Obtain consolidated audited statements and an entity-by-entity revenue bridge with accounting policies and
      product-level revenue recognition.
    relatedQuestionRefs:
      - QI004
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: security-resilience
    missingEvidence: Current independent assurance for security, privacy, availability, disaster recovery, and material incidents.
    whyItMatters: >-
      The public pool shows control intent but cannot establish whether the platform and its partner chain meet
      investor-grade reliability and security expectations.
    diligencePath: >-
      Request SOC 2 or equivalent reports, penetration-test summaries, incident and uptime history, recovery objectives,
      privacy impact assessments, and open remediation items.
    relatedQuestionRefs:
      - QE006
  - type: missing-source
    severity: material
    topic: developer-surface
    missingEvidence: >-
      Current first-party API documentation, changelog, status page, versioning policy, and public developer-usage
      measures.
    whyItMatters: >-
      A low-reputation review and historical summary cannot verify the present integration surface or ecosystem
      maturity.
    diligencePath: >-
      Obtain current developer documentation, sandbox access, API traffic and error metrics, deprecation history, and
      partner references.
    relatedQuestionRefs:
      - QE003
      - QE004
  - type: private-evidence-only
    severity: material
    topic: automation-quality
    missingEvidence: >-
      Measured accuracy, exception rates, human-review rates, and customer time savings for reconciliation, payroll,
      compliance documents, and AI-assisted workflows.
    whyItMatters: >-
      Feature breadth does not establish automation quality or the economic value of Tide's claimed connected
      experience.
    diligencePath: >-
      Review product telemetry, cohort adoption, task-completion time, correction rates, support contacts, and
      controlled customer outcome studies by module.
    relatedQuestionRefs:
      - QE001
      - QE005
  - type: missing-source
    severity: material
    topic: partner-architecture
    missingEvidence: >-
      A current responsibility map and service-level evidence across ClearBank, e-money, acquiring, lending, and
      software-integration partners.
    whyItMatters: >-
      Partner concentration and unclear ownership can amplify outage, remediation, compliance, and customer-support
      risk.
    diligencePath: >-
      Request the dependency inventory, contracts and SLAs, exit plans, concentration metrics, incident playbooks, and
      end-to-end service reviews.
    relatedQuestionRefs:
      - QE003
      - QE006
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: >-
      NRR, GRR, logo and revenue churn, renewal rate, paid-plan migration, primary-account activity, and UK-versus-India
      cohort curves.
    whyItMatters: >-
      Registered member growth cannot establish durable usage, monetisation, or whether international acquisition has
      the same quality as UK cohorts.
    diligencePath: >-
      Request monthly cohort exports by market, acquisition channel, plan, account type, active definition, revenue,
      gross profit, and churn reason.
    relatedQuestionRefs:
      - QU004
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      Named customers with verified production status, products used, deployment date, baseline, quantified outcome, and
      renewal or expansion.
    whyItMatters: >-
      Aggregate membership does not prove that Tide is a primary workflow, produces customer value, or sustains
      multi-product relationships.
    diligencePath: >-
      Obtain at least five reference calls across the UK and India, including one churned customer and one customer
      using three or more products.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: >-
      Revenue and gross-profit concentration by top customer, channel, account-infrastructure partner, geography, and
      product.
    whyItMatters: >-
      A large member base may coexist with material partner, channel, or monetisation concentration that public
      membership totals cannot reveal.
    diligencePath: >-
      Review top-20 customer and channel contribution, partner-level economics, concentration trends, renewal dates, and
      downside scenarios.
  - type: missing-source
    severity: material
    topic: regulatory and legal status
    missingEvidence: >-
      Primary regulator records, licence registers, court dockets, enforcement correspondence, and a
      jurisdiction-by-jurisdiction permissions map.
    whyItMatters: >-
      Without primary records, legal-perimeter and enforcement exposure cannot be distinguished from company control
      descriptions.
    diligencePath: >-
      Commission counsel to reconcile every Tide legal entity, regulated activity, permission, open matter, and
      accountable counterparty across the UK, India, Germany, France, and Luxembourg.
    relatedQuestionRefs:
      - QR002
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: service, security, and loss performance
