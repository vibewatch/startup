  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Tide's relevant market is the operating-finance layer for small businesses: business accounts, payments,
              invoicing, accounting, expense control, payroll, credit access, and selected wealth products. That
              boundary is wider than UK business-current-account fees but narrower than all SME financial services,
              because underwriting balance sheets, full multi-currency treasury, and specialist investment manufacturing
              are supplied by partners or alternative providers. Status-quo substitutes include a high-street bank plus
              separate accounting, payroll, card acquiring, lending, and foreign-exchange tools; internal spreadsheets
              and manual reconciliation remain non-software substitutes. Tide's integration proposition can reduce
              switching friction between tools, while its regulated-partner model and GBP-centred account structure
              leave important workflows outside the platform. The market definition therefore follows workflow ownership
              and monetisable services, not the headline count of all SMEs.
            claimRefs:
              - CM001
              - CM008
              - CM009
              - CM010
              - CM016
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM008
              - CM009
              - CM010
              - CM016
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              The evidence supports population and penetration lenses, not a monetary TAM. Tide reports 5.2 million UK
              small businesses, 900,000 UK members, and 15% share; a separate publisher cites 5.69 million UK SMEs at
              the start of 2025. Those denominators do not reconcile automatically, so the reported share should not be
              reverse-engineered into a precise addressable market. India offers a much larger population lens: Tide
              reports more than 1.1 million members against 72 million official and 140 million unofficial MSMEs, but
              neither figure establishes serviceable, digitally reachable, or paying demand. Germany's 5.5 million SMEs
              and Tide's France entry indicate adjacency, not proven penetration. Revenue estimates from private-market
              databases are excluded from market sizing because the publisher does not resolve whether its $225 million
              figure is LTM revenue or run-rate.
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM011
              - CM012
              - CM013
              - CM014
