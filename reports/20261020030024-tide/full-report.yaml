      - number: '1.2'
        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              Tide's public leadership surface identifies Oliver Prill as group CEO, George Schmidt as UK/Europe CEO,
              and Sir Donald Brydon as chair; a third-party review identifies George Bevis as founder. Prill joined in
              2018 and brings more than two decades in financial services, while Brydon contributes extensive
              listed-company, audit-review, and financial-sector board experience. The September 2025 financing also
              added TPG partner Yemi Lalude to the board, increasing institutional-investor representation. Public
              evidence does not provide a complete board roster, committee composition, voting rights, founder
              ownership, or succession framework. The visible concentration of strategy around Prill therefore creates a
              diligence question, not proof of unmanaged key-person risk.
            claimRefs:
              - CO008
              - CO010
          - type: table
            tableRef: TO002
            claimRefs:
              - CO008
              - CO009
              - CO010
      - number: '1.3'
        title: Capital and stakeholder structure
        blocks:
          - type: paragraph
            body: >-
              The clearest financing milestone is the September 2025 $120 million transaction led by TPG's Rise Funds
              with participation from Apax Digital, which valued Tide at $1.5 billion. Reporting indicates that the
              transaction mixed primary and secondary capital, so the headline amount cannot be treated wholly as cash
              added to the balance sheet. Lifetime funding is unresolved: Tide says more than $300 million of
              investment, Multiples records $312 million across seven rounds, and Silicon Valley Investclub reports more
              than $411 million. Different treatment of debt, grants, convertibles, and secondary proceeds may explain
              the spread, but the retained evidence does not reconcile it. The capital stack, liquidation preferences,
              dilution, and investor-control rights require direct company documentation.
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
