chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Tide Platform Limited operates the Tide website and app but is not itself a bank. Its UK proposition
              combines Tide's own FCA permissions with regulated infrastructure from ClearBank and PrePay entities, so
              the legal and safeguarding position depends on the specific account or product. The commercial proposition
              is broader than a current account: Tide presents an integrated SME platform spanning invoicing,
              accounting, expense management, payroll, payments, savings, credit access, and adjacent sales tools. That
              breadth may improve workflow retention, but it also creates partner, product-governance, and regulatory
              dependencies that should not be collapsed into a single "banking" label. The entity was incorporated in
              London in May 2015 and the app launched in January 2017.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
