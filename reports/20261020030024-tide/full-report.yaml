  - id: FE001
    title: Evidence-bounded product architecture map
    type: stack
    summary: >-
      Tide's public product surface stacks SME workflows above integration and regulated partner rails, with assurance
      spanning the operating model.
    data:
      layers:
        - label: Member workspace
          detail: Mobile and web access for accounts, cards, transfers, and team administration.
          items:
            - name: Business account
              detail: Daily GBP-centric account and payment workflow.
            - name: Cards and expenses
              detail: Business and team-spend controls connected to transactions.
        - label: Administrative workflows
          detail: Tools intended to reduce repetitive finance and company administration.
          items:
            - name: Invoicing and accounting
              detail: Invoice, bookkeeping, tax, and reconciliation surfaces.
            - name: Payroll and dividends
              detail: Embedded wages, director-pay documents, and payment history.
        - label: Growth services
          detail: Additional services distributed through the Tide member relationship.
          items:
            - name: Payments and acquiring
              detail: Payment links, acceptance, bill payment, and connected sales tools.
            - name: Credit and insurance
              detail: Tide and partner-enabled access to finance and protection products.
        - label: Software integrations
          detail: Connections to accounting packages and reported API-enabled partner workflows.
          items:
            - name: Accounting connections
              detail: External bookkeeping and reconciliation software.
            - name: Reported API surface
              detail: Historical lender integrations and a third-party-described developer surface.
        - label: Regulated partner rails
          detail: Underlying account, e-money, payment, acquiring, and lending dependencies.
          items:
            - name: Account infrastructure
              detail: ClearBank and e-money relationships described by third parties.
            - name: Product partners
              detail: Payment, acquiring, software, and credit providers.
        - label: Data and assurance
          detail: Risk processes, quality feedback, and company-claimed data capabilities.
          items:
            - name: Quality controls
              detail: Review of interactions, complaints, policies, and regulatory outcomes.
            - name: Data and AI
              detail: A company-claimed proprietary SME dataset used within a risk framework.
    approximationNotes: >-
      Conceptual stack assembled from assigned public evidence; it does not assert Tide's private deployment topology,
      data flows, or control boundaries.
    claimRefs:
      - CE005
      - CE006
      - CE007
      - CE008
      - CE010
  - id: FU001
    title: Customer journey and potential expansion surfaces
    type: journey-map
    summary: >-
      Tide can widen a relationship from digital onboarding into operating tools and finance, but no conversion or
      retention rates are publicly disclosed.
    data:
      nodes:
        - id: discover
          label: Discover
          name: Discover
          detail: SME evaluates a free or paid Tide plan against domestic banking needs.
          value: Segment fit
          valueNote: Strongest for digital-first, UK-focused SMEs
          touchpoints:
            - Pricing
            - product review
            - app
        - id: apply
          label: Apply
          name: Apply
          detail: Owner submits business and identity information through a digital flow.
          value: Minutes
          valueNote: Company-stated onboarding can be rapid, subject to checks
          touchpoints:
            - Mobile application
            - identity checks
        - id: activate
          label: Activate account
          name: Activate account
          detail: Customer receives a ClearBank-powered bank account or an e-money account structure, depending on product.
          value: Regulated partner model
          valueNote: Protection differs by account structure and eligibility
          touchpoints:
            - Account
            - Mastercard
            - payments
        - id: operate
          label: Run the business
          name: Run the business
          detail: Customer uses invoicing, accounting integrations, cards, and expense tools.
          value: Daily workflow
          valueNote: Public evidence does not disclose active-feature penetration
          touchpoints:
            - Invoices
            - accounting
            - expense management
        - id: finance
          label: Access finance
          name: Access finance
          detail: Eligible customers can seek credit through Tide and its lending marketplace.
          value: Over £1.75bn
          valueNote: Company-reported UK credit accessed; not Tide balance-sheet lending
          touchpoints:
            - Credit marketplace
            - partner lenders
        - id: expand
          label: Expand relationship
          name: Expand relationship
          detail: Paid plans and adjacent payroll, savings, payments, and insurance can deepen product use.
          value: Undisclosed conversion
          valueNote: NRR, cross-sell rates, and cohort expansion are not public
          touchpoints:
            - Subscription
            - payroll
            - savings
            - insurance
    approximationNotes: >-
      Ordered stages describe plausible product touchpoints, not a measured funnel; no stage conversion, active-use,
      retention, or expansion rates were disclosed.
    claimRefs:
      - CU010
      - CU013
      - CU016
  - id: FR001
    title: Residual risk heatmap
    type: matrix
    summary: >-
      Qualitative screening of impact, likelihood, and mitigation maturity, with uncertainty retained where public
      denominators are absent.
    data:
      columns:
        - id: impact
          label: Impact
          detail: Potential consequence if the failure occurs.
        - id: likelihood
          label: Likelihood
          detail: Evidence-bounded directional assessment, not a statistical probability.
        - id: mitigation
          label: Mitigation maturity
          detail: Public visibility of controls and fallback evidence.
      rows:
        - id: partner-stack
          label: Core partner-stack disruption
          note: ClearBank/PPS/banking-provider architecture; concentration and portability are undisclosed.
          values:
            - value: Critical
            - value: Medium
            - value: Partial
        - id: regulatory-conduct
          label: Cross-market regulatory or conduct failure
          note: QA control intent is visible; regulator outcomes and conduct metrics are not.
          values:
            - value: High
            - value: Medium
            - value: Developing
        - id: service-continuity
          label: Service interruption or slow remediation
          note: Contract terms allocate interruption risk; incident history is unavailable.
          values:
            - value: Critical
            - value: Unknown
            - value: Unverified
        - id: international-fit
          label: International product-fit erosion
          note: Independent and competitor reviews identify GBP and support constraints.
          values:
            - value: Medium
            - value: High for cross-border users
            - value: Partial
        - id: integration-dependency
          label: Critical API or vendor change
          note: Multiple integrated providers are visible; fallback tests are not.
          values:
            - value: High
            - value: Medium
            - value: Unverified
        - id: capital-execution
          label: Capital and expansion execution shortfall
          note: The reported round mixed primary and secondary capital; cash proceeds are not disclosed.
          values:
            - value: High
            - value: Medium
            - value: Partial
    approximationNotes: >-
      Matrix values are qualitative analyst synthesis based on retained public evidence as of 2026-10-20. Unknown does
      not mean low, and no cell asserts that a breach, outage, enforcement action, or loss event occurred.
    claimRefs:
      - CR004
      - CR006
      - CR008
      - CR010
      - CR012
      - CR014
      - CR016
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The evidence supports continued tracking, with any investment decision gated by financial and financing-term
      verification.
    data:
      nodes:
        - id: scale
          label: Scale signal
          detail: More than 2 million members are company-reported across the UK and India.
        - id: financing
          label: Financing signal
          detail: The September 2025 private financing established a reported $1.5B mark.
        - id: denominator
          label: Denominator gap
          detail: The cited $225M metric is not verified as audited consolidated revenue.
        - id: capital
          label: Capital-structure gap
          detail: Funding totals, dilution, preferences and primary-versus-secondary mix are unresolved.
        - id: exit
          label: Exit gap
          detail: Private financing does not provide an observable public-market exit price.
        - id: recommendation
          label: Track
          detail: Require audited economics and financing documents before setting price or target return.
    approximationNotes: The flow is qualitative and ordered; it does not assign numerical weights or imply conversion rates.
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV005
      - CV006
      - CV013
      - CV014
      - CV016
