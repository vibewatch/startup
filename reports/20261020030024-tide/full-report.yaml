      - Lens
      - Evidence-backed argument
      - What would change the view
    rows:
      - - Thesis
        - Company-reported global membership exceeds 2 million, with scale in both the UK and India.
        - Verify active members, primary-account share, retention and revenue per active member by geography.
      - - Thesis
        - The platform combines regulated accounts with accounting, payroll, payments, savings and partner-led finance.
        - Demonstrate attach rates and positive contribution margin for the broader product suite.
      - - Anti-thesis
        - Official materials conflict on whether the two-million figure is global or UK-only.
        - Provide a dated, geography-consistent member ledger and definitions for member, SME and active account.
      - - Anti-thesis
        - A competitor-authored review describes GBP-only currency handling as a limitation for international users.
        - Show cross-border usage, FX economics, churn reasons and roadmap evidence from neutral customer data.
    notes: >-
      Membership and market-share figures are company claims; the international limitation comes from a
      competitor-authored comparison and is used as an adverse diligence signal, not an independent benchmark.
    claimRefs:
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
  - id: TV003
    title: Bull, base and bear scenarios
    columns:
      - Case
      - Explicit assumptions
      - Valuation / return logic
      - Key risks and downside triggers
      - Probability signal
    rows:
      - - Bull
        - >-
          Audited group revenue validates or exceeds the reported $225M metric; retention and margins are strong; India
          and Europe become profitable.
        - >-
          A premium to the $1.5B mark may be defensible only after verified growth, margin and exit evidence establishes
          the target return.
        - Expansion costs, regulation and weak cross-border economics negate operating leverage.
        - Unsupported today; requires audited economics and cohort proof.
      - - Base
        - Member scale is real but monetisation and international contribution remain only partly verified.
        - >-
          Use $1.5B as a ceiling, with entry conditional on a price or terms that absorb denominator and preference
          uncertainty.
        - The reported 6.7x multiple is not comparable if its denominator is run-rate, ARR or non-consolidated revenue.
        - Most consistent with the current mixed evidence.
      - - Bear
        - >-
          Revenue quality, retention or margins underperform; funding and preference reconciliation reveals greater
          dilution or seniority.
        - >-
          Require a material discount to the $1.5B mark or decline to invest; no precise range is supportable from
          public data.
        - Down round, delayed liquidity, weak geographic unit economics or an unreconciled financing waterfall.
        - Plausible enough to block a buy recommendation.
    notes: >-
      Scenarios are conditional decision frames, not forecasts; no numeric probabilities or valuation ranges are
      assigned because audited consolidated financials, cap-table terms, and comparable metric definitions are
      unavailable.
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV007
      - CV008
      - CV009
      - CV012
      - CV015
      - CV016
figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Tide progressed from a 2015 London incorporation to a multi-market SME platform with more than 2 million
      company-reported members by May 2026.
    data:
      items:
        - date: '2015-05-18'
          label: Company incorporated
          detail: Tide Platform Ltd was incorporated in England and Wales with London as its headquarters.
          tone: neutral
          claimRefs:
            - CO003
        - date: 2017-01
          label: Tide app launched
          detail: The UK app launch began Tide's commercial operating history.
          tone: neutral
          claimRefs:
            - CO003
        - date: 2018-08
          label: Oliver Prill became CEO
          detail: Prill took over as CEO and subsequently led international expansion.
          tone: neutral
          claimRefs:
            - CO008
        - date: 2021-07
          label: $100M Series C
          detail: Apax Digital led a $100 million round reported at a $650 million post-money valuation.
          tone: positive
          claimRefs:
            - CO012
        - date: 2022-12
          label: India launch
          detail: Tide launched in India, later its fastest-growing member-acquisition market.
          tone: positive
          claimRefs:
            - CO005
        - date: 2022-11 to 2023
          label: Funding Options added
          detail: >-
            Multiples lists a November 2022 deal date, while Tide describes bringing the credit marketplace into the
            fold in 2023.
          tone: neutral
          claimRefs:
            - CO014
        - date: 2024-05
          label: Germany launch
          detail: Tide entered Germany as the first step in its mainland European expansion.
          tone: positive
          claimRefs:
            - CO014
        - date: '2024-10-22'
          label: Onfolk acquired
          detail: The payroll fintech acquisition extended Tide's integrated administrative toolkit.
          tone: positive
          claimRefs:
            - CO014
        - date: 2025-09
          label: $120M transaction at $1.5B
          detail: TPG led a primary-and-secondary financing with Apax participation, conferring unicorn status.
          tone: positive
          claimRefs:
            - CO009
            - CO010
        - date: 2025-09
          label: France launch
          detail: Tide entered France with credit intermediation as an initial growth product.
          tone: positive
          claimRefs:
            - CO014
        - date: '2026-05-27'
          label: Two million members reported
          detail: Tide reported 900,000 UK members and more than 1.1 million in India.
          tone: positive
          claimRefs:
            - CO005
            - CO006
            - CO007
        - date: '2026-06-30'
          label: SME investment account launched
          detail: Tide added an investment account powered by Seccl and Vanguard for its UK member base.
          tone: neutral
          claimRefs:
            - CO015
    approximationNotes: >-
      Dates use the source-reported day where available and month or range where the retained evidence is less precise;
      member and market-share milestones remain company claims.
