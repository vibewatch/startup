      - number: '1.4'
        title: Scale, footprint, and milestones
        blocks:
          - type: paragraph
            body: >-
              On 27 May 2026, Tide reported more than 2 million members globally, split between 900,000 UK SMEs and more
              than 1.1 million businesses in India. It also claimed 15% UK SME share, a majority of company revenue from
              the UK, and more than 2,800 employees. These are company-reported scale indicators rather than audited
              customer, active-account, or consolidated financial measures. Product and geographic expansion has
              continued through India, Germany, France, the Funding Options and Onfolk acquisitions, and a June 2026
              investment account powered by Seccl and Vanguard. A competitor-authored review highlights Tide's
              GBP-centered structure, lack of a multi-currency wallet, and absence of a traditional overdraft; that
              source is useful as adverse product context but is not an independent benchmark.
