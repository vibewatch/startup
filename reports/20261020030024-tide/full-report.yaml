      - number: '4.2'
        title: Traction and revenue quality
        blocks:
          - type: paragraph
            body: >-
              Public scale has advanced to more than two million members, split between 900,000 UK SMEs and more than
              1.1 million Indian SMEs as of May 2026. Tide says the UK still contributes most revenue, while an
              independent article reported that the UK business was profitable in September 2025. A market-data profile
              reports £177.2 million of 2024 turnover and 55% growth for the UK operating entity, but that is not a
              disclosed consolidated group revenue figure. Member count, market share, and credit facilitated are useful
              traction indicators; none supplies ARPU, paid conversion, churn, net retention, take rate, credit loss, or
              gross margin.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI009
              - CI014
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI009
              - CI015
              - CI016
      - number: '4.3'
        title: Cost structure and sales efficiency
        blocks:
          - type: paragraph
            body: >-
              Partner infrastructure is central to delivery economics. Mambu says Tide selected its cloud core,
              underpinned by AWS, to manage a growing ledger, lending portfolios, accounting, and reporting; the partner
              also says a revolving-credit product was built and launched in three months. This suggests lower build
              time and configurable capacity, but it also introduces platform, cloud, and partner costs that public
              sources do not quantify. Similarly, the retained evidence gives no CAC, payback period, sales cycle,
              support cost per member, credit-loss allocation, or channel revenue share. International FX limitations
              identified by a competitor review may create pricing pressure among cross-border SMEs.
            claimRefs:
              - CI012
              - CI013
              - CI016
      - number: '4.4'
        title: Capital adequacy and financing dependency
        blocks:
          - type: paragraph
            body: >-
              Tide raised $120 million in September 2025 at a $1.5 billion valuation, but the round combined primary and
              secondary capital and the exact split was not disclosed. Therefore the headline raise cannot be treated as
              cash added to the balance sheet. Reporting says the financing is intended to accelerate international
              expansion, product development, and AI, all of which can increase near-term capital requirements. Public
              evidence does not disclose cash on hand, burn, runway, primary proceeds, debt balances, covenants, or a
              next-round trigger. Capital adequacy remains an open diligence item rather than an inference from
              valuation or total funding headlines.
            claimRefs:
              - CI010
              - CI011
              - CI016
      - number: '4.5'
        title: Financial verdict
        blocks:
          - type: paragraph
            body: >-
              The available evidence supports a credible, increasingly diversified monetization architecture and
              meaningful UK scale, with reported UK profitability offering a positive signal. Revenue quality is
              nevertheless unproven at group level: Tide has not publicly bridged members to paid plans, transaction
              volume, net revenue, gross profit, or cash generation. Partner infrastructure and lending distribution can
              reduce direct build and balance sheet intensity, yet contractual costs, credit-risk allocation, and take
              rates are unavailable. The financial stance is therefore constructive on model breadth but cautious on
              margins and capital intensity pending consolidated accounts, cohort economics, and a cash-and-obligations
              bridge.
            claimRefs:
              - CI004
              - CI005
              - CI007
              - CI009
              - CI010
              - CI012
              - CI016
      - number: '4.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Multiple monetization surfaces
            body: >-
              Subscriptions, transaction charges, credit economics, and investment fees create several potential revenue
              pools rather than a single account fee.
            calloutType: strength
            claimRefs:
              - CI002
              - CI004
              - CI008
          - type: callout
            title: Funding raised is not cash available
            body: >-
              The $120 million round mixed primary and secondary investment, so the publicly announced amount cannot be
              used as a runway numerator.
            calloutType: risk
            claimRefs:
              - CI010
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: A business operating workspace, not a single account
        blocks:
          - type: paragraph
            body: >-
              Tide's customer proposition starts with a mobile and web business account, then layers invoicing,
              bookkeeping, expense controls, payment acceptance, accounting connections, savings, and access to credit
              around the same member relationship. That breadth moves the product from a narrow account interface toward
              an operating workspace for small firms. The 2026 payroll and dividends release is a concrete example of
              this strategy: Tide says directors can run wages, dividends, supporting documents, and transaction history
              in one workflow. The evidence supports a broad and increasingly connected surface, although much of the
              latest module map is company-issued and does not by itself establish usage depth, defect rates, or
              realized time savings.
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE001
            claimRefs:
