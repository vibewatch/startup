      - number: '5.2'
        title: Workflow value depends on integration and partner orchestration
        blocks:
          - type: paragraph
            body: >-
              The core workflow is digital onboarding followed by daily money movement and administrative automation.
              Third-party descriptions consistently place ClearBank and e-money partners underneath at least part of the
              account proposition, while Tide owns the member experience and connects accounting, payment, and lending
              services. Historical evidence also records API-based integrations with lenders and accounting packages; a
              specialist review describes REST APIs, webhooks, and a sandbox, but the assigned evidence does not include
              current first-party technical documentation that would verify those interfaces. This partner architecture
              can accelerate breadth, yet it introduces dependency management across regulated account rails, payment
              gateways, software integrations, and credit providers.
            claimRefs:
              - CE003
              - CE012
              - CE013
              - CE015
              - CE016
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE005
              - CE006
              - CE011
              - CE013
          - type: table
            tableRef: TE003
            claimRefs:
              - CE003
              - CE014
              - CE015
              - CE016
      - number: '5.3'
        title: Maturity is strongest in breadth and distribution
        blocks:
          - type: paragraph
            body: >-
              Product maturity is most visible in the number of deployed workflows and the scale at which Tide says it
              operates, rather than in public technical benchmarks. Current releases extend established account and
              accounting surfaces into payroll, director remuneration, insurance, tax tooling, credit intermediation,
              acquiring, and website creation. Tide also says it uses a proprietary SME dataset for regulated AI
              applications, but no assigned source quantifies model performance, human-review rates, or customer
              outcomes. Differentiation therefore appears to rest on connected SME administration and distribution
              rather than a publicly proven infrastructure advantage. Competing providers' reviews also identify
              international and multi-currency constraints, suggesting that breadth is uneven across use cases.
            claimRefs:
              - CE004
              - CE005
              - CE008
              - CE009
              - CE010
              - CE011
      - number: '5.4'
        title: Control intent is visible; control effectiveness is not
        blocks:
          - type: paragraph
            body: >-
              A Tide-authored quality-assurance job description shows an operating model that reviews customer
              interactions, complaints, escalations, policies, and regulatory outcomes across several markets. That is
              useful evidence of control intent and an internal feedback loop, but a recruitment post is not an
              independent audit of security, privacy, resilience, or Consumer Duty performance. The assigned pool
              contains no current status history, penetration-test summary, certification register, independent
              assurance report, recovery objectives, or incident-rate series. Diligence should therefore treat security
              and reliability as unresolved rather than infer safety from the absence of a cited incident. The
              partner-led account structure also makes responsibility mapping and end-to-end service-level evidence
              especially important.
            claimRefs:
              - CE003
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Technical assurance remains a material diligence gap
            body: >-
              Public product evidence shows connected workflows and internal QA intent, but not independently tested
              security controls, availability history, recovery performance, or integration-level service obligations.
            calloutType: risk
            claimRefs:
              - CE003
              - CE014
              - CE015
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Scale is broad, but the disclosed unit is membership
        blocks:
          - type: paragraph
            body: >-
              Tide's May 2026 release says the platform passed 2 million members worldwide, comprising 900,000 UK SMEs
              and more than 1.1 million SMEs in India. That is meaningful acquisition scale and suggests that India has
              become at least as important as the UK by registered members. The segment is nevertheless broad: retained
              sources describe sole traders, freelancers, micro-enterprises, and small businesses using accounts, cards,
              invoicing, accounting integrations, expense tools, registration, payments, and credit access. The company
              also reports onboarding more than 200,000 women-led UK businesses. These figures should not be read as
              active customers, primary-account relationships, paying subscribers, or retained cohorts because those
              denominators are not disclosed.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
          - type: table
            tableRef: TU001
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU005
      - number: '6.2'
        title: Acquisition is visible; production outcomes are not
        blocks:
          - type: paragraph
            body: >-
              Public milestones show a steep acquisition trajectory from more than 30,000 members in 2018 to more than 2
              million in May 2026. Current third-party indicators are directionally positive: TheBanks.eu scored Tide
              4.37 overall and 4.36 for customer sentiment in September 2026, while WorldFirst cited a 4.4 Trustpilot
              score from more than 35,000 reviews. The proof remains weaker than the headline scale, however. The
              assigned evidence contains aggregate cohorts and editorial product reviews, not a named customer's
              production deployment, quantified business outcome, renewal, or expansion history. The named-customer
              exhibit therefore records the best available cohort-level proof and labels the missing production and
              outcome evidence rather than treating member totals as customer references.
            claimRefs:
              - CU001
              - CU006
              - CU007
              - CU012
              - CU015
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU006
              - CU007
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU015
      - number: '6.3'
        title: Product breadth creates expansion paths, but durability is unmeasured
        blocks:
          - type: paragraph
            body: >-
              Tide can expand an SME relationship from onboarding and a core account into invoicing, accounting, expense
              management, payroll, payments, savings, and credit intermediation. The customer journey is therefore
              economically plausible even though public evidence does not quantify conversion between stages. Product
              fit is also uneven. A 2026 competitor review describes Tide as strong for domestic GBP banking but limited
              by the lack of a multi-currency wallet, plan-dependent foreign-exchange charges, and no traditional
              overdraft; an older independent review also flagged cash, cheque, international-transfer, and
              branch-service constraints. Most importantly, no retained source reports NRR, GRR, churn, renewal, cohort
              activity, contract length, top-customer exposure, or channel concentration. Scale supports continued
              diligence, but durability and monetisation cannot be inferred from registrations.
            claimRefs:
              - CU008
              - CU009
              - CU010
              - CU011
              - CU013
              - CU014
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU010
              - CU013
              - CU016
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Acquisition scale spans two large SME markets
            body: >-
              Tide's reported membership now exceeds 2 million, with both the UK and India contributing large cohorts
              rather than growth depending on one market.
            calloutType: strength
            claimRefs:
              - CU001
              - CU002
              - CU003
          - type: callout
            title: Membership is not retention evidence
            body: >-
              Without active-use, churn, NRR, paid-plan, and cohort data, public sources cannot establish whether
              acquisition converts into durable, expanding relationships.
            calloutType: risk
            claimRefs:
              - CU014
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Priority risk frame
        blocks:
          - type: paragraph
            body: >-
              The highest residual exposure is the regulated-partner operating model. Tide's own terms place business
              accounts and savings with ClearBank or another banking provider, while an independent competitor review
              also describes a split between ClearBank bank accounts and PPS e-money services. This structure can
              accelerate product breadth, but it creates correlated continuity, compliance, and contractual dependencies
              across the customer journey. The risk is amplified by scale: Tide said it crossed 2 million members in May
              2026, with more than 1.1 million in India and 900,000 in the UK. The heatmap therefore treats partner
              continuity and cross-market conduct as high-residual risks even though the assigned evidence does not
              establish a breach, outage, enforcement action, or loss event. The investment implication is to condition
              conviction on primary regulator records, incident metrics, and counterparty concentration data rather than
              infer safety from the absence of a reported event.
            claimRefs:
              - CR001
              - CR002
              - CR006
              - CR007
              - CR014
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR004
              - CR006
              - CR008
              - CR010
              - CR012
              - CR014
              - CR016
      - number: '7.2'
        title: Regulatory, legal, and conduct exposure
        blocks:
          - type: paragraph
            body: >-
              Tide's legal perimeter is layered. Its membership terms describe products offered with partners and
              support provided on behalf of ClearBank and Adyen in specified cases; the same terms permit suspension
              when fraud, criminal use, regulatory breach, or restricted-country exposure is suspected. Those provisions
              are ordinary controls, not proof of misconduct, but they show that member access can be affected by
              compliance decisions spanning Tide and external institutions. A company-authored quality-assurance job
              post points to Consumer Duty, complaints, escalations, and regulatory monitoring across the UK, India, and
              Germany, which is evidence of control intent rather than control effectiveness. The assigned pool contains
              no regulator decision, licence register extract, court docket, or jurisdiction-by-jurisdiction permissions
              map. Legal and regulatory status therefore remains only partially verified, and the register below keeps
              that gap explicit.
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR007
              - CR008
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
              - CR006
              - CR007
              - CR008
              - CR016
      - number: '7.3'
        title: Operational, quality, and security exposure
        blocks:
          - type: paragraph
            body: >-
              Service continuity and customer remediation deserve direct diligence because the platform is digital-first
              and operationally distributed. Tide's terms state that access is supplied on an as-available basis and
              disclaim a warranty of uninterrupted or error-free service; this is contractual allocation of risk, not
              evidence that an outage occurred. The QA role shows that Tide monitors complaints, escalations, recurring
              issues, and agent interactions across several countries, while the company LinkedIn page identifies a
              broad office and technology footprint. Independent reviews add product-friction signals: limited telephone
              support, cash-handling costs, a GBP-centred account structure, and no multi-currency wallet. These
              constraints may increase support load and customer attrition in complex cases, but the pool provides no
              incident frequency, mean-time-to-recovery, fraud loss, complaint uphold rate, or security audit result.
              Those metrics are required before assigning probability from observed performance.
            claimRefs:
              - CR004
              - CR006
              - CR008
              - CR009
              - CR010
              - CR011
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR006
              - CR008
              - CR009
              - CR010
              - CR011
              - CR016
      - number: '7.4'
        title: Partner, financial-model, and execution exposure
        blocks:
          - type: paragraph
            body: >-
              Tide's breadth depends on banking, payment, lending, accounting, and data counterparties. Sacra
              specifically identifies dependence on ClearBank and on third-party platforms and APIs; Tide's terms
              separately state that third-party services include providers such as ClearBank, Adyen, and Sage. Capital
              reduces near-term financing pressure only imperfectly: FinTech Magazine reported a US$120 million
              transaction combining primary and secondary investment, so the headline amount cannot be treated as cash
              added to Tide, and the same report says a TPG representative joined the board. The kill criteria are
              measurable: unresolved material partner concentration, repeated severity-one service events, regulator
              restrictions on core permissions, sustained complaint deterioration, or inability to reconcile primary
              cash proceeds with group burn and runway should pause investment. Mitigation requires audited counterparty
              inventories, exit and portability tests, service-level performance, board-rights disclosure, and a
              consolidated liquidity bridge.
            claimRefs:
              - CR001
              - CR003
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Evidence-sensitive kill criteria
            body: >-
              Pause investment if Tide cannot evidence tested core-provider portability, material-incident and complaint
              performance, jurisdiction-level permissions, partner concentration, and a bridge from primary financing
              proceeds to consolidated burn and runway. The current pool establishes exposure pathways, not event
              frequency.
            calloutType: risk
            claimRefs:
              - CR001
              - CR004
              - CR006
              - CR012
              - CR014
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Decision and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The appropriate public-evidence decision is track, with high underwriting risk and a valuation stance of
              full pending verification. Tide and two third-party datasets place the September 2025 financing value at
              $1.5 billion, while Multiples reports a $225 million metric and derives a 6.7x multiple. That denominator
              is not decision-grade: the publisher says round-linked figures may be revenue or ARR and may represent
              run-rate or LTM values. Independent trackers also disagree materially on cumulative funding. Entry should
              therefore be conditioned on audited consolidated revenue, margin and cash conversion, a fully diluted cap
              table, and the financing waterfall. Without those items, the financing mark is evidence of investor
              appetite, not proof that a new investor can earn a target return at the same or a higher price.
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV007
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV007
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
              - CV013
              - CV014
              - CV016
      - number: '8.2'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis is scale plus product breadth. Tide says it has crossed two million global members, including
              900,000 in the UK and more than 1.1 million in India, and claims a 15% UK share. Its regulated-partner
              model also lets it combine accounts, administration and financing access without operating as a bank. The
              anti-thesis is that scale does not establish monetisation quality or durable unit economics. Tide's Google
              Play copy describes more than two million UK users, which conflicts with the company's own global and UK
              breakdown. A competitor-authored review also identifies a GBP-only structure and no multi-currency wallet
              as weaknesses for internationally active SMEs. Those signals make member activity, retention, geographic
              revenue mix and cross-border economics essential diligence rather than optional upside analysis.
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.3'
        title: Scenarios and comparable context
        blocks:
          - type: paragraph
            body: >-
              Scenario valuation should remain relative to the verified $1.5 billion financing mark, not be converted
              into a false point estimate. A bull case requires the reported member scale to translate into
              independently verified recurring revenue, attractive retention and profitable international expansion;
              only then could a premium be considered. The base case treats $1.5 billion as a negotiating ceiling until
              the $225 million denominator and 6.7x calculation are reconciled to audited group accounts. The bear case
              assumes weaker monetisation, costly internationalisation or adverse preference terms and therefore
              requires a discount or no investment. Historical rounds show rapid mark expansion from undisclosed
              valuation in 2017 to reported billion-dollar discussions in 2025, but public and private comparables in
              the retained dataset use mixed business models and metric definitions, so they are context rather than a
              defensible pricing formula.
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV007
              - CV008
              - CV009
              - CV012
              - CV015
              - CV016
      - number: '8.4'
        title: Final diligence and thesis-breaks
        blocks:
          - type: paragraph
            body: >-
              Final underwriting should request the signed September 2025 financing documents, primary-versus-secondary
              allocation, liquidation preferences, anti-dilution rights, option-pool treatment, debt terms, audited
              consolidated accounts and a bridge from members to active primary accounts, revenue and contribution
              margin by geography. It should also reconcile the $181 million and $312 million funding totals and the
              contradictory member geography claims. Thesis-break triggers are an inability to reconcile the financing
              waterfall, evidence that the cited revenue metric is ARR or run-rate rather than audited revenue,
              deteriorating retention, continuing losses hidden by entity-level reporting, or international growth that
              does not generate positive unit economics. Exit readiness remains unproven because the available evidence
              supplies a private financing mark rather than an observable public-market price.
            claimRefs:
              - CV002
              - CV005
              - CV006
              - CV007
              - CV010
              - CV014
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price conviction requires private evidence
            body: >-
              The $1.5 billion financing mark is observable, but a buy case is not: reconcile the operating denominator
              and capital structure before setting entry price, target return, hold period or exit assumptions.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV007
              - CV015
              - CV016
