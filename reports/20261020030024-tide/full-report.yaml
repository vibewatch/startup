  - id: FP001
    title: Competitive positioning by currency reach and SME-admin breadth
    type: quadrant
    summary: >-
      Evidence-backed ordinal scoring places Tide high on integrated SME administration but below currency specialists
      on international capability.
    data:
      xAxis:
        label: International and currency capability
        min: 1
        max: 5
        lowLabel: Domestic / GBP centered
        highLabel: Multi-currency specialist
        description: Analyst ordinal score from the assigned comparison evidence
      yAxis:
        label: Integrated SME-admin breadth
        min: 1
        max: 5
        lowLabel: Account or point solution
        highLabel: Broad connected workflow
        description: Analyst ordinal score from described invoicing, accounting, expense, payroll, and registration tools
      points:
        - label: Tide
          x: 2
          'y': 5
          detail: Broad admin suite; GBP-centered international proposition in competitor evidence.
        - label: Starling Business
          x: 2
          'y': 3
          detail: Core bank and accounting integrations; international capability described as limited.
        - label: Revolut Business
          x: 5
          'y': 3
          detail: Multi-currency and FX strength; narrower admin evidence than Tide.
        - label: Allica Bank
          x: 2
          'y': 2
          detail: Relationship, savings, and lending focus; admin breadth not established.
        - label: WorldFirst
          x: 5
          'y': 1
          detail: Currency and cross-border point solution positioned to complement Tide.
        - label: High-street status quo
          x: 3
          'y': 1
          detail: Broad traditional banking but weaker integrated admin evidence.
    approximationNotes: >-
      Scores are analyst-assigned ordinal positions from qualitative source descriptions, not measured benchmarks,
      market ranks, or value-proportional distances; unsupported dimensions are scored conservatively and should be
      validated with current product testing.
    claimRefs:
      - CP006
      - CP007
      - CP015
      - CP016
  - id: FI001
    title: Member activity to revenue and gross-profit evidence bridge
    type: flow
    summary: >-
      Public evidence identifies monetization routes but does not disclose the conversion rates or costs needed to
      bridge members to gross profit.
    data:
      nodes:
        - id: member-base
          label: Global member base
          detail: More than 2 million members; activity and paid status are not disclosed.
        - id: account-and-admin-use
          label: Account and administration use
          detail: Accounts, invoicing, accounting, expense, payroll, and registration tools.
        - id: paid-plan-conversion
          label: Paid plan conversion
          detail: Free, Smart, Pro, and Max tiers; conversion and churn are unavailable.
        - id: transaction-monetization
