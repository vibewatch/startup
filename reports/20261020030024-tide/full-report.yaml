      - number: '2.3'
        title: Buyers, users, payers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The economic buyer is usually the owner-manager or finance lead, while employees, bookkeepers, and
              accountants become users of payment, expense, payroll, and reconciliation workflows. The payer can be the
              business through subscription and transaction fees, or an adjacent provider through partner economics; the
              assigned sources do not disclose that split. The clearest adoption path is a low-friction account or
              registration entry point followed by additional administrative, payment, credit, savings, or investment
              products. Tide's investment account illustrates this pattern: an existing business profile can be reused
              for onboarding, but P1, Seccl, and Vanguard supply regulated operation, custody, infrastructure, and
              funds. Internationally trading SMEs have a different path because a GBP-centred account without a
              multi-currency wallet can require an additional provider, weakening Tide's ability to own the full
              workflow.
            claimRefs:
              - CM001
              - CM008
              - CM009
              - CM010
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM003
              - CM008
              - CM009
              - CM010
              - CM016
      - number: '2.4'
        title: Growth drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Adoption is driven by the large number of small businesses, mobile onboarding, a free entry tier, and the
              convenience of connecting banking with recurring administrative tasks. Reported growth from 1.5 million
              members in 2025 to more than 2 million in May 2026 is directionally consistent with continued acquisition,
              but the sources do not disclose activity, retention, paid-plan conversion, ARPU, or acquisition cost.
              Constraints include regulated-partner dependence, capital-at-risk disclosures for investments,
              foreign-exchange and currency limitations, and uncertain localisation economics across India and Europe.
              These gaps matter to valuation because member counts can overstate monetisable market share when
              definitions, activity thresholds, and geography differ. A defensible investment case therefore needs
              cohort and budget evidence, an independently sourced spend model, and a revenue bridge by product and
              market before treating the population lenses as TAM, SAM, or SOM.
            claimRefs:
              - CM004
              - CM007
              - CM009
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Population is not monetisable market size
            body: >-
              The retained evidence does not disclose active-member definitions, paid conversion, product-level revenue,
              buyer budgets, or serviceable digital adoption. Population and member counts therefore cannot support a
              precise revenue TAM, SAM, or SOM.
            calloutType: risk
            claimRefs:
              - CM007
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              A UK SME can solve Tide's core job through several routes: mobile-first banks such as Starling, e-money
              and cross-border specialists such as Revolut Business and WorldFirst, established-SME challengers such as
              Allica, high-street banks, or an existing bank paired with separate invoicing and accounting software. The
              assigned comparison evidence places Tide toward the integrated-admin end of this set, while Revolut and
              WorldFirst emphasize international currency handling and Allica emphasizes savings, lending, and
              relationship banking. This makes the competitive boundary wider than "business current accounts." Internal
              assembly remains a credible substitute because the major components can be bought separately, although the
              assigned evidence does not quantify the integration or operating cost of doing so.
            claimRefs:
              - CP006
              - CP007
              - CP016
          - type: table
            tableRef: TP001
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
              - CP009
              - CP016
      - number: '3.2'
        title: Product breadth and trust architecture
        blocks:
          - type: paragraph
            body: >-
              Tide's differentiation is the connected workflow around the account rather than ownership of a bank
              licence. Its official disclosures say Tide operates the app but is not a bank; current and savings
              accounts are powered by ClearBank, while some e-money accounts use PrePay Technologies and safeguarding.
              The same disclosures and company-issued app listing describe invoicing, accounting integrations, expense
              controls, savings, payments, and finance access. This partner architecture accelerates breadth, but it
              also means trust and protection depend on the member's specific account structure. Buyers therefore need
              to distinguish eligible ClearBank deposits from safeguarded e-money instead of treating every Tide balance
              as economically identical.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP012
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP007
              - CP009
              - CP012
      - number: '3.3'
        title: Pricing, distribution, and switching
        blocks:
          - type: paragraph
            body: >-
              Pricing evidence is directionally useful but not clean enough for an underwritten apples-to-apples
              comparison. A 2026 competitor-authored review reports four Tide plans from free to GBP69.99 per month and
              highlights plan-dependent foreign-exchange charges; an older 2023 review reports lower paid tiers and
              obsolete international limitations. Another October 2026 article contradicts itself on whether support is
              available continuously. These conflicts make the current official rate card and service terms a diligence
              item. Switching costs also appear limited: a business can keep Tide for GBP operations while adding a
              specialist currency account, so distribution and convenience may drive retention more than contractual
              lock-in.
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP011
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP011
              - CP013
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Tide's strongest moat evidence is scale combined with product breadth. The company reports more than two
              million members, including 900,000 UK SMEs, and presents a broad suite from registration through payroll,
              payments, credit, and website tools. That footprint can improve cross-sell and data-driven product
              development, but the evidence does not establish cohort retention, primary-account share, or superior unit
              economics. Comparable rivals already offer fast onboarding and accounting feeds, full banks can
              differentiate on deposit protection and lending, and currency specialists can sit alongside Tide without
              forcing a full switch. The result is a useful convenience moat, not yet proof of proprietary or
              irreversible lock-in. Comparable competitor funding, customer scale, and product adoption remain
              unavailable in the assigned pool.
            claimRefs:
              - CP004
              - CP005
              - CP013
              - CP014
              - CP015
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP006
              - CP007
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Breadth is the clearest differentiation
            body: >-
              Tide combines the account with multiple administrative workflows, creating more daily touchpoints than a
              current-account-only proposition.
            calloutType: strength
            claimRefs:
              - CP005
              - CP012
              - CP014
          - type: callout
            title: Multi-homing weakens lock-in
            body: >-
              A customer can retain Tide for domestic operations while adding a currency specialist, limiting the
              switching barrier created by the account itself.
            calloutType: risk
            claimRefs:
              - CP009
              - CP015
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing
        blocks:
          - type: paragraph
            body: >-
              Tide is a regulated financial platform rather than a bank, combining ClearBank-powered accounts and
              e-money arrangements with administrative software and partner-enabled products. The clearest monetization
              evidence is a four-tier UK plan ladder, transaction and international-payment charges, credit economics,
              and a newly reported investment-account platform fee. Third-party reporting describes the overall model as
              transaction fees, subscriptions, and credit margins. This mix can diversify revenue, but public list
              prices do not reveal realized pricing, discounts, attach rates, revenue recognition, or the contribution
              of each stream. The Free tier also means member growth is not equivalent to paying-customer or revenue
              growth.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI008
              - CI013
              - CI014
          - type: table
