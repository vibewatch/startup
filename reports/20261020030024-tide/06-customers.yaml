schemaVersion: "report-v2"
artifact: customers
slug: tide
runDate: 2026-10-20
company:
  name: Tide
chapter:
  number: 6
  title: Customers
  summary: >-
    Tide reports more than 2 million members, split between 900,000 UK SMEs and
    more than 1.1 million Indian SMEs, but the retained evidence establishes
    registrations rather than active-primary-account usage, retention, or
    customer-level outcomes. Independent and competitor reviews indicate strong
    fit for digital-first domestic SMEs while exposing weaker fit for cash-heavy
    and internationally complex businesses.
sections:
  - id: customer-footprint
    title: Scale is broad, but the disclosed unit is membership
    body: >-
      Tide's May 2026 release says the platform passed 2 million members
      worldwide, comprising 900,000 UK SMEs and more than 1.1 million SMEs in
      India. That is meaningful acquisition scale and suggests that India has
      become at least as important as the UK by registered members. The segment
      is nevertheless broad: retained sources describe sole traders,
      freelancers, micro-enterprises, and small businesses using accounts,
      cards, invoicing, accounting integrations, expense tools, registration,
      payments, and credit access. The company also reports onboarding more
      than 200,000 women-led UK businesses. These figures should not be read as
      active customers, primary-account relationships, paying subscribers, or
      retained cohorts because those denominators are not disclosed.
    claimRefs: [CU001, CU002, CU003, CU004, CU005]
    tableRefs: [TU001]
  - id: adoption-proof
    title: Acquisition is visible; production outcomes are not
    body: >-
      Public milestones show a steep acquisition trajectory from more than
      30,000 members in 2018 to more than 2 million in May 2026. Current
      third-party indicators are directionally positive: TheBanks.eu scored
      Tide 4.37 overall and 4.36 for customer sentiment in September 2026,
      while WorldFirst cited a 4.4 Trustpilot score from more than 35,000
      reviews. The proof remains weaker than the headline scale, however.
      The assigned evidence contains aggregate cohorts and editorial product
      reviews, not a named customer's production deployment, quantified
      business outcome, renewal, or expansion history. The named-customer
      exhibit therefore records the best available cohort-level proof and
      labels the missing production and outcome evidence rather than treating
      member totals as customer references.
    claimRefs: [CU001, CU006, CU007, CU012, CU015]
    tableRefs: [TU002, TU003]
  - id: durability-and-expansion
    title: Product breadth creates expansion paths, but durability is unmeasured
    body: >-
      Tide can expand an SME relationship from onboarding and a core account
      into invoicing, accounting, expense management, payroll, payments,
      savings, and credit intermediation. The customer journey is therefore
      economically plausible even though public evidence does not quantify
      conversion between stages. Product fit is also uneven. A 2026 competitor
      review describes Tide as strong for domestic GBP banking but limited by
      the lack of a multi-currency wallet, plan-dependent foreign-exchange
      charges, and no traditional overdraft; an older independent review also
      flagged cash, cheque, international-transfer, and branch-service
      constraints. Most importantly, no retained source reports NRR, GRR,
      churn, renewal, cohort activity, contract length, top-customer exposure,
      or channel concentration. Scale supports continued diligence, but
      durability and monetisation cannot be inferred from registrations.
    claimRefs: [CU008, CU009, CU010, CU011, CU013, CU014, CU016]
    figureRefs: [FU001]
tables:
  - id: TU001
    title: Customer segmentation and disclosed scale
    columns:
      - Segment
      - Buyer / payer
      - Users and use case
      - Disclosed scale
      - Strategic value
      - Evidence gap
    rows:
      - - UK SMEs, sole traders, and freelancers
        - Business owner or company
        - Owners, employees, and accountants using GBP accounts, cards, invoicing, and admin tools
        - "900,000 UK SME members; Tide-reported 15% market share in May 2026"
        - Home market and company-reported majority of revenue
        - Active-primary-account share, paid-plan mix, ARPU, and retention are undisclosed
      - - Indian MSMEs, especially underserved cities
        - Owner-operated MSME
        - Owners using registration, payments, and credit-access services
        - "More than 1.1 million members in May 2026"
        - Largest disclosed member cohort and fastest reported acquisition market
        - Active usage, revenue contribution, cohort retention, and city mix are undisclosed
      - - German and French small businesses
        - SME owner or company
        - Credit intermediation first, with broader platform services planned over time
        - No market-level member count in the retained evidence
        - International expansion option beyond the UK and India
        - Customer count, conversion, repeat use, and unit economics are undisclosed
      - - Women-led businesses in the UK and India
        - Women business owners
        - General Tide platform plus targeted support initiatives
        - "More than 200,000 women-led UK businesses onboarded; 500,000 India target by end-2027"
        - Explicit acquisition focus within the broader SME base
        - Active status, product adoption, outcomes, and retention are undisclosed
    notes: >-
      Scale figures and segment descriptions are company claims reported as of
      27 May 2026; "member" is not shown to equal an active, paying, or primary-account customer.
    claimRefs: [CU002, CU003, CU004, CU005]
  - id: TU002
    title: Customer growth and adoption trajectory
    columns:
      - Date
      - Metric
      - Reported value
      - Source
      - Confidence
      - Implication
      - Missing denominator or qualification
    rows:
      - - "2018-03"
        - Member base
        - "More than 30,000 businesses"
        - FinTech Futures, attributing the figure to Tide
        - Medium
        - Establishes an early acquisition baseline
        - No active-use, revenue, or retention denominator
      - - "2018-03"
        - Share of newly opened UK business current accounts
        - "1 in 12 within a year, according to Tide"
        - FinTech Futures
        - Medium
        - Indicates early channel momentum
        - Flow share is not installed-base market share
      - - "2026-05"
        - Global members
        - "More than 2 million"
        - Tide
        - High
        - Confirms large reported acquisition scale
        - Registration, activity, paying status, and duplication rules are not disclosed
      - - "2026-09"
        - TheBanks.eu evaluation
        - "4.37 overall; 4.36 customer sentiment; 3.43 customer support"
        - TheBanks.eu
        - Medium
        - Directionally positive external product and sentiment signal
        - Proprietary methodology and no cohort retention linkage
      - - "2026"
        - Trustpilot rating cited by WorldFirst
        - "4.4/5 from more than 35,000 reviews"
        - WorldFirst
        - Medium
        - Broad review volume supports customer-awareness and satisfaction signal
        - Competitor-authored review; not a retention or revenue metric
    notes: >-
      Metrics use different populations and dates and must not be treated as one
      conversion funnel; all values retain the issuer's unit and stated period.
    claimRefs: [CU001, CU006, CU007, CU012]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer / cohort
      - Segment
      - Deployment or use case
      - Production vs. pilot
      - Reported outcome
      - Limitation
    rows:
      - - No named entity; UK aggregate cohort
        - UK SMEs
        - Business accounts and connected administration tools
        - Not disclosed at named-customer level
        - "900,000 reported members and 15% company-reported market share"
        - No named deployment, usage depth, renewal, or customer-verified outcome
      - - No named entity; India aggregate cohort
        - Indian MSMEs
        - Registration, payments, and credit access
        - Not disclosed at named-customer level
        - "More than 1.1 million reported members"
        - No named deployment, active-use rate, renewal, or customer-verified outcome
      - - No named entity; women-led UK cohort
        - Women-led small businesses
        - General platform onboarding and targeted support
        - Not disclosed at named-customer level
        - "More than 200,000 reported onboardings"
        - Onboarding does not establish production use, retention, or business impact
    notes: >-
      This is a partial enumeration of aggregate cohorts in the assigned evidence,
      not a list of named customer references; no customer-authored production case was retained.
    enumerationScope:
      coverage: partial
      basis: >-
        Assigned prefetched evidence reviewed through 2026-10-20; the pool
        contained aggregate cohorts but no named production customer case study.
    claimRefs: [CU001, CU002, CU003, CU004, CU015]
figures:
  - id: FU001
    title: Customer journey and potential expansion surfaces
    type: journey-map
    summary: >-
      Tide can widen a relationship from digital onboarding into operating tools
      and finance, but no conversion or retention rates are publicly disclosed.
    data:
      nodes:
        - id: discover
          label: Discover
          name: Discover
          detail: SME evaluates a free or paid Tide plan against domestic banking needs.
          value: Segment fit
          valueNote: Strongest for digital-first, UK-focused SMEs
          touchpoints: [Pricing, product review, app]
        - id: apply
          label: Apply
          name: Apply
          detail: Owner submits business and identity information through a digital flow.
          value: Minutes
          valueNote: Company-stated onboarding can be rapid, subject to checks
          touchpoints: [Mobile application, identity checks]
        - id: activate
          label: Activate account
          name: Activate account
          detail: Customer receives a ClearBank-powered bank account or an e-money account structure, depending on product.
          value: Regulated partner model
          valueNote: Protection differs by account structure and eligibility
          touchpoints: [Account, Mastercard, payments]
        - id: operate
          label: Run the business
          name: Run the business
          detail: Customer uses invoicing, accounting integrations, cards, and expense tools.
          value: Daily workflow
          valueNote: Public evidence does not disclose active-feature penetration
          touchpoints: [Invoices, accounting, expense management]
        - id: finance
          label: Access finance
          name: Access finance
          detail: Eligible customers can seek credit through Tide and its lending marketplace.
          value: "Over £1.75bn"
          valueNote: Company-reported UK credit accessed; not Tide balance-sheet lending
          touchpoints: [Credit marketplace, partner lenders]
        - id: expand
          label: Expand relationship
          name: Expand relationship
          detail: Paid plans and adjacent payroll, savings, payments, and insurance can deepen product use.
          value: Undisclosed conversion
          valueNote: NRR, cross-sell rates, and cohort expansion are not public
          touchpoints: [Subscription, payroll, savings, insurance]
    approximationNotes: >-
      Ordered stages describe plausible product touchpoints, not a measured funnel;
      no stage conversion, active-use, retention, or expansion rates were disclosed.
    claimRefs: [CU010, CU013, CU016]
callouts:
  - calloutType: strength
    title: Acquisition scale spans two large SME markets
    body: >-
      Tide's reported membership now exceeds 2 million, with both the UK and
      India contributing large cohorts rather than growth depending on one market.
    claimRefs: [CU001, CU002, CU003]
  - calloutType: risk
    title: Membership is not retention evidence
    body: >-
      Without active-use, churn, NRR, paid-plan, and cohort data, public sources
      cannot establish whether acquisition converts into durable, expanding relationships.
    claimRefs: [CU014, CU015]
