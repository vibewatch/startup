    - 已签署的 2025 年融资文件、新股与老股交易的分配、完全摊薄股权结构表、清算优先权、投资者权利，以及逐轮融资对账。
    - 当前监管许可、合作伙伴集中度、服务水平表现、事故记录、欺诈损失、投诉结果，以及服务商可迁移性证据。
