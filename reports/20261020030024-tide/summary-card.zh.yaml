  topStrengths:
    - 公司披露的英国和印度会员总数超过 200 万，其中包括 90 万家英国中小企业。
    - 产品覆盖账户、支付、会计、薪资、费用管理、储蓄、信贷，以及其他中小企业高频工作流。
    - 订阅、交易、信贷和合作伙伴带来的多种收费场景，使其变现潜力不止于单一活期账户。
  topRisks:
