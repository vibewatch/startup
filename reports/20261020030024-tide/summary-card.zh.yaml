    - 核心账户、电子货币、支付、贷款和集成工作流高度依赖受监管合作伙伴及服务连续性。
    - 会员总数尚未与活跃主账户、付费转化率、流失率、NRR 或经独立验证的客户结果对账。
    - 融资总额相互冲突，新股与老股交易的分配、稀释、优先权、投资者权利和退出经济效益仍未披露。
    - 产品过度依赖英镑，加之国际业务贡献利润率不确定，可能限制扩张质量。
  unresolvedGaps:
    - 经审计的合并收入、毛利率、现金转换、现金、烧钱速度、债务、契约和现金跑道。
