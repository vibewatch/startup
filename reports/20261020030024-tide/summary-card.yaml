  topStrengths:
    - Company-reported distribution exceeds two million members across the UK and India, including 900,000 UK SMEs.
    - >-
      The product spans accounts, payments, accounting, payroll, expense management, savings, credit access, and other
      recurring SME workflows.
    - >-
      Multiple subscription, transaction, credit, and partner-enabled fee surfaces create broader monetisation potential
      than a current account alone.
  topRisks:
    - >-
      Consolidated revenue, gross margin, cash, burn, runway, debt obligations, and geography-level unit economics are
      not publicly established.
    - >-
      Core account, e-money, payments, lending, and integration workflows create material regulated-partner and
      service-continuity dependencies.
    - >-
      Member totals are not reconciled to active primary accounts, paid conversion, churn, NRR, or independently
      verified customer outcomes.
    - >-
      Financing totals conflict, while primary-secondary allocation, dilution, preferences, investor rights, and exit
      economics remain undisclosed.
    - GBP-centric product limitations and uncertain international contribution margins may constrain expansion quality.
  unresolvedGaps:
    - Audited consolidated revenue, gross margin, cash conversion, cash, burn, debt, covenants, and runway.
    - >-
      Active-account definitions, paid conversion, ARPU, churn, NRR, cohort retention, and customer concentration by
      geography and product.
    - >-
      Signed 2025 financing documents, primary-secondary allocation, fully diluted cap table, liquidation preferences,
      investor rights, and a round-by-round funding reconciliation.
    - >-
      Current regulator permissions, partner concentration, service-level performance, incident history, fraud losses,
      complaint outcomes, and provider-portability evidence.
    - Named production customers with quantified outcomes, renewals, and multi-product expansion evidence.
