      - number: '4.2'
        title: 牵引力与收入质量
        blocks:
          - type: paragraph
            body: >-
              截至 May 2026，Tide 公开披露的会员数已超过 two million，其中英国 SME 会员 900,000、印度 SME 会员超过 1.1 million。Tide
              表示英国仍贡献大部分收入；一篇独立文章则称英国业务在 September 2025 实现盈利。一份市场数据档案披露英国运营实体 2024 年营业额为 £177.2 million、增长
              55%，但这不是公开披露的合并集团收入。会员数量、市场份额和促成的信贷规模都是有用的牵引力指标，但都不能提供 ARPU、付费转化、流失率、净留存率、take rate、信贷损失或毛利率。
