  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价
        blocks:
          - type: paragraph
            body: >-
              Tide 是受监管的金融平台而非银行，将 ClearBank
              支持的账户和电子货币安排与管理软件及合作伙伴产品结合起来。最清晰的变现证据包括英国四档方案、交易和国际支付收费、信贷经济性，以及新近披露的投资账户平台费。第三方报道将整体模式描述为交易费、订阅费和信贷利差。这一组合可以分散收入，但公开标价无法说明实际成交价、折扣、附加率、收入确认或各收入流的贡献。免费方案也意味着会员增长不等于付费客户或收入增长。
