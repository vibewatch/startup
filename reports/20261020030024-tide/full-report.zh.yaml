  - id: FP001
    title: 按货币覆盖和中小企业管理广度定位竞争格局
    type: quadrant
    summary: 有证据支持的序数评分显示，Tide 在一体化中小企业管理上的排名较高，但国际能力低于货币专业服务商。
    data:
      xAxis:
        label: 国际与货币能力
        min: 1
        max: 5
        lowLabel: Domestic / GBP centered
        highLabel: Multi-currency specialist
        description: Analyst ordinal score from the assigned comparison evidence
      yAxis:
        label: 一体化中小企业管理广度
        min: 1
        max: 5
        lowLabel: Account or point solution
        highLabel: Broad connected workflow
        description: Analyst ordinal score from described invoicing, accounting, expense, payroll, and registration tools
      points:
        - label: Tide
          x: 2
          'y': 5
          detail: 管理套件广泛；竞争对手证据显示其国际方案以英镑为中心。
        - label: Starling Business
          x: 2
          'y': 3
          detail: 核心银行和会计集成；国际能力被描述为有限。
        - label: Revolut Business
          x: 5
          'y': 3
          detail: 多币种和外汇能力强；管理工具证据不如 Tide 广泛。
        - label: Allica Bank
          x: 2
          'y': 2
          detail: 聚焦关系型银行、储蓄和借贷；管理广度尚未确立。
        - label: WorldFirst
          x: 5
          'y': 1
          detail: 货币与跨境单点解决方案，定位为 Tide 的补充。
        - label: 传统大型银行现状
          x: 3
          'y': 1
          detail: 传统银行业务广泛，但一体化管理证据较弱。
    approximationNotes: 评分是分析师根据定性来源描述赋予的序数位置，不是实测基准、市场排名或按价值成比例的距离；未获支持的维度采用保守评分，应通过当前产品测试验证。
    claimRefs:
      - CP006
      - CP007
      - CP015
      - CP016
  - id: FI001
    title: 从会员活跃到收入和毛利的证据桥接
    type: flow
    summary: 公开证据识别出了变现路径，但没有披露把会员数桥接到毛利所需的转化率或成本。
    data:
      nodes:
        - id: member-base
          label: 全球会员基础
          detail: 会员超过 200 万；活跃情况和付费状态未披露。
        - id: account-and-admin-use
          label: 账户与管理工具使用
          detail: 账户、开票、会计、费用、工资发放和注册工具。
        - id: paid-plan-conversion
          label: 付费方案转化
          detail: Free、Smart、Pro 和 Max 等级；转化和流失数据不可得。
        - id: transaction-monetization
          label: 交易变现
          detail: 转账、银行卡、支付处理和外汇收费。
        - id: partner-product-monetization
          label: 合作方产品变现
          detail: 信贷、储蓄、保险和投资产品使用合作方基础设施。
        - id: recognized-revenue
          label: 确认收入
          detail: 已报告英国运营实体营业额；合并收入和收入结构不可得。
        - id: gross-profit-conversion
          label: 毛利转化
          detail: 合作方成本、资金成本、损失、客服成本和毛利率均未披露。
    approximationNotes: 这只是按顺序排列的定性流程；没有根据会员或信贷交易量指标推算转化率、收入金额或毛利金额。
    claimRefs:
      - CI001
      - CI004
      - CI006
      - CI008
      - CI012
      - CI016
  - id: FE001
    title: 受证据边界约束的产品架构图
    type: stack
    summary: Tide 的公开产品面向以中小企业工作流为上层，底部是集成和受监管合作方轨道，保障体系贯穿运营模式。
    data:
      layers:
        - label: 会员工作台
          detail: 通过移动端和网页访问账户、银行卡、转账及团队管理功能。
          items:
            - name: Business account
              detail: 以英镑为中心的日常账户和支付流程。
            - name: Cards and expenses
              detail: 与交易相连的企业和团队支出控制。
        - label: 行政工作流
          detail: 用于减少重复性财务和公司行政工作的工具。
          items:
            - name: Invoicing and accounting
              detail: 开票、记账、税务和对账界面。
            - name: Payroll and dividends
              detail: 嵌入式工资、董事薪酬文件和支付历史。
        - label: 增长服务
          detail: 通过 Tide 的会员关系分发的附加服务。
          items:
            - name: Payments and acquiring
              detail: 支付链接、收款、账单支付和连接销售工具。
            - name: Credit and insurance
              detail: Tide 与合作方支持的融资和保障产品接入。
        - label: 软件集成
          detail: 与会计软件包的连接，以及据报道由 API 支持的合作方工作流。
          items:
            - name: Accounting connections
              detail: 外部记账和对账软件。
            - name: Reported API surface
              detail: 历史放款方集成，以及第三方描述的开发者界面。
        - label: 受监管合作方轨道
          detail: 底层账户、电子货币、支付、收单和借贷依赖。
          items:
            - name: Account infrastructure
              detail: 第三方描述的 ClearBank 和电子货币合作关系。
            - name: Product partners
              detail: 支付、收单、软件和信贷服务商。
        - label: 数据与保障
          detail: 风险流程、质量反馈和公司口径的数据能力。
          items:
            - name: Quality controls
              detail: 审阅互动、投诉、政策和监管结果。
            - name: Data and AI
              detail: 公司称自有的中小企业专有数据集，应用于风险框架。
    approximationNotes: 这是根据指定公开证据拼出的概念架构，不代表 Tide 的私有部署拓扑、数据流或控制边界。
    claimRefs:
      - CE005
      - CE006
      - CE007
      - CE008
      - CE010
  - id: FU001
    title: 客户旅程与潜在扩张界面
    type: journey-map
    summary: Tide 可以把客户关系从数字化开户延伸到运营工具和融资，但公开资料没有披露转化率或留存率。
    data:
      nodes:
        - id: discover
          label: 发现
          name: Discover
          detail: 中小企业根据本国银行需求，在 Tide 的免费或付费方案之间评估。
          value: Segment fit
          valueNote: Strongest for digital-first, UK-focused SMEs
          touchpoints:
            - Pricing
            - product review
            - app
        - id: apply
          label: 申请
          name: Apply
          detail: 企业主通过数字流程提交企业和身份信息。
          value: Minutes
          valueNote: Company-stated onboarding can be rapid, subject to checks
          touchpoints:
            - Mobile application
            - identity checks
        - id: activate
          label: 激活账户
          name: Activate account
          detail: 客户获得 ClearBank 支持的银行账户，或获得电子货币账户结构，具体取决于产品。
          value: Regulated partner model
          valueNote: Protection differs by account structure and eligibility
          touchpoints:
            - Account
            - Mastercard
            - payments
        - id: operate
          label: 经营企业
          name: Run the business
          detail: 客户使用开票、会计集成、银行卡和费用工具。
          value: Daily workflow
          valueNote: Public evidence does not disclose active-feature penetration
          touchpoints:
            - Invoices
            - accounting
            - expense management
        - id: finance
          label: 获取融资
          name: Access finance
          detail: 符合条件的客户可以通过 Tide 及其借贷市场寻求信贷。
          value: Over £1.75bn
          valueNote: Company-reported UK credit accessed; not Tide balance-sheet lending
          touchpoints:
            - Credit marketplace
            - partner lenders
        - id: expand
          label: 扩大关系
          name: Expand relationship
          detail: 付费方案，以及相邻的工资、储蓄、支付和保险服务，可以加深产品使用。
          value: Undisclosed conversion
          valueNote: NRR, cross-sell rates, and cohort expansion are not public
          touchpoints:
            - Subscription
            - payroll
            - savings
            - insurance
    approximationNotes: 这些阶段描述的是合理的产品触点，而非实测漏斗；没有披露各阶段转化、活跃使用、留存或扩张率。
    claimRefs:
      - CU010
      - CU013
      - CU016
  - id: FR001
    title: 剩余风险热力图
    type: matrix
    summary: 对影响、可能性和缓释成熟度进行定性筛查；在公开分母缺失时保留不确定性。
    data:
      columns:
        - id: impact
          label: 影响
          detail: 失效发生时可能造成的后果。
        - id: likelihood
          label: 可能性
          detail: 受证据边界约束的方向性评估，不是统计概率。
        - id: mitigation
          label: 缓释成熟度
          detail: 控制措施的公开可见度和备用方案证据。
      rows:
        - id: partner-stack
          label: 核心合作方体系中断
          note: ClearBank/PPS/银行服务商架构；集中度和可迁移性未披露。
          values:
            - value: Critical
            - value: Medium
            - value: Partial
        - id: regulatory-conduct
          label: 跨市场监管或行为失误
          note: QA 控制意图可见；监管结果和行为指标不可得。
          values:
            - value: High
            - value: Medium
            - value: Developing
        - id: service-continuity
          label: 服务中断或修复缓慢
          note: 合同条款分配了中断风险；事件历史不可得。
          values:
            - value: Critical
            - value: Unknown
            - value: Unverified
        - id: international-fit
          label: 国际产品适配性下降
          note: 独立评测和竞争对手评测均指出英镑和支持方面的限制。
          values:
            - value: Medium
            - value: High for cross-border users
            - value: Partial
        - id: integration-dependency
          label: 关键 API 或供应商变化
          note: 可见多个集成服务商；备用测试不可见。
          values:
            - value: High
            - value: Medium
            - value: Unverified
        - id: capital-execution
          label: 资本与扩张执行短板
          note: 所报告融资混合了新增发行和老股转让；现金所得未披露。
          values:
            - value: High
            - value: Medium
            - value: Partial
    approximationNotes: 矩阵值是分析师基于截至 2026-10-20 留存公开证据的定性综合。未知不等于低，也不表示发生过违约、宕机、执法行动或损失事件。
    claimRefs:
      - CR004
      - CR006
      - CR008
      - CR010
      - CR012
      - CR014
      - CR016
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 证据支持继续跟踪；任何投资决定都应以财务和融资条款验证为前提。
    data:
      nodes:
        - id: scale
          label: 规模信号
          detail: 公司称英国和印度会员合计超过 200 万。
        - id: financing
          label: 融资信号
          detail: 2025 年 9 月的私募融资确立了所报告的 15 亿美元估值标记。
        - id: denominator
          label: 分母缺口
          detail: 所引用的 2.25 亿美元指标尚未验证为经审计的合并收入。
        - id: capital
          label: 资本结构缺口
          detail: 融资总额、稀释、优先权及新增发行与老股转让的拆分尚未解决。
        - id: exit
          label: 退出缺口
          detail: 私募融资没有提供可观察的公开市场退出价格。
        - id: recommendation
          label: 跟踪
          detail: 在确定价格或目标回报前，要求提供经审计的经济数据和融资文件。
    approximationNotes: 该流程按定性顺序排列；没有赋予数值权重，也不暗示转化率。
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV005
      - CV006
      - CV013
      - CV014
      - CV016
