chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与运营模式
        blocks:
          - type: paragraph
            body: >-
              Tide Platform Limited 运营 Tide 的网站和应用，但本身不是银行。其英国业务将 Tide 自身的 FCA 许可与 ClearBank 及 PrePay
              旗下实体提供的受监管基础设施结合起来，因此法律及客户资金保障安排取决于具体账户或产品。商业模式也不只是活期账户：Tide 将开票、会计、费用管理、工资、支付、储蓄、信贷获取和相邻销售工具整合为 SME
              平台。这种广度可能提升工作流留存，但也带来合作伙伴、产品治理和监管依赖，不应被压缩成单一的“银行业务”标签。该实体于 2015 年 5 月在伦敦注册，应用于 2017 年 1 月上线。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
