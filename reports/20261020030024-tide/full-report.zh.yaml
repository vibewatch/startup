  - id: TV003
    title: 乐观、基准与悲观情景
    columns:
      - 情景
      - 明确假设
      - 估值 / 回报逻辑
      - 关键风险与下行触发条件
      - 概率信号
    rows:
      - - 乐观
        - 经审计的集团收入验证或超过所报告的 2.25 亿美元指标；留存和利润率强劲；印度和欧洲实现盈利。
        - 只有在经验证的增长、利润率和退出证据能够确立目标回报后，才能为高于 15 亿美元估值标记的溢价辩护。
        - 扩张成本、监管和疲弱的跨境经济性抵消经营杠杆。
        - 当前不具备支持条件；需要经审计的经济数据和客户队列证据。
      - - 基准
        - 会员规模真实存在，但变现能力和国际贡献仍只得到部分验证。
        - 将 15 亿美元作为上限，只有在入场价格或条款能够吸收分母和优先权不确定性时才投资。
        - 如果分母是运行率、ARR 或非合并收入，所报告的 6.7 倍倍数就不具备可比性。
        - 与当前混合证据最一致。
      - - 悲观
        - 收入质量、留存或利润率低于预期；资金和优先权核对显示稀释或清偿顺位更为不利。
        - 要求相对 15 亿美元估值标记有大幅折价，或放弃投资；公开资料无法支持精确区间。
        - 下轮融资、流动性延迟、地域单位经济性疲弱，或融资瀑布表无法核对。
        - 可能性足以否决买入建议。
    notes: 这些情景是有条件的决策框架，不是预测；由于缺少经审计的合并财务、股权结构条款和可比指标定义，没有赋予数值概率或估值区间。
