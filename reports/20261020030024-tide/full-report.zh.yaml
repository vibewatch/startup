      - number: '4.3'
        title: 成本结构与销售效率
        blocks:
          - type: paragraph
            body: >-
              合作伙伴基础设施是交付经济性的核心。Mambu 称 Tide 选择了以 AWS
              为底层的云核心，用于管理不断增长的账本、贷款组合、会计和报告；该合作伙伴还称一款循环信贷产品在三个月内完成开发和上线。这说明建造时间可能更短、容量更易配置，但也引入了公开来源无法量化的平台、云和合作伙伴成本。同样，现有证据没有提供
              CAC、回本周期、销售周期、每位会员的支持成本、信贷损失分摊或渠道收入分成。竞争对手评测指出的国际外汇限制，可能让跨境 SME 面临定价压力。
            claimRefs:
              - CI012
              - CI013
              - CI016
      - number: '4.4'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              Tide 于 2025 年 9 月以 15 亿美元估值融资 1.2
              亿美元，但该轮混合了一级和二级资本，具体拆分没有披露。因此，不能把公开宣布的融资额视为全部加入资产负债表的现金。报道称融资将用于加速国际扩张、产品开发和
              AI，而这些投入都可能增加近期资本需求。公开证据没有披露手头现金、烧钱、现金跑道、一级所得、债务余额、契约或下一轮触发条件。资本充足性仍是待解决的尽调事项，不能从估值或累计融资总额推断。
            claimRefs:
              - CI010
              - CI011
              - CI016
      - number: '4.5'
        title: 财务结论
        blocks:
          - type: paragraph
            body: >-
              现有证据支持这样一个判断：Tide 的变现架构可信且日益多元化，在英国拥有有意义的规模，英国业务被报道实现盈利也提供了积极信号。但集团层面的收入质量尚未经证明：Tide
              尚未公开将会员数桥接至付费方案、交易量、净收入、毛利或现金生成。合作伙伴基础设施和贷款分销可以降低直接建设和资产负债表投入，但合同成本、信贷风险分配和 take rate
              均不可见。因此，在拿到合并账目、队列经济性以及现金和义务桥接之前，财务判断应肯定模式广度，同时对利润率和资本强度保持谨慎。
            claimRefs:
              - CI004
              - CI005
              - CI007
              - CI009
              - CI010
              - CI012
              - CI016
