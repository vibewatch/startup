      - number: '1.4'
        title: 规模、足迹与里程碑
        blocks:
          - type: paragraph
            body: >-
              2026 年 5 月 27 日，Tide 披露全球会员数超过 200 万，其中英国 SME 会员 90 万、印度企业会员超过 110 万。公司还声称拥有英国 SME 15%
              的份额、英国贡献了公司大部分收入，并拥有超过 2,800 名员工。这些是公司披露的规模指标，并非经审计的客户数、活跃账户数或合并财务指标。产品和地域扩张仍在继续，覆盖印度、德国、法国，以及 Funding
              Options 和 Onfolk 两项收购；2026 年 6 月推出的投资账户则由 Seccl 和 Vanguard 提供支持。一篇竞争对手撰写的评测指出 Tide 以 GBP
              为中心、没有多币种钱包且没有传统透支额度；该来源可作为负面产品背景，但不是独立基准。
