companyProfile:
  summary: >-
    Tide 是一家总部位于伦敦的私营金融科技公司，通过合作伙伴支持的金融与管理平台服务小企业。它不是银行：受监管账户、电子货币、银行卡、投资及相关服务取决于 Tide 旗下实体和外部提供商。截至 2026 年 5 月，Tide
    披露会员数超过 200 万，分布在英国和印度；同时公司仍在扩展产品组合及部分欧洲市场布局。
