  - id: TV002
    title: 投资论点与反论点
    columns:
      - 视角
      - 有证据支持的论点
      - 哪些事实会改变判断
    rows:
      - - 投资论点
        - 公司称全球会员数超过 200 万，英国和印度均已形成规模。
        - 核实活跃会员、主账户占比、留存率和各地区活跃会员收入。
      - - 投资论点
        - 该平台把受监管账户与会计、工资发放、支付、储蓄及合作方主导的金融服务结合起来。
        - 证明更广泛产品组合的附加率和正贡献利润率。
      - - 反论点
        - 官方材料对于 200 万这一数字究竟是全球口径还是仅英国口径，存在冲突。
        - 提供带日期且地域口径一致的会员台账，并定义会员、中小企业和活跃账户。
      - - 反论点
        - 一份由竞争对手撰写的评测称，仅支持英镑货币处理是国际用户的限制。
        - 用中立客户数据展示跨境使用、外汇经济性、流失原因和路线图证据。
    notes: 会员数和市场份额数据均为公司口径；国际限制来自竞争对手撰写的比较，被用作不利尽调信号，而非独立基准。
