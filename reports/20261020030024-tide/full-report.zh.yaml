  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 决策与入场纪律
        blocks:
          - type: paragraph
            body: >-
              基于公开证据，适当的决策是继续跟踪；投资判断风险高，估值立场是在核实前按足额估值处理。Tide 及两个第三方数据集都将 2025 年 9 月融资估值定为 $1.5 billion，而 Multiples 报告了
              $225 million 指标并推导出 6.7x 倍数。但该分母不具备决策级可靠性：出版方称与轮次相关的数字可能是收入或 ARR，也可能代表 run-rate 或
              LTM。独立跟踪机构对累计融资也存在重大分歧。因此，入场应以经审计的合并收入、利润率和现金转化、完全稀释股权结构表以及融资瀑布为条件。在这些材料到位前，融资估值只是投资者兴趣的证据，不能证明新投资者能在同一价格或更高价格获得目标回报。
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV007
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV007
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
              - CV013
              - CV014
              - CV016
      - number: '8.2'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              投资论点是规模加产品广度。Tide 称全球会员已超过 two million，其中英国 900,000、印度超过 1.1 million，并声称占英国市场
              15%。其受监管合作伙伴模式也让公司无需作为银行运营，就能把账户、管理和融资获取结合起来。反论点是，规模不能证明变现质量或持久的单位经济性。Tide 的 Google Play 文案称英国用户超过 two
              million，这与公司自身披露的全球和英国拆分相冲突。一篇竞争对手撰写的评测还指出，GBP 单一币种结构和没有多币种钱包对国际经营 SME
              是弱点。因此，会员活跃度、留存、地域收入组合和跨境经济性是必需的尽调内容，而不是可选的上行空间分析。
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.3'
        title: 情景与可比背景
        blocks:
          - type: paragraph
            body: >-
              情景估值应继续相对于已验证的 $1.5 billion 融资估值，而不是转换成虚假的点估值。只有当已披露的会员规模能够转化为独立验证的经常性收入、良好留存和有利润的国际扩张时，乐观情景才可能支持溢价。基准情景把
              $1.5 billion 视为谈判上限，直到 $225 million 分母和 6.7x 计算能够与经审计集团账目对齐。悲观情景假设变现更弱、国际化成本高或优先权条款不利，因此要求折价或不投资。历史轮次显示估值从
              2017 年未披露，快速扩张到 2025 年报道中的十亿美元级讨论；但保留数据集中的公开和私募可比对象采用混合业务模式和指标定义，因此只能提供背景，不能形成可辩护的定价公式。
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV007
              - CV008
              - CV009
              - CV012
              - CV015
              - CV016
      - number: '8.4'
        title: 最终尽调与论点破坏点
        blocks:
          - type: paragraph
            body: >-
              最终承销应索取已签署的 2025 年 9 月融资文件、一级与二级分配、清算优先权、反稀释权、期权池处理、债务条款、经审计的合并账目，以及从会员数到活跃主账户、按地域拆分的收入和贡献利润的桥接。还应核对 1.81
              亿美元和 3.12 亿美元融资总额，以及相互矛盾的会员地域说法。论点破坏触发条件包括：无法对账融资瀑布；证据表明引用的收入指标是 ARR 或 run-rate
              而非经审计收入；留存恶化；实体层面报告掩盖持续亏损；或国际增长没有产生正向单位经济性。退出准备度未经证明，因为现有证据提供的是私募融资估值，而不是可观察的公开市场价格。
            claimRefs:
              - CV002
              - CV005
              - CV006
              - CV007
              - CV010
              - CV014
              - CV016
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 价格判断需要私有证据
            body: 15 亿美元融资估值是可观察的，但还不足以支持买入：在设定入场价、目标回报、持有期或退出假设前，应先核对经营分母和资本结构。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV007
              - CV015
              - CV016
