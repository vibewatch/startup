    approximationNotes: 这些并非嵌套的 TAM/SAM/SOM 层级：其中混合了不同地区，以及人口与会员两种定义。来源写有“超过”的数值按披露下限绘制，金字塔顺序仅作描述，不代表转化或收入模型。
