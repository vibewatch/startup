      - number: '7.4'
        title: 合作伙伴、财务模型与执行暴露
        blocks:
          - type: paragraph
            body: >-
              Tide 的产品广度依赖银行、支付、贷款、会计和数据交易对手。Sacra 特别指出 Tide 依赖 ClearBank 以及第三方平台和 API；Tide 条款则单独说明第三方服务包括
              ClearBank、Adyen 和 Sage 等提供商。资本只能不完全地缓解近期融资压力：FinTech Magazine 报道一笔由一级和二级投资组成的 1.2 亿美元交易，因此不能把公开宣布的金额视为加入
              Tide 的现金；同一报道还称 TPG
              代表进入董事会。杀手标准是可量化的：若重要合作伙伴集中度未解决、一级严重服务事件反复发生、监管机构限制核心许可、投诉持续恶化，或无法将一级现金所得与集团烧钱和跑道对账，就应暂停投资。缓释措施需要经审计的交易对手清单、退出和可迁移性测试、服务水平表现、董事会权利披露以及合并流动性桥接。
            claimRefs:
              - CR001
              - CR003
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
