  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              Tide 的相关市场是小企业的经营金融层：企业账户、支付、开票、会计、费用控制、工资、信贷获取和部分财富管理产品。这个边界比英国企业活期账户收费更宽，但比全部 SME
              金融服务更窄，因为承保资产负债表、完整多币种资金管理和专业投资产品制造由合作伙伴或其他提供商完成。现状替代方案包括一家传统银行，加上独立的会计、工资、收单、借贷和外汇工具；内部电子表格和手工对账仍是非软件替代方案。Tide
              的整合主张可以降低工具之间的切换摩擦，但其受监管合作伙伴模式和以 GBP 为中心的账户结构也让重要工作流留在平台之外。因此，市场定义应围绕工作流归属和可变现服务，而不是所有 SME 的表面数量。
            claimRefs:
              - CM001
              - CM008
              - CM009
              - CM010
              - CM016
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM008
              - CM009
              - CM010
              - CM016
      - number: '2.2'
        title: 受证据约束的规模测算
        blocks:
          - type: paragraph
            body: >-
              现有证据支持人口和渗透率视角，不支持货币口径的 TAM。Tide 披露英国有 5.2 million 家小企业、900,000 名英国会员及 15% 份额；另一家出版方则称 2025 年初英国有 5.69
              million 家 SME。这些分母无法自动对齐，因此不应把披露的份额反推成精确的可服务市场。印度提供了更大的市场人口视角：Tide 披露会员超过 1.1 million，而官方和非官方 MSME 数量分别为
              72 million 和 140 million，但这两个数字都不能证明可服务、可数字化触达或愿意付费的需求。德国 5.5 million 家 SME 及 Tide
              进入法国市场说明存在相邻机会，不代表渗透尚未得到证明。私营市场数据库的收入估算不纳入市场规模测算，因为出版方没有说明其 $225 million 数字究竟是 LTM 收入还是 run-rate。
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM003
              - CM005
              - CM006
              - CM011
              - CM012
              - CM013
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM014
      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              经济买方通常是企业主或财务负责人，员工、簿记员和会计师则会使用支付、费用、工资和对账工作流。付款方可能是通过订阅费和交易费付费的企业，也可能是通过合作伙伴经济性付费的相邻提供商；指定来源没有披露这一拆分。最清晰的采用路径是从低摩擦的账户或注册入口开始，再增加管理、支付、信贷、储蓄或投资产品。Tide
              的投资账户正是这种路径：现有企业档案可复用于开户，但 P1、Seccl 和 Vanguard 分别提供受监管运营、托管、基础设施和基金。跨境经营的 SME 面临不同路径，因为以 GBP
              为中心且没有多币种钱包的账户可能需要额外提供商，从而削弱 Tide 对完整工作流的掌控。
            claimRefs:
              - CM001
              - CM008
              - CM009
              - CM010
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM003
              - CM008
              - CM009
              - CM010
              - CM016
      - number: '2.4'
        title: 增长驱动、约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              采用动力来自大量小企业、移动开户、免费入门层，以及把银行服务与日常管理任务连接起来的便利性。会员数从 2025 年的 150 万增长至 2026 年 5 月的超过 200
              万，与持续获客的方向一致，但来源没有披露活跃度、留存、付费方案转化、ARPU
              或获客成本。约束包括对受监管合作伙伴的依赖、投资中的资本损失披露、外汇和币种限制，以及印度和欧洲本地化经济性的不确定性。当定义、活跃门槛和地域不同，会员数可能高估可变现市场份额，这些缺口因此会影响估值。在把人口视角当作
              TAM、SAM 或 SOM 之前，一份站得住的投资判断仍需要队列和预算证据、独立来源的支出模型，以及按产品和市场拆分的收入桥接。
            claimRefs:
              - CM004
              - CM007
              - CM009
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 人口规模不等于可变现市场规模
            body: 现有证据没有披露活跃会员定义、付费转化、产品级收入、买方预算或可服务的数字化采用率。因此，人口和会员数量不能支持精确的收入 TAM、SAM 或 SOM。
            calloutType: risk
            claimRefs:
              - CM007
              - CM015
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争环境与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              英国 SME 可以通过多条路径解决 Tide 所承接的核心任务：Starling 等移动优先银行，Revolut Business 和 WorldFirst 等电子货币及跨境专业服务商，Allica 等成熟
              SME 挑战者，传统银行，或在现有银行之外另配开票和会计软件。指定的对比证据将 Tide 放在整合管理的一端；Revolut 和 WorldFirst 强调国际币种处理，Allica
              则强调储蓄、借贷和关系型银行服务。因此，竞争边界宽于“企业活期账户”。内部拼装仍是可信替代方案，因为主要组件可以分别购买，尽管指定证据没有量化这样做的整合成本或运营成本。
            claimRefs:
              - CP006
              - CP007
              - CP016
          - type: table
            tableRef: TP001
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
              - CP009
              - CP016
      - number: '3.2'
        title: 产品广度与信任架构
        blocks:
          - type: paragraph
            body: >-
              Tide 的差异化在于围绕账户连接工作流，而不是拥有银行牌照。其官方披露称 Tide 运营应用但不是银行；活期和储蓄账户由 ClearBank 提供支持，部分电子货币账户则使用 PrePay
              Technologies
              和客户资金保障安排。同一披露及公司发布的应用介绍还描述了开票、会计整合、费用控制、储蓄、支付和融资获取。该合作伙伴架构加快了产品扩展，但也意味着信任和保障取决于会员的具体账户结构。买方需要区分符合条件的
              ClearBank 存款和受保障的电子货币，而不能把每一笔 Tide 余额都视为经济属性相同。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP012
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP007
              - CP009
              - CP012
      - number: '3.3'
        title: 定价、分销与切换
        blocks:
          - type: paragraph
            body: >-
              定价证据在方向上有用，但还不够干净，无法用于承销式的苹果对苹果比较。一篇 2026 年由竞争对手撰写的评测称 Tide 有四档方案，价格从免费到每月 GBP69.99，并强调按方案收取的外汇费用；较早的 2023
              年评测披露了更低的付费档位和已经过时的国际业务限制。另一篇 2026 年 10 月文章对客服是否持续可用的说法自相矛盾。这些冲突意味着当前官方费率表和服务条款应列为尽调事项。切换成本看起来也有限：企业可以保留
              Tide 处理 GBP 业务，同时增加专业货币账户，因此分销和便利性对留存的影响可能大于合同锁定。
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP011
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP011
              - CP013
      - number: '3.4'
        title: 护城河持久性与被替代风险
        blocks:
          - type: paragraph
            body: >-
              Tide 最强的护城河证据是规模与产品广度的结合。公司披露会员超过 200 万，其中英国 SME 会员 90
              万，并展示了从注册到工资、支付、信贷和网站工具的完整产品组合。这一足迹可以改善交叉销售和数据驱动的产品开发，但现有证据没有证明队列留存、主账户份额或更优的单位经济性。可比竞争对手已经提供快速开户和会计数据接入；全能型银行可以凭存款保障和借贷能力拉开差异；货币专业服务商也可以与
              Tide 并存，而不迫使客户完整迁移。因此，当前结果是有用的便利性护城河，尚未得到证明存在专有或不可逆的锁定。指定资料池中仍缺少可比竞争对手的融资、客户规模和产品采用情况。
            claimRefs:
              - CP004
              - CP005
              - CP013
