            body: >-
              Tide 发布的一份质量保证岗位描述显示，公司在多个市场审查客户互动、投诉、升级事项、政策和监管结果。这是控制意图和内部反馈闭环的有用证据，但招聘信息不是对安全、隐私、韧性或 Consumer Duty
              表现的独立审计。指定资料池没有当前状态历史、渗透测试摘要、认证登记、独立鉴证报告、恢复目标或事故率序列。因此，尽调应把安全和可靠性视为尚未解决，而不是因为没有引用事故就推断安全。合作伙伴主导的账户结构，也让责任映射和端到端服务水平证据格外重要。
