      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 对证据敏感的投资暂停标准
            body: 如果 Tide 无法证明核心提供商的可迁移性测试、重大事故和投诉表现、司法辖区层面的许可、合作伙伴集中度，以及从一级融资所得到账面合并烧钱和现金跑道的桥接，就应暂停投资。当前资料池证明了暴露路径，而不是事件频率。
            calloutType: risk
            claimRefs:
              - CR001
