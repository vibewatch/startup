  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 优先风险框架
        blocks:
          - type: paragraph
            body: >-
              最大的剩余暴露是受监管合作伙伴运营模式。Tide 自身条款将企业账户和储蓄业务置于 ClearBank 或其他银行提供商之下；一家独立竞争对手评测也描述了 ClearBank 银行账户与 PPS
              电子货币服务的拆分。这种结构可以加快产品广度，但也在客户旅程各环节形成相互关联的连续性、合规和合同依赖。规模会放大风险：Tide 称 2026 年 5 月会员数已突破 200 万，其中印度超过 110 万、英国
              90
              万。因此，热力图将合作伙伴连续性和跨市场经营行为视为高剩余风险，尽管指定证据没有证明已经发生违规、宕机、执法行动或损失事件。投资含义是，应以主要监管机构记录、事故指标和交易对手集中度数据作为判断依据，而不是因为没有公开事件就推断安全。
            claimRefs:
              - CR001
              - CR002
              - CR006
              - CR007
              - CR014
              - CR016
