            body: >-
              Tide 的法律边界是分层的。其会员条款描述了与合作伙伴共同提供的产品，以及在特定情况下代表 ClearBank 和 Adyen
              提供的支持；同一条款允许在怀疑欺诈、犯罪使用、监管违规或涉及受限国家时暂停服务。这些条款是常规控制，并不是不当行为的证据，但显示会员访问可能受到 Tide
              与外部机构共同作出的合规决定影响。一份公司撰写的质量保证招聘信息提到英国、印度和德国的 Consumer
              Duty、投诉、升级事项和监管监测，这是控制意图的证据，而非控制效果的证据。指定资料池没有监管机构决定、牌照登记摘录、法院案卷或按司法辖区列示的许可地图。因此，法律和监管状态仍只得到部分验证，下面的登记表保留这一缺口。
