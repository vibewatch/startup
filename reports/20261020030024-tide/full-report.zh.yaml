      - number: '1.2'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Tide 的公开领导层信息显示 Oliver Prill 任集团 CEO，George Schmidt 任英国 / 欧洲 CEO，Sir Donald Brydon 任董事长；一篇第三方评测将 George
              Bevis 认定为创始人。Prill 于 2018 年加入 Tide，在金融服务领域拥有超过 20 年经验；Brydon 则带来上市公司、审计复核和金融行业董事会方面的丰富经历。2025 年 9 月融资还让
              TPG 合伙人 Yemi Lalude 进入董事会，提升了机构投资者代表性。公开证据没有提供完整董事会名单、委员会构成、表决权、创始人持股或继任框架。因此，战略明显集中于 Prill
              只构成一项尽调问题，并不等于已经证明存在无人管理的关键人物风险。
            claimRefs:
              - CO008
              - CO010
          - type: table
            tableRef: TO002
            claimRefs:
              - CO008
              - CO009
              - CO010
      - number: '1.3'
        title: 资本与利益相关方结构
        blocks:
          - type: paragraph
            body: >-
              最清晰的融资里程碑是 2025 年 9 月由 TPG 的 Rise Funds 领投、Apax Digital 参与的 $120 million 交易，Tide 估值达到 $1.5
              billion。据报道，该交易同时包含一级和二级资本，因此不能把公开金额全部视为注入资产负债表的现金。累计融资仍未厘清：Tide 称获得超过 $300 million 投资，Multiples 记录七轮合计
              $312 million，Silicon Valley Investclub 则报道超过 $411
              million。债务、赠款、可转债和二级出售所得的处理差异可能解释这一差距，但现有证据仍无法完成对账。资本结构、清算优先权、稀释以及投资者控制权需要公司直接提供文件。
