            body: >-
              Zap’s strongest competitive argument is architectural simplicity plus a widening industrial story: a
              compact Z-pinch concept, liquid-metal know-how, and an integrated nuclear platform that could reuse
              engineering investments across fission and fusion. That is a real wedge. But the evidence does not support
              calling it a locked-in moat yet. CFS and Helion presently look stronger on buyer-facing GTM proof; TAE and
              Pacific are deliberately building their own supply-chain and systems advantages; and the broader market
              still has permission to wait because independent observers remain skeptical about how fast any fusion
              pathway becomes bankable. Moat durability therefore depends less on abstract plasma elegance than on who
              accumulates the hardest-to-copy stack first: plant definition, customer contracts, site control,
              interconnection progress, supply chain, and regulatory learning. Zap’s competitive position looks
              investable as a differentiated contender, especially if simplicity translates into faster deployment. It
              does not yet look like a company that has escaped commercialization risk or displaced the substitute
