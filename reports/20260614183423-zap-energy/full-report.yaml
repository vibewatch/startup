        - 2030 net-facility-gain target; $1B Albuquerque campus; >$1B funding reported by Power
        - Utilities, government, research users, and long-duration clean-power developers
        - Modular pulser architecture building on national-lab inertial-fusion concepts
        - Commercial demand proof is earlier than customer offtake proof
      - - SMR substitute class
        - Advanced fission SMRs
