              Public evidence already shows genuine progress on plasma pressure, duty-cycle hardware, and DOE-reviewed
              plant architecture. The remaining blockers are the unglamorous ones: who prepays, what exactly the
              licensing path is, where tritium and lithium come from, how the 4S-derived design rights are documented,
              and whether another financing round arrives before those questions are answered.
