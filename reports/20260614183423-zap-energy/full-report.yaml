      - number: '7.3'
        title: The fission pivot creates both mitigation optionality and dependency risk
        blocks:
          - type: paragraph
            body: >-
              The biggest strategic debate is whether Zap’s fission move accelerates fusion or simply broadens the
              company’s risk surface. Management’s argument is coherent: the same pumps, heat exchangers, liquid metals,
              high-temperature materials, and nuclear-grade manufacturing capabilities can be used across both programs,
              and early fission deployments might create revenue and customer intimacy sooner than fusion can.
              Supportive coverage accepts that logic. The skeptical reading is harsher and more relevant for
              underwriting. TechCrunch argues the second reactor concept is almost certainly not free and could become a
              permanent detour; Neutron Bytes goes further and says the combined plan multiplies technical, regulatory,
              fundraising, and customer-acquisition burdens. That skepticism is reinforced by market position. Zap is
              entering microreactors with a 10-megawatt sodium-cooled concept derived from the unbuilt 4S lineage, years
              behind better-capitalized fission peers. Customer evidence is also thin: public materials talk about
              distributed, industrial, military, and data-center buyers plus reserved-capacity or milestone-payment
              concepts, but they do not identify anchor accounts or signed economics. In other words, the strategy may
              be directionally smart, yet it currently depends more on narrative synergies than on disclosed
              counterparties.
