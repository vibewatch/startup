  - id: TE003
    title: Technology / operating architecture table
    columns:
      - layer / component
      - role
      - dependency
      - risk
    rows:
      - - Sheared-flow-stabilized plasma column
        - Provides confinement and heating through current-driven compression plus stabilizing flow
        - Requires precise coupling of acceleration, compression, gas fueling, and diagnostics
        - If flow stabilization does not hold at plant conditions, the whole product thesis weakens
      - - Electrode and valve geometry
        - Shapes plasma initiation and flow profile
        - Depends on durable materials, nosecone protection, and repeatable fueling
        - Erosion and replacement intervals are still not public
      - - Pulsed-power banks / Marx generator
        - Store and release the fast high-current pulses that drive each shot
        - Depends on switch reliability, trigger timing, thermal management, and load flexibility
        - Power electronics could become a hidden capex and maintenance bottleneck
      - - FuZE-Q / FuZE-3 diagnostics
        - Measure temperature, density, pressure, and neutron yield
        - Depends on Thomson scattering, modeling, and repeatable shot quality
        - Headline numbers are ahead of fully published operating statistics
      - - Century liquid-metal wall and loop
        - Absorb heat, protect solid surfaces, and approximate plant energy-transfer conditions
        - Depends on liquid-metal chemistry, pumping, heat exchange, and contamination control
        - Long-run corrosion and cleanup performance remain private
      - - Tritium and blanket systems
        - Convert a plasma core into a fuel-cycling power plant
        - Depends on liquid-metal blanket, shielding, regulatory limits, and fuel handling
        - Public design exists, but operating evidence does not
      - - Controls, safety, and remote handling
        - Support safe plant operation, maintenance, and emergency planning
        - Depends on software, sensors, procedures, and regulator acceptance
        - Public controls detail is limited and cyber assurance is not disclosed
      - - Integrated nuclear supply chain
        - Reuses materials, manufacturing, and balance-of-plant components across reactor classes
        - Depends on execution discipline across fission and fusion programs
        - Cross-platform synergies are plausible but not yet proven in operations
    notes: >-
      The table mixes observed subsystems with inferred dependencies. Reliability data are strongest for Century
      repetition and weaker for lifetime, tritium, and control-system evidence.
