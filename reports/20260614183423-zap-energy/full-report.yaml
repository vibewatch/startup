  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Zap competes across multiple fusion architectures, not one flat peer list
        blocks:
          - type: paragraph
            body: >-
              Zap’s direct competitive set is unusually heterogeneous because “fusion company” is not one commercial
              product category yet. Zap’s own pitch centers on a sheared-flow-stabilized Z-pinch that claims lower
              hardware complexity than magnet-heavy tokamaks or laser-driven systems, while Helion sells a
              field-reversed-configuration generator with direct electricity recovery, CFS sells the tokamak path with
              HTS magnets and a large central plant, TAE argues for a compact FRC path enabled by neutral beams, and
              Pacific Fusion is building a pulsed magnetic inertial system derived from inertial-fusion concepts. Those
              are not cosmetic differences. They imply different first-plant footprints, fuel cycles, supply chains,
              operating models, and timelines. Zap’s 2026 DOE-approved preconceptual plant milestone matters because it
              shifts the company from “interesting plasma physics” toward a defined 50 MW-per-module plant concept. But
              it does not erase the fact that buyers can compare Zap against very different fusion architectures and
              against non-fusion substitutes if those alternatives solve the same firm-power problem sooner or with less
              project risk.
