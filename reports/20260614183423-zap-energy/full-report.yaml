        - HTS tokamak with central plant model
        - ~400 MW ARC plan; Google 200 MW offtake; Eni >$1B purchase agreement; nearly $3B raised
        - Grid-scale utilities, hyperscalers, corporate clean-power buyers
        - Most explicit combination of scale, financing, and named customer pull
