      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The fission move is the biggest swing factor in the entire Zap thesis
            body: >-
              If the dual-track strategy works, Zap may compress learning cycles across licensing, liquid metals, and
              industrialization faster than a fusion-only peer. If it fails, the company will have added a second
              expensive reactor program before proving customer payments, site approvals, or fuel-cycle closure on the
              first. That is why the fission line is best treated as both mitigation and multiplier of risk rather than
              as a clean hedge.
