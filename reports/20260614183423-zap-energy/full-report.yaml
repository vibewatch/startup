      - number: '5.2'
        title: Architecture and operating model
        blocks:
          - type: paragraph
            body: >-
              Technically, Zap’s architecture is unusual because the plasma generates its own confining magnetic field.
              Current running through the plasma column creates the pinch, while sheared axial flow stabilizes the
              column long enough to heat and compress it without external superconducting magnets, cryogenics, or giant
              laser arrays. Public evidence shows a clear device sequence. FuZE established temperature and
              neutron-production credibility. FuZE-Q scaled current and stored energy toward breakeven-oriented
              operation. FuZE-3 added a third electrode and separate control of acceleration versus compression,
              improving the tunability of density and pressure. In parallel, Century translates that physics stack into
              plant subsystems: repetitive pulsed power, flowing liquid-bismuth walls, heat extraction, and
              erosion-mitigation hardware. Zap’s 2026 DOE design milestone broadens the architecture further into a full
              plant model that includes tritium systems, power conversion, remote handling, and control-and-safety
              systems. The operating model is therefore not just ‘prove the plasma’ but ‘co-develop the reactor core and
              the surrounding industrial systems at the same time.’
