      - number: '8.3'
        title: Peer anchors support only a wide scenario range, not a precise mark
        blocks:
          - type: paragraph
            body: >-
              Comparable analysis helps set guardrails, but the guardrails are wide. Helion's January 2025 Series F is
              the clearest private-fusion premium reference because it disclosed both a $425 million raise and a $5.425
              billion post-money valuation alongside named customer agreements. Public advanced-nuclear references are
              even more dispersed. Oklo traded around a $10.0 billion market cap in June 2026 despite warning investors
              that it is pursuing an emerging market with no commercial project operating. NuScale traded around
              $3.4-$3.6 billion while carrying only about $18.7 million of trailing revenue and heavy losses. Centrus
              traded around $3.2 billion on roughly $452 million of revenue, and BWXT traded near $17.7 billion on about
              $3.38 billion of revenue, showing what disclosed revenue and operating history do for valuation support.
              At the lower end, NANO Nuclear still carried roughly a $1.2 billion market cap even though its 10-K says
              it has not generated revenue since inception. Those anchors imply that public markets will pay meaningful
              option value for nuclear stories, but they also show how quickly the premium changes once revenue,
              customer contracts, or mature execution records appear. That is why Zap's defensible range has to stay
              broad and sit meaningfully below Helion unless new private-market price discovery arrives.
