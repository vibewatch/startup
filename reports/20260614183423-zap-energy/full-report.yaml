      - number: '3.2'
        title: Commercial pull currently favors peers that pair plant claims with named buyers
        blocks:
          - type: paragraph
            body: >-
              The clearest competitive divide today is not pure plasma performance; it is route-to-market proof. CFS and
              Helion both pair technology narratives with visible commercial anchors. CFS has Google’s 200 MW offtake
              and Eni’s more than $1 billion purchase agreement around ARC, while Helion has Microsoft’s planned 50 MW+
              first plant and a 500 MWe industrial collaboration with Nucor. Those relationships matter because they
              reduce the “who actually buys first?” uncertainty that still hangs over most fusion companies. Zap, TAE,
              and Pacific each show credible execution in a different way — DOE plant-design validation, siting and
              neutral-beam commercialization, or a billion-dollar campus and user program — but the retained public set
              still shows less named customer pull for them than for CFS or Helion. That difference feeds distribution
              power. Named hyperscaler and industrial partners can accelerate permitting, financing, interconnection
              work, and customer education long before a first commercial kilowatt-hour is delivered.
