chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Technology, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Zap Energy is a private U.S. nuclear-technology company headquartered in Everett, Washington and founded
              in 2017 by Benj Conway, Brian Nelson, and Uri Shumlak. Its origin story matters because the company is not
              presenting an entirely new physics concept from scratch: reviewed third-party and official sources tie the
              business directly to University of Washington work on the sheared-flow-stabilized Z-pinch, a configuration
              intended to confine plasma without the massive superconducting magnet sets or laser arrays used by other
              fusion programs. That origin helps explain both the company's unusually compact reactor thesis and its
              long-running emphasis on pulsed-power engineering, liquid-metal heat handling, and rapid iteration across
              successive FuZE devices.


              As of the 2026 run date, Zap is no longer messaging itself as only a fusion startup. Its current materials
              emphasize an integrated nuclear platform spanning fusion, fission, and eventually hybrid systems. The core
              fusion business model remains the commercialization of compact modules sized at roughly 50 MW net electric
              output, but management now argues that near-term fission deployments can monetize overlapping capabilities
              in liquid metals, advanced materials, modular manufacturing, and grid-scale power systems before fusion is
              fully bankable. In practical diligence terms, the company identity is now two-layered: a still
              physics-driven fusion developer with a real publication trail, and a broader nuclear-platform story meant
              to accelerate deployment and attract capital aligned with power-demand growth.
