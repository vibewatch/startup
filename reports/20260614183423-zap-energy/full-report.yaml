  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: Zap overlaps the firm-clean-power bottleneck, not the entire power market'
        blocks:
          - type: paragraph
            body: >-
              Zap’s own positioning makes the boundary question unusually important. The company still frames its core
              mission as commercializing sheared-flow-stabilized Z-pinch fusion, but it now also argues that the energy
              transition cannot wait for fusion alone and is broadening into an integrated nuclear platform spanning
              advanced fission, fusion, and hybrid systems. That move matters analytically: it signals that the relevant
              market is not “fusion research” in the abstract and not the entirety of electricity demand. The nearer
              commercial job is supplying reliable, carbon-free power where intermittency, grid congestion, and
              infrastructure timing are binding constraints.


              Included in that boundary are firm-clean-power use cases where buyers value reliability, siteability, and
              carbon attributes together: hyperscale data-center loads, utility or independent-power-producer
              procurements, and select industrial or energy-community sites that need dispatchable supply. Excluded are
              categories that would overstate TAM, such as all U.S. electricity spend, all AI infrastructure capex, or
              every nuclear-adjacent engineering activity. Status-quo substitutes belong inside the market definition
              because they solve the same job sooner: natural gas, advanced fission or SMRs, and renewable portfolios
              paired with storage and flexibility. Public evidence therefore supports a “firm clean power bottleneck”
              frame for Zap rather than a generic “huge energy market” claim.
