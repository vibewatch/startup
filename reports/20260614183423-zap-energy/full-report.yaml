      - number: '8.2'
        title: Technical proof is real, but commercialization distance still dominates valuation
        blocks:
          - type: paragraph
            body: >-
              Zap has earned more credit than a pure science project. Century began as a 100-kilowatt engineering
              platform for plant-relevant subsystems, later scaled to one shot every five seconds and roughly 39
              kilowatts of average power, and logged more than one thousand consecutive plasma shots in a DOE-certified
              campaign. FuZE-3 then reached 830 MPa electron pressure, or about 1.6 GPa total plasma pressure, using a
              three-electrode architecture intended to improve control over acceleration and compression. In May 2026
              DOE approved Zap's preconceptual fusion pilot-plant design milestone for a roughly 50 MW net-electric
              module. Those are meaningful bull-case inputs because they show Zap is not waiting for a single end-state
              proof point before working on plant architecture. Even so, the same public sources still leave the core
              valuation blockers untouched. They do not disclose current revenue, gross margin, cash burn, signed
              commercial offtake, or the economics of the new fission line. The result is that Zap looks materially more
              advanced than an idea-stage fusion startup, but still much too early and opaque for conventional revenue
              or EBITDA multiple work.
            claimRefs:
