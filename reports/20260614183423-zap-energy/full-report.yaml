  - id: FV004
    title: Investment KPIs
    type: kpi
    summary: IC-style scoring on a 1-5 scale based only on retained public evidence.
    data:
      items:
        - label: Market opportunity
          score: 4
          detail: Fusion and broader nuclear demand narratives are large and increasingly policy-backed.
        - label: Technical proof
          score: 3
          detail: Century, FuZE-3, and the DOE milestone are meaningful but still pre-commercial.
        - label: Commercial proof
          score: 1
          detail: Retained sources do not disclose customer-backed revenue or priced offtake.
        - label: Capital access
          score: 3
          detail: Series D quality was strong, but there is no fresh 2026 price discovery.
        - label: Execution focus
          score: 2
          detail: The fusion-plus-fission pivot broadens scope before economics are public.
        - label: Valuation support
          score: 2
          detail: Peer anchors are helpful, but Zap-specific valuation inputs remain thin.
        - label: Evidence quality
          score: 2
          detail: Enough exists for a watch stance, not enough for a high-conviction buy.
    approximationNotes: Scores are relative judgments from public evidence and are not machine-generated rankings.
