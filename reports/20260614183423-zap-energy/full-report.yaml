      - number: '8.4'
        title: Recommendation, thesis-break triggers, and diligence asks
        blocks:
          - type: paragraph
            body: >-
              The call should stay valuation-sensitive and evidence-sensitive rather than simply pro-technology. Zap has
              enough proof to remain investable to watch: substantial capital raised, repeatable engineering progress,
              serious plasma-performance work, and DOE milestone traction. But the same evidence set also shows why
              conviction should stop short of a buy. The 2026 fusion-plus-fission pivot broadens the opportunity and can
              eventually improve the story, yet right now it also expands scope before public sources show a new priced
              round, a customer-backed revenue bridge, or a transparent preference stack. The most defensible present
              stance is therefore Research More with medium confidence and high risk. A bear case around $0.6
              billion-$1.0 billion fits a delay-plus-down-round outcome; a base case around $1.0 billion-$1.8 billion
              fits continued technical relevance without fresh price discovery; and a bull case around $1.8 billion-$3.0
              billion requires a strong next round plus cleaner commercialization proof. The immediate diligence agenda
              is straightforward: obtain the current cap table and preference stack, validate financing terms, demand
              unit-economics and burn disclosures, and test whether the fission addition is accelerating or distracting
              the path to a commercial fusion module.
