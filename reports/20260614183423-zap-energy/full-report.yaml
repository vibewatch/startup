companyProfile:
  summary: >-
    Zap Energy is an Everett, Washington-based private advanced-nuclear company founded in 2017 by Benj Conway, Brian A.
    Nelson, and Uri Shumlak as a University of Washington spinout built on sheared-flow-stabilized Z-pinch research. Its
    core fusion thesis is that current flowing through the plasma can provide compression without large external
    superconducting magnets, while newer engineering work has expanded from physics devices such as FuZE-Q and FuZE-3
    into plant subsystems such as Century, liquid-metal walls, repetitive pulsed power, and a DOE-approved preconceptual
    pilot-plant design sized at roughly 50 MW net per module. In 2026 the company broadened into an integrated nuclear
    platform that also includes a 10 MW sodium-cooled fission effort, aiming to use shared materials, thermal, and
    manufacturing capabilities to reach earlier revenue. The diligence question is now whether Zap can convert credible
    engineering progress and a substantial venture base into licensable, financeable, customer-backed power products
    before the broader scope dilutes execution.
