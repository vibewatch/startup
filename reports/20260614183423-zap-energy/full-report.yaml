      - number: '2.2'
        title: 'Sizing lenses: demand is real, but public SAM/SOM remains bounded and incomplete'
        blocks:
          - type: paragraph
            body: >-
              The cleanest public demand numbers in this run come from data-center and electricity-demand sources rather
              than from a credible public “fusion TAM” vendor model. DOE’s LBNL-backed report says U.S. data centers
              used about 4.4% of total U.S. electricity in 2023, or 176 TWh, and could reach 6.7% to 12% and 325 TWh to
              580 TWh by 2028. EIA separately projects U.S. electricity consumption will keep rising through 2050 at
              0.9% to 1.6% annually, with data-center server energy a major factor, and trade coverage of EIA’s 2026
              outlook says total U.S. power demand should reach 4,283 billion kWh in 2026. That is a large enough outer
              demand pool to matter for valuation, even before one assumes broad fusion adoption.


              But those numbers do not create a precise Zap-specific SAM or SOM. The public record does not disclose
              Zap’s target pricing, plant capex, backlog, or a bounded service territory that lets an outside analyst
              convert macro power demand into near-term vendor revenue. EIA also notes that its modeling system is not
              optimized for the economics of experimental technologies like fusion. The practical way to preserve rigor
              is to treat macro electricity and data-center load as TAM context, then use actual corporate procurement
              behavior—such as nuclear and fusion PPAs—as a narrower SAM proxy. Even there, contradictory timing
              estimates matter: DOE and NRC sources describe commercialization pathways in the late 2020s to mid-2030s,
              while skeptical coverage argues practical fusion power remains much farther away.
