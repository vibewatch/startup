      - - Helion Energy
        - FRC with direct electricity recovery
        - Microsoft 50 MW+ first-plant target; Nucor 500 MWe collaboration; $5.425B valuation
        - Hyperscalers, industrial behind-the-meter and on-grid buyers
        - Direct-electricity narrative and strong named customer anchors
        - Aggressive timing and proprietary fuel-cycle assumptions remain hard to prove
