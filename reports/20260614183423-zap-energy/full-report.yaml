  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing context and why missing price discovery matters more than the story
        blocks:
          - type: paragraph
            body: >-
              Zap's last hard public financing signal is still the October 2024 Series D, not a fresh 2026 valuation
              event. The retained official and independent sources all agree on the headline size—$130 million—and they
              place cumulative private funding around $327 million to above $330 million, with a University of
              Washington feature pushing the broader private-plus-public support figure toward $350 million. That is
              meaningful capital for a compact-fusion company and it validates that top-tier investors were willing to
              underwrite the platform after Century launched. But it is still not the same thing as having a current
              disclosed valuation. In 2026 the company's outward-facing communication shifted toward leadership change,
              an integrated fission-plus-fusion strategy, and milestone progress rather than toward a new priced round,
              secondary mark, or updated cap-table disclosure. That gap matters because valuation in frontier energy is
              a function of both technical progress and the latest willingness of capital to price execution risk.
              Without a disclosed 2026 valuation, investors are really triangulating from stale funding history, peer
              marks, and public-market analogs rather than underwriting a clean new transaction.
            claimRefs:
              - CV001
