              already-disclosed power buyers. The official announcement, the CEO transition release, and independent
              coverage all converge on the same segmentation: distributed and grid-connected industrial loads,
              data-intensive applications such as AI infrastructure, and government or defense-adjacent demand for
              resilient power. In that framing, the buyer is typically a large energy decision-maker, infrastructure
              sponsor, or government program manager; the user is the operator of an energy-hungry site or platform; and
              the payer could be a federal milestone program, a future reserved-capacity counterparty, or eventually a
              reactor-hosting customer. That matters because the evidence base is strongest on need intensity and buyer
              logic, not on sales closure. Zap is effectively telling investors that power scarcity, AI growth,
              industrial electrification, and national security will create demand for compact nuclear systems, but it
              has not yet paired that thesis with a named utility, hyperscaler, or industrial offtaker. The public
