  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: zap-customer-proof
    missingEvidence: Named anchor customers, offtake terms, or development agreements for Zap’s first commercial deployments.
    whyItMatters: Zap’s relative GTM position versus CFS and Helion depends on whether undisclosed demand exists beyond engineering milestones.
    diligencePath: Request customer pipeline, term-sheet summaries, and any utility or hyperscaler engagement memos under NDA.
    relatedQuestionRefs:
    - QP005
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: tae-customer-proof
    missingEvidence: Named utility, industrial, or hyperscaler counterparties backing TAE’s first-plant development path.
    whyItMatters: TAE’s siting and supply-chain progress is easier to underwrite if paired with visible demand pull, not just internal milestones.
    diligencePath: Request first-plant counterparty discussions, siting short list, and any non-public memorandum of understanding summaries.
    relatedQuestionRefs:
    - QP011
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: material
    topic: fusion-pricing-transparency
    missingEvidence: Published or confidential price, $/MWh, capex, and O&M assumptions across Zap, CFS, Helion, TAE, and Pacific.
    whyItMatters: Without real commercial economics, comparative readiness can be overstated by MW headlines and funding totals alone.
    diligencePath: Request contract economics, project-finance models, and any internal LCOE or tariff materials for first plants.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP003
