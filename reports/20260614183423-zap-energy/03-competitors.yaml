tables:
- id: TP001
  title: Competitor profile table
  columns:
  - Competitor / class
  - Architecture
  - Public capital / commercial signal
  - Target buyer / use case
  - Differentiation
  - Limitation
  rows:
  - - Zap Energy
    - Sheared-flow-stabilized Z-pinch fusion
    - DOE-approved 50 MW/module design milestone; $330M+ cumulative funding disclosed in retained set
    - Utilities, data-center developers, industrial clean-firm-power buyers
    - Simpler no-magnet/no-laser pitch plus integrated nuclear and liquid-metal story
    - No named power offtake or anchor customer appears in the retained public set
  - - Commonwealth Fusion Systems
    - HTS tokamak with central plant model
    - ~400 MW ARC plan; Google 200 MW offtake; Eni >$1B purchase agreement; nearly $3B raised
    - Grid-scale utilities, hyperscalers, corporate clean-power buyers
    - Most explicit combination of scale, financing, and named customer pull
    - Large plant and tokamak complexity still create execution and capex risk
  - - Helion Energy
    - FRC with direct electricity recovery
    - Microsoft 50 MW+ first-plant target; Nucor 500 MWe collaboration; $5.425B valuation
    - Hyperscalers, industrial behind-the-meter and on-grid buyers
    - Direct-electricity narrative and strong named customer anchors
    - Aggressive timing and proprietary fuel-cycle assumptions remain hard to prove
  - - TAE Technologies
    - FRC with neutral-beam-driven formation and sustainment
    - 50 MWe first plant being sited; >$1.3B lifetime equity; UKAEA beam JV
    - Utilities and industrial users needing firm clean power later in the 2030s
    - Compact linear-machine story plus explicit supply-chain buildout
    - Named power customers or offtakes are not public in the retained set
  - - Pacific Fusion
    - Pulsed magnetic inertial fusion
    - 2030 net-facility-gain target; $1B Albuquerque campus; >$1B funding reported by Power
    - Utilities, government, research users, and long-duration clean-power developers
    - Modular pulser architecture building on national-lab inertial-fusion concepts
    - Commercial demand proof is earlier than customer offtake proof
  - - SMR substitute class
    - Advanced fission SMRs
    - Vendor marketing emphasizes load following, near-demand siting, and heavy-industry fit
    - Hyperscalers, industrial campuses, utilities seeking firm power sooner
    - More familiar nuclear category and a direct answer to AI/data-center demand
    - Still unproven at scale and not yet a frictionless shortcut
  - - Status quo / self-build portfolio
    - Grid PPAs, gas-backed portfolios, renewables plus storage, or self-generation
    - Available today and financeable through familiar utility or project-finance channels
    - Any buyer unwilling to bet early on one fusion pathway
    - Avoids fusion-technology risk and preserves optionality
    - Land, emissions, interconnection, and reliability constraints can still bite
  notes: Rows mix direct peers, substitutes, and status quo because buyers are choosing firm-power pathways, not just startup brands.
