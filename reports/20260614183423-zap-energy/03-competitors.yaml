- id: substitutes-switching-and-status-quo
  title: Substitutes and internal build keep buyers from needing to single-home early
  body: Zap is not only competing against other fusion startups. It is also competing against the option to wait, self-build, or solve the same firm-power problem with more familiar technologies. Zap’s new integrated fission-plus-fusion language acknowledges that reality directly. For a hyperscaler, utility, or industrial buyer, the relevant question is not “which fusion logo wins?” but “what source can deliver clean, firm power with acceptable land use, grid constraints, and regulatory risk on the required timeline?” SMRs are therefore a genuine substitute class, not just a market adjacency. Independent sources say data-center demand is outrunning grid expansion and that decision-makers are actively evaluating compact, round-the-clock, low-carbon alternatives, even though SMRs remain unproven at scale. That substitute pressure raises switching costs for every fusion company. Once a buyer begins siting, interconnection, regulatory, and fuel-cycle work around one pathway, the cost of reversing
    course is high, so many buyers can rationally defer commitment or run multiple options in parallel rather than betting early on a single fusion architecture.
