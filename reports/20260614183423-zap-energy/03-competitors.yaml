- id: TP005
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Evidence today
  - Mitigation / diligence ask
  rows:
  - - Zap simplicity advantage
    - Rivals may prove their more complex systems are more bankable or already better contracted
    - High
    - Zap has a credible simplicity story but weaker named demand proof than CFS or Helion
    - Request named customer pipeline, interconnection progress, and first-site criteria
  - - Zap integrated nuclear platform
    - Advanced-fission substitutes may capture near-term budget before fusion is bankable
    - High
    - Zap itself now frames fission as part of the same strategic continuum
    - Request whether fission broadens opportunity or distracts scarce execution capacity
  - - CFS customer pull moat
    - Tokamak capex and construction complexity could still delay value capture
    - Medium
    - Google and Eni are meaningful, but delivery still depends on SPARC/ARC execution
    - Track SPARC schedule and first-plant financing structure
  - - Helion direct-electricity moat
    - Aggressive timeline and proprietary fuel-path assumptions may be harder than public narrative suggests
    - High
    - Microsoft and Nucor agreements are strong, but Polaris is still a prototype
    - Track Polaris electricity demonstration and fuel-cycle updates
  - - TAE supply-chain moat
    - Without named plant customers, supply-chain progress may not convert into demand fast enough
    - Medium
    - TAE Beam UK and siting are real steps, but buyer pull is under-evidenced publicly
    - Request anchor-customer, utility, or industrial partner evidence
  - - Pacific modular-pulser moat
    - Users-program activity may not translate into power-plant bookings
    - Medium
    - Pacific has funding, campus buildout, and milestone progress but not retained offtakes
    - Track conversion from user interest to commercial counterparties
  - - Fusion sector moat overall
    - SMRs and other clean-firm substitutes can satisfy buyer urgency earlier
    - High
    - Independent sources show firm-power demand is urgent while fusion timelines remain uncertain
    - Benchmark win/loss reasons against SMR, gas-backed, and self-build alternatives
  - - Pricing power across fusion
    - Public price opacity can delay underwriting confidence and compress negotiating leverage
    - High
    - The retained set is rich on milestones and MW headlines but thin on tariff schedules
    - Demand confidential contract, capex, and O&M data before underwriting
  notes: Severity is an underwriting judgment based on the retained evidence set, not a probabilistic forecast.
