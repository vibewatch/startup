  topStrengths:
    - >-
      Credible technical stack from FuZE devices through Century and a DOE-approved preconceptual 50 MW-per-module pilot
      design gives Zap stronger engineering evidence than a typical pre-revenue fusion startup.
    - >-
      The sheared-flow-stabilized Z-pinch architecture promises lower hardware complexity than magnet- or laser-heavy
      approaches if durability and scale-up hold.
    - >-
      Publicly disclosed capital raised above $330 million plus DOE milestone validation provide real support for plant
      engineering rather than lab science alone.
  topRisks:
    - >-
      The fusion-plus-fission strategy materially widens technical, regulatory, IP, and capital demands before either
      business has named commercial customers.
    - >-
      Public materials still do not disclose current valuation, revenue, cash runway, unit economics, or customer
      contract structure, making underwriting highly scenario-dependent.
    - >-
      Commercial proof remains weak because no named paying electricity customer, reservation book, or documented
      first-buyer lane is public.
  unresolvedGaps:
    - Current 2026 valuation, any extension or secondary pricing, and the latest preference stack are not public.
    - Cash on hand, monthly burn, and runway through the next fusion and fission milestones are undisclosed.
    - No named commercial offtake, reservation, or prepayment contracts are public for either fusion or fission.
    - Module-level capex, power price, availability, and gross-margin assumptions are not disclosed.
    - The exact IP or freedom-to-operate package for the revived 4S-derived 10 MW fission program is not public.
