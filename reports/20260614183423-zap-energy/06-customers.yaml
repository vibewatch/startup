  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: named-commercial-customers
    missingEvidence: Named commercial counterparties, signed site hosts, PPAs, reservations, or LOIs for reactors or future electricity sales.
    whyItMatters: Without named counterparties, the chapter can validate buyer interest but not true customer conversion or reference quality.
    diligencePath: Request a pipeline schedule listing signed and near-signed counterparties, contract stage, MW, timing, and segment for every commercial account.
    relatedQuestionRefs:
    - QU002
    - QU013
    - QU014
    - QU025
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-and-durability
    missingEvidence: Active-customer count, renewal rate, churn, NRR, GRR, uptime obligations, and customer-reported outcome or satisfaction data.
    whyItMatters: Durability is a core customer diligence question, and public buyer thesis cannot substitute for retention or reference quality.
    diligencePath: Request customer cohorts, contract-renewal tables, service-level commitments, and reference calls with any paying or milestone-based counterparties.
    relatedQuestionRefs:
    - QU017
    - QU019
    - QU020
    - QU025
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: commercialization-revenue-mix
    missingEvidence: Expected revenue split between government programs, milestone payments, reservations, equipment sales, and future power revenue.
    whyItMatters: Zap's near-term customer model may be dominated by non-recurring or quasi-programmatic cash flows, which changes quality-of-revenue and concentration risk.
    diligencePath: Request a 24-month revenue bridge and pipeline waterfall by payer type, contract stage, and amount.
    relatedQuestionRefs:
    - QU003
    - QU018
    - QU024
    - QU025
    relatedTableRefs:
    - TU005
  - type: enumeration-incomplete
    severity: material
    topic: named-proof-coverage
    missingEvidence: A complete public list of commercial pilots, customer programs, site partners, or named reservation holders does not exist.
    whyItMatters: The named proof table is forced to mix government counterparties with unnamed target buyers, which weakens reference quality.
    diligencePath: Request permission to disclose at least three commercial reference accounts or counterparties with contract stage, site role, and buying rationale.
    relatedQuestionRefs:
    - QU006
    - QU021
    - QU025
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: material
    topic: first-buyer-procurement-path
    missingEvidence: Evidence showing which buyer lane—government, defense, industrial, utility, or hyperscaler—is most likely to produce the first paid deployment.
    whyItMatters: Zap is pursuing several buyer lanes at once, and the likely first customer path affects diligence sequencing, sales resources, and concentration assumptions.
    diligencePath: Request management's ranked buyer-lane roadmap, with gating milestones, contract archetypes, and why one lane will close before the others.
