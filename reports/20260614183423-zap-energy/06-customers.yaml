tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Scale / timing
  - Revenue / strategic value
  - Gap
  rows:
  - - Federal milestone programs
    - DOE or DoD program manager / Zap R&D and pilot-plant team / U.S. government
    - Milestone-based technical and commercialization validation
    - Current named counterparty lane in 2025-2026
    - Most concrete near-term payer path because federal payments can arrive before electricity sales
    - Program funding is not the same as recurring reactor or power revenue
  - - Hyperscalers and AI data-center developers
    - Energy procurement and infrastructure teams / data-center operations / corporate balance sheet or reserved-capacity structure
    - Secure dedicated firm power for compute-heavy campuses
    - Strategic future lane; no named counterparty disclosed
    - Very high strategic value because power scarcity can block AI capacity growth
    - No public buyer name, reservation count, or contract terms
  - - Distributed industrial and manufacturing sites
    - Site sponsor or industrial energy lead / plant operations / host customer
    - On-site or near-site modular nuclear supply for high-load facilities
    - Official target segment, but no public deployment list
    - Broadens TAM beyond utilities and aligns with modular deployment pitch
    - No disclosed pipeline, win rate, or site economics
  - - Grid-connected utilities or energy developers
    - Utility planner or project developer / grid operations / utility rate base or project SPV
    - Deploy compact fission or later fusion modules into utility-scale or grid-adjacent settings
    - Implied future lane via 50 MW module design and grid language
    - Could support larger repeat orders if pilot plants work
    - No named utility offtaker, PPA, or interconnection filing for Zap is public
  - - Defense and energy-security buyers
    - Base energy or resilience sponsor / mission-critical facility operators / federal budget
    - Resilient nuclear supply for bases and energy-intensive national-security infrastructure
    - Plausible segment from DoD nuclear push, not a Zap-specific contract
    - Useful because defense buyers can tolerate bespoke early deployments
    - No public award, demonstration, or procurement record tying Zap to a base program
  notes: Rows separate current named programmatic payers from future reactor or power buyers; blank commercial proof should be read as not publicly disclosed, not zero demand.
