company:
  name: Zap Energy
chapter:
  number: 6
  title: Customers
  summary: 'Zap''s customer chapter is really a buyer-thesis chapter: public evidence supports target segments and named government counterparties, but not named paying electricity customers. The strongest proof is DOE milestone validation and other federal program support, while the commercial story is still framed as future data-center, industrial, distributed-energy, and defense demand plus possible capacity-reservation payments. Retention, concentration, contract, and repeat-purchase evidence remain almost entirely undisclosed, and adverse sources question whether the new dual-track fission/fusion strategy can secure customers quickly enough.'
sections:
- id: '6.1'
  title: Target buyers are clear, but actual commercial customers are not publicly named
  body: 'Zap''s 2026 public commercial narrative is built around who it wants to sell to, not around a roster of already-disclosed power buyers. The official announcement, the CEO transition release, and independent coverage all converge on the same segmentation: distributed and grid-connected industrial loads, data-intensive applications such as AI infrastructure, and government or defense-adjacent demand for resilient power. In that framing, the buyer is typically a large energy decision-maker, infrastructure sponsor, or government program manager; the user is the operator of an energy-hungry site or platform; and the payer could be a federal milestone program, a future reserved-capacity counterparty, or eventually a reactor-hosting customer. That matters because the evidence base is strongest on need intensity and buyer logic, not on sales closure. Zap is effectively telling investors that power scarcity, AI growth, industrial electrification, and national security will create demand
    for compact nuclear systems, but it has not yet paired that thesis with a named utility, hyperscaler, or industrial offtaker. The public record therefore supports the existence of target segments and target use cases, while still treating actual end-customer conversion as future work.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU025
  - CU026
  - CU029
  - CU030
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: '6.2'
  title: Named counterparty proof is government-led, and the adoption trajectory is technical rather than commercial
  body: 'The strongest named proof in Zap''s customer record is not a commercial deployment but a series of government counterparty signals. DOE approved the company''s preconceptual pilot-plant design milestone in May 2026, and DOE''s own Milestone Program documentation explains that awardees pursue business and commercialization milestones as well as science milestones, with payment only after independent review. That makes DOE a real programmatic payer and validator, even though it is not buying electricity from Zap. Century, FuZE-3, and the ALCC supercomputer allocation add to the trajectory, but they are still engineering-readiness markers rather than customer-adoption markers. Meanwhile management has floated a future monetization model built around federal programs, milestone payments, and reserved production capacity from large power-hungry buyers, yet no public source in this evidence set names those buyers. The result is a very specific mix of traction: there is credible, fresh,
    and named federal proof that Zap is being reviewed, funded, and technically advanced toward pilot-plant readiness, but there is no equivalent public proof that a hyperscaler, utility, or industrial customer has committed to buy a reactor or its future output.'
