- id: '6.3'
  title: Durability, concentration, and procurement friction remain the central open questions
  body: 'Because Zap is pre-commercial, the usual customer-durability signals are almost entirely absent from public materials. There is no disclosed active-customer count, no public PPA or reservation-book tally, no NRR or GRR, no churn or renewal data, and no cohort-style satisfaction evidence. That forces investors to reason from buyer urgency and program participation rather than from repeat purchase behavior. The commercial upside is easy to articulate: hyperscalers are moving from abstract renewable PPAs toward direct infrastructure deals for net-new power, defense users want resilient energy security, and DOE''s commercialization strategy explicitly leans on public-private partnership structures. But the frictions are just as clear. Data-center procurement is becoming more standards- and disclosure-intensive; fusion still needs extensive regulatory engagement even under a more favorable framework than fission; and Zap''s chosen fission design inherits real licensing and validation
    work from the abandoned 4S lineage. Adverse sources sharpen the point: they question whether one company can secure customers for two advanced nuclear products at once, and whether the dual-track strategy becomes a longer detour before real commercial bookings appear. Until named buyers, contract structures, and repeat procurement data become visible, expansion and concentration will remain thesis-driven rather than evidence-proven. The absence of those basics also makes cross-sell and expansion logic impossible to verify publicly: investors cannot tell whether Zap is cultivating a diversified book of early buyers, or whether the future revenue bridge depends on only one or two outsized counterparties willing to fund first-of-a-kind deployments.'
