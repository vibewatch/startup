- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - AI and data-center power scarcity
    - If commercial traction appears, it may come from a small number of giant counterparties
    - A few hyperscalers could dominate backlog, pricing leverage, and roadmap demands
    - Request pipeline by named account, MW sought, and share of projected bookings
  - - Federal milestone and program payments
    - Early monetization may be concentrated in government support rather than product revenue
    - Budget or policy changes could slow the cash bridge before commercial sales arrive
    - Request revenue mix by grants, milestone payments, and private counterparties over the next 24 months
  - - Fission-first go-to-market
    - Selling a fission product first could consume focus before fusion wins are proven
    - Commercial progress in one lane may not validate the other lane's customer economics
    - Request dedicated sales ownership, capital allocation, and customer-development milestones by product line
  - - Direct infrastructure deals for net-new power
    - Buyer procurement will likely require large bespoke infrastructure partnerships, not simple PPAs
    - Sales cycles can lengthen and become dependent on permitting, grid, cooling, and standards work
    - Request expected contracting model, site-prep assumptions, and partners required per deal
  - - Regulatory and data-center standards evolution
    - Buyers may delay commitments until nuclear, water, and efficiency rules are clearer
    - Delayed procurement can push out both reservations and site awards
    - Request regulatory critical path by segment and which standards gates must clear before contract signing
  - - 4S lineage and legacy-code validation
    - Commercial rollout inherits technical and licensing questions from the revived fission design
    - Unknown validation burden can slow first deployments and raise buyer diligence hurdles
    - Request NRC strategy, code-validation plan, and remaining dependency on historical 4S test data
  notes: The main expansion upside is huge buyer need, but the public record implies concentration in a few government or hyperscale counterparties if demand turns real.
