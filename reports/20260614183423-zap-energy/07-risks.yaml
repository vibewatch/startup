  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: 4s-ip
    missingEvidence: The exact license, assignment, or freedom-to-operate package behind Zap’s revived 4S-derived microreactor design.
    whyItMatters: Without documentary proof, investors cannot judge whether the fission line rests on clean rights or on future IP negotiation risk.
    diligencePath: Request the design-rights memo, any Toshiba or successor agreements, and outside counsel FTO work product for the 4S-derived design.
    relatedQuestionRefs:
    - QR019
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: customer-prepayments
    missingEvidence: Executed reservation, milestone-payment, or offtake documents for either fission or fusion customers.
    whyItMatters: The current revenue bridge depends on customers or federal programs paying before reactor deployment, but no public contract proves that willingness.
    diligencePath: Request redacted term sheets, deposit mechanics, refundability terms, and customer names segmented by military, industrial, and data-center use cases.
    relatedQuestionRefs:
    - QR015
    - QR027
    relatedTableRefs:
    - TR003
    - TR006
  - type: missing-source
    severity: material
    topic: zap-specific-doe-support
    missingEvidence: Zap-specific DOE cost-share schedule, remaining milestones, and payment cadence beyond the public milestone approval announcement.
    whyItMatters: The DOE milestone program is a real de-risking channel, but public evidence does not show the exact dollars or what happens if future milestones slip.
    diligencePath: Request the company’s milestone matrix, cost-share schedule, and internal dependency map for DOE and other federal programs.
    relatedQuestionRefs:
    - QR006
    relatedTableRefs:
    - TR001
    - TR006
  - type: missing-source
    severity: material
    topic: fuel-supply-plan
    missingEvidence: A documented tritium startup inventory plan, lithium sourcing strategy, and blanket supply-chain counterparties.
    whyItMatters: Fuel-cycle closure is a commercialization gate for any D-T fusion design, and public sources do not identify who will supply the required nuclear materials.
    diligencePath: Request blanket and fuel-cycle procurement assumptions, tritium startup strategy, lithium form-factor needs, and contingency plans for delayed enrichment capacity.
    relatedQuestionRefs:
    - QR011
    - QR012
    relatedTableRefs:
    - TR002
    - TR003
  - type: private-evidence-only
    severity: material
    topic: commercial-pipeline
    missingEvidence: Named anchor customers, qualification stages, and concentration data for both the fusion and fission pipelines.
    whyItMatters: Without customer names or committed volumes, investors cannot tell whether demand is diversified, speculative, or concentrated in a few opportunistic conversations.
    diligencePath: Request the current commercial pipeline, stage definitions, customer concentration view, and decision timeline by account.
    relatedQuestionRefs:
    - QR027
    - QR030
    relatedTableRefs:
    - TR003
    - TR005
