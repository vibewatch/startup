- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitoring indicator
  - Threshold / event
  - Action implication
  rows:
  - - Fusion licensing delay
    - NRC rulemaking and state engagement
    - Final fusion rule or Zap licensing path slips past 2027 without a credible interim plan
    - Downgrade fusion deployment timing and require explicit site-by-site licensing strategy before underwriting
  - - DOE dependency
    - Milestone cadence / appropriations
    - A later DOE milestone misses or public-private support materially shrinks
    - Treat capital need as larger and shorten assumed runway
  - - Customer validation failure
    - Prepayments / anchor accounts
    - No named anchor customer, deposit, or pilot structure appears before the next major financing event
    - Assume demand is still conceptual and raise concentration discount
  - - Dual-track stretch
    - Staffing and spend mix
    - Fission hiring, capex, or management attention grows while fusion milestones stall
    - Treat fission as displacement rather than acceleration of the fusion thesis
  - - Fuel-cycle immaturity
    - Tritium and lithium plan disclosure
    - No credible tritium startup and blanket-supply plan emerges by pilot siting stage
    - Block commercialization underwriting until fuel-cycle assumptions are documented
  - - Capital intensity shock
    - Fundraising need versus technical proof
    - Zap needs a major round before proving customer commitments or licensing progress
    - Assume higher dilution risk and demand milestone-linked valuation discipline
  notes: Each trigger is monitorable from diligence updates, financing materials, or regulatory calendars; thresholds are designed to identify thesis breaks before a full project failure becomes visible.
