- id: financing-people-and-thesis-breaks
  title: Financing, leadership, and milestone slippage are the thesis-break variables
  body: 'Financial and people risk remain intertwined. Zap has raised real money — more than $330 million publicly, including a $130 million Series D — and the capital has funded credible engineering progress. But that financing was already supporting parallel plasma R&D and plant-engineering work before the company officially added fission. A second reactor program therefore increases burn and execution load before public revenue is visible. Sector context makes that harder, not easier: FIA says current U.S. fusion funding is still insufficient for decadal deployment, while MIT Technology Review highlights research suggesting fusion may not enjoy the fast cost-down curves investors often assume. Leadership changes partly mitigate this. Zabrina Johal’s operating background is stronger for deployment and licensing than the prior founder-only bench, and the hire of Daniel Walter adds relevant fission depth. Even so, the 2026 transition also reveals the practical issue: Zap is still assembling
    the management and engineering bench needed to commercialize two nuclear platforms at once. The investable view is therefore conditional. If DOE milestones keep landing, if customer prepayments become real, and if NRC and site-specific licensing advance on schedule, the strategy could look prescient. If those signals stall, the thesis breaks quickly because financing dependency will reappear before product-market proof does.'
