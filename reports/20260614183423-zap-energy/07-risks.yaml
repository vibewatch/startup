company:
  name: Zap Energy
chapter:
  number: 7
  title: Risks
  summary: Zap Energy’s strongest public proof in 2026 is that it has moved from pure plasma claims to real plant-engineering and policy milestones, but that progress sits inside a much wider execution surface than most fusion startups face. The highest-severity risks are dual-track commercialization stretch, unresolved licensing and fuel-cycle dependencies, and financing pressure created by pursuing both a fusion pilot and a new fission product before customers, IP rights, and government support are fully de-risked in public.
sections:
- id: regulatory-and-licensing
  title: Regulatory and licensing risk remains a first-order dependency
  body: 'Zap has cleared a meaningful but narrow regulatory gate: DOE approved the company’s preconceptual fusion pilot-plant design in May 2026, and the package now spans tritium handling, liquid-metal blankets, safety systems, remote maintenance, and plant infrastructure rather than only plasma experiments. That matters because it shows the company is thinking like a plant developer. It does not mean the plant is licensed, financed, or sold. In parallel, NRC’s 2026 fusion-machine rulemaking confirms that U.S. fusion oversight is still evolving through a Part 30-style materials framework with final rules expected in 2027, so Zap remains exposed to a timeline it does not control. The new fission line compounds that reality: management argues the company can reuse regulatory learning, but fission still adds a separate licensing burden and site-specific safety case. The legal picture is also only partly resolved in public. Zap clearly has real SFS Z-pinch patents and a university-rooted technical
    lineage, yet no reviewed public source documented the exact rights package behind the revived 4S-derived fission design. The practical takeaway is that regulation is moving in Zap’s favor, but the company is still pre-license on fusion, pre-license on fission, and not publicly transparent enough on IP provenance to call legal risk closed.'
