- id: operational-and-fuel-cycle
  title: Operational and fuel-cycle risk still dominates the path from lab system to plant
  body: 'The core operational question is whether Zap’s engineering stack can move from impressive subsystems to durable plant hardware fast enough to keep the commercialization story credible. Century is the best public evidence that Zap is working the right problem set: repetitive pulsed power, liquid-metal cooling, and electrode-damage mitigation. But Century also shows how much distance remains. The platform runs at roughly 100 kilowatts of input power and validates shots at around 0.1 hertz, while the commercial module target remains roughly 50 megawatts net electric. FuZE-3’s 2025 pressure milestone strengthens the physics case, yet it still is not proof of net electricity, availability, or maintenance economics. Fuel-cycle risk is equally material. Zap’s own design now embeds a tritium fuel cycle and breeding blanket, while industry references from World Nuclear and NRC-linked materials make clear that commercial fusion cannot rely on natural tritium supply. That means Zap must solve
    not only plasma confinement but also liquid-metal materials behavior, tritium handling, remote maintenance, and a credible lithium-linked supply plan. These are solvable in principle, but they are exactly the kind of plant-integration risks that often stretch deep-tech timelines.'
