callouts:
- calloutType: risk
  title: The fission move is the biggest swing factor in the entire Zap thesis
  body: If the dual-track strategy works, Zap may compress learning cycles across licensing, liquid metals, and industrialization faster than a fusion-only peer. If it fails, the company will have added a second expensive reactor program before proving customer payments, site approvals, or fuel-cycle closure on the first. That is why the fission line is best treated as both mitigation and multiplier of risk rather than as a clean hedge.
  claimRefs:
  - CR008
  - CR009
  - CR016
  - CR037
  - CR043
  - CR047
  - CR048
- calloutType: risk
  title: The hardest diligence questions are now commercial and systems-level, not only scientific
  body: 'Public evidence already shows genuine progress on plasma pressure, duty-cycle hardware, and DOE-reviewed plant architecture. The remaining blockers are the unglamorous ones: who prepays, what exactly the licensing path is, where tritium and lithium come from, how the 4S-derived design rights are documented, and whether another financing round arrives before those questions are answered.'
