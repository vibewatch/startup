- id: leadership-governance-and-key-person-risk
  title: Leadership, Governance, and Key-Person Risk
  body: 'Leadership is one of the clearest 2026 changes at Zap. Zabrina Johal has taken over as CEO while co-founder Benj Conway moved to president, a shift that recasts Conway from public face and chief fundraiser into strategy and long-term technology steward. The change looks intentional rather than cosmetic: current announcements pair Johal''s arrival with an integrated fission-plus-fusion strategy, new nuclear-engineering hires, and rhetoric about industrialization rather than only laboratory progress. Publicly visible founders still cover the company''s essential knowledge domains — Conway on strategic capital formation, Brian Nelson on device engineering, and Uri Shumlak on the underlying plasma physics — but the operating bench is now wider than the original founding trio.


    That broadened bench does not eliminate concentration risk. Zap''s technical credibility still leans heavily on Shumlak/Nelson lineage, while the commercial pivot now leans heavily on Johal, Matthew Thompson, and other scale-up operators such as Marvi Matos Rodriguez. Governance disclosure remains partial: public materials identify at least one investor director from Addition and prominently feature Lowercarbon-linked representation, yet they do not disclose ownership percentages, voting rights, or the full current board package. For investors, that means the leadership story is credible enough to support a commercialization narrative, but still too opaque to underwrite control dynamics without direct diligence on board structure and protective provisions.'
  claimRefs:
