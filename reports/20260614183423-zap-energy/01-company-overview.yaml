- id: strategic-shift-and-adverse-signals
  title: Strategic Shift and Adverse Signals
  body: 'The central adverse question around Zap in 2026 is no longer whether the company has an interesting fusion physics thesis — it does — but whether layering fission on top of fusion speeds commercialization or dilutes it. Zap''s own explanation is coherent: the same liquid-metal, materials, manufacturing, and nuclear-operations skills could support both product lines while giving the business a nearer-term deployment path. Yet the strongest independent reactions are skeptical. TechCrunch explicitly warns that the fission effort could become a permanent detour because it forces Zap to carry the cost and complexity of a second reactor platform, while Neutron Bytes argues the dual-track strategy multiplies regulatory, fundraising, and customer-acquisition burdens.


    Those critiques matter because Zap''s public disclosure is still thin where investors most need hard answers. The company has not put a current valuation into public view, has not named commercial customers for the new fission line, and has not published a fully buildable pilot-plant schedule beyond the DOE preconceptual milestone. That does not negate the real progress shown by Century, FuZE-3, or the publication trail; it simply means the investability case remains milestone-forward rather than cash-flow-forward. For later chapters, the overview conclusion is that Zap has earned attention through technical velocity and unusually broad systems thinking, but it has also widened its execution surface area faster than public proof on governance, customer demand, and financing terms has widened with it.'
