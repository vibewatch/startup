- id: capital-base-and-milestone-cadence
  title: Capital Base and Milestone Cadence
  body: 'Zap''s strongest externally legible proof point is not one single plasma result but the way financing, engineering, and plant design milestones have stacked on top of one another. The latest disclosed financing remains the October 2024 $130 million Series D led by Soros Fund Management, taking disclosed funding past $330 million; a March 2026 University of Washington feature suggested the broader mix of private and public support was nearing $350 million. Those are meaningful numbers for a compact-fusion developer, but the more important inference is where the money went: not just plasma experiments, but Century system integration, a more ambitious pulsed-power stack, and a DOE-linked pilot design workflow.


    That milestone cadence is unusually parallel. Century first proved that Zap could operate a high-repetition engineering platform with liquid metal and pulsed power, then scaled to thousands of shots and materially higher average power; FuZE-3 then pushed plasma pressure higher with a new three-electrode architecture; and the DOE program approved a preconceptual pilot-plant design that already spans tritium handling, maintenance, safety, and power conversion. In other words, Zap is trying to compress what many fusion developers sequence over longer windows: science validation, plant systems engineering, and commercialization architecture. The upside is faster learning loops. The downside is that private investors are still being asked to fund a company whose valuation, customer commitments, and actual build schedule remain only partially disclosed.'
