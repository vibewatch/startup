  productSummary: >-
    Modular firm-power platform built around sheared-flow-stabilized Z-pinch fusion.
    Near-term assets include FuZE-Q and FuZE-3 for plasma performance, Century for
    repetitive pulsed-power and liquid-metal subsystem validation, and a DOE-reviewed
    pilot-plant concept targeting about 50 MW net electric output per module; Zap now
    also markets a compact fission pathway as part of the same integrated nuclear stack.
  customerFocus: >-
    Hyperscalers, data-intensive campuses, industrial users, utilities, distributed-energy
    applications, and government programs seeking firm carbon-free power where grid
    constraints make reliability especially valuable.
  businessModel: >-
