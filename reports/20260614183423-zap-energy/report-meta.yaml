summary:
  headline: >-
    Zap Energy has moved beyond a slideware fusion story with credible plasma, systems,
    and DOE-reviewed plant-engineering progress, but the 2026 fusion-plus-fission
    expansion widens commercialization, licensing, and financing risk before customers,
    economics, or current price discovery are visible.
