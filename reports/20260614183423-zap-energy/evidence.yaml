      investors cannot tell which path gets management focus when tradeoffs appear.
    diligencePath: >-
      Request org charts, capital-allocation assumptions, milestone owners, and scenario plans that show how fusion
      progress is protected if the fission path stretches.
    relatedQuestionRefs:
      - QE025
    relatedTableRefs:
      - TE005
