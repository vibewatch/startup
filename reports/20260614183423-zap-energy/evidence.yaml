      the headline pressure result.
    whyItMatters: >-
      Current FuZE-3 evidence is strong enough to show direction of travel, but it still leans on company disclosures
      and secondary coverage rather than a completed scientific publication.
    diligencePath: >-
      Request APS presentation materials, manuscript drafts, or the eventual journal article and compare the final data
      package with the current press summary.
    relatedQuestionRefs:
