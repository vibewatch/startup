      Request the internal techno-economic model, pilot-plant budget, and sensitivity cases for uptime, capex, and price
      realization.
    relatedQuestionRefs:
      - QI010
      - QI021
      - QI023
      - QI025
    relatedTableRefs:
      - TI004
      - TI006
  - type: private-evidence-only
    severity: material
    topic: leverage-structure
    missingEvidence: >-
      Any intended debt, export credit, government loan, or project-finance structure for pilot plants or fission
