    whyItMatters: >-
      Capital structure determines dilution, covenant risk, and whether commercial deployment can happen without
      repeated large equity rounds.
    diligencePath: Ask management for financing plans by stage, target lenders or program offices, and key conditions precedent.
    relatedQuestionRefs:
      - QI017
      - QI024
      - QI025
    relatedTableRefs:
      - TI005
      - TI006
  - type: private-evidence-only
    severity: material
    topic: electrode-durability
    missingEvidence: >-
      Multi-thousand-shot electrode-erosion data, maintenance intervals, replacement costs, and contamination
      measurements for liquid-metal-protected components.
    whyItMatters: >-
      Electrode lifetime sits directly on plant availability, service cost, and whether repetitive Z-pinch operation can
      become a durable commercial asset rather than a laboratory result.
    diligencePath: >-
      Request Century maintenance logs, post-campaign inspection reports, failure analyses, and engineering limits for
      cathode, nosecone, and liquid-metal protection systems.
    relatedQuestionRefs:
      - QE023
    relatedTableRefs:
      - TE003
      - TE004
  - type: missing-source
    severity: material
    topic: quality-and-cyber-assurance
    missingEvidence: >-
      Third-party quality-program evidence such as NQA-1/ASME-style controls, software/control-system cybersecurity
      standards, or a dated certification roadmap.
    whyItMatters: >-
      Public trust evidence is currently heavier on staffing and policy statements than on external assurance artifacts,
      leaving a gap between engineering ambition and plant-operator readiness.
    diligencePath: >-
      Request QA manuals, supplier-qualification standards, cyber architecture documents, external audits, and any
      roadmap to nuclear-grade certification or licensing audits.
    relatedQuestionRefs:
      - QE024
    relatedTableRefs:
      - TE004
