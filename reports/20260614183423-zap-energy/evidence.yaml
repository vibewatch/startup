evidenceGaps:
  - type: stale
    severity: material
    topic: headcount
    missingEvidence: A current 2026 employee-count disclosure broken out by site or function.
    whyItMatters: >-
      Headcount is a volatile operating-scale metric and the freshest direct disclosure in reviewed sources still
      clusters around the 2024-2025 period.
    diligencePath: >-
      Request an updated org chart or payroll census by site from management and reconcile it against recruiting plans
      and lab shift coverage.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: A post-money valuation or any priced primary financing terms after the October 2024 Series D.
    whyItMatters: Capital efficiency and investor return potential cannot be judged well without a current valuation anchor.
    diligencePath: >-
      Ask for the latest cap table, board-approved financing documents, and any secondary pricing observations used in
      internal planning.
    relatedQuestionRefs:
      - QO021
      - QO025
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: governance-rights
    missingEvidence: Board composition details, ownership percentages, and investor protective provisions.
    whyItMatters: Public materials show some investor directors but not actual control rights or dilution sensitivity.
    diligencePath: Request the board deck, stockholder agreement summary, and current option-pool / preferred-share schedule.
    relatedQuestionRefs:
      - QO022
      - QO025
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: commercial-customers
    missingEvidence: Named customers, LOIs, or contracting structure for either the future fusion module or the new fission platform.
    whyItMatters: Without customer evidence it is hard to separate technical momentum from bankable demand.
    diligencePath: >-
      Ask management for customer pipeline details, signed MOUs, and any milestone-payment or capacity-reservation
      discussions.
    relatedQuestionRefs:
      - QO020
      - QO025
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: pilot-plant-project-plan
    missingEvidence: A public site, schedule, and capex plan for the DOE-linked pilot plant beyond the approved preconceptual report.
    whyItMatters: The leap from design milestone to buildable pilot is the key commercialization bridge.
    diligencePath: >-
      Request the full milestone report, site-screening matrix, and integrated schedule from pilot design through
      licensing and procurement.
    relatedQuestionRefs:
      - QO012
      - QO016
      - QO025
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: zap-sam-and-pipeline
    missingEvidence: Zap-specific customer pipeline, contracted MW, target segment mix, and backlog conversion assumptions.
    whyItMatters: >-
      Without disclosed buyer concentration and contract structure, public demand signals cannot be converted into a
      defensible Zap-specific SAM or SOM.
    diligencePath: >-
      Request management’s current pipeline by segment, signed NDAs/LOIs/PPAs, target geography, and expected deployment
      sequencing.
    relatedQuestionRefs:
      - QM024
      - QM025
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: zap-unit-economics
    missingEvidence: Public capex, LCOE, balance-of-plant cost, and financing assumptions for Zap’s first commercial plant design.
    whyItMatters: >-
      Commercial viability versus gas, advanced fission, and renewable-plus-storage substitutes depends on cost and
      schedule, which public sources do not disclose for Zap.
    diligencePath: >-
      Obtain plant economics deck, milestone-gated capex model, and sensitivity cases for fuel cycle, availability, and
      financing cost.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM004
  - type: conflicting-data
    severity: material
    topic: commercialization-timing
    missingEvidence: >-
      Independent milestone-based assessment reconciling DOE/NRC commercialization timelines with skeptical views that
      practical fusion power is still far away.
    whyItMatters: >-
      The timing gap changes how much of today’s clean-firm demand can realistically accrue to Zap versus substitutes
      before 2035.
    diligencePath: >-
      Interview independent fusion engineers, licensing experts, and prospective buyers on milestone realism, then
      compare against Zap’s internal schedule.
    relatedQuestionRefs:
      - QM022
      - QM023
  - type: private-evidence-only
    severity: material
    topic: zap-customer-proof
    missingEvidence: Named anchor customers, offtake terms, or development agreements for Zap’s first commercial deployments.
    whyItMatters: >-
      Zap’s relative GTM position versus CFS and Helion depends on whether undisclosed demand exists beyond engineering
      milestones.
    diligencePath: Request customer pipeline, term-sheet summaries, and any utility or hyperscaler engagement memos under NDA.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: tae-customer-proof
    missingEvidence: Named utility, industrial, or hyperscaler counterparties backing TAE’s first-plant development path.
    whyItMatters: >-
      TAE’s siting and supply-chain progress is easier to underwrite if paired with visible demand pull, not just
      internal milestones.
    diligencePath: >-
      Request first-plant counterparty discussions, siting short list, and any non-public memorandum of understanding
      summaries.
    relatedQuestionRefs:
      - QP011
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: fusion-pricing-transparency
    missingEvidence: Published or confidential price, $/MWh, capex, and O&M assumptions across Zap, CFS, Helion, TAE, and Pacific.
    whyItMatters: >-
      Without real commercial economics, comparative readiness can be overstated by MW headlines and funding totals
      alone.
    diligencePath: Request contract economics, project-finance models, and any internal LCOE or tariff materials for first plants.
    relatedQuestionRefs:
      - QP025
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: blocking
    topic: treasury-opacity
    missingEvidence: Current cash on hand, monthly burn, and management runway case by case through fusion and fission milestones.
    whyItMatters: >-
      Without treasury data the chapter cannot test whether disclosed capital is enough to reach the next financing
      trigger without a stressed raise.
    diligencePath: >-
      Request monthly cash bridge, current unrestricted cash, board-approved budget, and downside runway case from
      management.
    relatedQuestionRefs:
      - QI018
      - QI024
      - QI025
    relatedTableRefs:
      - TI005
      - TI006
  - type: missing-source
    severity: material
    topic: customer-payment-structure
    missingEvidence: >-
      Executed term sheets or contracts for any reserved-capacity, milestone-payment, or pre-delivery customer
      commitments.
    whyItMatters: >-
      Near-term revenue quality depends on whether cash would be refundable deposits, milestone payments, or true
      recurring energy revenue.
    diligencePath: Request sample contract language for customer milestones, deposits, reservation fees, and cancellation rights.
    relatedQuestionRefs:
      - QI005
      - QI020
      - QI025
    relatedTableRefs:
      - TI001
      - TI002
      - TI006
  - type: missing-source
    severity: material
    topic: doe-support
    missingEvidence: Zap-specific DOE milestone award dollars, payout cadence, and exact negotiated milestones.
