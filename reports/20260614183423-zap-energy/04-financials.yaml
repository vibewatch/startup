- id: financial-verdict-and-diligence-blockers
  title: 'Financial verdict: public capital supports progress, not full underwriting'
  body: 'Zap looks better funded than many deep-tech companies at a similar technical stage, and the public record shows disciplined use of capital toward engineering milestones rather than only scientific marketing. That is the positive read. The limiting read is that almost every underwriting input that would matter for a real investment model is still missing: revenue, price, margin, customer payment terms, cash, burn, runway, module capex, project-finance strategy, and Zap-specific DOE inflows. The integrated-fission pivot may become a pragmatic bridge to earlier cash generation and a way to build licensing, manufacturing, and supply-chain muscle before fusion is bankable, but it is still strategy rather than reported operating performance. The chapter therefore lands in a middle position: the financing base is real, the engineering progress is real, and the company remains highly dependent on additional external capital and non-dilutive program support before public investors can underwrite
    revenue quality or capital sufficiency with confidence.'
