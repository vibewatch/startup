  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: treasury-opacity
    missingEvidence: Current cash on hand, monthly burn, and management runway case by case through fusion and fission milestones.
    whyItMatters: Without treasury data the chapter cannot test whether disclosed capital is enough to reach the next financing trigger without a stressed raise.
    diligencePath: Request monthly cash bridge, current unrestricted cash, board-approved budget, and downside runway case from management.
    relatedQuestionRefs:
    - QI018
    - QI024
    - QI025
    relatedTableRefs:
    - TI005
    - TI006
  - type: missing-source
    severity: material
    topic: customer-payment-structure
    missingEvidence: Executed term sheets or contracts for any reserved-capacity, milestone-payment, or pre-delivery customer commitments.
    whyItMatters: Near-term revenue quality depends on whether cash would be refundable deposits, milestone payments, or true recurring energy revenue.
    diligencePath: Request sample contract language for customer milestones, deposits, reservation fees, and cancellation rights.
    relatedQuestionRefs:
    - QI005
    - QI020
    - QI025
    relatedTableRefs:
    - TI001
    - TI002
    - TI006
  - type: missing-source
    severity: material
    topic: doe-support
    missingEvidence: Zap-specific DOE milestone award dollars, payout cadence, and exact negotiated milestones.
    whyItMatters: The public announcement confirms program participation but not the amount of non-dilutive funding available to Zap or its timing.
    diligencePath: Request the DOE cooperative-agreement summary or management-prepared milestone payment schedule.
    relatedQuestionRefs:
    - QI014
    - QI025
    relatedTableRefs:
    - TI005
    - TI006
  - type: private-evidence-only
    severity: material
    topic: unit-economics-gap
    missingEvidence: Module capex, expected price per MWh or per reactor, gross margin bridge, availability assumptions, and maintenance burden.
    whyItMatters: Without these inputs there is no public basis to test cost advantage, gross profit, or payback assumptions.
    diligencePath: Request the internal techno-economic model, pilot-plant budget, and sensitivity cases for uptime, capex, and price realization.
    relatedQuestionRefs:
    - QI010
    - QI021
    - QI023
    - QI025
    relatedTableRefs:
