  rows:
  - - Fusion electricity sales
    - Sale of power from ~50 MW modular fusion plants
    - Future / pre-revenue
    - 50 MW per module is public; no customer tariff or revenue disclosed
    - 'Low today: credible end market, no realized pricing or contracts'
    - Request target offtake structure, price per MWh, and commercialization timeline by module
  - - Advanced fission power product
    - Sale or deployment of 10 MWe sodium-cooled reactors / bankable power solutions
    - Planned / pre-revenue
    - Independent coverage says management expects revenue within a year
    - 'Low today: path described, no disclosed contract economics'
    - Request product form factor, contracting model, and first paid-customer milestones
  - - Federal milestone and program payments
    - DOE / DoD or other milestone-based funding support
    - Possible near-term inflow, exact cadence undisclosed
    - Management cited federal programs and milestone payments as revenue sources
    - Medium as cash support; low as proof of commercial demand
    - Request award schedule, revenue-recognition policy, and program concentration risk
  - - Reserved production capacity or customer milestone payments
    - Pre-delivery payments tied to future nuclear capacity
    - Mentioned publicly but terms undisclosed
    - NEI reported reserved-capacity and customer milestone concepts
    - 'Low: could be non-refundable or refundable; unknown quality'
    - Request sample term sheet including refundability, triggers, and accounting treatment
  - - Technology licensing or services
    - Licensing, engineering services, or IP fees
    - No public evidence found
    - No reviewed source described a live licensing business
    - Unavailable / not evidenced
    - Confirm whether any service or licensing revenue exists outside milestone programs
