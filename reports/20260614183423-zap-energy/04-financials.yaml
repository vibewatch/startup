    severity: material
    topic: leverage-structure
    missingEvidence: Any intended debt, export credit, government loan, or project-finance structure for pilot plants or fission deployments.
    whyItMatters: Capital structure determines dilution, covenant risk, and whether commercial deployment can happen without repeated large equity rounds.
    diligencePath: Ask management for financing plans by stage, target lenders or program offices, and key conditions precedent.
