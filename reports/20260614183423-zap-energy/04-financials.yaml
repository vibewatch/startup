- id: gtm-proxies-and-operating-signals
  title: Public GTM proxies point to enterprise and federal selling, not efficient repeatable sales economics
  body: 'Zap’s go-to-market evidence is visible mostly through its hiring pattern, milestone programs, and target end markets rather than disclosed customer funnels. The 2026 strategy language points at AI infrastructure, data centers, industrial users, and federal program offices that need firm clean power, while the careers board shows hiring across growth and partnerships, fission licensing, supply chain, pulsed power, and systems engineering. That combination implies a direct, technical sales motion with long qualification cycles rather than a fast self-serve model. Headcount and hiring are therefore better burn proxies than conventional SaaS-style CAC or payback metrics. Public materials show a progression from more than 60 employees in 2022 to roughly 150 employees or team members by 2024, plus current 2026 openings across both commercial and engineering functions. What they do not show is just as important: there are no disclosed sales-efficiency metrics, no customer-acquisition cost,
    no payback, and no conversion data from milestone conversations to contracted backlog.'
  claimRefs:
  - CI027
  - CI028
  - CI029
  - CI036
  - CI037
  - CI038
  tableRefs:
  - TI003
  figureRefs: []
- id: cost-structure-and-unit-economics
  title: Cost structure is visibly hardware-intensive, while unit economics are still mostly undisclosed
  body: Zap’s public documents make clear that commercialization cost goes far beyond the plasma core. The 2026 DOE-approved design names liquid-metal blanket systems, tritium handling, power conversion, control and safety systems, remote handling, and site infrastructure. The Century paper and the 2024 engineering releases add repetitive pulsed power, liquid-metal heat management, electrode protection, and high-duty-cycle hardware. Those disclosures are useful because they show where capital will be consumed; they do not yet quantify the spend. Zap’s own materials argue that the sheared-flow-stabilized Z-pinch should need much less capital than magnet-heavy or laser-heavy approaches, and the architectural logic is credible because the system avoids superconducting magnets and giant laser complexes. But there is still no public module capex, no plant budget, no LCOE, no gross margin, and no availability case. The result is a chapter where cost-driver visibility is meaningfully ahead of unit-economics
    visibility.
  claimRefs:
  - CI002
  - CI022
  - CI024
  - CI025
  - CI030
  - CI031
  - CI032
  - CI033
  - CI040
  - CI041
  - CI044
