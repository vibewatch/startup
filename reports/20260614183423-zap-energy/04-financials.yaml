    - Request pricing deck or customer pricing assumptions
  - - Gross margin
    - null
    - Core test of revenue quality
    - No public gross-margin or cost-of-service disclosure found
    - Request expected gross-margin bridge for first commercial systems
  - - Availability / duty cycle
    - null
    - Converts peak power claims into saleable energy
    - Century validates repetitive pulsed operation but not commercial uptime
    - Request modeled capacity factor and maintenance downtime assumptions
  - - Fuel-cycle / tritium economics
    - null
    - Critical recurring operating cost for fusion plants
    - DOE design confirms tritium systems matter, not their cost
    - Request fuel sourcing, inventory, and breeding assumptions
  - - Maintenance / electrode replacement
    - null
    - Pulsed systems can shift economics via wear and service labor
    - Century work focuses on electrode protection but no public cost curve exists
    - Request replacement intervals, planned spares, and field-service model
