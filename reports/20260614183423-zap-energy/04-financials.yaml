  - - Price per MWh / reactor / reservation
    - Cannot test willingness to pay or revenue quality
    - No public pricing found
    - Request executed or draft commercial terms and pricing assumptions
  - - Cash on hand
    - Cannot size runway or financing urgency
    - Historical equity raised only
    - Request latest treasury dashboard and restricted-cash schedule
  - - Monthly burn and cash bridge
    - Cannot infer financing trigger timing
    - Headcount and hiring serve only as rough burn proxies
    - Request monthly actuals by R&D, plant engineering, G&A, and commercialization
  - - Pilot-plant / module capex budget
    - Cannot underwrite capital intensity or dilution path
    - Subsystem lists and engineering milestones only
    - Request pilot-plant budget, contingency, and supplier quote status
  - - Gross margin / LCOE model
    - Cannot test long-run economics or valuation inputs
    - Company says simpler architecture should help, but no model is public
    - Request techno-economic model and sensitivity analysis
  - - Customer commitment quality
    - Cannot judge backlog durability or refund risk
    - Reported possibility of reserved capacity or milestone payments
    - Request signed term sheets with cancellation, refund, and milestone clauses
  - - Zap-specific DOE award amount
    - Cannot model non-dilutive cash support
    - DOE disclosed only program-level dollars
    - Request cooperative-agreement summary and payout schedule
  - - Debt / project-finance plan
    - Cannot assess dilution versus leverage mix
    - No public facility found
    - Request financing strategy by program and asset type
  notes: These are the specific private metrics missing from the public record; each gap directly blocks a distinct part of financial underwriting.
