company:
  name: Zap Energy
chapter:
  number: 4
  title: Financials
  summary: Zap has assembled a real public capital base and meaningful DOE-backed engineering milestones, but public evidence still does not disclose revenue, pricing, cash, burn, or plant economics. The financial story is therefore one of funding support and commercialization optionality, not yet one of underwritable revenue quality or capital sufficiency.
sections:
- id: revenue-model-and-monetization
  title: Revenue model and monetization remain mostly forward-looking
  body: 'Zap Energy’s public financial story in 2026 is still a commercialization pathway rather than a booked-revenue story. The clearest long-run model is sale of electricity and related energy infrastructure from compact fusion modules that Zap sizes at about 50 MW net output per module, with future plants using multiple modules. That is a real industrial revenue path, but it is not yet a realized one: the reviewed public record disclosed no current revenue, no ARR, no signed public tariff, and no price per megawatt-hour. The new integrated-nuclear strategy slightly changes the timing story, because management now describes a near-term fission business that could generate revenue before full fusion commercialization through federal programs, milestone payments, and reserved production capacity. Even that nearer-term path remains only partially specified. No public customer contracts, reservation terms, refundable-deposit terms, or milestone-payment schedules were found, so revenue quality
    today should be treated as unproven and pre-contract rather than recurring.'
  claimRefs:
  - CI001
  - CI003
  - CI004
  - CI005
