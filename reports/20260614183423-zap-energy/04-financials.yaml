- id: TI005
  title: Capital adequacy table
  columns:
  - Metric
  - Public value / status
  - Evidence quality
  - Why it matters
  - Diligence ask
  rows:
  - - 2019 seed Form D offering
    - $7.2M offering; $1.1M sold at filing
    - SEC filing
    - Shows earliest documented external capital base
    - Request full seed-to-Series A bridge and cap-table evolution
  - - 2021 offering
    - $27.5M offering
    - SEC filing
    - Documents pre-Series C scale-up financing
    - Request board materials showing how 2021 proceeds were consumed
  - - 2022 Series C / Form D(A)
    - $160.6M original offering; $162.6M on amendment
    - Official announcement + SEC filing
    - Major equity step-up before current platform build-out
    - Request actual close schedule, tranche timing, and remaining proceeds at 2024 raise
  - - 2024 Series D / Form D
    - ~$130.0M offering; 40 investors in Form D
    - Official announcement + SEC filing
    - Latest major dilutive capital source on public record
    - Request close date, net proceeds after fees, and board-approved use-of-funds tracking
  - - Public cumulative funding
    - Official releases say funding surpassed $330M
    - Company release
    - Useful top-line signal, but not a treasury balance
    - Request reconciliation from gross capital raised to current unrestricted cash
  - - DOE milestone-program support
    - $46M across eight companies for first 18 months; Zap-specific share undisclosed
    - DOE announcement
    - Important non-dilutive support channel, but company-level amount is unclear
    - Request Zap-specific award value, paid-to-date amount, and remaining milestones
  - - Current cash on hand
    - null
    - Not publicly disclosed
    - Most important input for runway and financing timing
    - Request latest cash balance and restricted-cash detail
  - - Monthly burn
    - null
    - Not publicly disclosed
    - Determines how quickly current cash converts into next-round pressure
    - Request monthly actuals and 12-month forecast burn
  - - Runway months
    - null
    - Not publicly disclosed
    - Cannot test whether current funding reaches pilot-plant or fission milestones
    - Request base / downside runway cases
  - - Debt or project finance
    - No public facility found
    - Inference from reviewed filings and announcements
    - Capital structure risk remains opaque
    - Request any debt plan, lender conversations, or project-finance roadmap
  - - Next financing trigger
    - Not publicly quantified; likely tied to first plant, licensing, and commercialization milestones
    - Inference from roadmap and disclosures
    - Shows dependence on future external capital
    - Request formal next-round timing, target amount, and milestone dependencies
  notes: The table distinguishes documented historical funding from still-missing treasury metrics; null fields are deliberate evidence gaps, not negative signals by themselves.
