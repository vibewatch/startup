  rows:
  - - Module capex
    - null
    - Determines capital intensity and financing need
    - Company claims lower complexity, but no module or plant capex disclosed
    - Request pilot-plant budget, module BOM, and factory-capex plan
  - - Price realization / tariff
    - null
    - Needed to test contribution margin and customer ROI
