    - null
    - Important for enterprise or reserved-capacity selling
    - No public CAC, conversion, or payback data
    - Request funnel metrics and expected sales-cycle length by customer type
  - - Working capital profile
    - null
    - Hardware businesses can consume cash before revenue recognition
    - No public inventory, receivable, or deposit data found
    - Request expected inventory turns, deposit terms, and receivable assumptions
  notes: Null means unavailable in public evidence, not zero; the table is designed to show where underwriting still lacks a defensible quantitative base.
