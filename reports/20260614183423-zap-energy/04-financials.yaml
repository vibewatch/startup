  - TI004
  figureRefs:
  - FI002
- id: capital-support-and-financing-dependency
  title: Zap has raised substantial equity and won public-program support, but financing dependency remains obvious
  body: 'The strongest public financial evidence is around capital inflow rather than operating output. SEC filings document a 2019 Form D offering of $7.2 million, a 2021 offering of $27.5 million, a 2022 Series C filing that ultimately rose to $162.6 million on amendment, and a 2024 Form D showing a roughly $130.0 million offering. Zap’s own 2024 release says cumulative funding had surpassed $330 million, and DOE’s milestone program contributes another public-private support channel, although the company-specific dollar amount has not been disclosed publicly. That is meaningful funding for research, systems integration, and pilot-plant design. It is not the same as proof of capital adequacy. No public cash balance, burn rate, runway, debt facility, or project-finance plan was found. Sector context matters here: FIA says two-thirds of private fusion companies still expect funding to be a barrier this decade, and MIT Technology Review’s adverse cost analysis argues fusion may not get cheap
    quickly even if the technology works. Those two facts make follow-on financing dependency a core underwriting issue rather than a side note.'
