- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Dimension
  - Bull thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Technical progress
    - Century, FuZE-3, and the DOE milestone show parallel progress in plant engineering and plasma performance.
    - None of those proof points disclose valuation, revenue, or customer economics, so the investment case still depends on future conversion of milestones into a priced market event.
    - A new priced round plus independently legible commercialization data would narrow the gap.
  - - Capital quality
    - Soros-led Series D and cumulative capital above $330M show that Zap can raise serious money.
    - The public record still lacks the current cap table, preferences, and any 2026 mark, so investors cannot judge overhang or dilution discipline.
    - Release of current financing documents and preference terms would materially improve confidence.
  - - Integrated nuclear strategy
    - Fission could diversify timelines and create nearer-term engineering or market pathways.
    - The pivot can also dilute focus, increase regulatory complexity, and create a wider execution surface before fusion economics are proven.
    - Detailed resource allocation, hiring plans, and project-level budgets would clarify whether the pivot is additive or distracting.
  - - Peer framing
    - Public markets have shown willingness to value pre-commercial nuclear stories at billions of dollars.
    - Those same markets also differentiate brutally between pre-revenue option value, modest revenue with heavy losses, and mature profitable operators.
    - Zap needs a clearer position on that continuum via revenue, contracts, or a fresh price.
  - - Private fusion premium
    - Helion shows that a disclosed multi-billion private mark is possible in fusion.
    - Helion paired that mark with more capital and named customer contracts than Zap has disclosed.
    - Zap would need equivalent financing transparency or customer proof to merit a similar premium.
  - - Recommendation
    - Zap remains worth tracking because there is enough evidence for non-zero option value.
    - Current evidence is still too incomplete for a high-conviction buy recommendation.
    - A strong financing event and diligence package are the unlocks.
  notes: The anti-thesis is driven mainly by disclosure gaps and execution breadth, not by dismissal of Zap's technical progress.
