- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Valuation / capital signal
  - Status / proof level
  - Why relevant to Zap
  - Main limitation
  rows:
  - - Zap Energy
    - 2024 Series D of $130M; cumulative funding publicly framed at about $327M-$330M private and nearly $350M including public support; current valuation undisclosed
    - Private fusion developer with Century, FuZE-3, and a DOE-approved pilot-design milestone
    - Direct subject; tests how much option value technical progress can command before public price discovery
    - No disclosed current mark, revenue, or customer economics in retained public sources
  - - Helion Energy
    - 2025 Series F raised $425M at a $5.425B post-money valuation
    - Private fusion company with named Microsoft and Nucor commercial agreements
    - Best retained private-fusion premium anchor for what a disclosed multi-billion mark looks like
    - More capital raised and stronger commercial disclosure than Zap
  - - Oklo
    - ~USD 10.0B public market cap in June 2026
    - Public advanced-nuclear company; filing warns there is no commercial project operating yet
    - Shows how high public option value can run for a pre-commercial nuclear story
    - Public liquidity and fission make it an upper-bound discipline anchor, not a direct fusion comp
  - - NuScale Power
    - ~USD 3.4B-$3.6B public market cap with about USD 18.7M LTM revenue and heavy losses
    - Listed SMR company still trying to convert development work into firm revenue-producing contracts
    - Useful mid-range public comp for a nuclear story with some revenue but still weak earnings power
    - Fission, public capital structure, and different regulatory pathway make it only a directional analog
  - - Centrus Energy
    - ~USD 3.2B public market cap with about USD 452.3M LTM revenue
    - Public nuclear-fuel company with operating history and strategic importance
    - Shows how disclosed revenue and operating history strengthen valuation support versus Zap
    - Fuel-cycle business, not a reactor or fusion developer
  - - BWX Technologies
    - ~USD 17.7B public market cap with about USD 3.38B LTM revenue
    - Mature listed nuclear supplier with established profitability
    - Useful ceiling reference for how big the valuation gap is between a real operating nuclear business and Zap today
    - Too mature and too different to serve as a close operating comp
  - - NANO Nuclear Energy
    - ~USD 1.2B public market cap; 10-K says no revenue since inception
    - Public pre-revenue advanced-nuclear story with small scale and high volatility
    - Best retained lower-bound public option-value analog for a speculative nuclear platform
    - Small-float public trading and microreactor strategy can overstate what private investors should pay
  notes: Rows intentionally mix private fusion and public advanced-nuclear references because no clean public pure-play fusion peer set exists on 2026-06-14.
  enumerationScope:
    coverage: partial
    basis: Rows include the most decision-useful retained private-fusion and public-nuclear valuation anchors for Zap; several other fusion startups still lack usable disclosed valuation data.
