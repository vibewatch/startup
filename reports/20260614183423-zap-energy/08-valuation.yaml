  - CV043
  - CV044
  - CV046
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Current valuation and cap table
    - Latest post-money mark, share classes, liquidation preferences, anti-dilution, and major investor rights
    - Determines whether the underyling risk/reward is attractive or already over-encumbered by preferences
    - Request the latest financing deck, board materials, and full cap table from management or counsel.
  - - 2024 Series D and any 2026 financing terms
    - Exact security type, step-up protections, valuation bridge, and any side letters
    - A strong technology story can still be a weak equity if the financing stack is aggressive
    - Review definitive financing documents and investor rights agreements.
  - - Fusion module economics
    - Target capex per module, expected availability, fuel assumptions, maintenance cadence, and conversion efficiency
    - Without module economics the 50 MW design milestone cannot be translated into valuation support
    - Ask for the internal techno-economic model and third-party engineering review.
  - - Customer and revenue proof
    - Named offtake, LOIs, pilot revenue, or pricing evidence for fusion and for the new fission effort
    - Commercial proof is the cleanest bridge between technical success and a premium valuation
    - Interview counterparties and inspect executed agreements.
  - - Fission program scope
    - Dedicated budget, staffing, regulatory plan, and timeline for the 10 MW sodium-cooled line
    - Needed to judge whether the pivot adds option value or simply widens burn and distraction risk
    - Obtain program plan, staffing chart, and regulator-engagement materials.
  - - Cash runway and burn
    - Current cash balance, monthly burn, and financing plan through the next major technical milestone
    - Determines whether investors are paying for progress or funding an imminent bridge need
    - Request current treasury report and board-approved operating plan.
  notes: These asks are prioritized to move the recommendation from scenario-based observation toward underwritten conviction.
