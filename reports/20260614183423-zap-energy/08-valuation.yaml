tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Decision implication
  rows:
  - - Recommendation
    - Research More; not a clean buy on current public evidence.
    - Wait for fresh price discovery, financing terms, and commercialization disclosure before underwriting upside.
  - - Confidence
    - Medium.
    - There is enough public proof to justify continued diligence, but not enough disclosure to support a precise mark.
  - - Risk rating
    - High.
    - Treat Zap as a long-duration frontier-energy investment with meaningful technology, financing, and scope risk.
  - - Valuation stance
    - Unknown in absolute terms; stretched above low-single-digit billions on current evidence.
    - Any new round offered materially above the public pre-commercial peer range needs unusually strong proof and terms.
  - - Best current method
    - Scenario valuation anchored to milestones and peers, not revenue multiples.
    - Public sources do not disclose the revenue, margin, or runway inputs needed for conventional multiple work.
  - - Upgrade trigger
    - A disclosed next round with strong terms plus customer/economic proof.
    - That combination would convert technical progress into a more defensible valuation anchor.
  - - Primary downside trigger
    - Scope creep, delay, or a weak financing reset.
    - A down-round or evidence that the fission pivot is distracting execution would move the case toward the bear range.
  notes: Recommendation is explicitly price-sensitive and evidence-sensitive; it is not a generic quality score on Zap or on fusion as a field.
