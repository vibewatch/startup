- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Probability signal
  - Present valuation range
  - Key assumptions
  - Key risks
  rows:
  - - Bear case
    - Material risk
    - USD 0.6B-1.0B
    - Fusion timelines slip, the fission pivot absorbs management attention, and the next financing reprices toward the lower public option-value end of nuclear comps.
    - Down-round terms, no customer proof, and widening execution scope.
  - - Base case
    - Most plausible on public evidence
    - USD 1.0B-1.8B
    - Zap keeps hitting engineering milestones and remains financeable, but still lacks public valuation, unit economics, and commercial counterparties.
    - Technical progress outpaces disclosure; upside remains trapped until a new price is discovered.
  - - Bull case
    - Requires several things to go right
    - USD 1.8B-3.0B
    - Century and FuZE milestones convert into a strong next round, DOE milestone progress continues, and investors conclude the fusion-plus-fission strategy is additive rather than distracting.
    - Bull case breaks if the next round is weak, if economics remain opaque, or if the pivot slows fusion execution.
  notes: Ranges are deliberately broad present-value underwriting ranges, not claims about a disclosed market price.
