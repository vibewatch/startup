- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Weak next round
    - A new financing is priced below a defensible base-case range or shows punitive preferences
    - Would imply that private investors value Zap closer to an early-stage option than to a premium fusion platform
    - Re-cut the case toward bear valuation and avoid paying secondary premiums.
  - - Pivot distraction
    - Fission headcount, budget, or narrative clearly outpaces fusion execution without new economics
    - Turns the integrated-nuclear upside into a focus and capital-allocation liability
    - Downgrade the strategic-premium argument immediately.
  - - Milestone slippage
    - Century/FuZE cadence stalls or DOE follow-on milestones slip materially
    - Undercuts the main source of current valuation support, which is technical and engineering momentum
    - Move from research-more to avoid if delays compound with financing opacity.
  - - No disclosure improvement
    - Management still withholds valuation, cap-table, revenue, and customer evidence in the next diligence cycle
    - Leaves the chapter stuck in scenario-only mode with limited underwriting confidence
    - Do not stretch entry price simply because the technical narrative remains interesting.
  - - Commercial proof failure
    - No named counterparties, LOIs, or economics emerge for either fusion modules or the fission program
    - Removes the strongest path to closing the gap with Helion-style premium private valuations
    - Keep Zap on watchlist only and treat upside as speculative option value.
  notes: Triggers focus on observable events that would materially change valuation support, not on generic technology enthusiasm.
