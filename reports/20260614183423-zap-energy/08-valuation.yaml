  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current-valuation
    missingEvidence: Current post-money valuation, share classes, and any 2026 secondary or extension pricing.
    whyItMatters: Without a current mark the recommendation has to stay scenario-based rather than transaction-based.
    diligencePath: Request the latest cap table, board materials, and investor-rights summary from management or counsel.
    relatedQuestionRefs:
    - QV004
    - QV029
    relatedTableRefs:
    - TV004
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Module-level capex, opex, availability, fuel assumptions, and gross-margin bridge for the fusion platform.
    whyItMatters: Those are the minimum inputs needed to test whether public and private peer anchors are too rich or too cheap.
    diligencePath: Obtain the internal techno-economic model and any third-party engineering review.
    relatedQuestionRefs:
    - QV021
    - QV022
  - type: missing-source
    severity: material
    topic: commercial-counterparties
    missingEvidence: Named customer agreements, LOIs, or pricing evidence for fusion modules or the fission program.
    whyItMatters: Commercial proof is the cleanest bridge from milestone progress to a premium valuation.
    diligencePath: Interview counterparties and inspect executed agreements or board-approved pipeline materials.
    relatedQuestionRefs:
    - QV028
  - type: private-evidence-only
    severity: material
    topic: preference-stack
    missingEvidence: Liquidation preferences, anti-dilution provisions, and investor-control rights from the latest financing.
    whyItMatters: Preference overhang can erase headline upside even if the technology progresses.
    diligencePath: Review the financing documents and the current capitalization table.
    relatedQuestionRefs:
    - QV028
    - QV029
  - type: missing-source
    severity: material
    topic: fission-economics
    missingEvidence: Budget, regulatory plan, and target economics for the new 10 MW sodium-cooled reactor effort.
    whyItMatters: The pivot could either add strategic value or consume capital and attention without near-term payoff.
    diligencePath: Request program-level budget, staffing plan, and regulator-engagement timeline.
    relatedQuestionRefs:
    - QV010
    - QV025
