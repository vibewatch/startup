company:
  name: Zap Energy
chapter:
  number: 8
  title: Valuation
  summary: Zap Energy has real technical and commercialization-adjacent proof points—Century systems progress, FuZE-3 plasma gains, and a DOE-approved preconceptual 50 MW-module pilot design—but public evidence still stops short of a current valuation, revenue base, or customer-backed economics. Public advanced-nuclear comparables range from roughly $1.2 billion pre-revenue option-value stories to $17.7 billion mature nuclear suppliers, while Helion's disclosed $5.425 billion post-money round shows what a better-capitalized private-fusion premium looks like. With Zap's 2026 fusion-plus-fission pivot widening execution scope before new price discovery, the most defensible call is research-more with medium confidence, high risk, and a broad base-case underwriting range of about $1.0 billion-$1.8 billion rather than a precise fair value.
sections:
- id: financing-context-and-missing-price-discovery
  title: Financing context and why missing price discovery matters more than the story
  body: Zap's last hard public financing signal is still the October 2024 Series D, not a fresh 2026 valuation event. The retained official and independent sources all agree on the headline size—$130 million—and they place cumulative private funding around $327 million to above $330 million, with a University of Washington feature pushing the broader private-plus-public support figure toward $350 million. That is meaningful capital for a compact-fusion company and it validates that top-tier investors were willing to underwrite the platform after Century launched. But it is still not the same thing as having a current disclosed valuation. In 2026 the company's outward-facing communication shifted toward leadership change, an integrated fission-plus-fusion strategy, and milestone progress rather than toward a new priced round, secondary mark, or updated cap-table disclosure. That gap matters because valuation in frontier energy is a function of both technical progress and the latest willingness
    of capital to price execution risk. Without a disclosed 2026 valuation, investors are really triangulating from stale funding history, peer marks, and public-market analogs rather than underwriting a clean new transaction.
  claimRefs:
