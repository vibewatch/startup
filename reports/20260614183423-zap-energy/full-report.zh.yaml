              Zap 的公开文件清楚显示，商业化成本远不止等离子体核心。2026 年获 DOE 批准的设计点名了液态金属包层系统、氚处理、电力转换、控制和安全系统、远程操作，以及场址基础设施。Century 论文和 2024
              年工程发布又加入了重复脉冲电源、液态金属热管理、电极保护和高占空比硬件。这些披露有用，因为它们显示资本会被哪些地方吃掉；但它们还没有量化支出。Zap 自己的材料认为，剪切流稳定 Z-pinch
              需要的资本应明显低于重磁体或重激光方案；系统避开了超导磁体和巨型激光装置，这套架构逻辑可信。但公开材料仍没有模块资本开支、电站预算、LCOE、毛利率或可用率案例。结果是，本章里成本驱动因素的可见度明显领先于单位经济性的可见度。
