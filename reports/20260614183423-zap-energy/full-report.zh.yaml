      - number: '1.4'
        title: 战略转向与反向信号
        blocks:
          - type: paragraph
            body: >-
              2026 年围绕 Zap 的核心反向问题，已不再是公司有没有有意思的融合物理论点——它有——而是把裂变叠在融合之上，到底会加快商业化，还是稀释商业化。Zap
              自己的解释是连贯的：同一套液态金属、材料、制造和核运营能力可以支撑两条产品线，同时给业务一条更近的部署路径。但最强的独立反应偏怀疑。TechCrunch 明确警告，裂变项目可能变成永久绕路，因为它迫使 Zap
              扛起第二个反应堆平台的成本和复杂度；Neutron Bytes 则认为双轨战略会放大监管、融资和获客负担。


              这些批评重要，是因为 Zap 在投资人最需要硬答案的地方，公开披露仍很薄。公司没有公开当前估值，没有为新的裂变产品线点名商业客户，也没有在 DOE 预概念里程碑之外发布完全可建设的试点电站时间表。这并不否定
              Century、FuZE-3 或发表记录显示出的真实进展；它只是说明，投资价值判断仍以里程碑为前导，而不是以现金流为前导。给后续章节的概览结论是：Zap
              靠技术速度和异常宽的系统思维赢得了关注，但它扩张执行面的速度，也快于治理、客户需求和融资条款等公共证据扩张的速度。
