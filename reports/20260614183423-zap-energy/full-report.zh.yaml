        blocks:
          - type: paragraph
            body: >-
              Zap 最强的竞争论点，是架构简单性叠加正在扩宽的工业故事：紧凑 Z-pinch 概念、液态金属
              know-how，以及一套可以在裂变和融合之间复用工程投资的一体化核能平台。这是真实切入点。但证据还不支持把它称为锁定护城河。CFS 和 Helion 目前在面向买方的 GTM 证据上更强；TAE 和
              Pacific
              正有意识地建立自己的供应链和系统优势；更宽的市场仍有等待的许可，因为独立观察者仍怀疑任何融合路径能多快具备融资条件。因此，护城河耐久性不取决于抽象的等离子体优雅，而取决于谁先积累最难复制的技术栈：电站定义、客户合同、场址控制、并网进展、供应链和监管学习。Zap
              的竞争位置像一个有差异化的可投资挑战者，尤其在简单性若能转化为更快部署时。但它还不像一家已经逃离商业化风险，或已经挤掉买方今天可选替代方案的公司。
