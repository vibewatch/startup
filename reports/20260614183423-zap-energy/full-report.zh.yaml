      - number: '2.2'
        title: 规模测算视角：需求真实存在，但公开 SAM / SOM 仍有边界且不完整
        blocks:
          - type: paragraph
            body: >-
              本次运行中最干净的公开需求数字，来自数据中心和电力需求来源，而不是可信的公开「融合 TAM」供应商模型。DOE 的 LBNL 支持报告称，美国数据中心 2023 年用电约占美国总用电的 4.4%，即 176
              TWh，到 2028 年可能达到 6.7% 至 12%、325 TWh 至 580 TWh。EIA 另行预测，美国用电量将以每年 0.9% 至 1.6% 的速度持续增长到 2050
              年，数据中心服务器能耗是主要因素；关于 EIA 2026 年展望的行业报道称，2026 年美国总电力需求应达到 4,283 billion kWh。即便不假设融合被广泛采用，这个外层需求池也足以影响估值。


              但这些数字并不能生成一个精确到 Zap 的 SAM 或 SOM。公开记录没有披露 Zap 的目标定价、电站资本开支、订单积压，或能让外部分析师把宏观电力需求转换成近期供应商收入的有限服务区域。EIA
              也指出，其建模系统并不针对融合等实验性技术的经济性优化。保持严谨的实用办法，是把宏观电力和数据中心负载视为 TAM 背景，再用真实企业采购行为——例如核能和融合 PPA——作为更窄的 SAM
              代理。即便如此，时间判断的矛盾仍重要：DOE 和 NRC 来源把商业化路径描述在 2020 年代末至 2030 年代中期，而怀疑性报道认为实际融合发电仍要远得多。
