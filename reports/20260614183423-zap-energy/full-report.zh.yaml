      - number: '3.2'
        title: 商业拉力当前更偏向把电站主张与点名买方绑定的同行
        blocks:
          - type: paragraph
            body: >-
              今天最清晰的竞争分野，不是纯等离子体性能，而是上市路径证据。CFS 和 Helion 都把技术叙事与可见商业锚点绑定。CFS 有 Google 200 MW 购电和 Eni 围绕 ARC 超过 $1
              billion 的采购协议；Helion 有 Microsoft 计划中的 50 MW+ 首座电站，以及与 Nucor 的 500 MWe
              工业合作。这些关系重要，因为它们降低了「谁会第一个真的购买？」这一悬在多数融合公司头上的不确定性。Zap、TAE 和 Pacific 各自以不同方式显示可信执行——DOE
              电站设计验证、选址和中性束商业化，或十亿美元园区和用户项目——但保留的公开集合仍显示，它们的点名客户拉力弱于 CFS 或
              Helion。这种差异会转化为分销能力。被点名的超大规模云和工业伙伴，可以在首个商业千瓦时交付很久之前，就加速许可、融资、并网工作和客户教育。
