        title: 图表
        blocks:
          - type: callout
            title: 裂变动作是整个 Zap 投资假设中最大的摇摆因子
            body: >-
              如果双轨战略跑通，Zap
              或许能在许可、液态金属和工业化上压缩学习周期，比只做聚变的同行更快。如果失败，公司就在证明客户付款、场址审批或第一条燃料循环闭合之前，又加上了第二个昂贵反应堆项目。因此，裂变线最好同时视为风险缓释和风险放大器，而不是干净的对冲。
