  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式和变现仍主要指向未来
        blocks:
          - type: paragraph
            body: >-
              Zap Energy 2026 年的公开财务故事，仍是一条商业化路径，而不是一套已入账收入故事。最清晰的长期模式，是从 Zap 规模设定为每模块约 50 MW
              净输出的紧凑融合模块，以及未来使用多个模块的电站中，出售电力和相关能源基础设施。这是一条真实的工业收入路径，但还没有实现：经审阅公开记录没有披露当前收入、ARR、已签公开电价，也没有披露每 MWh
              价格。新的一体化核能战略略微改变了时间叙事，因为管理层现在描述一个近期裂变业务，可以在完整融合商业化之前，通过联邦项目、里程碑付款和预留产能产生收入。即便这条更近的路径也只说明了一部分。公开材料没有发现客户合同、预留条款、可退押金条款或里程碑付款时间表，因此今天的收入质量应被视为未经证明、且处于合同前，而不是经常性收入。
