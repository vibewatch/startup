      - number: '6.3'
        title: 耐久性、集中度和采购摩擦仍是核心开放问题
        blocks:
          - type: paragraph
            body: >-
              Zap 仍处于商业化前阶段，常规客户耐久性信号在公开材料中几乎完全缺失。没有披露活跃客户数，没有公开 PPA 或预留订单簿统计，没有 NRR 或 GRR，没有流失或续约数据，也没有 cohort
              式满意度证据。这迫使投资人从买方紧迫性和项目参与，而不是从重复购买行为来推理。商业上行很容易表述：超大规模云厂商正从抽象的可再生能源 PPA 转向为新增电力做直接基础设施交易，防务用户需要韧性能量安全，DOE
              的商业化战略也明确依靠公私合作结构。但摩擦同样清楚。数据中心采购正变得更重标准和披露；即便融合享有比裂变更有利的框架，仍需要大量监管互动；Zap 选择的裂变设计还从被放弃的 4S
              谱系继承了真实许可和验证工作。反向来源把问题说得更尖锐：它们质疑一家公司能否同时为两种先进核能产品锁定客户，以及双轨战略会不会在真正商业订单出现前变成更长的绕路。在点名买方、合同结构和重复采购数据变得可见之前，扩张和集中度仍将由论点驱动，而不是由证据证明。这些基础项缺位，也让交叉销售和扩张逻辑无法被公开验证：投资人看不出
              Zap 是否正在培育一本多元化的早期买方账簿，还是未来收入桥梁只依赖一两个愿意出资支持首创部署的大型交易对手。
