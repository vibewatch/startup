      - number: '8.2'
        title: 技术证明真实存在，但商业化距离仍主导估值
        blocks:
          - type: paragraph
            body: >-
              Zap 已经不只是一个纯科学项目。Century 最初是面向电厂相关子系统的 100 千瓦工程平台，后来提升到每五秒一次发射、约 39 千瓦平均功率，并在 DOE
              认证的一次活动中连续完成超过一千次等离子体发射。FuZE-3 随后用三电极架构达到 830 MPa 电子压力，即约 1.6 GPa 总等离子体压力，该架构旨在改善加速和压缩控制。2026 年 5 月，DOE
              批准了 Zap 约 50 MW 净电模块的聚变试点电厂预概念设计里程碑。这些都是牛市情形下有意义的输入，因为它们表明 Zap
              没有等一个终局式证明点出现，才开始推进电厂架构。即便如此，同一批公开来源仍没有触及核心估值障碍：它们没有披露当前收入、毛利率、现金消耗、已签商业包销，或新裂变线的经济性。结果是，Zap
              看起来明显比创意阶段的聚变初创更先进，但对传统收入或 EBITDA 倍数估值来说，仍太早、也太不透明。
