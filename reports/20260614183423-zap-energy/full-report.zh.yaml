      - number: '8.3'
        title: 同行锚点只能支撑宽情景区间，无法给出精确估值
        blocks:
          - type: paragraph
            body: >-
              可比分析有助于设边界，但边界很宽。Helion 2025 年 1 月 Series F 是最清晰的私营聚变溢价参考，因为它同时披露了 $425 million 融资和 $5.425 billion
              投后估值，并附带具名客户协议。公开先进核能参照更分散。Oklo 2026 年 6 月市值约 $10.0 billion，尽管它提醒投资者，公司正在追逐一个尚无商业项目运营的新兴市场。NuScale 市值约
              $3.4-$3.6 billion，同时只有约 $18.7 million 往绩收入且亏损沉重。Centrus 以约 $452 million 收入对应约 $3.2 billion 市值，BWXT 以约
              $3.38 billion 收入对应近 $17.7 billion 市值，显示披露收入和运营历史会怎样支撑估值。低端来看，NANO Nuclear 尽管 10-K 称自成立以来没有产生收入，仍有约 $1.2
              billion 市值。这些锚点说明，公开市场愿意为核能故事支付有意义的期权价值；但它们也显示，一旦收入、客户合同或成熟执行记录出现，溢价会迅速变化。因此，除非出现新的私募市场价格发现，Zap
              可防守的区间必须保持宽泛，并显著低于 Helion。
