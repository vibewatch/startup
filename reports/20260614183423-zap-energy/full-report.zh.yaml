chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、技术与商业模式
        blocks:
          - type: paragraph
            body: >-
              Zap Energy 是一家美国私营核技术公司，总部位于华盛顿州 Everett，2017 年由 Benj Conway、Brian Nelson 和 Uri Shumlak
              创立。它的起源很重要，因为公司并不是从零提出一个全新的物理概念：经审阅的第三方和官方来源都把这家公司直接指向 University of Washington 的剪切流稳定 Z-pinch
              工作。这种构型旨在约束等离子体，同时避开其他融合项目使用的大型超导磁体组或激光阵列。这个起点解释了两件事：Zap
              为什么会提出异常紧凑的反应堆论点，也解释了它为什么长期强调脉冲电源工程、液态金属热处理，以及在一代代 FuZE 装置上快速迭代。


              截至 2026 年本次运行日期，Zap 已不再只把自己包装成一家融合初创公司。它当前材料强调一套覆盖融合、裂变，并最终覆盖混合系统的一体化核能平台。核心融合商业模式仍是把约 50 MW
              净电输出的紧凑模块商业化，但管理层现在认为，近期裂变部署可以在融合完全具备融资条件之前，先把液态金属、先进材料、模块化制造和电网级电力系统中的重叠能力变现。落到尽调，公司身份已经分成两层：一层是仍由物理驱动、且有真实发表记录的融合开发商；另一层是更宽的核能平台故事，意在加速部署，并吸引与电力需求增长同向的资本。
