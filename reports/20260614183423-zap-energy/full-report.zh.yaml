  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：Zap 重叠的是稳定清洁电力瓶颈，不是整个电力市场
        blocks:
          - type: paragraph
            body: >-
              Zap 自己的定位让边界问题格外重要。公司仍把核心使命描述为把剪切流稳定 Z-pinch
              融合商业化，但也认为能源转型不能只等融合，因此正扩展为覆盖先进裂变、融合和混合系统的一体化核能平台。这个动作在分析上很关键：它说明相关市场既不是抽象的「融合研究」，也不是全部电力需求。更近的商业任务，是在间歇性、电网拥堵和基础设施时点成为硬约束的场景里，供应可靠的零碳电力。


              这个边界应包括买方同时看重可靠性、可选址性和碳属性的稳定清洁电力用例：超大规模数据中心负载、公用事业或独立发电商采购，以及需要可调度供给的部分工业或能源社区站点。应排除会夸大 TAM
              的类别，例如全部美国电力支出、全部 AI 基础设施资本开支，或每一种核能相邻工程活动。现状替代方案也属于市场定义之内，因为它们能更早完成同一项任务：天然气、先进裂变或
              SMR，以及搭配储能和灵活性的可再生能源组合。因此，公开证据更支持用「稳定清洁电力瓶颈」来理解 Zap，而不是泛泛宣称一个「巨大能源市场」。
