      - number: '7.4'
        title: 融资、领导层和里程碑滑坡是击穿投资假设的变量
        blocks:
          - type: paragraph
            body: >-
              财务风险和团队风险仍然绑在一起。Zap 确实融到过真金白银——公开口径超过 $330 million，其中包括 $130 million Series
              D——这些资金也支撑了可信的工程进展。但在公司正式加入裂变之前，这些融资已经同时支撑等离子体研发和电厂工程工作。第二个反应堆项目会在公开收入出现之前，先抬高烧钱速度和执行负荷。行业背景让问题更难，而不是更容易：FIA
              称当前美国聚变资金仍不足以支撑十年尺度部署；MIT Technology Review 则引用研究提示，聚变未必会享有投资者常假设的快速降本曲线。领导层变化部分缓解了这个问题。Zabrina Johal
              的运营背景比原先只有创始人的班底更适合部署和许可；Daniel Walter 加入也补上了相关裂变深度。即便如此，2026 年过渡也暴露出一个现实问题：Zap
              仍在搭建一套管理和工程班底，用来同时商业化两个核平台。因此，可投资判断必须带条件。若 DOE 里程碑持续兑现、客户预付款变成现实、NRC
              和具体场址许可按期推进，这一战略可能显得有先见之明。若这些信号停滞，投资假设会迅速破裂，因为产品市场证明出现之前，融资依赖会先回到台面。
