  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: Zap 竞争的是多种融合架构，而不是一张扁平同行名单
        blocks:
          - type: paragraph
            body: >-
              Zap 的直接竞争集合异常异质，因为「融合公司」还不是一个商业产品类别。Zap 自己的卖点集中在剪切流稳定 Z-pinch，声称硬件复杂度低于依赖大量磁体的 tokamak 或激光驱动系统；Helion
              销售带直接电力回收的 field-reversed-configuration 发电机；CFS 销售带 HTS 磁体和大型中央电站的 tokamak 路径；TAE 主张中性束支撑的紧凑 FRC
              路径；Pacific Fusion 则在打造源自惯性融合概念的脉冲磁惯性系统。这些差异不是表面差异。它们意味着不同的首座电站占地、燃料循环、供应链、运营模式和时间表。Zap 2026 年获 DOE
              批准的预概念电站里程碑重要，因为它把公司从「有意思的等离子体物理」推向一个已定义的、每模块 50 MW 的电站概念。但这并不抹掉一个事实：如果其他方案能更早或以更低项目风险解决同一个稳定电力问题，买方可以把
              Zap 与非常不同的融合架构相比，也可以与非融合替代方案相比。
