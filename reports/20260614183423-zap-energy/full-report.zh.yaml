      - number: '1.3'
        title: 资本基础与里程碑节奏
        blocks:
          - type: paragraph
            body: >-
              Zap 最强的外部可读证据，不是某一个单独的等离子体结果，而是融资、工程和电站设计里程碑怎样一层层叠上去。最近披露的融资仍是 2024 年 10 月由 Soros Fund Management 领投的 $130
              million Series D，使已披露融资超过 $330 million；2026 年 3 月 University of Washington 的一篇专题称，更广义的私人和公共支持接近 $350
              million。对于紧凑型融合开发商，这些数字有分量；但更重要的推论是钱花到了哪里：不只是等离子体实验，还包括 Century 系统集成、更激进的脉冲电源栈，以及与 DOE 相关的试点设计流程。


              这套里程碑节奏异常并行。Century 先证明 Zap 可以运行带液态金属和脉冲电源的高重复频率工程平台，随后扩展到数千次放电和明显更高的平均功率；FuZE-3 接着用新的三电极架构把等离子体压力推高；DOE
              项目又批准了一个预概念试点电站设计，已经覆盖氚处理、维护、安全和电力转换。换句话说，Zap
              正试图压缩许多融合开发商会拉长排序的工作：科学验证、电站系统工程和商业化架构。好处是学习循环更快。坏处是，私人投资人仍在被要求支持一家估值、客户承诺和实际建设时间表都只披露了一部分的公司。
