  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 剩余风险热力图显示，Zap 最尖锐的敞口不是单一的二元等离子体结果，而是双轨推进拉伸、许可节奏、客户预付款不确定性和资本强度。
    data:
      columns:
        - 低可能性
        - 中等可能性
        - 高可能性
        - 已确认 / 活跃
      rows:
        - label: 关键影响
          values:
            - label: ''
              tone: neutral
            - label: 4S 权利 / FTO 缺口
              tone: warning
            - label: 客户预付款缺口；第二平台烧钱上升
              tone: critical
            - label: 聚变许可仍未最终落定
              tone: critical
        - label: 高影响
          values:
            - label: 公开诉讼意外
              tone: neutral
            - label: 燃料循环采购方案延迟；DOE 里程碑依赖
              tone: warning
            - label: Century 到电站的规模化；电极耐久性
              tone: warning
            - label: 双轨执行拉伸
              tone: critical
        - label: 中等影响
          values:
            - label: 领导层交接失手
              tone: neutral
            - label: 微型反应堆赛道拥挤
              tone: neutral
            - label: 聚变成本曲线不及预期
              tone: warning
            - label: 未披露具名客户
              tone: warning
        - label: 较低影响
          values:
            - label: ''
              tone: neutral
            - label: 支持性媒体叙事消退
              tone: neutral
            - label: 管理层精力被 GTM 占用
              tone: neutral
            - label: ''
              tone: neutral
