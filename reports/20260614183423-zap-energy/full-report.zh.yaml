      - number: '5.2'
        title: 架构与运营模式
        blocks:
          - type: paragraph
            body: >-
              技术上，Zap 的架构不同寻常，因为等离子体会生成自己的约束磁场。电流穿过等离子体柱产生
              pinch，剪切轴向流则让等离子体柱稳定足够久，使其在没有外部超导磁体、低温系统或巨型激光阵列的情况下升温和压缩。公开证据显示出清晰的装置序列。FuZE 建立了温度和中子产生可信度。FuZE-Q
              把电流和储能推向面向 breakeven 的运行。FuZE-3 增加第三个电极，并把加速与压缩分开控制，提高密度和压力的可调性。与此同时，Century
              把这套物理栈转译为电站子系统：重复脉冲电源、流动液态铋壁、取热和侵蚀缓解硬件。Zap 2026 年 DOE
              设计里程碑进一步把架构扩展为完整电站模型，纳入氚系统、电力转换、远程操作，以及控制和安全系统。因此，运营模式不只是「证明等离子体」，而是「同时共研反应堆核心和周边工业系统」。
