  - id: FV004
    title: 投资 KPI
    type: kpi
    summary: 仅基于保留公开证据，按 1–5 分给出的 IC 风格评分。
    data:
      items:
        - label: 市场机会
          score: 4
          detail: 聚变和更广泛的核能需求叙事规模很大，且越来越有政策背书。
        - label: 技术验证
          score: 3
          detail: Century、FuZE-3 和 DOE 里程碑都有意义，但仍处于商业化前。
        - label: 商业验证
          score: 1
          detail: 保留来源未披露客户支持的收入或定价购电 / 承购安排。
        - label: 资本获取
          score: 3
          detail: Series D 质量很强，但 2026 年没有新的价格发现。
        - label: 执行聚焦
          score: 2
          detail: 聚变加裂变的转向在经济性公开前扩大了范围。
        - label: 估值支撑
          score: 2
          detail: 同业锚点有帮助，但 Zap 特定估值输入仍然很薄。
        - label: 证据质量
          score: 2
          detail: 证据足够支撑观察立场，不足以支撑高确信买入。
    approximationNotes: 评分是基于公开证据的相对判断，不是机器生成的排名。
    claimRefs:
      - CV033
      - CV034
      - CV039
      - CV040
      - CV041
      - CV044
      - CV053
