  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资背景，以及为什么缺失价格发现比故事本身更重要
        blocks:
          - type: paragraph
            body: >-
              Zap 上一次硬性的公开融资信号仍是 2024 年 10 月 Series D，而不是新的 2026 年估值事件。保留下来的官方和独立来源在核心规模上说法一致——$130 million——并把累计私人融资放在约
              $327 million 到超过 $330 million；University of Washington 的一篇特写则把更宽的私人加公共支持金额推向近 $350
              million。对一家紧凑型聚变公司来说，这是一笔有分量的资本，也证明 Century 启动后，顶级投资者仍愿意承销这个平台。但这仍不等于公司拥有一项当前已披露估值。2026
              年，公司对外沟通转向领导层变化、裂变加聚变的一体化战略，以及里程碑进展，而不是新一轮定价融资、二级市场标记或更新后的股权结构披露。这个缺口很关键，因为前沿能源估值既取决于技术进展，也取决于资本最近愿意怎样为执行风险定价。没有披露的
              2026 年估值，投资者实际只能用过期融资历史、同行标记和公开市场类比来三角定位，而不是承销一笔干净的新交易。
