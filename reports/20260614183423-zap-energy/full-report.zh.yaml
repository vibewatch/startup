      - CV042
      - CV049
      - CV053
      - CV054
  - id: TV002
    title: 投资论点 / 反论点表
    columns:
      - 维度
      - 多头论点
      - 反论点
      - 哪些证据会改变判断
    rows:
      - - 技术进展
        - Century、FuZE-3 和 DOE 里程碑显示，电站工程与等离子体性能在并行推进。
        - 这些证明点都没有披露估值、收入或客户经济性，因此投资案例仍取决于未来能否把里程碑转成一次有价格的市场事件。
        - 新一轮有定价融资，加上外部可读的商业化数据，会缩小这一缺口。
      - - 资本质量
        - Soros 领投的 Series D 和超过 $330M 的累计资本，说明 Zap 能融到大钱。
        - 公开记录仍缺少当前股权结构、优先权以及任何 2026 年估值标记，投资人无法判断股权包袱或稀释纪律。
        - 释放当前融资文件和优先权条款，会显著提高置信度。
      - - 一体化核能战略
        - 裂变可能分散时间线，并创造更近端的工程或市场路径。
        - 在聚变经济性得到证明前，这一转向也可能稀释焦点、增加监管复杂度，并拉宽执行面。
        - 详细的资源分配、招聘计划和项目级预算，会说明这一转向是在加分还是分心。
      - - 同业框架
        - 公开市场已经显示，愿意给未商业化核能故事数十亿美元估值。
        - 但同一市场也会残酷地区分：收入前期权价值、收入有限且亏损沉重、以及成熟盈利运营商。
        - Zap 需要靠收入、合同或新的价格，在这条连续谱上找到更清晰的位置。
      - - 私有聚变溢价
        - Helion 说明，聚变公司可以披露数十亿美元级私有估值。
        - Helion 的估值背后，有比 Zap 已披露更多的资本和具名客户合同。
        - Zap 需要同等级别的融资透明度或客户证明，才配得上类似溢价。
      - - 建议
        - Zap 仍值得跟踪，因为证据足以支持非零期权价值。
        - 现有证据仍过于不完整，不足以给出高确信买入建议。
        - 强劲融资事件和尽调资料包是解锁点。
    notes: 反论点主要来自披露缺口和执行范围，而不是否定 Zap 的技术进展。
    claimRefs:
