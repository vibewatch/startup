              Zap 的上市证据主要通过招聘结构、里程碑项目和目标终端市场可见，而不是通过已披露客户漏斗可见。2026 年战略语言指向 AI
              基础设施、数据中心、工业用户和需要稳定清洁电力的联邦项目办公室；招聘页面则显示公司正在增长与合作、裂变许可、供应链、脉冲电源和系统工程上招人。这组信号意味着一种直接、技术型销售动作，资格确认周期长，而不是快速自助模式。因此，员工数和招聘比传统
              SaaS 式 CAC 或回本指标更适合作为 burn 代理。公开材料显示，员工从 2022 年超过 60 人，增长到 2024 年约 150 名员工或团队成员，2026
              年当前岗位也横跨商业和工程职能。同样重要的是它们没有显示的内容：没有披露销售效率指标、获客成本、回本周期，也没有从里程碑对话转成合同订单积压的转化数据。
