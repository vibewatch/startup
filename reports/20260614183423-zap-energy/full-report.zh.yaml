      - number: '1.2'
        title: 领导层、治理与关键人物风险
        blocks:
          - type: paragraph
            body: >-
              领导层是 Zap 2026 年最清晰的变化之一。Zabrina Johal 已接任 CEO，联合创始人 Benj Conway 转任总裁，这让 Conway
              从公众门面和首席募资人，转向战略和长期技术守门人。这次变化看起来不是表面调整：当前公告把 Johal
              到任与一体化裂变加融合战略、新核工程招聘，以及关于工业化而不仅是实验室进展的话术放在一起。公开可见的创始人仍覆盖公司的关键知识域——Conway 负责战略资本形成，Brian Nelson 负责装置工程，Uri
              Shumlak 负责底层等离子体物理——但运营班底已经比最初三位创始人更宽。


              班底变宽，并不消除集中风险。Zap 的技术可信度仍高度依赖 Shumlak / Nelson 谱系；商业转向则高度依赖 Johal、Matthew Thompson，以及 Marvi Matos
              Rodriguez 等其他规模化运营者。治理披露仍不完整：公开材料显示至少有一名来自 Addition 的投资人董事，并突出 Lowercarbon
              相关代表，但没有披露持股比例、投票权或当前完整董事会组合。对投资人来说，这意味着领导层叙事足以支撑商业化故事，但若不直接尽调董事会结构和保护性条款，控制权动态仍过于不透明，无法承销。
