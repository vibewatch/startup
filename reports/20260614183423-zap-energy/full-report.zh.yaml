  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管和许可风险仍是一阶依赖
        blocks:
          - type: paragraph
            body: >-
              Zap 已跨过一个有意义但很窄的监管闸门：DOE 于 2026 年 5
              月批准了公司的预概念融合试点电站设计，方案现在覆盖氚处理、液态金属包层、安全系统、远程维护和电站基础设施，而不只是等离子体实验。这很重要，因为它说明公司在像电站开发商那样思考。但这不意味着电站已经获得许可、融资或售出。与此同时，NRC
              2026 年融合机器规则制定确认，美国融合监管仍在通过 Part 30 式材料框架演进，最终规则预计 2027 年出台，因此 Zap
              仍暴露在一条它无法控制的时间线上。新的裂变产品线会放大这一现实：管理层认为公司可以复用监管学习，但裂变仍会增加单独的许可负担和场址特定安全论证。法律图景在公开材料中也只解决了一部分。Zap 明显拥有真实的 SFS
              Z-pinch 专利和源自大学的技术谱系，但经审阅公开来源没有记录复兴的 4S 衍生裂变设计背后的精确权利包。实际结论是，监管正在朝对 Zap 有利的方向移动，但公司在融合上仍未获许可，在裂变上仍未获许可，IP
              来源也不够公开透明，不能说法律风险已经关闭。
