  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 估值 / 资本信号
      - 状态 / 证明水平
      - 与 Zap 的相关性
      - 主要局限
    rows:
      - - Zap Energy
        - 2024 年 Series D 融资 $130M；公开口径称私有累计融资约 $327M-$330M，若计入公共支持接近 $350M；当前估值未披露
        - 私有聚变开发商，拥有 Century、FuZE-3 和 DOE 批准的试点设计里程碑
        - 直接研究对象；检验在公开价格发现前，技术进展能支撑多少期权价值
        - 保留的公开来源没有披露当前估值标记、收入或客户经济性
      - - Helion Energy
        - 2025 年 Series F 以 $5.425B 投后估值融资 $425M
        - 私有聚变公司，拥有具名的 Microsoft 和 Nucor 商业协议
        - 保留样本中最佳的私有聚变溢价锚，展示披露的数十亿美元估值长什么样
        - 融到更多资本，商业披露也强于 Zap
      - - Oklo
        - 2026 年 6 月公开市值约 USD 10.0B
        - 公开上市的先进核能公司；申报文件提示尚无商业项目在运营
        - 显示未商业化核能故事的公开期权价值可以跑到多高
        - 公开流动性和裂变属性使其更像上限约束锚，而不是直接聚变可比对象
      - - NuScale Power
        - 公开市值约 USD 3.4B-$3.6B，LTM 收入约 USD 18.7M，且亏损沉重
        - 上市 SMR 公司，仍在尝试把开发工作转成能产生收入的确定合同
        - 对已有少量收入但盈利能力仍弱的核能故事，是有用的中档公开可比对象
        - 裂变、公开资本结构和不同监管路径，使其只能作为方向性类比
      - - Centrus Energy
        - 公开市值约 USD 3.2B，LTM 收入约 USD 452.3M
        - 公开上市核燃料公司，有运营历史和战略重要性
        - 说明相比 Zap，披露收入和运营历史会如何增强估值支撑
        - 属于燃料循环业务，不是反应堆或聚变开发商
      - - BWX Technologies
        - 公开市值约 USD 17.7B，LTM 收入约 USD 3.38B
        - 成熟上市核能供应商，盈利能力已确立
        - 有助于校准真实运营核能业务与当前 Zap 之间的估值差距有多大
        - 过于成熟，业务差异也太大，不能作为贴近的运营可比对象
      - - NANO Nuclear Energy
        - 公开市值约 USD 1.2B；10-K 称自成立以来没有收入
        - 公开上市的收入前先进核能故事，规模小、波动高
        - 保留样本中最好的下限公开期权价值类比，适用于投机性核能平台
        - 小流通盘公开交易和微反应堆战略，可能高估私有投资人应付价格
    notes: 表中有意混合私有聚变和公开先进核能参照，因为截至 2026-06-14，不存在干净的公开纯聚变同业组。
