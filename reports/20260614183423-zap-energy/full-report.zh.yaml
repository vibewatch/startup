      - number: '2.4'
        title: 增长驱动与约束：需求拉力升温快于商业化确定性
        blocks:
          - type: paragraph
            body: >-
              几个顺风因素很清楚。AI 带动的数据中心增长正在抬升绝对电力需求。企业和公用事业买方现在愿意在完整船队成熟前，围绕稳定清洁电力签订单和 PPA，因为全天候零碳供应具备战略价值，也能补足可变可再生能源。DOE 的
              Liftoff 框架和 NRC 的融合规则制定，也让政策与监管工作更具体，从而削弱了一个经典商业化反对意见。纸面上，这组因素为任何能用模块化单元交付可调度清洁电力的技术，提供了强市场背景。


              闸门因素同样重要。融合在氚、锂、高功率电子和特种材料上仍有未解决的工业瓶颈；首创核能项目在成本可预测性和进度确定性上仍吃力；UCS
              认为，一些替代路径，尤其是天然气支撑的扩张，在近期仍更便宜或更容易采购，即便它们会恶化长期气候和费率支付者结果。怀疑性报道更进一步，认为融合热度跑在技术证据前面。对尽调来说，含义不是需求不存在，而是需求先于供应商层面的捕获证据到来。因此，Zap
              与估值相关的市场论证，少取决于「是否需要稳定清洁电力？」，更多取决于「Zap 能否把这种需求变成可许可、可融资、可重复的部署，并且时间表跑赢替代方案？」
