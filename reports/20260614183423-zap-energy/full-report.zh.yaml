  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 评估
      - 决策含义
    rows:
      - - 建议
        - 继续研究；基于现有公开证据，还不是清晰买入标的。
        - 等待新的价格发现、融资条款和商业化披露后，再承销上行空间。
      - - 置信度
        - 中。
        - 公开证据足以支持继续尽调，但披露还不足以支撑精确估值标记。
      - - 风险评级
        - 高。
        - 将 Zap 视为长周期前沿能源投资，技术、融资和范围风险都不低。
      - - 估值立场
        - 绝对估值未知；基于现有证据，超过低个位数十亿美元会显得拉伸。
        - 任何显著高于公开未商业化同业区间的新融资，都需要异常强的证据和条款支撑。
      - - 当前最佳方法
        - 以里程碑和同业为锚的情景估值，而不是收入倍数。
        - 公开资料未披露收入、利润率或现金 runway，无法做传统倍数分析。
      - - 上调触发点
        - 披露条款强劲的下一轮融资，同时拿出客户或经济性证明。
        - 这组证据会把技术进展转化为更站得住的估值锚。
      - - 主要下行触发点
        - 范围蔓延、延误，或一轮疲弱的融资重定价。
        - 如果出现降价轮，或有证据显示裂变转向正在分散执行力，案例会滑向熊市区间。
    notes: 该建议明确取决于价格和证据，并不是对 Zap 或聚变赛道的泛化质量打分。
    claimRefs:
