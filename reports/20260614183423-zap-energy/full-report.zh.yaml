      - number: '3.3'
        title: 替代方案和自建选项让买方早期不必单押一家
        blocks:
          - type: paragraph
            body: >-
              Zap 不只是在与其他融合初创公司竞争。它也在与等待、自建，或用更熟悉技术解决同一稳定电力问题的选项竞争。Zap
              新的一体化裂变加融合表述，直接承认了这个现实。对超大规模云厂商、公用事业或工业买方来说，相关问题不是「哪个融合 logo
              赢？」，而是「哪种电源能在要求的时间表内，以可接受的土地使用、电网约束和监管风险，交付清洁稳定电力？」因此，SMR
              是真正的替代类别，不只是市场邻近项。独立来源称，数据中心需求正跑赢电网扩张，决策者正在积极评估紧凑、全天候、低碳的替代方案，尽管 SMR
              仍未在规模上得到证明。这种替代压力会提高每一家融合公司的切换成本。一旦买方围绕某一路径开始选址、并网、监管和燃料循环工作，回头成本就很高。因此，许多买方可以理性地推迟承诺，或并行运行多个选项，而不是过早押注单一融合架构。
