      - number: '5.4'
        title: 差异化、IP 与信任 / 合规
        blocks:
          - type: paragraph
            body: >-
              Zap
              最清晰的差异化，是架构简单性配上一套可见的内部工程栈。公司可以可信地显示，它不只在发表等离子体进展，也在建重复脉冲电源硬件、液态金属测试系统，以及围绕电极几何、运行参数调优和可再生或受保护电极概念的专利组合。独立来源也验证这一路径已经超出
              slideware：2020 年反应堆论文、2024 年整机建模、IEEE 脉冲电源工作，以及关于 FuZE-3 和 Century 的外部报道，都支撑它是一项真实技术项目。信任和合规证据更薄。NRC 2026
              年融合框架令人鼓舞，因为它给近期机器提供了更清晰的许可路径；但它也凸显氚库存、应急准备、废物处置和电站级安全审查仍是真实闸门。公开招聘显示 EHS、QA
              和核安全岗位，网站也发布了隐私政策，但仍没有公开的第三方质量、网络安全或运行许可证包。反向报道提出更硬的问题：融合经济性可能学得很慢，而 Zap 新的裂变轨道既可能强化商业化肌肉，也可能稀释融合聚焦。
