  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 目标买方清晰，但实际商业客户尚未公开点名
        blocks:
          - type: paragraph
            body: >-
              Zap 2026 年的公开商业叙事，围绕的是它想卖给谁，而不是一张已经披露的电力买方名单。官方公告、CEO 交接发布和独立报道都落在同一组分层上：分布式和并网工业负载、AI
              基础设施等数据密集型应用，以及政府或防务相邻的韧性电力需求。在这个框架里，买方通常是大型能源决策者、基础设施发起方或政府项目经理；用户是能源饥渴场址或平台的运营者；付款方可以是联邦里程碑项目、未来预留产能的交易对手，或最终承载反应堆的客户。这一点重要，因为证据基础最强的是需求强度和买方逻辑，而不是销售成交。Zap
              实际上在告诉投资人，电力稀缺、AI
              增长、工业电气化和国家安全会为紧凑型核能系统创造需求，但它尚未把这一论点与被点名的公用事业、超大规模云厂商或工业购电方绑定。因此，公开记录支持目标客群和目标用例存在，但仍把实际终端客户转化视为未来工作。
