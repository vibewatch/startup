  - id: TV005
    title: 论点破裂与终止触发点表
    columns:
      - 触发点
      - 阈值
      - 对论点的传导
      - 行动含义
    rows:
      - - 下一轮疲弱
        - 新融资价格低于可辩护的基准区间，或出现惩罚性优先权
        - 意味着私有投资人更把 Zap 视为早期期权，而不是高溢价聚变平台
        - 将案例重切到熊市估值，并避免支付二级市场溢价。
      - - 转向分心
        - 在没有新经济性的情况下，裂变团队、预算或叙事明显跑在聚变执行前面
        - 把一体化核能上行空间变成焦点和资本配置负担
        - 立即下调战略溢价论点。
      - - 里程碑滑坡
        - Century/FuZE 节奏停滞，或 DOE 后续里程碑实质性滑后
        - 削弱当前估值支撑的主要来源，即技术和工程动能
        - 如果延误叠加融资不透明，将建议从继续研究转为回避。
      - - 披露没有改善
        - 下一个尽调周期里，管理层仍不披露估值、股权结构、收入和客户证据
        - 章节会继续卡在只做情景的模式，承销置信度有限
        - 不要只因为技术叙事仍有意思，就拉高入场价格。
      - - 商业证明失败
        - 聚变模块或裂变项目都没有出现具名交易对手、LOI 或经济性
        - 最强的路径被移除，即缩小与 Helion 式高溢价私有估值的差距
        - 只把 Zap 留在观察名单，把上行空间视为投机性期权价值。
    notes: 触发点聚焦会实质改变估值支撑的可观察事件，而不是泛泛的技术热情。
    claimRefs:
      - CV039
      - CV041
      - CV043
      - CV044
      - CV046
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 当前估值和股权结构
        - 最新投后估值、股份类别、清算优先权、反稀释条款和主要投资人权利
        - 决定底层风险 / 回报是否有吸引力，还是已被优先权压得过重
        - 向管理层或法律顾问索取最新融资 deck、董事会材料和完整股权结构表。
      - - 2024 年 Series D 及任何 2026 年融资条款
        - 精确证券类型、step-up 保护、估值桥和任何 side letter
        - 即便技术故事强，如果融资结构激进，普通股仍可能很弱
        - 审阅最终融资文件和投资人权利协议。
      - - 聚变模块经济性
        - 单模块目标资本开支、预期可用率、燃料假设、维护节奏和转换效率
        - 没有模块经济性，50 MW 设计里程碑就无法转化为估值支撑
        - 要求提供内部技术经济模型和第三方工程评审。
      - - 客户和收入证明
        - 聚变和新裂变项目的具名购电、LOI、试点收入或定价证据
        - 商业证明是连接技术成功与高溢价估值的最干净桥梁
        - 访谈交易对手，并检查已签署协议。
      - - 裂变项目范围
        - 10 MW 钠冷路线的专项预算、人员配置、监管计划和时间线
        - 用来判断这一转向是在增加期权价值，还是只是在扩大烧钱和分心风险
        - 获取项目计划、人员配置图和监管沟通材料。
      - - 现金 runway 和烧钱
        - 当前现金余额、月度烧钱，以及通往下一重大技术里程碑的融资计划
        - 决定投资人是在为进展付费，还是在填补迫近的过桥资金需求
        - 要求提供当前资金报告和董事会批准的运营计划。
    notes: 这些问题按优先级排列，目标是把建议从基于情景的观察，推进到可承销的确信。
    claimRefs:
      - CV012
      - CV031
      - CV039
      - CV044
      - CV046
      - CV054
