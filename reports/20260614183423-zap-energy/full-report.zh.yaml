  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与客户工作流
        blocks:
          - type: paragraph
            body: >-
              Zap 的产品应被理解为未来的模块化电站平台，而不是可销售的实验室装置。当前公开资产栈有两层。第一层是 FuZE、FuZE-Q 和 FuZE-3
              等内部开发装置，它们是用来提高温度、密度、中子产额并最终走向增益的物理机器。第二层是
              Century，一个电站工程平台，本身不产生融合电力，但明确用于成熟商业电站所需的重复脉冲电源、液态金属传热和电极保护子系统。因此，客户工作流从一个需要稳定零碳电力的购电方或场址开始，进入每站多个核心、单模块
              50 MW 的电站设计，再在之后转化为已部署电力资产。这个区分对尽调很重要：Zap
              可以展示真实的内部产品模块，但面向外部客户的供给仍是一张路线图，而不是已交付电站。新的一体化裂变与融合框架扩宽了最终商业报价，但核心融合价值主张仍取决于剪切流稳定 Z-pinch 能否进入耐久的电站运行。
