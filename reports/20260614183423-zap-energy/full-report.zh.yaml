      - number: '7.3'
        title: 裂变转向既带来风险缓释选择，也带来依赖风险
        blocks:
          - type: paragraph
            body: >-
              Zap
              最关键的战略争议，是裂变动作究竟会加速聚变，还是只是扩大公司的风险面。管理层的逻辑说得通：泵、换热器、液态金属、高温材料和核级制造能力可在两个项目间复用；早期裂变部署也可能比聚变更早带来收入和客户贴近度。支持性报道接受了这套逻辑。更严厉、也更适合承销审视的解读是另一面。TechCrunch
              认为第二个反应堆概念几乎不可能免费，甚至可能变成长期岔路；Neutron Bytes 更进一步，称合并方案会放大技术、监管、融资和获客负担。市场位置也强化了这种质疑。Zap 正带着一个 10
              兆瓦钠冷概念进入微型反应堆市场，该概念源自尚未建成的 4S
              谱系，已落后于资本更充足的裂变同行数年。客户证据同样单薄：公开材料提到分布式、工业、军事和数据中心买家，以及预留产能或里程碑付款概念，但没有点名锚定客户，也没有披露已签经济条款。换句话说，这一战略方向上可能聪明，但目前更依赖叙事协同，而不是已披露交易对手。
