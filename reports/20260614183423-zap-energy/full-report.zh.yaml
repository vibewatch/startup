      - number: '2.3'
        title: 买方、用户与付款方图谱：早期需求在负载增长遇到碳约束处最清晰
        blocks:
          - type: paragraph
            body: >-
              已抓取记录中最清晰的早期买方，是超大规模云厂商，以及服务它们的公用事业或电力供应商。Google 与 Kairos 签署路径，到 2035 年最多获得 500 MW 先进核电，并在 2030
              年前完成首个部署，明确绑定 Google 数据中心和 24/7 零碳目标。Helion 另行宣布 Microsoft 同意购买其第一座融合电站的电力，Microsoft
              自身可持续发展材料也确认，公司正把核能采购叠进更宽的 2030 年碳负排放议程。Talen 围绕 Susquehanna 供电的 AWS
              园区所做的公开定位，说明了这件事的商业意义：可靠清洁电力正成为数字基础设施的选址和增长投入，而不只是气候附加项。


              对 Zap
              而言，这意味着经济买方不太可能是零售终端客户。更可能的付款方是超大规模云厂商、公用事业、独立发电商，或能为清洁稳定容量签长期合同的园区业主。终端用户是这些合同背后的负载——数据中心运营、本地电网或工业园区——预算负责人则坐在能源采购、可持续发展、基础设施或受监管公用事业规划部门。这一点有利，因为它显示出买方愿意为首创技术提前签约。它也有限制，因为公开证据仍是在描述相邻先进核能的订单式需求信号和一个高可见度融合
              PPA，而不是 Zap 自己广泛且已披露的客户管线。
