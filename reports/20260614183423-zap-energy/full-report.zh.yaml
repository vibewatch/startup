              超算配额进一步补充了这条轨迹，但它们仍是工程就绪标志，而不是客户采用标志。同时，管理层提出了一个未来变现模式，围绕联邦项目、里程碑付款和大型耗电买方的预留产能展开，但本证据集中没有公开来源点名这些买方。结果是一组非常具体的牵引力组合：Zap
              有可信、最新且被点名的联邦证据，显示它正在接受审查、获得资金，并在技术上向试点电站就绪推进；但没有同等级公开证据显示，某家超大规模云厂商、公用事业或工业客户已承诺购买一座反应堆或其未来产出。
