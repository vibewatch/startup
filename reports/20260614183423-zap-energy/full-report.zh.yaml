      - number: '4.5'
        title: 财务结论：公开资本支撑进展，但不足以完整承销
        blocks:
          - type: paragraph
            body: >-
              Zap
              的资金状况好于许多处在相近技术阶段的深科技公司，公开记录也显示资金被有纪律地投向工程里程碑，而不只是科学营销。这是正面解读。限制性解读是，真实投资模型所需的几乎所有承销输入仍缺失：收入、价格、利润率、客户付款条款、现金、burn、runway、模块资本开支、项目融资战略，以及
              Zap 特定的 DOE
              资金流入。一体化裂变转向可能成为更早现金生成的务实桥梁，也可能在融合具备融资条件前，帮助公司积累许可、制造和供应链能力；但它仍是战略，而不是已报告的经营表现。因此，本章落在中间位置：融资基础真实，工程进展真实，公司仍高度依赖额外外部资本和非稀释性项目支持，公共投资人还不能有信心地承销收入质量或资本充足性。
