      - number: '8.4'
        title: 建议、投资假设破裂触发点和尽调要求
        blocks:
          - type: paragraph
            body: >-
              判断应保持对估值和证据敏感，而不是简单看多技术。Zap 的证明已经足以进入可投但继续观察的范围：已融资规模可观，工程进展可重复，等离子体性能工作严肃，DOE
              里程碑也有牵引。但同一组证据也说明，信心不应上升到买入。2026
              年聚变加裂变转向扩大了机会，最终可能改善故事；但眼下，公开来源还没有显示新一轮定价融资、由客户支撑的收入桥梁，或透明的清算优先权栈，范围却已经扩大。因此，当前最可防守的立场是继续研究，中等信心、高风险。延迟叠加降价融资的熊市情形，对应约
              $0.6 billion-$1.0 billion；没有新价格发现但技术相关性延续的基准情形，对应约 $1.0 billion-$1.8 billion；牛市情形约 $1.8 billion-$3.0
              billion，需要强劲的下一轮融资和更干净的商业化证明。眼下尽调清单很直接：拿到当前股权结构和清算优先权栈，核实融资条款，要求披露单位经济性和烧钱速度，并测试裂变加入究竟是在加速还是分散通向商业聚变模块的路径。
