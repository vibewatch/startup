      - number: '7.2'
        title: 从实验室系统走向电站，运营和燃料循环风险仍占主导
        blocks:
          - type: paragraph
            body: >-
              核心运营问题是，Zap 的工程栈能否足够快地从令人印象深刻的子系统推进到耐久电站硬件，从而让商业化故事继续可信。Century 是 Zap
              正在处理正确问题集的最佳公开证据：重复脉冲电源、液态金属冷却和电极损伤缓解。但 Century 也显示剩余距离有多长。该平台以约 100 kW 输入功率运行，并验证约 0.1 Hz 放电，而商业模块目标仍是约
              50 MW 净电输出。FuZE-3 的 2025 年压力里程碑强化了物理案例，但仍不是净电力、可用率或维护经济性的证据。燃料循环风险同样重大。Zap 自己的设计现在嵌入氚燃料循环和增殖包层；World
              Nuclear 与 NRC 相关材料等行业参考也明确显示，商业融合不能依赖天然氚供应。这意味着 Zap
              不仅要解决等离子体约束，还要解决液态金属材料行为、氚处理、远程维护，以及可信的锂相关供应计划。这些问题原则上可解，但正是这类电站集成风险，常常拉长深科技时间表。
