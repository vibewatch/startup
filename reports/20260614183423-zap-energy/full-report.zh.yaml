      - number: '5.3'
        title: 部署、可靠性与路线图
        blocks:
          - type: paragraph
            body: >-
              Zap 的部署证据，在工程重复性上比在客户部署上更可信。Century 是最好的公开可靠性证据：DOE 认证了一次三小时活动，完成 1,080 次放电，频率 0.1 Hz 且无故障；Zap
              后来又报告在更高平均功率下以 0.2 Hz 完成超过 100 次放电，并在多个构型中累计超过 10,000 次放电。这离电站可用率证据仍很远，但明显强于静态概念演示稿。物理侧，FuZE-Q 仍是面向
              breakeven 的平台，FuZE-3 则是当前压力领先者，也是下一代装置的输入。2026 年预概念里程碑把这些线索拉进一张 50 MW 模块电站蓝图，也显示 Zap
              已开始正式处理远程操作、氚和应急规划问题，而不是把它们留作未来作业。路线图现在多了一条分支：裂变和混合系统与融合共享液态金属、材料和电站辅助系统能力。这可能加速工业就绪，但也让项目聚焦成为正在发生的尽调问题。
