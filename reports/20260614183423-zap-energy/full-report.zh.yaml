companyProfile:
  summary: >-
    Zap Energy 是一家总部位于华盛顿州 Everett 的私营先进核能公司，2017 年由 Benj Conway、Brian A. Nelson 和 Uri Shumlak 创立，源自 University of
    Washington 的剪切流稳定 Z-pinch 研究。它的核心融合论点是，流经等离子体的电流可以提供压缩，不需要大型外部超导磁体；更新的工程工作已经从 FuZE-Q、FuZE-3 等物理装置，扩展到
    Century、液态金属壁、重复脉冲电源，以及 DOE 批准的预概念试点电站设计，模块规模约为净输出 50 MW。2026 年，公司进一步扩展为一套一体化核能平台，也纳入 10 MW
    钠冷裂变项目，试图用共用材料、热管理和制造能力更早产生收入。尽调问题现在变成：Zap 能否在更宽的业务范围稀释执行之前，把可信的工程进展和可观的风投资本，转化为可许可、可融资、有客户背书的电力产品。
