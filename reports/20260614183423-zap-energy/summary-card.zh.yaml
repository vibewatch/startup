    - 公开材料仍未披露当前估值、收入、现金跑道、单位经济或客户合同结构，承保高度依赖情景假设。
    - 商业证据仍弱：没有具名付费电力客户、预订簿，或公开记录的一号买家路径。
  unresolvedGaps:
