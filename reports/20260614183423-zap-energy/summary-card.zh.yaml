  topStrengths:
    - 从 FuZE 设备到 Century，再到 DOE 批准的 50 MW/模块预概念试点设计，技术栈证据可信；相比典型未商业化聚变初创，Zap 的工程证据更强。
    - 若耐久性和放大路径跑通，剪切流稳定 Z-pinch 架构有望比重磁体或重激光路线更低硬件复杂度。
    - 公开披露融资超过 $330M，叠加 DOE 里程碑验证，说明资金和背书已支撑到电站工程，而不只是实验室科学。
  topRisks:
