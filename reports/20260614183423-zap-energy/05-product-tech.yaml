- id: deployment-reliability-and-roadmap
  title: Deployment, reliability, and roadmap
  body: >-
    Zap’s deployment evidence is more credible on engineering repetition than on customer deployment. Century is the best public reliability proof: DOE certified a three-hour campaign with 1,080 shots at 0.1 Hz and no failure, and Zap later reported more than 100 shots at 0.2 Hz with higher average power plus over 10,000 cumulative shots across configurations. That is still far from plant availability evidence, but it is materially better than a static concept deck. On the physics side, FuZE-Q remains the breakeven-oriented platform, while FuZE-3 is the current pressure leader and a feeder for the next generation of devices. The 2026 preconceptual milestone pulls those threads into a 50 MW-module plant blueprint and shows that Zap has started to formalize remote handling, tritium, and emergency-planning issues rather than treating them as future homework. The roadmap now has an added branch: fission and hybrid systems sharing liquid-metal, materials, and balance-of-plant capabilities with
    fusion. That may accelerate industrial readiness, but it also makes program focus a live diligence question.
