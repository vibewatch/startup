  rows:
  - - Secure firm carbon-free power at modular scale
    - Buy grid power, conventional generation, or wait for other nuclear options
    - Future 50 MW SFS Z-pinch module with multi-core plant scaling
    - Compact plant concept and potentially lower balance-of-plant complexity than magnet/laser systems
    - No public customer contract, availability case, or LCOE
  - - Increase fusion performance toward gain
    - Run sequential physics machines and publish results
    - FuZE-Q and FuZE-3 as rapid-iteration physics assets
    - Public temperature, density, neutron, and pressure milestones have kept improving
    - Performance is still measured in experiments, not power output
  - - De-risk repetitive plant hardware before full reactor deployment
    - Wait for final plasma success before engineering subsystems
    - Century lets Zap test pulsed power, liquid metals, and electrodes in parallel
    - 1,080-shot DOE run and 10,000+ cumulative shots reduce pure concept risk
    - Century does not validate neutron damage or full tritium operations
  - - Industrialize shared nuclear components
    - Build separate teams for fusion and fission stacks
    - Integrated nuclear program reuses liquid-metal, materials, manufacturing, and power-conversion work
    - Could shorten vendor qualification and plant-integration learning loops
    - Could also dilute management focus and capital
  - - Demonstrate regulatory readiness
    - Treat licensing as post-breakthrough work
    - 2026 DOE milestone plus NRC rulemaking monitoring bring plant-systems issues forward
    - Safety, remote handling, and tritium topics are now explicit in the product path
    - No public license application or certification package yet
  notes: >-
    This workflow is a public reconstruction from product, milestone, and strategy pages; it should not be mistaken for a signed commercial execution plan.
