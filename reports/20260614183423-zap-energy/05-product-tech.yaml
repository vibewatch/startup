chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Zap’s product story is stronger on internal technical assets than on external deployment: FuZE-Q and FuZE-3 advance the sheared-flow-stabilized Z-pinch core, while Century and the 2026 DOE design milestone show real progress on repetitive pulsed power, liquid metals, and plant subsystems. Public evidence supports a differentiated compact architecture and growing patent estate, but long-run durability, QA/cyber assurance, and the execution risk of the new fission branch remain unresolved.
sections:
- id: product-definition-and-customer-workflow
  title: Product definition and customer workflow
  body: >-
    Zap’s product should be understood as a future modular power-plant platform, not as a sellable laboratory device. The current public asset stack has two layers. First are internal development devices such as FuZE, FuZE-Q, and FuZE-3, which are physics machines used to raise temperature, density, neutron yield, and eventually gain. Second is Century, a plant-engineering platform that does not make fusion power but is explicitly used to mature the repetitive pulsed power, liquid-metal heat-transfer, and electrode-protection subsystems a commercial plant would need. The customer workflow therefore begins with an offtaker or site needing firm carbon-free power, moves through a 50 MW-module plant design with multiple cores per site, and only later converts into a deployed power asset. That distinction matters for diligence: Zap can show real internal product modules, but the external customer offering remains a roadmap rather than a shipped plant. The new integrated fission-and-fusion framing
    broadens the eventual commercial offer, yet the core fusion value proposition still depends on the sheared-flow-stabilized Z-pinch reaching durable plant operation.
