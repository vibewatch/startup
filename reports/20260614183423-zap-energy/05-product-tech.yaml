    - No current performance role; ask for archived calibration and scaling limits
  - - FuZE-Q
    - Internal R&D; future pilot-core template
    - Active physics platform targeting breakeven-oriented operation
    - Higher current and stored-energy path toward Q=1-equivalent performance
    - Public shot statistics and current operating envelope remain sparse
  - - FuZE-3
    - Internal R&D
    - Active next-generation physics device
    - Third electrode separates acceleration from compression and has produced gigapascal-class pressures
    - No peer-reviewed FuZE-3 paper yet; neutron coupling to headline pressure still not public
  - - Century engineering platform
    - Systems engineering, plant-design, reliability teams
    - Active engineering demonstrator
    - >-
      Integrates repetitive pulsed power, liquid-metal wall, and durable-electrode subsystems without waiting for a final fusion core
    - Still sub-scale and non-fusing; lifetime, maintenance, and contamination data are private
  - - 50 MW fusion module concept
    - Future utility, data-center, or industrial offtakers
    - Preconceptual design approved by DOE milestone panel
    - Compact module concept avoids external magnets and feeds multi-core plant layouts
    - No public EPC plan, PPA, or plant availability case
  - - Integrated fission / hybrid branch
    - Future nuclear buyers and internal industrialization teams
    - New 2026 strategic branch
    - Reuses liquid-metal, materials, and balance-of-plant capabilities across reactor classes
    - Unclear resource split versus the core fusion roadmap
  notes: >-
    Rows separate internal development assets from the future commercial plant product; public evidence is strongest on internal modules and weakest on customer deployment terms.
