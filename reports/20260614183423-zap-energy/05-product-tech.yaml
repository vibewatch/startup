- id: differentiation-ip-and-trust
  title: Differentiation, IP, and trust/compliance
  body: >-
    Zap’s clearest differentiation is architectural simplicity paired with a visible internal engineering stack. The company can credibly show that it is not only publishing plasma wins but also building repetitive pulsed-power hardware, liquid-metal test systems, and a patent portfolio around electrode geometry, operating-parameter tuning, and renewable or protected electrode concepts. Independent sources also validate that the approach has advanced beyond slideware: the 2020 reactor paper, 2024 whole-device modeling, IEEE pulsed-power work, and external coverage of FuZE-3 and Century all support a real technical program. Trust and compliance evidence is thinner. The NRC’s 2026 fusion framework is encouraging because it provides a clearer licensing path for near-term machines, but it also highlights that tritium inventory, emergency preparedness, waste disposal, and plant-scale safety reviews remain real gating items. Public staffing shows EHS, QA, and nuclear-safety hiring, and the website
    publishes a privacy policy, but there is still no public third-party quality, cybersecurity, or operating-license package. Adverse coverage presses the harder point: fusion economics may learn slowly, and Zap’s new fission track could either strengthen commercialization muscle or dilute focus from fusion.
