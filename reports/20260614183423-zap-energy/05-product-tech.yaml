callouts:
- calloutType: insight
  title: The real product is the plant stack, while the named devices are internal assets
  body: >-
    Public evidence supports a subtle but important distinction: FuZE-Q, FuZE-3, and Century are not commercial SKUs. They are internal modules used to mature the future 50 MW product. That makes the technical stack more real than a slide deck, but less commercially mature than a deployed power asset.
  claimRefs:
  - CE001
  - CE002
  - CE017
  - CE018
  - CE045
- calloutType: strength
  title: Century gives Zap unusually concrete engineering evidence for a pre-revenue fusion company
  body: >-
    Many fusion startups talk about plant subsystems abstractly. Zap can point to a DOE-reviewed repetitive-shot campaign, liquid-metal hardware, and a published plant-design milestone, which materially strengthens the product-tech story even before commercial deployment.
  claimRefs:
  - CE020
  - CE023
  - CE038
  - CE044
- calloutType: risk
  title: The main technical unknown has shifted from “can a pinch heat up?” to “can the stack run for years?”
  body: >-
    Public sources now show credible progress on pressure, temperature, and repetition. The harder unanswered questions are lifetime, QA, cyber and control assurance, tritium operations, and whether the new fission branch sharpens or distracts from fusion execution.
