  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: electrode-durability
    missingEvidence: >-
      Multi-thousand-shot electrode-erosion data, maintenance intervals, replacement costs, and contamination measurements for liquid-metal-protected components.
    whyItMatters: >-
      Electrode lifetime sits directly on plant availability, service cost, and whether repetitive Z-pinch operation can become a durable commercial asset rather than a laboratory result.
    diligencePath: >-
      Request Century maintenance logs, post-campaign inspection reports, failure analyses, and engineering limits for cathode, nosecone, and liquid-metal protection systems.
    relatedQuestionRefs:
    - QE023
    relatedTableRefs:
    - TE003
    - TE004
  - type: missing-source
    severity: material
    topic: quality-and-cyber-assurance
    missingEvidence: >-
      Third-party quality-program evidence such as NQA-1/ASME-style controls, software/control-system cybersecurity standards, or a dated certification roadmap.
    whyItMatters: >-
      Public trust evidence is currently heavier on staffing and policy statements than on external assurance artifacts, leaving a gap between engineering ambition and plant-operator readiness.
    diligencePath: >-
      Request QA manuals, supplier-qualification standards, cyber architecture documents, external audits, and any roadmap to nuclear-grade certification or licensing audits.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE004
  - type: stale
    severity: material
    topic: fuze-3-peer-review
    missingEvidence: >-
      A peer-reviewed FuZE-3 paper with full shot statistics, uncertainty bounds, and any published neutron coupling to the headline pressure result.
    whyItMatters: >-
      Current FuZE-3 evidence is strong enough to show direction of travel, but it still leans on company disclosures and secondary coverage rather than a completed scientific publication.
    diligencePath: >-
      Request APS presentation materials, manuscript drafts, or the eventual journal article and compare the final data package with the current press summary.
    relatedQuestionRefs:
    - QE008
    relatedTableRefs:
    - TE005
  - type: missing-source
    severity: minor
    topic: integrated-platform-governance
    missingEvidence: >-
      A dated program plan that shows budget, staffing, and milestone dependencies between the fission, fusion, and hybrid tracks.
    whyItMatters: >-
      The integrated-nuclear narrative could be a force multiplier or a distraction; without a concrete plan, outside investors cannot tell which path gets management focus when tradeoffs appear.
    diligencePath: >-
      Request org charts, capital-allocation assumptions, milestone owners, and scenario plans that show how fusion progress is protected if the fission path stretches.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE005
