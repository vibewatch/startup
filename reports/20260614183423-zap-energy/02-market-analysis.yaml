- id: buyer-user-payer
  title: 'Buyer, user, and payer map: early demand is most visible where load growth meets carbon constraints'
  body: |-
    The most legible early buyers in the fetched record are hyperscalers and the utilities or power suppliers serving them. Google and Kairos signed a path to up to 500 MW of advanced nuclear by 2035, with first deployment by 2030, explicitly tied to Google’s data centers and 24/7 carbon-free goals. Helion separately announced that Microsoft agreed to buy power from its first fusion plant, and Microsoft’s own sustainability materials confirm that the company is layering nuclear procurement into a broader 2030 carbon-negative agenda. Talen’s public positioning around its Susquehanna-powered AWS campus shows why this matters commercially: reliable clean power is becoming a siting and growth input for digital infrastructure, not just a climate add-on.

    For Zap, that means the economic buyer is unlikely to be a retail end customer. More plausible payers are hyperscalers, utilities, independent power producers, or campus owners that can sign long-dated contracts for clean firm capacity. The end user is the load behind those contracts—data-center operations, local grids, or industrial campuses—while the budget owner sits inside energy procurement, sustainability, infrastructure, or regulated utility planning. This is favorable because it creates visible willingness to pre-contract for first-of-a-kind technologies. It is also limiting, because the public evidence still describes orderbook-style demand signals for adjacent advanced nuclear and one highly visible fusion PPA, not a broad, disclosed customer pipeline for Zap itself.
