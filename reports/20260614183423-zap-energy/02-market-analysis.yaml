  title: Market definition and status-quo substitutes for Zap
  columns:
  - Segment/category
  - Included spend/workflow
  - Excluded spend/workflow
  - Buyer/payer
  - Relevance to Zap
  rows:
  - - Firm clean utility-scale power
    - Dispatchable low-carbon generation, capacity value, interconnection-ready plant development
    - All commodity power sales regardless of reliability or carbon attribute
    - Utilities, IPPs, large offtakers
    - Core category if Zap can reach licensable power-plant deployments
  - - Hyperscale and AI data-center power
    - 24/7 carbon-free electricity, clean-energy attributes, colocated or grid-delivered firm supply
    - Server hardware, data-center buildings, generic cloud software spend
    - Hyperscalers, utilities, campus owners
    - Strongest visible near-term demand signal in fetched evidence
  - - Industrial or energy-community campus power
    - Retired-site reuse, onsite generation, resilient clean supply for advanced manufacturing or digital campuses
    - All industrial energy spend and unrelated infrastructure services
    - Campus operators, industrials, local utilities
    - Plausible adjacency where modular dispatchable supply has siting value
  - - Advanced nuclear industrial base
    - Shared supply chains, modular construction, heat-exchange and balance-of-plant capabilities
    - Treating all fission deployment revenue as Zap fusion revenue
    - Developers, EPCs, nuclear partners
    - Useful adjacency because Zap now explicitly couples fission and fusion capabilities
  - - Excluded overbroad TAM frames
    - None
    - All U.S. electricity demand, all AI capex, all nuclear activity, all renewable generation
    - N/A
    - These frames overstate addressable spend relative to Zap’s actual product and timeline
