  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: zap-sam-and-pipeline
    missingEvidence: Zap-specific customer pipeline, contracted MW, target segment mix, and backlog conversion assumptions.
    whyItMatters: Without disclosed buyer concentration and contract structure, public demand signals cannot be converted into a defensible Zap-specific SAM or SOM.
    diligencePath: Request management’s current pipeline by segment, signed NDAs/LOIs/PPAs, target geography, and expected deployment sequencing.
    relatedQuestionRefs:
    - QM024
    - QM025
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: zap-unit-economics
    missingEvidence: Public capex, LCOE, balance-of-plant cost, and financing assumptions for Zap’s first commercial plant design.
    whyItMatters: Commercial viability versus gas, advanced fission, and renewable-plus-storage substitutes depends on cost and schedule, which public sources do not disclose for Zap.
    diligencePath: Obtain plant economics deck, milestone-gated capex model, and sensitivity cases for fuel cycle, availability, and financing cost.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM004
  - type: conflicting-data
    severity: material
    topic: commercialization-timing
    missingEvidence: Independent milestone-based assessment reconciling DOE/NRC commercialization timelines with skeptical views that practical fusion power is still far away.
    whyItMatters: The timing gap changes how much of today’s clean-firm demand can realistically accrue to Zap versus substitutes before 2035.
    diligencePath: Interview independent fusion engineers, licensing experts, and prospective buyers on milestone realism, then compare against Zap’s internal schedule.
    relatedQuestionRefs:
    - QM022
    - QM023
