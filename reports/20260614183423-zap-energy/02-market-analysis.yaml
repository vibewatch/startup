- id: TM004
  title: Growth drivers and commercialization constraints
  columns:
  - Driver/constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - AI and data-center load growth
    - Positive
    - Current through 2028
    - Creates a large new buyer need for reliable power near demand centers
    - Which buyers are willing to sign pre-revenue PPAs with fusion developers?
  - - 24/7 carbon-free and carbon-negative targets
    - Positive
    - Current through 2035
    - Raises value of firm clean supply relative to variable-only portfolios
    - How durable are hyperscaler clean-energy commitments if costs rise?
  - - DOE and NRC commercialization roadmaps
    - Positive
    - 2026-2028
    - Reduces policy ambiguity and helps projects plan toward licensing
    - What milestones must Zap hit to stay inside the roadmap window?
  - - Orderbook-style reactor procurement
    - Positive
    - Current through 2035
    - Supports learning-curve economics and customer signaling for first fleets
    - Can Zap replicate the orderbook logic seen in adjacent advanced nuclear deals?
  - - FOAK cost and schedule uncertainty
    - Negative
    - Current
    - Makes financiers and utilities cautious even when demand is real
    - What is Zap’s plant capex/LCOE range and what de-risks it?
  - - Tritium, lithium, materials, and power-electronics supply chain
    - Negative
    - Current through pilot stage
    - Can slow scale-up even if licensing improves
    - What inputs are bottlenecked for Zap’s design specifically?
  - - Gas, advanced fission, and renewables-plus-storage substitutes
    - Mixed
    - Current
    - Competing technologies can satisfy the same reliability job sooner or more cheaply
    - Where does Zap outperform each substitute on cost, siting, or emissions?
  - - Timing skepticism and market hype
    - Negative
    - Persistent
    - Weakens confidence in near-term revenue conversion and compresses credible SOM
    - What independent milestone evidence can narrow the optimism-versus-skepticism gap?
  notes: Direction refers to category adoption for firm clean power, not automatically to Zap share; the table mixes demand tailwinds with vendor-specific commercialization gates because both matter for valuation.
