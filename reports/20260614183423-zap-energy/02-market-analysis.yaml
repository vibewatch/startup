- id: growth-drivers-and-constraints
  title: 'Growth drivers and constraints: demand pull is rising faster than commercialization certainty'
  body: |-
    Several tailwinds are clear. AI-led data-center growth is lifting absolute power demand. Corporate and utility buyers are now willing to sign orderbooks and PPAs around firm clean power before full fleet maturity, because round-the-clock carbon-free supply is strategically valuable and complements variable renewables. DOE’s Liftoff framework and NRC’s fusion rulemaking also reduce one classic commercialization objection by making policy and regulatory work more concrete. On paper, that combination creates a strong market backdrop for any technology that can deliver dispatchable clean power in modular units.

    The gating factors are just as important. Fusion still faces unresolved industrial bottlenecks in tritium, lithium, high-power electronics, and specialized materials; first-of-a-kind nuclear projects still struggle with cost predictability and schedule certainty; and UCS argues that some substitute pathways, especially gas-backed expansion, remain cheaper or easier to procure in the near term even if they worsen long-run climate and ratepayer outcomes. Skeptical coverage goes further, arguing that fusion hype is outrunning technical proof. For diligence, the implication is not that demand is missing. It is that demand arrives before vendor-level capture is provable. Zap’s valuation-relevant market case therefore depends less on “is there need for clean firm power?” and more on “can Zap turn that need into licensable, financeable, repeatable deployments on a timetable that beats substitutes?”
