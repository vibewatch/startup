      - number: '4.3'
        title: Traction proxies versus the disclosure gap
        blocks:
          - type: paragraph
            body: >-
              The company’s strongest public metrics are not financial statements; they are fundraising milestones,
              headcount targets, locations, and program wins. That can still be useful. Program wins around VICTUS HAZE,
              Andromeda, Apollo, and interceptors show demand relevance. But when compared with public peers, the
              disclosure gap is stark. Rocket Lab and Palantir, for example, show market cap and quarterly revenue on
              Yahoo Finance, while Redwire, Kratos, and Parsons maintain robust investor-relations and SEC filing
              surfaces. That comparison does not make True Anomaly weak; it simply makes it private and opaque.
              Investors should therefore separate “traction exists” from “revenue quality is known.” Public evidence
              supports the first statement and does not support the second with enough precision yet today. The
              practical consequence is that outside investors can see strategic progress without yet seeing whether that
              progress is economically efficient. That disclosure gap should directly lower confidence in any revenue
              multiple or margin assumption built from public evidence alone. It also means valuation work has to lean
              far more heavily on strategic relevance, buyer proof, and capital access than on the cleaner cohort,
              margin, and renewal analysis investors would usually expect at this price point.
