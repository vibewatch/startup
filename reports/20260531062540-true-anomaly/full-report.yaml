        title: Operational, quality, and mission-execution risk
        blocks:
          - type: paragraph
            body: >-
              Operational risk is the defining risk class for this company. Mission X updates show that the product is
              real, improving, and still earning maturity through public flight cycles. That is normal for a young space
              company, but it remains risky when the same business is scaling headcount, facilities, and mission count
              simultaneously. Public materials suggest management understands this: it hired an operations-focused COO
              and continues to invest in test infrastructure, fault detection, and mission support. Still, public
              evidence does not provide yield, reliability, or insurance metrics, so the outside observer is left with
              process signals rather than hard outcome distributions. The operational thesis is therefore positive on
              momentum and negative on quantified proof. Until measured reliability, yield, and insurance data are
              visible, investors should assume residual execution risk remains materially elevated even after visible
