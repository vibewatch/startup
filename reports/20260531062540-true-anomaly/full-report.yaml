  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Thesis, anti-thesis, and recommendation
        blocks:
          - type: paragraph
            body: >-
              The core thesis is easy to state: a well-funded, integrated space-superiority supplier with real
              government-program relevance could compound quickly if program access turns into repeatable production
              economics. The anti-thesis is just as clear: the public record still does not show enough revenue, margin,
              or capital-structure detail to justify treating the current price as obviously attractive. Those two
              statements can both be true. That is why the right recommendation is not an outright rejection; it is a
              disciplined “research more” stance. Investors should remain engaged because the category and company
              matter, but they should not confuse strategic importance with current valuation support. Public evidence
              supports ongoing diligence, not blind conviction, and it should keep price discipline front and center at
              all times today.
