      - number: '3.3'
        title: Moat durability and the real adverse case
        blocks:
          - type: paragraph
            body: >-
              The adverse case is not that True Anomaly has no differentiation; it is that differentiation may prove too
              easy to narrate and too hard to defend. Across the sector, more vendors are now claiming autonomy,
              mission-speed decisions, tracking, logistics, and operator-friendly workflows. That creates a real risk
              that the category commoditizes at the messaging layer while procurement winners are chosen on trust,
              classified access, balance-sheet strength, and repeat performance. Public evidence also suggests that many
              of the most important budgets still include primes or better-capitalized venture-backed challengers. If
              that dynamic holds, True Anomaly’s moat will depend less on having the most compelling website story and
              more on proving that its integrated stack wins real programs repeatedly and cheaply enough to matter. That
              proof is still incomplete in public sources, and it remains especially incomplete on price, renewal
              behavior, and technical bake-off outcomes.
            claimRefs:
              - CP023
              - CP024
              - CP025
              - CP027
              - CP028
              - CP033
              - CP034
              - CP035
          - type: table
            tableRef: TP004
