      - number: '3.4'
        title: What would most change the competitive view
        blocks:
          - type: paragraph
            body: >-
              Two public signals would most improve confidence in the competitive thesis. The first would be explicit
              repeat-win or renewal evidence showing that True Anomaly beat credible alternatives and then expanded
              inside the same account. The second would be a clearer record on pricing and packaging, because today’s
              public field makes software-only, hardware-plus-software, and program-integrator offers very difficult to
              compare. Until those proofs are visible, the prudent interpretation is that True Anomaly sits in a strong
              but contested position: differentiated enough to matter, not proven enough to assume durable incumbency.
              That makes competitive diligence less about choosing a single “main rival” and more about mapping which
              adjacent combinations can take share in the company’s most important government buying paths. Investors
              should also ask for recompete outcomes, technical bake-off details, and evidence that customers did not
              simply choose the company because a niche program needed one more nontraditional vendor. Without that
              proof, the moat case remains promising but incomplete. The highest-signal next step would be to review
              actual proposal evaluations and post-award expansion behavior, because those documents would show whether
              the company wins because it is technically better, easier to integrate, cheaper, or simply newer in a
              buyer pool that still wants multiple options.
            claimRefs:
              - CP032
              - CP025
              - CP034
          - type: figure
            figureRef: FP002
            claimRefs:
