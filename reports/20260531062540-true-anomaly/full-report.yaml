  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risk
        blocks:
          - type: paragraph
            body: >-
              The most visible regulatory risk is export control. The Office of Space Commerce makes clear that
              commercial space companies still need to navigate EAR, ITAR, and compliance after authorization, while
              public legal pages show only a lightweight outward-facing compliance surface. That does not mean the
              company is noncompliant; it means outside investors do not yet have public proof proportionate to the
              sensitivity of the product set. As the company stretches into GEO, cislunar, and interceptor-linked
              missions, that compliance perimeter likely gets harder rather than easier to manage. There is no obvious
              disclosed enforcement matter in the reviewed record, but the absence of public evidence is not the same as
              a clean bill of health. This is therefore a category where diligence should be documentary, not
              assumptive, and very disciplined indeed today.
