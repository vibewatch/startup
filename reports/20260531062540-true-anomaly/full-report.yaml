      - number: '1.2'
        title: Founders, leadership depth, and governance signals
        blocks:
          - type: paragraph
            body: >-
              The founder story is central to the company narrative. Even Rogers remains the public face of the company
              and brings direct military-space operating credibility that many venture-backed space companies do not
              have. Kyle Zakrzewski complements that with hands-on spacecraft engineering and operational experience.
              The official about page, however, now describes a materially broadened operating bench: Sarah Walter on
              execution and manufacturing, Mark Seidel on finance and administrative scaling, Stephen Kitay on
              defense-market strategy, and Frank Di Pentino on strategic alignment with Space Force needs. Those
              additions suggest a company transitioning from founding intensity into managed scale.


              Governance additions reinforce the same theme. Frank Calvelli's board appointment and other board updates
              matter less because they add marquee names and more because they add acquisition literacy. This is a
              company selling into programs where procurement design, contracting speed, and government trust can be as
              important as technical differentiation. The public record still leaves open questions around formal voting
              control, board committee structure, and cap-table concentration after the Series D close, but it is fair
              to say that True Anomaly used 2025 and early 2026 to deepen leadership around operations, finance, and
              government-market access rather than around consumer-style growth roles.
