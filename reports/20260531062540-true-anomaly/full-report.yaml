      - number: '4.2'
        title: Cost structure, capital intensity, and runway
        blocks:
          - type: paragraph
            body: >-
              Everything about the operating model suggests high capital intensity. The company is scaling
              manufacturing, hiring aggressively, iterating spacecraft through flight tests, and pushing into
              technically demanding programs like interceptors and responsive-space missions. Sarah Walter’s operating
              remit spans manufacturing, supply chain, mission operations, and software engineering, which is a clue to
              where the cost base sits. Mission X-2 also makes the economic story more concrete: the company is still
              spending on test infrastructure, fault detection, modems, sites, and upgraded Mosaic capabilities. The
              2026 financing almost certainly provides meaningful runway, but that is not the same as proving
              self-sustaining economics or durable efficiency. Without burn, cash balance, working-capital, and
              unit-cost data, the best public conclusion is that capital adequacy improved materially while capital
              dependency remains real.
