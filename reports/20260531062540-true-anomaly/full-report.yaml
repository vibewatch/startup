      - number: '1.3'
        title: Capital formation, valuation, and scale claims
        blocks:
          - type: paragraph
            body: >-
              The funding staircase is unusually clear for a private defense-space startup. The reviewed record shows a
              December 2022 Form D on EDGAR, a $100 million Series B led by Riot Ventures, a $260 million Series C led
              by Accel with Stifel debt support, and then a $650 million Series D that included $50 million of debt.
              CNBC's April 2026 reporting triangulates the latest private-market outcome at a $2.2 billion valuation and
              around $1 billion of cumulative capital raised. Those are large numbers for a company without publicly
              disclosed revenue, and they explain why valuation discipline becomes the central question for the final
              chapter.


              At the same time, the capital story is not yet the same as a solved monetization story. None of the
              sources used here disclose revenue run rate, gross margin, unit economics, or audited backlog conversion.
              The company clearly has enough funding to expand facilities and headcount, and it can cite multiple
              government-adjacent programs, but the capital raised should be read as evidence of investor conviction and
              mission urgency, not as proof that the operating model has already reached durable economic repeatability.
              This gap between disclosed financing strength and undisclosed revenue quality is the core framing tension
              for diligence.
