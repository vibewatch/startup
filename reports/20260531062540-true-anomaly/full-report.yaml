      - number: '2.3'
        title: Growth drivers, substitutes, and the reasons the market may stay narrower than rhetoric
        blocks:
          - type: paragraph
            body: >-
              The 2026 tailwinds are real. The National Defense Strategy puts homeland defense and
              defense-industrial-base revitalization at the center of procurement logic; Golden Dome explicitly expands
              demand for tracking and interceptor layers; and multiple adjacent companies are proving that government
              buyers are willing to contract with nontraditional vendors in SDA, mobility, and logistics. Those facts
              support a real market, not a theoretical one. But the same sources also show why investors should stay
              disciplined about sizing. Defense News still frames domain awareness and counterspace as
              resource-constrained priorities inside a small Space Force budget, and the Office of Space Commerce
              reminds would-be exporters that space-hardware sales remain entangled with EAR/ITAR compliance. Meanwhile,
              adjacent vendors such as LeoLabs, Anduril, Astroscale, Orbit Fab, and Impulse are competing for portions
              of the same modernization dollars even when their product architectures differ. The result is a strong
              strategic market with multiple growth drivers, but one where conversion timing and budget capture remain
              more important than the raw magnitude of top-line defense-space spending.
            claimRefs:
