        title: What the company actually sells
        blocks:
          - type: paragraph
            body: >-
              The company’s technology surface is wider than a single spacecraft. Jackal is the physical on-orbit
              vehicle, Mosaic is the mission software and orchestration layer, advanced payloads extend sensing and
              mission functionality, and the interceptor line extends the portfolio into homeland-defense use cases.
              This matters because it explains why the company’s differentiation claim depends on integration, not just
              on propulsion or autonomy in isolation. The public materials are unusually consistent on this point.
              Jackal is always presented with Mosaic, and program updates repeatedly describe the software as part of
              the operational system rather than as back-office tooling. In diligence terms, this is a real strength:
              the product definition is clear. The unanswered question is not what the company is trying to build, but
