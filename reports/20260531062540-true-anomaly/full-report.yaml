        title: Customer base and segmentation
        blocks:
          - type: paragraph
            body: >-
              The most important fact about the customer base is that it is visibly government-heavy. The public record
              does not show a broad array of private enterprises buying Mosaic or Jackal on standard commercial terms.
              Instead, it shows a cluster of U.S. defense-space offices, mission sponsors, and adjacent program pathways
              that repeatedly surface in the company’s announcements and in government reporting. That does not make the
              customer story weak; it makes it specific. The visible buyer, payer, and user roles map much more closely
              to military program structures than to traditional commercial SaaS or aerospace channels. Public materials
              also still lean on language about allies and partners, but the named proof set remains concentrated in the
              U.S. ecosystem. Investors should therefore read customer diversity as an aspiration, while reading
