        title: Mitigations, monitoring, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The visible mitigations are meaningful but incomplete. Capital buys time; leadership depth buys process
              discipline; and the spread of programs reduces single-program dependency at the margin. Those are real
              positives. But none of them remove the need for hard monitoring. The cleanest public thesis-break triggers
              remain another meaningful mission anomaly, a major budget or program loss in the small set of core
              government opportunities, or evidence of a compliance problem that challenges buyer trust. The most useful
              diligence exercise is therefore not simply listing risks, but mapping how to monitor them: ask for debt
              documents, quality metrics, insurance coverage, program-conversion milestones, and compliance artifacts.
              Until those are available, the residual risk profile remains high even though management’s visible
              mitigation steps are directionally sensible. In practical terms, the risk dashboard should track five
              things continuously: mission anomalies and near-misses, budget or program slips inside the small visible
              customer set, supplier or launch changes that can shift schedules, compliance artifacts that confirm
              controls remain current, and any sign that financing flexibility is narrowing. If management can show
              discipline across those five vectors, the risk case improves quickly. If not, downside can compound fast
              because the same few events hit customer confidence, capital access, and strategic narrative at once
              across the whole company.
