            body: >-
              The financial verdict is ultimately a judgment about confidence, not just about missing cells. True
              Anomaly has clear funding strength and real strategic demand signals, but its operating-quality profile
              remains under-specified in public. The main adverse indicators are budget timing risk, the lack of
              disclosed unit economics, unknown debt terms, and the possibility that large capital raises are
              compensating for a still-unproven path to efficient production. None of these are thesis-breaking by
              themselves, but together they keep the company in the “research more” zone. The capital stack is
              impressive; the economic stack remains mostly private. Any serious underwriting decision therefore needs
              internal financial materials, contract timing detail, debt documents, and a clearer explanation of how
              Mosaic monetizes inside and outside bundled mission work. It also needs a clear program-by-program bridge
              from funded technical progress to revenue recognition and cash conversion, because otherwise the company
