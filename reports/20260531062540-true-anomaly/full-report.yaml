  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization signals
        blocks:
          - type: paragraph
            body: >-
              Public sources are clear that True Anomaly sells a mission stack tied to spacecraft, software, payloads,
              and government programs. They are not clear about how much of that stack is recurring software, how much
              is milestone-driven hardware revenue, and how much is still essentially funded development. That
              distinction matters because a valuation supported by repeatable software and production revenue deserves
              different underwriting than one supported mainly by strategic R&D-style contracts. The reviewed record
              points strongly to a program-led model: SBIR and OTA pathways, large mission-specific announcements, and
              repeated emphasis on execution at scale. It does not reveal list pricing, contract duration, or renewal
              behavior for Mosaic as a standalone product. Revenue quality is therefore not disproven; it is simply not
              publicly legible yet, and that opacity should meaningfully compress investor confidence.
            claimRefs:
