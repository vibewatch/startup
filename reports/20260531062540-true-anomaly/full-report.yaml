              - CV010
              - CV011
      - number: '8.4'
        title: Exit path and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              A strategic M&A route looks more plausible than a near-term IPO. The company is not public-market ready on
              disclosure, and its valuation still leans more on strategic positioning than on public-economics maturity.
              The most natural buyers would be primes or larger defense-tech platforms already touching adjacent
              programs. Whether that path becomes attractive depends on proving that customer relevance can become
              repeatable revenue and that technical risk continues to compress. That is why the highest-priority
              diligence asks are straightforward: internal financials, program-level contract structure, and the current
              capital structure. If those three packages validate the thesis, the current price may look fair or better.
              If they disappoint, today’s valuation will look stretched in hindsight. The most important point is that
              exit optionality is still contingent, not earned, today either. A buyer or next-round investor would need
              the same evidence current diligence still lacks, so time does not automatically solve the valuation
              problem unless execution keeps compressing risk.
            claimRefs:
              - CV020
              - CV021
              - CV033
              - CV026
              - CV027
              - CV034
              - CV035
              - CV036
          - type: table
            tableRef: TV006
            claimRefs:
              - CV034
              - CV035
              - CV036
              - CV027
          - type: figure
            figureRef: FV004
            claimRefs:
              - CV037
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Stay engaged, but stay disciplined
            body: >-
              The company is strategically attractive enough to keep diligencing, but the current price is too
              under-supported by public economics for casual conviction.
            calloutType: recommendation
            claimRefs:
              - CV005
              - CV008
              - CV037
          - type: callout
            title: The price already assumes a lot of success
            body: >-
              Without private financial support, investors should assume the current valuation embeds program and
              technical wins that still need to be earned.
            calloutType: risk
            claimRefs:
              - CV001
              - CV004
              - CV024
