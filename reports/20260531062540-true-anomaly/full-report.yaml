            body: >-
              Technical differentiation looks strongest when the company is compared with point-solution competitors
              rather than with the broadest narrative peers. Mosaic appears stronger than generic marketing pages from
              many competitors on workflow specificity, and Jackal appears more mission-specific than logistics- or
              data-only offerings. But adjacent challengers are evolving quickly. Turion’s StarfireOS shows that
              spacecraft-native operating systems are not unique, while Impulse’s published energy-delivery specs show
              stronger transport specialization in mobility-heavy mission lanes. That means True Anomaly’s moat cannot
              rest on simply having software plus hardware. It has to rest on whether this specific combination of
              maneuverability, mission software, and government-aligned operating design produces better results for the
              target missions. Public sources are directionally supportive of that claim, but they do not yet quantify
              the lead strongly enough to remove technology-execution risk from the diligence case. In practical
              diligence terms, the missing proof is not another architecture slide. It is measured evidence that
              operators actually prefer this stack in use, that integration burden stays manageable when missions get
              more complex, and that the company can repeat the same technical performance across multiple launches and
