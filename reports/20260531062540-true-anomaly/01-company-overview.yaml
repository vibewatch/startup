  name: True Anomaly
chapter:
  number: 1
  title: Company Overview
  summary: True Anomaly entered 2026 as a four-year-old space-defense startup headquartered in Centennial, Colorado with a clearer hardware-plus-software identity than most early counterspace peers. Public disclosures show a funding staircase from a 2022 Form D through $100 million Series B, $260 million Series C, and a $650 million Series D, while CNBC reported a $2.2 billion valuation and roughly $1 billion total capital raised. The same record also shows the company still relies on government-program credibility, aggressive hiring plans, and a recovery narrative from early mission-execution friction rather than on publicly disclosed revenue or broad customer transparency.
sections:
- id: identity-model
  title: Identity, footprint, and operating model
  body: 'True Anomaly describes itself as a space-superiority company built at the intersection of autonomous spacecraft, mission software, and advanced payloads. The official homepage, Jackal page, and Mosaic page are unusually consistent: the company is not pitching a generic dual-use toolset, but a mission-specific stack for contested space operations. That matters because it frames every later diligence question around government adoption speed, manufacturing throughput, and autonomy performance rather than around a classic enterprise-software go-to-market motion. Public materials place the company in Centennial, Colorado with additional operations in Colorado Springs, Washington, D.C., and Long Beach, giving it proximity to Space Force buyers, launch and mission operations talent, and a California production base.


    The physical footprint narrative is also aggressive. Product and fundraising materials connect GravityWorks Colorado and GravityWorks California to meaningful manufacturing capacity, while CNBC says the latest financing is intended to push the factory network from roughly 140,000 square feet toward 2 million square feet over four years. That is a scale claim, not just a branding claim: it implies management believes demand for maneuverable spacecraft, software, and interceptors can support a rapid move from prototype cadence into repeat production. Public evidence still does not show disclosed revenue or gross margin, so the operating model is clearer than the business economics, but the identity and infrastructure picture is already legible.'
