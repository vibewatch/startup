    - QO021
    - QO025
  - type: missing-source
    severity: material
    topic: debt-terms
    missingEvidence: Public sources do not disclose exact debt-covenant, pricing, or draw conditions for the financing stack.
    whyItMatters: Debt can constrain hiring pace and program execution if milestones slip.
    diligencePath: Request debt agreements and any lender covenant packages tied to the raise.
    relatedQuestionRefs:
    - QO022
  - type: private-evidence-only
    severity: material
    topic: revenue-disclosure
    missingEvidence: No audited revenue, ARR, gross margin, or backlog conversion detail is public.
    whyItMatters: The latest valuation cannot be judged against disclosed operating performance without this data.
    diligencePath: Obtain management financial model, board package, and latest monthly revenue bridge.
