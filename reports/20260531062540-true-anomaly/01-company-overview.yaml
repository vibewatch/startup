    topic: cap-table
    missingEvidence: Post-Series D ownership percentages and board control mechanics are not publicly disclosed.
    whyItMatters: Governance rights and liquidation preferences matter for both control and return underwriting.
    diligencePath: Request the latest cap table, board observer rights, and side-letter summary from management.
