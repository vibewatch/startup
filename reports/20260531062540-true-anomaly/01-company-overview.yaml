- id: milestones-and-adverse
  title: Milestones, program traction, and the adverse record
  body: 'The milestone picture shows real forward movement from pre-launch promises into operational proof points. Public disclosures cover the first Jackal vehicles becoming launch-ready, Mission X launch and deployment, VICTUS HAZE selection, Space-Based Interceptors participation, Project Apollo participation, and Andromeda eligibility. Read together, these events show that True Anomaly is no longer selling only a concept slide; it is now tied to actual Space Force-adjacent programs with defined scopes and dates.


    Still, the adverse record is not empty. Mission X updates show a company still learning in public and working through commissioning friction instead of presenting an unrealistically perfect flight narrative. Budget reporting from Defense News and CSPS also makes clear that the counterspace and interceptor categories the company targets are strategically important but still resource-constrained and politically loaded. The result is a company with strong momentum and unusually strong capital support, but one that still depends on continued government acquisition reform, execution reliability, and program conversion to make the capital base look earned rather than merely available.'
