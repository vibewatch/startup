  - TU004
  - TU005
  figureRefs:
  - FU003
  - FU004
- id: verdict
  title: Customer verdict and what still needs to be proven
  body: The customer verdict is positive on strategic relevance and negative on public durability proof. True Anomaly has enough named government-linked wins to show that its offering is not merely hypothetical. At the same time, those wins are too few and too opaque to support a strong public conclusion on retention or revenue quality. That means customer diligence should focus less on whether the company has any demand at all and more on whether the demand is repeatable, expanding, and economically valuable after initial selection. The most important missing proof would be contract duration, renewal behavior, expansion logic, and a clear boundary between prototype funding and production revenue. Until those are visible, the right interpretation is that the company has credible customer traction but still meaningful concentration and conversion risk. In practice, investors should treat every public win as the start of a diligence thread rather than as a finished proof point. The company looks increasingly relevant to buyers, but public data still says little about whether those buyers become durable, high-quality accounts over time.
  claimRefs:
  - CU024
  - CU031
  - CU035
