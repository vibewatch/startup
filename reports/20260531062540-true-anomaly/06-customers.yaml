chapter:
  number: 6
  title: Customers
  summary: True Anomaly’s public customer proof is unusually government-centric but also more tangible than many early defense-space startups. VICTUS HAZE, SBI, Andromeda eligibility, Apollo, and related TacRS work show repeated access to relevant buyers, yet the same record leaves retention, renewal, contract duration, and production-conversion economics largely private. The customer verdict is therefore favorable on relevance and freshness, but still cautious on durability and concentration.
sections:
- id: base
  title: Customer base and segmentation
  body: The most important fact about the customer base is that it is visibly government-heavy. The public record does not show a broad array of private enterprises buying Mosaic or Jackal on standard commercial terms. Instead, it shows a cluster of U.S. defense-space offices, mission sponsors, and adjacent program pathways that repeatedly surface in the company’s announcements and in government reporting. That does not make the customer story weak; it makes it specific. The visible buyer, payer, and user roles map much more closely to military program structures than to traditional commercial SaaS or aerospace channels. Public materials also still lean on language about allies and partners, but the named proof set remains concentrated in the U.S. ecosystem. Investors should therefore read customer diversity as an aspiration, while reading government mission relevance as an already visible strength.
  claimRefs:
  - CU001
  - CU002
  - CU011
  - CU012
  - CU013
  - CU022
  - CU026
  - CU032
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: proof
  title: Named customer proof and adoption trajectory
  body: 'The named proof set is small but meaningful. VICTUS HAZE is the clearest example because both the company and SpaceWERX describe a funded mission with a specific responsive-space objective. The SBI and Andromeda opportunities matter differently: they validate that True Anomaly is inside the government’s competitive set for high-priority missions, even if public sources do not disclose the company’s exact booked value or task-order conversion. Project Apollo and the TacRS direct-to-Phase II contract sit further toward the prototype or capability-expansion end of the spectrum, but they still show repeated trust from the same broad buyer ecosystem. Taken together, these wins suggest an adoption trajectory that is less about mass customer acquisition and more about repeated entrance into adjacent missions around the same defense-space problem set. That pattern is strategically attractive because it implies the same buyer community may keep pulling the company into adjacent opportunities if early performance holds.'
  claimRefs:
  - CU003
  - CU004
  - CU005
  - CU006
