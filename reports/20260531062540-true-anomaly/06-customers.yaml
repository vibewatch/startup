- id: durability
  title: Durability, expansion, and concentration risk
  body: 'Durability is where the public customer story weakens materially. The record does not disclose NRR, GRR, churn, renewal rates, contract length, customer satisfaction, or explicit production conversions. That leaves investors relying on proxy indicators such as repeat award velocity, system-use ambition, and management hiring plans. Those proxies are useful, but they do not answer the core question of whether a named win turns into durable, economic demand. The most plausible expansion path is still inside the same government ecosystem—more scope, more programs, or more software inside existing mission lanes—rather than broad diversification into unrelated commercial buyers. That concentration creates both upside and risk: one good mission can compound quickly, but setbacks in a small number of programs can disproportionately shape growth. It also means that a single delayed task order can have an outsize signaling effect on the entire outside narrative.'
  claimRefs:
  - CU014
  - CU015
  - CU016
  - CU017
  - CU018
  - CU019
  - CU021
  - CU023
  - CU028
  - CU034
