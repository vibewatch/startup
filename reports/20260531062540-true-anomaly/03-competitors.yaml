  evidenceGaps:
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: Competitor pricing and packaging are rarely public enough for clean apples-to-apples benchmarking.
    whyItMatters: Without real pricing, it is hard to know whether True Anomaly wins on performance or subsidized positioning.
    diligencePath: Collect proposals, budgetary quotes, and government line-item pricing where available.
    relatedQuestionRefs:
    - QP022
  - type: private-evidence-only
    severity: material
    topic: repeat-wins
    missingEvidence: Public sources do not show repeated competitive wins or renewals explicitly beating alternatives.
    whyItMatters: Durable moats are normally visible through repeat purchase behavior, not just feature claims.
    diligencePath: Request recompete data, renewal rates, and named competitive takeaways from management.
    relatedQuestionRefs:
    - QP021
    - QP025
  - type: stale
    severity: minor
    topic: new-entrants
    missingEvidence: The next 12–24 months could bring new entrants not yet visible in public sources.
    whyItMatters: A fast-moving sector can compress moats quickly after a funding wave.
    diligencePath: Refresh the competitor map quarterly using contract lists and funding announcements.
    relatedQuestionRefs:
    - QP024

