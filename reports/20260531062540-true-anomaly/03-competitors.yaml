company:
  name: True Anomaly
chapter:
  number: 3
  title: Competitors
  summary: True Anomaly competes in a fragmented but increasingly crowded 2026 field. Its integrated Jackal-plus-Mosaic stack differentiates it from pure SDA, safety-automation, mobility, and servicing vendors, yet the same market also includes integrated challengers like Turion and much larger capture threats from Anduril and primes. The main competitive risk is not one perfect substitute; it is a set of adjacent vendors and better-capitalized integrators that can take slices of the same government modernization budgets before True Anomaly establishes repeatable incumbency.
sections:
- id: landscape
  title: 'Landscape: direct peers, adjacents, and substitutes'
  body: The competitive field is broader than direct spacecraft peers. LeoLabs, Slingshot, and Kayhan compete for the intelligence, automation, and operator-workflow layer; Astroscale, Orbit Fab, and Impulse compete for mobility, sustainment, and orbital-services budgets; Rogue and Turion represent more integrated new-space challengers; and Anduril plus primes retain the ability to absorb or outbid specialized startups on strategic programs. That matters because True Anomaly does not need to lose a Jackal-for-Jackal bakeoff to lose share. It can also lose because an SDA vendor plus a mobility vendor plus a large systems integrator combine into a more trusted offer than a still-scaling integrated startup. The field is therefore best understood as a layered set of adjacent and direct pressures rather than as a simple one-to-one peer list in 2026 overall today still.
  claimRefs:
