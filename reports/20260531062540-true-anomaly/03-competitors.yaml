- id: capability-compare
  title: Capability, GTM, and trust comparison
  body: True Anomaly’s strongest competitive point remains integration. Most reviewed vendors are either software/data specialists or mobility/logistics specialists, whereas Jackal and Mosaic together promise a combined hardware-software mission stack. That creates a credible differentiation case in operator workflow and doctrine alignment. The problem is that integration does not eliminate competition; it simply changes its form. LeoLabs and Slingshot may look stronger on pure sensing and operational-intelligence surfaces, while Impulse, Orbit Fab, and Astroscale look stronger on mobility and servicing. Turion is notable because it also markets integrated spacecraft and software, making it one of the closer startup analogues. On the other end of the spectrum, Anduril and primes can package adjacent capabilities into bids that benefit from far more capital and procurement history than True Anomaly currently discloses.
