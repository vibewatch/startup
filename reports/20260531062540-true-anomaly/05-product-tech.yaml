  - FE002
- id: architecture
  title: Architecture, deployment, and production logic
  body: 'The architecture claims are detailed enough to matter. Jackal’s public specs cover Delta-V, power, payload capacity, and mission hardpoints; Mosaic’s product page details mission planning, flight software, on-orbit operations, constellation management, space-domain awareness, and battle-management workflows. Mission X-2 then connects those claims to operational steps: stabilization, solar-array deployment, command and control, integration with multiple ground-station providers, and test procedures conducted through Mosaic. Public materials also stress high-rate manufacturability and a production footprint spanning Colorado and California. All of that supports a coherent engineering and manufacturing story. What it does not yet provide is the type of hard reliability curve, uptime history, or qualification data that would let an outside investor conclude the product stack has crossed definitively from test cadence into industrialized delivery cadence.'
  claimRefs:
  - CE009
  - CE010
  - CE011
  - CE012
  - CE013
  - CE015
  - CE016
  - CE017
  - CE036
  tableRefs:
  - TE003
  figureRefs:
  - FE003
- id: trust-and-maturity
  title: Trust, compliance, and the maturity gap
  body: Public trust signals are present but still shallow. The company publishes privacy and terms pages, advertises GovCloud and local-network deployment options, and emphasizes human-in-the-loop autonomy instead of fully opaque black-box automation. Those are positives. At the same time, public materials do not disclose formal cyber certifications, software-security benchmarks, uptime figures, or mission-success statistics. That leaves a gap between “the architecture could support sensitive missions” and “the architecture has publicly demonstrated the trust posture a sensitive buyer would want.” The same pattern shows up in product maturity. Mission X-2 demonstrates real progress and a faster iteration tempo, but it also confirms the company is still learning through flights in public. The product verdict is therefore favorable on coherence and ambition, but still provisional on measured reliability and trust proof. A buyer can see enough to believe the system is serious, but not enough to treat trust and quality as fully de-risked in public today at scale publicly today.
  claimRefs:
  - CE020
  - CE021
  - CE022
  - CE023
  - CE024
  - CE025
  - CE029
  - CE030
  - CE031
  - CE032
  - CE035
  tableRefs:
  - TE004
  figureRefs:
  - FE004
- id: differentiation
  title: Differentiation versus adjacent technical challengers
  body: Technical differentiation looks strongest when the company is compared with point-solution competitors rather than with the broadest narrative peers. Mosaic appears stronger than generic marketing pages from many competitors on workflow specificity, and Jackal appears more mission-specific than logistics- or data-only offerings. But adjacent challengers are evolving quickly. Turion’s StarfireOS shows that spacecraft-native operating systems are not unique, while Impulse’s published energy-delivery specs show stronger transport specialization in mobility-heavy mission lanes. That means True Anomaly’s moat cannot rest on simply having software plus hardware. It has to rest on whether this specific combination of maneuverability, mission software, and government-aligned operating design produces better results for the target missions. Public sources are directionally supportive of that claim, but they do not yet quantify the lead strongly enough to remove technology-execution risk from
    the diligence case. In practical diligence terms, the missing proof is not another architecture slide. It is measured evidence that operators actually prefer this stack in use, that integration burden stays manageable when missions get more complex, and that the company can repeat the same technical performance across multiple launches and customer environments.
  claimRefs:
  - CE026
  - CE027
  - CE028
  - CE033
  - CE034
  - CE035
