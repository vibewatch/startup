company:
  name: True Anomaly
chapter:
  number: 5
  title: Product & Technology
  summary: True Anomaly’s product story is one of integrated mission hardware and software, not a single spacecraft SKU. Jackal, Mosaic, advanced payloads, and interceptor work are presented as parts of a common space-superiority architecture built for maneuver, autonomy, and operational integration. Public evidence strongly supports product coherence and technical ambition, but it is materially weaker on quantified reliability, formal certifications, and proof that the stack already performs at repeatable production quality.
sections:
- id: definition
  title: What the company actually sells
  body: 'The company’s technology surface is wider than a single spacecraft. Jackal is the physical on-orbit vehicle, Mosaic is the mission software and orchestration layer, advanced payloads extend sensing and mission functionality, and the interceptor line extends the portfolio into homeland-defense use cases. This matters because it explains why the company’s differentiation claim depends on integration, not just on propulsion or autonomy in isolation. The public materials are unusually consistent on this point. Jackal is always presented with Mosaic, and program updates repeatedly describe the software as part of the operational system rather than as back-office tooling. In diligence terms, this is a real strength: the product definition is clear. The unanswered question is not what the company is trying to build, but how mature each layer is relative to the ambition of the combined stack.'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
  - CE006
  - CE007
  - CE008
  tableRefs:
  - TE001
