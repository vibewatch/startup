  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: reliability-proof
    missingEvidence: No public mission-success-rate, uptime, or reliability statistics exist.
    whyItMatters: Investors need proof that the stack works repeatedly, not just impressively.
    diligencePath: Request fleet reliability data, anomaly logs, and qualification reports.
    relatedQuestionRefs:
    - QE020
    - QE025
  - type: missing-source
    severity: material
    topic: security-certifications
    missingEvidence: Public materials do not disclose software-security certifications or formal control frameworks.
    whyItMatters: Sensitive missions require more than a privacy policy and architecture claims.
    diligencePath: Request SSP, certifications, and red-team or third-party audit materials.
    relatedQuestionRefs:
    - QE021
    - QE024
  - type: missing-source
    severity: minor
    topic: developer-docs
