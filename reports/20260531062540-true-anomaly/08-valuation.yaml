- id: exit
  title: Exit path and final diligence asks
  body: 'A strategic M&A route looks more plausible than a near-term IPO. The company is not public-market ready on disclosure, and its valuation still leans more on strategic positioning than on public-economics maturity. The most natural buyers would be primes or larger defense-tech platforms already touching adjacent programs. Whether that path becomes attractive depends on proving that customer relevance can become repeatable revenue and that technical risk continues to compress. That is why the highest-priority diligence asks are straightforward: internal financials, program-level contract structure, and the current capital structure. If those three packages validate the thesis, the current price may look fair or better. If they disappoint, today’s valuation will look stretched in hindsight. The most important point is that exit optionality is still contingent, not earned, today either. A buyer or next-round investor would need the same evidence current diligence still lacks, so time does not automatically solve the valuation problem unless execution keeps compressing risk.'
