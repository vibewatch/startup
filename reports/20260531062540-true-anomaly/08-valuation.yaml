chapter:
  number: 8
  title: Valuation
  summary: True Anomaly looks strategically important enough to merit continued diligence, but the reported 2026 valuation appears ahead of the public evidence on revenue quality, margin path, and capital structure. The right stance is not “avoid” so much as “price-sensitive, high-risk, and diligence-dependent.” A credible bull case exists, but the current public record supports only a cautious, scenario-based underwriting frame.
sections:
- id: thesis
  title: Thesis, anti-thesis, and recommendation
  body: 'The core thesis is easy to state: a well-funded, integrated space-superiority supplier with real government-program relevance could compound quickly if program access turns into repeatable production economics. The anti-thesis is just as clear: the public record still does not show enough revenue, margin, or capital-structure detail to justify treating the current price as obviously attractive. Those two statements can both be true. That is why the right recommendation is not an outright rejection; it is a disciplined “research more” stance. Investors should remain engaged because the category and company matter, but they should not confuse strategic importance with current valuation support. Public evidence supports ongoing diligence, not blind conviction, and it should keep price discipline front and center at all times today.'
  claimRefs:
  - CV003
  - CV004
  - CV005
  - CV006
