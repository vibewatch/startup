- id: scenarios
  title: Bull, base, and bear scenarios
  body: The bull case assumes repeated mission success, broader program scope, and credible emergence of production economics before the next financing event. The base case assumes the company stays strategically relevant and well-funded but still requires more capital or time before operating quality becomes clear. The bear case assumes another mission stumble, a budget or program setback, or capital markets that become less patient with strategically important but under-disclosed defense-space names. Because public revenue is not available, these scenarios should be read as probabilistic strategic outcomes rather than as spreadsheet outputs pretending to be precise. Scenario-based reasoning is the only honest way to discuss valuation when the underlying operating data remains mostly private. It is also the right way to force discipline around downside, because a company with partial public proof can look resilient until one visible mission or program event changes investor assumptions all at once.
  claimRefs:
  - CV009
  - CV010
  - CV011
  - CV019
  - CV024
