- id: price-support
  title: How much the current price is actually supported
  body: The headline price is real in the sense that CNBC reported it, and the financing base behind it is substantial. But price support is only partial. Public sources support strategic relevance, fundraising strength, and buyer interest; they do not support a strong claim about current revenue quality or margin durability. Public comps are helpful mainly as a reminder of how much disclosure mature markets usually demand. Rocket Lab, Palantir, Redwire, Kratos, and Parsons all offer richer filing and market-data surfaces than True Anomaly does today. That does not mean True Anomaly is overvalued in some terminal sense; it means the current price has to be treated as a strategic bet with limited public economic proof. Entry discipline therefore matters more than category excitement. Investors should explicitly recognize that strategic scarcity and national-security excitement can keep a private mark elevated for some time even when public underwriting remains incomplete. The price can still work from here, but the burden of proof now shifts to execution, disclosure, and contract conversion rather than to another round of narrative momentum.
  claimRefs:
  - CV001
  - CV002
  - CV016
  - CV017
