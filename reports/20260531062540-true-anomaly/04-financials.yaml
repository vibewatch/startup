  - type: private-evidence-only
    severity: material
    topic: software-economics
    missingEvidence: There is no public evidence of standalone Mosaic pricing or renewal patterns.
    whyItMatters: The margin thesis depends partly on software economics, not just hardware delivery.
    diligencePath: Request Mosaic bookings, ACV, renewal data, and attach rates.
    relatedQuestionRefs:
    - QI003

