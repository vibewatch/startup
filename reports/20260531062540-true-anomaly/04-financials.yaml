  - FI002
- id: traction-and-disclosure
  title: Traction proxies versus the disclosure gap
  body: The company’s strongest public metrics are not financial statements; they are fundraising milestones, headcount targets, locations, and program wins. That can still be useful. Program wins around VICTUS HAZE, Andromeda, Apollo, and interceptors show demand relevance. But when compared with public peers, the disclosure gap is stark. Rocket Lab and Palantir, for example, show market cap and quarterly revenue on Yahoo Finance, while Redwire, Kratos, and Parsons maintain robust investor-relations and SEC filing surfaces. That comparison does not make True Anomaly weak; it simply makes it private and opaque. Investors should therefore separate “traction exists” from “revenue quality is known.” Public evidence supports the first statement and does not support the second with enough precision yet today. The practical consequence is that outside investors can see strategic progress without yet seeing whether that progress is economically efficient. That disclosure gap should directly lower confidence in any revenue multiple or margin assumption built from public evidence alone. It also means valuation work has to lean far more heavily on strategic relevance, buyer proof, and capital access than on the cleaner cohort, margin, and renewal analysis investors would usually expect at this price point.
  claimRefs:
  - CI013
  - CI014
  - CI021
  - CI022
  - CI023
  - CI031
  - CI034
  tableRefs:
  - TI005
  figureRefs:
  - FI003
- id: financial-verdict
  title: Financial verdict and diligence blockers
  body: The financial verdict is ultimately a judgment about confidence, not just about missing cells. True Anomaly has clear funding strength and real strategic demand signals, but its operating-quality profile remains under-specified in public. The main adverse indicators are budget timing risk, the lack of disclosed unit economics, unknown debt terms, and the possibility that large capital raises are compensating for a still-unproven path to efficient production. None of these are thesis-breaking by themselves, but together they keep the company in the “research more” zone. The capital stack is impressive; the economic stack remains mostly private. Any serious underwriting decision therefore needs internal financial materials, contract timing detail, debt documents, and a clearer explanation of how Mosaic monetizes inside and outside bundled mission work. It also needs a clear program-by-program bridge from funded technical progress to revenue recognition and cash conversion, because otherwise the company may be strategically important without yet being economically mature.
  claimRefs:
  - CI015
