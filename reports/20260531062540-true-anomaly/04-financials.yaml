  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: operating-metrics
    missingEvidence: No public revenue, gross margin, burn, or backlog-conversion data is available.
    whyItMatters: A financial verdict without operating metrics can only be provisional.
    diligencePath: Request historical P&L, latest monthly metrics, and program-level gross margin.
    relatedQuestionRefs:
    - QI018
    - QI024
    - QI025
  - type: missing-source
    severity: material
    topic: debt-terms
    missingEvidence: Debt covenants, pricing, and collateral are not publicly disclosed.
    whyItMatters: Debt could materially change downside flexibility and financing timing.
    diligencePath: Review signed debt documents and board materials.
