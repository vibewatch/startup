- id: sizing-conclusion
  title: Sizing conclusion and remaining diligence gaps
  body: A conservative reading of the public record supports a near-term market thesis built on a handful of visible programs and budget buckets rather than on a single sweeping TAM number. The $5.6 billion interceptor pool, Andromeda’s $1.8 billion ceiling, and SDA and responsive-space procurement activity all support a multi-billion-dollar opportunity set, but the company’s attainable share over the next several years is still limited by execution, procurement timing, and the narrow set of visible buyers. Public sources do not yet reveal a clean allied-government SAM, nor do they show a durable non-government software budget for Mosaic-style mission orchestration. That is not a reason to dismiss the market; it is a reason to preserve uncertainty honestly. The most important diligence question is therefore not whether the market is large enough to support a winner, but whether True Anomaly can convert a strategically urgent, procurement-constrained market into repeatable program revenue
    faster than adjacent vendors and primes can narrow the opportunity window.
