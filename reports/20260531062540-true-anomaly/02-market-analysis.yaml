- id: buyers-and-path
  title: Buyer, user, payer, and adoption path
  body: 'The adoption path is much more legible than the long-run TAM. Public sources point to a relatively small number of government offices controlling the near-term buying process: Space Safari and SpaceWERX for responsive-space efforts like VICTUS HAZE, Space Systems Command for interceptors and other portfolio buys, and adjacent SDA offices for cohort-style work such as Project Apollo. Defense One’s reporting is especially important because it suggests the Space Force wants a pool of commercial firms with real products and is willing to revisit traditional programs to incorporate multiple vendors. That is favorable for True Anomaly because it lowers entry barriers for companies that can demonstrate integrated hardware and software rather than wait for a single monolithic platform program. At the same time, the immediate user remains the military operator, not a generic enterprise customer. That means procurement mechanics, security posture, and on-orbit performance matter more than
    classic software-sales efficiency in determining market conversion.'
