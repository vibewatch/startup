chapter:
  number: 2
  title: Market Analysis
  summary: True Anomaly’s market is strategically important but much narrower than generic “space economy” rhetoric implies. The strongest 2026 demand signals come from U.S. government programs that combine space-domain awareness, tactically responsive space, and homeland-defense tracking/interceptor budgets. Public evidence supports a meaningful multi-billion-dollar opportunity set, but the company’s near-term obtainable market is still constrained by procurement timing, compliance frictions, and the limited number of visible buyers able to award production-scale work.
sections:
- id: market-boundary
  title: Market boundary and the spend that really matters
  body: 'True Anomaly is not participating in the whole commercial space economy, and diligence should not let management-style rhetoric imply otherwise. The relevant 2026 market boundary is the intersection of contested-space operations, space domain awareness, tactically responsive space, mobility/logistics adjacency, and the emerging space-based-interceptor effort. Air & Space Forces reported that the Space Force’s new commercial strategy ranks SATCOM, SDA, and mobility/logistics as priority areas for hybrid military-commercial architectures, while CSPS shows Golden Dome is moving real dollars into space tracking and interceptors. Those sources create a credible top-down demand pool, but they also highlight why a broad TAM narrative is misleading: much of the Space Force budget, and much of the broader defense-space market, does not map cleanly to Jackal, Mosaic, or True Anomaly’s payload and interceptor portfolio. The practical market question is therefore not “Is space large?” but “Which
    mission areas are buying exactly the combination of maneuver, mission software, and tactical responsiveness that True Anomaly is building?”'
