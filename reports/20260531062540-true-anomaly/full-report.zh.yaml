companyProfile:
  summary: >-
    True Anomaly 于 2022 年成立，总部位于 Centennial, Colorado，打造一套一体化太空优势技术栈，覆盖 Jackal 可机动自主航天器、Mosaic
    任务软件、先进载荷，以及较新的拦截器相关工作。公司运营地点包括 Centennial、Colorado Springs、Washington, D.C. 和 Long
    Beach；它的叙事围绕美国政府、盟友和伙伴任务展开，而不是广义商业航天需求。公开证据显示，公司融资推进很快，制造扩张野心增强，也多次进入可见的国防航天项目，但收入、利润率和留存仍缺少公开披露。
