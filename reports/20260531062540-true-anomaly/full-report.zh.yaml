  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与真正重要的支出
        blocks:
          - type: paragraph
            body: >-
              True Anomaly 参与的不是整个商业航天经济，尽调也不应让管理层式话术暗示相反结论。2026 年真正相关的市场边界，是争夺性太空作战、太空域感知、快速响应太空、机动 /
              后勤相邻需求，以及正在形成的天基拦截器计划之间的交集。Air & Space Forces 报道称，Space Force 的新商业战略把 SATCOM、SDA 和机动 /
              后勤列为军民混合架构的优先领域；CSPS 则显示，Golden Dome 正把真实资金投向太空跟踪和拦截器。这些来源构成可信的自上而下需求池，但也说明为什么宽泛 TAM 叙事会误导：Space Force
              预算中的很大一部分，以及更广泛国防航天市场中的很大一部分，并不能干净映射到 Jackal、Mosaic，或 True Anomaly
              的载荷和拦截器组合。实际市场问题因此不是“太空是否足够大？”，而是“哪些任务领域正在购买 True Anomaly 正在打造的机动、任务软件和战术响应能力组合？”
            claimRefs:
