            body: >-
              客户结论是：战略相关性为正，公开耐久性证明为负。True Anomaly
              拥有足够多具名、与政府相关的赢单，说明其产品并非只是想象。同时，这些赢单太少、太不透明，无法支撑关于留存或收入质量的强公开结论。因此，客户尽调的重点不应是公司到底有没有需求，而应是初始入选之后，需求能否重复、扩张并具备经济价值。最重要的缺失证明，是合同期限、续约行为、扩张逻辑，以及原型资金和生产收入之间的清晰边界。看到这些之前，正确解读是：公司有可信客户牵引，但集中和转化风险仍然显著。实际操作上，投资人应把每一个公开赢单都当作一条尽调线索的起点，而不是完成的证明点。公司看起来与买方越来越相关，但公开数据仍很少说明这些买方会不会随着时间变成耐久、高质量账户。
