  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接同业、相邻玩家与替代品
        blocks:
          - type: paragraph
            body: >-
              竞争场并不只限于直接航天器同业。LeoLabs、Slingshot 和 Kayhan 争夺情报、自动化和操作员工作流层；Astroscale、Orbit Fab 和 Impulse
              争夺机动、保障和轨道服务预算；Rogue 和 Turion 代表更一体化的新航天挑战者；Anduril 加上传统主承包商，则仍有能力在战略项目上吸收或出价压过专业初创公司。这一点重要，因为 True
              Anomaly 不一定非要输掉 Jackal 对 Jackal 的正面对比才会丢份额。它也可能输给一种组合：一个 SDA
              供应商、一个机动供应商、再加一个大型系统集成商，拼出比仍在扩张的一体化初创公司更受信任的方案。因此，截至 2026
              年，竞争场最好被理解为一组相邻压力和直接压力叠在一起，而不是一张简单的一对一同业名单；总体上，如今仍是如此。
