      - number: '7.4'
        title: 缓释、监控与投资逻辑破裂触发点
        blocks:
          - type: paragraph
            body: >-
              可见缓释措施有意义，但不完整。资本买来时间；领导层深度买来流程纪律；项目分散在边际上降低单一项目依赖。这些都是真正的正面因素。但它们都不能替代硬监控。最清楚的公开投资逻辑破裂触发点，仍是又一次有意义的任务异常、核心政府机会小集合中的重大预算或项目失利，或出现挑战买方信任的合规问题证据。最有用的尽调动作因此不是简单列风险，而是画出如何监控风险：索要债务文件、质量指标、保险覆盖、项目转化里程碑和合规材料。拿到这些之前，剩余风险画像仍高，尽管管理层可见缓释动作方向合理。实际操作上，风险仪表盘应持续跟踪五件事：任务异常和险些事故，小型可见客户集合内部的预算或项目滑坡，可能改变排期的供应商或发射变化，确认控制仍然有效的合规材料，以及任何融资灵活性收窄的迹象。如果管理层能在这五个向量上展示纪律，风险判断会迅速改善。否则，下行会快速复合，因为同一批少数事件会同时打击客户信心、资本准入和整个公司的战略叙事。
