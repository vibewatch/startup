              财务结论最终是在判断信心，而不只是补齐缺失单元格。True Anomaly
              融资实力清晰，也有真实的战略需求信号，但公开层面的运营质量画像仍不充分。主要反向指标包括预算时点风险、缺少披露的单位经济、债务条款未知，以及大额融资可能正在补偿一条尚未证明高效生产的路径。这些单项都不必然打破投资逻辑，但合在一起让公司仍处于“继续研究”区域。资本结构令人印象深刻；经济结构大多仍是私有信息。任何严肃承销决定都需要内部财务材料、合同时间细节、债务文件，以及更清楚解释
              Mosaic 如何在捆绑任务内外变现。还需要按项目搭出一座桥，把受资助技术进展连接到收入确认和现金转化；否则，公司可能战略上重要，却尚未经济成熟。
