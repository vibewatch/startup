  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑、反向逻辑与建议
        blocks:
          - type: paragraph
            body: >-
              核心投资逻辑很容易表述：一家资金充足的一体化太空优势供应商，如果真实政府项目准入转化为可重复生产经济性，可能快速复利。反向逻辑同样清楚：公开记录仍没有给出足够收入、利润率或资本结构细节，无法把当前价格视为显然有吸引力。这两句话可以同时成立。因此，正确建议不是直接否决，而是有纪律的“继续研究”。投资人应保持跟进，因为类别和公司都重要；但不应把战略重要性误认为当前估值支撑。公开证据支持继续尽调，不支持盲目信念；价格纪律应始终放在中心位置，今天尤其如此。
