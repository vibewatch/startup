              的护城河不能只建立在“有软件也有硬件”上。护城河必须落在这组具体的机动性、任务软件和政府对齐运营设计，是否能为目标任务带来更好结果。公开来源在方向上支持该主张，但尚未强到足以量化领先幅度、移除技术执行风险。按实际尽调语言，缺失的证明不是另一张架构幻灯片，而是可测量证据：操作员确实更偏好这套技术栈，任务变复杂时集成负担仍可控，公司能在多次发射和多个客户环境中重复同样技术表现。
