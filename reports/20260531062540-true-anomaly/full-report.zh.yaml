            body: >-
              伙伴依赖不是边缘问题。发射服务商、项目办公室、机动伙伴和相邻生态参与者，都会影响公司能否交付、扩张并捕获价值。这意味着 True Anomaly
              暴露的不只是自身工程和运营风险，也包括其他方的时点和可靠性。同样逻辑延伸到财务模型：少数公开项目在叙事中承担了过多重量，因此预算时点和下选风险会很快变成估值风险。即便完成大额融资，高资本强度和不透明债务条款仍让未来融资依赖留在框架内。简言之，这是一门外部执行伙伴和政府日历几乎与内部产品速度同样重要的生意。
