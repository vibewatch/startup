      - number: '2.3'
        title: 增长驱动、替代方案，以及市场可能比口号更窄的原因
        blocks:
          - type: paragraph
            body: >-
              2026 年的顺风真实存在。National Defense Strategy 把本土防御和国防工业基础复兴置于采购逻辑中心；Golden Dome
              明确扩大对跟踪层和拦截层的需求；多家相邻公司也证明，政府买家愿意在
              SDA、机动和后勤领域与非传统供应商签约。这些事实支撑的是一个真实市场，而不是理论市场。但同一批来源也说明，投资人应对市场规模保持纪律。Defense News 仍把域感知和反太空放在小规模 Space
              Force 预算内的资源受限优先事项中；Office of Space Commerce 也提醒潜在出口方，航天硬件销售仍与 EAR/ITAR
              合规纠缠在一起。与此同时，LeoLabs、Anduril、Astroscale、Orbit Fab 和 Impulse
              等相邻供应商，即便产品架构不同，也在争夺同一批现代化美元的一部分。结果是：这是一个战略属性强、增长驱动多的市场，但转化时点和预算捕获，仍比国防航天顶线支出的原始规模更重要。
