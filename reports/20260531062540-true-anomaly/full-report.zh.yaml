            body: >-
              耐久性是公开客户故事明显变弱的地方。记录没有披露
              NRR、GRR、流失、续约率、合同期限、客户满意度或明确生产转化。投资人只能依赖重复授标速度、系统使用雄心和管理层招聘计划等代理指标。这些代理指标有用，但不能回答核心问题：具名赢单是否会变成耐久且经济的需求。最可能的扩张路径仍在同一政府生态内部——更多范围、更多项目，或在既有任务航道中加入更多软件——而不是广泛多元化进入无关商业买方。这种集中既创造上行，也带来风险：一个好任务可以快速复利，但少数项目受挫会不成比例地影响增长。它还意味着，单个任务订单延迟可能对整个外部叙事产生过大信号效应。
