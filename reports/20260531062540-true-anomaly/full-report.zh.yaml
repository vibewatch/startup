chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、布局与运营模式
        blocks:
          - type: paragraph
            body: >-
              True Anomaly 把自己定义为太空优势公司，位置在自主航天器、任务软件和先进载荷的交叉处。官网、Jackal 页面和 Mosaic
              页面口径异常一致：公司卖的不是通用军民两用工具集，而是用于争夺性太空作战的任务专用技术栈。这一点重要，因为它把后续每个尽调问题都拉回到政府采用速度、制造吞吐量和自主性能，而不是典型企业软件市场进入路径。公开资料显示，公司总部在
              Centennial, Colorado，并在 Colorado Springs、Washington, D.C. 和 Long Beach 设有运营点，靠近 Space Force
              买家、发射和任务运营人才，以及 California 生产基地。


              实体布局叙事同样激进。产品和融资材料把 GravityWorks Colorado、GravityWorks California 与可观制造产能绑定；CNBC 称最新融资将推动工厂网络在四年内从约
              140,000 square feet 扩至 2 million square
              feet。这不是品牌包装，而是规模判断：管理层相信，可机动航天器、软件和拦截器的需求足以支撑公司从原型节奏快速转向重复生产。公开证据仍未给出收入或毛利率，所以运营模式比商业经济性更清楚；但公司的身份和基础设施轮廓已经清晰。
