            body: >-
              乐观情景假设公司能多次完成任务，项目范围继续扩大，并且在下一次融资前拿出可信的量产经济性。基准情景假设公司仍具战略相关性、资金也充足，但运营质量是否过关，还需要更多资本或更长时间验证。悲观情景则假设任务再次失手、预算或项目受挫，或资本市场对战略重要但披露不足的国防航天公司失去耐心。公开收入数据缺位，因此这些情景应当被读作概率化的战略结果，而不是假装精确的电子表格输出。底层运营数据大多仍是私有信息，讨论估值唯一诚实的方法就是做情景推演。它也能逼着投资人严肃看待下行风险：一家只有部分公开验证的公司，看起来可能很有韧性，直到一次可见任务或项目事件一次性改写投资人假设。
