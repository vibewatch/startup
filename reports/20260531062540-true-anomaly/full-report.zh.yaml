            body: >-
              战略并购路径比近期 IPO
              更可信。公司在披露上还没准备好登陆公开市场；当前估值更多靠战略位置支撑，而不是靠已成熟的公开经济指标。最自然的买方会是已经触及相邻项目的主承包商，或更大的国防科技平台。该路径能否有吸引力，取决于公司能否证明客户相关性可以变成可重复收入，且技术风险继续收窄。因此最高优先级的尽调问题很直接：内部财务、项目层面的合同结构，以及当前资本结构。如果这三套材料验证了投资逻辑，当前价格可能显得合理，甚至更好；如果材料令人失望，事后看今天的估值会显得偏高。最重要的是，退出可选性到今天仍是有条件的，还没有真正挣到手。买方或下一轮投资人需要的证据，和当前尽调缺少的证据一样；除非执行继续压缩风险，时间本身不会自动解决估值问题。
