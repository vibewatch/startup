            body: >-
              里程碑图景显示，公司确实从发射前承诺走向了运营证明点。公开披露覆盖首批 Jackal 飞行器达到发射就绪、Mission X 发射和部署、VICTUS HAZE 入选、参与 Space-Based
              Interceptors、参与 Project Apollo，以及获得 Andromeda 资格。合起来看，True Anomaly 已不再只卖概念幻灯片；它已经绑定到有明确范围和日期的 Space Force
              相关实际项目。


              但反向记录并非空白。Mission X 更新显示，公司仍在公开环境中学习，在调试摩擦中推进，而不是呈现不现实的完美飞行叙事。Defense News 和 CSPS
              的预算报道也说明，公司瞄准的反太空和拦截器类别具有战略重要性，但资源仍受限，政治负荷也高。因此，公司动能强、资本支持异常强，但仍依赖持续的政府采购改革、执行可靠性和项目转化，才能让资本基础看起来是“挣来的”，而不只是“拿到的”。
