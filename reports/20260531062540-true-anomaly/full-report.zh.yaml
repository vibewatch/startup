      - number: '1.3'
        title: 融资路径、估值与规模主张
        blocks:
          - type: paragraph
            body: >-
              对一家私营国防航天初创公司来说，True Anomaly 的融资阶梯异常清楚。已审阅记录显示，公司在 2022 年 12 月向 EDGAR 提交 Form D，随后拿到 Riot Ventures 领投的
              $100 million Series B、Accel 领投且 Stifel 提供债务支持的 $260 million Series C，再到包含 $50 million 债务的 $650 million
              Series D。CNBC 2026 年 4 月报道把最新私募结果交叉定位在 $2.2 billion 估值和约 $1 billion
              累计融资。对一家未公开披露收入的公司来说，这些数字很大，也解释了为什么估值纪律会成为最终章节的核心问题。


              同时，资本故事还不等于变现故事已经跑通。本文使用的资料都没有披露收入运行率、毛利率、单位经济、或经审计的积压订单转化。公司显然有足够资金扩建设施和团队，也能列举多个政府相关项目，但融资额应被理解为投资人信念和任务紧迫性的证据，而不是运营模式已经具备可持续经济重复性的证明。披露出来的融资强度与未披露的收入质量之间的缺口，是尽调的核心张力。
