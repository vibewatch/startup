      - number: '3.4'
        title: 哪些信号最能改变竞争判断
        blocks:
          - type: paragraph
            body: >-
              两个公开信号最能提升对竞争逻辑的信心。第一，是明确的重复赢单或续约证据，显示 True Anomaly
              击败可信替代方案，并在同一账户内扩张。第二，是更清楚的定价和打包记录，因为当下公开市场很难比较纯软件、软硬件结合和项目集成商方案。看到这些证明之前，审慎解读应是：True Anomaly
              处在强但受争夺的位置；差异化足以重要，但证据不足以假设长期在位优势。竞争尽调因此不该围绕一个“主要对手”做选择，而应映射哪些相邻组合会在公司最重要的政府采购路径上拿走份额。投资人还应要求查看重新竞标结果、技术比测细节，以及客户不是仅仅因为一个小众项目需要再加入一家非传统供应商才选择公司的证据。没有这些证明，护城河论证仍有希望但不完整。下一步最高信号量的工作，是审阅实际提案评估和授标后扩张行为，因为这些文件能说明公司获胜究竟是技术更好、集成更容易、价格更低，还是仅仅因为买方池仍想保留多个选项，而公司只是其中更新的一个。
