  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              最可见的监管风险是出口管制。Office of Space Commerce 明确表示，商业航天公司在获批后仍需要处理 EAR、ITAR
              和合规；公开法律页面则只展示了一个轻量的外部合规表面。这不意味着公司不合规，而是外部投资人尚未看到与产品集敏感性相匹配的公开证明。随着公司延伸到
              GEO、地月空间和拦截器相关任务，合规边界大概率更难管理，而不是更容易。已审阅记录中没有明显披露的执法事项，但没有公开证据不等于健康证明。这一类尽调因此应该靠文件，而不是靠假设，并且今天确实需要非常有纪律。
