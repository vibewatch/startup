      - number: '2.4'
        title: 规模结论与剩余尽调缺口
        blocks:
          - type: paragraph
            body: >-
              保守解读公开记录，可以支持一个近期市场判断：机会来自少数可见项目和预算池，而不是一个包罗万象的 TAM 数字。$5.6 billion 拦截器资金池、Andromeda 的 $1.8 billion 上限，以及
              SDA 和快速响应太空采购活动，都支撑了一个数十亿美元级机会集；但未来几年公司可获取的份额，仍受执行、采购时点和可见买方范围偏窄限制。公开来源尚未揭示干净的盟国政府 SAM，也没有显示 Mosaic
              式任务编排存在可持续的非政府软件预算。这不是否定市场的理由，而是要求诚实保留不确定性。因此，最重要的尽调问题不是市场是否大到能支撑赢家，而是 True Anomaly
              能否比相邻供应商和主承包商更快，把一个战略紧迫但受采购约束的市场，转化为可重复项目收入；否则窗口会被它们压窄。
