  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与变现信号
        blocks:
          - type: paragraph
            body: >-
              公开来源清楚显示，True Anomaly
              销售的是一套绑定航天器、软件、载荷和政府项目的任务技术栈。但这些来源没有说清，技术栈中有多少是经常性软件，有多少是里程碑驱动的硬件收入，又有多少本质上仍是受资助研发。这个区分重要，因为由可重复软件和生产收入支撑的估值，和主要由战略研发式合同支撑的估值，需要不同承销方式。已审阅记录强烈指向项目牵引模式：SBIR
              和 OTA 路径、大型任务专项公告，以及反复强调规模化执行。它没有揭示 Mosaic 作为独立产品的标价、合同期限或续约行为。因此，收入质量并未被证伪；它只是尚未在公开层面可读，而这种不透明应显著压低投资人信心。
