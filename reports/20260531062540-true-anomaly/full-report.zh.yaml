            body: >-
              运营模式的几乎每个方面都指向高资本强度。公司正在扩大制造、激进招聘、通过飞行测试迭代航天器，并进入拦截器和快速响应太空任务等技术要求高的项目。Sarah Walter
              的运营职责覆盖制造、供应链、任务运营和软件工程，这也提示成本基础在哪里。Mission X-2 让经济故事更具体：公司仍在把钱投向测试基础设施、故障检测、调制解调器、站点，以及升级后的 Mosaic
              能力。2026 年融资几乎肯定提供了有意义的现金跑道，但这不等于证明自我维持的经济性或耐久效率。没有烧钱速度、现金余额、营运资本和单位成本数据，公开层面最稳妥的结论是：资本充足度显著改善，但资本依赖仍然真实存在。
