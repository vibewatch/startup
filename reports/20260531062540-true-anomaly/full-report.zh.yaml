            body: >-
              公司最强的公开指标不是财务报表，而是融资里程碑、员工数目标、地点和项目赢单。这仍然有用。围绕 VICTUS HAZE、Andromeda、Apollo
              和拦截器的项目赢单，显示需求相关性。但与公开同业相比，披露缺口非常明显。比如，Rocket Lab 和 Palantir 在 Yahoo Finance 上展示市值和季度收入；Redwire、Kratos 和
              Parsons 则有扎实的投资者关系和 SEC 文件界面。这个比较并不说明 True Anomaly
              弱，只说明它是私营且不透明。投资人因此应把“存在牵引”与“收入质量已知”分开。公开证据支持前一句，但到今天仍没有足够精度支持后一句。实际后果是，外部投资人能看到战略进展，却还看不到这种进展是否经济高效。这个披露缺口应直接压低任何只靠公开证据搭建的收入倍数或利润率假设的置信度。它还意味着，估值工作必须更多依赖战略相关性、买方证明和资本准入，而不是投资人在这个价格点通常期待的更干净队列、利润率和续约分析。
