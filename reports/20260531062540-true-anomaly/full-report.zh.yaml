      - number: '8.2'
        title: 当前价格到底有多少支撑
        blocks:
          - type: paragraph
            body: >-
              从 CNBC
              已报道的意义上说，这一报价是真实的，背后的融资基础也很厚。但价格支撑只部分成立。公开来源支持战略相关性、融资实力和买方兴趣；却不支持关于当前收入质量或利润率耐久性的强结论。公开可比公司主要提醒我们，成熟市场通常要求多少披露。Rocket
              Lab、Palantir、Redwire、Kratos 和 Parsons 提供的文件和市场数据界面，都比 True Anomaly 今天丰富得多。这不意味着 True Anomaly
              在某个终局意义上被高估；它意味着当前价格必须被视为一场公开经济证明有限的战略押注。入场纪律因此比类别兴奋更重要。投资人应明确承认，即便公开承销仍不完整，战略稀缺性和国家安全热度也可能让私募标记在一段时间内维持高位。从这里往后，价格仍可能成立，但证明责任现在转向执行、披露和合同转化，而不是又一轮叙事动能。
