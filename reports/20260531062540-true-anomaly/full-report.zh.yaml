      - number: '2.2'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              采用路径比长期 TAM 清楚得多。公开来源指向数量相对有限的政府办公室，它们控制着近期购买流程：Space Safari 和 SpaceWERX 负责 VICTUS HAZE 这类快速响应太空工作，Space
              Systems Command 负责拦截器和其他组合采购，相邻 SDA 办公室负责 Project Apollo 这类队列式工作。Defense One 的报道尤其重要，因为它暗示 Space Force
              想要一组拥有真实产品的商业公司，并愿意重新审视传统项目以纳入多家供应商。这对 True Anomaly
              有利，因为能展示一体化软硬件的公司进入门槛会下降，不必等待单一巨型平台项目。但近期用户仍是军事操作员，不是通用企业客户。这意味着，采购机制、安全姿态和在轨性能，比经典软件销售效率更能决定市场转化。
