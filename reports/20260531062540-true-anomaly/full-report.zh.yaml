              Jackal。相反，记录显示的是一组美国国防航天办公室、任务出资方和相邻项目路径，它们反复出现在公司公告和政府报道中。这不让客户故事变弱，而是让它变具体。可见买方、付款方和用户角色，更接近军事项目结构，而不是传统商业
              SaaS 或航空航天渠道。公开材料仍使用有关盟友和伙伴的措辞，但具名证明集仍集中在美国生态内。投资人因此应把客户多元化视为愿景，把政府任务相关性视为已经可见的强项。
