      - number: '1.2'
        title: 创始人、领导层深度与治理信号
        blocks:
          - type: paragraph
            body: >-
              创始人故事是公司叙事的中心。Even Rogers 仍是公司的公开代表，并带来许多风险投资支持的航天公司不具备的一线军事太空运营可信度。Kyle Zakrzewski
              以亲历式航天器工程和运营经验形成互补。不过，官方关于页面现在展示了明显扩大的运营班底：Sarah Walter 负责执行和制造，Mark Seidel 负责财务和行政扩张，Stephen Kitay
              负责国防市场策略，Frank Di Pentino 负责与 Space Force 需求的战略对齐。这些补强说明，公司正从创始人驱动的高强度阶段，转向有管理的规模化。


              治理层补强也指向同一主题。Frank Calvelli
              入董事会以及其他董事会更新，并不只是增加大牌名字；更重要的是带来采购熟悉度。公司卖进的项目里，采购设计、合同推进速度和政府信任，可能与技术差异化同样重要。公开记录仍没有回答正式投票控制权、董事会委员会结构，以及
              Series D 完成后股权结构表集中度等问题；但可以说，True Anomaly 在 2025 年和 2026 年初把领导力加深到了运营、财务和政府市场准入上，而不是围绕消费级增长岗位扩编。
