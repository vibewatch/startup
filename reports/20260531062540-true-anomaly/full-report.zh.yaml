            body: >-
              公司的技术范围比单一航天器更宽。Jackal 是实体在轨飞行器，Mosaic
              是任务软件和编排层，先进载荷扩展感知和任务功能，拦截器产品线则把组合延伸到本土防御用例。这一点重要，因为它解释了公司为什么把差异化押在集成上，而不是孤立的推进或自主能力上。公开材料在这一点上异常一致。Jackal
              总是与 Mosaic
              一起出现，项目更新也反复把软件描述为运营系统的一部分，而不是后台工具。按尽调语言，这是一个真实优势：产品定义清楚。未回答的问题不是公司想造什么，而是每一层相对组合技术栈的雄心已经成熟到什么程度。
