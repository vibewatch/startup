companyProfile:
  summary: Founded in 2022 and headquartered in Centennial, Colorado, True Anomaly builds an integrated space-superiority stack spanning Jackal maneuverable autonomous spacecraft, Mosaic mission software, advanced payloads, and newer interceptor-related work. The company operates across Centennial, Colorado Springs, Washington, D.C., and Long Beach, and frames itself around U.S. government, allied, and partner missions rather than broad commercial-space demand. Public evidence shows rapid capital formation, growing manufacturing ambition, and repeated entry into visible defense-space programs, but still-limited public disclosure on revenue, margins, and retention.
  foundedDate: '2022-01-01'
  founders:
  - name: Even Rogers
    role: CEO and Co-Founder
    background: Former Air Force space operations officer and doctrine contributor who anchors the company’s warfighter-first product narrative.
    claimRefs:
    - CO007
  - name: Kyle Zakrzewski
    role: Chief Engineer and Co-Founder
    background: Former Air Force and spacecraft-engineering leader whose background supports the Jackal technical architecture.
    claimRefs:
    - CO008
  foundingLocation: Colorado, USA
  headquarters: Centennial, Colorado, USA
  productSummary: The company’s public product stack includes Jackal autonomous orbital vehicles built for maneuverability and modular payloads, Mosaic mission autonomy and command software, advanced payloads, and a newer space-based-interceptor line aimed at national-security missions.
  customerFocus: Primary visible demand comes from U.S. government and defense-space buyers, with allied and partner demand framed as future expansion rather than well-disclosed current diversification.
  businessModel: Government-program-led hardware-plus-software monetization, likely combining mission contracts, prototype funding, software-enabled operations, and follow-on production opportunities.
  stage: Series D (2026)
  fundingStatus: Raised $100M Series B, $260M Series C, and $650M Series D including debt, reaching roughly $1B+ total capital raised.
