- id: TR002
  title: Regulatory / legal risk register
  enumerationScope:
    coverage: sample
    basis: Representative risk register covering the major public legal and regulatory exposures visible in retained sources, not every possible statute.
  columns:
  - Risk area
  - What public evidence shows
  - Why it matters
  - Mitigation signal
  - Residual gap
  rows:
  - - API and developer-resource restrictions
    - API Terms of Use impose rate limits, revocable authenticators, and anti-competitive use restrictions
    - Integrators rely on a controlled platform, not an unrestricted interface
    - Contractual guardrails protect the platform
    - Partner flexibility and benchmarking transparency are limited
  - - Website and service legal boundaries
    - Terms of Service say Ironclad is not a law firm and information is not guaranteed complete or up to date
    - Customers still need legal review and cannot outsource judgment entirely
    - Clear legal boundary setting
    - Value narrative can outrun legal-accountability reality
  - - Privacy-law exposure
    - Privacy policy confirms collection and processing of personal, professional, and financial data
    - CLM touches regulated data across customers and counterparties
    - Formal policy and contact channels exist
    - Public policy does not prove operational compliance depth
  - - GDPR and HIPAA procurement burden
    - Official pages market GDPR and HIPAA alignment; regulatory frameworks remain demanding
    - Regulated buyers may require deeper diligence before purchase
    - Security page and legal links provide a starting point
    - Cross-border and healthcare evidence is still summary-level
  - - AI-governance expectations
    - NIST AI RMF and gen-AI profile show rising governance standards
    - Legal AI buyers increasingly expect documented risk controls
    - Ironclad clearly positions AI as a major product area
    - Model-evaluation and hallucination controls are not public in depth
  notes: This table focuses on compliance and contractual exposure that can alter deal cycles or product obligations even without a public enforcement action.
