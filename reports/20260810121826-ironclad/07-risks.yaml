- id: TR003
  title: Operational / dependency risk table
  columns:
  - Dependency
  - Evidence
  - Failure mode
  - Mitigation signal
  - Residual risk
  rows:
  - - Signature providers and subprocessors
    - Security portal and eSignature docs
    - Third-party incident affects customer confidence or execution flow
    - Native signature plus multiple providers reduce single-point dependence
    - Legacy integrations can still expose customers to external incidents
  - - Salesforce and business-system mappings
    - AppExchange and customer stories
    - Bad field mapping or sync errors disrupt downstream processes
    - Strong product emphasis and multi-org support
    - Complex enterprise environments remain fragile
  - - Workflow configuration and admin quality
    - Customer stories from Gong, Docker, Vinted, and Benjamin Moore
    - Poor workflow design or governance limits adoption
    - Customers repeatedly praise usability and configurability
    - Setup effort still varies materially by scope
  - - Developer-resource governance
    - API terms and docs
    - Rate limits, revoked keys, or updates break custom integrations
    - Documented policies and support path exist
    - Customers do not control the platform surface fully
  - - AI outputs in legal workflows
    - AI product pages and case studies
    - Bad suggestions or weak redlines could create legal-review risk
    - Users still keep humans in the loop
    - Public evidence does not quantify error or override rates
  notes: Operational downside usually emerges from workflow brittleness and ecosystem coupling rather than from pure hosting failure alone.
