- id: TR004
  title: Financial / model risk table
  columns:
  - Risk
  - Public evidence
  - Direction
  - Why it matters
  - Diligence ask
  rows:
  - - Pricing opacity
    - Third-party guides show custom quotes, discounts, and hidden implementation costs
    - Negative
    - Hard to infer pricing power or net revenue quality externally
    - Request realized ASPs, discount bands, and renewal economics
  - - Services and support intensity
    - Customer stories and pricing guides imply meaningful setup and admin work
    - Mixed
    - Can aid adoption but weigh on blended margins
    - Request services mix, gross margin, and implementation hours
  - - Enterprise sales-cycle duration
    - Case studies imply phased rollouts and change management
    - Negative
    - Long cycles increase growth and renewal volatility
    - Request pipeline conversion, cycle length, and deployment times
  - - AI commoditization
    - Rivals all market AI, automation, and analytics
    - Negative
    - Reduces feature-based premium claims
    - Request competitive win/loss and AI attach-rate data
  - - Valuation overhang from 2022 private pricing
    - $3.2B valuation remains the public benchmark while new round data is absent
    - Negative
    - Entry price may still reflect a different macro and SaaS multiple regime
    - Request updated valuation marks and investor terms
  - - Retention opacity
    - NRR/GRR and concentration data are not public
    - Negative
    - Can turn a strong story into a weak investment if churn or downsell is hidden
    - Request cohort retention and top-customer share
  notes: The model risks are less about immediate solvency and more about how much value survives once private metrics replace public storytelling.
