- id: mitigations-and-thesis-break-triggers
  title: Mitigations, monitoring indicators, and thesis-break triggers
  body: 'The good news is that most of Ironclad’s core risks are monitorable. Security posture can be tracked through trust-center updates, signature-incident disclosures, subprocessor changes, and procurement responses to customer security questionnaires. Product and operational risk can be tracked through implementation timelines, reference-customer expansion, workflow counts, and whether customers continue moving new departments into the platform instead of stalling at a first use case. Competitive and model risk can be tracked through pricing discipline, module attach rates, public customer proof, and whether AI adoption translates into faster workflows rather than just marketing language. The thesis breaks if one of three things happens: security trust erodes through a material incident or poor disclosure; competitive pressure turns workflow breadth into a commodity that no longer commands attractive ACVs; or retained revenue quality turns out materially weaker than implied by the current
    narrative. Until then, the public source set supports a medium risk rating rather than a hard no-go verdict.'
  claimRefs:
  - CR043
  - CR044
  - CR045
  - CR046
  tableRefs:
  - TR005
  figureRefs: []
