- id: TR005
  title: Mitigations / monitoring table
  columns:
  - Risk cluster
  - Visible mitigation
  - Indicator to watch
  - Thesis-break trigger
  - Immediate diligence ask
  rows:
  - - Security / privacy
    - Security portal, certifications, testing cadence
    - Portal incident updates, procurement escalations, customer security objections
    - Material incident with weak disclosure or repeated subprocessor impact
    - Request incident log, pen-test summaries, and security questionnaire win/loss data
  - - Implementation / dependency
    - Partner ecosystem, APIs, workflow designer
    - Time-to-go-live, admin effort, reference-customer expansion
    - Customers stall after first workflow or require heavy services to scale
    - Request deployment metrics by segment and workflow count
  - - AI governance
    - AI packaged into product and case studies
    - AI attach, override rates, legal-team trust, procurement objections
    - AI errors or opaque governance materially slow adoption
    - Request eval framework, human-review policy, and incident examples
  - - Competition / pricing
    - Broad product surface and integrations
    - Win/loss rates, discount levels, Salesforce-driven pipeline health
    - Sharp discounting or weakening competitive win rate
    - Request competitor-by-competitor win/loss and pricing waterfall
  - - Retention / concentration
    - Strong customer proof and broad logo set
    - Renewal rates, module expansion, top-account share
    - Weak NRR or concentration revealed in diligence
    - Request NRR, GRR, churn, and concentration data immediately
  notes: Most major risks have leading indicators if management is willing to disclose operational telemetry instead of only marketing outcomes.
