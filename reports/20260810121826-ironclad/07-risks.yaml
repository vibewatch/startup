chapter:
  number: 7
  title: Risks
  summary: Ironclad’s main risks cluster around security/privacy obligations, ecosystem and implementation dependencies, competitive AI commoditization, and private-company disclosure opacity. The public record shows meaningful mitigations—enterprise security controls, partner breadth, and clear customer value—but it also shows that the product sits at the center of sensitive workflows where outages, integration failures, subprocessor incidents, or legal/regulatory missteps can damage trust disproportionately. The investment question is not whether risks exist; it is whether the company’s workflow moat and execution speed are strong enough to offset those compounding dependencies.
sections:
- id: security-privacy-and-regulatory-risk
  title: Security, privacy, and regulatory risk
  body: 'Ironclad sits directly in the flow of highly sensitive commercial, employment, procurement, and compliance data, so security and privacy failures would be unusually costly. Public materials show credible control surfaces: encryption in transit and at rest, Google Cloud hosting, multi-zone operations, annual penetration testing, quarterly vulnerability testing, and a visible certification set. But the same public record makes clear why this is still a core risk rather than a solved checkbox. The security portal shows that Ironclad must continually monitor third-party vulnerabilities and subprocessor incidents, including the 2024 Dropbox Sign exposure that affected its legacy signature path. The privacy policy also confirms that Ironclad processes meaningful personal, professional, and financial data across its online services, while the legal terms push security, privacy, and consent responsibilities onto integrators and customers in important ways. For AI specifically, the NIST
    AI RMF and generative-AI guidance make it clear that governance expectations are rising, yet Ironclad does not publicly disclose enough detail about model evaluation, hallucination controls, or decisioning boundaries to underwrite that risk fully from outside sources.'
