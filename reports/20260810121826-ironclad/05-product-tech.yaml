chapter:
  number: 5
  title: Product & Technology
  summary: 'Ironclad’s product architecture is best understood as a workflow-centric contract operating system rather than a single repository tool. Public evidence shows a broad module surface spanning intake, document generation, negotiation, signature, repository, analytics, APIs, clickwrap, and AI agents, with notable strength in Salesforce-centric workflows and partner ecosystem depth. The tradeoff is that important engineering details remain private: uptime history, model architecture, cross-region residency options, and the true operational burden of complex customizations are only partially visible in public sources.'
sections:
- id: product-definition-and-module-map
  title: Product definition and module map
  body: 'Ironclad’s public product story starts with the contract lifecycle but now extends beyond that label into a broader operating system for business agreements. Its own navigation and product pages consistently present the platform around the lifecycle stages of create, review, sign, store, analyze, and fulfill, which is more expansive than a repository-only or e-signature-only tool. Around that spine, Ironclad has built visible modules for AI-assisted drafting and review, an agentic legal-review product called Jurist, native signature, clickwrap acceptance, workflow design, records/repository management, and a large integration layer. This breadth matters because it explains why Ironclad often wins on workflow fit: the company is not merely digitizing documents, it is turning legal rules, approvals, data capture, and downstream actions into reusable productized flows. The practical implication is that product diligence should focus on how these modules reinforce one another rather
    than on any single feature in isolation.'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
  - CE006
