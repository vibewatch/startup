  evidenceGaps:
  - id: GE001
    question: Public uptime, latency, outage-rate, and SLA attainment metrics are not disclosed.
    priority: high
    whyItMatters: Reliability is central to enterprise process software and cannot be inferred from certifications alone.
    nextStep: Request uptime history, SLA attainment, incident summary, and RTO/RPO metrics from the data room or customer references.
    relatedQuestionRefs:
    - QE016
    - QE026
  - id: GE002
    question: Ironclad does not publicly disclose enough detail on model providers, evaluation methods, hallucination controls, or training-data governance for Ironclad AI and Jurist.
    priority: high
    whyItMatters: AI-assisted contract review requires governance evidence beyond product positioning if investors want to underwrite risk and differentiation.
    nextStep: Request AI architecture, model-provider stack, eval framework, red-team results, and customer-configurable guardrails.
    relatedQuestionRefs:
    - QE007
    - QE026
  - id: GE003
    question: Cross-region deployment options, data residency choices, and disaster-recovery specifics are only partially visible in public materials.
    priority: medium
    whyItMatters: Large global buyers often gate procurement on residency and recovery controls, especially in regulated sectors.
    nextStep: Request architecture diagrams, region availability, backup design, recovery objectives, and customer-specific residency options.
    relatedQuestionRefs:
    - QE017
    - QE026
  - id: GE004
    question: Public materials do not quantify admin effort, implementation time by workflow complexity, or change-management burden at enterprise scale.
    priority: medium
    whyItMatters: Workflow software can look easy in demos yet become expensive if field mapping, migrations, and governance take sustained legal-ops effort.
    nextStep: Request median implementation timelines, services hours, admin FTE needs, and customer case studies segmented by deployment scope.
