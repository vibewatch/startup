- id: TE005
  title: Roadmap / release / development-stage table
  columns:
  - Capability area
  - Current public stage signal
  - What is visible now
  - What remains unclear
  - Implication
  rows:
  - - AI contract intelligence
    - Scaling / strategic push
    - Ironclad AI and Jurist are prominent across 2026 materials
    - Model architecture, evals, and attach rates are not public
    - AI is central to expansion but hard to underwrite technically
  - - Native signature
    - Operationally available
    - Can be configured as default and used alongside external providers
    - Transaction economics and deliverability performance are private
    - Helps reduce workflow breaks at execution
  - - Clickwrap
    - Add-on / targeted workflow
    - Embedded acceptance flow and certificate trail are documented
    - Roadmap breadth and volume limits are unclear
    - Strong for standard terms, weaker for complex approvals
  - - Integration ecosystem
    - Broad and mature
    - Official listings plus Zapier and marketplaces show wide connection density
    - Relative depth by connector is not standardized publicly
    - Ecosystem reach boosts stickiness and deployment flexibility
  - - Security and data exports
    - Premium enterprise layer
    - Security & Data Pro and requested certification docs indicate upsellable control plane
    - Exact packaging and operational guarantees remain private
    - Trust can be a feature and a monetization lever
  - - Admin experience at scale
    - Mixed
    - Reviews praise usability but also flag setup and navigation friction
    - No public admin-effort benchmarks by deployment complexity
    - Ease-of-use moat is real but not frictionless in large rollouts
