    question: Aggregate geographic, vertical, and direct-versus-partner channel mix remain underdisclosed.
    priority: medium
    whyItMatters: These shape concentration, go-to-market efficiency, and resilience to regional or partner shocks.
    nextStep: Request customer mix by geography, vertical, partner channel, and public-sector exposure.
