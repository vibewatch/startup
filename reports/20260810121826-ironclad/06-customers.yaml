- id: TU005
  title: Durability / concentration gaps table
  columns:
  - Missing customer metric
  - Why it matters
  - Current public status
  - What we can infer
  - Exact diligence ask
  rows:
  - - NRR / GRR
    - Best direct read on expansion durability
    - Not publicly disclosed
    - Case studies imply expansion but not cohort economics
    - Request NRR, GRR, and renewal rates by segment
  - - Logo churn and downsell
    - Tests product stickiness beyond curated references
    - Not publicly disclosed
    - Review sentiment is positive but not a churn measure
    - Request annual logo churn and reasons for churn
  - - Top-customer concentration
    - Needed to judge ARR concentration risk
    - Not publicly disclosed
    - Named-customer breadth reduces fear but does not resolve concentration
    - Request top-10 and top-20 ARR share
  - - Average deployment depth
    - Separates shallow pilots from scaled rollouts
    - Partially visible in case studies only
    - Some customers clearly expand, portfolio-wide pattern unknown
    - Request workflow count, active-user depth, and seat utilization by cohort
  - - Geographic mix and channel dependence
    - Important for international compliance and partner-led risk
    - Not publicly disclosed in aggregate
    - Case studies show global use but not regional revenue share
    - Request ARR by geography, direct vs. partner channel, and public-sector share
  notes: The public customer story is good enough to prove adoption, but not good enough to close retention or concentration underwriting questions.
