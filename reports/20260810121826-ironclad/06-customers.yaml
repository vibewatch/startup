company:
  name: Ironclad
chapter:
  number: 6
  title: Customers
  summary: 'Public customer evidence supports a broad, real, and cross-functional deployment footprint for Ironclad. The company claims 2,000-plus customers, and its named case studies show production use across technology, retail, healthcare, public-sector, and learning organizations, often expanding from legal into procurement, sales, finance, IT, and operations. The missing pieces are the ones investors care about most for durability: true net retention, cohort churn, top-customer concentration, contract-length distribution, and how much of expansion is product-led versus services- or champion-led.'
sections:
- id: customer-base-and-segment-breadth
  title: Customer base and segment breadth
  body: Ironclad’s public customer footprint is broad enough to support a real enterprise-platform reading rather than a niche legal-tech one. Its own customer-story hub says more than 2,000 companies use the platform, explicitly ranging from startups to Fortune 500 organizations. The named examples span software companies such as Gong, Docker, Vinted, Camunda, and Skillsoft; healthcare-related and service-heavy environments such as Dentalcorp; large consumer brands such as Benjamin Moore and Orangetheory; and public-sector style operations such as Oklahoma case-study placement on the customer page. That breadth matters because CLM tools often fail when they cannot travel outside the first legal-team use case. Ironclad’s evidence instead shows repeat applicability across procurement, revenue, marketing, HR-like onboarding flows, and IT-driven governance. The segment picture is still incomplete—Ironclad does not publish an exact split by ARR tier, geography, or vertical—but the visible customer
    roster is sufficiently varied to prove category relevance beyond one narrow contract type or company size band.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
  - CU007
  - CU008
  - CU009
  - CU010
