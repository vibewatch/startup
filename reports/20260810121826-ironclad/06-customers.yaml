- id: durability-satisfaction-and-concentration-risk
  title: Durability, satisfaction, and concentration risk
  body: 'The qualitative durability picture is positive but incomplete. Independent review sources on TrustRadius, GetApp, Capterra, and Gartner all reinforce a similar value proposition: strong workflows, central repository benefits, useful customization, and better visibility into contracts and approvals. The case studies also show repeat expansion after go-live, which is a good sign for reference quality. Yet investors should be careful not to overread vendor-authored customer stories. There is no public NRR, GRR, logo-churn, or top-10-customer concentration disclosure, and the public record does not show how many customers remain at single-workflow scale versus expanding meaningfully. Some review sources also surface friction around setup, complex edits, and navigation, which suggests that customer happiness is high but not frictionless. The most responsible conclusion is that Ironclad has strong proof of real adoption and credible satisfaction, while the deepest durability and concentration
    questions remain private-company diligence items rather than publicly settled facts.'
