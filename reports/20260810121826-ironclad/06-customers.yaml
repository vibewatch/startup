- id: measured-customer-outcomes-and-roi
  title: Measured customer outcomes and ROI
  body: Public proof is strongest when it gets quantitative, and Ironclad’s case-study set does that often enough to be useful. Dentalcorp cut drafting time from 15 minutes to 4 minutes, onboarded about 90 users, and loaded more than 1,700 contracts covering roughly 95% of supplier contracts. Docker says automated edits save more than 15 hours per month and that over 200 completed workflows improved efficiency. Orangetheory cut a six-month template-consolidation project to three months with AI and routes 10% to 15% of members through a clickwrap channel. Camunda says certain public workflows now complete end-to-end in roughly five minutes, and its clause-library workflow saves approximately three quarters of the prior template-maintenance time. The customer-story overview adds broader headline metrics such as 96% turnaround-time reduction, 70% cost reduction, 75% contracting-time reduction, and 99% adoption within the first 71 days for specific named stories. These are vendor-selected references,
    so they should not be treated as portfolio-wide averages, but they are still meaningful proof that Ironclad can produce measurable operational outcomes in production environments.
  claimRefs:
  - CU026
  - CU027
  - CU028
  - CU029
  - CU030
  - CU031
