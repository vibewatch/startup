  evidenceGaps:
  - id: GU001
    question: Ironclad does not publicly disclose NRR, GRR, or cohort churn.
    priority: high
    whyItMatters: These are the most direct measures of customer durability and land-and-expand quality.
    nextStep: Request retention cohorts, gross and net revenue retention, renewal rates, and downsell reasons by segment.
    relatedQuestionRefs:
    - QU019
    - QU025
    - QU026
  - id: GU002
    question: Customer concentration and top-account ARR share are not publicly visible.
    priority: high
    whyItMatters: Named logos are impressive, but concentration can still create material downside risk.
    nextStep: Request top-10 and top-20 customer ARR share, contract terms, and concentration changes over time.
    relatedQuestionRefs:
    - QU020
    - QU025
  - id: GU003
    question: Public sources do not show average deployment depth, active-user utilization, or workflow count distribution across the installed base, which limits how representative TU002 is.
