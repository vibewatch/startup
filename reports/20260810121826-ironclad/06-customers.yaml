    whyItMatters: Case studies prove success stories but not median customer depth.
    nextStep: Request workflow count, active-user penetration, and module attach rates by customer cohort.
    relatedQuestionRefs:
    - QU022
    - QU025
    relatedTableRefs:
    - TU002
