  topStrengths:
    - 2,000+ customers and strong named enterprise references show real cross-functional adoption.
    - Workflow-centric product breadth and strong Salesforce / integration story create durable platform value.
    - Ironclad AI and Jurist provide credible upside to ARPU, customer stickiness, and category relevance.
    - Top-tier historical financing and $200M+ ARR indicate scaled late-stage software quality.
  topRisks:
    - AI commoditization risk is real as DocuSign, Icertis, Agiloft, and others all market similar themes.
    - The last public $3.2B valuation anchor looks full relative to mature public workflow/document software multiples.
    - Long enterprise sales cycles and implementation complexity can pressure growth efficiency and margin quality.
    - Public disclosure is insufficient on NRR, churn, concentration, and term-sheet structure.
  unresolvedGaps:
    - Current NRR, GRR, logo churn, and concentration by top accounts.
    - Gross-margin split across subscription, AI, and services, plus AI attach economics.
    - Current cap table, liquidation preferences, and any post-2022 valuation reset.
    - Reliable view of cash efficiency, profitability path, and IPO readiness cadence.
