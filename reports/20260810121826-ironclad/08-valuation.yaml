  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Why it lands here
  - What would change it
  rows:
  - - Recommendation
    - buy
    - Asset quality is strong enough to pursue with price discipline
    - Updated diligence shows weak retention or poor margin quality
  - - Confidence
    - medium
    - Public operating proof is solid, but key underwriting inputs remain private
    - Receive audited-style KPI bridges and current cap table
  - - Risk rating
    - medium
    - Execution, competitive, and disclosure risks are material but not thesis-fatal today
    - Security incident, AI commoditization, or retention weakness increases risk
  - - Valuation stance
    - fair
    - The asset is attractive, but the old $3.2B mark is full without deeper proof
    - Entry discount or strong private metrics would improve the stance
  - - Hold / exit posture
    - multi-year private hold
    - Public exit readiness is incomplete despite scale
    - Path to IPO reporting readiness and stronger margin disclosure
  - - Primary diligence gate
    - NRR + gross margin + terms
    - Those three items determine whether a premium multiple is deserved
    - Management provides current KPI and financing transparency
  notes: This table summarizes the current investability view rather than a certainty-weighted underwriting model.
