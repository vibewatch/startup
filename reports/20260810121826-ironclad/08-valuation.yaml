- id: public-comparable-read-through
  title: Public comparable read-through
  body: Public comps do not offer a perfect apples-to-apples answer, but they do provide a discipline check. Using August 2026 market-cap references and SEC revenue data, DocuSign, Box, and Dropbox cluster around roughly 3.2x to 3.9x market-cap-to-revenue, with an average near 3.6x. Those are more mature and slower-growth businesses than the bullish Ironclad narrative, so some premium is warranted. At the same time, the gap between a 3.6x public mature-software band and Ironclad’s implied 16x headline multiple is enormous. Higher-level workflow and software leaders such as ServiceNow, Salesforce, Adobe, HubSpot, and Workday demonstrate that the market still rewards scaled platforms, but they operate at dramatically larger revenue bases, broader product scope, and much deeper disclosure quality. The correct read-through is therefore neither “Ironclad should trade like Box” nor “Ironclad deserves any premium it asks for.” The right conclusion is that Ironclad likely merits a premium to mature
    document-software peers, but not an unlimited one absent proof that growth, retention, and AI monetization are exceptional.
