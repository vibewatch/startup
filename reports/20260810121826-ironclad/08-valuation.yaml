- id: recommendation-exit-readiness-and-diligence-gates
  title: Recommendation, exit readiness, and final diligence gates
  body: The overall call is a conditional buy with medium confidence and a fair valuation stance, not because the current public evidence proves the price is cheap, but because it proves the asset quality is real enough to justify serious diligence if entry terms are reasonable. Ironclad looks like a category leader with broad workflow fit, a sizable installed base, and a plausible path to sustained strategic relevance as contract AI becomes more useful. It does not yet look like an obvious public-market-ready company from a disclosure standpoint. There are no audited public financials, no public NRR or GRR, no clear gross-margin bridge, and no updated cap-table or preference-overhang view. Those gaps matter more than the headline narrative because they decide whether the company is a strong compounder or simply a strong story. The correct investment discipline is to push for current retention, pricing realization, AI economics, and term-sheet transparency before accepting the old unicorn-era
    mark as fair.
