- id: TV004
  title: Comparable valuation table
  enumerationScope:
    coverage: sample
    basis: Representative public SaaS and workflow-document software comparables used to bound value, not an exhaustive sector screen.
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - DocuSign
    - 2026 market cap vs FY2026 revenue
    - ~$11.5B market cap / ~$3.22B revenue ≈ 3.6x
    - Closest signature- and contract-workflow public comp
    - More mature and slower-growth than bullish Ironclad narrative
  - - Box
    - 2026 market cap vs FY2026 revenue
    - ~$4.6B market cap / ~$1.18B revenue ≈ 3.9x
    - Document/repository workflow comp with enterprise contracts
    - Less directly exposed to CLM and legal workflows
  - - Dropbox
    - 2026 market cap vs FY2025 revenue
    - ~$8.0B market cap / ~$2.52B revenue ≈ 3.2x
    - Document-collaboration / workflow-adjacent public comp
    - Not a direct CLM or legal-ops peer
  - - ServiceNow
    - 2026 market cap
    - ~$128.9B market cap
    - Shows what scaled workflow platforms can command
    - Different scale, scope, and disclosure quality
  - - Salesforce
    - 2026 market cap
    - ~$157.9B market cap
    - Relevant for CRM-adjacent workflow infrastructure framing
    - Far broader business and revenue base
  - - Workday / Adobe / HubSpot
    - 2026 market caps
    - ~$44.4B / ~$105.4B / ~$10.3B market caps
    - Reference points for premium SaaS valuation context
    - Not direct CLM comparables and revenue anchors are not used here
  notes: The table mixes direct multiple comps and broader scale references because there is no perfect public CLM comp set for Ironclad.
