- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Dimension
  - Thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Category position
    - Ironclad is one of the strongest workflow-first CLM assets in market
    - Category overlap is rising and AI is becoming table stakes
    - Show sustained win rates and differentiated AI attach
  - - Customer proof
    - 2,000+ customers and strong reference stories show real adoption
    - Case studies are curated and do not prove cohort economics
    - Show NRR, GRR, cohort renewal, and concentration data
  - - Economics
    - $200M+ ARR implies meaningful scale and enterprise ACV
    - Pricing opacity and services burden can hide weaker margin quality
    - Show gross margin split, services mix, and realized ASPs
  - - Valuation support
    - A premium to mature document-software comps is reasonable
    - 16x ARR is still a very demanding headline mark
    - Offer structure, discount, or better proof of durable growth
  - - Exit optionality
    - Scale and AI narrative create eventual IPO or strategic-option value
    - Disclosure quality today is below public-market readiness
    - Show audit-quality reporting cadence and profitability path
  - - Risk resilience
    - Security and ecosystem breadth provide mitigation levers
    - Workflow centrality means incidents or integration failures can hurt trust quickly
    - Provide incident history, uptime metrics, and customer-security win/loss data
  notes: The anti-thesis is price- and evidence-sensitive, not a rejection of the product or market category outright.
