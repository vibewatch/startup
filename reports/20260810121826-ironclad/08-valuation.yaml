- id: scenario-valuation-and-investment-view
  title: Scenario valuation and investment view
  body: A practical scenario framework produces a more realistic range than the old headline mark does. In the bear case, Ironclad is still a good product but behaves more like a maturing workflow/document SaaS company with public-comp-like revenue multiples and modest downside from pricing and services intensity; that yields roughly 4x ARR or about $0.8 billion of value. In the base case, Ironclad retains a clear premium for category leadership, enterprise adoption, and AI upside, but remains discounted for private opacity; an 8x ARR multiple yields about $1.6 billion. In the bull case, investors assume best-in-class retention, strong AI attach, and credible IPO-readiness, which can support about 14x ARR or roughly $2.8 billion. All three scenarios sit at or below the last $3.2 billion public mark, which means the current headline price is not obviously cheap on public evidence alone. The investment stance can still be constructive if entry includes structure, secondary discount, or unusually
    strong private diligence on retention and margins.
