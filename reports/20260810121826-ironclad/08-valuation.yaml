- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Probability signal
  - Core assumption
  - Multiple / value logic
  - Implied value band
  - What must be true
  rows:
  - - Bear
    - Credible downside
    - Growth slows toward mature workflow-software norms and economics prove only average
    - ~4x ARR on $200M ARR
    - ~$0.8B
    - Retention or AI monetization disappoints and public-comp discipline dominates
  - - Base
    - Most balanced public-evidence case
    - Ironclad keeps category leadership and good expansion, but opacity warrants a discount to peak private hype
    - ~8x ARR on $200M ARR
    - ~$1.6B
    - NRR is good, not elite; margin quality is acceptable, not exceptional
  - - Bull
    - Requires premium proof
    - Ironclad shows best-in-class retention, efficient AI upsell, and credible IPO-readiness
    - ~14x ARR on $200M ARR
    - ~$2.8B
    - AI attach, renewal strength, and margin path all hold up in diligence
  notes: Scenario multiples are judgmental bands anchored on retained public comparables, market-growth context, and private-company uncertainty.
