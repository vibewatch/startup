company:
  name: Ironclad
chapter:
  number: 8
  title: Valuation
  summary: Ironclad is a good company at a price that still requires discipline. Public evidence supports a scaled private SaaS asset with $200 million-plus ARR, 2,000-plus customers, broad enterprise referenceability, and a credible AI expansion story. But the last disclosed $3.2 billion valuation implies roughly 16x ARR on the current public revenue anchor, far above mature public workflow/document-software multiples and only defensible if retention, AI attach, and margin quality are substantially better than the public record can prove today.
sections:
- id: current-valuation-context-and-public-anchor
  title: Current valuation context and the public anchor
  body: 'The cleanest public valuation anchor for Ironclad remains the January 2022 Series E, which valued the company at $3.2 billion. Since then, the public record has improved on operating scale much more than on price discovery. Ironclad now claims more than $200 million of ARR and more than 2,000 customers, which confirms it has grown into meaningful enterprise-software scale. Yet there is no publicly disclosed post-2022 financing event that resets the valuation mark for today’s SaaS market. Using the 2026 ARR anchor, the old $3.2 billion price implies roughly a 16x ARR multiple. That is not impossible for a strong private AI-forward SaaS business, but it is a demanding starting point given the absence of public NRR, margin, cash-efficiency, or updated round-term disclosure. The first valuation judgment therefore is simple: Ironclad’s operating proof has improved, but the public price anchor is still stale and likely optimistic unless later-stage private terms are materially more investor-friendly
    than the headline implies.'
  claimRefs:
