- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Public value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - ARR milestone
    - $200M+ ARR in 2026
    - Medium
    - Confirms scale and supports a late-stage enterprise software framing
    - Request quarterly ARR bridge by product and segment
  - - Customer count floor
    - 2,000+ customers
    - Medium
    - Helps bound contract-value distribution and installed-base breadth
    - Request active paying logos, seat counts, and enterprise mix
  - - Implied average ARR per customer floor
    - ~$100K using $200M ARR over 2,000 customers
    - Medium
    - Suggests enterprise ACVs even before accounting for skew toward larger accounts
    - Request ARR distribution by cohort rather than relying on blended floor math
  - - Discount band
    - 25%-42% in benchmark source
    - Low-Medium
    - Large discount bands can obscure true pricing power
    - Request win-rate-adjusted net pricing versus quoted pricing
  - - Implementation burden
    - 2-4 month typical services deployment in one pricing source; faster only in lighter scopes
    - Medium
    - Services intensity affects sales efficiency and blended gross margin
    - Request median time to value, services hours, and implementation success rate
  - - Comparable SaaS gross margins
    - DocuSign ~79.4%, Dropbox ~80.1%, Box ~79.2%
    - High
    - Provides a reasonable benchmark band for software-heavy recurring revenue
    - Request Ironclad software-only and blended gross margin
  - - NRR / CAC payback
    - Not publicly disclosed
    - Low
    - Key test of expansion quality and efficient enterprise growth
    - Request NRR, CAC payback, sales cycle, and win-rate metrics by segment
  notes: This table intentionally mixes observed public anchors with bounded estimates and missing-data markers rather than pretending private unit economics are visible.
