- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current public value / status
  - Quality
  - Diligence ask
  rows:
  - - Core CLM platform subscription
    - Quote-led recurring software subscription for workflow, repository, approvals, and collaboration
    - Annual contract / seat mix
    - No public price card; multiple sources place the entry point in the tens of thousands of dollars annually
    - High recurring core, but realized pricing is private
    - Request ASP by segment, contract term mix, and discount waterfall
  - - AI / Jurist add-on
    - Premium AI review, drafting, Q&A, and contract-intelligence layer
    - Add-on annual fee or module uplift
    - Third-party pricing sources consistently describe AI as a material paid uplift above core CLM
    - Potential ARPU and retention expansion driver
    - Request AI attach rate, gross margin, and renewal uplift versus non-AI accounts
  - - Execution / signature layer
    - Native execution and workflow completion tied to the platform
    - Bundled module / feature bundle
    - Public sources suggest it is packaged with broader platform value rather than disclosed standalone economics
    - Supports bundle depth and workflow lock-in
    - Request attach rate and whether native execution displaces external e-sign tools economically
  - - Implementation and professional services
    - Legal engineering, migration, configuration, and onboarding work
    - One-time services contract
    - Multiple pricing guides estimate meaningful implementation fees and multi-month deployment work
    - Useful for landing complex accounts but may dilute blended margin
    - Request services revenue, services gross margin, and time-to-go-live by segment
  - - Support, integrations, and enterprise success plans
    - API access, premium support, custom integrations, and broader enterprise enablement
    - Annual add-on / service scope
    - Retained pricing sources repeatedly tie higher spend to advanced integrations, security, and success coverage
    - Improves expansion potential but can hide support intensity
    - Request attach rates, support ratios, and contribution margin by add-on type
  notes: Separates recurring software, AI, and service mechanics because public evidence points to a layered enterprise monetization model rather than one simple per-seat plan.
