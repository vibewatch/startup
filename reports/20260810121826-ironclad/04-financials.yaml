- id: margin-proxies-and-unit-economics
  title: Margin proxies and unit-economics read-through
  body: 'Ironclad does not publish gross margin, CAC, payback, or NRR, so the only disciplined way to reason about unit economics is to separate what can be observed from what must remain bounded. On the observable side, public SaaS comparables in adjacent workflow and document software are helpful. SEC companyfacts for DocuSign, Dropbox, and Box all point to gross margins clustered around roughly 79% to 80%, which is a useful benchmark for mature software-heavy recurring revenue. Ironclad’s core product should be capable of similar software-style margin characteristics if subscription revenue dominates and implementation work stays controlled. But the retained pricing evidence also warns against assuming a pure-software model. Ironclad seems to monetize AI, premium integrations, legal-engineering-style implementation, and enterprise support layers, all of which can complicate cost of goods sold and depress blended margins versus the cleanest public SaaS peers. The result is a plausible
    but incomplete picture: recurring revenue quality likely looks attractive, yet investors still cannot tell from public evidence whether AI and services improve lifetime value faster than they add onboarding, support, and compute burden.'
