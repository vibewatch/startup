- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Why it matters
  - Current public status
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Revenue mix by stream
    - Separates core subscription quality from AI and services intensity
    - Not publicly disclosed
    - 'Material: cannot judge how recurring and margin-rich growth really is'
    - Request revenue split for core software, AI, services, execution, and support
  - - Gross margin, software-only and blended
    - Needed to test whether AI and services dilute software economics
    - Not publicly disclosed
    - Blocking for margin-path analysis
    - Request gross margin split by product line and by services versus subscription
  - - NRR and expansion by cohort
    - Shows whether platform breadth truly compounds over time
    - Not publicly disclosed
    - 'Material: cannot underwrite land-and-expand quality'
    - Request NRR by mid-market, enterprise, and AI-attached cohorts
  - - CAC payback and sales efficiency
    - Critical for evaluating quote-led enterprise growth quality
    - Not publicly disclosed
    - 'Material: growth efficiency remains opaque'
    - Request CAC payback, sales cycle, pipeline conversion, and implementation win/loss data
  - - Cash balance and runway
    - Core input to capital adequacy and downside planning
    - Not publicly disclosed
    - Blocking for solvency math
    - Request treasury snapshot and monthly cash bridge
  - - Realized pricing and discount waterfall
    - Determines net revenue quality better than list-like estimates do
    - Not publicly disclosed
    - 'Material: list-price heuristics may mislead'
    - Request anonymized recent contracts, discounts, escalators, and concession policy
  notes: The financial blockers are mostly private-company disclosure gaps, not a lack of public top-line evidence.
