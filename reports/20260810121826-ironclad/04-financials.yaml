- id: capital-adequacy-and-diligence-blockers
  title: Capital adequacy and the remaining diligence blockers
  body: The capital-adequacy picture is simultaneously encouraging and incomplete. Ironclad’s Series D and Series E rounds, combined with $200 million-plus ARR, strongly suggest the company is not operating from a position of near-term capital stress. The 2026 growth announcement also reads like a company emphasizing scale and AI investment rather than emergency fundraising. That said, public sources do not reveal the treasury details that matter most for downside analysis. There is no reliable public cash balance, monthly burn, runway, debt-facility disclosure, covenant package, or audited revenue-mix breakdown. Investors can therefore infer that Ironclad has meaningful financial firepower, but they cannot test how much of that strength remains after years of product buildout, go-to-market investment, and implementation support. The practical verdict is that Ironclad’s financial profile looks better than its disclosure quality. Public evidence is enough to support a scaled enterprise-software
    framing, but not enough to judge profitability durability, true gross margin, or how efficiently the company converts quote-led enterprise growth into long-term free cash flow.
