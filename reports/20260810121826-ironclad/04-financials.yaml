company:
  name: Ironclad
chapter:
  number: 4
  title: Financials
  summary: 'Public evidence supports an enterprise-software financial profile for Ironclad: more than $200 million of ARR, 2,000-plus customers, custom quote-led contracts, and monetization layered across core workflow software, AI upsells, and implementation services. The best retained third-party pricing sources place typical annual contracts from roughly $30,000 to well above $150,000, with large-enterprise deals and first-year TCO often much higher once implementation, integrations, and internal admin cost are included. The main underwriting problem is not lack of growth evidence but lack of private operating detail: revenue mix, realized discounting, gross margin, NRR, CAC payback, cash balance, burn, and debt terms remain undisclosed.'
sections:
- id: revenue-model-and-public-traction
  title: Revenue model and public traction
  body: Ironclad’s public financial story is now strong enough to establish scale, even though it is still too thin for full underwriting. The clearest anchor is the 2026 ARR announcement, reinforced by independent coverage, that puts the company above $200 million of annual recurring revenue. Coupled with the company’s current 2,000-plus customer claim, that implies a minimum average ARR per customer of about $100,000, which is directionally consistent with an enterprise CLM motion rather than SMB self-serve economics. The product surface also suggests a layered monetization model. Ironclad is not selling one narrow seat license; it is selling a workflow system of record with AI, Jurist, native execution, integrations, and implementation services. Several pricing sources describe the commercial model as some blend of platform fee, user licenses, contributor-seat economics, and add-on modules. The financial takeaway is that Ironclad appears to have already crossed the threshold into meaningful
    enterprise software scale, but public evidence still stops short of showing how much ARR comes from core subscriptions versus AI, services, or other expansions.
