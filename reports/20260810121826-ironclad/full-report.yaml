  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and the buyer problem
        blocks:
          - type: paragraph
            body: >-
              The most important market-analysis step for Ironclad is defining CLM tightly enough that the category
              remains investable rather than collapsing into every legal or e-sign workflow. MGI’s definition is the
              cleanest retained boundary: contract lifecycle management covers the processes and data associated with an
              agreement from creation through renewal and closure. For an Ironclad-style platform, that naturally
              includes drafting, negotiation, approvals, execution, repository, analytics, and workflow automation
              across legal, procurement, sales, and compliance. It does not mean every adjacent tool belongs inside the
              same spend bucket. Embedded e-sign, document storage, or standalone legal AI research can be adjacent and
              strategically relevant without being the same market. That boundary logic matters because Ironclad is
              selling a cross-functional system of record for agreements, not merely a signature utility. The buyer
              problem is likewise broader than “legal needs a faster contract tool”: enterprises want self-service,
              lower cycle times, better control, and contract data that can inform operational decisions across
              departments. That distinction is strategically important for Ironclad because budget justification often
              comes from multiple functions at once; the more agreement data touches revenue, procurement, and
              compliance outcomes, the easier it is for a CLM platform to defend enterprise-level pricing and to avoid
              being treated as a narrow legal expense.
