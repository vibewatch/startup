  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base and segment breadth
        blocks:
          - type: paragraph
            body: >-
              Ironclad’s public customer footprint is broad enough to support a real enterprise-platform reading rather
              than a niche legal-tech one. Its own customer-story hub says more than 2,000 companies use the platform,
              explicitly ranging from startups to Fortune 500 organizations. The named examples span software companies
              such as Gong, Docker, Vinted, Camunda, and Skillsoft; healthcare-related and service-heavy environments
              such as Dentalcorp; large consumer brands such as Benjamin Moore and Orangetheory; and public-sector style
              operations such as Oklahoma case-study placement on the customer page. That breadth matters because CLM
              tools often fail when they cannot travel outside the first legal-team use case. Ironclad’s evidence
              instead shows repeat applicability across procurement, revenue, marketing, HR-like onboarding flows, and
              IT-driven governance. The segment picture is still incomplete—Ironclad does not publish an exact split by
              ARR tier, geography, or vertical—but the visible customer roster is sufficiently varied to prove category
              relevance beyond one narrow contract type or company size band.
