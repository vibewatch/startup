            body: >-
              The competitive risk is that Ironclad’s strongest public advantages—workflow usability, Salesforce
              adjacency, AI add-ons, and faster legal-team adoption—are all areas where rivals are also investing. The
              official and review source set across DocuSign CLM, Icertis, Agiloft, Sirion, and SpotDraft shows a
              category where every major vendor now claims AI, automation, analytics, and enterprise integration. That
              makes AI commoditization real: buyers may still prefer Ironclad, but they can no longer justify premium
              pricing on “has AI” alone. Financial-model risk compounds that pressure. Third-party pricing sources
              describe opaque discounting, implementation burden, and material services or support intensity, while
              public company metrics that would resolve NRR, gross margin, or cash efficiency remain private for
              Ironclad. The result is a business that looks strategically attractive but still exposed to slower
              enterprise sales cycles, margin compression from services and AI support, and valuation reset risk if
              growth or retention prove less durable than top-line ARR headlines suggest.
