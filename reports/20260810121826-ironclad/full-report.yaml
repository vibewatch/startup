        title: Deployment patterns and cross-functional expansion
        blocks:
          - type: paragraph
            body: >-
              The strongest recurring adoption pattern in the source set is land in one workflow, then expand
              horizontally across functions and agreement types. Gong went from fragmented systems to four core
              workflows and about 10,000 contracts per year. Vinted implemented 12 workflows for 120 users across
              procurement, shipping, marketing, and customer support. Docker tied Ironclad to Salesforce, Zip, and
              Productiv, using it to manage sales, procurement, IT, and pricing-governance problems. Skillsoft
              standardized contract management across business units globally, while Benjamin Moore used differentiated
              approval paths for contracts ranging from $10,000 to $10 million. Camunda used public workflows and
              clickwrap to move routine agreements from hours to minutes, and Orangetheory used AI and clickwrap for
              consumer-facing scale. This expansion pattern is strategically important because it implies that Ironclad
              is sticky when it becomes the shared process fabric connecting business teams. It also suggests that buyer
              value is frequently tied to configuration and integrations rather than only to legal review efficiency.
