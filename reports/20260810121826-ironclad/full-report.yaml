companyProfile:
  summary: >-
    Ironclad is a San Francisco-based contract lifecycle management platform founded in 2014. Its AI-powered product
    helps legal, sales, procurement, and operations teams create, negotiate, approve, execute, store, and analyze
    contracts at scale. Public sources support that Ironclad raised a $150 million Series E in January 2022 at a
    reported $3.2 billion valuation, surpassed $200 million of ARR in 2026, and serves more than 2,000 customers. The
    company is now positioning Ironclad AI and Jurist as the next phase of its workflow-led contract platform.
  foundedDate: '2014-01-01'
  founders:
    - name: Jason Boehmig
      role: Co-Founder; former CEO and current Executive Chairman
      background: Former public founder face of Ironclad who now focuses on AI innovation and go-to-market strategy.
    - name: Cai GoGwilt
      role: Co-Founder
      background: Technical co-founder associated with Ironclad's original product and engineering buildout.
  foundingLocation: San Francisco, California, USA
  headquarters: San Francisco, California, USA
  productSummary: >-
    AI-powered CLM platform spanning workflow intake, document generation, negotiation, approvals, native and partner
    signature, clickwrap, repository, analytics, APIs, and AI assistance through Ironclad AI and Jurist.
  customerFocus: >-
    Enterprise legal departments, in-house counsel, sales operations, procurement teams, and cross-functional business
    users that need high-volume contract automation and searchable contract intelligence.
  businessModel: >-
