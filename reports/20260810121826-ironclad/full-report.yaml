      - number: '4.2'
        title: Pricing, TCO, and monetization logic
        blocks:
          - type: paragraph
            body: >-
              Every retained pricing source agrees on the same first principle: Ironclad does not publish a public rate
              card, and buyers usually learn the real number only inside a sales cycle. What differs is the estimate
              range and the hidden-cost view. Bind’s pricing guide frames many deployments at roughly $30,000 to
              $150,000-plus per year with implementation fees on top. Vendorbenchmark goes farther into
              enterprise-commercial mechanics, describing platform fees, user classes, discount bands, escalators, and
              sharply different paid ranges by company size. StackScored and UsagePricing push the upside higher still
              once Jurist, custom integrations, and full-enterprise packaging are included. Across these sources, the
              recurring pattern is that headline subscription price understates first-year spend. Implementation
              services, integration work, training, and often a dedicated internal administrator become part of the real
              budget. That matters because pricing opacity can produce attractive land deals while still obscuring net
              revenue quality. The commercial upside is that Ironclad clearly has enterprise ACV potential and multiple
              levers for ARPU expansion. The downside is that investors cannot see from public evidence how much
              discounting, services effort, or AI support cost is required to land and keep those accounts.
