  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Security, privacy, and regulatory risk
        blocks:
          - type: paragraph
            body: >-
              Ironclad sits directly in the flow of highly sensitive commercial, employment, procurement, and compliance
              data, so security and privacy failures would be unusually costly. Public materials show credible control
              surfaces: encryption in transit and at rest, Google Cloud hosting, multi-zone operations, annual
              penetration testing, quarterly vulnerability testing, and a visible certification set. But the same public
              record makes clear why this is still a core risk rather than a solved checkbox. The security portal shows
              that Ironclad must continually monitor third-party vulnerabilities and subprocessor incidents, including
              the 2024 Dropbox Sign exposure that affected its legacy signature path. The privacy policy also confirms
              that Ironclad processes meaningful personal, professional, and financial data across its online services,
              while the legal terms push security, privacy, and consent responsibilities onto integrators and customers
              in important ways. For AI specifically, the NIST AI RMF and generative-AI guidance make it clear that
              governance expectations are rising, yet Ironclad does not publicly disclose enough detail about model
              evaluation, hallucination controls, or decisioning boundaries to underwrite that risk fully from outside
              sources.
