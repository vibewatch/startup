      - number: '5.3'
        title: Trust, security, and operational controls
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a credible enterprise-security posture, albeit with incomplete technical
              transparency. Ironclad’s security page states that production is cloud-hosted on Google Cloud Platform,
              data is encrypted in transit with TLS 1.2 or higher and at rest with AES-256, and the company operates
              across multiple zones to protect against outages. The same page advertises annual penetration testing,
              quarterly vulnerability testing, and a formal certification set that includes SOC 1 and SOC 2 Type II plus
              ISO 27001, 27017, and 27018. Partner-disclosed security metadata on Slack adds operationally useful
              details such as data deletion timing, SSO support for Okta and Google, and a statement that the service is
              cloud hosted on GCP. These are real positives for enterprise buyers, but they are not the same thing as
              deep architectural diligence. Public materials do not disclose incident rates, uptime performance,
              model-governance internals, or RTO/RPO metrics, so the trust picture is solid at the control-surface level
              and still incomplete at the engineering-operations level.
