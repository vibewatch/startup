      - number: '1.2'
        title: Leadership, governance visibility, and key-person dependence
        blocks:
          - type: paragraph
            body: >-
              The leadership story changed materially in 2025. For most of Ironclad’s life, Jason Boehmig was both
              public founder face and operating CEO, but the company’s own transition note and the 2026 ARR release now
              make Dan Springer the current chief executive and move Boehmig into an executive-chairman role focused on
              AI innovation and go-to-market strategy. That transition is not cosmetic: it means investors should now
              underwrite a post-founder operating model while recognizing that the founder still appears central to
              product vision. Public evidence on the broader bench is improving but incomplete. The ARR announcement
              discloses senior additions in product, AI, and engineering, yet the retained source set does not surface a
              complete current board roster, committee structure, or investor-control map. The most practical diligence
              reading is that Ironclad now has scaled-company leadership signals, but governance transparency still lags
              behind traction and financing visibility.
