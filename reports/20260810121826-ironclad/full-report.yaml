  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Retention weakness
        - NRR materially below premium SaaS expectation or logo churn meaningfully elevated
        - Breaks the premium-multiple argument
        - Re-price to base/bear case immediately
      - - Margin disappointment
        - Blended gross margin proves materially below software-like levels due to services or AI cost
        - Undercuts IPO-quality software thesis
        - Require large discount or avoid
      - - Security trust event
        - Material incident with weak disclosure or large customer fallout
        - Damages enterprise trust and sales efficiency
        - Pause investment until impact is understood
      - - Competitive compression
        - Win/loss and discounting show AI is not sustaining pricing power
        - Turns category leadership into average economics
        - Shift stance from buy to hold / avoid at the mark
      - - Term-sheet overhang
        - Preferences, liquidation stack, or dilution overhang materially worsen common-equity outcome
        - Reduces realized return despite good operating company
        - Demand structure or lower entry price
    notes: The thesis breaks more from hidden denominator weakness than from market-size doubt.
    claimRefs:
      - CV027
      - CV032
      - CV033
      - CV036
      - CV037
      - CV040
      - CV041
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Retention quality
        - NRR, GRR, churn, and cohort renewal
        - Primary driver of premium private software value
        - CFO / board package
      - - Margin quality
        - Gross margin split by subscription, AI, and services
        - Tests whether ARR is premium-quality or services-heavy
        - Finance diligence room
      - - Pricing realization
        - Recent contracts, discount waterfall, and AI attach rate
        - Determines whether $200M ARR is high-quality or heavily discounted
        - Revenue operations / sales finance
      - - Cap table and preferences
        - Current share classes, liquidation preferences, and investor rights
        - Headline valuation can mislead without term structure
        - Legal / financing documents
      - - Cash efficiency
        - Burn, runway, and sales efficiency
        - Needed to assess downside protection and IPO timing
        - Finance diligence room
      - - Security and reliability telemetry
        - Incident history, uptime, security-questionnaire outcomes
        - Trust risk can dominate enterprise software outcomes
        - CTO / security diligence room
    notes: >-
      These diligence asks are deliberately few because each one can materially move value more than another batch of
      marketing references can.
    claimRefs:
      - CV033
