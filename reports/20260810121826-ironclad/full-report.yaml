      - number: '7.2'
        title: Operational and dependency risk
        blocks:
          - type: paragraph
            body: >-
              Operationally, Ironclad’s strength and fragility come from the same place: deep workflow centrality. The
              platform is valuable because it connects intake, approvals, signature, repository, reporting, and
              downstream systems. That same architecture means implementation quality, schema governance, external
              system uptime, field mappings, API terms, and signature-provider health all matter. The clickwrap and
              signature documents show that some modules require technical implementation, add-ons, default-provider
              logic, or external account management. Customer stories underline the point from the buyer side:
              deployments are powerful when integrations work, but they depend on thoughtful setup and change
              management. The legal center adds another layer of dependency risk by giving Ironclad broad discretion
              over developer resources, updates, authenticators, rate limits, and access revocation. That is rational
              from a platform-control standpoint, but it increases customer and partner reliance on Ironclad as a
              gatekeeper rather than merely a neutral tool. In practice, the biggest operational downside is not one
              catastrophic failure mode but many smaller failure paths—configuration drift, provider incidents, workflow
              brittleness, and ecosystem coupling—that can accumulate into customer-friction risk.
