  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and module map
        blocks:
          - type: paragraph
            body: >-
              Ironclad’s public product story starts with the contract lifecycle but now extends beyond that label into
              a broader operating system for business agreements. Its own navigation and product pages consistently
              present the platform around the lifecycle stages of create, review, sign, store, analyze, and fulfill,
              which is more expansive than a repository-only or e-signature-only tool. Around that spine, Ironclad has
              built visible modules for AI-assisted drafting and review, an agentic legal-review product called Jurist,
              native signature, clickwrap acceptance, workflow design, records/repository management, and a large
              integration layer. This breadth matters because it explains why Ironclad often wins on workflow fit: the
              company is not merely digitizing documents, it is turning legal rules, approvals, data capture, and
              downstream actions into reusable productized flows. The practical implication is that product diligence
              should focus on how these modules reinforce one another rather than on any single feature in isolation.
