      - number: '2.3'
        title: Drivers, constraints, and what matters for underwriting
        blocks:
          - type: paragraph
            body: >-
              The category drivers are credible and fairly consistent across retained sources: legal teams are under
              pressure to manage risk and self-service at lower cost, enterprises want agreement data to become
              operational intelligence, and AI is moving from novelty into workflow infrastructure. But the constraint
              set is just as important. Conga shows almost universal AI use with only limited optimization; Icertis
              shows enthusiasm for autonomous negotiation coexisting with serious trust and output-quality concerns;
              Summize points to hallucination risk, project cancellation risk, and an only-partially-successful CLM
              implementation base; ThinkFree focuses on the post-draft work that still blocks value capture; and Bind
              emphasizes that architecture and implementation runway now decide many deals before feature wars even
              start. The underwriting implication is that Ironclad’s market is real and growing, but value accrues
              unevenly. Vendors that combine integration depth, governance credibility, and usable AI can compound;
              vendors that sell flashy automation without implementation or trust scaffolding may still stall in
              evaluation or fail after go-live. That is why market quality matters as much as market size: in CLM, a
              vendor can be right about category direction and still lose economically if deployments take too long,
              trust remains low, or product architecture cannot translate AI features into audited enterprise workflows.
