  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape structure and where Ironclad sits
        blocks:
          - type: paragraph
            body: >-
              Ironclad does not face one clean rival; it faces at least four competitor classes that solve the same job
              differently. The first class is enterprise CLM incumbents such as Icertis, DocuSign CLM, Agiloft, Sirion,
              Workday/Evisort, and Leah/ContractPodAi, each of which markets full-lifecycle control but leads on a
              different attribute: portfolio intelligence, signature adjacency, no-code customization, procurement
              governance, fast AI extraction, or agentic automation. The second class is workflow and intelligence
              challengers such as LinkSquares and SpotDraft that are easier to shortlist when the buyer cares more about
              repository intelligence or rapid deployment than about the heaviest enterprise controls. The third class
              is simpler mid-market tooling such as Concord or point solutions that can satisfy teams with standard
              routing and repository needs. The final class is status quo plus internal build, where enterprises stitch
              together DocuSign eSignature, SharePoint, CRM, procurement systems, and manual review processes. That map
              matters because Ironclad’s competitive posture is workflow-first: its own surfaces and independent reviews
              repeatedly frame it as a strong choice for contract automation, business-user requester experience,
              Salesforce-linked revenue workflows, and faster deployment, but not automatically as the deepest system
              for post-signature supplier governance or the most configurable platform in the category.
