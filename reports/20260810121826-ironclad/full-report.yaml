    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, platform scope, and current scale
        blocks:
          - type: paragraph
            body: >-
              Ironclad’s current public identity is broader than a narrow legal-workflow point tool. The homepage, AI
              product page, customer stories, and Salesforce listing all position the company as the system that lets
              legal, procurement, sales, and business teams create, negotiate, approve, sign, store, and analyze
              agreements in one workflow layer. That claim is supported by integration evidence: Ironclad highlights
              CRM, e-signature, document, messaging, procurement, and compliance connections rather than a closed legal
              repository. The scale markers are also materially stronger in 2026 than the 2022 unicorn narrative most
              investors still remember. Current official materials now converge around 2,000-plus customers and more
              than two billion contracts processed, while the ARR announcement shows the company has crossed the $200
              million threshold. The result is a clear chapter-one conclusion: Ironclad should be treated as a scaled
              late-stage enterprise software company in CLM, even though several operating details such as headcount and
              ownership remain private.
