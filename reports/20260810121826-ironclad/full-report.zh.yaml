              NRR、GRR、客户 logo
              流失或前十大客户集中度披露，公开记录也不能显示多少客户仍停留在单一工作流规模，多少客户实现了有意义扩张。一些评论来源也暴露设置、复杂编辑和导航摩擦，说明客户满意度高，但并非无摩擦。最负责任的结论是，Ironclad
              对真实采用和可信满意度有强证明；但最深的耐久性和集中度问题仍是私营公司尽调事项，而不是公开事实已经解决的问题。
