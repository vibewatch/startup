      - number: '7.2'
        title: 运营与依赖风险
        blocks:
          - type: paragraph
            body: >-
              从运营看，Ironclad 的强项和脆弱性来自同一处：深度工作流中心性。平台有价值，是因为它连接入口、审批、签署、合同库、报表和下游系统。同一架构也意味着实施质量、schema
              治理、外部系统可用性、字段映射、API 条款和签名提供商健康度都重要。clickwrap
              和签名文档显示，一些模块需要技术实施、附加项、默认提供商逻辑或外部账户管理。客户故事从买方侧强调了同一点：集成跑通时部署很强，但它们依赖深思熟虑的设置和变更管理。法律中心又叠加一层依赖风险，因为它赋予
              Ironclad 对开发者资源、更新、认证器、速率限制和访问撤销的广泛裁量权。从平台控制角度看这很合理，但也提高了客户和伙伴对 Ironclad
              作为守门人的依赖，而不仅是把它当中立工具。实践中，最大运营下行不是单一灾难性故障模式，而是许多较小失败路径——配置漂移、提供商事故、工作流脆弱和生态耦合——累积成客户摩擦风险。
