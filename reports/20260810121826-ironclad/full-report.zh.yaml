companyProfile:
  summary: >-
    Ironclad 是一家总部位于 San Francisco 的合同生命周期管理平台，成立于 2014 年。其 AI
    驱动产品帮助法务、销售、采购和运营团队大规模创建、谈判、审批、签署、存储和分析合同。公开来源支持这些判断：Ironclad 于 2022 年 1 月完成 $150 million Series E，报道估值为 $3.2
    billion；2026 年 ARR 超过 $200 million；服务超过 2,000 家客户。公司现在把 Ironclad AI 和 Jurist 定位为工作流驱动合同平台的下一阶段。
  foundedDate: '2014-01-01'
  founders:
