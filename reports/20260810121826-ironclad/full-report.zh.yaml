  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前估值语境与公开锚点
        blocks:
          - type: paragraph
            body: >-
              Ironclad 最干净的公开估值锚点仍是 2022 年 1 月 Series E，当时公司估值 $3.2 billion。此后，公开记录在运营规模上改善很多，在价格发现上改善少得多。Ironclad 现在声称
              ARR 超过 $200 million、客户超过 2,000 家，确认其已成长为有意义的企业软件规模。但没有公开披露的 2022 年后融资事件，为今天的 SaaS 市场重置估值标记。按 2026 年 ARR
              锚点，旧 $3.2 billion 价格意味着约 16x ARR 倍数。强劲且 AI 导向的私营 SaaS 公司并非不能支撑这种倍数，但在缺少公开
              NRR、利润率、现金效率或更新轮次条款披露的情况下，这是很高的起点。因此，第一条估值判断很简单：Ironclad
              的运营证明已经改善，但公开价格锚点仍陈旧，并且可能偏乐观，除非后期私募条款明显比头条数字对投资人更友好。
