      - number: '6.3'
        title: 可衡量客户成果与 ROI
        blocks:
          - type: paragraph
            body: >-
              公开证明在量化时最强，Ironclad 的案例研究集在这方面足够频繁，因此有用。Dentalcorp 将起草时间从 15 分钟降到 4 分钟，上线约 90 名用户，并载入超过 1,700 份合同，覆盖约 95%
              的供应商合同。Docker 称，自动化编辑每月节省超过 15 小时，200 多个已完成工作流提升了效率。Orangetheory 用 AI 将一个为期六个月的模板整合项目缩短到三个月，并让 10% 到 15%
              的会员通过 clickwrap 渠道流转。Camunda
              称，某些公开工作流现在端到端约五分钟完成，其条款库工作流节省了此前模板维护时间的约四分之三。客户故事概览还给出更广的头部指标，例如特定具名案例中周转时间降低 96%、成本降低 70%、合同时间降低 75%，以及前
              71 天采用率达到 99%。这些是供应商筛选过的参考，不应视为全组合平均值，但仍是 Ironclad 能在生产环境中产出可衡量运营成果的有意义证明。
