      - number: '4.3'
        title: 利润率代理与单位经济性读数
        blocks:
          - type: paragraph
            body: >-
              Ironclad 不公布毛利率、CAC、回本期或 NRR，因此判断单位经济性的唯一有纪律方式，是区分哪些能观察、哪些只能设边界。可观察一面，相邻工作流和文档软件中的公开 SaaS
              可比公司有帮助。DocuSign、Dropbox 和 Box 的 SEC companyfacts 都指向约 79% 到 80%
              的毛利率区间，这可作为成熟软件型经常性收入的有用基准。若订阅收入占主导且实施工作受控，Ironclad 核心产品应有能力呈现类似软件式利润率特征。但保留定价证据也提醒，不能假设它是纯软件模型。Ironclad
              似乎通过 AI、高级集成、法律工程式实施和企业支持层变现，这些都会让收入成本更复杂，并相对最干净的公开 SaaS
              同业压低混合毛利率。结论是一幅合理但不完整的图：经常性收入质量可能有吸引力，但投资人仍无法从公开证据判断，AI 和服务带来的生命周期价值是否快于它们增加的上线、支持和算力负担。
