  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块地图
        blocks:
          - type: paragraph
            body: >-
              Ironclad
              的公开产品故事始于合同生命周期，但现在已越过这个标签，延伸成更广义的商业协议操作系统。其自身导航和产品页一贯围绕创建、审查、签署、存储、分析和履约这些生命周期阶段呈现平台，比只做合同库或只做电子签的工具更宽。围绕这条主干，Ironclad
              已搭建可见模块：AI 辅助起草和审查、名为 Jurist 的代理式法律审查产品、原生签署、clickwrap 接受、工作流设计、记录 / 合同库管理，以及庞大集成层。这种广度重要，因为它解释了 Ironclad
              为什么常靠工作流适配胜出：公司不只是把文档数字化，而是把法律规则、审批、数据采集和下游动作变成可复用的产品化流程。实际含义是，产品尽调应关注这些模块如何彼此强化，而不是孤立看某个功能。
