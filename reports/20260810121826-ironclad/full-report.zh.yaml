          label: 熊市情景
          low: 0.7
          value: 0.8
          high: 1
          unit: $B equity value
        - id: base
          label: 基准情景
          low: 1.3
          value: 1.6
          high: 2
          unit: $B equity value
        - id: bull
          label: 牛市情景
          low: 2.4
          value: 2.8
          high: 3.2
          unit: $B equity value
    approximationNotes: 基于 $200M ARR 和明确倍数假设给出的判断性估值区间；不是 DCF，也不是市场出清价格。
