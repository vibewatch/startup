  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与公开牵引力
        blocks:
          - type: paragraph
            body: >-
              Ironclad 的公开财务故事现在已足以证明规模，尽管仍太薄，无法完成完整承保。最清晰的锚点是 2026 年 ARR 公告，并有独立报道补强，显示公司年度经常性收入超过 $200 million。结合公司当前
              2,000 多家客户的说法，这意味着每客户平均 ARR 下限约为 $100,000，方向上符合企业级 CLM 销售模式，而不是 SMB 自助经济性。产品表面也显示分层变现模式。Ironclad
              卖的不是一个狭窄席位许可，而是一个包含
              AI、Jurist、原生执行、集成和实施服务的工作流记录系统。多家定价来源把商业模式描述为平台费、用户许可、贡献者席位经济性和附加模块的某种混合。财务结论是：Ironclad
              似乎已经跨过有意义企业软件规模的门槛，但公开证据仍不足以显示 ARR 中有多少来自核心订阅，多少来自 AI、服务或其他扩张。
