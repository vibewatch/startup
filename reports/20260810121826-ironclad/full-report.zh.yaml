      - - AI / Jurist 附加模块
        - 高阶 AI 审阅、起草、问答和合同智能层
        - 附加年度费用或模块溢价
        - 第三方定价来源一致认为，AI 相比核心 CLM 是显著付费加价
        - 潜在 ARPU 和留存扩张驱动
        - 索取 AI 附加率、毛利率，以及相对非 AI 账户的续约提升
      - - 执行 / 签署层
        - 与平台绑定的原生签署执行和工作流完成
        - 捆绑模块 / 功能包
        - 公开来源显示，它更像被打包进整体平台价值，而非单独披露经济性
        - 支撑打包深度和工作流锁定
        - 索取附加率，并验证原生签署在经济性上是否替代外部电子签工具
      - - 实施和专业服务
        - 法务工程、迁移、配置和上线工作
