      - number: '3.2'
        title: 直接企业战线：工作流、智能、治理与包装
        blocks:
          - type: paragraph
            body: >-
              最影响决策的竞争分野不是公司规模本身，而是买方希望软件优化什么。Docusign CLM 在签名工作流和 Docusign 品牌已经锚定流程的地方最强；Icertis
              在买方需要跨多实体、多司法辖区的重型企业合同智能系统时最强；独特工作流设计和无代码配置比现代 UX 更重要时，Agiloft 胜出；用例由组合抽取、供应商义务和受治理的签署后运营主导时，Sirion 与
              Workday/Evisort 最有吸引力；Leah/ContractPodAi 则最用力推进代理式自动化。相比之下，Ironclad 最常被描述为工作流和易用性领导者，拥有强 Salesforce
              对齐，并且更容易讲出由法务主导部署的叙事。这对商业合同很有吸引力，但也定义了护城河边界。独立对比来源反复指出，整个品类的企业定价都不透明，多数传统 CLM
              套件实施仍以月计而非以天计，真正差异化现在来自每家供应商最深的地方，而不是宽泛 AI
              口号。因此，定价和功能表呈现出一个产品高度重叠的市场；但真实决策仍会随预算负责人重视请求者采用、合同智能、采购治理还是签名生态杠杆而显著变化。
