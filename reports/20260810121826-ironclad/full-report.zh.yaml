  - id: TP004
    title: 护城河耐久性 / 竞争风险登记表
    columns:
      - 风险 / 护城河因素
      - 主要威胁
      - 严重性
      - 重要性
      - 当前判断
      - 缓释措施 / 尽调要求
    rows:
      - - AI 功能商品化
        - 所有主要 CLM 厂商
        - 高
        - AI 审阅、抽取和摘要已足够常见，单靠这些功能不再能定义品类
        - 功能护城河正在被压缩
        - 求证落地工作流效果和治理能力，而不是数 AI 功能
      - - 签后治理缺口
        - Sirion、Icertis、Workday/Evisort
        - 高
        - 有大量义务、采购或供应商治理需求的买方，可能更偏好更深的合同组合控制
        - 在工作流核心之外最关键的战略缺口
