      - number: '7.3'
        title: 竞争与财务 / 模型风险
        blocks:
          - type: paragraph
            body: >-
              竞争风险在于，Ironclad 最强的公开优势——工作流易用性、Salesforce 邻近性、AI 附加项和更快的法务团队采用——都是竞争对手也在投入的领域。DocuSign
              CLM、Icertis、Agiloft、Sirion 和 SpotDraft 的官方与评论来源集显示，这个品类里每个主要供应商现在都宣称拥有 AI、自动化、分析和企业集成。这让 AI
              商品化成为真实风险：买方可能仍偏好 Ironclad，但已经不能仅凭「有 AI」来证明溢价合理。财务模型风险会放大这种压力。第三方定价来源描述了不透明折扣、实施负担，以及实质性服务或支持强度；而能解决
              NRR、毛利率或现金效率的公开公司指标，对 Ironclad 仍是私有。结果是一家公司战略上很有吸引力，但仍暴露于更慢企业销售周期、服务和 AI 支持导致的利润率压缩，以及如果增长或留存不如 ARR
              头条数据暗示的那样耐久，估值被重置的风险。
