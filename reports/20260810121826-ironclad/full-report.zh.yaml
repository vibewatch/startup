  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与买方问题
        blocks:
          - type: paragraph
            body: >-
              Ironclad 的市场分析第一步，是把 CLM 定义得足够紧，让这个品类仍有投资价值，而不是塌缩成所有法务或电子签工作流。MGI
              的定义是保留来源里最干净的边界：合同生命周期管理覆盖一份协议从创建到续约和关闭所涉及的流程与数据。Ironclad
              这类平台自然会纳入起草、谈判、审批、执行、合同库、分析，以及贯穿法务、采购、销售和合规的工作流自动化。但这不意味着每个相邻工具都应放进同一个支出桶。嵌入式电子签、文档存储或独立法律 AI
              研究可以相邻且具战略意义，却不是同一个市场。这个边界逻辑重要，因为 Ironclad
              卖的是跨职能协议记录系统，不只是签名工具。买方问题也不只是「法务需要更快的合同工具」：企业想要自助服务、更低周期、更好控制，以及能支撑跨部门运营决策的合同数据。这一区分对 Ironclad
              很关键，因为预算论证往往同时来自多个职能；协议数据越触及收入、采购和合规结果，CLM 平台就越容易守住企业级定价，避免被视为狭义法务开支。
