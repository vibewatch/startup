  - id: TV005
    title: 投资逻辑破裂和终止触发点表
    columns:
      - 触发点
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 留存走弱
        - NRR 显著低于优质 SaaS 预期，或客户数流失明显升高
        - 击穿溢价倍数论证
        - 立即重定价到基准 / 悲观情景
      - - 毛利不及预期
        - 因服务或 AI 成本，混合毛利率显著低于软件型水平
        - 削弱 IPO 级软件投资逻辑
        - 要求大幅折扣或回避
      - - 安全信任事件
        - 重大事件且披露薄弱，或造成大量客户冲击
        - 伤害企业信任和销售效率
        - 暂停投资，先厘清影响
      - - 竞争压缩
        - 赢单 / 输单和折扣显示 AI 未能支撑定价权
        - 把品类领导力压成平均经济性
        - 在该估值标记下，将立场从买入转为持有 / 回避
      - - 条款清单悬顶
        - 优先权、清算堆叠或稀释悬顶显著恶化普通股结果
        - 即便运营公司不错，也会压低实际回报
        - 要求交易结构保护或更低入场价格
    notes: 隐藏分母走弱比市场规模疑问更容易击穿投资逻辑。
    claimRefs:
      - CV027
      - CV032
      - CV033
      - CV036
      - CV037
      - CV040
      - CV041
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - 留存质量
        - NRR、GRR、流失和队列续约
        - 优质私有软件价值的主要驱动因素
        - CFO / 董事会材料
      - - 毛利质量
        - 按订阅、AI 和服务拆分的毛利率
        - 检验 ARR 是高质量订阅还是服务偏重
        - 财务尽调资料室
      - - 定价兑现
        - 近期合同、折扣瀑布和 AI 附加率
        - 判断 $200M ARR 是高质量收入，还是靠大幅折扣堆出来的
        - 收入运营 / 销售财务
      - - 股权结构表与优先权
        - 当前股份类别、清算优先权和投资人权利
        - 不看条款结构，表面估值容易误导
        - 法律 / 融资文件
      - - 现金效率
        - 烧钱速度、现金可支撑时长和销售效率
        - 用于判断下行保护和 IPO 节奏
        - 财务尽调资料室
      - - 安全与可靠性遥测
        - 事故记录、正常运行时间、安全问卷结果
        - 信任风险可能主导企业软件结局
        - CTO / 安全尽调资料室
    notes: 这些尽调问题刻意压得很少，因为每一项都可能实质性影响价值，影响幅度往往超过再多一批营销背书。
    claimRefs:
      - CV033
      - CV034
      - CV035
      - CV038
      - CV039
      - CV040
      - CV041
