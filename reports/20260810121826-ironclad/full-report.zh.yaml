        - 报价驱动的经常性软件订阅，覆盖工作流、资料库、审批和协作
        - 年度合同 / 席位组合
        - 未公开价目表；多个来源认为年费入门点在数万美元级别
        - 经常性核心收入质量高，但实际成交价未公开
