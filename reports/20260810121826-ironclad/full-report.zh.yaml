  - id: TR002
    title: 监管 / 法律风险清单
    enumerationScope:
      coverage: sample
      basis: >-
        Representative risk register covering the major public legal and regulatory exposures visible in retained
        sources, not every possible statute.
    columns:
      - 风险领域
      - 公开证据指向
      - 为什么重要
      - 缓释信号
      - 剩余缺口
    rows:
      - - API 和开发者资源限制
        - API 使用条款设定速率限制、可撤销认证凭据，以及反竞争用途限制
        - 集成方依赖的是受控平台，不是无限制接口
        - 合同护栏保护平台
        - 合作伙伴灵活性和基准测试透明度受限
      - - 网站和服务法律边界
        - 服务条款明确 Ironclad 不是律师事务所，信息不保证完整或最新
        - 客户仍需法律审核，不能把判断完全外包
        - 法律边界设定清晰
        - 价值叙事可能跑在法律责任现实前面
      - - 隐私法暴露
        - 隐私政策确认会收集并处理个人、职业和财务数据
        - CLM 会触及客户和交易对手的受监管数据
        - 有正式政策和联系渠道
        - 公开政策无法证明运营合规深度
      - - GDPR 和 HIPAA 采购负担
        - 官方页面强调符合 GDPR 和 HIPAA；监管框架本身仍然要求很高
        - 受监管买家采购前可能要求更深尽调
        - 安全页面和法律链接提供起点
        - 跨境和医疗健康证据仍停留在摘要层面
      - - AI 治理预期
        - NIST AI RMF 和生成式 AI 概要显示治理标准在抬高
        - 法律 AI 买家越来越要求有文档化风险控制
        - Ironclad 明确把 AI 放在主要产品方向
        - 模型评估和幻觉控制没有公开到足够深度
    notes: 本表聚焦合规和合同暴露；即便没有公开执法行动，这些因素也会改变交易周期或产品义务。
    claimRefs:
      - CR004
      - CR005
      - CR006
      - CR007
      - CR008
      - CR010
      - CR011
      - CR012
      - CR013
      - CR014
      - CR015
