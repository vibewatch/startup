              一个务实情景框架，比旧头条估值更能给出现实区间。熊市情景中，Ironclad 仍是好产品，但行为更像成熟中的工作流 / 文档 SaaS
              公司，收入倍数接近公开可比公司，并受到定价和服务强度带来的适度下行影响；这对应约 4x ARR，或约 $0.8 billion 价值。基准情景中，Ironclad 仍因品类领导地位、企业采用和 AI
              上行获得明确溢价，但因私营不透明被打折；8x ARR 倍数对应约 $1.6 billion。牛市情景中，投资人假设同类最佳留存、强 AI 附加销售和可信 IPO 准备度，可支撑约 14x ARR，或约 $2.8
              billion。三个情景都等于或低于上一次 $3.2 billion
              公开估值，这意味着仅凭公开证据，当前头条价格并不明显便宜。若进入价格包含结构、二级市场折扣，或私下尽调在留存和利润率上异常强，投资立场仍可保持建设性。
