  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: 面向 IC 的 Ironclad 当前公开证据判断快照。
    data:
      items:
        - label: 建议
          value: Buy
          note: 只有守住入场纪律并做更深尽调，才推进。
        - label: 信心
          value: Medium
          note: 资产质量证据不错，经济性证据不完整。
        - label: 风险评级
          value: Medium
          note: 安全、竞争和披露风险都重要，但可管理。
        - label: 估值立场
          value: Fair
          note: 公司有吸引力，但没有更新证据时，旧估值已经打满。
        - label: 公开规模锚点
          value: Strong
          note: $200M+ ARR 和 2,000+ 客户是有意义的后期信号。
        - label: 经济性可见度
          value: Weak
          note: NRR、利润率和条款结构数据仍未公开。
        - label: 最佳可比视角
          value: Hybrid
          note: 直接上市工作流 / 文档可比公司锚定下行，溢价 SaaS 逻辑锚定上行。
    approximationNotes: KPI 标签是基于保留来源得出的分析判断，不是公司披露的记分卡。
    claimRefs:
      - CV004
      - CV006
      - CV024
      - CV032
      - CV033
      - CV038
      - CV039
      - CV040
      - CV041
      - CV042
