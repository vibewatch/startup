  customerFocus: 企业法务部门、内部法务、销售运营、采购团队，以及需要高频合同自动化和可搜索合同智能的跨职能业务用户。
  businessModel: SaaS 订阅模式，采用报价驱动的企业定价，并按工作流范围、用户组合、AI 附加项、签署和集成功能，以及实施或支持服务分层。
