      - number: '1.3'
        title: 融资历史、估值与利益相关方图谱
        blocks:
          - type: paragraph
            body: >-
              作为一家私营法律科技平台，Ironclad 的融资历史异常清晰。2021 年 1 月的 Series D 让公司以 $100 million 新资金跻身准独角兽，BOND 领投，Lux Capital
              成为新投资方，Accel、Sequoia、YC Continuity 和 Emergence 继续支持。一年后，2022 年 1 月的 Series E 再融 $150 million，将披露融资总额推至
              $333 million，并引入 Franklin Templeton 领投，同时大体保留了内部投资人占比较高的股东基础。独立报道将该轮估值定在 $3.2
              billion，这仍是留存公开估值里最强的锚点。缺失的信息同样重要：2026
              年新闻室和新闻稿轨迹没有更新的公开融资公告，当前公开材料也仍未披露持股比例、除历史观察员说明之外的董事席位或清算条款。因此，Ironclad
              资本充足、显然处在成长阶段，但经济结构仍像许多后期私营软件公司一样不透明。
