      - number: '6.2'
        title: 部署模式与跨职能扩张
        blocks:
          - type: paragraph
            body: >-
              来源集中最强的重复采用模式，是先落在一个工作流，再横向扩张到更多职能和协议类型。Gong 从碎片化系统走向四个核心工作流和每年约 10,000 份合同。Vinted 为 120 名用户实施了 12
              个工作流，覆盖采购、运输、营销和客户支持。Docker 将 Ironclad 接入 Salesforce、Zip 和 Productiv，用它管理销售、采购、IT 和定价治理问题。Skillsoft
              在全球业务单元中标准化合同管理，Benjamin Moore 则为 $10,000 到 $10 million 的不同合同设置差异化审批路径。Camunda 用公开工作流和 clickwrap
              把常规协议从小时级压到分钟级，Orangetheory 则把 AI 和 clickwrap 用于面向消费者的规模化场景。这种扩张模式具有战略意义，因为它暗示 Ironclad
              一旦成为连接业务团队的共享流程织网，就会很粘。它也说明，买方价值常常绑定配置和集成，而不只是法务审查效率。
