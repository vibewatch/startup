      - number: '2.3'
        title: 驱动因素、约束与承保重点
        blocks:
          - type: paragraph
            body: >-
              保留来源对品类驱动因素的描述可信且相当一致：法务团队被要求以更低成本管理风险和自助服务，企业希望协议数据变成运营智能，AI 正从新鲜事物进入工作流基础设施。但约束同样重要。Conga 显示 AI
              使用几乎普及，但优化有限；Icertis 显示，市场既热衷自主谈判，也严重担忧信任和输出质量；Summize 指出幻觉风险、项目取消风险和只有部分成功的 CLM 实施基础；ThinkFree
              聚焦起草之后仍阻碍价值兑现的工作；Bind 则强调，架构和实施跑道现在会在功能战开始前就决定许多交易。承保含义是：Ironclad 的市场真实且在增长，但价值分配不均。能把集成深度、治理可信度和可用 AI
              结合起来的供应商可以复利；只卖炫目自动化、缺少实施或信任脚手架的供应商，仍可能卡在评估阶段，或上线后失败。这就是为什么市场质量和市场规模同等重要：在 CLM
              里，供应商可能判断对了品类方向，却因为部署太慢、信任偏低或产品架构无法把 AI 功能转成可审计企业工作流，而在经济上输掉。
