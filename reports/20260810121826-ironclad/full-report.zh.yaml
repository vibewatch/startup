        - 要求按细分市场和工作流数量提供部署指标
      - - AI 治理
        - AI 已嵌入产品和案例研究
        - AI 附加率、人工覆写率、法务团队信任、采购异议
        - AI 错误或治理不透明显著拖慢采用
        - 要求提供评估框架、人工审核政策和事件样例
      - - 竞争 / 定价
        - 产品面宽、集成多
        - 赢单 / 输单率、折扣水平、Salesforce 驱动管道健康度
        - 大幅折扣或竞争赢率走弱
        - 要求按竞争对手提供赢单 / 输单和定价瀑布
      - - 留存 / 集中度
        - 强客户证据和广泛客户名单
        - 续约率、模块扩张、头部账户占比
        - 尽调显示 NRR 偏弱或集中度偏高
        - 立即要求提供 NRR、GRR、流失和集中度数据
    notes: 只要管理层愿意披露运营遥测，而不只给营销结果，大多数重大风险都有前置指标。
    claimRefs:
      - CR043
      - CR044
      - CR045
      - CR046
  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 评估
      - 判断依据
      - 哪些证据会改变判断
    rows:
      - - 建议
        - 买入
        - 资产质量足够强，值得在价格纪律下推进
        - 更新尽调显示留存偏弱或毛利质量差
      - - 信心
        - 中
        - 公开运营证据扎实，但关键投资判断输入仍未公开
        - 收到审计口径 KPI 桥接表和当前股权结构表
      - - 风险评级
        - 中
        - 执行、竞争和披露风险都很实质，但今天还不足以击穿投资逻辑
        - 安全事件、AI 商品化或留存走弱会抬高风险
      - - 估值立场
        - 合理
        - 资产有吸引力，但缺少更深证据时，旧的 $3.2B 标记已经偏满
        - 入场折扣或强劲非公开指标会改善立场
      - - 持有 / 退出姿态
        - 多年私有市场持有
        - 虽已有规模，公开市场退出准备仍不完整
        - 建立 IPO 报告就绪路径，并强化毛利披露
      - - 首要尽调门槛
        - NRR + 毛利率 + 条款
        - 这三项决定是否配得上溢价倍数
        - 管理层提供最新 KPI 和融资透明度
    notes: 本表总结当前可投性判断，而不是按确定性加权的投资判断模型。
    claimRefs:
