      - number: '5.3'
        title: 信任、安全与运营控制
        blocks:
          - type: paragraph
            body: >-
              公开证据支持 Ironclad 具备可信的企业安全姿态，尽管技术透明度不完整。Ironclad 安全页称，生产环境云托管在 Google Cloud Platform，数据传输采用 TLS 1.2
              或更高版本加密，静态数据采用 AES-256 加密，公司跨多个区域运营以防宕机。同一页面还宣传年度渗透测试、季度漏洞测试，以及包括 SOC 1、SOC 2 Type II 和 ISO
              27001、27017、27018 在内的正式认证组合。Slack 披露的合作伙伴安全元数据补充了具有运营价值的细节，例如数据删除时间、支持 Okta 和 Google 的 SSO，以及服务云托管在 GCP
              的声明。这些是真正利好企业买方的信号，但不等同于深度架构尽调。公开材料没有披露事故率、可用性表现、模型治理内部机制或 RTO/RPO 指标，因此信任图景在控制表层扎实，在工程运营层面仍不完整。
