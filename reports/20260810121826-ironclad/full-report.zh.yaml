  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 概率信号
      - 核心假设
      - 倍数 / 价值逻辑
      - 隐含价值区间
      - 必须成立的条件
    rows:
      - - 悲观
        - 可信下行
        - 增长放缓至成熟工作流软件常态，经济性只证明是平均水平
        - 基于 $200M ARR 的 ~4x ARR
        - ~$0.8B
        - 留存或 AI 变现不及预期，公开可比公司的估值纪律主导定价
      - - 基准
        - 公开证据下最均衡的情景
        - Ironclad 保住品类领导力和良好扩张，但不透明度足以让估值相对私募高峰叙事打折
        - 基于 $200M ARR 的 ~8x ARR
        - ~$1.6B
        - NRR 良好但非顶尖；毛利质量合格但不出众
      - - 乐观
        - 需要溢价级证据
        - Ironclad 展现同类最佳留存、高效 AI 增购和可信 IPO 准备度
        - 基于 $200M ARR 的 ~14x ARR
        - ~$2.8B
        - AI 附加、续约强度和毛利路径都经得起尽调
    notes: 情景倍数是判断性区间，锚定筛选后的公开可比公司、市场增长背景和私营公司不确定性。
