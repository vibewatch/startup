  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础与细分广度
        blocks:
          - type: paragraph
            body: >-
              Ironclad 的公开客户足迹足够宽，能支撑真实企业平台的读法，而不是小众法律科技工具。其客户故事中心称，超过 2,000 家公司使用该平台，并明确覆盖从初创公司到 Fortune 500 组织。具名案例横跨
              Gong、Docker、Vinted、Camunda 和 Skillsoft 等软件公司；Dentalcorp 等医疗相关和服务密集环境；Benjamin Moore 和 Orangetheory
              等大型消费品牌；以及客户页上 Oklahoma 案例研究所代表的公共部门式运营。这种广度重要，因为 CLM 工具如果走不出第一个法务团队用例，往往会失败。Ironclad
              的证据则显示，它能重复适用于采购、收入、营销、类似 HR 的入职流程，以及 IT 驱动治理。细分图景仍不完整——Ironclad 不公布按 ARR
              层级、地域或垂直行业的精确拆分——但可见客户名单已经足够多样，证明其品类相关性超越单一狭窄合同类型或公司规模带。
