            - 合同库
            - 招聘和供应商工作流
          outputs:
            - 运营可见度
        - label: 公共部门 / 机构
          detail: 客户名单里有 State of Oklahoma 这类背书
          tone: neutral
          modules:
            - 指标可见度
            - 流程控制
          outputs:
            - 采购场景可信度
  - id: FU002
    title: 先落地再扩张的客户路径
    type: flow
    layout: wide
    summary: 多数强客户背书先从法律或销售工作流切入；合同库、审批和集成跑通后，再扩到相邻团队。
    claimRefs:
      - CU012
      - CU013
      - CU014
      - CU015
      - CU016
      - CU017
      - CU020
      - CU021
      - CU022
    data:
      nodes:
        - id: f1
          label: 初始痛点
          description: 合同分散、可见度弱、审批靠手工，或存在定价风险。
        - id: f2
          label: 首个生产工作流
          description: 销售协议、NDA、采购或合同库迁移上线。
        - id: f3
          label: 集成和报告
          description: Salesforce、Zip、Productiv、clickwrap 或 API 连接提高效用。
        - id: f4
          label: 跨职能扩张
          description: IT、财务、采购、运营、市场或面向客户的团队加入。
        - id: f5
          label: 持久性信号
          description: 合同量更高、工作流更多、周期更快，内部依赖也更深。
      edges:
        - from: f1
          to: f2
          label: 推动
        - from: f2
          to: f3
          label: 促成
        - from: f3
          to: f4
          label: 拉入
        - from: f4
          to: f5
          label: 形成
  - id: FU003
    title: 客户成效区间
    type: range
    layout: standard
    summary: 具名客户成效主要集中在时间、采用率、合同库完整度和工作流自动化的实质改善。
    claimRefs:
      - CU026
      - CU027
      - CU028
      - CU029
      - CU030
      - CU031
      - CU032
      - CU033
      - CU034
      - CU035
      - CU036
    data:
      items:
        - label: 每份合同起草时间
          low: 4
          mid: 9.5
          high: 15
          unit: minutes
          note: Dentalcorp 从 15 分钟降到 4 分钟
        - label: 每月编辑省下的时间
          low: 15
          mid: 15
          high: 15
          unit: hours
          note: Docker 称每月节省 15+ 小时
        - label: Clickwrap 采用渠道
          low: 10
          mid: 12.5
          high: 15
          unit: percent
          note: Orangetheory 将 10-15% 会员导入 clickwrap 渠道
        - label: 客户案例中的采用率里程碑
          low: 71
          mid: 71
          high: 71
          unit: days
          note: 一则官方客户案例称，前 71 天采用率达到 99%
        - label: 模板整合项目
          low: 3
          mid: 4.5
          high: 6
          unit: months
          note: Orangetheory 借助 AI 在 3 个月内完成，原目标为 6 个月
  - id: FU004
    title: 证据质量 / 新鲜度图
    type: matrix
    layout: standard
    summary: 客户证据在具名生产部署上最强，在客户组合层面的留存或集中度透明度上较弱。
    claimRefs:
      - CU012
      - CU018
      - CU026
      - CU037
      - CU038
      - CU040
      - CU041
      - CU044
    data:
      columns:
        - 具名生产部署证据
        - 量化成效
        - 独立佐证
        - 客户组合层面持久性可见度
      rows:
