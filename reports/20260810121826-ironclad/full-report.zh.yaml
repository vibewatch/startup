      - number: '2.2'
        title: 规模测算视角、细分市场与采用动能
        blocks:
          - type: paragraph
            body: >-
              公开 CLM 市场规模测算方向强劲，但方法混杂。MGI 更偏企业的视角估计，2026 年上市公司云 CLM 支出接近 $8.1 billion，CAGR 为 18%；Business Research
              Insights 则给出更宽的全球软件估算：2026 年 $2.95 billion，到 2035 年增至 $7.97
              billion。差异与其说是矛盾，不如说提醒投资人：市场定义会随公司样本和纳入支出变化。不论哪种口径，二者都支持品类双位数增长。细分细节进一步增强信心。MGI 称，仅美国就占 TAM 超过 30%，软件和 IT
              密集型行业是最大支出方，而较小公司实际增支速度快于最大型企业。采用端，Conga 和 Icertis 报告显示，AI
              在品类层面已不再是实验：使用很普遍，但优化和信任落后。这一组合支持一个有意义、预算负责人兴趣活跃的市场，同时也解释了为什么买方教育和实施纪律仍重要。做估值时，关键经验是原始 TAM
              数字只讲了一半；更有用的市场信号，是企业是否已经为 AI 赋能的合同流程编预算，哪怕它们在上线深度、治理和可衡量 ROI 上仍然挑剔。
