      - number: '1.2'
        title: 领导层、治理可见度与关键人物依赖
        blocks:
          - type: paragraph
            body: >-
              领导层故事在 2025 年发生了实质变化。在 Ironclad 大部分历史里，Jason Boehmig 既是公开创始人门面，也是运营 CEO；但公司自己的交接说明和 2026 年 ARR 发布稿现在把 Dan
              Springer 列为现任 CEO，并让 Boehmig 转任执行董事长，聚焦 AI
              创新和商业化策略。这不是表面调整：投资人需要按后创始人运营模式重新承保，同时承认创始人似乎仍在产品愿景上占核心位置。更广泛管理班子的公开证据在改善，但仍不完整。ARR 公告披露了产品、AI
              和工程方向的高管补强，但保留来源集没有呈现完整现任董事会名单、委员会结构或投资人控制图。最务实的尽调读法是：Ironclad 已显露规模化公司领导层信号，但治理透明度仍落后于牵引力和融资可见度。
