  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局结构与 Ironclad 所在位置
        blocks:
          - type: paragraph
            body: >-
              Ironclad 面对的不是一个清晰对手；它至少面对四类用不同方式解决同一任务的竞争者。第一类是企业 CLM 既有玩家，如 Icertis、DocuSign
              CLM、Agiloft、Sirion、Workday/Evisort 和 Leah/ContractPodAi，它们都营销全生命周期控制，但各自主打不同属性：组合智能、签名邻近性、无代码定制、采购治理、快速 AI
              抽取或代理式自动化。第二类是工作流和智能挑战者，如 LinkSquares 和
              SpotDraft；当买方更关心合同库智能或快速部署，而不是最重的企业控制时，它们更容易进入候选名单。第三类是更简单的中端市场工具，如 Concord
              或点解决方案，可满足标准流转和合同库需求。最后一类是现状加内部自建，企业把 DocuSign eSignature、SharePoint、CRM、采购系统和人工审查流程拼在一起。这个地图重要，因为
              Ironclad 的竞争姿态是工作流优先：其自有界面和独立评论反复把它描述为合同自动化、业务用户请求体验、与 Salesforce
              关联的收入工作流和更快部署的强选择，但它并不自动成为签署后供应商治理最深、或品类里最可配置的平台。
