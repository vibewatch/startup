              tone: negative
  - id: FR002
    title: 关键依赖图
    type: dag
    layout: wide
    summary: Ironclad 的运营风险贯穿外部系统、提供商关系和客户配置质量。
    claimRefs:
      - CR016
      - CR017
      - CR018
      - CR019
      - CR020
      - CR021
      - CR022
      - CR023
      - CR024
      - CR028
    data:
      nodes:
        - id: d1
          label: 客户工作流设计
          detail: schema、模板、审批和管理员治理
        - id: d2
          label: 外部业务系统
          detail: Salesforce、Zip、存储、ERP 和无代码自动化工具
        - id: d3
          label: 执行提供商
          detail: Ironclad Signature、DocuSign、Dropbox Sign、Adobe Sign 等电子签工具
        - id: d4
          label: 合同库和报告
          detail: 最终记录、分析和下游运营
        - id: d5
          label: 平台控制层
          detail: API 条款、速率限制、更新和认证控制
        - id: d6
          label: 安全和子处理方态势
          detail: 基础设施加固、门户监控、伙伴事件
      edges:
        - from: d2
          to: d1
          label: 供给
        - from: d1
          to: d3
          label: 路由到
        - from: d3
          to: d4
          label: 生成
        - from: d5
          to: d2
          label: 管控访问
        - from: d6
          to: d3
          label: 可能影响
        - from: d6
          to: d4
          label: 保护
  - id: FR003
    title: 风险缓释栈
    type: stack
    layout: wide
    summary: 控制、产品和商业层面都有缓释，但没有哪一层能免除对留存和可靠性做更深尽调的需要。
    claimRefs:
      - CR001
      - CR003
      - CR004
      - CR009
      - CR014
      - CR017
      - CR027
      - CR043
      - CR044
      - CR045
    data:
      layers:
        - label: 控制层
          detail: 加密、测试节奏、认证、门户披露
          tone: positive
          modules:
            - 安全页面
            - 安全门户
            - 隐私政策
          outputs:
            - 信任基线
        - label: 产品层
          detail: 原生签名、工作流设计器、伙伴集成、AI 产品打包
          tone: positive
          modules:
            - 签名
            - Clickwrap
            - API
            - AI
          outputs:
            - 运营灵活性
        - label: 商业层
          detail: 客户证据、生态广度、企业定位
          tone: neutral
          modules:
            - 案例研究
            - Salesforce 销售打法
            - 标杆客户标识
          outputs:
            - 销售韧性
        - label: 剩余风险层
          detail: 留存不透明、集中度未知、模型治理缺口
          tone: negative
          modules:
            - NRR 缺口
            - 集中度缺口
            - AI 评估缺口
          outputs:
            - 投资判断不确定性
  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 只有把高资产质量与价格纪律、未解的私营公司信息缺口一起权衡，推荐才保持建设性。
    data:
      nodes:
        - id: n1
          label: $200M+ ARR + 2,000+ 客户
          description: 经营规模真实存在。
        - id: n2
          label: AI + 工作流领导力
          description: 产品和客户证据足以支撑溢价叙事。
        - id: n3
          label: 16x 隐含名义 ARR 倍数
          description: 上一次公开价格锚点要求很高。
        - id: n4
          label: 缺失 NRR / 利润率 / 条款
          description: 核心投资判断输入仍未公开。
        - id: n5
          label: 有条件买入 / 公允估值
          description: 只有守住入场纪律并做更深尽调，才继续推进。
      edges:
        - from: n1
          to: n5
          label: 支撑
        - from: n2
          to: n5
          label: 支撑
        - from: n3
          to: n5
          label: 约束
        - from: n4
          to: n5
          label: 需要尽调
    approximationNotes: 决策逻辑图，不是正式财务模型。
    claimRefs:
      - CV004
      - CV006
      - CV007
      - CV023
      - CV024
      - CV033
      - CV038
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: Ironclad 目前的名义估值远高于成熟上市文档 / 工作流公司的收入倍数。
    data:
