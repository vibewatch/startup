      - number: '4.4'
        title: 资本充足性与剩余尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              资本充足性图景同时令人鼓舞也不完整。Ironclad 的 Series D 和 Series E，加上 $200 million-plus ARR，强烈暗示公司并非处在近期资本压力下运营。2026
              年增长公告读起来也像一家强调规模和 AI 投入的公司，而不是紧急融资。但公开来源没有披露下行情景分析最需要的资金细节。没有可靠公开现金余额、月度
              burn、runway、债务融资披露、契约包，或经审计收入组合拆解。因此，投资人可以推断 Ironclad
              拥有有意义的财务火力，但无法测试多年产品搭建、商业化投入和实施支持之后，这种实力还剩多少。务实判断是，Ironclad
              的财务画像好于其披露质量。公开证据足以支撑规模化企业软件框架，但不足以判断盈利耐久性、真实毛利率，或公司把报价驱动企业增长转化为长期自由现金流的效率。
