      - number: '8.2'
        title: 公开可比公司的读数
        blocks:
          - type: paragraph
            body: >-
              公开可比公司无法给出完全同口径答案，但能提供纪律校验。按 2026 年 8 月市值参考和 SEC 收入数据，DocuSign、Box 和 Dropbox 的市值 / 收入大致聚集在 3.2x 到
              3.9x，平均接近 3.6x。它们比看多 Ironclad 叙事里的公司更成熟、增长更慢，因此 Ironclad 应有一定溢价。与此同时，3.6x 的公开成熟软件区间与 Ironclad 隐含 16x
              头条倍数之间差距巨大。ServiceNow、Salesforce、Adobe、HubSpot 和 Workday
              等更高层级工作流与软件领导者显示，市场仍奖励规模化平台，但它们收入基数大得多、产品范围更宽、披露质量也深得多。正确读数既不是「Ironclad 应像 Box 一样交易」，也不是「Ironclad
              要什么溢价都合理」。更合适的结论是，Ironclad 可能值得相对成熟文档软件同业有溢价，但在没有证明增长、留存和 AI 变现异常出色之前，溢价不是无限的。
