            - label: 中
              tone: neutral
            - label: 低
              tone: negative
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: standard
    summary: 最重要的公开风险同时具备中高概率，以及较高的信任或经济性影响。
    claimRefs:
      - CR001
      - CR002
      - CR009
      - CR015
      - CR030
      - CR036
      - CR040
      - CR046
    data:
      columns:
