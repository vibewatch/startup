    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、平台范围与当前规模
        blocks:
          - type: paragraph
            body: >-
              Ironclad 当前公开身份已经不只是狭义法务工作流点工具。官网首页、AI 产品页、客户案例和 Salesforce
              上架页都把公司定位为一个系统：让法务、采购、销售和业务团队在同一工作流层创建、谈判、审批、签署、存储和分析协议。集成证据也支持这一说法：Ironclad 强调
              CRM、电子签名、文档、消息、采购和合规连接，而不是封闭法务合同库。到 2026 年，其规模信号也明显强于多数投资人仍记得的 2022 年独角兽叙事。当前官方材料已集中指向 2,000 多家客户和超过 20
              亿份已处理合同，ARR 公告则显示公司已跨过 $200 million 门槛。因此，第一章结论很清楚：Ironclad 应被视为 CLM 里已具规模的后期企业软件公司，尽管员工规模、所有权等若干经营细节仍属私有。
