  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 安全、隐私与监管风险
        blocks:
          - type: paragraph
            body: >-
              Ironclad 直接流经高度敏感的商业、雇佣、采购和合规数据，因此安全和隐私失败的代价会异常高。公开材料显示可信控制表层：传输和静态加密、Google Cloud
              托管、多区域运营、年度渗透测试、季度漏洞测试，以及可见认证组合。但同一份公开记录也说明，为什么这仍是核心风险，而不是已经打勾解决的事项。安全门户显示，Ironclad 必须持续监控第三方漏洞和子处理方事件，包括
              2024 年 Dropbox Sign 暴露事件对其旧签名路径的影响。隐私政策也确认，Ironclad
              通过在线服务处理有意义的个人、职业和财务数据；法律条款则在重要方面把安全、隐私和同意责任推给集成方和客户。具体到 AI，NIST AI RMF 和生成式 AI 指引表明治理预期正在上升，但 Ironclad
              公开披露的模型评估、幻觉控制或决策边界细节不足，外部来源无法完整承保这一风险。
