          description: 约 $2.52B 收入对应约 $8.01B 市值。
        - label: DocuSign 市值 / 收入
          value: 3.6
          description: 约 $3.22B 收入对应约 $11.5B 市值。
        - label: Box 市值 / 收入
          value: 3.9
          description: 约 $1.18B 收入对应约 $4.6B 市值。
        - label: Ironclad 熊市情景倍数
          value: 4
          description: 以 $200M ARR 套用类上市可比公司下行区间。
        - label: Ironclad 基准情景倍数
          value: 8
          description: 带披露折价的高溢价私营软件区间。
        - label: Ironclad 隐含名义倍数
          value: 16
          description: 约 $3.2B 名义价值除以 $200M ARR。
    approximationNotes: 由于企业价值输入和当前净现金调整在所有来源中并不一致可见，市值 / 收入被用作实用代理指标。
