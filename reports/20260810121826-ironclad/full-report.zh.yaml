    rows:
      - - Ironclad
        - 工作流优先的企业级 CLM
        - 公开披露 2,000+ 客户、$200M+ ARR
        - 企业法务、销售、采购和运营团队
        - 工作流自动化、请求方 UX、AI 审阅和 Salesforce 联动合同流程强
        - 与最重型存量厂商相比，签后治理深度差异化较弱
      - - Icertis
        - 企业级存量厂商
        - 比较来源显示其定位全球 Fortune 500，并具企业级基准地位
        - 大型受监管企业和全球化企业
        - 合同智能、分析、义务管理和全球企业覆盖最深
        - 成本和复杂度很高，对许多中端市场部署来说过重
      - - DocuSign CLM
        - 存量生态平台
        - 官网称 2,200 家企业信任其 CLM
        - 已在 DocuSign 和企业协议工作流上标准化的组织
        - 贴近签署环节、集成生态广、品牌信任强
        - 产品单独打包；专业工作流深度弱于顶级专门厂商
      - - Agiloft
        - 可配置 CLM 平台
        - 官网留存和实施满意度信号，加上广泛集成叙事
        - 流程特殊且愿意投入管理员资源的买方
        - 深度无代码可配置性和数据优先架构
        - 设置负担和 UI 取舍可能明显
      - - Leah / ContractPodAi
        - 智能体式企业级 CLM
        - 仅企业级打包；比较来源显示 Gartner/IDC 定位
        - 优先考虑 AI 智能体的法务、采购和财务团队
        - 公开叙事中，从需求入口到续约的智能体自动化推进最强
        - 更名后品牌清晰度较低，独立证据密度也不及最大存量厂商
      - - Sirion
        - 偏采购和签后的重型企业级 CLM
        - 在 70+ 个国家获客户信任，义务管理信号强
        - 大型采购、外包和供应商治理组织
        - 本次留存集中，公开签后和义务治理叙事最佳
        - 更重的企业级准备度和更长部署周期会限制适配
      - - Workday CLM / Evisort
        - AI 抽取与企业合同库挑战者
        - 官网给出快速部署和大规模分析指标
        - 需要快速合同库智能和受治理 AI 的企业
        - 快速导入历史合同的叙事，加上 Workday 生态相关性
        - 工作流心智份额的公开证据少于 Ironclad 或 Docusign
      - - LinkSquares
        - 分析驱动的中端市场 / 企业级挑战者
        - 官网显示 4.7 评分、300+ 条评价
        - 关注合同库问题和分析的法务、财务团队
        - 合同智能和受治理合同库叙事强
        - 工作流自动化通常被描述为成熟度低于 Ironclad
      - - SpotDraft
        - AI 原生工作流挑战者
        - 官网强调数周上线，并提供结构化协作界面
        - 需要更快合同流程、又不想承受完整存量厂商重量的成长型公司
        - 部署快、原生协作强，AI 融入日常工作流
        - 公开定价透明度低，高端企业深度的公开验证较少
      - - 内部自建 / 轻量工具
        - 现状替代方案
        - 既有 Microsoft、签署、CRM 和采购席位
        - 合同库或路由需求较窄、内部运营资源强的团队
        - 当打包 CLM 显得太重时，看起来更便宜、更可控
        - 缺少打包治理、审查指引、迁移和跨职能采用脚手架
    notes: 覆盖截至 2026-08-10 与 Ironclad 最相关的直接企业级群体、中端市场挑战者和现状替代路径；画像行总结公开定位，不代表真实私下赢率。
