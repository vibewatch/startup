  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 维度
      - 投资逻辑
      - 反向逻辑
      - 哪些证据会改变判断
    rows:
      - - 品类位置
        - Ironclad 是市场上最强的工作流优先 CLM 资产之一
        - 品类重叠在增加，AI 正在成为标配
        - 证明赢率可持续，并展示差异化 AI 附加
      - - 客户证据
        - 2,000+ 客户和强标杆案例显示真实采用
        - 案例研究经过筛选，无法证明队列经济性
        - 展示 NRR、GRR、队列续约和集中度数据
      - - 经济性
        - $200M+ ARR 意味着已有可观规模和企业 ACV
        - 定价不透明和服务负担可能掩盖较弱毛利质量
        - 展示毛利率拆分、服务组合和实际 ASP
      - - 估值支撑
        - 相比成熟文档软件可比公司享有溢价是合理的
        - 16x ARR 这个名义标记仍然很苛刻
        - 给出交易结构、折扣，或更好证明增长可持续
      - - 退出可选性
        - 规模和 AI 叙事创造未来 IPO 或战略选项价值
        - 当前披露质量低于公开市场准备度
        - 展示审计级报告节奏和盈利路径
      - - 风险韧性
        - 安全和生态宽度提供缓释杠杆
        - 工作流处在核心位置，事件或集成故障会很快伤害信任
        - 提供事件历史、正常运行时间指标和客户安全赢单 / 输单数据
    notes: 反向逻辑取决于价格和证据敏感度，并不是直接否定产品或市场品类。
