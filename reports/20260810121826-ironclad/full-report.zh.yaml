        blocks:
          - type: paragraph
            body: >-
              Ironclad 的公开里程碑显示，公司在 2022 年独角兽轮之后没有停下，而是持续拓宽合同技术栈。关于页面记录了一条路径：从 YC 启动和 Series A/B/C 扩张，到 DOCX 原生编辑架构、收购
              PactSafe、推出 Ironclad AI、AI Assist、原生 eSignature 和 Jurist。到 2025 年末和 2026 年中，公司谈得更少的是泛泛 CLM，更多的是合同智能、AI 代理和
              Microsoft Word 原生法务工作。这些里程碑重要，因为它们解释了为什么在品类成熟的情况下，ARR 增长和客户规模仍能继续爬升。负面一面较小但真实存在。TrustRadius
              和监测来源暗示，平台价值往往取决于有纪律的实施和流程设计；IsDown
              记录了不可忽视的历史故障，尽管官方状态页在抓取时显示正常可用。这不推翻增长论点，但意味着买方和投资人应尽调运营韧性和部署复杂度，而不能只依赖品类领导者品牌。
