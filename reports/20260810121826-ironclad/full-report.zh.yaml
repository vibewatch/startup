      - number: '4.2'
        title: 定价、TCO 与变现逻辑
        blocks:
          - type: paragraph
            body: >-
              所有留存定价来源都同意同一条第一原则：Ironclad 不公布公开价目表，买方通常只有进入销售周期后才知道真实数字。差异在估算区间和隐藏成本视角。Bind 的定价指南把许多部署框定在每年约 $30,000 到
              $150,000 以上，并另加实施费。Vendorbenchmark 更深入企业商业机制，描述平台费、用户类别、折扣带、价格上调条款，以及按公司规模大幅不同的付费区间。纳入
              Jurist、定制集成和全企业包装后，StackScored 与 UsagePricing
              进一步抬高上限。横跨这些来源，反复出现的模式是，表面订阅价低估第一年支出。实施服务、集成工作、培训，且往往还有专职内部管理员，都会进入真实预算。这很重要，因为定价不透明可能带来有吸引力的初始落地交易，同时仍掩盖净收入质量。商业上行是，Ironclad
              显然具备企业 ACV 潜力和多条 ARPU 扩张杠杆。下行是，投资人无法从公开证据看出，为拿下并留住这些账户，需要多少折扣、服务投入或 AI 支持成本。
