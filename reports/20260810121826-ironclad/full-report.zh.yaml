      - number: '5.2'
        title: 工作流架构与集成模式
        blocks:
          - type: paragraph
            body: >-
              公开文档里最清晰的架构主线，是 Ironclad 围绕工作流、记录和系统连接组织产品。开发者门户和帮助中心 API 文章都描述了在途合同的 workflow 端点、合同库中已完成协议的 record
              端点、实体同步，以及触发外部动作的 webhooks。这让 Ironclad 更像一层流程织网，而不是静态文档金库。同样逻辑也出现在集成层：官方和合作伙伴页面展示 Salesforce 同步、Slack
              通知、基于 Zapier 的无代码自动化、clickwrap 嵌入，以及广泛存储 / 文档系统连接。AppExchange 材料进一步把 Ironclad 定位为可围绕 Salesforce 对象、CPQ
              数据和多组织环境深度配置。重要技术读数是，Ironclad
              的护城河少来自秘密基础设施发明，更多来自应用型工作流模型、管理员界面，以及横跨业务技术栈的连接密度。这也意味着实施质量和集成治理是产品成功的核心，因为平台价值会随外部系统映射进合同流程的干净程度而升降。
