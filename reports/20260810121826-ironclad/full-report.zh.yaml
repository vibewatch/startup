  - id: TP003
    title: 定价 / 打包比较
    columns:
      - 厂商
      - 公开起价 / 估算年费
      - 打包信号
      - 典型实施信号
      - 可见性缺口 / 未知
      - 含义
    rows:
      - - Ironclad
        - 独立比较给出的估算区间为 $30K-$150K+
        - 以报价驱动的企业级 CLM，AI 和集成作为附加项
        - 视来源口径而定，最少 2-3 个月，或核心功能 4-8 周
        - 实际价格、折扣和附加购买率不公开
        - 定价偏高，但仍被定位为比最重型存量厂商更快、由工作流牵引的企业级部署
      - - Icertis
        - 估算年费门槛 $100K+ 至 $150K+
        - 报价驱动的企业级平台
        - 独立比较常见 6-12 个月
        - 精确定价和范围驱动因素公开不透明
        - 复杂度足以支撑重量和成本时最合适
      - - DocuSign CLM
        - 估算区间 $40K-$500K+
        - 更广泛 Docusign 生态内，CLM 和 eSignature 分开打包
        - 企业用例常见 3-6 个月
        - 实际捆绑经济性和折扣不公开
        - Docusign 生态引力已高时最合适
      - - Agiloft
        - 免费层 / 低端约 $6K+，企业级为定制估算
        - 按并发用户销售，并主打可配置无代码
        - 取决于范围，且往往服务较重
        - 企业级实际定价仍大多不透明
        - 可压低重型存量厂商价格，但仍需要认真搭建
      - - Leah / ContractPodAi
        - 比较来源显示起价约 $50K/年
        - 仅企业级，AI 智能体牵引的打包
        - 企业比较来源显示 3-6 个月
        - 独立验证密度低于老牌存量厂商
        - 智能体差异化伴随企业销售摩擦
      - - Sirion
        - 企业定制定价
        - 聚焦义务和采购结果的重型企业级 CLM
        - 比较来源显示 6-12 个月
        - 无公开标价
        - 预算适配取决于签后治理是否任务关键
      - - LinkSquares
        - 定制 / 本次留存集中未公开
        - 面向中端市场到企业级，由智能能力牵引的打包
        - 比较来源显示快于传统存量厂商，但并不完全透明
        - 精确席位和服务定价公开不可得
        - 合同库智能而非复杂路由驱动价值时最合适
      - - SpotDraft
        - 定制 / 本次留存集中未公开
        - 围绕速度和协作定位的 AI 原生 CLM
        - 官网口径为数周上线
        - 高端企业定价和实施经济性仍不公开
        - 当速度和易用性压过最深企业控制需求时，有机会赢单
      - - Concord / 轻量 CLM
        - 随方案不同，采用定制或更轻量打包
        - 更简单的一体化 CLM，内置签署
        - 比较来源显示偏向快速部署
        - 本次留存公开集中尚未确立精确企业经济性
        - 对直线流程可信，但较难满足复杂企业治理
      - - 内部自建
        - 使用既有席位，加上实施人力
        - 由签署、合同库、CRM 和工作流工具堆叠而成
        - 完全取决于内部资源和范围
        - 真实人力成本和治理负担因组织而异
        - 纸面上便宜，但常隐藏集成和管理员成本
    notes: 本表只比较公开或独立估算的标价 / 打包信号；它不是实际合同价，私下折扣或服务经济性仍是整个群体的重大尽调缺口。
