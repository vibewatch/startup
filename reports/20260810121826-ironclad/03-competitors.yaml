- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Risk / moat factor
  - Primary threat
  - Severity
  - Why it matters
  - Current read
  - Mitigation / diligence ask
  rows:
  - - AI feature commoditization
    - Every serious CLM vendor
    - High
    - AI review, extraction, and summarization are now common enough that they no longer define the category alone
    - Active compression of feature moat
    - Test grounded workflow outcomes and governance rather than counting AI features
  - - Post-signature governance gap
    - Sirion, Icertis, Workday/Evisort
    - High
    - Buyers with large obligation, procurement, or supplier-governance needs may prefer deeper portfolio control
    - Most important strategic gap above the workflow core
    - Request product proof and customer references for obligation-heavy deployments
  - - Extreme configurability gap
    - Agiloft
    - Medium-High
    - Unique workflows can tilt buyers toward platforms built for heavier no-code adaptation
    - Real but segment-specific
    - Compare admin tooling, configurability limits, and maintenance overhead
  - - Signature-ecosystem pull
    - DocuSign CLM
    - Medium
    - If Docusign already owns the signature event, upstream CLM expansion becomes easier to justify
    - Meaningful in DocuSign-centric accounts
    - Measure attach and replacement difficulty in Docusign-heavy customers
  - - Analytics-first repository challenge
    - LinkSquares
    - Medium
    - If the buyer mainly wants answers from executed contracts, workflow polish may matter less than intelligence speed
    - Most relevant below the largest enterprise tier
    - Track win/loss reasons where repository search was the buying trigger
  - - Lighter-tool substitution
    - SpotDraft, Concord, point solutions
    - Medium
    - Many buyers do not need the full overhead of classic enterprise CLM
    - Persistent down-market pressure
    - Segment pipeline carefully by contract volume and governance complexity
  - - Implementation burden and admin cost
    - Category-wide
    - High
    - Enterprise CLM economics are shaped as much by services, training, and admins as by license fees
    - Still a category-wide drag on adoption
    - Demand TCO and time-to-value proof from each vendor, including change-management burden
  - - Switching-cost erosion through migration services
    - Category-wide onboarding programs
    - Medium
    - Migration help lowers replacement friction over time even if core-system switching remains painful
    - Moat remains real but not permanent
    - Review churn, migration tooling, and implementation-failure rates across competitors
  notes: Severity is an underwriting judgment based on the retained 2026 source set; mitigation items are diligence asks rather than claims of internal performance.
  enumerationScope:
    coverage: exhaustive
    basis: 'Covers the main displacement and moat-erosion channels surfaced by the retained competitor, pricing, and trend sources: AI commoditization, ecosystem pull, governance depth, lighter substitutes, and implementation friction.'
