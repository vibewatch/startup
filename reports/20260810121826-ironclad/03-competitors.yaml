- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Vendor
  - Public entry / estimated annual price
  - Packaging signal
  - Typical implementation signal
  - Visibility gap / unknown
  - Implication
  rows:
  - - Ironclad
    - $30K-$150K+ estimate range in independent comparisons
    - Quote-led enterprise CLM with add-ons for AI and integrations
    - 2-3 months minimum to 4-8 weeks for core functionality depending on source lens
    - Realized pricing, discounts, and attach rates are private
    - Premium but still positioned as a faster workflow-led enterprise deployment than the heaviest incumbents
  - - Icertis
    - $100K+ to $150K+ estimated annual entry
    - Quote-led enterprise platform
    - 6-12 months common in independent comparisons
    - Exact pricing and scoping drivers are opaque publicly
    - Strongest fit when complexity justifies the weight and cost
  - - DocuSign CLM
    - $40K-$500K+ estimated range
    - Separate CLM and eSignature products inside the broader Docusign ecosystem
    - 3-6 months common for enterprise use cases
    - Realized bundle economics and discounting are not public
    - Best when Docusign ecosystem gravity is already high
  - - Agiloft
    - Free tier / ~$6K+ low end up to enterprise custom estimates
    - Concurrent-user and configurable no-code sale
    - Scope-dependent and often service-heavy
    - Enterprise realized pricing is still mostly opaque
    - Can undercut heavier incumbents but still requires serious setup
  - - Leah / ContractPodAi
    - Starts around $50K/year in comparison sources
    - Enterprise-only, AI-agent-led packaging
    - 3-6 months in enterprise-comparison sources
    - Independent verification density is thinner than for older incumbents
    - Agentic differentiation comes with enterprise sales friction
  - - Sirion
    - Custom enterprise pricing
    - Heavy enterprise CLM focused on obligations and procurement outcomes
    - 6-12 months in comparison sources
    - No public list pricing
    - Budget fit hinges on whether post-signature governance is mission-critical
  - - LinkSquares
    - Custom / not public in retained set
    - Mid-market-to-enterprise intelligence-led packaging
    - Faster than classic incumbents in comparison sources but not fully transparent
    - Exact seat and services pricing unavailable publicly
    - Works best where repository intelligence, not complex routing, drives value
  - - SpotDraft
    - Custom / not public in retained set
    - AI-native CLM positioned around speed and collaboration
    - Go live in weeks on official surface
    - Upper-enterprise pricing and implementation economics remain private
    - Can win deals where speed and ease outweigh deepest enterprise control requirements
  - - Concord / lighter CLM
    - Custom or lighter-weight packaging depending on plan
    - Simpler all-in-one CLM with built-in signature
    - Fast deployment orientation in comparison sources
    - Exact enterprise economics not established in retained public set
    - Credible for straightforward processes but less likely to satisfy complex enterprise governance
  - - Internal build
    - Uses existing seats plus implementation labor
    - Stacked from signature, repository, CRM, and workflow tools
    - Depends entirely on internal resources and scope
    - True labor cost and governance burden are organization-specific
    - Looks cheap on paper but often hides integration and admin cost
  notes: This table compares public or independently estimated list/packaging signals only; it is not realized contract pricing, and private discounts or services economics remain a major diligence gap across the cohort.
