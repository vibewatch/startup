  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: segment-level competitive win rates
    missingEvidence: Actual Ironclad win/loss rates against Icertis, DocuSign CLM, Sirion, Agiloft, and LinkSquares by segment and contract volume.
    whyItMatters: A strategy view of the landscape is useful, but valuation underwriting needs evidence on which rivals actually block expansion or drive churn.
    diligencePath: Request CRM-coded win/loss data, displacement reasons, and competitor overlap by revenue-led, procurement-led, and legal-led deployments.
    relatedQuestionRefs:
    - QP027
    relatedTableRefs:
    - TP001
    - TP004
  - type: missing-source
    severity: material
    topic: realized pricing and services economics
    missingEvidence: Net pricing, multi-year discounting, and implementation-services mix across the retained enterprise CLM vendors.
    whyItMatters: Public list or estimate ranges are too rough to model pricing power, displacement risk, or TCO precisely.
    diligencePath: Collect recent customer contracts, implementation SOWs, and procurement benchmarks from at least three enterprise deals per vendor.
    relatedQuestionRefs:
    - QP028
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: minor
    topic: customer adoption proof by competitor class
    missingEvidence: Comparable public metrics for business-user adoption, self-service penetration, and active-seat usage across Ironclad and peers.
    whyItMatters: Adoption is central to the workflow-first thesis, but most vendors publish anecdotes rather than normalized operating metrics.
    diligencePath: Ask each vendor for self-service initiation rates, time-to-first-value, and admin effort per 100 active business users.
    relatedQuestionRefs:
