tables:
- id: TP001
  title: Competitor profile table
  columns:
  - Competitor
  - Class
  - Scale / traction signal
  - Target segment
  - Differentiation
  - Limitation
  rows:
  - - Ironclad
    - Workflow-first enterprise CLM
    - 2,000+ customers and $200M+ ARR disclosed publicly
    - Enterprise legal, sales, procurement, and ops teams
    - Strong workflow automation, requester UX, AI review, and Salesforce-linked contracting
    - Less differentiated on post-signature governance depth than the heaviest incumbents
  - - Icertis
    - Enterprise incumbent
    - Global Fortune 500 positioning and enterprise benchmark status in comparison sources
    - Large regulated and global enterprises
    - Deepest contract intelligence, analytics, obligation management, and global enterprise reach
    - Expensive and complex enough to be overkill for many mid-market deployments
  - - DocuSign CLM
    - Incumbent ecosystem platform
    - 2,200 enterprises trust CLM on official surface
    - Organizations already standardized on DocuSign and enterprise agreement workflows
    - Signature adjacency, broad integration ecosystem, and strong brand trust
    - Separate product packaging and weaker best-of-breed workflow depth versus top specialists
  - - Agiloft
    - Configurable CLM platform
    - Official retention and implementation-satisfaction signals plus broad integration story
    - Buyers with unusual workflows and admin willingness
    - Deep no-code configurability and data-first architecture
    - Setup burden and UI tradeoffs can be meaningful
  - - Leah / ContractPodAi
    - Agentic enterprise CLM
    - Enterprise-only packaging and Gartner/IDC positioning in comparison sources
    - Legal, procurement, and finance teams prioritizing AI agents
    - Strongest public push on agentic automation from intake to renewal
    - Lower brand clarity after rebrand and less independent proof density than the largest incumbents
  - - Sirion
    - Procurement- and post-signature-heavy enterprise CLM
    - Trusted in 70+ countries with strong obligation signals
    - Large procurement, outsourcing, and supplier-governance organizations
    - Best public post-signature and obligation-governance story in retained set
    - Heavier enterprise readiness and longer deployments can limit fit
  - - Workday CLM / Evisort
    - AI extraction and enterprise repository challenger
    - Fast deployment and large-scale analysis metrics on official page
    - Enterprises needing rapid repository intelligence and governed AI
    - Fast legacy-ingest story plus Workday ecosystem relevance
    - Less public evidence of workflow mindshare than Ironclad or Docusign
  - - LinkSquares
    - Analytics-led mid-market / enterprise challenger
    - 4.7 rating with 300+ reviews on official page
    - Legal and finance teams focused on repository questions and analytics
    - Strong contract intelligence and governed repository narrative
    - Workflow automation is usually described as less mature than Ironclad
  - - SpotDraft
    - AI-native workflow challenger
    - Official go-live-in-weeks message and structured collaboration surfaces
    - Growth companies needing faster contracting without full incumbent weight
    - Fast deployment, native collaboration, and AI integrated into day-to-day workflows
    - Public pricing transparency is low and upper-enterprise depth is less proven publicly
  - - Internal build / lighter tools
    - Status quo substitute
    - Existing Microsoft, signature, CRM, and procurement seats
    - Teams with narrow repository or routing needs and strong internal ops resources
    - Can look cheaper and more controllable when packaged CLM feels heavy
    - Lacks packaged governance, playbook, migration, and cross-functional adoption scaffolding
  notes: Covers the direct enterprise cohort, mid-market challengers, and status-quo substitute path most relevant to Ironclad on 2026-08-10; profile rows summarize public positioning, not actual private win rates.
