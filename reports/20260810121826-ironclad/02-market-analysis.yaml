chapter:
  number: 2
  title: Market Analysis
  summary: 'Ironclad operates in a real and expanding CLM category, but the market has to be bounded carefully. Retained sources support double-digit growth, a cross-functional buyer base spanning legal, procurement, sales, IT, and compliance, and near-universal AI experimentation in CLM. The more important insight is that optimization, trust, and implementation maturity still lag adoption: CLM budgets are real, but value accrues unevenly to vendors that combine integration depth, governance credibility, and usable AI.'
sections:
- id: market-boundary-and-buyer-problem
  title: Market boundary, included spend, and the buyer problem
  body: 'The most important market-analysis step for Ironclad is defining CLM tightly enough that the category remains investable rather than collapsing into every legal or e-sign workflow. MGI’s definition is the cleanest retained boundary: contract lifecycle management covers the processes and data associated with an agreement from creation through renewal and closure. For an Ironclad-style platform, that naturally includes drafting, negotiation, approvals, execution, repository, analytics, and workflow automation across legal, procurement, sales, and compliance. It does not mean every adjacent tool belongs inside the same spend bucket. Embedded e-sign, document storage, or standalone legal AI research can be adjacent and strategically relevant without being the same market. That boundary logic matters because Ironclad is selling a cross-functional system of record for agreements, not merely a signature utility. The buyer problem is likewise broader than “legal needs a faster contract
    tool”: enterprises want self-service, lower cycle times, better control, and contract data that can inform operational decisions across departments. That distinction is strategically important for Ironclad because budget justification often comes from multiple functions at once; the more agreement data touches revenue, procurement, and compliance outcomes, the easier it is for a CLM platform to defend enterprise-level pricing and to avoid being treated as a narrow legal expense.'
