  evidenceGaps:
  - type: missing-source
    severity: material
    topic: ironclad-specific sam-som
    missingEvidence: A management-quality segmentation of Ironclad’s addressable market by company size, geography, and workflow complexity.
    whyItMatters: Late-stage valuation underwriting needs a reachable-market model, not only broad TAM rhetoric.
    diligencePath: Request segment-level pipeline, customer distribution, and win-rate data by legal-only, procurement, and sales-led deployments.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM002
    - TM006
  - type: conflicting-data
    severity: material
    topic: one canonical clm tam
    missingEvidence: A reconciled internal methodology explaining why MGI and BRI market-size estimates differ and which lens is most relevant for Ironclad.
    whyItMatters: Using one external number without boundary reconciliation would overstate precision and could skew valuation multiples.
    diligencePath: Normalize all public market reports to a common included-spend definition before using them in the investment model.
    relatedQuestionRefs:
    - QM026
    relatedTableRefs:
    - TM002
    - TM006
  - type: missing-source
    severity: minor
    topic: benchmark methodology transparency
    missingEvidence: Full sample-size and segmentation methodology for the public benchmark summaries retained from Ironclad and competitor reports.
    whyItMatters: Benchmark headlines are directionally useful, but investor confidence rises when methodology is transparent.
    diligencePath: Request methodology appendices or downloadable full reports from vendors.
    relatedQuestionRefs:
    - QM023
    relatedTableRefs:
    - TM005
    - TM006
