- id: sizing-lenses-segments-and-adoption
  title: Sizing lenses, segments, and adoption momentum
  body: 'Public market sizing for CLM is directionally strong but methodologically mixed. MGI’s more enterprise-oriented lens estimates nearly $8.1 billion of 2026 cloud CLM spend among publicly traded companies and an 18% CAGR, while Business Research Insights offers a broader global-software estimate of $2.95 billion in 2026 growing to $7.97 billion by 2035. The difference is not a contradiction so much as a reminder that market definitions vary by company universe and included spend. Either way, both lenses support double-digit category growth. Segment detail adds more conviction. MGI says the United States alone represents over 30% of the TAM, software and IT-heavy industries are the biggest spenders, and smaller companies are actually increasing spend faster than the largest enterprises. On the adoption side, the Conga and Icertis reports show that AI is no longer experimental at the category level: use is widespread, but optimization and trust lag. That combination supports a meaningful
    market with active budget owner interest, while also explaining why buyer education and implementation discipline still matter. For valuation work, the key lesson is that raw TAM numbers are only half the story; the more useful market signal is whether enterprises are already budgeting for AI-enabled contracting even as they remain selective about rollout depth, governance, and measurable ROI.'
