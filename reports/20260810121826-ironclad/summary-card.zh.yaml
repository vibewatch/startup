  topStrengths:
    - 2,000+ 客户和强具名大型企业案例，显示真实的跨职能采用。
    - 以工作流为核心的产品宽度，以及强 Salesforce / 集成叙事，形成耐久平台价值。
    - Ironclad AI 和 Jurist 为 ARPU、客户粘性和品类相关性提供可信上行空间。
    - 顶级历史融资和 $200M+ ARR 显示出规模化后期软件公司的质量。
  topRisks:
    - AI 商品化风险真实存在，DocuSign、Icertis、Agiloft 等公司都在营销类似主题。
    - 相对成熟公开工作流 / 文档软件倍数，最后公开的 $3.2B 估值锚偏满。
    - 企业销售周期长、实施复杂，会压住增长效率和利润率质量。
    - 公开披露不足以判断 NRR、流失、客户集中度和 term-sheet 结构。
  unresolvedGaps:
    - 当前 NRR、GRR、logo 流失，以及头部账户集中度。
