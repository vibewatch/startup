company:
  name: Ironclad
chapter:
  number: 1
  title: Company Overview
  summary: Ironclad is now best understood as a scaled AI-contracting platform rather than only a 2022 unicorn-era CLM story. Current official and independent sources support 2014 founding by Jason Boehmig and Cai GoGwilt in San Francisco, a 2025 leadership handoff to CEO Dan Springer, $333 million of disclosed lifetime funding with the latest public valuation anchor at $3.2 billion, more than 2,000 customers, over 2 billion contracts processed, and a 2026 ARR milestone above $200 million. The main diligence caveats are governance opacity, lack of a clean public headcount number, and non-trivial implementation or reliability signals from monitoring and review sources.
sections:
- id: identity-platform-and-scale
  title: Identity, platform scope, and current scale
  body: 'Ironclad’s current public identity is broader than a narrow legal-workflow point tool. The homepage, AI product page, customer stories, and Salesforce listing all position the company as the system that lets legal, procurement, sales, and business teams create, negotiate, approve, sign, store, and analyze agreements in one workflow layer. That claim is supported by integration evidence: Ironclad highlights CRM, e-signature, document, messaging, procurement, and compliance connections rather than a closed legal repository. The scale markers are also materially stronger in 2026 than the 2022 unicorn narrative most investors still remember. Current official materials now converge around 2,000-plus customers and more than two billion contracts processed, while the ARR announcement shows the company has crossed the $200 million threshold. The result is a clear chapter-one conclusion: Ironclad should be treated as a scaled late-stage enterprise software company in CLM, even though several
    operating details such as headcount and ownership remain private.'
