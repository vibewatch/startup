- id: capital-base-and-stakeholder-map
  title: Capital history, valuation, and stakeholder map
  body: 'Ironclad’s financing history is unusually legible for a private legal-tech platform. The January 2021 Series D established the company as a near-unicorn with $100 million of new capital, BOND as lead, Lux Capital as a new investor, and returning support from Accel, Sequoia, YC Continuity, and Emergence. One year later, the January 2022 Series E added another $150 million, lifted total disclosed funding to $333 million, and introduced Franklin Templeton as lead while largely preserving the insider-heavy investor base. Independent coverage pegged that round at a $3.2 billion valuation, which remains the strongest retained public valuation anchor. What is missing is just as important as what is present: the 2026 newsroom and press-release trail contains no newer public financing announcement, and current public materials still do not expose ownership percentages, board seats beyond historical observer notes, or liquidation terms. That makes Ironclad well-capitalized and clearly growth-stage,
    but still economically opaque in the way many late-stage private software companies are.'
