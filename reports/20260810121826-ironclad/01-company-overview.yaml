  evidenceGaps:
  - type: missing-source
    severity: material
    topic: leadership and founder table completeness
    missingEvidence: A current executive-committee roster and board register showing every named officer, director, observer, and committee assignment.
    whyItMatters: Public sources confirm the CEO transition and some senior hires, but not the complete governance or leadership map needed for control and succession diligence.
    diligencePath: Request the latest board deck cover page, leadership org chart, and investor-rights summary from the company data room.
    relatedQuestionRefs:
    - QO018
    - QO026
    relatedTableRefs:
    - TO002
  - type: missing-source
    severity: material
    topic: stakeholder or investor map completeness
    missingEvidence: A current capitalization table with ownership percentages, liquidation preferences, board rights, and any secondary-sale history since Series E.
    whyItMatters: Late-stage private valuation risk cannot be fully judged from round headlines alone if control rights and dilution are opaque.
    diligencePath: Request the current cap table, financing documents, and board-consent package covering the post-Series-E period.
    relatedQuestionRefs:
    - QO018
    - QO026
    - QO027
    relatedTableRefs:
    - TO003
  - type: missing-source
    severity: minor
    topic: milestone table completeness
    missingEvidence: Exact dates and counterparties for older Series A/B/C events and certain product launches that the current history page summarizes only at the year level.
    whyItMatters: The chronology is directionally clear, but investors using milestone cadence as an execution proxy would want the precise archived announcements.
    diligencePath: Pull archived press releases or investor posts for pre-2021 financings and early launch events.
    relatedQuestionRefs:
    - QO015
    - QO024
    relatedTableRefs:
    - TO004
  - type: missing-source
    severity: material
    topic: current headcount
    missingEvidence: A dated 2025 or 2026 public or management-provided employee-count disclosure.
    whyItMatters: Headcount is a useful proxy for burn, execution capacity, and whether the company scaled efficiently after its 2022 valuation step-up.
    diligencePath: Request current HR headcount by function and geography, or a board deck KPI page covering workforce scale.
