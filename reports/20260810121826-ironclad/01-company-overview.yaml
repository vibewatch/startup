- id: milestones-ai-expansion-and-operating-caveats
  title: Milestones, AI expansion, and operating caveats
  body: Ironclad’s public milestone trail shows a company that kept widening the contract stack instead of standing still after the 2022 unicorn round. The about-page history records a path from YC launch and Series A/B/C expansion into a DOCX-native editing architecture, PactSafe acquisition, Ironclad AI, AI Assist, native eSignature, and Jurist. By late 2025 and mid-2026, the company was talking less about generic CLM and more about contract intelligence, AI agents, and Microsoft Word-native legal work. Those milestones matter because they explain why ARR growth and customer scale kept climbing despite category maturity. The adverse side is smaller but real. TrustRadius and monitoring sources imply that the platform’s value often depends on disciplined implementation and process design, while IsDown records a non-trivial history of incidents even though the official status page showed healthy uptime at fetch time. This does not overturn the growth case, but it does mean buyers and investors
    should diligence operating resilience and deployment complexity rather than relying only on category-leader branding.
