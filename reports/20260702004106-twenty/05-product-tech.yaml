  - type: missing-source
    severity: material
    topic: public-performance-metrics
    missingEvidence: Benchmark results, uptime or safety statistics, and any validated false-positive or mission-success metrics.
    whyItMatters: Without performance evidence, investors cannot separate compelling narrative from reproducible operational advantage.
    diligencePath: Ask for benchmark decks, pilot acceptance criteria, and after-action metrics from customer evaluations.
