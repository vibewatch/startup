- id: TE003
  title: Technology / Operating Architecture Table
  columns:
  - Layer / Component
  - Role
  - Dependency
  - Risk
  rows:
  - - Ingestion and ETL pipelines
    - Normalize threat intelligence, logs, and operational data
    - Access to diverse intelligence feeds and secure storage
    - Poor data quality or inconsistent tagging can degrade downstream agent decisions
  - - Graph / relationship analysis
    - Model links among assets, behaviors, and attack paths
    - Graph-query capability and schema discipline
    - Opaque scoring could create automation bias for operators
  - - Agent orchestration layer
    - Coordinate specialized AI or automation workers across mission stages
    - Model access, task routing, and safe execution controls
    - No public disclosure of orchestration framework or guardrails
  - - Containerized execution substrate
    - Run offensive tools securely and repeatably
    - Docker or Kubernetes plus secure secrets management
    - Classified-environment portability is unproven publicly
  - - Operator review interface
    - Surface candidate actions to humans for judgment
    - Auditability and low-latency collaboration with mission teams
    - Approval logging, rollback, and override mechanisms are not disclosed
  - - Forward-deployed integration
    - Adapt the system to customer mission context and secure environments
    - Cleared staff and on-site access
    - Scaling may be constrained by availability of trusted labor
  notes: Architecture is inferred mainly from hiring requirements and public descriptions of workflows rather than from a public system diagram.
