    - Unknown portability into air-gapped or sovereign environments
  - - Program sponsor / government buyer
    - Labor-heavy services contracts with bespoke tooling
    - Software-first capability paired with embedded integration support
    - Potentially better scaling than pure services
    - Revenue mix between software and services is not disclosed
