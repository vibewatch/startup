  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Probability signal
  - Key assumptions
  - Valuation view
  - What changes the case
  rows:
  - - Bull
    - ~25%
    - Program-of-record adoption, repeatable allied demand, strong compliance posture, defensible workflow moat
    - '>$1.5B and potentially materially higher'
    - Show recurring multi-program software revenue and strong eval evidence
  - - Base
    - ~45%
    - Real but narrow government traction expands steadily; software and services remain mixed
    - ~$0.8B-$1.3B
    - Show renewals, margins, and concentration under control
  - - Bear
    - ~30%
    - Category stays hot but contracts remain bespoke, compliance frictions rise, or incumbents crowd out the wedge
    - <$0.8B / down-round risk
    - Evidence of weak moat, weak governance, or stalled conversion from pilots to repeatable programs
  notes: Probabilities and ranges are the author's estimates because public disclosures do not support a conventional revenue-multiple model.
