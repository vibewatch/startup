- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Status
  - Public value signal
  - Why it matters
  - Limitation
  rows:
  - - Twenty
    - Series B (Jun 2026)
    - ${1.0B} valuation on ${138M} total funding
    - Reference point under review
    - No public revenue or margin disclosure
  - - Dream
    - Series B (Feb 2025)
    - ${1.1B} valuation with >${130M} annual sales in 2024
    - Shows sovereign cyber can support unicorn pricing with revenue proof
    - Founder history creates separate governance discount
  - - Dream
    - Growth round (Jun 2026)
    - ${3.0B} valuation with six-country government traction
    - Shows category investors pay up for national-cyber platforms
    - Much more disclosed revenue than Twenty
  - - Helsing
    - Series D / market signal
    - ~${13.8B} valuation and large European program traction
    - Demonstrates defense-AI scarcity premium at scale
    - Different geography, hardware mix, and maturity
  - - Anduril signal
    - Defense-tech benchmark
    - $1B revenue in 2024; 40-45% gross margins cited in defense-tech analysis
    - Shows what a successful defense software-plus-systems company can look like
    - No direct valuation figure in reviewed source set
  - - Horizon3 / XBOW
    - Autonomous security automation
    - 5,200 customers, 225k pentests, and rapid AI pentest scaling
    - Sets the speed of commercial autonomous-security competition
    - Enterprise-security economics differ from offensive mission software
  notes: 'Coverage is partial and intentionally mixed: the comparable set is meant to frame strategic scarcity, revenue proof, and governance discounts rather than claim a precise multiple.'
  enumerationScope:
    coverage: partial
    basis: Rows include the most relevant public private-market and adjacent-market reference points available in the reviewed source set; several lack fully comparable financial disclosure or business-model match.
