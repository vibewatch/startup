- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Dimension
  - Bull thesis
  - Bear anti-thesis
  rows:
  - - Category
    - Few startups openly target offensive cyber workflows for government users
    - The category can attract backlash, policy reversals, or narrow buyer pools
  - - Demand
    - USCYBERCOM AI roadmap and budgets support durable need
    - Demand may stay real but fragmented, slow, and procurement-bound
  - - Product
    - Agentic orchestration could compress weeks of operator effort into reusable software
    - Autonomous tooling may commoditize lower-end tasks and require heavy human services anyway
  - - Market position
    - Scarcity plus investor quality can confer early leadership
    - Large primes and mission platforms can subsume the most valuable layer
  - - Valuation
    - A strategic wedge can deserve a unicorn mark before full disclosure
    - A $1B mark with no public revenue or margin data can still be ahead of reality
  - - Exit
    - Potential to become a critical mission layer or strategic target
    - Opaque economics can cap exit options or lead to down-round risk
  notes: The deciding evidence is revenue quality, software leverage, and governance maturity, all of which remain mostly private.
