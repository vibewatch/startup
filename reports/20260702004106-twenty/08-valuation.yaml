  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: revenue-quality
    missingEvidence: Current revenue run rate, software-versus-services mix, backlog, renewals, and margin profile by program.
    whyItMatters: Without this, the announced unicorn valuation cannot be tested on conventional software or contractor economics.
    diligencePath: Request a finance-room package and customer-reference readout before underwriting a premium price.
    relatedQuestionRefs:
    - QV010
    - QV028
    - QV029
    - QV031
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Program, sponsor, and authority concentration plus any exposure to single-command budgets or pilots.
    whyItMatters: The biggest downside is a narrow book of business being mistaken for a durable platform.
    diligencePath: Request cohort-level pipeline, backlog, and concentration analysis by customer and program.
    relatedQuestionRefs:
    - QV009
    - QV022
    - QV029
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: governance-readiness
    missingEvidence: CMMC, NIST, export-control, incident-response, and mission-authority controls evidence.
    whyItMatters: Strategic scarcity can justify a premium only if the company can scale safely inside government and rights-sensitive constraints.
    diligencePath: Ask legal and security diligence teams to review the company's operating guardrails and certifications.
    relatedQuestionRefs:
    - QV010
    - QV028
    - QV029
    - QV030
  - type: private-evidence-only
    severity: material
    topic: product-moat
    missingEvidence: Eval results, replacement risk versus primes, and evidence of reusable workflow ownership across commands.
    whyItMatters: The valuation rests on owning a durable layer, not simply participating in a hot category.
    diligencePath: Run technical diligence with mission customers and compare the product against adjacent primes and autonomous-security tools.
    relatedQuestionRefs:
    - QV014
    - QV020
    - QV026
    relatedTableRefs:
    - TV004
  - type: private-evidence-only
    severity: minor
    topic: capital-structure
    missingEvidence: Preference stack, liquidation rights, option pool expansion, and future capital needs.
    whyItMatters: Headline valuation can diverge materially from true entry economics in late-stage defense-tech rounds.
    diligencePath: Review the full cap table and financing documents with counsel.
    relatedQuestionRefs:
    - QV029
