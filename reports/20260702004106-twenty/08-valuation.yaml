- id: recommendation-and-entry-discipline
  title: Recommendation, Confidence, and Entry Discipline
  body: 'We rate Twenty track with medium confidence, high risk, and a stretched valuation stance that can move toward fair only if non-public diligence closes the largest gaps. The company clearly matters: Accel led the Series B, In-Q-Tel backed earlier, and multiple sources describe real government demand. Yet the public evidence is still too thin to justify a clean buy call at the announced unicorn mark. There is no disclosed revenue run-rate, no customer-count disclosure, no public renewal data, no gross-margin profile, and no evidence that today''s traction already resembles a broad, repeatable software franchise. Entry discipline should therefore start from the assumption that $1 billion prices in substantial future program conversion, not present-day transparency. A premium entry is only rational if management can demonstrate that contract traction is expanding into multi-program recurring software revenue with defendable controls, not merely bespoke offensive-cyber services wrapped
    in AI language.'
  claimRefs:
  - CV001
  - CV005
  - CV006
  - CV007
  - CV008
  - CV009
  - CV014
  - CV015
  - CV016
  tableRefs:
