- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - Contract concentration shock
    - One or two programs dominate revenue more than expected
    - Turns scarcity into procurement fragility
    - Re-rate toward bear case
  - - Compliance weakness
    - CMMC/NIST/export-governance evidence is weak or delayed
    - Raises cost of scale and legal risk
    - Avoid premium entry
  - - Software-leverage miss
    - Business is mostly bespoke labor rather than reusable platform
    - Crushes margin and multiple potential
    - Treat as services-style contractor
  - - Moat compression
    - Primes or autonomous-security vendors close workflow gap quickly
    - Reduces category scarcity premium
    - Lower valuation ceiling
  - - Policy backlash
    - A rights, oversight, or authority controversy hits the sector
    - Shrinks buyer appetite and political support
    - Re-underwrite category exposure
  notes: The triggers focus on milestone and governance events because public financial disclosure is still too sparse for conventional covenant-style monitoring.
  claimRefs:
  - CV010
  - CV014
  - CV030
  - CV036
  - CV037
  - CV038
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Revenue quality
    - Current ARR or contract run rate, backlog, renewals, and services/software mix
    - Determines whether $1B reflects a platform or a speculative wedge
    - Company finance + customer diligence
  - - Customer concentration
    - Top-program and top-customer exposure by sponsor and authority
    - Shows whether budget shifts can break the thesis
    - Company finance + government-contract expert
  - - Margin profile
    - Gross-margin bridge by product, services, and deployment model
    - Tests whether software leverage exists
    - Company finance + operating partner
  - - Compliance posture
    - CMMC, NIST, SSP/POA&M, export-screening, and incident controls package
    - High-risk mission software needs unusually strong governance
    - Security/compliance diligence
  - - Product moat
    - Eval results, operator metrics, win/loss data, and replacement risk versus primes
    - Shows whether scarcity is durable or temporary
    - Technical diligence + customer references
  - - Capital structure
    - Preferences, liquidation rights, employee dilution, and future financing needs
    - Affects real entry economics beyond headline valuation
    - Legal + cap-table diligence
  notes: These are the minimum diligence asks required to move from a track stance to an underwritten buy stance.
