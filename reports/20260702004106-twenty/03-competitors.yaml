  - type: private-evidence-only
    severity: material
    topic: classified-pricing
    missingEvidence: Public contract values, renewal terms, and deployment counts for Twenty and most national-security peers.
    whyItMatters: Without pricing and renewal detail, it is hard to separate genuine moat from a one-time procurement headline.
    diligencePath: Request customer-by-customer pipeline, ASP, contract type, and renewal or expansion evidence under NDA.
  - type: private-evidence-only
    severity: material
    topic: customer-proof
    missingEvidence: Named reference accounts showing that offensive-mission users renewed, expanded, or standardized on Twenty after initial deployment.
    whyItMatters: Competitive durability depends on repeatability, not just initial logos or funding rounds.
    diligencePath: Ask for at least two renewal case studies with mission owner, deployment scope, and displacement of alternatives.
  - type: missing-source
    severity: minor
    topic: open-source-transition
    missingEvidence: Clear public evidence on how quickly AIxCC open-source systems are moving from challenge results into production defense or IC environments.
    whyItMatters: Open-source crowd-out risk is real, but timing matters for how urgent the threat is to Twenty’s moat.
    diligencePath: Track follow-on transitions, integrator announcements, and government deployment references over the next 6-12 months.
