- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Competitor class
  - Price / unit / contract model
  - Included capabilities
  - Discounts / unknowns
  - Implication
  rows:
  - - Twenty
    - No public list price; likely contract or mission-package based
    - AI-enabled offensive workflow software plus controlled deployment and mission alignment
    - Exact contract values and deployment scope undisclosed
    - Pricing opacity means buyers evaluate on mission value and trust rather than sticker cost
  - - Booz / Palantir / Anduril
    - Program, integration, or hardware-software stack contracts
    - Mission software, interoperability, cyber/RF effects, zero trust, deployable compute
    - Public releases do not disclose unit economics
    - Can bundle cyber into larger funded programs
  - - CrowdStrike + Google
    - Platform plus managed-service packaging
    - EDR, ITDR, exposure management, SecOps, MDR/IR support
    - National-security bespoke pricing not public
    - Adjacent buyers may prefer existing cloud-security relationships
  - - Horizon3 / XBow class
    - Recurring software or on-demand autonomous testing model
    - Autonomous attack simulation, exploit validation, proof-of-work findings
    - Public sources highlight outcomes more than exact federal pricing
    - Compresses lower-end offensive workflow economics and turnaround time
  - - Dream / sovereign platform
    - Nation-scale or government contract model
    - Air-gapped national cyber resilience and sovereign AI stack
    - Exact contract sizes not public
    - Competes for large government platform budgets, not just tool budgets
  - - Open-source CRSs / internal build
    - No license fee but real integration and maintenance cost
    - Vulnerability discovery, patch generation, and related automation
    - Cost shifts into engineering, security review, and ops burden
    - Raises build-versus-buy pressure on proprietary engine layers
  notes: Public price transparency is extremely weak across the national-security portion of the landscape. Contract model and procurement fit matter more than advertised list price.
