- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Elite-operator workflow knowledge
    - Generic agentic AI automates more of recon, exploit validation, and patch reasoning
    - High
    - Test how much of Twenty’s product still depends on proprietary mission context and review workflows
  - - Cleared-customer trust
    - Primes or direct AI-vendor awards meet buyers inside existing procurement channels
    - High
    - Measure pipeline share won through direct sponsor pull rather than reseller or prime attachment
  - - End-to-end offensive lifecycle integration
    - Buyers stitch together foundation models, open CRSs, and incumbent integrators
    - High
    - Ask for concrete examples where integrated workflow beat best-of-breed assembly
  - - Specialist offensive brand
    - Spyware-style backlash or offensive-policy scrutiny taints the category
    - Medium
    - Review governance, human-control, and use-policy guardrails customer by customer
  - - First-mover fundraising and traction
    - Dream, Helsing, and larger defense-tech stacks create bigger capital pools and louder sovereignty narratives
    - Medium
    - Track whether Twenty can win where sovereignty or prime-scale positioning dominates
  - - Proprietary autonomy engine
    - AIxCC open-sources key cyber-reasoning capabilities
    - High
    - Separate what is truly proprietary from what is becoming public infrastructure
  - - Procurement agility
    - Hardware-integrated or cloud-security incumbents package cyber within larger funded programs
    - High
    - Assess average sales cycle and share of wins where Twenty displaced a prime or incumbent stack
  notes: 'The highest-severity threats are not stylistic. They are structural: open-source crowd-out, direct procurement substitution, and category-level policy backlash.'
