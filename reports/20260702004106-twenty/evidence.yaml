evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Board roster, voting-control structure, and any investor governance rights.
    whyItMatters: >-
      Offensive-cyber companies face unusual oversight expectations, and governance visibility is needed to judge
      decision authority.
    diligencePath: Request the current board deck, cap table rights summary, and any committee structure memo.
    relatedQuestionRefs:
      - QO007
      - QO025
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: scale-metrics
    missingEvidence: Exact employee count, customer count, and current major customer list.
    whyItMatters: >-
      The company has unicorn financing but does not publish enough scale data to judge concentration or operating
      maturity.
    diligencePath: Request the latest KPI pack covering headcount, major programs, customer count, and org chart by location.
    relatedQuestionRefs:
      - QO016
      - QO017
      - QO024
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: contract-detail
    missingEvidence: Award periods, option years, renewal status, and delivery scope for the USCYBERCOM and Navy work.
    whyItMatters: >-
      Contract proof exists, but underwriting quality depends on contract duration, repeatability, and margins, not just
      award headlines.
    diligencePath: Request contract abstracts or contracting-officer summaries for each named award.
    relatedQuestionRefs:
      - QO013
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: minor
    topic: capital-stack
