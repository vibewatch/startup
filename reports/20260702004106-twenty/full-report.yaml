  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition in mission workflow terms
        blocks:
          - type: paragraph
            body: >-
              Twenty’s public materials consistently frame the company as a mission software provider for U.S. and
              allied offensive cyber operators, not as a general-purpose enterprise security vendor. The offering is
              described as industrial-scale software that compresses work that once took weeks of manual operator effort
              into automated, continuous workflows across hundreds of targets. That positioning matters because it
              clarifies the product’s job to be done: help government cyber teams move faster from target understanding
              to courses of action, while preserving human judgment over consequential decisions.


              The public record does not expose a clean SKU sheet, but it does expose the operating model. Company copy,
              launch coverage, and engineering roles collectively point to a capability bundle that includes target
              mapping, attack-path development, payload or adversary-emulation tooling, data enrichment, operator
              review, and mission deployment support. That is more specific than a generic “AI for cyber” pitch, yet
              still much less transparent than commercial autonomous-pentest platforms that publish named modules, usage
              statistics, or product docs. For diligence purposes, the strongest conclusion is that Twenty is selling a
              mission workflow platform for offensive cyber operations, with the exact boundaries between software
              product, forward-deployed integration, and advisory support still only partially disclosed.
