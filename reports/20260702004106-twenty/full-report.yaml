              useful proxy that the company is scaling organizationally even if it is not publishing employee totals.


              The scale gaps are equally important. Virginia Business said the company had not publicly disclosed
              revenue, employee count, or customer count after the unicorn round, and the company-owned pages still do
              not publish customer logos, contract durations, or public balance-sheet numbers. Lawfare's oversight
              critique adds a separate adverse layer: private offensive-cyber vendors can sit in a gray zone between
              venture-speed product development and slower-moving public accountability structures. Put together, the
              record supports real momentum, but it does not yet support a fully underwritten view of commercial scale
              or governance maturity.
