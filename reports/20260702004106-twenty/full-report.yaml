      - number: '8.3'
        title: Financing Context and Comparable Lens
        blocks:
          - type: paragraph
            body: >-
              Twenty's financing context is unusually early for a unicorn, but not absurd in today's defense-AI market.
              Dream reached a $1.1 billion valuation with more than $130 million in annual sales and later moved to a
              reported $3 billion with six-country government demand; Helsing reached roughly $13.8 billion after
              securing major European defense programs and a far larger funding base; Anduril and Palantir-adjacent
              partnerships show the value of owning mission software inside larger warfighting stacks. Against that
              backdrop, Twenty's $1 billion mark reads as a strategic-option valuation rather than a disclosed-multiple
              valuation. It is higher risk than Dream's early unicorn mark because the public file shows less revenue
              proof, but lower-conviction skeptics should note that the market is now willing to pay large premia for
              sovereign cyber and AI infrastructure before public-company style disclosure exists. The right comparable
              set therefore does not prove $1 billion is cheap. It shows that $1 billion is plausible if, and only if,
              Twenty is truly on the path to becoming a durable workflow layer in a high-priority government budget
              stream.
            claimRefs:
