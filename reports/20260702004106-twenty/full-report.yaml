      - number: '5.3'
        title: Deployment model, human oversight, and governance
        blocks:
          - type: paragraph
            body: >-
              Twenty’s messaging around autonomy is notable for what it includes and what it avoids. The company
              repeatedly says human judgment remains central and pairs that claim with phrases such as rigorous
              evaluation, controlled deployment, and mission alignment. That language is not just brand polish: it
              closely matches the policy posture of Twenty’s likely buyers. CYBERCOM’s AI roadmap and task-force
              reporting emphasize secure, ethical, assured AI adoption, while public commentary around autonomous
              penetration testing makes clear that new cyber-AI services need validation before they are trusted
              operationally.


              The delivery model also looks closer to embedded mission software than to pure remote SaaS. The careers
              page advertises forward-deployed, TS/SCI-cleared, Fort Meade- and NCR-oriented roles, and the offensive
              research role explicitly says staff work closely with government customers and operational teams to
              translate mission requirements into technical priorities. That combination implies significant deployment
              friction on the way in, but also higher switching costs once a capability is integrated into real
              workflows. The main evidence gap is that the public record still does not show how evaluation, rollback,
              logging, or red-team guardrails are implemented in practice once the software is running in sensitive
              environments.
