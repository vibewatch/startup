      - number: '8.4'
        title: Bull, Base, and Bear Scenarios
        blocks:
          - type: paragraph
            body: >-
              The scenario range is wide because public data is sparse. In the base case, Twenty grows from early
              contract wins into a focused but real software supplier to offensive-cyber and mission-integration
              programs, justifying a roughly fair or slightly rich valuation around the current mark. In the bull case,
              the company becomes system-of-record for attack-path orchestration, operator decision support, or
              digital-twin style targeting workflows across multiple commands and allied customers, turning today's
              scarcity into program durability. In the bear case, the category proves real but the company's economics
              do not: contract wins remain narrow, compliance and oversight slow deployment, autonomous tooling
              commoditizes lower-end features, and larger incumbents or primes absorb the most valuable layers of the
              stack. Because public evidence does not disclose revenue or margins, sensitivity has to be expressed
              through milestone logic rather than precise multiples. That is a sign to resist false precision, not to
              ignore upside.
