companyProfile:
  summary: >-
    Twenty is an Arlington-based private defense-technology startup building AI-enabled offensive cyber systems for U.S.
    military and intelligence users. The company emerged from stealth in late 2025 after early government work, then
    reached unicorn status in June 2026 on the back of a $100M Series B led by Accel. Its public narrative centers on
    industrializing cyber operations by turning operator tradecraft into software that can scale across many targets
    while preserving human judgment over deployment.
