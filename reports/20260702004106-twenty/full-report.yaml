      - number: '5.2'
        title: Architecture signals and automation claims
        blocks:
          - type: paragraph
            body: >-
              The clearest architecture evidence comes from hiring, not from product documentation. The principal and
              associate offensive cyber research roles call for attack-path automation, adversary emulation, ETL
              pipelines, standardized schemas, graph-style analysis, and large-scale storage and retrieval of
              security-relevant data. Those same roles specify Python or Golang plus Docker or Kubernetes, which implies
              a containerized, code-driven platform rather than one-off analyst tooling. The roles also point to a
              system that ingests multiple intelligence feeds, normalizes them, and uses graph traversals or graph-like
              reasoning to connect assets, behaviors, and attack opportunities.


              External coverage reinforces that picture. Tectonic describes agents doing continuous scanning and
              surfacing options to humans, TechTimes describes a multi-agent architecture that can build a digital twin
              of target infrastructure during reconnaissance and exploitation, and AI CERTs extends the public
              description to payload generation and post-exploitation persistence across the kill chain. CYBERCOM’s
              current AI-funding narrative also explicitly names cloud systems, LLM access, RAG frameworks, agentic AI
              capabilities, and workforce training, which underscores that the buyer environment is budgeting for the
              same enabling stack categories implied by Twenty’s hiring signals. Even with that corroboration, major
              architecture questions remain open. Public sources do not identify the model providers, orchestration
              layer, hosting environment, or how much of the stack can operate inside classified or disconnected
              environments. As a result, the right underwriting view is that Twenty’s architecture looks plausibly
              modern and software-native, but the most investment-relevant implementation details are still inferred
              from jobs and media reporting instead of direct technical documentation.
