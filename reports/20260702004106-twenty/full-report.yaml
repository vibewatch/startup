      - number: '1.2'
        title: Founders, leadership, and governance
        blocks:
          - type: paragraph
            body: >-
              Leadership pedigree is the cleanest part of the Twenty story. The founder bench combines former U.S. cyber
              operators with executives who previously built and sold national-security cybersecurity products at
              Expanse and Palo Alto Networks. Joe Lin brings product and public-sector experience from Expanse and Palo
              Alto plus a U.S. Navy Reserve background. Leo Olson and Skyler Onken supply the deep technical and
              operational credibility that the company is using to sell “industrial-scale” offensive cyber capability,
              while Pete Sorrentino, Dan Quinlan, Adam Howard, and Kevan Dunsmore fill out growth, finance, policy, and
              engineering leadership with backgrounds that are unusually tailored to federal go-to-market and
              classified-delivery environments.


              The weakness is governance transparency rather than operator quality. The reviewed public pages did not
              disclose a board roster, voting-control structure, independent directors, or formal governance documents.
              That is common for a private startup, but it matters more here because the company operates in a highly
              sensitive area where oversight and decision authority are core diligence questions. The result is a
              profile with strong key-person fit but limited public visibility into how strategic control is actually
              exercised beyond the founder and executive bench.
