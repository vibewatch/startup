      - number: '7.2'
        title: Export Controls, Compliance, and Human Rights Risk
        blocks:
          - type: paragraph
            body: >-
              A second layer of risk comes from the regulatory environment around military support, intelligence
              assistance, and spyware-adjacent technologies. Arnold Porter's summary of the July 2024 BIS and DDTC
              proposals shows a direction of travel toward broader controls on military-support end users, intelligence
              end users, and compensated intelligence assistance, including U.S.-person support in some cases. Wassenaar
              and SIPRI show that spyware and cyber-surveillance tools are already inside a more coordinated
              export-control and sanctions regime, even if implementation remains difficult for intangible software and
              technical data. Human Rights Watch's treatment of the Paragon contract demonstrates how quickly commercial
              cyber tooling can become a rights-and-reputation issue once government buyers are controversial. For
              Twenty, that does not prove a current violation, but it does show the adjacent industry precedent: private
              cyber vendors can attract scrutiny not only for what they build, but for who they support, how oversight
              works, and whether the tools are perceived as enabling abuse. Because Twenty markets itself as offensive
              and military-adjacent rather than quietly dual-use, it carries a higher probability of future export,
              sanctions-screening, end-use, or public-interest review than an ordinary enterprise-security startup.
            claimRefs:
              - CR003
