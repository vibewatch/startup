      - number: '8.5'
        title: Exit Readiness and Final Diligence
        blocks:
          - type: paragraph
            body: >-
              Exit readiness is directionally attractive but not yet underwritten. The likely strategic pathways are
              deeper penetration into classified or mission-critical cyber programs, allied expansion where policy
              permits, and eventual partnership or acquisition interest from larger defense-software or mission-system
              players. But each path depends on diligence items the public file leaves open: contract concentration,
              true software gross margins, certification readiness, authority guardrails, and whether the product is
              reusable enough to scale without exploding services intensity. The most important kill triggers are
              simple. If non-public diligence shows that most revenue is narrow and manually intensive, the valuation
              should compress. If compliance or export-governance evidence is weak, the cost of scale rises. If the
              company can instead show recurring program adoption, differentiated evals, and a clear moat over both
              primes and autonomous-security startups, then the $1 billion mark starts to look less like exuberance and
              more like early capture of a strategically scarce asset.
