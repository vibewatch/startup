      - number: '2.2'
        title: Budget lenses and evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              Public budget material confirms that the backdrop is large, but it does not support a lazy one-number TAM.
              The broadest lens is DoD cyber funding: independent reporting points to roughly $14.5 billion of FY2025
              cyber activity and about $15.1 billion of FY2026 military cyber funding. That is useful context, yet it is
              too broad for Twenty because it mixes defensive, enterprise, and personnel-heavy line items with the
              narrower offensive-cyber workflows the company targets. A tighter anchor is USCYBERCOM’s own FY2026
              budget: $1.614668 billion of direct O&M, plus $259.955 million of mandatory reconciliation for cyber force
              generation, AI, cyber weapons and tools, and related infrastructure. Even that still includes civilian
              pay, contractor support, travel, ISR, and command overhead, so it should be treated as an upper bound for
              command-level relevance rather than a clean software wedge.


              The best approach is therefore a stack of lenses. Broad DoD cyber budgets establish that the federal
              mission is not niche. CYBERCOM budget authority shows the direct command envelope. HigherGov program
              summaries and Nextgov’s AI-award reporting show that some of this spend is now flowing through AI pilots,
              OTA structures, and direct commercial contracts rather than only through legacy defense programs. ODNI and
              In-Q-Tel evidence adds a fourth lens for the intelligence side: the IC can adopt dual-use startups through
              bridge mechanisms and pilots even when classified program budgets remain opaque. The result is a real but
              much narrower serviceable market than headline cyber budgets imply, with unresolved gaps around the exact
              share that will convert into repeatable offensive-mission software contracts.
