      - number: '4.2'
        title: Contract demand and capital adequacy
        blocks:
          - type: paragraph
            body: >-
              The financing story is much clearer than the operating-financial story. Public sources corroborate a $38
              million Series A followed by a $100 million Series B at a $1 billion valuation, taking total disclosed
              funding to $138 million. Company and media sources also align that the latest round is intended to
              accelerate research and engineering. Combined with the 39 open roles on the careers page, the picture is
              of a company still in aggressive build mode rather than one optimizing for public-profitability signaling.
              The headline capital base is therefore real and meaningful.


              But capital adequacy cannot yet be underwritten in the way an investor would usually want. No public
              source discloses cash on hand, monthly burn, runway, debt, or next-round triggers. The strongest
              demand-side context comes from outside the company: USCYBERCOM's budget filing, AI-roadmap work, and
              task-force reporting all point to a U.S. government environment that is willing to spend more on
              AI-enabled cyber operations. That backdrop helps explain investor appetite, and it may help explain future
              opportunity, but it does not close the core underwriting gap. Strong demand context plus a $138 million
              capital stack is not the same thing as evidence of balance-sheet sufficiency.
