  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct and adjacent solution set
        blocks:
          - type: paragraph
            body: >-
              Twenty’s direct public peer set is smaller than the headline cyber market but more crowded than its
              marketing implies. The company is clearly not competing with every security vendor. Its closest direct
              analogs are firms that automate offensive or adversary-emulation workflows, such as Horizon3 and XBow,
              plus the internal-build alternatives emerging from DARPA-backed cyber-reasoning systems. Those vendors
              attack similar parts of the workflow—recon, validation, exploitation logic, and rapid proof of impact—even
              when they serve enterprise buyers or bug-bounty arenas instead of classified mission owners. Twenty’s own
              positioning is broader than that; it describes end-to-end offensive mission software for military and
              intelligence customers, not just autonomous pentesting. Even so, the overlap is enough to matter because
              buyers increasingly understand that parts of offensive tradecraft can now be productized.


              The adjacent set is broader still. Dream sells sovereign national-cyber capability layers to governments.
              Helsing shows that defense-AI buyers can back software-first sovereign stacks with very large capital
              pools. Spyware vendors occupy a more controversial adjacency, while primes and cloud-security incumbents
              offer alternative ways to buy cyber effects, response, or AI-enabled disruption without betting on a
              pure-play offensive startup. The competitive implication is that Twenty does not face one rival category.
              It faces several: direct automation peers, sovereign government platforms, primes with procurement
              gravity, and open or government-seeded substitutes that can erode narrow feature moats.
            claimRefs:
