        - Business is mostly bespoke labor rather than reusable platform
        - Crushes margin and multiple potential
        - Treat as services-style contractor
      - - Moat compression
        - Primes or autonomous-security vendors close workflow gap quickly
        - Reduces category scarcity premium
        - Lower valuation ceiling
      - - Policy backlash
