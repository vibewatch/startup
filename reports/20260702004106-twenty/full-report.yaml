  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The bull case for Twenty is scarcity. Few venture-backed companies are openly building offensive-cyber
              software for the U.S. military and intelligence community, and fewer still combine operator pedigree,
              national-security investor backing, and early contract proof. Public materials show genuine tailwinds: the
              government is expanding AI use in cyber operations, DARPA and commercial players are proving machine-speed
              cyber automation, and private capital is willing to fund software that sits closer to the
              national-security mission stack than traditional enterprise security. The anti-thesis is that scarcity is
              not the same thing as proof. Twenty's public disclosures stop at funding, positioning, and limited
              contract signals; they do not show revenue scale, customer concentration, gross margin, retention, or
              whether the business is a reusable software platform versus a labor-intensive mission-services engine. At
              $1 billion, investors are not buying current public fundamentals. They are buying the right to own an
              early strategic category leader before the financial model is visible.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
