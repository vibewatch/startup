      - number: '5.5'
        title: Technical risks, infrastructure needs, and evidence gaps
        blocks:
          - type: paragraph
            body: >-
              The technical risks cluster around four areas. First, autonomy claims outpace public proof. The company
              has not disclosed benchmark results, uptime or safety metrics, false-positive rates, or evaluation
              procedures for agentic operations. Second, deployment into sensitive environments likely requires cleared
              staff, customer-specific integration, and secure data handling, which can slow implementation and create
              capacity bottlenecks. Third, the legal and policy perimeter for private-sector offensive cyber work
              remains unsettled. Recent Carnegie and Lawfare analysis argues that permissive rhetoric still leaves CFAA,
              oversight, collateral-damage, and demonstrable human-authorization requirements unresolved. That can
              constrain feature scope, exportability, and even the kinds of customer environments where the software can
              be used. Fourth, the lack of public docs means investors are forced to infer architecture from hiring,
              which is a weaker evidentiary base than direct technical artifacts.


              These risks are not thesis-killers, but they do shape diligence. The most important asks are architecture
              walkthroughs, evidence of evaluation and abort controls, deployment-topology explanations for classified
              versus commercial environments, benchmarked performance against adjacent systems, and clear delineation of
              where software ends and forward-deployed services begin. Without those materials, the company’s strongest
              verified asset is mission relevance, while its most important unresolved issue is product proof.
            claimRefs:
              - CE011
              - CE020
              - CE021
              - CE038
              - CE028
