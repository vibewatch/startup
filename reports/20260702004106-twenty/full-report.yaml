  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal, Oversight, and Accountability Risk
        blocks:
          - type: paragraph
            body: >-
              Twenty is selling into one of the most sensitive seams in national security: privately built offensive
              cyber capability. The public case for demand is strong, but the legal and oversight perimeter is still
              moving. Lawfare and Bloomberg Law both describe a U.S. policy climate that is increasingly willing to
              involve private industry in disrupting adversary networks while still warning that hacking back,
              retaliation, collateral damage, and congressional-accountability gaps remain unresolved. CRS and Cornell
              reinforce that the CFAA and related statutes still constrain unauthorized access and transmission-based
              damage, which means a contractor or operator can quickly move from authorized support to legally exposed
              conduct if authorities, boundaries, and controls are not explicit. The company partly mitigates this by
              emphasizing human judgment and controlled deployment, yet that does not answer who owns accountability if
              a privately built workflow is misused, over-automated, or employed under ambiguous authorities. For an
              investor, the key issue is not whether offensive cyber is strategically important; it is whether the
              operating model can scale without getting trapped between Title 10 or Title 50 secrecy,
              contractor-compliance obligations, and future political backlash against privatized cyberwarfare.
            claimRefs:
