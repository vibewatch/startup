        title: Milestones, scale gaps, and adverse signals
        blocks:
          - type: paragraph
            body: >-
              The milestone record now has enough texture to anchor later chapters. Twenty was founded in 2024, stayed
              private while building with government users, emerged from stealth in November 2025, entered the public
              policy conversation in January 2026 through press coverage and congressional testimony, announced a
              university workforce partnership in May 2026, and then raised its $100 million Series B in June 2026. The
