- id: legal-policy-and-operational-constraints
  title: Legal, policy, and operational constraints on scaling adoption
  body: 'The demand case is strong, but the friction is unusually high. Offensive cyber remains legally and politically sensitive in ways that ordinary cyber tooling does not. Lawfare’s and West Point’s analyses show that policymakers still have unresolved questions around authority, target scope, liability, attribution, escalation, human control, and the difference between active defense and true offensive operations. CRS adds a practical twist: DOD components are exploring agentic AI, but there is still no known official government guidance specifically for agentic AI. That means adoption can proceed through pilots and mission experiments before the oversight regime is fully standardized. For investors, this is a double-edged sword: the market can move early, but the rules can also tighten mid-cycle.


    Operational and compliance constraints add another layer. Proposed ITAR and EAR changes could expand restrictions on U.S.-person support for intelligence or military assistance, especially where exports or foreign end users are involved. SIPRI’s work on spyware and surveillance tools shows how hard it is to regulate intangible cyber products consistently across borders. Inside the United States, DOJ’s FCA cyber-fraud enforcement shows that poor DFARS, NIST, FedRAMP, SSP, or SPRS discipline can become an existential procurement problem for contractors after award, not just before award. In short, the market is attractive because the mission is urgent, but adoption will favor vendors that combine technical advantage with disciplined governance, cleared deployment models, and the ability to survive scrutiny from contracting officers, lawyers, oversight bodies, and allied partners.'
