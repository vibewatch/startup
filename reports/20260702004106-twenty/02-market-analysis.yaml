- id: TM006
  title: Legal and policy constraint register
  columns:
  - Constraint
  - Current signal
  - Adoption effect
  - Most affected buyer
  - Diligence ask
  rows:
  - - Unsettled private-sector offensive authority
    - Lawfare says objectives, scope, and liability remain unresolved
    - Can delay or narrow permissible use cases
    - Commands considering contractor-led disruption support
    - What authorities and indemnities govern contractor action?
  - - IHL / IHRL and human-control concerns
    - West Point flags proportionality, attribution, and oversight challenges
    - Raises review burden on autonomous features
    - Military mission owners
    - Where is the human decision point documented?
  - - No dedicated agentic-AI policy baseline yet
    - CRS says no known official guidance yet specifically on agentic AI
    - Creates room for pilots but uncertainty for scale-up
    - Program managers and contracting officers
    - Which interim guardrails are buyers imposing today?
  - - EAR / ITAR expansion risk
    - Arnold & Porter says U.S.-person support controls may widen
    - Can complicate allied or foreign support models
    - International / allied buyers
    - Which deployments trigger license or policy review?
  - - Spyware and export-control scrutiny
    - SIPRI shows increasing control of cyber-surveillance tools
    - Elevates diligence on offensive-adjacent exports and intangible transfers
    - Vendors with cross-border delivery ambitions
    - How is source code, training, and remote support treated?
  - - FCA / DFARS cyber enforcement
    - Fluet and Hogan Lovells show aggressive settlements
    - Makes documentation and security controls gating items
    - Any government-contractor pathway
    - How mature are SSP, NIST, SPRS, and incident-reporting controls?
  notes: These are adoption constraints, not reasons the market disappears. The implication is that winning vendors need legal-operational discipline alongside product speed.
