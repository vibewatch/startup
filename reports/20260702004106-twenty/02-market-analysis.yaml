tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance
  rows:
  - - USCYBERCOM offensive mission software
    - Campaign planning, target analysis, vulnerability workflows, mission coordination, and AI-enabled operator tooling
    - Generic enterprise IT refresh, base IT, and broad defensive hygiene programs
    - USCYBERCOM / CNMF / service cyber elements using federal defense appropriations
    - Closest public fit to Twenty’s stated mission
  - - AI-enabled cyber operations infrastructure
    - Data standards, pilot environments, commercial AI services, analytics tooling, and cyber weapons/tool support
    - Unrelated autonomous systems or kinetic AI with no cyber mission role
    - CYBERCOM RDT&E sponsors, CDAO-style buyers, and program offices
    - Public sources show active pilot and contracting pathways
  - - Intelligence-community cyber mission systems
    - Dual-use AI, analytics, data-readiness, and mission software adopted through IQT or IC acquisition channels
    - Broad NIP collection, analysis, or facilities spend with no cyber-operations relevance
    - IC mission owners, ODNI-guided acquisition, and bridge vehicles like In-Q-Tel
    - Relevant but partly opaque and therefore hard to size precisely
  - - Allied / partner operational support
    - Interoperable mission software used in defend-forward, coalition, or host-nation invited operations
    - Unilateral foreign military sales of unrestricted offensive tools
    - Invited partner governments, coalition commands, and U.S.-funded collaboration
    - Extends TAM but only where authorities and invitations exist
  - - Excluded general cyber spend
    - None; this row marks what should stay out
    - Most enterprise security, civilian critical-infrastructure defense, and non-mission AI spending
    - Broad public and private cyber buyers
    - Important context, but not the clean near-term market for Twenty
  notes: This is a boundary table, not an additive TAM. It separates the direct offensive-cyber mission-software wedge from broader cyber and AI budgets that only partially overlap.
