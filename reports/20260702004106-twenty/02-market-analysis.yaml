- id: TM005
  title: Procurement pathway table
  columns:
  - Pathway
  - Contracting mechanism
  - Typical sponsor
  - Speed
  - What it buys
  - Main limitation
  rows:
  - - Command O&M purchase
    - Direct defense appropriation / task order
    - USCYBERCOM or service command
    - Medium
    - Operational software, support, and mission integration
    - Competes with labor and overhead inside the same budget
  - - RDT&E pilot / OTA
    - OTA, fixed-price, or cost-plus pilot
    - Program line such as CY50H1 or CY50W1/W2
    - Fast
    - Prototype capability, evaluation, or pilot deployment
    - Conversion from pilot to scale is uncertain
  - - Direct AI ceiling award
    - Commercial AI contract vehicle
    - CDAO / department-level AI buyer
    - Fast
    - Foundation-model access, workflows, and integration support
    - Can disintermediate niche vendors
  - - In-Q-Tel / IC bridge
    - Strategic investment plus work program
    - Intelligence-community partner
    - Medium
    - Dual-use product adaptation and secure testing
    - Does not disclose a clean public budget trail
  - - DARPA / challenge transition
    - Prize + transition support
    - DARPA / partner agencies
    - Medium
    - Open or semi-open technical capability transition
    - May crowd out proprietary feature moats
  - - Prime-led teaming
    - Subcontract / integrated program
    - Large defense contractor or integrator
    - Medium
    - Access, accreditation, and embedded distribution
    - Reduces margin and direct customer ownership
  notes: These are the most plausible entry routes suggested by the public record. They differ materially in speed, disclosure, customer control, and the probability of recurring revenue.
