- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - CYBERCOM AI roadmap and task force
    - Positive
    - Current
    - Creates explicit demand for AI-enabled cyber workflows
    - Which roadmap areas already have funded production pathways?
  - - Rising hunt-forward and partner operations tempo
    - Positive
    - Current
    - Expands coalition and mission-support demand beyond one command
    - Which partner operations generate repeat software deployment versus custom services?
  - - Direct awards to frontier AI vendors
    - Positive
    - Current
    - Normalizes buying commercial AI quickly
    - How defensible is Twenty against general-purpose model vendors or integrators?
  - - AI now lowering offensive-cyber skill barriers
    - Positive for urgency / negative for exclusivity
    - Current
    - Pushes buyers to modernize fast while also broadening the competitor set
    - Which parts of the workflow stay hard even when commodity models improve?
  - - Classification, accreditation, and mission secrecy
    - Negative
    - Current
    - Slow deployment and reduce public proof points
    - What percentage of deployments can stay on cleared or air-gapped rails without custom rebuilds?
  - - Human-control, authority, and legal review burdens
    - Negative
    - Current
    - Make fully autonomous or privatized offense harder to scale than ordinary cyber tooling
    - Where does human judgment remain mandatory in the product flow?
  - - Contractor cyber-compliance enforcement
    - Negative
    - Current
    - Documentation and control failures can create award and post-award risk
    - Does Twenty already satisfy NIST / DFARS / SSP expectations for sensitive workloads?
  - - Export controls and intelligence-assistance rules
    - Negative
    - Current / emerging
    - May narrow foreign or allied revenue paths for offensive-adjacent support
    - Which allied use cases require separate licensing or policy review?
  notes: This table mixes adoption drivers with structural constraints because both determine whether budget authority converts into real commercial revenue for an offensive-cyber startup.
