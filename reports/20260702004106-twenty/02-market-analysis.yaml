  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: classified-sam
    missingEvidence: A program-by-program split of offensive versus defensive software spend inside classified DoD and IC cyber budgets.
    whyItMatters: Without it, public TAM work overstates the revenue pool a startup like Twenty can truly access.
    diligencePath: Request pipeline detail by sponsoring office, color of money, and current phase from pilot to production.
  - type: missing-source
    severity: material
    topic: pilot-conversion
    missingEvidence: Historical conversion rates from command pilots, IQT bridges, or OTA prototypes into multi-year production contracts for offensive-cyber software.
    whyItMatters: Pilot-rich markets can still underwrite poorly if conversion to recurring revenue is low.
    diligencePath: Ask management for named examples of pilots that converted, including timing, sponsor, and contract vehicle.
  - type: private-evidence-only
    severity: minor
    topic: allied-exportability
    missingEvidence: Internal policy matrix showing which allied or partner use cases require export, intelligence-assistance, or higher legal review.
    whyItMatters: Allied TAM is real only where the company can actually deliver support lawfully and repeatably.
    diligencePath: Review counsel-approved export and policy decision trees for key allied geographies.
