- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric or issue
  - Impact
  - Exact diligence path
  rows:
  - - ARR / revenue denominator
    - Prevents valuation-multiple analysis and trend modeling
    - Request current ARR, revenue run rate, and trailing-12-month revenue bridge
  - - Customer count and concentration
    - Blocks renewal-risk and concentration-risk analysis
    - Request named top programs, top-customer share, and customer-count disclosure
  - - Pricing architecture and contract mix
    - Makes it impossible to separate software economics from services economics
    - Request standard contract forms, pricing schedules, and percent of revenue by contract type
  - - Gross margin and compliance cost
    - Prevents judgment on whether the model scales like software or like high-touch federal services
    - Request gross margin, services attachment, security-compliance staffing, and audit spend
  - - Cash, burn, and runway
    - Leaves capital adequacy and next-round dependence unknowable
    - Request cash balance, monthly burn, runway scenarios, and hiring plan
  - - Backlog, renewal profile, and revenue recognition policy
    - Without these, the quality and durability of public contract proof cannot be underwritten
    - Request backlog schedule, option-year status, renewal statistics, and accounting policy summary
  notes: These are the minimum public-to-private bridge items needed to move from a narrative verdict to a real underwriting model.
