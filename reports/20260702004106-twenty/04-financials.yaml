- id: compliance-costs-customer-concentration-and-unit-economics
  title: Compliance costs, customer concentration, and unit-economics gaps
  body: >-
    For a company like Twenty, unit economics are likely governed as much by compliance and delivery intensity as by software gross margin. The public legal and policy corpus is useful here even though it is not company-specific. Fluet documents a sharp rise in DOJ cyber-fraud enforcement against government contractors. Bloomberg Law points to costly CMMC preparation and the internal strain that these regimes create. Lawfare, Brookings, West Point, CRS, and Cornell all reinforce that private offensive-cyber work sits inside a legally and politically sensitive zone where authorization, liability, and oversight questions have not been fully settled. That means margin path will be shaped not only by engineering productivity, but also by audit readiness, clearance-heavy staffing, legal review, and documentation discipline.


    Customer concentration is another likely financial issue. The only publicly confirmed demand signals are U.S. military and intelligence-related, plus a university workforce partnership that is strategically useful but not diversified revenue. There are no public commercial customer logos, no customer-count disclosures, and no top-customer percentages. In practice, the business could still be diversified within government programs, but the public record does not let an outside investor prove that. This is a classic case where the product story and the funding story run ahead of the unit-economics file.
