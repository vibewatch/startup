callouts:
- calloutType: strength
  title: The demand backdrop for AI-enabled cyber capability is real
  body: Official budget, roadmap, and task-force materials from USCYBERCOM support the idea that the government wants more scalable AI-assisted cyber capability. That does not prove Twenty wins, but it does make the category tailwind more credible than a typical startup pitch deck.
  claimRefs:
  - CI016
  - CI017
  - CI025
  - CI026
- calloutType: risk
  title: The public file is not rich enough to underwrite revenue quality
  body: Even after a $1 billion valuation, there is still no public ARR, run-rate revenue, gross margin, backlog, renewal profile, or concentration data. Investors can see financing velocity and mission urgency, but not the denominator that makes those numbers financially legible.
  claimRefs:
  - CI005
  - CI006
  - CI031
  - CI034
  - CI037
  - CI040
- calloutType: risk
  title: Compliance can be a real margin driver in government cyber work
  body: Government-contractor enforcement and certification requirements are no longer theoretical. The available legal sources show escalating FCA and CMMC pressure, which means a vendor like Twenty may need more process, staffing, and documentation than the software story alone suggests.
  claimRefs:
  - CI027
  - CI028
  - CI029
  - CI039
- calloutType: insight
  title: Valuation support is strategic before it is financial
  body: The $1 billion mark is publicly legible through contract proof, investor quality, and macro demand for offensive cyber—but not through an ARR multiple. That can still be rational for a strategically scarce asset, yet it raises the burden on private diligence to prove renewal quality and margin path.
  claimRefs:
  - CI002
  - CI003
  - CI016
  - CI018
  - CI034
  - CI040
