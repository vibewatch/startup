company:
  name: Twenty
chapter:
  number: 1
  title: Company Overview
  summary: Twenty is an Arlington-based offensive-cyber startup founded in 2024 that moved from stealth and early government contract proof to a $100 million Series B at a $1 billion valuation in June 2026. The public record strongly supports the founder pedigree, investor roster, and early mission traction, but it still leaves core scale data—revenue, customer count, exact headcount, governance structure, and contract concentration—substantially undisclosed. The live twenty.io site paired with a parked twenty.ai domain is a small but telling diligence signal that the company's public-information hygiene trails its financing velocity.
sections:
- id: identity-mission-and-web-presence
  title: Identity, mission, and web presence
  body: >-
    Twenty is currently presented to the market through the live `twenty.io` domain, where it calls itself “software that wins in war” and says it is industrializing cyber power for the United States and its allies. The core self-description is consistent across the home page, the about page, and the two PR announcements: this is not a generic enterprise-security vendor selling defensive tooling, but a venture-backed builder of offensive-cyber capabilities and workflows for military and intelligence users. The company repeatedly emphasizes that its systems are built for conflict conditions, that they automate work which historically required large numbers of operators, and that human judgment remains at the center of deployment and mission use.


    That identity claim is stronger than the surrounding disclosure package. The company offers a coherent mission statement and a concrete target customer set, but it does not publish a conventional corporate fact sheet covering revenue, customer count, balance-sheet metrics, or legal structure. The most visible brand inconsistency is that `twenty.ai` resolves to a parked “domain is for sale” page while `twenty.io` functions as the active site. This does not negate the operating business, but it is a genuine diligence flag because a security company at this stage should ideally control the most obvious adjacent domain namespace. The mismatch reinforces the broader pattern: compelling mission clarity, but uneven public-company hygiene.
