- id: milestones-scale-gaps-and-adverse-signals
  title: Milestones, scale gaps, and adverse signals
  body: >-
    The milestone record now has enough texture to anchor later chapters. Twenty was founded in 2024, stayed private while building with government users, emerged from stealth in November 2025, entered the public policy conversation in January 2026 through press coverage and congressional testimony, announced a university workforce partnership in May 2026, and then raised its $100 million Series B in June 2026. The current careers page shows 39 open roles across engineering, operations, finance, and growth, which is a useful proxy that the company is scaling organizationally even if it is not publishing employee totals.


    The scale gaps are equally important. Virginia Business said the company had not publicly disclosed revenue, employee count, or customer count after the unicorn round, and the company-owned pages still do not publish customer logos, contract durations, or public balance-sheet numbers. Lawfare's oversight critique adds a separate adverse layer: private offensive-cyber vendors can sit in a gray zone between venture-speed product development and slower-moving public accountability structures. Put together, the record supports real momentum, but it does not yet support a fully underwritten view of commercial scale or governance maturity.
