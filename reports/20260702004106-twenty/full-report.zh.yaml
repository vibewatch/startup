      - number: '6.5'
        title: 合作伙伴、人才管线和交付能力信号
        blocks:
          - type: paragraph
            body: >-
              最有用的非客户耐久性信号，是能力建设。WVU 合作提供实习和应用研究，聚焦进攻性网络和 AI 赋能系统，帮助公司在具备保密许可的技术人才稀缺市场搭建人才管线。招聘页和 General Catalyst
              的岗位列表也指向同一件事：Twenty 不只在招进攻性研究员，也在招前置部署可靠性、任务部署、数据工程和产品人才。这种覆盖面说明，公司想把交付制度化，而不只是给几个定制合同配人。


              招聘面也比最初岗位更宽。Ashby 现在列出首席进攻性网络研究工程师和进攻性网络研究工程师两类职位；Dan Quinlan
              的简介则称，运营职能正在建立财务纪律，以及服务任务关键交付的高可扩展运营基础。这些信号不能证明客户多元化，但确实强化了一个判断：管理层正准备让公司以更可重复的执行能力服务敏感政府项目。


              即便如此，人才管线不等于客户多元化。能力信号降低执行风险，但不能替代具名背书或重复下单证据。最合理的解读是，Twenty
              正在铺设以规模服务保密政府客户群所需的运营地基。如果管理层能把这种能力建设与更清晰的后续授予或账户扩张证据配对，客户故事会强很多。在此之前，合作伙伴和招聘信号只是支持性、次级证据。
            claimRefs:
              - CU018
              - CU019
              - CU021
              - CU024
              - CU025
              - CU036
              - CU037
