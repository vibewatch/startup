      - number: '2.3'
        title: 采购路径与采用驱动
        blocks:
          - type: paragraph
            body: >-
              主要采用驱动力是作战节奏。CYBERCOM 路线图、hunt-forward 任务增长，以及 RAND 对 AI
              驱动进攻性网络能力可及性上升的发现，都指向同一个结论：买方需要比人工工作流更快的方法来发现、排序并执行网络行动。CISA 的集体防御指标，以及 DoD 正在直接向商业模型厂商授予大型 AI
              合同，也强化了这种紧迫性。实际市场正在走向试点密集、任务缺口驱动的采用模式。买方不需要相信一个泛泛的「AI 未来」才会购买；他们需要看到，AI
              能缩短真实网络任务周期、改善伙伴行动，或帮助司令部跟上已经使用机器规模工具的对手。


              对初创公司来说，这通常意味着从几条路径之一进入：司令部试点、HigherGov 式 RDT&E 条目、直接 AI 奖项、IQT
              式情报桥接，或由主承包商牵头的集成项目。这些路径并不等价。试点更快，但更难转化；情报侧桥接能验证产品匹配，却可能不披露规模；主承包商渠道能加速认证和准入，但也会压缩利润率和客户所有权。对 Twenty
              有利的是，公开证据显示上述每条路径现在似乎都已启动。限制因素不是政府是否愿意购买商业 AI，而是某个具体厂商能否在大型在位厂商或基础模型提供商之前，把产品映射到正确的任务牵头方、授权集合、安全边界和合同机制中。
