      - number: '5.3'
        title: 部署模型、人类监督与治理
        blocks:
          - type: paragraph
            body: >-
              Twenty 围绕自主性的表述，值得关注的不只是它说了什么，也包括它避开什么。公司反复表示人类判断仍处于中心，并把这一主张与严格评估、受控部署和任务对齐等措辞放在一起。这不只是品牌修饰：它非常贴合 Twenty
              潜在买方的政策姿态。CYBERCOM 的 AI 路线图和特遣队报告强调安全、合乎伦理、可保证的 AI 采用；围绕自主渗透测试的公开评论也清楚说明，新型网络 AI 服务必须先经过验证，才会获得作战信任。


              交付模型也更像嵌入式任务软件，而不是纯远程 SaaS。招聘页刊登了前置部署、具备 TS/SCI 许可、面向 Fort Meade
              和国家首都地区的岗位；进攻性研究岗位也明确说，员工会与政府客户和作战团队紧密合作，把任务需求转化为技术优先级。这个组合意味着进入时部署摩擦很大，但一旦能力接入真实工作流，切换成本也更高。主要证据缺口在于，公开记录仍没有说明软件在敏感环境运行后，评估、回滚、日志或红队护栏具体如何落地。
