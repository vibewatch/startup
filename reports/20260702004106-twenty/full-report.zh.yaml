      - number: '1.3'
        title: 资本基础、合同证明与利益相关方图谱
        blocks:
          - type: paragraph
            body: >-
              Twenty 从隐身状态走到独角兽融资，速度异常快。公开记录支持这样一条融资链：Caffeinated Capital 领投、General Catalyst 和 In-Q-Tel 参投的 $38M Series
              A；随后是 Accel 领投，Friends & Family Capital、Point72 Ventures 和 Caffeinated Capital 参投、估值 $1B 的 $100M Series
              B。这套资本结构重要，不只是因为金额醒目，还因为它同时交叉验证了三类支持：主流风投、通过 In-Q-Tel 体现的情报相邻资本，以及 Accel
              等后期投资者明确的防务科技判断。公司和投资者材料也一致表明，新资金投向研发和工程，而不是被包装成资产负债表救援。


              客户证明存在，但相对于融资规模仍显单薄。Forbes 报道，联邦合同记录把 Twenty 与一份最高 $12.6M 的美国网络司令部合同、以及另一份 $240,000 的海军研究合同联系起来；Axios
              则称公司已经与美国军方和情报界签有合同。WVU
              的合作公告补充了非收入层面的生态证明，说明公司能为人才培养和应用研究管线吸引机构伙伴。因此，公开图景足以支撑早期牵引，但还不够宽，无法揭示客户多元化、续约质量或集中度风险。
