      - number: '7.2'
        title: 出口管制、合规与人权风险
        blocks:
          - type: paragraph
            body: >-
              第二层风险来自围绕军事支持、情报协助和类间谍软件技术的监管环境。Arnold Porter 对 2024 年 7 月 BIS 和 DDTC
              提案的总结显示，监管方向正走向更广的控制范围：军事支持最终用户、情报最终用户、有偿情报协助，以及某些情况下的美国人支持。Wassenaar 和 SIPRI
              表明，间谍软件和网络监控工具已经进入更协调的出口管制和制裁体系，即便无形软件和技术数据的执行仍然困难。Human Rights Watch 对 Paragon
              合同的论述说明，一旦政府买方有争议，商业网络工具会很快变成权利和声誉问题。对 Twenty
              来说，这并不证明当前存在违规，但它给出了相邻行业先例：私营网络供应商被审视，不只因为它们造什么，也因为它们支持谁、监督如何运作、工具是否被认为会助长滥用。Twenty
              把自己定位为进攻性、贴近军事，而不是低调的双用途公司，因此未来面临出口、制裁筛查、最终用途或公共利益审查的概率，高于普通企业安全初创公司。
