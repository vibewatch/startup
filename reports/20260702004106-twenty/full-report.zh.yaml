      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              领导层履历是 Twenty 故事里最干净的一块。创始团队把前美国网络作战人员，以及曾在 Expanse 和 Palo Alto Networks 打造并出售国家安全网络安全产品的高管放在一起。Joe Lin 带来
              Expanse、Palo Alto 的产品和公共部门经验，也有美国海军预备役背景。Leo Olson 和 Skyler Onken 提供深厚技术与作战可信度，支撑公司销售「工业规模」进攻性网络能力；Pete
              Sorrentino、Dan Quinlan、Adam Howard 和 Kevan Dunsmore 则补足增长、财务、政策和工程领导力，背景都异常贴合联邦市场拓展和涉密交付环境。


              弱项不在作战人员质量，而在治理透明度。已审阅的公开页面没有披露董事会名单、投票控制结构、独立董事或正式治理文件。私营初创公司这么做并不少见，但 Twenty
              所处领域高度敏感，监督和决策权本来就是核心尽调问题。因此，公司的关键人物匹配度很强，但外界很难看清，创始人与高管团队之外的战略控制究竟如何运转。
