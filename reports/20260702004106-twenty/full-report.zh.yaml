      - number: '2.2'
        title: 预算视角与受证据约束的市场规模
        blocks:
          - type: paragraph
            body: >-
              公开预算材料确认背景盘子很大，但不支持偷懒地给出一个 TAM 数字。最宽的视角是 DoD 网络经费：独立报道指向 FY2025 约 $14.5B 的网络活动，以及 FY2026 约 $15.1B
              的军事网络经费。这些是有用背景，但对 Twenty 来说太宽，因为里面混有防御、企业和人员密集型条目，而公司瞄准的是更窄的进攻性网络工作流。更紧的锚点是 USCYBERCOM 自身 FY2026
              预算：$1.614668B 的直接 O&M，加上 $259.955M 用于网络部队生成、AI、网络武器与工具及相关基础设施的强制性调节拨款。即便如此，这里面仍包括文职薪酬、承包商支持、差旅、ISR
              和司令部开销，因此应把它视为司令部层面相关性的上限，而不是干净的软件楔子。


              因此，最好的做法是一组叠加视角。广义 DoD 网络预算说明联邦任务不是小众市场。CYBERCOM 预算授权显示直接司令部包络。HigherGov 项目摘要和 Nextgov 对 AI
              奖项的报道表明，部分支出正通过 AI 试点、OTA 结构和直接商业合同流出，而不只是走传统防务项目。ODNI 和 In-Q-Tel 证据则为情报侧提供第四个视角：即使涉密项目预算仍不透明，IC
              也能通过桥接机制和试点采用军民两用初创公司。结果是：可服务市场真实存在，但远比标题级网络预算暗示的窄；究竟有多少会转化为可重复的进攻性任务软件合同，仍是未解缺口。
