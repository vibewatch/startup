      - number: '6.3'
        title: 验证、留存与客户证明缺口
        blocks:
          - type: paragraph
            body: >-
              公开验证明显薄于估值叙事。除了合同报道和面向买方的评论，外界看不到客户数量、续约或留存指标、平均合同规模，也看不到被引用政府客户的具名运营成果。海军协议尤其能说明问题：它能证明买方有兴趣，但没有公开证据显示该协议转化成更大的生产化合同。情报界的说法更不透明，因为客户群没有具名。


              证据稀薄不等于业务没有牵引力；它意味着只靠公开信息很难给牵引力定价。进攻性网络项目很可能继续保密，但投资人仍需要替代证据，例如后续授予、部署时长、ATO
              节奏，或按队列披露的收入数据。在尽调中看见这些之前，Twenty
              的客户案例应被理解为战略上已获验证、商业上披露不足。公司显然已进入至少一部分任务买方的视野，但公开记录仍没有告诉外界，这些关系有多黏、复制范围有多宽。
