        blocks:
          - type: callout
            title: AI 驱动网络能力的需求背景是真实的
            body: USCYBERCOM 的官方预算、路线图和特遣队材料支持一个判断：政府想要更多可扩展的 AI 辅助网络能力。这并不能证明 Twenty 会赢，但确实让类别顺风比典型创业公司路演材料更可信。
            calloutType: strength
            claimRefs:
              - CI016
              - CI017
              - CI025
              - CI026
          - type: callout
            title: 公开材料还不足以承保收入质量
            body: 即便估值达到 $1B，公开层面仍没有 ARR、年化运行收入、毛利率、在手订单、续约画像或集中度数据。投资者能看到融资速度和任务紧迫性，却看不到让这些数字在财务上可读的分母。
            calloutType: risk
            claimRefs:
              - CI005
              - CI006
              - CI031
              - CI034
              - CI037
              - CI040
          - type: callout
            title: 合规可能成为政府网络业务的真实利润率驱动因素
            body: 政府承包商执法和认证要求已不再只是理论风险。可得法律来源显示 FCA 和 CMMC 压力正在升级，这意味着像 Twenty 这样的厂商可能需要比软件故事本身暗示的更多流程、人员和文档。
            calloutType: risk
            claimRefs:
              - CI027
              - CI028
              - CI029
              - CI039
          - type: callout
            title: 估值支撑先是战略性的，然后才是财务性的
            body: $1B 标记可以通过合同证明、投资人质量和进攻性网络的宏观需求被公开理解，但不是通过 ARR 倍数理解。对于一个战略稀缺资产，这仍可能合理，但会提高私有尽调的门槛：必须证明续约质量和利润率路径。
            calloutType: insight
            claimRefs:
              - CI002
              - CI003
              - CI016
