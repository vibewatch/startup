      - number: '2.4'
        title: 扩大采用的法律、政策与作战约束
        blocks:
          - type: paragraph
            body: >-
              需求逻辑很强，但摩擦异常高。进攻性网络仍具有法律和政治敏感性，普通网络工具没有这种程度。Lawfare 和 West Point
              的分析显示，政策制定者对授权、目标范围、责任、归因、升级、人类控制，以及主动防御与真正进攻行动之间的区别，仍有未解决问题。CRS 又补上一个现实转折：DOD 各组成部门正在探索智能体
              AI，但目前仍没有已知的官方政府指南专门针对智能体 AI。这意味着，在监督制度完全标准化之前，采用可以先通过试点和任务实验推进。对投资者来说，这是一把双刃剑：市场可以提前启动，规则也可能在周期中途收紧。


              作战和合规约束又加一层。拟议中的 ITAR 和 EAR 修改可能扩大对美国人支持情报或军事援助的限制，尤其是在涉及出口或外国终端用户时。SIPRI
              关于间谍软件和监控工具的研究说明，无形网络产品很难跨境一致监管。在美国国内，DOJ 的 FCA 网络欺诈执法表明，DFARS、NIST、FedRAMP、SSP 或 SPRS
              纪律薄弱，可能在授标后变成承包商的生死问题，而不只是授标前问题。简言之，市场有吸引力，是因为任务紧迫；但采用会偏向那些既有技术优势，又有严格治理、涉密部署模型，并能经受合同官、律师、监督机构和盟友伙伴审视的厂商。
