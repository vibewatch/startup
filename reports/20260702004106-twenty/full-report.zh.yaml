  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              Twenty 的牛市论点是稀缺性。公开为美国军方和情报界打造进攻性网络软件的风投支持公司很少；能同时具备一线操作员背景、国家安全投资人背书和早期合同证据的更少。公开材料显示顺风真实存在：政府正在扩大 AI
              在网络行动中的使用，DARPA 和商业玩家正在证明机器速度的网络自动化，私人资本也愿意资助比传统企业安全更贴近国家安全任务栈的软件。反论点是，稀缺不等于证明。Twenty
              的公开披露止于融资、定位和有限合同信号；它没有展示收入规模、客户集中度、毛利率、留存，也没有说明这门业务是可复用的软件平台，还是劳动密集型任务服务引擎。在 $1 billion
              估值下，投资人买的不是当前公开基本面，而是在财务模型可见之前，拥有一个早期战略品类领导者的权利。
