      - number: '3.3'
        title: 护城河耐久性、商品化与挤出风险
        blocks:
          - type: paragraph
            body: >-
              竞争格局里最不利的信号，不是别人融了更多钱，而是进攻性网络工作流的若干部分正在扩散为公共能力。XBow 的公开排行榜表现、Horizon3 的生产规模商业化、RAND 关于新手也能使用进攻性 AI 的发现，以及
              DARPA 开源 AIxCC
              网络推理系统的决定，都指向同一方向：部分进攻能力正变得更快、更便宜、也更不专有。这会削弱只建立在自主发现、漏洞利用链或补丁推理上的护城河，也为内部构建替代方案打开通道。政府团队可以把直接模型奖项、开源 CRS
              和主承包商集成商拼在一起，而不是整套购买专业厂商的端到端技术栈。


              那么，Twenty
              还能在哪里守住？最好的答案也最不泛化：涉密客户信任、进攻性任务语境、安全部署模式，以及把分析、计划、执行、复盘和伙伴行动连起来的工作流胶水。这些比漏洞发现模型更难开源，但并非坚不可摧。Dream
              的创始人包袱说明，治理担忧多快就能影响国家安全销售；Paragon 则显示，涉及权利敏感性的进攻工具可能变成采购负债。未来两到三年，Twenty
              的护城河大概率不会被单一直接对手考验，而会被主承包商、主权技术栈、自主渗透测试厂商和公私混合开源工具共同挤压，从四面八方挤进这个类别。
