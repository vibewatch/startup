      - number: '4.4'
        title: 财务结论与尽调阻塞项
        blocks:
          - type: paragraph
            body: >-
              财务上诚实的结论是：Twenty
              证明了很强的融资可得性，也有可信的早期需求信号，但公开材料对收入质量的证明很弱。公司有真实合同证据，类别叙事与政府支出优先级一致，投资人组合也愿意激进资助研发和工程。这些都是有意义的正面因素。同时，投资者仍无法从已审阅公开材料中计算
              ARR 倍数、测试毛利率耐久性、建模现金可支撑期限，或量化客户集中度。公司完全可能是一门好生意，但公开记录尚未达到承保级。


              因此，结论是有条件的，而不是硬判断。如果私有数据室显示，政府合同具备经常性或可续约属性、以软件为主，合规执行有纪律，客户基础也宽于当前具名证据集，那么已募集资本可能配置得非常好。反过来，如果经济性集中在少数服务密集型项目里，合规开销很高、定价可见度有限，那么
              $1B 标记更多是在靠稀缺性和战略叙事支撑，而不是靠可证明的财务产出。尽调阻塞项因此很清楚、具体、可解决——但仍然是阻塞项。
