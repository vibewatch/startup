      - number: '8.3'
        title: 融资背景与可比视角
        blocks:
          - type: paragraph
            body: >-
              Twenty 的融资背景对独角兽来说异常早，但在今天的国防 AI 市场里并不荒谬。Dream 在年销售额超过 $130 million 时达到 $1.1 billion 估值，后来在六国政府需求支撑下据报升至
              $3 billion；Helsing 在拿下欧洲重大防务项目且融资基础大得多后达到约 $13.8 billion；Anduril 和 Palantir
              相邻合作也显示，在更大的作战栈里拥有任务软件有价值。在这个背景下，Twenty 的 $1 billion 更像战略期权估值，而不是已披露倍数估值。它比 Dream
              早期独角兽估值风险更高，因为公开档案显示的收入证据更少；但即便是把握不强的怀疑派也应注意，市场现在愿意在上市公司式披露出现前，为主权网络和 AI 基础设施支付高额溢价。因此，正确可比组并不能证明 $1
              billion 便宜。它只说明，只有当 Twenty 确实走在成为高优先级政府预算流中持久工作流层的路上，$1 billion 才说得通。
