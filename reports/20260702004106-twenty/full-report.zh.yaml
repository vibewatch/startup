  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律、监督与问责风险
        blocks:
          - type: paragraph
            body: >-
              Twenty 正在切入国家安全最敏感的接缝之一：私营部门打造的进攻性网络能力。需求的公开论据很强，但法律和监督边界仍在移动。Lawfare 和 Bloomberg Law
              都描述了一个美国政策环境：它越来越愿意让私营行业参与打断对手网络，同时仍警告反击式入侵、报复、附带损害和国会问责缺口尚未解决。CRS 和 Cornell 进一步说明，CFAA
              及相关法规仍约束未经授权访问和基于传输造成的损害；如果授权依据、边界和控制不明确，承包商或操作员很快会从授权支持滑入法律暴露的行为。公司强调人工判断和受控部署，能缓释部分风险，但仍没有回答：如果私营部门打造的工作流被误用、过度自动化，或在授权模糊下使用，谁来承担问责？投资人要看的关键，不是进攻性网络是否具有战略重要性；而是这种运营模式能否扩张，而不被夹在
              Title 10 或 Title 50 保密、承包商合规义务，以及未来针对私营化网络战的政治反噬之间。
