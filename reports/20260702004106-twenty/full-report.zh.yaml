  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 具名买方单位，以及公开证明确实说明了什么
        blocks:
          - type: paragraph
            body: >-
              Twenty 的公开客户证据几乎全部指向政府。最强的具名证明是美国网络司令部和美国海军，Forbes 称二者在公司仍处于隐身状态的 2024 年就是合同持有人。Axios
              和公司自有融资材料把范围扩展到「美国军方和情报界」，但没有点名具体情报机构或项目办公室。这个区分很重要：当前公开证明支持 Twenty 拥有真实政府买方的说法，但还没有展示一张宽泛的具名账户清单。


              由此推出的市场狭窄但价值很高。Twenty 并没有把自己包装成服务所有机构的泛联邦网络承包商。相反，公开证据聚焦于关心进攻性网络、自动化和响应速度的任务买方。2026 年 6
              月的行业报道再次呼应这一点：OrangeSlices、Pulse 2.0、The SaaS News、GovCon Wire 和 Virginia Business 都重复称 Twenty
              正在为美国军方和情报界构建 AI
              驱动系统，但都没有在既有公开合同引用之外增加具名机构细节。这可以是正面信号，因为这些买方验证了任务相关性；但也意味着可见客户基础一开始就很集中。本章核心结论是：真实需求的公开证明存在，但集中在少数渠道里，且仍过于涉密或过于早期，无法呈现正常的客户参考集。
