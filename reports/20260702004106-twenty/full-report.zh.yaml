      - number: '8.2'
        title: 建议、信心与入场纪律
        blocks:
          - type: paragraph
            body: >-
              我们将 Twenty 评为“继续跟踪”：中等信心、高风险，估值偏紧；只有非公开尽调补上最大缺口后，估值姿态才可能向合理靠拢。公司显然重要：Accel 领投 Series B，In-Q-Tel
              更早下注，多个来源描述了真实政府需求。但公开证据仍太薄，无法在已公布独角兽估值上给出干净买入结论。公司未披露收入运行率、客户数量、公开续约数据、毛利率画像，也没有证据表明今天的牵引力已经像一个宽广、可重复的软件业务版图。入场纪律因此应从一个假设出发：$1
              billion 定价的是未来项目转化的大量可能，而不是当下透明度。只有管理层能证明合同牵引力正在扩展为多项目、可复现的软件收入，并且配有可防守的控制，而不只是披着 AI 话术的定制进攻性网络服务，溢价入场才合理。
