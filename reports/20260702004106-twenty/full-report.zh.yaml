          to: review
          label: 触发
        - from: review
          to: buyer
          label: 放慢
        - from: buyer
          to: capital
          label: 加剧
    claimRefs:
      - CR018
      - CR020
      - CR023
      - CR030
      - CR033
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: 相比普通 SaaS 渠道，Twenty 更依赖预算、稀缺进攻性人才、客户授权和快速技术学习闭环。
    data:
      nodes:
        - id: budget
          label: 政府预算
          detail: USCYBERCOM、DoD、IC 的 AI 与网络项目
        - id: talent
          label: 具备安全许可的人才
          detail: 操作员、漏洞研究员、前线部署工程师
        - id: data
          label: 威胁数据与评估
          detail: 图谱、遥测、测试、任务反馈
        - id: authority
          label: 任务授权
          detail: 审批和客户交战规则
        - id: delivery
          label: 可复用产品交付
          detail: 软件杠杆高于定制服务
        - id: scale
          label: 可规模化经济性
          detail: 可重复增长和投资者信心
      edges:
        - from: budget
          to: scale
          label: 资助
        - from: talent
          to: delivery
          label: 促成
        - from: data
          to: delivery
          label: 改进
        - from: authority
          to: delivery
          label: 约束
        - from: delivery
          to: scale
          label: 决定
    claimRefs:
      - CR012
      - CR014
      - CR015
      - CR035
      - CR036
      - CR038
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: 建议来自战略稀缺性和政策顺风，但严重披露缺口与客户集中抵消部分支撑。
    data:
      nodes:
        - id: scarcity
          label: 稀缺品类领导者
          detail: 进攻性网络 + 风投 + 政府任务契合
        - id: demand
          label: 政策 / 预算顺风
          detail: USCYBERCOM AI 路线图和预算支持
        - id: proof
          label: 部分合同证据
          detail: 已有披露牵引力，但仍有限
        - id: gaps
          label: 重大披露缺口
          detail: 无公开收入、利润率或客户集中数据
        - id: rec
          label: 跟踪
          detail: 中等信心；等待尽调闭环
      edges:
        - from: scarcity
          to: rec
          label: 支持
        - from: demand
          to: rec
          label: 支持
        - from: proof
          to: rec
          label: 部分支持
        - from: gaps
          to: rec
          label: 限制确信度
    approximationNotes: 该图为定性逻辑，不是加权评分模型。
    claimRefs:
      - CV001
      - CV009
      - CV010
      - CV011
      - CV015
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 对业务的隐含判断会随非公开尽调揭示的质量和可重复性而大幅变化。
    data:
      items:
        - label: 证据薄 / 服务占比高
          value: 0.6
        - label: 狭窄但真实的平台切入口
          value: 1
        - label: 多元化经常性任务软件
          value: 1.5
        - label: 盟友扩张 + 强治理
          value: 2
        - label: 主平台级战略稀缺性
          value: 3
    approximationNotes: 数值为以十亿美元计的示意性企业价值情景，并非市场报价。
    claimRefs:
      - CV027
      - CV028
      - CV029
      - CV033
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 由于公开披露稀疏，且里程碑结果主导，可能价值区间很宽。
    data:
      items:
        - label: 悲观情形
          low: 0.4
          base: 0.6
          high: 0.8
          unit: $B
        - label: 基准情形
          low: 0.8
          base: 1
          high: 1.3
          unit: $B
        - label: 乐观情形
          low: 1.5
          base: 2
          high: 3
          unit: $B
        - label: 已公布 Series B 轮估值
          low: 1
          base: 1
          high: 1
          unit: $B
    approximationNotes: 情景区间为作者估算，锚定战略稀缺性、可比信号，以及缺乏公开财务细节这一事实。
    claimRefs:
      - CV001
      - CV017
      - CV022
      - CV027
      - CV028
      - CV029
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 当前公开信息状态下的核心可投性指标。
    data:
      items:
        - label: 建议
          value: Track
          trend: flat
        - label: 信心
          value: Medium
          trend: flat
        - label: 风险评级
          value: High
          trend: down
        - label: 估值立场
          value: Stretched
          trend: down
        - label: 公开收入可见度
          value: None disclosed
          trend: flat
        - label: 已披露总融资
          value: $138M
          trend: up
    approximationNotes: KPI 仅综合公开记录；私下尽调后应会大幅收敛。
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV008
      - CV015
