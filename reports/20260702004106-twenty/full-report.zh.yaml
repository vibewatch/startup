  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 任务环境、买方边界与市场口径
        blocks:
          - type: paragraph
            body: >-
              Twenty 并不是面向整个网络安全行业销售。最清晰的公开证据把它放在一个更窄的任务环境里：美国军方和情报客户希望用软件加速进攻性网络作战、对手扰乱和网络战役。Twenty
              自有材料和新闻稿反复把公司定位为为美国及其盟友工业化进攻性网络能力；USCYBERCOM 的路线图和特遣队报告也显示，作战人员正在主动寻找 AI
              驱动的工作流、机器速度分析和自主渗透测试支持。这个组合很重要，因为它大幅收窄了买方宇宙：相关竞争不是所有 SOC
              工具，也不是每一笔企业防火墙预算，而是拥有法律授权、且任务需求与进攻性或主动网络行动绑定的司令部、特遣队和情报机构。


              这个边界仍比单一涉密客户更宽。USCYBERCOM 的四项任务、CNMF 面向伙伴的 hunt-forward 工作，以及 ODNI
              对私营部门技术采用的强调，都意味着需求可能来自司令部、军种组成单位、情报部门和部分盟友伙伴。同时，市场口径应排除大多数通用企业安全支出、大多数民用关键基础设施防御预算，以及无关的动能 AI
              项目。这个区分对估值至关重要。如果市场定义过宽，Twenty 看起来可以触达数百亿美元网络和 AI 支出；如果只按当前披露的司令部预算定义，机会又会显得人为偏小。最稳妥的框架，是把它看成嵌在更广义军事网络和 AI
              预算之内的分层进攻性网络任务软件市场。
