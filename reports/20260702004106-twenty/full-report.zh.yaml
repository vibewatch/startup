      - number: '6.4'
        title: 集中度、切换和采购风险
        blocks:
          - type: paragraph
            body: >-
              主要客户风险，是保密分类掩盖了集中度。公开证据基础太窄，少数美国国防部和情报关系就可能贡献早期收入中有意义的一部分，但没有任何披露指标能让投资人量化这种依赖。与此同时，一旦能力部署进敏感任务流程，切换可能很难。持有保密许可的人员、现场支持、客户定制集成，以及对人在回路控制的信任，都会形成嵌入；替代供应商需要时间才能复制。因此，同一种部署模式既能提高耐久性，也会在只有少数项目真正重要时放大集中度。


              采购风险让图景更复杂。法律和政策评论显示，私营公司参与进攻性网络行动的角色仍在激烈讨论中；Center for Cybersecurity Policy and Law 对 2026
              年进攻性网络战略讨论的回顾也显示，即使面向行业的倡导者仍在要求更清晰的公私协作框架，打断行动才能规模化。NDU Press
              关于透明网络威慑的研究也说明，官方对进攻性能力的胃口可以很快上升，但仍依赖高度受控的信号释放和国家授权。政府政策一变，出口或情报协助规则也可能变化。政府承包商网络执法抬高了文档、安全开发和事件报告门槛。实际看，Twenty
              面临的流失风险，可能不在单个技术功能缺口，而在无法满足政治敏感类别下的监督、合规或信任要求。
