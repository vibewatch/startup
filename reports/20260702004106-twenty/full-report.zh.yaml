  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 直接与相邻解决方案集合
        blocks:
          - type: paragraph
            body: >-
              Twenty 的直接公开同业群比标题级网络市场更小，但也比其营销暗示更拥挤。公司显然不是和每一家安全厂商竞争。最接近的直接类比，是自动化进攻性或对手仿真工作流的公司，例如 Horizon3 和 XBow，以及
              DARPA 支持的网络推理系统所催生的内部构建替代方案。即使这些厂商服务的是企业买方或漏洞赏金场景，而不是涉密任务负责人，它们也在攻击工作流中相似的部分——侦察、验证、利用逻辑和快速影响证明。Twenty
              自身定位更宽；它描述的是面向军方和情报客户的端到端进攻性任务软件，而不只是自主渗透测试。即便如此，重叠已经足够重要，因为买方越来越清楚，部分进攻性操作手法现在可以产品化。


              相邻集合还要更宽。Dream 向政府销售主权国家网络能力层。Helsing 说明，防务 AI
              买方可以用很大资本池支持软件优先的主权技术栈。间谍软件厂商处在更具争议的相邻位置；主承包商和云安全在位厂商则提供其他采购方式，让买方不必押注一家纯进攻型初创公司，也能购买网络效果、响应或 AI
              驱动的扰乱能力。竞争含义是，Twenty 面对的不是一个对手类别，而是多个类别：直接自动化同业、主权政府平台、拥有采购重力的主承包商，以及可能侵蚀狭窄功能护城河的开源或政府孵化替代品。
