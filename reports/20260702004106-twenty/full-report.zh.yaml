      - number: '7.4'
        title: 客户集中度、地缘政治和论点破裂风险
        blocks:
          - type: paragraph
            body: >-
              最后一组风险是集中度。公开层面，Twenty
              几乎完全围绕美国军方、情报界和盟友国家安全任务集来叙事。战略上或许有吸引力，但也意味着客户集中、采购摩擦、预算时点和政策反转可能同时打来。公开披露提到合同牵引力和宏大的国家优先级叙事，却没有披露收入、客户数、续约行为、毛利率或非美国收入组合。实际上，投资人被要求在公开记录说明收入基础有多分散、多可重复之前，就承销一个品类领导者。威胁情报和战略来源支持宏观紧迫性——中国、俄罗斯、伊朗、朝鲜都是活跃威胁；美国机构正在投资
              AI
              赋能网络行动；情报界希望更深的公私协作。但宏观紧迫性不等于持久的项目捕获。如果未来合同停滞，如果国会或政府收紧对私营进攻性网络的监督，或如果披露缺口掩盖了狭窄客户基础，公司可能会发现，战略重要性不会自动转化为可扩张经济性。因此，正确的尽调姿态应以触发条件为基础，而不是以声誉为基础。
