companyProfile:
  summary: >-
    Twenty 是一家位于 Arlington 的私营防务科技初创公司，为美国军方和情报用户构建 AI 驱动的进攻性网络系统。公司在完成早期政府项目后，于 2025 年底结束隐身状态；随后凭借 Accel 领投的 $100M
    Series B，在 2026 年 6 月跻身独角兽。它的公开叙事聚焦于把网络作战工业化：将作战人员的手法转成可在大量目标上扩展的软件，同时保留人对部署和任务使用的判断权。
