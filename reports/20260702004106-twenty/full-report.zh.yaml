        blocks:
          - type: paragraph
            body: >-
              里程碑记录现在已有足够细节，能为后续章节打锚。Twenty 成立于 2024 年，在与政府用户共建期间保持私密，2025 年 11 月结束隐身状态，2026 年 1
              月通过媒体报道和国会证词进入公共政策讨论，2026 年 5 月宣布大学劳动力合作，随后在 2026 年 6 月完成 $100M Series B。目前招聘页显示工程、运营、财务和增长等方向有 39
              个开放职位；即便公司没有披露员工总数，这也是组织扩张的有用代理指标。


              规模缺口同样重要。Virginia Business 称，公司在独角兽轮后仍未公开披露收入、员工数或客户数；公司自有页面也没有发布客户标识、合同期限或公开资产负债表数字。Lawfare
              的监督批评又叠加了一层负面因素：私营进攻性网络厂商可能卡在风投速度的产品开发与更慢的公共问责结构之间。合在一起，记录支持真实动能，但还不足以完全承保商业规模或治理成熟度。
