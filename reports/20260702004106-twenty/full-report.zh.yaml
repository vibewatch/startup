chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、使命与网站存在
        blocks:
          - type: paragraph
            body: >-
              Twenty 目前通过运行中的 `twenty.io`
              域名面向市场。公司称自己提供「赢得战争的软件」，并表示正在为美国及其盟友把网络力量工业化。官网首页、关于页面和两份公关公告里的核心自我描述一致：它不是卖防御工具的通用企业安全厂商，而是一家有风投支持、为军方和情报用户构建进攻性网络能力与工作流的公司。Twenty
              反复强调，它的系统面向冲突环境而建，会自动化过去需要大量作战人员完成的工作，同时人类判断仍处于部署和任务使用的中心。


              这套身份叙事比配套披露更扎实。公司给出了清晰的使命表述和具体目标客户群，但没有发布常规企业事实表，没有收入、客户数、资产负债表指标或法律结构。最显眼的品牌不一致是：`twenty.ai`
              指向「域名出售」停放页，而 `twenty.io`
              才是活跃官网。这并不能否定其运营业务，但确实是尽调信号；一家处于这一阶段的安全公司，理想情况下应控制最显而易见的相邻域名空间。这个错位强化了更大的模式：使命很清楚，公开公司治理和信息卫生却不均衡。
