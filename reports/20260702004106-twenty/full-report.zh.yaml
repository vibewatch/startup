              - CI040
  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 用任务工作流定义产品
        blocks:
          - type: paragraph
            body: >-
              Twenty
              的公开材料一直把公司定义为服务美国及盟友进攻性网络作战人员的任务软件提供商，而不是通用企业安全厂商。它的产品被描述为工业规模软件，能把过去需要作战人员数周手工完成的工作，压缩成覆盖数百个目标的自动化、连续工作流。这个定位很重要，因为它说清了产品要完成的任务：帮助政府网络团队更快地从理解目标走到行动方案，同时保留人对重大决策的判断权。


              公开记录没有展示干净的 SKU 表，但展示了运营模型。公司文案、发布报道和工程岗位共同指向一组能力包：目标映射、攻击路径开发、载荷或对手仿真工具、数据增强、作战人员复核和任务部署支持。这比泛泛的「网络
              AI」叙事更具体，但仍远不如那些公开命名模块、使用量统计或产品文档的商业自主渗透测试平台透明。尽调上最强的结论是，Twenty
              销售的是进攻性网络作战任务工作流平台；软件产品、前置部署集成和咨询支持之间的精确边界仍只被部分披露。
