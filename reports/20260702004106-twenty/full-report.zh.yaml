  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与定价不透明
        blocks:
          - type: paragraph
            body: >-
              公开材料支持一个收入假设，但还不能拼出清晰收入模型。Twenty
              显然在向美国军方和情报界销售某种组合：任务软件、能力部署和作战人员工作流自动化。官方文案描述的是进攻性网络作战的端到端系统；独立报道把公司和真实的美国网络司令部、海军项目联系起来；General Catalyst
              托管的职位描述也提到演示、政府客户协作和先进进攻工具。这足以判断，它不是自助式网络产品，也不是 SMB 按席位业务。更合理的理解是：它是一家 B2G 能力厂商，产品很可能把软件、部署和任务适配结合起来。


              缺失的是商业架构。已审阅来源没有披露标价、合同下限、续约条款，也没有说明经济性更像订阅软件、里程碑制工程工作，还是围绕核心平台包裹的涉密服务。这很重要，因为不同模型下，实际收入质量可能完全不同。一家公司叙事上可以像软件，实践中却承担服务密集型交付经济性。目前，定价完全不透明，合同组合几乎完全不透明。这迫使尽调把收入模型结论当作有依据的推断，而不是已验证事实。
