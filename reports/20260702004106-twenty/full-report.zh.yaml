      - number: '6.2'
        title: 采购路径与部署足迹
        blocks:
          - type: paragraph
            body: >-
              可见采购模式更像早期任务软件楔子，而不是经典联邦平台整合。公司似乎先通过隐身阶段的作战或研究合同切入，再用公开融资和招聘围绕这些关系扩产。当前岗位地图强化了这个判断：情报界任务部署负责人、前置部署 SRE、具备
              TS/SCI 许可的数据工程，以及 Fort Meade、Arlington、国家首都地区和 San Antonio 等地点信号。这些不是纯远程 SaaS
              厂商的模式，更像一家必须把可信人员放到敏感客户环境附近，才能实施、适配并维持软件的公司。


              CYBERCOM 路线图和 AI 特遣队优先级给这套动作提供了买方侧逻辑。司令部希望获得可扩展 AI 能力、更系统的采用方式，并在验证后引入商业自主渗透测试方案。这为 Twenty
              这样的公司创造了一条可行路径：从高价值任务问题切入，证明足够的安全性和效用，通过验证关口，然后在同一买方生态里扩张。开放问题是，这种扩张中有多少会变成可重复产品收入，又有多少会变成劳动密集型集成工作。
