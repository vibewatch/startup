      - number: '3.2'
        title: 在位厂商与初创公司的采购定位差异
        blocks:
          - type: paragraph
            body: >-
              最重要的竞争分野不只是初创公司对初创公司，而是专业进攻软件对已经控制准入、认证和集成的在位厂商。Booz Allen 与 Palantir、Anduril
              的结盟很清楚地说明了这一点。这些联盟销售的不是单点功能，而是可互操作的作战网络技术栈，把任务软件、联盟数据共享、网络和 RF 效果、零信任以及可部署硬件组合在一起。CrowdStrike 和 Google
              玩的是另一种相邻牌，但逻辑相同：在位厂商分发加 AI
              增强的托管响应，可以吸收小型专业厂商希望拥有的部分工作流。当买方需要涉密集成商、适合联盟的架构，或完成零信任认证的环境时，这些厂商一开始就有结构性优势，单靠技术新颖性抹不掉。


              这并不意味着初创公司不能赢，而是它们赢法不同。Horizon3 在企业场景中把自主测试规模化商业化。Dream 似乎用主权叙事打动了政府。Twenty
              的路径，是说服任务负责人相信：进攻性生命周期集成、精英作战人员工作流知识，以及受控的人在回路部署，足够独特，值得购买专业厂商。公开证据部分支持这个判断，因为它有融资、合同和人才合作。但同一组证据也显示，公司很容易受到采购替代影响。如果司令部可以直接购买通用
              AI，或主承包商可以把网络效果嵌入更广的任务系统，那么专业厂商的门槛就不只是技术更好，还要在买方现有采办和信任模型下更贴合任务。
