      - number: '4.2'
        title: 合同需求与资本充足性
        blocks:
          - type: paragraph
            body: >-
              融资故事远比经营财务故事清楚。公开来源相互印证：公司先完成 $38M Series A，随后以 $1B 估值完成 $100M Series B，已披露融资总额达到
              $138M。公司和媒体来源也一致表示，最新轮资金用于加速研发和工程。再结合招聘页上的 39
              个开放职位，图景更像一家仍处于激进建设模式的公司，而不是正在优化公开盈利能力信号的公司。因此，标题级资本基础真实且有意义。


              但资本充足性仍无法按投资者通常希望的方式承保。没有公开来源披露账上现金、月度消耗、现金可支撑期限、债务或下一轮触发条件。最强的需求侧背景来自公司外部：USCYBERCOM 的预算文件、AI
              路线图工作和特遣队报告都指向一个美国政府环境，愿意在 AI 驱动网络作战上花更多钱。这一背景有助于解释投资者兴趣，也可能解释未来机会，但没有补上核心承保缺口。强需求背景加 $138M
              资本组合，并不等于资产负债表充足性的证据。
