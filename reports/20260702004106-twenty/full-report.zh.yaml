            body: >-
              公开数据稀疏，情景区间因此很宽。基准情景下，Twenty
              从早期合同胜利成长为聚焦但真实的软件供应商，服务进攻性网络和任务集成项目；围绕当前估值，大致合理或略偏贵。牛市情景下，公司成为攻击路径编排、操作员决策支持或数字孪生式目标定位工作流的核心记录系统，横跨多个指挥部和盟友客户，把今天的稀缺性转化为项目耐久性。熊市情景下，品类为真，但公司经济性不成立：合同胜利仍然狭窄，合规和监督拖慢部署，自主工具把低端功能商品化，更大的既有厂商或主承包商吸走栈中最有价值的层。由于公开证据没有披露收入或利润率，敏感性必须通过里程碑逻辑表达，而不是精确倍数。投资人应抵制虚假精确，而不是忽视上行空间。
