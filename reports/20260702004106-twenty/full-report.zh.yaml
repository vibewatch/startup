      - number: '7.3'
        title: 运营、技术和人员执行风险
        blocks:
          - type: paragraph
            body: >-
              从运营看，Twenty
              试图把精英级技战术编进机器速度的工作流，而底层技术前沿正同时为防守方和攻击方快速移动。公司材料、岗位描述和独立报道都指向一种架构：围绕攻击路径自动化、数据融合、图分析、零日研究和高并行工作流搭建。它带来上行空间，也带来很高的执行风险：机器速度的行动仍必须在真实任务条件下可审计、有授权、够韧性。DARPA
              的 AI Cyber Challenge 和 CSO 对 XBOW
              的报道显示，自主网络工具正在快速改进，产品周期因此缩短，技术差异化门槛被抬高。支持品类增长的同一批证据，也意味着杀伤链低复杂度一端存在商品化风险。Twenty
              的招聘版图和公开岗位数量显示，公司仍在工程、DevSecOps、产品、财务和部署等方面补基本运营厚度。补运营厚度可以是健康信号，但在一家提出安全关键主张的公司里，快速招聘本身也是风险向量：入职、代码评审、OPSEC
              纪律和安全交付严谨度，都必须跟上任务野心。
