      - number: '4.3'
        title: 合规成本、客户集中度与单位经济性缺口
        blocks:
          - type: paragraph
            body: >-
              像 Twenty 这样的公司，单位经济性很可能和合规、交付强度一样受软件毛利率左右。公开法律和政策资料在这里有用，尽管并非公司特定。Fluet 记录了 DOJ
              针对政府承包商的网络欺诈执法急剧上升。Bloomberg Law 指出 CMMC 准备成本高昂，也会给内部带来压力。Lawfare、Brookings、West Point、CRS 和 Cornell
              都强化了同一点：私营进攻性网络工作处于法律和政治敏感区，授权、责任和监督问题尚未完全落定。这意味着利润率路径不只由工程效率塑造，还会被审计就绪度、依赖涉密许可的人员配置、法律审查和文档纪律塑造。


              客户集中度可能也是一个财务问题。公开确认的需求信号只有美国军方和情报相关项目，外加一项大学劳动力合作；后者有战略价值，但不是多元化收入。没有公开商业客户标识、客户数披露或头部客户占比。实际业务仍可能在政府项目内部实现多元化，但公开记录无法让外部投资者证明这一点。这是一个典型案例：产品故事和融资故事跑在单位经济性文件前面。
