    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 概率信号
      - 关键假设
      - 估值观点
      - 改变结论的因素
    rows:
      - - 乐观
        - ~25%
        - 获得正式项目采纳、盟友需求可复制、合规姿态强、工作流护城河可守住
        - '>$1.5B，且可能明显更高'
        - 展示多项目经常性软件收入和强评测证据
      - - 基准
        - ~45%
        - 政府侧进展真实但狭窄，并稳步扩张；软件和服务仍混在一起
        - ~$0.8B-$1.3B
        - 证明续约、利润率和集中度都受控
      - - 悲观
        - ~30%
        - 品类仍热，但合同仍是定制，合规摩擦上升，或既有厂商挤掉这个楔子
        - <$0.8B / 降价轮风险
        - 出现护城河薄、治理弱，或从试点转为可复制项目停滞的证据
    notes: 概率和区间是作者估计，因为公开披露不足以支撑常规收入倍数模型。
    claimRefs:
      - CV027
      - CV028
      - CV029
      - CV030
      - CV031
      - CV032
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 状态
      - 公开价值信号
      - 重要性
      - 限制
    rows:
      - - Twenty
        - Series B 轮（2026 年 6 月）
        - 累计融资 ${138M}，估值 ${1.0B}
        - 正在评估的参照点
        - 没有公开收入或利润率披露
      - - Dream
        - Series B 轮（2025 年 2 月）
        - 2024 年年销售额 >${130M}，估值 ${1.1B}
        - 说明有收入证明时，主权网络安全可以支撑独角兽定价
        - 创始人历史带来单独治理折价
      - - Dream
        - 增长轮（2026 年 6 月）
        - 拥有六国政府进展，估值 ${3.0B}
        - 说明品类投资人愿为国家网络平台支付溢价
        - 披露收入远多于 Twenty
      - - Helsing
        - Series D 轮 / 市场信号
        - 估值约 ${13.8B}，并拥有大型欧洲项目进展
        - 展示规模化防务 AI 的稀缺性溢价
        - 地域、硬件组合和成熟度不同
      - - Anduril 信号
        - 防务科技基准
        - 2024 年收入 $1B；防务科技分析引用 40-45% 毛利率
        - 展示成功的防务软件 + 系统公司可能长什么样
        - 已审来源集中没有直接估值数字
      - - Horizon3 / XBOW
        - 自主安全自动化
        - 5,200 个客户、225k 次渗透测试，以及 AI 渗透测试快速扩张
        - 设定商业自主安全竞争的速度
        - 企业安全经济性不同于进攻性任务软件
    notes: 覆盖面是部分且有意混合的：可比对象用于框定战略稀缺性、收入证明和治理折价，而不是声称一个精确倍数。
    enumerationScope:
      coverage: partial
      basis: >-
        Rows include the most relevant public private-market and adjacent-market reference points available in the
        reviewed source set; several lack fully comparable financial disclosure or business-model match.
    claimRefs:
      - CV001
      - CV017
      - CV018
      - CV019
      - CV020
      - CV021
      - CV022
      - CV023
      - CV024
      - CV025
      - CV026
  - id: TV005
    title: 论点破裂与否决触发器表
    columns:
      - 触发器
      - 阈值 / 事件
      - 论点传导
      - 行动含义
    rows:
      - - 合同集中度冲击
        - 一两个项目主导收入的程度超过预期
        - 把稀缺性变成采购脆弱性
        - 向悲观情景重估
      - - 合规弱点
        - CMMC/NIST/出口治理证据薄弱或延迟
        - 提高规模化成本和法律风险
        - 避免溢价入场
      - - 软件杠杆落空
        - 业务主要是定制人力，而非可复用平台
        - 压垮利润率和倍数潜力
        - 按服务型承包商看待
      - - 护城河压缩
        - 主承包商或自主安全供应商快速补上工作流缺口
        - 降低品类稀缺性溢价
        - 压低估值天花板
      - - 政策反弹
        - 权利、监管或授权争议击中整个赛道
        - 收缩买方意愿和政治支持
        - 重新评估品类敞口
    notes: 这些触发器聚焦里程碑和治理事件，因为公开财务披露仍太稀疏，无法做常规契约式监控。
    claimRefs:
      - CV010
      - CV014
      - CV030
      - CV036
      - CV037
      - CV038
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 收入质量
        - 当前 ARR 或合同运行率、积压订单、续约，以及服务 / 软件组合
        - 决定 $1B 估值反映的是平台，还是投机性楔子
        - 公司财务 + 客户尽调
      - - 客户集中度
        - 按发起方和授权拆分头部项目、头部客户敞口
        - 判断预算变化是否会击穿论点
        - 公司财务 + 政府合同专家
      - - 利润率画像
        - 按产品、服务和部署模型拆分的毛利率桥
        - 测试软件杠杆是否存在
        - 公司财务 + 运营伙伴
      - - 合规姿态
        - CMMC、NIST、SSP/POA&M、出口筛查和事件控制材料包
        - 高风险任务软件需要异常强的治理
        - 安全 / 合规尽调
      - - 产品护城河
        - 评测结果、操作员指标、赢 / 输数据，以及相对主承包商的替代风险
        - 判断稀缺性是持久还是暂时
        - 技术尽调 + 客户访谈
      - - 资本结构
        - 优先权、清算权、员工稀释和未来融资需求
        - 影响名义估值之外的真实入场经济性
        - 法律 + 股权结构表尽调
    notes: 这些是从跟踪立场推进到可承保买入立场所需的最低尽调问题。
    claimRefs:
      - CV008
      - CV014
      - CV015
      - CV034
      - CV035
      - CV036
      - CV037
      - CV038
      - CV039
