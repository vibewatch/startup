      - number: '5.5'
        title: 技术风险、基础设施需求与证据缺口
        blocks:
          - type: paragraph
            body: >-
              技术风险集中在四个方面。第一，自主性主张跑在公开证明前面。公司没有披露基准结果、可用性或安全指标、误报率，也没有披露智能体化操作的评估程序。第二，向敏感环境部署很可能需要涉密许可人员、客户特定集成和安全数据处理，这会拖慢实施并制造产能瓶颈。第三，私营部门进攻性网络工作的法律和政策边界仍未落定。近期
              Carnegie 和 Lawfare 分析认为，宽松表述并没有解决
              CFAA、监督、附带损害和可证明的人类授权要求。这会限制功能范围、出口性，甚至限制软件可以使用的客户环境类型。第四，缺少公开文档意味着投资者只能从招聘推断架构，这个证据基础弱于直接技术材料。


              这些风险不会杀死投资假设，但会塑造尽调。最重要的要求是：架构讲解、评估和中止控制证据、涉密与商业环境的部署拓扑解释、与相邻系统对比的基准性能，以及软件边界与前置部署服务边界的清晰划分。没有这些材料，公司最强的已验证资产是任务相关性；最重要的未解问题则是产品证明。
