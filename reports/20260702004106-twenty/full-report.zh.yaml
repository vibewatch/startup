      - number: '5.4'
        title: 产品化对服务化，以及外部基准
        blocks:
          - type: paragraph
            body: >-
              Twenty 最大的商业主张不只是「用了 AI」，而是把一个历史上依赖人力密集型承包的领域产品化。多个来源把传统进攻性网络采购描述为按人头驻场或定制服务模型；TNW 则把 Twenty
              描述成一家卖剑而不是卖盾的初创公司。Twenty
              转而营销一种软件：它把作战人员手法工业化，并让人和自动化配合。这在战略上有吸引力，因为软件利润率和规模化动态优于纯人力套利；但公开证据仍指向混合模型。前置部署岗位、任务架构岗位和客户协作要求都意味着，即便核心产品是软件，服务和集成仍是交付的一部分。


              外部基准凸显了披露缺口。Horizon3.ai 公布客户数、安全声明和测试量指标；XBOW 有公开基准和排行榜叙事；DARPA AIxCC 公布具体的漏洞发现和修补结果。放在这个背景下，Twenty
              在买方任务和创始人履历上有差异化，但产品证明相对不透明。这并不否定投资假设；它意味着尽调应把公司视作有前景但仍是黑箱的任务平台，而不是一个完全透明、经过基准验证的软件业务。
