      - number: '5.2'
        title: 架构信号与自动化主张
        blocks:
          - type: paragraph
            body: >-
              最清楚的架构证据来自招聘，而不是产品文档。资深和助理级进攻性网络研究岗位要求攻击路径自动化、对手仿真、ETL 管线、标准化模式、图式分析，以及安全相关数据的大规模存储和检索。同一批岗位指定 Python 或
              Golang，加上 Docker 或
              Kubernetes，这意味着平台是容器化、代码驱动的，而不是一次性分析师工具。这些岗位还指向一个系统：摄取多路情报数据源，将其标准化，再用图遍历或类图推理，把资产、行为和攻击机会连接起来。


              外部报道强化了这幅图景。Tectonic 描述智能体持续扫描并向人类浮现选项；TechTimes 描述一种多智能体架构，可在侦察和利用期间构建目标基础设施的数字孪生；AI CERTs
              又把公开描述延伸到杀伤链上的载荷生成和后利用持久化。CYBERCOM 当前 AI 经费叙事也明确点名云系统、LLM 访问、RAG 框架、智能体 AI 能力和人才培训，说明买方环境正在为 Twenty
              招聘信号所暗示的同一类使能技术栈预算。即便有这些交叉印证，重大架构问题仍未解决。公开来源没有识别模型提供商、编排层、托管环境，也没有说明技术栈有多少能在涉密或断连环境中运行。因此，正确的承保视角是：Twenty
              架构看起来有现代性，也有软件原生特征，但最影响投资判断的实现细节仍来自岗位和媒体报道推断，而不是直接技术文档。
            claimRefs:
              - CE004
              - CE005
              - CE010
