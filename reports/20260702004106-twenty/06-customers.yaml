- id: validation-and-proof-gaps
  title: Validation, retention, and customer-proof gaps
  body: |-
    Public validation is materially thinner than the valuation narrative. Outside contract reporting and buyer-oriented commentary, there are no disclosed customer counts, no renewal or retention metrics, no average contract sizes, and no named operational outcomes from the quoted government customers. The Navy agreement is especially illustrative: it is useful proof of buyer interest, but there is no public evidence that it converted into a larger production award. The intelligence-community claim is even more opaque because the customer set is unnamed.

    That thin proof does not mean the business lacks traction; it means traction is hard to price from public information alone. Offensive cyber programs are likely to stay classified, but investors still need alternative evidence such as follow-on awards, deployment durations, ATO cadence, or cohort-style revenue data. Until those are visible in diligence, Twenty’s customer case should be read as strategically validated but commercially under-disclosed. The company has clearly crossed the bar of relevance with at least some mission buyers, yet the public record still does not tell outsiders how sticky those relationships are or how broadly they are replicating.
