- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - CYBERCOM AI roadmap and task-force priorities
    - Demand tied to one mission ecosystem
    - Strong pull if aligned; downside if priorities shift
    - Map current programs to roadmap lines of effort and budget lines
  - - Classified intelligence-community demand
    - Opaque buyer mix and validation path
    - Potentially high-value accounts but hard to reference externally
    - Request agency mix, security boundary, and stage by program under NDA
  - - Forward-deployed delivery model
    - Labor dependence can cap scale
    - Improves embedment and switching costs but can compress margins
    - Review services gross margin, billable headcount mix, and deployment utilization
  - - Policy support for offensive cyber
    - Demand vulnerable to legal or administration changes
    - Can accelerate awards or freeze them depending on policy climate
    - Review pipeline by authority, contract type, and administration-sensitive program
  - - Compliance and contractor cyber enforcement
    - Documentation gaps can block awards or renewals
    - Procurement friction or FCA exposure if controls are weak
    - Review SSPs, incident-reporting process, and third-party assessment posture
  - - Talent pipeline via WVU and cleared recruiting
    - Capacity build may still lag demand
    - Helpful mitigant but not a substitute for customer diversification
    - Review hiring funnel, clearance timeline, and attrition in mission roles
  notes: Expansion and concentration risks are intertwined because the same high-trust government buyers that validate the product can dominate early revenue.
