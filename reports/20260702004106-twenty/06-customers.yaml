- id: concentration-switching-and-procurement-risk
  title: Concentration, switching, and procurement risk
  body: |-
    The main customer risk is concentration hidden behind classification. Because the public proof base is so narrow, a small number of DoD and intelligence relationships could account for a meaningful share of early revenue, but no disclosed metric allows investors to size that dependency. At the same time, once a capability is deployed inside sensitive mission workflows, switching may be hard. Cleared staff, on-site support, customer-specific integrations, and trust in human-in-the-loop controls all create embedment that a replacement vendor would need time to replicate. So the same deployment model that can improve durability can also amplify concentration if only a few programs matter.

    Procurement risk compounds that picture. Legal and policy commentary shows the role of private companies in offensive cyber operations remains under active debate, and the Center for Cybersecurity Policy and Law’s 2026 recap of offensive-cyber strategy discussions shows even industry-facing advocates still calling for clearer public-private operating frameworks before disruption campaigns can scale. NDU Press work on transparent cyber deterrence also illustrates why official appetite for offensive capability can rise quickly while still depending on tightly controlled signaling and state authority. Export or intelligence-assistance rules can also shift as government policy evolves. Government-contractor cyber enforcement raises the bar for documentation, secure development, and incident reporting. In practice, Twenty may face less risk of churn from a single technical feature gap than from a failure to satisfy oversight, compliance, or confidence requirements in a politically sensitive category.
