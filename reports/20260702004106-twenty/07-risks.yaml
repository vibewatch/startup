  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: compliance-attestations
    missingEvidence: Current CMMC, NIST 800-171, SSP/POA&M, export-screening, and incident-response attestations for mission environments.
    whyItMatters: Without this package, investors cannot judge whether policy and contractor-compliance risk is actively managed or simply assumed away.
    diligencePath: Request the latest compliance binder and outside-counsel export-control review before final investment approval.
    relatedQuestionRefs:
    - QR011
    - QR031
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: revenue-diversification
    missingEvidence: A customer and revenue concentration schedule showing program mix, renewals, and exposure to any single command or sponsor.
    whyItMatters: The difference between strategic relevance and scalable economics depends on whether demand is diversified and repeatable.
    diligencePath: Request cohort-level bookings, backlog, and renewal data by customer and authority.
    relatedQuestionRefs:
    - QR022
    - QR032
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: product-auditability
    missingEvidence: Quantitative evaluation results, operator override logs, red-team findings, and deployment audit trails for machine-speed workflows.
    whyItMatters: The central product risk is governability under real mission conditions, not merely whether the demos are compelling.
    diligencePath: Inspect evaluation harnesses, safety cases, and postmortems with technical diligence support.
    relatedQuestionRefs:
    - QR017
    - QR030
  - type: private-evidence-only
    severity: minor
    topic: brand-and-disclosure-surface
    missingEvidence: An explanation of domain strategy, trademarks, and why twenty.ai is parked while twenty.io carries the operating brand.
    whyItMatters: This is not thesis-breaking alone, but it is a trust and procurement hygiene signal worth clarifying.
    diligencePath: Ask management to map all owned domains, inactive assets, and buyer-facing procurement identities.
    relatedQuestionRefs:
    - QR025
  - type: private-evidence-only
    severity: material
    topic: authority-boundaries
    missingEvidence: A written matrix of legal authorities, mission approvals, and prohibited product behaviors for any operation touching third-party infrastructure.
    whyItMatters: The main downside scenario is a legal or political event caused by unclear boundary management.
    diligencePath: Have counsel and former government operators review the approval chain and product guardrails together.
    relatedQuestionRefs:
    - QR003
    - QR004
    - QR030
