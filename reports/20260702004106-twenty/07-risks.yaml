- id: TR003
  title: Partner / dependency risk register
  columns:
  - Dependency
  - Counterparty / system
  - Failure scenario
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Budget and mission demand
    - USCYBERCOM / DoD / IC sponsors
    - Demand slows if AI priorities, authorities, or appropriations shift
    - High
    - Map pipeline by budget line and quantify dependency on a small number of mission sponsors
  - - Investor / ecosystem signaling
    - Accel, In-Q-Tel, GC, defense-network investors
    - Strategic backing validates the story but can over-amplify expectations before unit economics are public
    - Medium
    - Separate true customer proof from sponsor reputation
  - - Talent pipeline
    - Former operators plus WVU internship pipeline
    - Mission growth outpaces ability to recruit cleared or clearance-eligible technical staff
    - High
    - Review time-to-fill for cleared roles and retention of key operators
  - - Adjacent primes / platforms
    - Booz, Palantir, Anduril and other mission-stack partners or competitors
    - Larger platforms absorb the workflow or win the prime position
    - Medium-High
    - Test whether Twenty is system-of-record, feature layer, or subcontractor in practice
  - - Brand and web presence
    - twenty.ai parked while twenty.io carries operating brand
    - Brand confusion or reputational mismatch weakens enterprise trust and discoverability
    - Medium
    - Clarify domain strategy, trademark posture, and buyer-facing procurement identity
  notes: Dependency risk is unusually concentrated around government budgets, ecosystem position, and scarce people rather than ordinary SaaS channel relationships.
