- id: TR002
  title: Operational / quality / security risk register
  columns:
  - Risk
  - Trigger / mechanism
  - Evidence
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Automation failure or hallucinated tradecraft
    - Agentic systems can overstate success or mis-handle edge cases under real operations
    - West Point + DARPA AIxCC + XBOW reporting
    - High
    - Inspect eval harnesses, red-team logs, false-positive rates, and human override procedures
  - - Tooling commoditization
    - Autonomous vulnerability discovery and patching is advancing rapidly across DARPA, XBOW, and commercial pentesting tools
    - DARPA AIxCC + CSO + DigitOwl + Horizon3
    - Medium-High
    - Demand a clear moat beyond lower-end automation, such as workflow integration, classified deployment, or data advantage
  - - OPSEC and secure-delivery failure
    - Machine-speed offensive tooling requires strong secure coding, segmentation, and audit trails
    - Hiring pages stress OPSEC, secure coding, and operational security procedures
    - High
    - Review SDLC, release controls, secrets management, and operator-environment segregation
  - - Model / data quality drift
    - Attack-path systems depend on current threat intelligence, graph data, and updated TTP libraries
    - Jobs emphasize ETL pipelines, graph schemas, and data enrichment
    - Medium
    - Request data-governance owner, retraining cadence, and mission-feedback loop evidence
  - - Support and deployment strain
    - A still-scaling org may struggle to support mission deployments, product breadth, and secure onboarding simultaneously
    - 39 open roles + multi-office hiring footprint
    - Medium
    - Request org chart, span-of-control, and deployment-support ratios by program
  notes: Operational risk centers on whether the company can turn elite operator knowledge into reliable, auditable software without sacrificing control.
