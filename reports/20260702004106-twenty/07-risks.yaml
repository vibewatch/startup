tables:
- id: TR001
  title: Regulatory / legal risk register
  columns:
  - Risk
  - Why it exists
  - Evidence
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Privatized OCO oversight gap
    - Lawfare and Bloomberg describe unresolved lines between government authority and contractor execution
    - Lawfare + Bloomberg Law + CRS CFAA sources
    - High
    - Obtain outside counsel memo on authorities, approvals, and operator accountability before underwriting scale
  - - Hack-back / CFAA exposure
    - U.S. law still draws a sharp line around unauthorized access and transmission-based damage
    - CRS CFAA primer + Lawfare hack-back analysis
    - High
    - Validate product guardrails, approval chain, and audit logs for any action that crosses third-party network boundaries
  - - Government-contractor cyber fraud exposure
    - Defense cybersecurity controls and representations are being enforced aggressively under DOJ and FCA theories
    - Fluet + Hogan Lovells + Bloomberg whistleblower commentary
    - High
    - Request CMMC, NIST 800-171, SSP/POA&M, incident-reporting, and disclosure controls evidence
  - - Human-rights / civil-liberties backlash
    - Spyware-adjacent government cyber contracts can trigger public pressure and policy intervention
    - HRW Paragon precedent + Lawfare privatization critique
    - Medium-High
    - Review acceptable-use policy, restricted-customer policy, and escalation process for sensitive deployments
  - - Political / policy reversibility
    - A more offensive posture may change with administrations, Congress, or headline incidents
    - Bloomberg strategy article + Lawfare framework
    - Medium
    - Map revenue exposure by authority, program sponsor, and policy scenario
  notes: This register ranks the most decision-relevant legal and policy risks rather than attempting a full legal memo across every authority.
  enumerationScope:
    coverage: partial
    basis: Rows cover the most visible legal, oversight, and regulatory exposures evidenced in the public record, not every statute or contracting clause that could apply to specific mission deployments.
