- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk area
  - Existing mitigation
  - Residual concern
  - Kill criterion / escalation trigger
  rows:
  - - Legal authority
    - Human-in-the-loop language and mission alignment framing
    - Public materials do not show the authority matrix or red-line controls
    - No written authority map or outside-counsel signoff for product boundaries
  - - Compliance posture
    - Experienced policy, finance, and government-contracting leadership
    - No public compliance attestation set or export-governance program details
    - Inability to produce CMMC/NIST/export-control readiness package
  - - Technical reliability
    - Elite-operator pedigree plus heavy R&D hiring
    - No public failure-rate, eval, or incident evidence
    - No quantitative eval results, rollback controls, or deployment auditability
  - - Customer concentration
    - Real contract traction and policy tailwinds
    - Public record still points to a narrow U.S. mission set
    - Top-program concentration or renewal dependence proves extreme
  - - Reputational resilience
    - Strong investors and patriotic mission narrative
    - Offensive cyber framing invites scrutiny after any misuse or public incident
    - A high-profile controversy, export investigation, or rights-related challenge without a credible response plan
  notes: Kill criteria convert broad national-security enthusiasm into investor gating conditions that can be verified during diligence.
