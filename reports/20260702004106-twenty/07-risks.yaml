- id: concentration-geopolitics-and-kill-criteria
  title: Customer Concentration, Geopolitical, and Thesis-Break Risk
  body: The final risk cluster is concentration. Publicly, Twenty is almost entirely framed around the U.S. military, intelligence community, and allied-national-security mission set. That may be strategically attractive, but it also means customer concentration, procurement friction, budget timing, and policy reversals can all hit at once. Public disclosures mention contract traction and broad national-priority narratives, yet they do not disclose revenue, customer count, renewal behavior, margin, or non-U.S. revenue mix. In effect, investors are being asked to underwrite a category leader before the public record shows how diversified or repeatable the revenue base is. Threat-intelligence and strategy sources support the macro urgency—China, Russia, Iran, and North Korea are active threats; U.S. agencies are investing in AI-enabled cyber operations; and the intelligence community wants deeper public-private collaboration. But macro urgency is not the same thing as durable program capture.
    If future contracts stall, if Congress or administrations tighten oversight on private offensive cyber, or if disclosure gaps hide a narrow customer base, the company could find that strategic relevance does not automatically convert into scalable economics. The right diligence stance is therefore trigger-based rather than reputation-based.
