- id: TR004
  title: People / execution risk register
  columns:
  - Execution risk
  - Public clue
  - Why it matters
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Founder-key-person concentration
    - Company messaging centers heavily on Joe Lin and a small founder bench
    - Category credibility, policy access, and customer trust may be founder-dependent early on
    - Medium-High
    - Ask for second-line leaders by product, mission delivery, and security governance
  - - Cleared-talent scarcity
    - Roles require DNEA/EA backgrounds, clearances, and rare offensive experience
    - Scarce labor can slow delivery or raise compensation faster than revenue
    - High
    - Review hiring funnel, clearance lag, and compensation inflation assumptions
  - - Cross-functional build-out risk
    - Open roles span product, data, finance, design, recruiting, and forward deployment
    - A fast-growing org can outrun process maturity
    - Medium-High
    - Inspect operating cadence, product-review discipline, and postmortem culture
  - - Distributed footprint complexity
    - Roles span Arlington, DC, Fort Meade, San Antonio, Augusta, NYC and SF
    - Security, culture, and deployment consistency get harder across sites
    - Medium
    - Request site-security model and location-by-function rationale
  - - Mission-to-product translation risk
    - Government customer feedback must be turned into reusable software, not bespoke services
    - The wrong mix can collapse software leverage into consulting intensity
    - High
    - Measure reusable product revenue versus bespoke deployment labor
  notes: These people risks are inferred from the talent profile required to deliver offensive cyber software at scale, not from disclosed HR metrics.
