company:
  name: "HawkEye 360"
chapter:
  number: 1
  title: "Company Overview"
  summary: "HawkEye 360 operates a 30-plus satellite constellation delivering commercial radio-frequency signals intelligence and finished analytics to U.S. and allied defense customers. In fiscal year 2025, the company crossed an operational inflection point with $98.7 million in revenue and $2.7 million in net income, backed by a $302.7 million funded backlog and $435.9 million raised in its May 2026 initial public offering. However, material customer concentration with the U.S. National Reconnaissance Office, post-IPO GAAP loss volatility, and missing public disclosures around active customer count and SaaS retention metrics require disciplined investor vigilance."
sections:
  - id: "corporate-identity"
    title: "Corporate Identity, Mission, and Operating Model"
    body: "HawkEye 360, Inc. was incorporated under Delaware law in September 2015 and operates from its corporate headquarters in Herndon, Virginia. As a commercial defense-technology enterprise, the company designs, deploys, and operates a proprietary constellation of formation-flying small satellites in low-Earth orbit to detect, geolocate, and characterize radio frequency (RF) emissions across maritime, terrestrial, and aerospace domains. The enterprise was incubated to commercialize foundational radio-frequency geolocation algorithms developed within academic research institutions, establishing the first commercial satellite constellation dedicated to space-based signals intelligence (SIGINT). Prior to completing its initial public offering in May 2026, the company elected public benefit corporation status under Delaware law, adopting a statutory public benefit charter to preserve the safety, security, and resilience of the American people and allied partner nations."
    claimRefs:
      - "CO001"
      - "CO003"
    tableRefs:
      - "TO001"
  - id: "executive-leadership"
    title: "Executive Leadership, Governance, and Key-Person Structure"
    body: "HawkEye 360 is led by President and Chief Executive Officer John Serafini, who has guided the organization since 2016 following its spinout. The executive leadership team pairs military and national security backgrounds with institutional financial discipline, featuring Chief Financial Officer Craig Searle, Chief Operating Officer Todd Probert, and International President Alex Fox. Founder Chris DeMay transitioned from day-to-day executive duties, leaving operational execution concentrated under Serafini and Probert. In December 2025, HawkEye 360 acquired defense signals processing firm Innovative Signal Analysis (ISA) for $150 million, subsequently installing dedicated business unit leadership under Cory Peichel and Mark Volpi to manage classified intelligence community workflows. Board oversight is anchored by Chairman Mark Spoto of Razor's Edge Ventures and NightDragon founder David DeWalt, establishing deep defense-venture alignment."
    claimRefs:
      - "CO002"
      - "CO011"
    tableRefs:
      - "TO002"
  - id: "capitalization-history"
    title: "Capitalization History, IPO Proceeds, and Ownership Structure"
    body: "Before its public listing, HawkEye 360 financed its orbital deployment through sequential preferred equity and debt rounds totaling over $300 million in private capital. In May 2026, the company completed a traditional initial public offering on the New York Stock Exchange under ticker HAWK, issuing 18.4 million shares of common stock at $26.00 per share and raising approximately $435.9 million in net cash proceeds. The offering enabled HawkEye 360 to refinance $48.6 million in outstanding mezzanine debt and fund deferred consideration for the ISA transaction. Beneficial ownership remains highly concentrated among top-tier defense and technology institutions, led by Insight Partners (18.0%), NightDragon (11.7%), GIC (8.5%), BlackRock (6.1%), and Razor's Edge Ventures II (6.1%), who together controlled over 50% of voting common stock prior to listing."
    claimRefs:
      - "CO007"
      - "CO012"
    tableRefs:
      - "TO003"
  - id: "operational-scale"
    title: "Operational Scale, Backlog Visibility, and Milestones"
    body: "HawkEye 360 reached an operational inflection point in fiscal year 2025, generating $98.7 million in revenue, up nearly 100% year-over-year, and delivering its first profitable year since inception with $2.7 million in net income. As of year-end 2025, the company maintained a funded contract backlog of $302.7 million, representing roughly 3.1 times forward annual revenue coverage and reflecting multi-year defense program commitments. Operating momentum continued into early 2026, with first-quarter revenue expanding 116.5% to $49.8 million and adjusted EBITDA reaching $7.4 million following the orbital deployment of satellite clusters 13 and 14. Revenue generation remains internationally diversified, with U.S. government agencies representing 61% and international allied partners accounting for 39%, including 16% from Japan and expanding naval maritime awareness partnerships across the Indo-Pacific."
    claimRefs:
      - "CO004"
      - "CO005"
      - "CO006"
      - "CO008"
      - "CO009"
    figureRefs:
      - "FO001"
  - id: "strategic-risks"
    title: "Customer Concentration, Valuation Headwinds, and Diligence Gaps"
    body: "Despite strong top-line growth and backlog coverage, HawkEye 360 faces material customer concentration and capital-market risks. U.S. government business drives the majority of revenues, with the National Reconnaissance Office alone accounting for 39% of 2025 sales and the top three customers generating 66%. Following second-quarter 2026 financial disclosures, HawkEye 360's stock price declined 7.2% as GAAP earnings flipped negative to a loss of $0.07 per share and investors reacted to an elevated forward valuation exceeding 190 times earnings. Furthermore, public filings omit key unit-economic indicators, including total customer account count, net revenue retention (NRR), and annual recurring revenue (ARR) breakdown across subscription versus professional service lines, necessitating targeted commercial diligence."
    claimRefs:
      - "CO010"
      - "CO013"
      - "CO014"
      - "CO015"
