    title: "Dual-Use RF Intelligence Platform Transition"
    body: "HawkEye 360's transition from unclassified raw RF geolocation to classified multi-domain intelligence processing via the ISA acquisition positions the company to capture higher-margin defense program dollars while maintaining shareable commercial feeds for international allies."
    claimRefs:
      - "CO003"
      - "CO009"
      - "CO011"
  - calloutType: "risk"
    title: "Public Sector Concentration and High Multiple Scrutiny"
    body: "With 66% of revenue concentrated in three government customers—led by the NRO at 39%—and forward valuation trading above 190 times earnings, HawkEye 360 remains highly vulnerable to federal procurement delays, defense budget shifts, and public market volatility."
