company:
  name: "HawkEye 360"
chapter:
  number: 6
  title: "Customers"
  summary: "HawkEye 360's customer base is anchored in U.S. defense agencies and allied governments, generating 87% year-over-year revenue growth to $49.8 million in Q2 2026 as international organic sales surged 134%. While major contract wins with the Indian Navy, NRO, and sovereign partners demonstrate production adoption, heavy dependence on government procurement cycles and the absence of disclosed net retention metrics create ongoing concentration and durability risks."
sections:
  - id: "customer-segmentation-and-public-sector-exposure"
    title: "Customer Base Segmentation and Public-Sector Exposure"
    body: "HawkEye 360's customer profile is heavily concentrated in government national security, maritime domain awareness, and intelligence agencies across the United States and allied foreign nations. According to disclosures in the company's SEC Form S-1 registration statement, U.S. government customers accounted for 61% of total revenue in fiscal year 2025, while Japan represented 16% and other international defense customers made up 23%. This government-centric revenue distribution reflects the specialized mission requirements of space-based signals intelligence, where military combatant commands, defense ministries, and national intelligence entities represent the primary paying buyers. The core product offering, RF Data Collection under the RFGeo brand, delivers raw and geolocated radio frequency observations and historically contributes between 45% and 50% of top-line revenue. Higher-layer analytics solutions, including the RFMosaic platform, represent 20% to 25% of revenue, serving tactical border enforcement and defense analysts requiring automated anomaly detection. Multi-domain classified processing capabilities added via the December 2025 acquisition of Innovative Signal Analysis contribute approximately 15% to 20% of revenue from air-gapped national security facilities. While government customers provide multi-year contract stability, this concentrated customer profile creates direct exposure to federal legislative and budgetary cycles."
    claimRefs:
      - "CU001"
      - "CU005"
      - "CU006"
      - "CU011"
    tableRefs:
      - "TU001"

  - id: "adoption-trajectory-and-international-expansion"
    title: "Adoption Trajectory and the Collect-Once-Sell-Many Model"
    body: "The commercial adoption trajectory for HawkEye 360 accelerated substantially across 2025 and the first half of 2026. Top-line revenue surged nearly 100% year-over-year in 2025 to reach $98.7 million, followed by an 87% year-over-year increase in the second quarter of 2026 to $49.8 million. This expansion demonstrates growing operational reliance on space-based radio frequency monitoring among defense customers seeking persistent visibility into contested maritime and land corridors. A critical driver of recent growth is international organic demand, which reached a record $21.0 million in Q2 2026—a 134% year-over-year organic increase that lifted international sales to over 42% of total quarterly revenue. Independent research from Morgan Stanley highlights that HawkEye 360 benefits from a scalable 'one-to-many' commercial data reuse model: because radio frequency emissions captured from orbit over strategic maritime passages can be processed and resold across multiple allied defense customers, incremental gross margins on subsequent data sales approach 80%. This architectural reuse decouples revenue growth from constellation capital expenditure, providing strong operating leverage as additional allied nations join shared regional maritime security coalitions."
    claimRefs:
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU009"
    tableRefs:
      - "TU002"

  - id: "named-customer-deployments-and-operational-proof"
    title: "Named Customer Deployments and Operational Field Proof"
    body: "Operational adoption of HawkEye 360's signals intelligence platform is validated by multi-year production deployments across major international defense and U.S. intelligence organizations. Under a multi-year Foreign Military Sales contract coordinated through the U.S. Navy's Naval Information Warfare Center Pacific, HawkEye 360 delivers daily RF geolocation and analytics directly to the Indian Navy and regional partner nations as part of the Indo-Pacific Maritime Domain Awareness initiative. The program integrates HawkEye 360's RFGeo data feed into the SeaVision maritime situational awareness platform, enabling naval operators to detect, cross-reference, and monitor dark vessels that have deliberately deactivated their Automatic Identification System transponders. In the United States, the National Reconnaissance Office awarded HawkEye 360 an integration contract to evaluate commercial radio frequency collection within classified national geospatial architectures, validating the technical maturity of commercial signals intelligence against stringent defense standards. Furthermore, during the Valiant Shield 2026 military exercise, HawkEye 360 demonstrated tactical integration with the Aegis weapon system, cutting RF data latency by over 50% relative to prior military exercises. Beyond shared data feeds, HawkEye 360 secured a landmark $100 million multi-year sovereign capacity transaction, dedicating orbital collection from two satellite clusters to a single allied nation."
    claimRefs:
      - "CU007"
      - "CU008"
      - "CU010"
    tableRefs:
      - "TU003"

  - id: "customer-journey-retention-and-concentration-risks"
    title: "Customer Journey, Retention Durability, and Concentration Risks"
    body: "HawkEye 360's customer expansion pathway progresses from unclassified pilot data trials to embedded enterprise software subscriptions and dedicated sovereign satellite constellations. However, diligence analysis reveals significant customer concentration and disclosure gaps that temper this commercial expansion narrative. While the company ended June 2026 with a robust funded contract backlog of $292.2 million, public financial disclosures omit standard software-as-a-service retention metrics, such as Net Revenue Retention, Gross Revenue Retention, and cohort-specific customer churn rates. Investors therefore cannot independently verify whether revenue expansion is driven by expanding contract value within mature accounts or solely by new contract bookings and acquired revenue from Innovative Signal Analysis. Furthermore, extreme dependence on government defense budgets creates operational vulnerability: legacy U.S. government revenue fell by $3.2 million in Q2 2026 due to contract delays induced by the U.S. federal government shutdown and continuing budget resolutions. These structural friction points contributed to market skepticism following Q2 2026 earnings, where the stock dropped 7.2% as a GAAP net loss of $15.3 million overshadowed revenue beats, underscoring investor sensitivity to defense customer procurement timelines and high forward valuation multiples."
    claimRefs:
      - "CU011"
      - "CU012"
      - "CU013"
      - "CU014"
    figureRefs:
      - "FU001"

