callouts:
  - calloutType: "risk"
    title: "Customer Concentration and Budget Volatility"
    body: "HawkEye 360 remains deeply tethered to U.S. federal defense spending cycles, where continuing resolutions and government shutdown threats directly resulted in a $3.2 million drop in legacy U.S. revenue in Q2 2026. While international diversification is accelerating, long government procurement lead times make quarter-over-quarter revenue lumpy."
    claimRefs:
      - "CU011"
  - calloutType: "insight"
    title: "Operating Leverage of the One-to-Many Data Reuse Model"
    body: "Because RF emissions collected over strategic waterways and conflict zones can be simultaneously distributed to the U.S. Navy, allied Pacific partners, and regional maritime initiatives, incremental gross margins on additional customer contracts approach 80%. This architectural reuse represents the core engine of HawkEye 360's long-term margin expansion."
    claimRefs:
      - "CU004"
      - "CU009"

