callouts:
  - calloutType: risk
    title: 'Dual Vulnerability: Propulsion Anomalies Compounded by Solar Maximum'
    body: The irreparable failure of Enpulsion IFM Nano Thrusters on Cluster 4 satellites forced HawkEye 360 to obtain emergency FCC authority to operate at 477 km rather than standard nominal orbits. While the company successfully mitigated future manufacturing risk by transitioning Cluster 7 and subsequent spacecraft to Bradford Space water propulsion, lower-altitude operations during solar maximum expose the constellation to heightened atmospheric drag and premature orbital degradation.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
