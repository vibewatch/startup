callouts:
  - calloutType: "risk"
    title: "Severe Customer Concentration in Federal Intelligence Accounts"
    body: "HawkEye 360's top three customers generate 61% of annual revenue (34%, 16%, and 11%), exposing the business to major program cancellation and budget reallocation risks. While multi-year backlog and allied sovereign partnerships such as the Indian Navy FMS award diversify the base, loss of any single primary customer would materially degrade cash flow."
    claimRefs:
      - "CI002"
      - "CI006"
      - "CI011"
      - "CI013"
  - calloutType: "insight"
    title: "Post-IPO Balance Sheet Transformation and Constellation Runway"
    body: "With $508.3 million in total cash and restricted cash, complete extinguishment of term debt, and an undrawn $125.0 million revolving credit line, HawkEye 360 has fully funded its constellation expansion through 2028, insulating operations from private venture capital financing dependencies."
    claimRefs:
      - "CI007"
      - "CI008"
      - "CI009"
