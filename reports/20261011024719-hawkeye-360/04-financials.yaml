  title: "Financials"
  summary: "HawkEye 360 reached $99.6 million in H1 2026 revenue (up 101% YoY) with $508.3 million in post-IPO liquidity, but forward underwriting is constrained by 61% customer concentration across three accounts, low visibility into IDIQ backlog conversion, and a GAAP net loss of $15.3 million in Q2 2026."
sections:
  - id: "revenue-streams-and-monetization-mechanics"
    title: "Revenue Streams and Monetization Mechanics"
    body: "HawkEye 360 has demonstrated rapid top-line revenue expansion following its May 2026 initial public offering, capitalizing on structural defense tailwinds and growing global demand for space-based radio frequency (RF) signals intelligence. In the second quarter of 2026, total revenue reached $49.8 million, an 87% year-over-year increase over the $26.6 million generated in the second quarter of 2025. Across the first six months of 2026, total recognized revenue expanded to $99.6 million, doubling the $49.6 million reported in the comparable prior-year period. Growth is increasingly propelled by allied international expansion, where quarterly revenue surged 134% to $21.0 million, representing over 42% of total Q2 revenue. This momentum is anchored by multi-year sovereign agreements, including a major foreign military sales award to enhance maritime domain awareness across the Indian Ocean Region using HawkEye 360's RFGeo data and SeaVision workflows. Management established full-year 2026 revenue guidance between $215.0 million and $220.0 million, supported by an expanding commercial and sovereign customer base."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI010"
      - "CI011"
    tableRefs:
      - "TI001"
    figureRefs:
      - "FI001"
  - id: "cost-structure-and-margins"
    title: "Cost Structure, Gross Margins, and Operational Leverage"
    body: "The core unit economics of HawkEye 360 reflect the favorable operating leverage inherent to a satellite constellation data provider. Because constellation collection costs are predominantly fixed capital outlays, marginal data delivery costs remain modest. The company reported a gross margin excluding depreciation and amortization of approximately 82% in fiscal 2025, demonstrating substantial data reusability across multiple customers. Direct cost of sales excluding depreciation and amortization was $14.9 million in Q2 2026 and $30.9 million for the first half of 2026. However, operating expenses scaled significantly following the IPO and the acquisition of Innovative Signal Analysis (ISA), with Q2 selling, general, and administrative expenses climbing to $25.0 million and research and development rising to $8.2 million. Adjusted EBITDA for Q2 2026 was $7.0 million (compared to $7.8 million in Q2 2025), bringing H1 Adjusted EBITDA to $14.4 million and highlighting ongoing operational investments in constellation scaling and military radar algorithm automation."
    claimRefs:
      - "CI003"
      - "CI005"
      - "CI010"
      - "CI014"
    tableRefs:
      - "TI002"
  - id: "capital-adequacy-and-liquidity"
    title: "Capital Adequacy, Cash Flow, and Balance Sheet Solvency"
    body: "HawkEye 360's balance sheet underwent a fundamental recapitalization through its May 2026 initial public offering, which raised $437.5 million in net proceeds through the sale of 18.4 million common shares at $26.00 per share. As of June 30, 2026, the company held $503.4 million in cash and cash equivalents and $4.99 million in restricted cash, giving it $508.3 million in total liquidity. The company extinguished its $49.5 million term loan obligation and established a new five-year $125.0 million revolving credit facility maturing in May 2031. Operating cash flow inflected positively to $11.6 million in Q2 2026, generating $5.4 million in free cash flow after $6.2 million in satellite, property, and equipment capital expenditures. With Block 3 satellites reducing cluster capital intensity by up to 75% relative to earlier generations, HawkEye 360 possesses adequate multi-year runway to fund constellation replacement and Block 3 Kestrel launches without external equity financing."
    claimRefs:
      - "CI007"
      - "CI008"
      - "CI009"
      - "CI012"
    tableRefs:
      - "TI003"
  - id: "financial-verdict-and-diligence-blockers"
    title: "Financial Underwriting Verdict and Diligence Gaps"
    body: "While HawkEye 360 exhibits robust revenue acceleration and strong post-IPO liquidity, financial underwriting faces substantial structural headwinds. The company posted a GAAP net loss of $15.3 million in Q2 2026 (a negative swing from $1.6 million GAAP net income in Q2 2025), driven by higher depreciation, stock-based compensation, and fair value adjustments. This GAAP loss triggered a 7.2% single-day stock selloff as public markets scrutinized a valuation trading above 190 times forward earnings. Furthermore, revenue concentration remains acute, with the top three government customers accounting for 61% of fiscal 2025 sales (34%, 16%, and 11% respectively). Backlog quality also warrants investor scrutiny: of the $292.2 million reported backlog as of June 30, 2026, management includes unexercised single-award IDIQ ceiling where no task orders have been issued, as well as cancellable contract values. Diligence cannot verify private unit economics such as customer acquisition cost, payback periods, or net revenue retention, leaving forward profitability sensitive to defense appropriation stability."
    claimRefs:
      - "CI004"
      - "CI006"
      - "CI013"
      - "CI015"
