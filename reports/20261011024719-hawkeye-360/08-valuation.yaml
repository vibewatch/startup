    title: "Valuation Assessment: Maintain 'Track' Stance"
    body: "While HawkEye 360 has proven exceptional technological differentiation and top-line growth (+116.5% YoY in Q1 2026), its public valuation ($1.37B market cap, 6.3x forward revenue) reflects substantial growth expectations against ongoing GAAP losses and 61% U.S. government revenue concentration. We recommend tracking the stock until second-half 2026 earnings demonstrate operating leverage and contract diversification."
