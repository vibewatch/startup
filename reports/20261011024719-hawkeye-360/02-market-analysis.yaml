callouts:
  - calloutType: "insight"
    title: "The Divergence Between Broad TAM Disclosures and Specialized Constellation Spend"
    body: "A critical structural nuance in RF intelligence diligence is the massive gap between management's top-down $24B to $35B market sizing and independent analyst estimates of a $1.2B to $1.4B dedicated constellation market in 2024. The broader figure reflects aggregated multi-domain electronic warfare, sovereign defense procurement, and enterprise software budgets, whereas pure-play space-based RF geolocation remains a specialized, fast-growing slice. Underwriting the company requires recognizing that revenue capture will be gated by sovereign defense conversion rather than passive participation in a generic $35B market."
    claimRefs:
      - "CM001"
      - "CM005"
      - "CM010"
  - calloutType: "risk"
    title: "Concentration and Valuation Friction in Public Execution"
    body: "While HawkEye 360 demonstrates robust top-line momentum with 2026 revenue guided to $215M to $220M and strong international traction, the business model carries valuation friction. A GAAP net loss of $15.3M in Q2 2026 and an elevated forward valuation multiple near 190 times earnings leave limited margin for execution error. Launch manifest delays, U.S. government budget continuing resolutions, or extended sovereign procurement cycles could quickly compress public valuation multiples."
    claimRefs:
      - "CM010"
      - "CM011"
      - "CM012"
      - "CM013"
