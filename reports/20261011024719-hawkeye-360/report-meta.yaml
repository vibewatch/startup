  topStrengths:
    - Proprietary RF-geolocation constellation and data archive create a differentiated defense intelligence moat.
    - Revenue growth, backlog visibility, and post-IPO liquidity support near-term operating resilience.
    - International sovereign adoption broadens the customer base beyond the core U.S. defense market.
  topRisks:
    - U.S. government concentration leaves revenue highly exposed to procurement cycles and budget timing.
    - Product-level recurring revenue, retention, and backlog conversion remain opaque.
    - Capital intensity and public-market multiple compression limit upside from current valuation.
  unresolvedGaps:
