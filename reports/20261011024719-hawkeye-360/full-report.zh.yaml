      - number: '7.4'
        title: 财务模型、资本密集度与公开市场估值压力
        blocks:
          - type: paragraph
            body: >-
              HawkEye 360 在 2026 年第一季度实现 $49.8 million 营收，但仍录得 $9 million 的 GAAP 净亏损，凸显卫星星座部署和 研发摊销持续消耗资本。公司在 2026
              年第二季度实现 $5.4 million 正向自由现金流，并将全年营收指引定在 $215 million 至 $220 million；但 IPO
              后，市场情绪仍对估值溢价和持续盈利能力十分敏感。二季度业绩公布后，股价下跌 7.2%，因为 公开市场同时权衡持续的 GAAP 经营亏损、$48.6 million 历史债务，以及宏观环境波动下偏高的远期盈利倍数。
            claimRefs:
              - CR008
