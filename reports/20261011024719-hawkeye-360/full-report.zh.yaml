      - number: '7.3'
        title: 公共部门客户集中度与主权伙伴依赖
        blocks:
          - type: paragraph
            body: >-
              HawkEye 360 的客户高度集中，商业可行性直接系于国防拨款和地缘政治联盟。2025 财年，美国客户贡献了公司总收入的 61%，其中以联邦情报和国防机构为主；日本客户另贡献 16% 的销售额。公开披露的
              $302.7 million 有资金保障的 backlog 为近期项目提供了可见性，但采购周期波动、持续决议延期或国防重点变化，都可能造成严重的营收波动。此外，
              在印太海事态势感知倡议下拓展国际海上监视，要求公司持续与东道国海上安全框架及美国双边外交政策目标保持一致。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR015
