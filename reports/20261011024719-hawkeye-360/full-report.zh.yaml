  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础细分与公共部门敞口
        blocks:
          - type: paragraph
            body: >-
              HawkEye 360 的客户高度集中于美国及盟国的政府国家安全、海事态势感知和情报机构。根据公司 SEC Form S-1 注册声明，美国政府客户贡献 FY2025 总营收的 61%，日本占
              16%，其他国际国防客户占 23%。这一以政府为中心的营收分布反映了太空信号情报的专门任务需求，军方战区司令部、国防部和国家情报实体是主要付费买方。RFGeo 品牌下的 RF Data Collection
              是核心产品，提供原始和定位后的射频观测，历史上贡献总营收的 45% 至 50%。RFMosaic 等高层分析方案占 20% 至 25%，服务需要自动异常检测的边境执法和国防分析师。2025 年 12 月收购
              ISA 后增加的多域涉密处理能力，约贡献 15% 至 20% 营收，客户来自隔离式国家安全设施。政府客户带来多年期合同稳定性，但这种集中客户结构也使公司直接暴露于联邦立法和预算周期。
            claimRefs:
