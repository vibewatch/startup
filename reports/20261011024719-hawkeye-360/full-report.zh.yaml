      - number: '6.2'
        title: 采用轨迹与一次采集、多次销售模式
        blocks:
          - type: paragraph
            body: >-
              HawkEye 360 的商业采用在 2025 年和 2026 年上半年显著加速。2025 年总营收同比增长接近 100% 至 $98.7 million，随后 Q2 2026 又同比增长 87% 至 $49.8
              million。这一扩张说明国防客户越来越依赖太空射频监测，以持续看清争议海域和陆地走廊。近期增长的关键驱动力是国际自然需求：Q2 2026 达到创纪录的 $21.0 million，同比自然增长
              134%，将国际销售提升至季度总营收的 42% 以上。Morgan Stanley 独立研究指出，HawkEye 360
              受益于可规模化的一对多商业数据复用模式：从轨道采集的战略海域射频信号可以处理后卖给多个盟国国防客户，后续数据销售的增量毛利率接近
              80%。这种架构复用把营收增长与星座资本支出脱钩，随着更多盟国加入共享区域海事安全联盟，运营杠杆进一步增强。
            claimRefs:
