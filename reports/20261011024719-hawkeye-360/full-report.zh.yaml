chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、使命与运营模式
        blocks:
          - type: paragraph
            body: >-
              HawkEye 360, Inc. 于 2015 年 9 月依特拉华州法律注册成立，总部位于弗吉尼亚州
              Herndon。作为商业国防科技企业，公司设计、部署并运营自有编队飞行小卫星星座，在低地球轨道探测、定位和刻画海事、陆地及航空航天领域的射频（RF）发射。公司最初在学术研究机构孵化，将基础射频定位算法商业化，建成首个专用于太空信号情报（SIGINT）的商业卫星星座。2026
              年 5 月 IPO 前，公司依据特拉华州法律选择公共利益公司身份，并采用法定公共利益章程，以维护美国人民及盟国伙伴的安全、安保与韧性。
            claimRefs:
              - CO001
              - CO003
          - type: table
            tableRef: TO001
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO008
              - CO014
              - CO015
      - number: '1.2'
        title: 高管领导、治理与关键人物结构
        blocks:
          - type: paragraph
            body: >-
              HawkEye 360 由总裁兼 CEO John Serafini 领导；公司 2016 年剥离后，他一直负责带队。管理层把军方和国家安全背景与机构化财务纪律结合起来，成员包括 CFO Craig
              Searle、COO Todd Probert 和国际总裁 Alex Fox。创始人 Chris DeMay 已退出日常管理，运营执行主要集中在 Serafini 和 Probert 手中。2025 年 12
              月，公司以 $150 million 收购国防信号处理公司 Innovative Signal Analysis（ISA），随后由 Cory Peichel 和 Mark Volpi
              负责专门业务单元，管理涉密情报机构工作流。董事会由 Razor's Edge Ventures 主席 Mark Spoto 和 NightDragon 创始人 David DeWalt
              等人把关，国防与创投协同关系深厚。
            claimRefs:
              - CO002
              - CO011
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO002
              - CO011
      - number: '1.3'
        title: 资本化历程、IPO 募资与所有权结构
        blocks:
          - type: paragraph
            body: >-
              上市前，HawkEye 360 通过连续的优先股和债务融资为轨道部署提供资金，私人资本总额超过 $300 million。2026 年 5 月，公司在纽约证券交易所按传统 IPO 上市，股票代码为
              HAWK，以每股 $26.00 发行 18.4 million 股普通股，募得约 $435.9 million 现金净额。此次发行使公司能够再融资 $48.6 million 未偿夹层债务，并支付 ISA
              交易的递延对价。受益所有权高度集中于头部国防和科技机构：Insight Partners（18.0%）、NightDragon（11.7%）、GIC（8.5%）、BlackRock（6.1%）和 Razor's
              Edge Ventures II（6.1%）领衔，上市前合计控制超过 50% 的有表决权普通股。
            claimRefs:
              - CO007
              - CO012
