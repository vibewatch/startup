      - number: '5.2'
        title: 太空段架构与编队飞行硬件
        blocks:
          - type: paragraph
            body: >-
              HawkEye 360 的技术基础是由 30 多颗运营微型卫星组成的星座，卫星位于 400 至 600 kilometers
              高度的低地球轨道，并运行于太阳同步轨道。卫星不是孤立观测节点，而是以集群形式进行三卫星协同编队飞行，保持 125 至 250 kilometers
              的基线间隔，从而同时在三个空间向量上测量射频信号。航天器制造和平台工程经历多个生产批次：最初是 University of Toronto Institute for Aerospace Studies
              Space Flight Laboratory 为 2018 年 Pathfinder 任务开发的 13.4-kg NEMO-15 总线，随后过渡到用于 Clusters 2 至 12 的 30-kg
              DEFIANT 平台。每颗卫星都装有电热水推进系统，约提供 96 m/s delta-V，用于低风险轨道保持、每周编队维护和寿命末期离轨。传感载荷以双通道软件定义无线电（SDR）为核心，可在 70 MHz 至 6
              GHz 间调谐，瞬时带宽 56 MHz，并借助低噪声块下变频器扩展至 18 GHz（Ku-band），以捕捉更高频的海军和航空雷达系统。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE005
              - CE006
