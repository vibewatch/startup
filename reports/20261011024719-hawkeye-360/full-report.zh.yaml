      - number: '1.5'
        title: 客户集中度、估值压力与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              尽管营收增长强劲、待执行合同覆盖充分，HawkEye 360 仍面临显著的客户集中和资本市场风险。美国政府业务贡献大部分营收，National Reconnaissance Office 单独占 2025
              年销售额的 39%，前三大客户合计贡献 66%。2026 年第二季度财务披露后，GAAP 盈利转为每股亏损 $0.07，投资者对超过 190 倍预期市盈率的高估值作出反应，股价下跌
              7.2%。此外，公开申报缺少关键单位经济指标，包括客户账户总数、净收入留存率（NRR），以及订阅业务与专业服务业务之间的年度经常性收入（ARR）拆分，因此需要开展有针对性的商业尽调。
            claimRefs:
              - CO010
              - CO013
              - CO014
              - CO015
