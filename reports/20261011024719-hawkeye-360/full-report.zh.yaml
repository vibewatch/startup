      - number: '6.3'
        title: 已命名客户部署与运营现场验证
        blocks:
          - type: paragraph
            body: >-
              HawkEye 360 的信号情报平台已通过国际主要国防组织和美国情报机构的多年期生产部署得到运营验证。根据由美国海军 Naval Information Warfare Center Pacific
              协调的多年期对外军售合同，公司每天直接向印度海军及区域伙伴国交付射频定位和分析服务，作为印太海事态势感知倡议的一部分。该项目将 RFGeo 数据流接入
              SeaVision，使海军人员能够发现、交叉核验并监视刻意关闭 AIS 转发器的暗船。美国 National Reconnaissance Office 还授予 HawkEye 360
              集成合同，用于在涉密国家地理空间架构中评估商业射频采集，以严格国防标准验证商业信号情报的技术成熟度。Valiant Shield 2026 军事演习期间，公司展示了与 Aegis
              武器系统的战术集成，相比此前演习将射频数据延迟降低超过 50%。除共享数据流外，公司还获得一笔具有里程碑意义的 $100 million 多年期主权容量交易，把两座卫星集群的轨道采集能力专供一个盟国使用。
            claimRefs:
              - CU007
              - CU008
              - CU010
          - type: table
            tableRef: TU003
            claimRefs:
              - CU007
              - CU008
              - CU010
      - number: '6.4'
        title: 客户旅程、留存韧性与集中风险
        blocks:
          - type: paragraph
            body: >-
              HawkEye 360 的客户扩张路径从非涉密试点数据测试，逐步走向嵌入式企业软件订阅和专用主权卫星星座。但尽调发现显著客户集中度和披露缺口，削弱了这一商业扩张叙事。公司截至 2026 年 6 月拥有
              $292.2 million 资金已落实的合同待执行额，但公开财务披露缺少标准 SaaS 留存指标，例如净收入留存、毛收入留存和按 cohort
              划分的客户流失率。因此投资者无法独立判断营收扩张来自成熟账户合同价值提升，还是仅来自新合同签订和收购 ISA 带来的收入。公司还高度依赖政府国防预算，形成运营脆弱性：2026
              年第二季度，受美国联邦政府停摆和持续预算决议引发的合同延迟影响，传统美国政府营收减少 $3.2 million。Q2 2026 财报后，股价下跌 7.2%，GAAP 净亏损 $15.3 million
              盖过营收超预期，反映市场对国防客户采购时序和高预期估值倍数的敏感度。
            claimRefs:
              - CU011
              - CU012
              - CU013
              - CU014
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU005
              - CU006
              - CU009
              - CU010
      - number: '6.5'
        title: 图表
        blocks:
          - type: callout
            title: 客户集中度与预算波动
            body: HawkEye 360 深度绑定美国联邦国防支出周期；持续决议和政府停摆威胁直接导致 Q2 2026 传统美国营收减少 $3.2 million。国际多元化虽在加速，但政府采购周期长，使季度环比营收波动明显。
            calloutType: risk
            claimRefs:
              - CU011
          - type: callout
            title: 一对多数据复用模式的运营杠杆
            body: 由于在战略水道和冲突地区采集的射频信号可以同时分发给美国海军、太平洋盟国伙伴和区域海事倡议，新增客户合同的增量毛利率接近 80%。这种架构复用是 HawkEye 360 长期利润率扩张的核心引擎。
            calloutType: insight
            claimRefs:
              - CU004
              - CU009
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管合规、频谱许可与公司治理
        blocks:
          - type: paragraph
            body: >-
              HawkEye 360 在 FCC、NOAA 和联邦出口管制机构的严格双用途监管下运营商业信号情报卫星。轨道推进异常影响 Cluster 4 卫星机动时，公司向 FCC 申请特别临时授权，以 400 至 615
              kilometers 的较低高度运行，最终取得轨道参数调整。由于对外军售是战略扩张方向，印度海军印太海事态势感知等国际国防合同通过美国海军 NIWC Pacific
              框架执行，以满足《国际武器贸易条例》。上市后，董事会建立正式审计委员会治理机制，负责监督法律、会计、税务和运营风险。
            claimRefs:
              - CR001
              - CR012
              - CR015
