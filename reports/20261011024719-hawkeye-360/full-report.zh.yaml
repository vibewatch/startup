              - CV010
              - CV011
      - number: '8.3'
        title: 决策框架与推荐逻辑
        blocks:
          - type: paragraph
            body: >-
              将 HawkEye 360 的运营规模、竞争壁垒和市场定价纳入统一决策框架，可以看出，对机构投资者而言，保持纪律性的 “跟踪”立场最为合适。推荐逻辑从 $24 billion 的全球 RF
              开发可服务市场出发，逐步经过技术与合同验证。              HawkEye 自有星座和机器学习处理栈具备较高毛利率潜力，2026 年第一季度营收 $49.8 million、调整后 EBITDA
              为正且达 $7.4 million，均为佐证。此外，$285 million 的有资金保障 backlog 为近期营收提供了切实支撑。不过，客户集中风险 （美国政府占 61%）以及 Block 3
              卫星补充所需的资本开支，限制了估值倍数的即时扩张。股价从 IPO 价格回落 47%、 当前稳定在 $13.70，市场已经大幅消化了初始估值过高的风险。但在管理层提供经审计的分部数据、明确纯经常性订阅软件
              收入与转售型硬件集成服务之前，入场仍应择机且对价格保持敏感。
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV009
              - CV013
              - CV014
              - CV015
