figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 按时间梳理公司成立、星座部署、收购及上市等里程碑。
    data:
      items:
        - label: 2015 年 9 月：公司成立
          date: 2015-09
          detail: 在特拉华州注册成立，将源自学术研究的天基射频地理定位算法商业化。
        - label: 2018 年 12 月：Pathfinder 星座发射
          date: 2018-12
          detail: 搭载 SpaceX Falcon 9 SSO-A 任务发射首组三颗 Pathfinder 小卫星，验证商业 RF 地理分析。
        - label: 2019 年 12 月：NRO 合同与 B 轮融资
          date: 2019-12
          detail: 与国家侦察局（NRO）签下首份运营合同，并完成 $70M B 轮融资。
        - label: 2021 年 11 月：D 轮融资
          date: 2021-11
          detail: 由 Insight Partners 领投完成 $145M D 轮融资，加速星座制造及国际客户拓展。
        - label: 2023 年 4 月：收购 Maxar 射频资产
          date: 2023-04
          detail: 从 Maxar Technologies 收购 Aurora Insight 射频资产，增加两颗卫星及高频 Ka 波段频谱能力。
        - label: 2025 年 12 月：收购 ISA 并实现 FY25 盈利
          date: 2025-12
          detail: 以 $150M 收购 Innovative Signal Analysis，拓展机密信号处理业务；实现首个盈利年度（净利润 $2.7M）。
        - label: 2026 年 5 月：纽交所首次公开募股
          date: 2026-05
          detail: 以 HAWK 代码在纽交所上市，发行 18.4M 股、每股 $26.00，募集净额 $435.9M。
        - label: 2026 年 8 月：Q2 2026 财务结果与市场反应
          date: 2026-08
          detail: 报告 Q2 销售额 $49.8M；GAAP 净亏损再现，市场重新评估 190 倍前瞻估值倍数，股价下跌 7.2%。
    approximationNotes: 日期与里程碑描述依据 SEC 注册披露、公司新闻稿及财经新闻报道。
