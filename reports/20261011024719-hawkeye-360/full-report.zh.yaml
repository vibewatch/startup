              HawkEye 360 的核心技术壁垒在于编队卫星集群的运营同步：集群无需合作信标即可执行 TDOA 和 FDOA 双重多点定位。公司把 SFL 的高精度姿态控制和微推进，与覆盖 70 MHz 至 18 GHz
