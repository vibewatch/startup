companyProfile:
  summary: >-
    HawkEye 360 是一家上市商业射频情报公司，运营由 30 多颗卫星组成的 LEO
    星座，为国防和海事安全客户探测、定位并刻画射频发射源。公司把原始射频数据产品、分析软件和涉密任务支持结合起来，美国及盟国主权市场贡献了大部分需求。公司于 2026 年 5 月登陆公开市场，近期财务表现显示营收增长强劲、调整后
    EBITDA 为正、现金规模显著扩大，但客户集中度高，持续性收入的经济特征仍不透明。
