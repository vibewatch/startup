            body: >-
              HawkEye 360 提供商业射频数据和地理空间分析，用于监视、刻画和定位海事、陆地及争议区域内的非合作电子发射。对手和非法行为者经常关闭 AIS
              转发器或发送伪造坐标来规避监视，给光学影像和传统跟踪雷达留下盲区。HawkEye 360 直接从轨道采集海事导航雷达、卫星通信终端和战术对讲机等环境射频信号，不依赖合作式广播即可三角定位。公司将探测结果封装为
              RFGeo 数据流、Mission Space 等态势软件平台及 SEAker 等区域安全数据流。印度海军等政府客户把处理后的信号层接入 SeaVision、Esri ArcGIS 等运营环境。通过标准 REST
              API 和订阅式云交付，分析师可获得带 95% 置信误差椭圆的定位向量，帮助指挥官调度巡逻资产，并为光学或合成孔径雷达（SAR）卫星提示目标。
