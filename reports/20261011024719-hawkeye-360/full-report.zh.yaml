  - id: FE001
    title: HawkEye 360 产品与技术架构图
    type: stack
    summary: 六层架构拆解，展示从天基 RF 采集、编队飞行轨道控制，到安全云端 ETL、信号分析及客户交付的端到端数据流。
    data:
      layers:
        - name: 1. Spaceborne Collection Layer
          label: 天基采集层
          detail: 30+ 颗低轨微型卫星组成三星星座，搭载双 SDR 接收机，覆盖 70 MHz 至 18 GHz
          modules:
            - 瞬时带宽 56 MHz 的软件定义无线电（SDR）
            - 低噪声模块（LNB）下变频器，将覆盖范围延伸至 18 GHz Ku 波段
            - 双机载飞行计算机（HKC 遥测与 ADCC 姿态控制）
        - name: 2. Precision Orbital Formation Layer
          label: 精密轨道编队层
          detail: SFL 30 kg DEFIANT 与 NEMO-15 卫星平台维持 125—250 km 基线
          modules:
            - 配备星敏感器与反作用轮的闭环三轴姿态控制
            - 通过 GPS 时钟同步，实现星座间微秒级时间标记
            - 用于定点保持机动的水基电热推进（~96 m/s delta-V）
        - name: 3. Ground Downlink & Transmission Layer
          label: 地面下行与传输层
          detail: 通过全球地面站联络直接捕获 RF 下行数据
          modules:
            - 运行速率 3 至 50 Mbps 的主 X 波段下行信道
            - 用于遥测与带时间标记任务分配的辅 S 波段及 UHF 链路
            - 分布式地面站过站调度，尽量降低轨道采集延迟
        - name: 4. Cloud Data Lake & Orchestration Layer
          label: 云数据湖与编排层
          detail: 部署在 Amazon Web Services 上的企业级无服务器 ETL 与数据湖基础设施
          modules:
            - Amazon S3 原始及处理后对象存储，用于 PB 级 RF 档案
            - AWS Lambda 与 AWS Glue 无服务器转换管道
            - AWS Lake Formation 访问治理、加密与合规控制
        - name: 5. Signal Exploitation & ML Analytics Layer
          label: 信号开发与 ML 分析层
          detail: 多点定位算法与专有 RF 发射源匹配库
          modules:
            - TDOA（双曲线时间差）与 FDOA（多普勒频移）地理定位引擎
            - Innovative Signal Analysis（ISA）高级信号特征分析算法
            - 与 1B+ 条机密发射源记录进行历史特征匹配
        - name: 6. Operational Integration & Mission Delivery Layer
          label: 运营集成与任务交付层
          detail: 向任务合作伙伴交付地理定位矢量的 API 与软件分发接口
          modules:
            - 用于端到端任务分配及 GeoJSON 矢量交付的 REST Collections API
            - 用于提示与引导的 Mission Space 与 SEAker Web 分析应用
            - 外部态势感知集成（NIWC SeaVision 与 Esri ArcGIS）
    approximationNotes: 层级拆解综合了 HawkEye 360 技术披露、eoPortal 任务规格、SFL 工程出版物及 AWS 合作伙伴架构文档。
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE006
      - CE007
      - CE009
      - CE010
      - CE012
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 梳理 RF 情报采用阶段的客户旅程，从首次访问数据扩展至嵌入式工作流及专用主权星座容量。
    approximationNotes: 工作流阶段及触点转换综合自 HawkEye 360 商业定价模型、合同公告及业绩电话会评论。
    data:
      items:
        - label: 初步评估
          stage: 初步评估
          segment: U.S. & Allied Defense
          description: 通过试点演练与非机密测试数据流评估原始 RF 数据可行性。
          touchpoints:
            - 通过商业门户提供试点数据授权
            - 技术能力演示（如 Valiant Shield）
          metric: Pilot participation
          expansionMechanism: Demonstration of RF emitter detection where optical/SAR satellites fail
        - label: 数据订阅（RFGeo）
          stage: 数据订阅（RFGeo）
          segment: Commercial & Defense Intelligence
          description: 订阅陆地与海域每日 RF 信号地理定位数据流。
          touchpoints:
            - 直接通过 API 集成至运营指挥中心
            - 每日 RFGeo 地理空间数据流
          metric: 45% to 50% of company revenue
          expansionMechanism: Expansion of monitored geographic zones and frequency bands
        - label: 分析集成（RFMosaic）
          stage: 分析集成（RFMosaic）
          segment: Tactical Military & Border Security
          description: 采用自动化行为模式分析及 AI 驱动的发射源异常检测。
          touchpoints:
            - 部署 RFMosaic 分析软件
            - 自动化船舶隐踪告警
          metric: 20% to 25% of company revenue
          expansionMechanism: Upsell from raw data to higher-margin situational awareness software
        - label: 多域机密处理
          stage: 多域机密处理
          segment: Top-Tier National Security Agencies
          description: 将 ISA 算法集成至机密、物理隔离的国防架构。
          touchpoints:
            - 部署在安全的 SCIF 环境内
            - 定制雷达与电子战处理管道
          metric: 15% to 20% of company revenue
          expansionMechanism: Multi-year classified enterprise umbrella contracts
        - label: 国际 FMS 项目
          stage: 国际 FMS 项目
          segment: Allied Foreign Navies & Ministries
          description: 与态势感知平台捆绑的政府间采购。
          touchpoints:
            - 美国对外军售协议
            - SeaVision 平台集成与海军培训研讨会
          metric: 134% YoY international growth
          expansionMechanism: Regional maritime domain awareness alliances (e.g. IPMDA)
        - label: 专用主权星座
          stage: 专用主权星座
          segment: Major Allied Sovereign Nations
          description: 通过直接合同分配专用卫星星座采集时间与任务。
          touchpoints:
