              - CO012
      - number: '1.4'
        title: 运营规模、待执行合同可见度与里程碑
        blocks:
          - type: paragraph
            body: >-
              HawkEye 360 在 FY2025 迎来运营拐点，营收达到 $98.7 million，同比增幅接近 100%，并实现自成立以来首个盈利年度，净利润为 $2.7 million。2025 年末，公司拥有
              $302.7 million 的已获资金合同待执行额，约覆盖未来年度营收的三点一倍，体现多年期国防项目承诺。运营势头延续至 2026 年初：随着第 13、14 号卫星集群入轨部署，一季度营收增长 116.5% 至
              $49.8 million，调整后 EBITDA 达 $7.4 million。营收来源仍具国际多元性：美国政府机构占 61%，国际盟国伙伴占 39%，其中日本贡献 16%，印太地区海军海事态势感知合作也在扩张。
