      - number: '5.3'
        title: 信号处理、TDOA/FDOA 定位与云端流水线
        blocks:
          - type: paragraph
            body: >-
              为把原始数字化射频波形转成精确地理空间情报，HawkEye 360 使用结合到达时间差（TDOA）和到达频率差（FDOA）的混合处理架构。发射源发射时，三颗编队卫星通过机载 GPS
              接收器同步记录带微秒级时间戳的信号。TDOA 计算卫星对之间的到达时间差，在地球表面生成相交双曲线；FDOA
              则测量卫星相对轨道速度造成的差分多普勒频移。两者结合后形成由计算误差椭圆界定的精确唯一定位。原始信号在计划好的地面站过站期间通过 X-band 下传，数据速率为 3 至 50 Mbps，并由 S-band 和
              UHF 链路辅助。地面处理在 Amazon Web Services（AWS）上的企业云数据湖中进行。与 Effectual 合作建设的数据流水线使用 Amazon S3 做 PB 级存储，使用 AWS
              Lambda 和 AWS Glue 做无服务器提取转换，并用 AWS Lake Formation 管理访问和合规。2025 年末收购 ISA 后，HawkEye 360
              的算法库进一步扩展，加入高级波形过滤和自动发射源分类，可对照专有的历史射频信号特征数据库。
            claimRefs:
              - CE002
              - CE003
              - CE007
              - CE008
              - CE012
