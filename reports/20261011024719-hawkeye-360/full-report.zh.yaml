      - number: '7.5'
        title: 图表
        blocks:
          - type: callout
            title: 双重脆弱性：推进异常叠加太阳活动极大期
            body: >-
              Cluster 4 卫星上的 Enpulsion IFM Nano Thrusters 发生不可修复故障，迫使 HawkEye 360 紧急取得 FCC 授权，以 477 km 轨道运行，而非标准名义轨道。公司将
              Cluster 7 及后续航天器改用 Bradford Space 水推进系统，成功降低了未来制造风险； 但在太阳活动极大期进行低轨运行，会让星座承受更强的大气阻力和更早的轨道退化。
