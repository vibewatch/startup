        - 高度依赖美国政府合同，使业务暴露于联邦预算波动
        - 美国政府在 2025 年申报中占总收入的 61%
        - 商业海事及盟国主权客户扩张成功，将美国占比降至 45% 以下
      - - 积压订单转化
        - $285M 大额积压订单提供前瞻可见度，但存在便利终止风险
        - 积压订单从 2025 年末的 $302.7M 降至 2026 年 Q1 的 $285.0M
        - 公开披露有资金与无资金积压订单瀑布，证明较高的经常性留存
    notes: 评估专有 RF 星座的核心防御力能否抵御联邦客户高度集中及国防采购执行风险。
    claimRefs:
