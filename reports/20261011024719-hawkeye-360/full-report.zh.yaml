      - number: '5.4'
        title: 集成生态、技术差异化与运营风险
        blocks:
          - type: paragraph
            body: >-
              HawkEye 360 通过被动、非合作式采集方式和庞大信号库，在地理空间情报领域形成差异化；商业光学和 SAR 星座则需要日光、晴空或主动照射发射源。借助自动化 REST API，客户可以把射频层接入 Esri
              ArcGIS、NIWC Pacific 的 SeaVision 和军用指挥控制系统。但技术尽调也发现多项运营依赖和风险。第一，当前从轨道采集、地面站下传到集中式云 ETL
              的数据交付延迟仍以小时计，不适合时间关键的战术武器交战或即时导弹提示；技术路线图计划通过 Kestrel 和下一代集群的机载处理，把延迟压缩到分钟乃至秒。第二，卫星寿命为 3 至 7
              年，推进剂耗尽和轨道大气阻力要求持续资本支出和集群替换。第三，航天器组装高度依赖 SFL 工程和第三方商业发射排期，星座扩张节奏容易受到外部航空航天供应链扰动。
            claimRefs:
              - CE004
              - CE007
              - CE009
              - CE011
              - CE012
              - CE014
