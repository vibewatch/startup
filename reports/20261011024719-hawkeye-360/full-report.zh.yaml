              - CV014
              - CV015
      - number: '8.4'
        title: 推荐立场与尽调触发条件
        blocks:
          - type: paragraph
            body: >-
              我们对 HawkEye 360 的投资立场正式定为“跟踪”，风险评级为“高”，估值状态为“偏高”。营收增长（同比 +116.5%） 和国际多元化（同比 +156.8%）确实强劲，但当前 6.3x
              远期营收倍数，对潜在联邦合同延迟或 ISA 收购后的整合摩擦 几乎没有安全边际。迫使立场立即下调为“回避”的关键论点破坏触发条件包括：（1）主要美国国防机构任务订单流失或
              未续签；（2）国际海事态势感知试点无法转化为经常性主权订阅；（3）严重的发射或在轨集群异常打乱采集节奏；或 （4）估值倍数持续压缩至营收 4.0x
              以下，同时现金消耗加速。反过来，升级为“买入”需要连续两个季度实现 GAAP 经营盈利、证明盟国国防客户的净收入留存率超过 115%，并且以不高于 4.5x 远期销售额的有吸引力倍数入场。
            claimRefs:
              - CV001
              - CV008
              - CV009
              - CV010
              - CV014
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV009
              - CV010
              - CV014
      - number: '8.5'
        title: 图表
        blocks:
          - type: callout
            title: 估值评估：维持“跟踪”立场
            body: >-
              HawkEye 360 已证明自身具备突出的技术差异化和营收增长（2026 年第一季度同比 +116.5%），但其公开市场估值（市值 $1.37B、远期营收 6.3x）对应很高的增长预期，同时公司仍持续 GAAP
              亏损、61% 营收集中于美国政府。 我们建议继续跟踪该股，直到 2026 年下半年业绩显示出经营杠杆和合同多元化。
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV009
              - CV010
              - CV013
              - CV014
          - type: callout
            title: 倍数脆弱性与政府预算敞口
            body: >-
              尽管营收超预期，公开市场已经释放出明显的价格敏感信号：二季度业绩公布后股价下跌 7.2%。联邦国防拨款任何延迟， 或国际合同转化出现迟疑，都可能触发进一步的倍数压缩，向传统国防承包商水平（营收
              2.0x–3.5x）靠拢。
            calloutType: risk
            claimRefs:
              - CV004
              - CV008
              - CV011
              - CV015
