      - number: '7.2'
        title: 星座可靠性、推进异常与空间天气脆弱性
        blocks:
          - type: paragraph
            body: >-
              在低地球轨道运营商用 RF 感知星座，会让卫星硬件持续承受叠加的运行与环境压力。2023 年，HawkEye 360 确认 Cluster 4 的三颗卫星所装第三方 Enpulsion IFM Nano
              Thrusters 推进器发生不可修复故障，迫使航天器降至约 477 千米轨道。虽然卫星仍在名义设计容差内持续执行采集任务，但太阳活动极大期临近，地磁暴增强、大气阻力升高， 轨道衰减也随之加快。管理层将
              Cluster 7 及后续所有卫星改用 Bradford Space 水推进系统，化解了单一供应商硬件瓶颈； 同时，公司正在开发面向太空对太空跟踪的能力，该能力已由美国太空军验证。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR014
