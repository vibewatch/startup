  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Capabilities and Mission Workflow Delivery
        blocks:
          - type: paragraph
            body: >-
              HawkEye 360 delivers commercial radio frequency (RF) data and geospatial analytics designed to monitor,
              characterize, and geolocate non-cooperative electronic emissions across maritime, terrestrial, and
              contested domains. In modern defense and maritime security operations, adversaries and illicit actors
              frequently evade surveillance by disabling Automatic Identification System (AIS) transponders or
              transmitting falsified coordinates, creating critical blind spots for optical imagery and conventional
              tracking radars. HawkEye 360 addresses this operational challenge by collecting ambient RF
              signals—including maritime navigation radars, satellite communication terminals, and tactical push-to-talk
              radios—directly from orbit, triangulating positions independently of cooperative broadcasts. The company
              packages these detections into core data feeds such as RFGeo, specialized situational software platforms
              like Mission Space, and integrated regional security feeds like SEAker. Government customers, such as the
              Indian Navy under the Indo-Pacific Maritime Domain Awareness (IPMDA) initiative, ingest these processed
              signal layers directly into operational environments including SeaVision and Esri ArcGIS. Through
              standardized REST APIs and subscription-based cloud delivery, analysts receive geolocated vectors
              accompanied by 95% confidence error ellipses, allowing operational commanders to direct patrol assets and
              cue optical or synthetic aperture radar (SAR) satellites for definitive visual confirmation.
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE011
              - CE013
