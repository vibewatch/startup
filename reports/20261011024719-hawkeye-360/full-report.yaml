        blocks:
          - type: paragraph
            body: >-
              Operating commercial RF sensing constellations in low Earth orbit subjects satellite hardware to
              compounding operational and environmental stresses. In 2023, HawkEye 360 confirmed an irreparable
              propulsion failure affecting all three Cluster 4 satellites equipped with third-party Enpulsion IFM Nano
              Thrusters, forcing the spacecraft into lower orbits at approximately 477 kilometers. Although the
              satellites maintain active collection operations within nominal design tolerances, approaching solar
              maximum brings intensified geomagnetic storms and elevated atmospheric drag that accelerates orbital
              decay. Management neutralized the single-supplier hardware bottleneck by transitioning Cluster 7 and all
              subsequent satellite builds to Bradford Space water propulsion systems, while developing space-to-space
              tracking capabilities demonstrated for the U.S. Space Force.
