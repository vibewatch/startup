chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Mission, and Operating Model
        blocks:
          - type: paragraph
            body: >-
              HawkEye 360, Inc. was incorporated under Delaware law in September 2015 and operates from its corporate
              headquarters in Herndon, Virginia. As a commercial defense-technology enterprise, the company designs,
              deploys, and operates a proprietary constellation of formation-flying small satellites in low-Earth orbit
              to detect, geolocate, and characterize radio frequency (RF) emissions across maritime, terrestrial, and
              aerospace domains. The enterprise was incubated to commercialize foundational radio-frequency geolocation
              algorithms developed within academic research institutions, establishing the first commercial satellite
              constellation dedicated to space-based signals intelligence (SIGINT). Prior to completing its initial
              public offering in May 2026, the company elected public benefit corporation status under Delaware law,
              adopting a statutory public benefit charter to preserve the safety, security, and resilience of the
              American people and allied partner nations.
            claimRefs:
              - CO001
              - CO003
          - type: table
            tableRef: TO001
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO008
              - CO014
              - CO015
      - number: '1.2'
        title: Executive Leadership, Governance, and Key-Person Structure
        blocks:
          - type: paragraph
            body: >-
              HawkEye 360 is led by President and Chief Executive Officer John Serafini, who has guided the organization
              since 2016 following its spinout. The executive leadership team pairs military and national security
              backgrounds with institutional financial discipline, featuring Chief Financial Officer Craig Searle, Chief
              Operating Officer Todd Probert, and International President Alex Fox. Founder Chris DeMay transitioned
              from day-to-day executive duties, leaving operational execution concentrated under Serafini and Probert.
              In December 2025, HawkEye 360 acquired defense signals processing firm Innovative Signal Analysis (ISA)
              for $150 million, subsequently installing dedicated business unit leadership under Cory Peichel and Mark
              Volpi to manage classified intelligence community workflows. Board oversight is anchored by Chairman Mark
              Spoto of Razor's Edge Ventures and NightDragon founder David DeWalt, establishing deep defense-venture
              alignment.
            claimRefs:
              - CO002
              - CO011
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO002
              - CO011
      - number: '1.3'
        title: Capitalization History, IPO Proceeds, and Ownership Structure
        blocks:
          - type: paragraph
            body: >-
              Before its public listing, HawkEye 360 financed its orbital deployment through sequential preferred equity
              and debt rounds totaling over $300 million in private capital. In May 2026, the company completed a
              traditional initial public offering on the New York Stock Exchange under ticker HAWK, issuing 18.4 million
              shares of common stock at $26.00 per share and raising approximately $435.9 million in net cash proceeds.
              The offering enabled HawkEye 360 to refinance $48.6 million in outstanding mezzanine debt and fund
              deferred consideration for the ISA transaction. Beneficial ownership remains highly concentrated among
              top-tier defense and technology institutions, led by Insight Partners (18.0%), NightDragon (11.7%), GIC
              (8.5%), BlackRock (6.1%), and Razor's Edge Ventures II (6.1%), who together controlled over 50% of voting
              common stock prior to listing.
            claimRefs:
              - CO007
              - CO012
          - type: table
            tableRef: TO003
            claimRefs:
              - CO007
              - CO012
      - number: '1.4'
        title: Operational Scale, Backlog Visibility, and Milestones
        blocks:
          - type: paragraph
            body: >-
              HawkEye 360 reached an operational inflection point in fiscal year 2025, generating $98.7 million in
              revenue, up nearly 100% year-over-year, and delivering its first profitable year since inception with $2.7
              million in net income. As of year-end 2025, the company maintained a funded contract backlog of $302.7
              million, representing roughly 3.1 times forward annual revenue coverage and reflecting multi-year defense
              program commitments. Operating momentum continued into early 2026, with first-quarter revenue expanding
              116.5% to $49.8 million and adjusted EBITDA reaching $7.4 million following the orbital deployment of
              satellite clusters 13 and 14. Revenue generation remains internationally diversified, with U.S. government
              agencies representing 61% and international allied partners accounting for 39%, including 16% from Japan
              and expanding naval maritime awareness partnerships across the Indo-Pacific.
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO008
              - CO009
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO005
              - CO007
              - CO011
              - CO013
      - number: '1.5'
        title: Customer Concentration, Valuation Headwinds, and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              Despite strong top-line growth and backlog coverage, HawkEye 360 faces material customer concentration and
              capital-market risks. U.S. government business drives the majority of revenues, with the National
              Reconnaissance Office alone accounting for 39% of 2025 sales and the top three customers generating 66%.
              Following second-quarter 2026 financial disclosures, HawkEye 360's stock price declined 7.2% as GAAP
              earnings flipped negative to a loss of $0.07 per share and investors reacted to an elevated forward
              valuation exceeding 190 times earnings. Furthermore, public filings omit key unit-economic indicators,
              including total customer account count, net revenue retention (NRR), and annual recurring revenue (ARR)
              breakdown across subscription versus professional service lines, necessitating targeted commercial
              diligence.
            claimRefs:
              - CO010
              - CO013
              - CO014
              - CO015
      - number: '1.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Dual-Use RF Intelligence Platform Transition
            body: >-
              HawkEye 360's transition from unclassified raw RF geolocation to classified multi-domain intelligence
              processing via the ISA acquisition positions the company to capture higher-margin defense program dollars
              while maintaining shareable commercial feeds for international allies.
            calloutType: insight
            claimRefs:
              - CO003
              - CO009
              - CO011
          - type: callout
            title: Public Sector Concentration and High Multiple Scrutiny
            body: >-
              With 66% of revenue concentrated in three government customers—led by the NRO at 39%—and forward valuation
              trading above 190 times earnings, HawkEye 360 remains highly vulnerable to federal procurement delays,
              defense budget shifts, and public market volatility.
            calloutType: risk
            claimRefs:
              - CO010
              - CO013
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Scope, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              The commercial radio frequency (RF) intelligence market occupies a critical, specialized niche within the
              broader defense intelligence, surveillance, and reconnaissance (ISR) ecosystem. Historically, defense and
              national security agencies relied on multi-billion-dollar sovereign intelligence satellites or airborne
              reconnaissance aircraft to detect and geolocate RF emissions. HawkEye 360 defines a commercially
              accessible data-as-a-service model, delivering RF emitter mapping, signal analytics, and classified
              processing on subscription and tasking bases. The core market boundary encompasses space-based RF
              detection, automated analytics software, and classified mission processing, while excluding custom
              spacecraft manufacturing, heavy launch vehicle operations, and terrestrial consumer communications
              infrastructure. Primary status-quo substitutes include legacy government-owned signals intelligence
              constellations, terrestrial coastal radar networks, and aerial surveillance platforms. As electronic
              warfare tactics proliferate and maritime adversaries routinely disable Automatic Identification System
              transponders, sovereign defense forces increasingly substitute rigid legacy workflows with commercial
              space-based RF feeds to achieve persistent tactical situational awareness.
            claimRefs:
              - CM002
              - CM006
              - CM009
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM002
              - CM006
              - CM014
      - number: '2.2'
        title: 'Addressable Market Sizing: Top-Down Ambition Versus Bottom-Up Sizing'
        blocks:
          - type: paragraph
            body: >-
              Quantifying the market for commercial space RF intelligence reveals substantial variance depending on the
              analytical lens applied. In its public offering filings and investor disclosures, HawkEye 360 management
              outlined a broad total addressable market for global RF spectrum exploitation of approximately $24 billion
              to $25 billion in 2026, forecasting an expansion to $34 billion to $35 billion by 2030 as commercial space
              data procurement accelerates. Conversely, independent market research institutions model a more focused
              market centered specifically on RF geolocation satellite constellations. Dataintelo estimated the
              dedicated space-based RF geolocation constellation market at $1.42 billion in 2024, expanding at a 13.8%
              compound annual growth rate to $4.11 billion by 2033. In contrast, Growth Market Reports estimated the
              2024 baseline at $1.16 billion with a 17.9% CAGR reaching $5.22 billion by 2033. These differing
              benchmarks illustrate a $260 million divergence in baseline sizing and a $1.11 billion gap in 2033
              terminal value. Diligence suggests management's multi-tens-of-billions TAM captures broad electronic
              warfare and government contractor services, whereas actual near-term serviceable addressable spend is
              constrained by dedicated satellite data procurement appropriations.
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM005
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM012
              - CM015
      - number: '2.3'
        title: Buyer Segmentation, Budget Ownership, and Adoption Pathways
        blocks:
          - type: paragraph
            body: >-
              Customer segmentation for commercial RF intelligence is heavily weighted toward sovereign defense and
              intelligence establishments. In the United States, primary buyers comprise combatant commands and national
              intelligence agencies utilizing operational defense appropriations, where commercial RF intelligence
              complements classified national technical means. Internationally, allied defense ministries and naval
              forces represent an expanding buyer segment, evidenced by HawkEye 360's recent multi-year contract award
              to support the Indian Navy and Indo-Pacific partner nations under the Indo-Pacific Maritime Domain
              Awareness initiative. International revenue reached $21 million in the second quarter of 2026, accounting
              for over 42% of total sales. Adoption pathways diverge significantly across customer categories: domestic
              defense programs require complex security accreditations and integration into classified
              command-and-control architectures, whereas international sales involve lengthy Foreign Military Sales
              negotiations and sovereign data-sovereignty reviews. Commercial maritime and civilian logistics represent
              a secondary emerging segment, where adoption is currently constrained by civilian budget limits and
              embryonic distribution channels.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM006
              - CM007
              - CM009
              - CM014
      - number: '2.4'
        title: Growth Catalysts, Operational Headwinds, and Diligence Realities
        blocks:
          - type: paragraph
            body: >-
              Adoption of commercial RF intelligence is propelled by structural tailwinds, notably the escalation of
              electronic warfare, widespread navigation spoofing, and maritime territorial disputes in contested regions
              such as the Indo-Pacific and Red Sea. Furthermore, management's stated technological roadmap targets
              reducing constellation revisit rates and latency to 10 minutes within two to three years, an operational
              threshold that would unlock dynamic tactical track custody and long-range fire missions. However, serious
              adoption and scaling constraints persist. Procurement remains vulnerable to U.S. federal budget continuing
              resolutions and government contract timing friction, which contributed to legacy U.S. revenue softness in
              early 2026. Furthermore, constellation refresh cycles depend on commercial launch provider manifests that
              are vulnerable to industry-wide scheduling delays. Financially, while management guided 2026 revenue to
              $215M to $220M with positive adjusted EBITDA, the company generated a GAAP net loss of $15.3M in Q2 2026,
              raising investor scrutiny regarding high valuation multiples and commercial market depth.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM015
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Divergence Between Broad TAM Disclosures and Specialized Constellation Spend
            body: >-
              A critical structural nuance in RF intelligence diligence is the massive gap between management's top-down
              $24B to $35B market sizing and independent analyst estimates of a $1.2B to $1.4B dedicated constellation
              market in 2024. The broader figure reflects aggregated multi-domain electronic warfare, sovereign defense
              procurement, and enterprise software budgets, whereas pure-play space-based RF geolocation remains a
              specialized, fast-growing slice. Underwriting the company requires recognizing that revenue capture will
              be gated by sovereign defense conversion rather than passive participation in a generic $35B market.
            calloutType: insight
            claimRefs:
              - CM001
              - CM005
              - CM010
          - type: callout
            title: Concentration and Valuation Friction in Public Execution
            body: >-
              While HawkEye 360 demonstrates robust top-line momentum with 2026 revenue guided to $215M to $220M and
              strong international traction, the business model carries valuation friction. A GAAP net loss of $15.3M in
              Q2 2026 and an elevated forward valuation multiple near 190 times earnings leave limited margin for
              execution error. Launch manifest delays, U.S. government budget continuing resolutions, or extended
              sovereign procurement cycles could quickly compress public valuation multiples.
            calloutType: risk
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive Landscape: Direct Peers, Incumbents, and Substitutes'
        blocks:
          - type: paragraph
            body: >-
              The competitive landscape surrounding HawkEye 360 spans direct commercial radio frequency (RF) operators,
              established defense prime contractors, multi-sensor smallsat constellations, and complementary Earth
              observation providers. While traditional defense primes like Lockheed Martin and Northrop Grumman
              historically dominated signals intelligence through highly classified government satellite programs,
              HawkEye 360 pioneered the commercial, unclassified delivery of space-based RF intelligence. This
              unclassified posture allows tactical operators to share mission-critical emitter locations across Five
              Eyes, NATO, and Indo-Pacific partner nations without complex declassification hurdles. Direct competition
              remains concentrated among a small handful of emerging commercial operators, most notably France-based
              Unseenlabs in Europe, while broader smallsat operators such as Spire Global emphasize commercial weather,
              aviation, and maritime AIS data. Meanwhile, optical and synthetic aperture radar (SAR) imagery providers
              act primarily as workflow complements, relying on RF signals to tip and cue higher-resolution imaging
              sensors across contested maritime and terrestrial environments.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP007
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP006
      - number: '3.2'
        title: Peer Profiles, Scale, and Relative Strategic Positioning
        blocks:
          - type: paragraph
            body: >-
              Evaluating competitor scale and capital discipline highlights distinct strategic trajectories across the
              space intelligence sector. HawkEye 360 operates a constellation of more than 30 formation-flying
              satellites in low Earth orbit, deploying dedicated clusters to detect and geolocate non-cooperative RF
              emitters. In contrast, Spire Global maintains over 100 multi-purpose nanosatellites but pursues a
              high-volume, low-margin commercial data model that has struggled to achieve consistent GAAP profitability.
              France-based Unseenlabs operates approximately 15 satellites dedicated to RF surveillance, benefiting from
              deep backing by the French defense establishment, yet it lacks HawkEye 360's scale and broad access to the
              expansive U.S. defense procurement apparatus. Alternative Earth observation pioneers, including Planet
              Labs and BlackSky Technology, have faced severe margin pressure as standard optical satellite imagery has
              rapidly commoditized. HawkEye 360's vertical integration of proprietary satellite collection, third-party
              sensor integration, and defense software analytics shields it from raw commodity pricing while
              establishing clear leadership in unclassified tactical electronic warfare support.
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP006
              - CP008
              - CP012
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP012
      - number: '3.3'
        title: Differentiation, Switching Costs, and Moat Durability
        blocks:
          - type: paragraph
            body: >-
              Diligence indicates that HawkEye 360's competitive moat rests on four durable foundations: proprietary
              geolocation algorithms, constellation formation architecture, specialized security clearances, and
              operational workflow lock-in. Detecting dark vessels—ships that disable cooperative AIS transponders to
              conduct illicit transshipments or sanctions evasion—requires precise microsecond-level
              time-difference-of-arrival (TDOA) and frequency-difference-of-arrival (FDOA) processing across clustered
              satellites. Optical sensors cannot locate dark vessels over wide ocean expanses without massive tasking
              costs, whereas RF mapping monitors thousands of square kilometers per pass regardless of darkness or cloud
              cover. Furthermore, HawkEye 360 embeds its RFGeo feeds directly into customer operating systems, such as
              the U.S. Navy's SeaVision maritime awareness platform and regional defense command centers. These deep
              software integrations, paired with facility security clearances and long-term training programs, generate
              substantial switching costs that deter defense procurement offices from multi-homing or migrating to
              unproven commercial entrants.
            claimRefs:
              - CP001
              - CP006
              - CP008
              - CP012
              - CP013
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP004
              - CP008
              - CP012
              - CP013
      - number: '3.4'
        title: Pricing Dynamics, Market Disruption, and Incumbent Response
        blocks:
          - type: paragraph
            body: >-
              Despite strong technological differentiation, HawkEye 360 faces meaningful market and valuation risks that
              warrant disciplined investor tracking. Following its successful May 2026 initial public offering, HawkEye
              360 trades at a rich Price-to-Sales multiple of approximately 13.6x, compared to a wider U.S. Aerospace
              and Defense industry average of 5.3x and commercial space peer averages near 4.9x. The stock exhibited
              significant volatility following its second-quarter 2026 financial report, falling as investors weighed
              widening GAAP net losses tied to public transition expenses against forward valuation multiples exceeding
              190 times earnings. Additionally, while pure-play commercial RF competition is currently scarce, long-term
              risks include traditional defense prime contractors developing modular commercial payloads, foreign
              governments mandate-driven sovereign in-sourcing, and periodic U.S. federal budget delays resulting from
              continuing resolutions. Sustaining premium multiples will require management to demonstrate durable net
              retention, expanding international sovereign contracts, and steady progress toward consistent GAAP
              profitability.
            claimRefs:
              - CP002
              - CP009
              - CP010
              - CP011
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP009
              - CP010
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: First-Mover Advantage in Dedicated Commercial Defense RF
            body: >-
              HawkEye 360's operational scale of more than 30 satellites and deep integration into customer workflows
              like the U.S. Navy's SeaVision create substantial barriers to entry. Unlike optical imaging, which
              suffered from rapid commoditization, space-based RF signals intelligence requires specialized
              constellation formation flying, complex emitter geolocation algorithms, and high-trust government security
              postures that cannot be easily replicated by generic smallsat operators.
            calloutType: insight
            claimRefs:
              - CP001
              - CP008
              - CP012
              - CP013
          - type: callout
            title: Valuation Sensitivity and Exposure to Defense Budget Timing
            body: >-
              Trading at an elevated Price-to-Sales multiple of 13.6x relative to defense industry peers at 5.3x leaves
              HawkEye 360 highly vulnerable to contract award delays and public market multiple compression. When
              quarterly GAAP losses widened during the public-market transition, shares reacted sharply downward,
              demonstrating that investors require sustained execution and evidence of margin expansion to justify
              premium valuation multiples.
            calloutType: risk
            claimRefs:
              - CP002
              - CP009
              - CP010
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Monetization Mechanics
        blocks:
          - type: paragraph
            body: >-
              HawkEye 360 has demonstrated rapid top-line revenue expansion following its May 2026 initial public
              offering, capitalizing on structural defense tailwinds and growing global demand for space-based radio
              frequency (RF) signals intelligence. In the second quarter of 2026, total revenue reached $49.8 million,
              an 87% year-over-year increase over the $26.6 million generated in the second quarter of 2025. Across the
              first six months of 2026, total recognized revenue expanded to $99.6 million, doubling the $49.6 million
              reported in the comparable prior-year period. Growth is increasingly propelled by allied international
              expansion, where quarterly revenue surged 134% to $21.0 million, representing over 42% of total Q2
              revenue. This momentum is anchored by multi-year sovereign agreements, including a major foreign military
              sales award to enhance maritime domain awareness across the Indian Ocean Region using HawkEye 360's RFGeo
              data and SeaVision workflows. Management established full-year 2026 revenue guidance between $215.0
              million and $220.0 million, supported by an expanding commercial and sovereign customer base.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI010
              - CI011
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI006
              - CI011
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI003
              - CI005
              - CI006
      - number: '4.2'
        title: Cost Structure, Gross Margins, and Operational Leverage
        blocks:
          - type: paragraph
            body: >-
              The core unit economics of HawkEye 360 reflect the favorable operating leverage inherent to a satellite
              constellation data provider. Because constellation collection costs are predominantly fixed capital
              outlays, marginal data delivery costs remain modest. The company reported a gross margin excluding
              depreciation and amortization of approximately 82% in fiscal 2025, demonstrating substantial data
              reusability across multiple customers. Direct cost of sales excluding depreciation and amortization was
              $14.9 million in Q2 2026 and $30.9 million for the first half of 2026. However, operating expenses scaled
              significantly following the IPO and the acquisition of Innovative Signal Analysis (ISA), with Q2 selling,
              general, and administrative expenses climbing to $25.0 million and research and development rising to $8.2
              million. Adjusted EBITDA for Q2 2026 was $7.0 million (compared to $7.8 million in Q2 2025), bringing H1
              Adjusted EBITDA to $14.4 million and highlighting ongoing operational investments in constellation scaling
              and military radar algorithm automation.
            claimRefs:
              - CI003
              - CI005
              - CI010
              - CI014
          - type: table
            tableRef: TI002
            claimRefs:
              - CI002
              - CI006
              - CI011
      - number: '4.3'
        title: Capital Adequacy, Cash Flow, and Balance Sheet Solvency
        blocks:
          - type: paragraph
            body: >-
              HawkEye 360's balance sheet underwent a fundamental recapitalization through its May 2026 initial public
              offering, which raised $437.5 million in net proceeds through the sale of 18.4 million common shares at
              $26.00 per share. As of June 30, 2026, the company held $503.4 million in cash and cash equivalents and
              $4.99 million in restricted cash, giving it $508.3 million in total liquidity. The company extinguished
              its $49.5 million term loan obligation and established a new five-year $125.0 million revolving credit
              facility maturing in May 2031. Operating cash flow inflected positively to $11.6 million in Q2 2026,
              generating $5.4 million in free cash flow after $6.2 million in satellite, property, and equipment capital
              expenditures. With Block 3 satellites reducing cluster capital intensity by up to 75% relative to earlier
              generations, HawkEye 360 possesses adequate multi-year runway to fund constellation replacement and Block
              3 Kestrel launches without external equity financing.
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI012
          - type: table
            tableRef: TI003
            claimRefs:
              - CI004
              - CI005
              - CI007
              - CI008
              - CI012
              - CI013
              - CI014
      - number: '4.4'
        title: Financial Underwriting Verdict and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              While HawkEye 360 exhibits robust revenue acceleration and strong post-IPO liquidity, financial
              underwriting faces substantial structural headwinds. The company posted a GAAP net loss of $15.3 million
              in Q2 2026 (a negative swing from $1.6 million GAAP net income in Q2 2025), driven by higher depreciation,
              stock-based compensation, and fair value adjustments. This GAAP loss triggered a 7.2% single-day stock
              selloff as public markets scrutinized a valuation trading above 190 times forward earnings. Furthermore,
              revenue concentration remains acute, with the top three government customers accounting for 61% of fiscal
              2025 sales (34%, 16%, and 11% respectively). Backlog quality also warrants investor scrutiny: of the
