            title: Commercial RF Multilateration Technical Moat
            body: >-
              HawkEye 360's primary technical moat lies in the operational synchronization of formation-flying satellite
              clusters that perform dual TDOA and FDOA multilateration without requiring cooperative beacons. By pairing
              precision attitude control and micropropulsion from SFL with custom SDR payloads sweeping 70 MHz to 18
              GHz, HawkEye 360 has accumulated a proprietary database exceeding one billion real-world emitter captures
              that continuously improves automated signal classification.
