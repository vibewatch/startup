            title: Latency Constraints and Constellation Replenishment Capex
            body: >-
              Despite high geometric accuracy, the system faces two material technical risks: end-to-end data delivery
              latency currently operates on an hours-scale baseline between satellite collection, ground downlink
              passes, and cloud processing, which restricts tactical missile defense or real-time strike cueing.
              Additionally, with satellite lifespans designed for 3 to 7 years due to propellant and orbit decay,
              HawkEye 360 requires continuous capex and commercial rocket launch access to replenish clusters.
