      - number: '5.2'
        title: Space Segment Architecture and Formation-Flying Hardware
        blocks:
          - type: paragraph
            body: >-
              The foundation of HawkEye 360's technical capability is a space constellation comprising more than 30
              operational microsatellites deployed in Low Earth Orbit (LEO) at altitudes between 400 and 600 kilometers
              in sun-synchronous orbits. Rather than operating as isolated observation nodes, the satellites fly in
              coordinated tri-satellite formations known as clusters, maintaining baseline separations between 125 and
              250 kilometers. This relative orbital geometry provides the necessary angular and temporal baseline to
              measure incoming RF signals simultaneously across three distinct spatial vectors. Spacecraft manufacturing
              and platform engineering have evolved across multiple production blocks, originating with the 13.4-kg
              NEMO-15 microsatellite bus developed by the University of Toronto Institute for Aerospace Studies Space
              Flight Laboratory (SFL) for the initial Pathfinder mission in 2018, before transitioning to SFL's 30-kg
              DEFIANT platform for Clusters 2 through 12. Each satellite incorporates an electro-thermal water-based
              propulsion system providing approximately 96 m/s of delta-V, which provides non-toxic, low-risk orbital
              station-keeping, weekly formation-flying maintenance maneuvers, and eventual end-of-life deorbiting. The
              sensing payload centers on a dual-channel software-defined radio (SDR) capable of tuning across 70 MHz to
              6 GHz with 56 MHz of instantaneous bandwidth, extended up to 18 GHz (Ku-band) using low-noise block
              down-converters to capture higher-frequency naval and aviation radar systems.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE005
              - CE006
              - CE010
