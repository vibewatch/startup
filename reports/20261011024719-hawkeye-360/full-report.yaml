  - id: FE001
    title: HawkEye 360 Product & Technology Architecture Map
    type: stack
    summary: >-
      Six-tier architectural decomposition showing the end-to-end data flow from space-based RF collection through
      formation-flight orbital control, secure cloud ETL, signal analytics, and customer delivery.
    data:
      layers:
        - name: 1. Spaceborne Collection Layer
          label: Spaceborne Collection Layer
          detail: Dual SDR receivers sweeping 70 MHz to 18 GHz aboard 30+ LEO microsatellites in tri-satellite clusters
          modules:
            - Software-Defined Radio (SDR) with 56 MHz instantaneous bandwidth
            - Low-noise block (LNB) down-converters extending coverage to 18 GHz Ku-band
            - Dual onboard flight computers (HKC telemetry and ADCC attitude control)
        - name: 2. Precision Orbital Formation Layer
          label: Precision Orbital Formation Layer
          detail: SFL 30-kg DEFIANT and NEMO-15 satellite platforms maintaining 125-250 km baselines
          modules:
            - Closed-loop 3-axis attitude control with star trackers and reaction wheels
            - GPS clock synchronization for microsecond time-tagging across clusters
            - Water electro-thermal propulsion (~96 m/s delta-V) for station-keeping maneuvers
        - name: 3. Ground Downlink & Transmission Layer
          label: Ground Downlink & Transmission Layer
          detail: Direct RF capture downlinks via global ground station contacts
          modules:
            - Primary X-band downlink channels operating at 3 to 50 Mbps
            - Secondary S-band and UHF links for telemetry and time-tagged tasking
            - Distributed ground station pass scheduling to minimize orbital collection latency
        - name: 4. Cloud Data Lake & Orchestration Layer
          label: Cloud Data Lake & Orchestration Layer
          detail: Enterprise serverless ETL and data lake infrastructure deployed on Amazon Web Services
          modules:
            - Amazon S3 raw and processed object storage for petabyte-scale RF archives
            - AWS Lambda and AWS Glue serverless transformation pipelines
            - AWS Lake Formation access governance, encryption, and compliance controls
        - name: 5. Signal Exploitation & ML Analytics Layer
          label: Signal Exploitation & ML Analytics Layer
          detail: Multilateration algorithms and proprietary RF emitter matching library
          modules:
            - TDOA (hyperbolic time difference) and FDOA (Doppler shift) geolocation engines
            - Innovative Signal Analysis (ISA) advanced signal characterization algorithms
            - Historical signature matching against 1B+ classified emitter records
        - name: 6. Operational Integration & Mission Delivery Layer
          label: Operational Integration & Mission Delivery Layer
          detail: API and software distribution interfaces delivering geolocated vectors to mission partners
          modules:
            - REST Collections API for end-to-end tasking and GeoJSON vector delivery
            - Mission Space and SEAker web analytics applications for tipping and cueing
            - External situational awareness integration (NIWC SeaVision and Esri ArcGIS)
    approximationNotes: >-
      Layer breakdown is a functional synthesis of HawkEye 360 technical disclosures, eoPortal mission specifications,
      SFL engineering publications, and AWS partner architecture documentation.
