      - number: '5.3'
        title: Signal Processing, TDOA/FDOA Geolocation, and Cloud Pipeline
        blocks:
          - type: paragraph
            body: >-
              To transform raw digitized RF waveforms into accurate geospatial intelligence, HawkEye 360 utilizes a
              hybrid processing architecture combining time difference of arrival (TDOA) and frequency difference of
              arrival (FDOA) multilateration. When an emitter transmits, the three formation-flying satellites record
              the signal with microsecond-level timestamps synchronized via onboard GPS receivers. TDOA calculations
              evaluate the arrival-time discrepancies between satellite pairs, generating intersecting hyperbolic curves
              on the Earth's surface, while FDOA measures differential Doppler shifts induced by the satellites'
              relative orbital velocities. Combining TDOA and FDOA yields a precise, unique geolocation fix bounded by a
              calculated error ellipse. Raw signal captures are downlinked during scheduled ground station passes over
              X-band channels at data rates ranging from 3 to 50 Mbps, supported by secondary S-band and UHF links. On
              the ground, HawkEye 360 processes downlinked captures in an enterprise cloud data lake deployed on Amazon
              Web Services (AWS). Engineered in partnership with Effectual, the data pipeline leverages Amazon S3 for
              petabyte-scale storage, AWS Lambda functions and AWS Glue for serverless extraction and transformation,
              and AWS Lake Formation for rigorous access governance and compliance. The acquisition of Innovative Signal
              Analysis (ISA) in late 2025 further expanded HawkEye 360's algorithmic library, adding advanced waveform
              filtering and automated emitter classification against a proprietary database of over one billion
              historical RF signal signatures.
            claimRefs:
              - CE002
              - CE003
              - CE007
              - CE008
              - CE012
