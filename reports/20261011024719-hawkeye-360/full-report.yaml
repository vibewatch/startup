  summary: >-
    HawkEye 360 is a public commercial RF-intelligence company that deploys a 30-plus-satellite LEO constellation to
    detect, geolocate, and characterize radio-frequency emitters for defense and maritime security customers. The
    business combines raw RF data products, analytics software, and classified mission support, with the U.S. and allied
    sovereign markets providing the majority of demand. The company reached public markets in May 2026, and its recent
    financial profile shows strong revenue growth, positive adjusted EBITDA, and a materially enlarged cash position,
    but also meaningful customer concentration and still-opaque recurring economics.
