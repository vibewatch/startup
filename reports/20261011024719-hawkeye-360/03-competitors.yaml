    title: "First-Mover Advantage in Dedicated Commercial Defense RF"
    body: "HawkEye 360's operational scale of more than 30 satellites and deep integration into customer workflows like the U.S. Navy's SeaVision create substantial barriers to entry. Unlike optical imaging, which suffered from rapid commoditization, space-based RF signals intelligence requires specialized constellation formation flying, complex emitter geolocation algorithms, and high-trust government security postures that cannot be easily replicated by generic smallsat operators."
    claimRefs:
      - "CP001"
      - "CP008"
      - "CP012"
      - "CP013"
  - calloutType: "risk"
    title: "Valuation Sensitivity and Exposure to Defense Budget Timing"
    body: "Trading at an elevated Price-to-Sales multiple of 13.6x relative to defense industry peers at 5.3x leaves HawkEye 360 highly vulnerable to contract award delays and public market multiple compression. When quarterly GAAP losses widened during the public-market transition, shares reacted sharply downward, demonstrating that investors require sustained execution and evidence of margin expansion to justify premium valuation multiples."
