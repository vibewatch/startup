company:
  name: HawkEye 360
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    HawkEye 360 operates a commercially deployed constellation of more than 30 Low Earth Orbit microsatellites organized
    in formation-flying clusters of three to detect, characterize, and geolocate radio frequency (RF) emitters globally.
    By combining time difference of arrival (TDOA) and frequency difference of arrival (FDOA) multilateration with
    custom software-defined radios and AWS cloud processing, the company generates independent RF intelligence for
    defense and maritime security customers without relying on cooperative transponders. Primary technical diligence
    dependencies include reliance on Space Flight Laboratory (SFL) for satellite bus manufacturing, hours-scale latency
    awaiting automated edge upgrades, and the capital expenditure needed for periodic constellation replenishment.
sections:
  - id: section-product-definition
    title: Product Capabilities and Mission Workflow Delivery
    claimRefs:
      - CE001
      - CE002
      - CE004
      - CE011
      - CE013
    tableRefs:
      - TE001
      - TE002
    body: >-
      HawkEye 360 delivers commercial radio frequency (RF) data and geospatial analytics designed to monitor,
      characterize, and geolocate non-cooperative electronic emissions across maritime, terrestrial, and contested
      domains. In modern defense and maritime security operations, adversaries and illicit actors frequently evade
      surveillance by disabling Automatic Identification System (AIS) transponders or transmitting falsified
      coordinates, creating critical blind spots for optical imagery and conventional tracking radars. HawkEye 360
      addresses this operational challenge by collecting ambient RF signals—including maritime navigation radars,
      satellite communication terminals, and tactical push-to-talk radios—directly from orbit, triangulating positions
      independently of cooperative broadcasts. The company packages these detections into core data feeds such as RFGeo,
      specialized situational software platforms like Mission Space, and integrated regional security feeds like SEAker.
      Government customers, such as the Indian Navy under the Indo-Pacific Maritime Domain Awareness (IPMDA) initiative,
      ingest these processed signal layers directly into operational environments including SeaVision and Esri ArcGIS.
      Through standardized REST APIs and subscription-based cloud delivery, analysts receive geolocated vectors
      accompanied by 95% confidence error ellipses, allowing operational commanders to direct patrol assets and cue
      optical or synthetic aperture radar (SAR) satellites for definitive visual confirmation.
  - id: section-space-constellation
    title: Space Segment Architecture and Formation-Flying Hardware
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE005
      - CE006
      - CE010
    figureRefs:
      - FE001
    body: >-
      The foundation of HawkEye 360's technical capability is a space constellation comprising more than 30 operational
      microsatellites deployed in Low Earth Orbit (LEO) at altitudes between 400 and 600 kilometers in sun-synchronous
      orbits. Rather than operating as isolated observation nodes, the satellites fly in coordinated tri-satellite
      formations known as clusters, maintaining baseline separations between 125 and 250 kilometers. This relative
      orbital geometry provides the necessary angular and temporal baseline to measure incoming RF signals
      simultaneously across three distinct spatial vectors. Spacecraft manufacturing and platform engineering have
      evolved across multiple production blocks, originating with the 13.4-kg NEMO-15 microsatellite bus developed by
      the University of Toronto Institute for Aerospace Studies Space Flight Laboratory (SFL) for the initial Pathfinder
      mission in 2018, before transitioning to SFL's 30-kg DEFIANT platform for Clusters 2 through 12. Each satellite
      incorporates an electro-thermal water-based propulsion system providing approximately 96 m/s of delta-V, which
      provides non-toxic, low-risk orbital station-keeping, weekly formation-flying maintenance maneuvers, and eventual
      end-of-life deorbiting. The sensing payload centers on a dual-channel software-defined radio (SDR) capable of
      tuning across 70 MHz to 6 GHz with 56 MHz of instantaneous bandwidth, extended up to 18 GHz (Ku-band) using
      low-noise block down-converters to capture higher-frequency naval and aviation radar systems.
  - id: section-signal-processing
    title: Signal Processing, TDOA/FDOA Geolocation, and Cloud Pipeline
    claimRefs:
      - CE002
      - CE003
      - CE007
      - CE008
      - CE012
    tableRefs:
      - TE003
    body: >-
      To transform raw digitized RF waveforms into accurate geospatial intelligence, HawkEye 360 utilizes a hybrid
      processing architecture combining time difference of arrival (TDOA) and frequency difference of arrival (FDOA)
      multilateration. When an emitter transmits, the three formation-flying satellites record the signal with
      microsecond-level timestamps synchronized via onboard GPS receivers. TDOA calculations evaluate the arrival-time
      discrepancies between satellite pairs, generating intersecting hyperbolic curves on the Earth's surface, while
      FDOA measures differential Doppler shifts induced by the satellites' relative orbital velocities. Combining TDOA
      and FDOA yields a precise, unique geolocation fix bounded by a calculated error ellipse. Raw signal captures are
      downlinked during scheduled ground station passes over X-band channels at data rates ranging from 3 to 50 Mbps,
      supported by secondary S-band and UHF links. On the ground, HawkEye 360 processes downlinked captures in an
      enterprise cloud data lake deployed on Amazon Web Services (AWS). Engineered in partnership with Effectual, the
      data pipeline leverages Amazon S3 for petabyte-scale storage, AWS Lambda functions and AWS Glue for serverless
      extraction and transformation, and AWS Lake Formation for rigorous access governance and compliance. The
      acquisition of Innovative Signal Analysis (ISA) in late 2025 further expanded HawkEye 360's algorithmic library,
      adding advanced waveform filtering and automated emitter classification against a proprietary database of over one
      billion historical RF signal signatures.
  - id: section-integration-differentiation-risks
    title: Integration Ecosystem, Technical Differentiation, and Operating Risks
    claimRefs:
      - CE004
      - CE007
      - CE009
      - CE011
      - CE012
      - CE014
    body: >-
      HawkEye 360 distinguishes itself in the geospatial intelligence sector through its passive, uncooperative
      collection approach and extensive signal library, contrasting with commercial optical and synthetic aperture radar
      (SAR) constellations that require daylight, clear skies, or active emitter illumination. By providing automated
      REST APIs, HawkEye 360 enables customers to integrate RF layers into common operating environments such as Esri
      ArcGIS, NIWC Pacific's SeaVision, and military command-and-control systems. Nevertheless, technical diligence
      reveals several operational dependencies and risks. First, data delivery latency currently operates on an
      hours-scale baseline between orbital collection, ground station downlink passes, and centralized cloud ETL, which
      limits suitability for time-critical tactical weapons engagement or immediate missile cueing. HawkEye 360's
      technical roadmap aims to compress this latency toward minutes and seconds by deploying enhanced onboard
      processing on Kestrel and next-generation clusters. Second, the constellation requires continuous capital
      expenditure to offset satellite lifespans of 3 to 7 years, where propellant depletion and orbital atmospheric drag
      necessitate ongoing cluster replacement. Third, spacecraft assembly remains heavily reliant on SFL engineering and
      third-party commercial launch manifests, exposing constellation expansion cadences to external aerospace supply
      chain disruptions.
