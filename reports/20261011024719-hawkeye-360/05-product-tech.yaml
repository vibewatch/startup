  - id: TE002
    title: Workflow and Operational Use-Case Mapping
    columns:
      - User Job
      - Conventional Workflow
      - HawkEye 360 Solution
      - Measurable Benefit
      - Technical Limitation
    rows:
      - - Maritime Dark Vessel Detection
        - Optical satellite tasking or patrol aircraft searches
        - Space-based RF geolocation of navigation radars and VHF/UHF comms
        - Persistent wide-area coverage independent of cloud cover, day/night cycles, or transponder disablement
        - Revisit interval limited by constellation size; requires cooperative tip-and-cue for visual confirmation
      - - RF Interference & Jamming Geolocation
        - Ground monitoring stations with limited line-of-sight range
        - TDOA/FDOA multilateration from LEO tri-satellite clusters
        - Global reach into denied or disputed territories without sovereign airspace clearance
        - High RF clutter environments increase geolocation error ellipse dimensions
      - - Allied Domain Awareness (e.g., IPMDA)
        - Fragmented national radar data and sporadic aerial patrols
        - Integrated RFGeo feeds ingested directly into SeaVision situational platform
        - Standardized regional operational picture across multinational naval partners
        - Downlink dependency on distributed ground station passes introduces data latency
      - - Tactical Emitter Identification
        - Expensive dedicated sovereign SIGINT satellites or airborne reconnaissance
        - Commercial SDR payloads sweeping 70 MHz–6 GHz with Ku-band LNB extension
        - Rapid commercial data procurement without classified sovereign platform tasking constraints
        - Onboard processing capacity on older Hawk clusters limits real-time edge filtering
    notes: >-
      Use cases represent documented defense, civil government, and international maritime security applications.
      Benefits and limitations reflect commercial RF GEOINT physical operating constraints.
