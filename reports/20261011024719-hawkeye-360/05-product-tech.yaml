callouts:
  - calloutType: strength
    title: Commercial RF Multilateration Technical Moat
    body: >-
      HawkEye 360's primary technical moat lies in the operational synchronization of formation-flying satellite
      clusters that perform dual TDOA and FDOA multilateration without requiring cooperative beacons. By pairing
      precision attitude control and micropropulsion from SFL with custom SDR payloads sweeping 70 MHz to 18 GHz,
      HawkEye 360 has accumulated a proprietary database exceeding one billion real-world emitter captures that
      continuously improves automated signal classification.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE007
  - calloutType: risk
    title: Latency Constraints and Constellation Replenishment Capex
    body: >-
      Despite high geometric accuracy, the system faces two material technical risks: end-to-end data delivery latency
      currently operates on an hours-scale baseline between satellite collection, ground downlink passes, and cloud
      processing, which restricts tactical missile defense or real-time strike cueing. Additionally, with satellite
      lifespans designed for 3 to 7 years due to propellant and orbit decay, HawkEye 360 requires continuous capex and
      commercial rocket launch access to replenish clusters.
    claimRefs:
      - CE005
      - CE011
      - CE012
      - CE014
