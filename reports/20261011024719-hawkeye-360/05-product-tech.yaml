  - id: TE003
    title: Technology and Operating Architecture Decomposition
    columns:
      - Architecture Layer
      - Role in System
      - Key Technologies & Components
      - Critical Dependencies
      - Technical & Operating Risks
    rows:
      - - Space Segment (Sensing)
        - Collects raw RF emissions across target frequency bands
        - SFL NEMO and 30-kg DEFIANT buses; dual SDR receivers; triple-junction solar arrays; water thrusters
        - Space Flight Laboratory (SFL) design and manufacturing support; commercial launch providers
        - Propellant depletion (~3-7 year lifespan); orbital decay; satellite component single-point failures
      - - Formation Flying & Attitude Control
        - Maintains 125–250 km baseline geometry for multilateration
        - Three-axis stabilization (reaction wheels, magnetorquers, star trackers); GPS receiver sync
        - Microspace attitude determination software; accurate relative orbit determination
        - Thruster anomalies impacting cluster geometry, degrading TDOA hyperbolic intersection accuracy
      - - Ground Downlink & Secure Cloud Pipeline
        - Transfers and processes petabytes of raw signal captures
        - X-band (3–50 Mbps) downlinks; AWS S3 data lake; AWS Lambda; AWS Glue ETL; AWS Lake Formation
        - Ground station network contact availability; AWS GovCloud security and uptime
        - Bandwidth bottlenecks during peak collections; cloud processing costs scaling with constellation size
      - - Analytics & Signal Exploitation
        - Transforms RF captures into geolocated vectors and alerts
        - TDOA/FDOA algorithms; ISA advanced signal characterization; proprietary 1B+ emitter library
        - Innovative Signal Analysis (ISA) algorithm integration; training datasets
        - False positive alarms from signal multipath; high-density emitter overlap in contested zones
    notes: >-
      Architecture covers space, formation control, ground/cloud, and analytical exploitation layers. Technical
      parameters based on SFL engineering publications, eoPortal mission specifications, and partner documentation.
