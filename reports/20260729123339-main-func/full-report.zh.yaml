      - number: '8.2'
        title: 融资背景、公开可比公司的护栏与入场纪律
        blocks:
          - type: paragraph
            body: >-
              公开定价背景在短时间内大幅上移。2025 年 11 月 Series B 轮的锚点是 $275M、估值 $1.25B。2026 年 1 月的公开材料把 $100M ARR 和增补后的 $300M Series B
              轮放在一起。到 2026 年中，公开报道指向超过 $645M 的总融资、$2.6B 估值，以及约 $250M ARR 或年化运行收入。如果这些收入口径扎实，最新估值对应低双位数收入倍数——相对宽口径横向 SaaS
              均值偏贵，但对高速增长的 AI 原生平台并不荒唐。如果这些口径没那么可持续，价格很快就难以自圆其说。公开可比公司护栏的作用就在这里。Salesforce、Workday、UiPath
              等成熟公开平台披露收入质量、现金流和经营杠杆，Main Func 还没有；分析师市场数据也显示，2026
              年软件市场只给少数赢家溢价倍数。实际结论是，入场纪律比叙事兴奋更重要。尤其是，公司最新一次公开估值上台阶发生时，市场仍看不到续约质量、贡献毛利，或自助式使用与受治理企业合同之间的精确经济结构。
