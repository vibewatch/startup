      - number: '2.2'
        title: TAM、SAM 与实用测算口径
        blocks:
          - type: paragraph
            body: >-
              已发布的市场数字区间很宽，因为它们衡量的东西不同。The Business Research Company 对 2026 年职场 AI 的估算达到 $421.09
              billion，但其定义覆盖多数主要行业中的硬件、软件和服务，因此更像一个数字工作支出伞，而不是 Main Func 可直接服务的干净软件 TAM。更窄的估算对决策更有用。Mordor Intelligence
              估计 2026 年智能体 AI 市场为 $9.89 billion，2031 年前 CAGR 为 42.14%；Intel Market Research 把 2026 年 AI 知识自动化市场定为 $14.3
              billion；Data Bridge 估计 AI 知识工作自动化在 2025 年为 $5.27 billion，到 2033 年达到 $14.86
              billion。这些更窄定义彼此仍有差异，但指向同一结论：Main Func
              今天的实用软件市场不是数千亿美元。更可能是一个增长强劲、百亿美元出头的软件机会，供应商只有拿下跨职能工作流预算，而不是像新奇助手一样停留在试用，才能真正赢。真正的建模难点不是抬高
              TAM，而是判断哪个窄切口——研究、财务运营、客户支持或内部工作流自动化——最快转化为可重复的生产支出。
