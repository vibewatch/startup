        title: 里程碑与一阶观察点
        blocks:
          - type: paragraph
            body: >-
              即便部分指标仍由公司自报，里程碑走势也相当连贯。Genspark 于 2024 年 6 月作为 AI 搜索引擎在 Product Hunt 公开上线，并获得早期社区明显关注。到 2025 年 4
              月，公司已经转向智能体化执行；OpenAI 和 Anthropic 后来都把 Super Agent 架构描述为商业拐点。2025 年 11 月随后把两件尽调要事合在一起：大额 Series B，以及 AI
              Workspace 公开发布，后者把公司从搜索重新框定为围绕成品工作结果展开。2026 年 3 月和 6 月又延展了资本基础，并把产品面扩到 Genspark Claw、Microsoft
              集成和更广的企业栈。不过，几个观察点已经出现。TechCrunch
              记录过原搜索产品里未解决的安全、法律和商业模式问题。服务条款否认准确性保证，并把合规责任放回用户；隐私政策则确认，用户调用相关能力时，提示词可能流向 OpenAI 和 Anthropic。Techtimes
              也点出战略依赖：Main Func 的编排层依赖模型供应商，而这些供应商也在打造自己的企业智能体产品。
