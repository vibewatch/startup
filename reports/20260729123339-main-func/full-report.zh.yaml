      - number: '8.3'
        title: 建议、区间与尽调关口
        blocks:
          - type: paragraph
            body: >-
              公开证据支持的建议是继续研究 / 只在价格和条款有纪律时推进。若估值接近最新公开的 $2.6B
              标记，只要私下尽调能证明企业留存强、毛利率可控、优先权包袱有限，公司仍可能值得投资。若没有这些证据却大幅抬价，风险调整后回报逻辑会迅速恶化。因此，基础情形不是“买故事”，而是“只有隐藏指标配得上故事时才买”。牛市情形需要真实的企业级耐久性和持续的
              AI 品类领导力。熊市情形不是破产，而是在增长质量、利润率现实或竞争压力更清晰后，估值倍数向更宽的软件可比公司压缩。对投资者来说，最重要的问题不是 Main Func
              是否令人印象深刻，而是下一轮相对仍未知的事实是否给出足够安全边际。换句话说，本章并不认定公司在绝对意义上估值过高；结论是，估值精度远弱于公司带来的兴奋感，因此，价格、优先权和下行保护上的纪律，本身就是投资假设的一部分。
