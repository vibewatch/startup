        - ARR 中自助套餐与企业版分别占多少？
      - - Team Plan
        - 多席位订阅，含月度点数
        - 按用户每月
        - 公开标价为 $30/user/month，每席位含 12,000 点数
        - 高
        - 折扣和年度条款后，有效净席位价格是多少？
