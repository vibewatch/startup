      - number: '2.4'
        title: 增长驱动、采用约束与估值含义
        blocks:
          - type: paragraph
            body: >-
              增长逻辑确实存在。Google 称，使用生成式 AI 的组织中已有 52% 的高管把智能体投入生产；Anthropic 发现，80%
              受访组织报告了可衡量的经济回报。但同一批研究也说明，采用不是线性的。Anthropic 把集成、数据质量和变革管理列为三大运营摩擦。Gartner 说得更重：到 2027 年底，超过 40% 的智能体 AI
              项目会因成本上升、业务价值不清或控制不足而取消；同时，供应商版图里充满“智能体包装”。因此，市场增长依赖的不是模型新鲜感，而是更严格的东西：治理、互操作性、可解释性，以及与现有企业流程的契合。多智能体编排正在成为默认架构，买方怀疑也在成为默认反应。对
              Main Func 来说，这意味着市场规模本身不能支撑估值。公司需要证明，它的编排层达到了生产级、可衡量，并且不同于
              Workday、Salesforce、ServiceNow、SAP、Microsoft、UiPath 和 Automation Anywhere 已经嵌入应用中的原生智能体。
