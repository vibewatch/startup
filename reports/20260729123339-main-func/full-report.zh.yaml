            body: >-
              公开资料讲获客和协作远多于讲耐久性。公司没有披露 NRR、GRR、流失、同期群留存、logo 留存、平均合同期限或头部客户集中度。不过，如果平台成功落地，产品面确实暗示了扩张路径。Shared Hubs
              在项目之间保留上下文；Teams 支持组织级消息和项目共享；GenTeam 引入持久的人加智能体频道；Meeting Notes
              自动加入会议并跨会议平台共享输出；管理员工具暴露席位管理、用量分析、连接器控制，以及新增席位或额外积分包等增购杠杆。这些功能构成了一个可信的先落地再扩张动作，但还不能证明经济性耐久。因此，尽调结论是混合的：扩张机制可见，留存质量和集中度风险仍大多不透明。实际看，买家显然能看到一个团队采用后产品如何扩散，但外部投资人仍无法判断这种扩散来自健康续约、广泛席位增长，还是由新
