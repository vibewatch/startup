            body: >-
              公司强力塑造创始人-市场匹配叙事，底层证据总体也支撑这一说法。2025 年 11 月的融资稿称，CEO Eric Jing 是 Microsoft Bing 创始成员，并曾打造一家估值达到 $5.5
              billion 的公司；TechCrunch 和 Baidu Baike 则把 Jing 与 CTO Kay Zhu 都和 Microsoft、Google、Baidu、Xiaodu 的搜索和 AI
              经历联系起来。COO Wen Sang 则补上企业软件能力：他拥有 MIT 博士学位，曾创办 Smarking，并在获得 Y Combinator 和 Khosla
              支持后退出。治理能见度弱于创始人能见度：公开资料对创始人和投资人信息很丰富，但对正式董事会名单、独立董事或委员会结构披露很少。Emergence Capital 合伙人 Joe Floyd 在 Series B
              材料中露出明显，说明主导投资方有影响力，但这不同于成熟上市公司治理体系能提供的透明度。叙事集中在三位经营者身上，既是优势，也带来关键人物依赖。
