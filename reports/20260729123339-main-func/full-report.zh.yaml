      - number: '4.4'
        title: 资本充足性、融资依赖与尽调障碍
        blocks:
          - type: paragraph
            body: >-
              从资本充足性看，公司短期很强，中期不透明。按公开报道，Main Func 于 2025 年 11 月以 $1.25 billion 投后估值完成 $275 million Series B，2026 年 4
              月前后把该轮扩展到约 $1.6 billion 估值、$385 million，随后在 2026 年 6 月又融资 $100 million，使总融资超过 $645 million、估值达到 $2.6
              billion。对一家 2023 年成立的软件公司来说，这笔股权资本很可观，应该足以支持公司投入基础设施、模型采购、国际 GTM
              和企业支持。未解决的问题是烧钱速度。没有公开来源披露现金余额、月度现金消耗、资金可支撑时间、销售效率，或公司预计何时转正自由现金流。此外，2026 年融资叙事内部有不一致：一份发布称该轮补到 $300
              million；另一份称 $385 million；后续报道又称总融资超过 $645 million。这些不是致命矛盾，但确实强化了一个需求：在承销下一轮或盈利路径前，必须先拿到干净的融资台账。
