  - id: TV002
    title: 投资论点 / 反论点表
    columns:
      - 论点
      - 改变判断的证据
    rows:
      - - 拥有真实客户采用的超高速增长 AI 工作空间，可以支撑溢价软件定价
        - 证明 $250M 规模 run-rate 可持续、足够多元且续约良好
      - - 产品广度和成品交付导向，能撑起可信的平台叙事
        - 证明可靠性和治理在企业生产环境中顶得住
      - - 多模型编排和上下文层可以支撑差异化工作流
        - 证明供应商或既有厂商能以更低摩擦复制该价值
      - - 公开证据仍缺少留存、利润率和股权结构透明度
        - 干净的 cohort 数据、利润率桥和优先权披露会显著提高投资测算可信度
      - - 最新估值可能已折现近期成功的大部分
        - 更低进入价格或异常投资者友好的条款，会迅速改善回报测算
    notes: 这是一张动态论点表，不是静态结论；每行都点出能改变价格纪律的证据。
    claimRefs:
      - CV001
      - CV004
      - CV007
      - CV018
      - CV024
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - $300M+ 可持续 ARR / run-rate，企业留存强，尽管有模型成本仍保持高毛利率，优先权包袱有限，品类领导地位守住
        - 若进入价接近或低于最新公开标记，支撑 $3.5B-$5.0B 股权价值和有吸引力的上行空间
        - 竞争打包、利润率漏损或治理事故会封顶上行空间
        - 私有指标必须明显好于公开证据缺口所暗示的水平
      - - 基准
        - ~$250M 可持续 ARR / run-rate，留存不错但不顶尖，毛利率仍低于成熟 SaaS，增长仍强但放缓，条款标准
        - 支撑约 $2.2B-$3.0B 股权价值；仍有上行，但对倍数更敏感
        - 客户质量不透明和供应商依赖让折现率维持高位
        - 最符合当前公开证据
      - - 悲观
        - 收入质量弱于声称，利润率负担被证实很重，企业端耐久性未证实，或下一轮定价把完美预期计入过多
        - 估值压缩至约 $1.4B-$2.0B；若以 $2.6B+ 进入，上行空间有限
        - 留存、竞争或执行失望触发倍数重置
        - 鉴于私有数据缺失，这一情景仍有可能
    notes: 区间是作者情景，锚定公开融资背景、软件可比公司护栏和公司披露的增长声明。
    claimRefs:
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
      - CV026
      - CV027
      - CV028
  - id: TV004
    title: 可比估值表
    enumerationScope:
      coverage: partial
      basis: >-
        Reference set of public software and automation comparables plus market-data anchors most relevant to Main
        Func’s horizontal AI-workflow and enterprise-automation valuation logic as of 2026-07-29.
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 参考意义
      - 局限
    rows:
      - - Main Func 公开标记
        - 到 2026 年 7 月约 $250M ARR 或年化 run rate
        - 隐含估值约 $2.6B；按 $250M 约 ~10x，按 $100M ARR 约 ~26x
        - 当前直接定价锚
        - 收入质量和具体条款仍未公开
      - - UiPath
        - FY2026 ARR $1.853B；GAAP 毛利率 85%
        - 成熟公开市场自动化平台，增长较慢但披露好得多
        - 治理和企业执行预期的最佳公开自动化可比公司
        - 不像 Main Func 那样 AI 原生，且有公开市场成熟度折价
      - - Workday
        - FY2026 收入 $9.552B；non-GAAP 运营利润率 29.6%；客户 11,500+
        - 可信企业平台和系统记录可比对象
        - 可作为信任、披露和企业耐久性预期的上限
        - 规模更大、嵌入更深，超过 Main Func
      - - Salesforce
        - FY2026 Q4 订阅与支持收入 $10.7B；当前 RPO $35.1B；FY26 FCF $14.4B
        - 说明公开市场如何奖励具备现金流和待履约订单可见性的耐久企业软件
        - 良好的信任与分销可比对象
        - 过于成熟且多元，不能直接做倍数可比
      - - 公开横向 SaaS 市场数据
        - Multiples.vc 2026 年 7 月横向 SaaS 平均值 / 参考点
        - 约 6.1x EV / NTM revenue，离散度由增长和 AI 定位驱动
        - 防止为普通软件增长支付过高价格的有用护栏
        - 市场数据篮子，不是公司特定可比对象
      - - BVP Nasdaq Emerging Cloud Index 指数
        - 新兴公开云软件指数
        - 跟踪公开云软件 cohort；可作为情绪和相对倍数背景
        - 成长软件的公开市场情绪指标
        - 指数层面数据，非针对 Main Func 具体商业模式
    notes: 这张表是估值框架，不是声称任何单一可比对象都完全匹配 Main Func。
    claimRefs:
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
      - CV016
      - CV017
      - CV018
      - CV019
  - id: TV005
    title: 论点破裂与叫停触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对论点的传导
      - 行动含义
    rows:
      - - 可持续 ARR / 客户声明未通过尽调
        - cohort、使用量或收入确认无法支撑标题增长声明
        - 打破核心溢价增长叙事
        - 按悲观情景重切估值，或放弃
      - - 毛利率显著低于预期
        - 模型、媒体或支持成本指向结构性偏弱的经济性
        - 限制软件式扩展性，并压缩应得倍数
        - 要求更低价格，或直接放弃
      - - 客户质量集中或续约偏弱
        - NRR / GRR 不达溢价软件预期，或头部客户集中度不符合预期
        - 把广泛采用故事变成脆弱收入故事
        - 立即切到悲观情景
      - - 重大信任 / 治理事故
        - 安全、隐私或错误动作事件击穿企业信任
        - 推高折现率，并放慢企业端落地
        - 推迟或拒绝投资
      - - 下一轮价格在没有更强证据时超过公开逻辑
        - 条款意味着在缺少新尽调支撑时显著高于最新标记价格买入
        - 消除安全边际
        - 除非私有数据显著强于公开证据，否则放弃
    notes: 叫停触发因素设计成能在尽调中验证，而不是只依赖叙事解读。
    claimRefs:
      - CV024
      - CV026
      - CV027
      - CV029
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 股权结构和优先权
        - 完全稀释后所有权、优先级结构、清算优先权和反稀释条款
        - 决定表面上行空间是否真正可投资
        - 要求提供股权结构表、历史 term sheet 和 waterfall 模型
      - - 收入质量
        - ARR 定义、cohort 留存、流失、扩张，以及自助服务与企业客户组合
        - 区分可持续软件价值和短期使用峰值
        - 要求提供 cohort 表和财务包
      - - 利润率桥
        - 按模态拆分的毛利率、模型供应商支出、支持负担和单位经济性
        - 决定规模是否转化为软件式盈利能力
        - 要求提供交付成本和供应商支出分析
      - - 客户集中度
        - Top-20 客户敞口、ACV 分布、合同期限和续约状态
        - 衡量快速客户增长声明背后的脆弱性
        - 要求提供销售运营和财务导出数据
      - - 可靠性 / 信任指标
        - 事故历史、错误动作率、工作流完成率、企业安全审查结果
        - 广泛的自主工作平台成败取决于信任
        - 要求提供事故日志、基准测试结果和审计摘要
      - - 轮次价格与证据
        - 2026 年 6 月后的任何私有标记、二级交易信号、409A 或条款演变
        - 锚定当前进入价格是否仍能提供目标回报
        - 要求提供融资时间线和任何近期交易材料
    notes: 这些要求刻意聚焦高杠杆点；每一项都可能实质性影响价格或建议。
    claimRefs:
      - CV020
      - CV021
      - CV024
      - CV025
      - CV028
      - CV030
