      - number: '4.3'
        title: 成本结构、利润率与运营杠杆代理指标
        blocks:
          - type: paragraph
            body: >-
              Main Func 仍然过于私密，无法直接测算毛利率；最好的公开方法，是把产品架构线索和规模化可比公司合在一起看。架构很可能承载不低的推理和服务成本，因为 Genspark
              在多个前沿模型、语音、图像和视频输出之间路由工作，并且越来越多地运行定时或长周期自动化。零保留、SSO、连接器和合规等企业安全承诺，也会带来平台和支持开销。这些成本意味着，Main Func
              近期毛利率几乎肯定低于成熟工作流软件同行。但公开可比公司显示，终局仍可能有吸引力：UiPath FY2026 GAAP 毛利率为 83%，Workday 和 Salesforce
              也展现了强订阅收入规模、运营利润率和现金生成能力。财务解读是，如果 Main Func
              改善路由效率、与模型供应商的采购经济性以及企业支持杠杆，利润率路径最终可能接近高质量软件。在那之前，主要风险是多模态工作负载和慷慨的内含 credits 让收入看起来强于真实单位经济。
