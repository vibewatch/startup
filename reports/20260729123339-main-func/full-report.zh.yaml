  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源与变现逻辑
        blocks:
          - type: paragraph
            body: >-
              Main Func 的变现看起来是自助订阅、团队计划和定制企业协议的混合，而不是单一经典 SaaS 席位模式。最清楚的公开锚点是 Genspark for Business：其 Team Plan
              标价为每用户每月 $30，每席位含 12,000
              credits，并提供集中计费、SSO/SAML、发票、连接器管理，以及对高端模型的广泛访问。帮助中心的工作流文档展示了产品如何扩展到定时和邮件触发的自动化，这说明变现可以从简单席位访问延伸到更高价值的工作流用量。这个点很重要，因为平台卖的不只是聊天，而是覆盖幻灯片、图像、视频、电话、研究和集成的高成本输出。公开叙事也反复同时强调个人用户和企业客户，说明收入基础可能是混合的：上层靠病毒式自助获客，下层承接谈判型企业合同。实际看，Main
              Func 的商业模式更像一个成本随消耗变化的工作空间平台，而不是一个用量模式统一、按席位收费的干净 SaaS 产品。
