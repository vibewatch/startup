            title: 创始人-市场匹配与产品赌注异常同向
            body: Main Func 不是从零讲一个泛 AI 故事；它推的是搜索与执行层，而打造者此前做过搜索、助手和企业软件。这让公司从搜索转向成品工作自动化，比普通 AI 套壳叙事更可信。
