    data:
      items:
        - label: 市场机会
          score: 8
          detail: AI 工作流是大品类，仍有空间跑出高溢价赢家。
        - label: 产品野心
          score: 8
          detail: 成品化工作套件覆盖面广，品类叙事也强。
        - label: 客户验证
          score: 6
          detail: 公开采用势头很强，但留存质量披露不足。
        - label: 经济性可见度
          score: 3
          detail: 公开层面看，毛利率、现金和股权结构都不透明。
        - label: 竞争护城河
          score: 5
          detail: 产品领先有意义，但现有巨头和模型厂商压力很大。
        - label: 风险负担
          score: 4
          detail: 信任、供应商和治理风险仍然偏高。
        - label: 估值支撑
          score: 5
          detail: 最新公开估值有解释空间，但并不明显便宜。
        - label: 证据质量
          score: 4
          detail: 增长证据已经跑出来，私下质量披露还没跟上。
