      - number: '7.4'
        title: 团队、执行，以及推翻投资假设的触发点
        blocks:
          - type: paragraph
            body: >-
              剩下的风险是极高速增长下的执行质量。OpenAI 曾描述，一个 20 人团队推动了早期超级智能体增长；Anthropic 后来称团队约有 50 名工程师，内部还相信，除了执行速度之外，“nobody really
              has a moat anymore”。速度可以是优势，也可能遮住支持体系不足、控制薄弱，或创始人和小核心工程团队的关键人集中。客户口径也比客户透明度扩张得更快：2026 年 1 月称有 1,000
              多家组织，2026 年 7 月称有 7,000 多个商业客户，但没有公开 NRR、GRR、事故记录、集中度表或续约指标。投资含义很直接：如果 Main Func
              能证明企业部署可靠、毛利率可控、客户足够分散，风险画像会很快收敛。否则，增长可能比头部动能暗示的更浅。正确的尽调姿态不是因为公司有创业风险就否定它，而是在按激进估值倍数承销之前，围绕可靠性、客户质量和供应商依赖设定明确的否决标准。
