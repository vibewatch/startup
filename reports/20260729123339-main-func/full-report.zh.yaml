chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与产品定位
        blocks:
          - type: paragraph
            body: >-
              Main Func 是 Genspark 背后的公司主体。公开资料如今描述的这家公司，已经不太像搜索实验，更像面向知识工作者的智能体化工作空间供应商。公司官网称，其总部在 Palo Alto，由
              Microsoft、Google、Meta 和 Pinterest 校友创立，并在 Singapore 和 Tokyo 设有办公室。法律页面把运营结构讲得更清楚：MainFunc Inc.
              提供服务，Genspark Inc. 是其全资子公司，genspark.ai 是主要产品入口。产品叙事演进很快。TechCrunch 在 2024 年 6 月报道 Genspark 时，它还是围绕
              Sparkpages 打造的 AI 搜索引擎；但 OpenAI、Anthropic 和公司后续发布都指向 2025 年的转向：一个提示词可以产出幻灯片、文档、电子表格、Web 应用或 AI
              电话，产品重点变成自主完成任务。这个重新定位很关键，因为后续尽调应把 Main Func 看作工作流自动化和生产力平台，而不只是一个消费者 AI 搜索业务。
