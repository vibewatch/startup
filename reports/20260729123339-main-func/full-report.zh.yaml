  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与待完成任务替代路径
        blocks:
          - type: paragraph
            body: >-
              Main Func 面对的不是一组清晰可比的同业。买家至少可以用五条路径满足同一需求：记录系统内的应用原生智能体、以编排为核心的自动化平台、横向工作空间
              copilot、主导单一工作流的创业公司专家，以及用基础模型工具内部自建。Main Func 自己的叙事把它放在横向“成品工作”层：用户表达意图，Genspark
              编排多个模型和工具，平台返回研究、幻灯片、分析、销售触达或工作流输出等完成后的交付物。因此，最直接的战略比较不在某个单一聊天机器人，而在客户是否更愿意选择一个跨职能智能体工作空间，而不是
              Salesforce、Workday、ServiceNow、Microsoft、SAP、UiPath 或 Automation Anywhere 里的应用内自动化。实际替代集合也就比 AI
              智能体创业公司更宽。Fortune 500 买家可以通过扩展既有可信系统、增加一个编排层，或采用 ROI 叙事更紧的专业智能体，解决同一个问题。
