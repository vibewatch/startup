      - number: '7.3'
        title: 供应商、分发与财务模型风险
        blocks:
          - type: paragraph
            body: >-
              公司的商业上行空间和依赖风险绑在一起。公开材料称，Genspark 编排 30 多到 70 多个模型，核心推理和语音能力依赖 OpenAI 与 Anthropic，并接入
              Slack、Notion、Salesforce、HubSpot、Google Workspace、Microsoft 365 等企业系统。Anthropic
              的商业条款明确说明，若法律、攻击、成本或上游供应商问题造成干扰，服务可以被暂停；OpenAI 的服务条款也把 beta 功能和部分输出赔偿责任划在保障之外。因此，Main Func
              承受的不只是供应商涨价，还包括政策变化、宕机、模型质量回退，以及合同边界收紧。财务上，积分体系叠加宽广的多模态产品线，意味着使用量增长会同时推高收入和交付成本。在毛利率透明的成熟 SaaS
              平台里，这还可控；但在这里，客户集中度、流失率和利润率仍未公开，风险真实存在。与此同时，Salesforce、Microsoft、Workday、ServiceNow 和 UiPath
              都在既有企业系统内部推进智能体式自动化，Main Func 必须一边跑赢供应商依赖，一边跑赢掌握分发入口的既有巨头。
