      - number: '5.4'
        title: 差异化、依赖与技术判断
        blocks:
          - type: paragraph
            body: >-
              从技术上看，Main Func
              的差异化来自三件事合在一起：输出成品工作而不是聊天；跨多个模型和工具编排，而不是押注单一模型家族；以及个人或企业上下文层，让智能体随时间变得更有用。这些都是有意义的强项。但它们单独并不是护城河。OpenAI、Anthropic、Microsoft
              和其他前沿模型供应商越来越多地开放让这些工作流成为可能的基础构件；竞争平台如今也公开谈编排；产品仍依赖第三方模型质量、API 经济性和连接器可靠性。就连创始人在 Anthropic
              案例研究中也承认，“没人真的还有护城河了”，执行速度最重要。因此，技术判断是正面但有条件的：架构可信，产品面丰富，企业控制叙事强于典型早期 AI
              创业公司——但公司仍需证明，它的编排层交付成品结果的可靠性，强于买家用同一套底层模型生态在别处自行拼出的方案。
