  - id: FV001
    title: 投资建议逻辑
    type: flow
    layout: wide
    summary: 投资建议从快速增长证据出发，再经过估值支撑和未解的质量缺口，落到对价格敏感的「继续研究」立场。
    claimRefs:
      - CV001
      - CV011
      - CV015
      - CV022
      - CV024
      - CV025
    data:
      nodes:
        - id: growth
          label: 真实增长信号
          detail: 2026 年 1 月 ARR 达 $100M；2026 年 7 月 ARR / 年化收入约 $250M
        - id: product
          label: 广谱产品野心
          detail: AI 工作空间、多模型编排，并声称拥有 7,000+ 家企业客户
        - id: opacity
          label: 质量不透明
          detail: 未公开留存率、利润率、股权结构或客户集中度披露
        - id: comp
          label: 上市可比参照
          detail: 广义软件平均水平低于高溢价 AI 叙事
        - id: price
          label: 最新公开价格
          detail: 约 $2.6B 估值需要更持久证据，才显得有吸引力
        - id: verdict
          label: 继续研究 / 价格敏感
          detail: 只有拿到更强的私下尽调证据，才继续推进
      edges:
        - from: growth
          to: verdict
        - from: product
          to: verdict
        - from: opacity
          to: verdict
        - from: comp
          to: verdict
        - from: price
          to: verdict
