        - Team Plan $30/user/month，每席位含 12,000 点数；企业版定制
        - 工作空间访问、顶级模型、管理员控制、SSO/SAML、连接器
        - 企业实际成交价未知
        - 简单席位锚点有助初始采用，但企业经济性仍不透明
      - - Salesforce Agentforce
        - $500 / 100k Flex Credits；$2 / 对话；$125/user/month 附加项；版本从 $550 起
        - 面向客户与员工的智能体，绑定 Salesforce 工作流
        - 大型合同很可能混合点数与预购承诺
        - 定价明确，但可能变得复杂且按用量计费
      - - Microsoft Copilot Studio
        - $200 / 月，含 25,000 Copilot Credits，或按量付费
        - 租户级智能体创建，并部署到 Microsoft 界面
        - 按组织计费可能掩盖每条工作流的真实成本
        - Microsoft 版图内很强，但用量核算很关键
      - - Workday Sana
        - 打包进 Workday Flex Credits，核心自助智能体没有单独许可墙
        - 执行 HR 和财务任务，并提供企业连接器
        - 实际价值取决于现有 Workday 合同和 Flex Credit 池
        - 打包销售是 Workday 的分发优势
      - - Clay
        - 免费层；Launch 起价 $167/mo；Growth 起价 $446/mo
        - 工作流自动化、数据增补、Claygent 网页研究、营销活动支持
        - 动作和数据点数扩张会显著改变实际成本
        - 在 GTM 专项工作上，Clay 价格低于泛企业智能体平台
      - - UiPath / Automation Anywhere / IBM / SAP / Sierra / Ema / 11x / Cognition 等竞品
        - 大多按报价或定制企业定价
        - 随平台、工作负载和服务强度而变
        - 公开可比性仍低
        - 不透明定价拖慢同口径评估，也抬高尽调负担
