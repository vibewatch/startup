      - number: '5.2'
        title: 架构与运营模型
        blocks:
          - type: paragraph
            body: >-
              公开技术证据指向以编排为核心的架构。Mainfunc.ai 称 Genspark 使用 Super Agent 处理信息，借助 mixture-of-agents 系统编排 30 多个 AI 模型。OpenAI
              的案例研究描述了一个无代码自主助手，可协调九个专业大语言模型和 80 多个工具；Anthropic 则称后来的 Super Agent 编排超过 150 个工具，并在工具选择循环和代码生成中都使用
              Claude。因此，公司看起来在运营一个分层运行时架构：顶部是用户意图，中间是规划器 / 路由器，下方是异构前沿模型和自研工具，生成的工件和动作之上再有一组输出界面。SecondBrain 随后充当记忆层，给
              Super Agent 更个性化的上下文；Skills 和 AgentBase 则打包可重复的执行模式。这个架构不同于单模型聊天，但也直接依赖模型供应商、连接器和持续评估纪律。
