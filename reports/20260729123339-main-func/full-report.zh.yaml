      - - Main Func / Genspark
        - 横向 AI 工作空间 / 成品交付智能体层
        - 2025 年 11 月以 $1.25B 估值完成 $275M Series B；2026 年另称有后续扩展轮
        - 覆盖研究、GTM、财务和一般业务工作流的知识工作者
        - 70+ 个模型、成品输出、广泛跨职能覆盖
        - 覆盖越宽，分发和信任负担越重
      - - UiPath
        - RPA + 智能体编排既有厂商
        - 上市公司规模
        - 自动化 COE、IT、运营、公共部门、SAP 重度企业
        - Maestro 控制平面统管智能体、机器人、系统与人
        - 工作流优先的基因，可能比消费级工作空间显得更重
      - - Automation Anywhere
        - 智能体化流程自动化既有厂商
        - 成熟企业自动化厂商
        - 运营、IT、医疗、制造、金融服务
        - Process Reasoning Engine，加上强治理 / 合规叙事
        - 在临时知识工作创作上，横向属性不够明显
      - - Salesforce Agentforce
        - CRM 原生智能体平台
        - 大型上市平台规模
        - 销售、客服、现场服务、员工服务、IT 服务
        - 借 CRM 数据分发，并打包动作 / 对话计费
        - Salesforce 已掌握工作流上下文时最有说服力
      - - Microsoft Copilot Studio
        - 横向智能体构建器与 Microsoft 365 分发
        - 大型平台规模
        - 通用企业生产力与部门智能体
        - 进入 Teams、SharePoint 和 Microsoft 365 Copilot，并采用点数计费
        - 通常在 Microsoft 语境内最强，而不是横跨所有系统
      - - Workday Sana
        - HR 与财务权威记录系统智能体层
        - 大型上市平台规模
        - CHRO、CFO、共享服务、经理、员工
        - 在已有权限和审计控制下执行 HR / 财务工作流
        - 重心仍在人和钱两类工作流
      - - ServiceNow AI Agents
        - 工作流原生企业智能体平台
        - 大型上市平台规模
        - IT、HR、CRM、风险、安全、应用开发
        - AI Agent Orchestrator、Fabric 和 Control Tower 覆盖企业工作流
        - ServiceNow 已跑着流程骨干时最契合
      - - SAP Joule Agents
        - ERP 原生 AI 智能体层
        - 大型企业应用规模
        - 财务、采购、供应链、以 ERP 为中心的买家
        - 业务流程锚定和 SAP Knowledge Graph
        - 离开 SAP 中心化流程版图，说服力会下降
      - - IBM watsonx Orchestrate 平台
        - 控制平面与受治理编排平台
        - 大型企业技术规模
        - CX、销售、HR、财务、采购、IT 运维
        - 开放混合控制平面，提供集中可见性和策略
        - 可能更偏平台赋能，而不是对终端用户工作空间友好
      - - Google 智能体平台
        - 云智能体平台 / 构建器
        - 超大规模云厂商规模
        - 开发者、云原生团队、定制企业构建
        - 透明 token 经济性与模型访问
        - 买家需要自己构建和治理更多环节
      - - Sierra
        - 客服智能体专精厂商
        - 据报 2026 年以 >$15B 估值融资 $950M
        - 客户体验和联络中心负责人
        - 深入的对话式 CX 工具、可观测性和结果优化
        - 离开客服 / CX 后，比 Main Func 更窄
      - - Cognition / Devin
        - 自主软件工程专精厂商
        - 据报 2026 年完成巨额融资且估值很高
        - 工程团队和软件组织
        - 在编码、测试和交付软件上自主性最深
        - 不是广义白领自动化工作空间
      - - Ema
        - AI 员工平台
        - 风投支持的创业公司规模
        - HR、IT、财务、员工服务工作流
        - 100+ 模型融合、治理姿态、1,000+ 连接器主张
        - 仍更偏企业流程，而不是成品式创作输出
