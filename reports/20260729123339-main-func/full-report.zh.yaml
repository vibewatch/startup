      - number: '2.3'
        title: 买家、用户、付费方与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方结构解释了为什么这个市场增长很快，却在采购路径上高度碎片化。供应商证据显示，AI 智能体如今由记录系统和工作流系统的所有者来销售：Workday 把智能体绑定到 HR 和财务数据，ServiceNow
              把智能体绑定到 IT、HR、CRM 和风险工作流，Salesforce 把它们打包进服务和销售动作，Microsoft 在 Microsoft 365 里提供通用智能体构建，SAP 把它们落在 ERP
              工作流上，RPA 领导者则推动智能体、机器人和人之间的编排。因此，买家通常先是职能预算负责人，其次才是中央 AI 团队。HR
              负责人关心自助服务和招聘，财务负责人关心关账流程和审计证据，客服负责人关心工单解决，IT
              负责人关心事件和访问工作流，运营或销售负责人关心分析、触达和重复协调。采用通常从可信数据和权限已经存在的地方开始，再扩展到跨应用编排。对 Main Func
              来说，结论很清楚：谁最靠近可信上下文，同时还能跨系统交付横向结果，谁就拥有分发优势。
