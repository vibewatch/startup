  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资假设与反面假设
        blocks:
          - type: paragraph
            body: >-
              核心投资假设是，Main Func 可能在搭建最早一批宽口径 AI 工作层，而且能按企业级速度变现。按公开说法，公司在 2024 年还处在搜索产品阶段，2025 年推出 Super Agent，2026 年推进到
              AI Workspace 6.0，同时宣称 ARR、客户数和产品覆盖面都快速扩张。只要其中相当一部分增长具备持续性，公司就不该和普通 SaaS 均值相比，而应进入高溢价的 AI
              原生软件叙事。反面假设是，公开记录看起来仍更像动能证明，而不是质量证明。流失率、NRR、毛利率、现金余额、优先权结构和客户集中度都没有披露。产品宽度令人印象深刻，也同步抬高了可靠性、供应商和治理风险。因此，投委会更合适的框架是有条件乐观：公司强到不能轻易放弃，信息不透明到不能随意承销，发展速度又快到不能只靠过时的
              2025
              年估值锚来判断。这个细节很重要，因为正确的投资者行为不是二元化信念，而是分阶段信念：兴趣足够强，值得继续推进；怀疑也足够强，不能接受只靠叙事定价；同时还要承认，隐藏的客户分群或条款数据仍可能让价值向任一方向大幅移动。正因为存在这种不对称，纪律严明的长期投资者可能靠耐心创造比速度更多的价值。
            claimRefs:
