  - id: TR005
    title: 缓释措施与叫停标准表
    columns:
      - 风险
      - 可监控触发因素
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 可靠性风险
        - 企业账户的工作流失败率显著上升
        - 反复发生关键事故，或在缺少站得住脚的控制措施时出现错误动作
        - 暂停估值测算，直到审计数据和补救措施证明改善
      - - 客户质量风险
        - 留存偏弱或 ARR 集中
        - NRR 低于优秀企业软件常模，或头部客户集中度过高
        - 将增长重估为低质量，并下调倍数假设
      - - 供应商依赖风险
        - 模型供应商成本或政策冲击
        - 供应商变化带来利润率挤压或产品退化
        - 压测下行情景现金消耗和护城河韧性
      - - 监管 / 隐私风险
        - 执法问询、高严重性隐私事件或不合规 AI 披露流程
        - 正式调查或企业安全审查反复失败
        - 推迟投资，或要求补救作为交割前提条件
      - - 分销风险
        - 企业订单明显转向既有套件
        - 竞争失利源于系统记录打包，而不是功能差距
        - 收窄目标市场，或修正终局份额假设
      - - 执行风险
        - 支持、导入或安全运营在增长中退化
        - 积压升级、宕机增多或实施摩擦上升
        - 将超高速增长视为运营成本不可持续
    notes: 叫停标准聚焦能打破“快速增长转化为可持续企业软件”这一论点的证据。
    claimRefs:
      - CR037
      - CR038
      - CR039
      - CR040
  - id: TV001
    title: 建议摘要表
    columns:
      - 建议
      - 置信度
      - 风险评级
      - 估值立场
      - 决策含义
    rows:
      - - 继续研究 / 选择性推进
        - 中
        - 高
        - 对价格敏感；最新公开估值上跳并非显然错误，但仅凭公开证据还撑不起稳妥的投资测算
        - 仅在私有尽调确认留存、利润率和条款干净后继续
    notes: 建议刻意设置为条件式，因为证据质量落后于增长质量。
    claimRefs:
