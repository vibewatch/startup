        - 高
        - 定价、质量、政策或可用性变化会拉低产品质量或利润率
        - 高
        - 多模型编排与路由
        - 高：核心客户价值仍取决于外部模型供应商
      - - 业务系统连接器
        - Google、Microsoft、Slack、Notion、Salesforce、HubSpot 等
        - 数据访问、记忆、工作流上下文和执行
        - 高
        - API 变化、宕机、权限被撤销或企业安全拦截会削弱效用
        - 高
        - 连接器覆盖面广，管理员控制齐全
        - 中高：连接器健康度是差异化上下文的基础
      - - 云 / 服务合同条款
        - OpenAI / Anthropic 及其依赖的任何上游供应商
        - 约束服务暂停、赔偿范围和支持义务
        - 中高
        - 服务暂停、赔偿缩窄或 beta 除外条款会造成客户或平台中断
        - 高
        - 合同谈判与备用路由
        - 中高：关键保护写在 Main Func 无法控制的第三方合同里
      - - 企业分销渠道
        - Salesforce、Microsoft、Workday、ServiceNow、UiPath 等既有厂商
        - 争夺工作流预算，且已掌握系统记录上下文
        - 高
        - 既有厂商把同类 agent 打包进既有支出和信任锚点
        - 高
        - 更快的 UX 创新和更广的输出范围
        - 高：分销重力可能压过功能质量
      - - 高增长 AI 的资本市场支持
        - 成长型投资者 / 私募市场胃口
        - 如果利润率落后于增长，资本继续支撑扩张
        - 中
        - Main Func 尚未证明经济性可持续前，AI 市场情绪先降温
        - 中高
        - 大额现金融资和强劲的公开 ARR 轨迹
        - 中：当前资本通道强，但估值敏感性仍高
