      - number: '3.4'
        title: 切换成本、多栖使用与护城河耐久度
        blocks:
          - type: paragraph
            body: >-
              整个品类的竞争耐久度仍大多未被证明。今天最强的锁定来自数据位置、工作流嵌入、管理员控制和采购便利，而不是纯模型质量。Workday、ServiceNow、Salesforce、SAP 和 Microsoft
              都受益于既有身份、数据和工作流锚点。UiPath 和 Automation Anywhere 受益于流程图谱、机器人资产群和治理层，这些东西替换成本高。Sierra 和 Cognition
              这类专家如果占据关键任务工作流并收集丰富运营反馈，也能形成更深的切换成本。Main Func
              的护城河假设建立在编排广度、输出质量，以及围绕单一界面完成多类任务的用户习惯之上。如果团队把研究、报告和工作流执行集中到 Genspark
              内部，这可能变得粘性很强。但如果买家在多个模型工作空间之间多栖使用，把敏感工作流留在记录系统内，或认定专业智能体比宽泛横向层更安全，它就会很脆弱。竞争问题不是 Main Func
              有没有产品，而是它的广度能否在既有厂商智能体和更便宜的模型型替代方案吸收同类用例之前，复利成持久的工作流重力。
