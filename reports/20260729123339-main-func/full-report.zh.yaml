        - 覆盖主要垂直行业的硬件、软件、服务、职场 AI 和数字化转型支出
        - 纯消费者应用基本不在范围内，但这一类别仍包含大量非 Main Func 支出
        - 企业 CIO、业务职能负责人、转型预算
        - 只能作为上限使用；直接承销 Main Func 时过宽
      - - AI 生产力工具
        - 虚拟助理、文档管理、RPA、分析、内容创作、代码辅助、PM、协作、日程安排
        - 硬件、深层模型基础设施、非生产力 AI
        - 部门负责人、IT、一线业务软件预算
        - 更贴近 Main Func，因为它覆盖日常知识工作岗位
      - - AI 知识工作自动化
        - 内容生成、企业搜索、工作流管理、客户支持、数据分析
        - 物理自动化，以及缺少自动化深度的通用协作软件
        - 运营、支持、研究、财务和后台负责人
        - 匹配度强，因为 Main Func 销售的是完成后的工作，而不是单点回答
      - - 智能体式 AI 软件
        - 自治流程自动化、多智能体编排、带工具使用的助理、智能体平台
        - 传统脚本机器人、非自治助理、通用基础设施
        - AI 平台负责人、自动化 COE、职能流程负责人
        - 最直接地框定 Main Func 以编排为核心的产品假设
      - - Main Func 实际目标市场
        - 面向研究、财务、支持、销售赋能、HR 和内部运营的跨职能知识工作自动化
        - 机器人、通用 AI 基础设施、硬件和泛协作类别
        - 职能负责人和平台 / IT 审批人的组合
        - 最站得住脚的尽调边界，因为它匹配产品实际做的事
    notes: 同一个供应商可能出现在多行，因为分析师分类彼此重叠；本表讨论的是市场边界逻辑，而不是互斥的公司集合。
