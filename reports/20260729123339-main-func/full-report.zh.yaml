      - number: '1.3'
        title: 资本结构、规模说法与运营成熟度
        blocks:
          - type: paragraph
            body: >-
              Main Func 的融资节奏异常快。公开报道和公司支持的发布材料显示：2024 年约 $60 million 种子轮，2025 年初 $100 million Series A，2025 年 11 月 20
              日以 $1.25 billion 投后估值完成 $275 million Series B，2026 年 3 月扩展后 Series B 达到 $385 million、估值约 $1.6 billion，2026
              年 6 月再扩展后总融资超过 $645 million、估值 $2.6 billion。运营规模披露同样快速抬升，但附带不少限制。2025 年 11 月 Series B 材料称，AI Workspace
              上线五个月内业务突破 $50 million 年化收入口径；OpenAI 后来引用 Super Agent 上线 45 天后 $36 million ARR，Anthropic 引用转向后 ARR 超过 $250
              million，2026 年 7 月新闻稿又加入 7,000+ 商业客户。这些数据点方向上利好，但独立验证仍有限，公开人员规模信号也互相打架：从 2024 年约 20 人团队，到 2026 年 51-100
              名员工或约 143 名员工不等，Anthropic 则专门称工程师约 50 人。
