  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与品类契合度
        blocks:
          - type: paragraph
            body: >-
              测算 Main Func 机会的第一步，是先判断它到底处在哪个市场。最宽的口径——“职场 AI”——有助于理解长期预算迁移，但不适合支撑对 Main Func
              这类公司的投资判断，因为它把硬件、服务、职场设备，以及远超知识工作自动化的企业 AI 支出都打包进来。更相关的是更窄的口径：智能体 AI、AI 生产力工具和 AI
              知识工作自动化。这些品类都围绕同一种软件能力收敛：接收一个业务目标，理解上下文，调用工具或系统，并返回一个结果——一个工单解决、一份报告写完、一个工作流跑完、一份合同审完，或一个财务任务完成。这比泛协作软件或完整企业应用支出更贴近
              Main Func。品类边界也必须排除实体机器人、模型层基础设施，以及 AI 只是小型嵌入功能的大型企业套件。Main Func 竞争的是 AI 知识自动化与面向工作流的智能体化执行之间的重叠地带，而不是整个职场
              AI 宇宙。
