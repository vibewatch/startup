            body: >-
              最醒目的公开证据，是公司报告收入里程碑的速度。OpenAI 称 Super Agent 上线后仅 45 天就达到 $36 million ARR；LG 和 PR Newswire 称 Genspark
              在五个月内突破 $50 million 年化收入口径；Business Wire 称公司九个月内超过 $100 million ARR；Anthropic 称其转向 Super Agent 后超过 $250
              million ARR；2026 年 7 月发布稿报道又称其服务 7,000 多个商业客户，同时 ARR 仍约为 $250 million。即便考虑公司主导叙事，以及 ARR
              和年化收入口径之间的差异，这一时间序列在方向上是一致的：Main Func
              正在快速变现。收入质量则没那么清楚。业务似乎混合了企业合同和病毒式产品驱动采用，但公开资料没有披露流失、同期群表现、客户集中度，或自助、团队与真正企业收入之间的拆分。对投资人来说，这意味着收入增长故事令人兴奋，但底层耐久性故事仍大多不透明。
