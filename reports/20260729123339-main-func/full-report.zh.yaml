  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: Main Func 的理想转化路径从个人试验走向团队协作，再进入受治理的企业部署，最后扩展到更广的 AI 工作层使用。
    claimRefs:
      - CU001
      - CU003
      - CU007
      - CU008
      - CU023
    data:
      items:
        - label: 发现
          detail: 个人用户通过免费或付费自助入口，尝试研究、幻灯片、文档或通话。
        - label: 证明价值
          detail: 团队负责人看到它在演示文稿制作、分析或会议捕捉等具体任务上更快产出。
        - label: 固化团队使用
          detail: 管理员通过 Team 计划、Hub 或 Teams 集中管理席位、账单和协作。
        - label: 治理企业部署
          detail: 买家加入 SSO、支持、连接器控制、使用日志和定制合同条款。
        - label: 扩展工作层
          detail: 共享记忆、会议捕捉和持久在线的智能体，把使用扩散到更多工作流和用户。
  - id: FU002
    title: 采用 / 部署漏斗
    type: flow
    layout: wide
    summary: 可见产品和定价结构鼓励自下而上的漏斗，但要转化成大型、持久账户，还需要自上而下的控制。
    claimRefs:
      - CU003
      - CU004
      - CU010
      - CU021
      - CU024
    data:
      nodes:
        - id: selfserve
          label: 个人试用 / 付费个人使用
        - id: teamproof
          label: 团队在少数工作流上证明价值
        - id: teamplan
          label: 2-150 席 Team 计划
        - id: enterprise
          label: 151+ 用户企业合同
        - id: expansion
          label: 多界面部署和续约
      edges:
