  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、隐私与法律暴露
        blocks:
          - type: paragraph
            body: >-
              Main Func 所处的品类里，法律预期上升的速度快过公司年龄增长。EU AI Act 的透明度规则将于 2026 年 8 月生效，欧盟委员会概览明确指出，AI
              系统部署方需要知情的人机交互、监督、监控和事件处理；部分高风险系统随后还会面临严格得多的义务。California 隐私法已经赋予用户知情、删除、更正和选择退出数据共享的权利；Genspark
              自己的隐私政策称，当用户在请求中包含个人数据并调用相关能力时，用户提供的提示内容可能被发送给 OpenAI 和 Anthropic。Main Func 的条款还否认对内容准确性、质量和用户依赖负责，并把 IP
              和合规责任分配回用户。这在 AI 里并不罕见，但会制造真实的企业摩擦：产品越多处理会议转录、邮件上下文、CRM 数据和对外动作，法律审查就越会从通用 SaaS 采购转向 AI 治理审查。
