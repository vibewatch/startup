      - 严重性
      - 缓释措施
      - 尽调路径
    rows:
      - - 创始人 / 核心产品负责人
        - 品类战略、推进节奏和产品判断看起来都与创始人高度绑定
        - 中
        - 高
        - 加深梯队储备并建立正式产品治理
        - 审查继任梯队深度、决策权和关键人风险
      - - 工程组织
        - 产品范围很宽，团队相对野心仍小，必须持续顶住
        - 高
        - 高
        - AI 辅助编码杠杆和招聘增长
        - 审查组织架构、事故责任归属和值班容量
      - - 客户成功 / 支持
        - 账户快速增长可能跑在企业导入和支持质量前面
        - 中高
        - 中高
        - 日本支持团队建设和企业 CSM 模型
        - 审查支持人力、积压工单、升级处理和续约阻碍
      - - 安全 / 合规运营
        - 公开控制承诺可能高于当前内部运营成熟度
        - 中
        - 高
        - 认证和管理员工具
        - 审查审计、渗透测试和例外处理流程
    notes: 问题不在团队是否有才华，而在治理是否跟上了产品广度和增长速度。
