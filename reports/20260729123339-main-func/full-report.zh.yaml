      - number: '7.2'
        title: 运营、质量与安全风险
        blocks:
          - type: paragraph
            body: >-
              从运营看，Main Func
              正在把自主性卖进一些小错误也会造成放大后果的工作流。产品可以起草外部沟通、拨打实时电话、总结会议、从邮件和日历历史中拉取信息，并跨许多工具和模型路由工作。风险不只是幻觉，还包括执行失败、上下文过期、连接器损坏、token
              过期、权限静默漂移，以及越界进入用户可能没有充分监督的动作。公开文档显示团队意识到了这些问题。Team 和 Enterprise 计划默认不用于模型训练；管理员不能查看成员项目内容；GenTeam
              将类似创建者权限的外部动作限制在创建者本人，并要求对难以逆转的任务明确批准；企业文档也暴露日志、SSO 和连接器控制。但同一批文档也承认运营失败模式：必需 SSO
              推广配置错误可能把整个组织锁在外面；连接器设置按组织全局生效，而不是按用户生效；Meeting Notes 集成会在 token
              过期时中断。产品看起来有周到的监测和控制设计，但公开证据仍没有展示事件率、误动作率或经客户审计的可靠性。
