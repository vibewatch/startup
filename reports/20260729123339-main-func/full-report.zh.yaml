  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块地图
        blocks:
          - type: paragraph
            body: >-
              Main Func 把 Genspark 定位为面向知识工作者的一体化 AI 工作空间，而不是单点工具。产品面已经从早期搜索和深度研究工作流，快速扩展成一个模块家族，包含 AI Slides、AI Docs、AI
              Sheets、GenMail、Workflows、AgentBase、SecondBrain、Call For Me、Skills，以及作为总入口的 Super Agent
              体验。每个模块都对应真实客户任务：制作演示、起草文档、分析电子表格、分流邮件、构建周期性自动化、生成轻量业务系统，或从连接数据中取回个性化上下文。这种广度是产品策略的核心。Main Func 不是让用户把多个
              SaaS 产品串起来，而是试图成为“一个提示词变成成品工作”的地方。最重要的尽调含义是，公司交付的不是一个功能，而是一个运行层加一套用例界面；做好了会强复利，做不好会在运营上变得很乱。
