  - id: TP002
    title: 功能 / 能力矩阵
    columns:
      - 购买标准
      - Main Func
      - 既有厂商模式
      - 专精厂商模式
      - 影响
    rows:
      - - 跨职能成品输出
        - 一个工作空间里，研究、幻灯片、文档、外联和分析都强
        - 常按应用或工作流领域拆开
        - 通常只在一个工作流里强
        - 买家想用一个界面处理多类知识任务时，Main Func 覆盖最广
      - - 可信权威记录系统上下文
        - 中等；取决于连接器和企业配置
        - 已掌握 CRM、HR、ERP 或 ITSM 数据的厂商更强
        - 随工作流和部署而变
        - 数据引力比 UI 或模型多样性更重要时，既有厂商胜出
      - - 治理与审计控制
        - 企业姿态在加强，有安全认证和零保留主张
        - 平台既有厂商和自动化厂商普遍强且成熟
        - 不一；企业导向专精厂商最强
        - 受监管买家可能仍会默认选择既有厂商
      - - 多智能体编排
        - 围绕多模型和超级智能体执行，有强营销主张
        - UiPath、Automation Anywhere、ServiceNow、SAP 和 Workday 都强
        - 专精厂商在自己的切口里使用编排
        - 这项能力正在变成入场券，而非独特优势
      - - 无代码 / 自然语言配置
        - 面向终端用户提示很强
        - 各大平台都越来越强
        - 常在更窄模板内较强
        - 易用性是必要项，但不耐久
      - - 垂直或职能深度
        - 横向覆盖中等偏广，但领域深度较轻
        - 既有厂商深度掌握某个职能时更强
        - 在窄岗位里很强
        - Main Func 必须避免在高风险工作流里输给同类最佳
      - - 定价透明度
        - 公开 Team Plan 带来中等透明度，企业交易透明度低
