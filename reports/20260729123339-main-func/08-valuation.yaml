- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Durable ARR / client claims fail diligence
    - Cohorts, usage, or revenue recognition do not support headline growth claims
    - Breaks the core premium-growth narrative
    - Re-cut valuation toward bear case or pass
  - - Gross margin is materially below expectation
    - Model, media, or support costs imply structurally weak economics
    - Limits software-like scalability and compresses deserved multiple
    - Demand lower price or walk away
  - - Customer quality is concentrated or weakly renewing
    - NRR / GRR or top-customer concentration fall below premium-software expectations
    - Turns broad adoption story into fragile revenue story
    - Move to bear case immediately
  - - Major trust / governance incident
    - Security, privacy, or false-action event hits enterprise trust
    - Raises discount rate and slows enterprise rollout
    - Delay or decline investment
  - - Next round price exceeds public logic without stronger proof
    - Terms imply paying materially above latest mark without new diligence support
    - Eliminates margin of safety
    - Pass unless private data is decisively stronger than public evidence
  notes: Kill triggers are designed to be verifiable in diligence rather than dependent on narrative interpretation alone.
  claimRefs:
  - CV024
  - CV026
  - CV027
  - CV029
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Cap table and preferences
    - Fully diluted ownership, seniority stack, liquidation preferences, and anti-dilution terms
    - Determines whether headline upside is actually investable
    - Request cap table, term sheet history, and waterfall model
  - - Revenue quality
    - ARR definition, cohort retention, churn, expansion, and self-serve vs enterprise mix
    - Separates durable software value from short-lived usage spikes
    - Request cohort tables and finance package
  - - Margin bridge
    - Gross margin by modality, model-vendor spend, support burden, and unit economics
    - Determines whether scale translates into software-like profitability
    - Request cost-of-delivery and supplier-spend analysis
  - - Customer concentration
    - Top-20 account exposure, ACV distribution, contract length, and renewal status
    - Measures fragility behind rapid client growth claims
    - Request sales-ops and finance extracts
  - - Reliability / trust metrics
    - Incident history, false-action rates, workflow completion, enterprise security review outcomes
    - A broad autonomous-work platform lives or dies on trust
    - Request incident logs, benchmark results, and audit summaries
  - - Round price versus proof
    - Any private marks, secondary signals, 409A, or term evolution after June 2026
    - Anchors whether current entry still offers target returns
    - Request financing timeline and any recent transaction materials
  notes: These asks are intentionally leverage-heavy; each one can move price or recommendation materially.
