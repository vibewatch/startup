company:
  name: Main Func
chapter:
  number: 8
  title: Valuation
  summary: >-
    Main Func has enough real traction to merit serious diligence, but not
    enough public transparency to justify paying any price. The bullish case is
    obvious: hypergrowth from roughly $100M ARR in January 2026 to roughly
    $250M run-rate by July 2026, broad product ambition, and a category that
    public markets still reward when AI drives genuine enterprise demand. The
    anti-thesis is equally real: limited proof of retention and margins,
    supplier dependence, rising trust and compliance burdens, and an already
    aggressive public valuation step-up to roughly $2.6B. The result is a
    price-sensitive research-more recommendation rather than a clean invest or
    pass.
sections:
- id: thesis
  title: Investment thesis and anti-thesis
  body: >-
    The core investment thesis is that Main Func may be building one of the
    earliest broad AI work layers that actually monetizes at enterprise speed.
    By public accounts, the company went from a search-era product in 2024 to
    Super Agent in 2025 to AI Workspace 6.0 in 2026, while claiming rapid ARR,
    customer, and product-surface expansion. If even a meaningful portion of
    that growth is durable, the company deserves to be compared not to generic
    SaaS averages but to premium AI-native software narratives. The anti-thesis
    is that the public record still looks more like momentum proof than quality
    proof. There is no disclosed churn, NRR, gross margin, cash balance,
    preference stack, or customer concentration. Product breadth is impressive,
    but also raises reliability, supplier, and governance risks. The right IC
    framing is therefore conditional optimism: the company is too strong to
    dismiss, too opaque to underwrite casually, and too fast-moving to evaluate
    with stale 2025 valuation anchors alone. That nuance matters because the
    right investor behavior is not binary conviction. It is staged conviction:
    enough interest to continue, enough skepticism to refuse narrative-only
    pricing, and enough humility to recognize that hidden cohort or term data
    could still move value sharply in either direction.
    That asymmetry is exactly why patience can create more value than speed for a disciplined long-term investor.
