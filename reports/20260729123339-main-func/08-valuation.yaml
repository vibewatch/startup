  title: Thesis / anti-thesis table
  columns:
  - Argument
  - What would change the view
  rows:
  - - Hypergrowth AI workspace with real customer adoption can justify premium software pricing
    - Proof that $250M-scale run-rate is durable, diversified, and renews well
  - - Product breadth and finished-work orientation create a credible platform narrative
    - Evidence that reliability and governance hold up in enterprise production
  - - Multi-model orchestration and context layers can support differentiated workflows
    - Evidence that suppliers or incumbents can replicate the value with lower friction
  - - Public evidence still lacks retention, margin, and cap-table transparency
    - Clean cohort data, margin bridges, and preference disclosure would materially improve underwriteability
  - - Latest valuation may already discount a large share of near-term success
    - A lower entry price or unusually investor-friendly terms would improve return math quickly
  notes: This is a live thesis table, not a static verdict; each row names the evidence that would move price discipline.
