- id: TV004
  title: Comparable valuation table
  enumerationScope:
    coverage: partial
    basis: Reference set of public software and automation comparables plus market-data anchors most relevant to Main Func’s horizontal AI-workflow and enterprise-automation valuation logic as of 2026-07-29.
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - Main Func public mark
    - ~$250M ARR or annualized run rate by July 2026
    - ~$2.6B implied valuation; roughly ~10x on $250M or ~26x on $100M ARR
    - Direct current pricing anchor
    - Revenue quality and exact terms remain private
  - - UiPath
    - FY2026 ARR $1.853B; GAAP gross margin 85%
    - Mature public automation platform with slower growth and far better disclosure
    - Best public automation comp for governance and enterprise execution expectations
    - Not AI-native in the same way and has public-market maturity discounts
  - - Workday
    - FY2026 revenue $9.552B; non-GAAP operating margin 29.6%; 11,500+ customers
    - Trusted enterprise platform and system-of-record comp
    - Useful ceiling for trust, disclosure, and enterprise durability expectations
    - Much larger and more embedded than Main Func
  - - Salesforce
    - FY2026 subscription & support revenue $10.7B in Q4; $35.1B current RPO; $14.4B FY26 FCF
    - Shows how public markets reward durable enterprise software with cash flow and backlog visibility
    - Good trust-and-distribution comparator
    - Too mature and diversified to be a direct multiple comp
  - - Public horizontal SaaS market data
    - Multiples.vc July 2026 horizontal SaaS average / reference point
    - Around 6.1x EV / NTM revenue, with dispersion driven by growth and AI positioning
    - Useful guardrail against overpaying for generic software growth
    - Market-data basket, not a company-specific comp
  - - BVP Nasdaq Emerging Cloud Index
    - Emerging public cloud software index
    - Tracks public cloud-software cohort; useful sentiment and relative-multiple backdrop
    - Helpful public-market mood indicator for growth software
    - Index-level data, not tailored to Main Func’s exact business model
  notes: This table is a valuation framework, not a claim that any one comparable fully matches Main Func.
