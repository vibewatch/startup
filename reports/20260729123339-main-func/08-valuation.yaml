- id: pricing-context
  title: Financing context, public comp guardrails, and entry discipline
  body: >-
    Public pricing context has moved sharply upward in a short time. The
    November 2025 Series B anchor was $275M at a $1.25B valuation. January 2026
    public materials paired $100M ARR with a topped-off $300M Series B. By
    mid-2026, public reporting pointed to more than $645M in total funding, a
    $2.6B valuation, and roughly $250M ARR or annualized run rate. If those
    revenue claims are solid, the latest valuation implies a low-double-digit
    revenue multiple — rich versus broad horizontal SaaS averages, but not
    absurd for a hypergrowth AI-native platform. If those claims are less
    durable, the price quickly becomes hard to defend. That is where public
    comp guardrails matter. Mature public platforms such as Salesforce, Workday,
    and UiPath disclose revenue quality, cash flow, and operating leverage in a
    way Main Func does not, while analyst market-data sources show the 2026
    software market rewarding only select winners with premium multiples. The
    practical conclusion is that entry discipline matters more than narrative
    excitement. This is especially true because the company’s own latest public
    valuation step-up occurred before the market had any public view into
    renewal quality, contribution margins, or the exact economic mix between
    self-serve usage and governed enterprise contracts.
  claimRefs:
