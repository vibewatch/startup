- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Case
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - $300M+ durable ARR / run-rate, strong enterprise retention, high gross margin despite model costs, limited preference overhang, category leadership maintained
    - Supports $3.5B-$5.0B equity value and attractive upside if entry is near or below the latest public mark
    - Competitive bundling, margin leakage, or governance incidents cap upside
    - Requires private metrics to be clearly better than the public evidence gap suggests
  - - Base
    - ~$250M durable ARR / run-rate, decent but not elite retention, gross margin still below mature SaaS, growth remains strong but moderates, terms are standard
    - Supports roughly $2.2B-$3.0B equity value; upside exists but is more multiple-sensitive
    - Customer-quality opacity and vendor dependence keep the discount rate elevated
    - Most consistent with current public evidence
  - - Bear
    - Revenue quality weaker than claimed, margin burden proves heavy, enterprise durability is unproven, or next round prices in too much perfection
    - Compresses toward roughly $1.4B-$2.0B, with limited upside from a $2.6B+ entry
    - Retention, competition, or execution disappointments trigger multiple reset
    - Still plausible given missing private data
  notes: Ranges are author scenarios anchored to public financing context, software-comp guardrails, and the company’s disclosed growth claims.
