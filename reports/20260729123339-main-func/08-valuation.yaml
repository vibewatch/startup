- id: recommendation
  title: Recommendation, ranges, and diligence gates
  body: >-
    The public evidence supports a recommendation of research-more / pursue only
    with disciplined price and terms. At a valuation around the latest public
    $2.6B mark, the company may still be investable if private diligence proves
    strong enterprise retention, manageable gross margins, and limited
    preference overhang. At materially higher pricing without that proof, the
    risk-adjusted return logic degrades quickly. The base case is therefore not
    “buy the story” but “buy only if the hidden metrics deserve the story.” The
    bull case requires real enterprise durability and continued AI-category
    leadership. The bear case is not bankruptcy; it is multiple compression
    toward broader software comps once growth quality, margin reality, or
    competitive pressure becomes clearer. For an investor, the most important
    question is not whether Main Func is impressive. It is whether the next
    round offers enough margin of safety relative to what is still unknown.
    Said differently, this chapter does not conclude that the company is
    overvalued in absolute terms; it concludes that valuation precision is far
    weaker than company excitement, so discipline on price, preferences, and
    downside protection is part of the investment thesis itself.
