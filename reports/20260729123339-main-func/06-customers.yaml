- id: TU006
  title: Collaboration / deployment surface table
  columns:
  - Surface
  - What customers can do
  - Buyer relevance
  - Expansion implication
  rows:
  - - Hub
    - Share files, conversation history, instructions, and projects inside a persistent workspace
    - Supports team knowledge reuse and governed context sharing
    - Increases switching costs once ongoing projects accumulate
  - - Teams
    - Direct messages, group chats, project sharing, and cross-organization contact requests
    - Makes collaboration native inside product rather than external
    - Helps convert individual usage into organization usage
  - - GenTeam
    - Place humans and AI agents in channels, threads, tasks, and DMs with persistent memory
    - Targets deeper workflow embedding for coordinated teams
    - Creates larger seat and workload opportunity per account
  - - AI Meeting Notes
    - Capture meetings, auto-join online meetings, and share notes with participants
    - Pushes product into recurring operational moments
    - Can create repeat usage and wider stakeholder exposure
  - - Custom Agent / Design / AgentBase ecosystem
    - Build reusable agents and outputs that can be invoked or shared across work
    - Encourages departmental specialization and internal reuse
    - Raises likelihood of horizontal expansion after initial landing
  notes: These surfaces are not direct proof of retention, but they show how Main Func is designing for repeat, multi-user deployment rather than one-off prompt usage.
