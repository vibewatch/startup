runDate: '2026-07-29'
company:
  name: Main Func
chapter:
  number: 6
  title: Customers
  summary: >-
    Main Func’s customer story is strongest where product packaging, documented
    collaboration surfaces, and a handful of public proof points intersect. The
    company clearly serves both self-serve individuals and organized business
    buyers, and by early-to-mid 2026 it publicly claimed rapid expansion from
    1,000-plus organizations to more than 7,000 business clients. What remains
    under-disclosed is quality: public evidence is thin on named enterprise
    logos, production depth, retention, and concentration. The customer base
    therefore looks broadening and globally distributed, but not yet
    transparently underwritten.
sections:
- id: segmentation
  title: Customer segments and buyer structure
  body: Main Func is not selling into one neat enterprise segment. Public materials show a layered customer base spanning individual knowledge workers, small teams buying self-serve seats, and larger organizations moving onto governed enterprise contracts. The buyer-user-payer split changes across those layers. Individual users can start alone on free or paid plans, team admins then centralize billing and seats for groups of 2 to 150, and enterprise buyers engage on negotiated terms once the organization exceeds roughly 151 users or needs custom governance, residency, DPA, or support. That packaging matters because it implies Main Func can enter through bottom-up experimentation but still expose the purchasing controls needed for formal rollout. Collaboration modules released in 2026 — Hub, Teams, GenTeam, Meeting Notes, and shared projects — further suggest the company is trying to convert single-user novelty into multi-user system adoption across repeated daily work organization-wide globally.
