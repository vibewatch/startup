- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Seat growth from self-serve team plan into wider rollout
    - A few large accounts could dominate ARR if enterprise expansion drives most revenue
    - Medium-high
    - Request top-20 customer concentration and seat-growth waterfall
  - - Credit-pack and workload growth within heavy-usage teams
    - Revenue could depend on a small set of power users or compute-heavy accounts
    - Medium
    - Review usage concentration by customer, user, and modality
  - - Collaboration surfaces such as Hub, Teams, and GenTeam
    - Shared-context adoption may create lock-in, but could also remain shallow or experimental
    - Medium
    - Ask for weekly active teams, shared-project counts, and multi-user retention
  - - Enterprise governance features such as SSO, connectors, logs, and support
    - Long enterprise cycles may slow conversion and favor incumbent suite vendors
    - High
    - Review pipeline conversion and security-review close rates
  - - Geographic expansion into Japan, Europe, and Asia
    - Local support investments may not translate into durable local revenue density
    - Medium
    - Request ARR and churn by geography plus local-support utilization
  notes: The visible expansion loops are plausible, but concentration and renewal risks remain largely unquantified publicly.
