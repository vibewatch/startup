- id: TU003
  title: Named customer proof table
  enumerationScope:
    coverage: partial
    basis: Publicly cited customer references visible in official or partner materials as of 2026-07-29; not intended as an exhaustive customer list.
  columns:
  - Customer
  - Segment
  - Deployment / use case
  - Production vs pilot
  - Outcome
  - Limitation
  rows:
  - - Spyglaz AI
    - Small business / startup
    - Used Genspark to create a 50-page slide deck in 25 minutes; founder describes time-to-market and project-delivery acceleration
    - Appears to be real use, but reference is testimonial-style rather than independently verified production proof
    - Positive founder quote on output quality and speed
    - Single official testimonial; no contract size or sustained usage data
  - - GEOPARK
    - Enterprise / large organization
    - CIO says users first sought better presentations, then requested enterprise access after broader multi-agent testing
    - Indicates movement beyond trial into enterprise agreement
    - Suggests internal user pull and upgrade from tool test to enterprise purchase
    - No deployment scale, renewal, or ROI detail
  - - ADK Marketing Solutions
    - Large agency / Japan expansion account
    - Data analysis and document-creation workflows
    - Described as active use over the prior few months
    - Approximately 80% reduction in those workloads, per company announcement
    - Proof comes from launch announcement, not an independent case study
  - - Anonymous real estate analyst / Japanese seafood CEOs
    - Professional-services and executive users
    - Pitch-deck creation and demand / lead analysis
    - Real user anecdotes in partner case studies, but named logos withheld
    - Illustrates cross-industry applicability and speed gains
    - Anecdotal and anonymized, so reference quality is lower
  notes: This is a partial public sample, not a representative customer list. Public proof is materially thinner than the headline client-count claims.
