- id: durability
  title: Retention, expansion, and concentration visibility
  body: >-
    The public record says much more about acquisition and collaboration than
    about durability. There is no disclosed NRR, GRR, churn, cohort retention,
    renewal rate, logo retention, average contract term, or top-customer
    concentration. Still, the product surface hints at how expansion could
    happen if the platform lands successfully. Shared Hubs preserve context
    across projects; Teams supports organization-level messaging and project
    sharing; GenTeam introduces persistent human-plus-agent channels; Meeting
    Notes auto-joins and shares outputs across meeting platforms; and admin
    tooling exposes seat management, usage analytics, connector controls, and
    upsell levers such as added seats or extra credit packs. Those features
    create a plausible land-and-expand motion, but they do not prove durable
    economics. The diligence view is therefore mixed: expansion mechanics are
    visible, while retention quality and concentration risk remain largely
    opaque. In practical terms, buyers can clearly see how the product could
    spread once one team adopts it, but outside investors still cannot tell
    whether that spread is happening through healthy renewals, broad seat
    growth, or just bursty experimentation tied to new AI features. That
    missing durability layer is the central customer risk in the public record.
  claimRefs:
  - CU021
  - CU022
  - CU023
  - CU024
  - CU025
  - CU026
  - CU027
  - CU028
  - CU029
  tableRefs:
  - TU005
  figureRefs: []
- id: verdict
  title: Customer quality verdict
  body: >-
    Main Func appears to have crossed from consumer-style AI curiosity into
    genuine business usage faster than most peers, and the product increasingly
    reflects what organized customers need: centralized billing,
    collaboration, shared memory, task management, and cross-channel agent
    deployment. That is the positive case. The negative case is that public
    evidence still does not show whether these customers are deeply deployed,
    renewing at strong rates, expanding profitably, or concentrated in a few
    large accounts. As of 2026-07-29, the customer chapter supports a
    conclusion of real breadth with incomplete depth verification. Customer
    momentum looks credible; customer quality still requires direct diligence
    materials. The best interpretation is that Main Func has earned the right
    to be taken seriously as an enterprise-oriented platform, but it has not
    yet provided enough public evidence to let an outside reader separate
    durable enterprise adoption from fast-moving AI enthusiasm or from
    temporary, launch-driven curiosity.
