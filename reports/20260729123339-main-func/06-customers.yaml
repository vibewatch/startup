- id: proof-and-usage
  title: Adoption trajectory and named customer proof
  body: >-
    The most visible adoption metrics are marketing-oriented, but they are
    still directionally meaningful. Business Wire said in January 2026 that
    more than 1,000 organizations across consulting, advertising, and other
    industries had started using the Team and Enterprise plans. By July 2026,
    TMCnet and a mirrored FinancialContent article said Genspark served more
    than 7,000 business clients. The supporting named customer proof is much
    narrower than those top-line figures: public references point to Spyglaz
    AI, GEOPARK, and ADK Marketing Solutions, while partner case studies add
    only anonymized examples such as a New York real estate analyst or Japanese
    seafood CEOs. That imbalance means Main Func has a real adoption story, but
    public proof still skews toward company-selected anecdotes rather than a
    deep roster of independently verified reference accounts.
  claimRefs:
  - CU010
  - CU011
  - CU012
  - CU013
  - CU014
