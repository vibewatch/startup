- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Primary use case
  - Scale signal
  - Revenue / strategic value
  - Gap
  rows:
  - - Individual self-serve users
    - Buyer and user are usually the same person; payer is individual cardholder or free user
    - Research, slides, docs, calls, lightweight automation
    - Free / Plus / Pro packaging and self-serve product entry
    - Feeds viral discovery and seed adoption
    - No public conversion, retention, or ARPU disclosure
  - - Small organized teams
    - Manager or admin buys; knowledge workers use; company pays
    - Shared productivity, project collaboration, team AI usage
    - Team plan for 2-150 seats at self-serve pricing
    - First structured monetization layer for business usage
    - No public data on average team size or expansion rate
  - - Large enterprise accounts
    - IT, ops, or business sponsor buys; many employees use; company pays on contract
    - Governed deployment, SSO, residency, connectors, support
    - Enterprise plan for 151+ users and custom terms
    - Higher ACV and deeper expansion potential
    - No named large-enterprise book or contract-size disclosure
  - - Function-specific professional users
    - Department leaders sponsor; analysts, marketers, operators, executives use
    - Deck building, data analysis, meeting capture, workflow automation
    - Public examples span consulting, advertising, real estate, and executive use cases
    - Expands TAM across many white-collar functions
    - Vertical mix remains vague beyond anecdotes
  notes: The segmentation is visible through packaging and product surfaces, but revenue mix by segment is undisclosed.
