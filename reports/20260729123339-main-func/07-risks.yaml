company:
  name: Main Func
chapter:
  number: 7
  title: Risks
  summary: >-
    Main Func’s risk profile is dominated by five intertwined exposures: trust
    and regulatory compliance for autonomous AI work, dependency on frontier
    model and platform suppliers, uncertain margin durability under compute- and
    media-heavy workloads, distribution pressure from incumbents that already
    own enterprise context, and execution strain from scaling an unusually broad
    product surface at startup speed. The company has visible mitigations, but
    public evidence still leaves several material thesis-break risks unresolved.
sections:
- id: legal-regulatory
  title: Regulatory, privacy, and legal exposure
  body: >-
    Main Func operates in a category where legal expectations are rising faster
    than the company itself is aging. The EU AI Act’s transparency rules come
    into force in August 2026, and the Commission’s overview makes clear that
    deployers of AI systems need informed human interaction, oversight,
    monitoring, and incident handling, while some high-risk systems face far
    stricter obligations later. California privacy law already grants rights to
    know, delete, correct, and opt out of data sharing, and Genspark’s own
    privacy policy says user-provided prompt content may be sent to OpenAI and
    Anthropic when the user includes personal data in a request. Main Func’s
    terms also disclaim accuracy, quality, and user reliance on content, while
    assigning IP and compliance responsibility back to users. None of that is
    unusual in AI, but it creates real enterprise friction: the more the
    product handles meeting transcripts, email context, CRM data, and outbound
    actions, the more legal review shifts from generic SaaS procurement toward
    AI-governance review.
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
  - CR006
  - CR007
  - CR008
  - CR009
  - CR010
  tableRefs:
  - TR001
  figureRefs:
  - FR001
- id: operational
  title: Operational, quality, and security risk
  body: >-
    Operationally, Main Func is selling autonomy into workflows where small
    mistakes can have outsized consequences. The product can draft external
    communications, make live phone calls, summarize meetings, pull from email
    and calendar history, and route work across many tools and models. The risk
    is not only hallucination. It is also failed execution, stale context,
    broken connectors, token expiration, silent permission drift, and overreach
    into actions that users may not fully supervise. Public docs show the team
    is aware of these issues. Team and Enterprise plans are opted out of model
    training by default, admins cannot view member project content, GenTeam
    restricts creator-like external actions to the creator and asks for explicit
    approval on hard-to-reverse tasks, and enterprise docs expose logs, SSO,
    and connector controls. But the same docs also admit operational failure
    modes: a misconfigured required-SSO rollout can lock out an entire
    organization, connector settings apply org-wide rather than per user, and
    Meeting Notes integrations can break when tokens expire. The product looks
    thoughtfully instrumented, yet public evidence still does not show incident
    rates, false-action rates, or customer-audited reliability.
  claimRefs:
  - CR011
  - CR012
  - CR013
  - CR014
  - CR015
  - CR016
  - CR017
  - CR018
  - CR019
  - CR020
  - CR021
  tableRefs:
  - TR002
  figureRefs:
  - FR002
- id: dependency-financial
  title: Supplier, distribution, and financial-model risk
  body: >-
    The company’s commercial upside is inseparable from dependency risk. Public
    materials describe Genspark as orchestrating 30-plus to 70-plus models,
    relying on OpenAI and Anthropic for core reasoning and voice capabilities,
    and connecting into enterprise systems such as Slack, Notion, Salesforce,
    HubSpot, Google Workspace, and Microsoft 365. Anthropic’s commercial terms
    explicitly allow service suspension if law, attack, cost, or upstream vendor
    issues interfere, and OpenAI’s service terms carve out beta features and
    narrow parts of output indemnity. Main Func is therefore exposed not only to
    vendor pricing but also to policy shifts, outages, model-quality regressions,
    and changing contractual limits. Financially, the credits system and broad
    multimodal product set imply that usage growth can drive both revenue and
    delivery cost upward at the same time. That would be manageable in a mature
    SaaS platform with transparent gross margins; here it remains a real risk
    because public reporting still lacks customer concentration, churn, and
    margin detail. Meanwhile, Salesforce, Microsoft, Workday, ServiceNow, and
    UiPath all push agentic automation from inside existing enterprise systems,
    which means Main Func must outrun supplier dependence while also outrunning
    distribution incumbents.
  claimRefs:
  - CR022
  - CR023
  - CR024
  - CR025
  - CR026
  - CR027
  - CR028
  - CR029
  - CR030
  - CR031
  - CR032
  tableRefs:
  - TR003
  figureRefs:
  - FR003
- id: execution-monitoring
  title: People, execution, and thesis-break triggers
  body: >-
    The remaining risk is execution quality at extreme speed. OpenAI described a
    20-person team producing early super-agent growth, while Anthropic later
    described roughly 50 engineers and an internal belief that “nobody really
    has a moat anymore” beyond execution speed. That speed can be a strength,
    but it can also hide underbuilt support, weak controls, or key-person
    concentration around founders and a small core engineering group. Customer
    claims have also scaled faster than customer transparency: 1,000-plus
    organizations by January 2026 and 7,000-plus business clients by July 2026,
    yet no public NRR, GRR, incident history, concentration table, or renewal
    metrics. The investment implication is straightforward. If Main Func can
    prove reliable enterprise deployment, controllable gross margins, and broad
    customer diversification, the risk profile compresses quickly. If not,
    growth could prove shallower than the headline momentum suggests. The right
    diligence posture is therefore not to reject the company for having startup
    risk, but to set explicit kill criteria around reliability, customer quality,
    and supplier dependence before underwriting aggressive valuation multiples.
  claimRefs:
  - CR033
  - CR034
  - CR035
  - CR036
  - CR037
  - CR038
  - CR039
  - CR040
