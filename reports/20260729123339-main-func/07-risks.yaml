- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Reliability risk
    - Material workflow failure rate in enterprise accounts
    - Repeated critical incidents or false actions without defensible controls
    - Pause valuation underwriting until audit data and remediation prove improvement
  - - Customer-quality risk
    - Weak retention or concentrated ARR
    - NRR below strong enterprise-software norms or top-customer concentration too high
    - Reframe growth as low-quality and reduce multiple assumptions
  - - Supplier dependence risk
    - Model-vendor cost or policy shock
    - Margin compression or product degradation from vendor changes
    - Stress test downside cash burn and moat durability
  - - Regulatory / privacy risk
    - Enforcement inquiry, high-severity privacy incident, or noncompliant AI disclosure flow
    - Formal investigation or recurring enterprise security-review failures
    - Delay investment or require remediation conditions precedent
  - - Distribution risk
    - Enterprise wins shift decisively toward incumbent suites
    - Competitive losses tied to system-of-record bundling rather than feature gaps
    - Narrow target market or revise terminal-share assumptions
  - - Execution risk
    - Support, onboarding, or security operations degrade during growth
    - Escalating backlog, outages, or rising implementation friction
    - Treat hypergrowth as unsustainably operationally expensive
  notes: The kill criteria focus on evidence that would break the “fast growth becomes durable enterprise software” thesis.
