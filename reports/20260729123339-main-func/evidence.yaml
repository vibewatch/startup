evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: board-governance
    missingEvidence: A current board roster, committee structure, and investor control terms for MainFunc Inc.
    whyItMatters: >-
      Later-stage private software valuations can hide governance concentration or investor protections that materially
      affect downside protection and decision rights.
    diligencePath: Request the current board deck, charter summary, investor rights agreement, and capitalization table extract.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: A precise current full-time employee count split by engineering, GTM, and geography.
    whyItMatters: >-
      Headcount determines burn, execution leverage, and whether the claimed ARR efficiency is credible versus
      underbuilt support or sales capacity.
    diligencePath: Request an HRIS export or org chart dated within 30 days of diligence.
    relatedQuestionRefs:
      - QO017
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: customer-quality
    missingEvidence: >-
      Customer retention, enterprise ACV, self-serve versus business mix, and cohort quality behind the 7,000+
      business-client claim.
    whyItMatters: Logo count and user claims do not reveal how durable or high-quality revenue really is.
    diligencePath: Request cohort tables, NRR / GRR, top-20 customer concentration, and enterprise pipeline conversion metrics.
    relatedQuestionRefs:
      - QO016
      - QO025
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: minor
    topic: series-a-precision
    missingEvidence: Primary source documentation for the exact Series A announcement date, syndicate, and valuation terms.
    whyItMatters: The overall funding chronology is clear, but a precise Series A anchor improves dilution and pace analysis.
    diligencePath: Request the Series A press release or board-approved financing summary.
    relatedQuestionRefs:
      - QO010
  - type: missing-source
    severity: material
    topic: main-func-bottom-up-market-share
    missingEvidence: A direct, bottom-up company view of how much current ARR or pipeline comes from each workflow category and region.
    whyItMatters: >-
      Without that split, SOM assumptions rely on generic market categories rather than the company’s actual commercial
      wedge.
    diligencePath: Request pipeline and ARR mix by workflow, region, customer size, and vertical from management.
    relatedQuestionRefs:
      - QM024
  - type: conflicting-data
    severity: material
    topic: market-scope-conflict
    missingEvidence: >-
      A single authoritative market study that isolates agentic knowledge-work automation without bundling hardware,
      services, or adjacent enterprise suites.
    whyItMatters: Published TAM estimates vary by more than an order of magnitude because they measure different layers of spend.
    diligencePath: >-
      Commission a custom market cut or build an internal bottoms-up model from buyer functions and seat/workflow
      counts.
    relatedQuestionRefs:
      - QM009
      - QM022
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-budget-proof
    missingEvidence: Evidence on which department actually signs and expands Main Func contracts in practice.
    whyItMatters: >-
      The market is increasingly controlled by incumbent systems of record, so budget ownership determines distribution
      risk and competitive position.
    diligencePath: Review the top-25 deals with buyer title, budget owner, incumbent stack, and deployment path.
    relatedQuestionRefs:
      - QM010
      - QM023
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: minor
    topic: independent-success-rates
    missingEvidence: Independent production-grade success metrics for enterprise agents across multi-step workflow categories.
    whyItMatters: >-
      Most public evidence still comes from vendors, platform partners, or analyst summaries rather than audited
      benchmarks.
    diligencePath: Seek third-party benchmarks, customer reference calls, and post-deployment ROI reports by workflow type.
    relatedQuestionRefs:
      - QM016
      - QM024
    relatedTableRefs:
      - TM004
  - type: private-evidence-only
    severity: material
    topic: real-competitive-win-rates
    missingEvidence: >-
      No public source discloses Main Func’s actual head-to-head win rates versus Salesforce, Microsoft, UiPath,
