            body: >-
              Main Func is still too private for direct gross-margin underwriting, so the best public method is to
              combine product architecture clues with scaled comparables. The architecture likely carries meaningful
              inference and serving costs because Genspark routes work across many frontier models, voice, image, and
              video outputs, and increasingly runs scheduled or long-horizon automations. Enterprise security promises
              such as zero retention, SSO, connectors, and compliance also create platform and support overhead. Those
              costs imply Main Func’s near-term gross margin is almost certainly lower than mature workflow-software
              peers. But public comps show the end-state can still be attractive: UiPath reported 83% GAAP gross margin
              in FY2026, while Workday and Salesforce showed strong subscription revenue scale, operating margins, and
              cash generation. The financial interpretation is that Main Func’s margin path could eventually resemble
              high-quality software if the company improves routing efficiency, procurement economics with model
