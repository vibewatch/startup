      - number: '7.4'
        title: People, execution, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The remaining risk is execution quality at extreme speed. OpenAI described a 20-person team producing
              early super-agent growth, while Anthropic later described roughly 50 engineers and an internal belief that
              “nobody really has a moat anymore” beyond execution speed. That speed can be a strength, but it can also
              hide underbuilt support, weak controls, or key-person concentration around founders and a small core
              engineering group. Customer claims have also scaled faster than customer transparency: 1,000-plus
              organizations by January 2026 and 7,000-plus business clients by July 2026, yet no public NRR, GRR,
              incident history, concentration table, or renewal metrics. The investment implication is straightforward.
              If Main Func can prove reliable enterprise deployment, controllable gross margins, and broad customer
              diversification, the risk profile compresses quickly. If not, growth could prove shallower than the
              headline momentum suggests. The right diligence posture is therefore not to reject the company for having
              startup risk, but to set explicit kill criteria around reliability, customer quality, and supplier
              dependence before underwriting aggressive valuation multiples.
