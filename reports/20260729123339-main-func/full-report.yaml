        title: Capital adequacy, financing dependence, and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              On capital adequacy, the company looks strong in the near term and opaque in the medium term. By public
              reporting, Main Func closed a $275 million Series B at a $1.25 billion post-money valuation in November
              2025, extended that round to $385 million at about $1.6 billion by April 2026, and then raised another
              $100 million in June 2026, bringing total funding above $645 million and valuation to $2.6 billion. That
              amount of equity capital is substantial for a software company founded in 2023 and should provide room to
              invest in infrastructure, model procurement, international go-to-market, and enterprise support. The
              unresolved problem is burn. No public source provides cash on hand, monthly burn, runway, sales
              efficiency, or when the company expects to become free-cash-flow positive. In addition, the 2026 funding
              narrative contains inconsistencies: one release says the round topped off at $300 million; another says
              $385 million; later coverage says total funding exceeded $645 million. Those are not fatal contradictions,
              but they do reinforce the need for a clean financing ledger before underwriting the next round or a path
              to profitability.
