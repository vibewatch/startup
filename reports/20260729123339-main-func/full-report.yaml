  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The core investment thesis is that Main Func may be building one of the earliest broad AI work layers that
              actually monetizes at enterprise speed. By public accounts, the company went from a search-era product in
              2024 to Super Agent in 2025 to AI Workspace 6.0 in 2026, while claiming rapid ARR, customer, and
              product-surface expansion. If even a meaningful portion of that growth is durable, the company deserves to
              be compared not to generic SaaS averages but to premium AI-native software narratives. The anti-thesis is
              that the public record still looks more like momentum proof than quality proof. There is no disclosed
              churn, NRR, gross margin, cash balance, preference stack, or customer concentration. Product breadth is
              impressive, but also raises reliability, supplier, and governance risks. The right IC framing is therefore
              conditional optimism: the company is too strong to dismiss, too opaque to underwrite casually, and too
              fast-moving to evaluate with stale 2025 valuation anchors alone. That nuance matters because the right
              investor behavior is not binary conviction. It is staged conviction: enough interest to continue, enough
              skepticism to refuse narrative-only pricing, and enough humility to recognize that hidden cohort or term
              data could still move value sharply in either direction. That asymmetry is exactly why patience can create
              more value than speed for a disciplined long-term investor.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
