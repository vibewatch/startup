              designing for organized business deployment — with team seats, enterprise contracting, shared context,
              agents, analytics, and seat management all visible by mid-2026.
            calloutType: insight
            claimRefs:
              - CU003
              - CU004
              - CU007
              - CU023
          - type: callout
            title: Customer quantity is clearer than customer quality
            body: >-
              The headline claims of 1,000-plus organizations and 7,000-plus business clients suggest breadth, but there
              is still no public cohort, renewal, or concentration data to show whether those customers are sticky,
              expanding, or economically diversified.
            calloutType: risk
