chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and product positioning
        blocks:
          - type: paragraph
            body: >-
              Main Func is the corporate parent behind Genspark, and the public record now describes the business less
              as a search experiment and more as an agentic workspace vendor for knowledge workers. The corporate
              homepage says the company is based in Palo Alto, founded by alumni of Microsoft, Google, Meta, and
              Pinterest, and operates offices in Singapore and Tokyo. Its legal pages anchor the operating structure
              more precisely: MainFunc Inc. provides the services, while Genspark Inc. is a wholly owned subsidiary and
              genspark.ai is the main product surface. The product story has evolved quickly. TechCrunch covered
              Genspark in June 2024 as an AI-powered search engine built around Sparkpages, but OpenAI, Anthropic, and
              later company releases describe a 2025 pivot toward autonomous task completion, where one prompt can yield
              slides, documents, spreadsheets, web apps, or AI phone calls. That repositioning matters because later
              diligence should assess Main Func as a workflow-automation and productivity platform, not only as a
              consumer AI search property.
            claimRefs:
