      - number: '2.3'
        title: Buyers, users, payers, and the adoption path
        blocks:
          - type: paragraph
            body: >-
              Buyer structure explains why this market grows quickly yet fragments across procurement motions. Vendor
              evidence shows that AI agents are now sold by the owners of systems of record and systems of workflow:
              Workday ties agents to HR and finance data, ServiceNow ties them to IT, HR, CRM, and risk workflows,
              Salesforce packages them into service and sales motions, Microsoft offers general agent building inside
              Microsoft 365, SAP grounds them in ERP workflows, and RPA leaders push orchestration across agents, bots,
              and humans. That means the buyer is usually a functional budget owner first and a central AI team second.
              HR leaders care about self-service and recruiting, finance leaders about close processes and audit
              evidence, customer-service leaders about ticket resolution, IT leaders about incident and access
              workflows, and operations or sales leaders about analytics, outreach, and repetitive coordination.
              Adoption starts where trusted data and permissions already live, then expands into cross-app
              orchestration. For Main Func, the implication is clear: distribution advantage belongs to whoever can sit
              closest to trusted context while still delivering horizontal outcomes across systems.
