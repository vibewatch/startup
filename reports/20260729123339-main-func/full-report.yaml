      - number: '7.3'
        title: Supplier, distribution, and financial-model risk
        blocks:
          - type: paragraph
            body: >-
              The company’s commercial upside is inseparable from dependency risk. Public materials describe Genspark as
              orchestrating 30-plus to 70-plus models, relying on OpenAI and Anthropic for core reasoning and voice
              capabilities, and connecting into enterprise systems such as Slack, Notion, Salesforce, HubSpot, Google
              Workspace, and Microsoft 365. Anthropic’s commercial terms explicitly allow service suspension if law,
              attack, cost, or upstream vendor issues interfere, and OpenAI’s service terms carve out beta features and
              narrow parts of output indemnity. Main Func is therefore exposed not only to vendor pricing but also to
              policy shifts, outages, model-quality regressions, and changing contractual limits. Financially, the
              credits system and broad multimodal product set imply that usage growth can drive both revenue and
              delivery cost upward at the same time. That would be manageable in a mature SaaS platform with transparent
              gross margins; here it remains a real risk because public reporting still lacks customer concentration,
              churn, and margin detail. Meanwhile, Salesforce, Microsoft, Workday, ServiceNow, and UiPath all push
              agentic automation from inside existing enterprise systems, which means Main Func must outrun supplier
              dependence while also outrunning distribution incumbents.
