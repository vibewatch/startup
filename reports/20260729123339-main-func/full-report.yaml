  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, privacy, and legal exposure
        blocks:
          - type: paragraph
            body: >-
              Main Func operates in a category where legal expectations are rising faster than the company itself is
              aging. The EU AI Act’s transparency rules come into force in August 2026, and the Commission’s overview
              makes clear that deployers of AI systems need informed human interaction, oversight, monitoring, and
              incident handling, while some high-risk systems face far stricter obligations later. California privacy
              law already grants rights to know, delete, correct, and opt out of data sharing, and Genspark’s own
              privacy policy says user-provided prompt content may be sent to OpenAI and Anthropic when the user
              includes personal data in a request. Main Func’s terms also disclaim accuracy, quality, and user reliance
              on content, while assigning IP and compliance responsibility back to users. None of that is unusual in AI,
              but it creates real enterprise friction: the more the product handles meeting transcripts, email context,
              CRM data, and outbound actions, the more legal review shifts from generic SaaS procurement toward
              AI-governance review.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
