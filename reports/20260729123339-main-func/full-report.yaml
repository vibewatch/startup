      - number: '7.2'
        title: Operational, quality, and security risk
        blocks:
          - type: paragraph
            body: >-
              Operationally, Main Func is selling autonomy into workflows where small mistakes can have outsized
              consequences. The product can draft external communications, make live phone calls, summarize meetings,
              pull from email and calendar history, and route work across many tools and models. The risk is not only
              hallucination. It is also failed execution, stale context, broken connectors, token expiration, silent
              permission drift, and overreach into actions that users may not fully supervise. Public docs show the team
              is aware of these issues. Team and Enterprise plans are opted out of model training by default, admins
              cannot view member project content, GenTeam restricts creator-like external actions to the creator and
              asks for explicit approval on hard-to-reverse tasks, and enterprise docs expose logs, SSO, and connector
              controls. But the same docs also admit operational failure modes: a misconfigured required-SSO rollout can
              lock out an entire organization, connector settings apply org-wide rather than per user, and Meeting Notes
              integrations can break when tokens expire. The product looks thoughtfully instrumented, yet public
              evidence still does not show incident rates, false-action rates, or customer-audited reliability.
            claimRefs:
