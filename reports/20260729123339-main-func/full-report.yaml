      - number: '1.2'
        title: Founders, leadership, and governance signals
        blocks:
          - type: paragraph
            body: >-
              The company markets founder-market fit aggressively, and the underlying evidence broadly supports that
              framing. November 2025 financing releases describe CEO Eric Jing as a Microsoft Bing founding member and
              builder of a prior company that reached a $5.5 billion valuation, while TechCrunch and Baidu Baike tie
              both Jing and CTO Kay Zhu to prior search and AI work at Microsoft, Google, Baidu, and Xiaodu. COO Wen
              Sang is presented as the enterprise-software complement to that technical duo, with an MIT PhD and a prior
              company, Smarking, that exited after being backed by Y Combinator and Khosla. Governance visibility is
              thinner than founder visibility: the public record is rich on founders and investors, but sparse on a
              formal board roster, independent directors, or committee structure. Emergence Capital partner Joe Floyd
              appears prominently in the Series B materials, which signals sponsor influence, but not the same
              transparency investors would get from a mature public-company governance stack. That concentration of
              narrative in three operators is both a strength and a key-person dependency.
