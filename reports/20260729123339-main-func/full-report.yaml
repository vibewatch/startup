      - number: '1.3'
        title: Capitalization, scale claims, and operating maturity
        blocks:
          - type: paragraph
            body: >-
              Main Func has moved through financing rounds unusually quickly. Public reporting and company-backed
              releases support a roughly $60 million seed in 2024, a $100 million Series A in early 2025, a $275 million
              Series B at a $1.25 billion post-money valuation on November 20, 2025, a March 2026 extension that brought
              Series B to $385 million at about $1.6 billion, and a June 2026 extension that brought total funding above
              $645 million at a $2.6 billion valuation. Operating-scale disclosures also ramp quickly but come with
              caveats. The November 2025 Series B materials said the business crossed $50 million annualized run rate
              within five months of the workspace launch; OpenAI later cited $36 million ARR in 45 days after Super
              Agent, Anthropic cited more than $250 million ARR since the pivot, and July 2026 press materials added
              7,000+ business clients. Those data points are directionally bullish, but independent verification remains
              limited, and public headcount signals conflict across sources, ranging from a ~20-person team in 2024 to
              51-100 employees or roughly 143 employees in 2026, with Anthropic specifically describing roughly 50
              engineers.
