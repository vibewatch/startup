              The public record says much more about acquisition and collaboration than about durability. There is no
              disclosed NRR, GRR, churn, cohort retention, renewal rate, logo retention, average contract term, or
              top-customer concentration. Still, the product surface hints at how expansion could happen if the platform
              lands successfully. Shared Hubs preserve context across projects; Teams supports organization-level
              messaging and project sharing; GenTeam introduces persistent human-plus-agent channels; Meeting Notes
              auto-joins and shares outputs across meeting platforms; and admin tooling exposes seat management, usage
              analytics, connector controls, and upsell levers such as added seats or extra credit packs. Those features
              create a plausible land-and-expand motion, but they do not prove durable economics. The diligence view is
              therefore mixed: expansion mechanics are visible, while retention quality and concentration risk remain
              largely opaque. In practical terms, buyers can clearly see how the product could spread once one team
              adopts it, but outside investors still cannot tell whether that spread is happening through healthy
              renewals, broad seat growth, or just bursty experimentation tied to new AI features. That missing
              durability layer is the central customer risk in the public record.
