      - number: '6.4'
        title: Customer quality verdict
        blocks:
          - type: paragraph
            body: >-
              Main Func appears to have crossed from consumer-style AI curiosity into genuine business usage faster than
              most peers, and the product increasingly reflects what organized customers need: centralized billing,
              collaboration, shared memory, task management, and cross-channel agent deployment. That is the positive
              case. The negative case is that public evidence still does not show whether these customers are deeply
              deployed, renewing at strong rates, expanding profitably, or concentrated in a few large accounts. As of
              2026-07-29, the customer chapter supports a conclusion of real breadth with incomplete depth verification.
              Customer momentum looks credible; customer quality still requires direct diligence materials. The best
              interpretation is that Main Func has earned the right to be taken seriously as an enterprise-oriented
              platform, but it has not yet provided enough public evidence to let an outside reader separate durable
              enterprise adoption from fast-moving AI enthusiasm or from temporary, launch-driven curiosity.
