              reached $36 million in ARR in just 45 days after launch, LG and PR Newswire say Genspark broke $50 million
              in annualized run rate within five months, Business Wire says the company surpassed $100 million ARR
              within nine months, Anthropic says it surpassed $250 million ARR after pivoting to the Super Agent, and
