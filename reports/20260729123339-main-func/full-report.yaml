      - number: '3.3'
        title: Startup specialists, substitutes, and where Main Func is broader
        blocks:
          - type: paragraph
            body: >-
              Startup specialists prove there is still room for focused winners, but most attack narrower jobs than Main
              Func. Sierra is building around customer experience and conversational support; Cognition sells autonomous
              software engineering; 11x focuses on AI SDR and phone agents for revenue teams; Clay packages workflow
              automation and enrichment for go-to-market teams; Ema markets AI employees across HR, IT, and finance with
              strong governance messaging. These companies often look sharper than Main Func on one workflow, buyer, or
              operating metric, which can shorten sales cycles. But they also leave whitespace around cross-functional
              knowledge work where the same user wants research, presentation generation, email drafting, analysis, and
              multi-model task execution in one workspace. Main Func’s advantage is horizontal outcome breadth and
              finished-work framing; its disadvantage is that the broader it goes, the more it competes against
              better-funded specialists and better-distributed incumbents at the same time. In practice, the company
              must prove that one cross-functional workspace beats a stack of best-of-breed specialist tools.
            claimRefs:
