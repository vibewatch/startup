      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The hard problem is not demo quality, it is enterprise-grade control under autonomy
            body: >-
              Main Func’s product breadth is impressive, but every new autonomous surface raises the cost of being
              wrong. Reliability, logging, permissions, and approval flows are now core product risks, not support
              details.
            calloutType: risk
