    sections:
      - number: '4.1'
        title: Revenue streams and monetization logic
        blocks:
          - type: paragraph
            body: >-
              Main Func appears to monetize through a hybrid of self-serve subscriptions, team plans, and custom
              enterprise agreements rather than a single classic SaaS seat model. The clearest public anchor is Genspark
              for Business, which advertises a Team Plan at $30 per user per month with 12,000 credits per seat,
              centralized billing, SSO/SAML, invoices, connector management, and broad access to premium models. The
              help-center workflow documentation shows how the product expands into scheduled and email-triggered
              automations, a signal that monetization can stretch beyond simple seat access into higher-value workflow
              usage. That matters because the platform sells not just chat, but high-cost outputs spanning slides,
              images, video, phone calls, research, and integrations. Public messaging also repeatedly emphasizes both
              individual users and enterprise clients, suggesting a mixed revenue base with viral self-serve acquisition
              at the top and negotiated enterprise contracts underneath. In practice, Main Func’s commercial model
              likely resembles a workspace platform with consumption-sensitive costs rather than a clean per-seat SaaS
              product with uniform usage patterns.
