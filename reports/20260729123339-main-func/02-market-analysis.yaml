tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to Main Func
  rows:
  - - AI in workplace (broad)
    - Hardware, software, services, workplace AI, digital-transformation spend across major verticals
    - Pure consumer apps are mostly outside scope, but the category still includes a large amount of non-Main-Func spend
    - Enterprise CIO, business-function heads, transformation budgets
    - Useful as an upper bound only; too broad for underwriting Main Func directly
  - - AI productivity tools
    - Virtual assistants, document management, RPA, analytics, content creation, code assistance, PM, collaboration, scheduling
    - Hardware, deep model infrastructure, non-productivity AI
    - Department heads, IT, line-of-business software budgets
    - Closer to Main Func because it overlaps everyday knowledge-work jobs
  - - AI knowledge work automation
    - Content generation, enterprise search, workflow management, customer support, data analysis
    - Physical automation and generic collaboration software without automation depth
    - Operations, support, research, finance, and back-office leaders
    - Strong fit because Main Func sells finished work rather than point responses
  - - Agentic AI software
    - Autonomous process automation, multi-agent orchestration, assistants with tool use, agent platforms
    - Traditional scripted bots, non-autonomous assistants, generic infrastructure
    - AI platform owners, automation COEs, functional process owners
    - Best direct framing for Main Func’s orchestration-led product thesis
  - - Main Func practical target market
    - Cross-functional knowledge-work automation for research, finance, support, sales enablement, HR, and internal ops
    - Robotics, generic AI infrastructure, hardware, and all-purpose collaboration categories
    - Combination of functional owner and platform/IT approver
    - Most defensible diligence boundary because it matches what the product actually does
  notes: The same vendor can appear in several rows because analyst taxonomies overlap; this table is about market boundary logic, not mutually exclusive company sets.
