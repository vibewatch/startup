- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Digital transformation and platform modernization
    - Driver
    - Now through 2030
    - Pushes more work into systems where agents can operate and retrieve context
    - Which workflows are already systematized enough for Main Func to automate quickly?
  - - Intent-based computing and better model/tool orchestration
    - Driver
    - Now
    - Raises the ceiling from simple copilot help to full task completion
    - Can Main Func prove outcome quality beyond demos?
  - - Departmental ROI pressure
    - Driver
    - Immediate
    - Finance, HR, IT, and support teams adopt where cycle time and staffing gains are measurable
    - What payback period do pilots actually achieve?
  - - Embedded agents in systems of record
    - Mixed
    - Now
    - Expands category awareness but gives incumbents strong distribution power
    - How does Main Func coexist with or displace app-native agents?
  - - Integration with existing systems
    - Constraint
    - Immediate
    - Agents fail when they cannot access clean data or execute reliably across tools
    - How many production connectors and safe action paths exist per use case?
  - - Governance, security, and compliance
    - Constraint
    - Immediate and persistent
    - Lack of audit trails, controls, and policy guardrails can stall production rollouts
    - What governance evidence is available for regulated buyers?
  - - Compute cost and model dependency
    - Constraint
    - Immediate
    - Always-on agents can turn into budget drains and depend on third-party model economics
    - What is the cost-to-serve per successful workflow?
  - - Change management and skills
    - Constraint
    - Persistent
    - Teams need to redesign workflows and supervise agents instead of only buying licenses
    - What onboarding and workflow redesign burden does deployment impose?
  notes: Directional ratings reflect the current state of agentic enterprise deployment, where category pull is strong but scaling still depends on governance, systems integration, and measurable ROI.
