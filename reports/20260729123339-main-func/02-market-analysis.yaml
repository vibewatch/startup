callouts:
- calloutType: insight
  title: The most honest TAM is not the biggest TAM
  body: The broad AI-in-workplace category proves there is budget migration happening, but it overstates Main Func’s direct addressable software market. Narrower agentic-AI and knowledge-automation lenses are smaller, but they are far more relevant to underwriting whether the product can win a repeatable wedge.
  claimRefs:
  - CM009
  - CM012
  - CM013
  - CM014
  - CM034
- calloutType: risk
  title: Incumbent workflow and system-of-record vendors already own many buyers
  body: Workday, Salesforce, ServiceNow, SAP, Microsoft, UiPath, and Automation Anywhere are embedding or orchestrating agents inside budgets that customers already trust. Main Func must therefore sell not just better models, but a better cross-system outcome layer.
  claimRefs:
  - CM020
  - CM021
  - CM022
  - CM023
  - CM024
  - CM025
  - CM026
  - CM027
  - CM038
- calloutType: assumption
  title: Market growth does not equal production success
  body: The category is growing quickly, but Gartner’s cancellation warning and Anthropic’s integration and change-management findings imply that realized production adoption will lag the top-down market narrative. Valuation should therefore weight proof of workflow completion and retention more than TAM optics.
  claimRefs:
  - CM007
  - CM016
  - CM018
  - CM036
  - CM040
