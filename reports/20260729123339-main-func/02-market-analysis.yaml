chapter:
  number: 2
  title: Market Analysis
  summary: 'Main Func sits inside a fast-growing but definitionally messy market: the broadest “AI in workplace” lens is hundreds of billions of dollars and too inclusive, while the narrower 2026 agentic-AI and knowledge-work automation lenses cluster in the roughly $10 billion to mid-teens-billion range and are being shaped by incumbent workflow platforms, embedded copilots, and rising governance scrutiny.'
sections:
- id: market-boundary
  title: Market boundary and category fit
  body: 'The first task in sizing Main Func’s opportunity is deciding what market it is actually in. The broadest lens — “AI in workplace” — is useful for understanding long-run budget migration, but it is too inclusive to underwrite a company like Main Func because it bundles hardware, services, workplace devices, and enterprise AI spend far beyond knowledge-work automation. More relevant are the narrower lenses that describe agentic AI, AI productivity tools, and AI knowledge-work automation. Those categories converge around software that takes a business goal, reasons over context, calls tools or systems, and returns an outcome: a case resolved, a report written, a workflow completed, a contract reviewed, or a financial task executed. That aligns with Main Func far better than generic collaboration software or full enterprise-application spend. The category boundary also has to exclude physical robotics, model-layer infrastructure, and broad enterprise suites where AI is only a small
    embedded feature. Main Func is competing in the overlap between AI knowledge automation and workflow-oriented agentic execution, not in the entire workplace-AI universe.'
