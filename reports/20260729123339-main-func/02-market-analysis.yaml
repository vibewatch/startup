- id: sizing-lenses
  title: TAM, SAM, and practical sizing lenses
  body: 'Published market numbers support a wide range because they measure different things. The Business Research Company’s 2026 AI-in-workplace figure reaches $421.09 billion, but its own definition covers hardware, software, and services across most major industries, making it more of a digital-work spend umbrella than a clean software TAM for Main Func. Narrower estimates are more decision-useful. Mordor Intelligence pegs the agentic AI market at $9.89 billion in 2026 with a 42.14% CAGR through 2031; Intel Market Research puts AI knowledge automation at $14.3 billion in 2026; Data Bridge values AI knowledge work automation at $5.27 billion in 2025 and $14.86 billion by 2033. These narrower definitions still differ, but they all point to the same conclusion: Main Func’s practical software market is not hundreds of billions today. It is more plausibly a low-double-digit-billion software opportunity with strong growth, where the vendor wins only if it captures cross-functional workflow
    budgets rather than acting like a novelty assistant. The real modeling challenge is less TAM inflation and more deciding which narrow wedge — research, finance ops, customer support, or internal workflow automation — converts fastest into repeatable production spend.'
