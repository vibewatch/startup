- id: drivers-constraints
  title: Growth drivers, adoption constraints, and valuation implications
  body: 'The growth case is real. Google says 52% of executives at gen-AI-using organizations already have agents in production, and Anthropic finds 80% of surveyed organizations report measurable economic returns. Yet the same research makes clear that adoption is not linear. Anthropic identifies integration, data quality, and change management as the three biggest operating frictions. Gartner goes further, warning that more than 40% of agentic AI projects will be canceled by end-2027 because of escalating costs, unclear business value, or inadequate controls, while also warning that the vendor landscape is full of “agent washing.” Market growth therefore depends on something stricter than model novelty: governance, interoperability, explainability, and fit with existing enterprise processes. Multi-agent orchestration is becoming the default architecture, but so is buyer skepticism. For Main Func, this means market size alone cannot justify valuation. The company needs proof that its orchestration
    layer is production-grade, measurable, and differentiated from the app-native agents already being embedded by Workday, Salesforce, ServiceNow, SAP, Microsoft, UiPath, and Automation Anywhere.'
