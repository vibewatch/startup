      Public valuation support still trails public growth support because retention, margins, concentration, and exact
      round terms remain private.
    - The business depends materially on frontier-model vendors and connectors that it does not fully control.
    - >-
      Incumbents such as Salesforce, Microsoft, Workday, ServiceNow, and UiPath already own major workflow budgets and
      enterprise context.
    - >-
      Trust, compliance, and reliability burdens rise quickly when AI agents move from drafting into actions, meeting
      capture, and sensitive enterprise context.
    - The latest public valuation can look stretched if the $250M-scale revenue claim is less durable than it appears.
  unresolvedGaps:
