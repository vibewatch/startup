  - - Contribution margin by workflow
    - 'null'
    - Low
    - High-cost outputs can hide weak economics inside seat bundles
    - Show margin by research, slides, voice, video, and automation workloads
  notes: The company has public topline velocity but almost none of the private operating metrics needed for conventional SaaS underwriting.
