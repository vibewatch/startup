- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact
  - Exact diligence path
  rows:
  - - Cash balance and monthly burn
    - Cannot assess runway or financing dependency precisely
    - Request board reporting package with monthly cash bridge and forecast burn
  - - Gross margin by product / modality
    - Cannot judge whether compute-heavy outputs are profitable
    - Review quarterly gross margin and COGS split by modality and by enterprise tier
  - - Customer concentration and revenue mix
    - Cannot tell whether ARR is diversified or dependent on few large accounts
    - Request top-20 customer contribution and self-serve / team / enterprise revenue mix
  - - Retention and expansion metrics
    - Cannot underwrite durability of current ARR claims
    - Provide cohort retention, NRR, GRR, and upsell by segment
  - - Sales efficiency and pipeline conversion
    - Cannot evaluate whether current growth is repeatable without excessive spend
    - Review CAC, payback, pipeline coverage, and close rates by channel
  - - Model-provider commitments and cloud economics
    - Cannot assess cost leverage or supplier concentration risk
    - Disclose major model/cloud contracts, spend concentration, and committed minimums
  notes: These are not nice-to-have metrics; they are the missing pieces required to decide whether Main Func is high-quality software or just high-growth software.
