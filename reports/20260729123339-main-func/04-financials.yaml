- calloutType: risk
  title: Included credits can mask weak unit economics
  body: A team plan that bundles rich multimodal usage can accelerate adoption, but it also creates the risk that customers consume expensive slides, voice, video, and automation workloads faster than pricing captures value. Without margin disclosure, investors cannot tell whether usage drives profit or just compute spend.
  claimRefs:
  - CI001
  - CI003
  - CI004
  - CI014
  - CI017
  - CI019
  - CI020
- calloutType: assumption
  title: Near-term capital adequacy looks strong, but not because burn is known
  body: The company has raised enough equity to look safe for now, yet that comfort comes from round size and valuation, not from published cash and runway data. If burn is aggressive, the next financing discussion could arrive sooner than headline funding totals imply.
  claimRefs:
  - CI029
