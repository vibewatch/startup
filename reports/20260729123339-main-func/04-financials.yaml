company:
  name: Main Func
chapter:
  number: 4
  title: Financials
  summary: Public evidence suggests Main Func has rapidly evolved from a consumer-ish AI search product into a hybrid self-serve and enterprise AI workspace business with unusually fast ARR growth, but most underwriting-critical metrics remain private. The visible model points to subscription revenue with seat-and-credit packaging, high gross-margin potential at scale, meaningful near-term model and infrastructure costs, and strong capital adequacy after more than $645 million of cumulative funding by mid-2026.
sections:
- id: revenue-model
  title: Revenue streams and monetization logic
  body: Main Func appears to monetize through a hybrid of self-serve subscriptions, team plans, and custom enterprise agreements rather than a single classic SaaS seat model. The clearest public anchor is Genspark for Business, which advertises a Team Plan at $30 per user per month with 12,000 credits per seat, centralized billing, SSO/SAML, invoices, connector management, and broad access to premium models. The help-center workflow documentation shows how the product expands into scheduled and email-triggered automations, a signal that monetization can stretch beyond simple seat access into higher-value workflow usage. That matters because the platform sells not just chat, but high-cost outputs spanning slides, images, video, phone calls, research, and integrations. Public messaging also repeatedly emphasizes both individual users and enterprise clients, suggesting a mixed revenue base with viral self-serve acquisition at the top and negotiated enterprise contracts underneath. In practice,
    Main Func’s commercial model likely resembles a workspace platform with consumption-sensitive costs rather than a clean per-seat SaaS product with uniform usage patterns.
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  - CI006
  - CI021
  tableRefs:
  - TI001
  - TI002
  figureRefs:
  - FI001
- id: traction
  title: Public traction and revenue-quality signals
  body: 'The most striking public evidence is the velocity of reported revenue milestones. OpenAI says Super Agent reached $36 million in ARR in just 45 days after launch, LG and PR Newswire say Genspark broke $50 million in annualized run rate within five months, Business Wire says the company surpassed $100 million ARR within nine months, Anthropic says it surpassed $250 million ARR after pivoting to the Super Agent, and July 2026 release coverage says it serves 7,000-plus business clients while remaining at roughly $250 million ARR. Even allowing for company-controlled narrative and differences between ARR and annualized run rate, the sequencing is directionally consistent: Main Func is monetizing quickly. Revenue quality is less clear. The business appears to blend enterprise contracts with viral product-led adoption, but there is no public disclosure of churn, cohort behavior, customer concentration, or the split between self-serve, team, and true enterprise revenue. For investors,
    that means the topline story is exciting while the underlying durability story is still mostly opaque.'
  claimRefs:
  - CI007
  - CI008
  - CI009
  - CI010
