  rows:
  - - Individual subscriptions
    - Consumer / prosumer access to the AI workspace
    - Per user / subscription
    - Visible via product positioning but public plan details are lighter than business plan details
    - Medium
    - What share of ARR comes from self-serve plans versus enterprise?
  - - Team Plan
    - Multi-seat subscription with included monthly credits
    - Per user per month
    - Publicly listed at $30/user/month with 12,000 credits per seat
    - High
    - What is effective net seat price after discounts and annual terms?
  - - Enterprise plan
    - Custom contract with admin controls, connectors, security, and likely support/services
    - Annual contract / enterprise ACV
    - Publicly available only in descriptive form, not with pricing
    - Medium
    - What are median ACV, implementation fees, and renewal terms?
  - - Workflow automation usage
    - Higher-frequency scheduled or trigger-based work across email and connected tools
    - Runs / task volume / credits
    - Public workflows and connectors are visible, but monetization specifics are undisclosed
    - Low-medium
    - How much revenue is usage-linked versus bundled into subscription tiers?
  - - Creative / multimodal output workload
    - Slides, image, video, voice, and research generation within one plan
    - Credits / compute load
    - Clearly part of the offer but with no public workload pricing by modality
    - Low
    - What is contribution margin by modality and by enterprise cohort?
  notes: The mix almost certainly blends seat-based access with consumption-sensitive cost structure; the missing question is how much usage is monetized explicitly versus absorbed into subscription bundles.
