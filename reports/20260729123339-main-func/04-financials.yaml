callouts:
- calloutType: insight
  title: The top line is visible; the quality of the top line is not
  body: Main Func has unusually strong public revenue momentum for such a young company, but almost every metric that turns growth into quality — retention, customer mix, CAC, gross margin, cash burn — is still private.
  claimRefs:
  - CI007
  - CI008
  - CI009
  - CI010
