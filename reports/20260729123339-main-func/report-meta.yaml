companyProfile:
  summary: >-
    Main Func is the Palo Alto company behind Genspark, a rapidly expanding AI workspace
    and agent platform that has evolved from AI search into broader autonomous task execution
    across documents, slides, spreadsheets, meetings, email, and workflows. Public evidence
    supports a view of the business as a serious private enterprise-software contender rather
    than a novelty AI app, but still one whose revenue quality and valuation support require
    deeper private diligence.
  foundedDate: '2023-01-01'
  founders:
    - name: Eric Jing
      role: Founder and CEO
      background: >-
        Former Microsoft Bing leader and later senior search and AI operator at Baidu and Xiaodu.
      claimRefs: [CO028]
    - name: Kay Zhu
      role: Founder and CTO
      background: >-
        Former Google search-ranking technologist who later worked at Baidu and Xiaodu.
      claimRefs: [CO029]
    - name: Wen Sang
      role: Founder and COO
      background: >-
        MIT PhD and prior founder of Smarking, a YC- and Khosla-backed enterprise software company.
      claimRefs: [CO030]
  foundingLocation: Palo Alto, California, USA
  headquarters: Palo Alto, CA
  productSummary: >-
    Genspark sells an all-in-one AI workspace centered on a multi-model Super Agent plus
    modules such as AI Slides, Docs, Sheets, GenMail, Workflows, SecondBrain, AgentBase,
    Meeting Notes, and GenTeam. The product promise is finished work rather than generic chat.
  customerFocus: >-
    Knowledge workers, teams, and enterprise buyers looking to automate white-collar tasks
    across research, operations, finance, communication, and productivity workflows.
  businessModel: >-
    Mixed self-serve, team-seat, and enterprise-contract model with credit-backed usage,
    premium multimodal output, and expansion into broader team and enterprise deployment.
  stage: late-growth private company
  fundingStatus: >-
    Public financing anchors moved from a $275M Series B at a $1.25B valuation in November 2025
    to later 2026 reporting around more than $645M total funding and a roughly $2.6B valuation.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO003, CO004, CO021, CO022, CO023, CO028, CO029, CO030, CV004, CV005, CV022]

summary:
  headline: >-
    Main Func remains investable on public evidence, but only for investors willing to do
    proof-heavy diligence and maintain price discipline against a valuation that has already stepped up aggressively.
  overallScore: 6.7
  recommendation: research-more
  confidence: medium
  riskRating: high
  valuationStance: stretched
