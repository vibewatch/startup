  topStrengths:
    - >-
      Public growth signals are extraordinary for a company founded in 2023, including rapid ARR scaling,
      7,000-plus business-client claims, and repeated valuation step-ups.
    - >-
      Product breadth is unusually strong for an early AI company, spanning autonomous research, creation,
      communication, memory, workflows, and team collaboration.
    - >-
      Enterprise packaging and trust surfaces are more mature than a typical AI startup, with team and enterprise
      controls, shared-context products, and visible governance features.
    - >-
      The company sits in a market where AI-native workflow winners can still command premium software narratives.
  topRisks:
    - >-
      Public valuation support still trails public growth support because retention, margins, concentration,
      and exact round terms remain private.
    - >-
      The business depends materially on frontier-model vendors and connectors that it does not fully control.
    - >-
      Incumbents such as Salesforce, Microsoft, Workday, ServiceNow, and UiPath already own major workflow budgets
      and enterprise context.
    - >-
      Trust, compliance, and reliability burdens rise quickly when AI agents move from drafting into actions,
      meeting capture, and sensitive enterprise context.
    - >-
      The latest public valuation can look stretched if the $250M-scale revenue claim is less durable than it appears.
  unresolvedGaps:
    - Current cap table, liquidation preferences, and any investor-protective terms after the latest valuation step-up
    - Cohort retention, NRR, GRR, contract length, and customer concentration behind the 7,000-plus client claim
    - Gross margin by modality, model-vendor spend concentration, and contribution margin after support/compliance costs
    - Reliability metrics such as false-action rate, workflow completion rate, incident history, and enterprise security-review outcomes
    - Exact split of self-serve, team, and enterprise revenue plus ACV distribution across larger accounts
    - Any priced secondary, 409A, or financing signal after the mid-2026 valuation reset

