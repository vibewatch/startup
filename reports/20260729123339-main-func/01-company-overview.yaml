company:
  name: Main Func
chapter:
  number: 1
  title: Company Overview
  summary: Main Func, the Palo Alto company behind Genspark, has repositioned from AI search into an agentic workspace business, raised a $275 million Series B at a $1.25 billion valuation in November 2025, and by mid-2026 was reporting $250 million ARR, 7,000+ business clients, and a heavy dependence on frontier-model partners for continued execution.
sections:
- id: identity-positioning
  title: Identity and product positioning
  body: 'Main Func is the corporate parent behind Genspark, and the public record now describes the business less as a search experiment and more as an agentic workspace vendor for knowledge workers. The corporate homepage says the company is based in Palo Alto, founded by alumni of Microsoft, Google, Meta, and Pinterest, and operates offices in Singapore and Tokyo. Its legal pages anchor the operating structure more precisely: MainFunc Inc. provides the services, while Genspark Inc. is a wholly owned subsidiary and genspark.ai is the main product surface. The product story has evolved quickly. TechCrunch covered Genspark in June 2024 as an AI-powered search engine built around Sparkpages, but OpenAI, Anthropic, and later company releases describe a 2025 pivot toward autonomous task completion, where one prompt can yield slides, documents, spreadsheets, web apps, or AI phone calls. That repositioning matters because later diligence should assess Main Func as a workflow-automation and productivity
    platform, not only as a consumer AI search property.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  - CO006
  - CO007
  - CO008
  - CO009
  - CO010
  - CO011
  - CO025
  figureRefs:
  - FO002
- id: founders-governance
  title: Founders, leadership, and governance signals
  body: 'The company markets founder-market fit aggressively, and the underlying evidence broadly supports that framing. November 2025 financing releases describe CEO Eric Jing as a Microsoft Bing founding member and builder of a prior company that reached a $5.5 billion valuation, while TechCrunch and Baidu Baike tie both Jing and CTO Kay Zhu to prior search and AI work at Microsoft, Google, Baidu, and Xiaodu. COO Wen Sang is presented as the enterprise-software complement to that technical duo, with an MIT PhD and a prior company, Smarking, that exited after being backed by Y Combinator and Khosla. Governance visibility is thinner than founder visibility: the public record is rich on founders and investors, but sparse on a formal board roster, independent directors, or committee structure. Emergence Capital partner Joe Floyd appears prominently in the Series B materials, which signals sponsor influence, but not the same transparency investors would get from a mature public-company governance
    stack. That concentration of narrative in three operators is both a strength and a key-person dependency.'
  claimRefs:
  - CO028
  - CO029
  - CO030
  - CO031
  - CO033
  - CO035
  - CO036
  - CO037
  - CO038
  tableRefs:
