- id: milestones-watchpoints
  title: Milestones and first-order watchpoints
  body: 'The milestone pattern is coherent even if some metrics remain self-reported. Genspark launched publicly on Product Hunt in June 2024 as an AI search engine and earned notable early community attention. By April 2025 the company had pivoted toward agentic execution, with OpenAI and Anthropic later describing the Super Agent architecture as the commercial inflection. November 2025 then combined two things that matter for diligence: a large Series B and the public launch of AI Workspace, which reframed the company around finished work outcomes rather than search. March and June 2026 extended that capital base and widened the product surface toward Genspark Claw, Microsoft integration, and a broader enterprise stack. Still, several watchpoints are already visible. TechCrunch documented unresolved safety, legal, and business-model questions in the original search product. The terms of service disclaim accuracy and put compliance responsibility on users, while the privacy policy confirms
    that prompts can flow to OpenAI and Anthropic when users invoke those capabilities. Techtimes also highlights the strategic dependency: Main Func’s orchestration layer relies on model providers that are also building their own enterprise agent products.'
