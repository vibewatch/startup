callouts:
- calloutType: strength
  title: Founder-market fit is unusually aligned with the product bet
  body: Main Func is not pitching general AI from first principles; it is pitching a search-and-execution layer built by operators who previously worked on search, assistants, and enterprise software. That makes the pivot from search to finished-work automation more credible than a generic AI wrapper story.
  claimRefs:
  - CO028
  - CO029
  - CO030
- calloutType: risk
  title: Commercial momentum is visible, but operating transparency is still thin
  body: The company discloses large ARR, client-count, and valuation jumps, yet public evidence still leaves open the exact headcount, customer mix, retention quality, and how much of the growth is enterprise versus self-serve. That opacity should carry into later financial and customer diligence.
  claimRefs:
  - CO021
  - CO022
  - CO023
  - CO036
  - CO037
  - CO038
- calloutType: insight
  title: The main strategic bet is orchestration, not model ownership
  body: Main Func’s narrative consistently argues that durable value lives in routing and execution across models rather than in building a foundation model itself. That can accelerate product velocity, but it also makes the company structurally dependent on suppliers that may become direct competitors.
  claimRefs:
  - CO011
  - CO034
  - CO039
