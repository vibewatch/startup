- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Broad finished-work workspace
    - Incumbents add more cross-app actions and document generation
    - High
    - Measure whether customers consolidate tasks into Genspark rather than just sampling features
  - - Multi-model orchestration advantage
    - Model routing becomes commoditized across rivals
    - High
    - Request evidence that output quality or cost-to-completion is structurally better than competitors
  - - User habit and interface simplicity
    - Microsoft, Salesforce, and Workday already own daily workflow surfaces
    - High
    - Assess daily active use and stickiness by function, not just logo count
  - - Security and compliance posture
    - Incumbents still have longer governance track records and native audit anchors
    - Medium-high
    - Review enterprise security reviews, incident history, and renewal blockers
  - - Horizontal category breadth
    - Specialists beat Main Func on depth in CX, coding, GTM, or HR/finance workflows
    - High
    - Quantify where horizontal breadth truly wins versus where specialists do
  - - Pricing accessibility
    - Usage-based competitors can look cheaper for narrow tasks, while bundles look cheaper in existing suites
    - Medium
    - Compare full annual cost for common workflows against 3-5 alternatives
  - - Connector breadth and ecosystem reach
    - Systems-of-record vendors may limit openness or favor their own agents
    - Medium-high
    - Audit connector quality, permissions, and workflow completion rates in production
  - - Outcome quality and trust
    - A single broad platform can fail on accuracy in high-stakes domains
    - High
    - Run competitive bake-offs on finance, HR, legal, and customer-service use cases
  notes: The risk register treats distribution power and workflow embedding as the hardest moat to overcome in enterprise agent software.
  claimRefs:
  - CP038
  - CP039
  - CP040
  - CP041
  - CP042
