  title: Competitor profile table
  columns:
  - Competitor
  - Category
  - Scale / funding
  - Target segment
  - Differentiation
  - Limitation
  rows:
  - - Main Func / Genspark
    - Horizontal AI workspace / finished-work agent layer
    - $275M Series B at $1.25B in Nov. 2025; later extensions claimed in 2026
    - Knowledge workers across research, GTM, finance, and general business workflows
    - 70+ models, finished-work outputs, broad cross-functional scope
    - Breadth raises distribution and trust burden
  - - UiPath
    - RPA + agentic orchestration incumbent
    - Public-company scale
    - Automation COEs, IT, operations, public sector, SAP-heavy enterprises
    - Maestro control plane for agents, robots, systems, and humans
    - Workflow-first heritage can feel heavier than a consumer-like workspace
  - - Automation Anywhere
    - Agentic process automation incumbent
    - Mature enterprise automation vendor
    - Operations, IT, healthcare, manufacturing, financial services
    - Process Reasoning Engine and strong governance / compliance messaging
    - Less obviously horizontal for ad hoc knowledge-work creation
  - - Salesforce Agentforce
    - CRM-native agent platform
    - Large public-platform scale
    - Sales, service, field service, employee service, IT service
    - Distribution through CRM data and packaged action/conversation pricing
    - Most credible where Salesforce already owns workflow context
  - - Microsoft Copilot Studio
    - Horizontal agent builder and Microsoft 365 distribution
    - Large platform scale
    - General enterprise productivity and departmental agents
    - Ships into Teams, SharePoint, and Microsoft 365 Copilot with credit-based billing
    - Often strongest inside Microsoft context rather than across all systems
  - - Workday Sana
    - System-of-record agent layer for HR and finance
    - Large public-platform scale
    - CHRO, CFO, shared services, managers, employees
    - Acts on HR/finance workflows with permissions and audit controls already in place
    - Center of gravity remains people-and-money workflows
  - - ServiceNow AI Agents
    - Workflow-native enterprise agent platform
    - Large public-platform scale
    - IT, HR, CRM, risk, security, app dev
    - AI Agent Orchestrator, Fabric, and Control Tower across enterprise workflows
    - Best fit where ServiceNow already runs the process backbone
  - - SAP Joule Agents
    - ERP-native AI agent layer
    - Large enterprise-app scale
    - Finance, procurement, supply chain, ERP-centric buyers
    - Business-process grounding and SAP Knowledge Graph
    - Less compelling outside SAP-centered process estates
  - - IBM watsonx Orchestrate
    - Control-plane and governed orchestration platform
    - Large enterprise-technology scale
    - CX, sales, HR, finance, procurement, IT ops
    - Open hybrid control plane with centralized visibility and policy
    - May be more platform-enabling than end-user workspace-friendly
  - - Google Agent Platform
    - Cloud agent platform / builder
    - Hyperscaler scale
    - Developers, cloud-native teams, custom enterprise builds
    - Transparent token economics and model access
    - Requires buyers to build and govern more themselves
  - - Sierra
    - Customer-service agent specialist
    - $950M raise at >$15B valuation reported in 2026
    - Customer experience and contact-center leaders
    - Deep conversational CX tooling, observability, and outcome optimization
    - Narrower than Main Func outside customer support / CX
  - - Cognition / Devin
    - Autonomous software engineering specialist
    - Reported mega-round and very high valuation in 2026
    - Engineering teams and software organizations
    - Deepest autonomy for coding, testing, and shipping software
    - Not a broad white-collar automation workspace
  - - Ema
    - AI employee platform
    - Venture-backed startup scale
    - HR, IT, finance, employee-service workflows
    - 100+ model fusion, governance posture, 1,000+ connectors claim
    - Still more enterprise-process oriented than finished-work creative output
  - - 11x
    - Revenue-team specialist agents
    - Venture-backed startup scale
    - SDR and sales organizations
    - Dedicated AI SDR and phone agent with pipeline proof points
    - Very narrow wedge relative to Main Func
  - - Clay
    - GTM workflow and data-automation specialist
    - Scaled SaaS workflow vendor
    - Revenue operations, growth, outbound teams
    - Action-based workflow automation plus data enrichment and web research agent
    - Primarily GTM-focused rather than general enterprise workflow automation
  notes: Scale fields intentionally mix public-company status with funding markers because private startups disclose financing more readily than reliable revenue or headcount metrics.
