- id: TP002
  title: Feature / capability matrix
  columns:
  - Buying criterion
  - Main Func
  - Incumbent pattern
  - Specialist pattern
  - Implication
  rows:
  - - Cross-functional finished-work output
    - Strong on research, slides, docs, outreach, and analysis in one workspace
    - Often split by app or workflow domain
    - Usually strong in one workflow only
    - Main Func is broadest when buyers want one interface for many knowledge tasks
  - - Trusted system-of-record context
    - Moderate; depends on connectors and enterprise setup
    - Strong for vendors that already own CRM, HR, ERP, or ITSM data
    - Varies by workflow and deployment
    - Incumbents win when data gravity matters more than UI or model variety
  - - Governance and audit controls
    - Growing enterprise posture with security certifications and zero-retention claims
    - Strong and mature across platform incumbents and automation vendors
    - Mixed; strongest among enterprise-focused specialists
    - Regulated buyers may still default to incumbents
  - - Multi-agent orchestration
    - Strong marketing claim around many models and super-agent execution
    - Strong among UiPath, Automation Anywhere, ServiceNow, SAP, and Workday
    - Specialists use orchestration inside their wedge
    - This capability is becoming table stakes rather than unique
  - - No-code / natural-language setup
    - Strong for end-user prompting
    - Increasingly strong across all major platforms
    - Often strong within narrower templates
    - Ease of use is necessary but not durable
  - - Vertical or functional depth
    - Moderate horizontal breadth but lighter domain depth
    - Strong where the incumbent owns a function deeply
    - Very strong inside a narrow job
    - Main Func must avoid losing to best-of-breed in high-stakes workflows
  - - Pricing transparency
    - Moderate via public team plan, low for enterprise deals
    - Mixed; Salesforce, Microsoft, and Clay publish more than others
    - Usually low except some self-serve vendors
    - Procurement friction remains an opening for transparent rivals
  notes: Cells summarize public evidence and are intentionally qualitative where vendors disclose posture but not audited performance benchmarks.
