company:
  name: Main Func
chapter:
  number: 3
  title: Competitors
  summary: Main Func competes in a crowded stack where incumbent workflow platforms control many trusted data environments, RPA leaders own orchestration credibility, and startup specialists attack narrower wedges such as customer service, coding, sales development, or internal employee support. Its clearest differentiation is breadth across white-collar workflows and finished-work outputs, but that breadth also leaves it exposed to commoditization by ecosystems with stronger distribution and governance narratives.
sections:
- id: landscape
  title: Competitive landscape and job-to-be-done alternatives
  body: 'Main Func does not compete against one clean peer set. Buyers can satisfy the same need through at least five routes: app-native agents inside systems of record, orchestration-led automation platforms, horizontal workspace copilots, startup specialists that dominate one workflow, and internal build using foundation-model tooling. Main Func’s own messaging puts it in the horizontal “finished work” layer: a user expresses intent, Genspark orchestrates many models and tools, and the platform returns a completed deliverable such as research, slides, analysis, sales outreach, or workflow output. That makes the most direct strategic comparison less about any single chatbot and more about whether a customer prefers a cross-functional agent workspace over app-embedded automation in Salesforce, Workday, ServiceNow, Microsoft, SAP, UiPath, or Automation Anywhere. The practical substitute set is therefore broader than AI-agent startups alone. A Fortune 500 buyer can solve the same problem
    by extending the system they already trust, by adding an orchestration layer, or by adopting a specialist agent with a tighter ROI story.'
