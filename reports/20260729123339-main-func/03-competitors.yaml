callouts:
- calloutType: insight
  title: Main Func competes against budget gravity more than against chat interfaces
  body: The hardest rivals are the vendors that already own the workflow budget and trusted data context. Even if Main Func has a better user experience, that advantage can be erased when a buyer can switch on agents inside Salesforce, Workday, ServiceNow, Microsoft, SAP, or UiPath with less integration friction.
  claimRefs:
  - CP012
  - CP013
  - CP014
  - CP015
  - CP016
  - CP018
  - CP039
- calloutType: risk
  title: Breadth is a selling point and a vulnerability
  body: Main Func is broader than Sierra, Cognition, 11x, Clay, or Ema, but every extra workflow it touches invites comparison with a specialist that may look safer, deeper, or cheaper in that exact job.
  claimRefs:
  - CP030
  - CP031
  - CP032
  - CP033
  - CP034
  - CP035
  - CP040
- calloutType: assumption
  title: Orchestration is no longer enough to be unique
  body: UiPath, Automation Anywhere, ServiceNow, Workday, SAP, Microsoft, and Google all now describe orchestration, agents, and cross-system execution. Main Func therefore has to prove not just that it orchestrates, but that it delivers better finished outcomes at lower friction or lower cost.
