- id: durability
  title: Switching costs, multi-homing, and moat durability
  body: Competitive durability is still mostly unproven across the category. The strongest lock-in today comes from data location, workflow embedding, admin controls, and procurement convenience rather than from pure model quality. Workday, ServiceNow, Salesforce, SAP, and Microsoft all benefit from preexisting identity, data, and workflow anchors. UiPath and Automation Anywhere benefit from process graphs, bot estates, and governance layers that are expensive to replace. Specialists like Sierra and Cognition can create deeper switching costs if they own a mission-critical workflow and gather rich operational feedback. Main Func’s moat thesis rests on orchestration breadth, output quality, and user habit formation around a single interface for many tasks. That can become sticky if teams centralize research, reporting, and workflow execution inside Genspark. But it is vulnerable if buyers multi-home across model workspaces, keep sensitive workflows inside systems of record, or decide that
    specialized agents are safer than a broad horizontal layer. The competitive question is not whether Main Func has a product; it is whether its breadth compounds into durable workflow gravity before incumbent agents and cheaper model-based alternatives absorb the same use cases.
  claimRefs:
  - CP039
  - CP040
  - CP041
  - CP042
  tableRefs:
  - TP004
