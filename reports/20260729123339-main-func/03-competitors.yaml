- id: incumbents
  title: Incumbent control points and why they matter
  body: 'Incumbents hold the best distribution positions because they already sit on trusted enterprise context. Salesforce prices Agentforce around actions, conversations, and user add-ons tied to CRM workflows. Microsoft distributes agents into Microsoft 365 Copilot and bills through credit packs or pay-as-you-go usage. Workday embeds Sana directly into HR and finance workflows and wraps it into Flex Credits rather than a separate license wall. ServiceNow extends agents across IT, HR, CRM, risk, and application development while emphasizing governance through a control tower. SAP frames Joule around process grounding and knowledge graphs. UiPath and Automation Anywhere are converging RPA and agentic orchestration, making the case that real enterprise value comes from governing agents, robots, systems, and humans together. IBM and Google occupy enabling positions from the platform side: IBM sells control-plane governance, while Google exposes transparent token-based platform economics.
    Collectively, these incumbents make one thing clear: the market is moving from isolated copilots to workflow-native and orchestrated execution, and the buyers with the least appetite for integration risk will often start with a vendor that already owns adjacent budget.'
