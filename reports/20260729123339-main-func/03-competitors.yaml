- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Vendor
  - Public package / price signal
  - Included capability
  - Discount / unknowns
  - Implication
  rows:
  - - Main Func / Genspark
    - Team Plan $30/user/month with 12,000 credits per seat; enterprise custom
    - Workspace access, top-tier models, admin controls, SSO/SAML, connectors
    - Enterprise realized pricing unknown
    - Simple seat anchor can help initial adoption, but enterprise economics are still opaque
  - - Salesforce Agentforce
    - $500 per 100k Flex Credits; $2 per conversation; $125/user/month add-ons; from $550 editions
    - Customer- and employee-facing agents tied to Salesforce workflows
    - Large contracts likely blend credits and pre-purchase commitments
    - Pricing is explicit but can become complex and usage-metered
  - - Microsoft Copilot Studio
    - $200 per 25,000 Copilot Credits per month or pay-as-you-go
    - Tenant-wide agent creation and deployment into Microsoft surfaces
    - Per-organization billing can mask true per-workflow cost
    - Strong for Microsoft estates, but usage accounting matters
  - - Workday Sana
    - Wrapped into Workday Flex Credits, no separate license wall for core self-service agent
    - HR and finance task execution plus enterprise connectors
    - Realized value depends on existing Workday contract and Flex Credit pool
    - Bundling is a distribution advantage for Workday
  - - Clay
    - Free tier; Launch from $167/mo; Growth from $446/mo
    - Workflow automation, data enrichment, Claygent web research, campaign support
    - Action and data-credit expansion can change realized cost materially
    - Clay undercuts broad enterprise-agent platforms for GTM-specific jobs
  - - UiPath / Automation Anywhere / IBM / SAP / Sierra / Ema / 11x / Cognition
    - Mostly quote-based or custom enterprise pricing
    - Varies by platform, workload, and services intensity
    - Public comparability remains low
    - Opaque pricing slows apples-to-apples evaluation and raises diligence burden
  notes: This table compares public list signals and packaging logic, not realized enterprise ASPs or margins.
