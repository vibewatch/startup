chapter:
  number: 5
  title: Product & Technology
  summary: Main Func’s product thesis is an outcome-centric AI workspace built around a multi-model, tool-using Super Agent, a growing suite of specialized surfaces such as AI Slides, Docs, Sheets, GenMail, Workflows, SecondBrain, and AgentBase, and an enterprise wrapper of governance, connectors, and support. The architecture looks more like an orchestration-and-runtime layer than a single-model application, which creates both differentiation and dependency on partner models, toolchains, and data connectors.
sections:
- id: product-surface
  title: Product definition and module map
  body: 'Main Func sells Genspark as an all-in-one AI workspace for knowledge workers, not as a point tool. The product surface has broadened rapidly from early search and deep-research workflows into a module family that includes AI Slides, AI Docs, AI Sheets, GenMail, Workflows, AgentBase, SecondBrain, Call For Me, Skills, and the umbrella Super Agent experience. Each module corresponds to a real customer job: making presentations, drafting documents, analyzing spreadsheets, triaging email, building recurring automations, generating lightweight business systems, or retrieving personalized context from connected data. This breadth is central to the product strategy. Instead of asking users to string together separate SaaS products, Main Func tries to become the place where a prompt becomes finished work. The most important diligence implication is that the company is not shipping one feature; it is shipping a runtime plus a suite of use-case surfaces, which makes execution powerfully compounding
    if done well and operationally messy if not.'
  claimRefs:
