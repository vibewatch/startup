  evidenceGaps:
  - type: missing-source
    severity: material
    topic: independent-reliability-benchmarks
    missingEvidence: No independent benchmark quantifies task-completion accuracy, failure rate, or recovery behavior across Slides, Docs, Sheets, GenMail, and Workflows.
