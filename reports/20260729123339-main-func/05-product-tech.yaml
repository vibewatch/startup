- id: deployment
  title: Deployment, integrations, reliability, and controls
  body: The deployment story is more mature than the company’s age would suggest. The Team and Enterprise plan documentation describes centralized billing, SAML SSO, connector controls, user analytics, AI model restrictions, session logs, data residency options, custom DPAs, dedicated VPCs, and 99.9% uptime SLA commitments for enterprise buyers. Workflow documentation exposes test runs, pending confirmations, run histories, and one-trigger-at-a-time logic, all of which imply a system designed for supervised execution rather than blind autonomy. AI Slides exposes model-quality tiers, vendor restrictions, guided and direct generation modes, file import, and code-backed charting. GenMail shows direct provider connections and a learned “Email Brain,” while SecondBrain requires explicit authorization and lets users disconnect sources at will. The product therefore combines high autonomy with visible control surfaces — a necessary design choice for enterprise trust. The unresolved question is
    whether these controls are merely documented features or deeply proven operating disciplines at large production scale.
  claimRefs:
  - CE023
  - CE024
  - CE025
  - CE026
  - CE027
