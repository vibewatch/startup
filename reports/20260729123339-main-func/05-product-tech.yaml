- id: architecture
  title: Architecture and operating model
  body: 'Public technical evidence points to an orchestration-led architecture. Mainfunc.ai says Genspark processes information using a Super Agent that orchestrates 30-plus AI models through a mixture-of-agents system. OpenAI’s case study describes a no-code autonomous assistant coordinating nine specialized large language models and 80-plus tools, while Anthropic says the later Super Agent orchestrates more than 150 tools and uses Claude both for tool-selection loops and code generation. The company therefore appears to operate a layered runtime: user intent at the top, a planner/router in the middle, heterogeneous frontier models and in-house tools beneath it, and a set of output surfaces on top of generated artifacts and actions. SecondBrain then acts as a memory layer that gives Super Agent more personalized context, while Skills and AgentBase package repeatable execution patterns. This architecture is differentiated from single-model chat, but it also creates direct dependence on model
    vendors, connectors, and ongoing evaluation discipline.'
  claimRefs:
  - CE012
  - CE013
