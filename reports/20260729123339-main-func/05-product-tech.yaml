- id: differentiation
  title: Differentiation, dependencies, and technology verdict
  body: 'Technically, Main Func’s differentiation comes from three ideas working together: finished-work output rather than chat, orchestration across many models and tools rather than commitment to one model family, and a personal or enterprise context layer that makes the agent more useful over time. Those are meaningful strengths. But they are not moat by themselves. OpenAI, Anthropic, Microsoft, and other frontier-model vendors increasingly expose the primitives that make these workflows possible; competitor platforms now talk about orchestration openly; and the product still depends on third-party model quality, API economics, and connector reliability. Even the founders acknowledge in Anthropic’s case study that “nobody really has a moat anymore” and that execution speed matters most. The technology verdict is therefore positive but conditional: the architecture is credible, the surface area is rich, and the enterprise-control story is stronger than a typical early AI startup — yet
    the company still needs to prove that its orchestration layer produces more reliable finished outcomes than buyers could assemble elsewhere with the same underlying model ecosystem.'
  claimRefs:
  - CE035
  - CE036
  - CE037
  - CE038
  - CE039
  - CE040
