- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - User
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Super Agent
    - General knowledge worker
    - Core platform and continuously expanded
    - Transforms one prompt into multi-step finished work across outputs
    - Need objective success-rate and completion benchmarks
  - - AI Slides
    - Operators, analysts, GTM, executives
    - Documented production surface
    - Conversational deck building with code-backed charts and style skills
    - Need error rate / fact-check performance by deck type
  - - AI Docs
    - Knowledge workers and report authors
    - Documented production surface
    - Rich-text and markdown document generation with export paths
    - Need evidence of enterprise adoption beyond demos
  - - AI Sheets
    - Analysts, finance, ops
    - Documented production surface
    - Spreadsheet agent that gathers, cleans, analyzes, and visualizes data
    - Need auditability and reproducibility metrics
  - - GenMail
    - Email-heavy professionals
    - Documented production surface
    - Unified Gmail/Outlook client with learned writing voice and triage
    - Need data-governance and accuracy metrics on autonomous drafts
  - - Workflows
    - Ops, GTM, support, finance
    - Documented production surface
    - No-code recurring automation with triggers and test runs
    - Need production-scale completion and failure-rate data
  - - SecondBrain
    - Individual professionals and teams
    - Documented production surface
    - Personal memory/context layer across email, files, meetings, apps
    - Need clarity on sync latency, indexing accuracy, and access logging
  - - AgentBase
    - Operators building lightweight systems
    - Newer visible module
    - Turns prompts into dashboards, CRMs, trackers, and business systems
    - Need proof of durability beyond template generation
  - - Call For Me
    - Users needing real-world phone actions
    - Documented production surface
    - Live outbound calling agent with transcripts and scheduled tasks
    - Need reliability, compliance, and consent controls by region
  - - Skills
    - Power users and teams
    - Documented production surface
    - Reusable expert workflows for consistency and style retention
    - Need evidence that skill reuse materially improves output quality
  notes: The module set is broad enough to function like a suite, but most public evidence is still documentation-rich rather than benchmark-rich.
