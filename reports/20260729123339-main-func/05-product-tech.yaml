- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Company solution
  - Measurable benefit
  - Limitation
  rows:
  - - Create a board-ready deck
    - Manual research + drafting + design handoffs
    - AI Slides researches, structures, designs, and exports a deck
    - Faster deck production and editable output
    - Fact quality and narrative judgment still need validation
  - - Draft a polished document
    - Copy/paste from chat into docs
    - AI Docs generates and edits rich documents directly
    - Cleaner first draft and easier iteration
    - Need source-grounding and version-control evidence
  - - Analyze spreadsheet-style data
    - Manual data wrangling or analyst tooling
    - AI Sheets compiles, cleans, queries, and visualizes data
    - Shortens time to analysis
    - Need reproducibility / audit trail for sensitive use cases
  - - Triage inbox and schedule replies
    - Manual inbox review and drafting
    - GenMail summarizes, categorizes, drafts, and schedules
    - Saves time on repetitive communication work
    - Voice-modeling and autonomy can create trust issues
  - - Run recurring business automation
    - Zapier-like or manual recurring tasks
    - Workflows build triggers and actions from natural language
    - Turns busywork into repeatable automation
    - Connector depth and error handling need testing
  - - Search across personal work context
    - Multiple apps and files searched separately
    - SecondBrain unifies memory across connected sources
    - Better personalization and retrieval
    - Sensitive data concentration increases privacy stakes
  notes: The measurable benefits are mostly company-claimed or user-illustrative; independent benchmarks remain scarce.
