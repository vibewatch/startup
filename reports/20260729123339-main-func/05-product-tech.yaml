  data:
    layers:
    - label: Layer 1 — Finished-work surfaces
      detail: AI Slides, AI Docs, AI Sheets, GenMail, AgentBase, and Call For Me are the user-facing surfaces where finished outputs or actions appear.
    - label: Layer 2 — Super Agent runtime
      detail: A planning and routing layer interprets goals, chooses tools and models, manages execution, and assembles results.
    - label: Layer 3 — Context and reuse
      detail: SecondBrain, Skills, workflow history, and connected files/apps provide memory, reusable patterns, and richer personalization.
    - label: Layer 4 — Models and tools
      detail: The runtime calls heterogeneous frontier models plus dozens to hundreds of specialized tools for search, code generation, voice, media, and actions.
    - label: Layer 5 — Enterprise controls
      detail: SSO, connector controls, model restrictions, logging, residency options, and contractual governance wrap the stack for business deployment.
