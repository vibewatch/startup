company:
  name: Apex
chapter:
  number: 1
  title: Company Overview
  summary: Apex is a Los Angeles-area spacecraft manufacturer founded in 2022 to productize satellite bus production for commercial and defense constellations. Public evidence supports real momentum on factory expansion, flight heritage, government traction, and allied-market partnerships, while still leaving key scale metrics such as current headcount, customer count, and board composition undisclosed. The company already looks more industrial than conceptual, but the public record does not yet prove that maximum manufacturing claims have become realized throughput.
sections:
- id: identity-and-operating-model
  title: Identity and operating model
  body: |-
    Apex is a Los Angeles-area satellite manufacturer founded in 2022 by Ian Cinnamon and Max Benassi. The company’s stated thesis is unusually simple: launch availability is no longer the primary bottleneck in space; scalable satellite manufacturing is. Apex therefore positions itself as a productized bus supplier rather than a bespoke prime, emphasizing short lead times, configurable standard platforms, and a manufacturing motion built more like an industrial line than a one-off aerospace shop. That thesis is repeated consistently across the about page, careers copy, and product surfaces, making it one of the most corroborated elements of the company story.

    The public product stack supports that thesis. Apex markets Aries, Nova, Comet Mini, Comet XL, and GEO Aries across multiple orbital regimes, with the umbrella platforms page claiming support for payloads up to 3,000 kg. The most concrete product proof is LEO Aries: Apex says it is flight-proven, in serial production, and being delivered monthly from Factory One. That matters because later chapters can safely treat Apex as a real hardware operator with at least one platform family that has flown, not merely a concept-stage bus developer.

    Manufacturing footprint is the second anchor. TechCrunch reported roughly 46,000 square feet in late 2023; by the 2025 Series D announcement Apex was describing more than 100,000 square feet of combined space and maximum output above 200 satellites per year. The delta suggests real capacity expansion, but the headline capacity is still a peak-state claim rather than a realized throughput figure. That distinction is central to diligence: Apex has evidence of a growing industrial base, but public data still stop short of showing a sustained run-rate anywhere near the theoretical ceiling.
