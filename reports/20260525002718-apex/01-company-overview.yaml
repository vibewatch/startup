  - type: missing-source
    severity: material
    topic: board-disclosure
    missingEvidence: A current board roster, observer rights, and ownership concentration after Series D are not publicly disclosed.
    whyItMatters: Governance control and downside-protection rights matter for underwriting influence and future financing behavior.
    diligencePath: Request the post-Series D cap table, board consents, and investor-rights agreement.
    relatedQuestionRefs:
    - QO008
    relatedTableRefs:
    - TO002
    - TO003
  - type: private-evidence-only
    severity: material
    topic: cover-metrics
    missingEvidence: Current 2026 headcount, customer count, backlog by customer, and current production run-rate are not publicly disclosed.
    whyItMatters: These are cover metrics the rest of the report would otherwise reuse as scale anchors.
    diligencePath: Request a current KPI dashboard covering employees, backlog units, deliveries, and customer counts.
    relatedQuestionRefs:
    - QO015
    - QO025
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: Apex does not publish revenue mix by defense vs. commercial, U.S. vs. allied, or hardware vs. services.
    whyItMatters: Without revenue mix, investors cannot judge concentration, export exposure, or the durability of the government wedge.
    diligencePath: Request management revenue segmentation by customer class, geography, and program.
    relatedQuestionRefs:
    - QO025
    relatedTableRefs:
    - TO003
  - type: missing-source
    severity: minor
    topic: milestone-table
    missingEvidence: The public chronology is still incomplete on early factory-opening specifics, exact Series B close timing, and whether any material adverse operating events preceded the 2025 scale-up.
    whyItMatters: The milestone table is the chapter's chronology of record, so omissions can distort the pace of execution and the interval between capital raises and delivery proof.
    diligencePath: Request an internal milestone log covering factory commissioning, major deliveries, financing closes, and any material execution misses from 2022 through 2026.
    relatedQuestionRefs:
    - QO025
    relatedTableRefs:
    - TO004
