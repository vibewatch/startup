      - Key assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          Factory One moves from narrative to repeatable delivery scale; defense work expands; NEC/KSAT/4iG-type
          relationships monetize; financing stays clean
        - >-
          $2.5B-$4.0B next-step valuation range and roughly 2x-4x gross upside from the latest >$1B mark over a
          multi-year hold
        - Requires operational proof the public record does not yet contain
        - Low probability until deliveries and monetization are visible
      - - Base
        - >-
          Demand continues and Apex raises again above the last round, but disclosure stays thin and margin evidence
          remains limited
        - $1.2B-$2.0B range with only modest multiple expansion and approximately 1x-2x gross upside
        - Capital intensity remains high and upside is capped by missing economics
        - Most consistent with current public evidence
      - - Bear
        - Production slips, self-funded programs absorb cash, compliance noise appears, or financing markets weaken
        - $0.5B-$1.0B range with flat-to-negative returns and real down-round risk
        - Apex could be repriced closer to lower-end space-hardware precedents
        - Material enough that it must be underwritten explicitly
    notes: >-
      These are broad valuation bands, not precise price targets. They are meant to frame directionality under limited
      disclosure rather than simulate a full financial model.
    claimRefs:
      - CV042
      - CV044
      - CV047
      - CV048
      - CV049
      - CV050
      - CV051
  - id: TV005
    title: Thesis-Break and Kill Triggers Table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Delivery ramp miss
        - Announced scale claims do not convert into visibly higher deliveries over the next 12-18 months
        - Turns the manufacturing thesis from scale asset into capacity theater
        - Pause and re-underwrite around a lower multiple band
      - - Government-program slippage
        - Space Force or Shadow-related timelines slip materially or lose scope
        - Weakens the strongest strategic demand proof in the file
        - Move from research-more to avoid until the demand case is rebuilt
      - - Partner non-monetization
        - NEC, KSAT, and 4iG style announcements do not become booked or recurring programs
        - Reclassifies today's partnership evidence as signaling rather than monetization
        - Cut upside assumptions and compress the base-case band
      - - Compliance event
        - Any export-control, cyber, or government-compliance issue becomes public
        - Hits defense credibility, partner execution, and financing access simultaneously
        - Treat as thesis-break until remediated
      - - Next financing at or below the last round
        - Flat or down financing or materially heavier preference terms
        - Signals that operating proof did not keep pace with narrative
        - Reset the valuation lens to downside protection rather than upside capture
      - - Shadow burn without payback
        - Internal capital use expands without visible funded follow-on demand
        - Turns optionality into a balance-sheet overhang
        - Discount strategic upside and demand proof more aggressively
    notes: >-
      Triggers are chosen because they are at least partially monitorable from public evidence. A real trigger should
      force a fresh underwriting pass, not a narrative defense.
    claimRefs:
      - CV013
      - CV050
      - CV054
      - CV055
      - CV056
      - CV061
  - id: TV006
    title: Final Diligence Asks Table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Backlog by customer and program
        - Signed backlog value, cancellation rights, and milestone schedule are not public
        - Need to separate announcement volume from monetizable demand quality
        - Request contract-level backlog schedule and redlined customer terms
      - - Realized pricing and revenue recognition
        - No public realized ASPs or revenue-recognition policy by program type
        - Needed to turn product narrative into an economic model
        - Request program-level revenue waterfall and sample accounting treatment
      - - Gross margin and working-capital profile
        - No public cost, margin, inventory-turn, or deposit data
        - Determines whether productization is actually creating advantaged economics
        - Request standard-cost model, BOM trend, inventory turns, and payment terms
      - - Burn, runway, and next-financing trigger
        - No public monthly burn, cash balance, or board financing thresholds
        - Capital intensity is the central downside variable in this chapter
        - Request latest cash bridge, runway cases, and financing plan
      - - Cap table and preference stack
        - No public liquidation preferences, participation rights, or dilution overhang
        - Return modeling is impossible without knowing the stack above common
        - Request cap table, charter terms, and latest round docs
      - - Project Shadow economics and compliance proof
        - No public reimbursement, DDTC posture, or independent cyber/compliance evidence
        - Shadow can create strategic upside or become an expensive distraction
        - Request program budget, expected follow-on path, and compliance certifications
    notes: >-
      These asks are ordered by how much they would change the recommendation, not by how easy they are to obtain. Items
      1-5 are required to turn public curiosity into investable conviction.
    claimRefs:
      - CV059
      - CV060
      - CV061
      - CV062
      - CV063
