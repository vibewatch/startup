      - number: '3.4'
        title: Moat durability and adverse competitor evidence
        blocks:
          - type: paragraph
            body: >-
              The best case for Apex is credible but still maturing. Manufacturing scale, a multi-orbit product family,
              recent financing, and real government demand signals all matter. HALO participation and the Space Force
              award mean Apex has evidence of defense traction rather than just ambition. KSAT and 4iG show the company
              understands that channels and localization can become moats alongside hardware. Those are meaningful
              strengths.


              The adverse evidence is equally important. Blue Canyon’s heritage, Terran Orbital’s mass overlap, York’s
              integrated control, Rocket Lab’s public-company scale, and EnduroSat’s speed all challenge the idea that
              Apex has a singular manufacturing or integration advantage. Rocket Lab in particular looks like the
              strongest commercial rival when buyers want one prime with disclosed scale and financing power. Meanwhile,
              the lack of public pricing, cost, or win-rate data makes it hard to prove that Apex has a durable economic
              moat rather than just a promising strategic position. The balanced conclusion is that Apex has a
              differentiated niche, but moat durability still depends on delivered throughput, partner leverage, and
              execution against well-capitalized rivals.
