      - number: '8.4'
        title: Monitoring, Thesis-Break Triggers, and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Because the valuation case is evidence-thin, ongoing monitoring is not a side note; it is the core
              discipline. Investors should watch whether Apex's own news flow starts converting into harder signals:
              more delivered satellites, follow-on government awards, disclosed customer programs, and evidence that
              partnerships such as KSAT and 4iG are becoming revenue-bearing rather than merely strategic. The next
              financing is especially important. A step-up round on clean terms would validate the story; a flat or down
              financing would tell the market that manufacturing scale and backlog conversion are not keeping pace with
              ambition.


              Compliance sits in the same bucket. SAM.gov and DDTC are not Apex-specific proof, but they do underline
              the regulatory seriousness of defense-linked operations. The public record still does not show Apex's own
              registration, audit, or cyber posture. That matters because a compliance issue would hit demand
              credibility and financing access at the same time. Project Shadow deserves separate attention for the same
              reason: it is a strategic wedge, but it is also a capital sink until proven otherwise.


              The final diligence list is therefore practical rather than theoretical. Before committing capital,
              investors need contract-level backlog, realized pricing, unit economics, runway, preference terms, and a
              clean explanation of Project Shadow economics and compliance controls. Without that package, the correct
              stance remains research-more.
