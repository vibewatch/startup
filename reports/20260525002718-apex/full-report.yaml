      - number: '8.2'
        title: Valuation Context and Comparable Evidence
        blocks:
          - type: paragraph
            body: >-
              Apex's Series D is the only direct public mark, so it should anchor the analysis more than any synthetic
              multiple. Series D above $1 billion tells us sophisticated investors were willing to price Apex as a
              scaled private space-manufacturing platform, but that mark came with very limited public operating
              disclosure. Public comparables therefore serve only as sanity checks. Those sanity checks are noisy:
              Rocket Lab screens at an extremely rich market-cap-to-revenue ratio, while Redwire is far lower. That
              spread shows that public-space valuations are narrative- and execution-sensitive, not mechanically
              transferable.


              The public downside anchor is more sobering. Research and Markets notes Lockheed Martin's acquisition of
              Terran Orbital for roughly $450 million in 2024. That is not a perfect comparable—different ownership and
              market context—but it is an important reminder that platform businesses can clear far below aspirational
              venture pricing when execution or market conditions disappoint. Meanwhile, Novaspace's government-driven
              market outlook suggests category demand is real but profitability and oversupply pressures remain
              unresolved.


              Taken together, the comparable set supports only a broad band, not a pinpoint. Apex can justify being
              worth more than a struggling or subscale platform business because it has stronger visible demand proof.
              It cannot justify a large premium to its last round from public evidence alone because revenue, gross
              margin, and backlog quality remain undisclosed.
