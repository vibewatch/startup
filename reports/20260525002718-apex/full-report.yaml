      - number: '1.3'
        title: Capital base and stakeholder map
        blocks:
          - type: paragraph
            body: >-
              Apex’s financing cadence is one of the clearest signals that the company has become a serious
              space-industrial asset. Independent reporting establishes a $95 million Series B in 2024, followed by a
              $200 million Series C in April 2025 and a $200 million Series D in September 2025. The use-of-funds story
              is also consistent across sources: Series C funded vertical integration and inventory, while Series D
              funded incremental footprint, more in-house components, and higher production capacity. In other words,
              Apex is raising to industrialize, not merely to extend engineering runway.


              Series D deserves special attention because the round appears opportunistic. Payload reports management
              was not actively fundraising before Interlagos initiated the discussion, and PRNewswire states the round
              valued Apex above $1 billion. That combination implies investor demand remained strong enough that Apex
              could take capital for acceleration rather than because it had run out of options. It does not eliminate
              financing risk—hardware businesses can always absorb capital—but it does suggest the company entered late
              2025 from a position of fundraising strength.


              The stakeholder set also broadens beyond investors. NEC validates international demand with a Japanese
              demonstration mission, KSAT adds downstream mission-services capability, 4iG and REMRED point toward
              European manufacturing ambitions, and the Space Force contract plus HALO selection deepen defense
              relevance. Taken together, these relationships suggest Apex is becoming a constellation-enablement
              platform with commercial, allied, and national-security channels rather than a single-thread startup tied
              to one domestic customer niche.
