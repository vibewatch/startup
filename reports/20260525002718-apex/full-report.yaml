      - number: '4.2'
        title: Unit economics, production, and working capital
        blocks:
          - type: paragraph
            body: >-
              Apex’s unit-economics story is dominated by manufacturing, inventory, and procurement rather than by
              classic customer-acquisition metrics. Factory One is positioned as a build-ahead production system that
              keeps buses and components available for faster delivery. That can be commercially powerful, but it means
              cash is tied up before contracts convert to revenue. The company’s own manufacturing language—build ahead
              of need, maintain inventory, vertical integration, and serial production—points to a working-capital-heavy
              model even before considering launch and mission-integration costs.


              Public throughput evidence is directionally encouraging but still incomplete. TechCrunch reported a
              50-platform annual aspiration off the 2023 site; Satellite Today later cited about a dozen buses per month
              in 2025 while also noting that production lagged demand; official materials now cite more than 200
              satellites per year of maximum capacity. Those numbers are not contradictory so much as they are different
              lenses on the same ramp. They do, however, mean investors should distinguish between peak-state capacity,
              current monthly output, and customer-ready delivery cadence.


              Margin quality will likely depend as much on procurement and compliance execution as on volume. Jack
              Fitzharris explicitly links supplier relationships to pricing and reliable delivery, while Satellite Today
              highlights the cost of pushing more components and subsystems in-house. Apex’s purchase terms and defense
              subcontract rider show a business that is formalizing payables discipline, audits, warranties,
              cybersecurity, and domestic-source constraints. Those controls can support quality and delivery, but they
              add complexity and cost. The public record therefore supports a capital-efficient narrative only weakly;
              it supports a capital-intensive industrial-ramp narrative strongly.
