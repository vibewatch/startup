  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and sizing lenses
        blocks:
          - type: paragraph
            body: >-
              Apex should be analyzed inside a narrow market: standardized or productized satellite buses for
              proliferated constellations, especially missions that value repeatability, configurable payload
              interfaces, and faster delivery over bespoke one-off spacecraft design. That is narrower than the generic
              “satellite bus market” used by analyst reports and much narrower than the overall satellite industry.
              SIA’s industry framework separates manufacturing from launch, services, and ground equipment, which
              matters here because many broad market figures include value pools that Apex does not directly monetize.
              Apex’s own materials consistently center bus procurement, not launch services or end-user broadband
              subscriptions.


              Multiple sizing lenses are therefore more useful than one TAM. At one end, broad analyst bus-market
              figures imply a 2026 market somewhere between roughly USD 14 billion and USD 53 billion, depending on
              methodology. At another end, smallsat market and launch-mix data show where demand is concentrating:
              smaller spacecraft dominate launch counts, and proliferated architectures are driving manufacturing
              intensity. The practical Apex SAM sits between those lenses: narrower than all satellite buses, but larger
              than today’s publicly disclosed contract set because Apex now spans LEO, MEO, GEO, and higher-power
              constellation buses.
