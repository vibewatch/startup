  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape segmentation: direct, adjacent, and substitute models'
        blocks:
          - type: paragraph
            body: >-
              Apex competes in a market where “competitor” can mean several different things, and separating those
              groups is essential. The direct set is made up of spacecraft-bus vendors selling standardized or
              configurable platforms into repeatable mission classes: York, Blue Canyon, Terran Orbital, and Rocket Lab
              fit best there. They all market spacecraft hardware and at least some version of repeatable or
              flight-proven production. Terran overlaps most clearly on mass range, while Rocket Lab stands out for
              full-stack breadth and disclosed commercial scale.


              A second group competes through adjacent models rather than bus-for-bus substitution. Loft offers hosted
              payload infrastructure, Astranis sells a vertically integrated operator model, and EnduroSat or Astro
              Digital emphasize turnkey service abstraction and speed. GomSpace is more relevant for smaller missions
              below Apex’s core mass range. A third group is the status quo: internal build or bespoke procurement from
              integrated primes. That option matters especially in defense and high-complexity missions. The net result
              is that Apex must beat not only other buses, but also buyers’ preference to outsource ownership, stay with
              a full-stack incumbent, or keep the work in-house.
