      - number: '3.3'
        title: Distribution power, switching cost, and pricing opacity
        blocks:
          - type: paragraph
            body: >-
              Competitive advantage in this category is not just about bus performance. York and Rocket Lab show that
              owning adjacent layers—ground services, launch logistics, mission control, and software—can shift GTM
              power materially. Those assets reduce integration burden for customers and can tilt deals toward providers
              with broader execution scope even if the bus itself is not categorically better. Apex’s KSAT partnership
              and 4iG relationship are therefore strategically important because they give the company more channel
              reach and more ways to look like a prime integrator without having to own every downstream asset directly.


              Switching cost works in Apex’s favor after award, but it also slows initial displacement. Once payload
              validation, spacecraft selection, launch integration, and operations architecture are locked, changing
              providers becomes expensive and risky. That means incumbent relationships matter, and new entrants need
              strong program-execution credibility to win. Public pricing does little to clarify the picture because
              Apex and most peers do not disclose list prices for bus platforms. As a result, buyer comparison remains
              qualitative: bus-only procurement versus integrated prime, hosted payload, or service abstraction, with
              price largely hidden inside negotiated contracts.
            claimRefs:
              - CP014
              - CP015
              - CP016
              - CP017
              - CP028
              - CP029
              - CP030
              - CP031
              - CP032
              - CP033
