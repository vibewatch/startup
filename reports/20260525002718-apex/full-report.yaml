      - number: '1.4'
        title: Milestones and caution flags
        blocks:
          - type: paragraph
            body: >-
              Apex’s milestone path is fast by aerospace standards. The company goes from founding in 2022 to a 2023
              factory opening, a first Aries mission path in early 2024, HALO selection in late 2024, a major Series C
              in 2025, and by late 2025 to both a unicorn-plus valuation claim and a self-funded defense demonstration
              under Project Shadow. The 2026 partner announcements with NEC, KSAT, and 4iG then extend the narrative
              from “domestic bus startup” toward “allied industrial and defense platform.” For a young company, that is
              a surprisingly broad milestone set.


              The cautionary counterweight is execution density. Satellite Today reported in April 2025 that production
              was still lagging demand. That is not fatal—in fact it is consistent with why customers and investors are
              willing to fund more capacity—but it is a reminder that the public growth narrative is still ahead of
              publicly demonstrated throughput. Likewise, Project Shadow is strategically impressive, yet the fact that
              Apex says it is funding the effort internally means the milestone adds capital burden as well as strategic
              cachet.


              The correct overview judgment is therefore balanced. Apex has legitimate evidence of product, factory,
              financing, government traction, and partner validation. At the same time, the public record still omits
              several scale anchors that later chapters would want to reuse automatically: current headcount, customer
              count, backlog quality, board composition, and revenue mix. The company overview can establish Apex as a
              credible, expanding spacecraft manufacturer, but it cannot make a clean claim that industrial scale has
              already been fully proven.
