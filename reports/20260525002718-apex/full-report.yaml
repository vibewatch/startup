  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Manufacturing Scale-Up, Supply Chain, and Launch Execution
        blocks:
          - type: paragraph
            body: >-
              Apex's biggest operational promise is also its biggest execution risk: it is trying to turn satellite-bus
              production into something closer to a software-enabled assembly line. Factory One markets more than
              100,000 square feet of integrated design, manufacturing, and test space with peak capacity above 200 buses
              per year, and Apex says Aries units are already in serial production with deliveries occurring monthly.
              Those claims matter because investor and customer expectations now assume short lead times, inventory
              availability, and the ability to support proliferated constellations rather than one-off missions.


              The problem is that the public operating evidence is still thinner than the ambition. TechCrunch's 2023
              factory profile described a much lower near-term target of 50/year by 2026, while Satellite Today later
              reported that production was lagging demand and that new capital was needed to build more inventory and
              bring constrained subsystems in-house. Apex's own employee profiles reinforce that the company is still
              institutionalizing the basics of high-rate production: the supply-chain team is still building sourcing
              strategies and supplier relationships, while quality personnel emphasize documentation, inspection, and
              process validation during an early-stage scale-up. That combination means the upside is real, but so is
              the risk that yield, cycle time, or component availability slips before Nova and Comet are broadly proven.


              Launch dependence is somewhat diversified but still external. Aries is listed as compatible with SpaceX,
              Rocket Lab, Ariane 6, PSLV, and others, while Nova references Falcon 9 and NSSL-style missions. That
              flexibility helps, but it does not remove schedule risk, launch integration complexity, or the
              customer-impacting consequences of delayed missions.
