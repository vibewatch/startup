      - number: '8.3'
        title: Scenario Framing and Valuation Sensitivity
        blocks:
          - type: paragraph
            body: >-
              Apex deserves scenario framing because the current mark depends far more on what the company becomes than
              on what it has publicly disclosed today. In the bull case, Factory One's advertised capacity begins to
              translate into visibly higher delivery cadence, government work expands beyond today's contract footprint,
              and partner announcements convert into monetized programs rather than remaining strategic headlines. In
              that world, the market can start to believe Apex is not just a bus supplier but a repeatable, high-rate
              manufacturing platform with defensible strategic value.


              The base case is more modest. Apex keeps winning programs and probably raises again, but the next step up
              in valuation is restrained because public disclosure remains thin and because the business still looks
              capital intensive. The bear case is also credible: a production miss, Project Shadow consuming capital
              without visible payback, an export-control or government-program problem, or simply a weaker financing
              market could push the next mark toward flat or down-round territory.


              That is why valuation sensitivity should focus on execution variables rather than on generic TAM.
              Delivered buses, monetized contracts, financing terms, and the absence of compliance surprises matter much
              more than broad market-growth charts. On public evidence alone, the range is wide and the return case is
              only modestly attractive unless execution clearly beats the narrative.
