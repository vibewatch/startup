              The purchase terms add audit rights, inspection access, warranty remedies, counterfeit protections, and
              quality-compliance obligations on suppliers. For government work, the subcontract rider is a meaningful
              signal: it explicitly references FAR and DFARS flowdowns, covered-defense-information safeguards, NIST
              assessment requirements, and export-controlled-item clauses. The bus-family pages also disclose AES-256
