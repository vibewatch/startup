        title: Bus family and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Apex frames the bus as a product, not a custom engineering project. The company groups its public offering
              into Aries, Nova, and Comet, then uses optional mission services to cover integration, launch, and
              operations around those buses. Aries is the most mature family: the LEO branch is flight-proven and
              serially produced, while GEO Aries extends the same product logic into an agile GEO mission set. Nova is
              the higher-power proliferated LEO workhorse, and Comet pushes the company into much larger, power-hungry
              missions such as D2D, SAR, orbital data centers, and interceptor-hosting concepts. NEC’s selection of
              Aries for a 2027 optical-communications demonstration is useful because it shows the bus can support a
              commercial communications payload, not only defense-facing missions. The public evidence therefore
              supports a real bus family map with configurable mission packaging, even if the outer edge of the roadmap
              remains thinly specified.
