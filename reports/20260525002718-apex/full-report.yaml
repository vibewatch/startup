              validation. The fetched set does not name AS9100, ISO 9001, or ISO 27001 certifications, and it does not
              disclose fleet-level reliability distributions. Apex’s privacy policy and site terms are also useful
              governance signals: they show the company has explicit rules for customer inquiries, product orders, and
              data handling on the public web surface. Those are not mission-assurance proofs, but they do reinforce
