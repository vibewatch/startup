companyProfile:
  summary: >-
    Apex was founded in 2022 by Ian Cinnamon and Max Benassi to address what they describe as the
    satellite-production bottleneck. The company sells configurable satellite buses and mission
    services rather than bespoke one-off spacecraft, and its public materials emphasize speed,
    inventory, vertical integration, and manufacturing scale. Factory One in Los Angeles anchors
    that narrative, with current public claims of more than 100,000 square feet and peak capacity
    above 200 satellites per year. By 2025-2026, Apex had assembled enough external proof to look
    materially beyond concept stage: Aries flight heritage, a $45.9M Space Force contract, HALO
    program eligibility, a Japan mission with NEC, and allied partnerships with KSAT and 4iG.
    Even so, Apex remains financially opaque in public. Investors can verify demand signals and
    industrial ambition, but not yet the operating metrics required for a clean late-stage private
    underwriting case.
  foundedDate: '2022-01-01'
  founders:
