      role: CEO and Co-Founder
      background: >-
        Previously sold dual-use AI company Synapse to Palantir and later framed Apex around the
        shortage of off-the-shelf spacecraft platforms for defense and commercial customers.
      claimRefs: [CO001, CO002]
    - name: Max Benassi
