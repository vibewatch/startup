  foundingLocation: "Los Angeles, California, USA"
  headquarters: "Los Angeles / Playa Vista, California, USA"
  productSummary: >-
    Apex's core product is a family of configurable satellite buses — including LEO Aries, GEO
    Aries, Nova, Comet Mini, and Comet XL — plus mission services around integration, deployment,
    and operations. Public specs describe payload support ranging from 150 kg for Aries to 3,000
    kg across the broader platform family, with Factory One and the Octopus operating system used
    to support serial production.
  customerFocus: >-
    Primary visible demand comes from defense and government buyers, allied-space missions, and
    commercial constellation builders that value short lead times and standardized buses. Publicly
    named or evidenced counterparties include the U.S. Space Force, NEC, KSAT, and 4iG/REMRED,
    although only some of those relationships constitute direct customer proof rather than channel
    or industrial-partner evidence.
  businessModel: >-
    Apex appears to monetize a bundle rather than a single SKU: satellite bus hardware, platform
    configuration and payload integration, mission services, and potentially partner-enabled
    operations support. Public evidence suggests contract and milestone-driven industrial revenue,
    not a pure recurring-software model.
  stage: "Late stage private (Series D, 2025)"
  fundingStatus: >-
    Apex has publicly disclosed a $95M Series B in 2024, a $200M Series C in April 2025, and a
    $200M Series D in September 2025 led by Interlagos at a valuation above $1B. Use of proceeds
    has consistently centered on vertical integration, inventory, factory expansion, and higher-rate
    production.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO005, CO006, CO009, CO013, CO014, CO016, CI001, CI002]
summary:
  headline: >-
    Apex has credible product, factory, and government-demand proof, but the public record still
    lacks backlog conversion, unit economics, and financing details; at the last disclosed >$1B
    mark, the right call is research-more with a stretched valuation stance.
