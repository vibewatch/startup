      - number: '1.4'
        title: 里程碑与警示信号
        blocks:
          - type: paragraph
            body: >-
              按航天标准看，Apex 的里程碑推进很快。公司 2022 年成立，2023 年开工厂，2024 年初走上首个 Aries 任务路径，2024 年末入选 HALO，2025 年完成重要 Series C，到
              2025 年末既有超过独角兽的估值说法，也有 Project Shadow 下自费防务演示。2026 年与 NEC、KSAT 和 4iG
              的伙伴公告，又把叙事从“国内卫星平台创业公司”延展到“盟友工业和防务平台”。对一家年轻公司来说，这组里程碑相当宽。


              需要制衡的是执行密度。Satellite Today 在 2025 年 4
              月报道称，生产仍落后于需求。这不是致命问题——实际上也解释了客户和投资人为什么愿意继续资助产能——但它提醒我们，公开增长叙事仍跑在公开验证的吞吐量前面。同样，Project Shadow 在战略上亮眼，但
              Apex 称该项目由内部出资，因此里程碑在增加战略光环的同时，也增加资本负担。


              因此，正确的概览判断应保持平衡。Apex
              拿出了关于产品、工厂、融资、政府牵引和伙伴验证的真实证据。与此同时，公开记录仍缺少后续章节本想直接复用的几个规模锚点：当前员工数、客户数、在手订单质量、董事会构成和收入结构。公司概况可以证明 Apex
              是一家可信且扩张中的航天器制造商，但不能干净地断言工业规模已被完全证明。
