  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入架构与变现
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，Apex 变现的是一组打包能力，而不是单一 SKU。公司展示标准化但可配置的卫星平台，再用任务服务包住这些平台，并通过 KSAT 等伙伴提供走向运营和数据交付的路径。这一点影响财务解读，因为
              Apex 不应被建模成纯硬件收入，也不是整齐的经常性软件业务。更可能的现实是里程碑和合同驱动：客户为平台、特定任务集成，以及与部署和运营挂钩的服务组合付费。


              眼下最大的限制是定价不透明。Apex 销售“透明定价”和配置包，但没有公布 Aries、Nova 或 Comet 标价。因此，公开规格只能作为定价代理，不能代表实际
              ASP。更重的载荷包络或更完整的服务包，几乎必然会改变合同层面的经济性。因此，投资者不应硬套 SaaS 指标，也不应假设所有卫星平台都使用一个标准
              ASP。公开材料支持的是可配置工业合同模式，而不是明码标价的产品目录。


              从尽调角度看，收入质量因此好坏参半。积极面是，美国太空军和盟友伙伴项目意味着公司正在追求可能体量大、且具有战略黏性的合同。消极面是，公开记录没有显示收入中硬件、服务、防务或商业各占多少，也没有说明收入是在交付时确认、随任务里程碑确认，还是通过更长服务期确认。在这些机制披露之前，最干净的结论是：Apex
              有可信需求渠道，但变现质量仍不透明。
