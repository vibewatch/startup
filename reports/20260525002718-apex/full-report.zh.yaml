      - CV040
      - CV041
      - CV044
      - CV045
      - CV056
  - id: FV002
    title: 估值敏感性
    type: bar
    summary: 指示性估值结果更取决于执行和融资质量，而不是 TAM 叙事。
    data:
      items:
        - label: 悲观：平轮 / 下轮融资
          value: 700
        - label: 悲观：Shadow 烧钱 + 延期
          value: 900
        - label: 基准：合同稳定转化
          value: 1400
        - label: 基准：融资条款更干净
          value: 1800
        - label: 乐观：国防后续订单 + 交付证明
          value: 2600
        - label: 乐观：交付证明 + 伙伴变现
          value: 3500
    claimRefs:
      - CV044
      - CV047
      - CV048
      - CV049
      - CV050
      - CV051
  - id: FV003
    title: 估值 / 回报区间
    type: range
    summary: 仅靠公开信息做承销，区间仍然很宽：当前价格已知，但当前经济指标未知。
    data:
      items:
        - label: 今日指示性估值（USD M）
          low: 800
          mid: 1200
          high: 1800
        - label: 下一轮融资估值标记（USD M）
          low: 700
          mid: 1600
          high: 2800
        - label: 相对 >$1B 轮次的总 MOIC（x）
          low: 0.6
          mid: 1.4
          high: 2.8
        - label: 距流动性事件年数
          low: 3
          mid: 5
          high: 7
    approximationNotes: 区间是在披露有限下划出的情景带，不是完整公司预测模型跑出的结果。
    claimRefs:
      - CV044
      - CV048
      - CV049
      - CV051
  - id: FV004
    title: 投资 KPI
    type: kpi
    summary: Apex 在需求证据和产品宽度上得分较高，但公开经济数据和估值支撑偏弱。
    data:
      items:
        - label: 需求证据
          value: 7
          detail: 国防、日本和服务领域有多个可见项目和合作伙伴
        - label: 产品宽度
          value: 7
          detail: 多轨道卫星平台系列，路线图在扩宽
        - label: 制造证据
          value: 5
          detail: 工厂叙事强，但公开交付证据仍有限
        - label: 财务披露
          value: 2
          detail: 未公开收入、利润率、烧钱速度或优先股堆叠
        - label: 可比公司支撑
          value: 4
          detail: 公开可比公司有方向参考价值，但太分散，难以精确
        - label: 风险 / 合规
          value: 3
          detail: Project Shadow 和出口管制负担带来实质下行
        - label: 证据质量
          value: 4
          detail: 叙事中过多内容来自自我发布，而不是审计材料
    claimRefs:
      - CV035
      - CV037
      - CV040
      - CV041
      - CV050
      - CV053
      - CV058
