        - 2025 年 9 月投后估值 >$1B
        - Apex 最直接的市场出清价格
        - 该轮未同步披露收入、利润率或优先股堆叠
      - - Rocket Lab
        - 市值 / TTM 收入
        - $78.58B 市值 / $0.60B TTM 收入（~131x）
        - 显示公开市场对航天平台叙事热情的上限
        - 发射 + 航天系统组合叠加极端倍数，不能干净类比 Apex
      - - Redwire
        - 市值 / TTM 收入
        - $3.47B 市值 / $0.33B TTM 收入（~10.5x）
        - 更接近的上市硬件与服务参照
        - 披露和多元化程度仍远高于 Apex
      - - Terran Orbital 出售
        - 战略收购价值
        - 2024 年被 Lockheed Martin 以约 $450M 收购
        - 可作为航天硬件平台的下行情景锚点
        - 所有权和交易背景不同于私人成长期融资
      - - 小卫星展望
        - 需求参照
        - 2024-2033 年预计约 14,000 颗小卫星；政府驱动占比上升
        - 支撑品类需求和战略相关性
        - 品类需求不等于 Apex 能捕获有利润的收入
      - - 卫星平台市场报告
        - 自上而下市场规模
        - $13.99B 到 $17.73B（2030 年）；$53.03B 到 $94.50B（2034 年）
        - 确认平台品类本身规模大且在增长
        - 自上而下市场规模太宽，无法给私人公司精确定价
    enumerationScope:
      coverage: partial
      basis: >-
        Selected public reference points spanning Apex's latest private round, listed peers, a cautionary M&A outcome,
        and market-growth context; not an exhaustive comp set.
    notes: 可比证据只用作合理性区间。表格刻意混合多类对象，因为没有一家上市公司能匹配 Apex 的阶段、披露水平和产品范围。
