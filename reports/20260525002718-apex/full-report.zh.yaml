      - number: '2.2'
        title: 买家分层与采用路径
        blocks:
          - type: paragraph
            body: >-
              Apex 的买家是机构，而不是消费者。本轮证据指向三类尤其相关的群体：国家安全或主权项目、需要专用航天器容量的国际电信或网络项目，以及希望比自研周期更快拿到可配置平台的技术演示或星座建设方。NEC 的 2027
              年光通信演示任务就是第三类的好例子：买家不是宽带容量的终端用户，而是采购平台来验证下一代星座技术的任务所有方。


              预算也掌握在能承担航天器资本开支和多步骤任务执行的机构手里。Apex 自己的 “Your Mission”
              页面说得很清楚，采购不只是硬件交易；选定卫星平台之后，还要进入载荷验证、发射集成、任务运营和合规工作。相比购买独立子系统，这会拉长采用路径，但也会在授标后提高切换成本。KSAT
              的伙伴关系重要，因为它降低了缺少自有地面或运营栈的客户的一大采用障碍，让 Apex 更像端到端执行伙伴，同时不改变初始采购决策仍由卫星平台牵引这一事实。
