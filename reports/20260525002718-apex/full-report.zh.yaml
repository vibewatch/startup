  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 制造扩张、供应链与发射执行
        blocks:
          - type: paragraph
            body: >-
              Apex 最大的运营承诺也是最大的执行风险：它试图把卫星平台生产变成更接近软件赋能装配线的东西。Factory One 销售超过 100,000 平方英尺的集成设计、制造和测试空间，峰值产能超过每年 200
              个卫星平台；Apex 还称 Aries 单元已经连续生产，并按月交付。这些说法重要，因为投资者和客户预期现在已经假设短交付周期、库存可得性，以及支持增殖星座而不是一次性任务的能力。


              问题在于，公开运营证据仍比野心薄。TechCrunch 的 2023 年工厂画像描述了一个低得多的近期目标：到 2026 年达到每年 50 个；Satellite Today
              后来报道，生产落后于需求，公司需要新资本来建立更多库存，并把受限子系统内制化。Apex
              自己的员工画像也强化了一点：公司仍在制度化高节拍生产的基本功。供应链团队还在搭建采购策略和供应商关系，质量人员则强调早期扩张中的文档、检查和流程验证。这个组合意味着上行空间真实存在，但在 Nova 和 Comet
              被广泛证明之前，良率、周期时间或组件可得性滑坡的风险也真实存在。


              发射依赖有所分散，但仍是外部依赖。Aries 被列为兼容 SpaceX、Rocket Lab、Ariane 6、PSLV 等，Nova 则提到 Falcon 9 和 NSSL
              式任务。这种灵活性有帮助，但不能消除进度风险、发射集成复杂度，或任务延误对客户造成的后果。
