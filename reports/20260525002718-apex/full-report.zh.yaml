      - number: '1.2'
        title: 领导层、治理与合规
        blocks:
          - type: paragraph
            body: >-
              Apex 仍由创始人带队。Ian Cinnamon 是公司在融资、国家安全定位和市场进入叙事中的公开面孔，Max Benassi 则仍是平台愿景背后的技术联合创始人。Cinnamon
              的履历解释了这套策略：他曾将一家军民两用 AI 公司卖给 Palantir，并称 Apex 源于他接触卫星客户时发现他们不满意现有平台选项。这一背景叠加公司的防务叙事，使创始人判断对投资案例格外关键。


              公开可见的运营纵深在改善，但披露仍薄。Apex 突出 Jack Fitzharris 负责供应链，以及 Holly Coates 负责法律、出口合规和诉讼事务。这些履历有用，因为它们显示 Apex
              正在搭建真实的采购和合规能力，而规模化制造和防务工作都离不开这些能力。不过，公开记录没有给出完整高管名单、当前董事会构成或股权结构图。Payload 报道称，Interlagos 合伙人 Tom Ochinero
              在 Series D 后加入董事会，但这是公开信息包里唯一清晰露出的董事会变动。


              法律文件让执行复杂度更落地。Apex 的政府分包附加条款把 FAR 和 DFARS 下传条款纳入供应商采购订单；采购条款则保留广泛审计权、45 天付款条款和 24
              个月质保预期。对投资者而言，这些文件重要，因为它们说明公司不只在卖卫星平台，还在搭建一套能支撑面向防务采购和质量纪律的运营系统。它们也说明，政府切入口带来的不只是标题式机会，还包括义务和供应商管理开销。
