      - number: '3.3'
        title: 分销能力、切换成本与定价不透明
        blocks:
          - type: paragraph
            body: >-
              这个品类的竞争优势不只是卫星平台性能。York 和 Rocket Lab
              说明，拥有相邻层——地面服务、发射物流、任务控制和软件——可以实质改变商业化能力。这些资产会降低客户集成负担，并把交易推向执行范围更宽的供应商，即便卫星平台本身并非绝对更好。因此，Apex 的 KSAT
              伙伴关系和 4iG 关系具有战略意义，因为它们让公司拥有更广渠道触达，也能在不直接拥有所有下游资产的情况下，更像一个主集成商。


              授标之后，切换成本有利于
              Apex，但也会减慢早期替换。一旦载荷验证、航天器选择、发射集成和运营架构锁定，更换供应商就昂贵且高风险。这意味着既有供应商关系重要，新进入者需要强项目执行可信度才能赢单。公开定价几乎无法澄清局面，因为 Apex
              和多数同行都不披露卫星平台标价。因此，买方比较仍偏定性：只买卫星平台，对比综合主承包、托管载荷或服务抽象；价格大多藏在协商合同里。
