companyProfile:
  summary: >-
    Apex 由 Ian Cinnamon 和 Max Benassi 于 2022
    年创立，目标是解决他们所说的卫星生产瓶颈。公司销售可配置卫星平台和任务服务，而不是一次性定制航天器；公开材料反复强调速度、库存、垂直整合和制造规模。洛杉矶的 Factory One 是叙事核心，公司目前公开称总面积超过
    100,000 平方英尺，峰值产能超过每年 200 颗卫星。到 2025-2026 年，Apex 已拿出足够外部证明，明显越过概念阶段：Aries 飞行履历、$45.9M 美国太空军合同、HALO 项目资格、与 NEC
    的日本任务，以及与 KSAT 和 4iG 的盟友合作。即便如此，Apex 在公开层面仍财务不透明。投资者可以验证需求信号和工业化野心，但还看不到干净完成后期私募承销所需的运营指标。
