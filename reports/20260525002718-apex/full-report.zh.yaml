              可能帮助未来转化，但没有披露渠道经济性、来源预订额或重复订单行为。反向覆盖是，更广小卫星市场正变得更受政府驱动、更容易整合。这会提高 Apex
              赢得有意义政府业务的概率，但也会提高集中度风险，因为政府项目带来更重的采购摩擦、受保护信息控制和出口合规负担。Apex
              看起来意识到了这一点，但证据基础在采购准备度上仍强于持久经常性收入。即便公司的客户侧法律表面也是分母很轻：隐私政策和网站条款确认 Apex
              通过成文规则处理订单和咨询，但这些页面仍没有透露账户数、续约行为或集中度。
