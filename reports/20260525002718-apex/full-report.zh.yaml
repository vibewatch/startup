              million 授标，持续到 2032 年，用于多轨道任务。HALO 相关但更弱，因为它说明 Apex 进入一个采购池，而不是赢得已入账订单。Aries
              首飞也重要，但它证明的是履历和未具名客户载荷支持，而不是公开买家名单。
