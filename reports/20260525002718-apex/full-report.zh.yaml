      - number: '5.2'
        title: 架构与制造系统
        blocks:
          - type: paragraph
            body: >-
              公开架构有两层。一层是可复用的卫星平台骨架：标准化电力、数据、热控、推进、通信和 GNC 接口，可按任务需求配置。另一层是支撑这套骨架的生产系统。Factory One 被定位成软件赋能装配线，Octopus
              则被描述为通过 MES 和 QMS 工作流连接工程、制造和运营的操作层。Virtual Flatsat 和 Bus Emulator
              工具重要，因为它们把载荷和地面系统集成工作提前到经典一次性卫星平台采购之前。平台页、工厂页和任务服务页合在一起，描述了一套连贯的运营架构：客户选择基础卫星平台、选择选项包、验证接口、集成载荷，然后可以外包发射支持、LEOP
              和任务运营。这比泛泛的“全服务”航天文案具体得多。
