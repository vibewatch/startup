  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 卫星平台家族与客户工作流
        blocks:
          - type: paragraph
            body: >-
              Apex 把卫星平台当成产品，而不是定制工程项目。公司把公开产品分为 Aries、Nova 和 Comet，再用可选任务服务覆盖这些平台周边的集成、发射和运营。Aries 是最成熟的家族：LEO
              分支已有飞行验证并连续生产，GEO Aries 则把同一套产品逻辑延伸到敏捷 GEO 任务。Nova 是更高功率增殖 LEO 的主力，Comet 则把公司推向
              D2D、SAR、轨道数据中心和拦截器搭载概念等大得多、也更吃功率的任务。NEC 选择 Aries 执行 2027
              年光通信演示很有用，因为它显示该卫星平台可以支持商业通信载荷，而不只是面向防务任务。因此，公开证据支持一张真实的卫星平台家族地图和可配置任务打包，尽管路线图最外沿仍披露较薄。
