            body: >-
              公开层面对留存和集中度的可见度很差。已抓取证据没有披露客户数、NRR、GRR、流失率、续约率、头部客户占比或在手订单集中度。最好的公开期限代理是美国太空军合同到 2032 年的期限，以及 NEC
