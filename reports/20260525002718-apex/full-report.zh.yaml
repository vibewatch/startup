      - number: '3.4'
        title: 护城河耐久性与反向竞争证据
        blocks:
          - type: paragraph
            body: >-
              Apex 的最佳叙事可信，但仍在成熟中。制造规模、多轨道产品家族、近期融资和真实政府需求信号都重要。HALO 参与和美国太空军授标意味着 Apex 有防务牵引证据，而不只是野心。KSAT 和 4iG
              说明，公司理解渠道和本地化可以与硬件一起成为护城河。这些都是有意义的优势。


              反向证据同样重要。Blue Canyon 的履历、Terran Orbital 的质量范围重叠、York 的集成控制、Rocket Lab 的上市公司规模，以及 EnduroSat 的速度，都挑战了 Apex
              拥有独一无二制造或集成优势的说法。尤其是当买家想要一家有披露规模和融资能力的主承包商时，Rocket Lab 看起来是最强商业对手。与此同时，缺少公开定价、成本或胜率数据，使得外部很难证明 Apex
              拥有持久经济护城河，而不只是一个有前景的战略位置。平衡结论是：Apex 有差异化细分位置，但护城河耐久性仍取决于已交付吞吐量、伙伴杠杆，以及对资本充足对手的执行。
