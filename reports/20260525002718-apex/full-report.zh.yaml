      - CR016
      - CR024
      - CR025
      - CR042
  - id: FR003
    title: 依赖图
    type: dag
    summary: Apex 位于一张依赖网络的中心，连接政府买家、发射服务商、合作运营方、国际项目和受监管供应商。
    data:
      nodes:
        - id: d1
