      - number: '5.3'
        title: 可靠性、质量与合规控制
        blocks:
          - type: paragraph
            body: >-
              Apex 披露的运营控制比许多年轻硬件公司更多。Factory One 把完整功能、性能、振动和极性测试列为 AIT 的一部分，质量检验员和供应链 Q&A
              页面也强化了对文档、过程控制和供应商管理的重视。采购条款向供应商施加审计权、检查准入、质保补救、防伪保护和质量合规义务。对政府工作而言，分包附加条款是有意义的信号：它明确提到 FAR 和 DFARS
              下传、受保护防务信息保障、NIST 评估要求和出口管制物项条款。卫星平台家族页面还披露了 AES-256 和 NSA Type 1 选项。不过，公开证据在流程架构上强于第三方验证。已抓取材料没有点名
              AS9100、ISO 9001 或 ISO 27001 认证，也没有披露舰队级可靠性分布。Apex
              的隐私政策和网站条款也是有用的治理信号：它们显示，公司对客户咨询、产品订单和公开网站表面的数据处理有明确规则。这些不是任务保障证明，但确实说明 Apex 正在规范面向客户的法律流程，而不是完全靠临时条款运转。
