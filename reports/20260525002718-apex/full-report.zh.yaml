      - number: '7.3'
        title: 政府、伙伴与融资依赖
        blocks:
          - type: paragraph
            body: >-
              Apex 的近期需求叙事可信，但也很集中。最强的公开锚点包括 $45.9 million Space Force 合同、未来 SDA 原型工作的 HALO 资格、日本 NEC 技术演示任务、KSAT
              端到端服务合作，以及探索中的 4iG/REMRED 欧洲计划。这些信号有分量，因为它们说明 Apex
              已经越过单一演示卫星平台阶段，开始获得防务、盟友和任务服务交易对手的关注。它们也暴露出，公司当前画像仍高度依赖少数具名项目和战略伙伴。


              这种集中度又与融资风险交织。Series C 和 Series D 在大约五个月内合计注入 $400
              million，两轮融资都围绕更大产能、更多库存、更强垂直整合和更快交付展开。从一个角度看，这是利好，因为它说明投资者看到了需求，Apex 也能以超过 $1 billion
              的估值吸引资本。从另一个角度看，这也有风险，因为在公开运营指标尚未证明稳定毛利率或成熟交付节奏之前，资金已经被用于营运资本、供应商控制、相邻设施和产品路线图扩张。


              伙伴关系同样利弊并存。KSAT 让 Apex 对客户更有用，NEC 验证国际需求，4iG/REMRED
              最终可能把生产版图拓到欧洲。但每段关系都会增加集成、出口筛查、执行和谈判层级，管理层必须处理好。当前公开证据支持增长动能，却不能证明 Apex 已经摆脱集中度或伙伴执行风险。
