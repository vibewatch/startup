  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与规模测算口径
        blocks:
          - type: paragraph
            body: >-
              分析 Apex
              时，市场边界应收窄：面向增殖星座的标准化或产品化卫星平台，尤其是那些相比一次性定制航天器设计，更重视可重复性、可配置载荷接口和更快交付的任务。这比分析报告常用的泛化“卫星平台市场”更窄，也远窄于整体卫星产业。SIA
              的产业框架把制造与发射、服务和地面设备分开，这一点在这里重要，因为许多宽口径市场数字包含 Apex 并不直接变现的价值池。Apex 自身材料也始终围绕卫星平台采购，而不是发射服务或终端用户宽带订阅。


              因此，多组规模口径比单一 TAM 更有用。一端是宽口径分析师卫星平台市场数据，显示 2026 年市场大约在 USD 14 billion 到 USD 53 billion
              之间，取决于方法论。另一端，小卫星市场和发射结构数据说明需求正向哪里集中：更小航天器主导发射数量，增殖式架构推高制造强度。Apex 实际 SAM
              位于这些口径之间：比所有卫星平台更窄，但大于今天公开披露的合同集合，因为 Apex 现在覆盖 LEO、MEO、GEO 和更高功率星座平台。
