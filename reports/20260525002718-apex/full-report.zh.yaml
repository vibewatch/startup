      - number: '7.4'
        title: 缓释措施、监测指标与打破投资逻辑的触发点
        blocks:
          - type: paragraph
            body: >-
              Apex 确实有实质性缓释措施。公开来源指向专门建设的工厂、接入 MES 的作业指令、内部环境测试、双源供应努力、更多组件库存、Phase Four
              推进技术、多种发射载具选择，以及明确嵌入运营和供应链的法务职能。一家资本密集型制造商进入防务相邻项目时，投资者希望看到的正是这些控制手段。


              问题在成熟度，而不是完全没有控制。大多数缓释证据来自公司自述，并未由客户、监管机构或独立评估方审计。因此，本章承销的正确方式不是假设缓释措施会失败，而是要求可观察指标来证明它们是否有效。例子包括月度交付节奏、新设施入驻、供应商连续性、质量逃逸、发射延期、合同修改，以及任何出口管制或网络执法迹象。Project
              Shadow 需要单独列入观察清单，因为如果那里出现延误或事故，就不会只是一个小型 R&D 问题；它会同时影响 Apex 的防务可信度、发射可靠性叙事和融资姿态。


              实际含义是，Apex
              只有在持续监测纪律下才具备可投性。如果生产节奏主张继续转化为已交付卫星平台，如果防务项目扩张而没有合规事件，如果公司能在不弱化条款的情况下支持营运资本，剩余风险可以下行。如果这些指标恶化，就应迅速重新承销投资逻辑，而不是只靠叙事来防守。
