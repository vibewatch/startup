  - id: TV005
    title: 投资逻辑破裂与终止触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 交付爬坡落空
        - 未来 12-18 个月，已宣布的规模化叙事没有转化为可见的更高交付量
        - 制造逻辑从规模资产变成产能表演
        - 暂停，并按更低倍数区间重新承销
      - - 政府项目延误
        - Space Force 或 Shadow 相关时间表显著后延，或项目范围缩小
        - 削弱材料中最强的战略需求证明
        - 从继续研究转为回避，直到需求论证重建
      - - 合作伙伴未变现
        - NEC、KSAT 和 4iG 这类公告没有变成已签约或经常性项目
        - 将目前的伙伴关系证据重新归类为信号，而非变现
        - 下调上行假设，压缩基准情景区间
      - - 合规事件
        - 任何出口管制、网络安全或政府合规问题公开曝光
        - 同时冲击防务可信度、伙伴执行和融资渠道
        - 视为投资逻辑破裂，直至完成补救
      - - 下一轮融资估值不高于上一轮
        - 平轮或降估值融资，或优先权条款明显加重
        - 说明运营证明没有跟上叙事
        - 估值视角重置为保护下行，而不是捕捉上行
      - - Shadow 烧钱但无回报
        - 内部资金投入扩大，却看不到有资金支持的后续需求
        - 把可选性变成资产负债表压力
        - 更激进地折扣战略上行和需求证明
    notes: 触发因素之所以入选，是因为至少可以通过公开证据部分监测。真正触发时，应强制重新承销，而不是为叙事辩护。
    claimRefs:
      - CV013
      - CV050
      - CV054
      - CV055
      - CV056
      - CV061
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 为何重要
      - 责任方或尽调路径
    rows:
      - - 按客户和项目拆分的在手订单
        - 已签约在手订单金额、取消权和里程碑排期均未公开
        - 需要把公告数量和可变现需求质量拆开
        - 索取合同级在手订单排期和带修订标记的客户条款
      - - 实际定价与收入确认
        - 没有公开的实际 ASP，或按项目类型划分的收入确认政策
        - 需要把产品叙事转成经济模型
        - 索取项目级收入瀑布和会计处理样本
      - - 毛利率和营运资本画像
        - 成本、利润率、库存周转或定金数据均未公开
        - 决定产品化是否真的带来更优经济性
        - 索取标准成本模型、BOM 趋势、库存周转和付款条款
      - - 烧钱速度、现金跑道和下一轮融资触发点
        - 月度烧钱、现金余额或董事会融资阈值均未公开
        - 资本强度是本章最核心的下行变量
        - 索取最新现金桥、现金跑道情景和融资计划
      - - 股权结构表和优先股堆叠
        - 清算优先权、参与权或稀释压力均未公开
        - 不了解普通股上方的堆叠，就无法建模回报
        - 索取股权结构表、章程条款和最新轮次文件
      - - Project Shadow 经济性与合规证明
        - 报销安排、DDTC 状态或独立网络安全 / 合规证据均未公开
        - Shadow 可能带来战略上行，也可能变成昂贵干扰
        - 索取项目预算、预期后续路径和合规认证
    notes: 这些要求按其改变推荐结论的幅度排序，而不是按获取难度排序。第 1-5 项是把公开好奇心转成可投资确信所必需的证据。
    claimRefs:
      - CV059
      - CV060
      - CV061
      - CV062
      - CV063
