  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 决策链条从真实需求证据和平台宽度出发，穿过经济数据缺失和合规风险，最终落到继续研究的建议。
    data:
      nodes:
        - id: n1
          label: 需求证据
          type: input
          detail: Space Force、NEC、KSAT 与 4iG
        - id: n2
          label: 平台宽度
          type: input
          detail: 多轨道卫星平台，路线图在扩展
        - id: n3
          label: 品类顺风
          type: input
          detail: 小卫星 / 卫星平台市场规模大，政府驱动越来越强
        - id: n4
          label: 经济数据不透明
          type: risk
          detail: 未公开收入、利润率、烧钱速度或优先股堆叠
        - id: n5
          label: 可比公司分散
          type: risk
          detail: Rocket Lab、Redwire、Terran 差异太大，难以精确估值
        - id: n6
          label: 项目 / 合规风险
          type: risk
          detail: Shadow 自筹资金、DDTC/SAM 负担、政府敞口
        - id: n7
          label: 估值立场
          type: intermediate
          detail: 接近上一轮估值时合理到偏高
        - id: n8
          label: 建议
          type: output
          detail: 继续研究 / 价格敏感
      edges:
        - from: n1
          to: n7
        - from: n2
          to: n7
        - from: n3
          to: n7
        - from: n4
          to: n7
        - from: n5
          to: n7
        - from: n6
          to: n7
        - from: n7
          to: n8
    claimRefs:
