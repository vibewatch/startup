    title: 风险传导图
    type: dag
    summary: Apex 最具破坏性的风险会先沿交付节奏、项目信任和融资渠道传导，之后才表现为简单的收入不达标。
    data:
      nodes:
        - id: r1
          label: 扩产不达标
          detail: 良率或吞吐低于预期
          type: risk
        - id: r2
          label: 合规事件
          detail: 出口、网络或 CUI 问题
          type: risk
        - id: r3
          label: Project Shadow 受挫
          detail: 进度或任务失败
          type: risk
        - id: r4
          label: 项目降级
          detail: 国防范围缩减或停工
          type: risk
        - id: r5
          label: 交付可信度
          detail: 客户对时间线的信心
          type: impact
        - id: r6
          label: 利润率 / 营运资本
          detail: 库存和返工负担
          type: impact
        - id: r7
          label: 融资通道
          detail: 融资或守住条款的能力
          type: impact
        - id: r8
          label: 战略需求
          detail: 政府和盟友需求
          type: impact
        - id: r9
          label: 估值压力
          detail: 折现率更高，入场条款更弱
          type: output
      edges:
        - from: r1
          to: r5
        - from: r1
          to: r6
        - from: r2
          to: r5
        - from: r2
          to: r7
        - from: r3
          to: r8
        - from: r3
          to: r7
        - from: r4
          to: r8
        - from: r4
          to: r7
        - from: r5
          to: r9
        - from: r6
          to: r9
        - from: r7
          to: r9
        - from: r8
          to: r9
