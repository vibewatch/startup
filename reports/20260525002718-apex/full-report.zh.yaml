      - number: '8.3'
        title: 情景框架与估值敏感性
        blocks:
          - type: paragraph
            body: >-
              Apex 需要情景框架，因为当前估值更多取决于公司会变成什么，而不是它今天已经公开披露了什么。乐观情景下，Factory One
              宣称的产能开始转化为可见的更高交付节奏，政府工作扩展到今天的合同足迹之外，伙伴公告也从战略头条转化为可变现项目。在这种情景里，市场会开始相信 Apex
              不只是卫星平台供应商，而是一个可重复、高节奏、具备可防守战略价值的制造平台。


              基准情景更克制。Apex 继续赢得项目，也可能再次融资，但下一步估值上行会受到限制，因为公开披露仍很薄，业务看起来仍然资本密集。悲观情景同样可信：生产失误、Project Shadow
              消耗资本却没有可见回报、出口管制或政府项目问题，或融资市场单纯转弱，都可能把下一轮估值推向持平或 down-round 区间。


              因此，估值敏感性应聚焦执行变量，而不是泛泛的
              TAM。已交付卫星平台、可变现合同、融资条款，以及没有合规意外，比宽泛的市场增长图表重要得多。仅基于公开证据，估值区间很宽；除非执行明显超过叙事，否则回报案例只有中等吸引力。
