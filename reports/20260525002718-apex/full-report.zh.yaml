  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 证据
      - 什么会改变判断
    rows:
      - - 投资逻辑：作为私人卫星平台制造商，Apex 可见需求证据异常宽
        - Space Force 合同、NEC 任务、KSAT 服务包，以及 4iG 对欧洲制造的兴趣
        - 如果这些项目无法转化为交付或复购，证据会退回公告层面。
      - - 投资逻辑：产品化平台模式可能带来速度和战略价值
        - Factory One 产能主张、多轨道平台，以及超出 Aries 的扩展路线图
        - 如果交付节奏落后于宣称产能，规模故事就无法继续叠加。
      - - 投资逻辑：投资人胃口到 2025 年末仍然强劲
        - 连续两轮 $200M 融资，以及估值 >$1B 的 Series D
        - 如果下一轮平轮或下轮，市场会发出信号：资本通道并不耐久。
      - - 反向逻辑：公开经济性仍不透明
        - 未公开订单积压、收入、毛利率、烧钱速度、现金跑道或优先股堆叠
        - 清晰披露这些项目，会显著收窄估值区间。
      - - 反向逻辑：公开可比公司并不明确支持激进定价
        - Rocket Lab 和 Redwire 的隐含倍数差异极大，而 Terran Orbital 显示了低端结果
        - 若要显著高于上一轮出价，Apex 需要更清晰的增长经济性。
      - - 反向逻辑：Project Shadow 和合规创造下行风险的速度可能快于创造价值
        - 自筹资金的国防演示、CUI 密集的政府环境，以及缺失的 DDTC 专项证据
        - 如果 Shadow 拿到有资金支持的后续项目，且合规证据干净，下行折价可以收窄。
    notes: 每行都写成可证伪条件，而非永久身份标签。对一家资本密集型私人制造商来说，这才是合适框架。
