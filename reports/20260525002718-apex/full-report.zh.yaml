      - number: '4.3'
        title: 资本充足性与对标规模
        blocks:
          - type: paragraph
            body: >-
              Apex 的融资节奏强烈说明，公司仍处在资本形成阶段，而不是自我融资阶段。Series C 支持垂直整合和库存；Series D 支持更多场地、更多自制战略组件和更高任务集成能力。Payload 报道称，在
              Interlagos 接触之前管理层并未主动融资，这一点有帮助——它降低了 Series D 是救援轮的概率——但不改变基本事实：Apex 仍在吸收大量资本来扩大硬件运营。


              Project Shadow 让这一点更尖锐。按 Apex
              自己说法，这个防务演示由公司“自掏腰包”出资。从战略上看，这可能合理：它创造防务切入口并展示速度。从财务上看，这意味着资本正投入内部发起项目，而报销和下游变现仍不可见。已披露的美国太空军合同有助于作为需求信号，但其金额和交付窗口仍过宽，无法解决近期烧钱问题。


              上市公司可比对象主要作为披露基准有用。Rocket Lab 和 Redwire 都定期发布 SEC 文件，第三方市场数据页面也显示其收入和市值快照。Apex
              今天没有类似公开收入、利润率或现金披露。这意味着可比公司可以框定一家已规模化上市太空硬件企业的大致外边界，但不能替代 Apex 特定的私营数据。最可辩护的公开结论是：Apex
              有实质资本可得性和可信需求，但财务披露不足，无法形成干净承销案例。
