      - number: '8.2'
        title: 估值背景与可比证据
        blocks:
          - type: paragraph
            body: >-
              Apex 的 Series D 是唯一直接公开估值，因此比任何合成倍数都更应成为分析锚点。Series D 估值超过 $1 billion，说明成熟投资者愿意把 Apex
              定价为有规模的私营太空制造平台，但这一估值对应的公开运营披露非常有限。因此，公开可比公司只能用来做合理性校验。校验结果噪音很大：Rocket Lab 的市值 / 收入比极高，而 Redwire
              低得多。这个价差说明，公开太空公司估值对叙事和执行高度敏感，不能机械平移。


              公开下行锚点更令人警醒。Research and Markets 提到，Lockheed Martin 在 2024 年以大约 $450 million 收购 Terran
              Orbital。这不是完美可比——所有权和市场背景不同——但它提醒我们，如果执行或市场条件令人失望，平台型业务的成交价可能远低于创投式愿景定价。与此同时，Novaspace
              以政府需求驱动的市场展望说明品类需求真实存在，但盈利能力和供给过剩压力仍未解决。


              合在一起，可比集合只能支持一个宽区间，不能给出精确点位。Apex
              可以证明自己比陷入困境或规模不足的平台业务更值钱，因为它有更强的可见需求证明。但仅凭公开证据，它不能证明自己相对上一轮应享有大幅溢价，因为收入、毛利率和订单质量仍未披露。
