      - number: '4.2'
        title: 单位经济性、生产与营运资本
        blocks:
          - type: paragraph
            body: >-
              Apex 的单位经济性叙事由制造、库存和采购主导，而不是传统获客指标。Factory One
              被定位成提前建造的生产系统，让卫星平台和组件保持可得，以便更快交付。这在商业上可能很有力量，但意味着合同转为收入之前，现金已经被占用。公司自己的制造语言——超前建设、维持库存、垂直整合和连续生产——已经指向一个重营运资本模式，更不用说发射和任务集成成本。


              公开吞吐量证据方向上令人鼓舞，但仍不完整。TechCrunch 报道称，2023 年场地对应的年产目标是 50 个平台；Satellite Today 后来引用 2025
              年每月约十几个卫星平台的说法，同时也指出生产落后于需求；官方材料现在称最大产能超过每年 200
              颗卫星。这些数字与其说互相矛盾，不如说是同一爬坡过程的不同观察口径。不过，它们确实意味着投资者应区分峰值状态产能、当前月度产出和客户可用交付节奏。


              利润率质量很可能同样取决于采购和合规执行，而不只是产量。Jack Fitzharris 明确把供应商关系与定价、可靠交付挂钩，Satellite Today 则强调把更多组件和子系统内制化的成本。Apex
              的采购条款和防务分包附加条款显示，这家公司正在规范应付账款纪律、审计、质保、网络安全和国内来源约束。这些控制可以支撑质量和交付，但也增加复杂度和成本。因此，公开记录对资本效率叙事的支持较弱；对资本密集型工业爬坡叙事的支持很强。
