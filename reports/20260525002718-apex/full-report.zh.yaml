    title: Apex 公司里程碑时间线
    type: timeline
    summary: Apex 从 2022 年创立走向 2026 年盟友市场和防务扩张，期间完成多轮融资。
    data:
      items:
        - date: '2022'
          label: 公司创立
          details: Ian Cinnamon 和 Max Benassi 创立 Apex，想把卫星平台制造产品化。
          tone: positive
          claimRefs:
            - CO001
            - CO004
        - date: 2023-12
          label: 工厂布局公开
          details: TechCrunch 报道其位于加州的 46,000 sq ft 总部和生产设施。
          tone: positive
          claimRefs:
            - CO012
        - date: 2024-03
          label: Aries SN1 飞行履历
          details: Transporter-10 任务给出首个可运行平台验证点。
          tone: positive
          claimRefs:
            - CO019
        - date: 2024-10
          label: 入选 SDA HALO
          details: Apex 获得竞争未来 SDA 原型订单的资格。
          tone: positive
          claimRefs:
            - CO020
        - date: 2025-04
          label: Series C 完成
          details: $200M 轮融资用于垂直整合和库存。
          tone: positive
          claimRefs:
            - CO014
            - CO015
        - date: 2025-04
          label: 需求超过产能
          details: Satellite Today 报道，生产仍落后于需求。
          tone: negative
          claimRefs:
            - CO035
        - date: 2025-09
          label: Series D 估值 >$1B
          details: Interlagos 领投的轮次支持相邻设施和更多产出。
          tone: positive
          claimRefs:
            - CO016
            - CO018
        - date: 2025-10
          label: Project Shadow 发布
          details: Apex 公开承诺在 2026 年 6 月开展一项自筹资金的防务演示。
          tone: warning
          claimRefs:
            - CO022
            - CO023
        - date: 2026-03
          label: NEC 日本任务
          details: 宣布首个日本本土合同，用于 2027 年演示任务。
          tone: positive
          claimRefs:
            - CO024
