  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 剩余风险主要集中在制造扩产、合规和国防项目执行，而不只是普通商业需求。
    data:
      columns:
        - 低可能性
        - 中可能性
        - 高可能性
      rows:
        - label: 关键影响
          values:
            - —
            - 出口管制失误；Project Shadow 事故；政府项目冲击
            - 规模化吞吐下良率不达标
        - label: 高影响
          values:
            - 网站 / 隐私合规缺口
            - 发射延期；合作伙伴执行失手；新平台可靠性不达标
            - 如果需求持续跑在产出前面，营运资本承压
        - label: 中等影响
          values:
            - 商业条款错配
            - 欧洲 MoU 分散精力
            - 公开客户集中度叙事
