      - number: '2.4'
        title: 约束、不确定性与尽调含义
        blocks:
          - type: paragraph
            body: >-
              最重要的尽调提醒是，Apex 的市场更容易做方向性描述，难以精确测算。公开分析师对同一年卫星平台市场的估计相差接近四倍，这让宽口径 TAM
              主张很难作为估值锚。公开数据也没有披露卫星平台定价、实际交付周期、已发运数量，或防务与商业在手订单结构。这些缺口意味着，如果没有管理层数据，不能相信一条干净的自上而下 TAM 到收入桥。


              市场进入本身也有摩擦。Apex 的合同材料显示，公司执行美国政府工作时 FAR 和 DFARS 要求重要；BIS
              监管则说明，出口管制制度对盟友和防务项目仍相关。这些约束不会否定市场，但会放慢采用，并可能迫使本地化、合规投入或伙伴主导交付结构。正确分析姿态因此是谨慎乐观：围绕增殖和主权任务的需求信号真实存在，但承销应立足于狭窄的标准化卫星平台细分和经验证的吞吐量证据，而不是最大口径行业
              TAM 或营销层面的工厂产能表述。
