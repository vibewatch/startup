      - number: '7.2'
        title: 监管、法律与国家安全暴露
        blocks:
          - type: paragraph
            body: >-
              Apex 已不只是商业航天器供应商；它自己的公开材料已经把公司放进美国防务与盟友太空生态里。Holly Coates
              的履历显示，法务团队已经覆盖合同、出口合规、诉讼和雇佣事项，这正是高速增长的军民两用制造商需要补齐的能力。更重要的是，Apex
              的政府分包附加条款说明，一旦工作触及美国政府项目，合规边界会变得多严。这份附加条款纳入了 FAR 和 DFARS
              条款，覆盖网络报告、技术数据处理、伦理、供应商注册、出口管制物项、质量保证、付款扣留以及多条终止路径。SAM.gov 的公开 CUI 警示，以及 BIS
              对分类和筛查的强调，都说明这个运营环境里，小流程失误也可能升级成合同或监管事件。


              Project Shadow 明显放大了这类暴露。Apex 不是单纯给防务主承包商供应卫星平台；它正在赞助一项私人出资的拦截器宿主演示，目标是在 2026 年 6
              月发射，验证轨道弹匣功能、跨链通信和拦截器部署。这可能增强 Apex 的战略重要性，但也会提高监管审查、任务授权复杂性、出口敏感问题和政治关注的概率；标准商业卫星平台销售通常不会触发这些问题。


              公开记录也显示 Apex 尚未披露什么。官网隐私政策较为通用且日期停留在 2022 年，商业网站条款看起来面向普通订单，而不是涉密或防务级工作流；已抓取的来源也没有公开确认 DDTC
              注册状态、网络安全认证或设施许可成熟度。这些缺口不证明存在合规问题，但会让剩余法律和监管风险维持在高位。
