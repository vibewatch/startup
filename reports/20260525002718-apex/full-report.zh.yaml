      - number: '1.3'
        title: 资本基础与利益相关方地图
        blocks:
          - type: paragraph
            body: >-
              Apex 的融资节奏是最清晰的信号之一，说明公司已成为严肃的太空工业资产。独立报道确认，2024 年有 $95 million Series B，随后 2025 年 4 月完成 $200 million
              Series C，2025 年 9 月完成 $200 million Series D。资金用途叙事在各来源之间也一致：Series C 支持垂直整合和库存，Series D
              支持新增场地、更多自制组件和更高产能。换句话说，Apex 融资是为了工业化，而不只是延长工程现金跑道。


              Series D 尤其值得关注，因为这一轮看起来带有机会型特征。Payload 报道称，在 Interlagos 发起讨论之前，管理层并未主动融资；PRNewswire 则称该轮对 Apex 的估值超过 $1
              billion。两者结合意味着投资者需求仍足够强，Apex 可以为加速拿钱，而不是因为别无选择。硬件公司总能吃掉资本，因此这不能消除融资风险；但它确实显示，公司进入 2025 年末时处在融资强势位置。


              利益相关方也不再只有投资人。NEC 用日本演示任务验证国际需求，KSAT 增加下游任务服务能力，4iG 和 REMRED 指向欧洲制造野心，美国太空军合同和 HALO 入选则加深防务相关性。合在一起，这些关系说明
              Apex 正在成为一个星座赋能平台，拥有商业、盟友和国家安全渠道，而不是绑定某个国内客户细分的一条线创业公司。
