      - number: '2.3'
        title: 增长驱动与战略需求信号
        blocks:
          - type: paragraph
            body: >-
              Apex 市场背后的最强驱动不是泛泛的“太空在增长”，而是增殖星座架构、制造瓶颈，以及防务和主权买家需求上升的汇合。Novaspace 的前瞻发射展望和 BryceTech 的 2025
              年发射结构都指向同一方向：更小航天器主导部署活动，这会提高能够反复且快速交付卫星平台的供应商的战略价值。Apex 自身信息，加上 2025
              年融资活动，也强化了一个判断：竞争焦点已从纯概念设计转向吞吐量、组件可得性和库存。


              防务和产业政策信号再添一层需求。Apex 的美国太空军合同和 HALO 参与说明，美国政府愿意评估面向增殖任务的现成卫星平台供应商。4iG 伙伴关系说明欧洲希望本地化复用同一套制造打法，NEC
              则说明日本市场看重能支持光网络或星座赋能演示的卫星平台。Comet 进一步拓宽机会，把 Apex 推入直连设备和大口径政府载荷等更高功率 LEO 任务。合在一起，这些事实支撑一种观点：Apex
              是一家卡在小卫星需求中更窄但战略重要环节上的制造商。
