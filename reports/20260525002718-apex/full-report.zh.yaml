            - 没有整批卫星层面的可靠性分布
        - label: GEO Aries
          values:
            - 路线图
            - 中
            - 规格详细，但没有飞行验证
            - 首飞仍排在未来
        - label: Nova
          values:
            - 飞行前 / 客户兴趣
            - 中
            - 规格详细，加上需求侧说法
            - 尚无公开任务保障记录
        - label: Comet Mini
          values:
            - 路线图 / 高功率扩展
            - 中低
            - 任务类别清晰
            - 没有公开客户或飞行验证
        - label: Comet XL
          values:
            - 占位
            - 低
            - 仅看到名称
            - 没有尽调可用规格
        - label: Factory One + Octopus
          values:
            - 已运营
            - 中
            - 有具体产能和流程主张
            - 良率 / 吞吐指标未公开
    approximationNotes: 成熟度标签综合公开页面和报道，并非披露的内部评分。
    claimRefs:
      - CE004
      - CE006
      - CE007
      - CE009
      - CE010
      - CE013
      - CE026
      - CE037
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 公开可见的客户路径从飞行履历与采购入口开始，推进到直接购买、渠道支持和潜在后续项目。
    data:
      items:
        - id: s1
          label: 飞行履历 / 认知
          actor: 潜在买家
          description: Aries 首飞证明 Apex 的卫星平台是真产品。
        - id: s2
          label: 评估 / 采购入口
          actor: 政府评估方或合作伙伴
          description: HALO 和合作伙伴尽调把 Apex 纳入备选清单。
        - id: s3
          label: 直接购买或授标
          actor: 具名客户
          description: 例子包括 NEC 购买 Aries，以及 Space Force 授标。
        - id: s4
          label: 部署支持
          actor: Apex + 合作伙伴
          description: 任务服务和 KSAT 式支持帮助项目推进到执行。
        - id: s5
          label: 复购 / 扩张
          actor: 客户或机构
          description: 概念上重要，但没有公开续约数据佐证。
    approximationNotes: 基于可见证据类别综合；Apex 未发布带有这些标签的正式漏斗。
    claimRefs:
      - CU007
      - CU009
      - CU012
      - CU017
      - CU018
      - CU040
  - id: FU002
    title: 采用 / 部署漏斗
    type: funnel
    summary: 具名外部交易对手多于具名直接客户购买；公开留存可见度基本为零。
    data:
      items:
        - label: 本章具名外部交易对手
          value: 6
        - label: 具名直接客户 / 买家证据
          value: 2
        - label: 具名渠道 / 工业合作证据
          value: 2
        - label: 已披露公开留存指标
          value: 0
