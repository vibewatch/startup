  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局分层：直接、相邻和替代模式
        blocks:
          - type: paragraph
            body: >-
              Apex 所在市场里，“竞争对手”可能指几类不同公司，必须先拆开看。直接竞争组由向可重复任务类型销售标准化或可配置平台的航天器平台供应商组成：York、Blue Canyon、Terran Orbital 和
              Rocket Lab 最符合这一组。它们都在销售航天器硬件，并至少有某种可重复或飞行验证生产叙事。Terran 在质量范围上重叠最明显，Rocket Lab 则因全栈宽度和已披露商业规模而突出。


              第二组不是逐个平台替代，而是靠相邻模式竞争。Loft 提供托管载荷基础设施，Astranis 销售垂直整合的运营商模式，EnduroSat 或 Astro Digital
              强调交钥匙式服务抽象和速度。GomSpace 更适合 Apex 核心质量范围以下的小型任务。第三组是现状选项：由综合主承包商内部自建或定制采购。这个选项在防务和高复杂度任务中尤其重要。净结果是，Apex
              不只要赢过其他卫星平台，还要压过买家外包所有权、继续使用全栈既有供应商，或把工作留在内部的偏好。
