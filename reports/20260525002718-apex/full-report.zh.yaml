  - id: TV004
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 关键假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - Factory One 从叙事走向可重复交付规模；防务业务扩张；NEC/KSAT/4iG 这类关系开始变现；融资结构保持干净
        - 下一步估值区间为 $2.5B-$4.0B；多年度持有下，相比最新 >$1B 估值大约有 2x-4x 总上行空间
        - 需要公开记录尚未给出的运营证明
        - 交付和变现可见之前，概率偏低
      - - 基准
        - 需求延续，Apex 再次融资且估值高于上一轮，但披露仍薄，利润率证据仍有限
        - $1.2B-$2.0B 区间，倍数只小幅扩张，总上行大约 1x-2x
        - 资本强度依然高，上行被缺失的经济性证据封顶
        - 最符合当前公开证据
      - - 悲观
        - 生产延误，自筹项目吞现金，合规噪音出现，或融资市场转弱
        - $0.5B-$1.0B 区间，回报持平到为负，且存在实质性降估值融资风险
        - Apex 可能被重新定价，更接近低端空间硬件可比公司
        - 风险足够大，必须明确纳入承销假设
    notes: 这些是宽估值区间，不是精确目标价。目的不是模拟完整财务模型，而是在披露有限时框定方向。
