      - number: '3.2'
        title: 能力重叠与商业模式比较
        blocks:
          - type: paragraph
            body: >-
              Apex 最强的直接定位主张是：它提供覆盖多轨道的产品化卫星平台，制造语言更接近可重复工业平台，而不是定制航天器工坊。这有助于把它同定制主承包采购区分开，但不会让竞争消失。York 和 Rocket Lab
              都销售广泛任务执行栈；Blue Canyon 和 Terran Orbital 都展示有实质飞行履历的标准化平台家族；Rocket Lab
              的公开规模则给那些希望一个交易对手处理航天器、发射和运营的买家提供了不同层级的可信度。


              相邻模式重要，因为它们用不同方式解决同一项工作。Loft 可以让早期载荷任务完全不必购买卫星平台。Astranis 把堆栈留在一个运营商内部。EnduroSat 和 Astro Digital
              让交钥匙路径对更小或更快的项目更有吸引力。Comet 帮助 Apex 切入更高功率 LEO
              机会，否则这类机会可能偏向更大的定制供应商；但证据仍显示，公司的护城河取决于平台宽度、交付速度和伙伴生态的组合，而不是某一项公开规格。
