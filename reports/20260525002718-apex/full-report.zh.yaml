      - number: '4.4'
        title: 披露缺口与财务判断
        blocks:
          - type: paragraph
            body: >-
              Apex
              的公开信息包很擅长说明新资金会投向哪里，却很不擅长披露投资者最需要的运营数字。公司没有公开收入、ARR、毛利率、EBITDA、现金余额、烧钱速度、现金跑道、契约包或客户集中度。即便是看似简单的问题——政府项目贡献多少收入、服务与硬件各占多少、库存多快转成现金——也无法只靠公开材料回答。


              这个缺口重要，因为当前投资故事是一个规模化故事。Apex
              有真实证据显示产品宽度、制造扩张、政府牵引和资本可得性。悬而未决的问题是，这些资产是否正转化为有吸引力的收入质量和可持续利润率路径，还是公司仍处于收获前阶段，每一个增长里程碑都需要再投入一轮营运资本、工程支出和合规开销。公开材料没有推翻乐观情景，但也没有坐实它。


              因此，财务上的正确判断是谨慎，但不轻视。Apex
              看起来比典型概念阶段太空创业公司位置更好：硬件飞过，工厂扩大，且多次吸引资本。但核心私营指标缺失，意味着本章不能负责任地声称更多。公开证据支持“继续研究”立场，重点看收入质量、毛利率和融资依赖——不是因为故事弱，而是因为关键数字仍未公开。
