chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份与运营模式
        blocks:
          - type: paragraph
            body: >-
              Apex 是一家洛杉矶地区卫星制造商，由 Ian Cinnamon 和 Max Benassi 于 2022
              年创立。公司的核心判断异常简单：太空领域的主要瓶颈不再是发射可得性，而是可扩展的卫星制造。因此，Apex
              把自己定位成产品化卫星平台供应商，而不是定制主承包商；它强调短交付周期、可配置标准平台，以及更像工业产线、而非一次性航天工坊的制造动作。这套判断在关于页面、招聘文案和产品页面反复出现，是公司故事中最经得起交叉验证的部分之一。


              公开产品栈支撑了这套判断。Apex 面向多种轨道销售 Aries、Nova、Comet Mini、Comet XL 和 GEO Aries，平台总页称可支持最高 3,000 kg 载荷。最具体的产品证明是 LEO
              Aries：Apex 称其已有飞行验证、进入连续生产，并从 Factory One 按月交付。这一点重要，因为后续章节可以稳妥地把 Apex
              视为真正的硬件运营商，至少拥有一个飞过的平台家族，而不只是概念阶段的卫星平台开发商。


              制造占地是第二个锚点。TechCrunch 报道称，2023 年末公司面积约 46,000 平方英尺；到 2025 年 Series D 公告时，Apex 已称合计空间超过 100,000
              平方英尺，最大年产量超过 200 颗卫星。差额显示产能确实在扩张，但头部产能仍是峰值状态声明，而不是已实现吞吐量。这一区分是尽调核心：Apex
              有工业基础扩大的证据，但公开数据仍不足以证明可持续运行率已接近理论上限。
