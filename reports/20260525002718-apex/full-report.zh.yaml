      - number: '8.4'
        title: 监测、打破投资逻辑的触发点与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              估值案例证据偏薄，因此持续监测不是旁注，而是核心纪律。投资者应观察 Apex 自身新闻流是否开始转化为更硬的信号：更多已交付卫星、后续政府奖励、已披露客户项目，以及 KSAT、4iG
              等伙伴关系正在带来收入，而不只是战略背书。下一轮融资尤其关键。条款干净的上行轮会验证故事；持平或下行融资则会告诉市场，制造规模和订单转化没有跟上野心。


              合规也属于同一类问题。SAM.gov 和 DDTC 不是 Apex 专属证明，但它们确实凸显防务相关运营的监管严肃性。公开记录仍未显示 Apex
              自身的注册、审计或网络姿态。这很重要，因为合规问题会同时打击需求可信度和融资通道。Project Shadow 基于同样原因需要单独关注：它是战略楔子，但在证明自己之前也是资本黑洞。


              最终尽调清单因此应务实，而不是理论化。投入资本之前，投资者需要合同级订单、实际定价、单位经济、现金跑道、优先权条款，以及对 Project Shadow
              经济性和合规控制的清晰解释。没有这套材料，正确姿态仍是继续研究。
