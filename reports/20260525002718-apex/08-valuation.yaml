- id: TV006
  title: Final Diligence Asks Table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Backlog by customer and program
    - Signed backlog value, cancellation rights, and milestone schedule are not public
    - Need to separate announcement volume from monetizable demand quality
    - Request contract-level backlog schedule and redlined customer terms
  - - Realized pricing and revenue recognition
    - No public realized ASPs or revenue-recognition policy by program type
    - Needed to turn product narrative into an economic model
    - Request program-level revenue waterfall and sample accounting treatment
  - - Gross margin and working-capital profile
    - No public cost, margin, inventory-turn, or deposit data
    - Determines whether productization is actually creating advantaged economics
    - Request standard-cost model, BOM trend, inventory turns, and payment terms
  - - Burn, runway, and next-financing trigger
    - No public monthly burn, cash balance, or board financing thresholds
    - Capital intensity is the central downside variable in this chapter
    - Request latest cash bridge, runway cases, and financing plan
  - - Cap table and preference stack
    - No public liquidation preferences, participation rights, or dilution overhang
    - Return modeling is impossible without knowing the stack above common
    - Request cap table, charter terms, and latest round docs
  - - Project Shadow economics and compliance proof
    - No public reimbursement, DDTC posture, or independent cyber/compliance evidence
    - Shadow can create strategic upside or become an expensive distraction
    - Request program budget, expected follow-on path, and compliance certifications
  notes: These asks are ordered by how much they would change the recommendation, not by how easy they are to obtain. Items 1-5 are required to turn public curiosity into investable conviction.
