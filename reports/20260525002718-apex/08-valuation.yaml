    - Closer public hardware-and-services sanity check
    - Still much more disclosed and diversified than Apex
  - - Terran Orbital sale
    - Strategic takeout value
    - ~$450M acquisition by Lockheed Martin in 2024
    - Useful downside anchor for a space-hardware platform
    - Different ownership and transaction context than a private growth round
  - - Smallsat outlook
    - Demand reference
    - ~14,000 projected smallsats in 2024-2033; increasingly government-driven
    - Supports category demand and strategic relevance
    - Category demand does not equal Apex-specific profitable revenue capture
