- id: TV002
  title: Thesis / Anti-Thesis Table
  columns:
  - Argument
  - Evidence
  - What would change the view
  rows:
  - - 'THESIS: Apex has unusually broad visible demand proof for a private bus manufacturer'
    - Space Force contract, NEC mission, KSAT services bundle, and 4iG European manufacturing interest
    - If those programs fail to convert into deliveries or repeat business, the proof degrades back to announcements.
  - - 'THESIS: The productized platform model could create speed and strategic value'
    - Factory One capacity claim, multi-orbit platforms, and a widening roadmap beyond Aries
    - If delivery cadence lags the claimed capacity, the scale story stops compounding.
  - - 'THESIS: Investor appetite remained strong through late 2025'
    - Back-to-back $200M rounds and a >$1B Series D
    - If the next financing is flat or down, the market will signal that capital access was not durable.
  - - 'ANTI-THESIS: Public economics are still opaque'
    - No public backlog, revenue, gross margin, burn, runway, or preference stack
    - Clean disclosure on those items would materially narrow the valuation band.
  - - 'ANTI-THESIS: Public comps do not clearly support aggressive pricing'
    - Rocket Lab and Redwire trade at wildly different implied multiples, while Terran Orbital shows a low-end outcome
    - Apex would need clearer growth economics to justify paying materially above the last round.
  - - 'ANTI-THESIS: Project Shadow and compliance can create downside faster than they create value'
    - Self-funded defense demo, CUI-heavy government environment, and missing DDTC-specific proof
    - If Shadow wins funded follow-ons and compliance proof is clean, the downside discount can narrow.
  notes: Each row is phrased as a falsifiable condition, not as a permanent identity claim. That is the right frame for a private, capital-intensive manufacturer.
