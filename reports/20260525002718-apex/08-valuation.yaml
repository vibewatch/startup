company:
  name: Apex
chapter:
  number: 8
  title: Valuation
  summary: 'Apex has more real demand proof than most private space-hardware startups, but the public evidence still does not support a confident underwrite above its last disclosed >$1B Series D mark. The right public-only stance is research-more with a fair-to-stretched view: stay engaged, but wait for backlog conversion, unit economics, and financing terms before treating the latest price as attractive.'
sections:
- id: SV001
  title: Investment Thesis, Anti-Thesis, and Recommendation
  body: |-
    Public evidence makes Apex more interesting than a typical private space-hardware startup, but not yet easy to underwrite. The positive case is real: Apex has raised back-to-back $200 million rounds, says it can mass-manufacture configurable buses, and has accumulated visible demand signals across U.S. defense, Japan, mission operations, and European manufacturing partnerships. That is a materially better starting point than a company with only one prototype and one pilot customer. The product narrative also has breadth: Apex markets multiple orbit classes, talks about payloads up to 3,000 kg, and continues expanding into larger-power configurations.

    The anti-thesis is just as important. Most of the demand proof is still announcement based, not revenue based. Public materials do not disclose booked backlog value, revenue recognition, gross margin, burn, runway, or preference terms. The latest round being above $1 billion is directionally plausible, but public evidence does not yet prove that Apex has grown into a repeatable economic model rather than a capital-hungry manufacturing ramp. Project Shadow adds excitement, but it also adds self-funded execution risk.

    That pushes the investment call toward discipline rather than enthusiasm. The right public-only recommendation is research-more: stay engaged, but do not underwrite aggressively at the last disclosed mark without private backlog, margin, and financing data. The current stance is fair-to-stretched, not obviously cheap.
