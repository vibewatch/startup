- id: TV005
  title: Thesis-Break and Kill Triggers Table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Delivery ramp miss
    - Announced scale claims do not convert into visibly higher deliveries over the next 12-18 months
    - Turns the manufacturing thesis from scale asset into capacity theater
    - Pause and re-underwrite around a lower multiple band
  - - Government-program slippage
    - Space Force or Shadow-related timelines slip materially or lose scope
    - Weakens the strongest strategic demand proof in the file
    - Move from research-more to avoid until the demand case is rebuilt
  - - Partner non-monetization
    - NEC, KSAT, and 4iG style announcements do not become booked or recurring programs
    - Reclassifies today's partnership evidence as signaling rather than monetization
    - Cut upside assumptions and compress the base-case band
  - - Compliance event
    - Any export-control, cyber, or government-compliance issue becomes public
    - Hits defense credibility, partner execution, and financing access simultaneously
    - Treat as thesis-break until remediated
  - - Next financing at or below the last round
    - Flat or down financing or materially heavier preference terms
    - Signals that operating proof did not keep pace with narrative
    - Reset the valuation lens to downside protection rather than upside capture
  - - Shadow burn without payback
    - Internal capital use expands without visible funded follow-on demand
    - Turns optionality into a balance-sheet overhang
    - Discount strategic upside and demand proof more aggressively
  notes: Triggers are chosen because they are at least partially monitorable from public evidence. A real trigger should force a fresh underwriting pass, not a narrative defense.
