  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: No fetched public source discloses Apex's backlog by customer, recognized revenue, realized pricing, or gross margin.
    whyItMatters: Those are the core inputs needed to decide whether the >$1B mark is fair, stretched, or genuinely attractive.
    diligencePath: Request a contract-level backlog report, realized ASP history, revenue-recognition memo, and margin bridge by program.
    relatedQuestionRefs:
    - QV031
    - QV032
    - QV033
    relatedTableRefs:
    - TV004
    - TV006
  - type: private-evidence-only
    severity: material
    topic: cap-table-preferences
    missingEvidence: No fetched public source discloses Apex's liquidation preferences, participation rights, or other preference overhang.
    whyItMatters: Even a seemingly fair enterprise value can be unattractive to new capital if the preference stack is heavy.
    diligencePath: Request the latest charter, cap table, and round documents before trying to model returns.
    relatedQuestionRefs:
    - QV034
    relatedTableRefs:
    - TV006
  - type: missing-source
    severity: material
    topic: shadow-economics
    missingEvidence: Project Shadow is public, but no fetched source discloses program budget, reimbursement path, or expected return on internally funded capital.
    whyItMatters: Shadow can either enhance Apex's defense optionality or become a cash-consuming narrative asset with weak payback.
    diligencePath: Request Shadow budget, milestone plan, expected follow-on customer path, and management's decision framework for internal capital allocation.
    relatedQuestionRefs:
    - QV024
    - QV026
    relatedTableRefs:
    - TV005
    - TV006
  - type: missing-source
    severity: material
    topic: compliance-proof
    missingEvidence: The fetched public record does not confirm Apex's DDTC posture, cyber assessment status, or other concrete government-compliance evidence.
    whyItMatters: A compliance event would hit demand credibility and financing access simultaneously, especially for defense-linked work.
    diligencePath: Request export-control registration details, cyber certifications or audit summaries, and any material government-compliance correspondence.
    relatedQuestionRefs:
    - QV030
    relatedTableRefs:
    - TV005
    - TV006
  - type: missing-source
    severity: minor
    topic: roadmap-detail
    missingEvidence: The fetched Comet XL page contains almost no detail on performance, economics, or delivery timing.
    whyItMatters: Roadmap breadth supports the bull case only if the upper-end platform is more than a placeholder page.
    diligencePath: Request detailed product sheets, target customer profiles, and expected commercialization timing for Comet XL and adjacent high-power platforms.
    relatedQuestionRefs:
    - QV015
    - QV033
  - type: private-evidence-only
    severity: material
    topic: comparable-set-completeness
    missingEvidence: The public comparable set is incomplete because private space-hardware rounds, transaction terms, and secondary marks are mostly paywalled or undisclosed.
    whyItMatters: Without a fuller comparable set, TV003 remains a directional sanity band rather than a precise anchor for Apex's current mark.
    diligencePath: Obtain bank-style comparable work, private-round marks, and transaction comps from company data room materials or specialist databases.
