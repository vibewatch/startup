- id: TV004
  title: Bull / Base / Bear Scenario Table
  columns:
  - Scenario
  - Key assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - Factory One moves from narrative to repeatable delivery scale; defense work expands; NEC/KSAT/4iG-type relationships monetize; financing stays clean
    - $2.5B-$4.0B next-step valuation range and roughly 2x-4x gross upside from the latest >$1B mark over a multi-year hold
    - Requires operational proof the public record does not yet contain
    - Low probability until deliveries and monetization are visible
  - - Base
    - Demand continues and Apex raises again above the last round, but disclosure stays thin and margin evidence remains limited
    - $1.2B-$2.0B range with only modest multiple expansion and approximately 1x-2x gross upside
    - Capital intensity remains high and upside is capped by missing economics
    - Most consistent with current public evidence
  - - Bear
    - Production slips, self-funded programs absorb cash, compliance noise appears, or financing markets weaken
    - $0.5B-$1.0B range with flat-to-negative returns and real down-round risk
    - Apex could be repriced closer to lower-end space-hardware precedents
    - Material enough that it must be underwritten explicitly
  notes: These are broad valuation bands, not precise price targets. They are meant to frame directionality under limited disclosure rather than simulate a full financial model.
