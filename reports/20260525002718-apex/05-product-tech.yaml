company:
  name: Apex
chapter:
  number: 5
  title: Product & Technology
  summary: Apex sells standardized bus families—LEO Aries, GEO Aries, Nova, and Comet—wrapped with optional mission services and a high-rate manufacturing system centered on Factory One and Octopus. Public evidence is strongest for Aries, which has on-orbit heritage and serial production; Nova, GEO Aries, and Comet extend the same configurable architecture into higher-power or different-orbit use cases but remain more roadmap-heavy. Reliability and compliance signals come from the disclosed AIT process, supplier audit rights, FAR/DFARS flowdowns, and dedicated quality/legal functions, yet public sources still omit realized pricing, fleet-wide failure rates, named certifications, and detailed Comet XL specifications.
sections:
- id: bus-family-and-customer-workflow
  title: Bus family and customer workflow
  body: 'Apex frames the bus as a product, not a custom engineering project. The company groups its public offering into Aries, Nova, and Comet, then uses optional mission services to cover integration, launch, and operations around those buses. Aries is the most mature family: the LEO branch is flight-proven and serially produced, while GEO Aries extends the same product logic into an agile GEO mission set. Nova is the higher-power proliferated LEO workhorse, and Comet pushes the company into much larger, power-hungry missions such as D2D, SAR, orbital data centers, and interceptor-hosting concepts. NEC’s selection of Aries for a 2027 optical-communications demonstration is useful because it shows the bus can support a commercial communications payload, not only defense-facing missions. The public evidence therefore supports a real bus family map with configurable mission packaging, even if the outer edge of the roadmap remains thinly specified.'
