- id: roadmap-and-dependency-risks
  title: Roadmap and dependency risks
  body: 'Apex’s maturity profile is uneven. Aries has the strongest public proof because it has flown and is referenced as operating on orbit. Nova, GEO Aries, and Comet are more roadmap-heavy: Nova is pointed at 2026 first flight, GEO Aries at 2027, Comet Mini at 2028 scaled readiness, and Comet XL is barely specified publicly. Project Shadow expands the map further by adapting Apex’s bus technology into an Orbital Magazine host for interceptor demonstrations, which strengthens the defense narrative but also raises execution complexity. The company is clearly trying to de-risk that roadmap with vertical integration, more factory space, and tighter supplier control. Even so, Novaspace’s market view is a good caution: the supplier market is becoming more government-driven, more vertically integrated, and more consolidation-prone. That trend supports Apex’s positioning, but it also means the company is tying itself to customers who will care intensely about compliance, schedule certainty,
    and reliability.'
