- id: architecture-and-manufacturing-system
  title: Architecture and manufacturing system
  body: 'The public architecture has two layers. One is the reusable bus backbone: standardized power, data, thermal, propulsion, communications, and GNC interfaces that can be configured for mission-specific needs. The other is the production system behind that backbone. Factory One is positioned as a software-enabled assembly line, while Octopus is described as the operating layer connecting engineering, manufacturing, and operations through MES and QMS workflows. Virtual Flatsat and Bus Emulator tooling are important because they move payload and ground-system integration work earlier than in a classic one-off bus purchase. Taken together, the platform pages, factory page, and mission-services page describe a coherent operating architecture in which a customer picks a base bus, selects option packages, validates interfaces, integrates payloads, and can then outsource launch support, LEOP, and mission operations. That is much more specific than generic “full-service” aerospace copy.'
