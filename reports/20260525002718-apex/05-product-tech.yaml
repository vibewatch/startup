- id: reliability-quality-and-compliance
  title: Reliability, quality, and compliance controls
  body: 'Apex discloses more operational controls than many young hardware companies. Factory One names full functional, performance, vibration, and polarity testing as part of AIT, while the quality-inspector and supply-chain Q&A pages reinforce the emphasis on documentation, process control, and supplier management. The purchase terms add audit rights, inspection access, warranty remedies, counterfeit protections, and quality-compliance obligations on suppliers. For government work, the subcontract rider is a meaningful signal: it explicitly references FAR and DFARS flowdowns, covered-defense-information safeguards, NIST assessment requirements, and export-controlled-item clauses. The bus-family pages also disclose AES-256 and NSA Type 1 options. Still, public evidence is stronger on process architecture than on third-party validation. The fetched set does not name AS9100, ISO 9001, or ISO 27001 certifications, and it does not disclose fleet-level reliability distributions. Apex’s privacy
    policy and site terms are also useful governance signals: they show the company has explicit rules for customer inquiries, product orders, and data handling on the public web surface. Those are not mission-assurance proofs, but they do reinforce that Apex is formalizing customer-facing legal process instead of operating on entirely ad hoc terms.'
