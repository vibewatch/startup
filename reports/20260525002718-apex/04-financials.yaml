- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Public value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Realized average selling price per bus
    - null
    - low
    - Needed to compare pricing power against manufacturing cost and benchmark peers
    - Request ASP by bus family and customer type.
  - - Revenue recognition pattern
    - Not disclosed; likely milestone / contract based
    - medium
    - Determines timing of cash conversion and backlog quality
    - Request sample contracts and accounting policy.
  - - Gross margin
    - null
    - low
    - Core test of whether productization is creating an advantaged industrial model
    - Request gross margin by program and by product/service split.
  - - Working-capital burden
    - Likely high because Apex builds inventory ahead of need
    - medium
    - Inventory can accelerate delivery but consume cash before collection
    - Request inventory turns, deposits, and payment terms.
  - - Production throughput
    - Public proxies range from 50 annual ambition to about 12 per month to >200 peak capacity
    - medium
    - Separates marketing capacity from proven factory output
    - Request monthly deliveries and WIP by platform.
  - - Compliance overhead
    - Meaningful for defense-facing suppliers under FAR/DFARS and export controls
    - medium
    - Affects SG&A and supplier flexibility
    - Request compliance staffing, audit costs, and exceptions history.
  notes: Null values reflect unavailable private metrics rather than zero economics. Public evidence supports directionality, not finished unit economics.
