- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact on analysis
  - Exact diligence path
  rows:
  - - Current revenue / ARR and recognition timing
    - Cannot judge top-line scale, quality, or growth
    - Obtain audited P&L plus customer-level revenue waterfall.
  - - Gross margin and COGS by platform / service line
    - Cannot test whether productization improves economics
    - Obtain standard-cost model, BOM, and realized margin by program.
  - - Cash balance, burn, runway, and covenant headroom
    - Cannot assess financing dependency or downside timing
    - Obtain latest monthly cash bridge and debt package.
  - - Revenue mix by commercial / government / services
    - Cannot judge concentration, durability, or policy risk
    - Obtain segmentation by customer class, geography, and product line.
  - - Pricing realization and discounts
    - Cannot compare published capability to monetization quality
    - Obtain ASP by family, redlined contracts, and concession history.
  - - Top-customer concentration and backlog quality
    - Cannot distinguish durable backlog from concentrated project exposure
    - Obtain signed backlog report with deposits, milestones, and cancellation rights.
  notes: These are the highest-priority financial diligence requests because they directly determine whether Apex is merely growing or growing efficiently.
