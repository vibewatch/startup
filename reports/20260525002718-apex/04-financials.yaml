- id: TI004
  title: Capital adequacy table
  columns:
  - Item
  - Public value / status
  - Why it matters
  - Likely implication
  - Diligence ask
  rows:
  - - Cash on hand
    - null
    - Current liquidity is the first test of financing dependency
    - Runway cannot be estimated from public information
    - Request latest balance sheet and unrestricted cash figure.
  - - Monthly burn
    - null
    - Burn determines how quickly Apex converts funding rounds into operating runway
    - Series C and D may have been large because manufacturing scale-up is expensive
    - Request a 12-month monthly cash bridge.
  - - Runway months
    - null
    - Needed to judge whether Series D is growth capital or near-term survival capital
    - Public sources do not permit a credible runway estimate
    - Request base / upside / downside runway scenarios.
  - - Planned use of funds
    - Series C funded vertical integration and inventory; Series D funded footprint and component integration
    - Shows capital is going into industrial scale-up rather than just engineering salaries
    - Evidence supports continued capex and working-capital absorption
    - Map actual uses against budget and milestones.
  - - Next-round trigger
    - Not disclosed publicly
    - Investors need to know whether the next raise depends on bookings, deliveries, or defense wins
    - Risk that round timing depends on factory utilization and collections
    - Request board-approved fundraising triggers and KPI thresholds.
  - - Debt / project-finance obligations
    - No public covenant package; only broad financing headlines are visible
    - Debt terms can restrict operating flexibility in hardware businesses
    - Potential hidden downside if covenants are tight
    - Request debt agreements, liens, and covenant headroom.
  notes: Public financing headlines are clear; balance-sheet consequences are not. This table intentionally treats missing cash metrics as missing evidence, not as negative evidence.
