tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Current public status
  - Revenue quality
  - Diligence ask
  rows:
  - - Standard bus platform sale
    - Customer buys configurable spacecraft bus hardware
    - Platform families and specs are public; realized pricing is not
    - Likely lumpy contract revenue
    - Request contract templates and ASP history by bus family.
  - - Mission-specific configuration / integration
    - Engineering packages, payload integration, and mission tailoring
    - Configuration packages are public; economics are not
    - High-value but non-standardized
    - Request configuration pricing matrix and engineering-hours assumptions.
  - - Mission services
    - Apex offers end-to-end mission support around deployment
    - Service offer is explicit on the website; scope and pricing are not
    - Potentially sticky if bundled into contracts
    - Request service attach rate and margin profile.
  - - Operations / ground-service bundle
    - Partner-enabled mission operations and data delivery
    - KSAT-style bundle exists, but commercial terms are undisclosed
    - Could improve recurring services mix
    - Request partner rev-share and pass-through economics.
  - - Government prototype and defense programs
    - Programs such as HALO, Space Force contracts, and Shadow-adjacent work
    - Demand signal visible; revenue timing and margin not visible
    - Potentially large but milestone-driven
    - Request payment schedule and cost-recovery mechanics.
  - - Internally funded demonstration programs
    - Programs such as Project Shadow funded ahead of disclosed reimbursement
    - Clearly public as a use of capital, not a disclosed revenue stream
    - Negative for near-term cash conversion
    - Separate internally funded programs from customer-funded backlog.
  notes: 'Sources: Apex about/mission pages, PRNewswire, SpaceNews, and official defense announcements. Public evidence is strongest on existence of streams, weakest on pricing and recognition.'
