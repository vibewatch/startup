    - Could create service revenue but clouds hardware ASP
    - Your Mission page
  - - Partner-enabled operations
    - KSAT-style downstream capabilities widen the offer
    - Rev-share, pass-through costs, and margin split
    - Bundling may raise win-rate more than margin
    - Public announcements
