callouts:
- calloutType: risk
  title: The central financial risk is not demand, it is opacity
  body: Apex has enough public evidence to show customers, contracts, and financing access. The blocking issue is that none of the core underwriting numbers—revenue, margin, burn, runway, and concentration—are public.
