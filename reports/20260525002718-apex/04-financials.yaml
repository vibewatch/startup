    severity: material
    topic: revenue-arr
    missingEvidence: Apex has not publicly disclosed current revenue, ARR, recognized backlog, or contract-level revenue schedules.
    whyItMatters: Without top-line disclosure, it is impossible to judge scale efficiency or compare Apex directly with public peers.
    diligencePath: Request audited income statements and a backlog waterfall by customer, program, and recognition timing.
