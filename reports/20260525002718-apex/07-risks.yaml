  "evidenceGaps":
  - "type": "private-evidence-only"
    "severity": "material"
    "topic": "TR001 regulatory and legal register coverage"
    "missingEvidence": "Public confirmation of DDTC registration, CMMC or equivalent cyber posture, facility-clearance status, and any regulator-facing audits or disclosures."
    "whyItMatters": "Without primary compliance proof, export-control and defense-data risks remain judged from policy documents rather than audited operating evidence."
    "diligencePath": "Request DDTC registration history, cyber-certification roadmap, facility-clearance status, and any internal or third-party compliance audits."
    "relatedQuestionRefs":
    - "QR027"
    "relatedTableRefs":
    - "TR001"
  - "type": "private-evidence-only"
    "severity": "material"
    "topic": "financing dependency and unit economics"
    "missingEvidence": "Bus-level gross margin, cash burn, working-capital needs, backlog dollars, and yield metrics by product line."
    "whyItMatters": "Capital intensity is one of the top risks, and public funding announcements alone cannot show whether scale improves or worsens cash efficiency."
    "diligencePath": "Request monthly manufacturing output, scrap/yield, contribution margin, inventory turns, and runway assumptions tied to Nova and Comet ramps."
    "relatedQuestionRefs":
    - "QR028"
  - "type": "missing-source"
    "severity": "material"
    "topic": "government contract economics and termination rights"
    "missingEvidence": "The actual Space Force and SDA-linked contract documents, milestone structure, margin profile, and default-or-termination language."
    "whyItMatters": "Government awards support demand credibility but can still be economically thin or cancelable in ways that sharply change the investment case."
    "diligencePath": "Request award summaries, redacted contract terms, CLIN structure, modification history, and any stop-work or cure-right correspondence."
    "relatedQuestionRefs":
    - "QR029"
  - "type": "private-evidence-only"
    "severity": "material"
    "topic": "insurance and launch contingency planning"
    "missingEvidence": "Insurance certificates, launch-delay remedies, and contingency playbooks for major in-orbit loss or launch-provider slippage."
    "whyItMatters": "Apex's roadmap concentrates value into a small number of named missions and hardware programs, so uninsured disruptions could force emergency financing."
    "diligencePath": "Request mission-insurance coverage, launch contracts, liquidated-damages terms, and backup-launch or respin procedures."
    "relatedQuestionRefs":
    - "QR030"
