evidenceGaps:
  - type: missing-source
    severity: material
    topic: board-disclosure
    missingEvidence: A current board roster, observer rights, and ownership concentration after Series D are not publicly disclosed.
    whyItMatters: Governance control and downside-protection rights matter for underwriting influence and future financing behavior.
    diligencePath: Request the post-Series D cap table, board consents, and investor-rights agreement.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: cover-metrics
    missingEvidence: >-
      Current 2026 headcount, customer count, backlog by customer, and current production run-rate are not publicly
      disclosed.
    whyItMatters: These are cover metrics the rest of the report would otherwise reuse as scale anchors.
    diligencePath: Request a current KPI dashboard covering employees, backlog units, deliveries, and customer counts.
    relatedQuestionRefs:
      - QO015
      - QO025
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: Apex does not publish revenue mix by defense vs. commercial, U.S. vs. allied, or hardware vs. services.
    whyItMatters: >-
      Without revenue mix, investors cannot judge concentration, export exposure, or the durability of the government
      wedge.
    diligencePath: Request management revenue segmentation by customer class, geography, and program.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: milestone-table
    missingEvidence: >-
      The public chronology is still incomplete on early factory-opening specifics, exact Series B close timing, and
      whether any material adverse operating events preceded the 2025 scale-up.
    whyItMatters: >-
      The milestone table is the chapter's chronology of record, so omissions can distort the pace of execution and the
      interval between capital raises and delivery proof.
    diligencePath: >-
      Request an internal milestone log covering factory commissioning, major deliveries, financing closes, and any
      material execution misses from 2022 through 2026.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: pricing-opacity
    missingEvidence: Public list pricing, realized ASP, and contract structure for each bus family.
    whyItMatters: Pricing is required to translate market lenses into realistic revenue and margin scenarios.
    diligencePath: Request sample customer quotes, bus configuration price sheets, and closed-won contract values by platform.
    relatedQuestionRefs:
      - QM017
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: manufacturing-capacity
    missingEvidence: Actual annual output, utilization, yield, and delivery lead time by bus line.
    whyItMatters: >-
      Factory-nameplate capacity is not the same as shipments; underwriting speed and scale requires realized
      throughput.
    diligencePath: >-
      Request monthly production dashboards, shipped-units history, work-in-process inventory turns, and median
      order-to-delivery lead time.
    relatedQuestionRefs:
      - QM018
      - QM025
    relatedTableRefs:
      - TM004
  - type: missing-source
    severity: material
    topic: channel-mix
    missingEvidence: A clean commercial-versus-defense demand split in dollars or backlog share.
    whyItMatters: The valuation implication of government dependence differs from a commercial constellation mix.
    diligencePath: Ask management for booked backlog by end market and pipeline by government versus commercial programs.
    relatedQuestionRefs:
      - QM019
  - type: conflicting-data
    severity: material
    topic: tam-uncertainty
    missingEvidence: A methodology-consistent external estimate for standardized constellation-bus demand.
    whyItMatters: Current third-party TAMs vary too widely to be used as a single precision anchor.
    diligencePath: >-
      Rebuild SAM bottom-up from published mission counts, platform mass classes, and disclosed constellation
      procurement programs.
    relatedQuestionRefs:
      - QM005
      - QM021
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing-opacity
    missingEvidence: Public list pricing or realized ASP by spacecraft family for Apex and its direct peers.
    whyItMatters: Without price transparency it is impossible to compare economics on a like-for-like basis.
    diligencePath: Request quote sheets, sample proposals, and win-loss analyses normalized by payload class.
    relatedQuestionRefs:
      - QP016
      - QP026
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-cost
    missingEvidence: Observed churn, renewal rates, and actual re-hosting costs after program award.
