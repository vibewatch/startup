- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration / friction
  - Impact
  - Evidence
  - Diligence path
  rows:
  - - Government procurement traction
    - Named direct proof is concentrated in U.S. defense procurement
    - High concentration risk if programs slip
    - Space Force contract + HALO + Novaspace
    - Request backlog by agency and program
  - - International commercial wedge
    - NEC is strong proof but currently a single named commercial buyer
    - Medium-high breadth risk
    - Apex + NEC releases
    - Request broader commercial customer list
  - - KSAT channel
    - No public channel-sourced bookings yet
    - Medium execution risk
    - Dual KSAT announcements
    - Request sourced-pipeline and conversion data
  - - 4iG / REMRED industrial expansion
    - Exploratory cooperation may not translate into near-term sales
    - Medium monetization-timing risk
    - Apex + 4iG releases
    - Request JV timeline and booking contribution
  - - Project Shadow demand generation
    - Self-funded defense demo can attract buyers but does not monetize itself today
    - Medium strategic risk
    - Project Shadow materials
    - Track whether demo converts into procurement
  - - Government procurement compliance
    - DFARS, covered-information, and export obligations raise cost of winning customers
    - High sales-cycle friction
    - Acquisition.GOV + rider + legal Q&A
    - Review security and export staffing against pipeline
  - - Cross-border regulatory overhead
    - Visible through DDTC and eCFR portal dependence
    - Adds export-control diligence and documentation burden for foreign customers
    - Request export-license workflow, cycle time, and denied-deal history by geography
    - Use management diligence, not portal visibility, to measure actual conversion impact by geography
  notes: The main concentration problem is not lack of proof; it is that the proof is narrow and defense-weighted while customer economics remain opaque. Added a cross-border compliance row because foreign-customer procurement runs through export-control infrastructure as well as commercial sales efforts.
