- id: partnership-and-channel-proof
  title: Partnership and channel proof
  body: 'A large share of Apex’s visible customer surface is better described as partner or channel proof than as direct customer proof. KSAT is the clearest example: the announcements combine Apex buses with KSAT ground-network and operations services for commercial, civil, and defense missions, but they do not tell us how many missions have actually been sold through the channel. The same logic applies to 4iG and REMRED, where the public materials emphasize European industrial capability, a potential joint venture, and future demonstration work rather than current bus purchases. Project Shadow is another adjacent case. It can improve Apex’s defense-customer narrative because it demonstrates a self-funded, defense-oriented mission, yet it is explicitly not a customer contract. The correct split is therefore between proof classes: NEC and the Space Force are named customer/buyer proof, HALO is evaluator proof, KSAT and 4iG are channel or industrial proof, and Project Shadow is product-strategy
    proof.'
  claimRefs:
  - CU007
  - CU008
  - CU009
  - CU010
  - CU011
