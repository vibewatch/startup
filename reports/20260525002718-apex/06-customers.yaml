- id: adoption-trajectory-and-mix
  title: Adoption trajectory and defense/commercial mix
  body: 'The public adoption trajectory runs from heritage and procurement access toward more specific named buyers, but it is not yet a scaled-account story. Aries first flight in 2024 established bus credibility. HALO in late 2024 showed Apex was becoming procurement-relevant to the SDA. In 2025, the Space Force contract and the self-funded Project Shadow announcement pushed the narrative harder toward defense demand. In 2026, NEC gave Apex a concrete non-U.S. commercial customer reference, while KSAT and 4iG added channel and industrial optionality around that installed-base story. This is useful because it shows Apex is not relying on one isolated press hit. It also shows the current mix is still defense-forward and government-influenced. NEC is the best commercial counterweight, but one named international comms demo does not offset the weight of the Space Force contract, HALO, Project Shadow, and broader government-driven market evidence. The homepage and newsroom cadence matter here
    too: Apex is actively publishing customer, partner, and defense-program updates, which means the evidence set is current even if it is not yet deep on denominators or deployment breadth.'
