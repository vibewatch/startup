chapter:
  number: 6
  title: Customers
  summary: Apex has real named customer proof, but it is narrower than the company’s broad demand narrative. NEC is the clearest direct commercial customer because both Apex and NEC say NEC bought an Aries bus for a 2027 optical-communications demo, while SpaceNews’s $45.9 million Space Force contract is the strongest direct government proof. The rest of the visible customer surface is mostly procurement or channel adjacent—SDA HALO eligibility, KSAT mission-operations partnership, 4iG/REMRED industrial expansion, Aries first-flight heritage, and the self-funded Project Shadow demo. Public sources do not disclose active customer count, renewal or retention metrics, or revenue concentration, so the current adoption story is credible but still best described as defense-heavy and denominator-light.
sections:
- id: named-customer-proof
  title: Named customer proof
  body: 'The strongest direct customer evidence comes from NEC and the U.S. Space Force. NEC is the clearest commercial proof because the relationship is not only on Apex’s site; NEC itself says the bus for its technology-demonstration satellite will be an Aries platform from Apex. That upgrades the relationship from a company-claimed press release to customer-side confirmation tied to a specific use case: optical communications, in-orbit routing, and millimeter-wave communications. The Space Force contract is the clearest government-side proof because SpaceNews reports a $45.9 million award running through 2032 for multi-orbit missions. HALO is relevant but weaker because it shows Apex entered a procurement pool rather than winning a booked order. Aries first flight also matters, but it proves heritage and unnamed customer payload support rather than a public roster of named buyers.'
