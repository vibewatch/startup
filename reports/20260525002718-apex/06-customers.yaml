- id: retention-concentration-and-procurement-risk
  title: Retention, concentration, and procurement risk
  body: 'Public retention and concentration visibility is poor. The fetched evidence does not disclose customer count, NRR, GRR, churn, renewal rates, top-customer share, or backlog concentration. The best public duration proxies are the Space Force contract horizon to 2032 and NEC’s stated delivery and launch cadence, but those are not retention metrics. Nor do the partner announcements solve the problem: KSAT and 4iG may help future conversion, yet they do not disclose channel economics, sourced bookings, or repeat-order behavior. The adverse overlay is that the broader smallsat market is becoming more government-driven and more consolidation-prone. That increases the odds that Apex can win meaningful government business, but it also increases concentration risk because government programs bring heavier procurement friction, covered-information controls, and export-compliance burden. Apex appears aware of that, but the evidence base is still stronger on procurement readiness than on durable
    recurring revenue. Even the company’s customer-facing legal surface is denominator-light: the privacy policy and site terms confirm Apex handles orders and inquiries through documented rules, but those pages still reveal nothing about account count, renewal behavior, or concentration.'
