              Grubhub 增加了几条 Wonder 此前没有规模化拥有的客户渠道。消费者侧，Grubhub 仍营销一个全国 app，包含数十万家餐厅和杂货、Grubhub+ 订阅以及实时订单追踪。商户侧，Grubhub
