    rows:
      - - DoorDash
        - 直接在位 marketplace
        - 美国份额 60.7%；2026 年 Q1 订单 933M；Q1 GOV $31.6B
        - 大众餐厅发现、商户、会员
        - 美国消费者需求密度最高且可见，同时有公开商户方案打包能力
        - 对食品供给的所有权低；商户经济性仍有争议
      - - Uber Eats / Uber Delivery
        - 直接在位 marketplace
        - 2026 年 Q1 行程 3.6B；gross bookings $53.7B；Uber One 会员 50M
        - 消费者、商户和托管企业餐食预算
        - 把配送交叉销售进出行和职场支出
        - 餐厅配送份额落后 DoorDash，自有食品供给有限
      - - Instacart
        - 相邻餐食 / 生鲜平台
        - 覆盖北美 98% 家庭；1,800+ 个 banners；35 个州有 4,100+ 家 Ready Meals 门店
        - 生鲜、便利、预制餐，以及基于 app 的餐厅相邻场景
        - 可在用餐者打开餐厅 marketplace 前截获餐食意图
        - 餐厅流量是附属业务，目前由 Uber Eats 支撑，而非自有需求
      - - Grubhub
        - 已收购的传统 marketplace / 集成资产
        - 美国份额 6.3%；4,000+ 个城市有 415,000+ 商户；覆盖校园
        - Marketplace 用餐者、校园项目、直连点餐、商户工具
        - 仍掌握可供 Wonder 导流的细分分发渠道
        - 独立全国消费者份额远弱于 DoorDash 或 Uber
      - - CloudKitchens
        - 厨房基础设施竞争对手
        - 600+ 个品牌；高需求配送市场；每个地点 20+ 个私有厨房
        - 寻求 delivery-first 扩张、但不想完整建设门店的餐厅
        - 靠厨房生产率和点位经济性运营，而不是靠 app 份额
        - 没有明显的大众消费者发现层；经营方经济性仍是公司自述
      - - Kitchen United
        - 失败 / 收缩的 ghost kitchen 对照
        - 曾完成 $100M 增长轮，后关闭实体单元和 Kroger 网点
        - 希望通过多品牌虚拟美食广场分发的连锁餐厅
        - 早期证明软件加共享厨房可以聚合品牌
        - 从实体扩张撤退，转回软件方向
      - - Reef
        - 失败 / 收缩的 ghost kitchen 对照
        - 关闭三处纽约设施；裁员；从 ghost kitchen 转向技术授权
        - 希望在停车场或场馆场景运营纯配送厨房的品牌
        - 展示了替代型地产也能承载分布式厨房
        - 收缩说明需求脆弱，单位经济性难打通
      - - 传统餐厅 / 本地独立商户
        - 现状替代集合
        - 大量餐厅拥有直接自取、堂食和一方点餐选项
        - 本地用餐者、熟客，以及希望掌握渠道所有权的商户
        - 可避开 marketplace 费用，保留直接客户关系
        - 发现能力和配送密度弱于规模化平台
    notes: 公开规模混合了官方指标、官方网络口径和保留的第三方市场份额数据；失败公司行强调，单靠厨房基础设施不是护城河。
