  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 执行复杂度与整合范围风险
        blocks:
          - type: paragraph
            body: >-
              Wonder 已不再承销一个产品、一条运营循环。当前公开栈组合了多品牌本地餐厅平台、全国 Grubhub 市场、Blue Apron 餐包和履约中心运营、Relay 骑手网络、Tastemade
              媒体受众，以及快速增长的自有门店足迹。官方收购措辞把这种广度描述为通向用餐超级应用的路径，但同样的广度也解释了为什么执行风险异常高：每增加一项资产，就增加一套系统、劳动模型、利润率结构、品牌承诺和整合议程。直接证据不是推测。Wonder
              自己称 Grubhub 带来数十万商户和配送伙伴；Blue Apron 带有公开的持续经营、履约和食品安全风险因素；Tastemade 则把公司延伸到媒体和广告，而不只是厨房和物流。Marc Lore
              也公开绑定超级应用愿景，这增强了战略一致性；但如果执行受挫，或领导层带宽被太多同步动作拉伸，也会抬高关键人物依赖。
