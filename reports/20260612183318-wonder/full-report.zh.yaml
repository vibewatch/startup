        title: 客户分层与直接使用场景
        blocks:
          - type: paragraph
            body: >-
              Wonder 的客户基础已不再只是本地配送食客。自有 Wonder app 和网站面向终端消费者，满足他们不想拆分多个
              app、但又想要餐厅多样性的需求；产品明确围绕混搭、免费配送、自取、堂食和团体便利来营销。Philadelphia
              扩张报道尤其有用，因为它用直白语言描述了真实使用场景：口味不同的家庭、朋友群和办公室群体，仍可以下同一笔协调订单。Wonder 自身界面也显示了第二层供给侧参与者——Bobby Flay、José
              Andrés、Marcus Samuelsson 等名厨和餐厅品牌合作伙伴——其菜单让消费者主张形成差异。第三层已经以 B2B 形式可见。Wonder Spot
              面向办公室、职场、住宅楼和学校，提供批量配送；Wonder for Business
              则把带烤箱的餐食项目、授权概念和名厨品牌菜单卖给企业、校园、酒店、机场、体育场和酒店餐饮运营商。因此，公开证据支持一张宽客户分层图，但尚未披露分部收入组合、复购率，或仍集中在东北部和大西洋中部核心市场的需求占比。
