  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 消费者主张与厨房足迹
        blocks:
          - type: paragraph
            body: >
              Wonder 的消费者承诺直接，而且在拥挤配送市场里有差异化：一笔订单可以组合多家餐厅的菜品，进入同一个同步厨房流程，并仍在约半小时内送达。Wonder
              官方页面把配送、自取和堂食描述为并行模式，而不是彼此分离的产品；这点重要，因为同一批实体点位被期待用一个运营足迹服务数字订单、本地自取和有限堂食体验。Quakertown Walmart
              开业案例说明，这一承诺如何落到更小形态、依附零售商的厨房里：菜单是精选子集，而不是密集城市旗舰店的完整阵容。第三方报道也显示，本地半径被有意压得很紧，这有助于保护食品质量，但也让点位密度、骑手可用性和生产排序成为模型核心。结果是，一个快速精致餐饮主张表面上可信，但其经济性和运营容错看起来仍高度本地化，并且对执行敏感。
