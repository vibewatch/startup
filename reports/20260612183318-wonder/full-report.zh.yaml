      - number: '8.5'
        title: 退出准备度与投资逻辑失效触发点
        blocks:
          - type: paragraph
            body: >-
              未来 IPO 或大型战略退出，需要的不只是增长标题。公开市场需要看到，合并后公司不是简单聚合收入，而是在改善这些收入的经济性。优先级最高的观察项包括：Grubhub
              订单和份额稳定、分部层面利润率披露、Wonder 自有品牌能从市场平台流量中捕获有利润需求的证据，以及 Blue Apron 和 Tastemade 创造的不只是叙事期权。没有这些数据点，IPO
              很可能会因不透明和整合风险而被折价估值。


              如果出现四类情况，投资逻辑就会失效。第一，合并收入故事无法转化为可信的分部桥接，投资人无法拆分原有 Wonder 与收购业务线。第二，Grubhub 收缩速度快于协同到来，证明 Wonder
              买到的是流量，而不是持久经济性。第三，管理层披露有意义的整合进展之前又进行一轮融资，暗示 2025 年 5 月融资买来的只是时间，而不是证明。第四，公开可比公司估值下修，而 Wonder
              仍依赖私募市场溢价。任何一种结果都会把投资案例从合理到偏高，推向明显夸大。
