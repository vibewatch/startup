      - number: '6.4'
        title: 留存信号与反向压力
        blocks:
          - type: paragraph
            body: >-
              公开耐久性记录最强之处，是作为一组代理指标，而不是真正的留存台账。Wonder iPhone 条目显示约 39,000 个评分、4.9 分；JustUseApp
              反映同样的头部评分，同时也浮现出足够多负面评价，说明漏送、订单失败和感知质量不一致并非假设。Grubhub 的规模界面更大——App Store 4.6 million 个评分、4.8 分，Google Play
              上定位类似——但反向证据也更响。保留下来的 Trustpilot 页面显示平均 2.9/5，近期投诉围绕配送失败、冷食和弱客服。商业侧，Grubhub 称 Grubhub+ 会员每月下单 4 次，频率比非会员高近
              70%；Grubhub for Business 称超过五分之四客户报告年度食品成本节省，但这些仍是平台筛选指标，而不是客户群组表。更大的担忧是竞争压力。TechCrunch 报道 Grubhub 2025
              年月活用户同比下降 20% 至 8 million；Restaurant Business 称北美订单最近一个季度下降 11%，三年内下降超过 26%。因此，Wonder
              确有真实客户触达和清晰渠道广度，但仍缺少复购耐久性、客户集中度和具名 B2B 客户深度的公开披露。
