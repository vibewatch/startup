  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              Wonder 的乐观逻辑靠的是组合，而不是纯粹性。到 2025 年 5 月，公司又以超过 $7 billion 的估值融资 $600 million；QSR 报道其收入超过 $2 billion，已包含
              Grubhub；管理层仍把产品定义为高便利性的用餐平台，而不是单一形态的连锁餐厅。战略逻辑是，Wonder 可以把自营即食餐、Blue Apron 餐包、Grubhub
              市场平台需求、机构渠道、WonderWorks 式运营服务和 Tastemade 媒体，拼成一个获客与履约闭环。如果该闭环跑通，公开可比公司集合就不应只看餐厅，还应包括规模化市场平台和餐厅软件。


              反向逻辑是，合并后的收入底盘可能美化了质量，而不是经济性。$2 billion 数字包含 Grubhub，而 Wonder 是在 Just Eat Takeaway 以 $650 million
              出售该资产之后才买入，相比 2020 年 $7.3 billion 的购买价低约 91%。Consumer Edge 称，出售前 Grubhub 全国份额已降至 6%；Restaurant Business
              报道，North America 订单三年内下降超过 26%。Blue Apron 交割前文件显示有收入，但也有可观亏损。这意味着，当前估值只能作为带有转型期权的混合平台估值来辩护；若把它当作原有 Wonder
              本身已经配得上独角兽以上定价的证据，则难得多。
