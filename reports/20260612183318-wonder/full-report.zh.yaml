      - number: '1.4'
        title: 里程碑、规模指标与主要尽调风险
        blocks:
          - type: paragraph
            body: >-
              公开里程碑显示 Wonder 迭代很快。公司创立于 2018 年，2020 年推出移动餐厅模型，2023 年 2 月转向实体门店。之后约 18 个月里，公司叠加了 Blue Apron 收购、José
              Andrés 董事会任命、Walmart 门店合作、Relay 收购、Grubhub 宣布与交割、Tastemade 收购，以及新一轮 $600 million 融资。规模指标也随这些决策上移：Wonder 从
              2024 年 3 月的 11 家实体门店，增至 2024 年 11 月的 28 家门店加 7 家计划开业门店；随后到 2025 年 5 月为 46 家门店，2026 年初计划开业 90+ 家，并在官方招聘页给出
              2026 年底 200+ 家门店目标。最大的尽调风险藏在这条增长线下面。Blue Apron 是在公开市场深度崩塌后并入；Grubhub 的收购价较 Just Eat Takeaway 2020
              年买入价大幅折价，仍背负费率上限和盈利能力压力；Wonder 也没有公开拆分当前独立收入、员工数或客户数与正在整合的被收购业务。
