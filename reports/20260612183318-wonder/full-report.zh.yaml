      - number: '4.4'
        title: 财务结论与尽调阻断点
        blocks:
          - type: paragraph
            body: >-
              可投资结论是混合的。Wonder 显然已经搭建起比普通餐饮连锁更宽的收入栈，也筹集了足够资本，迫使市场认真看待平台命题。一方食品销售、Blue Apron 餐包、Grubhub
              市场和机构渠道、WonderWorks B2B 运营，以及 Tastemade 广告 /
              内容，给公司带来多次射门机会。同一组合也放大执行风险，因为它把门店级资本开支、厨房人工、配送密度、订阅经济性、商户侧变现和并购后整合，全部叠进一个资产负债表故事。


              阻断点集中在缺失的分母。公开来源没有提供当前账上现金、月度现金消耗、可支撑月数、原 Wonder 独立收入、渠道级毛利率、门店级吞吐、获客成本（CAC）、Wonder 持有 Blue Apron 后的留存，或
              Grubhub 流量中实际转化为 Wonder 自有食品销售的部分。这意味着本章能支持方向性判断——收入栈广度真实、资本强度高、利润率压力不轻——但不能搭出干净承销模型。在从 >$2 billion 合并收入或
              >$7 billion 估值标记中获得估值安全感前，尽调需要一份管理层材料，调和整个平台的融资额、分部收入、债务义务和现金消耗。
