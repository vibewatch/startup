      - number: '3.5'
        title: 对 Wonder 的承销含义
        blocks:
          - type: paragraph
            body: >-
              因此，最强的竞争框架是一组玩家，而不是单个对手。DoorDash 和 Uber 是直接的消费者需求现有玩家。Instacart 是用餐相邻的截流者。Grubhub
              是遗留市场资产，仍贡献细分渠道、商户工具和分发合作。CloudKitchens 是商户供给可比对象。Kitchen United 和 Reef 则是反面样本，说明厨房基础设施缺少持久需求所有权时会坏在哪里。


              这组资产给 Wonder 留出一条可能差异化的路径——组合自有品牌、市场触达和受控生产——但公开证据仍缺少能证明这条路径经济性更优的指标。开放问题也是投资人最难的问题：按都市圈对比 DoorDash 和 Uber
              的密度、按渠道的商户抽佣率和贡献利润率、按市场的厨房入住率，以及 Grubhub 流量到底有多少能转向 Wonder 自有品牌。在这些数字披露前，Wonder 的竞争故事可信，但尚未完全可承销。
