      - number: '3.3'
        title: 厨房基础设施是不同于市场份额的独立且更高风险战场
        blocks:
          - type: paragraph
            body: >-
              CloudKitchens、Kitchen United 和 Reef 重要，是因为它们从供给侧而非纯需求侧挤压 Wonder。CloudKitchens 并不声称拥有 DoorDash
              式消费者触达。它卖的是商户供给基础设施：私人厨房、即插即用式建设、为配送优化的点位，以及围绕「用一家店的价格开十家餐厅」搭建的轻资产叙事。这套推介与 Wonder
              模型中依赖厨房生产率、品牌密度和配送优先运营的部分直接重叠。


              失败可比案例同样重要。Restaurant Dive、QSR 和 Nation’s Restaurant News 都描述了 Kitchen United 在关闭 Kroger
              点位后退出实体单元、转回软件的过程。Bisnow、Commercial Observer 和 Restaurant Business 记录了 Reef
              在退出亏损幽灵厨房后关闭设施、裁员，并转向授权技术。教训不是厨房基础设施永远跑不通，而是如果基础设施没有持久消费者拉力或持久商户经济性，就可能变成资本黑洞，尤其是在疫情后餐厅客流正常化之后。
