        - 等更多证据
        - 当前估值已折入有意义的协同和整合成功
        - 更好的进入点要么是更低价格，要么是披露显著改善
    claimRefs:
      - CV006
      - CV007
      - CV033
      - CV043
      - CV044
      - CV045
    notes: 快照反映当前公开证据和建议逻辑，不是已谈判的投资条款书。
  - id: TV002
    title: 正方 / 反方投资逻辑表
    columns:
      - 支柱
      - 看多论点
      - 反方论点
      - 什么会改变判断
    rows:
      - - 收入规模
        - 合并收入计入 Grubhub 后已超过 $2B，Wonder 具备真实规模
        - 披露的收入底线是混合口径，无法证明原 Wonder 的经济性
        - 展示分部收入桥接和独立 Wonder 增长
      - - 平台宽度
        - Wonder 现在拥有一方餐食、市场需求、餐包、服务和媒体
        - 宽度可能只是并购整合故事，不是飞轮故事
        - 披露交叉销售、复购率和分部贡献利润率
      - - Grubhub 选择权
        - Wonder 以远低于前任所有者支付价的价格，买入大型流量网络
        - Wonder 可能买入了一个经济性仍弱的下滑资产
        - 展示交割后份额稳定和货币化改善
      - - 资本可得性
        - 多轮大额融资显示投资人兴趣强、战略支持足
        - 大额融资可能只是推迟经济性证明，而不是解决问题
        - 展示烧钱、跑道和收购协同兑现
      - - 可比公司支撑
        - 公开可比公司的销售倍数，使 3x 以上混合估值有讨论空间
        - 公开市场大概率会惩罚不透明的收购收入和整合风险
        - 披露足够信息，让市场不只按叙事给 Wonder 定价
    claimRefs:
      - CV003
      - CV004
      - CV006
      - CV007
      - CV015
      - CV017
      - CV018
      - CV033
      - CV034
      - CV035
    notes: 这些支柱概括的是基于保留公开来源形成的分析判断，而非管理层指引。
  - id: TV003
    title: 牛市 / 基准 / 熊市情景表
    columns:
      - 情景
      - 核心假设
      - 估值逻辑
      - 隐含区间
      - 概率信号
      - 下行触发因素
    rows:
      - - 牛市
        - 合并收入升至 $2.4B 以上，Grubhub 稳定下来，交叉销售以及软件 / 媒体组合改善收入质量
        - 以约 $2.4B-$2.5B 收入计，混合销售额倍数 3.5x-4.5x
        - ~$8.5B-$11.0B
        - 需要留存和分部利润率进展的证据，不能只靠融资支持
        - Grubhub 份额继续下滑，或协同未能出现
      - - 基准
        - 合并平台守住 >$2.2B 收入，没有重大整合事故，公开可比区间保持完好
        - 以约 $2.2B-$2.4B 收入计，混合销售额倍数 2.5x-3.5x
        - ~$5.5B-$8.5B
        - 与当前估值一致，但安全边际有限
        - 干净 KPI 披露前又来一轮大额融资
      - - 熊市
        - 市场平台继续流失，收购收入质量被证明较低，可比公司倍数压缩
        - 以约 $2.0B-$2.3B 收入计，混合销售额倍数 1.5x-2.0x
        - ~$3.5B-$5.0B
        - 当 Grubhub 恶化主导叙事时最可能出现
        - 下轮降价融资，或公开市场相对私募估值打折
    claimRefs:
      - CV007
      - CV017
      - CV018
      - CV040
      - CV041
      - CV042
      - CV044
      - CV045
    notes: 情景区间是锚定混合收入的公开市场启发式测算，不是完整运营模型。
  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 指标
      - 倍数 / 估值 / 状态
      - 与 Wonder 的相关性
      - 局限
    rows:
      - - DoorDash
        - 市值 / 年化 Q1 2026 收入
        - ~4.1x 销售额（$65.61B 市值，基于 $4.0B Q1 收入年化）
        - 最适合对照规模化市场配送和便利品聚合
        - 网络密度远大于 Wonder，公开披露也更干净
      - - Uber
        - 市值 / 年化 Q1 2026 收入
        - ~2.7x 销售额（$140.15B 市值，基于 $13.2B Q1 收入年化）
        - 可作为物流加商业的混合平台低区间可比
        - 收入包含出行和货运，食品配送可比性并不完美
      - - Instacart
        - 市值 / 年化 Q1 2026 收入
        - <2.4x 销售额（约 $9.694B 市值，基于 >$1.0B Q1 收入年化）
        - 相关性来自广告、市场平台和零售赋能都叠在交易之上
        - 杂货组合和资本强度与 Wonder 厨房明显不同
      - - Toast
        - 市值 / 年化 Q1 2026 收入和 ARR
        - ~2.2x 销售额或 ~6.5x ARR（$14.39B 市值；$1.63B Q1 收入；$2.2B ARR）
        - 餐厅软件相邻赛道中，最适合支撑更高质量经常性收入框架
        - Toast 由软件驱动，不是厨房驱动，利润率结构比 Wonder 更干净
      - - Grubhub 交易
        - 收购价值 / 继承规模
        - 按 Wonder 收购价计，为 2023 年 GTV 的 0.08x、2023 年调整后 EBITDA 的约 6.9x
        - 显示 Wonder 因资产受损而低价买入规模
        - 交易价值反映困境和交易结构，不是稳态公开市场倍数
      - - Olo
        - 最后已知市值
        - 2025 年 10 月 3 日最后已知市值约 $1.74B
        - 对餐厅点餐工具这一小盘软件相邻赛道有参考价值
        - 不是 2026 年 6 月的当前报价，且范围远窄于 Wonder 的合并模型
    enumerationScope:
      coverage: partial
      basis: >-
        Selected public comparables and transaction anchors that map to Wonder's blended model; not a full
        private-market comps book.
    claimRefs:
      - CV019
      - CV020
      - CV021
      - CV022
      - CV023
      - CV024
      - CV025
      - CV026
      - CV027
      - CV028
      - CV029
      - CV030
      - CV031
      - CV032
      - CV038
    notes: 可比组合有意混合，因为 Wonder 同时结合市场平台、一方餐食和软件相邻收入。
  - id: TV005
    title: 投资逻辑破裂和止损触发因素表
    columns:
      - 触发因素
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 分部不透明持续
        - 下一轮融资周期中，管理层仍无法披露 Grubhub 交割后的分部收入和利润率桥接
        - 投资人无法把高质量增长和收购堆出来的收入拆开
        - 将当前估值视为高估，避免承销普通股
      - - Grubhub 继续恶化
        - 份额仍在低个位数附近，或订单继续大幅下降
        - 最大的收购流量资产从飞轮变成拖累
        - 将估值推向熊市区间
      - - KPI 证明前又一轮大额融资
        - 整合 KPI 和协同证据公开前就需要新资本
        - 暗示 2025 年融资买到的是时间，不是证明
        - 假设更高稀释和私募估值脆弱性
      - - 可比区间压缩
        - DoorDash、Uber、Instacart 和 Toast 明显降级，而 Wonder 仍保持私有
        - 抽走当前私募估值下方的公开市场倍数支撑
        - 按更低公开基准重估 Wonder
      - - 协同故事令人失望
        - 增加资产后，交叉销售、抽佣率或单店数据仍未改善
        - 说明并购整合不足以提高收入质量，撑不起溢价倍数
        - 立场从合理到偏高下调为偏高
    claimRefs:
      - CV017
      - CV018
      - CV034
      - CV035
      - CV036
      - CV041
      - CV045
      - CV046
    notes: 触发因素聚焦最可能迫使倍数压缩或私募估值重置、且可监控的公开事件。
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - 分部收入桥接
        - Legacy Wonder、Grubhub、Blue Apron、Tastemade 和服务收入拆分
        - 没有它，>$2B 的标题数字就无法按质量估值
        - 管理层材料或贷方尽调包
      - - 分部利润率桥接
        - 主要业务线的毛利率和 EBITDA
        - 决定混合倍数应更像 DoorDash、Uber，还是困境资产
        - CFO 运营复盘和董事会材料
      - - Grubhub 交割后趋势
        - Wonder 接手后的订单、份额、GTV、抽佣率和促销负担
        - 最大的收购资产是估值质量最大的摆动因素
        - 月度运营 KPI 包
      - - Legacy Wonder 单位经济性
        - 单店销售额、四墙利润率、人力和租金占比、按 cohort 的回本周期
        - 显示不靠收购时，原始投资逻辑是否成立
        - 按市场划分的门店 cohort 模型
      - - 整合成本和协同跟踪
        - 一次性整合费用、重复人员、已实现节省
        - 判断并购整合复杂度是增厚还是摊薄时必不可少
        - 整合 PMO 报告
      - - 股权结构 / 优先权栈
        - 当前所有权、票据条款，以及任何清算优先权或反稀释条款
        - 没有资本结构可见度，私募估值更难解读
        - 法务或融资顾问材料
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV036
      - CV043
      - CV046
    notes: 每个问题都列出最低限度的私有证据，用来把「继续研究」推进到更明确的估值立场。
