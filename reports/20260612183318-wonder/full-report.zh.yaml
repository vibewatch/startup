  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代行为
        blocks:
          - type: paragraph
            body: >-
              Wonder 不应只因为卖食物，就按全美国餐饮支出来承销。其相关市场是餐饮需求中的一个子集：消费者通过数字渠道发现、下单，并由市场、品牌 app 或配送优先的厨房网络完成店外履约。IMARC
              的美国在线食品配送市场口径，以及 Grubhub 的消费者和商户界面，都指向同一条边界：可变现机会出现在消费者重视快速多餐厅选择、商户购买触达或工具、最后一公里物流能把意图转成复购的地方。


              外层天花板仍有意义，但只作为天花板。National Restaurant Association 对 2026 年 USD 1.55 trillion 销售额的预测，以及 BLS 宽口径 NAICS 722
              定义，说明总体食品服务远大于 Wonder 眼前收入池。USDA 的外出就餐框架也有助于把杂货和居家烹饪同餐厅驱动需求分开。这点重要，因为 Wonder 面对的现状替代不只是其他配送
              app；还包括堂食、电话直接订外带、居家烹饪，以及不经过第三方或品牌数字下单流程的杂货或餐包场景。
