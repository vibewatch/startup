chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品模型与地域足迹
        blocks:
          - type: paragraph
            body: >-
              Wonder
              将自己描述为一种新型美食广场，目标是让好食物更容易获得，并成为「用餐超级应用」。官网和使命页面持续把核心产品呈现为多餐厅下单：顾客可以在同一笔订单中混搭多个餐厅概念的菜系，再通过配送、到店自取或堂食，从配送优先的门店完成服务。作为餐厅运营商，Wonder
              的供给策略异常宽：它把自有菜单、名厨品牌和来自全美的合作餐厅概念放在一起，同时仍承诺 30 分钟内服务。官方配送和使命页面显示，其在纽约、新泽西和宾夕法尼亚构成密集的东北部足迹；行业报道则把 Wonder
              定位为纽约公司，正在向相邻东北部市场扩张，尚不是全国性实体覆盖。这一地域属性很关键，因为公司运营模型靠紧凑配送半径、密集厨房利用率和可复制的本地扩张，而不是纯市场聚合。
