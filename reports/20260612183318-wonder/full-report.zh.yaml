  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 资本结构、融资时间线与收购负担
        blocks:
          - type: paragraph
            body: >-
              Wonder 的财务故事从融资规模开始，而不是从经审计披露开始。公开报道和官方公告显示，2023 年底到 2025 年中，公司连续发生多笔大型资本事件：2023 年 11 月 Nestlé 的 $100
              million 战略投资；2024 年 3 月 $700 million 成长轮，其中包括 Marc Lore 的 $100 million；2024 年 11 月 Grubhub 公告，交易通过 $650
              million 企业价值结构加一笔来自新投资者的单独 $250 million 融资来支持；以及 2025 年 5 月估值超过 $7 billion 的另一轮 $600 million
              融资。这条序列重要，因为它显示 Wonder 同时为地域扩张和快速整合策略融资。


              负担端同样重要。已公开披露的收购对价，在 Blue Apron（$103 million）、Grubhub（$650 million 企业价值）和 Tastemade（约 $90 million）之间已经至少合计
              $843 million；这还未计入未披露的 Relay 对价，也未计入正常门店建设、人工爬坡和系统整合成本。换句话说，即使 Wonder
              筹得巨额资本，其中很大一部分很可能已经被收购或与收购挂钩的融资占用，而不是纯粹用于有机四壁扩张。由此产生的承销问题，不是 Wonder
              能否融资，而是合并后的业务能否在下一轮大型融资周期到来前，把这笔钱转成持久现金生成。
