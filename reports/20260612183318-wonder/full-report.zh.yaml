      - number: '8.3'
        title: 可比公司集合与混合倍数逻辑
        blocks:
          - type: paragraph
            body: >-
              公开市场里，最干净的框架是把 Wonder 视为混合的配送、commerce 和餐厅赋能平台。DoorDash 2026 年 6 月市值为 $65.61 billion；相对 Q1 2026 收入 $4.0
              billion，隐含约 4.1x 年化销售额。Uber 2026 年 6 月市值为 $140.15 billion；相对 Q1 2026 收入 $13.2 billion，隐含约 2.7x 年化销售额，尽管
              Uber 的业务组合比食品配送更宽。Instacart 在 Q1 2026 季度 GTV 超过 $10 billion、季度收入超过 $1 billion；Yahoo Finance 显示其市值约 $9.7
              billion，隐含低于 2.4x 年化收入。Toast 2026 年 6 月市值为 $14.39 billion；其 Q1 2026 收入为 $1.63 billion，年经常性收入（ARR）为 $2.2
              billion，支持约 2.2x 年化收入，或约 6.5x ARR。


              放在这一估值带里，Wonder 的表观估值按混合收入看，不像围绕 $7 billion 私募估值的叙事暗示得那么离谱。如果唯一稳妥的收入底盘是超过 $2 billion 且包含 Grubhub，隐含倍数低于
              3.5x 销售额。这高于 Uber 和 Instacart 类混合 commerce 估值，但低于 DoorDash 的运行率销售额倍数，也远低于 Toast 的 ARR 框架。问题在组成。Wonder 的 $2
              billion 数字包含
              Grubhub，因此也包含一个份额下滑的困境资产、继承来的低质量市场平台经济性，以及未解决的整合问题。因此，私募估值可以用混合可比公司解释，但只能落在合理区间上半段附近，并且前提是管理层能在滚动收购之后证明交叉销售、留存和利润率改善。
