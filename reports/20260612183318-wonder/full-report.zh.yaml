      - number: '2.3'
        title: Wonder 加 Grubhub 的买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              Wonder 的组合模型是多边的。最显性的用户是自费食客，追求便利、选择丰富和快速复购。但付款方和预算所有者会随使用场景变化。家庭或团体订单可能仍来自消费者钱包，决策逻辑却会转向多样性和订单合并。Grubhub
              的市场广度、商户中心和校园页面显示，Wonder 也触达为曝光或直接下单工具付费的商户买方、用 meal plan 或校园卡支付的学生或高校相关用户，以及用批准预算资助工作餐的雇主或管理员。


              这种分层很重要，因为它改变了「市场份额」的含义。一笔 Wonder 订单不总是一个家庭买一餐；它也可能是一笔校园交易、一顿雇主赞助餐，或商户通过市场加一方下单栈实现变现。DoorDash 和 Uber
              的职场及跨渠道材料进一步说明，最大平台越来越多地在配送、自取、订位和办公室用餐之间争夺同一个用餐场景。因此，Wonder 的 Grubhub 资产把买方覆盖从纯 DTC 厨房命题向外扩展。
