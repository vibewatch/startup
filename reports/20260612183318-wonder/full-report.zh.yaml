      - number: '4.3'
        title: 成本结构、利润率压力与可比经济性
        blocks:
          - type: paragraph
            body: >-
              公开数据表明，Wonder 最难的财务工作在收入线以下。Blue Apron 收购前申报史显示，当餐包规模跑不赢营销、履约和留存摩擦时会发生什么：Blue Apron 2022 年净收入为 $458.5
              million，但 GAAP 口径仍亏损 $109.7 million，调整后 EBITDA 口径亏损 $79.3 million。Grubhub 继承而来的 2023 年经济性更好，但也绝谈不上干净：Just
              Eat Takeaway 披露订单 237 million、GTV €8.06 billion、调整后 EBITDA €94 million，以及营运资本变动前自由现金流为负 €77
              million。这些数字解释了 Wonder 为何能以低价买下一项已具规模的配送资产，也解释了整合上行仍然带有猜测性。


              已规模化的公开可比公司也说明，即使网络密度大得多，经济性仍可能很薄。DoorDash 2026 年 Q1 结果隐含约 12.8% 的 Marketplace GOV 净收入率，GAAP 毛利占 GOV 仅
              6.2%；Uber 的调整后 EBITDA 利润率占总预订额 4.6%。这些不是 Wonder
              指标，但可作为有用护栏：即使品类领导者，也需要物流密度、受控促销和有纪律的抽佣架构，模型才跑得通。在这个背景下，New York City 费用上限、餐厅佣金抱怨、劳动密集度、食物浪费和门店建设，仍都是
              Wonder 真实的利润率压力向量。
