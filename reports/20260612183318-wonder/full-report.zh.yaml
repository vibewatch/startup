      - 可衡量收益
      - 限制
    rows:
      - - 满足一群人口味各异的用餐需求
        - 打开一个应用，在多种菜系之间组一个购物车
        - Wonder 多餐厅点单
        - 少切换应用，一次协调配送
        - 菜单宽度取决于本地门店和合作方组合
      - - 快速吃到晚餐，同时不接受低端品质
        - 使用附近本地厨房，选择配送或自取
        - 同步备餐的快精品食堂模型
        - 约半小时服务叙事，叠加厨师品牌菜单
        - 承诺受半径影响，且没有合同背书
      - - 回家路上取餐
        - 从附近 Wonder 门店提前下单
        - 自取嵌入同一门店和应用流程
        - 省去配送费，同时保留多餐厅选择
        - 自取吞吐指标没有公开
      - - 门店支持时现场用餐
        - 使用 Wonder 食堂用餐区
        - Wonder 食堂提供堂食，包括更大规格 Walmart 门店的座位
        - 让同一厨房资产覆盖更多用餐场景
        - 堂食范围看起来因门店而异，并非普遍提供
