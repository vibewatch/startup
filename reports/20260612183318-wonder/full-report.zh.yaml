      - number: '7.3'
        title: 运营、质量、劳工与声誉风险
        blocks:
          - type: paragraph
            body: >-
              运营风险最容易打穿 Wonder 的多业务战略。Blue Apron 自己的 10-K
              展示了食品运营会怎样出错：人手短缺会迫使公司更多使用临时工，成本更高、表现更差，进而导致订单延迟或取消；该文件还警告，食品安全事件和召回会引发诉讼、执法和需求受损。放到 Wonder
              内部，这些失败模式影响更大，因为它给消费者的承诺，是用一个界面交付多个品牌，同时守住一致性、速度和温控。劳工证据也已经偏负面，并非假设。报道称，Wonder 旗下 Relay 曾就 New York
              工人停用问题达成和解，之后退出该市；抗议者也公开指控 Wonder 旗下 Grubhub
              存在不公平停用。因此，声誉风险同时压在两层上：面向客户的失败——迟到、变冷或口味不稳定——会伤害复购；面向工人的争议会挤压招聘、监管和品牌信任。缓释逻辑确实存在——Relay
              公开营销其可支持利润率、提供可预测骑手收入并保障准时送达——但公开证据仍未显示合并后公司当前的投诉率、事件频率或各业态层面的一致性。
