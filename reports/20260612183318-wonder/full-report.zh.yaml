      - number: '7.4'
        title: 缓释因素、监测指标与投资逻辑失效触发点
        blocks:
          - type: paragraph
            body: >-
              本章并不是单向的下行清单，因为 Wonder 确实有证据支撑的缓释因素。管理层可以指向 Grubhub 带来的更大商户和配送基础、仍在扩张的自有门店版图、公开描述过的扩张打法，以及 Relay、Blue
              Apron 和 Tastemade 带来的能力延伸。问题在于，这些资产会彼此强化，还是只会让组织更难管理。尽调中，可监测指标比公开答案更清楚。如果 Grubhub 的份额、留存或订单增长继续落后，而
              DoorDash 和 Uber
              继续交出强劲用户和订单额增长，收购逻辑就会变弱。如果新的劳工和解、停用或市场退出再次出现，物流栈就不足以顶住监管环境。如果门店继续扩张，但公司无法证明贡献利润率改善或补贴需求下降，资本强度就会成为主导风险。如果
              Marc Lore 仍然是战略上最可见的设计者，却没有同样可见的管理梯队，治理和接班风险就应被明确承销，而不是当作背景噪音。
