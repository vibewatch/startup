      - number: '5.2'
        title: 通过 Grubhub、Blue Apron、Relay 和 Tastemade 扩展网络
        blocks:
          - type: paragraph
            body: >
              2023 年后的产品故事，是用扩展同时拓宽供给和使用场景。Grubhub 贡献全国商户密度、骑手网络、商户工具、订阅、校园下单和企业餐管理；Blue Apron 增加餐包，以及可放进同一个用餐 app
              的加热即食库存；Relay 加深 Wonder 核心地域的最后一公里控制；Tastemade 增加发现和内容，而不是物流。公开页面清楚表明，Wonder
              希望这些组件互相强化，而不是作为彼此割裂的收购资产存在。最清晰的证据是，公司计划把部分 Grubhub 商户放进 Wonder app，同时把 Wonder 品牌上架 Grubhub，实际上让 Wonder
              同时成为一方运营商和需求聚合器。这种广度创造战略上行，但也意味着一次客户会话未来可能跨越名厨品牌菜单、第三方商户、忠诚度权益、商务餐预算、餐包履约和内容驱动发现。因此，整合深度既是产品特性，也是系统风险倍增器。
