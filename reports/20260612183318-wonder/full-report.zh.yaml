            body: >
              Grubhub 的公开商户栈比 Wonder 自有厨房栈记录充分得多，因此是外部观察合并平台如何运营的最佳入口。商户门户在 Marketplace 和 Direct
              上暴露菜单、促销、评价、边界和订单控制；独立集成页面解释订单如何直接流入餐厅 POS 系统，以及配送责任如何在 Grubhub 车队和商户自配送之间切换。这些运营信号有意义，因为它们显示 Wonder
              继承的是可运行的商户基础设施，而不是必须从零搭建每一个 B2B 界面。公开招聘页面也显示 Wonder 和 Grubhub
              都在运营、产品和技术岗位上招聘，进一步说明公司不只是在扩张厨房，也在围绕厨房建设软件和协调能力。即便如此，公开质量控制仍主要是运营和营销导向——客服、保证、配送边界、评价工具和同步备餐——而不是工程披露，例如可用性目标、事故历史、可观测性实践或安全架构。
