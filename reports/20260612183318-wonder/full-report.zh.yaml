              Wonder 的直接消费者足迹仍是区域性的，但地域正在快速拓宽。Wonder app 在东海岸点位提供自取、堂食和免费配送；2026 年 Texas 公告则明确把扩张框定为从东北部和大西洋中部走向
              Dallas-Fort Worth、Houston、Austin 和 San Antonio。同一新闻稿称 Wonder 最近庆祝了第 100 家门店，并仍按节奏在 2026 年底前达到 200+
              家门店；这是本章保留的最强公开采用和足迹信号。本地市场报道补充了管理层如何在区域内扩展覆盖：Philadelphia 地区报道将其描述为拼图式打法，意在覆盖更多社区并扩大配送触达；Washington
              地区报道则称首批 DC 和 Rosslyn 门店，是区域内 8 家门店推出计划的开端。纳入 Grubhub 后，访问故事更全国化。Wonder 收购新闻稿称，Grubhub 带来超过 375,000
              家商户、200,000 名配送伙伴，并在美国绝大多数人口范围内提供物流覆盖。这使得直接 Wonder 覆盖仍是区域性的，但通过合并平台，食客和商户访问已显著更全国化。
