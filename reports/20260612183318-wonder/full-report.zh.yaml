      - number: '2.4'
        title: 增长驱动、渠道力量与采用约束
        blocks:
          - type: paragraph
            body: >-
              结构性需求驱动很清楚。IMARC 和 Mordor 都显示，移动 app 和数字支付现在主导下单体验。DoorDash
              的消费者研究补上了行为证据：配送会养成习惯，常带有自我安抚属性，并越来越多地连接跨渠道忠诚度。多样性同样重要。Grubhub 超过 400,000
              家餐厅的广度、云厨房供给扩张和商户侧工具，都降低了搜索和履约摩擦。具体到 Wonder，名厨或品牌驱动的供给，以及在同一笔订单中混搭多个概念的能力，与市场对便利加选择的更广偏好一致。


              摩擦同样重要。餐厅运营商仍承受利润率压力；即使市场增长，第三方佣金在经济上仍有分量。DoorDash 自身定价方案、Wharton 对 15% 至 30% 佣金的讨论，以及 Business of Apps
              关于配送成本远高于半个十年前的观察，都指向同一方向。监管并没有消除问题，只是重新分配问题。NYC
              的费用上限框架和配送员薪酬规则，仍让餐厅、平台和工人处在成本分摊拉扯中。因此，相关风险不是数字需求是否存在，而是参与者在费用、人工和促销之后，能否保住足够利润来创造持久价值获取。
