    title: 资本充足性表
    columns:
      - 指标
      - 公开数值 / 状态
      - 证据 / 时点
      - 承销含义
      - 尽调要求
    rows:
      - - Nestlé 战略投资
        - $100M
        - Nov-2023 战略投资，与食材 / 产品开发绑定
        - 显示有战略背书，但不是可循环流动性
        - 要求说明权利、商业义务，以及资金是否为特定项目隔离使用
      - - March 2024 成长股权融资
        - $700M，其中 Marc Lore 出资 $100M
        - Mar-2024 完成，扩张目标为 2024 年底 35 个点位、2025 年底 90 个点位
        - 大额股权缓冲支撑门店铺开和收购
        - 要求提供本轮条款、清算顺位，以及签署 Grubhub 前剩余多少资本
      - - Grubhub 相关融资
        - 新投资者出资 $250M
        - 与 Nov-2024 Grubhub 公告同步披露
        - 暗示收购融资需要新的外部股权，不只是既有资产负债表现金
        - 要求提供资金用途桥表，以及资金留在 HoldCo 还是运营子公司
      - - May 2025 融资
        - $600M，估值 >$7B
        - May-2025 报道，明确用于增长和 R&D
        - 增加流动性，但也抬高未来资本回报门槛
        - 要求提供投后所有权、优先权条款和当前现金余额
      - - 卖方 / 类债务义务
        - Grubhub 交易中的 $500M 优先票据
        - 属于 $650M 企业价值结构的一部分
        - 引入非普通股权利要求，会影响下行情境下的回收和现金偿付
        - 要求提供到期日、票息、契约条款和任何担保安排
      - - 已披露收购支出
        - '>$843M，不含 Relay 和自建扩张'
        - Blue Apron $103M + Grubhub $650M + Tastemade 约 $90M
        - 可见资本中很大一部分流向 M&A，而不只是新厨房
        - 要求提供完整收购现金 / 债务 / 股票对价明细和整合预算
      - - 手头现金
        - null
