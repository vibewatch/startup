      - number: '4.2'
        title: 收入栈与公开规模信号
        blocks:
          - type: paragraph
            body: >-
              Wonder 已不再像单一形态的餐厅运营商。其核心一方收入仍来自自有美食广场和配送优先厨房，让顾客订购合作名厨菜单，并选择配送、自取或堂食。但公开收入栈已经明显超出这个基础。Blue Apron
              增加餐包和即食餐收入。Grubhub 增加市场需求生成、商户工具、校园餐饮、企业餐项目和 Grubhub+ 订阅收入。WonderWorks 给出一个可支撑的 B2B 线索：CNBC 和 U.S. Chamber
              报道都称，Wonder 向第三方高客流运营商提供技术和菜单专有经验；CNBC 称该业务已经在会展中心、剧院、机场等 50 个外部点位活跃。


              最强的公开规模标记是方向性的，而不是干净分部。QSR 2025 年 5 月报道称，Wonder 包含 Grubhub 后收入超过 $2
              billion；同一来源称，管理层计划继续投资更快出餐时间、软件、菜单、厨师和餐厅合作。这有用，因为它确认合并平台按收入口径已经很大。但它仍不充分，因为公开来源没有拆出总收入中有多少来自原 Wonder
              食品销售、Blue Apron、Grubhub 市场活动、B2B 运营，或通过 Tastemade 继承的媒体和广告界面。因此，收入规模显然很大，但收入质量仍只看得到一部分。
