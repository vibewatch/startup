      - number: '2.5'
        title: 承销含义与剩余尽调缺口
        blocks:
          - type: paragraph
            body: >-
              最站得住脚的 Wonder
              市场口径，是数字下单餐食需求、配送优先运营模型和多边下单渠道的交集——不是整个餐饮经济，也不是单个巨大全球食品配送标题。餐厅销售天花板太宽，纯幽灵厨房估计又太窄，且往往不是美国特定口径。实际中更合适的中间地带，是美国
              app 介导的餐食需求，加上 Grubhub 能导入 Wonder 更广「用餐」平台的商户、校园和职场渠道。


              公开证据仍无法把这个框架转成精确的 Wonder SAM 或 SOM。缺失指标包括从 Grubhub 向 Wonder
              自有品牌交叉销售的比率、校园和企业订单贡献、按城市的本地密度、商户抽佣率，以及费用上限后的贡献利润率。在管理层披露这些数字前，本章应有意保留相互矛盾的市场估计，并把它们当作边界校验。这样能让分析保持诚实：市场无疑大到值得关注，但
              Wonder 能获取多少价值，取决于渠道经济性，而不只是品类收入增长。
