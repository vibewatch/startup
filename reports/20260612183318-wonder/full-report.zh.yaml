      - number: '7.2'
        title: 资本强度、竞争与监管利润率压力
        blocks:
          - type: paragraph
            body: >-
              核心下行情景在于，Wonder 一边要整合一个买得便宜、但实力已被削弱的市场平台资产，另一边还要面对两个体量大得多、仍在持续积累规模的竞争对手。第三方市场数据对 Grubhub
              当前确切份额并不一致，但方向判断一致：它的位置远落后于 DoorDash 和 Uber Eats，留存更弱，而且 Wonder 是在该资产经历严重价值毁损之后才买入。与此同时，线下扩张仍然要烧资本。Wonder
              自己的 Texas 新闻稿称，公司近期已达到 100 个门店，并计划到 2026 年底超过 200
              个门店；行业报道也称，公司同时募得大量外部资本，并继续追加收购。这意味着竞争和烧钱不是两类彼此独立的风险，而是相互绑定。如果 Grubhub 继续丢份额，或者门店增长需要持续补贴，Wonder
              可能在整合收益显现之前就需要新资本。监管会进一步放大问题。New York City 的永久费率上限和更严格的配送员规则已经改变最大城市配送市场的经济性，Wonder 控制的 Relay
              最终也表示，在更严监管下已无法在 New York 跑出可持续业务。
