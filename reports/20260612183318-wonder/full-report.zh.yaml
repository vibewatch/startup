        - 保留页面未见可比的头部佣金表
        - Marketplace 需求、自有渠道配送和 storefront 选项
        - 不同商户 cohort 的实际抽成率
        - 即便公开定价不那么明确，Uber 也以灵活性竞争
      - - Uber for Business 企业服务
        - 由政策管理的餐食预算，而不是消费者标价
        - 办公午餐、混合团队、支出可见性、Uber One 选项
        - 按雇主项目拆分的单位经济性
        - Uber 能拿下单靠消费者 app 覆盖不到的付款方控制场景
      - - Grubhub marketplace + Direct 市场 / 直连
        - 无前期成本或承诺；Direct 以免佣金营销
        - Marketplace、自取、自配送、补充配送、品牌站点
        - 广告和促销后的混合商户经济性
        - Grubhub 可以防守既要触达又要渠道所有权的商户
      - - Instacart 即食餐
        - 超过 $35 的当日订单配送费从 $3.99 起
        - 预制餐、personal shopper、通过 Instacart+ 抵扣的会员权益
        - 餐厅专属抽成率，因为餐厅流程在 app 内且由伙伴支撑
        - Instacart 更靠便利组合竞争，而不是经典餐厅佣金
      - - CloudKitchens 基础设施
        - 用开一家餐厅的钱开十家；超低前期投入
        - 预建厨房、托管基础设施、delivery-first 场地
        - 按市场拆分的实际租金、入驻率和利润率画像
        - 商户经济性从佣金计算转为设施利用率计算
      - - 传统直连点餐
