      - number: '1.3'
        title: 资本基础、利益相关方与整合策略
        blocks:
          - type: paragraph
            body: >-
              Wonder 的融资史显示，公司从概念验证到后期私营扩张的速度异常快。到 2023 年底，公司已完成一轮 $350 million 融资，估值约 $3.5 billion，随后又获得 Nestlé 的 $100
              million 战略投资。2024 年 3 月，Wonder 完成 $700 million 融资，其中包括 Lore 本人追加的 $100 million，以及覆盖 NEA、GV、Accel、Bain
              Capital Ventures、Forerunner 和新投资方的广泛财团。资本叙事随后与 M&A 融合：Blue Apron 带来餐包，Relay 带来最后一公里配送基础设施，Grubhub
              带来全国市场触达，Tastemade 带来媒体和内容分发。Wonder 在宣布 Grubhub 交易时还披露额外 $250 million 资本，并于 2025 年 5 月以 $7 billion 以上估值再融
              $600 million。合在一起看，这是一家创始人主导的私营整合者，靠股权、战略投资者和资产收购，把产品扩张压缩进很短窗口。
