      - number: '8.4'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              悲观情景把 Wonder 视为一个质量参差的滚动收购平台，且最大收购资产还在继续被侵蚀。如果合并收入只是略高于 $2 billion，如果 Grubhub 份额继续下滑，而且配送和 commerce
              的公开市场倍数压缩到约 1.5x 至 2.0x 销售额，那么 $3.5 billion 至 $5.0 billion
              左右的估值区间，比今天的估值更容易辩护。这个情景下，私募轮最终看起来像是在整合证据出现之前拿到的一次估值上调。


              基准情景假设合并平台稳定下来，市场继续按约 2.5x 至 3.5x 收入的区间给规模化餐食 commerce 和餐厅赋能业务定价。在合理的 $2.2 billion 至 $2.4 billion
              混合收入底盘上，对应约 $5.5 billion 至 $8.5 billion 的价值区间。在这个框架下，当前超过 $7 billion 的估值有支撑，但不便宜。乐观情景同时要求增长和质量升级：收入稳定高于
              $2.4 billion，Grubhub 能向 Wonder 自有品牌可信地交叉销售，分部利润率可见度提升，投资人也愿意为一个更像规模化超级应用、而不是拼接资产组合的平台支付 3.5x 至 4.5x
              混合销售额。该情景对应约 $8.5 billion 至 $11.0 billion，更像是热情的私募市场定价所隐含的情况，而不是当前公开披露已经证明的情况。
