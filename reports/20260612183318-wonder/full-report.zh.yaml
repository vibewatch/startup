  - id: TI005
    title: 公开财务缺口表
    columns:
      - 缺失指标
      - 为什么重要
      - 当前公开代理指标
      - 具体尽调路径
      - 承销影响
    rows:
      - - 手头现金
        - 决定 Wonder 能否在不再次融资的情况下整合资产并建设点位
        - 公开信息只有“现金跑道充足”这类定性表述
        - 要求提供最新月度资产负债表，区分非受限与受限现金
        - 无法建模现金跑道和下行保护
      - - 月度现金消耗 / 现金转化
        - 把增长和价值毁损分开
        - 未留存公开月度现金消耗数字
        - 要求按分部和总部提供过去 12 个月月度现金流
        - 资本充足性仍停留在叙事层面，不是量化判断
      - - 现金跑道月数
        - 用于判断下一次融资事件的紧迫性
        - 未留存公开月数
        - 要求提供董事会基准 / 下行现金跑道材料，包含契约触发条件
        - 没有融资时点清晰度，估值支撑更弱
      - - Legacy Wonder 独立收入
        - 合并 >$2B 数字掩盖自有厨房模式本身产出多少
        - QSR 称 >$2B 且包含 Grubhub
        - 要求提供从 legacy Wonder 到合并平台的月度 / 年度收入桥表
        - 无法知道原始模式在经济性上是否已被证明
      - - 渠道层面毛利率
        - 只有收入组合不够；每条收入流的服务成本可能差异很大
        - DoorDash 和 Uber 只能提供外部类比
        - 要求按 Wonder 美食厅、Blue Apron、Grubhub marketplace、机构渠道和媒体拆分毛利率
        - 无法判断利润率质量
      - - 点位吞吐 / 厨房利用率
        - 投资逻辑依赖高密度厨房产出和配送半径
        - 扩张目标和点位数量公开，但利用率不公开
        - 要求按点位队列提供每人工小时订单数、出票时间和吞吐
        - 四墙护城河主张仍未证明
      - - Wonder 持有下的 Blue Apron 留存和 AOV
        - 决定被收购的 meal-kit 渠道是在企稳，还是仍在下滑
        - 公开信息只有交割前历史亏损和渠道存在
        - 要求提供收购以来的活跃客户、复购频次、AOV 和流失
        - meal-kit 收入可能摊薄价值，而不是增厚价值
      - - Grubhub 到 Wonder 的交叉销售
        - roll-up 逻辑假设自有品牌能变现 marketplace 流量
        - 商户 / Wonder app 整合公开，但缺少转化数据
        - 要求提供从 Grubhub 食客到 Wonder 自有订单的漏斗，以及分路径 CAC
        - 无法承销协同逻辑
      - - 员工人数和整合成本
        - roll-up 复杂度可能隐藏重复管理开销和重组成本
        - 未留存可靠合并公开数字
        - 要求按分部提供当前员工人数，以及一次性整合预算和已实现节省
        - 经营杠杆假设仍是推测
    notes: 每一行都点出一个具体缺失分母，以及清除该缺口所需的具体尽调要求。
