      - number: '3.4'
        title: 替代选择、监管和商户多栖让切换成本保持低位
        blocks:
          - type: paragraph
            body: >-
              Wonder 不应假设餐厅配送需求会永远锁在少数几个 app 里。传统餐厅和本地独立商户仍有多条替代路径：堂食、直接自取、餐厅自有网站，以及由同时运营市场的中间商出售的一方下单工具。Grubhub
              Direct、DoorDash Online Ordering，以及 Uber 的 storefront 和托管餐食界面，都让商户更容易多栖，而不是押注单一渠道。这削弱了「市场一旦规模化就自动拥有供给」的论点。


              经济性也仍有争议。National Restaurant Association 称，尽管 2026 年餐厅销售额预计达到 USD 1.55 trillion，去年仍有 42% 的运营商未盈利。NYC
              仍将配送费上限设为 15%、交易费上限 3%、基础服务费上限 5%；Wharton 和 The Regulatory Review 都强调更广品类中 15% 至 30% 的佣金压力。对 Wonder
              来说，竞争不只是 app 份额之争，也是谁的模型能给商户留下足够毛利、给食客留下足够便利，并给平台留下足够贡献利润率。
