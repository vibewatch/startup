      - number: '3.2'
        title: 相邻渠道和遗留资产仍可能在 Wonder 看到需求前改道用餐意图
        blocks:
          - type: paragraph
            body: >-
              Wonder 的竞争地图比简单的 DoorDash 对 Uber 框架更宽。Instacart 是相邻而非相同玩家，但这种相邻关系很重要，因为它捕获杂货、即食餐和便利场景，而这些场景很容易替代餐厅配送。其
              10-K 称覆盖 98% 的北美家庭和超过 1,800 个零售品牌；其消费者界面现在也包括由 Uber Eats 提供支持的即食餐和餐厅下单。这意味着食客还没打开传统餐厅市场，餐食意图就可能被截走。


              与此同时，对 Wonder 来说，Grubhub 作为自有分发资产的战略价值，大于其作为当前全国份额领导者的价值。Grubhub 仍提供市场、直接下单、多种履约模式、校园卡下单，以及其称覆盖 4,000
              个城市、超过 415,000 家合作伙伴的商户基础。Starbucks、Amazon 和 Wonder app 分发关系说明，即使失去全国消费者份额，这项资产仍很重要。Wonder
              自身界面又多了一层变化：不同于纯市场，它试图把需求捕获与自有餐厅、受控履约结合起来。这在战略上比单一 app 更丰富，但也抬高了执行门槛。
