      - number: '2.2'
        title: 规模测算口径与互相矛盾的市场估计
        blocks:
          - type: paragraph
            body: >-
              证据支持分层市场视角，而不是一个万能 TAM。IMARC 给出最干净的美国数字下单口径：2025 年 USD 34.88 billion，到 2034 年增至 USD 75.36
              billion。这个规模显著小于美国餐饮总销售天花板，也远小于 Mordor 和 Fortune 发布的全球在线食品配送总量。与此同时，Grand View
              的云厨房市场更小，因为它测的是一种运营形态，而非全部配送需求。对 Wonder 来说，这些嵌套层次有用：它们把可投资问题从全部食品服务，收窄到 app 介导的用餐需求，再收窄到 Wonder
              实际建设的配送优先、多品牌供给层。


              各家机构估计互相矛盾，不是尴尬，反而有信息量。有些发布方强调 GMV 式数字下单流，有些强调更窄的收入池，有些只覆盖幽灵厨房基础设施层。因此，这些范围应作为不同口径保留下来。Wonder
              的市场章节应把宽口径食品服务天花板、更窄的美国在线配送需求池和云厨房运营层并排呈现，而不是折叠成一个没有支撑的 SAM 数字。
