              公开材料指向一条雄心很大的路线图：更多实体点位、更多地域、通过 Grubhub 增加商户供给，并借 Blue Apron 和内容发现提高每个用户的用餐场景数。问题不再是 Wonder
              能否吸引供给，而是当栈变宽时，公司能否让编排、质量和单元经济性保持一致。指向 B2B 或 Wonder Works 式扩展的最强公开线索，是 Nestle
              合作报道中提到厨房设备和预制食材分发；但公开层面仍没有强产品页面描述设备客户、白标部署或企业软件模块。核心厨房生产软件和性能指标也存在同样披露缺口。因此，投资人可以承销一个有吸引力的产品命题——本地厨房网络向用餐平台扩张——但也应把架构不透明、Walmart
