  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 现有市场平台仍掌握最难的控制点：消费者需求捕获
        blocks:
          - type: paragraph
            body: >-
              Wonder 面对的最尖锐竞争差异仍是规模。DoorDash 和 Uber 不只是替代 app；它们是密集、能养成习惯的消费者网络，订单速度、会员体系和商户广度足以同时改善履约速度和发现效率。DoorDash
              进入 2026 年时，季度订单为 933 million、Marketplace GOV 为 USD 31.6 billion，会员注册创纪录；Uber 披露 3.6 billion 次行程、USD 53.7
              billion 总预订额和 50 million 名 Uber One 会员。这些数字重要，因为它们暗示的不只是表层体量：还意味着更多复购行为数据、更强的会员补贴能力，以及在更广地域内维持可接受配送时长的密度。


              公开份额数据强化了这一点。Consumer Edge 估计 DoorDash 到 2024 年底拥有 60.7% 的美国食品配送份额，Uber Eats 为 26.1%，Grubhub 为 6.3%。对
              Wonder 来说，基准不是其产品在单一城市是否显得差异化。真正基准是，Wonder 能否建立足够本地密度和复购行为，去对抗已经主导主流餐厅配送场景中发现、结账和再下单循环的平台。
