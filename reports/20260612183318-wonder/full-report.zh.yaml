      - number: '8.6'
        title: 建议与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              正确建议是继续研究。公开证据足以解释为什么成熟投资人可以把 Wonder 定价在 $7 billion 以上：合并收入已经很大，平台如今覆盖自营餐食、市场平台需求、订阅、机构渠道及相邻软件 /
              媒体，公开可比倍数也没有低到让混合销售额超过 3x 的估值不可能。证据还不足以说估值显然有吸引力，因为公司尚未公开拆分原有 Wonder 与 Grubhub、Blue Apron、Relay 或
              Tastemade 的经济性。


              因此，估值落在合理与偏高之间的狭窄区间。如果管理层能证明超过 $2 billion 的收入守得住、Grubhub 交易量在 Wonder
              内部能被更有效变现、分部利润率是在改善而不只是被合并，当前估值可以显得合理。反之，如果滚动收购主要导入的是低质量收入，而下一轮融资早于清晰整合证据到来，估值就会像是给走弱资产盖上的私募市场估值上调。因此，尽调解锁点很具体：分部收入桥、location-level
              unit economics、Wonder 持有期间 Grubhub 订单 / 份额及 take-rate 趋势、收购协同跟踪、员工数和整合成本披露，以及当前 cap table 或 preference
              stack 视图。
