      - number: '1.2'
        title: 创始人、领导层与治理披露面
        blocks:
          - type: paragraph
            body: >-
              Wonder 仍与创始人 Marc Lore 强绑定。独立人物报道和公司邻近来源一致将 Lore 描述为创始人、董事长兼首席执行官；他此前创办 Jet.com，并在 Walmart 收购 Jet 后负责
              Walmart U.S. eCommerce，积累了信用。Lore 以下的公开治理披露更薄，但可见领导格局仍有信息量。José Andrés 于 2023 年 11 月正式加入董事会，在 Wonder
              扩展名厨合作模型和整合 Blue Apron 时，带来明星主厨层面的治理背书。Daniel Shlossman 公开身份为首席营销与增长官，是增长、合作和单店经济上最清晰的非创始人发言人。Jason Rusk
              出现在运营和扩张报道中；Larry Fitzgibbon 则通过 Tastemade 收购加入，负责 Wonder
              的媒体和内容业务。因此，现有记录支持一个创始人中心的运营模型，并选择性披露职能负责人，但没有给出完整的当代高管名单或收购后完整董事会名单。
