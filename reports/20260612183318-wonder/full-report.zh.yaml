      - number: '8.2'
        title: 融资背景、收购负担与估值纪律
        blocks:
          - type: paragraph
            body: >-
              关键锚点公开且异常庞大。Wonder 2024 年 3 月融资 $700 million，当时目标是在 2024 年底达到 35 个门店、2025 年底达到 90 个门店；U.S. Chamber
              后来称，该轮使累计融资达到 $1.5 billion。2024 年 11 月，Wonder 同意以 $650 million 企业价值结构收购 Grubhub，其中包括 $500 million 高级票据和
              $150 million 现金，同时宣布另有 $250 million 新投资人资本。2025 年 5 月，Wonder 又以超过 $7 billion 的估值追加 $600
              million。这一序列显示，公司正在从铺店融资，升级为由收购驱动的平台融资。


              估值纪律很重要，因为可见的收购账单已经很重。Blue Apron 花费 $103 million，Grubhub 花费 $650 million，Tastemade 据报道约 $90 million；在计入
              Relay 对价、新店资本开支、整合费用或正常烧钱之前，已披露 M&A 就超过 $843 million。公开来源仍未披露 Wonder 独立收入、Grubhub
              并表后分部利润率、账上现金，或完整优先股堆叠。因此，当前估值应被视为一个私募融资数据点，而不是已经充分承销的内在价值。它有用，但不充分，因为估值分母大多是混合的，且部分来自收购。
