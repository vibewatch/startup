        - Remediation policy and refund economics are not fully detailed
      - - Employer budget and tax controls
        - Publicly visible
        - Grubhub for Business administrative controls
        - Wonder-specific enterprise security or audit posture is not public
      - - Hiring and privacy disclosures
        - Publicly visible but non-product
        - Wonder careers page discloses AEDT use and applicant privacy materials
        - Equivalent public security or privacy architecture for the consumer platform is not surfaced
    notes: The public record is stronger on operating controls and administrative workflows than on classic software-trust artifacts such as security docs, uptime history, or public incident reporting.
