callouts:
  - calloutType: strength
    title: Multi-occasion mealtime stack is the real product
    body: >
      Wonder's differentiation is not only multi-restaurant ordering. The larger product thesis is one surface that can eventually route diners into owned kitchens, third-party merchants, meal kits, campus programs, corporate budgets, and content-led discovery.
    claimRefs:
      - CE013
      - CE023
      - CE024
      - CE027
      - CE031
      - CE041
  - calloutType: risk
    title: Public architecture disclosure lags product ambition
    body: >
      The combined platform surface is broad, but public evidence says much less about the core kitchen-software stack, observability, and incident handling than it does about merchant-facing controls. That opacity leaves execution risk higher than the consumer story alone suggests.
    claimRefs:
      - CE033
      - CE035
      - CE037
      - CE038
      - CE039
