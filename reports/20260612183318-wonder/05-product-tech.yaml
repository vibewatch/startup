  - id: roadmap-and-open-questions
    title: Roadmap implications and remaining diligence gaps
    body: >
      Public materials point to an ambitious roadmap: more physical locations, more geographies, more merchant supply via Grubhub, and more occasions per user via Blue Apron and content discovery. The question is no longer whether Wonder can attract assortment; it is whether the company can keep orchestration, quality, and unit economics coherent as the stack broadens. The strongest public clue toward a B2B or Wonder Works-style extension is the Nestle partnership coverage describing kitchen equipment and prepared-ingredient distribution, but there is still no robust public product page describing equipment customers, white-label deployments, or enterprise software modules. The same disclosure gap exists for core kitchen-production software and performance metrics. Investors can therefore underwrite a compelling product thesis—a local kitchen network expanding into a mealtime platform—but should also treat architecture opacity, Walmart-format repeatability, and channel-by-channel economics as open diligence items rather than solved facts.
