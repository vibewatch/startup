  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / process / component
      - Role
      - Dependency
      - Risk
    rows:
      - - Consumer ordering surfaces
        - Capture browsing, cart building, and mode selection for delivery, pickup, and dine-in
        - Wonder app and web plus Grubhub consumer marketplace
        - Multiple front doors increase consistency and identity-management burden
      - - Catalog and merchant configuration
        - Maintain menus, hours, promotions, reviews, and restaurant details
        - Grubhub merchant portal and partner restaurant data
        - Catalog mismatch or stale hours can break the coordinated order promise
      - - Cart and benefit logic
        - Apply one-cart ordering across restaurants plus loyalty and pickup credits
        - Wonder ordering logic, Grubhub+, campus rules, and corporate budgets
        - Rule conflicts can hurt margin or user experience
      - - Kitchen sequencing layer
        - Coordinate when different items should start and finish
        - Wonder-owned production software and in-store execution
        - Core scheduling logic is not publicly documented
      - - Dispatch and boundary control
        - Decide whether Wonder, Relay, Grubhub, or merchant delivery fulfills the order
        - Local radius policy, Grubhub delivery options, and Relay route operations
        - Latency and handoff failure risk grows with mixed fleet choices
      - - POS and order ingestion
        - Push marketplace orders into restaurant systems without manual re-entry
        - Grubhub tech integrations and partner POS vendors
        - Vendor-specific reliability and mapping issues are externalized to integrations
      - - Extension channels
        - Add meal kits, corporate meals, campus ordering, and media discovery
        - Blue Apron, Grubhub for Business, Campus Dining, Tastemade
        - Channel breadth multiplies edge cases faster than public docs explain
    notes: This table combines directly documented Grubhub merchant tooling with careful inference about Wonder's owned orchestration layer; the biggest gap is not whether the workflow exists, but how much of it is automated, observable, and resilient.
    claimRefs:
