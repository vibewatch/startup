  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow
      - Wonder solution
      - Measurable benefit
      - Limitation
    rows:
      - - Feed a group with different cravings
        - Open one app and build one cart across multiple cuisines
        - Wonder multi-restaurant ordering
        - Less app switching and one coordinated drop
        - Menu breadth depends on the local site and partner set
      - - Get dinner quickly without accepting low-end quality
        - Use nearby local kitchen with delivery or pickup
        - Fast-fine food hall model with synchronous prep
        - Roughly half-hour service framing with chef-branded menus
        - Promise is radius-sensitive and not contract-backed
      - - Pick up food on the way home
        - Order ahead from a nearby Wonder site
        - Pickup integrated into same location and app flow
        - Avoids delivery fee while keeping multi-restaurant choice
        - Pickup throughput metrics are not public
      - - Eat on site when a location supports it
        - Use a Wonder food hall dining area
        - Dine-in available at Wonder food halls, including larger-format Walmart site seating
        - Makes the same kitchen asset serve more occasions
        - Dine-in scope appears location specific rather than universal
      - - Extend dinner into meal kits or prepared meals
        - Add Blue Apron items through Wonder in served markets
        - Meal kits and heat-and-eat meals in Wonder app
        - Broadens frequency beyond immediate prepared-food occasions
        - Coverage is restricted to Wonder delivery radius for integrated service
      - - Reach an office, campus, or employer-sponsored user
        - Order through linked Grubhub campus or business programs
        - Campus Dining and Grubhub for Business flows
        - Adds institutional demand without building separate Wonder-native tools first
        - Wonder-specific penetration of these channels is not public
    notes: Benefits are stated from public product pages and acquisition coverage; the table intentionally separates visible workflow value from the still-undisclosed conversion, latency, and defect metrics behind each flow.
