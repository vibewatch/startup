companyProfile:
  summary: Wonder is a founder-led private food platform that has expanded from a delivery-first kitchen concept into a broader mealtime network spanning owned Wonder locations, Blue Apron meal kits, Relay logistics, Grubhub marketplace distribution, and Tastemade media. The bull case is that this combination creates a differentiated demand-and-fulfillment stack with enough scale to justify a blended platform multiple. The caution is that most of that scale now comes through acquired assets whose standalone economics, integration costs, and operating quality remain only partially visible in public sources.
  foundedDate: '2018-01-01'
