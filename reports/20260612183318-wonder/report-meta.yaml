  productSummary: Wonder sells meal access across owned multi-restaurant locations, third-party delivery surfaces, Blue Apron meal kits, Grubhub marketplace and campus programs, operator logistics, and media-led discovery tied to the broader "super app for mealtime" thesis.
  customerFocus: Urban and suburban consumers ordering meals, plus merchants, campus dining users, employers, and other foodservice operators reached through Grubhub and Wonder for Business channels.
  businessModel: Wonder monetizes first-party food sales while layering in marketplace commissions and subscriptions, meal-kit sales, logistics services, merchant software and promotion surfaces, institutional ordering flows, and media or advertising adjacency.
