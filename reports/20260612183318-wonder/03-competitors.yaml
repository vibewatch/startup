company:
  name: Wonder
chapter:
  number: 3
  title: Competitors
  summary: 'Wonder faces a two-front battle: DoorDash and Uber own the densest consumer-demand networks, while Instacart, Grubhub, and kitchen-infrastructure operators compete for adjacent meal occasions, merchant distribution, or supply-side control. Grubhub still matters less as a national-share leader than as a channel asset spanning campus, Amazon, Starbucks, and now Wonder-app distribution. The caution from Kitchen United and Reef is that kitchen infrastructure without durable demand capture can become capital-intensive and fragile fast.'
sections:
- id: incumbent-marketplaces-own-demand-capture
  title: 'Incumbent marketplaces still own the hardest control point: consumer demand capture'
  body: 'The sharpest competitive contrast for Wonder is still scale. DoorDash and Uber are not merely alternative apps; they are dense, habit-forming consumer networks with enough order velocity, memberships, and merchant breadth to improve fulfillment speed and discovery at the same time. DoorDash entered 2026 with 933 million quarterly orders, USD 31.6 billion of Marketplace GOV, and record membership signups, while Uber reported 3.6 billion trips, USD 53.7 billion of gross bookings, and 50 million Uber One members. Those figures matter because they imply more than topline heft: they imply more data on repeat behavior, more ability to subsidize memberships, and more density to keep delivery times acceptable over a wider geography.


    Public share data reinforces that point. Consumer Edge estimated DoorDash ended 2024 with 60.7% U.S. food-delivery share, versus 26.1% for Uber Eats and 6.3% for Grubhub. For Wonder, that means the benchmark is not whether its product feels differentiated in a single city. The benchmark is whether Wonder can build enough local density and repeat behavior to compete with platforms that already dominate discovery, checkout, and reorder loops for the mainstream restaurant-delivery occasion.'
