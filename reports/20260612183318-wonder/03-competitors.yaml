- id: underwriting-implications-for-wonder
  title: Underwriting implications for Wonder
  body: 'The strongest competitive framing is therefore a bundle, not a single rival. DoorDash and Uber are the direct consumer-demand incumbents. Instacart is the mealtime-adjacent intercept. Grubhub is the legacy marketplace asset that still contributes niche channels, merchant tooling, and distribution partnerships. CloudKitchens is the merchant-supply comparator. Kitchen United and Reef are cautionary examples of what can break when kitchen infrastructure lacks durable demand ownership.


    That bundle gives Wonder a potentially differentiated lane—combining owned brands, marketplace access, and controlled production—but public evidence is still missing the metrics that would prove whether the lane is economically superior. The open questions are the hardest ones for investors: metro-level density versus DoorDash and Uber, merchant take rates and contribution margins by channel, kitchen occupancy by market, and how much Grubhub traffic can actually be redirected into Wonder-owned brands. Until those figures are disclosed, Wonder’s competitive story is plausible but not yet fully underwritten.'
