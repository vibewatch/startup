- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - moat claim or risk area
  - primary threat
  - severity
  - evidence
  - mitigation / diligence ask
  rows:
  - - Consumer-demand density can become a moat
    - DoorDash and Uber already own denser repeat loops and memberships
    - High
    - DoorDash share leadership plus Uber scale show consumer habit is already concentrated
    - Request city-by-city repeat-order, CAC, and on-time performance data for Wonder vs incumbents
  - - Grubhub is enough to offset national-share weakness
    - Grubhub may be more useful as a niche channel asset than as a broad consumer leader
    - Medium
    - Consumer Edge shows only 6.3% share even though Grubhub retains campus, Amazon, Starbucks, and Wonder-app channels
    - Underwrite Grubhub on cross-sell and niche distribution, not on legacy headline share
  - - Owned kitchens create deeper margin control
    - Kitchen occupancy, labor, and capex can erase the margin advantage
    - High
    - CloudKitchens markets low-cost infra, but Kitchen United and Reef both retrenched after physical expansion
    - Ask for four-wall margin, utilization, and payback by Wonder market and brand
  - - Restaurant supply will lock in once onboarded
    - Merchants can multi-home across marketplace, Direct, storefront, and business-meals options
    - Medium
    - DoorDash, Uber, and Grubhub all sell hybrid channel stacks rather than exclusivity
    - Measure exclusive-merchant rates and churn after promo periods
  - - Regulation removes fee pressure
    - Fee caps can compress platform economics without fixing merchant profitability
    - Medium
    - NYC caps and academic coverage show the fee debate is still unresolved
    - Stress-test contribution margins with and without capped markets
  - - Grubhub-to-Wonder integration will automatically prove the thesis
    - Public evidence still lacks cross-sell, density, and take-rate disclosure
    - High
    - The strategic story is plausible, but the decisive metrics remain private
    - Request cross-sell conversion, cohort retention, and channel-mix data before underwriting durable moat claims
  notes: Severity scores are analytical judgments based on retained public evidence and open questions; they are not company-disclosed risk ratings.
