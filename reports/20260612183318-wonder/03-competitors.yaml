  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics-disclosure
    missingEvidence: Comparable merchant take rates, contribution margins, and promotion-adjusted economics across Wonder, DoorDash, Uber, and Grubhub by order type and city.
    whyItMatters: Without comparable channel economics, the chapter can describe positioning but cannot prove that Wonder’s integrated model captures more economic value than scaled marketplaces.
    diligencePath: 'Request management reporting by market and channel: gross margin, contribution margin, delivery cost, promo burden, and merchant economics for owned-brand, Grubhub marketplace, and direct-order flows.'
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP003
    - TP004
  - type: missing-source
    severity: material
    topic: metro-density-and-utilization
    missingEvidence: City-level order density, service-level performance, kitchen occupancy, and fulfillment-radius data for Wonder versus the leading incumbents.
    whyItMatters: Local density and kitchen utilization determine whether Wonder’s owned-infrastructure model compounds or becomes a capital burden relative to lighter marketplace competitors.
    diligencePath: Ask for metro cohort dashboards covering order frequency, active diners, active kitchens, utilization, delivery time, and repeat-order behavior in markets where Wonder overlaps DoorDash and Uber.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP004
  - type: private-evidence-only
    severity: material
    topic: grubhub-cross-sell-into-wonder
    missingEvidence: Conversion data showing how often Grubhub traffic is redirected into Wonder-owned restaurants, plus retention and basket behavior after the redirect.
    whyItMatters: Grubhub’s strategic value to Wonder depends on whether channel ownership actually feeds owned-brand demand rather than simply preserving third-party marketplace volume.
    diligencePath: Request acquisition-to-order-funnel data that traces Grubhub diners into Wonder-owned concepts, including repeat rate, basket size, and contribution margin after the first cross-sell.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP004
