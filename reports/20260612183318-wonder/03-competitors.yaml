- id: substitutes-regulation-and-multi-homing-keep-switching-costs-low
  title: Substitutes, regulation, and merchant multi-homing keep switching costs low
  body: 'Wonder should not assume that restaurant-delivery demand is locked inside a few apps forever. Traditional restaurants and local independents still have multiple substitute paths: dine-in, direct pickup, restaurant-owned websites, and first-party ordering tools sold by the same intermediaries that also run marketplaces. Grubhub Direct, DoorDash Online Ordering, and Uber’s storefront and managed-meals surfaces all make it easier for merchants to multi-home rather than commit to one channel. That weakens any thesis that a marketplace automatically owns supply once it reaches scale.


    The economics remain contested too. The National Restaurant Association says 42% of operators were not profitable last year even as 2026 restaurant sales are projected to reach USD 1.55 trillion. NYC still caps delivery fees at 15%, transaction fees at 3%, and basic service fees at 5%, while Wharton and The Regulatory Review both highlight 15% to 30% commission pressure in the broader category. For Wonder, that means competition is not just about app share. It is also about which model leaves enough gross margin for merchants, enough convenience for diners, and enough contribution margin for the platform.'
