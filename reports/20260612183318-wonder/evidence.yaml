evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: leadership-disclosure
    missingEvidence: A complete current executive roster and full board list after the Tastemade and Grubhub integrations.
    whyItMatters: >-
      Founder concentration and integration capacity are central to execution risk, but public materials only expose a
      subset of leaders.
    diligencePath: Request the current org chart, executive bios, and board observer / director roster from management.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: operating-metrics-disclosure
    missingEvidence: Current standalone Wonder headcount, customer count, order volume, and revenue excluding acquired businesses.
    whyItMatters: >-
      Combined revenue and marketplace scale can overstate the health of the legacy core business and hide integration
      drag.
    diligencePath: Request a board deck or KPI packet that separates legacy Wonder, Grubhub, Blue Apron, and Tastemade contributions.
    relatedQuestionRefs:
      - QO020
      - QO025
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: cap-table-and-terms
    missingEvidence: >-
      Round-by-round cap table detail, liquidation preferences, and the exact legal form of the extra $250M capital
      disclosed with the Grubhub announcement.
    whyItMatters: >-
      Headline valuation and total raised figures are not enough to judge true ownership dilution or economic entry
      price.
    diligencePath: >-
      Request financing documents, cap table snapshots, and investor-rights summaries for the 2022, 2024, and 2025
      financings.
    relatedQuestionRefs:
      - QO008
      - QO009
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: cloud-kitchen-us-size
    missingEvidence: >-
      A clean U.S.-only ghost-kitchen revenue or merchant-count estimate that can be reconciled to Wonder’s supply
      model.
    whyItMatters: >-
      Without a U.S.-specific operating-layer estimate, public cloud-kitchen data remains a directional proxy rather
      than a direct Wonder SAM input.
    diligencePath: >-
      Acquire a full U.S. ghost-kitchen or delivery-only restaurant market report, or obtain merchant census data from
      Grubhub or comparable platforms.
    relatedQuestionRefs:
      - QM006
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: enterprise-campus-mix
    missingEvidence: >-
      The split of Grubhub order volume and gross sales across consumer, campus, and corporate channels inside Wonder
      ownership.
    whyItMatters: >-
      Wonder’s payer diversification thesis depends on how much non-household demand already exists and whether it can
      be steered toward Wonder-owned supply.
    diligencePath: >-
      Request post-acquisition management reporting that breaks out GMV, orders, and active accounts by campus,
      corporate, and consumer channels.
    relatedQuestionRefs:
      - QM014
      - QM024
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: blocking
    topic: wonder-sam-som
    missingEvidence: >-
      Wonder-specific take rate, cross-sell conversion, order frequency, retention, city density, and
