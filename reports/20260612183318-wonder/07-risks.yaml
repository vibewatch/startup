- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Grubhub stabilization fails
    - Marketplace share / retention / order trend versus peers
    - Another year of share erosion or materially slower user/order growth than DoorDash and Uber after integration efforts
    - Treat Grubhub as a cash-absorbing asset rather than the national-growth engine in the base case
  - - Labor and regulatory pressure keeps worsening
    - New settlements, worker protests, deactivation spikes, or additional market exits
    - Repeat NYC-style enforcement or more retrenchment from owned or controlled courier operations
    - Raise compliance-cost assumptions and downgrade logistics-control claims
  - - Capital intensity outruns funding capacity
    - Openings, acquisitions, or subsidy needs continue without evidence of better contribution margin
    - Need for another large fundraise before showing Grubhub stabilization or store-level payback improvement
    - Underwrite dilution / tighter covenants and slow assumed expansion pace
  - - Food safety or quality-control failure emerges
    - Recall, outbreak, repeated temperature failures, or a sustained spike in refunds / complaints
    - Any material recall or a visible multi-market service-quality deterioration
    - Pause rollout assumptions until operating controls are demonstrably repaired
  - - Founder concentration becomes governance risk
    - Marc Lore departure, reduced visibility, or evidence of weak delegated ownership
    - Leadership change without a clearly empowered bench or business-line heads
    - Apply governance discount and require proof of succession readiness
  - - Integration narrative lacks measurable proof
    - No disclosed cross-sell, conversion, or retention lift from Tastemade, Blue Apron, or Grubhub tie-ins
    - Twelve months of strategy rhetoric without concrete operating KPIs
    - Value acquisitions more conservatively and stop giving full synergy credit
  notes: Each row turns a broad narrative risk into a measurable trigger that diligence or quarterly monitoring can actually track.
