chapter:
  number: 7
  title: Risks
  summary: Wonder's highest risks cluster around integrating several very different businesses while still accelerating physical expansion, funding delivery logistics, and trying to stabilize the declining Grubhub asset under tightening labor and fee-cap rules. Public evidence also shows meaningful mitigants—Wonder has real scale momentum, added merchant and delivery reach through Grubhub, and can point to Relay, Blue Apron, and Tastemade as capability extensions—but the burden of proof now sits on unit economics, regulatory compliance, and Marc Lore's ability to keep a widening portfolio operationally coherent.
sections:
- id: integration-and-scope-risk
  title: Execution complexity and integration scope risk
  body: 'Wonder is no longer underwriting one product with one operating loop. The current public stack combines a multi-brand local restaurant platform, the national Grubhub marketplace, Blue Apron''s meal-kit and fulfillment-center operations, Relay''s courier network, Tastemade''s media audience, and a rapidly growing owned-store footprint. Official acquisition language frames that breadth as the path to a mealtime super app, but the same breadth is why execution risk is unusually high: every additional asset adds its own systems, labor model, margin structure, brand promise, and integration agenda. The direct evidence is not speculative. Wonder itself says Grubhub brings hundreds of thousands of merchants and delivery partners; Blue Apron came with public going-concern, fulfillment, and food-safety risk factors; and Tastemade extends the company into media and advertising rather than just kitchens and logistics. Marc Lore is also publicly attached to the super-app vision, which strengthens
    strategic coherence but raises key-person dependence if execution falters or leadership bandwidth gets stretched across too many simultaneous moves.'
  claimRefs:
