  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: market-share-disagreement
    missingEvidence: Post-close Grubhub share, order, and active-user data by market from Wonder management or lender materials.
    whyItMatters: Public third-party datasets disagree materially on Grubhub's exact position, which affects how severe the competitive decline really is.
    diligencePath: Request Wonder's internal board or financing deck showing Grubhub MAUs, orders, share estimates, and cohort retention after close.
    relatedQuestionRefs:
    - QR013
    - QR024
  - type: private-evidence-only
    severity: material
    topic: store-economics
    missingEvidence: Store-level contribution margin, cash burn, capex per opening, and fee-cap-adjusted economics for Wonder and Grubhub in core markets.
    whyItMatters: Capital intensity is one of the headline risks, but public sources do not show whether new stores or marketplace volume are self-funding.
    diligencePath: Obtain cohort economics, cash-payback analysis, and market-level P&Ls from management or financing materials.
    relatedQuestionRefs:
    - QR028
  - type: private-evidence-only
    severity: material
    topic: integration-culture
    missingEvidence: Current org chart, leadership retention data, and employee attrition or engagement trends across Grubhub, Blue Apron, Relay, and Tastemade.
    whyItMatters: The thesis depends on integrating very different businesses, but the public record does not show whether the operator bench is deep enough.
    diligencePath: Ask for post-close retention reports, PMO governance materials, and business-line accountability maps.
    relatedQuestionRefs:
    - QR029
  - type: private-evidence-only
    severity: material
    topic: quality-incidents
    missingEvidence: Complaint-rate, refund-rate, remake-rate, late-delivery, and food-incident data by concept, city, and channel.
    whyItMatters: Brand and reputation risk cannot be sized well without current quality-frequency data for the combined operation.
    diligencePath: Request support-ticket dashboards, trust-and-safety summaries, incident logs, and health-inspection histories across Wonder and Blue Apron operations.
    relatedQuestionRefs:
    - QR030
  - type: enumeration-incomplete
    severity: minor
    topic: regulatory-register
    missingEvidence: A full legal, regulatory, insurance, and inspection docket across Wonder and each acquired entity.
    whyItMatters: The public register captures only discoverable matters and may miss private claims, insurer disputes, or informal agency remediation.
    diligencePath: Run legal diligence against litigation databases, insurance schedules, regulator correspondence, and inspection logs for each operating subsidiary.
    relatedQuestionRefs:
    - QR006
    - QR008
    relatedTableRefs:
    - TR001
