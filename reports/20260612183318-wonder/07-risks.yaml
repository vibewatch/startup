- id: economics-competition-and-regulation
  title: Capital intensity, competition, and regulatory margin pressure
  body: 'The core downside case is that Wonder is trying to integrate a discounted but weakened marketplace asset while two much larger competitors keep compounding scale. Third-party market datasets disagree on Grubhub''s exact current share, but they agree on the direction: its position is far behind DoorDash and Uber Eats, retention is weaker, and Wonder bought it after severe value destruction. At the same time, physical expansion still demands capital. Wonder''s own Texas release says the company recently reached 100 locations and is aiming for more than 200 storefronts by year-end 2026, while trade coverage says it also raised large amounts of outside capital and kept adding acquisitions. That means competition and cash burn are linked rather than separate risks. If Grubhub keeps losing share, or if store growth requires ongoing subsidy, Wonder may need fresh capital before integration benefits have time to show up. Regulation compounds the problem. New York City''s permanent fee caps
    and tougher delivery-worker rules already changed the economics of the largest urban delivery market, and Wonder-controlled Relay ultimately said it could no longer run a sustainable New York business under the tighter regime.'
