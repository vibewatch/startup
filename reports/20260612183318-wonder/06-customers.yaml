- id: grubhub-diners-merchants-campus-and-business
  title: Grubhub diners, merchants, campus, and business channels
  body: 'Grubhub adds several customer channels that Wonder did not previously own at scale. On the consumer side, Grubhub still markets a nationwide app with hundreds of thousands of restaurants and groceries, a Grubhub+ subscription, and real-time order tracking. On the merchant side, Grubhub''s tools are much more explicit than Wonder''s owned restaurant-operations documentation: marketplace pages pitch tens of millions of diners and flexible fee plans, the merchant portal manages menus, promotions, hours, reviews, and delivery boundaries across Marketplace and Direct, and delivery-options pages describe Grubhub Delivery, supplemental delivery, self-delivery, and pickup. Corporate and campus are separate payer segments rather than simple extensions of the consumer app. Grubhub for Business offers tax exemption, spend controls, and shared-cart ordering for offices, while Campus Dining lets students, faculty, and staff connect meal plans or campus cards. Named university pages from Utah,
    Indiana, and Kennesaw are strong customer-proof because they show production use, not just a logo list. Indiana''s 2026 robot-delivery launch also shows Grubhub moving beyond order-ahead pickup into campus last-mile convenience, albeit within bounded service areas and with explicit fees.'
