- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration / friction risk
  - Impact
  - Diligence path
  rows:
  - - Wonder can widen direct coverage by adding dense local sites in Philadelphia, Washington, and Texas
    - Direct diner access still depends on market-by-market kitchen density rather than a fully national first-party network
    - Customer acquisition and service quality can vary sharply by geography
    - Request active markets, order density, and contribution margin by region
  - - Grubhub gives Wonder instant access to merchants and diners nationwide
    - Combined customer reach could become too dependent on Grubhub marketplace economics and retention
    - Channel dependence may be hidden inside aggregate order growth
    - Request order mix and gross profit split between Wonder-native and Grubhub-mediated demand
  - - Chef and restaurant-brand partners differentiate Wonder menus
    - A handful of recognizable partner brands may carry outsized traffic and conversion weight
    - Partner churn or economics changes could weaken brand pull
    - Request top-partner sales concentration and renewal terms
  - - Campus dining opens a sticky institutional acquisition funnel
    - Public proof is strong for a few named campuses but thin on active-campus counts, GMV, or renewal
    - The channel may be strategically important but not yet economically legible
    - Request campus count, active-campus growth, and meal-plan attachment rates
  - - Corporate and B2B channels broaden payer mix
    - Wonder for Business and Wonder Spot show real intent but very thin named customer proof
    - Investors cannot yet underwrite contract durability or logo concentration
    - Request named accounts, seat counts, contract lengths, and reorder cadence
  - - Grubhub competitive pressure may force customer-facing pricing moves
    - Fee waivers, shrinking MAUs, and order declines imply retention pressure and margin trade-offs
    - Customer growth may require more incentives just as Wonder integrates the asset
    - Request cohort retention, promo dependence, and unit economics by customer type
  notes: Risk view synthesizes direct pages with adverse delivery-market coverage; concentration is inferred because public numeric mix disclosure is absent.
