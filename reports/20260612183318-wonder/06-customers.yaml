tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Primary use case
  - Geography / channel
  - Public scale / proof
  - Strategic value
  - Gap
  rows:
  - - Wonder direct diners
    - Buyer=user=payer; sometimes one household organizer pays
    - Single-cart ordering across multiple brands for family, friends, or office groups
    - Wonder app / web in local delivery markets
    - Owned app, app-store page, and Philadelphia expansion article all describe multi-brand direct ordering
    - Core owned-demand surface where Wonder controls menu mix and fulfillment experience
    - No active diner count, repeat-order rate, or region-by-region density disclosure
  - - Chef-partner / restaurant-brand supply
    - Buyer=Wonder; user=Wonder diner; payer=Wonder diner
    - Differentiate assortment with chef-branded menus and restaurant IP
    - Wonder-owned kitchens and app surfaces
    - Wonder restaurants page, App Store copy, and Wonder for Business pages name chef partners and exclusive brands
    - Brand differentiation is a key reason households tolerate a single-platform meal occasion
    - No public disclosure on partner economics, renewal, or menu-level demand concentration
  - - Wonder Spot group ordering
    - Buyer=office, workplace, residence, or school admin; users=individual diners; payer=organization or subsidized employee
    - Batch-delivered individual meals for recurring groups
    - Wonder Spot channel
    - Official Wonder Spot page supports office, workplace, residential-building, and school deployments
    - Adds payer diversity beyond one-off consumer carts
    - No named customer logos, seat counts, or reorder cadence
  - - Wonder for Business operators
    - Buyer=foodservice operator; users=end diners; payer=operator
    - Oven-enabled, licensed, or chef-branded food programs
    - Corporate / campus / airport / hotel / stadium / hospitality channels
    - Wonder for Business home, pricing, and about pages describe turnkey B2B deployment
    - Supportable B2B motion that could scale beyond Wonder-owned kitchens
    - Public pages do not name live customer accounts or contract values
  - - Grubhub diners nationwide
    - Buyer=user=payer; sometimes household or group organizer pays
    - Restaurant discovery, delivery, pickup, and grocery ordering
    - National marketplace app
    - Grubhub home, App Store, and acquisition release show national scale and large merchant breadth
    - Fastest way for Wonder to reach diners beyond owned-market density
    - Wonder does not disclose overlap between Wonder-native and Grubhub-acquired diners
  - - Restaurant / merchant partners on Grubhub
    - Buyer=merchant operator; user=merchant staff and diners; payer=merchant P&L
    - Acquire customers, manage menus, run promotions, and handle delivery
    - Marketplace / Marketplace + Direct / self-delivery
    - Merchant portal, marketplace, delivery-options, and merchant-expansion press pages
    - Merchant supply is the critical inventory layer behind national marketplace reach
    - No public merchant churn, take-rate mix, or satisfaction score by plan tier
  - - Campus dining institutions
    - Buyer=university dining admin; users=students, faculty, staff; payer=meal plan, campus card, or mixed payment
    - Order-ahead pickup and, at some campuses, delivery or robots
    - Campus Dining
    - Official Grubhub Campus page plus Utah, Indiana, and Kennesaw pages show live production use
    - Distinct institutional buyer and sticky user-acquisition funnel for younger diners
    - Public evidence does not reveal campus GMV, active campuses, or renewal rates
  - - Corporate accounts / team meals
    - Buyer=admin, HR, finance, office manager, or team lead; users=employees and travelers; payer=employer budget
    - Subsidized meals, group ordering, and tax-managed spend
    - Grubhub for Business
    - Official business and group-ordering pages show real budget-control and shared-cart workflows
    - Meaningful payer diversification beyond self-serve B2C
    - No named customer case studies retained in this chapter and no seat-count disclosure
  notes: Mixes owned-product, app-store, university, and marketplace evidence; revenue mix and repeat-rate data remain undisclosed.
