company:
  name: Wonder
chapter:
  number: 6
  title: Customers
  summary: 'Wonder already serves several distinct customer surfaces: local direct diners on its owned app, nationwide Grubhub diners and merchants, campus dining users, corporate meal-program buyers, and emerging B2B foodservice operators through Wonder for Business. The public record proves real adoption and broadening access, but it remains thin on repeat-order cohorts, named B2B customers, and channel-mix concentration, while Grubhub still carries visible satisfaction and growth-pressure risk.'
sections:
- id: customer-segmentation-and-direct-use-cases
  title: Customer segmentation and direct-use cases
  body: 'Wonder''s customer base is no longer just a local delivery diner. The owned Wonder app and site target end consumers who want restaurant variety without splitting the order across apps, and the product is explicitly marketed around mix-and-match, free delivery, pickup, dine-in, and group convenience. The Philadelphia expansion coverage is especially useful because it describes the real-world use case in plain language: families, friend groups, and office groups with different tastes can still place one coordinated order. Wonder''s own surfaces also show a second layer of supply-side participants—chef and restaurant-brand partners such as Bobby Flay, José Andrés, and Marcus Samuelsson—whose menus differentiate the consumer proposition. A third layer is already visible in B2B form. Wonder Spot targets offices, workplaces, residential buildings, and schools with batch delivery, while Wonder for Business sells oven-enabled food programs, licensed concepts, and chef-branded menus into
    corporate, campus, hotel, airport, stadium, and hospitality operators. Public evidence therefore supports a wide segment map, but it does not yet disclose segment revenue mix, repeat rates, or the share of demand still concentrated inside the Northeast and Mid-Atlantic core.'
