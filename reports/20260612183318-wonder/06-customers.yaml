  evidenceGaps:
  - type: missing-source
    severity: material
    topic: wonder-retention
    missingEvidence: True repeat-order cohorts, active diner counts, and NRR/GRR for Wonder direct, Wonder Spot, and Grubhub-overlap users.
    whyItMatters: The chapter can prove reach and channel breadth, but it cannot underwrite durability or lifetime value without cohort-level behavior.
    diligencePath: Request 30/90/180-day repeat curves, active diners, and churn by geography and channel from management.
    relatedQuestionRefs:
    - QU024
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: material
    topic: wonder-b2b-named-customers
    missingEvidence: Named Wonder Spot or Wonder for Business customer logos, seat counts, contract lengths, and case studies.
    whyItMatters: B2B is strategically attractive because it diversifies payers, but public proof is too thin to judge scale, retention, or concentration.
    diligencePath: Ask management for a customer list, deployment maturity, and renewal metrics for Wonder Spot and Wonder for Business.
    relatedQuestionRefs:
    - QU023
    relatedTableRefs:
    - TU003
    - TU005
  - type: missing-source
    severity: material
    topic: channel-concentration
    missingEvidence: Order mix, revenue mix, and gross profit split across Wonder direct, Grubhub marketplace, campus, corporate, and operator channels.
    whyItMatters: Without channel mix, investors cannot tell whether national reach is diversified or whether one channel dominates economics and risk exposure.
    diligencePath: Request channel-level GMV, customer counts, and contribution margin by geography and customer type.
    relatedQuestionRefs:
    - QU025
    relatedTableRefs:
    - TU001
    - TU005
