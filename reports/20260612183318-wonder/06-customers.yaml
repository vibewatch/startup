- id: geography-access-and-expansion
  title: Geography, access, and expansion
  body: 'Wonder''s direct consumer footprint is still regional, but the geography is broadening quickly. The Wonder app positions pickup, dine-in, and free delivery across East Coast locations, while the 2026 Texas announcement explicitly frames expansion beyond the Northeast and Mid-Atlantic into Dallas-Fort Worth, Houston, Austin, and San Antonio. That same release says Wonder recently celebrated its 100th location and remains on pace for 200-plus storefronts by year-end 2026, which is the strongest public adoption and footprint signal retained for this chapter. Local market reporting fills in how management is extending coverage within regions: Philadelphia-area coverage is described as a puzzle-piece approach designed to blanket more communities and widen delivery reach, and Washington-area reporting says the first DC and Rosslyn stores are the beginning of an eight-store regional rollout. The access story becomes more national once Grubhub is included. Wonder''s acquisition release
    says Grubhub brings more than 375,000 merchants, 200,000 delivery partners, and logistics coverage across the vast majority of the U.S. population. That makes direct Wonder coverage still regional, but diner and merchant access materially more national through the combined platform.'
