      - Merchant portal
      - Robot delivery at IU
      - Courier network
    - id: repeat-or-expand
      label: Repeat / expand
      actor: Diner / merchant / admin
      description: The repeat loop can come from convenience, Grubhub+, campus habit, or an expanded office or B2B deployment, but public cohort data remains thin.
      channels:
      - Grubhub+
      - Campus habit
      - Wonder Spot reorders
      - B2B follow-on programs
