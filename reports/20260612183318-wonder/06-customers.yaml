      - Wonder app
      - Grubhub app
      - Campus Dining
      - Wonder for Business
    - id: choose-channel
      label: Choose channel
      actor: Consumer or buyer
      description: Users decide between Wonder direct, Grubhub marketplace, campus affiliation, Wonder Spot, or a B2B deployment discussion.
      channels:
      - Wonder web / app
      - Grubhub
      - Wonder Spot page
      - Business intake pages
    - id: build-order
      label: Build order
      actor: Diner / admin
      description: Consumers mix multiple restaurant brands in one order, campuses attach meal plans, and office admins assemble shared or subsidized carts.
