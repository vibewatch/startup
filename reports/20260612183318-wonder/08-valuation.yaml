tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Supporting evidence
  - Decision implication
  rows:
  - - Recommendation
    - research-more
    - '>$7B private mark is explainable on blended revenue but segment quality is still opaque'
    - Do not underwrite current pricing without a segment bridge and post-Grubhub evidence
  - - Confidence
    - medium
    - Large public financing anchors and public comp data exist, but internal denominators are missing
    - View can move meaningfully with one management deck or lender-style KPI package
  - - Risk rating
    - high
    - Grubhub value destruction, share erosion, and multi-asset integration create asymmetric downside
    - Size any exposure conservatively and prefer structured downside protection
  - - Valuation stance
    - fair-to-stretched
    - Implied multiple is <3.5x combined revenue floor, but the denominator includes lower-quality acquired revenue
    - Reasonable only if blended platform thesis proves out
  - - Price discipline
    - wait for more proof
    - Current mark already discounts meaningful synergy and integration success
    - Better entry is either lower price or materially better disclosure
