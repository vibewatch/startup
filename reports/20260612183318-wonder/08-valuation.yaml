  evidenceGaps:
  - type: incomplete-coverage
    severity: minor
    topic: comparable valuation table coverage
    missingEvidence: More private-market secondary marks and direct public EV/revenue bridges for restaurant-software and
      meal-platform peers.
    whyItMatters: The current comparable set is sufficient to frame a blended range but not to pin a precise median multiple
      for Wonder.
    diligencePath: Use banker comp sheets, CapIQ/PitchBook private rounds, and additional public filings if a financing or
      IPO process begins.
    relatedTableRefs:
    - TV004
    relatedQuestionRefs:
    - QV022
    - QV024
  - type: private-evidence-only
    severity: blocking
    topic: segment revenue and margin bridge
    missingEvidence: Standalone Wonder revenue plus current segment gross margin and EBITDA for Grubhub, Blue Apron, Tastemade,
      and services.
    whyItMatters: Without this bridge, the public >$2B revenue marker cannot be quality-adjusted well enough to issue a stronger
      valuation call.
    diligencePath: Request a management segment bridge and monthly KPI pack used internally after the Grubhub integration.
    relatedTableRefs:
    - TV001
    - TV004
    - TV006
    relatedQuestionRefs:
    - QV007
    - QV023
    - QV030
  - type: private-evidence-only
    severity: material
    topic: cap table and preference stack
    missingEvidence: Current share ownership, note terms, any liquidation preferences, ratchets, or senior claims above common
      equity.
    whyItMatters: A private valuation mark is much less informative if the security stack materially alters downside recovery
      or future dilution.
    diligencePath: Request latest cap table, financing documents, and board-approved waterfall model from counsel or finance.
    relatedTableRefs:
    - TV001
    - TV006
    relatedQuestionRefs:
    - QV030
