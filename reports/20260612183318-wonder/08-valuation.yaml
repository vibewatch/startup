schemaVersion: report-v2
artifact: valuation
slug: wonder
runDate: '2026-06-12'
company:
  name: Wonder
chapter:
  number: 8
  title: Valuation
  summary: Wonder's May 2025 financing at a valuation above $7 billion is plausible only when underwritten as a blended mealtime
    platform that includes Grubhub, Blue Apron, and emerging software/advertising adjacency rather than as a standalone first-party
    kitchen chain. On a floor of more than $2 billion of combined revenue, the mark implies less than 3.5x revenue, which
    is not obviously extreme versus DoorDash, Uber, Instacart, and Toast. The mark still looks fair-to-stretched because Grubhub
    was acquired after severe value destruction, public sources do not break out legacy Wonder revenue or segment margins,
    and the integration stack now includes multiple low-visibility businesses. Recommendation is research-more with medium
    confidence and high risk.
sections:
- id: investment-thesis-and-anti-thesis
  title: Investment thesis and anti-thesis
  body: 'The bull case for Wonder rests on combination rather than purity. By May 2025 the company had raised another $600
    million at a valuation above $7 billion, QSR reported more than $2 billion of revenue inclusive of Grubhub, and management
    was still framing the product as a convenience-heavy mealtime platform rather than a single-format restaurant chain. The
    strategic logic is that Wonder can combine first-party prepared meals, Blue Apron meal kits, Grubhub marketplace demand,
    institutional channels, WonderWorks-style operating services, and Tastemade media into one customer-acquisition and fulfillment
    loop. If that loop works, the public-comp set should be wider than restaurants alone and should include scaled marketplaces
    and restaurant software.


    The anti-thesis is that the combined revenue floor may flatter quality more than economics. The $2 billion figure includes
    Grubhub, which Wonder bought only after Just Eat Takeaway sold the asset for $650 million, about 91% below the $7.3 billion
    it paid in 2020. Consumer Edge said Grubhub''s share had fallen to 6% nationally before the sale, and Restaurant Business
    reported North America orders were down more than 26% over three years. Blue Apron''s pre-close filings show revenue but
    also meaningful losses. That means the current mark can be defended only as a blended platform valuation with turnaround
    optionality; it is much harder to defend as proof that legacy Wonder alone already merits unicorn-plus pricing.'
  claimRefs:
  - CV006
  - CV007
  - CV010
  - CV015
  - CV017
  - CV018
  - CV034
  - CV035
  - CV044
  - CV045
  tableRefs:
  - TV002
  figureRefs:
  - FV001
- id: financing-context-and-valuation-discipline
  title: Financing context, acquisition load, and valuation discipline
  body: 'The key anchor points are public and unusually large. Wonder raised $700 million in March 2024 while targeting 35
    locations by the end of 2024 and 90 by the end of 2025, and the U.S. Chamber later described that round as taking cumulative
    funding to $1.5 billion. In November 2024 Wonder agreed to buy Grubhub for a $650 million enterprise value structure that
    included $500 million of senior notes and $150 million of cash, while simultaneously announcing another $250 million of
    new-investor capital. In May 2025 Wonder then added $600 million more at a valuation above $7 billion. That sequence shows
    a business graduating from rollout financing into acquisition-driven platform financing.


    Discipline matters because the visible acquisition bill is already heavy. Blue Apron cost $103 million, Grubhub cost $650
    million, and Tastemade reportedly cost about $90 million, implying more than $843 million of disclosed M&A before Relay
    consideration, new-store capex, integration expense, or normal burn. Public sources still do not disclose Wonder standalone
    revenue, post-Grubhub segment margins, cash on hand, or a full preference stack. As a result, the current mark should
    be treated as a private financing datapoint rather than a fully underwritten intrinsic value. It is useful, but not sufficient,
    because the denominator behind the valuation is mostly blended and partially acquired.'
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  - CV005
  - CV006
  - CV009
  - CV011
  - CV012
  - CV039
