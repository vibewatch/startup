- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance to Wonder
  - Limitation
  rows:
  - - DoorDash
    - Market cap / annualized Q1 2026 revenue
    - ~4.1x sales ($65.61B market cap on $4.0B Q1 revenue annualized)
    - Best public comp for scaled marketplace delivery and convenience aggregation
    - Far larger network density and cleaner public disclosure than Wonder
  - - Uber
    - Market cap / annualized Q1 2026 revenue
    - ~2.7x sales ($140.15B market cap on $13.2B Q1 revenue annualized)
    - Useful lower-band blended-platform comp for logistics plus commerce
    - Revenue includes mobility and freight, so food-delivery comparability is imperfect
  - - Instacart
    - Market cap / annualized Q1 2026 revenue
    - <2.4x sales (~$9.694B market cap on >$1.0B Q1 revenue annualized)
    - Relevant because ads, marketplace, and retail enablement all sit beside transactions
    - Grocery mix and capital intensity differ materially from Wonder kitchens
  - - Toast
    - Market cap / annualized Q1 2026 revenue and ARR
    - ~2.2x sales or ~6.5x ARR ($14.39B market cap; $1.63B Q1 revenue; $2.2B ARR)
    - Best restaurant-software adjacency for higher-quality recurring revenue framing
    - Toast is software-led, not kitchen-led, so margin structure is cleaner than Wonder's
  - - Grubhub transaction
    - Acquisition value / inherited scale
    - 0.08x 2023 GTV and ~6.9x 2023 adjusted EBITDA at Wonder's purchase price
    - Shows Wonder bought scale cheaply because the asset was impaired
    - Transaction value captures distress and deal structure, not a steady-state public multiple
  - - Olo
    - Last known market cap
    - ~$1.74B last known market cap on Oct. 3, 2025
    - Helpful small-cap software adjacency for restaurant ordering tools
    - Not a current June 2026 quote and far narrower than Wonder's combined model
  enumerationScope:
    coverage: partial
    basis: Selected public comparables and transaction anchors that map to Wonder's blended model; not a full private-market
      comps book.
