- id: bull-base-and-bear-scenarios
  title: Bull, base, and bear scenarios
  body: 'The bear case treats Wonder as a mixed-quality roll-up whose largest acquired asset keeps eroding. If combined revenue
    is only modestly above $2 billion, if Grubhub''s share continues to slip, and if public-market multiples for delivery
    and commerce compress toward roughly 1.5x to 2.0x sales, a valuation range around $3.5 billion to $5.0 billion is more
    defensible than today''s mark. That is the scenario where the private round eventually looks like a markup taken before
    integration evidence existed.


    The base case assumes the combined platform stabilizes and that the market continues to value scaled meal-commerce and
    restaurant-enablement businesses in a roughly 2.5x to 3.5x revenue band. On a reasonable $2.2 billion to $2.4 billion
    blended revenue base, that produces an approximate value range of $5.5 billion to $8.5 billion. In that framework, the
    current $7 billion-plus mark is supportable but not cheap. The bull case requires both growth and quality upgrades: durable
    revenue above $2.4 billion, credible cross-sell from Grubhub to Wonder-owned brands, better segment margin visibility,
    and investor willingness to pay 3.5x to 4.5x blended sales for a platform that looks more like a scaled super-app than
    a stitched-together portfolio. That yields roughly $8.5 billion to $11.0 billion and is the case implied by enthusiastic
    private-market pricing rather than by current public disclosure.'
  claimRefs:
  - CV033
  - CV040
  - CV041
  - CV042
  - CV044
  - CV045
  tableRefs:
  - TV003
  figureRefs:
  - FV003
- id: exit-readiness-and-thesis-break-triggers
  title: Exit readiness and thesis-break triggers
  body: 'An eventual IPO or large strategic exit requires more than growth headlines. Public markets will need evidence that
    the combined company is not simply aggregating revenue but improving the economics of that revenue. The highest-priority
    watch items are Grubhub order and share stabilization, segment-level margin disclosure, proof that Wonder-owned brands
    can capture profitable demand from marketplace traffic, and evidence that Blue Apron and Tastemade create more than narrative
    optionality. Without those datapoints, an IPO would likely be valued with a discount for opacity and integration risk.


    The thesis breaks if any of four things happen. First, the combined revenue story fails to translate into a credible segment
    bridge, leaving investors unable to separate legacy Wonder from acquired lines. Second, Grubhub continues shrinking faster
    than synergies arrive, confirming that Wonder bought traffic but not durable economics. Third, another capital raise occurs
    before management discloses meaningful integration progress, suggesting the May 2025 round bought time rather than proof.
    Fourth, public comps re-rate lower while Wonder still depends on a private-market premium. Each of those outcomes would
    push the investment case from fair-to-stretched into clearly overstated.'
  claimRefs:
  - CV015
  - CV017
  - CV018
  - CV036
  - CV041
  - CV045
  - CV046
  tableRefs:
  - TV005
  figureRefs: []
- id: recommendation-and-final-diligence-asks
  title: Recommendation and final diligence asks
  body: 'The correct recommendation is research-more. There is enough public evidence to explain why sophisticated investors
    could price Wonder above $7 billion: combined revenue is already large, the platform now spans first-party meals, marketplace
    demand, subscriptions, institutional channels, and adjacent software/media, and public comp multiples are not so low that
    a blended 3x-plus sales mark is impossible. There is not enough evidence to call the valuation obviously attractive because
    the company has not publicly separated legacy Wonder economics from Grubhub, Blue Apron, Relay, or Tastemade.


    That leaves the valuation in a narrow zone between fair and stretched. If management can show that more than $2 billion
    of revenue is holding, that Grubhub volume can be monetized more effectively inside Wonder, and that segment margins are
    improving rather than merely being combined, the current mark can look fair. If instead the roll-up mostly imported low-quality
    revenue and the next financing arrives before clean integration evidence, the mark will look like a private-market markup
    laid over deteriorating assets. The diligence unlocks are therefore specific: a segment revenue bridge, location-level
    unit economics, Grubhub order/share and take-rate trends under Wonder ownership, acquisition-synergy tracking, headcount
    and integration cost disclosure, and a current cap-table or preference-stack view.'
