- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Pillar
  - Bull argument
  - Anti-thesis argument
  - What would change the view
  rows:
  - - Revenue scale
    - Combined revenue already exceeds $2B inclusive of Grubhub, giving Wonder real scale
    - The reported revenue floor is blended and does not prove legacy Wonder economics
    - Show segment revenue bridge and standalone Wonder growth
  - - Platform breadth
    - Wonder now owns first-party meals, marketplace demand, meal kits, services, and media
    - Breadth may be a roll-up story rather than a flywheel story
    - Disclose cross-sell, repeat rate, and segment contribution margin
  - - Grubhub optionality
    - Wonder bought a large traffic network at a much lower price than prior owners paid
    - Wonder may have bought a declining asset whose economics remain weak
    - Show post-close share stabilization and monetization improvement
  - - Capital access
    - Repeated large rounds show strong investor appetite and strategic backing
    - Large raises can postpone, rather than solve, economic proof
    - Show burn, runway, and acquisition-synergy realization
  - - Comparable support
    - Public comp sales multiples make a 3x-plus blended mark arguable
    - Public markets would likely penalize opaque acquired revenue and integration risk
    - Publish enough disclosure to let the market price Wonder on more than narrative
