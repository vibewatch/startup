- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Core assumptions
  - Valuation logic
  - Implied range
  - Probability signal
  - Downside trigger
  rows:
  - - Bull
    - Combined revenue rises beyond $2.4B, Grubhub stabilizes, and cross-sell plus software/media mix improve quality
    - 3.5x-4.5x blended sales on roughly $2.4B-$2.5B revenue
    - ~$8.5B-$11.0B
    - Requires evidence of retention and segment margin progress, not just funding support
    - Grubhub share keeps falling or synergies fail to appear
  - - Base
    - Combined platform holds >$2.2B revenue, no major integration breakdown, and public comp band stays intact
    - 2.5x-3.5x blended sales on roughly $2.2B-$2.4B revenue
    - ~$5.5B-$8.5B
    - Consistent with current mark but leaves limited margin of safety
    - Another large raise arrives before clean KPI disclosure
  - - Bear
    - Marketplace erosion continues, acquired revenue proves lower quality, and comp multiples compress
    - 1.5x-2.0x blended sales on roughly $2.0B-$2.3B revenue
    - ~$3.5B-$5.0B
    - Most likely when Grubhub deterioration dominates the story
    - Down-round or public-market discount to private mark
