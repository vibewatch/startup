company:
  name: Wonder
  website: https://www.wonder.com
chapter:
  number: 1
  title: Company Overview
  summary: Wonder is a New York-based private food platform founded by Marc Lore in 2018 that evolved from mobile kitchens into delivery-first food halls, then accelerated into a multi-asset “super app for mealtime” through the Blue Apron, Relay, Grubhub, and Tastemade acquisitions. Public evidence shows at least $1.6 billion of capital raised, a latest funding mark above $7 billion in May 2025, 46 locations by May 2025, 90th and 91st openings by early 2026, and a company target to scale from 100 to 200+ locations by end-2026. The main diligence tension is that Wonder’s growth narrative is heavily corroborated, but current standalone revenue, headcount, customer count, and full governance disclosure remain private while the company absorbs several challenged or complex assets.
sections:
- id: identity-model-footprint
  title: Identity, Product Model, and Geographic Footprint
  body: 'Wonder describes itself as a new kind of food hall built to make great food more accessible and to become a “super app for mealtime.” The official site and mission pages consistently present the core product as multi-restaurant ordering: customers can mix cuisines from multiple restaurant concepts in a single order, then receive delivery, pickup, or dine-in service from delivery-first locations. Wonder’s assortment strategy is unusually broad for a restaurant operator because it combines proprietary menus with chef-branded and partner restaurant concepts sourced from around the country, while still keeping a sub-30-minute service promise. The official delivery and mission pages show a dense Northeast footprint across New York, New Jersey, and Pennsylvania, while trade coverage identifies Wonder as New York-based and expanding into adjacent Northeast markets rather than nationwide physical coverage so far. That geography matters because the company’s operational model depends on
    tight delivery radii, dense kitchen utilization, and repeatable local expansion rather than pure marketplace aggregation.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
