- id: milestones-scale-and-principal-risks
  title: Milestones, Scale Indicators, and Principal Diligence Risks
  body: 'The public milestone record shows fast iteration. Wonder was founded in 2018, launched its mobile-restaurant model in 2020, and pivoted to brick-and-mortar in February 2023. From there the company layered a Blue Apron acquisition, José Andrés board appointment, Walmart store partnership, Relay acquisition, Grubhub announcement and closing, Tastemade acquisition, and a new $600 million financing in roughly eighteen months. Scale indicators moved with those decisions: Wonder went from 11 brick-and-mortar locations in March 2024 to 28 locations plus seven scheduled openings by November 2024, then 46 locations in May 2025, 90+ openings by early 2026, and an official careers-page target of 200+ locations by end-2026. The biggest diligence risks sit beneath that growth line. Blue Apron came in after a deep public-market collapse, Grubhub was bought at a steep discount to Just Eat Takeaway’s 2020 purchase price and still carried fee-cap and profitability overhangs, and Wonder has not publicly
    separated current standalone revenue, headcount, or customer counts from the acquired businesses it is now integrating.'
