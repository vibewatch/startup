- id: TO003
  title: Stakeholder or investor map
  columns:
  - Stakeholder
  - Role
  - Control / economic importance
  - Diligence ask
  rows:
  - - Marc Lore
    - Founder, chairman, CEO, investor
    - Operational control center and repeat personal capital provider, including $100M in the 2024 round.
    - Confirm voting control, board rights, and founder liquidity / secondary history.
  - - NEA / Accel / GV / Forerunner
    - Core financial backers
    - Appear repeatedly across late-stage financings and anchor the company’s institutional support base.
    - Request round-by-round ownership, liquidation preferences, and pro rata behavior.
  - - Nestlé
    - Strategic investor and product-development partner
    - Adds corporate validation plus potential food / equipment commercialization paths.
    - Clarify exclusivity, commercial revenue contribution, and any preferential economics.
  - - Amex Ventures
    - Strategic investor
    - Shows interest from a consumer/payments adjacency in the 2025 round.
    - Determine whether Amex provides distribution, payments, or only capital.
  - - Walmart
    - Retail footprint partner
    - Provides a physical-distribution experiment beyond standalone stores.
    - Measure unit economics, traffic conversion, and whether Walmart rollout rights are exclusive.
  - - Blue Apron
    - Meal-kit asset
    - Broadens Wonder into subscription and grocery-adjacent meal occasions.
    - Request current Blue Apron retention, cross-sell, and profitability under Wonder ownership.
  - - Grubhub
    - Marketplace and enterprise-delivery asset
    - Adds national merchant, delivery, campus, and corporate-account reach.
    - Validate integration roadmap, overlap economics, and fee-cap exposure by market.
  - - Tastemade
    - Media and content asset
    - Adds audience acquisition, ad inventory, and branded-content distribution.
    - Quantify monetization, customer-acquisition efficiency, and integration into ordering flows.
  notes: 'This map is intentionally partial: it covers only publicly named investors, strategic partners, and acquired assets that materially shape Wonder’s economics or control surface.'
