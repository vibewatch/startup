- id: founder-leadership-governance
  title: Founder, Leadership, and Governance Surface
  body: Wonder remains strongly identified with founder Marc Lore. Independent profiles and company-adjacent sources consistently frame Lore as founder, chairman, and chief executive officer, with prior credibility from building Jet.com and then running Walmart U.S. eCommerce after Walmart acquired Jet. Public governance disclosure is thinner below Lore, but the visible leadership pattern is still informative. José Andrés formally joined the board in November 2023, adding celebrity-chef governance credibility as Wonder was expanding its chef-partner model and Blue Apron integration. Daniel Shlossman appears publicly as Chief Marketing and Growth Officer and is the clearest nonfounder spokesperson on growth, partnerships, and unit economics. Jason Rusk shows up in operating and expansion coverage, while Larry Fitzgibbon joined through the Tastemade acquisition to lead Wonder’s media and content arm. The available record therefore supports a founder-centric operating model with selective public
    disclosure of functional leaders, but not a complete contemporary executive roster or full post-acquisition board list.
  claimRefs:
  - CO009
  - CO010
  - CO011
