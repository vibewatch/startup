            body: >
              Grubhub's public merchant stack is substantially better documented than Wonder's owned kitchen stack,
              which gives the best outside-in read on how the combined platform may operate. The merchant portal exposes
              menu, promotion, review, boundary, and order controls across Marketplace and Direct, while separate
              integration pages explain how orders can flow directly into restaurant POS systems and how delivery
              responsibility can shift between Grubhub's fleet and merchant self-delivery. Those are meaningful
              operating signals because they show Wonder inheriting working merchant infrastructure instead of having to
              build every B2B surface from scratch. Public hiring pages also show both Wonder and Grubhub recruiting
              across operations, product, and technology, reinforcing that the company is not just expanding kitchens
              but building software and coordination capabilities around them. Even so, public quality controls remain
              mostly operational and marketing-oriented—customer service, guarantees, delivery boundaries, review tools,
              and synchronized prep—rather than engineering disclosures such as uptime targets, incident history,
