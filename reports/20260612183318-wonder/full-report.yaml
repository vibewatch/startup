  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Consumer proposition and kitchen footprint
        blocks:
          - type: paragraph
            body: >
              Wonder's consumer promise is straightforward and differentiated in a crowded delivery market: one order
              can combine items from many restaurants, move through one synchronized kitchen workflow, and still land in
              roughly half an hour. Official Wonder pages describe delivery, pickup, and dine-in as parallel modes
              rather than separate products, which matters because the same physical sites are expected to serve digital
              orders, local pickup, and a limited dine-in experience from one operating footprint. The Quakertown
              Walmart opening shows how that promise translates into a smaller-format, retailer-attached kitchen with a
              curated subset of menus rather than the full lineup of a dense urban flagship. Third-party reporting also
              suggests the local radius is intentionally tight, which helps protect food quality but makes site density,
              courier availability, and production sequencing central to the model. The result is a fast-fine
              proposition that is credible on the surface, but whose economics and operational tolerance still appear
              highly local and execution sensitive.
