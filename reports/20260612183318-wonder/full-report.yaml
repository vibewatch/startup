      - number: '8.3'
        title: Comparable set and blended multiple logic
        blocks:
          - type: paragraph
            body: >-
              The cleanest public way to frame Wonder is as a blended delivery, commerce, and restaurant-enablement
              platform. DoorDash's June 2026 market cap was $65.61 billion; against Q1 2026 revenue of $4.0 billion,
              that implies about 4.1x annualized sales. Uber's June 2026 market cap was $140.15 billion; against Q1 2026
              revenue of $13.2 billion, that implies about 2.7x annualized sales, although Uber's mix is broader than
              food delivery. Instacart crossed $10 billion of quarterly GTV and $1 billion of quarterly revenue in Q1
              2026, while Yahoo Finance showed a market cap of roughly $9.7 billion, implying less than 2.4x annualized
              revenue. Toast's June 2026 market cap was $14.39 billion; its Q1 2026 revenue was $1.63 billion and ARR
              was $2.2 billion, supporting about 2.2x annualized revenue or about 6.5x ARR.


              Against that band, Wonder's headline mark looks less outrageous on blended revenue than the narrative
              around a $7 billion private valuation might suggest. If the only safe revenue floor is more than $2
              billion inclusive of Grubhub, the implied multiple is under 3.5x sales. That sits above Uber- and
              Instacart-like blended commerce valuations but below DoorDash's run-rate sales multiple and well below
              Toast's ARR framing. The problem is composition. Wonder's $2 billion figure includes Grubhub and therefore
              includes a distressed asset with falling share, inherited low-quality marketplace economics, and
              unresolved integration questions. The private mark is therefore explainable on blended comps, but only
              near the upper half of a reasonable band and only if management can prove cross-sell, retention, and
              margin improvement after the roll-up.
            claimRefs:
              - CV007
