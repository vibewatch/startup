chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Product Model, and Geographic Footprint
        blocks:
          - type: paragraph
            body: >-
              Wonder describes itself as a new kind of food hall built to make great food more accessible and to become
              a “super app for mealtime.” The official site and mission pages consistently present the core product as
              multi-restaurant ordering: customers can mix cuisines from multiple restaurant concepts in a single order,
              then receive delivery, pickup, or dine-in service from delivery-first locations. Wonder’s assortment
              strategy is unusually broad for a restaurant operator because it combines proprietary menus with
              chef-branded and partner restaurant concepts sourced from around the country, while still keeping a
              sub-30-minute service promise. The official delivery and mission pages show a dense Northeast footprint
              across New York, New Jersey, and Pennsylvania, while trade coverage identifies Wonder as New York-based
              and expanding into adjacent Northeast markets rather than nationwide physical coverage so far. That
              geography matters because the company’s operational model depends on tight delivery radii, dense kitchen
              utilization, and repeatable local expansion rather than pure marketplace aggregation.
