      - number: '2.3'
        title: Buyer, user, and payer segmentation for Wonder plus Grubhub
        blocks:
          - type: paragraph
            body: >-
              Wonder’s combined model is multi-sided. The obvious user is the self-pay diner who wants convenience,
              assortment, and quick repeat ordering. But the payer and budget owner change by use case. A family or
              group order may still originate in a consumer wallet, yet the decision logic shifts toward variety and
              basket consolidation. Grubhub’s marketplace breadth, merchant hub, and campus pages show that Wonder also
              touches merchant buyers that pay for visibility or direct-ordering tools, students or
              university-affiliated users paying with meal plans or campus cards, and employers or administrators
              funding workplace meals through approved budgets.


              This segmentation matters because it changes what ‘market share’ means. A Wonder order is not always just
              one household buying one meal. It can also be a campus transaction, an employer-sponsored meal, or a
              merchant monetizing through a marketplace plus first-party ordering stack. DoorDash’s and Uber’s workplace
              and cross-channel materials reinforce that the biggest platforms increasingly compete for the same meal
              occasion across delivery, pickup, reservations, and office meals. Wonder’s Grubhub asset therefore expands
              buyer coverage beyond a pure direct-to-consumer kitchen thesis.
