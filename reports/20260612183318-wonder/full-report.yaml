      - number: '3.2'
        title: Adjacent channels and legacy assets can still redirect meal intent before Wonder sees it
        blocks:
          - type: paragraph
            body: >-
              Wonder also competes in a broader channel map than a simple DoorDash-versus-Uber frame suggests. Instacart
              is adjacent rather than identical, but that adjacency matters because it captures grocery, prepared-meal,
              and convenience occasions that can easily substitute for restaurant delivery. Its 10-K says it reaches 98%
              of North American households and more than 1,800 retail banners, and its consumer surfaces now include
              ready meals and restaurant ordering powered by Uber Eats. That means meal intent can be intercepted before
              a diner ever opens a traditional restaurant marketplace.


              Grubhub, meanwhile, is strategically more useful to Wonder as an owned distribution asset than as the
              current national-share leader. Grubhub still offers marketplace, direct ordering, multiple fulfillment
              modes, campus-card ordering, and a merchant base it says exceeds 415,000 partners across 4,000 cities. Its
              Starbucks, Amazon, and Wonder-app distribution ties show why the asset remains important even after losing
              national consumer share. Wonder’s own surfaces add one more twist: unlike pure marketplaces, it tries to
              combine demand capture with owned restaurants and managed fulfillment. That is strategically richer than a
              single app, but it also raises the execution bar.
