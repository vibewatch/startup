      - number: '8.5'
        title: Exit readiness and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              An eventual IPO or large strategic exit requires more than growth headlines. Public markets will need
              evidence that the combined company is not simply aggregating revenue but improving the economics of that
              revenue. The highest-priority watch items are Grubhub order and share stabilization, segment-level margin
              disclosure, proof that Wonder-owned brands can capture profitable demand from marketplace traffic, and
              evidence that Blue Apron and Tastemade create more than narrative optionality. Without those datapoints,
              an IPO would likely be valued with a discount for opacity and integration risk.


              The thesis breaks if any of four things happen. First, the combined revenue story fails to translate into
              a credible segment bridge, leaving investors unable to separate legacy Wonder from acquired lines. Second,
              Grubhub continues shrinking faster than synergies arrive, confirming that Wonder bought traffic but not
              durable economics. Third, another capital raise occurs before management discloses meaningful integration
              progress, suggesting the May 2025 round bought time rather than proof. Fourth, public comps re-rate lower
              while Wonder still depends on a private-market premium. Each of those outcomes would push the investment
              case from fair-to-stretched into clearly overstated.
            claimRefs:
              - CV015
              - CV017
              - CV018
              - CV036
              - CV041
              - CV045
              - CV046
          - type: table
            tableRef: TV005
            claimRefs:
              - CV017
              - CV018
              - CV034
              - CV035
              - CV036
              - CV041
              - CV045
              - CV046
      - number: '8.6'
        title: Recommendation and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              The correct recommendation is research-more. There is enough public evidence to explain why sophisticated
              investors could price Wonder above $7 billion: combined revenue is already large, the platform now spans
              first-party meals, marketplace demand, subscriptions, institutional channels, and adjacent software/media,
              and public comp multiples are not so low that a blended 3x-plus sales mark is impossible. There is not
              enough evidence to call the valuation obviously attractive because the company has not publicly separated
              legacy Wonder economics from Grubhub, Blue Apron, Relay, or Tastemade.


              That leaves the valuation in a narrow zone between fair and stretched. If management can show that more
              than $2 billion of revenue is holding, that Grubhub volume can be monetized more effectively inside
              Wonder, and that segment margins are improving rather than merely being combined, the current mark can
              look fair. If instead the roll-up mostly imported low-quality revenue and the next financing arrives
              before clean integration evidence, the mark will look like a private-market markup laid over deteriorating
              assets. The diligence unlocks are therefore specific: a segment revenue bridge, location-level unit
              economics, Grubhub order/share and take-rate trends under Wonder ownership, acquisition-synergy tracking,
              headcount and integration cost disclosure, and a current cap-table or preference-stack view.
            claimRefs:
              - CV007
