  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Capital stack, funding chronology, and acquisition burden
        blocks:
          - type: paragraph
            body: >-
              Wonder’s financial story starts with funding scale, not audited disclosure. Public reporting and official
              announcements show a late-2023 to mid-2025 sequence of large capital events: Nestlé’s $100 million
              strategic investment in November 2023, a $700 million March 2024 growth round that included $100 million
              from Marc Lore, a November 2024 Grubhub announcement financed through a $650 million enterprise-value
              structure plus a separate $250 million raise from new investors, and another $600 million round in May
              2025 at a valuation above $7 billion. That sequence matters because it shows Wonder financing both
              geographic buildout and a rapid roll-up strategy at the same time.


              The burden side is just as important. Publicly disclosed acquisition checks already sum to at least $843
              million across Blue Apron ($103 million), Grubhub ($650 million enterprise value), and Tastemade (about
              $90 million), before any undisclosed Relay consideration and before normal store buildout, labor ramp, and
              systems integration costs. In other words, even though Wonder has raised enormous capital, a large portion
              of that capital has likely been spoken for by acquisitions or acquisition-linked financing rather than by
              purely organic four-wall expansion. The resulting underwriting question is not whether Wonder can raise
              money; it is whether the combined business can convert that money into durable cash-generation before
              another large financing cycle is needed.
