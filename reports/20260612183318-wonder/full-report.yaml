      - number: '7.4'
        title: Mitigants, monitoring indicators, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              This chapter is not a one-way downside list because Wonder does have evidence-backed mitigants. Management
              can point to a larger merchant and delivery base from Grubhub, an owned-store footprint that is still
              expanding, a publicly described expansion playbook, and capability extensions through Relay, Blue Apron,
              and Tastemade. The question is whether those assets become reinforcing or simply make the organization
              harder to manage. For diligence, the monitorable indicators are clearer than the public answer set. If
              Grubhub's share, retention, or order growth continues to lag while DoorDash and Uber keep posting strong
              user and booking growth, the acquisition thesis weakens. If new labor settlements, deactivations, or
              market exits recur, the logistics stack is not robust enough for the regulatory environment. If store
              expansion continues but the company cannot show contribution-margin improvement or lower subsidy needs,
              capital intensity becomes the dominant risk. And if Marc Lore remains the visible architect of strategy
              without a comparably visible bench, governance and succession risk should be underwritten explicitly
              rather than treated as background noise.
