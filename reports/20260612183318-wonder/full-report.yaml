  - id: TP001
    title: Competitor profile table
    columns:
      - competitor
      - category
      - public scale / footprint
      - target segment
      - differentiation
      - limitation / caution
    rows:
      - - DoorDash
        - Direct incumbent marketplace
        - 60.7% U.S. share; 933M Q1 2026 orders; $31.6B Q1 GOV
        - Mass-market restaurant discovery, merchants, memberships
        - Highest visible U.S. consumer demand density plus public merchant-plan packaging
        - Low ownership of food supply; merchant economics stay contested
      - - Uber Eats / Uber Delivery
        - Direct incumbent marketplace
        - 3.6B Q1 2026 trips; $53.7B gross bookings; 50M Uber One members
        - Consumers, merchants, and managed business meal budgets
        - Cross-sells delivery into mobility and workplace spend
        - Restaurant-delivery share trails DoorDash and owned food supply is limited
      - - Instacart
        - Adjacent mealtime / grocery platform
        - 98% NA household reach; 1,800+ banners; 4,100+ Ready Meals stores in 35 states
        - Grocery, convenience, prepared meals, and app-based restaurant adjacencies
        - Can intercept meal intent before a diner opens a restaurant marketplace
        - Restaurant flow is adjunct and currently powered by Uber Eats rather than owned demand
      - - Grubhub
        - Owned legacy marketplace / integration asset
        - 6.3% U.S. share; 415,000+ merchants in 4,000+ cities; campus footprint
        - Marketplace diners, campus programs, direct ordering, merchant tools
        - Still owns niche distribution channels that Wonder can route through
        - Standalone national consumer share is much weaker than DoorDash or Uber
      - - CloudKitchens
        - Kitchen-infrastructure competitor
        - 600+ brands; highest-demand delivery markets; 20+ private kitchens per location
        - Restaurants seeking delivery-first expansion without full buildout
        - Operates on kitchen productivity and location economics rather than app share
        - No obvious mass consumer discovery layer; operator economics remain company-claimed
      - - Kitchen United
        - Failed / retrenched ghost-kitchen comparator
        - Closed physical units and Kroger sites after prior $100M growth round
        - Chains wanting multi-brand virtual food-hall distribution
        - Early proof that software plus shared kitchens could aggregate brands
        - Retreated from physical expansion and pivoted back toward software
      - - Reef
        - Failed / retrenched ghost-kitchen comparator
        - Closed three NY facilities; layoffs; shifted from ghost kitchens toward tech licensing
        - Brands wanting delivery-only kitchens in parking-lot or venue settings
        - Showed how alternative real estate could host distributed kitchens
        - Retrenchment indicates fragile demand and hard unit economics
      - - Traditional restaurants / local independents
        - Status-quo substitute set
        - Large restaurant base with direct pickup, dine-in, and first-party ordering options
        - Local diners, regulars, and merchants that want channel ownership
        - Can avoid marketplace fees and preserve direct customer relationship
        - Weaker discovery and delivery density than scaled platforms
    notes: >-
      Public scale mixes official metrics, official network claims, and retained third-party market-share data;
      failed-comp rows emphasize why kitchen infrastructure alone is not a moat.
    claimRefs:
      - CP001
      - CP002
      - CP006
