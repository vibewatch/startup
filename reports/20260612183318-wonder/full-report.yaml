      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The investable conclusion is mixed. Wonder has clearly built a broader revenue stack than a normal
              restaurant chain and has raised enough capital to force the market to take the platform thesis seriously.
              The combination of first-party food sales, Blue Apron meal kits, Grubhub marketplace and institutional
              channels, WonderWorks B2B operations, and Tastemade advertising/content gives the company multiple shots
              on goal. The same combination also multiplies execution risk because it layers store-level capex, kitchen
              labor, delivery density, subscription economics, merchant-side monetization, and post-merger integration
              into one balance sheet story.


              The blockers are concentrated in missing denominators. Public sources do not provide current cash on hand,
              monthly burn, runway in months, legacy Wonder standalone revenue, channel-level gross margins,
              location-level throughput, customer acquisition cost, Blue Apron retention under Wonder ownership, or the
              portion of Grubhub traffic that actually converts into Wonder-owned food sales. That means the chapter can
              support a directional view — revenue stack breadth is real, capital intensity is high, and margin pressure
              is nontrivial — but not a clean underwriting model. Before taking valuation comfort from the >$2 billion
              combined revenue figure or the >$7 billion mark, diligence needs a management packet that reconciles
              capital raised, segment revenue, debt obligations, and cash burn across the assembled platform.
            claimRefs:
