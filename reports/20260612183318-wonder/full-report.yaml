    title: Pricing / packaging comparison
    columns:
      - company / model
      - public pricing or packaging signal
      - what is included publicly
      - what remains unknown
      - implication
    rows:
      - - DoorDash marketplace plans
        - 15% delivery / 6% pickup Basic; 25% delivery / 6% pickup Plus
        - Search placement, expanded radius, DashPass access by tier
        - Net economics after promotions, ads, and local regulation
        - DoorDash can publicly ladder merchants into higher-value plans
      - - Uber Eats merchant platform
        - No comparable headline commission schedule visible on retained page
        - Marketplace demand, own-channel delivery, and storefront options
        - Actual take rates by merchant cohort
        - Uber competes on flexibility even when pricing is less explicit publicly
      - - Uber for Business
        - Policy-managed meal budgets rather than consumer sticker pricing
        - Office lunches, hybrid teams, visibility into spend, Uber One options
        - Unit economics by employer program
        - Uber can win payer-controlled occasions that consumer apps alone do not
      - - Grubhub marketplace + Direct
        - No up-front cost or commitment; Direct marketed as commission-free
        - Marketplace, pickup, self-delivery, supplemental delivery, branded site
        - Blended merchant economics after ads and promos
        - Grubhub can defend merchants that want both reach and channel ownership
      - - Instacart ready meals
        - Delivery fees start at $3.99 for same-day orders over $35
        - Prepared meals, personal shopper, membership offsets via Instacart+
        - Restaurant-specific take rate because restaurant flow is in-app and partner-powered
        - Instacart competes on convenience bundles more than classic restaurant commissions
      - - CloudKitchens infrastructure
        - Open ten restaurants for the price of one; ultra-low upfront investment
        - Prebuilt kitchens, managed infrastructure, delivery-first sites
        - Actual rent, occupancy, and margin profile by market
        - Merchant economics shift from commission math to facility-utilization math
      - - Traditional direct ordering
        - No marketplace commission if restaurant owns the channel
        - Direct customer relationship, pickup, or owned delivery
        - Customer-acquisition and staffing cost borne by restaurant
        - Local independents remain a viable substitute when marketplace fees feel too high
    notes: >-
