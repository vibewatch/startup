      Comparable set is intentionally mixed because Wonder combines marketplace, first-party food, and software-adjacent
      revenue.
  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / event
      - Transmission to thesis
      - Action implication
    rows:
      - - Segment opacity persists
        - Management still cannot disclose a post-Grubhub segment revenue and margin bridge in the next financing cycle
        - Prevents investors from separating high-quality growth from acquired bulk revenue
        - Treat the current mark as overstated and avoid common-equity underwriting
      - - Grubhub deterioration continues
        - Share remains around low-single digits or orders keep falling materially
        - Turns the largest acquired traffic asset into a drag instead of a flywheel
        - Move valuation toward bear range
      - - Another large raise before KPI proof
        - Fresh capital is needed before integration KPIs and synergy evidence are public
        - Suggests the 2025 raise bought time rather than proof
        - Assume higher dilution and private-mark fragility
      - - Comp band compresses
        - DoorDash, Uber, Instacart, and Toast de-rate materially while Wonder remains private
        - Removes the public-multiple support beneath the current private mark
        - Reprice Wonder on lower public benchmarks
      - - Synergy story disappoints
        - Cross-sell, take-rate, or four-wall data fail to improve despite added assets
        - Shows the roll-up did not raise revenue quality enough to earn a premium multiple
        - Shift stance from fair-to-stretched to stretched
    claimRefs:
      - CV017
      - CV018
      - CV034
      - CV035
      - CV036
      - CV041
      - CV045
      - CV046
    notes: Triggers focus on monitorable public events most likely to force multiple compression or a private-mark reset.
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Segment revenue bridge
        - Legacy Wonder, Grubhub, Blue Apron, Tastemade, and services revenue split
        - Without it the headline >$2B figure cannot be valued by quality
        - Management deck or lender diligence pack
      - - Segment margin bridge
        - Gross margin and EBITDA by major business line
        - Determines whether the blended multiple should resemble DoorDash, Uber, or distressed assets
        - CFO operating review and board materials
      - - Grubhub post-close trend
        - Orders, share, GTV, take rate, and promo load since Wonder ownership
        - The largest acquired asset is the biggest swing factor in valuation quality
        - Monthly operating KPI package
      - - Legacy Wonder unit economics
        - Sales per location, four-wall margin, labor and occupancy ratios, payback by cohort
        - Shows whether the original thesis works without acquisitions
        - Store cohort model by market
      - - Integration cost and synergy tracking
        - One-time integration expense, duplicated headcount, achieved savings
        - Required to judge whether roll-up complexity is accretive or dilutive
        - Integration PMO reporting
      - - Cap table / preference stack
        - Current ownership, note terms, and any liquidation preferences or ratchets
        - Private valuation is much harder to interpret without stack visibility
        - Legal or financing counsel materials
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV036
      - CV043
      - CV046
    notes: Each ask names the minimum private evidence needed to move from research-more to a firmer valuation stance.
