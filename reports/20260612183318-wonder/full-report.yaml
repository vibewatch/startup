      - number: '8.4'
        title: Bull, base, and bear scenarios
        blocks:
          - type: paragraph
            body: >-
              The bear case treats Wonder as a mixed-quality roll-up whose largest acquired asset keeps eroding. If
              combined revenue is only modestly above $2 billion, if Grubhub's share continues to slip, and if
              public-market multiples for delivery and commerce compress toward roughly 1.5x to 2.0x sales, a valuation
              range around $3.5 billion to $5.0 billion is more defensible than today's mark. That is the scenario where
              the private round eventually looks like a markup taken before integration evidence existed.


              The base case assumes the combined platform stabilizes and that the market continues to value scaled
              meal-commerce and restaurant-enablement businesses in a roughly 2.5x to 3.5x revenue band. On a reasonable
              $2.2 billion to $2.4 billion blended revenue base, that produces an approximate value range of $5.5
              billion to $8.5 billion. In that framework, the current $7 billion-plus mark is supportable but not cheap.
              The bull case requires both growth and quality upgrades: durable revenue above $2.4 billion, credible
              cross-sell from Grubhub to Wonder-owned brands, better segment margin visibility, and investor willingness
              to pay 3.5x to 4.5x blended sales for a platform that looks more like a scaled super-app than a
              stitched-together portfolio. That yields roughly $8.5 billion to $11.0 billion and is the case implied by
              enthusiastic private-market pricing rather than by current public disclosure.
            claimRefs:
              - CV033
              - CV040
              - CV041
              - CV042
              - CV044
              - CV045
