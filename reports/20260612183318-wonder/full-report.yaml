  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The bull case for Wonder rests on combination rather than purity. By May 2025 the company had raised
              another $600 million at a valuation above $7 billion, QSR reported more than $2 billion of revenue
              inclusive of Grubhub, and management was still framing the product as a convenience-heavy mealtime
              platform rather than a single-format restaurant chain. The strategic logic is that Wonder can combine
              first-party prepared meals, Blue Apron meal kits, Grubhub marketplace demand, institutional channels,
              WonderWorks-style operating services, and Tastemade media into one customer-acquisition and fulfillment
              loop. If that loop works, the public-comp set should be wider than restaurants alone and should include
              scaled marketplaces and restaurant software.


              The anti-thesis is that the combined revenue floor may flatter quality more than economics. The $2 billion
              figure includes Grubhub, which Wonder bought only after Just Eat Takeaway sold the asset for $650 million,
              about 91% below the $7.3 billion it paid in 2020. Consumer Edge said Grubhub's share had fallen to 6%
              nationally before the sale, and Restaurant Business reported North America orders were down more than 26%
              over three years. Blue Apron's pre-close filings show revenue but also meaningful losses. That means the
              current mark can be defended only as a blended platform valuation with turnaround optionality; it is much
              harder to defend as proof that legacy Wonder alone already merits unicorn-plus pricing.
            claimRefs:
              - CV006
              - CV007
              - CV010
