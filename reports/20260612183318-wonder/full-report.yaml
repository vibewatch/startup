      - number: '4.3'
        title: Cost structure, margin pressure, and comparable economics
        blocks:
          - type: paragraph
            body: >-
              Public data suggests Wonder’s hardest financial work is below the revenue line. Blue Apron’s
              pre-acquisition filing history shows what happens when meal-kit scale does not outrun marketing,
              fulfillment, and retention friction: Blue Apron reported $458.5 million of 2022 net revenue but still lost
              $109.7 million on a GAAP basis and $79.3 million on an adjusted EBITDA basis. Grubhub’s inherited 2023
              economics were better but still hardly pristine: Just Eat Takeaway disclosed 237 million orders, €8.06
              billion of GTV, €94 million of adjusted EBITDA, and negative €77 million of free cash flow before
              working-capital changes. Those figures explain why Wonder was able to buy a scaled delivery asset cheaply
              and why integration upside is still speculative.


              Scaled public comps also show how thin the economics can be even at much larger network density.
              DoorDash’s Q1 2026 results implied roughly 12.8% net revenue margin on marketplace GOV and only 6.2% GAAP
              gross profit as a percentage of GOV, while Uber posted 4.6% adjusted EBITDA margin as a percentage of
              gross bookings. Those are not Wonder metrics, but they are useful guardrails: even category leaders need
              logistics density, controlled promotions, and disciplined take-rate architecture to make the model work.
              Against that backdrop, New York City fee caps, restaurant commission complaints, labor intensity, food
              waste, and location buildout all remain real margin-pressure vectors for Wonder.
