      - number: '6.4'
        title: Retention signals and adverse pressure
        blocks:
          - type: paragraph
            body: >-
              The public durability record is strongest as a proxy set, not as a true retention ledger. Wonder's iPhone
              listing shows a 4.9 rating from roughly 39,000 ratings, and JustUseApp reflects the same headline rating
              while also surfacing enough negative reviews to show that missing items, order failures, and perceived
              quality inconsistency are not hypothetical. Grubhub's scale surfaces are even bigger—4.8 from 4.6 million
              App Store ratings and similar positioning on Google Play—but adverse evidence is also louder. The retained
              Trustpilot page shows a 2.9/5 average and recent complaints around failed deliveries, cold food, and weak
              support. On the business side, Grubhub cites Grubhub+ members ordering four times a month and almost 70%
              more often than non-members, and Grubhub for Business says more than four out of five clients report
              saving on annual food costs, but those are still platform-selected metrics rather than cohort tables. The
              bigger concern is competitive pressure. TechCrunch reports a 20% year-over-year decline in Grubhub monthly
              active users to 8 million in 2025, while Restaurant Business says North American orders were down 11% in
