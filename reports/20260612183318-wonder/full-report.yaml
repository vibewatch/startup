      - number: '8.2'
        title: Financing context, acquisition load, and valuation discipline
        blocks:
          - type: paragraph
            body: >-
              The key anchor points are public and unusually large. Wonder raised $700 million in March 2024 while
              targeting 35 locations by the end of 2024 and 90 by the end of 2025, and the U.S. Chamber later described
              that round as taking cumulative funding to $1.5 billion. In November 2024 Wonder agreed to buy Grubhub for
              a $650 million enterprise value structure that included $500 million of senior notes and $150 million of
              cash, while simultaneously announcing another $250 million of new-investor capital. In May 2025 Wonder
              then added $600 million more at a valuation above $7 billion. That sequence shows a business graduating
              from rollout financing into acquisition-driven platform financing.


              Discipline matters because the visible acquisition bill is already heavy. Blue Apron cost $103 million,
              Grubhub cost $650 million, and Tastemade reportedly cost about $90 million, implying more than $843
              million of disclosed M&A before Relay consideration, new-store capex, integration expense, or normal burn.
              Public sources still do not disclose Wonder standalone revenue, post-Grubhub segment margins, cash on
              hand, or a full preference stack. As a result, the current mark should be treated as a private financing
              datapoint rather than a fully underwritten intrinsic value. It is useful, but not sufficient, because the
              denominator behind the valuation is mostly blended and partially acquired.
            claimRefs:
              - CV001
