      - number: '1.3'
        title: Capital Base, Stakeholders, and Roll-Up Strategy
        blocks:
          - type: paragraph
            body: >-
              Wonder’s financing history shows a company that moved from concept validation into late-stage private
              scaling unusually quickly. By late 2023 it had already raised a $350 million round at about a $3.5 billion
              valuation and then added a $100 million strategic investment from Nestlé. In March 2024 Wonder closed a
              $700 million round that included another $100 million from Lore himself and a wide investor syndicate
              spanning NEA, GV, Accel, Bain Capital Ventures, Forerunner, and newer backers. The capital story then
              fused with M&A: Blue Apron added meal kits, Relay added last-mile delivery infrastructure, Grubhub added
              national marketplace reach, and Tastemade added media and content distribution. Wonder also disclosed an
              extra $250 million of capital when it announced the Grubhub transaction, then raised another $600 million
              in May 2025 at a valuation above $7 billion. The cumulative picture is a founder-led private consolidator
              using equity, strategic investors, and asset purchases to compress product expansion into a short window.
