      - number: '5.2'
        title: Network expansion through Grubhub, Blue Apron, Relay, and Tastemade
        blocks:
          - type: paragraph
            body: >
              The post-2023 product story is about extensions that widen both supply and use cases. Grubhub contributes
              national merchant density, a courier network, merchant tooling, subscriptions, campus ordering, and
              corporate meal administration; Blue Apron adds meal kits plus heat-and-eat inventory that can live inside
              the same mealtime app; Relay deepens last-mile control in Wonder's core geography; and Tastemade adds
              discovery and content rather than logistics. Public pages make clear that Wonder wants these pieces to
              reinforce each other instead of sitting as disconnected acquisitions. The clearest evidence is the plan to
              place select Grubhub merchants inside the Wonder app while listing Wonder brands on Grubhub, effectively
              turning Wonder into both a first-party operator and a demand aggregator. That breadth creates strategic
              upside, but it also means one customer session may eventually span chef-branded menus, third-party
              merchants, loyalty benefits, business meal budgets, meal-kit fulfillment, and content-led discovery.
