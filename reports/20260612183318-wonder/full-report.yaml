  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Execution complexity and integration scope risk
        blocks:
          - type: paragraph
            body: >-
              Wonder is no longer underwriting one product with one operating loop. The current public stack combines a
              multi-brand local restaurant platform, the national Grubhub marketplace, Blue Apron's meal-kit and
              fulfillment-center operations, Relay's courier network, Tastemade's media audience, and a rapidly growing
              owned-store footprint. Official acquisition language frames that breadth as the path to a mealtime super
              app, but the same breadth is why execution risk is unusually high: every additional asset adds its own
              systems, labor model, margin structure, brand promise, and integration agenda. The direct evidence is not
              speculative. Wonder itself says Grubhub brings hundreds of thousands of merchants and delivery partners;
              Blue Apron came with public going-concern, fulfillment, and food-safety risk factors; and Tastemade
              extends the company into media and advertising rather than just kitchens and logistics. Marc Lore is also
              publicly attached to the super-app vision, which strengthens strategic coherence but raises key-person
              dependence if execution falters or leadership bandwidth gets stretched across too many simultaneous moves.
