- id: growth-drivers-and-adoption-constraints
  title: Growth drivers, channel power, and adoption constraints
  body: 'The structural demand drivers are clear. IMARC and Mordor both show that mobile apps and digital payments now dominate
    the ordering experience. DoorDash’s consumer research adds the behavioral proof: delivery is habit-forming, often self-soothing,
    and increasingly connected to cross-channel loyalty. Variety also matters. Grubhub’s 400,000-plus restaurant breadth,
    cloud-kitchen supply expansion, and merchant-side tooling all reduce search and fulfillment friction. For Wonder specifically,
    chef- or brand-led assortment and the ability to mix multiple concepts in one order line up with the broader market preference
    for convenience plus choice.


    The friction case is equally important. Restaurant operators are still under margin pressure, and third-party commissions
    remain economically meaningful even when the market grows. DoorDash’s own pricing plans, Wharton’s discussion of 15% to
    30% commissions, and Business of Apps’ observation that delivery costs are far higher than half a decade ago all point
    in the same direction. Regulation does not remove the problem so much as reallocate it. NYC’s capped-fee framework and
    delivery-worker pay rules still leave restaurants, platforms, and workers in a cost-sharing tug-of-war. That is why the
    relevant risk is not whether digital demand exists; it is whether participants keep enough margin after fees, labor, and
    promotions to create durable value capture.'
