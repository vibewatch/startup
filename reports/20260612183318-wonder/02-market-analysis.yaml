  evidenceGaps:
  - type: missing-source
    severity: material
    topic: cloud-kitchen-us-size
    missingEvidence: A clean U.S.-only ghost-kitchen revenue or merchant-count estimate that can be reconciled to Wonder’s
      supply model.
    whyItMatters: Without a U.S.-specific operating-layer estimate, public cloud-kitchen data remains a directional proxy
      rather than a direct Wonder SAM input.
    diligencePath: Acquire a full U.S. ghost-kitchen or delivery-only restaurant market report, or obtain merchant census
      data from Grubhub or comparable platforms.
    relatedQuestionRefs:
    - QM006
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: enterprise-campus-mix
    missingEvidence: The split of Grubhub order volume and gross sales across consumer, campus, and corporate channels inside
      Wonder ownership.
    whyItMatters: Wonder’s payer diversification thesis depends on how much non-household demand already exists and whether
      it can be steered toward Wonder-owned supply.
    diligencePath: Request post-acquisition management reporting that breaks out GMV, orders, and active accounts by campus,
      corporate, and consumer channels.
    relatedQuestionRefs:
    - QM014
    - QM024
    relatedTableRefs:
    - TM003
  - type: private-evidence-only
    severity: blocking
    topic: wonder-sam-som
    missingEvidence: Wonder-specific take rate, cross-sell conversion, order frequency, retention, city density, and direct-versus-marketplace
      mix.
    whyItMatters: A precise Wonder SAM or SOM model cannot be defended from public category data alone without channel economics
      and density metrics.
    diligencePath: Request city-level cohort tables, contribution margins by channel, and cross-sell metrics from Grubhub
      or Blue Apron into Wonder-owned brands.
    relatedQuestionRefs:
    - QM024
  - type: missing-source
    severity: material
    topic: fee-cap-economics
    missingEvidence: City-by-city economics showing merchant churn, ad spend, and contribution margin after NYC-style fee-cap
      and worker-pay rules.
    whyItMatters: Topline market growth does not reveal whether Wonder or Grubhub can profitably scale in capped or heavily
      regulated metros.
    diligencePath: Request metro P&Ls for New York City and other regulated markets, including pre- and post-policy order
      mix, take rate, and delivery labor cost.
    relatedQuestionRefs:
    - QM020
    - QM021
    relatedTableRefs:
    - TM004
