- id: underwriting-implications-and-gaps
  title: Underwriting implications and remaining diligence gaps
  body: 'The most defensible Wonder market lens is the overlap of digitally ordered meal demand, delivery-first operating
    models, and multi-sided ordering channels—not the entire restaurant economy and not a single giant global food-delivery
    headline. The restaurant sales ceiling is too broad, while pure ghost-kitchen estimates are too narrow and often not U.S.-specific.
    The right practical middle ground is U.S. app-mediated meal demand plus the merchant, campus, and workplace channels that
    Grubhub can route into Wonder’s broader “mealtime” platform.


    Public evidence still cannot convert that framing into a precise Wonder SAM or SOM. Missing metrics include cross-sell
    rates from Grubhub into Wonder-owned brands, campus and corporate order contribution, local density by city, merchant
    take rates, and post-fee-cap contribution margins. Until management discloses those figures, the chapter should preserve
    contradictory market estimates on purpose and treat them as boundary checks. That keeps the analysis honest: the market
    is unquestionably large enough to matter, but the value capture available to Wonder depends on channel economics, not
    only top-line category growth.'
