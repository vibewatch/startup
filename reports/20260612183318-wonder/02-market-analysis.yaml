- id: sizing-lenses-and-contradictions
  title: Sizing lenses and contradictory market estimates
  body: 'The evidence supports a layered market view, not one hero TAM. IMARC provides the cleanest U.S. digital-ordering
    lens at USD 34.88 billion in 2025, rising to USD 75.36 billion by 2034. That is materially smaller than the total U.S.
    restaurant sales ceiling and also much smaller than the global online-food-delivery totals published by Mordor and Fortune.
    Meanwhile, Grand View’s cloud-kitchen market is smaller again because it measures an operating format rather than all
    delivery demand. For Wonder, those nested layers are useful: they narrow the investable question from all foodservice
    to app-mediated meal demand and then to the delivery-first, multi-brand supply layer that Wonder is actually building.


    The contradiction across vendor estimates is informative rather than embarrassing. Some publishers emphasize GMV-style
    digital-ordering flows, some emphasize a narrower revenue pool, and some cover only the ghost-kitchen infrastructure layer.
    Those scopes should therefore be preserved as separate lenses. Wonder’s market chapter should keep the broad foodservice
    ceiling, the narrower U.S. online-delivery demand pool, and the cloud-kitchen operating layer side by side rather than
    collapsing them into one unsupported SAM number.'
