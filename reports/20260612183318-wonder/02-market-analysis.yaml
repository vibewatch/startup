- id: TM004
  title: Growth drivers and constraints table
  columns:
  - driver / constraint
  - direction
  - timing
  - implication for Wonder
  - diligence ask
  rows:
  - - Mobile ordering and digital payment dominance
    - positive
    - current
    - Supports app-first reordering and lower checkout friction
    - Measure Wonder / Grubhub app conversion and repeat rate by segment
  - - Cross-channel loyalty between delivery and dine-in
    - positive
    - current
    - Delivery can reinforce restaurant familiarity instead of replacing it entirely
    - Request repeat behavior and channel-switching cohorts for Wonder-owned brands
  - - Marketplace variety and merchant breadth
    - positive
    - current
    - Large selection makes multi-brand ordering and discovery more compelling
    - Quantify whether Grubhub breadth improves basket size for Wonder kitchens
  - - Campus and corporate ordering programs
    - positive
    - current to medium term
    - Adds payer diversity beyond self-pay consumer demand
    - Break out GMV or order growth from campus and workplace programs
  - - Cloud-kitchen and virtual-brand supply expansion
    - positive
    - medium term
    - Enables new concepts without full dine-in capex
    - Measure same-kitchen throughput and brand proliferation economics
  - - Restaurant margin pressure and commissions
    - negative
    - current
    - Merchant economics can cap willingness to fund platform commissions or ads
    - Model order profitability net of commissions, promotions, and refunds
  - - NYC fee caps and worker-pay rules
    - negative
    - current
    - Important metro economics can be reset by regulation and labor standards
    - Request city-level contribution margins before and after local rule changes
  - - Post-pandemic normalization and consumer price sensitivity
    - negative
    - current
    - Growth can persist while order frequency becomes more discount-sensitive
    - Test elasticity by subscriber status, promo depth, and meal occasion
  notes: Direction reflects impact on adoption pace or unit economics, not whether the factor exists at all. Positive drivers
    do not cancel the need to prove profitable order density in key cities.
