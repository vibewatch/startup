chapter:
  number: 2
  title: Market Analysis
  summary: 'Wonder’s market should be underwritten as a layered U.S. meal-ordering opportunity rather than one giant TAM:
    a USD 1.55 trillion restaurant ceiling, a far narrower USD 34.88 billion U.S. online food-delivery demand pool, and an
    even smaller delivery-first cloud-kitchen operating layer. The relevant buyer map spans self-pay consumers, merchant partners,
    campus meal plans, and employer-sponsored meals. Mobile ordering, variety, and logistics scale support growth, but channel
    concentration, restaurant margin pressure, labor rules, NYC fee caps, and post-pandemic normalization limit easy value
    capture.'
sections:
- id: market-boundary-and-substitutes
  title: Market boundary, included spend, and substitute behavior
  body: 'Wonder should not be underwritten against all U.S. restaurant spending just because it sells food. Its relevant market
    is the subset of restaurant demand that is digitally discovered, digitally ordered, and fulfilled off-premise through
    a marketplace, a branded app, or a delivery-first kitchen network. IMARC’s U.S. online food delivery market lens and Grubhub’s
    consumer and merchant surfaces both point to the same boundary: the monetizable opportunity sits where consumers value
    fast multi-restaurant choice, where merchants buy access or tools, and where last-mile logistics can convert intent into
    repeat ordering.


    The outer ceiling still matters, but only as a ceiling. The National Restaurant Association’s USD 1.55 trillion 2026 sales
    projection and BLS’s broad NAICS 722 definition show how much larger total foodservice is than Wonder’s immediate revenue
    pool. USDA’s food-away-from-home framing also helps keep grocery and home cooking separate from restaurant-led demand.
    That matters because Wonder’s status-quo substitutes are not just other delivery apps; they include dine-in, takeout ordered
    directly by phone, home cooking, and grocery or meal-kit occasions that do not pass through a third-party or branded digital
    ordering flow.'
