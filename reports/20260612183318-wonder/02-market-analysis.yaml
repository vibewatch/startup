tables:
- id: TM001
  title: Market definition table
  columns:
  - segment / category
  - included spend or workflow
  - excluded spend or workflow
  - buyer / payer
  - Wonder relevance
  rows:
  - - Total U.S. restaurant and foodservice ceiling
    - All restaurant and foodservice sales across dine-in, limited service, catering, and drinking places
    - Grocery retail, home-produced food, and non-restaurant food at home
    - Households, employers, institutions
    - Useful outer ceiling, but far too broad to treat as Wonder’s direct SAM
  - - Digitally ordered restaurant meals
    - App-, web-, or digitally initiated orders for prepared meals, pickup, and delivery
    - Walk-in-only dining with no digital ordering trail
    - Consumer or household payer
    - Core demand layer for Wonder and Grubhub
  - - Marketplace delivery and pickup
    - Discovery, checkout, fulfillment, and repeat ordering on third-party platforms
    - Orders placed entirely outside digital channels
    - Consumer payer; platform intermediates
    - Directly relevant because Grubhub is now part of Wonder
  - - Restaurant-to-consumer digital ordering
    - Branded first-party websites, direct ordering portals, and owned delivery workflows
    - Pure offline repeat business
    - Consumer payer; merchant owns channel
    - Relevant because Grubhub Direct and Wonder-owned surfaces can capture direct demand
  - - Cloud kitchens and virtual brands
    - Delivery-first kitchens, virtual brands, shared production, and multi-brand kitchen utilization
    - Traditional dine-in front-of-house revenue
    - Operator invests; end consumer pays
    - Closest supply-side proxy for Wonder’s multi-brand operating model
  - - Campus and workplace meal programs
    - Meal-plan transactions, campus-card ordering, employer-sponsored meals, and controlled budgets
    - General consumer wallet spend not sponsored by institution or employer
    - University or employer budget owner; user consumes meal
    - Important non-household payer channels that Grubhub already serves
  notes: Boundary logic intentionally separates the broad restaurant ceiling from digital-ordering demand, marketplace economics,
    and the delivery-first supply layer so Wonder is not valued against all foodservice spend.
