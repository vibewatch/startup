- id: revenue-stack-and-public-scale-signals
  title: Revenue stack and public scale signals
  body: 'Wonder no longer looks like a single-format restaurant operator. Its core first-party revenue still comes from owned
    food halls and delivery-first kitchens that let customers order partner-chef menus for delivery, pickup, or dine-in. But
    the public revenue stack now extends materially beyond that base. Blue Apron adds meal-kit and ready-meal revenue. Grubhub
    adds marketplace demand generation, merchant tooling, campus dining, corporate meal programs, and Grubhub+ subscription
    income. WonderWorks adds a supportable B2B hint: CNBC and U.S. Chamber reporting both describe Wonder offering its technology
    and menu know-how to third-party high-volume operators, with CNBC saying the business was already active across 50 external
    locations such as convention centers, theaters, and airports.


    The strongest public scale marker is directional rather than cleanly segmented. QSR’s May 2025 coverage said Wonder had
    more than $2 billion in revenue inclusive of Grubhub, while the same source said management planned to reinvest in faster
    cook times, software, menus, chefs, and restaurant partnerships. That is useful because it confirms the combined platform
    is already large on a revenue basis. It is also insufficient because public sources still do not break out how much of
    that total comes from legacy Wonder food sales versus Blue Apron, Grubhub marketplace activity, B2B operations, or media
    and advertising surfaces inherited through Tastemade. Revenue is therefore evidently large, but revenue quality remains
    only partially visible.'
