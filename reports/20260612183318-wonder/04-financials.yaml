- id: TI002
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current public value / status
  - Revenue quality
  - Diligence ask
  rows:
  - - Wonder first-party food halls
    - Prepared food sold through delivery, pickup, and dine-in from owned locations
    - Order / basket
    - Officially core to the model; normalized public segment revenue unavailable
    - Potentially highest-margin strategic stream if four-wall productivity works, but public contribution margin is undisclosed
    - Request legacy Wonder-only revenue, AOV, order frequency, and four-wall margin by market
  - - Blue Apron meal kits and ready meals
    - Meal-kit subscriptions, non-subscription boxes, and ready meals sold through Blue Apron and Wonder channels
    - Subscription / order
    - Publicly confirmed revenue channel added via $103M acquisition
    - Known recurring-revenue concept, but public history shows losses and retention friction
    - Request current active customers, churn, AOV, and gross margin under Wonder ownership
  - - Grubhub marketplace
    - Merchant demand generation, checkout, and delivery coordination
    - Order / GTV / take rate
    - Large inherited network with 375k+ merchants and 200k delivery partners
    - Scaled but historically low-margin; quality depends on take rate and promotions
    - Request net revenue take rate, promo burden, and adjusted EBITDA by market
  - - Grubhub+ membership
    - Consumer subscription with fee benefits and pickup rewards
    - Monthly subscription
    - Public membership benefits are visible; subscriber count is not
    - Recurring revenue is attractive if attach and retention are healthy
    - Request paying-member count, churn, and subsidy cost per active member
  - - Campus dining
    - Meal-plan and campus-card ordering at 360+ universities
    - Institutional transaction / order
    - Publicly confirmed alternative payer channel
    - Useful for stickier demand, but economics versus standard consumer orders are opaque
    - Request university take rates, order density, and contract renewal schedule
  - - Corporate accounts
    - Employer-funded meal perks and managed budgets for 10k+ companies
    - Program spend / contract
    - Public value proposition is visible; booked revenue not disclosed
    - Potentially better payer quality than ad hoc consumer orders
    - Request gross margin, customer concentration, and net retention for corporate programs
  - - Merchant marketing and Direct tools
    - Marketplace promotions, paid visibility, and unified merchant tooling
    - Ad / SaaS-like merchant spend
    - Merchant tools are visible and refreshed in 2025; revenue mix not disclosed
    - Higher-quality revenue if adoption is real, but no public attach-rate data exists
    - Request merchant ARPU, ad spend per active merchant, and Direct attachment rate
  - - WonderWorks B2B
    - Licensing / operating Wonder tech and menu know-how for third-party venues
    - Location / contract
    - Publicly described as active across 50 external venues
    - Could diversify revenue away from consumer demand volatility, but contract economics are opaque
    - Request contract count, implementation fees, revenue recognition policy, and margin profile
  - - Tastemade advertising and content
    - Media audience, branded content, and ad inventory added via acquisition
    - Campaign / sponsorship
    - Advertising arm is supportable; segment revenue not disclosed
    - Could lower CAC or add high-margin media dollars, but synergy proof is absent
    - Request 2024-2026 revenue, EBITDA, and CAC offset attributable to Tastemade
  notes: Rows separate visibly disclosed monetization mechanisms from the still-undisclosed realized revenue mix and gross-profit
    contribution.
  enumerationScope:
    coverage: partial
    basis: Lists the revenue surfaces that are publicly supportable after Blue Apron, Grubhub, WonderWorks, and Tastemade;
      it is not a disclosed management segment report.
