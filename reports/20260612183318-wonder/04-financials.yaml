tables:
- id: TI001
  title: Capital adequacy table
  columns:
  - Metric
  - Public value / status
  - Evidence / timing
  - Underwriting implication
  - Diligence ask
  rows:
  - - Nestlé strategic investment
    - $100M
    - Nov-2023 strategic investment tied to ingredient / product development
    - Shows strategic backing but not recurring liquidity
    - Request rights, commercial obligations, and whether funds were ring-fenced for specific programs
  - - March 2024 growth equity
    - $700M, including $100M from Marc Lore
    - Closed Mar-2024 with expansion targets for 35 locations by end-2024 and 90 by end-2025
    - Large equity cushion supported store rollout and acquisitions
    - Request round terms, liquidation stack, and how much capital remained pre-Grubhub signing
  - - Grubhub-linked capital raise
    - $250M from new investors
    - Disclosed alongside the Nov-2024 Grubhub announcement
    - Suggests acquisition financing needed fresh outside equity, not only existing balance-sheet cash
    - Request use-of-funds bridge and whether proceeds sat at HoldCo or operating subsidiaries
  - - May 2025 financing
    - $600M at >$7B valuation
    - Reported May-2025 with explicit growth and R&D uses
    - Adds liquidity but raises the bar for future return on capital
    - Request post-money ownership, preference terms, and current cash balance
  - - Seller / debt-like obligation
    - $500M of senior notes in Grubhub transaction
    - Part of the $650M enterprise-value structure
    - Introduces non-common-equity claims that matter for downside recovery and cash servicing
    - Request maturity, coupon, covenants, and any security package
  - - Disclosed acquisition spend
    - '>$843M before Relay and organic buildout'
    - Blue Apron $103M + Grubhub $650M + Tastemade ~$90M
    - A large share of visible capital has gone to M&A rather than only new kitchens
    - Request full acquisition cash/debt/stock consideration schedule and integration budget
  - - Cash on hand
    - null
    - Not publicly disclosed as of runDate
    - Prevents a true runway or liquidity model
    - Request month-end cash by entity plus restricted-cash detail
  - - Monthly burn
    - null
    - Not publicly disclosed as of runDate
    - Blocks capital-adequacy judgment despite large financing history
    - Request monthly cash burn split between corporate, store buildout, Blue Apron, and Grubhub integration
  - - Runway months
    - null
    - Only qualitative “plenty of runway” language is public
    - Makes next-round timing impossible to underwrite
    - Request board runway model with downside cases and covenant sensitivities
  notes: Chronology facts are used only to frame forward capital adequacy; null means no supportable public disclosure was
    retained.
