- id: TI004
  title: Unit economics table
  columns:
  - Metric
  - Public value / null
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Combined revenue marker
    - '>$2B inclusive of Grubhub'
    - low
    - Confirms scale, but not whether the legacy Wonder model is attractive on a standalone basis
    - 'Request segment revenue bridge: legacy Wonder, Blue Apron, Grubhub, WonderWorks, Tastemade'
  - - Blue Apron 2022 net revenue
    - $458.5M
    - high
    - Shows the size of the meal-kit asset Wonder bought, not just its price
    - Request 2023 and 2024 post-close trendline plus current run-rate
  - - Blue Apron 2022 adjusted EBITDA
    - ($79.3M)
    - high
    - Demonstrates that added revenue did not equal healthy cash economics pre-acquisition
    - Request current contribution margin and retention under Wonder ownership
  - - Grubhub FY2023 GTV / orders
    - €8.06B / 237M orders
    - high
    - Provides the inherited transaction scale behind Wonder’s combined revenue claim
    - Request 2024-2026 GTV, order, and take-rate trend under Wonder ownership
  - - Grubhub FY2023 adjusted EBITDA / FCF
    - €94M EBITDA / -€77M FCF pre-working-capital
    - high
    - Shows the asset was scaled but still cash-fragile
    - Request free-cash-flow bridge including capex, incentives, and working-capital normalization
  - - DoorDash Q1 2026 net revenue / gross-profit analog
    - $4.0B revenue on $31.6B GOV; 12.8% net revenue margin; 6.2% GAAP gross profit as % GOV
    - medium
    - Scaled peer economics show how thin delivery economics can remain even with dominant density
    - Benchmark Wonder take rate, gross profit, and promo load against these guardrails
  - - Uber Q1 2026 revenue / bookings / EBITDA
    - $13.2B revenue on $53.7B gross bookings; 4.6% EBITDA margin on bookings
    - medium
    - Another scaled benchmark for blended delivery economics and operating leverage
    - Request Wonder’s adjusted EBITDA bridge by segment to test whether scale is translating
  - - Current cash on hand
    - null
    - low
    - Without cash, burn, or debt service data there is no real runway model
    - Request unrestricted cash, revolver availability, and minimum-liquidity requirements
  - - Store-level four-wall margin
    - null
    - low
    - This is the single most important proof point for the first-party food-hall model
    - Request sales per location, labor %, occupancy %, food cost %, and payback by cohort
  notes: Public values mix direct Wonder facts with inherited asset economics and scaled comparables; null means no supportable
    current public disclosure was retained.
