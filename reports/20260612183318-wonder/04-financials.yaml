- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Why it matters
  - Public proxy today
  - Exact diligence path
  - Underwriting effect
  rows:
  - - Cash on hand
    - Determines whether Wonder can integrate assets and build locations without another raise
    - Only qualitative “plenty of runway” language is public
    - Request latest monthly balance sheet with unrestricted vs restricted cash
    - Runway and downside protection cannot be modeled
  - - Monthly burn / cash conversion
    - Separates growth from value destruction
    - No public monthly burn figure retained
    - Request trailing-12-month monthly cash flow by segment and corporate center
    - Capital adequacy remains narrative, not quantitative
  - - Runway in months
    - Needed to judge urgency of the next financing event
    - No public month-count retained
    - Request board base / downside runway deck including covenant triggers
    - Valuation support is weaker without financing-timing clarity
  - - Legacy Wonder standalone revenue
    - Combined >$2B figure masks what the owned-kitchen model produces by itself
    - QSR says >$2B inclusive of Grubhub
    - Request monthly/annual revenue bridge from legacy Wonder to combined platform
    - Impossible to know whether the original model is economically proven
  - - Channel-level gross margin
    - Revenue mix is not enough; each stream could carry very different cost-to-serve
    - DoorDash and Uber provide only external analogs
    - Request gross margin by Wonder food halls, Blue Apron, Grubhub marketplace, institutional channels, and media
    - Margin quality cannot be judged
  - - Location throughput / kitchen utilization
    - The thesis depends on dense kitchen output and delivery radii
    - Expansion targets and location counts are public, but utilization is not
    - Request orders per labor hour, ticket times, and throughput by location cohort
    - Four-wall moat claims remain unproven
  - - Blue Apron retention and AOV under Wonder ownership
    - Determines whether the acquired meal-kit channel is stabilizing or still decaying
    - Only historical pre-close losses and channel existence are public
    - Request active customers, reorder frequency, AOV, and churn since acquisition
    - Meal-kit revenue could be more dilutive than accretive
  - - Grubhub-to-Wonder cross-sell
    - The roll-up thesis assumes owned brands can monetize marketplace traffic
    - Merchant/Wonder-app integration is public, but conversion data is absent
    - Request funnel from Grubhub diner to Wonder-owned order plus CAC by route
    - Synergy case cannot be underwritten
  - - Headcount and integration cost
    - Roll-up complexity can hide duplicated overhead and restructuring cost
    - No reliable consolidated public figure was retained
    - Request current headcount by segment plus one-time integration budget and achieved savings
    - Operating leverage assumptions remain speculative
  notes: Each row names a specific missing denominator and the concrete diligence request needed to clear it.
  enumerationScope:
    coverage: partial
    basis: Captures the most decision-critical financial unknowns surfaced by the retained public evidence as of runDate;
      it is not an exhaustive management diligence checklist.
