- id: TI003
  title: Pricing / monetization table
  columns:
  - Price / unit / contract
  - Public signal
  - List vs realized pricing
  - Unknowns / discounts
  - Source implication
  rows:
  - - Wonder first-party meals
    - Menu prices vary by concept; no normalized public price book retained
    - Only concept/menu-level pricing is public, not a standard platform rate card
    - Realized food margin, promo spend, and delivery subsidy are unknown
    - Wonder should be underwritten as a multi-concept food operator, not a clean SaaS price sheet
  - - Grubhub+ membership
    - $9.99 per month with $0 delivery fees, lower service fees, and 5% back on pickup orders
    - Clear list price and benefit bundle
    - Subscriber count, churn, and average subsidy cost are unknown
    - Membership can improve repeat demand but can also compress contribution margins
  - - NYC capped delivery-app economics
    - Basic service fees capped at 5%; enhanced service fees capped at 20% of order value
    - Public regulatory ceiling, not realized merchant bill
    - Exemptions, promo offsets, and off-platform monetization vary by case
    - Fee-capped markets limit pure take-rate expansion
  - - Campus dining
    - Meal plans or campus cards fund certain on-campus orders
    - Payer mechanism is public; per-campus commercial terms are not
    - University revenue share, implementation fees, and subsidy economics are unknown
    - Institutional demand exists, but profitability may differ from core consumer orders
  - - Corporate accounts
    - Budget controls and pay-only-for-what-is-ordered employer programs
    - Program architecture is public; contract pricing is not
    - Gross margin, minimums, and customer concentration are unknown
    - Corporate spend may be higher quality revenue than one-off consumer delivery
  - - WonderWorks B2B
    - No public contract price retained
    - Commercial existence is public; pricing is undisclosed
    - Implementation, recurring support, and revenue-recognition terms are unknown
    - Potentially valuable but currently impossible to model from public sources alone
  - - Blue Apron under Wonder
    - Meal-kit and ready-meal channel is public; retained sources did not expose current retail or subscription price ladders
    - Historical SKU pricing exists in market practice but not in the retained direct-URL set
    - Discounting, retention offers, and cross-sell effects are unknown
    - Public-channel existence does not equal healthy realized margin
  notes: This table intentionally mixes explicit public price points with payer mechanics and known unknowns, because Wonder
    does not disclose a clean consolidated rate card.
