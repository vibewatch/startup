  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cash-balance
    missingEvidence: Current unrestricted cash, restricted cash, and debt-service schedule by legal entity.
    whyItMatters: Without current liquidity and debt-service detail, capital adequacy and downside runway cannot be underwritten.
    diligencePath: Request the latest monthly balance sheet, debt schedule, and treasury memo from finance.
    relatedQuestionRefs:
    - QI022
    relatedTableRefs:
    - TI001
    - TI005
  - type: private-evidence-only
    severity: material
    topic: burn-rate
    missingEvidence: Monthly cash burn, cash conversion, and capex split among corporate, store buildout, Blue Apron, and
      Grubhub integration.
    whyItMatters: Large historical raises do not prove current solvency if the integrated platform still consumes cash rapidly.
    diligencePath: Request trailing-twelve-month monthly cash flow by segment and corporate center.
    relatedQuestionRefs:
    - QI023
    relatedTableRefs:
    - TI001
    - TI005
  - type: private-evidence-only
    severity: material
    topic: segment-revenue-mix
    missingEvidence: Revenue and gross-margin breakout for legacy Wonder, Blue Apron, Grubhub, WonderWorks, and Tastemade.
    whyItMatters: The >$2B combined revenue marker does not reveal whether the original Wonder model is actually attractive
      on a standalone basis.
    diligencePath: Request a management segment bridge with historical restatements and revenue-recognition notes.
    relatedQuestionRefs:
    - QI009
    - QI017
    relatedTableRefs:
    - TI002
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: four-wall-economics
    missingEvidence: Location-level throughput, labor ratios, food waste, occupancy cost, and payback period by kitchen cohort.
    whyItMatters: Wonder’s first-party food-hall thesis depends on density and four-wall efficiency, not just top-line growth.
    diligencePath: Request cohort-level store P&Ls, kitchen utilization dashboards, and food-waste reporting.
    relatedQuestionRefs:
    - QI017
    - QI025
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: acquired-asset-retention
    missingEvidence: Blue Apron active customers, reorder frequency, AOV, and Grubhub-to-Wonder cross-sell / conversion rates
      under Wonder ownership.
    whyItMatters: The roll-up thesis depends on acquired channels becoming durable and accretive, not merely adding gross
      revenue.
    diligencePath: Request post-acquisition operating KPIs and cross-sell funnel reporting for Blue Apron and Grubhub.
    relatedQuestionRefs:
    - QI012
    - QI015
    - QI025
    relatedTableRefs:
    - TI002
    - TI005
