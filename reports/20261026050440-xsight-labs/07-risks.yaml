  evidenceGaps:
    - type: missing-source
      severity: material
      topic: xsight-specific-legal-status
      missingEvidence: Official regulator, court, or company disclosure establishing current Xsight-specific litigation, enforcement, licensing, or export-control status.
      whyItMatters: A sector-level compliance risk cannot establish that Xsight has or has not faced a legal or regulatory matter.
      diligencePath: Obtain company counsel's matter list, export classifications, licenses, regulator correspondence, and litigation search results; reconcile against official records.
      relatedQuestionRefs:
        - QR007
      relatedTableRefs:
        - TR001
    - type: private-evidence-only
      severity: material
      topic: cash-and-working-capital
      missingEvidence: Current cash, monthly burn, runway, gross margin, inventory commitments, receivables, debt, and working-capital terms.
      whyItMatters: Funding raised and planned uses do not establish cash available or capacity to finance a delayed customer ramp.
      diligencePath: Review audited financial statements, monthly management accounts, cash forecast, customer payment terms, supplier commitments, debt, and preference stack.
      relatedQuestionRefs:
        - QR010
      relatedTableRefs:
        - TR003
    - type: private-evidence-only
      severity: material
      topic: customer-concentration
      missingEvidence: Named customer deployments, production-versus-evaluation status, contract value, renewal terms, revenue-recognition timing, and top-customer concentration.
      whyItMatters: Evaluations and selections do not establish recurring production revenue or the downside from a delayed or lost program.
      diligencePath: Reconcile the top-account schedule to signed contracts, shipments, accepted revenue, renewals, and customer references under NDA.
      relatedQuestionRefs:
        - QR005
      relatedTableRefs:
        - TR003
    - type: private-evidence-only
      severity: material
      topic: foundry-and-quality-readiness
      missingEvidence: Foundry and OSAT commitments, capacity reservations, yield, qualification, lead-time, field reliability, security assurance, and incident-response records.
      whyItMatters: Public product features and a historical sampling announcement do not establish reliable scaled delivery or customer-ready controls.
      diligencePath: Review supplier contracts, production test results, qualification reports, RMA/uptime records, security audits, vulnerability response, and delivery performance.
