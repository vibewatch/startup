  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: pricing
      missingEvidence: Comparable list and realized prices, discounts, warranties, support costs, and deployment obligations for Xsight and its alternatives.
      whyItMatters: Without comparable commercial terms, the buyer cannot test whether product-level performance or power claims translate into lower total cost.
      diligencePath: Obtain recent anonymized quotes and contract schedules from Xsight and at least two shortlisted alternatives, with identical configurations and support scope.
      relatedQuestionRefs:
        - QP004
      relatedTableRefs:
        - TP003
    - type: private-evidence-only
      severity: material
      topic: switching-costs
      missingEvidence: Customer references and deployment records showing migration effort, multi-homing, renewal, trust or certification posture, and the cost of replacing incumbent or internally built networking.
      whyItMatters: Switching cost, integration burden, trust requirements, and repeat deployment determine whether Xsight's programmability can become durable retention rather than a feature claim.
      diligencePath: Interview named operator customers under reference permission; review anonymized deployment timelines, renewals, and migration plans; and obtain relevant security and certification records.
      relatedQuestionRefs:
        - QP005
    - type: missing-source
      severity: material
      topic: comparative-performance
      missingEvidence: Independent workload-matched tests of throughput, latency, power, reliability, and cost per workload across Xsight and named competing systems.
      whyItMatters: Vendor specifications and a market-share snapshot do not establish relative performance or customer value for the target workloads.
      diligencePath: Request reproducible third-party benchmark protocols and results covering matched port speeds, workloads, software versions, and operating conditions.
      relatedQuestionRefs:
        - QP002
        - QP007
        - QP008
    - type: enumeration-incomplete
      severity: minor
      topic: competitor-enumeration
      missingEvidence: A buyer-validated shortlist spanning silicon vendors, integrated systems, internal builds, and status-quo network designs.
      whyItMatters: The assigned source pool supports several named alternatives but is not an exhaustive procurement landscape.
      diligencePath: Validate the shortlist with two target network-operator buyers and their current architecture and procurement teams.
      relatedQuestionRefs:
        - QP001
