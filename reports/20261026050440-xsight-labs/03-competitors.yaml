      - CP016
      - CP014
  - id: TP003
    title: Public pricing and packaging comparison
    columns:
      - Offer
      - Price, unit, or contract model in assigned sources
      - Packaging documented
      - Decision implication
    rows:
      - - Xsight X2 switch
        - Not disclosed in the assigned sources
        - 12.8 Tbps switch; XISA programmability and SONiC integration are company-described
        - Request list and realized pricing, support, qualification, and deployment terms
      - - Xsight E1 DPU
        - Not disclosed in the assigned sources
        - 800 Gbps DPU; company lists standard Linux frameworks and product form factors
        - Compare complete system cost, software support, power under workload, and service obligations
      - - NVIDIA Spectrum-X
        - Not disclosed in the assigned sources
        - IDC describes Ethernet switches, BlueField DPUs, and LinkX cables
        - Seek comparable system-level quote and scope; IDC revenue is not a price benchmark
      - - DriveNets AI Fabric
        - Not disclosed in the assigned sources
        - Company describes Ethernet fabric and systems-partner go-to-market activity
        - Seek deployment, integration, and support terms before comparing total cost
    notes: >-
      "Not disclosed" is limited to the assigned fetched source set and is not a
      claim that the vendor has no private or customer-specific pricing.
    claimRefs:
      - CP002
      - CP004
      - CP013
      - CP014
      - CP015
figures:
  - id: FP001
    title: Publicly documented competitive scope
    type: quadrant
    summary: >-
      Ordinal map of product descriptions in the assigned sources, not a
      benchmark or overall vendor ranking; a zero means the sources reviewed
      here do not document that attribute.
    data:
      xAxis:
        label: Public evidence of open programmability (ordinal 0-2)
        min: 0
        max: 2
      yAxis:
        label: Documented solution scope (ordinal 0-2)
        min: 0
        max: 2
      points:
        - label: Xsight X2
          x: 2
          y: 1
          note: Xsight describes XISA programmability for a switch product; company source.
        - label: Xsight E1
          x: 2
          y: 1
          note: Xsight describes software-defined DPU and standard Linux frameworks; company source.
        - label: NVIDIA Spectrum-X
          x: 0
          y: 2
          note: IDC documents an integrated switch, DPU, and cable platform; no comparable openness detail in this source set.
        - label: DriveNets AI Fabric
          x: 1
          y: 2
          note: DriveNets describes standard Ethernet and an AI fabric across network architectures; company source.
        - label: Cisco Ethernet switching
          x: 0
          y: 1
          note: IDC reports switch-market activity; assigned evidence does not score its software openness.
        - label: Arista Ethernet switching
          x: 0
          y: 1
          note: IDC reports switch-market activity; assigned evidence does not score its software openness.
    approximationNotes: >-
      Analyst-coded evidence rubric: x=0 means no relevant openness detail in
      the assigned sources, x=1 means a general standard-Ethernet/software signal,
      and x=2 means explicit programmability or software-defined architecture.
      y=1 means a switch or DPU product is documented; y=2 means the source
      describes a multi-component or multi-layer platform. Scores indicate
      documentation scope only, not capability absence, performance, customer
      preference, or ranking.
    claimRefs:
      - CP002
      - CP003
      - CP007
      - CP010
      - CP013
      - CP016
