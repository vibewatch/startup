evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: operating-scale-evidence
    missingEvidence: >-
      Current revenue by product and period, ARR definition, customer count and concentration, and a dated
      company-confirmed employee count.
    whyItMatters: >-
      Without these denominators, the $2.8 billion financing valuation cannot be compared with operating scale or
      translated into customer and execution risk.
    diligencePath: >-
      Request audited annual and quarterly revenue, ARR reconciliation, customer/program roster with concentration, and
      dated employee and contractor counts.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: lifetime-funding
    missingEvidence: >-
      A primary financing schedule reconciling round dates, labels, amounts, total capital raised, valuation basis, and
      current preference stack.
    whyItMatters: >-
      CTech reports more than $450 million raised while ToFlow lists $450 million and a conflicting historical round
      chronology; neither is a verified cap table.
    diligencePath: >-
      Reconcile signed financing documents, investor schedule, and company-prepared sources-and-uses with counsel and
      finance leadership.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: leadership-and-governance
    missingEvidence: >-
      Complete current executive and board roster, biographies, tenure and changes, founder ownership, succession
      coverage, and board rights.
    whyItMatters: >-
      A partial public roster cannot establish management depth, oversight quality, or key-person dependence in a
      capital-intensive chip business.
    diligencePath: >-
      Review the current org chart, board roster and minutes, ownership schedule, executive succession plans, and
      references for critical engineering and commercial leaders.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: minor
    topic: headquarters
    missingEvidence: >-
      A current company or registry record identifying the legal and principal headquarters and distinguishing it from
      office locations.
    whyItMatters: The assigned reporting describes both Kiryat Gat and Tel Aviv as the company's base.
    diligencePath: Confirm registered address and principal operating location from current corporate records and management.
    relatedQuestionRefs:
      - QO001
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: legal-and-operational-adverse-history
    missingEvidence: >-
      Current, source-backed checks for litigation, regulatory matters, sanctions, outages, recalls, layoffs, or other
      material adverse events.
    whyItMatters: >-
      The assigned pool does not establish the company's adverse-event history, and lack of a retrieved record is not
      evidence that no event occurred.
    diligencePath: >-
      Obtain company counsel's litigation and regulatory schedule, review relevant court and regulator records, and
      request incident, recall, and workforce-change disclosures.
    relatedQuestionRefs:
      - QO010
  - type: private-evidence-only
    severity: material
    topic: switch-silicon market sizing
    missingEvidence: >-
      No assigned source provides an addressable switch-silicon spend denominator, comparable CAGR, installed-base
      estimate, or price and unit assumptions for the defined market.
    whyItMatters: >-
      Without a consistent market boundary and measurable denominator, TAM/SAM/SOM and any valuation-based market-share
      conclusion would be speculative.
    diligencePath: >-
      Obtain current third-party market data with silicon-versus-system scope, geography, vintage, and methodology;
      reconcile it to a bottom-up installed site, switch-volume, refresh-cycle, and ASP model.
    relatedQuestionRefs:
      - QM001
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer budgets and adoption conversion
    missingEvidence: >-
      Public materials do not identify budget owners, customer-level deployment volumes, pricing,
      evaluation-to-production conversion, or repeat-program rates.
    whyItMatters: >-
      Reported selection and evaluation signals do not show revenue, market share, or the portion of the broad buyer
      universe that is obtainable by Xsight.
    diligencePath: >-
      Request anonymized pipeline-stage counts, design-win conversion and ramp history, customer concentration,
      qualification timelines, quoted ASPs, and deployment forecasts by buyer segment.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Comparable list and realized prices, discounts, warranties, support costs, and deployment obligations for Xsight
      and its alternatives.
    whyItMatters: >-
      Without comparable commercial terms, the buyer cannot test whether product-level performance or power claims
      translate into lower total cost.
    diligencePath: >-
      Obtain recent anonymized quotes and contract schedules from Xsight and at least two shortlisted alternatives, with
      identical configurations and support scope.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-costs
    missingEvidence: >-
      Customer references and deployment records showing migration effort, multi-homing, renewal, trust or certification
      posture, and the cost of replacing incumbent or internally built networking.
    whyItMatters: >-
      Switching cost, integration burden, trust requirements, and repeat deployment determine whether Xsight's
      programmability can become durable retention rather than a feature claim.
    diligencePath: >-
      Interview named operator customers under reference permission; review anonymized deployment timelines, renewals,
      and migration plans; and obtain relevant security and certification records.
    relatedQuestionRefs:
      - QP005
  - type: missing-source
    severity: material
    topic: comparative-performance
    missingEvidence: >-
      Independent workload-matched tests of throughput, latency, power, reliability, and cost per workload across Xsight
      and named competing systems.
    whyItMatters: >-
      Vendor specifications and a market-share snapshot do not establish relative performance or customer value for the
      target workloads.
    diligencePath: >-
      Request reproducible third-party benchmark protocols and results covering matched port speeds, workloads, software
      versions, and operating conditions.
    relatedQuestionRefs:
      - QP002
      - QP007
      - QP008
  - type: enumeration-incomplete
    severity: minor
    topic: competitor-enumeration
    missingEvidence: >-
      A buyer-validated shortlist spanning silicon vendors, integrated systems, internal builds, and status-quo network
      designs.
    whyItMatters: The assigned source pool supports several named alternatives but is not an exhaustive procurement landscape.
    diligencePath: >-
      Validate the shortlist with two target network-operator buyers and their current architecture and procurement
      teams.
    relatedQuestionRefs:
      - QP001
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Executed customer contracts, list and realized prices, discount schedules, revenue-recognition policy, and
      distributor or licensing terms by product.
    whyItMatters: >-
      Without price and contract denominators, the reported product-sales model and customer selections cannot establish
      revenue quality or monetization.
    diligencePath: >-
      Request a product-level price book, sampled executed contracts, channel agreements, and the revenue-recognition
      memo.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Revenue by product and period, unit shipments, gross margin, cost of goods sold, customer concentration,
