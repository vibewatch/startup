  topStrengths:
    - >-
      A differentiated networking-silicon product portfolio has concrete company-published specifications and
      programmable architecture.
    - >-
      Public reporting describes named X2 selection and joint testing progress, providing a stronger commercial signal
      than product marketing alone.
    - >-
      The July 2026 financing was reported by multiple independent outlets at a $2.8B post-money valuation, with
      Fidelity leading the round.
  topRisks:
    - The $2.8B financing mark has no disclosed revenue, earnings, cash-flow, or matched-transaction denominator.
    - >-
      Selections and evaluations do not establish production conversion, shipment scale, repeat orders, customer
      concentration, or collected cash.
    - >-
      Public lifetime-funding figures conflict, while cash, burn, working capital, debt, and investor preference terms
      remain undisclosed.
    - Semiconductor supply, qualification, export-control, and scale-up risks could affect delivery and customer access.
  unresolvedGaps:
    - >-
      Obtain product- and customer-level revenue, gross margin, shipment, pricing, cash-conversion, and working-capital
      data.
    - >-
      Reconcile named customers, production deployments, repeat-program conversion, retention, and top-customer
      concentration.
    - Reconcile lifetime capital raised, current cash and debt, fully diluted ownership, and the preference stack.
    - Verify scaled reliability, qualification, supply commitments, and customer-specific export-control exposure.
disclaimer: >-
