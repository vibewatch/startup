summary:
  headline: >-
    Xsight has credible product and design-in signals, but its $2.8 billion financing mark remains difficult to
    underwrite without revenue, margin, customer-conversion, and capital-structure denominators.
  overallScore: 5.8
  recommendation: research-more
  confidence: low
  riskRating: high
  valuationStance: stretched
  keyMetrics:
    valuationUsdM: 2800
