companyProfile:
  summary: >-
    Founded in 2017, Xsight Labs is a fabless designer of programmable Ethernet switches and data-processing units for
    data-center, cloud, and AI networking. Its X2 switch and E1 DPU provide concrete product evidence, while public
    reporting describes an X2 selection for Starlink V3 and a successful joint test. These technical and commercial
    signals do not yet establish production volumes, recognized revenue, or customer economics.
