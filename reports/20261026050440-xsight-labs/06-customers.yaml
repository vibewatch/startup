      - [Enterprise and private data centers, "Likely buyer: enterprise network or infrastructure team; payer: enterprise operator (roles inferred)", "X2 release describes enterprise and cloud service-provider use; Oxide selected X2 for its next-generation cloud computer", "Named design-in evidence exists; shipment volume, end-user deployment, and contract value are undisclosed", "Oxide's selection appears in an Xsight-issued announcement, not an independently audited deployment record"]
      - [Edge and satellite network operators, "Likely buyer / user: network operator; payer may be operator or system integrator (not disclosed)", "Starlink reportedly selected X2 as the networking core for V3 satellites", "High-visibility reference opportunity; future satellite use is not evidence of live deployment or material revenue", "No deployment date, unit volume, or customer economics in the reviewed coverage"]
      - [Networking and system ecosystem partners, "System builder or component supplier; may influence design-in but is not necessarily the end payer", "Oxide selected X2; Credo described a multi-year component relationship", "Can support integration and route-to-market; partner dependence and commercial contribution are unknown", "Do not count supplier relationships as end-customer accounts"]
    notes: >-
      Segmentation combines company-described target markets with named public
      relationships; buyer, user, and payer roles are analytical where not
      explicitly identified. Customer counts, revenue by segment, and active
      deployment scale are not disclosed in the reviewed sources.
    claimRefs: [CU001, CU002, CU003, CU008, CU009]
  - id: TU002
    title: Public adoption and durability evidence
    columns: [Metric or signal, Value / status, Period or date, Source basis, Confidence, Implication and missing denominator]
    rows:
      - ["Named operator selection: Starlink V3", "X2 selected for the next-generation V3 satellite network; future use described", "Date not stated in fetched article text", "CTech and ServeTheHome reporting", "Medium-high for announced selection; no live-use proof", "No launch, installed-unit, shipment, or recognized-revenue denominator"]
      - ["Named system-maker selection: Oxide", "Oxide said it selected X2 for its next-generation cloud computer", "Business Wire announcement dated 2024-10-14 in source URL", "Xsight-issued release quoting Oxide CTO", "Medium; company-issued release", "No production status, order size, or independent customer reference"]
      - ["Component relationship: Credo", "Credo VP said it had supported Xsight for multiple years with AECs, PHYs, and gearbox ICs", "At time of X2 announcement", "Xsight-issued Business Wire release quoting Credo VP", "Medium; partner statement in company release", "Supplier relationship, not proof of end-customer deployment"]
      - ["X2 sampling", "Release said X2 was sampling to customers", "2024 announcement", "Xsight-issued Business Wire release", "Medium; historical company statement", "Sampling is not a customer count, production shipment, or current availability measure"]
      - ["Active customer / deployment count", "Not quantified in assigned public evidence", "As of 2026-10-26 review", "Evidence gap across the assigned pool", "Unresolved", "Request named account and program schedule with sample, production, and active-use status"]
      - ["Retention, renewal, concentration, and expansion", "No NRR, GRR, churn, renewal, cohort, contract-duration, or top-customer share figure found in assigned evidence", "As of 2026-10-26 review", "Evidence gap across the assigned pool", "Unresolved", "Request customer-level revenue and contract cohorts; do not infer durability from selections"]
    notes: >-
      This is a partial public-evidence inventory, not a complete customer
      census. Selection, sampling, and a component relationship are distinct
      commercial stages; missing values mean not quantified in the assigned
      sources, not zero.
    claimRefs: [CU005, CU006, CU007, CU008, CU009, CU010, CU011, CU012]
  - id: TU003
    title: Named customer proof table
    columns: [Organization, Segment / role, Public relationship and use case, Production vs. pilot status, Outcome, Limitation]
    rows:
      - [Starlink / SpaceX, "Satellite network operator / end user", "CTech and ServeTheHome report X2 selection for V3 satellite networking", "Selection for future V3 systems; live deployment not established by the cited text", "High-visibility routing use case; no measured customer outcome reported", "Announcement coverage is not a shipment, operating fleet, or revenue confirmation"]
      - [Oxide Computer Company, "Cloud-computer system maker", "Oxide CTO said Oxide selected X2 for its next-generation switch", "Selection / early-adopter statement in Xsight-issued release", "Programmable switch intended for Oxide cloud computer", "No independent deployment confirmation, volume, or contract economics"]
      - [Credo, "Component supplier / ecosystem partner", "Credo VP said it supports Xsight with AECs, PHYs, and gearbox ICs", "Multi-year support relationship as described in release", "Components associated with X2 12.8T top-of-rack refresh", "Partner relationship, not evidence that Credo is an end-customer account"]
    notes: >-
      Partial sample of named relationships in the assigned source pool, not an
      exhaustive customer roster. Statements of selection or partner support
      are not treated as proof of live production deployment or revenue.
    enumerationScope:
      coverage: sample
      basis: Publicly named relationships in the assigned source pool; not an exhaustive customer roster.
    claimRefs: [CU006, CU008, CU009]
evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: customer-count-and-deployment-base
    missingEvidence: A dated account/program list showing unique customers, active deployments, locations, sample versus production status, shipped units, and revenue-recognition status.
    whyItMatters: Public selection announcements do not establish the size, activity, or economic contribution of the installed customer base.
    diligencePath: Obtain a management-certified customer and program schedule, reconcile it to shipment and revenue records, and seek permission to reference at least two production customers.
    relatedQuestionRefs: [QU005]
    relatedTableRefs: [TU002, TU003]
  - type: private-evidence-only
    severity: material
    topic: customer-retention-and-concentration
    missingEvidence: Customer-level revenue and contract cohorts with renewal, churn, NRR, GRR, duration, repeat-program conversion, and top-customer concentration.
    whyItMatters: Without denominators and cohort outcomes, durability, expansion, and single-customer exposure cannot be evaluated.
    diligencePath: Request anonymized quarterly customer cohorts and top-customer revenue shares, then validate a sample against contracts and invoices.
    relatedQuestionRefs: [QU006]
    relatedTableRefs: [TU002, TU003]
