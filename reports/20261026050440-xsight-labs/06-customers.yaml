chapter:
  number: 6
  title: Customers
  summary: Public evidence shows Xsight targets hyperscale, cloud, AI, and edge infrastructure buyers, with named X2 selections by Starlink and Oxide and a component relationship with Credo. These announcements establish design-in and partner signals, not a verified customer count, live deployment base, repeat purchase, retention, or customer-level revenue.
sections:
  - id: segment-map
    title: Target segments and buyer roles
    body: >-
      Xsight's own materials position its connectivity products for AI and
      hyperscale data centers, while Dealroom describes a broader target set
      spanning hyperscale cloud providers, enterprise data centers, and
      next-generation AI infrastructure operators. Those descriptions identify
      markets, not a verified customer roster or the share of revenue from each
      segment. The likely buying group is a network or infrastructure
      engineering team, with procurement and finance approval at the operator;
      those roles are analytical assumptions rather than disclosed Xsight
      account data. The public examples also span different commercial roles:
      Starlink is an announced end-user selection, Oxide is a system maker
      selecting a switch, and Credo is a component partner. They should not be
      counted as three equivalent end-customer deployments.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-evidence
    title: Adoption signals are not yet deployment metrics
    body: >-
      The strongest named evidence is X2 selection for Starlink's next-generation
      V3 satellites, independently reported by CTech and ServeTheHome; both
      describe a future system, so the selection should not be read as proof that
      the satellites are already operating or that Xsight has recognized revenue.
      An Xsight-issued Business Wire announcement quotes Oxide's CTO saying
      Oxide selected X2 for its next-generation cloud computer and describes
      Credo as supporting Xsight with interconnect components. These are useful
      design-in and ecosystem signals, but the release does not quantify
      shipments, production scale, contract value, or repeat orders. The same
      2024 announcement said X2 was sampling to customers then; that dated
      statement is not evidence of current availability or adoption scale.
    claimRefs: [CU005, CU006, CU007, CU008, CU009, CU010]
    tableRefs: [TU002, TU003]
    figureRefs: [FU001]
  - id: durability-gaps
    title: Retention, expansion, and concentration remain private
    body: >-
      The assigned public materials do not provide an active-customer count,
      customer-level revenue, top-customer concentration, contract duration,
      renewal rate, NRR, GRR, churn, or repeat-program conversion. The sources
      therefore support neither a retention conclusion nor a quantified
      land-and-expand story. A historical LayoffCheck entry records one publicly
      reported workforce-reduction round on September 7, 2022, but the tracker
      says its coverage is incomplete and this is not evidence of customer
      losses or present-day support capacity. For diligence, request a
      customer/program schedule that separates design wins, samples, production
      deployments, and revenue-recognized programs, then reconcile it to
      customer-level revenue, renewal, and shipment cohorts.
    claimRefs: [CU011, CU012, CU013, CU014]
tables:
