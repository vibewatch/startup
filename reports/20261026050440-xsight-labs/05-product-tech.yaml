  - id: TE002
    title: Workflow and use-case evidence
    columns:
      - User job
      - Current workflow or constraint
      - Company solution described
      - Measurable benefit disclosed
      - Limitation / diligence
    rows:
      - - Adapt switch behavior for evolving network functions
        - Fixed pipelines can constrain changes, according to Xsight's product explanation
        - X2 exposes programmable engines through XISA
        - Xsight states sub-700 ns latency; independent workload-level results not available here
        - Validate specific functions, deployment effort, and measured latency under load
      - - Process networking, storage, or security traffic on a server
        - DPU functions may require host-side processing or specialized offloads
        - E1 combines Arm cores, data-plane processing, and inline acceleration
        - Up to 800 Gbps is reported; workload-specific CPU and power results are not established
        - Confirm configuration, test method, and power at representative utilization
      - - Run software across DPU performance tiers
        - Operators may otherwise maintain different software models for each device
        - Converge Digest reports a common E1/E1L software environment
        - No migration-effort or portability benchmark disclosed
        - Test behavior across core counts, memory, I/O, and firmware versions
      - - Build a multi-vendor switch operating environment
        - Operators may seek separation between network OS and switch hardware
        - SONiC provides an open-source, Linux-based NOS for switches from multiple vendors
        - The community describes its multi-vendor architecture; Xsight deployment is not proven by this source
        - Verify Xsight-specific support, interoperability, and lifecycle commitments
    notes: >-
      Company performance statements are explicitly distinguished from independent measurements. The table records disclosed workflow propositions, not verified customer benefits or comparative benchmarks.
    claimRefs:
      - CE003
      - CE005
      - CE006
      - CE008
      - CE011
      - CE012
      - CE014
  - id: TE003
    title: Technology and operating architecture
    columns:
      - Layer / process
      - Disclosed role
      - Dependency or interface
      - Risk and evidence limit
    rows:
      - - X-Series switch ISA and engines
        - XISA provides programmable access to switch engines; Xsight describes X-IQ and other functions
        - Public ISA specification and examples; advanced tooling is partly NDA-gated
        - Validate toolchain completeness, compatibility, and support obligations
      - - E1 compute and data path
        - Arm Neoverse N2 cores are described as participating in packet processing
        - Linux and data-plane frameworks including XDP, DPDK, and SPDK
        - Independent coverage notes a power trade-off versus more specialized hardware
      - - High-speed I/O and acceleration
        - E1 reporting describes up to 800 Gbps networking and inline processing engines
        - SerDes, PCIe, memory interfaces, and configuration choices matter to deployment
        - Verify exact SKU configuration, test conditions, and system-level bottlenecks
      - - E1L lower-power DPU
        - Reported 200 Gbps maximum and 25–40 W TDP options
        - Four SerDes lanes and 20 PCIe Gen5 lanes, per Converge Digest
        - Planned Q2 2027 sampling; actual power and performance remain to be qualified
      - - SONiC operating-system ecosystem
        - Linux-based open-source NOS that can run on switches from multiple vendors and ASICs
        - Multi-vendor ecosystem and Switch Abstraction Interface
        - General SONiC capability does not establish Xsight-specific integration or certification
    notes: >-
      This is a sourced component map, not a complete proprietary block diagram. Interfaces and performance are reported at different levels of detail across sources; NDA-only specifications and independent system tests remain diligence items.
    claimRefs:
      - CE003
      - CE005
      - CE008
      - CE010
      - CE011
      - CE012
      - CE014
figures:
  - id: FE001
    title: X-Series disclosed component map
    type: stack
    summary: Company materials name X-Series switch components and interfaces; these are component groups, not an ordered processing flow or independently verified system design.
    data:
      layers:
        - label: Switch capacity and ports
          detail: X2 is specified by Xsight at 12.8 Tbps, 5 nm, and below 200 W.
          modules:
            - Up to 16 × 800G or 32 × 400G ports
            - Flexible 128-lane SerDes configuration
        - label: Programmable switch core
          detail: Xsight describes parallel programmable micro-engines and elastic resource allocation.
          modules:
            - Parallel execution
            - No recirculation needed, per Xsight
        - label: X-IQ queuing engine
          detail: Xsight presents X-IQ as an intelligent-queuing engine.
          modules:
            - Programmable congestion measurement and signaling
            - Dynamic load balancing and fast failure detection
        - label: X-LB load balancing
          detail: Xsight presents X-LB as a dynamic path-selection engine.
          modules:
            - Dynamic path selection for lossless AI fabrics
        - label: X-MON and X-VIEW
          detail: Xsight describes device-health monitoring and in-band telemetry functions.
          modules:
            - X-MON health monitor
            - X-VIEW deep telemetry with microburst detection
        - label: XISA programming interface
          detail: XISA provides assembly-level access to programmable engines, according to Xsight.
          modules:
            - Parser ISA and MAP ISA references
            - Custom P4 compiler and protocol support
        - label: Development access boundary
          detail: Public programming examples are listed; advanced APIs, behavioral models, and system resources require NDA access.
          modules:
            - Public XISA specification and examples
            - NDA-gated functional specifications and toolchains
    claimRefs:
      - CE002
      - CE003
      - CE010
      - CE015
      - CE016
