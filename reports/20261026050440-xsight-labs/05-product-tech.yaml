company:
  name: Xsight Labs
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Xsight Labs publicly presents two complementary silicon lines: X-Series programmable Ethernet switches and E-Series DPUs. Public technical materials describe an open switch ISA, Linux-oriented DPU software, and distinct throughput and power envelopes, but independent evidence on scaled deployments, reliability, security validation, and customer outcomes remains limited.
sections:
  - id: product-portfolio
    title: Product portfolio and maturity
    body: >-
      Xsight's product portfolio is organized around programmable Ethernet switching and data processing. Its X-Series is presented as an Ethernet switch-silicon family for cloud and AI infrastructure, while the E-Series comprises DPUs; a third-party company profile also lists the X-PND Engine, though the available material does not explain that engine's function or commercial status (CE001). The official X2 page specifies a 12.8 Tbps, 5 nm switch, with up to 16 × 800G or 32 × 400G ports and company-claimed sub-700 ns latency and power below 200 W (CE002, CE003). These are vendor specifications and positioning, not independently measured results. Independent technical coverage describes the E1 as a 64-core Arm Neoverse N2 DPU with up to 800 Gbps networking, and discusses its host-side and storage/network offload roles (CE005, CE013). Converge Digest reports that the E1L extends the family toward edge and embedded workloads with up to 200 Gbps throughput and 25–40 W TDP configurations; sampling is planned for Q2 2027, not yet demonstrated as available product (CE007, CE009).
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE005
      - CE007
      - CE009
      - CE013
    tableRefs:
      - TE001
  - id: architecture-and-workflows
    title: Architecture, software, and deployment model
    body: >-
      The differentiation case is programmability across both switch and DPU workloads, but the evidence is mostly product documentation and technical reporting rather than customer-validated outcomes. Xsight describes X2's XISA instruction set and programmable engines as a way to implement network functions without a hardware redesign; it names X-IQ for intelligent queuing, X-LB for dynamic load balancing, X-MON for health monitoring, and X-VIEW for telemetry (CE003, CE016). Its documentation says the XISA specification is published under MPLv2 and supplies programming examples (CE010). E1 coverage describes general-purpose Arm cores in the data path, with inline engines offloading packet parsing, classification, encryption, and other functions; this design combines Linux-hosting flexibility with a more power-intensive trade-off than implementing more functions in specialized hardware (CE005, CE011, CE012). The company's documentation lists standard Linux and frameworks including XDP, DPDK, and SPDK for E1, while Converge Digest reports that E1L shares the E1 software environment (CE008). SONiC's community documentation explains the broader multi-vendor operating-system context, but does not establish Xsight-specific integration quality or adoption (CE014). The product stack below is therefore a representation of disclosed components, not a verified end-to-end deployment architecture.
    claimRefs:
      - CE003
      - CE005
      - CE008
      - CE016
      - CE010
      - CE011
      - CE012
      - CE014
    tableRefs:
      - TE002
      - TE003
    figureRefs:
      - FE001
  - id: diligence-and-risk
    title: Differentiation and diligence priorities
    body: >-
      Open programmability and familiar software tools may reduce the need for customers to adopt a wholly proprietary development model, but the public material does not quantify customer engineering effort, deployment time, total cost of ownership, or workload-level performance advantages (CE006, CE008). Xsight's documentation presents a public XISA specification and programming examples, while marking advanced switch development resources and E1-specific functional and hardware specifications as available with NDA access (CE010, CE015). The E1L's lower-power positioning and roadmap are reported by an external technical publisher, but sampling, qualification, customer uptake, and sustained operating behavior remain prospective or unverified in this pool (CE007, CE009). The assigned sources do not provide independently auditable reliability rates, production yields, security test results, incident history, or customer-scale support metrics. That evidence gap should not be read as proof that failures or incidents have not occurred; diligence should request test reports, errata, deployment references, security assessments, and qualification status before underwriting performance or trust claims.
    claimRefs:
      - CE006
      - CE007
      - CE008
      - CE009
      - CE010
      - CE015
tables:
  - id: TE001
    title: Product module and asset matrix
    columns:
      - Module / asset
      - User and workflow
      - Disclosed status and role
      - Differentiation stated
      - Diligence gap
    rows:
      - - X-Series / X2 switch silicon
        - Cloud and AI network operators needing programmable Ethernet switching
        - Xsight describes X2 as a 12.8 Tbps, 5 nm switch; company-reported specifications
        - Open XISA and programmable network functions
        - Validate workload performance, power, silicon availability, and production deployments
      - - E-Series / E1 DPU
        - Server and network operators offloading networking, storage, and security work
        - Technical coverage describes up to 800 Gbps and 64 Arm Neoverse N2 cores
        - General-purpose cores positioned in the data path with Linux-oriented software
        - Validate power under representative workloads, qualification, and production use
      - - E-Series / E1L DPU
        - Edge and embedded infrastructure with lower throughput or power budgets
        - Converge Digest reports up to 200 Gbps and planned Q2 2027 sampling
        - Shares the E1 software environment, per external reporting
        - Sampling and customer qualification are future milestones, not verified availability
      - - XISA
        - Engineers developing or adapting switch data-plane functions
        - Public specification and programming examples; advanced resources may require NDA access
        - MPLv2-published instruction-set specification, according to company documentation
        - Review completeness, toolchain maturity, support terms, and implementation boundaries
      - - X-PND Engine
        - Not specified in the assigned evidence
        - Listed in a third-party company profile; functional and maturity details unavailable
        - No supported differentiation claim in the available text
        - Request product definition, integration details, and commercial status
    notes: >-
      Product roles and specifications are attributed to the cited company pages or technical publishers; they are not independent qualification results. E1L sampling is a reported plan, and X-PND Engine details are unavailable in the assigned evidence.
    claimRefs:
      - CE001
      - CE002
      - CE005
      - CE007
      - CE009
      - CE010
