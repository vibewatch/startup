  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: switch-silicon market sizing
      missingEvidence: >-
        No assigned source provides an addressable switch-silicon spend denominator,
        comparable CAGR, installed-base estimate, or price and unit assumptions for
        the defined market.
      whyItMatters: >-
        Without a consistent market boundary and measurable denominator, TAM/SAM/SOM
        and any valuation-based market-share conclusion would be speculative.
      diligencePath: >-
        Obtain current third-party market data with silicon-versus-system scope,
        geography, vintage, and methodology; reconcile it to a bottom-up installed
        site, switch-volume, refresh-cycle, and ASP model.
