      missingEvidence: Executed customer contracts, list and realized prices, discount schedules, revenue-recognition policy, and distributor or licensing terms by product.
      whyItMatters: Without price and contract denominators, the reported product-sales model and customer selections cannot establish revenue quality or monetization.
      diligencePath: Request a product-level price book, sampled executed contracts, channel agreements, and the revenue-recognition memo.
      relatedQuestionRefs: [QI007]
      relatedTableRefs: [TI002]
    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: Revenue by product and period, unit shipments, gross margin, cost of goods sold, customer concentration, sales-cycle conversion, and selling expense.
      whyItMatters: These denominators determine whether design wins become repeatable revenue and whether unit economics can support a durable margin path.
      diligencePath: Obtain audited or management-account revenue by SKU and customer, shipment cohorts, wafer/package/test costs, yield, warranty, and sales-pipeline conversion.
      relatedQuestionRefs: [QI008]
      relatedTableRefs: [TI003]
    - type: private-evidence-only
      severity: material
      topic: capital-adequacy
      missingEvidence: Current cash, monthly burn, debt and preference terms, inventory and receivable obligations, committed capex, runway, and next-round trigger.
      whyItMatters: The reported amount raised and post-money valuation do not show cash remaining or whether the company can fund product qualification and scaled delivery.
      diligencePath: Review current balance sheet, cash-flow forecast, debt and preference schedules, working-capital aging, supply commitments, and board-approved financing plan.
      relatedQuestionRefs: [QI008]
      relatedTableRefs: [TI003]
    - type: missing-source
