      - [List and realized pricing, "No price or price-per-unit appears in retained sources", "List price, discounts, rebates, and realized ASP", "Obtain SKU price lists and sampled executed customer contracts"]
      - [Recognition and channel economics, "No recognition policy or channel terms appear in retained sources", "Shipment/acceptance terms, distributor margin, royalties, and payment timing", "Review revenue-recognition memo, channel agreements, and customer payment terms"]
    notes: The third-party revenue-model label is not a company filing; all unspecified fields remain unavailable rather than inferred.
    claimRefs: [CI004, CI013]
  - id: TI003
    title: Unit economics and capital adequacy
    columns: [Metric, Public value, Confidence, Why it matters and diligence request]
    rows:
      - [Revenue or ARR, null, unavailable, "No public denominator; obtain audited revenue by product and period and reconcile any ARR definition"]
      - [Gross margin and cost of goods sold, null, unavailable, "No cost or margin data; request wafer, packaging, test, yield, warranty, and support cost by product"]
      - ["CAC, sales cycle, and payback", null, unavailable, "No sales-efficiency data; request cohort-level design-win conversion, selling expense, cycle time, and payback"]
      - [Working capital and capital expenditure, null, unavailable, "No company-specific balance-sheet or capex data; request inventory, deposits, receivables, payables, and committed supply obligations"]
      - ["Cash, burn, runway, and debt", null, unavailable, "Funding raised is not cash available; obtain current cash, monthly net burn, debt terms, preference stack, and a funded operating plan"]
      - ["Industry R&D reference (not Xsight ratio)", "SIA reports U.S. semiconductor-industry R&D averages about one-fifth of revenue; period and company-level detail are not provided", "Medium; broad sector context only", "Request Xsight R&D expense by period and compare it with recognized revenue and product stage"]
      - ["Facility capex reference (not Xsight estimate)", "GAO says a new semiconductor facility can cost several billion dollars and take 2 to 5 years to become operational", "Medium; GAO finding does not quantify Xsight commitments", "Request foundry/packaging terms, deposits, reserved capacity, inventory, capex, and cancellation obligations"]
    notes: Null means no value was disclosed in the reviewed assigned sources; it does not mean zero. Funding announcements are not substitutes for cash balances, burn, or runway.
    claimRefs: [CI003, CI011, CI014, CI015]
