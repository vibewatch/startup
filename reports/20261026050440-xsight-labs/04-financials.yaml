company:
  name: Xsight Labs
chapter:
  number: 4
  title: Financials
  summary: Public evidence supports a product-sales hypothesis and a company-reported July 2026 financing of $300M+ at a $2.8B post-money valuation, but does not establish recognized revenue, realized pricing, margins, or current liquidity. Revenue quality, margin trajectory, and runway therefore remain un-underwritable without private financial and contract data.
sections:
  - id: revenue-model
    title: Product portfolio is visible; monetization is not
    body: >-
      Xsight's public product materials identify X-Series programmable Ethernet switch silicon and an E-Series 800G DPU. Multiples.vc labels the revenue model “Product sales,” but that third-party profile field is not an audited company disclosure and does not establish whether revenue is recognized on silicon shipments, systems, licenses, support, or a mix. A July 2026 company announcement republished by Light Reading says E1 and X2 were selected by multiple global network operators and that Tier-1 hyperscalers were evaluating Xsight silicon. These are company-reported commercial signals, not disclosed orders, shipment volumes, recognized revenue, or customer conversion. The assigned sources support a product-sales hypothesis, but do not quantify monetized streams, revenue mix, or recognition terms.
    claimRefs: [CI004, CI005, CI006, CI007]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: pricing-and-unit-economics
    title: Price, margin, and sales-efficiency denominators remain unavailable
    body: >-
      Xsight's product pages advertise X2 throughput and power figures, but those vendor claims do not measure manufacturing cost, gross margin, or customer savings captured by Xsight. The Semiconductor Industry Association (SIA) reports a U.S. semiconductor-industry average R&D spend of about one-fifth of revenue; that broad, undated sector figure is not an Xsight cost ratio. GAO describes facility construction costs and timelines for semiconductor projects, but those findings do not quantify this fabless company's foundry, packaging, testing, or inventory commitments. The assigned sources provide no list or realized prices, discounts, customer-acquisition cost, sales-cycle length, gross margin, cost of goods sold, or payback. Without shipment, price, and cost denominators, product specifications and reported selections cannot be converted into a revenue forecast or margin path.
    claimRefs: [CI003, CI005, CI006, CI011, CI013, CI014]
    tableRefs: [TI002]
  - id: capital-adequacy
    title: Financing headline is not cash available or runway
    body: >-
      Light Reading's July 30, 2026 item is labeled “Press Release” and reproduces Xsight's announcement of a $300M+ round at a $2.8B post-money valuation. Multiples.vc separately lists $400M total funding across three rounds; the latest-round announcement and this third-party cumulative figure do not provide a round-by-round reconciliation or an audited cap table. Even a verified amount raised is not cash available after prior spending, debt, preferences, transaction costs, or current obligations. GAO's semiconductor-facility award report covers awards through July 2025 and does not establish Xsight's eligibility or receipt of public funds. Electronics Weekly and Converge Digest report adjacent-company Ayar Labs financing for high-volume production and testing; this co-packaged-optics financing is context only, not an operating or valuation benchmark for Xsight's switch/DPU business. Current cash, burn, debt, working capital, capital plan, and next-round trigger remain material diligence gaps.
    claimRefs: [CI001, CI002, CI008, CI009, CI010, CI011, CI012, CI015]
    tableRefs: [TI003]
callouts:
  - calloutType: risk
    title: Capital sufficiency cannot be underwritten from the round headline
    body: The publicly reported financing amount and post-money valuation do not disclose cash on hand, burn, debt, or the funding required to reach scaled shipments; do not interpret funding raised as cash available.
    claimRefs: [CI001, CI015]
