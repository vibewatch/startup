              - CO006
              - CO013
              - CO014
              - CO016
      - number: '1.2'
        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              Publicly named roles include co-founder and CEO Yossi Meyouhas, co-founder and CTO Gal Malach, and
              founding investor and chair Avigdor Willenz (CO001, CO004). The founders' prior EZchip experience is a
              plausible source of technical and semiconductor-networking experience, but the evidence establishes
              biographies, not present-day execution quality or succession depth. The assigned pages do not establish
              the full board, committee oversight, founder ownership, executive tenure, delegation, or material
              leadership changes. These are material private diligence items: a concentrated technical and commercial
              bench can increase key-person exposure even when named leaders have relevant domain experience. Treat the
              listed people as a partial, source-backed roster, not a complete organization chart.
            claimRefs:
              - CO001
