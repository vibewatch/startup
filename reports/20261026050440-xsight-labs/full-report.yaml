        - Stress test customer programs, cash needs, and exit liquidity against a semiconductor downturn.
    notes: >-
      The $2.8B mark and product/traction statements are company-issued claims; profile funding totals conflict and are
      not reconciled. No company revenue, earnings, cash-flow, or comparable valuation denominator is supplied here.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV011
