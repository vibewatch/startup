      - number: '1.3'
        title: Financing and operating scale
        blocks:
          - type: paragraph
            body: >-
              SiliconANGLE, Globes, and CTech report a July 2026 financing of $300 million at a $2.8 billion valuation,
              with Fidelity Management & Research Company leading the round (CO005, CO006, CO007). These are reported
              financing terms, not revenue, ARR, cash on hand, or a measure of operating performance. The public record
              in this pool does not reconcile lifetime capital raised: CTech says more than $450 million, while ToFlow
              lists $450 million alongside a round history whose labels and dates are not internally consistent (CO013,
              CO014). ToFlow also displays a 201-500 employee range, but no current company disclosure corroborates that
              range; no supportable current revenue, ARR, or customer count is available in the assigned source text
              (CO014, CO016). These gaps leave valuation-to-revenue, customer concentration, and cash runway diligence
              unresolved.
