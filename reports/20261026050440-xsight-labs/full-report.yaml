chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              CTech identifies Xsight Labs as founded in 2017 by Guy Koren, Erez Sheizaf, and Gal Malach, all former
              EZchip employees; ToFlow independently describes a 2017 founding by three former EZchip executives
              (CO001). CTech and Globes place the company in Kiryat Gat, while SiliconANGLE describes it as based in Tel
              Aviv (CO002, CO003). The sources may be referring to different parts of the company's Israeli footprint,
              but the assigned evidence does not resolve its registered or principal headquarters. Xsight describes
              itself as a fabless designer of programmable Ethernet switches and data-processing units for data-center,
              cloud, and AI networking (CO008). Its product pages present X2 switch silicon and the E1 DPU as
              complementary networking components, with programmability and power efficiency as company-stated
              differentiators rather than independently benchmarked advantages (CO009, CO010).
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO008
              - CO009
              - CO010
