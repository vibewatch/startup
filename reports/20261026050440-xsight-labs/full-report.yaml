              - CP013
              - CP016
      - number: '3.3'
        title: Pricing, packaging, and distribution evidence
        blocks:
          - type: paragraph
            body: >-
              The assigned public sources describe product specifications, financing, market revenue, and selected
              system components, but disclose no comparable Xsight, NVIDIA, or DriveNets unit prices, realized
              discounts, contract terms, or support economics. A hardware specification is not a total-cost-of-
              ownership comparison, and a competitor's funding round is not evidence of customer acquisition cost or
              deployment economics. Xsight says its products have been selected by multiple global network operators and
              are under evaluation at Tier-1 hyperscalers; the named customer, deployment scale, contract value, and
              repeat-program conversion are not specified in that release. DriveNets describes integrations and partner
              activity, but its own press release does not establish comparative channel economics. Buyers should
              request price books or recent anonymized quotes, deployment and support obligations, and customer
              references before treating any packaging or distribution advantage as durable.
            claimRefs:
              - CP005
              - CP013
              - CP014
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP004
              - CP013
              - CP014
              - CP015
      - number: '3.4'
        title: Durability, displacement risk, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The strongest public displacement signal is the rapid scale of the AI networking category and NVIDIA's
              reported 1Q26 lead in datacenter Ethernet switching. Dell'Oro describes a market spanning Ethernet,
              InfiniBand, UALink, and NVLink, with transitions in port speeds and vendor shares; this makes protocol
              choice, system integration, and supply access relevant competitive dimensions. Xsight's
              open-programmability positioning could reduce dependence on fixed pipelines, but the reviewed sources do
              not show customer switching costs, multi-homing, independent workload benchmarks, reliability at scale, or
              a cost-per-workload comparison. Nor do they establish how quickly incumbents could reproduce software
              features or whether named operator selections become production volume. The available evidence supports a
              credible product-level differentiation hypothesis, not a proven moat. Diligence should test portability,
              field performance, qualification timelines, and the economics of replacing incumbent or internally built
              systems.
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Product portfolio is visible; monetization is not
        blocks:
          - type: paragraph
            body: >-
              Xsight's public product materials identify X-Series programmable Ethernet switch silicon and an E-Series
              800G DPU. Multiples.vc labels the revenue model “Product sales,” but that third-party profile field is not
              an audited company disclosure and does not establish whether revenue is recognized on silicon shipments,
              systems, licenses, support, or a mix. A July 2026 company announcement republished by Light Reading says
              E1 and X2 were selected by multiple global network operators and that Tier-1 hyperscalers were evaluating
              Xsight silicon. These are company-reported commercial signals, not disclosed orders, shipment volumes,
              recognized revenue, or customer conversion. The assigned sources support a product-sales hypothesis, but
              do not quantify monetized streams, revenue mix, or recognition terms.
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI007
          - type: table
            tableRef: TI001
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI007
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI007
              - CI016
      - number: '4.2'
        title: Price, margin, and sales-efficiency denominators remain unavailable
        blocks:
          - type: paragraph
            body: >-
              Xsight's product pages advertise X2 throughput and power figures, but those vendor claims do not measure
              manufacturing cost, gross margin, or customer savings captured by Xsight. The Semiconductor Industry
              Association (SIA) reports a U.S. semiconductor-industry average R&D spend of about one-fifth of revenue;
              that broad, undated sector figure is not an Xsight cost ratio. GAO describes facility construction costs
              and timelines for semiconductor projects, but those findings do not quantify this fabless company's
              foundry, packaging, testing, or inventory commitments. The assigned sources provide no list or realized
              prices, discounts, customer-acquisition cost, sales-cycle length, gross margin, cost of goods sold, or
              payback. Without shipment, price, and cost denominators, product specifications and reported selections
              cannot be converted into a revenue forecast or margin path.
            claimRefs:
              - CI003
              - CI005
              - CI006
              - CI011
              - CI013
              - CI014
          - type: table
            tableRef: TI002
            claimRefs:
              - CI004
              - CI013
      - number: '4.3'
        title: Financing headline is not cash available or runway
        blocks:
          - type: paragraph
            body: >-
              Light Reading's July 30, 2026 item is labeled “Press Release” and reproduces Xsight's announcement of a
              $300M+ round at a $2.8B post-money valuation. Multiples.vc separately lists $400M total funding across
              three rounds; the latest-round announcement and this third-party cumulative figure do not provide a
              round-by-round reconciliation or an audited cap table. Even a verified amount raised is not cash available
              after prior spending, debt, preferences, transaction costs, or current obligations. GAO's
              semiconductor-facility award report covers awards through July 2025 and does not establish Xsight's
              eligibility or receipt of public funds. Electronics Weekly and Converge Digest report adjacent-company
              Ayar Labs financing for high-volume production and testing; this co-packaged-optics financing is context
              only, not an operating or valuation benchmark for Xsight's switch/DPU business. Current cash, burn, debt,
              working capital, capital plan, and next-round trigger remain material diligence gaps.
            claimRefs:
              - CI001
              - CI002
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
              - CI003
              - CI011
              - CI014
              - CI015
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Capital sufficiency cannot be underwritten from the round headline
            body: >-
              The publicly reported financing amount and post-money valuation do not disclose cash on hand, burn, debt,
              or the funding required to reach scaled shipments; do not interpret funding raised as cash available.
            calloutType: risk
            claimRefs:
              - CI001
              - CI015
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product portfolio and maturity
        blocks:
          - type: paragraph
            body: >-
              Xsight's product portfolio is organized around programmable Ethernet switching and data processing. Its
              X-Series is presented as an Ethernet switch-silicon family for cloud and AI infrastructure, while the
              E-Series comprises DPUs; a third-party company profile also lists the X-PND Engine, though the available
              material does not explain that engine's function or commercial status (CE001). The official X2 page
              specifies a 12.8 Tbps, 5 nm switch, with up to 16 × 800G or 32 × 400G ports and company-claimed sub-700 ns
              latency and power below 200 W (CE002, CE003). These are vendor specifications and positioning, not
              independently measured results. Independent technical coverage describes the E1 as a 64-core Arm Neoverse
              N2 DPU with up to 800 Gbps networking, and discusses its host-side and storage/network offload roles
              (CE005, CE013). Converge Digest reports that the E1L extends the family toward edge and embedded workloads
              with up to 200 Gbps throughput and 25–40 W TDP configurations; sampling is planned for Q2 2027, not yet
              demonstrated as available product (CE007, CE009).
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE005
              - CE007
              - CE009
              - CE013
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE007
              - CE009
              - CE010
              - CE015
      - number: '5.2'
        title: Architecture, software, and deployment model
        blocks:
          - type: paragraph
            body: >-
              The differentiation case is programmability across both switch and DPU workloads, but the evidence is
              mostly product documentation and technical reporting rather than customer-validated outcomes. Xsight
              describes X2's XISA instruction set and programmable engines as a way to implement network functions
              without a hardware redesign; it names X-IQ for intelligent queuing, X-LB for dynamic load balancing, X-MON
              for health monitoring, and X-VIEW for telemetry (CE003, CE016). Its documentation says the XISA
              specification is published under MPLv2 and supplies programming examples (CE010). E1 coverage describes
              general-purpose Arm cores in the data path, with inline engines offloading packet parsing, classification,
              encryption, and other functions; this design combines Linux-hosting flexibility with a more
              power-intensive trade-off than implementing more functions in specialized hardware (CE005, CE011, CE012).
              The company's documentation lists standard Linux and frameworks including XDP, DPDK, and SPDK for E1,
              while Converge Digest reports that E1L shares the E1 software environment (CE008). SONiC's community
              documentation explains the broader multi-vendor operating-system context, but does not establish
              Xsight-specific integration quality or adoption (CE014). The product stack below is therefore a
              representation of disclosed components, not a verified end-to-end deployment architecture.
            claimRefs:
              - CE003
              - CE005
              - CE008
              - CE016
              - CE010
              - CE011
              - CE012
              - CE014
          - type: table
            tableRef: TE002
            claimRefs:
              - CE003
              - CE005
              - CE006
              - CE008
              - CE011
