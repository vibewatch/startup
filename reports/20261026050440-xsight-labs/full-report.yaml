              - CE014
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE002
              - CE003
              - CE010
              - CE015
              - CE016
      - number: '5.3'
        title: Differentiation and diligence priorities
        blocks:
          - type: paragraph
            body: >-
              Open programmability and familiar software tools may reduce the need for customers to adopt a wholly
              proprietary development model, but the public material does not quantify customer engineering effort,
              deployment time, total cost of ownership, or workload-level performance advantages (CE006, CE008).
              Xsight's documentation presents a public XISA specification and programming examples, while marking
              advanced switch development resources and E1-specific functional and hardware specifications as available
              with NDA access (CE010, CE015). The E1L's lower-power positioning and roadmap are reported by an external
              technical publisher, but sampling, qualification, customer uptake, and sustained operating behavior remain
              prospective or unverified in this pool (CE007, CE009). The assigned sources do not provide independently
              auditable reliability rates, production yields, security test results, incident history, or customer-scale
              support metrics. That evidence gap should not be read as proof that failures or incidents have not
              occurred; diligence should request test reports, errata, deployment references, security assessments, and
              qualification status before underwriting performance or trust claims.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
              - CE015
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Target segments and buyer roles
        blocks:
          - type: paragraph
            body: >-
              Xsight's own materials position its connectivity products for AI and hyperscale data centers, while
              Dealroom describes a broader target set spanning hyperscale cloud providers, enterprise data centers, and
              next-generation AI infrastructure operators. Those descriptions identify markets, not a verified customer
              roster or the share of revenue from each segment. The likely buying group is a network or infrastructure
              engineering team, with procurement and finance approval at the operator; those roles are analytical
              assumptions rather than disclosed Xsight account data. The public examples also span different commercial
              roles: Starlink is an announced end-user selection, Oxide is a system maker selecting a switch, and Credo
              is a component partner. They should not be counted as three equivalent end-customer deployments.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU008
              - CU009
      - number: '6.2'
        title: Adoption signals are not yet deployment metrics
        blocks:
          - type: paragraph
            body: >-
              The strongest named evidence is X2 selection for Starlink's next-generation V3 satellites, independently
              reported by CTech and ServeTheHome; both describe a future system, so the selection should not be read as
              proof that the satellites are already operating or that Xsight has recognized revenue. An Xsight-issued
              Business Wire announcement quotes Oxide's CTO saying Oxide selected X2 for its next-generation cloud
              computer and describes Credo as supporting Xsight with interconnect components. These are useful design-in
              and ecosystem signals, but the release does not quantify shipments, production scale, contract value, or
              repeat orders. The same 2024 announcement said X2 was sampling to customers then; that dated statement is
              not evidence of current availability or adoption scale.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
          - type: table
            tableRef: TU002
            claimRefs:
