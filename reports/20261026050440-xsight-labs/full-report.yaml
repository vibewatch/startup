      - number: '1.4'
        title: Milestones and commercial evidence
        blocks:
          - type: paragraph
            body: >-
              The dated record spans the 2017 founding, an October 2024 X2 announcement, company-reported E1 validation
              in November 2024, and the July 2026 financing (CO001, CO005, CO011). ToFlow's older financing entries are
              shown separately on the timeline and remain secondary-source assertions, not a reconciled capitalization
              history (CO014). SiliconANGLE reports that X2 was selected for Starlink V3 in 2025; CTech later reports a
              successful joint test shortly before its July 30, 2026 article (CO012). That is meaningful evidence of a
              named deployment milestone, but the assigned material does not disclose contract economics, volume,
              revenue contribution, or repeat deployments. SiliconANGLE also cautions that Cisco, Broadcom, and Marvell
              have broader portfolios and deeper customer relationships; that is a reported commercialization risk, not
              an independent comparative benchmark of chip performance (CO015).
