company:
  name: Xsight Labs
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Xsight Labs is a fabless networking-silicon company whose 2026 financing
    drew a $2.8 billion valuation, while key operating and governance
    denominators remain unavailable in the assigned evidence. Independent
    reporting supports a real product and customer milestone, but public
    funding-history and headquarters descriptions require reconciliation.
sections:
  - id: identity-and-business-model
    title: Identity and business model
    body: >-
      CTech identifies Xsight Labs as founded in 2017 by Guy Koren, Erez
      Sheizaf, and Gal Malach, all former EZchip employees; ToFlow independently
      describes a 2017 founding by three former EZchip executives (CO001).
      CTech and Globes place the company in Kiryat Gat, while SiliconANGLE
      describes it as based in Tel Aviv (CO002, CO003). The sources may be
      referring to different parts of the company's Israeli footprint, but the
      assigned evidence does not resolve its registered or principal
      headquarters. Xsight describes itself as a fabless designer of
      programmable Ethernet switches and data-processing units for data-center,
      cloud, and AI networking (CO008). Its product pages present X2 switch
      silicon and the E1 DPU as complementary networking components, with
      programmability and power efficiency as company-stated differentiators
      rather than independently benchmarked advantages (CO009, CO010).
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO008
      - CO009
      - CO010
    tableRefs:
      - TO001
  - id: leadership-and-governance
    title: Leadership and governance
    body: >-
      Publicly named roles include co-founder and CEO Yossi Meyouhas,
      co-founder and CTO Gal Malach, and founding investor and chair Avigdor
      Willenz (CO001, CO004). The founders' prior EZchip experience is a
      plausible source of technical and semiconductor-networking experience,
      but the evidence establishes biographies, not present-day execution
      quality or succession depth. The assigned pages do not establish the
      full board, committee oversight, founder ownership, executive tenure,
      delegation, or material leadership changes. These are material private
      diligence items: a concentrated technical and commercial bench can
      increase key-person exposure even when named leaders have relevant
      domain experience. Treat the listed people as a partial, source-backed
      roster, not a complete organization chart.
    claimRefs:
      - CO001
      - CO004
    tableRefs:
      - TO002
  - id: financing-and-scale
    title: Financing and operating scale
    body: >-
      SiliconANGLE, Globes, and CTech report a July 2026 financing of $300
      million at a $2.8 billion valuation, with Fidelity Management & Research
      Company leading the round (CO005, CO006, CO007). These are reported
      financing terms, not revenue, ARR, cash on hand, or a measure of
      operating performance. The public record in this pool does not reconcile
      lifetime capital raised: CTech says more than $450 million, while ToFlow
      lists $450 million alongside a round history whose labels and dates are
      not internally consistent (CO013, CO014). ToFlow also displays a
      201-500 employee range, but no current company disclosure corroborates
      that range; no supportable current revenue, ARR, or customer count is
      available in the assigned source text (CO014, CO016). These gaps leave
      valuation-to-revenue, customer concentration, and cash runway diligence
      unresolved.
    claimRefs:
      - CO005
      - CO006
      - CO007
      - CO013
      - CO014
      - CO016
    tableRefs:
      - TO003
  - id: milestones-and-commercial-evidence
    title: Milestones and commercial evidence
    body: >-
      The dated record spans the 2017 founding, an October 2024 X2 announcement,
      company-reported E1 validation in November 2024, and the July 2026
      financing (CO001, CO005, CO011). ToFlow's older financing entries are
      shown separately on the timeline and remain secondary-source assertions,
      not a reconciled capitalization history (CO014). SiliconANGLE reports
      that X2 was selected for Starlink V3 in 2025; CTech later reports a
      successful joint test shortly before its July 30, 2026 article (CO012).
      That is meaningful evidence of a named deployment milestone, but the
      assigned material does not disclose contract economics, volume, revenue
      contribution, or repeat deployments. SiliconANGLE also cautions that
      Cisco, Broadcom, and Marvell have broader portfolios and deeper customer
      relationships; that is a reported commercialization risk, not an
      independent comparative benchmark of chip performance (CO015).
    claimRefs:
      - CO001
      - CO005
      - CO011
      - CO012
      - CO014
      - CO015
    figureRefs:
      - FO001
