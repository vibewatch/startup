  topStrengths:
    - >-
      Handshake still appears to own the strongest university-distribution network in the category, with 1,500-1,600+
      institution partners and 20 million students, alumni, or knowledge workers flowing through a trusted campus
      workflow.
    - >-
      The product surface is broader than a campus job board: Handshake spans career-center software, employer sourcing
      and ATS integrations, mobile student workflows, promoted jobs, and a newer AI-data business that could materially
      expand revenue beyond classic recruiting SaaS.
    - >-
      The company retains substantial strategic backing and brand credibility, with a documented $200 million Series F,
      roughly $434 million of lifetime funding, and broad enterprise-employer penetration including Fortune 100 usage
      claims.
  topRisks:
    - >-
      The current valuation is stale and hard to defend from open evidence: the last priced mark is January 2022, public
      revenue support is contradictory, and the most optimistic valuation case depends on an unverified 2026 net-revenue
      estimate rather than audited disclosure.
    - >-
      Handshake remains exposed to early-career hiring softness, recruiter workflow substitution from
      LinkedIn/Indeed/ATS suites, and university renewal pressure if schools decide the workflow layer can be replaced
      without losing network access.
    - >-
      Trust, privacy, and compliance obligations are structurally high because Handshake sits on education-linked
      identity and recruiting data while also operating student-facing mobile products, sponsored jobs, and Handshake AI
      contractor programs.
  unresolvedGaps:
    - >-
      Current audited net revenue, gross margin, burn, runway, and retention remain the biggest blockers to underwriting
      business quality rather than just network scale.
    - >-
      Fresh price discovery after the January 2022 Series F is still missing; public SPV/Form D activity suggests
      investor interest but does not prove what new primary or secondary marks would clear today.
    - >-
      Public sources do not cleanly reconcile Handshake’s legacy recruiting SaaS revenue with Handshake AI gross flow,
      contractor payouts, or the true retained-margin profile of the newer business.
    - >-
      School and employer retention, concentration, and renewal cohorts are not publicly disclosed, leaving durability
      of the university anchor and premium employer upsell materially underexplained.
