- id: moat-durability-and-displacement
  title: Moat durability, adverse signals, and the most credible displacement paths
  body: 'The durable part of Handshake''s position is that it still publishes the strongest combined proof on universities,
    active early-career users, and employer presence. The weaker part is that the category is full of credible alternatives
    whose value does not depend on recreating Handshake exactly. Symplicity and 12twenty can win by owning school workflows,
    RippleMatch and Untapped can win by improving signal quality, and LinkedIn or ATS suites can win by pulling campus recruiting
    into a broader recruiter shell. Trust is also not a trivial side issue: both Handshake and Symplicity explicitly market
    student protection, fraud prevention, and compliance, which means trust is already a buyer criterion rather than a hidden
    feature. The most adverse public signal on Handshake is therefore not a visible compliance breakdown; it is that institutional
    workflows appear replaceable while app-review friction remains visible. If that pattern persists, Handshake can remain
    a useful network channel but lose leverage as the default operating system for early-career recruiting.'
