  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: Current realized seat pricing, discounts, and renewal uplift for Handshake and direct peers.
    whyItMatters: Public list-price visibility is uneven, so the economic winner can shift materially once enterprise discounts
      are applied.
    diligencePath: Request current price cards, renewal cohorts, and discount corridors for Handshake, Symplicity, RippleMatch,
      and 12twenty.
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: win-loss
    missingEvidence: Competitor-coded win-loss, school churn, and renewal reasons by segment.
    whyItMatters: Public customer logos and case studies do not reveal whether Handshake is winning new workflow ownership
      or simply coexisting through multi-homing.
    diligencePath: Request the last 12 months of school and employer win-loss data tagged by LinkedIn, Symplicity, 12twenty,
      RippleMatch, ATS suite, or status-quo internal build.
    relatedTableRefs:
    - TP004
  - type: private-evidence-only
    severity: minor
    topic: usage-depth
    missingEvidence: Active user, application, event, and integration-usage depth by campus cohort rather than registered-account
      totals alone.
    whyItMatters: Network-size claims overstate lock-in if a meaningful share of activity happens off-platform or through
      other systems.
    diligencePath: Request MAU, application conversion, event attendance, and ATS-integration usage by school type and employer
      cohort.
    relatedTableRefs:
    - TP004
