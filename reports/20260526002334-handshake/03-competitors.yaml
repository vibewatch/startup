- id: FP003
  title: Handshake moat / readiness KPIs
  type: kpi
  layout: standard
  summary: Handshake still has the strongest retained campus-liquidity proof, but its risk profile is elevated by quote-led
    pricing, switchable university workflows, and visible multi-homing behavior.
  approximationNotes: Labels are analytical judgments from retained public evidence. Strong indicates a clear current advantage,
    Moderate indicates a real but conditional edge, Weak indicates structural limitation, and High indicates a severe competitive
    threat.
  data:
    items:
    - label: University distribution breadth
      value: Strong
      note: Handshake still publishes the broadest retained U.S. school footprint among the compared set.
    - label: Open candidate liquidity
      value: Strong
      note: 20M active students and alumni plus 1M employers give Handshake the best retained public liquidity proof.
    - label: Public pricing transparency
      value: Weak
      note: Handshake retained pages remain demo-led while several rivals publish pricing anchors.
    - label: ATS embedding
      value: Moderate
      note: Handshake integrates into ATS workflows, but ATS vendors and RippleMatch market similar connections.
    - label: School-workflow exclusivity
      value: At Risk
      note: UT Austin shows a school can replace Handshake as system of record while leaving the network accessible.
    - label: Trust posture
      value: Strong
      note: FERPA and career-center security messaging remain credible buyer-facing signals.
    - label: Multi-homing risk
      value: High
      note: Students, schools, and employers can use Handshake alongside other tools instead of abandoning rivals entirely.
    - label: Adjacent-shell pressure
      value: High
