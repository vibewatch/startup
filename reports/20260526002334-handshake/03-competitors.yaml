- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Vendor
  - Public package / pricing evidence
  - Contract motion
  - Included capabilities
  - What remains unclear
  rows:
  - - Handshake
    - Retained public pages show sign-up and demo CTAs but no list price
    - Quote-led / demo-led
    - Career-center distribution, ATS integration, employer branding, events, and candidate engagement
    - Seat minimums, renewal uplift, and realized discounting
  - - LinkedIn Hiring Pro / Recruiter
    - Hiring Pro publishes free and promoted posting mechanics; Recruiter seat pricing varies by org and seats
    - Hybrid self-serve plus enterprise contract motion
    - Job posts, sourcing, AI assistance, and broader recruiter shell
    - Campus-specific cost at enterprise scale and Recruiter add-on economics
  - - Symplicity Recruit
    - Public pricing starts at $55 per post per school; Pro starts at $329/month; Premium custom
    - Transparent starter tiers plus custom premium
    - Events, fairs, interviews, AI sourcing, resume database, and direct student messaging
    - Realized annual spend at large school or employer scale
  - - RippleMatch
    - Retained public pages push demo motion and customer stories, not a list price
    - Quote-led
    - Campus OS, ATS integrations, skill validation, events, and recruiter workflow tooling
    - Net pricing, module packaging, and services attach
  - - 12twenty
    - Retained public pages emphasize demos and product hubs, not list pricing
    - Quote-led
    - Career-center stack, hiring cloud, recruiting intelligence, and virtual events
    - Actual employer package floors and school-wide enterprise pricing
  - - Untapped
    - Retained public pages emphasize demos and custom early-talent or DEI workflows
    - Quote-led
    - Searchable profiles, events, DEI analytics, and candidate filtering
    - Seat pricing, data-module attach, and recruiter-volume economics
  - - SmartRecruiters
    - Essential starts at $14,995; larger plans move to request pricing
    - Tiered public entry plan plus enterprise upsell
    - ATS, AI matching, screening, onboarding, scheduling, and high-volume hiring
    - The effective cost of add-ons and campus-specific use cases
  notes: Pricing visibility itself is a competitive variable. Transparent rivals shape budget expectations before procurement
    calls begin, while Handshake and several direct peers remain quote-led on retained public pages.
