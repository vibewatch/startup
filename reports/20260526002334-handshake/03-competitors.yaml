- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Evidence
  - Mitigation / diligence ask
  rows:
  - - University distribution breadth
    - Schools can switch workflow systems while leaving students free to multi-home on Handshake or elsewhere
    - High
    - UT Austin replaced Handshake with 12twenty while still telling users to keep using Handshake's open network
    - Request campus retention, replacement, and reactivation data by school type
  - - Employer density
    - LinkedIn, ATS suites, and internal-build stacks already control adjacent hiring budgets
    - High
    - LinkedIn, iCIMS, and SmartRecruiters all market broader recruiter shells and workflow ownership
    - Request competitor-coded win/loss and attach rates when Handshake loses to an existing ATS or recruiter suite
  - - Trust and student protection
    - Fraud and safety concerns are explicit buyer criteria in this category
    - Medium
    - Handshake and Symplicity both foreground student protection and fraud prevention in public messaging
    - Ask for fraud incident volume, school escalations, and security-review close rates
  - - Public pricing opacity
    - Rivals with public anchors can frame value sooner than Handshake can
    - Medium
    - LinkedIn, Symplicity, and SmartRecruiters publish public price mechanics or entry tiers; Handshake does not
    - Request current price cards, discount corridors, and renewal uplift by segment
  - - ATS integration story
    - Integration is necessary but not exclusive because peers and entrants also connect to ATS systems
    - Medium
    - Handshake, RippleMatch, iCIMS, and SmartRecruiters all market ATS or hiring-system integration
    - Request usage data for integrations that actually drive applications, interviews, and renewals
  - - Mobile and candidate experience
    - App friction can erode network-quality perception if recommendations feel noisy
    - Medium
    - A retained 2026 Google Play review highlights poor location relevance despite stated preferences
    - Request app NPS, retention, and recommendation-quality metrics by cohort
  - - Internal-build substitute
    - Career centers, fairs, ATS tools, and job boards can reproduce much of the workflow without one dedicated network
    - High
    - SmartRecruiters explicitly describes campus recruiting through career centers, fairs, social channels, career pages,
      and internships
    - Quantify the incremental ROI of Handshake versus status-quo stack spending
  notes: This register focuses on durability rather than product quality. Several risks come from alternative workflow ownership
    and multi-homing behavior rather than from a lack of basic product capability.
