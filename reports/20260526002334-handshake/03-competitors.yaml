callouts:
- calloutType: strength
  title: The distribution asset is still real
  body: Handshake remains hardest to dismiss where a buyer values broad university distribution and visible student liquidity
    at the same time. The retained public proof on schools, employers, and active students is still stronger than what the
    direct peers publish, which keeps Handshake relevant even when a school or employer also runs another workflow tool.
  claimRefs:
  - CP004
  - CP006
  - CP007
  - CP009
  - CP016
  - CP017
  - CP056
- calloutType: risk
  title: Switching the workflow layer does not require abandoning Handshake
  body: The most important adverse pattern is not outright replacement of the open network; it is that a school or employer
    can move the workflow system of record to another vendor while still letting users multi-home on Handshake. That weakens
    renewal leverage because presence in the stack is not the same as ownership of the workflow.
  claimRefs:
  - CP018
  - CP019
  - CP054
  - CP058
  - CP060
- calloutType: insight
  title: Transparent rivals shape procurement earlier
  body: Public price anchors matter. LinkedIn, Symplicity, and SmartRecruiters can frame budget expectations before sales
    ever speaks with a buyer, while Handshake stays demo-led. That does not prove Handshake is more expensive, but it does
    mean rivals can start the economic conversation first.
  claimRefs:
  - CP015
  - CP023
  - CP024
  - CP027
  - CP028
  - CP050
  - CP055
