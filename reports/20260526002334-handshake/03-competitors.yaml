- id: switching-costs-and-multi-homing
  title: Switching cost, lock-in, and why multi-homing weakens raw network counts
  body: 'Handshake has real switching cost, but it is concentrated in institutional distribution rather than in hard exclusivity.
    The Illinois and Virginia Tech customer pages show how embedded Handshake can become inside campus career-service operations,
    and the Handshake employer and career-center pages reinforce that the company sees ATS integration, reporting, and school
    relationships as part of its value. But UT Austin shows the weakness in the moat: a school can move the official career-management
    workflow to 12twenty while still telling students to keep using Handshake''s open network for jobs and internships. That
    is classic multi-homing. It means presence in the market does not guarantee ownership of the workflow. The same logic
    applies on the employer side: LinkedIn, iCIMS, and SmartRecruiters can compete from adjacent shells that are already budgeted,
    while RippleMatch and Untapped can coexist as matching or analytics layers. The implication is that Handshake''s raw counts
    overstate lock-in unless they translate into workflow ownership and renewal leverage.'
