company:
  name: Handshake
chapter:
  number: 3
  title: Competitors
  summary: Handshake still leads the retained public set on university distribution and early-career network liquidity, but
    its moat is weaker than the raw school and employer counts imply because schools can replace the workflow layer without
    forcing students or recruiters to abandon multi-homing. Direct peers like Symplicity, 12twenty, RippleMatch, and Untapped
    attack the category through campus operations, matching signal, or DEI data, while LinkedIn and ATS suites pressure from
    already-funded recruiter shells. The practical diligence conclusion is that Handshake has a real distribution asset, but
    durability depends more on protecting institutional workflow relevance and trust than on assuming winner-take-most lock-in.
sections:
- id: landscape-overview
  title: Direct peers, adjacent suites, and the real decision set
  body: 'Handshake is not being compared only against another student network. The direct overlaps are school-workflow and
    early-career specialists such as Symplicity, 12twenty, RippleMatch, and Untapped, each of which sells a different slice
    of the same job: connecting universities, recruiters, and early-career talent. The next layer of competition comes from
    incumbents and adjacent shells. LinkedIn already owns a broad recruiter budget, while iCIMS and SmartRecruiters extend
    existing ATS and enterprise hiring workflows into university recruiting, events, and target-school pipelines. The status-quo
    substitute is also real: an employer can still run career-center relationships, fairs, an ATS, and general job boards
    without buying Handshake as the workflow system of record. That matters because Handshake''s strongest published proof
    is distribution, not exclusivity. It has large school and employer counts, but the category still allows buyers to stitch
    together alternatives or add Handshake as one channel rather than the entire stack.'
