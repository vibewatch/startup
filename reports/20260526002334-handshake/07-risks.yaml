- "id": "legal-regulatory-and-privacy"
  "title": "Legal, regulatory, and privacy risk"
  "body": "Legal and regulatory exposure is the most severe cluster because Handshake sits inside school data flows while also marketing consumer mobile apps and cross-border services. Its own policies say it collects and shares broad categories of personal data, while its candidate notice shows the organization is comfortable processing sensitive information, background-check data, and device or messaging metadata where allowed. FERPA matters because eligible students control disclosure of education-record data and schools may only use vendors like Handshake under the school-official exception when the vendor remains under direct institutional control and does not redisclose data beyond authorized purposes. CCPA adds deletion, correction, opt-out, and sensitive-data limits for California residents, while Handshake's DPF notice keeps EU, UK, and Swiss transfer obligations live under FTC supervision. The enforcement backdrop is also real: FTC guidance ties liability to inaccurate privacy\
    \ promises and weak security, California is settling privacy cases against major digital businesses, and content-removal laws are expanding obligations for platforms that host or transmit user-generated content. No public artifact in this run proves a Handshake-specific enforcement action, but the compliance surface is large enough that investors should treat the absence of a public case as an incomplete scan, not as a clean bill of health."
