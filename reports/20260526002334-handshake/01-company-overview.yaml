  "chapter": {
    "number": 1,
    "title": "Company Overview",
    "summary": "Handshake is a San Francisco-founded, late-stage private career marketplace that now presents itself as a three-sided “career network for the AI economy” connecting 20 million job seekers, 1,600+ institutions, and 1 million employers. Public evidence supports a durable founder-led distribution network, deep venture backing, and a clear 2025-2026 AI pivot through new employer tools and the Taro/Cleanlab acquisitions, but current valuation refresh, exact 2026 headcount, and governance-rights disclosure remain incomplete."
  },
  "sections": [
    {
      "id": "identity-model-and-footprint",
      "title": "Identity, market role, and operating footprint",
      "body": "Handshake’s official 2026 framing is materially broader than the campus-recruiting brand many investors remember. The company now calls itself the ‘career network for the AI economy’ and describes a three-sided marketplace that connects 20 million knowledge workers, 1,600+ educational institutions, and 1 million employers. That positioning matters because it changes both the addressable market and the business model: Handshake is no longer just a university job board, but a distribution layer spanning students, alumni, employers, labor-market insights, and newer AI-adjacent work. The employers and career-centers pages reinforce that expansion. Employers are sold brand, targeting, ATS, and workflow tools; institutions are sold outcomes reporting, employer access, and mobile-first student engagement. Public footprint evidence is sufficient at the city level: Handshake is San Francisco-headquartered with named offices in New York, the UK, and Bangalore, while its careers page shows current hiring across San Francisco, New York, London, India, and remote U.S. roles. The main caveat is that Handshake’s own description now blends classic recruiting software, marketplace liquidity, and AI-economy upskilling into one story, so later chapters should separate durable platform facts from newer narrative expansion.",
