  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 已验证估值、冲突分母，以及公开证据能否支撑旧价格
        blocks:
          - type: paragraph
            body: >-
              核心估值事实容易核验，核心承销判断则不容易。Handshake 最近一次明确披露的新股定价轮仍是 2022 年 1 月 Series F，估值 $3.5B。公开追踪器仍聚集在累计融资约 $434M
              附近，也没有显示更新的新股融资事件。这意味着投资者实际上是在判断旧价格是否仍然合理，而不是依赖新的市场出清证据。问题在于分母互相矛盾。GetLatka 报告 2024 年收入为 $172M，Sacra 估计
              2024 年约 $190M，随后跳到 2026 年框架：总收入约 $1.1B，扣除承包商付款后净收入 $450M。这些数字方向上有帮助，但并不等价。按 2024 年收入代理值计算，过期估值约为收入的
              18.4x-20.3x；按 Sacra 的 2026 年净收入估计，则降至约 7.8x。这个差距解释了为什么本章不能把 2022 年价格当作自证正确。只有 AI 转向真实、耐久，并且留存在远高于当前已验证
              2024 年数字的净收入基数上，旧估值才站得住。
