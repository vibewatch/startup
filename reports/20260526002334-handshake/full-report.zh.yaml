      - number: '2.5'
        title: 矛盾、采用缺口与尽调重点
        blocks:
          - type: paragraph
            body: >-
              Handshake 市场故事里最大的矛盾是，品类层面的软件 TAM 在上升，而实际观察到的早期人才招聘却明显更弱。公开市场规模估算可以支撑一个大故事——广义人才获取软件约 USD 11
              billion——但更近的招聘软件品类小得多，且两个估算都没有干净隔离校园招聘。雇主需求同样矛盾：NACE 2025 年秋季观点基本持平，2026
              年春季又改善，但申请拥堵、就业不足和低回复率仍指向一个承压市场。采用情况在部署上也比使用上好看。高校可以自动开通账户，并把 Handshake 嵌入招聘会、预约和面试，但 Strada
              的发现显示，许多大四学生仍不做人脉拓展，不高频使用职业服务，也没有建立最终推动结果的社会资本。实际尽调含义很直接：投资人不应只按品类增长来承销
              Handshake。最重要的开放问题是雇主细分群体的确切付费意愿、按机构类型划分的活跃用户参与度，以及面向校园招聘或职业中心 CRM 的公开独立
              TAM。在这些问题被记录前，多视角、证据约束的市场判断，比干净教科书式 TAM/SAM/SOM 框架更可信。
