  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式、定价与收入结构可见度
        blocks:
          - type: paragraph
            body: >-
              Handshake 的公开收入架构，远比经审计经济性清楚。雇主侧，公司现在披露了真正的三层价格阶梯：降低雇主获取摩擦的免费 Basic 计划，每月 $450 或每年 $4,500 的 Pro
              计划，以及由销售驱动的 Enterprise 层，叠加集成、分析、工作流自动化和支持。这一点很重要，因为它确认 Handshake
              不只是校园招聘板；它试图把雇主工作流、品牌存在和互动强度都变现。在这些订阅计划之上，Handshake 还营销推广职位；据 AIM Group 2026 年预告，公司已推出一个利用行为定向和 AI
              驱动匹配的赞助职位产品。更大的变化是收入结构。2025-2026 年官方公司材料称，Handshake AI 现在直接与前沿实验室合作，购买雇主数据，并向庞大的月度任务执行者群体付款。这在传统招聘 SaaS
              之外创造了第二台引擎。承销问题在于，雇主计划的公开定价很详细，但学校合同、AI 合同、实际折扣和付款方结构仍不透明，因此公开可见度最好的是变现设计，而不是常态化实际收入质量。
