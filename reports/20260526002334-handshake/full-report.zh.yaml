  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层是三边的，高校仍锚定渠道
        blocks:
          - type: paragraph
            body: >-
              Handshake 的客户基础不是正常 SaaS 客户徽标列表。公开公司叙事明确是三边的：高校和职业中心锚定机构侧，学生和校友创造需求侧流动性，雇主提供职位、活动和招聘支出。规模说法足够大——当前旗舰页面称 20
              million 用户、1,600+ 所教育机构、1 million 家雇主——但变现设计比表面上的规模数字更有信息量。Handshake 自己的英国商业模式页称，学生免费使用产品，约 98%
              的雇主仍免费使用核心服务，变现来自高校以及品牌展示、活动、分析和额外支持等高级雇主功能。这意味着，客户质量不取决于少数巨型账户，而更取决于能否让机构相信 Handshake
              应继续作为学生、雇主和校方人员相遇的记录系统渠道。职业中心页同时列出顶尖四年制学校、社区学院、HBCU 和 MSI，说明机构足迹很广，也凸显校园合作伙伴对整个飞轮有多核心。
