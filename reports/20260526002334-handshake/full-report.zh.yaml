  - id: TP004
    title: 护城河耐久度 / 竞争风险清单
    columns:
      - 护城河主张
      - 威胁
      - 严重度
      - 证据
      - 缓释措施 / 尽调问题
    rows:
      - - 大学分发覆盖广度
        - 学校可以更换工作流系统，同时让学生继续在 Handshake 或其他平台多栖
        - 高
        - UT Austin 用 12twenty 替换 Handshake，但仍告知用户继续使用 Handshake 的开放网络
        - 按学校类型索取校园留存、替换和重新激活数据
      - - 雇主密度
        - LinkedIn、ATS 套件和自建技术栈已经掌握相邻招聘预算
        - 高
        - LinkedIn、iCIMS 和 SmartRecruiters 都在销售更完整的招聘方工作台与工作流控制权
        - 当 Handshake 输给既有 ATS 或招聘套件时，索取按竞争对手标注的赢单 / 输单和附加销售率
      - - 信任与学生保护
        - 欺诈和安全顾虑是该品类明确的采购标准
        - 中
        - Handshake 和 Symplicity 在公开信息中都把学生保护和欺诈防控放在前台
        - 索取欺诈事件量、学校升级处理量和安全审查关闭率
      - - 公开定价不透明
        - 有公开价格锚点的对手能比 Handshake 更早框定价值
        - 中
        - LinkedIn、Symplicity 和 SmartRecruiters 公开价格机制或入门层级；Handshake 没有
        - 按细分市场索取当前价目表、折扣区间和续约涨幅
      - - ATS 集成叙事
        - 集成是必要项，但不独占，因为同业和新进入者也能连接 ATS 系统
        - 中
        - Handshake、RippleMatch、iCIMS 和 SmartRecruiters 都在营销 ATS 或招聘系统集成
        - 索取真正带动申请、面试和续约的集成使用数据
      - - 移动端与候选人体验
        - 推荐如果显得嘈杂，App 摩擦会削弱外界对网络质量的感知
        - 中
        - 留存的一条 2026 年 Google Play 评论指出，即便设定了偏好，地点相关性仍然很差
        - 按队列索取 App NPS、留存和推荐质量指标
      - - 自建替代方案
        - 职业中心、招聘会、ATS 工具和招聘网站不靠专用网络，也能复现大部分工作流
