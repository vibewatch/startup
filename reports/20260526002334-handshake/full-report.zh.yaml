      - number: '6.4'
        title: 学校工作流多年延续、App 口碑不错，但公开留存指标仍缺位
        blocks:
          - type: paragraph
            body: >-
              公开耐久性证据足以说明真实使用存在，但不足以支撑续约经济性。积极面看，VCU 自 2018 年以来长期使用，Michigan 招聘会成果、Carnegie Mellon 持续工作流、Johns Hopkins
              的个人资料激活指引，都说明 Handshake 一旦嵌入职业中心，就能越过试点阶段。评论面又加了一层证据。TrustRadius 上 CoStar、Uber 和 Fidelity
              的引述描述了可量化的雇主价值：触达候选人、打开率和点击率强、候选人覆盖更广、漏斗顶部多元性更好。FeaturedCustomers 也汇总了相当数量的客户引用。学生侧口碑在 Apple
              应用商店更强，Handshake 在 124K 条评分中拿到 4.9/5。问题是，这些渠道都没有披露
              NRR、GRR、流失率或续约队列。因此，公开证据可以支撑用户会参与、部分客户获得价值的判断，但不能证明付费雇主支出或大学合同随时间到底有多黏。
