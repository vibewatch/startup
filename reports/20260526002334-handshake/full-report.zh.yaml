companyProfile:
  summary: >-
    Handshake 成立于 2014 年，总部在 San
    Francisco，由创始人主导。公司先把自己做成高校职业中心的核心工作流软件和学生、应届毕业生招聘的默认入口，由此打出很强的分发楔子。公开证据显示，业务已经不止校园招聘：公司仍靠雇主寻源、高级品牌展示、活动、推广职位和高校工作流变现，也在大力推进
    Handshake AI 服务，以及绑定学术网络的数据工作。投资吸引力在于网络覆盖——现有材料显示 20 million 名求职者、1,600+ 所机构、1 million
    家雇主——再加上长期风险资本支持和企业雇主采用证据。核心尽调难点是，新的估值支撑、净收入质量、利润率和当前流动性，远没有网络和产品叙事透明。
