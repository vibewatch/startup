      - number: '4.4'
        title: 资本充足性、融资依赖与结论
        blocks:
          - type: paragraph
            body: >-
              Handshake 历史融资容易记录，当下流动性却不容易。公开公司资料和 2022 年报道都指向约 $430 million 至 $435 million 累计融资，以及 $3.5 billion 估值的
              $200 million Series F。这证明公司过去有很强的资本获取能力，但没有回答投资人的现实问题：还有多少现金、当前烧钱速度是多少，以及公司能否在没有外部新钱的情况下继续支持招聘和 AI
              交付。本轮最新融资线索不是公司新闻稿，而是 2026 年 Handshake 命名 SPV 的 SEC 文件。Scenic Co-Invest Handshake LLC 和 Odyssey Handshake
              I SPV, LP 在 2026 年 4 月和 5 月合计报告售出近 $79.6 million，指向围绕 Handshake
              份额的持续投资者需求或流动性活动。但这些文件没有披露运营公司本身是否拿到款项、是否用于一级市场增长，还是只是支持老股交易。最终承销结论很直接：收入动能真实，产品堆栈很宽，资本获取历史上很强，但如果没有包含分部
              P&L、队列指标和当前现金桥的私有数据室，收入质量、分部利润率耐久性和当前融资依赖仍明显披露不足。
