      - number: '1.2'
        title: 创始人、领导层厚度与治理可见度
        blocks:
          - type: paragraph
            body: >-
              Handshake 仍然带有鲜明的创始人印记。Garrett Lord 仍是公开层面的核心运营者，公司也继续把 Ben Christensen 和 Scott Ringwelski 呈现为联合创始人，并把故事放在
              Michigan Tech 起点：把机会入口扩展到精英校园管道之外。公开领导层披露强于公开控制权披露。官方 About 页列出一批可见的当前高管——Jonathan Stull、Jesse
              Hulsing、Matt Greenberg、Dylan Lowrey、Christine Cruzvergara、Paco Guzmán 等——说明 Handshake 已在运营、财务、技术、法务、教育合作和
              AI 研究上搭出职能深度。公开董事会可见度只有一部分。面向市场宣传的董事会名单列出 6 名外部董事，而 Tracxn
              展示了更宽的一组创始人和高管作为当前董事会成员。尽调真正要看的不是哪份名单「更完整」，而是两者都没有给出委员会结构、董事会权利、投资人否决权或股权结构控制动态。对于一家后期私营公司，这留下了真实的治理缺口。创始人团队可信，高管班子看起来比前几年更宽，董事会也包括
              Michael Lomax 这样的知名投资人和教育界人物，但公开记录仍看不出控制权实际如何行使。
