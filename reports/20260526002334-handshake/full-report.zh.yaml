  - id: TV005
    title: 论点破裂和终止触发条件表
    columns:
      - 触发条件
      - 阈值 / 事件
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 新价格重置
        - 要约收购、409A 或定价轮低于 ~$2B
        - 确认过时估值标记过高，并迫使承销起点下调
        - 不要沿用 2022 年头条估值，从新的出清价格重建案例
      - - 净收入不及预期
        - 审计留存收入显著低于 ~$350M
        - 基准情景坍塌，Handshake 更接近传统招聘 / 教育科技可比公司
        - 立即切换到熊案测算
      - - 利润率令人失望
        - AI 抽成率或贡献利润率更像薄利市场平台，而不是高溢价软件
        - 即便 AI 总量维持高位，多头倍数案例也消失
        - 拒绝按溢价倍数承销
      - - 核心市场恶化
        - 早期职业职位持续减少，同时裁员延续
        - 削弱雇主付费意愿，并提高传统网络流失风险
        - 下调估值区间，降低对 IPO 的期待
      - - 披露仍不透明
        - 尽调中没有经审计的分部财务或资本结构瀑布表
        - 实际回报可能与企业价值大幅背离，也挡住有信心的入场
        - 即便公司质量仍高，也停留在继续研究 / 跟踪
    notes: 每个终止触发条件都可监控，并直接连接估值传导，而不是泛泛的经营风险。
    claimRefs:
      - CV022
      - CV040
      - CV043
      - CV044
      - CV046
      - CV047
      - CV048
      - CV050
      - CV051
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 意义
      - 负责人 / 尽调路径
    rows:
      - - 经审计的 AI 总额到净额桥接
        - 季度和年度 AI 总账单额、付款和留存收入
        - 这是判断旧价格是高溢价还是不可信的最重要分母
        - 索取经审计的管理层报表和分部桥接
      - - 利润率质量
        - 核心招聘与 AI 之间的毛利率、贡献利润率和运营费用拆分
        - 只有 AI 经济性显著好于转付劳动力经济性，溢价估值才成立
        - 索取分部 P&L 和董事会 KPI 包
      - - 最新价格发现
        - 任何 2025-2026 年要约收购、409A、经纪报价或定价轮文件
        - 当前公开证据锚定过时的 2022 年轮次，而不是新鲜市场出清事件
        - 索取最新要约收购材料、409A 备忘录或融资文件
      - - 股权结构和优先权
        - 完全稀释股权、清算顺位、二级交易权利、ROFR/ROFO 和附属协议
        - 在下行融资轮或战略出售场景中，企业价值可能夸大投资者实际回报
        - 索取当前股权结构表和瀑布表
      - - 客户质量和留存
        - 付费雇主留存、净收入留存、集中度和 AI 客户流失
        - 显示网络护城河是否真正转化为持久现金流
        - 索取客群队列表和头部客户集中度明细
      - - 重组和招聘计划
        - 2025 年末裁员细节、2026 年招聘计划，以及 AI 与核心业务的资源分配
        - 如果公司仍在围绕未验证的 AI 组合重新分配资源，执行风险会上升
        - 索取人员计划摘要和重组后的运营模型
    notes: 这些问题是门槛项，不是润色；没有这些信息，投资案例仍过度依赖第三方估算和过时价格锚点。
    claimRefs:
      - CV010
      - CV021
      - CV022
      - CV024
      - CV043
      - CV050
      - CV053
