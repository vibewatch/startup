            body: >-
              公开证据并不说明 Handshake 今天已具备 IPO 条件。公司显然有战略相关性：官方 AI 页面显示其专家网络庞大、付款规模有意义，产品面现在覆盖招聘、AI
              工作和平台内作品集工具。但同一组证据也说明，按公开市场标准承销还为时过早。我们仍没有经审计的分部利润率、AI 收入从总额到净额的桥接、当前融资条款或股权结构表瀑布。与此同时，下行证据足够具体：Handshake
              自有数据显示，早期职业岗位发布量低于疫情前水平，外部报道也指出公司在 2025 年裁员并把资源重新配置到 AI。这个组合让老股要约或战略交易比近期 IPO 更现实。最终尽调议程很直接：核验 AI
              分母、核验利润率结构、核验股权结构表、核验新的价格发现。如果这些项目过关，公司可以从继续研究升级为价格敏感的可投资买入；如果不能，2022 年过期估值应被视为历史，而不是公允价值。
