    rows:
      - - FERPA 学校官员控制与再披露
        - 学校只能在直接控制和限用途规则下与供应商共享教育记录数据；一旦控制失效，大学信任会很快受损。
        - 现行联邦规则体系
        - 中
        - 关键
        - Handshake 声称符合 FERPA；学校可使用投诉和合同机制。
        - 高，因为合作伙伴合同和实际控制措施未公开。
        - 审查学校 DPA、审计权、再披露条款和事件处置手册。
      - - CCPA / CPRA 消费者与应用隐私义务
        - Handshake 运营面向消费者的移动应用，因此在活跃执法环境下面临删除、选择退出、更正和敏感数据义务。
        - 现行加州法律
        - 中
        - 高
        - 已发布隐私政策和用户权利披露。
        - 中高，因为应用披露和移动追踪实践变化可能快于法律文本。
        - 测试请求流程、选择退出机制、保留周期和移动 SDK 治理。
      - - 欧盟 / 英国 / 瑞士传输问责
        - Handshake 称其用 DPF 机制处理国际传输，并继续对第三方代理失误承担责任。
        - 现行跨境框架
        - 低到中
        - 高
        - DPF 认证，以及将投诉转给 VeraSafe 的路径。
        - 中，因为继续传输控制和子处理方治理未公开。
        - 获取信任门户证据、子处理方清单和传输风险评估。
      - - AI 承包人分类与仲裁模式
        - Handshake AI 使用独立承包人协议、按项目付费和背景调查，而 DOL 指引强调实际做法重于合同标签。
        - 现行劳动法敞口
        - 中
        - 高
        - 书面承包人协议、项目条款和仲裁条款。
        - 中高，因为分类事实、薪酬水平和监督强度未公开。
        - 按司法辖区审查 fellow 薪酬数据、监督规则、审计和分类备忘录。
      - - 隐私安全与内容审核执法
        - FTC 和加州监管机构正积极执行隐私承诺；平台针对有害媒体的内容移除义务也在扩大。
        - 活跃监管背景
        - 低到中
        - 高
        - 安全页面、隐私政策、投诉渠道和审核工具。
        - 中，因为 Handshake 消息功能和用户生成互动可能逐步扩大合规义务。
        - 梳理审核范围、滥用举报 SLA，以及对消息和媒体义务的法律解释。
    notes: 严重性排序反映当前对学校信任和平台连续性的下行影响，并不证明 Handshake 已遭遇特定执法行动。本表是基于法律页面和监管指引的部分公开风险登记视角。
