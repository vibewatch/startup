  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手
      - 品类
      - 规模 / 融资
      - 目标细分
      - 差异化
      - 局限
    rows:
      - - Handshake
        - 直接同业 / 高校职业网络
        - 20M 活跃学生和校友；1M 雇主；1,600+ 个官方合作关系
        - 高校、早期人才招聘方、学生和近期校友
        - 公开资料保留的美国校园分发足迹最大，且校内网络内可免费向雇主开放发布
        - 没有保留的公开标价；高校工作流层可被切换
      - - LinkedIn Hire / Recruiter
        - 既有招聘外壳
        - 公开在位者；自助 Hiring Pro 加上报价制 Recruiter 席位
        - 广义招聘团队、偶发招聘者、企业 TA
        - 智能体 AI、职位发布、自动化，并能跨既有招聘系统集成
        - 不是专门的校园职业工作流，校园定价也较间接
      - - Symplicity Recruit
        - 直接学校工作流在位者
        - 6M+ 学生；600K+ 活跃雇主；500+ 所机构
        - 运行结构化校园工作流的职业中心和雇主
        - 公开校园定价、活动、面试、简历库，以及强信任叙事
        - 消费端网络流动性弱于 Handshake 的开放网络品牌
      - - RippleMatch
        - 直接 AI 匹配同业
        - 私营公司；宣称促成数十万次候选人面试
        - 想要技能验证和更快筛选的早期职业招聘团队
        - 校园招聘 OS、ATS 集成、经验证技能、面向 AI 的人才定位
        - 公开定价不透明，保留页面显示的高校工作流深度更薄
      - - 12twenty
        - 直接学校工作流同业
        - 5M 学生和校友；350K+ 雇主；4,000 个顶尖高校项目
        - 高校职业中心，以及招聘 MBA、本科生和法学院人才的雇主
        - 深度学校工作流、招聘智能，以及广泛的虚拟活动分发
        - 保留的公开页面仍以预约演示为主导
      - - Untapped
        - 相邻小众同业
        - 近 1M 可搜索档案；DEI 分析；宣称 70% 求职者来自代表性不足群体
        - 优先考虑多元早期人才寻源和分析的团队
        - 自报多元数据、75+ 个筛选条件、活动管理和 DEI 基准
        - 品牌和学校分发叙事比 Handshake 更窄
      - - iCIMS 高校招聘
        - 相邻 ATS 进入者
        - 公开企业 ATS 供应商；大学招聘是一个业务需求模块
        - 把既有 ATS 和 CRM 栈延伸到校园招聘的企业
        - 目标院校人才管道、活动、短信招聘，以及更宽 ATS 外壳内的职位营销
        - 没有公开的学生端网络或校园社区品牌
      - - SmartRecruiters
        - 潜在进入者 / 相邻 ATS 套件
        - 4,000+ 客户；公开 Essential 层起价 $14,995
        - 至少 50 名员工且招聘需求量较大的组织
        - ATS、AI 匹配、筛选、排期、入职和大批量招聘整合在一个平台
        - 先是企业 ATS；并非原生高校职业网络
      - - 职业中心 + ATS + 招聘网站
        - 现状 / 内部拼装替代
        - 已有预算内工具栈，而不是单独采购供应商
        - 愿意把现有工具拼起来的雇主和学校
        - 不增加软件支出，也能靠招聘会、职业页面、ATS 工具和社交渠道寻源
        - 报告分散、跨校触达更弱、人工协调更多
    notes: 各行混合了直接同业、在位者、相邻 ATS 套件和内部拼装替代，因为买方常把 Handshake 和一整套工作流工具比较，而不只是和另一个校园网络比较。
