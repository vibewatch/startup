      - number: '1.4'
        title: 里程碑、AI 转向、合作伙伴与反向信号
        blocks:
          - type: paragraph
            body: >-
              2024 年之后，Handshake 的公开时间线变得更有意思，因为公司的重心似乎从经典早期职业招聘软件转向 AI 导向的劳动力和工具。Handshake AI 于 2025 年 3 月推出；到 2025
              年底，公司开始发布新的雇主功能，围绕品牌展示、工作流效率，并最终延伸到 2026 年春季的「Hiring Intelligence」和实时洞察产品。2026 年 1 月收购 Taro 和 Cleanlab
              强化了这条路径：Taro 加深了触达前沿实验室所需工程师的能力，Cleanlab 则补上研究、评估和数据质量能力。VEDP 2025 年合作说明传统机构渠道仍然重要，USC/JMU
              客户页也确认，即便叙事在扩张，Handshake 仍嵌在高校工作流里。这次转型的反向面是真实的，不是假设。TechCrunch 和 Sacra 都报道，2025 年底裁减约 96 至 100
              个岗位；TechCrunch 将裁员与招聘业务职能和 650 人美国员工队伍联系起来。与此同时，Handshake 自己的 2026 年劳动力市场数据显示，平台上的 AI
              需求快速上升，学生悲观情绪仍然较高。第一章判断因此是：Handshake 仍有耐久的分发护城河，但最新增长故事已经离不开 AI 转型，也离不开这次转型带来的披露缺口。
