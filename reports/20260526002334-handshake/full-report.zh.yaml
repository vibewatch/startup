  - id: FU002
    title: 采用 / 部署流程
    type: flow
    layout: wide
    summary: Handshake 可见部署流程从校园采用开始，进入学生激活，再走向雇主获取、申请强度提升，最后扩展高级产品。
    data:
      nodes:
        - id: n1
          label: 学校采用 Handshake
          type: input
          detail: 院校购买或标准化该平台，用于职位、活动、预约和报告。
        - id: n2
          label: 学生建立档案并互动
          type: process
          detail: 学生搜索职位和实习，注册活动，并变得可被雇主搜索。
        - id: n3
          label: 雇主免费发布或发消息
          type: process
          detail: 以免费为主的雇主群测试该渠道，并通过校园工作流触达早期人才队列。
        - id: n4
          label: 申请强度提升
          type: process
          detail: 职位发布量可能下降，但申请强度会上升，尤其是在实习和小雇主招聘中。
        - id: n5
          label: AI 需求和分析产品扩张
          type: process
          detail: AI 标记职位增加，Handshake 向大型雇主营销活动、品牌、洞察和 AI 启用产品。
        - id: n6
          label: 续约、扩张或切走
          type: output
          detail: 结果取决于学校工作流价值、雇主 ROI，以及信任、定价或支持摩擦是否破坏关系。
      edges:
