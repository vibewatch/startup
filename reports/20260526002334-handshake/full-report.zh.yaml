      - number: '7.3'
        title: 运营、产品及信任与安全风险
        blocks:
          - type: paragraph
            body: >-
              从运营看，Handshake 最大风险不是欺诈泛滥，而是平台必须把欺诈维持在少数，同时服务一个庞大的双边网络；学校对这个网络的安全期待高于通用招聘网站。Handshake
              自己的信任与安全披露显示，恶意行为者确实会出现在网络上，学校仍要花大量时间审核雇主，内部团队和自动化检查也长期承担审核负担。这个负担又与产品质量相交。公开应用商店列表显示移动端分发规模很大，但 Google
              Play 投诉指向无关的招聘人员触达、筛选能力弱，以及体验里 AI 任务招揽带来的挫败感。这些投诉只是轶事，却有方向性意义，因为学校信任部分取决于学生体验。2025
              年裁员又带来单独的执行担忧：如果招聘业务流失人才，同时 Handshake 扩张赞助职位和 AI 项目，公司可能难以维持筛查质量、快速修复匹配问题，并守住学校期待的职业网络供应商可靠性。
