        title: 展示材料
        blocks:
          - type: callout
            title: 建议：在价格或证据变化前继续研究
            body: Handshake 仍有战略重要性，但公开记录不足以支撑投资者带着信心按 2022 年过期估值付款。低于 $2B 的出清价格，或经审计证明净 AI 收入具备耐久性，会比更多泛泛的公司赞美更快改变判断。
            calloutType: recommendation
            claimRefs:
              - CV045
              - CV049
              - CV052
              - CV053
          - type: callout
            title: 冲突的收入基数是核心承销问题
            body: 同一个旧的 $3.5B 标题，在 $172M-$190M 的 2024 年收入上可能显得荒谬；放在 $450M 净收入估计上则只是高溢价。在尽调弄清哪个分母真实之前，投资者应假设估值误差带很宽。
