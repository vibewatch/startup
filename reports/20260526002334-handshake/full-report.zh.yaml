  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: Handshake 的客户旅程以学校合作为锚点，随后靠学生激活和多半免费的雇主参与扩大，最后才进入高级版扩张或信任破裂。
    data:
      nodes:
        - id: inst
          label: 赢下院校合作伙伴
          description: Handshake 拿下就业中心或大学作为渠道锚点，由其管理机会、报告、活动和雇主访问。
        - id: activate
          label: 激活学生和校友
          description: 学生通过学校工作流和移动端获得职位、实习、预约、活动和策划内容。
        - id: supply
          label: 引入雇主
          description: 大多数雇主从免费职位发布、消息和活动参与开始，测试对早期人才受众的触达。
        - id: engage
          label: 提高市场活动度
          description: 申请、实习、招聘会和 AI 标记职位提高网络实用性，即使劳动力市场转冷也如此。
        - id: expand
          label: 向上销售高级工具
          description: 大型雇主可以增加品牌、活动、分析、支持、Hiring Intelligence、Promotions 或 Insights Pro。
        - id: risk
          label: 守住信任，否则被替换
          description: 留存取决于学校工作流价值，也取决于能否避开计费、职位质量、支持或欺诈相关的信任破裂。
    approximationNotes: 这是一条定性旅程，综合官方商业模式页面、客户案例和负面评价信号得出，而不是披露的漏斗看板。
