      - number: '2.2'
        title: 用多重视角估算市场规模
        blocks:
          - type: paragraph
            body: >-
              公开市场里没有干净的 Handshake TAM/SAM/SOM 框架，因此只能靠多个有证据支撑的视角估算。第一层是供给侧教育视角：NCES 显示，授予学位机构总在校生数 2022 年为 18.58
              million，较 2010 年 21.02 million 的峰值明显下降，并只预计温和恢复到 2026 年 19.81 million、2031 年 20.23 million。BLS 补上流量视角：2024
              年统计到 3.2 million 名近期高中毕业生，62.8% 升入大学，2024 年 1 月至 10 月之间有 1.2 million
              名近期本科毕业生进入近端劳动力池。第二层是软件支出。这里公开数字会因品类定义而明显分化：Mordor 估算 2026 年人才获取软件规模为 USD 10.95 billion，Global Market
              Insights 将该品类 2025 年规模放在 USD 11.5 billion，而 Fortune Business Insights 将更窄的招聘软件品类 2026 年规模定为 USD 3.74
              billion。这些数字不能互换。Handshake 没有占据整个 HR 堆栈，但它也不只是商品化招聘板。最能防守的 SAM 因而落在较窄招聘软件和更宽 TA 软件之间，锚定早期人才寻源、活动、面试和连接 ATS
              的工作流，而不是全套 HR 自动化。
