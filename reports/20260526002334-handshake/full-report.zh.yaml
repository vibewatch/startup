  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的风险栈
        blocks:
          - type: paragraph
            body: >-
              Handshake 已不再像一个狭窄的校园招聘市场。公开材料现在覆盖学校治理的学生数据、移动应用、企业 ATS 集成、赞助职位，以及与领先 AI 实验室合作的 Handshake AI
              承包商项目。更宽的业务面改变了风险排序。当前严重程度最高的敞口，是隐私和 FERPA 治理、可能损伤学校信心的信任与安全疏漏、Handshake AI
              内部的承包商分类和劳动合规敏感性、对学校和移动平台的依赖，以及早期职业招聘市场疲软。这些不是理论风险。Handshake 公开描述了复杂的数据共享和传输义务、仍要处理非零恶意行为者的欺诈筛查栈、关于无关触达和
              AI 招揽的产品投诉、2025 年招聘业务裁员，以及 2026 年赞助职位引擎——它把更像广告的商业化引入一个对信任敏感的学生网络。缓释措施确实存在，但主要是流程控制和伙伴信任，而不是硬结构隔离。
