      - number: '3.3'
        title: 切换成本、锁定效应，以及多平台并用为何削弱原始网络计数
        blocks:
          - type: paragraph
            body: >-
              Handshake 确实有切换成本，但成本集中在机构分发，而不是硬性排他。Illinois 和 Virginia Tech 客户页展示了 Handshake 可以如何深嵌校园职业服务运营，Handshake
              雇主页和职业中心页也强化了公司对 ATS 集成、报告和学校关系的价值理解。但 UT Austin 暴露了护城河的弱点：学校可以把官方职业管理工作流迁到 12twenty，同时仍告诉学生继续用 Handshake
              的开放网络找职位和实习。这就是典型的多平台并用。它意味着市场存在不等于拥有工作流。雇主侧同理：LinkedIn、iCIMS 和 SmartRecruiters 可以从已经有预算的邻近系统发起竞争，而
              RippleMatch 和 Untapped 可以作为匹配或分析层共存。含义是，Handshake 的原始计数会高估锁定效应，除非这些计数转化为工作流所有权和续约杠杆。
