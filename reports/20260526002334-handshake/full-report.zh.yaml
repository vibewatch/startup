            body: >-
              最好的公开采用证据不是一个披露的 MAU 指标，而是 Handshake 自己的网络趋势报告如何描述压力下的行为。2025 年，平台职位发布下降 15%，但每个职位申请量上升
              30%，指向的是用户竞争加剧，而不是市场活动疲弱。Internship Index 强化了这个判断：截至 2025 年 1 月，class-of-2025 学生中已有 41% 通过 Handshake
              至少申请过一份实习；相比之下，class-of-2023 学生到毕业时这一比例为 34%，而 2023 年 1 月到 2025 年 1 月实习发布量下降超过
              15%。与此同时，平台需求结构正在演变。Handshake class-of-2026 报告称，85% 的大四学生使用 AI，超过三分之一每天使用，超过 10% 的活跃实习提到 AI 关键词，带 AI
              语言的全职职位发布占比同比翻倍至 4.2%。重要的承销结论是，用户强度看起来有韧性，但学生在 Handshake 上遇到的市场更艰难、更偏 AI；这可以支撑相关性，也会抬高雇主预期和候选人体验风险。
