      - number: '6.5'
        title: 扩张逻辑清楚，但渠道依赖和采购摩擦是主要客户风险
        blocks:
          - type: paragraph
            body: >-
              Handshake 的扩张打法概念上很顺：先用庞大免费雇主池起量，保留院校控制权让学校继续分发平台，再把大型雇主增购到品牌、活动、分析和更新的 AI
              驱动产品。更不清楚的是，免费转付费动作效率如何，雇主开始付费后留存有多稳。最清晰的公开风险信号来自开放评论渠道，而不是官方材料。Trustpilot
              评论提到取消后仍计费、缺少实时支持、假职位担忧和技术摩擦，其中一名评论者称，Handshake 有价值只是因为大学要求用它招聘。Loyola Greyhound
              文章给出了同一问题的学生侧版本：职位看似仍开放、实际已经关闭，同时校园内明确讨论诈骗和幽灵职位。这些信号不能证明系统性失效，但确实指出了客户体验会在哪些地方变差。再叠加 Handshake
              自己的捆绑式、非排他学校合同，结果是一个按 logo 看很分散、却容易受工作流替代、采购怀疑和支持引发的信任侵蚀影响的渠道模型。
