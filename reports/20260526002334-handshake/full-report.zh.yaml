      - - 捆绑定价摩擦
        - Handshake 称其销售综合套餐，而不是按功能逐项销售模块
        - 捆绑逻辑能让部分学校采购更简单，但当买方想先做模块化试点或要求价格透明时，采购摩擦会上升
