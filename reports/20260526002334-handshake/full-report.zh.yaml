  - id: TV004
    title: 可比估值表
    columns:
      - 参照
      - 状态
      - 观察指标
      - 隐含倍数 / 估值背景
      - 意义
      - 关键限制
    rows:
      - - Handshake 2022 年 1 月 Series F
        - 已验证私募估值标记
        - 以 $3.5B 估值融资 $200M
        - 按彼此冲突的 2024 年收入代理指标为 18.4x-20.3x；按 Sacra 2026 年净收入估算为 7.8x
        - 这是当前投资者实际在决定是否承认的过时锚点
        - 零利率时代的旧价格，不是 2026 年新鲜出清事件
      - - Handshake 追踪数据冲突
        - 私募市场数据冲突
        - GetLatka 显示 2024 年收入 $172M；Sacra 则显示 2024 年收入 $190M、2026 年净收入 $450M
        - 同一家公司会显得极贵，还是只是有溢价，取决于哪个分母经得住尽调
        - 本行说明，分母选择几乎决定整场价格争论
        - 所有数字均来自第三方，并把历史收入与 AI 调整后的净收入估算混在一起
      - - Coursera
        - 公开可比公司
        - $779M EV、$779M LTM 收入、约 $1.52B 市值
        - 约 1.0x EV / 收入
        - 最接近的规模化公开学习平台，披露了盈利能力和收入质量
        - 业务组合更偏广义在线教育，招聘网络敞口较低
      - - Duolingo
        - 高溢价公开异常值
        - $964M LTM 收入和约 $4.97B 市值
        - 约 5.2x 追踪收入
        - 说明市场会为增长强、品牌强的稀缺教育平台支付什么价格
        - 消费者订阅模式与 Handshake 结构性不同
      - - ZipRecruiter
        - 公开招聘可比公司
        - $474M 2024 年收入和约 $257M 市值
        - 约 0.5x 收入
        - 招聘环境偏软时有用的招聘软件地板参照
        - 通用招聘平台，不是大学网络
      - - Chegg
        - 公开下行可比公司
        - $618M 2024 年收入和约 $174M 市值
        - 约 0.3x 收入
        - 显示教育资产一旦失去叙事支撑，市场折价会多么残酷
        - 消费者学习辅导模式不同于 Handshake 的雇主和 AI 组合
      - - Coursera-Udemy 合并
        - 并购先例
        - 2025 年 Q4 宣布 $2.5B 交易
        - 即便估值纪律收紧，学习科技仍出现大规模整合
        - 可作为战略价值和整合退出可能性的参照
        - 学习科技并购不等同于职业网络或 AI 劳动力市场并购
      - - 教育科技中位数
        - 行业基准
        - Finerva 称，截至 2024 年 Q4，收入倍数中位数为 1.6x
        - 广义行业锚点，远低于 Handshake 过时估值标记
        - 界定 Handshake 必须跑赢行业多少，才能支撑溢价
        - 行业倍数中位数不是公司专属交易
    notes: 可比组有意混合公开可比公司、私募估值标记和并购案例，用多重估值视角检验 Handshake 旧价格，而不是只选一个偏好的分母。
    enumerationScope:
