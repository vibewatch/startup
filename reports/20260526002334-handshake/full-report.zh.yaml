chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份定位、市场角色与运营足迹
        blocks:
          - type: paragraph
            body: >-
              Handshake 2026 年的官方表述，已经比许多投资人记得的校园招聘品牌宽得多。公司现在称自己是「AI 经济的职业网络」，并描述一个连接 20 million 知识工作者、1,600+ 所教育机构和 1
              million 家雇主的三边市场。这个定位很重要，因为它同时改变了可触达市场和商业模式：Handshake 不再只是高校招聘板，而是一个跨学生、校友、雇主、劳动力市场洞察和较新 AI
              相邻工作的分发层。雇主页和职业中心页也强化了这种扩张。雇主买的是品牌、定向、ATS 和工作流工具；机构买的是结果报告、雇主触达和移动优先的学生参与。城市层面的公开足迹证据足够：Handshake 总部在 San
              Francisco，并点名 New York、英国和 Bangalore 办公室；招聘页显示当前岗位覆盖 San Francisco、New York、London、India
              和美国远程岗位。主要提醒是，Handshake 自身描述现在把经典招聘软件、市场流动性和 AI 经济技能升级揉成一个故事，后续章节应把耐久的平台事实和较新的叙事扩张拆开看。
