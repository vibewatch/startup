            body: >-
              公开牵引很强，但公开经济性较混杂。官方页面和 LinkedIn 指向一个很大的市场：1 million 家雇主、1,500 到 1,600+ 所教育合作伙伴；2022 年报道记录了约 20 million 用户和
              $100 million 预期收入。新的 AI 业务随后改变了故事。Handshake 自己的 AI 招聘页称，公司把这条业务线从 2025 年的零做到了约 $1 billion 收入运行率，并且现在每月向
              30,000 多名个人支付约 $60 million。Sacra 的估算与这一说法方向一致，但也说明为什么收入质量比表观收入 暗示的更难承销：年化总收入可能约 $1.1
              billion，但扣除付款后的年化净收入可能更接近 $450 million，且 AI 重的收入结构看起来比传统招聘 SaaS 毛利率低得多。Handshake
              自有网络上的公开劳动力市场数据，对核心业务也不利。2025 年全职早期人才职位同比下降
              15%，每个岗位申请量持续攀升，职位发布仍低于疫情前水平。可能结果是，公司拥有惊人的总活动量和真实产品宽度，但利润率路径取决于低毛利 AI 服务停止挤压更高质量经常性招聘软件的速度。
