      - number: '7.5'
        title: 人员风险、监测指标和投资逻辑破裂触发点
        blocks:
          - type: paragraph
            body: >-
              缓释图景足以让公司仍有投资价值，但不足以取消硬监测。公开可见的缓释因素包括 FERPA
              合规声明、经审计的外部证明、正式隐私和投诉通道、雇主验证工作流，以及明确的反欺诈工具。同样重要的是仍然缺失的内容：信任门户之外的具名认证、公开学校数据处理条款、AI fellow
              的确切薪酬和分类数据，以及当前商业化有多少依赖赞助职位或 AI 任务的清晰披露。因此，投资者应设定具体杀单标准，而不是依赖信任。如果隐私或 FERPA
              事件让学校伙伴重新审视数据共享安排，如果应用质量和招聘人员相关性继续恶化，如果裁员后执行力削弱核心招聘产品而管理层又推进新商业化，或如果 ATS
              与移动平台依赖损害付费转化，投资逻辑就已经开始破裂。尽调议程应围绕隐私控制、供应商治理、承包商经济性、学校合同语言，以及信任、安全、法务和产品团队结构展开。
