        - 自助服务叠加企业合同的混合模式
        - 职位发布、寻源、AI 辅助，以及更宽的招聘外壳
        - 企业规模下的校园专属成本，以及 Recruiter 附加购的经济性
      - - Symplicity Recruit
        - 公开定价从每校每岗位 $55 起；Pro 起价 $329/月；Premium 定制
        - 透明入门层叠加定制 Premium
