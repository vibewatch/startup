      - number: '8.2'
        title: 上市、私募和并购可比交易都要求价格纪律
        blocks:
          - type: paragraph
            body: >-
              可比证据并不是说 Handshake 质量低，而是说估值举证责任很高。Finerva 的行业数据显示，edtech 收入倍数中位数在 2020 年末触及 7.2x 高点后，到 2024 年 Q4 已跌至约
              1.6x。除真正的优质资产外，上市可比公司仍然严苛：Coursera 约 1.0x EV/收入，ZipRecruiter 约 0.5x 收入，Chegg 约 0.3x 收入。Duolingo
              是明显的高溢价例外，约为过去十二个月收入的 5.2x，也正因此重要：即便这个集合中当前最好的上市教育平台，也仍远低于 Handshake 基于 2024 年收入代理值得出的 18.4x-20.3x
              过期倍数。私募和战略交易侧更宽容，但也不足以自动挽救旧估值。Solganick 报道的 $2.5B Coursera-Udemy 交易证明该类别仍有战略价值，Sacra 的 $450M
              净收入估计也展示了一条路径，让 Handshake 只显得昂贵而不是荒谬。但当前公开记录仍把 $3.5B 框定为乐观情景数字，而不是基准情景。
