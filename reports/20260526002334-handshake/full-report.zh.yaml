      - number: '7.2'
        title: 法律、监管和隐私风险
        blocks:
          - type: paragraph
            body: >-
              法律与监管敞口是最严重的一组，因为 Handshake
              嵌在学校数据流里，同时又推广面向消费者的移动应用和跨境服务。其政策称，公司收集并共享广泛类别的个人数据；候选人通知也显示，只要法律允许，公司愿意处理敏感信息、背景调查数据以及设备或消息元数据。FERPA
              很关键，因为合格学生控制教育记录数据披露，学校只有在供应商受学校直接机构控制、且不在授权目的之外再披露数据时，才能依据学校官员例外使用 Handshake 这样的供应商。CCPA 为 California
              居民增加删除、更正、退出和敏感数据限制；Handshake 的 DPF 通知也让欧盟、英国和瑞士数据传输义务继续处在 FTC 监督之下。执法背景也真实存在：FTC
              指引把责任与不准确的隐私承诺和薄弱安全绑定，California 正在与大型数字企业达成隐私案件和解，内容移除法律也在扩大托管或传输用户生成内容的平台义务。本次公开材料没有证明 Handshake
              遭遇特定执法行动，但合规面已经足够大，投资者应把没有公开案件视为扫描不完整，而不是健康证明。
