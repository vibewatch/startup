    title: 牛案 / 基准 / 熊案情景表
    columns:
      - 情景
      - 收入假设
      - 倍数假设
      - 隐含估值
      - 概率信号
      - 关键触发因素
    rows:
      - - 熊案
        - $175M-$200M 收入基准，接近彼此冲突的 2024 年公开代理指标
        - 3.0x-4.0x
        - $525M-$800M
        - 30%
        - AI 经济性未获验证，市场继续像估值承压的教育科技 / 招聘软件那样给 Handshake 定价
      - - 基准
        - $350M-$450M 净收入，AI 市场平台属性得到部分验证
        - 4.5x-6.0x
        - $1.6B-$2.7B
        - 50%
        - 尽调确认 AI 留存收入可观，但利润质量不足以支撑前十分位溢价
      - - 牛案
        - $450M-$500M 持久净收入，并有强抽成率和利润率证明
        - 7.0x-9.0x
        - $3.2B-$4.5B
        - 20%
        - 审计数据证明 AI 转向质量高，网络护城河配得上稀缺资产溢价
      - - 概率加权中枢
        - 公开证据情景的混合
        - 混合
        - $1.8B-$2.4B
        - 100%
        - 当前最佳估值重心低于过时的 2022 年估值标记
    notes: 情景测算不是预测，而是纪律工具：它显示旧价格需要多头假设，而不是基准假设。
