        - 大学校或大雇主规模下的实际年度支出
      - - RippleMatch
        - 保留的公开页面推动预约演示和客户故事，而不是给出标价
        - 报价制
        - 校园 OS、ATS 集成、技能验证、活动和招聘人员工作流工具
        - 净定价、模块打包和服务附加
      - - 12twenty
        - 保留的公开页面强调演示和产品中心，而不是标价
        - 报价制
        - 职业中心栈、招聘云、招聘智能和虚拟活动
        - 实际雇主套餐底价和全校企业定价
      - - Untapped
        - 保留的公开页面强调演示，以及定制化早期人才或 DEI 工作流
        - 报价制
        - 可搜索档案、活动、DEI 分析和候选人筛选
