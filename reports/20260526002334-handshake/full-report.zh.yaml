  - id: FP003
    title: Handshake 护城河 / 就绪度 KPI
    type: kpi
    layout: standard
    summary: Handshake 仍有最强的留存校园流动性证据，但报价驱动定价、大学工作流可切换，以及可见的多平台并用行为，都抬高了它的风险画像。
    approximationNotes: 这些标签是基于留存公开证据的分析判断。「强」代表当前优势清晰，「中等」代表优势真实但有条件，「弱」代表结构性限制，「高」代表严重竞争威胁。
    data:
      items:
        - label: 大学分发广度
          value: Strong
          note: 在对比组中，Handshake 仍披露了最广的留存美国院校覆盖。
        - label: 开放候选人流动性
          value: Strong
          note: 20M 活跃学生和校友，加上 1M 雇主，让 Handshake 拥有最强的留存公开流动性证据。
        - label: 公开定价透明度
          value: Weak
          note: Handshake 留存页面仍以预约演示为入口，而几个竞争对手已经发布定价锚点。
        - label: ATS 嵌入
          value: Moderate
          note: Handshake 接入 ATS 工作流，但 ATS 厂商和 RippleMatch 也在营销类似连接。
        - label: 学校工作流独占性
          value: At Risk
          note: UT Austin 表明，学校可以替换 Handshake 作为主记录系统，同时仍保留网络访问。
        - label: 信任姿态
          value: Strong
          note: FERPA 和就业中心安全信息仍是可信的买方面向信号。
        - label: 多平台并用风险
          value: High
          note: 学生、学校和雇主可以把 Handshake 和其他工具并用，而不是彻底放弃竞争产品。
        - label: 邻近外壳压力
          value: High
          note: LinkedIn 加上 ATS 套件，可以从已经获得预算的招聘方或 HR 工作流位置切入竞争。
