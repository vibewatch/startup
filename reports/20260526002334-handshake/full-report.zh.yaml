  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接同业、邻近套件与真实决策集
        blocks:
          - type: paragraph
            body: >-
              Handshake 不只是在和另一个学生网络比较。直接重叠的是 Symplicity、12twenty、RippleMatch 和 Untapped
              这类学校工作流和早期职业专家，它们各自卖的是同一件工作中的不同切片：连接高校、招聘方和早期职业人才。下一层竞争来自既有巨头和邻近系统。LinkedIn 已经掌握广泛的招聘预算，而 iCIMS 和
              SmartRecruiters 把既有 ATS 和企业招聘工作流延伸到高校招聘、活动和目标学校管道。现状替代方案也是真实的：雇主仍可以不买 Handshake 这个工作流记录系统，只靠职业中心关系、招聘会、ATS
              和通用招聘板运行。这一点很关键，因为 Handshake 发表过的最强证明是分发，不是排他性。它有很大的学校和雇主计数，但这个品类仍允许买方把替代方案拼起来，或把 Handshake
              当作一个渠道加入，而不是当作整个堆栈。
