      - number: '6.3'
        title: 具名证明在高等教育侧最强；雇主证明真实，但硬分母更少
        blocks:
          - type: paragraph
            body: >-
              Handshake 的具名客户证明在学校侧远强于雇主侧。Michigan 案例研究是生产部署带来运营收益的最清楚例子：该校从碎片化工具迁到 Handshake，把它作为中央学生—雇主系统；随后表示，第一年的
              Fall Career Expo 学生出席率更高、招聘人员到场创纪录，雇主参与也更多元。Carnegie Mellon 材料展示了另一个证明点——实施耐久性——因为学校建立了专门团队，先向雇主推出
              Handshake，再向学生推出，至今仍把学生导向 Handshake 链接资源。VCU 是公开样本中最强的耐久性参考：它自 2018 年起使用 Handshake，称平台每年支持 700
              多场活动和十多场招聘会，并把 First Destination Survey 回答率从约 30% 提升到 77% 归功于 Handshake 时代的工作流。Johns Hopkins 加入了一个当前激活视角，把
              Handshake 呈现为中心的 Life Design Lab hub，并告诉学生公开资料可被 300,000+ 家雇主发现。雇主侧证明存在，但更薄：Handshake 展示了与 L’Oréal 和
              Macy’s 的具名活动以及产品聚焦网络研讨会，但公开雇主证明仍更偏营销，而不是合同驱动。
