            body: >-
              情景分析说明了为什么建议是继续研究而非买入。悲观情景假设投资者最终按互相冲突的 2024 年收入代理值和仍疲软的早期职业市场给 Handshake 定价，价值只有约 $525M-$800M。基准情景给予管理层
              AI 转向的真实信用，并假设 Handshake 留存约 $350M-$450M 净收入，利润率体面但不顶级；这支撑约 $1.6B-$2.7B。乐观情景假设 Sacra
              的净收入口径方向正确，并且留存经济性应获得稀缺资产 7x-9x 倍数，价值抬升到约
              $3.2B-$4.5B，才最终与过期估值重合。换句话说：旧价格不是不可能，但它已经假设了乐观情景。今天更诚实的公开证据锚点，是概率加权后的 $1.8B-$2.4B
              重心。因此，正确立场是建设性但守纪律。Handshake 可能仍是高质量资产，但当前证据集还不足以说新投资者现在应按过期价格付款。
