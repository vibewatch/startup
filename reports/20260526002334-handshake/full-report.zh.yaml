      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              长期驱动因素是真实的。每个已审阅分析师数据集都显示，人才获取软件仍是增长品类；云交付主导新部署；买方越来越想要 AI 辅助的质量衡量，而不是粗暴堆申请量。2026
              年实习项目仍在扩张，大型雇主在一段疲弱期后也重新小幅上调应届生招聘。高校还面临更强压力，要证明毕业后 ROI，这抬高了能支撑结果叙事的职业技术工具的战略重要性。但短期约束至少同样重要。Strada
              发现学生使用和人脉拓展存在很大缺口，第一代大学生尤其明显，说明单靠软件部署补不上社会资本赤字。Inside Higher Ed 强调职业服务的资金限制和机构惯性。Deloitte 显示，Gen Z 深度接触
              AI，但也担心 AI 驱动的入门门槛和高等教育回报。劳动力市场背景比品类增长故事更弱：Handshake 称每个职位的申请量激增而职位创造滞后，iCIMS 显示岗位开放和招聘节奏不同步，NBC
              报道近期毕业生就业不足率较高，St. Louis Fed 显示近期大学毕业生失业率上升幅度比年长毕业生更剧烈。结果是一个结构相关性真实、但周期摩擦清楚的市场。
