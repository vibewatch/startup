      - number: '1.3'
        title: 资本历史、阶段与指标披露质量
        blocks:
          - type: paragraph
            body: >-
              融资历程是 Handshake 故事里最清楚的部分之一。公开和数据库来源一致显示，公司是一家私营 Series F 企业，最近一次披露的定价轮是 2022 年 1 月的 $200 million Series
              F，估值 $3.5 billion，由 Coatue 和 Valiant Peregrine 领投，深厚的既有财团参与。2021 年 Series E 也有类似支撑：$80 million，估值高于 $1.5
              billion，由 Lightspeed 和 Spark 联合领投，当时 Handshake 正在扩张虚拟招聘和国际化。Tracxn 的轮次历史补齐了从 2015 年种子轮到 2020 年 Series D
              的融资阶梯，并把累计融资放在约 $434 million；Sacra 将其四舍五入为约 $435 million。这足以支撑第一章资本史，但不足以支撑 2026 年估值尽调。最近一次官方 ARR
              信号也已经陈旧：2021 年报道称 Handshake 接近 $100 million ARR，但审阅到的 2025-2026
              年公司材料没有披露当前合并收入、招聘业务盈利能力或新的估值标记。员工数也同样不完整。Handshake 2021 年披露 500 名员工，但当前 2026 年公开数据只剩开放岗位、The Org 区间和
              Tracxn 法人实体快照等代理指标。
