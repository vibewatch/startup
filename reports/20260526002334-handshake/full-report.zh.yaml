  - id: TM004
    title: 增长驱动与约束表
    columns:
      - 因素
      - 方向
      - 证据
      - 时间
      - 对 Handshake 的影响
      - 尽调问题
    rows:
      - - 从速度转向招聘质量
        - 驱动
        - LinkedIn 称买方正重新转向质量，而不只是数量
        - 当前
        - 支撑高阶工作流和分析定位
        - Handshake 能向雇主提供多少招聘质量证明？
      - - AI 驱动的招聘工作流
        - 驱动
        - LinkedIn 和软件分析师都把 AI 与云采用视为品类主要驱动
        - 当前至中期
        - 支撑 ATS 集成、定向和衡量功能
        - Handshake 会把 AI 功能商业化，还是把它当成标配？
      - - 实习招聘韧性
        - 驱动
        - NACE 称雇主预计 2026 年实习生数量增加近 4%
        - 当前
        - 实习仍是雇主切入的强入口
        - 雇主收入中有多少由实习场景带动？
      - - 大雇主投入
        - 驱动
        - NACE 2026 年春季数据显示，员工数 >5,000 的公司把新毕业生招聘提高 8.7%
        - 当前
        - 企业早期职业团队仍是最强付款群体
        - Handshake 收入在大雇主中的集中度有多高？
      - - 高校 ROI 压力
        - 驱动
        - Inside Higher Ed 称高校面临越来越大压力，需要改善毕业后结果
        - 当前
        - 当就业能力被审视时，职业科技的重要性上升
        - Handshake 能否证明活动指标之外的结果？
      - - 学生社交和使用缺口
        - 约束
        - Strada 发现社交和简历帮助参与度低，第一代大学生尤其如此
        - 持续
        - 机构部署不保证市场流动性会真正活跃
        - 按学生细分看，哪些活跃使用队列存在？
      - - 近期毕业生劳动力市场疲弱
        - 约束
        - NBC 和 St. Louis Fed 显示近期毕业生失业率和就业不足率偏高
        - 当前
        - 雇主紧迫感下降、学生结果变差，都会削弱商业化质量
        - Handshake 雇主支出对各行业招聘放缓有多敏感？
      - - 申请拥堵和响应摩擦
        - 约束
        - Handshake 和 iCIMS 显示，每个职位的申请量增速快于招聘吞吐
        - 当前
        - 噪音增加会侵蚀学生和招聘方感知价值
        - Handshake 能证明响应率和面试率提升到什么程度？
    notes: 同一个市场可以战略重要，同时也有周期压力：品类软件支出在增长，但早期人才招聘、学生信心和响应质量仍然波动。
