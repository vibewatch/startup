      - number: '7.4'
        title: 合作伙伴、平台和模式组合风险
        blocks:
          - type: paragraph
            body: >-
              Handshake 的依赖结构层层叠加。分发层面，学生产品依赖 Apple 和 Google 应用商店，这意味着移动政策变化、商店评分下滑或隐私披露争议，都可能影响获客和品牌信任。企业层面，高级版价值绑定 ATS
              连接和分析能力，而这些能力被锁在更高价套餐里；一旦集成覆盖中断，最具商业意义的付费层转化就会变弱。信任与安全环节，Handshake 现在依靠 Sift、Google Web Risk
              等供应商自动化欺诈筛查。Handshake AI 内部，公司明确招募灵活的法律和网络安全专家来编写提示并评估模型输出，这加深了对第三方专家劳动力以及 AI
              实验室持续需求的依赖。商业上，公司进一步走向混合商业化。帮助中心定价显示，推广职位是低阶套餐的附加项；AIM Group 报道称，2026 年赞助职位引擎使用行为定向和 AI 匹配。这让 Handshake
              不再只是简单的招聘 SaaS 产品，而越来越像招聘工作流、付费分发和 AI 工作市场的混合体；任一支柱变弱，都会带来声誉和利润率问题。
