  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              Handshake 最适合被理解为一个三边的大学到职业网络，而不是泛泛的 HR tech
              供应商。在高校侧，平台以职业中心和学生事务团队的基础设施形式分发；在学生侧，它是免费的机会发现和互动界面；在雇主侧，它靠寻源、外联、活动和连接 ATS 的工作流变现。这意味着纳入的支出不是整个「HR
              tech」，而是招聘软件和服务中触达校园招聘、早期人才 CRM、候选人互动、雇主品牌发现，以及面试 / 活动编排的那一块。排除的支出同样重要：通用薪资和 HRIS
              系统、长尾派遣和临时劳动力，以及高等教育学费的大经济账，都无法干净映射到 Handshake 当前产品足迹。现状也高度碎片化。高校仍依赖招聘会、校园面试、顾问、校友网络和院系关系。雇主可以默认使用
              LinkedIn、Indeed、Glassdoor 或自有 ATS 页面。这组替代方案很关键，因为买方不必替换一个系统；除非 Handshake
              明确降低摩擦、改善早期人才结果，他们可以继续把传统线下渠道、招聘板和内部工作流拼在一起。
