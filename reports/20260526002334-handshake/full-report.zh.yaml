            body: >-
              当前运营信号指向混合 GTM 模式。Handshake 仍受益于学校合作和雇主免费进入，但开放岗位名单显示，收入机器比历史校园网络叙事更分层：企业、大中型市场、联邦、EMEA 和 SDR 覆盖都位于
              Employer Revenue 内部，而产品、增长运营、财务和全球支持岗位说明，公司正围绕多产品销售动作配置人员，而不是只靠纯自助漏斗。ATS
              集成、分析和基准产品等高级模块也强化了这一点：公司卖的不只是候选人触达，也卖协调、工作流和衡量。公开销售效率代理指标只具方向性，达不到财务级，但仍有意义。在 Handshake 自己的 CDW
              案例研究中，学校覆盖从 50 所扩到超过 500 所校园，雇主品牌认知度提升 5x，同时申请质量和消息打开表现改善。这说明 Handshake
              可以把校园分发转化为付费雇主可衡量的漏斗顶部提升。即便如此，同一证据仍是客户营销材料，不是经审计漏斗经济性，因此 CAC、回本周期和组合层面的留存仍是开放尽调项。
