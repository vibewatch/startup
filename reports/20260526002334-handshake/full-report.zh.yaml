      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              Handshake
              的采用逻辑取决于不同但相连的参与者。高校通常是机构冠军和信任层，但不像企业软件买方那样承担同等经济付款角色；客户页反复显示，学生会自动获得账户或免费使用，职业中心则用平台组织职位、实习、面试、招聘会和咨询。学生是市场的主要用户和供给侧，但有账户不等于自动活跃。雇主是被变现的一侧：Handshake
              自己的产品页强调免费增值路径，公司可以先用基础发帖起步，等到需要定向外联、更好分析和 ATS
              集成时再升级。当前最有韧性的雇主群体，似乎是更大的组织和实习项目，而不是较小、可自由削减的校园项目。招聘买方优先级也在变化。LinkedIn 2025
              年招聘调查显示，摆锤正从速度回到招聘质量，ROI、回应质量和工作流集成比泛泛的候选人触达更重要。对 Handshake
              而言，采用路径不只是「列学生、列职位、完成招聘」。它要穿过高校信任、学生资料完善、雇主免费发帖、招聘员升级，最后转化成可衡量的面试和结果。
