  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope in user-workflow terms
        blocks:
          - type: paragraph
            body: >-
              Handshake is no longer just a university job board. The retained 2026 public surface shows a four-part
              operating bundle: a student career network with mobile access, an employer recruiting workflow with paid
              ATS-connected upgrades, a career-center operating layer for profiles, appointments, fairs, and student
              data sync, and a newer Handshake AI business that routes expert labor and employer data into
              frontier-model development. The product definition matters because each module solves a different job in
              the same customer chain. Schools provision identity and student records, students discover opportunities
              and events, employers source and route applicants into their ATS, and Handshake AI converts the same
              network trust into expert validation, data partnerships, and paid task work. The public evidence also
              shows that Handshake is trying to keep those modules connected rather than independent: mobile surfaces
              mirror core web actions, career-center profile redesigns add AI-generated summaries, and student-facing
              updates now expose AI badges and Sidekick beta tools. The practical diligence read is that Handshake sells
              workflow coverage plus distribution, not just access to listings.
