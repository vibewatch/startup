  - id: TP001
    title: Competitor profile table
    columns:
      - Competitor
      - Category
      - Scale / funding
      - Target segment
      - Differentiation
      - Limitation
    rows:
      - - Handshake
        - Direct peer / university career network
        - 20M active students and alumni; 1M employers; 1,600+ official partnerships
        - Universities, early-talent recruiters, students and recent alumni
        - Largest retained U.S. campus distribution footprint plus free employer posting inside school network
        - No retained public list pricing; university workflow layer is switchable
      - - LinkedIn Hire / Recruiter
        - Incumbent recruiting shell
        - Public incumbent; self-serve Hiring Pro plus quote-led Recruiter seats
        - Broad recruiting teams, occasional hirers, enterprise TA
        - Agentic AI, job posts, automation, and integrations across existing hiring systems
        - Not a dedicated campus-career workflow and campus pricing is indirect
      - - Symplicity Recruit
        - Direct school-workflow incumbent
        - 6M+ students; 600K+ active employers; 500+ institutions
        - Career centers and employers running structured campus workflows
        - Public campus pricing, events, interviews, resume database, and strong trust messaging
        - Less consumer-network liquidity than Handshake's open-network brand
      - - RippleMatch
        - Direct AI matching peer
        - Private; hundreds of thousands of candidate interviews claimed
        - Early-career recruiting teams that want skills validation and faster screening
        - Campus Recruiting OS, ATS integrations, verified skills, AI-ready talent positioning
        - Public pricing is opaque and university workflow depth is thinner on retained pages
      - - 12twenty
        - Direct school-workflow peer
        - 5M students and alumni; 350K+ employers; 4,000 top university programs
        - University career centers, employers hiring MBAs, undergrads, and law-school talent
        - Deep school workflows, recruiting intelligence, and broad virtual-event distribution
        - Pricing remains demo-led on retained public pages
      - - Untapped
        - Adjacent niche peer
        - Nearly 1M searchable profiles; DEI analytics; 70% underrepresented job seekers claimed
        - Teams prioritizing diverse early-talent sourcing and analytics
        - Self-reported diversity data, 75+ filters, event management, and DEI benchmarks
        - Narrower brand and school-distribution story than Handshake
      - - iCIMS university recruiting
        - Adjacent ATS entrant
        - Public enterprise ATS vendor; university recruiting as one business-need module
        - Enterprises extending existing ATS and CRM stacks into campus recruiting
        - Target-school pipelines, events, text recruiting, and job marketing inside a broader ATS shell
        - No public student-facing network or campus-community brand
      - - SmartRecruiters
        - Likely entrant / adjacent ATS suite
        - 4,000+ customers; public Essential tier starts at $14,995
        - Organizations with at least 50 employees and significant requisition volume
        - ATS, AI matching, screening, scheduling, onboarding, and high-volume hiring in one platform
        - Corporate ATS first; not natively a university career network
      - - Career center + ATS + job boards
        - Status quo / internal build substitute
        - Already budgeted stack rather than a standalone vendor purchase
        - Employers and schools willing to stitch together current tools
        - Can source via fairs, career pages, ATS tools, and social channels without new software spend
        - Fragmented reporting, weaker cross-school reach, and more manual coordination
    notes: >-
      Rows mix direct peers, incumbents, adjacent ATS suites, and the internal-build substitute because buyers often
      compare Handshake against a workflow stack, not only against another campus network.
