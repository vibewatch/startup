  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / event
      - Transmission to thesis
      - Action implication
    rows:
      - - Fresh price reset
        - Tender, 409A, or priced round below ~$2B
        - Confirms the stale mark was too high and forces a lower underwriting starting point
        - Rebuild the case from the new clearing price instead of the 2022 headline
      - - Net-revenue shortfall
        - Audited retained revenue materially below ~$350M
        - Base-case scenario collapses and Handshake looks much closer to legacy recruiting/edtech comps
        - Move to bear-case math immediately
      - - Margin disappointment
        - AI take rate or contribution margin looks marketplace-thin rather than premium software-like
        - Bull multiple case disappears even if gross AI volume stays high
        - Refuse premium multiple underwriting
      - - Core market deterioration
        - Early-career postings keep falling while layoffs continue
        - Weakens employer willingness to pay and raises churn risk in the legacy network
        - Cut valuation band and de-emphasize IPO hopes
      - - Disclosure remains opaque
        - No audited segment financials or cap-table waterfall in diligence
        - Realized return could diverge sharply from enterprise value and blocks confident entry
        - Stay at research-more / track even if company quality remains high
    notes: Each kill trigger is monitorable and tied directly to valuation transmission rather than generic operating risk.
    claimRefs:
      - CV022
      - CV040
      - CV043
      - CV044
      - CV046
      - CV047
      - CV048
      - CV050
      - CV051
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Audited AI gross-to-net bridge
        - Quarterly and annual AI gross billings, payouts, and retained revenue
        - This is the single most important denominator for whether the old price is premium or implausible
        - Request audited management reporting and segment bridge
      - - Margin quality
        - Gross margin, contribution margin, and opex split between core recruiting and AI
        - Premium valuation only works if AI economics are materially better than pass-through labor economics
        - Request segment P&L and board KPI pack
      - - Fresh price discovery
        - Any 2025-2026 tender, 409A, broker quote, or priced round documentation
        - Current public evidence anchors on a stale 2022 round rather than a fresh market-clearing event
        - Request latest tender deck, 409A memo, or financing documents
      - - Cap table and preferences
        - Fully diluted ownership, liquidation stack, secondary rights, ROFR/ROFO, and side letters
        - Enterprise value can overstate realized investor return in down-round or strategic-sale cases
        - Request current cap table and waterfall
      - - Customer quality and retention
        - Paid employer retention, net revenue retention, concentration, and AI-customer churn
        - Shows whether the network moat really converts into durable cash flows
        - Request cohort tables and top-customer concentration schedule
      - - Restructuring and hiring plan
        - Late-2025 layoff details, 2026 hiring plan, and AI-vs-core resource allocation
        - Execution risk rises if the company is still reallocating around an unproven AI mix
        - Request people-plan summary and post-restructuring operating model
    notes: >-
      These asks are gating items, not polish; without them the investment case remains too dependent on third-party
      estimates and stale pricing anchors.
    claimRefs:
      - CV010
      - CV021
      - CV022
      - CV024
      - CV043
      - CV050
