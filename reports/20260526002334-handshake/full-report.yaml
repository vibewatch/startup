      - number: '8.4'
        title: Exit readiness, thesis-break triggers, and the final diligence asks
        blocks:
          - type: paragraph
            body: >-
              Public evidence does not describe Handshake as IPO-ready today. The company clearly has strategic
              relevance: the official AI pages show a large expert network, meaningful payout scale, and a product
              surface that now spans recruiting, AI work, and on-platform portfolio tools. But the same evidence set
              also shows why a public-market style underwrite is premature. We still do not have audited segment
              margins, a gross-to-net bridge for AI revenue, current financing terms, or a cap-table waterfall.
              Meanwhile, the downside evidence is concrete enough to matter: Handshake’s own data shows early-career job
              postings below pre-pandemic levels, and outside reporting points to 2025 layoffs as the company
              reallocated toward AI. That combination makes a secondary tender or strategic transaction feel more
              realistic than a near-term IPO. The final diligence agenda is therefore straightforward: verify the AI
              denominator, verify the margin structure, verify the cap table, and verify fresh price discovery. If those
              items clear, the company can graduate from research-more to an investable price-sensitive buy. If they do
              not, the stale 2022 mark should be treated as history rather than as fair value.
