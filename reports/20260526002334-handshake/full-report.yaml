  - id: TV004
    title: Comparable valuation table
    columns:
      - Reference
      - Status
      - Observed metric
      - Implied multiple / valuation context
      - Why it matters
      - Key limitation
    rows:
      - - Handshake Jan-2022 Series F
        - Verified private mark
        - $200M raised at $3.5B valuation
        - 18.4x-20.3x on the conflicting 2024 revenue proxies; 7.8x on Sacra’s 2026 net-revenue estimate
        - This is the stale anchor that current investors are implicitly deciding whether to honor
        - Old price from a zero-rate era and not a fresh 2026 clearing event
      - - Handshake tracker conflict
        - Private market-data conflict
        - GetLatka shows $172M 2024 revenue while Sacra shows $190M 2024 revenue and $450M 2026 net revenue
        - Same company can look extremely expensive or merely premium depending on which denominator survives diligence
        - This row shows why denominator choice drives almost the entire price debate
        - All figures are third-party and mix historical revenue with AI-adjusted net estimates
      - - Coursera
        - Public comp
        - $779M EV, $779M LTM revenue, ~$1.52B market cap
        - About 1.0x EV/revenue
        - Closest scaled public learning platform with disclosed profitability and revenue quality
        - Broader online education mix and less recruiter-network exposure
      - - Duolingo
        - Premium public outlier
        - $964M LTM revenue and ~$4.97B market cap
        - About 5.2x trailing revenue
        - Shows what the market will pay for a rare education platform with strong growth and brand
        - Consumer subscription model is structurally different from Handshake
      - - ZipRecruiter
        - Public recruiting comp
        - $474M 2024 revenue and ~$257M market cap
        - About 0.5x revenue
        - Useful recruiting-software floor for a softer hiring environment
        - Generalist jobs platform, not a university network
      - - Chegg
        - Public downside comp
        - $618M 2024 revenue and ~$174M market cap
        - About 0.3x revenue
        - Shows how brutally the market discounts education assets that lose narrative support
        - Consumer study-help model differs from Handshake’s employer and AI mix
      - - Coursera-Udemy merger
        - M&A precedent
        - $2.5B deal announced in Q4 2025
        - Large-scale consolidation in learning tech despite valuation discipline
        - Useful precedent for strategic value and the possibility of consolidation exits
        - Learning-tech M&A is not the same as career-network or AI-labor marketplace M&A
      - - EdTech median
        - Sector benchmark
