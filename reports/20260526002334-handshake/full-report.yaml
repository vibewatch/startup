  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, pricing, and revenue-mix visibility
        blocks:
          - type: paragraph
            body: >-
              Handshake’s public revenue architecture is much clearer than its audited economics. On the employer side,
              the company now discloses a true three-tier pricing ladder: a free Basic plan that keeps employer
              acquisition friction low, a Pro plan at $450 per month or $4,500 per year, and a sales-led Enterprise tier
              that layers on integrations, analytics, workflow automation, and support. That matters because it confirms
              Handshake is not just a campus job board; it is trying to monetize employer workflow, brand presence, and
              engagement intensity. On top of those subscription plans, Handshake markets promoted jobs and, according
              to AIM Group’s 2026 teaser, has launched a sponsored-jobs product using behavioral targeting and AI-driven
              matching. The bigger change is revenue mix. Official 2025-2026 company material says Handshake AI now
              works directly with frontier labs, buys employer data, and pays a massive monthly tasker base. That
              creates a second engine beyond traditional recruiting SaaS. The underwriting problem is that public
              pricing is detailed for employer plans but still opaque for school contracts, AI contracts, realized
              discounts, and payer mix, so public visibility is best on monetization design rather than on normalized
              realized revenue quality.
