      - number: '1.3'
        title: Capital history, stage, and metric disclosure quality
        blocks:
          - type: paragraph
            body: >-
              Capital formation is one of the clearest parts of the Handshake story. Public and database sources align
              that the company is a private Series F business whose last disclosed priced round was the January 2022
              $200 million Series F at a $3.5 billion valuation, led by Coatue and Valiant Peregrine with a deep
              existing syndicate participating. The 2021 Series E is similarly well supported: $80 million at a
              valuation above $1.5 billion, co-led by Lightspeed and Spark as Handshake scaled virtual recruiting and
              international expansion. Tracxn’s round history fills in the rest of the financing ladder from the 2015
              seed through the 2020 Series D and places total lifetime funding at roughly $434 million, while Sacra
              rounds that to about $435 million. That is good enough for chapter-one capital history but not for
              valuation underwriting in 2026. The last official ARR signal also remains stale: 2021 coverage said
              Handshake was nearing $100 million ARR, but no reviewed 2025-2026 company material discloses current
              consolidated revenue, recruiting-business profitability, or a fresh valuation mark. Headcount is similarly
              incomplete. Handshake disclosed 500 employees in 2021, but current 2026 public data is limited to proxies
              such as open roles, The Org’s band, and Tracxn legal-entity snapshots.
