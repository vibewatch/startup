companyProfile:
  summary: >-
    Handshake is a San Francisco-based, founder-led career network founded in 2014 that built a strong distribution
    wedge by becoming core workflow software for university career centers and a default destination for student and
    recent-graduate recruiting. Public evidence now supports a broader business than campus recruiting alone: the
    company still monetizes employer sourcing, premium branding, events, promoted jobs, and university workflows, but it
    is also pushing aggressively into Handshake AI services and data work tied to its academic network. The underwriting
    appeal is the network’s reach—20 million job seekers, 1,600+ institutions, and 1 million employers in current
    materials—plus durable venture backing and evidence of enterprise employer adoption. The core diligence challenge is
    that fresh valuation support, net-revenue quality, margins, and current liquidity remain much less transparent than
    the network and product narrative.
