  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct peers, adjacent suites, and the real decision set
        blocks:
          - type: paragraph
            body: >-
              Handshake is not being compared only against another student network. The direct overlaps are
              school-workflow and early-career specialists such as Symplicity, 12twenty, RippleMatch, and Untapped, each
              of which sells a different slice of the same job: connecting universities, recruiters, and early-career
              talent. The next layer of competition comes from incumbents and adjacent shells. LinkedIn already owns a
              broad recruiter budget, while iCIMS and SmartRecruiters extend existing ATS and enterprise hiring
              workflows into university recruiting, events, and target-school pipelines. The status-quo substitute is
              also real: an employer can still run career-center relationships, fairs, an ATS, and general job boards
              without buying Handshake as the workflow system of record. That matters because Handshake's strongest
              published proof is distribution, not exclusivity. It has large school and employer counts, but the
              category still allows buyers to stitch together alternatives or add Handshake as one channel rather than
              the entire stack.
