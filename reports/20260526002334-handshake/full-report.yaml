  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Substitutes
        blocks:
          - type: paragraph
            body: >-
              Handshake is best understood as a three-sided college-to-career network rather than a generic HR-tech
              vendor. On the university side, the platform is distributed as infrastructure for career centers and
              student affairs teams; on the student side, it is a free discovery and engagement surface; and on the
              employer side, it monetizes sourcing, outreach, events, and ATS-connected workflow. That means the
              included spend is not all of “HR tech,” but the slice of recruiting software and services that touches
              campus recruiting, early-talent CRM, candidate engagement, employer-brand discovery, and interview/event
              orchestration. The excluded spend is equally important: generic payroll and HRIS systems, long-tail
              staffing and temporary labor, and the broader economics of higher education tuition do not map cleanly to
              Handshake’s current product footprint. The status quo is also highly fragmented. Universities still rely
              on career fairs, on-campus interviews, advisers, alumni networks, and departmental relationships.
              Employers can default to LinkedIn, Indeed, Glassdoor, or their own ATS pages. That substitute bundle
              matters because buyers do not need to replace one system; they can keep combining legacy offline channels,
              job boards, and internal workflows unless Handshake clearly reduces friction and improves early-talent
              outcomes.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
