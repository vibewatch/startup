      - number: '6.3'
        title: Named proof is strongest in higher education; employer proof is real but lighter on hard denominators
        blocks:
          - type: paragraph
            body: >-
              Handshake’s named-customer proof is much better on the school side than on the employer side. Michigan’s
              case study is the clearest example of production deployment with operational benefit: the university moved
              from fragmented tooling into Handshake as a central student-employer system, then said its first-year Fall
              Career Expo saw higher student attendance, record recruiter turnout, and more diverse employer
              participation. Carnegie Mellon’s materials show a different proof point—implementation durability—because
              the university created a dedicated team, rolled Handshake out to employers first and students second, and
              still routes students through Handshake-linked resources today. VCU is the strongest durability reference
              in the public set: it has used Handshake since 2018, says the platform supports more than 700 sessions and
              more than a dozen fairs annually, and credits Handshake-era workflow with lifting First Destination Survey
              response from about 30% to 77%. Johns Hopkins adds a current activation lens, presenting Handshake as the
              central Life Design Lab hub and telling students that public profiles can be found by 300,000+ employers.
              Employer-side proof exists, but it is thinner: Handshake surfaces named sessions with L’Oréal and Macy’s
              plus product-spotlight webinars, yet public employer proof remains more marketing-led than contract-led.
