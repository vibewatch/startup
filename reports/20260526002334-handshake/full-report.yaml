      - number: '6.4'
        title: Durability is visible in school workflow longevity and app sentiment, but public retention math is missing
        blocks:
          - type: paragraph
            body: >-
              Public durability evidence is good enough to show real use, but not good enough to underwrite renewal
              economics. On the positive side, VCU’s long tenure since 2018, Michigan’s career-fair outcomes, Carnegie
              Mellon’s persistent workflow, and Johns Hopkins’ profile-activation instructions all suggest Handshake
              survives beyond pilot status once embedded inside a career office. Review surfaces add another layer.
              TrustRadius quotes from CoStar, Uber, and Fidelity describe measurable employer value: sourced applicants,
              strong open and click rates, wider candidate reach, and better diversity at the top of the funnel.
              FeaturedCustomers also aggregates a meaningful volume of customer references. Student-side sentiment looks
              even stronger on Apple’s app store, where Handshake holds a 4.9/5 score from 124K ratings. The problem is
              that none of those surfaces disclose NRR, GRR, churn, or renewal cohorts. Public evidence can therefore
              support the claim that users engage and some customers find value, but it cannot show how sticky paid
              employer spend or university contracts really are over time.
