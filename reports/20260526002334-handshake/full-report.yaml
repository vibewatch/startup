      - number: '2.2'
        title: Sizing the Market With Multiple Lenses
        blocks:
          - type: paragraph
            body: >-
              A clean Handshake TAM/SAM/SOM stack is not publicly available, so the market has to be sized through
              multiple evidence-backed lenses. The first is the supply-side education lens: NCES puts total
              degree-granting enrollment at 18.58 million in 2022, down materially from the 21.02 million peak in 2010,
              and projects only a modest recovery to 19.81 million in 2026 and 20.23 million in 2031. BLS adds the flow
              lens: 3.2 million recent high school graduates were counted in 2024, 62.8% enrolled in college, and 1.2
              million recent bachelor’s degree recipients entered the near-term labor pool between January and October
              2024. The second lens is software spend. Here the public numbers diverge sharply depending on category
              definition: Mordor sizes talent acquisition software at USD 10.95 billion in 2026, Global Market Insights
              puts the category at USD 11.5 billion in 2025, while Fortune Business Insights pegs the narrower
              recruitment-software category at USD 3.74 billion in 2026. Those are not interchangeable. Handshake does
              not own the whole HR stack, but it also does more than a commodity job board. The most defensible SAM
              therefore sits between narrow recruitment software and broader TA software, anchored specifically on
              early-talent sourcing, events, interviews, and ATS-linked workflow rather than full-suite HR automation.
