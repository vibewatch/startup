      - number: '6.5'
        title: Expansion logic is clear, but channel dependence and procurement friction are the main customer risks
        blocks:
          - type: paragraph
            body: >-
              Handshake’s expansion playbook is conceptually straightforward: start with a huge free employer base,
              preserve institutional control so schools keep distributing the platform, and upsell larger employers into
              branding, campaigns, analytics, and newer AI-driven products. What is less clear is how efficiently that
              free-to-paid motion converts or how durable it is once employers start paying. The clearest public risk
              signals come from open review surfaces, not official decks. Trustpilot reviews describe post-cancellation
              billing, lack of live support, fake-job concerns, and technical friction, including one reviewer who said
              Handshake mattered only because a university required it for recruiting. The Loyola Greyhound article adds
              a student-side version of the same problem: listings that appeared active but were already closed, paired
              with explicit campus discussion of fraud and ghost jobs. Those signals do not prove systemic failure, but
              they do show where customer experience can degrade. Combined with Handshake’s own bundled, nonexclusive
              school contracts, the result is a channel model that looks diffuse by logo yet vulnerable to workflow
              displacement, procurement skepticism, and support-driven trust erosion.
