      - number: '1.2'
        title: Founders, leadership depth, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              Handshake remains unmistakably founder-shaped. Garrett Lord is still the central public operator, and the
              company continues to present Ben Christensen and Scott Ringwelski as co-founders tied to a Michigan Tech
              origin story centered on widening access to opportunity beyond elite campus pipelines. Public leadership
              disclosure is stronger than public control disclosure. The official About page names a visible current
              executive bench—Jonathan Stull, Jesse Hulsing, Matt Greenberg, Dylan Lowrey, Christine Cruzvergara, Paco
              Guzmán, and others—suggesting Handshake has built functional depth across operations, finance, technology,
              legal, education partnerships, and AI research. Public board visibility is only partial. The
              marketing-facing board roster lists six outside directors, while Tracxn exposes a broader set of founders
              and executives as current board members. What matters for diligence is not which list is ‘more complete’
              but that neither source gives committee structure, board rights, investor vetoes, or cap-table control
              dynamics. That leaves a real governance gap for a late-stage private company. The founder bench is
              credible, the executive bench appears broader than in prior years, and the board includes recognizable
              investors and education-linked figures such as Michael Lomax, but the public record still does not reveal
              how control is actually exercised.
