              - CV049
              - CV052
              - CV053
          - type: callout
            title: Conflicting revenue bases are the core underwriting problem
            body: >-
              The same old $3.5B headline can look absurd on $172M-$190M of 2024 revenue or merely premium on a $450M
              net-revenue estimate. Until diligence settles which denominator is real, investors should assume wide
              valuation error bars.
            calloutType: risk
            claimRefs:
              - CV004
              - CV005
              - CV010
              - CV040
              - CV042
          - type: callout
            title: The bull case exists, but it is not the default case
            body: >-
              The AI pivot gives Handshake a believable path back into the old valuation neighborhood, but only if
              retained AI revenue, margins, and churn look much better than the public evidence currently proves.
            calloutType: insight
            claimRefs:
              - CV010
              - CV044
