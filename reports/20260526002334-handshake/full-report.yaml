      - number: '7.4'
        title: Partner, platform, and model-mix risk
        blocks:
          - type: paragraph
            body: >-
              Handshake's dependency profile is unusually layered. At the distribution level, the student product
              depends on Apple and Google app stores, which means mobile policy changes, store-rating deterioration, or
              privacy-disclosure controversy can affect both acquisition and brand trust. At the enterprise level,
              premium value is tied to ATS connectivity and analytics that are gated to higher-priced plans, so any
              disruption in integration coverage weakens conversion into the paid tiers that matter most commercially.
              Inside trust and safety, Handshake now relies on vendors such as Sift and Google Web Risk to automate
              fraud screening. Inside Handshake AI, the company is explicitly recruiting flexible legal and
              cybersecurity experts to create prompts and evaluate model outputs, which deepens dependence on
              third-party expert labor and on continued demand from AI labs. Commercially, the company has moved further
              into mixed monetization. Help-center pricing shows promoted jobs as an add-on for lower tiers, and AIM
              Group reports a 2026 sponsored-job engine using behavioral targeting and AI matching. That makes Handshake
              more than a simple recruiting SaaS product; it increasingly resembles a hybrid of recruiting workflow,
              paid distribution, and AI-work marketplace, which raises both reputational and margin questions if any one
              leg weakens.
