      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              The long-run drivers are real. Talent acquisition software remains a growing category in every analyst
              dataset reviewed, cloud delivery dominates new deployments, and buyers increasingly want AI-assisted
              quality measurement rather than brute-force application volume. Internship programs are still expanding in
              2026, and the largest employers are again nudging new-graduate hiring upward after a weak period.
              Universities also face stronger pressure to show postgraduate ROI, which raises the strategic importance
              of career-tech tools that can support outcomes narratives. But the short-run constraints are at least as
              important. Strada finds large usage and networking gaps among students, especially first-generation
              students, suggesting software deployment alone does not close social-capital deficits. Inside Higher Ed
              highlights funding limits and institutional inertia in career services. Deloitte shows that Gen Z is
              deeply engaged with AI but also worried about AI-driven entry barriers and the return on higher education.
              The labor market backdrop is weaker than the category-growth story suggests: Handshake says applications
              per job are surging while job creation lags, iCIMS shows openings and hiring are moving out of sync, NBC
              reports high recent-grad underemployment, and the St. Louis Fed shows recent college graduates have
              suffered a sharper unemployment increase than older grads. The result is a market with real structural
              relevance but clear cyclical friction.
