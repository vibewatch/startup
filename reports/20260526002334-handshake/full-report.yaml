      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Boundary inflation is the central sizing risk
            body: >-
              Handshake can be framed against a roughly USD 11 billion talent-acquisition software market or a much
              smaller roughly USD 3.7 billion recruitment-software market. The difference is category definition, not
              measurement precision. Any valuation case that assumes the broader figure should explain exactly how
              campus recruiting, events, ATS workflow, and employer monetization expand beyond Handshake’s current
              niche.
