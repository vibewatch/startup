  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segmentation is three-sided, and universities still anchor the channel
        blocks:
          - type: paragraph
            body: >-
              Handshake’s customer base is not a normal SaaS logo list. The public company narrative is explicitly
              three-sided: universities and career centers anchor the institutional side, students and alumni create the
              demand-side liquidity, and employers supply jobs, events, and recruiting spend. The scale claims are large
              enough to matter—20 million users, 1,600+ educational institutions, and 1 million employers on current
              flagship pages—but the monetization design is more revealing than the topline counts. Handshake’s own UK
              business-model page says students use the product for free, about 98% of employers still use core services
              at no cost, and monetization comes from universities plus premium employer features such as branding,
              campaigns, analytics, and extra support. That means customer quality depends less on a handful of giant
              accounts than on keeping institutions convinced that Handshake should remain the system-of-record channel
