            title: Deployment does not solve the engagement gap
            body: >-
              University coverage and default account creation help distribution, but Strada and recent market data show
              that many students still underuse networking and career services while employers face a congested,
              slower-converting hiring environment. The real diligence question is not whether Handshake is present on
              campuses, but whether it produces higher-quality engagement and outcomes than the substitute bundle.
