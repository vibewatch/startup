      - number: '3.2'
        title: Capability breadth, pricing visibility, and where Handshake is easier or harder to benchmark
        blocks:
          - type: paragraph
            body: >-
              Capability breadth is not the core issue for Handshake. Its retained public pages show employer workflows,
              ATS integrations, school reporting, and security posture that make it legible to both recruiters and
              career centers. The harder comparison is economic and structural. Handshake stays demo-led on retained
              public pages, while LinkedIn Hiring Pro, Symplicity, and SmartRecruiters all expose at least some public
              price mechanics or entry tiers. That matters because transparent anchors shape procurement expectations
              before enterprise discounting begins. Capability depth also differs by competitor class. Symplicity and
              12twenty go deepest into university workflow operations. RippleMatch and Untapped emphasize verified
              signal, AI-ready talent, or diversity analytics. LinkedIn and ATS suites bring the advantage of
              already-funded recruiter shells and adjacent workflow ownership. In other words, Handshake competes best
              where a buyer wants a broad early-career network that still plugs into the rest of the hiring stack, and
              less well where the buyer wants the entire system of record or a pre-anchored public price point.
