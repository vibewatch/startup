      - number: '7.5'
        title: People risk, monitoring indicators, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The mitigation picture is good enough to keep the company investable, but not good enough to remove the
              need for hard monitoring. Publicly visible mitigants include FERPA-compliance claims, audited external
              attestations, formal privacy and complaint paths, employer validation workflows, and explicit anti-fraud
              tooling. What is still missing is just as important: named certifications outside the trust portal, public
              school data-processing terms, exact AI-fellow compensation and classification data, and clean disclosure
              on how much of current monetization depends on sponsored jobs or AI tasking. Investors should therefore
              define concrete kill criteria rather than rely on trust. A thesis break is underway if a privacy or FERPA
              incident causes school partners to revisit data-sharing arrangements, if app quality and recruiter
              relevance keep deteriorating, if post-layoff execution weakens the core recruiting product while
              management pushes into newer monetization, or if ATS and mobile-platform dependencies impair paid
              conversion. The diligence agenda should center on privacy controls, vendor governance, contractor
              economics, school contract language, and team structure across trust, safety, legal, and product.
