      - number: '1.4'
        title: Milestones, AI pivot, partnerships, and adverse markers
        blocks:
          - type: paragraph
            body: >-
              Handshake’s public chronology becomes much more interesting after 2024 because the company’s center of
              gravity appears to shift from classic early-career recruiting software toward AI-oriented labor and
              tooling. Handshake AI launched in March 2025, and by late 2025 the company was shipping new employer
              features tied to brand surfaces, workflow efficiency, and eventually spring-2026 ‘Hiring Intelligence’ and
              real-time insight products. The Taro and Cleanlab acquisitions in January 2026 reinforce that trajectory:
              Taro deepens access to engineers for frontier labs, while Cleanlab adds research, evaluation, and
              data-quality capability. VEDP’s 2025 partnership shows the legacy institutional channel still matters, and
              USC/JMU customer pages confirm Handshake remains embedded in university workflows even as the narrative
              expands. The adverse side of this transition is real, not hypothetical. TechCrunch and Sacra both report
              late-2025 workforce reductions of roughly 96 to 100 roles, with TechCrunch tying the cuts to
              recruiting-business functions and a 650-person U.S. workforce. In parallel, Handshake’s own 2026
              labor-market data shows AI demand rising quickly on-platform and student pessimism remaining elevated. The
              resulting chapter-one judgment is that Handshake still has a durable distribution moat, but its newest
              growth story is now inseparable from the AI transition—and from the disclosure gaps that transition
              creates.
