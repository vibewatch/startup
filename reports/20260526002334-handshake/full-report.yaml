  - id: TM004
    title: Growth drivers and constraints table
    columns:
      - Factor
      - Direction
      - Evidence
      - Timing
      - Implication for Handshake
      - Diligence ask
    rows:
      - - Shift from speed to quality of hire
        - Driver
        - LinkedIn says buyers are swinging back toward quality, not just volume
        - Current
        - Supports premium workflow and analytics positioning
        - How much quality-of-hire proof does Handshake provide to employers?
      - - AI-enabled recruiting workflows
        - Driver
        - LinkedIn and software analysts point to AI and cloud adoption as major category drivers
        - Current to medium term
        - Supports ATS integration, targeting, and measurement features
        - Does Handshake monetize AI features or treat them as table stakes?
      - - Internship hiring resilience
        - Driver
        - NACE says employers expect nearly 4% more interns in 2026
        - Current
        - Internships remain a strong entry wedge for employers
        - What share of employer revenue is internship-led?
      - - Large-employer commitment
        - Driver
        - NACE spring 2026 shows firms with >5,000 employees raising new-grad hiring by 8.7%
        - Current
        - Enterprise early-careers teams remain the strongest payer cohort
        - How concentrated is Handshake revenue among large employers?
      - - University ROI pressure
        - Driver
        - Inside Higher Ed says institutions face growing pressure to improve postgraduate outcomes
        - Current
        - Career-tech relevance rises when employability is scrutinized
        - Can Handshake prove outcomes beyond activity metrics?
      - - Student networking and usage gaps
        - Constraint
        - Strada finds low networking and resume-help participation, especially for first-gen students
        - Ongoing
        - Institutional deployment does not guarantee active marketplace liquidity
        - What active-usage cohorts exist by student segment?
      - - Weak recent-grad labor market
        - Constraint
        - NBC and the St. Louis Fed show elevated unemployment and underemployment for recent grads
        - Current
        - Lower employer urgency and worse student outcomes can reduce monetization quality
        - How sensitive is Handshake employer spend to hiring slowdowns by industry?
      - - Application congestion and response friction
        - Constraint
        - Handshake and iCIMS show applications/job rising faster than hiring throughput
        - Current
        - More noise can erode perceived value for both students and recruiters
        - What response-rate and interview-rate improvements can Handshake prove?
    notes: >-
      The same market can be strategically important and cyclically difficult at once: category software spend is
      growing, but early-talent hiring, student confidence, and response quality remain volatile.
