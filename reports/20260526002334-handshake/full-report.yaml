  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk stack
        blocks:
          - type: paragraph
            body: >-
              Handshake no longer looks like a narrow campus recruiting marketplace. Public materials now span
              school-governed student data, mobile applications, enterprise ATS integrations, sponsored jobs, and a
              Handshake AI contractor program that works with leading AI labs. That broader surface changes the ranking.
              The highest-severity current exposures are privacy and FERPA governance, trust-and-safety misses that
              could damage school confidence, contractor-classification and labor-compliance sensitivity inside
              Handshake AI, dependence on schools and mobile platforms, and market softness in early-career hiring.
              These are not theoretical. Handshake publicly describes complex data-sharing and transfer obligations, a
              fraud-screening stack that still handles non-zero bad actors, product complaints about irrelevant outreach
              and AI solicitations, a 2025 layoff across the recruiting business, and a 2026 sponsored-job engine that
              introduces more ad-like monetization into a trust-sensitive student network. Mitigations are real, but
              they are mostly process controls and partner trust rather than hard structural insulation.
