      - number: '7.3'
        title: Operational, product, and trust-and-safety risk
        blocks:
          - type: paragraph
            body: >-
              Operationally, Handshake's biggest risk is not that fraud is rampant; it is that the platform must keep
              fraud rare while serving a massive two-sided network that schools expect to be safer than generic job
              boards. Handshake's own trust-and-safety disclosures show that bad actors do appear on the network, that
              schools still spend significant time vetting employers, and that internal teams and automated checks carry
              a continuous moderation burden. That burden intersects with product quality. Public app listings show
              large mobile distribution at scale, but Google Play complaints point to irrelevant recruiter outreach,
              weak filtering, and frustration with AI-task solicitations inside the experience. Those complaints are
              anecdotal, yet they are directionally important because school trust is partly downstream of student
              experience. The 2025 layoff adds a separate execution concern: if the recruiting business lost talent
              while Handshake simultaneously expanded sponsored jobs and AI programs, the company could struggle to
              maintain screening quality, fix matching issues quickly, and preserve the reliability schools expect from
              a career-network vendor.
