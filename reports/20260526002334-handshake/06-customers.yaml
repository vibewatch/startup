      "id": "adoption-and-usage-intensity",
      "title": "Adoption looks durable on engagement, even as the early-talent market gets more crowded",
      "body": "The best public adoption evidence is not a single disclosed MAU metric; it is the way Handshake’s own network-trends reports describe behavior under pressure. In 2025, job postings on the platform were down 15% while applications per job were up 30%, which points to heavier user competition rather than weak marketplace activity. The Internship Index strengthens that read: by January 2025, 41% of class-of-2025 students had already applied to at least one internship through Handshake versus 34% of class-of-2023 students by graduation, even as internship postings fell more than 15% from January 2023 to January 2025. Meanwhile, the platform’s demand mix is evolving. Handshake’s class-of-2026 report says 85% of seniors use AI, more than a third use it daily, more than 10% of active internships mention AI keywords, and the share of full-time postings with AI language doubled to 4.2% year over year. The important underwriting takeaway is that user intensity appears resilient, but the marketplace students meet on Handshake is getting tougher and more AI-skewed, which can support relevance while also raising employer-expectation and candidate-experience risk.",
