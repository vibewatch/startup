    "number": 6,
    "title": "Customers",
    "summary": "Public evidence shows Handshake’s customer base is broad but structurally unusual: universities remain the anchor paying channel, students and alumni use the product for free, and most employers appear to enter through a free tier before any premium upsell. Adoption proof is strongest on higher-education deployments such as Michigan, Carnegie Mellon, VCU, and Johns Hopkins, while durability proof is weakest on paid employer retention, where strong sourcing reviews coexist with open-review complaints about billing, support, and trust."
  },
  "sections": [
    {
      "id": "three-sided-customer-mix",
      "title": "Customer segmentation is three-sided, and universities still anchor the channel",
      "body": "Handshake’s customer base is not a normal SaaS logo list. The public company narrative is explicitly three-sided: universities and career centers anchor the institutional side, students and alumni create the demand-side liquidity, and employers supply jobs, events, and recruiting spend. The scale claims are large enough to matter—20 million users, 1,600+ educational institutions, and 1 million employers on current flagship pages—but the monetization design is more revealing than the topline counts. Handshake’s own UK business-model page says students use the product for free, about 98% of employers still use core services at no cost, and monetization comes from universities plus premium employer features such as branding, campaigns, analytics, and extra support. That means customer quality depends less on a handful of giant accounts than on keeping institutions convinced that Handshake should remain the system-of-record channel through which students, employers, and staff meet. The career-center page’s mix of top four-year schools, community colleges, HBCUs, and MSIs shows that the institutional footprint is broad, but it also underscores how central campus partnerships are to the whole flywheel.",
