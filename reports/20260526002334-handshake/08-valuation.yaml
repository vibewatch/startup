    {
      "id": "scenario-ranges-and-recommendation",
      "title": "Bull, base, and bear scenarios point to a research-more recommendation",
      "body": "Scenario analysis clarifies why the recommendation is research-more rather than buy. The bear case assumes investors ultimately value Handshake against the conflicting 2024 revenue proxies and a still-soft early-career market, which yields only about $525M-$800M of value. The base case gives management real credit for the AI pivot and assumes Handshake retains about $350M-$450M of net revenue with respectable but not elite margins; that supports roughly $1.6B-$2.7B. The bull case assumes Sacra’s net-revenue framing is directionally right and that the retained economics deserve a rare-asset 7x-9x multiple, which lifts value into roughly $3.2B-$4.5B and finally overlaps the stale mark. Put differently: the old price is not impossible, but it already assumes the bull case. A probability-weighted center of gravity around $1.8B-$2.4B is the more honest public-evidence anchor today. That is why the right stance is constructive but disciplined. Handshake may still be a high-quality asset, but the current evidence set is not strong enough to say a new investor should pay the stale price now.",
