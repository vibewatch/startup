  "chapter": {
    "number": 8,
    "title": "Valuation",
    "summary": "Public evidence confirms Handshake’s stale January 2022 $3.5B mark and a real AI-driven strategic pivot, but it does not fully support paying that price today because the visible revenue base is contradictory ($172M vs. ~$190M for 2024) and the only route that makes the old mark look reasonable relies on an unverified 2026 net-revenue estimate. That mix supports a research-more recommendation, medium confidence, high risk, and a stretched valuation stance until diligence proves net revenue quality, margins, and fresh price discovery."
  },
  "sections": [
    {
      "id": "marks-and-price-support",
      "title": "Verified marks, conflicting denominators, and whether public evidence supports the old price",
      "body": "The core valuation fact is easy to verify and the core underwriting judgment is not. Handshake’s last clearly disclosed priced primary round is still the January 2022 Series F at a $3.5B valuation. Public trackers still cluster around roughly $434M of cumulative funding and do not show a fresher primary financing event, which means investors are implicitly deciding whether the old price still makes sense rather than relying on new market-clearing evidence. The problem is that the denominator is contradictory. GetLatka reports $172M of 2024 revenue, while Sacra estimates roughly $190M for 2024 and then jumps to a 2026 frame of about $1.1B gross revenue and $450M net revenue after contractor payouts. Those figures are directionally helpful, but they are not equivalent. On the 2024 revenue proxies, the stale mark implies roughly 18.4x-20.3x revenue; on Sacra’s 2026 net estimate it falls to roughly 7.8x. That gap is why the chapter cannot treat the 2022 price as self-validating. The old mark is only supportable if the AI pivot is real, durable, and retained at a much higher net revenue base than the currently verified 2024 numbers.",
