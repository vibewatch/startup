    {
      "id": "comparable-framing",
      "title": "Public, private, and M&A comparables argue for price discipline",
      "body": "Comparable evidence does not say Handshake is low quality; it says the valuation burden of proof is high. Sector data from Finerva shows median edtech revenue multiples collapsed to roughly 1.6x by Q4 2024 after peaking at 7.2x in late 2020. Public comps are still harsh outside true premium assets: Coursera trades around 1.0x EV/revenue, ZipRecruiter around 0.5x revenue, and Chegg around 0.3x revenue. Duolingo is the obvious premium outlier at roughly 5.2x trailing revenue, which is precisely why it matters: even the best current public education platform in this set still sits far below Handshake’s stale 18.4x-20.3x multiple on 2024 revenue proxies. The private and strategic side of the ledger is more forgiving but still not enough to rescue the old mark automatically. Solganick’s reported $2.5B Coursera-Udemy deal proves strategic value still exists in the category, and Sacra’s $450M net-revenue estimate shows one path that can make Handshake look merely expensive instead of absurd. But the current public record still frames $3.5B as a bull-case number, not a base-case one.",
