evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-rights
    missingEvidence: Current board committee roster, voting/control rights, reserved matters, and cap-table concentration.
    whyItMatters: >-
      Later-stage investors need to understand control, consent rights, and founder versus investor influence before
      underwriting governance risk.
    diligencePath: >-
      Request the latest board materials summary, investor rights agreement, and cap table with voting and protective
      provisions.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: current-financials
    missingEvidence: Current consolidated revenue, profitability, and core recruiting-business ARR segmented from Handshake AI.
    whyItMatters: >-
      The AI pivot may have changed revenue mix and margin profile enough that the last official 2021 ARR datapoint is
      no longer decision-useful.
    diligencePath: >-
      Request monthly recurring revenue, gross margin, and segment contribution for the recruiting business versus
      Handshake AI.
    relatedQuestionRefs:
      - QO016
      - QO025
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: current-headcount
    missingEvidence: >-
      A current consolidated employee count and a bridge from 2021 company headcount to 2024-2026 legal-entity or
      directory estimates.
    whyItMatters: >-
      Operating leverage, layoff severity, and AI-pivot execution are hard to judge when public employee numbers vary
      and official 2026 disclosure is absent.
    diligencePath: >-
      Request an org-level headcount snapshot by function and geography plus the net effect of 2025 layoffs and 2026 AI
      hiring.
    relatedQuestionRefs:
      - QO017
      - QO025
    relatedTableRefs:
      - TO001
  - type: stale
    severity: material
    topic: valuation-refresh
    missingEvidence: Any post-January-2022 primary or secondary valuation reference point.
    whyItMatters: >-
      The market has moved materially since the last disclosed $3.5B priced round, so the stale mark may overstate or
      understate current fair value.
    diligencePath: Request the latest internal 409A or board-approved fair value memo and any recent secondary-clearing data.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO001
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-chronology
    missingEvidence: >-
      A full internal chronology of product launches, leadership changes, and non-public partnerships before the 2025 AI
      pivot.
    whyItMatters: >-
      The public record is good enough for a chapter-one chronology but may omit internal milestones that matter for
      execution pacing and governance context.
    diligencePath: >-
      Ask management for a board-style company timeline with exact dates for product, financing, leadership, and M&A
      events.
    relatedQuestionRefs:
      - QO018
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: standalone-campus-recruiting-sam
    missingEvidence: >-
      A public, methodologically transparent standalone market size for campus recruiting, career-center CRM, or
      early-talent network software.
    whyItMatters: >-
      Without a clean category cut, TAM and SAM must be inferred from adjacent recruiting-software categories and
      student-pipeline proxies.
    diligencePath: >-
      Collect vendor comps, procurement records, and analyst taxonomy cuts that isolate campus recruiting or
      early-talent CRM from broader talent acquisition software.
    relatedQuestionRefs:
      - QM011
      - QM025
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: employer-contract-values
    missingEvidence: >-
      Public pricing bands, contract values, seat counts, or spend by employer segment for Handshake premium and
      ATS-integrated tiers.
    whyItMatters: >-
      Exact willingness to pay would materially sharpen SOM and payer segmentation instead of relying on free-to-paid
      workflow inference.
    diligencePath: >-
      Request sample contracts or procurement disclosures from employers and compare against adjacent
      recruiting-software benchmarks.
    relatedQuestionRefs:
      - QM015
      - QM018
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: active-student-engagement
    missingEvidence: >-
      Public active-user, response-rate, event-attendance, and conversion metrics by institution type and student
      segment.
    whyItMatters: >-
      Deployment does not equal usage; without engagement cohorts it is difficult to convert institutional coverage into
      active network utility.
    diligencePath: >-
      Request institution-level dashboards or anonymized cohort metrics from customers and compare with
      first-destination outcomes.
    relatedQuestionRefs:
      - QM019
      - QM024
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: minor
    topic: international-sam
    missingEvidence: >-
      A refreshed non-U.S. penetration and expansion dataset for Handshake by student population, employer coverage, and
      local substitutes.
    whyItMatters: >-
      International optionality is often implied in platform narratives, but the public evidence base here is thinner
      than for the U.S. market.
    diligencePath: >-
      Rebuild the geography lens using current country-level higher-ed and employer-market data plus confirmed local
      customer references.
    relatedQuestionRefs:
      - QM011
      - QM025
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: Current realized seat pricing, discounts, and renewal uplift for Handshake and direct peers.
    whyItMatters: >-
      Public list-price visibility is uneven, so the economic winner can shift materially once enterprise discounts are
      applied.
    diligencePath: >-
      Request current price cards, renewal cohorts, and discount corridors for Handshake, Symplicity, RippleMatch, and
      12twenty.
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: win-loss
    missingEvidence: Competitor-coded win-loss, school churn, and renewal reasons by segment.
    whyItMatters: >-
      Public customer logos and case studies do not reveal whether Handshake is winning new workflow ownership or simply
      coexisting through multi-homing.
    diligencePath: >-
      Request the last 12 months of school and employer win-loss data tagged by LinkedIn, Symplicity, 12twenty,
      RippleMatch, ATS suite, or status-quo internal build.
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: minor
    topic: usage-depth
    missingEvidence: >-
      Active user, application, event, and integration-usage depth by campus cohort rather than registered-account
      totals alone.
    whyItMatters: >-
      Network-size claims overstate lock-in if a meaningful share of activity happens off-platform or through other
      systems.
    diligencePath: >-
      Request MAU, application conversion, event attendance, and ATS-integration usage by school type and employer
      cohort.
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway
    missingEvidence: Current consolidated cash balance, monthly burn, and management runway scenarios.
    whyItMatters: >-
      Without cash and burn, capital adequacy and financing dependence cannot be underwritten even if fundraising
      history looks strong.
    diligencePath: Request monthly cash bridge, board materials on runway, and treasury policy by entity.
    relatedQuestionRefs:
      - QI012
      - QI025
    relatedTableRefs:
      - TI004
      - TI005
  - type: private-evidence-only
    severity: material
    topic: payer-mix
    missingEvidence: Revenue split across school contracts, employer subscriptions, ads, and AI products.
    whyItMatters: >-
