- id: architecture-and-integration-model
  title: Architecture, operating model, and integration surfaces
  body: 'The product architecture is legible from public docs even though Handshake does not publish a formal system diagram. On the education side, school data still enters through a fairly traditional operating model: write-only S3 directories for CSV imports, analyzer checks, and optional autorun scheduling, with the EDU API adding read-only institution-scoped access for downstream automation rather than replacing ingestion. On the employer side, ATS connectivity is the main extensibility surface. Handshake’s own docs gate ATS integrations to paid tiers, while the Greenhouse partner implementation shows the real mechanics: Harvest API permissions, a job-board API key, tracking links, and webhooks. Identity and access are similarly explicit. Handshake publishes SAML entity and assertion-consumer endpoints, while Okta lists Handshake with authentication and provisioning capabilities. The newer AI stack is only partially exposed, but the company’s own launch post and two 2026 RLE engineering
    roles describe in-house expert sourcing, annotation and evaluation systems, distributed backend services, PostgreSQL-backed data models, and AWS or GCP infrastructure. That is enough to outline a credible operating model, but not enough to validate internal reliability or data-rights economics in depth.'
