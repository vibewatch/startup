- id: FE002
  title: Product architecture map
  type: stack
  layout: wide
  summary: The public stack layers identity and trust, school data ingestion, user workflows, partner integrations, and a newer AI operating layer on top of the core career network.
  approximationNotes: Layers are grouped by public function, not by internal team or microservice boundary.
  data:
    layers:
    - id: identity
      label: Identity + trust layer
      detail: SAML, Okta provisioning, employer validation, phone verification, and scam controls govern who gets access.
    - id: ingestion
      label: Education data layer
      detail: Write-only S3 importer and beta EDU API move school records into and out of the platform.
    - id: workflow
      label: Workflow application layer
      detail: Student search, messaging, events, appointments, career-center views, and employer recruiting sit here.
    - id: integration
      label: Integration layer
      detail: ATS bridges rely on API keys, tracking links, and webhooks; external identity providers extend provisioning.
    - id: aiops
      label: AI operating layer
      detail: Handshake AI adds expert sourcing, annotation/evaluation systems, RLE platform work, and employer data partnerships.
    - id: payments
      label: Payments + policy layer
      detail: Privacy policy, Stripe-backed identity/payout flows, and support approval gates shape operational risk.
