tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Current status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Student career network + mobile app
    - Students and alumni
    - Mature public surface with iOS, Android, jobs, events, messaging, and appointments
    - Combines university-linked opportunity graph with social advice and event workflows
    - No public MAU, retention, or match-quality metrics
  - - Employer recruiting workflow
    - Recruiters and hiring teams
    - Mature, but integrations sit behind paid tiers
    - Early-career sourcing plus direct apply and interview-status visibility
    - Realized pricing, conversion, and renewal quality remain private
  - - Career-center operating layer
    - University career services
    - Mature core plus active 2026 UI refreshes
    - Student profiles, appointments, fairs, and school-linked records inside one system
    - No public admin-usage or school-retention cohort data
  - - EDU API + student sync tooling
    - University technical admins
    - 'Mixed maturity: importer is established; EDU API is still beta and read-only'
    - Institution-scoped automation plus large entity coverage
    - No public GA timeline or write-capable API path
  - - Identity / trust controls
    - Schools, employers, students, AI fellows
    - Mature policy and workflow surface
    - SAML, Okta listing, employer validation, phone verification, scam reporting, trust portal
    - Public docs emphasize process over measurable control outcomes
  - - Handshake AI task + data platform
    - AI labs, experts, employer data partners
    - Fast-growing but still operationally opaque
    - Uses verified academic network, expert validation, and operational-data sourcing instead of generic crowd work
    - No public benchmark set, contract economics, or customer concentration disclosure
  notes: Rows separate user-facing modules from enabling operating surfaces because Handshake now sells both recruiting workflow and AI-production infrastructure off the same network trust base.
