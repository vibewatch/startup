- id: deployment-reliability-and-release-cadence
  title: Deployment model, reliability signals, and release cadence
  body: 'Deployment and support evidence is stronger on integrations and feature rollout than on formal SRE metrics. The mobile help center confirms that core student actions from the web product also exist on iOS and Android, and the app-store surfaces suggest good consumer usability at the distribution layer. Release notes also show that Handshake is still shipping workflow changes in 2026: the March redesign of the career-center student profile, the May rename from ‘public’ resume to ‘visible to employers,’ the launch of AI badges, and Sidekick beta. Those updates suggest the product is still being tuned around profile visibility, counselor workflow, and AI-assisted career preparation. Reliability evidence is more mixed. The official status history is sparse, but external monitoring still records six outages in the last twelve months and a 40-minute April 2026 high-error-rate incident with login failures and upstream connection errors. That does not imply chronic instability, but it does
    mean Handshake’s public reliability surface is thinner than its public integration surface. Investors should treat status transparency as adequate for spotting incidents, not for underwriting uptime commitments or postmortem quality.'
