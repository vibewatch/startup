- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Handshake solution
  - Measurable benefit / signal
  - Limitation
  rows:
  - - Student finds early-career opportunities
    - Browse jobs, internships, and events across school and employer channels
    - Personalized recommendations, profile, deadlines, and mobile search
    - High app-store ratings and broad feature parity across web and mobile
    - Ratings do not prove active usage or job-match precision
  - - Student builds career capital
    - Read advice, attend fairs, network, message employers, book appointments
    - Events, posts, messaging, and career-center appointment flows in one app
    - The product joins opportunity discovery with guidance and school services
    - No public conversion metrics from advice or events to hires
  - - Career center provisions students
    - Send roster files, update records, review profile context, manage appointments
    - Write-only S3 importer, beta EDU API, redesigned student profile, AI-generated summary
    - Public docs show actual admin mechanics instead of pure marketing copy
    - Still no public write API or admin-efficiency benchmarks
  - - Employer routes campus applicants into recruiting stack
    - Post jobs, collect applications, move applicants through ATS stages
    - Direct-apply ATS integrations, screening-question import, tracking links, interview-status visibility
    - Greenhouse integration docs show concrete API and webhook plumbing
    - Integrations are not part of the free baseline product
  - - Expert earns money on AI projects
    - Verify identity, join projects, complete hourly or per-task work, receive payout
    - Handshake AI fellowship, Stripe-backed onboarding, weekly payout cycle, explicit pay policies
    - Public docs describe onboarding, payout timing, and compensation model
    - Independent reviews show at least some payment-dispute risk
  notes: This table follows the end-to-end user jobs visible in the retained public pack and separates proven workflow mechanics from unsupported outcome claims.
