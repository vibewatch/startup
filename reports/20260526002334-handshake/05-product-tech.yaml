  evidenceGaps:
  - type: missing-source
    severity: material
    topic: pricing-and-contract-visibility
    missingEvidence: Current school-contract pricing, employer attach rates, AI-customer contract duration, and actual integration usage metrics.
    whyItMatters: Public docs prove the workflow exists but do not show whether the paid surfaces convert efficiently or renew durably.
    diligencePath: Request current price cards, contract samples, integration attach by segment, and renewal cohorts for employer and school customers.
    relatedQuestionRefs:
    - QE022
    relatedTableRefs:
    - TE001
    - TE002
  - type: private-evidence-only
    severity: material
    topic: ai-unit-economics-and-benchmarks
    missingEvidence: Benchmark evidence showing how Handshake AI improves model quality, plus customer concentration, data-rights terms, and margin structure.
    whyItMatters: The AI business is now strategically central, but public materials do not prove whether its economics and quality outcomes are durable.
    diligencePath: Request customer list by cohort, benchmark artifacts, sample data-licensing terms, gross-margin bridge, and QA escalation metrics for AI projects.
    relatedQuestionRefs:
    - QE022
    - QE025
    relatedTableRefs:
    - TE001
    - TE004
  - type: stale
    severity: minor
    topic: security-certification-detail
    missingEvidence: A current public control map that names live certifications, audit dates, scope boundaries, and incident-response metrics.
    whyItMatters: Trust posture is a buyer criterion in education and recruiting, but the retained public pack is stronger on posture statements than on current audited detail.
    diligencePath: Pull trust-portal materials under NDA and request the most recent certification list, penetration-test summary, and security-review close-rate metrics.
    relatedQuestionRefs:
    - QE007
    - QE025
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: api-and-admin-maturity
    missingEvidence: A public or private roadmap for EDU API general availability, write capabilities, and migration away from importer-heavy school onboarding.
    whyItMatters: The current product story implies a modern platform, but school data operations still look partly legacy and support-gated.
    diligencePath: Ask product leadership for API roadmap slides, admin-adoption metrics, and school deployment case studies that quantify onboarding effort reduction.
    relatedQuestionRefs:
    - QE005
    - QE025
    relatedTableRefs:
    - TE003
    - TE005
  - type: access-blocked
    severity: minor
    topic: independent-product-quality
    missingEvidence: Large-scale independent B2B review distributions or audited NPS/CSAT metrics across schools, employers, and AI contributors.
    whyItMatters: App-store and Trustpilot surfaces are useful but skewed toward specific user groups and do not offer a balanced cohort-level quality read.
    diligencePath: Request internal NPS/CSAT by segment and collect broader independent review datasets from G2, Capterra, or customer references.
    relatedQuestionRefs:
    - QE011
    - QE023
    relatedTableRefs:
