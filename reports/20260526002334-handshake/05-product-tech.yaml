- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process / component
  - Role
  - Dependency
  - Risk
  rows:
  - - SAML / identity layer
    - Lets schools federate authentication into app.joinhandshake.com
    - Institution IdP plus Handshake SP endpoints; Okta catalog support
    - Public metadata exists, but deployment quality depends on each school configuration
  - - Employer validation and account integrity
    - Verifies employer legitimacy before posting and monitors fraud after verification
    - Persona plus Handshake fraud detection workflows
    - False negatives or slow review still create scam and abuse exposure
  - - School data ingestion
    - Loads student records into Handshake
    - Write-only AWS S3 directories, CSV analyzers, us-east-1 uploads, cron scheduling
    - Importer model is robust but operationally old-fashioned and admin-heavy
  - - EDU API
    - Exposes institution-scoped read access to applications, fairs, jobs, students, and related records
    - Developer portal, support approval, API key enablement
    - Beta status and read-only scope limit automation claims
  - - Employer ATS bridge
    - Moves jobs and applicants between Handshake and customer ATS
    - Handshake paid plans plus ATS-specific keys, tracking links, and webhooks
    - Integration value is real but partner- and tier-dependent
  - - Student mobile / web clients
    - Surface search, messaging, events, appointments, and profiles
    - App Store, Google Play, core web platform
    - Strong UX signals do not eliminate recommendation or reliability risk
  - - Handshake AI/RLE platform
    - Runs expert task workflows, annotation/evaluation systems, and AI-lab-facing tooling
    - Verified talent network, backend services, relational databases, cloud infra, payouts
    - Public architecture evidence comes mainly from hiring and launch posts, not formal engineering docs
  - - Payments and contractor onboarding
    - Handles KYC, tax, and payout flow for AI work
    - Stripe, third-party verification, partner pay platforms
    - Payment disputes could damage supply quality if controls misfire
  notes: The public architecture is reconstructed from technical docs, partner docs, and engineering hiring signals rather than from a first-party system diagram.
