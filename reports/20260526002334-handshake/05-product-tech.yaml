- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / metric
  - Status
  - Scope
  - Gap
  rows:
  - - FERPA posture
    - Explicitly marketed as compliant
    - Student data shared by educational partners and career-center workflows
    - Public page does not substitute for institution-specific data maps or contract terms
  - - Privacy policy + data rights
    - Live 2026 legal text
    - Students, contractors, employers, AI labs, and cross-border data transfers
    - Public policy states rights and processors but not product-by-product retention schedules
  - - Trust portal / external attestations
    - Publicly signposted
    - Buyer-facing security review process and compliance evidence
    - Current surface does not name every live certification in the retained pack
  - - Employer validation
    - Operational workflow documented
    - Government ID, company authorization, Persona, ongoing fraud monitoring
    - No public false-positive / false-negative statistics
  - - Phone verification
    - Required for non-school-created accounts
    - Student signup on web and mobile
    - No public data on how much abuse this blocks
  - - Scam reporting + detection
    - Operational workflow documented
    - Flagging fake employers, jobs, and suspicious messages
    - No public incident volume or mean-time-to-resolution data
  - - AI payout controls
    - Operational workflow documented
    - Weekly payout cadence, Stripe identity verification, project-term pay rules
    - Independent reviews suggest the process can still produce disputes
  - - Reliability transparency
    - Basic public surface exists
    - Status page plus third-party outage trackers
    - No public SLA and limited postmortem detail
  notes: The public control set is strongest on documented process and legal framing; it is weaker on externally auditable outcome metrics.
