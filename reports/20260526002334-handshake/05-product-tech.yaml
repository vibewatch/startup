- id: differentiation-and-trust-controls
  title: Differentiation, trust posture, and technology diligence gaps
  body: Handshake’s strongest product-tech differentiator is not a uniquely open developer ecosystem; it is a trusted distribution graph that now supports both recruiting workflows and AI labor supply. The AI launch material ties that edge to 1,500 university partners, 18 million students and alumni, verified academic credentials, and the ability to source specialists across nearly 200 subject areas. The trust layer is also broader than a generic privacy page. Handshake publicly markets FERPA compliance, a trust portal, employer validation through Persona, fraud detection and post-verification monitoring, phone verification for non-school signups, scam-reporting workflows, and Stripe-backed identity and payout controls for AI fellows. Those are real buyer-facing controls. The gap is that public evidence remains better at showing process than outcome. There is no public proof of AI model quality improvement, no disclosed write-API roadmap for schools, no current public SLA or deep RCA pack,
    and independent reviews still surface billing friction and at least one 2026 allegation of initially withheld AI pay. The diligence conclusion is that Handshake looks operationally broad and trust-aware, but still too opaque on AI economics, reliability detail, and paid-tier conversion quality to treat its public product story as fully underwritten.
