    {
      "id": "gtm-motion-and-sales-efficiency",
      "title": "GTM motion and sales-efficiency proxies",
      "body": "Current operating signals point to a hybrid go-to-market model. Handshake still benefits from school partnerships and free employer entry, but the open-roles roster shows a more segmented revenue machine than the historical campus-network narrative suggests: enterprise, mid-market, federal, EMEA, and SDR coverage all sit inside Employer Revenue, while product, growth operations, finance, and global support roles indicate the company is staffing around a multi-product selling motion rather than a purely self-serve funnel. Premium modules such as ATS integrations, analytics, and benchmark products reinforce that view: the company is selling coordination, workflow, and measurement as much as access to candidates. Public sales-efficiency proxies are directional rather than finance-grade, but they are meaningful. In Handshake\u2019s own CDW case study, school coverage expanded from 50 to more than 500 campuses and employer-brand awareness increased 5x alongside better applications and message-open performance. That suggests Handshake can translate its campus distribution into measurable top-of-funnel lift for paying employers. Still, the same evidence is customer-marketing material, not audited funnel economics, so CAC, payback, and portfolio-level retention remain open diligence items.",
