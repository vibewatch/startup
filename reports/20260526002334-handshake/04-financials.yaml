      "id": "cost-structure-margin-path-and-public-traction",
      "title": "Cost structure, margin path, and public traction versus private gaps",
      "body": "Public traction looks strong, but public economics look mixed. Official pages and LinkedIn point to a very large marketplace with 1 million employers and 1,500 to 1,600-plus educational partners, while 2022 coverage documented roughly 20 million users and $100 million of expected revenue. The new AI business has since changed the story. Handshake\u2019s own AI hiring page says the company grew that line from zero in 2025 to roughly a $1 billion run rate and now pays about $60 million per month to more than 30,000 individuals. Sacra\u2019s estimates are directionally consistent with that claim, but they also show why revenue quality is harder to underwrite than the topline implies: annualized gross revenue may be around $1.1 billion, yet annualized net revenue after payouts may be closer to $450 million, and the AI-heavy mix appears materially lower margin than legacy recruiting SaaS. Public labor-market data on Handshake\u2019s own network are also adverse for the core business. Full-time early-talent jobs were down 15% year over year in 2025, applications per role keep climbing, and postings remain below pre-pandemic levels. The likely result is a company with impressive gross activity and genuine product breadth, but a margin path that depends on how quickly lower-margin AI services stop crowding out higher-quality recurring recruiting software.",
