    {
      "id": "capital-adequacy-and-financial-verdict",
      "title": "Capital adequacy, financing dependence, and verdict",
      "body": "Handshake\u2019s historical fundraising is easy to document and its present liquidity is not. Public company profiles and 2022 reporting converge around roughly $430 million to $435 million of lifetime capital raised and a $200 million Series F at a $3.5 billion valuation. That proves substantial historical access to capital, but it does not answer the live question for investors: how much of that cash remains, what the current burn is, and whether the company can finance continued hiring and AI delivery without new outside money. The freshest financing clues in this run are not company press releases but 2026 SEC filings for Handshake-named SPVs. Scenic Co-Invest Handshake LLC and Odyssey Handshake I SPV, LP together reported nearly $79.6 million sold across April and May 2026, which points to continuing investor demand or liquidity activity around Handshake paper. Yet those filings do not disclose whether the operating company itself received the proceeds, whether they financed primary growth, or whether they simply supported secondary transactions. That leaves the final underwriting conclusion straightforward: revenue momentum is real, the product stack is broad, and capital access has historically been strong, but revenue quality, segment margin durability, and current financing dependence remain materially under-specified without a private data room containing segment P&Ls, cohort metrics, and a current cash bridge.",
