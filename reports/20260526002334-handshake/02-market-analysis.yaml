callouts:
- calloutType: insight
  title: Boundary inflation is the central sizing risk
  body: Handshake can be framed against a roughly USD 11 billion talent-acquisition software market or
    a much smaller roughly USD 3.7 billion recruitment-software market. The difference is category definition,
    not measurement precision. Any valuation case that assumes the broader figure should explain exactly
    how campus recruiting, events, ATS workflow, and employer monetization expand beyond Handshake’s current
    niche.
  claimRefs:
  - CM020
  - CM021
  - CM022
  - CM023
  - CM024
- calloutType: risk
  title: Deployment does not solve the engagement gap
  body: University coverage and default account creation help distribution, but Strada and recent market
    data show that many students still underuse networking and career services while employers face a
    congested, slower-converting hiring environment. The real diligence question is not whether Handshake
    is present on campuses, but whether it produces higher-quality engagement and outcomes than the substitute
    bundle.
  claimRefs:
  - CM009
  - CM035
  - CM036
  - CM037
  - CM044
  - CM045
  - CM046
  - CM047
  - CM048
