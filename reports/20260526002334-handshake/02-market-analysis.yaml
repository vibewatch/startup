- id: buyer-user-payer
  title: Buyer, User, Payer, and Adoption Path
  body: 'Handshake’s adoption logic depends on distinct but connected actors. Universities are usually
    the institutional champion and trust layer, but not the economic payer in the same way enterprise
    software buyers normally are; customer pages repeatedly show that students receive accounts automatically
    or for free, and that career centers use the platform to organize jobs, internships, interviews, fairs,
    and advising. Students are the primary user and supply side of the marketplace, but their engagement
    is not automatic just because an account exists. Employers are the monetized side: Handshake’s own
    product pages emphasize a freemium path in which companies can start with basic posting and then upgrade
    when they need targeted outreach, better analytics, and ATS integration. The most resilient employer
    segment currently appears to be larger organizations and internship programs rather than smaller discretionary
    campus programs. Buyer priorities across recruiting have also shifted. LinkedIn’s 2025 recruiting
    survey shows the pendulum moving from speed back toward quality of hire, making ROI, response quality,
    and workflow integration more important than generic access alone. For Handshake, that means the adoption
    path is not just “list students, list jobs, get hired.” It runs through university trust, student
    profile completion, employer free posting, recruiter upgrade, and then measurable interview and outcome
    conversion.'
  claimRefs:
  - CM004
  - CM009
  - CM026
  - CM027
  - CM028
  - CM029
  - CM030
