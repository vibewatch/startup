- id: contradictions-and-gaps
  title: Contradictions, Adoption Gaps, and Diligence Priorities
  body: 'The biggest contradiction in Handshake’s market story is that category-level software TAMs are
    rising while observed early-talent hiring feels materially weaker. Public market-size estimates can
    support a large story—roughly USD 11 billion for broad talent acquisition software—but the nearer
    category, recruitment software, is far smaller, and neither estimate isolates campus recruiting cleanly.
    Employer demand is similarly contradictory: NACE’s fall 2025 view was effectively flat, then spring
    2026 improved, yet application congestion, underemployment, and weak response rates still point to
    a stressed market. Adoption also looks better on deployment than on usage. Universities can auto-provision
    accounts and embed Handshake in fairs, appointments, and interviews, but Strada’s findings show that
    many seniors still do not network, do not use career services intensively, and do not build the social
    capital that ultimately drives outcomes. The practical diligence implication is straightforward: investors
    should not underwrite Handshake on category growth alone. The open questions that matter most are
    the exact willingness-to-pay of employer segments, active user engagement by institution type, and
    a public standalone TAM for campus recruiting or career-center CRM. Until those are documented, a
    multiple-lens, evidence-constrained market view is more credible than a clean textbook TAM/SAM/SOM
    stack.'
