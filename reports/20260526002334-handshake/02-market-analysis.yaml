  evidenceGaps:
  - type: missing-source
    severity: material
    topic: standalone-campus-recruiting-sam
    missingEvidence: A public, methodologically transparent standalone market size for campus recruiting,
      career-center CRM, or early-talent network software.
    whyItMatters: Without a clean category cut, TAM and SAM must be inferred from adjacent recruiting-software
      categories and student-pipeline proxies.
    diligencePath: Collect vendor comps, procurement records, and analyst taxonomy cuts that isolate campus
      recruiting or early-talent CRM from broader talent acquisition software.
    relatedQuestionRefs:
    - QM011
    - QM025
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: employer-contract-values
    missingEvidence: Public pricing bands, contract values, seat counts, or spend by employer segment
      for Handshake premium and ATS-integrated tiers.
    whyItMatters: Exact willingness to pay would materially sharpen SOM and payer segmentation instead
      of relying on free-to-paid workflow inference.
    diligencePath: Request sample contracts or procurement disclosures from employers and compare against
      adjacent recruiting-software benchmarks.
    relatedQuestionRefs:
    - QM015
    - QM018
    relatedTableRefs:
    - TM003
  - type: private-evidence-only
    severity: material
    topic: active-student-engagement
    missingEvidence: Public active-user, response-rate, event-attendance, and conversion metrics by institution
      type and student segment.
    whyItMatters: Deployment does not equal usage; without engagement cohorts it is difficult to convert
      institutional coverage into active network utility.
    diligencePath: Request institution-level dashboards or anonymized cohort metrics from customers and
      compare with first-destination outcomes.
    relatedQuestionRefs:
    - QM019
    - QM024
    relatedTableRefs:
    - TM003
  - type: missing-source
    severity: minor
    topic: international-sam
    missingEvidence: A refreshed non-U.S. penetration and expansion dataset for Handshake by student population,
      employer coverage, and local substitutes.
    whyItMatters: International optionality is often implied in platform narratives, but the public evidence
      base here is thinner than for the U.S. market.
    diligencePath: Rebuild the geography lens using current country-level higher-ed and employer-market
      data plus confirmed local customer references.
    relatedQuestionRefs:
    - QM011
    - QM025
