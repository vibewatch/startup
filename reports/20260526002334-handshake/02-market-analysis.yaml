runDate: '2026-05-26'
company:
  name: Handshake
chapter:
  number: 2
  title: Market Analysis
  summary: 'Handshake sits inside a narrower market than generic HR-tech headlines imply: a three-sided
    college-to-career workflow where universities distribute access, students use the network for search
    and events, and employers pay for premium sourcing and ATS-connected recruiting. The addressable opportunity
    is real but boundary-sensitive—public analyst estimates range from roughly USD 3.7 billion for recruitment
    software to roughly USD 11 billion for broader talent acquisition software—and near-term adoption
    is constrained by weak entry-level hiring, rising application congestion, student confidence gaps,
    and university ROI pressure.'
sections:
- id: market-boundary
  title: Market Boundary and Substitutes
  body: 'Handshake is best understood as a three-sided college-to-career network rather than a generic
    HR-tech vendor. On the university side, the platform is distributed as infrastructure for career centers
    and student affairs teams; on the student side, it is a free discovery and engagement surface; and
    on the employer side, it monetizes sourcing, outreach, events, and ATS-connected workflow. That means
    the included spend is not all of “HR tech,” but the slice of recruiting software and services that
    touches campus recruiting, early-talent CRM, candidate engagement, employer-brand discovery, and interview/event
    orchestration. The excluded spend is equally important: generic payroll and HRIS systems, long-tail
    staffing and temporary labor, and the broader economics of higher education tuition do not map cleanly
    to Handshake’s current product footprint. The status quo is also highly fragmented. Universities still
    rely on career fairs, on-campus interviews, advisers, alumni networks, and departmental relationships.
    Employers can default to LinkedIn, Indeed, Glassdoor, or their own ATS pages. That substitute bundle
    matters because buyers do not need to replace one system; they can keep combining legacy offline channels,
    job boards, and internal workflows unless Handshake clearly reduces friction and improves early-talent
    outcomes.'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
