    body: "Wrtn relies on third-party model providers, including Azure OpenAI, for foundational intelligence. As foundation-model developers enhance consumer-facing applications and personalization directly, wrapper interfaces face margin compression and technical commoditization unless sustained by proprietary character IP and user lock-in."
    claimRefs:
      - "CP004"
      - "CP009"
