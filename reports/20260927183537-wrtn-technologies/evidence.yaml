evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: valuation
    missingEvidence: >-
      Reconciliation of Series C term sheet pre-money versus post-money capitalization to resolve conflicting reported
      valuation figures (₩1.0T, ₩1.2T, ₩1.4T).
    whyItMatters: >-
      Reported valuation varies by up to $280 million across major news outlets, altering dilution and baseline multiple
      calculations.
    diligencePath: Request signed Series C shareholder agreement or audited capitalization schedule from company management.
    relatedQuestionRefs:
      - QO005
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: >-
      Audited financial statements for FY2025 and H1 2026 gross margins, net burn rate, and model API token expense
      breakdown.
    whyItMatters: >-
      Guidance of >₩200B revenue in 2026 is unaudited, and heavy consumer AI usage on Azure OpenAI can generate
      substantial inference costs.
    diligencePath: Review audited income statement and cloud vendor billing records under NDA during management diligence.
    relatedQuestionRefs:
      - QO006
      - QO009
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-or-investor-map
    missingEvidence: >-
      Precise equity ownership percentages and liquidation preference seniority across Series Seed through Series C
      investors.
    whyItMatters: >-
      Governance control, board seat allocation, and investor voting thresholds cannot be conclusively determined from
      public round announcements alone.
    diligencePath: Examine detailed cap table and articles of incorporation during formal confirmatory diligence.
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: cohort-retention-and-enterprise-spend
    missingEvidence: >-
      Audited longitudinal cohort retention curves, gross margin breakdowns after inference costs, and verified
      enterprise pilot revenue disclosures.
    whyItMatters: >-
      Without segmented cohort retention data, it is impossible to verify whether high monthly revenue per MAU in OOC
      and Kyarapu reflects durable customer lifetime value or novelty-driven initial consumption.
    diligencePath: >-
      Review internal management reporting on paying user churn, net revenue retention by geography, and cloud hosting
      bills under non-disclosure agreement.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: ooc-cohort-retention
    missingEvidence: >-
      Granular cohort-level retention data, paying user conversion percentages, and repeat spend metrics for OOC in
      North America beyond headline 90-day monthly sales.
    whyItMatters: >-
      Character-based entertainment can experience steep post-novelty churn, making long-term customer lifetime value
      uncertain without cohort visibility.
    diligencePath: Request audited monthly cohort retention tables and paying-user renewal curves during pre-IPO disclosure review.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: minor
    topic: inference-cost-breakdown
    missingEvidence: >-
      Unit inference cost per active conversation hour across light routing models versus frontier Azure OpenAI o1
      calls.
    whyItMatters: >-
      Heavy conversational interaction consumes significant computing resources, directly impacting gross margins as
      engagement expands.
    diligencePath: Examine management disclosures on compute expense allocation and Azure OpenAI consumption subsidies.
    relatedQuestionRefs: []
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Detailed B2C customer acquisition costs (CAC), payback periods, and subscription churn/retention metrics for
      premium services.
    whyItMatters: >-
      Without verified cohort retention or CAC efficiency, underwriting gross margin sustainability and long-term
      marketing ROI is blocked.
    diligencePath: Request auditor-reviewed cohort retention curves and marketing spend breakdowns under NDA during diligence.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: enterprise-service-level-agreements
    missingEvidence: >-
      Publicly disclosed production service level agreements (SLAs), uptime percentages, latency guarantees, and
      disaster recovery recovery time objectives (RTO) for Wrtn AX enterprise deployments.
    whyItMatters: >-
      Enterprise clients and public sector agencies require legally binding SLA guarantees and uptime indemnification
      before migrating core operational workflows onto Wrtn AX.
    diligencePath: >-
      Review standard enterprise master service agreements (MSAs), SOC 2 compliance reports, and historical quarterly
      service availability logs during commercial diligence.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: inference-unit-economics
    missingEvidence: >-
      Gross compute and token inference costs per active user across free consumer accounts versus enterprise Wrtn AX
      contract tiers.
    whyItMatters: >-
      Unmonetized token consumption across millions of free users creates structural cash burn unless offset by
      high-margin enterprise contract retainers.
    diligencePath: >-
      Examine detailed cloud hosting invoices, token consumption logs by model class (including OpenAI o1), and unit
      contribution margins across user segments.
    relatedQuestionRefs:
      - QE007
  - type: missing-source
    severity: material
    topic: customer-retention
    missingEvidence: >-
      Audited cohort retention curves, monthly churn percentages, and net revenue retention (NRR) data across consumer
      and enterprise tiers.
    whyItMatters: >-
      Without retention disclosures, it is impossible to evaluate whether recent revenue growth represents durable
      lifetime value or transient acquisition driven by paid marketing.
    diligencePath: >-
      Request cohort-level retention tables, monthly active user repeat rates, and subscription renewal metrics under
      NDA during management sessions.
    relatedQuestionRefs:
      - QU005
  - type: enumeration-incomplete
    severity: material
    topic: enterprise-customer-proof
    missingEvidence: >-
      Complete disclosure of named enterprise transformation (AX) customers, contract values, and pilot-to-production
      conversion rates.
    whyItMatters: >-
      Enterprise revenue diversification is necessary to balance volatile consumer entertainment revenue and
      substantiate high private valuation multiples.
    diligencePath: >-
      Obtain customer reference lists, enterprise case studies, and B2B annual recurring revenue breakdowns during
      confidential commercial diligence.
    relatedTableRefs:
      - TU003
    relatedQuestionRefs:
      - QU009
  - type: enumeration-incomplete
    severity: blocking
    topic: regulatory legal risk register
    missingEvidence: >-
      Primary court, regulator, privacy, copyright, youth-safety, content-governance, and jurisdictional compliance
      records.
    whyItMatters: Without primary records, legal likelihood, mitigation maturity, and residual exposure cannot be verified.
    diligencePath: >-
      Commission counsel searches in each operating jurisdiction and reconcile results to management's matter list,
      policies, assessments, and regulator correspondence.
    relatedQuestionRefs:
      - QR002
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: blocking
    topic: security reliability controls
    missingEvidence: >-
      Incident history, outage statistics, architecture, service levels, penetration tests, certifications, red-team
      findings, and remediation evidence.
    whyItMatters: >-
      The evidence is necessary to assess the probability and controllability of operational or security failure at the
      reported user scale.
    diligencePath: >-
      Obtain the security data room, status and incident exports, third-party reports, cloud architecture, vendor
      contracts, and tested recovery results.
    relatedQuestionRefs:
      - QR003
      - QR009
      - QR010
    relatedTableRefs:
      - TR001
      - TR002
  - type: private-evidence-only
    severity: blocking
    topic: cash runway and financing terms
    missingEvidence: >-
      Audited cash, monthly net cash usage, commitments, fully diluted cap table, liquidation preferences, veto rights,
      transfer restrictions, and pro forma dilution.
    whyItMatters: >-
      Funding raised is not cash available, and investor returns depend on runway, senior claims, governance rights, and
      dilution.
    diligencePath: >-
      Reconcile bank statements and audited accounts to signed financing documents and a counsel-certified fully diluted
      capitalization schedule.
    relatedQuestionRefs:
      - QR005
      - QR008
      - QR010
    relatedTableRefs:
      - TR001
      - TR003
  - type: private-evidence-only
    severity: material
    topic: revenue durability and concentration
    missingEvidence: >-
      Product and geography revenue mix, gross margin, refunds, acquisition cost, payer cohorts, retention, repeat
      spend, and platform or content costs.
    whyItMatters: >-
      Company-reported monthly sales and an annual revenue forecast do not establish recurring, diversified, or
      profitable growth.
    diligencePath: >-
      Request monthly ledger-to-product reconciliation and 30/90/180-day payer cohorts by product, geography,
      acquisition channel, and contribution margin.
    relatedQuestionRefs:
      - QR006
      - QR007
      - QR009
      - QR010
    relatedTableRefs:
      - TR002
      - TR003
  - type: missing-source
    severity: material
    topic: gross-margin-breakdown
    missingEvidence: Audited gross margin and direct cloud inference token expense breakdowns for Azure OpenAI Service consumption.
    whyItMatters: >-
      Unit economics and gross margins determine long-term operating leverage and multiple sustainability against
      enterprise AI peers.
    diligencePath: >-
      Request management accounts detailing cloud hosting costs, API token billing, and gross margin per active paying
      user.
  - type: private-evidence-only
    severity: minor
    topic: secondary-transaction-pricing
    missingEvidence: Exact traded prices and transacted volume for pre-IPO secondary share transfers on EquityZen and Caplight.
    whyItMatters: >-
      Secondary market pricing provides market-clearing transaction signals that can indicate institutional or retail
      discounts to the Series C headline price.
    diligencePath: >-
      Review EquityZen and Caplight confidential deal offering documents and secondary block transfer settlement
      notices.
