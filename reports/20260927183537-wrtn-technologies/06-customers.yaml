callouts:
  - calloutType: insight
    title: Monetization Transition from Utility Tools to Interactive Entertainment
    body: Wrtn's revenue inflection in late 2024 and 2026 demonstrates that consumer willingness-to-pay is substantially higher for interactive AI character companionship (Crack) and immersive storytelling (OOC) than for commoditized free writing assistants. The rapid scaling to ₩10 billion in monthly sales in North America confirms that emotional engagement and entertainment provide stronger consumer pricing power than generic productivity utilities.
    claimRefs:
      - CU003
      - CU004
      - CU007
  - calloutType: risk
    title: High Consumer Churn Exposure and Lack of Retention Disclosures
    body: Despite surpassing 5.4 million monthly active users, Wrtn has disclosed no cohort retention curves, net revenue retention (NRR) rates, or customer lifetime value (LTV) metrics. Consumer entertainment applications historically experience severe fatigue and high churn; without durable cohort data, long-term revenue predictability remains a central diligence vulnerability.
    claimRefs:
      - CU011
      - CU012
      - CU013
