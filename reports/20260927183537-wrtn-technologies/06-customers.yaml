company:
  name: Wrtn Technologies
chapter:
  number: 6
  title: Customers
  summary: Wrtn Technologies has scaled its active user base from early Korean writing tools to over 5.4 million monthly active users across South Korea and Japan, supported by Microsoft Azure OpenAI infrastructure. Commercial monetization has inflected through consumer character chat (Crack) and interactive storytelling (OOC), generating over ₩10 billion in monthly revenue in North America within three months of release, though cohort retention, customer churn, and enterprise contract metrics remain undisclosed.
sections:
  - id: customer-base-segmentation
    title: Customer Base Segmentation and Buyer Personas
    body: 'Wrtn Technologies structures its customer base across three primary tiers: free consumer portal users, paying consumer entertainment subscribers, and emerging enterprise AI transformation clients. The consumer portal serves as the core user acquisition funnel, offering conversational search, image generation, and multi-model AI utilities to over 5.4 million monthly active users across South Korea and Japan. Within this consumer population, Wrtn has introduced specialized entertainment products—most notably its character dialogue service Crack and its North American storytelling application OOC—which convert engaged free users into paying digital consumers through subscription and token models. A third commercial segment, Wrtn AX, targets corporate enterprises and public institutions seeking workflow automation and customized AI agents, though contract numbers and commercial scale remain opaque.'
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU005
    tableRefs:
      - TU001
  - id: adoption-trajectory-and-usage-velocity
    title: Adoption Trajectory and User Acquisition Velocity
    body: Wrtn's user adoption trajectory demonstrates rapid consumer scaling within the East Asian AI landscape. Launching publicly in early 2023, the platform expanded from 2 million monthly active users in mid-2024 to surpass 5 million monthly active users by October 2024, achieving the 5 million milestone in 1 year and 10 months. This user acquisition pace outstripped benchmark domestic consumer platforms including fintech unicorn Toss and hyper-local marketplace Karrot. By January 2025, active platform users topped 5.4 million, supported by Microsoft Azure OpenAI infrastructure and specialized reasoning models. Concurrently, monetization inflected from ₩1 billion in monthly revenue in November 2024 to ₩2 billion in December 2024, driven primarily by user adoption of interactive character chat features.
    claimRefs:
      - CU002
      - CU004
      - CU006
      - CU007
      - CU009
    tableRefs:
      - TU002
  - id: commercial-proof-and-named-deployments
    title: Commercial Proof and Production Deployments
    body: Tangible commercial proof centers on large-scale consumer digital engagement and strategic infrastructure partnerships rather than traditional enterprise software logos. Wrtn's production deployment of Microsoft Azure OpenAI Service and o1 reasoning models validates the platform's capacity to serve millions of concurrent consumer requests while navigating strict regulatory requirements. In consumer entertainment, Wrtn demonstrated rapid global product adoption with OOC, an interactive storytelling app launched in North America in May 2026 that exceeded ₩10 billion in monthly sales within three months. To further deepen consumer mindshare, Wrtn has expanded into entertainment and gaming channels, including sponsoring major gaming exhibitions such as G-Star 2026 to engage gaming communities.
    claimRefs:
      - CU002
      - CU003
      - CU004
      - CU007
      - CU008
      - CU010
      - CU014
    tableRefs:
      - TU003
    figureRefs:
      - FU001
  - id: retention-durability-and-concentration-risks
    title: Retention Durability, Expansion Loops, and Concentration Risks
    body: While top-of-funnel customer adoption has been explosive, long-term customer durability faces substantial diligence risks due to disclosure opacity and platform dependency. Wrtn has not publicly shared cohort retention curves, monthly active user churn rates, or net revenue retention benchmarks across its consumer or enterprise products. Consumer conversational entertainment historically suffers from engagement decay and rapid novelty fatigue, making recurring subscriber lifetime value uncertain. Additionally, secondary market databases such as Caplight and EquityZen show restricted disclosure of financial filings and customer health metrics. Heavy dependence on third-party foundation models and cloud infrastructure also creates vulnerability to margin compression as user token consumption accelerates.
    claimRefs:
      - CU011
      - CU012
      - CU013
      - CU015
