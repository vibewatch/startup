figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: End-to-end customer lifecycle from top-of-funnel organic discovery to paid interactive entertainment and enterprise expansion.
    data:
      items:
        - label: 1. Top-of-Funnel Discovery
          detail: Organic acquisition via free AI conversational portal, writing tools, and word-of-mouth student adoption.
          touchpoints:
            - Web search portal
            - Writing assistant UI
        - label: 2. Free Portal Onboarding
          detail: Users access multi-model AI utilities without upfront paywalls, building habituated daily usage.
          touchpoints:
            - Prompt templates
            - Conversational search
        - label: 3. Character Engagement (Crack)
          detail: Domestic consumers adopt conversational AI characters, increasing engagement time and session frequency.
          touchpoints:
            - Persona chat feed
            - User-generated characters
        - label: 4. Direct Consumer Monetization
          detail: Transition to paid tier via token packages and subscriptions for premium character dialogue.
          touchpoints:
            - In-app purchases
            - Subscription tiers
        - label: 5. Global Storytelling Expansion (OOC)
          detail: International user acquisition in North America generating rapid commercial monetization in interactive fiction.
          touchpoints:
            - Mobile narrative app
            - Global app stores
        - label: 6. Enterprise & AX Cross-Sell
          detail: Leveraging consumer brand scale to engage corporate and public sector clients for custom AI transformation.
          touchpoints:
            - AX consulting
            - Custom agent studio
    approximationNotes: Journey stages reflect observed product transitions and monetization disclosures; specific conversion percentages between stages are not publicly reported.
