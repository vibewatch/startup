      - number: '1.4'
        title: 运营规模、产品商业化变现与全球扩张
        blocks:
          - type: paragraph
            body: >-
              Wrtn 的运营发展轨迹展现出用户快速获客以及随后向娱乐变现战略转型的特征 [CO010, CO013]。核心门户应用 Wrtn 在上线仅 22 个月后的 2024 年 10 月即突破 5.0M
              月活跃用户大关，到 2025 年进一步增长至 5.4M 月活跃用户，打破了 Toss 和 Karrot 等韩国知名独角兽初期的用户采纳节奏 [CO010]。2025
              年，在高级付费订阅与角色对话聊天的支撑下，Wrtn 报告了 47.1B won（约 $36M）的收入规模 [CO011]。在此基础之上，Wrtn 先在本土推出了「Crack」，随后于 2026 年 5
              月在北美推出了二次元互动叙事平台「OOC」（Out Of Character）[CO013]。OOC 在上线后三个月内月销售额突破 10B won，首度促成公司过半收入来自海外，并支撑起管理层提出的 2026
              年超过 200B won（$152M）的激进收入指引 [CO012, CO014]。尽管如此，这种规模爆发高度依赖底层基于 Microsoft Azure OpenAI Service
              的云基础设施以及前沿模型，随着推理调用量剧增，上游算力成本和 API 价格调整对毛利率构成直接考验 [CO015]。
