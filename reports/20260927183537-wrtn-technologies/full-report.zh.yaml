  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局：娱乐颠覆者与行业既有巨头
        blocks:
          - type: paragraph
            body: >-
              Wrtn Technologies 处于东亚人工智能生态系统中一个独特的交汇点，连接了通用生产力工具与人设驱动的 C端 娱乐。公司起步于自然语言写作助手，随后拓展为 C端
              门户，并推出了专门的角色对话产品。竞争格局横跨三个梯队：提供通用推理能力的全球前沿实验室（如 OpenAI）；Upstage 等韩国本土基础设施与模型厂商；以及以 Character.AI
              为代表的垂直对话角色扮演平台。尽管 Naver 等本土搜索巨头在韩国把持着庞大的综合门户流量，Wrtn 却通过在本土推出人设聊天应用 Crack 以及在海外推出 OOC
              实现了差异化，瞄准互动娱乐而非纯粹的职场办公场景。
