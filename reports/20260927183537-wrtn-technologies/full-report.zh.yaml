              - CV012
              - CV013
      - number: '8.2'
        title: 商业化变现进展与投资建议逻辑
        blocks:
          - type: paragraph
            body: >-
              Wrtn 的业务规模迅速做大，主要靠韩国本土与海外个人用户的快速普及支撑；底层的 Microsoft Azure OpenAI Service 基础设施，托起了超过 5.4M
              月活用户。在出海拓展上，公司面向北美推出的 AI 娱乐平台 OOC 展现出立竿见影的商业变现能力，2026 年 5 月上线不到 3 个月，月收入就突破 10B
              KRW（$7.22M）。按我们的分析框架测算，这一商业化拐点支撑其基准估值区间落在 $550M 至 $720M。然而，支撑复杂多模态交互与第三方基础模型 API
              需要高昂算力，给毛利率带来结构性不确定性。因此，综合考量平台规模、商业验证与成本结构瓶颈，在当前一级市场轮次估值下维持 Hold（持有）建议。
            claimRefs:
              - CV005
