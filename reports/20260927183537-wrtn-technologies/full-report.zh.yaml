      - number: '1.2'
        title: 创始团队领导力、技术治理与关键人物依赖风险
        blocks:
          - type: paragraph
            body: >-
              Wrtn 由 Lee Se-young、Lee Dong-jae、Jae Sung-won 与 Yoo Young-joon 联合创办，这支创业团队凭借早期成就入选 2024 年福布斯亚洲 30 位 30
              岁以下精英榜（消费科技领域）[CO003]。公司高管治理高度围绕 CEO Lee Se-young 展开，从种子轮到 Series C 轮的历次机构融资中，他始终担任主要发言人、架构师以及募资人
              [CO004]。业务执行与技术研发在联合创始人之间分工明确，分别执掌产品方向、平台工程以及生态分发渠道
              [CO003]。尽管这种紧密的创始团队凝聚力促成了敏捷的产品迭代与业务转型——最显著的是从纯写作工具转向基于角色的互动娱乐——但在机构投资人关系、外部治理及战略构想上，表现出对 Lee Se-young
              显著的关键人物依赖 [CO004]。伴随 Wrtn 大力向北美和日本等海外市场扩张，建立二级高管梯队与独立的董事会监管机制，构成了缓释运营集中风险的关键治理里程碑 [CO003, CO004]。
            claimRefs:
              - CO003
              - CO004
