  - number: 7
    title: 风险评估
    sections:
      - number: '7.1'
        title: 风险优先级排序与证据边界
        blocks:
          - type: paragraph
            body: >-
              尽调的首要关注点并非已记录的安全事故，而是激进扩张诉求与有限原始风险披露之间的脱节。亚洲日报（Aju Press）与 WEEX 报道了 100B KRW 的 Series C 轮融资、累计约 230B KRW
              的融资金额，以及管理层对 2026 年收入超过 200B KRW 的业绩预期。两家机构亦报道称 OOC 在上线后不久单月销售额即突破 10B
              KRW。这些数据展现出扩张规模与野心，却未证实账面可用现金、资金消耗率、毛利率、留存表现、收入集中度或优先股清算条款。此外，微软官方记录了其对 Azure OpenAI Service 及 o1
              模型的使用，确立了关键的技术合作关系，但无法证实是否存在单一供应商依赖。因此，暂定的风险排序为：财务可持续性与法律/安全证据列为高尽调优先级；若存在云/模型集中度则构成高冲击影响；国际消费娱乐业务扩张则面临中高水平的执行风险。鉴于现有证据库未包含事故记录或风控措施资料，发生概率仍属未知。
