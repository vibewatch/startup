        title: 图表清单
        blocks:
          - type: callout
            title: 非对称商业化变现：工具引流漏斗与娱乐营收引擎
            body: >-
              Wrtn 的结构性差异化优势在于化解了 C端 AI 的商业化困境。Wrtn 并未在通用聊天包月 SaaS 订阅上同享受高额补贴的全球巨头硬碰硬，而是将 5.4M 月活工具用户作为零获客成本的拉新引擎，向
              Crack、Kyarapu 和 OOC 等高客单价互动叙事平台持续输送流量。
            calloutType: insight
