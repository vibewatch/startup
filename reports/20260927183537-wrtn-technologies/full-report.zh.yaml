      - number: '8.3'
        title: 反向逻辑抗辩与竞争格局动态
        blocks:
          - type: paragraph
            body: >-
              压制 Wrtn 估值倍数的核心反向逻辑，在于激烈的市场竞争与平台替代风险。Tracxn 对标数据显示，在 898 家自然语言与对话式 AI 工具竞争对手中，Wrtn 排名第
              5，直面资金实力雄厚的国际头部玩家，例如累计融资分别达 $193M 和 $1.52B 的 Character.ai 与 Inflection。此外，Upstage、Quora 和 ScatterLab
              等本土与区域 AI 同行，在个人用户工作流中也持续构成替代选项。Wrtn 的娱乐类产品线（尤其是 Crack AI
              角色聊天服务）面临越来越严的未成年人安全审查。为此，管理层正推行更严格的青少年保护措施，包括限制使用时长、要求家长强制同意以及设置应用内微交易消费上限。这些举措带来执行风险与潜在的顶线摩擦，可能削弱个人用户的活跃度势头。
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV011
