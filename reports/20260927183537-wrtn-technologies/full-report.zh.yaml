      - number: '3.3'
        title: 战略定位与区域娱乐护城河
        blocks:
          - type: paragraph
            body: >-
              Wrtn 的战略定位在区域语言文化本土化与跨国消费娱乐扩张之间谋求平衡。在本土市场，Wrtn 建立了庞大的 C端 用户规模，积累了超过 500 万月活跃用户，其扩张节奏超过了 Toss 和 Karrot
              等韩国标杆互联网平台初期的表现。与在全球铺设标准化界面的跨国平台不同，Wrtn 针对韩日年轻人群体量身定制对话人设，筑起了抵御同质化全球套壳产品的防御壁垒。然而，正如竞争定位四象限图所示，携 OOC 进军北美让
              Wrtn 与 Character.AI 以及更广泛的互动娱乐形态狭路相逢，在这一战场，护城河完全维系在用户留存率、角色 IP 独特性以及社群自传播效应上，而非本土渠道分发红利。
            claimRefs:
              - CP006
              - CP011
