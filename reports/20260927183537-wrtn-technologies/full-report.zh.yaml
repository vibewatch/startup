          tone: positive
        - label: '2024-10: MAU 突破 5M 里程碑'
          detail: 产品上线仅 1 年 10 个月，月活跃用户即突破 500 万大关。
          tone: positive
        - label: '2025-03: B 轮融资收官'
          detail: 完成由 Goodwater Capital 领投的 ₩108 billion B 轮融资，新增资金 ₩83 billion。
          tone: positive
        - label: '2026-05: OOC 全球上线'
