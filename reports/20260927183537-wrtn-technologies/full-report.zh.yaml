              鉴于 Wrtn 依赖托管在 Microsoft Azure 等云基础设施上的 OpenAI、Anthropic 和 Google 第三方基础模型，营业利润率极易受到上游 API
              价格变动和安全过滤政策的影响。此外，北美娱乐业务的快速扩张使 Wrtn 面临应用商店针对 AI 伴侣内容日益严苛的监管要求。
