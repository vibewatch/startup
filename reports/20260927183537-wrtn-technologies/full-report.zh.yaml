              2024 年 12 月翻倍至 2B KRW。随着 2026 年 5 月在北美推出国际版 OOC，增长态势进一步爆发，该产品上线头三个月内单月销售额即突破 10B KRW。管理层预计 2026 年全年总营收将超过
