            body: >-
              Wrtn 的未来资本充裕度受到其 2026 年 8 月完成的 Series C 轮融资支撑，该轮融资以 1T won 的官方基准估值筹集了 100B won（$69M 至 $72M），奠定了其作为韩国首家 C端
              AI 独角兽的地位。历经六轮已完成的投资，累计融资总额达到约 230B won，为支持全球扩张与内容营销提供了充足的资金缓冲。然而，私募市场的估值参考体系存在分歧，非上市可比公司推算其企业价值为
              $693M（按已记录的 $139M 营收计算，对应 5.0 倍估值倍数）。EquityZen 等二级交易市场的动态显示出早期股东与员工的流动性诉求，伴随常规的 pre-IPO
              股权转让限制。从投资承销视角来看，尽管 Wrtn 展现出非凡的顶层营收增长势头，但落实投资决策前，仍须对其经审计的毛利率、算力单位经济模型及用户流失率展开严谨的尽职调查。
