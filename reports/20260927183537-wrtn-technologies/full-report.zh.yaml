chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 企业沿革、创立背景与核心使命
        blocks:
          - type: paragraph
            body: >-
              Wrtn Technologies Inc. 是一家总部位于首尔的生成式人工智能技术公司，由首席执行官 Lee Se-young 携四位联合创始人团队于 2021 年 4 月创立 [CO001,
              CO003]。公司将让通用人工智能（AGI）和前沿对话式 AI 交互界面触达日常大众、直观易用并服务于大众日常作为首要战略使命 [CO001]。Wrtn 最早定位为一款 AI
              写作助手，意在缓解写作技能退化并提升个人生产力，早期技术直接依托 KakaoTalk 对话频道和网页端分发，无需繁琐的软件安装 [CO002]。在随后的五年里，Wrtn
              有系统地拓宽产品矩阵，演化为集对话式搜索、文档创建、演示文稿生成和互动娱乐于一身的 C端 综合「超级应用」[CO002]。作为总部设立于韩国首尔的企业，Wrtn 跃升为该国最具知名度的 C端 AI
              企业之一，将自身定位在底层基座模型与区域终端用户之间的平台层 [CO001, CO002]。
            claimRefs:
              - CO001
              - CO002
              - CO003
