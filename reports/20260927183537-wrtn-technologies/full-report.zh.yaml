    data:
      items:
        - label: '2021-04: 公司成立'
          detail: Seyoung Lee 与联合创始人于首尔正式成立 Wrtn Technologies。
          tone: neutral
        - label: '2021-06: 种子轮'
          detail: 获得 Mashup Ventures 种子轮投资，用于开发 NLP 写作工具。
          tone: positive
        - label: '2022-11: Pre-A 轮'
          detail: 完成 ₩3.8 billion Pre-A 轮融资，拓展生成式 AI 能力。
          tone: positive
        - label: '2023-01: AI 服务上线'
          detail: 正式上线面向 C 端的「Wrtn」AI 门户，提供对话式搜索与写作功能。
          tone: positive
        - label: '2023-06: A 轮'
          detail: 完成由 Z Venture Capital 领投的 ₩15 billion（$11.8M）A 轮融资。
          tone: positive
        - label: '2024-06: Pre-B 轮'
