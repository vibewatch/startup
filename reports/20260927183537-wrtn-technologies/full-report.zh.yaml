      - number: '2.3'
        title: 购买群体细分、预算归属与结构性约束
        blocks:
          - type: paragraph
            body: >-
              Wrtn 的终端市场客群划分显现出工具用户与娱乐付费用户之间截然不同的采纳特征。C端
              工具用户画像涵盖寻求免费或低门槛协助的学生、知识工作者以及求职群体，主要用于演示文稿起草、文档摘要与韩语搜索。这部分用户价格敏感度高且转换成本低，频繁在集成 Microsoft Azure OpenAI
              的产品、Google Gemini 以及 Naver 和 Kakao 本土竞品之间多栖切换。由于工具用户抵触前期订阅收费，Wrtn
              采用轻量级分类器路由来承接其高频提问，将简单提示词分流至低成本模型，把高成本的前沿模型推理资源留给付费变现工作流。


              相比之下，驱动 Wrtn
              营收规模的核心变现客群主要由数字娱乐爱好者、二次元角色扮演受众以及互动小说读者构成。这部分人群动用个人可支配娱乐预算为其消费买单，购买虚拟代币包以解锁复杂的多轮叙事、定制化角色人设与场景插图。制约该细分市场的结构性瓶颈主要集中在平台安全政策、模型依赖风险以及内容审核上。由于
              Wrtn 的核心智能依托于 OpenAI、Anthropic 和 Google 等第三方基础模型，上游 API
              定价调整或内容过滤规则变化将直接波及营业利润率与内容创作自由度。此外，在北美和日本应用商店铺开业务，也带来了针对数字内容准则及用户支付结算渠道更严苛的合规审视。
            claimRefs:
