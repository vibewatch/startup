  - number: 8
    title: 估值分析
    sections:
      - number: '8.1'
        title: 投资逻辑与 Series C 轮估值背景
        blocks:
          - type: paragraph
            body: >-
              Wrtn Technologies 于 2026 年 8 月敲定了具有里程碑意义的 100B KRW（$72.2M）Series C 轮融资，确立了超过 1T
              KRW（$722M）的投后估值，奠定了其作为韩国本土首家消费级 AI 独角兽的地位。该轮融资促使其在所有股权融资中的累计募资总额达到约 230B KRW（$166M）。本轮投资引入了新机构股东 Coreline
              Ventures 和 Eugene Asset Management，既有风险投资机构 Goodwater Capital、Antler Global、Capstone Partners
              及韩国产业银行（KDB）亦跟投加持。该官方估值对应约 5.0x 的投资估值倍数，对标管理层预计 2026 年超过 200B KRW 的收入目标，相较于 2025 年录得的 47.1B KRW 实现了大幅跃升。尽管
              EquityZen 等平台为合格投资者提供了二级市场退出渠道，但秉持严谨的资本配置纪律，鉴于其尚未跑通的经营杠杆，仍须设定审慎的投资估值门槛。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV010
              - CV012
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
