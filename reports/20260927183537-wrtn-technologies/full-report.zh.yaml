  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、产品层级与支出细分
        blocks:
          - type: paragraph
            body: >-
              Wrtn Technologies 的目标市场涵盖两个界限分明却在结构上紧密联动的细分赛道：免费的基础型 C端 AI 工具与付费的互动式数字娱乐。在其韩国本土市场，Wrtn 扮演着日常 AI
              枢纽的角色，提供多模型对话搜索、文档解析与文本生成功能，聚集了超过 5.4M 月活跃用户。然而，由于全球基座模型厂商提供高额补贴的 AI 助手展开激烈竞争，C端
              用户对单一文本补全与泛化聊天工具的直接付费意愿依然受限。因此，Wrtn 将消费级生产力工具视为用户获取漏斗，而非核心变现引擎，有意识地将企业工作流授权与订阅付费门槛从核心 B2C 工具层中剔除。


              Wrtn 的商业化核心深植于互动式 AI 小说与角色娱乐，其代表产品包括韩国本土的 Crack、日本的 Kyarapu 以及北美的
              OOC。该市场精准承接了传统上投向移动条漫、轻小说、视觉小说以及抽卡手游生态的可自由支配数字娱乐预算。Wrtn
              并未销售按期循环的软件订阅，而是借助按量计费的虚拟代币体系实现变现，用户购买代币包用于推进剧情、生成图像以及调用高级模型。这种双层架构确立了明确的业务边界：漏斗顶层的用户规模依托实用工作流的月活参与度来衡量，而收入增长动能则由高粘性粉丝叙事社区内的虚拟代币消耗所驱动。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM004
              - CM005
              - CM014
      - number: '2.2'
        title: 目标市场规模测算、地域扩张与商业化视角
        blocks:
          - type: paragraph
            body: >-
              评估 Wrtn 的目标市场规模，需要同时考量广义的消费级生成式 AI 软件市场与高变现的互动叙事细分赛道。行业测算预计韩国广义本土软件市场规模达数百亿美元，但本土 AI
              工具服务的可服务目标市场仅占该总量的一小部分。Wrtn 旗下角色聊天服务单月收入从 2024 年 11 月的 1B KRW 攀升至 2024 年 12 月的 2B
              KRW，随后迅速开启国际化扩张，初步跑通了商业化路径。到 2026 年 4 月，Crack 与 Kyarapu 在不足 500,000 月活跃用户的基数上，合计月度折算年化运行率突破
              $8.0M，付费群体的人均单月活跃用户贡献收入超过 $16.00。


              地域多元化拓展大幅拉升了 Wrtn 的可服务可获取市场。2026 年 5 月在北美推出的 OOC 带来了立竿见影的商业爆发，上线三个月内单月销售额突破 10B KRW（$7.2M）。到 2026 年 8
              月，韩国本土以外的海外收入在公司历史上首次超过本土收益。第三方独立财务分析估计 Wrtn 2025 年全年收入达到 $33.0M——相较 2024 年 $2.2M 的基准实现了十五倍增长——管理层内部设定的
              2026 年目标为 $145.0M，横跨 C端 叙事与新兴的企业转型业务。尽管增长迅猛，但在竞争激烈的西方应用生态中，模型推理开销与获客成本动态依然制约着长期市场空间。
            claimRefs:
