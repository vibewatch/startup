      - number: '3.2'
        title: 技术能力矩阵与定价架构
        blocks:
          - type: paragraph
            body: >-
              从技术架构来看，Wrtn 扮演的是模型编排者而非纯前沿基础模型研发机构，其采用动态模型路由器在经济型轻量模型与 Azure OpenAI o1
              等前沿系统之间智能分发用户请求。这种模块化方案与专注专有权重研发的基础模型厂商（如 Upstage）以及依赖专有对话架构的 Character.AI
              形成了鲜明对照。这些竞争阵营之间的变现模式亦存在巨大差异。通用生产力助手大多采用固定月度订阅制（如 ChatGPT Plus 每月 20 美元），而 Wrtn
              的娱乐应用则依靠应用内代币购买和角色互动畅读卡。这种打包定价架构加快了海外消费端支出的放量，但相比签署合同的企业软件，也带来了更高的收入波动性。
            claimRefs:
