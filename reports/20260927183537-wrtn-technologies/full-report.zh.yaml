              为在维持高可用性的同时支撑每日数百万次的对话交互，Wrtn 将生产基础设施锚定在 Microsoft Azure OpenAI Service 之上 [CE002,
              CE003]。这一基础设施整合方案提供了企业级合规支持、东亚区域内的低延迟网络，以及对 OpenAI o1 等前沿推理模型的优先访问权 [CE002, CE005]。除了云厂商自身的安全屏障，Wrtn
