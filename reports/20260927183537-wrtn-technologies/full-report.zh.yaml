      - number: '3.4'
        title: 转换成本、平台依赖与同质化风险
        blocks:
          - type: paragraph
            body: >-
              尽调表明，尽管整体营收放量迅速，Wrtn 仍面临显著的结构性替代威胁。鉴于 Wrtn 依赖第三方基础模型，底层模型厂商的任何大幅性能突破或激进的 C端
              定价下调，都可能迅速侵蚀下游套壳界面的附加值。此外，角色对话娱乐天然具备低转换成本和容易审美疲劳的弱点；用户极易在相互竞逐的社交和游戏应用之间游走切换。2025 年 Wrtn 在 47.1B won
              营收的基础上录得 58.8B won 营业亏损，印证了承载高密度的对话流量需要巨大的推理成本支出。另外，在跨国运营角色平台还面临复杂的青少年安全合规审查，促使 Wrtn
              引入消费限额和家长控制功能以化解平台合规风险。
            claimRefs:
              - CP008
              - CP009
              - CP013
              - CP014
