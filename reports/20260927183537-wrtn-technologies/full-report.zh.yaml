        title: 图表清单
        blocks:
          - type: callout
            title: 下游前沿模型依赖与同质化界面风险
            body: >-
              Wrtn 在底层智能上依赖包括 Azure OpenAI 在内的第三方模型供应商。一旦基础模型开发商直接完善其面向 C端 的原生应用与个性化功能，下游套壳界面将面临利润率受压和技术同质化风险，除非拥有专有角色
