            body: >-
              尽管漏斗顶层的用户获取呈现爆发之势，但在信息披露不透明和平台依赖的背景下，长期客户粘性仍面临实质性尽调风险。Wrtn
              尚未公开披露其消费级或企业级产品的留存队列曲线、月活跃用户流失率或净收入留存率（NRR）基准。消费级对话娱乐历来面临互动热度消退和快速审美疲劳的问题，导致周期性订阅用户的生命周期价值（LTV）充满变数。此外，Caplight
