  - id: FV001
    title: 投资建议逻辑推演流
    type: flow
    summary: 从用户规模与收入表现出发，贯穿风险评估，最终推导至投资建议的分析链路。
    data:
      nodes:
        - id: scale
          label: C 端用户规模
          description: 核心 AI 超级应用平台月活跃用户突破 5.4M
        - id: revenue
          label: 商业化轨迹
          description: 2026 年预测收入突破 200B KRW，OOC 月销售额超过 10B KRW
        - id: capital
          label: C 轮资本化进程
          description: 完成 100B KRW 融资，投后估值突破 1T KRW（$722M），迈入独角兽行列
        - id: competition
          label: 竞争阻力
          description: 直面资本体量庞大的全球竞对（Character.ai、Inflection）
        - id: regulatory
          label: 安全与治理合规
          description: 青少年用户保护机制，以及监管部门对 Crack 潜在的充值 / 使用限制
        - id: multiple
          label: 估值倍数约束
          description: 远期市销率约 5.0 倍，对业务执行出现差错留出的安全边际极为有限
        - id: decision
          label: 最终建议立场
          description: 保持「持有 / 谨慎配置」，严守估值纪律并设置明确的利润率门槛
      edges:
        - from: scale
          to: revenue
        - from: revenue
          to: capital
        - from: capital
          to: competition
        - from: competition
          to: regulatory
        - from: regulatory
          to: multiple
        - from: multiple
          to: decision
    approximationNotes: 本图展示了对披露的运营指标与估值考量门槛进行逻辑综合的完整推导过程。
