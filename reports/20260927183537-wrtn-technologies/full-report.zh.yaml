  - id: FR001
    title: 风险热力图：经证据调整的尽调优先事项
    type: matrix
    summary: 结合潜在影响与证据完备度梳理出的 6 项尽调优先事项，不代表实际发生的事故概率。
    data:
      columns:
        - 证据基础
        - 决策应对
      rows:
        - label: 影响重大 / 发生概率未知
          values:
            - 合规、隐私、版权、未成年人保护与网络安全防线均缺乏直接证据支持
            - 审批前必须调取一手法律文件及内部风控记录
        - label: 影响重大 / 集中度未知
          values:
            - Microsoft 官方文档明确记录了 Azure OpenAI Service 及 o1 模型的使用情况
            - 务必核实工作负载可迁移性、备用协议以及已完成测试的灾备恢复机制
        - label: 影响重大 / 财务可持续性未知
          values:
            - 报道披露巨额融资，但缺乏经审计的账面现金、烧钱速度、现金跑道及清算优先权数据
            - 交叉核对经审计现金流与原始融资协议
        - label: 影响中高 / 执行层面
          values:
            - 公司披露 OOC 销售数据，且年化收入呈加速态势
            - 持续追踪实际业绩、用户队列、收入结构及贡献边际
        - label: 影响中等 / 流动性
          values:
            - 非上市老股退出附带前置条件，且具体转让条款尚未公开
            - 审慎评估锁定期、转让限制权利及真实价格发现机制
        - label: 影响中等 / 数据质量
          values:
            - 公开融资数据库之间存在数据冲突，或对关键字段设置访问权限
            - 以签署生效的正式文件作为终勘依据
    approximationNotes: 定位系分析师根据潜在后果与证据充分性设定的尽调优先级；并非实际测算的发生概率或已披露的事故记录。
