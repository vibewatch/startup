      - number: '8.4'
        title: 估值情景、下行触发因素与尽调要点
        blocks:
          - type: paragraph
            body: >-
              我们的情景模型考察未来 18 至 24 个月内的三种不同经营路径。在乐观情景（25% 概率）下，海外扩张提速叠加模型成本优化，带动收入达到 250 至 300B KRW，对应 6.5x 至 8.0x
              市销率估值倍数，估值区间为 $1.2B 至 $1.7B。在基准情景（50% 概率）下，本土市场领导地位稳固，海外采纳平稳推进，达成 200 至 220B KRW 目标，维持 4.5x 至 5.5x 倍数，估值落在
              $650M 至 $850M。在悲观情景（25% 概率）下，个人用户对尝鲜式 AI 娱乐产生审美疲劳，加上青少年监管限制交易，收入被压缩至 100 至 130B KRW，按 2.5x 至 3.5x
              市销率计算，估值缩水至 $250M 至 $400M。在退出事件之前，核心尽调里程碑包括：核实扣除云端推理成本后的经审计毛利率，以及追踪关键人群画像细分的留存队列。
            claimRefs:
              - CV012
              - CV013
              - CV014
