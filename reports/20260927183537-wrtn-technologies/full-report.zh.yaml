            body: >-
              Wrtn Technologies 已将其收入模式从单一的生产力写作助手，重构为跨越 C端 与企业级的多层 AI 生态系统。核心 C端
              平台采取免费增值模式，免费提供基础对话搜索与多大语言模型交互，以此在韩国和日本展开激进的用户扩张。变现主要依托付费消费级娱乐板块实现，特别是旗下专属的角色聊天服务 Crack 以及北美数字内容平台
              OOC。此外，Wrtn 拥有刚起步的企业 B2B 业务线，为企业客户提供定制开发工作台工具与 API
              集成服务。尽管这些以娱乐为核心的渠道推动整体营收显著加速放量，但受促销折扣、应用商店渠道分成以及尚未公开披露付费转化留存队列的影响，实际可确认收入的透明度依然受限。
