      - number: '1.3'
        title: 股权资本化历程、Series C 轮融资与估值分歧
        blocks:
          - type: paragraph
            body: >-
              Wrtn Technologies 历经六轮独立的股权融资事件，展现出激进的资本募集节奏，自 2021 年以来累计股权融资额大约达到 230B won（介于 $166M 与 $175.9M 之间）[CO005,
              CO006, CO008]。继 2021 年从 Mashup Ventures 获得种子轮注资、2022 年筹集 3.8B won 的 pre-Series A 轮资本，以及 2023 年完成由 Z
              Venture Capital 领投的 15B won Series A 轮融资后，Wrtn 于 2025 年 3 月敲定了具有里程碑意义的 Series B 轮融资，由硅谷投资机构 Goodwater
              Capital 领投，金额总计 108B won [CO005, CO006]。2026 年 8 月 26 日，公司宣布完成 100B won（$72.23M）的 Series C
              轮融资，在原有机构股东基础上新引入了 Coreline Ventures 和 Eugene Asset Management，助推 Wrtn 迈入独角兽阵营
              [CO007]。然而，外部财经媒体对该轮融资的报道暴露出巨大的估值分歧：标准通讯社援引的估值基准为 1.0T won（$722M），彭博社报道称估值为 1.2T won（$870M），首尔经济日报则报道为
              1.4T won（超过 $1.0B）[CO009]。这种宽幅估值落差突显出各方在投前与投后资本化表测算口径、反稀释期权及清算优先权条款上的不同解释，在投资尽职调查中值得严格审计 [CO008, CO009]。
