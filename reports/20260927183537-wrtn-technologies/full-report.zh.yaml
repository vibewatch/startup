              仅记录了一轮融资，与亚洲日报报道的多轮融资历史相冲突。这些信息局限性使得经签署的融资协议和审计后的现金流量表成为决策关键。运营证据同样带有宣传色彩：2026 年收入指引与 OOC
              单月销售额里程碑均为第三方转引的公司口径，而 Antler 2025
              年的投资者新闻稿则展示了早期的角色聊天收入增长。留存证据中未见任何来源提供毛利率、队列留存、资金消耗或业务线集中度数据。因此，已募集的融资金额绝不能等同于可用现金，而账面收入亦不可直接视作经常性收入。
