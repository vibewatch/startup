      - number: '6.3'
        title: Commercial Proof and Production Deployments
        blocks:
          - type: paragraph
            body: >-
              Tangible commercial proof centers on large-scale consumer digital engagement and strategic infrastructure
              partnerships rather than traditional enterprise software logos. Wrtn's production deployment of Microsoft
              Azure OpenAI Service and o1 reasoning models validates the platform's capacity to serve millions of
              concurrent consumer requests while navigating strict regulatory requirements. In consumer entertainment,
              Wrtn demonstrated rapid global product adoption with OOC, an interactive storytelling app launched in
              North America in May 2026 that exceeded ₩10 billion in monthly sales within three months. To further
              deepen consumer mindshare, Wrtn has expanded into entertainment and gaming channels, including sponsoring
              major gaming exhibitions such as G-Star 2026 to engage gaming communities.
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU007
