      - number: '6.4'
        title: Retention Durability, Expansion Loops, and Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              While top-of-funnel customer adoption has been explosive, long-term customer durability faces substantial
              diligence risks due to disclosure opacity and platform dependency. Wrtn has not publicly shared cohort
              retention curves, monthly active user churn rates, or net revenue retention benchmarks across its consumer
              or enterprise products. Consumer conversational entertainment historically suffers from engagement decay
              and rapid novelty fatigue, making recurring subscriber lifetime value uncertain. Additionally, secondary
              market databases such as Caplight and EquityZen show restricted disclosure of financial filings and
              customer health metrics. Heavy dependence on third-party foundation models and cloud infrastructure also
              creates vulnerability to margin compression as user token consumption accelerates.
            claimRefs:
              - CU011
              - CU012
              - CU013
              - CU015
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Monetization Transition from Utility Tools to Interactive Entertainment
            body: >-
              Wrtn's revenue inflection in late 2024 and 2026 demonstrates that consumer willingness-to-pay is
              substantially higher for interactive AI character companionship (Crack) and immersive storytelling (OOC)
              than for commoditized free writing assistants. The rapid scaling to ₩10 billion in monthly sales in North
              America confirms that emotional engagement and entertainment provide stronger consumer pricing power than
              generic productivity utilities.
            calloutType: insight
            claimRefs:
              - CU003
              - CU004
              - CU007
          - type: callout
            title: High Consumer Churn Exposure and Lack of Retention Disclosures
            body: >-
              Despite surpassing 5.4 million monthly active users, Wrtn has disclosed no cohort retention curves, net
              revenue retention (NRR) rates, or customer lifetime value (LTV) metrics. Consumer entertainment
              applications historically experience severe fatigue and high churn; without durable cohort data, long-term
              revenue predictability remains a central diligence vulnerability.
            calloutType: risk
            claimRefs:
              - CU011
              - CU012
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk ranking and evidence boundary
        blocks:
          - type: paragraph
            body: >-
              The highest diligence priority is not a documented incident but the combination of rapid execution demands
              and limited primary risk disclosure. Aju Press and WEEX relayed a KRW 100 billion Series C, approximately
              KRW 230 billion of cumulative financing, and management expectations for more than KRW 200 billion of 2026
              revenue. They also relayed that OOC surpassed KRW 10 billion in monthly sales soon after launch. Those
              figures show scale and ambition, but they do not establish cash available, cash burn, gross margin,
              retention, revenue concentration, or financing preferences. Separately, Microsoft documents use of Azure
              OpenAI Service and o1 models, establishing a material technology relationship without proving sole-source
              dependence. Accordingly, the provisional ranking is: high diligence priority for financial durability and
              legal/security evidence; high impact if cloud/model concentration exists; and medium-high execution
              exposure around international consumer-entertainment growth. Likelihood remains unknown where the pool
              contains no incident history or control evidence.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR014
              - CR015
              - CR016
          - type: figure
