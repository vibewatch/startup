  - id: FR001
    title: 'Risk heatmap: evidence-adjusted diligence priorities'
    type: matrix
    summary: >-
      Six diligence priorities positioned by potential impact and evidence status, without implying observed incident
      probability.
    data:
      columns:
        - Evidence basis
        - Decision response
      rows:
        - label: High impact / likelihood unknown
          values:
            - Legal, privacy, copyright, youth-safety, and security posture lacks direct evidence
            - Require primary legal and control documents before approval
        - label: High impact / concentration unknown
          values:
            - Microsoft documents Azure OpenAI Service and o1 use
            - Verify workload portability, fallback contracts, and tested recovery
        - label: High impact / financial durability unknown
          values:
            - Large reported financing but no audited cash, burn, runway, or preferences
            - Reconcile audited cash and financing documents
        - label: Medium-high impact / execution
          values:
            - Company-reported OOC sales and annual revenue acceleration
            - Track actuals, cohorts, revenue mix, and contribution margin
        - label: Medium impact / liquidity
          values:
            - Private-share exits are conditional and transfer terms are not public
            - Underwrite hold period, transfer rights, and price discovery
        - label: Medium impact / data quality
          values:
            - Public financing datasets conflict or gate decisive fields
            - Use signed documents as the authoritative record
    approximationNotes: >-
      Positions are analyst-defined diligence priorities based on potential consequence and evidence completeness; they
      are not measured probabilities or reported incidents.
