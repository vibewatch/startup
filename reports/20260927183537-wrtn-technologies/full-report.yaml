              - CR006
              - CR010
              - CR011
              - CR014
              - CR015
      - number: '7.3'
        title: Platform, operational, and security exposure
        blocks:
          - type: paragraph
            body: >-
              Microsoft's customer story establishes that Wrtn uses Azure OpenAI Service and o1 models and reports 5.4
              million monthly users. This is evidence of an important supplier relationship and operating scale, not
              proof that Microsoft is the only provider or that Wrtn lacks failover. The risk becomes thesis-relevant if
              core workloads cannot move between models or regions within a tested recovery objective, if pricing
              changes materially impair contribution margin, or if contractual access can be curtailed without an
              adequate substitute. Scale also raises the consequence of moderation, privacy, reliability, and security
              failures, but the assigned pool contains no status page, incident register, penetration test,
              certification, service-level record, or security architecture. Absence of those records in the assigned
              evidence does not prove absence of controls or incidents; it requires direct technical and operational
              diligence before risk can be priced.
            claimRefs:
              - CR006
              - CR007
              - CR015
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR009
              - CR015
              - CR016
      - number: '7.4'
        title: Legal, governance, monitoring, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              No retained primary source establishes Wrtn's litigation, enforcement, privacy, copyright, youth-safety,
              content-governance, data-residency, or regulatory-approval posture. Microsoft says Wrtn addressed complex
              regulatory challenges, but a supplier customer story does not identify jurisdictions, obligations,
              controls, findings, or unresolved matters. Forbes identifies four cofounders, but that historical roster
              does not establish current decision rights, succession, or investor controls. Legal severity is therefore
              framed as potential impact with unknown likelihood, not as an allegation. Before investment committee
              approval, counsel should reconcile the legal-entity and cap-table records, obtain a matter list and
              regulator correspondence, review privacy and content-rights assessments, and inspect security and incident
              materials. Proposed thesis-break triggers are: an undisclosed material legal or regulatory matter;
              inability to evidence rights and safety controls for core content; reliance on a critical model or cloud
              provider without tested recovery; audited cash and burn that imply an unfinanceable runway; or cohort
              economics and gross margin that fail the underwriting case. These are diligence rules, not reported
              company metrics.
            claimRefs:
              - CR006
              - CR008
              - CR011
              - CR012
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR006
              - CR011
              - CR012
              - CR013
              - CR014
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Evidence ceiling
            body: >-
              The retained sources establish funding, growth claims, and Azure OpenAI use but do not establish audited
              economics, legal posture, incident history, concentration, or tested mitigations; investment decisions
              should not convert those absences into favorable assumptions.
            calloutType: risk
            claimRefs:
              - CR003
              - CR006
              - CR011
              - CR012
              - CR014
              - CR015
              - CR016
          - type: callout
            title: Conditional diligence posture
            body: >-
              Advance only after primary legal, security, cloud-contract, cohort, audited-cash, runway, cap-table, and
              preference evidence resolves the high-impact unknowns identified in the registers.
            calloutType: recommendation
            claimRefs:
              - CR011
              - CR012
              - CR014
              - CR015
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Series C Valuation Context
        blocks:
          - type: paragraph
            body: >-
              Wrtn Technologies closed a landmark 100 billion KRW ($72.2 million) Series C funding round in August 2026,
              establishing a post-money valuation exceeding 1 trillion KRW ($722 million) and cementing its status as
              South Korea's first domestic consumer AI unicorn. This financing brought total cumulative fundraising
              across all equity rounds to approximately 230 billion KRW ($166 million). The investment round drew
              backing from new institutional participants Coreline Ventures and Eugene Asset Management alongside
              existing venture sponsors including Goodwater Capital, Antler Global, Capstone Partners, and the Korea
              Development Bank. The headline valuation represents an entry multiple of approximately 5.0x against
              management's projected 2026 revenue of over 200 billion KRW, which represents a substantial acceleration
              from 47.1 billion KRW recorded in 2025. While secondary liquidity avenues have emerged on platforms like
              EquityZen for accredited investors, disciplined capital allocation warrants maintaining cautious entry
              limits that reflect unproven operating leverage.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV010
              - CV012
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV012
              - CV013
      - number: '8.2'
        title: Monetization Traction and Recommendation Logic
        blocks:
          - type: paragraph
            body: >-
              Wrtn's operational scaling has been propelled by rapid consumer adoption across domestic and international
              markets, supported by Microsoft Azure OpenAI Service infrastructure that powers an active base of over 5.4
              million monthly users. The company's international expansion demonstrated immediate commercial traction
              through its North American AI entertainment platform OOC, which generated more than 10 billion KRW ($7.22
              million) in monthly revenue within three months of its May 2026 launch. When evaluated through our
              analytical framework, this monetization inflection supports a baseline valuation range of $550 million to
              $720 million. However, the high compute intensity required to support complex multi-modal interactions and
              third-party foundation model APIs introduces structural gross margin uncertainty. Consequently, the
              analytical sequence from platform scale and commercial proof to cost structure hurdles dictates a Hold
              recommendation at current private round valuations.
            claimRefs:
              - CV005
              - CV006
              - CV012
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV009
              - CV012
      - number: '8.3'
        title: Anti-Thesis Counterarguments and Competitive Dynamics
        blocks:
          - type: paragraph
            body: >-
              The central counterargument to Wrtn's valuation multiple lies in intense market competition and platform
              substitution risks. Tracxn benchmarks identify Wrtn as fifth among 898 active competitors in natural
              language and conversational AI tools, facing heavily funded international category leaders such as
              Character.ai and Inflection, which have accumulated $193 million and $1.52 billion in funding
              respectively. Furthermore, domestic and regional AI peers including Upstage, Quora, and ScatterLab present
              persistent alternatives across consumer workflows. Wrtn's entertainment-oriented offerings, particularly
              the Crack AI character chat service, face increasing scrutiny concerning adolescent user safety. In
              response, management is instituting tighter youth protection controls including usage duration caps,
              mandatory parental consent, and microtransaction spending limits. These measures introduce execution risk
              and potential top-line friction that could dampen consumer engagement momentum.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
      - number: '8.4'
        title: Valuation Scenarios, Downside Triggers, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Our scenario model examines three distinct operational trajectories over an 18 to 24 month horizon. In the
              Bull case (25% probability), accelerated international scaling and model cost optimizations support
              revenue reaching 250 to 300 billion KRW, commanding a 6.5x to 8.0x revenue multiple and a valuation
              between $1.2 billion and $1.7 billion. In the Base case (50% probability), stable domestic market
              leadership and steady international adoption achieve the 200 to 220 billion KRW target, maintaining a
              multiple of 4.5x to 5.5x and valuation between $650 million and $850 million. The Bear case (25%
              probability) models consumer fatigue in novelty AI entertainment and youth regulatory transaction curbs,
              compressing revenue to 100 to 130 billion KRW and shrinking valuation to $250 million to $400 million at
              2.5x to 3.5x sales. Crucial diligence milestones prior to an exit event include validating audited gross
              margins after cloud inference costs and tracking user retention cohorts across key demographic segments.
            claimRefs:
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV004
              - CV012
              - CV013
              - CV014
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Entry Discipline and Valuation Stance
            body: >-
              Investors should maintain strict valuation discipline around the 1 trillion KRW ($722 million) Series C
              valuation benchmark. While top-line growth to over 200 billion KRW is impressive, high capital intensity
              from foundation model API inference requires confirmed operating leverage before underwriting valuation
              expansion.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV012
          - type: callout
            title: Youth Regulatory and Platform Governance Exposure
            body: >-
              The rapid monetization of entertainment services such as Crack and OOC introduces regulatory exposure
              regarding minor protection. Implemented safeguards including time limits and parental consent must be
              monitored against emerging regulatory frameworks in South Korea and North America.
            calloutType: risk
            claimRefs:
              - CV005
              - CV009
              - CV014
