  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Portfolio and Workflow Integration
        blocks:
          - type: paragraph
            body: >-
              Wrtn Technologies delivers a dual-track generative AI product suite spanning consumer applications and
              enterprise B2B transformation services [CE001]. At the consumer tier, the core Wrtn superapp aggregates
              multi-LLM access for search, copywriting, and general-purpose conversational productivity, scaling past
              5.4 million monthly active users in South Korea [CE001, CE003]. To drive consumer engagement beyond
              standard work tasks, Wrtn launched interactive AI entertainment services including Crack (formerly
              Character Chat) in South Korea and Kyarapu in Japan, the latter reaching a reported 1 billion yen annual
              recurring revenue run rate [CE001, CE007]. On the enterprise side, the company established Wrtn AX (AI
              Transformation) as a dedicated Company-in-Company (CIC) unit alongside specialized Code Agent and Internal
              Agent teams to execute custom automation and generative agent deployments for commercial enterprises and
              government institutions [CE001, CE008]. Wrtn initially achieved rapid domestic adoption by offering
              completely free access to leading generative models, establishing a widespread user base before
              introducing monetized B2B transformation solutions and localized agent frameworks [CE008, CE009].
            claimRefs:
              - CE001
              - CE003
              - CE007
