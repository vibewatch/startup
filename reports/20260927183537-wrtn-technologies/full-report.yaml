            body: >-
              Wrtn's forward capital adequacy is supported by its August 2026 Series C financing round, which raised 100
              billion won ($69M to $72M USD) at an official valuation benchmark of 1 trillion won, establishing the
              company as South Korea's first consumer AI unicorn. Total cumulative funding reached approximately 230
              billion won across six completed investment rounds, providing significant runway buffer to support global
              expansion and content marketing. However, private market valuation benchmarks vary, with private comps
              estimating enterprise value at $693 million (a 5.0x multiple on $139 million recorded revenue). Secondary
              market activity on EquityZen demonstrates early shareholder and employee liquidity requests, alongside
              standard pre-IPO transfer risks. From an underwriting perspective, while Wrtn exhibits exceptional
              top-line revenue velocity, investment commitment requires strict diligence into audited gross margins,
              compute unit economics, and churn rates.
