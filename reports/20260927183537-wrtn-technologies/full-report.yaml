  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Product Layers, and Spend Segmentation
        blocks:
          - type: paragraph
            body: >-
              The addressable market for Wrtn Technologies spans two distinct but structurally interconnected segments:
              free-to-use general-purpose consumer AI utility and paid interactive digital entertainment. In its
              domestic market of South Korea, Wrtn functions as an everyday AI hub offering multi-model conversational
              search, document analysis, and text generation, accumulating more than 5.4 million monthly active users.
              However, direct consumer willingness to pay for standalone text completion and generic chat utility
              remains constrained by aggressive competition from subsidized global frontier model assistants.
              Consequently, Wrtn treats consumer utility as an acquisition funnel rather than its primary monetization
              engine, deliberately excluding enterprise workflow licenses and subscription paywalls from its core B2C
              utility layer.


              The commercial core of Wrtn's business sits within interactive AI fiction and character entertainment,
              represented by its regional applications Crack in South Korea, Kyarapu in Japan, and OOC in North America.
              This market captures discretionary digital entertainment budgets traditionally directed toward mobile
              webtoons, light novels, visual novels, and gacha gaming economies. Rather than selling recurring software
              subscriptions, Wrtn monetizes through consumption-metered virtual currency where users spend purchased
              credit packs on story progression, image generation, and premium model routing. This bifurcation
              establishes a clear boundary: top-of-funnel user growth is measured by monthly active engagement on
              utility workflows, while revenue velocity is governed by virtual credit expenditure across high-engagement
              fandom storytelling communities.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM004
              - CM005
              - CM014
      - number: '2.2'
        title: Addressable Market Sizing, Geographic Expansion, and Monetization Lenses
        blocks:
          - type: paragraph
            body: >-
              Evaluating Wrtn's addressable market requires sizing both the broad consumer generative AI software market
              and the narrower, high-monetization interactive fiction niche. Industry estimates project South Korea's
              broader domestic software market at tens of billions of dollars, but the serviceable addressable market
              for domestic AI utility services remains a fraction of that total. Wrtn demonstrated initial commercial
              validation when monthly revenue from its character chat services scaled from 1 billion KRW in November
              2024 to 2 billion KRW in December 2024, followed by rapid international expansion. By April 2026, Crack
              and Kyarapu reached a combined monthly run-rate exceeding $8.0M on a user base of fewer than 500,000
              monthly active users, demonstrating an average monthly revenue per active user surpassing $16.00 among
              paying cohorts.


              Geographic diversification has significantly expanded Wrtn's serviceable obtainable market. The launch of
              OOC in North America in May 2026 yielded immediate commercial acceleration, surpassing 10 billion KRW
              ($7.2M) in monthly sales within three months of release. By August 2026, international revenue generated
              outside South Korea surpassed domestic earnings for the first time in company history. Independent
              financial analysis estimates Wrtn's full-year 2025 revenue at $33.0M—a fifteenfold increase over its 2024
              baseline of $2.2M—with internal management targets aiming for $145.0M in 2026 across consumer storytelling
              and early enterprise transformation initiatives. Despite this rapid expansion, long-term sizing remains
              constrained by model inference overhead and customer acquisition dynamics across competitive Western app
              ecosystems.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
