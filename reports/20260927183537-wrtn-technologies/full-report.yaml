      - number: '5.3'
        title: Safety Governance and Infrastructure Dependencies
        blocks:
          - type: paragraph
            body: >-
              To support millions of daily conversational turns while maintaining operational stability, Wrtn anchors
              its production infrastructure on Microsoft Azure OpenAI Service [CE002, CE003]. This infrastructure
              integration provides enterprise compliance, regional low-latency networking in East Asia, and early access
              to frontier reasoning models including OpenAI o1 [CE002, CE005]. In conjunction with cloud-level
              safeguards, Wrtn incorporates open-source safety frameworks, notably maintaining an active fork of
              NVIDIA's NeMo-Guardrails to implement programmable conversational guardrails, prompt sanitization, and
              output moderation rules across both consumer character chats and enterprise agents [CE006]. The company
              established explicit AI ethics guidelines prior to commercial deployment, addressing regulatory compliance
              in public sector engagements [CE002, CE006]. Nevertheless, relying on external cloud providers creates
              critical operating vulnerabilities, including exposure to sudden upstream API outages, model deprecation
              schedules, and regional quota throttling during peak traffic events [CE002, CE011].
            claimRefs:
              - CE002
              - CE003
              - CE005
              - CE006
              - CE011
      - number: '5.4'
        title: Technical Differentiation and Operating Risks
        blocks:
          - type: paragraph
            body: >-
              Wrtn's disclosed differentiation centers on localized user experience, cloud-model integration, and
              developer agent tooling [CE002, CE005, CE014]. In the domestic Korean market, market comps tracked by
              private data platforms such as Caplight position Wrtn alongside Upstage and Scatter Lab, while Wrtn's
              disclosed product portfolio spans a broad consumer superapp and enterprise automation work [CE001, CE014].
              Wrtn's August 2026 Series C round of 100 billion KRW establishes financing scale, but substantial
              diligence questions remain regarding technical durability [CE011, CE013]. Reliance on third-party
              foundation-model infrastructure creates potential margin and availability exposure as token usage scales
              [CE011]. Furthermore, the retained public evidence does not provide verifiable enterprise service-level
              agreements, formal latency benchmarks, or uptime records for Wrtn AX deployments, leaving mission-critical
              enterprise readiness unresolved [CE008, CE011].
            claimRefs:
              - CE005
              - CE008
              - CE011
              - CE013
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Rapid Consumer Scale and Localized Engagement
            body: >-
              Wrtn has established dominant consumer mindshare in South Korea with over 5.4 million monthly active users
              by aggregating premier foundation models under an accessible, localized interface. By combining
              general-purpose writing utilities with character entertainment (Crack) and regional expansion into Japan
              (Kyarapu), Wrtn drives top-of-funnel consumer adoption that serves as distribution leverage for its
              enterprise transformation pipeline.
            calloutType: strength
            claimRefs:
              - CE001
              - CE003
              - CE007
              - CE009
          - type: callout
            title: Upstream Model Dependency and Margin Fragility
            body: >-
              Microsoft documents Wrtn's use of Azure OpenAI Service and o1 models, while the retained public evidence
              does not establish supplier concentration, portability, or fallback capacity. Platform unit economics and
              availability therefore remain exposed to potential foundation-model API pricing changes, token rate
              limits, and latency spikes outside Wrtn's direct operational control.
            calloutType: risk
            claimRefs:
              - CE002
              - CE011
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Buyer Personas
        blocks:
          - type: paragraph
            body: >-
              Wrtn Technologies structures its customer base across three primary tiers: free consumer portal users,
              paying consumer entertainment subscribers, and emerging enterprise AI transformation clients. The consumer
              portal serves as the core user acquisition funnel, offering conversational search, image generation, and
              multi-model AI utilities to over 5.4 million monthly active users across South Korea and Japan. Within
              this consumer population, Wrtn has introduced specialized entertainment products—most notably its
              character dialogue service Crack and its North American storytelling application OOC—which convert engaged
              free users into paying digital consumers through subscription and token models. A third commercial
              segment, Wrtn AX, targets corporate enterprises and public institutions seeking workflow automation and
              customized AI agents, though contract numbers and commercial scale remain opaque.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
