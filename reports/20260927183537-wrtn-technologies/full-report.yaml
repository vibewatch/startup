      - number: '6.2'
        title: Adoption Trajectory and User Acquisition Velocity
        blocks:
          - type: paragraph
            body: >-
              Wrtn's user adoption trajectory demonstrates rapid consumer scaling within the East Asian AI landscape.
              Launching publicly in early 2023, the platform expanded from 2 million monthly active users in mid-2024 to
              surpass 5 million monthly active users by October 2024, achieving the 5 million milestone in 1 year and 10
              months. This user acquisition pace outstripped benchmark domestic consumer platforms including fintech
              unicorn Toss and hyper-local marketplace Karrot. By January 2025, active platform users topped 5.4
              million, supported by Microsoft Azure OpenAI infrastructure and specialized reasoning models.
              Concurrently, monetization inflected from ₩1 billion in monthly revenue in November 2024 to ₩2 billion in
              December 2024, driven primarily by user adoption of interactive character chat features.
            claimRefs:
              - CU002
              - CU004
              - CU006
              - CU007
              - CU009
          - type: table
            tableRef: TU002
