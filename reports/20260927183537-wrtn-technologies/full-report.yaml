        title: Commercial Traction and Scaling Dynamics
        blocks:
          - type: paragraph
            body: >-
              The company's commercial traction accelerated sharply between late 2024 and mid-2026, transitioning from
              nascent monetization to substantial top-line momentum. In November 2024, Wrtn achieved monthly revenue of
              1 billion KRW, which doubled to 2 billion KRW by December 2024, powered largely by early user adoption of
              character chat features. Growth accelerated further following the international launch of OOC in North
              America in May 2026, which surpassed 10 billion KRW in monthly sales within its first three months.
              Management has projected total annual revenue to exceed 200 billion KRW for 2026, while third-party
              private market data tracked revenue at $139 million as of August 2026. This performance implies rapid
              consumer willingness to pay for interactive AI entertainment, though long-term revenue durability and
              repeat spending behavior remain unproven over extended economic cycles.
            claimRefs:
