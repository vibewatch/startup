      - number: '4.3'
        title: Cost Structure, Inference Overhead, and Unit Economics
        blocks:
          - type: paragraph
            body: >-
              Wrtn's operating cost structure is characterized by high variable service-delivery expenses dominated by
              third-party model inference fees. Operating as an aggregator of frontier foundation models rather than a
              vertically integrated model trainer, Wrtn relies heavily on hyperscaler cloud infrastructure, specifically
              Microsoft's Azure OpenAI Service and advanced reasoning models such as OpenAI o1. Serving more than 5.4
              million monthly active users creates substantial compute overhead that scales directly with user prompt
              volume, session length, and context window depth. Because core unit-economic metrics—including customer
              acquisition cost, payback duration, gross margin after compute pass-through, and net revenue retention—are
              withheld from public filings, an independent auditor cannot verify whether consumer entertainment revenue
              generates durable gross profits or merely subsidies for frontier AI inference.
            claimRefs:
