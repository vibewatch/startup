              - CR014
              - CR015
              - CR016
      - number: '7.2'
        title: Financial durability, capitalization, and execution
        blocks:
          - type: paragraph
            body: >-
              Public financing coverage is directionally consistent on a large 2026 Series C but is not sufficient to
              underwrite runway or investor downside. Caplight lists financing rounds while omitting public amount and
              valuation fields and withholding filing documents; EquityZen gates valuation, cap-table, preference,
              revenue, financial, and risk-factor data behind enrollment and accreditation. Raising.fi reports only one
              round, conflicting with Aju Press's multi-round history. These limitations make signed financing documents
              and audited cash statements decision-critical. Operating evidence is also promotional: the 2026 revenue
              expectation and OOC monthly-sales milestone are company-originated claims relayed by third parties, while
              Antler's 2025 investor release shows earlier character-chat revenue growth. No retained source provides
              gross margin, cohort retention, cash usage, or segment concentration. Funding raised must therefore not be
              treated as cash available, and revenue must not be treated as recurring revenue.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
