      - number: '5.2'
        title: System Architecture and Agent Runtimes
        blocks:
          - type: paragraph
            body: >-
              Wrtn's disclosed technical architecture includes model integration, orchestration, routing, and agent
              execution layers [CE002, CE004, CE005]. The system coordinates user requests across client interfaces into
              specialized agent runtimes developed under the Wrtn Labs research banner [CE004, CE005]. Key open-source
              infrastructure components include AC (Agent Core), an application-agnostic agent runtime implemented in
              Rust for high-throughput concurrency, and Agentica, a TypeScript function-calling framework that uses
              compiler techniques to validate tool execution arguments before dispatching calls to foundation models
              [CE004, CE005]. For software development automation, Wrtn Labs published experimental tools such as AutoBE
              for TypeScript backend generation [CE010]. Microsoft documents use of Azure OpenAI Service and o1 models,
              so portability, vendor exposure, and proprietary-model ownership remain diligence questions rather than
              verified conclusions [CE002, CE011].
            claimRefs:
