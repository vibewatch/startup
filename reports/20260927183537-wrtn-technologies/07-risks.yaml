company:
  name: "Wrtn Technologies"
chapter:
  number: 7
  title: "Risks"
  summary: "Wrtn's clearest evidenced exposures are execution against rapid company-reported growth, reliance on Microsoft Azure OpenAI Service and o1 models, and financing opacity despite approximately KRW 230 billion of reported cumulative funding. The assigned evidence does not establish litigation, enforcement, security-incident, outage, audited cash, runway, cap-table, concentration, or mitigation status, so those items remain diligence risks rather than reported adverse events."
sections:
  - id: "risk-ranking-and-evidence-boundary"
    title: "Risk ranking and evidence boundary"
    body: >-
      The highest diligence priority is not a documented incident but the combination of rapid
      execution demands and limited primary risk disclosure. Aju Press and WEEX relayed a
      KRW 100 billion Series C, approximately KRW 230 billion of cumulative financing, and
      management expectations for more than KRW 200 billion of 2026 revenue. They also relayed
      that OOC surpassed KRW 10 billion in monthly sales soon after launch. Those figures show
      scale and ambition, but they do not establish cash available, cash burn, gross margin,
      retention, revenue concentration, or financing preferences. Separately, Microsoft
      documents use of Azure OpenAI Service and o1 models, establishing a material technology
      relationship without proving sole-source dependence. Accordingly, the provisional ranking
      is: high diligence priority for financial durability and legal/security evidence; high
      impact if cloud/model concentration exists; and medium-high execution exposure around
      international consumer-entertainment growth. Likelihood remains unknown where the pool
      contains no incident history or control evidence.
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR004"
      - "CR005"
      - "CR006"
      - "CR014"
      - "CR015"
      - "CR016"
    figureRefs:
      - "FR001"
  - id: "financial-and-execution-risk"
    title: "Financial durability, capitalization, and execution"
    body: >-
      Public financing coverage is directionally consistent on a large 2026 Series C but is not
      sufficient to underwrite runway or investor downside. Caplight lists financing rounds while
      omitting public amount and valuation fields and withholding filing documents; EquityZen
      gates valuation, cap-table, preference, revenue, financial, and risk-factor data behind
      enrollment and accreditation. Raising.fi reports only one round, conflicting with Aju
      Press's multi-round history. These limitations make signed financing documents and audited
      cash statements decision-critical. Operating evidence is also promotional: the 2026
      revenue expectation and OOC monthly-sales milestone are company-originated claims relayed
      by third parties, while Antler's 2025 investor release shows earlier character-chat revenue
      growth. No retained source provides gross margin, cohort retention, cash usage, or segment
      concentration. Funding raised must therefore not be treated as cash available, and revenue
      must not be treated as recurring revenue.
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR004"
      - "CR005"
      - "CR008"
      - "CR009"
      - "CR010"
      - "CR011"
      - "CR012"
      - "CR013"
      - "CR014"
    tableRefs:
      - "TR003"
  - id: "platform-operational-and-security-risk"
    title: "Platform, operational, and security exposure"
    body: >-
      Microsoft's customer story establishes that Wrtn uses Azure OpenAI Service and o1 models
      and reports 5.4 million monthly users. This is evidence of an important supplier
      relationship and operating scale, not proof that Microsoft is the only provider or that
      Wrtn lacks failover. The risk becomes thesis-relevant if core workloads cannot move between
      models or regions within a tested recovery objective, if pricing changes materially impair
      contribution margin, or if contractual access can be curtailed without an adequate
      substitute. Scale also raises the consequence of moderation, privacy, reliability, and
      security failures, but the assigned pool contains no status page, incident register,
      penetration test, certification, service-level record, or security architecture. Absence
      of those records in the assigned evidence does not prove absence of controls or incidents;
      it requires direct technical and operational diligence before risk can be priced.
    claimRefs:
      - "CR006"
      - "CR007"
      - "CR015"
      - "CR016"
    tableRefs:
      - "TR002"
  - id: "legal-governance-and-kill-criteria"
    title: "Legal, governance, monitoring, and kill criteria"
    body: >-
      No retained primary source establishes Wrtn's litigation, enforcement, privacy,
      copyright, youth-safety, content-governance, data-residency, or regulatory-approval
      posture. Microsoft says Wrtn addressed complex regulatory challenges, but a supplier
      customer story does not identify jurisdictions, obligations, controls, findings, or
      unresolved matters. Forbes identifies four cofounders, but that historical roster does not
      establish current decision rights, succession, or investor controls. Legal severity is
      therefore framed as potential impact with unknown likelihood, not as an allegation. Before
      investment committee approval, counsel should reconcile the legal-entity and cap-table
      records, obtain a matter list and regulator correspondence, review privacy and content-rights
      assessments, and inspect security and incident materials. Proposed thesis-break triggers are:
      an undisclosed material legal or regulatory matter; inability to evidence rights and safety
      controls for core content; reliance on a critical model or cloud provider without tested
      recovery; audited cash and burn that imply an unfinanceable runway; or cohort economics and
      gross margin that fail the underwriting case. These are diligence rules, not reported
      company metrics.
    claimRefs:
      - "CR006"
      - "CR008"
      - "CR011"
      - "CR012"
      - "CR014"
      - "CR015"
      - "CR016"
    tableRefs:
      - "TR001"
