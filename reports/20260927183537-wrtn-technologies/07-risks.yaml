        - label: "High impact / concentration unknown"
          values:
            - "Microsoft documents Azure OpenAI Service and o1 use"
            - "Verify workload portability, fallback contracts, and tested recovery"
        - label: "High impact / financial durability unknown"
          values:
            - "Large reported financing but no audited cash, burn, runway, or preferences"
            - "Reconcile audited cash and financing documents"
        - label: "Medium-high impact / execution"
          values:
