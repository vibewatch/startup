    title: "Rapid Consumer Scale and Localized Engagement"
    body: "Wrtn has established dominant consumer mindshare in South Korea with over 5.4 million monthly active users by aggregating premier foundation models under an accessible, localized interface. By combining general-purpose writing utilities with character entertainment (Crack) and regional expansion into Japan (Kyarapu), Wrtn drives top-of-funnel consumer adoption that serves as distribution leverage for its enterprise transformation pipeline."
    claimRefs:
      - "CE001"
      - "CE003"
      - "CE007"
      - "CE009"
  - calloutType: "risk"
    title: "Upstream Model Dependency and Margin Fragility"
    body: "Microsoft documents Wrtn's use of Azure OpenAI Service and o1 models, while the retained public evidence does not establish supplier concentration, portability, or fallback capacity. Platform unit economics and availability therefore remain exposed to potential foundation-model API pricing changes, token rate limits, and latency spikes outside Wrtn's direct operational control."
    claimRefs:
      - "CE002"
      - "CE011"
