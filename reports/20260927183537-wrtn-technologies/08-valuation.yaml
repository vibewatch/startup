callouts:
  - calloutType: recommendation
    title: Entry Discipline and Valuation Stance
    body: Investors should maintain strict valuation discipline around the 1 trillion KRW ($722 million) Series C valuation benchmark. While top-line growth to over 200 billion KRW is impressive, high capital intensity from foundation model API inference requires confirmed operating leverage before underwriting valuation expansion.
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV012
  - calloutType: risk
    title: Youth Regulatory and Platform Governance Exposure
    body: The rapid monetization of entertainment services such as Crack and OOC introduces regulatory exposure regarding minor protection. Implemented safeguards including time limits and parental consent must be monitored against emerging regulatory frameworks in South Korea and North America.
    claimRefs:
      - CV005
      - CV009
      - CV014
