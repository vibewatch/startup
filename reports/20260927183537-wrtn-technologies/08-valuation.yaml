    title: Recommendation summary table
    columns:
      - Dimension
      - Rating / Value
      - Benchmark / Context
      - Decision Implication
    rows:
      - - Recommendation
        - Hold / Cautious Allocation
        - Series C entry price fully values current growth
        - Maintain strict valuation caps; require margin verification
      - - Confidence Level
        - Medium
        - Strong user scale and revenue run-rate; unverified gross margins
        - Phase capital commitments subject to unit-economics diligence
      - - Risk Rating
        - High
        - Fierce competition from global AI platforms and model suppliers
        - Underwrite assuming substantial platform and regulatory buffers
      - - Valuation Stance
        - Fully Valued
        - $722M post-money on >200B KRW projected revenue (~5.0x forward)
        - Do not chase secondary premiums above the Series C baseline
      - - Target Return / Horizon
        - 2.5x - 3.5x over 3-5 Years
        - Assumes potential IPO on KRX or international exchange by 2028-2029
        - Target exit valuation of $1.8B-$2.5B on sustained 30%+ net margins
    notes: Valuation stance and recommendation synthesize Series C round terms, 2026 revenue projections, and secondary liquidity options.
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV012
      - CV013
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Pillar
      - Investment Thesis
      - Anti-Thesis Counterargument
      - Thesis-Break Indicator
    rows:
      - - Consumer AI Leadership
        - Dominant South Korean AI superapp with 5.4M MAU and rapid consumer adoption
        - Low switching barriers with commoditized foundational models from OpenAI and Google
        - Monthly active user contraction or negative net user additions over two consecutive quarters
      - - Monetization Scaling
        - Rapid revenue inflection reaching >200B KRW annualized with OOC exceeding 10B KRW monthly
        - High consumer churn and reliance on novelty entertainment content without sticky workflows
        - Monthly OOC revenue decay below 5B KRW or sharp spike in user acquisition costs
      - - Global Expansion
        - Proven multi-geography traction across North America and Japan with localized platforms
        - Disadvantage against heavily funded US competitors like Character.ai and Inflection
        - Failure to secure durable market share outside Korea or prohibitive international CAC
      - - Governance & Safety
        - Proactive implementation of teen safeguards and parental controls on Crack platform
        - Heightened regulatory scrutiny over youth AI engagement and potential spending restrictions
        - Regulatory enforcement actions or mandatory severe transaction caps in key operating jurisdictions
    notes: Thesis pillars evaluated against available revenue disclosures, competitor benchmarks, and platform safety notices.
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
