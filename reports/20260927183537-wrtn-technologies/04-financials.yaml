    title: "Inference Cost Exposure and Secondary Market Liquidity Signals"
    body: "Wrtn's rapid top-line expansion relies heavily on frontier model APIs, notably Microsoft Azure OpenAI Service and o1 reasoning models, creating structural gross margin vulnerability if inference costs outpace consumer monetization. Concurrently, secondary share trading on platforms like EquityZen signals early employee liquidity demand while highlighting private market illiquidity risks."
    claimRefs:
      - "CI009"
      - "CI010"
      - "CI011"
      - "CI012"
  - calloutType: "insight"
    title: "Entertainment Monetization Drives Revenue Velocity"
    body: "Wrtn's financial acceleration from 1 billion KRW monthly run-rate in late 2024 to over 10 billion KRW monthly on the North American 'OOC' platform demonstrates that conversational AI entertainment and digital character interactions monetize significantly faster than general utility writing assistants."
    claimRefs:
