company:
  name: "Wrtn Technologies"
chapter:
  number: 4
  title: "Financials"
  summary: "Wrtn Technologies transitioned from an early writing utility into a diversified consumer AI platform generating over 10 billion KRW in monthly global entertainment run-rate by mid-2026. The company closed a 100 billion won Series C round at a 1 trillion won valuation, but gross margins remain exposed to third-party model inference costs while audited unit economics remain private."
sections:
  - id: "revenue-streams-and-pricing-model"
    title: "Revenue Streams and Monetization Architecture"
    body: "Wrtn Technologies has restructured its revenue model from a narrow productivity writing assistant toward a multi-tier consumer and enterprise AI ecosystem. The core consumer platform operates on a freemium model where basic conversational search and multi-LLM interactions are provided free of charge, driving aggressive user acquisition across South Korea and Japan. Monetization is achieved primarily through paid consumer entertainment, notably its dedicated character chat service Crack and its North American digital content platform OOC. In addition, Wrtn maintains an emerging enterprise B2B tier offering custom studio tools and API integrations for corporate clients. While top-line expansion has accelerated markedly across these entertainment-centric channels, realized revenue visibility remains constrained by promotional discounting, platform store revenue shares, and an absence of publicly disclosed subscriber conversion cohorts."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI004"
      - "CI009"
    tableRefs:
      - "TI001"
  - id: "monetization-mechanics-and-traction"
    title: "Commercial Traction and Scaling Dynamics"
    body: "The company's commercial traction accelerated sharply between late 2024 and mid-2026, transitioning from nascent monetization to substantial top-line momentum. In November 2024, Wrtn achieved monthly revenue of 1 billion KRW, which doubled to 2 billion KRW by December 2024, powered largely by early user adoption of character chat features. Growth accelerated further following the international launch of OOC in North America in May 2026, which surpassed 10 billion KRW in monthly sales within its first three months. Management has projected total annual revenue to exceed 200 billion KRW for 2026, while third-party private market data tracked revenue at $139 million as of August 2026. This performance implies rapid consumer willingness to pay for interactive AI entertainment, though long-term revenue durability and repeat spending behavior remain unproven over extended economic cycles."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI004"
      - "CI006"
      - "CI007"
    tableRefs:
      - "TI002"
    figureRefs:
      - "FI001"
  - id: "cost-structure-and-unit-economics"
    title: "Cost Structure, Inference Overhead, and Unit Economics"
    body: "Wrtn's operating cost structure is characterized by high variable service-delivery expenses dominated by third-party model inference fees. Operating as an aggregator of frontier foundation models rather than a vertically integrated model trainer, Wrtn relies heavily on hyperscaler cloud infrastructure, specifically Microsoft's Azure OpenAI Service and advanced reasoning models such as OpenAI o1. Serving more than 5.4 million monthly active users creates substantial compute overhead that scales directly with user prompt volume, session length, and context window depth. Because core unit-economic metrics—including customer acquisition cost, payback duration, gross margin after compute pass-through, and net revenue retention—are withheld from public filings, an independent auditor cannot verify whether consumer entertainment revenue generates durable gross profits or merely subsidies for frontier AI inference."
    claimRefs:
      - "CI009"
      - "CI010"
      - "CI013"
      - "CI014"
    tableRefs:
      - "TI003"
  - id: "capital-adequacy-and-financial-verdict"
    title: "Capital Adequacy, Valuation Benchmarks, and Diligence Verdict"
    body: "Wrtn's forward capital adequacy is supported by its August 2026 Series C financing round, which raised 100 billion won ($69M to $72M USD) at an official valuation benchmark of 1 trillion won, establishing the company as South Korea's first consumer AI unicorn. Total cumulative funding reached approximately 230 billion won across six completed investment rounds, providing significant runway buffer to support global expansion and content marketing. However, private market valuation benchmarks vary, with private comps estimating enterprise value at $693 million (a 5.0x multiple on $139 million recorded revenue). Secondary market activity on EquityZen demonstrates early shareholder and employee liquidity requests, alongside standard pre-IPO transfer risks. From an underwriting perspective, while Wrtn exhibits exceptional top-line revenue velocity, investment commitment requires strict diligence into audited gross margins, compute unit economics, and churn rates."
    claimRefs:
      - "CI005"
      - "CI006"
      - "CI007"
      - "CI008"
      - "CI011"
      - "CI012"
      - "CI013"
