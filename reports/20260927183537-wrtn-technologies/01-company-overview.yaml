chapter:
  number: 1
  title: "Company Overview"
  summary: "Wrtn Technologies is a Seoul-based generative AI platform founded in April 2021 that scaled from a free Korean writing assistant to a multi-product consumer AI ecosystem with 5.4 million monthly active users. In August 2026, the company completed a 100 billion won ($72 million) Series C funding round at a 1 trillion won ($722 million to over $1 billion) valuation, driven by overseas growth from its North American storytelling platform OOC."
sections:
  - id: "identity-and-mission"
    title: "Corporate Identity, Founding, and Core Mission"
    body: "Wrtn Technologies Inc. is a Seoul-based generative artificial intelligence technology company established in April 2021 by Chief Executive Officer Lee Se-young alongside a team of four co-founders [CO001, CO003]. The company operates with the overarching strategic mission of making Artificial General Intelligence (AGI) and frontier conversational AI interfaces accessible, intuitive, and practical for everyday consumers [CO001]. Originally conceived as an AI-powered writing assistant to alleviate declining writing skills and boost personal productivity, Wrtn deployed its early technology through KakaoTalk conversational channels and web portals without requiring complex software installations [CO002]. Over the subsequent five years, Wrtn methodically broadened its product portfolio into an integrated consumer 'superapp' combining conversational search, document creation, presentation generation, and interactive entertainment [CO002]. Headquartered in Seoul, South Korea, Wrtn has emerged as one of the country's most visible consumer AI enterprises, positioning itself as a platform layer between underlying foundation models and regional end users [CO001, CO002]."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
    tableRefs:
      - "TO001"
  - id: "leadership-and-governance"
    title: "Founding Leadership, Technical Governance, and Key-Person Dependency"
    body: "Wrtn was founded by Lee Se-young, Lee Dong-jae, Jae Sung-won, and Yoo Young-joon, an entrepreneurial cohort whose early achievements earned them recognition in Forbes' 30 Under 30 Asia list for Consumer Technology in 2024 [CO003]. Executive governance centers heavily around CEO Lee Se-young, who has acted as the primary spokesperson, corporate architect, and capital raiser across every institutional round from seed through Series C [CO004]. Operational and technical execution is divided among the founding group, with co-founders managing product direction, platform engineering, and ecosystem distribution [CO003]. While this founding cohesion has enabled rapid product iteration and agile pivots—most notably from a pure writing utility into character-based entertainment—the company exhibits material key-person dependence on Lee Se-young for institutional investor relationships, external governance, and strategic vision [CO004]. As Wrtn expands aggressively into overseas markets including North America and Japan, institutionalizing secondary executive tiers and independent board oversight represents a critical governance milestone for mitigating operational concentration risks [CO003, CO004]."
    claimRefs:
      - "CO003"
      - "CO004"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-valuation"
    title: "Capitalization History, Series C Funding, and Valuation Divergence"
    body: "Wrtn Technologies has executed an aggressive capital raising trajectory across six distinct financing events, accumulating roughly 230 billion won (between $166 million and $175.9 million) in cumulative equity funding since 2021 [CO005, CO006, CO008]. After closing seed funding from Mashup Ventures in 2021, pre-Series A capital of 3.8 billion won in 2022, and a 15 billion won Series A led by Z Venture Capital in 2023, Wrtn completed a landmark Series B financing in March 2025 totaling 108 billion won led by Silicon Valley-based Goodwater Capital [CO005, CO006]. On August 26, 2026, the company announced the completion of a 100 billion won ($72.23 million) Series C financing that introduced Coreline Ventures and Eugene Asset Management alongside existing institutional backers, elevating Wrtn to unicorn status [CO007]. However, external financial reporting on the round revealed substantial valuation divergence: while standard wire services cited a baseline of 1.0 trillion won ($722 million), Bloomberg reported 1.2 trillion won ($870 million), and Seoul Economic Daily cited 1.4 trillion won (over $1.0 billion) [CO009]. This wide valuation variance highlights differing interpretations of pre-money versus post-money capitalization schedules, anti-dilution options, and liquidation preferences that warrant rigorous audit during investment diligence [CO008, CO009]."
    claimRefs:
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO008"
      - "CO009"
    tableRefs:
      - "TO003"
  - id: "scale-and-milestones"
    title: "Operational Scale, Product Monetization, and Global Expansion"
    body: "Wrtn's operational trajectory illustrates rapid customer acquisition followed by a strategic pivot toward entertainment monetization [CO010, CO013]. The core Wrtn portal surpassed 5.0 million monthly active users in October 2024—just 22 months post-launch—and expanded to 5.4 million monthly active users by 2025, outpacing early adoption benchmarks set by prominent Korean unicorns such as Toss and Karrot [CO010]. In 2025, Wrtn reported revenue of 47.1 billion won (approximately $36 million), supported by premium subscriptions and conversational character chat [CO011]. Building on this foundation, Wrtn launched 'Crack' domestically before introducing 'OOC' (Out Of Character) as an interactive anime storytelling platform in North America in May 2026 [CO013]. OOC surpassed 10 billion won in monthly revenue within three months of release, shifting the majority of corporate revenue overseas for the first time and supporting ambitious management guidance exceeding 200 billion won ($152 million) for 2026 [CO012, CO014]. Nonetheless, this rapid scaling heavily relies on underlying cloud infrastructure from Microsoft Azure OpenAI Service and frontier models, which exposes gross margins to upstream compute costs and API pricing adjustments as inference volumes accelerate [CO015]."
    claimRefs:
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO013"
      - "CO014"
      - "CO015"
    figureRefs:
      - "FO001"
