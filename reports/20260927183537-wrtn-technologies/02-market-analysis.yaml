callouts:
  - calloutType: "insight"
    title: "Asymmetric Monetization: The Utility Funnel vs. Entertainment Revenue Engine"
    body: "Wrtn's structural differentiation lies in resolving the consumer AI monetization trap. Rather than competing directly against subsidized global giants on monthly SaaS subscriptions for general chat, Wrtn leverages its 5.4M monthly utility users as a zero-CAC customer acquisition engine to feed high-ARPU interactive storytelling platforms like Crack, Kyarapu, and OOC."
    claimRefs:
      - "CM001"
      - "CM002"
      - "CM007"
      - "CM013"
  - calloutType: "risk"
    title: "Platform Exposure: Model Dependency and Regulatory Scrutiny"
    body: "Because Wrtn relies on third-party foundational models from OpenAI, Anthropic, and Google hosted on cloud infrastructures like Microsoft Azure, operating margins remain vulnerable to upstream API price changes and safety filtering policies. Additionally, rapid growth in North American entertainment exposes Wrtn to evolving app store regulations regarding AI companion content."
    claimRefs:
      - "CM003"
      - "CM014"
      - "CM015"
      - "CM016"
