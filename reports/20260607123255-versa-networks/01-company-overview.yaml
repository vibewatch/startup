- id: funding-history-and-capital-markets
  title: Funding History, SEC Trail, and Capital-Markets Readiness
  body: 'Versa''s financing record is partly visible but not cleanly disclosed. The most reliable public anchors are the SEC search result showing Form D notices in 2012 and 2022, the official and Business Wire releases for the October 2022 BlackRock-led financing, Reuters'' reporting on that round, and PitchBook''s timeline entry for a completed Sep. 27, 2024 Series F. Those sources support a credible sequence from Series A in 2012 and Series B in 2014 through a 2022 pre-IPO financing and a later 2024 round, but they do not provide a fully reconciled capitalization history. Reuters and Tracxn support roughly $316 million raised through the 2022 transaction, whereas PitchBook adds a $90 million Series F in September 2024, implying a higher cumulative figure, and Forge goes further by marketing a $1.46 billion Series F valuation while also displaying a much larger total funding number. That leaves public data internally inconsistent. IPO signaling is similarly mixed: 2022 official language
    framed the BlackRock round as pre-IPO, Reuters said management expected a listing within 18 months, and Forge flags an S-1 / confidential-filing status; yet the public SEC search fetched for this run surfaces only Form D notices, not a visible registration statement. The upshot is that Versa looks like a company managed toward eventual liquidity, but the public evidence base is still too thin to treat 2024 valuation and filing status as fully verified.'
