  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: valuation
    missingEvidence: Primary company or investor documentation for the Sep. 27, 2024 Series F, including signed term sheet, price per share, and post-money valuation.
    whyItMatters: Forge is the only fetched source showing the $1.46B valuation, while other public sources provide round timing or amount without confirming valuation. That leaves the headline valuation unsuitable for underwriting.
    diligencePath: Request the Series F financing documents, updated cap table, and any board-consent materials from counsel or lead investors; cross-check against 409A or audit materials.
    relatedQuestionRefs:
    - QO016
    relatedTableRefs:
    - TO001
    - TO003
    - TO004
  - type: conflicting-data
    severity: material
    topic: ipo
    missingEvidence: Definitive evidence of whether Versa has actually filed a confidential S-1 or only remains in a pre-IPO posture.
    whyItMatters: Forge flags an S-1 or confidential-filing status, but the public SEC search fetched for this run showed only Form D notices. IPO timing, banker engagement, and disclosure readiness are material to exit assumptions.
    diligencePath: Ask management and counsel directly whether a confidential submission has been made, obtain banker engagement letters if any, and refresh SEC searches immediately before investment committee.
    relatedQuestionRefs:
    - QO021
    relatedTableRefs:
    - TO001
    - TO004
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Current ARR, revenue, gross margin, burn, NRR, and customer concentration data for 2025-2026.
    whyItMatters: Public sources show market traction and channel reach but do not provide the operating metrics needed to test valuation, efficiency, or IPO readiness.
    diligencePath: Request current board package, monthly KPI deck, audited or reviewed financial statements, and cohort retention data from management.
    relatedQuestionRefs:
    - QO024
    relatedTableRefs:
    - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: governance
    missingEvidence: Full board composition, investor-observer roster, founder ownership, and protective provisions for the latest financing.
    whyItMatters: Governance rights determine exit timing, financing leverage, and the balance of power between founders, management, and late-stage investors.
    diligencePath: Request charter, investor-rights agreement, voting agreement, and latest cap table summary; reconcile those documents to the investor list surfaced publicly.
    relatedQuestionRefs:
    - QO025
    relatedTableRefs:
    - TO002
    - TO003
  - type: conflicting-data
    severity: minor
    topic: scale-metrics
    missingEvidence: Company-confirmed current customer count and employee count as of runDate.
    whyItMatters: Public references range from thousands of customers to over 10,000 customers, and headcount estimates range from over 600 in 2022 to high-800s in 2026 databases. That is directionally useful but not precise.
    diligencePath: Request current headcount by geography/function and active customer/site counts from operations or finance; compare with billing-system and HRIS exports.
    relatedQuestionRefs:
    - QO009
    - QO017
    relatedTableRefs:
    - TO001
