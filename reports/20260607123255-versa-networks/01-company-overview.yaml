company:
  name: Versa Networks
chapter:
  number: 1
  title: Company Overview
  summary: 'Versa Networks is a private Santa Clara-based SASE and SD-WAN vendor founded in 2012 by Kumar and Apurva Mehta and commercially led by former Cisco service-provider executive Kelly Ahuja. The company remains unusually channel- and operator-oriented—officially selling 100% through partners—and has extended that posture into sovereign SASE deployments with service providers such as Tata Communications and Swisscom. Public capital-markets evidence is mixed: Reuters and Tracxn support roughly $316M raised through the 2022 BlackRock round, PitchBook shows a $90M Sep. 2024 Series F, and Forge markets a $1.46B valuation plus S-1 status that public SEC search results fetched in this run do not independently confirm.'
sections:
- id: identity-and-platform
  title: Identity, Product Scope, and Market Position
  body: 'Versa Networks is a privately held SASE and SD-WAN vendor founded in 2012 and anchored in Santa Clara, California. Public sources consistently describe the company as a unified networking-and-security platform provider rather than a point-product startup: Versa''s own materials center the VersaONE platform, while Reuters and PitchBook frame the company as a network security and network-management software vendor serving both enterprises and service providers. The product family spans SASE, SSE, SD-WAN, SD-LAN, and related security controls, and the deployment story is unusually broad for a private vendor: Versa says services can run in shared cloud, dedicated private environments, customer infrastructure, or blended models. The technical differentiation it emphasizes most heavily is genuine multitenancy, which matters for carrier and managed-service-provider use cases because isolation, delegated administration, and tenant billing must work at scale. The best-supported customer-scale
    signal is not audited revenue but deployment breadth: official 2022 and 2025 releases say thousands of customers, hundreds of thousands of sites, and millions of users rely on Versa; Reuters separately reported more than 10,000 customers including BP and Capital One. Taken together, the company reads as a late-stage, channel-centric infrastructure platform with enough breadth to sell into both large enterprises and operator-led managed services.'
