- id: channel-scale-and-sovereign-milestones
  title: Channel Footprint, Service-Provider Orientation, and Sovereign SASE Milestones
  body: 'Versa''s channel posture is not a side note; it is a defining part of the business model. The company says it sells globally 100 percent through partners, its MSP materials emphasize tenant isolation, billing, APIs, and recurring-margin structure, and its leadership roster includes dedicated service-provider sales roles. Historical milestones reinforce that orientation. Tata Communications selected Versa software for a managed SD-WAN service as early as 2016, and Adobe publicly appeared with Versa in 2018 as an enterprise SD-WAN reference. By 2024 and 2025, Versa was using that same operator DNA to expand into hosted and sovereign SASE. Tata launched Hosted SASE with Versa in 2024; Versa then made Sovereign SASE generally available in 2025, explicitly targeting enterprises, governments, and service providers that need local control, data residency, and air-gapped options. Independent coverage from Network World and CRN suggests this was not just marketing language: sovereign deployment
    was positioned as customer-controlled infrastructure, and Kelly Ahuja told CRN that 85 percent to 90 percent of Versa''s top 100 customers already had sovereign deployments. Swisscom''s 2025 beem launch on Versa''s sovereign architecture gave the company a high-visibility telco proof point, while the 2026 Sovereign SASE-as-a-Service launch lowered the operating burden for regulated enterprises that want jurisdictional control without building the stack themselves.'
