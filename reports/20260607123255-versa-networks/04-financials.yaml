  - calloutType: risk
    title: Disclosure gaps overwhelm the positives
    body: >-
      Revenue quality may be structurally attractive, but there is still no public ARR, NRR, churn, burn, cash,
      customer concentration, or segment-margin disclosure. Without those inputs, this chapter can frame the model but
      cannot underwrite it.
