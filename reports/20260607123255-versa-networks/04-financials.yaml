  - id: cost-structure-margin-profile-and-capital-intensity
    title: Cost structure, gross-margin profile, and capital intensity
    body: >-
      Versa does not disclose gross margin, but public comps provide a reasonable envelope. Palo Alto Networks' 2025
      10-K reported a 73.4% gross margin, while Fortinet's 2024 10-K reported an 80.6% total gross margin. Fortinet
      also states directly that software and service revenue generally carry higher gross margins than hardware. Those
      public benchmarks matter because Versa combines software, cloud fabric, partner support, and physical CSG
      appliances, making a pure-software 85%+ gross-margin assumption too aggressive.

      The hardware and service layers likely pull Versa below best-in-class cloud security SaaS margins if they remain
      material. Versa still supports appliances from home office up through data-center class deployments, does not
      sell those boxes directly, and relies on distribution and partner delivery. That mix introduces reseller
      discounts, product support, logistics, and potential warranty or replacement cost that can dilute subscription-
      only economics. The AWS/G2 review stream is directionally positive on usability and security but includes
      complaints about documentation and bug-fix cadence, implying real support and service-delivery burden.

      Capital intensity appears moderate rather than trivial. The company is not a manufacturing-heavy hardware vendor,
      and the CSG300 documentation shows low device power draw and standard branch-appliance form factors, which argues
      against large factory or inventory capex. But Versa's 90+ PoP footprint, global support obligations, partner
      enablement, and managed/private deployment options still require meaningful cloud, networking, and personnel
      spend. The result is a business that should be structurally more attractive than a telecom equipment vendor but
      not as clean as a software-only SASE company.
    claimRefs:
