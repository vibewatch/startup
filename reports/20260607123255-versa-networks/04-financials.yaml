company:
  name: Versa Networks
chapter:
  number: 4
  title: Financials
  summary: >-
    Versa appears to run a high-quality recurring networking and security revenue model sold both direct and
    through service-provider channels, with appliances still monetized through distribution and managed-service
    partners. Public scale signals are strong—tens of thousands of customers, 879-1,067 employees, and private-
    market venues implying late-stage financing—but core underwriting inputs remain opaque: accessible revenue
    estimates range from $147.9M to a $100M-$500M statistical band, while candidate pages often cited for higher
    estimates were blocked or unavailable in this run. Based on public comparables, likely gross margin is
    software-like but below pure cloud leaders if hardware and services remain material; cash, burn, concentration,
    NRR, and profitability remain undisclosed, and the reported Sep-2024 Series F at a $1.46B valuation is only
    single-source verified in retained materials.
sections:
  - id: revenue-model-and-monetization
    title: Revenue model, packaging, and channel monetization
    body: >-
      Versa's public commercial footprint points to a hybrid revenue model built around recurring software,
      provider-managed services, and channel-sold appliances rather than a simple pure-play SaaS motion. Official
      partner materials explicitly describe multitenancy, streamlined billing, and predictable recurring revenue
      models for MSP profitability, while the managed-services solution brief says providers can use Versa to launch
      additional managed ZTNA, IoT security, and observability offerings. The AWS Marketplace listing managed by ACA
      Pacific similarly frames Versa as a base managed solution delivered via cloud, on-premises, or blended
      deployment. This suggests recurring license and managed-service revenue are central to the model.

      Hardware is still part of the commercial package. Versa's CSG hardware pages state that the company does not
      sell appliances directly and that customers and partners buy through distribution, which implies at least some
      one-time or bundled appliance economics remain in the mix. The hardware portfolio spans home-office, branch,
      campus, and data-center form factors, which broadens the commercial surface but likely introduces lower-margin
      product components, reseller discounting, and support obligations that a pure software vendor would avoid.

      Pricing transparency is limited. Versa's official surfaces do not publish list pricing for core SASE, SSE, or
      SD-WAN software, and the AWS Marketplace entry routes buyers toward managed or private-offer engagement rather
      than a clean public price card. That makes public realized-pricing analysis difficult and means revenue quality
      must be inferred from contract structure and channel design rather than from disclosed ACV or ARR metrics.
    claimRefs:
