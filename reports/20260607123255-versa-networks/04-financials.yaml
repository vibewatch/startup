  evidenceGaps:
    - type: conflicting-data
      severity: material
      topic: funding-history
      missingEvidence: Signed financing documents, board materials, and a current cap table showing whether a Sep-2024 Series F actually closed and at what valuation.
      whyItMatters: Conflicting round chronology changes the capital adequacy, dilution, and valuation narrative materially.
      diligencePath: Request the latest financing closing set, updated cap table, and banker or counsel materials tied to any 2024 or 2025 transaction.
      relatedQuestionRefs:
        - QI011
      relatedTableRefs:
        - TI004
    - type: private-evidence-only
      severity: blocking
      topic: revenue-estimate
      missingEvidence: Audited revenue and ARR bridge by stream, including software, hardware, support, and managed-service components.
      whyItMatters: Public revenue proxies do not reconcile tightly enough to support underwriting or valuation.
      diligencePath: Obtain audited financial statements, management ARR bridge, and deferred-revenue roll-forward.
      relatedQuestionRefs:
        - QI009
        - QI022
      relatedTableRefs:
        - TI001
        - TI003
    - type: private-evidence-only
      severity: blocking
      topic: unit-economics
      missingEvidence: Segment gross margins, NRR, gross churn, CAC, payback, and partner-economics detail.
      whyItMatters: Without these inputs the chapter can frame economics directionally but cannot test efficiency or margin durability.
      diligencePath: Request board KPI pack, retention cohorts, CAC model, and P&L by hardware, software, and services.
      relatedQuestionRefs:
        - QI017
        - QI018
        - QI022
        - QI023
      relatedTableRefs:
        - TI003
    - type: private-evidence-only
      severity: material
      topic: customer-concentration
      missingEvidence: Top-customer ARR concentration, partner concentration, renewal concentration, and logo churn exposure.
      whyItMatters: A service-provider-heavy book can look high quality until one or two accounts represent outsized ARR.
      diligencePath: Request top-10 ARR table, partner ARR split, and renewal calendar by major account.
      relatedQuestionRefs:
        - QI021
      relatedTableRefs:
        - TI005
    - type: private-evidence-only
      severity: material
      topic: cash-burn-runway
      missingEvidence: Current cash balance, monthly burn, debt schedule, and runway assumptions.
      whyItMatters: Capital adequacy cannot be separated from valuation optics without actual cash and cash-flow data.
      diligencePath: Request cash balance, trailing 18-month cash-flow statement, debt schedule, and monthly burn analysis.
      relatedQuestionRefs:
        - QI014
        - QI023
      relatedTableRefs:
        - TI004
    - type: access-blocked
      severity: material
      topic: higher-revenue-estimate
      missingEvidence: Accessible source pages supporting the higher public business-intelligence revenue figures often cited in discovery searches.
      whyItMatters: The underwriting debate around Versa's scale changes meaningfully if revenue is nearer the RocketReach figure or nearer the higher blocked BI estimates.
      diligencePath: Re-run the candidate BI pages through a licensed data source or request management-confirmed revenue to replace inaccessible aggregator pages.
      relatedQuestionRefs:
        - QI009
