  - id: TP004
    title: Moat durability / competitive risk register
    columns:
      - Versa moat claim
      - Threat or counterevidence
      - Severity
      - Why this matters
      - Mitigation or diligence ask
    rows:
      - - Single-platform story is uniquely differentiated
        - >-
          Fortinet and Cato make equally strong or stronger public integration claims while Palo Alto and Cisco also
          market unified operations
        - High
        - Single-console language is widespread across the shortlist
        - Ask for win-loss data specifically against Fortinet Cato Palo Alto and Cisco
      - - Hybrid on-premises and cloud flexibility creates durable advantage
        - >-
          Netify shows that flexibility matters, but Orange Verizon and Lumen prove buyers can also solve the job
          through managed wrappers
        - Medium
        - Delivery flexibility helps but may not control the budget owner relationship
        - Request evidence that hybrid deployments close deals competitors or carriers lose
      - - Service-provider reach is a moat
        - Carriers and MSPs can own the contract and abstract the underlying platform away
        - High
        - Channel power can expand reach while weakening direct vendor leverage
        - Review renewal ownership margin share and named service-provider wins
      - - Brownfield incumbency will block displacement by rivals
        - Zscaler partner-SD-WAN models and VeloCloud overlays show coexistence paths that avoid full rip-and-replace
        - Medium
        - Buyers can layer security and transport changes incrementally
        - Map migration timelines and where Versa truly forces displacement
      - - Security-first buyers will accept WAN-first tradeoffs
        - >-
          Independent shortlists still tilt toward Palo Alto Zscaler Netskope and Cato for default enterprise
          evaluations
        - High
        - Mindshare and public proof can outweigh architecture purity
        - Request proof of wins where the initial champion sat in security rather than networking
      - - Pricing opacity is harmless in enterprise deals
        - >-
          Public sources still reward vendors or managed wrappers that expose term structure rate-table clues or
          predictable-cost language
        - Medium
        - Thin commercial signaling raises diligence burden and slows comparison
        - Ask for price books packaging rules and discount corridors by customer size
    notes: >-
      Severity reflects threat to Versa's competitive durability rather than certainty that a rival will win every
      account. The register mixes direct rivals and managed alternatives because both shape the buyer's choice set.
