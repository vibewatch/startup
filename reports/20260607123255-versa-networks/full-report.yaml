  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct competition is role-based, not just category-labeled
        blocks:
          - type: paragraph
            body: >-
              Versa is not competing against one monolithic SASE bucket. The practical set changes with the buyer's
              starting point. Versa's own public material stresses Unified SASE, Secure SD-WAN, multitenancy, and cloud,
              on-premises, or blended deployment, which places it squarely against Palo Alto Prisma SASE, Cisco Secure
              Access plus Catalyst SD-WAN, Fortinet FortiSASE and FortiGate Secure SD-WAN, Cato, Netskope, and Zscaler
              rather than only branch firewalls. Third-party 2026 shortlists still cluster around Palo Alto, Zscaler,
              Netskope, and Cato when the buyer wants the default enterprise cloud-security conversation, while Cisco
              and Fortinet remain especially dangerous when an existing estate already anchors the account. Versa
              appears most differentiated when the buyer wants WAN-first control, on-premises and cloud flexibility, or
              a service-provider-friendly architecture. VeloCloud matters less as the cleanest single- vendor SASE story
              than as proof that brownfield WAN overlays still give enterprises another way to modernize connectivity
              without immediately standardizing on one new security cloud.
