      - number: '3.3'
        title: Packaging and channels matter almost as much as features
        blocks:
          - type: paragraph
            body: >-
              Exact enterprise pricing remains mostly private across the core vendor set, but packaging and go-to-market
              clues are visible. Versa publishes modular platform language and partner fit, not a rate card. Deepak's
              2026 comparison describes Zscaler as enterprise-priced, Palo Alto as SKU-complex, Cato as mid-market
              through enterprise priced, and Cisco as estate-leveraged. Fortinet goes further on public commercial
              signaling by promising predictable cost without bandwidth licensing and simplified licensing into
              FortiSASE. Lumen publicly references a pricing table, a 12-month term, and per-device SD-WAN-plus-security
              licensing for self-managed SASE. Verizon and Orange make the alternative buying route explicit: acquire a
              fully managed or staged SASE wrapper instead of selecting a standalone platform and staffing the operating
              model yourself. That dynamic is double-edged for Versa. A service-provider-ready architecture expands
              distribution and channel reach, but it also makes it easier for carriers and MSPs to own the contract, the
              day-two operations layer, and sometimes the customer relationship.
