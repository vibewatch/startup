      - number: '4.4'
        title: Capital base, valuation, and IPO readiness
        blocks:
          - type: paragraph
            body: >-
              Versa's funding history is unusually difficult to reconcile from public sources. Tracxn says the company
              has raised $316M across six rounds and still labels the business Series D. Nasdaq Private Market lists
              Series A-E rounds totaling $277M through October 2022, while CB Insights also stops at Series E on October
              27, 2022. Forge, however, shows a Sep-2024 Series F valuation of $1.46B and total funding of $632.76MM.
              These retained sources do not agree on latest round name, total funding, or timing, so the reported 2024
              Series F exists in this run as a single-source private-market datapoint rather than a cleanly corroborated
              financing fact.

              Reuters-sourced reporting adds more ambiguity rather than less. PE Insights says Versa raised $120M led by
              BlackRock, quoted CEO Kelly Ahuja as expecting a public listing within 18 months, and noted that the
              company had not yet hired banks. Forge uses IPO-oriented language such as “IPO Mentioned” and
              “Confidential Filing,” and Nasdaq Private Market publishes a May-2026 estimated $4.08 share value. Yet
              this run retained no public S-1, bank mandate list, or SEC filing trail that would convert IPO interest
              into verifiable readiness.

              Revenue disclosure is similarly messy. RocketReach posts a $147.9M revenue estimate, IncFact only provides
              a wide $100M-$500M statistical band, and candidate business-intelligence pages frequently used for higher
              revenue estimates were not retrievable in this run because one returned a 502 and another sat behind bot
              protection. The financial underwriting takeaway is therefore not that Versa lacks scale; it is that public
              scale, funding, and valuation data are too inconsistent to underwrite without management materials.
