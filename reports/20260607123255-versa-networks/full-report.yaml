      - number: '7.2'
        title: Channel dependence and sovereign-SASE execution risk
        blocks:
          - type: paragraph
            body: >
              Versa discloses that it sells globally 100% through partners, which is strategically useful for reach but
              creates a structural dependence on partner pricing, implementation quality, support, and renewal behavior.
              Lumen and Tata both market Versa-based SASE under their own wrappers, with different operating models and
              economics. That means the end-customer experience can be shaped as much by the partner as by Versa itself.
              The same channel architecture that helps distribution also complicates root-cause ownership when
              deployments are late, policy changes go wrong, or service quality disappoints.

              Sovereign SASE deepens this trade-off. Versa's 2025 launch positioned Sovereign SASE as a do-it-yourself
              model running on customer infrastructure, explicitly promising stronger privacy, control, and business
              continuity than third-party SaaS. In 2026 the company expanded the idea into Sovereign SASE-as-a-Service,
              arguing that ordinary SASE often leaves traffic inspection, metadata logging, or management outside the
              customer's legal jurisdiction. Those claims line up with rising regulatory demand, but they also increase
              product and delivery complexity. Tech Field Day's summary of Drew Conry-Murray's Packet Pushers critique
              is the key skeptical source: Sovereign SASE may expand the market, but it also stretches the original SASE
              model by shifting more infrastructure and operational burden away from the vendor's cloud and onto
              customers or managed-service partners. If Versa wins business precisely because buyers are unusually
              regulated, any delivery miss will carry outsized reputational and contractual consequences.
