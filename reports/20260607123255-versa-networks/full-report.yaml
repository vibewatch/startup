      - number: '3.2'
        title: Unified control-plane claims are common, but not equivalent
        blocks:
          - type: paragraph
            body: >-
              Versa's strongest public differentiation is architectural coherence. Versa SD-WAN and VersaONE both lean
              on single-platform language: separate data, control, and management planes; one operating system; one
              console; one policy set; and modular licensing inside an existing environment. Fortinet is the closest
              public match on explicit integration, claiming one OS, one agent, one console, and one policy engine
              across SD-WAN, SSE, and zero trust. Cato makes a different but equally integrated claim by centering on a
              single-pass cloud engine and a private backbone. Palo Alto and Cisco both market unified operations, but
              their public stories read more like converged portfolios spanning broader modules and installed estates.
              Zscaler and Netskope remain stronger on security-cloud or data-security posture, yet third-party
              comparisons keep highlighting the same tradeoff: proxy models can be cleaner for SaaS and web protection,
              while WAN-native or route-based platforms preserve more networking familiarity and brownfield fit. Versa
              therefore competes best when buyers value network and security convergence without giving up deployment
              flexibility.
