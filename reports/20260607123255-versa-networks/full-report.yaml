      - number: '3.4'
        title: Switching barriers exist, but coexistence paths are real
        blocks:
          - type: paragraph
            body: >-
              Switching costs in SASE are meaningful but not absolute. Enterprises still have to migrate policies,
              remote users, branch edges, internet breakouts, identity integrations, and operating workflows. Even so,
              several reviewed sources describe coexistence paths that soften lock-in. Zscaler can sit on top of
              existing partner SD-WAN estates, Orange markets a staged path from managed SSE to managed SASE, and
              VeloCloud-style overlays let buyers modernize WAN control without immediately replacing the whole security
              stack. That cuts both ways for Versa. Its strengths are hybrid deployment flexibility, multitenancy,
              service-provider friendliness, and a WAN-native viewpoint that resonates with distributed enterprises. Its
              weaknesses are the mirror image: less public cloud-edge scale disclosure, fewer default-shortlist
              endorsements, and thinner public proof on named customers, published pricing, or operational outcomes than
              some larger rivals. Versa therefore benefits when procurement starts from network control or partner
              delivery, but it can lag when procurement starts from security-cloud mindshare, public scale markers, or a
              buyer desire to outsource the entire operating model.
