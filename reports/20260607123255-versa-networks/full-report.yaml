  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / signal
      - Transmission to thesis
      - Action implication
    rows:
      - - Secondary price deterioration
        - Sustained private quote below $3.00/share
        - Suggests the market no longer supports the 2024 round economics
        - Re-underwrite to bear-case range and avoid paying up for common or junior preferred
      - - Growth slowdown
        - Evidence that revenue growth has fallen below ~10-15%
        - Removes the premium-multiple justification for a challenger vendor
        - Shift valuation framework toward Juniper / Check Point-style downside bands
      - - IPO slippage
        - No clearer filing, banker, or audit readiness signal over the next 12 months
        - Extends the holding period while preserving private-company opacity
        - Treat the story as a private hold with lower liquidity premium
      - - Market concentration worsens
        - Top-six SASE share continues rising while Versa remains a challenger
        - Implies share capture is moving to the largest platforms instead of to challengers
        - Cut expected exit multiple and probability of leader-like outcomes
      - - Preference overhang deepens
        - New capital adds richer preferences or cumulative dividends
        - Increases divergence between headline valuation and common-holder value
        - Demand stronger protections or walk away
    notes: >-
      Kill criteria focus on measurable transmission channels from market structure or financing terms into valuation,
      not on vague operating disappointment.
    claimRefs:
      - CV011
      - CV019
      - CV032
      - CV042
      - CV043
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Audited revenue / ARR
        - FY2024-FY2026 audited revenue bridge and recurring-revenue mix
        - Current price is highly sensitive to the real denominator
        - Finance team; audited statements and board materials
      - - Retention quality
        - Gross retention, NRR, cohort expansion, and churn by customer segment
        - Premium software multiples require proof that growth is not just new-logo dependent
        - Finance and RevOps; cohort analysis and board dashboards
      - - Margin profile
        - Gross margin, sales efficiency, burn, and free cash flow trajectory
        - Distinguishes a premium software story from a lower-multiple networking vendor
        - Finance; management accounts and budget package
      - - Full cap table / waterfall
        - Security-by-security preference, dividends, conversion terms, and employee pool dilution
        - Headline post-money can overstate value to common holders
        - Legal and finance; most recent cap table and waterfall model
      - - IPO readiness
        - Banker engagement status, audit readiness, and timeline to public filing
        - Determines holding period, liquidity path, and tolerance for a premium entry price
        - CEO / CFO; IPO readiness workplan
      - - Competitive win-loss data
        - Recent head-to-head outcomes versus Palo Alto, Cato, Netskope, and Cisco
        - Needed to judge whether challenger status is improving or deteriorating
        - Sales leadership; win-loss analysis by quarter
    notes: >-
      The diligence asks are intentionally narrow. Every item maps directly to either the multiple denominator, the
      probability of an IPO-like exit, or the difference between preferred and common value realization.
