      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The denominator is the whole debate
            body: >-
              The biggest valuation risk is not whether Versa is a real company; that part is well supported. The risk
              is that the public denominator is still estimated. At $147.9M of revenue the round is about 9.9x, while at
              $200M it is only 7.3x. That difference alone moves Versa from stretched to merely fair versus relevant
              public comps.
            calloutType: risk
            claimRefs:
              - CV022
              - CV024
              - CV026
              - CV032
          - type: callout
            title: Preferred protections make the headline less useful for common holders
            body: >-
              Forge's round data shows the 2024 Series F carrying an 8% cumulative dividend and the 2022 Series E
              carrying a 2.0x liquidation preference with a 12% cumulative dividend. That does not invalidate the $1.46B
              headline, but it does mean the distribution waterfall matters much more than usual in middling exit cases.
            calloutType: insight
            claimRefs:
              - CV007
              - CV008
              - CV042
