  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Platform definition and product scope
        blocks:
          - type: paragraph
            body: >-
              Versa’s product surface is built around the idea that one operating system, VOS, should carry networking,
              SD-WAN, security, orchestration, and analytics across the same estate rather than bolting acquired point
              products together. The official product catalog and third-party reviews converge on the same picture:
              VersaONE or Versa SASE spans core access functions such as ZTNA, SWG, CASB, NGFWaaS, RBI, Network DLP,
              routing, and analytics, with Secure SD-WAN as the anchor WAN-edge workload. That breadth is a real
              technical differentiator for large enterprises and service providers that want self-hosted, hybrid, or
              managed-service flexibility, especially when multi-tenancy is important. It is also the root of the
              platform’s main risk: the portfolio is deep enough that buyers need to understand multiple operating
              modes, management surfaces, and deployment patterns rather than a simplified single-purpose SSE product.
