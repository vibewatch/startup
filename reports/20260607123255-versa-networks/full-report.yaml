      - number: '7.3'
        title: Regulatory, privacy, and legal exposure
        blocks:
          - type: paragraph
            body: >
              Versa's regulatory risk is not centered on a single lawsuit or enforcement action identified in public
              sources; it is centered on selling security and connectivity into heavily regulated environments while the
              governing rules are getting harder, more cross-border, and more board visible. The SEC's cyber-disclosure
              rules make incident reporting and governance a capital- markets issue. The EU's NIS2 regime imposes
              supply-chain security, incident reporting, and management accountability across critical sectors, and the
              European Commission is still amending the regime in 2026 to reduce compliance friction. FTC enforcement
              guidance makes clear that privacy/security promises can become Section 5 cases when controls fail in
              practice.

              Versa's own privacy policy adds a further diligence angle. It gives California residents a rights-request
              pathway while also contemplating disclosures to regulators, law enforcement, outside counsel, and
              processors located anywhere in the world. That is not unusual for a global B2B software company, but it is
              exactly why Versa has had to invest in sovereignty-specific positioning. The risk is therefore two-sided:
              if sovereign and jurisdictional controls are real, Versa can win regulated workloads; if they are
              incomplete, inconsistently delivered by partners, or too complex for customers to operate, the company can
              be exposed to procurement delays, contract disputes, or heightened scrutiny after an incident.
