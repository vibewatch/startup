  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Cybersecurity, product-quality, and platform-reliability risk
        blocks:
          - type: paragraph
            body: >
              Versa's sharpest adverse signal is the 2024 Versa Director vulnerability, CVE-2024-39717. The company's
              own bulletin says the flaw affected Versa Director and had already been exploited in at least one known
              instance by an advanced persistent threat actor. NVD and CISA show the bug was serious enough to enter the
              Known Exploited Vulnerabilities catalog with a federal remediation deadline, while Black Lotus Labs,
              Insurance Journal/Bloomberg, KrebsOnSecurity, The Hacker News, and PYMNTS all describe exploitation
              against ISP/MSP environments and downstream customer risk. That matters more than a normal product CVE
              because Director is not an edge box at a single branch; it is a management layer often used by service
              providers to orchestrate many customer environments. The exploit path therefore hits trust, channel
              safety, and regulated-customer confidence simultaneously.

              The second layer of product risk is operational quality. Public review sources are generally favorable on
              feature breadth, but the adverse details are consistent enough to matter: PeerSpot says one customer
              reverted from a bug-prone new release to a prior stable version, Gartner SD-WAN reviews mention outdated
              onboarding and weak post-deployment engagement, and TrustRadius/PeerSpot/Gartner all point to steep
              learning curves, support inconsistency, or missing platform elements such as Versa not owning its own
              backbone. This does not prove a systemic quality failure, but it does imply that Versa's differentiation
              through breadth and flexibility comes with an execution tax. Investors should treat engineering quality,
              release discipline, and field-support competence as diligence-critical rather than assuming the review
              averages tell the whole story.
