      - number: '1.2'
        title: Founders, Leadership, and Governance Signals
        blocks:
          - type: paragraph
            body: >-
              Versa's founder-market fit is strong and unusually concentrated in carrier networking. Founders Kumar
              Mehta and Apurva Mehta both came from Juniper and related networking roles, and Kelly Ahuja likewise spent
              nearly two decades at Cisco in service-provider and routing leadership roles before becoming Versa's CEO.
              That background helps explain why Versa still presents itself as comfortable with telecom, MSP, and
              large-enterprise complexity rather than purely branch-office SaaS simplicity. The current disclosed
              executive bench also leans toward scale preparation: Lalit Kumar brings IPO and public-company finance
              experience from Medallia and NetSuite, Martin Mackay owns global go-to-market, and dedicated executives
              cover worldwide and North American service-provider sales. The governance picture is still incomplete,
              however. Public pages provide executive biographies but not a full board, observer, or control-rights map
              for late-stage investors. That matters because a company discussing IPO readiness since 2022 but still
              private in 2026 could face meaningful board-level timing and disclosure decisions. The practical judgment
              is that Versa appears operationally mature and commercially experienced, but outside investors still need
              primary materials—board composition, protective provisions, secondary history, and cap-table details—to
              assess governance balance between founders, management, and financial backers.
