      - number: '5.2'
        title: Architecture, deployment model, and hardware/software split
        blocks:
          - type: paragraph
            body: >-
              Versa’s documented architecture is more explicit than most SASE vendors’ marketing pages. The basic SD-WAN
              pattern is headend plus branch. Headend nodes combine Director, Analytics, Controller, and often the
              Concerto orchestrator; branch nodes run VOS on Versa CSG appliances, vCSG, or white-box x86 hardware. The
              Controller is not just a management object—it carries real-time route, topology, reachability,
              performance, and SLA information between sites, which is why Versa can credibly describe control-plane
              behavior rather than only policy management. Routing support is enterprise-grade, including BGP, MP-BGP,
              VRF, MPLS over GRE/IPsec, and BFD-based fast failure convergence. Deployment options span cloud,
              on-premises, hybrid, and MSP-hosted models, and Versa explicitly says an enterprise deployment can be
              air-gapped so management data never leaves the customer network. Private SASE and Titan guides show the
              hardware path is still important: specific CSG and vCSG appliances, explicit hub/spoke/full-mesh roles, HA
              pair design, and static-WAN interface planning are all part of real deployments.
