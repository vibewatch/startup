  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and sizing lenses
        blocks:
          - type: paragraph
            body: >-
              Versa’s practical market is not all enterprise networking and not all cybersecurity. The spend that
              matters is the layer where networking, identity-aware access, and cloud-delivered security converge into
              operational SASE programs. Dell’Oro and MarketsandMarkets both show strong growth, but they are sizing
              different things: Dell’Oro frames SASE as cumulative SSE-plus-SD-WAN spending shaped by governance and
              audit needs, while MarketsandMarkets provides a point-in-time market estimate for 2026 and a 2032
              endpoint. That distinction matters because the category still contains both direct sellable
              software/services and broader architectural migration budgets. The right boundary therefore includes
              unified SASE platform spend, managed or co-managed SASE services, private or sovereign deployments for
              regulated buyers, and branch modernization when SD-WAN is chosen to execute centralized security policy.
              It should exclude pure access-router refresh, raw connectivity transport, or generic hardware projects
              that never convert into unified policy enforcement. Public market numbers are best used as scenario bounds
              rather than a precise Versa TAM, but they are directionally consistent: security policy is moving
              upstream, large enterprises dominate today’s visible spend, and the market remains large enough to support
              both security-first leaders and differentiated platform vendors such as Versa.
