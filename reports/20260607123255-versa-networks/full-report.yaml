      - number: '7.5'
        title: Mitigations, monitoring priorities, and kill criteria
        blocks:
          - type: paragraph
            body: >
              Versa does have credible mitigants. The company patched the exploited Director flaw, has a specific
              hardening narrative, and is pushing sovereignty-led product variants that directly address regulatory and
              jurisdictional objections. Review sources also show that many customers still value Versa's technical
              breadth, deployment flexibility, and integrated platform. But the mitigation case is only credible if
              those strengths are measurably stronger than the residual risks. That means diligence needs to move beyond
              category leadership claims and confirm execution mechanics: patch uptake, exposed-management-port
              elimination, release quality, escalation ownership between Versa and partners, sovereign deployment
              economics, and the real maturity of public-company controls.

              The clean kill criteria are therefore operational, not rhetorical. A new material control-plane incident,
              evidence that partner-led deployments are generating support churn, or proof that the pre-IPO story still
              lacks public-company finance rigor would each materially weaken the thesis. Conversely, audited evidence
              of stable renewals, limited concentration, strong patch and harden rates, and repeatable sovereign
              deployments through partners would compress several of the key residual risks at once. Until that
              diligence is done, Versa remains investable only with a clear view that channel leverage, regulatory
              demand, and product breadth are advantages that can be executed consistently rather than sources of hidden
              fragility.
