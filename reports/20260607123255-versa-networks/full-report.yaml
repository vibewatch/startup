      - number: '8.4'
        title: Bull, Base, Bear, Exit Readiness, and Final Diligence
        blocks:
          - type: paragraph
            body: >-
              A practical underwriting frame is to treat the 2024 round as sitting in the upper half of a plausible base
              case, not at the center of a wide-open upside story. In the bull case, Versa sustains 25%+ growth,
              converts challenger positioning into leader-status evidence, proves revenue closer to $180-210 million,
              and regains a premium private multiple of 10-12x revenue. That yields a roughly $1.8-2.5 billion range and
              would require a visibly improving IPO path. In the base case, revenue lands around $160-180 million and
              the market applies a 7-9x multiple, producing roughly $1.12-1.62 billion. That range brackets the
              September 2024 price, but only at its upper end. In the bear case, growth decelerates toward low teens or
              worse, overall SASE consolidation keeps share gains expensive, and public comp multiples compress toward
              4-6x. On $150-165 million of revenue, that gives only $0.6-0.99 billion.

              Exit readiness remains mixed. Versa has the customer footprint, funding base, and CFO hiring history of a
              company preparing for public-market discipline, but the retained sources still stop well short of the
              normal IPO proof points. There is no public audited revenue bridge, no disclosed NRR, no disclosed gross
              margin, no disclosed free cash flow, and no public cap-table waterfall. The pre-IPO story has therefore
              lasted longer than management's original 2022 language implied.

              The chapter's diligence conclusion is straightforward: the 2024 price is defensible only if audited
              revenue, retention, and gross margin come in materially better than public evidence can currently prove.
              Without that, the safer stance is to monitor for either stronger disclosure or a better entry price.
            claimRefs:
              - CV014
