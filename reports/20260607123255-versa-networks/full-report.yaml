      - number: '2.2'
        title: Buyer requirements and deployment models
        blocks:
          - type: paragraph
            body: >-
              Buyers are not evaluating SASE as an abstract taxonomy exercise. They are buying around concrete operating
              problems: remote and hybrid work, SaaS-heavy traffic, branch-of-one users, VPN replacement, cloud
              visibility, and the need to run networking and security from the same policy fabric. Cisco and Hughes
              describe the same pattern from different angles: secure access from any device or location, phased
              coexistence with existing infrastructure, and convergence of SD-WAN with SSE, ZTNA, DLP, and visibility
              workflows. Cybersecurity Insiders’ 2026 data shows why the category is attractive but still unfinished.
              Universal ZTNA is viewed as essential by most respondents, yet full implementation is still rare; buyers
              want single-vendor or hybrid platforms because fragmented tools and policy sprawl remain the dominant
              barrier. Regulatory guidance sharpens those requirements further. NIST and CISA move the design center
              from trusted networks to least-privilege decisions around users, devices, and applications, while OMB and
              NSA push federal environments toward encrypted internal traffic, internet-accessible applications, and
              continuous verification. For Versa, this means deployment flexibility matters almost as much as feature
              breadth: some customers want coexistence and phased rollout, while regulated or sovereign buyers want
              private control rather than a purely shared-cloud operating model.
