    - Provider platform, PoP, and managed-service budget
    - White-label or provider-operated managed SASE with SOC and NOC coverage
    - Channel P&L owner plus platform operations
    - Bundling cybersecurity with connectivity and managed IT services
  - - Midmarket co-managed buyers
    - IT director or external service lead
    - Remote staff and smaller branch populations
    - IT operating budget with provider support
    - Replace appliance and VPN sprawl with cloud-delivered controls operated jointly with a partner
    - IT director plus managed-service sponsor
    - Need to reduce complexity without hiring full in-house specialists
  - - Cloud-first application-centric businesses
    - CTO or infrastructure head
    - Knowledge workers and developers
    - Platform and security budget
    - Direct-to-internet and private app access with identity-aware controls
    - CTO and security leadership
    - SaaS growth, multicloud traffic, and desire for consistent user experience
