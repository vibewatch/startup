tables:
- id: TM001
  title: Market definition table
  columns:
  - segment/category
  - included spend
  - excluded spend
  - buyer/payer
  - relevance
  rows:
  - - Unified SASE platform spend
    - Subscription or license spend for converged SD-WAN, SSE, ZTNA, SWG, CASB, FWaaS, DLP, and policy management
    - Standalone VPN or single-point appliances that do not share one policy fabric
    - CIO, CISO, NetOps, SecOps, central IT budget owners
    - Core category where Versa competes directly
  - - Managed and co-managed SASE services
    - Provider-operated design, deployment, monitoring, optimization, and compliance overlays sold with SASE
    - Generic MSP outsourcing or help desk work not tied to SASE controls
    - Enterprise IT buyers plus MSP or telco service providers
    - Core route to market for midmarket and multi-site buyers
  - - Private or sovereign SASE
    - Dedicated gateways, private cloud, on-premises or air-gapped SASE used for data residency, sovereignty, or critical infrastructure
    - Generic private cloud hosting that lacks an operational SASE stack
    - Government, defense, regulated enterprise, and service-provider platform owners
    - Important premium subset where Versa’s deployment flexibility matters
  - - Branch and WAN modernization tied to policy convergence
    - SD-WAN refresh and branch-security redesign when routing is selected to execute centralized security policy
    - Pure bandwidth upgrades, MPLS renewals, or access-router refresh with no security convergence
    - NetOps and infrastructure teams spending against branch, WAN, and security programs
    - Important feeder budget into the SASE category
  - - Legacy point-product replacement
    - VPN replacement, appliance consolidation, and migration from multi-console edge security stacks
    - Stable appliance estates that remain standalone and are not being converged
    - CISO, infrastructure, and digital workplace teams
    - Common budget-release mechanism for SASE projects
  - - 'Excluded adjacency: raw connectivity and fixed-function hardware'
    - None unless it is explicitly bundled into a managed or converged SASE service
    - Carrier transport, pure router revenue, and hardware refresh not governed by unified policy
    - Network procurement and connectivity buyers
    - Outside the practical market boundary even if it influences deployment decisions
  notes: Included spend follows converged networking-and-security programs, managed service overlays, and sovereign/private delivery models; pure transport and fixed-function hardware are treated as adjacency, not direct TAM.
