callouts:
- calloutType: insight
  title: Security policy is moving upstream in WAN design
  body: 'Dell’Oro’s framing matters for Versa: buyers are no longer choosing SD-WAN first and bolting on security later. They are increasingly choosing routing, enforcement, and visibility as execution layers for centrally defined security policy.'
  claimRefs:
  - CM007
  - CM008
  - CM009
- calloutType: strength
  title: Versa is aligned to buyers that need deployment flexibility
  body: Shared-cloud SASE is no longer the only acceptable operating model. Versa’s public positioning around private and sovereign variants gives it a credible story for regulated buyers and provider-led managed offers that do not want a pure shared-cloud dependency.
  claimRefs:
  - CM003
  - CM004
  - CM031
  - CM056
  - CM057
  - CM058
- calloutType: risk
  title: Category growth does not eliminate crowding or rollout risk
  body: Public evidence supports strong category demand, but not effortless execution. Crowd-out from stitched offerings, multi-console coexistence, and partial deployments means platform cohesion and operational reliability remain critical to monetizing the market.
