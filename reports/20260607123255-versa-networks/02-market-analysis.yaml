- id: TM004
  title: Growth drivers and constraints table
  columns:
  - driver/constraint
  - direction
  - timing
  - implication
  - diligence ask
  rows:
  - - Remote and hybrid work plus SaaS sprawl
    - up
    - current
    - Expands need for secure-anywhere access and cloud-adjacent enforcement
    - Request Versa win patterns by remote-user, branch, and private-app use case
  - - Zero-trust execution gap and VPN replacement
    - up
    - current to near term
    - Creates a steady modernization funnel even when organizations are not ready for full rip-and-replace
    - Request proof of pilot-to-production conversion and VPN replacement attachment rates
  - - Compliance, sovereignty, and critical-infrastructure requirements
    - up
    - current to multi-year
    - Raises value of private and sovereign deployment options in regulated segments
    - Request sovereign pipeline, regulated vertical mix, and renewal evidence
  - - Managed-service and skills-gap outsourcing
    - up
    - current
    - Supports telco and MSP channels that can package SASE as an operating service
    - Request service-provider revenue mix, attach rates, and support economics
  - - Unified-platform consolidation demand
    - up
    - current
    - Rewards vendors that can reduce console count and policy drift across branches and remote users
    - Request evidence of multi-product displacement in competitive wins
  - - Crowded vendor field and licensing complexity
    - down
    - current
    - Compresses differentiation and can slow shortlisting despite category growth
    - Request discounting, pricing pressure, and reasons for lost deals
  - - Partial deployments and outage concentration risk
    - down
    - current
    - Raises buyer concern about misconfiguration blast radius and service reliability
    - Request incident history, rollback design, and customer reference depth
  - - Multi-console coexistence and long phased deployments
    - down
    - current to near term
    - Keeps hybrid migrations common and extends time-to-value
    - Request coexistence playbooks, services mix, and implementation cycle times
  notes: The central valuation question is not whether category demand exists, but whether it converts into durable, operationally successful deployments without pricing and execution pressure eroding returns.
