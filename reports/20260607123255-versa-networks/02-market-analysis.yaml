  evidenceGaps:
  - type: missing-source
    severity: material
    topic: managed-sase-penetration
    missingEvidence: A public 2026 split of enterprise SASE deals by fully managed, co-managed, and self-managed operating model.
    whyItMatters: Versa’s service-provider opportunity depends on how much of the category is actually bought with ongoing operational services rather than just software.
    diligencePath: Ask management for pipeline and closed-deal mix by operating model, then corroborate with top provider partners and channel references.
    relatedQuestionRefs:
    - QM022
    relatedTableRefs:
    - TM003
  - type: private-evidence-only
    severity: blocking
    topic: versa-specific-sam-som
    missingEvidence: Versa segment revenue, channel mix, win rates, and deployment-model split sufficient to defend a company-specific SAM or SOM.
    whyItMatters: Without direct company data, investors can size the category but cannot reliably translate that category into Versa’s obtainable share.
    diligencePath: Request management cohort data by enterprise direct, service-provider, managed, private, and sovereign deployments plus top vertical concentration.
    relatedQuestionRefs:
    - QM023
    - QM026
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: sovereign-demand-incrementality
    missingEvidence: Independent evidence showing how much sovereign or data-residency demand expands the total SASE market rather than simply changing deployment preference.
    whyItMatters: Versa publicly claims sovereign SASE expands TAM, but underwriting should distinguish genuine new spend from reclassified existing demand.
    diligencePath: Request customer case studies or cohort analysis showing net-new budgets or verticals unlocked by sovereign deployment instead of substitution from shared-cloud SASE.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: eu-regulatory-attribution
    missingEvidence: Deal-level evidence linking NIS2 compliance pressure to SASE budget timing, shortlisting, or deployment model selection.
    whyItMatters: The existence of regulation is clear, but the degree to which it accelerates commercial SASE demand remains unquantified in the public record.
    diligencePath: Ask European channel partners and management for pipeline examples where NIS2 explicitly changed budget approval, architecture, or timing.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM004
  - type: missing-source
    severity: material
    topic: channel-mix-visibility
    missingEvidence: Public evidence showing what share of Versa’s future demand is likely to come from service-provider channels versus direct enterprise sales.
    whyItMatters: The company’s public positioning is channel-friendly, but the actual revenue and pipeline mix remain opaque, which affects valuation and execution risk.
    diligencePath: Request current and forward-looking bookings split by direct, MSP, and telco channels, plus top partner concentration and renewal behavior.
    relatedQuestionRefs:
    - QM026
    relatedTableRefs:
    - TM003
