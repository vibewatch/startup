- id: FE002
  title: Customer workflow / operating flow
  type: flow
  layout: standard
  summary: How branch or remote traffic is onboarded, steered, secured, and observed in a typical Versa deployment.
  data:
    nodes:
    - id: n1
      label: Branch / user endpoint
      description: CSG, vCSG, white-box branch node, or remote user device starts from local WAN and endpoint context.
    - id: n2
      label: Registration / orchestration
      description: Portal, Director, Concerto, or Titan pushes tenant, site, and client policy information into the estate.
    - id: n3
      label: Traffic steering
      description: Split-tunnel or exclude rules decide whether flows break out locally, go to Versa Cloud Gateway, or traverse private overlays.
    - id: n4
      label: Network control plane
      description: Controller exchanges topology, route, reachability, and SLA information among branches and headend nodes.
    - id: n5
      label: Security inspection
      description: ZTNA, SWG, CASB, NGFWaaS, DLP, and related controls evaluate traffic and session behavior under common policy.
    - id: n6
      label: Analytics / AI operations
      description: Analytics baselines behavior, correlates anomalies, and can feed guided troubleshooting and planning workflows.
    - id: n7
      label: Policy refinement / remediation
      description: Operators use Director templates, API workflows, or partner consoles to refine policy and restore service.
    edges:
    - from: n1
      to: n2
      label: Provisioning context
    - from: n2
      to: n3
      label: Policies distributed
    - from: n3
      to: n4
      label: Overlay and routing state
    - from: n3
      to: n5
      label: Selected flows forwarded
    - from: n4
      to: n5
      label: Control-plane context
    - from: n5
      to: n6
      label: Telemetry and incidents
    - from: n6
      to: n7
      label: Feedback and tuning
  approximationNotes: The flow blends official client/gateway behavior with SD-WAN controller roles. Exact run-time sequencing can vary by pure Versa versus partner-assisted deployment mode.
