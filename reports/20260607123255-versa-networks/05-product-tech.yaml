- id: TE002
  title: Workflow / use-case table
  columns:
  - User Job
  - Current Workflow
  - Versa Solution
  - Measurable Benefit
  - Limitation
  rows:
  - - Secure branch-to-cloud SaaS access without MPLS backhaul
    - Legacy MPLS and centralized firewall hairpinning introduce latency and cost
    - Secure SD-WAN + local breakout + NGFWaaS or Zscaler integration
    - Official materials position lower latency, faster onboarding, and policy consistency across sites
    - Benefit is mostly company-claimed; public latency or cost benchmarks are sparse
  - - Deliver ZTNA or SWG to remote and BYOD users
    - Separate VPN, web proxy, and endpoint controls create policy gaps
    - Secure Access portal/gateway plus SASE client with split-tunnel or exclude rules
    - One client framework can steer private-app and internet flows differently under central policy
    - Mac/iOS parity and SSL-VPN replacement completeness remain diligence items
  - - Operate multi-tenant managed services for many customers
    - Separate per-customer stacks raise cost and management overhead
    - True multi-tenant management, control plane, data plane, and analytics with per-tenant RBAC and isolated routing constructs
    - Versa’s architecture is unusually service-provider-friendly among SASE vendors
    - The same flexibility can raise setup and training demands for non-MSP teams
  - - Replace or augment centralized firewall estates
    - On-prem NGFW upkeep requires signatures, expertise, and branch backhaul
    - VSIA with NGFWaaS integrated into broader SASE stack
    - Combines firewalling with CASB, SWG, DLP, and routing under one platform model
    - Independent comparative data versus best-of-breed cloud firewall products is limited
  - - Govern GenAI and browser-native work without VDI
    - Traditional SWG/CASB or endpoint controls lack browser-session context
    - Secure Enterprise Browser early-access program plus existing DLP and ZTNA policy engine
    - Company claims controls for clipboard, upload/download, print, screen capture, and contractor access
    - Capability is early access, so maturity and reference depth are still thin
  notes: Benefit statements summarize retained official and third-party descriptions rather than audited customer ROI. The table is meant to show workflow fit and limits, not to certify quantified production outcomes.
