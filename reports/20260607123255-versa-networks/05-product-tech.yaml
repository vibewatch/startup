- id: converged-security-services
  title: Unified SASE services, client workflow, and operations stack
  body: 'On the service plane, Versa’s strongest argument is that access, internet security, firewalling, and analytics share a common policy and orchestration model. The SASE client workflow is explicit in product docs: a device registers against a secure-access portal, then receives SWG and ZTNA services through a secure-access gateway. Application and domain steering can be implemented as a split tunnel or as an exclude-from-tunnel policy so only selected traffic reaches the Versa Cloud Gateway while other traffic breaks out locally. NGFWaaS is delivered inside Versa Secure Internet Access and is positioned as a way to avoid the latency and operational drag of backhauling all branch traffic to centralized firewalls. Analytics and automation then sit above the traffic plane: Director templates, APIs, and topology workflows aim to reduce operational overhead, while Analytics provides baselining, anomaly detection, multi-service reporting, and autoscaling guidance. The result is a broad
    converged stack, but it is broad enough that customers still need experienced operators to use it well.'
