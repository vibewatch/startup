figures:
- id: FE001
  title: Product architecture map
  type: stack
  layout: standard
  summary: Layered view of Versa’s unified platform from endpoints and branches through orchestration, security, and analytics/AI services.
  data:
    layers:
    - label: Endpoint & Branch Layer
      detail: Remote users, contractors, BYOD, branch offices, campus sites, and edge nodes running VOS on CSG/vCSG or white-box x86 hardware.
    - label: Access & Traffic Steering Layer
      detail: Secure Access portal and gateway, SASE client, split-tunnel or exclude rules, local breakout, and policy-driven forwarding toward Versa Cloud Gateways or partner services.
    - label: Control & Orchestration Layer
      detail: Director, Controller, Analytics, and Concerto/Titan manage provisioning, route exchange, topology workflows, policy rollout, and multi-tenant operations.
    - label: Security & Networking Services Layer
      detail: Secure SD-WAN, ZTNA, SWG, CASB, NGFWaaS, Network DLP, routing, segmentation, and partner-forwarding integrations such as Zscaler.
    - label: Analytics & AI Layer
      detail: Versa Analytics plus 2026 AI additions including alert correlation, contextual DLP, Verbo troubleshooting, and AI-ready edge service chains.
  approximationNotes: This stack is synthesized from official product pages, docs, and 2026 announcements. Versa does not publish a single canonical public diagram that cleanly separates every layer used here.
  claimRefs:
  - CE001
  - CE002
  - CE005
  - CE006
