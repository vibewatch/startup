- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / Component
  - Role
  - Dependency
  - Risk
  rows:
  - - Branch VOS node on CSG, vCSG, or white-box x86
    - Runs edge routing, SD-WAN, and local service functions at branches or remote sites
    - Depends on supported hardware models, WAN design, and local activation workflows
    - Hardware choice and WAN provisioning can complicate rollout or later standardization
  - - Versa Director
    - Central provisioning and policy management plane with templates, UI, and APIs
    - Depends on correct certs, RBAC, and operational discipline
    - Misconfiguration can propagate widely because Director is the policy source of truth
  - - Versa Controller
    - VPN concentrator, route reflector, and control-plane backbone across branches
    - Depends on redundant headend design and stable connectivity to branches
    - Controller health directly affects route exchange, SLA telemetry, and tunnel behavior
  - - Versa Analytics
    - Big-data visibility, anomaly detection, reporting, and planning engine
    - Depends on log pipelines, storage, and cluster sizing
    - Observability quality can degrade if data ingestion, scaling, or time sync are weak
  - - Concerto / Titan orchestration layer
    - Higher-level workflow surface for SASE and private-gateway operations
    - Depends on Director, Controller, and Analytics beneath it
    - Multiple management surfaces add operator complexity even if they improve scale
  - - Secure Access portal, gateway, and client
    - Registers users, distributes steering policy, and enforces ZTNA/SWG access patterns
    - Depends on gateway placement, client support matrix, and tenant subscriptions
    - Client OS gaps or steering-policy errors can reduce user experience or coverage
  - - Partner interconnects (Zscaler, Megaport, service-provider edges)
    - Extend traffic forwarding, PoP selection, or virtual-edge deployment outside native Versa estates
    - Depends on third-party APIs, tunnel setup, and partner infrastructure behavior
    - Partner integrations improve flexibility but add interop, troubleshooting, and support boundaries
  notes: This table synthesizes Versa’s official architecture documentation with partner deployment guides. It reflects public component roles and dependencies, not an internal microservice bill of materials.
