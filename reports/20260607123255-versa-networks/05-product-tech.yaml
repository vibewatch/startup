- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / Certification / Signal
  - Status
  - Scope
  - Gap
  rows:
  - - FedRAMP Ready (High)
    - Publicly announced in Oct-2025
    - Versa Unified SASE positioning for U.S. federal and high-impact environments
    - Need direct marketplace confirmation and operational boundary details during diligence
  - - Director hardening guide
    - Documented
    - Certificates, session timeout, password complexity, SSH banners, secure mode
    - Public guidance exists, but public evidence of external audit or hardening compliance rates does not
  - - Branches / Controllers / Hubs hardening guide
    - Documented
    - Disable eth0, signed certs, SSH banners, OS security packs, NTP
    - Branch compliance is customer-execution-dependent and not externally observable
  - - Analytics hardening guide
    - Documented
    - Certificates, banners, signature verification, OS security packs, NTP
    - Guide confirms controls exist, but public SOC2/ISO evidence for the platform is not on the reviewed product surface
  - - Multi-tenant isolation
    - Company-claimed differentiator
    - RBAC, routing/protocol separation, encrypted controller tunnels, tenant topologies
    - Need independent customer validation of blast-radius isolation under failure conditions
  - - Browser-native GenAI controls
    - Early access / company-claimed
    - Clipboard, uploads/downloads, printing, screen capture, contractor/BYOD session control
    - Needs GA timing, OS scope, and customer references
  - - Public SLA / incident transparency
    - Not found in retained public sources
    - Would cover uptime, service incidents, support commitments, and gateway performance norms
    - Request contractual SLA, status page, incident history, and support escalation metrics
  notes: Rows reflect what is publicly visible from retained sources as of 2026-06-07. Absence of public evidence should not be read as absence of internal control, only as a diligence requirement.
