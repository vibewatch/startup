tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / Asset
  - Primary User
  - Status / Maturity
  - Differentiation
  - Diligence Gap
  rows:
  - - VersaONE / Unified SASE platform
    - Enterprise network + security teams
    - GA / core platform
    - Single VOS-based platform for networking, security, SD-WAN, and analytics across cloud, on-prem, and hybrid
    - Need customer-by-customer proof that one platform reduces tool sprawl in practice, not just in architecture
  - - Versa Secure SD-WAN
    - Network engineering, MSPs
    - GA / mature
    - Combines routing, multi-tenancy, security, and analytics in one WAN-edge stack; supports commodity hardware and zero-touch provisioning
    - Operational complexity remains higher than simpler SSE-only or SMB-first alternatives
  - - Secure Access Client + ZTNA/SWG gateway model
    - Remote users, contractors, BYOD users
    - GA / mature
    - Client can steer selected apps/domains through Versa Cloud Gateway while allowing local breakout; one client framework spans ZTNA and SWG
    - Public evidence does not fully enumerate OS parity, especially Mac/iOS edge cases
  - - VSIA + NGFWaaS
    - Security teams replacing centralized firewall backhaul
    - GA / mature
    - Cloud-delivered firewalling, segmentation, decryption, and policy enforcement integrated with broader SASE stack
    - No public third-party benchmark on detection efficacy versus standalone NGFW leaders
  - - Director / Concerto / Titan management stack
    - Platform operators, MSPs
    - GA / mature
    - Templates, APIs, topology workflows, and private-SASE gateway activation workflows support large multi-tenant estates
    - Multiple orchestration surfaces increase operator learning requirements
  - - Versa Analytics / DEM
    - NOC, SOC, platform engineering
    - GA / mature
    - Real-time + historical analytics, anomaly detection, and autoscaling guidance across network and security services
    - No normalized public SLA or benchmark for alert quality, false positives, or dashboard performance at very large scale
  - - AI-ready operations (Verbo, AI OCR, contextual DLP, edge AI support)
    - Security operations and architecture teams
    - Released / maturing in 2026
    - Pushes AI into DLP, alert correlation, troubleshooting, and edge service chains without claiming a separate platform
    - Independent production references and benchmark data for these new AI layers are still limited
  - - Secure Enterprise Browser
    - Security teams focused on GenAI, BYOD, and contractor access
    - Early access / not yet mature
    - Extends Zero Trust enforcement directly into browser sessions and reuses existing policy engine and data plane
    - GA timing, supported-OS matrix, and reference customers are not publicly documented
  notes: Maturity labels reflect retained public evidence as of 2026-06-07. “GA” means publicly documented and broadly positioned by Versa or reviewers; “maturing” and “early access” indicate newer capabilities with thinner independent validation.
