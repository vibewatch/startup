  claims:
    - id: CR001
      statement: >
        Versa Director versions prior to 22.1.4 were affected by CVE-2024-39717, a dangerous file
        upload vulnerability that Versa and NVD both describe as high-severity and remediated in
        later releases.
      type: observed
      topic: director-vulnerability
      sourceRefs: [SR011, SR012]
      confidence: high
      freshness: current
      answersQuestionRefs: [QR001]
    - id: CR002
      statement: >
        Versa's security bulletin says CVE-2024-39717 had been exploited in at least one known
        instance by an advanced persistent threat actor.
      type: company-claimed
      topic: director-vulnerability
      sourceRefs: [SR011, SR017]
      confidence: high
      freshness: recent
      answersQuestionRefs: [QR001]
    - id: CR003
      statement: >
        CISA added CVE-2024-39717 to the Known Exploited Vulnerabilities catalog on 2024-08-23 with
        a federal due date of 2024-09-13 for mitigations or discontinuation.
      type: observed
      topic: kev-status
      sourceRefs: [SR012, SR013]
      confidence: high
      freshness: historical
      answersQuestionRefs: [QR001]
    - id: CR004
      statement: >
        Lumen attributed exploitation of CVE-2024-39717 with moderate confidence to Volt Typhoon /
        Bronze Silhouette and assessed the activity was likely ongoing against unpatched Versa
        Director systems.
      type: third-party-reported
      topic: threat-actor
      sourceRefs: [SR014, SR015, SR016, SR017]
      confidence: high
      freshness: recent
      answersQuestionRefs: [QR002]
    - id: CR005
      statement: >
        Black Lotus Labs and multiple follow-on reports said the campaign hit four U.S. victims and
        one non-U.S. victim across ISP, MSP, and IT environments.
      type: third-party-reported
      topic: victim-scope
      sourceRefs: [SR014, SR015, SR016, SR017, SR018]
      confidence: high
      freshness: recent
      answersQuestionRefs: [QR002]
    - id: CR006
      statement: >
        Lumen and Krebs describe Versa Director as a management/orchestration layer used by ISPs and
        MSPs, making compromise valuable because attackers can pivot into downstream customer
        environments using harvested credentials.
      type: third-party-reported
      topic: downstream-risk
      sourceRefs: [SR014, SR016, SR017]
      confidence: high
      freshness: recent
      answersQuestionRefs: [QR003, QR026]
    - id: CR007
      statement: >
        Versa's own bulletin says impacted customers had not implemented system-hardening and
        firewall guidelines, leaving an exposed management port on the internet that gave threat
        actors initial access.
      type: company-claimed
      topic: hardening-gap
      sourceRefs: [SR011, SR016]
      confidence: high
      freshness: recent
      answersQuestionRefs: [QR004]
