tables:
  - id: TP001
    title: Competitor profile table
    columns:
      - Competitor / route
      - Category
      - Public scope signal
      - Buyer / channel fit
      - Main edge versus Versa
      - Main limitation / caution
    rows:
      - - Versa Networks
        - Focal platform
        - Unified SASE plus Secure SD-WAN with hybrid cloud on-premises and blended delivery
        - Enterprises service providers and channel partners
        - Hybrid flexibility multitenancy and WAN-first coherence
        - Less public shortlist leadership published pricing and cloud-footprint proof
      - - Palo Alto Prisma SASE
        - Direct security-led platform
        - AI-powered comprehensive SASE with multicloud architecture and Prisma SD-WAN bundle
        - Security-led enterprise and public-sector buyers
        - Strong enterprise security depth and broad platform story
        - Portfolio breadth and licensing can add packaging complexity
      - - Cisco Secure Access plus Catalyst SD-WAN
        - Direct estate-led platform
        - Secure Access SSE plus Catalyst SD-WAN foundation for SASE with one console story
        - Cisco and Meraki standardized enterprises
        - Installed-base leverage and unified client-policy narrative
        - Strongest when buyer already prefers Cisco estate
      - - Fortinet FortiSASE plus Secure SD-WAN
        - Direct network-security platform
        - One OS policy engine and console across SD-WAN SSE and zero trust with 170+ PoPs
        - Fortinet estates branches and MSPs
        - Closest public integration match to Versa plus disclosed footprint
        - Benefits skew toward buyers already comfortable with Fortinet stack
      - - Zscaler Zero Trust Exchange
        - Security-first alternative
        - Large zero-trust security cloud with partner-SD-WAN routes common in brownfield estates
        - Largest enterprises prioritizing SSE and security-cloud scale
        - Strongest security-cloud mindshare and public scale markers
        - Less native WAN-first story and frequent need for partner SD-WAN
      - - Cato Networks
        - Direct converged SASE platform
        - Cloud-native single-vendor SASE on an 85+ PoP private backbone
        - Distributed mid-market and multi-region enterprises
        - Native convergence and backbone ownership
        - Less explicit on-premises flexibility narrative than Versa
      - - Netskope One
        - Direct data-security-first SASE platform
        - SASE with NewEdge plus native SD-WAN and converged access
        - Data-centric cloud-heavy enterprises
        - Strong data-security and proxy-cloud posture
        - Public messaging less centered on hybrid deployment control
      - - VeloCloud SD-WAN
        - Brownfield WAN alternative
        - Centralized overlay SD-WAN with orchestrator and SASE partnerships
        - Distributed enterprises modernizing WAN without full rip-and-replace
        - Keeps existing WAN transformation in place
        - Not a current default single-vendor SASE leader
      - - Carrier-led managed SASE
        - Managed substitute or route to market
        - Managed wrapper combining SD-WAN and security with staged or outsourced operations
        - Enterprises wanting contract and operating-model simplification
        - Reduces implementation burden and can preserve existing estate
        - Can commoditize platform choice and shift leverage to carrier or MSP
    notes: >-
      Rows compare the main ways an enterprise buyer can solve Versa's job in 2026: direct unified
      SASE vendors, estate-led incumbents, brownfield WAN overlays, and managed-service wrappers.
