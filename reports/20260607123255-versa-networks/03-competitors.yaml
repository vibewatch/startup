  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: pricing-opacity
      missingEvidence: Exact user site or traffic-based pricing for Versa and the major peer set plus discount corridors and services assumptions.
      whyItMatters: Public comparisons can only compare packaging logic and a few managed-service clues, not true total contract economics.
      diligencePath: Request current quote sheets sample proposals and at least three win-loss pricing comparisons by deal size.
      relatedQuestionRefs:
        - QP027
      relatedTableRefs:
        - TP003
    - type: private-evidence-only
      severity: material
      topic: versa-scale-proof
      missingEvidence: Named Versa customers published win rates PoP counts and renewal evidence against Palo Alto Cisco Fortinet Cato Netskope and Zscaler.
      whyItMatters: Public scale markers exist for several rivals, but Versa's public proof remains thinner than its architectural claims.
      diligencePath: Request named reference customers deployment counts pipeline conversion by channel and competitive displacement data.
      relatedQuestionRefs:
        - QP023
      relatedTableRefs:
        - TP001
    - type: missing-source
      severity: material
      topic: channel-durability
      missingEvidence: Direct evidence on whether Versa's service-provider route creates durable leverage or simply shifts economics and account control to intermediaries.
      whyItMatters: Channel reach can either widen distribution or weaken the vendor's direct moat depending on who owns renewal and operations.
      diligencePath: Ask for top service-provider partners by ARR renewal ownership margin share and reference wins where channel beat direct cloud-security leaders.
      relatedQuestionRefs:
        - QP017
        - QP026
      relatedTableRefs:
        - TP004
