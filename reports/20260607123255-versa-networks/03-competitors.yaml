  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Vendor / route
      - Public price or unit clue
      - Packaging clue
      - Channel or buying motion
      - What buyer still cannot see
      - Implication
    rows:
      - - Versa Networks
        - No public enterprise list price
        - Modules can be licensed separately or together
        - Channel and service-provider friendly
        - Realized pricing discounts and guarantees
        - Public story explains scope better than economics
      - - Palo Alto Prisma SASE
        - No public list rate on retained sources
        - Broad Prisma bundle across security and SD-WAN
        - Security-led enterprise sales motion
        - Exact SKU mix discounts and minimums
        - Scope is broad but packaging can feel complex
      - - Cisco Secure Access plus Catalyst
        - No public list rate on retained sources
        - Secure Access layered into Cisco estate and SD-WAN stack
        - Cisco and Meraki cross-sell motion
        - Bundle economics and cross-product discounting
        - Existing Cisco customers may buy on estate leverage more than raw price
      - - Fortinet FortiSASE plus Secure SD-WAN
        - Predictable cost claim with no bandwidth or data-transfer charges
        - Simplified licensing into FortiSASE from Secure SD-WAN
        - Fortinet estate and MSP motion
        - Realized discounting and support terms
        - Commercial signaling is clearer than most peers even without a rate card
      - - Zscaler Zero Trust Exchange
        - Enterprise pricing in retained 2026 comparison
        - Security-first platform often paired with partner SD-WAN
        - Largest-enterprise security motion
        - Contract structure and branch bundle economics
        - Strong security position may still require WAN-layer integration spend
      - - Cato Networks
        - Mid-market through enterprise pricing in retained 2026 comparison
        - Native single-vendor platform on one backbone
        - Distributed enterprise and mid-market motion
        - Detailed unit pricing and professional-services assumptions
        - Simplicity can be part of the value story
      - - Netskope One
        - No public enterprise list rate in retained sources
        - One platform plus converged access and native SD-WAN
        - Data-protection-first enterprise motion
        - SD-WAN packaging detail and discounting
        - Often sold on data-security value more than WAN price
      - - Carrier-led managed SASE
        - Lumen references a pricing table and 12-month self-managed term
        - Orange stages Managed SSE into Managed SASE and Verizon sells fully managed SASE
        - Carrier or MSP contract with operational wrapper
        - Underlying vendor economics and pass-through margins
        - Procurement can shift from product comparison to operating-model choice
    notes: >-
      Public pricing remains sparse across the core vendor set. The strongest public clues are term,
      packaging, and managed-service structure rather than apples-to-apples list price.
    enumerationScope:
