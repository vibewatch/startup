companyProfile:
  summary: Versa Networks is a Santa Clara-headquartered private networking and cybersecurity company founded in 2012 by Kumar Mehta and Apurva Mehta. The company sells a unified SASE and SD-WAN platform under VersaONE and VOS, with strong emphasis on service-provider, MSP, and regulated-enterprise deployments. Public evidence supports real scale—thousands of customers, hundreds of thousands of sites, and a large partner ecosystem—but the late-stage private profile remains under-disclosed on current financial quality, cap-table terms, and IPO timing.
  foundedDate: '2012-01-01'
  founders:
    - name: Kumar Mehta
      role: Founder and CDO
      background: Networking executive and engineer with prior leadership roles at Juniper, Riverstone, and Yago.
      claimRefs: [CO002, CO010]
    - name: Apurva Mehta
      role: Founder and CTO
      background: Former chief architect and CTO at Juniper and earlier networking startups, now leading Versa's technical architecture.
      claimRefs: [CO002, CO011]
  foundingLocation: Santa Clara, California, USA
  headquarters: Santa Clara, California
  productSummary: Versa sells a single-vendor security and networking stack spanning SASE, SSE, SD-WAN, SD-LAN, multitenancy, and sovereign or hybrid deployment options, delivered via software, appliances, and partner-managed services.
  customerFocus: Distributed enterprises, telecom and managed-service providers, and regulated organizations needing converged networking and security with flexible deployment control.
  businessModel: Subscription software and security services plus hardware appliances sold primarily through partners, carriers, and MSP channels.
  stage: late-stage private
  fundingStatus: Public retained sources support a September 2024 Series F of $90M at a $1.46B post-money valuation, but total capital raised and exact round sequencing remain inconsistent across data providers.
