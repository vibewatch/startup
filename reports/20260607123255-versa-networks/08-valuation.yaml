          Ratchets, preferred protections, or a lower secondary price make the risk/reward more attractive.
      - - Exit readiness
        - Partial
        - >-
          IPO intent is longstanding, but retained sources still frame Versa as pre-IPO with limited activity.
        - >-
          Public filing visibility, banker selection, and audited metrics would move readiness from partial to credible.
