  - id: comparable-framing
    title: Comparable Valuation Framing
    body: >-
      Versa's 2024 price looks most reasonable when framed as a mid-tier private SASE multiple rather than as a
      premium leader multiple. On RocketReach's $147.9 million revenue estimate, the Series F implies 9.9x revenue.
      That sits above Zscaler's roughly 7.0x market-cap-to-revenue multiple, above Cisco's roughly 8.1x, well above
      Check Point's roughly 5.1x and Juniper's roughly 2.6x, but below Cato's current private 13.7x ARR multiple.
      Fortinet's roughly 15.6x market-cap-to-revenue multiple shows that the public market will still pay up for a
      scaled security platform, but Fortinet is far more mature, profitable, and global than Versa. The result is a
      broad but still useful public band: Versa's price is not obviously impossible, yet it already assumes a better
      growth and quality profile than the median networking or mature-security comp.

      The private comp set reinforces that interpretation. Cato disclosed both more than $4.8 billion of valuation
      and more than $350 million of ARR with 43% year-over-year growth in 2025. Netskope separately disclosed that
      it surpassed $500 million ARR in 2024, while its 2021 funding round valued it at $7.5 billion. Those companies
      operate at materially higher scale than Versa's best-supported public estimate. Put differently, the market has
      paid 13-15x for category leaders with several hundred million dollars of recurring revenue; Versa's 9.9x looks
      like a discount to the leaders, but not a huge one, and therefore still demands confidence that Versa can grow
      into that tier.

      The competitive context makes that harder, not easier. Dell'Oro's 3Q24 market note said the top six SASE
      vendors controlled 72% of the market and overall growth had slowed to the weakest pace since tracking began.
      CRN and SDxCentral both highlighted Gartner's 2024 leadership set as Palo Alto Networks, Cato, and Netskope,
      with Versa in the challengers quadrant. Packet Pushers' review of Versa's Sovereign SASE option went further,
      arguing that the customer carries so much of the infrastructure and operations burden that the offer stretches
      the usual meaning of SASE. Those are real reasons to avoid paying a category-leader multiple for a challenger.
