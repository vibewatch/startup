  - id: financing-and-entry-discipline
    title: Financing Context, Capital Structure, and Entry Discipline
    body: >-
      The disclosed private-market history shows a real step-up but not an uninterrupted march toward a public exit.
      Forge Global lists Versa's June 2021 Series D at $84.05 million and $714.24 million post-money, the October
      2022 Series E at $75 million and $867.11 million post-money, and the September 2024 Series F at $90 million
      and $1.46 billion post-money. That means the 2024 round was about 68% above the 2022 mark. Total disclosed
      funding on Forge stands at $632.76 million. Official 2022 company messaging framed BlackRock's financing as a
      pre-IPO round that would accelerate Versa's IPO path, and Reuters-sourced coverage said management expected a
      public listing in roughly 18 months. By June 2026, however, retained secondary-market pages still treat Versa
      as pre-IPO: Forge labels the company as having filed a confidential S-1 with limited market activity, while
      Nasdaq Private Market and Notice still present Versa as a private company with quoted share prices rather than
      a completed listing.

      The secondary signals are directionally cautious rather than disastrous. Nasdaq Private Market showed a $4.08
      price per share updated May 22, 2026, versus Forge's $4.49 share price on the September 2024 round, implying
      roughly a 9% markdown. Notice's title-level quote of $3.46 points to an even deeper discount of about 23%.
      Neither source alone is perfect, but both point in the same direction: the market has not clearly marked the
      business above the 2024 financing.

      Capital structure also matters. Forge shows the 2024 Series F carrying a 1.0x liquidation preference with an
      8% cumulative dividend and the 2022 Series E carrying a 2.0x liquidation preference with a 12% cumulative
      dividend, both non-participating. Those terms do not doom the company, but they do mean that middling exit
      outcomes can protect preferred investors while leaving common holders and employee equity more exposed than the
      headline $1.46 billion valuation suggests. Entry discipline therefore starts with audited revenue and a full
      waterfall, not just a post-money headline.
