  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Audited revenue / ARR
        - FY2024-FY2026 audited revenue bridge and recurring-revenue mix
        - Current price is highly sensitive to the real denominator
        - Finance team; audited statements and board materials
      - - Retention quality
        - Gross retention, NRR, cohort expansion, and churn by customer segment
        - Premium software multiples require proof that growth is not just new-logo dependent
        - Finance and RevOps; cohort analysis and board dashboards
      - - Margin profile
        - Gross margin, sales efficiency, burn, and free cash flow trajectory
        - Distinguishes a premium software story from a lower-multiple networking vendor
        - Finance; management accounts and budget package
      - - Full cap table / waterfall
        - Security-by-security preference, dividends, conversion terms, and employee pool dilution
        - Headline post-money can overstate value to common holders
        - Legal and finance; most recent cap table and waterfall model
      - - IPO readiness
        - Banker engagement status, audit readiness, and timeline to public filing
        - Determines holding period, liquidity path, and tolerance for a premium entry price
        - CEO / CFO; IPO readiness workplan
      - - Competitive win-loss data
        - Recent head-to-head outcomes versus Palo Alto, Cato, Netskope, and Cisco
        - Needed to judge whether challenger status is improving or deteriorating
        - Sales leadership; win-loss analysis by quarter
    notes: >-
      The diligence asks are intentionally narrow. Every item maps directly to either the multiple denominator, the
      probability of an IPO-like exit, or the difference between preferred and common value realization.
    claimRefs:
