  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: audited revenue denominator
      missingEvidence: >-
        Audited FY2024-FY2026 revenue, recurring-revenue mix, and board-approved ARR definitions.
      whyItMatters: >-
        The entire valuation conclusion changes materially if real revenue is closer to $150M than to $200M+, so the
        denominator is the central diligence question.
      diligencePath: >-
        Request audited statements, management reporting packs, and the exact recurring-revenue bridge used in any internal or banker materials.
      relatedQuestionRefs:
        - QV006
        - QV012
        - QV013
      relatedTableRefs:
        - TV003
        - TV006
    - type: private-evidence-only
      severity: material
      topic: retention and economics
      missingEvidence: >-
        Net revenue retention, gross retention, gross margin, sales efficiency, burn, and free cash flow by period.
      whyItMatters: >-
        Premium software-like multiples require proof that growth is efficient and durable rather than the product of costly new-logo acquisition.
      diligencePath: >-
        Obtain cohort dashboards, CFO board materials, and KPI histories tied to the latest financing and IPO-preparation workstreams.
      relatedQuestionRefs:
        - QV024
        - QV025
        - QV030
    - type: private-evidence-only
      severity: material
      topic: cap table and waterfall
      missingEvidence: >-
        Full security-by-security cap table, option pool dilution, and modeled proceeds waterfall across exit values.
      whyItMatters: >-
        Forge exposes some preferred terms, but not enough to quantify how much value common holders retain in sub-$1B or flat-round outcomes.
      diligencePath: >-
        Request the latest cap table, financing documents, and a legal or finance-prepared waterfall model for key exit scenarios.
      relatedQuestionRefs:
        - QV004
        - QV029
      relatedTableRefs:
        - TV005
        - TV006
    - type: missing-source
      severity: minor
      topic: current private comp marks
      missingEvidence: >-
        Fresh disclosed private valuations for Netskope and other close SASE peers at the same time as their latest ARR disclosures.
      whyItMatters: >-
        The retained private comp set is directionally helpful, but one comp is current (Cato) and another uses a stale valuation year (Netskope).
      diligencePath: >-
        Refresh private-comp work with current tender, secondary, or late-stage round documents before making a hard relative-value call.
      relatedQuestionRefs:
        - QV022
        - QV023
      relatedTableRefs:
        - TV004
