company:
  name: Versa Networks
chapter:
  number: 8
  title: Valuation
  summary: >-
    Forge Global lists Versa Networks' September 2024 Series F at a $1.46 billion post-money valuation,
    which implies roughly 9.9x revenue on RocketReach's $147.9 million estimate and a much wider 2.9x-14.6x
    range against third-party revenue estimates. That price can be defended only if Versa's true revenue base is
    closer to $180-200 million and growth remains strong despite a more consolidated SASE market where Gartner's
    2024 leaders were Palo Alto Networks, Cato, and Netskope while Versa remained a challenger. With private
    market marks on Nasdaq Private Market and Notice running below the 2024 round and recent preferred terms
    carrying cumulative dividends, the stance is track / research-more with fair-to-stretched pricing and high
    sensitivity to audited revenue, retention, and cap-table detail.
sections:
  - id: recommendation-and-thesis
    title: Recommendation, Thesis, and Anti-Thesis
    body: >-
      Versa Networks still has a credible investment story. The company has a real installed base, public proof of
      category relevance, and durable strategic backing. Official and Reuters-sourced materials show that Versa
      raised a BlackRock-led pre-IPO round in 2022, serves more than 10,000 customers, and remains positioned by
      management as a serious SASE contender. Versa's own disclosures also show it led the narrower unified-SASE
      segment in 3Q23 revenue and remained a Gartner single-vendor-SASE challenger in 2024 while also appearing in
      Gartner's SSE and SD-WAN reports. Those facts matter because they indicate that the company is not a concept
      stock; it has enough product breadth and customer scale to matter in a real consolidation cycle.

      The anti-thesis is more valuation-specific than product-specific. Public sources do not disclose audited ARR,
      gross margin, NRR, or free cash flow. The strongest retained revenue estimate is RocketReach's $147.9 million,
      while IncFact only offers a very wide $100-500 million band. That uncertainty leaves the 2024 Series F mark
      highly sensitive to the chosen denominator. On the best-supported estimate, the post-money valuation implies
      roughly 9.9x revenue, above Zscaler's current market-cap-to-revenue multiple and well above mature networking
      or firewall peers such as Cisco, Check Point, and Juniper. Meanwhile, Gartner's 2024 leaderboard put Palo
      Alto Networks, Cato, and Netskope in the leaders quadrant while Versa remained a challenger, and Dell'Oro's
      3Q24 market report showed the overall SASE market consolidating around the six largest vendors. That is not a
      death sentence, but it does argue against paying a scarcity premium without audited financial proof.

      Recommendation: track / research-more. The round is not obviously irrational, but it is not a clear bargain
      either. The right underwriting question is not whether Versa is a legitimate company; it is whether the 2024
      price already discounts a growth and IPO trajectory that public evidence cannot yet verify.
