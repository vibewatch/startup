  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / signal
      - Transmission to thesis
      - Action implication
    rows:
      - - Secondary price deterioration
        - Sustained private quote below $3.00/share
        - Suggests the market no longer supports the 2024 round economics
        - Re-underwrite to bear-case range and avoid paying up for common or junior preferred
      - - Growth slowdown
        - Evidence that revenue growth has fallen below ~10-15%
        - Removes the premium-multiple justification for a challenger vendor
        - Shift valuation framework toward Juniper / Check Point-style downside bands
      - - IPO slippage
        - No clearer filing, banker, or audit readiness signal over the next 12 months
        - Extends the holding period while preserving private-company opacity
        - Treat the story as a private hold with lower liquidity premium
      - - Market concentration worsens
        - Top-six SASE share continues rising while Versa remains a challenger
        - Implies share capture is moving to the largest platforms instead of to challengers
        - Cut expected exit multiple and probability of leader-like outcomes
      - - Preference overhang deepens
        - New capital adds richer preferences or cumulative dividends
        - Increases divergence between headline valuation and common-holder value
        - Demand stronger protections or walk away
    notes: >-
      Kill criteria focus on measurable transmission channels from market structure or financing terms into valuation,
      not on vague operating disappointment.
