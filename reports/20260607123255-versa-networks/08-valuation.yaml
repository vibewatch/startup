          Versa remains a real SASE vendor with Gartner and Dell'Oro evidence that it matters in the category.
        - >-
          Gartner's 2024 leaders were Palo Alto, Cato, and Netskope, while overall SASE share concentrated in larger vendors.
        - Mixed but substantive
      - - Customer footprint
        - >-
          Reuters-sourced and company materials point to more than 10,000 customers and tens of thousands of customer relationships.
        - >-
          Customer count does not prove monetization quality, enterprise concentration, or retention durability.
        - Medium
      - - Product architecture
        - >-
          Versa spans SD-WAN, SSE, and broader unified-SASE positioning, which supports a differentiated networking-plus-security story.
        - >-
          Packet Pushers argues Sovereign SASE shifts so much burden to the customer that it stretches the normal definition of SASE.
        - Medium
      - - Financial profile
        - >-
          Revenue could be materially above the third-party $147.9M estimate, which would make the 2024 round look closer to public comp territory.
        - >-
          Public evidence does not disclose audited ARR, NRR, gross margin, or cash burn, leaving the round exposed to denominator risk.
        - Low-to-medium
      - - Exit path
        - >-
          Official 2022 messaging and Forge's confidential-S-1 flag indicate a continuing IPO ambition.
        - >-
          By mid-2026 the company is still on pre-IPO venues with limited activity and no public filing transparency.
