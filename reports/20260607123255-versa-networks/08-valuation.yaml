        - Track / research-more
        - >-
          Real category relevance and customer scale, but too much reliance on estimated revenue and incomplete IPO proof.
        - >-
          Upgrade only if audited revenue is at least ~$180-200M with strong retention and cleaner secondary support.
      - - Confidence
        - Medium-low
        - >-
          Multiple independent sources confirm funding history and market position, but none disclose audited ARR, NRR, or free cash flow.
        - >-
          Confidence rises with audited financial disclosure and a clearer public-market timetable.
      - - Risk rating
        - High
        - >-
          Market consolidation, challenger positioning, and capital-structure overhang all increase execution risk.
        - >-
          Risk falls if Versa proves leader-level growth and removes preference-stack uncertainty.
      - - Valuation stance
        - Fair-to-stretched
        - >-
          Fair if revenue is nearer $180-200M; stretched on the best-supported $147.9M estimate.
        - >-
          A lower entry price or audited revenue above the current public estimate would improve the setup.
      - - Entry discipline
        - Prefer below 2024 round or with downside protections
        - >-
          Secondary quotes on Nasdaq Private Market and Notice sit below the $4.49 September 2024 price.
