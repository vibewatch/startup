      - - Cisco
        - Public networking and security incumbent
        - $479.43B market cap
        - $59.05B TTM revenue
        - 8.12x
        - Useful networking-side anchor for a SASE / SD-WAN buyer universe
        - Highly diversified and acquisition-heavy versus Versa's narrower mix
      - - Check Point Software
        - Public mature firewall / network security vendor
        - $14.12B market cap
        - $2.75B TTM revenue
        - 5.13x
        - Mature security floor for slower-growth, cash-generative execution
        - Legacy-heavy and not a clean single-vendor SASE peer
      - - Juniper Networks
        - Public networking vendor
        - $13.35B market cap
        - $5.20B TTM revenue
        - 2.57x
        - Networking valuation floor if investors view Versa more as SD-WAN plumbing than premium SASE software
        - Least software-like comp in the set
      - - Cato Networks
        - Private single-vendor SASE leader
        - More than $4.8B valuation
        - More than $350M ARR
        - 13.71x ARR
        - Best current private SASE leader comp with disclosed scale and growth
        - Higher growth, clearer leader status, and larger ARR base than Versa
      - - Netskope
        - Private / pre-public SASE scale reference
        - $7.5B historical valuation (2021)
        - More than $500M ARR disclosed in 2024
        - ~15x on a stale cross-period comparison
        - Helps frame scale threshold for premium SASE narratives
        - Valuation and ARR are from different years, so the multiple is directional only
