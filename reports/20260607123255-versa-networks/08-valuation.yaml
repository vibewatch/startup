        - >-
          Preferred rounds can cushion new money and preserve downside protection for investors entering via preferred terms.
        - >-
          Common and option holders face meaningful overhang from cumulative dividends and a 2.0x Series E liquidation preference.
        - High on terms, low on full waterfall
    notes: >-
      The table separates company quality from price quality. Several positives are real, but the anti-thesis is driven
