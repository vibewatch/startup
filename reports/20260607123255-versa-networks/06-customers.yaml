  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention metrics gap
    missingEvidence: GRR, NRR, churn, contract-length distribution, and renewal data by customer cohort or segment.
    whyItMatters: Public proof shows real adoption and outcomes, but it does not reveal the durability of recurring revenue or the quality of expansion economics.
    diligencePath: Request customer cohort tables, renewal rates, logo churn, downsell history, and contract-length distribution from management.
    relatedQuestionRefs:
    - QU025
  - type: private-evidence-only
    severity: material
    topic: concentration and mix gap
    missingEvidence: Exact current split between enterprise, service-provider, and MSP accounts, plus top-customer and top-partner concentration data.
    whyItMatters: Versa's visible proof is partner-heavy, so concentration and channel dependence cannot be underwritten from public evidence alone.
    diligencePath: Request direct-versus-channel customer counts, revenue mix, top-10 customer and partner exposure, and any >5% account disclosures.
    relatedQuestionRefs:
    - QU024
    - QU026
  - type: enumeration-incomplete
    severity: minor
    topic: named customer proof table coverage
    missingEvidence: A complete named-customer roster with deployment stage, module depth, ACV, and renewal status.
    whyItMatters: The public roster is strong enough to prove real adoption, but it is still only a partial window into the installed base.
    diligencePath: Request the current referenceable customer list and a deployment-stage matrix for top enterprise and service-provider accounts.
    relatedQuestionRefs:
    - QU004
    - QU005
    relatedTableRefs:
    - TU003
