    - Shows Versa can win regulated and operationally complex deployments
    - No public-sector revenue mix or renewal data
  - - Financial services
    - Bank IT, security, and branch operations teams
    - RCBC case study; Caliber Home Loans testimonial
    - Indicates branch-heavy, security-sensitive workflows beyond telecom buyers
    - No disclosed ACV or deployment depth by account
  - - Energy / critical infrastructure
    - Infrastructure operators, plant and site managers, security teams
    - SB Energy case study; Sovereign SASE cites defense, maritime, energy, and retail deployments
    - Supports critical-infrastructure and industrial network relevance
    - Public proofs lack recurring-economics disclosure
  - - Telecom / service providers
    - Managed network and product leaders
    - Verizon, Colt, Lumen, Tata Communications, Orange Business Services, Lintasarta
    - Major route to scale through managed SASE, SD-WAN, and multi-tenant delivery
    - Exact current split between customers and partners is unclear
  - - MSP / NaaS / managed-solutions channel
    - MSP owner, managed-services GM, NaaS operator
    - OmniClouds, Crown Castle, Versa Powered Service Providers
    - Extends Versa into downstream subscriber and white-label expansion loops
    - Partner dependence risk if key channels slow or switch
  notes: Public segmentation is inferred from retained customer proofs, testimonials, and partner pages rather than a company-disclosed customer taxonomy.
