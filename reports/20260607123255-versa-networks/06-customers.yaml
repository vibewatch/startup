- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Driver / risk
  - Public signal
  - Impact
  - Why it matters
  - Diligence path
  rows:
  - - Site and user expansion
    - Customer stories cite 180+ sites, 37 countries, and larger downstream network counts
    - Positive
    - Suggests Versa can deepen within distributed accounts after initial land
    - Request account-level expansion history by module and site count
  - - Managed-service white-label expansion
    - Verizon, Colt, Lumen, OmniClouds, and Lintasarta all show partner-led delivery
    - Positive with dependency
    - Channel can multiply reach faster than direct sales alone
    - Request top-partner bookings, pipeline, and churn data
  - - Sovereign SASE portfolio extension
    - 2025 launch targets enterprises and service providers with partner-owned infrastructure
    - Positive
    - Opens regulated and localized-delivery opportunities that may be hard for cloud-only SASE rivals
    - Request current sovereign customers and ACV by vertical
  - - Partner dependence
    - Public proof is heavily skewed toward carriers, MSPs, and managed solutions providers
    - Material
    - A few strategic channels may mediate a large share of visible customer reach
    - Request direct-versus-partner customer count and revenue mix
  - - Customer concentration
    - Top-customer exposure not publicly disclosed
    - Material
    - Large distributed deployments may still hide concentration if a few channels dominate volume
    - Request top-10 customer and top-10 partner concentration data
  - - Retention quality
    - No public GRR, NRR, churn, or renewal data
    - Material
    - Public outcome proof does not equal durable recurring economics
    - Request cohort tables, renewal rates, and downsell history
  notes: Public evidence supports real expansion paths but leaves the economic durability questions unanswered.
