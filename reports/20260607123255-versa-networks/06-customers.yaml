figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Public evidence suggests Versa wins both direct-enterprise and partner-led accounts through a high-touch motion that starts with proof, lands a first deployment, and then expands into more sites, users, or managed-service subscribers.
  approximationNotes: The map abstracts across case studies, testimonials, partner pages, and support materials rather than a single formal process diagram.
  data:
    items:
    - label: Discover and shortlist
      actor: CIO, network architect, or managed-services lead
      touchpoints:
      - Customer case studies
      - Testimonials and partner pages
      - Gartner / PeerSpot research
      painpoint: Buyers want to consolidate networking and security without adding operational sprawl.
      opportunity: Versa shows both direct-enterprise wins and carrier / MSP delivery routes.
    - label: Validate with proof
      actor: Procurement and technical evaluation team
      touchpoints:
      - Dorset Council / Adobe / Dell outcome stories
      - Verizon / Colt / Lumen partner pages
      - PeerSpot implementation commentary
      painpoint: Buyers need evidence that Versa can work in branch-heavy and managed-service environments.
      opportunity: Public proof includes quantified savings, ROI, and downstream customer scale.
    - label: Land first deployment
      actor: Network engineering and security operations
      touchpoints:
      - SD-WAN or SASE rollout
      - Branch visibility and policy control
      - Remote-work or secure-internet use case
      painpoint: Initial setup and service design can be complex.
      opportunity: Several customers cite fast or materially improved rollout economics once deployed.
    - label: Support and optimize
      actor: Customer success, TAC, or managed-service team
      touchpoints:
      - Premier Support
      - Implementation guides
      - Designated support engineers
      painpoint: Complex environments may require expert assistance and escalation paths.
      opportunity: Versa explicitly positions 24x7 support and designated experts as part of the motion.
    - label: Expand footprint
      actor: Enterprise sponsor or managed-services GM
      touchpoints:
      - More sites and countries
      - Additional branch / user populations
      - Downstream subscriber growth
      painpoint: Expansion quality is hard to underwrite without NRR and cohort data.
      opportunity: Case studies show rollout from initial land into broader site, user, and customer-base growth.
    - label: Productize managed service
      actor: Carrier, MSP, or sovereign SASE operator
      touchpoints:
      - Multi-tenancy
      - White-label managed SASE
      - Partner-owned infrastructure
      painpoint: Channel leverage increases dependence on a few strategic service-provider relationships.
      opportunity: Sovereign SASE and managed-SASE partner pages show a route to portfolio-level expansion.
  claimRefs:
  - CU006
  - CU024
  - CU037
  - CU040
  - CU042
  - CU043
- id: FU002
  title: Adoption / deployment flow
  type: flow
  layout: wide
  summary: Versa’s public customer motion branches through both direct-enterprise and carrier / MSP routes before converging on rollout, support, and expansion.
  approximationNotes: The flow is synthesized from retained case studies, testimonials, partner pages, and the support page rather than a single published funnel.
  data:
    nodes:
    - id: enterprise-route
      label: Direct enterprise route
      detail: Enterprise buyers use case studies and testimonials to justify SD-WAN or SASE replacement projects.
    - id: partner-route
      label: Carrier / MSP route
      detail: Verizon, Colt, Lumen, Tata, OmniClouds, and Lintasarta demonstrate managed-service or partner-led adoption.
    - id: first-rollout
      label: First rollout
      detail: Initial deployments center on branches, remote users, secure internet access, or managed customer edges.
    - id: support-layer
      label: Support and policy operations
      detail: Premier Support, designated engineers, and implementation guidance stabilize complex deployments.
    - id: expand-footprint
      label: Expand sites, users, or subscribers
      detail: Accounts deepen through more sites, more countries, more downstream customer networks, or better work-from-home usage.
    - id: portfolio-expansion
      label: Managed SASE / sovereign portfolio
      detail: Partners and regulated customers can package Versa into broader managed or sovereign service portfolios.
    edges:
