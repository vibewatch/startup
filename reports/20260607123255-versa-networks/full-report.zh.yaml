  - id: TE001
    title: 产品模块 / 资产矩阵
    columns:
      - 模块 / 资产
      - 主要用户
      - 状态 / 成熟度
      - 差异化
      - 尽调缺口
    rows:
      - - VersaONE / 统一 SASE 平台
        - 企业网络 + 安全团队
        - GA / 核心平台
        - 基于 VOS 的单一平台，覆盖云端、本地和混合环境中的网络、安全、SD-WAN 和分析
        - 需要逐客户证明单一平台在实践中减少工具蔓延，而不只是架构上成立
      - - Versa Secure SD-WAN
        - 网络工程团队、MSP
        - GA / 成熟
        - 把路由、多租户、安全和分析放进同一个 WAN 边缘栈；支持通用硬件和零接触配置
        - 运营复杂度仍高于更简单的 SSE-only 或 SMB-first 替代方案
      - - Secure Access Client + ZTNA/SWG 网关模型
        - 远程用户、承包商、BYOD 用户
        - GA / 成熟
        - 客户端可将指定应用 / 域名导向 Versa Cloud Gateway，同时允许本地出口；一个客户端框架横跨 ZTNA 和 SWG
        - 公开证据没有完整列出 OS 对等性，尤其是 Mac/iOS 边缘场景
      - - VSIA + NGFWaaS
        - 替换集中式防火墙回传的安全团队
        - GA / 成熟
        - 云端交付的防火墙、分段、解密和策略执行，与更广的 SASE 栈集成
        - 没有公开第三方基准，对比其检测效果与独立 NGFW 龙头
      - - Director / Concerto / Titan 管理栈
        - 平台运营方、MSP
        - GA / 成熟
        - 模板、API、拓扑工作流和 private-SASE 网关激活流程，支撑大型多租户环境
        - 多个编排界面提高了操作员学习要求
      - - Versa Analytics / DEM
        - NOC、SOC、平台工程
        - GA / 成熟
        - 覆盖网络和安全服务的实时 + 历史分析、异常检测和自动扩缩容指引
        - 没有标准化公开 SLA 或基准，衡量超大规模下的告警质量、误报率或仪表盘性能
      - - AI 就绪运营（Verbo、AI OCR、上下文 DLP、边缘 AI 支持）
        - 安全运营和架构团队
        - 已发布 / 2026 年走向成熟
        - 把 AI 推进 DLP、告警关联、故障排查和边缘服务链，但不声称另做独立平台
        - 这些新 AI 层的独立生产案例和基准数据仍有限
      - - 安全企业浏览器
        - 聚焦 GenAI、BYOD 和承包商访问的安全团队
        - 早期访问 / 尚未成熟
        - 把 Zero Trust 执行直接延伸到浏览器会话，并复用现有策略引擎和数据平面
        - GA 时间、支持的 OS 矩阵和参考客户未公开记录
