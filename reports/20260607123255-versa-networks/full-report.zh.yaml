  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式、包装与渠道变现
        blocks:
          - type: paragraph
            body: >-
              Versa 的公开商业足迹指向混合收入模式：围绕经常性软件、服务提供商托管服务和渠道销售设备搭建，而不是简单的纯 SaaS 模式。官方伙伴材料明确描述用于 MSP
              盈利的多租户、精简计费和可预测经常性收入模式，托管服务方案简报称，服务提供商可用 Versa 推出更多托管 ZTNA、IoT 安全和可观测性产品。ACA Pacific 管理的 AWS Marketplace
              条目也把 Versa 定位为一个基础托管解决方案，可经云、本地或混合部署交付。这说明经常性许可和托管服务收入是模型核心。

              硬件仍是商业包的一部分。Versa 的 CSG
              硬件页面称公司不直接销售设备，客户和合作伙伴通过分销购买，这意味着组合中至少仍有一些一次性或捆绑设备经济性。硬件组合覆盖家庭办公室、分支、园区和数据中心形态，扩大了商业表面，但可能引入更低毛利的产品组件、经销折扣和支持义务，纯软件厂商本可避免这些。

              定价透明度有限。Versa 官方界面不发布核心 SASE、SSE 或 SD-WAN 软件标价，AWS Marketplace
              条目也把买家导向托管或私有报价沟通，而不是清晰公开价目表。这让公开实现价格分析很难，也意味着收入质量必须从合同结构和渠道设计推断，而不能从披露的 ACV 或 ARR 指标得出。
