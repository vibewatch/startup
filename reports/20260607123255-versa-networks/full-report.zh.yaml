    rows:
      - - Versa Networks
        - 标的平台
        - 统一 SASE 加 Secure SD-WAN，支持混合云、本地部署和混合交付
        - 企业、服务商和渠道伙伴
        - 混合灵活性、多租户能力和 WAN 优先的一致性
        - 公开入围领先证据、公开定价和云足迹证明较少
      - - Palo Alto Prisma SASE
        - 安全主导的直销平台
        - AI 驱动的综合 SASE，包含多云架构和 Prisma SD-WAN 套件
        - 安全主导的企业和公共部门买家
        - 企业安全能力深，平台叙事覆盖广
        - 产品组合广度和授权可能增加打包复杂度
      - - Cisco Secure Access 加 Catalyst SD-WAN
        - 存量资产主导的直销平台
        - Secure Access SSE 加 Catalyst SD-WAN 支撑 SASE，并主打一套控制台
        - 已标准化 Cisco 和 Meraki 的企业
        - 装机基础杠杆和统一客户端策略叙事
        - 买家已偏好 Cisco 体系时最强
      - - Fortinet FortiSASE 加 Secure SD-WAN
        - 网络安全直销平台
        - 一个 OS、策略引擎和控制台覆盖 SD-WAN、SSE 与零信任，并有 170+ 个 PoP
        - Fortinet 存量体系、分支和 MSP
        - 公开集成叙事最接近 Versa，且披露了网络足迹
        - 收益偏向已熟悉 Fortinet 技术栈的买家
      - - Zscaler Zero Trust Exchange
        - 安全优先替代方案
        - 大型零信任安全云；在棕地环境中常走合作伙伴 SD-WAN 路径
        - 优先看重 SSE 和安全云规模的大型企业
        - 安全云心智最强，公开规模标记清晰
        - 原生 WAN 优先叙事较弱，常需要合作伙伴 SD-WAN
      - - Cato Networks
        - 融合 SASE 直销平台
        - 基于 85+ PoP 私有骨干网的云原生单厂商 SASE
        - 分布式中端市场与多区域企业
        - 原生融合和自有骨干网
        - 本地部署灵活性叙事不如 Versa 明确
      - - Netskope One
        - 数据安全优先的直销 SASE 平台
        - SASE 结合 NewEdge、原生 SD-WAN 和融合访问
        - 以数据为中心、云占比较高的企业
        - 数据安全和代理云姿态强
        - 公开信息较少围绕混合部署控制
      - - VeloCloud SD-WAN
        - 棕地 WAN 替代方案
        - 带编排器和 SASE 合作伙伴关系的集中式 overlay SD-WAN
        - 在不全量替换下现代化 WAN 的分布式企业
        - 保留既有 WAN 转型成果
        - 目前不是默认单厂商 SASE 领导者
      - - 运营商主导的托管 SASE
        - 托管替代方案或上市路径
        - 将 SD-WAN 与安全打包，配合分阶段或外包运营的托管外壳
        - 希望简化合同和运营模式的企业
        - 降低实施负担，并可保留既有环境
        - 可能让平台选择商品化，把议价权转向运营商或 MSP
    notes: 这些行比较企业买家在 2026 年完成 Versa 所承担任务的主要路径：直接采购统一 SASE 厂商、选择存量体系厂商、沿用棕地 WAN overlay，或套上托管服务外壳。
