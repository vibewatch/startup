              核心厂商组的企业定价大多仍属私有，但包装和商业化线索可见。Versa 发布的是模块化平台话术和伙伴适配，不是价格表。Deepak 的 2026 比较把 Zscaler 描述为企业级定价、Palo Alto SKU
              复杂、Cato 覆盖中端市场到企业定价、Cisco 借既有资产定价。Fortinet 在公开商业信号上走得更远，承诺没有带宽授权的可预测成本，并把授权简化进 FortiSASE。Lumen 公开提到价格表、12
              个月期限，以及按设备的 SD-WAN 加安全授权，用于自管 SASE。Verizon 和 Orange 把替代采购路径说得更明白：购买完全托管或分阶段的 SASE 外壳，而不是选择独立平台再自己配齐运营模型。这对
              Versa 是双刃剑。服务提供商就绪的架构扩大分销和渠道触达，但也更容易让运营商和 MSP 拿走合同、Day-2 运营层，有时还拿走客户关系。
