  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台定义与产品范围
        blocks:
          - type: paragraph
            body: >-
              Versa 的产品版图围绕一个想法搭建：一个操作系统 VOS 应承载网络、SD-WAN、安全、编排和分析，跨同一资产运行，而不是把收购来的单点产品拼在一起。官方产品目录和第三方评测指向同一幅图：VersaONE
              或 Versa SASE 覆盖 ZTNA、SWG、CASB、NGFWaaS、RBI、Network DLP、路由和分析等核心访问功能，Secure SD-WAN 是锚点 WAN
              边缘工作负载。这种宽度是真实技术差异化，尤其适合想要自托管、混合或托管服务灵活性的大企业和服务提供商，也适合多租户重要的场景。它也是平台主要风险的根源：产品组合足够深，买家必须理解多个运营模式、管理界面和部署路径，而不是一个简化的单一用途
              SSE 产品。
