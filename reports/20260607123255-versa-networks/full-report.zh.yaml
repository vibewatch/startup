      - number: '1.5'
        title: 反向、治理与披露信号
        blocks:
          - type: paragraph
            body: >-
              本章最清楚的风险不是产品弱，而是披露质量。Versa 已到足以讨论 IPO 准备、支撑主权国家级部署、并拥有大型机构投资者的后期阶段，但公开经营数据仍稀疏。当前
              ARR、毛利率、烧钱速度和留存未披露；客户规模以大而概括的整数描述；外部数据库在融资额和估值上相互打架。投资人最在意的估值锚定、退出时间和经营杠杆，因此正好遇到尽调摩擦。还有更软但相关的负面信号。RepVue 对
              46 名经验证员工评分给出 3.4，指向销售组织情绪混杂；这不能证明系统性问题，但提示应仔细看一线生产率、quota 设计和人员流失。另有 Tech Field Day 记录的批评意见质疑 Versa
              的主权扩展是否仍符合最严格的 SASE 定义，凸显公司为应对主权需求而拉伸品类时的定位风险。单看任何问题都不像生死线，但合在一起，它们支持一种尽调姿态：把强产品和渠道证据，与较弱的上市公司准备证据分开。投资人应把
              2024 年 9 月估值和任何保密申报叙事视为临时说法，直到管理层给出一手文件。
