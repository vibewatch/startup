      - number: '1.4'
        title: 渠道足迹、服务提供商导向与主权 SASE 里程碑
        blocks:
          - type: paragraph
            body: >-
              Versa 的渠道姿态不是旁枝，而是商业模式的定义性部分。公司称其全球销售 100% 由合作伙伴完成，MSP 材料强调租户隔离、计费、API
              和经常性利润结构，高管名单中也有专门的服务提供商销售角色。历史里程碑强化了这种导向。Tata Communications 早在 2016 年就选择 Versa 软件用于托管 SD-WAN 服务，Adobe 在
              2018 年公开与 Versa 一同作为企业 SD-WAN 参考案例出现。到 2024 和 2025 年，Versa 用同一套运营商 DNA 扩展到托管和主权 SASE。Tata 于 2024 年携 Versa
              推出 Hosted SASE；Versa 随后在 2025 年让主权 SASE 正式面向市场，明确瞄准需要本地控制、数据驻留和气隙选项的企业、政府与服务提供商。Network World 和 CRN
              的独立报道表明，这不只是营销话术：主权部署被定位为客户控制的基础设施，Kelly Ahuja 告诉 CRN，Versa 前 100 大客户中 85 percent to 90 percent
              已有主权部署。Swisscom 的 2025 年 beem 基于 Versa 主权架构发布，给公司提供了高可见度的电信验证；而 2026 年 Sovereign SASE-as-a-Service
              推出，降低了受监管企业的运营负担，它们想要司法辖区控制，却不想自己搭技术栈。
