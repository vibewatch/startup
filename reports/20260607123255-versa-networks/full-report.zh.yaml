      - 威胁或反证
      - 严重性
      - 为什么重要
      - 缓释措施或尽调问题
    rows:
      - - 单一平台叙事具有独特差异化
        - Fortinet 和 Cato 的公开集成主张同样强或更强，Palo Alto 和 Cisco 也在营销统一运营
        - 高
        - 单一控制台话术在候选名单中普遍存在
        - 专门索取与 Fortinet、Cato、Palo Alto 和 Cisco 对阵的胜负数据
      - - 混合本地部署与云部署灵活性带来耐久优势
        - Netify 说明灵活性重要，但 Orange、Verizon 和 Lumen 也证明，买家可以靠托管封装解决同一问题
        - 中
        - 交付灵活性有帮助，但未必能控制与预算方的关系
        - 要求提供证据：混合部署能拿下竞争对手或运营商输掉的交易
      - - 服务提供商触达就是护城河
        - 运营商和 MSP 可以握住合同，把底层平台抽象掉
        - 高
        - 渠道权力可以扩大触达，也会削弱厂商直连客户的杠杆
        - 核查续约归属、利润分成，以及具名服务提供商胜单
      - - 存量环境的既有优势会挡住竞品替换
        - Zscaler 的合作伙伴 SD-WAN 模式和 VeloCloud 叠加层说明，买家可以共存推进，避开彻底拆换
        - 中
        - 买家可以逐步叠加安全和传输改造
        - 梳理迁移时间线，以及 Versa 真正迫使替换的环节
      - - 安全优先买家会接受 WAN 优先的取舍
        - 企业默认评估的独立候选名单仍偏向 Palo Alto、Zscaler、Netskope 和 Cato
        - 高
        - 心智份额和公开证据可能压过架构纯度
        - 要求提供安全团队而非网络团队牵头时的胜单证明
      - - 定价不透明在企业交易中无伤大雅
        - 公开资料仍更认可那些披露期限结构、价目表线索或成本可预测表述的厂商 / 托管封装
        - 中
