            body: >-
              Versa 的扩张故事在合作伙伴主导和托管服务渠道中最强。Verizon、Colt 和 Lumen 都销售基于 Versa 的托管 SASE 或集成 SASE 产品，Versa 2025 年 Sovereign
              SASE 发布也明确同时面向企业和服务提供商，包括受监管 行业用例和合作伙伴自有交付环境。2020 年居家办公公告还显示，客户使用量依托赋能服务提供商、合作伙伴和 Versa 托管云服务扩大 100
              倍。上行空间来自这里：单一平台可以靠更多站点、更多用户、更多托管服务订阅者，以及更多白标 合作伙伴产品扩张。风险也来自这里。公开证据高度偏向服务提供商和渠道赋能交付，而 Versa 没有披露准确客户结构、
              留存、流失、NRR 或头部客户集中度。因此，本章支持真实的落地后扩张动作，但对耐久性只能给出部分信心，因为最重要 的留存和集中度指标仍未公开。
