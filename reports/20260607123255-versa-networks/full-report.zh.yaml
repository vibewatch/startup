  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 网络安全、产品质量和平台可靠性风险
        blocks:
          - type: paragraph
            body: >
              Versa 最尖锐的反向信号是 2024 年 Versa Director 漏洞 CVE-2024-39717。公司自己的公告称，该漏洞影响 Versa
              Director，且已知至少一次被高级持续性威胁行为者利用。NVD 和 CISA 显示，该漏洞严重到进入 Known Exploited Vulnerabilities 目录，并设有联邦修复期限；Black
              Lotus Labs、Insurance Journal/Bloomberg、 KrebsOnSecurity、The Hacker News 和 PYMNTS 都描述了针对 ISP/MSP
              环境的利用，以及下游客户风险。它比 普通产品 CVE 更重要，因为 Director 不是单个分支的边缘盒子，而是服务提供商常用来编排许多客户环境的管理层。 因此，利用路径同时击中信任、渠道安全和受监管客户信心。

              第二层产品风险是运营质量。公开评论来源通常肯定功能覆盖面，但负面细节一致到值得重视：PeerSpot 称一名客户 从 bug 较多的新版本回退到此前稳定版本；Gartner SD-WAN
              评论提到入门引导过时、部署后互动较弱； TrustRadius、PeerSpot 和 Gartner 都指向陡峭学习曲线、支持不一致，或 Versa 不拥有自有骨干网等平台 缺口。这不能证明系统性质量失败，但说明
              Versa 靠广度和灵活性做出的差异化要付执行税。投资人应把工程质量、发布 纪律和一线支持能力视为尽调关键，而不是假设评论均值已经说明全部问题。
