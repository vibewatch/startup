  - id: TE002
    title: 工作流 / 用例表
    columns:
      - 用户任务
      - 当前工作流
      - Versa 方案
      - 可衡量收益
      - 局限
    rows:
      - - 无需 MPLS 回传，保护分支到云端 SaaS 访问
        - 传统 MPLS 和集中式防火墙发夹路由带来延迟和成本
        - Secure SD-WAN + 本地出口 + NGFWaaS 或 Zscaler 集成
        - 官方材料主张降低延迟、加快上线，并让各站点策略保持一致
        - 收益主要来自公司主张；公开延迟或成本基准稀缺
      - - 向远程和 BYOD 用户交付 ZTNA 或 SWG
        - 分散的 VPN、Web 代理和端点控制会留下策略缺口
        - Secure Access 门户 / 网关，加上带分流隧道或排除规则的 SASE 客户端
        - 一个客户端框架可在中央策略下，分别导流私有应用和互联网流量
        - Mac/iOS 对等性和 SSL-VPN 替换完整性仍需尽调
      - - 为大量客户运营多租户托管服务
        - 逐客户独立技术栈会抬高成本和管理开销
        - 真正的多租户管理、控制平面、数据平面和分析，配有逐租户 RBAC 和隔离路由结构
        - 在 SASE 厂商中，Versa 架构对服务提供商格外友好
        - 同样的灵活性也会提高非 MSP 团队的搭建和培训要求
      - - 替换或增强集中式防火墙资产
        - 本地 NGFW 维护需要签名库、专业能力和分支回传
        - VSIA + 集成进更广 SASE 栈的 NGFWaaS
        - 在一个平台模型下，把防火墙与 CASB、SWG、DLP 和路由合在一起
        - 与同类最佳云防火墙产品相比，独立对比数据有限
      - - 不用 VDI，也能治理 GenAI 和浏览器原生工作
        - 传统 SWG/CASB 或端点控制缺少浏览器会话上下文
        - Secure Enterprise Browser 早期访问计划，加上现有 DLP 和 ZTNA 策略引擎
        - 公司声称可控制剪贴板、上传 / 下载、打印、截屏和承包商访问
        - 能力仍处早期访问阶段，成熟度和参考案例深度都偏薄
    notes: 收益表述总结了保留的官方和第三方描述，而不是经审计的客户 ROI。本表用于展示工作流匹配度和限制，不认证量化生产结果。
