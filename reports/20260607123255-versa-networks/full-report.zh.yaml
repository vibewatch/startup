  - id: TV004
    title: 可比估值表
    columns:
      - 可比标的
      - 状态
      - 市值 / 估值
      - 收入 / ARR
      - 收入倍数
      - 相关性
      - 主要限制
    rows:
      - - Versa Networks
        - 私有 SASE / SD-WAN 挑战者
        - $1.46B 投后估值（Sep 2024）
        - $147.9M 估算；第三方区间 $100-500M
        - 按 RocketReach 估算为 9.9x；按区间为 2.9x-14.6x
        - 标的公司；最佳直接参照点
        - 收入未由公司披露
      - - Zscaler
        - 上市云安全 / SSE 龙头
        - $21.14B 市值
        - $3.00B TTM 收入
        - 7.05x
        - 最接近的规模化上市云安全倍数锚点
        - 公开市值不是企业价值，且 Zscaler 规模更大、软件属性比 Versa 更纯
      - - Fortinet
        - 上市安全与网络平台
        - $105.99B 市值
        - $6.79B TTM 收入
        - 15.61x
        - 显示执行力强的规模化安全平台可获得的溢价
        - 成熟度和盈利能力远高于 Versa
      - - Cisco
        - 上市网络与安全老牌厂商
        - $479.43B 市值
        - $59.05B TTM 收入
        - 8.12x
        - SASE / SD-WAN 潜在买方范围中有用的网络侧锚点
        - 与 Versa 更窄的业务组合相比，Cisco 高度多元且重度依赖收购
      - - Check Point Software
        - 上市成熟防火墙 / 网络安全厂商
        - $14.12B 市值
        - $2.75B TTM 收入
        - 5.13x
        - 成熟安全厂商在低增长、现金流型执行下的估值底部
        - 传统业务占比高，并非干净的单一供应商 SASE 同业
      - - Juniper Networks
        - 上市网络厂商
        - $13.35B 市值
        - $5.20B TTM 收入
        - 2.57x
        - 如果投资者把 Versa 更像 SD-WAN 管道而非高溢价 SASE 软件，可作为网络估值底部
        - 本组中软件属性最弱的可比公司
      - - Cato Networks
        - 未上市单一供应商 SASE 龙头
        - 估值超过 $4.8B
        - ARR 超过 $350M
        - ARR 的 13.71x
        - 当前最佳未上市 SASE 龙头可比，已披露规模和增长
        - 增速、龙头地位清晰度和 ARR 基数都高于 Versa
      - - Netskope
        - 未上市 / 准上市 SASE 规模参照
        - $7.5B 历史估值（2021）
        - 2024 年披露 ARR 超过 $500M
        - 按跨期旧数据比较为 ~15x
        - 有助于框定高溢价 SASE 叙事所需的规模门槛
        - 估值和 ARR 来自不同年份，因此倍数仅具方向性
    notes: 上市公司行使用市值 / 收入，而非企业价值 / 收入，因为保留来源提供的是市值页面和收入页面。未上市公司行使用披露的投后估值或最近一轮估值。本表用于框定区间和离散度，不意味着完全可比的精确口径。
    enumerationScope:
      coverage: partial
      basis: >-
        Comparable set includes the most relevant retained public security, networking, and private SASE references with
        usable valuation and revenue disclosures. It intentionally excludes pure hardware vendors and companies without
        sufficient retained valuation or revenue data.
