      - number: '8.5'
        title: 附录
        blocks:
          - type: callout
            title: 分母才是全部争议
            body: >-
              最大的估值风险不是 Versa 是否是真公司；这一点支撑充分。风险在于公开分母仍是估计值。按 $147.9M 收入，该轮约为 9.9x；按 $200M 收入，则只有 7.3x。仅这一差异，就足以让 Versa
              相对公开可比公司从偏紧变成只是合理。
            calloutType: risk
            claimRefs:
              - CV022
              - CV024
              - CV026
              - CV032
          - type: callout
            title: 优先股保护让名义估值对普通股持有人的参考性下降
            body: >-
              Forge 的轮次数据显示，2024 年 Series F 带有 8% 累计股息，2022 年 Series E 带有 2.0x 清算优先权和 12% 累计股息。这不会否定 $1.46B
              的名义估值，但意味着在中等退出情景里，分配瀑布比平时重要得多。
            calloutType: insight
            claimRefs:
