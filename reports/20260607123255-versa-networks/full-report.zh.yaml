      - number: '2.2'
        title: 买家要求与部署模型
        blocks:
          - type: paragraph
            body: >-
              买家评估 SASE 时，并不是在做抽象分类学练习。他们围绕具体运营问题采购：远程和混合办公、SaaS 流量占比高、单人分支用户、VPN 替换、云可见性，以及用同一套策略底座运营网络和安全的需求。Cisco 和
              Hughes 从不同角度描述了同一模式：从任何设备或位置安全访问，与既有基础设施分阶段共存，并把 SD-WAN 与 SSE、ZTNA、DLP 和可见性工作流融合起来。Cybersecurity Insiders
              的 2026 数据说明这个品类为什么有吸引力却仍未完成。多数受访者认为 Universal ZTNA
              必不可少，但完整实施仍少见；买家想要单一厂商或混合平台，因为工具碎片化和策略蔓延仍是最大障碍。监管指引进一步抬高要求。NIST 和 CISA 把设计中心从可信网络推向围绕用户、设备和应用的最小权限决策；OMB 和
              NSA 推动联邦环境转向加密内部流量、可从互联网访问的应用和持续验证。对 Versa
              而言，这意味着部署灵活性几乎与功能宽度同样重要：一些客户想要共存和分阶段推出，受监管或主权买家则想要私有控制，而不是纯共享云运营模型。
