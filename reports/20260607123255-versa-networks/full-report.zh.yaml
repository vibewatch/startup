chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品范围与市场位置
        blocks:
          - type: paragraph
            body: >-
              Versa Networks 是一家私营 SASE 和 SD-WAN 厂商，2012 年创立，扎根 Santa Clara,
              California。公开来源一贯把公司描述为统一网络与安全平台提供商，而不是单点产品创业公司：Versa 自有材料围绕 VersaONE 平台展开，Reuters 和 PitchBook
              则把公司定义为服务企业和服务提供商的网络安全与网络管理软件厂商。产品族覆盖 SASE、SSE、SD-WAN、SD-LAN 及相关安全控制，部署叙事在私营厂商中格外宽：Versa
              称服务可运行在共享云、专用私有环境、客户基础设施或混合模型中。它最强调的技术差异化是真正多租户；运营商和托管服务提供商场景尤其需要这一点，因为隔离、委托管理和租户计费必须能规模化运行。最有支撑的客户规模信号不是经审计收入，而是部署广度：2022
              年和 2025 年官方发布称，数千客户、数十万站点、数百万用户依赖 Versa；Reuters 另称其拥有超过 10,000 名客户，包括 BP 和 Capital One。合在一起看，Versa
              更像后期、渠道中心型基础设施平台，产品宽度足以卖进大型企业，也能进入运营商主导的托管服务。
