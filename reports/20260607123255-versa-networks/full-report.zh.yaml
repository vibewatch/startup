      - number: '4.3'
        title: 成本结构、毛利率画像与资本强度
        blocks:
          - type: paragraph
            body: >-
              Versa 不披露毛利率，但公开可比公司给出合理区间。Palo Alto Networks 的 2025 10-K 报告 73.4% 毛利率，Fortinet 的 2024 10-K 报告 80.6%
              总毛利率。Fortinet 还直接说明，软件和服务收入一般毛利率高于硬件。这些公开基准重要，因为 Versa 混合软件、云网络、伙伴支持和实体 CSG 设备，使纯软件 85%+ 毛利率假设过于激进。

              如果硬件和服务层仍有实质占比，Versa 毛利率可能被拉到低于最佳云安全 SaaS 水平。Versa
              仍支持从家庭办公室到数据中心级的设备部署，不直接销售这些盒子，并依赖分销和伙伴交付。该组合引入经销折扣、产品支持、物流，以及潜在保修或替换成本，会稀释纯订阅经济性。AWS/G2
              评论流在可用性和安全性上方向正面，但也包含对文档和 bug 修复节奏的抱怨，意味着支持和服务交付负担是真实存在的。

              资本强度看起来中等，而非微不足道。公司不是制造业重型硬件厂商，CSG300 文档显示设备功耗低、分支设备形态标准，这不支持大型工厂或库存资本开支假设。但 Versa 的 90+ PoP
              足迹、全球支持义务、伙伴赋能和托管/私有部署选项，仍需要有意义的云、网络和人员支出。结果是，这门生意在结构上应比电信设备厂商更有吸引力，但不如纯软件 SASE 公司干净。
