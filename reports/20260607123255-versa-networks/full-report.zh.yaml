      - number: '6.3'
        title: 实施、支持与满意度证据
        blocks:
          - type: paragraph
            body: >-
              作为一家私有基础设施供应商，Versa 的公开支持姿态异常明确。支持页面承诺全球 24x7 支持、Premier 层级 指定支持和服务经理、自助培训认证、实施指南；指定服务管理下，响应最快 30
              分钟。这解释了为什么 Versa 的公开客户推进方式更像重服务，而不是自助式。满意度证据是偏正面的混合信号，并非毫无瑕疵。Versa 2024 年 概述 Gartner Peer Insights
              的新闻稿声称，推荐意愿得分为 100%，且 71% 有直接采购、实施和使用经验的客户 给出五星评级。PeerSpot 显示 Versa Unified SASE 有 25 条评论、综合评分
              4.0，但评论文本也暴露了真实摩擦： 评论者称初始设置可能困难且复杂，一条评论明确表示需要专门服务或合作伙伴专业能力。正确解读是，客户情绪足以支撑 真实部署，但并不干净到让实施负担从尽调议题里消失。
