      - number: '1.2'
        title: 创始人、领导层与治理信号
        blocks:
          - type: paragraph
            body: >-
              Versa 的创始人-市场匹配强，而且异常集中在运营商网络领域。创始人 Kumar Mehta 和 Apurva Mehta 都来自 Juniper 及相关网络岗位；Kelly Ahuja 在成为 Versa
              CEO 前，也在 Cisco 的服务提供商和路由业务领导岗位上工作近二十年。这样的背景解释了 Versa 为什么仍以能够处理电信、MSP 和大型企业复杂度自居，而不是只讲分支办公 SaaS
              的简单性。当前披露的高管梯队也偏向规模化准备：Lalit Kumar 带来 Medallia 和 NetSuite 的 IPO 与上市公司财务经验，Martin Mackay
              负责全球商业化，并有专门高管覆盖全球和北美服务提供商销售。治理图谱仍不完整。公开页面提供高管履历，但没有完整董事会、观察员或后期投资人控制权地图。这很关键，因为一家公司自 2022 年起讨论 IPO 准备，却到
              2026 年仍未上市，可能面临有意义的董事会层面时点和披露决策。实际判断是，Versa
              看起来运营成熟、商业经验足，但外部投资人仍需要一手材料——董事会构成、保护性条款、老股交易历史和股权结构表细节——才能评估创始人、管理层与财务投资人之间的治理平衡。
