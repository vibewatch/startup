      - number: '5.2'
        title: 架构、部署模型与硬件/软件拆分
        blocks:
          - type: paragraph
            body: >-
              Versa 记录在案的架构比大多数 SASE 厂商营销页更明确。基本 SD-WAN 模式是头端加分支。头端节点组合 Director、Analytics、Controller，通常还有 Concerto
              编排器；分支节点在 Versa CSG 设备、vCSG 或白盒 x86 硬件上运行 VOS。Controller 不只是管理对象——它在站点之间承载实时路由、拓扑、可达性、性能和 SLA 信息，所以 Versa
              能可信地描述控制平面行为，而不仅是策略管理。路由支持达到企业级，包括 BGP、MP-BGP、VRF、MPLS over GRE/IPsec，以及基于 BFD 的快速故障收敛。部署选项覆盖云、本地、混合和 MSP
              托管模型，Versa 明确表示企业部署可做气隙隔离，使管理数据永不离开客户网络。Private SASE 和 Titan 指南显示硬件路径仍重要：具体 CSG 和 vCSG 设备、明确
              hub/spoke/full-mesh 角色、HA 双机设计和静态 WAN 接口规划，都是实际部署的一部分。
