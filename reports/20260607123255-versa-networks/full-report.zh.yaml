  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 评估
      - 证据基础
      - 何种情况改变判断
    rows:
      - - 建议
        - 观察 / 继续研究
        - 品类相关性和客户规模真实存在，但对估计收入依赖过重，IPO 证据也不完整。
        - 只有在经审计收入至少 ~$180-200M、留存强劲且老股交易支撑更干净时，才上调。
      - - 置信度
        - 中低
        - 多个独立来源证实融资历史和市场位置，但没有来源披露经审计 ARR、NRR 或自由现金流。
        - 经审计财务披露和更清晰的公开市场时间表会提升置信度。
      - - 风险评级
        - 高
        - 市场整合、挑战者定位和资本结构悬置都抬高执行风险。
        - 如果 Versa 证明领导者级增长，并消除优先股堆叠不确定性，风险会下降。
      - - 估值立场
        - 合理到偏高
        - 若收入接近 $180-200M，则估值合理；若按最有支撑的 $147.9M 估计，则偏高。
        - 更低入场价或高于当前公开估计的经审计收入，会改善交易设置。
      - - 入场纪律
        - 倾向低于 2024 轮价格，或附带下行保护
        - Nasdaq Private Market 和 Notice 上的老股报价低于 2024 年 9 月 $4.49 的价格。
        - 棘轮条款、优先股保护或更低老股价格，会让风险 / 回报更有吸引力。
      - - 退出准备度
        - 部分具备
        - IPO 意图由来已久，但保留来源仍把 Versa 描述为上市前公司，且活动有限。
        - 公开申报可见度、投行选择和经审计指标，会让准备度从部分具备转为可信。
    notes: 评估基于 2026-06-07 抓取的公开与私有市场参考页面。收入为估计值，并非公司披露，因此估值立场对假设分母高度敏感。
