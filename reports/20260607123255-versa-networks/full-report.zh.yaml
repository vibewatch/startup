      - number: '2.3'
        title: 服务提供商渠道与细分市场吸引力
        blocks:
          - type: paragraph
            body: >-
              托管 SASE 不是边缘商业化动作；它是许多企业的核心采购路径。Microsoft 伙伴生态显示，即便大型买家也常运行混合 SASE，在 SSE 与第三方 SD-WAN
              之间分配不同流量类别，而不是一步到位拆换。TPx 展示了商业包装的实际样子：完全托管、云交付、按用户销售，并在其上叠加治理和合规附加项。Omdia 的 2026
              电信展望表明该模型应该能放大：预计大多数渠道主导的电信服务销售都会包含 IT 服务，运营商也在追求 M&A 和计费融合，以便把网络安全、云和连接打包到一个运营模型下。Netify 的 2026
              企业指南从买家侧得出类似结论，强调分阶段推出、24x7 SOC 和 NOC 覆盖，以及联合托管运营模型。这个渠道结构在战略上利好
              Versa，因为其公开定位就是让同一软件栈跨共享、私有和主权环境运行。因此，公开证据中最有吸引力的细分市场，是大型多站点企业、有数据驻留约束的受监管运营商，以及能够为中端市场客户吸收复杂度的服务提供商主导方案，而不是低接触
              SMB 直销。
