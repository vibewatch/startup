      - number: '4.5'
        title: 财务结论与尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              Versa
              的收入模式看起来基本强健：经常性软件、多租户运营、服务提供商计费和庞大安装基数，应能形成粘性和续约逻辑，优于传统单点网络产品。业务也似乎有足够战略重量，持续赢得分销和伙伴通路。这些都是正面的收入质量指标，尤其是在买家重视网络与安全集成、服务提供商渠道可以加速采用的品类中。

              问题不是结构性弱点，而是披露弱点。公开来源没有披露 ARR、NRR、总流失率、分部毛利率、CAC 回本周期、现金余额、月度烧钱、债务或大客户敞口。这让人无法区分：这是一家健康的 pre-IPO
              公司在为增长投入，还是一门仍依赖新资本来支付支持、PoP、产品开发和伙伴经济性的业务。两种情景都与事实模式相容。

              财务结论因此是：对模型质量谨慎正面，对承做准备度负面。毛利率大概率应接近软件，但如果设备和服务占比仍有意义，就会低于纯云领导者；资本强度看起来可控，但现金充足性无法判断；估值证据真实存在，却相互不一致。承做
              Versa 前，尽调应强制拿到收入分流桥、分部利润率披露、留存和集中度表、当前现金与烧钱、债务/表外义务，以及最新融资轮的文件证明。
