      - number: '8.4'
        title: 乐观、基准、悲观情景、退出准备与最终尽调
        blocks:
          - type: paragraph
            body: >-
              一个实用承销框架是，把 2024 年轮次视为落在合理基准情景的上半区，而不是广阔上行情景的中心。乐观情景下， Versa 维持 25%+ 增长，把挑战者定位转化为领导者地位证据，证明收入更接近 $180-210
              million，并重新获得 10-12x 收入的溢价私有倍数。由此得出约 $1.8-2.5 billion 区间，并要求 IPO 路径出现可见改善。基准情景下， 收入落在约 $160-180
              million，市场给予 7-9x 倍数，对应约 $1.12-1.62 billion。该区间覆盖 2024 年 9 月 价格，但只有上端覆盖。悲观情景下，增长减速到低双位数甚至更低，整体 SASE
              整合让份额增长成本保持高企，公开可比 倍数压缩至 4-6x。按 $150-165 million 收入计算，只得到 $0.6-0.99 billion。

              退出准备仍然喜忧参半。Versa 具备一家准备接受公开市场纪律的公司应有的客户足迹、融资基础和 CFO 招聘历史，但保留 来源仍远未达到正常 IPO 证明点。没有公开经审计收入桥，没有披露
              NRR，没有披露毛利率，没有披露自由现金流， 也没有公开股权结构分配瀑布。因此，pre-IPO 故事持续时间已经超过管理层 2022 年原始表述所暗示的周期。

              本章尽调结论很直接：只有经审计收入、留存和毛利率显著好于当前公开证据能够证明的水平时，2024 年价格才站得住。 否则，更安全的立场是等待更强披露或更好的入场价格。
            claimRefs:
