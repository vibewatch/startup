      - number: '8.2'
        title: 融资背景、资本结构与入场纪律
        blocks:
          - type: paragraph
            body: >-
              披露的私有市场历史显示估值真实上台阶，但不是一路无阻走向上市退出。Forge Global 列出 Versa 2021 年 6 月 Series D 为 $84.05 million、投后 $714.24
              million；2022 年 10 月 Series E 为 $75 million、投后 $867.11 million；2024 年 9 月 Series F 为 $90 million、投后 $1.46
              billion。这意味着 2024 年轮次比 2022 年标记高约 68%。Forge 显示的已披露累计融资为 $632.76 million。公司 2022 年官方表述把 BlackRock 融资定位为
              pre-IPO 轮，用于加速 Versa 的 IPO 路径；Reuters 来源报道称，管理层预计大约 18 个月内公开上市。 但到 2026 年 6 月，保留的二级市场页面仍将 Versa 视为
              pre-IPO：Forge 标注公司已保密提交 S-1，市场活动有限； Nasdaq Private Market 和 Notice 仍把 Versa 呈现为有报价股价的私有公司，而不是已完成上市。

              二级市场信号是方向性谨慎，而不是灾难。Nasdaq Private Market 显示 2026 年 5 月 22 日更新的每股价格为 $4.08，而 Forge 显示 2024 年 9 月轮次股价为
              $4.49，意味着约 9% 的下调。Notice 标题层面的 $3.46 报价 指向约 23% 的更深折扣。单看任一来源都不完美，但两者指向同一个方向：市场并没有明确把业务标到 2024 年融资之上。

              资本结构同样重要。Forge 显示，2024 年 Series F 带有 1.0x 清算优先权和 8% 累计股息，2022 年 Series E 带有 2.0x 清算优先权和 12%
              累计股息，两者均为非参与型。条款不会判公司死刑，但确实意味着，中等退出结果可以保护 优先股投资人，而普通股持有人和员工股权承担的风险高于 $1.46 billion 头部估值暗示。入场纪律因此应从经审计
              收入和完整分配瀑布开始，而不只是看投后名义估值。
