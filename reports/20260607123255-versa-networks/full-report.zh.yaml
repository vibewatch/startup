        title: 切换壁垒存在，但共存路径真实
        blocks:
          - type: paragraph
            body: >-
              切换 SASE 的成本显著，但不是绝对。企业仍要迁移策略、远程用户、分支边缘、互联网 breakout、身份集成和运营流程。即便如此，多份已审阅来源描述了削弱锁定的共存路径。Zscaler 可以叠在既有合作伙伴
              SD-WAN 资产上，Orange 营销从托管 SSE 到托管 SASE 的分阶段路径，VeloCloud 式覆盖让买家在不立即替换整个安全栈的情况下现代化 WAN 控制。这对 Versa
              利弊都有。它的优势是混合部署灵活性、多租户、服务提供商友好，以及与分布式企业共鸣的 WAN
              原生视角。弱点正是反面：相比一些更大对手，公开云边缘规模披露更少，默认短名单背书更少，在具名客户、公开定价或运营结果上的公开证明更薄。因此，采购从网络控制或伙伴交付出发时，Versa
              受益；如果采购从安全云心智、公开规模标尺，或买家想把整个运营模型外包的需求出发，Versa 可能落后。
