      - number: '8.3'
        title: 可比估值框架
        blocks:
          - type: paragraph
            body: >-
              把 Versa 2024 年价格放在中层私有 SASE 倍数中，而不是溢价领导者倍数中，看起来最合理。按 RocketReach 的 $147.9 million 收入估计，Series F 意味着 9.9x
              收入。这个倍数高于 Zscaler 约 7.0x 市值 / 收入倍数，也 高于 Cisco 约 8.1x，明显高于 Check Point 约 5.1x 和 Juniper 约 2.6x，但低于 Cato
              当前私有市场 13.7x ARR 倍数。Fortinet 约 15.6x 市值 / 收入倍数显示，公开市场仍愿意为规模化安全平台付高价，但 Fortinet 比 Versa
              成熟、盈利、全球化得多。因此，公开市场区间很宽但仍有用：Versa 的价格并非显然不可能，但已经假设了比 网络或成熟安全可比公司中位数更好的增长和质量画像。

              私有可比组强化了这一解读。Cato 披露估值超过 $4.8 billion、ARR 超过 $350 million，且 2025 年同比增长 43%。Netskope 另行披露其 2024 年 ARR 超过
              $500 million，而 2021 年融资轮估值为 $7.5 billion。这些公司 的规模明显高于 Versa 最有支撑的公开估计。换句话说，市场愿意为拥有数亿美元经常性收入的品类领导者支付
              13-15x； Versa 的 9.9x 看起来较领导者有折扣，但折扣并不大，因此仍要求确信 Versa 能成长到那一层级。

              竞争语境让这件事更难，而不是更容易。Dell'Oro 3Q24 市场简报称，前六大 SASE 供应商控制 72% 市场，整体增速 降至开始跟踪以来最弱。CRN 和 SDxCentral 都强调 Gartner
              2024 年领导者集合为 Palo Alto Networks、Cato 和 Netskope，Versa 位于挑战者象限。Packet Pushers 对 Versa Sovereign SASE
              选项的评论更进一步，认为客户 承担了大量基础设施和运营负担，导致该产品拉伸了 SASE 的通常含义。这些都是避免为挑战者支付品类领导者倍数的真实理由。
