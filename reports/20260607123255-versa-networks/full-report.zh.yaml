  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: 公开证据显示，Versa 同时拿下直销企业客户和伙伴主导客户，靠的是高接触销售动作：先证明价值，落下首个部署，再扩展到更多站点、用户或托管服务订阅者。
    approximationNotes: 该图综合案例研究、客户证言、伙伴页面和支持材料，而不是抽象自一张正式流程图。
    data:
      items:
        - label: 发现并列入候选
          actor: CIO、网络架构师或托管服务负责人
          touchpoints:
            - 客户案例研究
            - 客户证言和伙伴页面
            - Gartner / PeerSpot 研究
          painpoint: Buyers want to consolidate networking and security without adding operational sprawl.
          opportunity: Versa shows both direct-enterprise wins and carrier / MSP delivery routes.
        - label: 用证据验证
          actor: 采购和技术评估团队
          touchpoints:
            - Dorset Council / Adobe / Dell 成果案例
            - Verizon / Colt / Lumen 伙伴页面
            - PeerSpot 实施评论
          painpoint: Buyers need evidence that Versa can work in branch-heavy and managed-service environments.
          opportunity: Public proof includes quantified savings, ROI, and downstream customer scale.
        - label: 落下首个部署
          actor: 网络工程和安全运营
          touchpoints:
            - SD-WAN 或 SASE 上线
            - 分支可视性和策略控制
            - 远程办公或安全互联网访问场景
          painpoint: Initial setup and service design can be complex.
          opportunity: Several customers cite fast or materially improved rollout economics once deployed.
        - label: 支持并优化
          actor: 客户成功、TAC 或托管服务团队
          touchpoints:
            - Premier Support
            - 实施指南
            - 指定支持工程师
          painpoint: Complex environments may require expert assistance and escalation paths.
          opportunity: Versa explicitly positions 24x7 support and designated experts as part of the motion.
        - label: 扩大覆盖
          actor: 企业发起人或托管服务总经理
          touchpoints:
            - 更多站点和国家
            - 更多分支 / 用户群
            - 下游订阅者增长
          painpoint: Expansion quality is hard to underwrite without NRR and cohort data.
          opportunity: Case studies show rollout from initial land into broader site, user, and customer-base growth.
        - label: 产品化托管服务
          actor: 运营商、MSP 或主权 SASE 运营方
          touchpoints:
            - 多租户
            - 白标托管 SASE
            - 伙伴自有基础设施
          painpoint: Channel leverage increases dependence on a few strategic service-provider relationships.
          opportunity: Sovereign SASE and managed-SASE partner pages show a route to portfolio-level expansion.
    claimRefs:
      - CU006
      - CU024
      - CU037
      - CU040
      - CU042
      - CU043
