        - 融合 SD-WAN、SSE、ZTNA、SWG、CASB、FWaaS、DLP 和策略管理的订阅或许可证支出
        - 不共享同一策略架构的独立 VPN 或单点设备
        - CIO、CISO、NetOps、SecOps、中央 IT 预算负责人
        - Versa 直接竞争的核心品类
      - - 托管和共同托管 SASE 服务
        - 随 SASE 销售、由服务商运营的设计、部署、监测、优化和合规叠加服务
        - 不绑定 SASE 控制的通用 MSP 外包或服务台工作
        - 企业 IT 买方，加上 MSP 或电信服务提供商
        - 面向中端市场和多站点买家的核心销售路径
      - - 私有或主权 SASE
        - 用于数据驻留、主权或关键基础设施的专用网关、私有云、本地部署或物理隔离 SASE
        - 缺少可运营 SASE 栈的通用私有云托管
        - 政府、国防、受监管企业和服务提供商平台所有者
        - Versa 部署灵活性发挥作用的重要高价值子集
      - - 与策略融合绑定的分支和 WAN 现代化
        - 选择路由来执行集中安全策略时的 SD-WAN 更新和分支安全重设计
        - 没有安全融合的纯带宽升级、MPLS 续约或接入路由器更新
        - 围绕分支、WAN 和安全项目支出的 NetOps 与基础设施团队
        - 流入 SASE 品类的重要前置预算
      - - 旧式单点产品替换
        - VPN 替换、设备整合，以及从多控制台边缘安全栈迁移
        - 仍保持独立且未融合的稳定设备资产
        - CISO、基础设施和数字化办公团队
        - SASE 项目的常见预算释放机制
      - - 排除的邻近项：原始连接和固定功能硬件
        - 无，除非明确打包进托管或融合 SASE 服务
        - 不受统一策略治理的运营商传输、纯路由器收入和硬件更新
        - 网络采购和连接买方
        - 即便影响部署决策，也在实际市场边界之外
    notes: 纳入支出覆盖融合网络与安全项目、托管服务叠加层，以及主权 / 私有交付模型；纯传输和固定功能硬件被视为邻近项，而非直接 TAM。
