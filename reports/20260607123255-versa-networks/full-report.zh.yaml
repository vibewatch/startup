  - id: TV005
    title: 投资论点失效与否决触发因素表
    columns:
      - 触发因素
      - 阈值 / 信号
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 二级市场价格恶化
        - 私募报价持续低于每股 $3.00
        - 表明市场不再支撑 2024 轮融资经济条款
        - 按熊市情景区间重新承销，避免为普通股或次级优先股付溢价
      - - 增长放缓
        - 有证据显示收入增长已降至约 10-15% 以下
        - 挑战者厂商的高倍数理由不再成立
        - 估值框架转向 Juniper / Check Point 式下行区间
      - - IPO 延宕
        - 未来 12 个月没有更清晰的申报、投行或审计就绪信号
        - 持有期拉长，未上市公司的不透明性仍在
        - 按流动性溢价更低的未上市持有标的处理
      - - 市场集中度恶化
        - 前六大 SASE 厂商份额继续上升，而 Versa 仍是挑战者
        - 意味着份额被最大平台吃掉，而不是流向挑战者
        - 下调预期退出倍数和龙头式结果概率
      - - 优先权负担加重
        - 新资金附带更优厚的优先权或累积股息
        - 扩大名义估值与普通股持有人价值的分叉
        - 要求更强保护，否则放弃
    notes: 否决标准聚焦可测量的传导渠道：市场结构或融资条款如何进入估值，而不是笼统的经营失望。
