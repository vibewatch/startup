      - number: '4.4'
        title: 资本基础、估值与 IPO 准备
        blocks:
          - type: paragraph
            body: >-
              Versa 的融资历史从公开来源看异常难以核对。Tracxn 称公司跨六轮融资 $316M，仍把业务标为 Series D。Nasdaq Private Market 列出截至 2022 年 10 月的
              Series A-E 轮，合计 $277M；CB Insights 也停在 2022 年 10 月 27 日 Series E。然而 Forge 显示 Sep-2024 Series F 估值
              $1.46B、总融资 $632.76MM。这些留存来源在最新轮名称、总融资和时间上不一致，因此本次报告中的 2024 年 Series F 是单一来源的私募市场数据点，而不是被干净交叉验证的融资事实。

              Reuters 来源报道增加了歧义，而不是减少歧义。PE Insights 称 Versa 融资 $120M、由 BlackRock 领投，引用 CEO Kelly Ahuja 对 18
              个月内上市的预期，并指出公司尚未聘请投行。Forge 使用 “IPO Mentioned” 和 “Confidential Filing” 等 IPO 导向措辞，Nasdaq Private Market 发布
              2026 年 5 月估计每股 $4.08 价值。但本次运行没有留存公开 S-1、投行委任名单或 SEC 申报链，无法把 IPO 兴趣转化为可验证准备度。

              收入披露同样凌乱。RocketReach 发布 $147.9M 收入估计，IncFact 只给出 $100M-$500M 的宽统计区间，常用于更高收入估计的候选商业情报页面在本次运行中不可检索，因为一个返回
              502，另一个受机器人防护阻挡。财务承做结论因此不是 Versa 缺乏规模，而是公开规模、融资和估值数据过于不一致，离开管理层材料无法承做。
