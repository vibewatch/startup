      - number: '5.3'
        title: 统一 SASE 服务、客户端流程与运营栈
        blocks:
          - type: paragraph
            body: >-
              在服务平面上，Versa 最强论点是访问、互联网安全、防火墙和分析共享一套策略与编排模型。产品文档中的 SASE 客户端流程很明确：设备向安全访问门户注册，然后经安全访问网关获得 SWG 和 ZTNA
              服务。应用和域名引流可用 split tunnel 实现，也可用 exclude-from-tunnel 策略实现，让只有选定流量到达 Versa Cloud Gateway，其他流量在本地出站。NGFWaaS
              在 Versa Secure Internet Access 内交付，定位是避免把所有分支流量回传到集中式防火墙带来的时延和运营拖累。分析和自动化随后位于流量平面之上：Director 模板、API
              和拓扑工作流旨在降低运营开销，Analytics 提供基线、异常检测、多服务报告和自动扩容指引。结果是一套宽广的融合栈，但它也宽到客户仍需要有经验的运营者才能用好。
