      - number: '1.3'
        title: 融资历史、SEC 轨迹与资本市场准备
        blocks:
          - type: paragraph
            body: >-
              Versa 的融资记录部分可见，但披露并不干净。最可靠公开锚点是 SEC 搜索结果中的 2012 年和 2022 年 Form D 通知、2022 年 10 月 BlackRock 领投融资的官方和
              Business Wire 通稿、Reuters 对该轮融资的报道，以及 PitchBook 对 2024 年 9 月 27 日完成 Series F 的时间线记录。这些来源支撑从 2012 年 Series
              A、2014 年 Series B，到 2022 年 pre-IPO 融资和此后 2024 年一轮融资的可信序列，但没有给出完全核对后的资本化历史。Reuters 和 Tracxn 支撑截至 2022 年交易约
              $316 million 融资，而 PitchBook 增加 2024 年 9 月 $90 million Series F，意味着累计额更高；Forge 进一步营销 $1.46 billion Series F
              估值，同时展示大得多的总融资数字。公开数据因此内部不一致。IPO 信号同样混杂：2022 年官方措辞把 BlackRock 轮称为 pre-IPO，Reuters 称管理层预计 18 个月内上市，Forge 标记
              S-1 / 保密申报状态；但本次抓取的公开 SEC 搜索只出现 Form D 通知，没有可见注册声明。结论是 Versa 看起来按最终流动性在管理，但公开证据仍太薄，不能把 2024
              年估值和申报状态视为充分验证。
