      - number: '4.2'
        title: 增长指标与商业化效率代理指标
        blocks:
          - type: paragraph
            body: >-
              Versa 的公开规模指标强，但是间接的。公司 2025 年 Gartner 公告称 Versa 服务数万客户和数十万站点；Reuters 来源的 PE Insights 报告称公司服务超过 10,000
              名客户，包括 BP 和 Capital One。同一份基于 Reuters 的 报告称超过一半收入来自美国，这意味着即使客户基础全球化，公司也对一个地理市场的企业和服务提供商预算有实质暴露。

              伙伴渠道可能改善销售效率，但也遮住实际单位经济。Verizon 伙伴页面把 Versa 定位为经单一软件栈交付的托管 SD-WAN 和安全平台，MSP 计划强调委托管理、计费和经常性收入，而不只是盒子转售。结合
              90+ PoP 网络 和托管/私有部署菜单，这符合面向大型和中端市场客户的轻资本分销模型。可能的取舍是与服务提供商共享经济性，这会降低净定价和渠道利润泄漏的可见度。

              员工数是最好的公开成本代理。RocketReach 列出 879 名员工，Revelio 显示 2024 年 950 名员工、2025 年约 1,067
              名。即便没有披露薪资或盈利数据，这一员工区间也指向规模不小的 R&D、销售、客户支持和云运营成本基础。它还说明，在 2022 年融资窗口之后增长并未停止，哪怕公开收入披露一直没有跟上。
