  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与规模测算口径
        blocks:
          - type: paragraph
            body: >-
              Versa 的实际市场既不是全部企业网络，也不是全部网络安全。真正关键的支出，是网络、身份感知访问和云交付安全汇聚为可运营 SASE 项目的那一层。Dell’Oro 和 MarketsandMarkets
              都显示强增长，但衡量对象不同：Dell’Oro 把 SASE 视为受治理和审计需求影响的 SSE 加 SD-WAN 累计支出，MarketsandMarkets 则给出 2026 年时点市场估计和 2032
              年终值。这一区别很重要，因为品类里既有可直接销售的软件/服务，也有更广的架构迁移预算。正确边界因此应包括统一 SASE 平台支出、托管或联合托管 SASE 服务、面向受监管买家的私有或主权部署，以及当
              SD-WAN 用来执行集中安全策略时的分支现代化。应排除纯接入路由器更新、原始连接传输，或从不转化为统一策略执行的通用硬件项目。公开市场数字更适合作为情景边界，而不是精确 Versa
              TAM，但方向一致：安全策略正向上游移动，大企业主导当前可见支出，市场也足够大，可以容纳安全优先的领导者和 Versa 这类差异化平台厂商。
