  - id: TV006
    title: 最终尽调清单表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 经审计收入 / ARR
        - FY2024-FY2026 经审计收入衔接表和经常性收入构成
        - 当前价格对真实分母高度敏感
        - 财务团队；审计报表和董事会材料
      - - 留存质量
        - 按客户细分的毛留存、NRR、队列扩张和流失
        - 高溢价软件倍数需要证明增长不只是靠新增客户
        - 财务与 RevOps；队列分析和董事会仪表盘
      - - 利润率画像
        - 毛利率、销售效率、烧钱速度和自由现金流轨迹
        - 用来区分高溢价软件叙事和低倍数网络厂商
        - 财务；管理账和预算包
      - - 完整股权结构 / 清算瀑布
        - 逐类证券的优先权、股息、转换条款和员工池稀释
        - 名义投后估值可能高估普通股持有人可实现价值
        - 法务与财务；最新股权结构表和瀑布模型
      - - IPO 就绪度
        - 投行接触状态、审计就绪度和公开申报时间线
        - 决定持有期、流动性路径，以及能否承受高溢价入场价
        - CEO / CFO；IPO 就绪工作计划
      - - 竞争赢单 / 输单数据
        - 最近与 Palo Alto、Cato、Netskope 和 Cisco 正面竞争的结果
        - 判断挑战者地位是在改善还是恶化所需
        - 销售负责人；按季度赢单 / 输单分析
    notes: 这些尽调问题刻意收窄。每一项都直接对应倍数分母、类 IPO 退出概率，或优先股与普通股价值实现的差距。
