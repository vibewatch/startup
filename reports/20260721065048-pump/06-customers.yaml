- id: adoption-trajectory
  title: Adoption Trajectory and What Public Growth Signals Actually Mean
  body: 'Pump’s public growth signals are compelling but not cleanly comparable. The YC company page says the company signed up 250+ customers in the prior six months, including 50+ YC companies. The YC offer page says 40+ YC companies use Pump today. The wall-of-love page says Pump is trusted by 1,000+ startups across 22 countries. These claims collectively support the conclusion that customer acquisition is real and broad-based, but they do not define one denominator for active paying accounts, onboarded accounts, or all-time signups.

    More useful than the raw counts are the deployment narratives. The individual case studies show customers moving from discovery to savings estimates, then to autopilot commitment execution, and in some cases to broader use of View or Secure. Tellonym, Beehiiv, and Salesforge emphasize fast time-to-value with limited engineering overhead. HEO and UserGems emphasize Pump View as an ongoing reporting surface. ICANotes, Terra, and Finsera extend into security and compliance. The public trajectory therefore looks like a land motion through savings, followed by optional expansion into visibility and security rather than a single one-time transaction.'
