- id: TU005
  title: Expansion and Concentration Risk Table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Cross-sell from Save to View
    - Unknown reliance on a small set of high-spend AWS customers
    - Could deepen ACV but also raise spend concentration
    - Request revenue by spend band and module adoption
  - - Cross-sell from Save to Secure
    - Trust or permissions concerns may limit module attach rate
    - Could widen product moat if adopted
    - Request attach-rate cohorts and sales-stage data
  - - Workflow stickiness via Slack / dashboards
    - Billing-layer lock-in concerns may create reputational risk
    - Can help retention or hurt referrals depending on experience
    - Interview reference customers that have offboarded or downsized
  - - Industry diversification across SaaS, fintech, health, AI, and space
    - No top-customer concentration disclosure
    - Diversification looks good qualitatively but may hide revenue skew
    - Request top-10 customer revenue and managed-spend share
  - - Regulated-workload references
    - Support intensity may be higher in security-sensitive cohorts
    - Could pressure margins but improve defensibility
    - Request support-cost profile by customer segment
  notes: Expansion logic is visible, but concentration and cohort durability are not publicly disclosed.
