  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: customer-count
    missingEvidence: A like-for-like active customer count that reconciles the 250+, 40+ YC, and 1,000+ startup claims.
    whyItMatters: Different public claims likely describe different populations and create false precision if merged.
    diligencePath: Request current active paid accounts, total onboarded accounts, and customers by segment.
    relatedQuestionRefs:
    - QU004
    - QU005
    - QU023
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: NRR, GRR, logo churn, contract length, and module attach rates.
    whyItMatters: Customer quality cannot be converted into durable revenue quality without cohort metrics.
    diligencePath: Request cohort dashboards by product and customer segment.
    relatedQuestionRefs:
    - QU015
    - QU016
    - QU024
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: Top-customer revenue share and managed-spend concentration by provider and segment.
    whyItMatters: A broad logo set may still hide heavy dependence on a few high-spend customers.
    diligencePath: Request top-10 revenue and spend concentration tables.
    relatedQuestionRefs:
    - QU020
    - QU025
    relatedTableRefs:
    - TU005
  - type: enumeration-incomplete
    severity: minor
    topic: Named Customer Proof Table
    missingEvidence: A comprehensive list of named customer references and whether each is production, pilot, or purely services-led.
    whyItMatters: Public proof is strong but clearly not exhaustive of the installed base.
    diligencePath: Request reference-customer roster with deployment status.
    relatedQuestionRefs:
    - QU007
    - QU019
    relatedTableRefs:
    - TU003
