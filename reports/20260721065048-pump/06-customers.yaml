- id: named-proof
  title: Named Customer Proof and Outcome Quality
  body: 'Outcome quality is strongest where case studies provide specific budget or savings numbers. Beehiiv says Pump produced more than $15K of savings in the first full month after activation. Tellonym’s story anchors on a roughly $42K monthly AWS bill and the elimination of manual plan-renewal work. Whalesync says it saved over $13K in months and cut compute costs by 62%. Terra says it saved nearly $30K in months and realized strong savings on EC2 and RDS commitments. ICANotes says it removed more than $60K of annual cost from a prior FinOps vendor alone. HEO, Greybeam, and UserGems supply more qualitative proof around visibility and decision quality, while ForUsAll, GeoServes, Paynt, Daemo, and Olio demonstrate more bespoke or services-heavy engagements.

    The evidence quality is therefore asymmetric. Savings proof is concrete in several cases; production-versus- pilot status is usually inferable but not always explicitly labeled; retention visibility is weak; and some stories are clearly more like consultative engagements than pure self-serve SaaS deployments. The right read is that Pump has credible customer proof, but not yet the normalized cohort data that would let an investor compare customer value across segments with high statistical confidence.'
