  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: revenue
    missingEvidence: A reconciled monthly revenue bridge explaining why public 2025 estimates diverge between $15.2M and $25M annualized.
    whyItMatters: Entry multiple, growth interpretation, and revenue quality all depend on whether the figure is recognized revenue or run rate.
    diligencePath: Request audited or management financials with monthly recognized revenue and ARR/run-rate definitions.
    relatedQuestionRefs:
    - QI004
    - QI005
    - QI006
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin, CAC, payback, NRR/GRR, support-cost profile, and product-level revenue mix.
    whyItMatters: The public model looks attractive, but its durability cannot be assessed without unit economics.
    diligencePath: Request board deck metrics, cohort analyses, and product-level contribution margins.
    relatedQuestionRefs:
    - QI014
    - QI015
    - QI016
    - QI024
  - type: private-evidence-only
    severity: material
    topic: capitalization
    missingEvidence: Cash on hand, burn, runway, and exact financing history with signed round documents.
    whyItMatters: The company may be growing quickly while still carrying meaningful capital or settlement risk.
    diligencePath: Request cap table, financing docs, cash forecast, and provider settlement terms.
    relatedQuestionRefs:
    - QI018
    - QI019
    - QI020
    - QI021
    - QI025
  - type: missing-source
    severity: minor
    topic: provider-mix
    missingEvidence: Current revenue and spend-under-management split by AWS, GCP, Azure, and non-core modules.
    whyItMatters: Provider concentration is visible directionally but not quantified.
    diligencePath: Request management dashboard cut by provider and product.
    relatedQuestionRefs:
    - QI003
    - QI023
