- id: cost-structure
  title: Cost Structure, Gross-Margin Drivers, and Service-Delivery Implications
  body: 'Pump’s public materials suggest a cost structure that mixes software delivery with meaningful service labor. The

    product itself looks software-like: read-only or light-touch integrations, unified dashboards, and automated

    commitment logic should support efficient deployment once core systems are built. But several customer case

    studies describe dedicated solutions architects, migration help, hands-on recommendations, or strategic support

    around infrastructure changes, which indicates the service layer is economically important in at least part of the

    installed base. That can improve retention and realized outcomes, but it also means gross margin is unlikely to

    be explained by software hosting costs alone.


    The main gross-margin drivers are therefore likely to be: provider economics on the pooled-billing model,

    utilization accuracy of commitments, support intensity per account, and the extent to which View or Secure reduce

    support burden by giving customers better self-service visibility. Public sources do not disclose gross margin,

    CAC, payback period, or NRR. The closest visible proxies are the company’s free-entry motion, the lack of visible

    infrastructure-change requirements for onboarding, and customer anecdotes that suggest a small team can start

    realizing value quickly. That may indicate efficient initial deployment, but not necessarily low fully loaded

    service cost.'
  claimRefs:
  - CI021
  - CI022
  - CI023
  - CI024
  - CI025
  - CI026
  - CI027
  - CI028
