  title: Financial Diligence Blockers
  columns:
  - Question
  - Why it matters
  - Public status
  - Next diligence step
  rows:
  - - What is recognized revenue versus run rate?
    - Conflicting 2025 numbers change entry-multiple math materially
    - Unresolved
    - Request monthly revenue bridge and auditor notes
  - - What exact take rate / fee mechanics drive revenue?
    - Needed to assess margin durability and competitive moat
    - Unresolved
    - Request customer pricing terms and provider economics
  - - How concentrated is revenue in AWS?
    - Provider dependence affects risk and valuation
    - Partially implied, not quantified
    - Request revenue and spend mix by provider
  - - What are gross margin, burn, and runway?
    - Core underwriting metrics are absent from public sources
    - Unresolved
    - Request management accounts and cash forecast
