- id: public-traction
  title: 'Public Traction Signals: Revenue, Spend Managed, and Customer-Evidence Proxies'
  body: 'Public revenue estimates are the clearest traction signal and also the clearest source of conflict. GetLatka says

    Pump reached $15.2 million of revenue in 2025 and had previously hit $1.4 million in June 2024. Sacra, by

    contrast, estimates the company reached $25 million of annualized revenue in 2025, up from roughly $7 million at

    the end of 2024 and $500K in March 2024. Both sources imply rapid growth, but they almost certainly measure

    different things — perhaps point-in-time run rate versus recognized revenue, or disclosed versus inferred

    numbers. The right interpretation is not that one source must be fabricated; it is that the business is scaling

    quickly enough that snapshot methodology materially affects the apparent trajectory.


    Customer-evidence proxies support the existence of real commercial demand. The homepage cites more than $1.05

    billion of spend managed and 30% average customer savings. Case studies show meaningful dollar outcomes: Beehiiv

    saved more than $15K in a full month, Tellonym runs a roughly $42K monthly AWS bill with autopilot support,

    Whalesync saved over $13K and cut compute costs 62%, Terra saved nearly $30K in months, and ICANotes says it

    eliminated roughly $60K+ of annual costs from a prior FinOps vendor alone. These are not audited cohort metrics,

    but they do show the product touching economically material budgets rather than hobby workloads.'
