  title: Market Boundary and Substitute Map
  columns:
  - Segment
  - Included in Pump wedge?
  - Primary pain point
  - Typical substitute
  - Why Pump-relevant
  rows:
  - - AWS / GCP / Azure commitment optimization
    - 'Yes'
    - Lock-in risk and poor coverage modeling
    - Manual plan buying or native recommendations
    - Pump’s core wedge is automated commitment management
  - - Cloud spend visibility and forecasting
    - 'Yes'
    - No single source of truth for cost drivers
    - Cost Explorer exports, spreadsheets, ad hoc dashboards
    - Pump View expands value beyond pure rate optimization
  - - Cloud security / compliance posture
    - Adjacent yes
    - Separate tools add context-switching and cost
    - AWS Security Hub / other point tools
    - Pump Secure raises ACV and retention potential
  - - Full workload redesign / rightsizing consulting
    - Partly
    - Waste exists outside commitment instruments
    - Internal platform teams or consultancies
    - Important adjacent market but not Pump’s primary first message
  - - Enterprise ITAM / ERP-linked technology ledger
    - Not first wedge
    - Finance needs cross-domain governance
    - Broad suites such as Flexera / finance tools
    - Relevant for long-term upmarket expansion more than near-term wedge
  notes: Boundary table distinguishes Pump’s direct initial wedge from broader adjacent markets; categories intentionally separate billing-layer optimization from workload redesign and enterprise governance suites.
