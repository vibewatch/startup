- id: legal-entity-and-leadership
  title: Legal Entity, Headquarters, and Leadership Visibility
  body: 'Pump''s public marketing and legal pages establish that the contracting entity is Pump Billing, Inc.,

    also referred to as Counter Inc. The customer agreement lists an office at 1455 Market Street in San

    Francisco and identifies Pump as an authorized AWS, GCP, and Azure partner with stated partner IDs.

    A California-registry-derived profile adds more formal entity detail: Pump Billing, Inc. was filed on

    3 May 2023, is active, is formed in Delaware, and lists Michael Buckwald as CFO and registered agent

    with Spandana Nakka as director, CEO, and secretary.


    Leadership visibility is therefore better at the founder / finance level than at the full executive or

    board level. Y Combinator, GetLatka, and Tracxn all identify Spandana Nakka as founder and CEO, but

    none of the reviewed public materials provide a board roster, governance rights, committee structure,

    or a broader executive team with the same clarity. That does not imply a governance defect by itself,

    but it does leave normal diligence questions open around investor control rights, delegated authority,

    and whether the visible management bench is deeper than the founder-plus-finance layer currently shown

    in public evidence.'
