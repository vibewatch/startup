  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: optimization-accuracy
    missingEvidence: Measured accuracy or realized-savings advantage versus native AWS recommendations and direct peers.
    whyItMatters: Pump’s technical moat depends on proving orchestration quality, not merely exposing the same discount primitives.
    diligencePath: Request backtests, realized-savings cohorts, and competitor benchmarks.
    relatedQuestionRefs:
    - QE023
  - type: private-evidence-only
    severity: material
    topic: module-adoption
    missingEvidence: Actual attach rates for Save, View, and Secure across the customer base.
    whyItMatters: The platform thesis is stronger if customers adopt multiple modules instead of only the savings engine.
    diligencePath: Request product attach-rate and retention cohorts.
    relatedQuestionRefs:
    - QE024
  - type: missing-source
    severity: minor
    topic: permission-model
    missingEvidence: Detailed public technical documentation on exact permission boundaries, rollback controls, and offboarding mechanics.
    whyItMatters: Billing-layer trust depends on concrete controls, not just marketing assurances.
    diligencePath: Request architecture, IAM policy templates, and offboarding runbooks.
    relatedQuestionRefs:
    - QE025
