- id: execution-legal-and-kill-criteria
  title: Execution, Legal, and Diligence Kill Criteria
  body: 'Pump’s public disclosure leaves important execution questions unresolved. The company is still young, public headcount and revenue estimates conflict across third-party databases, and the financing record is not strong enough on its own to prove large-company operating maturity. The Delaware filing gives basic entity-level assurance, and YC affiliation supports some minimum quality threshold, but neither substitutes for evidence on organizational depth, audit readiness, support staffing, or top-customer concentration. Young companies can manage these gaps well; the risk is simply that the public record does not yet prove they have.

    For diligence purposes, the practical question is not whether Pump has any risk—it clearly does—but whether those risks are monitorable. A buyer or investor should define hard kill criteria around provider-policy changes, inability to offboard cleanly, concentrated revenue dependence, and poor recommendation precision. Pump becomes much easier to underwrite if management can produce cohort retention, top-customer exposure, incident history, and contractual detail showing that the customer remains in control even when Pump is deeply embedded in billing and optimization workflows.'
