chapter:
  number: 7
  title: Risks
  summary: 'Pump’s core risk is structural dependence on hyperscaler billing, discount, and permissions regimes that it does not control. The company also carries go-to-market and trust risk: public customer proof is strong, but retention, concentration, and offboarding quality remain poorly disclosed, and multiple larger vendors compete for the same cloud-cost-optimization budget with more mature operating footprints.'
sections:
- id: platform-dependency
  title: Provider and Billing-Layer Dependency Is the Dominant Structural Risk
  body: 'Pump’s product promise depends on a narrow stack of external systems: cloud-provider discount programs, billing-account constructs, linked-account permissions, identity access, and the customer’s willingness to let Pump operate close to spend governance. AWS documentation makes clear that savings-plan economics, billing, organizations policy, and IAM controls are all provider-defined primitives, not assets Pump owns. Pump can package those primitives more elegantly than customers can, but it cannot force the continued existence of the underlying discount surfaces or protect itself if a provider changes rules, narrows eligibility, or offers the same economics directly.

    This makes Pump different from a pure analytics overlay. A dashboard company can survive partial API changes; a pooled-billing or commitment-automation company is far more exposed to platform-policy drift. The more Pump uses billing delegation, automated commitments, and centralized visibility to create customer value, the more it inherits platform and counterparty risk. That risk is tolerable while provider rules remain stable and customers believe the savings exceed the operational dependency, but it becomes serious if any one of those conditions weakens.'
