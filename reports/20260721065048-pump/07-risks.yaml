  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: Top-customer revenue share, managed-spend concentration, and renewal dependence.
    whyItMatters: A broad logo set can still hide material dependence on a small number of high-spend accounts.
    diligencePath: Request top-10 customer concentration by revenue and spend.
    relatedQuestionRefs:
    - QR018
    - QR023
    relatedTableRefs:
    - TR005
  - type: private-evidence-only
    severity: material
    topic: offboarding
    missingEvidence: Standard exit workflow, admin-control transfer steps, and median offboarding time.
    whyItMatters: Billing-layer products create unusual trust risk if customers cannot unwind quickly.
    diligencePath: Run a reference-check and sandbox offboarding test.
    relatedQuestionRefs:
