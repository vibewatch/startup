            - 低
            - 中高
    approximationNotes: 这些是作者基于公开证据缺口和品类结构作出的定性判断，不是概率估计。
    claimRefs:
      - CR003
      - CR014
      - CR019
      - CR021
      - CR031
      - CR035
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 云厂商政策或账单控制冲击可能直接传导到客户信任、留存和估值。
    data:
      nodes:
        - id: root
          label: 云厂商规则或控制冲击
          description: AWS 计划变化、访问变化或控制模式摩擦
        - id: savings
          label: 节省主张减弱
          description: 客户口径或实际兑现的节省效果说服力下降
        - id: trust
          label: 客户信任走弱
          description: 客户担心权限、退出流程或建议质量
        - id: retention
          label: 留存和扩张受损
          description: 续约、转介绍和模块附加率走弱
        - id: margin
          label: 利润率被压缩
          description: Pump 可能要降价或加大支持力度，才能留住客户
        - id: value
          label: 企业价值受损
          description: 增长和持续性假设被下调
      edges:
        - from: root
          to: savings
          label: 经济约束变化
        - from: root
          to: trust
          label: 控制权担忧上升
        - from: savings
          to: retention
          label: 续约价值下降
        - from: trust
          to: retention
          label: 流失风险上升
        - from: retention
          to: margin
          label: CAC / 支持负担上升
        - from: margin
          to: value
          label: 增长质量下降
    approximationNotes: 该图仅作示意，用来呈现因果方向，不代表精确的时间点或影响幅度。
    claimRefs:
      - CR004
      - CR006
      - CR015
      - CR016
      - CR025
      - CR026
      - CR035
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: Pump 的风险画像主要由外部平台、客户信任和相邻品类竞争决定。
    data:
      nodes:
        - id: aws
          label: AWS 计费与折扣底层机制
          description: 承载核心执行与经济性
        - id: iam
          label: IAM / Organizations 权限
          description: 访问与策略控制
        - id: customers
          label: 客户财务与工程团队信任
          description: 采用与留存的前提
        - id: rivals
          label: 竞争性优化厂商
          description: 达到类似结果的替代路径
        - id: pump
          label: Pump 运营模式
          description: 池化、自动化、可见性与支持
        - id: value
          label: 收入和估值持续性
          description: 最终支撑投资假设
      edges:
        - from: aws
          to: pump
          label: 划定经济边界
        - from: iam
          to: pump
          label: 界定控制面
        - from: customers
          to: pump
          label: 信任撬动部署
        - from: rivals
          to: pump
          label: 挤压差异化和定价
        - from: pump
          to: value
          label: 执行质量决定持续性
    approximationNotes: 依赖关系图把一个多边系统简化成少数节点；这些节点最直接决定下行风险。
    claimRefs:
      - CR001
      - CR002
      - CR005
      - CR019
      - CR020
      - CR022
      - CR024
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 公开证据支持继续尽调这家公司，但不足以接受其名义估值。
    data:
      nodes:
        - id: market
          label: 重要市场
          detail: 云成本管理是长期痛点
          tone: positive
        - id: proof
          label: 真实客户验证
          detail: 已有具名客户背书和案例结果
          tone: positive
        - id: conflict
          label: 财务证据打架
          detail: 收入、融资和员工数据无法顺畅交叉印证
          tone: warning
        - id: risk
          label: 结构性风险
          detail: 对云厂商的依赖和信任风险仍不小
          tone: warning
        - id: result
          label: 只适合有条件尽调
          detail: 公司值得看，但估值仍需私下证据支撑
          tone: neutral
      edges:
        - from: market
          to: result
        - from: proof
          to: result
        - from: conflict
          to: result
        - from: risk
          to: result
    approximationNotes: 该逻辑图用定性方式呈现决策链，而不是给每个因素赋予数值权重。
    claimRefs:
      - CV007
      - CV009
      - CV017
      - CV026
      - CV027
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 情景中值显示，证据质量和经济性假设一变，隐含价值会很快变化。
    data:
      items:
        - label: 悲观（增长质量不及预期）
          value: 400
        - label: 基准（公开证据折价）
          value: 900
        - label: 参考估值区间
          value: 1500
        - label: 乐观（隐含经济性强）
          value: 2000
    approximationNotes: 数值为示意性的百万美元口径，用于搭建情景框架；不是协商价格估计，也不是 DCF 结果。
    claimRefs:
      - CV001
      - CV019
      - CV020
      - CV021
      - CV022
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 区间很宽，反映出公司确有战略上行空间，但当前证据质量仍高度不确定。
    data:
      items:
        - label: 示意性当前估值区间（USD bn）
          low: 0.4
          mid: 0.9
          high: 1.5
        - label: 3 年退出——基准情景（USD bn）
          low: 0.6
          mid: 1.2
          high: 2
        - label: 3 年退出——乐观情景（USD bn）
          low: 1.5
          mid: 2.2
          high: 3.5
    approximationNotes: 这些区间取决于未披露的融资条款、稀释、收入持续性和利润率数据；它们只是框架性区间，不是公平性意见。
    claimRefs:
      - CV001
      - CV020
      - CV024
      - CV029
      - CV035
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: IC 风格评分卡，在品类强度和估值不确定性之间做权衡。
    data:
      items:
        - label: 市场机会
          value: 8 / 10
          detail: 云支出痛点和 FinOps 需求都很真实。
          tone: positive
        - label: 客户验证
          value: 7 / 10
          detail: 这家年轻创业公司的具名案例强于平均水平。
          tone: positive
        - label: 护城河 / 差异化
          value: 6 / 10
          detail: 池化模式有辨识度，但绑在信任和云厂商规则上。
          tone: neutral
        - label: 经济性透明度
          value: 3 / 10
          detail: 公开证据还没证明收入质量和抽成经济性。
          tone: warning
        - label: 风险画像（分数越高 = 越安全）
          value: 4 / 10
          detail: 平台结构性风险和信任风险仍不小。
          tone: warning
        - label: 估值吸引力
          value: 3 / 10
          detail: 公开证据不足以支撑接受名义估值。
          tone: warning
    approximationNotes: 这些分数是委员会定性讨论的辅助工具，不是正式评分模型的输出。
    claimRefs:
      - CV010
      - CV018
      - CV023
      - CV026
      - CV031
      - CV041
