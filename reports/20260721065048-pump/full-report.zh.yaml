  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 云厂商和计费层依赖是最主要的结构性风险
        blocks:
          - type: paragraph
            body: >-
              Pump 的产品承诺依赖一组很窄的外部系统：云厂商折扣计划、计费账户结构、关联账户权限、身份访问，以及客户是否愿意让 Pump 靠近支出治理运行。AWS 文档说得很清楚，Savings Plans
              的经济性、计费、Organizations 策略和 IAM 控制都是云厂商定义的底层原语，不是 Pump 拥有的资产。Pump
              可以把这些原语包装得比客户自己操作更顺，但它无法强制底层折扣界面持续存在；一旦云厂商改规则、收窄资格，或直接提供同等经济性，Pump 也很难自我保护。

              这让 Pump 不同于纯分析叠加层。仪表盘公司可以扛住部分 API 变化；做拼单计费 或承诺自动化的公司，对平台政策漂移暴露得多。Pump
              越是靠计费授权、自动承诺和集中可视性创造客户价值，就越会继承平台和交易对手风险。只要云厂商规则稳定、客户相信节省金额高于运营依赖，这个风险还能承受；任何一个条件变弱，风险都会变得严重。
