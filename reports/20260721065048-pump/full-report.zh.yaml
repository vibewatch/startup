  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 用客户工作流定义产品
        blocks:
          - type: paragraph
            body: >-
              按工作流看，Pump
              的起点是让客户接入云账单背景，而不是交付代码或重构基础设施。首页和产品页反复描述一种轻量上手动作：团队授予只读或有限权限，查看节省估算，然后启用自动驾驶或报告功能。这个产品定义很重要，因为它解释了公司的快速见效主张：客户买的不是专业服务很重的迁移项目，而是贴近账单、推荐和监控的一层云运营能力。

              目前产品家族有三个已经清晰商业化的模块。Pump Save 处理折扣策略和承诺自动化。Pump View 归一化并可视化 AWS、GCP、Azure 和相邻工具中的支出。Pump Secure
              扫描云姿态或合规问题，并提供修复指引。官方营销还预告 Pump Intelligence / AI SRE
              能力，但首页和第三方评论来源都清楚表明，这仍部分是路线图，而不是完全成熟的第四支柱。这个区分对尽调重要，因为当前产品已经覆盖多个界面，但完整的「智能云平台」故事，仍稍微跑在当前案例研究中最强证据之前。
