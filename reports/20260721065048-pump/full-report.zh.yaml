  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 公开估值标记存在，但证据基础很薄且相互冲突
        blocks:
          - type: paragraph
            body: >-
              围绕 Pump 估值的公开讨论，主要由第三方数据聚合方主导，而不是清晰的一手融资公告。GetLatka 把 Pump 描述为低调浮现的独角兽，并把公司与大约 $1.5B 估值联系起来。Sacra 和 Tracxn
              也提供了公司快照，但它们的融资、收入和员工数字彼此对不齐。也就是说，核心问题不是没有数字，而是这些数字本身无法拼出稳定的估值图景。

              这很关键，因为 $1.5B
              标记只有在相当强的假设下才可能合理：增长效率异常高，虽然主打对客户免费但变现仍有吸引力，毛利耐久性很强，并且有信心相信产品的计费层定位能创造真正粘性，而不是短期新鲜感。公开记录没有推翻这些假设，但也没有证明它们。因此，头条估值标记应被视为方向性参考点，而不是已经过关的公允价值结论。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
