      - number: '7.3'
        title: 竞争会压缩利润，也会重塑 Pump 的差异化叙事
        blocks:
          - type: paragraph
            body: >-
              Pump 的拼单模式有辨识度，但它不是在真空里竞争。ProsperOps、CloudFix、Datadog 以及大型既有 FinOps
              套件都在销售重叠结果：自动节省、支出可视化、建议工作流或托管优化。这意味着买方可以用多种方式理解这个品类。如果客户把 Pump 看成「便宜承诺加一个仪表盘」，竞争范围就会扩到大型可观测性、FinOps
              和云管理厂商；如果客户把 Pump 看成独特的团购和计费平台，护城河会更强，但信任和执行负担也更重。

              竞争压力重要，是因为 Pump
              公开的变现叙事已经不典型。公司向客户营销免费节省，并靠供应商经济性或节省分成动态变现，但细节并未充分披露。客户获客对成本敏感时，这可能很有力；可一旦定价透明度、合作伙伴返利或云厂商激励发生变化，容错空间也会更小。因此，更强的替代阵容不仅会打击
              Pump 的赢单率，也会冲击毛利耐久性。
            claimRefs:
              - CR019
              - CR020
              - CR021
              - CR022
              - CR023
              - CR024
              - CR025
              - CR026
              - CR027
      - number: '7.4'
        title: 执行、法律和尽调否决标准
        blocks:
          - type: paragraph
            body: >-
              Pump 的公开披露留下了关键执行问题。公司仍然年轻，公开员工数和收入估计在第三方数据库之间互相冲突，融资记录本身也不足以证明大公司级别的运营成熟度。Delaware 备案提供了基础实体层面的保证，YC
              背书也支撑最低质量门槛，但二者都不能替代组织深度、审计准备度、支持人员配置或头部客户集中度证据。年轻公司可以把这些缺口管好；风险只在于，公开记录还没有证明它们已经做到。

              尽调上，实际问题不是 Pump
              有没有风险——它显然有——而是这些风险能否被监控。买方或投资人应围绕云厂商政策变化、无法干净退出、收入依赖集中和建议精度差设定硬性否决标准。如果管理层能拿出队列留存、头部客户敞口、事故历史以及合同细节，证明即便
              Pump 深度嵌入计费和优化工作流，客户仍掌握控制权，Pump 就容易承保得多。
            claimRefs:
              - CR028
              - CR029
              - CR030
              - CR031
              - CR032
