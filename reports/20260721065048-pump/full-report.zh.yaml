      - number: '1.4'
        title: 融资、估值与主要公开尽调警示
        blocks:
          - type: paragraph
            body: >-
              公开商业数据库和分析型资料一致认为 Pump 是一家获得风险投资支持的创业公司，但在精确资本结构图景上分歧很大。GetLatka 报道其 2023 年完成 $4 million 种子轮，估值为 $1.5
              billion；Sacra 和 Tracxn 则强调已披露融资约 $1.72 million，并将 Y Combinator 和 Leonis Investment
              列为具名投资方。差异大到不能随意抹平；更可能反映覆盖口径不同、纳入未披露工具，或数据库质量限制，而不是简单四舍五入。正确做法是保留分歧，并在尽调中索取一手融资文件。


              公开反向证据存在，但比正向营销窄得多。归档的 G2 评论显示平均评分很强，同时有关于账单组织锁定、积分到账延迟，以及偶尔把关键资源误报为可优化对象的具体投诉。AIChief
              更温和，但仍提到企业级定制有限，事件响应功能仍在开发中。这些投诉都不足以否定模型；但合在一起，它们强化了本章的核心尽调主题：Pump
              的价值主张易懂且有证据支撑，但报道中的规模指标、治理细节和客户控制机制，透明度仍低于首页节省叙事。
