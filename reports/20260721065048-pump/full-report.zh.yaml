      - CO013
      - CO017
      - CO033
      - CO036
      - CO037
      - CO038
      - CO041
      - CO042
  - id: FO002
    title: 公司快照逻辑
    type: flow
    layout: standard
    summary: Pump 的模式把账单访问、汇总承诺采购和相邻软件入口串起来，形成面向客户免费的销售话术。
    data:
      nodes:
        - id: customer
          label: 客户连接账单数据
          detail: 官方页面强调只读或轻量级访问，以及快速上线。
          tone: positive
        - id: pool
          label: 承诺用量池引擎
          detail: Pump 汇总多个客户，购买并轮换节省工具。
          tone: positive
        - id: save
          label: Pump Save
          detail: 自动执行承诺采购和节省测算是核心切入点。
          tone: positive
        - id: adjacent
          label: View / Secure / Intelligence
          detail: 可视化、合规扫描和 AI 辅助拓宽了平台叙事。
          tone: neutral
        - id: risk
          label: 信任与退出风险
          detail: 由于 Pump 位于账单层，客户控制权顾虑可能变成采用阻力。
          tone: warning
      edges:
        - from: customer
          to: pool
        - from: pool
          to: save
        - from: save
          to: adjacent
        - from: risk
          to: save
    approximationNotes: null
