  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局分层，以及谁真正与 Pump 竞争
        blocks:
          - type: paragraph
            body: >-
              Pump 周围的公开竞争集合，比一张简单的「云成本工具」清单更宽。一个群组是 ProsperOps、nOps 和 CloudFix 这类直接承诺自动化供应商，它们都在 AWS 上销售自动节省或承诺管理，有些还覆盖
              Azure 和 GCP。第二个群组是 CloudHealth、CloudCheckr 这类可视化优先或 ITAM 风格套件，重点放在大型环境中的支出透明度、治理和报告。第三个群组是 Cast AI、Zesty 等
              Kubernetes 原生优化平台，核心承诺是工作负载级自动化和资源规格优化，而不是池化账单。第四个群组是以 Ternary 为代表的财务主导治理软件，把云视为更广泛技术投资账本的一部分。

              Pump 面对每个群组时的竞争方式都不同。对承诺专家，它必须证明净节省更高、锁定感更低，或 SMB 销售动作更好。对可视化套件，它必须证明 ROI 更快、上手更简单。对 Kubernetes
              优化器，如果团队想要直接调优工作负载，Pump 可能显得过于聚焦财务层。对财务主导平台，除非 Pump View 和相邻产品足够深入，能够服务 CFO 和财务控制工作流，否则 Pump
              可能在战术上强，但在战略上偏窄。
