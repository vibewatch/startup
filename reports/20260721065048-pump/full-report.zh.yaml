      - number: '6.2'
        title: 采用轨迹，以及公开增长信号真正意味着什么
        blocks:
          - type: paragraph
            body: >-
              Pump 的公开增长信号很有吸引力，但无法干净横向比较。YC 公司页称，公司在此前六个月签约 250+ 客户，其中包括 50+ YC 公司。YC 优惠页称 40+ YC 公司当下使用 Pump。客户好评墙称
              Pump 获得 22 个国家 1,000+ 家创业公司信任。这些声明合在一起支持客户获取真实且广泛的结论，但它们没有为活跃付费账户、已上手账户或历史总注册数定义同一个分母。

              比原始数量更有用的是部署叙事。单个案例研究显示，客户从发现进入节省估算，再进入自动驾驶承诺执行，有时还扩展到更广泛使用 View 或 Secure。Tellonym、Beehiiv 和 Salesforge
              强调工程开销有限、见效快。HEO 和 UserGems 强调 Pump View 是持续报告界面。ICANotes、Terra 和 Finsera
              延伸到安全与合规。因此，公开轨迹看起来像是先通过节省落地，再可选扩张到可视化和安全，而不是一次性交易。
