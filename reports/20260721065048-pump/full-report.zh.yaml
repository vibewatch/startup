      - number: '1.3'
        title: 规模信号、客户证据，以及公开指标真正说明了什么
        blocks:
          - type: paragraph
            body: >-
              Pump 的公开足迹在定性客户证据上最强，在对齐后的运营指标上最弱。YC 公司页称 Pump 在此前六个月签约超过 250 位客户，其中包括 50 多家 YC 公司。专门的 YC 优惠页称当下有 40 多家 YC
              公司使用 Pump。与此同时，客户好评墙称公司获得 22 个国家 1,000 多家创业公司信任，客户目录也展示了创作者软件、匿名社交、退休金融科技、空间成像、行为健康软件、销售工具和 AI
              基础设施等命名案例。合在一起，这些输入支持 Pump 在创业公司中已有实质渗透的结论，但它们没有定义一个经审计的单一活跃客户数。


              员工数和规模也呈现同样模式。Y Combinator 摘要称 Pump 在 San Francisco 有 75 名员工，GetLatka 称 2025-2026 年约 75-76 名员工，Tracxn 在 6
              月 26 日快照中显示 99 名员工。这些数字方向上符合一家快速扩张公司，但差异足够大，应当作为区间信号而非硬事实。管理支出声明在官网上更强，官网称管理客户云支出超过 $1.05
              billion；但即便如此，已处理支出、已赚取收入和留存毛利之间的关系仍未披露。
