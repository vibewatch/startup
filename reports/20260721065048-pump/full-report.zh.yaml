      - number: '6.4'
        title: 留存、扩张和集中度风险
        blocks:
          - type: paragraph
            body: >-
              即便留存指标没有披露，公开材料仍能看出扩张逻辑。多篇案例先从节省成本切入，再叠加 View 或 Secure，说明存在交叉销售空间。Beehiiv 把 View 用作面向财务的支出监控工具；Tellonym
              指向未来的资源规格优化功能；ICANotes 同时用了 Save、View 和 Secure；Terra、Finsera 则把 Secure 作为节省成本之上的增量价值层。这个模式支撑了一个可信的先落地、再扩张
              路径，尤其适合人手精简、希望用一家供应商处理多项云运营工作的团队。

              风险在于客户集中度和流失仍不透明。审阅到的公开来源没有给出净留存率（NRR）、总留存率（GRR）、续约率、合同期限或头部客户敞口。产品卡在计费层，一方面可能提高粘性，另一方面也会放大退出顾虑：归档的 G2
              反馈里有一条尖锐投诉，称离开计费组织很困难；更正面的评论也提到仍需验证部分建议。由此看，Pump 的客户质量强到值得关注，但公开证据披露不足，无法单独量化其耐久性。
