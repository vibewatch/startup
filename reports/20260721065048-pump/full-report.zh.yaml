      - number: '2.3'
        title: 买家分层、采用路径与约束模式
        blocks:
          - type: paragraph
            body: >-
              Pump 的潜在买家是工程占比高的组织：一个或少数运营人员负责有意义的月度云账单，但不想搭建内部 FinOps 职能。官方案例显示，CTO、单人 DevOps 运营者、安全负责人、IT
              经理和接近财务的运营人员都在用 Pump 替代手动 AWS Cost Explorer
              分析、避免计划到期，或整合支出、安全和合规可视化。这指向一种买家模式：用户往往偏技术，付款方通常是公司，预算负责人可能是创始人、CTO、财务负责人或混合型运营者，而不是专职 FinOps 团队。

              采用摩擦路径可预测。第一，团队必须相信第三方可以接触账单层。第二，团队必须相信实际节省会超过流程风险或采购摩擦。第三，工具必须接入团队已经使用的沟通层，通常是
              Slack、仪表盘和简单报告。ProsperOps、nOps、CloudFix
              等竞品材料显示，整个市场都在试图降低同一种恐惧：用量变化太快时，客户既怕承诺过多支出，也怕漏掉浪费。对小买家来说，简单和省下的时间可能与绝对节省率一样重要。对大买家来说，可审计性、治理和覆盖范围比某个标题节省点估计更重要。
