      - number: '2.4'
        title: 市场结构、扩张路径与 TAM 的持久约束
        blocks:
          - type: paragraph
            body: >-
              市场结构至少正在分成四组。第一组是 ProsperOps、nOps、CloudFix 以及 Zesty 部分业务这样的承诺自动化专家。第二组是 Ternary
              以及更广义云成本平台这类可视化优先或财务治理供应商。第三组是 Cast AI 这类 Kubernetes 原生优化供应商。第四组是云厂商原生工具，它们抬高基线，但通常不会做到跨客户池化。Pump
              的公开差异化适合第一组，同时带有向第二组扩张的野心。

              TAM 的持久约束在于，并非每个买家都会外包账单层。大型企业可能偏好内部 FinOps 团队、直接谈判的
              EDP，或打包套件。有些买家只需要报告，不需要池化承诺。另一些买家要工作负载级自动化，而不是财务层优化。因此，最现实的 Pump 市场逻辑不是「全部云支出」，而是切入这样一批组织：规模太小，撑不起成熟
              FinOps 职能；变化太快，不适合静态承诺；同时越来越想要一个能连接节省、可视化和安全的工具。市场有吸引力，恰恰因为云复杂度没有消失；它正以多数团队无法配足人员的速度，扩展到 Cloud+、AI 和多云运营。
