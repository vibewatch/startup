chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品边界与商业模式
        blocks:
          - type: paragraph
            body: >-
              Pump 自称「The Intelligent Cloud Platform」，给出的主张很简单：客户接入云账单数据，Pump 汇聚多家客户需求，再自动购买和轮换 Savings Plans、Reserved
              Instances 等折扣工具。官网称平台覆盖 AWS、GCP 和 Azure，并有四个品牌化产品界面——Pump Save、Pump View、Pump Secure，以及一层仍部分处于路线图阶段的智能 /
              事件响应能力。公司持续把服务包装为对客户免费，并主张云厂商或池化账单的经济性让 Pump 无需直接收取平台费也能变现。


              产品边界很关键，因为 Pump 并不是一个基础设施重构供应商。它自己的 YC 页面和客户证言反复把 Pump 定义为账单层中介：客户仍保留运营控制权，Pump 改变承诺用量的购买和监控方式。这降低了初创公司和精简
              DevOps 团队的落地摩擦，但也让账单控制信任、退出机制和推荐质量成为尽调核心。即便官方材料和第三方评论在规模指标上不一致，二者仍支撑同一类总体定位。
