      - number: '4.4'
        title: 资本充足性、融资依赖与财务披露边界
        blocks:
          - type: paragraph
            body: >-
              资本结构是 Pump 财务尽调文件中最大的公开盲点。GetLatka 报道 2023 年一轮 $4M 种子轮，对应 $1.5B 估值。Sacra 和 Tracxn 则指向约 $1.72M 已披露融资，并点名 Y
              Combinator 和 Leonis Investment 为投资方；Tracxn 还提到 2024
              年之后的种子轮引用。注册记录确认了法律实体，但没有提供融资细节。已审阅公开来源都没有披露手头现金、烧钱速度、现金跑道、债务额度、云厂商营运资本义务，或池化账单模型是否创造了经济上类似融资风险的资产负债表或信用敞口。

              这一点重要，因为账单中介可以快速放大收入，同时承担普通 SaaS 仪表盘公司没有的运营和营运资本复杂性。即便 Pump
              主要只是云采购成本的转付方，时点差异、客户信用条款、云厂商结算机制，以及任何与聚合承诺挂钩的激励，都可能影响风险。公开证据足以得出公司有真实商业牵引力；但不足以判断财务模型是资本轻、耐久，还是能顶住云厂商政策变化。这些结论需要一手报表和合同。
