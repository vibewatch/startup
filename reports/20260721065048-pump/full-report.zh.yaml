figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: standard
    summary: 公开可见的里程碑显示，这家公司还很年轻，叙事扩张很快，但底层披露仍不完整。
    data:
      items:
        - date: '2022'
          label: 公司成立
          detail: Y Combinator、GetLatka 和 Tracxn 都指向 Spandana Nakka 于 2022 年创办公司。
          tone: positive
        - date: 2023-05
          label: 加州外州注册有效
          detail: Bizprofile 显示 Pump Billing, Inc. 在加州提交登记，成立地为 Delaware。
          tone: neutral
        - date: '2023'
          label: 种子轮 / 估值说法出现
          detail: GetLatka 称 Pump 有 $4M 种子轮和 $1.5B 估值，但其他数据库对已披露融资并不一致。
          tone: warning
        - date: '2024'
          label: 建立印度子公司
          detail: YC 发布说明称，由于 AWS 使用不同的本地实体，Pump 设立了印度子公司。
          tone: positive
        - date: 2024-06
          label: 早期收入里程碑
          detail: GetLatka 记录了 2024 年 6 月 $1.4M 的收入里程碑。
          tone: positive
        - date: '2025'
          label: 更广的产品套件对外营销
          detail: 官网把 Pump Save、View、Secure 和 Intelligence 打包成一个平台来推。
          tone: positive
        - date: '2025'
          label: 公开规模口径扩大
          detail: YC 和好评墙页面提到数百至 1,000+ 家初创公司，以及大额管理支出。
          tone: positive
        - date: 2025-09 archive
          label: 评价记录喜忧参半
          detail: 归档的 G2 页面显示平均评分很高，但也有对锁定效应和承诺抵扣额度的明确投诉。
          tone: warning
    approximationNotes: 只有来源披露了明确备案日或归档日时，日期才是精确日期；其他日期反映来源给出的年份或年月。
    claimRefs:
