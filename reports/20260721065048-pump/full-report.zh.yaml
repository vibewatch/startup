      - number: '8.3'
        title: 情景分析指向宽区间，且需要公共证据折价
        blocks:
          - type: paragraph
            body: >-
              Pump 的乐观情景很容易讲清楚。如果公司确实拥有强 ARR
              规模、广泛的创业公司采用、来自供应商折扣的有吸引力抽成经济性、低流失，以及交叉销售可视化或安全模块的空间，那么大额私有市场标记可以由未来战略价值支撑，而不必只靠当前可比公司。品类重要，痛点尖锐，客户案例对一家年轻公司来说异常具体。只要内部数字匹配这个故事，这组条件就会带来真实上行空间。

              但基准情景应给公共证据打折。融资历史相对估值头条偏小，客户指标仍然偏营销化，收入质量尚未解决。悲观情景不是「Pump
              没有产品」，而是公司有价值，但估值标记大幅跑在可独立证明的财务质量前面。在这个框架下，关键问题变成：尽调能否足够快地补上证据缺口，从而证明接近隐含标记的价格是合理的。
            claimRefs:
              - CV017
              - CV018
              - CV019
              - CV020
              - CV021
              - CV022
