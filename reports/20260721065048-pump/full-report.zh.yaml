      - number: '8.2'
        title: 可比公司更能支撑战略意义，而不是精确验证估值
        blocks:
          - type: paragraph
            body: >-
              Pump 所在的是一条真实且有价值的预算线。FinOps
              和云成本管理工具重要，是因为云账单规模大、波动高，人手精简的团队很难持续优化。CloudHealth、Cloudability、nOps、Ternary、CloudZero、Zesty 和 Turbonomic
              的官方材料都显示，大型厂商和垂直创业公司相信围绕云支出的优化、报告和治理存在耐久企业需求。从这个意义上说，Pump 的品类位置不是问题。

              估值难点在于可比性。很多同行销售可视化、治理或 Kubernetes 优化，而 Pump
              在上面叠加了拼单计费和承诺经济模型。这让纯倍数法可比分析噪音很大。这里使用可比公司的正确方式，不是声称某一个单一倍数，而是证明战略意义真实存在；同时，商业模式差异也让公开同行页面无法单独证明 $1.5B 标记。
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
