  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Pump 位于更广义的 FinOps / 云财务管理市场中，但最锐利的初始切入点更窄：先面向使用 AWS 的初创公司和 SMB 买家，自动优化云承诺采购，并提供相邻可视化能力，再延伸到 GCP 和
              Azure。纳入支出是围绕计算、数据库、存储、网络和相关平台服务产生的经常性基础设施账单；云厂商会用更长承诺或更规范采购换取实质折扣。Pump 自有材料强调 Savings Plans、Reserved
              Instances、异常检测、预测和报告，而不是工作负载重构。

              现状替代方案并不是抽象的「什么都不做」；更像是云厂商原生工具、表格分析，以及工程师或财务运营人员偶尔手动购买承诺用量的组合，而这些人还有很多别的工作。AWS 自身重点介绍 Savings Plans 推荐、RI
              机制和云财务管理最佳实践；FinOps Foundation 和 Flexera
              的证据也显示，多数组织早已知道优化很重要。真正缺口在不确定性下的执行：买家害怕锁定，没有带宽建模需求，也常常缺少由财务拥有的云用量记录系统。正是这个缺口，让以仪表盘主导的管理供应商和以自动化主导的优化供应商都能成立。
