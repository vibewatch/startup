      - number: '2.2'
        title: 需求驱动、市场规模视角，以及赛道为何持续存在
        blocks:
          - type: paragraph
            body: >-
              最好的公开需求信号不是某个单一分析师 TAM 数字，而是多组一手数据里反复出现的云支出痛点。《State of FinOps 2025》称，受访组织代表的云支出超过 $69
              billion，仍把工作负载优化和浪费削减列为最高优先级。Flexera 2025 年《State of the Cloud》发布内容称，84% 组织难以管理云支出，预算比计划高出
              17%，成本效率仍是评估云进展的第一指标。这些数字意味着一个很大的经济基座，哪怕低双位数改善也很重要。

              对 Pump 而言，可服务市场小于完整云管理版图。甜蜜点是这样一组客户：大量使用公有云，同时仍缺少内部工具或人员来持续做承诺优化。AWS 称 Savings Plans 最高可降本 72%，RI
              以可选容量预留提供折扣小时价格；但只有在覆盖率、服务组合和时点都管理得当时，标题折扣才能真正兑现。由此形成一个经常性软件和服务市场，核心是把理论折扣计划转化为实际节省。随着 FinOps 从公有云扩展到
              AI、SaaS 和更广义技术支出治理，赛道还会继续变宽，也提高了供应商从一个预算视图切入多个相邻视图的价值。
