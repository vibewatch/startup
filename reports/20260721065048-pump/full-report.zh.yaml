      - number: '4.2'
        title: 公开牵引力信号：收入、管理支出与客户证据代理
        blocks:
          - type: paragraph
            body: >-
              公开收入估算是最清晰的牵引力信号，也是最清晰的冲突来源。GetLatka 称 Pump 2025 年收入达到 $15.2 million，此前在 2024 年 6 月达到 $1.4
              million。相比之下，Sacra 估计公司 2025 年年化收入达到 $25 million，高于 2024 年底的大约 $7 million 和 2024 年 3 月的
              $500K。两者都暗示快速增长，但几乎肯定衡量了不同东西——也许是某一时点运行率与确认收入之差，或已披露数字与推断数字之差。正确解读不是认定某一来源造假，而是业务扩张足够快，快照方法会实质影响表观轨迹。

              客户证据代理支持真实商业需求存在。首页称管理支出超过 $1.05 billion，客户平均节省 30%。案例研究展示了有意义的金额结果：Beehiiv 在完整一个月内节省超过 $15K，Tellonym
              在自动驾驶支持下运行约 $42K 月度 AWS 账单，Whalesync 节省超过 $13K 并将计算成本削减 62%，Terra 在数月内节省近 $30K，ICANotes 称仅替换此前 FinOps
              供应商就消除了大约 $60K+ 年度成本。这些不是经审计队列指标，但确实表明产品触及的是有经济意义的预算，而不是业余工作负载。
