      - number: '4.3'
        title: 成本结构、毛利驱动因素与服务交付含义
        blocks:
          - type: paragraph
            body: >-
              Pump
              的公开材料暗示，其成本结构把软件交付与有分量的服务劳动混在一起。产品本身看起来像软件：只读或轻触式集成、统一仪表盘和自动承诺逻辑，在核心系统建成后应当支持高效部署。但几篇客户案例提到专属解决方案架构师、迁移帮助、手把手推荐，或围绕基础设施变化的战略支持，说明服务层至少在部分装机客户中具有经济重要性。这可以提升留存和实际结果，但也意味着毛利率不太可能只由软件托管成本解释。

              因此，主要毛利驱动因素可能包括：池化账单模型中的云厂商经济性、承诺用量利用准确度、单账户支持强度，以及 View 或 Secure
              通过给客户更好的自助可视化来降低支持负担的程度。公开来源没有披露毛利率、CAC、回本周期或
              NRR。最接近的可见代理，是公司的免费进入动作、上手没有明显基础设施变更要求，以及客户案例暗示小团队可以很快看到价值。这可能说明初始部署效率较高，但不必然说明全成本服务开销低。
