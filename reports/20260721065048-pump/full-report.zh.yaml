      - number: '1.2'
        title: 法律实体、总部与领导层可见度
        blocks:
          - type: paragraph
            body: >-
              Pump 的公开营销和法律页面显示，签约实体是 Pump Billing, Inc.，也被称为 Counter Inc.。客户协议列出其办公室位于 San Francisco 1455 Market
              Street，并称 Pump 是获得授权的 AWS、GCP 和 Azure 合作伙伴，附有合作伙伴 ID。一个源自 California 注册信息的资料页给出更正式的实体细节：Pump Billing, Inc.
              于 2023 年 5 月 3 日提交设立文件，当前为有效状态，成立地为 Delaware，并列 Michael Buckwald 为 CFO 和注册代理人，Spandana Nakka 为董事、CEO 和秘书。


              因此，创始人 / 财务层面的领导层可见度好于完整高管或董事会层面。Y Combinator、GetLatka 和 Tracxn 都将 Spandana Nakka 标为创始人兼
              CEO，但已审阅公开材料都没有以同样清晰度提供董事会名单、治理权利、委员会结构，或更完整的高管团队。这本身并不意味着治理缺陷，但围绕投资人控制权、授权安排，以及公开证据中目前显示的管理班底是否比「创始人 +
              财务」更深，常规尽调问题仍未关闭。
