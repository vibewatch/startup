  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 按买家、用例和工作负载模式划分客户
        blocks:
          - type: paragraph
            body: >-
              Pump 的公开客户群集中在风险投资支持或成长期软件公司：云账单有实质金额，但基础设施团队仍很精简。官方客户页和单个故事覆盖 newsletter
              基础设施（Beehiiv）、匿名消费消息（Tellonym）、退休金融科技（ForUsAll）、支付与企业金融（Zil
              Money、Paynt）、行为健康软件（ICANotes）、销售和营销科技工具（Salesforge、UserGems）、deepfake 或 AI 基础设施（Reality
              Defender、Daemo、Olio Labs），以及空间或成像工作负载（HEO Space、GeoServes）。这些例子的共同点不是某个行业，而是一种运营形态：技术上重要的云支出，同时不愿配备沉重的内部
              FinOps 动作。

              买家、用户和付款方往往压缩成一小群人。有些引用中，用户是单人 DevOps 负责人；另一些是安全负责人或 IT 经理；还有一些是创始人或 CTO。付款方是公司，但预算负责人可能来自工程、财务，或混合运营角色。这让
              Pump 的「免费 + 快速」定位在该细分人群中可信：公司卖给这些团队的是省下的时间、更少账单意外，以及更容易的报告，而这些团队里一个人往往横跨多重角色。
