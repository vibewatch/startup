  - id: FO003
    title: 公开规模与披露质量
    type: kpi
    layout: standard
    summary: 独立视角看，有支撑的指标如何与未解披露缺口交织在一起。
    data:
      items:
        - label: 平均节省
          value: 30%
          detail: 官方营销材料和 AIChief 都引用约 30% 的平均客户节省。
          tone: positive
        - label: 最高节省口径
          value: Up to 60%
          detail: YC 和 Pump Save 材料把它用作上行情景的主打数字。
          tone: positive
        - label: 管理支出
          value: $1.06B+
          detail: 官网对 AWS、GCP 和 Azure 合计管理支出的口径。
          tone: positive
