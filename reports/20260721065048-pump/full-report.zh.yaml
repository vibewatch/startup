      - number: '6.3'
        title: 具名客户证据与结果质量
        blocks:
          - type: paragraph
            body: >-
              案例研究提供具体预算或节省数字时，结果质量最强。Beehiiv 称 Pump 在激活后第一个完整月带来超过 $15K 节省。Tellonym 的故事锚定约 $42K 月度 AWS
              账单，以及消除手动续订计划工作。Whalesync 称数月内节省超过 $13K，并将计算成本降低 62%。Terra 称数月内节省近 $30K，并在 EC2 和 RDS 承诺上实现强劲节省。ICANotes
              称仅替换此前 FinOps 供应商，就移除了超过 $60K 年度成本。HEO、Greybeam 和 UserGems
              提供更多围绕可视化和决策质量的定性证据；ForUsAll、GeoServes、Paynt、Daemo 和 Olio 则展示更定制化或服务较重的互动。

              因此，证据质量不对称。多个案例中的节省证据很具体；生产与试点状态通常可以推断，但不总是明确标注；留存可见度弱；部分故事明显更像咨询式合作，而不是纯自助 SaaS 部署。正确解读是，Pump
              有可信客户证据，但还没有标准化队列数据，无法让投资人以高统计置信度比较不同细分中的客户价值。
