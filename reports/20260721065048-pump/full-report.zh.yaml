      - number: '8.4'
        title: 建议：把公司视为有意思，但公开估值偏贵
        blocks:
          - type: paragraph
            body: >-
              基于公开证据，投资结论不是硬性否定这家公司。Pump
              看起来信息有力、客户具名、品类意义强，而且至少有一个广泛流传的高估值标记。但估值环节会抬高举证标准。一家公司可以有前景，同时也可能难以自信定价。这里正处在这种状态。

              因此，正确建议是有条件推进。只有当管理层能就已实现收入、毛利结构、集中度、留存和退出质量提供直接证据时，才继续尽调。如果这些数据强，估值争论就变成速度和上行空间问题；如果这些数据弱或回避，公开记录表明当前标记跑在证据前面，本身就应被视为承保风险。这意味着最终投资判断里，价格纪律和产品兴奋度同样重要。
