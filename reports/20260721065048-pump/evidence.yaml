evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board composition, investor rights, and cap-table ownership percentages.
    whyItMatters: Founder concentration and investor control cannot be assessed from public sources alone.
    diligencePath: Request charter documents, board list, cap table, and shareholder agreements.
    relatedQuestionRefs:
      - QO022
      - QO025
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: funding
    missingEvidence: >-
      Primary financing documents reconciling the $1.72M versus $4.0M disclosed funding totals and the source of the
      $1.5B valuation claim.
    whyItMatters: Capitalization quality and entry valuation discipline depend on the correct round history.
    diligencePath: Obtain signed financing documents, SAFE/convertible schedules, and investor-side confirmations.
    relatedQuestionRefs:
      - QO019
      - QO023
      - QO025
  - type: conflicting-data
    severity: material
    topic: customers
    missingEvidence: A like-for-like active-customer count with cohort definitions and dates.
    whyItMatters: Different public customer claims likely describe different populations, which affects traction assessment.
    diligencePath: Request current paid accounts, churned accounts, and customers-by-spend-band cut from the BI system.
    relatedQuestionRefs:
      - QO010
      - QO024
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: minor
    topic: leadership
    missingEvidence: A fuller public executive roster beyond founder and CFO-level visibility.
    whyItMatters: Management-bench depth influences key-person risk and scaling confidence.
    diligencePath: Request org chart, executive bios, and hiring plan for the next 12 months.
    relatedQuestionRefs:
      - QO004
      - QO022
  - type: missing-source
    severity: material
    topic: tam
    missingEvidence: >-
      A clean analyst-grade TAM or SAM estimate specific to automated commitment optimization rather than generic
      cloud-management software.
    whyItMatters: A broad cloud-spend base does not translate directly into serviceable software revenue for Pump’s exact wedge.
    diligencePath: Request management’s internal TAM/SAM work and compare it with third-party FinOps category reports.
    relatedQuestionRefs:
      - QM022
      - QM023
      - QM025
  - type: private-evidence-only
    severity: material
    topic: aws-vs-multi-cloud-mix
    missingEvidence: Pump’s actual revenue or spend-under-management mix by AWS, GCP, and Azure.
    whyItMatters: Public messaging suggests multi-cloud breadth, but the serviceable market today may still be heavily AWS-first.
    diligencePath: Request current spend-under-management split by provider and customer cohort.
    relatedQuestionRefs:
      - QM024
  - type: conflicting-data
    severity: minor
    topic: market-sizing
    missingEvidence: Consistent vendor-revenue data separating commitment automation from visibility and broader FinOps tooling.
    whyItMatters: Category labels merge distinct buyer jobs and can overstate the market available to any single vendor.
    diligencePath: Build a bottoms-up comparable set segmented by buyer job rather than by generic FinOps label.
    relatedQuestionRefs:
      - QM017
      - QM023
  - type: private-evidence-only
    severity: material
    topic: competitive-win-rate
    missingEvidence: Actual win/loss data versus ProsperOps, nOps, CloudFix, CloudHealth, and native AWS tooling.
    whyItMatters: Public marketing does not show which competitors Pump beats most often or why deals are lost.
    diligencePath: Request CRM-coded win/loss reports and customer reference calls segmented by rival.
    relatedQuestionRefs:
      - QP012
      - QP023
      - QP025
  - type: missing-source
    severity: material
    topic: attach-rates
    missingEvidence: Verified Save/View/Secure module attach rates and retention deltas from customers using more than one product.
    whyItMatters: Cross-sell depth is central to the moat thesis but not visible in public evidence.
    diligencePath: Request product attach-rate cohort analysis and module-level NRR.
    relatedQuestionRefs:
      - QP024
  - type: missing-source
