  topStrengths:
    - Pump 所在品类重要且耐久：云成本管理和 FinOps 需求明确存在，大型既有厂商和垂直专家都在争同一条预算线。
    - 对一家年轻的私有基础设施公司来说，客户证据强于平均水平：既有具名案例，也有几条明确节省成本的故事。
    - 联合账单和自动化故事足够差异化，值得继续尽调，而不是快速否定。
    - YC 背书和广泛创业公司采用的说法，支撑了基础商业可信度。
  topRisks:
    - 估值叙事由存在利益冲突的第三方数据推动，没有清晰公开融资披露或已对齐 KPI 组合支撑。
    - Pump 的护城河和风险面缠在一起，因为产品贴近账单、权限，以及由云厂商控制的节省机制。
    - 公开来源看不到毛利率、NRR / GRR、集中度或精确抽成经济，增长质量很难测算。
    - 负面评价指向账单组织摩擦，因此退出流程和客户控制质量仍是实质尽调担忧。
  unresolvedGaps:
    - 当前期间的精确 ARR、收入、毛利率和抽成率数据。
    - 按收入和托管支出拆分的净留存、总留存、流失和头部客户集中度。
    - 融资条款、优先股堆叠，以及传闻估值是否能清晰映射到新钱经济。
    - 标准退出流程、客户控制保护，以及已实现节省的精确度指标。
    - 最新已验证员工数，以及对齐后的累计融资历史。
