- id: TV004
  title: Comparable Valuation Table
  columns:
  - Comparable
  - Public positioning
  - What it shows
  - Relevance to Pump
  - Limitation
  rows:
  - - CloudHealth by Broadcom
    - Enterprise FinOps / governance platform
    - Large incumbents see cloud financial management as a durable category
    - Validates enterprise demand and strategic buyer logic
    - Not a direct private multiple or same business model
  - - IBM Cloudability
    - Cloud cost management and optimization
    - Large vendors compete for the same budget line
    - Supports category maturity and buyer familiarity
    - Incumbent distribution and pricing differ materially
  - - nOps
    - AWS cost optimization platform
    - Specialists market automation and cost control around AWS
    - Closer product adjacency on cloud-savings workflows
    - No public valuation multiple or identical model disclosed
  - - Ternary
    - Finance-oriented cloud investment intelligence
    - Cloud-cost tools can win finance stakeholders
    - Useful comp for spend-governance narrative
    - Different emphasis on analytics vs pooled economics
  - - CloudZero
    - Cloud cost intelligence / AI ROI framing
    - Visibility-led entrants also attack the category
    - Highlights competition from adjacent tooling
    - Different monetization and product scope
  - - Zesty
    - Autonomous infrastructure optimization
    - Optimization buyers accept automation-led savings stories
    - Shows strategic interest in autonomous cost control
    - More infra-automation/Kubernetes oriented than Pump
  - - Turbonomic
    - Application resource management / optimization
    - Optimization can expand into broader infra-management budgets
    - Shows ceiling for category adjacency
    - Much broader product scope than Pump
  notes: Comparables are used to frame category relevance and strategic alternatives, not to derive a clean point multiple for Pump.
