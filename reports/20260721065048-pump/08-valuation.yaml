- id: TV006
  title: Final Diligence Asks Table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Revenue quality
    - Current ARR, net revenue retention, gross retention, and customer concentration
    - Valuation cannot be anchored without durable revenue proof
    - Management data room and CFO review
  - - Gross margin structure
    - Cloud-provider economics, rebates, take rate, and support cost profile
    - Explains whether free-to-customer messaging can sustain a premium mark
    - Finance diligence and unit-economics memo
  - - Customer control and offboarding
    - Termination workflow, contract rights, and exit references
    - Trust risk directly affects premium sustainability
    - Legal review plus reference calls
  - - Cross-sell and product breadth
    - Save-to-View / Secure attach rates and module cohort data
    - Determines whether ACV expansion is real or mostly narrative
    - Product / revenue ops diligence
  - - Financing context
    - Latest round terms, investor rights, and preferred overhang
    - A $1.5B headline can mask weaker common-value economics
    - Legal / financing document review
  notes: These are the minimum asks required to move from interesting company to underwritable price.
