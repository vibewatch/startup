- id: TV005
  title: Thesis-Break and Kill Triggers Table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Management cannot reconcile revenue and ARR claims
    - No consistent KPI pack
    - Breaks the hidden-quality explanation behind the mark
    - Pause process or apply severe valuation haircut
  - - Concentration is high
    - Top customers dominate revenue or managed spend
    - Weakens durability and increases downside sensitivity
    - Re-price with concentration discount
  - - Offboarding quality is poor
    - Reference checks show disputed or slow exits
    - Undermines trust-based moat and retention assumptions
    - Treat as structural red flag
  - - Gross margins or take economics are weak
    - Supplier or savings-share economics do not scale well
    - Breaks premium valuation logic
    - Do not underwrite premium mark
  - - Provider policy changes tighten economics
    - Savings surfaces narrow materially
    - Damages moat and growth assumptions together
    - Refresh downside model before proceeding
  notes: These are the most practical triggers that could invalidate a premium underwriting case quickly.
