      - number: '8.2'
        title: Comparable Companies Support Strategic Relevance More Than Precise Mark Validation
        blocks:
          - type: paragraph
            body: >-
              Pump operates in a real and valuable budget line. FinOps and cloud-cost-management tools are important
              because cloud bills are large, volatile, and difficult for lean teams to optimize consistently. Official
              materials from CloudHealth, Cloudability, nOps, Ternary, CloudZero, Zesty, and Turbonomic all show that
              large vendors and focused startups believe there is durable enterprise demand for optimization, reporting,
              and governance around cloud spend. In that sense, Pump’s category placement is not the issue.

              The valuation challenge is comparability. Many peers sell visibility, governance, or Kubernetes
              optimization, while Pump layers a pooled-billing and commitment-economics model on top. That makes pure
              multiple-based comping noisy. The right use of comparables here is not to claim a single multiple, but to
              show that strategic relevance is real while business-model differences keep public peer pages from proving
              a $1.5B mark on their own.
            claimRefs:
              - CV009
