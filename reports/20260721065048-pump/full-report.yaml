        - label: Risk profile (higher = safer)
          value: 4 / 10
          detail: Structural platform and trust risks remain material.
          tone: warning
        - label: Valuation attractiveness
          value: 3 / 10
          detail: Public evidence does not justify embracing the headline mark.
