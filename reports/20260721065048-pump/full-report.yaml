  - id: FR002
    title: Risk Transmission Map
    type: dag
    layout: wide
    summary: A provider-policy or billing-control shock can flow directly into customer trust, retention, and valuation.
    data:
      nodes:
        - id: root
          label: Provider rule or control shock
          description: AWS program changes, access changes, or control-model friction
        - id: savings
          label: Savings proposition weakens
          description: Quoted or realized customer savings become less compelling
        - id: trust
          label: Customer trust deteriorates
          description: Customers worry about permissions, offboarding, or recommendation quality
        - id: retention
          label: Retention and expansion suffer
          description: Renewals, referrals, and module attach rates weaken
        - id: margin
          label: Margin compresses
          description: Pump may need lower pricing or more support to keep customers
        - id: value
          label: Enterprise value impaired
          description: Growth and durability assumptions de-rate
      edges:
        - from: root
          to: savings
          label: Economic surface changes
        - from: root
          to: trust
          label: Control concerns rise
        - from: savings
          to: retention
          label: Less value to renew
        - from: trust
          to: retention
          label: Higher churn risk
        - from: retention
          to: margin
          label: CAC/support burden rises
        - from: margin
          to: value
          label: Lower quality of growth
    approximationNotes: The map is illustrative and intended to show causal direction, not precise timing or magnitude.
    claimRefs:
      - CR004
      - CR006
      - CR015
      - CR016
      - CR025
      - CR026
      - CR035
  - id: FR003
    title: Dependency Map
    type: dag
    layout: wide
    summary: Pump’s risk posture is dominated by external platforms, customer trust, and adjacent-category competition.
    data:
      nodes:
        - id: aws
          label: AWS billing and discount primitives
          description: Core execution and economics surface
        - id: iam
          label: IAM / Organizations permissions
          description: Access and policy controls
        - id: customers
          label: Customer finance and engineering trust
          description: Adoption and retention prerequisite
        - id: rivals
          label: Competing optimization vendors
          description: Alternative paths to similar outcomes
        - id: pump
          label: Pump operating model
          description: Pooling, automation, visibility, and support
        - id: value
          label: Revenue and valuation durability
          description: What underwriting ultimately depends on
      edges:
        - from: aws
          to: pump
          label: Defines economic rails
        - from: iam
          to: pump
          label: Defines control surface
        - from: customers
          to: pump
          label: Trust enables deployment
        - from: rivals
          to: pump
          label: Pressure on differentiation and pricing
        - from: pump
          to: value
          label: Execution quality drives durability
    approximationNotes: The dependency map simplifies a multi-sided system into the few nodes that most directly govern downside.
    claimRefs:
      - CR001
      - CR002
      - CR005
      - CR019
      - CR020
      - CR022
      - CR024
  - id: FV001
    title: Recommendation Logic
    type: flow
    layout: wide
    summary: Public evidence supports continued diligence on the company, but not acceptance of the headline valuation.
    data:
      nodes:
        - id: market
          label: Important market
          detail: Cloud-cost management is a durable pain point
          tone: positive
        - id: proof
          label: Real customer proof
          detail: Named references and case-study outcomes exist
          tone: positive
        - id: conflict
          label: Conflicted financial proof
          detail: Revenue, funding, and employee data do not triangulate cleanly
          tone: warning
        - id: risk
          label: Structural risk
          detail: Provider dependence and trust risk remain material
          tone: warning
        - id: result
          label: Conditional diligence only
          detail: Interesting company; valuation still needs private proof
          tone: neutral
      edges:
        - from: market
          to: result
        - from: proof
          to: result
        - from: conflict
          to: result
        - from: risk
          to: result
    approximationNotes: The logic map expresses the decision chain qualitatively rather than weighting each factor numerically.
