      - number: '1.3'
        title: Scale Signals, Customer Proof, and What the Public Metrics Really Show
        blocks:
          - type: paragraph
            body: |-
              Pump's public footprint is strongest on qualitative customer proof and weakest on reconciled operating
              metrics. The YC company page says Pump signed up more than 250 customers in the prior six months and
              included more than 50 YC companies. The dedicated YC offer page says 40+ YC companies use Pump today.
              Meanwhile, the wall-of-love page claims the company is trusted by 1,000+ startups across 22 countries,
              and the customer directory shows named references across creator software, anonymous social, retirement
              fintech, space imaging, behavioral-health software, sales tooling, and AI infrastructure. These inputs
              collectively support the conclusion that Pump has meaningful startup penetration, but they do not define
              a single audited active-customer count.

              The same pattern holds for headcount and scale. Y Combinator's excerpt says Pump had 75 employees in
              San Francisco, GetLatka says approximately 75-76 employees through 2025-2026, and Tracxn shows 99
              employees as of a June 26 snapshot. Those figures are directionally consistent with a fast-scaling
              company but inconsistent enough that they should be treated as range signals rather than hard facts.
              Spend-under-management claims are stronger on the official site, which cites more than $1.05 billion
              of customer cloud spend managed, but even there the connection between spend processed, revenue earned,
              and retained gross margin is not disclosed.
