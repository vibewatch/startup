  - id: FI003
    title: Case-Study Economics as Revenue-Quality Proxies
    type: kpi
    layout: standard
    summary: Customer savings anecdotes imply economically meaningful budgets, but they are not cohort metrics.
    data:
      items:
        - label: Beehiiv
          value: '>$15K / month saved'
          detail: First full month with savings plans active produced over $15K in savings.
          tone: positive
        - label: Tellonym
          value: ~$42K monthly AWS bill
          detail: Autopilot is used on a meaningful recurring cloud budget.
          tone: positive
        - label: ICANotes
          value: '>$60K annual vendor-cost removal'
          detail: Pump replaced a prior FinOps vendor and security-tool spend.
          tone: positive
        - label: Whalesync / Terra
          value: $13K and ~$30K saved
          detail: More evidence that the product touches real infrastructure budgets.
