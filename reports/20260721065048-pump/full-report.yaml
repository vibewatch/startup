      - number: '2.3'
        title: Buyer Segmentation, Adoption Path, and Constraint Pattern
        blocks:
          - type: paragraph
            body: >-
              Pump’s likely buyers are engineering-heavy organizations where one or a few operators own a meaningful
              monthly

              cloud bill but do not want to build an internal FinOps function. Official case studies show CTOs, solo
              DevOps

              operators, security leads, IT managers, and finance-adjacent operators using Pump to replace manual AWS
              Cost

              Explorer work, avoid expired plans, or consolidate spend, security, and compliance visibility. That points
              to a

              buyer pattern where the user is often technical, the payer is usually the company, and the budget owner
              may be a

              founder, CTO, finance lead, or hybrid operator rather than a dedicated FinOps team.


              Adoption friction follows a predictable path. First, a team must trust a third party with billing-layer
              access.

              Second, the team must believe realized savings will exceed any process risk or procurement friction.
              Third, the

              tool must integrate into the communication layer the team already uses — often Slack, dashboards, and
              simple

              reporting. Competitive materials from ProsperOps, nOps, CloudFix, and others suggest the whole market is
              trying

              to reduce the same fear: overcommitting spend or missing waste while usage changes too fast. For smaller
              buyers,

              simplicity and time saved may matter as much as the absolute savings rate. For larger buyers,
              auditability,

              governance, and scope breadth become more important than a single point estimate of headline savings.
            claimRefs:
              - CM018
              - CM019
              - CM020
              - CM021
              - CM022
              - CM023
              - CM024
              - CM025
              - CM026
