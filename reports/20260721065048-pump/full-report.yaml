  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape Segmentation and Who Really Competes With Pump
        blocks:
          - type: paragraph
            body: >-
              The public competitive set around Pump is wider than a simple “cloud cost tool” list. One cluster is
              direct

              commitment-automation vendors such as ProsperOps, nOps, and CloudFix, each of which sells automated
              savings or

              commitment management on AWS and in some cases Azure and GCP. A second cluster is visibility-first or
              ITAM-style

              suites such as CloudHealth and CloudCheckr, which emphasize spend transparency, governance, and reporting
              across

              larger environments. A third cluster consists of Kubernetes-native optimization platforms such as Cast AI
              and

              Zesty, where the core promise is workload-level automation and resource rightsizing rather than pooled
              billing.

              A fourth cluster is finance-led governance software, exemplified by Ternary, which treats cloud as one
              part of a

              broader technology-investment ledger.


              Pump competes differently against each cluster. Against commitment specialists, it must show better net
              savings,

              lower perceived lock-in, or a better SMB motion. Against visibility suites, it must show faster ROI and a

              simpler onboarding motion. Against Kubernetes optimizers, it risks looking too financial-layer-centric for
              teams

              that want direct workload tuning. Against finance-led platforms, it may look tactically strong but
              strategically

              narrow unless Pump View and adjacent products become deep enough to serve CFO and controller workflows.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
