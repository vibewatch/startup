  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Public Valuation Marks Exist, but the Evidence Base Is Thin and Conflicted
        blocks:
          - type: paragraph
            body: >-
              The public discussion around Pump’s valuation is dominated by third-party data aggregators rather than a
              clean primary financing announcement. GetLatka presents Pump as a quietly emerging unicorn and associates
              the company with a roughly $1.5B valuation. Sacra and Tracxn provide related company snapshots, but their
              funding, revenue, and employee figures do not line up cleanly with each other. That means the central
              problem is not a lack of numbers; it is that the numbers do not form a stable valuation picture on their
              own.

              This matters because a $1.5B mark can be reasonable only under fairly strong assumptions: unusually
              efficient growth, attractive monetization despite free-to-customer messaging, very strong gross-margin
              durability, and confidence that the product’s billing-layer positioning creates real stickiness rather
              than temporary novelty. None of those assumptions is disproven by the public record, but neither are they
              proven. As a result, the headline mark should be treated as a directional reference point, not as a
              cleared fair-value conclusion.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
