  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: wide
    summary: IC-style scorecard balancing category strength against valuation uncertainty.
    data:
      items:
        - label: Market opportunity
          value: 8 / 10
          detail: Cloud spend pain and FinOps demand are clearly real.
          tone: positive
        - label: Customer proof
          value: 7 / 10
          detail: Named case studies are better than average for a young startup.
          tone: positive
        - label: Moat / differentiation
          value: 6 / 10
          detail: Pooling model is distinctive but tied to trust and provider rules.
          tone: neutral
        - label: Economic transparency
          value: 3 / 10
          detail: Revenue quality and take economics are not publicly proven.
