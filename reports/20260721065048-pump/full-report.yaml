  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition in Customer Workflow Terms
        blocks:
          - type: paragraph
            body: >-
              In workflow terms, Pump starts with a customer connecting cloud-billing context rather than shipping code
              or

              redesigning infrastructure. The homepage and product pages repeatedly describe a lightweight onboarding
              motion in

              which a team grants read-only or limited permissions, reviews savings estimates, and then enables
              autopilot or

              reporting features. That product definition is important because it explains the company’s speed-to-value
              claim:

              customers are not buying a professional-services-heavy migration project, they are buying a
              cloud-operations layer

              that sits close to billing, recommendations, and monitoring.


              The product family now has three clearly commercialized modules. Pump Save handles discount strategy and

              commitment automation. Pump View normalizes and visualizes spend across AWS, GCP, Azure, and adjacent
              tools.

              Pump Secure scans for cloud posture or compliance issues and provides remediation guidance. Official
              marketing also

              teases Pump Intelligence / AI SRE capabilities, but both the homepage and third-party review sources make
              clear

              that this is still partly roadmap rather than a fully mature fourth pillar. That distinction matters for
              diligence

              because the current product is already multi-surface, but the full “intelligent cloud platform” story
              remains

              somewhat ahead of what is most strongly evidenced in current case studies.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
