            claimRefs:
              - CV001
              - CV019
              - CV020
              - CV021
              - CV022
      - number: '8.4'
        title: 'Recommendation: Treat the Company as Interesting, but the Public Valuation as Rich'
        blocks:
          - type: paragraph
            body: >-
              The investment conclusion from public evidence is not a hard rejection of the business. Pump appears to
              have a compelling message, named customers, strong category relevance, and at least one widely circulated
              high mark. But valuation is where the standard of proof rises. A company can be promising and still be too
              difficult to price confidently. That is the current position here.

              The right recommendation is therefore conditional. Continue diligence only if management can provide
              direct evidence on realized revenue, gross margin structure, concentration, retention, and offboarding
              quality. If those data are strong, the valuation debate becomes one of pace and upside. If those data are
              weak or evasive, the public record suggests the current mark is ahead of proof and should be treated as an
              underwriting risk in its own right. That means price discipline matters as much as product excitement in
              the final investment call.
            claimRefs:
