      - number: '6.4'
        title: Retention, Expansion, and Concentration Risk
        blocks:
          - type: paragraph
            body: >-
              Public expansion logic is visible even though retention metrics are not. Several case studies start with
              Savings and then add View or Secure, implying cross-sell potential. Beehiiv references View as a finance-
              facing spend monitor. Tellonym points toward future rightsizing features. ICANotes combines Save, View,
              and Secure. Terra and Finsera cite Secure as an incremental value layer on top of savings. This pattern
              supports a plausible land-and-expand motion, especially for lean teams that prefer one vendor for multiple
              cloud- operations jobs.

              The risk is that concentration and churn remain opaque. No reviewed public source provides NRR, GRR,
              renewal rates, contract length, or top-customer exposure. The product’s billing-layer role may raise both
              stickiness and offboarding concern: archived G2 feedback includes a sharp complaint about difficulty
              leaving the billing organization, while more positive reviews still mention the need to validate some
              recommendations. Pump’s customer quality therefore appears strong enough to matter, but not disclosed well
              enough to quantify durability from public evidence alone.
            claimRefs:
