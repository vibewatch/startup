      - number: '4.4'
        title: Capital Adequacy, Funding Dependency, and Financial Disclosure Limits
        blocks:
          - type: paragraph
            body: >-
              Capital structure is the biggest public blind spot in Pump’s financial diligence file. GetLatka reports a
              $4M

              seed round at a $1.5B valuation in 2023. Sacra and Tracxn instead point to roughly $1.72M of disclosed
              funding,

              with Y Combinator and Leonis Investment named as investors and a later 2024 seed reference in Tracxn. The
              filing

              record confirms the legal entity but provides no financing detail. No reviewed public source discloses
              cash on

              hand, burn, runway, debt facilities, provider working-capital obligations, or whether the pooled-billing
              model

              creates any balance-sheet or credit exposure that is economically similar to financing risk.


              This matters because a billing intermediary can scale revenue quickly while also carrying operational and
              working-

              capital complexity that a normal SaaS dashboard company would not. Even if Pump is primarily pass-through
              on the

              cost of cloud purchases, timing differences, customer-credit terms, provider settlement mechanics, and any

              incentives tied to aggregate commitments can all affect risk. Public evidence is sufficient to conclude
              that the

              company has real commercial traction; it is not sufficient to conclude that the financial model is
              capital-light,

              durable, or resilient under provider-policy changes. Those conclusions require primary statements and
              contracts.
            claimRefs:
              - CI029
