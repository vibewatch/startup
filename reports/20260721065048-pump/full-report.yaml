  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation by Buyer, Use Case, and Workload Pattern
        blocks:
          - type: paragraph
            body: >-
              Pump’s public customer set clusters around venture-backed or growth-stage software companies whose cloud
              bill is material but whose infrastructure team is still lean. The official customer page and individual
              stories span newsletter infrastructure (Beehiiv), anonymous consumer messaging (Tellonym), retirement
              fintech (ForUsAll), payments and business finance (Zil Money, Paynt), behavioral-health software
              (ICANotes), sales and martech tools (Salesforge, UserGems), deepfake or AI-related infrastructure (Reality
              Defender, Daemo, Olio Labs), and space or imaging workloads (HEO Space, GeoServes). Across these examples,
              the common pattern is not one industry but one operating shape: technically important cloud spend with
              limited appetite to staff a heavy internal FinOps motion.

              The buyer, user, and payer often compress into a small group. In some references the user is a solo DevOps
              owner, in others a security lead or IT manager, and in still others a founder or CTO. The payer is the
              company, but the budget owner may be engineering, finance, or a mixed operator. This makes Pump’s “free +
              fast” positioning credible for the segment: the company is selling time saved, fewer billing surprises,
              and easier reporting to teams where one person often spans multiple roles.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
