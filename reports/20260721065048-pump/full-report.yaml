      - number: '5.2'
        title: 'Automation Engine: Commitment Management, Rate Optimization, and Data Inputs'
        blocks:
          - type: paragraph
            body: >-
              The technical heart of Pump is the commitment-management engine described across Pump Save, Sacra, and
              AWS-linked

              product content. AWS discount programs reward longer commitments, but the operational problem is choosing
              the

              right coverage, duration, and service mix while usage changes. Pump’s public explanation is that it
              ingests usage

              and billing history, models options, and then buys or rotates discount instruments automatically once the
              customer

              enables autopilot. Pump’s own blogs on Savings Plans, rate versus usage optimization, and rightsizing show
              that

              the company is trying to educate customers on both commitment selection and the difference between billing

              optimization and workload optimization.


              The mechanism is productively narrow. Pump is not claiming it invented Savings Plans or RIs; AWS
              documentation

              still defines the underlying discount primitives. What Pump adds is orchestration: compare plan options,
              estimate

              savings, continuously manage coverage, and do so in a way that a single DevOps operator or lean
              engineering team

              can trust. Customer stories like Beehiiv and Tellonym support that interpretation because they emphasize
              time

              saved, autopilot behavior, and reduced need for manual plan-renewal work. The main technical question is
              therefore

              not whether the engine exists, but how much better it performs than native recommendations under real
              volatility.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
              - CE015
