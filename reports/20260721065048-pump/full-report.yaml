  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and the Status-Quo Substitute
        blocks:
          - type: paragraph
            body: >-
              Pump operates inside the broader FinOps / cloud financial management market, but its sharpest initial
              wedge is

              narrower: automated optimization of cloud-commitment purchasing and adjacent visibility for startup and
              SMB

              buyers using AWS first, then GCP and Azure. The included spend is the recurring infrastructure bill
              associated

              with compute, databases, storage, networking, and related platform services where providers offer material

              discounts in exchange for longer commitments or more disciplined purchasing. Pump’s own materials
              emphasize

              Savings Plans, Reserved Instances, anomaly detection, forecasting, and reporting rather than workload
              redesign.


              The status-quo substitute is not “do nothing” in the abstract; it is a mix of native provider tools,

              spreadsheet analysis, and infrequent manual commitment purchases by engineers or finance operators who
              have many

              other jobs. AWS itself highlights Savings Plans recommendations, RI mechanics, and cloud financial
              management

              best practices, while FinOps Foundation and Flexera evidence shows most organizations already know
              optimization

              matters. The real gap is execution under uncertainty: buyers fear lock-in, lack bandwidth to model demand,

              and often do not have a finance-owned system of record for cloud usage. That gap is why the category
              supports

              both dashboard-led management vendors and automation-led optimization vendors.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
