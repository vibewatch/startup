chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Product Boundary, and Commercial Model
        blocks:
          - type: paragraph
            body: |-
              Pump describes itself as "The Intelligent Cloud Platform" and presents a simple proposition: customers
              connect cloud billing data, Pump aggregates demand across many customers, then Pump automates the
              purchase and rotation of discount instruments such as Savings Plans and Reserved Instances. The official
              site says the platform covers AWS, GCP, and Azure, with four branded product surfaces — Pump Save,
              Pump View, Pump Secure, and an intelligence / incident-response layer that is still partly roadmap-led.
              The company consistently markets the service as free to customers, arguing that cloud providers or the
              economics of pooled billing allow Pump to monetize without charging a direct platform fee.

              The product boundary matters because Pump is not presented as an infrastructure re-architecture vendor.
              Its own YC and testimonial pages repeatedly frame Pump as a billing-layer intermediary that leaves the
              customer in operational control while changing how commitments are bought and monitored. That reduces
              implementation friction for startups and lean DevOps teams, but it also means trust in billing control,
              offboarding mechanics, and recommendation quality becomes central to diligence. Official materials and
              third-party reviews support the same broad positioning even when they differ on scale metrics.
