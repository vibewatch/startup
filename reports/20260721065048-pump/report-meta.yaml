subtitle: >-
  Early-stage cloud-cost-optimization company with strong category relevance and unusually concrete
  customer anecdotes, but thin public evidence on durable economics and a reported valuation that
  appears ahead of independently corroborated proof.
coverageNotes: >-
  This report was produced on 2026-07-21 using publicly available sources only. Pump is a private
  company. Public materials support a 2022 founding, San Francisco operating footprint, official
  references to Pump Billing, Inc. / Counter Inc., a free-to-customer positioning model, average
  customer savings around 30%, more than $1.06B of cloud spend managed, and real customer case
  studies. Public valuation and financial data remain conflicted: GetLatka associates the company
  with roughly $15.2M ARR and a $1.5B valuation narrative, while other profile sources do not fully
  reconcile on funding, revenue, or employee scale. Public sources do not provide audited financials,
  gross margin, NRR/GRR, customer concentration, or exact round terms.
