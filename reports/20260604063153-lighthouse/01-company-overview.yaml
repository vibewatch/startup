  body: "Public funding history is clear, but board composition, control rights after KKR, audited ARR, margin structure, and exact current headcount are not. That leaves a meaningful diligence delta between the company’s late-stage capital profile and the information package available to outsiders.\n        "
  claimRefs:
  - CO016
  - CO022
  - CO023
  - CO041
  - CO047
- calloutType: risk
  title: The platform may be strongest for sophisticated revenue teams
  body: "An independent 2026 review argues Lighthouse can be overbuilt for properties with simple seasonal pricing and can require specialized revenue-management expertise plus long implementation cycles for complex portfolios. That is not a thesis-breaker, but it means growth in the independent segment depends on packaging and onboarding discipline, not just product breadth.\n        "
  claimRefs:
  - CO042
  - CO043
  - CO046
