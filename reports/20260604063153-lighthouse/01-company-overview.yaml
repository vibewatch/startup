- id: founders-leadership-governance
  title: Founders, leadership, and governance signals
  body: "The founder story is comparatively well supported for a private company of this size. Focus on Belgium and TNW both identify Gino Engels, Matthias Geeroms, and Adriaan Coppens as the three founders who started OTA Insight in Ghent in 2012. Current official leadership materials no longer spotlight all three equally, however: Matthias Geeroms still appears publicly as co-founder and Head of Corporate Development, while the company’s outward narrative is now dominated by CEO Sean Fitzpatrick. That evolution is normal for a later-stage scale-up, but it also means that public founder visibility has narrowed and that diligence on remaining founder ownership, board influence, and day-to-day operating authority will require private materials rather than website reading.\n\nSean Fitzpatrick is clearly the central executive figure. PhocusWire says he became CEO in mid-2018 after HotSchedules, and he is the named speaker across the 2023 rebrand, the 2024 KKR financing, the 2025 Hotels Network\
    \ acquisition, and the 2026 ChatGPT and Hotelrank.ai launches. That pattern makes him more than just the formal CEO: he is the company’s primary capital-markets narrator and the most visible architect of its post-OTA Insight strategy. The key-person implication is straightforward. Investors are not just underwriting a data platform; they are underwriting Fitzpatrick’s ability to keep integrating acquired teams, reposition the product stack, and explain the next phase of AI-driven growth credibly to both customers and backers.\n\nGovernance disclosure is thinner than leadership disclosure. The 2021 Series B press release clearly names Steve LeSieur of Spectrum Equity as a board joiner and identifies the then-investor set, but public materials after KKR do not enumerate the full current board or control-rights structure. What is public is that Lighthouse’s financing profile has moved from early-stage venture to later-stage growth equity/private equity. That maturation is a positive signal\
    \ on capital access, but it leaves open questions on board composition, investor vetoes, and founder dilution that matter for a private-company diligence file.\n        "
