- id: capital-scale-disclosure
  title: Capital formation, scale metrics, and disclosure quality
  body: "Lighthouse’s public financing history is unusually legible for a private hospitality-software company, though it is still not fully complete. The 2021 Series B is straightforward: OTA Insight raised $80 million from Spectrum Equity, public materials described total funding to date as $100 million, and Steve LeSieur joined the board. The 2024 KKR transaction is similarly well documented on size and purpose, with KKR and secondary coverage landing around a $370 million growth/Series C round used to fund product innovation, acquisitions, and global expansion. When those two anchors are combined, the most defensible public “total raised” figure is roughly $470 million. That is good enough for a chapter-one snapshot, but it should still be described as an estimate because not every earlier pre-Series-B cheque is broken out in current sources.\n\nScale disclosures are both impressive and imperfect. Official and semi-official sources support 70,000-plus hospitality providers/properties\
    \ around the KKR round and 80,000-plus hotels by 2026, 185-country reach, 700-plus employees, and more than 400 terabytes of raw travel data processed daily. The homepage adds 1.7 billion hotel rates collected daily and 300,000-plus competitor hotels profiled. These are meaningful moats for a commercial-intelligence platform because they imply data breadth, customer density, and brand distribution. But the same evidence base also shows disclosure drift: some 2026 pages still say 70,000-plus hoteliers, while a Google Cloud case study uses an even higher 900-plus employee figure. The right analytical move is to keep the newest company-owned figures for the headline view while acknowledging that public pages are not perfectly synchronized.\n\nRevenue disclosure is materially weaker than funding disclosure. Sean Fitzpatrick told PhocusWire Lighthouse was already well north of $100 million in revenue by 2025, which is useful directional evidence that the business is no longer subscale. Still,\
    \ there is no audited ARR, no public margin profile, no net retention figure, and no formal financial statement package. That means chapter one can legitimately call Lighthouse a private, later-stage, unicorn-scale company with meaningful revenue, but not a fully transparent software issuer.\n        "
