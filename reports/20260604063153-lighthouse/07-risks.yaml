  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-transparency
    missingEvidence: Audited revenue, ARR, gross margin, burn, runway, cash balance, and acquisition-integration cost disclosures.
    whyItMatters: Without core software-economics disclosure, investors cannot distinguish healthy growth-plus-M&A from capital-intensive expansion masked by fundraising.
    diligencePath: Request audited 2024-2026 financials, board reporting packs, monthly cash-burn bridge, and post-acquisition integration budgets.
    relatedQuestionRefs:
    - QR004
    - QR029
    relatedTableRefs:
    - TR004
  - type: missing-source
    severity: material
    topic: security-transparency
    missingEvidence: Publicly downloadable SOC 2 or ISO certificates, penetration-test summaries, direct incident postmortems, and detailed control mappings.
    whyItMatters: Lighthouse handles sensitive commercial and user data and its trust surface is visible, but the fetched public artifacts do not prove control maturity at audit depth.
    diligencePath: Obtain trust-center access, certification reports, latest pen-test executive summary, and the vendor incident-review pack for the 2026 outage.
    relatedQuestionRefs:
    - QR027
    - QR028
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: retention-and-concentration
    missingEvidence: Customer concentration, renewal, logo churn, NRR/GRR, and cohort retention segmented by product and customer size.
    whyItMatters: The platform is clearly large, but without concentration and retention metrics it is hard to tell whether product sprawl and acquisitions are deepening or diluting durability.
    diligencePath: Request cohort tables, top-20 customer revenue concentration, product attach rates, churn reasons, and pre/post-acquisition retention bridges.
    relatedQuestionRefs:
    - QR030
    relatedTableRefs:
    - TR005
  - type: missing-source
    severity: minor
    topic: regulatory-legal-register-coverage
    missingEvidence: A counsel-led exhaustive docket and enforcement search covering competition, privacy, and contract disputes across Lighthouse and acquired entities.
    whyItMatters: The regulatory/legal table is intentionally partial; without a broader docket sweep, latent disputes or investigations could remain hidden.
    diligencePath: Run external counsel searches across U.K., EU, U.S., Spain, and Belgium dockets plus regulator complaint databases, then reconcile results to TR001.
    relatedQuestionRefs:
    - QR005
    - QR009
    - QR010
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: minor
    topic: integration-governance
    missingEvidence: Post-close integration scorecards for Stardekk and The Hotels Network plus a live dependency map for PMS, OTA, cloud, and data-feed partners.
    whyItMatters: The visible strategy depends on combining multiple products and external data paths; without integration scorecards, management claims about platform synergies remain directional.
    diligencePath: Request PMO milestone tracking, partner SLA scorecards, data-feed failover documentation, and cross-sell attach-rate evidence for acquired products.
    relatedQuestionRefs:
    - QR016
    - QR022
    relatedTableRefs:
    - TR003
    - TR004
