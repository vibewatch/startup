- id: people-execution-and-financial-model-risk
  title: 'People, execution, and financial-model risk: visible capability, invisible economics'
  body: |-
    People risk at Lighthouse is less about missing leadership names than about execution bandwidth. The company publishes a real bench across finance, legal, security, people, product, and go-to-market roles, and it operates from multiple hubs across Europe, North America, South America, and APAC. That is a meaningful mitigant because it suggests the organization is no longer founder-only. But a global team across 40-plus countries, layered on top of post-Series-C expansion and multiple acquisitions, also raises the coordination burden. The operating question is whether the company can absorb new products, partners, and controls without slowing delivery quality or fragmenting accountability.

    Financial-model risk is harder to bound because the public record is directionally strong but economically thin. Two large equity rounds and a marquee investor are positives, and the KKR press makes clear that the expansion plan is intentionally acquisitive and global. What the public materials do not show is the counterweight: ARR, burn, gross margin, runway, customer concentration, renewal durability, or the cost of integrating acquisitions into a unified stack. Review marketplaces compound that uncertainty because Lighthouse often prices by request and independent commentary suggests complex deployments can take months. That does not prove a weak model; it means investors are still underwriting a capital-supported growth and integration strategy without the public unit-economics evidence needed to treat it as a fully de-risked software compounder.
