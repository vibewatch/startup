- id: regulatory-legal-privacy-and-data-rights
  title: 'Regulatory, legal, privacy, and data-rights risk: a real perimeter with some stale edges'
  body: |-
    The legal surface here is broader than a normal point solution. Lighthouse’s 2026 privacy policy identifies a UK controller, discloses collection of identity, financial, technical, usage, and marketing data, and explicitly contemplates sharing with integrated third parties and transfers outside the UK, EEA, and Switzerland using mechanisms such as adequacy decisions, SCCs, and binding corporate rules. The 2026 terms also frame the product as a cloud platform for pricing, distribution, and marketing decisions, prohibit unlicensed automated extraction, reserve sanctions-based suspension rights, and allow product end-of-life on 30 days’ notice. Those clauses are defensible, but from an investor lens they also show how much legal, platform, and customer-rights burden sits in the contract layer.

    The sharper risk comes from category context. The FTC and DOJ have already told a court that hotels cannot use an algorithm to do what would be illegal if done by a person, while MIT Sloan and Wilson Sonsini both treat hotel algorithmic pricing as a live antitrust design problem rather than a hypothetical. Lighthouse has not been named in those materials, and Wilson Sonsini’s 2025 analysis is an important mitigant because it says simple independent subscription alone was not enough for the Ninth Circuit case at issue. Even so, Lighthouse’s own product story depends on pricing intelligence, market data, and shared industry workflows, so the legal burden is to prove disciplined use of public versus private data and clear customer guardrails. Governance hygiene is not perfect either: the anti-bribery policy still uses legacy Social Significance/OTA Insight naming, and the slavery statement relies on supplier self-audit without written certifications, which together read as manageable but real documentation-control risk.
