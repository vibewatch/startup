- id: TR001
  title: Regulatory / legal risk register
  columns:
  - Rule / case / control surface
  - Jurisdiction
  - Status
  - Likelihood
  - Severity
  - Mitigation
  - Residual exposure
  - Diligence path
  rows:
  - - Algorithmic pricing antitrust scrutiny
    - U.S. and other competition regimes
    - FTC/DOJ have intervened in hotel algorithmic pricing litigation; MIT Sloan and Wilson Sonsini treat the risk as live design risk, not theory.
    - Medium-high
    - Critical
    - Lighthouse can lean on decentralized-design guardrails and the Ninth Circuit view that mere independent subscription is not enough on its own.
    - High
    - Obtain outside-counsel memo on data inputs, recommendation logic, customer controls, and any regulator or plaintiff contact history.
  - - Privacy, data sharing, and cross-border transfer obligations
    - UK / EEA / Switzerland plus global transfers
    - The privacy policy discloses controller status, broad data categories, integrated third-party sharing, and international transfers using adequacy, SCCs, or BCRs.
    - Medium
    - High
    - Updated policies and consent language provide baseline governance.
    - Medium-high
    - Review DPAs, subprocessor list, transfer-impact assessments, and product-specific privacy notices for acquired or partner-connected modules.
  - - Customer data rights and extraction restrictions
    - Contract / IP / platform-use terms
    - Terms prohibit automated extraction and place license/consent obligations on customers.
    - Medium
    - High
    - Restrictions can protect IP and misuse.
    - Medium-high
    - Review enterprise contract redlines, data-export features, API terms, and disputes over access, portability, or scraping.
  - - Sanctions and legal-compliance suspension rights
    - Global sanctions regimes
    - Terms allow immediate termination or suspension for sanctions-related exposure.
    - Low-medium
    - High
    - Strong contractual right to act quickly.
    - Medium
    - Check sanctions-screening operations, false-positive handling, and whether customers in higher-risk geographies create commercial friction.
  - - Governance-document hygiene
    - Corporate compliance surface
    - Public anti-bribery materials still use Social Significance / OTA Insight naming after the 2023 rebrand.
    - Medium
    - Medium
    - Core policies exist and legal documents are published.
    - Medium
    - Request policy inventory, update cadence, approval history, and evidence that acquired entities are folded into the latest control set.
  - - Multi-entity acquisition and subsidiary perimeter
    - UK / Spain / Belgium and other local regimes
    - Name changes, Stardekk, and The Hotels Network add entity and integration complexity to a formerly simpler corporate stack.
    - Medium
    - High
    - Legal documents and acquisition declarations are publicly available.
    - Medium-high
    - Request current org chart, subsidiary matrix, intercompany data-flow map, and post-close compliance integration plan.
  notes: Severity ranking reflects investor downside if the risk crystallizes, not a claim that enforcement or breach has already occurred.
