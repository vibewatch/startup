- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Algorithmic-pricing / antitrust
    - Counsel and product-control evidence
    - Management cannot prove use of public/nonpublic data boundaries, recommended-price guardrails, and complaint-free operating history.
    - Treat legal risk as structural, not theoretical, and require remediation before underwriting premium-multiple growth.
  - - Privacy and data governance
    - Audit-ready privacy stack
    - Missing DPA package, subprocessor list, transfer assessments, or evidence that acquired products follow the same controls.
    - Assume privacy exposure is rising faster than governance maturity and haircut enterprise readiness.
  - - Platform reliability and data quality
    - Incident and feed-quality trend
    - Repeated outages, unresolved postmortems, or persistent customer complaints about stale or inaccurate data over the next refresh cycle.
    - Reclassify scale from moat to fragility and tighten downside assumptions on retention and upsell.
  - - Integration and partner dependency
    - Post-close synergy and partner health
    - No measurable attach-rate, direct-booking, or distribution benefit from Stardekk/THN while partner dependencies keep expanding.
    - Treat M&A as complexity accretion rather than product leverage.
  - - Financial-model opacity
    - Private operating metrics
    - Management still cannot provide audited ARR, gross margin, burn, runway, and integration-cost evidence.
    - Do not underwrite cash-efficient compounding; value the business as a growth platform with unresolved economics.
  - - Durability and concentration
    - Retention and concentration disclosure
    - No cohort retention, renewal, or top-customer concentration data by the next diligence cycle.
    - Keep risk rating elevated and avoid treating customer scale alone as proof of durable revenue quality.
  notes: Each kill criterion is deliberately tied to a document, metric, or event that can be checked in diligence rather than a generic strategic worry.
