  evidenceGaps:
  - type: missing-source
    severity: material
    topic: security-attestations
    missingEvidence: Public SOC 2, ISO 27001, penetration-test, and subprocessor detail for the integrated Lighthouse platform and newly acquired modules.
    whyItMatters: Enterprise buyers will need more than a trust-center endpoint and privacy policy to clear vendor-risk review for pricing, payment, and direct-booking workflows.
    diligencePath: Request the current security pack, certification letters, subprocessor list, and any feature-level privacy notices for Direct, Channel Management, and Revenue Agent.
    relatedQuestionRefs:
    - QE022
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: sla-and-availability
    missingEvidence: A public SLA, incident-history archive, or documented self-hosted/private-cloud deployment option.
    whyItMatters: Distribution, parity, and pricing workflows become operationally critical once hotels rely on Lighthouse for live commercial execution across channels.
    diligencePath: Ask for contractual uptime commitments, recent incident history, recovery objectives, and deployment/topology options during commercial and security diligence.
    relatedQuestionRefs:
    - QE026
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: minor
    topic: module-adoption
    missingEvidence: Customer penetration, usage, renewal, and ROI data for Revenue Agent, Channel Management, and Direct after the relevant acquisitions and launches.
    whyItMatters: The breadth story is compelling, but investors still need to know whether customers adopt the expanded suite or continue buying Lighthouse as a narrower pricing/insight tool.
    diligencePath: Request cohort adoption data by module, attach rates after acquisitions, and customer references using Revenue Agent plus at least one acquired module in production.
    relatedQuestionRefs:
    - QE027
    relatedTableRefs:
    - TE005
  - type: access-blocked
    severity: minor
    topic: independent-review-depth
    missingEvidence: Richer accessible third-party user-review content from major review platforms that were bot-protected during this run.
    whyItMatters: Current adverse evidence is thin and low quality, so implementation-risk conclusions still lean more on docs and architecture inference than on broad user-review evidence.
    diligencePath: Review Gartner Peer Insights, G2, HotelTechReport, or direct customer references in a browser session that can pass review-site bot challenges.
    relatedQuestionRefs:
    - QE023
