- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Technical risk
  rows:
  - - External market-data ingestion
    - Collects hotel rates, short-term rental rates, searches, and market signals at scale
    - Continuous scraping, partner feeds, and data normalization across markets and channels
    - Coverage breadth is a moat, but data-quality issues or channel/API changes can propagate into downstream recommendations
  - - Hotel operating-data layer
    - Pulls PMS, reservation, pace, pickup, and on-the-books data into the platform
    - Correct PMS integration, mapping, and hotel-side data hygiene
    - Bad mappings or stale hotel data can degrade forecast quality and automation outcomes
  - - Commercial intelligence layer
    - Transforms raw market and hotel data into compsets, anomalies, benchmarks, parity views, and demand signals
    - Shared ontology across pricing, performance, distribution, and direct products
    - Public materials do not disclose warehouse, feature-store, or model-governance architecture
  - - Recommendation and forecast layer
    - Produces pricing suggestions, Smart Insights, and forward-looking forecast support
    - Transparent signal explanations, human overrides, and property-specific rules
    - No public independent test of recommendation accuracy, drift monitoring, or long-run uplift
  - - Execution layer
    - Pushes prices, availability, promotions, parity actions, and direct-site experiences into live commercial channels
    - Channel connectors, PMS/CRS sync, OTA compliance, website personalization tags
    - Broader execution surface increases failure modes across partner connectors and channel-specific rules
  - - Developer and partner layer
    - Exposes APIs, sandboxes, docs, certification, and partner go-to-market motions
    - API tokens, rate limits, partner engineering capacity, and contract permissions
    - Public API is explicitly framed for reporting, not live commercial apps; some use cases may need private agreements
  - - Trust and admin layer
    - Handles privacy, access control, payment-card visibility, and public trust communication
    - 2FA/MFA setup, legal/privacy governance, and feature-specific privacy notices
    - Public trust documentation exists but attestation depth, incident history, and module-by-module subprocessor detail remain thin
  notes: Architecture is reconstructed from public product pages, API docs, help articles, and launch materials; Lighthouse does not publish a deep backend reference architecture.
  enumerationScope:
    coverage: partial
    basis: The table captures the visible operating layers required to explain how the product works commercially, but it does not claim to reveal every internal service, datastore, or model pipeline.
