- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow problem
  - Lighthouse solution
  - Measurable benefit / proof
  - Limitation
  rows:
  - - Set forward-looking room prices
    - Reactive rate shopping misses demand shifts and STR competition
    - Pricing blends forward-looking search signals, live rate shops, smart compsets, and AI recommendations
    - Marketing claims 365-day visibility and case-study time savings / ADR uplift
    - Public evidence does not independently validate recommendation quality across the installed base
  - - Explain portfolio performance fast
    - Teams waste hours merging PMS exports with benchmark data
    - Performance combines internal performance, competitive intelligence, Smart Insights, and forecast/budget workflows
    - Public page claims 60% reduction in common revenue-management task time
    - Underlying data-latency and warehouse architecture are not publicly documented
  - - Stop parity leakage and protect direct bookings
    - Manual spot-checks miss hidden OTA or member-only undercuts
    - Distribution continuously monitors, proves, and automates parity/compliance workflows
    - Public page claims seven of ten top global chains rely on Lighthouse distribution capabilities
    - No public success-rate data for takedowns, BRG automation, or connectivity-error remediation
  - - Push prices and availability to channels
    - Independent hotels juggle separate tools for pricing, promotion, and distribution
    - Channel Management synchronizes rates, LOS, promotions, and availability across 200+ channels
    - Launch page says solution connects 200+ OTAs and 50+ PMS systems; pricing page markets 10 hours saved daily
    - Operational quality depends on PMS mappings, OTA offsets, and partner integrations
  - - Personalize the direct website
    - Generic hotel websites leak high-intent traffic to intermediaries
    - Direct adds predictive personalization, price matching, social proof, and no-code campaign execution
    - Direct page cites 32% average increase in direct bookings from The Hotels Network technology
    - Public materials do not disclose model false-positive rates or uplift persistence by property type
  - - Run daily commercial ops with AI assistance
    - Commercial teams drown in data and miss anomalies until too late
    - Revenue Agent surfaces high-priority opportunities, recommended actions, and a 90-day forward monitoring window
    - Official launch says it scans 3B+ data points per day and is included for existing customers in Q1 2026
    - Public evidence still stops at company claims; production adoption and workflow reliability are not independently verified
  notes: Benefit cells mix company claims, partner corroboration, and low-confidence external review signals; they should not be treated as audited ROI metrics.
  enumerationScope:
    coverage: sample
    basis: The workflow rows focus on the recurring commercial jobs most clearly evidenced in product, help-center, launch, and partner materials rather than claiming to cover every possible Lighthouse use case.
