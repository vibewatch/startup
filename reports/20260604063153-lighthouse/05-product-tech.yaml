chapter:
  number: 5
  title: Product & Technology
  summary: Lighthouse has expanded from hospitality rate intelligence into a broader commercial operating system spanning pricing, performance, distribution, channel management, direct-booking personalization, data products, and a newly announced agent layer. Public evidence points to a real data and integration moat — billions of rates and searches, wide partner coverage, and acquisition-led product expansion — but also to material diligence gaps around public security attestations, SLA depth, and the operational complexity of making the whole stack work cleanly together.
sections:
- id: product-suite-and-workflow
  title: Product suite and commercial workflow
  body: |-
    Lighthouse now markets itself as a hotel commercial operating system rather than a single rate-shopping tool. The current public surface spans Pricing, Performance, Distribution, Channel Management, Direct, Data Solutions, and the newer Revenue Agent layer. That module mix matters because the customer workflow Lighthouse wants to own runs from market sensing to decisioning to execution: teams monitor forward-looking demand and live rates, compare internal pace against true competitors, push rates and availability into channels, police parity leakage, and then try to convert more traffic on their own websites. The stack is therefore broader than legacy hospitality BI or benchmarking vendors that stop at dashboards.

    The product story is also segmented by buyer. Groups and chains are pushed toward pricing, performance, distribution, and data products that help above-property commercial teams compare markets and portfolios. Independent hotels are pushed toward a more bundled operating surface combining pricing optimization, channel management, direct bookings, payments, reservation workflows, and AI review/booking assistance. Public pricing pages reinforce that Lighthouse is trying to collapse multiple daily tools into one operating rhythm rather than asking customers to stitch together separate rate shopping, benchmarking, parity, and personalization vendors.

    The acquisitions since 2024 explain why the suite now looks this broad. Stardekk added channel-management and distribution execution, HQ revenue added more commercial strategy depth, and The Hotels Network added direct-channel personalization and marketing AI. In practical workflow terms, Lighthouse now owns more of the loop between seeing market signals, choosing a price, pushing it to channels, protecting direct rate integrity, and personalizing the booking path.
