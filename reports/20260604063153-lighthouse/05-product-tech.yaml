- id: trust-privacy-and-technical-risks
  title: Trust, privacy, and technical risks
  body: |-
    Lighthouse has some meaningful public trust signals, but they are lighter than the depth a security-conscious enterprise buyer would ideally want before standardizing globally. The company has a public trust-center endpoint, publishes a detailed privacy policy, names a chief information security officer on the about page, and documents operational controls such as MFA/2FA requirements for viewing payment-card data in Channel Manager. The privacy policy also lays out controller identity, categories of personal data collected, legal bases for processing, international transfer mechanisms including adequacy decisions and SCCs, and breach-notification commitments when legally required. Those are real signals that privacy and security governance exist as formal operating functions.

    The gaps are just as important. The fetched public trust materials did not expose a clear public certification matrix or incident-history archive, and the review set did not surface a public SLA or a self-hosted/private-cloud deployment option. The API documentation is unusually candid that the API is intended for reporting rather than live commercial applications and that commercial visualization requires written consent. That is a helpful governance constraint, but it also signals that some customer ambitions will exceed what the public developer surface is designed to support.

    Technical risk therefore concentrates in integration quality, cross-module complexity, and verification depth. Lighthouse’s own setup docs show that pricing automation still depends on correct PMS mappings, OTA offsets, and minimum-price configuration. Weak external review evidence also points to learning-curve and implementation burden for teams without dedicated revenue-operations capability. The company’s AI positioning emphasizes transparency and human control, which is directionally good, but public materials still leave open questions on certification scope, subprocessor boundaries by acquired module, and how consistently the broader platform works when customers try to operationalize all of pricing, distribution, direct personalization, and agentic workflows together.
