    - label: Commercial intelligence layer
      detail: Smart compsets, benchmarks, parity proofs, demand signals, anomalies, and forecast support are computed from normalized external and internal inputs.
    - label: Workflow application layer
      detail: Pricing, Performance, Distribution, Channel Management, Direct, and Data Solutions package that intelligence for different hotel commercial teams.
