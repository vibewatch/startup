- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Current maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Pricing
    - Revenue managers, regional commercial teams
    - Current core product
    - Combines live rate shopping, forward-looking demand, smart compset, and explainable AI recommendations in one workflow
    - No public independent benchmark of recommendation accuracy or realized uplift across the full customer base
  - - Performance
    - Portfolio owners, GMs, commercial leaders
    - Current core product
    - Unifies internal PMS data with external market intelligence and AI Smart Insights rather than leaving BI and benchmarking in separate tools
    - No public technical note on data-latency guarantees or warehouse architecture
  - - Distribution
    - E-commerce and distribution teams
    - Current core product
    - Moves beyond monitoring into proof-backed parity enforcement, IP Protect, BRG automation, and connectivity monitoring
    - Public materials do not quantify resolution rates, false positives, or takedown success by channel
  - - Channel Management
    - Independent hotels and lean commercial teams
    - Launch-integrated product since 2024
    - Combines pricing, promotions, availability, and 200+ channels in one operating surface for independents
    - Requires correct PMS/channel mapping and partner maintenance; enterprise penetration is not disclosed
  - - Direct
    - Digital marketing and e-commerce teams
    - Launch-integrated product since 2025 acquisition
    - Adds predictive personalization, no-code campaigns, price comparison, A/B testing, and no-cookie targeting for direct bookings
    - No public disclosure on how deeply The Hotels Network functionality is integrated into the broader Lighthouse UI
  - - Data Solutions
    - OTAs, investors, chains, tech partners, DMOs
    - Current data product line
    - Commercial data can be sold or embedded as a separate product rather than only consumed through Lighthouse apps
    - No public schema, SLA, or sample contract terms for data buyers
  - - Revenue Agent
    - Commercial teams across pricing, distribution, marketing, and performance
    - Newly announced in 2026
    - Turns the same commercial intelligence layer into always-on anomaly detection and recommended actions under guardrails
    - No public adoption metrics or independent validation of autonomous performance yet
  notes: Rows reflect public product surfaces and launch materials reviewed on 2026-06-04; maturity is verified only to the extent public pages and launch posts state it.
