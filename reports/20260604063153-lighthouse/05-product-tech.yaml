- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / signal
  - Status
  - Scope
  - Gap / risk
  rows:
  - - Public trust center
    - Present
    - Public endpoint at trust.mylighthouse.com
    - Fetched public text exposed little certification or incident detail, so it is a trust signal but not a substitute for attestation review
  - - Privacy policy
    - Present and detailed
    - Controller identity, data categories, legal bases, transfers, rights, breach handling
    - Policy is company-authored and does not replace a product-by-product data-flow or subprocessor review
  - - Named security leadership
    - Present
    - About page names a chief information security officer
    - Leadership presence is positive but is not itself evidence of any specific certification or control effectiveness
  - - PCI / MFA control for Channel Manager
    - Documented
    - 2FA required to view card data, with time-limited visibility windows
    - Only one specific workflow is documented publicly; broader access-control architecture is not detailed
  - - API auth and usage guardrails
    - Documented
    - API tokens, 24-hour and per-minute rate limits, reporting-only terms
    - Helpful governance, but also a constraint for customers wanting production execution or commercial visualization
  - - AI transparency posture
    - Documented by company claims
    - Product pages repeatedly promise explainability, transparency, and human control
    - No public third-party audit of model quality, safety testing, or agent performance
  notes: This table intentionally separates public trust signals from independently verified certifications; missing public attestation detail should be treated as a diligence gap, not as an implied pass.
  enumerationScope:
    coverage: partial
    basis: Only trust and compliance controls that were publicly visible in fetched sources are listed; private security questionnaires, NDAs, or sales-room documents were not available in this chapter workflow.
