- id: data-architecture-and-ai
  title: Data ingestion, forecasting architecture, and AI layer
  body: |-
    Public materials describe Lighthouse as a data-heavy platform whose defensibility starts with ingestion scale. The company says it processes 1.7 billion hotel rates per day, 1.2 billion flight and hotel searches per day, profiles 16.4 million hotels and short-term rentals daily, and processes 400TB of raw data every day. The important architectural point is not only raw scale, but the combination of external market signals with hotel-side operational data. Pricing and forecasting content repeatedly describes the workflow as blending real-time rate shops, forward-looking travel-intent signals, comp-set behavior, and internal PMS or on-the-books data. Performance then presents that same blended dataset through Smart Insights, Smart Compset, budget/forecast workflows, and portfolio dashboards.

    That suggests a layered architecture with three visible pieces. First is the commercial-intelligence layer that aggregates external rate, demand, and distribution signals. Second is the hotel-operating-data layer that consumes PMS, channel-manager, and reservation context. Third is a decision layer that packages those inputs into pricing recommendations, anomalies, forecast views, parity enforcement workflows, and direct-channel actions. Lighthouse does not publish a deep backend systems white paper, but the API docs and help content make the operating model concrete enough to infer that data normalization and configuration quality are central dependencies.

    AI and forecasting are marketed as decision support with increasingly agentic execution. Pricing and Performance both stress transparent recommendations rather than black-box outputs. Revenue Agent goes one step further by promising 24/7 scanning of more than 3 billion data points per day across a 90-day forward window, with hotels still setting objectives and guardrails. The architecture therefore appears to be moving from dashboard-centric analytics toward a shared commercial intelligence layer that can power multiple workflow-specific applications and, over time, multiple coordinated agents.
