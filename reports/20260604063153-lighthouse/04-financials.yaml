- id: capital-adequacy-and-financing-dependency
  title: Capital adequacy, PE backing, and acquisition-financed expansion
  body: |-
    The capital story is stronger than the operating disclosure. Lighthouse announced an approximately $370 million KKR-led Series C in November 2024 after an $80 million Series B in 2021, and the official use-of-funds language is consistent across Lighthouse, KKR, and Business Wire: expand AI and data capabilities, keep acquiring assets, and grow globally. That gives Lighthouse substantial headline financing and, just as importantly, a sponsor with private-equity style pattern recognition and portfolio support. The ownership picture at the UK entity level also looks institutional rather than founder-controlled: Companies House shows HCI/TCP OTA Holding Ltd holding more than 75 percent of shares and votes and retaining director-appointment rights.

    However, the post-round record also shows financing dependency rather than total self-funding. In April 2025 the UK entity filed a one-share allotment with £7.43 million paid in cash and created secured charges in favor of BSP Agency, LLC on the same date. Those filings prove fresh capital and security arrangements reached the operating perimeter after the marquee fundraise, but they do not disclose unrestricted group cash, debt-service requirements, or runway. At the same time, Lighthouse continues to use M&A as a growth lever. HQ revenue broadened the platform in 2024; The Hotels Network added direct-booking and personalization capability in 2025; Tracxn and TechCrunch reference further acquired assets such as Stardekk and earlier integrations like Transparent and Kriya RevGen. That combination of PE backing, continuing legal-entity financing activity, and acquisition-led expansion says Lighthouse is not obviously capital constrained, but it also says capital remains strategically important to the model rather than incidental.
