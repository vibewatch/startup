  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: gross-margin-disclosure
    missingEvidence: Product-level gross margin, hosting and data-acquisition cost, and support-cost allocation by module.
    whyItMatters: Without cost layers, the chapter can describe Lighthouse as software-and-data but cannot underwrite actual contribution margin or operating leverage.
    diligencePath: Request a management bridge from ARR or revenue to gross profit by major product family, including support and data-input cost allocations.
    relatedQuestionRefs:
    - QI010
    - QI026
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: pricing-realization
    missingEvidence: Realized pricing, discounting, contract length, seat or property counts, and attach-rate data by module.
    whyItMatters: Public sources show paid plans but not the revenue per customer, renewal mechanics, or bundle depth needed to model revenue quality.
    diligencePath: Request cohort-level bookings, property counts, ASP, discount bands, and expansion or contraction data for the top products and acquired modules.
    relatedQuestionRefs:
    - QI003
    - QI004
    - QI024
    relatedTableRefs:
    - TI002
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: runway-and-burn
    missingEvidence: Unrestricted cash, monthly burn, covenant headroom, debt-service schedule, and management runway view after the 2024-2025 financing actions.
    whyItMatters: The chapter can prove capital access but cannot tell whether Lighthouse is comfortably financed, near breakeven, or still dependent on another external raise.
    diligencePath: Request monthly cash bridge, bank debt or lender schedule, covenant package, and board-approved base and downside runway scenarios.
    relatedQuestionRefs:
    - QI011
    - QI016
    - QI017
    - QI025
    relatedTableRefs:
    - TI004
    - TI005
  - type: conflicting-data
    severity: material
    topic: public-estimate-conflicts
    missingEvidence: Management-confirmed consolidated revenue, ARR, valuation, and headcount figures that reconcile the differences across TechCrunch, Tech Funding News, Tracxn, and GetLatka.
    whyItMatters: Public directory and media data disagree enough that a model built on one number would overstate confidence and may mix entity-level and group-level metrics.
    diligencePath: Ask management to provide the latest cap-table valuation, current employee count, and audited or board-approved revenue and ARR definitions for the same reporting perimeter.
    relatedQuestionRefs:
    - QI019
    - QI020
    - QI021
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: acquisition-integration-economics
    missingEvidence: Revenue contribution, cross-sell uptake, cost synergies, and integration spend for HQ revenue, The Hotels Network, and earlier acquired assets.
    whyItMatters: Acquisition-led expansion is central to the growth narrative, but the public record does not quantify whether acquired modules are margin accretive or integration heavy.
    diligencePath: Request M&A integration scorecards, acquired ARR or revenue by asset, churn since close, and synergy realization against the acquisition case.
    relatedQuestionRefs:
    - QI018
    - QI023
    - QI026
    relatedTableRefs:
    - TI004
    - TI005
