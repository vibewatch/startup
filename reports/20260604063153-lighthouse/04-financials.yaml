  rows:
  - - Pricing intelligence
    - Paid access to Lighthouse Pricing, including live rate shopping, forward demand data, and AI recommendations.
    - Subscription per property / portfolio (unit undisclosed)
    - Clearly marketed as a core paid module; no public list price.
    - High strategic relevance, medium disclosure quality.
    - Request module ARR, property counts, pricing tiers, and discount policy.
  - - Performance / business intelligence
    - Paid analytics and reporting workflow for single-property and portfolio users.
    - Subscription per property / portfolio (unit undisclosed)
    - Public materials emphasize dashboards, forecasting, and workflow compression, not pricing.
    - High relevance, medium disclosure quality.
    - Request realized ASP, renewals, and attach rate to Pricing.
  - - Data Solutions / APIs
    - Custom hotel and short-term-rental data packages sold to investors, OTAs, DMOs, and tech partners.
    - Custom data license / API agreement
    - Clearly offered, but bespoke and not publicly priced.
    - High value, low transparency.
    - Request data-contract mix, average contract value, and gross margin by data product.
  - - Direct-booking / personalization tools
    - Cross-sell capability added through The Hotels Network acquisition to improve direct-channel conversion.
    - Software subscription or bundle (unit undisclosed)
    - Capability is public; monetization terms are not.
    - Medium relevance, low transparency.
    - Request acquired ARR, attach rate, and uplift-to-renewal conversion.
  - - Channel / distribution tooling
    - Channel-manager and connectivity features sold with broad OTA, metasearch, and GDS integrations.
    - Software subscription plus onboarding services
    - Marketplace breadth is public, but pricing and service fees are not.
    - Medium relevance, medium transparency.
    - Request implementation fees, ongoing support cost, and partner-revenue sharing terms.
  - - Revenue services / support layer
    - Human onboarding, customer success, and revenue-strategy support complement the software stack.
    - Service time embedded in subscription or sold separately
    - Customer stories and support claims imply a significant service layer, but no monetization breakout is public.
    - Medium relevance, low transparency.
    - Request services revenue mix, gross margin, and support headcount by cohort.
  notes: Rows separate observable product lines from missing monetization detail; “unit undisclosed” means the public source pack did not expose contract mechanics.
