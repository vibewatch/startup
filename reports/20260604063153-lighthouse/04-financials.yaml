- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Realized pricing and discount bands by module
    - Without posted or realized price data, ARPU and pricing power cannot be modeled.
    - Request contract samples, ASP by module, discount bands, and renewal uplift history.
  - - Gross margin by product family
    - The company looks software-like, but data acquisition, compute, and support cost could materially lower margins.
    - Request product P&Ls with hosting, data, support, and implementation cost allocations.
  - - CAC, payback, and sales efficiency by segment
    - Customer stories imply value, but public sources do not prove efficient growth.
    - Request CAC, payback, win rates, quota attainment, and channel-vs-direct sales splits by segment.
  - - Retention, churn, and expansion by acquired module
    - Acquisition-led cross-sell is central to the story, but renewal quality is opaque.
    - Request gross and net retention, logo churn, and attach rates for The Hotels Network, HQ revenue, and legacy products.
  - - Unrestricted cash, burn, runway, and debt service
    - Capital adequacy remains the biggest underwriting blocker because headline financing is not the same as remaining liquidity.
    - Request monthly cash bridge, debt schedule, covenants, and base/downside runway scenarios.
  - - Acquisition integration economics
    - The company is using M&A strategically, but the public record does not show accretion, integration cost, or synergy timing.
    - Request acquired ARR or revenue, integration spend, synergy scorecards, and customer-retention data for acquired assets.
  notes: Every row is a true diligence blocker rather than a nice-to-have; the chapter can form a directional view without these items, but it cannot underwrite precisely.
