  title: Financials
  summary: 'Lighthouse looks like a scaled software-and-data platform with a clear hotel-commercial ROI narrative, a $370 million KKR-led Series C, and meaningful cross-sell optionality from acquisitions such as HQ revenue and The Hotels Network. The public problem is not lack of strategic momentum but lack of financial disclosure: pricing is not public, revenue proxies range from roughly $52.8 million to $101 million depending on source and reporting perimeter, and registry filings prove continuing financing activity without revealing unrestricted cash, burn, or runway.'
sections:
- id: revenue-model-and-monetization
  title: Revenue model, product monetization, and pricing transparency
  body: |-
    Lighthouse clearly sells commercial-intelligence software, but the public record describes a product suite rather than a disclosed revenue bridge. Official materials center on Lighthouse Pricing, Lighthouse Performance, Data Solutions, partnership-enabled integrations, and direct-booking or channel-management capabilities brought into the platform through acquisitions. Data Solutions matters because it expands the buyer set beyond hotel operators to OTAs, investors, DMOs, and hospitality-tech partners; that makes Lighthouse look less like a single-product hotel SaaS vendor and more like a combined application-and-data business. Revenue Agent adds another clue on monetization architecture: management launched it at no additional cost to existing customers, which implies bundle expansion and retention logic rather than an immediately separate paid SKU.

    What is missing is the underwriting-grade price sheet. The official product pages market outcomes, demos, and feature depth, but not numeric price cards. ToolRadar independently reaches the same conclusion and explicitly flags unavailable pricing details as the product’s biggest public downside. Customer proof nevertheless suggests Lighthouse sells on an ROI narrative: Soho House says the added revenue exceeded the monthly subscription, HRI calls the platform cost-effective, and Furaveri ties use of pricing and parity tools to direct-booking growth. That is enough to conclude the company monetizes through paid software and data subscriptions with likely cross-sell into newer direct-booking and AI modules, but not enough to calculate realized ASP, discounting, or module-level recurring mix.
