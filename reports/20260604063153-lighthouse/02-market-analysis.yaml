  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: market-sizing
    missingEvidence: A normalized bottom-up model that reconciles broad hotel-software TAM estimates with much larger syndicated RMS estimates and isolates pricing, BI, and channel-management spend.
    whyItMatters: Valuation work will look very different depending on which category boundary is used. Current public estimates are not directly comparable and can overstate or understate the true addressable market.
    diligencePath: Request analyst methodology appendices and triangulate with public vendor revenue disclosures across RMS, BI, channel management, and PMS vendors.
    relatedQuestionRefs:
    - QM027
    - QM028
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: lighthouse-segment-mix
    missingEvidence: A public breakdown of Lighthouse customers and ARR by hotels, vacation rentals, data solutions, and chains versus independents.
    whyItMatters: Without segment mix, market share and cross-sell assumptions are guesswork even if the category narrative is strong.
    diligencePath: Ask management for customer count, ARR, and installation mix by product and lodging segment, plus expansion rates across those cohorts.
    relatedQuestionRefs:
    - QM029
  - type: private-evidence-only
    severity: material
    topic: enterprise-acv
    missingEvidence: Enterprise chain ACVs, implementation fees, and payback periods for Lighthouse-like commercial stacks are not publicly disclosed.
    whyItMatters: Bottom-up SAM and SOM depend heavily on whether large portfolios buy at low five figures, high five figures, or six figures per property or per portfolio.
    diligencePath: Collect proposal examples, customer interviews, and sales-operating data across chain, management-company, and independent segments.
    relatedQuestionRefs:
    - QM030
    relatedTableRefs:
    - TM003
  - type: missing-source
    severity: minor
    topic: budget-split
    missingEvidence: Consistent public evidence quantifying how hotel commercial-tech budget authority splits among property teams, centralized finance, owners, asset managers, and IT.
    whyItMatters: Budget-owner ambiguity affects sales-cycle length, implementation friction, and pricing power by segment.
    diligencePath: Interview independent hotels, branded portfolios, management companies, and asset managers to map approval pathways and typical budget envelopes.
    relatedQuestionRefs:
    - QM027
    relatedTableRefs:
    - TM003
