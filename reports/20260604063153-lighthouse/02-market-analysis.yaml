- id: contradictions-and-gaps
  title: Contradictions and Evidence Gaps
  body: 'Two contradictions should be preserved rather than smoothed away. First, near-term lodging demand is improving, but public 2026 hotel outlooks differ materially: CoStar models a muted 0.6% U.S. RevPAR increase, while PwC models 2.9%. Second, published software TAMs range from a few billion dollars to nearly $20 billion depending on whether the publisher is counting all hotel software, only revenue-management software, or an even broader proxy for commercial technology. Those differences are not rounding errors; they are evidence that the real diligence task is category normalization. The missing data is mostly private. Public materials do not disclose Lighthouse’s revenue mix across hotels, short-term rentals, and data services; they do not disclose enterprise chain ACVs or implementation costs; and they do not quantify how budget authority splits among property teams, management companies, owners, and IT. The result is a strong market-existence thesis and a credible adoption-driver
    thesis, but only a constrained TAM/SAM/SOM conclusion. Precision beyond that needs management data and customer interviews, not another syndicated report.'
