company:
  name: Lighthouse
chapter:
  number: 2
  title: Market Analysis
  summary: 'Lighthouse addresses a real but often over-broadened market: the commercial-intelligence software layer that helps accommodation operators price, benchmark, distribute, and convert demand. Public sources support a healthy adoption backdrop—travel demand is recovering, AI usage is rising, and hotels are replacing fragmented stacks—but they do not support one clean TAM; published estimates range from a $3.85B broad hotel-software market to a $19.4B hotel-RMS estimate because boundaries differ materially.'
sections:
- id: market-boundary
  title: Market Boundary and Status-Quo Substitutes
  body: 'Lighthouse does not sell into the full travel market; it sells into the software layer that helps accommodation operators make better commercial decisions. The company describes itself as a commercial platform spanning market insights, business intelligence, pricing, and channel management, which places it beyond legacy rate-shopping and into the broader workflow of demand sensing, competitor benchmarking, pricing execution, and distribution control. In practical spend terms, the included boundary covers pricing optimization, competitive intelligence, business-intelligence dashboards, channel management, direct-booking optimization, and the integrations required to connect those decisions to PMS, CRS, and booking channels. Excluded from the narrow core are PMS, security, building automation, and generic guest-service systems unless they directly influence pricing or distribution outcomes. Vacation rentals also belong inside the practical competitive boundary: Lighthouse’s pricing
    product explicitly combines hotel and short-term-rental rates, and the company says 45% of travelers compare the two. That means hotel revenue teams increasingly compete inside one accommodation decision set that includes hotels, short-term rentals, OTAs, and AI-mediated discovery layers rather than separate silos.'
  claimRefs:
