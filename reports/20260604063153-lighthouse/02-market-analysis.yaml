- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Hotel demand recovery and events calendar
    - Driver
    - Current / 2026
    - Improving lodging volumes support pricing, benchmarking, and distribution spend even if recovery is uneven
    - Stress-test demand assumptions against both CoStar and PwC, not just one outlook
  - - Margin compression and structurally higher hotel cost base
    - Constraint
    - Current / persistent
    - Operators buy tools that protect NOI, not generic transformation projects; slower payback tools get delayed
    - Request customer ROI, labor-saving, and commission-reduction evidence by segment
  - - Broad AI adoption among hotel operators
    - Driver
    - Current / 2026
    - AI-enabled pricing, forecasting, and workflow automation are becoming baseline expectations in commercial tech
    - Verify whether Lighthouse wins on practical workflow outcomes or just AI positioning
  - - AI governance and trust gap
    - Constraint
    - Current / 2026
    - High usage does not remove implementation risk; hotels still need policy, explainability, and human override
    - Ask how customers govern pricing, content, and agentic booking decisions
  - - Best-in-class upgrade cycle
    - Driver
    - 12-24 months
    - A large replacement cycle favors vendors with strong integrations and measurable commercial lift
    - Measure Lighthouse win rates against all-in-one suites and incumbent RMS tools
  - - Integration debt across PMS / CRS / channel manager stack
    - Constraint
    - Persistent
    - API gaps and mapping work lengthen sales cycles, increase switching cost, and can stall rollout
    - Validate implementation timelines and failure points by PMS and region
  - - Alternative accommodations in the comp set
    - Driver
    - Current / structural
    - Hotels need pricing and demand tools that account for Airbnb-style supply, not just hotel peers
    - Check how often customers actively benchmark STR inventory and whether it changes rates
  - - AI-native discovery and machine-readable inventory
    - Driver
    - Emerging / 2026+
    - Hotels with clean rates, policies, and schema gain visibility as AI agents compress the funnel
    - Assess whether Lighthouse distribution and content tools materially improve AI-channel discoverability
  - - OTA and marketplace demand growth
    - Driver
    - Current / 2026
    - Growing OTA and platform volumes keep distribution and conversion optimization commercially relevant
    - Compare direct-channel gains against dependence on OTA traffic and commissions
  notes: The same forces that expand demand also tighten ROI discipline. AI, recovery, and alternative-accommodation competition create budget urgency, but margin pressure and integration debt slow decision speed.
