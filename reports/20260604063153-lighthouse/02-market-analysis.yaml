- id: market-sizing
  title: 'Sizing Lenses: TAM, SAM, and Constrained Serviceability'
  body: The top-down market-size picture is directionally useful but not internally consistent. The Business Research Company sizes the global hotel and hospitality management software market at $3.85 billion in 2026 and $4.78 billion by 2030, but that category includes PMS, guest service, communications, and security systems in addition to commercial tools. Cognitive Market Research, by contrast, publishes a much larger $19.4 billion 2025 hotel revenue management software estimate with 8.7% CAGR through 2033. Those figures should not be blended into a single TAM; the narrower-sounding RMS report is actually far larger than the broader hotel-software report, which strongly suggests incompatible definitions and inflated syndication. A more useful working lens is constrained and bottom-up. Lighthouse publicly prices independent-hotel packages at €99, €129, and €189 per month, so the self-serve edge of the market monetizes in the low-thousands of euros per property per year, not at enterprise-software
    ACVs by default. Lighthouse also says 70,000+ hoteliers rely on the platform and 80,000+ properties are supported worldwide, while PriceLabs supports 600,000+ vacation-rental properties. That evidence supports a real and sizable market, but one bounded by integration readiness, revenue-team maturity, and willingness to pay for measurable margin improvement rather than by generic travel-spend headlines.
  claimRefs:
