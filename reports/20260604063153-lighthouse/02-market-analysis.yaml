tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Why it matters to Lighthouse
  rows:
  - - Hotel commercial intelligence core
    - Pricing optimization, competitive rate shopping, demand intelligence, benchmark dashboards, channel optimization
    - Core PMS, accounting, HR, security, building automation
    - Revenue manager, commercial director, GM; paid by hotel operating budget or owner-approved tech budget
    - This is Lighthouse's direct wedge across pricing, BI, and market insight
  - - Channel management and reservation execution
    - Availability sync, rate and LOS updates, booking-channel optimization, commission control
    - Back-office property operations unrelated to inventory distribution
    - Revenue / e-commerce lead with GM or owner sign-off
    - Lighthouse sells directly into this adjacent execution layer and uses it to deepen switching costs
  - - Direct-booking and AI-discovery layer
    - Website personalization, direct booking flows, machine-readable rates, schema, voice and AI discovery
    - Generic brand marketing spend without measurable booking linkage
    - Commercial team and digital marketing lead
    - AI-native discovery changes how hotels are found and converted
  - - Vacation-rental revenue management adjacency
    - Dynamic pricing, market dashboards, listing analytics, portfolio automation for STRs
    - Consumer travel spend itself; property operations unrelated to pricing
    - Host, property manager, or revenue manager
    - Hotel tools increasingly benchmark against STR inventory; adjacent vendors are already scaled
  - - Broad hotel and hospitality management software
    - PMS, reservation management, guest service, communications, security, building automation, integrations
    - Non-hospitality software categories
    - Hotel ownership, operator, and IT budgets
    - Useful outer TAM context, but much broader than Lighthouse's commercial use case
  - - Status-quo substitutes
    - Spreadsheets, PMS reports, legacy rate shoppers, OTA extranets, brand systems, manual comp-set checks
    - Purpose-built commercial-intelligence platforms
    - Internal labor time rather than vendor spend
    - These substitutes explain why Lighthouse sells time savings, accuracy, and ROI—not only software features
  notes: Boundary rows separate the narrow commercial-intelligence core from broader hotel software and manual substitutes. Included/excluded spend is defined from Lighthouse product pages, TBRC category scope, and 2026 budgeting commentary rather than from one syndicated TAM report.
