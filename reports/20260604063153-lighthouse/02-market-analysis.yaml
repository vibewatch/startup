callouts:
- calloutType: insight
  title: The market is real, but the published TAMs are not interchangeable
  body: The strongest market signal is not one oversized TAM number; it is the combination of visible vendor scale, real package pricing, and an active hotel-stack replacement cycle. That supports a credible commercial-intelligence category even though syndicated market reports disagree sharply on its dollar size.
  claimRefs:
  - CM012
  - CM013
  - CM015
  - CM016
  - CM045
- calloutType: risk
  title: Integration debt and ROI scrutiny are the main adoption brakes
  body: Hotels may want AI and better pricing tools, but margin pressure, policy gaps, and PMS / channel integration work can still slow purchase and rollout. Lighthouse wins when it shortens time-to-value and proves commercial lift, not when it relies on the generic AI narrative alone.
  claimRefs:
  - CM021
  - CM028
  - CM029
  - CM035
  - CM037
