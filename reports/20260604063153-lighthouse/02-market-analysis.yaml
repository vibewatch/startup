- id: adoption-drivers-and-constraints
  title: Adoption Drivers and Constraints
  body: 'The demand environment supports continued spending on commercial tech, but only where ROI is explicit. AHLA expects nearly $805 billion of U.S. hotel guest spending in 2026, and both Expedia and Airbnb reported healthy lodging volume growth entering the year. AirDNA likewise expects U.S. short-term-rental listings to keep growing in 2026, with ADR still increasing despite softer occupancy. Those conditions favor software that helps operators price dynamically, monitor alternative-accommodation competition, and reduce commission leakage. At the same time, owners remain margin constrained. AHLA says GOPPAR is still only about 90% of 2019 levels, while HVS argues that structurally higher labor, insurance, utility, and brand-standard costs are compressing profit and forcing more active scrutiny of operator fees and technology ROI. That is why muted market views matter: CoStar’s 2026 hotel forecast is materially more conservative than PwC’s, so vendors cannot sell against a single agreed
    recovery curve. AI is the clearest structural tailwind. Mews says 98% of hoteliers used AI in the prior six months, IDeaS says 89% are planning new AI applications, and PwC says 44% of consumers already use AI tools to compare prices. But AI also creates gating constraints around governance, trust, and data quality. Mews says 41% of hoteliers still have no formal AI policy, and Mews, SiteMinder, and Lighthouse all argue that structured data, open APIs, and AI-readable inventory are becoming prerequisites for discovery in an agentic-booking world.'
