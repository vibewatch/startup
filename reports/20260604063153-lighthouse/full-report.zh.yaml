      - number: '2.2'
        title: 规模测算视角：TAM、SAM 与受约束的可服务性
        blocks:
          - type: paragraph
            body: >-
              自上而下的市场规模图景有方向价值，但内部不一致。The Business Research Company 估计，全球酒店与酒店业管理软件市场 2026 年为 $3.85 billion，2030 年为
              $4.78 billion；但这个类别除商业工具外还包括 PMS、宾客服务、通信和安全系统。相比之下，Cognitive Market Research 发布的 2025 年酒店收入管理软件估算高得多，达到
              $19.4 billion，并预计到 2033 年 CAGR 为 8.7%。这些数字不应混成一个 TAM；听起来更窄的 RMS
              报告反而远大于更宽的酒店软件报告，强烈暗示定义不兼容且辛迪加口径被抬高。更有用的工作视角是受约束、从底向上。Lighthouse 公开把独立酒店套餐定价为每月
              €99、€129、€189，因此市场自助边缘的货币化是每物业每年几千欧元低段，而不是默认企业软件 ACV。Lighthouse 还称 70,000+ 酒店经营者依赖平台、全球支持 80,000+ 物业，而
              PriceLabs 支持 600,000+ 度假租赁物业。证据支持一个真实且不小的市场，但市场边界由集成准备度、收入团队成熟度，以及为可测量利润改善付费的意愿决定，而不是由笼统旅行支出标题决定。
