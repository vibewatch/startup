      - number: '5.3'
        title: 集成与收购驱动的平台扩张
        blocks:
          - type: paragraph
            body: >-
              Lighthouse 并没有把产品定位成封闭 SaaS 目的地。公开的集成 API 发布、开放 API 文档、合作伙伴计划，以及渠道 / PMS
              市场，都指向生态系统战略。公司称合作伙伴可以在沙箱访问、文档、技术支持之上构建认证集成，并实现价格、库存和业绩指标的单向或双向同步。市场文章说明了这在运营上为何重要：渠道管理客户可以连接很长一串 OTA
              和元搜索端点，以及许多 PMS 和 CRS 环境；合作伙伴页面则称 Lighthouse 与 20 多个国家的 165+ 合作伙伴合作。


              平台广度也明显由收购驱动。2023 年更名已经把 Transparent 和 Kriya RevGen 等早期收购整合进统一商业平台。2024 年 2 月收购
              Stardekk，随后增加面向独立酒店的渠道管理和分销软件；2024 年 7 月发布页面明确显示，结果产品把定价、促销和分销决策融合成一条流程。2024 年 6 月 HQ revenue
              交易延续了组装高级商业数据和软件团队的策略。2025 年 4 月 The Hotels Network 收购再次拓宽栈，加入预测性个性化、直订营销和面向直连渠道的 AI 智能体。


              来自 Cloudbeds 和其他生态页面的合作伙伴证据支撑同一结论：Lighthouse 正试图成为酒店商业运营基础设施，而不只是点状解决方案。上行空间在于，客户可以把 Lighthouse 插入既有
              PMS、BI、订房引擎和渠道栈。真实依赖风险也随之出现，因为价值主张现在取决于外部连接器、合作伙伴维护、映射准确性，以及跨越很宽界面的跨模块集成质量。
