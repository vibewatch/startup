  - id: TU005
    title: 扩张与集中风险表
    columns:
      - 扩张驱动因素
      - 集中风险
      - 影响
      - 尽调路径
    rows:
      - - 定价 / BI 先落地再扩张
        - 许多具名案例从定价或 BI 起步，再扩展到更多模块
        - 有利于 ACV 扩张和切换成本，但缺少 NRR 或模块挂载数据，难以量化
        - 索取模块挂载率，以及按队列拆分的平均账户扩张
      - - 直营渠道栈扩张
        - Lighthouse 现在在核心定价产品之上销售个性化产品、KITT、The Hotels Network，以及 ChatGPT / Connect AI 工作流
        - 有利于钱包份额，但新模块的续约成熟度可能低于核心定价产品
        - 索取按产品线拆分的模块级留存、挂载率和毛利率
      - - 合作伙伴与 PMS 生态依赖
        - 165 个合作伙伴、200+ 个渠道，并高度依赖与 PMS / RMS / 预订引擎的集成
        - 带来可规模化分销，但 Lighthouse 也面临合作伙伴集中和集成优先级风险
        - 索取来自前五大合作伙伴的 ARR，以及重大集成故障对流失的影响
      - - 组合型运营商偏重
        - 具名案例集中在多物业集团和管理公司，如 Highgate、Lotte、Rotana、Cititel、Primehotels 和 Leonardo
        - 即便客户数很广，也可能意味着企业收入集中
        - 索取最大客户和前 20 大客户的 ARR 集中度，以及连锁 / 集团账户贡献占比
      - - 装机基数口径漂移
        - 公开页面引用 65,000 家酒店、70,000+ 客户和 80,000 个酒店物业
        - 让总量采用数字显得强劲，但削弱了对真实活跃付费账户的精确判断
        - 索取董事会层面对客户、酒店、物业和上线端点的定义
      - - 公开续约经济性稀疏
        - 尽管案例研究表面强劲，公开资料没有披露 NRR、GRR、流失率或合同期限数据
        - 无法对耐久性和下行集中度做出扎实判断
        - 索取定价、BI 和直订产品的续约队列、合同期限和总留存率
    notes: 本表将上行扩张路径与其带来的主要集中和不透明风险放在一起，不能替代客户队列报告。
