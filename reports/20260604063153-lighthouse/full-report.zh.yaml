      - number: '8.2'
        title: 估值框架和可比公司组
        blocks:
          - type: paragraph
            body: >
              最干净的公开框架，是收入倍数的理性校验，而不是精确 DCF。Lighthouse 是私营公司，不披露已审计收入、利润率或留存。唯一抓取到的收入数字是 GetLatka 对 2025 年 $101 million
              的估计，方向上有用，但置信度低，因为同一档案把 CEO 识别错了，也低估了已经披露的融资。即便如此，把该估计与 TechCrunch 报道的超过 $1 billion 估值配对，也意味着往绩倍数超过 9.9x。


              这个溢价高于本章抓取到的每一个公开旅行科技可比公司：Sabre 约 0.25x，Amadeus 3.5x，Booking 4.6x，Airbnb 6.3x。它们并不是完全一一对应的可比对象——Lighthouse
              更小、移动更快，也更像软件公司——但仍是当前旅行科技估值纪律下能抓取到的最佳公开参照。含义很直接：只有当 Lighthouse 的真实 ARR
              增长、留存和交叉销售速度显著好于公开基准组时，溢价倍数才站得住。在已审计指标证明这一点之前，公开证据支持的是估值偏高，而不是显然有吸引力。
                      
            claimRefs:
              - CV037
              - CV038
              - CV039
              - CV040
              - CV041
              - CV043
              - CV044
              - CV047
