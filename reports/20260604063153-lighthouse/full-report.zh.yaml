  - id: FU002
    title: 采用 / 部署流程
    type: flow
    layout: wide
    summary: 可见的部署动作从定价或 BI 起步，再进入直销渠道工具、更广的分销控制和 AI 发现界面。
    approximationNotes: 该流程抽象了定价、BI、直订和合作伙伴主导的部署；单个客户可能从不同节点开始。
    data:
      nodes:
        - id: pricing
          label: 定价 / 基准入口
          detail: 酒店采用 Lighthouse，以替代手工房价抓取，并发现需求或平价变化。
        - id: bi
          label: 绩效 / BI 标准化
          detail: 中央团队把市场、pickup 和细分数据整合到一个仪表盘。
        - id: direct
          label: 直订优化
          detail: 客户增加个性化、转化工具或 KITT，用于客人沟通。
        - id: channel
          label: 渠道管理
          detail: 独立或混合组合在数百个渠道上增加房价 / 可用量自动化。
        - id: partner
          label: 合作伙伴分发触达
          detail: PMS、RMS、预订引擎和数据伙伴把 Lighthouse 分发进酒店工作流。
        - id: ai
          label: AI 发现和预订
          detail: Connect AI、ChatGPT app 和 Hotelrank.ai 创建新的直接发现层。
      edges:
        - from: pricing
          to: bi
          label: 增加集中报告
        - from: bi
          to: direct
          label: 扩展到营销 / 客人互动
        - from: direct
          to: channel
          label: 增加分销自动化
        - from: pricing
          to: partner
          label: 经 PMS / RMS / 预订引擎嵌入
        - from: partner
          to: ai
          label: 延伸到 AI 渠道
        - from: channel
          to: ai
          label: 将控制权转成直接 AI 预订
    claimRefs:
      - CU003
      - CU029
      - CU030
      - CU031
      - CU032
      - CU033
      - CU034
      - CU036
      - CU037
      - CU038
      - CU039
      - CU049
  - id: FU003
    title: 客户证据矩阵
    type: matrix
    layout: wide
    summary: 公开证据最强的地方，是 Lighthouse 给出量化工作流结果和多物业生产使用，而不只是客户 logo。
    data:
      columns:
        - 结果具体度
        - 部署成熟度
        - 跨来源交叉验证
        - 留存可见度
      rows:
        - label: Cititel Hotel Management
          values:
            - 中高 — 提前 3 周发现需求激增，并披露工作流改善
            - 高 — 10 家物业的生产定价用例
            - 低 — 仅有官方案例研究
            - 低 — 未披露合同或续约
        - label: THE THIEF Hotel
          values:
            - 高 — 披露成本节省、收入、带动预订和转化率提升
            - 高 — 自 2020 年起持续合作，2023 年扩展到直营渠道
            - 低 — 仅有官方案例研究
            - 低 — 未披露活动后的续约或复购预订队列
        - label: Penta Hotels
          values:
            - 高 — 披露通话量、自动化占比、语言覆盖、满意度得分和点击率
            - 高 — KITT 在 13 家物业上线
            - 低 — 仅有官方案例研究
            - 低 — 未披露模块留存或收入续约
        - label: iH Hotels
          values:
            - 中高 — 披露节省时间和 ADR 提升代理指标
            - 高 — 多个市场每日反复使用定价功能
            - 低 — 仅有官方案例研究
            - 低 — 未披露合同期限
        - label: Lotte Hotels & Resorts
          values:
            - 中 — 效率叙事强，直接收入量化较少
            - 高 — 37 家物业集中部署
            - 低 — 仅有官方案例研究
            - 低 — 未披露续约队列数据
        - label: Highgate
          values:
            - 高 — 测试物业 RGI 提升 7.4%，收益约 $400k
            - 高 — 企业组合覆盖 125+ 家酒店
            - 低 — 仅有官方案例研究
            - 低 — ROI 证据强，但缺少组合层面的留存证据
