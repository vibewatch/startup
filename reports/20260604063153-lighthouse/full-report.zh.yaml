        - 要求 Lighthouse 证明酒店纵深能压过更广旅行网络杠杆
      - - 直订自动化打开另一块预算池
        - Revinate 和 Cendyn 可能转而掌握住客数据、转化和广告支出
        - 中
        - Revinate 的直订和预订销售口径，加上 Cendyn 的 Google 合作伙伴证据，显示强需求侧重叠
        - 索取 Lighthouse 直订工作流的模块级采用率和 ROI
      - - 基准和绩效洞察可与策略捆绑
        - STR / CoStar 仍是许多经营者默认基准
        - 中
        - STR 称其基准样本覆盖 94,000 家酒店和 12M 间客房，包含收入、费用和利润数据
        - 要求证明 Lighthouse 替代而非只是补充 STR
      - - 企业买方会容忍战略软件的不透明定价
        - 短租原生和租赁原生工具露出低摩擦入口信号，可能把价格预期锚得更低
        - 中
        - SourceForge 显示 Lighthouse 无公开定价，Guesty Lite 起价 $16/month，PriceLabs 则提供试用引导入口
        - 承销利润率耐久性前，索取价格卡、最低合同期限和折扣政策
      - - 规模叠加近期融资，给扩张留下时间
        - 整合和 AI 加速正在快速压缩空白
        - 高
        - Duetto 更换所有者以加速 AI；Mews 收购 Atomize，统一运营和收益管理
