      - number: '2.3'
        title: 买方、用户、付款方与切换成本动态
        blocks:
          - type: paragraph
            body: >-
              预算所有权分散在酒店组织内，而不是集中在一个职位上。Hospitality Technology 称，2026
              年预算从物业层面启动，由总经理、销售总监和运营负责人贡献市场假设，再向上汇总到组合层面的标准化和业主审查。日常使用中，主要操作者通常是收入经理、电商经理或商业负责人；付款方可能是
              GM、管理公司、业主或资产经理；一旦 PMS、CRS、渠道管理器或 API 工作变得必要，IT 就会加入。因此，集成深度既是购买标准，也是切换成本。2026 年 IDeaS / NYU / Stayntouch
              技术展望研究发现，只有 54% 酒店经营者主要使用已集成工具，38% 把集成列为主要痛点，51% 预计在 12-24 个月内替换或升级技术栈。同一报告还发现，一体化用户中 30%
              计划转向同类最佳工具，而反向迁移仅 14%；同类最佳工具一侧满意度更高、运营错误更少。细分很重要：小型物业仍偏好简单和可负担，101-250+ 间客房物业则更倾向能提供更多控制权和更丰富商业数据的模块化系统。
