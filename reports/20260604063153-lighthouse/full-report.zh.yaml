      - number: '6.4'
        title: 留存、满意度和反向信号
        blocks:
          - type: paragraph
            body: >-
              公开留存证据明显弱于公开采用证明。Lighthouse 提供了一些正向代理指标：官网宣传平均支持响应时间 100 秒，并引用 Furaveri Maldives、HRI Properties、Six Senses
              Douro Valley、Radisson Dubai DAMAC Hills、Soho House & Co. 等具名用户；Apaleo marketplace 列表称 98.2%
              客户认为支持很棒或惊艳；Penta 报告 KITT 交互的宾客满意度为 8.3/10；FeaturedCustomers 汇总 71 条推荐、42 篇案例研究、13 个视频和 4.8/5
              推荐评分。但独立评价的宽度仍比营销表面看起来薄。TrustRadius 只有两条评价，Capterra UK 有四条评价，其中一条明确抱怨 Lighthouse 在各地区推广并不均衡。SoftwareFinder
              又加了一个温和的实施提示：初始数据配置可能较细，且可能产生额外实施费用。已审阅的公开来源都没有披露净收入留存、总收入留存、合同期限、续约队列或 logo
