      - number: '3.4'
        title: 反向证据是一场整合与专业化竞赛：公司越扩张，Lighthouse 优势也可能越被压窄
        blocks:
          - type: paragraph
            body: >-
              最强的反向信号不是 Lighthouse 缺少规模，而是市场正围绕几个不同运营层整合。独立 2026 排名证据仍显示，在纯收入管理标准上，Duetto 这类专门 RMS 供应商领先于更宽的商业平台；BI
              排名则把功劳拆给 OTA Insight、RateGain 和其他更窄工具。自 2024 年以来，Duetto 换了所有者，并带着明确 AI 加速任务；Mews 收购 Atomize，把 PMS
              运营与收入优化融合。这些动作重要，因为它们压缩了“记录系统”和“优化系统”之间的空白。Lighthouse 仍有可信的广度护城河：它合并酒店和 STR
              数据，拥有大规模每日价格覆盖，并提供比多数单用途对手更宽的商业界面。但下一个承保问题是，一旦买方理性化供应商数量，这种广度是否足以击败更深的 RMS 专家、基准存量玩家、直连需求栈和 PMS
              套装。没有公开胜率、流失率或实际定价数据，耐久性问题只能得到部分回答。
