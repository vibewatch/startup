  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品套件与商业工作流
        blocks:
          - type: paragraph
            body: >-
              Lighthouse 如今把自己营销成酒店商业操作系统，而不是单一查价工具。当前公开界面覆盖 Pricing、Performance、Distribution、Channel
              Management、Direct、Data Solutions，以及较新的 Revenue Agent 层。这个模块组合很重要，因为 Lighthouse
              想拿下的客户工作流从市场感知一路延伸到决策和执行：团队监控前瞻需求和实时价格，把内部节奏与真实竞品比较，把价格和可售量推送到渠道，盯住价格一致性漏洞，再尝试在自有网站转化更多流量。因此，这个栈比传统酒店业 BI
              或止步于仪表盘的基准供应商更宽。


              产品故事也按买方分层。集团和连锁被引向定价、业绩、分销和数据产品，帮助物业之上的商业团队比较市场与组合。独立酒店则被引向更打包的运营界面，把定价优化、渠道管理、直订、支付、预订工作流和 AI 评论 /
              订房辅助合在一起。公开定价页面强化了这一点：Lighthouse 试图把多个日常工具压缩进同一套运营节奏，而不是让客户自行拼接查价、基准、价格一致性和个性化供应商。


              2024 年以来的收购解释了套件为何变得这么宽。Stardekk 增加渠道管理和分销执行，HQ revenue 增加更多商业策略深度，The Hotels Network 增加直连渠道个性化和营销
              AI。放到实际工作流里，Lighthouse 现在拿下了更大一段闭环：看见市场信号、选择价格、推送到渠道、保护直连价格完整性，并个性化预订路径。
