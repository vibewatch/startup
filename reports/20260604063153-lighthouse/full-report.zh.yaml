      - number: '7.5'
        title: 缓释、监控和否决标准：只有控制跟上范围，投资逻辑才站得住
        blocks:
          - type: paragraph
            body: >-
              Lighthouse
              确实有可信的缓释理由。公司不缺外部验证：装机基础大，有投资者支持，有公开支持指标，有评论驱动奖项，还有法律评论显示算法定价风险取决于设计，而不是一概不合格。它的公开法律栈也比许多初创公司更深，发布了条款、隐私和
              cookie 政策、采购文件、伦理政策和收购声明。这些都说明，公司在努力让自己看起来像一个企业级交易对手，而不是一个靠融资 PPT 拼起来的销售驱动增长故事。


              但最高风险仍然与投资相关，因为缓释证据大多是流程型，而不是审计级。关键否决标准因此很直接，也可以监控。如果 Lighthouse
              无法展示有律师背书的反垄断护栏，覆盖数据输入和推荐定价，投资者就应假设法律阴影比管理层说的更宽。如果宕机频率或数据准确性投诉在平台变宽时上升，规模故事就会从护城河翻成脆弱性。如果收购后整合没有转化为附加销售率增长和更顺畅的直订经济性，M&A
              逻辑就变成了为复杂而复杂。若管理层仍无法拿出 ARR、烧钱速度、留存和集中度的私下证据，融资故事应被视为有支持作用但不充分。下一步尽调不是再画一张市场地图，而是证明治理、平台控制和经济性成熟得和
              Lighthouse 的产品范围一样快。
