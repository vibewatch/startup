      - number: '3.3'
        title: 分销权力在任何单一供应商之外，多栖使用让实际切换成本低于 Lighthouse 广度所暗示的水平
        blocks:
          - type: paragraph
            body: >-
              酒店不会脱离分销来决定定价。Google 表示，酒店需要连接合作伙伴才能出现在免费订房链接和酒店广告中；Expedia 邀请合作伙伴直接把物业加入其库存，或基于 Expedia
              供给构建品牌化旅行体验。这很重要，因为它意味着渠道权力部分掌握在元搜索和 OTA 生态手中，而不是 RMS 供应商手中。同时，相邻酒店科技品类让多栖使用相对常态化。Revinate 和 Cendyn
              可以坐在定价栈旁边并掌握宾客获客；即使酒店更换 RMS，STR / CoStar 也可以继续做基准权威；Mews、Cloudbeds 等 PMS
              平台可以吸收更多定价逻辑，而不强迫买方采用一套完全独立的情报套件。在租赁和混合组合里，Guesty、Hostaway 和 PriceLabs 已经把渠道同步、直订和动态定价合在一起。因此，Lighthouse
              的护城河在广度和可用性层面真实存在，但切换摩擦仍更多是商业性的，而不是技术性的。
