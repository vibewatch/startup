    title: 投资逻辑破裂与否决触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - ARR / 留存不达标
        - 经审计 ARR 和 NRR 无法证明相对上市可比公司的溢价合理。
        - 高溢价倍数逻辑失效，当前估值变得难以支撑。
        - 除非价格显著下调，否则不投资。
      - - 集成或 GTM 失灵
        - 收购后交叉销售疲弱，或 GTM 质量问题持续存在。
        - 平台广度逻辑从优势变成复杂度。
        - 重新推进前，要求提供细分层面的队列数据和销售效率证明。
      - - 宏观疲软加深
        - 2026 年 Q2 分化信号演变为酒店定价持续收缩。
        - 对需求敏感的客户可能推迟升级，并压缩软件预算。
        - 按悲观情景承销，或退出本轮。
      - - 优先权 / 押记负担
        - 瀑布模型显示 2025-2026 年监管文件中的高顺位权利要求较重。
        - 下行退出中，名义 EV 可能高估普通股价值。
        - 除非优先股堆叠简化，或入场价格反映该负担，否则回避。
    notes: 触发因素是为投委会纪律设计的可观察阈值。它们聚焦可在数据室验证的证据，而不是泛泛的公司质量印象。
    claimRefs:
      - CV026
      - CV031
      - CV034
      - CV035
      - CV036
      - CV046
      - CV047
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 经审计 ARR / NRR
        - 按产品和队列披露的董事会级收入、增长、毛利率和留存数据。
        - 这是判断当前估值究竟是溢价但合理、还是单纯偏高的核心输入。
        - 管理层 / CFO 数据室材料和最新 KPI 材料。
      - - 股权结构表和瀑布分配
        - 优先股堆叠、清算优先权、认股权证，以及 2025-2026 年押记背后的经济性。
        - 下行保护取决于实际退出收益，而不是名义估值。
        - 律师审阅股东文件以及 MR01 / SH01 支撑 PDF。
      - - 客户经济性
        - 2024-2025 年收购后，细分组合、定价兑现、流失和交叉销售转化。
        - 乐观情景取决于平台广度能否转化为耐久收入质量。
        - 收入运营和客户成功队列表。
      - - 当前估值标记和老股交易
        - KKR 轮后任何 2026 年老股交易、409A 标记或董事会批准的估值更新。
        - 没有刷新后的估值，投资人仍锚定在市场已变化前的 2024 年交易。
        - 领投方更新、董事会会议纪要或独立估值备忘录。
    notes: 这些是从公开市场方向性走向可承销信念所需的最低尽调要求。每一项都会直接影响入场价格或下行保护。
    claimRefs:
      - CV024
      - CV028
      - CV031
      - CV032
      - CV047
      - CV048
