  - id: TP004
    title: 分销权力 / 切换成本对比
    enumerationScope:
      coverage: partial
      basis: >-
        Rows isolate the main sources of distribution leverage and practical switching friction visible in retained
        public evidence across the hotel commercial stack.
    columns:
      - 压力来源
      - 控制对象
      - 切换 / 多归属动态
      - 证据
      - 对 Lighthouse 的影响
    rows:
      - - Google 酒店广告和免费预订链接
        - 元搜索曝光和由合作伙伴中介的房价分销
        - 酒店可更换合作伙伴，无需替换核心定价系统
        - Google 表示，酒店依赖连接合作伙伴出现在免费预订链接和酒店广告中
        - 分销杠杆有一部分在 Lighthouse 之外，可通过合作伙伴重新分配
      - - Expedia 和 OTA 库存 API
        - 基于 OTA 供给的库存访问、旅行发现和品牌化体验
        - 库存可通过合作伙伴 API 和品牌化外壳流动
        - Expedia 开发者文档邀请供应商把房源加入 Expedia 库存，或基于其供给搭建旅行体验
        - 即便酒店使用独立智能工具，OTA 平台仍是强势守门人
      - - Revinate 和 Cendyn 直客需求层
        - 住客画像、消息触达、广告和直订转化工作流
        - 可与 RMS、PMS 或 BI 工具并行，不必替换
        - Revinate 和 Google 的合作伙伴证据显示直客需求定位强
        - Lighthouse 即便保住房价和市场数据，也可能失去工作流所有权
      - - 以 PMS 为主导的套件，如 Mews 和 Cloudbeds
        - 运营记录系统，加上嵌入式定价和分销逻辑
        - 替换或升级 PMS 会挤掉相邻点状工具
        - Mews 和 Cloudbeds 都把房价和分销控制放在运营核心里
        - 最大替代风险来自套件化平台，而不是一对一的比价工具
      - - STR / CoStar 基准层
        - 竞争集、利润和组合基准权威
        - 容易叠加或与另一套 RMS 并存
        - STR 称其样本覆盖 94,000 家酒店和 12M 间客房
        - Lighthouse 不能因为赢下更广工作流，就假定基准数据会变成独占
      - - 短租原生平台，如 Guesty、Hostaway 和 PriceLabs
        - 面向短租或混合经营者的渠道同步、直订和动态定价
        - 跨 OTA 和直订网站多归属已是常态
        - Guesty、Hostaway 和 PriceLabs 都主打带动态定价的渠道级自动化
        - 混合经营者有可信替代方案，削弱其对酒店优先商业套件的忠诚度
    notes: 该表关注实际切换摩擦，而非法律合同条款。公开证据显示，最难替换的是记录系统或基准权威，而不是独立分析屏幕。
