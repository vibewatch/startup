        - 按细分市场和产品包索取 Lighthouse 对 Duetto、IDeaS 的赢亏数据
      - - 广产品面支撑单一供应商便利性
        - PMS 供应商打包了足够的收益逻辑，正在压缩 Lighthouse 的工作流优势
        - 高
        - Mews 收购 Atomize，Cloudbeds 也把定价加分销包装为现代酒店收益管理的一部分
