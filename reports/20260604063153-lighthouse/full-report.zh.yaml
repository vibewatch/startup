      - number: '1.4'
        title: 平台扩张、里程碑时间线与延续风险
        blocks:
          - type: paragraph
            body: >-
              Lighthouse 2021 年之后的故事，最好理解为在增长中的数据平台上叠加收购与整合计划。Transparent 在 2022 年带来短租情报，公开材料在 2023
              年更名时已经把它呈现为完成整合。Stardekk 于 2024 年初补上面向独立酒店的渠道管理和分销工具。Fitzpatrick 后来也把 HQ revenue
              称作另一项近期收购，尽管该交易公开细节很少。2025 年 Lighthouse 收购 The Hotels Network，把直订营销和个性化纳入栈中；2026 年又基于这项能力推出 ChatGPT
              订房应用。2026 年 5 月收购的 Hotelrank.ai 把同一逻辑向前推进一步：衡量酒店如何在 AI 渠道里被发现、描述和链接。累计模式很连贯：Lighthouse 想占据 PMS
              旁边的商业层，而不是作为另一个 PMS 竞争。


              因此，里程碑集合不只是公司事件年表，也是后续章节的架构图。更名、融资和收购都指向同一个投资逻辑：用更多数据、更多工作流和更多自动化服务酒店收入增长。HotelTechAwards
              文章支撑了这个框架，因为它明确表示 2026 年是 Lighthouse 和 The Hotels Network 首次作为一个平台共同获奖。Highgate 和 Prime Hotels 的客户故事，加上
              Shiji 合作关系，说明平台使用场景不止停留在营销文案里，已经有真实企业触点。


              主要延续风险不是生死级丑闻，而是复杂性和不透明。一篇独立评论认为，对于较简单物业，产品可能过度构建；复杂组合也可能需要较长实施周期。对投资人更重要的是，相对于已融资本规模，公开治理和财务披露仍然偏薄。Lighthouse
              看起来像一家强品类领导者，确实拥有平台广度；但它还不像一家愿意让外部人士仅凭公开信息重建股权结构表、董事会组成或精确财务画像的公司。
                       
