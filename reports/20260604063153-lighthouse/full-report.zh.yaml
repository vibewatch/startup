  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 强产品和客户证据先支撑兴趣，随后进入估值纪律检查；缺失财务证据和可见执行风险主导结论。
    data:
      nodes:
        - id: n1
          label: 规模证据
          description: 80,000+ 家酒店、700+ 名员工
        - id: n2
          label: 平台广度
          description: 定价、绩效、直接预订和 AI 智能体
        - id: n3
          label: 客户 ROI
          description: 直接预订提升和工作流节省
        - id: n4
          label: 定价不透明 / 评论样本薄
          description: 报价式定价，通用市场评论深度有限
        - id: n5
          label: 执行与市场风险
          description: RepVue GTM 批评，加上 2026 年酒店定价表现不一
        - id: n6
          label: 可比公司倍数差距
          description: 隐含 >9.9x，对比抓取的公开可比公司 0.25x-6.3x 区间
        - id: n7
          label: 继续研究
          description: 风险高、估值立场偏高，只有价格敏感时才可推进
      edges:
        - source: n1
          target: n7
          label: 支撑投资兴趣
        - source: n2
          target: n7
          label: 支撑投资兴趣
        - source: n3
          target: n7
          label: 支撑投资兴趣
        - source: n4
          target: n7
          label: 阻碍形成确信
        - source: n5
          target: n7
          label: 抬高风险
        - source: n6
          target: n7
          label: 使价格偏高
    approximationNotes: 该流程把定性和定量证据转成决策路径；不是概率模型。
    claimRefs:
      - CV015
      - CV020
      - CV023
      - CV024
      - CV026
      - CV044
      - CV048
  - id: FV002
    title: 估值敏感性
    type: bar
    summary: 基于低置信度的 $101M 公开收入估计做敏感性分析，可以看到：如果 Lighthouse 只配中个位数倍数、而不是高溢价软件倍数，价值会快速下移。
    data:
      items:
        - label: 5x × $101M 情景
          value: 505
        - label: 7x × $101M 情景
          value: 707
        - label: 9x × $101M 情景
          value: 909
        - label: 10x × $101M 情景
          value: 1010
        - label: 12x × $101M 情景
          value: 1212
    approximationNotes: 数值以百万美元计，仅把公开 GetLatka 收入估计用作方向性敏感性锚点，不视为审计事实。
    claimRefs:
      - CV037
      - CV038
      - CV039
      - CV040
      - CV041
      - CV043
  - id: FV003
    title: 估值 / 回报区间
    type: range
    summary: 公开证据区间偏向温和上行和真实下行，因为当前估值标记已经较抓取的公开可比公司带有溢价。
    data:
      items:
        - label: 悲观情景
          low: 0.55
          mid: 0.7
          high: 0.85
        - label: 基准情景
          low: 0.85
          mid: 1.05
          high: 1.25
        - label: 乐观情景
          low: 1.2
          mid: 1.45
          high: 1.7
    approximationNotes: 数值以十亿美元计，代表情景区间，不是已观察到的估值标记。区间锚定于抓取的公开可比公司、市场条件，以及低置信度的公开收入估计。
    claimRefs:
      - CV044
      - CV045
      - CV046
      - CV047
      - CV048
  - id: FV004
    title: 投资 KPI
    type: kpi
    summary: KPI 视图说明 Lighthouse 为什么具备战略吸引力，但按当前隐含价格仍难以下判断。
    data:
      items:
        - label: 推荐
          value: research-more
          status: current
          note: 公开证据方向，不是数据室级别的确信结论
        - label: 置信度
          value: medium
          status: current
          note: 证据足以判断方向，不足以精确判断
        - label: 风险评级
          value: high
          status: current
          note: 执行、宏观和资本结构不确定性
        - label: 估值立场
          value: stretched
          status: current
          note: 隐含 >9.9x 超出抓取的公开可比公司区间
        - label: 平台规模
          value: 80,000+ hotels
          status: current
          note: 公司声称的 2026 年口径
        - label: 公开可比公司区间
          value: 0.25x-6.3x
          status: current
          note: 抓取的 Sabre、Amadeus、Booking 和 Airbnb 滚动倍数
    approximationNotes: KPI 面板混合了已观察事实和推导判断；估值指标部分依赖一个低置信度的公开收入估计。
    claimRefs:
      - CV002
      - CV015
      - CV016
      - CV024
      - CV043
      - CV048
