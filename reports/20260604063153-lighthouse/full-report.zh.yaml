      - number: '7.3'
        title: 运营、平台、数据访问和合作伙伴依赖风险：每个新模块都会增加一条失败路径
        blocks:
          - type: paragraph
            body: >-
              运营风险最好理解为依赖密度。Lighthouse 的数据承诺很大——每天数十亿条酒店房价观察和数百万个房源列表——而产品路线图越来越由集成牵引：认证 API、合作伙伴收入分成、Stardekk 分销栈，以及
              The Hotels Network 营销层。这种宽度在战略上有吸引力，因为它能让 Lighthouse 更难被替换；但也意味着公司依赖一长串 PMS 和渠道管理器集成、OTA
              和评论网站数据源、直订工具，以及云基础设施。IsDown 记录的 2026 年 3 月 AWS UAE 宕机是一个有用提醒：即使事故频率看起来低，单次中断也可能打到客户日常使用的上传、报告和媒体工作流。


              最好的公开缓释因素扎实，但还不决定性。Lighthouse 宣传 98.2% 支持满意度、约 100 秒响应时间和 70+ 区间的 NPS，也有足够市场动能进入 2026
              年酒店科技奖项。但独立评价界面仍然重要，因为它们指向设置复杂、偶发数据不准确、价格不透明，以及大型客户实施周期更长。这些不是致命缺陷；它们正是平台扩张快于数据治理、支持和上线系统时会叠加放大的摩擦。对尽调来说，可靠性不能只看营销声明或信任中心是否存在。它必须通过事故历史、数据源质量，以及在企业规模上维护这些接口的真实经济性来判断。
