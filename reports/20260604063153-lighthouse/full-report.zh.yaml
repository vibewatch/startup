      - number: '6.2'
        title: 采用轨迹和公开规模证明
        blocks:
          - type: paragraph
            body: >-
              Lighthouse 有充足的公开采用叙事，但分母会随页面而变。合作伙伴和生态页面反复引用 185 个国家超过 65,000 家酒店；2025 年开发者解决方案发布把口径抬到 70,000+
              客户基础；Google Cloud 2026 年案例则称客户覆盖全球 80,000
              家酒店物业。这些数字方向一致——全球覆盖很大——但定义并不完全相同，因此很难把它们当作精确的活跃客户数。更清楚的是既有客户内的扩张路径。公开里程碑显示，Lighthouse
              已从定价和基准比较，扩到商业智能、直订、AI 接待工作流、渠道管理，再到 AI 发现。Rotana 的 79 家物业铺开、Tripla 的 1,000 客户日本预订引擎渠道，以及 Google Cloud 的
              BI Pro 案例都说明，Lighthouse 赢下的不只是点产品使用，而是更宽的商业技术栈采用。因此，最强的采用证据来自模块宽度、合作伙伴分销和具名多物业部署，而不是单一可审计的客户数指标。
