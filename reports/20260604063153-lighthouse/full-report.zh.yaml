  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险按严重程度排序：问题不是需求，而是规模化后的复杂度
        blocks:
          - type: paragraph
            body: >-
              Lighthouse 的公开足迹已经足够大，基础投资逻辑不再是产品是否解决真实问题。公司称平台在 185 个国家被超过 70,000 家酒店使用，公开材料指向 700
              多名员工，而自身产品界面如今覆盖定价、分销、基准比较、价差一致性、直订营销和合作伙伴 API。2024 年 11 月 KKR 领投的成长轮和更早的 2021 年 Series B
              都是强缓释因素，因为它们显示外部资本仍在资助平台扩张，而不是迫使公司收缩。


              但剩余风险已经不是简单的早期执行问题。公开证据指向四个更重的敞口。第一，Lighthouse
              所在的酒店定价品类正处在主动反垄断审查之下；即使判例法并不会默认否定每一种定价工具，法律和监管风险仍然存在。第二，公司扩展到更密集的个人数据处理、cookie、集成和跨境传输，抬高了隐私和治理负担。第三，平台价值依赖极大规模的数据管道和持续在线，因此数据质量或可靠性失败会直接传导到客户决策。第四，Lighthouse
              依靠资本支持的收购策略很清晰，但公开记录仍未披露 ARR、烧钱速度、利润率、现金跑道或客户集中度，金融模型风险仍明显解释不足。
