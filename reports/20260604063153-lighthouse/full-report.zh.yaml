      - number: '7.4'
        title: 人员、执行和金融模型风险：能力可见，经济性不可见
        blocks:
          - type: paragraph
            body: >-
              Lighthouse 的人员风险与其说是缺少领导层姓名，不如说是执行带宽。公司在财务、法务、安全、人力、产品和商业化等岗位上公布了真实班底，并在欧洲、北美、南美和 APAC
              多个枢纽运营。这是有意义的缓释因素，因为它说明组织已经不再只靠创始人。但一个覆盖 40 多个国家的全球团队，叠加 Series C
              后扩张和多次收购，也抬高了协同负担。运营问题在于，公司能否吸收新产品、新伙伴和新控制项，同时不拖慢交付质量，也不让问责碎片化。


              金融模型风险更难框定，因为公开记录方向强，但经济性很薄。两轮大额股权融资和一个招牌投资者是正面因素，KKR
              新闻稿也明确写出扩张计划本来就有收购性和全球化意图。公开材料没有显示的是反向砝码：ARR、烧钱速度、毛利率、现金跑道、客户集中度、续约耐久性，或把收购资产整合进统一技术栈的成本。评论市场又放大了这种不确定性，因为
              Lighthouse 往往按需报价，独立评论也暗示复杂部署可能要花数月。这并不证明模型弱；它意味着投资者仍在为一套资本支持的增长和整合策略承保，却缺少公开单位经济学证据，无法把 Lighthouse
              当成一个已充分去风险的软件复合体。
