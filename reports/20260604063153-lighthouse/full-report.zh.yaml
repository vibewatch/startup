      - number: '8.4'
        title: 最终尽调要求，以及什么会改变结论
        blocks:
          - type: paragraph
            body: >
              公开证据足以形成方向，但不足以承保规模或入场价格。最重要的缺失项是已审计 ARR 和 NRR，其次是股权结构经济性。Companies House
              文件显示了股份配发、抵押和治理变动，但没有披露投资者在下行退出中真正面对的分配瀑布。TrustRadius 也确认定价仍按报价提供，这意味着公开来源无法揭示 Lighthouse 收入中有多少来自企业、SMB
              或收购后交叉销售。


              这导向一条简单决策规则。只有当管理层能证明溢价增长、强留存和干净的优先股堆叠，或者入场价格下移到让隐含倍数更接近抓取到的公开可比范围时，才上调建议。如果数据室显示净留存弱、收购驱动的复杂度没有带来交叉销售，或优先股堆叠让下行保护很少，就下调为回避。在那之前，正确姿态是有纪律的好奇，而不是笃定下注。
                      
