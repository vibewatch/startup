      - number: '5.2'
        title: 数据摄取、预测架构与 AI 层
        blocks:
          - type: paragraph
            body: >-
              公开材料把 Lighthouse 描述为数据很重的平台，其防御性首先来自摄取规模。公司称每天处理 1.7 billion 条酒店价格、1.2 billion 次航班和酒店搜索，每天为 16.4 million
              家酒店和短租画像，并每天处理 400TB 原始数据。关键架构点不只是原始规模，还在于把外部市场信号与酒店侧运营数据结合起来。定价和预测内容反复把工作流描述为混合实时查价、前瞻旅行意图信号、竞品集合行为，以及内部
              PMS 或在手预订数据。Performance 随后通过 Smart Insights、Smart Compset、预算 / 预测工作流和组合仪表盘呈现同一套混合数据集。


              这意味着一套分层架构，至少有三个可见部分。第一是商业情报层，聚合外部价格、需求和分销信号。第二是酒店运营数据层，消化
              PMS、渠道管理器和预订上下文。第三是决策层，把这些输入打包成定价建议、异常、预测视图、价格一致性执行工作流和直连渠道动作。Lighthouse 没有发布深度后端系统白皮书，但 API
              文档和帮助内容已经足够具体，可以推断数据归一化和配置质量是核心依赖。


              AI 和预测被营销为决策支持，并越来越走向智能体执行。Pricing 和 Performance 都强调透明推荐，而不是黑箱输出。Revenue Agent 又进一步承诺，在 90 天前瞻窗口里 24/7
              扫描每天超过 3 billion 个数据点，同时酒店仍设定目标和护栏。因此，架构看起来正从以仪表盘为中心的分析，转向共享商业情报层；这层能力可以驱动多个特定工作流应用，并随着时间推移驱动多个协同智能体。
