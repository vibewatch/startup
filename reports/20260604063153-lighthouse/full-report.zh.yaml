      - number: '8.3'
        title: 情景、下行触发因素和退出路径
        blocks:
          - type: paragraph
            body: >
              乐观情景并非不可能，但需要比公开来源更高质量的证明包。要素已经存在：Lighthouse 从 2023 年的 65,000 家酒店扩到 2026 年 80,000 多家，叠加 HQ
              revenue、Stardekk 和 The Hotels Network，并在大型自有数据库之上推出 Revenue Agent。如果这些资产转化为交叉销售、更快 AI 增购和耐久客户
              ROI，公司可以证明高于更广泛旅行科技同行的倍数是合理的。


              基准情景更保守。如果 Lighthouse 的增长明显高于公开同行，私募买方或晚期投资者仍可能支持接近上一轮的估值；但如果没有已审计增长和留存数据，上行空间看起来受限。悲观情景更容易从公开证据中勾勒：2026
              年酒店定价趋势是混合的，而非普遍强劲；欧洲在转弱；定价不透明；公开反向证据指向 GTM
              压力。再叠加未知清算优先权和控股公司持续的备案活动，关键投资逻辑破裂触发因素就很清楚：增长不达规模、续约经济性差、收购后整合拖累，或优先股堆叠过重。因此，退出准备度在战略上中等，但在财务上不完整。
                      
