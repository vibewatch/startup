      - number: '6.5'
        title: 扩张渠道和集中度风险
        blocks:
          - type: paragraph
            body: >-
              Lighthouse 的扩张逻辑很清楚，就是先落地再扩张。公司先从定价、基准比较或 BI 切入，再扩到直订优化、KITT 驱动的宾客互动、渠道管理和 AI 发现。The Hotels Network
              收购、Stardekk 收购、ChatGPT 内 Connect AI 发布，以及 Hotelrank.ai 收购都支持这一判断：Lighthouse
              想拿下更多酒店商业技术栈，而不是停留在单一功能的收益管理工具。合作伙伴渠道是这一扩张动作的核心。Lighthouse 宣传在 20 多个国家有 165 个合作伙伴，API 计划围绕收入分成设计，并通过
              Shiji、Cloudbeds、BEONx、Apaleo、Tripla 以及 Rotana
              这样的集团部署完成集成。关键风险是，公开客户证明似乎偏向大型组合运营者和连接渠道的酒店集团，这意味着最大的收入池可能也在这些群体里。同时，独立酒店扩张仍是公司宣称的战略重点，尤其是在 Stardekk
              收购和评论网站上展示入门价格包装之后。由于 Lighthouse 没有披露头部客户敞口、企业与独立酒店收入结构，或合作伙伴 / 渠道集中度，投资者应假设扩张潜力真实存在，但集中度风险无法仅靠公开证据量化。
