      - number: '1.2'
        title: 创始人、领导层与治理信号
        blocks:
          - type: paragraph
            body: >-
              对这一级别的私营公司而言，Lighthouse 的创始故事有相对充分的公开支撑。Focus on Belgium 和 TNW 都把 Gino Engels、Matthias Geeroms、Adriaan
              Coppens 列为 2012 年在 Ghent 创办 OTA Insight 的三位创始人。不过，当前官方领导层材料不再同等突出三人：Matthias Geeroms
              仍公开以联合创始人和企业发展负责人身份出现，而公司的对外叙事现在主要由 CEO Sean Fitzpatrick
              主导。这种演进对后期规模化公司很正常，但也意味着公开创始人能见度收窄；剩余创始人持股、董事会影响力和日常经营权，需要私有材料而不是网站阅读来尽调。


              Sean Fitzpatrick 显然是核心高管。PhocusWire 称他在 HotSchedules 之后于 2018 年中出任 CEO；2023 年更名、2024 年 KKR 融资、2025 年
              Hotels Network 收购，以及 2026 年 ChatGPT 和 Hotelrank.ai 发布，他都是具名发言人。这个模式说明他不只是名义 CEO：他是公司最主要的资本市场叙事者，也是后 OTA
              Insight 战略最可见的架构师。关键人含义很直接。投资人承保的不只是数据平台，也是在承保 Fitzpatrick 持续整合收购团队、重塑产品栈，并向客户和资方可信解释下一阶段 AI 驱动增长的能力。


              治理披露比领导层披露更薄。2021 年 Series B 新闻稿明确点名 Spectrum Equity 的 Steve LeSieur 加入董事会，并列出当时投资人组合，但 KKR
              之后的公开材料没有列出现任完整董事会或控制权结构。公开信息可以确认的是，Lighthouse 的融资画像已经从早期风险投资转向后期成长股权 /
              私募股权。成熟化是资本获取上的正面信号，但董事会组成、投资人否决权、创始人稀释等问题仍然悬而未决，这些都是私营公司尽调文件必须回答的事项。
                       
