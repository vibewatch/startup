  - id: TR005
    title: 缓释与放弃标准表
    columns:
      - 风险
      - 可监测触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 算法定价 / 反垄断
        - 律师意见与产品控制证据
        - 管理层无法证明公开 / 非公开数据边界、推荐价格护栏和无投诉运营历史。
        - 将法律风险视为结构性而非理论性；在按高倍数增长承销前，要求先完成补救。
      - - 隐私与数据治理
        - 可审计的隐私栈
        - 缺少 DPA 包、子处理者清单、传输评估，或缺少被收购产品遵循同一控制的证据。
        - 假设隐私暴露上升快于治理成熟度，因而下调企业就绪度判断。
      - - 平台可靠性和数据质量
        - 事故与数据源质量趋势
        - 下一轮更新周期内，反复宕机、事后复盘迟迟无解，或客户持续投诉数据过期、 不准确。
        - 把规模从护城河重分类为脆弱点，并收紧对留存和增购的下行情景假设。
      - - 集成和合作伙伴依赖
        - 交易完成后的协同和合作伙伴健康度
        - Stardekk/THN 未带来可衡量的附加购买率、直接预订或分销收益，而合作伙伴依赖还在扩大。
        - 将 M&A 视为复杂度累积，而不是产品杠杆。
      - - 财务模型不透明
        - 私有经营指标
        - 管理层仍无法提供经审计的 ARR、毛利率、烧钱速度、现金跑道和集成成本证据。
        - 不要按现金效率高的复利增长来承销；应把公司按一家具备增长平台潜力、但经济性仍未厘清的企业估值。
      - - 耐久性和集中度
        - 留存与集中度披露
        - 到下一轮尽调周期仍没有按队列披露的留存、续约或头部客户集中度数据。
        - 维持较高风险评级，不要只凭客户规模就认定收入质量耐久。
    notes: 每条否决标准都刻意绑定到尽调中可核查的文件、指标或事件，而不是泛泛的战略担忧。
