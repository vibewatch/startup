companyProfile:
  summary: >-
    Lighthouse 是 OTA Insight 更名后的形态；OTA Insight 是创立于 Ghent 的酒店软件公司，最初做酒店定价情报，后来扩展为更广的商业情报平台，覆盖市场数据、商业智能、分销、直订优化和 AI
    驱动的发现。公开来源支持以下事实：2012 年创立于 Ghent，2023 年更名，2024 年 11 月由 KKR 领投约 $370 million 融资并达到独角兽估值，目前规模约为 80,000 家酒店和 700+
    名员工。公司战略位置看起来很强，但仍是披露较少的私营成长股权资产；公开证据更能证明品类领导力和平台广度，尚不足以证明当前软件经济性。
