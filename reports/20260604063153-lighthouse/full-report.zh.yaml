  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、品牌演进与运营版图
        blocks:
          - type: paragraph
            body: >-
              Lighthouse 2012 年以 OTA Insight 之名起步于比利时 Ghent，前十年专注酒店市场情报，随后扩展成更宽的商业平台。到 2026 年，公开材料里最稳妥的公司描述不是一家简单的单城
              SaaS 创业公司：创始故事、比利时员工规模和雇主品牌叙事仍指向 Ghent，而融资、CEO 媒体形象和 KKR 公告都把 Lighthouse 呈现为一家总部在
              London、抱有全球野心的公司。双重身份很关键：后续章节应把 London 视为当前公司与融资中心，把 Ghent 视为公司原始基地和仍有分量的运营枢纽，而不是硬用一个城市解释整个业务。


              2023 年从 OTA Insight 更名为
              Lighthouse，不只是换个名字。管理层称，旧名称已无法描述一个已经吸收早期收购、并从酒店查价走向更广商业智能、短租数据和工作流自动化的平台。到本报告运行日，公开产品叙事又向前延伸：首页仍围绕市场情报和收入增长，近期博客则把
              Lighthouse 描述为面向酒店业的 AI 商业操作系统。实际含义是，Lighthouse 向酒店商业团队销售经常性软件，但越来越把软件打包成覆盖定价、价格一致性、分销、直订和 AI
              可见性的多界面运营层，而不是单一模块。


              公开地点披露强化了多枢纽模型。招聘页面列出 EMEA 的 Ghent 和 Barcelona 枢纽、Brussels 和 Bruges 的其他办公室、北美的 Denver 和 Dallas 枢纽，以及 APAC
              的 Singapore 和 Kuala Lumpur 支点。上述披露与 Focus on Belgium 关于十二个实体以及美国、Spain 和 Singapore 桥头堡的描述吻合。本章后续工作应复用“总部在
              London、根在 Ghent、拥有广泛全球枢纽网络”作为最安全的高层身份表述，除非私下尽调拿到更精确的法律实体图谱。
                       
