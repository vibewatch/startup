  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: Lighthouse 的主要风险沿着数据质量、可用性和法律控制传导，最终影响客户留存和估值。
    data:
      nodes:
        - id: feeds
          label: 外部数据源
          detail: OTA、评论网站、社交和市场输入。
        - id: integrations
          label: 合作伙伴集成
          detail: PMS、渠道管理器和 API 连接系统。
        - id: platform
          label: Lighthouse 核心平台
          detail: 定价、BI、价格一致性、分销和直接预订技术栈。
        - id: quality
          label: 数据质量与可用性
          detail: 交付结果的准确性和可靠性。
        - id: compliance
          label: 法律与隐私控制
          detail: 反垄断、隐私、条款和治理边界。
        - id: customers
          label: 客户信任与采用
          detail: 价值兑现时间、续约和附加率。
        - id: economics
          label: 单位经济与烧钱
          detail: 留存质量、利润率和实施成本。
        - id: valuation
          label: 估值与融资灵活性
          detail: 有无透明度时，投资人如何给增长定价。
      edges:
        - from: feeds
          to: platform
          label: 供给市场和房价输入
        - from: integrations
          to: platform
          label: 推送和拉取运营数据
        - from: platform
          to: quality
          label: 把复杂性转成可交付结果
        - from: platform
          to: compliance
          label: 嵌入定价和数据使用决策
        - from: quality
          to: customers
          label: 错误或宕机会削弱信任
        - from: compliance
          to: valuation
          label: 监管悬念改变风险溢价
        - from: customers
          to: economics
          label: 留存和采用率决定效率
        - from: economics
          to: valuation
          label: 经济模型不透明会削弱投资判断信心
        - from: integrations
          to: quality
          label: 链路断裂会降低覆盖度和及时性
        - from: feeds
          to: compliance
          label: 数据来源和共享方式塑造反垄断 / 隐私风险
