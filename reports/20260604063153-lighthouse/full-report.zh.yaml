  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议、投资逻辑和价格纪律
        blocks:
          - type: paragraph
            body: >
              Lighthouse 是一个强产品和强规模故事，但公开证据还没有达到足以给出干净、由估值支撑的买入结论的门槛。投资逻辑的正面确实存在：KKR 在 2024 年底投入约 $370
              million，TechCrunch 报道估值超过 $1 billion，Lighthouse 称目前服务超过 80,000 家酒店，公司也已从定价智能扩到绩效、分销、直订优化和 AI
              智能体。Furaveri、HRI 和 Soho House 的客户故事都指向真实的工作流和收入价值，而这正是溢价倍数所需要的。


              反向逻辑同样具体。Lighthouse 仍不公开定价，通用公开评价深度很浅，而数据集中最尖锐的公开运营评论是一条 2025 年 12 月 RepVue 评价，描述 GTM
              失灵。公开收入证据也弱：唯一抓取到的美元收入估计来自一个声誉较低的聚合器，且与官方管理层和融资事实冲突。因此当前建议是继续研究，而不是买入或回避。问题不在于 Lighthouse
              是不是好软件；问题在于，晚期投资者若没有已审计 ARR、NRR 和优先股堆叠可见性，能否证明在 KKR 标记或更高价格买入是合理的。
                      
            claimRefs:
              - CV010
              - CV012
              - CV015
              - CV020
              - CV021
              - CV023
