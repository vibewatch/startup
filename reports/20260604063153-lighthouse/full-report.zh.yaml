      - number: '3.2'
        title: 能力广度让 Lighthouse 在覆盖面上占优，但专门厂商仍主导更窄评估，公开定价仍不透明
        blocks:
          - type: paragraph
            body: >-
              Lighthouse 最清晰的差异化主张是广度：公司把定价、商业智能、直订自动化，以及酒店加 STR 数据放在同一界面上销售。RateGain 在商业和分销情报上高度重叠，但进一步延伸到 OTA
              和其他旅行垂直。Duetto 和 IDeaS 更贴近 RMS 重心，强调 AI 定价、预测和利润优化。Revinate 和 Cendyn
              较少在原始房价算法上竞争，更多围绕宾客数据、转化和渠道规划竞争。这意味着很多 Lighthouse
              交易本质上是打包比较：一个宽平台，对上一组专门工具。公开价格发现无法帮助买方快速解决这些取舍。SourceForge 对比页面没有披露 Lighthouse
              公开定价；留存来源集中，其他企业级酒店供应商也普遍不透明。相比之下，Guesty Lite 和 PriceLabs
              等租赁原生工具至少暴露了摩擦更低的入门信号，即使它们并非完整服务酒店技术栈的直接同类替代品，也可能重置买方预期。
