      - number: '4.4'
        title: 下行情景信号、披露缺口与财务判断
        blocks:
          - type: paragraph
            body: >-
              下行情景不是“没有需求”，而是“披露的经济性不够”。公开来源给了 Lighthouse 一个有吸引力的收入叙事：庞大客户数、数据网络规模、清晰产品广度、值得注意的客户 ROI
              案例，以及足够资本获取能力来继续扩张。但核心承保数字缺失。没有公开毛利率桥，没有 CAC
              或回本披露，没有净留存或流失曲线，没有客户集中度披露，也没有可信公开现金跑道数字。即便是高层估计集合也很混乱：TechCrunch 和 Tracxn 指向约 $1 billion 估值，Tech Funding
              News 使用 $2.4 billion 标题，GetLatka 称 2025 年收入达到 $101 million、员工 918 人，而 Tracxn 列出英国法律实体 2023 年收入为 $52.8
              million。这些都是有用的方向性标记，但不是干净的合并账本。


              终端市场条件又叠加一层风险。Lighthouse 自己的 2026 年 Q2 市场更新显示，约一半跟踪目的地在降价，Europe 在减速，Gulf
              定价受到地缘政治扰动冲击。独立酒店媒体也描述了更短预订窗口和更波动的旅客行为；这会同时支撑 Lighthouse
              需求，又让酒店科技预算更看重业绩。由此得出的判断是：收入质量和毛利率潜力偏正面，但还没到可承保状态。Lighthouse
              看起来像一个具备规模的软件加数据平台，拥有可信企业价值、强战略支持方，以及来自收购的实质交叉销售可选性。它尚未披露实际定价、留存、毛利率或现金跑道数据，无法在没有管理层数据室证据的情况下证明经济性耐久。
