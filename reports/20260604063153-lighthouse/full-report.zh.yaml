      - number: '1.3'
        title: 资本形成、规模指标与披露质量
        blocks:
          - type: paragraph
            body: >-
              对一家私营酒店软件公司来说，Lighthouse 的公开融资历史异常清晰，尽管仍不完整。2021 年 Series B 很直观：OTA Insight 从 Spectrum Equity 融资 $80
              million，公开材料称累计融资达到 $100 million，Steve LeSieur 加入董事会。2024 年 KKR 交易在规模和用途上同样有较充分记录，KKR 与二级报道都指向一轮约 $370
              million 的成长轮 / Series C 融资，用于产品创新、收购和全球扩张。合并这两个锚点后，最可辩护的公开“累计融资”约为 $470
              million。这个数字足以支撑第一章快照，但仍应称为估计值，因为当前来源并未逐笔拆出 Series B 之前的所有早期支票。


              规模披露既亮眼，也不完美。官方和半官方来源支持以下口径：KKR 轮前后有 70,000+ 家酒店业提供方 / 物业，2026 年达到 80,000+ 家酒店，覆盖 185 个国家，员工 700+，每天处理超过
              400TB 原始旅行数据。首页还补充每天采集 1.7 billion 条酒店价格，并画像 300,000+
              家竞品酒店。商业情报平台拥有这些资产很有意义，因为它们意味着数据广度、客户密度和品牌分发。但同一证据基础也暴露披露漂移：部分 2026 页面仍写 70,000+ 酒店经营者，而 Google Cloud
              案例研究使用更高的 900+ 员工口径。正确的分析做法是，用最新公司自有数字做标题视图，同时承认公开页面并未完全同步。


              收入披露明显弱于融资披露。Sean Fitzpatrick 曾告诉 PhocusWire，Lighthouse 到 2025 年收入已经远高于 $100
              million；这是有用的方向性证据，说明业务已不再小规模。但公开资料没有经审计 ARR、没有公开毛利率画像、没有净留存数字，也没有正式财务报表包。因此，第一章可以合理称 Lighthouse
              为一家私营、后期、独角兽规模且收入可观的公司，但不能把它称为完全透明的软件发行人。
                       
