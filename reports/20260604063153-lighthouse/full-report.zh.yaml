      - number: '6.3'
        title: 具名部署和 ROI 证明
        blocks:
          - type: paragraph
            body: >-
              Lighthouse 的客户证明不只是一个 logo 墙。多篇 2026 年可见案例研究发布了直接绑定工作流的运营或财务结果。Cititel 在马来西亚 10 家物业使用
              Lighthouse，并称其提前三周发现吉隆坡需求激增，提高了定价准确性，把收益管理从被动转为主动。THE THIEF 报告，AI 驱动的直订个性化节省了 €26,000 促销支出，来自低意向用户的收入为
              €30,545，影响了 40+ 笔预订，并带来 25% 转化率提升。Penta 的 KITT 部署在七周内处理 5,487 通电话，半数电话无需人工介入即可自动化处理，支持 22 种语言，并获得 8.3/10
              满意度评分。iH Hotels 称 Lighthouse 每天至少节省两小时，并支持 ADR 同比约 5% 改善；Leonardo Hotels Poland 则把几个百分点的 ADR
              增长、更强的早餐和半膳组合，以及需求高峰中避免严重低价归功于 Lighthouse。组合规模的 BI 证明也可信：Lotte 将 37 家物业集中到平台上，Highgate 引用一个测试物业 7.4% RGI
              改善，价值约 $400,000。限制在于，这些证明大多仍由公司发布，目录和合作伙伴引用之外的独立佐证有限。
