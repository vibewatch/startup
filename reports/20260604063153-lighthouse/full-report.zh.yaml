      - number: '2.4'
        title: 采用驱动因素与约束
        blocks:
          - type: paragraph
            body: >-
              需求环境支持商业科技继续支出，但前提是 ROI 明确。AHLA 预计 2026 年美国酒店宾客支出接近 $805 billion；Expedia 和 Airbnb 进入当年时都报告住宿量健康增长。AirDNA
              同样预计美国短租房源 2026 年继续增长，即便入住率转弱，ADR 仍会上行。这些条件利好能帮助运营商动态定价、监控替代住宿竞争并减少佣金流失的软件。与此同时，业主仍受利润率约束。AHLA 称 GOPPAR
              仍只有 2019 年水平约 90%，HVS 则认为，劳动力、保险、公用事业和品牌标准成本结构性走高，正在压缩利润，并迫使业主更主动审视运营商费用和技术 ROI。因此，市场观点偏冷很重要：CoStar 的 2026
              酒店预测显著比 PwC 保守，供应商不能只围绕一条公认复苏曲线销售。AI 是最明确的结构性顺风。Mews 称 98% 酒店经营者在过去六个月使用过 AI，IDeaS 称 89% 计划推出新的 AI 应用，PwC
              称 44% 消费者已用 AI 工具比价。但 AI 也带来治理、信任和数据质量门槛。Mews 称 41% 酒店经营者仍没有正式 AI 政策；Mews、SiteMinder 和 Lighthouse
              都认为，在智能体订房世界里，结构化数据、开放 API 和 AI 可读库存正在成为进入发现层的前提。
