      - number: '2.5'
        title: 矛盾与证据缺口
        blocks:
          - type: paragraph
            body: >-
              两组矛盾应被保留，而不是抹平。第一，近期住宿需求在改善，但公开的 2026 酒店展望差异很大：CoStar 模型预测美国 RevPAR 仅增长 0.6%，PwC 模型为 2.9%。第二，已发布软件 TAM
              从几十亿美元到接近 $20 billion
              不等，差异取决于发布方统计的是全部酒店软件、仅收入管理软件，还是商业技术的更宽代理口径。这些差异不是四舍五入误差，而是说明真正的尽调任务是品类归一化。缺失数据主要是私有数据。公开材料没有披露 Lighthouse
              在酒店、短租和数据服务之间的收入组合；没有披露企业连锁 ACV 或实施成本；也没有量化预算权如何在物业团队、管理公司、业主和 IT 之间拆分。结果是：市场存在性逻辑很强，采用驱动逻辑也可信，但 TAM / SAM
              / SOM 结论只能受约束。再往上的精度需要管理层数据和客户访谈，而不是另一份辛迪加报告。
