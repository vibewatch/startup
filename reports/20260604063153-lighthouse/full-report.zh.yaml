      - number: '7.2'
        title: 监管、法律、隐私和数据权利风险：边界真实存在，部分文件仍显陈旧
        blocks:
          - type: paragraph
            body: >-
              这里的法律表面比普通点解决方案更宽。Lighthouse 2026 年隐私政策识别了英国控制者，披露会收集身份、财务、技术、使用和营销数据，并明确设想会与集成第三方共享，以及用充分性认定、SCC
              和约束性公司规则等机制，把数据传输到英国、EEA 和瑞士之外。2026 年条款还把产品定义为面向定价、分销和营销决策的云平台，禁止未经许可的自动化提取，保留基于制裁的暂停权，并允许提前 30
              天通知产品终止。这些条款站得住脚，但从投资者视角看，也说明合同层承载了大量法律、平台和客户权利负担。


              更尖锐的风险来自品类背景。FTC 和 DOJ 已经告诉法院，酒店不能用算法去做人做会违法的事；MIT Sloan 和 Wilson Sonsini
              也都把酒店算法定价视为一个正在发生的反垄断设计问题，而不是假设情景。Lighthouse 没有在这些材料中被点名，Wilson Sonsini 2025 年分析也是一个重要缓释因素，因为其称在相关 Ninth
              Circuit 案件中，简单的独立订阅本身不足以构成问题。即便如此，Lighthouse
              自身产品叙事依赖定价智能、市场数据和共享行业工作流，因此法律负担在于证明：公开数据与私有数据的使用边界有纪律，客户护栏足够清晰。治理卫生也并不完美：反贿赂政策仍沿用旧的 Social
              Significance/OTA Insight 命名，现代奴隶制声明依赖供应商自审而没有书面认证；合起来看，这是可控但真实的文档控制风险。
