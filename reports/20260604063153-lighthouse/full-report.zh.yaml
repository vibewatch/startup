  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: Lighthouse 竞争的不是单一品类，而是直接 RMS 对手、基准数据存量玩家和工作流相邻者
        blocks:
          - type: paragraph
            body: >-
              Lighthouse 销售的是宽口径商业情报承诺，因此竞争集合比经典酒店 RMS 更宽。直接对手包括 RateGain、Duetto 和
              IDeaS，它们在定价、预测或市场情报工作流上各有重叠。相邻竞争者从其他采购中心进攻：Revinate 和 Cendyn 掌握直连需求、CRM 或渠道规划预算；STR / CoStar
              掌握基准数据和竞品集合权威；Mews、Cloudbeds 等 PMS 套件也越来越把房价管理打包进运营核心。替代住宿里，重叠再次扩大。Lighthouse 自称在一个平台里合并实时酒店和短租数据，但
              PriceLabs、Beyond、AirDNA、Guesty 和 Hostaway 都显示，STR 原生供应商如今也把动态定价、渠道管理和分析打包，这会影响公寓式酒店和混合运营商。净效果是，Lighthouse
              并不是在一个整齐的“查价工具”市场里销售；它是在争夺酒店商业运营层的所有权。
