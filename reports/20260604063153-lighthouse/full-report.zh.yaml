      - number: '5.4'
        title: 信任、隐私与技术风险
        blocks:
          - type: paragraph
            body: >-
              Lighthouse
              有一些有分量的公开信任信号，但深度仍不够；一个安全意识强的企业买家，要在全球范围内标准化采用，理想情况下会要求更多材料。公司有公开的信任中心入口，发布了详细隐私政策，在「关于」页面列出首席信息安全官，并说明
              Channel Manager 查看支付卡数据时需要 MFA/2FA 等运营控制。隐私政策还写清了控制者身份、收集的个人数据类别、处理的法律依据、包括充分性认定和 SCC
              在内的国际传输机制，以及法律要求下的数据泄露通知承诺。也就是说，隐私和安全治理确实已经是正式运营职能。


              缺口同样关键。已抓取的公开信任材料没有给出清晰的公开认证矩阵或事故历史档案，本轮审阅材料也没有发现公开 SLA，或自托管 / 私有云部署选项。API 文档罕见地直白：API
              主要用于报告，而不是实时商业应用；商业可视化需要书面同意。这是有用的治理约束，但也说明，部分客户的设想会超出公开开发者界面原本要支持的范围。


              因此，技术风险集中在集成质量、跨模块复杂度和验证深度。Lighthouse 自己的设置文档显示，定价自动化仍要靠正确的 PMS 映射、OTA
              偏移和最低价配置。外部评价证据偏弱，也指向学习曲线和实施负担：没有专门收益运营能力的团队会更吃力。公司的 AI
              叙事强调透明和人工控制，方向上是好事，但公开材料仍留下几个问题：认证覆盖到哪里，收购模块之间的子处理方边界如何划分，以及当客户把定价、分销、直接个性化和智能体工作流一起落地时，整个更大平台是否能稳定协同。
