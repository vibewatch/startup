  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代品
        blocks:
          - type: paragraph
            body: >-
              Lighthouse
              并不面向整个旅行市场销售；它切入的是帮助住宿运营商更好地决定商业动作的软件层。公司把自己描述为覆盖市场洞察、商业智能、定价和渠道管理的商业平台，因此已经超出传统查价，进入需求感知、竞品对标、定价执行和分销控制这条更宽工作流。按实际支出口径，纳入边界包括定价优化、竞争情报、商业智能仪表盘、渠道管理、直订优化，以及把这些决策连接到
              PMS、CRS 和订房渠道所需的集成。狭义核心之外排除 PMS、安全、楼宇自动化和通用宾客服务系统，除非它们直接影响定价或分销结果。度假租赁也应放进实际竞争边界：Lighthouse
              的定价产品明确合并酒店和短租价格，公司还称 45% 旅客会比较两者。这意味着，酒店收入团队越来越是在同一套住宿决策集合里竞争，集合中包括酒店、短租、OTA 和 AI 介导的发现层，而不是彼此隔离的筒仓。
