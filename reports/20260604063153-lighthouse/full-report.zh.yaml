  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分群、买方和覆盖范围
        blocks:
          - type: paragraph
            body: >-
              Lighthouse 主要卖给酒店商业团队，而不是泛 IT
              采购方。从官网、组合案例到合作伙伴生态页面，反复出现的用户是收益经理、分销负责人、中央商业团队、销售和营销经理，以及面向业主的资产或组合运营者。漏斗顶部的公开分群很明确：一边是集团、连锁和大型酒店，另一边是独立和较小酒店；管理公司和数据服务买家则作为相邻分群出现。具名客户也强化了这种宽度：Highgate、Rotana
              这样的大型组合运营者，与 Cititel、Primehotels、Leonardo Hotels Poland、iH Hotels、Lotte Hotels & Resorts 等区域连锁并列；直连渠道 AI
              案例来自 THE THIEF、The Sofia Hotel、Stella Hotels
              等精品和度假品牌。地域上，公开证明覆盖北美、欧洲、北欧、中东、日本、韩国、马来西亚和希腊。结果是，客户基础看起来按物业类型和地域都较分散，但权重仍明显落在运营多物业或多市场定价、分销工作流的商业团队，而不是只买一个窄点产品的业主运营者。
