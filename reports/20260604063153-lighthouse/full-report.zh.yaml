  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型、产品货币化与定价透明度
        blocks:
          - type: paragraph
            body: >-
              Lighthouse 明确销售商业情报软件，但公开记录描述的是产品套件，而不是披露过的收入桥。官方材料围绕 Lighthouse Pricing、Lighthouse Performance、Data
              Solutions、由合作伙伴支持的集成，以及通过收购纳入平台的直订或渠道管理能力。Data Solutions 很重要，因为它把买方集合从酒店运营商扩展到 OTA、投资人、DMO 和酒店科技合作伙伴；这让
              Lighthouse 看起来不像单产品酒店 SaaS 供应商，更像应用加数据的组合业务。Revenue Agent
              进一步透露了货币化架构：管理层将其免费提供给现有客户，暗示逻辑是打包扩张和留存，而不是立刻拆成单独付费 SKU。


              缺失的是承保级价格表。官方产品页销售结果、演示和功能深度，却不提供数字价格卡。ToolRadar 独立得出同样结论，并明确把无法获得定价细节列为产品最大的公开缺点。不过，客户证明仍显示 Lighthouse 按
              ROI 叙事销售：Soho House 称新增收入超过月订阅费，HRI 称平台具备成本效益，Furaveri
              把定价和价格一致性工具使用与直订增长联系起来。这足以得出结论：公司通过付费软件和数据订阅变现，并很可能向新的直订和 AI 模块交叉销售；但还不足以计算实际 ASP、折扣或模块级经常性收入组合。
