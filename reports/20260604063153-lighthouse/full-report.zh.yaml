  - id: TP001
    title: 竞争对手画像表
    enumerationScope:
      coverage: partial
      basis: >-
        Rows cover the most commercially relevant direct, adjacent, and substitute options evidenced in retained
        2024-2026 public sources for hotel commercial-intelligence buying decisions.
    columns:
      - 竞争对手或类别
      - 类别
      - 规模或证据
      - 目标细分市场
      - 差异化
      - 局限
    rows:
      - - Lighthouse
        - 直接平台领导者
        - 70k+ 家酒店，覆盖 185 个国家；每日采集 1.7B 条酒店房价；每日处理 400TB+ 数据
        - 连锁、集团、独立酒店和酒店 / STR 混合运营方
        - 单一商业界面覆盖市场洞察、BI、定价、价格一致性和直订自动化，并接入酒店 + STR 数据
        - 无公开定价，也未披露硬切换成本护城河
      - - RateGain
        - 直接商业情报和分销同业
        - 保留的对比文本显示 100+ 个国家 1,400+ 客户；官网定位为跨旅游平台
        - 酒店商业团队，以及 OTA 和更广泛的旅游卖方
        - 房价情报、价格一致性、预订引擎、渠道管理器和连接深度都强
        - 旅游范围更宽，可能削弱其相对 Lighthouse 的纯酒店定位
      - - Duetto
        - 直接 RMS 专家
        - 60+ 个国家 6,000+ 家酒店和赌场物业
        - 酒店、赌场、度假村和精选服务运营方
        - AI 定价、利润、团队业务和预测栈深
        - 酒店 + STR 广度或宾客营销所有权证据较少
      - - IDeaS
        - 直接 RMS 既有厂商
        - 31,000+ 家物业；107 个集成；169 个国家；98% 留存率
        - 独立酒店、全球组合、邮轮和停车运营方
        - 装机基础大，预测积累深
        - 较少被定位为一体化商业或直销需求套件
      - - Revinate
        - 邻近宾客商务栈
        - 12,500+ 家酒店；1.1B 个宾客档案；$24B 直销收入
        - 优化宾客数据、消息触达和预订销售的酒店
        - 掌握直订、CRM 和语音渠道工作流
        - 与市场房价和价格一致性情报重叠较弱
      - - Cendyn
        - 邻近商业规划栈
        - Google Hotel Ads 连接证明和低层级 BI 排名证据
        - 需要需求、分群和渠道规划支持的品牌
        - 争夺商业工作流和直销需求预算
        - 留存公开证据对具体 RMS 深度和套餐说明较薄
      - - STR / CoStar Benchmark
        - 既有基准对标与数据层
        - 基准样本含 94,000 家酒店和 12M 间客房
        - 业主、运营方、品牌、财务、开发和收益团队
        - 在收入、费用、利润和生命周期视角上具备基准权威
        - 不是完整端到端定价和宾客转化操作系统
      - - PMS 套件（Mews / Cloudbeds / Oracle 类）
        - 间接替代品和潜在进入者
        - Mews 在 85+ 个国家有 5,500+ 客户；Cloudbeds 将收入和分销列为核心工作流
        - 偏好单一运营记录系统的运营方
        - 在单一平台包中整合运营、定价和分销
        - 第三方市场数据深度通常弱于 Lighthouse 或 STR
      - - STR 定价和数据工具（PriceLabs / Beyond / AirDNA）
        - 邻近重叠
