      - number: '4.3'
        title: 资本充足性、PE 支持与收购融资扩张
        blocks:
          - type: paragraph
            body: >-
              资本故事强于经营披露。Lighthouse 在 2021 年 $80 million Series B 之后，于 2024 年 11 月宣布约 $370 million KKR 领投 Series
              C；Lighthouse、KKR 和 Business Wire 的资金用途表述一致：扩展 AI 和数据能力、继续收购资产、全球增长。这给了 Lighthouse
              可观的标题融资，也同样重要地给了它一位具备私募股权式模式识别和组合支持能力的赞助方。英国实体层面的所有权图景也更像机构控制，而不是创始人控制：Companies House 显示，HCI / TCP OTA
              Holding Ltd 持有超过 75% 股份和投票权，并保留董事任命权。


              不过，轮后记录也显示公司依赖融资，而不是完全自我供血。2025 年 4 月，英国实体提交了一股配售，现金实缴 £7.43 million，并在同日设立以 BSP Agency, LLC
              为受益人的有担保押记。这些文件证明，在头部融资之后，新资本和担保安排触达了运营边界，但没有披露集团不受限现金、债务服务要求或现金跑道。与此同时，Lighthouse 继续把 M&A 作为增长杠杆。HQ
              revenue 在 2024 年拓宽平台；The Hotels Network 在 2025 年增加直订和个性化能力；Tracxn 和 TechCrunch 提到更多已收购资产，如 Stardekk，以及
              Transparent 和 Kriya RevGen 等早期整合。PE 支持、持续法律实体融资活动和收购驱动扩张放在一起，说明 Lighthouse 并不明显受资本约束，但资本仍是模型里的战略要素，而非附带事项。
