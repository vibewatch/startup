      - number: '4.2'
        title: GTM 动作、成本结构与单位经济代理指标
        blocks:
          - type: paragraph
            body: >-
              Lighthouse 不披露 CAC、回本周期、净留存或毛利率，因此本章必须从运营代理指标出发。最强的正面信号来自客户结果和工作流压缩。Lighthouse Pricing 和 Performance
              销售的是速度，不只是劳动力替代：365 天前瞻需求视图、实时查价、动态竞品集合、AI 推荐和组合仪表盘，都是为了帮助收入团队更早行动、减少手工拉报表。公开案例研究用一些数字支撑了这个叙事。Furaveri 将
              215% 直订改善归因于价格一致性监控，HRI 描述平台直接向收入管理系统供数，Soho House
              称每日手工查价工时消失，订阅价值被增量收入覆盖且有余。这些是供应商撰写的结果，单独不足以承保回本周期，但确实支持一种与可测酒店经济性绑定的咨询式企业销售动作。


              成本侧更容易描述，难以量化。官方材料指向全球员工、分布式支持，以及覆盖众多 OTA、PMS
              和渠道连接的合作伙伴与集成网络。招聘页面还显示全球办公室、福利和人才获取机器，这些都意味着薪酬、入职、客户支持和合作伙伴维护是主要运营费用。数据规模很可能也是有意义的成本中心：Lighthouse
              反复引用数十亿级价格或信号、数百万级房源、每天数百 TB 处理量，如今 Revenue Agent 又处理每天超过 3 billion
              个数据点。这个组合通常支持强软件毛利率潜力，但公开披露没有说明数据获取、计算、支持和集成成本之后，Lighthouse 是保有 SaaS 式毛利率，还是明显更低。
