  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: 公开证据显示，Lighthouse 先解决日常定价或报告痛点赢得客户，再扩展到直订、渠道管理和 AI 驱动的发现。
    approximationNotes: 该图综合多份案例研究和合作伙伴披露；它呈现的是复合客户动作，不是单一强制部署路径。
    data:
      items:
        - label: 识别收入痛点
          actor: 收入经理 / 商业负责人
          touchpoints:
            - Rate Insight
            - 基准分析
            - 竞品房价可见性
          painpoint: Manual comp-set tracking, parity leakage, and weak forward visibility slow daily decisions.
          opportunity: Lighthouse wins attention by promising faster rate, demand, and market intelligence.
        - label: 接入核心工作流
          actor: 收入、分销或组合运营者
          touchpoints:
            - PMS / RMS 合作伙伴
            - Cloudbeds / Shiji / Apaleo / Tripla 集成
            - 实施支持
          painpoint: Data lives in disconnected systems and must be compiled manually.
          opportunity: Partner integrations and dashboards create a single source of truth for pricing and performance.
        - label: 跑日常定价 / BI 动作
          actor: 单店或中央收入团队
          touchpoints:
            - Pricing
            - Performance / BI
            - 平价和附加费用可见性
          painpoint: Teams need to react to demand spikes, events, and channel leakage before competitors do.
          opportunity: Case studies show time savings, ADR improvement, and better event-driven pricing.
        - label: 扩展到面向客人的直销渠道
          actor: 营销负责人 / 预订经理
          touchpoints:
            - Lighthouse Direct
            - KITT AI 接待员
            - The Hotels Network
          painpoint: Hotels want more direct bookings without broad OTA-discounting or more headcount.
          opportunity: Personalization and AI reception workflows create measurable direct-booking and automation ROI.
        - label: 扩大分销控制
          actor: 商业平台负责人
          touchpoints:
            - Channel Manager
            - 200+ 个预订渠道
            - 400+ 个技术伙伴
          painpoint: Inventory, rate, and promotion control are fragmented across channels.
          opportunity: Lighthouse positions channel management as the next layer of automation and margin protection.
        - label: 进入 AI 发现循环
          actor: 商业策略 / 直订负责人
          touchpoints:
            - Connect AI
            - ChatGPT app
            - Hotelrank.ai 可见性分析
          painpoint: Hotels risk ceding demand capture to OTAs and AI intermediaries.
          opportunity: Lighthouse is trying to become the operating layer for direct AI discovery and booking.
    claimRefs:
      - CU001
