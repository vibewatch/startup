evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: exact headcount
    missingEvidence: >-
      A management-confirmed current employee count and by-region allocation that reconciles 700+ and 900+ public
      references.
    whyItMatters: >-
      Headcount is a core scale and burn proxy for a late-stage private software company and affects operating-leverage
      analysis.
    diligencePath: Request latest org/headcount report or HR dashboard export as of the run date.
    relatedQuestionRefs:
      - QO007
  - type: private-evidence-only
    severity: material
    topic: audited financial profile
    missingEvidence: Audited revenue, ARR, gross margin, EBITDA, and cash-burn disclosures.
    whyItMatters: >-
      A single CEO interview saying revenue is well north of $100M is directionally helpful but not enough to underwrite
      efficiency or valuation.
    diligencePath: Request board deck, audited financial statements, or lender/investor information rights package.
    relatedQuestionRefs:
      - QO014
  - type: private-evidence-only
    severity: material
    topic: board and control rights
    missingEvidence: Current board list, ownership percentages, investor consent rights, and any KKR-specific governance terms.
    whyItMatters: >-
      Capital formation is clear, but without control-rights detail it is impossible to judge founder influence,
      investor alignment, or exit constraints.
    diligencePath: Request cap table, shareholder agreement summary, and current board observer/member roster.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: minor
    topic: headquarters phrasing
    missingEvidence: >-
      A single authoritative corporate-entity statement reconciling London corporate leadership with Ghent roots and
      Belgian operating presence.
    whyItMatters: >-
      Most analysis can work with the dual-footprint description, but legal and tax diligence will need exact entity
      mapping.
    diligencePath: Pull corporate registry filings and entity charts for UK and Belgian operating companies.
    relatedQuestionRefs:
      - QO006
  - type: missing-source
    severity: minor
    topic: hq revenue acquisition terms
    missingEvidence: >-
      A primary announcement or secondary report with date, target description, and transaction rationale for HQ
      revenue.
    whyItMatters: >-
      HQ revenue is supportable as part of recent M&A history, but without detail its strategic value and integration
      burden are hard to assess.
    diligencePath: Request acquisition list from management or locate deal documentation via investor/press archives.
    relatedQuestionRefs:
      - QO020
    relatedTableRefs:
      - TO004
  - type: conflicting-data
    severity: material
    topic: market-sizing
    missingEvidence: >-
      A normalized bottom-up model that reconciles broad hotel-software TAM estimates with much larger syndicated RMS
      estimates and isolates pricing, BI, and channel-management spend.
    whyItMatters: >-
      Valuation work will look very different depending on which category boundary is used. Current public estimates are
      not directly comparable and can overstate or understate the true addressable market.
    diligencePath: >-
      Request analyst methodology appendices and triangulate with public vendor revenue disclosures across RMS, BI,
      channel management, and PMS vendors.
    relatedQuestionRefs:
      - QM027
      - QM028
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: lighthouse-segment-mix
    missingEvidence: >-
      A public breakdown of Lighthouse customers and ARR by hotels, vacation rentals, data solutions, and chains versus
      independents.
    whyItMatters: >-
      Without segment mix, market share and cross-sell assumptions are guesswork even if the category narrative is
      strong.
    diligencePath: >-
      Ask management for customer count, ARR, and installation mix by product and lodging segment, plus expansion rates
      across those cohorts.
    relatedQuestionRefs:
      - QM029
  - type: private-evidence-only
    severity: material
    topic: enterprise-acv
    missingEvidence: >-
