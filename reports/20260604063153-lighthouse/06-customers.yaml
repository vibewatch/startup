- id: TU006
  title: Review and complaint signal table
  columns:
  - Source
  - 2026-visible signal
  - What it proves
  - Complaint / adverse note
  - Reliability limit
  rows:
  - - FeaturedCustomers
    - 71 testimonials, 42 case studies, 13 videos, 4.8/5 from 1,832 reference ratings
    - Large public advocacy surface and many named hospitality references
    - Directory curation naturally tilts positive
    - Not a substitute for direct customer calls or raw renewal data
  - - TrustRadius
    - 2 reviews and 10/10 score
    - Some independent validation exists outside company pages
    - Review count is too thin to generalize sentiment
    - Very small sample size
  - - Capterra UK
    - 4 reviews with mostly positive ease-of-use commentary
    - Independent reviewers support usability and rate-shopping value
    - One reviewer says the software is not promoted in all regions
    - Small sample and mixed vintages (2019–2023 reviews)
  - - SoftwareFinder
    - Independent overview with pricing bands and implementation estimate
    - Useful as a neutral check on packaging for independents
    - Calls out detailed initial configuration and possible implementation expense
    - No user-review corpus on the fetched page
  - - Homepage testimonials / support metrics
    - Named hotel quotes plus 100-second support-response claim
    - Company shows recognizable customers willing to be quoted and highlights customer service
    - Promotional surface; no independent audit of support metric
    - Official marketing page by definition
  notes: Adverse public evidence exists, but it is mild and mostly limited to setup, transparency, and sample-size concerns rather than severe public churn or deployment failures.
