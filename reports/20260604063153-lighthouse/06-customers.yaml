- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Pricing / BI land-and-expand
    - Many named proofs start with pricing or BI and then widen to more modules
    - Positive for ACV expansion and switching cost; hard to quantify without NRR or module attach data
    - Request module attach rates and average account expansion by cohort
  - - Direct-channel stack expansion
    - Lighthouse now sells personalization, KITT, The Hotels Network, and ChatGPT / Connect AI workflows on top of core pricing
    - Positive for wallet share, but newer modules may have lower renewal maturity than core pricing
    - Request module-specific retention, attach, and gross margin by product line
  - - Partner and PMS ecosystem dependence
    - 165 partners, 200+ channels, and heavy reliance on integrations with PMS / RMS / booking engines
    - Creates scalable distribution but exposes Lighthouse to partner concentration and integration-priority risk
    - Request ARR sourced via top five partners and churn impact from major integration outages
  - - Portfolio-operator skew
    - Named proofs are concentrated in multi-property groups and management companies such as Highgate, Lotte, Rotana, Cititel, Primehotels, and Leonardo
    - Could imply enterprise revenue concentration even if logo count is broad
    - Request top-customer and top-20-customer ARR concentration plus share from chain / group accounts
  - - Installed-base denominator drift
    - Public surfaces cite 65,000 hotels, 70,000+ customers, and 80,000 hotel properties
    - Makes topline adoption look strong but limits precision on actual active paying accounts
    - Request a board-level definition of customers, hotels, properties, and live endpoints
  - - Sparse public renewal economics
    - No public NRR, GRR, churn, or contract-length data despite strong case-study surface
    - Prevents firm judgment on durability and downside concentration
    - Request renewal cohorts, contract duration, and gross retention for pricing, BI, and direct-booking products
  notes: This table combines upside expansion vectors with the main concentration and opacity risks they create. It is not a substitute for customer cohort reporting.
