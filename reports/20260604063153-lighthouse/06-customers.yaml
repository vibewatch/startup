- id: retention-satisfaction-and-adverse-signals
  title: Retention, Satisfaction, and Adverse Signals
  body: 'Public retention evidence is materially weaker than public adoption proof. Lighthouse offers several positive proxies: the homepage advertises a 100-second average support response time and quotes named users from Furaveri Maldives, HRI Properties, Six Senses Douro Valley, Radisson Dubai DAMAC Hills, and Soho House & Co.; the Apaleo marketplace listing claims 98.2% of customers rate support as great or amazing; Penta reports 8.3/10 guest satisfaction for KITT interactions; FeaturedCustomers aggregates 71 testimonials, 42 case studies, 13 videos, and a 4.8/5 reference score. Independent review breadth is still thinner than the marketing surface suggests. TrustRadius shows only two reviews, and Capterra UK shows four reviews with one explicit complaint that Lighthouse is not promoted equally across regions. SoftwareFinder adds a mild implementation caveat, noting that initial data configuration may be detailed and additional implementation expense may apply. None of the reviewed public
    sources disclose net revenue retention, gross revenue retention, contract duration, renewal cohorts, or logo churn. That means public satisfaction can support a view that customers generally like the product, but it cannot underwrite durability economics in the same way that disclosed NRR or renewal data would.'
