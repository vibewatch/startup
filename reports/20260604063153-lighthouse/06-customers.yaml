  title: Retention / repeat usage / satisfaction table
  columns:
  - Metric
  - Value
  - Segment / scope
  - Confidence
  - Diligence ask
  rows:
  - - Net revenue retention
    - null
    - All Lighthouse customers
    - Low
    - Request NRR by core module family and by enterprise vs independent segment
  - - Gross revenue retention / logo churn
    - null
    - All Lighthouse customers
    - Low
    - Request annual logo churn, gross retention, and gross dollar retention by cohort
  - - Average support response time
    - 100 seconds
    - Homepage-wide support promise
    - Medium
    - Verify if metric is median or average and request sample size / time window
  - - Support satisfaction proxy
