  title: Customers
  summary: Lighthouse shows broad hospitality reach across chains, portfolio operators, and smaller independents, with 2026-visible public proof from Cititel, Leonardo, iH Hotels, Penta, Lotte, Highgate, Aperture, and direct-booking customers such as THE THIEF and Stella Hotels. Public evidence is strongest on workflow ROI and module expansion—pricing, business intelligence, direct booking, KITT, channel management, and AI discovery—while exact installed-base, retention, and concentration economics remain opaque because public surfaces drift between 65,000 hotels, 70,000+ customers, and 80,000 hotel properties and do not disclose NRR, GRR, churn, or top-account exposure.
sections:
- id: customer-segments-and-buyers
  title: Customer Segments, Buyers, and Coverage
  body: 'Lighthouse sells primarily into hotel commercial teams rather than into general IT buyers. Across its homepage, portfolio case studies, and partner ecosystem pages, the recurring users are revenue managers, distribution leaders, central commercial teams, sales and marketing managers, and owner-facing asset or portfolio operators. The public segment split is explicit at the top of the funnel—groups, chains, and large hotels on one side; independent and smaller hotels on the other—with management companies and data-service buyers showing up as adjacent segments. The named-customer surface reinforces that breadth: large portfolio operators such as Highgate and Rotana sit alongside regional chains such as Cititel, Primehotels, Leonardo Hotels Poland, iH Hotels, and Lotte Hotels & Resorts, while direct-channel AI stories come from boutique and resort brands such as THE THIEF, The Sofia Hotel, and Stella Hotels. Geographically, public proof spans North America, Europe, the Nordics, the
    Middle East, Japan, Korea, Malaysia, and Greece. The result is a customer base that appears diversified by property type and geography, but still heavily weighted toward commercial teams running multi-property or multi-market pricing and distribution workflows rather than toward owner-operators buying one narrow point product.'
