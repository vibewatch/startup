- id: named-deployments-and-roi
  title: Named Deployments and ROI Proof
  body: 'Lighthouse’s customer-proof surface is stronger than a simple logo wall. Several 2026 case studies publish operational or financial outcomes that tie directly to a workflow. Cititel runs Lighthouse across 10 Malaysian properties and says it detected a Kuala Lumpur demand spike three weeks early, improving pricing accuracy and moving from reactive to proactive revenue management. THE THIEF reports €26,000 of saved promotional spend, €30,545 of revenue from low-intent users, 40+ influenced bookings, and 25% conversion uplift from AI-driven direct-booking personalization. Penta’s KITT deployment handled 5,487 calls in seven weeks, automated half of all calls without human intervention, supported 22 languages, and received an 8.3/10 satisfaction score. iH Hotels says Lighthouse saves at least two hours per day and supported around 5% year-over-year ADR improvement, while Leonardo Hotels Poland credits Lighthouse with several-point ADR gains, stronger breakfast and half-board mix, and
    avoiding severe underpricing during demand spikes. Portfolio-scale BI proof is also credible: Lotte centralizes 37 properties on the platform and Highgate cites a 7.4% RGI improvement worth roughly $400,000 at one beta property. The limitation is that most of this proof remains company-published, with modest independent corroboration outside directories and partner references.'
