tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Primary use case
  - Scale / public proof
  - Strategic value
  - Gap
  rows:
  - - Global chains and large hotel groups
    - Central revenue team, commercial VP, property revenue managers; payer is corporate or regional HQ
    - Rate shopping, benchmarking, BI, portfolio pricing
    - Lotte 37 properties; Rotana 79 properties; homepage explicitly lists groups/chains/large hotels
    - High ACV, repeatable multi-property expansion, stronger partner attach
    - No disclosed share of ARR from large chains or top ten groups
  - - Portfolio owners and management companies
    - Asset managers, management-company commercial leads, ownership reporting stakeholders
    - Centralized reporting, parity monitoring, OTA mix, owner-ready analytics
    - Highgate 125+ hotels / 30,000 rooms; Aperture Hotels commercial strategy service case study
    - Creates enterprise stickiness because data must work across heterogeneous assets
    - No public contract length or renewal data for management-company customers
  - - Regional chains
    - Regional revenue managers and distribution leads
    - Daily pricing, event detection, supplement management, forecasting
    - Cititel 10 Malaysian hotels; Primehotels 7 hotels in Finland; Leonardo Hotels Poland 4 hotels
    - Good evidence of repeatability across mid-sized portfolios
    - Public proof is company-curated and not independently audited
  - - Independent and smaller hotels
    - Owner-operator, GM, revenue manager, small commercial team
    - Starter pricing, channel management, AI receptionist, direct-booking conversion
    - Homepage names independents/smaller hotels; Stardekk acquisition explicitly targets independents; SoftwareFinder markets plans from $115/month
    - Large whitespace if Lighthouse can down-market successfully
    - Public mix of paying independents versus enterprise accounts is not disclosed
  - - Luxury boutiques and resorts
    - GM, reservations, direct-booking manager, marketing lead
    - Direct-booking personalization, multilingual guest support, premium pricing
    - THE THIEF, The Sofia Hotel, Stella Hotels, Furaveri Maldives, Six Senses, Soho House & Co.
    - Useful for high-margin direct-channel add-ons and brand-control use cases
    - Several direct-booking stories are qualitative or single-property snapshots
  - - Technology and channel partners
    - PMS, RMS, booking engines, channel managers, data / referral partners
    - API integrations, benchmark feeds, rate and channel automation
    - 165 partners in 20+ countries; Shiji, Cloudbeds, BEONx, Apaleo, Tripla
    - Extends distribution and embeds Lighthouse deeper in hotel workflows
    - Partner-driven channel exposure may create indirect concentration that is not publicly quantified
  notes: Public segmentation is based on named case studies, partner pages, and homepage positioning. Revenue mix by segment is not disclosed; rows summarize externally visible buying centers rather than audited account counts.
