  evidenceGaps:
  - type: missing-source
    severity: material
    topic: retention-economics
    missingEvidence: Public NRR, GRR, logo churn, contract duration, and renewal-cohort data by product line and customer segment.
    whyItMatters: Positive case studies and support proxies do not quantify whether customers renew, expand, or churn at an investable rate.
    diligencePath: Request cohort retention tables, renewal calendars, and customer-success dashboards broken out by pricing, BI, direct-booking, and channel products.
    relatedQuestionRefs:
    - QU021
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer ARR share, chain-versus-independent revenue mix, regional ARR concentration, and partner-sourced revenue concentration.
    whyItMatters: Public proof is skewed toward large portfolios and partner channels, so concentration could be meaningful even if installed-base headlines are large.
    diligencePath: Request top-10 customer concentration, segment ARR mix, and revenue sourced through the top five partners or PMS channels.
    relatedQuestionRefs:
    - QU022
    - QU023
    relatedTableRefs:
    - TU005
  - type: conflicting-data
    severity: minor
    topic: installed-base-denominator
    missingEvidence: A single board-approved definition for customers, hotels, properties, and live endpoints across 65k / 70k+ / 80k public claims.
    whyItMatters: Installed-base drift weakens precision when comparing Lighthouse’s adoption trajectory with peers or when underwriting implied penetration.
    diligencePath: Ask management to reconcile every public installed-base claim to one denominator table and to disclose the reporting date for each count.
    relatedQuestionRefs:
    - QU027
    relatedTableRefs:
    - TU002
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof-sample
    missingEvidence: A complete or at least systematically sampled customer roster that distinguishes production customers, pilots, modules deployed, geography, and contract status.
    whyItMatters: The public named-proof table is strong enough to show use-case breadth but not broad enough to judge concentration, renewal breadth, or deployment maturity across the full base.
    diligencePath: Request the top 50 customers by ARR with module map, deployment status, start date, renewal timing, and permissioned referenceability.
    relatedQuestionRefs:
    - QU006
    - QU015
    relatedTableRefs:
    - TU003
