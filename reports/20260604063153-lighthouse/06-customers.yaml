- id: adoption-trajectory-and-public-scale
  title: Adoption Trajectory and Public Scale Proof
  body: Lighthouse has ample public adoption messaging, but the exact denominator moves depending on the surface. Partner and ecosystem pages repeatedly cite more than 65,000 hotels in 185 countries, the 2025 developer-solutions launch raises the phrasing to a 70,000+ customer base, and Google Cloud’s 2026 case study describes a customer base spanning 80,000 hotel properties worldwide. Those numbers all point in the same direction—large global footprint—but they are not definitionally identical, which weakens any attempt to treat them as a precise active-customer count. What is clearer is the expansion path inside the existing base. Public milestones show Lighthouse widening from pricing and benchmarking into business intelligence, direct booking, AI receptionist workflows, channel management, and now AI discovery. Rotana’s 79-property rollout, Tripla’s 1,000-customer Japanese booking-engine channel, and Google Cloud’s BI Pro case study all suggest that Lighthouse is winning not just point-product
    usage but broader commercial-stack adoption. The strongest adoption evidence therefore comes from module breadth, partner distribution, and named multi-property deployments rather than from a single auditable customer-count metric.
