companyProfile:
  summary: >-
    Lighthouse is the rebranded form of OTA Insight, the Ghent-founded hospitality software company that expanded from hotel
    pricing intelligence into a broader commercial-intelligence platform spanning market data, business intelligence,
    distribution, direct-booking optimization, and AI-led discovery. Public sources support a 2012 founding in Ghent,
    a 2023 rebrand, an approximately $370 million KKR-led round in November 2024 at unicorn valuation, and current scale
    of roughly 80,000 hotels plus 700+ employees. The company appears strategically strong, but it remains a private,
    disclosure-light growth-equity asset whose public proof is much stronger on category leadership and platform breadth
    than on current software economics.
