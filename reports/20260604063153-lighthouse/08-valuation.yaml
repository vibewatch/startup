- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - ARR / retention misses
    - Audited ARR and NRR fail to justify a premium to public comps.
    - Premium-multiple logic breaks and the current mark becomes hard to defend.
    - Do not invest unless price resets materially lower.
  - - Integration or GTM dysfunction
    - Post-acquisition cross-sell is weak or GTM quality issues persist.
    - Platform-breadth thesis becomes complexity rather than advantage.
    - Require segment-level cohort data and sales-efficiency proof before re-engaging.
  - - Macro softness deepens
    - Mixed Q2 2026 signals turn into sustained hotel-pricing contraction.
    - Demand-sensitive customers may delay upgrades and compress software budgets.
    - Underwrite to the bear case or step away from the round.
  - - Preference / charge overhang
    - Waterfall modeling shows heavy senior claims from the 2025-2026 filing activity.
    - Headline EV overstates common-equity value in a downside exit.
    - Avoid unless the stack is simplified or entry price reflects the overhang.
  notes: Triggers are observable thresholds designed for investment committee discipline. They focus on evidence that can be tested in a data room rather than generic company-quality impressions.
  claimRefs:
  - CV026
  - CV031
  - CV034
  - CV035
  - CV036
  - CV046
  - CV047
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Audited ARR / NRR
    - Board-level revenue, growth, gross-margin, and retention data by product and cohort.
    - This is the main input that determines whether the current mark is premium but fair or simply stretched.
    - Management / CFO data room pack and latest KPI deck.
  - - Cap table and waterfall
    - Preferred stack, liquidation preferences, warrants, and the economics behind the 2025-2026 charges.
    - Downside protection depends on actual exit proceeds, not headline valuation.
    - Counsel review of shareholder documents and MR01 / SH01 supporting PDFs.
  - - Customer economics
    - Segment mix, pricing realization, churn, and cross-sell conversion after the 2024-2025 acquisitions.
    - The bull case depends on platform breadth converting into durable revenue quality.
    - Revenue operations and customer-success cohort tables.
  - - Current mark and secondarys
    - Any 2026 secondary trades, 409A marks, or board-approved valuation updates after the KKR round.
    - Without a refreshed mark, investors are still anchoring to a 2024 transaction in a changed market.
    - Lead investor update, board minutes, or independent valuation memo.
  notes: These are the minimum diligence asks required to move from public-market directionality to underwritten conviction. Each item directly affects entry price or downside protection.
