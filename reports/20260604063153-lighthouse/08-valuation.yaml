    - Roughly 12x-14x on revenue above the public estimate band.
    - Low-medium
    - Public evidence still lacks audited ARR/NRR to prove this premium is earned.
  - - Base
    - 0.85-1.25
    - Growth remains healthy enough to defend a mark near the last round, but upside is capped by valuation opacity.
    - Roughly 8x-10x on revenue near the public estimate band.
    - Medium
    - Without a clean proof pack, fair value clusters near the existing transaction rather than well above it.
  - - Bear
    - 0.55-0.85
    - Market softness, GTM friction, or weak cross-sell lower confidence in premium software economics.
    - Roughly 5x-7x on revenue near or below the public estimate band.
    - Medium
    - A heavily senior preference stack could make realized common-equity value worse than headline EV.
  notes: Scenario ranges are analyst estimates, not quoted market marks. They are anchored on the fetched public comp range and the low-confidence public Lighthouse revenue estimate.
