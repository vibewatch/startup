- id: TV002
  title: Thesis / Anti-Thesis Table
  columns:
  - Dimension
  - Thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Market and scale
    - 80,000+ hotels and broad data coverage support category relevance at global scale.
    - Hotel pricing trends are mixed in 2026, so scale alone does not guarantee premium growth.
    - Show faster-than-market net revenue retention and expansion despite the softer 2026 environment.
  - - Product breadth
    - Rebrand plus HQ revenue, Stardekk, The Hotels Network, and Revenue Agent create a wider commercial platform.
    - Breadth can become integration burden if cross-sell and operational execution lag.
    - Provide attach-rate and cross-sell metrics by module acquired since 2024.
  - - Customer proof
    - Customer stories show time savings, direct-booking uplift, and measurable workflow value.
    - Most proof is company-curated, while generic marketplace review depth is still thin.
    - Add independent cohort data on renewals, expansion, and churn by segment.
  - - Valuation
    - A premium to broad travel-tech peers could be justified if ARR growth and retention are exceptional.
    - Public evidence implies a multiple above fetched comps, but audited ARR and NRR are missing.
    - Reveal audited ARR, NRR, gross margin, and a clean preference stack or price the round lower.
  notes: The table translates the evidence into a price-sensitive investment view. It intentionally separates company quality from what public evidence supports at the current mark.
