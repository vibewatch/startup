company:
  name: Lighthouse
chapter:
  number: 8
  title: Valuation
  summary: "Lighthouse last raised approximately $370 million from KKR in November 2024, with TechCrunch reporting a valuation above $1 billion. Public evidence supports a strong strategic asset — 80,000-plus hotels, broader commercial-product breadth, documented customer ROI, and AI-led product momentum — but public valuation support is thinner: pricing is opaque, audited ARR and NRR are undisclosed, and the only fetched revenue estimate is a low-confidence third-party data point of $101 million for 2025. On that estimate, the last round implies a multiple above 9.9x trailing revenue, which is richer than the fetched 0.25x-6.3x public-comp band for Sabre, Amadeus, Booking, and Airbnb, so the most supportable call is research-more with medium confidence, high risk, and a stretched valuation stance until diligence closes the data gap.\n        \n"
sections:
- id: recommendation-and-price-discipline
  title: Recommendation, Thesis, and Price Discipline
  body: "Lighthouse is a strong product-and-scale story, but public evidence does not yet clear the bar for a clean valuation-backed buy call. The positive side of the thesis is real: KKR committed roughly $370 million in late 2024, TechCrunch reported a valuation above $1 billion, Lighthouse says it now serves more than 80,000 hotels, and the company has broadened from pricing intelligence into performance, distribution, direct-booking optimization, and AI agents. Customer stories from Furaveri, HRI, and Soho House all point to real workflow and revenue value, which is exactly what a premium multiple needs.\n\nThe anti-thesis is equally tangible. Lighthouse still does not publish pricing, generic public review depth is shallow, and the sharpest public operating comment in the dataset is a December 2025 RepVue review describing GTM dysfunction. Public evidence on revenue is also weak: the only fetched dollar-revenue estimate comes from a low-reputation aggregator that conflicts with official\
    \ management and funding facts. That makes the current recommendation research-more rather than buy or avoid. The issue is not whether Lighthouse is good software; the issue is whether a late-stage investor can justify paying at or above the KKR mark without audited ARR, NRR, and preference-stack visibility.\n        \n"
