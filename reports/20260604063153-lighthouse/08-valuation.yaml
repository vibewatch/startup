  evidenceGaps:
  - type: missing-source
    severity: material
    topic: valuation-mark
    missingEvidence: A refreshed 2026 secondary mark, 409A, or board-approved valuation update after the KKR round.
    whyItMatters: Without a current mark, public evidence still anchors to a 2024 transaction despite visible changes in travel-tech multiples and macro conditions.
    diligencePath: Request board materials, investor letters, or independent valuation memos covering 2026.
    relatedQuestionRefs:
    - QV003
  - type: private-evidence-only
    severity: blocking
    topic: arr-nrr
    missingEvidence: Audited ARR, growth, gross margin, logo retention, and NRR by product and customer cohort.
    whyItMatters: These are the core inputs that determine whether Lighthouse deserves a premium to public travel-tech comps or whether the current mark is stretched.
    diligencePath: Obtain the latest KPI pack, board deck, and cohort analyses from management and the lead investor.
    relatedQuestionRefs:
    - QV022
    - QV029
    - QV030
  - type: private-evidence-only
    severity: blocking
    topic: cap-table
    missingEvidence: Full preference stack, warrant schedule, secured claims, and waterfall implications behind the 2025-2026 Companies House activity.
    whyItMatters: Downside protection depends on realized proceeds to the contemplated security, not on headline enterprise value.
    diligencePath: Review shareholder agreements, charge documents, and a counsel-built waterfall model.
    relatedQuestionRefs:
    - QV013
    - QV028
  - type: enumeration-incomplete
    severity: material
    topic: comps
    missingEvidence: A deeper direct-comp set with fetchable public or transaction data for hotel-revenue-management peers such as RateGain, Duetto, and IDeaS.
    whyItMatters: The current comp table relies on broader travel-tech companies, which may understate or overstate what a best-in-class hotel SaaS multiple should be.
    diligencePath: Pull exact quote pages or transaction comps from market databases and update the comparable valuation table.
    relatedQuestionRefs:
    - QV021
    relatedTableRefs:
    - TV004
  - type: missing-source
    severity: material
    topic: cohort-economics
    missingEvidence: Customer mix, pricing realization, churn, and post-acquisition cross-sell conversion by segment.
    whyItMatters: The bull case depends on platform breadth converting into durable revenue quality rather than just broader product messaging.
    diligencePath: Ask revenue operations and customer success for cohort retention tables and attach-rate data by module.
    relatedQuestionRefs:
    - QV010
    - QV011
    - QV024
    - QV025
