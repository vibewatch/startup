- id: scenarios-triggers-and-exit
  title: Scenarios, Downside Triggers, and Exit Path
  body: "The bull case is not impossible, but it needs a higher-quality proof pack than public sources provide. The ingredients are present: Lighthouse has expanded from 65,000 hotels in 2023 to 80,000-plus in 2026, layered in HQ revenue, Stardekk, and The Hotels Network, and launched Revenue Agent on top of a large proprietary data base. If those assets translate into cross-sell, faster AI upsell, and durable customer ROI, the company could justify a multiple above broader travel-tech peers.\n\nThe base case is more conservative. A private buyer or late-stage investor could still support a mark near the last round if Lighthouse is growing well above public peers, but upside looks capped without audited growth and retention data. The bear case is easier to map from public evidence: hotel-pricing trends in 2026 are mixed rather than uniformly strong, Europe is softening, pricing is opaque, and public adverse evidence points to GTM strain. Combine that with unknown liquidation preferences\
    \ and ongoing filing activity at the holdco, and the key thesis-break triggers become straightforward: subscale growth, poor renewal economics, post-acquisition integration drag, or a heavily senior preference stack. Exit readiness is therefore moderate strategically but incomplete financially.\n        \n"
  claimRefs:
