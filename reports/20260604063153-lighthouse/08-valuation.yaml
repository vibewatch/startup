- id: valuation-framework-and-comparables
  title: Valuation Framework and Comparable Set
  body: "The cleanest public framework is a revenue-multiple sanity check, not a precise DCF. Lighthouse is private and does not disclose audited revenue, margin, or retention. The only fetched revenue figure is GetLatka's $101 million 2025 estimate, which is directionally useful but low confidence because the same profile misidentifies the CEO and understates already disclosed funding. Even so, pairing that estimate with TechCrunch's report of a valuation above $1 billion implies a trailing multiple above 9.9x.\n\nThat premium sits above every fetched public travel-tech comparable in this chapter: roughly 0.25x for Sabre, 3.5x for Amadeus, 4.6x for Booking, and 6.3x for Airbnb. Those are not perfect one-for-one comps — Lighthouse is smaller, faster-moving, and more software-like — but they are still the best fetched public reference points for current travel-technology valuation discipline. The implication is straightforward: a premium multiple can be defended only if Lighthouse's true\
    \ ARR growth, retention, and cross-sell velocity are materially better than the public benchmark set. Until audited metrics prove that, public evidence supports a stretched stance rather than an obviously attractive one.\n        \n"
  claimRefs:
  - CV037
  - CV038
  - CV039
  - CV040
