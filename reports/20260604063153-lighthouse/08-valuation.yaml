- id: final-diligence-asks
  title: Final Diligence Asks and What Would Change the Call
  body: "Public evidence is enough to form a direction, but not enough to underwrite size or entry price. The most important missing items are audited ARR and NRR, followed by cap-table economics. Companies House filings show share allotments, charges, and governance changes, but they do not disclose the waterfall an investor would actually face in a downside exit. TrustRadius also confirms that pricing is still quote-based, which means public sources do not reveal how much of Lighthouse's revenue is enterprise, SMB, or post-acquisition cross-sell.\n\nThat leads to a simple decision rule. Upgrade the recommendation only if management can show premium growth, strong retention, and a clean preference stack — or if the entry price moves down enough to put the implied multiple closer to the fetched public comp range. Downgrade to avoid if the data room shows weak net retention, acquisition-led complexity without cross-sell, or a stack that leaves little downside protection. Until then, the right\
    \ posture is disciplined curiosity rather than conviction capital.\n        \n"
