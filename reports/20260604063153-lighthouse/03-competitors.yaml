company:
  name: Lighthouse
chapter:
  number: 3
  title: Competitors
  summary: Lighthouse is one of the broadest commercial-intelligence platforms in hospitality, but its real competition is no longer just rate-shopping tools. Direct specialists such as Duetto, IDeaS, and RateGain still own narrower buying centers, while Revinate, Cendyn, STR/CoStar, PMS-led stacks, OTAs, and short-term-rental platforms all substitute for different parts of the same workflow. Public evidence supports Lighthouse's data breadth and hotel-plus-STR reach, but not durable switching costs or transparent pricing, so consolidation and bundle displacement are the core competitive risks.
sections:
- id: landscape-coverage
  title: Lighthouse competes with direct RMS peers, benchmark data incumbents, and workflow adjacencies rather than one single category
  body: 'Lighthouse sells a broad commercial-intelligence promise, so the competitive set is broader than classic hotel RMS alone. Direct peers include RateGain, Duetto, and IDeaS, each of which overlaps on pricing, forecasting, or market-intelligence workflows. Adjacent competitors attack from other buying centers: Revinate and Cendyn own direct-demand, CRM, or channel-planning budgets; STR/CoStar owns benchmark data and comp-set authority; and PMS suites such as Mews or Cloudbeds increasingly bundle rate management into the operating core. The overlap expands again in alternative accommodations. Lighthouse itself says it combines real-time hotel and short-term-rental data in one platform, but PriceLabs, Beyond, AirDNA, Guesty, and Hostaway all show that STR-native vendors now package dynamic pricing, channel management, and analytics in ways that matter for aparthotels and hybrid operators. The net effect is that Lighthouse is not selling into a tidy “rate shopper” market; it is competing
    for ownership of the hotel commercial operating layer.'
