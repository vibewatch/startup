- id: TP005
  title: Moat durability / competitive risk register
  enumerationScope:
    coverage: partial
    basis: Rows capture the main moat claims and countervailing threats visible in retained 2024-2026 competitor, ranking, and market-structure sources.
  columns:
  - moat-claim
  - threat
  - severity
  - evidence
  - mitigation-or-diligence-ask
  rows:
  - - Unified hotel and STR data makes Lighthouse hard to replicate
    - Specialist RMS vendors can still win pure pricing automation evaluations
    - High
    - Lighthouse discloses hotel+STR breadth, but Worldmetrics RMS still ranks Duetto ahead on dedicated RMS use cases
    - Request win-loss data against Duetto and IDeaS by segment and product bundle
  - - Broad commercial surface supports single-vendor convenience
    - PMS vendors are bundling enough revenue logic to narrow Lighthouse’s workflow advantage
    - High
    - Mews absorbed Atomize and Cloudbeds now frames pricing plus distribution as part of modern hotel revenue management
    - Request attach rates and churn when customers standardize on PMS-led bundles
  - - Rate intelligence and parity can defend share
    - RateGain stretches across parity, channel management, booking engine, and broader travel connectivity
    - Medium
    - RateGain official pages span parity, booking engine, GDS connectivity, and wider travel segments
    - Request Lighthouse proof that hotel-only depth beats broader travel-network leverage
  - - Direct-booking automation adds another budget pool
    - Revinate and Cendyn can own guest data, conversion, and ad spend instead
    - Medium
    - Revinate’s direct-booking and reservation-sales messaging plus Cendyn’s Google partner proof show strong demand-side overlap
    - Request module-level adoption and ROI for Lighthouse direct-booking workflows
  - - Benchmark and performance insight can be bundled with strategy
    - STR / CoStar remains the benchmark default for many operators
    - Medium
    - STR says its benchmark sample reaches 94,000 hotels and 12M rooms with revenue, expense, and profit data
    - Request evidence that Lighthouse displaces rather than merely complements STR
  - - Enterprise buyers will tolerate opaque pricing for strategic software
    - STR-native and rental-native tools expose lighter-friction entry signals and can anchor price expectations lower
    - Medium
    - SourceForge shows no public Lighthouse pricing while Guesty Lite starts at $16/month and PriceLabs offers trial-led entry
    - Request price cards, minimum contract length, and discount policy before underwriting margin durability
  - - Scale plus recent funding creates time to expand
    - Consolidation and AI acceleration are shrinking whitespace quickly
    - High
    - Duetto changed owners to accelerate AI, and Mews bought Atomize to unify operations and revenue management
    - Track acquisition roadmap, module attach, and partner dependence over the next refresh
  notes: Severity is an analytical judgment based on retained public evidence rather than a company-disclosed score. The table is designed to isolate where Lighthouse’s breadth looks durable and where bundle displacement could compress that advantage.
