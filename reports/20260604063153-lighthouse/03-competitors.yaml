- id: durability-and-adverse-evidence
  title: The adverse evidence is a consolidation and specialization race that can narrow Lighthouse’s advantage even as the company scales
  body: 'The strongest adverse signal is not that Lighthouse lacks scale; it is that the market is consolidating around a few different operating layers. Independent 2026 ranking evidence still puts specialist RMS vendors like Duetto ahead of broader commercial platforms on pure revenue-management criteria, while BI rankings split credit between OTA Insight, RateGain, and other narrower tools. Since 2024, Duetto has changed owners with an explicit AI-acceleration mandate, and Mews has bought Atomize to fuse PMS operations with revenue optimization. Those moves matter because they shrink the whitespace between “system of record” and “system of optimization.” Lighthouse still has a credible breadth moat: it combines hotel and STR data, large daily rate coverage, and a broader commercial surface than most single-purpose rivals. But the next underwriting question is whether that breadth is enough to beat deeper RMS specialists, benchmark incumbents, direct-demand stacks, and PMS bundles once
    buyers rationalize vendor count. Without public win-rate, churn, or realized-pricing data, that durability question remains only partially answered.'
