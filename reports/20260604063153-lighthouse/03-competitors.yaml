tables:
- id: TP001
  title: Competitor profile table
  enumerationScope:
    coverage: partial
    basis: Rows cover the most commercially relevant direct, adjacent, and substitute options evidenced in retained 2024-2026 public sources for hotel commercial-intelligence buying decisions.
  columns:
  - competitor-or-class
  - category
  - scale-or-proof
  - target-segment
  - differentiation
  - limitation
  rows:
  - - Lighthouse
    - Direct platform leader
    - 70k+ hotels in 185 countries; 1.7B hotel rates collected daily; 400TB+ data processed daily
    - Chains, groups, independents, and hybrid hotel/STR operators
    - Single commercial surface spanning market insight, BI, pricing, parity, and direct-booking automation with hotel+STR data
    - No public pricing and no disclosed hard switching-cost moat
  - - RateGain
    - Direct commercial-intelligence and distribution peer
    - 1,400+ customers in 100+ countries in retained compare text; cross-travel platform on official site
    - Hotel commercial teams plus OTAs and broader travel sellers
    - Strong rate intelligence, parity, booking engine, channel manager, and connectivity depth
    - Broader travel scope may dilute hotel-pure positioning versus Lighthouse
  - - Duetto
    - Direct RMS specialist
    - 6,000+ hotel and casino properties in 60+ countries
    - Hotels, casinos, resorts, and select-service operators
    - Deep AI pricing, profit, group, and forecasting stack
    - Less evidence of hotel+STR breadth or guest-marketing ownership
  - - IDeaS
    - Direct RMS incumbent
    - 31,000+ properties; 107 integrations; 169 countries; 98% retention
    - Independent hotels, global portfolios, cruises, and parking operators
    - Large installed base and deep forecasting heritage
    - Less positioned as an all-in-one commercial or direct-demand suite
  - - Revinate
    - Adjacent guest-commerce stack
    - 12,500+ hotels; 1.1B guest profiles; $24B in direct revenue
    - Hotels optimizing guest data, messaging, and reservation sales
    - Owns direct-booking, CRM, and voice-channel workflows
    - Weak overlap on market-rate and parity intelligence
  - - Cendyn
    - Adjacent commercial-planning stack
    - Google Hotel Ads connectivity proof and lower-tier BI ranking evidence
    - Brands needing demand, segmentation, and channel-planning support
    - Competes for commercial workflow and direct-demand budget
    - Retained public evidence is thinner on exact RMS depth and packaging
  - - STR / CoStar Benchmark
    - Incumbent benchmark and data layer
    - 94,000 hotels and 12M rooms in the benchmark sample
    - Owners, operators, brands, finance, development, and revenue teams
    - Benchmark authority across revenue, expense, profit, and lifecycle views
    - Not a full end-to-end pricing and guest-conversion operating system
  - - PMS suites (Mews / Cloudbeds / Oracle class)
    - Indirect substitute and likely entrant
    - Mews 5,500+ customers in 85+ countries; Cloudbeds frames revenue plus distribution as core workflow
    - Operators preferring one operational system of record
    - Operations plus pricing and distribution in a single platform bundle
    - Often weaker third-party market-data depth than Lighthouse or STR
  - - STR pricing and data tools (PriceLabs / Beyond / AirDNA)
    - Adjacent overlap
    - PriceLabs prices 600k+ properties daily across 150+ countries; Beyond and AirDNA publish STR revenue data
    - Vacation rentals, aparthotels, and hybrid operators
    - Hyperlocal pricing, booking-window intelligence, and alternative-accommodation depth
    - Rental-first orientation is not a perfect fit for traditional branded hotels
  - - STR PMS suites (Guesty / Hostaway)
    - Indirect substitute for hybrid portfolios
    - Guesty manages 500k+ listings; Hostaway offers 300+ integrations and OTA connectivity
    - Professional property managers and scaled rental operators
    - Channel management, dynamic pricing, direct booking, AI automation, and reporting in one stack
    - Best fit still skews to rentals rather than classic hotel revenue teams
  notes: Scale entries reflect only retained public claims and independent comparison text; where pricing or module detail is undisclosed, the table preserves that opacity instead of inferring missing facts.
