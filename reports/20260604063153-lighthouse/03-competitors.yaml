- id: distribution-and-switching
  title: Distribution power sits outside any one vendor, and multi-homing keeps practical switching costs lower than Lighthouse’s breadth suggests
  body: Hotels do not make pricing decisions in isolation from distribution. Google says hotels need connectivity partners to appear on free booking links and hotel ads, and Expedia invites partners to add properties directly into its inventory or build branded travel experiences on top of Expedia supply. That matters because it means channel power is partly owned by metasearch and OTA ecosystems, not by RMS vendors. At the same time, adjacent hotel-tech categories make multi-homing relatively normal. Revinate and Cendyn can sit beside a pricing stack and own guest acquisition; STR/CoStar can remain the benchmark authority even if a hotel changes RMS; and PMS platforms such as Mews or Cloudbeds can absorb more pricing logic without forcing a buyer to adopt an entirely separate intelligence suite. In rentals and hybrid portfolios, Guesty, Hostaway, and PriceLabs already combine channel sync, direct booking, and dynamic pricing. So Lighthouse's moat is real at the breadth and usability layer,
    but switching friction remains more commercial than technical.
