  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: lighthouse-pricing
    missingEvidence: Exact Lighthouse module pricing, minimum contract length, implementation fees, and discounting by property segment remain undisclosed in public sources.
    whyItMatters: Without realized pricing and term structure, it is impossible to judge whether Lighthouse wins on bundle economics or only on feature breadth.
    diligencePath: Request current price cards, sample MSAs or order forms, and recent win-loss pricing comparisons against Duetto, IDeaS, and RateGain.
    relatedQuestionRefs:
    - QP023
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: lighthouse-mix
    missingEvidence: No retained source discloses what share of Lighthouse revenue or active usage comes from hotels versus short-term rentals, benchmarking, or direct-booking modules.
    whyItMatters: The mix determines whether the hotel-plus-STR breadth claim is a true moat or mostly a marketing umbrella over smaller attach categories.
    diligencePath: Request revenue mix, customer mix, and module attach-rate reporting by hotel, rental, and direct-booking product family.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP001
  - type: private-evidence-only
    severity: material
    topic: lighthouse-share-shifts
    missingEvidence: Public sources do not disclose Lighthouse win rates, churn, or migration patterns versus Duetto, IDeaS, or RateGain.
    whyItMatters: Moat durability cannot be underwritten cleanly without evidence of whether specialists or bundled suites are taking share in live deals.
    diligencePath: Request CRM exports or board materials showing competitive win-loss rates, churn reasons, and segment-level renewal or displacement data.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP005
