    headcount: 700
  topStrengths:
    - >-
      Lighthouse has real category scale, with public evidence supporting roughly 80,000 hotels, broad global reach, and
      large daily data-processing volume.
    - >-
      The platform has expanded credibly beyond rate shopping into market intelligence, business intelligence,
      distribution, direct booking, and AI-led workflow products.
    - >-
      Blue-chip capital backing from Spectrum Equity and KKR gives Lighthouse strategic room to keep acquiring,
      integrating, and expanding globally.
  topRisks:
    - >-
      Public economics remain opaque: audited ARR, gross margin, NRR, cash efficiency, and cap-table downside terms are
      not disclosed.
    - >-
      Acquisition-led breadth can become integration and go-to-market complexity if cross-sell and operational execution
      lag platform ambition.
    - >-
      Lighthouse remains exposed to cyclical hotel demand, data-partner/platform dependencies, and regulatory/privacy
      obligations across a large global footprint.
  unresolvedGaps:
    - >-
      Audited ARR, growth, gross margin, and NRR remain unavailable in retained public sources, leaving valuation
      discipline dependent on proxy evidence.
    - >-
      The current board, ownership concentration, liquidation preferences, and investor-protection terms are not
      publicly reconstructible.
    - >-
      Public evidence is still thin on customer concentration, renewal cohorts, and post-acquisition attach-rate
      performance by product module.
