summary:
  headline: >-
    Lighthouse looks like a category-leading hospitality software platform, but public evidence is still too thin on
    audited growth, retention, and capital-structure terms to support a full buy recommendation at the last unicorn
    mark.
  overallScore: 6.7
  recommendation: research-more
  confidence: medium
  riskRating: high
  valuationStance: stretched
