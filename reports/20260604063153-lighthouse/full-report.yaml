      - number: '2.5'
        title: Contradictions and Evidence Gaps
        blocks:
          - type: paragraph
            body: >-
              Two contradictions should be preserved rather than smoothed away. First, near-term lodging demand is
              improving, but public 2026 hotel outlooks differ materially: CoStar models a muted 0.6% U.S. RevPAR
              increase, while PwC models 2.9%. Second, published software TAMs range from a few billion dollars to
              nearly $20 billion depending on whether the publisher is counting all hotel software, only
              revenue-management software, or an even broader proxy for commercial technology. Those differences are not
              rounding errors; they are evidence that the real diligence task is category normalization. The missing
              data is mostly private. Public materials do not disclose Lighthouse’s revenue mix across hotels,
              short-term rentals, and data services; they do not disclose enterprise chain ACVs or implementation costs;
              and they do not quantify how budget authority splits among property teams, management companies, owners,
              and IT. The result is a strong market-existence thesis and a credible adoption-driver thesis, but only a
              constrained TAM/SAM/SOM conclusion. Precision beyond that needs management data and customer interviews,
              not another syndicated report.
            claimRefs:
              - CM012
              - CM030
              - CM031
              - CM032
              - CM044
              - CM045
      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: The market is real, but the published TAMs are not interchangeable
            body: >-
              The strongest market signal is not one oversized TAM number; it is the combination of visible vendor
              scale, real package pricing, and an active hotel-stack replacement cycle. That supports a credible
              commercial-intelligence category even though syndicated market reports disagree sharply on its dollar
              size.
            calloutType: insight
            claimRefs:
              - CM012
              - CM013
              - CM015
              - CM016
