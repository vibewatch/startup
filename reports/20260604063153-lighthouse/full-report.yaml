    rows:
      - - Google hotel ads and free booking links
        - Metasearch visibility and partner-mediated rate distribution
        - Hotels can change partners without replacing core pricing systems
        - Google says hotels rely on connectivity partners to appear on free booking links and hotel ads
        - Distribution leverage sits partly outside Lighthouse and can be reassigned through partners
      - - Expedia and OTA inventory APIs
        - Inventory access, travel discovery, and branded experiences on OTA supply
        - Inventory can flow through partner APIs and branded wrappers
        - >-
          Expedia developer docs invite providers to add properties to Expedia inventory or build travel experiences on
          its supply
        - OTA platforms remain powerful gatekeepers even when a hotel uses separate intelligence tools
      - - Revinate and Cendyn direct-demand layer
        - Guest profiles, messaging, ads, and direct-conversion workflows
        - Can sit beside RMS, PMS, or BI tools without replacing them
        - Revinate and Google partner evidence show strong direct-demand positioning
        - Lighthouse can lose workflow ownership even if it keeps pricing and market data
      - - PMS-led suites such as Mews and Cloudbeds
        - Operational system of record plus embedded pricing and distribution logic
        - Replacing or upgrading PMS can displace adjacent point tools
        - Mews and Cloudbeds both position rate and distribution controls inside the operating core
        - The highest substitution risk comes from bundled platforms, not from one-for-one rate shoppers
      - - STR / CoStar benchmark layer
        - Comp-set, profit, and portfolio benchmark authority
        - Easy to add or keep alongside another RMS
        - STR says its sample reaches 94,000 hotels and 12M rooms
        - Lighthouse cannot assume benchmark data becomes exclusive just because it wins broader workflow
      - - STR-native platforms such as Guesty, Hostaway, and PriceLabs
        - Channel sync, direct booking, and dynamic pricing for rentals or hybrids
        - Multi-homing across OTAs and direct sites is already normal
        - Guesty, Hostaway, and PriceLabs all market channel-level automation with dynamic pricing
        - Hybrid operators have credible alternatives that reduce loyalty to hotel-first commercial suites
    notes: >-
