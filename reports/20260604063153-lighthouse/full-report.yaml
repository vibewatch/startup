      - number: '3.2'
        title: >-
          Capability breadth favors Lighthouse on surface area, while specialists still lead narrower evaluations and
          public pricing remains opaque
        blocks:
          - type: paragraph
            body: >-
              Lighthouse's clearest differentiation claim is breadth: the company markets pricing, business
              intelligence, direct-booking automation, and hotel-plus-STR data on one surface. RateGain overlaps heavily
              on commercial and distribution intelligence, but extends further into OTAs and other travel verticals.
              Duetto and IDeaS stay closer to the RMS center of gravity, emphasizing AI pricing, forecasting, and profit
              optimization. Revinate and Cendyn compete less on raw rate science and more on guest data, conversion, and
              channel planning. That means many Lighthouse deals are really bundle-comparison decisions: one broad
              platform versus a mix of specialist tools. Public price discovery does not help buyers settle those
              tradeoffs quickly. SourceForge comparison pages expose no public Lighthouse pricing, and the same general
              opacity holds for other enterprise hotel vendors in the retained source set. By contrast, rental-native
              tools such as Guesty Lite and PriceLabs at least expose lighter-friction entry signals, which can reset
              buyer expectations even when they are not direct apples-to-apples substitutes for a full-service hotel
              stack.
