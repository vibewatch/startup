      - number: '4.2'
        title: GTM motion, cost structure, and unit-economics proxies
        blocks:
          - type: paragraph
            body: >-
              Lighthouse does not publish CAC, payback, net retention, or gross margin, so the chapter has to work from
              operational proxies. The strongest positive signals come from customer outcomes and workflow compression.
              Lighthouse Pricing and Performance market speed, not labor substitution alone: 365-day forward demand
              views, live rate shopping, dynamic compsets, AI recommendations, and portfolio dashboards are meant to
              help revenue teams act earlier and with fewer manual report pulls. Public case studies put some numbers
              around that narrative. Furaveri attributes a 215% direct-booking improvement to parity monitoring, HRI
              describes direct platform feeds into revenue-management systems, and Soho House says daily manual
              rate-shopping hours disappeared and subscription value was more than covered by incremental revenue. Those
              are vendor-authored outcomes, so they are not enough to underwrite payback alone, but they do support a
              consultative enterprise sales motion tied to measurable hotel economics.


              The cost side is easier to describe than to quantify. Official materials point to a global workforce,
              distributed support, and a partner and integration estate that spans numerous OTAs, PMSs, and channel
              connections. Careers pages add global offices, benefits, and talent-acquisition machinery, all of which
              imply payroll, onboarding, customer support, and partner maintenance as major operating expenses. Data
              scale is likely another meaningful cost center: Lighthouse repeatedly cites billions of rates or signals,
              millions of listings, hundreds of terabytes of daily processing, and now more than 3 billion daily data
              points for Revenue Agent. That combination usually supports strong software gross-margin potential, but
              public disclosures do not reveal whether data acquisition, compute, support, and integration costs leave
              Lighthouse with SaaS-like gross margins or something materially lower.
