          - type: callout
            title: Integration debt and ROI scrutiny are the main adoption brakes
            body: >-
              Hotels may want AI and better pricing tools, but margin pressure, policy gaps, and PMS / channel
              integration work can still slow purchase and rollout. Lighthouse wins when it shortens time-to-value and
              proves commercial lift, not when it relies on the generic AI narrative alone.
            calloutType: risk
