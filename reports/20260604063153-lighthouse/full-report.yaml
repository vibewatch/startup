      - number: '4.4'
        title: Downside signals, disclosure gaps, and financial verdict
        blocks:
          - type: paragraph
            body: >-
              The downside case is not “no demand,” but “not enough disclosed economics.” Public sources give Lighthouse
              an attractive top-line narrative: large customer count, data-network scale, clear product breadth, notable
              customer ROI anecdotes, and enough capital access to keep expanding. They do not give the core
              underwriting numbers. There is no public gross-margin bridge, no CAC or payback disclosure, no net
              retention or churn curve, no customer-concentration disclosure, and no trustworthy public runway figure.
              Even the high-level estimate set is messy: TechCrunch and Tracxn point to a roughly $1 billion valuation,
              Tech Funding News uses a $2.4 billion headline, GetLatka says 2025 revenue reached $101 million and
              headcount 918, while Tracxn lists a $52.8 million 2023 revenue figure for the UK legal entity. Those are
              useful directional markers, but they are not a clean consolidated ledger.


              End-market conditions add another risk layer. Lighthouse’s own Q2 2026 market update shows that about half
              of tracked destinations were cutting rates, Europe was decelerating, and Gulf pricing was hit by
              geopolitical disruption. Independent hospitality media also describes shorter booking windows and more
              volatile traveler behavior, which can simultaneously support Lighthouse demand and make hotel tech budgets
              more performance sensitive. The resulting verdict is cautiously positive on revenue quality and margin
              potential, but not yet underwriting-ready. Lighthouse looks like a scaled software-and-data platform with
              credible enterprise value, strong strategic backers, and meaningful cross-sell optionality from
              acquisitions. It does not yet disclose the realized pricing, retention, gross margin, or cash-runway data
              needed to prove durable economics without management-room evidence.
