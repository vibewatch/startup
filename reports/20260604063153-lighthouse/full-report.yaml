            body: >-
              Lighthouse sells primarily into hotel commercial teams rather than into general IT buyers. Across its
              homepage, portfolio case studies, and partner ecosystem pages, the recurring users are revenue managers,
              distribution leaders, central commercial teams, sales and marketing managers, and owner-facing asset or
              portfolio operators. The public segment split is explicit at the top of the funnel—groups, chains, and
              large hotels on one side; independent and smaller hotels on the other—with management companies and
              data-service buyers showing up as adjacent segments. The named-customer surface reinforces that breadth:
              large portfolio operators such as Highgate and Rotana sit alongside regional chains such as Cititel,
              Primehotels, Leonardo Hotels Poland, iH Hotels, and Lotte Hotels & Resorts, while direct-channel AI
