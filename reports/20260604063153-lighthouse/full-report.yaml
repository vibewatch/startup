      - number: '7.3'
        title: 'Operational, platform, data-access, and partner dependency risk: every new module adds another failure path'
        blocks:
          - type: paragraph
            body: >-
              Operational risk is best understood as dependency density. Lighthouse’s data promise is large—billions of
              daily hotel-rate observations and millions of listings—while its product roadmap is increasingly
              integration-led through certified APIs, partner revenue sharing, the Stardekk distribution stack, and the
              Hotels Network marketing layer. That breadth is strategically attractive because it can make Lighthouse
              harder to rip out, but it also means the company depends on a long chain of PMS and channel-manager
              integrations, OTA and review-site feeds, direct-booking tooling, and cloud infrastructure. The March 2026
              AWS UAE outage captured by IsDown is a useful reminder that even if incident frequency appears low, a
              single disruption can hit uploads, reports, and media workflows that customers use operationally.


              The best public mitigants are solid but not decisive. Lighthouse advertises 98.2% support satisfaction,
              roughly 100-second response times, and NPS in the 70-plus range, and it has enough market momentum to show
              up in 2026 hotel-tech awards. Yet independent review surfaces still matter because they point to setup
              complexity, occasional data inaccuracies, pricing opacity, and a longer implementation motion for larger
              customers. Those are not fatal defects; they are exactly the kinds of frictions that can compound when a
              platform expands faster than its data-governance, support, and onboarding systems. For diligence, that
              means reliability cannot be judged only by marketing claims or trust-center presence. It has to be judged
              through incident history, feed quality, and the real economics of maintaining all these interfaces at
              enterprise scale.
