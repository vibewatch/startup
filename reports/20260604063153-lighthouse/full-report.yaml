      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: A real data moat is visible in public materials
            body: >-
              Lighthouse’s public materials consistently point to unusually dense commercial data assets for a vertical
              SaaS company: 1.7 billion hotel rates collected daily, 300,000-plus competitor hotels profiled, and more
              than 400 terabytes of travel and market data processed each day. Combined with 70,000-plus to 80,000-plus
              customer/property disclosures, that creates a credible evidence base for a data-network-effect thesis
              rather than a thin-feature software wrapper.
                      
            calloutType: strength
            claimRefs:
              - CO012
              - CO013
              - CO014
          - type: callout
            title: The M&A pattern is coherent, not random
            body: >-
              Transparent, Stardekk, The Hotels Network, Hotelrank.ai, and the supportable reference to HQ revenue all
              fit the same strategy: own more of the commercial layer around pricing, distribution, direct booking, and
              now AI-native discovery. The company is not buying adjacent curiosities; it is assembling a broader
              operating surface next to the PMS.
                      
            calloutType: insight
            claimRefs:
              - CO024
              - CO026
              - CO028
              - CO029
              - CO033
              - CO045
          - type: callout
            title: Disclosure quality still lags company scale
            body: >-
              Public funding history is clear, but board composition, control rights after KKR, audited ARR, margin
              structure, and exact current headcount are not. That leaves a meaningful diligence delta between the
              company’s late-stage capital profile and the information package available to outsiders.
                      
            calloutType: risk
            claimRefs:
              - CO016
              - CO022
              - CO023
              - CO041
              - CO047
          - type: callout
            title: The platform may be strongest for sophisticated revenue teams
            body: >-
              An independent 2026 review argues Lighthouse can be overbuilt for properties with simple seasonal pricing
              and can require specialized revenue-management expertise plus long implementation cycles for complex
              portfolios. That is not a thesis-breaker, but it means growth in the independent segment depends on
              packaging and onboarding discipline, not just product breadth.
                      
            calloutType: risk
            claimRefs:
              - CO042
              - CO043
              - CO046
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              Lighthouse does not sell into the full travel market; it sells into the software layer that helps
              accommodation operators make better commercial decisions. The company describes itself as a commercial
              platform spanning market insights, business intelligence, pricing, and channel management, which places it
              beyond legacy rate-shopping and into the broader workflow of demand sensing, competitor benchmarking,
              pricing execution, and distribution control. In practical spend terms, the included boundary covers
              pricing optimization, competitive intelligence, business-intelligence dashboards, channel management,
              direct-booking optimization, and the integrations required to connect those decisions to PMS, CRS, and
              booking channels. Excluded from the narrow core are PMS, security, building automation, and generic
              guest-service systems unless they directly influence pricing or distribution outcomes. Vacation rentals
              also belong inside the practical competitive boundary: Lighthouse’s pricing product explicitly combines
              hotel and short-term-rental rates, and the company says 45% of travelers compare the two. That means hotel
              revenue teams increasingly compete inside one accommodation decision set that includes hotels, short-term
              rentals, OTAs, and AI-mediated discovery layers rather than separate silos.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
