          opportunity: Partner integrations and dashboards create a single source of truth for pricing and performance.
        - label: Run daily pricing / BI motion
          actor: Property or central revenue team
          touchpoints:
            - Pricing
            - Performance / BI
            - Parity and supplement visibility
          painpoint: Teams need to react to demand spikes, events, and channel leakage before competitors do.
          opportunity: Case studies show time savings, ADR improvement, and better event-driven pricing.
        - label: Expand into guest-facing direct channel
          actor: Marketing lead / reservations manager
          touchpoints:
            - Lighthouse Direct
            - KITT AI receptionist
            - The Hotels Network
          painpoint: Hotels want more direct bookings without broad OTA-discounting or more headcount.
          opportunity: Personalization and AI reception workflows create measurable direct-booking and automation ROI.
        - label: Broaden distribution control
          actor: Commercial platform owner
          touchpoints:
            - Channel Manager
            - 200+ booking channels
            - 400+ tech partners
          painpoint: Inventory, rate, and promotion control are fragmented across channels.
          opportunity: Lighthouse positions channel management as the next layer of automation and margin protection.
        - label: Enter AI discovery loop
          actor: Commercial strategy / direct-booking owner
          touchpoints:
            - Connect AI
            - ChatGPT app
            - Hotelrank.ai visibility analytics
          painpoint: Hotels risk ceding demand capture to OTAs and AI intermediaries.
          opportunity: Lighthouse is trying to become the operating layer for direct AI discovery and booking.
