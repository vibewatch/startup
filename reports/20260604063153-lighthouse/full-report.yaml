  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation, Thesis, and Price Discipline
        blocks:
          - type: paragraph
            body: >
              Lighthouse is a strong product-and-scale story, but public evidence does not yet clear the bar for a clean
              valuation-backed buy call. The positive side of the thesis is real: KKR committed roughly $370 million in
              late 2024, TechCrunch reported a valuation above $1 billion, Lighthouse says it now serves more than
              80,000 hotels, and the company has broadened from pricing intelligence into performance, distribution,
              direct-booking optimization, and AI agents. Customer stories from Furaveri, HRI, and Soho House all point
              to real workflow and revenue value, which is exactly what a premium multiple needs.


              The anti-thesis is equally tangible. Lighthouse still does not publish pricing, generic public review
              depth is shallow, and the sharpest public operating comment in the dataset is a December 2025 RepVue
              review describing GTM dysfunction. Public evidence on revenue is also weak: the only fetched
              dollar-revenue estimate comes from a low-reputation aggregator that conflicts with official management and
              funding facts. That makes the current recommendation research-more rather than buy or avoid. The issue is
              not whether Lighthouse is good software; the issue is whether a late-stage investor can justify paying at
              or above the KKR mark without audited ARR, NRR, and preference-stack visibility.
                      
            claimRefs:
