      - number: '3.1'
        title: >-
          Lighthouse competes with direct RMS peers, benchmark data incumbents, and workflow adjacencies rather than one
          single category
        blocks:
          - type: paragraph
            body: >-
              Lighthouse sells a broad commercial-intelligence promise, so the competitive set is broader than classic
              hotel RMS alone. Direct peers include RateGain, Duetto, and IDeaS, each of which overlaps on pricing,
              forecasting, or market-intelligence workflows. Adjacent competitors attack from other buying centers:
              Revinate and Cendyn own direct-demand, CRM, or channel-planning budgets; STR/CoStar owns benchmark data
              and comp-set authority; and PMS suites such as Mews or Cloudbeds increasingly bundle rate management into
              the operating core. The overlap expands again in alternative accommodations. Lighthouse itself says it
              combines real-time hotel and short-term-rental data in one platform, but PriceLabs, Beyond, AirDNA,
              Guesty, and Hostaway all show that STR-native vendors now package dynamic pricing, channel management, and
              analytics in ways that matter for aparthotels and hybrid operators. The net effect is that Lighthouse is
              not selling into a tidy “rate shopper” market; it is competing for ownership of the hotel commercial
              operating layer.
