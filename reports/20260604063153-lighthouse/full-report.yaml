chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, brand evolution, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Lighthouse began in 2012 in Ghent, Belgium as OTA Insight and spent its first decade building
              hotel-focused market intelligence before broadening into a wider commercial platform. The strongest public
              description of the company in 2026 is not a simple single-city SaaS startup: its founder story, Belgian
              headcount, and career-brand messaging still point back to Ghent, while its financing, CEO media profile,
              and KKR announcement all present Lighthouse as a London-based company with global ambitions. That dual
              identity matters because later chapters should treat London as the current corporate/fundraising center
              and Ghent as the company’s original base and still-material operating hub rather than trying to force one
              city to explain the whole business.


              The 2023 rebrand from OTA Insight to Lighthouse was more than a cosmetic name change. Management said the
              old name no longer described a platform that had already absorbed earlier acquisitions and was moving
              beyond hotel rate shopping into broader business intelligence, short-term-rental data, and workflow
              automation. By the run date, the public product story had extended even further: the homepage still
              centers on market intelligence and revenue growth, while current blogs describe Lighthouse as an AI
              commercial operating system for hospitality. The practical takeaway is that Lighthouse sells recurring
              software to hotel commercial teams, but it increasingly bundles that software as a multi-surface operating
              layer spanning pricing, parity, distribution, direct booking, and AI visibility rather than a single
              module.


              Public location disclosures reinforce the multi-hub model. The careers page lists EMEA hubs in Ghent and
              Barcelona, additional offices in Brussels and Bruges, North America hubs in Denver and Dallas, and APAC
              anchors in Singapore and Kuala Lumpur. Those disclosures fit with Focus on Belgium’s description of twelve
              entities and bridgeheads in the U.S., Spain, and Singapore. For this chapter, later work should reuse
              “London-headquartered with Ghent roots and a broad global hub network” as the safest high-level identity
              statement unless private diligence surfaces a more precise legal-entity map.
                      
