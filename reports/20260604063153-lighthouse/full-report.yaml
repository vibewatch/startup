      - number: '7.5'
        title: 'Mitigations, monitoring, and kill criteria: the thesis survives only if controls catch up with scope'
        blocks:
          - type: paragraph
            body: >-
              Lighthouse does have a credible mitigation case. The company is not starved for external validation: it
              has a large installed base, investor support, public support metrics, review-driven awards, and legal
              commentary showing that algorithmic-pricing risk is design-sensitive rather than universally
              disqualifying. Its public legal stack is also deeper than many startups’, with published terms, privacy
              and cookie policies, procurement documents, ethics policies, and acquisition declarations. Those are all
              signs of a business that is trying to look like an enterprise counterparty rather than a sales-led growth
              story held together by slideware.


              Still, the top risks remain investment-relevant because the mitigation evidence is mostly process-based
              rather than audit-grade. The key kill criteria are therefore straightforward and monitorable. If
              Lighthouse cannot show counsel-backed antitrust guardrails around data inputs and recommended pricing,
              investors should assume the legal overhang is wider than management says. If outage frequency or
              data-accuracy complaints rise while the platform gets broader, the scale story flips from moat to
              fragility. If post-acquisition integration does not turn into attach-rate growth and smoother
              direct-booking economics, the M&A thesis becomes complexity for complexity’s sake. And if management still
              cannot produce private evidence on ARR, burn, retention, and concentration, the financing story should be
              treated as supportive but insufficient. The next diligence step is not another market map; it is proof
              that governance, platform controls, and economics have matured as fast as Lighthouse’s product scope.
