  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: 'Severity-ranked risk picture: the problem is not demand, it is complexity under scale'
        blocks:
          - type: paragraph
            body: >-
              Lighthouse’s public footprint is large enough that the base thesis is not about whether the product solves
              a real problem. The company says more than 70,000 hotels use the platform across 185 countries, public
              materials point to 700-plus employees, and its own product surface now spans pricing, distribution,
              benchmarking, parity, direct-booking marketing, and partner APIs. The November 2024 KKR-led growth round
              and the earlier 2021 Series B are strong mitigants because they show outside capital has continued to fund
              the platform’s expansion rather than forcing a retrenchment.


              That said, the residual risk profile is no longer a simple early-stage execution question. The public
              evidence points to four heavier exposures. First, Lighthouse sells into a hotel-pricing category now under
              active antitrust scrutiny, so legal and regulatory risk is live even if case law does not condemn every
              pricing tool by default. Second, the business has expanded into a denser web of personal-data handling,
              cookies, integrations, and cross-border transfers, which raises privacy and governance load. Third, the
              platform’s value depends on very large data pipelines and constant uptime, so data-quality or reliability
              failures can transmit directly into customer decisions. Fourth, Lighthouse’s capital-backed acquisition
              strategy is visible, but the public record still does not disclose ARR, burn, margin, runway, or customer
              concentration, leaving financial-model risk materially underexplained.
