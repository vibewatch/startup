      - number: '2.3'
        title: Buyer, User, Payer, and Switching-Cost Dynamics
        blocks:
          - type: paragraph
            body: >-
              Budget ownership is distributed across the hotel organization rather than concentrated in one title.
              Hospitality Technology says 2026 budgeting starts at the property level with general managers, directors
              of sales, and operations leaders contributing market assumptions, then rolls upward into portfolio-level
              normalization and owner review. In day-to-day use, the primary operator is usually the revenue manager,
              e-commerce manager, or commercial lead; the payer may be the GM, management company, owner, or asset
              manager; and IT joins once PMS, CRS, channel-manager, or API work becomes necessary. That is why
              integration depth is both a buying criterion and a switching cost. The 2026 IDeaS/NYU/Stayntouch
              technology-outlook study found that only 54% of hoteliers use mostly integrated tools, 38% cite
              integration as a top pain point, and 51% expect to replace or upgrade their stack within 12-24 months. The
              same report found that 30% of all-in-one users plan to move to best-in-class tools, versus 14% moving the
              other way, with better satisfaction scores and fewer operational errors on the best-in-class side. Segment
              matters: smaller properties still prefer simplicity and affordability, while 101-250+ room properties skew
              toward modular systems that offer more control and richer commercial data.
            claimRefs:
