  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Svante
              所在的是工业点源碳捕集子市场，也就是更广义的碳捕集、利用与封存（CCUS）市场中的一块。这个子市场由大型固定排放源的烟气流界定，而不是环境空气（直接空气捕集，DAC），也不是主要服务强化采油的电厂。纳入范围的支出包括捕集设备（吸附剂
              / 溶剂单元、换热器、压缩机、控制系统）、CO2 调质和液化、现场集成工程，以及长期服务和监测。核心可服务市场不包括专用 CO2 运输和地质封存基础设施（虽然它们是项目可行性的闸门条件）、瞄准大气 CO2 的
              DAC 系统，以及仅靠电气化或燃料切换即可实现的减排。


              主要适用行业都有一个共同点：排放不只来自燃烧，还有工艺化学过程，因此电气化或替代燃料不足以实现深度脱碳。范围包括水泥 / 石灰（煅烧释放约 60% 的行业排放，且属于不可避免的
              CO2）、纸浆和造纸（生物质锅炉排放带来 BECCS 机会）、化工 / 石化制造、天然气制氢（燃烧前或燃烧后 CCS）、垃圾发电设施，以及越来越多的钢铁场景，因为高炉或天然气 DRI 路线会产生高浓度 CO2
              流。相邻板块包括用于生成 CDR 信用额的 BECCS（生物能源结合 CCS），以及与 Svante 固体吸附剂滤芯平台共享材料科学基础的 DAC
              近邻市场。现状替代方案包括继续无减排运行并购买碳配额，改用生物质或氢气，在技术可行处电气化工艺热，以及使用自然基抵消或自愿碳信用额（这些工具正面临越来越强的永久性和可信度审查）。
