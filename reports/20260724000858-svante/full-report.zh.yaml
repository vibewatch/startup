      - number: '2.7'
        title: 展示材料
        blocks:
          - type: callout
            title: 限速环节是封存接入，不是捕集技术
            body: >-
              迄今所有推进中的工业 CCS 项目，只有在接入共享 CO2 运输和封存网络（Northern Lights、Porthos、Ravenna Hub）后才真正走通。未能锁定封存接入的项目——包括
              Heidelberg 的 Slite（瑞典）和 Vicat 的 Lebec（加州）——无论技术准备度如何，都被终止或暂停。因此，卡住 Svante 可服务管线的首要约束是 CO2 基础设施，而不是其捕集技术性能。
            calloutType: risk
            claimRefs:
              - CM033
              - CM039
          - type: callout
            title: 45Q 是美国市场基石：$85/吨工业 CCS 抵免重塑项目经济性
            body: >-
              经 IRA（2022）和 OBBBA（2025）更新后，工业点源 CCS 可获得 $85/吨的 45Q 抵免；它现在是美国脱碳工具箱里最强的单一金融工具。一座每年捕集 100 万吨 CO2 的设施，可连续 12
              年产生每年 $85M 的税收抵免收入。抵免可转让，也符合财政部直接支付条件，因此即使没有纳税义务也能融资。EPA 报告规则转换期间，IRS Notice 2026-1 为 2025
              年合规提供了额外安全港清晰度。无论碳市场价格处于什么水平，这都为 Svante 北美管线建立了持久的经济基础。
            calloutType: insight
            claimRefs:
              - CM016
              - CM017
              - CM018
              - CM038
          - type: callout
            title: SAM 估算依赖行业占比假设，尚未被一手数据验证
            body: >-
              对 Svante 模块化固体吸附剂平台在全球 CCS 市场中的 SAM 估算，是把 40–50% 的难减排工业占比（来自 WEF 和 GCCSI 行业分析）套用到分析师 TAM
              数字上。没有分析师报告专门测算北美工业设施的模块化固体吸附剂改造市场规模。在完成一手市场研究并拿到 Svante 客户管线数据前，这个估算只能视作初步边界。
            calloutType: assumption
            claimRefs:
              - CM007
              - CM025
          - type: callout
            title: IEA WEO 2025 下调 CCUS 作用，是重大反向信号
            body: >-
              IEA World Energy Outlook 2025 认为，到 2050 年 CCUS 对累计减排的贡献最高只有 4.9%，低于 WEO 2021 的
              13%。这条下行轨迹说明，可再生能源和电气化经济性越来越有竞争力。IEEFA 另行测算，除一个季度外，2019 年以来欧盟端到端 CCUS 处置成本（€105–280/吨）始终高于 EU ETS
              价格。这些发现并不排除 Svante 的市场机会；其机会由合规强制和 45Q/OBPS 经济性驱动，而不只靠碳市场价格。但它们足以要求投资人审慎检验长期市场规模假设。
            calloutType: risk
            claimRefs:
              - CM021
              - CM022
              - CM036
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 工业 CCS 竞争格局
        blocks:
          - type: paragraph
            body: >
              Svante Technologies 将在 2026
              年进入商业部署阶段，是全球差异化最明显的模块化固体吸附剂点源碳捕集公司；但它面对的是一批液态胺既有供应商，这些公司合计运营数百座商业工厂，并在同一批难减排行业经营了几十年客户关系。竞争格局可分为五类：（1）MHI/Kansai、Linde/BASF
              等大型液态胺技术授权商，拥有 18 到 60 多座商业工厂案例；（2）SLB Capturi（Just Catch）和 Carbon
              Clean（CycloneCC）等模块化胺方案供应商，主打更小占地和快速部署；（3）Svante 所在的模块化固体吸附剂板块，CALF-20 MOF 滤芯能降低能耗惩罚，并避开液态胺处理；（4）Carbon
              Engineering/Oxy 在 Texas 运营 Stratos 工厂，代表大型液体溶剂 DAC；（5）CarbonCapture Inc. 和 Climeworks 的模块化固体吸附剂 DAC，它们瞄准大气
              CO₂ 移除，而不是工业点源排放。Svante 是唯一用同一种固体吸附剂滤芯技术同时覆盖工业点源和 DAC
              的玩家，这带来选择权，也迫使公司同时跨多个板块竞争。模块化固体吸附剂捕集和胺基系统的差异具有战略意义：液态胺系统需要溶剂储存、再生回收基础设施和连续蒸汽再生；Svante 的 CALF-20
              快速变温吸附不使用大宗液体化学品，降低现场复杂度，并可能在部分司法辖区加快许可。不过，固体吸附剂系统最适合 CO₂ 浓度高于 12% 的场景，因此 Svante 可服务的烟气范围小于更宽的胺基市场。
            claimRefs:
              - CP001
              - CP002
              - CP029
