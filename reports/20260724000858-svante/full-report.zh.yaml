  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 类型
      - 指标 / 估值
      - 倍数 / 方法
      - 与 Svante 的相关性
      - 主要局限
    rows:
      - - Oxy / Carbon Engineering（2023 年 8 月）
        - 并购交易
        - US$1.1B 收购
        - 约 10x 投入资本；技术平台溢价
        - 加拿大 DAC 先行者，收购时尚未产生收入，内含政府补助
        - DAC 与点源捕集不同；Oxy 专属战略溢价；交易已过去 2.5 年
      - - SLB / Aker Carbon Capture（2024 年 3 月）
        - 并购交易
        - 80% 股权对应 NOK 4.12B（隐含股权价值约 US$475M）
        - 技术 + 产品平台倍数；EBITDA 前
        - 最接近的结构类比：碳捕集 OEM 与项目交付；试点后已有商业产品
        - Aker 有商业工厂和收入；Svante 尚未产生收入
      - - Climeworks Series G（2025 年 7 月）
        - 私募融资
        - 累计融资 >US$1B；估值未披露
        - 约 25–50x 预估远期收入（DAC 成本曲线溢价）
        - 碳移除龙头；投资者画像相近（科技 / 工业）
        - DAC 并非点源捕集；欧洲市场；每吨成本显著更高
      - - 'Bloom Energy（NYSE: BE，2026 年 Q1）'
        - 上市公司
        - EV 约 US$74B；LTM 收入约 US$3B；EV/Revenue 约 24–26x
        - EV/Revenue 倍数（现场燃料电池、AI / 数据中心需求）
        - 资本密集型清洁能源硬件 OEM 中最接近的上市类比
        - Bloom 已产生收入并受 AI 顺风推动；CCS 没有类似需求驱动
      - - 'LanzaTech（NASDAQ: LNZA，2024–25）'
        - 上市公司
        - 股价下跌约 90%；持续经营警告；1:100 反向拆股
        - 警示性估值下修：商业化前碳利用平台失败
        - 尚未产生收入的碳工艺公司直接警示类比
        - 碳利用不是碳捕集；Svante 战略股东支持更强
      - - 绿色能源板块中位数（2026 年 Q1）
        - 板块基准
        - 估值倍数：EV/Revenue 5.4x；EV/EBITDA 16.3x
        - 有收入清洁能源公司的板块中位数
        - 提供有收入可比公司可能隐含的底部参照
        - Svante 当前没有收入；倍数不能直接套用
    notes: >-
