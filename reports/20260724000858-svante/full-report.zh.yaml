      - number: '3.4'
        title: 伙伴与竞争者的双重关系
        blocks:
          - type: paragraph
            body: >
              Svante 的竞争定位被 BASF 和 Linde 的双重角色拉复杂了：取决于项目情境，二者既是伙伴，也可能是竞争者。

              BASF 是 Svante 的液态胺伙伴：对于烟气 CO₂ 浓度低于 CALF-20 MOF 固体吸附剂最佳阈值约 12% 的客户（例如天然气联合循环电厂），Svante 授权并转售 BASF 的 OASE
              blue 洗涤液。这组合作让 Svante 能提供全谱系碳捕集组合——高 CO₂ 流用固体吸附剂，低 CO₂ 流用 OASE blue——而不是把这些项目让给竞争者。不过，BASF 也通过 Linde 的
              HISOLV 方案和自身直销渠道独立授权 OASE blue；当 BASF-Linde 交付完整交钥匙捕集工厂时，它们就会与 Svante 的项目交付服务直接竞争。

              Linde 既是 Svante 伙伴（共同参与 DOE 资助的 SMR 制氢工厂工程研究），也通过与 BASF 共同开发的 HISOLV/OASE blue 燃烧后捕集方案成为竞争者。只要工业 CCS
              招标接受液态胺，Linde 的 EPC 能力和 60 多座商业工厂案例就让它成为强大的全服务竞争者。

              Samsung E&A 则是明确的伙伴：围绕 C-READY 标准化撬装模块的联合开发协议，将 Samsung E&A 指定为 Svante 模块块体的独家 EPC 制造伙伴。Samsung E&A
              的模块化和数字化项目交付能力，加上 Svante 的 CALF-20 滤芯超级工厂，组成了一条垂直整合的模块化交付通道；Svante 的直接竞争者尚未复制出来。不过，如果合作无法放量，Samsung E&A
              理论上可能部署竞争性捕集技术；同时，它在韩国和东南亚 EPC 合同中的强势市场地位，也带来地域集中风险。

              MHI 采用类似的轻资本授权模式，与 Worley、KBR、Saipem 和 Chiyoda 合作触达工业客户；这让 MHI 无需用自有资本执行项目，也能快速渗透 Svante 瞄准的难减排行业。
            claimRefs:
