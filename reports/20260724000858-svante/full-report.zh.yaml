      - number: '7.6'
        title: 图表
        blocks:
          - type: callout
            title: FOAK 执行缺口是最主要的论点失效风险
            body: >-
              Svante 还没有任何捕集工厂在完整商业规模下运行。Södra 试点（瑞典，2025）和美国 BECCS 项目（可行性阶段，2026 年 3 月）是最近期的验证事件。如果首个商业 FOAK 工厂无法达到
              >80% 捕集率，或成本 / 进度明显超支，投资者信心会受损，后续复制项目经济性仍无法证明。IEEFA 发现，尽管行业声称 95%+ 可以实现，现有 CCS 项目没有一个能年复一年稳定捕集超过 80% 的目标
              CO₂ 量。尽调应要求对 FOAK 性能路径做独立技术评审，并获取 Kern River 和 Södra 的性能数据。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR004
          - type: callout
            title: 通胀侵蚀 45Q，悄悄削弱项目经济性
            body: >-
              Carbon Capture Coalition 计算，自 2022 年以来，通胀已把 45Q 信用的有效价值从 $85 降到约 $68/吨，而同期建设和设备成本上涨 30–40%。OBBBA 将名义费率保留到
              2027 年，但不补偿已经发生的通胀。按实际 $85/吨补贴建模的项目，IRR 可能受到实质性损害。约 2 年的可转让窗口（约 2027 年 7 月）还迫使项目加快开工决策，进一步增加执行压力。
            calloutType: risk
