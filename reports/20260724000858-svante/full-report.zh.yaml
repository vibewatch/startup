  - id: FE001
    title: Svante 产品技术栈——从吸附剂到捕集工厂
    type: stack
    layout: standard
    summary: |
      五层架构，展示 Svante 的技术元素如何从底层 CALF-20 MOF 吸附剂材料一路整合到过滤器、旋转吸附机、工厂配套系统，以及完整的一体化项目交付方案（C-READY）。
    data:
      layers:
        - label: 第 1 层 — 固体吸附剂（CALF-20 MOF）
          detail: Zn 基 MOF；相比 N₂ 和 H₂O，更选择性吸附 CO₂；物理吸附；BASF 商业供应；MOF 化学获诺贝尔奖认可
        - label: 第 2 层 — 结构化吸附剂过滤器（SAB）
          detail: CALF-20 通过 Sorbent on a Roll（卷对卷工艺）涂布；层压堆叠形成过滤器模块；Redwood 超级工厂（10 Mtpy CO₂）；3M 二级涂布
        - label: 第 3 层 — 旋转吸附机（RAM）
          detail: URSA 1000（约 500 TPD）和 URSA 2000（约 2000 TPD）；约 60 秒吸附-再生循环；低压蒸汽再生；连续运行
        - label: 第 4 层 — 工厂配套系统 / 预处理
          detail: DCC（冷却至 <50°C）、湿式洗涤器（SOx/颗粒物）、保护床、辅助锅炉（蒸汽）、CO₂ 纯化（催化氧化 / 低温）、压缩至管道压力
        - label: 第 5 层 — 一体化工厂与项目交付
          detail: C-READY 滑橇式模块化工厂（SAMSUNG E&A EPC/EPF）；Svante Development 共同投资模式；用于 <12% CO₂ 气流的 OASE blue 液态胺；数字 EDP 集成
    claimRefs:
      - CE001
      - CE004
      - CE005
      - CE006
      - CE014
      - CE021
  - id: FE002
    title: VeloxoTherm 客户工作流——从烟气到管道级 CO₂
    type: flow
    layout: wide
    summary: |
      五步运营流程，展示 Svante 捕集系统如何处理工业烟气：从排放源经预处理、吸附、纯化，到最终交付管道级 CO₂。
    data:
      nodes:
        - id: flue-gas-source
          label: 工业烟气来源
          detail: 水泥窑、SMR H₂ 工厂、FCC 装置、回收锅炉或 DAC 环境空气；CO₂ 浓度因行业而异，为 4–30%
        - id: pretreatment
          label: 预处理系统
          detail: 直接接触冷却器将气体冷却至 <50°C；湿式洗涤器去除 SOx/颗粒物；保护床去除残余污染物；满足 RAM 进料规格（SOx ≤1.5 ppm，PM ≤0.2 mg/m³）
        - id: ram
          label: 旋转吸附机（RAM）
          detail: CALF-20 SAB 在吸附区吸附 CO₂；低压蒸汽在约 60 秒循环中再生吸附剂；浓缩 CO₂ 气流排出；净化后的烟气从排气筒排出
        - id: purification
          label: CO₂ 纯化与压缩
          detail: 催化氧化得到 >95% CO₂ 纯度；低温蒸馏选项可达 ≤99.9%；CO₂ 压缩至管道压力（Linde FEED 设计中 ≥2,200 psia）
        - id: co2-product
          label: 管道级 CO₂ 交付
          detail: ≥95% 纯度 CO₂ 用于地质封存、电子燃料、CO₂ 注入混凝土或生成 CDR 信用；无有害二次排放
      edges:
        - from: flue-gas-source
          to: pretreatment
          label: 原始烟气
        - from: pretreatment
          to: ram
          label: 预处理进料（≤50°C，杂质已去除）
        - from: ram
          to: purification
          label: 浓缩 CO₂ 气流（约 60 秒循环产物）
        - from: purification
          to: co2-product
          label: 管道级 CO₂（≥95% 纯度，已压缩）
    claimRefs:
      - CE003
      - CE007
      - CE010
      - CE031
      - CE033
      - CE036
