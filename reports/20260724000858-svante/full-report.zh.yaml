companyProfile:
  summary: >-
    Svante Technologies Inc. 总部位于加拿大不列颠哥伦比亚省 Burnaby，提供碳捕集与封存解决方案。公司 2007 年以 Inventys 名义成立，2019 年为致敬 Svante Arrhenius
    更名为 Svante。公司已多轮融资超过 US$600 million，战略投资方包括 Chevron New Energies、GE Vernova、Samsung Engineering、Temasek、OGCI Climate
    Investments 和 Canada Growth Fund。两条核心产品线是纳米工程 CALF-20 金属有机框架固体吸附剂滤芯，以及模块化旋转接触器设备，用于从水泥、纸浆和造纸、氢能、油气炼化等难减排行业，以及 BECCS
    和 DAC 场景中，以 90% 以上效率捕集工业 CO₂。截至 2026 年 7 月，公司尚未进入商业收入阶段；所有活跃项目合作仍停留在 MOU、pre-FEED 或可行性阶段，预计 2027–2028 年作出最终投资决定。
