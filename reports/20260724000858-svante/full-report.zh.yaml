      - number: '2.2'
        title: 市场规模：多重分析视角
        blocks:
          - type: paragraph
            body: >-
              分析师对 2026 年全球 CCS 市场的估算差异很大，背后是市场边界、技术范围和方法论不同。The Business Research Company 估算 2026 年市场规模为 $8.15B（高于 2025
              年的 $7.1B，CAGR 14.8%），到 2030 年以 15.3% CAGR 增至 $14.4B，驱动因素包括工业脱碳、燃烧后技术部署和氢经济扩张。Fortune Business Insights 估算
              2026 年市场为 $5.31B（2025 年为 $4.51B），并预测到 2034 年以 18.03% CAGR 增至 $19.98B；其 2026
              年口径更窄，可能因为排除了部分油气天然气处理收入。Technavio 预测 2025–2030 年新增 $25.89B、CAGR
              32.1%，隐含未来市场更大，可能纳入了基础设施和封存服务等更宽价值链收入。StartUs Insights 估算该行业 2025 年约 $8.1B，到 2032 年增至 $18.1B（CAGR 13%），与
              BRC 大体一致。


              这些差异一部分来自定义：把 CO2 封存服务、EOR 计入收入和运输管道纳入市场，规模自然会大于只统计捕集设备和工程服务的口径。用产能看更有锚点：S&P Global Horizons 和 GCCSI
              报告称，2026 年全球运行中的 CCS 产能达到 73 Mt CO2/yr，管线项目约 1,300 个；GCCSI 2025 Status Report 统计运行设施 77 个（同比 +54%）、在建 47
              个、项目总数 734 个，合计管线产能 416 Mtpa，自 2017 年以来 CAGR 32%。到 2030 年，如果已宣布项目全部落地，可能带来约 430 Mtpa 捕集产能和 670 Mtpa
              封存产能。这些物理产能指标支撑 Technavio 的高端商业乐观情形；反向情形则由 IEA 更保守的 NZE 2025 Scenario 锚定——该情景下，到 2050 年 CCUS 对累计减排的贡献最高仅
              4.9%，低于 WEO 2021 的 13%。Svante 的 SAM（主要是北美难减排工业点源、模块化改造可服务市场）没有公开数据独立测算，仍是尽调缺口。
