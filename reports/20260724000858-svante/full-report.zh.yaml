      - number: '1.3'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >
              Claude Letourneau 自 2017 年起担任 Svante 总裁兼 CEO。他拥有三十多年工业技术商业化经验，曾任 SNC-Lavalin 高级副总裁（北美、矿业与金属）、Canam Group
              高级副总裁（集成精益项目交付），并创办过两家技术创业公司 Vaperma Inc.（膜法气体分离）和 Avestor Inc.（薄膜锂聚合物电池）。他在 Université Laval
              获得化学工程学士和硕士学位，并入选过 Wall Street Journal CEO Council 的「全球最具影响力决策者」。2026 年 5 月，Svante 任命 Terry Lefebvre
              为首席财务官，公司称其是经验丰富的财务与转型领导者。Brett Henkel 仍以联合创始人兼战略客户与政府事务副总裁身份活跃在公司内。Matt Stevenson 担任首席营收官，此前推动 Mercer
              以及纸浆和造纸 BECCS 管线。Scott Gardner 是项目共同开发子公司 Svante Development Inc. 的总裁。诺贝尔奖得主、美国前能源部长 Steven Chu
              曾担任董事，这是一条值得注意的治理信号。2026 年公司材料披露的股权结构为：在完全稀释口径下（不含可转债转换），管理层和普通股股东约 38%，其他工业战略方 43%，机构金融和风投 6%，能源战略方
              13%。除已公开确认的成员外，完整董事会构成尚未披露。
