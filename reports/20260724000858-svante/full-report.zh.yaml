      - number: '6.5'
        title: 扩张动态与集中风险
        blocks:
          - type: paragraph
            body: >-
              Svante 的渠道战略创造三条扩张路径：OEM 授权（Samsung E&A 模块化工厂部署，目标 100 座 / 年）、项目开发商渠道（美国的 Carbon America，以及提供 CCS 运输 /
              封存使能基础设施的 Tenaska 和 Storegga），以及直接项目开发（Svante Development Inc. 与工业排放方共同投资，如 Integrated Packaging 和 North
              Star 交易）。纸浆和造纸行业已经成为新项目形成密度最高的领域（Mercer、Södra、Integrated Packaging、North Star 均在 2025–2026
              年宣布），显示出潜在行业专精飞轮。集中风险显著。第一，Svante 已宣布项目交易对手多数也是股权投资者，意味着客户流失和投资者流失可能同步发生。第二，唯一确认的商业收入合同（Microsoft North
              Star CDR 承购）代表 100% 已知长期商业承诺。第三，政府资金嵌入四个主要商业项目中的至少三个，形成政策风险——美国 45Q、加拿大 OBPS / CGF 或 EU RRF
              拨款框架变化都可能危及项目经济性。第四，IEEFA 记录显示，加拿大 CCS 运营成本增速是 CO2 捕集量增速的 2×，这是大型加拿大碳捕集项目可能长期承受经济压力的系统性信号。采购摩擦很高：项目需要
              Class VI 井许可（美国）或同等监管批准，多年周期会制造管线不确定性。
