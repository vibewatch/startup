  - id: FU003
    title: 客户旅程图——工业排放方到商业部署
    type: journey-map
    layout: wide
    summary: 追踪工业排放方从最初接触 Svante，到试点验证、工程设计，再到最终商业碳移除或生成 CDR 信用的路径。
    data:
      nodes:
        - id: mou
          label: 发现与 MOU
