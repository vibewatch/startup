      - number: '7.3'
        title: 封存、运输与客户采用依赖
        blocks:
          - type: paragraph
            body: >-
              Svante 是集捕集技术和项目开发于一体的公司，但 BECCS 项目要跑完整条价值链，仍完全依赖第三方 CO₂ 运输基础设施和地质封存运营商。美国东南部 BECCS 项目计划在墨西哥湾沿岸地区根据 Class
              VI 许可开展永久 CO₂ 地质封存。封存许可通常要两年或更久，即便州级主导权能加快部分路径，封存就绪度仍是项目 FID 的关键路径约束。整个 CCUS 价值链存在结构性成本缺口：目前封存 1 吨 CO₂ 成本为
              $150–$220，而 EU ETS 碳价约为 $52/吨，留下 $100–$170/吨缺口，只能靠补贴、税收抵免或自愿碳信用收入填上。Sustainableatlas.org 指出，Class VI
              许可瓶颈意味着截至 2026 年初，「尽管已有数百份申请，发出的 Class VI 许可少于 12 个」。

              客户采用时点风险很尖锐，因为 Svante 的收入模型依赖工业客户（制浆造纸、水泥、氢、乙醇）承诺投入资本密集的改造项目，而这些项目开发周期往往长达数年。高质量 CDR
              信用的自愿碳市场需求在增长，但买家集中在少数科技公司（Microsoft、Frontier Advance Market Commitment）；承购价格波动很大，给 BECCS 项目收入带来不确定性。美国
              BECCS 项目的 CDR 信用「计划出售给希望处理自身 Scope 1 和 Scope 2 排放的组织」，因此直接暴露于 VCM 需求周期。CO₂ 管道路由面临更强法律阻力：South Dakota 已禁止
              CO₂ 管道征用权；Iowa 正在考虑类似立法；California 在 PHMSA 安全规则最终敲定前禁止州内 CO₂ 管道。不列颠哥伦比亚省在 Petroleum and Natural Gas Act（第
              14 部分）下的监管框架要求另行取得 BC 省政府主管部门颁发的封存储层许可证，给 Svante 的加拿大本土项目增加一层监管依赖。
