  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品概览与价值主张
        blocks:
          - type: paragraph
            body: >
              Svante Technologies 销售一套完整的碳捕集与移除系统，目标是难减排工业行业。核心价值主张是：从燃烧后烟气中实现 ≥90% CO₂ 捕集效率，把 CO₂ 浓缩到 ≥95%
              纯度的管输级别，同时避开传统溶剂捕集中使用的危险液态胺或氢氧化钾化学品。产品栈建立在 CALF-20
              之上，这是一种获得专利的锌基金属有机框架（MOF）固体吸附剂，涂覆在薄层压片上，再组装成结构化吸附床过滤器。这些过滤器被装入旋转吸附机（RAM）——一种紧凑、连续旋转的接触器，约每 60
              秒用低压蒸汽完成一次吸附与再生循环。最终产物是浓缩 CO₂ 气流，可用于地质封存、电燃料合成、CO₂ 注入混凝土或 CDR 信用生成。Svante
              瞄准生物源排放方（纸浆和造纸、乙醇、垃圾发电），这些场景捕集成本较低；同时也覆盖水泥、氢、钢铁、油气炼制、铝和化工。对于烟气 CO₂ 浓度低于 12% 的设施（如天然气联合循环电厂），Svante 与 BASF
              合作，把 OASE® blue 液态胺作为固体吸附剂方案之外的互补产品提供。
            claimRefs:
              - CE001
              - CE036
              - CE026
              - CE031
      - number: '5.2'
        title: 产品线与模块架构
        blocks:
          - type: paragraph
            body: >
              Svante 的商业产品线围绕两种 RAM 尺寸展开。URSA 1000 设计为每天捕集约 500 吨 CO₂（连续运行约 180,000 TPY），URSA 2000 设计为每天捕集约 2,000 吨（约
              730,000 TPY）。多台 RAM 可在单一站点并联部署，以放大捕集规模——Linde SMR pre-FEED 设计就并联使用两台 URSA 2000，将规模提升至 1,436,000 TPY。2025 年
              5 月，Svante 与 SAMSUNG E&A 推出 C-READY，这是一款标准化撬装模块化碳捕集工厂产品，把 Svante 的 VeloxoTherm 接触器技术与 SAMSUNG E&A 的数字
              Engineering Data Platform（EDP）和成熟模块化能力打包在一起。C-READY 面向商业工业项目，定位为从前端工程到制造的一站式 CCUS 项目交付方案。对于直接空气捕集应用，Svante
              供应接触器块——同样基于 CALF-20 涂覆结构化吸附剂技术的一种形态——用于 Climeworks 的 Generation 3 DAC 系统。Svante
              技术页面还列出，公司基于固体吸附剂的过滤器可在同一制造平台上服务工业点源捕集和 DAC。
