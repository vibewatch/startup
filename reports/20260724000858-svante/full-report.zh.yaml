      - number: '7.5'
        title: 缓释措施、监测指标与否决标准
        blocks:
          - type: paragraph
            body: >-
              Svante 已落地几项结构性缓释：与 BASF 签署 CALF-20 MOF 材料商业供应协议，锁定最关键原材料并降低单一来源风险；Redwood 超级工厂的大批量自动化和产品标准化旨在压低制造成本波动；CGF
              差价合约工具为加拿大项目吸收碳价下行；多元化投资者名单（Chevron、Temasek、M&G、CGF、United Airlines、Samsung、GE Vernova、InBC）在一定程度上稀释集中度。美国
              BECCS 可行性阶段由 Svante Development Inc. 共同出资，明确纳入风险评估、成本进度估算和工厂集成规划，再进入 FID；这落实了「先爬、再走、再跑」的去风险原则，而在模块化 FOAK
              技术中，这通常伴随更低的成本超支。

              关键监测指标包括：（1）Södra 试点和美国 BECCS 可行性研究的捕集率结果；（2）墨西哥湾沿岸封存场地的 Class VI 许可状态；（3）45Q 相对项目建设成本的实际价值；（4）Chevron
              公开表述的碳捕集投资承诺；（5）自愿 CDR 信用价格；以及（6）加拿大碳信用市场价格与 CGF CfD 执行价的对比。论点失效触发点包括：45Q 抵免被废除，或有效价值降至 $70/吨以下；DOE
              资金长期冻结导致示范项目无法推进；Chevron 出售 Svante 股权；美国 BECCS 项目在 2027 年中以前未能锁定 Class VI 封存伙伴；FOAK 工厂捕集率长期低于设计规格的
              70%；BASF MOF 吸附剂供应中断；或加拿大 OBPS/TIER 信用供给过剩把价格压到 CGF CfD 底价以下。FactSet 分析指出，OBBBA 让 45Q 信用下的地质封存与 EOR
              享有同等地位，为 Svante 项目开发商提供部分缓释：CO₂ 去向更灵活，若存在 EOR 承购伙伴，还可能免去冗长的 Class VI 许可流程。
