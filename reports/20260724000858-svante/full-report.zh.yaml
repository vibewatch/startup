      - number: '5.5'
        title: 差异化、知识产权与竞争优势
        blocks:
          - type: paragraph
            body: >
              Svante 的核心差异化建立在五根支柱上。第一，CALF-20 是专有 MOF 吸附剂，已证明能抵抗工业烟气杂质，避开液态胺溶剂带来的降解和二次排放风险；其获得诺贝尔奖认可的化学基础（2025
              年诺贝尔化学奖引用 MOF 研究）和同行评审科学论文（Science，2021 年 12 月）提供了可防守的技术根基。第二，VeloxoTherm 架构实现极快循环时间（约 60 秒，而传统固定床 TSA
              需要数小时），在吸附剂装填量一定时，设备更紧凑、吞吐量更高，捕集经济性也更有吸引力。第三，Svante 专利组合覆盖吸附工艺（US11813563）、平行通道接触器设计（US11766634）、一体化 TSA
              燃烧系统（US11224834）和底层锌基 MOF 合成化学（WO2019204934A1），并包括可扩展选择性气体分离器等已公开申请（US20250153088A1）。第四，Svante 运营唯一一座 MOF
              基碳捕集过滤器商业化超级工厂，相比不掌握过滤器生产的竞争对手，具备制造成本和交付周期优势。第五，BASF 的 CALF-20 商业供应协议解决了 MOF
              商业化的历史瓶颈（大规模、低成本生产），让供应链比纯内部合成路线更有防守性。合在一起，这些差异化已经被 DOE 资助的工业规模 FEED 研究验证，也被 Climeworks 选择 Svante 作为其美国
              DOE 资助百万吨级 DAC 枢纽过滤器供应商所验证。
