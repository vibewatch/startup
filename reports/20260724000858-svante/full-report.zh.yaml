        - 与第三方隐含估值和 SLB/Aker 可比交易底部一致；概率中等
      - - 熊市
        - FOAK 项目推迟至 2028 年以后；需要降价轮融资；美国政策恶化；竞争对手率先落地
        - US$0.3B–US$0.5B
        - 与困境情景下 1x–1.5x 有形资产基础一致；LanzaTech 式收入落空会加速下行；若政策守住，概率为低到中等
    notes: 估值区间是作者对 2026 年 6 月假设入场的估算。Svante 没有已确认估值数据；概率信号为定性判断。区间未计入未披露的优先权堆栈或清算瀑布。
