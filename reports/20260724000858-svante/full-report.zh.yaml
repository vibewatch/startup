      - number: '7.2'
        title: 监管、法律与政策风险
        blocks:
          - type: paragraph
            body: >-
              Svante 的项目经济性依赖美国联邦 45Q 税收抵免和加拿大联邦 / 省级碳定价机制。One Big Beautiful Bill Act（OBBBA，2025 年 7 月 4 日签署）把点源 CCS 的
              45Q 抵免维持在 $85/tonne 至 2026 年，但没有调整此前已经发生的通胀。Carbon Capture Coalition 测算，通胀已侵蚀 2022 年抵免上调幅度的一半以上，把有效价值降至约
              $68/tonne；与此同时，2020–2024 年建设和设备成本上涨 30–40%。通胀调整要到 2027 年才适用。OBBBA 还限制颁布后两年内（约 2027 年 7
              月）未开工设施的抵免转让性，给项目时间表加上硬性截止日期。此外，DOE 于 2025 年 10 月终止了 321 项财政奖励，合计约 $7.56B，移除了过去为早期 CCUS 项目降风险的政府共同投资兜底。

              CO₂ 封存的 Class VI 井许可是关键监管瓶颈。截至 2026 年 Q1，106 份 Class VI 申请正在审查，2026 年仅签发 3 份最终许可，且只有 5 个项目在主动注入
              CO₂。Louisiana 于 2025 年 10 月暂停新的 Class VI 申请；North Dakota 法院在 2026 年两项判决中推翻该州的 amalgamation
              statute（Northwest Landowners Association v. State；Swenson Living Trust v. NDIC），认定孔隙空间整合构成违宪征收——这可能使
              Summit Carbon 的 Class VI 许可失效，并树立不利先例。Fourth Circuit 对 West Virginia 主导监管权的挑战（West Virginia Surface
              Owners' Rights Organization v. Zeldin）仍在审理。California CARB 于 2026 年 5 月发布 CCUS 法规草案，要求注入后 100 年监测义务。PHMSA
              在 2025 年提出全面 CO₂ 管道安全规则，以回应 2020 年 Mississippi Satartia 事故，并新增设计、应急响应和气体扩散要求。截至 2026 年中，未发现直接点名 Svante
              的监管执法行动、诉讼或专利争议；Svante 的法律暴露是 CCUS 行业系统性风险，而非公司特有风险。
