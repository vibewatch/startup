      - number: '5.8'
        title: 附录
        blocks:
          - type: callout
            title: 商业化超级工厂形成制造护城河
            body: >
              Redwood Facility（141,000 sq ft，10 Mtpy CO₂ 过滤器产能，2025 年 5 月投用）是全球唯一一座服务碳捕集的商业规模 MOF 过滤器制造工厂。叠加 BASF
              CALF-20 供应协议，以及与 SAMSUNG E&A 合作的 C-READY 模块化工厂方案，Svante 已经拼出一套纵向整合的制造与交付栈，竞争对手近期很难、也很贵才能复制。
            calloutType: strength
            claimRefs:
              - CE011
              - CE012
              - CE015
              - CE021
          - type: callout
            title: BASF 作为 CALF-20 单一来源，是关键供应链风险
            body: >
              BASF 目前是唯一合格的商业规模 CALF-20 生产商。任何供应中断（技术、商业或地缘政治原因）都会直接限制 Svante 的过滤器制造吞吐量及其履行商业订单的能力。3M
              的第二涂布产能能缓解销量激增风险，但不能解决原始 MOF 供应过度集中的风险。
            calloutType: risk
            claimRefs:
              - CE015
              - CE016
          - type: callout
            title: 商业规模耐久性与长期 O&M 成本仍未在机队规模验证
            body: >
              CALF-20 已在 CO₂MENT 试点中跨越 4,000+ 小时展现稳定性，也在 Climeworks Muttenz 测试中跑过 1,300+
              个循环。不过，在不同气体组成、杂质谱和维护周期下，多年工业机队性能数据仍不可得。过滤器更换节奏、吸附剂损耗率和每吨 CO₂ 的长期 O&M 成本均未公开披露，使项目融资承销中的总拥有成本估算仍不确定。
            calloutType: risk
            claimRefs:
              - CE038
              - CE039
          - type: callout
            title: DAC 作为第二市场，提供产品平台杠杆
            body: >
              Climeworks Gen 3 现场测试显示，Svante 的结构化吸附剂相比 Gen 2 捕集效率提升 2×，能耗降低 50%，并跨越 1,300+ 个循环。Climeworks 正瞄准 DOE
              资助的美国百万吨级 DAC 枢纽，Svante 过滤器供应可能成为工业点源和 BECCS 之外有意义的第二收入流，并复用同一座 Redwood
              超级工厂。这种双市场平台在固体吸附剂供应商中很独特，也提供了需求侧韧性。
            calloutType: insight
            claimRefs:
              - CE027
              - CE028
  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与买方格局
        blocks:
          - type: paragraph
            body: >-
              Svante 的可服务市场覆盖难减排工业行业：水泥和建材、纸浆和造纸（包括 BECCS）、油气炼制、发电（NGCC）、林业生物质，以及新兴企业 CDR
              信用市场。公司至少区分四类买方：承载捕集工厂并获得脱碳价值的工业排放方；有时也担任部署交易对手的股权投资者；带来市场准入的渠道和 OEM 伙伴；以及购买移除信用的 CDR 承购方。截至 2026 年 6
              月，Svante 披露的活跃关系分布在北美（加拿大和美国）与欧洲（瑞典）；北美至少有五个活跃项目站点，EU 试点为一个。地域分布偏向具备碳定价或税收抵免机制的司法辖区（加拿大 OBPS / 联邦碳价、美国
              45Q、EU ETS / RRF），反映出工业 CCS 经济性对政策敏感。除 North Star CDR 承购外，没有任何客户分层已经进入产生收入的商业合同。投资者即客户的动态——Chevron New
              Energies 领投 $318M Series E 且承载 Kern River 试点，Delek US
              同时是投资者和商业项目业主——模糊了传统获客信号，需要尽调判断项目选择究竟来自真实市场拉力，还是投资者导向的管线管理。渠道伙伴（Samsung E&A 负责 OEM 工厂组装，Carbon America 和
              Tenaska / Storegga 负责项目开发与封存）对突破 Svante 直接商务拓展半径至关重要。
