  - id: TU005
    title: 扩张驱动因素与集中度风险评估
    columns:
      - 类别
      - 驱动因素 / 风险
      - 细节
      - 影响
      - 尽调路径
    rows:
      - - 扩张
        - BECCS CDR 信用需求
        - Microsoft 15 年采购协议释放机构需求信号；VCM 对高质量移除信用的需求在增长
        - 高 — 打开新的收入品类
        - 关注 North Star 及其他 BECCS 项目是否公布更多 CDR 采购协议
      - - 扩张
        - OEM 渠道（Samsung E&A）
        - JDA 面向撬装模块化工厂；Samsung E&A 的 EPC 规模支撑快速部署
        - 高 — 若渠道启动
        - 要求提供 Samsung E&A 已签订单或 MOU 洽谈管线
      - - 扩张
        - 项目开发渠道（Carbon America、Tenaska、Storegga）
        - 通过合作伙伴推进美国及全球 CCUS 项目开发；Tenaska 约有 20 份 Class VI 井许可申请
        - 中
        - 跟踪各渠道伙伴公布的项目
      - - 扩张
        - Svante Development Inc. 共同投资模式
        - 直接共同投资项目（Integrated Packaging、North Star），把潜在回报从技术供应延伸到项目端
        - 高 — 若项目进入 FID
        - 核查每个项目的共同投资条款和资本承诺
      - - 集中度
        - 单一 CDR 采购方（Microsoft）
        - Microsoft 交易是唯一已确认商业收入；尚无其他已签约 CDR 买方公开披露
        - 严重 — CDR 收入流存在单一买方风险
        - 寻找 North Star 额外 CDR 信用买方；争取多元采购
      - - 集中度
        - 投资者兼客户依赖
        - Chevron、GE Vernova、Delek US 既是股权投资者也是项目承接方；退出激励可能不一致
        - 高
        - 在 NDA 下核查投资者承接项目是否采用独立第三方条款
      - - 集中度
        - 政府资金依赖
        - Delek（DOE $91M）、North Star（CGF CAD $137M）、Södra（EU RRF）均依赖公共补贴
        - 严重 — 政策风险
        - 跟踪 45Q 连续性、加拿大 CGF 拨款、EU RRF 时间表
      - - 集中度
        - 纸浆和造纸行业集中度（新增）
        - 8 个具名项目中有 4 个落在纸浆和造纸 / BECCS；行业下行可能外溢
        - 中
        - 除 Delek 外，向水泥、钢铁或炼化行业多元化
      - - 不利
        - 加拿大 CCS 项目经济性（IEEFA）
        - IEEFA 记录显示，加拿大工厂的 CCS 运营成本增速是 CO2 捕集量增速的 2 倍
        - 高 — 加拿大项目经济性面临系统性风险
        - 对照 IEEFA 成本基准复核 Mercer 和 North Star 财务模型
    notes: 影响评级基于分析师判断，属定性评估。政府资金依赖风险标为「严重」，因为多个项目同时暴露在同一政策风险下。
