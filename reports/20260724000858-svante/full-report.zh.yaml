        - id: construction
          label: 建设与调试
          description: 建成并调试全尺寸工厂；开展运营就绪测试；建立 CDR MRV 框架
        - id: commercial
          label: 商业运营与 CDR 承购
          description: 工厂满负荷运行；CDR 信用售出或 CO₂ 封存；长期承购协议生效；重复合作或扩建
