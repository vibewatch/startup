      - number: '4.2'
        title: 资本形成与融资历史
        blocks:
          - type: paragraph
            body: >-
              在全球碳捕集领域，Svante 已经搭起规模最大的民营资本底座之一。早期来自 NRCan、SDTC、ERA、WINN 和 NRC-IRAP 的非稀释性政府补助，截至 2017 年底合计
              C$12.3M，用于资助第一座 CO2 捕集试点工厂。随后，公司在 2019 年 Series C 融资 US$26M（OGCI Climate Investments 领投），2021 年 Series D
              融资 US$100M（Temasek 领投，Suncor、Chart Industries、BDC 和 EDC 参与），并在 2022 年 12 月完成标志性的 Series E 融资 US$318M（2023
              年 Q1 第二次交割，Chevron New Energies 领投）。Series E 吸引了广泛的战略与机构投资者，包括 3M Ventures、GE Vernova、Japan Energy
              Fund、Liberty Media、M&G Catalyst、NextEra Energy、Samsung Engineering 和 United Airlines Ventures，J.P. Morgan
              与 RBC Capital Markets 担任配售代理。

              2024 年 8 月，Canada Growth Fund 通过两笔可转债承诺最多 US$100M（C$137M），每笔 US$50M。截至 2024 年中，CEO Claude Letourneau
              表示，私营部门融资总额达到 C$685M（约 US$500M），其中 90% 以上来自私人来源。BIV 在 2025 年 5 月报道称，截至当时，公司累计融资约
              US$600M。公司股权大致由三部分构成：油气公司约 40%，私人及机构投资者约 40%，其余为管理层和战略伙伴；没有单一投资者持股超过 15%。
