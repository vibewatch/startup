      - number: '8.3'
        title: 牛市、基准与熊市情景分析
        blocks:
          - type: paragraph
            body: >-
              假设投资者持有期为 2026–2029 年，三种估值情景框住结果区间。牛市情景要求 3–5 个 FOAK 项目在 2027 年底前达成最终投资决定，Svante
              开始从首批投产工厂确认滤芯制造收入，并有一个或多个战略收购方（能源巨头、OEM 集团）进入竞争性竞价。FTI Consulting 对 CCS M&A 市场的分析显示，2023 年单个碳管理基础设施资产吸引了近
              30 个潜在买家，说明市场对已验证平台资产的战略需求仍高。在这些条件下，Oxy/Carbon Engineering 这笔 US$1.1B 交易本身也是收入前交易，可设定一个现实退出底线；如果 Svante
              的部署管线先于竞争对手落地，协同溢价会把企业价值推向 US$2–3B。

              基准情景假设 1–2 个 FOAK 项目在 2027 年达成 FID，商业滤芯销售在 2027–2028 年以温和规模开始，并通过后续 Series F
              或结构化债务融资建设承诺。在这个情景下，最可比的公开交易锚是 SLB/Aker 交易，运营活跃公司的隐含股权约 ~US$475M；这意味着 Svante 作为收入前平台，基准估值在 US$800M–US$1.2B
              区间，与第三方估算和最近几轮融资的隐含估值一致。

              熊市情景适用于 FOAK 项目时间表继续滑坡、2026 年后美国政策不确定性加剧，或公司需要通过降估值轮融入过桥资本。Aker Carbon Capture 退市并收缩业务表明，即使是商业运营活跃的点源 CCS
              公司，如果没有持续收入增长，也撑不住公开上市地位。熊市情景下估值压缩到 US$300–500M，约等于有形资产基础的 1x–1.5x，与困境或重组情景一致。
