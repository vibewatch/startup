      - number: '5.6'
        title: 部署、集成与路线图
        blocks:
          - type: paragraph
            body: >
              Svante 已执行或正在执行一条多阶段部署路线图，横跨多个工业行业的试点、pre-FEED 和商业规模项目。Lafarge Canada Richmond 水泥厂的 CO₂MENT 试点（250 TPY，自
              2019 年运行）已累计运行超过 4,000 小时，经历三个阶段：预处理验证、CO₂ 捕集、CO₂ 利用（转化为合成燃料和 CO₂ 注入混凝土）。Chevron Kern River DOE 试点（25
              TPD，2020 年 10 月至 2024 年 8 月，总资助 $23.4M）验证了 4–14% CO₂ 浓度烟气下的稳态运行，并产出了面向 NGCC 应用放大的差距分析。Linde SMR pre-FEED
              研究（DOE Award DE-FE0032113，$1.9M）为 Texas Port Arthur 一座 1.436 Mtpy 商业工厂定义了设计基础，CAPEX 估算为 $512M–$656M。在
              Delek US 的 Texas Big Spring 炼厂，Svante 与 Delek 正推进 DOE 共同资助项目（最高 $95M），目标是从 FCC 装置捕集 145,000 TPY，计划
              2027–2028 年运行。2026 年初，Svante 在瑞典 Södra 的 Värö 纸浆厂部署首个 EU 试点，评估最高 1,000,000 TPY 的生物源 CO₂ 捕集；RISE 是研究伙伴，资金来自
