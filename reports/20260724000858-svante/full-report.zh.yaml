        title: 制造资本强度与成本结构
        blocks:
          - type: paragraph
            body: >-
              Burnaby Redwood 工厂是 Svante 最大的单项资本投入，也是其商业化战略的实体基础。Svante 向这座 141,000 sq. ft. 工厂投入
              US$145M（C$198.65M）；工厂同时承担全球总部、R&D 中心和生产线功能。工厂引入高通量自动化和卷对卷制造流程，以商业规模生产固体吸附剂过滤模块和旋转吸附机。满产时，工厂可生产足够过滤器，支撑每年移除
              1000 万吨 CO2 的碳捕集设施，约等于 2700 万辆乘用车的排放量。

              Svante CEO 公开表示，使用 Svante 技术的点源碳捕集成本约为 US$150/吨；工业烟气 CO2 浓度越高（例如纸浆厂、乙醇厂），成本越低。BIV 将点源捕集成本区间描述为「低于
              $250/吨」。公司没有公开披露毛利率、单位 OPEX 或单个过滤器制造成本。营运资本动态也不透明：Svante 未披露应收账款、库存或应付账款特征，但资本密集型制造模式意味着项目收入到来前需要大量前置投资。

              这座制造工厂由 Series E 募资支持，并得到 CGF 可转债加持。关键战略投资者——Chevron New Energies、Temasek、M&G、CGF、United Airlines
              Ventures、Samsung 和 GE Vernova——直接参与了工厂融资。Burnaby 工厂一方面构成竞争护城河（商业过滤器制造的先发者），另一方面也形成结构性成本负担，需要足够大的订单量来摊薄。
