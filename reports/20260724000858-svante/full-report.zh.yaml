  - id: TV005
    title: 投资论点破裂与终止触发表
    columns:
      - 触发项
      - 阈值 / 事件
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 没有 FOAK 项目达到 FID
        - 到 2027 年 Q4，FID 事件为零
        - 证实执行风险；迫使桥接轮或降价轮；削弱并购溢价
        - 重新评估；降低敞口；部署资本前要求 FID 确认
      - - 降价轮股权融资
        - 新一轮定价低于隐含 US$1B 估值
        - 重定价所有过往账面标记；触发优先权堆栈测算；显示投资者情绪转向
        - 退出或重组持仓；追加资本前分析优先权压力
      - - 美国 45Q 政策反转
        - 2026 年选举后 EPA GHGRP 削弱，或 45Q 失去可转让性
        - 抹掉美国项目的主要经济性；Delek Big Spring 大概率不可行；可服务市场缩小
        - 降低美国项目权重；把分析转向仅加拿大管线的可行性
      - - 竞争对手部署千兆工厂
        - SLB Capturi、Carbon Clean 或 MHI 宣布同等滤芯规模制造能力
        - 侵蚀先发护城河；压缩定价权；提高项目投标竞争风险
        - 重新评估竞争定位；测算利润率压缩情景
      - - 捕集率持续不达标
        - 到 2028 年，没有商业工厂连续 12 个月达到 >80% 设计捕集率
        - 证实 IEEFA 所指效率风险；FOAK 融资缺口扩大；Aker 项目亏损情景重演
        - 标记为阻断项；要求对首批部署装置做独立工程审查
    notes: 终止触发项是分析师基于公开证据构建的框架。实际阈值应按具体投资授权和时间窗口调整。
    claimRefs:
      - CV012
      - CV020
      - CV029
      - CV033
      - CV038
      - CV042
  - id: TV006
    title: 最终尽调问题清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 投后估值确认
        - Series D 以来任何轮次均未公开披露估值
        - 没有已确认价格，$800M–$1.2B 的基础情景区间只是第三方估计；无法判断入场折价或溢价
        - 通过直接接触公司 / 投资者获取；从 Caplight 或 PitchBook 订阅获取二级数据
      - - CGF 可转债转换条款
        - 利率、转换折扣 / 上限、到期日和第二批提款状态未披露
        - 转换机制可能在退出时稀释普通股 5–20%；影响优先权堆栈建模
        - CGF FOIA 申请或直接双边谈判；若第二批拨付款公布，跟踪新闻稿
      - - 股权结构优先权堆栈
        - 18+ 轮融资中，优先股类别条款、清算优先权、反稀释条款均未披露
        - $600M+ 资金若带有标准 1.5–2x 清算优先权，退出估值低于约 $900M–$1.2B 时会压低普通股回报
        - 通过有权限的律所做法律尽调；在 IPO 或正式退出流程中获取公司披露
      - - 收入和烧钱速度
        - 没有经审计财务数据；FY2025 或 FY2026 没有已确认的代理收入数字
        - 无法套用收入倍数；无法测算资金续航期或何时需要桥接融资
        - 公司披露；通过 CGF 提款事件新闻稿间接做代理指标
      - - FOAK 项目管线 FID 时间表
        - 截至 2026 年 6 月，Delek Big Spring、North Star BECCS 和 Mercer Alberta 均处于 FID 前阶段
        - FID 确认是首要重估催化剂；若推迟至 2028 年以后，将触发熊市情景
        - 监测 Svante 新闻稿、DOE 奖励状态和合作伙伴财务披露
    notes: 尽调问题按对估值的重要性排序。第 1–3 项会阻断精确估值建模。第 4–5 项重要，但可通过合作伙伴披露部分解决。
