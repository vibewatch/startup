      - number: '1.6'
        title: 风险、争议与证据缺口
        blocks:
          - type: paragraph
            body: >
              Svante 现阶段面临多项重大风险。Business in Vancouver 报道的 CCUS
              批评者认为，碳捕集是「成本高昂的干扰项——一条最终会延缓必要的化石燃料转型、并可能纵容继续开采的生命线」，具体担忧在于回报可能永远无法匹配投入。Svante 未公开披露收入、毛利率、烧钱速度或盈利能力。截至
              2026 年 6 月，所有商业规模项目（North Star、Mercer、Delek US Big Spring、IPC US 纸厂）距离最终投资决定仍有 12 到 24 个月。North Star 计划
              2029 年初商业运营。美国政策不确定性——包括 DOE 资助被取消的担忧——迫使公司把战略重心转向加拿大项目。员工数估算从约 200 人（公司，2022 年）到 350 人（Business in
              Vancouver，2025 年）不等，显示公司扩张很快，但没有经确认的 2026 年数字。关键人风险偏高：Claude Letourneau
              是商业化战略唯一公开面孔，也是主要外部发言人；若其离任或分心，影响将很重大。公司持有 100 多项全球专利，但 Redwood 滤芯在工业客户处的商业规模长期运行数据仍非常有限。
