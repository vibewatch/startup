      - number: '4.5'
        title: 政府激励与项目层面经济性
        blocks:
          - type: paragraph
            body: >-
              Svante 的项目经济性很大程度上由边境两侧层层叠加的政府激励塑造。在美国，Section 45Q 税收抵免对地质封存的 CO2 提供 US$85/吨，对用于其他应用的 CO2 提供 US$60/吨；DAC
              项目最高可获得 US$180/吨。DOE Carbon Capture Large-Scale Pilot Program 为 Delek Big Spring 炼厂项目提供最高 US$95M（70%
              成本分担）。另一个 DOE IEDO 成本分担协议为 Ashdown Pulp Mill pre-FEED 研究遴选了最高 US$1.5M。

              在加拿大，CCUS Investment Tax Credit（CCUS ITC）已通过 C-59 法案（2024 年 6 月）立法，适用期为 2022 年 1 月至 2040 年 12
              月；点源捕集设备最高可抵免合格资本成本的 50%，直接空气捕集设备为 60%，合格运输和封存支出另有 37.5%。BIV 指出，当投资税收抵免与工业碳定价信用机制合并计算时，加拿大体系可覆盖「一个碳捕集项目最高
              62% 的资本成本」。

              这些激励对项目经济性至关重要。工业点源捕集成本目标为 US$60–120/吨，而 45Q 对地质封存提供 US$85/吨；部分项目建成后，运营经济性可以自我支撑。不过，IEEFA 对 Alberta 现有 CCS
              工厂的分析发现，运营成本增速是 CO2 捕集量增速的两倍；同时，排放绩效信用的有效上限为 C$170/吨，限制了收入上行空间，进而引发对规模化可复制性的疑问。
