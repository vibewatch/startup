      - number: '2.5'
        title: 市场增长驱动因素
        blocks:
          - type: paragraph
            body: >-
              最持久的市场驱动来自监管和政策。北美方面：美国 45Q 税收抵免（经 IRA 2022 和 OBBBA 2025 更新）对工业点源 CCS 支付 $85/吨，对 DAC 支付 $180/吨，自设备投运起可领取
              12 年，开工截止日为 2033 年 1 月 1 日。抵免可以转让，也可以通过直接支付变现，从而变成可用于项目融资的收入。加拿大联邦 OBPS（Output-Based Pricing System）在 2026
              年为大型工业排放方设定 $95/吨 CO2e（CAD）的碳价，为 CCS 提供清晰的避免成本信号。欧洲方面：EU ETS EUA 价格 2026 年初稳定在约 €70–75/吨（低于
              €105–280/吨的全链条处置成本估算区间），但 CBAM 分阶段实施正在强化难减排行业的价格信号。EU Net-Zero Industry Act 要求到 2030 年欧洲至少具备 50 Mtpa CO2
              封存产能，形成监管端需求拉动。德国 €6B 工业脱碳计划从 2026 年中启动，将为 CCS 部署提供资金。


              需求侧驱动包括：企业净零承诺增加，推高支付绿色溢价的意愿（第一章提到的 Microsoft 从 Svante/MLTC 承购 626,000 吨 BECCS
              信用额就是标志性案例）；科技行业对「清洁稳定」能源的需求，催生由 CCUS 支撑的新型购电模式（Google 与 Broadwing Energy 的 400 MW PPA）；BECCS 扩张用于生成 CDR
              信用额；以及中国国家政策把 CCUS 视为战略性工业技术。CarbonHerald 称，到 2024 年全球投资已增至约 $6.4B，约为此前三倍；IEA 估计，近期 CCUS 项目已筹集超过 $15B
              商业债务。45Q 抵免的政策总价值估算超过 $30B，代表美国政府已承诺的支持。
