      - number: '3.3'
        title: 固体吸附剂同业与 DAC 近邻市场
        blocks:
          - type: paragraph
            body: >
              Svante 不是唯一开发模块化固体吸附剂碳捕集的公司，但截至 2026 年，在工业点源玩家中它进展最靠前。技术上最接近的同业是 CarbonCapture Inc. 和
              Climeworks，二者都使用固体吸附剂，但瞄准的是大气 CO₂ 移除（直接空气捕集），不是工业烟气——因此它们是近邻，而不是争夺同一批项目授标的直接竞争者。

              CarbonCapture Inc.（Los Angeles）是一家纯 DAC 公司，其 Leo Series 模块采用固体吸附剂，每个海运集装箱大小的单元每年捕集超过 500
              吨。它的模块化开放系统架构（MOSA）支持现场升级吸附剂滤筒，设计理念与 Svante 相似，但目标是约 420 ppm CO₂ 的环境空气，而不是 CO₂ 浓度 3–25%
              的工业烟气。CarbonCapture 2024 年完成 $80 million Series A 轮，并获得 $47 million Frontier 协议；其 2026 年成本结构估计为每吨净移除
              $600–$800，而工业点源 CCS 为 $50–$150。

              Climeworks（瑞士）是 DAC 品类领导者，在冰岛运营 Orca（4,000 t/yr）和 Mammoth（36,000 t/yr）设施。它 2026 年成本区间为每吨
              $500–$1,000，并在自愿碳市场服务高溢价买家（Stripe、Schneider Electric、NYK），因此与 Svante 处在根本不同的竞争板块。

              Carbon Engineering（现为 Oxy/1PointFive）在 Texas 运营大型 DAC 设施 Stratos，规模 500,000–1,000,000
              t/yr；它使用液态氢氧化钾溶剂，而不是固体吸附剂，瞄准同样的高溢价自愿和合规 CDR 市场，价格为每吨 $250–$450。Svante 的固体吸附剂路径和工业点源重点，与 Stratos 的市场不重叠。

              截至 2026 年，在多数难减排工业应用中，膜法和低温捕集替代方案仍低于 TRL 7；它们短期内不会成为 Svante 核心水泥、钢铁和生物质市场的主要竞争威胁。
