      - number: '2.6'
        title: 采用约束、风险因素与反向证据
        blocks:
          - type: paragraph
            body: >-
              即便政策顺风，几项重大约束仍在压住采用速度。第一，CO2 封存和运输接入是硬门槛：LeadIT 证实，推进中的每个工业 CCS 项目都连接共享 CO2
              基础设施；没有封存伙伴合同，无论其他条件如何，项目都无法推进。在美国，CO2 注入需要 EPA Class VI 井许可，历史上审批耗时 3–6 年；2025 年前 13 年里只批准了 8 个。尽管 Class
              VI 审批在 2026 年一季度加速（单季 3 个许可，追平 2025 年全年），截至 2026 年一季度末仍有 106 份申请在审，覆盖 387 口井。Enverus 预测，美国 Class VI 注入产能到
              2027 年底将超过 100 Mtpa，到 2030 年超过 300 Mtpa——但这仍取决于管线项目，并可能继续延期。


              第二，FOAK 资本强度很高：Brevik 水泥 CCS 项目需要超过 80% 国家资金；欧洲工业 CCS 端到端成本为 €105–280/吨，显著高于当前 ETS 价格。Dow 将 Path2Zero
              Canada 项目推迟到 2029 年，说明即便在政策友好的司法辖区，一旦企业资本周期收紧，工业 CCS 项目也会暂停。第三，CCUS
              系统更像定制项目，而不是模块化产品：每个项目都要按具体烟气成分、工厂布局和封存接入来设计，限制学习曲线降本，也让成本预测不可靠。IEA WEO 2025 认为，到 2050 年 CCUS 对累计减排的贡献最高为
              4.9%（低于 2021 年的 13%），反映可再生能源和电气化作为直接替代方案的竞争力正在上升。IEEFA 另行指出，欧盟端到端处置成本要靠碳价长期维持在 €105/吨或以上才能打平——这个水平只在 2023
              年 2 月达到过一次。这些都是重要反向信号，必须约束对 Svante SAM 的乐观预测。
