      - number: '6.2'
        title: 具名客户证明与项目案例
        blocks:
          - type: paragraph
            body: >-
              Svante 最强的证明点来自一系列分阶段工业部署，这些部署正推进到正式工程里程碑。Chevron Kern River 试点（2023 年 Q2 至 2024 年 8
              月）是技术验证最充分的关系：它在工业锅炉烟气上实现了 95% CO2 产品纯度和约 83% 捕集回收率，并以约 60 秒吸附-解吸循环展示快速负荷跟随能力。NETL 和 Svante 在 2025 年 6
              月更新中发布结果，提供了超出公司自身说法的独立技术验证。Lafarge Canada 在 Richmond, BC 水泥厂的 Project CO2MENT 自 2019 年运行，并在 2023 年进入第 3
              阶段，与 Dimensional Energy 合作把 1 吨 / 天捕集 CO2 转化为合成烃——这是水泥厂首个此类示范。LafargeHolcim Colorado pre-FEED 研究（2023 年 1
              月完成）评估了 Holcim Florence 水泥厂一座 1.5 Mt/yr 商业规模工厂，并得出结论：若 45Q 抵免达到 $85/tonne，经济上可行。Delek Big Spring 炼厂项目代表
              Svante 规模最大的获资助商业部署：DOE 承诺约 $95M（按 USAspending 记录修订为 $91M），用于从 FCCU 捕集 145,000 tpa CO2；工程正在推进，目标 2027–2028
              年开工建设。在纸浆和造纸领域，Mercer International 于 2025 年 4 月将 Alberta Peace River 纸厂推进到 Pre-FEED；Södra 则在 2026 年初于瑞典
              Värö 纸厂启动 Svante 首个 EU 部署。未披露名称的一体化可持续包装公司在 2026 年 3 月把美国东南部 BECCS 项目（目标 500,000+ tpa）推进到可行性阶段。质量最高的商业证明是
              Microsoft North Star BECCS 承购：Microsoft 将在 15 年内从 Saskatchewan 的 MLTC / Svante 合资项目购买 626,000 吨 CDR
              信用，构成加拿大首个 Indigenous 主导的 BECCS CDR 交易。
