      - number: '2.4'
        title: 买方、用户、付费方分层与采用路径
        blocks:
          - type: paragraph
            body: >-
              工业 CCS 采购链条多方参与、按顺序推进，需要区分几个角色：工厂业主承担排放责任并推动商业论证；可持续 /
              脱碳团队为项目站台并解读监管信号；工程和采购团队选择并集成技术；法务和财务顾问搭建税收抵免与项目融资结构；CO2 运输和封存伙伴提供不可或缺的下游基础设施；承购买家购买经认证的低碳产品或 CDR 信用额。


              预算归属很复杂。FOAK 规模大，capex 权限通常在 C-suite / 董事会（CFO、COO）手中；可持续团队能催化项目，但很少独立掌握 capex 预算。触发条件通常是几件事叠加：碳价上升并越过 CCS
              相对继续排放的经济盈亏平衡点；供应链或股东要求绿色产品差异化；政府补助或税收抵免到位，把回收期压到可接受区间。付费方包括工厂业主（设备和集成）、政府机构（capex / opex 补助；转让给项目融资提供方的
              45Q 抵免），以及间接付费的承购买家，他们为经认证的低碳 / 零碳产品支付溢价。封存伙伴通常不在设备供应商范围内，但它们是闸门条件：迄今推进中的每个项目都接入共享 CO2 基础设施（Northern
              Lights、Porthos、Ravenna Hub）。没有封存伙伴合同，项目无法进入 FID。MRV 和监测合规——现在受 IRS Form 8933 和 45Q
              监测要求约束——把法务合规功能加入买方决策链；若 CO2 逸散，还可能触发追回责任。
