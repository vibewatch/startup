            title: BECCS 优先策略瞄准生物源碳溢价
            body: >
              Svante 有意把进入市场的重心转向 BECCS（纸浆和造纸、乙醇、垃圾发电中的生物源 CO₂）：生物源 CO₂ 移除信用额比化石源信用额有溢价，因为它代表净移除，而不只是避免排放。Microsoft
              North Star 交易，以及 Mercer 和 IPC 纸厂管线共同证明，这是距离商业收入最近的路径；其每吨成本低于 DAC，信用额价值又高于化石源点源捕集。
