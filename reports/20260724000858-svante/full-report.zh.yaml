      - number: '3.2'
        title: 胺基既有竞争者
        blocks:
          - type: paragraph
            body: >
              工业碳捕集的主导竞争范式仍是液态胺燃烧后洗涤，四个主要玩家是 SLB Capturi、Mitsubishi Heavy Industries（MHI/Kansai）、Linde/BASF 和 Carbon
              Clean。

              SLB Capturi 于 2024 年由 SLB（80%）和 Aker Carbon Capture（20%）合资成立，是 Svante 最活跃的模块化胺商业竞争者。其标准化 Just Catch
              产品线单台每年捕集 100,000–400,000 吨，Big Catch 产品线可扩至数百万 TPA；到 2026 年中，它正在执行三个世界级项目：Twence（100
              kt，垃圾发电）、Brevik/Heidelberg Materials（400 kt，水泥——全球首座全规模水泥 CCS 工厂）和 Ørsted Kalundborg（5×100 kt，生物能源）。超过
              60,000 小时运行记录和 DNV GL 认证给了 SLB Capturi 可验证的性能证明优势。更关键的是，SLB 覆盖 100 个国家的工程足迹和油服资产负债表，远大于 Svante 的资本体量。

              MHI/Kansai 已用 KM CDR Process 和 KS-1/KS-21 胺溶剂交付 18 座商业工厂，实现 90% 以上捕集率和超过 99.9% 的 CO₂ 纯度；它通过与 EPC
              公司（KBR、Worley、Saipem、Chiyoda）和工业排放方（ArcelorMittal、Heidelberg）建立 8 个以上联盟，走轻资本授权模式。近期最大项目是与 Heidelberg 和
              Worley 在英国建设一座 800,000 t/yr 水泥 CCS 设施。

              Linde 和 BASF 联合授权 HISOLV/OASE blue 燃烧后捕集系统，拥有 60 多座商业工厂案例、超过 65,000 小时运行记录，能耗比 MEA 低 20%。这组合作伙伴正在德国
              Lengfurt 的 Heidelberg Materials 水泥设施部署捕集系统（CAP2U 合资项目，70 kt/yr）。

              Carbon Clean 的 CycloneCC 采用旋转填料床（RPB）和专有胺促进缓冲盐溶剂，最多可减少 50% 占地；2025 年，它在 Fertiglobe 的 Abu Dhabi
              化肥厂完成首次工业部署，运行约 4,000 小时，达到 TRL 7。Carbon Clean 持有 115 个以上有效专利资产，在全球拥有 50 多个运行站点，目标成本低于每吨 CO₂
              $30——远低于当前多数行业参考值；如果达成，将对包括 Svante 在内的所有竞争者形成严重价格压力。
