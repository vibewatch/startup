      - number: '3.6'
        title: 展示材料
        blocks:
          - type: callout
            title: 美国 DOE 资助取消把 Svante 市场重心推向加拿大
            body: >
              Trump 政府取消超过 $3.7 billion 的美国 DOE CCS 资助，已让 Svante 多个项目伙伴停滞，也把公司近期主要增长市场从美国转向 Alberta 的 Pathways Alliance
              和其他加拿大激励计划。这次政策逆转利好收入地域更分散的液态胺既有厂商（欧洲的 SLB Capturi、亚洲 / 欧洲的 MHI），并给 Svante 增加执行压力：它必须在竞争者巩固这些客户关系前赢下加拿大合同。
            calloutType: risk
            claimRefs:
              - CP027
          - type: callout
            title: BASF：战略伙伴，也是间接竞争者
            body: >
              在 Svante 的竞争格局里，BASF 的位置格外暧昧。作为转售伙伴，BASF 的 OASE blue 溶剂把 Svante 的可服务市场延伸到 CO₂ 浓度更低、CALF-20
              无法高效捕集的烟气流。作为独立授权方（通过 Linde 的 HISOLV EPC 方案），BASF 又会争夺同一批工业捕集合约，并且拥有深得多的参考工厂数据。投资人和尽调团队需要厘清 Svante 的 OASE
              blue 转售独家范围，以及随着 CCS 市场规模扩大，BASF 是否可能退出或绕开这组合作。
            calloutType: insight
            claimRefs:
              - CP016
              - CP017
          - type: callout
            title: Svante 拥有唯一专用固体吸附剂滤芯超级工厂
            body: >
              Svante 位于 Vancouver 的滤芯超级工厂 2025 年 5 月投产，是全球首座专门制造碳捕集固体吸附剂滤芯的设施；公司称其产能足以生产每年捕集 1000 万吨 CO₂
              的滤芯。没有直接竞争者宣布过同等级的专用固体吸附剂滤芯制造基础设施。这种制造优先策略，是为了消除通常拖慢首台套工业项目的交付瓶颈；对 Carbon Clean、CarbonCapture Inc. 和 DAC
              玩家而言，若没有多年资本投入，很难复制这种结构性优势。
            calloutType: strength
            claimRefs:
              - CP023
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与业务线
        blocks:
          - type: paragraph
            body: >-
              Svante 经营三条不同但相互咬合的业务线。第一是设备制造：Svante 在 Burnaby Redwood 工厂设计并生产基于固体吸附剂的过滤模块和旋转吸附机（RAM）。第二是技术包与服务：Svante
              授权其技术，并向工业排放方提供工程、项目开发咨询和一体化项目开发服务。第三条、也是战略枢纽，是通过 Svante Devco
              联合开发项目；公司与排放方签订联合开发协议（JDA），参股使用其技术的首台套（FOAK）商业碳捕集设施。

              收入完全未披露——Svante 不发布经审计财务报表；截至 2026 年 6 月，公开渠道没有收入、ARR 或利润率数据。CEO
              承认公司需要「破解商业化变现密码」，说明收入模式仍在从技术示范走向可复制商业回报。替代信号显示，项目开发活动已经有一定规模：Delek Big Spring 炼厂 CCUS 项目已通过遴选，Mercer
              Peace River 纸浆厂项目进入 Pre-FEED 阶段，Ashdown Pulp Mill 的 DOE pre-FEED 研究正在推进。Svante 与 Tenaska 合作，把端到端 CO2
              运输和封存整合进方案，拓宽了商业产品包，但还没有带来公开可衡量的收入承诺。

              商业拓展路径是直接触达难减排行业的工业排放方（水泥、纸浆和造纸、炼油、钢铁、氢），并由同时也是客户的战略投资者（Delek
              US、Chevron、Suncor）支撑。这种「投资者即客户」结构能加速管线开发，但也让近期收入暴露集中在少数大型工业交易对手身上。
