      - number: '6.4'
        title: 留存、耐久性与合同结构
        blocks:
          - type: paragraph
            body: >-
              Svante 采用逐项目资本设备和技术授权模式，传统 SaaS 留存指标（NRR、GRR、logo churn）并不适用。公司尚未披露 NRR、GRR
              或正式合同续约率，这与其私营、商业化前状态一致。耐久性信号只能从项目里程碑延续性推断：Project CO2MENT 已与 Lafarge Canada 跨越三个阶段运行六年以上（2019–2026 年），说明
              Lafarge 参与具有耐久性。截至 2026 年 6 月，没有发现任何具名合作宣布取消或公开报道退出。唯一正式长期合同是为期 15 年的 Microsoft North Star CDR 承购。Svante
              工业交易对手的典型项目生命周期为 MOU → pre-FEED（约 1–2 年）→ FEED（约 1 年）→ FID → 建设（约 2 年）→ 商业运行，意味着多数当前项目的收入确认仍在 3–5
              年之后。投资者与客户重叠（Chevron、Delek、GE Vernova）说明这些早期交易对手近期不太可能取消，因为取消会损害其股权头寸。Delek（DOE $91M）、North Star（CGF
              $137M）和 Södra（EU RRF）的政府共同资助进一步分担财务风险，提高近期项目耐久性。公开渠道没有满意度分数、客户访谈或第三方客户证言，无法支持独立质量评估。
