  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点、反论点与建议
        blocks:
          - type: paragraph
            body: >-
              Svante 的投资论点立在三根互相咬合的支柱上：固体吸附剂碳捕集滤芯的先发制造优势（全球唯一专用超级工厂，2025 年 5 月投产）；横跨 Chevron、Temasek、GE Vernova、Samsung
              和 Canada Growth Fund 的绑定型战略投资者基础，既验证技术，也提供项目承购；以及政策底座——美国 45Q 税收抵免（工业 $85/吨、DAC $180/吨，在 2025 年 7 月 OBBBA
              中保留）、加拿大 50% CCUS 投资税收抵免，以及 EU Carbon Border Adjustment Mechanism（2026 年 1 月进入正式阶段）。这些顺风为难减排行业的大规模 CCS
              部署创造了可行经济环境，而 Svante 的模块化固体吸附剂技术正卡在这个位置上。

              反论点同样清楚。Svante 多轮融资已消耗超过 US$600M，却尚未形成规模化商业收入。七个活跃项目合作仍停留在 MOU、pre-FEED 或可行性阶段；没有一个项目达成 FID。公司最后一次披露的股权融资是
              2023 年 Q1 的 Series E，截至 2026 年 6 月已相隔 3.5 年，期间只有 Canada Growth Fund（2024 年 8 月）US$100M 可转债和 InBC（2024 年 11
              月）C$15M 战略投资支撑估值锚。碳捕集硬件执行失败已有充分记录：IEEFA 发现，没有旗舰 CCS 项目能持续捕集超过目标 CO₂ 量的 80%。LanzaTech 股价下跌 90%
              并发布持续经营警告，为那些无法把试点成功转成规模化单位经济性的商业化前碳利用平台提供了警示性参照。Svante
              任何一轮融资的投后估值都没有公开可核实披露，因此今天的隐含价值到底是价格，还是叙事标价，存在真实不确定性。

              合并来看，证据支持 research-more 建议，置信度为中，风险评级为高。至少要看到一个 FOAK 项目达成
              FID、披露收入或近期收入指引，并有足够股权结构透明度可用于建模稀释和优先权负担，方向性买入才不算过早。由于缺少价格发现数据，估值立场归类为 unknown。
