    title: Svante 按应用划分的产品成熟度与能力图
    type: matrix
    layout: wide
    summary: |
      比较 Svante 三个主要应用领域——工业点源、生物源 BECCS 和直接空气捕集——在六个技术就绪度和商业部署维度上的能力与成熟度。
    data:
      columns:
        - 工业点源（水泥 / H₂ / 炼油）
        - 生物源 / BECCS（纸浆与造纸 / 乙醇）
        - 直接空气捕集（Climeworks Gen 3）
      rows:
        - label: 技术就绪度等级
          values:
            - TRL 7–8（pre-FEED 完成；多个试点已运行）
            - TRL 6–7（Södra 2026 年试点；Mercer FOAK 预可行性）
            - TRL 6（Gen 3 在 2024–25 年 Muttenz 现场测试 1,300+ 个循环）
        - label: 已展示最高产能
          values:
            - 1.436 Mtpy 设计基准（Linde SMR pre-FEED；两台 URSA 2000）
            - 最高 1 Mtpy 已披露潜力（Södra 试点阶段）
            - 接触器模块供应；每个模块确切 DAC 产能未披露
        - label: 已展示 CO₂ 捕集率
          values:
            - SMR 约 92%（pre-FEED 设计）；Kern River 试点约 83%（4–14% CO₂）
            - 未单独披露；类似工业气流
            - Climeworks 测试中为 Gen 2 的 2×；Gen 2 效率未披露
        - label: 主要能源输入
          values:
            - 低压蒸汽（约 1.22 kg steam/kg CO₂）；辅助锅炉或余热
            - 来自生物源余热的低压蒸汽（回收锅炉）
            - 电能（电网或可再生）；热集成循环
        - label: 首个商业 FID 可见度
          values:
            - Delek Big Spring 目标 2027–28（DOE 共同资助）
            - Mercer Alberta 可行性推进中（FID 不明）
            - Climeworks 美国 DAC 枢纽待 DOE 里程碑
        - label: 收入 / 信用类型
          values:
            - 45Q 税收抵免；供应链低碳溢价；ETS 合规
            - BECCS CDR 信用；生物源 Scope 1/3 减排
            - DAC CDR 信用（$100–800/t 区间；Climeworks CDR 市场）
    claimRefs:
      - CE008
      - CE017
      - CE018
      - CE027
      - CE030
