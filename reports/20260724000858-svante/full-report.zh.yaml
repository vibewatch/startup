      - number: '8.2'
        title: 融资历史、估值锚与资本强度
        blocks:
          - type: paragraph
            body: >-
              作为一家尚未产生收入的公司，Svante 的资本形成路径并不寻常：它已通过股权轮（Series B 到 E）、US$100M CGF 可转债和 C$15M InBC 股权合计融资超过
              US$600M，却从未披露经审计资产负债表、收入数字或投后估值。US$318M Series E 于 2022 年 12 月完成，并延展到 2023 年
              Q1；当时这是全球点源碳捕集技术公司最大单笔融资。Caplight、Tracxn 等第三方数据机构根据近期融资结构和规模，报告约 US$1B 的隐含企业价值，但 Svante 或其投资者均未确认这些数字。

              Burnaby 的 US$145M Redwood 制造设施构成重要硬资产基础：141,000 平方英尺的超级工厂，年滤芯产能最高可捕集 1,000 万吨
              CO₂。这是在重置成本框架下最重要的有形资产。再加入估算的 IP、品牌生态和开发选择权价值，可得到约 US$450–600M 的资产底。Canada Growth Fund 可转债结构（两批
              US$50M，第二批绑定项目特定里程碑）引入优先权栈复杂度：具体转换折扣、估值上限和利率未公开披露，且截至 2026 年 6 月第二批提款状态未确认。新 CFO（Terry Lefebvre）于 2026 年 5
              月获任，表明公司在投入财务基础设施，可能服务于未来融资或退出准备。资本强度仍高：CGF 资金指定用于 FOAK 项目共同投资，而非公司运营，意味着任何商业现金流回本周期开始前，公司很可能还需要后续融资。
