      - number: '3.5'
        title: 竞争护城河与风险因素
        blocks:
          - type: paragraph
            body: >
              Svante 的竞争护城河有四根支柱：（1）专有 CALF-20 MOF IP 和固体吸附剂制造诀窍；（2）位于 Vancouver 的全球首座滤芯超级工厂，年产滤芯可支持捕集 1000 万吨
              CO₂；（3）C-READY 模块化产品，并由 Samsung E&A 担任独家撬装制造方；（4）面向低 CO₂ 浓度应用的 BASF OASE blue 合作。

              对这些护城河威胁最大的因素有四个。第一是 Carbon Clean 的 CycloneCC，它瞄准低于 $30/吨和 TRL 8+ 商业化；如果这个成本水平得到验证，将重塑整个工业 CCS 的经济性。第二是
              Trump 政府回撤清洁能源政策后，美国 DOE 取消超过 $3.7 billion CCS 资助，已让 Svante
              在美国的多个项目伙伴停滞。第三是固体吸附剂的长期耐久性和再生循环性能风险：在更多商业验证前，它们未必能跨多种工业烟气成分站稳。第四是胺基既有厂商在装机基础、服务合同和现有捕集站点客户锁定上拥有结构性优势。

              工业 CCS 的切换成本很高：改造一个捕集单元，需要与现场烟气基础设施、余热回收和公用工程深度集成，由此形成惯性，利好既有供应商——无论是液态胺厂商，还是未来 Svante
              自己的装机基础。多归属（并行运行两套捕集系统）在工业规模上经济性不可行，因此单一站点的先发优势大体是排他的。Svante
              先制造、后签大合同的策略——先建设超级工厂产能——意在用交付速度和成本确定性抢在竞争者前面；但如果项目需求落后于产能爬坡，短期资产负债表会承压。
