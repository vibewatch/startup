      - number: '7.4'
        title: 财务、集中度与资本风险
        blocks:
          - type: paragraph
            body: >-
              Svante 已从 32 家机构投资者融资约 US$493M，最近注入的资本来自 Canada Growth Fund 的可转债（最高 US$100M，分两批 $50M + $50M）以及 InBC 的
              CDN$15M 投资。资本强度极高：Redwood 超级工厂 需要 $145M；每座 FOAK 商业工厂在产生碳信用收入之前，都要先拿到数亿美元项目融资。CGF
              可转债用差价合约工具吸收政策和市场风险：若市场碳价低于约定执行价，CGF 向 Svante 支付差额。但第二个 $50M 分批提款取决于项目进展；如果早期 FOAK 项目表现不佳，或加拿大碳信用市场出现 IISD
              2025 年碳定价评估指出的供给过剩风险，Svante 将面临再融资暴露。

              集中度风险不小：Chevron 领投 Series E（$318M 轮），既是领投投资方，也是主要工业试点场景方（California 的 Kern River）。Equinor、Shell
              等油气公司已在股东压力下削减低碳支出，说明 Chevron 也可能类似压缩 CCS 承诺。DOE 资金收缩（2025 年 10 月终止 $7.56B
              奖项）切断了一个关键生态支持机制。没有持续政府成本分担，FOAK 项目开发商将更依赖私募资本，并承受更高风险溢价。IEEFA 记录，加拿大 CCS 项目的运营成本增速约为捕集 CO₂
              增速的两倍，抬高了永久依赖补贴的风险。True North Institute 2025 年 FOAK 案例评估发现，历史上政府补助与 VC、企业承购同为关键支柱；DOE 削减之后，Svante
              面临更深的项目融资「死亡谷」，必须更依赖私募股权和基础设施基金银团。
