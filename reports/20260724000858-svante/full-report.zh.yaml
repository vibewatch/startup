      - number: '6.3'
        title: 采用轨迹与部署成熟度
        blocks:
          - type: paragraph
            body: >-
              Svante 的部署轨迹遵循从试点验证到商业规模执行的分阶段管线模型，每个阶段都是技术商业化路径上的不同里程碑。最早的证明点（CO2MENT Richmond，2019
              年）把水泥确立为第一个已验证行业；Chevron Kern River 试点（2023–2024 年）加入油气；Mercer（2025 年）以及 Södra、Integrated Packaging、North
              Star（2025–2026 年）则同时扩展纸浆和造纸以及 BECCS 垂直。把已知项目管线的满规模目标加总，已披露 CO2 捕集能力超过 2.3
              Mt/yr，但这一数字具有前瞻性，大多数项目距离运行仍有数年。采用漏斗呈现典型早期技术采用形态：顶部有大量 MOU 和合作，随后急剧收窄为三个活跃或已启动试点（Kern River 已完成，CO2MENT
              活跃，Södra 已启动）、一个工程阶段项目（Delek）和一个已签约承购（Microsoft North Star）。这种形态反映出 Svante 项目交易对手从试点到 pre-FEED 通常需要 18
              个月。关键拐点是 2025 年 5 月 Svante Burnaby 总部超级工厂（过滤器制造设施）投用，约束从技术成熟度转向商业项目开发和项目融资。尚无项目完成商业投运，意味着 Svante
