  - id: TE003
    title: VeloxoTherm 技术架构 — 关键层与依赖
    columns:
      - 层 / 组件
      - 功能 / 角色
      - 关键依赖
      - 技术风险
    rows:
      - - CALF-20 MOF 吸附剂
        - 通过物理吸附从烟气捕集 CO₂；在低压蒸汽下释放 CO₂
        - BASF 商业规模 MOF 合成（唯一合格供应商）
        - 单一来源供应风险；批量部署工况下长期现场耐久性尚未证明
      - - 结构化吸附剂滤芯（SABs）
        - 高比表面积层压模块，用于快速气固接触；卷对卷涂布
        - Svante Redwood 工厂；3M 作为第二涂布方
        - 商业产量下的质量一致性；滤芯损耗 / 更换周期
      - - 旋转吸附机（RAM）
        - 机械接触器以 ~1 RPM 转速穿过吸附、再生、调节区
        - Svante 自研 RAM 设计；密封旋转环面架构（专利 US20250153088A1）
        - 规模化机械密封；旋转环面专利已放弃；下一代设计正在商业化
      - - 预处理系统
        - DCC 冷却（<50°C）、湿式洗涤器（SOx、颗粒物）、保护床（残余污染物）
        - 工业气体处理供应商；特定场址 BOP 设计
        - 水泥 / 钢铁等高 SOx 环境需要稳健预处理；增加 CAPEX
      - - 辅助蒸汽系统
        - 提供低压蒸汽用于吸附剂再生（蒸汽 / CO₂ ~1.22 kg/kg）
        - 现场锅炉或余热回收；场址公用工程基础设施
        - 没有可用余热的场址需要辅助锅炉；增加能源成本和 CAPEX
      - - CO₂ 净化与压缩
        - 催化氧化（>95% 纯度）或低温精馏（最高 99.9%）
        - 第三方气体处理供应商；Linde 在 FEED 研究中做流程集成
        - 低温方案增加 CAPEX；CO₂ 压缩至 2,200+ psia 很耗能
    notes: >
      架构来自 NETL Technology Sheet、OSTI DOE 最终报告（DE-FE0032113）、NETL Claessen 与 Shah 演示，以及 Svante 官方技术页面。风险为分析师的尽调判断，并非
