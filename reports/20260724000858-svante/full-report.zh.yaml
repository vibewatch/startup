chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与使命
        blocks:
          - type: paragraph
            body: >
              Svante Technologies Inc. 是一家目标驱动型碳捕集与碳移除解决方案提供商，总部位于加拿大不列颠哥伦比亚省 Burnaby 的 8800 Glenlyon Parkway，邮编 V5J
              5K3。公司仍是完全私营的后期创业公司（已完成 Series E 轮），没有披露 IPO 时间表。Svante 最初以 Inventys 名义注册，2019 年更名以致敬 Svante
              Arrhenius——这位瑞典科学家 1896 年首次指出大气 CO₂ 浓度与全球地表温度之间的关系。Svante
              的核心业务做两类产品：（1）涂覆金属有机框架（MOF）的纳米工程固体吸附剂滤芯；（2）模块化旋转接触器设备，让烟气穿过滤芯、吸附 CO₂，并以约 60 秒周期再生滤芯。捕集后的 CO₂ 被浓缩到 95%
              管道级纯度，可用于永久地质封存或工业循环利用。公司瞄准水泥、纸浆和造纸、氢能、钢铁、石灰、铝、油气炼化等难减排行业，并正拓展到 BECCS 和 DAC。Svante 的商业模式覆盖 OEM
              滤芯销售、交钥匙项目交付，以及项目开发子公司 Svante Development Inc. 与工业伙伴共同投资首台套 FOAK 商业项目。公司官网是 www.svanteinc.com。
