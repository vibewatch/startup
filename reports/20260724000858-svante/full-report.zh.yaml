      - number: '4.6'
        title: 资本充足性、财务风险与尽调障碍
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 6 月，公开信息无法精确评估 Svante 的资本状况。已知承诺资本总额约 US$645M（US$500M+ 私人资本，加上计入私人资本总额的 US$145M 工厂投资），其中一部分已投入
              Burnaby 工厂（US$145M），并支撑公司约 350 人团队和管线活动。CGF 第一笔资金（US$50M）提供项目共同投资能力，但现金消耗速度、剩余现金和下一轮融资触发点均未公开。因此，公开证据无法判断
              runway。

              三个结构性财务风险最突出。第一是政策依赖：美国 45Q 抵免和加拿大 CCUS ITC 对项目层面经济性不可或缺；行政或立法变化，尤其是美国 2024 年和 2028 年选举周期之后的变化，可能削弱 Svante
              的项目管线经济性，并推迟最终投资决定。第二是 FOAK 执行风险：首台套商业项目有实质性的成本超支和性能风险；IEEFA 发现，全球真实 CCS 项目持续低于预期捕集率。第三是可转债稀释：CGF
              有权按未披露条款把债务转为股权，给资产负债表和股权结构带来下游投资者无法充分评估的不确定性。

              IEEFA、IISD 以及学术研究者等关键分析方强调，迄今 CCS 项目未能达到捕集率目标，而成本已经翻倍。即便 Svante 的技术路径不同于既有溶剂系统，这些发现仍直接适用于 Svante
              所在行业。财务结论是：相对同业，Svante 资本充足；但在商业规模上仍处于收入前阶段，高度依赖政策，并且在承销尽调决策所需指标上不透明。
