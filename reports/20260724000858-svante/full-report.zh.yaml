      - number: '2.3'
        title: 难减排行业需求垂直
        blocks:
          - type: paragraph
            body: >-
              水泥和石灰是工业 CCS 最具战略意义的行业，因为煅烧排放无法消除，约占行业 CO2 排放的 60%，换燃料解决不了。该行业每年生产约 40 亿吨水泥（2024 年），占全球 CO2 排放约 8%。2025 年
              6 月，Heidelberg Materials 在挪威 Brevik 启用全球首个工业规模水泥 CCS 设施，采用 SLB Capturi 胺基溶剂技术，每年捕集约 400,000 吨 CO2（占工厂排放
              50%）。但这个里程碑依赖挪威政府在 Longship 计划下提供超过 80% capex、以及 10 年内 75–100% 合格 opex 的资金支持。LeadIT 2026 年 5 月 Green
              Cement Technology Tracker 映射了全球 175 个以上水泥 CCS 项目，但预计到 2035 年行业 CO2 捕集比例不到
              2%——这个缺口醒目地说明，项目公告和项目完工之间差很远。Holcim（比利时 Obourg）和 Heidelberg（瑞典 Slite）的项目停滞，都与政府资金失败直接挂钩。


              纸浆和造纸是 Svante 当前最活跃的商业行业：生物质燃烧产生的锅炉烟气 CO2 浓度适中，适合改造捕集；如果 CO2 属于生物源，捕集并封存后可生成面向高溢价 CDR 市场的 BECCS 信用额。Svante
              的 Mercer International Alberta 项目瞄准的正是这个板块。2025 年，全球 BECCS 在项目开发产能上首次超过 DAC（S&P
              Global），说明投资人越来越认可生物源捕集经济性。钢铁是中期机会：高炉路线每吨钢排放 2.0–2.2 吨 CO2；天然气 DRI 加 CCS 可降至约 0.6 吨 CO2/吨，EU CBAM
              分阶段实施也开始给传统钢材出口欧洲施加成本压力。制氢（SMR + CCS）、化工和垃圾发电共同构成近期 TAM 的其余部分。IEA 确认，到 2030 年投运的新 CCUS 项目中，超过一半瞄准制氢、CDR
              或难减排工业行业，标志着市场正从传统天然气处理主导转向新的结构。
