      - number: '5.3'
        title: 技术架构与运行模式
        blocks:
          - type: paragraph
            body: >
              VeloxoTherm 工艺是一套获得专利的快速循环温度变动吸附（RC-TSA）系统。烟气经过预处理后进入旋转吸附机：直接接触冷却器（DCC）将气体温度降至 50°C
              以下，湿式洗涤器去除硫氧化物（SOx）和颗粒物，保护床去除残余污染物。在 RAM 内，气体接触 CALF-20 涂覆的结构化吸附床（SAB）。CALF-20——化学式为
              Zn₂(1,2,4-triazolate)₂(oxalate)、商业名称 Calgary Framework 20 的框架材料——通过物理吸附对 CO₂ 具备相对水和氮的高选择性，不需要断裂化学键。RAM
              旋转经过三个功能区：吸附区让 CO₂ 结合到吸附剂上，再生区用低压蒸汽冲洗并浓缩 CO₂，调理区负责冷却和准备。完整吸附-解吸循环约 60 秒完成。浓缩 CO₂（通常纯度 95%+）随后进入 CO₂
              净化和压缩系统——95%+ 纯度可用催化氧化，最高 99.9% 纯度可用深冷精馏——再被压缩至管道压力（Linde SMR FEED 中为 ≥2,200 psia）。OSTI DOE 关于 Linde SMR
              pre-FEED 研究的最终报告测算，再生蒸汽与 CO₂ 比约为每捕集 1 kg CO₂ 需要 1.22 kg 蒸汽，并可通过热整合和蒸汽回收进一步优化。
