      - number: '1.5'
        title: 里程碑与商业进展
        blocks:
          - type: paragraph
            body: >
              Svante 的里程碑从 2007 年车库研发创业起步，走到 2025 年商业规模滤芯制造设施投产，再到 2026 年 4 月签下首个大型碳移除承购协议。关键商业合作包括：获得美国 DOE
              DE-FE0031944 资助的 Chevron Kern River 试点；Lafarge Richmond 水泥厂 CO₂MENT 试点；2025 年 4 月与 Mercer International 在
              Alberta Peace River 纸浆厂推进的 Pre-FEED（FEL-2）阶段项目；以及位于 Texas、Delek US Big Spring Refinery 的 FEED-ready
              项目。2026 年 3 月，Svante 收购 Calgary 的 Carbon Alpha Corporation，连同其在 North Star Carbon Solutions 的权益——这是
              Saskatchewan 的一个 BECCS 项目，与代表九个 First Nations 的 Meadow Lake Tribal Council（MLTC）合作开发。MLTC 将共同拥有该 BECCS
              设施。North Star 一期将从 MLTC Bioenergy Centre 每年最高捕集 140,000 吨 CO₂；预计 2027 年一季度作出 FID。2026 年 4 月，Microsoft 同意在
              15 年内从 North Star 购买 626,000 吨 CDR 信用额——这是 Microsoft 首个加拿大 BECCS CDR 承购协议，也被认为是加拿大首个涉及 Indigenous
              所有权的此类协议。North Star 计划 2029 年初开始商业运营。2025 年，Svante 推出三个新业务单元（OEM&D、Development Company、Solutions & Digital
              Services），并与 SAMSUNG E&A 发布联合预制模块化解决方案「CREADY」。公司 2025 年入选 Global Cleantech 100 Hall of Fame，并跻身 TIME 与
              Statista 评选的 2025 年 Top 100 Greentech Companies。
