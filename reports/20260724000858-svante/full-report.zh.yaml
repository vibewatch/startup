  - id: TM004
    title: 增长驱动因素与采用约束：工业 CCS
    columns:
      - 因素
      - 方向
      - 时间窗口
      - 对 Svante 的影响
      - 尽调问题
    rows:
      - - 美国 45Q 税收抵免（工业 $85/t，DAC $180/t）
        - 驱动因素（强）
        - 当前（投运起 12 年窗口）
        - 改写项目经济性；让许多工厂现金流转正；可直接作为融资基础
        - Svante 如何在商业协议中安排 45Q？谁申领抵免？
      - - 加拿大 OBPS 碳价（CAD $95/t，上涨中）
        - 驱动因素（中等）
        - 当前且上涨中（2027–29 年升至 $100/t，2030 年升至 $115/t）
        - 强化 Alberta 和 BC 工业工厂的避免费用信号
        - Svante 客户合同是否引用 OBPS 合规价值，或使用影子碳价？
      - - EU ETS 碳价（2026 年约 €70–75/t）
        - 驱动因素（中等，部分）
        - 当前有效但波动大；只有持续高于 €105/t、跨过 CCUS 盈亏平衡线才有意义
        - 低于端到端 CCUS 全成本盈亏线；EU 项目仍需要补贴桥接
        - EU 项目管线对 EUA 价格情景有多敏感？
      - - EU CBAM 分阶段导入（钢铁、水泥、化工，2026+）
        - 驱动因素（结构性）
        - 多年分阶段导入（2026–2034）
        - 倒逼欧洲难减排出口商转向包括 CCS 在内的低碳路径
        - Svante 邻近 EU 的管线项目是否受益于 CBAM 价格信号？
      - - EU Net-Zero Industry Act（2030 年 50 Mtpa 封存要求）
        - 驱动因素（结构性）
        - 政策已生效；2030 年截止
        - 刺激欧洲封存基础设施建设，削弱关键约束
        - 哪些共享封存枢纽可供 Svante 的欧洲目标客户接入？
      - - CO₂ 运输与封存基础设施接入
        - 约束（硬门槛）
        - 当前存在；缓慢改善
        - 没有封存合作方，即便捕集经济性成立，项目也无法走到 FID
        - Svante 客户正积极推进哪些封存合作？Northern Lights 管线时间表如何？
      - - EPA Class VI 许可瓶颈（历史上 3–6 年）
        - 约束（重大）
        - 当前存在；2026 年小幅改善（约每季度 3 张许可，此前 13 年共 8 张）
        - 拖慢美国工业 CCS；获授权州（TX、WY、ND、LA）的项目推进可更快
        - Svante 在北美的目标工厂位于州主导审批州，还是 EPA 审核辖区？
      - - FOAK 资本强度与融资风险
        - 约束（重大）
        - 当前存在；先行者承担最高风险
        - Svante 的模块化滤芯方案相较大型溶剂系统可能降低单项目资本开支，但 FID 仍需要补助 + 抵免 + 债务拼成资金栈
        - Svante 单厂典型资本开支区间是多少？政府资金覆盖多少？
      - - IEA / 分析师对 CCUS 在净零中作用的分歧
        - 约束（声誉）
        - 持续存在；IEA WEO 2025 下调 CCUS 占比
        - 如果没有强政策兜底，投资者怀疑可能推高 CCUS 项目资本成本
        - Svante 销售材料如何回应 IEA 关于 CCUS 作用很小的叙事？
      - - 定制化项目设计（缺少模块化学习曲线）
        - 约束（结构性）
        - 持续存在
        - 成本下降慢于太阳能 PV 或电池；每个场址都需要定制工程
        - Svante 的标准化滤芯模块架构能否缓解竞争对手的定制化问题？
    notes: 方向评级（驱动因素 / 约束）和时间窗口来自公开证据的定性评估。45Q、OBPS 和 ETS 的财务数字来自官方 / 监管来源；成本盈亏平衡估计来自 IEEFA 和 Agora Industry 研究。
