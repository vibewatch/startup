      - number: '1.2'
        title: 创立历史与技术
        blocks:
          - type: paragraph
            body: >
              2007 年，Brett Henkel、André Boulet、Darryl Wolanski 和 Soheil Khiavi 四位来自气体净化与分离行业的专业人士，在不列颠哥伦比亚省 Burnaby
              的一间车库里创办了 Svante。联合创始人兼战略客户与政府事务副总裁 Brett Henkel 曾任职 QuestAir Technologies。公司早期通过 Series A 和 B 轮获得 Roda
              Group、Mitsui、Chevron Technology Ventures（2014 年首次投资）和 Chrysalix 的研发资金，也拿到加拿大、英国政府和 Alberta
              省提供的实验室规模项目资金。诺贝尔奖得主、美国前能源部长 Steven Chu 早期加入董事会，为公司背书科学和政策可信度。公司的关键技术突破，是把 MOF 纳米材料——尤其是 CALF-20，其发明者 2025
              年获得诺贝尔化学奖——作为固体吸附剂涂覆在层压滤片上。滤芯通过类似薄膜电池生产的自动化卷对卷工艺制造。2019 年，Svante 与 Cenovus（原 Husky Energy）合作，在
              Saskatchewan 上线一座每日 30 吨（TPD）CO₂ 捕集试点；位于不列颠哥伦比亚省 Richmond 的 Lafarge 水泥厂 CO₂MENT 试点实现每日捕集 1 吨。2025 年 5
              月，Svante 正式投产 Redwood Facility——位于不列颠哥伦比亚省 Burnaby、面积 141,000
              平方英尺的卓越中心，也是全球首座基于固体吸附剂的碳捕集滤芯商业制造工厂，年产滤芯最高可支持捕集 1000 万吨 CO₂。
