      - number: '5.7'
        title: 信任、安全、环境测试与质量
        blocks:
          - type: paragraph
            body: >
              Svante 已在真实工业条件下对 CALF-20 系统做过有针对性的环境和安全测试。在 CO₂MENT 水泥厂试点中，使用 ESI-MS 和 FTIR 的化学分析显示，CALF-20 层压基质在长期暴露于含
              NOx 的水泥烟气后，没有检测到硝胺或亚硝胺化合物，确认不存在胺基系统已知的有毒二次排放风险。Linde SMR pre-FEED DOE
              研究包含正式的环境、健康与安全（EH&S）风险评估和危险识别（HAZID）研究，覆盖排放、废流和结构化吸附剂毒理。Chevron Kern River 项目根据 DOE Cooperative Agreement
              DE-FE0031944 执行，需满足 DOE 合规要求，并产出完整差距分析和技术经济分析。Svante 的 CO₂ 产品规定纯度 ≥95%，满足运输和封存的管输级标准。截至本次报告日期，公司没有公开披露 ISO
              认证或第三方质量管理体系审计，因此正式质量保障基础设施的透明度仍是潜在客户和项目融资交易对手的开放尽调事项。
