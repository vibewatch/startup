          - type: callout
            title: FID 前必须核实 Class VI 封存伙伴和时间表
            body: >-
              截至 2026 年 Q1，只有 5 个项目正在通过 Class VI 井注入 CO₂，另有 106 份申请待批。Louisiana 的暂停令和 North Dakota 的法院挫折进一步收紧封存瓶颈。任何假设美国
              BECCS 项目在 2026–2027 年 FID 的投资论点，都必须核实一个具体的墨西哥湾沿岸 Class VI 封存伙伴已经确定、已在非暂停州提交许可申请，并有可信时间表在项目的 OBBBA
              开工窗口关闭前拿到最终许可。
