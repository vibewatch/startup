  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 技术放大与 FOAK 执行风险
        blocks:
          - type: paragraph
            body: >-
              Svante 的商业论点完全建立在 FOAK 碳捕集工厂能够按规格、按期运行之上。位于 BC 省 Burnaby 的 Redwood 超级工厂于 2025 年 5 月投用，是全球第一座商业规模 MOF
              吸附剂过滤器制造设施，可装备每年最高捕集 1000 万吨 CO₂ 的工厂。不过，制造产能本身不能保证商业性能：每个实际捕集装置仍是在工业业主存量场址上的首台套集成。美国东南部 BECCS 项目（>500,000
              吨 / 年，纸厂回收锅炉）截至 2026 年 3 月仍处于可行性研究阶段；工程、成本 / 进度估算和风险评估仍在推进，尚未作出任何最终投资决定。

              更广泛 CCUS 行业的 FOAK 项目已有充分记录：成本超支、进度延误和性能不达标反复出现。2025 年，美国约 42 个 FOAK 清洁能源项目被取消。UK Public Accounts
              Committee（2025 年）指出，英国没有 CCUS 技术以商业规模运行的案例，国际案例也显示政府性能预期「远不能保证」。IEEFA 2026 年 1 月向 EU Parliament 的报告显示，IEA
              在 WEO 2021 到 WEO 2025 之间把 CCS 贡献估计下调超过 82%，原因是反复低于预期迫使预测重新校准。IEEFA 对 16 个在运项目的分析发现，尽管行业宣称可达到 95%
              捕集率，但没有任何现有项目能年复一年稳定捕集超过 80% 的 CO₂。Saskatchewan 的 Boundary Dam 项目捕集率从未超过 60%。常见 FOAK
              失败模式包括未预期的集成挑战（热管理、压力动态、循环损失）、吸附剂降解，以及存量工业场址上的承包商延误。Svante
              的模块化旋转接触器设计可部分缓解这些风险——在气候技术比较数据中，模块化与较低成本超支相关——但无法消除 FOAK 执行不确定性。从 FOAK 走向 NOAK 的学习曲线取决于早期项目成功，因此 Södra
              试点（瑞典）和美国 BECCS 项目对后续管线加速具有不成比例的重要性。
