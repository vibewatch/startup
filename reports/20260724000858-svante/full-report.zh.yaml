      - number: '8.5'
        title: 退出准备、否决触发点与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              Svante 在 2027–2030 年窗口最可能的退出路径，是被能源巨头战略收购（Chevron 已是 Series E 领投方，并可能在退出情景中行使优先报价权），或可能性更低的 IPO
              前后期私募轮。公司尚未宣布 S-1、F-1 或招股书备案；公开市场对纯碳捕集标的并不友好（Aker Carbon Capture 于 2025 年 10 月退市）。Carbon Engineering
              在没有此前收入、此前融资约 US$110M 的情况下以 $1.1B 退出给 Occidental，意味着早期支持者获得 10x
              投入资本回报——历史上很有吸引力，但作为参照仍不确定。今天的新投资者若要保持入场纪律，必须弄清 CGF 可转债转换机制和优先权栈；30 多轮历史融资中嵌入的清算优先权，可能大幅稀释新普通股。

              论点失效触发点可量化：到 2027 年 Q4 仍没有至少一个 FOAK 项目达成 FID，说明管线尚未去风险；低于隐含 US$1B 标记的降估值股权融资会重定价投资者持仓；DOE 项目取消若显著缩小符合美国
              45Q 条件的项目管线，会压窄可服务市场；主要市场碳价跌破 US$50/吨，即便有税收抵免，增量捕集经济性也不可行。

              最终尽调问题集中在财务披露、治理和项目特定里程碑。没有经审计财务、股权结构细节和 CGF 票据转换条款披露，当前隐含估值区间无法收窄到点估值。Terry Lefebvre 于 2026 年 5 月获任
              CFO，可能会加快公司为未来资本进程准备财务系统，但对需要精确估值支撑的投资者来说，信息缺口仍是阻断项。
