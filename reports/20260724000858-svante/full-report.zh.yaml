      - number: '4.3'
        title: CGF 可转债及战略投资者影响
        blocks:
          - type: paragraph
            body: >-
              Canada Growth Fund 2024 年 8 月的 US$100M 可转债，是近期结构意义最强的融资事件。CGF 将投资分成两笔：第一笔 US$50M 立即投入，用于商业开发和 FOAK
              项目共同投资；第二笔 US$50M 可按具体项目提款，但需双方批准。作为可转债，这些工具让 CGF 有权把债务转为股权；在估值上限、利率和转股触发条件均未公开的情况下，现有股东面临潜在稀释。

              从战略上看，CGF 投资把 Svante 的资本投放角色从设备制造商推向主动项目共同投资者。CEO
              确认，这笔资金用于让公司「拥有足够现金，基本上能够投资这些项目，而这些项目最终会带来投资回报」。这是一次资本密集型转向：200,000–1,000,000 吨 / 年区间的 FOAK
              项目，每个都需要可观股本投入；CGF 的第一笔资金预计只能支持少数初始部署。CGF 也通过这笔交易完成其在 British Columbia 的首笔投资，释放出强烈政府背书：Svante
              的知识产权和制造能力应留在加拿大。

              战略投资者结构——Chevron、Delek、OGCI Climate Investments、Suncor 等油气股东合计持有
              40%——既带来潜在同向，也带来张力。这些投资者在成功部署上同时有技术和财务利益，能提供商业管线；但也可能把 Svante 的边界限制在化石燃料相邻的脱碳场景，而不是更广泛的 CDR 市场。
