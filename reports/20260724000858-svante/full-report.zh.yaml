            body: >-
              2025–2026 年未发现专门点名 Svante Technologies 的诉讼、执法行动或专利纠纷。法律风险主要来自 CCUS 行业的系统性挑战：Class VI
              主导权诉讼、影响孔隙空间权利的合并法规挑战、PHMSA 管道规则制定，以及 California CARB 规则制定。这个区分很重要：风险是管道受阻和市场结构性问题，而不是公司自身的诉讼责任。
