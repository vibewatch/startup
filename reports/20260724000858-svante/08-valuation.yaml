  - id: scenario-analysis
    title: Bull, Base, and Bear Scenario Analysis
    body: >-
      Three valuation scenarios bracket the range of outcomes for a hypothetical
      investor with a 2026–2029 horizon. The bull case requires that 3–5 FOAK
      projects reach final investment decision by end-2027, that Svante begins
      recognising filter manufacturing revenue from first commissioned plants, and
      that one or more strategic acquirers (energy majors, OEM conglomerates) engages
      in a competitive bidding process. FTI Consulting's analysis of the CCS M&A
      market identified nearly 30 potential buyers for a single carbon-management
      infrastructure asset in 2023, suggesting that strategic demand for proven
      platform assets remains high. Under these conditions, an Oxy/Carbon Engineering
      analog at US$1.1 billion — itself a pre-revenue deal — sets a realistic exit
      floor, with synergy premia pointing toward US$2–3 billion enterprise value if
      Svante's deployment pipeline materialises before its competitors.

      The base case assumes 1–2 FOAK projects reach FID by 2027, with commercial
      filter sales beginning in 2027–2028 at modest volumes, and a follow-on Series F
      or structured debt round to fund construction commitments. In this scenario,
      the most comparable public transaction anchor is the SLB/Aker deal at ~US$475M
      implied equity for an operationally active company — suggesting Svante's
      base-case as a pre-revenue platform is in the US$800M–US$1.2B range, consistent
      with third-party estimates and the implied valuation of its most recent rounds.

      The bear case applies if FOAK project timelines slip further, US policy
      uncertainty intensifies post-2026, or a down-round is required to fund bridge
      capital. Aker Carbon Capture's delisting and wind-down demonstrates that even a
      commercially active point-source CCS company cannot sustain a public listing
      without sustained revenue growth. A bear-case valuation compression to
      US$300–500M would reflect 1x–1.5x the tangible asset base, consistent with
      distressed or restructuring scenarios.
