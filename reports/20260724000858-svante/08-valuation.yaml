  - id: comparable-set
    title: Comparable Transactions, Public Comps, and Methodology
    body: >-
      No directly comparable public company exists for Svante's specific positioning
      as a pre-revenue modular solid-sorbent carbon-capture OEM and project
      co-developer. Valuation therefore requires a triangulated approach using four
      methodologies. First, M&A transaction comps: Occidental Petroleum's US$1.1B
      acquisition of Carbon Engineering (August 2023) provides the most analogous
      data point — a Canadian-domiciled carbon-capture technology company acquired
      on technology platform value rather than current revenue, approximately 10x
      the invested capital. SLB's US$382M payment for 80% of Aker Carbon Capture
      ($475M implied equity) provides a ceiling anchor for an operationally active
      but still-scaling platform. The Oxy/Holocene acquisition in April 2025 (terms
      undisclosed) signals continued consolidation appetite at the sub-$500M range.

      Second, public company comps: Bloom Energy (NYSE: BE) delivered Q1 2026 revenue
      of US$751M (130% YoY growth) with an enterprise value of approximately US$74B,
      implying a ~24–26x EV/Revenue multiple — this multiple is aspirational and
      reflects Bloom's AI/data-centre demand tailwind rather than a CCS sector norm.
      LanzaTech (NASDAQ: LNZA) provides the bear-case cautionary data: ~90% stock
      decline, going-concern warning, and a 1:100 reverse split — demonstrating
      that pre-commercial carbon-utilisation platforms are exposed to severe
      de-rating when revenue milestones slip. Green energy sector median EV/Revenue
      was 5.4x and median EV/EBITDA was 16.3x as of Q1 2026 per Finerva analysis,
      but these apply to revenue-generating companies. For a pre-revenue platform,
      revenue multiples are not applicable.

      Third, private-market comps: Climeworks (DAC, not a direct comp) has raised
      over US$1B total including a US$162M Series G in July 2025, with undisclosed
      valuation but third-party estimates of US$2.5–5B. Carbon Clean ($243M raised)
      has no publicly disclosed valuation. These comps suggest climate-tech carbon
      removal leaders command multi-hundred-million-dollar private valuations even
      pre-commercialisation.

      Fourth, replacement-cost/asset-based floor: US$145M Redwood factory plus
      IP/patent portfolio (30+ patent families) plus strategic partner ecosystem
      plus FOAK project optionality yields approximately US$450–600M. FOAK project
      financing dynamics from Elemental Impact's June 2025 survey indicate 69% of
      investors expect FOAK capital availability to shrink through 2026, which
      pressures standalone pre-revenue valuations — reinforcing the case for a
      cautious base-case range rather than peak cycle multiples.
