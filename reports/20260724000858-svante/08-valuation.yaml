  - id: exit-diligence-triggers
    title: Exit Readiness, Kill Triggers, and Final Diligence Asks
    body: >-
      Svante's most plausible exit paths in the 2027–2030 window are a strategic
      acquisition by an energy major (Chevron is already the lead Series E investor
      and could exercise a right-of-first-offer in an exit scenario) or, less
      probably, a late-stage private round before an IPO. No S-1, F-1, or
      prospectus filing has been announced; public markets have been inhospitable
      for pure-play carbon-capture vehicles (Aker Carbon Capture delisted October
      2025). Carbon Engineering's $1.1B exit to Occidental with no prior revenue
      and approximately US$110M in prior raise implies a 10x return on invested
      capital for early backers — a historically attractive but uncertain analog.
      Entry discipline for new investors today requires understanding the CGF
      convertible note conversion mechanics and the preference stack, which could
      significantly dilute new common equity depending on liquidation preferences
      embedded in 30+ prior rounds.

      The thesis-break triggers are measurable: failure to reach FID on at least
      one FOAK project by Q4 2027 would indicate the pipeline is not de-risked;
      a down-round equity raise below the implied US$1B mark would re-price
      investor positions; DOE programme cancellations materially reducing the
      US 45Q-eligible project pipeline would narrow the addressable market; and
      carbon price collapse below US$50/tonne in major markets would make
      incremental capture economics non-viable even with tax credits.

      The final diligence asks are concentrated in financial disclosure, governance,
      and project-specific milestones. Without audited financials, cap-table details,
      and disclosed conversion terms for the CGF note, the current implied valuation
      range cannot be narrowed to a point estimate. The upcoming CFO (Terry Lefebvre,
      appointed May 2026) appointment may accelerate financial system readiness for
      a future process, but the information gap remains blocking for investors seeking
      precise valuation support.
