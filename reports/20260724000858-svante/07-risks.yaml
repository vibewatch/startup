  - id: regulatory-legal-policy
    title: Regulatory, Legal, and Policy Risk
    body: >-
      Svante's project economics depend on U.S. federal 45Q tax credits and Canadian federal/provincial
      carbon pricing mechanisms. The One Big Beautiful Bill Act (OBBBA, signed July 4, 2025) preserved
      45Q at $85/tonne for point-source CCS through 2026 but did not adjust for inflation already incurred.
      The Carbon Capture Coalition calculates that inflation has eroded over half the 2022 credit increase,
      reducing the effective value to approximately $68/tonne while construction and equipment costs rose
      30–40% between 2020 and 2024. Inflation adjustment does not apply until 2027. The OBBBA also
      restricts transferability for facilities not beginning construction within two years of enactment
      (~July 2027), adding a hard project timeline deadline. Additionally, the DOE terminated 321 financial
      awards totaling approximately $7.56 billion in October 2025, eliminating the government co-investment
      backstop that historically de-risks early-stage CCUS projects.

      Class VI well permitting for CO₂ storage is the key regulatory bottleneck. As of Q1 2026, 106 Class
      VI applications were under review and only 3 final permits had been issued in 2026, with only 5
      projects actively injecting CO₂. Louisiana enacted a moratorium in October 2025 on new Class VI
      applications; North Dakota courts struck down the state's amalgamation statute in two 2026 decisions
      (Northwest Landowners Association v. State; Swenson Living Trust v. NDIC), ruling pore-space
      consolidation an unconstitutional taking—potentially invalidating Summit Carbon's Class VI permit
      and setting adverse precedent. Fourth Circuit challenges to West Virginia's primacy (West Virginia
      Surface Owners' Rights Organization v. Zeldin) remain pending. California's CARB released draft
      CCUS regulations in May 2026 imposing 100-year post-injection monitoring obligations. PHMSA proposed
      comprehensive CO₂ pipeline safety rules in 2025 adding new design, emergency-response, and vapor-
      dispersion requirements in response to the 2020 Satartia, Mississippi incident. No direct regulatory
      enforcement actions, lawsuits, or patent disputes specifically naming Svante were identified as of
      mid-2026; Svante's legal exposure is systemic to the CCUS industry rather than firm-specific.
    claimRefs:
