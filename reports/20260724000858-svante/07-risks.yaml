callouts:
  - calloutType: risk
    title: "FOAK Execution Gap Is the Primary Thesis-Break Risk"
    body: >-
      No Svante capture plant has yet operated at full commercial scale. The Södra pilot (Sweden, 2025)
      and the U.S. BECCS project (feasibility phase, March 2026) are the nearest-term validation events.
      If the first commercial FOAK plant fails to achieve >80% capture rates or significantly overruns
      cost/schedule, investor confidence will erode and Nth-of-a-kind economics will remain unproven.
      IEEFA found that no existing CCS project has consistently captured more than 80% year-in, year-out
      despite industry claims of 95%+ achievability. Diligence should insist on independent technical
      review of the FOAK performance pathway and performance data from Kern River and Södra.
    claimRefs:
      - CR001
      - CR002
      - CR004

  - calloutType: risk
    title: "45Q Inflation Erosion Silently Undermines Project Economics"
    body: >-
      The Carbon Capture Coalition calculates that inflation has already reduced the effective 45Q credit
      value from $85 to approximately $68/tonne since 2022, while construction and equipment costs increased
      30–40% over the same period. The OBBBA preserves the nominal rate until 2027 but does not adjust for
      inflation already incurred. Projects modeled against a real $85/tonne subsidy may find their IRRs
      materially impaired. The 2-year transferability window (~July 2027) additionally forces accelerated
      construction-start decisions, adding execution pressure.
    claimRefs:
      - CR008
      - CR009
      - CR015

  - calloutType: recommendation
    title: "Diligence Must Verify Class VI Storage Partner and Timeline Before FID"
    body: >-
      As of Q1 2026, only 5 projects are actively injecting CO₂ via Class VI wells and 106 applications
      are pending. Louisiana's moratorium and North Dakota's court setbacks have tightened the storage
      bottleneck. Any investment thesis assuming a 2026–2027 FID for the U.S. BECCS project must verify
      that a specific Gulf Coast Class VI storage partner has been identified, has filed a permit
      application in a non-moratorium state, and has a credible timeline to receiving a final permit
      before the project's OBBBA construction-start window closes.
    claimRefs:
      - CR010
      - CR011
      - CR016

  - calloutType: insight
    title: "No Direct Litigation Against Svante; Risk Is Systemic, Not Firm-Specific"
    body: >-
      No lawsuits, enforcement actions, or patent disputes specifically naming Svante Technologies were
      found in 2025–2026. Legal risk is dominated by systemic CCUS industry challenges: Class VI primacy
      litigation, amalgamation statute challenges affecting pore-space rights, PHMSA pipeline rulemaking,
      and California CARB rulemaking. This distinction is material: risk is pipeline-blocking and
      market-structural rather than litigation-liability against the firm itself.
    claimRefs:
      - CR013
      - CR014
      - CR037

