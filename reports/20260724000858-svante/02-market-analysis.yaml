    approximationNotes: "Stage percentages are illustrative attrition estimates based on project success rates implied by GCCSI (77 operating vs. 734 pipeline = ~10%), LeadIT cement data (175 projects → ~38 projected by 2035 = ~22%), and industry project development reporting; not derived from a proprietary funnel survey."
    claimRefs: [CM009, CM013, CM027, CM028, CM033, CM036]

callouts:
  - calloutType: risk
    title: "Storage Access Is the Rate-Limiting Constraint, Not Capture Technology"
    body: "Every advancing industrial CCS project to date has succeeded only with access to a shared CO2 transport and storage network (Northern Lights, Porthos, Ravenna Hub). Projects that failed to secure storage access—including Heidelberg's Slite (Sweden) and Vicat's Lebec (California)—were terminated or suspended regardless of technology readiness. This positions CO2 infrastructure as the primary constraint on Svante's addressable pipeline, not its capture technology performance."
    claimRefs: [CM033, CM039]

  - calloutType: insight
    title: "45Q as the US Market's Bedrock: $85/Tonne Industrial CCS Credit Reshapes Project Economics"
    body: "The 45Q credit at $85/tonne for industrial point-source CCS—updated by the IRA (2022) and OBBBA (2025)—is now the single most powerful financial instrument in the US decarbonization toolkit. For a facility capturing 1 million t CO2/year, this generates $85M/year in tax-credit revenue for 12 years. The credit is transferable and eligible for direct Treasury pay, making it financeable without a tax liability. IRS Notice 2026-1 provides additional safe-harbor clarity for 2025 compliance amid EPA reporting transitions. This creates a durable economic basis for Svante's North American pipeline, independent of carbon market price levels."
    claimRefs: [CM016, CM017, CM018, CM038]

  - calloutType: assumption
    title: "SAM Estimate Relies on Sector-Share Assumptions Not Validated by Primary Data"
    body: "The SAM for Svante's modular solid-sorbent platform within the global CCS market is estimated by applying a 40–50% hard-to-abate industrial share (from WEF and GCCSI sector analyses) to analyst TAM figures. No analyst report specifically sizes the modular solid-sorbent retrofit market for industrial facilities in North America. This estimate should be treated as a preliminary bound pending primary market research and customer pipeline data from Svante."
    claimRefs: [CM007, CM025]

  - calloutType: risk
    title: "IEA WEO 2025 Downgrade of CCUS Role Is a Material Adverse Signal"
    body: "The IEA's World Energy Outlook 2025 assigns CCUS at most 4.9% of cumulative emissions reductions by 2050—down from 13% in WEO 2021. This declining trajectory reflects increasingly competitive renewables and electrification economics. IEEFA separately calculates that EU end-to-end CCUS disposal costs (€105–280/tonne) exceed EU ETS prices in all but one quarter since 2019. These findings do not preclude Svante's market opportunity, which is driven by compliance mandates and 45Q/OBPS economics rather than carbon market prices alone, but they warrant scrutiny of long-term market size assumptions."
    claimRefs: [CM021, CM022, CM036]

