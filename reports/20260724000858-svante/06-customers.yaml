company:
  name: Svante Technologies

chapter:
  number: 6
  title: Customers
  summary: >-
    Svante's customer and partner ecosystem spans seven industrial sectors but remains entirely
    pre-commercial as of June 2026, with all relationships at MOU, pilot, pre-FEED/feasibility,
    or engineering stage and no disclosed commercial revenue. The single confirmed revenue
    contract — Microsoft's 15-year, 626,000-tonne CDR offtake for the North Star BECCS project —
    validates buyer appetite for high-quality removal credits but points to heavy customer
    concentration risk. Equity investors including Chevron, GE Vernova, and Delek US double as
    project hosts, creating a dual-role ecosystem that must be assessed for governance complexity
    rather than purely as commercial traction.

sections:
  - id: customer-segmentation
    title: Customer Segmentation and Buyer Landscape
    body: >-
      Svante's addressable market spans hard-to-abate industrial sectors: cement and building
      materials, pulp and paper (including BECCS), oil and gas refining, power generation (NGCC),
      forestry biomass, and emerging corporate CDR credit markets. The company distinguishes
      across at least four buyer archetypes: industrial emitters who host capture plants and
      receive decarbonization value; equity investors who sometimes serve as deployment
      counterparties; channel and OEM partners who bring market access; and CDR off-take buyers
      who purchase removal credits. As of June 2026, Svante has disclosed active relationships
      in North America (Canada and the US) and Europe (Sweden), with North America accounting
      for at least five active project sites compared with one EU pilot. Geography skews toward
      jurisdictions with carbon-pricing or tax-credit mechanisms (Canadian OBPS/federal carbon
      price, US 45Q, EU ETS/RRF), reflecting the policy sensitivity of industrial CCS economics.
      No customer segment has yet reached a revenue-generating commercial contract except the
      North Star CDR off-take. The investor-as-customer dynamic — where Chevron New Energies
      led the $318M Series E and also hosted the Kern River pilot, and where Delek US sits in
      both investor and commercial project host roles — blurs traditional customer-acquisition
      signals and requires diligence on whether project selection reflects true market pull or
      investor-directed pipeline management. Channel partners (Samsung E&A for OEM plant
      assembly, Carbon America and Tenaska/Storegga for project development and storage) are
      critical for scaling beyond Svante's direct business development reach.
