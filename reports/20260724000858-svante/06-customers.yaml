  - id: named-customer-proof
    title: Named Customer Proof and Project Case Studies
    body: >-
      Svante's strongest proof points come from a series of staged industrial deployments
      progressing through formal engineering milestones. The Chevron Kern River pilot
      (Q2 2023 – August 2024) is the most technically validated relationship: it achieved
      95% CO2 product purity and ~83% capture recovery on industrial boiler flue gas, and
      demonstrated rapid load-following with approximately 60-second adsorption-desorption
      cycles. Results were published by NETL and Svante in the June 2025 update, providing
      independent technical validation beyond company claims. Lafarge Canada's Project
      CO2MENT at the Richmond, BC cement plant has been running since 2019 and reached Phase 3
      in 2023, converting 1 tonne/day of captured CO2 into synthetic hydrocarbons in
      partnership with Dimensional Energy — the first such demonstration at a cement plant.
      The LafargeHolcim Colorado pre-FEED study (completed January 2023) evaluated a
      1.5 Mt/yr commercial-scale plant at the Holcim Florence cement plant, concluding
      economic feasibility if 45Q credits reach $85/tonne. The Delek Big Spring refinery
      project represents Svante's largest funded commercial deployment: the DOE committed
      approximately $95 million (revised to $91M per USAspending records) toward 145,000
      tpa CO2 capture from an FCCU, with engineering underway and construction targeted
      for 2027–2028. In pulp and paper, Mercer International advanced to Pre-FEED at the
      Peace River Alberta mill in April 2025, while Södra launched Svante's first EU deployment
      at the Värö Sweden mill in early 2026. The undisclosed integrated sustainable packaging
      company advanced a Southeast US BECCS project (500,000+ tpa target) to feasibility in
      March 2026. The highest-quality commercial proof is the Microsoft North Star BECCS
      offtake: 626,000 tonnes of CDR credits purchased over 15 years from the MLTC/Svante
      joint venture in Saskatchewan, representing the first Canadian Indigenous-led BECCS
      CDR deal.
