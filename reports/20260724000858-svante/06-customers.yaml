  - id: FU003
    title: Customer Journey Map — Industrial Emitter to Commercial Deployment
    type: journey-map
    layout: wide
    summary: >-
      Traces the path from an industrial emitter's initial engagement with Svante through
      pilot validation, engineering, and final commercial carbon removal or CDR credit generation.
    data:
      nodes:
        - id: "mou"
          label: "Discovery & MOU"
          description: "Industrial emitter or CDR buyer identifies decarbonization need; Svante signs non-exclusive MOU or collaboration agreement"
        - id: "feasibility"
          label: "Pre-FEED / Feasibility Study"
          description: "Svante and counterparty complete engineering design, cost estimation, and risk assessment; government grants applied for"
        - id: "pilot"
          label: "Pilot / Demo Operation"
          description: "Small-scale capture plant deployed at the host site; technology performance validated under real industrial conditions"
        - id: "engineering"
          label: "FEED / Engineering & Permitting"
          description: "Detailed engineering; Class VI well permits or storage agreements; project financing secured; FID reached"
        - id: "construction"
          label: "Construction & Commissioning"
          description: "Full-scale plant built and commissioned; operational readiness testing; CDR MRV framework established"
        - id: "commercial"
          label: "Commercial Operation & CDR Offtake"
          description: "Plant at full capacity; CDR credits sold or CO2 stored; long-term off-take agreement active; repeat engagement or expansion"
    claimRefs:
      - CU029
      - CU030
      - CU027
      - CU037

callouts:
  - calloutType: strength
    title: "Microsoft CDR Offtake Validates High-Quality Removal Buyer Demand"
    body: >-
      The 15-year, 626,000-tonne Microsoft North Star BECCS CDR offtake agreement is the most
      significant customer proof point in Svante's portfolio: it is the only publicly confirmed
      commercial revenue contract, involves a Tier-1 technology company as buyer, establishes
      an Indigenous co-ownership model with long-term social license, and confirms that durable
      CDR credits from BECCS can attract corporate off-takers at scale.
    claimRefs:
      - CU023
      - CU024
      - CU025

  - calloutType: risk
    title: "Pre-Commercial Status and Single-Buyer Revenue Concentration"
    body: >-
      Svante has no disclosed commercial revenue from carbon capture operations as of June 2026.
      The only contracted revenue stream (Microsoft North Star CDR offtake) does not begin
      commercial delivery until 2029. The entire known pipeline relies on government grant
      co-funding and investor-as-customer relationships that could create misaligned incentives.
      IEEFA data showing Canadian CCS operating costs growing at 2× the rate of CO2 capture
      volumes signals systemic economic pressure on the Canadian portion of the project pipeline.
    claimRefs:
      - CU034
      - CU035
      - CU036
      - CU037
      - CU038

  - calloutType: recommendation
    title: "Diversify CDR Buyers and Pursue Arms-Length Customers Beyond Investor Base"
    body: >-
      Svante should prioritize securing additional CDR credit off-take agreements for the North
      Star and Integrated Packaging projects beyond Microsoft, and pursue at least one commercial
      project counterparty that is not an existing equity investor to demonstrate market-rate
      commercial traction. The Samsung E&A OEM channel, if activated with concrete plant orders,
      would provide the most capital-efficient path to revenue diversification.
    claimRefs:
      - CU027
      - CU035
      - CU040

