  - id: expansion-concentration-risk
    title: Expansion Dynamics and Concentration Risk
    body: >-
      Svante's channel strategy creates three expansion vectors: OEM licensing (Samsung E&A
      modular plant deployment targeting 100 plants/year), project developer channels (Carbon
      America in the US, with Tenaska and Storegga providing CCS transport/storage enabling
      infrastructure), and direct project development (Svante Development Inc. co-investing
      with industrial emitters, as in the Integrated Packaging and North Star deals). The
      pulp and paper sector has become the highest-density new project formation area
      (Mercer, Södra, Integrated Packaging, North Star — all announced in 2025–2026),
      suggesting a potential sector-specialization flywheel. Concentration risks are
      significant. First, a majority of Svante's announced project counterparties are also
      equity investors, meaning customer attrition and investor attrition would be
      correlated events. Second, the only confirmed commercial revenue contract (Microsoft
      North Star CDR offtake) represents 100% of known long-term commercial commitments.
      Third, government funding is embedded in at least three of the four major commercial
      projects, creating policy risk — changes to US 45Q, Canadian OBPS/CGF, or EU RRF
      disbursement frameworks could jeopardize project economics. Fourth, the IEEFA has
      documented that CCS operating costs in Canada are growing at twice the rate of CO2
      capture volumes, a systemic signal that large Canadian carbon capture projects may
      face persistent economic pressure. Procurement friction is high: projects require
      Class VI well permits (US) or equivalent regulatory approvals, with multi-year lead
      times that create pipeline uncertainty.
