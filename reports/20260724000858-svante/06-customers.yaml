  - id: retention-durability
    title: Retention, Durability, and Contract Structure
    body: >-
      Svante's project-by-project capital equipment and technology licensing model means
      traditional SaaS retention metrics (NRR, GRR, logo churn) do not apply. No NRR, GRR,
      or formal contract renewal rates have been disclosed, consistent with the company's
      private, pre-commercial status. Durability signals must instead be inferred from
      project milestone continuity: Project CO2MENT has run for over six years (2019–2026)
      across three phases with Lafarge Canada, suggesting Lafarge's engagement is durable.
      No announced cancellations or publicly reported withdrawals from any named partnership
      have been identified as of June 2026. The one formal long-term contract is the
      15-year Microsoft North Star CDR offtake. The typical project lifecycle for Svante's
      industrial counterparties involves MOU → pre-FEED (~1–2 years) → FEED (~1 year) →
      FID → construction (~2 years) → commercial operation, implying that revenue
      recognition from most current projects is 3–5 years away. The investor-as-customer
      overlap (Chevron, Delek, GE Vernova) suggests these early counterparties are unlikely
      to cancel in the near term, since doing so would harm their equity position. Government
      co-funding for Delek (DOE $91M), North Star (CGF $137M), and Södra (EU RRF) further
      increases near-term project durability by sharing the financial risk. There are no
      publicly reported satisfaction scores, reference calls, or third-party customer
      testimonials that would enable independent quality assessment.
