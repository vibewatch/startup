  - id: adoption-trajectory
    title: Adoption Trajectory and Deployment Maturity
    body: >-
      Svante's deployment trajectory follows a staged pipeline model from pilot validation
      to commercial-scale execution, with each stage representing a distinct milestone in
      the technology commercialization path. The earliest proof point (CO2MENT Richmond,
      2019) established cement as the first validated sector; the Chevron Kern River pilot
      (2023–2024) added oil and gas; Mercer (2025) and Södra, Integrated Packaging, and
      North Star (2025–2026) simultaneously expanded the pulp and paper and BECCS verticals.
      Total disclosed CO2 capture capacity across the known project pipeline exceeds 2.3 Mt/yr
      when full-scale targets are aggregated, though this figure is forward-looking with most
      projects still years from operation. The adoption funnel shows a classic early-stage
      technology adoption pattern: many MOUs and collaborations at the top, narrowing sharply
      to three active or launched pilots (Kern River completed, CO2MENT active, Södra launched),
      one project in engineering (Delek), and one contracted off-take (Microsoft North Star).
      This shape reflects an 18-month typical pilot-to-pre-FEED timeline for Svante's
      project counterparties. The key inflection point was the opening of the gigafactory
      (filter manufacturing facility) at Svante's Burnaby headquarters in May 2025, which
      shifts the constraint from technology readiness to commercial project development and
      project financing. No projects have yet reached commercial commissioning, meaning
      Svante's deployment maturity sits firmly in "engineering and permitting" rather than
      "commercial operation."
