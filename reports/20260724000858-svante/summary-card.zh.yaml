  topStrengths:
    - 先发制造护城河：全球唯一专用固体吸附剂碳捕集过滤器超级工厂已于 2025 年 5 月在 BC Burnaby 投产，竞争对手要复制这道产能壁垒既难又贵
    - >-
      战略投资人阵容很深，覆盖 Chevron New Energies、GE Vernova、Samsung Engineering、Temasek、OGCI Climate Investments 和 Canada Growth
      Fund，既验证技术，也为全球部署提供市场通道
    - >-
      美国 45Q（工业 $85/tonne、DAC $180/tonne，2025 年 7 月 OBBBA 保留）、加拿大 50% CCUS ITC 和欧盟 CBAM 共同托住政策底，正好为 Svante 瞄准的难减排行业撑起
      CCS 部署经济性
    - 与诺贝尔奖相关的 CALF-20 吸附剂 IP（2025 年化学奖），加上与 3M Ventures 围绕吸附剂供应链协同的合作，带来科学可信度和潜在材料成本优势
  topRisks:
    - 七个活跃项目合作全部仍未产生收入、尚未 FID；商业规模收入预计不会早于 2027–2028 年，从 Series E 到任何近期退出之间留下 3.5 年股权融资缺口
    - 信息不对称是核心投资风险：Series D 以后任何一轮都没有公开确认的投后估值，也没有审计财务；CGF 可转债转换条款不透明，使公允价值承保无法落笔
    - FOAK 执行风险仍高：IEEFA 数据显示，没有旗舰 CCS 项目能持续捕集目标 CO₂ 量的 80% 以上；CALF-20 吸附剂依赖 BASF 单一来源，是关键供应链脆弱点
    - 政策和市场风险在上升：IEA WEO 2025 下调了 CCUS 在净零路径中的作用，美国 DOE 取消补助又把 Svante 可触达市场推向加拿大，地理执行风险更集中
  unresolvedGaps:
    - Svante 自 Series D 以来任何融资轮都没有确认的投后估值，包括 CGF 可转债隐含转换价格
    - FY2025 和 2026 上半年审计收入、毛利率、烧钱速度和现金跑道仍未披露
    - Delek Big Spring、North Star BECCS Phase 1 和 Mercer Alberta 锚定项目的最终投资决策时间与项目经济性（capex、opex、捕集率保证）
    - Canada Growth Fund 可转债第二批提款状态、转换价格上限、利率和到期安排
    - 车队级商业规模下的长期吸附剂耐久性和 O&M 成本；公开渠道没有多年现场表现数据集
