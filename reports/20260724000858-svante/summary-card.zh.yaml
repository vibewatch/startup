summary:
  headline: Svante 拥有全球唯一的固体吸附剂碳捕集过滤器超级工厂，也拿到了同类公司里最强的战略投资人联盟；但公司尚未产生收入，全部商业项目仍在 FID 前，财务也未披露。FID 得到确认、披露变得充分之前，结论应是继续研究。
