- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim or threat
  - Type
  - Severity
  - Evidence
  - Mitigation / diligence ask
  rows:
  - - Regulated-workload trust and BFSI positioning
    - Moat claim
    - Medium
    - CtrlS secure-banking surface and Gartner review presence support a trust narrative
    - Validate reference customers, audit posture, and contract renewals in regulated verticals
  - - Hybrid packaging beyond colocation
    - Moat claim
    - Medium
    - CtrlS publishes cloud pricing and packages private cloud, IaaS, GPU cloud, and direct cloud-connect
    - Test attach rates and cross-sell conversion instead of assuming packaging translates into margin
  - - Domestic operating pressure from STT, Yotta, and Nxtra
    - Competitive threat
    - High
    - These providers already market secure colo, hyperscale campuses, AI-cloud, or large domestic power footprints
    - Track city-level wins and whether CtrlS is winning on price, trust, or deployment speed
  - - Capital and ecosystem asymmetry from Equinix, NTT, and Digital Realty
    - Competitive threat
    - High
    - Global incumbents bring larger balance sheets, broader customer bases, and stronger interconnection ecosystems
    - Assess whether CtrlS can defend regulated domestic accounts without matching global ecosystem breadth
  - - Multi-homing and substitute risk
    - Commoditization threat
    - Medium
    - Multiple scaled metros and cloud-connect choices make dual-sourcing feasible for some buyer types
    - Map which workloads are truly sticky versus portable by vertical and disaster-recovery design
  - - Power, decarbonization, and execution constraints
    - Market risk
    - Critical
    - Deloitte and Accenture both flag power, decarbonization, supply chain, and talent as sector bottlenecks
    - Pressure-test project timelines, power procurement, and energy-cost assumptions by campus
  - - Pricing and utilization opacity
    - Disclosure risk
    - High
    - Public evidence remains light on realized price per rack or MW, occupancy, churn, and contract duration
    - Request management KPI packs or financing materials before treating capacity as durable moat
  notes: Severity ratings are qualitative judgments for underwriting rather than external credit ratings. They reflect how directly each issue can change win rates, pricing, or capital efficiency.
