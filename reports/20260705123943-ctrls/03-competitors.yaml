  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing-discovery
    missingEvidence: Realized rack, cage, suite, and MW pricing with term, ramp, and discount data for CtrlS, STT, Yotta, Nxtra, Equinix, and NTT.
    whyItMatters: Public list pages show packaging but not effective deal pricing, so price leadership and discount discipline cannot be underwritten cleanly.
    diligencePath: Request anonymized customer quotes, procurement bid sheets, or lender decks that show signed rack and MW economics by tenure.
    relatedQuestionRefs:
    - QP029
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: utilization-and-retention
    missingEvidence: Campus-level occupancy, utilization, churn, and average contract duration for CtrlS and its closest peer set.
    whyItMatters: Capacity alone does not prove moat; underwriting needs evidence that installed power is monetized and that customers stay after first deployment.
    diligencePath: Obtain management KPI packs, debt covenant materials, or customer cohort schedules that break out occupancy and renewal behavior by campus.
    relatedQuestionRefs:
    - QP030
    relatedTableRefs:
    - TP001
    - TP004
  - type: private-evidence-only
    severity: material
    topic: interconnect-density
    missingEvidence: Cross-connect counts, cloud on-ramp counts, and latency benchmarks across major Indian metros for CtrlS, Equinix, NTT, Nxtra, and STT.
    whyItMatters: Switching-cost and multi-homing claims depend on actual ecosystem density, not just vendor marketing language about connectivity or partnerships.
    diligencePath: Request facility technical annexes, customer architecture diagrams, or third-party network maps showing on-ramp density and path redundancy.
    relatedQuestionRefs:
    - QP017
    - QP026
    relatedTableRefs:
    - TP002
  - type: access-blocked
    severity: minor
    topic: site-by-site-disclosure
    missingEvidence: Cleaner site-by-site competitor disclosures for some Indian campuses and city-by-city offerings beyond high-level marketing pages.
    whyItMatters: Several reviewed official surfaces emphasize positioning and scale but do not publish a uniform facility ledger, which weakens apples-to-apples comparison.
    diligencePath: Request current sales brochures, campus one-pagers, or data-room material from providers instead of relying on public marketing pages alone.
