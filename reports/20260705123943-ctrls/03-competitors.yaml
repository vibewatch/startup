- id: peer-profiles
  title: Direct peer profiles and incumbent pressure
  body: 'Among India-led operators, STT, Yotta, and Nxtra look like the most important direct comparators to CtrlS, but they compete for different buyer stories. STT markets secure, flexible, reliable, and sustainable colocation rather than a flashy AI narrative. Yotta leans in the opposite direction, framing itself as sovereign AI and cloud infrastructure with hyperscale campuses; its Navi Mumbai NM1 site alone is marketed at 52 MW IT load, 7,000+ racks, and a 1 GW campus path, which makes Yotta the strongest AI-adjacent substitute when a buyer wants compute plus facility capacity. Nxtra emphasizes distribution reach: 15 hyperscale data centers, 230+ MW of power, 390+ MW of renewable energy capacity, and 66 edge locations, which matters especially for telecom, CDN, and edge-heavy workloads. Web Werks and AdaniConneX are important but somewhat different: Web Werks sells a broad but connectivity-led full stack across colocation, cloud, dedicated servers, and interconnection, while AdaniConneX
    markets the combination of Adani infrastructure and EdgeConneX operating expertise as a greenfield hyperscale platform. Above all of them sit the global incumbents. Equinix pitches India through global interconnection, cloud adjacency, and sovereignty themes; NTT brings a stated 150+ data centers across 20+ countries; Digital Realty claims 300+ sites in 55+ metros and 5,000+ customers globally. Princeton Digital Group and GDS show that more Asian capital-backed platforms can also crowd the market over time. The net effect is that CtrlS does not face a narrow India-only field: it faces domestic peers on operating scale and global incumbents on trust, capital, and multinational buyer access.'
