  - - AdaniConneX
    - Greenfield hyperscale challenger
    - Backed by Adani infrastructure plus EdgeConneX 50+ data-center experience
    - Large hyperscale and enterprise campus buyers
    - Energy/infrastructure sponsorship and hyperscale ambition
    - Execution and current installed footprint are harder to quantify from the reviewed surface
  - - Digital Realty
    - Global adjacent entrant
    - 300+ data centers in 55+ metros; 5,000+ customers
    - Large global deployments and AI-heavy enterprise accounts
    - Massive global platform and AI-ready positioning
    - Not yet presented as a direct India operating peer in reviewed evidence, but capital asymmetry is real
  - - Princeton Digital Group
    - Regional adjacent entrant
    - Pan-Asia platform with India sites in Mumbai and Chennai
    - Hyperscale customers seeking regional Asian coverage
    - Asia-focused platform already present in India
    - Regional scale matters, but India customer breadth is not fully disclosed publicly
