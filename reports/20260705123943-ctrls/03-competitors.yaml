callouts:
- calloutType: strength
  title: CtrlS packages more than pure rack space
  body: 'Among the reviewed public surfaces, CtrlS is unusually explicit about adjacent packaging: it publishes cloud list pricing, markets fully managed IaaS and private cloud, and highlights direct Google and Oracle connectivity. That makes its competitive story broader than a pure colocation pitch even before considering regulated-workload trust.'
  claimRefs:
