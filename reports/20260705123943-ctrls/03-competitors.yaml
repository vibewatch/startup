- id: pricing-packaging-and-switching
  title: Pricing, packaging, switching cost, and multi-homing
  body: 'Public pricing evidence is surprisingly uneven. The clearest pricing disclosure in the reviewed set is not from a global incumbent or a domestic rival, but from CtrlS itself: its cloud infrastructure rate card publishes monthly recurring charges beginning at ₹3,735 for a small VM template. Beyond that list price, CtrlS also packages private cloud, fully managed IaaS, GPU private cloud, Cloud Connect, Google Cloud Interconnect, and Oracle FastConnect, which means its offer is visibly more layered than a pure rack-space pitch. The reviewed peer pages from STT, Yotta, Nxtra, Equinix, NTT, Web Werks, and AdaniConneX generally emphasize solutions, power, resilience, or ecosystem depth rather than headline list pricing, so public comparisons quickly become qualitative rather than numeric. That does not mean switching cost is low. In this market, lock-in comes from migration events, interconnect design, cloud on-ramp dependencies, disaster-recovery topology, and compliance re-validation
    more than from software-like feature entrenchment. Multi-homing is certainly feasible for hyperscalers and cloud-native buyers because the country now has multiple scaled operators across several metros, but it is less frictionless for regulated or latency-sensitive workloads where peering, on-ramp quality, and recovery architecture become sticky operational decisions. CtrlS''s BFSI positioning and Google peering status improve its trust story, while Nxtra''s telco-linked reach and Yotta''s AI-cloud bundle show exactly where competitive substitution can still happen.'
