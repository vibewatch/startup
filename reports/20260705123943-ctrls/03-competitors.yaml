- id: moat-durability
  title: Moat durability, adverse evidence, and bottom-line judgment
  body: 'The strongest case for CtrlS is not that competitors are weak; it is that CtrlS combines several traits that do not always appear together in one domestic platform: meaningful regulated-enterprise trust, visible cloud-connect packaging, AI-ready infrastructure marketing, and at least some public price transparency. That is enough to make it a credible short list candidate for hybrid and mission-critical buyers. It is not enough to make the moat dominant. Equinix, NTT, and Digital Realty bring much deeper capital and global customer reach; STT, Yotta, and Nxtra keep domestic pricing and expansion pressure real; and the sector''s own adverse evidence is mounting as power, land, decarbonization, talent, and supply-chain limits tighten around a fast-growing market. The unresolved underwriting problem is economic rather than strategic. Public evidence says a lot about capacity, feature breadth, and positioning, but relatively little about realized colocation price per rack or MW, occupancy,
    churn, or contract duration. Until those economic disclosure gaps close, CtrlS should be viewed as competitively credible with a moderate moat—strong enough to matter, but not strong enough to ignore global and domestic response risk.'
