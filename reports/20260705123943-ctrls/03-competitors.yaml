- calloutType: risk
  title: Capital asymmetry and sector bottlenecks keep moat durability moderate
  body: The real risk is not one local challenger. It is the combination of global incumbents with deeper capital and ecosystem reach, domestic peers with real operating scale, and a power-constrained build environment that can narrow price and delivery advantages for everyone in the market.
