callouts:
- calloutType: strength
  title: Institutional validation arrived after the platform was already scaling
  body: CPP’s June 2026 commitment came after CtrlS had already disclosed a $2 billion capex plan, a 72 MW Chennai park, major Mumbai power upgrades, and a broad multi-city footprint, which makes the transaction look like acceleration capital rather than rescue capital.
  claimRefs:
  - CO015
  - CO020
  - CO023
  - CO024
- calloutType: risk
  title: Private-company opacity still limits true underwrite confidence
  body: Despite convincing physical scale and credible customers, CtrlS still does not publish audited revenue, leverage, utilization, or contract concentration, so investors cannot independently test return on deployed capacity from public materials alone.
  claimRefs:
  - CO035
  - CO040
- calloutType: insight
  title: Power strategy is inseparable from the company story
  body: Renewable procurement, solar assets, and campus power readiness are not side ESG themes at CtrlS; they are core go-to-market tools because hyperscaler and AI demand cannot be served without power certainty.
  claimRefs:
  - CO022
  - CO024
  - CO025
  - CO026
  - CO031
