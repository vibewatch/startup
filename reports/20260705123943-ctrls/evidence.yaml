evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: Audited revenue, EBITDA, and utilization by campus are not public.
    whyItMatters: >-
      Without audited operating metrics, investors cannot test whether headline scale is translating into healthy asset
      turns and margin expansion.
    diligencePath: Request audited financials plus facility-level utilization and customer-mix data.
    relatedQuestionRefs:
      - QO016
      - QO028
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: leverage
    missingEvidence: Public disclosures do not show debt, project finance, or covenant structure.
    whyItMatters: Infrastructure returns are highly sensitive to leverage and project-level financing obligations.
    diligencePath: Request debt schedule, lender terms, and project-finance facilities.
    relatedQuestionRefs:
      - QO018
      - QO028
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: headcount
    missingEvidence: A verifiable public headcount disclosure was not found in fetched sources.
    whyItMatters: Headcount is a useful proxy for operating leverage and execution bandwidth.
    diligencePath: Request HR headcount by function and compare with expansion timetable.
    relatedQuestionRefs:
      - QO017
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: minor
    topic: scale-messaging
    missingEvidence: The website contains both legacy scale figures and newer 2026 figures.
    whyItMatters: Version drift does not change the thesis but slightly reduces confidence in static marketing pages.
    diligencePath: Ask management for a current fact sheet covering sites, MW, and in-construction capacity.
    relatedQuestionRefs:
      - QO021
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: serviceable-market-definition
    missingEvidence: >-
      A segmented view of CtrlS revenue or committed MW by hyperscale, BFSI, AI-ready, continuity, and edge workloads is
      not public.
    whyItMatters: >-
      Without segment mix, the chapter cannot convert national market growth into a defensible CtrlS SAM or judge how
      much of the broad TAM is actually reachable.
    diligencePath: >-
      Request customer-mix, committed MW, and revenue-by-service-line disclosures for the top metros and regulated
      verticals.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM001
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing-and-yield
    missingEvidence: >-
      No public source discloses CtrlS realized pricing, interconnect fees, managed-service attach rates, or contract
      tenure by workload segment.
    whyItMatters: Market growth only matters economically if pricing and attach rates support attractive yield on deployed MW.
    diligencePath: >-
      Request signed pricing examples, segment gross-margin bridges, and average contract term by hyperscale, BFSI, and
      continuity accounts.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM003
      - TM004
  - type: private-evidence-only
    severity: material
    topic: utilization-and-precommitment
    missingEvidence: >-
      Public materials do not show facility-level utilization, pre-leasing, or reserved-power commitments for the live
      and planned campuses.
    whyItMatters: >-
      A large TAM does not guarantee monetization if live capacity is underutilized or future capacity lacks committed
      demand.
    diligencePath: >-
      Request utilization, pre-commitment, and customer concentration by campus and metro, plus pipeline timing
      assumptions.
    relatedQuestionRefs:
      - QM024
      - QM025
    relatedTableRefs:
      - TM002
      - TM004
  - type: private-evidence-only
    severity: material
    topic: pricing-discovery
    missingEvidence: >-
      Realized rack, cage, suite, and MW pricing with term, ramp, and discount data for CtrlS, STT, Yotta, Nxtra,
      Equinix, and NTT.
    whyItMatters: >-
      Public list pages show packaging but not effective deal pricing, so price leadership and discount discipline
      cannot be underwritten cleanly.
    diligencePath: >-
      Request anonymized customer quotes, procurement bid sheets, or lender decks that show signed rack and MW economics
      by tenure.
    relatedQuestionRefs:
      - QP029
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: utilization-and-retention
    missingEvidence: Campus-level occupancy, utilization, churn, and average contract duration for CtrlS and its closest peer set.
    whyItMatters: >-
      Capacity alone does not prove moat; underwriting needs evidence that installed power is monetized and that
      customers stay after first deployment.
    diligencePath: >-
      Obtain management KPI packs, debt covenant materials, or customer cohort schedules that break out occupancy and
      renewal behavior by campus.
    relatedQuestionRefs:
      - QP030
    relatedTableRefs:
      - TP001
      - TP004
  - type: private-evidence-only
    severity: material
    topic: interconnect-density
    missingEvidence: >-
      Cross-connect counts, cloud on-ramp counts, and latency benchmarks across major Indian metros for CtrlS, Equinix,
      NTT, Nxtra, and STT.
    whyItMatters: >-
      Switching-cost and multi-homing claims depend on actual ecosystem density, not just vendor marketing language
      about connectivity or partnerships.
    diligencePath: >-
      Request facility technical annexes, customer architecture diagrams, or third-party network maps showing on-ramp
      density and path redundancy.
    relatedQuestionRefs:
      - QP017
      - QP026
    relatedTableRefs:
      - TP002
  - type: access-blocked
    severity: minor
    topic: site-by-site-disclosure
    missingEvidence: >-
      Cleaner site-by-site competitor disclosures for some Indian campuses and city-by-city offerings beyond high-level
      marketing pages.
    whyItMatters: >-
      Several reviewed official surfaces emphasize positioning and scale but do not publish a uniform facility ledger,
      which weakens apples-to-apples comparison.
    diligencePath: >-
      Request current sales brochures, campus one-pagers, or data-room material from providers instead of relying on
      public marketing pages alone.
    relatedQuestionRefs:
      - QP002
      - QP023
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: customer-architecture
    missingEvidence: >-
      Customer concentration, dual-sourcing prevalence, and disaster-recovery architecture standards by regulated
      vertical and hyperscale cohort.
    whyItMatters: >-
      Whether buyers routinely dual-home or stay sticky after deployment is central to judging CtrlS's moat and the
      realism of multi-homing assumptions.
    diligencePath: >-
      Interview BFSI and hyperscale tenants, or review procurement standards and reference architecture documents used
      in active India deployments.
    relatedQuestionRefs:
      - QP019
      - QP020
      - QP026
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: blocking
    topic: audited-financials
    missingEvidence: >-
      Audited P&L, balance sheet, cash-flow statement, and revenue-recognition schedule for FY2024-FY2025 plus current
      YTD.
    whyItMatters: >-
      Without audited financials, public revenue ranges and margin proxies cannot be reconciled into a reliable
      underwriting base case.
    diligencePath: Request audited financial statements and the latest management accounts with revenue-recognition policy notes.
    relatedQuestionRefs:
      - QI008
      - QI010
      - QI024
      - QI026
    relatedTableRefs:
      - TI003
      - TI004
      - TI005
  - type: private-evidence-only
    severity: material
    topic: pricing-realization
    missingEvidence: Realized pricing waterfall by SKU, discount band, and managed-services attach rate versus published list prices.
    whyItMatters: >-
      List pricing can materially overstate realized revenue quality and gross margin if large enterprise contracts are
      heavily discounted or bundled.
    diligencePath: >-
      Request last-12-month booked price versus list price by SKU, including top-customer contract examples and renewal
      terms.
    relatedQuestionRefs:
      - QI002
      - QI003
      - QI023
    relatedTableRefs:
      - TI002
      - TI005
  - type: private-evidence-only
    severity: material
    topic: customer-concentration-utilization
    missingEvidence: Top-10 revenue concentration, campus occupancy, utilization by service line, and renewal/churn cohorts.
    whyItMatters: >-
      Data-center operating leverage depends on utilization, while concentration determines downside risk if a
      hyperscaler or large enterprise account pauses growth.
    diligencePath: Request site-level occupancy/utilization pack and customer concentration schedule with renewal history.
    relatedQuestionRefs:
      - QI006
      - QI018
      - QI019
    relatedTableRefs:
      - TI003
      - TI005
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway
    missingEvidence: Current cash balance, monthly burn, debt service obligations, and runway forecast.
    whyItMatters: >-
      The company is visibly capital-intensive; without treasury and burn data, it is impossible to judge whether equity
      plus debt is comfortably ahead of build commitments.
    diligencePath: >-
      Request monthly cash-flow statements for the last 12 months, current bank balances, and internal 24-month cash
      forecast.
    relatedQuestionRefs:
      - QI015
      - QI024
      - QI028
    relatedTableRefs:
      - TI004
      - TI005
  - type: private-evidence-only
    severity: material
    topic: debt-terms
    missingEvidence: >-
      Debt maturity ladder, interest cost, covenant package, collateral structure, and project-finance terms by
      facility.
    whyItMatters: >-
      Charge amounts alone do not reveal refinancing pressure, covenant headroom, or whether cash flows can be trapped
      at project or subsidiary level.
    diligencePath: >-
      Request lender summary by facility plus charge documents or a debt memo covering maturity, pricing, covenant, and
      security details.
    relatedQuestionRefs:
      - QI011
      - QI025
    relatedTableRefs:
      - TI004
      - TI005
  - type: missing-source
    severity: material
    topic: sla-gap
    missingEvidence: Published SLA tiers and support boundaries for colocation, DR, IaaS, private cloud, and GPU private cloud.
    whyItMatters: >-
      Without a module-level SLA ladder, buyers cannot compare the maturity of the newer cloud layers against the core
      facility business.
    diligencePath: >-
      Request the current master service catalog, standard SLA schedules, and sample order forms for each product
      family.
    relatedQuestionRefs:
      - QE026
    relatedTableRefs:
      - TE004
  - type: private-evidence-only
    severity: material
    topic: module-adoption
    missingEvidence: Named customer counts, utilization, and revenue mix for IaaS, private cloud, and GPU private cloud.
    whyItMatters: >-
      The newer cloud modules may be strategically important, but public materials do not show whether they are
      meaningful businesses or mostly positioning layers.
    diligencePath: Request active-customer counts, booked capacity, top customer examples, and revenue contribution by module.
    relatedQuestionRefs:
      - QE028
    relatedTableRefs:
      - TE001
      - TE006
  - type: missing-source
    severity: minor
    topic: certification-gap
    missingEvidence: >-
      A facility-by-facility and service-by-service matrix showing which certifications apply, when they were issued,
      and what scope they cover.
    whyItMatters: >-
      Public certification branding is useful, but diligence still needs scope precision to know which campuses and
      managed layers inherit which controls.
    diligencePath: Request the current certification register, scope statements, and audit dates by campus and managed service.
    relatedQuestionRefs:
      - QE029
    relatedTableRefs:
      - TE004
  - type: private-evidence-only
    severity: minor
    topic: support-validation
    missingEvidence: >-
      Current named customer references and independent operational feedback for the private-cloud and GPU-private-cloud
      layers.
    whyItMatters: >-
      Sparse third-party feedback makes it hard to separate marketing readiness from production maturity in the newer
      service lines.
    diligencePath: >-
      Ask for three current reference customers using private cloud, GPU private cloud, or cloud-connect services in
      production.
    relatedQuestionRefs:
      - QE027
    relatedTableRefs:
      - TE002
  - type: private-evidence-only
    severity: material
    topic: durability-gap
    missingEvidence: >-
      Net and gross revenue retention, logo churn, renewal cohorts, contract length, and expansion/contraction data by
      customer segment.
    whyItMatters: Without retention and contract data, public deployment proof cannot be translated into durable customer economics.
    diligencePath: >-
      Request cohort retention tables, renewal rates, average term length, and expansion-versus-contraction waterfalls
      split across BFSI, enterprise, and edge cohorts.
    relatedQuestionRefs:
      - QU016
      - QU025
    relatedTableRefs:
      - TU004
      - TU005
  - type: missing-source
    severity: material
    topic: concentration-risk
    missingEvidence: >-
      Top-10 customers by ARR, largest-customer share, and vertical mix across BFSI, hyperscaler, enterprise, and edge
      cohorts.
    whyItMatters: >-
      The public narrative leans heavily on regulated and flagship references, so concentration could be much higher or
      lower than the logo set suggests.
    diligencePath: >-
      Request customer concentration schedules, ACV bands, and revenue share by vertical before underwriting scale
      claims.
    relatedQuestionRefs:
      - QU017
      - QU023
      - QU025
    relatedTableRefs:
      - TU003
      - TU005
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof-table
    missingEvidence: A complete, dated public roster of named CtrlS customers tied to specific deployments and products.
    whyItMatters: >-
      The current named-customer table is built from retained testimonials and the BSE cluster, so it is useful but not
      exhaustive.
    diligencePath: >-
      Ask management for the current reference-customer list by vertical and confirm which logos are active,
      referenceable, and tied to which products.
    relatedQuestionRefs:
      - QU020
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: customer-count-gap
    missingEvidence: >-
      Exact current active-customer count, deployment mix across metros versus edge, and share of revenue from regulated
      customers.
    whyItMatters: >-
      Public account-quality signals and facility footprint do not reveal how broad the paying customer base actually is
      today.
    diligencePath: >-
      Request customer-count rollforwards, active logos by segment, and revenue mix across BFSI, enterprise,
      hyperscaler, startup, and edge cohorts.
    relatedQuestionRefs:
      - QU024
    relatedTableRefs:
      - TU001
      - TU002
  - type: missing-source
    severity: material
    topic: regulatory-legal-register-completeness
    missingEvidence: >-
      Campus-specific permit files, land-title diligence, tax disputes, and any undisclosed litigation or enforcement
      correspondence.
    whyItMatters: >-
      Public sources do not establish a full legal-cleanliness picture across every CtrlS campus or legal entity, which
      limits confidence in the regulatory register.
    diligencePath: >-
      Request legal diligence memo, litigation schedule, key permit inventory, and any outstanding notices or
      remediation plans.
    relatedQuestionRefs:
      - QR021
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: audit-and-incident-proof
    missingEvidence: >-
      Independent control audits, OT-security attestations, campus incident logs, and external compliance exceptions by
      major customer segment.
    whyItMatters: >-
      CtrlS publicly asserts strong controls, but investors need outcome evidence to distinguish mature operations from
      control marketing.
    diligencePath: >-
      Obtain ISO/SOC-style reports, audit exception trackers, and incident summaries for the major campuses serving
      regulated workloads.
    relatedQuestionRefs:
      - QR010
      - QR032
  - type: private-evidence-only
    severity: blocking
    topic: customer-concentration-and-sla-economics
    missingEvidence: >-
      Revenue concentration, workload criticality by customer, SLA penalty history, and churn or renewal metrics for
      BFSI and enterprise accounts.
    whyItMatters: >-
