        - 如果集中度高，旗舰客户可能夸大整体收入质量
        - 可能需要高规格支持和治理纪律
        - 索取头部受监管客户所贡献的收入占比
      - - Gartner Peer Insights 外壳页
        - 独立评价入口存在，但抓取到的内容大多只是免责声明外壳
        - 第三方评价存在，比完全没有更好
        - 公开抓取内容太薄，撑不起情绪判断
        - 独立满意度证据仍不完整
