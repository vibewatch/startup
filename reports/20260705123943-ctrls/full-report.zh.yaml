      - - Trustpilot
        - 公开深度有限，平均分 3.7 / 5
        - 说明部分用户愿意留下公开反馈
        - 平均分和稀疏语境都不足以构成强背书
        - 客户体验可能随合作类型出现明显差异
        - 索取按产品线拆分的 NPS / CSAT 和投诉解决数据
      - - 留存指标
        - 未公开披露 NRR、GRR、流失率、续约或合同期限
