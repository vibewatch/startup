      - number: '8.2'
        title: 可比公司框架、期权价值与核心投资假设争议
        blocks:
          - type: paragraph
            body: >-
              CtrlS 的正确可比组本来就应混合搭建。Equinix、Digital Realty、NTT 等全球数字基础设施龙头，展示了上限位置的公开市场规模、经审计披露和生态深度。GDS、Princeton
              Digital Group 等区域平台证明，亚洲资本能支撑大型多市场版图。Yotta、Nxtra、STT、Web Werks、AdaniConneX 等印度本土同行则说明，印度买家在 AI
              密集、超大规模、连接驱动和边缘密集型工作负载上，已经有可信替代方案。同场比较时，CtrlS 确实有真实的溢价理由。它如今的覆盖范围明显不止少数旗舰都市，能拿出多个二线城市或边缘资产，也持续上线或预上线
              Hyderabad DC3 等新设施。案例研究和第三方认可也让平台更像一家机构级公司。反向假设是：上述证据仍不能替代经审计披露，也不能消除资产版图扩大带来的执行负担。
