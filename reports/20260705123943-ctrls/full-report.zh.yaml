      - number: '1.4'
        title: 客户定位、垂直聚焦与运营证明
        blocks:
          - type: paragraph
            body: >-
              CtrlS 一直把自己卖成受监管与永久在线工作负载的关键任务运营商。公司重点强调 BFSI、电信和 IT/ITeS 三类核心客户，并公开声称服务 60 家 Fortune 500
              公司以及全球前七大超大规模云厂商中的五家。面向银行业的材料更进一步，称印度前三分之一的头部银行、20 MW 银行 IT 负载运行在 CtrlS 上。关于 BSE
              关系的独立报道至少给出一个具名且高风险的生产级证明点：基础设施支撑每天超过 700 crore 笔交易、约 11 crore 名投资者。这足以说明 CtrlS
              在敏感、高吞吐数字基础设施上获得信任。但这些证据还不足以证明留存、利用率、合同期限或集中度。公开客户故事在客户标识和关键性上很强，但量化的队列质量仍偏薄。
            claimRefs:
              - CO009
              - CO010
              - CO011
