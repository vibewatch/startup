        - label: 未结清担保登记
          value: '4181'
          unit: INR crore
        - label: 隐含收入倍数
          value: 26-45
          unit: x
    claimRefs:
      - CV001
      - CV008
      - CV009
      - CV014
      - CV017
      - CV036
