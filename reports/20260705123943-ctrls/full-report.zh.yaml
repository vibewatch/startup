  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与现实替代方案
        blocks:
          - type: paragraph
            body: >-
              CtrlS 并不在一个笼统的「数字基础设施」篮子里竞争。公开来源能看到的可服务市场，是印度第三方托管容量，以及让这些容量承载关键工作负载所需的服务：超大规模园区、企业托管、AI 就绪专用基础设施、连续性 /
              灾难恢复环境，以及附着在这些部署上的网络和合规层。CtrlS 官方材料反复把这些方案打包销售，因此相关支出池是基础设施和连续性预算，不是半导体收入、公有云软件订阅或泛 IT
              服务。最接近的替代并不只是另一家机架供应商；买方也可以选择继续停留在仅依赖超大规模云厂商的模式，把工作负载留在传统自有设施，或延后迁移，直到合规、电力或成本可预测性带来更大痛感。这个边界很重要，因为宽口径的印度数据中心
              TAM 会夸大 CtrlS 可实际变现的空间，除非把支出收窄到需要第三方、本土、高韧性容量的工作负载。
            claimRefs:
              - CM011
              - CM012
              - CM021
              - CM039
