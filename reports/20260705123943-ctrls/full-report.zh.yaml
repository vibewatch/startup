      - number: '2.3'
        title: 买方细分、工作负载与预算归属
        blocks:
          - type: paragraph
            body: >-
              公开证据指向至少四类现实买方。第一类是超大规模云厂商和云区域建设者，其决策由电力就绪园区、执行速度和生态支持主导。第二类是受监管的 BFSI
              与市场基础设施买方，正常运行时间、合规和连续性比最低成本算力更重要；CtrlS 银行业材料和 BSE 证明点都强力支撑这一细分。第三类是企业 AI 与 HPC 工作负载，用户可能是平台或 ML
              团队，但当部署从实验走向生产，预算负责人会扩展到 CIO、CTO
              或采购职能。第四类是连续性和灾难恢复账户，它们为韧性而买，而不是为纯增长而买。跨这些群体看，最终用户常常是技术团队，但随着工作负载变得更关键，付款方会变宽。对 CtrlS
              来说，这一点很重要，因为解决方案页面和白皮书显示，公司卖的是电力、韧性、合规和连接的组合包，而不是单一商品化机架产品。
