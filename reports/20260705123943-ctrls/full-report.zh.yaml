      - number: '2.2'
        title: 用多重视角测算市场
        blocks:
          - type: paragraph
            body: >-
              没有一个公开数字能干净刻画 CtrlS 的市场，因此本章保留多重视角。第三方容量数据显示，印度已拥有 1.6 GW 投运运营容量和 3.1 GW
              管线，足以证明该市场今天已经成规模，而不只是愿景。基于收入的市场研究提供另一层视角：Research and Markets 与 Arizton 均认为印度数据中心市场 2025 年为 USD 9.79
              billion，并预测 2031 年达到 USD 21.03 billion，但这些美元总额打包了许多服务，因此无法直接映射到 CtrlS 收入。年度流量数据提供第三个角度，显示 2025
              年供给新增和吸收量都大幅走高。结论是方向清楚，但精度不完美。CtrlS 超过 370 MW 的已投运足迹，使其成为当前装机基础中的重要平台；但没有客户结构、利用率和定价披露，公开记录仍无法拆出干净的 SAM。
