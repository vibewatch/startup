      - number: '2.5'
        title: 约束、矛盾与剩余测算缺口
        blocks:
          - type: paragraph
            body: >-
              最大的市场分析风险是虚假精确。容量研究机构、媒体摘要和运营商页面描述的是大象的不同部位：有的跟踪已安装
              MW，有的统计设施，有的预测需求，有的预测收入。它们都有用，但如果没有利用率、合同时间、价格实现和连接或连续性服务附加率等额外假设，任何一个都不能直接代入 CtrlS
              收入。竞争也比许多自上而下市场摘要承认的更重要。本土龙头、电信背景供应商、能源背景新进入者和跨国运营商都在争夺同一波需求。最后，包括 CtrlS
              自有白皮书在内的多个来源暗示，监管、电力可得性和执行瓶颈即使在市场看起来很大时，也会拖慢变现。市场无疑有吸引力，但剩余尽调任务是把全国增长翻译成细分层面可触达支出，再进一步落到 CtrlS 自身已部署 MW
              的收益。
