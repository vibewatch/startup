  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块地图
        blocks:
          - type: paragraph
            body: >-
              从客户工作流看，CtrlS 已不再把自己描述为机柜空间房东。公开界面从核心托管和灾难恢复开始，再叠加托管 IaaS、私有云、面向 AI 工作负载的 GPU 私有云，以及接入 Oracle 和 Google
              云环境的私有互联。这很重要，因为公司呈现的买方旅程是模块化的：客户可以从物理托管起步，再添加私有算力、AI
              集群、灾难恢复覆盖和直接多云连接，而不必更换运营商。产品地图仍锚定在实体园区网络上，但信息已经转向混合数字基础设施外包。最强证据不是抽象品牌，而是独立维护的服务页面数量；每个页面都有自己的定位、功能集，有些还提供公开价格或技术资料。实际读法是，CtrlS
              希望被购买为一个面向关键任务和 AI 重载工作负载的集成平台，而不是单点托管供应商。
