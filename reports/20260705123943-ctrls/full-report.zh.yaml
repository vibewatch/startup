  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重性排序的风险概览与投资含义
        blocks:
          - type: paragraph
            body: >-
              CtrlS 的风险画像，主要由扩张野心和基础设施依赖共同拉动。需求侧的市场证据不是核心担忧：印度数据中心市场仍在增加容量并完成吸收，公司和独立资料也都把
              AI、云和受监管企业需求视为真实存在。更难的问题是，CtrlS 能否持续把这些需求转成有利润、抗冲击的容量，同时不被电力、合规和执行瓶颈绊住。最重要的横向风险包括电力可得性、隐私和 BFSI
              合规负担、伙伴和生态依赖、财务质量披露不透明，以及一种打破投资假设的情形：园区增长继续吃资本，而关键依赖仍未解决。最重要的投资含义是，不能把 CtrlS
              简单按房地产或主机托管平台来承销。它是一家一体化数字基础设施运营商，风险面同时跨过设施、能源、监管、伙伴生态和客户信任。
            claimRefs:
