          - type: callout
            title: CtrlS 已站在最高优先级需求区内
            body: 第三方来源指向 Mumbai、Hyderabad、Chennai 和其他主要都市圈为核心引力中心，而 CtrlS 已在其中多个市场运营，并通过银行和 BSE 用例拿到受监管工作负载证明。
