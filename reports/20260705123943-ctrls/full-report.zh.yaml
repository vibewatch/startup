  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司或组合
      - 公开锚点
      - 为什么重要
      - 对 CtrlS 的含义
      - 局限
    rows:
      - - Equinix
        - 2026 年 7 月市值约 $98.82B
        - 最好的公开高端互联和数字基础设施基准
        - 显示经审计的生态密度能撬动多少价值
        - 全球规模和披露远超当前 CtrlS
      - - Digital Realty
        - 300+ 座数据中心、55+ 个都市圈、5,000+ 名客户
        - 展示成熟数字基础设施巨头的规模和客户广度
        - 可用来对标一个已披露全球平台应呈现的样子
        - 所审阅页面无法直接读出印度纯玩家定价含义
      - - NTT / STT
        - NTT 拥有 150+ 座全球数据中心；STT India 定位安全托管
        - 体现既有玩家的资本和企业信任竞争
        - 为面向印度投标中的资金可得性和运营证明设定门槛
        - 公开页面更侧重定位，而非估值
      - - Yotta / Nxtra
        - Yotta 为 52 MW + 7,000 个机柜 / 1 GW 路径；Nxtra 为 230+ MW 和 66 个边缘站点
        - 在 AI 重载和边缘联动部署中最接近的本土运营替代
        - 最能检验 CtrlS 在印度到底有多特殊
        - 两边所审阅材料都没有给出清晰公开估值倍数
      - - GDS / Princeton Digital Group
        - GDS 是上市多市场平台；PDG 已进入 Mumbai 和 Chennai
        - 说明有亚洲资本支持的进入者也会挤进印度
        - 支持用区域平台视角，而非只看印度
        - 两家公司披露质量和上市状态不同
      - - Web Werks / AdaniConneX
        - 连接驱动的全栈 / 绿地超大规模雄心
        - 代表相邻买方替代品，可凭打包能力或股东背书赢单
        - 如果买方有多个可信替代，可帮助界定下行倍数压缩
        - 所审阅页面更多给出定位，而非经审计经济性
    notes: 可比组合刻意混合公开市场龙头、区域平台和面向印度的本土同行，因为 CtrlS 没有一个干净的上市类比标的。
    enumerationScope:
      coverage: partial
      basis: >-
        Rows capture the main public-market, regional-platform, and domestic-operating benchmark sets visible in the
        reviewed evidence rather than every India data-center operator or private round.
    claimRefs:
      - CV022
      - CV024
      - CV025
      - CV026
      - CV027
      - CV028
      - CV029
      - CV030
      - CV031
  - id: TV005
    title: 投资论点破裂和否决触发项表
    columns:
      - 触发项
      - 阈值或事件
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 入驻率跑输新增容量
        - 出租爬坡或利用率明显落后于建设节奏
        - 把期权价值变成闲置资本，并推动倍数压缩
        - 在利用率证据改善前，将案例重新定价到熊情景区间。
      - - 杠杆或财务约束压力
        - 债务条款、到期安排或担保组合比预期更紧
        - 将上行空间从增长转为资产负债表管理
        - 暂停测算，直到债务结构被完整拆清。
      - - 电力或项目延误
        - 土地、电网或执行瓶颈推迟园区变现
        - 削弱溢价估值背后的稀缺性和速度论点
        - 下调上行假设，并把兑现时间继续后移。
      - - 相对同行的价格压缩
        - 新投标以更低实际价格或更弱组合成交
        - 让 CtrlS 更接近普通托管经济性
        - 将立场从合理到偏贵转向偏贵。
      - - 客户集中度意外
        - 少数超大规模云厂商、BFSI 客户或园区主导经济性
        - 收入质量和续约风险比叙事暗示的弱得多
        - 继续推进前，要求做集中度调整后的下行情景模型。
    notes: 这些是从可信平台故事走向明显更弱投资案例的最短路径。
    claimRefs:
      - CV020
      - CV021
      - CV031
      - CV038
      - CV040
      - CV043
      - CV047
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 尽调路径
    rows:
      - - 按园区拆分的利用率和入驻率
        - 主要站点当前已占用 MW、预租状态和吸纳情况
        - 这是连接版图故事与价值兑现的最清晰桥梁
        - 索取站点级运营仪表盘或贷款方材料包。
      - - 已签订单和定价
        - 成交价相对标价、在手订单、续约节奏和调价条款
        - 用来检验当前估值脱离叙事支撑后能否站住
        - 审查主要客户合同和在手订单瀑布。
      - - 债务到期和约束条款
        - 逐项贷款的到期、定价、担保和约束条款
        - 用来理解再融资和下行控制风险
        - 获取债务明细表和贷款文件。
      - - 客户集中度和合作年限
        - 头部客户占比、剩余合同期和对超大规模云厂商的依赖
        - 用来区分可持续平台经济性与狭窄项目组合
        - 审查分组、集中度和流失数据。
      - - 2026 年该轮融资的确切条款
        - 优先权层级、治理权、反稀释和老股转让占比
        - 用来判断名义估值是否等于经济质量
        - 审查已签署交易文件。
      - - 边缘和二线城市扩张回报
        - 新都市圈单站资本开支、出租爬坡时间和已实现收益率
        - 用来验证期权价值是否正在转化为股东价值
        - 索取按园区分组拆分的投后复盘。
    notes: 未解决事项都是基础设施投资者的常规要求，不是边角问题；这正是它们重要的原因。
    claimRefs:
      - CV016
      - CV042
      - CV043
      - CV047
      - CV048
