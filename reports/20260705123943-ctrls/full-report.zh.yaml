      - number: '1.5'
        title: 披露缺口、不一致与总体读法
        blocks:
          - type: paragraph
            body: >-
              CtrlS
              最大的尽调短板不是需求、资产野心或客户相关性，而是披露质量。公开材料没有提供经审计收入、EBITDA、债务、利用率、租约期限或客户集中度，限制了外界评估资本效率和下行保护。网站更新也不均衡：部分较老的产品页仍写着
              15 座数据中心、275 MW，而 2026 年官网和 CPP 公告使用 19 座数据中心、370
              MW。这个不一致并不推翻更高数字，但说明公司的公开信息资产仍在分层刷新。最终呈现的是一家规模有说服力、获得可信机构背书、扩张证明可见的公司，但披露面貌仍是私营企业式的，投资者必须把收入质量、杠杆和利用率视为待尽调事项，而不是已坐实事实。
            claimRefs:
              - CO035
              - CO036
              - CO037
              - CO040
