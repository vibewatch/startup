    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、创立与当前规模
        blocks:
          - type: paragraph
            body: >-
              CtrlS Datacenters Ltd. 是印度本土最早扩张成全国网络的超大规模与企业托管平台之一。公司 2007
              年创立，总部位于海得拉巴，至今仍把自己定位为由创始人掌舵的基础设施运营商，核心是高可用或「Rated-4」设施。公司当前公开叙事围绕三个数字展开：19 座数据中心、超过 370 MW 已投运容量、4.4 GW
              在执行或开发项目。官网和 2026 年 6 月 CPP 交易公告反复引用这些数字，确立了 CtrlS
              作为印度最大本土平台之一的位置。服务组合已覆盖超大规模园区、托管、连接、灾难恢复、托管服务和云基础设施。换言之，CtrlS
              卖的已不只是机架空间，而是面向超大规模云厂商、受监管企业和印度关键任务工作负载的全栈数字基础设施。
