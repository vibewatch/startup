      - number: '3.2'
        title: 直接同业画像与既有巨头压力
        blocks:
          - type: paragraph
            body: >-
              在印度本土运营商中，STT、Yotta 和 Nxtra 看起来是 CtrlS 最重要的直接可比对象，但它们争夺的是不同的买方叙事。STT 主打安全、灵活、可靠、可持续的托管，而不是醒目的 AI 叙事。Yotta
              则走相反方向，把自己定位为主权 AI 和云基础设施，并配套超大规模园区；仅 Navi Mumbai NM1 站点就宣传 52 MW IT 负载、7,000+ 个机架和 1 GW
              园区路径，因此当买方同时需要算力和设施容量时，Yotta 是最强的 AI 相邻替代。Nxtra 强调分布式覆盖：15 座超大规模数据中心、230+ MW 电力、390+ MW 可再生能源容量和 66
              个边缘位置，这对电信、CDN 和边缘密集型工作负载尤其重要。Web Werks 和 AdaniConneX 也重要，但性质略不同：Web Werks
              销售由连接牵引的广泛全栈，覆盖托管、云、专用服务器和互联；AdaniConneX 则把 Adani 基础设施与 EdgeConneX
              运营经验的组合，包装成新建型超大规模平台。所有这些之上，是全球既有巨头。Equinix 通过全球互联、云邻近和主权主题切入印度；NTT 称在 20+ 个国家拥有 150+ 座数据中心；Digital Realty
              声称全球 55+ 个都市圈有 300+ 站点、5,000+ 客户。Princeton Digital Group 和 GDS 也说明，更多亚洲资本支持的平台可能随时间挤入市场。净效果是，CtrlS
              面对的不是狭窄的印度本土战场：它既要在运营规模上对抗本土同业，也要在信任、资本和跨国买方触达上面对全球既有巨头。
