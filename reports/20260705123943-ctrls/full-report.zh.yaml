              具名客户证明存在，但分布不均。最强的单一公开生产参考是 BSE：官方公告和两篇独立后续报道都称，CtrlS 为支撑每天超过 700 crore 笔交易、超过 11 crore
              名投资者的基础设施供电，这比泛泛的客户 logo 墙具体得多。除 BSE 外，CtrlS 的公开证明主要来自嵌在服务和设施页面里的客户背书，而不是深入的独立案例研究。这些客户背书仍然有意义：United
