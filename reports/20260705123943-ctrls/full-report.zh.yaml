              公开证据指向典型的企业基础设施 GTM 动作。CtrlS 谈更多的是迁移支持、传统系统升级、平台搬迁、正常运行时间承诺和方案设计，而不是无摩擦自助入驻。Reliance
              Power、Flitpay、BFIL、UOB 和 Protean
              等具名参考强化了这一点：公司靠可信度、工程支持和长期运营关系赢下并留住客户。这个背景有用，因为它暗示收入耐久性可能强于纯现货托管业务，但也意味着获客成本、回本周期和合同期限比低接触 SaaS
              模式更重要。这些指标没有公开。因此，公开单位经济性视角仍偏薄：收入似乎约增长 16%，净利率仍略为负，存在杠杆，利用率未披露。这提供方向性信息，但不足以有信心地检验经营杠杆。
