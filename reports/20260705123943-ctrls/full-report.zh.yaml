  - id: TV003
    title: 牛 / 基准 / 熊情景表
    columns:
      - 情景
      - 核心假设
      - 估值区间（INR crore）
      - 概率信号
      - 传导含义
    rows:
      - - 牛
        - CPP 支持的扩建转化为强入驻率，定价守住，CtrlS 继续像一个稀缺印度平台。
        - 52,000-60,000
        - 20-25%
        - 上行空间要求投资者穿透当前不透明度，并为期权价值付费。
      - - 基准
        - 当前估值方向大体正确，但披露仍不完整，倍数扩张受限。
        - 42,000-48,000
        - 50-60%
        - 这是基于现有公开材料最站得住的区间。
      - - 熊
        - 利用率、定价、杠杆或执行不及预期，同行把估值压回可见经济性。
        - 30,000-38,000
        - 20-30%
        - 如果稀缺性故事走弱，即使业务没有崩盘，估值也会压缩。
    notes: 区间是基于已披露交易、可见收入代理指标和情景执行假设给出的判断带，不是完整内在价值模型。
    claimRefs:
