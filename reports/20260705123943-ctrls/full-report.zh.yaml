      - number: '3.4'
        title: 护城河耐久性、反向证据与底线判断
        blocks:
          - type: paragraph
            body: >-
              支持 CtrlS 的最强论点不是竞争对手弱，而是 CtrlS 把几种并不总在同一个本土平台上同时出现的特征组合起来：实质性的受监管企业信任、可见的云连接打包、AI
              就绪基础设施营销，以及至少一部分公开价格透明度。这足以让它成为混合与关键任务买方候选名单中可信的一员。但这还不足以构成主导性护城河。Equinix、NTT 和 Digital Realty
              带来更深资本和全球客户覆盖；STT、Yotta 和 Nxtra
              让本土定价和扩张压力保持真实；随着电力、土地、脱碳、人才和供应链限制围绕高增长市场收紧，行业自身的反向证据也在增加。尚未解决的承销问题偏经济性，而非战略性。公开证据大量说明容量、功能宽度和定位，却很少说明实际每机架或每
              MW 托管价格、入住率、流失或合同期限。在这些经济披露缺口关闭前，CtrlS 应被视为具有竞争可信度和中等护城河——强到值得重视，但还没强到可以忽视全球与本土的反应风险。
