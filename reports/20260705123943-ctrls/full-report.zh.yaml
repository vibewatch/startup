      - number: '1.3'
        title: 融资、估值与扩张里程碑
        blocks:
          - type: paragraph
            body: >-
              2026 年 6 月的 CPP 合作是 CtrlS 明确的融资分水岭。交易带来最高 ₹7,000 crore 资金，其中 ₹4,000 crore 股权资金换取 8.2% 股权，另有 ₹3,000 crore
              用于新设 JV，建设更多超大规模园区。合并来看，公告隐含估值约为 ₹44,800–44,900 crore，约 C$6.6 billion。重要的是，管理层把这笔交易定义为面向
              AI、云和超大规模云厂商需求的扩容资金，而不是救助或修复资产负债表。CPP 轮之前，公司已经在激进扩张：2023 年披露 $2 billion 投资计划，启用 72 MW Chennai 园区，扩大 Mumbai
              电力，并在 Kolkata、Bhopal 和 Patna 推进新城市项目。仅看公开证据，CtrlS 更像是一家已经提前于需求建设、随后引入机构资本加速建设周期的公司，而不是借资本改变方向。
