        title: 留存、支持与耐久性缺口
        blocks:
          - type: paragraph
            body: >-
              公开证据更多说明客户为什么购买 CtrlS，而不是它们停留多久、扩张多少。反复出现的客户背书语言集中在可靠性、项目交付、成本优化、工程支持和业务连续性上，而不是量化节省、续约队列或席位增长。这与 CtrlS
              公开优化的客户问题相吻合：银行、交易所、医院或企业基础设施团队选择数据中心伙伴时，支持纪律和运营信任常常与标价一样重要。独立验证要薄得多。Gartner Peer Insights
