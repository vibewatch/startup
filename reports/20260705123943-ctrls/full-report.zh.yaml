      - number: '7.5'
        title: 财务模型、人员与打破投资假设的触发因素
        blocks:
          - type: paragraph
            body: >-
              最难承销的不是 CtrlS 能否讲出一个可信的增长故事，而是如果执行滑坡，公开信息是否足以给下行定价。独立市场研究支持这样一个判断：印度数据中心回报对监管、税制设计、电力经济性和生态准备度都很敏感；CtrlS
              自己在 2026 年面向 CXO
              的表述也显示，能源系统、政策和基础设施都已成为董事会层面的约束。公开披露没有给出经审计收入、利用率、杠杆或合同集中度；如果电力成本上升、部署放慢，或受监管客户更难拿下，投资人无法独立测试公司还有多少缓冲。2025
              年补强领导层有帮助，但公司仍依赖相对精简的高管团队，同时管理扩张、合规和伙伴生态。正确做法是设定明确的否决标准：如果电力和可再生能源里程碑明显滑坡，或经审计的合规证据落后于不断收紧的 BFSI
              和隐私预期，投资假设就应从按增长承销转为等待验证。
