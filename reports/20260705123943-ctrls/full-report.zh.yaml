      - number: '3.3'
        title: 定价、打包、切换成本与多宿主
        blocks:
          - type: paragraph
            body: >-
              公开定价证据出人意料地不均衡。已审阅样本中最清晰的定价披露并非来自全球既有巨头或本土对手，而是来自 CtrlS 自身：其云基础设施价目表发布了小型 VM 模板起步价，月度经常性收费为
              ₹3,735。除这个标价外，CtrlS 还打包私有云、全托管 IaaS、GPU 私有云、Cloud Connect、Google Cloud Interconnect 和 Oracle
              FastConnect，说明其方案明显比纯机架空间销售更分层。已审阅的 STT、Yotta、Nxtra、Equinix、NTT、Web Werks 和 AdaniConneX
              同业页面通常强调解决方案、电力、韧性或生态深度，而不是醒目的标价，因此公开比较很快从数字转向定性。这并不意味着切换成本低。在这个市场，锁定来自迁移事件、互联设计、云入口依赖、灾难恢复拓扑和合规再验证，而不是来自软件式功能嵌入。对超大规模云厂商和云原生买方来说，多宿主当然可行，因为印度现在在多个都市圈已有多家规模化运营商；但对受监管或延迟敏感工作负载而言，对等互联、云入口质量和恢复架构会变成有粘性的运营决策。CtrlS
              的 BFSI 定位和 Google 对等互联状态增强了信任故事，而 Nxtra 的电信覆盖和 Yotta 的 AI 云组合，则清楚显示竞争替代仍会发生在哪里。
