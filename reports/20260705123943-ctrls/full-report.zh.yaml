      - number: '1.2'
        title: 领导层、治理与关键人物依赖
        blocks:
          - type: paragraph
            body: >-
              CtrlS 的创始人连续性格外强。Sridhar Pinnapureddy
              仍是公司最鲜明的公开面孔，公司网站披露的董事会结构也仍以创始人家族代表为中心，同时配有独立和非执行董事。已发布的高管名单显示，公司运营模式比典型创始人主导的基础设施企业更制度化：财务、全球运营、超大规模增长、企业销售、法务、合规和营销都有具名负责人。2025
              年 9 月任命 Rahul Dhar，并扩大 Vipin Jain 的职责，说明公司在大型 CPP 交易前夕补了管理层厚度。话虽如此，品牌、增长故事和投资者沟通仍高度围绕 Sridhar
              个人展开，关键人物依赖依然实质存在。领导层厚度已有改善，但经营叙事仍与创始人的可信度、执行履历和融资能力紧密绑定。
