      - number: '5.2'
        title: 运营架构与技术依赖
        blocks:
          - type: paragraph
            body: >-
              CtrlS 的技术叙事在基础设施设计与 AI 密度交汇处最具体。它的 AI
              就绪页面、机架规划白皮书、冷却文章和电力基础设施文章，都描述了一个预期机架密度显著更高、热约束更紧、电气行为比传统企业数据大厅更波动的平台。因此，公司围绕三层相互连接的能力来定位架构：高密度设施设计、液冷或混合冷却就绪，以及通往主要云端点的直接网络结构。这比泛泛的「AI
              就绪」文案更具体，因为文件提到 30–100 kW
              机架规划、芯片直冷和浸没式冷却选项，以及电力系统的瞬态负载压力。弱点在于，架构证明仍主要来自第一方。技术意图可信，依赖地图也连贯，但没有等价的公开基准测试包，展示这些设计选择在已安装机群中、按站点、在客户负载下如何表现。
