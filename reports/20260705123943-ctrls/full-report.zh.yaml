      - number: '8.3'
        title: 牛市、基准和熊市情景，以及建议
        blocks:
          - type: paragraph
            body: >-
              公开经济性仍然模糊，所以情景区间很宽。牛市情景不是 CtrlS 突然变成另一个 Equinix；而是印度供给稀缺、更快爬坡的入住率、CPP 背书的执行，让市场继续把 CtrlS
              视为少见且具备真实战略期权价值的本土平台。熊市情景正好相反：如果投资人或未来公开市场买家把注意力放在已披露收入代理值、略为负数的利润率、可见债务和激烈替代竞争上，当前估值标记可能迅速压缩。因此，基准情景应贴近既有交易锚点，而不是大幅高于它。基于公开证据，合理基准区间约为
              ₹42k crore 至 ₹48k crore；只有当利用率、积压订单和定价被证明远强于当前材料，才有可能上探 ₹50k crore
              中段。因此，在当前估值标记下，实际建议是跟踪或继续研究，信心为中等，估值立场为公允偏紧。
