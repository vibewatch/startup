  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局：直接同业、既有巨头与替代方案
        blocks:
          - type: paragraph
            body: >-
              CtrlS 所在市场已经过于宽泛，无法用单一同业集合概括。独立 2026 年排名反复把 CtrlS 与 STT、Yotta、Nxtra、Equinix 和 NTT 并列，市场报告也把许多相同运营商列为
              Mumbai、Navi Mumbai、Hyderabad、Chennai 和 Pune
              的当前投资领导者。这形成了三层竞争圈：第一层是本土直接超大规模与托管同业；第二层是资本更厚、跨国客户关系更深的全球既有巨头；第三层是相邻替代方案，例如 AI
              云平台、内部自建，或让迁移变得没必要的既有服务商合同。背景市场足够大，可以同时吸引三层玩家：Blackridge 认为印度 2025 年底容量约 1,500 MW，Cushman & Wakefield 称该国
              2026 年已有 1.6 GW 运营容量和 3.1 GW 管线。多份市场报告把增长与超大规模云、AI 工作负载和数据本地化政策联系起来，而 Deloitte 和 Accenture
              警告，电力、脱碳、供应链和执行约束正成为所有场内运营商的共同风险。高需求叠加受约束的交付，意味着竞争问题不是买方有没有替代选择，而是谁能在基础设施条件收紧时，仍交付信任、速度和打包能力。
