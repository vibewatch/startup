      - number: '7.4'
        title: 伙伴、公共事业与客户依赖风险
        blocks:
          - type: paragraph
            body: >-
              CtrlS 暴露在一张很宽的依赖图里，范围不止狭义供应商。可再生能源策略一部分靠 NTPC Green
              Energy，也靠更广的政策和公共事业执行。站点经济性和交付速度，取决于地方政府审批和邦级激励的稳定性。企业产品栈靠云连接、对等互联以及与 Google、Oracle
              等生态的互联关系支撑，伙伴相关性也就成为服务主张的一部分。客户侧依赖同样不轻。公开 BFSI 表述显示，受监管工作负载可能是一块值得注意的集中敞口；BSE
              案例也说明，这类部署对信任极其敏感。单独看，上述依赖都不致命；放在一起，外部交易对手、监管者、公共事业和锚定客户，都可能影响实际可用时间、利润率和增长节奏。因此，投资人应把 CtrlS
              视为带有基础设施属性的生态型业务，而不是一个自给自足的运营商。
