      - number: '8.4'
        title: 什么会打破投资假设，以及哪些尽调仍然关键
        blocks:
          - type: paragraph
            body: >-
              估值判断真正依赖的不是 CtrlS
              是否是一家严肃公司；公开证据已经说明它是。悬而未决的是，扩张叙事里有多少能转化为已投资本的持久回报。五件事可能迅速打破投资假设：建成容量对应的入住率偏弱、隐藏杠杆或限制性债务条款、因电力或土地导致项目延误、资本更充足的同行压低价格，以及少数客户或园区集中度过高。上述五项都是可查的尽调事项，但当前材料看不到。因此，最终尽调应聚焦逐园区利用率、已签约积压订单和预租证据、实际定价相对标价、债务期限和契约细节、客户集中度，以及
              2026 年轮次附带的确切经济权利。在上述事项披露前，投资案值得跟踪，但不容易用高确信度承销。
