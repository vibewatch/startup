        - 相对小的高层团队必须同时扩张园区、合规和伙伴关系
        - 中
        - 高
        - 扩大授权运营责任，增加继任深度
        - 审查组织架构、决策权和继任计划
      - - 超大规模运营领导力
        - AI 就绪容量和伙伴生态扩张后，执行负担上升
        - 中
        - 高
        - 运营 KPI 和逐站点问责
        - 索取爬坡评分卡和里程碑延误记录
      - - 电力、冷却和 MEP 工程人才
        - 高密度 AI 基础设施需要稀缺技术人才
        - 高
        - 中高
        - 薪酬、培训、专业人才招聘、合作伙伴支持
        - 审查流失率、空缺岗位和对承包商的依赖
      - - 合规和审计运营
        - BFSI、隐私和数据驻留主张需要重证据的运营纪律
        - 中
        - 高
        - 专职治理负责人、外部审计、客户专属控制图谱
        - 检查审计日程、例外事项和整改积压
      - - 商务和合作伙伴管理团队
        - 云和生态价值要靠条款、契合度和交付可信度撑住
        - 中
        - 中
        - 正式合作伙伴治理和续约打法
        - 审查续约记录、联合销售表现和合作伙伴认证状态
    notes: 按严重程度排序。人员风险的核心不是创始人戏码，而是领导层仍较集中，能否同时把电力、合规、合作伙伴三条线跑成工业化执行。
    claimRefs:
      - CR032
      - CR034
      - CR035
      - CR036
      - CR037
      - CR042
  - id: TR005
    title: 风险缓释与否决标准表
    columns:
      - 风险
      - 可监测触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 园区电力充足度
        - 电网 / 互联里程碑和披露的新增电力
        - 大型园区电力扩容严重滑期，或可用电力低于 AI 密度销售假设
        - 重新测算部署节奏、利润率和承诺的 AI 容量
      - - 可再生能源执行
        - NTPC / 太阳能项目里程碑和可再生能源覆盖率
        - 可再生能源项目错过关键里程碑，或未能改善成本 / 韧性画像
        - 将缓释叙事视为很大程度上的愿景，并下调信心
      - - BFSI / 隐私控制成熟度
        - 第三方审计、数据泄露预案测试、客户例外日志
        - 经审计证据落后于收紧的 RBI / DPDP 预期，或重大例外仍未解决
        - 暂停投资测算，直到控制证据获得独立验证
      - - 合作伙伴生态粘性
        - 互联契合度、合作伙伴续约、定价竞争力
        - Google / Oracle / 对等互联的价值主张走弱，或条款变得不经济
        - 下调产品层上行空间，把测算重心放回基础托管经济性
      - - 披露质量
        - 对利用率、收入集中度和 SLA 结果的可见度
        - 管理层无法为核心单位经济性问题提供可信的非公开证据
        - 将投资判断从增长型测算转为继续研究 / 回避
    notes: 这些否决标准刻意选成可监测项。重点不是猜中每一个下行情景，而是找出最能否定公开增长叙事的事件。
    claimRefs:
      - CR005
      - CR041
      - CR042
      - CR043
      - CR044
      - CR045
      - CR046
  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 当前判断
      - 判断依据
      - 哪些证据会改变判断
    rows:
      - - 投资建议
        - 当前估值下，跟踪 / 继续研究
        - 外部真实定价已经出现，但公开经济性信息太薄，支撑不了高确信度测算。
        - 经审计的利用率、在手订单、定价和债务条款披露。
      - - 信心
        - 中
        - 估值事件真实存在，但多数运营 KPI 仍来自第三方资料。
        - 招股书级财务披露或贷款方风格的尽调材料。
      - - 风险评级
        - 高
        - 资本强度、电力瓶颈和资金更厚的同行都可能迅速压缩估值。
        - 入驻率、定价和项目执行保持高于计划的证据。
      - - 估值立场
        - 合理到偏贵
        - 对一个稀缺的印度平台来说，这个价格说得通；但对照可见收入代理指标和负净利率，仍然偏贵。
        - 更低的有效进入价格，或好得多的 KPI 披露。
      - - 决策含义
        - 不要把当前价格按「明显便宜」来测算
        - 目前公开材料能证明可信度，不能证明价格便宜。
        - 只有尽调补上主要经济性缺口，或价格松动，才推进。
    notes: 此表明确对价格敏感：它把公司质量与当前估值允许投资者测算的内容分开。
    claimRefs:
      - CV001
      - CV002
      - CV036
      - CV037
      - CV041
      - CV044
      - CV045
      - CV048
  - id: TV002
    title: 正反投资论点表
    columns:
      - 主题
      - 正方论点
      - 反方论点
      - 决定性证据
    rows:
      - - 市场背景
        - 印度需求、超大规模云厂商和 AI 让基础设施稀缺度维持高位。
        - 即使需求强劲，电力和执行约束也会拖慢变现。
        - 各园区已签订单、入驻爬坡和可用电力证据。
      - - 融资验证
        - CPP 在大规模层面给出了真实外部价格锚。
        - 一个成熟投资者入场，不等于广泛市场出清证明。
        - 独立后续定价、再融资条款，或公开市场风格披露。
      - - 平台广度
        - 多城市布局和新园区建设带来真实期权价值。
        - 布局越宽，资本开支、租赁和执行负担也越重。
        - 新都市圈和边缘站点的回报，而不只是网点数量。
      - - 可比定位
        - CtrlS 可被视为稀缺本土平台，而非普通托管供应商。
        - 全球和本土同行已经提供可信替代，披露也更强。
        - 相比 Yotta、Nxtra、STT 和全球既有玩家的胜率、定价权和留存证据。
      - - 经济性质量
        - 收入增长足够真实，足以支撑投资者继续关注。
        - 可见利润率仍薄，收入代理指标未经审计。
        - 经审计的收入、EBITDA、利用率和客户质量披露。
    notes: 争论不在于 CtrlS 是否真实，而在于当前估值是否值得用现有证据支付，而不是提前支付未来平台稀缺性。
    claimRefs:
