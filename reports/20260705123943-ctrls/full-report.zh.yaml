              Center、East Consultancy Services 和 Shriram Pistons 都在当前 CtrlS 页面中给出正面引述；BSE CEO 也在 2024 年 5 月为 Hyderabad
              DC3 揭幕，早于 2025 年 6 月合作公告把双方关系明确化。实际解读是，CtrlS
              并没有虚构客户存在；公司显然拥有真实的企业和受监管工作负载部署。限制在于证据质量。多数具名证明由公司自写，通常是定性内容，很少绑定合同规模、开始日期、续约历史或精确产品组合，因此投资者应区分真实部署证明与已充分承销的收入耐久性。
