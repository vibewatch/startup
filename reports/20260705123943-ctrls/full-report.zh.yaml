        - GPU 集群、预配置环境、一键部署、自动扩缩
        - 实际 GPU 定价和利用率未公开
        - 支撑 AI 工作负载定位，但不能证明价格领先
      - - STT GDC India
        - 已审阅页面无可见标价
        - 以报价驱动的企业模式
        - 安全、可持续的托管解决方案
        - 机架、套间和 MW 定价未公开
        - 更多靠信任和运营质量竞争，而不是可见公开价格
      - - Yotta
        - 已审阅页面无可见标价
        - 以报价驱动的超大规模和云合约
        - AI、云、主权基础设施、超大规模园区
        - 有效园区定价和合约条款未公开
        - 买家想要算力加设施容量时，它是强替代方案
      - - Nxtra
        - 已审阅页面无可见标价
        - 以报价驱动的企业和电信模式
        - 托管加网络和边缘触达
        - 实际定价和续约行为未公开
        - 对边缘密集型买家，分发触达可能比单价更重要
      - - Equinix / NTT
