  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户细分与买方地图
        blocks:
          - type: paragraph
            body: >-
              CtrlS
              的公开客户故事，在工作负载具有关键任务属性、受监管或地理分布广时最强。反复出现的买方不是消费应用产品经理，而是基础设施、CIO、平台或承担风险的企业负责人；他们重视正常运行时间、恢复、合规和全国足迹，而不是单纯最低托管成本。公司公开界面声称被
              60 多家 Fortune 500 公司、全球前七大超大规模云厂商中的五家、领先银行，以及 BSE、United Overseas Bank、Reliance Power、Protean eGov
              Technologies、Rajiv Gandhi Cancer Institute & Research Center、East Consultancy Services 和 Shriram Pistons
              等具名机构使用。因此，公开可见的垂直结构首先偏向 BFSI 和资本市场基础设施，其次是企业工业和公共服务工作负载，再之后才是泛创业公司托管。从地理上看，公司试图同时服务两类相互关联的客户原型：一类是需要
              Mumbai、Chennai、Hyderabad、Bengaluru、Kolkata 和 Noida 等高密度主园区的大都市大客户；另一类是延迟或主权敏感的区域买方，它们需要 Patna、Lucknow、GIFT
              City Ahmedabad 等地的边缘容量。这让本章最清晰的细分镜头变成买方关键性和地理，而不是 SMB 对企业。
