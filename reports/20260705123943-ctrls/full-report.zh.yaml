      - - 来自 STT、Yotta 和 Nxtra 的本土运营压力
        - 竞争威胁
        - 高
        - 这些提供商已在营销安全托管、超大规模园区、AI 云或大型本土电力足迹
        - 追踪城市级赢单，以及 CtrlS 到底靠价格、信任还是部署速度取胜
      - - 来自 Equinix、NTT 和 Digital Realty 的资本和生态不对称
        - 竞争威胁
        - 高
        - 全球在位者带来更大的资产负债表、更广客户基础和更强互联生态
        - 评估 CtrlS 能否在不匹配全球生态广度的情况下守住本土受监管账户
      - - 多归属和替代风险
        - 商品化威胁
        - 中
