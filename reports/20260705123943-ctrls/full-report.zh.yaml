  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前价格锚点，以及披露为何仍限制确信度
        blocks:
          - type: paragraph
            body: >-
              CtrlS 有一个真实市场事件可以作为估值锚点：2026 年 6 月 CPP Investments 交易。官方公告和 PR 通稿都把公司投前估值放在约 ₹44.8k crore 至 ₹44.9k
              crore，₹4,000 crore 对应 8.2% 股权，另有 ₹3,000 crore
              进入一个合资公司，用于新建超大规模园区。与传闻或内部标记相比，差别很大；一家成熟外部投资人确实给这门生意定了价。问题在于，公开材料仍缺少投资人通常会用来判断该价格究竟慷慨还是克制的大部分运营数据。类申报资料显示，FY2025
              收入高于 ₹1,000 crore，或许达到 ₹1,500 crore 至 ₹1,750 crore；净利率仍略为负数，未结清担保 /
              质押也仍然可观。换句话说，外部价格可信，但其背后的承销信心仍受制于不完整的经济性和未披露的轮次条款。
