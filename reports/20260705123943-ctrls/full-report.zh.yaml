        blocks:
          - type: paragraph
            body: >-
              资本强度让 CtrlS 的财务故事同时变得最强、也最不确定。2026 年 6 月 CPP 一揽子资金规模大且证据充分：总额 ₹7,000 crore，其中 ₹4,000 crore 投向 8.2%
              股权，₹3,000 crore 投向新的超大规模园区 JV。这是有分量的机构背书。但同一公开记录也显示公司大量使用债务。来自登记记录的来源报告 ₹4,181 crore 未结清押记、2025
              年多次融资设施活动和多家贷款方。与此同时，站点层面的披露显示资本消耗速度有多快：仅 Mumbai 就有 300 MW 电网电力，并有通往 700 MW 的路径；Noida 正把年度电力的 60%
              转向太阳能；GreenVolt 与 2030 年前 >1 GW 可再生能源计划相关。结论不是 CtrlS
              缺乏资本渠道，而是增长看起来由股权、债务和电力相关基础设施支出持续混合融资，因此融资依赖仍是持续存在的尽调议题。
