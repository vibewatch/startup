              CtrlS 的公开客户逻辑支持两条可见扩张动作。第一条是单一买方内部的账户扩张：客户可以从托管或某个都市圈设施起步，再随着工作负载要求提高，添加灾难恢复、云连接、合规工作或 AI
              就绪容量。第二条是地理扩张：足迹已从主要都市圈延伸到 Patna、Lucknow 和 Ahmedabad
              等区域与金融科技取向边缘站点，扩大了对需要更低延迟或最大园区之外政策舒适度客户的相关性。最强的公开前行动作在银行和受监管基础设施中，公司明确销售合规优先架构、定制建设容量和韧性定位。这带来上行，也带来集中度问题。公开参考重度依赖
              BFSI、BSE 和少数标杆企业客户背书，而确切客户数量、头部账户占比、垂直 ARR
