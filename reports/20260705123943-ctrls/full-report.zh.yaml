  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: CtrlS 最重要风险向量的剩余严重性。
    approximationNotes: 可能性和影响位置是分析师基于已引用公开证据做出的定性判断，不来自管理层提供的事故、财务或审计数据集。
    data:
      columns:
        - 极低影响
        - 低影响
        - 中等影响
        - 高影响
        - 关键影响
      rows:
        - label: 极高可能性
          values:
            - ''
            - ''
            - 邦级政策碎片化
            - BFSI 证据缺口
            - ''
        - label: 高可能性
          values:
            - ''
            - ''
            - 披露不透明
            - AI 功率密度超预期
            - 公用事业或电网容量滞后
        - label: 中等可能性
          values:
            - ''
            - 合作伙伴重新定价
            - 安全或 OT 控制证明缺口
            - DPDP 或 BFSI 合规摩擦
            - 可再生能源项目延期
        - label: 低可能性
          values:
            - ''
            - ''
            - 关键人物执行失误
            - 黑天鹅物理中断
            - ''
        - label: 极低可能性
          values:
            - ''
            - ''
            - ''
            - 正式执法意外
            - ''
    claimRefs:
      - CR002
      - CR006
      - CR015
      - CR025
      - CR034
      - CR043
      - CR044
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 电力、合规和依赖冲击如何传导到经济性和信心。
    approximationNotes: 边表示公开证据中可见的方向性传导路径，不是量化因果权重。
    data:
      nodes:
        - id: n1
          label: 电力密度压力
        - id: n2
          label: 公用事业或可再生能源延迟
        - id: n3
          label: 合规收紧
        - id: n4
          label: 合作伙伴依赖
        - id: n5
          label: 客户集中度
        - id: n6
          label: 可用性或交付风险
        - id: n7
          label: 利润率压力
        - id: n8
          label: 估值下行
        - id: n9
          label: 投资逻辑破裂
      edges:
        - from: n1
          to: n6
          label: 售出容量超过韧性交付边界
        - from: n2
          to: n7
          label: 能源成本上升，容量爬坡变慢
        - from: n3
          to: n5
          label: 受监管客户要求更强审计证明
        - from: n4
          to: n6
          label: 合作伙伴重要性或条款削弱服务价值
        - from: n5
          to: n8
          label: 收入质量和信任担忧上升
        - from: n6
          to: n8
          label: 可用性问题或延期削弱可信度
        - from: n7
          to: n8
          label: 回报被压缩
        - from: n8
          to: n9
          label: 增长逻辑不再足以补偿风险
    claimRefs:
      - CR014
      - CR015
      - CR025
      - CR039
      - CR040
      - CR043
      - CR044
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: 影响 CtrlS 执行和信任结果的关键外部参与方与系统。
    approximationNotes: 该依赖图展示公开证据中最可见的外部关系；私下合同条款和交易对手集中度仍未披露。
    data:
      nodes:
        - id: d1
          label: CtrlS
        - id: d2
          label: 邦政府 / 审批
        - id: d3
          label: 公用事业与电网容量
        - id: d4
          label: NTPC / 可再生能源项目
        - id: d5
          label: Google、Oracle 与对等互联生态
        - id: d6
          label: BFSI 锚定客户
        - id: d7
          label: 审计与控制证据
      edges:
        - from: d2
          to: d1
          label: 场址经济性与速度
        - from: d3
          to: d1
          label: 可用电力与韧性
        - from: d4
          to: d1
          label: 可再生能源成本缓释
        - from: d5
          to: d1
          label: 混合云产品价值
        - from: d6
          to: d1
          label: 信任敏感型需求集中
        - from: d7
          to: d6
          label: 赢得或留住工作负载所需的证据
    claimRefs:
      - CR025
      - CR026
      - CR027
      - CR029
      - CR030
      - CR031
      - CR044
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 建议逻辑从真实融资定价出发，穿过不透明的经济性，最后落到「跟踪」或「继续研究」。
    data:
      nodes:
        - id: mark
          label: 真实定价锚
          detail: CPP 交易对应约 ₹44.8k-44.9k crore 投前估值
        - id: market
          label: 印度需求强劲
          detail: 1.6 GW 已投运市场和 3.1 GW 管线支撑稀缺性
        - id: optionality
          label: 平台广度
          detail: 多城市足迹和新园区扩张增加上行选择权
        - id: opacity
          label: 经济账不透明
          detail: 收入、利用率、债务条款和本轮融资经济条款仍不完整
        - id: decision
          label: 跟踪 / 继续研究
          detail: 估值标记可信，但证据还不足以支持买入判断
      edges:
        - from: mark
          to: market
          label: 由……支撑
        - from: market
          to: optionality
          label: 放大
        - from: optionality
          to: opacity
          label: 被……抵消
        - from: opacity
          to: decision
          label: 推动
    claimRefs:
      - CV001
      - CV017
      - CV032
      - CV041
      - CV044
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 当前估值标记会对应截然不同的收入倍数，取决于哪个公开的 FY2025 收入代理口径更接近现实。
    data:
      items:
        - label: 以 ₹1,000 crore 收入计
          value: 44.8
        - label: 以 ₹1,500 crore 收入计
          value: 29.9
        - label: 以 ₹1,750 crore 收入计
          value: 25.6
      yAxis:
        label: 隐含投前收入倍数（x）
    approximationNotes: 用已披露的约 ₹44,824 crore 投前估值锚点，对照 Tracxn 和 Tofler 给出的公开 FY2025 收入代理口径；这些只是方向性估算，并非经审计的估值倍数。
    claimRefs:
      - CV001
      - CV008
      - CV009
      - CV036
      - CV037
      - CV045
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 基准情形下，基于公开证据的估值区间贴近当前估值标记；一旦切到乐观或悲观假设，区间会明显拉宽。
    data:
      items:
        - label: 悲观情形
          low: 30000
          mid: 34000
          high: 38000
        - label: 基准情形
          low: 42000
          mid: 45000
          high: 48000
        - label: 乐观情形
          low: 52000
          mid: 56000
          high: 60000
    approximationNotes: 这些区间以 INR crore 计，是基于已披露的 2026 年交易、可见收入代理口径、市场增长和下行风险给出的判断带，而不是完整折现现金流模型的结果。
    claimRefs:
      - CV039
      - CV040
      - CV041
      - CV043
      - CV048
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
