      - number: '7.2'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              CtrlS 已经在运营层面面对监管风险，因为公司大量服务的行业里，基础设施选择和合规义务无法拆开。DPDP 2025 框架把隐私准备度从单纯政策问题，变成控制和证据问题；RBI
              对外包的预期、银行业审计要求，也抬高了受监管机构选择托管服务商时的尽调门槛。CtrlS 也看到了监管门槛，已经把隐私、数据驻留、灾备和供应商风险控制明确打包进 BFSI
              定位。方向上利好，但不能消除法律或监管敞口。跨邦扩张还落在一张由激励、公共事业许可和地方审批拼成的网里；即便客户需求稳定，监管条件也可能因地区而变。公开证据更多证明合规准备，而不是独立验证的审计结果、事件历史或已披露诉讼。因此，投资人应把合规成熟度视为可信但尚不能仅凭公开材料定论。
            claimRefs:
