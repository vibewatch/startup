      - number: '2.4'
        title: 增长驱动因素与捕获所需条件
        blocks:
          - type: paragraph
            body: >-
              需求故事很容易理解：印度云部署在扩张，AI 工作负载推高计算密度，数据本地化或主权要求把敏感工作负载推向本土容量。第三方来源与 CtrlS
              材料在这个方向上一致。对承销更重要的是需求背后的使能条件。市场增长需要具备电力增长、土地、执行能力和政策支持的大都市，才能把买方意向转成已投运 MW。市场还需要为更高密度 AI
              工作负载调校过的基础设施，冷却、可持续性和韧性标准都比传统企业托管更难满足。竞争供给也不是理论风险：电信支持、基础设施支持和跨国运营商都在印度宣传有实质能力。因此真正的市场问题不是需求是否存在，而是哪类运营商拥有电力接入、执行纪律和买方信任，能在未来几年把需求转化为有利润的已占用容量。
