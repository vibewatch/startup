- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable or set
  - Public anchor
  - Why it matters
  - Read-through for CtrlS
  - Limitation
  rows:
  - - Equinix
    - July 2026 market cap about $98.82B
    - Best public upper-end interconnection and digital-infrastructure benchmark
    - Shows how much value audited ecosystem density can command
    - Global scale and disclosure are far beyond CtrlS today
  - - Digital Realty
    - 300+ data centers, 55+ metros, 5,000+ customers
    - Illustrates the scale and customer breadth of mature digital-infrastructure incumbents
    - Useful for benchmarking what a disclosed global platform looks like
    - No direct India-pure-play pricing read-through from the reviewed page
  - - NTT / STT
    - 150+ global data centers at NTT; secure colocation positioning at STT India
    - Captures incumbent capital and enterprise-trust competition
    - Sets the bar for capital availability and operating proof in India-facing bids
    - Public pages focus on positioning more than valuation
  - - Yotta / Nxtra
    - 52 MW + 7,000 racks / 1 GW path at Yotta; 230+ MW and 66 edge locations at Nxtra
    - Closest domestic operating alternatives in AI-heavy and edge-linked deployments
    - Most relevant check on how special CtrlS really is inside India
    - Neither reviewed surface gives clean public valuation multiples
  - - GDS / Princeton Digital Group
    - Listed multi-market GDS platform; PDG already present in Mumbai and Chennai
    - Shows Asian capital-backed entrants can crowd India too
    - Supports a regional-platform lens rather than an India-only lens
    - Disclosure quality and listing status differ across the pair
  - - Web Werks / AdaniConneX
    - Connectivity-led full stack / greenfield hyperscale ambition
    - Represents adjacent buyer substitutes that can win on packaging or sponsorship
    - Helps frame downside multiple compression if buyers have many credible alternatives
    - Reviewed pages give positioning more than audited economics
  notes: The comp set intentionally mixes public-market leaders, regional platforms, and India-facing domestic peers because CtrlS lacks a single clean listed analogue.
  enumerationScope:
    coverage: partial
    basis: Rows capture the main public-market, regional-platform, and domestic-operating benchmark sets visible in the reviewed evidence rather than every India data-center operator or private round.
