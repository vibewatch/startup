- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold or event
  - Transmission to thesis
  - Action implication
  rows:
  - - Occupancy under-runs new capacity
    - Lease-up or utilization materially trails build pace
    - Turns option value into idle capital and pushes multiple compression
    - Reprice the case toward the bear range until utilization proof improves.
  - - Leverage or covenant stress
    - Debt terms, maturities, or security package prove tighter than expected
    - Shifts upside from growth to balance-sheet management
    - Pause underwriting until debt stack is fully mapped.
  - - Power or project delays
    - Land, grid, or execution bottlenecks delay campus monetization
    - Weakens the scarcity-and-speed argument behind the premium mark
    - Trim upside assumptions and push timing further out.
  - - Pricing compression versus peers
    - New bids clear at lower realized price or weaker mix than implied
    - Moves CtrlS closer to ordinary colo economics
    - Shift stance from fair-to-stretched toward stretched.
  - - Customer concentration surprise
    - A few hyperscalers, BFSI clients, or campuses dominate economics
    - Makes revenue quality and renewal risk much weaker than the narrative suggests
    - Require concentration-adjusted downside modeling before proceeding.
  notes: These are the shortest paths from a credible platform story to a materially weaker investment case.
