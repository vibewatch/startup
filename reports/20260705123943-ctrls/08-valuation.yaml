- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Core assumptions
  - Valuation range (INR crore)
  - Probability signal
  - Read-through
  rows:
  - - Bull
    - CPP-backed buildout converts into strong occupancy, pricing holds, and CtrlS keeps looking like a scarce India platform.
    - 52,000-60,000
    - 20-25%
    - Upside requires investors to look through current opacity and reward option value.
  - - Base
    - Current mark is directionally right, but disclosure remains incomplete and multiple expansion stays limited.
    - 42,000-48,000
    - 50-60%
    - This is the most defensible range on today's public file.
  - - Bear
    - Utilization, pricing, leverage, or execution disappoint, and peers force valuation back toward visible economics.
    - 30,000-38,000
    - 20-30%
    - Compression can happen without a business collapse if the scarcity story weakens.
  notes: Ranges are judgment bands based on the disclosed transaction, visible revenue proxies, and scenario-specific execution assumptions rather than a full intrinsic model.
