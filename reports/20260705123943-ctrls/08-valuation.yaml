company:
  name: CtrlS
chapter:
  number: 8
  title: Valuation
  summary: 'CPP’s June 2026 investment gives CtrlS a real external price anchor around ₹44.8 thousand crore to ₹44.9 thousand crore pre-money, and the company’s scale plus India demand backdrop make that mark credible. But public revenue proxies of only more than ₹1,000 crore to roughly ₹1,500 crore to ₹1,750 crore, slightly negative net margin, and ₹4,181 crore of open charges imply a rich 26x to 45x revenue range on incomplete disclosure. Recommendation: track or research-more at the current mark, with medium confidence and a fair-to-stretched stance until utilization, backlog, and debt terms are disclosed.'
sections:
- id: price-anchor-and-disclosure-gap
  title: Current price anchor and why disclosure still limits conviction
  body: 'CtrlS has a real market event to anchor valuation work: the June 2026 CPP Investments transaction. The official release and PR wire both place the company at roughly ₹44.8 thousand crore to ₹44.9 thousand crore pre-money, with ₹4,000 crore going into an 8.2% equity stake and another ₹3,000 crore routed to a joint venture for new hyperscale campuses. That is a meaningful difference versus a rumor or internal mark; a sophisticated external investor actually priced the business. The problem is that the public file still withholds most of the operating data an investor would normally use to decide whether that price is generous or disciplined. Filing-style profiles point to FY2025 revenue somewhere above ₹1,000 crore and perhaps as high as ₹1,500 crore to ₹1,750 crore, while net margin remains slightly negative and open charges remain meaningful. That means the external price is credible, but the underwriting confidence behind it is still constrained by incomplete economics and undisclosed
    round terms.'
