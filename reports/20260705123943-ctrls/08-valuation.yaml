- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Topic
  - Thesis
  - Anti-thesis
  - What would decide it
  rows:
  - - Market backdrop
    - India demand, hyperscalers, and AI keep infrastructure scarcity high.
    - Power and execution constraints can slow monetization even when demand stays strong.
    - Signed backlog, occupancy ramp, and power-availability evidence by campus.
  - - Financing validation
    - CPP created a real external price anchor at a large scale.
    - One sophisticated investor does not equal broad market-clearing proof.
    - Independent follow-on pricing, refinancing terms, or public-market style disclosures.
  - - Platform breadth
    - Multi-city footprint and new-campus buildout add real option value.
    - A wider footprint also widens capex, leasing, and execution burden.
    - Returns on new metros and edge sites rather than footprint count alone.
  - - Comparable positioning
    - CtrlS can be framed as a rare domestic platform, not a commodity colo vendor.
    - Global and domestic peers already offer credible alternatives and stronger disclosure.
    - Win-rate, pricing power, and retention evidence versus Yotta, Nxtra, STT, and global incumbents.
  - - Economics quality
    - Revenue growth is real enough to justify continued investor interest.
    - Visible margins remain thin and revenue proxies are not audited.
    - Audited revenue, EBITDA, utilization, and customer-quality disclosures.
  notes: The debate is not whether CtrlS is real; it is whether the current mark deserves to be paid on present evidence rather than on forward platform scarcity.
