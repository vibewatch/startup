tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Current view
  - Why this is the view
  - What would change it
  rows:
  - - Recommendation
    - track / research-more at the current mark
    - A real external price exists, but public economics remain too thin for conviction underwriting.
    - Audited utilization, backlog, pricing, and debt-term disclosure.
  - - Confidence
    - Medium
    - The valuation event is real, but most operating KPIs still come from third-party profile sources.
    - Prospectus-grade financial disclosure or lender-style diligence materials.
  - - Risk rating
    - High
    - Capital intensity, power bottlenecks, and better-capitalized peers can compress valuation quickly.
    - Evidence that occupancy, pricing, and project execution are holding above plan.
  - - Valuation stance
    - Fair-to-stretched
    - The price is plausible for a scarce India platform, but rich against visible revenue proxies and negative net margin.
    - A lower effective entry price or much better KPI disclosure.
  - - Decision implication
    - Do not underwrite the current price as obviously cheap
    - Today’s public file supports credibility, not bargain pricing.
    - Move only if diligence closes the main economics gaps or the price softens.
  notes: 'This table is explicitly price-sensitive: it separates company quality from what the current mark allows an investor to underwrite.'
