  evidenceGaps:
  - type: enumeration-incomplete
    severity: minor
    topic: comparable-set-coverage
    missingEvidence: A fuller India-specific list of publicly valued data-center platforms or direct private transaction comparables for CtrlS-sized assets.
    whyItMatters: The comparable table is intentionally partial because India has few clean public look-through peers, which limits point-estimate precision.
    diligencePath: Expand the comp sheet with transaction databases, banker books, and additional public filings if the investment process advances.
    relatedTableRefs:
    - TV004
  - type: private-evidence-only
    severity: material
    topic: occupancy-and-utilization
    missingEvidence: Campus-level occupied MW, pre-lease status, and utilization trends across flagship and secondary sites.
    whyItMatters: Occupancy is the clearest bridge between asset footprint and value realization, so without it the current mark remains hard to underwrite.
    diligencePath: Request a site-by-site occupancy, backlog, and ramp deck from management or lenders.
    relatedQuestionRefs:
    - QV028
  - type: private-evidence-only
    severity: material
    topic: debt-maturity-and-covenant-stack
    missingEvidence: Facility-by-facility maturities, security package, pricing grid, and covenant thresholds for existing borrowings.
    whyItMatters: Open-charge disclosure alone does not reveal refinancing risk or downside control, so leverage quality remains uncertain.
    diligencePath: Collect the debt schedule, charge register details, and executed loan agreements during diligence.
    relatedQuestionRefs:
    - QV029
  - type: private-evidence-only
    severity: material
    topic: customer-concentration-and-contract-quality
    missingEvidence: Top-customer exposure, contract tenor, pricing escalators, and booked backlog by campus or segment.
    whyItMatters: Without concentration and tenure data, the market cannot distinguish durable platform economics from a narrower set of large projects.
    diligencePath: Review cohort, concentration, and contract summaries by customer and by site before any underwriting decision.
    relatedQuestionRefs:
    - QV030
