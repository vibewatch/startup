      - number: '1.4'
        title: Customer Positioning, Vertical Focus, and Operating Proof
        blocks:
          - type: paragraph
            body: >-
              CtrlS consistently sells itself as a mission-critical operator for regulated and always-on workloads. The
              company highlights BFSI, telecom, and IT/ITeS as core customer groups and publicly claims to serve 60
              Fortune 500 companies plus five of the world’s top seven hyperscalers. Its sector-specific banking
              materials go further, claiming one in three top Indian banks and 20 MW of banking IT load run with CtrlS.
              Independent coverage of the BSE relationship gives at least one named, high-stakes production proof point:
              infrastructure supporting more than 700 crore daily transactions and around 11 crore investors. This is
              enough to establish that CtrlS is trusted for sensitive, high-throughput digital infrastructure. It is not
              enough, however, to establish retention, utilization, contract duration, or concentration. The public
              customer story is strong on logos and criticality, but still thin on quantified cohort quality.
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO032
              - CO033
              - CO038
              - CO039
      - number: '1.5'
        title: Disclosure Gaps, Inconsistencies, and Overall Read-Through
        blocks:
          - type: paragraph
            body: >-
              CtrlS’s biggest diligence weakness is not demand, asset ambition, or customer relevance; it is disclosure
              quality. Public materials do not provide audited revenue, EBITDA, debt, utilization, lease tenor, or
              customer concentration, which limits the ability to evaluate capital efficiency and downside protection.
              There is also evidence of uneven website updating: some older product pages still mention 15 data centers
              and 275 MW, while the 2026 homepage and CPP release use 19 data centers and 370 MW. That inconsistency
              does not invalidate the higher figure, but it does tell the reader that the public information estate is
              still being refreshed in layers. The net result is a company with convincing scale, a credible
              institutional validation event, and visible expansion proof, but a still-private disclosure profile that
              forces any investor to treat revenue quality, leverage, and utilization as open diligence items rather
              than settled facts.
            claimRefs:
              - CO035
              - CO036
              - CO037
              - CO040
