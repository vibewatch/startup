  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segmentation and buyer map
        blocks:
          - type: paragraph
            body: >-
              CtrlS's public customer story is strongest where workloads are mission-critical, regulated, or
              geographically distributed. The recurring buyer is not a consumer app product manager but an
              infrastructure, CIO, platform, or risk-bearing enterprise owner who values uptime, recovery, compliance,
              and national footprint over purely lowest-cost hosting. Company surfaces claim use by more than 60 Fortune
              500 companies, five of the world's top seven hyperscalers, leading banks, and named institutions such as
              BSE, United Overseas Bank, Reliance Power, Protean eGov Technologies, Rajiv Gandhi Cancer Institute &
              Research Center, East Consultancy Services, and Shriram Pistons. The vertical mix that is actually visible
              in public therefore leans toward BFSI and capital-markets infrastructure first, then enterprise industrial
              and public-service workloads, and only secondarily toward generic startup hosting. Geographically, the
              company is trying to serve two linked customer archetypes at once: large metro accounts that need dense
              primary campuses in Mumbai, Chennai, Hyderabad, Bengaluru, Kolkata, and Noida, and latency- or
              sovereignty-sensitive regional buyers that need edge capacity in places such as Patna, Lucknow, and GIFT
              City Ahmedabad. That makes the chapter's cleanest segmentation lens one of buyer criticality and geography
              rather than one of SMB versus enterprise.
