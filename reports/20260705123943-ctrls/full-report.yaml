      - number: '7.2'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >-
              Regulatory risk is already operational for CtrlS because the company sells heavily into sectors where
              infrastructure choices are inseparable from compliance obligations. The DPDP 2025 framework turns privacy
              readiness into a control-and-evidence issue rather than a policy-only issue, while RBI outsourcing
              expectations and banking-sector audit demands raise the diligence bar for any hosting provider used by
              regulated institutions. CtrlS understands this and is visibly merchandising privacy, residency, disaster
              recovery, and vendor-risk controls into its BFSI positioning. That is directionally positive, but it does
              not eliminate legal or regulatory exposure. Multi-state expansion also sits inside a patchwork of
              incentives, utility permissions, and local approvals, which means regulatory conditions can change by
              geography even when customer demand is stable. The public evidence base is richer on compliance
              preparedness than on independently verified audit outcomes, incident history, or disclosed litigation.
              Investors therefore need to treat compliance maturity as plausible but not conclusively proven from public
              materials alone.
            claimRefs:
              - CR006
