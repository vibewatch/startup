      - number: '2.4'
        title: Growth Drivers and the Conditions Required to Capture Them
        blocks:
          - type: paragraph
            body: >-
              The demand story is easy to understand: India cloud deployments are scaling, AI workloads are raising
              compute density, and data-localization or sovereignty requirements are pushing sensitive workloads toward
              in-country capacity. Third-party sources and CtrlS materials align on that direction. What is more
              important for underwriting is the set of enablers behind the demand. Market growth requires metros with
              power growth, land, execution capacity, and policy support that can turn buyer intent into live MW. It
              also requires infrastructure tuned for denser AI workloads, where cooling, sustainability, and resilience
              standards are harder to meet than in legacy enterprise colocation. Competitive supply is not theoretical:
              telecom-backed, infrastructure-backed, and multinational operators all advertise meaningful capabilities
              in India. So the real market question is not whether demand exists, but which operators have the power
              access, execution discipline, and buyer trust to convert that demand into profitable occupied capacity
              over the next several years.
