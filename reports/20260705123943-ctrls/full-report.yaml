      - number: '8.4'
        title: What would break the thesis and what diligence still matters
        blocks:
          - type: paragraph
            body: >-
              The valuation call does not really hinge on whether CtrlS is a serious company; the public evidence
              already says it is. The unresolved issue is how much of the expansion narrative converts into durable
              returns on deployed capital. Five things can break the thesis quickly: poor occupancy versus built
              capacity, hidden leverage or restrictive debt terms, project delays tied to power or land, price
              compression from better-capitalized peers, and concentration in a few customers or campuses. Those are all
              tractable diligence items, but they are not visible in the current file. That is why final diligence
              should focus on utilization by campus, contracted backlog and pre-lease evidence, realized pricing versus
              list, debt maturity and covenant detail, customer concentration, and the exact economic rights attached to
              the 2026 round. Until those items are disclosed, the investment case is worth tracking but not easy to
              underwrite with high conviction.
