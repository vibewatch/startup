  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Current price anchor and why disclosure still limits conviction
        blocks:
          - type: paragraph
            body: >-
              CtrlS has a real market event to anchor valuation work: the June 2026 CPP Investments transaction. The
              official release and PR wire both place the company at roughly ₹44.8 thousand crore to ₹44.9 thousand
              crore pre-money, with ₹4,000 crore going into an 8.2% equity stake and another ₹3,000 crore routed to a
              joint venture for new hyperscale campuses. That is a meaningful difference versus a rumor or internal
              mark; a sophisticated external investor actually priced the business. The problem is that the public file
              still withholds most of the operating data an investor would normally use to decide whether that price is
              generous or disciplined. Filing-style profiles point to FY2025 revenue somewhere above ₹1,000 crore and
              perhaps as high as ₹1,500 crore to ₹1,750 crore, while net margin remains slightly negative and open
              charges remain meaningful. That means the external price is credible, but the underwriting confidence
              behind it is still constrained by incomplete economics and undisclosed round terms.
            claimRefs:
