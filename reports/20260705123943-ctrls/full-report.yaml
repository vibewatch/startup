      - number: '2.5'
        title: Constraints, Contradictions, and Remaining Sizing Gaps
        blocks:
          - type: paragraph
            body: >-
              The biggest market-analysis risk is false precision. Capacity researchers, media summaries, and operator
              pages describe different parts of the elephant: some track installed MW, some count facilities, some
              forecast demand, and some forecast revenue. Those are all useful, but none can be plugged directly into
              CtrlS revenue without additional assumptions on utilization, contract timing, price realization, and
              attach rates for connectivity or continuity services. Competition also matters more than many top-down
              market summaries admit. Domestic leaders, telecom-backed providers, energy-backed entrants, and
              multinational operators are all trying to capture the same demand wave. Finally, several sources—including
              CtrlS own whitepapers—imply that regulation, power availability, and execution bottlenecks can slow
              monetization even when the market looks large. The market is undeniably attractive, but the remaining
              diligence burden is to translate national growth into segment-level reachable spend and then into yield on
              deployed MW for CtrlS specifically.
