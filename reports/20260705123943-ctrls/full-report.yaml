companyProfile:
  summary: >-
    CtrlS is a Hyderabad-based hyperscale and enterprise data-center operator founded in 2007 by Sridhar Pinnapureddy.
    The company says it runs 19 data centers across nine Indian markets with more than 370 MW of live capacity and a 4.4
    GW project pipeline, serving hyperscalers, BFSI institutions, and other mission-critical enterprise workloads. In
    June 2026, CPP Investments committed up to ₹7,000 crore to CtrlS and a related campus JV, giving the company a
    landmark external validation point while leaving most detailed financial metrics private.
