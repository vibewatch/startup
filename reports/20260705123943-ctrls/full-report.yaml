  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold or event
      - Transmission to thesis
      - Action implication
    rows:
      - - Occupancy under-runs new capacity
        - Lease-up or utilization materially trails build pace
        - Turns option value into idle capital and pushes multiple compression
        - Reprice the case toward the bear range until utilization proof improves.
      - - Leverage or covenant stress
        - Debt terms, maturities, or security package prove tighter than expected
        - Shifts upside from growth to balance-sheet management
        - Pause underwriting until debt stack is fully mapped.
      - - Power or project delays
        - Land, grid, or execution bottlenecks delay campus monetization
        - Weakens the scarcity-and-speed argument behind the premium mark
        - Trim upside assumptions and push timing further out.
      - - Pricing compression versus peers
        - New bids clear at lower realized price or weaker mix than implied
        - Moves CtrlS closer to ordinary colo economics
        - Shift stance from fair-to-stretched toward stretched.
      - - Customer concentration surprise
        - A few hyperscalers, BFSI clients, or campuses dominate economics
        - Makes revenue quality and renewal risk much weaker than the narrative suggests
        - Require concentration-adjusted downside modeling before proceeding.
    notes: These are the shortest paths from a credible platform story to a materially weaker investment case.
    claimRefs:
      - CV020
      - CV021
      - CV031
      - CV038
      - CV040
      - CV043
      - CV047
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Diligence path
    rows:
      - - Utilization and occupancy by campus
        - Current occupied MW, pre-lease status, and absorption by major site
        - This is the clearest bridge between footprint story and value realization
        - Request site-level operating dashboard or lender pack.
      - - Contracted backlog and pricing
        - Booked price versus list, backlog, renewal cadence, and escalation terms
        - Needed to test whether the current mark can hold without narrative support
        - Review major customer contracts and backlog waterfall.
      - - Debt maturities and covenants
        - Facility-by-facility maturity, pricing, security, and covenant terms
        - Needed to understand refinancing and downside-control risk
        - Obtain debt schedule and loan documents.
      - - Customer concentration and tenure
        - Top-customer share, term remaining, and hyperscaler dependence
        - Needed to distinguish durable platform economics from a narrow project set
        - Review cohort, concentration, and churn data.
      - - Exact 2026 round terms
        - Preference stack, governance rights, anti-dilution, and secondary mix
        - Needed to know whether headline valuation equals economic quality
        - Review executed transaction documents.
      - - Returns on edge and secondary-city expansion
        - Capex per site, lease-up time, and realized yield for new metros
        - Needed to validate whether option value is translating into shareholder value
        - Request post-investment review by campus cohort.
    notes: >-
      The unresolved asks are ordinary infrastructure-investor asks, not edge-case curiosities; that is exactly why they
      matter.
