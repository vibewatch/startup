      - number: '2.2'
        title: Sizing the Market Through Multiple Lenses
        blocks:
          - type: paragraph
            body: >-
              No single public number captures CtrlS market cleanly, so the chapter keeps multiple lenses in play.
              Third-party capacity data shows India already at 1.6 GW of live operational capacity with a 3.1 GW
              pipeline, which is enough to establish the market as scaled today rather than merely aspirational.
              Revenue-based market research adds a separate lens: Research and Markets and Arizton both put the India
              datacenter market at USD 9.79 billion in 2025 and forecast USD 21.03 billion by 2031, but those dollar
              totals bundle many services and therefore cannot be mapped directly into CtrlS revenue. Annual flow data
              adds a third angle, with 2025 supply additions and absorption both moving sharply higher. The result is
              clear direction, not perfect precision. CtrlS 370-plus MW live footprint makes it a meaningful platform
              inside the current installed base, but the public record still cannot isolate a clean SAM without
              customer-mix, utilization, and pricing disclosures.
