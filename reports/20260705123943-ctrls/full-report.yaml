  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-Ranked Risk Overview and Investment Implications
        blocks:
          - type: paragraph
            body: >-
              CtrlS's risk profile is dominated by a specific combination of scale ambition and infrastructure
              dependency. Demand-side market evidence is not the main concern: India's data-centre market continues to
              add capacity and absorb it, and both company and independent sources frame AI, cloud, and
              regulated-enterprise demand as real. The harder question is whether CtrlS can keep converting that demand
              into profitable, resilient capacity without tripping over power, compliance, and execution bottlenecks.
              The top cross-cutting risks are power availability, privacy and BFSI compliance burden, partner and
              ecosystem dependence, disclosure opacity around financial quality, and a thesis-break scenario in which
              campus growth stays capital intensive while critical dependencies remain unresolved. The most important
              investment implication is that CtrlS should not be underwritten as a simple real-estate or colocation
              platform. It is an integrated digital-infrastructure operator whose risk surface spans facilities, energy,
              regulation, partner ecosystems, and customer trust simultaneously.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
