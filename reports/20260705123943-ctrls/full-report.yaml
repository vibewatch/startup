  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct peers, incumbents, and substitutes'
        blocks:
          - type: paragraph
            body: >-
              CtrlS competes in a market that is already too broad to describe as a single peer set. Independent 2026
              rankings repeatedly place CtrlS next to STT, Yotta, Nxtra, Equinix, and NTT, while market reports name
              many of the same operators as current investment leaders in Mumbai, Navi Mumbai, Hyderabad, Chennai, and
              Pune. That creates one ring of direct domestic hyperscale and colocation peers, a second ring of global
              incumbents with deeper capital and multinational customer relationships, and a third ring of adjacent
              substitutes such as AI-cloud platforms, internal buildouts, or existing incumbent contracts that make
              migration unnecessary. The background market is large enough to attract all three rings at once:
              Blackridge places India at roughly 1,500 MW of capacity exiting 2025, and Cushman & Wakefield says the
              country already had 1.6 GW of operational capacity plus a 3.1 GW pipeline in 2026. Multiple market reports
              tie that growth to hyperscale cloud, AI workloads, and data-localization policy, while Deloitte and
              Accenture warn that power, decarbonization, supply-chain, and execution constraints are becoming shared
              risks for every operator in the field. That combination—high demand plus constrained delivery—means the
              competitive question is not whether buyers have alternatives, but which provider can still deliver trust,
              speed, and packaged capability under tightening infrastructure conditions.
            claimRefs:
              - CP001
              - CP010
              - CP011
              - CP012
              - CP013
