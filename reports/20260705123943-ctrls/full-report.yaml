      - number: '6.3'
        title: Retention, support, and durability gaps
        blocks:
          - type: paragraph
            body: >-
              Public evidence says more about why customers buy CtrlS than about how long they stay or how much they
              expand. The recurring testimonial language centers on reliability, project delivery, cost optimization,
              engineering support, and business continuity rather than on quantified savings, renewal cohorts, or seat
              growth. That matches the kind of customer problems CtrlS is publicly optimized for: when a bank, exchange,
              hospital, or enterprise infrastructure team chooses a datacenter partner, support discipline and
              operational trust often matter as much as list price. Independent validation is much thinner. Gartner Peer
              Insights exposes only a wrapper page in the fetched material, and Trustpilot's public profile is both
              small-sample and merely average at 3.7 out of 5. Those surfaces are not enough to call customer
              satisfaction weak, but they are also not enough to underwrite it strongly. Most importantly, no reviewed
              source discloses NRR, GRR, churn, contract duration, renewal rates, pricing uplift on expansion, or
              services attach economics. The chapter can therefore conclude that customer use is real and support seems
              strategically important, while durability remains a diligence item rather than a public fact.
            claimRefs:
              - CU010
              - CU015
