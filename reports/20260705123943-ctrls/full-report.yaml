      - number: '1.3'
        title: Funding, Valuation, and Expansion Milestones
        blocks:
          - type: paragraph
            body: >-
              The June 2026 CPP partnership is the clear financing watershed for CtrlS. It brought in up to ₹7,000
              crore, split between ₹4,000 crore of equity for an 8.2% stake and ₹3,000 crore for a new joint venture to
              build additional hyperscale campuses. Taken together, the releases imply a valuation of roughly ₹44.8-44.9
              thousand crore, or about C$6.6 billion. Importantly, management framed the deal as capacity-building
              capital for AI, cloud, and hyperscaler demand rather than a rescue or balance-sheet repair. The CPP round
              followed an already aggressive expansion path: a 2023 $2 billion investment plan, launch of the 72 MW
              Chennai park, power scaling in Mumbai, and new city projects in Kolkata, Bhopal, and Patna. On public
              evidence alone, CtrlS looks like a company that was already building ahead of demand and then added
              institutional capital to accelerate the build cycle rather than to change course.
