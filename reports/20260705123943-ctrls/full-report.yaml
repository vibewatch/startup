      - number: '4.5'
        title: Financial verdict, adverse context, and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The positive case is clear enough: CtrlS has diversified monetization surfaces, visible scale,
              institutional equity support, and a demand backdrop that multiple market researchers describe as
              structurally strong. The negative case is equally clear: data-center economics are being stressed by power
              demand, supply-chain pressure, execution complexity, and financing needs across the industry. CtrlS is not
              immune to those forces; if anything, its ambition makes them more relevant. Public data still does not
              reveal realized pricing, cash generation, customer concentration, site utilization, debt terms, or a
              reliable revenue-mix breakdown. That makes the company difficult to underwrite as a precise financial
              model even if the industrial story is compelling. The right conclusion is therefore not bearishness on
              demand. It is disciplined uncertainty on revenue quality, margin path, and how much more external capital
              the platform may need to translate capacity expansion into durable returns.
