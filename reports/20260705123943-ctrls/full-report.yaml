        title: Monetization stack and pricing model
        blocks:
          - type: paragraph
            body: >-
              CtrlS’s public financial picture starts with a helpful but incomplete pricing surface. Unlike many private
              infrastructure operators, it publishes a cloud rate card with monthly recurring charges for standard
              compute, storage, network, and software layers. That creates a real anchor for base-unit economics. The
              problem is that the company does not appear to sell only standardized cloud units. Public materials show a
              wider stack: colocation, private cloud, GPU private cloud, Oracle and Google interconnect, business
              continuity, and cloud optimization. Those higher-value products are mostly custom configured,
              solution-led, or attach to enterprise hosting environments. As a result, public list prices are useful for
              understanding the entry-level pricing logic, but they are not enough to estimate realized revenue or
              margin. For underwriting, the key distinction is that CtrlS has a visible pricing model, not a fully
              transparent monetization model.
