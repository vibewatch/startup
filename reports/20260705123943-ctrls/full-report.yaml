      - number: '8.3'
        title: Bull, base, and bear scenarios plus the recommendation
        blocks:
          - type: paragraph
            body: >-
              The scenario spread is wide because the public economics are still blurry. The bull case is not that CtrlS
              suddenly becomes another Equinix; it is that India scarcity, faster occupancy, and CPP-backed execution
              let the market keep valuing CtrlS as a rare domestic platform with real strategic option value. The bear
              case is the mirror image: if investors or eventual public buyers focus on disclosed revenue proxies,
              slightly negative margins, debt visibility, and intense competitive alternatives, the current mark can
              compress quickly. The base case therefore stays close to the existing transaction anchor rather than far
              above it. A reasonable public-evidence range is roughly ₹42 thousand crore to ₹48 thousand crore in the
              base case, with upside into the mid-₹50 thousands only if utilization, backlog, and pricing prove much
              stronger than today’s file shows. That leads to a practical recommendation of track or research-more at
              the current mark, with medium confidence and a fair-to-stretched valuation stance.
