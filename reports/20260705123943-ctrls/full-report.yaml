chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Founding, and Current Scale
        blocks:
          - type: paragraph
            body: >-
              CtrlS Datacenters Ltd. is one of the earliest Indian-born hyperscale and enterprise colocation platforms
              to scale into a national network. The company was founded in 2007, is headquartered in Hyderabad, and
              still presents itself as a founder-led infrastructure operator anchored in high-availability or "Rated-4"
              facilities. The company’s current public narrative is built around three numbers: 19 data centers, more
              than 370 MW of live capacity, and 4.4 GW of projects in execution or development. Those figures, repeated
              on the homepage and in the June 2026 CPP transaction release, establish CtrlS as one of the largest
              domestic platforms in India. The service portfolio now spans hyperscale campuses, colocation,
              connectivity, disaster recovery, managed services, and cloud infrastructure, which means CtrlS is no
              longer selling only rack space; it is selling full-stack digital infrastructure to hyperscalers, regulated
              enterprises, and mission-critical Indian workloads.
