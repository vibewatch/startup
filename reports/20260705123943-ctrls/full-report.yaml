      - number: '1.2'
        title: Leadership, Governance, and Key-Person Dependence
        blocks:
          - type: paragraph
            body: >-
              Founder continuity is unusually strong at CtrlS. Sridhar Pinnapureddy remains the defining public face of
              the company, and the board structure shown on the company’s site still centers on founder-family
              representation alongside independent and non-executive directors. The published executive roster suggests
              a more institutional operating model than a typical founder-led infrastructure business: finance, global
              operations, hyperscale growth, enterprise sales, legal, compliance, and marketing all have named leaders.
              The September 2025 appointment of Rahul Dhar and the expanded remit for Vipin Jain show management depth
              being added just before the large CPP transaction. That said, the brand, growth story, and investor
              messaging remain highly personalized around Sridhar, so key-person dependence is still meaningful.
              Leadership depth has improved, but the operating narrative remains tightly coupled to founder credibility,
              execution history, and fundraising ability.
