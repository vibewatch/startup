      - number: '7.3'
        title: Operational, Reliability, and Security Risk
        blocks:
          - type: paragraph
            body: >-
              Operational risk at CtrlS is inseparable from the physics of AI-era infrastructure. The company's own
              recent writing repeatedly acknowledges that higher rack densities, more volatile power draw, and harder
              cooling constraints are redefining data-centre execution. Independent sector research points in the same
              direction: energy availability and cleaner power sourcing are now structural bottlenecks, not edge
              concerns. That creates several linked execution risks. First, utility or campus electrical shortfalls can
              delay AI deployments even when customer demand exists. Second, cooling underperformance can reduce
              sellable density or force costly retrofits. Third, black-swan or hybrid physical disruptions remain
              relevant because hyperscale digital services still depend on real assets such as power infrastructure,
              substations, cable routes, and site operations. CtrlS does show visible mitigations through
              certifications, safety messaging, monitoring, and resilience branding, but public evidence is much thinner
              on campus-by-campus incident rates, audit results, or operational outcomes than it is on intent and design
              philosophy.
