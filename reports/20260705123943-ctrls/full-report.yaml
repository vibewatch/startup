      - number: '8.2'
        title: Comparable framework, option value, and the core thesis debate
        blocks:
          - type: paragraph
            body: >-
              The right comp set for CtrlS is mixed by design. Global digital-infrastructure leaders such as Equinix,
              Digital Realty, and NTT show what public-market scale, audited disclosure, and ecosystem depth look like
              at the upper end. Regional platforms such as GDS and Princeton Digital Group prove that Asian capital can
              support large multi-market footprints. Domestic peers such as Yotta, Nxtra, STT, Web Werks, and
              AdaniConneX show that buyers in India already have credible alternatives for AI-heavy, hyperscale,
              connectivity-led, and edge-heavy workloads. CtrlS does have a real premium argument inside that field. It
              now has a visibly wider footprint than just a few flagship metros, it can point to multiple secondary-city
              or edge assets, and it continues to launch or pre-launch new facilities such as Hyderabad DC3. Case
              studies and third-party recognition also help the platform look institutionally real. The anti-thesis is
              that none of that replaces audited disclosure, and none of it eliminates the execution burden created by a
              widening asset map.
