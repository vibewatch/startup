      - number: '7.5'
        title: Financial Model, People, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              The hardest underwriting challenge is not whether CtrlS can tell a plausible growth story; it is whether
              public information is sufficient to price the downside if execution slips. Independent market research
              supports the view that returns in Indian data centres are sensitive to regulation, tax design, power
              economics, and ecosystem readiness, while CtrlS's own 2026 CXO framing suggests that energy systems,
              policy, and infrastructure have all become board-level constraints. Public disclosure does not reveal
              audited revenue, utilization, leverage, or contract concentration, which means investors cannot
              independently test how much buffer exists if power costs rise, deployments slow, or regulated customers
              become harder to win. Leadership additions in 2025 are helpful, but they do not remove dependence on a
              relatively small senior team to manage expansion, compliance, and partner ecosystems simultaneously. The
              correct response is explicit kill criteria: if power and renewable milestones slip materially, or if
              audited compliance evidence lags tightening BFSI and privacy expectations, the thesis should move from
              growth-underwrite to wait-and-verify.
