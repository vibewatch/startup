            body: >-
              Capital intensity is where CtrlS’s financial story becomes both strongest and most uncertain. The June
              2026 CPP package is large and well corroborated: ₹7,000 crore total, split between ₹4,000 crore for an
              8.2% stake and ₹3,000 crore for a new hyperscale-campus JV. That is meaningful institutional validation.
              But the same public record also shows heavy debt usage. Registry-derived sources report ₹4,181 crore of
              open charges, repeated 2025 facility activity, and multiple lenders. Meanwhile, site-level disclosures
              show how quickly capital can be consumed: Mumbai alone has 300 MW of grid power with a path to 700 MW,
              Noida is moving 60% of annual power to solar, and GreenVolt is linked to a >1 GW renewable plan by 2030.
