      - number: '7.4'
        title: Partner, Utility, and Customer Dependency Risk
        blocks:
          - type: paragraph
            body: >-
              CtrlS is exposed to a wide dependency graph that extends beyond suppliers in the narrow sense.
              Renewable-energy strategy depends partly on NTPC Green Energy and on broader policy and utility execution.
              Site economics and delivery speed depend on local-government clearances and state-level incentive
              stability. The enterprise product stack depends on cloud-connect, peering, and interconnection
              relationships with ecosystems such as Google and Oracle, which makes partner relevance part of the service
              proposition. Customer-side dependency is also non-trivial. Public BFSI claims suggest that regulated
              workloads could be a meaningful concentration pocket, and the BSE proof point shows how trust-sensitive
              these deployments can be. None of these dependencies are fatal in isolation, but together they create a
              business where external counterparties, regulators, utilities, and anchor customers can all influence
              realized uptime, margin, and growth timing. Investors should therefore evaluate CtrlS as an ecosystem
              business with infrastructure characteristics rather than as a self-contained operator.
            claimRefs:
