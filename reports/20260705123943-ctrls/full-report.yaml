  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Practical Substitutes
        blocks:
          - type: paragraph
            body: >-
              CtrlS does not compete in a generic “digital infrastructure” bucket. The addressable market visible in
              public sources is the Indian market for third-party hosting capacity and the services that make that
              capacity usable for critical workloads: hyperscale campuses, enterprise colocation, AI-ready dedicated
              infrastructure, continuity/disaster-recovery environments, and the network and compliance layers attached
              to those deployments. Official CtrlS materials repeatedly package those offers together, which means the
              relevant spend pool is infrastructure and continuity budget, not semiconductor revenue, public-cloud
              software subscriptions, or generic IT services. The closest substitute is not another rack vendor alone;
              it is the choice to stay inside a hyperscaler-only model, keep workloads on legacy in-house facilities, or
              delay migration until compliance, power, or cost predictability becomes more painful. That boundary
              matters because broad India datacenter TAM numbers overstate what CtrlS can realistically monetize unless
              the spend is narrowed to the workloads that need third-party, in-country, resilient capacity.
            claimRefs:
              - CM011
              - CM012
              - CM021
              - CM039
