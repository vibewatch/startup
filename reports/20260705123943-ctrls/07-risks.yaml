  evidenceGaps:
  - type: missing-source
    severity: material
    topic: regulatory-legal-register-completeness
    missingEvidence: Campus-specific permit files, land-title diligence, tax disputes, and any undisclosed litigation or enforcement correspondence.
    whyItMatters: Public sources do not establish a full legal-cleanliness picture across every CtrlS campus or legal entity, which limits confidence in the regulatory register.
    diligencePath: Request legal diligence memo, litigation schedule, key permit inventory, and any outstanding notices or remediation plans.
    relatedQuestionRefs:
    - QR021
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: audit-and-incident-proof
    missingEvidence: Independent control audits, OT-security attestations, campus incident logs, and external compliance exceptions by major customer segment.
    whyItMatters: CtrlS publicly asserts strong controls, but investors need outcome evidence to distinguish mature operations from control marketing.
    diligencePath: Obtain ISO/SOC-style reports, audit exception trackers, and incident summaries for the major campuses serving regulated workloads.
    relatedQuestionRefs:
    - QR010
    - QR032
  - type: private-evidence-only
    severity: blocking
    topic: customer-concentration-and-sla-economics
    missingEvidence: Revenue concentration, workload criticality by customer, SLA penalty history, and churn or renewal metrics for BFSI and enterprise accounts.
    whyItMatters: Without concentration and SLA evidence, investors cannot tell whether trust-sensitive customers are diversified or whether a single failure could hit economics disproportionately.
    diligencePath: Request customer concentration tables, top-account contract summaries, SLA credit history, and renewal cohorts under NDA.
    relatedQuestionRefs:
    - QR015
    - QR016
    - QR028
  - type: private-evidence-only
    severity: material
    topic: utility-and-renewable-timelines
    missingEvidence: Executed utility agreements, power-availability curves, interconnection status, PPAs, and site-by-site renewable rollout milestones.
    whyItMatters: Public power and renewable targets are meaningful only if timeline certainty matches the capacity sold into AI and hyperscale demand.
    diligencePath: Review utility contracts, substation milestones, PPAs, and internal capex sequencing for Mumbai, Chennai, Hyderabad, and future campuses.
    relatedQuestionRefs:
    - QR013
    - QR014
    - QR024
  - type: private-evidence-only
    severity: material
    topic: partner-contract-terms
    missingEvidence: Commercial terms and renewal mechanics for cloud-connect, peering, renewable, and strategic customer partnerships.
    whyItMatters: Dependency risk cannot be priced well if the economic terms, minimum commitments, or exit rights of key partnerships are opaque.
    diligencePath: Inspect major partner agreements, pricing schedules, termination rights, and recent renegotiations.
    relatedQuestionRefs:
    - QR012
    - QR027
  - type: private-evidence-only
    severity: blocking
    topic: financial-disclosure-and-utilization
    missingEvidence: Audited financials, site utilization, energy cost curves, leverage, and headcount productivity metrics.
    whyItMatters: Public capacity and expansion claims are not enough to underwrite returns if unit economics and utilization remain opaque.
    diligencePath: Obtain audited historical financials, board reporting on utilization, debt or project-finance schedules, and energy-cost assumptions by campus.
    relatedQuestionRefs:
    - QR018
    - QR020
    - QR028
