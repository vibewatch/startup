- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Campus power sufficiency
    - Grid/interconnection milestones and disclosed power additions
    - Large campus power expansion slips materially or available power falls short of AI-density sales assumptions
    - Re-underwrite deployment timing, margin, and promised AI capacity
  - - Renewable-energy execution
    - NTPC/solar project milestones and renewable coverage ratios
    - Renewable program misses key milestones or fails to improve cost/resilience profile
    - Treat mitigation story as largely aspirational and reduce confidence
  - - BFSI/privacy control maturity
    - Third-party audits, breach readiness tests, customer exception logs
    - Audited evidence lags tightening RBI/DPDP expectations or major exceptions remain unresolved
    - Pause underwriting until control evidence is independently verified
  - - Partner ecosystem stickiness
    - Interconnect relevance, partner renewals, pricing competitiveness
    - Google/Oracle/peering value proposition weakens or terms become uneconomic
    - Lower product-layer upside and focus underwriting on base colocation economics
  - - Disclosure quality
    - Visibility into utilization, revenue concentration, and SLA outcomes
    - Management cannot provide credible private evidence for core unit-economics questions
    - Move thesis from growth-underwrite to research-more / avoid
  notes: These kill criteria are intentionally monitorable. The point is not to guess every downside but to identify the events that most clearly invalidate the public-growth narrative.
