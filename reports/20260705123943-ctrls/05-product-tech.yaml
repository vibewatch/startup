    - Optimize peering and routing quality
    - Genie Analytics deployment
    - External validation of measured gains is limited
  - - Resilience layer
    - Protect continuity across outages or regional disruption
    - Rated-4 redundancy, DR posture, carrier-neutral routing
    - Public RPO/RTO and failover statistics are missing
