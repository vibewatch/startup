  evidenceGaps:
  - type: missing-source
    severity: material
    topic: sla-gap
    missingEvidence: Published SLA tiers and support boundaries for colocation, DR, IaaS, private cloud, and GPU private cloud.
    whyItMatters: Without a module-level SLA ladder, buyers cannot compare the maturity of the newer cloud layers against the core facility business.
    diligencePath: Request the current master service catalog, standard SLA schedules, and sample order forms for each product family.
    relatedQuestionRefs:
    - QE026
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: module-adoption
    missingEvidence: Named customer counts, utilization, and revenue mix for IaaS, private cloud, and GPU private cloud.
    whyItMatters: The newer cloud modules may be strategically important, but public materials do not show whether they are meaningful businesses or mostly positioning layers.
    diligencePath: Request active-customer counts, booked capacity, top customer examples, and revenue contribution by module.
    relatedQuestionRefs:
    - QE028
    relatedTableRefs:
    - TE001
    - TE006
  - type: missing-source
    severity: minor
    topic: certification-gap
    missingEvidence: A facility-by-facility and service-by-service matrix showing which certifications apply, when they were issued, and what scope they cover.
    whyItMatters: Public certification branding is useful, but diligence still needs scope precision to know which campuses and managed layers inherit which controls.
    diligencePath: Request the current certification register, scope statements, and audit dates by campus and managed service.
    relatedQuestionRefs:
    - QE029
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: minor
    topic: support-validation
    missingEvidence: Current named customer references and independent operational feedback for the private-cloud and GPU-private-cloud layers.
    whyItMatters: Sparse third-party feedback makes it hard to separate marketing readiness from production maturity in the newer service lines.
    diligencePath: Ask for three current reference customers using private cloud, GPU private cloud, or cloud-connect services in production.
    relatedQuestionRefs:
    - QE027
    relatedTableRefs:
    - TE002
