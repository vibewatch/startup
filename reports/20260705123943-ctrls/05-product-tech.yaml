- id: TE006
  title: Competitive capability comparison table
  columns:
  - Provider
  - What it emphasizes publicly
  - Why CtrlS differs
  - Implication
  rows:
  - - Yotta
    - Large hyperscale campus with 52 MW live NM1 and 1 GW park scalability
    - CtrlS pairs scale with broader legacy DR / cloud-connect overlays
    - CtrlS competes on platform breadth, not just a flagship campus
  - - Nxtra
    - 15 hyperscale data centers and 230+ MW total power
    - CtrlS pairs comparable domestic ambition with more explicit cloud-interconnect marketing
    - Scale competition inside India is real
  - - Equinix
    - Global interconnection narrative and subsea-cable corridor logic for India
    - CtrlS must win on domestic footprint, service integration, and local execution
    - Connectivity depth is strategically necessary, not optional
  - - Web Werks
    - Colocation plus cloud, servers, and interconnection
    - CtrlS looks less unique on service breadth than on physical domestic scale
    - Integrated offerings are becoming table stakes
  - - NTT Data
    - 150+ data centers in 20+ countries
    - CtrlS is smaller globally but more India-concentrated
    - Enterprise buyers can compare local focus versus global platform reach
  - - AdaniConneX
    - Infrastructure-plus-EdgeConneX partner ecosystem
    - CtrlS presents a more internally integrated domestic operating story
    - Partnership-led ecosystems are a live alternative model
  notes: Peer comparisons use each provider’s own positioning, so the implication column focuses on what the comparison means for CtrlS rather than asserting objective superiority.
