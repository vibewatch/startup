company:
  name: CtrlS
chapter:
  number: 5
  title: Product & Technology
  summary: 'CtrlS sells more than wholesale rack space: the current public product stack spans colocation, IaaS, private cloud, GPU private cloud, disaster recovery, and direct cloud-connect services on top of a national data-center footprint. The technical story is credible on power, cooling, and network interconnection, but standardized SLA detail, service-level adoption data, and independent operator feedback remain much thinner than the company-authored product narrative.'
sections:
- id: product-definition
  title: Product Definition and Module Map
  body: 'In customer workflow terms, CtrlS is no longer describing itself as a landlord of cabinet space. Its public surface starts with core colocation and disaster recovery, then layers in managed IaaS, private cloud, GPU private cloud for AI workloads, and private interconnection into Oracle and Google cloud environments. That matters because the buyer journey it presents is modular: a customer can start with physical hosting, then add private compute, AI clusters, disaster-recovery coverage, and direct multi-cloud connectivity without changing operators. The product map is still anchored in the physical campus network, but the message has shifted toward hybrid digital-infrastructure outsourcing. The strongest evidence is not abstract branding; it is the number of separately maintained service pages, each with its own positioning, feature set, and in some cases public price or technical collateral. The practical read-through is that CtrlS wants to be purchased as an integrated platform
    for mission-critical and AI-heavy workloads, not as a single-point colocation vendor.'
  claimRefs:
