- id: named-customer-proof-and-adoption-signals
  title: Named customer proof and adoption signals
  body: 'Named customer proof exists, but it is lopsided. The single strongest public production reference is BSE: the official release and two independent follow-on stories all say CtrlS powers infrastructure supporting more than 700 crore daily transactions and more than 11 crore investors, which is far more concrete than a generic logo wall. Beyond BSE, CtrlS''s public proof comes mainly from testimonials embedded inside service and facility pages rather than from deep standalone case studies. Those testimonials do still matter: United Overseas Bank, Reliance Power, Protean eGov Technologies, Rajiv Gandhi Cancer Institute & Research Center, East Consultancy Services, and Shriram Pistons are all quoted positively on current CtrlS pages, and BSE''s CEO also inaugurated Hyderabad DC3 in May 2024 before the June 2025 partnership announcement made the relationship explicit. The practical interpretation is that CtrlS is not fabricating customer existence; the company clearly has real enterprise
    and regulated-workload deployments. The limitation is evidence quality. Most named proof is company-authored, often qualitative, and rarely tied to contract size, start date, renewal history, or exact product mix, so investors should distinguish real deployment proof from fully underwritten revenue durability.'
