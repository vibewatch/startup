- id: expansion-paths-and-concentration-risk
  title: Expansion paths and concentration risk
  body: 'CtrlS''s public customer logic supports two visible expansion motions. The first is account expansion inside one buyer: a customer can start with colocation or a metro facility, then add disaster recovery, cloud-connect, compliance work, or AI-ready capacity as workloads become more demanding. The second is geographic expansion: the footprint now stretches from major metros into regional and fintech-oriented edge sites such as Patna, Lucknow, and Ahmedabad, which broadens relevance for customers that need lower latency or policy comfort outside the largest campuses. The strongest public forward motion is in banking and regulated infrastructure, where the company explicitly sells compliance-first architecture, built-to-suit capacity, and resilience positioning. That creates upside, but it also creates concentration questions. Public references lean heavily on BFSI, BSE, and a small set of marquee enterprise testimonials, while exact customer count, top-account share, vertical ARR
    mix, and contract concentration remain undisclosed. So the right read-through is that land-and-expand is strategically plausible and geographically widening, but public evidence does not yet say whether expansion is broad-based or whether a few lighthouse regulated accounts dominate the revenue story.'
