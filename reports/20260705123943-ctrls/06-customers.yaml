- id: TU004
  title: Retention / repeat usage / satisfaction table
  columns:
  - Surface
  - Public signal
  - Positive read-through
  - Negative / adverse read-through
  - Support implication
  - Diligence ask
  rows:
  - - Official testimonials
    - Repeated emphasis on support, trust, delivery, and cost optimization
    - Customers appear to value operational execution, not just facility spec sheets
    - Because the source is company-authored, selection bias is unavoidable
    - High-touch support may be part of the product experience
    - Request reference calls, renewal history, and support model by segment
  - - Protean long-term-association quote
    - Explicit long-term relationship language
    - Suggests at least some repeat or durable usage exists
    - One quote does not establish broad retention behavior
    - Account management may matter for institutional customers
    - Request contract age distribution and multi-site expansion history
  - - BSE production proof
    - Mission-critical workload reference plus supportive executive quote
    - Very strong trust signal for operational reliability
    - A flagship account can overstate overall revenue quality if concentration is high
    - Likely requires premium support and governance discipline
    - Request share of revenue represented by marquee regulated accounts
  - - Gartner Peer Insights wrapper
    - Independent review surface exists, but fetched content is mostly disclaimer wrapper
    - Third-party review presence is better than none
    - Publicly retrieved content is too thin to underwrite sentiment
    - Independent satisfaction evidence remains incomplete
    - Request exportable review volume, rating trend, and segment mix
  - - Trustpilot
    - 3.7 / 5 average with limited public depth
    - Suggests some users are willing to leave public feedback
    - Average score and sparse context are not a strong endorsement
    - Customer experience may vary materially by engagement type
    - Request NPS/CSAT by product line and complaint-resolution data
  - - Retention metrics
    - No public NRR, GRR, churn, renewal, or contract-length disclosure
    - Gap is clearly observable rather than hidden
    - Durability cannot be underwritten from public materials
    - Management data, not web research, is required next
    - Request cohort retention, renewal rates, and contraction / expansion split
  notes: Independent review surfaces are much thinner than official testimonials, so this table separates real support signals from the still-missing renewal math.
