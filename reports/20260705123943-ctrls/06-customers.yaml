- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver / risk
  - Public evidence
  - Upside
  - Risk
  - Current visibility
  - Diligence path
  rows:
  - - Core hosting to disaster recovery
    - DR service page, customer testimonials, continuity messaging
    - One account can deepen spend without changing operators
    - Public sources do not quantify DR attach rate or renewal uplift
    - Partial
    - Request DR attach by primary-hosting cohort and renewal impact
  - - Core hosting to connectivity / cloud / AI capacity
    - Metro campus pages, DC3 launch, banking page, broader product surfaces
    - Supports land-and-expand from racks into higher-value adjacent services
    - Public record does not show realized cross-sell rates
    - Partial
    - Request revenue mix by colo, DR, cloud-connect, and AI-ready services
  - - Metro to edge geographic expansion
    - Patna, Lucknow, Ahmedabad, and Patna land-expansion materials
    - Could widen customer base into latency-sensitive regional demand
    - Edge economics and fill rates remain opaque
    - Low-medium
    - Request occupancy, logo pipeline, and expected payback by edge site
  - - BFSI compliance-led expansion
    - Secure banking page and RBI/SEBI compliance whitepaper
    - Regulatory intensity can raise switching costs and deepen account stickiness
    - Public evidence could over-represent one vertical if BFSI dominates the narrative
    - Partial
    - Request BFSI share of ARR, renewal, and pipeline by subsegment
  - - Lighthouse-account concentration
    - BSE and banking references dominate the strongest public proof
    - Marquee accounts can improve credibility and sales efficiency
    - A few flagship regulated accounts could mask concentration risk
    - Low
    - Request top-10 customers by ARR and largest-customer share
  - - Fortune 500 / hyperscaler mix opacity
    - 60+ Fortune 500 and 5-of-7-hyperscaler claims
    - Shows large-account relevance
    - Could include many small footprints instead of deep wallet share
    - Low
    - Request ACV distribution and active-revenue contribution of top enterprise cohorts
  - - Renewal durability
    - No public NRR, GRR, churn, or contract terms
    - None beyond testimonial trust language
    - Core underwriting question remains open
    - Very low
    - Request cohort retention, average contract term, and expansion / contraction waterfalls
  notes: The table separates visible expansion mechanisms from invisible revenue-quality math so public production proof is not mistaken for concentration clarity.
