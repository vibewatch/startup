  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: durability-gap
    missingEvidence: Net and gross revenue retention, logo churn, renewal cohorts, contract length, and expansion/contraction data by customer segment.
    whyItMatters: Without retention and contract data, public deployment proof cannot be translated into durable customer economics.
    diligencePath: Request cohort retention tables, renewal rates, average term length, and expansion-versus-contraction waterfalls split across BFSI, enterprise, and edge cohorts.
    relatedQuestionRefs:
    - QU016
    - QU025
    relatedTableRefs:
    - TU004
    - TU005
  - type: missing-source
    severity: material
    topic: concentration-risk
    missingEvidence: Top-10 customers by ARR, largest-customer share, and vertical mix across BFSI, hyperscaler, enterprise, and edge cohorts.
    whyItMatters: The public narrative leans heavily on regulated and flagship references, so concentration could be much higher or lower than the logo set suggests.
    diligencePath: Request customer concentration schedules, ACV bands, and revenue share by vertical before underwriting scale claims.
    relatedQuestionRefs:
    - QU017
    - QU023
    - QU025
    relatedTableRefs:
    - TU003
    - TU005
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof-table
    missingEvidence: A complete, dated public roster of named CtrlS customers tied to specific deployments and products.
    whyItMatters: The current named-customer table is built from retained testimonials and the BSE cluster, so it is useful but not exhaustive.
    diligencePath: Ask management for the current reference-customer list by vertical and confirm which logos are active, referenceable, and tied to which products.
    relatedQuestionRefs:
    - QU020
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: customer-count-gap
    missingEvidence: Exact current active-customer count, deployment mix across metros versus edge, and share of revenue from regulated customers.
    whyItMatters: Public account-quality signals and facility footprint do not reveal how broad the paying customer base actually is today.
    diligencePath: Request customer-count rollforwards, active logos by segment, and revenue mix across BFSI, enterprise, hyperscaler, startup, and edge cohorts.
    relatedQuestionRefs:
    - QU024
    relatedTableRefs:
    - TU001
    - TU002
