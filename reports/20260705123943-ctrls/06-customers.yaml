- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Scale / public proof
  - Strategic value
  - Gap
  rows:
  - - Regulated BFSI and capital-markets operators
    - CIO, infra, risk, and operations leaders buy; trading, payments, and compliance teams use; institution pays
    - Primary hosting, resilience, and compliance-sensitive infrastructure
    - Secure banking page, BSE production reference, UOB and BSE testimonials
    - Highest-credibility proof for mission-critical workloads
    - No disclosed ARR share, renewal rate, or top-account concentration
  - - Large enterprises and Fortune 500 accounts
    - Enterprise IT and infrastructure leaders buy; central IT and business applications use; enterprise budget pays
    - Colocation, disaster recovery, hybrid infrastructure
    - 60+ Fortune 500 claim, Reliance Power, Protean, Shriram Pistons, hospital and services references
    - Shows CtrlS sells beyond pure BFSI and beyond one facility product
    - No exact customer count by vertical or disclosed contract values
  - - Hyperscalers and cloud-adjacent operators
    - Platform and capacity planners buy; cloud and infrastructure teams use; large capex/opex budgets pay
    - Large campus capacity, interconnection, AI-ready scale
    - MIT interview says five of the top seven hyperscalers are customers; city pages repeatedly position hyperscale demand
    - Supports enterprise-quality reference set and future capacity absorption thesis
    - No named hyperscaler roster or utilization by campus
  - - Regional edge and latency-sensitive customers
    - Regional IT leaders, public-service operators, and local enterprises buy; local apps and users consume; regional budgets pay
    - Low-latency edge hosting in Patna and Lucknow plus future Ahmedabad
    - Patna, Lucknow, and Ahmedabad pages emphasize local digital transformation and fintech/enterprise use
    - Broadens customer reach beyond the top metros
    - Public evidence does not show active logo density or economics for edge sites
  - - Healthcare and business-continuity buyers
    - CIO and continuity owners buy; hospital and admin teams use; institution pays
    - Disaster recovery, continuity, and managed resilience
    - Rajiv Gandhi Cancer Institute and East Consultancy testimonials on DR page
    - Expands proof into uptime-sensitive non-financial workloads
    - Still testimonial-led rather than contract- or KPI-backed evidence
  - - Industrial and public-digital infrastructure buyers
    - Operations and enterprise IT leaders buy; line-of-business workloads use; corporate budget pays
    - Reliable hosting for enterprise-critical operations
    - Reliance Power, Shriram Pistons, and Protean testimonials across current pages
    - Shows CtrlS can win operationally demanding non-SaaS workloads
    - No public expansion history or revenue contribution by cohort
  notes: Segmentation is based on retained public proofs and facility/service pages; it is a map of visible customer archetypes, not a disclosed ARR segmentation.
