  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: serviceable-market-definition
    missingEvidence: A segmented view of CtrlS revenue or committed MW by hyperscale, BFSI, AI-ready, continuity, and edge workloads is not public.
    whyItMatters: Without segment mix, the chapter cannot convert national market growth into a defensible CtrlS SAM or judge how much of the broad TAM is actually reachable.
    diligencePath: Request customer-mix, committed MW, and revenue-by-service-line disclosures for the top metros and regulated verticals.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM001
    - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing-and-yield
    missingEvidence: No public source discloses CtrlS realized pricing, interconnect fees, managed-service attach rates, or contract tenure by workload segment.
    whyItMatters: Market growth only matters economically if pricing and attach rates support attractive yield on deployed MW.
    diligencePath: Request signed pricing examples, segment gross-margin bridges, and average contract term by hyperscale, BFSI, and continuity accounts.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM003
    - TM004
  - type: private-evidence-only
    severity: material
    topic: utilization-and-precommitment
    missingEvidence: Public materials do not show facility-level utilization, pre-leasing, or reserved-power commitments for the live and planned campuses.
    whyItMatters: A large TAM does not guarantee monetization if live capacity is underutilized or future capacity lacks committed demand.
    diligencePath: Request utilization, pre-commitment, and customer concentration by campus and metro, plus pipeline timing assumptions.
    relatedQuestionRefs:
    - QM024
    - QM025
    relatedTableRefs:
    - TM002
    - TM004
