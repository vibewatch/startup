- id: buyers-and-workloads
  title: Buyer Segments, Workloads, and Budget Ownership
  body: The public evidence points to at least four practical buyer groupings. First are hyperscalers and cloud-region builders, whose decisions are dominated by power-ready campuses, execution speed, and ecosystem support. Second are regulated BFSI and market-infrastructure buyers, where uptime, compliance, and continuity matter more than lowest-cost compute; CtrlS banking materials and the BSE proof point both support this segment strongly. Third are enterprise AI and HPC workloads, where the user may be a platform or ML team but the budget owner can expand into CIO, CTO, or procurement functions as deployments move from experiments to production. Fourth are continuity and disaster-recovery accounts that buy for resilience rather than pure growth. Across those groups, the end user is often technical, but the payer broadens as workloads become more mission-critical. That matters for CtrlS because solution pages and whitepapers suggest the company is selling bundles of power, resilience,
    compliance, and connectivity rather than a single commodity rack product.
  claimRefs:
  - CM013
  - CM014
  - CM015
  - CM016
  - CM020
  - CM043
  - CM047
