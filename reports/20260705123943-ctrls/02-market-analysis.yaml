callouts:
- calloutType: insight
  title: The usable market is narrower than the headline TAM
  body: India market-growth numbers are real, but CtrlS can only monetize the subset that needs third-party, in-country, resilient hosting and related services. That is why boundary discipline matters more than repeating one giant TAM.
  claimRefs:
  - CM003
  - CM004
  - CM011
  - CM038
  - CM045
- calloutType: strength
  title: CtrlS is already positioned inside the highest-priority demand zones
  body: Third-party sources point to Mumbai, Hyderabad, Chennai, and other major metros as the main gravity centers, and CtrlS already operates in several of those markets while carrying regulated-workload proof from banking and BSE use cases.
  claimRefs:
  - CM014
  - CM015
  - CM017
  - CM035
  - CM036
  - CM037
- calloutType: risk
  title: Execution and power bottlenecks may matter more than demand shortage
  body: The adverse read-through from Accenture and from CtrlS own whitepapers is that growth alone does not decide winners. Power readiness, compliance execution, and disciplined deployment of dense AI capacity can still cap returns.
  claimRefs:
  - CM021
  - CM023
  - CM024
  - CM041
  - CM046
