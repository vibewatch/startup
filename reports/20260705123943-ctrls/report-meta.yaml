  topStrengths:
    - India's largest domestic Rated-4 data-center network with 19 sites and more than 370 MW of live capacity
    - Strong demand alignment with hyperscalers, regulated enterprises, and AI-led infrastructure growth
    - June 2026 CPP Investments partnership provides real external price discovery and capital for the next campus cycle
    - Visible renewable-energy and power-readiness strategy improves credibility for hyperscale and AI workloads
  topRisks:
    - Audited revenue, leverage, utilization, and customer concentration remain materially undisclosed
    - Execution risk is high because the company is expanding capacity much faster than its public disclosures explain asset turns
    - Competition from STT, NTT, Yotta, Nxtra, AdaniConneX, Equinix, and other well-capitalized operators could pressure pricing and occupancy
    - Power availability, land, permitting, and regulatory shifts can delay or dilute returns on new campuses
  unresolvedGaps:
