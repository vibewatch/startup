      role: Founder, CEO, and Chairman
      background: First-generation Indian entrepreneur who built CtrlS and related cloud and infrastructure businesses around enterprise hosting, cloud, and green-energy themes.
      claimRefs: [CO002]
  foundingLocation: Hyderabad, India
  headquarters: Hyderabad, India
  productSummary: Hyperscale and enterprise data-center infrastructure spanning colocation, connectivity, managed services, disaster recovery, private cloud, GPU-ready infrastructure, and related interconnection services.
  customerFocus: Hyperscalers, BFSI institutions, telecom and IT or ITeS enterprises, and other businesses that require resilient mission-critical infrastructure.
  businessModel: Multi-year infrastructure revenue from hyperscale campuses, enterprise colocation, managed services, disaster recovery, cloud infrastructure, and premium connectivity or interconnection products.
