- id: gtm-and-unit-economics-proxies
  title: GTM motion and public unit-economics proxies
  body: 'Public evidence points to a classic enterprise-infrastructure go-to-market motion. CtrlS talks about migration support, legacy upgrades, platform moves, uptime commitments, and solution design more than it talks about frictionless self-serve onboarding. Named references such as Reliance Power, Flitpay, BFIL, UOB, and Protean reinforce that the business wins and keeps customers through credibility, engineering support, and long-lived operational relationships. That is useful context because it suggests revenue durability may be stronger than a pure spot-market hosting business, but it also means customer acquisition cost, payback, and contract duration matter more than they would in a low-touch SaaS model. Those metrics are not public. The public unit-economics view is therefore thin: revenue seems to be growing at roughly 16%, net margins remain slightly negative, leverage exists, and utilization is undisclosed. That is directionally informative but not enough to test operating
    leverage with confidence.'
