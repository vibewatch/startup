- id: capital-adequacy-and-funding-dependency
  title: Capital adequacy, debt visibility, and funding dependency
  body: 'Capital intensity is where CtrlS’s financial story becomes both strongest and most uncertain. The June 2026 CPP package is large and well corroborated: ₹7,000 crore total, split between ₹4,000 crore for an 8.2% stake and ₹3,000 crore for a new hyperscale-campus JV. That is meaningful institutional validation. But the same public record also shows heavy debt usage. Registry-derived sources report ₹4,181 crore of open charges, repeated 2025 facility activity, and multiple lenders. Meanwhile, site-level disclosures show how quickly capital can be consumed: Mumbai alone has 300 MW of grid power with a path to 700 MW, Noida is moving 60% of annual power to solar, and GreenVolt is linked to a >1 GW renewable plan by 2030. The conclusion is not that CtrlS lacks access to capital. It is that growth appears financed through an ongoing mix of equity, debt, and power-linked infrastructure spending, so funding dependency remains a live diligence issue.'
