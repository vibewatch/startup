- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Impact on underwriting
  - Current public status
  - Exact diligence path
  rows:
  - - Audited financial statements and cash-flow statement
    - Blocking — no solid base case for revenue quality, margin path, or runway
    - No audited public financial pack located
    - Request audited FY2024-FY2025 financials plus current YTD management accounts
  - - Realized pricing and discount waterfalls
    - Material — list prices may materially overstate net revenue capture
    - Only base cloud list pricing is public
    - Request booked-vs-list pricing by SKU and top-customer contract examples
  - - Customer concentration and revenue mix
    - Material — hyperscaler concentration could dominate downside risk
    - No public top-customer or segment revenue split
    - Request top-10 customers by revenue, segment mix, and renewal history
  - - Occupancy / utilization by campus and service line
    - Material — operating leverage cannot be tested without fill rates
    - No public occupancy or utilization schedule found
    - Request site-level occupancy, power utilization, and sold-versus-installed capacity
  - - Cash, burn, and runway
    - Blocking — financing dependency cannot be judged from commitments alone
    - No public treasury or burn disclosure found
    - Request monthly cash-flow statement, current cash balance, and 24-month forecast
  - - Debt maturity, covenants, and project-finance terms
    - Material — charges do not reveal refinancing or covenant risk
    - Charge amounts visible, but detailed terms are not
    - Request facility-by-facility debt memo with maturity, pricing, security, and covenant data
  notes: These are the minimum diligence asks needed to convert the public story from directional to underwriteable.
