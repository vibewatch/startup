tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Monetization mechanism
  - Unit / contract
  - Public status
  - Revenue quality
  - Diligence ask
  rows:
  - - Colocation
    - Rack, cage, dedicated hall, or dedicated building contracts
    - Monthly recurring enterprise contract
    - Active, but page uses legacy scale figures
    - Medium — real business, but public collateral is partly stale
    - Request realized rack pricing, density, occupancy, and contract tenor by site
  - - Infrastructure as a Service
    - Managed virtual machines and infra templates
    - Usage-based plus subscription / MRC
    - List-priced on rate card and IaaS page
    - Medium-high for base SKU visibility; low for realized price
    - Request booked price versus list, usage mix, and support attach rate
  - - Private cloud
    - Customized dedicated private environment
    - Annual or multi-year negotiated contract
    - Active, but custom quoted
    - Medium — strong evidence of product, weak evidence of monetization
    - Request ACV, implementation fees, and renewal profile
  - - GPU Private Cloud
    - Dedicated GPU clusters and managed AI infrastructure
    - Per-minute billing plus negotiated dedicated-node spend
    - Active, but no public rate card
    - Low-medium — product is visible, realized unit economics are not
    - Request GPU-hour gross margin, utilization, and reserved-commitment mix
  - - Cloud connectivity / interconnect
    - Dedicated Google and Oracle connectivity plus peering
    - Monthly port or service plan
    - Active and commercially positioned
    - Medium — attach model is clear, price capture is not
    - Request attach rates, port-speed mix, and churn impact
  - - Business continuity / DR
    - Resiliency, DR, and continuity services around hosted workloads
    - Solution-led contract with SLA exposure
    - Active, pricing not public
    - Low — likely sticky, but economics are opaque
    - Request ARR share, SLA penalties, and recovery-test cadence
  - - Cloud optimize / managed services
    - FinOps, software optimization, security, and hybrid-cloud advisory
    - Retainer, project, or bundled service
    - Active, pricing not public
    - Low — visible upsell path, unknown margin
    - Request service margin, attach rates, and renewal patterns
  notes: List pricing exists for standardized cloud units, but most higher-value services appear negotiated or bundled, so realized revenue mix cannot be read directly from public pages.
