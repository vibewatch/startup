  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: audited-financials
    missingEvidence: Audited P&L, balance sheet, cash-flow statement, and revenue-recognition schedule for FY2024-FY2025 plus current YTD.
    whyItMatters: Without audited financials, public revenue ranges and margin proxies cannot be reconciled into a reliable underwriting base case.
    diligencePath: Request audited financial statements and the latest management accounts with revenue-recognition policy notes.
    relatedQuestionRefs:
    - QI008
    - QI010
    - QI024
    - QI026
    relatedTableRefs:
    - TI003
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: pricing-realization
    missingEvidence: Realized pricing waterfall by SKU, discount band, and managed-services attach rate versus published list prices.
    whyItMatters: List pricing can materially overstate realized revenue quality and gross margin if large enterprise contracts are heavily discounted or bundled.
    diligencePath: Request last-12-month booked price versus list price by SKU, including top-customer contract examples and renewal terms.
    relatedQuestionRefs:
    - QI002
    - QI003
    - QI023
    relatedTableRefs:
    - TI002
    - TI005
  - type: private-evidence-only
    severity: material
    topic: customer-concentration-utilization
    missingEvidence: Top-10 revenue concentration, campus occupancy, utilization by service line, and renewal/churn cohorts.
    whyItMatters: Data-center operating leverage depends on utilization, while concentration determines downside risk if a hyperscaler or large enterprise account pauses growth.
    diligencePath: Request site-level occupancy/utilization pack and customer concentration schedule with renewal history.
    relatedQuestionRefs:
    - QI006
    - QI018
    - QI019
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway
    missingEvidence: Current cash balance, monthly burn, debt service obligations, and runway forecast.
    whyItMatters: The company is visibly capital-intensive; without treasury and burn data, it is impossible to judge whether equity plus debt is comfortably ahead of build commitments.
    diligencePath: Request monthly cash-flow statements for the last 12 months, current bank balances, and internal 24-month cash forecast.
    relatedQuestionRefs:
    - QI015
    - QI024
    - QI028
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: debt-terms
    missingEvidence: Debt maturity ladder, interest cost, covenant package, collateral structure, and project-finance terms by facility.
    whyItMatters: Charge amounts alone do not reveal refinancing pressure, covenant headroom, or whether cash flows can be trapped at project or subsidiary level.
    diligencePath: Request lender summary by facility plus charge documents or a debt memo covering maturity, pricing, covenant, and security details.
    relatedQuestionRefs:
    - QI011
    - QI025
    relatedTableRefs:
    - TI004
    - TI005
