callouts:
- calloutType: strength
  title: Rare public list pricing creates a better starting point than most private infrastructure assets
  body: The cloud rate card gives a concrete starting point for compute, storage, and security pricing, which is unusual for a private data-center operator. That anchor improves diligence efficiency even though realized pricing remains opaque.
  claimRefs:
  - CI002
  - CI003
  - CI004
  - CI005
  - CI006
- calloutType: risk
  title: CPP improves capacity to invest but does not remove funding dependency
  body: Open charges, repeated lender activity, and power-heavy build plans mean the 2026 equity-plus-JV package should be read as acceleration capital, not as the end of external financing needs.
  claimRefs:
  - CI037
  - CI039
  - CI046
  - CI048
  - CI051
  - CI055
- calloutType: assumption
  title: Revenue quality remains directional rather than audited
  body: Public sources support a broad FY2025 revenue range and slight net losses, but the absence of audited statements, revenue mix, and realized-price data means any precise model built from public evidence alone would be overconfident.
