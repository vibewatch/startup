- id: public-traction-and-disclosure-uncertainty
  title: Public traction, growth proxies, and disclosure uncertainty
  body: 'The strongest public financial signal is that CtrlS is not a subscale operator. Third-party sources converge on more than ₹1,000 crore of FY2025 revenue and around 16% recent growth, even though they do not agree closely enough to serve as an audited number. Profitability proxies are also directionally consistent: net margins remain modestly negative, suggesting the company is still absorbing the cost of expansion despite significant scale. Just as important, the public information estate is uneven. The current CPP release cites 19 data centers and more than 370 MW of live capacity, while the legacy colocation page still talks about 15 data centers and 275 MW. That mismatch does not disprove the larger figure, but it does signal that commercial materials are refreshed at different speeds. For a financial chapter, that means public data is useful as a directional range, not as a clean model-ready ledger.'
