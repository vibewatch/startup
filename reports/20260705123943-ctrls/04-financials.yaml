  rows:
  - - FY2025 revenue proxy
    - ₹1,000-1,750 crore
    - Medium — multiple third-party proxies, no audited reconciliation
    - Sets top-line base for valuation and leverage analysis
    - Request audited revenue bridge and segment mix for FY2025
  - - Recent revenue growth
    - ~16.0-16.64% in 2025 proxies
    - Medium — directional agreement across vendors
    - Tests whether growth is sustaining fast enough to absorb capex
    - Request monthly revenue trend and new-versus-expansion split
  - - Net profit margin
    - -2.61% to -2.68%
    - Medium — consistent across EMIS and Tofler
    - Shows scale has not yet translated into clearly positive net profitability
    - Request audited net margin and EBITDA reconciliation
  - - Debt / equity
    - ~0.21-0.23x proxy
    - Medium — ratio format differs but direction matches
    - Indicates leverage is present even after equity inflows
    - Request lender pack and post-CPP leverage model
  - - Open charges
    - ₹4,181 crore
    - Medium — registry-derived, but not full debt economics
    - Signals meaningful bank/project-finance dependence
    - Request outstanding principal, maturity, and interest schedule
  - - Occupancy / utilization
    - Not publicly disclosed
    - Unknown
    - Operating leverage depends on fill rates by site and SKU
    - Request site-level occupancy and utilization by service line
  - - Gross margin by stream
    - Not publicly disclosed
    - Unknown
    - Margin path cannot be modeled without stream-level COGS
    - Request gross margin split across colocation, cloud, connectivity, and services
  - - CAC / payback
    - Not publicly disclosed
    - Unknown
    - Sales efficiency determines how much external capital growth will keep consuming
    - Request CAC, payback, and pipeline conversion by segment
  notes: Public unit-economics evidence is strongest on revenue direction, leverage proxies, and slight net-loss status; the most important operating drivers remain private.
