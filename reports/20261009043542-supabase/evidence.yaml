evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-performance
    missingEvidence: >-
      Company-issued revenue, ARR, gross margin, cash burn, runway, net retention, customer count, and
      customer-concentration schedules.
    whyItMatters: >-
      Usage growth and funding raised cannot establish monetization quality, capital efficiency, retention, or cash
      available.
    diligencePath: >-
      Obtain CFO-certified monthly financials, bank balances, ARR bridge, cohort retention, gross-margin analysis, and
      top-customer schedules.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: Complete executive, statutory-director, board-observer, ownership, and investor-rights records.
    whyItMatters: >-
      The public founder roster and partial investor list do not establish control, succession resilience, or
      reserved-matter rights.
    diligencePath: >-
      Review the current cap table, charter, bylaws, voting agreements, board minutes, investor rights, and executive
      succession plan.
    relatedQuestionRefs:
      - QO002
      - QO003
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: corporate-scale
    missingEvidence: A reconciled financing ledger, dated payroll roster, legal-entity chart, and principal-office documentation.
    whyItMatters: >-
      Public totals differ by scope and definition, preventing reliable use of cumulative funding, exact headcount, or
      headquarters as cover facts.
    diligencePath: >-
      Reconcile signed financing documents and secondary proceeds, then match payroll and entity records to management's
      current operating presentation.
    relatedQuestionRefs:
      - QO006
      - QO007
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: enterprise-revenue-and-contract-metrics
    missingEvidence: >-
      Audited financial breakdown of Supabase Annual Recurring Revenue (ARR), net retention rate, and enterprise
      customer contract distribution.
    whyItMatters: >-
      Without segmented enterprise ARR and retention metrics, valuation multiples cannot be isolated between hobbyist
      developers and committed enterprise contracts.
    diligencePath: >-
      Request audited revenue composition, cohort net dollar retention figures, and ACV distribution under
      non-disclosure agreement during management diligence.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: enterprise-churn-and-high-scale-egress
    missingEvidence: Audited cohort retention and egress expenditure data for enterprise workloads exceeding 10M monthly active users.
    whyItMatters: >-
      Without empirical enterprise cohort data, the rate at which scaled customers migrate off Supabase to hyperscale
      AWS due to compute and bandwidth pricing remains unverified.
    diligencePath: >-
      Request customer cohort net retention and gross margin breakdowns by tier during technical and financial
      diligence.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current unrestricted cash, monthly cash burn, debt, capex, infrastructure commitments, acquisition consideration,
      and primary-versus-secondary financing proceeds.
    whyItMatters: Announced funding cannot establish liquidity or runway without uses of funds and current obligations.
    diligencePath: >-
      Request bank statements, cash-flow forecasts, debt schedules, financing closing statements, and the Turso purchase
      agreement under NDA.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: >-
      Revenue by tier and product, realized pricing, discounting, revenue-recognition policy, paid conversion, NRR, GRR,
      churn, and customer concentration.
    whyItMatters: >-
      These inputs determine whether rapid user and database growth produces durable recurring revenue and attractive
      unit economics.
    diligencePath: >-
      Request audited financials, the ARR and GAAP revenue bridge, billing extracts, executed contracts, and cohort
      retention schedules.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: production-reliability
    missingEvidence: >-
      Workload-specific latency, saturation, uptime, incident, failover, recovery-time, recovery-point, and
      local-to-hosted parity results.
    whyItMatters: >-
      Feature availability and an announced scaling tool do not establish reliability for a buyer's production workload
      or self-hosted topology.
    diligencePath: >-
      Run a representative load and chaos test; review twelve months of incident history, service-level attainment,
      backup restore tests, and architecture-specific limits.
    relatedQuestionRefs:
      - QE007
  - type: private-evidence-only
    severity: material
    topic: retention-durability
    missingEvidence: >-
      NRR, GRR, logo and revenue churn, renewal rates, contract duration, cohort retention, satisfaction, and
      support-escalation data by plan.
    whyItMatters: Public adoption counts cannot establish whether customers remain, expand, or generate durable recurring revenue.
    diligencePath: >-
      Obtain monthly customer and revenue cohorts for at least 24 months, reconcile them to billing records, and conduct
      reference calls across self-serve, Team, and Enterprise cohorts.
    relatedQuestionRefs:
      - QU004
  - type: private-evidence-only
    severity: material
    topic: expansion-concentration
    missingEvidence: >-
      Paid conversion, expansion revenue, product and plan mix, top-10 customer revenue share, channel economics,
      procurement cycle, and customer-level contract values.
    whyItMatters: >-
      The available developer, launch, and domain metrics do not reveal monetization quality, concentration exposure, or
      procurement friction.
    diligencePath: >-
      Review the customer-level ARR bridge, plan transitions, channel-sourced bookings, top-customer contracts, pipeline
      aging, and procurement loss reasons with finance and sales leadership.
    relatedQuestionRefs:
      - QU005
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof
    missingEvidence: >-
      A complete current customer roster with deployment status, workload scope, contract start date, renewal history,
      and independently referenceable outcomes.
    whyItMatters: >-
      The public reference sample may overrepresent successful deployments and cannot establish the quality of the full
      customer portfolio.
    diligencePath: >-
      Sample references across company size, geography, plan, tenure, and use case, including churned and downsold
      customers.
    relatedTableRefs:
      - TU003
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-legal-register
    missingEvidence: >-
      An exhaustive inventory of litigation, regulator inquiries, certification scope, privacy incidents, and
      contractual exceptions.
    whyItMatters: >-
      The public pool supports key themes but cannot establish the complete legal and regulatory population or prove the
      absence of other matters.
    diligencePath: >-
      Obtain counsel's schedule, current audit reports, certification scope, DPA package, incident register, and
      regulator correspondence.
    relatedQuestionRefs:
      - QR002
      - QR003
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: data-exposure
    missingEvidence: >-
      UpGuard methodology, scanned-project denominator, severity distribution, root-cause analysis, and Supabase
      remediation timing.
    whyItMatters: >-
      A count of exposed databases does not reveal incidence, platform causality, records affected, or whether controls
      are improving.
    diligencePath: >-
      Request the UpGuard dataset and Supabase's matched incident analysis, notification logs, default-control changes,
      and repeat-exposure trend.
    relatedQuestionRefs:
      - QR001
      - QR008
  - type: private-evidence-only
    severity: material
    topic: operational-resilience
    missingEvidence: >-
      Audited uptime, incident frequency, RPO/RTO attainment, primary saturation thresholds, recovery tests, and
      escalation performance.
    whyItMatters: >-
      Architecture descriptions and reviews identify failure modes but do not quantify production reliability or
      recovery maturity.
    diligencePath: >-
      Review incident exports, disaster-recovery tests, capacity dashboards, priority-one records, and target-workload
      benchmarks.
    relatedQuestionRefs:
      - QR004
      - QR005
  - type: private-evidence-only
    severity: material
    topic: partner-concentration
    missingEvidence: >-
      Spend and workload concentration, contractual SLAs, substitution rights, correlated-failure analysis, and tested
      exit plans.
    whyItMatters: >-
      A subprocessor list establishes dependency breadth but not concentration, replaceability, bargaining power, or
      recovery exposure.
    diligencePath: >-
      Obtain vendor spend and workload shares, material contracts, continuity tests, portability evidence, and
      replacement lead times.
    relatedQuestionRefs:
      - QR006
    relatedTableRefs:
      - TR003
  - type: missing-source
    severity: material
    topic: financial-model-risk
    missingEvidence: >-
      Audited revenue or ARR, gross margin, burn, cash, retention, AI-origin conversion, workload activity, and
      financing terms.
    whyItMatters: >-
      Funding raised and launch growth do not establish cash availability, recurring revenue quality, unit economics, or
      valuation support.
    diligencePath: >-
      Review financials, bank statements, cap table, cohort data, paid conversion, churn, gross margin, and cash
      forecast.
    relatedQuestionRefs:
      - QR007
      - QR008
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: operating-economics
    missingEvidence: >-
      Audited ARR and recognized revenue, gross margin by workload, net revenue retention, cohort conversion, customer
      concentration, burn, and cash.
    whyItMatters: >-
      Usage growth cannot establish revenue quality, margin durability, financing runway, or an investable revenue
      multiple.
    diligencePath: >-
      Obtain audited financials, monthly management accounts, billing exports, cohort retention tables, cloud-cost
      allocations, and bank statements.
    relatedQuestionRefs:
      - QV002
      - QV004
      - QV005
      - QV006
  - type: conflicting-data
    severity: material
    topic: funding
    missingEvidence: >-
      A reconciled financing schedule that explains provider differences in total capital raised, round dates, class
      labels, and primary versus secondary proceeds.
    whyItMatters: >-
      Funding raised is not cash available, and provider totals cannot replace the issuer's capitalization and cash
      records.
    diligencePath: >-
      Reconcile signed financing documents, bank receipts, secondary-sale schedules, and the fully diluted
      capitalization table.
    relatedQuestionRefs:
      - QV003
      - QV008
  - type: private-evidence-only
    severity: material
    topic: preference-terms
    missingEvidence: >-
      Complete preference waterfall, seniority, participation, anti-dilution, option-pool, warrant, and
      secondary-transfer terms for every security class.
    whyItMatters: Headline post-money valuation does not establish common-equivalent entry economics or downside recovery.
    diligencePath: >-
      Review the charter, stock purchase agreements, investor rights agreements, cap table, option ledger, and a
      scenario-tested waterfall.
    relatedQuestionRefs:
      - QV002
      - QV008
  - type: missing-source
    severity: material
    topic: valuation-method
    missingEvidence: >-
      Comparable-company revenue metrics and multiples, relevant M&A terms, target-return assumptions, and a supportable
      exit-timing range.
    whyItMatters: Private financing marks alone do not establish intrinsic value, expected return, or downside magnitude.
    diligencePath: >-
      Build a date-matched infrastructure-software comparable set after receiving normalized revenue, growth, margin,
      and retention metrics.
    relatedQuestionRefs:
      - QV004
      - QV005
      - QV007
  - type: private-evidence-only
    severity: material
    topic: acquisition
    missingEvidence: >-
      Turso purchase price, form of consideration, earn-outs, retention grants, closing conditions, integration budget,
      and acquired revenue and costs.
    whyItMatters: >-
      The transaction's dilution, cash use, integration burden, and valuation cannot be assessed from the financing
      announcement.
    diligencePath: >-
      Review the signed acquisition agreement, board materials, purchase-price allocation, integration plan, and
      post-close operating forecast.
    relatedQuestionRefs:
      - QV004
      - QV006
      - QV008
