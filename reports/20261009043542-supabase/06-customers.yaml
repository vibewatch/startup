schemaVersion: "report-v2"
artifact: customers
slug: supabase
runDate: 2026-10-09
company:
  name: Supabase
chapter:
  number: 6
  title: Customers
  summary: >-
    Supabase shows broad developer and project adoption, with an independent
    technology-detection dataset finding 19,361 domains and company-issued
    stories describing scaled deployments at Lovable, eXp Realty, Phoenix
    Energy, and Chatbase. The public record is much weaker on commercial
    durability: paid conversion, NRR, GRR, churn, contract length, expansion,
    and customer concentration remain undisclosed.
sections:
  - id: customer-base-segmentation
    title: A self-serve core with a project-level enterprise tail
    body: >-
      The clearest independent segmentation signal is a web-technology dataset,
      not a customer ledger. TechnologyChecker detected Supabase on 19,361
      domains in its August 2026 reading and matched 12,450 of those domains to
      company records. Within the employee-resolved subset, 69.4% belonged to
      organizations with 1-10 employees, indicating a large long tail of
      founders, small teams, and agency-built projects. The same dataset found a
      broad geographic and vertical spread, while warning that recognizable
      enterprises commonly appeared on a single community site, portal, or
      microsite. The likely buyer therefore ranges from an individual developer
      to a departmental innovation lead; the end user may be a developer, an
      internal builder, or an app's customer, and the budget owner is not
      observable from public detections.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU007]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Strong adoption signals, but incompatible denominators
    body: >-
      Adoption appears substantial across two different lenses that must not be
      combined into a single funnel. TechnologyChecker's 19,361-domain reading
      measures detectable web implementations and explicitly attributes much
      of the apparent monthly increase to wider signal coverage, not platform
      growth. TechCrunch separately reported Supabase's company claim of nearly
      10 million developers and more than 600% year-over-year growth in database
      launches, with more than 60% of launches initiated by an AI tool. Domains,
      matched organizations, developers, and database launches are different
      populations; none reveals active paid accounts, utilization, revenue, or
      retention. Vercel co-occurrence and Supabase's code-first agent tooling
      nevertheless suggest that frontend platforms and AI builders are
      important adoption surfaces.
    claimRefs: [CU001, CU002, CU006, CU013, CU014, CU015]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: named-customer-proof
    title: Named references demonstrate production use, not portfolio quality
    body: >-
      Supabase's homepage provides concrete but company-curated reference
      points. It says Lovable powers millions of AI-generated apps with
      Supabase, eXp Realty enables more than 2,000 employees to build production
      software, Phoenix Energy migrated critical infrastructure from MongoDB
      with zero downtime, and Chatbase scaled its own business to $10 million of
      ARR on one Postgres-backed platform. TechCrunch independently names
      Lovable among products choosing Supabase, strengthening identification but
      not auditing Supabase's claimed scale or customer outcomes. These examples
      show varied use cases and credible production intent; they do not disclose
      contract value, tenure, renewal behavior, support burden, or what share of
      each customer's stack and workload Supabase serves.
    claimRefs: [CU008, CU009, CU010, CU011, CU012]
    tableRefs: [TU003]
  - id: durability-expansion-and-concentration
    title: Commercial durability remains the decisive evidence gap
    body: >-
      Public evidence does not support a retention or concentration conclusion.
      No assigned source reports NRR, GRR, logo or revenue churn, cohort
      retention, renewal rates, average contract length, expansion revenue, paid
      conversion, customer acquisition cost, or top-customer revenue share.
      Competitor-authored comparisons identify genuine adoption friction around
      SQL expertise, setup, debugging, scaling costs, and workload fit, but those
      sources have commercial incentives and cannot quantify realized churn.
      The investment case should therefore treat broad adoption and strong named
      references as top-of-funnel and production proof, not as evidence of
      durable monetization. Closing this gap requires private cohort schedules,
      customer-level revenue concentration, renewal data, and reference calls
      spanning self-serve, Team, and Enterprise customers.
    claimRefs: [CU016]
callouts:
  - calloutType: strength
    title: Breadth is visible across company size, geography, and use case
    body: >-
      Independent domain detections and named customer stories jointly indicate
      adoption from very small companies through departmental enterprise
      projects, but neither source set measures paid accounts.
    claimRefs: [CU003, CU004, CU008, CU010, CU011, CU012]
  - calloutType: risk
    title: Adoption is not retention
    body: >-
      Public developer, launch, and domain counts use incompatible denominators
      and leave paid conversion, renewal, expansion, and concentration unknown.
    claimRefs: [CU001, CU013, CU014]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Primary use case
      - Public scale signal
      - Revenue or strategic value
      - Evidence gap
    rows:
      - - Founders and very small teams
        - "Buyer: founder or engineering lead; user: developer; payer: company or individual"
        - Rapidly assemble a Postgres-backed application with integrated backend services
        - "69.4% of 11,803 employee-resolved detected domains were tied to 1-10 employee organizations"
        - Large self-serve acquisition pool; paid conversion is undisclosed
        - No plan mix, paid-account count, ARPA, or cohort retention
      - - Agencies and SMB project teams
        - "Buyer: agency or project owner; user: builder and operator; payer: SMB or client"
        - Build portals, commerce, community, and internal applications
        - Retail, real estate, construction, and advertising each appear in the broad detected mix
        - Extends distribution beyond a developer-tools audience
        - Detection cannot identify procurement owner, contract size, or active usage
      - - Enterprise innovation teams
        - "Buyer: team lead or innovation executive; user: internal builder; payer: department or enterprise"
        - Departmental production software, community sites, portals, and migrations
        - Recognizable enterprises often appear on one subdomain rather than across the estate
        - Provides enterprise references without proving organization-wide standardization
        - Deployment breadth, renewal term, support load, and expansion are undisclosed
      - - AI app builders and their ecosystems
        - "Buyer: platform engineering; user: AI agent or app builder; payer: platform or downstream customer"
        - Provision database, auth, storage, and application services from generated code
        - Supabase says Lovable powers millions of AI-generated apps; TechCrunch reports AI tools initiated over 60% of launches
        - High-volume channel and ecosystem leverage if usage converts and persists
        - Active-to-paid conversion, channel economics, and end-app survival are unknown
    notes: >-
      Segments synthesize TechnologyChecker detections and company-issued
      customer examples; domain detections are not accounts, contracts, or
      company-wide deployments, and revenue contribution is not disclosed.
    claimRefs: [CU002, CU003, CU004, CU005, CU007, CU008, CU014]
  - id: TU002
    title: Customer growth and adoption trajectory table
    columns:
      - Metric
      - Value
      - Period
      - Source and confidence
      - Implication
      - Missing denominator or qualification
    rows:
      - - Detected domains
        - "19,361"
        - "2026-08-31"
        - "TechnologyChecker; medium"
        - Broad observable deployment footprint
        - Crawl-based detections; one clause can match a badge and one domain may be only a microsite
      - - Domains matched to a company record
        - "12,450"
        - "2026-08-31"
        - "TechnologyChecker; medium"
        - Enables directional size, geography, and industry segmentation
        - Only 64.3% of detected domains; not a customer-account count
      - - Developers
        - Nearly 10 million
        - "2026-06-05"
        - "TechCrunch reporting a company claim; medium"
        - Large developer reach and awareness
        - Definition, activity window, paid share, and duplicate-account treatment undisclosed
      - - Database launch growth
        - More than 600% year over year
        - "2026-06-05"
        - "TechCrunch reporting a company claim; medium"
        - Rapid project creation
        - Launches are not active databases, retained customers, or revenue
      - - AI-tool share of launches
        - More than 60%
        - "2026-06-05"
        - "TechCrunch reporting a company claim; medium"
        - AI builders are a major acquisition channel
        - Tool attribution method and downstream project survival are undisclosed
    notes: >-
      Metrics use different populations and cannot be treated as a conversion
      funnel. TechnologyChecker warns that its short-series growth reflects
      widened signal coverage; TechCrunch attributes developer and launch
      figures to Supabase.
    claimRefs: [CU001, CU002, CU013, CU014]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment / use case
      - Production versus pilot
      - Reported outcome
      - Limitation
    rows:
      - - Lovable
        - AI application builder
        - Complete backend for AI-generated applications
        - Public customer story; production status implied but not independently audited
        - Supabase says it powers millions of AI-generated apps; TechCrunch names Lovable as a Supabase user
        - No contract value, cohort retention, workload share, or independently verified scale
      - - eXp Realty
        - Enterprise innovation workforce
        - Employee-built production software supported by AI-assisted development
        - Company page explicitly describes production software
        - More than 2,000 employees enabled to build production software
        - Company-issued claim with no deployment count, usage, or renewal data
      - - Phoenix Energy
        - Energy enterprise
        - Migration of critical infrastructure from MongoDB
        - Company page describes critical infrastructure rather than a pilot
        - Zero-downtime migration claimed
        - No workload size, post-migration performance, contract value, or independent customer announcement
      - - Chatbase
        - AI software startup
        - Consolidated application on one Postgres-backed platform
        - Public customer story indicates scaled production use
        - Customer says its own business reached $10 million ARR on the platform
        - The ARR belongs to Chatbase, not Supabase; no spend, tenure, or renewal data
    notes: >-
      This is a partial sample of references present in the assigned sources, not
      a complete customer roster. Outcomes are company-issued unless explicitly
      noted; customer ARR is not Supabase revenue.
    enumerationScope:
      coverage: sample
      basis: >-
        Named references visible on Supabase's homepage as fetched on 2026-10-09,
        supplemented only where the assigned TechCrunch source names the same user.
    claimRefs: [CU008, CU009, CU010, CU011, CU012]
figures:
  - id: FU001
    title: Customer adoption surfaces and expansion loop
    type: journey-map
    summary: >-
      Supabase can enter through developers, AI builders, or project teams and
      expand toward production operations, but public evidence does not quantify
      conversion or retention between stages.
    data:
      nodes:
        - id: discover
          label: Discover
          detail: Developers, founders, agencies, and AI builders encounter an integrated Postgres backend.
          touchpoints:
            - Open-source community
            - Templates and app builders
        - id: prototype
          label: Prototype
          detail: A project combines database, authentication, storage, realtime, and APIs.
          touchpoints:
            - Dashboard
            - Client libraries
        - id: integrate
          label: Integrate
          detail: The backend is paired with application hosts and frontend frameworks.
          touchpoints:
            - Vercel and Next.js
            - Generated application code
        - id: deploy
          label: Deploy
          detail: A team moves a portal, application, or internal workflow into production.
          touchpoints:
            - Departmental project
            - Customer application
        - id: operate
          label: Operate
          detail: Code-first configuration and agent checks support ongoing project operations.
          touchpoints:
            - Health and security checks
            - Logs and advisors
        - id: expand
          label: Expand
          detail: A successful project may add users, workloads, services, or organizational teams.
          touchpoints:
            - Additional applications
            - Enterprise procurement
    approximationNotes: >-
      Conceptual journey assembled from assigned sources; no stage-to-stage
      conversion rates, elapsed times, or cohort sizes are publicly disclosed.
    claimRefs: [CU006, CU007, CU013, CU014, CU015, CU016]
