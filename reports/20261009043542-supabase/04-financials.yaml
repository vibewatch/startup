    title: Revenue Model Bridge
    type: flow
    summary: >-
      Conceptual path from developer adoption to gross profit, with the unreported conversion
      and cost steps shown explicitly rather than estimated.
    data:
      nodes:
        - id: adoption
          label: Open-source and free adoption
          detail: Developer distribution creates the top of funnel but is not itself revenue.
        - id: paid-conversion
          label: Paid project or organization
          detail: Free-to-paid conversion is not disclosed in the retained sources.
        - id: subscription
          label: Base subscription
          detail: Sacra reports Pro and Team list prices.
        - id: consumption
          label: Usage expansion
          detail: Database size, bandwidth, and MAUs can add consumption revenue.
        - id: recognized-revenue
          label: Recognized revenue
          detail: Mix, discounts, credits, and recognition policy are not disclosed.
        - id: gross-profit
          label: Gross profit
          detail: Hosting and storage costs are a reported pressure, but margin is unavailable.
    approximationNotes: >-
      This is a mechanism map, not a quantitative funnel; it implies no conversion rate,
      revenue amount, cost amount, or margin.
    claimRefs:
      - CI006
      - CI007
      - CI008
      - CI012
      - CI014
callouts:
  - calloutType: risk
    title: Financing Does Not Establish Runway
    body: >-
      Supabase announced $650 million of financing in 2026, but the source set does not disclose
      primary versus secondary proceeds, acquisition consideration, current cash, burn, or debt.
      Runway and financing dependency therefore remain underwriting gaps rather than conclusions.
    claimRefs:
