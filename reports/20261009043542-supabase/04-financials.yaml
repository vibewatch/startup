schemaVersion: "report-v2"
artifact: financials
slug: supabase
runDate: 2026-10-09
company:
  name: Supabase
chapter:
  number: 4
  title: Financials
  summary: >-
    Supabase has a credible subscription-and-usage monetization model and unusually strong
    company-reported workload growth, but the retained public evidence does not disclose
    revenue mix, realized pricing, gross margin, cash, burn, or runway. A $170 million ARR
    figure is a Sacra estimate rather than company-reported revenue, while $650 million of
    announced 2026 financing should not be treated as current cash available.
sections:
  - id: revenue-model-and-pricing
    title: Revenue Model and Pricing
    body: >-
      Supabase monetizes a bundled cloud platform rather than a single database product.
      Its official site describes Postgres database, authentication, APIs, edge functions,
      realtime, storage, and vector capabilities, while Sacra characterizes the commercial
      model as tiered subscription SaaS with additional charges tied to database size,
      bandwidth, and monthly active users. Sacra lists Free, Pro at $25 per month, and Team
      at $599 per month, but these are secondary-source list prices, not evidence of realized
      contract value, discounting, or revenue recognition. The public source set also does
      not disclose how much revenue comes from base subscriptions, usage, enterprise terms,
      or Supabase for Platforms. That distinction matters because a large developer funnel
      can produce very different revenue quality depending on conversion, workload persistence,
      and the share of metered consumption.
    claimRefs:
      - CI005
      - CI006
      - CI010
      - CI012
      - CI013
      - CI014
    tableRefs:
      - TI001
      - TI002
    figureRefs:
      - FI001
  - id: traction-and-gtm-efficiency
    title: Traction and GTM Efficiency Proxies
    body: >-
      Public traction signals are strong but should not be conflated with audited revenue.
      Supabase said in June that it had more than 250,000 customers and that Supabase for
      Platforms customer count had grown 370% in six months. In October it reported adding
      more than one million users and four million databases per month, with 70% of new
      databases created by agents or AI-driven tools. CNBC separately reported a 350-person
      workforce in June, while Sacra argues that coding-assistant distribution lowers
      go-to-market costs. Together these metrics suggest efficient product-led distribution,
      not a measured CAC payback period: the retained sources provide no paid/free split,
      sales and marketing spend, cohort conversion, NRR, or customer concentration. Sacra's
      $170 million May ARR estimate is therefore useful as a directional third-party estimate,
      not a substitute for a management revenue ledger.
    claimRefs:
      - CI004
      - CI008
      - CI009
      - CI010
      - CI011
  - id: cost-structure-and-capital
    title: Cost Structure and Capital Adequacy
    body: >-
      The clearest public cost signal is Sacra's assessment that hosting and storage pressure
      gross margin, which is directionally consistent with a managed database platform but
      does not quantify COGS or margin. In 2026, Supabase announced $650 million of
      financing across the June and October rounds, including a $500 million Series F at a
      $10.5 billion post-money valuation and a $150 million October financing tied to the
      Turso acquisition. Proceeds were intended for product development and employee
      liquidity.
      Financing raised is not cash on hand: the retained sources do not disclose primary
      versus secondary allocation, acquisition consideration, current cash, debt, monthly
      burn, capex, or committed infrastructure obligations. Those omissions prevent a
      defensible runway calculation or a conclusion that near-term financing risk is low.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI007
      - CI015
      - CI016
    tableRefs:
      - TI003
  - id: underwriting-verdict
    title: Underwriting Verdict and Diligence Blockers
    body: >-
      The financial case is attractive at the demand layer and incomplete at the economics
      layer. Subscription plus usage pricing can expand with customer workloads, and agent-led
      distribution may reduce acquisition cost, but infrastructure consumption rises with
      the same activity and no retained source establishes contribution margin, retention,
      or profitability. Even headline financing totals require care: Multiples reports
      $996 million across eight rounds, whereas Supabase's June release said more than
      $1 billion before the additional October round. The discrepancy may reflect source
      timing or aggregation methodology, but it should not be silently reconciled. Investment
      underwriting therefore requires management evidence for ARR definition, GAAP revenue,
      gross margin by product, free-to-paid conversion, NRR, customer concentration, cash,
      burn, financing terms, and Turso consideration before assigning a durable growth or
      runway conclusion.
    claimRefs:
      - CI004
      - CI006
      - CI007
      - CI008
      - CI014
      - CI015
      - CI016
tables:
  - id: TI001
    title: Revenue Streams and Quality of Evidence
    columns:
      - Stream
      - Mechanism
      - Unit
      - Public Status
      - Revenue Quality Read
      - Diligence Ask
    rows:
      - - Cloud project subscriptions
        - Tiered access to the bundled backend platform
        - Project or account subscription
        - Sacra describes Free, Pro, and Team tiers
        - Recurring in form; realized mix and retention are unknown
        - Revenue by tier, paid projects, churn, and contract duration
      - - Usage charges
        - Metered database size, bandwidth, and monthly active users
        - Consumption
        - Sacra describes usage-based charging
        - Can expand with workloads but may be variable
        - Usage revenue, overage gross margin, and workload persistence
      - - Team and enterprise monetization
        - Governance, compliance, support, and negotiated terms
        - Organization or contract
        - Team list price reported by Sacra; realized terms unavailable
        - Potentially higher quality, but ACV and concentration are undisclosed
        - Signed contracts, discounts, renewals, and customer concentration
      - - Supabase for Platforms
        - Embedded infrastructure for third-party application builders
        - Contract terms not disclosed
        - Company reported 370% customer growth in six months
        - Strong growth signal without disclosed revenue contribution
        - Platform contract economics, commitments, and partner concentration
      - - Open-source and free adoption
        - Developer acquisition and conversion funnel
        - Users and projects
        - Officially positioned as open source; conversion is undisclosed
        - Distribution input rather than demonstrated revenue
        - Free-to-paid conversion and support or hosting cost per free cohort
    notes: >-
      Sources describe mechanisms and company-reported adoption, not audited revenue mix;
      null economics require management evidence rather than estimation.
    claimRefs:
      - CI005
      - CI006
      - CI008
      - CI010
      - CI012
      - CI014
  - id: TI002
    title: Pricing and Monetization Evidence
    columns:
      - Offering
      - Public Price or Basis
      - Included Capacity
      - Realized Pricing
      - Evidence Qualification
    rows:
      - - Free
        - Free tier
        - 50,000 MAUs and 500 MB database
        - Not applicable for subscription price
        - Secondary-source description from Sacra
      - - Pro
        - "$25 per month"
        - 100,000 MAUs and 8 GB database
        - Not disclosed
        - Secondary-source list price from Sacra
      - - Team
        - "$599 per month"
        - Enterprise compliance features
        - Not disclosed
        - Secondary-source list price from Sacra
      - - Usage
        - Database size, bandwidth, and MAUs
        - Thresholds and rates not retained
        - Not disclosed
        - Mechanism reported by Sacra; no official price sheet in assigned pool
      - - Enterprise contracts
        - Not disclosed in retained sources
        - Not disclosed
        - Not disclosed
        - Requires executed contracts and billing data
    notes: >-
      All numeric tier data comes from Sacra and is not independently verified against an
      official pricing page; enterprise discounts, credits, taxes, and realized prices are unknown.
    claimRefs:
      - CI005
      - CI006
      - CI013
      - CI014
  - id: TI003
    title: Unit Economics and Capital-Adequacy Diligence
    columns:
      - Metric
      - Public Value or Status
      - Confidence
      - Why It Matters
      - Diligence Ask
    rows:
      - - ARR
        - "$170M in May 2026"
        - Medium; Sacra estimate
        - Indicates possible scale but is not GAAP revenue
        - ARR definition, customer ledger, and GAAP revenue bridge
      - - Gross margin
        - Not disclosed; hosting and storage cited as pressure
        - Low
        - Determines whether growth converts to software-like economics
        - Product-level revenue, cloud COGS, support cost, and gross margin
      - - CAC and payback
        - Not disclosed; low-GTM-cost thesis is qualitative
        - Low
        - Tests whether product-led distribution is economically efficient
        - Sales and marketing spend, new ARR, CAC, and payback by segment
      - - Retention and concentration
        - NRR, GRR, churn, and concentration not disclosed
        - Low
        - Tests durability of agent-created and platform workloads
        - Cohort retention, top-customer exposure, and paid conversion
      - - Cash, burn, and runway
        - Not disclosed
        - Low
        - Required to assess financing dependency
        - Bank cash, monthly burn, capex, debt, and committed obligations
      - - 2026 announced financing
        - "$500M in June plus $150M in October"
        - High for announced round sizes; low for current liquidity
        - Funds growth but does not equal cash available
        - Primary versus secondary split, fees, uses, and current cash balance
      - - Funding-total consistency
        - Company said over $1B in June; Multiples reports $996M across eight rounds
        - Medium; conflicting public records
        - Affects capitalization and dilution analysis
        - Fully diluted cap table and round-by-round primary proceeds
    notes: >-
      Values retain their original labels and periods: Sacra's ARR is an estimate, announced
      funding is not cash available, and undisclosed metrics are left as gaps rather than modeled.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI007
      - CI008
      - CI009
      - CI011
      - CI015
      - CI016
figures:
