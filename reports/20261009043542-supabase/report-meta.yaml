companyProfile:
  summary: >-
    Supabase is a founder-led open-source backend platform built around managed Postgres plus authentication, data APIs,
    storage, realtime, edge functions, and vector support. It targets developers, startups, and engineering teams that
    want a full application backend without assembling separate services, and it monetizes through self-serve
    subscriptions, usage-based charges, and enterprise contracts. Public filings and policy pages place the legal entity
    in Singapore while the operating presentation and recent financing releases emphasize San Francisco.
