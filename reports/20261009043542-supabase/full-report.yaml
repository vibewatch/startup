  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              The recommendation is track/research-more, with medium-low confidence and high valuation risk. The
              positive case is unusually strong adoption momentum: company-issued material reported more than 250,000
              customers, and independent coverage reported database launches up more than 600% year over year and nearly
              10 million developers. The product also spans database, authentication, storage, edge functions, realtime,
              and vector capabilities while retaining an open-source posture. The counterweight is price. The June 2026
              mark remains the latest explicit valuation anchor because the October financing did not publish a new
              price, but current revenue was withheld and no audited ARR, retention, margin, burn, or cash evidence
              appears in the assigned public record. Entry should therefore be conditional on private operating evidence
              and terms, not on the headline usage metrics alone.
            claimRefs:
              - CV001
              - CV007
              - CV008
              - CV009
              - CV011
              - CV014
              - CV016
