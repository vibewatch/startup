            body: >-
              The financial case is attractive at the demand layer and incomplete at the economics layer. Subscription
              plus usage pricing can expand with customer workloads, and agent-led distribution may reduce acquisition
              cost, but infrastructure consumption rises with the same activity and no retained source establishes
              contribution margin, retention, or profitability. Even headline financing totals require care: Multiples
