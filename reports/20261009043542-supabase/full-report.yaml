      - number: '5.2'
        title: Architecture, composition, and portability
        blocks:
          - type: paragraph
            body: >-
              Postgres is the system of record and is not hidden behind a proprietary database abstraction. Supabase
              composes established components around it: GoTrue issues tokens for authentication, PostgREST exposes
              relational data through REST, Realtime handles WebSocket presence and database-change streams, Storage
              uses an S3-compatible service with metadata in Postgres, Deno runs edge functions, and Supavisor pools
              Postgres connections. This decomposition creates two advantages: customers can adopt modules
              incrementally, and standard Postgres export paths reduce data lock-in. It also creates an integration
              burden because the delivered experience depends on several runtimes, protocols, and release trains
              behaving coherently. The architecture is well documented, but the public sources reviewed do not quantify
              failure isolation, service-level performance, or the operational burden of self-hosting the complete
              stack.
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
