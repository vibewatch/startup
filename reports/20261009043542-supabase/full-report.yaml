      - number: '6.3'
        title: Named references demonstrate production use, not portfolio quality
        blocks:
          - type: paragraph
            body: >-
              Supabase's homepage provides concrete but company-curated reference points. It says Lovable powers
              millions of AI-generated apps with Supabase, eXp Realty enables more than 2,000 employees to build
              production software, Phoenix Energy migrated critical infrastructure from MongoDB with zero downtime, and
              Chatbase scaled its own business to $10 million of ARR on one Postgres-backed platform. TechCrunch
              independently names Lovable among products choosing Supabase, strengthening identification but not
              auditing Supabase's claimed scale or customer outcomes. These examples show varied use cases and credible
              production intent; they do not disclose contract value, tenure, renewal behavior, support burden, or what
              share of each customer's stack and workload Supabase serves.
            claimRefs:
              - CU008
