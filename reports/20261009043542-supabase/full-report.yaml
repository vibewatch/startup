    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Founded in 2020 by Paul Copplestone and Ant Wilson, Supabase packages a managed Postgres database with
              authentication, data APIs, edge functions, realtime data, storage, and vector capabilities. The product is
              positioned as an open-source development platform rather than a single database utility, with a free entry
              point and paid plans plus usage charges as projects scale. The legal and operating presentation needs
              precision: Supabase's privacy notice identifies Supabase Pte. Ltd. as the controller, and Tracxn records
              an active Singapore entity incorporated on February 20, 2020, while FundedIQ and the October financing
              release present San Francisco as the operating base. The distinction matters for contracting, governance,
              tax, and domicile diligence.
            claimRefs:
              - CO001
              - CO002
              - CO003
