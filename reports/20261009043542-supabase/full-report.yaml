  - id: FR001
    title: Risk heatmap and thesis-break matrix
    type: matrix
    summary: >-
      Customer configuration exposure and single-primary scaling carry the greatest potential impact; support, missing
      services and capital expectations remain material but workload dependent.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual exposure
        - Thesis-break trigger
      rows:
        - label: Customer configuration data exposure
          values:
            - High evidence; rate unknown
            - High
            - Mixed
            - High
            - Material repeat exposures persist without a declining incidence rate
        - label: Single-primary write saturation
          values:
            - Medium; workload dependent
            - High
            - Developing
            - Medium-high
            - Repeated production failures or no credible migration path above validated headroom
        - label: Privacy or assurance control failure
          values:
            - Unknown
            - High
            - Unverified
            - Medium-high
            - Expired, materially qualified or insufficient assurance blocks regulated customers
        - label: Immediate support-channel gap
          values:
            - Medium
            - Medium-high
            - Partial
            - Medium
            - Repeated unresolved priority-one incidents drive production-customer churn
        - label: Cold starts and missing managed services
          values:
            - Medium
            - Medium
            - Workaround dependent
            - Medium
            - Target workloads cannot meet latency or recovery objectives at acceptable cost
        - label: AI-origin workload quality and valuation
          values:
            - Unknown
            - High
            - Unverified
            - High
            - AI-origin cohorts fail to retain or monetize sufficiently to support financing expectations
