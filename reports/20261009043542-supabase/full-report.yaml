              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV011
              - CV014
              - CV015
              - CV016
      - number: '8.2'
        title: Financing context and capital-structure overhang
        blocks:
          - type: paragraph
            body: >-
              The June round was reported as $500 million at $10 billion pre-money and $10.5 billion post-money,
              following a $100 million Series E at a $5 billion valuation. In October, Supabase disclosed another $150
              million financing alongside the Turso acquisition, but the acquisition consideration and October valuation
              were not disclosed. The latest round also included employee liquidity without quantifying the
              primary-versus- secondary split, so funding raised cannot be treated as cash available. Forge lists a
              1.0x, non-participating preference for the displayed Series F classes, but a full cap table, all seniority
              layers, option dilution, secondary transfers, and acquisition consideration require primary diligence.
              Public totals also differ by provider and round convention, making the capitalization table—not an
              aggregator total—the proper source of truth.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV010
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV011
              - CV014
              - CV015
      - number: '8.3'
        title: Scenario framing and comparable discipline
        blocks:
          - type: paragraph
            body: >-
              The scenario bands use the disclosed $5 billion and $10.5 billion private financing marks as decision
              anchors, not intrinsic-value estimates. A bull outcome requires audited paid conversion, durable
              enterprise retention, attractive gross margins, and a credible liquidity path before any value above the
              latest mark is supportable. The base case is continued operating progress but insufficient public
              economics, which favors waiting or negotiating materially better protection. The bear case is conversion
              weakness, support or infrastructure costs that outrun revenue, multiple compression, or acquisition
              integration risk, potentially returning valuation below the earlier $5 billion mark. No revenue multiple,
              public-company multiple, or M&A multiple is defensible from the assigned evidence because current revenue
              and the Turso consideration are undisclosed.
            claimRefs:
              - CV001
              - CV005
              - CV008
              - CV010
              - CV011
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV005
              - CV008
              - CV010
              - CV011
              - CV015
              - CV016
      - number: '8.4'
        title: Exit readiness, diligence asks, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Financing access is strong, but exit readiness is unproven. Forge labels market activity as limited and
              shows no available Forge price, while the evidence contains no IPO filing, audited public financials, or
              reliable secondary-market clearing price. Before investment, diligence should reconcile the fully diluted
              cap table; primary and secondary proceeds; all liquidation preferences; ARR and recognized revenue; cohort
              retention; gross margin by workload; cloud and support cost; burn and cash; customer concentration; and
              Turso purchase and integration terms. Thesis-break triggers are a down round, material deterioration in
              paid conversion or retention, persistent gross-margin compression, acquisition integration failure, or
              evidence that database creation growth does not translate into retained paid workloads. A verified
              liquidity path or a sufficiently protected entry price could improve the recommendation.
            claimRefs:
              - CV005
              - CV006
              - CV011
              - CV012
              - CV013
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price-sensitive conclusion
            body: >-
              The public record supports strategic quality and financing momentum, but not a precise fair value or
              target return. Treat $10.5B as a transaction mark and require audited economics, a complete preference
              waterfall, and liquidity evidence before investing.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV011
              - CV013
              - CV015
              - CV016
