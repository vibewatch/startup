              - CE007
              - CE008
              - CE009
      - number: '5.3'
        title: Deployment maturity, reliability, and scale
        blocks:
          - type: paragraph
            body: >-
              The available evidence indicates both active scale investment and unresolved implementation risk.
              TechCrunch reported in June 2026 that Supabase launched Multigres to centralize Postgres scaling tasks
              including read replicas, failovers, connection limits, and backups. That is evidence of roadmap response,
              not proof that a specific workload will meet its latency, availability, or recovery objectives. An
              independent self-hosting practitioner separately asked how connection limits interact with API traffic and
              how to stress-test a pending traffic increase, demonstrating that capacity planning is not self-evident
              from the product surface. A historical 2023 practitioner review also reported local-versus-remote parity
              problems and client transaction limitations. Those reports are anecdotes rather than fleet-wide
              measurements, but they define concrete diligence tests: load, failover, migration, rollback,
              connection-pool, and local-to-hosted parity exercises on the buyer's actual topology.
            claimRefs:
              - CE011
              - CE012
              - CE013
              - CE016
      - number: '5.4'
        title: Differentiation, trust controls, and diligence verdict
        blocks:
          - type: paragraph
            body: >-
              The strongest technical differentiation is the combination of integrated developer experience with
              recognizable open-source primitives and direct Postgres access. This makes portability more credible than
              a proprietary data model would, but self-hosting transfers operating responsibility rather than
              eliminating it. On privacy, Supabase states that it acts primarily as a processor for customer-submitted
              end-user data and uses commercially reasonable physical, technical, and organizational safeguards; the
              same notice explicitly declines to guarantee absolute security. These are useful governance statements,
              not an independent control audit. Underwriting should therefore request current audit reports,
              subprocessor and residency mappings, incident and uptime history, recovery test results, and
              architecture-specific performance data. The product appears broad and technically coherent, but confidence
              in mission-critical maturity should remain conditional on workload-level proof rather than feature
              availability or marketing certifications alone.
            claimRefs:
              - CE009
              - CE014
              - CE015
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Integrated without hiding Postgres
            body: >-
              Supabase combines managed backend modules while retaining full Postgres access and standard migration
              paths, creating a meaningful portability advantage.
            calloutType: strength
            claimRefs:
              - CE002
              - CE009
          - type: callout
            title: Feature breadth is not workload proof
            body: >-
              Public sources do not provide workload-specific latency, failover, recovery, or local-to-hosted parity
              results; buyers should reproduce these conditions before treating the platform as mission-critical.
            calloutType: risk
            claimRefs:
              - CE011
