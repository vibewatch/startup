      - number: '6.4'
        title: Commercial durability remains the decisive evidence gap
        blocks:
          - type: paragraph
            body: >-
              Public evidence does not support a retention or concentration conclusion. No assigned source reports NRR,
              GRR, logo or revenue churn, cohort retention, renewal rates, average contract length, expansion revenue,
              paid conversion, customer acquisition cost, or top-customer revenue share. Competitor-authored comparisons
              identify genuine adoption friction around SQL expertise, setup, debugging, scaling costs, and workload
              fit, but those sources have commercial incentives and cannot quantify realized churn. The investment case
              should therefore treat broad adoption and strong named references as top-of-funnel and production proof,
              not as evidence of durable monetization. Closing this gap requires private cohort schedules,
              customer-level revenue concentration, renewal data, and reference calls spanning self-serve, Team, and
              Enterprise customers.
            claimRefs:
              - CU016
