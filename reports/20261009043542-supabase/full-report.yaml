  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Scope, and Spend Definition
        blocks:
          - type: paragraph
            body: >-
              Supabase operates across the developer backend infrastructure and managed database market, specifically
              centered on the PostgreSQL relational ecosystem. The primary category encompasses managed database
              hosting, developer backend-as-a-service (BaaS), authentication and identity management, serverless edge
              compute execution, file and object storage, real-time data streaming, and vector embedding indexing via
              pgvector. Included customer spend consists of dedicated database compute instances, monthly active user
              identity bands, origin and cached bandwidth egress, operational storage capacity, and enterprise
              compliance add-ons such as SOC2, ISO 27001, and HIPAA certifications. Conversely, excluded customer spend
              comprises front-end web application hosting (dominated by ecosystem partners such as Vercel and Netlify),
              full-suite enterprise data warehousing and analytical OLAP infrastructure (such as Snowflake and
              Databricks), and legacy proprietary enterprise NoSQL databases. Rather than replacing the web hosting
              platform, Supabase sits adjacent to modern application frameworks: 40.05% of detected Supabase production
              domains run alongside Vercel, demonstrating that Supabase functions as a composable data layer rather than
              an all-in-one PaaS monolith. Primary substitutes include legacy cloud BaaS platforms like Google Firebase,
              hyperscaler primitives such as AWS Amplify with DynamoDB and Cognito, and emerging serverless Postgres
              vendors such as Neon.
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM006
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM006
      - number: '2.2'
        title: Addressable Market Sizing, Growth Horizons, and Sizing Discrepancies
        blocks:
          - type: paragraph
            body: >-
              Sizing the addressable market for Supabase requires evaluating distinct horizons rather than accepting a
              single top-down total addressable market (TAM) figure. At the macro level, the global database management
              systems (DBMS) and cloud data infrastructure market represents a $100B+ aggregate spend category expanding
              at double-digit compound annual growth rates, with relational systems remaining the standard across 80% of
              startup engineering stacks. Within this landscape, the serviceable addressable market (SAM) for
              developer-centric backend platforms, managed Postgres, and BaaS solutions accounts for an estimated $12B
              to $18B. Supabase's serviceable obtainable market (SOM) is specifically anchored in self-service developer
              subscriptions (Pro plans at $25/month), team collaboration environments ($599/month), and custom
              enterprise contracts for security-sensitive organizations. Industry benchmarks from independent web
              crawlers reveal that Supabase commands 0.83% of the broad PaaS category across 19,361 tracked domains as
              of August 2026, ranking #11 among 41 monitored technologies. However, market adoption metrics display a
              sharp dichotomy: while top-line database creation surged over 600% year-over-year—propelled by autonomous
              coding agents and AI builders launching over 60% of new projects—commercial monetization remains highly
              concentrated. Public domain detections and community forums frequently isolate Supabase to microsites,
              hackathons, or subsidiary subdomains rather than core enterprise transactional ledgers. Sizing models that
              equate 10 million registered developer users directly with commercial ARR risk vastly overstating true
              enterprise wallet capture.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM011
              - CM012
              - CM014
