  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Supabase is delivered as an integrated backend development platform rather than as a standalone database.
              A developer starts with a full Postgres database and can add authentication, generated data APIs, realtime
              synchronization, object storage, edge functions, and vector search through one product surface. The
              customer workflow compresses infrastructure assembly: teams model relational data, attach row-level access
              policies, call generated APIs or client libraries, and use adjacent services without selecting and
              integrating a separate vendor for each layer. This breadth is verified primarily from Supabase's current
              website and architecture documentation; a commercially interested third-party explainer corroborates the
              broad module set but is not an independent benchmark. The product therefore has a credible breadth
              advantage, while measurable time-to-production and migration outcomes remain deployment-specific.
            claimRefs:
              - CE001
              - CE002
