              should not be silently reconciled. Investment underwriting therefore requires management evidence for ARR
              definition, GAAP revenue, gross margin by product, free-to-paid conversion, NRR, customer concentration,
              cash, burn, financing terms, and Turso consideration before assigning a durable growth or runway
