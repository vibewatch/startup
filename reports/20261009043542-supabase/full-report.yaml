  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: A self-serve core with a project-level enterprise tail
        blocks:
          - type: paragraph
            body: >-
              The clearest independent segmentation signal is a web-technology dataset, not a customer ledger.
              TechnologyChecker detected Supabase on 19,361 domains in its August 2026 reading and matched 12,450 of
              those domains to company records. Within the employee-resolved subset, 69.4% belonged to organizations
              with 1-10 employees, indicating a large long tail of founders, small teams, and agency-built projects. The
              same dataset found a broad geographic and vertical spread, while warning that recognizable enterprises
              commonly appeared on a single community site, portal, or microsite. The likely buyer therefore ranges from
              an individual developer to a departmental innovation lead; the end user may be a developer, an internal
              builder, or an app's customer, and the budget owner is not observable from public detections.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
