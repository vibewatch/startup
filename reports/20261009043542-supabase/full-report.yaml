  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk posture and thesis-break conditions
        blocks:
          - type: paragraph
            body: >-
              The risk profile is asymmetric: strong developer adoption and a familiar Postgres core lower
              product-adoption risk, but rapid AI-assisted creation expands the population of inexperienced operators
              who can misconfigure access controls. The most decision-relevant monitor is therefore not raw database
              launches; it is the rate and severity of exposed projects, time to customer notification and remediation,
              and whether safer defaults reduce recurring incidents. The thesis should be paused if material exposures
              continue without measurable reduction, if a primary-database bottleneck causes repeated production
              failures, or if commercial conversion and durable workloads do not support the expectations embedded in
              the June 2026 financing. The matrix is a qualitative prioritization rather than a measured probability
              model.
            claimRefs:
              - CR001
              - CR002
              - CR011
              - CR013
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR008
              - CR011
              - CR013
              - CR014
              - CR016
      - number: '7.2'
        title: Security, privacy, and legal exposure
        blocks:
          - type: paragraph
            body: >-
              UpGuard's reported exposure finding is evidence of a real ecosystem-level failure mode, but it is not
              proof that Supabase itself was breached or that all affected projects shared one root cause. Supabase says
              projects are secure by default and assigns configuration responsibility to customers; that allocation does
              not eliminate reputational, support, or regulatory spillover when hosted applications expose personal
              data. The privacy notice distinguishes Supabase's controller role for account data from its processor role
              for Customer Data and describes international transfers and subprocessors. Diligence should obtain the
              exposure methodology, affected-project denominator, incident chronology, default-policy changes,
              notification service levels, DPA and SCC package, and current independent assurance reports before
              treating legal and control maturity as fully verified.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR015
          - type: table
            tableRef: TR001
