              - CR015
      - number: '7.3'
        title: Operational resilience and product execution
        blocks:
          - type: paragraph
            body: >-
              Managed Supabase reduces infrastructure assembly work, but it does not remove database engineering.
              Independent analysis describes a conventional project as centered on one primary Postgres database:
              replicas distribute reads, while writes still converge on the primary. Multigres was characterized as
              alpha and not production-ready as of September 2026, so it should not be underwritten as a current
              solution to horizontal write scaling. Reviews also identify 200-400 millisecond Edge Function cold starts,
              absent native analytics, queues and advanced caching, and limited immediate support channels. These are
              workload-dependent constraints rather than universal defects. Confirmed recovery tests, customer-specific
              RPO/RTO evidence, saturation thresholds, escalation response times and a production Multigres roadmap are
              the appropriate underwriting evidence.
            claimRefs:
              - CR003
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR002
            claimRefs:
