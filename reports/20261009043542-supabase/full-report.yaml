  - id: FE001
    title: Supabase product architecture stack
    type: stack
    summary: The product integrates six functional layers around a directly accessible Postgres core.
    data:
      items:
        - label: Developer surface
          detail: Studio, CLI, and client libraries provide the build and operating interface.
        - label: Application services
          detail: Authentication, generated data APIs, Realtime, Storage, and Edge Functions expose backend capabilities.
        - label: Access control
          detail: JWT identity integrates with Postgres row-level security policies.
        - label: Data foundation
          detail: A full Postgres database remains directly accessible and extensible.
        - label: Connectivity
          detail: Supavisor pools Postgres connections while API and realtime services mediate application traffic.
        - label: Portability
          detail: Open-source components and standard Postgres export paths support hosted or self-hosted operation.
    approximationNotes: Conceptual component stack; vertical order does not represent latency, ownership, or failure boundaries.
