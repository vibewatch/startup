      - number: '6.2'
        title: Strong adoption signals, but incompatible denominators
        blocks:
          - type: paragraph
            body: >-
              Adoption appears substantial across two different lenses that must not be combined into a single funnel.
              TechnologyChecker's 19,361-domain reading measures detectable web implementations and explicitly
              attributes much of the apparent monthly increase to wider signal coverage, not platform growth. TechCrunch
              separately reported Supabase's company claim of nearly 10 million developers and more than 600%
              year-over-year growth in database launches, with more than 60% of launches initiated by an AI tool.
              Domains, matched organizations, developers, and database launches are different populations; none reveals
              active paid accounts, utilization, revenue, or retention. Vercel co-occurrence and Supabase's code-first
              agent tooling nevertheless suggest that frontend platforms and AI builders are important adoption
              surfaces.
            claimRefs:
              - CU001
              - CU002
