              - CR010
              - CR011
              - CR012
      - number: '7.4'
        title: Partner, financial, and model dependencies
        blocks:
          - type: paragraph
            body: >-
              Supabase's privacy disclosures name a broad operating chain that includes cloud, edge, payments,
              communications, analytics and AI providers. The list establishes dependency breadth but not spend
              concentration, contractual substitution rights, correlated-failure exposure or recovery times. The model
              also relies on converting open-source and AI-generated adoption into persistent paid workloads. TechCrunch
              reported a $500 million Series F at a $10 billion pre-money valuation, while TechCrunch and Nexuswild
              repeat company-reported acceleration in database activity. Funding raised is not cash available, launch
              growth is not revenue, and public evidence does not disclose audited unit economics. Investment diligence
              should require vendor concentration, SLA and exit-plan data plus cohort conversion, retention, gross
              margin, burn and workload-quality metrics.
            claimRefs:
              - CR013
