callouts:
  - calloutType: strength
    title: Founder continuity and accelerating usage
    body: >-
      Both founders remain in operating leadership while company-reported
      developer reach rose from nearly 10 million in June to more than 13 million in October 2026.
    claimRefs: [CO004, CO011, CO012]
  - calloutType: risk
    title: Scale does not resolve financial opacity
    body: >-
      Usage, headcount, and financing datasets use different definitions and
      scopes; none supplies company-disclosed ARR, revenue, burn, or net retention.
    claimRefs: [CO009, CO010, CO013, CO015, CO016]
