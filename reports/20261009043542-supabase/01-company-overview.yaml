schemaVersion: "report-v2"
artifact: company-overview
slug: supabase
runDate: 2026-10-09
company:
  name: Supabase
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Supabase is a founder-led, open-source Postgres development platform that
    reported 13 million developers in October 2026 after raising $500 million
    at a $10 billion pre-money valuation in June and another $150 million in
    October. Public evidence does not reconcile cumulative funding, exact
    headcount, revenue, ARR, or the relationship between its Singapore legal
    entity and its San Francisco operating presentation.
sections:
  - id: identity-and-business-model
    title: Identity and business model
    body: >-
      Founded in 2020 by Paul Copplestone and Ant Wilson, Supabase packages a
      managed Postgres database with authentication, data APIs, edge functions,
      realtime data, storage, and vector capabilities. The product is positioned
      as an open-source development platform rather than a single database
      utility, with a free entry point and paid plans plus usage charges as
      projects scale. The legal and operating presentation needs precision:
      Supabase's privacy notice identifies Supabase Pte. Ltd. as the controller,
      and Tracxn records an active Singapore entity incorporated on February 20,
      2020, while FundedIQ and the October financing release present San
      Francisco as the operating base. The distinction matters for contracting,
      governance, tax, and domicile diligence.
    claimRefs: [CO001, CO002, CO003]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership and governance
    body: >-
      The two founders remain the visible operating leaders: Copplestone is CEO
      and Wilson is CTO. That continuity supports product coherence and
      founder-market fit, but it also concentrates strategic and technical
      authority in two people. Tracxn's public board record lists only the two
      founders as active members and one past independent member; this is not a
      definitive cap-table or statutory-board disclosure. No assigned source
      establishes current outside directors, observer rights, voting thresholds,
      founder ownership, or investor protective provisions. Those omissions make
      governance documents, succession coverage, and reserved-matter rights
      priority diligence items rather than facts to infer from investor prestige.
    claimRefs: [CO002, CO004, CO005]
    tableRefs: [TO002]
  - id: capitalization-and-scale
    title: Capitalization and operating scale
    body: >-
      Supabase announced a $500 million Series F in June 2026 at a $10 billion
      pre-money valuation, or approximately $10.5 billion post-money. Four
      months later, a company-issued release announced another $150 million led
      by GIC and the acquisition of Turso, without disclosing a new valuation.
      Cumulative funding cannot be stated as one verified number: RevenueMemo
      reports about $996 million through the June round, FundedIQ captures $880
      million across four rounds, and Tracxn reports $1.19 billion across eight
      rounds after October. These scopes are not interchangeable, and part of
      the financings included employee liquidity, so funding raised should not
      be treated as cash available.
    claimRefs: [CO006, CO007, CO008, CO009, CO010]
    tableRefs: [TO003]
  - id: momentum-and-open-metrics
    title: Momentum, milestones, and open metrics
    body: >-
      Company-reported reach increased from nearly 10 million developers in
      June to more than 13 million in October. The October release also claimed
      more than one million users and four million databases added per month,
      with 70% of new databases created by agents or AI-driven tools. These are
      usage indicators, not customer, revenue, retention, or monetization
      metrics. Workforce datasets also conflict: FundedIQ gives a 101-250 band,
      while Tracxn states 439 employees as of August 2026. A financing process
      should therefore obtain dated payroll, customer, ARR, gross-margin, burn,
      and net-retention schedules before using usage growth or funding size as
      a proxy for operating performance.
    claimRefs: [CO011, CO012, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
