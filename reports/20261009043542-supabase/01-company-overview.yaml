      - [Coatue, "Seed and Series A lead; repeat investor", "Long-tenured institutional holder", "Confirm fully diluted ownership and protective provisions"]
      - [Accel, "Series D lead and Series E co-lead", "Major late-stage holder", "Confirm pro rata, information, and consent rights"]
      - [Peak XV Partners, "Series C and Series E co-lead", "Repeat growth investor", "Confirm ownership and governance rights"]
      - [Felicis Ventures, "Series B lead and repeat investor", "Long-tenured institutional holder", "Confirm dilution and continuing rights"]
      - ["CapitalG, IronArc, and Square Peg", "October 2026 participants", "Newest disclosed syndicate members", "Confirm allocation, strategic rights, and any side letters"]
    notes: >-
      Partial map of named institutional investors, not a cap table; roles are
      based on public financing histories, and no ownership percentages or control rights were disclosed.
    enumerationScope:
      coverage: partial
      basis: >-
        Named lead and repeat institutional investors in assigned financing
        sources through October 2, 2026; angels and undisclosed holders are excluded.
    claimRefs: [CO006, CO007, CO008, CO010]
