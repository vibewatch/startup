            body: >-
              现有证据既显示出积极的规模化投入，也显示出尚未解决的实现风险。TechCrunch 报道，Supabase 于 2026 年 6 月推出 Multigres，用于集中处理 Postgres
              扩展任务，包括只读副本、故障切换、连接限制和备份。这证明公司在响应路线图需求，但不能证明特定工作负载会达到延迟、可用性或恢复目标。一名独立自托管实践者另行询问连接限制如何与 API
              流量交互，以及如何对即将到来的流量增长做压力测试，说明容量规划并不能仅从产品界面一眼看出。一篇 2023
              年的历史实践评测还报告了本地与远端一致性问题及客户端事务限制。这些报告是个案，不是全量集群测量，但明确了具体尽调测试：在买方实际拓扑上开展负载、故障切换、迁移、回滚、连接池及本地到托管环境一致性测试。
