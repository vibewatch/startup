            body: 公开的开发者、发布量和域名计数使用不同分母，付费转化、续约、扩张和集中度仍未知。
            calloutType: risk
            claimRefs:
              - CU001
              - CU013
              - CU014
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险态势与论点失效条件
        blocks:
          - type: paragraph
            body: >-
              风险分布不对称：强劲的开发者采用和熟悉的 Postgres 核心降低了产品采用风险，但 AI
              辅助快速创建项目，也扩大了可能错误配置访问控制的缺乏经验的运营者群体。因此，最有决策价值的监测指标不是数据库发布量，而是暴露项目的数量和严重程度、通知客户并完成修复所需时间，以及更安全的默认设置能否减少重复事故。如果重大暴露持续存在且没有可衡量的下降、主数据库瓶颈反复造成生产故障，或商业转化和持久工作负载无法支撑
              2026 年 6 月融资所隐含的预期，就应暂停这一论点。该矩阵是定性优先级排序，不是经过测量的概率模型。
            claimRefs:
              - CR001
              - CR002
              - CR011
              - CR013
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR008
              - CR011
              - CR013
              - CR014
              - CR016
      - number: '7.2'
        title: 安全、隐私与法律风险
        blocks:
          - type: paragraph
            body: >-
              UpGuard 报告的暴露发现，证明生态层面确实存在一种故障模式，但不能证明 Supabase 自身遭到入侵，也不能证明所有受影响项目都有同一根因。Supabase
              表示项目默认安全，并将配置责任交给客户；但托管应用暴露个人数据时，这种责任划分并不能消除声誉、支持或监管层面的外溢影响。隐私声明区分了 Supabase
              对账户数据的控制者角色和对客户数据的处理者角色，并说明了国际传输与子处理者。尽调应取得暴露检测方法、受影响项目分母、事故时间线、默认政策变化、通知服务水平、DPA 与 SCC
              文件包，以及当前独立保障报告，再判断法律和控制成熟度是否得到充分验证。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR005
              - CR006
              - CR007
              - CR015
      - number: '7.3'
        title: 运营韧性与产品执行
        blocks:
          - type: paragraph
            body: >-
              托管 Supabase 减少了基础设施组装工作，但没有消除数据库工程。独立分析称，典型项目以一个主 Postgres 数据库为中心：副本负责分发读取，而写入仍汇聚到主库。截至 2026 年 9
              月，Multigres 被描述为 alpha 版本且尚未达到生产就绪，因此不应把它当作当前水平写入扩展方案来进行投资判断。评测还指出 Edge Function 冷启动需要 200-400
              毫秒、缺少原生分析、队列和高级缓存，并且即时支持渠道有限。这些是取决于工作负载的约束，并非普遍缺陷。经过确认的恢复测试、客户专属 RPO/RTO 证据、饱和阈值、升级响应时间和生产版 Multigres
              路线图，才是适当的投资判断证据。
            claimRefs:
              - CR003
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.4'
        title: 伙伴、财务与模式依赖
        blocks:
          - type: paragraph
            body: >-
              Supabase 的隐私披露列出一条广泛的运营链，涵盖云、边缘、支付、通信、分析和 AI 供应商。这份名单证明依赖面很广，但不代表支出集中度、合同替代权、相关故障暴露或恢复时间。该模式还依赖把开源和 AI
              生成的采用转化为持续付费工作负载。TechCrunch 报告 Supabase 以 $10 billion 投前估值完成 $500 million F 轮，TechCrunch 和 Nexuswild
              也重复了公司披露的数据库活动加速。募资额不是可用现金，发布量增长不是收入，而公开证据没有披露经审计的单位经济性。投资尽调应要求供应商集中度、SLA
              和退出计划数据，以及群组转化、留存、毛利率、烧钱和工作负载质量指标。
            claimRefs:
              - CR013
              - CR014
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR009
              - CR011
              - CR013
              - CR014
              - CR016
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              建议为持续跟踪 / 继续研究，信心中低，估值风险高。正面情形是异常强劲的采用势头：公司材料披露客户超过 250,000，独立报道显示数据库发布量同比增长超过 600%，开发者接近 10m
              名。产品覆盖数据库、身份认证、存储、边缘函数、实时能力和向量能力，同时保持开源定位。制约因素是价格。由于 10 月融资没有公布新价格，2026 年 6
              月的价格仍是最近明确的估值锚点；但当前收入没有披露，指定的公开记录中也没有审计 ARR、留存、利润率、烧钱或现金证据。因此，入场应以私有运营证据和条款为前提，不能只依据表面使用量指标。
            claimRefs:
              - CV001
              - CV007
              - CV008
              - CV009
              - CV011
              - CV014
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV005
              - CV011
              - CV012
              - CV013
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV011
              - CV014
              - CV015
              - CV016
      - number: '8.2'
        title: 融资背景与资本结构悬置
        blocks:
          - type: paragraph
            body: >-
              6 月轮次被报道为 $500 million，投前 $10 billion、投后 $10.5 billion，此前是按 $5 billion 估值完成的 $100 million E 轮。10
              月，Supabase 披露在收购 Turso 的同时又融资 $150 million，但收购对价和 10
              月估值均未披露。最近一轮还包含员工流动性安排，却没有量化原始发行与老股转让的拆分，因此募资额不能视为可用现金。Forge 列示所展示 F 轮类别的
              1.0x、非参与型清算优先权，但完整股权结构表、全部优先级层次、期权稀释、老股转让和收购对价仍需一手尽调。不同供应商和轮次口径给出的公开总额也不一致，因此股权结构表，而非聚合平台总额，才是应当依赖的事实来源。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV010
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV011
              - CV014
              - CV015
      - number: '8.3'
        title: 情景框架与可比纪律
        blocks:
          - type: paragraph
            body: >-
              情景区间使用披露的 $5 billion 和 $10.5 billion
              私募融资价格作为决策锚点，而不是内在价值估算。在支持最新价格以上的任何价值之前，乐观情景需要经审计的付费转化、持久的企业留存、有吸引力的毛利率和可信的流动性路径。基准情景是运营持续进展，但公开经济性证据不足，因此更适合等待或谈判显著更好的保护条款。悲观情景包括转化疲软、支持或基础设施成本跑赢收入、估值倍数压缩或收购整合风险，估值可能回落到早先的
              $5 billion 以下。由于当前收入和 Turso 对价均未披露，基于指定证据无法合理支持收入倍数、上市公司倍数或并购倍数。
            claimRefs:
              - CV001
              - CV005
              - CV008
              - CV010
              - CV011
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV005
              - CV008
              - CV010
              - CV011
              - CV015
              - CV016
      - number: '8.4'
        title: 退出准备、尽调要求与论点失效触发器
        blocks:
          - type: paragraph
            body: >-
              融资渠道很强，但退出准备度尚未得到证明。Forge 将市场活动标为有限，没有可用的 Forge 价格；证据中也没有 IPO
              申报文件、经审计的公开财务报表或可靠的二级市场成交价。投资前，尽调应核对完全摊薄股权结构表、原始发行与老股转让所得、所有清算优先权、ARR
              与已确认收入、群组留存、按工作负载划分的毛利率、云和支持成本、烧钱与现金、客户集中度，以及 Turso
              购买和整合条款。论点失效触发器包括降价轮、付费转化或留存明显恶化、毛利率持续受压、收购整合失败，或数据库创建增长没有转化为留存的付费工作负载。经验证的流动性路径或足够受保护的入场价格，可能改善这一建议。
            claimRefs:
              - CV005
              - CV006
              - CV011
              - CV012
              - CV013
              - CV015
              - CV016
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 对价格敏感的结论
            body: 公开记录支持其战略质量和融资势头，但不足以支持精确的公允价值或目标回报。应把 $10.5B 视为交易价格标记，并在投资前要求经审计的经济性、完整的优先权瀑布分配和流动性证据。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV011
              - CV013
              - CV015
              - CV016
