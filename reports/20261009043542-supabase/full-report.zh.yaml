        - Free 层（$0）或 Pro（8GB DB、100K MAU，$25/月）
        - ~$70–$80/月（最小 RDS + S3 + Cognito + 带宽）
        - <10K MAU 时 Supabase 更有利
        - Supabase 套件可为早期和原型应用节省 60-70%
      - - 中等规模应用（100K MAU）
        - ~$600–$650/月（$25 基础费用 + 计算 + 少量超额）
