      - number: '5.2'
        title: 架构、组合与可移植性
        blocks:
          - type: paragraph
            body: >-
              Postgres 是事实记录系统，并未隐藏在专有数据库抽象之后。Supabase 在其周围组合成熟组件：GoTrue 负责签发身份认证令牌，PostgREST 通过 REST 暴露关系数据，Realtime 处理
              WebSocket 在线状态和数据库变更流，Storage 使用 S3 兼容服务并把元数据存放在 Postgres，Deno 运行边缘函数，Supavisor 管理 Postgres
              连接池。这种拆分带来两项优势：客户可以渐进式采用模块，标准 Postgres
              导出路径也降低了数据锁定。它同时带来集成负担，因为交付体验依赖多个运行时、协议和发布节奏保持一致。架构文档较为完善，但已审阅的公开来源没有量化故障隔离、服务级性能或自托管完整栈的运营负担。
