              - CM014
      - number: '2.3'
        title: 买方画像、用户分层与采购归属
        blocks:
          - type: paragraph
            body: >-
              Supabase 生态中的客户分层和预算归属清晰分为三档：个人开发者与原型初创公司、成长期工程团队，以及受监管企业。入门用户通常是开发初始应用的个人开发者、业余爱好者或非技术创始人。这些用户使用较为慷慨的
              Free 层（支持两个活跃项目、500 MB 数据库磁盘和最多 50,000 月活用户），看重即时 SQL API 和零前期资本支出。成长期的经济买方通常是技术创始人、CTO
              或工程副总裁；当应用需要生产可靠性、每日备份和 SLA 时，他们会升级到 Pro 层（每个组织每月
              $25）。此时预算通常来自部门工程团队的信用卡支出。第三类是成熟的中型公司和企业，需要组织控制、单点登录（SSO）、14 天至 90 天日志留存、SOC2/ISO 27001 合规（$599/月 Team
              层的标准功能），或在定制 Enterprise 合同中加入专门的 HIPAA 协议和私有 Slack 频道。在企业环境中，采购权会从个人开发者转移至中央 IT
              采购、信息安全评审委员会和财务负责人；他们会审查数据处理附录及监管保障。
            claimRefs:
              - CM007
              - CM008
              - CM010
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM007
              - CM008
              - CM010
              - CM013
      - number: '2.4'
        title: 结构性增长驱动与关键采用约束
        blocks:
          - type: paragraph
            body: >-
              Supabase 的快速市场扩张由两股结构性顺风推动：全行业向 PostgreSQL 集中，以及 AI 辅助代码生成的爆发。2026 年，Postgres 在初创公司生态中的渗透率升至
              80%，MongoDB、MySQL 和 Firebase 等传统 NoSQL 替代品则持续丢失市场份额。此外，Claude Code、Codex 等 AI 编码代理的出现从根本上加快了数据库配置：新创建的
              Supabase 数据库中超过 60% 由 AI 工具自动启动。标准关系表原生支持
              pgvector，让开发者无需部署独立向量数据库基础设施即可构建检索增强生成（RAG）流水线。但企业采用仍受实质性约束。首要问题是定价可预测性和超额风险：基础计划价格虽低，但项目计算实例按项目计费（$10
              月度额度只能覆盖一个微型实例），高流量应用还会累积数据库存储、出口带宽（源站出口 $0.09/GB）和身份额度费用。月活达到 100,000 时，身份和计算账单可能让总成本意外波动。此外，对于已与
              AWS、Google Cloud 深度绑定、拥有议价折扣和成熟 IAM 治理的大型企业，迁移成本仍然很高。
            claimRefs:
              - CM001
              - CM005
              - CM009
              - CM010
              - CM011
      - number: '2.5'
        title: 市场尽调重点、缺口与规模不一致
        blocks:
          - type: paragraph
            body: >-
              严格评估 Supabase 的市场地位，会发现若干关键尽调缺口，妨碍对其长期企业渗透率做出结论。首先，年度经常性收入（ARR）、收入运行率和净收入留存（NRR）的审计数据仍属私人信息，尚未披露。尽管公司于
              2026 年 6 月以 $10.5B 投后估值完成 $500M F 轮融资，但缺乏第三方审计验证时，市场对 ARR 的私人估算相差很大。其次，第三方域名爬取数据表明，虽然 Supabase 出现在 19,361
              个域名中，但由于前端 JavaScript 检测波动，历史检测结果在两次爬取之间有 15% 消失；主要客户引用也经常位于非关键的社区子域名，而不是核心应用后端。第三，免费 AI
              生成的爱好者项目长期转化为稳定、持续性企业合同的比例仍未被证明。尽调必须确认，自主编码代理产生的是可持续、高 ACV 的企业软件，还是免费试用期结束后就放弃付费层的短命原型。
            claimRefs:
              - CM003
              - CM004
              - CM008
              - CM012
              - CM014
      - number: '2.6'
        title: 展示项
        blocks:
          - type: callout
            title: 计算与身份服务的超额费用断崖
            body: >-
              Supabase 以可预测的 $25 月度 Pro 订阅建立开发者认知，但当项目超过基础计算额度，或月活用户超过计划配额后，基础设施总支出会迅速分化。月活超过
              100,000，或需要配置专用生产计算实例的团队，会遇到不断叠加的按用量收费，低成本工具很快就会变成一项可观的基础设施支出。
            calloutType: insight
            claimRefs:
              - CM007
              - CM009
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与市场分层
        blocks:
          - type: paragraph
            body: >-
              Supabase 周边的开发者基础设施市场分为四类：按需拼装原语的超大规模云厂商、专有后端即服务平台、专注无服务器数据库的厂商，以及开源或自带云（BYOC）框架。Amazon Web Services
              等超大规模云厂商主导整体云开发者工作负载，PostgreSQL 则是行业主要关系型数据库。然而，在 AWS 上搭建生产后端，需要配置 VPC 网络、安全组、IAM 策略，以及
              RDS、Cognito、S3、Lambda 等分散服务，这会给早期团队带来很大的运营复杂度。Google Firebase 等专有平台上手快、移动工具成熟，却把开发者锁定在专有 NoSQL
              文档存储和特殊查询模型中。相比之下，Neon 等无服务器 Postgres 产品主要聚焦数据库自动扩缩容和分支，而不打包应用层服务。Encore、Northflank 等 BYOC
              框架则把基础设施部署到客户自己的云账户中，为已超出托管多租户服务能力的工程组织提供架构灵活性。
            claimRefs:
              - CP001
              - CP002
              - CP007
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP007
              - CP008
      - number: '3.2'
        title: 功能能力与架构取舍
        blocks:
          - type: paragraph
            body: >-
              Supabase 的主要差异化来自开发者体验和统一产品打包：在一个控制台中，同时提供托管 PostgreSQL、行级安全、内置身份认证、对象存储、无服务器边缘函数和基于 WebSocket
              的实时流。这种架构打包消除了通常需要将独立基础设施组件连接在一起的集成摩擦。相比 Firebase，Supabase 提供标准 PostgreSQL、完整的关系模式灵活性、高级索引和 pgvector
              扩展，直接利好包含人工智能工作流的应用。不过，捆绑架构也有刻意的技术妥协。Supabase Edge Functions 在 Deno
              运行时上执行，并受执行时长限制，因此不适合长时间计算任务或繁重的异步后台处理。面对复杂的异步任务编排或高并发微服务架构，开发团队往往还要补充专用计算工作节点或混合云服务。
            claimRefs:
              - CP003
              - CP004
              - CP008
              - CP012
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
              - CP004
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP007
              - CP008
              - CP012
      - number: '3.3'
        title: 定价拐点与 AWS 迁移动态
        blocks:
          - type: paragraph
            body: >-
              Supabase 与超大规模云厂商的总拥有成本，会随用户规模和资源消耗结构而显著分化。对于月活不超过 100,000 的早期和成长期应用，Supabase 具备明显经济优势。典型的 100,000 MAU
              工作负载在 Supabase 上每月约 $600 至 $650，而 AWS 上的等效按需架构每月为 $3,000 至 $3,200。这一差异主要由身份认证成本驱动：AWS Cognito 在超过 10,000
              用户免费额度后按每 MAU 收取 $0.015，比 Supabase 的每 MAU $0.00325 超额费高出 4.6x。但当应用达到 1,000,000
              或更多活跃用户后，经济账开始反转。在更高规模下，企业协议、可带来 30% 至 60% 折扣的预留实例计算承诺，以及精细的网络优化，能让超大规模云厂商提供更好的单位经济性。Supabase 的带宽出口费用为
              $0.09/GB，纵向升级计算实例也会带来显著成本，促使高吞吐平台考虑把工作负载直接迁移到原生云环境。
