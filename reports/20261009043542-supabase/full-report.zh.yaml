  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类范围与支出定义
        blocks:
          - type: paragraph
            body: >-
              Supabase 横跨开发者后端基础设施和托管数据库市场，核心聚焦 PostgreSQL
              关系型生态。主要品类包括托管数据库、开发者后端即服务（BaaS）、身份认证与管理、无服务器边缘计算、文件与对象存储、实时数据流，以及通过 pgvector
              实现的向量嵌入索引。纳入的客户支出包括专用数据库计算实例、月活用户身份档位、源站及缓存带宽出口、运营存储容量，以及 SOC2、ISO 27001 和 HIPAA
              认证等企业合规附加服务。相反，排除的客户支出包括前端 Web 应用托管（主要由 Vercel、Netlify 等生态伙伴主导）、全套企业数据仓库与分析型 OLAP 基础设施（如
              Snowflake、Databricks），以及传统专有企业 NoSQL 数据库。Supabase 并非取代 Web 托管平台，而是位于现代应用框架旁边：在检测到的 Supabase 生产域名中，40.05% 与
              Vercel 并用，说明 Supabase 更像可组合的数据层，而非一体化 PaaS 巨头。主要替代品包括 Google Firebase 等传统云 BaaS 平台、带 DynamoDB 和 Cognito 的
              AWS Amplify 等超大规模云厂商原语，以及 Neon 等新兴无服务器 Postgres 厂商。
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM006
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM006
      - number: '2.2'
        title: 可服务市场规模、增长阶段与规模差异
        blocks:
          - type: paragraph
            body: >-
              评估 Supabase 的可触达市场，需要分别看不同增长阶段，不能接受一个自上而下的总可寻址市场（TAM）数字。宏观上，全球数据库管理系统（DBMS）和云数据基础设施市场代表着 $100B+
              的总体支出品类，复合年增长率达到两位数；关系型系统仍是 80% 初创公司工程栈的标准。在这一市场中，面向开发者的后端平台、托管 Postgres 和 BaaS 解决方案构成估计 $12B 至 $18B
              的可服务市场（SAM）。Supabase 的可服务可获得市场（SOM）具体锚定于自助开发者订阅（Pro 计划 $25/月）、团队协作环境（$599/月）和面向安全敏感组织的定制企业合同。独立 Web
              爬虫的行业基准显示，截至 2026 年 8 月，Supabase 在 19,361 个跟踪域名覆盖的广义 PaaS 品类中占 0.83%，在 41 项受监测技术中排名第
              11。然而，市场采用指标呈现明显分化：数据库创建量同比增长超过 600%，由自主编码代理和 AI 构建工具推动，后者发起的新项目超过 60%；但商业变现仍高度集中。公开域名检测和社区论坛经常显示，Supabase
              只出现在微型网站、黑客松项目或子公司子域名中，而不是核心企业交易账本。把 1,000 万注册开发者直接等同于商业 ARR 的规模模型，可能严重高估真正的企业钱包捕获。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM011
              - CM012
              - CM014
