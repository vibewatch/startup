      - - 带宽流出
        - Pro 包含 250GB，之后超额按 $0.09/GB
        - 标准互联网流出 $0.09/GB
        - 原始 GB 费率大致持平
        - 媒体密集型应用在两个平台都会面临高额流出账单
      - - 高规模（1M+ MAU）
        - $599/月 Team 计划加用量，或定制 Enterprise
        - 按需计量，预留实例可节省 30–60%
        - '>10M MAU 时 AWS 更有利'
        - 企业基础设施控制和承诺折扣使经济性偏向 AWS
    notes: 估算依据 Supabase、AWS 和独立基础设施基准公布的 2026 年费率表；未计入协商的企业折扣。
