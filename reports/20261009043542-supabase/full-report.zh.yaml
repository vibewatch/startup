            body: >-
              Supabase 最强的技术差异化，是把一体化开发者体验与成熟的开源原语、直接 Postgres
              访问结合起来。这让它比专有数据模型更具可移植性，但自托管只是转移运营责任，并没有消除责任。隐私声明显示，Supabase
              主要作为客户提交的终端用户数据处理者，并采用商业上合理的物理、技术和组织保障；同一份声明也明确不保证绝对安全。这些是有用的治理表述，但不是独立控制审计。投资判断因此应要求当前审计报告、子处理者与数据驻留映射、事故和可用性历史、恢复测试结果，以及针对具体架构的性能数据。产品看起来广泛且技术上连贯，但是否适合任务关键型场景，仍应取决于工作负载级别的证明，而不能只看功能可用性或营销认证。
