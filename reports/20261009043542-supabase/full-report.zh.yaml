        blocks:
          - type: paragraph
            body: >-
              Supabase 以一体化后端开发平台交付，而不是作为独立数据库。开发者从完整的 Postgres 数据库开始，再通过同一产品界面加入身份认证、生成式数据
              API、实时同步、对象存储、边缘函数和向量搜索。客户工作流压缩了基础设施组装：团队建模关系数据、挂接行级访问策略、调用生成式 API 或客户端库，并使用相邻服务，无需为每一层分别选择和集成供应商。Supabase
              当前网站和架构文档主要验证了这一广度；一篇具有商业利益关系的第三方解读也佐证了模块范围，但不是独立基准。因此，产品确实具备可信的广度优势，但达到生产环境的时间和迁移结果仍取决于具体部署。
