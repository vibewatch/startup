      - number: '3.4'
        title: 壁垒韧性、迁移成本与替代风险
        blocks:
          - type: paragraph
            body: >-
              Supabase 的防御力来自开源定位、开发者心智份额，以及与 Lovable、Replit、Figma 等现代 AI 应用构建工具的集成。公司以开源 PostgreSQL
              为标准，提供较高的核心关系数据可移植性，团队可以导出模式并将数据转储到任何标准 Postgres 安装中，几乎不会遇到阻抗不匹配。不过，应用层仍存在有意义的迁移成本。离开 Supabase
              需要重构平台专属的身份认证辅助函数、客户端 SDK 调用、行级安全规则假设和 WebSocket 订阅。此外，Supabase 在企业市场高端还面临结构性架构约束：平台依赖单写入器 PostgreSQL
              计算模型，没有原生水平分片能力，需要分布式多区域写入或极端事务吞吐的工作负载最终会遇到纵向上限。再加上企业单点登录（SAML）和 HIPAA 合规被放在高阶商业协议之后，这会增加受监管企业的采用摩擦。
            claimRefs:
              - CP009
              - CP010
              - CP013
              - CP014
