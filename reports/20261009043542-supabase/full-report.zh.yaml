  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Supabase 从 2020 年成立起，经历六个明确命名的融资阶段，并在 2026 年完成两次重大融资事件。
    data:
      items:
        - date: '2020-02-20'
          label: 新加坡实体成立
          detail: Supabase Pte. Ltd. 被记录为一家活跃的新加坡实体。
          tone: neutral
          claimRefs:
            - CO003
        - date: 2020-12
          label: 种子轮融资
          detail: RevenueMemo 记录了一笔由 Coatue 领投的 $6 million 种子轮融资。
          tone: positive
          claimRefs:
            - CO008
        - date: 2021-09
          label: Series A
          detail: RevenueMemo 记录了一笔由 Coatue 领投的 $30 million Series A 融资。
          tone: positive
          claimRefs:
            - CO008
        - date: 2022-05
          label: Series B
          detail: RevenueMemo 记录了一笔由 Felicis 领投的 $80 million Series B 融资。
          tone: positive
          claimRefs:
            - CO008
        - date: 2024-09
          label: Series C
          detail: RevenueMemo 记录了一笔由 Peak XV 和 Craft Ventures 共同领投的 $80 million Series C 融资。
          tone: positive
          claimRefs:
            - CO008
        - date: 2025-04
          label: Series D
          detail: RevenueMemo 记录了一笔 $200 million Series D 融资，估值约 $2 billion。
          tone: positive
          claimRefs:
            - CO008
        - date: 2025-10
          label: Series E
          detail: RevenueMemo 记录了一笔 $100 million Series E 融资，投后估值约 $5.1 billion。
          tone: positive
          claimRefs:
            - CO008
        - date: '2026-06-04'
          label: Series F
          detail: Supabase 宣布以 $10 billion 投前估值融资 $500 million。
          tone: positive
          claimRefs:
            - CO006
        - date: '2026-10-02'
          label: 新融资与收购 Turso
          detail: Supabase 宣布由 GIC 领投的 $150 million 融资，并收购 Turso。
          tone: positive
          claimRefs:
            - CO007
    approximationNotes: 仅含月份的日期反映来源时间线的精度；轮次金额和估值基础予以保留，不做标准化。
    claimRefs:
      - CO003
      - CO006
      - CO007
      - CO008
  - id: FM001
    title: 市场规模视角与可触达支出层级
    type: pyramid
    summary: 从宏观数据库基础设施支出到经验证的 Supabase 生产部署的分层可触达市场层级。
    data:
      items:
        - label: 全球数据库基础设施（宏观 TAM）
          value: $120.0B
          unit: USD
          detail: 覆盖关系型和非关系型工作负载、不断扩张的全球企业云端与本地数据库管理系统市场。
          tone: neutral
        - label: 关系型与开源数据库市场（聚焦 Postgres）
          value: $45.0B
          unit: USD
          detail: 关系型数据库系统的可触达市场；在初创企业软件栈中，Postgres 的采用率为 80%。
          tone: neutral
        - label: 开发者后端即服务与云 API（SAM）
          value: $16.5B
          unit: USD
          detail: 将托管数据库、身份验证、无服务器边缘函数和实时流式传输打包在一起的现代开发者平台。
          tone: neutral
        - label: AI 原生与向量数据库工作负载
          value: $5.2B
          unit: USD
          detail: 面向向量嵌入（pgvector）和自主代理数据库生成的快速增长细分市场。
          tone: positive
        - label: 自助式付费开发者层（SOM 基线）
          value: $1.8B
          unit: USD
          detail: 超出免费额度、采用自助式 Pro（$25/mo）和 Team（$599/mo）的工程账户所构成的商业池。
          tone: positive
        - label: 经验证的生产商业足迹
          value: 19,361
          unit: Domains
          detail: 已确认正在运行 Supabase 平台组件的商业网站域名，占受监测 PaaS 基础设施的 0.83%。
          tone: positive
    approximationNotes: 市场规模层级代表综合分析师研究与经验证网站足迹指标得出的行业估计。数字不代表经审计的 Supabase 公司收入。
    claimRefs:
      - CM003
      - CM004
      - CM011
      - CM012
      - CM014
  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 按开发者上手速度和基础设施控制力呈现后端平台的竞争定位。
    data:
      points:
        - label: Supabase
          x: 8.5
          'y': 3.5
        - label: AWS（自行搭建栈）
          x: 2
          'y': 9
        - label: Firebase
          x: 8
          'y': 2.5
        - label: Neon
          x: 6.5
          'y': 5
        - label: Appwrite
          x: 7
          'y': 6
        - label: Encore / Northflank
          x: 4.5
          'y': 8
    approximationNotes: 分数为序数估计（1-10 刻度）：x 轴反映开发者上手速度，y 轴反映基础设施可配置性和控制力。
    claimRefs:
      - CP007
      - CP008
      - CP012
  - id: FI001
    title: 收入模型桥接
    type: flow
    summary: 从开发者采用到毛利的概念路径；未报告的转化和成本环节明确列出，而非进行估算。
    data:
      nodes:
        - id: adoption
          label: 开源与免费采用
          detail: 开发者分发构成漏斗顶部，但本身不是收入。
        - id: paid-conversion
          label: 付费项目或组织
          detail: 留存来源未披露从免费到付费的转化。
        - id: subscription
          label: 基础订阅
          detail: Sacra 报告了 Pro 和 Team 的标价。
        - id: consumption
          label: 使用扩张
          detail: 数据库规模、带宽和 MAU 可以带来用量收入。
        - id: recognized-revenue
          label: 已确认收入
          detail: 收入组合、折扣、抵扣额和确认政策均未披露。
        - id: gross-profit
          label: 毛利
          detail: 托管和存储成本据报告构成压力，但利润率不可得。
    approximationNotes: 这是机制图，不是量化漏斗；不代表任何转化率、收入金额、成本金额或利润率。
    claimRefs:
      - CI006
      - CI007
      - CI008
      - CI012
      - CI014
  - id: FE001
    title: Supabase 产品架构栈
    type: stack
    summary: 该产品围绕可直接访问的 Postgres 核心整合六个功能层。
    data:
      items:
        - label: 开发者界面
          detail: Studio、CLI 和客户端库提供构建与运营界面。
        - label: 应用服务
          detail: 身份验证、生成式数据 API、Realtime、Storage 和 Edge Functions 暴露后端能力。
        - label: 访问控制
          detail: JWT 身份与 Postgres 行级安全策略集成。
        - label: 数据基础
          detail: 完整的 Postgres 数据库仍可直接访问并扩展。
        - label: 连接能力
          detail: Supavisor 管理 Postgres 连接池，API 和实时服务则中介应用流量。
        - label: 可移植性
          detail: 开源组件和标准 Postgres 导出路径支持托管或自托管运行。
    approximationNotes: 概念性组件栈；垂直顺序不代表延迟、所有权或故障边界。
    claimRefs:
      - CE002
      - CE003
      - CE004
      - CE005
      - CE006
      - CE007
      - CE008
      - CE009
  - id: FU001
    title: 客户采用入口与扩张循环
    type: journey-map
    summary: Supabase 可以从开发者、AI 构建者或项目团队切入，并向生产运营扩张，但公开证据没有量化阶段之间的转化或留存。
    data:
      nodes:
        - id: discover
          label: 发现
          detail: 开发者、创始人、代理机构和 AI 构建者接触到集成式 Postgres 后端。
          touchpoints:
            - Open-source community
            - Templates and app builders
        - id: prototype
          label: 原型
          detail: 一个项目组合数据库、身份验证、存储、实时能力和 API。
          touchpoints:
            - Dashboard
            - Client libraries
        - id: integrate
          label: 集成
          detail: 后端与应用托管服务和前端框架配套使用。
          touchpoints:
            - Vercel and Next.js
            - Generated application code
        - id: deploy
          label: 部署
          detail: 团队将门户、应用或内部工作流迁入生产环境。
          touchpoints:
            - Departmental project
            - Customer application
        - id: operate
          label: 运营
          detail: 代码优先的配置和代理检查支持项目持续运营。
          touchpoints:
            - Health and security checks
            - Logs and advisors
        - id: expand
          label: 扩张
          detail: 成功项目可能增加用户、工作负载、服务或组织团队。
          touchpoints:
            - Additional applications
            - Enterprise procurement
    approximationNotes: 根据所分配来源整理的概念路径；阶段间转化率、耗时或群组规模均未公开披露。
    claimRefs:
      - CU006
      - CU007
      - CU013
      - CU014
      - CU015
      - CU016
  - id: FR001
    title: 风险热力图与论点失效矩阵
    type: matrix
    summary: 客户配置暴露和单主库扩展的潜在影响最大；支持、服务缺失和资本预期仍然重要，但取决于工作负载。
    data:
      columns:
        - 可能性
        - 影响
        - 缓解措施成熟度
        - 剩余暴露
        - 论点失效触发条件
      rows:
        - label: 客户配置数据暴露
          values:
            - 证据较强；发生率未知
            - 高
            - 混合
            - 高
            - 重大重复暴露持续，发生率却没有下降
        - label: 单主库写入饱和
          values:
            - 中等；取决于工作负载
            - 高
            - 发展中
            - 中高
            - 生产环境反复失效，或超过已验证余量后没有可信迁移路径
        - label: 隐私或保证控制失效
          values:
            - Unknown
            - 高
            - 未验证
            - 中高
            - 保证过期、受到重大限定或不足，导致受监管客户无法采用
        - label: 即时支持渠道缺口
          values:
            - 中等
            - 中高
            - 部分
            - 中等
            - 反复无法解决的一级事故推动生产客户流失
        - label: 冷启动与托管服务缺失
          values:
            - 中等
            - 中等
            - 依赖替代方案
            - 中等
            - 目标工作负载无法以可接受成本满足延迟或恢复目标
        - label: AI 来源工作负载质量与估值
          values:
            - Unknown
            - 高
            - 未验证
            - 高
            - AI 来源群组的留存或变现不足以支撑融资预期
    approximationNotes: 仅为定性定位；不代表任何概率百分比。可能性反映所分配的公开证据，剩余严重程度假设缓解措施未经独立验证。
    claimRefs:
      - CR001
      - CR008
      - CR011
      - CR013
      - CR014
      - CR016
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 采用和产品广度支持该论点，但经济性、条款和流动性证据缺失，使建议停留在跟踪 / 继续研究。
    data:
      nodes:
        - id: product
          label: 广泛的开源平台
          detail: 集成 Postgres、身份验证、存储、边缘、实时和向量产品
        - id: adoption
          label: 使用快速增长
          detail: 数据库发布量增长超过 600%，据报告开发者接近 10M
        - id: financing
          label: 溢价融资估值
          detail: $500M Series F，投后估值 $10.5B
        - id: opacity
          label: 经济性未披露
          detail: 当前收入、留存、利润率、消耗和现金仍是缺口
        - id: terms
          label: 条款与流动性不完整
          detail: 员工流动性分配和 Turso 对价未披露
        - id: decision
          label: 跟踪 / 继续研究
          detail: 仅在数据室证据和价格保护到位后推进
    approximationNotes: 这是定性证据链；节点顺序不代表数值转化率、概率或比例价值。
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
      - CV011
      - CV014
      - CV015
      - CV016
