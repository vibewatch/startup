  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: operating-economics
      missingEvidence: >-
        Audited ARR and recognized revenue, gross margin by workload, net revenue
        retention, cohort conversion, customer concentration, burn, and cash.
      whyItMatters: >-
        Usage growth cannot establish revenue quality, margin durability,
        financing runway, or an investable revenue multiple.
      diligencePath: >-
        Obtain audited financials, monthly management accounts, billing exports,
        cohort retention tables, cloud-cost allocations, and bank statements.
      relatedQuestionRefs:
        - QV002
        - QV004
        - QV005
        - QV006
    - type: conflicting-data
      severity: material
      topic: funding
      missingEvidence: >-
        A reconciled financing schedule that explains provider differences in
        total capital raised, round dates, class labels, and primary versus secondary proceeds.
      whyItMatters: >-
        Funding raised is not cash available, and provider totals cannot replace
        the issuer's capitalization and cash records.
      diligencePath: >-
        Reconcile signed financing documents, bank receipts, secondary-sale
        schedules, and the fully diluted capitalization table.
      relatedQuestionRefs:
        - QV003
        - QV008
    - type: private-evidence-only
      severity: material
      topic: preference-terms
      missingEvidence: >-
        Complete preference waterfall, seniority, participation, anti-dilution,
        option-pool, warrant, and secondary-transfer terms for every security class.
      whyItMatters: >-
        Headline post-money valuation does not establish common-equivalent entry
        economics or downside recovery.
      diligencePath: >-
        Review the charter, stock purchase agreements, investor rights
        agreements, cap table, option ledger, and a scenario-tested waterfall.
      relatedQuestionRefs:
