slug: supabase
runDate: 2026-10-09
company:
  name: Supabase
chapter:
  number: 8
  title: Valuation
  summary: >-
    Supabase's June 2026 financing establishes a well-corroborated $10.5 billion
    post-money reference point, while rapid company-reported usage growth and a
    broad open-source product support the strategic thesis. The public record
    does not disclose current revenue, retention, margins, burn, cash, complete
    preference terms, or the Turso purchase price, so the defensible stance is
    track/research-more rather than underwrite a precise fair value.
sections:
  - id: recommendation-and-price-discipline
    title: Recommendation and price discipline
    body: >-
      The recommendation is track/research-more, with medium-low confidence and
      high valuation risk. The positive case is unusually strong adoption
      momentum: company-issued material reported more than 250,000 customers,
      and independent coverage reported database launches up more than 600%
      year over year and nearly 10 million developers. The product also spans
      database, authentication, storage, edge functions, realtime, and vector
      capabilities while retaining an open-source posture. The counterweight is
      price. The June 2026 mark remains the latest explicit valuation anchor
      because the October financing did not publish a new price, but current
      revenue was withheld and no audited ARR, retention, margin, burn, or cash
      evidence appears in the assigned public record. Entry should therefore be
      conditional on private operating evidence and terms, not on the headline
      usage metrics alone.
    claimRefs:
      - CV001
      - CV007
      - CV008
      - CV009
      - CV011
      - CV014
      - CV016
    tableRefs:
      - TV001
    figureRefs:
      - FV001
  - id: financing-context-and-overhang
    title: Financing context and capital-structure overhang
    body: >-
      The June round was reported as $500 million at $10 billion pre-money and
      $10.5 billion post-money, following a $100 million Series E at a $5
      billion valuation. In October, Supabase disclosed another $150 million
      financing alongside the Turso acquisition, but the acquisition
      consideration and October valuation were not disclosed. The latest round
      also included employee liquidity without quantifying the primary-versus-
      secondary split, so funding raised cannot be treated as cash available.
      Forge lists a 1.0x, non-participating preference for the displayed Series
      F classes, but a full cap table, all seniority layers, option dilution,
      secondary transfers, and acquisition consideration require primary
      diligence. Public totals also differ by provider and round convention,
      making the capitalization table—not an aggregator total—the proper source
      of truth.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV010
      - CV013
    tableRefs:
      - TV002
  - id: scenarios-and-comparable-discipline
    title: Scenario framing and comparable discipline
    body: >-
      The scenario bands use the disclosed $5 billion and $10.5 billion private
      financing marks as decision anchors, not intrinsic-value estimates. A
      bull outcome requires audited paid conversion, durable enterprise
      retention, attractive gross margins, and a credible liquidity path before
      any value above the latest mark is supportable. The base case is continued
      operating progress but insufficient public economics, which favors
      waiting or negotiating materially better protection. The bear case is
      conversion weakness, support or infrastructure costs that outrun revenue,
      multiple compression, or acquisition integration risk, potentially
      returning valuation below the earlier $5 billion mark. No revenue
      multiple, public-company multiple, or M&A multiple is defensible from the
      assigned evidence because current revenue and the Turso consideration are
      undisclosed.
    claimRefs:
      - CV001
      - CV005
      - CV008
      - CV010
      - CV011
      - CV015
      - CV016
    tableRefs:
      - TV003
  - id: exit-readiness-and-diligence-gates
    title: Exit readiness, diligence asks, and thesis-break triggers
    body: >-
      Financing access is strong, but exit readiness is unproven. Forge labels
      market activity as limited and shows no available Forge price, while the
      evidence contains no IPO filing, audited public financials, or reliable
      secondary-market clearing price. Before investment, diligence should
      reconcile the fully diluted cap table; primary and secondary proceeds;
      all liquidation preferences; ARR and recognized revenue; cohort retention;
      gross margin by workload; cloud and support cost; burn and cash; customer
      concentration; and Turso purchase and integration terms. Thesis-break
      triggers are a down round, material deterioration in paid conversion or
      retention, persistent gross-margin compression, acquisition integration
      failure, or evidence that database creation growth does not translate
      into retained paid workloads. A verified liquidity path or a sufficiently
      protected entry price could improve the recommendation.
    claimRefs:
      - CV005
      - CV006
      - CV011
      - CV012
      - CV013
      - CV015
      - CV016
tables:
  - id: TV001
    title: Recommendation summary table
    columns:
      - Decision factor
      - Assessment
      - Evidence basis
      - Decision implication
    rows:
      - - Recommendation
        - Track / research more
        - Strong adoption evidence, but no disclosed current revenue or unit economics
        - Do not underwrite at the headline mark without private evidence
      - - Confidence
        - Medium-low
        - Financing is corroborated; operating economics and liquidity are not
        - Keep the view explicitly conditional
      - - Risk rating
        - High valuation risk
        - The latest corroborated post-money mark is $10.5B
        - Require downside protection or a materially lower effective entry
      - - Valuation stance
        - Insufficient public evidence
        - Private-round anchors exist, but a revenue or M&A multiple cannot be calculated
        - Avoid a false-precision fair-value estimate
      - - Decision implication
        - Advance only to data-room diligence
        - Cap table, audited economics, cohort data, and Turso terms remain missing
        - Re-rate only after the named gates are satisfied
    notes: >-
      Assessments combine reported financing marks with explicitly identified
      public-evidence gaps; they are not a fairness opinion or an intrinsic-value estimate.
    claimRefs:
      - CV001
      - CV005
      - CV011
      - CV012
      - CV013
      - CV015
      - CV016
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Side
      - Argument
      - Evidence
      - What would change the view
    rows:
      - - Thesis
        - AI-assisted software creation is expanding demand for backend infrastructure
        - Database launches grew more than 600% year over year
        - Weak paid conversion or short workload life would weaken the thesis
      - - Thesis
        - Broad, open-source product coverage can support adoption and portability
        - The platform combines Postgres, auth, storage, edge functions, realtime, and vector capabilities
        - Product fragmentation or poor enterprise retention would weaken the thesis
      - - Anti-thesis
        - Usage scale is not evidence of attractive economics
        - Current revenue was not disclosed and no audited margin or retention data is public
        - Audited ARR, NRR, gross margin, and cohort conversion could improve the view
      - - Anti-thesis
        - Capital-structure and M&A opacity make effective entry economics uncertain
        - Employee-liquidity allocation and Turso consideration were not quantified
        - A reconciled cap table, waterfall, and acquisition agreement could close the gap
    notes: >-
      Company-reported adoption metrics are retained as claims, not treated as
      independently verified revenue, retention, profitability, or cash generation.
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV008
      - CV011
      - CV014
      - CV015
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Probability signal and downside trigger
    rows:
      - - Bull
        - Audited paid conversion, enterprise retention, and margins validate usage growth; Turso integration succeeds
        - Value above $10.5B is supportable only after those proofs and a credible exit path
        - Upside signal is verified cohort economics; trigger is failure to convert usage into durable paid workloads
      - - Base
        - Adoption continues, but revenue quality, cash consumption, and liquidity remain private
        - $5B-$10.5B is a financing-anchor band, not a fair-value range; wait or seek protection
        - Currently the most defensible public-evidence posture; trigger is continued opacity at the next financing
      - - Bear
        - Paid conversion disappoints, margins compress, multiples contract, or acquisition integration fails
        - A down round below the earlier $5B mark is plausible, but loss magnitude is not publicly quantifiable
        - Elevated if retention or gross-margin diligence misses thresholds; trigger is a down round or adverse cohort evidence
    notes: >-
      Scenario thresholds reuse disclosed private-round marks as decision anchors;
      no probabilities, revenue multiples, target returns, or intrinsic values are estimated.
    claimRefs:
      - CV001
      - CV005
      - CV008
      - CV010
      - CV011
      - CV015
      - CV016
