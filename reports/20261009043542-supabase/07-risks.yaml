chapter:
  number: 7
  title: "Risks"
  summary: "Supabase's clearest near-term risk is customer data exposure through insecure application configuration: TechCrunch reported UpGuard's finding of roughly 16,000 hosted databases with some exposed personal data, while Supabase frames security as a shared responsibility. The investment case also carries single-primary Postgres scaling, support and missing-service gaps, third-party infrastructure dependencies, and substantial execution expectations following a $500 million Series F at a $10 billion pre-money valuation."
sections:
  - id: "risk-posture"
    title: "Risk posture and thesis-break conditions"
    body: >-
      The risk profile is asymmetric: strong developer adoption and a familiar Postgres core lower product-adoption risk, but rapid AI-assisted creation expands the population of inexperienced operators who can misconfigure access controls. The most decision-relevant monitor is therefore not raw database launches; it is the rate and severity of exposed projects, time to customer notification and remediation, and whether safer defaults reduce recurring incidents. The thesis should be paused if material exposures continue without measurable reduction, if a primary-database bottleneck causes repeated production failures, or if commercial conversion and durable workloads do not support the expectations embedded in the June 2026 financing. The matrix is a qualitative prioritization rather than a measured probability model.
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR011"
      - "CR013"
      - "CR014"
    figureRefs:
      - "FR001"
  - id: "security-privacy-legal"
    title: "Security, privacy, and legal exposure"
    body: >-
      UpGuard's reported exposure finding is evidence of a real ecosystem-level failure mode, but it is not proof that Supabase itself was breached or that all affected projects shared one root cause. Supabase says projects are secure by default and assigns configuration responsibility to customers; that allocation does not eliminate reputational, support, or regulatory spillover when hosted applications expose personal data. The privacy notice distinguishes Supabase's controller role for account data from its processor role for Customer Data and describes international transfers and subprocessors. Diligence should obtain the exposure methodology, affected-project denominator, incident chronology, default-policy changes, notification service levels, DPA and SCC package, and current independent assurance reports before treating legal and control maturity as fully verified.
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR004"
      - "CR005"
      - "CR006"
      - "CR007"
      - "CR015"
    tableRefs:
      - "TR001"
  - id: "operational-execution"
    title: "Operational resilience and product execution"
    body: >-
      Managed Supabase reduces infrastructure assembly work, but it does not remove database engineering. Independent analysis describes a conventional project as centered on one primary Postgres database: replicas distribute reads, while writes still converge on the primary. Multigres was characterized as alpha and not production-ready as of September 2026, so it should not be underwritten as a current solution to horizontal write scaling. Reviews also identify 200-400 millisecond Edge Function cold starts, absent native analytics, queues and advanced caching, and limited immediate support channels. These are workload-dependent constraints rather than universal defects. Confirmed recovery tests, customer-specific RPO/RTO evidence, saturation thresholds, escalation response times and a production Multigres roadmap are the appropriate underwriting evidence.
    claimRefs:
      - "CR003"
      - "CR008"
      - "CR009"
      - "CR010"
      - "CR011"
      - "CR012"
    tableRefs:
      - "TR002"
  - id: "dependencies-financial-model"
    title: "Partner, financial, and model dependencies"
    body: >-
      Supabase's privacy disclosures name a broad operating chain that includes cloud, edge, payments, communications, analytics and AI providers. The list establishes dependency breadth but not spend concentration, contractual substitution rights, correlated-failure exposure or recovery times. The model also relies on converting open-source and AI-generated adoption into persistent paid workloads. TechCrunch reported a $500 million Series F at a $10 billion pre-money valuation, while TechCrunch and Nexuswild repeat company-reported acceleration in database activity. Funding raised is not cash available, launch growth is not revenue, and public evidence does not disclose audited unit economics. Investment diligence should require vendor concentration, SLA and exit-plan data plus cohort conversion, retention, gross margin, burn and workload-quality metrics.
    claimRefs:
      - "CR013"
      - "CR014"
      - "CR016"
    tableRefs:
      - "TR003"
