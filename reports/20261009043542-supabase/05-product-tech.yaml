      - [Data APIs, "Frontend and backend developers", "REST API generated by PostgREST; GraphQL exposed through pg_graphql", "Reduces custom CRUD service work", "Complex-query and transaction workflow limits"]
      - [Realtime, "Developers of collaborative and event-driven applications", "WebSocket engine for presence, broadcast, and database changes", "Integrated change streams beside the database", "Published latency, fan-out, and recovery benchmarks"]
      - [Storage, "Application developers managing files", "S3-compatible object service with metadata in Postgres", "Shared authorization and metadata model", "Independent durability and large-object performance evidence"]
      - [Edge Functions, "Developers running custom server-side logic", "Deno-based JavaScript and TypeScript runtime", "Adjacent compute within the platform", "Cold-start, package-compatibility, and debugging evidence"]
      - [Connection pooling, "Operators scaling Postgres connectivity", "Supavisor is documented as a multi-tenant Postgres pooler", "Platform-native connection management", "Topology-specific limits and stress-test results"]
    notes: "Status and differentiation are based on Supabase documentation; maturity gaps identify missing independent or workload-specific proof."
    claimRefs: [CE001, CE002, CE003, CE004, CE005, CE006, CE007, CE008]
  - id: TE002
    title: Customer workflow and use-case assessment
    columns:
      - User job
      - Supabase workflow
      - Supported benefit
      - Limitation or validation need
    rows:
      - ["Launch a relational backend", "Create a project and use the full Postgres database", "Avoid initial database provisioning and preserve SQL capabilities", "Validate schema migration and rollback under production controls"]
      - ["Enforce user-level access", "Issue JWTs through Auth and apply Postgres row-level security", "Move access enforcement closer to stored data", "Audit every policy and service-role bypass path"]
      - ["Expose application data", "Use generated REST or GraphQL interfaces and client libraries", "Reduce custom CRUD API implementation", "Use database functions or another service for atomic multi-step operations where required"]
      - ["Add live and file experiences", "Combine Realtime streams and Storage with the same project", "Reduce cross-vendor integration work", "Load-test WebSocket fan-out, object throughput, and failure behavior"]
    notes: "Benefits are architectural implications, not measured customer outcomes; each limitation is a concrete pre-production test."
    claimRefs: [CE002, CE003, CE004, CE005, CE006, CE010, CE013]
  - id: TE003
    title: Technology and operating architecture
    columns:
      - Layer or component
      - Role
      - Key dependency
      - Principal risk
    rows:
      - [Client and developer tooling, "Dashboard, CLI, and language clients", "Compatibility across generated types, local tooling, and hosted services", "Release drift or local-to-remote parity failure"]
      - [API gateway and generated interfaces, "Route authenticated REST and GraphQL access", "PostgREST, pg_graphql, tokens, and database schema", "Complex workflows may escape the generated-API model"]
      - [Identity and policy, "Authenticate users and bind access to row-level security", "GoTrue, JWT handling, and correctly authored database policies", "A policy or privileged-key error can weaken isolation"]
      - [Data plane, "Persist relational, vector, and service metadata", "Postgres configuration, extensions, compute, and backups", "Connections, query load, or recovery objectives exceed the selected topology"]
      - [Realtime and storage services, "Stream changes and manage large files", "WebSockets, logical database changes, and S3-compatible storage", "Cross-service reliability and authorization must remain consistent"]
      - [Compute and pooling, "Run edge logic and mediate database connections", "Deno runtime, deployment tooling, and Supavisor", "Runtime compatibility and pool sizing become operational dependencies"]
    notes: "The map reflects documented components; risks are diligence hypotheses grounded in component dependencies and practitioner reports."
    claimRefs: [CE002, CE003, CE004, CE005, CE006, CE007, CE008, CE011, CE012, CE013]
