      - ["Distribution and direct booking", "Revenue managers and commercial teams", "Commercial channel manager, booking engine, website, and revenue tooling", "Claimed 160+ channels, 650+ partners, open API, and direct-booking workflow", "Verify active integrations, API limits, certification process, and channel-update failure handling"]
      - ["Restaurant and on-property service", "Waitstaff, kitchen, and restaurant managers", "RapidServe app updated in 2026 and linked to eZee Optimus POS", "Offline order capture with later synchronization to the cloud POS", "Test conflict resolution, bill-printing resilience, day-close workflow, and support response"]
    notes: "Status is limited to retained public evidence as of 2026-10-23; adoption, reliability, and differentiation claims are not treated as independently audited."
    claimRefs: ["CE001", "CE002", "CE003", "CE007", "CE008", "CE009", "CE011", "CE013"]
  - id: "TE002"
    title: "Workflow and use-case assessment"
    columns: ["User job", "Current workflow", "Yanolja solution", "Measurable evidence", "Limitation"]
    rows:
      - ["Manage reservations and room operations", "Coordinate inventory, guests, front desk, housekeeping, and finance", "Cloud PMS on a shared operating data layer", "Capterra lists reservations, front-desk, channel, API, payment, and reporting features", "No retained customer implementation study quantifies labor savings or error reduction"]
      - ["Distribute inventory and optimize rates", "Update availability and pricing across OTAs and direct channels", "Channel manager, booking engine, revenue tools, and partner integrations", "Company claims rate changes propagate to every OTA in under ten seconds", "No independent latency distribution, availability record, or reconciliation-error rate"]
      - ["Deploy and integrate the hotel stack", "Migrate data and connect local accounting, locks, printers, CRM, and other systems", "Open API plus marketplace and integration network", "Company claims go-live with migrated data in under seven days", "No migration sample size, complexity bands, rollback process, or implementation-cost disclosure"]
      - ["Operate restaurant service", "Capture orders, route to kitchen, print receipts, settle bills, and close reports", "RapidServe mobile app linked to eZee Optimus POS", "AppBrain tracked 46 thousand installs and an August 2026 release", "User reports flag lag, printing, update-loop, and day-close issues; prevalence is unknown"]
    notes: "Company performance claims and independent platform observations are kept distinct; absent denominators and methodologies are stated as limitations."
    claimRefs: ["CE002", "CE003", "CE004", "CE006", "CE007", "CE008", "CE009", "CE016"]
  - id: "TE003"
    title: "Technology and operating architecture risk map"
    columns: ["Layer / component", "Role", "Key dependency", "Principal risk"]
    rows:
      - ["Experience and booking", "Traveler discovery, direct booking, conversion, and guest interaction", "Inventory quality, UX, and channel connectivity", "Conversion claims are unaudited and outages could interrupt demand capture"]
      - ["Property operations", "PMS, front desk, housekeeping, finance, payments, and folio management", "Consistent shared records and successful data migration", "A shared data layer can amplify data-quality, permission, or availability failures"]
      - ["Distribution and partner layer", "OTA, GDS, metasearch, wholesale, pricing, and local-system integrations", "APIs, partner certifications, external endpoints, and settlement rules", "Third-party changes and opaque partner economics can create operational and governance failures"]
      - ["Data and AI layer", "Revenue optimization, customer response, check-in automation, and planned agentic workflows", "Travel data rights, model quality, privacy controls, and human escalation", "No retained evidence establishes model governance, security certification, privacy design, or recovery objectives"]
    notes: "This is an evidence-based dependency map, not a verified internal architecture; undocumented security and AI controls are treated as diligence gaps."
    claimRefs: ["CE002", "CE006", "CE008", "CE010", "CE014", "CE015"]
