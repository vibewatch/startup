      - [Risk rating, "Medium-high", "Regulatory exposure and private-company opacity require a diligence discount"]
      - [Valuation stance, "Unsupported at a live price", "Treat the July 2021 $9.0B mark as historical, not current fair value"]
      - [Target return, "Not supportable publicly", "Model returns only after obtaining share rights, dilution, net debt, and exit assumptions"]
    notes: "Analyst synthesis from retained public evidence; no current transaction price, fully diluted capitalization, or preference waterfall was available."
    claimRefs: [CV001, CV004, CV005, CV012, CV013, CV016]
  - id: TV002
    title: Thesis / anti-thesis
    columns: [Side, Evidence-backed argument, What would change the view]
    rows:
      - [Thesis, "NOL Universe reportedly serves 13M monthly users", "Verify cohort retention, take rate, contribution margin, and acquisition cost"]
      - [Thesis, "Enterprise-solutions first-half 2026 revenue reportedly rose 12.8% to KRW 148.9B", "Verify recurring mix, gross margin, ARR, churn, and customer concentration"]
      - [Anti-thesis, "The retained $9.0B valuation reference dates to July 2021", "Obtain a current arm's-length financing, secondary trade, or IPO filing"]
      - [Anti-thesis, "Coupon-advertising enforcement remains under legal challenge", "Confirm final disposition, reserves, remediation cost, and partner-economics changes"]
    notes: "Operating figures retain their stated periods and denominators; change conditions are diligence tests, not forecasts."
    claimRefs: [CV001, CV007, CV008, CV012, CV013]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Assumptions, Valuation / return logic, Key risks, Probability signal]
    rows:
      - [Bull, "Recurring enterprise growth and margins are verified; InnKey integration expands monetized distribution", "A premium could be considered only against current public travel and software multiples after net-debt and preference adjustments", "Integration, competition, and IPO execution", "Positive signal, but no numeric probability is supportable"]
      - [Base, "Strategic scale persists while disclosure and liquidity improve slowly", "Apply private-company, disclosure, and legal discounts to any current transaction benchmark; do not carry forward $9.0B mechanically", "Stale price, dilution, travel cyclicality", "Most consistent with the retained evidence"]
      - [Bear, "Enterprise monetization disappoints, multiples compress, or the legal matter creates material remediation", "Downside from the historical mark is plausible, but no defensible floor is calculable without cash flow, net debt, and share terms", "Partner friction, cash use, down-round, regulatory cost", "Material downside cannot be ruled out"]
    notes: "Qualitative scenarios only; current consolidated cash flow, net debt, fully diluted shares, investor rights, and comparable-market values were not established."
    claimRefs: [CV001, CV004, CV007, CV012, CV013, CV014, CV015, CV016]
