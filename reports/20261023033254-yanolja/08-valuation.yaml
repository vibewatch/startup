company:
  name: Yanolja
chapter:
  number: 8
  title: Valuation
  summary: >-
    Yanolja shows current scale and enterprise-software momentum, but the only retained
    valuation anchor is a third-party record of the July 2021 $9.0B post-money round.
    Current price, investor rights, net debt, and normalized comparable-company inputs remain
    unavailable, supporting a track and research-more recommendation rather than a buy call.
sections:
  - id: decision-frame
    title: Price-sensitive recommendation
    body: >-
      The evidence supports tracking Yanolja, not underwriting an entry at the last reported
      mark. Forbes reports 13 million monthly NOL Universe users, hospitality software used by
      tens of thousands of hotels, and nearly $2 billion of backing. Seoul Economic Daily adds
      a current operating signal: enterprise-solutions revenue reached KRW 148.9 billion in
      the first half of 2026, up 12.8% year over year. Yanolja itself says its solutions reach
      more than 200 countries. Those indicators support a thesis that consumer distribution
      and enterprise software could create a differentiated travel platform. They do not,
      however, establish recurring revenue quality, segment margins, cash generation, or a
      current equity value. The anti-thesis is therefore price and proof: a stale private
      financing mark, incomplete ownership terms, and unresolved regulatory exposure can
      overwhelm otherwise credible strategic assets.
    claimRefs: [CV001, CV003, CV007, CV008, CV009, CV010, CV016]
    tableRefs: [TV001, TV002]
    figureRefs: [FV001]
  - id: financing-and-ownership
    title: Financing context, ownership, and comparable limits
    body: >-
      Silicon Valley Invest Club's profile traces the $9.0B post-money valuation to the July
      2021 growth-equity round, while Web in Travel reported that SoftBank Vision Fund supplied
      $1.7 billion ahead of an anticipated IPO. That history is a financing reference, not
      evidence that an arm's-length buyer would pay the same price in October 2026. EquityZen's
      public page withholds the current valuation, stock price, cap table, and liquidity
      preferences behind accredited access. Dealroom provides only indicative ownership,
      including 24.9% for SoftBank Vision Fund 2 and 30.2% categorized as other or undisclosed.
      LeadIQ's $1B-$10B annual-revenue estimate is too broad to serve as a valuation
      denominator. The retained Booking Holdings and Airbnb investor-page text also contains
      no normalized revenue, EBITDA, net-cash, or market-value observations from which to
      calculate a current comparable multiple. Public evidence therefore does not support a
      precise valuation range, dilution model, or target return.
    claimRefs: [CV001, CV002, CV004, CV005, CV006, CV015]
  - id: scenarios
    title: Scenario logic without false precision
    body: >-
      The bull case requires verified enterprise recurring growth, improving margins, and
      successful integration of acquired hotel-software assets; the reported InnKey footprint
      of more than 500 Indian hotel properties is a distribution signal, not proof of
      monetization. The base case treats Yanolja as strategically relevant but keeps a private
      company and disclosure discount until current financials and share terms are produced.
      The bear case combines weak software economics or multiple compression with legal and
      partner-remediation costs. Prosecutors searched Yanolja's offices in March 2026 over
      coupon-advertising practices, after a reported KRW 540 million Fair Trade Commission
      fine that Yanolja is challenging. Because the pool lacks current free cash flow, net
      debt, share count, preferences, and segment retention, scenario probabilities and
      numerical valuation endpoints would be invented rather than evidence-based.
    claimRefs: [CV004, CV007, CV012, CV013, CV014, CV015, CV016]
    tableRefs: [TV003]
  - id: exit-and-diligence
    title: Exit readiness, diligence asks, and thesis breaks
    body: >-
      Exit intent has historical support but current readiness is unproven. Web in Travel
      described the 2021 SoftBank financing as preceding an IPO, while EquityZen continues to
      market access to Yanolja as a private-company investment. No current prospectus,
      timetable, arm's-length secondary mark, or audited IPO bridge appears in the assigned
      evidence. The restructuring reported by Seoul Economic Daily concentrates resources on
      travel data and AI and removes Dable from consolidation; that may sharpen the story but
      also complicates period-to-period comparability. Before entry, diligence should obtain
      the fully diluted cap table, preference waterfall, audited 2025 and 2026 interim
      financials, net debt, segment ARR or recurring revenue, churn, retention, concentration,
      and the latest legal record. Thesis breaks include an adverse legal disposition with
      material partner remediation, a down-round without offsetting operating improvement, or
      evidence that enterprise growth is not converting into durable gross profit and cash.
    claimRefs: [CV002, CV004, CV011, CV012, CV013, CV016]
