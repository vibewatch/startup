schemaVersion: "report-v2"
artifact: customers
slug: yanolja
runDate: 2026-10-23
company:
  name: Yanolja
chapter:
  number: 6
  title: Customers
  summary: >-
    Yanolja serves two linked customer systems: travelers using its consumer
    marketplace and hospitality businesses buying cloud, distribution, and data
    tools. Public evidence supports broad international reach and meaningful
    operating adoption, but does not disclose the denominators needed to verify
    retention, revenue concentration, or the production status of named
    deployments.
sections:
  - id: customer-segments
    title: Customer segments and value exchange
    body: >-
      Yanolja's customer base is best understood as a B2B2C system rather than
      one homogeneous account set. Travelers are the end users of accommodation,
      leisure, transportation, and related booking services, while hotels,
      restaurants, residences, golf and leisure operators are the operating
      customers for cloud products. The company describes its platform as
      connecting travel enterprises and travelers across more than 200 countries,
      while the CEO interview describes subscription, transaction, and data
      solutions for hotels and travel operators. This creates several value
      exchanges: software buyers seek operating efficiency and distribution;
      channel partners seek inventory access; travelers seek availability,
      convenience, and personalization. The evidence supports segment existence
      and product scope, but not customer-level revenue bands or payer economics.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-trajectory
    title: Adoption trajectory and operating proof
    body: >-
      Adoption evidence is stronger for reach and product usage than for
      durable account economics. A company interview reports Yanolja Cloud
      licenses increasing from 39,000 in 2019 to more than 80,000, with presence
      in more than 170 countries; a 2025 independent interview reports more
      than 1.3 million partners across 206 countries and a 62% year-on-year
      increase in cloud business for 2024. HotelTechReport provides a
      large review sample for the channel manager, while AppBrain gives a
      smaller but observable mobile-product signal for RapidServe. These are
      distinct indicators and should not be combined into one customer count:
      licenses, partners, reviews, installs, and transaction volume use
      different populations and denominators. Public evidence does not establish
      active monthly accounts, renewal cohorts, or the share of partners using
      multiple products.
    claimRefs: [CU005, CU006, CU007, CU008]
    tableRefs: [TU002]
  - id: named-proof-and-retention
    title: Named customer proof and retention limits
    body: >-
      Named customer evidence shows that Yanolja Cloud products are used in
      operating hotel contexts, but the available material is largely
      marketplace or review evidence rather than audited deployment proof.
      HotelTechReport names Decker Hotel & Bar, Amaka Calma Tulum, and Hi
      Chiangrai Hotel among properties associated with the channel manager and
      reports high recommendation rates; the same page describes real-time
      synchronization, centralized pricing, and support observations from
      reviewers. AppBrain includes a user statement that eZee RapidServe was
      used across nine properties and another that the service helped hotel and
      restaurant departments. These signals support product use and perceived
      utility, not contract size, production scope, or renewal. Yanolja's public
      materials do not provide NRR, GRR, churn, renewal rate, contract length,
      cohort retention, or customer concentration, so durability remains a
      material diligence gap.
    claimRefs: [CU009, CU010, CU011, CU012]
    tableRefs: [TU003]
  - id: expansion-and-risk
    title: Expansion, procurement, and concentration risk
    body: >-
      The expansion case rests on cross-selling software, transaction
      connectivity, and data services across a geographically broad partner
      base. The Korea Herald describes distribution connections to Trip.com and
      Agoda and a model that charges commissions when bookings succeed, while
      Yanolja's CEO has described localization by language, currency, payments,
      and local distribution systems. That breadth can reduce single-market
      dependence, but it also increases implementation and procurement
      complexity. A 2026 report says enterprise-solutions revenue reached 148.9
      billion won in the first half, while a separate report describes a
      regulatory investigation into coupon advertising practices affecting more
      than 2,500 lodging businesses. The latter is not evidence of churn, but it
      is a customer-relationship and governance risk that could affect partner
      trust. No public source identifies top-customer concentration or channel
      dependence.
    claimRefs: [CU013, CU014, CU015, CU016]
    calloutRefs: []
callouts:
  - calloutType: strength
    title: Broad distribution footprint with observable product use
    body: >-
      Yanolja has evidence of international software reach, named hotel
      properties, third-party reviews, and a measurable mobile-product footprint;
      the signals are complementary but not interchangeable.
    claimRefs: [CU005, CU009, CU010]
  - calloutType: risk
    title: Retention and concentration remain unverified
    body: >-
      The public record does not disclose customer cohorts, renewal economics,
      NRR, churn, or the contribution of the largest accounts, and a partner
      promotion investigation adds a relationship risk that merits direct
      diligence.
    claimRefs: [CU012, CU015, CU016]
