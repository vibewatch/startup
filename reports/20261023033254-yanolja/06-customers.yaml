    columns: [Customer or property, Segment, Deployment / use case, Production vs pilot, Outcome signal, Limitation]
    enumerationScope:
      coverage: sample
      basis: "Named properties and users visible in assigned public reviews and case material retrieved for the 2026-10-23 chapter run."
    rows:
      - ["Decker Hotel & Bar (USA)", "Hotel", "Yanolja Channel Manager", "Not disclosed", "Listed among properties associated with the product", "No contract, duration, usage or outcome data"]
      - ["Amaka Calma Tulum (Mexico)", "Hotel", "Yanolja Channel Manager", "Not disclosed", "Listed among properties associated with the product", "No deployment scope or renewal evidence"]
      - ["Hi Chiangrai Hotel (Thailand)", "Hotel", "Yanolja Channel Manager", "Not disclosed", "Listed among properties associated with the product", "No financial or operating outcome disclosed"]
      - ["Unnamed hotel and restaurant properties", "Hotel / restaurant", "RapidServe operational app", "User-reported use; production scope unclear", "One reviewer says the app was used across nine properties and helped departments", "Reviewer identity and account relationship are not independently verified"]
    notes: >-
      This is a partial named-proof sample, not an exhaustive customer list;
      marketplace listings and user reviews do not establish contract status or
      production deployment.
    claimRefs: [CU009, CU010, CU011, CU012]
