      - ["Global partners", "More than 1.3 million", "Reported May 2025", "Korea Herald interview with CEO", "Medium", "Shows broad ecosystem reach", "Active partners, partner type and duplicate accounts"]
      - ["RapidServe installs", "46 thousand total; 850 in prior 30 days", "Data updated 2026-10-15", "AppBrain Google Play tracking", "Medium", "Observable product distribution signal", "Paid accounts, enterprise deployment and conversion"]
    notes: >-
      Values are reproduced with their stated periods and denominators; no
      conversion, growth rate, or retention is inferred across unlike metrics.
    claimRefs: [CU005, CU006, CU007, CU008]
