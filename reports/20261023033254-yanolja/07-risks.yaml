company:
  name: Yanolja
chapter:
  number: 7
  title: Risks
  summary: >-
    Yanolja's clearest current risk is the reported escalation of a Korean
    fair-trade dispute into a prosecutor investigation, while 2026 privacy and
    AI rules raise the control burden for its data-intensive global platform.
    Restructuring, acquisitions, and broad partner connectivity add execution
    risk that public reliability, concentration, and governance disclosures do
    not yet resolve.
sections:
  - id: ranked-risk-assessment
    title: Ranked risk assessment
    body: >-
      Regulatory conduct is the highest-evidence risk. KoreaTechDesk reports
      that prosecutors searched Yanolja and Yeogi Eottae over coupon-funded
      advertising after the Korea Fair Trade Commission imposed administrative
      penalties; the companies are challenging those penalties, so the record
      does not establish final liability. Privacy and AI governance rank next
      because Korean legal sources describe tougher breach, executive
      accountability, certification, and AI-service obligations while Yanolja
      presents itself as a global data and AI platform. Execution risk is also
      material: Seoul Economic Daily reports a portfolio restructuring amid
      geopolitical risk, higher airfares, and a weak won. Severity reflects
      evidenced exposure and potential impact, not a disclosed company
      probability.
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR006, CR010]
    tableRefs: [TR001]
    figureRefs: [FR001]
  - id: legal-regulatory-and-data
    title: Legal, regulatory, and data exposure
    body: >-
      The coupon matter combines enforcement, partner economics, and reputation.
      The report says lodging businesses funded consumer coupons through
      advertising fees and that unused value could expire without refund; it
      further says more than 2,500 lodging businesses may have been affected.
      Possible fraud, embezzlement, or breach-of-trust theories were described
      as expert commentary rather than confirmed charges. Separately, DLA Piper
      reports that specified serious PIPA violations can attract penalties up
      to 10% of total revenue, and Chambers describes Korea's AI Framework Act
      as effective from January 2026. Neither source proves a Yanolja breach or
      violation. The diligence test is therefore company-specific applicability,
      controls, incident history, and remediation evidence rather than the
      existence of the laws alone.
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR006, CR015]
    tableRefs: [TR002]
  - id: operating-and-dependency-risk
    title: Operating, partner, and financial-model risk
    body: >-
      Yanolja's scale increases both resilience and blast radius. The company
      says its solutions reach more than 200 countries, while its About page
      says its transaction network links 1.3 million travel enterprises to more
      than 18,000 sales channels. Forbes reports 13 million monthly NOL Universe
      users. Those figures use different populations and cannot be combined
      into a funnel or concentration measure. A company-issued acquisition
      release adds more than one million travel products and over 20,000 client
      partners through Go Global Travel, creating integration and counterparty
      dependencies. Seoul Economic Daily reports enterprise-solutions revenue
      of KRW 148.9 billion for the first half, up 12.8% year over year, but also
      describes portfolio changes and macro pressure. Revenue growth is not
      evidence of retention, uptime, cash generation, or integration quality.
    claimRefs: [CR007, CR008, CR009, CR010, CR011, CR013]
    tableRefs: [TR003]
  - id: mitigations-and-kill-criteria
    title: Mitigations, monitoring, and thesis-break criteria
    body: >-
      Monitoring should privilege auditable outcomes. For the coupon matter,
      obtain the prosecutor and regulator records, partner remediation terms,
      and any repeat-practice testing. For privacy and AI, require a data-flow
      map, cross-border transfer basis, breach log, board and CPO materials,
      ISMS-P applicability assessment, model inventory, evaluation results, and
      human-escalation evidence. For operations, request uptime, severity-one
      incidents, migrations, support backlog, churn, partner concentration, and
      acquired-product cohort data. A final adverse legal disposition requiring
      material partner remediation, a reportable data incident without timely
      containment, or sustained enterprise reliability and retention
      deterioration during restructuring would break the present thesis. The
      assigned Reddit retrieval yielded only a generic subreddit description,
      and a third-party profile says the shareholder register is not public;
      neither can substitute for primary financing or governance diligence.
    claimRefs: [CR005, CR006, CR010, CR012, CR014, CR016]

