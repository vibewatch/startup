        - label: Distribution and partner dependency
          values: [Medium, High, Medium, High]
        - label: Capital and governance opacity
          values: [Medium, High, Unknown, High]
    approximationNotes: "Qualitative positions are analyst assessments tied to cited evidence; no source supplies calibrated probability estimates."
    claimRefs: [CR001, CR003, CR005, CR006, CR010, CR013, CR014]

callouts:
  - calloutType: risk
    title: Primary thesis-break risk
    body: >-
      A final regulatory or criminal finding that requires material partner
      remediation would challenge both compliance maturity and marketplace
      economics; current reporting establishes an investigation, not liability.
    claimRefs: [CR001, CR002, CR003, CR004]
  - calloutType: assumption
    title: No clean-control inference
    body: >-
      Public sources do not establish Yanolja's complete incident record,
      control effectiveness, customer retention, counterparty concentration, or
      fully diluted governance rights.
    claimRefs: [CR012, CR014, CR016]

