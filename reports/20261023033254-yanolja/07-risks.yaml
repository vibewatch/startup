    notes: "Sample of evidenced public legal exposures as of 2026-10-23; likelihood, severity, maturity, and residual exposure are analytical ratings, not company-disclosed probabilities."
    enumerationScope:
      coverage: sample
      basis: "Public Yanolja-specific reporting and current Korean legal guidance retained in the assigned source pool"
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR006, CR015]
  - id: TR002
    title: Operational / quality / security risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - ["Cross-border personal-data breach or transfer failure", medium, critical, "Unknown from public evidence", high, "Incident history, processor map, transfer basis, control tests, and ISMS-P applicability"]
      - ["AI concierge error, unsafe automation, or weak escalation", medium, high, "Deployment scale is reported; assurance evidence is absent", "medium-high", "Model evaluations, override rates, customer complaints, and incident taxonomy"]
      - ["Portfolio restructuring disrupts delivery or accountability", medium, high, "Management is consolidating around data and AI; transition controls are undisclosed", "medium-high", "Ownership map, service continuity, redundancy, retention, and post-change accountability"]
      - ["Travel-market macro shock compresses demand or margin", medium, high, "Enterprise growth is reported, but hedge, margin, and cash-flow data are absent", "medium-high", "Segment margins, currency exposure, airfare sensitivity, booking elasticity, and downside plan"]
    notes: "No retained source proves absence of incidents or control failures; null public evidence is treated as a gap rather than evidence of clean performance."
    claimRefs: [CR005, CR006, CR010, CR011, CR012]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty or role, Concentration or scale, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - ["Lodging-partner promotion economics", "Korean accommodation partners", "More than 2,500 businesses may have been affected, according to the retained report", "Adverse disposition or remediation weakens partner trust and marketplace economics", critical, "Transparent coupon settlement, refunds, independent testing, and partner governance", "High while the investigation remains unresolved"]
      - ["Travel inventory and distribution", "Go Global Travel supplier and client network", "Company claims more than 1 million products from 200 countries and over 20,000 client partners", "Supplier, inventory, contract, or channel disruption reduces enterprise reach", high, "Diversified supply, service-level controls, renewal planning, and integration monitoring", "High because concentration and renewal data are private"]
      - ["Global data and platform operations", "Travel enterprises, sales channels, and processors", "Company claims 1.3 million enterprises, 18,000+ sales channels, and solutions in 200+ countries", "Outage, processor failure, or transfer restriction propagates across connected operations", high, "Regional redundancy, processor governance, incident response, and transfer controls", "Medium-high because architecture and incidents are undisclosed"]
      - ["Capital and governance", "Shareholders and financing counterparties", "A third-party profile states that the full shareholder register is not public", "Undisclosed control or preference rights constrain strategic or financing choices", high, "Fully diluted cap table, rights schedule, board map, and financing covenant review", "High until primary documents are reviewed"]
    notes: "Scale values preserve each source's population and date basis; they are not active-customer, revenue-concentration, retention, or cash-availability measures."
    claimRefs: [CR003, CR007, CR008, CR013, CR014]

