  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and demand shape
        blocks:
          - type: paragraph
            body: >-
              The relevant market is not “travel” in the abstract. The consumer boundary includes digitally mediated
              accommodation, transportation, leisure and experience bookings, while excluding offline-only bookings,
              supplier-direct transactions that never touch a platform, and the full value of travel spend that is not
              platform revenue. The enterprise boundary includes cloud property-management, reservation,
              channel-management, integration and data/AI tools sold to travel suppliers; it excludes generic enterprise
              software unrelated to travel operations. This separation matters because OTA gross booking value and
              hospitality-software revenue are different units and cannot be added into one TAM. Demand is structurally
              mobile and experience-led: Mordor Intelligence estimates mobile captured 63.5% of OTA bookings in 2025 and
              says accommodation is forecast to grow at a 6.4% CAGR through 2031, while PhocusWire reports that online
              bookings continue to outpace the total market. In Korea, the demand case is also culturally specific: a
              company-issued Worldfolio article describes NOL as combining events, dining, wellness and beauty with
              travel booking. The status quo remains a mix of supplier-direct booking, offline agents, fragmented
              property systems and manual workflows; Yanolja's opportunity is to connect those silos, not to claim every
              tourism dollar.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM009
      - number: '2.2'
        title: Multiple sizing lenses and serviceable opportunity
        blocks:
          - type: paragraph
            body: >-
              At the broadest level, Phocuswright reports approximately USD 1.67 trillion of global gross travel
              bookings in 2025 and more than USD 1 trillion of online bookings. Those values are channel context rather
              than an addressable-revenue estimate for Yanolja. Published estimates disagree materially because they
              define and model the OTA market differently. Mordor Intelligence places the global OTA market at USD
              561.30 billion in 2026 and USD 761.33 billion in 2031, a 6.29% CAGR; Grand View Research reports USD 718.9
              billion in 2026 and USD 1,316.8 billion in 2033, a 9.0% CAGR. These figures are market-sizing lenses, not
              Yanolja revenue or an investable SOM, and the gap itself is evidence that the denominator needs diligence.
              A separate Straits Research lens sizes hotel and hospitality-management software at USD 7.87 billion in
              2026 and USD 13.67 billion in 2034 at a 7.14% CAGR, with cloud deployment and integration central to the
              category. Yanolja's serviceable wedge is narrower: Asia-Pacific and Korea-linked consumer demand, plus
              hotels and travel enterprises that need cloud operations, distribution and data connectivity. Mordor
              assigns Asia-Pacific 38.3% of OTA share in 2025 and a 6.8% forecast CAGR through 2031, while
              company-affiliated Yanolja Research forecasts over 20 million inbound and 30 million outbound Korean
              travelers in 2026. Neither source isolates Yanolja's SAM or SOM, so a precise share or revenue conversion
              remains unsupported.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM015
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM015
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM015
              - CM016
      - number: '2.3'
        title: Buyers, adoption drivers and constraints
        blocks:
          - type: paragraph
            body: >-
              The consumer buyer is the traveler, the user is the traveler or trip organizer, and the payer is usually
              the traveler; the adoption trigger is lower search and booking friction, localized inventory, trusted
              information and access to experiences. On the enterprise side, the buyer and budget owner are hotel
              groups, independent properties and travel operators, while operations, reservations, revenue-management
              and distribution teams are the users. Hotel Tech Report describes Yanolja Cloud Solution as a cloud PMS
              spanning front desk, reservations, billing, housekeeping, OTA integration and reporting. Forbes reports 13
              million monthly users for NOL Universe, indicating a substantial consumer discovery surface without
              establishing transaction volume or market share. The principal drivers are mobile-first behavior,
              international demand, experience bundling, cloud migration and AI-enabled personalization or operational
              efficiency. Constraints are equally material: fragmented supplier data, payment and fraud complexity,
              paid-acquisition volatility, dependence on airline and lodging inventory, switching costs, and regulation
              of platform bargaining power. KoreaTechDesk reports a prosecutor search tied to coupon advertising and
              says the FTC had imposed a KRW 540 million fine on Yanolja in August 2025; this is an adverse adoption and
              trust signal, not proof that the allegations will ultimately be sustained. Sedaily also reports that
              Yanolja is reducing emphasis on simple booking to expand enterprise solutions amid geopolitical risk,
              higher airfares and a weak won.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM009
              - CM010
              - CM011
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The investable market is a connected wedge, not the headline TAM
            body: >-
              The strongest market logic is the intersection of Asia-Pacific digital travel demand and software that
              helps fragmented suppliers distribute and operate inventory. Headline OTA estimates frame ceiling, but
              they do not establish Yanolja's serviceable share, unit economics or enterprise ARR.
            calloutType: insight
            claimRefs:
              - CM005
              - CM007
              - CM009
          - type: callout
            title: Market scale is not yet a disclosed company outcome
            body: >-
              Conflicting external market denominators, limited public segmentation of Yanolja's enterprise business,
              and active scrutiny of partner-promotion practices make a precise market-to-valuation bridge unavailable.
            calloutType: risk
            claimRefs:
              - CM006
              - CM012
              - CM013
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and strategic position
        blocks:
          - type: paragraph
            body: >-
              Yanolja's competitive set is layered. In consumer travel, it faces global online travel agencies and
              regional platforms that compete on inventory, traffic, price, and loyalty. In enterprise hospitality, it
              competes with hotel property-management, revenue-management, and channel-connectivity specialists. A third
              layer consists of hotel groups' direct channels, internal technology teams, and manual operating
              processes. Yanolja's own materials describe a travel-enablement platform that connects enterprises and
              travelers, while current trade coverage separates Yanolja Cloud Solution (YCS) hotel operations technology
              from Yanolja Go Global (YGG) B2B accommodation distribution. This creates a potentially differentiated
              cross-sell path: the same group can automate hotel operations and connect inventory to international
              sellers. NAVER's reach across search, commerce, fintech, content, and cloud also makes broad Korean
              digital ecosystems a plausible adjacent entrant class, although the assigned evidence does not establish a
              comparable hotel-operations product. The evidence does not establish that Yanolja's integrated proposition
              wins every buying situation; specialist vendors may still be preferred where a hotel wants a best-of-breed
              PMS or a neutral distributor. The relevant moat is therefore workflow data, implementation know-how,
              partner connectivity, and customer switching friction—not the existence of AI language alone.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP006
              - CP007
              - CP012
      - number: '3.2'
        title: Peer profiles, capabilities, and limitations
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a capability comparison more confidently than a like-for-like price comparison.
              YCS presents AI-enabled hotel operations, including an AI Concierge connected to its property-management
              system, while YGG presents accommodation supply and API/XML connectivity for travel agencies and
              retailers. The Swosti agreement is a concrete customer proof point: reservations, check-in, dynamic
              pricing, and other operations were to be consolidated across a five-hotel, 466-room group. Yanolja also
              acquired Go Global Travel, whose reported inventory and travel-agent connections broaden the distribution
              footprint. Global OTAs such as Booking Holdings and Airbnb remain relevant demand-side comparators, but
              the assigned evidence does not provide a current, comparable feature or realized-price schedule for them.
              The matrix therefore marks unsupported cells as unknown rather than converting brand presence into a
              product claim. Yanolja's reported enterprise-solutions revenue growth and restructuring toward data and AI
              indicate strategic focus, but they do not prove durable share gain or superior customer economics.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
              - CP006
              - CP008
              - CP011
              - CP015
              - CP016
      - number: '3.3'
        title: Differentiation durability, switching costs, and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The durability case depends on integration depth and distribution density. A hotel that connects
              reservations, check-in, room-rate adjustments, channel connectivity, and guest services in one operating
              system may face meaningful migration and training costs. Yanolja's reported presence across more than 130
              countries for YCS and more than 200 countries in the group's own positioning suggest breadth, but the two
              figures use different source wording and should not be treated as the same denominator. YGG's 29-location
              network and 26 years of industry experience are commercial assets, yet network breadth can be replicated
              by large distributors and does not by itself prove exclusivity. Multi-homing remains plausible because
              hotels and travel retailers can use multiple OTAs, channel managers, and direct channels. Competitive
              pressure is also visible in travel-plus-entertainment: WiT reports Trip.com Group's strategic partnership
              with Live Nation Asia, a model that could contest NOL Universe's events-led differentiation. Finally,
              Korea's coupon-advertising investigation shows that partner economics and regulatory posture are part of
              the competitive product: fines, administrative litigation, and a criminal investigation can raise
              switching, trust, and enterprise-sales friction even before a final legal finding. This is adverse
              evidence, not a conclusion that wrongdoing has been established.
            claimRefs:
              - CP012
              - CP013
              - CP014
              - CP015
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP008
              - CP012
              - CP013
              - CP015
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP008
              - CP013
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Integrated wedge
            body: >-
              Yanolja's combination of hotel workflow software and B2B distribution gives it a credible cross-sell wedge
              that pure consumer OTAs and single-purpose hotel tools may not match.
            calloutType: strength
            claimRefs:
              - CP002
              - CP006
              - CP007
          - type: callout
            title: Differentiation is contestable
            body: >-
              Travel-plus-entertainment packaging, global distribution, and AI-enabled hotel operations are all being
              pursued by or remain available to competitors; durable advantage requires customer retention, unit
              economics, and implementation proof.
            calloutType: risk
            claimRefs:
              - CP010
              - CP013
              - CP014
          - type: callout
            title: Partner governance can weaken the moat
            body: >-
              The reported coupon investigation and prior fine create a material trust and regulatory diligence item for
              a platform whose distribution advantage depends on hotel-partner relationships.
            calloutType: risk
            claimRefs:
              - CP015
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue architecture and monetization
        blocks:
          - type: paragraph
            body: >-
              Yanolja operates two economically different engines: a consumer travel platform and enterprise travel
              technology. Independent reporting says the consumer model historically monetized booking activity through
              commissions and charges to hotels and travel companies for advertising, while the official group site now
              frames the wider company as a data-powered travel enablement platform. Company-announced 2024 results
              attributed KRW 671.2 billion of revenue to Consumer Platform and KRW 292.6 billion to Enterprise
              Solutions. Those figures establish scale and mix, but not realized commission rates, software contract
              units, gross-versus-net presentation, or the share of recurring revenue. The underwriting case therefore
              depends less on a single blended revenue multiple and more on separating marketplace economics from
              software and distribution economics.
            claimRefs:
              - CI001
              - CI002
              - CI004
              - CI006
              - CI008
