  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Current scale and enterprise momentum pass through valuation, terms, and legal-risk gates before reaching a track
      decision.
    data:
      nodes:
        - id: scale
          label: Scale signal
          detail: Forbes reports 13M monthly NOL Universe users and software used by tens of thousands of hotels.
        - id: operating-proof
          label: Operating proof
          detail: First-half 2026 enterprise-solutions revenue reportedly grew 12.8% to KRW 148.9B.
        - id: price-anchor
          label: Historical price anchor
          detail: The $9.0B post-money reference dates to July 2021.
        - id: terms-gate
          label: Terms gate
          detail: Current price, fully diluted ownership, preferences, and net debt are unavailable.
        - id: risk-gate
          label: Risk gate
          detail: Coupon-advertising enforcement and litigation remain unresolved.
        - id: decision
          label: Track / research more
          detail: Require current terms and operating economics before underwriting a return.
      edges:
        - from: scale
          to: operating-proof
          label: needs monetization proof
        - from: operating-proof
          to: price-anchor
          label: tested against
        - from: price-anchor
          to: terms-gate
          label: requires current terms
        - from: terms-gate
          to: risk-gate
          label: adjust for
        - from: risk-gate
          to: decision
          label: supports
    approximationNotes: The flow is qualitative and does not imply a calculated valuation or probability.
    claimRefs:
      - CV001
      - CV004
      - CV007
      - CV008
      - CV009
      - CV010
      - CV012
      - CV013
      - CV016
