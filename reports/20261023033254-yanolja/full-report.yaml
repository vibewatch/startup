    title: Evidence-backed competitive positioning
    type: quadrant
    summary: >-
      Yanolja's position is strongest where hotel operations, travel distribution, and data integration overlap, while
      pure consumer scale and specialist depth remain contested or unproven.
    data:
      xAxis: Integrated travel-platform breadth
      yAxis: Enterprise workflow depth
      points:
        - label: Yanolja
          x: 4
          'y': 4
          note: Evidence spans NOL consumer platform, YCS hotel operations, and YGG distribution.
        - label: Global OTA peers
          x: 5
          'y': 1
          note: Demand and inventory breadth are the relevant comparison; enterprise workflow depth is not evidenced here.
        - label: Hotel-tech specialists
          x: 2
          'y': 5
          note: Workflow depth is the relevant comparison; broad consumer demand is not evidenced here.
        - label: B2B distributors
