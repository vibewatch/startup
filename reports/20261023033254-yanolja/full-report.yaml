  - id: FO001
    title: Selected company milestones
    type: timeline
    summary: >-
      Yanolja progressed from a 2005 motel-industry venture to a global travel-technology group through financing,
      acquisitions, enterprise expansion and AI-focused restructuring.
    data:
      items:
        - date: '2005'
          label: Founded
          detail: Lee Su-jin founded Yanolja after building an online motel-industry community.
          tone: neutral
          claimRefs:
            - CO001
        - date: '2015'
          label: First external financing
          detail: Partners Investment provided the first reported external financing of KRW 10bn.
          tone: positive
          claimRefs:
            - CO009
        - date: '2019'
          label: Series D and enterprise expansion
          detail: GIC and Booking Holdings led a USD 180m round; Yanolja Cloud was founded for hospitality solutions.
          tone: positive
