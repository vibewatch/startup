  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Yanolja was founded in 2005 by Lee Su-jin and is headquartered in Seoul. The group combines a consumer
              travel and leisure marketplace, now described in public materials as NOL Universe, with Yanolja Cloud
              enterprise software for hotels and travel companies. Its revenue model is mixed: commissions and
              advertising fees on consumer bookings, plus licensing, subscriptions, transaction fees, hardware and
              maintenance in enterprise solutions. This two-sided structure gives Yanolja access to both travel demand
              and hospitality operating data, but the sources do not establish a clean segment-level cash or
              recurring-revenue bridge.
