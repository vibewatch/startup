  - id: FE001
    title: Current-to-roadmap product architecture
    type: stack
    summary: Six operating layers connect traveler demand to hotel workflows, integrations, data, and emerging AI automation.
    data:
      layers:
        - label: Consumer demand
          detail: NOL and group travel surfaces connect travelers with accommodation and broader travel inventory.
          modules:
            - Search and discovery
            - Booking and offers
        - label: Booking and distribution
          detail: Direct booking, websites, channel management, and distribution connect property inventory to demand.
          modules:
            - Booking engine
            - Website builder
            - Channel manager
        - label: Hotel operating core
          detail: The shared data layer supports reservations, front desk, housekeeping, finance, payments, and folios.
          modules:
            - PMS
            - Payments
            - Operational reporting
        - label: On-property service
          detail: Restaurant POS, RapidServe, and concierge workflows extend the platform into guest service.
          modules:
            - eZee Optimus POS
            - RapidServe
            - AI concierge
        - label: Integration fabric
          detail: Open APIs, partner tools, and external distribution endpoints broaden the operating environment.
          modules:
            - Open API
            - Partner marketplace
            - OTA and GDS connections
        - label: Data and AI roadmap
          detail: Travel data is intended to power pricing, automated response, check-in, and agentic-AI workflows.
          modules:
            - Revenue optimization
            - AI customer response
            - Messenger check-in
            - Agentic AI
