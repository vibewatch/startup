            title: Promotion economics face conduct scrutiny
            body: >-
              The reported coupon-advertising investigation makes partner funding, expiry, refunds, and settlement terms
              a financial as well as regulatory diligence item.
            calloutType: risk
            claimRefs:
              - CI014
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: A two-sided travel and hospitality product surface
        blocks:
          - type: paragraph
            body: >-
              Yanolja's product is best understood as two connected surfaces rather than a single travel app. The group
              presents a data-powered travel-enablement platform for both travelers and travel enterprises, while
              Yanolja Cloud Solution supplies the hotel operating layer. That enterprise layer covers property
              management, inventory distribution, direct-booking websites, payments, point of sale, and an AI concierge.
              The workflow proposition is therefore end to end: attract a traveler, expose inventory across channels,
              convert the booking, operate the stay, settle transactions, and retain the resulting operational data.
              External reporting supports the strategic importance of the hospitality-software side, but the retained
              evidence does not establish product-level revenue, attach rates, or module adoption.
            claimRefs:
              - CE001
              - CE002
              - CE011
              - CE013
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE007
              - CE008
              - CE009
              - CE011
              - CE013
      - number: '5.2'
        title: Shared data, open integrations, and operational workflows
        blocks:
          - type: paragraph
            body: >-
              The architecture described publicly centers on a shared hotel data layer rather than isolated point tools.
              Yanolja Cloud Solution says its property-management, channel-management, booking-engine, payments,
              point-of-sale, and concierge products use the same guest, inventory, and folio records. An open API, a
              claimed network of more than 650 integration partners, and more than 160 distribution channels extend that
              core. Pricepoint demonstrates one partner pattern: it consumes Yanolja Cloud infrastructure and property
              data to automate hourly rate changes. RapidServe provides another concrete edge workflow, allowing
              restaurant staff to take orders offline and synchronize them with the cloud POS after connectivity
              returns. These examples show integration breadth, but not API availability, latency, data-residency
              controls, or failure isolation.
            claimRefs:
              - CE002
              - CE003
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE006
              - CE007
              - CE008
              - CE009
              - CE016
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
              - CE006
              - CE008
              - CE010
              - CE014
              - CE015
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE003
              - CE011
              - CE012
              - CE014
      - number: '5.3'
        title: Operational maturity is visible, but performance proof is mostly self-reported
        blocks:
          - type: paragraph
            body: >-
              Product maturity has several observable signals. AppBrain records continued RapidServe releases through
              August 2026, while Capterra lists a wide PMS feature surface spanning reservations, channel management,
              APIs, payments, reporting, permissions, and mobile access. Yanolja Cloud Solution claims a sub-seven-day
              deployment with data migration and 99.99% platform uptime, but the retained sources provide no independent
              uptime history, status-page record, SLA terms, or measurement methodology. User feedback on RapidServe is
              mixed and includes reports of missing day-close functionality, repeated update prompts, lag, printing
              failures, and inability to close daily reports. Those reports are anecdotal rather than an incident
              census, yet they identify operational failure modes that should be tested during technical diligence.
            claimRefs:
              - CE004
              - CE005
              - CE007
              - CE009
              - CE016
      - number: '5.4'
        title: Differentiation rests on breadth and data, while control evidence lags
        blocks:
          - type: paragraph
            body: >-
              Yanolja's defensibility thesis is the combination of global hospitality workflows, distribution
              connectivity, and travel data that can support automation across the operating stack. Management has
              framed "Yanolja 3.0" around AI and reorganized the business into enterprise-solutions and
              consumer-platform divisions; subsequent reporting says resources are shifting toward travel-data and
              agentic-AI capabilities. The roadmap includes smart distribution, a B2B marketplace, booking-conversion
              UX, API-based data management, AI customer response, and messenger-based check-in. However, the public
              evidence reviewed does not establish security certifications, penetration testing, privacy architecture,
              model-governance controls, or disaster-recovery objectives. Separately, the criminal investigation into
              coupon-funded advertising highlights that platform-control design must cover partner economics and
              settlement transparency, not only software reliability.
            claimRefs:
              - CE010
              - CE012
              - CE014
              - CE015
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Reliability claims need independent proof
            body: >-
              The published 99.99% uptime and sub-seven-day deployment metrics lack a retained SLA, status history,
              denominator, or independent audit.
            calloutType: risk
            claimRefs:
              - CE004
              - CE005
          - type: callout
            title: Platform controls extend beyond cybersecurity
            body: >-
              The coupon-advertising investigation makes settlement logic, partner disclosures, and economic-risk
              allocation part of the product-control diligence scope.
            calloutType: risk
            claimRefs:
              - CE015
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and value exchange
        blocks:
          - type: paragraph
            body: >-
              Yanolja's customer base is best understood as a B2B2C system rather than one homogeneous account set.
              Travelers are the end users of accommodation, leisure, transportation, and related booking services, while
              hotels, restaurants, residences, golf and leisure operators are the operating customers for cloud
              products. The company describes its platform as connecting travel enterprises and travelers across more
              than 200 countries, while the CEO interview describes subscription, transaction, and data solutions for
              hotels and travel operators. This creates several value exchanges: software buyers seek operating
              efficiency and distribution; channel partners seek inventory access; travelers seek availability,
              convenience, and personalization. The evidence supports segment existence and product scope, but not
              customer-level revenue bands or payer economics.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU005
              - CU006
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU002
              - CU003
              - CU013
              - CU014
      - number: '6.2'
        title: Adoption trajectory and operating proof
        blocks:
          - type: paragraph
            body: >-
              Adoption evidence is stronger for reach and product usage than for durable account economics. A company
              interview reports Yanolja Cloud licenses increasing from 39,000 in 2019 to more than 80,000, with presence
              in more than 170 countries; a 2025 independent interview reports more than 1.3 million partners across 206
              countries and a 62% year-on-year increase in cloud business for 2024. HotelTechReport provides a large
              review sample for the channel manager, while AppBrain gives a smaller but observable mobile-product signal
              for RapidServe. These are distinct indicators and should not be combined into one customer count:
              licenses, partners, reviews, installs, and transaction volume use different populations and denominators.
              Public evidence does not establish active monthly accounts, renewal cohorts, or the share of partners
              using multiple products.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
      - number: '6.3'
        title: Named customer proof and retention limits
        blocks:
          - type: paragraph
            body: >-
              Named customer evidence shows that Yanolja Cloud products are used in operating hotel contexts, but the
              available material is largely marketplace or review evidence rather than audited deployment proof.
              HotelTechReport names Decker Hotel & Bar, Amaka Calma Tulum, and Hi Chiangrai Hotel among properties
              associated with the channel manager and reports high recommendation rates; the same page describes
              real-time synchronization, centralized pricing, and support observations from reviewers. AppBrain includes
              a user statement that eZee RapidServe was used across nine properties and another that the service helped
              hotel and restaurant departments. These signals support product use and perceived utility, not contract
              size, production scope, or renewal. Yanolja's public materials do not provide NRR, GRR, churn, renewal
              rate, contract length, cohort retention, or customer concentration, so durability remains a material
              diligence gap.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
      - number: '6.4'
        title: Expansion, procurement, and concentration risk
        blocks:
          - type: paragraph
            body: >-
              The expansion case rests on cross-selling software, transaction connectivity, and data services across a
              geographically broad partner base. The Korea Herald describes distribution connections to Trip.com and
              Agoda and a model that charges commissions when bookings succeed, while Yanolja's CEO has described
              localization by language, currency, payments, and local distribution systems. That breadth can reduce
              single-market dependence, but it also increases implementation and procurement complexity. A 2026 report
              says enterprise-solutions revenue reached 148.9 billion won in the first half, while a separate report
              describes a regulatory investigation into coupon advertising practices affecting more than 2,500 lodging
              businesses. The latter is not evidence of churn, but it is a customer-relationship and governance risk
              that could affect partner trust. No public source identifies top-customer concentration or channel
              dependence.
            claimRefs:
              - CU013
              - CU014
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Broad distribution footprint with observable product use
            body: >-
              Yanolja has evidence of international software reach, named hotel properties, third-party reviews, and a
              measurable mobile-product footprint; the signals are complementary but not interchangeable.
            calloutType: strength
            claimRefs:
              - CU005
              - CU009
              - CU010
          - type: callout
            title: Retention and concentration remain unverified
            body: >-
              The public record does not disclose customer cohorts, renewal economics, NRR, churn, or the contribution
              of the largest accounts, and a partner promotion investigation adds a relationship risk that merits direct
              diligence.
            calloutType: risk
            claimRefs:
              - CU012
              - CU015
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk assessment
        blocks:
          - type: paragraph
            body: >-
              Regulatory conduct is the highest-evidence risk. KoreaTechDesk reports that prosecutors searched Yanolja
              and Yeogi Eottae over coupon-funded advertising after the Korea Fair Trade Commission imposed
              administrative penalties; the companies are challenging those penalties, so the record does not establish
              final liability. Privacy and AI governance rank next because Korean legal sources describe tougher breach,
              executive accountability, certification, and AI-service obligations while Yanolja presents itself as a
              global data and AI platform. Execution risk is also material: Seoul Economic Daily reports a portfolio
              restructuring amid geopolitical risk, higher airfares, and a weak won. Severity reflects evidenced
              exposure and potential impact, not a disclosed company probability.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR010
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR006
              - CR010
              - CR013
              - CR014
      - number: '7.2'
        title: Legal, regulatory, and data exposure
        blocks:
          - type: paragraph
            body: >-
              The coupon matter combines enforcement, partner economics, and reputation. The report says lodging
              businesses funded consumer coupons through advertising fees and that unused value could expire without
              refund; it further says more than 2,500 lodging businesses may have been affected. Possible fraud,
              embezzlement, or breach-of-trust theories were described as expert commentary rather than confirmed
              charges. Separately, DLA Piper reports that specified serious PIPA violations can attract penalties up to
              10% of total revenue, and Chambers describes Korea's AI Framework Act as effective from January 2026.
              Neither source proves a Yanolja breach or violation. The diligence test is therefore company-specific
              applicability, controls, incident history, and remediation evidence rather than the existence of the laws
              alone.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR010
              - CR011
              - CR012
      - number: '7.3'
        title: Operating, partner, and financial-model risk
        blocks:
          - type: paragraph
            body: >-
              Yanolja's scale increases both resilience and blast radius. The company says its solutions reach more than
              200 countries, while its About page says its transaction network links 1.3 million travel enterprises to
              more than 18,000 sales channels. Forbes reports 13 million monthly NOL Universe users. Those figures use
              different populations and cannot be combined into a funnel or concentration measure. A company-issued
              acquisition release adds more than one million travel products and over 20,000 client partners through Go
              Global Travel, creating integration and counterparty dependencies. Seoul Economic Daily reports
              enterprise-solutions revenue of KRW 148.9 billion for the first half, up 12.8% year over year, but also
              describes portfolio changes and macro pressure. Revenue growth is not evidence of retention, uptime, cash
              generation, or integration quality.
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR007
              - CR008
              - CR013
              - CR014
      - number: '7.4'
        title: Mitigations, monitoring, and thesis-break criteria
        blocks:
          - type: paragraph
            body: >-
              Monitoring should privilege auditable outcomes. For the coupon matter, obtain the prosecutor and regulator
              records, partner remediation terms, and any repeat-practice testing. For privacy and AI, require a
              data-flow map, cross-border transfer basis, breach log, board and CPO materials, ISMS-P applicability
              assessment, model inventory, evaluation results, and human-escalation evidence. For operations, request
              uptime, severity-one incidents, migrations, support backlog, churn, partner concentration, and
              acquired-product cohort data. A final adverse legal disposition requiring material partner remediation, a
              reportable data incident without timely containment, or sustained enterprise reliability and retention
              deterioration during restructuring would break the present thesis. The assigned Reddit retrieval yielded
              only a generic subreddit description, and a third-party profile says the shareholder register is not
              public; neither can substitute for primary financing or governance diligence.
            claimRefs:
              - CR005
              - CR006
              - CR010
              - CR012
              - CR014
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Primary thesis-break risk
            body: >-
              A final regulatory or criminal finding that requires material partner remediation would challenge both
              compliance maturity and marketplace economics; current reporting establishes an investigation, not
              liability.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: callout
            title: No clean-control inference
            body: >-
              Public sources do not establish Yanolja's complete incident record, control effectiveness, customer
              retention, counterparty concentration, or fully diluted governance rights.
            calloutType: assumption
            claimRefs:
              - CR012
              - CR014
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Price-sensitive recommendation
        blocks:
          - type: paragraph
            body: >-
              The evidence supports tracking Yanolja, not underwriting an entry at the last reported mark. Forbes
              reports 13 million monthly NOL Universe users, hospitality software used by tens of thousands of hotels,
              and nearly $2 billion of backing. Seoul Economic Daily adds a current operating signal:
              enterprise-solutions revenue reached KRW 148.9 billion in the first half of 2026, up 12.8% year over year.
              Yanolja itself says its solutions reach more than 200 countries. Those indicators support a thesis that
              consumer distribution and enterprise software could create a differentiated travel platform. They do not,
              however, establish recurring revenue quality, segment margins, cash generation, or a current equity value.
              The anti-thesis is therefore price and proof: a stale private financing mark, incomplete ownership terms,
              and unresolved regulatory exposure can overwhelm otherwise credible strategic assets.
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV008
              - CV009
              - CV010
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV012
              - CV013
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV007
              - CV008
              - CV012
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV007
              - CV008
              - CV009
              - CV010
              - CV012
              - CV013
              - CV016
      - number: '8.2'
        title: Financing context, ownership, and comparable limits
        blocks:
          - type: paragraph
            body: >-
              Silicon Valley Invest Club's profile traces the $9.0B post-money valuation to the July 2021 growth-equity
              round, while Web in Travel reported that SoftBank Vision Fund supplied $1.7 billion ahead of an
              anticipated IPO. That history is a financing reference, not evidence that an arm's-length buyer would pay
              the same price in October 2026. EquityZen's public page withholds the current valuation, stock price, cap
              table, and liquidity preferences behind accredited access. Dealroom provides only indicative ownership,
              including 24.9% for SoftBank Vision Fund 2 and 30.2% categorized as other or undisclosed. LeadIQ's
              $1B-$10B annual-revenue estimate is too broad to serve as a valuation denominator. The retained Booking
              Holdings and Airbnb investor-page text also contains no normalized revenue, EBITDA, net-cash, or
              market-value observations from which to calculate a current comparable multiple. Public evidence therefore
              does not support a precise valuation range, dilution model, or target return.
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
              - CV015
      - number: '8.3'
        title: Scenario logic without false precision
        blocks:
          - type: paragraph
            body: >-
              The bull case requires verified enterprise recurring growth, improving margins, and successful integration
              of acquired hotel-software assets; the reported InnKey footprint of more than 500 Indian hotel properties
              is a distribution signal, not proof of monetization. The base case treats Yanolja as strategically
              relevant but keeps a private company and disclosure discount until current financials and share terms are
              produced. The bear case combines weak software economics or multiple compression with legal and
              partner-remediation costs. Prosecutors searched Yanolja's offices in March 2026 over coupon-advertising
              practices, after a reported KRW 540 million Fair Trade Commission fine that Yanolja is challenging.
              Because the pool lacks current free cash flow, net debt, share count, preferences, and segment retention,
              scenario probabilities and numerical valuation endpoints would be invented rather than evidence-based.
            claimRefs:
              - CV004
              - CV007
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV004
              - CV007
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Exit readiness, diligence asks, and thesis breaks
        blocks:
          - type: paragraph
            body: >-
              Exit intent has historical support but current readiness is unproven. Web in Travel described the 2021
              SoftBank financing as preceding an IPO, while EquityZen continues to market access to Yanolja as a
              private-company investment. No current prospectus, timetable, arm's-length secondary mark, or audited IPO
              bridge appears in the assigned evidence. The restructuring reported by Seoul Economic Daily concentrates
              resources on travel data and AI and removes Dable from consolidation; that may sharpen the story but also
              complicates period-to-period comparability. Before entry, diligence should obtain the fully diluted cap
              table, preference waterfall, audited 2025 and 2026 interim financials, net debt, segment ARR or recurring
              revenue, churn, retention, concentration, and the latest legal record. Thesis breaks include an adverse
              legal disposition with material partner remediation, a down-round without offsetting operating
              improvement, or evidence that enterprise growth is not converting into durable gross profit and cash.
            claimRefs:
              - CV002
              - CV004
              - CV011
              - CV012
              - CV013
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not carry the 2021 mark forward
            body: >-
              The retained $9.0B post-money reference is historical; public evidence does not establish a current price,
              a preference-adjusted equity value, or a supportable target return.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV015
              - CV016
          - type: callout
            title: Legal outcome can affect partner economics
            body: >-
              The reported prosecutor search, prior fine, and ongoing legal challenge require a quantified exposure and
              remediation review before entry.
            calloutType: risk
            claimRefs:
              - CV012
              - CV013
