      - number: '4.2'
        title: Public traction and margin signals
        blocks:
          - type: paragraph
            body: >-
              Company-announced 2024 total transaction volume reached KRW 27.0 trillion, while consolidated revenue
              reached KRW 924.5 billion and adjusted EBITDA reached KRW 114.7 billion at a stated 12.4% margin.
              Enterprise Solutions was the stronger segment: revenue rose 62% to KRW 292.6 billion and adjusted EBITDA
              reached KRW 67.7 billion at 23.1%, versus 6% revenue growth for Consumer Platform. Independent 2026
              reporting adds that first-half Enterprise Solutions revenue rose 12.8% to KRW 148.9 billion. These metrics
              support a mix-shift thesis, but adjusted EBITDA is not cash generation, TTV is not revenue, and the
              retained evidence does not reconcile eliminations, recognition policy, gross margin, or free cash flow.
            claimRefs:
              - CI002
              - CI003
              - CI004
              - CI005
              - CI006
              - CI007
              - CI009
              - CI010
              - CI011
          - type: table
            tableRef: TI002
            claimRefs:
              - CI002
              - CI003
              - CI004
              - CI005
              - CI007
              - CI010
      - number: '4.3'
        title: Capital requirements and underwriting gaps
        blocks:
          - type: paragraph
            body: >-
              Historical financing provided substantial strategic capital: reporting records a US$1.7 billion SoftBank
              investment in 2021, followed by Yanolja's acquisition of a 70% Interpark stake for about US$250 million.
              Those transactions demonstrate access to capital and willingness to deploy it for platform expansion; they
              do not establish current cash availability or runway. The retained evidence provides no current cash
              balance, debt schedule, receivable aging, operating cash flow, burn rate, capex requirement, CAC, payback
              period, churn, net retention, or customer concentration. A credible capital-adequacy conclusion therefore
              requires current management accounts, a debt and liquidity bridge, and segment-level unit economics,
              rather than treating historical funding raised as cash on hand.
            claimRefs:
              - CI012
              - CI013
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
              - CI003
              - CI005
              - CI010
              - CI015
      - number: '4.4'
        title: Financial verdict and downside
        blocks:
          - type: paragraph
            body: >-
              The strongest public signal is that Enterprise Solutions is growing faster than the consumer platform and
              carries a company-stated adjusted EBITDA margin above the consolidated level. That may improve revenue
              quality if contracts are recurring and implementation or distribution costs are controlled, but neither
              condition is quantified publicly. The downside is not merely disclosure risk: a 2026 report says
              prosecutors searched Yanolja in a case involving partner-funded coupon advertising, following a 2025 Fair
              Trade Commission fine. That scrutiny could affect advertising economics or partner terms. The financial
              stance is therefore constructive on mix shift but not underwritable on liquidity, cash conversion, or
              durable unit economics without private evidence.
            claimRefs:
              - CI004
              - CI005
              - CI007
              - CI014
              - CI015
