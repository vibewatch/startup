      - [Enterprise Solutions, "Cloud, data, AI tools, and travel-enterprise solutions", "License, transaction, and distribution mix not disclosed", "KRW 292.6bn 2024 revenue; 62% YoY growth", "Faster growth and higher stated adjusted EBITDA margin", "ARR, recurring mix, implementation cost, churn, NRR"]
      - [Travel inventory distribution, "Supply of hotel, airline, rental-car, and related inventory", "Gross versus net recognition not disclosed", "Reported within the enterprise portfolio", "Potentially high volume but recognition-sensitive", "TTV scope, supplier terms, working-capital exposure"]
      - [Partner advertising coupons, "Lodging partners fund promotion through advertising fees", "Reported coupon value of 10%-25% of advertising fee", "Subject to regulatory and prosecutorial scrutiny", "Monetization carries partner-economics and conduct risk", "Refund policy, affected revenue, remediation, legal exposure"]
    notes: "Company-announced segment figures and independent reporting; contract units, realized pricing, recognition policy, and recurring mix are not publicly disclosed."
    claimRefs: [CI001, CI002, CI004, CI006, CI007, CI008, CI014]
  - id: TI002
    title: Public monetization and margin signals
    columns:
      - Metric
      - Period
      - Reported value
      - Interpretation
      - Limitation
    rows:
      - [Consolidated revenue, "FY2024", "KRW 924.5bn; +22% YoY", "Material travel-technology scale", "Company-announced; recognition bridge unavailable"]
      - [Total transaction volume, "FY2024", "KRW 27.0tn; +186% YoY", "Large activity base", "TTV scope and comparability to revenue not reconciled"]
      - [Consolidated adjusted EBITDA, "FY2024", "KRW 114.7bn; 12.4% margin", "Positive adjusted operating-profit proxy", "Not operating cash flow or free cash flow"]
      - [Enterprise Solutions adjusted EBITDA, "FY2024", "KRW 67.7bn; 23.1% margin", "Stronger stated segment economics", "Adjustments and segment cost allocation unavailable"]
      - [Enterprise Solutions revenue, "H1 2026", "KRW 148.9bn; +12.8% YoY", "Continued growth after 2024 step-up", "Half-year figure; no EBITDA or cash conversion provided"]
    notes: "Values preserve the source periods and metric labels; adjusted EBITDA is not treated as cash flow, and TTV is not treated as revenue."
    claimRefs: [CI002, CI003, CI004, CI005, CI007, CI010]
  - id: TI003
    title: Unit economics and capital-adequacy diligence
    columns:
      - Metric
      - Public value
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - [Consumer take rate, null, Unavailable, "Links TTV to marketplace revenue quality", "Net revenue and TTV by product, refunds, incentives"]
      - [Enterprise ARR and recurring mix, null, Unavailable, "Separates software durability from distribution volume", "ARR, bookings, recurring share, contract duration"]
      - [CAC and payback, null, Unavailable, "Tests whether growth creates economic value", "CAC by segment, fully loaded sales cost, cohort payback"]
      - [Gross margin by segment, null, Unavailable, "Tests software mix and service-delivery intensity", "Revenue recognition and direct-cost bridge"]
      - ["Cash, debt, and runway", null, Unavailable, "Determines financing dependency and next-round timing", "Current cash, restricted cash, debt schedule, monthly burn"]
      - [Working capital and cash conversion, null, Unavailable, "Travel settlement timing can create liquidity volatility", "Receivable aging, supplier payables, customer-fund treatment"]
    notes: "Null means the retained public evidence did not disclose a decision-useful value; each row states the private diligence item required to close the gap."
    claimRefs: [CI003, CI005, CI010, CI015]
