company:
  name: Yanolja
chapter:
  number: 4
  title: Financials
  summary: >-
    Yanolja's company-announced 2024 results show a large consumer travel platform
    alongside a faster-growing, higher-margin Enterprise Solutions segment. The
    evidence supports improving adjusted EBITDA and enterprise mix, but current cash,
    debt, burn, revenue-recognition detail, and core unit economics remain unavailable.
sections:
  - id: revenue-architecture
    title: Revenue architecture and monetization
    body: >-
      Yanolja operates two economically different engines: a consumer travel platform
      and enterprise travel technology. Independent reporting says the consumer model
      historically monetized booking activity through commissions and charges to hotels
      and travel companies for advertising, while the official group site now frames the
      wider company as a data-powered travel enablement platform. Company-announced 2024
      results attributed KRW 671.2 billion of revenue to Consumer Platform and KRW 292.6
      billion to Enterprise Solutions. Those figures establish scale and mix, but not
      realized commission rates, software contract units, gross-versus-net presentation,
      or the share of recurring revenue. The underwriting case therefore depends less on
      a single blended revenue multiple and more on separating marketplace economics from
      software and distribution economics.
    claimRefs: [CI001, CI002, CI004, CI006, CI008]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: traction-and-margin
    title: Public traction and margin signals
    body: >-
      Company-announced 2024 total transaction volume reached KRW 27.0 trillion, while
      consolidated revenue reached KRW 924.5 billion and adjusted EBITDA reached KRW
      114.7 billion at a stated 12.4% margin. Enterprise Solutions was the stronger
      segment: revenue rose 62% to KRW 292.6 billion and adjusted EBITDA reached KRW 67.7
      billion at 23.1%, versus 6% revenue growth for Consumer Platform. Independent 2026
      reporting adds that first-half Enterprise Solutions revenue rose 12.8% to KRW 148.9
      billion. These metrics support a mix-shift thesis, but adjusted EBITDA is not cash
      generation, TTV is not revenue, and the retained evidence does not reconcile
      eliminations, recognition policy, gross margin, or free cash flow.
    claimRefs: [CI002, CI003, CI004, CI005, CI006, CI007, CI009, CI010, CI011]
    tableRefs: [TI002]
  - id: capital-and-unit-economics
    title: Capital requirements and underwriting gaps
    body: >-
      Historical financing provided substantial strategic capital: reporting records a
      US$1.7 billion SoftBank investment in 2021, followed by Yanolja's acquisition of a
      70% Interpark stake for about US$250 million. Those transactions demonstrate access
      to capital and willingness to deploy it for platform expansion; they do not
      establish current cash availability or runway. The retained evidence provides no
      current cash balance, debt schedule, receivable aging, operating cash flow, burn
      rate, capex requirement, CAC, payback period, churn, net retention, or customer
      concentration. A credible capital-adequacy conclusion therefore requires current
      management accounts, a debt and liquidity bridge, and segment-level unit economics,
      rather than treating historical funding raised as cash on hand.
    claimRefs: [CI012, CI013, CI015]
    tableRefs: [TI003]
  - id: financial-verdict
    title: Financial verdict and downside
    body: >-
      The strongest public signal is that Enterprise Solutions is growing faster than the
      consumer platform and carries a company-stated adjusted EBITDA margin above the
      consolidated level. That may improve revenue quality if contracts are recurring and
      implementation or distribution costs are controlled, but neither condition is
      quantified publicly. The downside is not merely disclosure risk: a 2026 report says
      prosecutors searched Yanolja in a case involving partner-funded coupon advertising,
      following a 2025 Fair Trade Commission fine. That scrutiny could affect advertising
      economics or partner terms. The financial stance is therefore constructive on mix
      shift but not underwritable on liquidity, cash conversion, or durable unit economics
      without private evidence.
    claimRefs: [CI004, CI005, CI007, CI014, CI015]
