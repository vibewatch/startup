callouts:
  - calloutType: recommendation
    title: Underwrite the segments separately
    body: >-
      Request a segment bridge from TTV to net revenue, gross profit, adjusted EBITDA,
      operating cash flow, and free cash flow before applying a blended valuation multiple.
    claimRefs: [CI003, CI004, CI005, CI006, CI010, CI015]
  - calloutType: risk
    title: Promotion economics face conduct scrutiny
    body: >-
      The reported coupon-advertising investigation makes partner funding, expiry,
      refunds, and settlement terms a financial as well as regulatory diligence item.
    claimRefs: [CI014]
