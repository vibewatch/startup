evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: A current fully diluted cap table, board register, liquidation preferences and investor control rights.
    whyItMatters: Ownership and control determine dilution, exit economics and founder key-person exposure.
    diligencePath: Obtain the latest shareholder register, articles, preferred-share terms and board minutes under NDA.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: stale
    severity: material
    topic: financials
    missingEvidence: Audited 2025 and interim 2026 financial statements with net debt, cash conversion and segment reconciliation.
    whyItMatters: 2024 revenue and transaction volume do not establish current profitability, liquidity or ARR.
    diligencePath: Request management accounts, cash-flow statements, debt schedule and enterprise recurring-revenue bridge.
    relatedQuestionRefs:
      - QO005
      - QO008
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: regulatory
    missingEvidence: Primary prosecutor, court or regulator records resolving the coupon-practices investigation and penalties.
    whyItMatters: Reported allegations and penalties may change the company’s legal exposure and partner economics.
    diligencePath: Obtain case-numbered filings, regulator decisions and Yanolja's formal response or settlement disposition.
    relatedQuestionRefs:
      - QO007
  - type: enumeration-incomplete
    severity: minor
    topic: leadership
    missingEvidence: A complete current executive, board and subsidiary leadership roster.
    whyItMatters: Leadership changes and succession depth affect execution and key-person dependence.
    diligencePath: Request the current organization chart, board roster and appointment dates from the company.
    relatedQuestionRefs:
      - QO003
      - QO008
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      Yanolja-specific consumer gross bookings, take rate, enterprise ARR, customer count, retention and geographic
      revenue split.
    whyItMatters: >-
      Without company segment economics, external market values cannot be translated into a defensible SAM, SOM or
      valuation bridge.
    diligencePath: >-
      Request management's segment revenue bridge, bookings and take-rate history, enterprise ARR and retention cohort
      data, and geography/customer concentration.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: ota-sizing
    missingEvidence: >-
      A reconciled OTA market definition explaining why Mordor Intelligence and Grand View Research produce different
      2026 and terminal values.
    whyItMatters: >-
      The denominator affects any implied market share or growth multiple and currently makes headline TAM comparisons
      unreliable.
    diligencePath: >-
      Obtain both publishers' inclusion rules, currency and gross-booking versus revenue conventions, then normalize the
      estimates on one basis.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: enterprise-adoption
    missingEvidence: >-
