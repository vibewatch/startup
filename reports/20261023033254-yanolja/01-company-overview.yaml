company:
  name: Yanolja
chapter:
  number: 1
  title: Company Overview
  summary: Yanolja is a privately held Seoul travel-technology group combining the NOL consumer marketplace with a global hospitality-software business. Current evidence shows meaningful enterprise scale and growth, but private-company disclosure remains incomplete and a 2026 investigation creates a material governance overhang.
sections:
  - id: identity-and-business-model
    title: Identity and business model
    body: >-
      Yanolja was founded in 2005 by Lee Su-jin and is headquartered in Seoul. The group combines a consumer travel and leisure marketplace, now described in public materials as NOL Universe, with Yanolja Cloud enterprise software for hotels and travel companies. Its revenue model is mixed: commissions and advertising fees on consumer bookings, plus licensing, subscriptions, transaction fees, hardware and maintenance in enterprise solutions. This two-sided structure gives Yanolja access to both travel demand and hospitality operating data, but the sources do not establish a clean segment-level cash or recurring-revenue bridge.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: leadership-and-control
    title: Leadership, founders and control
    body: Lee Su-jin remains the central founder and group CEO in the strongest current profile evidence, while public 2024 results identify Sujin Lee as chairman and CEO and Jeff Kim as CEO of Yanolja Cloud. Earlier reporting also identified Kim Jong-yoon as Yanolja Cloud CEO and David Solomito as global chief marketing officer, showing functional depth but not a complete current executive roster. The public record does not provide a fully diluted cap table, liquidation preferences, board composition, or investor control rights, so founder influence and key-person dependence cannot be quantified precisely.
    claimRefs: [CO005, CO006, CO007, CO008]
    tableRefs: [TO002]
  - id: funding-scale-and-milestones
    title: Funding, scale and milestones
    body: Yanolja's disclosed financing history runs from early Korean venture rounds to a $180 million 2019 round led by GIC and Booking Holdings and SoftBank Vision Fund 2's $1.7 billion 2021 investment. Public 2024 results reported KRW 924.5 billion of consolidated operating revenue and KRW 27.0 trillion of aggregate transaction volume, while enterprise solutions revenue reached KRW 292.6 billion. These are not interchangeable with ARR, cash raised, or cash available. Acquisition-led expansion and later restructuring broadened the platform, but current valuation, net debt and segment cash conversion remain insufficiently disclosed.
    claimRefs: [CO009, CO010, CO011, CO012, CO013]
    tableRefs: [TO003]
    figureRefs: [FO001]
  - id: risks-and-open-questions
    title: Governance risks and disclosure gaps
    body: The company faces a material governance question from a 2026 investigation into coupon advertising programs sold to lodging partners. The reported case follows 2025 administrative penalties and remains under legal review; allegations are not adjudicated findings, and possible additional charges discussed by legal observers were not confirmed. Separately, Yanolja restructured its portfolio around data and AI, excluding Dable from consolidated subsidiaries and emphasizing enterprise solutions, while its official library shows an active 2026 research publication program. The combination of regulatory uncertainty, consumer-platform economics, and limited private-company disclosure warrants a track posture until current financial, ownership and case outcomes are clearer.
    claimRefs: [CO014, CO015, CO016]
    figureRefs: []
callouts:
  - calloutType: strength
    title: Dual-engine platform
    body: Yanolja combines a Korean consumer travel marketplace with a global hospitality-software business, creating a differentiated demand-and-supply data position.
    claimRefs: [CO002, CO003, CO011]
  - calloutType: risk
    title: Governance and disclosure overhang
    body: The 2026 coupon-practices investigation is unresolved, while current ownership, debt, cash conversion and enterprise recurring-revenue metrics remain private.
    claimRefs: [CO014, CO016]
  - calloutType: recommendation
    title: Evidence-based stance
    body: The operating platform is substantial, but the available evidence supports tracking rather than underwriting a definitive valuation or control view.
    claimRefs: [CO011, CO014, CO016]
