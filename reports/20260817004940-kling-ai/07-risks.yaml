company:
  name: Kling AI
chapter:
  number: 7
  title: Risks
  summary: 'Kling AI’s risk stack is material even though growth and product proof are real. The highest-probability exposures are regulatory and legal: China’s labeling, filing, and data-governance regime is tightening; Kling’s own terms create customer-rights and availability risk; and the company still depends on Kuaishou, app stores, and a small set of marquee references while scaling toward an $18B valuation. Secondary but important risks include export-control sensitivity around advanced chips, operational strain from refunds/support complaints, and limited public evidence on enterprise assurance, standalone governance, and unit economics.'
sections:
- id: regulatory-and-legal-risk
  title: Regulatory and legal risk
  body: Kling operates in one of the most prescriptive AI governance environments in the world, and public evidence shows that compliance is not limited to vague principles. China’s 2025 labeling measures require explicit and implicit marking for AI-generated text, image, audio, video, and virtual scenes; app-distribution platforms must review labeling materials; and providers that supply unlabeled outputs under a user request must keep logs for at least six months. The broader Chinese regime is also expanding through generative-AI filing, deep-synthesis rules, data-security and privacy laws, and 2026 standard-setting activity. That matters because Kling is a public-facing generative-video service, not an internal tool. Its own legal documents add more risk. The service agreement says the product is offered on an as-is and as-available basis, the privacy policy confirms broad storage and processing of uploaded and generated content, and the terms require explicit membership and credit governance.
    For investors, the legal risk is therefore not just a hypothetical copyright debate. It is a live combination of content labeling, app review, data handling, user-rights, and contractual-friction obligations in a rapidly hardening regime.
  claimRefs:
