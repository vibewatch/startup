- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - risk
  - monitorable trigger
  - threshold/event
  - action implication
  rows:
  - - China compliance burden
    - Labeling, filing, or app-review noncompliance
    - Any formal enforcement, suspension, or failed listing/update event
    - Pause underwriting until control gap is remediated
  - - Customer trust erosion
    - Complaint intensity and unresolved billing/support disputes
    - Sustained deterioration in public reviews or rising chargeback / refund issues
    - Mark down consumer durability and margin quality
  - - Compute / export risk
    - Advanced-chip access tightens or cost spikes
    - Material new restriction, license denial, or visible product-capacity constraint
    - Re-cut growth and margin assumptions
  - - Spinout execution
    - Independence plan stalls or governance remains opaque
    - No meaningful governance separation progress after funding round
    - Apply higher governance discount and delay investment
  - - Enterprise conversion risk
    - Named production proof fails to translate into broader accounts
    - No expansion from marquee references into repeatable case studies or disclosed enterprise metrics
    - Lower premium-workflow revenue expectations
  - - Valuation risk
    - Growth or ARR slows before risk stack improves
    - Material slowdown versus Q1 / ARR trajectory without better retention or governance evidence
    - Prefer track / price discipline over aggressive entry
  notes: Kill criteria are designed to be observable from subsequent filings, product updates, platform status, or customer proof rather than from private narrative alone.
