- id: financial-model-risk-and-kill-criteria
  title: Financial / model risk and kill criteria
  body: The financial-model risk is that a company showing obvious growth proof may still be hard to underwrite cleanly at its current price. The July 2026 round implied an approximately $18 billion post-money valuation, while public primary sources only disclose ARR and quarterly revenue snapshots rather than standalone margin, burn, or retention. Q1 2026 revenue above RMB650 million and ARR of roughly $500 million are impressive, but they do not answer whether the business can sustain creator growth without refund, support, moderation, and compute costs rising with it. Secondary reports on overseas revenue mix and independence plans are directionally useful, but still not substitutes for audited segment financials. That means the right risk posture is price-sensitive and monitorable. The thesis breaks faster if customer complaints worsen, if app-store distribution is impaired, if Chinese AI compliance becomes operationally heavier, if export-control or compute access tightens, or if the
    spinout remains more narrative than operationally independent. The core question is not whether Kling is good enough to grow. It is whether its current risk stack is being reduced quickly enough to justify a frontier-software valuation while evidence on governance and durability remains incomplete.
