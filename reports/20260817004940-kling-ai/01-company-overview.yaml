company:
  name: Kling AI
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Kling AI is Kuaishou Technology’s Beijing-anchored AI video business, launched in June 2024 and scaled by management’s
    own disclosures to more than 60 million creators, 600 million generated videos, and roughly $500 million annualized
    revenue run rate by March 2026. On July 2, 2026 the unit raised nearly $3 billion at an expected $18 billion post-money
    valuation to support independent commercial operations, but stand-alone governance, cap-table detail, and long-form
    disclosure remain materially thinner than the financing momentum suggests.
sections:
  - id: identity-product-and-business-model
    title: Identity, product surface, and business model
    body: >-
      Kling AI operates as Kuaishou’s flagship generative-video and image business rather than as a fully independent company
      with long-form public disclosure. The official homepage positions it as a next-generation AI video and image generator,
      while Kuaishou’s filings describe it as the group’s self-developed multimodal large video generation model and a major
      commercialization engine inside the broader short-video platform. Public product evidence shows the business spans a
      consumer creation app, creator-facing community and prompt education surfaces, professional release-note cadence, and
      higher-end production tooling centered on the Kling 3.0 model family. That family combines text, image, audio, and
      video inputs into one workflow, adds native audio and multi-shot control, and extends generation to 15 seconds while
      preserving character and element consistency. Monetization is already visible at multiple layers: consumer memberships,
      credit packs, higher-resolution and 4K upsell, team collaboration, and enterprise or production adoption. The core
      underwriting takeaway is that Kling is no longer just a research demo attached to Kuaishou’s brand. It is already a
      commercial product stack with distinct packaging, creator education, and workflow specialization, even if the exact
      split between consumer, enterprise, API, and subsidized growth channels remains undisclosed.
    claimRefs: [CO001, CO003, CO005, CO007, CO008, CO009, CO010, CO011, CO012, CO013, CO014, CO015, CO016, CO017, CO044]
    tableRefs: [TO001]
    figureRefs: [FO002, FO003]
  - id: leadership-governance-and-spinout-structure
    title: Leadership, governance, and spinout structure
    body: >-
      Governance visibility is meaningfully stronger at the Kuaishou parent than at Kling’s own entity perimeter. Kuaishou’s
      2025 annual report and English management materials clearly identify co-founder Cheng Yixiao as chairman and chief
      executive officer and co-founder Su Hua as an executive director, while the annual report also discloses independent
      director changes such as Lu Rong’s April 2025 appointment. Those disclosures matter because the July 2026 financing
      was explicitly described as a step toward independent commercial operations rather than as a completed separation.
      External reporting further indicates Kuaishou will retain roughly 68.33% control after the round. What is still absent
      from the public file set reviewed here is the kind of stand-alone governance package late-stage investors usually want:
      a complete Kling board roster, named independent directors for the spun-out business, a full management team page,
      and a detailed cap table beyond parent-control headlines. That gap does not invalidate the business, but it increases
      diligence risk because investors are underwriting a company with unicorn-to-decacorn pricing using governance evidence
      that still mostly belongs to the listed parent.
    claimRefs: [CO037, CO038, CO039, CO040, CO041, CO042, CO051]
    tableRefs: [TO002]
  - id: financing-ownership-and-capital-formation
    title: Financing, ownership, and capital formation
    body: >-
      Kling’s July 2026 financing is one of the clearest signals that the market now treats AI video as a stand-alone asset
      class rather than a feature inside broader generative AI. Multiple independent reports place the July 2 round at just
      over 19 billion yuan, with some sources describing an upper committed amount around 20.45 billion yuan and a post-money
      valuation of about $18 billion. The syndicate was unusually broad and strategically important: Kuaishou stayed in
      control, Tencent invested despite backing its own AI ecosystem, and Alibaba Cloud, Baidu, CITIC Securities, BlueFive,
      CPE Yuanfeng, Guofang Venture Capital, Zhongguancun Science City Fund, and CAS Investment all appeared in deal coverage.
      The strategic meaning of the round is at least as important as the amount raised. Kuaishou and outside reports describe
      the transaction as preparation for independent commercial operations and eventual IPO readiness, implying that the
      private market believed public-equity-style separation could unlock value that Kuaishou’s listed multiple was not
      capturing. The caveat is that the public record still does not disclose liquidation preferences, secondaries, debt,
      employee equity pool detail, or a final investor-by-investor ownership bridge.
    claimRefs: [CO031, CO032, CO033, CO034, CO035, CO036, CO037, CO038, CO050, CO051]
    tableRefs: [TO003]
  - id: scale-traction-milestones-and-adverse-context
    title: Scale, traction, milestones, and adverse context
    body: >-
      Kling’s scale narrative is unusually strong for a product that only launched in June 2024. Official Kuaishou releases
      say Kling exceeded $100 million annualized revenue run rate in March 2025, surpassed $240 million ARR in December 2025,
      and approached roughly $500 million ARR by March 2026. The same official materials say the platform served more than
      60 million creators worldwide, generated more than 600 million videos, and formed relationships with more than 30,000
      enterprise users or clients by late 2025 to early 2026. Product milestones also came quickly: Omni Launch Week in
      December 2025, Kling 3.0 in February 2026, team collaboration features in the first quarter, and a native 4K launch in
      April 2026. Public commercial proof is not limited to generic creator marketing. Kuaishou cites work on the historical
      drama Swords Into Plowshares and the Hollywood series House of David, while Kling’s own blog highlights The RealReal’s
      Cannes Lions-winning L’Ultimo Uomo Reale as a case where emotional continuity and character stability mattered more
      than raw novelty. The counterweight is compliance and disclosure risk. China’s 2025 AI-content labeling rules squarely
      apply to AI-generated video and app-distribution surfaces, adding a real regulatory burden precisely as Kling pushes
      into mainstream and enterprise channels.
    claimRefs: [CO006, CO018, CO019, CO020, CO021, CO022, CO023, CO024, CO025, CO026, CO027, CO028, CO029, CO030, CO045, CO046, CO047, CO048, CO049]
    tableRefs: [TO004]
    figureRefs: [FO001]
