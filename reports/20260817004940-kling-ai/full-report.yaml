companyProfile:
  summary: >-
    Kling AI is Kuaishou Technology’s Beijing-anchored AI video business, publicly launched in June 2024 and now being
    prepared for more independent commercial operations after a July 2026 external financing. The company sells consumer
    and professional AI creation tools spanning text-to-video, image generation, multimodal editing, API surfaces,
    collaboration features, and higher-end production workflows such as native 4K output and multi-shot storytelling.
    Public disclosures indicate unusually fast scale for a young AI video platform: more than 60 million creators, over
    600 million generated videos, partnerships with 30,000+ enterprise users, Q1 2026 revenue above RMB650 million, and
    March 2026 ARR around $500 million. At the same time, the public record still leaves major gaps on standalone
    governance, unit economics, retention quality, and risk normalization, so Kling should be treated as a scaled but
    still under-disclosed late-stage private AI company.
