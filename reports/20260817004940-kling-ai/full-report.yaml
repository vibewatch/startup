      - number: '4.4'
        title: The real underwriting gap is revenue quality and margin durability
        blocks:
          - type: paragraph
            body: >-
              The central financial debate is no longer whether Kling can monetize. It can. The real debate is what kind
              of AI-video business it is becoming. A high-retention enterprise workflow platform can deserve very
              different multiples from a consumer-heavy subscription business or an API product where pricing is
              constantly pressured by rival model supply. Public adverse signals matter here. Trustpilot reviews
              complain about wasted credits, refunds, billing friction, and inconsistent outputs. The paid-service terms
              explicitly state that credits are not refundable cash value and that pricing or benefit structures can
              change. Category precedent also matters: Sora’s discontinuation showed that eye-catching demand can
              coexist with destructive economics. None of this proves Kling shares Sora’s problem, but it does prove
              that the burden of margin proof is still ahead of the company. Until management discloses segment mix,
              accepted-output economics, compute spend, renewal behavior, and cash efficiency, investors should treat
              Kling as commercially validated but financially under-documented.
