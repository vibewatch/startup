      - number: '1.4'
        title: Scale, traction, milestones, and adverse context
        blocks:
          - type: paragraph
            body: >-
              Kling’s scale narrative is unusually strong for a product that only launched in June 2024. Official
              Kuaishou releases say Kling exceeded $100 million annualized revenue run rate in March 2025, surpassed
              $240 million ARR in December 2025, and approached roughly $500 million ARR by March 2026. The same
              official materials say the platform served more than 60 million creators worldwide, generated more than
              600 million videos, and formed relationships with more than 30,000 enterprise users or clients by late
              2025 to early 2026. Product milestones also came quickly: Omni Launch Week in December 2025, Kling 3.0 in
              February 2026, team collaboration features in the first quarter, and a native 4K launch in April 2026.
              Public commercial proof is not limited to generic creator marketing. Kuaishou cites work on the historical
              drama Swords Into Plowshares and the Hollywood series House of David, while Kling’s own blog highlights
              The RealReal’s Cannes Lions-winning L’Ultimo Uomo Reale as a case where emotional continuity and character
              stability mattered more than raw novelty. The counterweight is compliance and disclosure risk. China’s
              2025 AI-content labeling rules squarely apply to AI-generated video and app-distribution surfaces, adding
              a real regulatory burden precisely as Kling pushes into mainstream and enterprise channels.
