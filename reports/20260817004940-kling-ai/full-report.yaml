  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Where Kling actually competes
        blocks:
          - type: paragraph
            body: >-
              Kling is not competing in just one clean lane. Its public surfaces place it simultaneously in consumer
              AI-video creation, creator workflow software, enterprise API video generation, and production-oriented
              audiovisual tooling for advertising and entertainment. That means the right peer set changes by buyer. For
              creators and performance marketers, Kling competes with Pika, Luma, and other fast-turnaround tools. For
              higher-end story, ad, and film workflows, it runs into Runway and Veo. For China-linked or cost-sensitive
              buyers, it also faces Wan, Hailuo, Seedance, and routing layers that expose several models behind one
              interface. The practical implication is that Kling benefits from category breadth but cannot assume one
              benchmark win or one pricing tier secures the whole market. Buyers are usually selecting for a specific
              job: human realism, camera control, audio, cost, integration, or throughput. Kling's public story is
              strongest when the job requires cinematic short-form output with believable motion and character
              continuity at a price below premium Western tools.
            claimRefs:
