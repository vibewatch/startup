  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: wide
    summary: >-
      The highest combined risks are regulatory/legal compliance, customer-trust friction, and dependency on external
      channels and infrastructure.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual severity
      rows:
        - label: China compliance and labeling
          values:
            - High
            - High
            - Medium
            - High
        - label: Customer billing/support friction
          values:
            - High
            - High
            - Low
            - High
        - label: App-store / channel dependence
          values:
