  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              The core valuation question is not whether Kling is an impressive product. It is whether the public
              evidence as of 2026-08-17 supports paying the reported July 2026 valuation. On that test, the answer is
              not yet. CNBC, TechNode, and other July reporting converge around an approximately $2.8 billion round at
              an $18 billion post-money valuation while Kuaishou still retains majority control. Kuaishou’s own releases
              prove that commercialization is real: Kling generated more than RMB650 million of Q1 2026 revenue and
              reached an approximately $500 million ARR in March 2026 after previously disclosing a $240 million run
              rate in December 2025. That is strong enough to justify continued investor attention and a valuation
              premium to ordinary software companies. But the same evidence base does not show standalone margin
              durability, customer-quality metrics, audited segment economics, or de-risked governance. When price
              already assumes frontier-software scarcity, those omissions matter more than product excitement. My
              recommendation is therefore Track rather than Buy: the business is worth following closely, but the
              current reported mark leaves too little room for execution, regulatory, and disclosure uncertainty.
            claimRefs:
              - CV001
              - CV002
              - CV003
