      - number: '7.2'
        title: Operational, customer, and trust risk
        blocks:
          - type: paragraph
            body: >-
              Operational risk is visible because Kling’s strongest customer evidence comes from live consumer and
              production use, not because the company publishes a mature trust center. The customer-facing terms
              disclaim uninterrupted availability, activated paid services are non-refundable, and app-store / complaint
              surfaces preserve recurring dissatisfaction around credit burn, disappearing generations, confusing
              upgrades, silent support, and billing disputes. Those issues matter more than ordinary consumer complaints
              because Kling is trying to move from a viral creator app into a professional production and enterprise
              platform. If users feel that failed generations burn scarce credits, or if support and invoicing remain
              weak, conversion from experimentation to repeat paid usage can stall. The same problem compounds for
              larger customers. Public sources show film and campaign teams using Kling in workflows where reliability,
              rights management, and deliverable consistency matter; however, public evidence is thin on enterprise
              SLAs, incident history, certifications, or procurement artifacts. The consequence is a classic scaling
              risk: product excitement is visible, but assurance packaging appears thinner than what large,
              risk-sensitive buyers usually want before embedding a vendor deeper into production systems.
