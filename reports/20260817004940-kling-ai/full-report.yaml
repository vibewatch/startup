            - Operations lead
            - Customer support contact
          touchpoints:
            - renewal
            - more seats
            - more projects
            - support / billing
          emotion: Retention depends on reliability, support, and whether outputs continue to justify cost
          label: Expand or churn
    claimRefs:
      - CU006
      - CU007
      - CU024
      - CU036
  - id: FU002
    title: Adoption / deployment funnel
    type: flow
    layout: standard
    summary: >-
      Public evidence shows how discovery can progress into production use, but not how often it becomes durable
      recurring revenue.
    data:
      nodes:
        - id: surface
          label: Public discovery surface
          detail: Users find Kling through app stores, release news, Cannes coverage, or customer projects.
        - id: trial
          label: Trial / evaluation
          detail: Creator, studio, or brand team tests whether the model can deliver usable quality or control.
        - id: project
          label: First project success
          detail: A real campaign asset, film shot, or creator clip demonstrates tangible workflow value.
        - id: paid
          label: Paid or formal commitment
          detail: The user buys credits or a subscription, or a team operationalizes Kling inside production.
        - id: repeat
          label: Repeat usage / renewal
          detail: >-
            Only recurring creator spend, team expansion, or repeat projects convert adoption proof into customer
            durability.
      edges:
        - from: surface
          to: trial
        - from: trial
          to: project
        - from: project
          to: paid
        - from: paid
          to: repeat
    claimRefs:
      - CU011
      - CU017
      - CU021
      - CU025
      - CU036
  - id: FU003
    title: Customer proof matrix
    type: matrix
    layout: wide
    summary: >-
      Evidence is strongest for named production use and broad app-scale adoption, and weakest for renewal or
      contract-quality visibility.
    data:
      columns:
        - Evidence quality
        - Outcome specificity
        - Production maturity
        - Retention visibility
      rows:
        - label: House of David / Wonder Project
          values:
            - High
