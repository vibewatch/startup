      - number: '6.3'
        title: Retention, satisfaction, and procurement friction
        blocks:
          - type: paragraph
            body: >-
              Durability is the weakest part of Kling’s public customer record. No retained source discloses NRR, GRR,
              logo churn, paid conversion, average contract length, or revenue split between consumers, teams, and
              enterprise accounts. Instead, the public record offers a mix of positive scale proxies and visible
              friction. Apple and Google prove that Kling has a large live audience, and Google Play reviews show that
              at least some users find image-to-video quality strong enough to evaluate seriously. But Trustpilot and
              Google Play also preserve a consistent adverse pattern around burned credits, disappearing generations,
              opaque billing, and poor support responsiveness. Kling’s paid-service terms deepen the concern because
              activated paid services are non-refundable, credits are virtual items rather than stored value, and
              auto-renewal can continue until explicitly canceled. The service agreement further states that the product
              is offered on an as-is and as-available basis without uninterrupted-service guarantees. For enterprise
              procurement, privacy and content-license terms are almost as important as raw generation quality, because
              customers need comfort that uploaded materials, generated outputs, and subscription operations will not
              create legal, finance, or brand-management problems.
