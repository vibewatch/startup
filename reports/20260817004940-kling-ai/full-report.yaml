  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product stack in customer-workflow terms
        blocks:
          - type: paragraph
            body: >-
              Kling is best understood as a multimodal creative system rather than a single text-to-video feature. Its
              public product stack includes Video 3.0 and Video 3.0 Omni for motion generation, Image 3.0 and Image 3.0
              Omni for still-image creation and cinematic reference workflows, mobile and web creation surfaces,
              community discovery and remix mechanics, and an API/open-platform layer for programmable use. In workflow
              terms, that means Kling serves at least four jobs: creator ideation, short-form marketing production,
              e-commerce product visualization, and higher-end film or storyboard acceleration. The stack is also
              intentionally cross-modal. Official release notes describe text-to-video, image-to-video,
              reference-to-video, editing, multi-shot sequencing, native audio, and element consistency as parts of one
              creative engine rather than separate standalone products. That makes Kling more commercially useful than a
              novelty generator, because users can move from prompt, to reference, to sequence, to final output within
              one broader operating environment.
