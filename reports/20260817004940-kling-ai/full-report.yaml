chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product surface, and business model
        blocks:
          - type: paragraph
            body: >-
              Kling AI operates as Kuaishou’s flagship generative-video and image business rather than as a fully
              independent company with long-form public disclosure. The official homepage positions it as a
              next-generation AI video and image generator, while Kuaishou’s filings describe it as the group’s
              self-developed multimodal large video generation model and a major commercialization engine inside the
              broader short-video platform. Public product evidence shows the business spans a consumer creation app,
              creator-facing community and prompt education surfaces, professional release-note cadence, and higher-end
              production tooling centered on the Kling 3.0 model family. That family combines text, image, audio, and
              video inputs into one workflow, adds native audio and multi-shot control, and extends generation to 15
              seconds while preserving character and element consistency. Monetization is already visible at multiple
              layers: consumer memberships, credit packs, higher-resolution and 4K upsell, team collaboration, and
              enterprise or production adoption. The core underwriting takeaway is that Kling is no longer just a
              research demo attached to Kuaishou’s brand. It is already a commercial product stack with distinct
              packaging, creator education, and workflow specialization, even if the exact split between consumer,
              enterprise, API, and subsidized growth channels remains undisclosed.
