      - number: '1.3'
        title: Financing, ownership, and capital formation
        blocks:
          - type: paragraph
            body: >-
              Kling’s July 2026 financing is one of the clearest signals that the market now treats AI video as a
              stand-alone asset class rather than a feature inside broader generative AI. Multiple independent reports
              place the July 2 round at just over 19 billion yuan, with some sources describing an upper committed
              amount around 20.45 billion yuan and a post-money valuation of about $18 billion. The syndicate was
              unusually broad and strategically important: Kuaishou stayed in control, Tencent invested despite backing
              its own AI ecosystem, and Alibaba Cloud, Baidu, CITIC Securities, BlueFive, CPE Yuanfeng, Guofang Venture
              Capital, Zhongguancun Science City Fund, and CAS Investment all appeared in deal coverage. The strategic
              meaning of the round is at least as important as the amount raised. Kuaishou and outside reports describe
              the transaction as preparation for independent commercial operations and eventual IPO readiness, implying
              that the private market believed public-equity-style separation could unlock value that Kuaishou’s listed
              multiple was not capturing. The caveat is that the public record still does not disclose liquidation
              preferences, secondaries, debt, employee equity pool detail, or a final investor-by-investor ownership
              bridge.
