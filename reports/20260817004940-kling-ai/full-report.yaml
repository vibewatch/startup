      - number: '3.3'
        title: Pricing, packaging, and multi-homing
        blocks:
          - type: paragraph
            body: >-
              Pricing reinforces how fragmented the market remains. Kling's consumer plans sit well below premium
              enterprise-grade creative suites, while third-party API summaries place its programmatic pricing in a
              budget-friendly to mid-range band depending on quality mode. Runway's subscription tiers are materially
              higher, which fits its professional positioning. Pika stays low-friction for creators. Luma leans toward
              team and workflow value rather than pure cheapest-cost generation. Veo often competes through ecosystem
              access rather than simple head-to-head list pricing. Those differences create a multi-homing market. Teams
              can prototype in one tool, create hero shots in another, and run high-volume social or product content
              through Kling or another lower-cost route. Aggregation layers make switching even easier by reducing
              engineering lock-in. The result is that pricing matters, but sustainable advantage comes from repeatable
              workflow value, quality at the margin that buyers notice, and how painful it would be to move recurring
              production elsewhere.
