  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Segment map and entry surfaces
        blocks:
          - type: paragraph
            body: >-
              Kling’s customer base should be segmented by workflow and buying motion rather than by one
              undifferentiated user headline. The largest visible surface is self-serve creators entering through the
              web studio, iOS app, and Android app, where the buyer, user, and payer are often the same individual
              buying credits or a subscription. A second segment is professional film and television teams, where
              producers or studio leads approve budgets while directors, VFX supervisors, and artists use the tool in
              production. A third segment is agencies, brands, and e-commerce teams using Kling for short-form
              campaigns, product videos, and asset iteration. A fourth segment is enterprise workgroups, evidenced by
              the Team Plan and the 30,000-enterprise-user disclosure, where the buyer is a team or budget owner rather
              than a single creator. Public materials also show a developer or product-team surface through the API and
              release-note ecosystem, but revenue quality for that segment is much less visible than for the film and
              creator tiers. The result is a customer map with real breadth, but with very uneven proof quality across
              segments and channels.
