      - number: '8.4'
        title: Exit readiness, diligence asks, and final view
        blocks:
          - type: paragraph
            body: >-
              The final view is therefore price-sensitive and evidence-sensitive. Kling already has enough traction,
              product quality, and strategic investor interest to remain investable in principle. What is missing is the
              package needed to underwrite the company as a durable standalone entity at the current mark. Investors
              still need a clear cap-table and minority-rights view after the July round, audited standalone financials,
              revenue-mix and retention detail, enterprise concentration data, customer-support and refund KPIs, and a
              concrete picture of compute dependence and compliance operations. The exit story is also not yet
              filing-ready from the public record alone. A future IPO or larger crossover round could clear at or above
              today’s valuation if ARR compounds rapidly and risk packaging improves, but today’s public materials still
              look more like high-quality momentum evidence than full underwriting proof. That is why the final posture
              remains Track. A lower entry valuation, or materially better disclosure on economics and governance, would
              change the call faster than another general product announcement would.
            claimRefs:
