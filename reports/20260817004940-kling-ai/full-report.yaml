      - number: '7.3'
        title: Dependency and execution risk
        blocks:
          - type: paragraph
            body: >-
              Kling’s growth story is also highly dependent on counterparties and execution choices that it does not
              fully control. Kuaishou still retains roughly 68% ownership after the July 2026 financing, which means the
              spinout remains strategically and financially tied to the parent even as it prepares for more independent
              operations. That can be helpful, but it also creates governance ambiguity for outside investors. App
              stores remain critical global discovery and billing rails. Marquee proof points such as House of David,
              Swords Into Plowshares, and The RealReal are valuable, yet they also create concentration of narrative
              risk if the next wave of named enterprise references does not materialize. Compute and geopolitical
              exposure are another dependency cluster. U.S. export policy remains dynamic: even after the January 2026
              BIS revision allowing case-by-case H200 licenses to approved China customers, advanced-chip access is
              still policy-mediated rather than assured. Kling may not need to disclose its exact GPU mix publicly for
              this to matter. If the spinout’s cost structure, product velocity, or global availability depend on a
              constrained compute supply chain, then export, licensing, and procurement changes can transmit quickly
              into operating and strategic risk.
            claimRefs:
