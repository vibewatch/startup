  - id: FR002
    title: Risk transmission map
    type: dag
    layout: standard
    summary: >-
      Compliance, support, and infrastructure risks can transmit quickly into customer trust, monetization quality, and
      valuation support.
    data:
      nodes:
        - id: reg
          label: China AI rules
          detail: Labeling, filing, app-review, and data-governance duties
        - id: ops
          label: Operational friction
          detail: Billing, refunds, support, and output reliability
        - id: compute
          label: Compute access
          detail: Export-policy and advanced-chip availability sensitivity
        - id: trust
          label: Customer trust
          detail: Whether users and teams are willing to rely on Kling repeatedly
        - id: revenue
          label: Revenue quality
          detail: Repeat paid usage, enterprise conversion, and margin durability
        - id: valuation
          label: Valuation support
          detail: Whether growth and risk are consistent with frontier-software pricing
      edges:
        - from: reg
          to: trust
        - from: ops
          to: trust
        - from: compute
          to: revenue
        - from: trust
          to: revenue
        - from: revenue
          to: valuation
        - from: reg
          to: valuation
    claimRefs:
      - CR003
      - CR014
      - CR026
      - CR033
      - CR042
  - id: FR003
    title: Dependency map
    type: dag
    layout: standard
    summary: >-
      Kling’s execution depends on the parent, app stores, regulators, compute policy, and a small set of premium proof
      points.
    data:
      nodes:
        - id: kuaishou
          label: Kuaishou
          detail: Parent control, capital, brand, and spinout context
        - id: apps
          label: Apple / Google
          detail: Discovery, billing, and review gatekeepers
        - id: china
          label: China regulators
          detail: CAC-led AI labeling, filing, and data regime
        - id: chips
          label: Advanced-chip regime
          detail: U.S. semiconductor export and licensing policy
        - id: proof
          label: Marquee references
          detail: House of David, Swords, The RealReal and similar proofs
        - id: kling
          label: Kling economics
          detail: Growth, trust, and standalone valuation support
      edges:
        - from: kuaishou
          to: kling
        - from: apps
          to: kling
        - from: china
          to: kling
        - from: chips
          to: kling
        - from: proof
          to: kling
    claimRefs:
      - CR023
      - CR024
      - CR025
      - CR027
      - CR029
  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: >-
