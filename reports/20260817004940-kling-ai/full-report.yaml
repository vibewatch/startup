      - number: '3.4'
        title: Moat durability and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              Kling's moat case is credible but conditional. Kuaishou backing gives it capital, distribution adjacency,
              and real commercialization proof. Official adoption metrics show that the product is already far beyond
              demo stage. Public capability evidence also suggests that Kling is a serious contender on human realism,
              motion, and short-form commercial use cases. The adverse side is equally important. Premium rivals such as
              Runway and Veo are strong on workflow and ecosystem power; creator-focused rivals such as Pika and Luma
              can win on speed or integrated creative systems; and Chinese peers plus aggregation layers can compress
              pricing while lowering switching costs. The competitive lesson from Sora's discontinuation is that
              category relevance alone does not equal defensibility. Kling likely belongs in the leading cohort, but the
              evidence does not yet prove that customers cannot replace it, route around it, or negotiate price
              aggressively. Durability therefore depends on whether Kling can turn impressive model performance into
              repeat use, team workflow embedding, and partner-distribution leverage faster than rivals do.
