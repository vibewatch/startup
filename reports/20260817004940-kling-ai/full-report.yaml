      - number: '8.2'
        title: Comparable set and multiple reality check
        blocks:
          - type: paragraph
            body: >-
              The cleanest valuation sanity check is to compare Kling’s implied multiple against public software and
              AI-adjacent references that have both market-cap and revenue visibility. CompaniesMarketCap data shows
              Adobe at roughly 4.2x market cap to TTM revenue, Duolingo at about 5.7x, GitLab at about 7.2x, and C3.ai
              at about 6.2x as of August 2026. Those are imperfect comparables: Adobe is a scaled, profitable
              creative-suite incumbent; Duolingo is a consumer subscription platform; GitLab is a developer workflow
              company; and C3.ai is an enterprise-AI software pure play rather than a frontier video model company. Even
              so, the range is useful because Kling’s reported $18 billion post-money valuation sits around 36x the
              March 2026 ARR figure and materially above what public markets pay for disclosed software revenue. A
              premium is justified by faster growth, stronger strategic scarcity, and blockbuster platform potential.
              Yet a premium that large needs unusually clean evidence on governance, unit economics, customer
              durability, and regulatory control. Public sources do not currently provide that level of precision, so
              the right conclusion is not that Kling is overhyped, but that the multiple already embeds a great deal of
              future execution success.
            claimRefs:
              - CV011
