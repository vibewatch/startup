      - number: '1.2'
        title: Leadership, governance, and spinout structure
        blocks:
          - type: paragraph
            body: >-
              Governance visibility is meaningfully stronger at the Kuaishou parent than at Kling’s own entity
              perimeter. Kuaishou’s 2025 annual report and English management materials clearly identify co-founder
              Cheng Yixiao as chairman and chief executive officer and co-founder Su Hua as an executive director, while
              the annual report also discloses independent director changes such as Lu Rong’s April 2025 appointment.
              Those disclosures matter because the July 2026 financing was explicitly described as a step toward
              independent commercial operations rather than as a completed separation. External reporting further
              indicates Kuaishou will retain roughly 68.33% control after the round. What is still absent from the
              public file set reviewed here is the kind of stand-alone governance package late-stage investors usually
              want: a complete Kling board roster, named independent directors for the spun-out business, a full
              management team page, and a detailed cap table beyond parent-control headlines. That gap does not
              invalidate the business, but it increases diligence risk because investors are underwriting a company with
              unicorn-to-decacorn pricing using governance evidence that still mostly belongs to the listed parent.
