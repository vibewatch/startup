      - CU023
      - CU024
      - CU035
  - id: FU004
    title: Retention / repeat cohort proxy
    type: cohort
    layout: standard
    summary: >-
      Public disclosure is front-loaded toward adoption and project proof; the longer the horizon, the thinner the
      public durability evidence becomes.
    approximationNotes: >-
      Directional proxy only. Values reflect how much retained public evidence exists for repeat usage at each horizon,
      not company-disclosed retention rates.
