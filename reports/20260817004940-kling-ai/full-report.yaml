  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Monetization surfaces are clear even if revenue mix is not
        blocks:
          - type: paragraph
            body: >-
              Kling is not a product searching for a business model. Public sources show a layered monetization stack:
              consumer memberships sold through web and app channels, credit consumption against specific generation
              features, in-app purchases, usage-based API pricing, prepaid resource packages for larger programmatic
              users, and custom arrangements for higher-volume or enterprise buyers. The company also monetizes through
              team-oriented workflow features rather than only one-person creation. That architecture matters because it
              proves multiple revenue surfaces already exist. What remains unknown is mix. Public disclosures still do
              not tell investors how much revenue comes from consumer subscriptions versus enterprise contracts, API
              volume, or channel-specific in-app purchases. That distinction matters because the quality of revenue,
              gross margin, support burden, and retention profile can vary sharply across those surfaces. Kling
              therefore has visible monetization mechanics, but investors are still inferring the weight of each engine
              rather than seeing a disclosed revenue bridge.
