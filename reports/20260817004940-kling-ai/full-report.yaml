  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: Implied equity value if different ARR multiples are applied to the disclosed March 2026 ~$500M ARR anchor.
    data:
      items:
        - label: 12x ARR
          value: 6000
          unit: $M equity value
        - label: 16x ARR
          value: 8000
          unit: $M equity value
        - label: 20x ARR
          value: 10000
          unit: $M equity value
        - label: 24x ARR
          value: 12000
          unit: $M equity value
        - label: 30x ARR
          value: 15000
          unit: $M equity value
        - label: 36x ARR (~reported round mark)
          value: 18000
          unit: $M equity value
    approximationNotes: >-
      Uses the disclosed March 2026 ARR anchor of approximately $500M. This is not a discounted-cash-flow model; it
      simply shows how demanding the reported mark is versus different ARR multiple assumptions.
    claimRefs:
      - CV003
      - CV006
      - CV013
      - CV017
      - CV032
  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: Bear, base, and bull valuation bands relative to the reported July 2026 round price.
    data:
      items:
        - label: Bear
          low: 6000
          mid: 8000
          high: 10000
          unit: $M equity value
        - label: Base
          low: 10000
          mid: 12500
          high: 15000
          unit: $M equity value
        - label: Bull
          low: 18000
          mid: 21000
          high: 24000
          unit: $M equity value
        - label: Reported July 2026 round mark
          low: 18000
          mid: 18000
          high: 18000
          unit: $M equity value
    approximationNotes: >-
      Bands frame entry discipline from the reported July 2026 round, not an exact mark-to-model output. The bull case
      already assumes substantial execution success, which is why upside at the current entry is limited.
    claimRefs:
      - CV022
      - CV023
      - CV024
      - CV025
      - CV026
      - CV027
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: IC-style scoring of Kling across market, proof, economics, governance, risk, and valuation support.
    data:
      items:
        - label: Market opportunity
          value: 9/10
          note: AI video and multimodal creation remain large and strategically important.
        - label: Product / workflow proof
          value: 8/10
          note: Film, creator, and enterprise usage proof is real and improving.
        - label: Revenue momentum
          value: 8/10
          note: Q1 revenue and ARR acceleration support commercial seriousness.
        - label: Monetization quality
          value: 5/10
          note: Paid traction exists, but refund/support friction and revenue-mix opacity limit confidence.
        - label: Governance readiness
          value: 4/10
          note: Spinout and minority-protection evidence remain incomplete in public.
        - label: Regulatory / compute risk
          value: 4/10
          note: China AI rules and advanced-chip policy keep a real risk premium in the story.
        - label: Valuation support
          value: 3/10
          note: The reported mark already discounts a great deal of future success.
    claimRefs:
      - CV005
      - CV018
      - CV020
      - CV028
      - CV031
      - CV042
