      - number: '6.4'
        title: Expansion loops and concentration risk
        blocks:
          - type: paragraph
            body: >-
              The most plausible customer-expansion path is from creator experimentation into heavier paid usage, then
              into team collaboration, and finally into production or enterprise workflows. Official materials support
              that progression. The app stores market creation and community features to individuals, the paid terms
              define membership and credits, the Team Plan adds collaborative creation for up to 15 members, and named
              film and commercial projects show that Kling can move beyond solo experimentation into workflow embedding.
              Film and advertising proofs also suggest a second expansion loop in which one successful project becomes a
              broader studio or agency relationship. But concentration risk is still difficult to underwrite. No public
              source reveals revenue concentration by top customer, geography, app store, or channel. Public evidence
              therefore points to channel concentration rather than classic single-logo concentration. Kling relies
              heavily on app stores for global consumer discovery, on Kuaishou-backed distribution and credibility for
              enterprise narrative, and on a handful of marquee production references for premium-workflow legitimacy.
