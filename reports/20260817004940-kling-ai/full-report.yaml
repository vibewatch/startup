    columns:
      - trigger
      - threshold
      - transmission to thesis
      - action implication
    rows:
      - - Compliance / app-store event
        - >-
          Any formal enforcement, failed review, suspension, or update blockage tied to AI labeling or content
          governance.
        - Turns regulatory risk from abstract discount into operating interruption.
        - Pause underwriting until control and distribution damage are understood.
      - - Growth-quality deterioration
        - >-
          Visible slowdown against Q1 / ARR trajectory without offsetting improvement in customer quality or enterprise
          depth.
        - Undermines the main justification for a premium multiple.
        - Re-cut valuation and downgrade conviction.
      - - Customer trust erosion
        - Persistent worsening in public complaints around credits, refunds, support, or vanished outputs.
        - Signals low-quality monetization and weaker retention than the headline user base implies.
        - Lower revenue-quality assumptions.
      - - Spinout governance opacity
        - No meaningful standalone governance clarification after the July 2026 raise.
        - Makes minority underwriting and exit planning harder at the current price.
        - Demand a governance discount or avoid entry.
      - - Compute / export-control tightening
        - Material new advanced-chip restriction or visible capacity bottleneck.
        - Can compress product velocity and margin simultaneously.
        - Rework growth, capex/opex, and timing assumptions.
    notes: >-
      Kill triggers are designed to be observable through public or diligenced evidence rather than through narrative
      alone.
