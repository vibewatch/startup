  rows:
  - - Consumer memberships
    - Recurring membership subscriptions with monthly credits and feature entitlements
    - Monthly membership
    - Officially documented and actively sold
    - Visible monetization surface, but realized ARPU and churn unknown
    - What share of revenue comes from Standard/Pro/Premier/Ultra memberships?
  - - In-app purchases
    - App-store subscriptions and credit packs
    - Per plan / credit pack
    - Visible in the App Store listing
    - Likely high-volume top-of-funnel channel but app-store fee drag unknown
    - What is net revenue after app-store take rates and refund behavior?
  - - API usage
    - Usage-based pricing and prepaid packages
    - Per second / per unit
    - Publicly summarized by third parties; official pricing subject to live page
    - Potentially scalable enterprise/developer surface
    - What share of API jobs are production versus test and what is gross margin by mode?
  - - Enterprise / custom packages
    - Negotiated resource packages and custom solutions
    - Contract / package
    - Publicly visible as a sales motion, not as disclosed contract value
    - Could drive larger ACVs but least transparent publicly
    - What are typical enterprise ACVs, contract lengths, and renewal rates?
  - - Team workflow upsell
    - Collaborative plan and workflow features
    - Seat / team plan context
    - Product surface exists via Team Plan
    - Could deepen retention if teams adopt, but monetization details are absent
    - How many paid teams exist and what incremental revenue comes from team features?
  notes: The public record makes the monetization architecture visible, but not the revenue mix across those surfaces.
