- id: pricing-is-richly-documented-unit-economics-are-not
  title: Pricing is richly documented, but unit economics are not
  body: 'Kling publishes enough pricing signals to model customer spend behavior, but not enough to prove profitability. Official creator plans specify monthly credits and feature entitlements, the App Store shows alternative channel prices, and third-party API summaries provide per-second rate cards and bundle math. The paid-services terms also clarify that credits expire, are non-cash, and can be updated by front-end pricing announcements, which reinforces that monetization is tightly managed around virtual consumption units. Yet none of that answers the real underwriting question: what does an accepted minute of video cost Kling to serve after compute, moderation, retries, and support? WaveSpeed and CostBench both point out that the true cost per usable video depends on rejected outputs, review time, and workflow inefficiency, not just list price. That observation is financially important because AI video can look cheap on a credit table but expensive in production if failure or rework
    rates are high. Public pricing is therefore a strong starting point for revenue-shape analysis, not a substitute for gross-margin diligence.'
  claimRefs:
