  - - API premium rate
    - ~$0.420 per second at top quality tier
    - low
    - Defines ceiling price for highest-quality mode
    - What workloads actually pay this rate at scale?
  - - Credit validity
    - 2 years for purchased or distributed credits under paid-service terms
    - high
    - Deferred usage and breakage affect liability and revenue recognition questions
    - How much unused credit balance exists on the balance sheet?
  - - Refundability of credits
    - No cash withdrawal or reverse exchange supported under paid-service terms
    - high
    - Impacts customer friction and breakage economics
    - What is gross and net refund rate by channel?
  - - Gross margin
    - 'null'
    - low
    - Core underwriting variable for compute-heavy AI video
    - Provide gross profit by product surface and by quality mode.
  - - Burn / monthly cash use
    - 'null'
    - low
    - Determines financing dependency despite large round size
    - Provide monthly burn and projected post-spinout runway.
  notes: Public sources are strong on price schedules and weak on the operating economics behind those schedules.
