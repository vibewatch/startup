- id: TI005
  title: Public financial gaps table
  columns:
  - missing private metrics
  - impact
  - exact diligence path
  rows:
  - - Revenue mix by consumer/app/API/enterprise
    - Cannot judge quality, concentration, or comp set
    - Request revenue bridge by segment, geography, and channel for 2025, Q1 2026, and current run-rate.
  - - Gross margin by mode and workflow
    - Cannot tell whether top-line scale is economically attractive
    - Request cost-of-revenue and compute-cost walk by standard/pro/4K/audio modes.
  - - Burn and runway
    - Cannot underwrite financing dependency or timing of next round
    - Request monthly burn, hiring plan, capex/opex split, and post-round runway view.
  - - Retention and net revenue retention
    - Cannot separate repeat workflow value from one-off experimentation
    - Request cohort retention, contract renewal, and expansion metrics by customer segment.
  - - Credit liability / breakage accounting
    - Potential revenue-recognition and customer-liability issue
    - Request deferred revenue, credit breakage policy, and aged unused credit balances.
  - - Refund / support cost by channel
    - Billing friction may erode net revenue and brand trust
    - Request refund-rate, chargeback-rate, and support-ticket cost by app-store, web, and API channels.
  notes: The biggest financial unknown is not whether Kling can generate revenue; it is whether it can generate durable, efficient revenue.
