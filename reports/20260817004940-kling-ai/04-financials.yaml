- id: commercialization-scale-is-real-capital-adequacy-looks-strong
  title: Commercialization scale is real and capital adequacy looks strong
  body: Kling has moved from experimentation to material revenue scale. Kuaishou disclosed monthly revenue above USD20 million in December 2025, implying a USD240 million ARR, then later disclosed over RMB650 million of Q1 2026 revenue and roughly USD500 million ARR in March 2026. Those are not toy numbers. They show that buyers are paying for AI video at meaningful scale, even before the July 2026 spin-out financing. The funding itself materially changes the capital picture. Multiple reports place the round at roughly USD2.8 billion and an USD18 billion post-money valuation, with Kuaishou retaining control. Combined with Kuaishou’s own RMB117.7 billion total available funds as of March 31, 2026, the parent ecosystem appears capable of supporting aggressive product and go-to-market investment. The caveat is that none of these public data points disclose Kling standalone cash on hand, monthly burn, or runway after the spin-out. Capital adequacy therefore looks strong directionally, but exact
    independence-era liquidity still requires management disclosure.
  claimRefs:
  - CI021
  - CI022
  - CI023
  - CI024
  - CI025
