  - - Marketing and e-commerce asset production
    - Product demos, short-form ads, branded visuals, product storytelling workflows
    - Generic martech subscriptions without media generation
    - Brand, agency, e-commerce, growth budgets
    - High relevance because official product guidance explicitly targets product-video and branding use cases.
  - - Film, TV, and premium creative production
    - Storyboard visualization, VFX support, scene generation, synthetic shots, audiovisual ideation
    - Full studio budgets, streaming subscriptions, camera hardware
    - Studios, producers, agencies, production teams
    - High relevance because Kuaishou cites commercial film and TV deployments.
  - - Broad generative AI economy
    - Adjacent option value from multimodal AI expansion
    - Text-only copilots, generic enterprise search, GPU hardware revenue, cloud infrastructure
    - N/A
    - Useful context only; too broad to treat as Kling SAM.
  notes: The boundary keeps Kling inside visual-generation workflows while excluding unrelated AI and infrastructure pools that would overstate serviceable demand.
