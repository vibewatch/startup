- id: TM004
  title: Growth drivers and constraints table
  columns:
  - driver/constraint
  - direction
  - timing
  - implication
  - diligence ask
  rows:
  - - Majority adoption of AI-assisted video among marketers
    - positive
    - now
    - Category education cost falls and software budgets become easier to justify
    - What share of Kling growth comes from marketing teams versus creators?
  - - Shift from novelty to controllable workflow infrastructure
    - positive
    - now-to-medium term
    - Rewards platforms with consistency, references, editing, and API support
    - How often do users repeat production workflows rather than one-off experiments?
  - - Kuaishou distribution and ecosystem adjacency
    - positive
    - now
    - Large short-video ecosystem may lower acquisition and product-learning friction
    - How much traffic or conversion is sourced directly from Kuaishou properties?
  - - Aggressive category price compression
    - positive/negative
    - now
    - Expands adoption but can cap gross margin and differentiation
    - What is contribution margin by mode, resolution, and segment?
  - - Chinese synthetic-content labeling rules
    - negative
    - now
    - Raises compliance, moderation, provenance, and app-distribution requirements
    - What watermarking, metadata, and review systems are currently live?
  - - Cross-border AI regulation and trust concerns
    - negative
    - now-to-medium term
    - Makes global enterprise expansion slower and more contract-heavy
    - How is Kling adapting compliance posture for EU and U.S. customers?
  - - Compute intensity and model economics
    - negative
    - ongoing
    - Category can scale demand faster than sustainable gross profit
    - What are current inference-cost trends and GPU supplier dependencies?
  - - Fast-moving competitor set
    - negative
    - ongoing
    - Buyers can multi-home across Runway, Veo, Pika, Luma, Wan, and others
    - What customer cohorts show true retention rather than opportunistic experimentation?
  notes: The same factor can help demand and hurt economics; pricing is the clearest example.
