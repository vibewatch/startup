- id: market-sizing-lenses-and-bottom-up-reality
  title: Market-sizing lenses and bottom-up reality
  body: 'Available market studies point in the same direction but not to the same quantity. Broad generative-AI reports such as MarketsandMarkets and Statista show a very large and fast-growing macro backdrop, while narrower AI-video estimates cited in Adwave are far smaller but still growing quickly. That divergence is not a nuisance to smooth away; it is the key signal that analysts are measuring different layers of the stack. For Kling, the most useful interpretation is a layered one: global GenAI demand is clearly expanding, AI-video software is now a distinct commercial category, and Kling itself has already reached enough revenue scale to prove the market is not hypothetical. Kuaishou''s disclosures of over RMB650 million of Kling revenue in Q1 2026 and roughly USD500 million March 2026 ARR are especially important because they provide bottom-up evidence that a meaningful serviceable market exists even when public SAM and geography splits remain unavailable.'
