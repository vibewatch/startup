chapter:
  number: 2
  title: Market Analysis
  summary: Kling AI operates in a real but definition-sensitive AI-video market spanning consumer creation, enterprise API inference, advertising, e-commerce, and film-production workflows. Broad generative-AI TAM charts prove demand velocity, but Kling's underwritable serviceable market is narrower and will be determined as much by workflow fit, compliance, and price-performance as by headline model quality.
sections:
- id: defining-klings-real-market-boundary
  title: Defining Kling's real market boundary
  body: 'Kling should not be valued against the entire generative-AI economy without boundary discipline. Public product evidence places the company in several adjacent but not identical markets: self-serve creator subscriptions, mobile creative tools, enterprise API inference, advertising and e-commerce asset production, and higher-end film or episodic visual workflows. Those are all real monetization surfaces, but they do not entitle Kling to claim every dollar of text-only copilots, generic cloud GPU spend, or the entire global AI software stack. The more defensible frame is programmable short-form visual-content generation and editing, with spillover into production-grade audiovisual workflows where consistency, motion quality, and reference control matter. That boundary matters because Kling''s strongest public proof today is not a general-purpose enterprise-AI platform story; it is a multimodal video-creation story layered across creator, marketing, and studio use cases.'
