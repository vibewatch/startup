tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - segment
  - buyer/user/payer
  - use case
  - scale / proof
  - revenue / strategic value
  - gap
  rows:
  - - Self-serve creators / prosumers
    - Individual creator is usually buyer, user, and payer
    - Text-to-video, image-to-video, experimentation, creator publishing
    - 60M+ creators; 28K iOS ratings; 10M+ Android downloads and 528K reviews
    - Largest top-of-funnel and likely large share of subscription / credit volume
    - No public free-to-paid conversion, churn, or spend-per-creator data
  - - Film and television teams
    - Producer or studio approves spend; directors, VFX artists, and editors are users
    - Previs, effects shots, storyboards, cinematic scenes, virtual production
    - House of David, Swords Into Plowshares, Raphael, Born of the Tide, MINIBOTS
    - Highest-value proof for premium workflows and brand legitimacy
    - Contract size, renewal cadence, and number of active studio accounts are undisclosed
  - - Brands, agencies, and e-commerce teams
    - Brand or agency budget owner pays; creative team uses the tool
    - Campaign films, product videos, product-demo visuals, short-form assets
    - The RealReal campaign; official e-commerce workflow guide; Obsidian quote in 4K blog
    - Commercial segment most likely to convert output quality into repeat marketing spend
    - Public proof is heavy on anecdotes and light on ACV or procurement detail
  - - Enterprise workgroups / teams
    - Team lead or company budget owner pays; multiple creators use the product
    - Collaborative creation, shared workflows, internal review and asset management
    - Team Plan for up to 15 members; 30K+ enterprise users claimed
    - Could raise ARPU and reduce dependence on one-person subscriptions
    - No public seat count, team-plan penetration, or enterprise retention
  - - Developer / product teams
    - Developer or product owner buys; end users consume downstream outputs
    - API-based embedding of video generation into other products or workflows
    - Visible API and release-note surfaces prove a developer funnel exists
    - Potentially sticky usage-based revenue if integrated into production systems
    - No public API customer count, usage volume, or revenue split
  notes: Segments are grouped by buying motion and workflow because public evidence mixes consumer app usage, named production deployments, and enterprise collaboration claims.
