company:
  name: Kling AI
chapter:
  number: 6
  title: Customers
  summary: Kling AI’s customer story is unusually visible for a private AI-video company; official disclosures point to 60M+ creators, 600M+ generated videos, and 30K+ enterprise users, while app-store surfaces and named film/brand projects prove real usage across consumer, studio, and marketing workflows. The main underwriting gap is durability rather than adoption. Public sources show customer breadth and high-profile production proofs, but they do not disclose renewal, churn, revenue concentration, or how much usage is recurring versus marketing-led or pilot-driven.
sections:
- id: segment-map-and-entry-surfaces
  title: Segment map and entry surfaces
  body: Kling’s customer base should be segmented by workflow and buying motion rather than by one undifferentiated user headline. The largest visible surface is self-serve creators entering through the web studio, iOS app, and Android app, where the buyer, user, and payer are often the same individual buying credits or a subscription. A second segment is professional film and television teams, where producers or studio leads approve budgets while directors, VFX supervisors, and artists use the tool in production. A third segment is agencies, brands, and e-commerce teams using Kling for short-form campaigns, product videos, and asset iteration. A fourth segment is enterprise workgroups, evidenced by the Team Plan and the 30,000-enterprise-user disclosure, where the buyer is a team or budget owner rather than a single creator. Public materials also show a developer or product-team surface through the API and release-note ecosystem, but revenue quality for that segment is much less visible
    than for the film and creator tiers. The result is a customer map with real breadth, but with very uneven proof quality across segments and channels.
