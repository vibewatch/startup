- id: TU005
  title: Expansion and concentration risk table
  columns:
  - expansion driver
  - concentration risk
  - impact
  - diligence path
  rows:
  - - Free or low-friction creator entry expanding into credits and subscriptions
    - Heavy dependence on app-store discovery and billing rails
    - Consumer growth could slow quickly if ranking, pricing, or platform policies change
    - Request channel mix for new users, paid conversions, and net revenue after platform fees
  - - Paid creators expanding into Team Plan
    - Unclear penetration of collaborative seats versus solo subscriptions
    - Team accounts could raise ARPU materially, but may still be a small share of revenue
    - Request seat counts, paid team logos, and expansion history by plan
  - - Film projects expanding from one title to multi-title studio relationships
    - Customer value may be concentrated in a few marquee but low-frequency productions
    - Premium proof is strategically valuable but revenue may be lumpy
    - Request top film/TV accounts, number of projects per account, and renewal or repeat-booking data
  - - Brand and agency wins expanding into recurring marketing work
    - Campaign-style spend can be cyclical and competitor-sensitive
    - Repeat commercial work could be meaningful, but public proof is still anecdotal
    - Request logo list, campaign repeat rates, and ACV by agency / brand cohort
  - - Enterprise/API adoption expanding through Kuaishou credibility and product releases
    - Could blur organic demand with parent-supported distribution or PR momentum
    - Parent backing helps trust and reach, but may mask standalone customer concentration
    - Request revenue by parent-sourced channel, direct sales, and self-serve/API
  - - Global creator growth expanding across regions
    - Country concentration and consumer-vs-enterprise mix are undisclosed
    - Headline global scale may still hide exposure to a few markets or customer types
    - Request revenue and active-user split by geography, platform, and segment
  notes: Expansion logic is plausible, but public concentration data is not sufficient to underwrite the quality of growth.
