- id: adoption-scale-and-named-proof
  title: Adoption scale and named customer proof
  body: Public adoption proof is strong enough to take seriously. Kuaishou said Kling served more than 60 million creators by February 2026 and had generated more than 600 million videos while partnering with more than 30,000 enterprise users by December 2025. Consumer-scale visibility is also concrete rather than hypothetical. The U.S. App Store showed a 4.7 rating from 28,000 ratings on the run date, while Google Play showed 10 million-plus downloads and more than 528,000 reviews. Named production evidence matters even more because it proves usage beyond hobby experimentation. Wonder Project publicly described Kling as a core or benchmark tool for House of David and later for The Old Stories Moses. Variety separately documented 72 AI-assisted shots in season one and the use of Kling inside a broader professional toolchain. Timeaxis Studios said Kling was integrated across the Swords Into Plowshares pipeline, while The RealReal’s Cannes-winning L’Ultimo Uomo Reale and Cannes-panel projects
    such as Raphael and MINIBOTS show that Kling is being used in global branded and film workflows. The caveat is that these proofs mostly demonstrate production use and enthusiasm, not disclosed contract value or renewal behavior.
