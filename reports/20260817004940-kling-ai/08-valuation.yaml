- id: scenario-ranges-downside-and-return-math
  title: Scenario ranges, downside, and return math
  body: 'Scenario analysis matters because the observable facts are strong on growth and weaker on financial quality. In the bull case, Kling converts creator momentum into durable enterprise and API expansion, pushes ARR beyond $1 billion within roughly 12 to 18 months, reduces customer-friction signals, and shows that the spinout can operate with credible standalone governance and compliance. That can support roughly an $18 billion to $24 billion range, which at the reported July 2026 entry price offers only modest-to-good upside rather than venture-style asymmetry. The base case is more conservative: ARR keeps growing but remains mixed between consumer credits, subscriptions, and still-maturing enterprise usage; governance and risk packaging improve only partially; and the market still applies a premium but not a heroic one. On that path, about $10 billion to $15 billion looks more supportable. The bear case is not implausible. If regulation gets heavier, app-store or support friction
    worsens, export-control or compute constraints tighten, or growth decelerates before risk normalizes, the valuation could compress into a $6 billion to $10 billion band. That means the current reported valuation works only if several favorable assumptions arrive together, while the downside can open quickly if just a few risks stack at once.'
