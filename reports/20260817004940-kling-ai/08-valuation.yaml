- id: TV004
  title: Bull / base / bear scenario table
  columns:
  - scenario
  - assumptions
  - valuation / return logic
  - key risks
  - probability signal
  rows:
  - - Bull
    - ARR surpasses $1B within ~12-18 months; enterprise/API mix deepens; governance and compliance packaging improve materially; customer-friction indicators stabilize.
    - $18B-$24B; at the reported $18B round this is roughly flat to ~1.3x upside, so even the bull case is not huge relative to current price.
    - Execution on enterprise quality, not just growth volume, must work.
    - Possible but requires several favorable milestones to land together.
  - - Base
    - ARR continues growing into roughly $650M-$800M range; creator and enterprise mix remains blended; premium multiple persists but compresses from frontier euphoria.
    - $10B-$15B; roughly ~0.6x to ~0.8x of the reported July 2026 mark.
    - Mixed revenue quality, unresolved support friction, and governance opacity keep the discount in place.
    - Most supportable path from current evidence.
  - - Bear
    - ARR stalls near current levels or customer quality weakens; regulation, app distribution, or compute constraints worsen; spinout remains strategically dependent on Kuaishou.
    - $6B-$10B; roughly ~0.3x to ~0.6x of the reported July 2026 mark.
    - Multiple compression and trust deterioration can hit simultaneously.
    - Material downside case, not a tail fantasy.
  notes: Ranges are meant to frame entry discipline from the reported July 2026 price, not to pretend that the current public evidence allows precise DCF-style valuation.
