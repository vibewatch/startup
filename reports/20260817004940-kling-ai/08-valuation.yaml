tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - dimension
  - assessment
  - evidence basis
  - decision implication
  rows:
  - - Recommendation
    - Track
    - Growth, funding, and product proof are real, but public evidence does not yet justify paying the reported $18B mark with conviction.
    - Monitor closely; do not chase the current reported price.
  - - Confidence
    - Medium
    - There is enough public evidence to bound the range, but not enough standalone financial disclosure for a high-confidence fairness view.
    - Re-rate only after filing-grade or audit-grade disclosure.
  - - Risk rating
    - High
    - Governance dependence, regulatory burden, customer-friction signals, and incomplete unit economics create correlated downside.
    - Demand deeper diligence before any primary investment decision.
  - - Valuation stance
    - Stretched
    - The reported valuation implies a multiple far above public AI/software revenue benchmarks and about 36x the disclosed March 2026 ARR.
    - Require stronger proof or a lower entry.
  - - Return profile at current mark
    - Limited margin of safety
    - Upside exists, but the range of plausible outcomes from here is not attractive enough versus the remaining evidence gaps.
    - Prefer patience over price-taking.
  notes: This assessment is price-sensitive rather than company-quality-only; it asks whether the currently reported market price is supported by public evidence.
