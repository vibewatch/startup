- id: TV006
  title: Final diligence asks table
  columns:
  - topic
  - missing evidence
  - why it matters
  - owner or diligence path
  rows:
  - - Cap table and governance
    - Board composition, reserved matters, Kuaishou control rights, investor protections, and spinout separation milestones.
    - Minority underwriting is impossible to price cleanly without governance clarity.
    - Request shareholder and governance summary from company / lead investors.
  - - Standalone financial quality
    - Audited revenue, gross margin, burn, runway, and consumer-vs-enterprise mix.
    - The current price requires more than headline ARR and quarterly revenue snapshots.
    - Request audit-grade financial package and board materials.
  - - Retention and cohort quality
    - NRR/GRR, cohort retention, refund/chargeback rates, and usage-to-paid conversion by channel.
    - Tells whether ARR is durable or promotion-heavy.
    - Request cohort deck and billing-quality metrics.
  - - Enterprise pipeline depth
    - Named pipeline, win rates, expansion cohorts, and concentration across large accounts.
    - Current public proof is strong but somewhat concentrated in marquee references.
    - Interview GTM leadership and reference customers.
  - - Compliance and assurance packet
    - AI-labeling architecture, filing status, privacy controls, trust / security materials, and incident history.
    - Needed to decide what discount regulatory and procurement risk deserves.
    - Request compliance memo, trust packet, and release-control documentation.
  - - Compute exposure
    - GPU / cloud vendor mix, geographic deployment, and contingency plan for export-policy changes.
    - A hidden infrastructure bottleneck could change both growth and margin.
    - Request infra architecture and vendor concentration analysis.
  notes: These asks are the minimum set needed to move from “interesting, but do not chase” toward an investable price-sensitive yes/no decision.
