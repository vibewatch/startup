- id: TV003
  title: Comparable valuation table
  enumerationScope:
    coverage: partial
    basis: This set intentionally mixes Kling’s own reported July 2026 mark with four public software/AI references that have current market-cap and revenue data. It is not exhaustive because frontier AI private peers generally do not publish directly comparable financials.
  columns:
  - comparable
  - metric
  - multiple / valuation / status
  - relevance
  - limitation
  rows:
  - - Kling AI reported July 2026 round
    - Post-money valuation / March 2026 ARR
    - $18.0B on ~$500M ARR (~36.0x)
    - Most relevant current price anchor for the company itself.
    - Private valuation; ARR not the same as audited revenue; no standalone filing on disk.
  - - Adobe
    - Market cap / TTM revenue
    - $104.94B / $25.19B (~4.17x)
    - Creative-software incumbent relevant to professional creator tooling and monetization discipline.
    - Far larger, public, and more profitable than Kling.
  - - Duolingo
    - Market cap / TTM revenue
    - $6.21B / $1.09B (~5.70x)
    - Consumer subscription platform showing what strong engagement can earn in public markets.
    - Language-learning model differs from generative-video economics and regulation.
  - - GitLab
    - Market cap / TTM revenue
    - $7.19B / $1.00B (~7.19x)
    - Workflow and developer-platform comp for usage-led software monetization.
    - Not a frontier-model company and carries different compute and policy risk.
  - - C3.ai
    - Market cap / TTM revenue
    - $1.54B / $0.25B (~6.16x)
    - Pure-play public AI software reference for what markets pay for AI-branded revenue.
    - Enterprise AI application software is not the same business as consumer + video generation.
  notes: This is a directional valuation reality check, not a fairness opinion. The key point is the magnitude of Kling’s premium over public revenue benchmarks.
