- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - argument
  - supporting evidence
  - what would change the view
  rows:
  - - Kling is a real platform, not a science project.
    - Q1 2026 revenue >RMB650M, March ARR ~$500M, 60M+ creators, 600M+ videos, and 30,000+ enterprise users from Kuaishou disclosures.
    - Audited statements confirm that growth quality, not just volume, is durable.
  - - Film and premium-creative proof support a scarcity premium.
    - House of David, Swords Into Plowshares, Cannes-related creator workflows, and 4K / 3.0 releases show serious professional adoption.
    - Broader disclosed enterprise logos and repeat case studies make the proof less concentrated.
  - - The reported mark already prices in a large part of the upside.
    - An $18B post-money valuation sits well above simple public software / AI revenue multiples and around 36x disclosed March ARR.
    - A much faster ARR ramp or materially lower entry price would improve the setup.
  - - Risk packaging is still thinner than valuation implies.
    - Support complaints, non-refundable credits, parent dependence, and incomplete standalone governance/economics disclosure remain visible.
    - A full security/compliance packet, cap-table clarity, retention metrics, and cleaner customer-quality signals would reduce the discount.
  notes: The pro case is strong on growth and product proof; the anti-thesis is strong on price, governance, and evidence quality.
