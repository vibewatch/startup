  - - Google Veo
    - Model-plus-ecosystem incumbent
    - Google platform distribution and enterprise reach
    - Premium creators, filmmakers, enterprise teams
    - Native audio, realism, prompt adherence, ecosystem integration
    - Less obviously optimized for low-cost self-serve bulk generation.
  - - Pika
    - Creator-first social video tool
    - Fast-moving consumer/creator brand
    - Creators, social media teams, rapid prototyping users
    - Expressive effects, low-friction plans, quick generation
    - Weaker fit for top-end photorealistic production.
  - - Luma
    - Agentic creative workflow platform
    - Workflow-oriented creative suite with team collaboration
    - Agencies, teams, prosumers, production users
    - Shared context, agentic workflows, export for production, multi-asset campaigns
    - Public pricing and model detail are thinner than headline workflow positioning.
  - - Wan / Hailuo / routing layers
    - Chinese rival set and aggregation layers
    - Alibaba-backed open-source pressure plus alternative low-friction routes
    - Cost-sensitive teams, developers, China-linked buyers
    - Price pressure, alternative model access, open-source or routing flexibility
    - Can commoditize underlying model access and reduce vendor lock-in.
  - - Status quo / internal build
    - Substitute
    - Existing software stacks and internal teams
    - Agencies, brands, studios, product teams
    - No new vendor dependency and familiar approvals/processes
    - Lower AI velocity and potentially higher production cost.
