    relatedFigureRefs:
    - FP003
  - type: private-evidence-only
    severity: material
    topic: Enterprise switching costs are not well disclosed
    missingEvidence: No public cohort data shows how painful it is for enterprise or studio users to migrate away from Kling.
    whyItMatters: Without switching-cost proof, premium valuation claims should be discounted.
    diligencePath: Request renewal data, workflow-depth evidence, API integration timelines, and examples of customers expanding rather than rotating among vendors.
    relatedQuestionRefs:
