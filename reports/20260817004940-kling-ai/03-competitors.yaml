    - Creators, marketers, film/TV, developers
    - Strong human motion, reference consistency, native audio, multi-shot storytelling, cost-efficient short-form output
    - Public moat evidence is thinner than raw capability evidence; pricing and switching risk remain high.
  - - Runway
    - Professional creative workflow platform
    - Used by 60M+ creatives; private valuation widely reported around late-stage scale
