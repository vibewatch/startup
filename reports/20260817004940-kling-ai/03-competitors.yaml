  rows:
  - - Kling consumer studio
    - $6.99 standard, $25.99 pro, $64.99 premier, $127.99 ultra in August 2026 blog guide
    - Credits, 1080p, commercial use, higher monthly pools, priority access at upper tiers
    - App Store pricing anchors differ by channel; realized enterprise pricing unknown
    - Aggressive consumer pricing supports creator acquisition and high-volume experimentation.
  - - Kling API
    - ~$0.084-$0.42 per second depending on mode and quality in third-party summaries
    - Usage-based API generation, packages, bulk discounts, custom plans
    - Official pricing can change and must be refreshed before launch
    - Programmable access widens addressable use cases but makes cost comparison highly task-specific.
  - - Runway
    - $12-$76/month consumer tiers in retrieved sources; higher professional orientation
    - Creative suite, credits, workflow tools
    - API and enterprise pricing not cleanly standardized in retrieved set
    - Higher price fits professional workflow positioning.
  - - Pika
    - $8 basic, $35 pro, $95 fancy in independent comparison summary
    - Creator plans and stylized video tooling
    - Official pricing page was sparse in retrieved set
    - Low-friction creator competition keeps entry-level pricing pressure high.
  - - Luma
    - $29.99/month in comparison summary; team/workflow emphasis in official site
    - Workflow, collaboration, production delivery, multi-asset campaigns
    - Official pricing details limited in retrieved set
    - Competes on system-level productivity more than pure cheapest clip cost.
  - - Veo
    - Often accessed through Google ecosystem products rather than a simple studio-style list price
    - Native audio and premium quality via Google surfaces
    - Direct apples-to-apples self-serve pricing remains less transparent here
    - Ecosystem leverage can outweigh list-price comparison for enterprise users.
