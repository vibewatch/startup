  rows:
  - - Kuaishou distribution adjacency
    - Premium or ecosystem incumbents can still win enterprise demand
    - high
    - Measure how much actual acquisition or retention depends on Kuaishou surfaces.
  - - Motion realism and human performance
    - Rivals are improving rapidly on realism and audio
    - high
    - Track win/loss reasons on human-subject and ad-video workloads.
  - - Reference consistency and multi-shot control
    - Runway and Veo also push hard on controllability
    - high
    - Request customer evidence showing why Kling wins repeat multi-shot work.
  - - Cost-efficient short-form output
    - Price compression can destroy margins or force discounting
    - high
    - Request contribution margin by mode and segment.
  - - API plus studio breadth
    - Aggregation layers reduce integration switching cost
    - medium-high
    - Quantify how many customers use Kling exclusively versus through a routing layer.
  - - Commercial traction scale
    - Competitor scale and capital can catch up or outspend
    - medium-high
    - Track enterprise cohort retention and expansion, not just raw customer counts.
  - - China-linked ecosystem strength
    - Regulation and geopolitics can reduce cross-border adoption
    - medium-high
    - Request geography mix and international pipeline conversion.
  notes: The top risk is not absence of demand, but failure to convert capability into durable workflow lock-in.
