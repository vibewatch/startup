  - type: private-evidence-only
    severity: material
    topic: Customer exclusivity is not publicly proven
    missingEvidence: Public sources do not show how many major customers standardize on Kling versus use it alongside Runway, Veo, Pika, or routing layers.
    whyItMatters: Vendor exclusivity and workflow embedding are central to moat durability and pricing power.
    diligencePath: Request top-customer tool-stack maps, win/loss notes, and switching-cost evidence by segment.
    relatedQuestionRefs:
    - QP023
    relatedTableRefs:
