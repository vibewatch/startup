- id: TE003
  title: Technology / operating architecture table
  columns:
  - layer/process/component
  - role
  - dependency
  - risk
  rows:
  - - Unified multimodal model framework
    - Core generation engine spanning text, image, audio, and video
    - Model training, serving infrastructure, reference handling
    - Black-box architecture leaves performance and cost hard to audit publicly.
  - - Reference / element controls
    - Anchor subject identity, objects, voices, and scene elements
    - User-supplied references and rights to them
    - Reference misuse, IP issues, or weak consistency can degrade output trust.
  - - Multi-shot orchestration
    - Convert prompt structure into shot sequence and pacing
    - Prompt clarity, duration budgeting, camera logic
    - Complex scenes can still fail or require retries.
  - - Native audio generation
    - Produce dialogue, ambience, and synchronized sound
    - Language models, speech generation, lip sync alignment
    - Audio sync or multilingual quality may vary by scene complexity.
  - - Output and extension layer
    - Deliver 1080p/4K clips and longer extended videos
    - Rendering capacity, storage, app/web export surfaces
    - Longer or higher-resolution output increases compute and queue pressure.
  - - API and account layer
    - Expose programmatic access, pricing, and usage tracking
    - Authentication, quotas, account governance, support process
    - Public technical and enterprise-control detail is incomplete.
  notes: The table summarizes the public operating model rather than claiming a full internal system diagram.
