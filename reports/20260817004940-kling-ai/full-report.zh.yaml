  - id: TV004
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - ARR 在 ~12-18 个月内超过 $1B；企业 / API 占比加深；治理和合规材料显著改善；客户摩擦指标稳定。
        - $18B-$24B；相对据报道 $18B 融资轮，约为持平到 ~1.3x 上行，因此即使乐观情景相对当前价格也不算大。
        - 必须跑通企业质量，而不只是增长规模。
        - 可能发生，但需要多个有利里程碑同时落地。
      - - 基准
        - ARR 继续增长至约 $650M-$800M 区间；创作者与企业收入组合仍然混合；溢价倍数延续，但从前沿模型狂热中压缩。
        - $10B-$15B；约为据报道 2026 年 7 月估值的 ~0.6x 至 ~0.8x。
        - 收入质量混杂、支持摩擦未解、治理不透明，使折价继续存在。
        - 当前证据最能支撑的路径。
      - - 悲观
        - ARR 停在当前附近，或客户质量走弱；监管、应用分发或算力约束恶化；剥离后仍在战略上依赖 Kuaishou。
        - $6B-$10B；约为据报道 2026 年 7 月估值的 ~0.3x 至 ~0.6x。
        - 倍数压缩和信任恶化可能同时发生。
        - 实质下行情景，不是尾部幻想。
    notes: 区间用于围绕据报道 2026 年 7 月价格约束入场纪律，不是假装当前公开证据足以做精确 DCF 估值。
