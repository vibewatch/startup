      - number: '6.4'
        title: 扩张循环和集中度风险
        blocks:
          - type: paragraph
            body: >-
              最可信的客户扩张路径，是从创作者实验进入更重的付费使用，再进入团队协作，最后进入生产或企业工作流。官方材料支持这种递进。应用商店把创作和社区功能卖给个人，付费条款定义会员和点数，Team Plan 为最多 15
              名成员加入协作创作，具名影视和商业项目则说明 Kling
              可以从单人实验走进工作流嵌入。影视和广告证据还暗示第二条扩张循环：一个成功项目转化为更广泛的工作室或代理关系。但集中度风险仍难承保。没有公开来源披露按头部客户、地域、应用商店或渠道划分的收入集中度。因此，公开证据指向的是渠道集中，而不是经典单一
              logo 集中。Kling 高度依赖应用商店做全球消费者发现，依赖 Kuaishou
              支持的分发和可信度支撑企业叙事，也依赖少数标杆生产引用证明高端工作流合法性。这足以支持可信的先落地再扩张论点，但不足以有把握地建模客户质量。
