  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管和法律风险
        blocks:
          - type: paragraph
            body: >-
              Kling 运营在全球最具规定性的 AI 治理环境之一，公开证据显示，合规并不止于模糊原则。中国 2025 年标识办法要求对 AI
              生成文字、图像、音频、视频和虚拟场景进行显式与隐式标识；应用分发平台必须审核标识材料；按用户要求提供未标识输出的服务提供者必须保存日志至少六个月。更广泛的中国制度也在通过生成式 AI
              备案、深度合成规则、数据安全和隐私法律，以及 2026 年标准制定活动继续扩张。这一点很重要，因为 Kling
              是面向公众的生成式视频服务，不是内部工具。它自己的法律文件又增加了更多风险。服务协议称产品按现状和可用状态提供，隐私政策确认对上传和生成内容进行广泛存储与处理，条款还要求明确的会员和点数治理。对投资人而言，法律风险因此不只是一个假设性的版权争论。它是在快速收紧的制度下，内容标识、应用审核、数据处理、用户权利和合同摩擦义务的现实组合。
