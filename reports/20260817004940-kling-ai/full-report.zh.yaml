  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议和价格纪律
        blocks:
          - type: paragraph
            body: >-
              核心估值问题不是 Kling 产品是否亮眼，而是截至 2026-08-17 的公开证据，能否支撑按 2026 年 7 月传出的估值入场。按这个标准，答案还不到。CNBC、TechNode 等 7
              月报道大体指向一轮约 $2.8 billion 融资，投后估值 $18 billion，同时 Kuaishou 仍保留多数控制权。Kuaishou 自身公告证明商业化已经跑起来：Kling 2026 年 Q1
              收入超过 RMB650 million；此前在 2025 年 12 月披露 $240 million 收入运行率后，2026 年 3 月 ARR 约达 $500
              million。这样的增长足以让投资人继续关注，也足以支撑相对普通软件公司的估值溢价。但同一组证据还没有证明独立利润率能扛住、客户质量指标足够清楚、分部经济经过审计，或治理风险已经拆掉。当价格已经按前沿软件稀缺性定价，信息缺口比产品兴奋度更关键。因此我的建议是观察，而不是买入：这门生意值得密切跟踪，但当前传出的估值，对执行、监管和披露不确定性留下的安全垫太薄。
