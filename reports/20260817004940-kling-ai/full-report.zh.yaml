      - number: '3.3'
        title: 定价、包装和多栖使用
        blocks:
          - type: paragraph
            body: >-
              定价进一步说明市场仍高度碎片化。Kling 消费者套餐显著低于高端企业级创意套件；第三方 API 摘要则把其程序化定价放在预算友好到中档区间，取决于质量模式。Runway
              订阅层级明显更高，符合其专业定位。Pika 面向创作者保持低摩擦。Luma 更偏团队和工作流价值，而不只是最低生成成本。Veo
              往往通过生态接入竞争，而不是简单按标价正面对比。这些差异创造了一个多栖使用市场。团队可以在一个工具里做原型，在另一个工具里制作主视觉镜头，再通过 Kling
              或其他低成本路径跑高量社交或产品内容。聚合层降低工程锁定，让切换更容易。结果是，定价重要，但可持续优势来自可重复的工作流价值、买方能感知的边际质量，以及把重复生产迁到别处会有多痛。
