      - - 剥离执行
        - 独立计划停滞，或治理仍不透明
        - 融资轮后治理分离没有实质进展
        - 施加更高治理折价，并推迟投资
      - - 企业转化风险
        - 具名生产案例未能转化为更广泛客户
        - 标杆案例没有扩展为可复制案例，或披露企业指标
        - 下调高端工作流收入预期
      - - 估值风险
        - 风险栈改善前，增长或 ARR 放缓
        - 相对 Q1 / ARR 轨迹显著放缓，且没有更好的留存或治理证据
        - 与其激进进场，不如保持观察和价格纪律
    notes: 叫停标准应能从后续备案、产品更新、平台状态或客户验证中观察到，而不是只靠私下叙事。
    claimRefs:
      - CR032
      - CR033
      - CR038
      - CR039
