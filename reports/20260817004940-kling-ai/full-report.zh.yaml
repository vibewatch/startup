  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 支撑证据
      - 什么会改变判断
    rows:
      - - Kling 是真实平台，不是科研项目。
        - Kuaishou 披露：2026 年 Q1 收入 >RMB650M、3 月 ARR ~$500M、创作者 60M+、视频 600M+、企业用户 30,000+。
        - 审计报表确认耐久的不只是规模，还有增长质量。
      - - 影视和高端创意验证支撑稀缺性溢价。
        - House of David、Swords Into Plowshares、围绕 Cannes 的创作者工作流，以及 4K / 3.0 版本发布，显示专业场景已认真采用。
        - 披露更多企业 logo 和重复案例后，验证不再这么集中。
      - - 据报道的估值已经计入大部分上行。
        - $18B 投后估值明显高于简单的上市软件 / AI 收入倍数，约为已披露 3 月 ARR 的 36x。
        - ARR 爬坡大幅加快，或入场价格实质降低，才会改善交易设置。
      - - 风险包装仍薄于估值要求。
        - 支持投诉、不可退款点数、母公司依赖，以及独立治理 / 经济模型披露不完整，仍然可见。
        - 完整安全 / 合规材料、清晰股权结构、留存指标和更干净的客户质量信号，会降低折价。
    notes: 正向逻辑强在增长和产品验证；反向逻辑强在价格、治理和证据质量。
