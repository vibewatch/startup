  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 以 IC 口径，从市场、验证、经济性、治理、风险和估值支撑给 Kling 打分。
    data:
      items:
        - label: 市场机会
          value: 9/10
          note: AI 视频和多模态创作仍是大市场，也有战略重要性。
        - label: 产品 / 工作流验证
          value: 8/10
          note: 影视、创作者和企业使用验证真实存在，并在改善。
        - label: 收入动能
          value: 8/10
          note: Q1 收入和 ARR 加速说明商业化已具备严肃性。
        - label: 变现质量
          value: 5/10
          note: 付费牵引已经出现，但退款 / 支持摩擦和收入结构不透明压低信心。
        - label: 治理准备度
          value: 4/10
          note: 分拆和少数股东保护的公开证据仍不完整。
        - label: 监管 / 算力风险
          value: 4/10
          note: 中国 AI 规则和先进芯片政策让故事里始终带着真实风险溢价。
        - label: 估值支撑
          value: 3/10
          note: 据报道估值已经计入大量未来成功。
    claimRefs:
      - CV005
      - CV018
      - CV020
      - CV028
      - CV031
      - CV042
