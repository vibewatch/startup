      - number: '6.2'
        title: 采用规模和具名客户证据
        blocks:
          - type: paragraph
            body: >-
              公开采用证据强到值得认真对待。Kuaishou 称，截至 2026 年 2 月，Kling 服务超过 6000 万创作者；截至 2025 年 12 月，生成视频超过 6 亿条，并与超过 30000
              名企业用户合作。消费者规模能见度也具体，而非假设。运行日，美国 App Store 显示 28000 条评分、评分 4.7；Google Play 显示下载量超过 1000 万、评论超过 528000
              条。具名生产证据更重要，因为它证明使用超出了业余实验。Wonder Project 公开称 Kling 是 House of David 以及之后 The Old Stories Moses
              的核心或基准工具。Variety 另行记录了第一季 72 个 AI 辅助镜头，以及在更广专业工具链中使用 Kling。Timeaxis Studios 称 Kling 被整合进 Swords Into
              Plowshares 全流程；The RealReal 的 Cannes 获奖作品 L’Ultimo Uomo Reale，以及 Raphael、MINIBOTS 等 Cannes 论坛项目，则显示 Kling
              正被用于全球品牌和电影工作流。限制在于，这些证据主要证明生产使用和热情，而不是已披露合同价值或续约行为。
