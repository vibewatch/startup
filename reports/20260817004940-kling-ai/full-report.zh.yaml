      - number: '2.2'
        title: 市场规模测算视角和自下而上的现实
        blocks:
          - type: paragraph
            body: >-
              可用市场研究指向同一方向，但数值并不一致。MarketsandMarkets 和 Statista 等广义生成式 AI 报告给出极大且快速增长的宏观背景；Adwave 引用的较窄 AI
              视频估算则小得多，但仍增长很快。这种差异不是需要抹平的噪音；它恰恰说明分析师在测量技术栈的不同层级。对 Kling 来说，最有用的解读是分层：全球 GenAI 需求显然在扩张，AI
              视频软件已经成为独立商业品类，Kling 本身也已经达到足够收入规模，证明这个市场并非假设。Kuaishou 披露 Kling 2026 年 Q1 收入超过人民币 6.5 亿元、2026 年 3 月 ARR 约
              USD500M 尤其重要，因为即使公开 SAM 和地理拆分仍不可得，它也提供了自下而上的证据，说明有意义的可服务市场已经存在。
