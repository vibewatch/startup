      - number: '6.3'
        title: 留存、满意度和采购摩擦
        blocks:
          - type: paragraph
            body: >-
              耐久性是 Kling 公开客户记录中最弱的一环。保留来源没有披露 NRR、GRR、logo
              流失、付费转化、平均合同期限，或消费者、团队和企业账号之间的收入拆分。公开记录提供的是积极规模代理指标和可见摩擦的混合体。Apple 和 Google 证明 Kling 拥有大型活跃受众，Google Play
              评论显示，至少有部分用户认为图生视频质量足够强，值得认真评估。但 Trustpilot 和 Google Play 也保留了围绕点数烧掉、生成结果消失、账单不透明和支持响应差的持续反向模式。Kling
              付费服务条款加深了担忧，因为已激活的付费服务不退款，点数是虚拟物品而非储值，自动续订会持续到明确取消。服务协议还表示，产品按现状和可用状态提供，不保证服务不中断。对企业采购而言，隐私和内容许可条款几乎和原始生成质量一样重要，因为客户需要确信上传材料、生成输出和订阅操作不会制造法律、财务或品牌管理问题。
