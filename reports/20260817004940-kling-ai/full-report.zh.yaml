      - number: '8.3'
        title: 情景区间、下行与回报测算
        blocks:
          - type: paragraph
            body: >-
              情景分析重要，因为可见事实对增长很强，对财务质量较弱。乐观情景下，Kling 把创作者势能转成可持续的企业和 API 扩张，在大约 12 至 18 个月内把 ARR 推过 $1
              billion，压低客户摩擦信号，并证明拆分后能以可信的独立治理和合规体系运转。这样可支撑大约 $18 billion 至 $24 billion 区间；按 2026 年 7
              月传出的入场价看，上行只是温和到不错，而不是 VC 式非对称。基准情景更保守：ARR
              继续增长，但收入结构仍混在消费者积分、订阅和仍在成熟的企业用量之间；治理和风险包装只部分改善；市场仍给溢价，但不再给英雄式倍数。这条路径下，约 $10 billion 至 $15 billion
              更站得住。悲观情景并不牵强。如果监管加重、应用商店或客服摩擦恶化、出口管制或算力约束收紧，或风险正常化前增长已经降速，估值可能压缩到 $6 billion 至 $10
              billion。也就是说，当前传出估值只有在多个有利假设同时兑现时才成立；只要少数风险叠加，下行就会很快打开。
