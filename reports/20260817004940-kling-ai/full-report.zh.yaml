  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 界定 Kling 的真实市场边界
        blocks:
          - type: paragraph
            body: >-
              估值 Kling 时，不能没有边界地套用整个生成式 AI 经济。公开产品证据把公司放在几个相邻但并不相同的市场：自助式创作者订阅、移动创意工具、企业 API
              推理、广告和电商素材生产，以及更高端的电影或剧集视觉工作流。这些都是真实变现表面，但并不让 Kling 有资格把纯文本 copilots、通用云 GPU 支出，或全球 AI
              软件栈的每一美元都算进来。更站得住的框架，是可编程短形态视觉内容生成与编辑，并外溢到一致性、运动质量和参考控制很重要的生产级视听工作流。这个边界很关键，因为 Kling 目前最强的公开证据，不是通用企业 AI
              平台故事；而是一个多模态视频创作故事，铺在创作者、营销和工作室用例之上。
