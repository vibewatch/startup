      - number: '1.2'
        title: 领导层、治理和拆分结构
        blocks:
          - type: paragraph
            body: >-
              Kuaishou 母公司的治理能见度明显高于 Kling 自身实体边界。Kuaishou 2025
              年年报和英文管理层材料清楚列出联合创始人程一笑担任董事长兼首席执行官，联合创始人宿华担任执行董事；年报还披露了卢蓉 2025 年 4 月获任等独立董事变动。这些披露很关键，因为 2026 年 7
              月融资被明确描述为迈向独立商业化运营的一步，而不是已经完成分拆。外部报道还显示，轮后 Kuaishou 将保留约 68.33% 控制权。本文审阅的公开文件集中仍缺少后期投资人通常想看到的独立治理包：完整
              Kling
              董事会名单、拆分业务的具名独立董事、完整管理团队页面，以及超出母公司控制权标题之外的详细股本结构。这一缺口并不否定业务，但会抬高尽调风险，因为投资人是在用仍主要属于上市母公司的治理证据，为一家按独角兽到十角兽价格计价的公司承保。
