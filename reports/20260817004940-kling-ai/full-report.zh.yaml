      - number: '1.4'
        title: 规模、牵引、里程碑和不利背景
        blocks:
          - type: paragraph
            body: >-
              对一个 2024 年 6 月才上线的产品而言，Kling 的规模叙事异常强。Kuaishou 官方发布称，Kling 2025 年 3 月年化收入运行率超过 $100M，2025 年 12 月 ARR 超过
              $240M，到 2026 年 3 月接近约 $500M ARR。相同官方材料称，截至 2025 年底至 2026 年初，平台服务全球超过 6000 万创作者，生成超过 6 亿条视频，并与超过 30000
              名企业用户或客户建立关系。产品里程碑也推进很快：2025 年 12 月 Omni Launch Week，2026 年 2 月 Kling 3.0，一季度上线团队协作功能，2026 年 4 月发布原生
              4K。公开商业证据不限于泛泛的创作者营销。Kuaishou 提到参与历史剧 Swords Into Plowshares 和 Hollywood 剧集 House of David；Kling 自有博客则重点介绍
              The RealReal 在 Cannes Lions 获奖的 L’Ultimo Uomo Reale，把它作为情绪连续性和角色稳定性比新奇感更重要的案例。反向压力来自合规和披露风险。中国 2025 年 AI
              内容标识规则正面覆盖 AI 生成视频和应用分发界面，Kling 向主流和企业渠道推进时，监管负担也随之变成现实。
