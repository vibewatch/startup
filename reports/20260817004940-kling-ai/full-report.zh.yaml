  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: Kling 实际竞争的位置
        blocks:
          - type: paragraph
            body: >-
              Kling 并不只在一条干净赛道竞争。公开表面显示，它同时处在消费者 AI 视频创作、创作者工作流软件、企业 API
              视频生成，以及面向广告和娱乐制作的视听工具中。因此，正确的同业集合会随买方变化。面对创作者和效果营销人员，Kling 与 Pika、Luma 以及其他快周转工具竞争。面对更高端的故事、广告和电影工作流，它会撞上
              Runway 和 Veo。面对中国相关或成本敏感买方，它还要面对 Wan、Hailuo、Seedance，以及在一个界面后暴露多个模型的路由层。实际含义是，Kling
              受益于品类宽度，但不能假定赢下一个基准或一个价格层级就能锁住整个市场。买方通常在为具体任务做选择：人物真实感、镜头控制、音频、成本、集成或产能。当任务需要电影感短形态输出、可信运动和角色连续性，同时价格低于高端西方工具时，Kling
              的公开故事最强。
