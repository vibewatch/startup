  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 评估
      - 证据基础
      - 决策含义
    rows:
      - - 建议
        - 观察
        - 增长、融资和产品验证都是真实的，但公开证据还不足以让人有把握支付据报道 $18B 估值。
        - 密切跟踪；不要追当前据报道的价格。
      - - 置信度
        - 中
        - 公开证据足以框定区间，但独立财务披露不足，难以高置信判断估值是否公允。
        - 只有拿到监管文件级或审计级披露后再重估。
      - - 风险评级
        - 高
        - 治理依赖、监管负担、客户摩擦信号和不完整的单位经济模型，会形成相关下行风险。
        - 做任何新股投资决定前，必须加深尽调。
      - - 估值立场
        - 偏高
        - 据报道估值对应的倍数远高于上市 AI / 软件收入基准，约为已披露 2026 年 3 月 ARR 的 36x。
        - 需要更强证据，或更低入场价格。
      - - 当前估值下的回报画像
        - 安全边际有限
        - 上行空间存在，但与剩余证据缺口相比，从当前价格出发的合理结果区间不够有吸引力。
        - 宁可等待，不接受被动价格。
    notes: 本评估对价格敏感，而不只判断公司质量；核心问题是当前据报道的市场价格是否有公开证据支撑。
