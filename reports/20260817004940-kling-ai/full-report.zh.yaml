  - id: TV005
    title: 投资逻辑破坏与叫停触发项表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 合规 / 应用商店事件
        - 任何牵涉 AI 标识或内容治理的正式执法、审核失败、暂停或更新受阻。
        - 监管风险从抽象折价变成运营中断。
        - 暂停投资判断，直到理解控制体系和分发受损程度。
      - - 增长质量恶化
        - 相比 Q1 / ARR 轨迹出现可见放缓，且客户质量或企业深度没有相应改善。
        - 削弱溢价倍数的核心理由。
        - 重切估值，并下调信心。
      - - 客户信任侵蚀
        - 围绕点数、退款、支持或作品消失的公开投诉持续恶化。
        - 指向低质量变现，也说明留存弱于表面用户规模暗示。
        - 下调收入质量假设。
      - - 剥离后治理不透明
        - 2026 年 7 月融资后，独立治理仍没有实质澄清。
        - 当前价格下，少数股投资判断和退出规划更难。
        - 要求治理折价，或避免入场。
      - - 算力 / 出口管制收紧
        - 实质性先进芯片新限制，或可见的容量瓶颈。
        - 可能同时压缩产品速度和利润率。
        - 重做增长、capex / opex 和时点假设。
    notes: 叫停触发项应能通过公开或尽调证据观察，而不是只靠叙事。
