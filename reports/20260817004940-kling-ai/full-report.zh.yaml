  - id: TV003
    title: 可比估值表
    enumerationScope:
      coverage: partial
      basis: >-
        This set intentionally mixes Kling’s own reported July 2026 mark with four public software/AI references that
        have current market-cap and revenue data. It is not exhaustive because frontier AI private peers generally do
        not publish directly comparable financials.
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 相关性
      - 局限
    rows:
      - - Kling AI 据报道 2026 年 7 月融资轮
        - 投后估值 / 2026 年 3 月 ARR
        - $18.0B 对 ~$500M ARR（~36.0x）
        - 公司自身当前最贴近的价格锚。
        - 私募估值；ARR 不等于审计收入；未看到独立申报文件。
      - - Adobe
        - 市值 / TTM 收入
        - $104.94B / $25.19B（~4.17x）
        - 创意软件龙头，可参照专业创作者工具和变现纪律。
        - 规模远大于 Kling，且已上市、盈利能力更强。
      - - Duolingo
        - 市值 / TTM 收入
        - $6.21B / $1.09B（~5.70x）
        - 消费订阅平台，显示强互动在公开市场能获得什么估值。
        - 语言学习模式不同于生成视频的经济模型和监管。
      - - GitLab
        - 市值 / TTM 收入
        - $7.19B / $1.00B（~7.19x）
        - 工作流和开发者平台可比，参照用量驱动软件变现。
        - 不是前沿模型公司，算力和政策风险不同。
      - - C3.ai
        - 市值 / TTM 收入
        - $1.54B / $0.25B（~6.16x）
        - 纯 AI 软件上市参照，显示市场愿意为 AI 品牌收入支付什么价格。
        - 企业 AI 应用软件不同于消费者 + 视频生成业务。
    notes: 这是方向性估值现实校验，不是公平性意见。关键在于 Kling 相对上市收入基准的溢价幅度。
