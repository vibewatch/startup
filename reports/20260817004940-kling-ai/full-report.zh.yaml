      - number: '7.2'
        title: 运营、客户和信任风险
        blocks:
          - type: paragraph
            body: >-
              运营风险清晰可见，原因不是公司发布了成熟信任中心，而是 Kling 最强的客户证据来自真实消费者和生产使用。面向客户的条款排除不中断可用性保证，已激活的付费服务不退款，应用商店 /
              投诉界面保留了围绕点数消耗、生成结果消失、升级混乱、支持沉默和账单争议的反复不满。这些问题比普通消费者投诉更重要，因为 Kling
              正试图从病毒式创作者应用迈向专业生产和企业平台。如果用户感觉失败生成也会消耗稀缺点数，或者支持和开票仍薄弱，从实验到重复付费使用的转化可能卡住。同一问题在更大客户那里会放大。公开来源显示，影视和活动团队在可靠性、权利管理和交付一致性都很重要的工作流中使用
              Kling；但关于企业 SLA、事故历史、认证或采购材料的公开证据很薄。结果是一个典型扩张风险：产品热度可见，但保证包装看起来弱于大型、风险敏感买方在把供应商更深嵌入生产系统前通常想要的水平。
