      - number: '1.3'
        title: 融资、所有权和资本形成
        blocks:
          - type: paragraph
            body: >-
              Kling 2026 年 7 月融资，是市场把 AI 视频视为独立资产类别、而非更广义生成式 AI 内部功能的最清晰信号之一。多家独立报道将 7 月 2 日这一轮规模放在略高于 190
              亿元人民币，有些来源称最高承诺金额约 204.5 亿元人民币，投后估值约 $18B。财团异常广泛且战略意义突出：Kuaishou 继续控股，Tencent 即便押注自身 AI 生态仍然投资，Alibaba
              Cloud、Baidu、CITIC Securities、BlueFive、CPE Yuanfeng、Guofang Venture Capital、Zhongguancun Science City Fund
              和 CAS Investment 也都出现在交易报道中。这一轮的战略含义至少和融资金额一样重要。Kuaishou 与外部报道都把交易描述为独立商业化运营和最终 IPO
              准备，意味着私募市场相信，以接近公开股权的方式分离，可能释放 Kuaishou 上市倍数未反映的价值。限制在于，公开记录仍未披露清算优先权、老股转让、债务、员工股权池细节，或最终按投资人拆分的所有权桥。
