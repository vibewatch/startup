  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 变现表面清晰，即使收入结构不清楚
        blocks:
          - type: paragraph
            body: >-
              Kling 不是还在寻找商业模式的产品。公开来源显示，它拥有分层变现栈：通过网页和应用渠道销售消费者会员，按具体生成功能消耗点数，应用内购买，按用量计费的 API
              定价，面向更大程序化用户的预付资源包，以及面向更高用量或企业买方的定制安排。公司还通过团队导向工作流功能变现，而不只是一人创作。这个架构很重要，因为它证明多个收入表面已经存在。未知的是结构。公开披露仍没有告诉投资人，消费者订阅、企业合同、API
              用量或特定渠道应用内购买各贡献多少收入。这一区分很关键，因为收入质量、毛利率、支持负担和留存画像会在这些表面之间大幅变化。因此，Kling
              的变现机制可见，但投资人仍是在推断每台引擎的权重，而不是看到已披露的收入桥。
