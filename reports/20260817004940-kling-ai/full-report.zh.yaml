      - number: '8.4'
        title: 退出准备度、尽调要求与最终观点
        blocks:
          - type: paragraph
            body: >-
              最终判断因此对价格和证据都很敏感。Kling 已有足够牵引力、产品质量和战略投资人兴趣，从原则上仍具备可投性。缺的是按当前估值把公司当成可持续独立主体承销所需的材料包。投资人仍需要看清 7
              月轮后股权结构表和少数股东权利，拿到经审计的独立财务、收入结构与留存细节、企业客户集中度、客服与退款 KPI，以及算力依赖和合规运营的具体图景。单看公开记录，退出故事也还没到可以递表的程度。未来 IPO
              或更大的跨轮融资，如果 ARR
              快速复合、风险包装改善，有可能在或高于今天估值成交；但今天的公开材料更像高质量动量证据，还不是完整承销证明。因此最终姿态仍是观察。比起又一条普通产品公告，更低的入场估值，或经济性与治理披露大幅改善，会更快改变判断。
