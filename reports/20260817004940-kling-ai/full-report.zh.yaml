chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品表面和商业模式
        blocks:
          - type: paragraph
            body: >-
              Kling AI 更像 Kuaishou 旗下旗舰生成式视频与图像业务，而不是一家拥有长篇公开披露的完全独立公司。官方首页把它定位为下一代 AI 视频和图像生成器；Kuaishou
              文件则称其为集团自研多模态视频生成大模型，也是更广泛短视频平台内部的重要商业化引擎。公开产品证据显示，这项业务横跨消费者创作应用、面向创作者的社区和提示词教育界面、专业发布节奏，以及以 Kling 3.0
              模型家族为核心的更高端生产工具。这个家族把文字、图像、音频和视频输入并入一个工作流，加入原生音频和多镜头控制，并把生成时长延至 15
              秒，同时保持角色和元素一致。变现已经在多个层面可见：消费者会员、点数包、更高分辨率和 4K 加价、团队协作，以及企业或生产端采用。核心承保结论是，Kling 已经不只是挂在 Kuaishou
              品牌上的研究演示。它已经是一套商业产品栈，拥有独立包装、创作者教育和工作流专门化；只是消费者、企业、API 和补贴增长渠道之间的具体拆分仍未披露。
