      - number: '7.4'
        title: 财务 / 模型风险和终止标准
        blocks:
          - type: paragraph
            body: >-
              财务模型风险在于，一家增长证据明显的公司，按当前价格仍可能很难干净承保。2026 年 7 月这一轮意味着约 $18B 投后估值，而公开一手来源只披露 ARR
              和季度收入快照，没有披露独立利润率、消耗或留存。2026 年 Q1 收入超过人民币 6.5 亿元、ARR 约 $500M
              令人印象深刻，但并没有回答业务能否在退款、支持、审核和算力成本同步上升时，仍维持创作者增长。关于海外收入结构和独立计划的二级报道方向上有用，但仍不能替代经审计的分段财务。这意味着正确风险姿态应对价格敏感且可监控。若客户投诉恶化、应用商店分发受损、中国
              AI 合规运营负担加重、出口管制或算力获取收紧，或拆分业务仍更像叙事而非运营独立，投资论点会更快破裂。核心问题不是 Kling
              是否足够好、能继续增长，而是在治理和耐久性证据仍不完整时，它的当前风险栈是否正足够快下降，以支撑前沿软件估值。
