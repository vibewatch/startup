    title: 风险传导图
    type: dag
    layout: standard
    summary: 合规、支持和基础设施风险可能很快传导到客户信任、变现质量和估值支撑。
    data:
      nodes:
        - id: reg
          label: 中国 AI 规则
          detail: 标识、备案、应用审核和数据治理义务
        - id: ops
          label: 运营摩擦
          detail: 计费、退款、客服和输出可靠性
        - id: compute
          label: 算力获取
          detail: 对出口政策和先进芯片供给敏感
        - id: trust
          label: 客户信任
          detail: 用户和团队是否愿意反复依赖 Kling
        - id: revenue
          label: 收入质量
          detail: 重复付费使用、企业转化和利润率韧性
        - id: valuation
          label: 估值支撑
          detail: 增长与风险是否撑得住前沿软件定价
