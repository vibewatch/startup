              Kling 已经从实验走到实质收入规模。Kuaishou 披露 2025 年 12 月月收入超过 USD20M，对应 USD240M ARR；随后又披露 2026 年 Q1 收入超过人民币 6.5 亿元，2026
              年 3 月 ARR 约 USD500M。这不是玩具数字。它们说明，即使在 2026 年 7 月拆分融资之前，买方已经在有意义的规模上为 AI 视频付费。融资本身也实质性改变了资本图景。多篇报道将这一轮规模放在约
              USD2.8B，投后估值 USD18B，Kuaishou 保持控制。再加上 Kuaishou 截至 2026 年 3 月 31 日拥有人民币 1177
              亿元可用资金，母公司生态看起来有能力支持激进的产品和商业化拓展投入。限制在于，这些公开数据点都没有披露 Kling
              独立现金、月度消耗或拆分后的资金续航。因此，资本充足度方向上看起来很强，但独立运营阶段的精确流动性仍需要管理层披露。
