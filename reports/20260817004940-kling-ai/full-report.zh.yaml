            body: >-
              Kling 发布的定价信号足以建模客户支出行为，但不足以证明盈利能力。官方创作者套餐列出月度点数和功能权益，App Store 展示替代渠道价格，第三方 API
              摘要提供按秒计费价格表和套餐测算。付费服务条款还明确，点数会过期、不是现金，并可通过前端价格公告更新，这进一步说明变现紧紧围绕虚拟消耗单位管理。但这些都没有回答真正的承保问题：扣除算力、审核、重试和支持后，Kling
              服务一段被接受的视频一分钟成本是多少？WaveSpeed 和 CostBench 都指出，每条可用视频的真实成本取决于被拒输出、审核时间和工作流低效，而不只是标价。这个观察在财务上很重要，因为 AI
              视频在点数表上看起来便宜，但如果失败率或返工率很高，进入生产时就会变贵。因此，公开定价是分析收入形态的强起点，不是毛利率尽调的替代品。
