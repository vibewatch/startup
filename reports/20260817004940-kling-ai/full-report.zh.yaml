  - id: TV006
    title: 最终尽调清单表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 股权结构表和治理
        - 董事会构成、保留事项、Kuaishou 控制权、投资人保护和剥离分离里程碑。
        - 没有治理清晰度，少数股投资无法干净定价。
        - 向公司 / 领投方索取股东和治理摘要。
      - - 独立财务质量
        - 审计收入、毛利率、烧钱速度、现金跑道，以及消费者与企业组合。
        - 当前价格需要的不只是标题式 ARR 和季度收入快照。
        - 索取审计级财务包和董事会材料。
      - - 留存与队列质量
        - NRR / GRR、队列留存、退款 / 拒付率，以及按渠道拆分的使用到付费转化。
        - 判断 ARR 是耐久，还是主要靠促销堆出来。
        - 索取队列材料和计费质量指标。
      - - 企业管线深度
        - 具名管线、赢率、扩张队列和大客户集中度。
        - 当前公开验证很强，但有些集中在标杆案例上。
        - 访谈 GTM 负责人和背书客户。
      - - 合规与保证材料包
        - AI 标识架构、备案状态、隐私控制、信任 / 安全材料和事件历史。
        - 用于判断监管和采购风险应享有多大折价。
        - 索取合规备忘录、信任材料包和发布控制文件。
      - - 算力敞口
        - GPU / 云供应商组合、地域部署，以及应对出口政策变化的预案。
        - 隐蔽基础设施瓶颈可能同时改变增长和利润率。
        - 索取基础设施架构和供应商集中度分析。
    notes: 这些问题是把“有意思，但不要追价”推进到可投资、价格敏感 yes/no 决策所需的最低集合。
