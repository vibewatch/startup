          label: 首个项目跑通
          detail: 真实营销素材、电影镜头或创作者短片证明工作流价值已经落地。
        - id: paid
          label: 付费或正式承诺
          detail: 用户购买点数或订阅，或团队把 Kling 纳入生产流程。
        - id: repeat
          label: 重复使用 / 续费
          detail: 只有创作者持续付费、团队扩容或项目复购，才能把采用证明转成客户留存韧性。
