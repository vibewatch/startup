      - number: '7.3'
        title: 依赖和执行风险
        blocks:
          - type: paragraph
            body: >-
              Kling 的增长故事也高度依赖对手方和执行选择，而这些并不完全由它掌控。2026 年 7 月融资后，Kuaishou 仍持有约 68% 股权，这意味着即便 Kling
              准备更独立地运营，拆分业务在战略和财务上仍与母公司绑定。这可能有帮助，但也会给外部投资人制造治理模糊。应用商店仍是关键的全球发现和计费轨道。House of David、Swords Into
              Plowshares 和 The RealReal 等标杆证据很有价值，但如果下一波具名企业引用没有出现，它们也会带来叙事集中风险。算力和地缘政治暴露则是另一组依赖。美国出口政策仍在变化：即使 2026 年 1
              月 BIS 修订后，允许按个案向获批中国客户发放 H200 许可，先进芯片获取仍由政策调解，而非确定可得。即使 Kling 无需公开披露精确 GPU
              组合，这一点仍重要。如果拆分业务的成本结构、产品速度或全球可用性依赖受约束的算力供应链，出口、许可和采购变化就可能迅速传导为运营和战略风险。
