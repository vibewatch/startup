      - number: '8.2'
        title: 可比公司组与倍数现实检验
        blocks:
          - type: paragraph
            body: >-
              最干净的估值校验，是把 Kling 隐含倍数拿去和已有市值、收入可见度的上市软件及 AI 相关公司比。CompaniesMarketCap 数据显示，截至 2026 年 8 月，Adobe 市值 / TTM
              收入约 4.2x，Duolingo 约 5.7x，GitLab 约 7.2x，C3.ai 约 6.2x。这些可比公司并不完美：Adobe 是有规模、能盈利的创意套件龙头；Duolingo
              是消费者订阅平台；GitLab 是开发者工作流公司；C3.ai 是企业 AI 软件纯标的，而不是前沿视频模型公司。即便如此，这个区间仍有用，因为 Kling 传出的 $18 billion 投后估值，约等于
              2026 年 3 月 ARR 的
              36x，明显高于公开市场为已披露软件收入支付的水平。更快增长、更强战略稀缺性和爆款平台潜力，可以解释一部分溢价。但这么大的溢价，需要治理、单位经济、客户持续性和监管控制都拿出异常干净的证据。公开来源目前还没有给到这种精度，所以正确结论不是
              Kling 被炒过头，而是这个倍数已经塞进了大量未来执行成功。
