companyProfile:
  summary: >-
    Kling AI 是 Kuaishou Technology 以北京为运营锚点的 AI 视频业务，2024 年 6 月公开发布，2026 年 7 月完成外部融资后，正准备推进更独立的商业化运营。公司销售面向消费者和专业用户的 AI
    创作工具，覆盖文生视频、图像生成、多模态编辑、API 接口、协作功能，以及原生 4K 输出、多镜头叙事等更高端的生产工作流。公开披露显示，这个年轻 AI 视频平台扩张速度异常快：创作者超过 6000 万，生成视频超过 6
    亿，合作企业用户超过 30000 家，2026 年 Q1 收入超过人民币 6.5 亿元，2026 年 3 月 ARR 约 $500M。与此同时，公开记录在独立治理、单位经济、留存质量和风险常态化上仍留下主要空白，因此应把 Kling
    视为已经具备规模、但披露仍不足的后期私营 AI 公司。
