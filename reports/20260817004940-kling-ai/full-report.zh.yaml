      - number: '2.3'
        title: 买方、预算所有者和采用路径
        blocks:
          - type: paragraph
            body: >-
              Kling 面向多种买方画像；他们共同需要更快的视觉生产，但购买理由不同。个人创作者和半专业消费者看重低摩擦订阅、社区发现和移动端易用性。营销、电商和代理团队更在意产能、产品可视化、品牌一致性，以及短形态素材
              ROI。电影、电视和高端广告用户重视角色延续、电影感运动和可控的多镜头排序。开发者和产品团队构成第四类买方，因为 API
              接入把视频生成变成产品基础设施，而不是独立工具。这些分段还会以不同方式拆开买方、用户和付款方角色。消费者层级里，用户通常直接付款；企业或工作室部署中，用户可能是创作者或开发者，但付款方是营销、制作、产品或 IT
              预算所有者。这种分层意味着 Kling 可以同时通过几个需求漏斗增长，但也意味着某一分段的牵引不应被误读为全分段统治力。
