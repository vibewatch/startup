        title: 分段图谱和进入表面
        blocks:
          - type: paragraph
            body: >-
              Kling 的客户基础应按工作流和购买动作分段，而不是被一个未区分的用户标题概括。最大可见表面是通过网页工作室、iOS 应用和 Android
              应用进入的自助式创作者；在这里，买方、用户和付款方往往是同一个购买点数或订阅的个人。第二个分段是专业影视团队，制作人或工作室负责人批准预算，导演、VFX
              主管和艺术家在生产中使用工具。第三个分段是代理机构、品牌和电商团队，用 Kling 做短形态活动、产品视频和素材迭代。第四个分段是企业工作组，Team Plan 和 30000
              名企业用户披露提供了证据；这里的买方是团队或预算所有者，而不是单个创作者。公开材料还通过 API
              和发布说明生态展示了开发者或产品团队表面，但该分段的收入质量远不如电影和创作者层级清晰。结果是一张确有宽度的客户地图，但各分段和渠道之间的证据质量很不均衡。
