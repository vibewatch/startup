companyProfile:
  summary: 'Kling AI is Kuaishou Technology’s Beijing-anchored AI video business, publicly launched in June 2024 and now being prepared for more independent commercial operations after a July 2026 external financing. The company sells consumer and professional AI creation tools spanning text-to-video, image generation, multimodal editing, API surfaces, collaboration features, and higher-end production workflows such as native 4K output and multi-shot storytelling. Public disclosures indicate unusually fast scale for a young AI video platform: more than 60 million creators, over 600 million generated videos, partnerships with 30,000+ enterprise users, Q1 2026 revenue above RMB650 million, and March 2026 ARR around $500 million. At the same time, the public record still leaves major gaps on standalone governance, unit economics, retention quality, and risk normalization, so Kling should be treated as a scaled but still under-disclosed late-stage private AI company.'
  foundedDate: '2024-06-01'
  foundingLocation: Beijing, China
  headquarters: Beijing, China
  productSummary: Kling sells AI short-video and image generation tools with text/image/audio/video workflow inputs, native multimodal generation, native audio, multi-shot storytelling, team collaboration, mobile apps, and increasingly production-oriented capabilities such as native 4K output.
  customerFocus: Global creators, agencies, marketers, film and television teams, enterprise workgroups, and developers embedding or using AI video workflows.
  businessModel: Hybrid B2C/B2B monetization through subscriptions, credits, team plans, API usage, and higher-value professional / enterprise workflows.
  stage: late-stage private spinout subsidiary
  fundingStatus: Public July 2026 reporting indicates an approximately $2.8B financing at an approximately $18B post-money valuation to support Kling’s transition toward more independent commercial operations while Kuaishou retains majority control.
