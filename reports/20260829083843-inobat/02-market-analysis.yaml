  evidenceGaps:
  - type: missing-source
    severity: material
    topic: bottom-up-sam
    missingEvidence: No retained source provides InoBat’s geographic pipeline split, ASPs, or stage-by-stage project funnel needed for a bottom-up SAM or SOM.
    whyItMatters: A realistic market-underwriting model needs more than macro TAM; it needs the company’s actual conversion path by segment and geography.
    diligencePath: Request pipeline by stage, geography, end market, and expected commissioning or qualification dates.
    relatedQuestionRefs:
    - QM024
  - type: conflicting-data
    severity: material
    topic: cell-capacity
    missingEvidence: Best current European cell-capacity sources disagree between roughly 1.0 TWh and 1.19 TWh of realistic early-2026 capacity.
    whyItMatters: The difference does not change the broad market direction, but it does affect capacity-overhang and competitive-pressure assumptions.
    diligencePath: Review the full Battery Atlas dataset and determine whether unconfirmed projects should be included in the competitive capacity baseline.
    relatedQuestionRefs:
    - QM006
