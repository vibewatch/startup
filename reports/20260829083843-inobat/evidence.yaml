evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue and stakeholder economics
    missingEvidence: >-
      Audited revenue, gross margin, cash flow, and backlog conversion disclosures remain unavailable in retained public
      sources, and the stakeholder map is still incomplete on economics and control rights.
    whyItMatters: >-
      The company’s $1.265 billion pre-money SPAC valuation cannot be underwritten from public operating metrics alone,
      and investor rights matter for governance and dilution analysis.
    diligencePath: >-
      Review the eventual F-4 or investor presentation and request recent management accounts, backlog detail,
      factory-utilization metrics, and a full cap-table with governance rights.
    relatedQuestionRefs:
      - QO014
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: headcount and board completeness
    missingEvidence: >-
      A verified 2026 headcount figure was not located in retained sources, and the public governance view remains
      incomplete beyond the visible senior bench.
    whyItMatters: >-
      Headcount is a basic proxy for execution bandwidth and fixed-cost intensity in a manufacturing business, while
      board completeness matters for governance assessment.
    diligencePath: >-
      Request a current organization chart and full board / committee roster, then compare them with payroll or
      public-company disclosures once available.
    relatedQuestionRefs:
      - QO016
    relatedTableRefs:
      - TO002
  - type: stale
    severity: material
    topic: public filing and milestone completeness
    missingEvidence: >-
      The fuller SEC proxy or F-4 materials were referenced but not yet available in the retained evidence set, so the
      milestone chronology and ownership path remain incomplete.
    whyItMatters: >-
      Those filings should reconcile ownership, earn-out terms, risk factors, and financial statements in a way the
      press release does not.
    diligencePath: >-
      Track the SEC filing docket for Cartesian II / InoBat and refresh the report once the F-4 or proxy statement is
      filed.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: bottom-up-sam
    missingEvidence: >-
      No retained source provides InoBat’s geographic pipeline split, ASPs, or stage-by-stage project funnel needed for
      a bottom-up SAM or SOM.
    whyItMatters: >-
      A realistic market-underwriting model needs more than macro TAM; it needs the company’s actual conversion path by
      segment and geography.
    diligencePath: Request pipeline by stage, geography, end market, and expected commissioning or qualification dates.
    relatedQuestionRefs:
      - QM024
  - type: conflicting-data
    severity: material
    topic: cell-capacity
    missingEvidence: >-
      Best current European cell-capacity sources disagree between roughly 1.0 TWh and 1.19 TWh of realistic early-2026
      capacity.
    whyItMatters: >-
      The difference does not change the broad market direction, but it does affect capacity-overhang and
      competitive-pressure assumptions.
    diligencePath: >-
      Review the full Battery Atlas dataset and determine whether unconfirmed projects should be included in the
      competitive capacity baseline.
    relatedQuestionRefs:
      - QM006
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: Realized ASPs, contract structures, and discounting terms are not publicly disclosed for most battery-cell peers.
    whyItMatters: >-
      Without pricing and margin data, competitive positioning relies heavily on capabilities and scale rather than
      proven economic advantage.
    diligencePath: >-
      Request representative pricing, qualification, and gross-margin benchmarks from management and compare them with
      customer references.
    relatedQuestionRefs:
      - QP024
  - type: private-evidence-only
    severity: material
    topic: income-statement
    missingEvidence: No retained public source discloses revenue, gross margin, EBITDA, or free cash flow.
    whyItMatters: Those numbers are required to assess whether the $1.265 billion valuation has operating support.
    diligencePath: Review audited historical financials and SPAC registration statement schedules when publicly filed.
    relatedQuestionRefs:
      - QI012
      - QI013
      - QI023
  - type: private-evidence-only
    severity: high
    topic: runway
    missingEvidence: Cash balance and monthly burn are not publicly disclosed.
    whyItMatters: Runway determines whether the company can reach the next financing or manufacturing milestones without distress.
    diligencePath: Request current cash, debt, capex schedule, and monthly burn by program.
    relatedQuestionRefs:
      - QI014
      - QI015
  - type: private-evidence-only
    severity: medium
    topic: ip
    missingEvidence: The retained public sources do not provide a comprehensive patent, yield, or cycle-life benchmarking package.
    whyItMatters: Those details would determine whether customization translates into a durable technical moat.
    diligencePath: Request patent inventory, third-party performance tests, and yield / scrap data by chemistry.
    relatedQuestionRefs:
      - QE016
      - QE022
      - QE023
  - type: private-evidence-only
    severity: material
    topic: commercial-metrics and named customer proof table
    missingEvidence: >-
      No retained public source discloses customer count, backlog, repeat-order behavior, or segment revenue split, and
      the named-customer proof table is necessarily partial.
    whyItMatters: Those metrics determine whether the visible logo set is converting into a durable revenue engine.
    diligencePath: Request cohort-level bookings, backlog, repeat-order rates, and top-customer concentration.
    relatedQuestionRefs:
      - QU006
      - QU007
      - QU020
      - QU025
    relatedTableRefs:
      - TU001
  - type: private-evidence-only
    severity: material
    topic: operating metrics and regulatory legal risk register
    missingEvidence: >-
      Yield, scrap, quality, customer concentration, and detailed financing plans are not publicly disclosed, while the
      regulatory and legal risk register is necessarily partial at public-source level.
    whyItMatters: Those variables determine whether the identified risks are manageable or likely to compound.
