  - TE003
- id: advanced-programs
  title: 'Advanced programs: aviation, UAV, silicon, and sodium-ion'
  body: InoBat has pursued a broader innovation agenda than most early cell companies. The Lilium work supports high-performance aviation ambitions. The E10 launch extends the company into small-format drone batteries. Group14 points to silicon-enhanced cell development, while the 2026 Clarios–Altris collaboration introduces sodium-ion as a credible adjacent program. These efforts strengthen the perception of technical depth and flexibility. However, the commercial center of gravity still appears to be lithium-ion customization and BESS, not sodium-ion. In other words, the advanced programs are positive proof of R&D ambition, but they should not yet be mistaken for the current profit engine. Their near-term value is strategic signaling, learning, and option creation rather than broad revenue contribution. They also show management’s willingness to keep multiple technical pathways alive while the main platform matures, which can be powerful if sequencing stays disciplined.
  claimRefs:
  - CE010
  - CE011
  - CE012
  - CE013
