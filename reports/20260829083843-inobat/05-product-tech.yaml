- id: tech-verdict
  title: Technology moat and scalability verdict
  body: 'The product and technology verdict is constructive but bounded. InoBat looks technically real: it has a pilot line, project deployments, partner validation, and a product architecture that can address cells and storage. The biggest edge appears to be the blend of application-specific battery engineering and systems integration. The biggest limitation is assessability at scale. Publicly retained evidence does not establish a strong externally auditable IP moat, and it does not prove that the current architecture scales economically to gigafactory volumes. That means investors should treat InoBat as a technically serious challenger with real hardware competence, but not as a fully de-risked manufacturing platform yet. Future diligence should focus less on concept novelty and more on repeatability, yields, qualification wins, and compliance execution. Technical credibility is already meaningful; scalable industrial credibility is still forming. The next proof points must come from
    disciplined manufacturing learning rather than from another incremental partnership announcement or branding exercise in public markets externally.'
  claimRefs:
