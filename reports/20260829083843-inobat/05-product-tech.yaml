chapter:
  number: 5
  title: Product & Technology
  summary: InoBat’s product story is more credible than a typical pre-revenue battery narrative because the company has a real pilot line, an operating BESS business, and repeated claims around application-specific cell design. The strongest evidence supports a modular technology stack spanning customized lithium-ion cells, BESSMONT storage systems, and adjacent R&D in sodium-ion and drone batteries. The main limitation is that public evidence still proves engineering capability more clearly than high-volume manufacturing economics.
sections:
- id: stack
  title: What InoBat actually sells
  body: 'InoBat should not be analyzed as only a cell startup. The retained sources show a multi-layer product stack: customized lithium-ion cells, pack and module development, and the BESSMONT energy-storage platform. That matters because it changes both the addressable market and the evidence base. A pure cell narrative would leave the company looking mostly pre-scale, but the storage-system activity—especially live BESS deployments—adds practical operating proof. The portfolio is coherent around the company’s positioning as a customer-specific battery partner, even if it also introduces more execution complexity than a single-product company would face. It also means product diligence should separate core commercial layers from option-like R&D programs rather than blending them into a single generic technology score. Investors should ask which layers are revenue-bearing today, which are qualification tools, and which mainly exist to strengthen the strategic narrative. That distinction
    matters because a technically broad product menu can look stronger on paper than it does in near-term monetization.'
  claimRefs:
  - CE001
  - CE007
  - CE008
  - CE009
  - CE017
  - CE032
  tableRefs:
  - TE001
  figureRefs:
  - FE001
- id: core-tech
  title: Core battery technology and pilot manufacturing
  body: The strongest hard-technology evidence sits in the Voderady facility and pilot-line disclosures. InoBat’s pages describe R&D, validation, and pilot manufacturing capabilities, while independent reporting says the line includes 35 machines and can produce roughly 50,000 cells annually. That is still small compared with gigafactory economics, but it is enough to support serious prototyping, qualification, and early-customer work. The company’s narrative about tailoring chemistry and format to the application is consistent across official and independent sources, and it is a more believable advantage in demanding niche programs than it would be in commodity automotive supply. Just as importantly, the pilot line gives the company a place to learn process discipline, yield management, and customer qualification before higher-volume commitments arrive. That learning loop may matter as much as the nominal output number because batteries fail commercially on process detail as often as on
    chemistry. It is early industrial proof, not merely laboratory proof.
  claimRefs:
  - CE002
  - CE003
  - CE004
  - CE005
  - CE006
  - CE018
  - CE019
  - CE020
  - CE030
  tableRefs:
