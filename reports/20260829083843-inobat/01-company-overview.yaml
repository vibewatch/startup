- id: funding-and-scale
  title: Funding history, scale-up path, and current listing status
  body: 'The strongest current financing fact is the July 2026 business-combination agreement with Cartesian Growth Corporation II. Between the official press release, the SEC filing, and legal-adviser coverage, the public record is consistent on three key points: a $1.265 billion pre-money valuation, $77.5 million of committed PIPE capital, and no minimum cash condition. The 8-K adds useful structure by breaking the headline value into $575 million of upfront consideration plus as much as $690 million of earn-out consideration. In addition, Reuters-sourced December 2024 coverage reported a €100 million financing round led by Gotion, while Amara Raja’s own disclosure confirms an additional €20 million June 2024 investment that raised its stake to roughly 9.32 percent. Older sources also show Rio Tinto, CEZ, and IFC supporting the build-out. Public evidence therefore supports a credible funding history, but not a clean picture of total dilution, liquidation preferences, or current fully diluted
    ownership. Most importantly, the SPAC deal had not yet closed on the canonical run date, so InoBat remained a private company despite the planned Nasdaq route.'
