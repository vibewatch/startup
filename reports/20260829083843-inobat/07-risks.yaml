  - FR005
- id: regulatory
  title: Regulatory, legal, and geopolitical risks
  body: Battery regulation is no longer a peripheral issue. The EU framework reaches into traceability, sustainability, and lifecycle data, with battery-passport obligations hardening toward 2027. InoBat has visible awareness of that shift, which is positive, but readiness at operating scale is still unproven in public evidence. On the legal side, the de-SPAC introduces securities-process risk and future public-market scrutiny. Geopolitically, the company’s relationships with Gotion, Amara Raja, and Rio Tinto are strategic assets, yet they also create dependencies across jurisdictions and industrial-policy regimes. None of these risks is disqualifying on its own; together they raise complexity and execution burden. Compliance discipline could become a competitive advantage, but only if the company operationalizes it faster than peers. As scale rises, reporting, sourcing, and environmental obligations all harden simultaneously. That creates a burden of coordination, not just a burden of legal
    interpretation.
  claimRefs:
  - CR017
  - CR018
  - CR019
  - CR020
  - CR021
  - CR022
  - CR023
  - CR024
  - CR025
  - CR030
