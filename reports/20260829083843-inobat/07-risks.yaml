company:
  name: InoBat
chapter:
  number: 7
  title: Risks
  summary: InoBat faces a stacked risk profile typical of capital-intensive battery manufacturing but amplified by its transition into a de-SPAC, its need to scale from pilot output to gigafactory economics, and its exposure to evolving European battery regulation. The three highest-confidence risks are execution risk in manufacturing scale-up, financing and dilution risk relative to capex needs, and commercial risk if customer design-ins do not convert before larger competitors or changing market conditions erode the niche.
sections:
- id: core
  title: Core industrial and financing risks
  body: The risk stack begins with industrial scaling and capital intensity. InoBat has enough public proof to be taken seriously as a real battery company, but not enough public proof to assume it can jump smoothly from pilot output to gigafactory economics. The Slovak government’s own €1.2 billion framing of the Šurany project highlights how large the exposure is relative to disclosed funding. The SPAC transaction helps, yet much of the headline value is contingent, and the no-minimum-cash structure leaves open a scenario where closing certainty improves while funding sufficiency does not. These are classic battery-company risks, but the Northvolt precedent makes them harder to dismiss as theoretical. The central question is whether the company can synchronize capital inflows, plant milestones, and customer trust quickly enough to avoid a financing-execution gap. Even with partner support, too many dependencies still need to land in sequence. That sequencing problem is the reason this
    chapter treats funding and execution as coupled rather than separate risks.
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
  - CR006
  - CR007
  - CR008
  tableRefs:
  - TR001
  - TR002
  figureRefs:
  - FR001
  - FR002
- id: commercial
  title: Commercial, market, and competition risks
  body: Commercial risk is less about whether InoBat has any traction and more about whether traction converts in time. The customer set is credible, but much of it sits in long-cycle sectors such as aviation, buses, and storage projects. Multi-sourcing and delayed qualification reduce exclusivity and can push revenue recognition further out. At the same time, the European battery and storage markets are attracting many participants. Fast storage-market growth helps demand, yet planned battery capacity remains large enough to create future price and utilization pressure. A smaller differentiated challenger can survive that environment, but only if its niches stay valuable and its timing is disciplined. In practice, that means management must convert reference accounts into repeatable economics before bigger rivals close the gap. If storage procurement shifts toward lowest-cost suppliers, differentiation may protect less than hoped. The market can stay attractive overall while still becoming
    harsher for weaker subscale entrants.
  claimRefs:
  - CR010
  - CR011
  - CR012
  - CR013
  - CR014
  - CR015
  - CR016
  - CR033
  - CR034
  tableRefs:
