      - number: '2.2'
        title: 'Sizing lenses: BESS growth versus European cell-capacity reality'
        blocks:
          - type: paragraph
            body: >-
              European demand indicators are strongest in BESS. ees Europe reports that 2025 installations reached 36
              GWh, with utility-scale alone at 19 GWh and cumulative storage capacity above 100 GWh. Its medium scenario
              points to more than 50 GWh of annual installations in 2026 and almost 140 GWh by 2030, with cumulative
              capacity above 580 GWh. By contrast, the supply-side narrative in EV battery cells is more conflicted.
              Battery Atlas coverage and RWTH Aachen materials show that the market has pulled back from exuberant 2023
              announcements. More than 2,000 GWh of announced capacity has been revised down to a realistic early-2026
              range of roughly 1,000 to 1,190 GWh depending on source and treatment of unconfirmed projects. That gap is
              central for InoBat: the TAM is large, but the path from announcement to economic production is uncertain,
              and the effective addressable opportunity depends on execution, localization, and who can reach bankable
              manufacturing first.
