      - number: '2.3'
        title: Buyer segmentation, budget ownership, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The buyer map differs by segment. In utility and industrial storage, the budget owner is often the plant
              owner, utility, project developer, or energy-management team buying resilience, peak-shaving, and
              flexibility. In customized mobility cells, the buyer is typically the OEM engineering and procurement
              organization, while the user is the vehicle or aircraft operator and the payer may be program finance,
              platform procurement, or a strategic development budget. That difference explains why InoBat’s adoption
              path is long. Battery customers do not buy on a simple catalog basis: they move through chemistry
              selection, prototype and pack validation, safety certification, commissioning, and then long-term service.
              The OFZ project shows the stationary side of that motion, while InoBat’s aviation and specialist-vehicle
              messaging shows the longer validation-heavy path on cells. For diligence, that means topline market growth
              alone is not enough; the decisive question is where InoBat can move from prototype or pilot to recurring
              purchase and serial deployment fastest.
