  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Core industrial and financing risks
        blocks:
          - type: paragraph
            body: >-
              The risk stack begins with industrial scaling and capital intensity. InoBat has enough public proof to be
              taken seriously as a real battery company, but not enough public proof to assume it can jump smoothly from
              pilot output to gigafactory economics. The Slovak government’s own €1.2 billion framing of the Šurany
              project highlights how large the exposure is relative to disclosed funding. The SPAC transaction helps,
              yet much of the headline value is contingent, and the no-minimum-cash structure leaves open a scenario
              where closing certainty improves while funding sufficiency does not. These are classic battery-company
              risks, but the Northvolt precedent makes them harder to dismiss as theoretical. The central question is
              whether the company can synchronize capital inflows, plant milestones, and customer trust quickly enough
              to avoid a financing-execution gap. Even with partner support, too many dependencies still need to land in
              sequence. That sequencing problem is the reason this chapter treats funding and execution as coupled
              rather than separate risks.
