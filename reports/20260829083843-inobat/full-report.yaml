        title: What InoBat actually sells
        blocks:
          - type: paragraph
            body: >-
              InoBat should not be analyzed as only a cell startup. The retained sources show a multi-layer product
              stack: customized lithium-ion cells, pack and module development, and the BESSMONT energy-storage
              platform. That matters because it changes both the addressable market and the evidence base. A pure cell
              narrative would leave the company looking mostly pre-scale, but the storage-system activity—especially
              live BESS deployments—adds practical operating proof. The portfolio is coherent around the company’s
              positioning as a customer-specific battery partner, even if it also introduces more execution complexity
              than a single-product company would face. It also means product diligence should separate core commercial
              layers from option-like R&D programs rather than blending them into a single generic technology score.
              Investors should ask which layers are revenue-bearing today, which are qualification tools, and which
              mainly exist to strengthen the strategic narrative. That distinction matters because a technically broad
              product menu can look stronger on paper than it does in near-term monetization.
