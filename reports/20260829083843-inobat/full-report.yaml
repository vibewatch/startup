  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and spend pools
        blocks:
          - type: paragraph
            body: >-
              InoBat should not be analyzed against a single monolithic “battery market” number. Retained sources show
              three different but linked opportunity pools: utility-scale and industrial BESS, customized battery cells
              for automotive and commercial-vehicle programs, and specialized cells for aviation or UAV applications.
              The broadest European battery TAM figures therefore overstate what InoBat can realistically win in the
              next few years. In practice, the company’s nearest commercial proof sits in stationary storage, where its
              BESSMONT assembly capability and the OFZ steel-plant project map to industrial energy-management budgets.
              Its second pool is specialist mobility, where custom format, energy density, fast charging, or cycle-life
              characteristics matter more than lowest-cost commodity supply. What appears less supported is direct
              exposure to commoditized residential batteries or immediate mass-market automotive supply at CATL-like
              scale. The market definition that best fits the evidence is a hybrid battery platform with strongest
              near-term relevance in localized BESS and specialized battery programs, not a pure-play European EV-cell
              giant already competing across the full passenger-car spectrum.
