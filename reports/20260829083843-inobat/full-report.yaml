      - number: '7.4'
        title: Mitigants, scenarios, and overall verdict
        blocks:
          - type: paragraph
            body: >-
              The mitigation case is not empty. InoBat has strategic investors, a real pilot base, visible BESS
              execution, and policy support. But mitigants do not erase the stacked nature of the risk profile. The most
              constructive base case is a staged one: grow BESS and specialty programs, build regulatory credibility,
              and expand manufacturing more cautiously than failed peers did. The most credible downside case is that
              the public-market step happens before operating proof is strong enough, leaving the company exposed to
              financing gaps and trust erosion. That is why the overall risk rating remains high even though the company
              is not merely conceptual. Investors should watch sequencing quality more than narrative quality. A good
              outcome depends on scope discipline, financing flexibility, and orderly milestone delivery. Put simply,
              the company needs fewer surprises than the average venture-backed hardware story, especially across
              funding, compliance, and execution handoffs, over the next two years overall today.
