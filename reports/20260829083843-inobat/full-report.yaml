        title: Qualification cycles, stickiness, and concentration risk
        blocks:
          - type: paragraph
            body: >-
              InoBat’s named sectors—aviation, buses, performance electrification, and grid storage—imply long
              qualification cycles. That creates a paradox in customer diligence: announcements are meaningful because
              qualification is hard, yet they do not automatically prove recurring revenue. Lilium’s multiple-sourcing
              language underscores that even strong validation may not produce exclusivity. Public sources also do not
              disclose customer count, backlog, or renewal behavior, so concentration risk remains hard to quantify and
              probably material. The existing logos are useful references, but investors still need to know whether
              those references are converting into repeat orders. In practice, the gap between a good reference account
              and a durable revenue account is exactly where many industrial startups stall. Progress here will be
              measured by renewals, follow-on phases, and sharper backlog visibility. That is the real commercial
              conversion test in practice.
