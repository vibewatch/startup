  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape by category
        blocks:
          - type: paragraph
            body: >-
              The relevant competitive field is broader than a few European battery startups. InoBat competes against
              direct European cell manufacturers such as Verkor and ACC, against large Asian-linked suppliers entering
              Europe such as CATL and EVE, and against substitute solution providers in storage and specialty vehicles.
              That matters because different customers care about different moats. A utility-scale BESS customer values
              integration, commissioning, and aftersales; an aviation or specialist OEM values performance and
              qualification support; a high-volume automotive buyer cares more about cost, reliability, and
              balance-sheet strength. InoBat therefore cannot win by presenting itself as a generic battery supplier.
              Its real competition changes by segment, with the harshest scale competition sitting in commodity cells
              and the more defensible niche competition sitting in customer-specific programs and localized project
              delivery.
            claimRefs:
