              with engineering validation long before recurring revenue scales. InoBat therefore deserves credit for
              accumulating visible logos, but the commercial weight of each relationship varies materially. Some
              counterparties are true end customers, some are downstream integrators, and some are channels or ecosystem
              validators, so the logo wall should be read with role sensitivity rather than headline count simplicity.
              That nuance is important for diligence because reference quality and revenue quality are not identical. It
              also means the best public customer evidence is qualitative before it becomes quantitatively
