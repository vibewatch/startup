        title: Funding history and strategic capitalization
        blocks:
          - type: paragraph
            body: >-
              The retained sources show a clear pattern: InoBat has financed itself through strategic capital rather
              than through transparent public operating results. Publicly named backers include Amara Raja, Gotion, Rio
              Tinto, CEZ Group, Slovak Investment Holding, and advisory support from IFC. The 2024 capital raise is
              commonly cited at €100 million, with Amara Raja alone contributing an additional €20 million and
              disclosing a roughly 9.32% stake. Earlier financing also included CEZ’s €10 million loan with a possible
              conversion feature. This mix matters because it indicates continued investor interest from industrial and
              policy-linked counterparties, but it also shows that the company’s funding base is designed around project
              build-out and strategic optionality rather than around disclosed cash generation. Put differently, the
              funding history looks strategically rich but financially opaque, which is precisely why the eventual
              public filings matter so much. It is a supportive capital narrative, not yet a fully legible financial
              one.
