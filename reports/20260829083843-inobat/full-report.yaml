            body: >-
              The strongest commercial proof comes from BESS. OFZ is a live deployment with concrete size, and the SPAC
              announcement claims over 875 MWh of contracted and delivered BESS projects. That is a more tangible
              operating marker than the public evidence available for serial custom-cell revenues. It suggests
              management may be using storage as a pragmatic route to monetize integration capability while cell
              manufacturing continues to scale. Storage customers can still be project-based and lumpy, but the
              commercial evidence here is materially stronger than a pure future-cell narrative. That does not make
              storage risk free, yet it does imply a shorter path from engineering effort to visible customer proof than
              aviation or custom-cell serial supply currently offer. Investors should therefore treat storage as the
