            body: >-
              The existing operating base is real. InoBat has built an R&D center, commissioned its Slovak pilot line,
              announced first locally produced cells, and is now delivering BESS projects such as the OFZ system. These
              are important proof points because they imply actual engineering, equipment, and deployment work rather
              than a purely conceptual company. At the same time, the public evidence on cash burn remains thin. None of
              the retained sources discloses revenue, gross margin, EBITDA, or cash balance. The Slovak ministry’s own
              framing of Šurany as a roughly €1.2 billion project highlights the mismatch between disclosed capital and
              ultimate capex needs. On balance, the evidence supports the view that InoBat has meaningful assets but
