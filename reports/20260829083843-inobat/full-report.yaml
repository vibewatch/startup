      - number: '2.4'
        title: Growth drivers, constraints, and final market read
        blocks:
          - type: paragraph
            body: >-
              Three structural drivers favor InoBat: European grid-flexibility demand, industrial policy that rewards
              localization, and battery-traceability rules that can advantage regionally integrated suppliers. But the
              constraints are just as clear. ees Europe explicitly flags grid bottlenecks, permitting delays, regulatory
              uncertainty, and limited revenue visibility as storage constraints, while Battery Atlas coverage shows the
              European cell market is consolidating after over-optimistic announcements. Asian-led capacity also implies
              strong pricing pressure in standardized products. Northvolt’s bankruptcy sharpens the lesson: large macro
              demand does not guarantee that heavily capitalized European battery startups can scale economically. The
              practical implication is that InoBat’s best market wedge is not “all of Europe’s battery demand,” but
              targeted programs where customization, localization, or integrated project delivery matter enough to
              offset its scale disadvantage. That is still a large opportunity, but it is narrower and more
              execution-sensitive than headline battery TAM figures suggest.
