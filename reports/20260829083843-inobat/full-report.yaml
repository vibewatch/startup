            body: >-
              The strongest hard-technology evidence sits in the Voderady facility and pilot-line disclosures. InoBat’s
              pages describe R&D, validation, and pilot manufacturing capabilities, while independent reporting says the
              line includes 35 machines and can produce roughly 50,000 cells annually. That is still small compared with
              gigafactory economics, but it is enough to support serious prototyping, qualification, and early-customer
              work. The company’s narrative about tailoring chemistry and format to the application is consistent across
              official and independent sources, and it is a more believable advantage in demanding niche programs than
              it would be in commodity automotive supply. Just as importantly, the pilot line gives the company a place
              to learn process discipline, yield management, and customer qualification before higher-volume commitments
              arrive. That learning loop may matter as much as the nominal output number because batteries fail
              commercially on process detail as often as on chemistry. It is early industrial proof, not merely
