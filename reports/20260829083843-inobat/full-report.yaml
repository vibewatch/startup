      - number: '1.4'
        title: Milestones, state support, and the remaining disclosure gaps
        blocks:
          - type: paragraph
            body: >-
              Operational milestones are real, but disclosure remains partial. InoBat and Slovak government sources
              support a concrete Voderady pilot line and a state-backed Šurany gigafactory plan, while independent
              reporting confirms the 50,000-cell pilot line, 35-machine setup, and the 20 GWh first-phase ambition at
              Šurany. The government case is strong enough to say the project has real political sponsorship: official
              sources describe a 65-hectare site, land and grid preparation, and large strategic-investment support. Yet
              the gaps are equally important. No retained public source verifies 2026 revenue, margin, headcount, or
              customer count, and the SEC filing explicitly signals that the fuller Form F-4 or proxy statement still
              lay ahead. That means the core chapter-one judgment is not “story only,” but rather “evidence of product,
              pilot manufacturing, and financing access with incomplete underwriting data.” Investors can reasonably
              treat InoBat as a late-stage private battery platform with real industrial momentum, but not as a fully
              transparent public-equity case yet.
