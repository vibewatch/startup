      - number: '1.2'
        title: Leadership and governance visibility
        blocks:
          - type: paragraph
            body: >-
              Leadership disclosure is decent for a private industrial startup but still concentrated. Marian Bocek is
              clearly the central public operator: co-founder, chief executive, and the voice attached to both product
              and financing narratives. Official team pages also identify Andy Palmer as chairman of the board, Vazil
              Hudak as co-founder and board member, and Steven Cai as a board member tied to Gotion’s battery expertise.
              That mix gives InoBat visible automotive and policy depth, especially because Palmer brings OEM and Aston
              Martin experience, Hudak brings Slovak and EIB policy relationships, and Cai brings scaled battery
              manufacturing experience from Gotion and CATL. Even so, the public governance picture remains incomplete.
              Retained sources do not provide a full board-seat map, voting-control structure, or preference stack. That
              is meaningful because the company’s financing history includes strategic investors from China, India,
              mining, sovereign capital, and development finance, but public materials do not show how decision rights
              are split among them. The resulting governance read is positive on strategic access, but still high on
              founder and core-board concentration.
