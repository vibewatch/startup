      - number: '1.1'
        title: Identity, product scope, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              InoBat’s retained 2026 materials show a company that now spans more than a classic pre-revenue battery-lab
              narrative. The official site and July 2026 SPAC announcement present InoBat as both a battery energy
              storage systems manufacturer and a battery cell development platform based in Slovakia. The practical
              operating footprint is more specific than the broader “headquartered in Slovakia” language: the official
              contact and facility pages identify Voderady as the headquarters, R&D, and production centre. That site
              now houses research laboratories, pilot cell production, and a dedicated BESS assembly line under the
              BESSMONT brand. The product story also widened materially. InoBat still emphasizes customized,
              mission-specific battery cells for automotive, aviation, and specialist applications, but in 2026 it also
              describes itself as already serving industrial and utility customers through utility-scale BESS
              deployments. That combination matters for diligence because it suggests InoBat is trying to de-risk
              commercialization through nearer-term system-integration revenue while preserving the higher-upside
              narrative around differentiated cells and large-scale manufacturing.
