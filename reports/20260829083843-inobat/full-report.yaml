      - number: '4.2'
        title: De-SPAC economics and what the headline value really means
        blocks:
          - type: paragraph
            body: >-
              The July 2026 business-combination terms are economically significant but easy to misread. The headline
              pre-money valuation is $1.265 billion, yet the filing and announcement separate that valuation from actual
              funded proceeds. Upfront consideration is $575 million, while up to $690 million more is contingent
              earnout value. The transaction also includes a $77.5 million PIPE and no minimum cash condition. Those
              features make the deal more executable than a structure that depends on a large minimum trust-cash
              threshold, but they do not mean InoBat will emerge fully financed for gigafactory ambitions. In practical
              terms, the company is buying a public-market vehicle and valuation reference point, not solving long-term
              capital intensity in one step. Investors still need to know the eventual net cash, fee drag, and pro forma
              dilution to judge how helpful the listing event really is. The deal is financially useful, but not
              self-sufficient.
