            body: >-
              Commercial risk is less about whether InoBat has any traction and more about whether traction converts in
              time. The customer set is credible, but much of it sits in long-cycle sectors such as aviation, buses, and
              storage projects. Multi-sourcing and delayed qualification reduce exclusivity and can push revenue
              recognition further out. At the same time, the European battery and storage markets are attracting many
              participants. Fast storage-market growth helps demand, yet planned battery capacity remains large enough
              to create future price and utilization pressure. A smaller differentiated challenger can survive that
              environment, but only if its niches stay valuable and its timing is disciplined. In practice, that means
              management must convert reference accounts into repeatable economics before bigger rivals close the gap.
              If storage procurement shifts toward lowest-cost suppliers, differentiation may protect less than hoped.
              The market can stay attractive overall while still becoming harsher for weaker subscale entrants.
