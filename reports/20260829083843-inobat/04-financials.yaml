- id: financial-verdict
  title: Financial risk verdict
  body: 'The Northvolt precedent is the most relevant adverse financial comparator because it reminds investors that battery manufacturing can consume enormous amounts of capital long before sustainable cash generation appears. InoBat does have positives Northvolt lacked in some moments: a more explicit storage narrative, a smaller niche-oriented starting point, and evidence of strategic support from multiple industrial backers and the Slovak state. Even so, the financial verdict remains cautious. The company’s capital stack is strategically interesting, but operating disclosure is still insufficient, runway is unknowable from retained public evidence, and future funding needs are almost certainly substantial. Investors should therefore treat the 2026 SPAC as a financing milestone and disclosure inflection point, not as proof that the financial model is already de-risked. A sensible underwriting stance is to demand more evidence on cash generation before giving full credit to the public-market
    headline. In particular, investors should separate headline transaction optics from the slower reality of manufacturing returns and plant-level margin formation over time.'
