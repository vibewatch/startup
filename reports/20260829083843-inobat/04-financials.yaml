company:
  name: InoBat
chapter:
  number: 4
  title: Financials
  summary: 'Public financial disclosure on InoBat is still sparse because the company remains private until the SPAC closes, but the available evidence shows a capital-intensive business funding a pilot line, BESS deployments, and a planned multibillion-euro gigafactory. The July 2026 transaction terms are notable: a $1.265 billion pre-money valuation, $575 million upfront consideration plus up to $690 million earnout value, a $77.5 million PIPE, and no minimum cash condition—terms that improve deal certainty but also imply substantial execution and future-financing risk.'
sections:
- id: capital-history
  title: Funding history and strategic capitalization
  body: 'The retained sources show a clear pattern: InoBat has financed itself through strategic capital rather than through transparent public operating results. Publicly named backers include Amara Raja, Gotion, Rio Tinto, CEZ Group, Slovak Investment Holding, and advisory support from IFC. The 2024 capital raise is commonly cited at €100 million, with Amara Raja alone contributing an additional €20 million and disclosing a roughly 9.32% stake. Earlier financing also included CEZ’s €10 million loan with a possible conversion feature. This mix matters because it indicates continued investor interest from industrial and policy-linked counterparties, but it also shows that the company’s funding base is designed around project build-out and strategic optionality rather than around disclosed cash generation. Put differently, the funding history looks strategically rich but financially opaque, which is precisely why the eventual public filings matter so much. It is a supportive capital narrative,
    not yet a fully legible financial one.'
