chapter:
  number: 6
  title: Customers & Commercial Traction
  summary: 'InoBat has more public customer and partner proof than many battery startups at a similar scale, especially in commercial vehicles, aviation, motorsport-adjacent electrification, and BESS. The strongest evidence supports a pipeline of design-ins, development agreements, and project deployments rather than a disclosed base of high-volume recurring customers. Commercial traction is therefore real but still transitional: the company has references and use cases, yet public sources do not establish a broad, recurring, high-volume revenue base.'
sections:
- id: segments
  title: Customer segments and named proof points
  body: The customer story is more diversified than a simple EV-cell narrative suggests. Retained sources support customer or customer-like proof in commercial vehicles, aviation, BESS, and specialist electrification. SOR, OFZ, Lilium, Impact, Cosworth, and Pod Point give the company recognizable logos and use cases rather than anonymous proofs of concept. This matters because customer traction in battery markets often starts with engineering validation long before recurring revenue scales. InoBat therefore deserves credit for accumulating visible logos, but the commercial weight of each relationship varies materially. Some counterparties are true end customers, some are downstream integrators, and some are channels or ecosystem validators, so the logo wall should be read with role sensitivity rather than headline count simplicity. That nuance is important for diligence because reference quality and revenue quality are not identical. It also means the best public customer evidence is qualitative
    before it becomes quantitatively underwritable. The mix is encouraging, but still pre-maturity and still conversion dependent overall.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU006
  - CU008
  - CU009
  - CU010
  - CU011
  tableRefs:
