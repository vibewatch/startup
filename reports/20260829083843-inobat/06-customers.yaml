- id: commercial-verdict
  title: Commercial traction verdict
  body: The best interpretation of the evidence is that InoBat has real commercial traction, but it is still early-stage traction. The company has logos, projects, and industrial partners across several geographies, which is better than many battery startups can show. Yet the public record remains thin on recurring revenue, contract value, customer concentration, and expansion economics. In practice, that means the company’s commercial quality is stronger than its disclosure quality. Investors can take the references seriously, especially in storage and specialist programs, while still recognizing that the visible proof supports a validated pipeline narrative more than a fully scaled customer engine. The next commercial milestone should therefore be less about adding logos and more about showing repeat orders, backlog quality, and segment-level revenue durability. Until then, customer quality is promising but still only partially monetized in public view. The current evidence is enough to
    track closely, not enough to declare broad commercial maturity or broad-based repeatable scale across segments yet in public data alone presently.
