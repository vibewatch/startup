- id: storage-vs-cells
  title: Why storage looks like the most tangible near-term wedge
  body: The strongest commercial proof comes from BESS. OFZ is a live deployment with concrete size, and the SPAC announcement claims over 875 MWh of contracted and delivered BESS projects. That is a more tangible operating marker than the public evidence available for serial custom-cell revenues. It suggests management may be using storage as a pragmatic route to monetize integration capability while cell manufacturing continues to scale. Storage customers can still be project-based and lumpy, but the commercial evidence here is materially stronger than a pure future-cell narrative. That does not make storage risk free, yet it does imply a shorter path from engineering effort to visible customer proof than aviation or custom-cell serial supply currently offer. Investors should therefore treat storage as the company’s best current commercialization lens. It is the clearest bridge between technical competence and commercially observable delivery today, especially before full-scale cell output
    exists.
  claimRefs:
  - CU003
  - CU004
  - CU005
  - CU018
  - CU019
  - CU029
  tableRefs:
  - TU003
  - TU004
  figureRefs:
  - FU004
- id: qualification
  title: Qualification cycles, stickiness, and concentration risk
  body: 'InoBat’s named sectors—aviation, buses, performance electrification, and grid storage—imply long qualification cycles. That creates a paradox in customer diligence: announcements are meaningful because qualification is hard, yet they do not automatically prove recurring revenue. Lilium’s multiple-sourcing language underscores that even strong validation may not produce exclusivity. Public sources also do not disclose customer count, backlog, or renewal behavior, so concentration risk remains hard to quantify and probably material. The existing logos are useful references, but investors still need to know whether those references are converting into repeat orders. In practice, the gap between a good reference account and a durable revenue account is exactly where many industrial startups stall. Progress here will be measured by renewals, follow-on phases, and sharper backlog visibility. That is the real commercial conversion test in practice.'
  claimRefs:
