company:
  name: InoBat
chapter:
  number: 8
  title: Valuation
  summary: The announced $1.265 billion pre-money valuation gives InoBat a large headline mark for a company that still has limited public revenue and profitability disclosure. The valuation is not obviously absurd if investors underwrite InoBat as a strategic European battery and storage platform with real pilot assets, BESS traction, and multiple industrial options. But it is stretched against the currently retained public evidence because most of the underwrite still rests on future scale-up, future storage growth, and future disclosure rather than on audited operating performance.
sections:
- id: headline
  title: What the announced valuation actually represents
  body: 'The $1.265 billion pre-money mark is the unavoidable starting point, but investors should read it as a transaction framing device rather than as a complete statement of immediately available value. The announcement and filing separate that headline from actual deal mechanics: $575 million upfront consideration, up to $690 million of contingent earnout, a $77.5 million PIPE, and no minimum cash condition. That architecture matters because the market can easily overread the optical valuation while underappreciating how much future performance, future financing, and future disclosure are still embedded in it. In other words, the headline number is best treated as a strategic ambition marker plus a negotiated market narrative, not as cash already secured for execution. The practical underwriting question is therefore less about sticker price and more about what resources and milestones actually sit behind the sticker. That distinction is essential when the operating base is still only
    partially disclosed.'
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  - CV021
  - CV033
  tableRefs:
  - TV001
  - TV002
  figureRefs:
