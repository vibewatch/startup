- id: scenarios
  title: Scenario framing and final stance
  body: 'The bull case is straightforward: storage demand keeps expanding, public-market access lowers financing friction, and InoBat turns a niche regional battery platform into a more scalable energy company. The base case is more restrained: credible traction continues, but the valuation remains dependent on future milestones and follow-on capital. The bear case is that deal proceeds disappoint or execution slips, causing a sharp public-market re-rating before industrial economics are proven. From the retained evidence, the base case deserves the most weight. That leads to a final stance of stretched rather than obviously broken: there is real option value here, but not enough disclosed operating evidence yet to call the stock cheap at announcement terms. Until audited operating proof arrives, scenario discipline matters more than point-estimate precision. Investors should frame the current mark as conditional, not self-validating. The next disclosed facts could move perceived fair value
    materially in either direction. For now, humility around valuation precision is part of good diligence and sensible underwriting discipline for investors today overall always.'
