- id: discounts
  title: Why the current public evidence still implies a stretched multiple
  body: The strongest reason to resist the headline mark is the lack of operating anchors. Retained public sources do not disclose revenue, margin, EBITDA, cash balance, or backlog in enough detail to support a standard DCF or even a reliable revenue-multiple cross-check. At the same time, capex intensity remains very high, the scale gap versus better-funded peers remains large, and Northvolt’s failure argues for tougher haircuts across the category. In other words, investors can see real upside optionality without yet seeing the numbers that would normally justify a billion-dollar price with confidence. The market may reward the story for a time, but absent stronger disclosure the valuation still rests on assumptions that cannot be audited externally today. That combination usually deserves a larger discount than early investors hope for at announcement time. It also means public investors may react sharply to even small negative surprises.
  claimRefs:
  - CV009
  - CV010
  - CV011
  - CV012
  - CV014
