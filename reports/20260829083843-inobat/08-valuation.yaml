  - FV002
- id: support
  title: Why a premium valuation is not irrational
  body: 'The valuation is not baseless. InoBat has a real pilot asset base, live BESS proof, strategic-partner quality, and exposure to fast-growing storage demand. It also has a positioning angle that is somewhat distinct from generic battery startups: a mix of customized cells, BESS integration, and CEE localization. These attributes can support a premium relative to companies that are purely conceptual or dependent on a single long-dated automotive thesis. A public listing could also add financing flexibility if the company can convert it into disciplined execution. The best support case is therefore strategic rather than purely financial: investors are buying scarce optionality inside a European battery and storage build-out story. That support is strongest when one assumes management can keep turning technical and policy advantages into investable milestones. It is a possibility premium, not yet a fully earnings-backed premium.'
  claimRefs:
  - CV005
  - CV006
  - CV007
  - CV008
  - CV015
