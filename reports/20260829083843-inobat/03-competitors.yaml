- id: peer-scale
  title: Peer scale and manufacturing readiness
  body: 'On disclosed scale, InoBat trails the best-funded peers materially. Verkor publicly cites 16 GWh of initial capacity and 50 GWh ambitions by 2030, along with multi-billion-euro financing. ACC says it already employs more than 2,500 people and has been ramping French gigafactory production since late 2024. EVE Power Hungary advertises a €1 billion, 28 GWh facility, while CATL’s historic Fisker agreement alone referenced more than 5 GWh of annual capacity for one OEM relationship. Against that backdrop, InoBat’s public proof remains far smaller: a 50,000-cell pilot line, a planned 20 GWh first-stage Šurany project, and named BESS or customer programs. That does not invalidate InoBat’s opportunity, but it means the company is competing from a challenger position where partner access, execution sequencing, and niche focus matter more than brute-force scale. In financing terms, this also means investors are underwriting catch-up rather than leadership at present globally.'
