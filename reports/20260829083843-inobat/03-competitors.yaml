chapter:
  number: 3
  title: Competitors
  summary: 'InoBat competes in a layered field: European gigafactory builders such as Verkor and ACC, larger Asian-linked capacity in Europe, and adjacent players that can supply storage or specialist cells at greater scale. InoBat’s defensible angle is customization plus localized CEE delivery, but the company remains much smaller than the best-funded European and Asian-backed competitors and must avoid head-on competition in commodity cells.'
sections:
- id: landscape
  title: Competitive landscape by category
  body: The relevant competitive field is broader than a few European battery startups. InoBat competes against direct European cell manufacturers such as Verkor and ACC, against large Asian-linked suppliers entering Europe such as CATL and EVE, and against substitute solution providers in storage and specialty vehicles. That matters because different customers care about different moats. A utility-scale BESS customer values integration, commissioning, and aftersales; an aviation or specialist OEM values performance and qualification support; a high-volume automotive buyer cares more about cost, reliability, and balance-sheet strength. InoBat therefore cannot win by presenting itself as a generic battery supplier. Its real competition changes by segment, with the harshest scale competition sitting in commodity cells and the more defensible niche competition sitting in customer-specific programs and localized project delivery.
