- id: differentiation
  title: Differentiation, switching costs, and niche durability
  body: InoBat’s strongest differentiation claim is customization. The company repeatedly argues that it can adapt chemistry and format to the exact mission profile of the customer, and that argument is more credible in aviation, motorsport, UAV, and specialist commercial-vehicle use cases than in mass-market passenger cars. Named relationships with SOR and Lilium reinforce that niche story. Even so, customized battery supply is not a frictionless moat. Lilium openly describes a multiple-sourcing strategy, which is a reminder that qualification does not guarantee exclusivity and that sophisticated buyers try to avoid single-source dependence. Switching costs rise only after design-in, safety validation, and production integration are complete. Before serial production begins, programs can still move. The durability of InoBat’s niche therefore depends on whether it can translate prototype and pilot wins into reliable volume supply before larger rivals offer good-enough customized options
    at lower cost.
  claimRefs:
