      - number: '1.2'
        title: 领导层与治理透明度
        blocks:
          - type: paragraph
            body: >-
              作为一家私营工业初创公司，InoBat 的领导层披露算不错，但权力仍集中。Marian Bocek 显然是公开叙事中的核心操盘手：联合创始人、CEO，也是产品和融资故事的主要发声人。官方团队页面还列出 Andy
              Palmer 为董事会主席、Vazil Hudak 为联合创始人和董事会成员，Steven Cai 为与 Gotion 电池专长相关的董事会成员。这个组合让 InoBat 在汽车和政策层面有可见厚度：Palmer
              带来 OEM 和 Aston Martin 经验，Hudak 带来斯洛伐克和 EIB 政策关系，Cai 带来来自 Gotion 和 CATL
              的规模化电池制造经验。即便如此，公开治理图谱仍不完整。留存资料没有给出完整董事席位图、投票控制结构或优先股堆叠。该缺口重要，因为公司的融资历史涵盖来自中国、印度、矿业、主权资本和开发性金融的战略投资者，但公开材料没有说明决策权如何在各方之间分配。因此，治理判断是：战略通道加分，但创始人和核心董事会集中度仍高。
