  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 按类别划分的竞争格局
        blocks:
          - type: paragraph
            body: >-
              InoBat 面对的竞争场，比几个欧洲电池初创公司更宽。它既要与 Verkor、ACC 等欧洲电芯制造商竞争，也要与 CATL、EVE
              等进入欧洲的亚洲背景供应商竞争，还要面对储能和专用车辆里的替代方案提供商。关键在于，不同客户看重不同护城河。公用事业级 BESS 客户看重集成、调试和售后；航空或专业 OEM
              看重性能和认证支持；大批量汽车买家更在意成本、可靠性和资产负债表实力。因此，InoBat
              不能靠把自己包装成通用电池供应商取胜。它真正的竞争对手随细分市场而变：商品化电芯里的规模竞争最残酷，客户定制项目和本地化项目交付里的小众竞争更可防守。
