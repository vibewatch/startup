      - number: '2.2'
        title: 规模视角：BESS 增长与欧洲电芯产能现实
        blocks:
          - type: paragraph
            body: >-
              欧洲需求指标里，BESS 最强。ees Europe 报告称，2025 年装机达到 36 GWh，其中公用事业级单独达到 19 GWh，累计储能容量超过 100 GWh。其中性情景指向 2026 年年装机超过
              50 GWh，到 2030 年接近 140 GWh，累计容量超过 580 GWh。相比之下，EV 电芯供给侧叙事更矛盾。Battery Atlas 报道和 RWTH Aachen 材料显示，市场已经从 2023
              年狂热公告中回落。超过 2,000 GWh 的已公告产能被下修到 2026 年初更现实的区间：约 1,000 GWh 至 1,190 GWh，具体取决于来源和未确认项目的处理方式。这个落差是 InoBat
              的核心问题：TAM 很大，但从公告走到有经济性的生产并不确定，真正可触达机会取决于执行、本地化，以及谁能先跑出可融资的制造能力。
