      - number: '3.3'
        title: 差异化、切换成本与小众耐久性
        blocks:
          - type: paragraph
            body: >-
              InoBat 最强的差异化主张是定制化。公司反复强调，自己能把化学体系和格式适配到客户的精确任务画像；这个论点在航空、赛车、UAV 和专业商用车场景中，比在大众乘用车的大宗供给中更可信。与 SOR、Lilium
              的具名关系强化了这个小众故事。即便如此，定制化电池供应不是没有摩擦的护城河。Lilium
              公开描述了多供应商策略，提醒投资者：通过认证不等于独占，成熟买家会尽量避免单一来源依赖。只有设计导入、安全验证和生产集成完成之后，切换成本才会上升。在系列化生产开始前，项目仍然可能转向。因此，InoBat
              小众市场的耐久性取决于它能否在大型对手以更低成本推出够用型定制选项之前，把原型和试点胜利转成可靠的规模供给。
