  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 核心工业与融资风险
        blocks:
          - type: paragraph
            body: >-
              风险堆栈从工业规模化和资本强度开始。InoBat 的公开证明足以让市场认真看待它是一家真实电池公司，但还不足以假设它能从试点产出顺畅跳到超级工厂经济性。斯洛伐克政府自己把 Šurany 项目表述为 €1.2
              billion，凸显了相对于已披露融资的巨大风险敞口。SPAC
              交易有帮助，但头部价值有相当一部分是附条件的；没有最低现金条件的结构，也留下了一种情景：交割确定性提高，但资金充足性并未同步提高。这些都是典型电池公司风险，但 Northvolt
              先例让它们更难被当作理论风险忽略。核心问题是，公司能否足够快地同步资本流入、工厂里程碑和客户信任，避免融资与执行之间出现缺口。即便有伙伴支持，仍有太多依赖项需要按顺序落地。这个顺序问题，正是本章把融资和执行视为耦合风险，而不是分开风险的原因。
