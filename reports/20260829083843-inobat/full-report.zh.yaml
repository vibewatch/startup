            body: >-
              抗拒头部估值最强的理由，是缺少经营锚点。留存公开资料没有足够披露收入、利润率、EBITDA、现金余额或积压订单，无法支撑标准
              DCF，甚至无法做可靠的收入倍数交叉检查。与此同时，资本开支强度仍然很高，与融资更充分同业之间的规模差距仍大，Northvolt
              失败也要求整个品类承受更严折价。换句话说，投资者能看到真实上行选择权，却还没有看到通常能让人有信心接受十亿美元价格的数字。市场可能会在一段时间内奖励这个故事，但如果没有更强披露，估值仍压在今天无法外部审计的假设上。这种组合通常应该获得比早期投资者在公告时希望更大的折价。它也意味着，即便出现小的负面意外，公开市场投资者也可能反应剧烈。
