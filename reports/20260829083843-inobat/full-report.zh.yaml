        title: InoBat 实际销售什么
        blocks:
          - type: paragraph
            body: >-
              不应只把 InoBat 当作电芯初创公司来分析。留存资料显示，它的产品栈分为多层：定制化锂离子电芯、电池包和模组开发，以及 BESSMONT
              储能平台。这一点重要，因为它同时改变了可触达市场和证据基础。如果只有纯电芯叙事，公司看起来大多仍处在规模化前；但储能系统业务，尤其是正在落地的 BESS
              部署，增加了实际运营证明。围绕“客户定制电池伙伴”的定位，产品组合是连贯的，尽管执行复杂度也高于单一产品公司。产品尽调也应把核心商业层与期权式 R&D
              项目分开，而不是混成一个泛化技术分数。投资者应追问：哪些层今天已经贡献收入，哪些是认证工具，哪些主要用于强化战略叙事。这个区分很重要，因为技术上很宽的产品菜单，在纸面上可能强于其近期变现能力。
