  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与支出池
        blocks:
          - type: paragraph
            body: >-
              不能拿一个单一的“大电池市场”数字来分析 InoBat。留存资料显示，它面对的是三个不同但相互连接的机会池：公用事业级和工业 BESS、面向汽车和商用车项目的定制化电芯，以及面向航空或 UAV
              应用的专用电芯。因此，最宽泛的欧洲电池总可用市场（TAM）数字会高估 InoBat 未来几年真正能拿到的份额。现实中，公司最近的商业化证明在固定式储能：其 BESSMONT 装配能力和 OFZ
              钢厂项目对应的是工业能源管理预算。第二个机会池是专用交通，定制格式、能量密度、快充或循环寿命比最低成本的大宗供给更重要。证据较弱的是商品化住宅电池，或以 CATL
              式规模直接进入大众乘用车供应。最贴合证据的市场定义是：一个近期最适配本地化 BESS 和专用电池项目的混合型电池平台，而不是已经横跨完整乘用车谱系竞争的欧洲纯 EV 电芯巨头。
