      - number: '3.4'
        title: 护城河耐久性与 Northvolt 教训
        blocks:
          - type: paragraph
            body: >-
              Northvolt 倒下，是欧洲电池领域最重要的反向竞争信号。它说明，如果制造爬坡、融资纪律和客户执行断裂，强融资、政治支持和可信宏观市场都不够。这抬高了所有剩余玩家的门槛，包括
              InoBat。中东欧区位和政府支持是真优势，但单靠这些不够，因为匈牙利和其他区域枢纽也在涌入更大项目。因此，InoBat
              今天的护城河更适合被描述为“有条件”，而不是“耐久”：取决于它能否在小众定制上保持领先，取决于它能否把 BESS
              和专用项目转成重复订单，也取决于它能否比失败同业更克制地分阶段建设超级工厂。竞争结论因此是建设性但谨慎：差异化挑战者，不是规模领导者。风险还可以换一种说法：InoBat
              必须在更大对手认为其小众市场足够重要、值得直接进攻之前赢下来；一旦规模玩家瞄准同一子领域，它们可以把更低成本、更强资产负债表支持和更密的 OEM 覆盖结合起来。这只时钟让早期执行尤其关键。
