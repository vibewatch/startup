            body: >-
              $1.265 billion 投前估值是无法绕开的起点，但投资者应把它视为交易定价框架，而不是对即时可用价值的完整陈述。公告和文件把这个头条与实际交易机制分开：$575 million 首期对价、最高 $690
              million 附条件业绩对赌、$77.5 million
              PIPE，以及没有最低现金条件。这套结构重要，因为市场很容易高估表观估值，却低估其中仍压着多少未来业绩、未来融资和未来披露。换句话说，头条数字最好被视为战略雄心标记加一套协商出来的市场叙事，而不是已经到位、可用于执行的现金。实际承销问题因此不是标价多高，而是标价背后到底有多少资源和里程碑。运营基础仍只披露了一部分时，这一区分至关重要。
