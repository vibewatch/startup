      - number: '8.4'
        title: 情景框架与最终立场
        blocks:
          - type: paragraph
            body: >-
              乐观情景很直白：储能需求持续扩张，公开市场通道降低融资摩擦，InoBat
              有机会把区域性细分电池平台做成更可扩展的能源公司。基准情景更克制：可信牵引仍在延续，但估值仍押在后续里程碑和跟进资本上。悲观情景是交易募资不及预期，或执行走偏，在工业经济性被验证前就触发公开市场大幅重估。留存证据看，基准情景权重最高。因此最终判断是估值偏高，而不是明显站不住脚：平台确有期权价值，但披露的经营证据还不足以说明公告条款下这只股票便宜。审计后的经营证据出来之前，情景纪律比单点估值精度更重要。投资者应把当前标记看成有条件的假设，而不是自我证明。下一批披露事实可能显著推高或压低市场眼中的公允价值。眼下，承认估值精度有限，本就是好尽调和审慎承销纪律的一部分。
