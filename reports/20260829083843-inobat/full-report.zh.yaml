              在某些阶段欠缺的正面因素：更明确的储能叙事、更小且面向小众的起点，以及来自多家工业支持方和斯洛伐克政府的战略支持证据。即便如此，财务结论仍需谨慎。公司的资本结构有战略吸引力，但运营披露仍不足，留存公开证据无法判断现金跑道，未来融资需求几乎肯定很大。因此，投资者应把
