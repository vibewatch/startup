              留存资料显示出一个清晰模式：InoBat 靠战略资本为自己融资，而不是靠透明的公开经营结果。公开具名支持者包括 Amara Raja、Gotion、Rio Tinto、CEZ Group、Slovak
              Investment Holding，以及 IFC 的顾问支持。2024 年融资通常被引用为 €100 million，Amara Raja 单独又投入 €20 million，并披露约 9.32%
              持股。更早融资还包括 CEZ 的 €10 million
              贷款及可能的转换条款。这个组合重要，因为它显示工业和政策关联方仍有投资兴趣；但也说明公司的资金底座围绕项目建设和战略选择权设计，而不是围绕已披露现金生成设计。换句话说，融资历史在战略上很丰富，财务上却不透明，这正是最终公开文件如此关键的原因。它是一条有支撑的资本叙事，还不是一份完全看得懂的财务叙事。
