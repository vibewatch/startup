        title: 监管、法律与地缘政治风险
        blocks:
          - type: paragraph
            body: >-
              电池监管已经不是边缘议题。欧盟框架伸入可追溯性、可持续性和生命周期数据，电池护照义务也将在 2027 年前后趋严。InoBat
              对这一变化有可见认知，这是正面因素，但公开证据尚未证明其在运营规模上的准备度。法律层面，SPAC 合并上市 带来证券流程风险和未来公开市场审视。地缘政治层面，公司与 Gotion、Amara Raja 和 Rio
              Tinto
              的关系是战略资产，也会带来跨司法辖区和产业政策制度的依赖。单看任何一项风险都不构成否决；合在一起，它们抬高了复杂度和执行负担。合规纪律可能变成竞争优势，但前提是公司比同业更快把它落到运营里。规模上升后，报告、采购和环境义务会同时变硬。这是协调负担，不只是法律解释负担。
