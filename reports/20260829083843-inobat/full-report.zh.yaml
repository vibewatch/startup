      - number: '1.3'
        title: 融资历史、规模化路径与当前上市状态
        blocks:
          - type: paragraph
            body: >-
              当前最硬的融资事实，是 2026 年 7 月与 Cartesian Growth Corporation II 签署的业务合并协议。官方新闻稿、SEC 文件和法律顾问报道在三个关键点上一致：投前估值 $1.265
              billion、已承诺 PIPE 资本 $77.5 million、且没有最低现金条件。8-K 进一步把头部估值拆开：首期对价 $575 million，另有最高 $690 million
              的业绩对赌或有对价。与此同时，Reuters 来源的 2024 年 12 月报道称，Gotion 领投了一轮 €100 million 融资；Amara Raja 自身披露也确认 2024 年 6 月追加投资
              €20 million，使其持股升至约 9.32%。更早资料还显示 Rio Tinto、CEZ 和 IFC
              支持建设。公开证据因此支撑一条可信的融资历史，但无法拼出总稀释、清算优先权或当前完全稀释后所有权的清晰图。最重要的是，在本次报告基准日，SPAC 交易尚未交割；尽管已有 Nasdaq 路径规划，InoBat
              仍是私营公司。
