            body: >-
              2026 年 7 月的业务合并条款在经济上很重要，但也容易被误读。头部投前估值是 $1.265 billion，但文件和公告把估值与实际到账资金分开。首期对价为 $575 million，另有最高 $690
              million 是附条件业绩对赌价值。交易还包括 $77.5 million PIPE，且没有最低现金条件。这些设计让交易比依赖大额最低信托现金门槛的结构更容易执行，但不等于 InoBat
              会带着足够资金走出来，覆盖超级工厂雄心。更实际地说，公司买到的是公开市场载体和估值参照点，不是一步解决长期资本强度。投资者仍需看到最终净现金、费用拖累和备考稀释，才能判断上市事件到底有多大帮助。这笔交易有财务价值，但不能自给自足。
