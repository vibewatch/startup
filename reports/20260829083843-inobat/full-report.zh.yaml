              积累可见标识值得给分，但每段关系的商业重量差异很大。一些对手方是真正终端客户，一些是下游集成商，一些是渠道或生态验证者，所以不能只按客户标识墙数量读，而要看角色。这个细节对尽调很重要，因为参考质量不等于收入质量。它也意味着，最好的公开客户证据在可量化承销前仍偏定性。组合令人鼓舞，但总体仍未成熟，仍依赖转化。
