      - number: '3.2'
        title: 同业规模与制造就绪度
        blocks:
          - type: paragraph
            body: >-
              按已披露规模看，InoBat 明显落后于融资最充足的同业。Verkor 公开提到 16 GWh 初始产能和 2030 年 50 GWh 目标，并已获得数十亿欧元融资。ACC 称其员工已超过 2,500 人，并自
              2024 年底起爬坡法国超级工厂产能。EVE Power Hungary 宣传的是一座 €1 billion、28 GWh 工厂，而 CATL 过往与 Fisker 的一份协议，仅一个 OEM 关系就指向超过 5
              GWh 的年产能。在这个背景下，InoBat 的公开证明仍小得多：50,000 节电芯试点线、规划中的 Šurany 一期 20 GWh 项目，以及具名 BESS 或客户项目。这不否定 InoBat
              的机会，但说明公司是以挑战者姿态竞争；伙伴通道、执行顺序和小众聚焦，比蛮力规模更重要。从融资角度看，投资者现在承销的是追赶，而不是全球领先。
