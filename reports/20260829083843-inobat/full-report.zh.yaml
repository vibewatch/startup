        blocks:
          - type: paragraph
            body: >-
              运营里程碑是真实存在的，但披露仍然不完整。InoBat 和斯洛伐克政府资料支撑了具体的 Voderady 试点线和国家支持的 Šurany 超级工厂计划，独立报道也确认了 50,000 节电芯试点线、35
              台设备配置，以及 Šurany 一期 20 GWh 的目标。政府背书强到足以说明项目有真实政治支持：官方资料描述了 65-hectare
              场地、土地和电网准备，以及大额战略投资支持。但缺口同样重要。没有留存公开资料验证 2026 年收入、利润率、员工数或客户数，SEC 文件也明确显示，更完整的 Form F-4
              或代理声明仍在后面。因此，第一章核心判断不是“只有故事”，而是“产品、试点制造和融资通道有证据，但投资测算数据不完整”。投资者可以合理地把 InoBat
              视为拥有真实工业动能的后期私营电池平台，但还不能把它当作披露充分的公开股票标的。
