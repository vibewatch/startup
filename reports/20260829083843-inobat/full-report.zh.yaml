    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品范围与运营足迹
        blocks:
          - type: paragraph
            body: >-
              InoBat 留存的 2026 年材料显示，这家公司已经不只是典型的收入前电池实验室叙事。官网和 2026 年 7 月 SPAC 公告同时把 InoBat
              定位为斯洛伐克的电池储能系统制造商和电芯开发平台。实际运营足迹比“总部位于斯洛伐克”更具体：官方联系与设施页面把 Voderady 列为总部、研发和生产中心。该基地现在承载研究实验室、试点电芯生产，以及
              BESSMONT 品牌下的专用 BESS 装配线。产品叙事也明显拓宽。InoBat 仍强调面向汽车、航空和专用场景的定制化、任务型电芯，但 2026 年也称自己已经通过公用事业级 BESS
              部署服务工业和公用事业客户。这个组合对尽调很关键：InoBat 似乎在用更近端的系统集成收入为商业化降风险，同时保留差异化电芯和大规模制造的更高上行叙事。
