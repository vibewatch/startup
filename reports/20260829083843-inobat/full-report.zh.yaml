      - number: '2.4'
        title: 增长驱动、约束与最终市场判断
        blocks:
          - type: paragraph
            body: >-
              三个结构性驱动有利于 InoBat：欧洲电网灵活性需求、奖励本地化的产业政策，以及可能让区域一体化供应商受益的电池可追溯规则。但约束同样清楚。ees Europe
              明确指出，电网瓶颈、许可延迟、监管不确定性和收入可见度有限，都是储能约束；Battery Atlas
              报道也显示，过度乐观公告之后，欧洲电芯市场正在整合。亚洲主导产能还意味着标准化产品面临强价格压力。Northvolt
              破产让教训更尖锐：宏观需求很大，并不保证重资本化的欧洲电池初创公司能按经济性规模化。实际含义是，InoBat
              最好的市场楔子不是“欧洲全部电池需求”，而是定制化、本地化或项目一体化交付重要到足以抵消规模劣势的目标项目。这仍是一个大机会，但比电池 TAM 头条显示的更窄，也更依赖执行。
