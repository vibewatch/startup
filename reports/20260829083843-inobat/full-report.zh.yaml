              看起来技术上真实：它有试点线、项目部署、伙伴验证，以及能覆盖电芯和储能的产品架构。最大优势似乎来自应用定制电池工程与系统集成的结合。最大限制是规模化可验证性。留存公开证据既没有建立强而可外部审计的 IP
