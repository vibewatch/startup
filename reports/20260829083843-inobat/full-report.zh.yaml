      - number: '2.3'
        title: 买方分层、预算归属与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方地图因细分市场而异。在公用事业和工业储能中，预算所有者往往是工厂业主、公用事业公司、项目开发商或能源管理团队，他们购买的是韧性、削峰和灵活性。在定制化交通电芯中，买方通常是 OEM
              的工程和采购组织，用户是车辆或航空器运营方，付款方可能是项目融资、平台采购或战略开发预算。差异解释了为什么 InoBat
              的采用路径很长。电池客户不会像翻目录那样采购：他们会经历化学体系选择、原型和电池包验证、安全认证、调试，再进入长期服务。OFZ 项目展示了固定式储能侧的流程，InoBat
              的航空和专用车辆叙事则展示了电芯端更长、验证更重的路径。尽调不能只看收入线市场增长；决定性问题是，InoBat 能在哪些场景最快从原型或试点走到复购和系列化部署。
