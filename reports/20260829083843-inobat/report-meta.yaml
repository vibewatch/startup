  topStrengths:
  - Strategic investor and partner set spans Amara Raja, Gotion, Rio Tinto, and Clarios-linked activity.
  - Public evidence supports real pilot manufacturing and live BESS deployment, not only a concept-stage story.
  - The company’s niche around customized cells plus BESS provides more differentiation than a generic commodity-cell thesis.
  topRisks:
  - Scale-up from pilot output to gigafactory economics remains largely unproven in public evidence.
  - Thin public disclosure on revenue, margins, and runway makes financial underwriting difficult.
  - The announced valuation depends heavily on future execution and future financing rather than current operating metrics.
  unresolvedGaps:
  - No retained public revenue, margin, or cash-balance disclosure sufficient for conventional valuation work.
  - Customer concentration, backlog, and repeat-order behavior remain undisclosed.
  - Future net cash from the de-SPAC and full filing package were not yet public in the retained evidence set.
