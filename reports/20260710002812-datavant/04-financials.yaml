    - AWS and Labcorp announcements emphasize value and speed, not price
    - Hard to benchmark realized ASPs
  - - Trial tokenization and follow-up
    - No public list pricing
    - Program-based or study-based contract
    - Clinical-research materials emphasize workflow benefit
    - Could be high-ACV but irregular
