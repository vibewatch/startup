  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: current liquidity and leverage
    missingEvidence: No cited public source discloses Datavant’s current cash balance, debt stack, covenant profile, or runway.
    whyItMatters: Capital adequacy cannot be underwritten without current liquidity and leverage.
    diligencePath: Request latest balance sheet, debt maturity schedule, covenant package, and 12-month liquidity forecast.
    relatedQuestionRefs:
    - QI014
    - QI016
  - type: private-evidence-only
    severity: material
    topic: margin quality by stream
    missingEvidence: Public sources do not break out revenue mix or gross margin across platform, retrieval, coding, privacy, and partner-embedded workflows.
    whyItMatters: Valuation depends on whether the revenue base behaves more like software or services.
    diligencePath: Request product-line P&L, services attachment rates, implementation burden, and contribution margin by stream.
    relatedQuestionRefs:
    - QI009
    - QI018
    - QI020
    - QI019
  - type: private-evidence-only
    severity: material
    topic: sales efficiency
    missingEvidence: Public evidence does not disclose CAC, payback, quota-carrying rep productivity, or pipeline conversion by segment.
    whyItMatters: A multi-motion GTM model can hide very different capital efficiency across product families.
    diligencePath: Request CAC, payback, funnel conversion, and sales productivity by segment and channel.
    relatedQuestionRefs:
    - QI006
    - QI020
tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Public status
  - Revenue quality view
  - Diligence ask
  rows:
  - - Datavant Connect / cloud-first data discovery
    - Platform access, data evaluation, privacy-preserving collaboration
    - Officially described; pricing undisclosed
    - Potentially software-like but likely usage/contract dependent
    - Show pricing metric, recurring share, and gross margin
  - - Life-sciences linkage / HEOR / trial support
    - Linked RWD, tokenization, cohort discovery, follow-up
    - Officially described; demand evidenced by partner launches
    - Could be high-value but may mix software and service effort
    - Break out software vs services revenue by life-sciences workflow
  - - Health-plan retrieval
    - Chart acquisition and records access
    - Officially described with cost-savings language
    - Likely transactional / service-heavy but sticky
    - Provide volume pricing, gross margin, and renewal cohorts
  - - Coding / risk adjustment services
    - Coding accuracy, HCC support, audit mitigation
    - Officially described on health-plan surface
    - Likely labor plus software augmentation
    - Provide labor intensity and margin by product
  - - Government and nonprofit research support
    - Privacy-preserving linkage, retrieval, privacy hub
    - Officially described
    - Potentially project-based with compliance premiums
    - Disclose contract length and revenue-recognition pattern
  - - Legal / insurance / payment workflows
    - Medical payment and verification, claim resolution support
    - Public workflow language suggests this stream exists
    - Possibly transactional, service-led revenue
    - Quantify share of total revenue and working-capital profile
  notes: Rows synthesize Datavant public product surfaces into candidate revenue streams; they are not management-disclosed segment financials.
