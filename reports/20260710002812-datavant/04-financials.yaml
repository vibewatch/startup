- id: cost-structure
  title: Cost structure and what likely drives gross margin
  body: 'Datavant’s cost structure is not publicly disclosed, but the product mix implies several layers of cost. Retrieval and release-of-information operations likely carry fulfillment labor, compliance operations, document handling, and customer-service overhead. Coding-related products can add specialist labor and QA costs. Privacy and expert-determination services imply data-science and compliance headcount. Connectivity and cloud-native discovery products add infrastructure and engineering costs. That combination argues against treating Datavant like a simple high-gross-margin API or data SaaS vendor. Instead, gross margin likely varies meaningfully by workflow and by the degree of manual service delivery in each product line.


    Public-company comparables support the idea that healthcare data businesses often blend software and services. IQVIA’s 2024 10-K shows that the majority of revenue in its Research & Development Solutions segment relates to service contracts recognized over time using a cost-based input method, with direct labor and third-party costs shaping revenue recognition. Health Catalyst’s 2025 10-K describes a model that combines technology, interoperability, analytics, professional services, and tech-enabled managed services. Those companies are not Datavant, but they are useful analogues for why the company’s public breadth should be read as a mixed-economics model rather than a pure software margin story.


    The strongest financial positive is that Datavant appears able to monetize multiple workflow layers around the same underlying data-connectivity problem. The strongest financial risk is that investors cannot see the actual contribution margin of each layer. A business that combines platform revenue with labor-intensive workflows can scale very well, but it can also hide lower blended gross margins, slower margin expansion, or more working-capital complexity than headline market positioning suggests.'
