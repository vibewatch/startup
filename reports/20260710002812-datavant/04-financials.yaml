- id: TI007
  title: Service-delivery cost / margin driver table
  columns:
  - Driver
  - Why it affects cost
  - Likely direction
  - Evidence basis
  - Open question
  rows:
  - - Retrieval fulfillment labor
    - Chart retrieval and record handling require operations
    - Pressures margins downward vs pure software
    - Health-plan and government workflow descriptions
    - What share is manual vs automated?
  - - Coding and QA headcount
    - Specialist review and compliance work can be labor-intensive
    - Pressures margins downward
    - Health-plan coding page
    - What % of coding is AI-assisted vs human?
  - - Cloud and compute
    - Data discovery and secure collaboration consume infrastructure
    - Could pressure margins early but improve with scale
    - AWS and Labcorp announcements
    - How much compute is passed through?
  - - Privacy / compliance expertise
    - Expert determination and IRB / FedRAMP support require skilled staff
    - Raises fixed-cost base but can support premium pricing
    - Government and privacy workflow descriptions
    - Can premium pricing offset specialist cost?
  - - Partner and data-access economics
    - Some offerings may depend on external data partners or pass-through costs
    - Could compress margins in some workflows
    - AWS / RWD ecosystem descriptions
    - What share of revenue includes third-party pass-through?
  - - Implementation and managed services
    - Hybrid deployments can require onboarding and services
    - Slows pure-SaaS margin profile
    - Comparable filings and Datavant workflow breadth
    - What is implementation burden per new logo?
  notes: Driver table is inferential but grounded in public workflow descriptions and comparable healthcare-data business models.
