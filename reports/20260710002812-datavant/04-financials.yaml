    - Unavailable
    - Low
    - Needed to assess sales efficiency and revenue concentration
    - Provide ACV by product and segment
  - - CAC payback
    - Unavailable
    - Low
    - Needed to evaluate GTM quality
    - Provide fully loaded CAC and payback by segment
  - - Gross margin
    - Unavailable
    - Low
    - Determines whether Datavant deserves software-like valuation treatment
    - Provide gross margin by product line
