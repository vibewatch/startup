  rows:
  - - IQVIA 10-K
    - R&D Solutions majority service contracts; cost-based revenue recognition with direct labor and third-party costs
    - Shows how healthcare data / research businesses can have service-heavy revenue mechanics
    - IQVIA is far larger and broader than Datavant
    - Do not assume Datavant is pure software
  - - Health Catalyst 10-K
    - Technology combined with professional services, managed services, interoperability, and analytics
    - Useful analogy for hybrid product-and-services operating model
    - Health Catalyst sells to providers more than life sciences
    - Breadth can mask mixed margin profiles
  - - IQVIA corporate profile
    - 93,000 employees in 100+ countries
    - Illustrates the scale of global data-services leaders buyers may benchmark against
    - Not a direct financial ratio
    - Large incumbents set buyer expectations on service depth
  - - Datavant merger release
    - '>USD 700M revenue and large investor support at merger date'
    - Strongest direct public Datavant financial anchor
    - Stale and pre-2025 acquisition wave
    - Current margin path still unknown
  - - Health-plan economics claims
    - 20%-40% lower fees and 98% retained customers
    - Indicates operational ROI and stickiness in one segment
    - Not audited company-wide economics
    - May support good segment-level unit economics
  - - Labcorp / AWS partner launches
    - Datavant used as privacy-preserving connectivity layer inside partner products
    - Shows monetization optionality through ecosystem embedding
    - Commercial terms undisclosed
    - Partner channels may broaden revenue without identical margin profiles
