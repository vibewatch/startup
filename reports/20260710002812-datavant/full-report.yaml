      - number: '6.2'
        title: Adoption trajectory and breadth of deployment
        blocks:
          - type: paragraph
            body: >-
              Datavant’s public adoption signals are broad and unusually concrete even when they are not clean financial
              metrics. The company says it enables more than 60 million healthcare records to move across its ecosystem,
              reaches more than 80,000 hospitals and clinics, serves 75% of the 100 largest health systems, and works
              with 350-plus real-world-data partners. Health-plan pages cite access to 80,000-plus hospitals and
              clinics, 20,000-plus digital FHIR connections, 93% of leading Medicare Advantage, Medicaid, and ACA health
              plans, and 98% annual retention of health-plan customers. Commercial-pharma and clinical-research pages
              say Datavant works with 40-plus life-science customers, 100-plus brands, and more than 100 clinical
              trials.


              These claims do not answer every question about active accounts or net revenue retention, but they do
              indicate that Datavant’s adoption is beyond pilot scale. Several signals also imply production use rather
              than branding-only relationships. Datavant’s AWS-backed product was tested with four top-20 pharmaceutical
              companies and multiple named data partners before general availability. Labcorp’s Alzheimer’s platform
              uses Datavant’s connectivity layer inside a production research offering. The KLAS press release quotes
              provider-side customers discussing real-time feedback, staffing help, and coding workflow impact, which is
              stronger evidence than a logo wall alone.


              The best reading is that Datavant has strong deployment breadth and credible throughput. The main missing
              denominator is account-level visibility: public sources still do not show how many of these relationships
              are large recurring contracts, how many are partner-embedded, and how many are smaller or narrower
              workflow wins.
