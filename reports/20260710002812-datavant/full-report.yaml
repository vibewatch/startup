      - number: '1.5'
        title: Trust events, legal overhangs, and remaining diligence questions
        blocks:
          - type: paragraph
            body: >-
              Trust is central to Datavant's thesis, so adverse events deserve explicit treatment rather than a
              footnote. Datavant says it invests more than $40 million annually in security and compliance
              infrastructure and frames privacy, compliance, and authorization as platform-layer capabilities. Those
              investments are economically rational: a platform moving tens of millions of records and serving
              hospitals, payers, regulators, and life-sciences companies cannot afford repeated trust failures. The
              company also added senior privacy, legal, and security leadership well before the current AI-heavy
              positioning, which supports the idea that compliance is core to the model rather than a late add-on.


              Even so, the 2024 breach-and-settlement episode is a real diligence item. HIPAA Journal reported that a
              phishing attack on a company email account exposed data relating to 320,702 individuals, and the
              class-action settlement site plus the settlement press release show Datavant agreeing to a $900,000
              settlement that offers up to $5,000 in documented-loss claims plus one year of identity-theft monitoring.
              Datavant denied wrongdoing, but the event illustrates the asymmetric downside of operating as a HIPAA
              business associate at national scale: one email-account compromise can trigger litigation, reputational
              damage, and questions from every enterprise buyer.


              The larger diligence gaps are still financial and definitional rather than product-market-fit. Public
              sources do not provide a clean, current revenue run rate, ARR mix, gross margin, or
              acquisition-integration scorecard. The public record also carries unresolved ambiguity over the company's
              founding year and headquarters because the current platform combines legacy Datavant and Ciox identities.
              For an investment memo, the correct posture is not skepticism about whether Datavant matters—public
              evidence clearly shows that it does—but caution about underwriting current value creation without private
              metrics on revenue quality, integration progress, customer concentration, and security incident
              remediation.
            claimRefs:
              - CO033
              - CO034
              - CO035
              - CO036
              - CO037
              - CO038
              - CO039
