  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive landscape: more than one type of rival'
        blocks:
          - type: paragraph
            body: >-
              The buyer can solve Datavant’s job in several different ways, which is why a narrow list of tokenization
              peers would understate competition. Some competitors own large healthcare data ecosystems and sell
              analytics or evidence generation directly. Others provide interoperability rails, FHIR infrastructure, or
              workflow automation that let customers move data themselves. Still others are incumbents in provider
              workflow, chart retrieval, or payer exchange and can absorb pieces of Datavant’s value proposition without
              ever calling themselves data-connectivity platforms. The result is a market where direct competition
              varies by use case: an HEOR buyer may compare Datavant with HealthVerity, Komodo, or Truveta; a payer or
              provider operations buyer may compare it with Veradigm, Redox, 1upHealth, or internal integration work.


              Keragon’s 2026 vendor survey captures the breadth of the field. It describes interoperability vendors
              ranging from no-code workflow providers to FHIR hubs, enterprise engines, and API platforms, and says
              buyers evaluate standards support, compliance, deployment speed, pricing transparency, and production
              scale. Athenahealth’s interoperability explainer reinforces the same practical reality: buyers do not just
              ask whether a vendor “does interoperability”; they ask whether it connects to their actual EHR, supports
              the right standards, clears HIPAA requirements, and deploys without months of custom engineering. That
              means Datavant competes not only on abstract data scale, but also on implementation burden, trust posture,
              and workflow fit.


              The status quo substitute remains important. Many customers still rely on fragmented point solutions,
              bespoke data engineering, manual record retrieval, or internal analytics teams stitching together claims
              and EHR assets. Datavant therefore competes against inertia as much as against brands. In segments where
              data holders already have strong proprietary assets, such as Komodo or Truveta, Datavant must show why a
              neutral connective layer still adds value. In operational workflows, it must show why its network and
              privacy tooling outperform incumbent release-of-information, integration, or RCM vendors.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
      - number: '3.2'
        title: 'Direct peers: data ecosystems and evidence platforms'
        blocks:
          - type: paragraph
            body: >-
              The closest direct peers are the companies that already combine large data assets with healthcare-specific
              identity, analytics, or evidence workflows. HealthVerity positions itself as the healthcare data platform
              built for breakthroughs and says HealthVerity plus Symphony Health now form one ecosystem connecting
              pharmacy, medical claims, labs, and EHR. It also emphasizes identity resolution and a marketplace for
              real-world data. Komodo takes a different angle: it highlights a massive linked-data foundation of more
              than one trillion records and 330 million de-identified patients, then layers auditable healthcare AI on
              top. Truveta differentiates on direct health-system sourcing, daily refresh, full traceability to clinical
              source, and explicit claims of regulatory-grade provenance. These rivals are not just data pipes; they
              bundle data access, analytics, and narrative around decision support.


              Datavant’s relative position inside this group is distinctive rather than obviously dominant. It markets
              itself as a privacy-preserving connective layer that can link proprietary and external data and help
              customers discover fit-for-purpose RWD across a 300-plus partner ecosystem. That can be stronger than a
              proprietary data owner when the buyer wants neutrality, interoperability across many counterparties, or
              connectivity into trial, payer, and provider workflows. But it can be weaker when the buyer prefers an
              integrated data-plus-analytics environment and is willing to adopt one vendor’s ecosystem end to end.
              Komodo and Truveta, for example, explicitly frame their offerings around complete or traceable data
              foundations that reduce wrangling for research teams.


              This means Datavant’s direct-competition moat is conditional. It is strongest when the buyer already has
              proprietary data or needs to connect across organizations without exposing PHI. It is less absolute when
              the buyer mainly wants immediate analytic answers from one existing data estate. For investors, the
              important point is that Datavant is competing against both connective layers and destination platforms,
              which raises the bar on product integration, workflow speed, and proof that privacy-preserving linkage
              adds measurable value over buying a vertically integrated dataset.
            claimRefs:
              - CP008
              - CP009
              - CP010
