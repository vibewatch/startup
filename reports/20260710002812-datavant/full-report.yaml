      - number: '6.4'
        title: Retention, expansion, and concentration
        blocks:
          - type: paragraph
            body: >-
              The public record provides a few retention clues but not a full durability model. On the positive side,
              Datavant claims 98% annual retention among health-plan customers and 97% retention among health-plan
              requesters on retrieval materials. KLAS customer quotes also suggest operational embeddedness: customers
              describe Datavant as helping with real-time provider feedback, staffing, and workflow streamlining. That
              kind of language usually indicates more than a lightweight tool relationship. Datavant’s broad partner
              ecosystem and multiple workflow entry points also suggest land-and-expand potential, because a customer
              can begin with retrieval, coding, trial linkage, or cloud discovery and later add adjacent modules.


              But concentration and company-wide retention remain opaque. We do not know whether a few payer or
              life-science relationships account for a large share of revenue, whether partner channels dilute direct
              customer ownership, or whether one workflow category drives most expansion. Public sources also do not
              disclose NRR, GRR, contract length, logo churn, or cohort behavior over time. Even the strongest retention
              claims are segment-specific and company-authored.


              The balanced conclusion is that Datavant looks sticky in at least some workflows, especially payer
              retrieval/coding and government-grade data linkage. However, there is not enough public evidence to prove
              that the entire customer base behaves like a best-in-class land-and-expand software cohort.
