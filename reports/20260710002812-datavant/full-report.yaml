  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: 'Revenue model: a hybrid of platform and services'
        blocks:
          - type: paragraph
            body: >-
              Datavant’s public surfaces do not describe a single clean SaaS revenue engine. Instead, the company sells
              across several workflow families: Datavant Connect for data discovery and privacy-preserving connectivity;
              trial and HEOR use cases for life sciences; health-plan retrieval and coding; government and nonprofit
              linkage; and retrieval or release-of-information style workflows tied to medical payment, verification,
              and continuity-of-care use cases. The 2021 merger release also made clear that the combined Datavant-Ciox
              business brought together tokenization technology with a large clinical data exchange and
              release-of-information network. In financial terms, that points to a hybrid model mixing software-like
              platform economics with services, workflow execution, and transaction or volume-linked revenue.


              The public evidence reinforces that view. Health-plan pages emphasize multichannel retrieval, coding
              support, lower acquisition fees, and retained payer customers. Government pages emphasize privacy experts
              and disclosure-risk support. Commercial-pharma and clinical-research pages emphasize linked RWD, cohort
              discovery, trial tokenization, and fit-for-purpose evidence generation. AWS and Labcorp announcements
              highlight data discovery, privacy-preserving collaboration, and faster analytics, which are closer to
              platform monetization. This breadth is strategically attractive because it gives Datavant several revenue
              streams, but it also means investors should not assume the gross-margin structure of a pure software
              company. Some revenue almost certainly carries labor, implementation, fulfillment, or data-access costs
              that behave differently from standard SaaS.


              The best public financial anchor remains the 2021 merger announcement, which said the combined company
              would have revenue of more than $700 million. That number confirms meaningful scale, but it does not
              answer the harder underwriting questions: what percentage is recurring software, what percentage is
              workflow or managed services, how much is pass-through third-party spend, and which segments generate the
              best contribution margins. Those unknowns dominate the financial analysis more than the top-line scale
              signal itself.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI006
              - CI007
              - CI008
