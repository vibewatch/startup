      - number: '2.4'
        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              The strongest structural tailwinds are regulatory, operational, and economic. Datavant’s own
              interoperability guide says the HITECH Act put $27 billion behind EHR adoption and that the 21st Century
              Cures Act plus ONC’s final rule sharpened expectations around access and information blocking. ONC’s 2026
              standards bulletin says USCDI remains the foundation for nationwide interoperable exchange and that draft
              USCDI v7 adds thirty proposed or revised elements. The same bulletin notes that CMS’s prior-authorization
              rule and TEFCA require the ability to exchange USCDI data elements. CMS in turn says its interoperability
              team is driving an HHS-wide move to FHIR APIs. Together, these signals show why interoperability remains a
              compliance-led market rather than a discretionary nice-to-have.


              Demand is also driven by the limitations of isolated datasets. Datavant’s real-world-data guide says no
              single source captures the full patient journey and explains why claims, EHR, labs, registries, and other
              sources must be linked for many research and HEOR use cases. The company’s 2026 RWE trends blog argues
              that linked, fit-for-purpose datasets are becoming the standard for decision-grade evidence and that
              queryable data networks are increasingly important upstream in trial design. Third-party market reports
              reinforce the same pattern: tokenization, claims linkage, and interoperability services are growing
              because organizations need longitudinal, privacy-preserving views of patients rather than disconnected
              data slices.


              The constraints are just as real. Datavant’s educational materials say healthcare interoperability is
              still far from where it needs to be. MarketsandMarkets highlights fragmentation, data-quality problems,
              and a lack of universally accepted RWE methodology as challenges. Datavant’s own blog emphasizes
              governance, documentation, and explainability around AI-assisted evidence generation. In plain English:
              the market is large, but adoption depends on trust, workflow change, standards compliance, and the ability
              to prove that linked data is fit for purpose. That is good for an established infrastructure provider, but
              it means growth can still be slowed by implementation friction, procurement complexity, and skepticism
              from regulators, payers, or providers when data provenance is weak.
            claimRefs:
