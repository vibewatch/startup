      - number: '8.4'
        title: Comparable set and valuation logic
        blocks:
          - type: paragraph
            body: >-
              Public comparables show how wide the multiple range can be for healthcare-data and workflow businesses. As
              of July 2026, CompaniesMarketCap lists IQVIA at about $34.9 billion market cap, Veeva at about $30.8
              billion, Health Catalyst at about $0.16 billion, and Phreesia at about $0.66 billion. Public revenue
              sources show Veeva generated about $2.747 billion in annual revenue for 2025, Phreesia about $420 million
              for 2025, Health Catalyst about $311.1 million for 2025, and IQVIA’s Research & Development Solutions
              segment alone about $8.527 billion for 2024. These are not perfect apples-to-apples comps, but they are
              useful boundary markers.


              Using simple market-cap-to-revenue heuristics, the public comp set spans roughly 0.5x for Health Catalyst,
              about 1.6x for Phreesia, about 4.1x for IQVIA using the R&D Solutions segment anchor, and about 11.2x for
              Veeva. Datavant’s 2021 headline of $7.0 billion against a disclosed revenue floor above $700 million
              implies roughly 10x — much closer to Veeva’s premium software multiple than to hybrid or services-heavy
              peers. That is the single most important valuation warning in the entire chapter. Publicly, Datavant has
              not yet earned the right to be assumed Veeva-like in economics simply because it is strategically
              impressive.


              The right comp logic is therefore not “Datavant is worth what the last sponsor-backed mark said.” It is
              “Datavant needs to prove why a premium multiple is still justified relative to better-disclosed public
              peers.” Without product-line margins, current growth, and retention data, the fair stance is
              stretched-to-fair depending on private evidence, not obviously attractive.
            claimRefs:
              - CV022
              - CV023
              - CV024
              - CV025
              - CV026
              - CV027
              - CV028
          - type: table
            tableRef: TV004
            claimRefs:
              - CV022
              - CV023
              - CV024
              - CV025
              - CV026
          - type: table
            tableRef: TV005
