      - number: '5.2'
        title: 'Architecture and operating model: Switchboard, FHIR Worker, and configurable retrieval'
        blocks:
          - type: paragraph
            body: >-
              The most substantive public technical detail comes from Datavant’s engineering writing on the Switchboard
              and API retrieval. Datavant describes the Switchboard as supporting both identified and de-identified data
              and explains that the identified side fulfills records requests through three mechanisms: manual
              retrieval, third-party services, and first-party connections directly to health-system EHR APIs. The FHIR
              Worker is the component that facilitates direct retrieval over those first-party connections and returns
              requested data in layouts determined by the requester. Public technical notes also describe how the Worker
              identifies the patient in the EHR, retrieves the needed resource types, filters data to comply with
              HIPAA’s minimum-necessary concept, and adapts to highly variable FHIR and non-FHIR implementations.


              Datavant’s technical writeups also make the internal operating model unusually explicit. The API retrieval
              redesign moved from push-style scheduling to a pull-based model in which FHIR/EHR workers pull prioritized
              requests from a Redis sorted set. A Controller manages request lifecycle, a Dispatcher submits work, and
              workers return results through notification queues. Datavant says the redesign processed at-scale loads in
              minutes that would have taken hours in the legacy system, and that the system is horizontally scalable
              enough to aim for ten times chart volume while making provider APIs rather than Datavant’s own scheduling
              logic the bottleneck. The company also describes a configuration-first approach using JSON Resource
              Definitions validated with Pydantic so lay users can support new EHRs and use cases without constant new
              engineering builds.


              This is not proof of perfect reliability, but it is stronger technical evidence than generic healthcare IT
              marketing. It shows Datavant has built genuine data-plane and workflow-orchestration capabilities for
              messy, heterogeneous EHR environments. The architecture is therefore a source of differentiation, but also
              a source of complexity and technical debt risk if variance or customer-specific retrieval needs continue
              to expand faster than automation.
