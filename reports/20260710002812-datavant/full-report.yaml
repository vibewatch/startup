      - number: '3.3'
        title: Adjacents, incumbents, and internal build alternatives
        blocks:
          - type: paragraph
            body: >-
              Beyond the direct data-ecosystem peers, Datavant faces a wide set of interoperability and workflow vendors
              that can solve adjacent jobs. Redox pitches itself as an interoperability partner for intelligent
              healthcare data exchange at scale and publishes broad scale indicators such as 20 billion-plus healthcare
              transactions, 12,200-plus connected organizations, 14,900-plus live integrations, more than 100 EHR
              connections, and 99.95% uptime. 1upHealth, by contrast, is more explicitly payer- and FHIR-oriented,
              emphasizing CMS requirements, tech-agnostic architecture, and scalable data exchange for health plans. Zus
              packages a single shareable patient profile and medication / event alerts into care-delivery workflows.
              Veradigm brings an incumbent workflow footprint spanning EHR, e-prescribing, chart retrieval, payer-path
              clearinghouse, revenue-cycle services, and coding services.


              These adjacents matter because many customers do not buy a single “data connectivity platform.” They buy
              the narrowest tool that removes the binding constraint. A provider organization may prioritize document
              exchange or retrieval speed. A digital-health builder may want an API layer or aggregated patient profile.
              A payer may need CMS-aligned FHIR exchange. A health-tech vendor may buy Redox to reach trading partners
              quickly. In those contexts, Datavant does not always have the lowest-friction starting point, especially
              if the customer is not yet convinced it needs a broader privacy-preserving network.


              Internal build is the other real alternative. Some customers can combine cloud data engineering, direct
              source contracts, FHIR APIs, and workflow software to create acceptable in-house solutions. That route is
              slower and riskier, but it may look attractive to large enterprises that already control data, have strong
              security teams, and want to avoid platform dependency. Datavant’s sales motion therefore has to prove that
              network reach, compliance, governance, and workflow depth reduce time-to-value enough to beat both point
              vendors and internal-build paths.
