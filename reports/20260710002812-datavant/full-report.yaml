      - number: '3.4'
        title: Pricing transparency, trust posture, and distribution power
        blocks:
          - type: paragraph
            body: >-
              Pricing is one of the least transparent parts of this market. Public sources show that Redox offers custom
              pricing, while most direct peers emphasize demos or sales conversations rather than list prices. That lack
              of public pricing makes competitive comparison difficult, but it also signals that vendors tailor
              contracts around data type, workflow, scale, and compliance burden. For Datavant, this cuts both ways. The
              company can price to value in high-friction or high-governance use cases, but buyers may also run long
              multi-vendor bake-offs because the market is negotiated rather than self-serve.


              Trust posture is more observable. Redox discloses HITRUST coverage and SOC 2 maintenance. Truveta
              emphasizes source traceability, audit readiness, and FDA-aligned data quality language. HealthVerity
              highlights HIPAA-compliant identity resolution. Datavant stresses HIPAA standards, IRB support, FedRAMP
              authorization in government materials, and privacy-preserving linkage. In practice, trust is not a side
              feature in this market; it is part of the product. Buyers in payer, provider, and life-sciences settings
              often need evidence that a vendor can manage privacy, lineage, and access controls before they care about
              downstream analytics.


              Distribution power is equally important. Data-ecosystem owners such as HealthVerity, Komodo, and Truveta
              can sell the convenience of a large existing data foundation. Interoperability rails such as Redox or
              1upHealth can sell faster connection into counterparties and standards-native deployment. Incumbent
              workflow vendors such as Veradigm can cross-sell from existing operational relationships. Datavant’s
              answer is to sell the combination: a network-of-networks, privacy layer, and workflow infrastructure that
              can span multiple counterparties. Whether that wins depends on how much buyers value neutrality and
              cross-organization reach versus owning one pre-integrated stack.
