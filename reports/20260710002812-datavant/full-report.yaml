figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    layout: wide
    summary: >-
      Datavant's public chronology runs from the original 2017 startup through the 2021 Ciox merger, 2024 CEO
      transition, 2025 acquisitions, and 2026 partner launches plus a material legal overhang.
    data:
      items:
        - date: '2017'
          label: Original Datavant launched
          detail: Roivant-backed startup focused on privacy-preserving health-data linkage.
          tone: positive
        - date: 2019-02
          label: Commercial and finance hires added
          detail: Steven Swank named CRO and Nick Colburn CFO.
          tone: positive
        - date: 2020-02
          label: Privacy and security leadership expanded
          detail: Aden Fine and Dongting Yu added as Datavant scaled compliance capabilities.
          tone: positive
        - date: 2020-10
          label: Series B closes
          detail: $40M financing brought cumulative original-company funding to $83M.
          tone: positive
        - date: 2021-06
          label: Ciox merger announced
          detail: Combined entity valued at $7.0B with >$700M revenue at announcement.
          tone: positive
        - date: 2024-05
          label: Kyle Armbrester becomes CEO
          detail: Leadership transition from merger-era operator to platform-scaling operator.
          tone: neutral
        - date: 2025-07
          label: Aetion acquired
          detail: Real-world-evidence platform folded into life-sciences business.
          tone: positive
        - date: 2025-08
          label: Ontellus acquired
          detail: Legal and insurance vertical formally added.
          tone: positive
        - date: 2025-11
          label: AWS Clean Rooms collaboration launched broadly
          detail: Cloud-first health-data discovery goes generally available.
          tone: positive
        - date: 2026-04
          label: Labcorp Alzheimer's platform launches
          detail: Datavant connectivity powers AI-assisted RWD research workflow.
          tone: positive
        - date: 2026-05
          label: Breach settlement disclosed
          detail: $900k settlement became public after 2024 phishing-related incident.
          tone: warning
    approximationNotes: >-
      Dates are taken from public announcement dates or clear publication timestamps. The 2017 startup date refers to
      original Datavant, while later milestones describe the current combined company.
    claimRefs:
      - CO014
      - CO015
      - CO022
      - CO024
      - CO025
      - CO029
      - CO030
      - CO032
      - CO036
      - CO042
  - id: FO002
    title: Company snapshot logic
    type: flow
    layout: standard
    summary: >-
      Datavant's current business logic runs from privacy-preserving linkage and retrieval infrastructure into a
      multi-sided network spanning providers, payers, life sciences, and legal-insurance workflows.
    data:
      nodes:
        - id: privacy
          label: Privacy-preserving tokenization and authorization controls
          detail: Irreversible tokens, compliance workflows, and security investment form the trust layer.
          tone: positive
        - id: network
          label: Data network at national scale
          detail: 80K+ hospitals/clinics, 75%+ of top health systems, 350+ RWD partners, payer coverage.
          tone: positive
        - id: solutions
          label: Operational solutions layer
