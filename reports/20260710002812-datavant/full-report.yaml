      - number: '8.3'
        title: Bull, base, and bear scenarios
        blocks:
          - type: paragraph
            body: >-
              The bull case assumes Datavant increasingly behaves like the best parts of the narrative: a trusted,
              neutral data-collaboration layer with strong network effects, expanding cloud-first distribution, high
              renewal quality, and enough automation to let margin profile improve over time. In that case, the 2021
              headline multiple may not have been unreasonable, especially if the business today is meaningfully larger
              than the disclosed >$700 million historical revenue base and if software-like discovery, linkage, and
              compliance products are becoming a larger share of mix. The best support for this case is the company’s
              breadth of customer proof, strong operational reach, and ecosystem role in high-value workflows.


              The base case is more conservative. It assumes Datavant is a very good business with mixed economics: some
              premium software-like workflows, some sticky but labor-heavy retrieval/coding operations, meaningful
              compliance and partner costs, and real but not fully visible retention quality. Under that framing,
              Datavant deserves a substantial valuation, but investors should resist maximum SaaS multiples until they
              see product-line margin and concentration data. The historical 10x revenue-like anchor then looks more
              stretched than bargain, even if it was strategically rational for sponsors.


              The bear case assumes public opacity is hiding weaker economics: lower blended margins, greater channel
              dependence, concentration in a few accounts or programs, or security/trust overhang that slows renewals.
              In that world, Datavant would look less like Veeva and more like a hybrid services-and-software asset that
              should trade closer to lower public healthcare-data multiples. Because the current public record cannot
              rule this out, the bear case has to remain live in any honest underwriting exercise.
            claimRefs:
              - CV015
              - CV016
              - CV017
              - CV018
              - CV019
              - CV020
              - CV021
