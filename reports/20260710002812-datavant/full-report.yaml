      - number: '2.5'
        title: What the market structure means for Datavant
        blocks:
          - type: paragraph
            body: >-
              The public evidence supports a favorable market-structure verdict for Datavant. The company is not trying
              to create demand for a brand-new category; it is benefiting from several already-moving forces: regulation
              pushes data exchange, life-sciences sponsors need linked RWD, payers need chart retrieval and coding
              accuracy, and providers still struggle with fragmented access workflows. Datavant’s strategic advantage is
              that it can convert these pressures into a unified infrastructure story. A sponsor that starts with trial
              tokenization can later buy data discovery; a payer that starts with retrieval can expand into coding; a
              government program can use privacy-preserving linkage plus retrieval and disclosure-risk services.


              At the same time, the market does not forgive weak execution. Competitors such as HealthVerity, Komodo,
              Truveta, and Veradigm all claim strong data coverage or analytics depth, and vendor directories still
              place Datavant among a wider field of interoperability players. That means Datavant’s market position
              depends on proving that network reach, privacy infrastructure, and workflow integration produce better
              outcomes than alternatives built around proprietary datasets, EHR-native platforms, or lightweight API
              connectivity. The company’s opportunity is large, but the winning position is not “own the market”; it is
              “be the trusted connective layer where fragmented records, privacy, and workflow complexity intersect.”


              For investors, the main market takeaway is that Datavant participates in several durable and expanding
              spending pools with strong regulatory support. The open questions are not about whether this market
              exists, but about how much share Datavant can convert into high-quality recurring revenue, how defensible
              the network effects remain as competitors improve, and whether the company can keep spanning operational
              retrieval workflows and advanced RWE use cases without losing focus or margin quality.
            claimRefs:
              - CM006
              - CM014
              - CM018
              - CM022
              - CM032
              - CM034
              - CM035
              - CM036
      - number: '2.6'
        title: Exhibits
