chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, mission, and current positioning
        blocks:
          - type: paragraph
            body: >-
              Datavant now presents itself as a healthcare data collaboration platform rather than a narrow point
              product. The homepage describes the company as the data collaboration platform trusted for healthcare and
              says its mission is to make the world's health data secure, accessible, and actionable. In operating
              terms, the platform is built around moving and connecting patient-level data across providers, payers,
              life sciences companies, legal and insurance requesters, government organizations, and real-world data
              partners. The current identity is broader than the original 2017 Datavant startup: after the 2021 Ciox
              Health merger, the company inherited a much larger retrieval network, services layer, and a more
              complicated corporate footprint. Current official pages emphasize trusted data access, expert-governed AI
              workflows, and privacy-by-design controls rather than just tokenization software.


              Scale signals are material. Datavant says its network exchanges 1,500 terabytes of data and tokenizes 1
              trillion records annually. It also says the platform reaches more than 80,000 hospitals and clinics, more
              than 75% of the 100 largest U.S. health systems, 100% of U.S. payers directly or through customers, and
              more than 350 real-world data partners. These are unusually large ecosystem claims for a private company
              and help explain why Datavant shows up repeatedly as infrastructure in partner announcements from Thermo
              Fisher, AWS, Labcorp, and other health-data players. The company also serves 120,000 legal and insurance
              requesters, indicating that the current product surface extends far beyond life-sciences linkage alone.


              There is a meaningful identity wrinkle that later diligence should keep explicit: pre-merger Datavant and
              the current Datavant are not the same scale entity. Current newsroom materials describe the company as
              founded in 2014 and headquartered in New York, while earlier Datavant materials and third-party venture
              databases describe the original startup as founded in 2017 and headquartered in San Francisco. The public
              record therefore supports treating the current company as a merger-built platform whose original startup
              roots sit inside a larger, post-2021 operating structure.
