      - number: '6.5'
        title: Expansion opportunity versus customer risk
        blocks:
          - type: paragraph
            body: >-
              Expansion paths at Datavant are visible: a health plan can add coding to retrieval, a pharma customer can
              add cloud discovery to tokenization or trial follow-up, and a government or nonprofit customer can combine
              linkage, retrieval, and privacy services. The company’s ecosystem also creates partner-driven reach, which
              can lower customer-acquisition friction in some workflows. But the same structure creates risks.
              Partner-embedded offerings can make Datavant strategically important while obscuring direct customer
              ownership. Broad network and throughput claims can also mask unequal revenue concentration if a smaller
              set of logos or channels generates most of the economics.


              There is also trust risk. Because Datavant’s value depends on secure, compliant data movement, the 2026
              settlement tied to the 2024 breach matters for customer durability even in the absence of public churn
              data. In highly regulated workflows, security or privacy incidents can slow sales, reduce expansion, or
              increase procurement friction. The public source set does not show whether that happened, but it is a real
              customer-risk vector.


              Overall, the customer thesis is solid on adoption proof and strategic relevance, but incomplete on
              economics. Datavant appears to have real, diversified, production-grade customer relationships. What
              remains unproven publicly is whether those relationships produce the kind of broad-based recurring
              expansion and low concentration that would justify maximum confidence in the customer-quality story.
