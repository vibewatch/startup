        title: Named customer proof and what counts as real production use
        blocks:
          - type: paragraph
            body: >-
              Named customer proof is strongest where Datavant appears inside an operational or research workflow.
              Labcorp’s April 2026 launch is strong proof because it explicitly describes a platform developed with AWS
              and Datavant, anchored in deidentified and privacy-protected data, intended to accelerate Alzheimer’s
              research and cohort identification. Thermo Fisher’s PPD business is another strong proof point because the
              public announcement frames the collaboration as advancing real-world-data interoperability across clinical
              development. Government-sector proof is meaningful as well: Datavant’s own government page describes the
              company as a key partner in PCORnet, the NIH National COVID Cohort Collaborative, and the All of Us
              Research Program. The FedRAMP press release adds specific context that Datavant provides
              privacy-preserving infrastructure for NCATS’ N3C.


              There is also segment-specific proof on the payer and provider side. The KLAS release includes direct
              customer commentary on coding workflow performance and staffing support, plus external rankings for
              risk-adjustment and outsourced coding. The health-plan page claims 98% customer retention and broad plan
              penetration, while retrieval pages cite 97% retention among health-plan requesters and 64 million annual
              retrievals. Those signals are not perfect named-logo references, but they point to repeat operational use
              rather than one-off pilots.


              The limitation is that public proof still skews toward successful or strategic references. We do not see
              failed deployments, contract durations, or explicit renewal cohorts. So the named proof is good enough to
              establish reality, but not good enough to settle durability questions.
