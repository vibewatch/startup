              - CV026
              - CV027
      - number: '8.5'
        title: Recommendation, diligence asks, and thesis-breakers
        blocks:
          - type: paragraph
            body: >-
              The recommendation from public evidence is research-more rather than buy. Datavant looks strategically
              valuable and operationally real, but the available evidence is still too thin on current economics to
              justify a high-conviction long call at a premium implied valuation. Confidence is medium because many core
              business-quality signals are positive, yet the valuation-sensitive inputs remain private. Risk rating is
              medium-high: not because the market or product thesis looks broken, but because trust, security, services
              mix, and capital opacity can all alter fair value materially.


              The most important diligence asks are straightforward. Investors need current revenue, growth, gross
              margin by stream, direct-vs-channel revenue mix, top-customer and top-partner concentration, NRR/GRR,
              current leverage and liquidity, and post-acquisition integration economics. If those data show a more
              automated, higher-margin, broadly retained business than the public record suggests, the valuation stance
              can move toward fair or even attractive at the right price. If they show a services-heavy, concentrated,
              or security-sensitive business with muted margin expansion, then the 2021 valuation anchor looks expensive
              in hindsight.


              The thesis-break triggers are equally clear: another material trust failure, evidence that security or
              legal issues are hurting customer growth, proof that hybrid operations cap margins, or disclosure showing
              concentration and channel dependence are much higher than expected. Until those questions are answered,
              the disciplined posture is to keep Datavant on a research-more track rather than force a buy decision from
              incomplete evidence.
            claimRefs:
              - CV029
              - CV030
              - CV031
              - CV032
              - CV033
              - CV034
              - CV035
              - CV036
              - CV037
              - CV038
              - CV039
              - CV040
          - type: table
