      - number: '3.5'
        title: Moat durability, multi-homing risk, and where Datavant can still lose
        blocks:
          - type: paragraph
            body: >-
              Datavant’s moat is real but not absolute. The strongest evidence for durability is network reach across
              real-world-data partners, health systems, facilities, and regulated workflows, combined with a
              privacy-preserving matching capability that can work across organizations that do not want to expose PHI.
              That is different from simply owning a large dataset or offering one API. The more counterparties, data
              rights, and workflows that already run through Datavant, the more valuable it can become as a neutral hub.


              But multi-homing risk is high. Buyers can use a data-ecosystem owner for one project, an interoperability
              rail for another, and an incumbent workflow vendor for operational exchange. The market is modular enough
              that Datavant is not automatically the system of record everywhere. Competitive pressure could also
              intensify if proprietary data players continue to expand linkage and interoperability, or if low-friction
              API and workflow vendors commoditize the exchange layer. Even Datavant’s customer wins with AWS, Labcorp,
              and Thermo Fisher indicate that partnerships with powerful platforms are part of the strategy, not
              something the company can ignore.


              The investment implication is that Datavant’s competitive position should be underwritten as durable in
              selected jobs-to-be-done, not as universally unassailable. The company looks strongest when
              privacy-preserving cross-party linkage, workflow reach, and partner neutrality matter at once. It looks
              more vulnerable when a buyer can accept one vendor’s proprietary data estate, when operational exchange
              alone is enough, or when internal build economics appear manageable. That is a solid but conditional moat,
              and it makes execution, partner access, and product breadth central to the thesis.
            claimRefs:
