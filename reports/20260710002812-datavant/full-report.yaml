    Datavant is a private, sponsor-backed healthcare data connectivity company whose current scale comes from combining
    the original 2017 Datavant tokenization business with Ciox Health in 2021. Public evidence supports a strategically
    important network spanning hospitals, payers, life sciences, legal-insurance workflows, and real-world data
    partners, but the company's current financial quality remains under-disclosed relative to its large historical
    valuation anchor.
