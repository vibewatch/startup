  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segmentation and who actually pays
        blocks:
          - type: paragraph
            body: >-
              Datavant’s customer base is clearly multi-segment. Public pages cover commercial pharma, clinical research
              and development, health plans, government programs, providers, legal and insurance requesters, and broader
              research users. That is important because the buyer, user, and payer often differ. In life sciences,
              buyers can be HEOR, clinical development, or commercial analytics leaders while users include data
              managers, epidemiologists, and researchers. In health plans, buyers can be quality or risk-adjustment
              leaders while users include coders, reviewers, and operations teams. In government and nonprofit research,
              buyers may be program leaders or grant-backed investigators, while users include researchers and
              privacy/compliance teams.


              The company’s public segment pages make two things visible. First, Datavant is not dependent on one narrow
              end market. Second, the product often sits in workflows that can become mission critical once adopted:
              chart retrieval for payer submissions, coding accuracy for reimbursement, clinical-trial linkage for
              follow-up evidence, or privacy-preserving linkage for national research programs. This supports the idea
              of strategic rather than purely experimental adoption.


              At the same time, the public record says very little about revenue distribution across these segments. The
              customer base is clearly diversified by workflow, but investors cannot tell which segments dominate
              revenue, expansion, or margin. That means segmentation is easy to observe qualitatively and still hard to
              underwrite quantitatively.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
