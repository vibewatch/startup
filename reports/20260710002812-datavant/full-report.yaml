      - number: '2.3'
        title: Buyer, user, and payer segmentation
        blocks:
          - type: paragraph
            body: >-
              Datavant’s buyer map is unusually diverse. The company’s segment pages and market-education assets show
              distinct demand paths for commercial pharma, clinical R&D, health plans, government programs, and
              providers. In life sciences, Datavant says its customers use linked claims, EHR, lab, and other RWD to
              support HEOR studies, market access, brand analytics, clinical trial follow-up, and trial recruitment.
              Those use cases imply budget owners across clinical development, medical affairs, HEOR, market access, and
              commercial analytics. In payer markets, the health-plan page centers on retrieval, risk adjustment, HEDIS
              / Star reporting, and coding quality, implying budget ownership in quality, risk adjustment, and
              operations. In government and nonprofit research, the emphasis shifts to privacy-preserving linkage,
              IRB-compatible workflows, and evidence-backed research programs.


              The user base is broader than the buyer base. A life-sciences contract may be sponsored by HEOR or
              clinical operations, but the practical users can include epidemiologists, data managers, biostatisticians,
              trial planners, and market-access teams. A payer contract may be signed by operations or quality, but the
              users include coders, reviewers, compliance staff, and provider-facing teams. Provider-side users can
              include HIM, coding, revenue-cycle, and request-fulfillment personnel. This is strategically important
              because a single Datavant deployment can create multiple expansion paths within one account once
              connectivity, retrieval, or coding workflows are embedded.


              The implication is that Datavant is selling into budget lines where ROI often comes from avoided friction
              rather than simple software-seat productivity. Sponsors care about faster data discovery, better
              fit-for-purpose evidence, and fewer protocol amendments. Payers care about retrieval yield, audit
              readiness, and faster coding cycles. Providers care about reducing record-request burden and improving
              reimbursement accuracy. This diversity broadens demand but raises sales complexity: Datavant must prove
              value differently to each segment and often needs compliance and workflow credibility, not just technical
              interoperability claims.
            claimRefs:
