              - CV039
      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Datavant’s valuation problem is mostly an evidence problem
            body: >-
              The company may deserve a premium price, but public evidence is too thin on current revenue quality,
              margins, retention, and concentration to prove it.
            calloutType: insight
            claimRefs:
              - CV004
              - CV013
              - CV027
              - CV031
          - type: callout
            title: The 2021 valuation already looked premium on public revenue alone
            body: >-
              A $7.0 billion transaction against a disclosed revenue floor of more than $700 million implies about a 10x
              multiple, which sits near the high end of comparable public healthcare-data valuations.
            calloutType: risk
            claimRefs:
              - CV008
              - CV009
              - CV024
              - CV025
          - type: callout
            title: Use research-more as the default until private metrics are disclosed
            body: >-
              Without stream-level margins, company-wide retention, concentration, and liquidity data, Datavant should
              be diligenced further rather than treated as an obvious buy.
            calloutType: recommendation
            claimRefs:
