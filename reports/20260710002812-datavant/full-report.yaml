      - number: '7.2'
        title: Regulatory and legal risk
        blocks:
          - type: paragraph
            body: >-
              Regulatory and legal risk is fundamental for Datavant because healthcare data exchange lives inside
              overlapping privacy, security, interoperability, and public-sector control frameworks. HHS privacy and
              security guidance, ONC information-blocking expectations, CMS interoperability policy, and Datavant’s own
              privacy and FedRAMP materials all point to a business environment where compliance is not optional or
              static. Datavant’s privacy writing also shows the company is operating in a world of evolving state
              health-data and AI policy, not only federal HIPAA rules. That raises change-management risk even when the
              company is currently compliant.


              The most concrete legal signal is the 2026 settlement tied to the 2024 breach. Even without full
              court-record detail in the public source set, the settlement and related coverage establish that a major
              privacy/security event can turn into litigation cost and broader trust overhang. The risk is not limited
              to one historical event. Datavant’s value proposition requires customers to trust its de-identification,
              minimum-necessary filtering, retrieval security, and governance posture. If those claims are challenged by
              regulators, courts, or customers, the damage can transmit into delayed procurements, heightened
              contractual demands, or loss of public-sector opportunities.


              At the same time, public evidence also shows mitigation maturity. FedRAMP Moderate authorization, 326
              controls, continuous monitoring, and N3C-related public-sector work suggest Datavant has invested heavily
              in the control environment. The legal/regulatory verdict is therefore not “weak controls,” but
              “high-stakes operating environment where any control failure matters more than average.”
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
      - number: '7.3'
        title: Operational, quality, and security execution risk
        blocks:
          - type: paragraph
            body: >-
              Operational risk at Datavant is not limited to uptime or cloud outages. The company’s engineering blogs
              show that record retrieval at scale depends on heterogeneous EHR APIs, configuration-driven logic,
              prioritization queues, provider-specific variance, and in some cases manual fallback. Public retrieval
              pages also make clear that digital and manual methods coexist. That means Datavant must continually manage
              a hard edge where product automation meets operational fulfillment. Risks include slower turnaround, lower
              yield, manual bottlenecks, data-quality issues, and inconsistent customer experience if a workflow falls
              outside the strongest digital paths.


              Security execution risk is equally important. Datavant’s own FedRAMP materials describe ongoing
              continuous-monitoring burdens, expensive government-grade tooling, and architecture changes required by
              FIPS and control requirements. Those are positive signs of seriousness, but they also show that security
              is costly and operationally intrusive. In other words, the mitigation is itself a permanent operating
              commitment. The company’s product breadth adds another layer of quality risk: coding accuracy, retrieval
              completeness, de-identification quality, and data discovery integrity all have to hold at once. The KLAS
              release and coding materials offer positive signals such as 98% coding accuracy and high customer-service
              marks, but those signals apply to selected workflows rather than the full platform.


              The operational verdict is that Datavant appears competent and mature, but the system it is operating is
              inherently complex. That makes operational slippage a medium-to-high recurring risk even if no single
              failure mode is currently visible in public reporting.
            claimRefs:
              - CR016
              - CR017
              - CR018
              - CR019
              - CR020
              - CR021
              - CR022
          - type: table
            tableRef: TR002
            claimRefs:
              - CR016
              - CR017
              - CR018
              - CR019
              - CR020
              - CR021
              - CR022
      - number: '7.4'
        title: Partner, platform, customer, and people dependency risk
        blocks:
          - type: paragraph
            body: >-
              Datavant is dependent on multiple external systems and stakeholders. Its retrieval stack depends on
              provider APIs and EHR configurations. Its cloud-first discovery products depend on AWS and participating
              data partners. Its public-sector posture depends in part on continuing to satisfy FedRAMP obligations and
              maintain trusted government relationships. Its coding and retrieval workflows likely depend on sustained
              access to experienced domain staff. Public materials also show that the company increasingly works through
              partners such as Labcorp, AWS, and Thermo Fisher / PPD, which can expand distribution but also create
              channel and ownership risk.


              These dependencies do not imply fragility, but they create concentration questions. If a small number of
              large partners or programs drive outsized value, Datavant could face pricing pressure, roadmap
              constraints, or customer-access issues it does not fully control. The same is true for people risk:
              maintaining specialized engineering, privacy, compliance, and operational talent is part of the moat.
              FedRAMP and high-governance workflows, in particular, are not easy to run with generic staff. Datavant’s
              public recruiting and engineering materials imply continued investment here, but private investors still
              need to know how much institutional knowledge sits with a relatively small set of technical or operational
              leaders.


              Dependency risk is therefore a classic hidden multiplier. It can convert a moderate technical or partner
              issue into a larger revenue or customer-retention issue if too much of the system is concentrated in one
              channel, vendor, dataset, or team.
            claimRefs:
              - CR023
              - CR024
              - CR025
              - CR026
              - CR027
              - CR028
