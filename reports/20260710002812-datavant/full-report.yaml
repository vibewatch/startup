      - number: '4.4'
        title: Public traction and capital adequacy
        blocks:
          - type: paragraph
            body: >-
              The disclosed traction signals are substantial even if they are not full financial statements. The merger
              announcement said the combined company would have more than $700 million in revenue. Recent Datavant
              materials say the company enables more than 60 million healthcare records to move between thousands of
              organizations, covers more than 80,000 hospitals and clinics, serves 75% of the 100 largest health
              systems, and connects with more than 350 real-world-data partners. Health-plan materials claim access to
              80,000-plus hospitals and clinics, 20,000-plus digital FHIR connections, 98% annual customer retention,
              and 93% penetration across leading MA, Medicaid, and ACA plans. Commercial-pharma and clinical-research
              materials claim 40-plus life-science customers, more than 100 brands, more than 100 clinical trials, and
              more than 64 million record retrievals annually. These are all meaningful throughput or distribution
              signals.


              Capital adequacy, however, remains opaque. Mercom reported the pre-merger Datavant company had raised more
              than $83 million by the 2020 Series B. The 2021 merger announcement said the $7.0 billion transaction was
              supported by an existing investor group plus significant new investment from Sixth Street and Goldman
              Sachs Asset Management. Those facts demonstrate sponsor access and transaction support, but they do not
              disclose current cash on hand, debt load, monthly burn, covenants, or runway. For a private company that
              has since completed large acquisitions and broadened product scope, those omissions matter. Public
              investors cannot tell whether Datavant is self-funding growth, relying on sponsor support, or absorbing
              substantial integration and restructuring costs.


              The financial takeaway is therefore asymmetric: public sources strongly suggest Datavant is large enough
              to matter and broad enough to support a durable business, but they do not support a clean view on current
              free-cash-flow conversion or financing dependency. Investors should treat capital adequacy as unresolved
              until management discloses updated leverage, liquidity, and post-acquisition integration economics.
            claimRefs:
