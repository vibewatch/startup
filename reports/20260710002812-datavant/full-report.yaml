      - number: '4.2'
        title: Pricing, monetization, and GTM efficiency proxies
        blocks:
          - type: paragraph
            body: >-
              Datavant discloses almost no generalized list pricing, which is typical for enterprise healthcare-data
              vendors but still important. The health-plan page is one of the rare sources with explicit economic
              language: it claims 20% to 40% lower fees than other vendors’ total chart-acquisition costs. That suggests
              at least some of Datavant’s retrieval and coding-related offerings are sold on a hard-dollar ROI basis
              tied to cost-out, turnaround times, or yield. In life sciences and research workflows, however, the
              packaging appears more solution-led: connectivity, linked datasets, cohort discovery, trial support, or
              privacy-preserving collaboration. Those products likely monetize by contract scope, dataset access, usage,
              or a mixture of platform and service components rather than a simple seat-based subscription.


              The GTM implication is that Datavant probably runs several sales motions at once. Health-plan and provider
              workflows can be sold as operational improvement with measurable savings, while life-sciences offerings
              are sold against speed, evidence quality, and research productivity. AWS and Thermo Fisher announcements
              indicate that partner-led distribution and ecosystem co-selling matter in at least some segments.
              Labcorp’s Alzheimer’s platform announcement suggests Datavant can also participate as a connectivity layer
              inside another company’s offering rather than only as the visible prime contractor. This multi-motion GTM
              broadens demand but usually lengthens diligence requirements for investors because sales efficiency,
              payback, and contract quality may differ sharply by segment.


              Publicly, there is not enough information to calculate CAC, payback, or average contract value. The best
              proxies are indirect: the company claims high retention in health plans, broad network access, and
              relevance across large regulated buyers. Those are encouraging demand signals, but they are not
              substitutes for cohort-level commercial data.
