      - number: '1.4'
        title: Ecosystem proof and operating reach
        blocks:
          - type: paragraph
            body: >-
              Datavant's strongest public evidence is not a financial statement; it is repeated ecosystem proof from
              official pages and partner announcements. The core linkage page says Datavant Connect can run on-premise,
              in a customer cloud environment, or through CLI and desktop workflows while producing irreversible tokens
              that allow individual-level matching without sharing raw PII. The same page says the platform supports
              more than 350 real-world data partners and that all top-20 pharma companies partner with Datavant. These
              claims are still company-reported, but they are reinforced by partner releases that use Datavant as
              infrastructure rather than simply as a logo on a slide.


              The 2025 AWS Clean Rooms launch is especially telling. Datavant said four top-20 pharmaceutical companies
              and fifteen leading real-world-data sources helped test the jointly developed solution, and it named the
              data partners. That announcement positioned Datavant not as a single dataset owner but as the
              orchestration layer that helps buyers discover and evaluate fit-for-purpose data without moving underlying
              raw data. Similar logic appears in the 2026 Thermo Fisher collaboration, which extended real-world-data
              interoperability across clinical development, and in Labcorp's April 2026 Alzheimer's platform
              announcement, which said Datavant's privacy-preserving connectivity would help compress research workflows
              from months to minutes.


              Operational proof also shows up outside life sciences. The KLAS award release says Datavant's provider
              coding solutions now handle more than 4.5 million charts annually with 98% coding accuracy. The homepage
              separately highlights 120,000 legal and insurance requesters, and the Ontellus acquisition formalized that
              segment into its own vertical. In other words, Datavant's reach is not only deep in RWD connectivity; it
              spans retrieval, coding, release-of-information, legal-insurance request flows, and payer-provider audit
              workflows. That breadth is a competitive asset, but it also raises integration and execution risk because
              the company must maintain trust across very different buyer groups.
