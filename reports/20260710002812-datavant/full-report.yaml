  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: What Datavant actually delivers in workflow terms
        blocks:
          - type: paragraph
            body: >-
              Datavant’s product is easiest to understand as a workflow stack rather than a single application. Public
              solution pages show at least six recurring modules: health-data retrieval, release of information,
              risk-adjustment / HCC coding, record-request automation, privacy-preserving linkage and privacy hub
              services, plus data discovery / collaboration workflows such as Datavant Connect. These modules are sold
              to different buyer groups but all sit on the same broader mission of securely connecting health data
              across organizations. The company also describes the Datavant Switchboard as the underlying platform for
              both identified and de-identified data, which suggests that several surface-level products reuse a shared
              internal operating model for routing, retrieval, privacy filtering, and delivery.


              This product definition matters because it explains why Datavant can serve providers, health plans,
              government agencies, life-science customers, law firms, and insurance workflows without being “just” an
              interoperability API or “just” a record-retrieval business. Some products are clearly workflow
              applications: coding operations, release of information, request automation. Others are infrastructure or
              platform layers: Switchboard, FHIR Worker, privacy-preserving record linkage, cloud-first data discovery.
              The company’s public materials repeatedly position these products as ways to reduce the friction of
              exchange, improve data yield, and preserve trust under HIPAA and other governance regimes.


              For diligence, the key takeaway is that Datavant’s product breadth is real and not merely marketing
              taxonomy. The breadth creates cross-sell surface and strategic resilience, but it also raises complexity:
              shared platform pieces must support many workflows, data types, and regulatory contexts at once.
            claimRefs:
              - CE001
