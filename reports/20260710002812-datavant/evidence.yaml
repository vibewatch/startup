evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: founding date
    missingEvidence: >-
      Public sources disagree on whether the company should be treated as founded in 2014 or 2017 because the current
      Datavant combines original Datavant and Ciox lineages.
    whyItMatters: >-
      A canonical founding date affects company-age comparisons, management-history framing, and historical productivity
      benchmarks.
    diligencePath: >-
      Request formal corporate history from management or cap-table counsel and reconcile legal-entity timeline in data
      room materials.
    relatedQuestionRefs:
      - QO004
  - type: private-evidence-only
    severity: material
    topic: current financials
    missingEvidence: >-
      No public source provides current ARR, revenue mix, gross margin, or acquisition-integration economics after the
      2021 merger.
    whyItMatters: >-
      Valuation and underwriting depend on current revenue quality, margin profile, and the contribution of acquired
      businesses.
    diligencePath: >-
      Request 2024-2026 audited financials, segment mix, customer concentration, and integration scorecards for Aetion
      and Ontellus.
    relatedQuestionRefs:
      - QO018
      - QO025
  - type: private-evidence-only
    severity: minor
    topic: ownership percentages
    missingEvidence: >-
      Public materials list major investors but do not disclose current ownership percentages, liquidation preferences,
      or structured-equity terms.
    whyItMatters: Sponsor control, board rights, and preference stack influence exit math and minority-holder alignment.
    diligencePath: Request current capitalization table, merger financing documents, and board observer / governance rights.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: minor
    topic: leadership and founder table coverage
    missingEvidence: >-
      Public sources do not disclose a complete post-merger executive org chart, board roster, or succession planning
      below the CEO level.
    whyItMatters: >-
      The leadership and founder table is intentionally partial and may understate key-person concentration or
      functional depth.
    diligencePath: >-
      Request current executive roster, board composition, and succession planning materials to complete the leadership
      and founder table.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
  - type: stale
    severity: minor
    topic: headcount
    missingEvidence: >-
      The only readily accessible headcount figure in this review came from a low-reputation third-party database rather
      than the company.
    whyItMatters: Headcount is a useful scale and efficiency proxy, especially after multiple acquisitions.
    diligencePath: >-
      Validate current employee count through management materials, payroll systems, or a reputable data provider with
      methodology disclosure.
    relatedQuestionRefs:
      - QO019
  - type: enumeration-incomplete
    severity: minor
    topic: milestone table coverage
    missingEvidence: >-
      Public chronology does not fully disclose private integration milestones, internal reorganizations, or any
      undisclosed financing events between the merger and later acquisitions.
    whyItMatters: >-
      The milestone table is intentionally partial and could miss inflection points that explain current operating
      performance or integration risk.
    diligencePath: >-
      Request board materials and integration updates covering 2021-2026 so the public timeline can be reconciled
      against internal milestones.
    relatedQuestionRefs:
      - QO020
    relatedTableRefs:
      - TO004
  - type: conflicting-data
    severity: material
    topic: market sizing overlap
    missingEvidence: >-
      Public market reports use different category definitions, forecast windows, and assumptions, so there is no clean
      additive TAM/SAM/SOM stack for Datavant.
    whyItMatters: >-
      A single over-broad market number could overstate monetizable opportunity or hide which submarkets actually drive
      Datavant economics.
    diligencePath: >-
      Build a bottoms-up model using customer counts, budget owners, workflow penetration, and average contract values
      by segment.
    relatedQuestionRefs:
      - QM023
      - QM024
  - type: private-evidence-only
    severity: material
    topic: buyer budget distribution
    missingEvidence: >-
      Public materials do not show how Datavant’s current revenue splits across life sciences, payer, provider,
      government, and legal-insurance budgets.
    whyItMatters: >-
      Serviceable obtainable market depends on which buyers are actually monetizing and which use cases remain mainly
      strategic positioning.
    diligencePath: >-
      Request segment revenue mix, pipeline by buyer type, average contract values, and gross-retention / expansion data
      by product line.
    relatedQuestionRefs:
      - QM024
  - type: stale
    severity: minor
    topic: market reports
    missingEvidence: >-
      Third-party market reports are directional and may not be refreshed on the same cadence as Datavant’s current
      product and acquisition scope.
    whyItMatters: >-
      Fast-moving categories such as interoperability and RWE can re-segment quickly as AI and cloud distribution change
      buyer behavior.
    diligencePath: >-
      Refresh with latest paid market research and triangulate against 2026 budget conversations with customers and
      channel partners.
    relatedQuestionRefs:
      - QM023
  - type: private-evidence-only
    severity: material
    topic: win rates and pricing realization
    missingEvidence: >-
      Public sources do not show side-by-side win rates, realized contract values, or discounting patterns versus major
      peers.
    whyItMatters: >-
      Competitive durability depends on whether Datavant wins enough high-value workflows at acceptable pricing, not
      just whether it has a compelling narrative.
    diligencePath: Request battle-card win/loss data, pricing corridors by product, and renewal / expansion data by competitor set.
    relatedQuestionRefs:
      - QP024
  - type: private-evidence-only
    severity: material
    topic: switching costs and retention
    missingEvidence: No cited public source discloses retention, GRR/NRR, or hard migration costs across competitor classes.
    whyItMatters: Without retention and migration data, moat durability can be overstated or understated.
    diligencePath: >-
      Request cohort retention, module attach rates, and displacement case studies versus HealthVerity, Truveta, Redox,
      and internal build.
    relatedQuestionRefs:
      - QP023
      - QP024
  - type: enumeration-incomplete
    severity: minor
    topic: long-tail vendor landscape
    missingEvidence: >-
      The chapter covers major direct and adjacent classes but not every regional HIE, integration engine, or niche
      workflow vendor.
    whyItMatters: Long-tail vendors can still affect pricing pressure or tactical losses in individual workflows.
    diligencePath: >-
      Expand landscape review with additional Rhapsody, Health Gorilla, InterSystems, Innovaccer, Smile Digital Health,
      and payer-specific competitors if the deal advances.
    relatedQuestionRefs:
      - QP001
    relatedTableRefs:
      - TP005
  - type: private-evidence-only
    severity: blocking
    topic: current liquidity and leverage
    missingEvidence: No cited public source discloses Datavant’s current cash balance, debt stack, covenant profile, or runway.
    whyItMatters: Capital adequacy cannot be underwritten without current liquidity and leverage.
    diligencePath: Request latest balance sheet, debt maturity schedule, covenant package, and 12-month liquidity forecast.
    relatedQuestionRefs:
      - QI014
      - QI016
  - type: private-evidence-only
    severity: material
    topic: margin quality by stream
    missingEvidence: >-
      Public sources do not break out revenue mix or gross margin across platform, retrieval, coding, privacy, and
      partner-embedded workflows.
    whyItMatters: Valuation depends on whether the revenue base behaves more like software or services.
    diligencePath: Request product-line P&L, services attachment rates, implementation burden, and contribution margin by stream.
    relatedQuestionRefs:
      - QI009
      - QI018
      - QI020
      - QI019
  - type: private-evidence-only
    severity: material
    topic: sales efficiency
    missingEvidence: >-
      Public evidence does not disclose CAC, payback, quota-carrying rep productivity, or pipeline conversion by
      segment.
    whyItMatters: A multi-motion GTM model can hide very different capital efficiency across product families.
    diligencePath: Request CAC, payback, funnel conversion, and sales productivity by segment and channel.
    relatedQuestionRefs:
      - QI006
      - QI020
  - type: private-evidence-only
    severity: material
    topic: module-level reliability and implementation burden
    missingEvidence: >-
      Public materials do not disclose formal uptime, implementation timelines, or customer-specific integration effort
      by module.
    whyItMatters: Mature architecture can still be expensive or slow to deploy in practice.
    diligencePath: >-
      Request uptime/SLA data, implementation timelines, and staffing requirements for retrieval, coding, privacy hub,
      and Datavant Connect.
    relatedQuestionRefs:
      - QE023
      - QE024
  - type: private-evidence-only
    severity: material
    topic: AI model governance and performance
    missingEvidence: >-
      Public sources describe AI-enabled coding and AI safety participation, but not detailed model governance, error
      rates by task, or override workflows.
    whyItMatters: AI-assisted products can create compliance or quality risk if governance is weak.
    diligencePath: Request model cards, evaluation methodology, override/appeal workflow, and error-rate tracking by use case.
    relatedQuestionRefs:
      - QE019
      - QE024
  - type: private-evidence-only
    severity: minor
    topic: public developer ecosystem
    missingEvidence: >-
      Datavant does not present a broad public developer platform with open repos, package metrics, or public API
      community data.
    whyItMatters: >-
      External developer pull can matter for extensibility and ecosystem adoption, especially as interoperability
      platforms broaden.
    diligencePath: >-
      Ask management for private API usage metrics, partner-developer onboarding data, and roadmap for external
      developer engagement.
    relatedQuestionRefs:
      - QE020
    diligencePathAlt: >-
      If no such surface exists by design, confirm that closed-enterprise implementation is the intended go-to-market
      model.
  - type: private-evidence-only
    severity: material
    topic: company-wide retention and expansion
    missingEvidence: Public sources do not disclose company-wide NRR, GRR, contract length, or expansion by workflow.
    whyItMatters: Customer quality is hard to underwrite without broad durability metrics.
    diligencePath: >-
      Request NRR/GRR by segment, contract terms, and attach-rate data across retrieval, coding, privacy, and discovery
      products.
    relatedQuestionRefs:
      - QU018
      - QU019
      - QU024
  - type: private-evidence-only
    severity: material
    topic: concentration and channel ownership
    missingEvidence: >-
      Public sources do not show whether a few payer, life-science, or partner accounts dominate revenue or whether
      partner-embedded channels weaken direct customer ownership.
    whyItMatters: High concentration or weak ownership can make the customer base look stronger than it is.
    diligencePath: Request top-10 customer share, direct vs partner-embedded revenue mix, and renewal ownership by channel.
    relatedQuestionRefs:
      - QU020
      - QU021
      - QU024
