- id: direct-peers
  title: 'Direct peers: data ecosystems and evidence platforms'
  body: 'The closest direct peers are the companies that already combine large data assets with healthcare-specific identity, analytics, or evidence workflows. HealthVerity positions itself as the healthcare data platform built for breakthroughs and says HealthVerity plus Symphony Health now form one ecosystem connecting pharmacy, medical claims, labs, and EHR. It also emphasizes identity resolution and a marketplace for real-world data. Komodo takes a different angle: it highlights a massive linked-data foundation of more than one trillion records and 330 million de-identified patients, then layers auditable healthcare AI on top. Truveta differentiates on direct health-system sourcing, daily refresh, full traceability to clinical source, and explicit claims of regulatory-grade provenance. These rivals are not just data pipes; they bundle data access, analytics, and narrative around decision support.


    Datavant’s relative position inside this group is distinctive rather than obviously dominant. It markets itself as a privacy-preserving connective layer that can link proprietary and external data and help customers discover fit-for-purpose RWD across a 300-plus partner ecosystem. That can be stronger than a proprietary data owner when the buyer wants neutrality, interoperability across many counterparties, or connectivity into trial, payer, and provider workflows. But it can be weaker when the buyer prefers an integrated data-plus-analytics environment and is willing to adopt one vendor’s ecosystem end to end. Komodo and Truveta, for example, explicitly frame their offerings around complete or traceable data foundations that reduce wrangling for research teams.


    This means Datavant’s direct-competition moat is conditional. It is strongest when the buyer already has proprietary data or needs to connect across organizations without exposing PHI. It is less absolute when the buyer mainly wants immediate analytic answers from one existing data estate. For investors, the important point is that Datavant is competing against both connective layers and destination platforms, which raises the bar on product integration, workflow speed, and proof that privacy-preserving linkage adds measurable value over buying a vertically integrated dataset.'
