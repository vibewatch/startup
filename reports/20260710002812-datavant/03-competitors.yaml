callouts:
- calloutType: strength
  title: Datavant competes best where neutrality matters
  body: The company’s clearest advantage is not owning the biggest single data estate; it is being able to connect multiple holders and users under a privacy-preserving model when no single participant wants to hand over PHI or cede control to one proprietary data owner.
  claimRefs:
  - CP012
  - CP013
  - CP032
- calloutType: risk
  title: The market is modular, so buyers can multi-home
  body: Direct peers, interoperability rails, workflow incumbents, and internal build options all solve part of the same job. That means Datavant can lose to partial substitutes even when no competitor matches the full product story.
  claimRefs:
  - CP004
  - CP016
  - CP020
  - CP033
- calloutType: insight
  title: Trust posture is part of the product
  body: Buyers in healthcare data connectivity often compare lineage, privacy controls, audit readiness, and compliance posture before they compare analytics features or UI. Vendors with strong trust signals can shorten procurement and expand into higher-governance workflows.
  claimRefs:
  - CP026
  - CP027
  - CP028
  - CP029
- calloutType: recommendation
  title: Underwrite Datavant against jobs, not logos
  body: 'Competitive analysis should be segmented by use case: RWE linkage, provider retrieval, payer exchange, and government research. A single competitor ranking hides the fact that Datavant’s best and worst rival sets change meaningfully by workflow.'
