  title: Customer proof is operational, not just logo-based
  body: 'Datavant’s best customer evidence comes from workflows that appear to be in production: Labcorp’s platform, Thermo Fisher’s clinical-development use case, NCATS/N3C infrastructure, health-plan retrieval, and KLAS-coded provider operations.'
  claimRefs:
