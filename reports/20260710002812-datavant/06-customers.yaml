  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: company-wide retention and expansion
    missingEvidence: Public sources do not disclose company-wide NRR, GRR, contract length, or expansion by workflow.
    whyItMatters: Customer quality is hard to underwrite without broad durability metrics.
    diligencePath: Request NRR/GRR by segment, contract terms, and attach-rate data across retrieval, coding, privacy, and discovery products.
    relatedQuestionRefs:
    - QU018
    - QU019
    - QU024
  - type: private-evidence-only
    severity: material
    topic: concentration and channel ownership
    missingEvidence: Public sources do not show whether a few payer, life-science, or partner accounts dominate revenue or whether partner-embedded channels weaken direct customer ownership.
    whyItMatters: High concentration or weak ownership can make the customer base look stronger than it is.
    diligencePath: Request top-10 customer share, direct vs partner-embedded revenue mix, and renewal ownership by channel.
    relatedQuestionRefs:
    - QU020
    - QU021
    - QU024
  - type: enumeration-incomplete
    severity: minor
    topic: named customer proof coverage
    missingEvidence: The named customer proof table captures the strongest public references but not every production deployment.
    whyItMatters: Public references are selective and may not represent the full portfolio.
    diligencePath: Request a logo list labeled by production / pilot / embedded / former customer status.
    relatedQuestionRefs:
    - QU011
    - QU016
    relatedTableRefs:
    - TU003
