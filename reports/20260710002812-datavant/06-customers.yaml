  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Retrieval-to-coding cross-sell
    - Large payer accounts may dominate economics
    - Could improve ACV but also hide concentration
    - Break out revenue by top payer accounts and product attach
  - - Trial linkage to data discovery
    - Life-science budgets may be lumpy or program-specific
    - Expansion may vary by therapy area and study cycle
    - Show cohort expansion by life-science logo
  - - Government linkage + privacy services
    - Public-sector programs can be strategic but budget-specific
    - Large flagship programs may matter disproportionately
    - Disclose public-sector revenue concentration
  - - Partner-embedded platforms
    - Indirect channels can grow reach quickly
    - Datavant may not fully own the end-customer relationship
    - Provide direct vs embedded revenue mix
  - - Provider operations footprint
    - Embedded workflows can drive sticky expansion
    - Services-heavy expansion can cap margin quality
    - Show attach rates and labor leverage by provider segment
  - - Trust-led procurement
    - Security incidents can slow renewals or expansion
    - Customer quality is sensitive to trust posture
    - Provide pipeline or churn impact from breach period
