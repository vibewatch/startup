  - CU021
- calloutType: risk
  title: Durability evidence is still segment-specific
  body: Retention claims are strongest in health plans and retrieval. Public sources do not provide company-wide NRR, GRR, contract length, or concentration data.
  claimRefs:
  - CU023
  - CU024
  - CU027
  - CU028
- calloutType: insight
  title: Partner-embedded distribution expands reach but muddies ownership
  body: Datavant can win inside AWS- or Labcorp-linked platforms, which is strategically attractive, but partner channels can make revenue ownership and customer-stickiness harder to interpret from the outside.
  claimRefs:
  - CU011
  - CU015
  - CU029
  - CU031
- calloutType: recommendation
  title: Ask for customer-quality metrics by workflow
  body: The most important diligence ask is not total customer count; it is renewal, expansion, and concentration by workflow line such as payer retrieval, coding, trials, government, and cloud discovery.
  claimRefs:
  - CU026
  - CU027
  - CU028
  - CU035
