- id: TU006
  title: Customer-risk and procurement-friction table
  columns:
  - Risk
  - Evidence
  - Why it matters
  - Customer impact
  - Diligence ask
  rows:
  - - Breach-related trust overhang
    - 2026 settlement tied to 2024 breach
    - Trust is integral to adoption in healthcare data exchange
    - Could slow procurement or expansion
    - Ask for win/loss and churn impact during breach period
  - - Partner-channel opacity
    - AWS/Labcorp style embedded distribution
    - Can obscure direct ownership of the relationship
    - May weaken direct upsell visibility
    - Break out channel mix and direct-account economics
  - - Uneven named proof
    - Some segments have logos, others mainly metrics
    - Harder to test reference quality in every vertical
    - Could hide weaker niches
    - Request vertical-specific reference calls
  - - Segment-specific retention only
    - Public retention strongest in health plans
    - Durability outside payer workflows is not proven
    - Could overstate company-wide stickiness
    - Provide retention by product line
  - - Production-vs-pilot ambiguity in some programs
    - Not every public relationship shows contract depth
    - Reference quality differs across proof types
    - Could exaggerate maturity of some relationships
    - Label logos by pilot / production / embedded status
  - - Potential concentration in high-value logos
    - Private company with few disclosed account metrics
    - Large accounts can drive outcomes disproportionately
    - Material to renewal risk and valuation
    - Provide top-10 revenue share
  notes: Turns customer-quality uncertainties into specific diligence asks rather than generic caution.
  claimRefs:
  - CU031
  - CU032
  - CU033
  - CU034
  - CU035
