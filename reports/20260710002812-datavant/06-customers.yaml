company:
  name: Datavant
chapter:
  number: 6
  title: Customers
  summary: Datavant shows broad customer and user proof across health plans, providers, life sciences, government research programs, and partner-embedded platforms, but the public record is much stronger on reach and named deployments than on cohort retention, concentration, or company-wide expansion economics. The main customer judgment is that adoption looks real and strategically diversified, yet durability and concentration still require private data.
sections:
- id: segments
  title: Customer segmentation and who actually pays
  body: 'Datavant’s customer base is clearly multi-segment. Public pages cover commercial pharma, clinical research and development, health plans, government programs, providers, legal and insurance requesters, and broader research users. That is important because the buyer, user, and payer often differ. In life sciences, buyers can be HEOR, clinical development, or commercial analytics leaders while users include data managers, epidemiologists, and researchers. In health plans, buyers can be quality or risk-adjustment leaders while users include coders, reviewers, and operations teams. In government and nonprofit research, buyers may be program leaders or grant-backed investigators, while users include researchers and privacy/compliance teams.


    The company’s public segment pages make two things visible. First, Datavant is not dependent on one narrow end market. Second, the product often sits in workflows that can become mission critical once adopted: chart retrieval for payer submissions, coding accuracy for reimbursement, clinical-trial linkage for follow-up evidence, or privacy-preserving linkage for national research programs. This supports the idea of strategic rather than purely experimental adoption.


    At the same time, the public record says very little about revenue distribution across these segments. The customer base is clearly diversified by workflow, but investors cannot tell which segments dominate revenue, expansion, or margin. That means segmentation is easy to observe qualitatively and still hard to underwrite quantitatively.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
  tableRefs:
  - TU001
  figureRefs: []
- id: adoption
  title: Adoption trajectory and breadth of deployment
  body: 'Datavant’s public adoption signals are broad and unusually concrete even when they are not clean financial metrics. The company says it enables more than 60 million healthcare records to move across its ecosystem, reaches more than 80,000 hospitals and clinics, serves 75% of the 100 largest health systems, and works with 350-plus real-world-data partners. Health-plan pages cite access to 80,000-plus hospitals and clinics, 20,000-plus digital FHIR connections, 93% of leading Medicare Advantage, Medicaid, and ACA health plans, and 98% annual retention of health-plan customers. Commercial-pharma and clinical-research pages say Datavant works with 40-plus life-science customers, 100-plus brands, and more than 100 clinical trials.


    These claims do not answer every question about active accounts or net revenue retention, but they do indicate that Datavant’s adoption is beyond pilot scale. Several signals also imply production use rather than branding-only relationships. Datavant’s AWS-backed product was tested with four top-20 pharmaceutical companies and multiple named data partners before general availability. Labcorp’s Alzheimer’s platform uses Datavant’s connectivity layer inside a production research offering. The KLAS press release quotes provider-side customers discussing real-time feedback, staffing help, and coding workflow impact, which is stronger evidence than a logo wall alone.


    The best reading is that Datavant has strong deployment breadth and credible throughput. The main missing denominator is account-level visibility: public sources still do not show how many of these relationships are large recurring contracts, how many are partner-embedded, and how many are smaller or narrower workflow wins.'
  claimRefs:
  - CU007
  - CU008
  - CU009
  - CU010
  - CU011
  - CU012
  - CU013
  - CU014
  tableRefs:
  - TU002
  figureRefs:
  - FU001
- id: proof
  title: Named customer proof and what counts as real production use
  body: 'Named customer proof is strongest where Datavant appears inside an operational or research workflow. Labcorp’s April 2026 launch is strong proof because it explicitly describes a platform developed with AWS and Datavant, anchored in deidentified and privacy-protected data, intended to accelerate Alzheimer’s research and cohort identification. Thermo Fisher’s PPD business is another strong proof point because the public announcement frames the collaboration as advancing real-world-data interoperability across clinical development. Government-sector proof is meaningful as well: Datavant’s own government page describes the company as a key partner in PCORnet, the NIH National COVID Cohort Collaborative, and the All of Us Research Program. The FedRAMP press release adds specific context that Datavant provides privacy-preserving infrastructure for NCATS’ N3C.


    There is also segment-specific proof on the payer and provider side. The KLAS release includes direct customer commentary on coding workflow performance and staffing support, plus external rankings for risk-adjustment and outsourced coding. The health-plan page claims 98% customer retention and broad plan penetration, while retrieval pages cite 97% retention among health-plan requesters and 64 million annual retrievals. Those signals are not perfect named-logo references, but they point to repeat operational use rather than one-off pilots.


    The limitation is that public proof still skews toward successful or strategic references. We do not see failed deployments, contract durations, or explicit renewal cohorts. So the named proof is good enough to establish reality, but not good enough to settle durability questions.'
  claimRefs:
  - CU015
  - CU016
  - CU017
  - CU018
  - CU019
  - CU020
  - CU021
  - CU022
  tableRefs:
  - TU003
  figureRefs: []
- id: durability
  title: Retention, expansion, and concentration
  body: 'The public record provides a few retention clues but not a full durability model. On the positive side, Datavant claims 98% annual retention among health-plan customers and 97% retention among health-plan requesters on retrieval materials. KLAS customer quotes also suggest operational embeddedness: customers describe Datavant as helping with real-time provider feedback, staffing, and workflow streamlining. That kind of language usually indicates more than a lightweight tool relationship. Datavant’s broad partner ecosystem and multiple workflow entry points also suggest land-and-expand potential, because a customer can begin with retrieval, coding, trial linkage, or cloud discovery and later add adjacent modules.


    But concentration and company-wide retention remain opaque. We do not know whether a few payer or life-science relationships account for a large share of revenue, whether partner channels dilute direct customer ownership, or whether one workflow category drives most expansion. Public sources also do not disclose NRR, GRR, contract length, logo churn, or cohort behavior over time. Even the strongest retention claims are segment-specific and company-authored.


    The balanced conclusion is that Datavant looks sticky in at least some workflows, especially payer retrieval/coding and government-grade data linkage. However, there is not enough public evidence to prove that the entire customer base behaves like a best-in-class land-and-expand software cohort.'
  claimRefs:
  - CU023
  - CU024
  - CU025
  - CU026
  - CU027
  - CU028
  tableRefs:
  - TU004
  figureRefs: []
- id: risks
  title: Expansion opportunity versus customer risk
  body: 'Expansion paths at Datavant are visible: a health plan can add coding to retrieval, a pharma customer can add cloud discovery to tokenization or trial follow-up, and a government or nonprofit customer can combine linkage, retrieval, and privacy services. The company’s ecosystem also creates partner-driven reach, which can lower customer-acquisition friction in some workflows. But the same structure creates risks. Partner-embedded offerings can make Datavant strategically important while obscuring direct customer ownership. Broad network and throughput claims can also mask unequal revenue concentration if a smaller set of logos or channels generates most of the economics.


    There is also trust risk. Because Datavant’s value depends on secure, compliant data movement, the 2026 settlement tied to the 2024 breach matters for customer durability even in the absence of public churn data. In highly regulated workflows, security or privacy incidents can slow sales, reduce expansion, or increase procurement friction. The public source set does not show whether that happened, but it is a real customer-risk vector.


    Overall, the customer thesis is solid on adoption proof and strategic relevance, but incomplete on economics. Datavant appears to have real, diversified, production-grade customer relationships. What remains unproven publicly is whether those relationships produce the kind of broad-based recurring expansion and low concentration that would justify maximum confidence in the customer-quality story.'
