- id: comparables
  title: Comparable set and valuation logic
  body: 'Public comparables show how wide the multiple range can be for healthcare-data and workflow businesses. As of July 2026, CompaniesMarketCap lists IQVIA at about $34.9 billion market cap, Veeva at about $30.8 billion, Health Catalyst at about $0.16 billion, and Phreesia at about $0.66 billion. Public revenue sources show Veeva generated about $2.747 billion in annual revenue for 2025, Phreesia about $420 million for 2025, Health Catalyst about $311.1 million for 2025, and IQVIA’s Research & Development Solutions segment alone about $8.527 billion for 2024. These are not perfect apples-to-apples comps, but they are useful boundary markers.


    Using simple market-cap-to-revenue heuristics, the public comp set spans roughly 0.5x for Health Catalyst, about 1.6x for Phreesia, about 4.1x for IQVIA using the R&D Solutions segment anchor, and about 11.2x for Veeva. Datavant’s 2021 headline of $7.0 billion against a disclosed revenue floor above $700 million implies roughly 10x — much closer to Veeva’s premium software multiple than to hybrid or services-heavy peers. That is the single most important valuation warning in the entire chapter. Publicly, Datavant has not yet earned the right to be assumed Veeva-like in economics simply because it is strategically impressive.


    The right comp logic is therefore not “Datavant is worth what the last sponsor-backed mark said.” It is “Datavant needs to prove why a premium multiple is still justified relative to better-disclosed public peers.” Without product-line margins, current growth, and retention data, the fair stance is stretched-to-fair depending on private evidence, not obviously attractive.'
  claimRefs:
  - CV022
  - CV023
  - CV024
  - CV025
  - CV026
  - CV027
  - CV028
  tableRefs:
  - TV004
  - TV005
  figureRefs: []
- id: recommendation
  title: Recommendation, diligence asks, and thesis-breakers
  body: 'The recommendation from public evidence is research-more rather than buy. Datavant looks strategically valuable and operationally real, but the available evidence is still too thin on current economics to justify a high-conviction long call at a premium implied valuation. Confidence is medium because many core business-quality signals are positive, yet the valuation-sensitive inputs remain private. Risk rating is medium-high: not because the market or product thesis looks broken, but because trust, security, services mix, and capital opacity can all alter fair value materially.


    The most important diligence asks are straightforward. Investors need current revenue, growth, gross margin by stream, direct-vs-channel revenue mix, top-customer and top-partner concentration, NRR/GRR, current leverage and liquidity, and post-acquisition integration economics. If those data show a more automated, higher-margin, broadly retained business than the public record suggests, the valuation stance can move toward fair or even attractive at the right price. If they show a services-heavy, concentrated, or security-sensitive business with muted margin expansion, then the 2021 valuation anchor looks expensive in hindsight.


    The thesis-break triggers are equally clear: another material trust failure, evidence that security or legal issues are hurting customer growth, proof that hybrid operations cap margins, or disclosure showing concentration and channel dependence are much higher than expected. Until those questions are answered, the disciplined posture is to keep Datavant on a research-more track rather than force a buy decision from incomplete evidence.'
