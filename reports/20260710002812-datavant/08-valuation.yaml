    - Mixed workflow mix, services exposure, limited margin visibility
    - Product-line margins and automation evidence show software-like economics
  - - Trust investments are a moat
    - FedRAMP, privacy workflows, government and KLAS proof
    - Another trust failure or evidence controls are not effective in production
  - - Public opacity is the main blocker
    - Missing current revenue, margin, concentration, liquidity data
    - A credible KPI package can move recommendation toward buy or track
