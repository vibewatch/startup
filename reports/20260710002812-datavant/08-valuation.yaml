company:
  name: Datavant
chapter:
  number: 8
  title: Valuation
  summary: Datavant is clearly a strategically important healthcare-data infrastructure asset, but the public evidence does not support underwriting the company at maximum-confidence software multiples without much more detail on revenue mix, margins, retention, concentration, and capital adequacy. Using the clearest public anchor — the 2021 $7.0 billion transaction value against more than $700 million of combined revenue — the historical headline already implied a rich revenue multiple for a business whose current quality metrics remain under-disclosed, so the valuation call is research-more with a stretched-to-fair range depending on private diligence outcomes.
sections:
- id: thesis
  title: Investment thesis and anti-thesis
  body: 'The core long thesis is easy to understand. Datavant sits at an important intersection of healthcare interoperability, privacy-preserving linkage, retrieval workflow, and evidence-generation infrastructure. Public evidence shows broad network reach, meaningful operational throughput, strong relevance across payers, providers, life sciences, and public-sector research, plus unusually substantive security and engineering signals for a private company. It is not a concept-stage story. It appears to be a scaled infrastructure business that solves real problems in high-value, regulated workflows.


    The anti-thesis is just as important. Datavant is private and hybrid. Its public narrative is stronger on strategic relevance than on economic quality. Investors still cannot see current revenue mix, gross margin by product, direct-vs-channel ownership, customer concentration, or current liquidity. The company’s 2021 $7.0 billion transaction already implied a premium valuation on a disclosed revenue floor of more than $700 million, and that multiple may only be justified if today’s business looks much more software-like, durable, and margin-expansive than the public record proves. The 2026 settlement tied to the 2024 breach also shows that trust failures can become real financial and customer risks, not just abstract governance concerns.


    This means Datavant is a compelling company-quality story but a price-sensitive investment story. The right call from public evidence is not to dismiss the business. It is to insist on tighter evidence before treating the asset like a high-confidence buy at a premium multiple.'
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  - CV005
