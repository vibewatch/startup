  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - Network effects deepen, software-like mix rises, retention and margins are strong
    - Premium multiple closer to high-quality healthcare software peers could remain defensible
    - Need proof that economics approach premium-software quality
    - Possible but unproven
  - - Base
    - Good business with mixed platform/services economics and solid but not elite retention
    - Valuation should sit between premium software and lower services/data peers
    - Margin mix and concentration likely keep multiple below the top end
    - Most plausible from public evidence
  - - Bear
    - Opacity hides lower margins, higher concentration, channel dependence, or trust drag
    - Historical headline multiple looks too rich and downside re-rate is likely
    - Security/trust or operating complexity reduce customer durability
    - Cannot be ruled out from public evidence
  notes: Scenarios are qualitative because current Datavant private metrics are unavailable.
