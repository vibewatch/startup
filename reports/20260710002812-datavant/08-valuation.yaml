- id: financing-context
  title: Financing and valuation context
  body: 'The cleanest public financing anchor remains the June 2021 Datavant-Ciox merger announcement. That release said the transaction was valued at $7.0 billion and that the combined company would have revenue of more than $700 million. On that historical revenue floor alone, the implied revenue multiple was roughly 10x. That is a high multiple for a business that included both connectivity technology and operational clinical data-exchange / retrieval infrastructure. The company also had backing from a broad investor group and significant new investment from Sixth Street and Goldman Sachs Asset Management, while Mercom reported that the original Datavant startup had raised more than $83 million by the 2020 Series B.


    Those facts support two conclusions. First, sophisticated investors have been willing to underwrite Datavant as a large, strategic asset for years. Second, the public record does not tell us what multiple today’s buyer would actually be underwriting because current revenue, margin, and capital structure are not public. Since 2021, Datavant has broadened products, expanded cloud-first data discovery, and deepened customer proof. That could justify continued strength. But absent updated financial disclosure, it could also mean investors are extrapolating too generously from old headline values. The company’s size and strategic role do not automatically mean the current price is attractive.


    So the financing context is supportive, but stale. The main valuation question is not whether Datavant can command a large price in principle. It is whether the quality and growth of the present business justify a premium multiple relative to public peers with much better disclosure.'
  claimRefs:
  - CV008
  - CV009
  - CV010
  - CV011
  - CV012
  - CV013
  - CV014
