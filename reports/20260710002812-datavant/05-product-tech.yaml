callouts:
- calloutType: strength
  title: Switchboard architecture is a real product moat
  body: Datavant’s public engineering materials show a concrete retrieval architecture with prioritized queues, flexible resource definitions, and first-party EHR connectivity. That is stronger evidence than generic interoperability marketing copy.
  claimRefs:
  - CE007
  - CE010
  - CE011
  - CE012
  - CE013
- calloutType: risk
  title: Technical variance is an ongoing tax on the platform
  body: Datavant’s own technical documentation makes clear that FHIR variance, proprietary formats, and mixed manual/digital workflows are permanent complexity sources, not solved problems.
  claimRefs:
  - CE009
  - CE015
  - CE016
  - CE017
- calloutType: insight
  title: Compliance investments reshape the architecture
  body: FedRAMP did not just add paperwork. Datavant describes concrete infrastructure changes, higher SaaS-tooling cost, vulnerability-scanning obligations, and logging architecture upgrades driven by the authorization process.
  claimRefs:
  - CE030
  - CE031
  - CE032
  - CE035
- calloutType: recommendation
  title: Diligence should separate mature operational modules from newer AI/cloud layers
  body: Retrieval and coding appear production-tested; cloud discovery, AI-enabled features, and standards-setting efforts look promising but should be diligence-scoped for reliability, monetization, and implementation burden separately.
