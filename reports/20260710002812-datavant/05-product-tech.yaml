- id: trust
  title: Trust, safety, security, privacy, and quality controls
  body: 'Trust controls are a major part of Datavant’s product, not an afterthought. Public security and FedRAMP materials show that the company moved from a SOC 2-style control set to FedRAMP Moderate with 326 controls, a 450-page security plan, continuous vulnerability management, and explicit use of government-grade tooling such as Datadog for Government and FIPS-compatible AWS configurations. The company says it did not separate commercial from federal deployments, meaning those security improvements also affect commercial customers. It also notes real engineering consequences from those controls, such as renaming S3 buckets to comply with FIPS endpoint and TLS-certificate constraints. Those are unusually concrete signals that the compliance story is tied to actual platform design.


    Datavant’s privacy controls are also productized. Privacy Hub materials emphasize disclosure-risk assessment, de-identification, and maximization of analytical utility while meeting HIPAA requirements. The FHIR Worker article explains that the platform filters retrieved information to enforce minimum-necessary logic. Government materials say the platform is FedRAMP authorized and SOC II certified while supporting IRB requirements. KLAS materials add quality signals on the coding side, including 98% coding accuracy and customer feedback around audit-defensible operations. The AIUC consortium announcement suggests Datavant is also trying to shape external standards around agentic AI safety, security, and reliability.


    The technology-risk takeaway is favorable but not perfect. Datavant appears to have stronger-than-average security and compliance maturity for a private healthcare-data vendor, yet that maturity also increases operating complexity and cost. The company’s trust posture is therefore a defensible differentiator, but also a dependency: if security or privacy execution weakens, the product story weakens with it.'
