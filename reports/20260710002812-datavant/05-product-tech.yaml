  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: module-level reliability and implementation burden
    missingEvidence: Public materials do not disclose formal uptime, implementation timelines, or customer-specific integration effort by module.
    whyItMatters: Mature architecture can still be expensive or slow to deploy in practice.
    diligencePath: Request uptime/SLA data, implementation timelines, and staffing requirements for retrieval, coding, privacy hub, and Datavant Connect.
    relatedQuestionRefs:
    - QE023
    - QE024
  - type: private-evidence-only
    severity: material
    topic: AI model governance and performance
    missingEvidence: Public sources describe AI-enabled coding and AI safety participation, but not detailed model governance, error rates by task, or override workflows.
    whyItMatters: AI-assisted products can create compliance or quality risk if governance is weak.
    diligencePath: Request model cards, evaluation methodology, override/appeal workflow, and error-rate tracking by use case.
    relatedQuestionRefs:
    - QE019
    - QE024
  - type: private-evidence-only
    severity: minor
    topic: public developer ecosystem
    missingEvidence: Datavant does not present a broad public developer platform with open repos, package metrics, or public API community data.
    whyItMatters: External developer pull can matter for extensibility and ecosystem adoption, especially as interoperability platforms broaden.
    diligencePath: Ask management for private API usage metrics, partner-developer onboarding data, and roadmap for external developer engagement.
    relatedQuestionRefs:
    - QE020
    diligencePathAlt: If no such surface exists by design, confirm that closed-enterprise implementation is the intended go-to-market model.
