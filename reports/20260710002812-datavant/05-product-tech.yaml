- id: deployment
  title: Deployment, integration, and product maturity
  body: 'Deployment at Datavant is constrained by real-world data fragmentation. The company’s engineering materials repeatedly note that one API connection into an EHR provider does not expose all available patient data, that different health systems configure FHIR resources differently, and that some data remains available only in proprietary formats. As a result, Datavant has had to build not just connectors, but a flexible operating model that can summarize requested information across different use cases, data models, and provider-specific configurations. The company’s health-data retrieval and record-request-automation materials also show that manual and digital retrieval coexist; Datavant’s network can accelerate digital access, but retrieval experts still manually obtain records outside the network.


    Public product evidence suggests several modules are mature. Retrieval workflows cite over 80,000 hospitals and clinics, over 45 years of retrieval experience, 64 million-plus annual retrievals, and 97% retention among health-plan requesters. Coding products cite KLAS leadership, 4.5 million charts coded annually, and 98% coding accuracy. Datavant Connect powered by AWS is framed as generally available after testing with top pharmaceutical companies and data partners. FedRAMP authorization also indicates a deployment posture mature enough to serve federal agencies and secure government-linked research infrastructure. At the same time, the public materials also describe current platform work such as faster API retrieval, expanding cloud-first data discovery, and evolving AI-enabled coding, which means the product is both mature in operations and still actively evolving in architecture.


    The practical implication is that Datavant is not a pre-product or single-feature company. It is already operating at meaningful production scale. But maturity is uneven across modules: retrieval and coding look operationally seasoned, while AI, cloud discovery, and some government-grade capabilities appear to be in active expansion.'
