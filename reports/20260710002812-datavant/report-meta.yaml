companyProfile:
  summary: Datavant is a private, sponsor-backed healthcare data connectivity company whose current scale comes from combining the original 2017 Datavant tokenization business with Ciox Health in 2021. Public evidence supports a strategically important network spanning hospitals, payers, life sciences, legal-insurance workflows, and real-world data partners, but the company's current financial quality remains under-disclosed relative to its large historical valuation anchor.
  foundedDate: '2017-01-01'
  founders:
    - name: Travis May
      role: Founder and former CEO of original Datavant
      background: Public sources identify Travis May as the founder and CEO of the original Datavant prior to the 2021 merger-built platform.
      claimRefs: [CO042]
  foundingLocation: San Francisco, CA, USA
  headquarters: New York, NY, USA
  productSummary: Privacy-preserving tokenization, linkage, retrieval, release-of-information, and data collaboration workflows that let healthcare organizations connect and use data without broadly exposing PHI.
  customerFocus: Providers, payers, life sciences companies, government programs, legal-insurance requesters, and real-world data partners.
  businessModel: Hybrid software-plus-services model monetizing data connectivity, tokenization/linkage, retrieval/release workflows, and adjacent data-access products.
  stage: Private / sponsor-backed
  fundingStatus: The clearest public capital anchors are the original startup's disclosed US$83 million raised by the 2020 Series B and the US$7.0 billion 2021 Datavant-Ciox merger value with new investment from major financial backers.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO005, CO008, CO010, CO016, CO022, CO024, CO025, CO028]
