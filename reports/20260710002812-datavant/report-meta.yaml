  topStrengths:
    - Datavant has unusually strong strategic relevance and network reach across hospitals, payers, life sciences, and real-world data workflows.
    - The company pairs privacy-preserving linkage technology with operational data-access infrastructure, making it harder to replace than a narrow point solution.
    - The 2021 merger and continued product expansion show sustained willingness from sophisticated capital providers to back the platform at scale.
  topRisks:
    - Current revenue mix, margins, retention, concentration, and liquidity remain under-disclosed relative to the premium historical valuation anchor.
    - Hybrid software-plus-services delivery may constrain margins and make headline software-style comp multiples too generous.
    - Security, legal, and trust failures can create direct financial damage and slow customer adoption in regulated healthcare workflows.
  unresolvedGaps:
    - Current revenue, growth, and gross margin by product line.
    - NRR, GRR, top-customer concentration, and partner/channel concentration.
    - Current leverage, liquidity, and post-acquisition integration economics.
    - Evidence on how much of the platform is software-like versus labor-heavy services delivery.
disclaimer: This report is a public-information diligence snapshot prepared as of 2026-07-10. It is not investment advice. Several underwriting-critical inputs remain undisclosed by Datavant, especially current financial performance, concentration, retention, liquidity, and cap-table detail, so any investment decision should be conditioned on direct management diligence and private data-room review.
