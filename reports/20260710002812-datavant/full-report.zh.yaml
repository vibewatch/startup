      - number: '3.3'
        title: 相邻玩家、既有厂商与内部自建替代
        blocks:
          - type: paragraph
            body: >-
              除了直接数据生态同行，Datavant 还面对一大批能解决相邻工作的互操作和流程供应商。Redox 把自己定位为规模化智能医疗健康数据交换的互操作合作伙伴，并披露 20 billion
              多笔医疗健康交易、12,200 多个已连接组织、14,900 多个上线集成、100 多个 EHR 连接和 99.95% 可用性等广泛规模指标。相比之下，1upHealth 更明确面向支付方和 FHIR，强调
              CMS 要求、技术中立架构，以及面向健康计划的可扩展数据交换。Zus 把单一可共享患者画像和用药 / 事件提醒打包进照护交付流程。Veradigm 则带来既有流程版图，横跨
              EHR、电子处方、病历检索、支付方路径清算通道、收入周期服务和编码服务。

              这些相邻玩家重要，是因为许多客户并不购买单一“数据连接平台”。他们买的是能移除约束瓶颈的最窄工具。医疗服务方组织可能优先考虑文档交换或检索速度。数字健康开发者可能想要 API 层或聚合患者画像。支付方可能需要符合
              CMS 的 FHIR 交换。健康科技供应商可能购买 Redox，以便快速触达交易伙伴。在这些语境里，Datavant 不总是摩擦最低的起点，尤其当客户还没相信自己需要一个更宽的隐私保护型网络时。

              内部自建是另一个真实替代。一些客户可以把云数据工程、直接来源合同、FHIR API
              和流程软件组合起来，做出可接受的内部解决方案。这条路更慢、风险更高，但对那些已经控制数据、拥有强安全团队且想避免平台依赖的大企业来说，可能仍有吸引力。因此，Datavant
              的销售动作必须证明，网络覆盖、合规、治理和流程深度足以缩短价值实现时间，从而同时赢过单点供应商和内部自建路径。
