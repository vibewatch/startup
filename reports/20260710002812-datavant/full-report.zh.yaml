      - number: '1.4'
        title: 生态证明与运营覆盖
        blocks:
          - type: paragraph
            body: >-
              Datavant 最强的公开证据不是财务报表，而是来自官方页面和合作伙伴公告的反复生态证明。核心链接页面称 Datavant Connect 可以在本地、客户云环境、CLI
              和桌面流程中运行，并生成不可逆令牌，在不共享原始 PII 的情况下完成个人级匹配。同一页面称平台支持 350 多个真实世界数据合作伙伴，且所有前 20 大药企都与 Datavant
              合作。这些仍是公司自报主张，但合作伙伴公告把 Datavant 当作基础设施，而不是幻灯片上的标识，从而提供了强化。

              2025 年 AWS Clean Rooms 发布尤其有说明力。Datavant 称，4 家前 20 大药企和 15 个领先真实世界数据来源参与测试共同开发的解决方案，并点名了数据合作伙伴。该公告把
              Datavant 定位为编排层，帮助买方发现并评估适配目的的数据，而不是移动底层原始数据；它不是单一数据集所有者。2026 年 Thermo Fisher
              合作延续了同样逻辑，把真实世界数据互操作延伸到临床开发；Labcorp 2026 年 4 月的阿尔茨海默病平台公告也称，Datavant 的隐私保护型连接能力将帮助把研究流程从数月压缩到数分钟。

              运营证明也出现在生命科学之外。KLAS 获奖公告称，Datavant 的医疗服务方编码解决方案现在每年处理超过 4.5 million 份病历图表，编码准确率 98%。官网另行强调 120,000
              个法律和保险请求方，Ontellus 收购也把该细分正式做成独立垂直业务。换句话说，Datavant 的覆盖不只是 RWD
              连接很深；它还横跨检索、编码、信息释放、法律保险请求流，以及支付方和医疗服务方审计流程。这种宽度是竞争资产，但也抬高了整合和执行风险，因为公司必须在非常不同的买方群体之间持续守住信任。
