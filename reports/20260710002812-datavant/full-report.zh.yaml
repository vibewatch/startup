figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: Datavant 公开时间线从 2017 年原始创业公司起步，延伸到 2021 年与 Ciox 合并、2024 年 CEO 交接、2025 年收购，以及 2026 年合作伙伴发布；同时还挂着一个重大的法律包袱。
    data:
      items:
        - date: '2017'
          label: 原 Datavant 启动
          detail: Roivant 支持的初创公司，聚焦隐私保护型健康数据链接。
          tone: positive
        - date: 2019-02
          label: 补强商业和财务高管
          detail: Steven Swank 出任 CRO，Nick Colburn 出任 CFO。
          tone: positive
        - date: 2020-02
          label: 扩充隐私和安全领导层
          detail: Datavant 扩展合规能力时，引入 Aden Fine 和 Dongting Yu。
          tone: positive
        - date: 2020-10
          label: 完成 B 轮融资
          detail: $40M 融资使原公司累计融资达到 $83M。
          tone: positive
        - date: 2021-06
          label: 宣布与 Ciox 合并
          detail: 公告时，合并后实体估值 $7.0B，收入 >$700M。
          tone: positive
        - date: 2024-05
          label: Kyle Armbrester 出任 CEO
          detail: 领导层从合并期运营者切换到平台扩张型运营者。
          tone: neutral
        - date: 2025-07
          label: 收购 Aetion
          detail: 真实世界证据平台并入生命科学业务。
          tone: positive
        - date: 2025-08
          label: 收购 Ontellus
          detail: 正式加入法律和保险垂直领域。
          tone: positive
        - date: 2025-11
          label: AWS Clean Rooms 合作全面推出
          detail: 云优先健康数据发现能力正式开放。
          tone: positive
        - date: 2026-04
          label: Labcorp 阿尔茨海默平台上线
          detail: Datavant 连通能力支撑 AI 辅助 RWD 研究工作流。
          tone: positive
        - date: 2026-05
          label: 泄露和解披露
          detail: 2024 年钓鱼相关事件后，$900k 和解金额公开。
          tone: warning
    approximationNotes: 日期取自公开公告日期或明确发表时间戳。2017 年创业日期指原 Datavant，后续里程碑描述当前合并后的公司。
    claimRefs:
      - CO014
      - CO015
      - CO022
      - CO024
      - CO025
      - CO029
      - CO030
      - CO032
      - CO036
      - CO042
  - id: FO002
    title: 公司快照逻辑
    type: flow
    layout: standard
    summary: Datavant 当前业务逻辑从隐私保护链接和调取基础设施出发，延伸成覆盖医疗服务提供方、支付方、生命科学以及法律保险工作流的多边网络。
    data:
      nodes:
        - id: privacy
          label: 隐私保护型令牌化和授权控制
          detail: 不可逆令牌、合规工作流和安全投入构成信任层。
          tone: positive
        - id: network
          label: 全国规模数据网络
          detail: 80K+ 医院 / 诊所、75%+ 顶级医疗系统、350+ RWD 合作伙伴以及支付方覆盖。
          tone: positive
        - id: solutions
          label: 运营解决方案层
          detail: 链接、调取、编码、信息披露、法律保险和 AI 辅助工作流。
          tone: positive
        - id: partners
          label: 生态和合作伙伴分发
          detail: AWS、Thermo Fisher/PPD、Labcorp 和具名数据合作伙伴扩大触达。
          tone: positive
