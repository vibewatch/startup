  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与真正付费方
        blocks:
          - type: paragraph
            body: >-
              Datavant
              的客户群显然跨多个细分市场。公开页面覆盖商业制药、临床研究与开发、健康计划、政府项目、医疗服务方、法律和保险请求方，以及更广泛的研究用户。这一点重要，因为买方、用户和付款方经常不同。在生命科学中，买方可能是
              HEOR、临床开发或商业分析负责人，用户则包括数据经理、流行病学家和研究人员。在健康计划中，买方可能是质量或风险调整负责人，用户包括编码员、审核员和运营团队。在政府和非营利研究中，买方可能是项目负责人或有
              grant 支持的研究者，用户则包括研究人员和隐私 / 合规团队。


              公司的公开细分市场页面让两件事变得可见。第一，Datavant
              不依赖某个狭窄终端市场。第二，产品一旦被采用，往往会嵌入可能变得任务关键的工作流：用于支付方提交的病历检索、用于报销的编码准确性、用于后续证据的临床试验连接，或用于国家研究项目的隐私保护连接。这支持了战略性采用而不只是实验性采用的判断。


              同时，公开记录几乎没有说明这些细分市场的收入分布。客户群按工作流看明显多元，但投资人无法判断哪些细分市场主导收入、扩张或利润率。也就是说，分层在定性上容易观察，在定量上仍难承保。
