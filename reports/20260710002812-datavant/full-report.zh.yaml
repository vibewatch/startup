      - number: '5.3'
        title: 部署、集成与产品成熟度
        blocks:
          - type: paragraph
            body: >-
              Datavant 的部署受现实世界数据碎片化约束。公司工程材料反复指出，接入某个 EHR 医疗服务方的一条 API 连接，并不能暴露所有可用患者数据；不同医疗系统对 FHIR
              资源的配置方式不同；还有一些数据只存在于专有格式里。因此，Datavant
              不仅要做连接器，还必须搭建一套灵活运营模型，能跨不同用例、数据模型和医疗服务方特定配置汇总请求信息。公司的健康数据检索和病历请求自动化材料也显示，人工检索和数字检索会并存；Datavant
              的网络可以加速数字访问，但检索专家仍会在网络之外手动获取病历。


              公开产品证据显示，多个模块已经成熟。检索工作流提到超过 80,000 家医院和诊所、超过 45 年检索经验、每年 64 million 多次检索，以及健康计划请求方 97% 留存率。编码产品提到 KLAS
              领先地位、每年编码 4.5 million 份病历，以及 98% 编码准确率。由 AWS 支撑的 Datavant Connect，在与头部制药公司和数据合作伙伴测试后，被表述为已普遍可用。FedRAMP
              授权也说明，其部署姿态已经成熟到可以服务联邦机构和安全的政府关联研究基础设施。同时，公开材料也描述了当前平台工作，例如更快的 API 检索、扩展云优先数据发现，以及演进中的 AI
              编码；这意味着产品在运营上已经成熟，架构上仍在积极演进。


              现实含义是，Datavant 不是 pre-product 或单功能公司。它已经在有意义的生产规模上运营。但成熟度在模块之间并不均匀：检索和编码看起来经受过运营考验，而
              AI、云发现和部分政府级能力似乎仍在积极扩张中。
