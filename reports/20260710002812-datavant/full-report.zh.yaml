      - number: '1.3'
        title: 资本基础、估值锚点与里程碑时间线
        blocks:
          - type: paragraph
            body: >-
              公开融资记录更容易支撑原 Datavant 创业公司，而不是当前合并后的平台。Datavant 的 2020 年 Series B 新闻稿称，公司该轮融资 $40 million，累计融资 $83
              million，Transformation Capital 领投，JJDC、Cigna Ventures、Roivant Sciences 和 Flex Capital 参投。Tracxn
              等第三方风险投资数据库也仍把原创业公司描述为 2017 年成立、总部在 San Francisco、处于 Series B 阶段且累计融资 $83 million
              的公司。这是有用的历史底座，但无法反映合并后平台的资本结构。

              决定性的公开估值锚点，是 2021 年 6 月的 Ciox 合并。Datavant 官方公告和多家独立交易报道都把交易价值描述为 $7.0 billion，并称合并后实体收入将超过 $700
              million。交易周边列出的投资方包括 New Mountain Capital、Roivant Sciences、Transformation Capital、Merck Global Health
              Innovation Fund、Labcorp、Cigna Ventures、Johnson & Johnson Innovation–JJDC 和 Flex Capital，并有 Sixth Street 与
              Goldman Sachs Asset Management 的新增投资。这组名字很重要，因为它说明当前 Datavant
              实质上是一条由赞助方支持的整合故事，医疗健康领域的战略资本和金融资本都在背后，而不只是一个风投支持的软件公司。

              合并后的里程碑显示公司继续扩张范围。2025 年 7 月，Datavant 完成对 Aetion 的收购，把真实世界证据分析平台并入生命科学业务。2025 年 8 月，公司完成 Ontellus
              收购，并据此形成专门的法律和保险垂直业务。到 2026 年，Thermo Fisher 和 Labcorp 的合作公告显示，Datavant 从数据链接延伸到 AI
              辅助数据发现和治疗研究流程。里程碑模式很清楚：Datavant 正靠收购和合作伙伴基础设施叠加网络规模，但公开报道仍没有给出足够的当前财务细节，无法测算当下利润率、ARR 结构或整合经济性。
