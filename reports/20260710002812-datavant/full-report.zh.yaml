      - number: '6.5'
        title: 扩张机会与客户风险
        blocks:
          - type: paragraph
            body: >-
              Datavant 的扩张路径是可见的：健康计划可以在检索基础上增加编码，制药客户可以在 tokenization
              或试验随访基础上增加云发现，政府或非营利客户可以组合连接、检索和隐私服务。公司的生态系统也带来合作伙伴驱动的触达，在部分工作流里可以降低获客摩擦。但同一结构也制造风险。嵌入合作伙伴的产品可以让 Datavant
              具有战略重要性，同时模糊直接客户所有权。广泛网络和吞吐量主张也可能掩盖收入集中度不均：少数 logo 或渠道可能贡献大部分经济性。


              还有信任风险。Datavant 的价值依赖安全、合规的数据流动，因此，围绕 2024 年数据泄露达成的 2026
              年和解，即使没有公开流失数据，也会影响客户耐久性。在高度受监管工作流中，安全或隐私事件可能放慢销售、压低扩张，或增加采购摩擦。公开来源没有显示这是否已经发生，但这是一个真实的客户风险向量。


              总体而言，客户论点在采用证明和战略相关性上扎实，但在经济性上不完整。Datavant
              似乎拥有真实、多元、生产级的客户关系。公开层面尚未证明的是，这些关系能否产生广泛的经常性扩张和低集中度，从而支撑对客户质量故事的最高信心。
