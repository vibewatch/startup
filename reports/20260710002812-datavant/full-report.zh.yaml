chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、使命与当前定位
        blocks:
          - type: paragraph
            body: >-
              Datavant
              现在讲的是医疗健康数据协作平台，而不是狭窄单点产品。官网称公司是医疗健康领域可信的数据协作平台，使命是让全球健康数据安全、可访问、可行动。落到运营层面，平台围绕患者级数据的移动与连接展开，连接医疗服务方、支付方、生命科学公司、法律和保险请求方、政府机构以及真实世界数据合作伙伴。当前身份比
              2017 年的原 Datavant 创业公司宽得多：2021 年与 Ciox Health 合并后，公司拿到了更大的检索网络、服务层和更复杂的公司版图。当前官方页面强调可信数据访问、专家治理的 AI
              流程和隐私内建控制，而不只是令牌化软件。

              规模信号很重。Datavant 称其网络每年交换 1,500 TB 数据、令牌化 1 trillion 条记录。公司还称平台覆盖 80,000 多家医院和诊所、美国 100 大医疗系统中超过
              75%、直接或通过客户覆盖 100% 美国支付方，并连接 350 多个真实世界数据合作伙伴。对一家私有公司来说，这些生态主张异常大，也解释了为什么 Thermo Fisher、AWS、Labcorp
              和其他健康数据玩家的合作公告里，Datavant 反复以基础设施身份出现。公司还服务 120,000 个法律和保险请求方，说明当前产品面远不止生命科学数据链接。

              尽调还要把一个身份细节摊开：合并前 Datavant 和现在 Datavant 不是同一规模实体。当前新闻稿材料称公司成立于 2014 年、总部在 New York；更早的 Datavant
              材料和第三方风险投资数据库则称原创业公司成立于 2017 年、总部在 San Francisco。因此，公开记录支持把当前公司视为一个由合并搭建的平台，原创业公司根脉嵌在 2021 年之后更大的运营结构里。
