      - number: '8.5'
        title: 建议、尽调问题与投资逻辑破裂点
        blocks:
          - type: paragraph
            body: >-
              从公开证据得出的建议是继续研究，而不是买入。Datavant 看起来具备战略价值，运营也真实落地，但当前证据对现有
              经济性披露仍太薄，无法在隐含溢价估值上给出高置信度做多判断。置信度为中等，因为很多核心业务质量信号为正； 但对估值最敏感的输入仍是私有信息。风险评级为中高：不是因为市场或产品逻辑已经破裂，而是信任、安全、服务收入
              占比和资本不透明都可能实质改写公允价值。


              最重要的尽调问题很直接。投资人需要当前收入、增长、按收入流拆分的毛利率、直营与渠道收入组合、头部客户和头部
              伙伴集中度、NRR/GRR、当前杠杆和流动性，以及并购后的整合经济性。如果数据表明这家公司比公开记录显示得更自动化、
              利润率更高、留存更广，估值判断可以向合理甚至在合适价格下有吸引力移动。若数据表明业务服务偏重、集中，或安全 敏感且利润率扩张乏力，则 2021 年的估值锚点事后看就偏贵。


              投资逻辑破裂触发点也同样清楚：再次出现重大信任事故；有证据显示安全或法律问题正在伤害客户增长；证据表明混合 运营压住利润率；或披露显示集中度和渠道依赖远高于预期。问题回答之前，纪律性的姿态是让 Datavant
              留在继续研究 轨道上，而不是凭不完整证据强行给出买入决定。
            claimRefs:
