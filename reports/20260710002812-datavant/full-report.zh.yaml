      - number: '7.5'
        title: 财务 / 模型风险、缓释因素与打破 thesis 的触发点
        blocks:
          - type: paragraph
            body: >-
              Datavant 的财务风险，与其说是已证明的困境，不如说是披露不足。公开证据没有显示当前现金、债务、burn 或产品线利润率。这一点重要，因为 Datavant
              同时拥有平台型产品，以及可能重人工的检索、编码和合规工作流；持续的控制与安全投入也可能很贵。私营公司不透明还遮住了集中度、直接收入与渠道收入结构，以及整合收购或合作伙伴牵头产品的经济性。因此，财务 /
              模型风险与执行风险紧密相连，无法完全切开。


              缓释因素有几类：历史资金方支持、广泛细分市场覆盖、强信任投入，以及运营成熟迹象。但缓释不等于问题解决。投资人正确的问题不是 Datavant
              有没有风险——它显然有——而是这些风险是否被主动监控、隔离，并且与价格相匹配。最清晰的 thesis-break
              触发点包括：安全事件重复发生或明显升级，有证据显示信任问题正在拖慢销售或续约，证明公司无法把足够多重工作流产品自动化以保护利润率，或者发现少数渠道或账户主导经济性。


              这让最终风险结论落在中间：Datavant 的风险集合严肃但可理解。它看起来不像脆弱业务，但确实需要比「医疗数据最大网络」这种简单叙事多得多的尽调。
