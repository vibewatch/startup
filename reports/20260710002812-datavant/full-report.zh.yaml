      - number: '8.2'
        title: 融资与估值背景
        blocks:
          - type: paragraph
            body: >-
              公开资料里，最干净的融资锚点仍是 2021 年 6 月 Datavant-Ciox 合并公告。公告称交易估值为 $7.0 billion， 合并后公司收入超过 $700
              million。仅按这个历史收入底线推算，隐含收入倍数约 10x。对一家同时包含连接技术 和运营型临床数据交换 / 调阅基础设施的公司，这个倍数偏高。公司背后还有广泛投资者阵容，Sixth Street 和
              Goldman Sachs Asset Management 注入了大量新资金；Mercom 报道，原 Datavant 创业公司到 2020 年 Series B 时累计融资已超过 $83 million。


              这些事实支撑两个结论。第一，老练投资人多年来愿意把 Datavant 当作大型战略资产来下注。第二，公开记录并不能 说明今天的买方实际在押注什么倍数，因为当前收入、利润率和资本结构都没有公开。2021
              年以后，Datavant 拓宽了 产品，扩展了云优先的数据发现，也加深了客户验证。这可能支撑估值继续强势；但没有更新后的财务披露，也可能
              只是投资人从旧公告估值里外推过头。公司的规模和战略角色，并不自动意味着当前价格有吸引力。


              因此，融资背景是支撑项，但已经过时。核心估值问题不是 Datavant 原则上能不能卖出高价，而是当下业务的质量和 增长，能否相对披露充分得多的上市同业支撑溢价倍数。
            claimRefs:
              - CV008
              - CV009
