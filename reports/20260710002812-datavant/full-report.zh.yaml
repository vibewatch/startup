      - number: '1.5'
        title: 信任事件、法律压力与剩余尽调问题
        blocks:
          - type: paragraph
            body: >-
              信任是 Datavant 投资逻辑的核心，因此负面事件必须正面处理，不能塞进脚注。Datavant 称其每年在安全和合规基础设施上投入超过 $40
              million，并把隐私、合规和授权定位为平台层能力。这些投入在经济上合理：一个移动数千万条记录、服务医院、支付方、监管方和生命科学公司的平台，承受不起反复信任失败。公司也早在当前 AI
              叙事变重之前，就补入资深隐私、法律和安全领导层，说明合规是模型核心，而不是后期补丁。

              即便如此，2024 年数据泄露及和解事件仍是真实尽调项。HIPAA Journal 报道称，公司一个电子邮件账户遭钓鱼攻击，暴露了与 320,702
              人有关的数据；集体诉讼和解网站及和解新闻稿显示，Datavant 同意支付 $900,000 和解金，提供最高 $5,000 的有凭证损失索赔，以及一年身份盗用监测。Datavant
              否认不当行为，但该事件展示了作为全国规模 HIPAA 商业伙伴的非对称下行：一次邮箱账户失陷，就可能引发诉讼、声誉损害，并招来每一个企业买方的追问。

              更大的尽调缺口仍在财务和定义层面，而不是产品市场匹配。公开来源没有给出干净的当前收入运行率、ARR 结构、毛利率或收购整合成绩单。公开记录也仍保留公司成立年份和总部的歧义，因为当前平台混合了旧 Datavant
              和 Ciox 两套身份。写投资备忘录时，正确姿态不是怀疑 Datavant 是否重要——公开证据清楚显示它很重要——而是在缺少收入质量、整合进展、客户集中度和安全事件整改等私有指标时，谨慎测算当前价值创造。
