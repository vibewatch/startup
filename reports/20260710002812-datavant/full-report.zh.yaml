      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              Datavant 的买方地图异常多元。公司的细分页面和市场教育资产显示，商业制药、临床研发、健康计划、政府项目和医疗服务方都有各自的需求路径。在生命科学领域，Datavant
              称客户使用链接后的索赔、EHR、实验室和其他 RWD 来支持 HEOR
              研究、市场准入、品牌分析、临床试验随访和试验招募。这些用例意味着预算所有者横跨临床开发、医学事务、HEOR、市场准入和商业分析。支付方市场里，健康计划页面围绕检索、风险调整、HEDIS / Star
              报告和编码质量展开，暗示预算在质量、风险调整和运营部门。政府和非营利研究中，重点则转向隐私保护型链接、兼容 IRB 的流程和证据支持的研究项目。

              用户群比买方群更宽。生命科学合同可能由 HEOR
              或临床运营赞助，但实际用户会包括流行病学家、数据经理、生物统计师、试验规划人员和市场准入团队。支付方合同可能由运营或质量团队签署，但用户包括编码员、审核员、合规人员和面向医疗服务方的团队。医疗服务方一侧的用户可能包括
              HIM、编码、收入周期和请求履行人员。这一点具有战略意义，因为一旦连接、检索或编码流程嵌入，一个 Datavant 部署就能在同一账户内创造多条扩张路径。

              含义是，Datavant 卖进的是 ROI
              往往来自减少摩擦、而不是简单提升软件席位效率的预算线。申办方在乎更快的数据发现、更适配目的的证据和更少的方案修订。支付方在乎检索产出、审计准备度和更快编码周期。医疗服务方在乎减轻记录请求负担，并提高报销准确性。这种多元性扩大了需求，也抬高了销售复杂度：Datavant
              必须向每个细分证明不同价值，而且往往需要合规和流程可信度，而不只是技术互操作主张。
