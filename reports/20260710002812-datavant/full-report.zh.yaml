      - number: '8.4'
        title: 可比公司组与估值逻辑
        blocks:
          - type: paragraph
            body: >-
              上市可比公司显示，医疗数据和工作流业务的倍数区间可以很宽。截至 2026 年 7 月，CompaniesMarketCap 列示 IQVIA 市值约 $34.9 billion，Veeva 约 $30.8
              billion，Health Catalyst 约 $0.16 billion，Phreesia 约 $0.66 billion。 公开收入来源显示，Veeva 2025 年年收入约 $2.747
              billion，Phreesia 2025 年约 $420 million，Health Catalyst 2025 年约 $311.1 million，IQVIA 的 Research &
              Development Solutions 分部仅 2024 年收入就约 $8.527 billion。 它们并不是完全可比的苹果对苹果样本，但能提供有用边界。


              按简单的市值 / 收入估算法，上市可比组从 Health Catalyst 约 0.5x、Phreesia 约 1.6x，到用 R&D Solutions 分部作锚的 IQVIA 约 4.1x，再到 Veeva
              约 11.2x。Datavant 2021 年 $7.0 billion 的公告估值，对应披露的 $700 million 以上收入底线，隐含约 10x —— 更接近 Veeva
              的高溢价软件倍数，而不是混合型或服务偏重同业。 这是本章最重要的估值警示。Datavant 战略上令人印象深刻，并不等于外部可以直接假设它具备 Veeva 式经济性。


              正确的可比逻辑因此不是「Datavant 就值上一次资方背书的估值标记」，而是「Datavant 需要证明，相对披露更充分的
              上市同业，为什么溢价倍数今天仍然合理」。如果没有按产品线拆分的利润率、当前增长和留存数据，合理立场应是 视私有证据而定的偏贵到合理，而不是显然有吸引力。
            claimRefs:
              - CV022
              - CV023
              - CV024
              - CV025
              - CV026
