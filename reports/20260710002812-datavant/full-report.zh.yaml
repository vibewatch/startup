      - number: '7.2'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              监管和法律风险是 Datavant 的根本问题，因为医疗数据交换处在隐私、安全、互操作性和公共部门控制框架的重叠地带。HHS 隐私和安全指引、ONC 信息阻断预期、CMS 互操作政策，以及 Datavant
              自己的隐私和 FedRAMP 材料，都指向一个合规既非可选、也非静态的经营环境。Datavant 的隐私文章还显示，公司运行在不断演进的州级健康数据和 AI 政策世界里，而不只是联邦 HIPAA
              规则之下。即便公司当前合规，这也会带来变更管理风险。


              最具体的法律信号，是围绕 2024 年数据泄露达成的 2026 年和解。即便公开来源集中没有完整法院记录细节，该和解及相关报道也说明，重大隐私 /
              安全事件可以转化为诉讼成本和更广泛的信任压力。风险并不限于某个历史事件。Datavant
              的价值主张要求客户信任其去标识化、最小必要过滤、检索安全和治理姿态。如果这些主张遭到监管机构、法院或客户挑战，损害可能传导到采购延迟、更高合同要求，或公共部门机会流失。


              同时，公开证据也显示公司具备缓释成熟度。FedRAMP Moderate 授权、326 项控制、持续监控，以及 N3C 相关公共部门工作，说明 Datavant 已大幅投入控制环境。因此，法律 /
              监管结论不是「控制薄弱」，而是「高风险运营环境里，任何控制失败都比平均水平更要命」。
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
