      - number: '2.5'
        title: 市场结构对 Datavant 意味着什么
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，市场结构对 Datavant 有利。公司不是在为全新品类创造需求；它正在受益于几股已经在移动的力量：监管推动数据交换，生命科学申办方需要链接后的
              RWD，支付方需要病历检索和编码准确性，医疗服务方仍被碎片化访问流程困住。Datavant
              的战略优势在于，它能把这些压力转化为统一的基础设施故事。一个从试验令牌化开始的申办方，之后可以购买数据发现；一个从检索开始的支付方，可以扩展到编码；一个政府项目可以同时使用隐私保护型链接、检索和披露风险服务。

              同时，市场不会原谅弱执行。HealthVerity、Komodo、Truveta 和 Veradigm 等竞争者都声称拥有强数据覆盖或分析深度，供应商目录也仍把 Datavant
              放在更广的互操作玩家群里。这意味着 Datavant 的市场位置取决于它能否证明，网络覆盖、隐私基础设施和流程集成带来的结果，好过围绕专有数据集、EHR 原生平台或轻量 API
              连接搭建的替代方案。公司的机会很大，但获胜位置不是“吃下整个市场”，而是“在碎片化病历、隐私和流程复杂性交汇处，做可信连接层”。

              对投资者来说，主要市场结论是 Datavant 参与了几个耐久且扩张中的支出池，并有强监管支撑。待解问题不在于这个市场是否存在，而在于 Datavant
              能把多少份额转化为高质量经常性收入，竞争者改进后网络效应还能守住多少，以及公司能否同时横跨运营检索流程和高级 RWE 用例，而不失焦、不牺牲利润率质量。
            claimRefs:
              - CM006
