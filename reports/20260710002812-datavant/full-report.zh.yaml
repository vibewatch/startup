      - number: '4.4'
        title: 公开牵引力与资本充足性
        blocks:
          - type: paragraph
            body: >-
              已披露的业务进展信号很可观，哪怕它们不是完整财务报表。合并公告称，合并后公司营收将超过 $700 million。Datavant 近期材料称，公司让超过 60 million
              条医疗记录在数千家组织之间流动，覆盖超过 80,000 家医院和诊所，服务 100 大医疗系统中的 75%，并连接超过 350 个真实世界数据合作伙伴。健康计划材料声称可触达 80,000
              多家医院和诊所、20,000 多条数字 FHIR 连接，年度客户留存率为 98%，并渗透领先 MA、Medicaid 和 ACA 计划的 93%。商业制药和临床研究材料声称拥有 40 多家生命科学客户、超过
              100 个品牌、超过 100 项临床试验，并且每年检索超过 64 million 份记录。这些都是有意义的吞吐量或分销信号。


              不过，资本充足性仍然不透明。Mercom 报道称，合并前的 Datavant 到 2020 Series B 时已融资超过 $83 million。2021 年合并公告称，这笔 $7.0 billion
              交易由既有投资人集团支持，并获得 Sixth Street 和 Goldman Sachs Asset Management
              的重大新增投资。这些事实证明公司能获得资金方资源和交易支持，但没有披露当前现金、债务规模、月度消耗、契约限制或
              runway。对一家此后完成大型收购并扩展产品范围的私营公司来说，这些缺口很重要。公开市场投资人无法判断 Datavant 是靠自身现金流支持增长、依赖资金方支持，还是在消化大量整合和重组成本。


              因此，财务结论呈现不对称：公开来源强烈说明 Datavant
              已大到值得关注，也足够宽，能支撑一门有韧性的业务；但这些资料无法支撑对当前自由现金流转化或融资依赖的清晰判断。除非管理层披露更新后的杠杆、流动性和收购后整合经济性，否则投资人应把资本充足性视为未解决问题。
