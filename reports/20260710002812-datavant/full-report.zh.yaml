      - number: '6.3'
        title: 具名客户证明，以及什么算真正生产使用
        blocks:
          - type: paragraph
            body: >-
              具名客户证明最强的地方，是 Datavant 出现在运营或研究工作流之中。Labcorp 2026 年 4 月发布的平台是强证明，因为公告明确说该平台由 AWS 和 Datavant
              共同开发，基于去标识且受隐私保护的数据，目标是加速阿尔茨海默研究和队列识别。Thermo Fisher 的 PPD
              业务是另一个强证明点，因为公开公告把合作描述为推进临床开发中的真实世界数据互操作。政府部门证明也有意义：Datavant 自己的政府页面把公司描述为 PCORnet、NIH National COVID
              Cohort Collaborative 和 All of Us Research Program 的关键合作伙伴。FedRAMP 新闻稿还给出具体背景：Datavant 为 NCATS 的 N3C
              提供隐私保护基础设施。


              支付方和医疗服务方侧也有细分市场证明。KLAS 新闻稿包含客户对编码工作流表现和人员支持的直接评论，以及风险调整和外包编码的外部排名。健康计划页面声称客户留存率为
              98%，并有广泛计划渗透；检索页面则提到健康计划请求方 97% 留存率和每年 64 million 次检索。这些信号不是完美的具名 logo 参考，但指向的是重复运营使用，而不是一次性试点。


              局限在于，公开证明仍偏向成功或战略性引用。我们看不到失败部署、合同期限或明确续约 cohort。因此，具名证明足以确认业务真实存在，但不足以解决耐久性问题。
