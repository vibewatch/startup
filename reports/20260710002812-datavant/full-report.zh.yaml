      - number: '6.4'
        title: 留存、扩张与集中度
        blocks:
          - type: paragraph
            body: >-
              公开记录提供了一些留存线索，但还不是完整耐久性模型。正面来看，Datavant 声称健康计划客户年度留存率为 98%，检索材料中健康计划请求方留存率为 97%。KLAS 客户引语也显示运营嵌入性：客户把
              Datavant 描述为能帮助提供实时医疗服务方反馈、人员支持和工作流简化。这样的语言通常说明关系不只是轻量工具。Datavant
              广泛的合作伙伴生态和多个工作流入口，也说明存在先落地再扩张的潜力，因为客户可以从检索、编码、试验连接或云发现起步，之后再增加相邻模块。


              但集中度和公司整体留存仍然不透明。我们不知道少数支付方或生命科学关系是否贡献了很大收入份额，合作伙伴渠道是否稀释了直接客户所有权，或者某一个工作流品类是否驱动了大部分扩张。公开来源也没有披露
              NRR、GRR、合同期限、logo 流失或随时间变化的 cohort 行为。即便最强的留存主张，也只针对特定细分市场，并且来自公司自己。


              平衡来看，Datavant 在至少部分工作流中显得很黏，尤其是支付方检索 / 编码和政府级数据连接。但公开证据还不足以证明，整个客户群都像一流的 land-and-expand 软件 cohort 那样表现。
