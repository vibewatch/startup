            title: 复杂度既是护城河，也是风险
            body: Datavant 的技术和运营难度是护城河的一部分，但这也意味着小流程失败可能回响到履约、合规和客户体验。
            calloutType: insight
            claimRefs:
              - CR003
              - CR016
              - CR017
              - CR021
          - type: callout
            title: 尽调必须测试运行中的控制，而不是纸面控制
            body: FedRAMP、SOC II 和隐私主张令人鼓舞。投资人仍需要事故历史、整改节奏、backlog 数据，以及不利事件对销售的影响，才能知道这些控制在生产中如何运作。
            calloutType: recommendation
