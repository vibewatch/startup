      - number: '6.2'
        title: 采用轨迹与部署广度
        blocks:
          - type: paragraph
            body: >-
              Datavant 公开披露的采用信号很广，而且在不是干净财务指标的情况下仍然异常具体。公司称，它让超过 60 million 条医疗记录在生态系统中流动，触达超过 80,000 家医院和诊所，服务 100
              大医疗系统中的 75%，并与 350 多个真实世界数据合作伙伴合作。健康计划页面提到可触达 80,000 多家医院和诊所、20,000 多条数字 FHIR 连接，覆盖领先 Medicare
              Advantage、Medicaid 和 ACA 健康计划的 93%，以及健康计划客户 98% 年度留存。商业制药和临床研究页面称，Datavant 服务 40 多家生命科学客户、100 多个品牌和超过 100
              项临床试验。


              这些说法不能回答所有关于活跃账户或净收入留存的问题，但它们说明 Datavant 的采用已经超过试点规模。若干信号也意味着生产使用，而不只是品牌背书关系。Datavant 由 AWS
              支持的产品，在普遍可用前已与四家 top-20 制药公司和多个具名数据合作伙伴测试。Labcorp 的阿尔茨海默平台把 Datavant 的连接层用在生产研究产品里。KLAS
              新闻稿引用医疗服务方客户谈实时反馈、人员支持和编码工作流影响，这比单纯 logo 墙更有证据力。


              最合理的解读是，Datavant 拥有很强的部署广度和可信吞吐量。主要缺失的分母是账户级可见度：公开来源仍没有说明这些关系中有多少是大型经常性合同，有多少嵌入合作伙伴产品，又有多少只是较小或较窄的工作流胜利。
