  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重度排序的风险概览
        blocks:
          - type: paragraph
            body: >-
              Datavant 的风险画像不寻常，因为许多核心风险与核心优势不可分割。多方数据连接、隐私保护连接和工作流覆盖带来差异化，也提高了对数据治理失败、泄露成本、API
              差异、合作伙伴依赖和运营复杂度的暴露。Datavant 不像简单 SaaS 产品，它必须同时在医疗服务方、支付方、生命科学和公共部门用户之间管理安全、合规、数据质量、履约运营和客户信任。


              当前最严重的风险类别是信任和法律暴露。围绕 2024 年数据泄露达成的 2026 年和解显示，安全事件可以变成直接的财务和声誉负债。Datavant
              销售的是敏感数据的可信流动，因此任何隐私或安全弱点都可能传导到销售周期、续约行为，以及监管机构或客户的审查。第二个主要风险桶是执行复杂度：Datavant 自己的工程材料显示，互操作性仍然碎片化，API
              不一致，人工检索仍与数字检索并存。这意味着平台扩张一部分是技术问题，一部分是工作流运营问题。


              第三个主要风险桶是战略不透明。作为一家产品广、经历收购的私营公司，Datavant
              很少披露收入结构、利润率、集中度或资本充足性。这不能证明公司弱，但会让投资人更难判断哪些风险最具经济重要性。因此，本章按风险传导到客户信任、利润率和融资信心的力度排序，而不只按话题性排序。
