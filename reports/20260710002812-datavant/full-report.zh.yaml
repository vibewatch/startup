      - number: '3.4'
        title: 定价透明度、信任姿态与分发力
        blocks:
          - type: paragraph
            body: >-
              定价是这个市场最不透明的部分之一。公开来源显示 Redox 提供定制定价，而多数直接同行强调演示或销售沟通，不给标价。这种公开定价缺失让竞争比较变难，但也说明供应商会围绕数据类型、流程、规模和合规负担定制合同。对
              Datavant 来说，这有两面性。公司可以在高摩擦或高治理用例中按价值定价，但买方也可能因为市场是谈判型而非自助型，拉长多供应商比选。

              信任姿态更可观察。Redox 披露 HITRUST 覆盖和 SOC 2 维护。Truveta 强调来源可追溯、审计准备度和 FDA 对齐的数据质量语言。HealthVerity 突出 HIPAA
              合规身份解析。Datavant 强调 HIPAA 标准、IRB 支持、政府材料中的 FedRAMP
              授权，以及隐私保护型链接。实际情况是，信任在这个市场不是边缘功能；它就是产品的一部分。支付方、医疗服务方和生命科学场景的买方，常常需要先看到供应商能管理隐私、沿袭和访问控制的证据，然后才会关心下游分析。

              分发力同样重要。HealthVerity、Komodo 和 Truveta 等数据生态所有者可以销售大型既有数据基础的便利性。Redox 或 1upHealth
              等互操作轨道可以销售更快接入交易伙伴和标准原生部署。Veradigm 等既有流程供应商可以从现有运营关系中交叉销售。Datavant
              的答案是卖组合：网络之网络、隐私层和流程基础设施，能够横跨多个交易对手。能否获胜，取决于买方多重视中立性和跨机构触达，而不是拥有一套预先集成的技术栈。
