      - number: '3.5'
        title: 护城河耐久性、多归属风险与 Datavant 仍会输在哪里
        blocks:
          - type: paragraph
            body: >-
              Datavant 的护城河真实存在，但并不绝对。耐久性最强的证据，是它横跨真实世界数据合作伙伴、医疗系统、机构和受监管流程的网络覆盖，再加上能在不愿暴露 PHI
              的机构之间运行的隐私保护型匹配能力。这不同于单纯拥有大型数据集或提供一个 API。越多交易对手、数据权利和流程已经通过 Datavant 运行，它作为中立枢纽的价值就越高。

              但多归属风险很高。买方可以一个项目用数据生态所有者，另一个项目用互操作轨道，运营交换再用既有流程供应商。市场足够模块化，Datavant
              不会自动成为所有地方的记录系统。如果专有数据玩家继续扩展链接和互操作，或低摩擦 API 与流程供应商把交换层商品化，竞争压力也可能加剧。即便 Datavant 与 AWS、Labcorp 和 Thermo
              Fisher 的客户胜利，也说明与强平台合作是战略的一部分，而不是公司可以忽略的事情。

              投资含义是，应把 Datavant
              的竞争位置测算为在特定待完成工作中耐久，而不是处处不可攻破。当隐私保护型跨方链接、流程覆盖和合作伙伴中立性同时重要时，公司看起来最强。当买方能接受某一供应商的专有数据资产、只需要运营交换，或内部自建经济性看起来可控时，它更脆弱。这是一条扎实但有条件的护城河，也让执行、合作伙伴访问和产品宽度成为投资逻辑的核心。
