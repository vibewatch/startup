      - number: '2.2'
        title: 规模测算视角：互操作、数据链接与 RWE
        blocks:
          - type: paragraph
            body: >-
              没有一个公开市场估算能干净覆盖 Datavant 的全部机会，因此规模测算必须分视角看。第三方报告显示，全球真实世界证据解决方案市场在 2024 年约为 $4.7 billion，到 2030 年可能以
              14.8% CAGR 增至约 $10.8 billion。更具体的 Future Market Insights 报告把真实世界证据链接服务市场测为 2026 年约 $0.8 billion，到 2036 年以
              16.2% CAGR 增至 $3.6 billion。与此同时，另一份 FMI 报告把医疗健康互操作解决方案市场测为 2026 年 $6.9 billion，到 2036 年以 14.5% CAGR 增至
              $26.6 billion。这些市场和方法不同，但合在一起说明 Datavant 位于几个扩张类别之内，而不是单一静态利基。

              链接服务视角尤其贴近 Datavant，因为它关注身份解析、令牌化和跨来源匹配，而不是原始病历所有权。FMI 称，令牌化在 2026 年占链接服务细分的 39%，索赔数据占数据来源 34%，生物制药占终端用户需求
              43%。这些数字与 Datavant 围绕隐私保护型链接、索赔 / EHR 组合和生命科学证据用例的定位高度一致。更宽的互操作视角也重要，因为 Datavant
              还从医疗服务方检索、支付方病历交换和信息访问流程中获得相关性，而这些都在经典 RWE 之外。

              对投资测算而言，结论不是某一份报告给出了权威 TAM、SAM 和 SOM。相反，公开证据支持一个叠层机会逻辑：Datavant 可以从受监管互操作、证据生成基础设施，以及检索 / 编码 /
              信息释放流程中拉动需求。这给公司带来比纯令牌化供应商更大的收入面，但也意味着它必须在几个相邻子市场持续获胜；这些市场的增长原因不同，采购预算周期也不一样。
