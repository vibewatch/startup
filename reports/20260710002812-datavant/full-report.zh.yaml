      - number: '7.3'
        title: 运营、质量与安全执行风险
        blocks:
          - type: paragraph
            body: >-
              Datavant 的运营风险不限于 uptime 或云宕机。公司工程博客显示，规模化病历检索依赖异构 EHR
              API、配置驱动逻辑、优先级队列、医疗服务方特定差异，并且在一些情况下需要人工兜底。公开检索页面也明确说明，数字和人工方法并存。这意味着 Datavant
              必须持续管理一个硬边界：产品自动化在这里遇到运营履约。若某个工作流落在最强数字路径之外，风险包括周转更慢、产出率更低、人工瓶颈、数据质量问题，以及客户体验不一致。


              安全执行风险同样重要。Datavant 自己的 FedRAMP 材料描述了持续监控负担、昂贵的政府级工具，以及 FIPS
              和控制要求带来的架构调整。这些是认真投入的正面信号，但也说明安全成本高，并且会深度介入运营。换句话说，缓释本身就是一项永久运营承诺。公司的产品宽度又增加了一层质量风险：编码准确性、检索完整性、去标识质量和数据发现完整性都必须同时守住。KLAS
              新闻稿和编码材料给出 98% 编码准确率和高客户服务评分等正面信号，但这些信号只适用于选定工作流，而不是整个平台。


              运营结论是，Datavant 看起来胜任且成熟，但它运行的系统天生复杂。即便公开报道中目前看不到单一失效模式，运营滑坡仍是中到高等级的反复风险。
