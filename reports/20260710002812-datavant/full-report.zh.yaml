      - number: '8.3'
        title: 牛市、基准与熊市情景
        blocks:
          - type: paragraph
            body: >-
              牛市情景假设 Datavant 越来越接近叙事里最好的部分：可信、中立的数据协作层，网络效应强，云优先分发继续扩大， 续约质量高，自动化也足以让利润率结构随时间改善。在这种情况下，2021
              年公告里的倍数未必不合理，尤其是假设 今天业务规模已明显高于披露的 >$700 million 历史收入基数，且软件化的数据发现、关联和合规产品在收入结构中
              占比更高。这个情景最有力的支撑，是公司客户验证范围广、运营触达能力强，并且卡在高价值工作流的生态位上。


              基准情景更保守。它假设 Datavant 是一家很好的公司，但经济性混合：有一部分高溢价、类软件工作流，也有一部分 粘性强却劳动密集的调阅 /
              编码运营；合规和伙伴成本不低，留存质量真实存在但外部看不全。在这个框架下，Datavant 值得高估值，但投资人看到按产品线拆分的利润率和集中度数据之前，不应给到最高 SaaS 倍数。这样看，历史上接近 10x
              收入的锚点更像偏紧而非便宜，即便对出资方来说有战略合理性。


              熊市情景假设，公开不透明掩盖了更弱经济性：综合利润率更低、渠道依赖更大、少数账户或项目集中度高，或安全 / 信任阴影拖慢续约。在这个世界里，Datavant 就不像
              Veeva，而更像服务与软件混合资产，交易倍数应该贴近较低的 上市医疗数据公司。当前公开记录无法排除这一点，因此任何严肃的承销判断都必须保留熊市情景。
            claimRefs:
