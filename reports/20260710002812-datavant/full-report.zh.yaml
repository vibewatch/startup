      - number: '7.4'
        title: 合作伙伴、平台、客户与人员依赖风险
        blocks:
          - type: paragraph
            body: >-
              Datavant 依赖多个外部系统和利益相关方。其检索栈依赖医疗服务方 API 和 EHR 配置。云优先发现产品依赖 AWS 和参与的数据合作伙伴。公共部门姿态部分依赖持续满足 FedRAMP
              义务并维持可信政府关系。编码和检索工作流很可能依赖持续获得有经验的领域员工。公开材料还显示，公司越来越多地通过 Labcorp、AWS 和 Thermo Fisher / PPD
              等合作伙伴开展工作；这能扩大分销，但也带来渠道和所有权风险。


              这些依赖不意味着脆弱，但会制造集中度问题。如果少数大型合作伙伴或项目贡献了超额价值，Datavant 可能面临定价压力、roadmap
              约束，或自己无法完全控制的客户触达问题。人员风险也一样：维持专业工程、隐私、合规和运营人才，是护城河的一部分。尤其是 FedRAMP 和高治理工作流，不容易靠通用员工跑好。Datavant
              的公开招聘和工程材料暗示公司在这里继续投入，但私营市场投资人仍需要知道，有多少机构知识集中在相对少数技术或运营负责人手中。


              因此，依赖风险是典型的隐藏放大器。如果太多系统集中在一个渠道、供应商、数据集或团队里，一个中等技术或合作伙伴问题就可能放大成更大的收入或客户留存问题。
