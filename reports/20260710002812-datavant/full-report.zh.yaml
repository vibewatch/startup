  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：Datavant 究竟在卖什么
        blocks:
          - type: paragraph
            body: >-
              Datavant
              参与的市场，比任何单一标签都宽。公司自己的教育和解决方案页面跨在三个重叠类别上：医疗健康互操作、健康数据流转和真实世界数据连接。互操作指南把市场定义为系统交换患者健康信息，并让用户无需额外费力就能立即使用这些信息的能力。但
              Datavant 的商业角色不止是在系统之间移动消息。公司还围绕检索、信息释放、隐私枢纽服务、编码流程，以及用于研究、支付方分析和临床开发的隐私保护型患者级链接来定位。实际结果是，Datavant
              变现的是一层基础设施：连接碎片化记录、标准化访问，并支持下游证据生成和运营流程。

              因此，正确的市场边界要排除几类东西。Datavant 不只是 EHR
              供应商、普通健康信息交换平台或原始数据经纪商。它不主要销售医院病历系统，也不显得拥有大部分底层医疗服务方数据。相反，它位于健康数据持有者和使用者之间的连接层：医院、健康计划、研究人员、CRO、法律请求方和数据合作伙伴。这个市场还包括围绕获取记录、验证同意和授权、保护隐私，以及把索赔、EHR、实验室、登记库和专科来源中的记录纵向链接起来的流程负担。

              这个更宽的定义很重要，因为它解释了 Datavant 为什么有理由同时竞争几个相邻支出池。医疗服务方可能买 Datavant
              来自动化检索或编码运营；生命科学申办方可能买它来做令牌化、数据发现和试验随访。支付方可能看重同一网络的病历检索和风险调整能力；政府或非营利研究人员则可能看重隐私保护型链接和披露风险支持。因此，这个市场最好理解为多细分的数据连接与证据基础设施市场，而不是单一软件类别。
