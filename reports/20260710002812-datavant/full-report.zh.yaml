      - number: '5.5'
        title: 信任、安全、安保、隐私与质量控制
        blocks:
          - type: paragraph
            body: >-
              信任控制是 Datavant 产品的重要组成部分，不是事后补丁。公开安全和 FedRAMP 材料显示，公司从类似 SOC 2 的控制集，推进到 FedRAMP Moderate：326 项控制、一份 450
              页安全计划、持续漏洞管理，并明确使用 Datadog for Government 和兼容 FIPS 的 AWS
              配置等政府级工具。公司称没有把商业部署和联邦部署分开，这意味着这些安全改进也会影响商业客户。材料还指出这些控制带来的真实工程后果，例如为了满足 FIPS endpoint 和 TLS-certificate
              约束而重命名 S3 bucket。这些信号异常具体，说明合规叙事确实绑定了实际平台设计。


              Datavant 的隐私控制也已经产品化。Privacy Hub 材料强调披露风险评估、去标识化，以及在满足 HIPAA 要求的同时最大化分析效用。FHIR Worker
              文章解释说，平台会过滤检索到的信息，以执行最小必要逻辑。政府材料称，平台获得 FedRAMP 授权和 SOC II 认证，并支持 IRB 要求。KLAS 材料在编码侧增加了质量信号，包括 98%
              编码准确率，以及客户关于可经审计辩护运营的反馈。AIUC 联盟公告说明，Datavant 也在尝试塑造围绕 agentic AI 安全性、信息安全和可靠性的外部标准。


              技术风险结论偏正面，但并不完美。作为一家私营医疗数据供应商，Datavant
              的安全和合规成熟度似乎高于平均水平；但这种成熟度也增加运营复杂度和成本。因此，公司的信任姿态既是可防守的差异化，也是依赖项：如果安全或隐私执行走弱，产品故事也会随之走弱。
