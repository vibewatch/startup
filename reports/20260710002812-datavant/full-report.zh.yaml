      - number: '1.2'
        title: 领导层、治理与所有权
        blocks:
          - type: paragraph
            body: >-
              领导层已从创始人驱动的创业执行，转向 PE 支持的平台规模化。原 Datavant 由 Travis May 创立，2020 年 Series B 公告中他仍被称为创始人兼 CEO。当前 CEO 是 Kyle
              Armbrester，他在 2024 年 5 月从 CVS Health 旗下 Signify Health 加入，之前曾在 athenahealth
              负责产品。围绕他任命的公开表述很有信息量：公告强调互操作、加速产品路线图，以及在健康计划、医疗服务方、EMR
              和生命科学之间搭建纵向患者数据织物。这套语言说明董事会想要的是能运营宽口径数据流转平台的规模化管理者，而不只是 2021 年合并的整合专家。

              辅助领导信号有好有坏，但方向偏正面。早期公告任命 Steven Swank 为 CRO、Nick Colburn 为 CFO，之后又加入 Aden Fine 担任总法律顾问兼首席隐私官，Dongting Yu
              担任安全工程负责人。Datavant 还组建了一批有分量的医疗健康政策和顾问人物，包括前 CMS 首席数据官 Niall Brennan、Harvard/Beth Israel Deaconess 的
              Charles Safran、前 VA 部长 David Shulkin 和前 FDA 局长 Andrew von Eschenbach。这些名字不能替代完整披露的组织架构，但说明 Datavant
              很早就在政策、合规、安全和商业化深度上投入。

              所有权集中。LegalClarity 的 2026 年所有权摘要在交叉引用官方材料后，将 New Mountain Capital 识别为控股方；New Mountain Capital 用 Ciox
              Health 作为 2021 年合并的锚定载体。Roivant 通过原 Datavant 脉络仍是重要少数股东，Sixth Street、Goldman Sachs Asset
              Management、Transformation Capital 以及其他机构投资者也在股权表上。对尽调而言，这意味着治理大概率围绕长期 PE 价值创造和
              M&A，而不是近期公开市场披露。资本配置、管理层招聘和收购胃口也可能高度由董事会驱动。
