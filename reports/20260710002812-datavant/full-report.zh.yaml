      - number: '4.3'
        title: 成本结构及可能驱动毛利的因素
        blocks:
          - type: paragraph
            body: >-
              Datavant 没有公开披露成本结构，但产品组合暗示了多层成本。检索和信息释放运营很可能带来履约人工、合规运营、文档处理和客服开销。编码产品还会增加专业人工和 QA
              成本。隐私和专家判定服务意味着要投入数据科学和合规人员。连接能力和云原生发现产品则增加基础设施和工程成本。这组成本不支持把 Datavant 当成简单的高毛利 API 或数据 SaaS
              供应商。相反，毛利率很可能会随工作流，以及每条产品线中人工服务交付的程度，出现明显差异。


              上市公司可比对象也支持这一判断：医疗数据业务往往混合软件与服务。IQVIA 的 2024 10-K 显示，其 Research & Development Solutions
              分部的大部分收入来自服务合同，并按基于成本的投入法在一段时间内确认，直接人工和第三方成本会影响收入确认。Health Catalyst 的 2025 10-K
              描述的模式则结合了技术、互操作性、分析、专业服务和技术赋能的托管服务。这些公司不是 Datavant，但它们有助于解释：Datavant 公开呈现出的业务宽度，更应被理解为混合经济性模型，而不是纯软件毛利故事。


              最强的财务正面信号是，Datavant
              似乎能围绕同一个底层数据连接问题，在多个工作流层变现。最大的财务风险是，投资人看不到每一层的真实贡献毛利。平台收入叠加重人工工作流的业务可以扩得很好，但也可能藏住低于市场定位口径的综合毛利率、更慢的毛利扩张，或更复杂的营运资本需求。
