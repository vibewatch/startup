      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              最强结构性顺风来自监管、运营和经济层面。Datavant 自己的互操作指南称，HITECH Act 为 EHR 采用投入 $27 billion，21st Century Cures Act 和 ONC
              最终规则则强化了围绕访问和信息阻断的预期。ONC 的 2026 年标准公告称，USCDI 仍是全国互操作交换的基础，USCDI v7 草案新增 30 个拟议或修订元素。同一公告指出，CMS 的事前授权规则和
              TEFCA 要求具备交换 USCDI 数据元素的能力。CMS 又称，其互操作团队正推动 HHS 全系统转向 FHIR API。合在一起，这些信号说明互操作为什么仍是合规驱动市场，而不是可买可不买的添头。

              孤立数据集的局限也在推动需求。Datavant 的真实世界数据指南称，没有单一来源能覆盖完整患者旅程，并解释了为什么许多研究和 HEOR 用例必须链接索赔、EHR、实验室、登记库和其他来源。公司 2026 年
              RWE
              趋势博客认为，链接后的适配目的数据集正在成为决策级证据的标准，可查询数据网络在试验设计上游越来越重要。第三方市场报告强化了同一模式：令牌化、索赔链接和互操作服务之所以增长，是因为机构需要患者的纵向、隐私保护视图，而不是彼此断开的数据切片。

              约束同样真实。Datavant 的教育材料称，医疗健康互操作离应有状态还差很远。MarketsandMarkets 强调碎片化、数据质量问题，以及缺乏普遍接受的 RWE 方法论等挑战。Datavant
              自己的博客强调 AI
              辅助证据生成中的治理、文档和可解释性。直白说：市场很大，但采用取决于信任、流程改变、标准合规，以及证明链接数据适配目的的能力。这对成熟基础设施提供商有利，但也意味着实施摩擦、采购复杂度，以及当数据来源薄弱时监管方、支付方或医疗服务方的怀疑，仍会拖慢增长。
