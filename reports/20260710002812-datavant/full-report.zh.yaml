      - number: '5.2'
        title: 架构与运营模型：Switchboard、FHIR Worker 和可配置检索
        blocks:
          - type: paragraph
            body: >-
              最有实质内容的公开技术细节，来自 Datavant 关于 Switchboard 和 API 检索的工程文章。Datavant 称 Switchboard
              同时支持可识别和去标识数据，并解释可识别数据侧通过三种机制完成病历请求：人工检索、第三方服务，以及直接连到医疗系统 EHR API 的第一方连接。FHIR Worker
              负责通过这些第一方连接完成直接检索，并按请求方指定的版式返回所需数据。公开技术说明还描述了 Worker 如何在 EHR 中识别患者、检索所需资源类型、按 HIPAA 的最小必要原则过滤数据，并适配高度多样的
              FHIR 和非 FHIR 实现。


              Datavant 的技术文章也把内部运营模型讲得异常具体。API 检索重构把系统从推送式调度改成拉取式模型，由 FHIR/EHR worker 从 Redis sorted set
              中拉取已排优先级的请求。Controller 管理请求生命周期，Dispatcher 提交工作，worker 再通过通知队列返回结果。Datavant
              称，重构后的系统能在数分钟内处理旧系统需要数小时的规模化负载；系统也有足够的水平扩展能力，目标是支撑十倍病历量，同时让医疗服务方 API、而不是 Datavant
              自身调度逻辑，成为瓶颈。公司还描述了配置优先的方法，用经 Pydantic 验证的 JSON Resource Definitions，让非工程用户不用工程团队反复新建版本，也能支持新 EHR 和新用例。


              这不能证明可靠性完美，但比泛泛的医疗 IT 营销更有技术含量。它显示 Datavant 针对混乱、异构的 EHR
              环境，已经建出真正的数据平面和工作流编排能力。因此，架构既是差异化来源，也是复杂度和技术债风险来源；如果数据差异或客户特定检索需求继续比自动化扩张得更快，这一风险会放大。
