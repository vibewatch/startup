      - number: '4.2'
        title: 定价、变现与 GTM 效率代理指标
        blocks:
          - type: paragraph
            body: >-
              Datavant 几乎不披露通用价目表；企业级医疗数据供应商大多如此，但这仍然关键。健康计划页面是少数带有明确经济表述的来源之一：Datavant 称，其费用比其他供应商的总病历获取成本低 20% 到
              40%。这说明 Datavant 至少有一部分检索和编码产品，按与降本、周转时间或产出率挂钩的硬 ROI
              销售。不过，在生命科学和研究工作流里，产品包装更像解决方案导向：连接能力、关联数据集、队列发现、试验支持，或隐私保护协作。这些产品更可能按合同范围、数据集访问、使用量收费，或混合平台与服务组件变现，而不是简单按席位订阅。


              对应的 GTM 结论是，Datavant 大概率同时跑多套销售动作。健康计划和医疗服务方工作流可以包装成可量化节省的运营改进；生命科学产品则围绕速度、证据质量和研究效率销售。AWS 和 Thermo Fisher
              的公告显示，至少在部分细分市场，合作伙伴牵头分销和生态联合销售很重要。Labcorp 的阿尔茨海默平台公告说明，Datavant 也能作为连接层嵌入另一家公司的产品，而不只是站在台前做主承包商。这种多动作 GTM
              扩大了需求面，但通常也会拉长投资人尽调，因为销售效率、回本周期和合同质量可能在不同细分市场差异很大。


              公开资料不足以计算 CAC、回本周期或平均合同价值。最好的代理指标都是间接的：公司声称健康计划客户留存高、网络访问面广，并且适配大型受监管买方。这些是积极的需求信号，但不能替代 cohort-level
              商业数据。
