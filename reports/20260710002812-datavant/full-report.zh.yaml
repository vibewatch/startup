  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 从工作流看，Datavant 实际交付什么
        blocks:
          - type: paragraph
            body: >-
              Datavant 的产品最好理解为一个工作流栈，而不是单一应用。公开解决方案页面显示，至少有六类反复出现的模块：健康数据检索、信息释放、风险调整 / HCC 编码、病历请求自动化、隐私保护连接和 Privacy
              Hub 服务，以及 Datavant Connect 这类数据发现 / 协作工作流。这些模块卖给不同买方群体，但都服务于同一个更大的任务：在组织之间安全连接健康数据。公司还把 Datavant
              Switchboard 描述为可识别和去标识数据的底层平台，这说明多个表层产品可能复用同一套内部运营模型，用于路由、检索、隐私过滤和交付。


              这个产品定义很重要，因为它解释了 Datavant 为什么能服务医疗服务方、健康计划、政府机构、生命科学客户、律所和保险工作流，同时又不只是一个「互操作
              API」或「病历检索业务」。有些产品明显是工作流应用：编码运营、信息释放、请求自动化。另一些则是基础设施或平台层：Switchboard、FHIR
              Worker、隐私保护病历连接、云优先数据发现。公司公开材料反复把这些产品定位为降低交换摩擦、提高数据产出率，并在 HIPAA 等治理框架下守住信任的方式。


              对尽调来说，关键结论是 Datavant 的产品宽度是真实的，不只是营销分类。宽度带来交叉销售空间和战略韧性，但也增加复杂度：共享平台组件必须同时支撑许多工作流、数据类型和监管场景。
