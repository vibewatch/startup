      - number: '4.5'
        title: 财务结论：规模不错，可见度不足
        blocks:
          - type: paragraph
            body: >-
              Datavant 的公开财务画像，更适合概括为「有规模证据，缺质量证据」。规模逻辑很直接：公司结合了 Ciox
              合并带来的大体量历史收入基础、广泛检索足迹、重要的医疗服务方和支付方覆盖，并通过产品和合作伙伴提升了在生命科学中的重要性。质量逻辑远没被证明。公开材料没有披露收入结构、各收入流毛利率、客户集中度、现金生成、债务义务或收购后整合成本。定价可见度很低，即便最明确的经济性主张，也聚焦于相对其他供应商的节省，而不是
              Datavant 自身实现的利润率。


              这并不说明公司财务弱，而是说明财务披露不足。一方面，收入来源的宽度可能是优势，因为它把需求分散到生命科学、支付方、医疗服务方、政府以及法律和保险工作流。另一方面，同样的宽度也带来执行和利润率问题，因为不同产品线可能有很不同的交付成本和续约机制。围绕
              2024 年数据泄露达成的 2026 年和解也提醒投资人，法律或安全事件可以把信任问题转化为直接财务成本。


              总体看，公开证据支持这样的判断：Datavant 拥有有意义的变现面和强市场相关性；但公开证据不支持放心承保其利润率路径、burn profile
              或资本强度。对尽调来说，本章应被视为「research-more」财务判断，而不是「high-confidence」经济性案例。
