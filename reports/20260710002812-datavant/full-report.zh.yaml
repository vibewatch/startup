    approximationNotes: 基于抓取的公开证据生成的定性热力图；排序依据是各类风险的传导力，而不是未披露的事件数据。
    claimRefs:
      - CR041
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 建议从强战略相关性出发，但经济可见度偏弱，因此落到继续研究的立场。
    data:
      nodes:
        - id: market
          label: 庞大且具战略意义的医疗数据市场
        - id: proof
          label: 真实客户和产品验证
        - id: trust
          label: 强信任 / 工程信号
        - id: opacity
          label: 当前财务不透明
        - id: premium
          label: 2021 年隐含高溢价倍数
        - id: recommend
          label: 继续研究建议
      edges:
        - from: market
          to: proof
          label: 支撑
        - from: proof
          to: trust
          label: 强化
        - from: trust
          to: opacity
          label: 抵消但不解决
        - from: opacity
          to: premium
          label: 使其难以论证
        - from: premium
          to: recommend
          label: 推动谨慎
        - from: proof
          to: recommend
          label: 避免直接回避
    approximationNotes: 流程图呈现推理链条，而不是衡量后的概率。
    claimRefs:
      - CV001
      - CV004
      - CV006
      - CV029
      - CV030
      - CV032
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 简单的公开启发式测算显示，Datavant 的历史隐含倍数已经接近相关公开区间的高端。
    data:
      items:
        - label: Health Catalyst 参照测算
          value: 0.5
        - label: Phreesia 参照测算
          value: 1.6
        - label: IQVIA 参照测算
          value: 4.1
        - label: Datavant 2021 年隐含下限倍数
          value: 10
        - label: Veeva 参照测算
          value: 11.2
        - label: 高溢价软件上限信号
          value: 12
      yAxis:
        label: 简单估值 / 收入启发式指标（x）
    approximationNotes: 使用基于公开数据的简单市值 / 收入口径启发式测算，而不是完整的 EV/收入计算。Datavant 使用收入下限，因此如果当前收入已大幅提高，隐含倍数可能夸大真实当前倍数。
    claimRefs:
      - CV024
      - CV025
      - CV026
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 公开证据支持较宽的估值结果区间，因为 Datavant 当前经营经济性披露不足。
    data:
      items:
        - label: 悲观框架（混合 / 不透明）
          low: 0.5
          high: 3
        - label: 基准框架（质量参差的战略资产）
          low: 3
          high: 7
        - label: Datavant 历史锚点
          low: 7
          high: 10
        - label: 乐观框架（高质量、类软件）
          low: 10
          high: 12
        - label: 公开可比公司区间
          low: 0.5
          high: 11.2
        - label: 私有尽调前的建议投资测算区间
          low: 3
          high: 10
    approximationNotes: 区间以收入倍数口径的示例性区间呈现，锚定公开可比公司的启发式测算以及 Datavant 历史披露的交易 / 收入下限。它们不是正式 DCF，也不是市场出清估值。
    claimRefs:
      - CV016
      - CV017
      - CV018
      - CV025
      - CV027
      - CV028
