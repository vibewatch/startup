  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: risk transmission into bookings and renewals
    missingEvidence: Public sources do not show whether trust incidents, compliance costs, or operational complexity have affected bookings, renewals, or expansion.
    whyItMatters: Without customer-impact evidence, residual risk severity can only be estimated.
    diligencePath: Request pipeline loss analysis, security-review cycle length, churn / expansion data around adverse periods, and customer-procurement feedback.
    relatedQuestionRefs:
    - QR022
    - QR024
    - QR027
  - type: private-evidence-only
    severity: material
    topic: dependency concentration
    missingEvidence: No cited public source discloses concentration across cloud vendors, top data partners, top customer channels, or key internal experts.
    whyItMatters: Moderate technical dependencies can become severe financial or operating risks if concentrated.
    diligencePath: Request concentration metrics for top channels, top data partners, top cloud spend, and critical-team succession coverage.
    relatedQuestionRefs:
    - QR015
    - QR016
    - QR017
    - QR018
    - QR019
  - type: private-evidence-only
    severity: material
    topic: financial opacity
    missingEvidence: Current liquidity, leverage, margin, and automation-rate data remain private.
    whyItMatters: These are required to decide whether operational and control burdens are comfortably funded or margin-accretive.
    diligencePath: Request current balance sheet, debt schedule, product-line margins, and automation-rate trends by workflow.
    relatedQuestionRefs:
    - QR020
    - QR021
    - QR029
  - type: enumeration-incomplete
    severity: minor
    topic: TR001 regulatory / legal risk register coverage
    missingEvidence: The public register covers the most material visible legal and regulatory issues but does not enumerate every state-law, contract-specific, or international risk that may apply to Datavant.
    whyItMatters: A private healthcare-data company can accumulate bespoke risk at the customer, state, or contractual layer that is not obvious from public sources alone.
    diligencePath: Request outside-counsel summaries, open matter lists, state-compliance mapping, and any material customer-specific data-processing obligations.
    relatedQuestionRefs:
    - QR004
    - QR005
    - QR006
    relatedTableRefs:
    - TR001
