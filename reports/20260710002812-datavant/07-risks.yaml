- id: operational
  title: Operational, quality, and security execution risk
  body: 'Operational risk at Datavant is not limited to uptime or cloud outages. The company’s engineering blogs show that record retrieval at scale depends on heterogeneous EHR APIs, configuration-driven logic, prioritization queues, provider-specific variance, and in some cases manual fallback. Public retrieval pages also make clear that digital and manual methods coexist. That means Datavant must continually manage a hard edge where product automation meets operational fulfillment. Risks include slower turnaround, lower yield, manual bottlenecks, data-quality issues, and inconsistent customer experience if a workflow falls outside the strongest digital paths.


    Security execution risk is equally important. Datavant’s own FedRAMP materials describe ongoing continuous-monitoring burdens, expensive government-grade tooling, and architecture changes required by FIPS and control requirements. Those are positive signs of seriousness, but they also show that security is costly and operationally intrusive. In other words, the mitigation is itself a permanent operating commitment. The company’s product breadth adds another layer of quality risk: coding accuracy, retrieval completeness, de-identification quality, and data discovery integrity all have to hold at once. The KLAS release and coding materials offer positive signals such as 98% coding accuracy and high customer-service marks, but those signals apply to selected workflows rather than the full platform.


    The operational verdict is that Datavant appears competent and mature, but the system it is operating is inherently complex. That makes operational slippage a medium-to-high recurring risk even if no single failure mode is currently visible in public reporting.'
  claimRefs:
  - CR016
  - CR017
