    - Retrieval or coding remains highly manual
    - Automation not improving or margins not expanding
    - Re-rate toward services multiple
  - - Partner concentration
    - Large share of growth from a few channels
    - One or two channels dominate new bookings
    - Demand channel-mix disclosure before capital deployment
  - - Public-sector control failure
    - FedRAMP findings or sponsor issues worsen
    - Material POA&M problems or lost authorization status
    - Pause public-sector upside assumptions
  - - Financial opacity persists
    - Management resists basic KPI disclosure
    - No credible data room support for margins, retention, or liquidity
    - Default to research-more / avoid aggressive pricing
  notes: These are thesis-break conditions rather than ordinary operating fluctuations.
