- id: dependency
  title: Partner, platform, customer, and people dependency risk
  body: 'Datavant is dependent on multiple external systems and stakeholders. Its retrieval stack depends on provider APIs and EHR configurations. Its cloud-first discovery products depend on AWS and participating data partners. Its public-sector posture depends in part on continuing to satisfy FedRAMP obligations and maintain trusted government relationships. Its coding and retrieval workflows likely depend on sustained access to experienced domain staff. Public materials also show that the company increasingly works through partners such as Labcorp, AWS, and Thermo Fisher / PPD, which can expand distribution but also create channel and ownership risk.


    These dependencies do not imply fragility, but they create concentration questions. If a small number of large partners or programs drive outsized value, Datavant could face pricing pressure, roadmap constraints, or customer-access issues it does not fully control. The same is true for people risk: maintaining specialized engineering, privacy, compliance, and operational talent is part of the moat. FedRAMP and high-governance workflows, in particular, are not easy to run with generic staff. Datavant’s public recruiting and engineering materials imply continued investment here, but private investors still need to know how much institutional knowledge sits with a relatively small set of technical or operational leaders.


    Dependency risk is therefore a classic hidden multiplier. It can convert a moderate technical or partner issue into a larger revenue or customer-retention issue if too much of the system is concentrated in one channel, vendor, dataset, or team.'
  claimRefs:
  - CR023
  - CR024
  - CR025
  - CR026
  - CR027
