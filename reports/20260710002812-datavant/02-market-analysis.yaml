  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: market sizing overlap
    missingEvidence: Public market reports use different category definitions, forecast windows, and assumptions, so there is no clean additive TAM/SAM/SOM stack for Datavant.
    whyItMatters: A single over-broad market number could overstate monetizable opportunity or hide which submarkets actually drive Datavant economics.
    diligencePath: Build a bottoms-up model using customer counts, budget owners, workflow penetration, and average contract values by segment.
    relatedQuestionRefs:
    - QM023
    - QM024
  - type: private-evidence-only
    severity: material
    topic: buyer budget distribution
    missingEvidence: Public materials do not show how Datavant’s current revenue splits across life sciences, payer, provider, government, and legal-insurance budgets.
    whyItMatters: Serviceable obtainable market depends on which buyers are actually monetizing and which use cases remain mainly strategic positioning.
    diligencePath: Request segment revenue mix, pipeline by buyer type, average contract values, and gross-retention / expansion data by product line.
    relatedQuestionRefs:
    - QM024
  - type: stale
    severity: minor
    topic: market reports
    missingEvidence: Third-party market reports are directional and may not be refreshed on the same cadence as Datavant’s current product and acquisition scope.
    whyItMatters: Fast-moving categories such as interoperability and RWE can re-segment quickly as AI and cloud distribution change buyer behavior.
    diligencePath: Refresh with latest paid market research and triangulate against 2026 budget conversations with customers and channel partners.
    relatedQuestionRefs:
    - QM023
tables:
- id: TM001
  title: Market definition table
  columns:
  - Lens
  - Included spend
  - Excluded spend
  - Why it matters for Datavant
  rows:
  - - Healthcare interoperability
    - FHIR/API exchange, information access, chart movement, cross-system connectivity
    - Owning the source EHR or claims platform itself
    - Explains provider, payer, and compliance-driven demand
  - - Health-data logistics
    - Record retrieval, release of information, coding-adjacent data movement, workflow orchestration
    - Generic BPO without data connectivity or privacy infrastructure
    - Matches Datavant retrieval, legal-insurance, and payer workflows
  - - RWE linkage services
    - Tokenization, identity resolution, cross-source matching, trial follow-up, HEOR enablement
    - Simple analytics on a single owned dataset
    - Most directly maps to Datavant Connect and privacy-preserving linkage
  - - Real-world-evidence solutions
    - Dataset discovery, evidence generation, downstream analytics support
    - Traditional CRO services without data infrastructure
    - Relevant because Datavant increasingly sells into evidence workflows
  - - Government / nonprofit research infrastructure
    - Privacy-preserving linkage, IRB-compatible exchange, FedRAMP-style trust posture
    - Core agency systems not tied to data movement
    - Shows public-sector adjacency beyond pharma and payers
  notes: Uses public Datavant educational pages plus government/regulatory materials to define included and excluded spend categories rather than asserting a single vendor-defined market.
