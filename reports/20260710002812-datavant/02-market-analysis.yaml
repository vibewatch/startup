- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Factor
  - Direction
  - Public support
  - Why it matters
  - Implication for Datavant
  rows:
  - - ONC / CMS interoperability rules
    - Driver
    - USCDI, CMS interoperability, FHIR API requirements
    - Compliance-driven data exchange remains non-optional
    - Supports provider and payer workflow demand
  - - Need for longitudinal patient views
    - Driver
    - Datavant RWD guide and 2026 RWE blog
    - No single dataset captures full patient journey
    - Supports linkage and tokenization demand
  - - Life-sciences evidence rigor
    - Driver
    - RWE blog, Thermo Fisher, Labcorp, market reports
    - Sponsors need fit-for-purpose, traceable linked data
    - Supports premium evidence-infrastructure positioning
  - - Fragmented data quality / methodology
    - Constraint
    - MarketsandMarkets and Datavant educational materials
    - Poor provenance or inconsistent methods slow adoption
    - Rewards governed platforms but lengthens sales cycles
  - - Implementation and workflow change
    - Constraint
    - Interoperability guide and segment pages
    - Connectivity still requires process redesign, not just APIs
    - Can delay realization of ROI
  - - Competitive overlap from dataset owners and workflow vendors
    - Constraint
    - Competitor sites and vendor directory
    - Buyers can choose owned-data, EHR-native, or integration-only alternatives
    - Datavant must prove differentiated value beyond access
  notes: Pairs public regulatory, educational, and market-report evidence with chapter-level interpretation of how those forces shape adoption.
