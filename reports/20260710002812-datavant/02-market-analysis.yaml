company:
  name: Datavant
chapter:
  number: 2
  title: Market Analysis
  summary: Datavant operates at the intersection of healthcare interoperability, health-data logistics, and real-world-evidence linkage. Public sources show a structurally attractive market driven by regulation, rising demand for longitudinal patient records, and sponsor interest in linked RWD, but the addressable market is fragmented across providers, payers, life sciences, government programs, and legal-insurance request flows. The main judgment is that the market is large and growing, but value accrues to platforms that can combine privacy-preserving linkage, workflow integration, and governance rather than simple data access alone.
sections:
- id: market-boundary
  title: Market boundary and what Datavant is actually selling
  body: 'Datavant participates in a broader market than any single label captures. Its own educational and solution pages sit across three overlapping categories: healthcare interoperability, health-data logistics, and real-world-data connectivity. The interoperability guide defines the market as the ability of systems to exchange patient health information and use it immediately without special effort from the user. But Datavant’s commercial role extends beyond moving messages between systems. The company also positions itself around retrieval, release of information, privacy hub services, coding workflows, and privacy-preserving patient-level linkage for research, payer analytics, and clinical development. In practice, that means Datavant monetizes a layer of infrastructure that connects fragmented records, standardizes access, and enables downstream evidence generation and operational workflows.


    The correct market boundary therefore excludes a few things. Datavant is not simply an EHR vendor, an ordinary health-information exchange, or a raw dataset broker. It does not primarily sell a hospital charting system, nor does it appear to own the bulk of the underlying provider data itself. Instead, it sits in the connective tissue between holders and users of health data: hospitals, health plans, researchers, CROs, legal requesters, and data partners. The market also includes the workflow burden around obtaining records, validating consent and authorization, protecting privacy, and linking records longitudinally across claims, EHR, lab, registry, and specialty sources.


    This broader definition matters because it explains why Datavant can plausibly compete in several adjacent pools of spend at once. A provider may buy Datavant to automate retrieval or coding operations, while a life-sciences sponsor may buy it for tokenization, data discovery, and trial follow-up. A payer may value the same network for chart retrieval and risk adjustment, while a government or nonprofit researcher may value privacy-preserving linkage and disclosure-risk support. The market is therefore best understood as a multi-segment connectivity and evidence infrastructure market rather than a single-software category.'
