- id: market-size-and-scaling-lenses
  title: 'Sizing lenses: interoperability, linkage, and RWE'
  body: 'No single public market estimate cleanly captures Datavant’s full opportunity, so sizing has to be lens-based. Third-party reports suggest the global real-world-evidence solutions market was about $4.7 billion in 2024 and could reach roughly $10.8 billion by 2030 at a 14.8% CAGR. A more specific Future Market Insights report pegs real-world-evidence linkage services at about $0.8 billion in 2026, growing to $3.6 billion by 2036 at a 16.2% CAGR. Meanwhile, another FMI report sizes healthcare interoperability solutions at $6.9 billion in 2026, growing to $26.6 billion by 2036 at a 14.5% CAGR. These are different markets with different methodologies, but together they imply that Datavant sits inside several expanding categories rather than one static niche.


    The linkage-services lens is especially relevant to Datavant because it focuses on identity resolution, tokenization, and cross-source matching rather than raw record ownership. FMI says tokenization holds a 39% share of that linkage-services segment in 2026, while claims data carries a 34% data-source share and biopharma accounts for 43% of end-user demand. Those figures align well with Datavant’s positioning around privacy-preserving linkage, claims/EHR combination, and life-sciences evidence use cases. The broader interoperability lens matters because Datavant also earns relevance from provider retrieval, payer chart exchange, and information-access workflows that sit outside classic RWE.


    For underwriting, the takeaway is not that one report provides a definitive TAM, SAM, and SOM. Instead, the public evidence supports a stacked-opportunity thesis: Datavant can draw demand from regulated interoperability, from evidence-generation infrastructure, and from retrieval / coding / release-of-information workflows. That creates a larger revenue surface than a pure tokenization vendor would have, but it also means the company must keep winning in several related submarkets that do not all grow for the same reasons or buy on the same budget cycle.'
