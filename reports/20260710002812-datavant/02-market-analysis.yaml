callouts:
- calloutType: strength
  title: Regulation and workflow pain create non-discretionary demand
  body: Datavant sells into markets where compliance deadlines, information-blocking rules, FHIR API requirements, and operational bottlenecks all raise the cost of doing nothing. That makes the market structurally better than a purely optional analytics category.
  claimRefs:
  - CM026
  - CM027
  - CM028
  - CM029
- calloutType: risk
  title: Large market does not equal simple sales motion
  body: The same diversity that enlarges Datavant’s TAM also fragments budget ownership. Providers, payers, life sciences teams, and government researchers buy for different reasons and measure ROI differently, which can slow sales and expansion despite strong top-down demand.
  claimRefs:
  - CM018
  - CM019
  - CM020
  - CM023
  - CM036
- calloutType: insight
  title: Tokenization and linkage are the sharpest market lens for Datavant
  body: The RWE linkage-services market is smaller than the broad interoperability market, but it maps most directly to Datavant’s core value proposition because it prices identity resolution, privacy-preserving matching, and longitudinal connectivity rather than generic data exchange.
  claimRefs:
  - CM012
  - CM013
  - CM014
  - CM015
- calloutType: recommendation
  title: Size the opportunity with layered lenses, not a single TAM claim
  body: Treat interoperability, linkage, and RWE solutions as overlapping addressable pools. A single number risks either understating Datavant’s multi-product expansion surface or overstating what it can monetize in any one buyer segment.
