  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: founding date
    missingEvidence: Public sources disagree on whether the company should be treated as founded in 2014 or 2017 because the current Datavant combines original Datavant and Ciox lineages.
    whyItMatters: A canonical founding date affects company-age comparisons, management-history framing, and historical productivity benchmarks.
    diligencePath: Request formal corporate history from management or cap-table counsel and reconcile legal-entity timeline in data room materials.
    relatedQuestionRefs:
    - QO004
  - type: private-evidence-only
    severity: material
    topic: current financials
    missingEvidence: No public source provides current ARR, revenue mix, gross margin, or acquisition-integration economics after the 2021 merger.
    whyItMatters: Valuation and underwriting depend on current revenue quality, margin profile, and the contribution of acquired businesses.
    diligencePath: Request 2024-2026 audited financials, segment mix, customer concentration, and integration scorecards for Aetion and Ontellus.
    relatedQuestionRefs:
    - QO018
    - QO025
  - type: private-evidence-only
    severity: minor
    topic: ownership percentages
    missingEvidence: Public materials list major investors but do not disclose current ownership percentages, liquidation preferences, or structured-equity terms.
    whyItMatters: Sponsor control, board rights, and preference stack influence exit math and minority-holder alignment.
    diligencePath: Request current capitalization table, merger financing documents, and board observer / governance rights.
    relatedQuestionRefs:
    - QO010
    relatedTableRefs:
    - TO003
  - type: private-evidence-only
    severity: minor
    topic: leadership and founder table coverage
    missingEvidence: Public sources do not disclose a complete post-merger executive org chart, board roster, or succession planning below the CEO level.
    whyItMatters: The leadership and founder table is intentionally partial and may understate key-person concentration or functional depth.
    diligencePath: Request current executive roster, board composition, and succession planning materials to complete the leadership and founder table.
    relatedQuestionRefs:
    - QO009
    relatedTableRefs:
    - TO002
  - type: stale
    severity: minor
    topic: headcount
    missingEvidence: The only readily accessible headcount figure in this review came from a low-reputation third-party database rather than the company.
    whyItMatters: Headcount is a useful scale and efficiency proxy, especially after multiple acquisitions.
    diligencePath: Validate current employee count through management materials, payroll systems, or a reputable data provider with methodology disclosure.
    relatedQuestionRefs:
    - QO019
  - type: enumeration-incomplete
    severity: minor
    topic: milestone table coverage
    missingEvidence: Public chronology does not fully disclose private integration milestones, internal reorganizations, or any undisclosed financing events between the merger and later acquisitions.
    whyItMatters: The milestone table is intentionally partial and could miss inflection points that explain current operating performance or integration risk.
    diligencePath: Request board materials and integration updates covering 2021-2026 so the public timeline can be reconciled against internal milestones.
    relatedQuestionRefs:
    - QO020
    relatedTableRefs:
