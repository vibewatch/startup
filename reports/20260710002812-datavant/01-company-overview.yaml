- id: capital-base-and-corporate-milestones
  title: Capital base, valuation anchors, and milestone chronology
  body: 'The public funding record is easier to support for the original Datavant startup than for the current combined platform. Datavant''s 2020 Series B press release says the company raised $40 million in that round and $83 million cumulatively, with Transformation Capital leading and JJDC, Cigna Ventures, Roivant Sciences, and Flex Capital participating. Third-party venture databases such as Tracxn also continue to describe the original startup as a 2017-founded, San Francisco-based Series B company with $83 million raised. That is useful historical grounding, but it does not capture the capital structure of the post-merger platform.


    The decisive public valuation anchor is the June 2021 Ciox merger. Both the official Datavant release and multiple independent deal reports describe the transaction at $7.0 billion and say the combined entity would generate more than $700 million of revenue. The investor group listed around the transaction included New Mountain Capital, Roivant Sciences, Transformation Capital, Merck Global Health Innovation Fund, Labcorp, Cigna Ventures, Johnson & Johnson Innovation–JJDC, and Flex Capital, plus fresh investment from Sixth Street and Goldman Sachs Asset Management. That set of names matters because it shows the current Datavant is effectively a sponsor-backed consolidation story with strategic and financial backers across healthcare, not just a venture-backed software company.


    Post-merger milestones show continued scope expansion. In July 2025 Datavant completed the acquisition of Aetion, adding a real-world-evidence analytics platform into the life-sciences business. In August 2025 it completed the Ontellus acquisition and used it to form a dedicated legal-and-insurance vertical. In 2026, partner releases from Thermo Fisher and Labcorp show Datavant extending beyond linkage into AI-assisted data discovery and therapeutic research workflows. The milestone pattern is clear: Datavant is compounding network scale through acquisitions and partner infrastructure, but public reporting still does not provide enough current financial detail to underwrite present-day margins, ARR mix, or integration economics.'
