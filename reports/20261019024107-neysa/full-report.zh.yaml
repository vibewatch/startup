  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争集合不止于初创公司同行
        blocks:
          - type: paragraph
            body: >-
              公开记录不支持把 Neysa 当作单纯的初创公司对初创公司比较。独立报道和分析师评论反复将其描述为 AWS、Azure 及其他海外超大规模云厂商在印度境内 AI 工作负载上的本土替代方案，同时也把它与专业 GPU
              云和区域供应商放在同一竞争集合中。Neysa 自身材料进一步表明，它试图同时从多条替代路径争取工作负载： 全球公有云、本地企业 AI 云，以及原本需要客户自行组装 GPU
              容量、编排和支持的内部建设。这个广度很关键，因为 Neysa 的护城河不能只拿来与本地初创公司比较； 买方也可以用在位云厂商，或在自己的运营模式下搭建专用集群，解决同一项任务。
