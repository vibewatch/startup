      - number: '4.4'
        title: 财务结论与尽调阻碍
        blocks:
          - type: paragraph
            body: |-
              Neysa 的财务故事合理，但并不完整。公司似乎在向受监管的印度客户销售一套组合式主权 AI 基础设施技术栈，依靠直销企业销售、合作伙伴和集成解决方案发布的组合。
              如果利用率爬坡且支持成本得到控制，这套模式可以支撑有吸引力的合同金额。投资者真正需要用来定价执行风险的输入仍然缺失：当前收入、积压订单、按 GPU 类别划分的利用率、
              毛利率、客户集中度、折扣后的净实现价格、手头现金、现金消耗、资金续航，以及拟议债务层背后的文件。在这些信息披露之前，本章支持的是“继续研究”，
              而不是已经经过投资判断验证的收入质量或利润率论点。
            claimRefs:
              - CI006
              - CI009
              - CI010
              - CI013
              - CI014
