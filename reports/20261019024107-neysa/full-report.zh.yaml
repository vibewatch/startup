      - number: '2.3'
        title: 买方细分、预算负责人和采用路径
        blocks:
          - type: paragraph
            body: |-
              最强的经常性买方群体包括 BFSI、医疗、公共服务、政府、初创公司和研究机构。它们普遍面临敏感数据、模型性能要求或不愿承担高资本开支自建 GPU 的约束。
              Neysa 的官方定位也围绕垂直行业推进市场进入：它列出 BFSI 的欺诈检测和风险场景、研究规模的模型开发、初创公司的训练与推理，以及需要本地控制的公共部门工作负载。
              采购同样由合作伙伴介入，而非完全依赖直销。Neysa 的合作伙伴计划围绕 ISVs、系统集成商、顾问和转售商展开，由它们维护客户关系并从服务中变现，
              Neysa 则提供底层算力和支持。因此，预算通常掌握在企业 CIO、CTO、CDAO 或业务线 AI 赞助人手中，但采购也可能经由已经主导客户采用计划的渠道合作伙伴完成。
            claimRefs:
              - CM003
              - CM004
              - CM010
              - CM011
              - CM013
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM010
              - CM011
              - CM013
      - number: '2.4'
        title: 采用约束与未解的市场尽调
        blocks:
          - type: paragraph
            body: >-
              看多市场的逻辑，不等于采用风险已经出清。公开来源反复指出四项约束：超大规模云厂商仍可用本地化定价和容量作出回应；监管可能朝有利或不利于本地玩家的方向变化； GPU
              供应和融资执行仍是成败门槛；利用率还必须快速爬坡，基础设施模式才可能在经济上成立。这些是执行和市场结构风险，不代表需求不存在， 但如果扩建速度超过实际需求，估值可能被明显压缩。 公开证据最薄弱的部分仍是
              Neysa 自身的市场获取。成本主张虽有支持，但分母和方法论并不一致；现有保留来源没有披露一条足够可辩护的公开链路， 能把印度主权计算的市场叙事连接到 Neysa
              的签约份额、利用率或细分收入组合。因此，正确的市场结论是：“市场大且有政策支持，但尚未充分转化为公开可见的公司层面经济性。”
            claimRefs:
              - CM012
              - CM014
      - number: '2.5'
        title: 图表
        blocks:
          - type: callout
            title: 政策和容量比泛化云 TAM 更重要
            body: 市场时点由主权计算采购、受监管工作负载审查和国内 GPU 稀缺共同决定，而不是由“AI 很大”这一泛化说法决定。
            calloutType: insight
            claimRefs:
