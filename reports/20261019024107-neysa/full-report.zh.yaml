            - 数据驻留与控制要求
        - label: 安全与采购筛选
          actor: 受监管客户
          phase: 资格筛选
          channel: 直销叠加伙伴影响
          touchpoints:
            - ISO 27001 / SOC 2 Type II 资质定位
            - 单租户与混合部署选项
        - label: 方案与伙伴打包
          actor: ISV、咨询机构与技术伙伴
          phase: 方案嵌入
          channel: 联合销售 / 顾问 / 生态
          touchpoints:
