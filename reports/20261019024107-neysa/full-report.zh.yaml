        high: 印度境内或由买方控制
        description: Evidence-backed ordinal scoring from cited sources
        scale: ordinal
      yAxis:
        label: 产品化 AI 云深度
        min: 1
        max: 5
        low: 裸基础设施或自行拼装
        high: 配有运营层的打包式 AI 平台
        description: Evidence-backed ordinal scoring from cited sources
        scale: ordinal
      points:
