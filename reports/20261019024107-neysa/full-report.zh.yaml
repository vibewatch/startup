            title: 公开 TAM 仍比 Neysa 专属 SAM 更容易引用
            body: 保留来源支持真实市场和可信的产品切入点，但仍未披露利用率、细分组合或独立的价格—性能链路，无法把宏观需求转化为可用于投资判断的份额假设。
            calloutType: risk
