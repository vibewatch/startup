  - id: TV002
    title: 正向论点 / 反向论点表
    columns:
      - 方向
      - 论点
      - 证据
      - 哪些证据会改变判断
    rows:
      - - 看多
        - 主权 AI 定位叠加 $1.2B 融资方案，让 Neysa 在聚焦印度的 AI 云市场拥有罕见规模。
        - Blackstone 牵头的融资、20,000 张 GPU 的目标，以及聚焦印度的定位。
        - 如果能证明算力已签约、利用率良好且利润率具吸引力，投资逻辑会更扎实。
      - - 看多
        - 公开定价和伙伴主导的分销显示，Neysa 试图变现的不只是 GPU 裸转售。
        - 托管 GPU 价格卡、Mavenir 集成，以及经销商 / ISV / 系统集成商计划。
        - 如果能证明软件和渠道动作带动留存或附加率，收入质量会更高。
      - - 反论点
        - 公开可见的 $1.4B 估值，领先于 ARR、毛利率、NRR 和债务结构的公开证据。
        - 市场上有第三方估值标记，但运营质量披露稀少。
        - 经审计或有管理层背书的运营指标，可能缩小支撑缺口。
      - - 反论点
        - 该模式暴露于利用率、硬件供应和超大规模云厂商价格竞争风险。
        - Sacra 的风险提示和 Moneycontrol 都指出执行与供应链依赖。
        - 长期预留合同、高利用率和有保障的供应，会降低下行风险。
    notes: 论点综合所引来源；“哪些证据会改变判断”指的是推动建议改变所需的尽调或执行证据。
