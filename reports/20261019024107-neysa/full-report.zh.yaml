chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、定位与可观察规模
        blocks:
          - type: paragraph
            body: >-
              Neysa 将自己定位为一家主权 AI 云，服务印度及其他需要本地掌控计算、编排和安全的受监管工作负载，而非提供通用技术栈的超大规模云厂商。 现有证据对其核心身份的描述大体一致：第三方报道将公司置于
              Mumbai，并称其成立于 2023 年；官网和合作伙伴页面则把 Velocis 描述为一个集成运营层，把 GPU 基础设施转化为生产环境 AI
              算力。公开规模证据仍是选择性的，尚未经过审计。现有资料中最清晰的经营数据点来自一份合作伙伴案例研究： 其中称 Neysa 已经运行数千个 GPUs、每天支持处理超过 100M
              tokens；公司控制的客户页面虽展示了具名 users，却没有披露客户数量、支出或留存基准。
