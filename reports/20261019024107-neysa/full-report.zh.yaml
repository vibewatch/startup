      - number: '4.2'
        title: 定价信号与单位经济性代理指标
        blocks:
          - type: paragraph
            body: |-
              公开定价确实存在，但仍是目录价，而不是收入质量的证明。Neysa 自己的比较页面展示了 L4、L40S 和 H100 实例的小时价与 36 个月预留价；
              产品材料则强调感知 spot 的调度、多层级 GPU 定价和“tokens-per-dollar”效率。现有资料中最好的经营证明仍是轶事性的：
              一份公司分享的会议回顾称，某客户每月处理 144 billion tokens，将总成本削减 40%，并把延迟降至 2 秒。这个案例在方向上有帮助，
              但无法回答全组合毛利率、回收期或支持负担等问题。
