      - number: '3.3'
        title: 公开证据尚未证明持久的经济锁定
        blocks:
          - type: paragraph
            body: >-
              主要竞争挑战在于，Neysa 的表面优势在产品叙事和目录价中更明显，独立验证的经营指标却不足。Neysa 的比较博客显示，其起始价格低于若干具名替代方案，
              但这张表由供应商撰写，对预留容量折扣、工作负载组合或实际毛利率几乎没有说明。独立分析师评论也指出最重要的下行情景：超大规模云厂商可以降价， 或在数据主权规则放松后获得优势，从而削弱 Neysa
              为印度优先基础设施收取溢价的能力。结果是，这套竞争叙事合理且在战略上连贯， 但仍没有证明客户会在更大的在位者回应后，以具备经济吸引力的条款留存、扩张并续约。
