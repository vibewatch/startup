      - number: '3.2'
        title: 差异化来自平台深度与渠道覆盖的组合
        blocks:
          - type: paragraph
            body: >-
              Neysa 披露的产品不只是原始 GPU 租赁。综合融资公告、产品比较、合作伙伴页面和 Mavenir 发布，公司把 Velocis 定位为一朵主权 AI 云，
              将基础设施、推理、编排、安全和渠道赋能层组合在一起。这样的组合在竞争上很重要，因为它让 Neysa 能从受监管账户的多个切入点争取订单：
              本地控制、打包软件，以及通过转售商、顾问和电信关联市场伙伴获得的销售杠杆。支持这一论点的最强公开证据仍来自公司自身或合作伙伴， 因此本章把它视为可信的定位优势，而不是已经验证的长期护城河。
