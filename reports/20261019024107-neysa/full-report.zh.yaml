  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: Neysa 的公开客户路径始于对主权能力敏感的需求，经伙伴协助进入生产，再升级到承诺度更高的容量模式；但关于客户持续性的证据仍然很薄。
    data:
      items:
        - label: 识别主权 AI 需求
          actor: 企业、公共机构和 AI 构建者
          phase: 需求形成
