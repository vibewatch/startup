      - CV001
      - CV002
      - CV003
      - CV005
      - CV006
      - CV011
      - CV012
      - CV014
  - id: TV003
    title: 看多 / 基准 / 看空情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 看多
        - 20,000 张 GPU 按时扩容，伙伴渠道转化受监管客户，软件功能形成真实切换成本。
        - 如果利用率和利润率质量能随本轮融资的扩容计划提升，当前估值可以站住。
        - 硬件供应、执行复杂度和客户爬坡时点。
        - 需要披露利用率、利润率和已签约需求的证据。
      - - 基准
        - Neysa 证明自己在主权 AI 中有价值并赢得部分企业需求，但公开记录对经济性和债务细节仍然薄弱。
        - 只有附带严格条款或完成更多尽调，公开可见的估值才具备投资性；上行空间存在，但尚未纳入投资判断。
        - 估值支撑仍高度依赖叙事，竞争和资本开支压力依然明显。
        - 最符合当前公开证据集。
      - - 看空
        - 债务驱动的扩张跑在利用率前面，超大规模云厂商压低价格，渠道牵引力无法抵消资本密集度。
        - 如果基本面令人失望，公开可见的估值会显得昂贵，并可能面临估值下调或降价轮压力。
        - 供应链约束、客户集中度和薄弱的留存证据。
        - 如果尽调无法填补当前披露缺口，这一情景最可能出现。
    notes: 这些是定性的情景区间，不是贴现现金流结果；公开证据不足以支持精确的目标回报或退出倍数。
