            body: >-
              公开记录指向三项首要剩余风险。第一，融资与部署紧密相连：Neysa 披露最高 $600M 的承诺股权和拟议额外 $600M 的债务，并把这笔资本与在 India 部署超过 20,000 GPUs
              的计划绑定。因此，债务完成、契约灵活性和扩建节奏都是核心评估问题，而不是后台细节。第二，经营证明在改善，但相对于公司雄心仍处于早期。 WEKA 的案例研究显示了真实的生产环境使用和可靠性进展，却也确认 Neysa
              必须强化存储架构，才能让 GPU 集群在高要求工作负载下保持高效运行。
              第三，商业论点依赖主权、受监管和合作伙伴协助的采用。这目前有助于差异化，但也意味着安全证明、合作伙伴协同和监管持续性会直接影响收入质量和增长速度。
