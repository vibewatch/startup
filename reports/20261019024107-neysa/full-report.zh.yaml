  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与相邻支出
        blocks:
          - type: paragraph
            body: >-
              相关市场既不是抽象的“AI”，也不是泛化的公有云支出。公开来源反复将 Neysa 定位为印度境内的 AI 基础设施，涵盖 GPU 计算、编排、监控、安全及相邻平台服务，
              帮助企业在本地训练、微调和部署模型。这个边界很重要：即使消费者应用、模型供应商和广义 IT 外包同样受益于 AI 需求，它们也不属于这里的市场范围。 这一边界还把 Neysa
              与超大规模云厂商的云收入区分开来，后者不受本地数据、延迟或主权计算要求的同等约束。

              买方范围同样窄于“所有企业”这一宽泛叙事。综合公司材料和独立报道，反复出现的终端市场包括受监管企业、政府或公共服务机构、AI 实验室和初创公司； 它们需要境内算力或合规保障。实际销售的是位于 AI
              应用之下的基础设施层，而不是 Neysa 自己的应用。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM009
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM010
      - number: '2.2'
        title: 多种测算指向真实市场，但尚不足以形成清晰的 SAM/SOM
        blocks:
          - type: paragraph
            body: >-
              宏观市场规模数据充足，但能直接支撑投资判断的经营数据很薄弱。现有资料中最宽泛的口径，是 Value For Startups 对 $2B+ 年度印度 AI 市场的估算，以及对 2028 年 $6B+ 主权计算 /
              neocloud 市场的估算；两者可用于判断方向，却不等同于 Neysa 自身能够触达的需求。 更具体的视角来自 GPU 容量：Moneycontrol 估计印度当前拥有约 60,000 个用于商业 AI
              工作负载的 GPUs；ET 报道 IndiaAI 已承诺 40,535 个 GPUs，第四轮还预计增加 ~25,000 个；Neysa 则在 Blackstone 融资后提出 20,000+ 的部署目标。

              综合来看，这些数字支持这样一个判断：印度的主权 AI 计算仍受供给约束，而 Neysa 的计划扩张相对于当前国内已部署基数颇具规模。 但它们无法给出可靠的 Neysa 专属 SAM 或
              SOM。公开记录仍缺少按垂直行业拆分的需求转化、按客户队列划分的签约容量以及利用率数据， 因而无法把宏观容量统计连接到按价值计算的收入获取。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
