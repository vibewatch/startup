        title: 收入模式与变现面
        blocks:
          - type: paragraph
            body: |-
              公开可见的收入面比原始 GPU 租赁更广。Neysa 发布托管 GPU 目录价，提供透明的按分钟或按小时计费，并把 Velocis 描述为覆盖基础设施、编排、安全和可观测性的组合平台，而不是裸计算 SKU。
              其合作伙伴计划提供第二条市场进入路径：转售商和系统集成商维护客户关系，并在 Neysa 算力之上从服务和经常性用量中变现。Mavenir 的发布又把这一逻辑延伸到按 token
              计量的电信和 neocloud 部署，但现有保留来源没有披露按产品线划分的实际定价、折扣或收入组合。
