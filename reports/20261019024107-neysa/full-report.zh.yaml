            body: >-
              创始人与市场的匹配度是 Neysa 故事的重要组成部分。Sharad Sanghi 和 Anindya Das 并非首次创业者，而是带着 Netmagic
              管理团队的经验回到新一轮基础设施周期，这有助于解释公司异常迅速的资本形成。现有公开轨迹从 2024 年初约 $20 million 的种子轮， 走到 2024 年末的 $30 million Series
