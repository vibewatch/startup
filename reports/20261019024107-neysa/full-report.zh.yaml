  - id: FI001
    title: 收入模型桥接图
    type: flow
    summary: 公开证据指向按用量计费的基础设施模式；毛利高度取决于利用率、定价纪律和支持投入。
    data:
      nodes:
        - label: 受监管 AI 工作负载
          detail: 目标需求集中在 BFSI、医疗、政府 / 公共服务、科研、初创公司和电信。
        - label: 主权 GPU 与平台组合
          detail: Neysa 销售把编排、可观测性、安全和性能优化整合在一起的 GPU 基础设施。
        - label: 按用量计费
          detail: 公开页面主打按分钟 / 小时计费，同时公布按小时计费和预留 GPU 费率。
        - label: 伙伴协助变现
          detail: 经销商和解决方案伙伴掌握客户关系，并在 Neysa 产能之上叠加自身的经常性服务收入。
        - label: 基础设施与支持成本基础
          detail: 资本主要投向算力、网络、存储、软件建设和 24x7 基础设施支持。
        - label: 毛利敏感性
          detail: 只有利用率爬升、支持投入又低于算力定价创造的利润空间，经济性才会改善。
    approximationNotes: 这是根据公开定价、伙伴和融资材料拼出的概念性运营桥接图，不是公司披露的损益瀑布图。
