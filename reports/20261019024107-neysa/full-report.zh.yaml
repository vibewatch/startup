  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 价格支撑与入场纪律
        blocks:
          - type: paragraph
            body: >-
              最清晰的公开估值事实是 February 2026 的融资公告和第三方估值标记。Neysa 称 Blackstone 和共同投资者承诺最高 $600M 股权，公司还计划再筹措 $600M 债务；Tracxn 和
              Sacra 则都把约 $1.4B 的估值或企业价值与该轮融资联系起来。这足以说明公司已经达到由赞助方支持的规模，但不足以说明可见价格得到已披露经营基本面的支撑。
              公开来源展示了定价、产品范围、合作伙伴推进和扩张雄心，却没有提供经审计 ARR、毛利率、利用率、客户集中度或债务契约细节。在这组证据下，严谨结论是保持“继续研究”并视估值偏高，而不是买入。
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV011
              - CV012
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV012
              - CV013
              - CV014
      - number: '8.2'
        title: 正向论点与反论点
        blocks:
          - type: paragraph
            body: >-
              正向论点是，在规模资本到位前，Neysa 已具备投资者通常看重的几项要素：与 IndiaAI 一致的主权计算叙事、明确的 GPU 部署计划、合作伙伴优先的市场进入路径， 以及让产品比许多私有 AI
              基础设施故事更具体的公开价目表。Economic Times 和 Neysa 自己的合作伙伴材料都暗示，渠道协助的商业化模式可能在受监管账户转化后加快利用率。
              反向论点则是，这仍是一笔资本密集型基础设施押注，要面对超大规模云厂商竞争、硬件供应依赖，以及对准确经济性披露不足的问题；这些经济性本应把 $1.4B 估值标记连接到持久回报。Sacra 的风险框架和不一致的
              headcount 记录都强化了一个判断：相比已经去风险的复合增长资产，把公司当作战略选择更容易评估。
            claimRefs:
              - CV002
              - CV005
              - CV007
              - CV010
              - CV011
              - CV012
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV006
              - CV011
              - CV012
              - CV014
      - number: '8.3'
        title: 情景逻辑与尽调要求
        blocks:
          - type: paragraph
            body: >-
              乐观情景要求 Neysa 把融资支持的容量转化为经常性、高利用率的企业需求，同时保持定价纪律，并利用软件层创造高于单纯 GPU 转售的切换成本。
              基准情景更有限：公司在主权和受监管账户中证明相关性，但公开记录对利润率、客户质量和债务结构的披露仍过于薄弱，无法支撑在可见估值标记下激进入场。
              悲观情景不只是增长较慢，而是利用率下滑、超大规模云厂商或本地竞争者带来的价格压力，以及债务融资支持的扩张超过签约需求三者叠加。
              在对价格敏感的正向建议进行投资判断前，尽调应要求披露债务条款、按集群划分的利用率、客户集中度、预留组合、毛利率，以及软件技术栈中实质性提升留存或钱包份额的比例。
            claimRefs:
              - CV005
              - CV006
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: 图表
        blocks:
          - type: callout
            title: 当前判断
            body: 公开证据支持把 Neysa 留在“继续研究”，而不是在可见估值下强行给出买入判断；更积极的观点需要债务结构、利用率、利润率和客户质量方面的硬披露。
            calloutType: recommendation
            claimRefs:
              - CV012
              - CV013
