  - id: FE001
    title: 产品架构图
    type: stack
    summary: 公开证据把 Neysa 描绘成分层的主权 AI 云：既有算力容量和工作流控制，也能借助伙伴扩展，并非单一的裸 GPU SKU。
    data:
      layers:
        - label: 市场进入与生态
          items:
            - ISV 与解决方案伙伴
            - 系统集成商与经销商
            - 顾问 / 咨询伙伴
            - 技术伙伴
          outputs:
            - 参考架构
            - 联合销售与伙伴交付
        - label: 变现与客户控制
          items:
            - 用量追踪
            - Token 级计费
            - 租户接入
          outputs:
            - 成本可见性
            - 服务打包
        - label: 安全与治理
          items:
            - 安全控制
            - 策略控制
            - 可观测性仪表盘
          outputs:
            - 治理可见性
            - 受监管工作负载定位
        - label: 核心 AI 云工作流
          items:
            - Velocis AI Acceleration Cloud
            - GPU-as-a-Service
            - 训练与推理工作流
          modules:
            - 统一仪表盘
            - 模型编排
            - AI/ML 安全
        - label: 基础设施与性能底座
          items:
            - 印度境内托管的 GPU 容量
            - 单租户受监管部署
            - 印度本土数据中心扩张
          modules:
