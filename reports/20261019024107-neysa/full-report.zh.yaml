      - number: '4.3'
        title: 资本需求与融资依赖
        blocks:
          - type: paragraph
            body: |-
              最明确的财务事实是资本密集度。Blackstone 和共同投资者承诺最高 $600M 股权，Neysa 则计划再筹措 $600M 债务融资，
              用于支持在 India 部署超过 20,000 GPUs 的目标。TechCrunch 另行报道称，目前上线的 GPUs 只有约 1,200 个，因此公司试图融资推动已部署容量跃升，
              而不只是进行有限扩张。管理层还称，大部分资本将投入计算、网络和存储，较小部分用于软件和 R&D。在贷款方、契约、偿还概况和债务服务假设披露之前，
              资本充足性仍更像融资论点，而不是已被证明的资产负债表状况。
