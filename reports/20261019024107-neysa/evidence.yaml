evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: public-metrics
    missingEvidence: Current audited revenue, ARR, gross margin, cash burn, runway, customer count, and headcount.
    whyItMatters: >-
      Without current operating metrics, valuation, utilization quality, and go-to-market efficiency cannot be assessed
      with confidence.
    diligencePath: Request the latest management accounts, KPI pack, and cohort/customer summary used for board reporting.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: debt-terms
    missingEvidence: >-
      Debt tranche size-by-lender, collateral package, covenants, pricing, draw schedule, and any cross-default or
      supply-linked conditions.
    whyItMatters: >-
      The announced financing package overstates usable capital if the debt leg is delayed, conditional, or highly
      restrictive.
    diligencePath: Obtain the executed debt term sheet or credit agreement summary from management or lenders.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: governance-disclosure
    missingEvidence: Current board roster, post-2026 control rights, reserved matters, and sponsor governance structure.
    whyItMatters: >-
      Governance concentration and investor protections affect decision velocity, founder dependence, and downside
      control in a capital-intensive infrastructure business.
    diligencePath: Request the post-financing cap table, board composition, and principal shareholder agreement summary.
    relatedQuestionRefs:
      - QO002
      - QO006
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: minor
    topic: operating-footprint
    missingEvidence: Reconciled statement of live facilities versus planned build-out across Mumbai, Bangalore, and Hyderabad.
    whyItMatters: Facility ambiguity can cascade into overstated capacity, timeline, and capex assumptions in later chapters.
    diligencePath: Ask management for a site-by-site inventory covering commissioned versus planned GPU capacity.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: neysa-sam-som
    missingEvidence: >-
      Segment-level booked capacity, active customer counts, utilization, and contract mix needed to convert macro
      Indian AI demand into a Neysa-specific SAM/SOM.
    whyItMatters: >-
      Without a company-specific conversion bridge, valuation and market-share arguments can overstate how much of the
      sovereign-compute tailwind Neysa can actually capture.
    diligencePath: >-
      Request vertical pipeline, contracted capacity, utilization, and renewal data by cohort, then reconcile that
      against the 20,000-GPU deployment plan.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: independent-price-benchmark
    missingEvidence: >-
      An independent, workload-normalized benchmark comparing Neysa against hyperscalers and local peers on the same GPU
      SKUs, utilization assumptions, and compliance scope.
    whyItMatters: >-
      Cost and ROI claims are central to the adoption thesis, but the retained evidence does not show whether the
      claimed savings survive apples-to-apples benchmarking.
    diligencePath: >-
      Run a structured pilot or RFP benchmark with identical workloads across Neysa, AWS, Azure, Oracle, and a local
      peer, then compare true all-in cost, latency, and security review outcomes.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Realized enterprise pricing, discount schedules, reserved-capacity terms, and gross-margin bridge by workload
      type.
    whyItMatters: >-
      List pricing and vendor-authored comparison rows do not show whether Neysa can defend a durable economic advantage
      after incumbent response.
    diligencePath: >-
      Request customer contracts or anonymized deal summaries covering list price, discounts, duration, and utilization
      assumptions.
    relatedQuestionRefs:
      - QP003
      - QP008
    relatedTableRefs:
      - TP003
  - type: conflicting-data
    severity: material
    topic: gpu-capacity
    missingEvidence: Reconciled live-GPU inventory, committed deployments, and city-by-city rollout timing.
    whyItMatters: >-
      Conflicting public capacity numbers weaken precise benchmarking against local and global infrastructure
      alternatives.
    diligencePath: Obtain a management-signed infrastructure rollout schedule or third-party facility validation.
    relatedQuestionRefs:
      - QP002
    relatedTableRefs:
      - TP001
  - type: missing-source
    severity: material
    topic: switching-cost
    missingEvidence: Customer-level data on contract duration, renewals, migration effort, and concentration by sector or account.
    whyItMatters: >-
      Without retention and concentration evidence, the chapter cannot prove that Neysa's bundled platform creates
      durable lock-in rather than an early positioning edge.
    diligencePath: Request cohort retention, top-customer concentration, and renewal case studies with commercial terms.
    relatedQuestionRefs:
      - QP005
      - QP008
  - type: private-evidence-only
    severity: blocking
    topic: revenue-quality
    missingEvidence: >-
      Current revenue/ARR, backlog, contract duration, renewal rate, customer concentration, and net realized price
      after discounts.
    whyItMatters: >-
      Without the revenue base and quality signals, the published growth target and list prices cannot be underwritten
      into a credible forward revenue model.
    diligencePath: >-
      Request the latest board package or monthly operating review with revenue bridge, cohort retention, pipeline
      conversion, and top-customer concentration.
    relatedQuestionRefs:
      - QI001
      - QI002
      - QI006
  - type: missing-source
    severity: blocking
    topic: debt-terms
    missingEvidence: >-
      Lender identity, covenants, collateral package, amortization schedule, pricing, and debt service assumptions for
      the proposed $600 million debt layer.
    whyItMatters: >-
      Debt structure determines whether the announced financing is genuinely accretive scale capital or a future
      refinancing and covenant risk.
    diligencePath: >-
      Obtain the signed or near-final debt term sheet, model debt service coverage, and reconcile it against deployment
      phasing and utilization assumptions.
    relatedQuestionRefs:
      - QI007
      - QI008
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      GPU utilization by class, gross margin by workload, support burden, storage/network attach rates, and payback by
      customer segment.
    whyItMatters: >-
      Public anecdotes can show demand or product value, but they do not establish whether the core compute business
      improves or erodes margin at scale.
    diligencePath: >-
      Request cohort-level unit economics, utilization reports, and gross-margin waterfalls for direct customers versus
      partner-led accounts.
    relatedQuestionRefs:
      - QI004
      - QI005
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: liquidity
    missingEvidence: >-
      Cash on hand, monthly burn, runway, capex schedule, and contingency plan if the debt tranche or utilization ramp
      slips.
    whyItMatters: >-
      The equity announcement alone does not prove balance-sheet adequacy for a fast asset buildout or a
      slower-than-planned revenue ramp.
    diligencePath: >-
      Request current cash, 24-month cash flow forecast, deployment milestones, and downside cases for a delayed debt
      close or slower demand conversion.
    relatedQuestionRefs:
      - QI007
      - QI008
  - type: missing-source
    severity: material
    topic: public-trust-surface
    missingEvidence: >-
      Independent or official public documentation on uptime history, incident response, trust center artifacts, public
      API or developer docs, and scoped certification evidence.
    whyItMatters: >-
      Regulated buyers need more than marketing claims to underwrite operational maturity, security review friction, and
      integration effort.
    diligencePath: >-
      Request the trust-center package, status-history export, scoped ISO and SOC reports, and a roadmap for public docs
      or API references.
    relatedQuestionRefs:
      - QE006
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: production-usage-proof
    missingEvidence: >-
      Customer-level production references, utilization data, realized latency and cost benchmarks, and renewal or SLA
      metrics across the installed base.
    whyItMatters: >-
      These are the best tests of whether Neysa's full-stack positioning translates into durable product quality and
      attractive unit economics.
    diligencePath: >-
      Request the ten largest live deployments, utilization cohorts by workload type, support KPI dashboards, and
      customer reference calls.
    relatedQuestionRefs:
      - QE006
      - QE007
    relatedTableRefs:
      - TE001
      - TE002
  - type: missing-source
    severity: minor
    topic: developer-signal
    missingEvidence: >-
      Public practitioner-community evidence such as GitHub repos, SDK usage, package activity, forum traffic, or
      reference architectures that show platform adoption beyond sales narratives.
    whyItMatters: >-
      Developer-signal helps distinguish a repeatable platform from a services-heavy deployment motion that scales
      mainly through account teams.
    diligencePath: >-
      Ask Neysa for public repos, SDK or docs analytics, release notes, or community proxies that can be shared
      externally.
    relatedQuestionRefs:
      - QE006
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
