      - number: '1.3'
        title: Dated milestones and current watchpoints
        blocks:
          - type: paragraph
            body: >-
              The dated public record is strong on financing and partnership milestones but weaker on operating
              disclosures that would let an investor judge efficiency and quality of growth. The chronology shows a
              conventional startup formation in 2023, two venture rounds in 2024, a major sovereign infrastructure
              financing event in February 2026, and a September 2026 Mavenir partnership that broadens Neysa's route to
              enterprise and telecom demand. The gaps are equally important: public sources in the assigned pool do not
              provide audited revenue, ARR, gross margin, current headcount, customer count, or the covenants and
              security package behind the debt tranche. Even basic footprint language needs reconciliation because one
              source describes current capacity in Mumbai and Bangalore while another frames the next build-out around
              Mumbai and Hyderabad.
