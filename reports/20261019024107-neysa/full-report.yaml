      - number: '6.2'
        title: Public proof exists, but it is concentrated in one named workload
        blocks:
          - type: paragraph
            body: >-
              The clearest named proof of live usage is Mavenir, which says it selected Neysa to help develop and run
              its AI portfolio and is also using the same stack for internal AI transformation. That is stronger than a
              logo list because it describes an actual workload and planned go-to-market motion through operators,
              enterprises, and neocloud providers. WEKA's customer story adds operating evidence rather than customer
              identity: it says Neysa supports customers processing over 100 million tokens daily, went live on the
              storage layer in two days, and ran six months without a critical support event. Together these sources
              show real activity, but they still do not reveal how many paying accounts are active or how much usage
              sits with any one customer.
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
