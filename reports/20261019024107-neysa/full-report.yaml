chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, positioning, and observable scale
        blocks:
          - type: paragraph
            body: >-
              Neysa presents itself as a sovereign AI cloud built for Indian and other regulated workloads that need
              local control over compute, orchestration, and security rather than a generic hyperscaler stack. The
              retained evidence is directionally consistent on core identity: third-party reporting places the company
              in Mumbai and founded in 2023, while the homepage and partner surfaces frame Velocis as the integrated
              operating layer that turns GPU infrastructure into production AI capacity. Public scale evidence is still
              selective rather than audited. The clearest operating datapoint in the assigned pool comes from a partner
              case study that says Neysa was already running thousands of GPUs and supporting more than 100 million
              tokens per day, while the company-controlled customer surface shows named users but no disclosed customer
              count, spend, or retention base.
            claimRefs:
