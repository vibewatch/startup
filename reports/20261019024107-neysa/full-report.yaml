  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments skew enterprise, sovereign, and channel-assisted
        blocks:
          - type: paragraph
            body: >-
              Neysa's customer posture is positioned around organizations that need sovereign, high-performance AI
              infrastructure, not broad self-serve developer traffic. Official and independent sources consistently
              place the company in enterprise, government, and institutional settings, while also describing a second
              lane for startups and AI builders that need rental access to GPU capacity instead of owned hardware. The
              partner page suggests this demand is often intermediated by ISVs, consultancies, and technology vendors
              rather than sourced only through a direct field team, which matters because it broadens distribution but
              also obscures how much demand is direct, recurring, or concentrated in a small number of channel
              relationships.
            claimRefs:
              - CU001
              - CU002
