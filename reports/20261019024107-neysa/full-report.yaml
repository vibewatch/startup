      - number: '3.2'
        title: Differentiation rests on bundled platform depth and channel reach
        blocks:
          - type: paragraph
            body: >-
              Neysa's disclosed offer is not just raw GPU rental. Across its funding announcement, product comparisons,
              partner pages, and the Mavenir launch, the company positions Velocis as a sovereign AI cloud that bundles
              infrastructure, inference, orchestration, security, and channel-enablement layers. That bundled scope
              matters competitively because it gives Neysa more than one wedge in regulated accounts: local control,
              packaged software, and sales leverage through resellers, consultants, and telecom-linked go-to-market
              partners. The strongest public support for this argument is still company-controlled or partner proof, so
              the chapter treats it as a credible positioning edge rather than a verified long-term moat.
