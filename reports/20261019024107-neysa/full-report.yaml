  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Public financing and commercialization evidence support interest, but missing economic disclosure keeps the
      recommendation at research-more.
    data:
      nodes:
        - id: capital
          label: Capital and capacity
          body: $1.2B headline financing and a 20,000-GPU deployment plan create visible expansion potential.
        - id: market-wedge
          label: Market wedge
          body: Sovereign-AI positioning and regulated-account targeting give Neysa a differentiated pitch in India.
        - id: commercial-proof
          label: Commercial proof
          body: >-
            Public pricing, Mavenir integration, and partner-channel language suggest a route to monetize more than raw
            compute.
        - id: execution-risk
          label: Execution risk
          body: Supply-chain access, utilization, and competition can still break the economics even after financing.
        - id: missing-economics
          label: Missing economics
          body: >-
            Public sources do not disclose ARR, gross margin, utilization, customer concentration, or detailed debt
            terms.
        - id: decision
          label: Recommendation
          body: Research-more / stretched until diligence proves utilization, revenue quality, and downside protection.
      edges:
        - from: capital
          to: market-wedge
          label: funds expansion
        - from: market-wedge
          to: commercial-proof
          label: can create demand
        - from: commercial-proof
          to: execution-risk
          label: still faces delivery risk
        - from: execution-risk
          to: missing-economics
          label: still needs proof of quality
        - from: missing-economics
          to: decision
          label: keeps entry discipline high
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV012
      - CV013
      - CV014
