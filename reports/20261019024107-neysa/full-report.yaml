          Neysa proves relevance in sovereign AI and wins some enterprise demand, but the public record remains thin on
          economics and debt detail.
        - >-
          Visible valuation stays investable only with strict terms or more diligence; upside exists but is not yet
          underwritten.
        - Price support remains narrative-heavy, with competition and capex still material.
        - Best fit for the current public evidence set.
      - - Bear
        - >-
          Debt-funded expansion outruns utilization, hyperscalers compress pricing, and channel traction fails to offset
          capital intensity.
        - >-
          The visible valuation would look expensive and could face mark-down or down-round pressure if fundamentals
          disappoint.
        - Supply-chain constraints, customer concentration, and weak retention proof.
        - Most plausible if diligence cannot close current disclosure gaps.
    notes: >-
      These are qualitative scenario bands, not discounted-cash-flow outputs; public evidence is insufficient for a
      precise target return or exit multiple.
