            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
      - number: '6.3'
        title: Expansion paths are visible; retention and concentration are not
        blocks:
          - type: paragraph
            body: >-
              The available evidence points to two expansion loops. First, the partner program is designed to move
              regulated accounts from pilot or procurement friction into production by wrapping Neysa's infrastructure
              with solution, advisory, and technology partners. Second, Sacra describes a pricing ladder that runs from
              pay-per-use into reserved capacity and private cloud, which is the right shape for land-and-expand if
              workloads become stable. The problem is that none of the assigned sources publish renewal, churn,
              contract-length, or concentration statistics, so investors cannot tell whether this commercial design is
              actually compounding. Sacra's risk note also matters here: if hyperscalers compress GPU pricing, Neysa may
              have to defend accounts on service quality and sovereignty rather than on pure cost.
            claimRefs:
              - CU004
              - CU005
              - CU011
              - CU013
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Customer proof is real but still narrow
            body: >-
              Neysa has more than a logo wall: Mavenir describes actual workload usage, and WEKA reports meaningful
              traffic and reliability on the platform. The evidence is still narrow enough, however, that investors
              cannot yet infer account breadth, renewal health, or concentration.
            calloutType: insight
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU010
              - CU012
          - type: callout
            title: Retention quality is still an evidence gap
            body: >-
              The visible commercial path supports land-and-expand, but no assigned source publishes NRR, GRR, churn,
              renewal rates, or customer concentration. That makes customer durability one of the largest remaining
              diligence questions in the report.
            calloutType: risk
            claimRefs:
              - CU004
              - CU011
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk picture
        blocks:
          - type: paragraph
            body: >-
              The public record points to three top residual risks. First, financing and deployment are tightly linked:
              Neysa disclosed up to $600 million of committed equity and an intended additional $600 million of debt,
              then tied that capital to a plan to deploy more than 20,000 GPUs in India. That makes debt completion,
              covenant flexibility, and build-out cadence core underwriting questions rather than back-office details.
              Second, operating proof is improving but still early relative to the ambition. WEKA's case study shows
              real production usage and reliability progress, yet it also confirms Neysa had to harden storage
              architecture to keep GPU clusters productive under demanding workloads. Third, the commercial thesis
              depends on sovereign, regulated, and partner-assisted adoption. That helps differentiation today, but it
              also means security proof, partner alignment, and regulatory durability directly affect revenue quality
              and speed.
            claimRefs:
              - CR001
              - CR002
              - CR007
              - CR008
              - CR012
              - CR013
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR009
              - CR012
              - CR013
              - CR015
      - number: '7.2'
        title: Regulatory and security gating
        blocks:
          - type: paragraph
            body: >-
              Neysa's positioning is strongest where customers care about sovereign infrastructure, but that same
              positioning raises the bar for proof. The company says it serves financial services, healthcare, public
              services, and other regulated workloads, and its partner page explicitly uses ISO 27001 and SOC 2 Type II
              certification language to reassure BFSI, healthcare, and government buyers. That is a meaningful
              mitigation, but it is not the same as publishing the audit scope, exception history, data processing
              commitments, or incident posture for the full stack. Sacra's warning that regulatory or compliance shifts
              could weaken Neysa's differentiation reinforces that this is not a static checkbox risk: if
              sovereign-cloud rules loosen, or if regulated buyers demand a deeper audit package than the public site
              discloses, the sales cycle and win rate can deteriorate before any headline incident appears.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR013
              - CR015
      - number: '7.3'
        title: Scale and reliability under load
        blocks:
          - type: paragraph
            body: >-
              Operationally, Neysa is asking customers to believe it can move from a platform already serving production
              AI workloads into a much larger, capital-intensive infrastructure footprint without breaking service
              quality. The positive evidence is real: WEKA says Neysa is already operating thousands of GPUs, supporting
              customers processing more than 100 million tokens daily, and ran six months without a critical support
              ticket after introducing a specialized storage layer. The negative read is equally important: that same
              case study shows the original open-source layer was not sufficient for all high-performance GPU clusters,
              while external commentary frames the entire story as a test of whether Neysa can deploy capital quickly
              enough to meet demand. Service quality is also part of the company's differentiation versus hyperscalers,
              so any latency, uptime, or support slippage hits both gross margin and competitive positioning at once.
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR003
              - CR007
              - CR008
              - CR009
              - CR010
              - CR014
      - number: '7.4'
        title: Financing and partner dependencies
        blocks:
          - type: paragraph
            body: >-
              Neysa's partner ecosystem expands distribution and product reach, but it also creates counterparty
              dependencies. The company markets a co-sell and reseller model in which partners keep the customer
              relationship while Neysa supplies capacity and 24x7 infrastructure support. That can speed adoption,
              especially in advisory-led or regulated accounts, but it also risks slower feedback loops, margin give-up,
              and channel conflict if customer ownership or support boundaries blur. Product-side dependencies are
              visible too: Mavenir is integrating orchestration, billing, and policy controls on top of Neysa
              infrastructure, and WEKA remains part of the performance story for storage-intensive GPU workloads.
              Combined with the still-undocumented debt facility, this means the key thesis-break triggers are
              measurable: failure to close debt on workable terms, delays in bringing planned GPU capacity online, or
              evidence that high-touch partner sales are not converting into durable production usage.
            claimRefs:
              - CR001
              - CR009
              - CR011
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR009
              - CR011
              - CR015
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Financing structure is still an underwriting risk
            body: >-
              The equity headline is real, but the incremental debt is still only described as intended and subject to
              documentation. If the debt closes slowly or with restrictive terms, the 20,000-GPU rollout becomes a much
              riskier operating target.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR015
          - type: callout
            title: Reliability evidence is improving, not settled
            body: >-
              WEKA's case study is useful because it shows both sides of the story: Neysa has real workloads and recent
              stability, but it also had to evolve its storage design to keep high-performance GPU clusters productive.
            calloutType: insight
            claimRefs:
              - CR007
              - CR008
              - CR009
          - type: callout
            title: Thesis-break triggers are monitorable
            body: >-
              Public signs that would change the investment case quickly include debt terms that impair unit economics,
              commissioning delays against GPU rollout targets, or evidence that partner-led distribution is not
              converting into durable production usage.
            calloutType: assumption
            claimRefs:
              - CR002
              - CR011
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Price support and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The clearest public valuation facts are the February 2026 financing headline and the third-party valuation
              mark. Neysa said Blackstone and co-investors committed up to $600 million of equity and that the company
              intended to secure another $600 million of debt, while Tracxn and Sacra both attach a roughly $1.4 billion
              valuation or enterprise value to the round. That is enough to say the company has reached sponsor-backed
              scale, but not enough to say the visible price is supported by disclosed operating fundamentals. Public
              sources show pricing, product scope, partner motion, and expansion ambition; they do not provide audited
              ARR, gross margin, utilization, customer concentration, or debt-covenant detail. On that evidence set, the
              disciplined call is research-more with a stretched valuation stance rather than buy.
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV011
              - CV012
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV012
              - CV013
              - CV014
      - number: '8.2'
        title: Thesis vs. anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The constructive case is that Neysa has built several ingredients investors usually want before scale
              capital lands: a sovereign-compute narrative aligned with IndiaAI, explicit GPU deployment plans, a
              partner-first route to market, and public price cards that make the product more concrete than many
              private AI-infrastructure stories. Economic Times and Neysa's own partner material both imply a
              channel-assisted commercialization model that could speed utilization if regulated accounts convert. The
              anti-thesis is that this is still a capital-intensive infrastructure bet facing hyperscaler competition,
              hardware-supply dependence, and weak public disclosure on the exact economics that should bridge a $1.4
              billion mark to durable returns. Sacra's risk framing and the inconsistent headcount record both reinforce
              that the company is easier to underwrite as a strategic option than as a de-risked compounding asset.
            claimRefs:
              - CV002
              - CV005
              - CV007
              - CV010
              - CV011
              - CV012
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV006
              - CV011
              - CV012
              - CV014
      - number: '8.3'
        title: Scenario logic and diligence asks
        blocks:
          - type: paragraph
            body: >-
              The bull case requires Neysa to turn financed capacity into recurring, high-utilization enterprise demand
              while preserving pricing discipline and using the software layer to create switching costs above plain GPU
              resale. The base case is more modest: the company proves relevance in sovereign and regulated accounts,
              but the public record remains too thin on margins, customer quality, and debt structure to justify
              aggressive entry at the visible mark. The bear case is not just slower growth; it is a combination of
              utilization slippage, price pressure from hyperscalers or local rivals, and debt-funded expansion that
              outruns contracted demand. Before underwriting a price-sensitive positive recommendation, diligence should
              force disclosure on debt terms, utilization by cluster, customer concentration, reservation mix, gross
              margin, and what proportion of the software stack materially lifts retention or wallet share.
            claimRefs:
              - CV005
              - CV006
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Current call
            body: >-
              Public evidence supports keeping Neysa in research-more rather than forcing a buy call at the visible
              valuation; a more positive view needs hard disclosure on debt structure, utilization, margin, and customer
              quality.
            calloutType: recommendation
            claimRefs:
              - CV012
              - CV013
