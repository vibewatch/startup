      - number: '4.3'
        title: Capital needs and financing dependency
        blocks:
          - type: paragraph
            body: |-
              The strongest financial fact pattern is capital intensity. Blackstone and co-investors
              committed up to $600 million of equity, while Neysa intends to secure another
              $600 million of debt financing to support a deployment target above 20,000 GPUs in
              India. TechCrunch separately reports that only about 1,200 GPUs are live today, so
              the company is trying to finance a step-change in installed capacity rather than a
              modest expansion. Management also says most of the capital will go into compute,
              networking, and storage, with a smaller portion for software and R&D. Until lenders,
              covenants, repayment profile, and debt service assumptions are disclosed, capital
              adequacy remains more a financing thesis than a proven balance-sheet position.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI011
              - CI014
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: |-
              Neysa's financial story is plausible but incomplete. The company appears to be
              selling a bundled sovereign-AI infrastructure stack into regulated Indian accounts,
              using a mix of direct enterprise sales, partners, and integrated solution launches.
              That can support attractive contract values if utilization ramps and support costs
              stay controlled. The missing inputs are the ones investors actually need to price
              execution risk: current revenue, backlog, utilization by GPU class, gross margin,
              customer concentration, net realized price after discounts, cash on hand, burn,
              runway, and the documentation behind the proposed debt layer. Until those are
              disclosed, the chapter supports a "research more" posture rather than an
              underwritten revenue-quality or margin thesis.
            claimRefs:
              - CI006
              - CI009
              - CI010
              - CI013
              - CI014
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Debt-enabled scale is the core financial risk
            body: >-
              Neysa's public capital story is unusually large relative to its disclosed current operating base: it plans
              to pair $600 million of equity with up to $600 million of debt while scaling from about 1,200 live GPUs
              toward a >20,000 GPU target.
            calloutType: risk
            claimRefs:
              - CI001
              - CI002
              - CI003
          - type: callout
            title: Channel economics may help growth before revenue quality is proven
            body: >-
              The partner-first model and token-metered Mavenir launch suggest Neysa is trying to turn infrastructure
              into recurring channel and platform revenue, but the current public record still lacks take-rates,
              utilization, and portfolio-wide gross-margin proof.
            calloutType: insight
            claimRefs:
              - CI006
              - CI008
              - CI013
              - CI014
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Delivered product and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Public materials consistently describe Neysa as a full-stack AI infrastructure provider, not a narrow GPU
              broker. The official surface centers on Velocis, which Neysa says spans AI infrastructure, performance
              optimisation, and AI/ML security, while Moneycontrol and Startoholics both describe a GPU-as-a-Service
              model for enterprises that want training and inference capacity without building their own data-center
              stack. The workflow Neysa is selling is also broader than raw compute: its own product page says teams can
              train, experiment, test, deploy, and monitor from one dashboard, and external coverage echoes that Neysa
              bundles observability, security, and governance around the compute layer. The result is a product pitch
              built around moving customers from experimentation into production, especially where India-local hosting,
              cost control, and operational simplicity matter more than the broadest global cloud catalog.
            claimRefs:
