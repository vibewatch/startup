              Official material verifies a core stack of GPU infrastructure, orchestration, security, and observability,
              while independent reporting adds that the 2026 Mavenir partnership contributes agent workflows, policy
              controls, usage tracking, token-level metering, and a sovereign control plane oriented toward enterprise
              and telecom use cases. Partner and analyst material then fills in more of the operating picture: Weka
              describes a dual-layer storage design built for GPU-intensive workloads, and Sacra maps a broader software
              surface that includes developer workspaces, MLOps, observability, and model security. Those latter details
              are directionally useful, but because they are not matched by a public official technical document in the
              assigned pool, they should be treated as partial architecture evidence rather than final proof of exact
