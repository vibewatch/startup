      - number: '3.3'
        title: Public evidence does not yet prove durable economic lock-in
        blocks:
          - type: paragraph
            body: >-
              The main competitive challenge is that Neysa's apparent advantages remain easier to see in product
              narrative and list pricing than in independently verified operating metrics. Neysa's comparison blog shows
              lower starting prices than several named alternatives, but that table is vendor-authored and says little
              about reserved-capacity discounts, workload mix, or realized gross margins. Independent analyst commentary
              also highlights the most important downside scenario: hyperscalers can cut prices or benefit if
              data-sovereignty rules loosen, which would weaken Neysa's ability to charge a premium for India-first
              infrastructure. The result is a competitive story that is plausible and strategically coherent, but still
              short of proving that customers will stay, expand, and renew on economically attractive terms once the
              larger incumbents respond.
            claimRefs:
              - CP008
