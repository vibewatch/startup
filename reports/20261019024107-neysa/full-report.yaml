      - number: '1.2'
        title: Founders, financing path, and stakeholder map
        blocks:
          - type: paragraph
            body: >-
              Founder-market fit is a major part of the Neysa story. Sharad Sanghi and Anindya Das are presented not as
              first-time startup operators but as the Netmagic leadership pair returning to a new infrastructure cycle,
              which helps explain the unusually fast capital formation. The public arc in the retained pool moves from a
              roughly $20 million seed round in early 2024 to a $30 million Series A in late 2024, then to a February
              2026 financing package made up of $600 million in equity and an intended $600 million debt facility. That
              speed is strategically useful for GPU procurement and market signaling, but it also raises diligence
              questions around control rights, the exact debt structure, and how much of the announced capital is
              immediately available versus contingent.
