company:
  name: Neysa
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Neysa is a Mumbai-based sovereign AI cloud infrastructure company founded in
    2023 by Netmagic veterans Sharad Sanghi and Anindya Das. Public evidence
    supports a rapid financing arc from 2024 venture rounds to a Blackstone-led
    2026 package that put the company at roughly a $1.4 billion valuation, but
    revenue, headcount, customer count, governance rights, and debt terms
    remain materially under-disclosed in the assigned public-source set.
sections:
  - id: identity-and-offer
    title: Identity, positioning, and observable scale
    body: >-
      Neysa presents itself as a sovereign AI cloud built for Indian and other
      regulated workloads that need local control over compute, orchestration,
      and security rather than a generic hyperscaler stack. The retained
      evidence is directionally consistent on core identity: third-party
      reporting places the company in Mumbai and founded in 2023, while the
      homepage and partner surfaces frame Velocis as the integrated operating
      layer that turns GPU infrastructure into production AI capacity. Public
      scale evidence is still selective rather than audited. The clearest
      operating datapoint in the assigned pool comes from a partner case study
      that says Neysa was already running thousands of GPUs and supporting more
      than 100 million tokens per day, while the company-controlled customer
      surface shows named users but no disclosed customer count, spend, or
      retention base.
    claimRefs: [CO001, CO002, CO009, CO010, CO011, CO013, CO014, CO015]
    tableRefs: [TO001]
  - id: leadership-and-capital-stack
    title: Founders, financing path, and stakeholder map
    body: >-
      Founder-market fit is a major part of the Neysa story. Sharad Sanghi and
      Anindya Das are presented not as first-time startup operators but as the
      Netmagic leadership pair returning to a new infrastructure cycle, which
      helps explain the unusually fast capital formation. The public arc in the
      retained pool moves from a roughly $20 million seed round in early 2024
      to a $30 million Series A in late 2024, then to a February 2026 financing
      package made up of $600 million in equity and an intended $600 million
      debt facility. That speed is strategically useful for GPU procurement and
      market signaling, but it also raises diligence questions around control
      rights, the exact debt structure, and how much of the announced capital is
      immediately available versus contingent.
    claimRefs: [CO003, CO004, CO005, CO006, CO007, CO008]
    tableRefs: [TO002, TO003]
  - id: milestones-and-watchpoints
    title: Dated milestones and current watchpoints
    body: >-
      The dated public record is strong on financing and partnership milestones
      but weaker on operating disclosures that would let an investor judge
      efficiency and quality of growth. The chronology shows a conventional
      startup formation in 2023, two venture rounds in 2024, a major sovereign
      infrastructure financing event in February 2026, and a September 2026
      Mavenir partnership that broadens Neysa's route to enterprise and telecom
      demand. The gaps are equally important: public sources in the assigned
      pool do not provide audited revenue, ARR, gross margin, current headcount,
      customer count, or the covenants and security package behind the debt
      tranche. Even basic footprint language needs reconciliation because one
      source describes current capacity in Mumbai and Bangalore while another
      frames the next build-out around Mumbai and Hyderabad.
    claimRefs: [CO004, CO005, CO006, CO007, CO008, CO011, CO012, CO016]
    figureRefs: [FO001]
