      - ["Teachers' Venture Growth", "Co-investor", "Named as a participant in the February 2026 round, signaling institutional validation beyond the lead sponsor.", "Verify check size, information rights, and whether investment was primary only."]
      - ["TVS Capital", "Co-investor", "Listed among the February 2026 investors and therefore relevant to cap-table concentration and alignment.", "Clarify ownership percentage and strategic versus financial role."]
