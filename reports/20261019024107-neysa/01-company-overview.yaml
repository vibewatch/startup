      - ["Nexus Venture Partners", "Repeat investor", "Appears in the early rounds and again among the February 2026 participants, indicating continued sponsor support.", "Map pro-rata behavior, current ownership, and any protective provisions that survive the Blackstone round."]
      - ["Z47 / Matrix Partners India", "Seed and Series A backer", "Helped anchor the earliest public financing and therefore matters for founder support and dilution history.", "Confirm current stake after the 2026 recapitalization and any continuing board role."]
      - ["NTTVC", "Early backer", "Participated in early financing and adds ecosystem relevance given the founders' Netmagic history.", "Verify whether NTT relationships translate into material commercial or procurement leverage."]
      - ["Mavenir", "Strategic commercial partner", "September 2026 partnership expands go-to-market reach into telecom, enterprise, and neocloud channels.", "Quantify pipeline contribution, exclusivity, revenue-sharing, and whether the partnership is primarily marketing or already producing bookings."]
