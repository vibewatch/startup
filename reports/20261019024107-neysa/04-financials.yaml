    notes: "These are official list prices or program terms; they should not be read as realized revenue, gross margin, or customer-specific contract pricing."
    claimRefs: [CI004, CI005, CI006]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - ["Live GPU base", "~1,200 GPUs live", "Medium", "Starting installed base versus future buildout informs utilization and ramp risk", "Provide installed, billable, and utilized GPU counts by class"]
      - ["Planned capacity", ">20,000 GPUs targeted", "High", "Shows capex and debt intensity, and sets the denominator for utilization assumptions", "Provide phased deployment schedule and committed customer demand against each tranche"]
      - ["Revenue growth target", "Management says revenue will more than triple next year", "Medium", "Indicates ambition but not the current base, bookings quality, or conversion certainty", "Provide current ARR/revenue, signed backlog, and quarterly bridge"]
      - ["Customer efficiency anecdote", "144B tokens/month customer; total cost -40%; latency to 2 seconds", "Low", "Useful value proof, but a single company-curated example is not a portfolio-level margin metric", "Provide cohort-level customer outcomes and realized gross margins by workload type"]
      - ["Headcount proxy", "TechCrunch: 110 employees; LinkedIn: 51-200 company size band", "Medium", "Suggests a relatively lean operating base compared with the planned infrastructure ramp", "Provide functional headcount plan and support/service staffing assumptions"]
      - ["Gross margin / CAC payback / burn / runway", null, "Low", "Core underwriting inputs are absent from the assigned public evidence", "Provide audited gross margin, monthly burn, cash balance, runway, CAC payback, and debt service coverage"]
    notes: "Null means not publicly disclosed in the assigned evidence pool; every missing metric is a diligence blocker rather than a hidden assumption."
    claimRefs: [CI002, CI003, CI010, CI012, CI014]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: "Public evidence implies a usage-based infrastructure model whose gross-profit sensitivity sits on utilization, pricing discipline, and support intensity."
    data:
      nodes:
        - label: "Regulated AI workloads"
          detail: "Target demand centers include BFSI, healthcare, government/public services, research, startups, and telecom."
        - label: "Sovereign GPU and platform bundle"
          detail: "Neysa sells GPU infrastructure with orchestration, observability, security, and performance optimisation."
        - label: "Usage-based billing"
          detail: "Public surfaces emphasize per-minute/hour billing plus published hourly and reserved GPU rates."
        - label: "Partner-assisted monetization"
          detail: "Resellers and solution partners keep the customer relationship and add their own recurring services revenue."
        - label: "Infrastructure and support cost base"
          detail: "Capital is earmarked mainly for compute, networking, storage, software buildout, and 24x7 infrastructure support."
        - label: "Gross profit sensitivity"
          detail: "Economics improve only if utilization ramps and support intensity stays below the margin created by compute pricing."
    approximationNotes: "Conceptual operating bridge synthesized from published pricing, partner, and funding materials; it is not a company-disclosed P&L waterfall."
    claimRefs: [CI004, CI005, CI006, CI007, CI011, CI013]
callouts:
  - calloutType: risk
    title: Debt-enabled scale is the core financial risk
    body: "Neysa's public capital story is unusually large relative to its disclosed current operating base: it plans to pair $600 million of equity with up to $600 million of debt while scaling from about 1,200 live GPUs toward a >20,000 GPU target."
    claimRefs: [CI001, CI002, CI003]
  - calloutType: insight
    title: Channel economics may help growth before revenue quality is proven
    body: "The partner-first model and token-metered Mavenir launch suggest Neysa is trying to turn infrastructure into recurring channel and platform revenue, but the current public record still lacks take-rates, utilization, and portfolio-wide gross-margin proof."
    claimRefs: [CI006, CI008, CI013, CI014]
