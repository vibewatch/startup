      - ["NVIDIA L40S managed instance", "$1.95/hr; $713.96/month", "Usage-based or 36-month reserved", "No public occupancy, support, or storage attach pricing disclosures", "Neysa AI Cloud pricing page"]
      - ["NVIDIA H100 SXM managed instance", "$4.39/hr; $1,779.96/month", "Usage-based or 36-month reserved", "No public premium-support, networking, or utilization floor terms", "Neysa AI Cloud pricing page"]
