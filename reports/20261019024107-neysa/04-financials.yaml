company:
  name: Neysa
chapter:
  number: 4
  title: Financials
  summary: >-
    Neysa has observable usage-based compute monetization, partner-led channel mechanics,
    and a large debt-plus-equity expansion plan, but the public evidence in this pool still
    stops at list pricing, capital plans, and isolated efficiency anecdotes rather than
    disclosed revenue, margin, or runway. That leaves revenue quality and capital adequacy
    directionally understandable but not yet underwritable.
sections:
  - id: revenue-model
    title: Revenue model and monetization surface
    body: |-
      The public revenue surface is broader than raw GPU rental. Neysa publishes managed
      GPU list pricing, markets transparent per-minute or hourly billing, and frames
      Velocis as a bundled platform spanning infrastructure, orchestration, security, and
      observability rather than a bare compute SKU. Its partner program adds a second
      route to market: resellers and system integrators keep the customer relationship and
      monetize services plus recurring consumption on top of Neysa capacity. The Mavenir
      launch extends that logic into token-metered telco and neocloud deployments, but
      none of the retained sources disclose realized pricing, discounting, or mix by
      product line.
    claimRefs: [CI004, CI005, CI006, CI007, CI008, CI014]
    tableRefs: [TI001]
  - id: pricing-and-unit-economics
    title: Pricing signals and unit-economics proxies
    body: |-
      Public pricing exists, but it is still list pricing rather than proof of revenue
      quality. Neysa's own comparison page advertises hourly and 36-month reserved prices
      for L4, L40S, and H100 instances, while product materials emphasize spot-aware
      scheduling, multi-tiered GPU pricing, and "tokens-per-dollar" efficiency. The best
      operating proof in this pool is still anecdotal: a company-shared conference recap
      says one customer processed 144 billion tokens a month, cut total cost by 40%, and
      reduced latency to two seconds. That is directionally helpful, but it does not
      answer portfolio-wide gross margin, payback, or support-burden questions.
    claimRefs: [CI004, CI005, CI010, CI012, CI013, CI014]
    tableRefs: [TI002, TI003]
    figureRefs: [FI001]
  - id: capital-needs-and-balance-sheet-risk
    title: Capital needs and financing dependency
    body: |-
      The strongest financial fact pattern is capital intensity. Blackstone and co-investors
      committed up to $600 million of equity, while Neysa intends to secure another
      $600 million of debt financing to support a deployment target above 20,000 GPUs in
      India. TechCrunch separately reports that only about 1,200 GPUs are live today, so
      the company is trying to finance a step-change in installed capacity rather than a
      modest expansion. Management also says most of the capital will go into compute,
      networking, and storage, with a smaller portion for software and R&D. Until lenders,
      covenants, repayment profile, and debt service assumptions are disclosed, capital
      adequacy remains more a financing thesis than a proven balance-sheet position.
    claimRefs: [CI001, CI002, CI003, CI011, CI014]
  - id: underwriting-verdict
    title: Financial verdict and diligence blockers
    body: |-
      Neysa's financial story is plausible but incomplete. The company appears to be
      selling a bundled sovereign-AI infrastructure stack into regulated Indian accounts,
      using a mix of direct enterprise sales, partners, and integrated solution launches.
      That can support attractive contract values if utilization ramps and support costs
      stay controlled. The missing inputs are the ones investors actually need to price
      execution risk: current revenue, backlog, utilization by GPU class, gross margin,
      customer concentration, net realized price after discounts, cash on hand, burn,
      runway, and the documentation behind the proposed debt layer. Until those are
      disclosed, the chapter supports a "research more" posture rather than an
      underwritten revenue-quality or margin thesis.
    claimRefs: [CI006, CI009, CI010, CI013, CI014]
