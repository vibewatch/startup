      severity: material
      topic: named-customer-proof
      missingEvidence: More named production customers, with use case, status, and outcome evidence beyond Mavenir.
      whyItMatters: The current public record proves some adoption but not breadth across the installed base.
      diligencePath: Request a top-customer list with deployment stage, ARR, references, and case studies suitable for diligence.
      relatedQuestionRefs: [QU003]
      relatedTableRefs: [TU003]
    - type: missing-source
      severity: material
      topic: customer-concentration
