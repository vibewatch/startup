company:
  name: Neysa
chapter:
  number: 6
  title: Customers
  summary: >-
    Public customer evidence shows Neysa selling primarily into enterprise,
    public-sector, and partner-led workflows rather than consumer use cases.
    The strongest named deployment proof is Mavenir's decision to develop and
    run AI products on Neysa, while WEKA's case study adds live-usage proxies
    such as over 100 million daily tokens and six months without critical
    issues. What remains missing is the durability layer: no assigned source
    discloses customer count, renewal rates, NRR/GRR, churn, contract length,
    or top-customer concentration.
sections:
  - id: customer-segments
    title: Customer segments skew enterprise, sovereign, and channel-assisted
    body: >-
      Neysa's customer posture is positioned around organizations that need
      sovereign, high-performance AI infrastructure, not broad self-serve
      developer traffic. Official and independent sources consistently place
      the company in enterprise, government, and institutional settings, while
      also describing a second lane for startups and AI builders that need
      rental access to GPU capacity instead of owned hardware. The partner page
      suggests this demand is often intermediated by ISVs, consultancies, and
      technology vendors rather than sourced only through a direct field team,
      which matters because it broadens distribution but also obscures how much
      demand is direct, recurring, or concentrated in a small number of channel
      relationships.
    claimRefs: [CU001, CU002, CU003, CU004, CU011]
    tableRefs: [TU001]
  - id: public-adoption-proof
    title: Public proof exists, but it is concentrated in one named workload
    body: >-
      The clearest named proof of live usage is Mavenir, which says it selected
      Neysa to help develop and run its AI portfolio and is also using the same
      stack for internal AI transformation. That is stronger than a logo list
      because it describes an actual workload and planned go-to-market motion
      through operators, enterprises, and neocloud providers. WEKA's customer
      story adds operating evidence rather than customer identity: it says
      Neysa supports customers processing over 100 million tokens daily, went
      live on the storage layer in two days, and ran six months without a
      critical support event. Together these sources show real activity, but
      they still do not reveal how many paying accounts are active or how much
      usage sits with any one customer.
    claimRefs: [CU006, CU007, CU008, CU009, CU010, CU012, CU014]
    tableRefs: [TU002, TU003]
    figureRefs: [FU001]
  - id: durability-expansion-and-risk
    title: Expansion paths are visible; retention and concentration are not
    body: >-
      The available evidence points to two expansion loops. First, the partner
      program is designed to move regulated accounts from pilot or procurement
      friction into production by wrapping Neysa's infrastructure with solution,
      advisory, and technology partners. Second, Sacra describes a pricing
      ladder that runs from pay-per-use into reserved capacity and private
      cloud, which is the right shape for land-and-expand if workloads become
      stable. The problem is that none of the assigned sources publish renewal,
      churn, contract-length, or concentration statistics, so investors cannot
      tell whether this commercial design is actually compounding. Sacra's risk
      note also matters here: if hyperscalers compress GPU pricing, Neysa may
      have to defend accounts on service quality and sovereignty rather than on
      pure cost.
    claimRefs: [CU004, CU005, CU011, CU013]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Public evidence
      - Strategic value
      - Gap
    rows:
      - - Regulated enterprises
        - Enterprise AI, infrastructure, and platform teams are the likely users and budget holders.
        - Official releases and channel messaging consistently frame Neysa around enterprise deployment.
        - Core direct segment with sovereign-compute and compliance needs.
        - No revenue split, ACV, or active-account count is disclosed.
      - - Public-sector and institutional workloads
        - Government entities and public institutions appear as sponsor or procurement-side buyers.
        - CRN and Neysa's Blackstone release both cite government or public-service demand.
        - Aligns Neysa with IndiaAI and sovereignty narratives.
        - No named public-sector deployment, tender size, or renewal evidence is public.
      - - Startups and AI builders
        - Founders, ML teams, and research-heavy builders are positioned as users of rented GPU capacity.
        - Concepts and Careers and WEKA both describe startup-oriented usage alongside enterprise demand.
        - Helps utilization and funnel breadth below large enterprise accounts.
        - No logo count, conversion rate, or cohort retention is public.
      - - Channel-assisted accounts
        - ISVs, consultancies, and technology partners influence demand while the end customer relationship may stay shared or indirect.
        - Neysa's partner program offers co-sell, rebates, and implementation support.
        - Extends reach into accounts where procurement or delivery is partner-led.
        - Channel mix, partner contribution, and margin leakage are undisclosed.
    notes: >-
      Public evidence identifies segment intent and route to market, but no
      assigned source breaks customers or revenue by segment; qualitative cells
      reflect that limitation.
    claimRefs: [CU001, CU002, CU003, CU004, CU011]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Planned GPU supply
        - 20,000+ GPUs planned in India
        - 2026-02 onward
        - Blackstone / CRN / Sacra
        - High
        - Suggests Neysa is scaling capacity for larger enterprise and public-sector demand.
        - No public disclosure of currently live deployed GPUs, utilization, or committed customer reservations.
      - - Reported current fleet baseline
        - 1,200 GPUs before the funded expansion
        - 2026
        - Sacra
        - Medium
        - Indicates the scale jump expected from the Blackstone financing.
        - Not officially confirmed in the assigned company materials.
      - - Live workload proxy
        - 100M+ tokens processed daily
        - Current in case-study framing
        - WEKA
        - Medium
        - Confirms meaningful customer activity on the platform.
        - No public active-customer count, per-customer mix, or revenue linkage.
      - - Implementation and reliability proxy
        - Full deployment in 2 days; zero critical issues / support tickets in 6 months
        - Current in case-study framing
        - WEKA
        - Medium
        - Suggests enterprise-grade onboarding and operating stability.
        - No sample size, contract value, or coverage of the broader customer base.
    notes: >-
      These are adoption proxies, not cohort metrics. The assigned evidence does
      not publish customers, seats, NRR, GRR, churn, or renewal cohorts, so
      the table separates visible operating signals from missing denominators.
    claimRefs: [CU008, CU009, CU010, CU014]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer / proof
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - - Mavenir
        - Telecom software provider serving operators, enterprises, and neocloud providers
        - Selected Neysa to help develop and run its AI portfolio; also uses the same stack for internal AI transformation
        - Production-oriented public proof with active development and internal usage claims
        - Strongest named workload proof in the assigned pool
        - No contract value, usage volume, term length, or renewal status is disclosed
      - - Codemate / Pipeshift / Navana partner listings
        - AI ISV / solution partner ecosystem
        - Listed by Neysa as build-and-co-sell partners on top of its infrastructure
        - Commercial proof of ecosystem participation, not end-customer production proof
        - Shows route-to-market breadth beyond direct sales
        - Logos do not prove paid production deployments or retention
      - - Regulated BFSI / healthcare / government accounts
        - Compliance-sensitive end accounts reached through partner-led procurement
        - Neysa positions single-tenant capacity plus ISO 27001 and SOC 2 Type II to clear security reviews
        - Procurement-to-production enablement proof rather than named customer disclosure
        - Shows which account types Neysa thinks are easiest to unlock with sovereignty and compliance
        - No named logos, contract sizes, or go-live counts are public
    notes: >-
      Coverage is intentionally partial: the assigned evidence contains one
      clearly named workload user (Mavenir) plus ecosystem and procurement proof,
      but not a broad list of named end customers in production.
    enumerationScope:
      coverage: partial
      basis: >-
        Partial enumeration of public customer proof from the assigned source
        pool as of 2026-10-19, covering one named workload user and two weaker
        commercial proof surfaces rather than the full installed base.
    claimRefs: [CU004, CU005, CU006, CU007, CU012]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Neysa's public customer motion runs from sovereignty-sensitive demand into
      partner-assisted production and then into higher-commitment capacity
      models, but durability proof remains thin.
    data:
      items:
        - label: Sovereign AI need identified
          actor: Enterprises, public institutions, and AI builders
          phase: Demand creation
          channel: Direct and policy-driven
          touchpoints:
            - Need for in-country GPU capacity
            - Data-residency and control requirements
        - label: Security and procurement screening
          actor: Regulated accounts
          phase: Qualification
          channel: Direct plus partner influence
          touchpoints:
            - ISO 27001 / SOC 2 Type II positioning
            - Single-tenant and hybrid deployment options
        - label: Solution and partner packaging
          actor: ISVs, consultancies, and technology partners
          phase: Design-in
          channel: Co-sell / advisory / ecosystem
          touchpoints:
            - Joint proposals and deal support
            - Build-on-Neysa or resell motion
        - label: Production launch
          actor: Named workload users such as Mavenir
          phase: Go-live
          channel: Direct plus joint commercial motion
          touchpoints:
            - Develop and run AI portfolio on Neysa
            - Offer governed AI services to operators and enterprises
        - label: Ongoing workload consumption
          actor: Existing customer base
          phase: Operations
          channel: Platform usage
          touchpoints:
            - 100M+ tokens processed daily
            - Two-day deployment and six-month reliability proxy
        - label: Expansion and contract deepening
          actor: Larger or more stable accounts
          phase: Expansion
          channel: Reserved capacity / private cloud / channel upsell
          touchpoints:
            - Reserved-capacity and private-cloud offers
            - More joint accounts through partners
    claimRefs: [CU004, CU005, CU006, CU007, CU008, CU009, CU010, CU011]
callouts:
  - calloutType: insight
    title: Customer proof is real but still narrow
    body: >-
      Neysa has more than a logo wall: Mavenir describes actual workload usage,
      and WEKA reports meaningful traffic and reliability on the platform. The
      evidence is still narrow enough, however, that investors cannot yet infer
      account breadth, renewal health, or concentration.
    claimRefs: [CU006, CU007, CU008, CU010, CU012]
  - calloutType: risk
    title: Retention quality is still an evidence gap
    body: >-
      The visible commercial path supports land-and-expand, but no assigned
      source publishes NRR, GRR, churn, renewal rates, or customer concentration.
      That makes customer durability one of the largest remaining diligence
      questions in the report.
    claimRefs: [CU004, CU011, CU013]
