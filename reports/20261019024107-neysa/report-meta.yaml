companyProfile:
  summary: >-
    Neysa is an India-based AI cloud infrastructure company that sells Velocis, a sovereign GPU-backed platform for
    enterprises, public institutions, startups, and AI builders. Public evidence shows a Blackstone-led financing
    package intended to scale capacity, plus a product stack spanning GPU compute, orchestration, security, and
    partner-led deployment paths, but not the operating economics needed to underwrite a premium valuation.
