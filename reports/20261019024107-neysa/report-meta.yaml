  topStrengths:
    - Sovereign India-resident AI infrastructure narrative is clear and aligned with regulated-account needs.
    - Blackstone-led scale capital gives Neysa a credible path to expand GPU capacity and platform depth.
    - Public product and partner materials show a concrete commercial stack, not just a raw compute pitch.
  topRisks:
    - Revenue quality, margin profile, utilization, and debt protections remain undisclosed or only partially evidenced.
    - Hyperscaler price competition and hardware-supply dependence could compress economics.
    - Customer concentration, renewal behavior, and long-term retention are still not public.
  unresolvedGaps:
    - No audited revenue, backlog, gross margin, burn, or cash-runway figures are public.
    - Debt tranche terms, security package, covenants, and refinancing assumptions remain undisclosed.
    - Public evidence on customer concentration, retention, contract duration, and renewal rates is shallow.
    - Public headcount and live GPU inventory remain inconsistent across sources.
