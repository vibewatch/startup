    title: "Recommendation summary table"
    columns: ["Lens", "Current view", "Evidence", "Decision implication"]
    rows:
      - ["Recommendation", "research-more", "Scale financing and product/partner proof are public; unit economics and debt detail are not.", "Do not underwrite a buy case from public evidence alone."]
      - ["Confidence", "medium", "Funding and valuation are corroborated, but key economics remain private or coarse.", "Conviction can improve only after management diligence and data-room support."]
      - ["Risk rating", "high", "Capital intensity, utilization risk, supply-chain dependence, and hyperscaler competition remain material.", "Assume downside is execution-sensitive even after the round."]
      - ["Valuation stance", "stretched", "Public price discovery centers on ~$1.4B while disclosed revenue and margin evidence remain incomplete.", "Demand price or terms discipline before committing capital."]
      - ["Entry discipline", "Only with fresh diligence and favorable terms", "Need debt, utilization, customer concentration, and gross-margin disclosure.", "Absent those datapoints, keep Neysa on a watchlist rather than force precision."]
    notes: "Judgment rows combine public financing and operating evidence; they are not substitutes for audited revenue, margin, or debt disclosures."
    claimRefs: ["CV001", "CV003", "CV011", "CV012", "CV013"]
  - id: "TV002"
    title: "Thesis / anti-thesis table"
    columns: ["Direction", "Argument", "Evidence", "What would change the view"]
    rows:
      - ["Bull", "Sovereign-AI positioning plus a $1.2B financing package gives Neysa unusual scale for an India-focused AI cloud.", "Blackstone-led financing, 20,000 GPU ambition, India-focused positioning.", "Live proof that capacity is contracted and utilized at attractive margins would strengthen the thesis."]
      - ["Bull", "Public pricing and partner-led distribution suggest Neysa is trying to monetize more than raw GPU resale.", "Managed GPU price cards, Mavenir integration, reseller/ISV/system-integrator program.", "Evidence that software and channel motion drive retention or attach rates would improve quality of revenue."]
      - ["Anti-thesis", "A visible $1.4B valuation is ahead of public proof on ARR, gross margin, NRR, and debt structure.", "Third-party valuation marks exist, but disclosure on operating quality is sparse.", "Audited or management-backed operating metrics could narrow the support gap."]
      - ["Anti-thesis", "The model is exposed to utilization, hardware-supply, and hyperscaler price competition.", "Sacra risk note and Moneycontrol both flag execution and supply-chain dependence.", "Long-term reserved contracts, strong utilization, and protected supply would reduce downside."]
    notes: "Arguments synthesize cited sources; 'what would change the view' describes diligence or execution evidence needed to move the recommendation."
    claimRefs: ["CV001", "CV002", "CV003", "CV005", "CV006", "CV011", "CV012", "CV014"]
  - id: "TV003"
    title: "Bull / base / bear scenario table"
    columns: ["Scenario", "Assumptions", "Valuation / return logic", "Key risks", "Probability signal"]
    rows:
      - ["Bull", "20,000-GPU scale-up lands on time, partner channels convert regulated accounts, and software features create real switching costs.", "Current valuation can be defended if utilization and margin quality scale into the round's capacity plan.", "Hardware supply, execution complexity, and customer ramp timing.", "Would need disclosed utilization, margin, and contracted demand evidence."]
      - ["Base", "Neysa proves relevance in sovereign AI and wins some enterprise demand, but the public record remains thin on economics and debt detail.", "Visible valuation stays investable only with strict terms or more diligence; upside exists but is not yet underwritten.", "Price support remains narrative-heavy, with competition and capex still material.", "Best fit for the current public evidence set."]
      - ["Bear", "Debt-funded expansion outruns utilization, hyperscalers compress pricing, and channel traction fails to offset capital intensity.", "The visible valuation would look expensive and could face mark-down or down-round pressure if fundamentals disappoint.", "Supply-chain constraints, customer concentration, and weak retention proof.", "Most plausible if diligence cannot close current disclosure gaps."]
    notes: "These are qualitative scenario bands, not discounted-cash-flow outputs; public evidence is insufficient for a precise target return or exit multiple."
    claimRefs: ["CV001", "CV002", "CV005", "CV006", "CV011", "CV012", "CV013", "CV014"]
