      - ["Move enterprise AI from pilot to production", "Stitch together compute, observability, security, and orchestration across vendors", "Velocis plus unified dashboard and governance positioning", "Public materials claim simpler prototype-to-production workflow", "External proof is still light on implementation effort and long-run support burden"]
      - ["Launch operator or neocloud AI services", "Pair owned infrastructure with a software layer for routing, policy, and billing", "Mavenir plus Neysa integrated stack", "Makes token billing and AI service packaging explicit in public product messaging", "Evidence is limited to announcement-stage reporting rather than customer references"]
      - ["Run bursty, storage-heavy training jobs", "Use general-purpose object storage and accept bottlenecks", "Dual-layer storage with Weka for high-performance GPU workloads", "Partner case study claims lower stalls and stronger deterministic performance", "Proof is vendor-authored and not an independent platform-wide benchmark"]
    notes: "Benefits are limited to claims or case-study signals visible in the assigned pool; missing public benchmarks remain unresolved diligence asks."
    claimRefs: ["CE002", "CE003", "CE004", "CE010", "CE011"]
  - id: "TE003"
    title: "Technology / operating architecture table"
    columns:
      - "Layer / process"
      - "Role"
      - "Dependency"
      - "Risk"
    rows:
      - ["India-hosted GPU infrastructure", "Base compute for training and inference", "Domestic data-center capacity and GPU procurement", "Planned 20,000-GPU scale-up is still prospective and capital-intensive"]
      - ["Unified dashboard / workflow surface", "Train, test, deploy, and monitor workloads in one environment", "Neysa product layer and customer onboarding", "Public evidence does not yet show module-by-module adoption or reference implementations"]
      - ["Security, governance, and compliance controls", "Support regulated accounts and data-sovereignty requirements", "Company trust posture plus partner review processes", "Assigned pool lacks a dedicated trust center, public incident history, or scoped certification documentation"]
      - ["Mavenir orchestration and tokenomics layer", "Route inference, apply policies, and meter token consumption", "Continuation of the Mavenir partnership", "Announcement-stage integration risk until customer deployments are named"]
      - ["Storage and performance layer", "Keep GPU workloads productive under mixed IO pressure", "WEKA NeuralMesh alongside existing Ceph footprint", "Current proof comes from a vendor case study, not an independent benchmark"]
    notes: "Architecture reflects the strongest public evidence in the pool and separates verified official layers from analyst or partner-only detail."
    claimRefs: ["CE003", "CE004", "CE006", "CE009", "CE010", "CE012"]
