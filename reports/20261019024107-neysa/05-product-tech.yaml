schemaVersion: "report-v2"
artifact: "product-tech"
slug: "neysa"
runDate: "2026-10-19"
company:
  name: "Neysa"
chapter:
  number: 5
  title: "Product & Technology"
  summary: >-
    Neysa is selling Velocis as a sovereign AI acceleration cloud that combines GPU capacity,
    orchestration, security, observability, and partner-led delivery rather than raw hosted
    hardware alone. The best-supported wedge is India-resident, regulated-workload infrastructure
    wrapped in a fuller stack and channel program, while detailed module-level architecture,
    platform reliability, and external developer proof remain thinner and often partner- or
    company-authored.
sections:
  - id: "delivered-product"
    title: "Delivered product and customer workflow"
    body: >-
      Public materials consistently describe Neysa as a full-stack AI infrastructure provider, not
      a narrow GPU broker. The official surface centers on Velocis, which Neysa says spans AI
      infrastructure, performance optimisation, and AI/ML security, while Moneycontrol and
      Startoholics both describe a GPU-as-a-Service model for enterprises that want training and
      inference capacity without building their own data-center stack. The workflow Neysa is
      selling is also broader than raw compute: its own product page says teams can train,
      experiment, test, deploy, and monitor from one dashboard, and external coverage echoes that
      Neysa bundles observability, security, and governance around the compute layer. The result is
      a product pitch built around moving customers from experimentation into production, especially
      where India-local hosting, cost control, and operational simplicity matter more than the
      broadest global cloud catalog.
    claimRefs: ["CE001", "CE002", "CE003", "CE008", "CE012"]
    tableRefs: ["TE001"]
  - id: "architecture-and-deployment"
    title: "Architecture, integration, and deployment model"
    body: >-
      The assigned pool supports a layered architecture story, but not a fully verified reference
      architecture. Official material verifies a core stack of GPU infrastructure, orchestration,
      security, and observability, while independent reporting adds that the 2026 Mavenir
      partnership contributes agent workflows, policy controls, usage tracking, token-level
      metering, and a sovereign control plane oriented toward enterprise and telecom use cases.
      Partner and analyst material then fills in more of the operating picture: Weka describes a
      dual-layer storage design built for GPU-intensive workloads, and Sacra maps a broader
      software surface that includes developer workspaces, MLOps, observability, and model
      security. Those latter details are directionally useful, but because they are not matched by
      a public official technical document in the assigned pool, they should be treated as partial
      architecture evidence rather than final proof of exact module boundaries.
    claimRefs: ["CE003", "CE004", "CE005", "CE009", "CE010", "CE012"]
    tableRefs: ["TE003"]
    figureRefs: ["FE001"]
  - id: "differentiation-and-risk"
    title: "Differentiation, reliability, and technical risk"
    body: >-
      Neysa's clearest verified differentiation is sovereignty: multiple sources frame the company
      as India-operated AI infrastructure built for data residency, local compliance, and
      lower-latency control over regulated workloads. The February 2026 funding round also matters
      at the product level because it underwrites a planned expansion to roughly 20,000 GPUs,
      signaling intent to match the software layer with domestic capacity. Still, the risk profile
      is non-trivial. Much of the detailed proof on reliability and supportability is partner- or
      vendor-authored rather than independently benchmarked, the biggest scale claims are still
      roadmap claims instead of observed installed base, and the assigned pool does not provide a
      public status history, incident log, or developer-signal proxy that would make the platform's
      maturity easier to underwrite from outside the company.
    claimRefs: ["CE006", "CE007", "CE008", "CE010", "CE011", "CE012"]
    tableRefs: ["TE002"]
