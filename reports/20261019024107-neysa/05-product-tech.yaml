      - ["GPU-as-a-Service capacity", "Builders needing training and inference without owning hardware", "Commercialized with public pricing surface", "India-hosted GPU access plus reserved-cluster options lowers capex for local buyers", "Need realized pricing, utilization, and gross-margin evidence versus list pricing"]
      - ["Mavenir-integrated sovereign AI stack", "Telecom operators, neoclouds, and large enterprises", "Partnership announced in 2026", "Adds orchestration, token billing, security, and model-routing features on top of Neysa capacity", "Need named deployments, performance metrics, and evidence of production take-up"]
      - ["Partner channel program", "ISVs, SIs/resellers, advisors, and technology vendors", "Structured program with onboarding and co-sell motion", "Lets Neysa extend reach while partners keep delivery and customer ownership above the infra layer", "Need partner count, attach rates, and time-to-go-live evidence"]
    notes: "Combines official company materials with independent coverage; maturity refers to publicly visible commercial status, not audited production penetration."
    claimRefs: ["CE001", "CE002", "CE004", "CE005", "CE012"]
