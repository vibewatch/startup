callouts:
  - calloutType: insight
    title: Policy and capacity matter more than generic cloud TAM
    body: "The market timing is being set by sovereign-compute procurement, regulated-workload reviews, and domestic GPU scarcity, not by a generic claim that 'AI is large.'"
    claimRefs: [CM007, CM010, CM015]
  - calloutType: risk
    title: Public TAM is still easier to cite than Neysa-specific SAM
    body: "The retained sources support a real market and a credible product wedge, but they still do not disclose utilization, segment mix, or an independent price-performance bridge that would convert macro demand into an underwritten share assumption."
    claimRefs: [CM012, CM014]
