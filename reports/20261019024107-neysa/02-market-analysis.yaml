company:
  name: Neysa
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Neysa is operating in a narrowly defined but timely market: India-resident AI
    infrastructure for regulated enterprises, public-sector workloads, and AI builders
    that need local GPU capacity rather than generic cloud or consumer-AI software. Public
    evidence supports a real sovereign-compute tailwind, but the cleanest public numbers are
    macro lenses on Indian AI demand and GPU capacity, not a Neysa-specific SAM, SOM, or
    utilization-backed share.
sections:
  - id: market-boundary
    title: Market boundary and adjacent spend
    body: >-
      The relevant market is not "AI" in the abstract and not generic public-cloud spend. Public
      sources repeatedly frame Neysa as India-resident AI infrastructure: GPU compute, orchestration,
      monitoring, security, and adjacent platform services that let enterprises train, fine-tune,
      and deploy models locally. That boundary matters because it excludes consumer applications,
      model vendors, and broad IT outsourcing even when those categories also benefit from AI
      demand. It also separates Neysa from hyperscaler cloud revenue that is not constrained by
      local-data, latency, or sovereign-compute requirements.
      
      The buyer set is similarly narrower than a broad "all enterprises" narrative. Across company
      materials and independent reporting, the recurring end markets are regulated enterprises,
      government or public-service institutions, AI labs, and startups that need domestic capacity
      or compliance comfort. In practice, Neysa is selling the infrastructure layer underneath AI
      applications, not the applications themselves.
    claimRefs: [CM001, CM002, CM003, CM009]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Sizing lenses point to a real market, but not a clean SAM/SOM
    body: >-
      Public sizing data is abundant at the macro level and thin at the underwritable level. The
      broadest lens in the assigned pool is Value For Startups' $2B+ annual India AI market and
      its $6B+ by 2028 sovereign-compute / neocloud estimate; both are helpful for direction, but
      they are not the same as Neysa's own addressable demand. The more concrete lenses are GPU
      capacity counts: Moneycontrol's estimate that India currently has around 60,000 GPUs for
      commercial AI workloads, ET's report of 40,535 committed IndiaAI GPUs with a further
      ~25,000 expected in the fourth round, and Neysa's own 20,000+ deployment target after the
      Blackstone financing.
      
      Together, these figures support the judgment that India is still supply-constrained in
      sovereign AI compute and that Neysa's planned scale-up is material relative to today's
      domestic installed base. What they do not provide is a reliable Neysa-specific SAM or SOM.
      The public record still lacks vertical demand conversion, contracted capacity by customer
      cohort, and utilization disclosure that would bridge macro capacity statistics to value-based
      revenue capture.
    claimRefs: [CM005, CM006, CM007, CM008, CM009]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-and-adoption
    title: Buyer segments, budget owners, and adoption path
    body: >-
      The strongest recurring buyer clusters are BFSI, healthcare, public services, government,
      startups, and research institutions, which all have some combination of sensitive data,
      model-performance requirements, or limited appetite for capex-heavy in-house GPU builds.
      Neysa's official positioning expands this into a vertical-led go-to-market motion: it cites
      fraud detection and risk use cases in BFSI, research-scale model development, startup
      training and inference, and public-sector workloads that need local control.
      
      The buying motion is also partner-mediated rather than purely direct. Neysa's partner program
      is built around ISVs, system integrators, advisers, and resellers that keep the client
      relationship and monetize services, while Neysa supplies the underlying compute and support.
      That implies budget ownership often sits with the enterprise CIO, CTO, CDAO, or a
      line-of-business AI sponsor, but procurement may be routed through a channel partner already
      leading the customer's adoption program.
    claimRefs: [CM003, CM004, CM010, CM011, CM013, CM015]
    tableRefs: [TM003]
  - id: constraints-and-gaps
    title: Adoption constraints and unresolved market diligence
    body: >-
      The bullish market case is not the same as a de-risked adoption case. Public sources point to
      four recurring constraints: hyperscalers can still respond with local pricing and capacity;
      regulations can shift in ways that either help or weaken local players; GPU supply and
      financing execution remain gating factors; and utilization has to ramp fast enough for the
      infrastructure model to work economically. These are execution and market-structure risks,
      not signs that demand is imaginary, but they can materially compress valuation if the buildout
      outruns realized demand.
      
      The weakest part of the public evidence is still Neysa-specific market capture. Cost claims
      are supportive but inconsistent in denominator and methodology, and none of the retained
      sources disclose a defensible public bridge from India's sovereign-compute narrative to
      Neysa's contracted share, utilization, or segment revenue mix. That is why the right market
      conclusion is "large and policy-supported, but still insufficiently converted into public
      company-level economics."
    claimRefs: [CM012, CM014]
