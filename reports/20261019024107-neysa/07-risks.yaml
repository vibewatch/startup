    summary: >-
      Public evidence ranks financing completion, rollout execution, and
      regulatory durability as Neysa's highest residual risks despite visible
      mitigation progress.
    data:
      columns:
        - label: Likelihood
          note: Estimated from public disclosures and third-party commentary only.
        - label: Impact
          note: Reflects downside to growth, gross margin, or thesis credibility.
        - label: Mitigation maturity
          note: Publicly visible controls or counterparties, not private diligence.
        - label: Residual risk
          note: Remaining exposure after crediting known mitigants.
      rows:
