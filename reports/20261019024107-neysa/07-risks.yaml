        - >-
          Blackstone-led equity is already announced, which lowers immediate
          going-concern risk but does not answer covenant or tenor questions.
        - High
        - >-
          Request executed debt documents, maturity schedule, collateral package,
          covenant headroom, and any lender consent conditions.
    notes: >-
      Rows are ordered by residual severity using public evidence only; absence
      of a public case file or incident disclosure is treated as a diligence gap,
      not proof that the risk is absent.
