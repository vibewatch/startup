              tone: medium
            - label: Medium-High
              tone: high
            - label: Developing
              tone: warning
            - label: Medium
              tone: risk
    claimRefs: [CR001, CR002, CR009, CR012, CR013, CR015]
callouts:
  - calloutType: risk
    title: Financing structure is still an underwriting risk
    body: >-
      The equity headline is real, but the incremental debt is still only
      described as intended and subject to documentation. If the debt closes
      slowly or with restrictive terms, the 20,000-GPU rollout becomes a much
      riskier operating target.
    claimRefs: [CR001, CR002, CR015]
  - calloutType: insight
    title: Reliability evidence is improving, not settled
    body: >-
      WEKA's case study is useful because it shows both sides of the story:
      Neysa has real workloads and recent stability, but it also had to evolve
      its storage design to keep high-performance GPU clusters productive.
    claimRefs: [CR007, CR008, CR009]
  - calloutType: assumption
    title: Thesis-break triggers are monitorable
    body: >-
      Public signs that would change the investment case quickly include debt
      terms that impair unit economics, commissioning delays against GPU rollout
      targets, or evidence that partner-led distribution is not converting into
      durable production usage.
    claimRefs: [CR002, CR011, CR015]
