company:
  name: Neysa
chapter:
  number: 7
  title: Risks
  summary: >-
    Neysa's headline risk is not demand creation but execution: the company is
    trying to convert a Blackstone-backed equity raise plus still-undocumented
    debt capacity into a >20,000-GPU rollout while keeping reliability,
    compliance proof, and partner-led go-to-market intact. Public evidence is
    directionally positive on mitigants such as certifications, sponsor support,
    and storage hardening, but the unresolved debt terms, incomplete audit scope,
    and dependence on partners keep residual risk high.
sections:
  - id: ranked-risk-picture
    title: Ranked risk picture
    body: >-
      The public record points to three top residual risks. First, financing and
      deployment are tightly linked: Neysa disclosed up to $600 million of
      committed equity and an intended additional $600 million of debt, then
      tied that capital to a plan to deploy more than 20,000 GPUs in India.
      That makes debt completion, covenant flexibility, and build-out cadence
      core underwriting questions rather than back-office details. Second,
      operating proof is improving but still early relative to the ambition.
      WEKA's case study shows real production usage and reliability progress,
      yet it also confirms Neysa had to harden storage architecture to keep GPU
      clusters productive under demanding workloads. Third, the commercial thesis
      depends on sovereign, regulated, and partner-assisted adoption. That helps
      differentiation today, but it also means security proof, partner alignment,
      and regulatory durability directly affect revenue quality and speed.
    claimRefs: [CR001, CR002, CR007, CR008, CR012, CR013, CR015]
    figureRefs: [FR001]
  - id: regulatory-security-gating
    title: Regulatory and security gating
    body: >-
      Neysa's positioning is strongest where customers care about sovereign
      infrastructure, but that same positioning raises the bar for proof. The
      company says it serves financial services, healthcare, public services,
      and other regulated workloads, and its partner page explicitly uses
      ISO 27001 and SOC 2 Type II certification language to reassure BFSI,
      healthcare, and government buyers. That is a meaningful mitigation, but
      it is not the same as publishing the audit scope, exception history, data
      processing commitments, or incident posture for the full stack. Sacra's
      warning that regulatory or compliance shifts could weaken Neysa's
      differentiation reinforces that this is not a static checkbox risk: if
      sovereign-cloud rules loosen, or if regulated buyers demand a deeper audit
      package than the public site discloses, the sales cycle and win rate can
      deteriorate before any headline incident appears.
    claimRefs: [CR004, CR005, CR006, CR013]
    tableRefs: [TR001]
  - id: scale-and-reliability
    title: Scale and reliability under load
    body: >-
      Operationally, Neysa is asking customers to believe it can move from a
      platform already serving production AI workloads into a much larger,
      capital-intensive infrastructure footprint without breaking service
      quality. The positive evidence is real: WEKA says Neysa is already
      operating thousands of GPUs, supporting customers processing more than
      100 million tokens daily, and ran six months without a critical support
      ticket after introducing a specialized storage layer. The negative read is
      equally important: that same case study shows the original open-source
      layer was not sufficient for all high-performance GPU clusters, while
      external commentary frames the entire story as a test of whether Neysa can
      deploy capital quickly enough to meet demand. Service quality is also part
      of the company's differentiation versus hyperscalers, so any latency,
      uptime, or support slippage hits both gross margin and competitive
      positioning at once.
    claimRefs: [CR007, CR008, CR009, CR010, CR014]
    tableRefs: [TR002]
  - id: financing-and-partner-dependencies
    title: Financing and partner dependencies
    body: >-
      Neysa's partner ecosystem expands distribution and product reach, but it
      also creates counterparty dependencies. The company markets a co-sell and
      reseller model in which partners keep the customer relationship while
      Neysa supplies capacity and 24x7 infrastructure support. That can speed
      adoption, especially in advisory-led or regulated accounts, but it also
      risks slower feedback loops, margin give-up, and channel conflict if
      customer ownership or support boundaries blur. Product-side dependencies
      are visible too: Mavenir is integrating orchestration, billing, and policy
      controls on top of Neysa infrastructure, and WEKA remains part of the
      performance story for storage-intensive GPU workloads. Combined with the
      still-undocumented debt facility, this means the key thesis-break triggers
      are measurable: failure to close debt on workable terms, delays in
      bringing planned GPU capacity online, or evidence that high-touch partner
      sales are not converting into durable production usage.
    claimRefs: [CR001, CR009, CR011, CR015]
    tableRefs: [TR003]
