company:
  name: Neysa
chapter:
  number: 3
  title: Competitors
  summary: >-
    Neysa competes across several layers at once: global hyperscalers, specialist GPU clouds,
    Indian/local infrastructure alternatives, and the do-it-yourself status quo for regulated
    enterprises. The public evidence set supports Neysa's differentiation on India-resident
    sovereignty, packaged AI infrastructure, and partner-led distribution, but it does not yet
    prove realized pricing, utilization, or customer-lock-in advantages over larger incumbents.
sections:
  - id: landscape
    title: Competitive set is broader than startup peers
    body: >-
      The public record does not support treating Neysa as a narrow startup-versus-startup
      comparison. Independent coverage and analyst commentary repeatedly frame the company as a
      domestic alternative to AWS, Azure, and other foreign hyperscalers for India-resident AI
      workloads, while also placing it beside specialist GPU clouds and regional providers.
      Neysa's own materials reinforce that it is trying to win workloads from multiple substitute
      paths at once: global public cloud, local enterprise AI clouds, and internal builds that
      would otherwise assemble GPU capacity, orchestration, and support in-house. That breadth
      matters because Neysa's moat cannot be judged only against local startups; buyers can solve
      the same job with incumbent clouds or by standing up dedicated clusters under their own
      operating model.
    claimRefs: [CP001, CP002, CP003, CP012, CP013, CP014]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: differentiation
    title: Differentiation rests on bundled platform depth and channel reach
    body: >-
      Neysa's disclosed offer is not just raw GPU rental. Across its funding announcement,
      product comparisons, partner pages, and the Mavenir launch, the company positions Velocis
      as a sovereign AI cloud that bundles infrastructure, inference, orchestration, security,
      and channel-enablement layers. That bundled scope matters competitively because it gives
      Neysa more than one wedge in regulated accounts: local control, packaged software, and
      sales leverage through resellers, consultants, and telecom-linked go-to-market partners.
      The strongest public support for this argument is still company-controlled or partner proof,
      so the chapter treats it as a credible positioning edge rather than a verified long-term
      moat.
    claimRefs: [CP004, CP005, CP006, CP007, CP011]
    tableRefs: [TP002]
  - id: moat-limits
    title: Public evidence does not yet prove durable economic lock-in
    body: >-
      The main competitive challenge is that Neysa's apparent advantages remain easier to see in
      product narrative and list pricing than in independently verified operating metrics. Neysa's
      comparison blog shows lower starting prices than several named alternatives, but that table
      is vendor-authored and says little about reserved-capacity discounts, workload mix, or
      realized gross margins. Independent analyst commentary also highlights the most important
      downside scenario: hyperscalers can cut prices or benefit if data-sovereignty rules loosen,
      which would weaken Neysa's ability to charge a premium for India-first infrastructure. The
      result is a competitive story that is plausible and strategically coherent, but still short
      of proving that customers will stay, expand, and renew on economically attractive terms once
      the larger incumbents respond.
    claimRefs: [CP008, CP009, CP010, CP015]
    tableRefs: [TP003]
tables:
