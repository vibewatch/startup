callouts:
  - calloutType: insight
    title: Neysa is selling a bundle, not only compute
    body: >-
      The clearest public differentiation is the combination of sovereign India-resident
      infrastructure, packaged orchestration and security layers, and partner-led routes to
      market. That bundle is strategically more defensible than a simple hourly GPU-price pitch.
    claimRefs: [CP004, CP005, CP006, CP007]
  - calloutType: risk
    title: The moat still depends on economics the public record does not show
    body: >-
      Public materials show list pricing and product narrative, but not the realized discounts,
      margins, renewal behavior, or utilization rates needed to prove durable advantage once
      hyperscalers and other substitutes respond.
    claimRefs: [CP008, CP009, CP010, CP015]
