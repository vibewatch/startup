    rows:
      - [Neysa, "Neysa / Velocis", "$1.2B capital raise; planned scale-up beyond 20,000 GPUs", "Indian enterprises, government entities, neoclouds, operators", "India-resident sovereign AI cloud with infrastructure, orchestration, inference, and partner routes", "Realized utilization, pricing, and retention remain undisclosed"]
      - ["Global hyperscalers", "AWS, Azure, Google Cloud", "Global cloud scale and broad AI ecosystems", "Enterprises wanting broad public-cloud stacks", "Deepest service breadth and existing account control", "This pool gives limited India-specific sovereignty or pricing detail beyond vendor comparison rows"]
      - ["Specialist GPU clouds", "CoreWeave, Lambda Labs", "Pure-play GPU-cloud category per Sacra", "Researchers, startups, and AI-native teams", "High-performance GPU specialization", "Available evidence here is not India-sovereign-first and has thin public pricing detail"]
      - ["Local enterprise AI clouds", "Tata Communications Vayu AI Cloud; Yotta Shakti Cloud", "Domestic footprint and enterprise relationships", "Indian enterprises needing local hosting", "Domestic delivery and locality narrative", "Current assigned evidence is thinner on integrated software layers and realized economics"]
      - ["Regional enterprise cloud", "Oracle Cloud Infrastructure", "Large AI-supercomputer positioning per Sacra and Neysa comparison material", "Enterprises needing reserved capacity and enterprise procurement comfort", "Enterprise cloud credibility with sovereign-region positioning", "Not presented in this source set as an India-built sovereign AI specialist"]
      - ["Internal build / status quo", "Enterprise self-built clusters", "Requires balance-sheet and operating capacity", "Large regulated enterprises with infra teams", "Maximum stack control and no third-party dependency", "Highest capex and operational burden; no packaged platform or channel support"]
    notes: >-
      Mixes independent and company-authored evidence. "Named examples" and price/scale shorthand
      reflect only what is explicit in the assigned source pool; missing realized-economics detail
      should not be treated as proof of parity or superiority.
    claimRefs: [CP001, CP002, CP003, CP004, CP007, CP012, CP013, CP014, CP015]
  - id: TP002
    title: Feature / capability matrix
    columns:
      - Buying criterion
      - Neysa
      - Hyperscaler incumbents
      - Specialist GPU clouds
      - Internal build / status quo
    rows:
      - ["India-resident sovereignty posture", "Core message in funding, product, and partnership materials", "Available evidence here treats them as the foreign-cloud substitute path", "No India-first sovereignty positioning in this source set", "Full control if the buyer builds and operates its own cluster"]
      - ["Packaged AI platform depth", "Velocis plus orchestration, inference, security, and support layers", "Broad AI services exist, but detailed feature benchmarking is outside this pool", "GPU specialization is clear; integrated tooling depth varies and is only partially evidenced here", "Enterprise must assemble infrastructure, tooling, security, and support itself"]
      - ["Channel / distribution leverage", "Partner-first program plus Mavenir route into operators, enterprises, and neoclouds", "Large direct-enterprise reach is the substitute benchmark, but not deeply profiled in this chapter pool", "Limited evidence in the assigned sources", "None beyond in-house team and chosen integrators"]
      - ["Pricing visibility", "Public list pricing for managed instances and reserved multi-GPU clusters", "Public comparison rows appear in Neysa's blog, but realized terms are unknown", "Public evidence here is sparse outside vendor-authored comparison rows", "Capex, financing, and ops costs must be self-modeled"]
      - ["Switching friction after production use", "Could rise through packaged tooling, partner workflows, and infrastructure dependencies", "Existing cloud entrenchment is a major status-quo substitute", "Varies by workload and tooling depth; not well evidenced here", "No vendor dependency, but highest operating burden for the buyer"]
    notes: >-
      Unsupported cells are intentionally phrased as limited or unknown rather than guessed. The
      matrix emphasizes the criteria visible in the assigned evidence set, not a complete product
      benchmark.
    claimRefs: [CP004, CP005, CP006, CP007, CP008, CP011, CP015]
  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Provider or class
      - Entry price signal in public evidence
      - Packaging
      - Evidence basis
      - Competitive implication
    rows:
      - ["Neysa", "$1.17/hr L4; $4.73/hr H200 SXM; $13,822.86/month for 8x H200 reserved cluster", "On-demand managed instances plus reserved multi-GPU clusters", "Neysa blog pricing table", "Transparent list pricing is a selling point, but realized enterprise pricing is unknown"]
      - ["AWS", "₹120/hr starting price in Neysa's comparison table", "Broad cloud AI instances", "Neysa blog comparison row", "Vendor-authored table suggests a lower Neysa list-price entry point"]
      - ["Google Cloud", "₹110/hr starting price in Neysa's comparison table", "Broad cloud AI instances", "Neysa blog comparison row", "Same caveat: public comparison is useful for positioning, not proof of realized savings"]
      - ["Azure", "₹125/hr starting price in Neysa's comparison table", "Broad cloud AI instances", "Neysa blog comparison row", "Incumbent substitute remains credible even if Neysa's cited list price starts lower"]
      - ["CoreWeave", "₹300–₹450+ starting price in Neysa's comparison table", "Specialist GPU cloud", "Neysa blog comparison row", "Useful as a specialist benchmark, but current evidence does not cover like-for-like contract structure"]
      - ["Tata / Yotta local alternatives", "Tata custom (est. ₹250–₹500+); Yotta ₹250–₹400+", "Enterprise or custom packaging", "Neysa blog comparison row", "Domestic alternatives compete on locality, though packaging and discount terms are still opaque here"]
    notes: >-
      This table is dominated by vendor-authored list pricing. It is useful for packaging and
      positioning, not for underwriting realized customer economics, discounting, or gross-margin
      advantage.
    claimRefs: [CP007, CP008, CP009, CP010, CP015]
