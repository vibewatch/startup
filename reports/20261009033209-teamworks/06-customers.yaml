callouts:
- calloutType: insight
  title: Enterprise Breadth Versus Point-Solution Depth
  body: 'Teamworks'' reported scale of 7,000+ teams highlights immense commercial distribution across elite athletics. However,
    because much of this customer base was assembled through 14 corporate acquisitions, maintaining deep user satisfaction
    across disparate software modules represents an ongoing challenge. While administrative tools like Hub and Compliance
    achieve strong departmental retention, performance departments frequently evaluate specialized alternatives like Kitman
    Labs for sports medicine and AMS, creating potential churn vectors if product integration falters.

    '
  claimRefs:
  - CU001
  - CU003
  - CU005
  - CU014
  - CU015
- calloutType: risk
  title: Commercial Friction and Integration Drag in Post-M&A Expansion
  body: 'The expansion from scheduling into data-heavy scouting and NIL financial operations introduces material operational
    hurdles. Reports of workforce restructuring at acquired units like PFF in March 2026, alongside consumer-facing business
    separations, indicate ongoing integration friction. As Teamworks pushes to convert legacy single-product buyers into high-value
    unified platform agreements, any delays in seamless data interoperability risk prolonging sales cycles and dampening expected
    customer expansion velocity.

    '
  claimRefs:
  - CU013
  - CU014
  - CU015
