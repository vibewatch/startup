chapter:
  number: 6
  title: Customers
  summary: Teamworks has achieved extensive organizational penetration across North American collegiate athletics and major
    professional sports leagues, but customer relationships vary widely from broad athletic-department suites to fragmented
    single-team or single-module deployments. As the company pushes into European football, international federations, and
    NIL revenue-sharing administration, retention durability and expansion economics face heightened friction from disparate
    tech stacks, ongoing post-acquisition integrations, and competing point solutions.
sections:
- id: customer-segmentation-and-profile
  title: Customer Base Segmentation and Buyer Profiles
  body: 'Teamworks structures its commercial reach across three primary tiers: collegiate athletic departments, elite professional
    sports franchises, and national governing bodies or Olympic federations. In the collegiate segment, the primary buyer
    is typically the athletic director, senior associate athletic director, or chief financial officer, who procures department-wide
    packages such as Teamworks Elite, Hub, Academics, and Compliance & Recruiting to standardize administrative operations
    across dozens of varsity teams and hundreds of student-athletes. At the individual team level within collegiate programs,
    head coaches and performance directors serve as key operational users for specialized tools like Teamworks Player Personnel,
    Strength & Conditioning, and Nutrition. In professional sports, procurement is bifurcated between sporting directors and
    technical leadership—who evaluate performance, video analytics, and athlete management systems—and front-office executives
    managing operational logistics, travel, and roster communication. While collegiate clients focus heavily on administrative
    consolidation, compliance risk mitigation, and recent student-athlete compensation workflows, professional organizations
    prioritize bespoke data integration, athlete availability, and tactical scouting advantage.

    '
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU013
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: adoption-trajectory-and-deployment-scale
  title: Adoption Trajectory, Scale Claims, and Breadth
  body: 'The company reports an aggregate operational footprint powering more than 7,000 sports organizations and high-performance
    teams worldwide. According to commercial disclosures, Teamworks has achieved near-total market share in core domestic
    segments, including 100% of NFL teams, 99% of NCAA Division I athletic departments, 90% of MLB teams, 90% of English Premier
    League clubs, 87% of NBA franchises, 83% of MLS teams, 81% of NHL clubs, and over 65 Olympic federations across 24 countries.
    However, diligence indicates a critical distinction between headline logo penetration and full-suite enterprise adoption.
    Many elite professional and collegiate relationships originated as narrow communication or scheduling subscriptions through
    Teamworks Hub or point-solution acquisitions such as Smartabase, Kairos, or ARMS Software, rather than holistic platform-wide
    contracts. Active user populations range from entire university athletic departments with more than 1,200 student-athletes
    down to single performance departments utilizing isolated athlete management software.

    '
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU005
  - CU006
  - CU014
  tableRefs:
  - TU002
- id: named-customer-proof-and-case-studies
  title: Named Customer Proof and Case Study Evidence
  body: 'Documented customer implementations demonstrate verified workflow adoption across both collegiate and professional
    environments. In collegiate athletics, institutions such as the University of Wyoming, UNC Asheville, and Harvard University
    have deployed Teamworks Compliance to centralize eligibility tracking and rule automation for up to 42 varsity teams and
    1,200 student-athletes. Programs including Georgia Southern University reported cutting academic administrative workloads
    in half by adopting Teamworks Academics, while Auburn University documented reducing strength and conditioning programming
    time by 50% using Teamworks S&C. In professional soccer, European and Middle Eastern clubs including Al Ain FC have deployed
    the integrated performance suite—incorporating Hub, AMS, S&C, and Nutrition—to support daily athletic preparation during
    championship-winning campaigns. More recently, Brazilian Basketball Confederation (CBB) executed a four-year agreement
    to standardize national team operations, and Teamworks announced full Premier League customer penetration following its
    acquisition of Belgian athlete data firm Opteamal.

    '
  claimRefs:
  - CU003
  - CU004
  - CU007
  - CU008
  - CU009
  - CU010
  - CU011
  - CU012
  tableRefs:
  - TU003
- id: retention-expansion-and-concentration-risks
  title: Retention Dynamics, Multi-Product Expansion, and Operational Friction
  body: 'Teamworks relies on a land-and-expand commercial model, attempting to cross-sell additional modules—such as Nutrition,
    General Manager, Wallet, and scouting software—into accounts originally won on basic communication or scheduling tools.
    For example, recent expansions include the Irish Rugby Football Union (IRFU) adding Teamworks AMS and Nutrition to existing
    deployments, and athletic departments like LSU and Maryland adopting Teamworks General Manager and Wallet for revenue-sharing
    operations. Despite these expansion proof points, public visibility into core SaaS metrics remains constrained: Teamworks
    does not disclose net revenue retention (NRR), gross revenue retention (GRR), annual churn rates, or average contract
    values across its customer tiers. Customer concentration at the individual team level appears low given the thousands
    of client organizations, but high conference-wide and division-level standardization creates structural procurement friction.
    Furthermore, enterprise sales cycles face headwinds from integration fatigue across 14 acquisitions, staff layoffs within
    acquired assets such as PFF in March 2026, and aggressive competition from dedicated athlete management rivals including
    Kitman Labs and CoachMePlus.

    '
  claimRefs:
  - CU004
  - CU005
  - CU006
  - CU013
  - CU014
  - CU015
