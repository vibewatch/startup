figures:
- id: FU001
  title: Customer Acquisition and Land-and-Expand Journey Map
  type: journey-map
  summary: Illustrates the six-stage lifecycle of athletic and sports organizations adopting Teamworks, from initial single-module
    operational wedges to full-suite operating system lock-in.
  data:
    nodes:
    - label: 1. Operational Wedge
      detail: Initial procurement centered on core scheduling and team messaging via Teamworks Hub or point compliance tools.
    - label: 2. Performance Expansion
      detail: Cross-selling specialized athlete management systems (AMS), Strength & Conditioning, and Nutrition modules.
    - label: 3. Enterprise Department Standardization
      detail: Department-wide Elite adoption standardizing administrative operations across dozens of teams and hundreds of
        athletes.
    - label: 4. Conference-Wide Realignment
      detail: Multi-institution conference agreements standardizing recruiting and compliance operations across entire leagues.
    - label: 5. Strategic Intelligence & Scouting
      detail: Adoption of advanced scouting and video analytics tools (PFF Ultimate, Telemetry, Zelus) creating workflow stickiness.
    - label: 6. Athlete Finance & Platform Lock-In
      detail: Deployment of General Manager and Wallet for student-athlete revenue share and compensation management.
  approximationNotes: Conceptual representation of customer expansion paths derived from documented case studies and multi-product
    customer announcements.
