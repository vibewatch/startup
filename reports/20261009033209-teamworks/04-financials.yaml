callouts:
  - calloutType: "insight"
    title: "Network-Enforced Distribution and Monopolistic Moats in Collegiate Athletics"
    body: "Teamworks' commercial dominance in collegiate sports is insulated by a powerful peer-enforced network effect. Because conference compliance and scheduling require seamless interoperability between competing institutions, adoption by dominant athletic programs forces neighboring institutions to standardize on the same platform. This dynamic transforms what would otherwise be a discretionary software purchase into a non-negotiable athletic department utility."
    claimRefs:
      - "CI002"
      - "CI005"
      - "CI006"
  - calloutType: "risk"
    title: "Capital Outlays and Integration Complexities in Acquisition-Driven Growth"
    body: "The definitive agreement to acquire Atrium Sports for $170 million in cash underscores Teamworks' aggressive reliance on M&A to secure market leadership in coaching and video intelligence. While absorbing established platforms expands wallet share, deploying substantial cash reserves increases financial vulnerability, while integrating diverse technical architectures, video processing infrastructure, and distinct customer cultures presents material margin and operational execution risks."
    claimRefs:
      - "CI010"
      - "CI011"
      - "CI016"
