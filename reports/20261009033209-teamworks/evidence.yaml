evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-performance
    missingEvidence: >-
      Audited financial statements confirming GAAP annual recurring revenue (ARR), gross margin percentage, net revenue
      retention (NRR), and operating cash burn.
    whyItMatters: >-
      Without verified ARR and margin disclosures, valuation multiples on the $1.0B+ Series F round cannot be rigorously
      benchmarked against vertical SaaS peers.
    diligencePath: >-
      Request confidential disclosure of audited historical income statements and quarterly SaaS KPI cohorts from
      Teamworks management.
    relatedQuestionRefs:
      - QO003
      - QO008
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: capitalization-table
    missingEvidence: >-
      Detailed capitalization table reflecting post-Series F share classes, liquidation preferences, option pool
      reservations, and secondary share transaction volumes.
    whyItMatters: >-
      Determines downside protection rights, senior liquidation hurdles, and actual voting governance distribution
      between founders and Dragoneer.
    diligencePath: >-
      Inspect the restated certificate of incorporation and investor rights agreements during formal pre-investment due
      diligence.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-enumeration-scope
    missingEvidence: >-
      Comprehensive roster of all executive vice presidents, board of directors representatives, and divisional general
      managers across acquired operating units.
    whyItMatters: >-
      Table TO002 enumerates a representative sample of core executive leadership; full functional coverage across all
      acquired business units remains partially documented.
    diligencePath: Review full organizational charts and corporate registry filings for Teamworks Innovations, Inc.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: revenue-mix-and-acv
    missingEvidence: >-
      Audited financial breakdown of Teamworks ARR by product line (Hub vs. AMS vs. Wallet vs. Scouting) and precise
      institutional ACV distribution.
    whyItMatters: >-
      Without verified product-level revenue data, market size models must rely on estimated price tiers and broad
      franchise counts.
    diligencePath: >-
      Review confidential private placement memorandums (PPM), customer billing records, or auditor reports in an M&A
      data room.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: competitor-evidence-gap
    missingEvidence: >-
      Independent, entity-matched profiles for named direct competitors covering scale, funding, target customer, scope,
      and strategic direction.
    whyItMatters: Without a validated peer set, relative market position and displacement risk cannot be ranked reliably.
    diligencePath: >-
      Obtain current competitor product documentation, financing records, customer references, and independent market
      coverage for each named peer.
    relatedQuestionRefs:
      - QP002
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: pricing-gap
    missingEvidence: >-
      Teamworks and competitor price books, proposals, contract terms, implementation fees, realized discounts,
      renewals, and module attach rates.
    whyItMatters: Public capability breadth cannot establish pricing power, package economics, or value relative to point solutions.
    diligencePath: >-
      Review anonymized customer contracts and renewal cohorts, then run matched vendor quote requests for
      representative buyer segments.
    relatedQuestionRefs:
      - QP010
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-costs
    missingEvidence: >-
      Migration effort, data portability, implementation time, multi-homing behavior, churn reasons, and partner or
      channel economics.
    whyItMatters: >-
      Claimed integration may create lock-in, but the available evidence does not quantify durability or customer
      dependence.
    diligencePath: >-
      Interview recent wins, losses, and churned customers and review implementation plans, export terms, and
      integration agreements.
  - type: missing-source
    severity: material
    topic: independent-validation
    missingEvidence: >-
      Independent capability, security, usability, uptime, and implementation benchmarks for Teamworks and matched
      competitors.
    whyItMatters: Most positive capability evidence is company-issued and cannot establish comparative performance.
    diligencePath: >-
      Commission reference calls and technical validation using identical workflows, data volumes, permission models,
      and service-level criteria.
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: revenue-composition
    missingEvidence: >-
      Audited financial breakdown of annual recurring revenue (ARR) by standalone software module, renewal expansion
      rates, and services revenue.
    whyItMatters: >-
      Without product-level revenue composition, underwriters cannot evaluate the underlying growth velocity of core
      SaaS versus lower-margin acquired businesses.
    diligencePath: Obtain confidential management reporting and customer cohort waterfall schedules under non-disclosure agreement.
    relatedQuestionRefs:
      - QI001
      - QI008
    relatedTableRefs:
      - TI001
      - TI003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Audited GAAP gross margin percentages, cloud hosting compute allocations, and customer support delivery
      expenditures.
    whyItMatters: >-
      Multi-product platforms that incorporate compute-heavy video analytics and biometric tracking may suffer gross
      margin compression relative to pure administrative software.
    diligencePath: >-
      Request audited cost-of-goods-sold (COGS) bridge detailing AWS/cloud infrastructure, third-party data licenses,
      and support labor.
    relatedQuestionRefs:
      - QI004
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: cash-flow-and-burn
    missingEvidence: >-
      Operating cash flow statements, trailing monthly net burn rates, and post-transaction pro forma cash balances
      following the $170M Atrium purchase.
    whyItMatters: >-
      Deploying $170M in cash materially impacts liquidity reserves, making understanding normalized free cash flow
      essential for capital adequacy underwriting.
    diligencePath: >-
      Review pro forma opening balance sheet and 24-month rolling cash forecast including debt or credit facility
      obligations.
    relatedQuestionRefs:
      - QI006
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: infrastructure-uptime
    missingEvidence: >-
      Public historical uptime dashboards, status page incident histories, and verified MTTR metrics for Teamworks core
      cloud services.
    whyItMatters: >-
      Elite professional and collegiate athletic programs rely on real-time scheduling and communication during live
      events where unplanned outages disrupt team operations.
    diligencePath: >-
      Request production SLA reports, historical outage summaries, and SOC 2 Type II audit documentation directly from
      Teamworks enterprise engineering management.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: acquisition-data-harmonization
    missingEvidence: >-
      Technical documentation detailing the schema normalization and latency benchmarks of integrating Zelus,
      Sportlogiq, PFF, and Synergy data into the central Data Engine.
    whyItMatters: >-
      Aggregating disparate computer vision, tracking, and video assets across acquired tools risks substantial query
      latency and data inconsistency if not natively unified.
    diligencePath: >-
      Conduct an engineering architecture review assessing data warehouse pipeline synchronization, ETL runtimes, and
      cross-module entity resolution.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE001
      - TE003
  - type: private-evidence-only
    severity: material
    topic: customer-economics
    missingEvidence: >-
      Audited customer renewal rates, net revenue retention (NRR), gross retention (GRR), and average annual contract
      value (ACV) broken down by collegiate and professional segments.
    whyItMatters: >-
      Without retention and contract value data, the durability of Teamworks' multi-product land-and-expand model and
      true customer lifetime value cannot be independently verified.
    diligencePath: >-
      Request customer cohort retention schedules, logo churn data, and module attach rates under confidentiality in
      future diligence.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU001
      - TU002
      - TU003
  - type: private-evidence-only
    severity: material
    topic: financial-gaps
    missingEvidence: Audited financial statements detailing ARR, gross margins, recurring revenue percentages, and cash burn rate.
    whyItMatters: >-
      Without revenue and margin disclosures, valuation multiples cannot be fundamentally verified against the $1B+
      mark.
    diligencePath: Request confidential disclosure of audited GAAP/IFRS financial statements and unit economics schedule.
    relatedQuestionRefs:
      - QR008
  - type: enumeration-incomplete
    severity: minor
    topic: regulatory-legal-risk-register
    missingEvidence: Comprehensive docket search of private arbitration disputes and state-level NIL non-compliance notices.
    whyItMatters: >-
      Individual arbitration clauses shield dispute volume from public view, concealing potential athlete or university
      friction.
    diligencePath: Request legal dispute and arbitration disclosure schedules under nondisclosure agreement.
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: blocking
    topic: audited-financial-metrics
    missingEvidence: Audited financial statements detailing exact ARR, subscription gross margin, churn, NRR, and cash burn.
    whyItMatters: >-
      Without audited ARR, valuation multiples cannot be grounded in empirical operating reality, leaving equity
      underwritten on narrative scale.
    diligencePath: >-
      Obtain confidential management presentation, audited income statements, and customer cohort retention schedules
      during confirmatory diligence.
    relatedQuestionRefs:
      - QV006
    relatedTableRefs:
      - TV001
      - TV003
  - type: missing-source
    severity: material
    topic: cap-table-dilution
    missingEvidence: >-
      Fully diluted cap table schedule detailing exact employee pool option overhang, convertible instruments, and
      secondary transaction pricing.
    whyItMatters: >-
      Liquidation preference orders and cumulative dividend rights dictate common equity proceeds in downside and
      middle-exit scenarios.
    diligencePath: Request company certificate of incorporation and capitalization table ledger verified by legal counsel.
    relatedQuestionRefs:
      - QV005
    relatedTableRefs:
      - TV001
