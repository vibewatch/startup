      Teamworks occupies the broad, sports-specific corner on issuer evidence, while alternative
      classes remain provisional because matched competitor documentation was unavailable.
    data:
      points:
        - label: Teamworks connected operating system
          x: 5
          y: 5
          note: Broadest evidenced workflow scope and explicitly sports-specific.
        - label: Teamworks Compliance module
          x: 3
          y: 5
          note: Narrower module with detailed sports-compliance workflow evidence.
        - label: Specialist athlete-management tools
          x: 2
          y: 5
          note: Sports-specific class; breadth is unverified in the reviewed evidence.
        - label: Internal build and spreadsheets
          x: 3
          y: 3
          note: Potentially broad and tailored, but external scope and quality are unverified.
        - label: Informal messaging
          x: 1
          y: 2
          note: Narrow communication substitute with risks described by Teamworks.
        - label: Generic collaboration suites
          x: 2
          y: 1
          note: Horizontal substitute; sports-specific capability was not evidenced.
    approximationNotes: >-
      Analyst ordinal scores from 1 (low) to 5 (high), not measured market data; x represents
      workflow breadth and y represents sports specificity. Unknown competitor capabilities cap
      confidence in relative placement.
    claimRefs: [CP001, CP007, CP010, CP015, CP016]
callouts:
  - calloutType: risk
    title: Search results do not establish a peer set
    body: >-
      Two directory results resolve to the wrong or generic company concept. Neither should be used
      as an independent benchmark for Teamworks' actual sports-technology competitors.
    claimRefs: [CP011, CP012]
  - calloutType: insight
    title: Suite breadth is both moat and integration test
    body: >-
      A connected portfolio can increase workflow utility and distribution leverage, but a 24+
      product footprint also raises the burden of coherent identity, data, permissions, and user
      experience.
    claimRefs: [CP001, CP005, CP015]
