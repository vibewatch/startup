company:
  name: Teamworks
chapter:
  number: 3
  title: Competitors
  summary: >-
    Teamworks presents the broadest evidenced proposition in the reviewed set: a sports-specific
    operating system spanning personnel, coaching, performance, operations, and compliance, with
    company-reported reach across 7,000+ teams. That breadth and distribution are meaningful
    advantages, but the available evidence does not support a reliable named-peer ranking, public
    price comparison, or quantified switching-cost assessment.
sections:
  - id: landscape-and-buyer-alternatives
    title: Landscape and buyer alternatives
    body: >-
      Teamworks competes less as a single point product than as a proposed operating layer for elite
      sports. Its official surfaces connect talent acquisition, operations, athlete development,
      coaching, and compliance, while company-issued job material describes either six product
      categories in an older repost or 24+ products in an October 2026 role. The relevant buyer
      choice therefore includes specialist athlete-management and performance tools, compliance
      point solutions, internally assembled workflows, generic collaboration products, and informal
      messaging - not only another suite vendor. The strongest distribution signal is company
      reported: 7,000+ teams on the current homepage and high penetration across major leagues in
      the June 2025 financing release. Those figures show claimed reach, not independently audited
      active customers. Two nominally independent directories are unsuitable for peer ranking:
      Krowdbase maps "Teamworks IRO" to insurance-claims products, while Heynet describes a generic
      collaboration vendor and explicitly labels its suggestions unverified.
    claimRefs: [CP001, CP002, CP003, CP004, CP005, CP006, CP011, CP012, CP014]
    tableRefs: [TP001]
  - id: capability-and-workflow-depth
    title: Capability and workflow depth
    body: >-
      The clearest product-level differentiation is workflow integration inside a sports-specific
      data model. Teamworks Compliance says it can apply NCAA and institution-specific rules,
      automate approvals, track activities, share recruiting data, and surface tasks in the same
      mobile app used by athletes and staff. Teamworks also claims that its athlete-management
      product provides centralized records, access controls, and audit trails. These are
      issuer-authored capability statements, not independent tests of implementation quality,
      uptime, security, or user adoption. The 2026 product-marketing role further indicates that the
      company is building differentiated positioning for coaching and player-personnel analytics
      across professional, collegiate, and international markets. The resulting comparison is
      asymmetric: Teamworks has detailed official capability evidence, while the assigned evidence
      set contains no matched competitor documentation. Unknown cells in the matrix are therefore
      evidence gaps rather than negative ratings.
    claimRefs: [CP001, CP006, CP007, CP008, CP009, CP014]
    tableRefs: [TP002]
  - id: commercial-model-and-distribution
    title: Commercial model and distribution power
    body: >-
      Distribution appears to be the most defensible visible advantage. Teamworks reports broad
      penetration across professional leagues, Division I athletic departments, and Olympic
      federations, and its buyer language spans front-office analysts through head coaches. A
      connected suite can also reduce duplicate entry and create a common athlete and organization
      record, increasing the operational cost of replacing multiple integrated modules at once.
      However, none of the eight reviewed sources discloses list price, per-seat or per-team units,
      contract duration, realized discounting, implementation fees, renewal behavior, or module
      attach rates. Nor do they quantify migration effort, data portability, multi-homing, or the
      economics of channel and technology partners. Consequently, distribution power is supported
      mainly by company-reported footprint, while lock-in and pricing power remain hypotheses for
      customer-reference and contract diligence.
    claimRefs: [CP002, CP003, CP006, CP008, CP013, CP016]
    tableRefs: [TP003]
  - id: durability-and-displacement-risk
    title: Durability and displacement risk
    body: >-
      Teamworks' moat case combines vertical workflow depth, a growing data layer, and broad
      deployment across elite sports. The June 2025 financing announcement directs capital toward
      AI, data unification, partner integrations, and a consolidated mobile app, which could deepen
      cross-product utility. The same architecture creates execution risk: a 24+ product portfolio
      must present coherent identity, permissions, data quality, and user experience across very
      different buyers. Specialist vendors can attack individual budgets on depth, while internal
      builds and informal tools remain substitutes when procurement or migration slows. Teamworks'
      own discussion of fragmented records and informal messaging highlights the status quo's
      privacy and coordination weaknesses, but it does not establish that all buyers will consolidate
      on Teamworks. With no valid independent benchmark or matched peer set in the reviewed evidence,
      the durable-moat conclusion remains provisional rather than a winner-take-all judgment.
    claimRefs: [CP009, CP010, CP014, CP015, CP016]
    figureRefs: [FP001]
