  evidenceGaps:
    - type: missing-source
      severity: material
      topic: competitor-evidence-gap
      missingEvidence: Independent, entity-matched profiles for named direct competitors covering scale, funding, target customer, scope, and strategic direction.
      whyItMatters: Without a validated peer set, relative market position and displacement risk cannot be ranked reliably.
      diligencePath: Obtain current competitor product documentation, financing records, customer references, and independent market coverage for each named peer.
      relatedQuestionRefs: [QP002]
      relatedTableRefs: [TP001]
    - type: private-evidence-only
      severity: material
      topic: pricing-gap
      missingEvidence: Teamworks and competitor price books, proposals, contract terms, implementation fees, realized discounts, renewals, and module attach rates.
      whyItMatters: Public capability breadth cannot establish pricing power, package economics, or value relative to point solutions.
      diligencePath: Review anonymized customer contracts and renewal cohorts, then run matched vendor quote requests for representative buyer segments.
      relatedQuestionRefs: [QP010]
      relatedTableRefs: [TP003]
    - type: private-evidence-only
      severity: material
      topic: switching-costs
      missingEvidence: Migration effort, data portability, implementation time, multi-homing behavior, churn reasons, and partner or channel economics.
      whyItMatters: Claimed integration may create lock-in, but the available evidence does not quantify durability or customer dependence.
      diligencePath: Interview recent wins, losses, and churned customers and review implementation plans, export terms, and integration agreements.
    - type: missing-source
      severity: material
      topic: independent-validation
      missingEvidence: Independent capability, security, usability, uptime, and implementation benchmarks for Teamworks and matched competitors.
      whyItMatters: Most positive capability evidence is company-issued and cannot establish comparative performance.
      diligencePath: Commission reference calls and technical validation using identical workflows, data volumes, permission models, and service-level criteria.
      relatedTableRefs: [TP002]
