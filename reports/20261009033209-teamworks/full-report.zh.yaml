  - id: TV002
    title: 投资论点 / 反论点表
    columns:
      - 支柱
      - 投资论点
      - 反论点
      - 什么会改变这一判断
    rows:
      - - 市场领先地位
        - 在一级体育联盟中近乎垄断式渗透（NFL 100%、MLB/EPL 90%、NCAA DI 99%）
        - 细分市场的总可寻址市场（TAM）受全球职业和精英大学球队数量有限所约束
        - 成功商业拓展至战术军事或青少年体育生态的证据
      - - 产品广度
        - 完整操作系统栈在一个应用中统一人员、表现、教练和运营
        - 连续收购（Smartabase、Zelus、ARMS）带来代码库碎片化和整合复杂度
        - 第三方客户案例显示，统一单一界面 API 的采用无需数据孤岛
      - - 资本与估值
        - Dragoneer、Hg 和 AllianceBernstein 的一级投资支持验证了平台的持续增长
        - 近期 $1.5B-$1.8B 的投后估值在 ARR 未披露的情况下已计入激进倍数
        - 正式披露经审计财务报表，证明 ARR 规模可持续且现金流为正
      - - 平台治理
        - 作为合规、NCAA 规则和敏感运动员医疗数据的关键记录系统
        - 运动员数据隐私、GDPR 和医疗记录泄露带来较高法律与监管责任
        - SOC2 Type II 合规报告和自动化机构控制核验记录
    notes: 分析将已核实的平台采用规模，与私营企业 SaaS 的约束和整合阻力进行对比。
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV007
      - CV011
      - CV014
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 关键运营假设
      - 估值与回报逻辑
      - 关键风险与下行触发因素
      - 概率信号
    rows:
      - - 乐观情景
        - 平台 ARR 超过 $150M+；AI 附加模块和战术军事部署推动 ARPU 扩张
        - 通过成功 IPO 或大型赞助方收购，以 ARR 的 12x-15x 实现 $2.5B-$3.0B 目标估值
        - 如果精英体育部门抵制多产品捆绑涨价，平台流失率上升
        - 25%
      - - 基准情景
        - 核心体育客户留存率保持 >95%；ARR 温和增至 $100M-$120M；EBITDA 利润率接近盈亏平衡
        - 以 ARR 的 10x-12x 实现 $1.5B-$1.8B 目标估值，维持当前私募轮次水平
        - 资本密集型收购掩盖有机增长停滞；估值倍数收缩
        - 50%
      - - 悲观情景
        - 有机增长放缓至 10% 以下；大学体育预算削减挤压 SaaS 支出；并购整合停滞
        - 估值修正至 $750M-$900M（下跌 30%-50%），跨过优先股清算门槛
        - 重大医疗 / NIL 合规数据泄露或学生运动员隐私诉讼引发声誉危机
        - 25%
    notes: 前瞻情景基于当前成长阶段软件基准，对隐含倍数和结构性结果建模。
    claimRefs:
      - CV003
      - CV006
      - CV008
      - CV010
      - CV013
      - CV014
