      - number: '6.4'
        title: 留存动力、多产品扩张与运营摩擦
        blocks:
          - type: paragraph
            body: >
              Teamworks 采用先落地再扩张的商业模式，试图把 Nutrition、General Manager、Wallet 和球探软件等模块交叉销售给最初因沟通或排期工具签约的客户。例如，Irish Rugby
              Football Union（IRFU）在既有部署中增加了 Teamworks AMS 和 Nutrition；LSU、Maryland 等体育部门则采用 Teamworks General Manager 和
              Wallet 处理收入分成。尽管有这些扩张案例，核心 SaaS 指标的公开可见度仍有限：Teamworks 不披露
              NRR、GRR、年度流失率或各客户层级的平均合同价值。考虑到客户组织达数千家，按单支球队计算的客户集中度似乎较低；但联盟和分区范围的高标准化会造成结构性采购摩擦。此外，14 次收购带来的整合疲劳、收购资产如
              PFF 在 2026 年 3 月的裁员，以及 Kitman Labs、CoachMePlus 等专业运动员管理竞争者，都在拖慢企业销售周期。
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU013
              - CU014
              - CU015
      - number: '6.5'
        title: 展示项
        blocks:
          - type: callout
            title: 企业广度与单点方案深度的取舍
            body: >
              Teamworks 自报的 7,000+ 支球队规模凸显其在精英体育中的巨大商业分销能力。但由于大量客户基础来自 14 次企业收购，要在不同软件模块之间维持深度用户满意度仍是长期挑战。Hub、Compliance
              等行政工具能保持较强部门留存；表现部门却常评估 Kitman Labs 等体育医疗和 AMS 专业替代品，一旦产品整合失灵，就可能形成流失路径。
