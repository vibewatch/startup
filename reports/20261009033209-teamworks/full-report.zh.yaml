        title: 展示项
        blocks:
          - type: callout
            title: 资本配置立场：承诺投资前继续研究
            body: 尽管 Teamworks 在顶级大学和职业体育联赛中占据强势市场份额，成长阶段投资者仍必须克制，不要在管理层提供经核实的 ARR、收入留存和毛利率披露之前，为 $1.5B 至 $1.8B 的顶级软件估值倍数买单。
