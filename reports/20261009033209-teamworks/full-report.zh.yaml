            body: >-
              平台的商业模式高度依赖第三方技术供应商和媒体分发许可方，包括 IMAGN Content Services、Getty Images 和 Epidemic
              Sound，同时还依赖商用云托管基础设施与通信网络。与此同时，Teamworks 的 F 轮融资由 Dragoneer Investment Group 领投，筹得 $235 million，投后估值超过
