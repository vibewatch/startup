  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 按时间梳理 Teamworks 从校际赛程管理起步，到成为独角兽及 NIL / 收入分成操作系统的发展历程。
    approximationNotes: 日期代表已核实的机构融资公告和产品发布信息。
    data:
      items:
        - label: 2004 - 公司成立
          date: '2004-01-01'
          detail: 前 Duke 橄榄球运动员 Zach Maurides 在北卡罗来纳州达勒姆创办公司，解决体育赛程管理问题。
        - label: 2016 - A 轮风险融资
          date: '2016-07-01'
          detail: 获得 $6M A 轮融资，将运营工具拓展至各校际体育部门。
        - label: 2018 - B 轮机构融资
          date: '2018-03-01'
          detail: 完成 $15.3M B 轮融资，将沟通和运营工具拓展至职业联盟。
        - label: 2020 - C 轮融资
          date: '2020-04-01'
          detail: 在体育活动受扰期间完成 $25M C 轮融资，加速数字化运营的采用。
        - label: 2022 - D 轮融资
          date: '2022-06-01'
          detail: 获得 $50M D 轮融资，启动体育科学和招募软件领域的系统性收购。
        - label: 2023 - E 轮成长融资
          date: '2023-04-01'
          detail: 完成 $65M E 轮融资，将新收购的点解决方案整合进 The Operating System for Sports。
        - label: 2025 - F 轮 $1B+ 独角兽融资
          date: '2025-06-17'
          detail: 完成超额认购的 $235M F 轮融资，由 Dragoneer Investment Group 领投，估值超过 $1.0B。
        - label: 2026 - 收入分成与合规规模化
          date: '2026-04-01'
          detail: 将 Teamworks GM 和 Compliance 套件拓展至 120 多个管理校际收入分成的体育部门。
