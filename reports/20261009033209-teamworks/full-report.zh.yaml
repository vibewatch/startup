            body: >
              公司报告称，其运营版图为全球超过 7,000 个体育组织和高性能球队提供支持。商业披露显示，Teamworks 在核心国内市场几乎实现全面覆盖：100% 的 NFL 球队、99% 的 NCAA Division
              I 体育部门、90% 的 MLB 球队、90% 的英格兰 Premier League 俱乐部、87% 的 NBA 球队、83% 的 MLS 球队、81% 的 NHL 俱乐部，以及 24 个国家的 65
              多个奥林匹克联合会。但尽调显示，表面客户标识渗透与完整套件企业采用之间存在关键差异。许多精英职业和大学客户关系最初只是通过 Teamworks Hub 或 Smartabase、Kairos、ARMS
              Software 等单点收购产品购买沟通或排期订阅，而非整个平台合同。活跃用户既有超过 1,200 名学生运动员的完整大学体育部门，也有只使用独立运动员管理软件的单个表现部门。
