        - 许可撤销、版税争议或分发费率上涨
        - 中
        - 合同约定的仅限编辑使用的限制和用户归属规则
        - 运动员营销的自动媒体创作功能可能丧失
      - - 机构买方基础
        - NCAA Division I 与职业球队
        - 核心企业订阅客户
        - 严重
        - 预算收缩、体育联盟重组或整合反弹
        - 高
        - 扩展覆盖人员、运营和教练业务的多产品企业组合
        - 客户可能因高端附加模块而流失或拒绝续约
      - - 成长股权投资联合体
        - Dragoneer Investment Group 与共同投资者
        - 主要资本与董事会治理
        - 高
        - 较高的目标 IRR 触发提前退出压力或低价轮资本重组
        - 高
        - 以现金流盈亏平衡为目标，并交叉销售收购的产品线
        - 普通股股东之上存在大额清算优先权
    notes: 评估公开融资披露中记录的商业、财务和合作伙伴交易对手依赖。
    claimRefs:
      - CR001
      - CR008
      - CR009
      - CR010
