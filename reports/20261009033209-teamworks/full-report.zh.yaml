  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律框架脆弱性
        blocks:
          - type: paragraph
            body: >-
              Teamworks 处于快速变化的大学体育监管、姓名肖像和形象（NIL）合规监督以及复杂商业协议的交汇处。公司的 Influencer 产品（前身为
              INFLCR）让学生运动员和合作机构承担严格合规义务及第三方媒体联合发布条款，包括强制个人仲裁、广泛的用户内容再许可，以及对业余协会违规承担完整运动员赔偿责任。NCAA 章程、机构合规解释和各州 NIL
              立法不断受到法律争议并修订；若软件工作流逻辑与机构控制不匹配，合作体育部门就可能面临资格处罚、奖学金损失和严重监管暴露。独立市场分析还指出，随着整合加速，扩张中的多运动项目平台并购会因合同条款、运营边界和监管持久性受到严格审视。
            claimRefs:
              - CR001
