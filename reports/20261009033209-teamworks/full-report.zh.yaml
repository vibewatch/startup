      - number: '8.2'
        title: 融资历史、股权结构表与估值纪律
        blocks:
          - type: paragraph
            body: >-
              Teamworks 在 2025 年 6 月通过 Dragoneer Investment Group 领投、超额认购的 $235 million F 轮融资跻身独角兽，投前估值超过 $1.0
              billion，累计融资额也突破 $400 million。私募市场数据和二级市场情报显示，2026 年公司继续扩张融资：2026 年 4 月，Hg 和 AllianceBernstein 领投的 G
              轮成长资本投资将公司估值推至 $1.51 billion（每股 $2.40）；随后 2026 年 8 月的 H 轮融资投后估值达到 $1.83 billion（每股 $2.57），累计记录融资额达到 $619.9
              million。公司估值相较 2016 年 $20.83 million 的 A 轮已增长超过 70 倍，但公开二级市场流动性仍受到严格限制，交易价格发现也很有限。Forge Global
              的资本结构数据显示，后期优先股各类别带有 1.0x 非参与型清算优先权和 6.0% 累计股息条款；这会形成巨大的优先权悬置，只有在资深股权持有人先行清除后，普通股股东才能充分享受倍数扩张。
            claimRefs:
              - CV003
              - CV004
              - CV006
              - CV008
              - CV009
              - CV010
              - CV012
          - type: table
            tableRef: TV001
            claimRefs:
