              - CP016
      - number: '3.2'
        title: 能力与工作流深度
        blocks:
          - type: paragraph
            body: >-
              最清晰的产品差异化在于体育专用数据模型内的工作流整合。Teamworks Compliance 声称能够应用 NCAA
              和机构规则、自动审批、跟踪活动、共享招募数据，并在运动员和工作人员使用的同一移动应用中呈现任务。Teamworks
              还声称其运动员管理产品提供集中式记录、访问控制和审计轨迹。这些是发布方撰写的能力声明，不是对落地质量、正常运行时间、安全性或用户采用的独立测试。2026
              年产品营销岗位还显示，公司正在为职业、大学和国际市场的教练及球员人员分析打造差异化定位。因此比较存在不对称：Teamworks
              有详细官方能力证据，而指定证据集中没有匹配的竞争者资料。矩阵中的未知单元格是证据缺口，不是负面评分。
            claimRefs:
              - CP001
              - CP006
              - CP007
              - CP008
              - CP009
              - CP014
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP006
              - CP007
              - CP008
              - CP009
              - CP013
              - CP014
      - number: '3.3'
        title: 商业模式与分销能力
        blocks:
          - type: paragraph
            body: >-
              分销似乎是最有支撑的可见优势。Teamworks 报告称已广泛进入职业联赛、Division I
              体育部门和奥林匹克联合会，买方话术覆盖从前台分析师到主教练。互联套件还能减少重复录入、建立统一的运动员和组织档案，从而提高一次性替换多个整合模块的运营成本。但审阅的八个来源都没有披露标价、按席位或球队计费的单位、合同期限、实际折扣、实施费用、续约行为或模块附着率，也没有量化迁移工作、数据可携带性、多平台并用或渠道及技术伙伴的经济性。因此，分销能力主要由公司自报覆盖范围支持；锁定效应和定价能力仍是需要客户访谈和合同尽调验证的假设。
            claimRefs:
              - CP002
              - CP003
              - CP006
              - CP008
              - CP013
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP007
              - CP008
              - CP013
              - CP016
      - number: '3.4'
        title: 持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              Teamworks 的护城河论点结合了垂直工作流深度、不断扩大的数据层以及在精英体育中的广泛部署。2025 年 6 月融资公告称资本将投向
              AI、数据统一、伙伴整合和统一移动应用，这可能提升跨产品效用。但同一架构也带来执行风险：24+
              款产品必须在完全不同的买方之间保持一致的身份、权限、数据质量和用户体验。专业供应商可以凭借深度争夺单项预算；采购或迁移变慢时，内部搭建和非正式工具仍是替代方案。Teamworks
              自己对记录割裂和非正式消息的讨论凸显了现状在隐私与协同上的弱点，但并不能证明所有买方都会集中到 Teamworks。由于审阅证据中没有有效的独立基准或匹配同行集合，持久护城河的结论仍是暂定判断，而非赢家通吃。
