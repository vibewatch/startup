  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源、软件变现架构与定价机制
        blocks:
          - type: paragraph
            body: >-
              Teamworks
              主要通过经常性企业软件即服务（SaaS）订阅、多年机构许可和模块化增购，在大学体育部门、职业球队及战术组织中变现其体育运营系统。公司不是投资工具、交易经纪商或消费者订阅服务；核心商业引擎是按部门层级、球队数量和功能模块计费的年度经常性软件许可。在大学业务中，Teamworks
              销售覆盖行政协同、合规监控和运动员沟通的订阅，并交叉销售表现分析、营养跟踪和合规工作流引擎等专用模块。运动员薪酬框架落地后，变现路径扩展至运动员管理、NIL
              合规跟踪和数字发放基础设施，如为体育部门集中处理付款和税务跟踪的 Teamworks Wallet。单个模块的官方标价仍不透明，通常在企业采购方案中定制，实际合同金额取决于机构级别、阵容规模和软件组合深度。
