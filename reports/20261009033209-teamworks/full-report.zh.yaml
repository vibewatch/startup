      - number: '1.4'
        title: 展示项
        blocks:
          - type: callout
            title: The Operating System for Sports 战略
            body: >-
              Teamworks 已从体育队伍沟通工具成功转型为企业级整合平台。通过收购 INFLCR、ARMS Software、Smartabase 和 Zelus Analytics 等公司，Teamworks 在
              Division I 体育和职业球队中建立了深厚的防御壁垒，试图成为现代体育部门运营不可或缺的后端。
            calloutType: insight
            claimRefs:
              - CO001
              - CO004
              - CO007
          - type: callout
            title: 财务披露不透明与收入现实
            body: >-
              尽管 Teamworks 在 2025 年 Series F 融资中达到名义上的 $1.0B+ 估值，公司没有提供经验证的 GAAP
              财务报表，ARR、净留存率、软件毛利率和运营现金消耗都对公众不可见。第三方估算在 $81.5M 至 $107.7M 之间波动，且没有审计佐证。
            calloutType: risk
            claimRefs:
              - CO008
              - CO009
              - CO012
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类范围与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              精英体育运营系统市场处于体育管理软件、运动员管理系统（AMS）、球探智能和运动员薪酬工作流的交汇处。过去，体育组织依靠单点方案、旧式
              ERP、通用表格和消息应用等横向协作软件，或内部数据库处理行政和体育工作流。Teamworks 将自身品类定义为连接部门孤岛的综合运营系统，把运动员排期、合规、招募、医疗记录、表现跟踪、战术球探和 NIL
              付款分配接入统一数据架构。可服务软件边界包括由大学体育部门、职业球队、联赛和奥林匹克管理机构直接采购的企业运营软件、专有视频分析和教练智能；但明确不包括下游球迷互动应用、场馆票务基础设施、零售体育商品、大众青少年联赛管理工具和广播转播权，因为它们的采购周期和商业动力不同。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: 市场规模视角与受限支出估算
        blocks:
          - type: paragraph
            body: >-
              估算精英体育运营软件的可服务市场，需要把宽泛的垂直 SaaS 基准拆成经过验证的组织支出层级。若把广播权、体育场硬件和消费级穿戴设备混在一起，广义商业体育科技和分析市场估算可达
              $10B；但面向球队的平台可触达的软件与数据智能 TAM 受精英机构数量上限约束。北美及国际体育生态约包括顶级联赛 330 支职业球队、NCAA Division I 约 520 个大学体育部门，以及估计 65
              个国际管理机构和奥林匹克联合会。可获得支出由年度合同价值（ACV）决定，从 $25,000 的基础沟通和排期订阅，到包含球探数据与视频分析、超过 $250,000
              的全栈企业协议。核心运营软件的总可获得收入受精英体育组织数量的物理上限约束，因此平台必须通过收购 Atrium Sports、Pro Football Focus
              等专业智能资产扩大钱包份额，而不能只靠新增客户标识。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM007
              - CM008
      - number: '2.3'
        title: 买方分层、工作流归属与采购路径
        blocks:
          - type: paragraph
            body: >-
              体育组织的采购受不同部门职责、预算权限和工作流负责人影响。在大学体育部门，体育主任（AD）、CFO 和高级副体育主任掌握机构企业预算，预算动因包括联盟级合规要求、Title IX
              治理和学生运动员福祉。相比之下，战术教练组和球探人员拥有独立运营预算，重点是即时人才获取和比赛准备，常自行采购 Synergy Sports、PFF Ultimate 等专用球探工具。在 NFL、Premier
              League、NBA 和 NHL 等职业球队，General Manager 和 Sports Science Director
              根据伤病缓解、运动员可出场性和战术表现提升评估软件。部门既有工作流也阻碍企业平台落地：若单点登录系统无法保留深度的专项功能，体能教练、学业顾问和位置教练往往会抵制行政集中化。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: 采用顺风、监管催化剂与结构性约束
        blocks:
          - type: paragraph
            body: >-
              大学体育监管变化加速了集中式体育运营平台的采用，尤其是 Name, Image, and Likeness（NIL）集体及机构收入分成框架的确立。直接管理运动员薪酬、税务申报和合规需要专门交易基础设施，使
              Teamworks Wallet 等模块成为关键财务工具。同时，职业球队正转向预测式 AI
              和客观人才估值，推动对统一表现数据库的需求。但严峻的采用约束会压低长期市场增速。除顶级橄榄球和足球项目外，体育组织的财政空间紧张，软件可选支出受限。激进的平台并购还会带来整合债务、数据模型不匹配和不同收购资产之间的界面摩擦；专业视频和跟踪竞争者则在各运动项目内形成持续的迁移壁垒。
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 机构上限迫使公司依靠并购扩张
            body: >-
              全球约 2,350 家一级精英体育机构构成严格有限的客户群，软件提供商无法只靠新增客户实现风险投资级收入增长。渗透率达到高位后——Teamworks 声称已覆盖 100% 的 NFL、NHL 和 Premier
              League 俱乐部——收入增长就必须依靠激进的垂直交叉销售，并收购 Synergy Sports、PFF 等相邻数据资产。
            calloutType: insight
            claimRefs:
              - CM006
              - CM007
              - CM008
          - type: callout
            title: 快速多资产并购带来的整合债务
            body: >-
              快速推进多产品并购会造成严重运营摩擦。把 14
              家拥有不同代码库、数据库模式和用户界面的公司合并，会持续累积整合债务。如果核心单点产品在收购后失去专业能力，体育部门和球队前台就可能遭遇割裂的用户体验，进而产生不满和流失。
            calloutType: risk
            claimRefs:
              - CM003
              - CM015
              - CM016
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              Teamworks 与其说是一款单点产品，不如说是精英体育的拟议运营层。其官方页面连接人才获取、运营、运动员发展、教练和合规；公司招聘材料则显示，旧版转载稿提到六类产品，2026 年 10 月的岗位又提到 24+
              款产品。因此买方的选择还包括专业运动员管理和表现工具、合规单点方案、内部拼装的工作流、通用协作产品及非正式消息工具，而不只是另一家套件供应商。最强的分销信号来自公司自报：当前主页显示 7,000+
              支球队，2025 年 6 月融资公告也称其在主要联赛渗透率很高。这些数字代表声称的覆盖范围，并非独立审计的活跃客户数。两个名义上独立的目录不适合用于同行排名：Krowdbase 将 “Teamworks IRO”
              对应到保险理赔产品，Heynet 则描述一家通用协作供应商，并明确标注其推荐未经验证。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP011
              - CP012
              - CP014
