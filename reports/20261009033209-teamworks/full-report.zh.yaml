      - number: '8.3'
        title: 情景分析、退出准备度与尽调要求
        blocks:
          - type: paragraph
            body: >-
              对 Teamworks 进行基准、乐观和悲观情景分析后可以看到，当前 $1.5B 至 $1.8B 的表面估值，隐含软件收入持续以 25% 至 35% 的速度复合增长，同时还要求跨支柱平台变现和 AI
              工作流扩张顺利。乐观情景下，企业将职业体育与奥运体育数据整合起来，足以支撑公司最终 IPO 时超过 ARR 的 10x 至 12x
              公开软件退出倍数。基准情景下，核心联赛客户流失几乎可以忽略，但每支球队平均收入（ARPU）偏低，限制了收入增速，因此私募市场估值约为 $1.5B，对应远期 ARR 的 8x 至
              10x。悲观情景下，披露不足掩盖了高客户获取成本、北美大学体育预算见顶，以及历史并购带来的整合摩擦，形成下一轮降价融资或倍数持平风险。我们给出“继续研究”建议，置信度为中等，并认为估值偏高；投资前必须满足严格的否决条件，包括独立
              ARR 披露、确认毛利率高于 70%，以及经核实的并购后留存指标。
            claimRefs:
              - CV006
              - CV008
              - CV010
              - CV013
              - CV014
              - CV015
              - CV016
