  - id: TV001
    title: 建议汇总表
    columns:
      - 维度
      - 评估
      - 支持证据
      - 决策含义
    rows:
      - - 建议
        - research-more
        - 覆盖 6,500+ 支球队并占据主导市场地位，但完全没有经审计的 ARR 和利润率数据
        - 在审阅专有财务账簿和队列留存前，暂缓配置成长股权资本
      - - 信心
        - medium
        - 机构投资者联合体（Dragoneer、Hg、AllianceBernstein）已核实，但第三方数据不透明
        - 对未经核实的平台说法打折；通过客户引荐直接交叉核对客户账单
      - - 风险评级
        - high
        - 多次收购带来的技术债务、优先股堆叠悬置以及数据合规责任
        - 要求进行下行情景清算优先权建模和技术栈整合安全审计
      - - 估值立场
        - stretched
        - 在底层 ARR 运行率未披露的情况下，估值从 2023 年的 $536M 激增至 2026 年的 $1.83B
        - 寻求结构性反稀释保护，避免按二级市场峰值每股价格支付
    notes: 评估综合了已核实的机构轮次历史、官方客户覆盖基准和私募市场二级指标。
    claimRefs:
