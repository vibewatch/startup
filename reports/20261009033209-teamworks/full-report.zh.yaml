          - type: callout
            title: 并购后扩张中的商业摩擦与整合拖累
            body: >
              从排期扩展到数据密集型球探和 NIL 财务运营，会带来实质运营难题。2026 年 3 月 PFF 等收购单元出现劳动力重组，加上面向消费者业务的拆分，都说明整合摩擦仍在持续。Teamworks
              试图把传统单产品买方转化为高价值统一平台协议；数据互操作延迟会拉长销售周期，并压低预期客户扩张速度。
            calloutType: risk
