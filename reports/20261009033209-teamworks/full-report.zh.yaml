  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              Teamworks 的核心投资论点是：它正在成为高水平体育领域无可争议的操作系统，已在 100% 的 NFL 球队、90% 的 MLB 俱乐部、90% 的英超球队和 99% 的 NCAA Division I
              体育部门中取得经核实的市场渗透。公司围绕人员、表现、教练和运营四大支柱持续开发产品，并通过收购 INFLCR、ARMS Software、Smartabase、Zelus Analytics 和
              Telemetry Sports 等公司，筑起覆盖广泛的企业软件护城河，客户切换成本很高。反论点则集中在极度不透明的运营情况和资本结构风险：Teamworks
              及其机构投资方都没有披露经审计的年度经常性收入（ARR）、订阅毛利率、净收入留存率（NRR），也没有拆分有机增长和并购驱动增长。多产品快速并购整合还带来沉重的软件整合成本、跨部门数据治理暴露，以及在日益复杂的体育科技市场中利润率被压缩的风险。
            claimRefs:
              - CV001
