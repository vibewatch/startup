      - number: '6.3'
        title: 具名客户证明与案例研究证据
        blocks:
          - type: paragraph
            body: >
              有记录的客户实施案例显示，大学和职业环境都已出现经过验证的工作流采用。大学体育方面，University of Wyoming、UNC Asheville 和 Harvard University 等机构部署
              Teamworks Compliance，为最多 42 支校队和 1,200 名学生运动员集中管理资格跟踪和规则自动化。Georgia Southern University 表示采用 Teamworks
              Academics 后将学业行政工作量减半；Auburn University 记录显示使用 Teamworks S&C 后力量与体能计划时间减少 50%。职业足球方面，包括 Al Ain FC
              在内的欧洲和中东球队部署了 Hub、AMS、S&C 和 Nutrition 组成的综合表现套件，用于冠军赛季的日常训练准备。近期，Brazilian Basketball
              Confederation（CBB）签署四年协议，统一国家队运营；Teamworks 还在收购比利时运动员数据公司 Opteamal 后宣布实现对 Premier League 客户的全面覆盖。
