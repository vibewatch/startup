chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、运营版图与商业模式
        blocks:
          - type: paragraph
            body: >-
              Teamworks（法定名称为 Teamworks Innovations, Inc.）是一家总部位于 Durham、North Carolina 的垂直软件公司，称其产品为 The Operating
              System for Sports。公司以多产品 SaaS 生态连接精英体育机构的体育管理、合规、运动员管理、运营和人才协同。公司在 Durham 创立后扩展至北美体育领域，如今为全球 6,500 至 7,000
              多支球队提供服务，其中包括 99% 的 NCAA Division I 体育部门，以及 NFL、MLB、Premier League、NBA、MLS 和 NHL
              等主要职业联赛的大多数球队。其商业模式依靠向体育部门、职业球队、奥林匹克联合会及军事和战术组织销售多产品软件订阅。随着机构直接分成制度落地，近期产品扩展越来越聚焦学生运动员收入分成工作流和合规自动化。
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO007
              - CO010
              - CO013
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO003
              - CO007
              - CO008
              - CO009
      - number: '1.2'
        title: 高管领导、治理与关键人物暴露
        blocks:
          - type: paragraph
            body: >-
              Teamworks 的领导核心是创始人兼 CEO Zach Maurides。他凭借大学体育经历创办公司，并推动其从体育排期和消息工具成长为规模化垂直软件集团。核心高管包括 CFO Kyle
              Charters、首席商务官 Robin Coackley 及联合创始人 Mitch
              Heath。技术和市场执行由多位职能副总裁支持，覆盖大学体育总经理、全球企业业务、产品营销、客户成功以及安全与可靠性工程。高管团队深谙体育部门工作流，但组织风险仍集中在对 Maurides
              的关键人物依赖上：多轮融资和程序化收购期间，他一直是公司的战略愿景与运营中枢。
            claimRefs:
              - CO003
              - CO005
              - CO006
              - CO011
          - type: table
            tableRef: TO002
            claimRefs:
              - CO005
              - CO006
              - CO011
      - number: '1.3'
        title: 资本化历史、投资者基础与公司里程碑
        blocks:
          - type: paragraph
            body: >-
              Teamworks 于 2025 年 6 月凭借超额认购的 $235 million Series F 融资成为独角兽，领投方为老股东、成长型股权投资机构 Dragoneer Investment
              Group，投前估值超过 $1.0 billion。交易同时包含用于加速人工智能和数据科学项目的新增成长资本，以及向现有股东提供的老股流动性。早期机构投资者包括 Seaport Capital、General
              Catalyst 和 Delta-v Capital。按是否计入老股部分与债务融资，公司的累计融资额在 $396.3 million 至 $422 million
              之间。但各类清算优先权、董事会席位、投票控制安排和员工期权池等详细资本化参数均严格未披露。第三方追踪机构对年收入的估算也相互矛盾，区间为 $81.5 million 至 $107.7 million，说明经验证的
              GAAP 收入披露完全缺失。
