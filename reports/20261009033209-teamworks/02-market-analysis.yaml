callouts:
  - calloutType: "insight"
    title: "Institutional Ceiling Compels M&A-Driven Expansion"
    body: "Because elite sports organizations represent a strictly finite population of roughly 2,350 tier-one institutions globally, software providers cannot achieve venture-scale revenue growth through new logo acquisition alone. Once high penetration is reached—exemplified by Teamworks claiming adoption in 100% of NFL, NHL, and Premier League clubs—continued revenue growth necessitates aggressive vertical cross-selling and acquiring adjacent data assets like Synergy Sports and PFF."
    claimRefs:
      - "CM006"
      - "CM007"
      - "CM008"
  - calloutType: "risk"
    title: "Integration Debt from Rapid Multi-Asset Roll-Up"
    body: "Executing rapid multi-product roll-ups creates acute operational friction. Combining 14 acquisitions spanning disparate codebases, database schemas, and user interfaces introduces ongoing integration debt. Athletic departments and front offices frequently experience fragmented user experiences, risking customer dissatisfaction and churn if core point solutions lose specialized capability post-acquisition."
    claimRefs:
      - "CM003"
      - "CM015"
      - "CM016"
