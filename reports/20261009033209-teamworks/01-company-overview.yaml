callouts:
- calloutType: insight
  title: The Operating System for Sports Strategy
  body: Teamworks has successfully transitioned from an athletic team communication utility into an enterprise aggregator.
    Through programmatic acquisitions (such as INFLCR, ARMS Software, Smartabase, and Zelus Analytics), it has established
    deep defensive moats across Division I athletics and professional franchises, positioning the business as the indispensable
    backend for modern athletic department operations.
  claimRefs:
  - CO001
  - CO004
  - CO007
- calloutType: risk
  title: Opaque Financial Disclosures and Revenue Realities
  body: Despite achieving a nominal $1.0B+ valuation during its Series F financing in 2025, Teamworks provides no verified
    GAAP financial statements, leaving annual recurring revenue, net retention rates, software gross margins, and operating
    cash burn entirely shielded from public scrutiny. Third-party estimates varying between $81.5M and $107.7M lack audit
    corroboration.
  claimRefs:
  - CO008
  - CO009
  - CO012
