chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Operating Footprint, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Teamworks (legally Teamworks Innovations, Inc.) is a vertical software company headquartered in Durham,
              North Carolina, providing what it designates as The Operating System for Sports. The company operates as a
              multi-product SaaS ecosystem connecting athletic administration, compliance, athlete management,
              operations, and talent coordination across elite athletic institutions. Historically founded in Durham and
              scaling across North American athletics, Teamworks currently powers more than 6,500 to 7,000 sports teams
              worldwide, including 99% of NCAA Division I athletic departments and overwhelming majorities of teams
              across major professional leagues (NFL, MLB, Premier League, NBA, MLS, and NHL). The underlying business
              model relies on multi-product software subscriptions sold to athletic departments, professional sports
              franchises, Olympic federations, and military and tactical organizations. Recent product expansion has
              increasingly focused on student-athlete revenue sharing workflows and compliance automation following the
              implementation of direct institutional revenue-sharing mandates.
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO007
              - CO010
              - CO013
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO003
              - CO007
              - CO008
              - CO009
      - number: '1.2'
        title: Executive Leadership, Governance, and Key-Person Exposure
        blocks:
          - type: paragraph
            body: >-
              The leadership of Teamworks is anchored by Founder and Chief Executive Officer Zach Maurides, who founded
              the company based on his collegiate athletic experience and has guided its evolution from a sports
              scheduling and messaging tool into a scaled vertical software conglomerate. Key executive leadership
              includes Chief Financial Officer Kyle Charters, Chief Commercial Officer Robin Coackley, and Co-Founder
              Mitch Heath. Technical and go-to-market execution is supported by functional vice presidents spanning
              collegiate general management, global enterprise, product marketing, customer success, and security and
              reliability engineering. While this executive bench demonstrates deep vertical familiarity with athletic
              department workflows, organizational risk remains concentrated around key-person dependence on Maurides,
              who has served as the continuous strategic vision and operational center of the enterprise across multiple
              funding cycles and programmatic acquisitions.
            claimRefs:
              - CO003
              - CO005
              - CO006
              - CO011
          - type: table
            tableRef: TO002
            claimRefs:
              - CO005
              - CO006
              - CO011
      - number: '1.3'
        title: Capitalization History, Investor Base, and Corporate Milestones
        blocks:
          - type: paragraph
            body: >-
              Teamworks reached unicorn status in June 2025 through an oversubscribed $235 million Series F financing
              round led by returning growth-equity investor Dragoneer Investment Group at a pre-money valuation
              exceeding $1.0 billion. The transaction comprised both primary growth capital intended to accelerate
              artificial intelligence and data science initiatives and secondary liquidity for existing shareholders.
              Prior institutional backers across earlier venture rounds include Seaport Capital, General Catalyst, and
              Delta-v Capital. Across its lifetime financing trajectory, cumulative capital raised stands between $396.3
              million and $422 million depending on the inclusion of secondary components and debt facilities. However,
              detailed capitalization parameters—including class-by-class liquidation preferences, governance board
              seats, voting control arrangements, and employee option pool reserves—remain strictly undisclosed.
              Furthermore, third-party web trackers report contradictory estimates of annual revenue ranging from $81.5
              million to $107.7 million, underscoring the total absence of verified GAAP revenue disclosures.
            claimRefs:
              - CO003
              - CO008
              - CO009
              - CO012
              - CO014
