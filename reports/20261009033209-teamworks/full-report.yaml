  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Buyer Profiles
        blocks:
          - type: paragraph
            body: >
              Teamworks structures its commercial reach across three primary tiers: collegiate athletic departments,
              elite professional sports franchises, and national governing bodies or Olympic federations. In the
              collegiate segment, the primary buyer is typically the athletic director, senior associate athletic
              director, or chief financial officer, who procures department-wide packages such as Teamworks Elite, Hub,
              Academics, and Compliance & Recruiting to standardize administrative operations across dozens of varsity
              teams and hundreds of student-athletes. At the individual team level within collegiate programs, head
              coaches and performance directors serve as key operational users for specialized tools like Teamworks
              Player Personnel, Strength & Conditioning, and Nutrition. In professional sports, procurement is
              bifurcated between sporting directors and technical leadership—who evaluate performance, video analytics,
              and athlete management systems—and front-office executives managing operational logistics, travel, and
              roster communication. While collegiate clients focus heavily on administrative consolidation, compliance
              risk mitigation, and recent student-athlete compensation workflows, professional organizations prioritize
              bespoke data integration, athlete availability, and tactical scouting advantage.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU013
