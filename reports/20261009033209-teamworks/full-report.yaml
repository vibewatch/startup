      - number: '6.2'
        title: Adoption Trajectory, Scale Claims, and Breadth
        blocks:
          - type: paragraph
            body: >
              The company reports an aggregate operational footprint powering more than 7,000 sports organizations and
              high-performance teams worldwide. According to commercial disclosures, Teamworks has achieved near-total
              market share in core domestic segments, including 100% of NFL teams, 99% of NCAA Division I athletic
              departments, 90% of MLB teams, 90% of English Premier League clubs, 87% of NBA franchises, 83% of MLS
              teams, 81% of NHL clubs, and over 65 Olympic federations across 24 countries. However, diligence indicates
              a critical distinction between headline logo penetration and full-suite enterprise adoption. Many elite
              professional and collegiate relationships originated as narrow communication or scheduling subscriptions
              through Teamworks Hub or point-solution acquisitions such as Smartabase, Kairos, or ARMS Software, rather
              than holistic platform-wide contracts. Active user populations range from entire university athletic
              departments with more than 1,200 student-athletes down to single performance departments utilizing
              isolated athlete management software.
