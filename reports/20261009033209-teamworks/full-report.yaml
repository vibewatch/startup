      - number: '8.2'
        title: Financing History, Cap Table Architecture, and Valuation Discipline
        blocks:
          - type: paragraph
            body: >-
              Teamworks transitioned into unicorn status in June 2025 by securing an oversubscribed $235 million Series
              F round led by Dragoneer Investment Group at a pre-money valuation exceeding $1.0 billion, which lifted
              cumulative capital raised above $400 million. Private markets data and secondary intelligence track
              further capital expansion in 2026, including an April 2026 Series G growth investment led by Hg and
              AllianceBernstein valuing the company at $1.51 billion ($2.40 per share), followed by an August 2026
              Series H round at a $1.83 billion post-money mark ($2.57 per share) with cumulative recorded funding
              reaching $619.9 million. While the company's valuation has compounded more than 70-fold from its $20.83
              million Series A in 2016, public secondary liquidity remains tightly restricted and transactional price
              discovery is limited. Forge Global capital structure data records 1.0x non-participating liquidation
              preference structures with 6.0% cumulative dividend terms across late-stage preferred classes, creating
              substantial preference overhang that senior equity holders must clear before junior common equity realizes
              full multiple expansion.
            claimRefs:
              - CV003
              - CV004
              - CV006
              - CV008
              - CV009
              - CV010
              - CV012
          - type: table
            tableRef: TV001
            claimRefs:
              - CV003
              - CV006
              - CV008
              - CV010
              - CV014
      - number: '8.3'
        title: Scenario Analysis, Exit Readiness, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Evaluating Teamworks across base, bull, and bear scenarios demonstrates that current headline valuations
              of $1.5B to $1.8B bake in sustained 25% to 35% software revenue compounding alongside successful
              cross-pillar platform monetization and AI workflow expansion. In the bull case, enterprise consolidation
              of athletic data across professional and Olympic sports justifies public software exit multiples exceeding
              10x to 12x ARR upon an eventual IPO. Under the base case, enterprise churn remains negligible across core
              leagues, but modest average revenue per team (ARPU) caps limit top-line acceleration, supporting private
              market values around $1.5B at 8x to 10x forward ARR. In the bear scenario, lack of disclosures hides high
              customer acquisition costs, plateauing North American collegiate budgets, and integration friction from
              legacy acquisitions, creating down-round or flat-multiple risks. We assign a research-more recommendation
              with medium confidence and a stretched valuation stance, establishing rigorous pre-investment kill
              criteria around independent ARR disclosure, gross margin confirmation above 70%, and verified post-merger
              retention metrics.
            claimRefs:
              - CV006
              - CV008
              - CV010
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV006
              - CV008
              - CV010
              - CV013
              - CV014
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Capital Allocation Stance: Research-More Before Commitment'
            body: >-
              Despite Teamworks' commanding market share across elite collegiate and professional sports leagues,
              growth-stage investors must resist paying top-tier software valuation multiples of $1.5B to $1.8B until
              company management provides verified ARR, revenue retention, and gross margin disclosures.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV008
              - CV010
              - CV014
          - type: callout
            title: Liquidation Preference and Capital Structure Dilution
            body: >-
              Late-stage private funding rounds (Series F through Series H) carry senior 1.0x non-participating
              liquidation preference orders with 6.0% cumulative dividend structures, creating an expanding hurdle that
              common shareholders and early equity holders must clear in downside exit scenarios.
            calloutType: risk
            claimRefs:
              - CV008
              - CV010
              - CV012
