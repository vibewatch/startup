            title: Architectural integration debt from serial M&A threatens platform cohesion
            body: >-
              Rapid expansion through serial acquisitions—including Zelus Analytics, Telemetry Sports, Sportlogiq, PFF
              enterprise, and Atrium Sports ($170M)—imposes heavy technical debt on the core engineering team.
              Integrating heterogeneous codebases, proprietary video codecs, distinct database schemas, and external
              APIs into a cohesive real-time data engine presents persistent risks of data latency, service disruption,
              and heightened maintenance overhead.
            calloutType: risk
