            title: Commercial Friction and Integration Drag in Post-M&A Expansion
            body: >
              The expansion from scheduling into data-heavy scouting and NIL financial operations introduces material
              operational hurdles. Reports of workforce restructuring at acquired units like PFF in March 2026,
              alongside consumer-facing business separations, indicate ongoing integration friction. As Teamworks pushes
              to convert legacy single-product buyers into high-value unified platform agreements, any delays in
              seamless data interoperability risk prolonging sales cycles and dampening expected customer expansion
              velocity.
            calloutType: risk
            claimRefs:
              - CU013
