      - What Would Change The View
    rows:
      - - Market Leadership
        - Near-monopoly penetration across Tier-1 sports leagues (100% NFL, 90% MLB/EPL, 99% NCAA DI)
        - Niche total addressable market (TAM) constrained by finite global professional and elite college teams
        - Evidence of successful commercial expansion into tactical military or youth sports ecosystems
      - - Product Breadth
        - Full operating system stack unifying personnel, performance, coaching, and operations in one app
        - Fragmented codebase and integration complexity arising from serial acquisitions (Smartabase, Zelus, ARMS)
        - Third-party customer case studies demonstrating unified single-pane API adoption without data silos
      - - Capital & Valuation
        - Tier-1 sponsorship from Dragoneer, Hg, and AllianceBernstein validating platform durable growth
        - Recent $1.5B-$1.8B post-money valuation marks bake in aggressive multiples without disclosed ARR
        - Formal disclosure of audited financial statements showing sustainable ARR scale and positive cash flow
      - - Platform Governance
        - Critical system of record for compliance, NCAA rules, and sensitive athlete medical data
        - High legal and regulatory liability regarding athlete data privacy, GDPR, and medical record breaches
        - SOC2 Type II compliance reports and automated institutional control verification records
