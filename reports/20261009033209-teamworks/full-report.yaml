      - number: '5.2'
        title: Product module map and high-performance workflow execution
        blocks:
          - type: paragraph
            body: >-
              The commercial product suite is structured into dedicated operational modules that map directly to
              high-performance sports workflows. The Operations pillar provides central coordination through Hub
              messaging, scheduling, travel logistics, and inventory management. The Performance pillar integrates
              Athlete Management Systems (AMS), strength and conditioning (S&C) tracking, and nutrition programming to
              deliver evidence-based care, coordinated by dedicated Product Success teams across North American
              professional franchises. The Personnel pillar encompasses roster management, digital banking, and
              recruiting compliance, featuring specialized rules engines such as Teamworks Compliance that automate NCAA
              eligibility tracking, CARA log generation, and countable activity reporting. Meanwhile, Teamworks Tactical
              adapts these core communication, readiness tracking, and logistical capabilities for military defense
              teams, supporting nearly 200,000 service members across 30 defense organizations with injury prevention
              and mission readiness workflows.
