      - number: '6.3'
        title: Named Customer Proof and Case Study Evidence
        blocks:
          - type: paragraph
            body: >
              Documented customer implementations demonstrate verified workflow adoption across both collegiate and
              professional environments. In collegiate athletics, institutions such as the University of Wyoming, UNC
              Asheville, and Harvard University have deployed Teamworks Compliance to centralize eligibility tracking
              and rule automation for up to 42 varsity teams and 1,200 student-athletes. Programs including Georgia
              Southern University reported cutting academic administrative workloads in half by adopting Teamworks
              Academics, while Auburn University documented reducing strength and conditioning programming time by 50%
              using Teamworks S&C. In professional soccer, European and Middle Eastern clubs including Al Ain FC have
              deployed the integrated performance suite—incorporating Hub, AMS, S&C, and Nutrition—to support daily
              athletic preparation during championship-winning campaigns. More recently, Brazilian Basketball
              Confederation (CBB) executed a four-year agreement to standardize national team operations, and Teamworks
              announced full Premier League customer penetration following its acquisition of Belgian athlete data firm
              Opteamal.
