      - number: '5.3'
        title: Intelligence layer, data assets, and vertical acquisitions
        blocks:
          - type: paragraph
            body: >-
              Teamworks has systematically assembled an advanced intelligence and analytics layer through targeted
              vertical acquisitions. Following growth investments led by Dragoneer ($235M Series F in June 2025) and Hg
              ($200M total investment in April 2026), the company accelerated the deployment of proprietary sports data
              infrastructure and generative AI models across its portfolio. Strategic acquisitions—including Zelus
              Analytics (data engine and predictive modeling), Telemetry Sports (video-linked coaching workflows),
              Sportlogiq (automated computer vision tracking), Pro Football Focus enterprise assets (football evaluation
              data), and Atrium Sports/Synergy Sports coaching and scouting assets ($170M cash transaction with
              Sportradar in October 2026)—serve as foundational data feeds. By combining computer vision, scouting
              video, competition tracking, and contextual athlete workload metrics, Teamworks aims to provide automated
              scouting reports, game preparation, and player valuation algorithms directly to front offices and coaching
              staffs.
            claimRefs:
              - CE001
              - CE002
              - CE013
              - CE014
              - CE015
              - CE016
      - number: '5.4'
        title: Technical differentiation, integration debt, and security boundaries
        blocks:
          - type: paragraph
            body: >-
              Teamworks differentiates its technology stack through extensive ecosystem lock-in, enjoying multi-year
              adoption across 100% of NFL, NHL, and Premier League clubs, 90% of MLB teams, and 99% of NCAA Division I
              athletic departments. However, this multi-acquisition expansion creates substantial architectural
              complexity. The company must continually harmonize disparate data schemas, legacy database models, and
              authentication layers originating from independent acquired vendors. External public-sector software
              systems sharing the TeamWorks naming convention (such as the State of Georgia state accounting and HCM
              deployment or discontinued SMART Technologies collaboration suites) illustrate distinct enterprise support
              and SLA models, but Teamworks itself maintains private enterprise SLAs without publishing formal external
              uptime metrics, SOC 2 compliance attestations, or public API rate-limit documentation. Mitigating
              technical debt across its acquired data ingestion pipelines represents a critical ongoing engineering
              requirement.
            claimRefs:
              - CE001
              - CE002
              - CE007
