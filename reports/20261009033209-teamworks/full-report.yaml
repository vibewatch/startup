      - number: '7.2'
        title: M&A Integration Friction and Platform Execution Hazards
        blocks:
          - type: paragraph
            body: >-
              Having completed multiple high-profile acquisitions—including the October 2026 acquisition of Atrium
              Sports from Sportradar for $170 million in cash, alongside earlier roll-ups of INFLCR, ARMS Software,
              Smartabase, Zelus Analytics, and Telemetry Sports—Teamworks carries substantial execution and technical
              integration risks. Merging disparate codebases, disparate scouting and video pipelines, and varied
              operational databases into a cohesive sports operating system creates severe data governance, system
              synchronization, and user experience challenges. System disruptions, latent data discrepancies, or delayed
              software synchronization directly jeopardize high-stakes collegiate and professional draft evaluations,
              athlete biometric health records, injury tracking, and tactical game preparation workflows across major
              athletic conferences.
