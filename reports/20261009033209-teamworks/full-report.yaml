      - number: '7.3'
        title: Enterprise Platform Dependencies and Valuation Overhang
        blocks:
          - type: paragraph
            body: >-
              The platform's business model relies on extensive third-party technology providers and media syndication
              licensors, such as IMAGN Content Services, Getty Images, and Epidemic Sound, alongside commercial cloud
              hosting infrastructure and communication networks. Concurrently, Teamworks' Series F financing round
              raised $235 million led by Dragoneer Investment Group at a post-money valuation exceeding $1.0 billion,
              establishing aggressive private growth, platform expansion, and margin expectations. Without public
              disclosure of standalone gross margins, annual recurring revenue run-rate, net revenue retention, or cash
              burn rate, the enterprise remains highly vulnerable to valuation compression, debt or liquidation
              preference overhang, and customer concentration pushback if athletic department budgets contract during
