            tableRef: TO003
            claimRefs:
              - CO003
              - CO004
              - CO008
              - CO010
              - CO014
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO003
              - CO007
              - CO008
              - CO010
              - CO014
      - number: '1.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The Operating System for Sports Strategy
            body: >-
              Teamworks has successfully transitioned from an athletic team communication utility into an enterprise
              aggregator. Through programmatic acquisitions (such as INFLCR, ARMS Software, Smartabase, and Zelus
              Analytics), it has established deep defensive moats across Division I athletics and professional
              franchises, positioning the business as the indispensable backend for modern athletic department
              operations.
            calloutType: insight
            claimRefs:
              - CO001
              - CO004
              - CO007
          - type: callout
            title: Opaque Financial Disclosures and Revenue Realities
            body: >-
              Despite achieving a nominal $1.0B+ valuation during its Series F financing in 2025, Teamworks provides no
              verified GAAP financial statements, leaving annual recurring revenue, net retention rates, software gross
              margins, and operating cash burn entirely shielded from public scrutiny. Third-party estimates varying
              between $81.5M and $107.7M lack audit corroboration.
            calloutType: risk
            claimRefs:
              - CO008
              - CO009
              - CO012
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Scope, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              The market for elite sports operating systems sits at the convergence of athletic administration software,
              athlete management systems (AMS), scouting intelligence, and athlete compensation workflows. Historically,
              sports organizations addressed administrative and athletic workflows through point solutions, legacy
              enterprise resource planning (ERP) packages, horizontal collaboration software such as generic
              spreadsheets and messaging apps, or internally developed databases. Teamworks defines its category as an
              integrated operating system that connects departmental silos—linking athlete scheduling, compliance,
              recruiting, medical records, performance tracking, tactical scouting, and NIL payment distribution into a
              centralized data architecture. The addressable software perimeter includes enterprise operational
              software, proprietary video analytics, and coaching intelligence licensed directly by collegiate athletic
              departments, professional sports franchises, leagues, and Olympic governing bodies. However, this
              definition explicitly excludes downstream consumer fan engagement applications, venue ticketing
              infrastructure, retail sports merchandising, mass-market youth league management tools, and broadcast
              distribution rights, which operate under distinct procurement cycles and commercial dynamics.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Market Sizing Lenses and Constrained Spend Estimates
        blocks:
          - type: paragraph
            body: >-
              Sizing the addressable market for elite sports operating software requires segmenting broad vertical SaaS
              benchmarks into verified organizational spend tiers. While broad commercial sports technology and
              analytics market estimates range up to $10B when conflating broadcast rights, stadium hardware, and
              consumer wearables, the software and data intelligence TAM accessible to team-facing platforms is
              constrained by the finite census of elite institutions. Across North American and international athletic
              ecosystems, the institutional footprint comprises approximately 330 professional team franchises across
              top leagues, roughly 520 collegiate athletic departments in NCAA Division I, and an estimated 65
              international governing bodies and Olympic federations. Serviceable obtainable spend is governed by annual
              contract values (ACV), which scale from $25,000 baseline communication and scheduling subscriptions to
              multi-product enterprise agreements exceeding $250,000 for full-stack deployments incorporating scouting
              data and video analytics. Total obtainable revenue for core operational software remains bounded by the
              physical ceiling of elite sports organizations, compelling platforms to expand wallet share through
              specialized intelligence acquisitions such as Atrium Sports and Pro Football Focus rather than relying
              purely on logo acquisition.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM007
              - CM008
      - number: '2.3'
        title: Buyer Segmentation, Workflow Ownership, and Procurement Pathways
        blocks:
          - type: paragraph
            body: >-
              Procurement dynamics within sports organizations reflect distinct divisional mandates, budget authorities,
              and workflow owners. In collegiate athletic departments, the Athletic Director (AD), Chief Financial
              Officer (CFO), and Senior Associate ADs control institutional enterprise budgets, motivated by
              conference-level compliance mandates, Title IX governance, and student-athlete welfare. In contrast,
              tactical coaching staffs and scouting personnel operate with discrete operational budgets prioritized
              around immediate talent acquisition and competitive game preparation, frequently procuring dedicated
              scouting tools like Synergy Sports and PFF Ultimate independently. In professional sports franchises
              across the NFL, Premier League, NBA, and NHL, General Managers and Sports Science Directors evaluate
              software based on injury mitigation, athlete availability, and tactical performance gains. Enterprise
              platform adoption faces structural headwinds from entrenched departmental workflows, where athletic
              trainers, academic advisors, and position coaches resist administrative centralization if single-sign-on
              systems fail to preserve deep, sport-specific functionality.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: Adoption Tailwinds, Regulatory Catalysts, and Structural Constraints
        blocks:
          - type: paragraph
            body: >-
              Adoption of centralized sports operating platforms is accelerated by regulatory shifts in collegiate
              athletics, particularly the codification of Name, Image, and Likeness (NIL) collectives and institutional
              revenue-sharing frameworks. Managing direct athlete compensation, tax reporting, and compliance requires
              dedicated transaction infrastructure, positioning specialized modules like Teamworks Wallet as essential
              financial utilities. Concurrently, professional sports teams are transitioning toward predictive AI and
              objective talent valuation, increasing demand for unified performance databases. However, severe adoption
              constraints moderate long-term market velocity. Athletic organizations operate under tight fiscal
              parameters outside top-tier football and soccer programs, limiting software discretionary spend.
              Furthermore, aggressive platform roll-ups introduce substantial integration debt, data model mismatches,
              and user interface friction across disparate acquisitions, while specialized video and tracking
              competitors create persistent switching barriers within individual sports.
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Institutional Ceiling Compels M&A-Driven Expansion
            body: >-
              Because elite sports organizations represent a strictly finite population of roughly 2,350 tier-one
              institutions globally, software providers cannot achieve venture-scale revenue growth through new logo
              acquisition alone. Once high penetration is reached—exemplified by Teamworks claiming adoption in 100% of
              NFL, NHL, and Premier League clubs—continued revenue growth necessitates aggressive vertical cross-selling
              and acquiring adjacent data assets like Synergy Sports and PFF.
            calloutType: insight
            claimRefs:
              - CM006
              - CM007
              - CM008
          - type: callout
            title: Integration Debt from Rapid Multi-Asset Roll-Up
            body: >-
              Executing rapid multi-product roll-ups creates acute operational friction. Combining 14 acquisitions
              spanning disparate codebases, database schemas, and user interfaces introduces ongoing integration debt.
              Athletic departments and front offices frequently experience fragmented user experiences, risking customer
              dissatisfaction and churn if core point solutions lose specialized capability post-acquisition.
            calloutType: risk
            claimRefs:
              - CM003
              - CM015
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              Teamworks competes less as a single point product than as a proposed operating layer for elite sports. Its
              official surfaces connect talent acquisition, operations, athlete development, coaching, and compliance,
              while company-issued job material describes either six product categories in an older repost or 24+
              products in an October 2026 role. The relevant buyer choice therefore includes specialist
              athlete-management and performance tools, compliance point solutions, internally assembled workflows,
              generic collaboration products, and informal messaging - not only another suite vendor. The strongest
              distribution signal is company reported: 7,000+ teams on the current homepage and high penetration across
              major leagues in the June 2025 financing release. Those figures show claimed reach, not independently
              audited active customers. Two nominally independent directories are unsuitable for peer ranking: Krowdbase
              maps "Teamworks IRO" to insurance-claims products, while Heynet describes a generic collaboration vendor
              and explicitly labels its suggestions unverified.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP011
              - CP012
              - CP014
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
              - CP016
      - number: '3.2'
        title: Capability and workflow depth
        blocks:
          - type: paragraph
            body: >-
              The clearest product-level differentiation is workflow integration inside a sports-specific data model.
              Teamworks Compliance says it can apply NCAA and institution-specific rules, automate approvals, track
              activities, share recruiting data, and surface tasks in the same mobile app used by athletes and staff.
              Teamworks also claims that its athlete-management product provides centralized records, access controls,
              and audit trails. These are issuer-authored capability statements, not independent tests of implementation
              quality, uptime, security, or user adoption. The 2026 product-marketing role further indicates that the
              company is building differentiated positioning for coaching and player-personnel analytics across
              professional, collegiate, and international markets. The resulting comparison is asymmetric: Teamworks has
              detailed official capability evidence, while the assigned evidence set contains no matched competitor
              documentation. Unknown cells in the matrix are therefore evidence gaps rather than negative ratings.
            claimRefs:
              - CP001
              - CP006
              - CP007
              - CP008
              - CP009
              - CP014
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP006
              - CP007
              - CP008
              - CP009
              - CP013
              - CP014
      - number: '3.3'
        title: Commercial model and distribution power
        blocks:
          - type: paragraph
            body: >-
              Distribution appears to be the most defensible visible advantage. Teamworks reports broad penetration
              across professional leagues, Division I athletic departments, and Olympic federations, and its buyer
              language spans front-office analysts through head coaches. A connected suite can also reduce duplicate
              entry and create a common athlete and organization record, increasing the operational cost of replacing
              multiple integrated modules at once. However, none of the eight reviewed sources discloses list price,
              per-seat or per-team units, contract duration, realized discounting, implementation fees, renewal
              behavior, or module attach rates. Nor do they quantify migration effort, data portability, multi-homing,
              or the economics of channel and technology partners. Consequently, distribution power is supported mainly
              by company-reported footprint, while lock-in and pricing power remain hypotheses for customer-reference
              and contract diligence.
            claimRefs:
              - CP002
              - CP003
              - CP006
              - CP008
              - CP013
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP007
              - CP008
              - CP013
              - CP016
      - number: '3.4'
        title: Durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Teamworks' moat case combines vertical workflow depth, a growing data layer, and broad deployment across
              elite sports. The June 2025 financing announcement directs capital toward AI, data unification, partner
              integrations, and a consolidated mobile app, which could deepen cross-product utility. The same
              architecture creates execution risk: a 24+ product portfolio must present coherent identity, permissions,
              data quality, and user experience across very different buyers. Specialist vendors can attack individual
              budgets on depth, while internal builds and informal tools remain substitutes when procurement or
              migration slows. Teamworks' own discussion of fragmented records and informal messaging highlights the
              status quo's privacy and coordination weaknesses, but it does not establish that all buyers will
              consolidate on Teamworks. With no valid independent benchmark or matched peer set in the reviewed
              evidence, the durable-moat conclusion remains provisional rather than a winner-take-all judgment.
            claimRefs:
              - CP009
              - CP010
              - CP014
              - CP015
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP007
              - CP010
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Search results do not establish a peer set
            body: >-
              Two directory results resolve to the wrong or generic company concept. Neither should be used as an
              independent benchmark for Teamworks' actual sports-technology competitors.
            calloutType: risk
            claimRefs:
              - CP011
              - CP012
          - type: callout
            title: Suite breadth is both moat and integration test
            body: >-
              A connected portfolio can increase workflow utility and distribution leverage, but a 24+ product footprint
              also raises the burden of coherent identity, data, permissions, and user experience.
            calloutType: insight
            claimRefs:
              - CP001
              - CP005
              - CP015
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams, Software Monetization Architecture, and Pricing Mechanics
        blocks:
          - type: paragraph
            body: >-
              Teamworks monetizes its athletic operating system primarily through recurring enterprise
              software-as-a-service (SaaS) subscriptions, multi-year institutional licenses, and modular software
              add-ons across collegiate athletic departments, professional sports franchises, and tactical
              organizations. Rather than operating as an investment vehicle, transactional broker, or consumer
              subscription service, the company's core commercial engine relies on annual recurring software licensing
              tied to departmental tiers, team counts, and functional modules. Across its collegiate footprint,
              Teamworks sells platform subscriptions covering core administrative coordination, compliance monitoring,
              and athlete communication, while cross-selling specialized modules such as performance analytics,
              nutrition tracking, and compliance workflow engines. In collegiate sports, the introduction of athlete
              compensation frameworks has expanded monetization pathways to include athlete management tools, NIL
              compliance tracking, and digital disbursement infrastructure such as Teamworks Wallet, which provides
              centralized payout and tax tracking capabilities for athletic departments. Official list pricing across
              individual modules remains opaque and strictly customized through enterprise procurement proposals, with
              realized contract values determined by institutional division, roster size, and the depth of bundled
              software products.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI016
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI002
              - CI004
              - CI016
      - number: '4.2'
        title: Go-to-Market Motion, Network-Driven Expansion, and Sales Efficiency Proxies
        blocks:
          - type: paragraph
            body: >-
              The commercial expansion of Teamworks is propelled by a network-driven enterprise sales motion where
              institutional adoption within major athletic conferences and professional leagues establishes operational
              standards for peer organizations. Securing landmark adoptions across premier collegiate football programs
              and elite leagues created peer-driven procurement pressure, enabling the company to expand across
              collegiate athletic departments and professional franchises with lower incremental customer acquisition
              costs (CAC) than generic horizontal software vendors. Contract renewals demonstrate high structural
              stickiness because migrating multi-year compliance histories, athlete medical and training records, and
              daily team logistics off the platform imposes severe operational friction on athletic administrators. The
              company augments its organic direct sales force through continuous corporate development, acquiring
              specialized vertical software vendors to immediately absorb established customer bases and eliminate
              competitive sales cycles. However, because detailed customer acquisition costs, net revenue retention
              (NRR), and gross revenue retention figures are not publicly disclosed, sales efficiency must be evaluated
              through proxy indicators such as sustained enterprise account expansion and market share consolidation
              across NCAA Division I institutions and top-tier professional leagues.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI007
      - number: '4.3'
        title: Operating Cost Structure, Hosting Infrastructure, and Delivery Drivers
        blocks:
          - type: paragraph
            body: >-
              Delivering an integrated enterprise sports operating platform requires an operating cost baseline weighted
              heavily toward specialized software engineering, enterprise product support, and cloud computing
              infrastructure. Operating expenses are anchored by a global headcount exceeding 485 to 800 employees
              distributed across corporate offices and engineering hubs in Durham, Denver, Brisbane, and Belfast. Beyond
              core administrative software maintenance, delivery costs encompass secure enterprise hosting, database
              administration, compliance audit readiness, and dedicated customer onboarding teams that configure complex
              league bylaws and athletic department workflows. The company's ongoing platform expansion—integrating
              athlete biometric monitoring, tactical video analytics, and machine learning models—introduces heightened
              infrastructure expenditure for cloud compute and video storage. Furthermore, executing multiple corporate
              acquisitions introduces ongoing integration costs, including redundant enterprise toolchains, software
              refactoring, and data consolidation across disparate codebases, creating structural gross margin headwinds
              until acquired technologies are fully unified.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
          - type: table
            tableRef: TI003
            claimRefs:
              - CI001
              - CI002
              - CI009
              - CI014
              - CI015
      - number: '4.4'
        title: Public Commercial Traction, Private-Metric Information Asymmetries, and Gaps
        blocks:
          - type: paragraph
            body: >-
              Publicly visible commercial traction demonstrates remarkable institutional penetration, spanning over
              6,500 to 7,000 sports teams, more than 520 collegiate athletic departments, and hundreds of professional
              franchises across the NFL, NBA, MLB, NHL, and Premier League. Third-party investor profiles indicate the
              firm exceeded $100 million in annual recurring revenue following growth investments in prior years, yet
              official audited revenue, organic ARR run-rates, and product-level billings remain private and
              undisclosed. In external data aggregators, commercial estimates exhibit extreme dispersion, ranging from
              baseline venture estimates to uncorroborated multi-billion-dollar ranges that conflate total sports
              ecosystem spending with realized software licensing. The absence of verified GAAP revenue disclosures, net
              retention rates, cohort churn rates, and departmental gross margins represents a fundamental information
              barrier for underwriting, leaving external observers reliant on secondary disclosures and top-line
              operational scale milestones.
            claimRefs:
              - CI002
              - CI006
              - CI013
              - CI014
      - number: '4.5'
        title: Capital Adequacy, Financing Dependency, and Acquisition Capitalization
        blocks:
          - type: paragraph
            body: >-
              Teamworks has maintained strong access to institutional growth capital, securing major financing rounds
              from specialized growth equity and private capital firms while preserving founder-led governance. The
              company completed a $235 million Series F financing round led by Dragoneer Investment Group at a valuation
              exceeding $1.0 billion, followed by a significant growth investment from Hg alongside AllianceBernstein
              that cited valuations exceeding $1.5 billion. Lifetime equity capital raised exceeds $400 million,
              providing substantial liquidity reserves to fund organic product initiatives and programmatic M&A. This
              capitalization was put to immediate use in October 2026, when Teamworks agreed to acquire Atrium
              Sports—the coaching and scouting business associated with Synergy Sports—from Sportradar for $170 million
              in cash. While this transaction demonstrates substantial balance-sheet strength, deploying large cash sums
              for corporate buyouts increases overall capital dependency, necessitating sustained cash flow generation
              or future capital market access to replenish liquidity reserves.
            claimRefs:
              - CI001
              - CI010
              - CI015
              - CI016
      - number: '4.6'
        title: Financial Verdict, Revenue Quality Assessment, and Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              From an institutional diligence perspective, Teamworks presents the revenue quality characteristics of a
              dominant vertical SaaS platform with exceptional account retention and peer-enforced switching barriers.
              Its expansion from single-team scheduling into multi-department operations, biometric analytics, and
              player scouting provides meaningful pricing power and cross-sell expansion potential. However, the
              business model exhibits heightened capital intensity driven by aggressive cash acquisitions and platform
              integration requirements. Standalone unit economics remain clouded by the blending of mature, high-margin
              software modules with newly acquired analytics businesses and ongoing engineering outlays. For rigorous
              credit or equity underwriting, primary diligence must focus on resolving private financial
              metrics—specifically verifying audited ARR by product line, contracted revenue backlog, organic vs.
              acquired growth rates, customer retention cohorts, and post-acquisition cash burn following the $170
              million Atrium Sports transaction.
            claimRefs:
              - CI002
              - CI007
              - CI014
              - CI016
      - number: '4.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Network-Enforced Distribution and Monopolistic Moats in Collegiate Athletics
            body: >-
              Teamworks' commercial dominance in collegiate sports is insulated by a powerful peer-enforced network
              effect. Because conference compliance and scheduling require seamless interoperability between competing
              institutions, adoption by dominant athletic programs forces neighboring institutions to standardize on the
              same platform. This dynamic transforms what would otherwise be a discretionary software purchase into a
              non-negotiable athletic department utility.
            calloutType: insight
            claimRefs:
              - CI002
              - CI005
              - CI006
          - type: callout
            title: Capital Outlays and Integration Complexities in Acquisition-Driven Growth
            body: >-
              The definitive agreement to acquire Atrium Sports for $170 million in cash underscores Teamworks'
              aggressive reliance on M&A to secure market leadership in coaching and video intelligence. While absorbing
              established platforms expands wallet share, deploying substantial cash reserves increases financial
              vulnerability, while integrating diverse technical architectures, video processing infrastructure, and
              distinct customer cultures presents material margin and operational execution risks.
            calloutType: risk
            claimRefs:
              - CI010
