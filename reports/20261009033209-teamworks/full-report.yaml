  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The core investment thesis for Teamworks rests on its emergence as the undisputed operating system for
              high-performance athletics, commanding verified market penetration across 100% of NFL franchises, 90% of
              MLB clubs, 90% of Premier League teams, and 99% of NCAA Division I athletic departments. Through
              systematic product development across four operational pillars—personnel, performance, coaching, and
              operations—augmented by strategic acquisitions including INFLCR, ARMS Software, Smartabase, Zelus
              Analytics, and Telemetry Sports, Teamworks has constructed an expansive enterprise software moat with high
              switching costs. Conversely, the anti-thesis centers on extreme operational opacity and capital structure
              risk: neither Teamworks nor its institutional sponsors disclose audited annual recurring revenue (ARR),
              subscription gross margins, net revenue retention (NRR), or organic versus acquisition-driven growth
              rates. Furthermore, rapid multi-product rollups introduce acute software integration overhead,
              cross-department data governance exposure, and potential margin compression in an increasingly complex
              sports technology landscape.
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV007
              - CV011
              - CV014
          - type: table
