  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Framework Vulnerabilities
        blocks:
          - type: paragraph
            body: >-
              Teamworks operates at the nexus of rapidly shifting intercollegiate athletics regulations, name, image,
              and likeness (NIL) compliance oversight, and complex commercial agreements. The company's Influencer
              product (formerly INFLCR) subjects student-athletes and partner institutions to strict compliance
              obligations and third-party media syndication terms, including mandatory individual arbitration clauses,
              broad user-content sublicensing terms, and complete athlete indemnification mandates for amateur
              association violations. Because NCAA bylaws, institutional compliance interpretations, and state NIL
              legislation undergo continuous legal contestation and revision, any administrative mismatch between
              software workflow logic and institutional controls exposes partner athletic departments to major
              eligibility penalties, loss of scholarships, and severe regulatory exposure. Independent market analysis
              underscores that expanding multi-sport platform roll-ups face critical scrutiny over contract terms,
              operational boundaries, and regulatory durability as consolidation accelerates.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
