      - number: '6.4'
        title: Retention Dynamics, Multi-Product Expansion, and Operational Friction
        blocks:
          - type: paragraph
            body: >
              Teamworks relies on a land-and-expand commercial model, attempting to cross-sell additional modules—such
              as Nutrition, General Manager, Wallet, and scouting software—into accounts originally won on basic
              communication or scheduling tools. For example, recent expansions include the Irish Rugby Football Union
              (IRFU) adding Teamworks AMS and Nutrition to existing deployments, and athletic departments like LSU and
              Maryland adopting Teamworks General Manager and Wallet for revenue-sharing operations. Despite these
              expansion proof points, public visibility into core SaaS metrics remains constrained: Teamworks does not
              disclose net revenue retention (NRR), gross revenue retention (GRR), annual churn rates, or average
              contract values across its customer tiers. Customer concentration at the individual team level appears low
              given the thousands of client organizations, but high conference-wide and division-level standardization
              creates structural procurement friction. Furthermore, enterprise sales cycles face headwinds from
              integration fatigue across 14 acquisitions, staff layoffs within acquired assets such as PFF in March
              2026, and aggressive competition from dedicated athlete management rivals including Kitman Labs and
              CoachMePlus.
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU013
              - CU014
              - CU015
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Enterprise Breadth Versus Point-Solution Depth
            body: >
              Teamworks' reported scale of 7,000+ teams highlights immense commercial distribution across elite
              athletics. However, because much of this customer base was assembled through 14 corporate acquisitions,
              maintaining deep user satisfaction across disparate software modules represents an ongoing challenge.
              While administrative tools like Hub and Compliance achieve strong departmental retention, performance
              departments frequently evaluate specialized alternatives like Kitman Labs for sports medicine and AMS,
              creating potential churn vectors if product integration falters.
