      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Unrivaled multi-league market penetration creates defensive data moats
            body: >-
              Teamworks maintains an unmatched enterprise footprint spanning 100% of NFL, NHL, and Premier League clubs,
              90% of MLB teams, and 99% of NCAA Division I athletic departments. This extensive institutional presence
              establishes a formidable distribution advantage, allowing Teamworks to upsell newly acquired modules (such
              as Atrium/Synergy video analytics) into existing operational accounts without incurring greenfield
              customer acquisition friction.
            calloutType: strength
            claimRefs:
              - CE001
              - CE002
