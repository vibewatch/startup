  title: Liquidation Preference and Capital Structure Dilution
  body: Late-stage private funding rounds (Series F through Series H) carry senior 1.0x non-participating liquidation preference
    orders with 6.0% cumulative dividend structures, creating an expanding hurdle that common shareholders and early equity
    holders must clear in downside exit scenarios.
