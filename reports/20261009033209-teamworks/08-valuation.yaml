company:
  name: Teamworks
chapter:
  number: 8
  title: Valuation
  summary: Teamworks achieved a private post-money valuation benchmark of $1.51B to $1.83B in 2026 across Series G and Series
    H financings, following its oversubscribed $235M Series F unicorn milestone in June 2025. However, while enterprise league
    penetration exceeds 80% to 100% across premier sports ecosystems, the complete absence of audited public ARR, gross margin
    structure, and cash burn metrics mandates a research-more recommendation and a stretched valuation stance.
sections:
- id: investment-thesis-and-anti-thesis
  title: Investment Thesis and Anti-Thesis
  body: 'The core investment thesis for Teamworks rests on its emergence as the undisputed operating system for high-performance
    athletics, commanding verified market penetration across 100% of NFL franchises, 90% of MLB clubs, 90% of Premier League
    teams, and 99% of NCAA Division I athletic departments. Through systematic product development across four operational
    pillars—personnel, performance, coaching, and operations—augmented by strategic acquisitions including INFLCR, ARMS Software,
    Smartabase, Zelus Analytics, and Telemetry Sports, Teamworks has constructed an expansive enterprise software moat with
    high switching costs. Conversely, the anti-thesis centers on extreme operational opacity and capital structure risk: neither
    Teamworks nor its institutional sponsors disclose audited annual recurring revenue (ARR), subscription gross margins,
    net revenue retention (NRR), or organic versus acquisition-driven growth rates. Furthermore, rapid multi-product rollups
    introduce acute software integration overhead, cross-department data governance exposure, and potential margin compression
    in an increasingly complex sports technology landscape.'
  claimRefs:
  - CV001
  - CV002
  - CV005
  - CV007
  - CV011
  - CV014
  tableRefs:
  - TV002
  figureRefs:
  - FV001
- id: financing-history-and-valuation-discipline
  title: Financing History, Cap Table Architecture, and Valuation Discipline
  body: Teamworks transitioned into unicorn status in June 2025 by securing an oversubscribed $235 million Series F round
    led by Dragoneer Investment Group at a pre-money valuation exceeding $1.0 billion, which lifted cumulative capital raised
    above $400 million. Private markets data and secondary intelligence track further capital expansion in 2026, including
    an April 2026 Series G growth investment led by Hg and AllianceBernstein valuing the company at $1.51 billion ($2.40 per
    share), followed by an August 2026 Series H round at a $1.83 billion post-money mark ($2.57 per share) with cumulative
    recorded funding reaching $619.9 million. While the company's valuation has compounded more than 70-fold from its $20.83
    million Series A in 2016, public secondary liquidity remains tightly restricted and transactional price discovery is limited.
    Forge Global capital structure data records 1.0x non-participating liquidation preference structures with 6.0% cumulative
    dividend terms across late-stage preferred classes, creating substantial preference overhang that senior equity holders
    must clear before junior common equity realizes full multiple expansion.
  claimRefs:
  - CV003
  - CV004
  - CV006
  - CV008
  - CV009
  - CV010
  - CV012
  tableRefs:
  - TV001
- id: scenario-modeling-and-recommendation
  title: Scenario Analysis, Exit Readiness, and Diligence Asks
  body: Evaluating Teamworks across base, bull, and bear scenarios demonstrates that current headline valuations of $1.5B
    to $1.8B bake in sustained 25% to 35% software revenue compounding alongside successful cross-pillar platform monetization
    and AI workflow expansion. In the bull case, enterprise consolidation of athletic data across professional and Olympic
    sports justifies public software exit multiples exceeding 10x to 12x ARR upon an eventual IPO. Under the base case, enterprise
    churn remains negligible across core leagues, but modest average revenue per team (ARPU) caps limit top-line acceleration,
    supporting private market values around $1.5B at 8x to 10x forward ARR. In the bear scenario, lack of disclosures hides
    high customer acquisition costs, plateauing North American collegiate budgets, and integration friction from legacy acquisitions,
    creating down-round or flat-multiple risks. We assign a research-more recommendation with medium confidence and a stretched
    valuation stance, establishing rigorous pre-investment kill criteria around independent ARR disclosure, gross margin confirmation
    above 70%, and verified post-merger retention metrics.
  claimRefs:
  - CV006
  - CV008
  - CV010
  - CV013
  - CV014
  - CV015
  - CV016
  tableRefs:
  - TV003
tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Supporting Evidence
  - Decision Implication
  rows:
  - - Recommendation
    - research-more
    - Dominant market position across 6,500+ teams paired with total lack of audited ARR and margin data
    - Withhold growth-equity capital allocation until proprietary financial ledger and cohort retention are reviewed
  - - Confidence
    - medium
    - Verified institutional investor syndicate (Dragoneer, Hg, AllianceBernstein) but third-party data opacity
    - Discount unverified platform claims; cross-check customer billing directly via customer references
  - - Risk Rating
    - high
    - Multi-acquisition technical debt, preference stack overhang, and data compliance liabilities
    - Require downside liquidation preference modeling and tech stack integration security audits
  - - Valuation Stance
    - stretched
    - Steep escalation from $536M in 2023 to $1.83B in 2026 without disclosed underlying ARR run rate
    - Seek structural anti-dilution protections and avoid paying peak secondary price per share
  notes: Assessment synthesized from verified institutional round history, official customer coverage benchmarks, and private
    market secondary indicators.
  claimRefs:
  - CV003
  - CV006
  - CV008
  - CV010
  - CV014
- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Pillar
  - Investment Thesis Argument
  - Anti-Thesis Counter-Argument
  - What Would Change The View
  rows:
  - - Market Leadership
    - Near-monopoly penetration across Tier-1 sports leagues (100% NFL, 90% MLB/EPL, 99% NCAA DI)
    - Niche total addressable market (TAM) constrained by finite global professional and elite college teams
    - Evidence of successful commercial expansion into tactical military or youth sports ecosystems
  - - Product Breadth
    - Full operating system stack unifying personnel, performance, coaching, and operations in one app
    - Fragmented codebase and integration complexity arising from serial acquisitions (Smartabase, Zelus, ARMS)
    - Third-party customer case studies demonstrating unified single-pane API adoption without data silos
  - - Capital & Valuation
    - Tier-1 sponsorship from Dragoneer, Hg, and AllianceBernstein validating platform durable growth
    - Recent $1.5B-$1.8B post-money valuation marks bake in aggressive multiples without disclosed ARR
    - Formal disclosure of audited financial statements showing sustainable ARR scale and positive cash flow
  - - Platform Governance
    - Critical system of record for compliance, NCAA rules, and sensitive athlete medical data
    - High legal and regulatory liability regarding athlete data privacy, GDPR, and medical record breaches
    - SOC2 Type II compliance reports and automated institutional control verification records
  notes: Analysis contrasts verified platform adoption scale against private enterprise SaaS constraints and integration headwinds.
  claimRefs:
  - CV001
  - CV002
  - CV005
  - CV007
  - CV011
  - CV014
- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Key Operating Assumptions
  - Valuation & Return Logic
  - Key Risks & Downside Triggers
  - Probability Signal
  rows:
  - - Bull Case
    - Platform ARR surpasses $150M+; ARPU expands via AI add-on modules and tactical military deployments
    - Target valuation of $2.5B-$3.0B at 12x-15x ARR via successful public IPO or mega-sponsor buyout
    - Platform churn increases if elite athletic departments resist multi-product bundling price increases
    - 25%
  - - Base Case
    - Core athletic retention remains >95%; ARR scales moderately to $100M-$120M; EBITDA margins approach breakeven
    - Target valuation of $1.5B-$1.8B at 10x-12x ARR; holding current private round levels
    - Stagnant organic growth masked by capital-intensive acquisitions; valuation multiples compress
    - 50%
  - - Bear Case
    - Organic growth slows below 10%; college athletic budget cuts squeeze SaaS spend; M&A integration stalls
    - Valuation correction to $750M-$900M (30%-50% drawdown) clearing preferred liquidation hurdles
    - Major medical/NIL compliance data breach or student-athlete privacy lawsuit creates reputational crisis
    - 25%
  notes: Forward scenarios model implied multiples and structural outcomes based on prevailing growth-stage software benchmarks.
