callouts:
- calloutType: strength
  title: Unrivaled multi-league market penetration creates defensive data moats
  body: Teamworks maintains an unmatched enterprise footprint spanning 100% of NFL, NHL, and Premier League clubs, 90% of MLB teams, and 99% of NCAA Division I athletic departments. This extensive institutional presence establishes a formidable distribution advantage, allowing Teamworks to upsell newly acquired modules (such as Atrium/Synergy video analytics) into existing operational accounts without incurring greenfield customer acquisition friction.
  claimRefs:
  - CE001
  - CE002
  - CE014
- calloutType: risk
  title: Architectural integration debt from serial M&A threatens platform cohesion
  body: Rapid expansion through serial acquisitions—including Zelus Analytics, Telemetry Sports, Sportlogiq, PFF enterprise, and Atrium Sports ($170M)—imposes heavy technical debt on the core engineering team. Integrating heterogeneous codebases, proprietary video codecs, distinct database schemas, and external APIs into a cohesive real-time data engine presents persistent risks of data latency, service disruption, and heightened maintenance overhead.
  claimRefs:
  - CE001
  - CE003
  - CE004
  - CE013
  - CE014
