companyProfile:
  summary: >-
    Teamworks is a Durham-based vertical software company that has grown from an athletic scheduling and communications
    tool into a broad operating system for elite sports. Its platform spans operations, compliance, athlete management,
    performance, coaching, and intelligence workflows for collegiate departments, professional franchises, Olympic
    organizations, and adjacent tactical customers. The company remains privately held and growth-stage, with strong
    distribution but limited public disclosure around financial quality.
