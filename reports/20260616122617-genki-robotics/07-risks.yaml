  - id: geopolitical-supply-chain-risk
    title: Geopolitical and Supply-Chain Risk
    body: >-
      Genki's Tokyo location is an advantage for recruiting from Japan's robotics ecosystem, but it does
      not insulate the company from the geopolitics of components, compute platforms, and channel control.
      China currently leads early humanoid volume shipment and benefits from an EV-derived hardware stack
      that accelerates iteration on sensors, batteries, and actuators; if Genki sources any meaningful
      share of that stack indirectly, rising U.S.-Japan security alignment can constrain procurement options.
      The Pentagon's June 2026 1260H designation of Unitree adds another signal that robotics hardware
      supply chains are being viewed through a national-security lens rather than only a cost lens. Meanwhile,
      platform vendors and commercial ecosystems are consolidating around specific partners: Qualcomm
      is aligning with Neura, SoftBank is building an OpenAI-linked Japan stack, and Toyota is increasing
      venture deployment around AI and industrial automation. A stealth company with undisclosed OEM,
      chip, and distributor relationships risks getting squeezed simultaneously on supply access, ecosystem
      visibility, and future customer introductions.
    claimRefs:
