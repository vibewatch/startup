callouts:
  - calloutType: risk
    title: Founder history can re-price the company faster than product progress can offset it
    body: >-
      Rubin's Google misconduct reporting and the Essential shutdown are already part of the permanent
      public record, and TechCrunch's archive makes that history immediately discoverable by LPs, procurement
      teams, and journalists. If new allegations, court activity, or negative governance facts surface
      while Genki remains mostly silent, financing and customer diligence could tighten before the company
      has enough operating proof to defend valuation.
    claimRefs:
      - CR001
      - CR006
      - CR052
  - calloutType: risk
    title: The empty website is not cosmetic; it is evidence of missing diligence surface area
    body: >-
      A blank redirect page and minimal LinkedIn presence mean investors cannot test basic questions about
      product scope, hiring, compliance, or partners against company-authored materials. In a safety-sensitive
      robotics category, that disclosure void should be interpreted as a substantive risk, not just a
      branding choice.
    claimRefs:
      - CR011
      - CR012
      - CR046
  - calloutType: recommendation
    title: Require a safety and certification plan before underwriting any public-safety thesis
    body: >-
      Brooks' fall-energy critique, the industry-wide delay in broad humanoid adoption, and Figure's decision
      to build a dedicated safety center all indicate that safety work must precede procurement. Genki
      should not be evaluated as a generic AI company; diligence must obtain verification, validation,
      and certification artifacts specific to physical deployment in shared public spaces.
    claimRefs:
      - CR015
      - CR018
      - CR045
  - calloutType: insight
    title: Japan tailwinds exist, but the ecosystem may still route value to better-connected incumbents
    body: >-
      Japan's demographic pressure and METI priorities create real demand-side support for robotics, yet
      SoftBank, Toyota, and compute suppliers are simultaneously building their own preferred ecosystems.
      Genki therefore faces a paradox: the market it wants is becoming more important, but also more intermediated
      by larger platforms and capital pools.
    claimRefs:
      - CR021
      - CR047
      - CR048
      - CR049
