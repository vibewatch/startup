chapter:
  number: 7
  title: Risks
  summary: >-
    Genki Robotics' risk profile is dominated by founder-linked governance overhang, a near-total disclosure
    vacuum, and the technical/safety immaturity of humanoid robots for mission-critical public-safety
    use cases. Public evidence shows Andy Rubin carries a durable adverse-news history from Google and
    Essential, while Genki itself has disclosed no functional website, product, certification path, customer,
    or governance mitigation despite already reaching a $1 billion valuation. Japan's demographic and
    policy tailwinds are real, but they do not remove the longer procurement cycle, safety-standard burden,
    geopolitical component exposure, or capital-intensity that can derail a stealth-stage humanoid company
    before commercial proof exists.
sections:
  - id: founder-reputational-risk
    title: Founder Reputational and Governance Overhang
    body: >-
      Andy Rubin's personal history is the single most legible non-technical risk attached to Genki Robotics
      because it is already well documented, easy for counterparties to rediscover, and not diluted by
      other named executives or a visible board. TechCrunch's legal and news coverage records the misconduct
      allegations, the $90 million Google exit package, the 2018 employee walkout, the 2019 shareholder
      suit, and newly unsealed court allegations that kept Rubin in a recurring adverse-news cycle for
      years. Essential Products then provided a second cautionary data point: Rubin could attract capital
      and talent, yet still deliver weak sell-through, cancelled products, and a shutdown. Because Genki
      has not published governance commitments, independent director appointments, or a board charter,
      investors cannot yet point to any structural mitigation that separates this venture from Rubin's
      prior pattern. The result is a reputational discount that can impair fundraising, hiring, procurement
      diligence, and public-sector trust before Genki has demonstrated product value.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR005
      - CR006
      - CR007
      - CR008
      - CR010
      - CR041
