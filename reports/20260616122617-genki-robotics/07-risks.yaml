  - id: execution-stealth-disclosure-risk
    title: Stealth Execution and Disclosure Risk
    body: >-
      Genki's complete stealth posture converts ordinary startup uncertainty into a first-order diligence
      risk because almost every operational question remains unanswered at exactly the stage when the
      company is already priced like a unicorn. As of June 2026, the official domain resolves to an empty
      redirect page, the public website is effectively absent, LinkedIn shows only a handful of visible
      employees, and no customer, prototype, safety architecture, or management disclosure has been released.
      That means outside investors cannot distinguish whether stealth is strategic discipline or evidence
      that technical and organizational progress remains too thin for public scrutiny. The pattern also
      resembles the "invisible progress" problem that hurt Essential, where capital was available long
      before commercial validation was achieved. Without named technical leaders, manufacturing partners,
      or a roadmap for first public demonstration, each month of silence compounds counterparty skepticism
      and raises the probability that adverse media interpretation will set the narrative before the company
      does.
    claimRefs:
      - CR009
      - CR011
      - CR012
      - CR013
      - CR031
      - CR046
      - CR050
    tableRefs:
      - TR002
    figureRefs: []
  - id: technical-safety-risk
    title: Technical Feasibility and Safety Risk
    body: >-
      Genki is targeting "mission critical applications" in public safety, which is among the least forgiving
      deployment categories for a still-unproven humanoid platform. Independent criticism from Rodney
      Brooks and other robotics observers highlights the gap between investor enthusiasm and actual readiness:
      dexterity remains unsolved, full-sized bipedal robots carry disproportionate fall risk, and many
      commercial environments still cannot tolerate unsafe or unreliable behavior. Comparable industry
      evidence reinforces the point. Trade-show floors have displayed non-working prototypes, Agility
      had to refocus commercialization with layoffs, Figure invested in a dedicated safety center, and
      Tesla's own scale-up has missed ambitious unit targets. None of these examples prove that Genki
      will fail, but they show that even the best-capitalized peers are still resolving fundamental issues
      around stability, sensing, verification, and deployment economics. Because Genki has disclosed no
      safety testing, certification path, or third-party validation framework, residual product-liability
      exposure remains extremely high.
    claimRefs:
      - CR014
      - CR015
      - CR016
      - CR017
      - CR018
      - CR019
      - CR043
      - CR045
    tableRefs: []
    figureRefs: []
  - id: regulatory-procurement-risk
    title: Regulatory, Legal, and Procurement Risk
    body: >-
      A humanoid startup that wants to sell into Japanese public-safety workflows inherits both a legal/governance
      diligence burden and a long public-procurement timeline. On the governance side, Rubin's unresolved
      litigation status and the absence of any disclosed Genki-specific compliance program leave a live
      diligence gap around reputational screening. On the operating side, Japan's policy environment is
      directionally supportive but not frictionless: METI and the Cabinet Office have elevated robotics
      and Society 5.0 priorities, while safety standards for service robots in shared spaces are still
      evolving and mission-critical humanoid liability standards remain unsettled. That means Genki cannot
      shortcut certification, agency engagement, or pilot evidence just because demographic demand is
      real. Public-sector and infrastructure buyers will likely require multi-agency approvals, demonstrations,
      and risk-allocation documentation before purchase orders emerge. The risk is not that Japan lacks
      interest in robots; it is that Genki may need years of regulatory and procurement work before its
      intended market becomes bankable revenue.
    claimRefs:
      - CR020
      - CR021
      - CR022
      - CR023
      - CR034
      - CR036
      - CR049
      - CR051
    tableRefs:
      - TR001
    figureRefs:
      - FR001
  - id: capital-financial-competitive-risk
    title: Capital, Financial, and Competitive Risk
    body: >-
      Genki already carries the burden of a $1 billion entry valuation without any disclosed product,
      customer, or revenue base, which sharply narrows the margin for error on future fundraising. Humanoid
      peers demonstrate how expensive the next steps can be: Figure required multi-billion-dollar financing
      and still faces commercialization scrutiny, Agility had to tighten operations despite being a category
      leader, and Tesla continues to miss self-imposed scale targets. At the same time, Goldman Sachs'
      $38 billion 2035 humanoid market forecast describes a large future prize but depends on breakthroughs
      in cost, dexterity, and battery performance that the industry has not yet shown. If Genki's true
      burn resembles a typical 30-60 person deep-tech hardware team, then a modestly sized Series A could
      leave less than two years of runway before a high-stakes Series B. That financing event will occur
      in a market where benchmark valuations are speculative and where investors will increasingly demand
      prototypes, pilots, or credible procurement momentum rather than founder mystique alone.
    claimRefs:
      - CR024
      - CR026
      - CR027
      - CR028
      - CR029
