chapter:
  number: 3
  title: Competitors
  summary: >-
    Genki Robotics enters a competitive landscape dominated by well-funded US and Chinese humanoid startups, established
    robotics incumbents, and specialized infrastructure-inspection companies — none of whom yet occupies its precise
    niche of Japan-anchored, public-safety-focused humanoid robotics. Boston Dynamics Spot is the most directly
    deployed substitute in CBRNE, EOD, and nuclear-decommissioning workflows; Figure AI ($39 billion valuation,
    ~$2 billion raised) and Agility Robotics (Toyota, GXO commercial contracts) are scaling humanoid platforms;
    and Unitree undercuts all Western peers on price with approximately 4,200 units shipped in 2025 at ~$16,000
    per G1. Genki's stealth-mode status makes its differentiation unverifiable, and its primary structural risk is
    that Boston Dynamics and Gecko Robotics are already entrenched in the inspection and safety verticals Genki
    targets — incumbency advantages that Genki's Tokyo anchoring and mission-specific focus do not yet offset at
    the product-proof level.

sections:
  - id: direct-humanoid-competitors
    title: Direct Humanoid Competitors
    body: >-
      Five companies represent the most direct competitive threat to Genki Robotics: Boston Dynamics, Figure AI,
      Agility Robotics, Unitree, and Sanctuary AI. Each has demonstrated humanoid or advanced-mobility hardware,
      meaningful funding, and a commercialization strategy — though none yet targets Japan public-safety procurement
      as its primary market.


      Boston Dynamics operates the robotics industry's longest-established commercial track record and the greatest
      IP depth. Its electric Atlas humanoid is marketed as the world's first enterprise-grade industrial humanoid,
      targeting material-handling workflows in manufacturing via an enterprise integration layer called Orbit that
      connects to MES and WMS systems. A January 2026 partnership with Google DeepMind, announced at CES, aims to
      build next-generation AI foundation models for Atlas. CEO Robert Playter stepped down in February 2026 after
      thirty years; CFO Amanda McMaster is serving as interim chief executive while a search proceeds. Critically
      for Genki, Atlas targets factory material handling, not public safety — it is Boston Dynamics' quadruped Spot
      that already holds commercial deployments in CBRNE, EOD, and nuclear decommissioning, the exact segment Genki
      targets. Spot therefore gives Boston Dynamics a pre-existing incumbent presence in Genki's primary vertical
      through a proven non-humanoid platform. Boston Dynamics has disclosed plans for a factory capable of producing
      30,000 Atlas units per year, indicating long-term manufacturing scale ambitions that would dwarf Genki.


      Figure AI, headquartered in San Jose, California, raised a Series C exceeding $1 billion at a $39 billion
      post-money valuation in September 2025, bringing lifetime funding to approximately $2 billion since its 2022
      founding. Investors included Nvidia, Brookfield Asset Management, Qualcomm Ventures, and Salesforce. Figure's
      flagship product, Figure 03, targets home environments using Helix, an in-house Vision-Language-Action (VLA)
      model developed after the company exited its OpenAI collaboration in February 2025. Helix enables robots to
      handle thousands of household objects in response to natural-language commands, and Figure is scaling
      manufacturing at its BotQ facility. The company shipped approximately 150 units in 2025 per Omdia data. Figure
      does not target public-safety applications, making it a segment-adjacent threat rather than a direct one, but
      its capital depth gives it the option to redirect resources quickly. An adverse signal: CEO Brett Adcock skipped
      a live demo at the June 2025 Bloomberg Tech conference and declined specifics about the BMW pilot, raising
      early execution questions.


      Agility Robotics' Digit is the most commercially proven humanoid platform in the field as of mid-2026. The
      Oregon State University spinout secured a multi-year RaaS (robots-as-a-service) agreement with logistics giant
      GXO at a Georgia Spanx facility in June 2024, and after a one-year pilot contracted seven Digit units to
      Toyota Motor Manufacturing Canada for RAV4 production in February 2026. Commercial agreements with Mercado
      Libre and NVIDIA expand its partner roster. Digit is purpose-built for logistics handoffs — moving totes
      between automated conveyors — not for outdoor or public-safety environments. Agility laid off a small number
      of staff in April 2024 while refocusing on commercialization, but its CPO reported more orders than the company
      could fulfill by mid-2024.


      Unitree Robotics, a Chinese manufacturer, shipped approximately 4,200 humanoid units in 2025, the second
      highest globally according to Omdia data compiled by Forbes. The Unitree G1 lists at approximately $16,000 per
      unit and the H1 at approximately $90,000, making Unitree by far the most price-competitive in the global
      humanoid market. China's hardware supply chain — built through the EV sector — allows faster iteration and
      lower unit costs than any Western or Japanese competitor. A material risk for Unitree's commercial expansion
      into allied markets: the Pentagon added Unitree to its 1260H list of entities supporting China's military in
      June 2026, complicating US and potentially allied-country procurement. Japan's defense and public-safety
      agencies face analogous institutional barriers, which could inadvertently protect Genki's local positioning.


      Sanctuary AI, a Canadian company, is developing its Phoenix humanoid through seven generations. The latest
      iteration features proprietary hydraulic dexterous hands for industrial manipulation and rapid task learning via
      sim-to-real transfer. A May 2024 partnership with Microsoft focuses on general-purpose AGI robotics research.
      As of June 2026, Sanctuary also partnered with Zeon Corporation to develop rugged elastomeric components for
      its robotic hands. Sanctuary did not ship confirmed commercial units through 2025; its trajectory remains
      research and materials-science focused. Its partnership with Microsoft creates a credible long-horizon threat
      but not a near-term market displacement risk.
