companyProfile:
  summary: Genki Robotics is a Tokyo-based humanoid robotics startup founded in 2025 and co-founded by Andy Rubin. The company is operating in stealth mode, publicly describing its mission as building humanoid robots for mission-critical applications, specifically public safety and urban maintenance. Public evidence indicates a small but active operating footprint in Minato-ku, Tokyo and a $1 billion Series A valuation in April 2026, but product specifications, customer deployments, round size, and investor identities remain undisclosed.
  founders:
    - name: Andy Rubin
      role: Co-founder
      background: Co-created Android, led Google's 2013 robotics acquisition push including Schaft, later co-founded Playground Global, and previously led Essential Products.
      claimRefs: [CO003, CO018, CO021, CO025]
  foundingLocation: Tokyo, Japan
  headquarters: Minato-ku, Tokyo, Japan
  productSummary: Humanoid robots for mission-critical applications, with stated focus areas in public safety and urban maintenance rather than generic warehouse or consumer use.
  customerFocus: Public safety agencies, municipal infrastructure operators, transport and airport operators, and other labor-constrained mission-critical environments in Japan.
  businessModel: Likely hardware sales plus deployment, integration, and/or robot-as-a-service contracts for government and infrastructure operators, but exact monetization is undisclosed.
  stage: Series A
  fundingStatus: Reported April 2026 Series A at a $1 billion post-money valuation; round size, lead investor, co-investors, and preference stack are not publicly disclosed.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO003, CO005, CO007, CO014, CO015, CV001]
summary:
