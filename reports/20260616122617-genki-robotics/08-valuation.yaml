  - id: evidence-gaps-diligence
    title: "Evidence Gaps, Adverse Signals, and Final Diligence Asks"
    body: >-
      The evidence gaps for Genki Robotics are unusually broad even by stealth-
      company standards. No financial data — revenue, gross margin, BOM cost, burn
      rate, cap table, or round size — is publicly available. No prototype video,
      technical demonstration, or hardware specification has been published. No
      investor identity has been disclosed, making it impossible to assess whether
      the lead investor has robotics-sector depth, governance rights, or alignment
      with Genki's public-safety mission. The PitchBook profile confirms the
      company exists but places all financial detail behind a paywall.


      In this context, the $1B valuation must be treated as a ceiling for diligence
      purposes rather than a confirmed fair value. Any new investor entering at or
      near $1B is implicitly accepting: (a) full technical execution risk — no
      prototype means the hardware may not be viable; (b) full commercial risk —
      no customer means no validation of Japan-market willingness to pay; (c) full
      governance risk — no leadership disclosure means no assessment of team
      depth, board composition, or fiduciary alignment; and (d) full liquidity risk —
      no preference overhang data means the effective cost of capital above headline
      valuation is unknown.


      The final diligence ask table TV006 specifies six concrete evidence items that
      must be resolved before a responsible investment judgment can be made. Among
      these, the prototype demonstration and cap table disclosure are blocking:
      without them, no financial model can be built. The China competitive threat,
      illustrated by 87% Chinese market share in 2025 humanoid shipments and the
      Pentagon's June 2026 listing of Unitree, creates an additional urgency for
      Genki to establish technology differentiation before Chinese cost-learning
      curves further erode the addressable price premium in Japan. Investors who
      wait for this evidence will likely pay a higher price, but will do so with
      significantly reduced information risk.
