callouts:
  - calloutType: recommendation
    title: "Do Not Invest at $1B: TRACK Until Prototype and Customer LOI Are Available"
    body: >-
      The $1B Series A post-money is an expensive entry price for a fully stealth
      pre-revenue humanoid startup with no disclosed prototype, no customers, and no
      financial data. The investment thesis rests entirely on Andy Rubin's pedigree
      and Japan labor-shortage demand — neither of which validates product viability.
      The recommendation is TRACK with a clear thesis-break condition: if a working
      hardware prototype (even under NDA) and at least one signed Japan customer LOI
      are produced within 18 months, the call shifts to BUY at a fair-entry price
      negotiated on the basis of that evidence. Investors who wait will pay more, but
      with materially reduced technical and commercial risk.
    claimRefs:
      - CV001
      - CV003
      - CV012
      - CV042
  - calloutType: risk
    title: "Rodney Brooks Dexterity Critique Is a Sector-Wide Investment Thesis Risk"
    body: >-
      Rodney Brooks — co-founder of iRobot, former MIT professor, and one of the
      most credible voices in robotics — argues that current humanoid robot dexterity
      training approaches are fundamentally flawed, describing them as pure fantasy
      thinking. He predicts successful robots in 15 years will not look like humans
      and will rely on wheels rather than bipedal locomotion. TechCrunch covered
      this as evidence of a bubble in humanoid robotics investment. While the bull
      case for Genki does not require solving dexterity immediately, investors should
      stress-test their humanoid thesis against Brooks' critique and factor it into
      a timeline sensitivity on when Japan enterprise customers will actually deploy
      and pay for humanoid robots.
    claimRefs:
      - CV029
      - CV030
      - CV031
  - calloutType: insight
    title: "Japan's Labor Crisis Is a Structural Tailwind but Not a Genki-Specific Validator"
    body: >-
      Japan's demographic collapse — the 14th consecutive year of population decline
      in 2024, a projected 31% decline in the working-age population by 2060, and
      METI's ambition to capture 30% of global physical AI by 2040 — creates one of
      the most structurally compelling national demand profiles for humanoid robotics
      globally. Japan Airlines' Haneda humanoid trial (May 2026), the government's
      AI Robotics Strategy planned for FY2026, and the Barclays research note
      identifying Japan as a primary adoption geography all support this. However,
      none of these signals are specific to Genki Robotics. The Japan demand thesis
      validates the sector, not the company. Any investor using Japan labor-shortage
      data as a reason to invest in Genki at $1B must also show why Genki — rather
      than Figure AI deploying in Japan, or Unitree via JAL — will capture that demand.
    claimRefs:
      - CV024
      - CV025
      - CV026
      - CV038
      - CV039
