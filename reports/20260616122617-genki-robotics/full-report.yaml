  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: 'Customer Archetypes: Who Buys, Uses, and Pays'
        blocks:
          - type: paragraph
            body: >-
              Genki Robotics' stated mission — deploying humanoid robots for mission-critical, public-safety, and
              urban-maintenance applications in Japan — maps onto six identifiable buyer archetypes, each with distinct
              procurement logic, budget authority, and readiness posture. National and prefectural government agencies
              responsible for disaster response, urban rescue, and hazardous-materials response constitute the archetype
              with the highest alignment to "public safety": their procurement would flow through Ministry of Land,
              Infrastructure, Transport and Tourism and disaster management bureaus, with co-funding available from NEDO
              and METI. The Japanese government's own Society 5.0 policy framework, adopted in 2021, explicitly calls
              for robots to sustain essential services as the working-age population shrinks — providing policy cover
              for humanoid procurement in government channels. METI's RING Project, established June 2025, further
              creates formal networking infrastructure between robotics companies and regional governments facing labor
              shortages, constituting a procurement-enablement channel.

              Aviation and transit operators are the most demonstrated near-term analog: Japan Airlines launched a
              2-year humanoid trial at Haneda Airport in May 2026 for baggage loading and cabin cleaning, driven by
              chronic labor shortages in aviation. Genki is not a participant in this trial — the trial uses GMO AI
              partnering with Unitree hardware — but the segment validates buyer urgency. Japan's construction sector
              presents a similarly urgent archetype: the introduction of stricter overtime rules in April 2024 has
              intensified labor shortages in construction and infrastructure, and both government and private
              contractors are actively seeking automation for hazardous inspection and maintenance tasks. Utilities and
              energy operators face a related need for remote inspection in nuclear and chemical environments — a
              segment already addressed by Boston Dynamics Spot globally. Healthcare and long-term care, which METI
              designated as a priority field for robot deployment in June 2024, and urban services operators sourcing
              through METI's RING Project round out the archetype set. In every segment, the buyer is an institutional
              organization with formal procurement procedures, the user is a field worker or care professional, and the
              payer is either a corporate capital budget, public grants, or a RaaS subscription contract. Genki has no
              confirmed engagement with any of these archetype segments.
