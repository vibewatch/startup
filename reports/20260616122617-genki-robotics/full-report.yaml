      - number: '7.4'
        title: Regulatory, Legal, and Procurement Risk
        blocks:
          - type: paragraph
            body: >-
              A humanoid startup that wants to sell into Japanese public-safety workflows inherits both a
              legal/governance diligence burden and a long public-procurement timeline. On the governance side, Rubin's
              unresolved litigation status and the absence of any disclosed Genki-specific compliance program leave a
              live diligence gap around reputational screening. On the operating side, Japan's policy environment is
              directionally supportive but not frictionless: METI and the Cabinet Office have elevated robotics and
              Society 5.0 priorities, while safety standards for service robots in shared spaces are still evolving and
              mission-critical humanoid liability standards remain unsettled. That means Genki cannot shortcut
              certification, agency engagement, or pilot evidence just because demographic demand is real. Public-sector
              and infrastructure buyers will likely require multi-agency approvals, demonstrations, and risk-allocation
              documentation before purchase orders emerge. The risk is not that Japan lacks interest in robots; it is
              that Genki may need years of regulatory and procurement work before its intended market becomes bankable
              revenue.
