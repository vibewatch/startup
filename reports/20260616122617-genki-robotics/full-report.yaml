      - number: '8.3'
        title: Bull/Base/Bear Scenarios, Adverse Evidence, and Investment Recommendation
        blocks:
          - type: paragraph
            body: >-
              The bull case for Genki rests on three compounding tailwinds: Japan's labor-shortage urgency, government
              policy support (METI AI Robotics Strategy FY2026, Moonshot R&D Program humanoid prototype by 2030), and
              sector exit optionality from strategic acquirers. Meta acquired Assured Robot Intelligence in May 2026 for
              undisclosed sum; Qualcomm partnered with Neura Robotics on chip-level integration in March 2026. An
              investor who entered at $1B and Genki subsequently demonstrated a working prototype, secured a Japanese
              government or aviation pilot, and raised a Series B at $3–5B would earn a 3–5x return from the $1B entry —
              comparable to a successful Agility-track outcome. Goldman Sachs revised its humanoid TAM to $38B by 2035
              (a 4x upward revision), supporting the long-duration value creation story. This is, however, a
              probability-weighted outcome of less than 15% given the current evidence base.


              The base case is prolonged stealth. Genki may remain in prototype development through late 2026 or 2027,
              eventually surfacing a technical demo and raising a Series B at a modest step-up from $1B — perhaps
              $1.5–2.5B. In this scenario, the entry investor at $1B would earn a 1.5–2.5x return, with meaningful
              execution risk along the way. This is the central case, estimated at approximately 45% probability.


              The bear case is the most material risk: no prototype emerges within 18 months, sector valuations compress
              as Chinese volume players commoditize the hardware layer, and Rubin's governance or focus is questioned.
              Rodney Brooks' critique is the sharpest adverse signal: the co-founder of iRobot and former MIT professor
              argues that current humanoid robots will not achieve dexterity because touch-data infrastructure does not
              exist, calling the approach "pure fantasy thinking." TechCrunch covered this as a prediction that
              "billions are being wasted." If the dexterity thesis fails in the 2026–2030 window, the humanoid robot
              market reverts to task-specific deployments at lower ASPs, and Genki's broad humanoid mission becomes
              strategically misaligned. The Essential Products precedent shows Rubin has already experienced one
              high-profile consumer hardware failure. This bear scenario is estimated at 40% probability, with a
              valuation floor of $200–800M if a down-round is required.


              Given this distribution, the expected value of a $1B entry is insufficient to compensate for risk. The
              recommendation is TRACK: do not invest at $1B; revisit at first prototype demonstration + a signed
              customer LOI, which would shift the recommendation to BUY at fair-entry price.
