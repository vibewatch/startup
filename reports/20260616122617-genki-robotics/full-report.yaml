            title: Market boundary logic is the key diligence gate — generic TAM is misleading
            body: >-
              Goldman Sachs' $38B global figure is real but describes a manufacturing- dominated, China- and U.S.-driven
              market. Applying it to Genki's Japan public-safety context inflates the addressable opportunity by at
              least an order of magnitude. The correct framing is a bottom-up Japan service robot SAM built from
              labor-shortage economics in Genki's specific target verticals — a number that no analyst has yet published
              independently. Until that SAM is properly bounded, both buy-side and sell-side market framing is
              speculative.
