        title: Stealth Product Posture and Verified Facts
        blocks:
          - type: paragraph
            body: >-
              Genki Robotics is a humanoid robot startup incorporated in Tokyo by Andy Rubin, co-creator of Android and
              former head of Google's robotics acquisition programme. The company is operating in deliberate stealth: it
              has no public website, no disclosed product specifications, no job postings, and has made no announcements
              about deployments or timelines as of mid-2026. Rubin confirmed the project to The Information but provided
              no technical detail beyond acknowledging prototype development. The company name—"Genki," meaning vibrant
              or healthy in Japanese—signals an intent for active, physically capable robots suited to real-world
              operation rather than laboratory demonstration. A LinkedIn presence confirms the company exists as a legal
              entity with an emerging team, but yields no engineering or product specifics. All product and technology
              analysis in this chapter is therefore inference-driven, constructed from verified competitor benchmarks,
              Japan's deployment context, and Rubin's documented history building humanoid robotics programmes at
              Google, where he oversaw the acquisition of Schaft and multiple other robotics firms between 2013 and
