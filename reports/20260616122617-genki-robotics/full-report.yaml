      - number: '4.6'
        title: Financial Opacity, Adverse Signals, and Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              Genki Robotics presents the most opaque financial profile permissible for an institutional-grade
              investment target: no revenue, no pricing, no customer, no functional website, and no publicly
              identifiable financial officer on the team. This stealth posture is commercially defensible in a
              competitive deep-tech environment, but it creates a fundamental diligence problem. Every standard
              financial gate — revenue quality, gross margin, CAC payback, cash position, and debt schedule — is blocked
              by the absence of disclosure. No venture debt, convertible notes, project finance, or non-equity
              obligations have been confirmed, but absence of disclosure does not confirm absence.


              Two categories of adverse evidence compound the opacity concern. First, sector-structural: Figure AI's CEO
              declined to confirm commercial value versus pilot status of the BMW relationship at Bloomberg Tech (June
              2025), illustrating that even the sector's best-funded Western startup has not generated publicly
              defensible unit economics. Figure AI also blocked secondary market price discovery by sending
              cease-and-desist letters to secondary market brokers in 2025, suggesting that secondary markets were
              converging on a price below the primary-round valuation. Second, technical-skeptic: Rodney Brooks (iRobot
              co-founder, MIT) argues that current humanoid training approaches are inadequate for commercial dexterity
              and characterizes current VC allocation as financing a bubble, a view amplified by TechCrunch as
              suggesting the humanoid sector is "doomed to burst." If dexterity barriers are real, the timeline to
              revenue-generating deployment extends materially and the capital required to bridge that gap multiplies
              correspondingly.


              Rubin's track record at Essential Products — an estimated USD 330 million consumed before shutdown —
              establishes that founder reputation and investor brand are necessary but not sufficient conditions for
              hardware success. Investors committing USD $6 billion to the robotics sector in just the first seven
              months of 2025 without any confirmed positive gross margins at the humanoid level represent concentrated
              speculative exposure. Financial diligence on Genki requires independent verification of prototype
              milestones, a management-account review covering at least six months, and direct confirmation of the
              Series A capital structure before any investment judgment can be responsibly rendered.
