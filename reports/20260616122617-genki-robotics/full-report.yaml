  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: 'Revenue Model and Pricing Architecture: Inferred Streams Only'
        blocks:
          - type: paragraph
            body: >-
              Genki Robotics has disclosed no pricing, contract terms, or revenue model as of June 2026. The company
              operates in stealth mode with no functioning public website, no product specifications on any public
              surface, and no confirmed commercial agreements. Any revenue model analysis must therefore be constructed
              from structural logic of the humanoid robotics industry, peer company evidence, and the public-mission
              framing Genki has offered.


              The most likely near-term revenue mechanism for a mission-critical humanoid startup targeting public
              safety and urban maintenance in Japan is either direct hardware sale to government agencies or
              infrastructure operators, or a Robot-as-a-Service (RaaS) subscription model in which the provider retains
              hardware-asset ownership and charges a recurring fee per deployed unit per period. Agility Robotics'
              commercial agreements with Toyota Motor Manufacturing Canada and GXO (Spanx factory) both operate under
              RaaS structures, demonstrating that recurring-revenue humanoid deployment is commercially achievable.
              Government grant funding under Japan's METI or NEDO programs, and milestone payments under public safety
              procurement contracts, could supplement or precede any commercial revenue, particularly given Genki's
              stated public-safety mission alignment with Japan's Society 5.0 and AI Robotics Strategy frameworks.


              Unitree's publicly listed G1 base price of USD 13,500 establishes the current market low-cost anchor for
              open-market humanoid platforms. Genki's mission-critical positioning implies a substantially higher
              average selling price — mission-critical applications have historically supported premium ASPs due to
              reliability requirements, liability coverage, and integration complexity — but no confirmation is
              available and no list price exists. Revenue recognition policy is unknown: milestone-based government
              contracts recognize revenue differently from RaaS recurring fees or one-time hardware sales, and the
              chosen mechanism will materially affect revenue quality, working-capital requirements, and gross margin
              structure.
