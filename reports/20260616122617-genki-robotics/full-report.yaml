  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              Genki Robotics' relevant market is not "all humanoid robots globally." That framing inflates the
              opportunity and obscures the actual procurement pathway. The coherent market boundary starts with Japan's
              demand for mobile service robots — specifically units deployed in environments that are dangerous,
              physically demanding, or critically labor-constrained — where existing human or mechanical alternatives
              are either unsafe, unavailable, or economically unworkable. This covers three principal verticals: public
              safety and disaster response (search-and-rescue, nuclear decommissioning, CBRNE and EOD inspection); urban
              infrastructure maintenance and industrial inspection (bridges, tunnels, utilities, ports, airport ground
              handling); and institutional care environments where elder care and mobility assistance intersect with
              acute caregiver shortages.


              Included spend is capital and service budget for mobile robotic platforms capable of teleoperation or
              autonomous navigation in complex built environments — hardware, integration, software, and managed-service
              contracts. Excluded spend includes traditional fixed industrial robotic arms (not mobile, not
              service-oriented), consumer companion robots with no professional-use case, and generic ERP or warehouse
              automation software. The status-quo substitutes are human labor, legacy remotely-operated inspection
              vehicles (ROVs and crawlers for pipeline/bridge inspection), and outsourced hazardous-work contractors.
              Genki competes not against other humanoid startups in the first instance, but against these incumbents and
              the "continue doing it manually" default.


              The boundary matters for sizing: Japan's industrial robot base is dominated by fixed-arm production
              equipment; JARA statistics mix this with service and mobile robots. The directly addressable spend for
              Genki sits in the smaller IFR-defined professional service robot category, further narrowed to Japan's
              subset, further narrowed to mobility-capable platforms in safety-critical or maintenance-intensive
              verticals.
