      - number: '7.2'
        title: Stealth Execution and Disclosure Risk
        blocks:
          - type: paragraph
            body: >-
              Genki's complete stealth posture converts ordinary startup uncertainty into a first-order diligence risk
              because almost every operational question remains unanswered at exactly the stage when the company is
              already priced like a unicorn. As of June 2026, the official domain resolves to an empty redirect page,
              the public website is effectively absent, LinkedIn shows only a handful of visible employees, and no
              customer, prototype, safety architecture, or management disclosure has been released. That means outside
              investors cannot distinguish whether stealth is strategic discipline or evidence that technical and
              organizational progress remains too thin for public scrutiny. The pattern also resembles the "invisible
              progress" problem that hurt Essential, where capital was available long before commercial validation was
              achieved. Without named technical leaders, manufacturing partners, or a roadmap for first public
              demonstration, each month of silence compounds counterparty skepticism and raises the probability that
