  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Company Identity, Headquarters, and Stealth Profile
        blocks:
          - type: paragraph
            body: >
              Genki Robotics is a privately held humanoid robotics company incorporated in 2025 and headquartered in
              Minato-ku, Tokyo, Japan. The company was co-founded by Andy Rubin, best known as the creator of Android
              and a former Google senior vice president. Its corporate name derives from the Japanese word "genki,"
              meaning "vibrant" or "healthy," signalling an intent to build robots that are actively capable in
              real-world environments rather than laboratory-constrained systems. The company describes its mission as
              building "humanoid robots for mission critical applications," with Crunchbase identifying public safety
              and urban maintenance as its target verticals.


              Genki Robotics operates in full stealth mode as of June 2026. There is no functioning public website: the
              domain genkirobotics.com is listed as registered but potentially available for sale on domain marketplace
              Afternic, the domain genki-robotics.com is non-functional, and the LinkedIn company page links to
              genki.com, which is not a Genki Robotics property. No job listings, product announcements, press releases,
              or customer disclosures have been made publicly. The company's LinkedIn page, under the industry
              classification "Robotics Engineering," lists headquarters in Minato-ku, Tokyo; a company size of 11–50
              employees; a founding year of 2025; and five partially visible employee profiles, of which Jeff Kunins is
              the only named visible employee. The page had 409 followers as of the June 2026 access date, indicating a
              minimal but detectable public presence. Genki Robotics is privately held and has not filed any publicly
              accessible regulatory disclosures in Japan or internationally, though the National Tax Agency's
              houjin-bangou corporate registry is a potential source for basic legal identity confirmation. The company
              has not appeared on any Japanese government laboratory partner list or METI initiative announcement to
              date.
