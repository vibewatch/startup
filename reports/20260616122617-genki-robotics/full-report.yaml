  - id: FU004
    title: Retention / Repeat Cohort — Customer Proof Strength Index
    type: bar
    layout: standard
    summary: >-
      Genki has no customers; a retention cohort cannot be constructed. This bar shows a directional evidence-strength
      index (0–100) for publicly disclosed customer proof across named analog deployments — scored on contract status,
      independent corroboration, dollar value disclosed, and renewal signals. Gecko/Navy scores highest (5-yr IDIQ,
      $54M, full corroboration); Amazon/Agility scores near-zero (pilot explicitly not renewed); Genki scores zero by
      definition.
    data:
      items:
        - label: Gecko / US Navy (5-yr IDIQ, $54M)
          value: 95
        - label: Agility / Toyota (1yr pilot → RaaS contract)
          value: 80
        - label: Agility / GXO (multi-year RaaS, first deal)
          value: 78
        - label: Figure / BMW (30k cars contributed)
          value: 60
        - label: JAL / GMO AI (2yr trial, no commitment)
          value: 22
        - label: Amazon / Agility (pilot not renewed)
          value: 8
        - label: Genki Robotics (no customers)
          value: 0
    approximationNotes: >-
      Scores (0–100) are editorial approximations of evidence quality for benchmarking only — not reported retention or
      revenue figures. Scored on: signed contract status (40 pts), independent third-party corroboration (25 pts),
      dollar value publicly disclosed (20 pts), multi-year or renewal signal (15 pts). Gecko receives maximum because
      all four components are present. Amazon/Agility near-zero due to confirmed non-renewal; JAL trial low because no
      commercial commitment was stated at launch. Genki zero by definition. All scores are directional proxies for
      diligence benchmarking only.
