      - number: '4.3'
        title: Financing Chronology and Investor Signaling
        blocks:
          - type: paragraph
            body: >-
              The Company Overview chapter contains the full financing chronology. This section focuses on capital
              adequacy signals available from public sources and what they imply for financial runway. Genki Robotics'
              reported $1 billion post-money valuation following its Series A in April 2026 is the only financial
              milestone publicly confirmed. The Crunchbase April 2026 unicorn report characterizes the company as one
              year old at its unicorn entry, implying founding in mid-2025 and a trajectory from formation to unicorn
              status in under twelve months — consistent with a well-networked founder raising from a known
              institutional partner (Playground Global) on founder conviction rather than demonstrated product traction.


              Playground Global's Fund III (closed December 2023 at $410 million) deploys initial checks of USD 1
              million to USD 20 million at seed and Series A stage in deep-tech companies. If Playground led the round
              and structured it as a traditional Series A for a deep-tech hardware startup, co-investors would likely
              have been required to reach the capital level necessary for meaningful hardware R&D, though no
              co-investors have been publicly confirmed. An implied Series A in the range of USD 50 million to USD 200
              million is directionally plausible based on the $1B post-money valuation and typical Series A ownership
              targets of 15–25% primary, but this estimate carries very low confidence. No exact round size, co-investor
              list, liquidation preference, pro-rata rights, or management option reserve has been disclosed.


              The valuation step-up potential visible in the sector is significant. Figure AI progressed from a $2.6
              billion Series B valuation in February 2024 to a $39 billion Series C valuation in September 2025, a
              roughly 15x step-up in under twenty months. Genki's $1 billion Series A entry positions it early on this
              potential trajectory, but the path from Series A to Series B commercialization requires demonstrating
              prototype robustness, pilot customer results, and a credible path to recurring revenue that is not yet
              publicly evidenced.
