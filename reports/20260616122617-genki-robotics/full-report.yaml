      - number: '3.2'
        title: Adjacent, Substitute, and Entrant Competitors
        blocks:
          - type: paragraph
            body: >-
              Beyond the primary humanoid players, Genki faces competition from specialized inspection robots already
              deployed in its target segment, powerful technology incumbents entering humanoid robotics, and Chinese
              manufacturers expanding their volume advantage to a degree that could commoditize the hardware layer.


              Gecko Robotics is the most commercially mature substitute within Genki's core verticals. The company
              builds robots and sensors for inspecting large industrial assets — ships, bridges, industrial tanks — and
              in March 2026 signed a five-year IDIQ contract with the US Navy, covering 18 vessels in the US Pacific
              Fleet, with a $54 million initial award and a $71 million ceiling. While Gecko's crawling robots do not
              share a bipedal form factor with Genki's implied product design, they directly serve the infrastructure
              inspection and public-asset- maintenance use cases Genki targets. Buyers already solving bridge or ship
              inspection problems have a signed Gecko contract vehicle to reference; Genki must either partner with
              similar procurement frameworks or unseat an entrenched relationship.


              Tesla's Optimus program is the highest-profile humanoid effort globally but remains internally focused and
              behind schedule. As of July 2025, Tesla had produced only hundreds of units against its self-imposed
              5,000-unit target for the full year, trailing its pledge significantly. Musk has articulated a
              one-million-unit per year goal within five years, a projection lacking near-term operational grounding.
              Tesla's captive deployment strategy — automating its own factories — means it is not a direct channel
              competitor to Genki in public-safety verticals, but long-term external commercialization remains a tail
              risk if Optimus performance improves ahead of schedule.


              Meta acquired Assured Robot Intelligence (ARI) in May 2026, bringing humanoid foundation-model expertise
              into its Superintelligence Labs unit. ARI's co-founders Xiaolong Wang (former Nvidia researcher) and
              Lerrel Pinto (former NYU professor who co-founded a prior humanoid startup acquired by Amazon) specialized
              in enabling robots to understand and adapt to human behavior in complex, dynamic environments. Meta's
              acquisition signals that large technology incumbents are building proprietary AI stacks for humanoid
              robotics, which could accelerate commoditization of robot intelligence software and reduce the
              defensibility of any startup's AI differentiation — a risk Genki faces if its product relies on external
              foundation models.


              Neura Robotics, a German humanoid startup, inked a partnership with Qualcomm in March 2026 to use the
              Dragonwing Robotics IQ10 processor in its humanoid and general-purpose robots, and launched its Neuraverse
              simulation and training platform in June 2025. Neura is expanding from European industrial markets and
              represents a potential geographic extension of Western humanoid competitors into Japan, particularly given
              Qualcomm's existing Asia semiconductor distribution relationships.


              The Chinese humanoid sector as a whole — led by Agibot (5,168 units shipped in 2025, representing 38.8%
              global share) and UBTech (1,000 units) — has an aggregate hardware supply chain and cost structure that
              Western or Japanese manufacturers cannot match on unit price alone. A TechCrunch analysis citing China
              policy experts found that Chinese manufacturers shipped approximately 36 times more units in 2025 than US
              rivals Figure and Tesla combined, and the three largest Chinese shippers (Agibot, Unitree, UBTech)
              accounted for 78% of the approximately 13,317 global humanoid shipments that year.
