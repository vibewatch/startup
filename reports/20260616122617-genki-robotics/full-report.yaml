        - Confirms product risk is existential; $1B thesis collapses to option-value near zero
        - Block follow-on; commence write-down process; engage Rubin directly on timeline
      - - Founder departure or governance concern
        - Andy Rubin exits as CEO or operational questions arise (cf. Essential Products governance)
        - Removes the single primary thesis pillar; pedigree premium evaporates
        - Immediate re-evaluation; negotiate governance protections before any new capital commitment
      - - Sector valuation compression
        - >-
          Figure AI down-round or public humanoid comp (if IPO occurs) trades below $15B; or Goldman Sachs retracts TAM
          upward revision
        - Comparable valuation multiple contracts; $1B Genki entry becomes expensive relative to new sector ceiling
        - Renegotiate entry or decline follow-on; set trailing-comp trigger
      - - Chinese cost disruption in Japan
        - >-
          Agibot or Unitree volumes cross 50,000 units/year and public Japan procurement begins favoring Chinese ASPs
          below $15,000
        - Genki's Japan premium positioning eroded; ASP ceiling for mission-critical application compresses
        - Demand evidence of IP or software differentiation justifying premium over Chinese hardware
      - - Japan regulatory delay
        - METI safety certification or public-safety procurement cycle extends > 30 months beyond initial pilot LOI
        - Go-to-market timeline extends; capital requirements increase; runway risk materialises before revenue
        - Increase burn estimate; reduce entry valuation; require bridge capital commitment with governance rights
    notes: >-
