      - number: '1.3'
        title: Funding, Valuation, and Investor Map
        blocks:
          - type: paragraph
            body: >
              Genki Robotics achieved unicorn status in April 2026. On April 21, 2026, Axios Pro reported the company
              had obtained a $1 billion valuation, with the headline reading "Scoop: Android creator Andy Rubin's
              humanoid robotics company gets $1b valuation." Crunchbase News corroborated this in its April 2026 unicorn
              tracker, listing Genki Robotics as a "1-year-old" Tokyo-based humanoid robotics company that raised a
              Series A led round and was valued at $1 billion. The round makes Genki Robotics the sole Japanese
              representative among six humanoid robotics companies that joined the unicorn board in April 2026—the other
              five were all China-based.


              The total amount raised in the Series A, the identity of the lead investor, and the names of any
              co-investors have not been publicly disclosed as of June 2026. Neither Genki Robotics nor any investor has
              issued a press release confirming round details. Playground Global, co-founded by Rubin, is a natural
              candidate to have participated given its deep-tech hardware mandate and Rubin's co-founder relationship,
              but participation has not been confirmed or denied in any accessible source. PitchBook lists a Genki
              Robotics profile but the page is behind a JavaScript wall, and Crunchbase's direct organization page
              returns a 403 block, limiting database verification of funding details. Governance details—board
              composition, voting rights, and the nature of any protective provisions—are entirely undisclosed.
