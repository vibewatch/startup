      - number: '5.2'
        title: Inferred System Architecture and Technology Stack
        blocks:
          - type: paragraph
            body: >-
              Without any disclosed architecture, the most defensible approach is to infer Genki's probable technology
              stack from the convergent design choices of leading commercial humanoid platforms and the physical
              constraints of Japan's mission-critical deployment environments. All current commercial-scale humanoids
              use 3D LiDAR combined with stereo depth cameras for 360-degree spatial perception; this is a functional
              necessity for safe bipedal navigation in unstructured environments, not a differentiated design choice.
              Unitree's H1 and G1 platforms both embed 3D LiDAR plus depth cameras as standard, and the G1 supports
              between 23 and 43 degrees of freedom depending on configuration. Compute architecture is converging on
              edge SoC platforms—Qualcomm's Dragonwing Robotics IQ10 series, announced at CES 2026, was explicitly
              designed for humanoids and autonomous mobile robots—supplemented by cloud AI inference for foundation
              model queries. The dominant industry trend is toward vertically integrated AI: Figure AI terminated its
              OpenAI collaboration to build in-house vision-language-action (VLA) models citing the need to end-to-end
              own embodied AI, while Boston Dynamics partnered with Google DeepMind to build robot foundation models for
              Atlas, and Qualcomm partnered with Neura Robotics to embed the IQ10 processor as a reference design.
              Locomotion training uses reinforcement learning in simulation transferred to real hardware; the Boston
              Dynamics–RAI Institute partnership is the commercial frontier of this approach. Given Rubin's 2018 public
              skepticism about a single unified robot software platform, Genki most likely pursues a purpose-built stack
              rather than a commodity third-party AI API integration. Manipulation and dexterous hands remain the
              hardest unsolved problem: Rodney Brooks has published a detailed argument that today's humanoids will not
              learn dexterity through current training regimes, and Tesla's 2025 lawsuit over Optimus hand sensor trade
              secrets illustrates how intensely competitive and technically sensitive this subsystem is. Empirical
              evidence is nonetheless accumulating that end-to-end learned VLA policies can generalise across household
              dexterity tasks: Figure AI's Helix model—a single neural network—has demonstrated dishwasher loading, full
              living-room tidying, and coordinated two-robot bedroom resetting using the same core architecture,
              acquiring each new capability purely through additional data rather than new algorithms, suggesting that
              scalable learned manipulation may become the dominant architecture for unstructured-environment dexterity.
