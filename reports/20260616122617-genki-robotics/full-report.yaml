      - number: '5.4'
        title: Safety and Autonomy Constraints for Mission-Critical Deployment
        blocks:
          - type: paragraph
            body: >-
              Mission-critical humanoid deployment demands a safety framework that goes well beyond the physical
              cage-based isolation used for earlier industrial robots. Figure AI's 2025 creation of a dedicated Center
              for the Advancement of Humanoid Safety illustrates that the industry considers human-robot coworking
              safety an unsolved problem at commercial scale. Humanoid robots operating alongside people introduce
              collision risk from large, mobile metal bodies in shared spaces; computer vision-based collision avoidance
              is the dominant mitigation approach, but it requires certification against standards such as ISO 10218
              (safety of industrial robots in collaborative workspaces) and ISO/TS 15066. Boston Dynamics has
              demonstrated a precedent for deploying mobile robots in high-consequence environments—CBRNE investigation,
              explosive ordnance disposal, nuclear decommissioning—using the Spot quadruped, establishing a safety
              evidence base that humanoid entrants must match or surpass. Rodney Brooks, founder of iRobot and a
              prominent MIT roboticist, has published a detailed argument that bipedal walking in human proximity
              remains an unresolved safety problem, independent of manipulation dexterity. For Japan specifically, the
              Personal Information Protection Act (PIPA) governs the collection and storage of camera and biometric data
              from deployed robots, adding a data governance layer to hardware safety requirements. No public evidence
              exists that Genki Robotics has engaged with any of these compliance pathways, which represents a material
              diligence gap for investors evaluating deployment timelines. The industry's own sensitivity to misuse risk
              is formalised in a joint open letter signed by Agility Robotics and co-signatories pledging never to
              weaponise general-purpose advanced-mobility robots, citing risks to civil rights and public trust; this
              explicit industry stance signals that humanoid platforms intended for civilian deployment must be governed
              by clear ethical and policy frameworks that Genki will also need to adopt.
