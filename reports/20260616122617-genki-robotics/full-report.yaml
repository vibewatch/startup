      - number: '2.3'
        title: Buyer, user, and payer segmentation with adoption path
        blocks:
          - type: paragraph
            body: >-
              Japan's public safety and urban maintenance robot market has a layered procurement structure that differs
              materially from consumer or general manufacturing contexts. The economic buyer (holds the budget) is
              almost always an institutional or government entity: municipal disaster-response agencies, national
              infrastructure operators, port and airport authorities, power utilities, or national defense-adjacent
              organizations. The end user is typically an operations team — airport ground handlers, disaster response
              teams, utility inspection crews — who interact with the robot but rarely control the procurement. The
              payer in many cases involves public funding, government subsidies, or cost-sharing under national programs
              (METI, NEDO, Moonshot R&D), which accelerates entry but also lengthens sales cycles through procurement
              rules.


              Japan Airlines' May 2026 trial at Haneda Airport (baggage handling and cabin cleaning) illustrates the
              buyer-user-payer split: JAL holds the contract and operates the budget (buyer/payer), airport ground staff
              are users, and GMO AI & Robotics is the integration partner. The two-year trial structure is
              characteristic of Japanese institutional procurement — pilots precede any full deployment authorization,
              and ROI evidence must accumulate before budget commitment. The adoption trigger for each segment varies:
              disaster-response buyers cite safety and impossibility (no human can enter the environment);
              infrastructure-inspection buyers cite cost and availability of skilled inspectors; aviation and logistics
              buyers cite chronic labor shortage at specific labor classes. Understanding which trigger is live for
              which segment determines where initial sales concentration should land.
