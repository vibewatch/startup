  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: 'Financing Event and Valuation Context: What Is Known and What Is Not'
        blocks:
          - type: paragraph
            body: >-
              Genki Robotics received a $1 billion post-money Series A valuation in April 2026, confirmed by an Axios
              Pro scoop (paywalled) and independently corroborated by Crunchbase News' April 2026 unicorn roundup.
              Crunchbase describes the company as a 1-year-old Tokyo humanoid robotics startup co-founded by Andy Rubin,
              focused on public safety and urban maintenance, with a Series A lead round. That is essentially the
              totality of public evidence: no round size has been disclosed, no lead investor has been identified, no
              liquidation preferences or cap table structure are known, and no dilution percentage has been reported.


              The disclosure discount logic for a stealth-stage pre-revenue company is significant. At peer revenue
              multiples of 20–100x ARR, a $1B valuation implies Genki would need between $10M and $50M in ARR to
              approach fair value on a forward multiple basis. Current disclosed ARR is zero. The entire $1B therefore
              represents option value: the probability-weighted present value of future cash flows discounted by
              execution, technical, competitive, and founder risk. This structure means any new investor entering at $1B
              is paying an implicit premium for narrative and pedigree rather than demonstrated product-market fit.


              Andy Rubin's pedigree is the primary thesis anchor: he co-founded Android, ran Google's robotics
              acquisition programme (which included Japan's Shaft), and founded Playground Global, a deep-tech hardware
              VC that closed a $410M Fund III in December 2023. These are genuine credentials. However, his prior
              consumer hardware venture Essential Products shut down in February 2020 after failing to break into the
              smartphone market, establishing that pedigree does not guarantee execution. The thesis/anti-thesis
              analysis in TV002 structures the full evidence on both sides of this valuation debate.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
