      - number: '8.2'
        title: 'Comparable Valuation Analysis: Sector Peers, Market Signals, and Japan Demand'
        blocks:
          - type: paragraph
            body: >-
              The nearest comparable for Genki Robotics is Figure AI's trajectory. Figure raised a $675M Series B at
              $2.6B post-money in February 2024 with 80 employees, backed by Microsoft, OpenAI, Nvidia, Amazon, and
              Bezos. By September 2025 it raised over $1B in a Series C at $39B — a 15x step-up over 18 months. Despite
              this extraordinary valuation, Figure shipped only approximately 150 humanoid units in 2025, according to
              Omdia data cited by Forbes. The CEO skipped a live robot demonstration at Bloomberg Tech and declined to
              confirm the commercial terms of the BMW relationship. Figure also sent cease-and-desist letters to
              secondary market brokers, raising governance flags. Genki sits at $1B — 2.6% of Figure's current valuation
              — but with zero deployment proof versus Figure's expanding commercial activity: BMW, UPS, and a Catalyst
              Brands retail logistics agreement. By 2026 Figure had also ramped Figure 03 production, opened BotQ (a
              dedicated manufacturing facility), and deployed Helix AI at scale for logistics — manufacturing and
              AI-integration milestones that remain entirely hypothetical for Genki.


              Agility Robotics provides the most grounded commercial comparable. Its $150M Series B was co-led by DCVC
              and Playground Global — Andy Rubin's own VC fund — creating a direct investor-network link between Genki's
              founder and the most commercially advanced humanoid peer. Agility signed a formal RaaS commercial
              agreement with GXO for a Spanx factory deployment in June 2024, opened RoboFab (the world's first
              dedicated humanoid robot factory, targeting 10,000 units annually) in April 2024, expanded to Mercado
              Libre for Latin American logistics in 2025, announced hardware innovations for Digit covering improved
              dexterity and payload, and deployed seven robots at Toyota TMMC in February 2026 under a formal commercial
              RaaS agreement. Even so, the company laid off staff in April 2024 to refocus on commercialization.
              Agility's full cycle from pilot to commercial deployment at Toyota took roughly one year, implying 2–4
              year revenue timelines for any stealth-stage entrant.


              Unitree's G1 at $13,500 establishes the competitive price floor. Unitree shipped 4,200 humanoid units in
              2025 (87% of global shipments came from Chinese manufacturers), but was added to the Pentagon's 1260H
              China Military list in June 2026, restricting US and potentially Japan-market partnerships. Japan Airlines
              began trials at Haneda Airport (May 2026) with Unitree's H1, illustrating genuine Japan demand but also
              Genki's competitive exposure to Chinese volume players. Japan METI targets a 30% share of global physical
              AI by 2040 and Japan's working-age population is projected to decline 31% by 2060, creating a structurally
              compelling 20-year demand thesis. The comparable valuation table TV004 covers nine data points across this
              peer set.
