  - id: FV001
    title: Recommendation Logic Flow — Genki Robotics
    type: flow
    layout: standard
    summary: >-
      Chain from positive and negative evidence pillars through the disclosure discount framework to the recommendation
      of TRACK and the thesis-break conditions that would move the call to BUY.
    data:
      nodes:
        - id: japan-demand
          label: Japan Labor Crisis & METI Policy
          detail: >-
            Structural 14-year population decline; 31% working-age decline projected by 2060; METI targets 30% global
            physical AI share by 2040; Japan Airlines humanoid trials May 2026
        - id: sector-momentum
          label: Sector Valuation Momentum
          detail: >-
            Figure AI at $39B; six humanoid unicorns in April 2026; Goldman Sachs 4x upward TAM revision to $38B; $6B VC
            inflow Jan–Jul 2025
        - id: rubin-pedigree
          label: Rubin Founder Pedigree
          detail: >-
            Android co-founder; led Google robotics acquisition wave 2013 including Japan's Shaft; Playground Global
            $410M Fund III deep-tech VC
        - id: zero-proof
          label: Zero Revenue and Zero Customer Proof
          detail: >-
            No commercial agreement, LOI, pilot, or revenue of any kind; stealth implies no verifiable commercial
            validation
        - id: zero-prototype
          label: No Prototype Evidence
          detail: >-
            No public hardware demo, no technical spec, no working robot confirmed as of June 2026; product viability
            entirely unverified
        - id: essential-risk
          label: Essential Products Failure Precedent
          detail: >-
            Andy Rubin's prior consumer hardware venture shut down Feb 2020; pedigree does not guarantee execution in an
            even harder domain
        - id: bubble-risk
          label: Dexterity Critique and Bubble Risk
          detail: >-
            Rodney Brooks (iRobot, MIT): current humanoid dexterity approach is pure fantasy thinking; TechCrunch
            identifies bubble risk; sector multiples disconnected from revenue
        - id: disclosure-discount
          label: Disclosure Haircut Required
          detail: >-
            Stealth + pre-revenue + no prototype = significant disclosure discount; $1B implies 100x+ ARR multiple with
            zero ARR; expensive by any fundamental metric
        - id: recommendation
          label: 'RECOMMENDATION: TRACK (Not Buy at $1B)'
          detail: >-
            Do not invest at current $1B headline; insufficient proof to underwrite; revisit at first prototype + signed
            customer LOI
        - id: thesis-break
          label: Thesis-Break Condition for BUY
          detail: >-
            Prototype demonstration (NDA or public) + signed Japan customer LOI within 18 months shifts call to BUY at
            negotiated fair-entry price
      edges:
        - from: japan-demand
          to: disclosure-discount
          label: partially offsets
        - from: sector-momentum
          to: disclosure-discount
          label: sector floor; partially offsets
        - from: rubin-pedigree
          to: disclosure-discount
          label: pedigree premium; partially offsets
        - from: zero-proof
          to: disclosure-discount
          label: amplifies required haircut
        - from: zero-prototype
          to: disclosure-discount
          label: amplifies required haircut
        - from: essential-risk
          to: disclosure-discount
          label: further amplifies
        - from: bubble-risk
          to: disclosure-discount
          label: sector-level haircut
        - from: disclosure-discount
          to: recommendation
          label: net judgment
        - from: recommendation
          to: thesis-break
          label: what changes the call
    approximationNotes: >-
      Edge labels are qualitative directional descriptions; no weighting model has been applied. The relative magnitude
      of positive vs. negative inputs is a judgment based on the evidence available; a data-room disclosure would
      quantitatively alter several nodes.
    claimRefs:
      - CV003
      - CV004
      - CV012
      - CV014
      - CV026
      - CV029
      - CV031
      - CV044
  - id: FV002
    title: Valuation Sensitivity — Implied Revenue Needed to Justify $1B Entry at Various Multiples
    type: bar
    layout: wide
    summary: >-
      At each revenue multiple assumption, this bar chart shows the ARR or revenue level Genki would need to earn to
      justify a $1B post-money entry price. Current disclosed ARR is zero, making the entire valuation
      narrative-anchored.
    data:
      items:
        - label: At 100x ARR (high-growth AI SaaS premium)
          value: 10
          detail: >-
            Genki would need ~$10M ARR; plausible for a first Japan government contract but has not been confirmed or
            disclosed
        - label: At 50x ARR (Figure-tier humanoid premium)
          value: 20
          detail: >-
            $20M ARR at 50x; no US or Japan humanoid startup has disclosed this ARR level; represents 2–3 year
            commercial ramp assumption
        - label: At 20x Revenue (late-stage growth company)
          value: 50
          detail: >-
            $50M revenue at 20x; realistic only after multi-year commercial deployment; would require substantial
            government or enterprise contracts
        - label: At 10x Revenue (IPO-ready hardware-AI hybrid)
          value: 100
          detail: $100M revenue at 10x; hardware-AI company approaching IPO readiness; Genki is years away from this profile
        - label: At 5x Revenue (traditional hardware)
          value: 200
          detail: >-
            $200M revenue at 5x; pure-hardware company pricing; would require very large fleet deployment across
            multiple Japan enterprises
        - label: Genki Current ARR (disclosed)
          value: 0
          detail: Zero disclosed revenue; full $1B is option-value and narrative pricing for sector momentum and pedigree
    approximationNotes: >-
      Values are USD millions of ARR or revenue implied at each multiple assumption applied to the $1B post-money
      valuation. Revenue multiple assumptions are illustrative peer-range estimates derived from comparable sector
      financing data; they are not audited or model-derived figures. Current ARR is zero by public disclosure.
    claimRefs:
      - CV001
      - CV007
      - CV008
      - CV044
  - id: FV003
    title: Valuation / Return Range — Bull, Base, and Bear Outcomes at $1B Entry
    type: range
    layout: standard
    summary: >-
      Low and high exit valuation bounds for three scenarios; entry is $1B Series A post-money April 2026; ranges
      reflect assumptions in TV003 and represent directional returns, not IRR-modeled projections.
    data:
      items:
        - label: Bull case exit valuation (2028–2030)
          low: 3000
          high: 7000
          unit: USD M
          note: >-
            Japan govt/aviation pilot + 50+ RaaS units deployed + strategic M&A or Series C; 3–7x return from $1B entry;
            probability < 15%
          claimRef: CV033
        - label: Base case Series B valuation (2027)
          low: 1500
          high: 2500
          unit: USD M
          note: >-
            Prototype demonstrated; early pilot; modest step-up from $1B; 1.5–2.5x paper return; illiquid; probability
            ~45%
          claimRef: CV036
        - label: Bear case down-round or secondary (2027–2028)
          low: 200
          high: 800
          unit: USD M
          note: No prototype within 18 months; sector compression; Essential-like outcome; 0.2–0.8x return; probability ~40%
          claimRef: CV031
        - label: Current entry price (April 2026 Series A)
          low: 1000
          high: 1000
          unit: USD M
          note: Reported $1B post-money Series A; round size undisclosed; no liquidation preference data
          claimRef: CV001
        - label: Sector ceiling (Figure AI Series C, Sep 2025)
          low: 39000
          high: 39000
          unit: USD M
          note: >-
            Figure AI $39B post-money; extreme ceiling; ~150 units shipped; CEO avoided live demos; C&D to secondary
            brokers
          claimRef: CV008
    approximationNotes: >-
      All ranges are scenario estimates derived from comparable sector data, not formal DCF or IRR models. No
      management-account data was available. Preference overhang and dilution are not factored in due to cap table
      opacity; actual investor returns could be materially lower than headline valuation multiples suggest.
    claimRefs:
      - CV001
      - CV008
      - CV012
      - CV029
      - CV036
