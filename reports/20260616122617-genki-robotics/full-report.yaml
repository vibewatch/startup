      - number: '1.2'
        title: Founders, Leadership, and Governance
        blocks:
          - type: paragraph
            body: >
              Andy Rubin is the publicly confirmed co-founder of Genki Robotics and its most prominent named principal.
              Rubin co-created Android—the mobile operating system later acquired by Google in 2005—and served as a
              senior vice president at Google overseeing mobile products. In 2013, while at Google, he led an aggressive
              robotics acquisition program that brought seven companies into the Google fold, most notably Schaft, a
              humanoid robotics spinout from the University of Tokyo. That acquisition gave Rubin direct experience with
              Japan's academic robotics talent pool and industrial ecosystem, a relationship he appears to be
              reactivating through Genki Robotics. Rubin left Google in 2014 and subsequently co-founded Playground
              Global in 2015, a Palo Alto-based early-stage venture capital firm focused on deep tech and hardware,
              which closed its Fund III at $410 million in December 2023. Between 2015 and 2020, Rubin also co-founded
              Essential Products, a smartphone startup that raised $330 million from investors including Playground
              Global, Tencent, and the Amazon Alexa Fund, and sold approximately 88,000 devices before folding in
              February 2020.


              Jeff Kunins is the only other publicly named individual associated with Genki Robotics, appearing as an
              employee on the company's LinkedIn page. His specific title or functional role at the company has not been
              publicly disclosed. Other co-founders, board members, C-suite executives, and advisors have not been
              publicly identified, consistent with the company's broad stealth posture.


              Andy Rubin's leadership concentration represents an acute key-person risk. He is the company's only
              publicly confirmed founder, sole public spokesperson, and the individual whose network connections
              underpin both the Tokyo base and likely investor relationships. Rubin's reputational record is a material
              adverse governance factor. In October 2018, The New York Times reported that Google had awarded Rubin a
              $90 million exit package despite a credible internal investigation finding his relationship with a
              subordinate employee "improper and showed bad judgment." This reporting triggered a global Google employee
              walkout in November 2018 and a shareholder derivative lawsuit alleging breach of fiduciary duty and
              corporate waste. In July 2019, newly unsealed divorce court documents alleged that Rubin had obtained a
              prenuptial agreement described as "unconscionable, capping spousal support and stripping Plaintiff of her
              community property rights under California law without informed consent." Rubin has denied the most
              serious allegations, and no criminal charges were filed, but the governance overlay created by this
              history is a recurring diligence item for any institutional investor or corporate partner.
