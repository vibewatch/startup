              them quite a few years to really scale, and even now no one really scaled to full autonomy." Rodney Brooks
              predicted in September 2025 that the humanoid robot investment bubble would burst, citing the
              impossibility of learning dexterity at scale from current training approaches. Multiple robotics VCs told
              TechCrunch they do not expect wide humanoid adoption for at least several years and potentially over a
              decade. Even Agility Robotics — the most commercially advanced humanoid company by deployed units — had to
              lay off staff and pivot its commercialization strategy in 2024 while actively managing Amazon's decision
              not to renew its pilot. Genki operates several years behind Agility's product maturity and has no
