      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Boston Dynamics Spot Is Already Deployed in Genki's Target Segment
            body: >-
              Boston Dynamics Spot holds commercial deployments in CBRNE, EOD, and nuclear decommissioning — the precise
              public-safety verticals Genki targets. Any government or industrial buyer Genki approaches will compare
              its unproven product against a field-tested competitor with an existing sales motion and support
              infrastructure. Genki must either offer a compelling bipedal-form-factor advantage (e.g., ladder climbing,
              human-tool use, human-space navigation) that Spot cannot match, or compete on Japan-specific relationship
              access. Neither advantage is currently verifiable.
            calloutType: risk
            claimRefs:
              - CP001
              - CP006
              - CP038
          - type: callout
            title: Expert Consensus Questions Humanoid Dexterity Readiness
            body: >-
              Rodney Brooks, co-founder of iRobot and a robotics pioneer, publicly argues that humanoid robots —
              regardless of funding level — cannot learn dexterity due to a fundamental absence of tactile sensor data
              analogous to the approximately 17,000 touch receptors in human hands. This critique applies to every
              humanoid platform in this chapter, including Genki's undisclosed one. If the dexterity gap persists,
              mission-critical public-safety tasks requiring fine manipulation (e.g., handling hazardous materials,
              operating equipment in disaster zones) may remain out of reach for any current humanoid design.
            calloutType: risk
            claimRefs:
              - CP028
              - CP029
          - type: callout
            title: Unitree's Pentagon Designation May Create a Structural Moat for Genki
            body: >-
              The Pentagon's June 2026 addition of Unitree to its 1260H list of entities supporting China's military,
              while primarily a US policy action, signals a growing institutional pattern of restricting Chinese
              robotics suppliers from defense and public-safety procurement across allied nations. Japan's government
              procurement frameworks are likely to apply analogous restrictions. If Chinese low-cost humanoids are
              structurally barred from Japan public-safety contracts, Genki's addressable market effectively excludes
              its lowest-cost competitors, improving its pricing power without any independent technical achievement.
