          value: 14
          description: >-
            Japan's 14th consecutive year of population decline; working-age population projected to shrink by ~15M over
            20 years; 2024 overtime rules in construction; METI Society 5.0 mandate; RING Project (June 2025); 30%
            global physical-AI target by 2040.
        - label: 2. Government or enterprise buyer intent
          value: 5
          description: >-
            Buyers issue RFIs or initiate vendor evaluation. Requires vendor registration with Japanese procurement
            authorities or direct C-suite sponsorship. Competition from Spot (BD), Unitree, GMO AI, and SoftBank
            Robotics narrows Genki's available window.
        - label: 3. Formal pilot / 2-year PoC
          value: 2
          description: >-
            JAL Haneda trial is 2-year; KyoHA mass-production target 2027; Spot used in government CBRNE pilots
            globally. Safety risk assessments, liability frameworks, and insurance approvals must be complete before
            pilot launch. Genki has no pilot engagement.
        - label: 4. Pilot-to-commercial conversion
          value: 1
          description: >-
            Toyota/Agility conversion after 1-year pilot illustrates fastest observed timeline. Amazon/Agility
            non-renewal illustrates the downside. Japan public-sector tenders add additional competitive bid stage.
            Conversion is the highest-friction stage.
        - label: 5. Fleet contract and expansion
          value: 0
          description: >-
            Multi-year RaaS or capex fleet contract with defined uptime SLA, maintenance terms, and renewal clauses. No
            humanoid company has reached this stage in Japan as of June 2026. Gecko/Navy is the best analog in the
            defense/public-safety segment globally.
    approximationNotes: >-
      Values represent indicative years or stage weights, not absolute customer counts. Stage 1 value is Japan's
      consecutive population-decline years. Stage 5 value is 0 because no Japan humanoid fleet contracts are confirmed
      as of run date.
    claimRefs:
      - CU003
      - CU007
      - CU009
      - CU015
  - id: FU003
