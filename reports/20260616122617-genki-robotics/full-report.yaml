        title: Competitor Technology Benchmarks as Inference Anchors
        blocks:
          - type: paragraph
            body: >-
              Competitor hardware specifications provide the clearest evidence base for what a commercially viable
              humanoid robot must deliver. Unitree's H1 achieves 3.3 m/s walking speed with a 864 Wh battery and 3D
              LiDAR plus depth-camera sensing at approximately USD 20,000 per unit, setting the cost-competitive
              hardware floor. Boston Dynamics' Atlas carries 50 kg instantaneous (30 kg sustained), operates for 4 hours
              per battery charge, and integrates with enterprise systems through the Orbit fleet management platform,
              which connects to MES, WMS, and other systems of record. Sanctuary AI's Phoenix 7th generation can
              automate new tasks in under 24 hours of training and has been validated across more than 400
              customer-defined tasks in 15 industries, setting the AI versatility benchmark. Figure AI's F.02 robot
              completed an 11-month deployment at BMW Plant Spartanburg running 10-hour shifts Monday to Friday, logging
              over 1,250 hours of runtime and loading more than 90,000 sheet-metal parts within a 5-millimetre placement
              tolerance before Figure retired the F.02 and pivoted to consumer home deployment with the F.03 and Helix
              VLA model; this documented industrial-to-domestic strategic shift underscores that vertical selection is a
              central, revisable variable for humanoid companies. Agility Robotics' Digit provides an additional
              benchmark: designed specifically for human-built spaces—warehouse aisles, doorways, and shelving
              dimensioned for people—Digit targets the approximately one million unfilled logistics jobs in the US
              alone, and Agility publishes full technical specifications covering dimensions, payload, battery life, and
              sensing. Unitree shipped approximately 36 times more humanoid robot units than US rivals in 2024,
              demonstrating that high-volume, lower-cost platforms can dominate early-market volume even as premium
              entrants focus on capability. Physical AI and humanoid robots were the centrepiece of CES 2026, with
              announcements from Nvidia, Boston Dynamics, and others signalling accelerating industry momentum against
