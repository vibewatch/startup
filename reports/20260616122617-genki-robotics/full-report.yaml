  - id: FU001
    title: Customer Adoption Journey — From Urgency to Contracted Deployment
    type: journey-map
    layout: wide
    summary: >-
      Japan's institutional procurement model creates a five-stage journey from labor-shortage urgency to contracted
      fleet deployment; Genki Robotics has not entered any stage.
    data:
      items:
        - id: stage-1-urgency
          label: 'Stage 1: Structural Labor Urgency'
          actor: Executive / government policy team
          description: >-
            Japan's 14th consecutive year of population decline, shrinking working-age population (59.6% of total), and
            2024 overtime rules in construction all force institutional buyers to evaluate automation. Policy levers
            include METI 30% global share target, RING Project grants, and Society 5.0 mandate.
          channels:
            - METI/NEDO grant announcements
            - Industry press coverage
            - Ministry policy directives
        - id: stage-2-evaluation
          label: 'Stage 2: Vendor Evaluation and RFI'
          actor: Procurement officer / technical committee
          description: >-
            Institutional buyers issue RFIs, attend trade shows, and conduct internal safety assessments. Japan's
            public-sector procurement requires formal vendor registration. The shortlist is typically limited to vendors
            with prior deployment evidence.
          channels:
            - Trade exhibitions (IREX, CES Japan)
            - METI/NEDO vendor networking events
            - Direct vendor outreach
        - id: stage-3-pilot
          label: 'Stage 3: Pilot / PoC (6–24 months)'
          actor: Site manager / safety officer
          description: >-
            Standard Japan institutional pilot runs 6–24 months with defined KPIs. JAL's Haneda trial is 2 years.
            Government safety assessments and liability frameworks must be resolved before pilot commencement. Pilots
            funded by vendor, buyer capex, or NEDO grants.
          channels:
            - Site integration team
            - Safety certification body
            - NEDO co-funding application
        - id: stage-4-commercial
          label: 'Stage 4: Commercial Contract (RaaS or CapEx)'
          actor: Operations and legal teams
          description: >-
            Successful pilots convert to multi-year RaaS or capex contracts. Toyota/Agility converted a 1-year pilot to
            a 7-unit commercial contract. Gecko/Navy committed to a 5-year IDIQ. Japan public-sector contracts involve
            competitive tender and multi-year approvals; total cycle from initial contact is typically 2–5 years.
          channels:
            - Formal tender / competitive procurement
            - Executive sign-off
            - SLA and maintenance contract
        - id: stage-5-expansion
          label: 'Stage 5: Fleet Expansion and Renewal'
          actor: C-suite / procurement leadership
          description: >-
            Validated deployments expand to additional sites, additional units, or new use cases. RaaS model enables
            gradual scaling without large capex events. No Genki customer has reached any stage of this journey.
          channels:
            - Renewal negotiations
            - New-site pilots
            - Multi-year fleet agreement
    claimRefs:
      - CU008
      - CU009
      - CU015
