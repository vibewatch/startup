            body: >-
              Genki Robotics presents zero verifiable customer proof as of June 2026. No procurement records, government
              tender announcements, customer case studies, named pilots, signed LOIs, or third-party reviews exist in
              any verified public source. The company has approximately 5 employees listed on LinkedIn — a team size
