            title: RaaS Model Reduces Adoption Friction but Requires Balance-Sheet Capacity
            body: >-
              Every successful humanoid deployment in the sector — Toyota/Agility, GXO/Agility, and the Gecko Navy
              contract — uses a service or IDIQ structure rather than outright hardware sales. This reduces the buyer's
              entry barrier but requires the vendor to carry robots on its balance sheet and absorb deployment costs.
              With $1B in funding confirmed, Genki has potential capital to support a RaaS model, but no product exists
              to lease and no deployment cost data has been disclosed. Investors should model the capital intensity of a
              RaaS go-to-market explicitly before committing.
            calloutType: insight
            claimRefs:
              - CU010
              - CU015
              - CU019
          - type: callout
            title: Adverse Expert Consensus on Humanoid Adoption Timeline
            body: >-
              At least three independent expert voices — Rodney Brooks (iRobot co-founder), Fady Saad (Cybernetix
              Ventures), and Nvidia's VP of AI Research — stated in 2025 that wide humanoid adoption is years away, with
              some citing more than a decade. The self-driving-cars comparison is particularly apt for Genki's
              public-safety mission: Waymo took ten-plus years from first funding to commercial deployment in limited
              geographies. Japan's institutional procurement adds further delay. This consensus does not invalidate
              Genki's long-term potential but materially compresses the probability of near-term customer revenue within
              a standard VC fund lifecycle.
            calloutType: risk
            claimRefs:
              - CU027
              - CU028
              - CU029
