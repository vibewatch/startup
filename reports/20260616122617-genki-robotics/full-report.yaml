      - number: '4.2'
        title: 'Capital Intensity and Burn: Pre-Revenue Humanoid Hardware Economics'
        blocks:
          - type: paragraph
            body: >-
              The capital intensity of humanoid robot development is among the highest in the venture-backed technology
              sector, combining hardware prototyping costs, specialized component procurement, AI compute for model
              training and iteration, and expert engineering labor. At Series A stage, the dominant cost category is
              engineering and R&D headcount: a 30–60 person deep-tech team in Japan or the US carrying robotics
              engineers, AI researchers, mechanical designers, and operations specialists will cost between USD 2
              million and USD 6 million per month in fully loaded compensation, before hardware and compute expenditure.


              Hardware prototyping is a material line item: early humanoid robot iterations require custom actuators,
              precision bearings, force sensors, compute modules, and integration labor that can cost between USD 25,000
              and USD 100,000 per prototype unit, with multiple iterations required before commercial-grade
              specifications are frozen. Goldman Sachs Research notes that some humanoid components still require
              high-precision grinding machines that are limited in supply, increasing early-phase unit costs
              significantly. Figure AI's Series C use-of-proceeds statement explicitly called out BotQ manufacturing
              facility buildout as a major capital allocation, signaling that manufacturing scale-up alone can consume
              hundreds of millions before meaningful revenue is generated.


              Agility Robotics' April 2024 layoffs — framed as a commercialization pivot — illustrate how the shift from
              R&D to commercial deployment can trigger cost restructuring and headcount rationalization. The lesson for
              Genki is that Series A capital must simultaneously fund remaining R&D completion and early commercial
              infrastructure buildout, with limited tolerance for inefficiency. Andy Rubin's prior venture Essential
              Products raised an estimated USD 330 million before shutting down in 2020, providing a cautionary
              precedent for high hardware capital consumption without achieving product-market fit at scale.
