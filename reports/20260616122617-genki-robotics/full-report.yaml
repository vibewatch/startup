      - number: '7.3'
        title: Technical Feasibility and Safety Risk
        blocks:
          - type: paragraph
            body: >-
              Genki is targeting "mission critical applications" in public safety, which is among the least forgiving
              deployment categories for a still-unproven humanoid platform. Independent criticism from Rodney Brooks and
              other robotics observers highlights the gap between investor enthusiasm and actual readiness: dexterity
              remains unsolved, full-sized bipedal robots carry disproportionate fall risk, and many commercial
              environments still cannot tolerate unsafe or unreliable behavior. Comparable industry evidence reinforces
              the point. Trade-show floors have displayed non-working prototypes, Agility had to refocus
              commercialization with layoffs, Figure invested in a dedicated safety center, and Tesla's own scale-up has
              missed ambitious unit targets. None of these examples prove that Genki will fail, but they show that even
              the best-capitalized peers are still resolving fundamental issues around stability, sensing, verification,
              and deployment economics. Because Genki has disclosed no safety testing, certification path, or
              third-party validation framework, residual product-liability exposure remains extremely high.
