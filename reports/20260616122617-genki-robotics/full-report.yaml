        title: Founder Reputational and Governance Overhang
        blocks:
          - type: paragraph
            body: >-
              Andy Rubin's personal history is the single most legible non-technical risk attached to Genki Robotics
              because it is already well documented, easy for counterparties to rediscover, and not diluted by other
              named executives or a visible board. TechCrunch's legal and news coverage records the misconduct
              allegations, the $90 million Google exit package, the 2018 employee walkout, the 2019 shareholder suit,
              and newly unsealed court allegations that kept Rubin in a recurring adverse-news cycle for years.
              Essential Products then provided a second cautionary data point: Rubin could attract capital and talent,
              yet still deliver weak sell-through, cancelled products, and a shutdown. Because Genki has not published
              governance commitments, independent director appointments, or a board charter, investors cannot yet point
              to any structural mitigation that separates this venture from Rubin's prior pattern. The result is a
              reputational discount that can impair fundraising, hiring, procurement diligence, and public-sector trust
              before Genki has demonstrated product value.
