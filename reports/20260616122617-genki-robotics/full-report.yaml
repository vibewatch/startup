      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Labor-shortage tailwind is structural and policy-backed — not cyclical
            body: >-
              Japan's workforce decline is not a cyclical dip; it is a 14-consecutive- year demographic trajectory
              confirmed by official statistics and projected to remove 15 million workers from the labor pool over the
              next 20 years. METI's formal 30% global physical-AI market-share target and NEDO's regional labor-shortage
              program are government endorsements of the urgency that convert private-sector hesitancy into co-funded
              pilot procurement. For Genki, this means the macro driver is both durable and institutionally validated —
              the single best foundation for a long-cycle enterprise sales model.
            calloutType: strength
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
              - CM006
              - CM007
          - type: callout
            title: Dexterity and safety constraints are real and unresolved — adverse expert consensus
            body: >-
              Rodney Brooks' detailed argument that today's humanoid robots cannot learn dexterity via current training
              approaches — and that walking robots are physically dangerous when shared with humans — is not fringe
              skepticism. Approximately 75% of robotics-sector professionals at Automate 2024 expressed skepticism about
              humanoid form factors. Self-driving-car analogies from multiple VCs suggest a 5–10 year gap between
              current demos and reliable commercial deployment. Genki's market is partly insulated from this constraint
              if its use cases are unmanned or limited-dexterity environments (nuclear sites, infrastructure
              inspection), but any use case requiring precision manipulation or human co-presence faces a documented and
              unresolved technical barrier.
            calloutType: risk
