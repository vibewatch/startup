        - label: Valuation Discipline
          value: 2 / 10
          subLabel: $1B for zero ARR is expensive; 100x+ implied multiple; disclose-or-discount
          status: gap
          claimRefs:
            - CV001
            - CV044
        - label: Evidence Quality
          value: 2 / 10
          subLabel: Press reports only; paywalled Axios scoop; PitchBook paywall; no primary source
          status: gap
          claimRefs:
            - CV005
            - CV043
        - label: Overall IC Score
          value: 3 / 10
          subLabel: TRACK — high long-horizon potential; insufficient proof to BUY
          status: partial
          claimRefs:
            - CV001
            - CV003
            - CV042
    approximationNotes: >-
      Scores are qualitative assessments on a 0–10 ordinal scale derived from the evidence base; they are not
      quantitatively derived and should be treated as directional IC signals rather than precise metrics. The Market
      Opportunity score reflects structural TAM, not Genki-specific opportunity validation.
