  - id: market-sizing-multiple-lenses
    title: Market sizing — global, Japan-national, and segment lenses
    body: >-
      No single published figure reliably captures Genki's addressable market.
      The most frequently cited figure — Goldman Sachs' projection of a $38
      billion global humanoid robot market by 2035 — is a credible directional
      anchor but a misleading SAM proxy: it encompasses industrial manufacturing
      applications (EV assembly, logistics) dominated by China and the U.S.,
      not Japan's specific demand for safety and maintenance service robots. IFR
      separates professional service robots as a distinct category and tracks
      global revenues annually, but has not published a Japan-specific service
      robot sub-market for humanoids; the 2024 World Robotics report tracks
      professional service robots by application (field, medical, inspection,
      logistics) rather than by country-segment combination at the resolution
      Genki needs.


      Three complementary lenses provide a cleaner sizing framework. Lens one is
      the global humanoid shipment trajectory: 13,317 units shipped in 2025
      (Omdia via Forbes), with TrendForce projecting over 50,000 units in 2026
      (700%+ YoY growth) and Omdia forecasting 2.6 million by 2035. Japan's
      share of this global base will be determined by policy, cost, and early
      deployments. Lens two is Japan's domestic robot market through JARA data:
      Japan manufactures approximately 70% of the global industrial robot supply
      (METI 2022 figure), but domestic deployment of service robots as a share
      of national production is not separately tracked by JARA at a humanoid
      level. Lens three is a bottom-up construction using labor-cost economics:
      Japan's labor shortage in critical-sector occupations (infrastructure
      inspection, disaster response, elder care) creates budget urgency
      measurable by workforce-gap size, not by robot market reports. Each lens
      gives a different number; the diligence gap is that these numbers have
      not yet been reconciled into a defensible Japan service-robot SAM.
