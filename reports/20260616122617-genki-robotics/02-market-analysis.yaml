  - id: FM004
    title: Adoption funnel — Japan service robot deployment pathway
    type: funnel
    layout: standard
    summary: >-
      Japan's institutional procurement model creates a staged funnel from labor
      crisis to contracted deployment; each stage is a gate that slows
      time-to-revenue but also validates the market.
    data:
      items:
        - label: "Stage 1: Structural labor shortage creates urgency"
          value: 14
          description: Japan's 14th consecutive year of population decline; working-age
            population projected to shrink by ~15M over 20 years; OECD 31% WAP decline to 2060
        - label: "Stage 2: Government policy activates procurement intent"
          value: 2040
          description: METI 30% global physical-AI target by 2040; NEDO RING Project (2025);
            autonomous delivery on public roads since 2023; FY2026 AI Robotics Strategy
        - label: "Stage 3: Institutional buyers issue 2–3 year pilot contracts"
          value: 2
          description: JAL-Haneda 2-year trial (May 2026 start); KyoHA mass-production
            target 2027; Spot-class robots already in public-safety pilots globally
        - label: "Stage 4: Pilot proves operational reliability and ROI"
          value: 6
          description: Minimum ~6 months operational data required; safety record;
            measurable labor substitution; cost-per-task vs. human alternative must close
        - label: "Stage 5: Full enterprise or fleet contract awarded"
          value: 5
          description: Typical 2–5 year full cycle from initial contact to contracted
            revenue in Japan public-sector procurement; multi-year service agreement
    approximationNotes: >-
      Funnel stages are inferred from comparable Japan procurement models (JAL trial,
      government grant structures, Gecko/Navy contract model) and are not derived
      from Genki-specific commercial disclosures.
