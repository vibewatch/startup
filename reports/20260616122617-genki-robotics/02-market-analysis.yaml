  - id: growth-drivers-and-adoption-constraints
    title: Growth drivers, adoption constraints, and contradictory estimates
    body: >-
      The structural case for Japan service robot adoption is unusually strong.
      Japan's total population fell for the 14th consecutive year in 2024, the
      working-age cohort is 59.6% of the total and shrinking, and the 65-plus
      cohort is already 29.3%. Japan's working-age population is projected to
      decline 31% by 2060 (OECD) and lose approximately 15 million workers over
      20 years. The 2024 Reuters/Nikkei survey found labor shortages — not
      efficiency — as the primary force pushing Japanese firms toward AI
      adoption. METI formalized this into national strategy: a 30% global
      physical-AI market share target by 2040, with autonomous delivery robots
      on public roads since April 2023 and a 2026 AI Robotics Strategy under
      formulation. NEDO's June 2025 RING Project directly targets regional labor
      shortages through robot deployment. Japan's Society 5.0 vision explicitly
      targets cyberspace-physical integration as a national strategic goal.


      Against these drivers, several constraints are material and well-evidenced.
      Rodney Brooks (iRobot co-founder, MIT) argues in a detailed essay that
      today's humanoid robots lack the dexterity required for real-world
      manipulation — human hands have approximately 17,000 touch receptors with
      no robotic equivalent — and that training approaches are "pure fantasy
      thinking." A full-sized walking humanoid carries eight times the harmful
      energy of a half-sized model, creating real safety risk in human-shared
      environments. Multiple robotics VCs told TechCrunch they expect wide
      humanoid adoption no sooner than several years out, with comparisons drawn
      to self-driving cars (early optimism, persistent technical gaps). These are
      not fringe views: roughly three-quarters of robotics-sector professionals
      at Automate 2024 identified as skeptical about humanoid form factors. The
      implication for Genki is that adoption will be fastest where the
      environment eliminates the safety-sharing problem (unmanned nuclear sites,
      disaster zones) and slowest where humanoids must work alongside people.
