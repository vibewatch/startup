      - - Public safety and disaster response robots
        - Mobile humanoid or bipedal platforms for search-and-rescue, nuclear
          decommissioning, CBRNE response, and EOD tasks
        - Fixed industrial arms; consumer robots; passive protective equipment
        - National and municipal government agencies; METI/NEDO grant-funded programs
        - Direct target vertical; highest willingness to pay for safety-critical
          capability; least price-sensitive buyers
      - - Infrastructure inspection and maintenance robots
        - Mobile platforms for bridge, tunnel, port, pipeline, and ship hull
          inspection; autonomous monitoring with digital-twin output
        - Stationary sensor arrays; traditional ROVs without AI; human inspection
          contractors
        - Infrastructure operators, utilities, port and airport authorities; national
          defense-adjacent bodies
        - Adjacent to disaster response; proven public-sector procurement path via
          Gecko/Navy model in comparable markets
      - - Aviation and logistics ground handling
        - Humanoid or mobile service robots for baggage loading, cabin cleaning,
          cargo sorting in high-labor-cost aviation environments
        - Air traffic control software; fixed conveyor automation; staff scheduling
          tools
        - Airlines and ground handlers; budget owned by operations and ground-services
          directors
        - Live Japan proof point via JAL-GMO trial at Haneda (May 2026); two-year
          pilot model is characteristic Japan procurement path
      - - Elder care and institutional care service robots
        - Mobility-assist, monitoring, and physical-support robots deployed in
          care facilities; reduces caregiver physical burden
        - Medical devices requiring clinical trials; pharma; facility construction
