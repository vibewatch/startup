  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: Japan service robot SAM
      missingEvidence: >-
        A Japan-specific independently published SAM for public safety, infrastructure
        inspection, and urban maintenance service robots, expressed in yen or USD, with
        methodology and vintage documented. No such estimate is available from JARA, IFR,
        TrendForce, or Goldman Sachs as of the 2026-06-16 run date.
      whyItMatters: >-
        Without a Japan service robot SAM, the market boundary section cannot be sized,
        making the SAM/SOM layer of the pyramid and the sizing lens table dependent on
        extrapolation from global figures that are manufacturing-skewed and may overstate
        Genki's actual addressable pool by an order of magnitude.
      diligencePath: >-
        Commission or source a Japan-specific service robot market study from JARA,
        Roland Berger, or a Japan-based industry analyst (e.g., Fuji Keizai, Yano Research)
        that disaggregates professional service robots from industrial arms and provides a
        Japan public-safety and maintenance sub-category estimate.
      relatedQuestionRefs:
        - QM026
        - QM013
        - QM027
      relatedTableRefs:
        - TM002
    - type: missing-source
      severity: material
      topic: Japan humanoid adoption adverse evidence
      missingEvidence: >-
        Documented cases of humanoid or service robot pilot cancellation, contract failure,
        or deployment reversal in Japan's public safety or infrastructure sectors; no such
        case was found in accessible sources as of June 2026.
      whyItMatters: >-
        The absence of adverse adoption evidence does not prove adoption is proceeding
        smoothly; it may reflect the early stage of the market or suppressed reporting.
        A diligence view that can only confirm positive deployments (JAL trial) without
        any failure data overstates confidence in near-term adoption rates.
      diligencePath: >-
        Search Japanese-language press (Nikkei, Asahi Shimbun) for cancelled robot pilots,
        cost overruns, or operator complaints in infrastructure inspection or public safety
        settings; interview procurement officials at METI or municipal disaster agencies.
      relatedQuestionRefs:
        - QM025
        - QM019
