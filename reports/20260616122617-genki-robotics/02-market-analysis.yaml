  - id: TM004
    title: Growth drivers and adoption constraints register
    columns:
      - Driver / constraint
      - Direction
      - Timing
      - Implication for Genki
      - Diligence ask
    rows:
      - - Japan's 14th consecutive year of population decline; 59.6% working-age share
        - Driver (structural)
        - Current; accelerating over 20-year horizon
        - Creates "industrial survival" urgency; buyers motivated by continuity, not
          just efficiency; highest willingness to pay when substitution is operationally
          unavoidable
        - Verify that Genki's target verticals (public safety, aviation) face the sharpest
          near-term vacancy rates, not just overall labor decline
      - - METI 30% global physical-AI market share target by 2040; RING Project; autonomous
          delivery road access since 2023
        - Driver (regulatory)
        - Active policy; AI Robotics Strategy to be formalized in FY2026
        - Government procurement intent and subsidy pipeline; NEDO grant access creates
          co-funding paths; reduces buyer risk perception
        - Confirm Genki's eligibility for METI/NEDO grants; map specific programs to
          its disaster-response and public safety positioning
      - - Japan's Society 5.0 and Moonshot R&D Program
        - Driver (regulatory)
        - Long-cycle (2021–2030s); Goals 1,2,3,6 continued as of Nov 2025
        - National strategic legitimacy for physical AI; potential academic collaboration
          and procurement pathways through JST and NEDO
        - Assess whether any Moonshot Goal specifically funds humanoid/service robot
          deployment in public safety settings
      - - Rodney Brooks dexterity critique; safety-in-shared-environments concerns;
          VC skepticism; ~75% industry-attendee skepticism at Automate 2024
        - Constraint (technical + perception)
        - Current; timeline to resolution unknown
        - Slows adoption in any setting where robot shares space with people; environments
          requiring fine manipulation will underperform near-term; investor due diligence
          will flag this
        - Test Genki's specific use cases against the dexterity requirement; document which
          tasks can be completed with current manipulation capability vs. which require advances
      - - Long Japan institutional pilot-before-purchase procurement cycle
        - Constraint (structural)
        - Current; endemic to Japanese public-sector procurement
        - 2-year trials (e.g. JAL-Haneda model) extend time-to-revenue; capital intensity
          rises before any recurring revenue; cash-burn risk
        - Map Genki's specific pilot agreements, timelines, and conversion rate expectations;
          stress-test runway against 2–3 year pilot-to-contract cadence
      - - Chinese humanoid manufacturers (Unitree, Agibot) dominating global shipments
          at lower cost; U.S. competitors (Boston Dynamics, Agility) scaling
        - Constraint (competitive)
        - Current; accelerating
        - Genki must justify Japan-native positioning vs. importing Chinese or U.S.
          platforms; may limit pricing power and defensibility if hardware becomes
          commodity
        - Assess whether Japan government procurement preferences or technology localization
          requirements create durable moat vs. foreign platforms
    notes: >-
      Drivers and constraints are drawn from public evidence dated 2025–2026.
      The dexterity and safety constraints are generic to humanoid robots, not
      Genki-specific; their materiality depends on Genki's exact use-case and
      product design choices, which are not yet publicly disclosed.
