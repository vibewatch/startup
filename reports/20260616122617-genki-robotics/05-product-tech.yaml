  title: Product & Technology
  summary: >-
    Genki Robotics operates in deliberate stealth with no disclosed product specifications,
    architecture documents, or deployment timelines; prototype development in Tokyo is confirmed
    but every architectural detail is inference-derived from competitor benchmarks and Japan's
    mission-critical context. Competitor evidence establishes the likely sensing stack (3D LiDAR
    plus depth cameras), compute approach (edge SoC with cloud AI), locomotion method
    (reinforcement-learning transfer from simulation), and mission-critical use-case pipeline
    (airports, logistics, care). The industry trend toward vertically integrated AI—illustrated
    by Figure AI, Boston Dynamics, and Neura Robotics—combined with Rubin's 2018 skepticism about
    unified robot platforms, suggests a purpose-built stack rather than third-party API integration.
    Critical diligence gaps include product form factor, AI stack, safety certifications, supply
    chain choices, and first deployment target.

sections:
  - id: product-posture-stealth
    title: Stealth Product Posture and Verified Facts
    body: >-
      Genki Robotics is a humanoid robot startup incorporated in Tokyo by Andy Rubin, co-creator of
      Android and former head of Google's robotics acquisition programme. The company is operating in
      deliberate stealth: it has no public website, no disclosed product specifications, no job
      postings, and has made no announcements about deployments or timelines as of mid-2026. Rubin
      confirmed the project to The Information but provided no technical detail beyond acknowledging
      prototype development. The company name—"Genki," meaning vibrant or healthy in Japanese—signals
      an intent for active, physically capable robots suited to real-world operation rather than
      laboratory demonstration. A LinkedIn presence confirms the company exists as a legal entity with
      an emerging team, but yields no engineering or product specifics. All product and technology
      analysis in this chapter is therefore inference-driven, constructed from verified competitor
      benchmarks, Japan's deployment context, and Rubin's documented history building humanoid
      robotics programmes at Google, where he oversaw the acquisition of Schaft and multiple other
      robotics firms between 2013 and 2014. Investors must treat every technical claim about Genki
      as an inference rather than a verified fact, and this chapter explicitly labels each finding
      as either verified or inferred.
