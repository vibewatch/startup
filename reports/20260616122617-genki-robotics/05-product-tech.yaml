  - id: japan-deployment-use-cases
    title: "Deployment Context: Japan Mission-Critical Use Cases"
    body: >-
      Japan provides Genki Robotics with the most compelling deployment context for a mission-critical
      humanoid. Japan Airlines began trialing humanoid robots at Tokyo Haneda airport in May 2026 for
      baggage loading and cabin cleaning, explicitly citing chronic labor shortages driven by the
      country's aging population. Japan's Ministry of Economy, Trade and Industry (METI) has stated a
      goal to capture 30% of the global physical AI market by 2040, and the government's Society 5.0
      vision explicitly integrates autonomous robotics as a response to demographic decline. Japan
      already holds approximately 70% of the global industrial robotics market by manufacturer share,
      giving a Tokyo-based startup deep domestic access to actuators, sensors, and precision
      mechanical components. Four mission-critical verticals dominate the near-term opportunity:
      airport and transport infrastructure operations (baggage handling, inspection, cabin cleaning),
      light logistics and warehouse order picking in brownfield facilities, care facility assistance
      where Japan faces its most acute workforce shortfall, and infrastructure maintenance and
      inspection in hazardous or difficult-access locations. Each vertical imposes distinct dexterity,
      reliability, and safety certification requirements that the product architecture must satisfy
      before deployment at scale. Japan's target of domestically mass-producing humanoid robots by
      2027 indicates that the government is actively creating conditions for first-mover deployment,
      with Genki Robotics well-positioned geographically and strategically to compete for that
      initial wave.
