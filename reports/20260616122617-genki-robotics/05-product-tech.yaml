  - id: critical-unknowns
    title: Critical Unknowns and Diligence Gaps
    body: >-
      The stealth operating posture that characterises Genki Robotics in mid-2026 is rational for
      protecting early-stage intellectual property—Tesla's 2025 lawsuit against a former Optimus
      engineer for theft of robotic hand sensor trade secrets illustrates the competitive stakes—but
      it creates a near-total evidence blackout for diligence purposes. No public information exists
      for Genki's target vertical, form-factor specification, AI stack provider, safety certification
      path, or manufacturing strategy. The developer community has no observable signal: no GitHub
      repositories, no public SDK, no job postings tied to specific technologies, no conference
      presentations or academic papers. LinkedIn confirms the company exists but reveals no technical
      team composition, engineering capability, or toolchain preferences. 1X's ongoing home trials
      and Hugging Face's open-source humanoid robot at USD 3,000 per unit indicate accelerating
      commoditisation pressure on hardware components that will affect all new entrants, including
      Genki. The critical investment question is not whether humanoid robots will achieve deployment
      in Japan—the labor shortage demand evidence is strong across airports, factories, and care
      settings—but whether Genki can achieve defensible technical differentiation and execute to
      first deployment at speed against well-capitalised incumbents with multi-year manufacturing
      and AI head starts.
