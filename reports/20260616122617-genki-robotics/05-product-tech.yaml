callouts:
  - calloutType: risk
    title: Stealth Mode Creates Near-Total Technical Diligence Blackout
    body: >-
      Genki Robotics' deliberate stealth posture means investors cannot verify any architectural
      claims. No product specification, safety certification, AI stack choice, or deployment
      commitment is publicly available as of June 2026. Every technical inference in this chapter
      is constructed from competitor benchmarks and Japan's deployment context—not from Genki's
      own disclosures. The absence of a developer surface (no GitHub, no SDK, no job postings
      tied to specific technologies) compounds the opaqueness: even indirect technical signals
      available for other stealth hardware startups are absent here.
    claimRefs:
      - CE001
      - CE004
      - CE042
      - CE045
  - calloutType: insight
    title: Japan's Labor-Shortage Crisis Is the Most Compelling Near-Term Deployment Driver
    body: >-
      Japan Airlines' May 2026 humanoid trial at Haneda, combined with METI's 2040 physical AI
      market share target and the government's Society 5.0 framework, confirms that Japan is
      creating both demand pull and policy support for humanoid deployment at speed. A Tokyo-based
      humanoid startup has structural advantages in regulatory engagement, supply chain access, and
      customer proximity that offshore competitors lack. This is Genki's most credible strategic
      differentiator—provided the product can achieve the safety certifications required for
      mission-critical environments.
    claimRefs:
      - CE019
      - CE020
      - CE021
      - CE022
      - CE023

