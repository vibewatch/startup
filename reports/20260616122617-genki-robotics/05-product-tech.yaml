figures:
  - id: FE001
    title: Inferred Humanoid Robot Technology Stack (Competitor-Benchmarked)
    type: stack
    layout: standard
    summary: >-
      Six-layer inferred architecture for a mission-critical humanoid robot, derived from
      convergent design choices across Boston Dynamics Atlas, Figure AI, Unitree H1/G1, and
      Sanctuary Phoenix. All layers are inferred for Genki Robotics; no confirmed architecture exists.
    data:
      layers:
        - label: Mission Orchestration and Fleet Management
          detail: >-
            Cloud-based fleet management (analogous to Boston Dynamics Orbit); OTA firmware
            updates; operator dashboards; integration with MES, WMS, and enterprise systems.
            No Genki implementation confirmed.
        - label: AI Foundation Model and Task Reasoning
          detail: >-
            Vision-language-action (VLA) model for scene understanding, natural language
            instruction processing, and task synthesis. Industry trend is toward in-house
            VLA (Figure Helix, Sanctuary Carbon) rather than third-party API. Genki model
            provider unknown.
        - label: Real-Time Motion Planning and Control
          detail: >-
            Reinforcement-learning-trained gait synthesis; inverse kinematics for manipulation;
            real-time safety collision avoidance. Training performed in simulation with sim-to-real
            transfer (Boston Dynamics RAI Institute approach).
        - label: Perception and Sensor Fusion
          detail: >-
            3D LiDAR plus stereo depth cameras providing 360-degree spatial awareness; IMU for
            balance; tactile sensors in hands for force feedback. Unitree H1/G1 and Atlas all
            use this sensor combination as standard.
        - label: Actuators, Joints, and Power System
          detail: >-
            Permanent magnet synchronous motors (PMSM) in joints; 23-43 DOF depending on
            configuration; knee torque 90-360 N.m; replaceable lithium battery (864 Wh in
            Unitree H1); self-swappable batteries demonstrated in Atlas.
        - label: Humanoid Physical Form Factor
          detail: >-
            Bipedal full-size humanoid body; estimated 35-80 kg weight range (Unitree G1 35 kg,
            Atlas ~80 kg); height 130-180 cm; designed for brownfield human-built environments
            without infrastructure modification.
    approximationNotes: >-
      All layers are inferred from competitor implementations; no Genki-specific architecture
      data is available. Layer details reflect industry consensus design for 2025-2026 commercial
      humanoids, not confirmed Genki choices.
    claimRefs:
      - CE010
      - CE011
      - CE012
      - CE013
      - CE015
      - CE018

  - id: FE002
    title: Humanoid Robot Customer Operating Workflow (Mission-Critical Deployment)
    type: flow
    layout: standard
    summary: >-
      Six-step operating workflow for a mission-critical humanoid robot deployment in Japan,
      based on publicly documented deployments at Japan Airlines Haneda and competitor workflows.
      Inferred as the likely Genki operational model; no confirmed deployment or workflow exists.
    data:
      nodes:
        - id: n1
          label: Mission Assignment
          detail: >-
            Operator assigns task via fleet management dashboard or enterprise system
            integration (e.g., WMS push for warehouse picking; ground ops system for
            airport baggage). Japan Airlines Haneda model (May 2026) uses ground ops system.
        - id: n2
          label: Autonomous Navigation to Work Area
          detail: >-
            Robot navigates from charging station to task zone using 3D LiDAR and depth
            cameras; obstacle avoidance and path planning using pre-mapped environment
            supplemented by real-time sensor data.
        - id: n3
          label: Scene Perception and Object Recognition
          detail: >-
            Vision-language-action model identifies target objects, worksite state, and
            human co-workers; collision avoidance zone activated; task execution plan
            formulated. ISO/TS 15066 compliance required for human proximity.
        - id: n4
          label: Task Execution
          detail: >-
            Robot performs assigned task (baggage load, shelf pick, cleaning, inspection);
            force-controlled manipulation; real-time error detection; human takeover
            protocol triggered on failure. Sanctuary Phoenix benchmarks task completion
            across 400+ tasks.
        - id: n5
          label: Failure Detection and Recovery
          detail: >-
            Onboard monitoring detects task failure, obstacle, or safety event; robot
            signals operator and safely pauses; remote teleoperation fallback available.
            Figure AI safety centre approach: software collision avoidance rather than caging.
        - id: n6
          label: Task Completion and Recharge Cycle
          detail: >-
            Task logged in fleet management; robot autonomously returns to charging station
            (Atlas self-swappable battery model); OTA firmware update applied overnight;
            performance metrics reported to operator. Operational cycle target 4-8 hours.
      edges:
        - from: n1
          to: n2
          label: dispatched
        - from: n2
          to: n3
          label: arrives at worksite
        - from: n3
          to: n4
          label: scene confirmed
        - from: n4
          to: n5
          label: monitors during execution
        - from: n5
          to: n4
          label: resumes after recovery
        - from: n4
          to: n6
          label: task complete
    claimRefs:
      - CE019
      - CE025
      - CE027
      - CE028

  - id: FE003
    title: Critical Supply Chain and Dependency Map
    type: dag
    layout: wide
    summary: >-
      Seven-node dependency graph for Genki Robotics, showing inferred upstream technology
      and supply chain dependencies and downstream demand drivers. All edges are inferred;
      no confirmed partnerships or supply relationships are public.
    data:
      nodes:
        - id: n1
          label: Semiconductor / Edge Compute Suppliers
          detail: >-
            Qualcomm (IQ10 series), Nvidia (Jetson class), or equivalent; foundational
            dependency for real-time motor control and edge AI inference. No Genki chip
            supplier confirmed.
        - id: n2
          label: LiDAR and Camera Sensor Suppliers
          detail: >-
            3D LiDAR (Luminar, Ouster, or equivalent), stereo depth cameras (Intel RealSense,
            ZED class); critical for perception stack. Japan has domestic precision optics
            industry. No Genki supplier confirmed.
        - id: n3
          label: Actuator and Motor Suppliers
          detail: >-
            PMSM joint motors, crossed roller bearings, harmonic drives; Unitree and other
            Japanese/Chinese suppliers established. Japan mechatronics ecosystem is a
            proximity advantage. No Genki supplier confirmed.
        - id: n4
          label: AI Foundation Model Provider
          detail: >-
            In-house VLA (Figure model, Sanctuary Carbon), or foundation model partner
            (Google DeepMind for Boston Dynamics; Qualcomm for Neura). Genki AI approach
            unknown; Rubin's 2018 platform skepticism suggests in-house preference.
