  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: product-unknowns
      missingEvidence: >-
        Genki Robotics product specifications: form factor, weight, height, DOF count,
        sensing stack, compute architecture, manipulation system, AI model provider,
        and target vertical.
      whyItMatters: >-
        Without any product specification, investors cannot assess technical feasibility,
        differentiation, time-to-market, or manufacturing cost. All architecture analysis
        in this chapter is inference from competitor benchmarks.
      diligencePath: >-
        Request technical data room access including prototype specifications, architecture
        documents, CAD files, sensor supplier list, compute BOM, and AI model roadmap.
      relatedQuestionRefs:
