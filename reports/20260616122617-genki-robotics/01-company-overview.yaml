  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: funding
      missingEvidence: Identity of the Series A lead investor and all co-investors; total capital raised in the round; cap table; governance terms and board composition
      whyItMatters: Without investor identities and governance terms, neither the valuation mechanism nor key-person risk mitigations can be evaluated; due diligence on conflicts of interest (e.g., Playground Global participation) is impossible
      diligencePath: Direct engagement with Genki Robotics or investor relations; request cap table and term sheet; search future SEC Form D or Japanese FCIA equivalent filings
      relatedQuestionRefs:
        - QO002
        - QO022
      relatedTableRefs:
        - TO003

    - type: private-evidence-only
      severity: material
      topic: product
      missingEvidence: Product specification, prototype status, technical approach, bill of materials, timeline to commercial launch
      whyItMatters: Without product details, commercial readiness, competitive differentiation, and capital efficiency cannot be assessed; stealth status may mask pre-revenue risks
      diligencePath: Direct management engagement; request technical deep-dive and prototype demonstration; monitor patent filings in Japan (JPO) and international equivalents
      relatedQuestionRefs:
        - QO019
      relatedTableRefs:
        - TO004

    - type: missing-source
      severity: material
      topic: leadership
      missingEvidence: Identity and background of all co-founders (other than Andy Rubin), board members, C-suite executives, and advisors
      whyItMatters: Single-founder dependency creates existential key-person risk; other co-founders may hold governance rights or IP; team depth determines execution credibility
      diligencePath: LinkedIn deep search for employees listing Genki Robotics; Japan corporate registry search by Rubin's name; direct founder engagement
      relatedQuestionRefs:
        - QO017
      relatedTableRefs:
        - TO002

    - type: private-evidence-only
      severity: material
      topic: funding
      missingEvidence: Total capital raised in Series A; pre-money versus post-money split; any secondary or debt instruments
      whyItMatters: Capital adequacy and runway cannot be estimated without round size; valuation-to-capital ratio determines burn rate risk
      diligencePath: Monitor SEC Form D filings (if any US investors participated); Japan EDINET or FCIA filings; direct investor reference check
      relatedQuestionRefs:
        - QO005
        - QO025

    - type: missing-source
      severity: material
      topic: revenue
      missingEvidence: Revenue, ARR, customer count, pilot agreements, or any traction metric
      whyItMatters: Unicorn valuation achieved at pre-revenue prototype stage; without traction metrics, the $1B valuation rests entirely on founder reputation and market thesis rather than commercial proof
      diligencePath: Management engagement; monitor job posting activity for commercial roles; watch for partner or customer announcements post-stealth
      relatedQuestionRefs:
        - QO020

    - type: missing-source
      severity: minor
      topic: corporate-registration
      missingEvidence: Genki Robotics' formal legal name and corporate registration number in Japan's National Tax Agency (NTA) houjin-bangou registry
      whyItMatters: Formal legal entity confirmation is required for any contractual or investment engagement; "Genki Robotics" may be a trade name
      diligencePath: Direct NTA houjin-bangou search using Rubin's name or company name variants; retain Japanese corporate registry service
      relatedQuestionRefs:
        - QO027
