callouts:
  - calloutType: risk
    title: Key-Person and Reputational Concentration in Andy Rubin
    body: >
      Genki Robotics is entirely synonymous with Andy Rubin in all public discourse. He is the sole named founder,
      the sole public spokesperson, and the individual whose relationships underpin the Tokyo headquarters choice
      and likely investor relationships. His documented history—a $90 million Google exit amid credible misconduct
      allegations, a subsequent shareholder lawsuit, additional court-disclosed personal allegations, and the
      collapse of Essential Products after $330 million raised—constitutes a multi-layer governance risk that any
      institutional investor or corporate partner must diligence explicitly. Structural mitigations such as board
      independence, investor protective provisions, and clearly defined succession plans are unverifiable from
      public sources.
    claimRefs:
      - CO021
      - CO023
      - CO027
      - CO028
      - CO029
      - CO042

  - calloutType: insight
    title: Stealth Status Limits All Diligence Dimensions
    body: >
      Genki Robotics has disclosed no products, no customers, no revenue, no exact headcount, no named investors,
      no board members, no job listings, and no public website. Every key metric in the Snapshot KPI table is
      either null or based on secondary press reporting. Diligence will require direct founder engagement and
      investor reference to close the largest gaps—round size, investor identity, product roadmap, and governance
      structure. The absence of a functional company website two years after founding is itself a notable signal
      in a space where most competitors actively recruit and communicate publicly.
    claimRefs:
      - CO004
      - CO010
      - CO011
      - CO040
      - CO041

