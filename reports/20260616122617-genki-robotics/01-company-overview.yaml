  - id: SO-milestones
    title: Milestones and Business Trajectory
    body: >
      Genki Robotics' visible history is short but sits within a broader biographical arc that is directly relevant
      to trajectory assessment. The formative background event is Rubin's 2013 leadership of Google's robotics
      acquisition wave, which included Schaft—a University of Tokyo humanoid robot spinout that had won the DARPA
      Robotics Challenge qualification trials before being purchased. That acquisition cemented Rubin's personal
      connections with Japanese academic robotics engineers and Japan's industrial hardware supply chain. His
      departure from Google in 2014 and the subsequent founding of Playground Global in 2015 kept him in close
      contact with early-stage hardware startups globally. Essential Products' failure in 2020 is the most relevant
      prior venture, demonstrating both Rubin's ability to attract large capital commitments and his track record of
      execution shortfall in a capital-intensive consumer hardware category. The founding of Genki Robotics in 2025
      and its rapid attainment of unicorn status within roughly one year reflects the current froth in the humanoid
      robotics investment category, where Japan's demographic labor shortage, METI's 30%-global-share-by-2040 target,
      and government Society 5.0 ambitions create a favorable policy backdrop. The milestone table provides the
      single chronology of record for this chapter.
