  - id: procurement-dynamics
    title: Japan's Enterprise Procurement Path and Adoption Funnel
    body: >-
      Japan's institutional procurement model creates a multi-year funnel from policy-driven urgency
      to contracted deployment. The JAL Haneda trial illustrates the typical structure: the airline
      framed it explicitly as a 2-year feasibility and risk assessment exercise, with no commercial
      commitment stated at launch. Agility Robotics' Toyota Motor Manufacturing Canada deal provides
      the clearest conversion benchmark in the humanoid sector: a one-year pilot followed by a
      commercial contract for 7 Digit robots on a RaaS (robots-as-a-service) model. Both GXO
      Logistics and Toyota adopted RaaS rather than outright purchase, deferring large upfront capital
      costs — a structure that lowers the buyer's barrier to entry but requires the vendor to carry
      the asset on its balance sheet. Japan's large industrial buyers are not passive: Toyota's Woven
      Capital launched an $800M second fund in September 2025 targeting Japan-based startups in
      industrial automation, and Toyota Invention Partners was established with approximately $670M
      to take long-term equity stakes in early-stage Japan-based companies without fixed fund
      periods — creating a pathway for strategic co-development relationships with robotics startups
      alongside commercial procurement. None of these funds has disclosed an investment in or
      commercial engagement with Genki Robotics. For public-safety buyers, procurement is
      additionally constrained by safety certification requirements, formal tender processes, and
      interoperability with existing emergency-response infrastructure. Boston Dynamics' Spot
      reached government customers in nuclear decommissioning, CBRNE, and EOD applications only
      after extensive field trials and integration with government workflows. The total cycle from
      vendor identification to contracted revenue in Japan's public sector is estimated at two to
      five years, making near-term customer proof from Genki structurally unlikely even if the
      product ships on schedule.
