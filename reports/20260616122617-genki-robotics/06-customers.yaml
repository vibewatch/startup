  - id: customer-proof-gap
    title: Why Genki's Customer Proof Is Still Missing
    body: >-
      Genki Robotics presents zero verifiable customer proof as of June 2026. No procurement records,
      government tender announcements, customer case studies, named pilots, signed LOIs, or
      third-party reviews exist in any verified public source. The company has approximately 5
      employees listed on LinkedIn — a team size that cannot simultaneously develop a product,
      navigate Japanese enterprise safety certification, and execute business development across
      multiple high-friction institutional procurement pipelines. The genkirobotics.com domain
      returns no content, and the company has made no public product announcement. This is not
      unusual for a company founded in early 2026 under stealth conditions, but it means the
      customer chapter is structurally empty. The absence of customer proof is compounded by
      structural evidence from the broader market. Fady Saad, a general partner at robotics-focused
      Cybernetix Ventures, told TechCrunch in October 2025 that beyond space applications he sees
      little current humanoid market and is "a little bit conservative and skeptical about the actual
      use case and the actual revenues." Nvidia's VP of AI Research compared humanoid development
      timelines to early self-driving cars in 2016, noting that "it still took them quite a few years
      to really scale, and even now no one really scaled to full autonomy." Rodney Brooks predicted
      in September 2025 that the humanoid robot investment bubble would burst, citing the impossibility
      of learning dexterity at scale from current training approaches. Multiple robotics VCs told
      TechCrunch they do not expect wide humanoid adoption for at least several years and potentially
      over a decade. Even Agility Robotics — the most commercially advanced humanoid company by
      deployed units — had to lay off staff and pivot its commercialization strategy in 2024 while
      actively managing Amazon's decision not to renew its pilot. Genki operates several years behind
      Agility's product maturity and has no established customer relationship as a starting point. The
      Japan market adds further friction: SoftBank Robotics, a well-resourced domestic player with
      decades of Japan market relationships, is already present in elder care and service automation,
      and Unitree hardware is already inside JAL's Haneda trial. Genki's first customer will require
      patience with a pre-product vendor, a long safety evaluation, and the risk of committing budget
      to an entity with no deployment track record and an unproven founder following Essential's
      failure. Investors should treat the absence of customer proof as the single highest-priority
      diligence item before close.
