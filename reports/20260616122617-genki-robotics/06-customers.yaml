figures:
  - id: FU001
    title: Customer Adoption Journey — From Urgency to Contracted Deployment
    type: journey-map
    layout: wide
    summary: >-
      Japan's institutional procurement model creates a five-stage journey from labor-shortage
      urgency to contracted fleet deployment; Genki Robotics has not entered any stage.
    data:
      items:
        - id: stage-1-urgency
          label: "Stage 1: Structural Labor Urgency"
          actor: "Executive / government policy team"
          description: >-
            Japan's 14th consecutive year of population decline, shrinking working-age population
            (59.6% of total), and 2024 overtime rules in construction all force institutional buyers
            to evaluate automation. Policy levers include METI 30% global share target, RING Project
            grants, and Society 5.0 mandate.
          channels:
            - "METI/NEDO grant announcements"
            - "Industry press coverage"
            - "Ministry policy directives"
        - id: stage-2-evaluation
          label: "Stage 2: Vendor Evaluation and RFI"
          actor: "Procurement officer / technical committee"
          description: >-
            Institutional buyers issue RFIs, attend trade shows, and conduct internal safety
            assessments. Japan's public-sector procurement requires formal vendor registration.
            The shortlist is typically limited to vendors with prior deployment evidence.
          channels:
            - "Trade exhibitions (IREX, CES Japan)"
            - "METI/NEDO vendor networking events"
            - "Direct vendor outreach"
        - id: stage-3-pilot
          label: "Stage 3: Pilot / PoC (6–24 months)"
          actor: "Site manager / safety officer"
          description: >-
            Standard Japan institutional pilot runs 6–24 months with defined KPIs. JAL's Haneda
            trial is 2 years. Government safety assessments and liability frameworks must be
            resolved before pilot commencement. Pilots funded by vendor, buyer capex, or NEDO grants.
          channels:
            - "Site integration team"
            - "Safety certification body"
            - "NEDO co-funding application"
        - id: stage-4-commercial
          label: "Stage 4: Commercial Contract (RaaS or CapEx)"
          actor: "Operations and legal teams"
          description: >-
            Successful pilots convert to multi-year RaaS or capex contracts. Toyota/Agility
            converted a 1-year pilot to a 7-unit commercial contract. Gecko/Navy committed to a
            5-year IDIQ. Japan public-sector contracts involve competitive tender and multi-year
            approvals; total cycle from initial contact is typically 2–5 years.
          channels:
            - "Formal tender / competitive procurement"
            - "Executive sign-off"
            - "SLA and maintenance contract"
        - id: stage-5-expansion
          label: "Stage 5: Fleet Expansion and Renewal"
          actor: "C-suite / procurement leadership"
          description: >-
            Validated deployments expand to additional sites, additional units, or new use cases.
            RaaS model enables gradual scaling without large capex events. No Genki customer has
            reached any stage of this journey.
          channels:
            - "Renewal negotiations"
            - "New-site pilots"
            - "Multi-year fleet agreement"
    claimRefs:
      - CU008
      - CU009
      - CU015

  - id: FU002
    title: Adoption Funnel — Discovery to Fleet Deployment in Japan
    type: funnel
    layout: standard
    summary: >-
      Each stage of the Japan adoption funnel reduces the addressable pool; Genki is not yet
      present at any stage and the total cycle is estimated at two to five years.
    data:
      items:
        - label: "1. Policy and labor-urgency alignment"
          value: 14
          description: >-
            Japan's 14th consecutive year of population decline; working-age population projected to
            shrink by ~15M over 20 years; 2024 overtime rules in construction; METI Society 5.0 mandate;
            RING Project (June 2025); 30% global physical-AI target by 2040.
        - label: "2. Government or enterprise buyer intent"
          value: 5
          description: >-
            Buyers issue RFIs or initiate vendor evaluation. Requires vendor registration with Japanese
            procurement authorities or direct C-suite sponsorship. Competition from Spot (BD), Unitree,
            GMO AI, and SoftBank Robotics narrows Genki's available window.
        - label: "3. Formal pilot / 2-year PoC"
          value: 2
          description: >-
            JAL Haneda trial is 2-year; KyoHA mass-production target 2027; Spot used in government
            CBRNE pilots globally. Safety risk assessments, liability frameworks, and insurance
            approvals must be complete before pilot launch. Genki has no pilot engagement.
        - label: "4. Pilot-to-commercial conversion"
          value: 1
          description: >-
            Toyota/Agility conversion after 1-year pilot illustrates fastest observed timeline.
            Amazon/Agility non-renewal illustrates the downside. Japan public-sector tenders add
            additional competitive bid stage. Conversion is the highest-friction stage.
        - label: "5. Fleet contract and expansion"
          value: 0
          description: >-
            Multi-year RaaS or capex fleet contract with defined uptime SLA, maintenance terms,
            and renewal clauses. No humanoid company has reached this stage in Japan as of June 2026.
            Gecko/Navy is the best analog in the defense/public-safety segment globally.
    approximationNotes: >-
      Values represent indicative years or stage weights, not absolute customer counts. Stage 1
      value is Japan's consecutive population-decline years. Stage 5 value is 0 because no Japan
      humanoid fleet contracts are confirmed as of run date.
