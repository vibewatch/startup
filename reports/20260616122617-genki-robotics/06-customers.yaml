  - id: adjacent-deployments
    title: Adjacent Deployments as Demand Validation
    body: >-
      Four external deployments provide the clearest demand validation for the type of customer
      Genki is targeting, and together they establish both the proof of concept and the competition
      Genki will face. Japan Airlines' partnership with GMO AI for a 2-year Haneda Airport trial is
      the most directly relevant Japan-market proof: aviation is a canonical labor-shortage
      environment, the buyer is an institutional enterprise, and the use case (baggage loading,
      cabin cleaning) matches precisely the kind of dull, dirty, and dangerous task that humanoid
      robots are suited to. However, Japan Airlines confirmed only that "feasibility studies and risk
      assessments" were ongoing, and the robot deployed was a Unitree H1 unit — not a Japanese
      domestic vendor product. Agility Robotics' multi-year commercial agreement with GXO Logistics
      (signed June 2024) at a Georgia Spanx fulfillment center was described by Agility's CEO as "the
      first humanoid robots deployed at a customer site, generating revenue and solving real-world
      business problems" — establishing the commercial benchmark for the sector. The subsequent Toyota
      Motor Manufacturing Canada deal for 7 Digit robots in February 2026 confirmed that the RaaS
      model scales beyond a single logistics pilot into automotive production environments, including
      in a Toyota subsidiary — Japan's most iconic industrial buyer. Gecko Robotics' 5-year, $54M
      IDIQ contract with the US Navy for ship hull inspection (18 Pacific Fleet vessels) provides the
      strongest public-sector procurement precedent: it demonstrates that government safety and defense
      buyers will commit multi-year, nine-figure contracts to robotic inspection in mission-critical
      environments once reliability is proven, albeit with non-humanoid crawling robots. Figure AI
      contributed its F.02 humanoid to production of 30,000 cars at BMW as of November 2025 and
      signed an agreement with Catalyst Brands in May 2026 to scale operations further, confirming
      that automotive and consumer-goods logistics are reachable markets for humanoids with the right
      product. Agility Robotics also signed a commercial agreement with Mercado Libre, Latin America's
      largest e-commerce operator, announced in December 2025, demonstrating that humanoid RaaS
      customer acquisition is diversifying geographically beyond North American manufacturers and into
      emerging-market logistics — a further signal of sector commercialization velocity. None of these
      deployments involves Genki. The adverse signal is equally important:
      Amazon ended its Agility Digit pilot without any announced next steps despite having invested in
      Agility's Series B, demonstrating that enterprise pilots — even with strategic investors — do
      not automatically convert to commercial agreements. Detailed post-deployment reporting from
      Figure AI confirms the depth of commitment required: the BMW Spartanburg deployment ran
      1,250+ operational hours, loaded 90,000+ sheet-metal parts, and contributed to 30,000+ X3
      vehicles over an 11-month program — validating that automotive production customers demand
      rigorous KPI compliance (cycle time, placement accuracy, zero-intervention targets) before
      treating humanoid deployment as production-grade. Agility Robotics' CEO Peggy Johnson has
      similarly described the workforce rationale from the customer's perspective: logistics jobs
      that "can't be filled" by humans — over one million open warehouse roles — create the pull
      demand for humanoid deployment, with customers valuing robots that can step into repetitive,
      dull roles without requiring organizational change management. Neither benchmark is reachable
      by Genki without a deployable product.
