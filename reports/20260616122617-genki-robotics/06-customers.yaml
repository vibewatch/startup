callouts:
  - calloutType: risk
    title: Zero Customer Proof is the Chapter's Central Finding
    body: >-
      Genki Robotics has no customers, no pilots, no LOIs, and no public procurement records as of
      June 2026. This is not unusual for a stealth-mode company founded in early 2026, but it is the
      dominant investment risk in this chapter. Every analog deployment — from JAL's 2-year trial to
      Agility's Toyota contract — involved a vendor with a working product and prior field experience.
      Genki has neither. Investors must require a verifiable first customer engagement (signed LOI or
      MOU with named party) as a gating condition before close, and must stress-test the procurement
      timeline against Japan's 2–5 year institutional cycle before underwriting near-term revenue.
    claimRefs:
      - CU025
      - CU026
      - CU033

  - calloutType: insight
    title: RaaS Model Reduces Adoption Friction but Requires Balance-Sheet Capacity
    body: >-
      Every successful humanoid deployment in the sector — Toyota/Agility, GXO/Agility, and the Gecko
      Navy contract — uses a service or IDIQ structure rather than outright hardware sales. This reduces
      the buyer's entry barrier but requires the vendor to carry robots on its balance sheet and absorb
      deployment costs. With $1B in funding confirmed, Genki has potential capital to support a RaaS
      model, but no product exists to lease and no deployment cost data has been disclosed. Investors
      should model the capital intensity of a RaaS go-to-market explicitly before committing.
    claimRefs:
      - CU010
      - CU015
      - CU019

  - calloutType: risk
    title: Adverse Expert Consensus on Humanoid Adoption Timeline
    body: >-
      At least three independent expert voices — Rodney Brooks (iRobot co-founder), Fady Saad
      (Cybernetix Ventures), and Nvidia's VP of AI Research — stated in 2025 that wide humanoid
      adoption is years away, with some citing more than a decade. The self-driving-cars comparison
      is particularly apt for Genki's public-safety mission: Waymo took ten-plus years from first
      funding to commercial deployment in limited geographies. Japan's institutional procurement
      adds further delay. This consensus does not invalidate Genki's long-term potential but
      materially compresses the probability of near-term customer revenue within a standard VC
      fund lifecycle.
    claimRefs:
      - CU027
      - CU028
      - CU029
      - CU030

