        - 用于搜救、核退役、CBRNE 响应和 EOD 任务的移动人形或双足平台
        - 固定工业机械臂；消费机器人；被动防护设备
        - 国家和市政政府机构；METI/NEDO 资助项目
        - 直接目标垂直；买方对安全关键能力付费意愿最高；价格敏感度最低
      - - 基础设施检查和维护机器人
        - 用于桥梁、隧道、港口、管道和船体检查的移动平台；带数字孪生输出的自主监测
        - 固定传感器阵列；不带 AI 的传统 ROV；人工检查承包商
        - 基础设施运营商、公用事业、港口和机场管理方；邻近国防的机构
        - 邻近灾害响应；可比市场的 Gecko/Navy 模式已经证明公共部门采购路径
      - - 航空和物流地面服务
        - 用于高人工成本航空环境中行李装载、客舱清洁、货物分拣的人形或移动服务机器人
        - 空管软件；固定传送带自动化；员工排班工具
        - 航空公司和地服商；预算由运营和地面服务负责人掌握
        - JAL-GMO 在 Haneda 的试验（2026 年 5 月）提供日本现场证明；两年试点模式是典型日本采购路径
      - - 养老和机构护理服务机器人
        - 部署在护理机构中的移动辅助、监测和物理支持机器人；降低护理人员体力负担
        - 需要临床试验的医疗器械；制药；设施建设
        - 护理机构、市政机构、厚生劳动省福利项目
        - 潜在大规模应用；TrendForce 预计这将是日本增长最快的人形机器人细分；不是 Genki 声明的初始重点，但具备战略邻近性
      - - 排除——工业制造自动化
        - EV 装配、拣放、焊接用固定和协作机械臂
        - （完全排除在 Genki 市场之外）
        - 工业 OEM；汽车一级和二级供应商
        - 排除在 Genki 可寻址市场之外；仅在全球人形机器人规模标题中作为市场背景比较有意义
