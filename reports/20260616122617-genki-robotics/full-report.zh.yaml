          detail: 早期全尺寸人形机器人原型估计 USD 25K–100K；执行器、计算、传感器、机架；宽区间反映原型与商业规格分化
        - id: assembly
          label: 组装与集成成本
          detail: Genki 未知；原型产量下通常为 BOM 的 50–100%；日本制造或合同组装；规模化后下降
        - id: deployment
          label: 部署与客户集成
          detail: 单站点集成劳力、安全验证、工作流适配；初始部署估计每客户 USD 20K–50K；未披露
        - id: service-revenue
          label: 单台年度服务收入（RaaS）
          detail: 同业参照：按 Agility 商业结构估算，每台机器人每年 USD 75K–150K（无确认标价）；Genki ASP 未知
        - id: gross-margin-unit
          label: 单台机器人的毛利率
          detail: 未知 / null；BOM、ASP 和服务成本披露前无法判断盈亏平衡；早期部署为负；转正路径需要披露假设
      edges:
        - from: bom
          to: assembly
          label: 汇入
        - from: assembly
          to: deployment
          label: 先于
        - from: deployment
          to: service-revenue
          label: 支撑
        - from: service-revenue
          to: gross-margin-unit
          label: 推动
    approximationNotes: BOM 和服务收入来自同业公司的行业估算；没有任何数值是 Genki 已确认数据。装配成本占比按原型机器人制造的行业常规推导。毛利率节点明确为 null，等待管理账披露。
