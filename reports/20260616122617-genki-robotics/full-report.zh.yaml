      - number: '3.2'
        title: 相邻、替代与新进入竞争对手
        blocks:
          - type: paragraph
            body: >-
              除主要人形机器人玩家外，Genki 还面对三类竞争：已经部署在其目标细分市场的专用巡检机器人、进入人形机器人领域的大型科技在位者，以及把规模优势扩展到足以商品化硬件层的中国制造商。


              Gecko Robotics 是 Genki 核心垂直领域中商业成熟度最高的替代方案。该公司制造用于检查大型工业资产——船舶、桥梁、工业储罐——的机器人和传感器，并于 2026 年 3 月与 US Navy
              签署五年期 IDIQ 合同，覆盖 US Pacific Fleet 的 18 艘舰船，首笔授予 $54 million，上限 $71 million。尽管 Gecko 的爬行机器人与 Genki
              隐含产品设计并不共享双足形态，但它们直接服务 Genki 瞄准的基础设施检查和公共资产维护用例。已经在解决桥梁或舰船检查问题的买方，可以参考已签署的 Gecko 合同工具；Genki
              要么必须接入类似采购框架，要么撬开既有关系。


              Tesla 的 Optimus 项目是全球最受关注的人形机器人努力，但仍聚焦内部使用且进度落后。截至 2025 年 7 月，Tesla 仅生产数百台，远低于其自设的全年 5,000
              台目标，明显落后于承诺。Musk 曾提出五年内年产 1 million 台的目标，但这一预测缺乏近期运营基础。Tesla 的封闭部署策略——自动化自家工厂——意味着它不是 Genki
              在公共安全垂直领域的直接渠道竞争对手；但如果 Optimus 性能提前改善，长期外部商业化仍是尾部风险。


              Meta 于 2026 年 5 月收购 Assured Robot Intelligence（ARI），把人形机器人基础模型能力纳入其 Superintelligence Labs 部门。ARI 联合创始人
              Xiaolong Wang（前 Nvidia 研究员）和 Lerrel Pinto（前 NYU 教授，曾共同创立一家后被 Amazon
              收购的人形机器人初创公司）专长于让机器人理解并适应复杂动态环境中的人类行为。Meta 的收购说明大型科技在位者正在为人形机器人打造自有 AI 技术栈，这可能加速机器人智能软件商品化，并削弱任何初创公司 AI
              差异化的防御力——如果 Genki 产品依赖外部基础模型，就会面对这一风险。


              德国人形机器人初创公司 Neura Robotics 于 2026 年 3 月与 Qualcomm 达成合作，在其人形机器人和通用机器人中使用 Dragonwing Robotics IQ10 处理器，并于
              2025 年 6 月推出 Neuraverse 仿真和训练平台。Neura 正从欧洲工业市场扩张，可能代表西方人形机器人竞争对手向日本的地理延伸，尤其考虑到 Qualcomm 在亚洲已有半导体分销关系。


              中国人形机器人行业整体——由 Agibot（2025 年出货 5,168 台，占全球份额 38.8%）和 UBTech（1,000
              台）领衔——拥有西方或日本制造商无法仅靠单价匹配的整体硬件供应链和成本结构。TechCrunch 援引中国政策专家的分析发现，2025 年中国制造商出货量约为美国竞争对手 Figure 和 Tesla 合计的
              36 倍；三大中国出货方（Agibot、Unitree、UBTech）占当年全球约 13,317 台人形机器人出货量的 78%。
