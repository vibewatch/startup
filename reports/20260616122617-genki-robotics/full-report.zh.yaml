        - 从劳动力短缺到 Genki 具体客户收入，中间是多年且未经证明的路径；Japan Airlines 使用的是 Unitree H1（中国），不是 Genki 硬件
      - - 行业估值动量
        - 仅 2026 年 4 月就有六家人形机器人独角兽；Figure AI 估值 $39B；Goldman Sachs 将 TAM 预测上调 4 倍；2025 年前 7 个月 VC 流入 $6B
        - Rodney Brooks 和 TechCrunch 报道指出泡沫风险；Figure 在 $39B 估值下只出货 150 台；估值倍数与收入脱节
      - - 日本硬件优势
        - 日本在执行器、传感器、运动控制上积累很深；TrendForce 认为日本在核心组件上最强
        - 美国 / 中国扩大全系统规模，日本仍停在组件层；Genki 必须在美国 / 中国领先的全栈竞争中，把硬件与 AI 整合起来
      - - 战略退出可选性
        - Meta 2026 年 5 月收购 ARI；Qualcomm/Neura 合作显示大型科技公司有胃口；Google DeepMind + Boston Dynamics 释放平台整合信号
        - 没有可工作的产品，就没有可收购性；当前阶段收购价大概率等于或低于 $1B 账面值
    notes: 反向逻辑证据来自独立媒体、专家评论（Rodney Brooks）和结构性市场数据，而非公司发布的沟通材料。投资逻辑证据来自第三方行业报道、分析师预测和可比融资数据；不存在任何对 Genki 具体支柱的确认。
