      - number: '1.4'
        title: 里程碑与业务轨迹
        blocks:
          - type: paragraph
            body: >
              Genki Robotics 可见历史很短，但嵌在一条更长的人物履历弧线中，这条弧线直接影响对其轨迹的判断。最关键的背景事件是 Rubin 在 2013 年主导 Google 机器人收购浪潮，其中包括
              Schaft——这家东京大学人形机器人衍生公司在被收购前赢得了 DARPA Robotics Challenge 资格赛。该收购巩固了 Rubin 与日本学术机器人工程师和日本工业硬件供应链的个人连接。Rubin
              于 2014 年离开 Google，2015 年随后创立 Playground Global，使他持续贴近全球早期硬件初创公司。Essential Products 于 2020
              年失败，是最直接可比的前次创业经历：它既证明 Rubin 有能力吸引大额资本承诺，也留下了其在资本密集型消费硬件品类执行短板的记录。Genki Robotics 于 2025
              年成立，并在约一年内快速取得独角兽地位，反映出当前人形机器人投资品类的泡沫热度；日本的人口结构性劳动力短缺、METI 到 2040 年取得 30% 全球份额的目标，以及政府 Society 5.0
              愿景，共同构成有利政策背景。本章的里程碑表提供唯一的正式时间线。
