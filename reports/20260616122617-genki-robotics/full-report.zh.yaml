      - number: '5.2'
        title: 推断的系统架构与技术栈
        blocks:
          - type: paragraph
            body: >-
              在没有披露架构的情况下，最稳妥的做法，是从领先商业人形机器人平台趋同的设计选择，以及日本任务关键型部署环境的物理约束中，推断 Genki 可能采用的技术栈。当前所有商业规模人形机器人都使用 3D LiDAR
              结合双目深度摄像头，实现 360 度空间感知；这不是差异化设计选择，而是在非结构化环境中安全双足导航的功能必要条件。Unitree H1 和 G1 平台都把 3D LiDAR 加深度摄像头作为标配，G1
              根据配置支持 23 至 43 个自由度。计算架构正在向边缘 SoC 平台收敛——Qualcomm 在 CES 2026 发布的 Dragonwing Robotics IQ10
              系列明确面向人形机器人和自主移动机器人设计——并辅以云端 AI 推理来处理基础模型查询。行业主趋势是纵向一体化 AI：Figure AI 终止与 OpenAI 的合作，转向自研
              vision-language-action（VLA）模型，理由是需要端到端掌控具身 AI；Boston Dynamics 与 Google DeepMind 合作，为 Atlas
              打造机器人基础模型；Qualcomm 则与 Neura Robotics 合作，把 IQ10 处理器嵌入参考设计。运动训练依赖仿真中的强化学习，再迁移到真实硬件；Boston Dynamics 与 RAI
              Institute 的合作代表了这一方法的商业前沿。考虑到 Rubin 2018 年曾公开怀疑单一统一机器人软件平台，Genki 最可能走定制栈，而不是接入商品化第三方 AI
              API。操控和灵巧手仍是最难解决的问题：Rodney Brooks 发表过详细论证，认为今天的人形机器人无法靠当前训练范式学会灵巧性；Tesla 2025 年围绕 Optimus
              手部传感器商业秘密提起的诉讼，也说明这个子系统竞争激烈、技术敏感。与此同时，端到端学习的 VLA 策略已经开始积累经验证据，显示其可泛化到家庭灵巧任务：Figure AI 的 Helix
              模型——一个单一神经网络——已经用同一核心架构展示了装洗碗机、整理整个客厅、两台机器人协同重置卧室等能力；每项新能力都纯靠新增数据获得，而非新算法。这说明可扩展的学习型操控可能成为非结构化环境灵巧性的主导架构。
