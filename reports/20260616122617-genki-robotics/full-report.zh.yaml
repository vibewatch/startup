  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户原型：谁购买、谁使用、谁付费
        blocks:
          - type: paragraph
            body: >-
              Genki Robotics
              公开使命是把人形机器人部署到日本的任务关键、公共安全和城市维护应用中；这对应六类可识别买方原型，每类都有不同的采购逻辑、预算权力和准备状态。负责灾害响应、城市救援和危险材料响应的国家及都道府县政府机构，与“公共安全”的匹配度最高：采购会经过国土交通省和灾害管理部门，也可从
              NEDO 与 METI 获得共同资金。日本政府 2021 年采纳的 Society 5.0 政策框架明确要求用机器人维持必要服务，应对劳动年龄人口收缩——这为政府渠道采购人形机器人提供了政策掩护。METI
              2025 年 6 月设立的 RING Project 进一步在机器人公司和面临劳动力短缺的地方政府之间搭建正式网络，构成采购赋能渠道。

              航空和交通运营商是近期最有实证支撑的相邻场景：Japan Airlines 2026 年 5 月在羽田机场启动为期 2 年的人形机器人试验，用于行李装载和客舱清洁，驱动因素是航空业长期缺人。Genki
              未参与该试验——试验由 GMO AI 与 Unitree 硬件合作完成——但该细分市场验证了买方紧迫性。日本建筑业也同样紧迫：2024 年 4
              月更严格加班规则生效后，建筑和基础设施领域劳动力短缺加剧，政府和私营承包商都在积极寻找危险检查和维护任务的自动化方案。公用事业和能源运营商在核与化工环境的远程检查上有类似需求——Boston Dynamics
              Spot 已在全球服务这一细分市场。医疗和长期护理（METI 在 2024 年 6 月将其列为机器人部署优先领域）以及通过 METI RING Project
              采购的城市服务运营商，构成其余客户原型。每个细分市场里，买方都是具备正式采购流程的机构，使用者是现场工人或护理专业人员，付款方则是企业资本预算、公共拨款或 RaaS 订阅合同。Genki
              尚未确认与任何客户原型细分市场发生接触。
