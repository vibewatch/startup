    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、总部与隐身状态
        blocks:
          - type: paragraph
            body: >
              Genki Robotics 是一家私营人形机器人公司，2025 年注册成立，总部位于日本东京都港区。公司由 Andy Rubin 共同创立；Rubin 最知名的身份是 Android 创造者之一，曾任
              Google
              高级副总裁。公司名称来自日语「genki」，意为「有活力」或「健康」，暗示其目标是打造能在真实环境中主动完成任务的机器人，而不是只能困在实验室里的系统。公司称其使命是打造「面向任务关键型应用的人形机器人」，Crunchbase
              将公共安全和城市维护列为其目标垂直领域。


              截至 2026 年 6 月，Genki Robotics 仍完全隐身。公司没有可用的公开官网：genkirobotics.com 域名显示已注册，但可能正在 Afternic
              域名市场待售；genki-robotics.com 无法使用；LinkedIn 公司页链接到 genki.com，但该网站并非 Genki Robotics
              资产。公司没有公开招聘、产品发布、新闻稿或客户披露。LinkedIn 公司页将其行业归为「Robotics Engineering」，列出总部位于东京都港区、公司规模 11–50 人、成立年份 2025
              年，并显示 5 个部分可见员工档案，其中 Jeff Kunins 是唯一具名可见员工。截至 2026 年 6 月访问日，该页面有 409 名关注者，说明公司公开存在感很低但可被观察到。Genki Robotics
              为私营公司，在日本或国际范围内未提交任何可公开获取的监管披露，不过日本国税厅法人番号企业登记库可能可用于确认基础法律身份。迄今，公司未出现在任何日本政府实验室合作伙伴名单或 METI 计划公告中。
