      - number: '5.5'
        title: 作为推断锚点的竞争对手技术基准
        blocks:
          - type: paragraph
            body: >-
              竞争对手硬件规格提供了最清晰的证据基础，可用来判断一台商业可行的人形机器人必须交付什么。Unitree H1 行走速度达到 3.3 m/s，搭载 864 Wh 电池，并配备 3D LiDAR
              加深度摄像头传感，单价约 USD 20,000，设定了具成本竞争力的硬件地板。Boston Dynamics Atlas 瞬时负载 50 kg（持续负载 30 kg），单次电池充电可运行 4 小时，并通过
              Orbit 车队管理平台接入企业系统，连接 MES、WMS 及其他记录系统。Sanctuary AI 第七代 Phoenix 可在不到 24 小时训练后自动化新任务，并已在 15 个行业验证超过 400
              项客户定义任务，设定了 AI 通用性基准。Figure AI 的 F.02 机器人在 BMW Plant Spartanburg 完成了 11 个月部署，周一至周五跑 10 小时班次，累计运行超过 1,250
              小时，在 5 毫米放置公差内装载超过 90,000 件钣金件；之后 Figure 退役 F.02，转向 F.03 和 Helix VLA
              模型驱动的消费者家庭部署。这一有记录的工业到家庭战略转向，凸显垂直领域选择是人形机器人公司的核心且可修正变量。Agility Robotics 的 Digit 提供了另一个基准：Digit
              专门面向人类建成空间设计——仓库通道、门口和按人类尺度设计的货架——并瞄准仅美国就约一百万个未填补物流岗位；Agility 公开完整技术规格，覆盖尺寸、载荷、电池续航和传感。Unitree 2024
              年人形机器人出货量约为美国对手的 36 倍，说明高产量、低成本平台可以主导早期市场销量，而高端进入者则聚焦能力。Physical AI 和人形机器人成为 CES 2026 核心主题，Nvidia、Boston
              Dynamics 等公司的发布显示行业势能正在加速；Genki 必须在这一背景下清楚定位自身差异化。CES 2026 也确认，随着基础模型合作伙伴关系加速整合，建立独特定位的窗口正在迅速收窄。
