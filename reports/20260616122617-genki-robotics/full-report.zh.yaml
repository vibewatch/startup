      items:
        - label: 阶段 1：结构性劳动力短缺制造紧迫感
          value: 14
          description: 日本人口连续第 14 年下降；劳动年龄人口预计 20 年内减少约 15M；OECD 预测到 2060 年 WAP 下降 31%
        - label: 阶段 2：政府政策激活采购意图
          value: 2040
          description: METI 到 2040 年拿下全球物理 AI 30% 的目标；NEDO RING Project（2025）；2023 年起公路自动配送；FY2026 AI Robotics Strategy
        - label: 阶段 3：机构买方发出 2–3 年试点合同
          value: 2
          description: JAL-Haneda 2 年试验（2026 年 5 月启动）；KyoHA 量产目标 2027；Spot 级机器人已在全球公共安全试点中使用
        - label: 阶段 4：试点证明运营可靠性和 ROI
          value: 6
          description: 至少需要约 6 个月运营数据；安全记录；可衡量的劳动力替代；单位任务成本必须接近人工替代方案
        - label: 阶段 5：授予完整企业或机队合同
          value: 5
          description: 日本公共部门采购通常从初次接触到签约收入需要 2–5 年完整周期；多年期服务协议
    approximationNotes: 漏斗阶段由可比日本采购模式推断（JAL 试验、政府补助结构、Gecko / Navy 合同模式），并非来自 Genki 特定商业披露。
