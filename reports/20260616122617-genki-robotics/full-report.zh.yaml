      - number: '7.2'
        title: 隐身执行与披露风险
        blocks:
          - type: paragraph
            body: >-
              Genki 完全隐身，把普通创业不确定性升级为一阶尽调风险，因为公司已经按独角兽定价时，几乎所有运营问题仍没有答案。截至 2026 年 6 月，官方域名解析到空白跳转页，公共网站等于缺席，LinkedIn
              只显示少数可见员工，客户、原型、安全架构或管理层披露均未发布。这意味着外部投资人无法判断，隐身究竟是战略纪律，还是技术与组织进展太薄、经不起公开审视。该模式也类似拖累 Essential
              的“不可见进展”问题：资本早已到位，商业验证却迟迟没有达成。没有具名技术负责人、制造伙伴或首次公开演示路线图，每沉默一个月都会加剧交易对手怀疑，并提高由负面媒体解读先行定义叙事的概率。
