  - id: TV005
    title: 最终尽调问题 — Genki Robotics 估值
    columns:
      - 触发项
      - 阈值 / 事件
      - 对投资判断的传导
      - 行动含义
    rows:
      - - 未展示原型机
        - Series A 后 18 个月（截至 2027 年 10 月）仍没有公开或 NDA 保护下的硬件演示
        - 证实产品风险已到生死线；$1B 估值判断塌缩为接近零的期权价值
        - 阻止后续投资；启动减记流程；直接与 Rubin 沟通时间表
      - - 创始人离任或治理疑虑
        - Andy Rubin 卸任 CEO，或出现运营层面疑问（参照 Essential Products 治理）
        - 单一核心投资支柱被抽掉；履历溢价消失
        - 立即重估；任何新资金投入前先谈妥治理保护
      - - 板块估值压缩
        - Figure AI 下轮估值下调，或公开市场人形机器人可比公司（若 IPO）交易估值低于 $15B；或 Goldman Sachs 撤回 TAM 上调
        - 可比估值倍数收缩；相对新的板块天花板，Genki 以 $1B 入场变贵
        - 重新谈入场条件或拒绝后续投资；设定滞后可比公司触发器
      - - 中国成本冲击进入日本
        - Agibot 或 Unitree 年出货量超过 50,000 台，且日本公共采购开始偏向 ASP 低于 $15,000 的中国方案
        - Genki 在日本的溢价定位被侵蚀；任务关键应用的 ASP 天花板被压低
        - 要求拿出 IP 或软件差异化证据，证明相对中国硬件的溢价合理
      - - 日本监管延迟
        - METI 安全认证或公共安全采购周期较首个试点 LOI 延长 > 30 个月
        - 市场进入时间线拉长；资金需求增加；收入到来前先暴露跑道风险
        - 上调烧钱估计；下调入场估值；要求带治理权的过桥资金承诺
    notes: 阈值是基于同行商业化时间表和行业数据得出的分析估计，并非合同契约。触发项应写入任何 Series A 或后续融资条款清单，作为监测权或估值调整机制。
