  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 创始人声誉与治理拖累
        blocks:
          - type: paragraph
            body: >-
              Andy Rubin 的个人历史，是 Genki Robotics 身上最容易被读懂的非技术风险：它已有充分记录，交易对手很容易重新发现，而且没有其他具名高管或可见董事会来稀释影响。TechCrunch
              的法律和新闻报道记录了不当行为指控、$90 million Google 离职补偿、2018 年员工罢工、2019 年股东诉讼，以及新解封法庭指控；这些事件让 Rubin
              多年反复陷入负面新闻循环。Essential Products 又提供了第二个警示样本：Rubin 能吸引资本和人才，却仍交出低销售、产品取消和公司关停的结果。Genki
              尚未公布治理承诺、独立董事任命或董事会章程，投资人目前无法指向任何结构性缓释措施，把这次创业与 Rubin 过去模式切开。结果是声誉折价可能在 Genki
              证明产品价值前，就损害融资、招聘、采购尽调和公共部门信任。
