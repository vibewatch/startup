  - id: TU005
    title: 扩张与集中风险
    columns:
      - 驱动因素 / 风险
      - 性质
      - 影响
      - 尽调路径
    rows:
      - - 政府渠道集中
        - 如果 METI/NEDO 补助项目是近期唯一采购路径，Genki 将完全依赖政府预算周期和政策连续性
        - 有利于早期试点资金；官僚摩擦高、规模化慢；单一渠道集中风险
        - 确认 Genki 是否已申请 METI RING Project、NEDO 补贴项目或任何公共部门 RFI
      - - 劳动力短缺紧迫性（航空、建筑、公用事业）
        - 买方紧迫感真实存在，但在位者（JAL 的 Unitree、公用事业的 BD Spot、航空的 GMO AI）已在试验；Genki 没有可部署产品
        - 紧迫性可能带来早期对话，但没有可部署产品，Genki 无法转化
        - 确认与具名企业账户签署的 LOI 或 MOU；确认产品交付时间线能对上买方试点窗口
      - - 竞争对手卡位先发账户
        - JAL 使用 Unitree；政府 CBRNE 使用 BD Spot；BMW 使用 Figure AI；试验合同可能包含排他或优先供应商条款
        - 关键早期账户可能在两到五年内因合同原因无法向 Genki 开放
        - 核实现有试验和部署合同是否为在位供应商设置排他或优先供应商条款
      - - 无具名客户或 LOI（产品未出阶段集中风险）
        - 首个签约客户会控制产品方向，并在收入上形成隐性单一客户集中，占 100%
        - 产品未出时签下任何客户交易，都可能把路线图锁进一个买方需求；之后转向代价高
        - 投资交割前，要求披露任何已签 term sheet、LOI 或 MOU，以及买方使用场景规格
      - - 关键人物集中（Andy Rubin，5 人团队）
        - 业务开发、伙伴准入和产品方向都流经创始人；团队没有独立 BD 能力
        - 创始人声誉风险（Essential 失败、过往治理问题）可能让机构采购负责人却步
        - 确认业务开发团队深度；索取潜在客户对话管线及对方层级
    notes: 本表所有风险都是结构性风险——Genki 尚未签下任何客户，因此无法形成实际集中度指标。集中风险只有在首笔收入之后才会变成约束。 竞争对手卡位风险是当前最可执行的尽调事项。
