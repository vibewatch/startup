              Genki 已经背负 $1 billion 入场估值，但没有披露任何产品、客户或收入基础；这会大幅压缩未来融资的容错空间。人形机器人同业展示了下一步会有多烧钱：Figure
              需要数十亿美元级融资，仍面临商业化审视；Agility 即便是品类领导者，也不得不收紧运营；Tesla 继续错过自定规模目标。同时，Goldman Sachs 的 2035 年 $38 billion
              人形机器人市场预测描绘了巨大未来奖池，但它依赖成本、灵巧性和电池性能突破，而行业尚未证明这些突破已经发生。如果 Genki 真实烧钱速度接近典型 30-60 人深科技硬件团队，那么规模温和的 Series A
              可能只留下不到两年跑道，就要迎来高风险 Series B。该融资事件将发生在一个基准估值偏投机的市场中；投资人会越来越要求原型、试点或可信采购势能，而不是只看创始人神秘感。
