      - number: '7.4'
        title: 监管、法律与采购风险
        blocks:
          - type: paragraph
            body: >-
              一家想进入日本公共安全工作流的人形机器人创业公司，同时继承法律 / 治理尽调负担和漫长公共采购时间线。治理层面，Rubin 未决诉讼状态以及 Genki
              专属合规计划缺失，留下围绕声誉筛查的活尽调缺口。运营层面，日本政策环境方向上支持但并非无摩擦：METI 和内阁府已把机器人和 Society 5.0
              优先级抬高，但共享空间服务机器人安全标准仍在演进，任务关键型人形机器人责任标准仍未定型。因此，Genki
              不能因为人口需求真实存在，就绕过认证、机构沟通或试点证据。公共部门和基础设施买方很可能要求多机构审批、演示和风险分配文件，采购订单才会出现。风险不是日本对机器人缺乏兴趣，而是 Genki
              可能需要多年监管和采购工作，才能把目标市场变成可入账收入。
