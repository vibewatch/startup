  - id: FI001
    title: 收入模型桥 — 客户活动如何转化为 Genki 毛利
    type: flow
    layout: standard
    summary: 从任务关键需求，经采购、收入事件到毛利实现的假设收入转化路径；所有中间节点均从同行结构推断，并非 Genki 已确认披露。
    data:
      nodes:
        - id: demand
          label: 任务关键需求触发
          detail: 政府或企业需求：公共安全事件、基础设施巡检要求或城市维护项目；日本劳动力短缺制造紧迫感
        - id: procurement
          label: 采购或合同事件
          detail: 政府 RFP 中标、企业试点协议或直接谈判；日本机构采购通常要求多年试点后才给商业承诺
        - id: revenue-event
          label: 收入确认事件
          detail: 硬件交付（一次性 ASP）或 RaaS 周期开启（经常性）；Genki 未披露收入时点和政策；同行两种机制都在用
        - id: service-cost
          label: 服务交付成本
          detail: 集成劳力、现场支持、软件更新、备件和可靠性保证；这是抵消总收入的一层重大未知成本
        - id: gross-profit
          label: 毛利实现
          detail: 收入减去 BOM、组装、服务交付和集成开销；Genki 未知；原型产量下为负，转正需要规模
        - id: gap-node
          label: 财务可见性缺口
          detail: ASP、BOM、服务成本或毛利率数据均无公开信息；任何可信毛利建模前都必须做完整尽调
      edges:
        - from: demand
          to: procurement
          label: 触发
        - from: procurement
          to: revenue-event
          label: 解锁
        - from: revenue-event
          to: service-cost
          label: 被抵消
        - from: service-cost
          to: gross-profit
          label: 产出
        - from: gross-profit
          to: gap-node
          label: 当前受阻于
    approximationNotes: 除需求触发外，所有节点均由 Agility RaaS 和同行硬件销售结构推断；链条中任何一步都没有 Genki 特定确认。
    claimRefs:
      - CI035
      - CI036
      - CI041
  - id: FI002
    title: 单位经济桥 — 任务关键人形机器人 RaaS 模型的同行推导输入
    type: flow
    layout: standard
    summary: 从硬件 BOM 到部署再到年度服务收入的单位经济路径；所有数值均为同行估计或 Genki 空值；毛利节点明确未知。
