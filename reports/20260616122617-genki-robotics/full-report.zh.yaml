              在所有公开讨论中，Genki Robotics 几乎等同于 Andy
              Rubin。他是唯一具名创始人、唯一公开发声者，也是其关系网络支撑东京总部选择和潜在投资人关系的人。他有明确记录的历史——在可信不当行为指控中获得 $90 million Google
