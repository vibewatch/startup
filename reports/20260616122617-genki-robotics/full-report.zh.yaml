      - number: '1.3'
        title: 融资、估值与投资人图谱
        blocks:
          - type: paragraph
            body: >
              Genki Robotics 于 2026 年 4 月跻身独角兽。2026 年 4 月 21 日，Axios Pro 报道公司获得 $1 billion 估值，标题为「Scoop: Android creator
              Andy Rubin's humanoid robotics company gets $1b valuation」。Crunchbase News 在其 2026 年 4 月独角兽追踪中予以佐证，将 Genki
              Robotics 列为一家「1-year-old」的东京人形机器人公司，称其完成一轮 Series A led round，估值 $1 billion。该轮融资使 Genki Robotics 成为 2026 年
              4 月登上独角兽榜的 6 家人形机器人公司中唯一的日本代表；其余 5 家全部位于中国。


              截至 2026 年 6 月，Series A 总融资额、领投方身份以及任何共同投资人名单均未公开披露。Genki Robotics 或任何投资人都未发布新闻稿确认融资细节。Playground Global 由
              Rubin 共同创立，深耕深科技硬件，且与 Rubin 存在联合创始人关系，因此自然可能参与该轮，但任何可获取来源都未确认或否认其参与。PitchBook 列有 Genki Robotics 档案，但页面被
              JavaScript 墙挡住；Crunchbase 直接组织页面返回 403，限制了对融资细节的数据库验证。治理细节——董事会构成、投票权以及任何保护性条款的性质——全部未披露。
