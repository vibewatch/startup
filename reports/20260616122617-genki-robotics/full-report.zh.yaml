      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 劳动力短缺是结构性且有政策背书的顺风，不是周期性波动
            body: >-
              日本劳动力萎缩不是周期性下探，而是官方统计确认的连续 14 年人口轨迹，预计未来 20 年将从劳动力池中移走 15 million 人。METI 正式提出全球 physical-AI 市场 30%
              份额目标，NEDO 也推出区域劳动力短缺项目；政府以此确认紧迫性，并把私营部门犹豫转化为共同出资的试点采购。对 Genki 而言，这意味着宏观驱动既持久，又得到制度验证——这是长周期企业销售模型最好的单一基础。
            calloutType: strength
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
              - CM006
              - CM007
          - type: callout
            title: 灵巧性与安全约束真实且未解决——专家共识偏反向
            body: >-
              Rodney Brooks 详细论证，今天的人形机器人无法靠当前训练路径学会灵巧操作，而且行走机器人与人共享空间时具有物理危险；这不是边缘怀疑。Automate 2024 上约 75%
              机器人行业专业人士对人形形态表示怀疑。多位 VC 用自动驾驶类比，暗示当前演示到可靠商业部署之间仍有 5–10 年缺口。若 Genki
              的用例是无人环境或低灵巧需求环境（核设施、基础设施检查），其市场可部分避开该约束；但任何需要精密操作或人机共处的用例，都面对已被记录且尚未解决的技术障碍。
            calloutType: risk
            claimRefs:
              - CM031
              - CM032
