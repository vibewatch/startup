  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Genki Robotics
              的相关市场不是「全球所有人形机器人」。这种框架会放大机会，也会遮蔽真实采购路径。更连贯的市场边界，应从日本对移动服务机器人的需求出发——具体是部署在危险、体力要求高或劳动力严重受限环境中的设备；在这些环境里，既有人力或机械替代方案要么不安全，要么不可得，要么经济上不可行。该范围覆盖三大垂直领域：公共安全与灾害响应（搜救、核退役、CBRNE
              与 EOD 检查）；城市基础设施维护与工业巡检（桥梁、隧道、公用事业、港口、机场地面保障）；以及养老护理和行动辅助与护理人员短缺交汇的机构护理环境。


              纳入支出包括可在复杂建成环境中远程操作或自主导航的移动机器人平台资本与服务预算——硬件、集成、软件和托管服务合同。排除支出包括传统固定式工业机械臂（非移动、非服务导向）、没有专业用途的消费陪伴机器人，以及通用
              ERP 或仓储自动化软件。现状替代方案包括人力、传统远程操作巡检车辆（用于管道 / 桥梁检查的 ROV 和爬行器），以及外包危险作业承包商。Genki
              一开始竞争的不是其他人形机器人初创公司，而是这些既有方案，以及「继续手工干」的默认选择。


              这个边界会影响市场规模测算：日本工业机器人基数由固定臂生产设备主导；JARA 统计将其与服务机器人和移动机器人混在一起。Genki 直接可服务的支出位于 IFR
              定义的更小专业服务机器人类别中，还要进一步收窄到日本子集，再进一步收窄到安全关键或维护密集垂直领域中具备移动能力的平台。
