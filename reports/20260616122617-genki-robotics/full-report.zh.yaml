      - number: '4.6'
        title: 财务不透明、反向信号与尽调阻塞项
        blocks:
          - type: paragraph
            body: >-
              Genki Robotics
              呈现出机构级投资标的所允许的最不透明财务画像：没有收入、没有定价、没有客户、没有可用官网，也没有可公开识别的财务负责人。在竞争激烈的深科技环境里，隐身姿态有商业合理性，但它制造了根本性的尽调问题。收入质量、毛利率、CAC
              回本、现金状况、债务安排等所有标准财务关口，都被披露缺失卡住。尚未确认存在 venture debt、可转债、项目融资或非股权义务，但没有披露并不等于没有义务。


              两类反向证据进一步放大了不透明问题。第一类是赛道结构性证据：Figure AI CEO 在 Bloomberg Tech（2025 年 6 月）拒绝确认 BMW
              关系的商业价值还是试点属性，说明即便是本赛道融资最充足的西方创业公司，也尚未形成公开可辩护的单位经济。Figure AI 还在 2025
              年向二级市场经纪商发出停止侵权函，阻断二级市场价格发现，暗示二级市场价格可能正在向低于一级轮估值的水平收敛。第二类是技术怀疑论：iRobot 联合创始人、MIT 学者 Rodney Brooks
              认为当前人形机器人训练方法不足以支撑商业级灵巧性，并把当前 VC 配置描述为在融资泡沫；TechCrunch
              放大了这一观点，称人形机器人赛道“注定破裂”。如果灵巧性瓶颈真实存在，产生收入的部署时间线会显著拉长，跨越这一缺口所需资本也会同步倍增。


              Rubin 在 Essential Products 的记录——估计耗用 USD 330 million 后关停——说明创始人声誉和投资人品牌是硬件成功的必要但不充分条件。2025
              年前七个月，投资人就向机器人赛道投入 USD $6 billion，而人形机器人层面没有任何已确认的正毛利；这代表高度集中的投机敞口。对 Genki
              做财务尽调，必须独立验证原型里程碑，审阅至少六个月的管理账，并直接确认 Series A 资本结构；否则无法负责任地形成投资判断。
