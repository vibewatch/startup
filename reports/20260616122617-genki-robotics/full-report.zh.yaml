          - type: callout
            title: 市场边界逻辑是关键尽调门槛——通用 TAM 会误导
            body: >-
              Goldman Sachs 的 $38B 全球数字是真实的，但描述的是由制造业主导、受中国和美国推动的市场。把它套到 Genki 的日本公共安全场景，会把可服务机会至少放大一个数量级。正确框架应是基于 Genki
              具体目标垂直领域劳动力短缺经济学，自下而上构建日本服务机器人 SAM；这个数字还没有任何分析师独立发布。在该 SAM 被妥善划定之前，买方和卖方的市场叙事都带有投机性。
