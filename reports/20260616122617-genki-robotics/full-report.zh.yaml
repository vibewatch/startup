      - number: '4.2'
        title: 资本强度与烧钱：收入前人形机器人硬件经济学
        blocks:
          - type: paragraph
            body: >-
              人形机器人开发的资本强度位居风投支持科技行业最高区间，叠加硬件原型成本、专用部件采购、用于模型训练和迭代的 AI 算力，以及专家工程劳动力。Series A 阶段，主导成本类别是工程和 R&D
              人员：一支位于日本或美国、30–60 人的深科技团队，包含机器人工程师、AI 研究员、机械设计师和运营专员，全负担薪酬每月将达到 USD 2 million 至 USD 6
              million，且尚未计入硬件和算力支出。


              硬件原型是重大成本项：早期人形机器人迭代需要定制执行器、精密轴承、力传感器、计算模块和集成劳动力，每台原型机成本可能在 USD 25,000 至 USD 100,000
              之间；在商业级规格冻结前，还需要多轮迭代。Goldman Sachs Research 指出，一些人形机器人部件仍需要供应有限的高精度磨床，显著推高早期单位成本。Figure AI 的 Series C
              募资用途声明明确提到 BotQ 制造工厂建设是主要资本配置，说明仅制造扩产一项，就可能在产生有意义收入前消耗数亿美元。


              Agility Robotics 2024 年 4 月裁员——被表述为商业化转向——说明从 R&D 走向商业部署时，可能触发成本重组和人员精简。对 Genki 的教训是，Series A 资本必须同时资助剩余
              R&D 完成和早期商业基础设施建设，对低效的容忍度有限。Andy Rubin 先前创业项目 Essential Products 在 2020 年关闭前估计募得 USD 330
              million，为高硬件资本消耗却未能实现规模化产品—市场契合提供了警示先例。
