      - CE018
  - id: FE002
    title: 人形机器人客户运营流程（任务关键型部署）
    type: flow
    layout: standard
    summary: 日本任务关键型人形机器人部署的六步运营流程，依据 Japan Airlines Haneda 公开记录的部署和竞争对手流程整理。该流程被推断为 Genki 可能的运营模型；没有确认部署或流程。
    data:
      nodes:
        - id: n1
          label: 任务分配
          detail: 操作员通过机队管理仪表盘或企业系统集成分配任务（例如 WMS 推送仓库拣选任务；地面运营系统推送机场行李任务）。Japan Airlines Haneda 模型（2026 年 5 月）使用地面运营系统。
        - id: n2
          label: 自主导航到工作区
          detail: 机器人用 3D LiDAR 和深度相机从充电站导航到任务区；避障和路径规划以预先建图环境为基础，并叠加实时传感器数据。
        - id: n3
          label: 场景感知与物体识别
          detail: 视觉-语言-动作模型识别目标物体、工作现场状态和人类同事；避碰区启用；生成任务执行计划。贴近人作业需要符合 ISO/TS 15066。
        - id: n4
          label: 任务执行
          detail: 机器人执行已分配任务（行李装载、货架拣选、清洁、巡检）；操作采用力控；实时检测错误；失败时触发人工接管协议。Sanctuary Phoenix 用 400+ 项任务衡量任务完成能力。
        - id: n5
          label: 故障检测与恢复
          detail: 机载监控检测任务失败、障碍物或安全事件；机器人通知操作员并安全暂停；可回退到远程遥操作。Figure AI 安全中心路线：靠软件避碰，而不是围栏隔离。
        - id: n6
          label: 任务完成与充电循环
          detail: 任务写入机队管理系统；机器人自主返回充电站（Atlas 自主换电模型）；夜间应用 OTA 固件更新；向操作员报告性能指标。运营周期目标为 4-8 小时。
      edges:
        - from: n1
          to: n2
          label: 已派发
        - from: n2
          to: n3
          label: 到达作业现场
        - from: n3
          to: n4
          label: 场景已确认
        - from: n4
          to: n5
          label: 执行中监控
        - from: n5
          to: n4
          label: 恢复后继续
        - from: n4
          to: n6
          label: 任务完成
    claimRefs:
      - CE019
      - CE025
      - CE027
      - CE028
