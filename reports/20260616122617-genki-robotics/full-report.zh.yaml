      - number: '5.4'
        title: 任务关键型部署的安全与自主约束
        blocks:
          - type: paragraph
            body: >-
              任务关键型人形机器人部署需要一套安全框架，远超早期工业机器人依赖物理围栏隔离的模式。Figure AI 2025 年设立专门的 Center for the Advancement of Humanoid
              Safety，说明行业认为人与机器人共事的安全问题在商业规模上尚未解决。人形机器人与人并肩运行，会把大型可移动金属机身带来的碰撞风险引入共享空间；基于计算机视觉的避障是主流缓释路径，但必须通过 ISO
              10218（协作工作空间中工业机器人安全）和 ISO/TS 15066 等标准认证。Boston Dynamics 已用 Spot 四足机器人在高后果环境中部署移动机器人——CBRNE
              调查、爆炸物处理、核设施退役——建立了一个安全证据基准，人形机器人新进入者必须达到或超过它。iRobot 创始人、MIT 知名机器人学者 Rodney Brooks
              发表过详细论证，认为在接近人的环境中实现双足行走仍是未解决的安全问题，且独立于操控灵巧性。对日本而言，Personal Information Protection
              Act（PIPA）管辖部署机器人采集和存储摄像头及生物识别数据，为硬件安全要求叠加了数据治理层。没有公开证据显示 Genki Robotics
              已经接入上述任何合规路径；对评估部署时间线的投资人来说，这是实质性尽调缺口。行业自身对滥用风险也很敏感：Agility Robotics
              与共同签署方发布联合公开信，承诺绝不武器化通用先进移动机器人，理由是会威胁公民权利和公共信任。这一明确行业立场意味着，面向民用部署的人形机器人平台必须接受清晰的伦理和政策框架约束，Genki 也需要采用。
            claimRefs:
