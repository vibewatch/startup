      - number: '4.5'
        title: 单位经济：同业类比与 Genki 无法确认的部分
        blocks:
          - type: paragraph
            body: >-
              Genki Robotics 没有披露任何单位经济数据——毛利率、CAC、回本周期、单台部署机器人收入均为空白。对 Genki
              单位经济的财务承销只能依赖已经更接近商业化部署的同业类比；但这些公司同样没有披露已经实现的单台经济性。


              Figure AI 的 $675 million Series B 和约 80 名员工，为营收前人形机器人研发强度提供了粗略的按人头资本基准：每名员工累计融资约 USD 8.4
              million，反映业务的硬件优先属性。Agility Robotics 前两份商业 RaaS 协议——分别与 GXO 和 Toyota Manufacturing Canada
              签署——证明人形机器人可以按每家机构客户 7 台的规模签下商业合同，路径是多年试点再转合同；但双方均未披露单台 RaaS 价格。2025 年全球人形机器人出货量仅 13,317 台，Figure
              AI、Agility、Tesla 各自约 150 台，说明西方玩家仍处在单客户试点阶段。Unitree G1 定价 USD 13,500，叠加其更高端平台，证明商品化人形机器人硬件已低于 USD
              25,000；但任务关键型部署需要高得多的部件规格、可靠性保证和集成服务，有效单位经济会被推到根本不同的层级。


              Goldman Sachs Research 预计，结构化环境中的人形机器人需求可观，客户可能愿意为危险或人手不足岗位支付溢价；这与 Genki 公共安全重点直接相似。Genki
              的单位经济缺口是结构性的，不只是时间问题：其隐身状态意味着在本次尽调窗口内，不会有任何试点产生可公开验证的经济数据。
