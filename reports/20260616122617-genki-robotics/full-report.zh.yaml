  - id: FV001
    title: 推荐逻辑流——Genki Robotics
    type: flow
    layout: standard
    summary: 从正面和负面证据支柱出发，经披露折价框架，导向 TRACK 建议，并列出能把判断推向 BUY 的论点推翻条件。
    data:
      nodes:
        - id: japan-demand
          label: 日本劳动力危机与 METI 政策
          detail: 人口已连续 14 年结构性下降；到 2060 年，劳动年龄人口预计减少 31%；METI 目标是在 2040 年拿下全球实体 AI 30% 份额；Japan Airlines 于 2026 年 5 月试点人形机器人
        - id: sector-momentum
          label: 板块估值动能
          detail: Figure AI 估值 $39B；2026 年 4 月已有六家人形机器人独角兽；Goldman Sachs 将 TAM 上调 4 倍至 $38B；2025 年 1–7 月 VC 流入 $6B
        - id: rubin-pedigree
          label: Rubin 创始人履历
          detail: Android 联合创始人；2013 年主导 Google 机器人收购潮，包括日本 Shaft；Playground Global $410M Fund III 投向深科技
        - id: zero-proof
          label: 零收入且无客户证明
          detail: 没有任何商业协议、LOI、试点或收入；隐身状态意味着商业验证无法核验
        - id: zero-prototype
          label: 无原型证据
          detail: 截至 2026 年 6 月，没有公开硬件演示、技术规格，也没有确认可工作的机器人；产品可行性完全未经验证
        - id: essential-risk
          label: Essential Products 失败先例
          detail: Andy Rubin 上一个消费硬件项目于 2020 年 2 月关闭；履历不能保证在难度更高的领域落地
        - id: bubble-risk
          label: 灵巧性批评与泡沫风险
          detail: Rodney Brooks（iRobot、MIT）认为，当前人形机器人灵巧性路线是纯粹幻想；TechCrunch 点出泡沫风险；板块倍数已与收入脱节
        - id: disclosure-discount
          label: 需要披露折价
          detail: 隐身 + 收入前 + 无原型 = 需要显著披露折价；在 ARR 为零时，$1B 意味着 100x+ ARR 倍数；按任何基本面指标都偏贵
        - id: recommendation
          label: 建议：跟踪（$1B 不买入）
          detail: 不按当前 $1B 标价投资；证据不足以承销；等首个原型 + 已签客户 LOI 后再评估
        - id: thesis-break
          label: 转为买入的破题条件
          detail: 18 个月内完成原型演示（NDA 或公开）+ 签下日本客户 LOI，才可在谈判出的合理入场价下转为买入
      edges:
        - from: japan-demand
          to: disclosure-discount
          label: 部分抵消
        - from: sector-momentum
          to: disclosure-discount
          label: 板块底价；部分抵消
        - from: rubin-pedigree
          to: disclosure-discount
          label: 履历溢价；部分抵消
        - from: zero-proof
          to: disclosure-discount
          label: 放大所需折价
        - from: zero-prototype
          to: disclosure-discount
          label: 放大所需折价
        - from: essential-risk
          to: disclosure-discount
          label: 进一步放大
        - from: bubble-risk
          to: disclosure-discount
          label: 板块级折价
        - from: disclosure-discount
          to: recommendation
          label: 净判断
        - from: recommendation
          to: thesis-break
          label: 改变评级的条件
    approximationNotes: 边标签只是定性方向描述，未套用加权模型。正负因素的相对大小基于现有证据判断；若数据室披露更多信息，多个节点会出现量化变化。
    claimRefs:
      - CV003
      - CV004
      - CV012
      - CV014
      - CV026
      - CV029
      - CV031
      - CV044
  - id: FV002
    title: 估值敏感性——不同倍数下支撑 $1B 入场价所需的隐含收入
    type: bar
    layout: wide
    summary: 这张柱状图按不同收入倍数假设，展示 Genki 需要做到多少 ARR 或收入，才能支撑 $1B 的投后入场价。当前披露 ARR 为零，整套估值都锚在叙事上。
    data:
      items:
        - label: 100x ARR（高增长 AI SaaS 溢价）
          value: 10
          detail: Genki 需要约 $10M ARR；若拿下首个日本政府合同并非不可能，但尚未确认或披露
        - label: 50x ARR（Figure 级人形机器人溢价）
          value: 20
          detail: 50x 对应 $20M ARR；美国或日本人形机器人初创公司尚未披露达到这一 ARR 水平；隐含 2–3 年商业爬坡假设
        - label: 20x 收入（后期成长公司）
          value: 50
          detail: 20x 对应 $50M 收入；只有经过多年商业部署后才现实；需要拿下大额政府或企业合同
        - label: 10x 收入（接近 IPO 的硬件-AI 混合公司）
          value: 100
          detail: 10x 对应 $100M 收入；硬件-AI 公司接近 IPO 准备状态；Genki 距离这一画像还有数年
        - label: 5x 收入（传统硬件）
          value: 200
          detail: 5x 对应 $200M 收入；这是纯硬件公司定价；需要在多家日本企业完成超大规模机队部署
        - label: Genki 当前 ARR（已披露）
          value: 0
          detail: 披露收入为零；完整 $1B 估值是板块动能与创始人履历的期权价值和叙事定价
