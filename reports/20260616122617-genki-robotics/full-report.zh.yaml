      - number: '8.4'
        title: 证据缺口、反向信号与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              即便按隐身公司标准，Genki Robotics 的证据缺口也异常宽。没有任何财务数据公开——收入、毛利率、BOM
              成本、烧钱速度、股权结构或轮次规模都没有。没有原型视频、技术演示或硬件规格发布。投资人身份也未披露，无法判断领投方是否有机器人行业深度、治理权利，或是否与 Genki 的公共安全使命一致。PitchBook
              档案确认公司存在，但把所有财务细节放在付费墙后。


              在这个背景下，尽调应把 $1B 估值视为上限，而不是已确认的公允价值。任何以 $1B 或接近 $1B 进入的新投资人，都在默认接受：(a) 全部技术执行风险——没有原型意味着硬件可能不可行；(b)
              全部商业风险——没有客户意味着日本市场付费意愿未被验证；(c) 全部治理风险——没有领导层披露意味着无法评估团队深度、董事会构成或受托责任一致性；以及 (d)
              全部流动性风险——没有优先权积压数据意味着高于表面估值的有效资本成本未知。


              最终尽调要求表 TV006 列出在作出负责任投资判断前必须解决的 6 项具体证据。其中，原型演示和股权结构披露是阻断项：没有它们，就无法建立财务模型。中国竞争威胁进一步加剧紧迫性：2025
              年人形机器人出货中中国占 87%，五角大楼 2026 年 6 月又将 Unitree 列名。Genki
              必须在中国成本学习曲线进一步侵蚀日本可寻址价格溢价之前，证明技术差异化。等待这些证据的投资人很可能支付更高价格，但信息风险会显著下降。
