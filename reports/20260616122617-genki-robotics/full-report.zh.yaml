      - number: '7.3'
        title: 技术可行性与安全风险
        blocks:
          - type: paragraph
            body: >-
              Genki 瞄准公共安全中的“mission critical applications”，这是对仍未验证的人形机器人平台最不宽容的部署类别之一。Rodney Brooks
              及其他机器人观察者的独立批评，点出了投资热情与实际就绪度之间的缺口：灵巧性仍未解决，全尺寸双足机器人带来不成比例的跌倒风险，许多商业环境仍无法容忍不安全或不可靠行为。可比行业证据也强化了这一点。展会现场出现过不能工作的原型，Agility
              不得不通过裁员重新聚焦商业化，Figure 投入专门安全中心，Tesla 自身规模化也未达到激进台数目标。这些案例并不证明 Genki
              会失败，但说明即便资本最充足的同业，仍在解决稳定性、传感、验证和部署经济性等根本问题。Genki 没有披露安全测试、认证路径或第三方验证框架，剩余产品责任敞口仍然极高。
