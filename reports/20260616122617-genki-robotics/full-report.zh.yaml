  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 直接人形机器人竞争对手
        blocks:
          - type: paragraph
            body: >-
              五家公司对 Genki Robotics 构成最直接的竞争威胁：Boston Dynamics、Figure AI、Agility Robotics、Unitree 和 Sanctuary
              AI。每家公司都展示过人形或先进移动硬件，拥有可观融资，并有商业化策略——尽管尚无任何一家将日本公共安全采购作为主要市场。


              Boston Dynamics 拥有机器人行业最长的既有商业记录和最深的 IP 积累。其电动 Atlas 人形机器人被营销为全球首个企业级工业人形机器人，目标是在制造业中承接物料搬运流程，并通过名为 Orbit
              的企业集成层连接 MES 和 WMS 系统。2026 年 1 月，公司在 CES 宣布与 Google DeepMind 合作，目标是为 Atlas 打造下一代 AI 基础模型。CEO Robert
              Playter 在任 30 年后于 2026 年 2 月卸任；CFO Amanda McMaster 担任临时 CEO，同时公司启动继任搜索。对 Genki 最关键的是，Atlas
              面向工厂物料搬运，而非公共安全——Boston Dynamics 的四足机器人 Spot 已经在 CBRNE、EOD 和核退役领域实现商业部署，这正是 Genki 瞄准的细分市场。因此，Spot 让 Boston
              Dynamics 通过一个已验证的非人形平台，在 Genki 首要垂直领域拥有既有在位者位置。Boston Dynamics 已披露计划建设一座年产 30,000 台 Atlas
              的工厂，显示其长期制造规模野心将远超 Genki。


              Figure AI 总部位于加州 San Jose，2025 年 9 月完成超过 $1 billion 的 Series C，投后估值 $39 billion，使其自 2022 年成立以来累计融资约 $2
              billion。投资方包括 Nvidia、Brookfield Asset Management、Qualcomm Ventures 和 Salesforce。Figure 旗舰产品 Figure 03
              面向家庭环境，使用 Helix——这是公司在 2025 年 2 月退出 OpenAI 合作后自研的 Vision-Language-Action（VLA）模型。Helix
              让机器人能响应自然语言指令，处理数千种家庭物品；Figure 正在 BotQ 工厂扩大制造。按 Omdia 数据，公司 2025 年约出货 150 台。Figure
              不面向公共安全应用，因此是细分相邻威胁，而非直接威胁；但其资本厚度让它具备快速调转资源的选项。一个反向信号是：CEO Brett Adcock 在 2025 年 6 月 Bloomberg Tech
              大会上跳过现场演示，并拒绝披露 BMW 试点细节，引发早期执行疑问。


              截至 2026 年中，Agility Robotics 的 Digit 是现场商业验证程度最高的人形机器人平台。这家 Oregon State University 衍生公司于 2024 年 6 月与物流巨头
              GXO 在 Georgia Spanx 工厂达成多年期 RaaS（robots-as-a-service）协议；一年试点后，又在 2026 年 2 月向 Toyota Motor Manufacturing
              Canada 签约 7 台 Digit，用于 RAV4 生产。与 Mercado Libre 和 NVIDIA 的商业协议扩大了其合作伙伴名单。Digit
              专为物流交接而生——在自动化输送线之间搬运周转箱——不是为户外或公共安全环境设计。Agility 在 2024 年 4 月裁减少量员工，同时重新聚焦商业化；但其 CPO 报告称，到 2024
              年中，公司订单已超过履约能力。


              Unitree Robotics 是一家中国制造商，按 Forbes 汇编的 Omdia 数据，2025 年约出货 4,200 台人形机器人，全球第二。Unitree G1 标价约 $16,000 / 台，H1
              约 $90,000，使 Unitree 成为全球人形机器人市场中价格竞争力最强的玩家。中国通过 EV 产业建立的硬件供应链，让其迭代速度和单位成本低于任何西方或日本竞争对手。Unitree
              向盟友市场商业扩张面临一个重大风险：2026 年 6 月，Pentagon 将 Unitree 加入支持中国军方实体的 1260H
              名单，令美国以及潜在盟友国家采购更复杂。日本国防和公共安全机构面临类似制度障碍，这可能无意中保护 Genki 的本地定位。


              Sanctuary AI 是一家加拿大公司，正开发第七代 Phoenix 人形机器人。最新版本采用自有液压灵巧手，用于工业操作，并通过 sim-to-real transfer 快速学习任务。2024 年 5
              月，公司与 Microsoft 合作，聚焦通用 AGI 机器人研究。截至 2026 年 6 月，Sanctuary 还与 Zeon Corporation 合作，为其机器人手开发坚固弹性体部件。到 2025
              年，Sanctuary 未确认商业出货；其轨迹仍偏研究和材料科学。与 Microsoft 的合作构成可信的长期威胁，但短期内不是市场替代风险。
