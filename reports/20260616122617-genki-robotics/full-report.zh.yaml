      - number: '6.4'
        title: 为什么 Genki 仍缺少客户证明
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 6 月，Genki Robotics 没有任何可验证客户证明。经验证的公开来源中，没有采购记录、政府招标公告、客户案例、具名试点、已签 LOI 或第三方评价。LinkedIn 显示公司约 5
              名员工——这样的团队规模无法同时开发产品、跑通日本企业安全认证，并在多条高摩擦机构采购管线中推进商务拓展。genkirobotics.com 域名没有返回内容，公司也没有发布公开产品公告。对一家 2026
              年初成立且处于隐身状态的公司来说，这并不罕见，但意味着客户章节在结构上是空的。更广泛市场的结构性证据进一步放大了客户证明缺失。机器人赛道投资机构 Cybernetix Ventures 普通合伙人 Fady
              Saad 2025 年 10 月告诉 TechCrunch，除太空应用外，他几乎看不到当前人形机器人市场，并且“对真实用例和实际收入有点保守和怀疑”。Nvidia AI Research VP
              把人形机器人开发时间线类比为 2016 年早期自动驾驶汽车，指出“真正规模化仍花了好几年，而且即便现在也没有谁真正扩展到完全自主”。Rodney Brooks 2025 年 9
              月预测人形机器人投资泡沫会破裂，理由是当前训练方法无法规模化学会灵巧性。多位机器人 VC 告诉
              TechCrunch，他们预计广泛采用人形机器人至少还需要数年，甚至可能超过十年。即便是按部署台数看商业化最领先的人形机器人公司 Agility Robotics，也不得不在 2024
              年裁员并调整商业化策略，同时处理 Amazon 不续约试点的决定。Genki 的产品成熟度落后 Agility 数年，也没有任何既有客户关系作为起点。日本市场还叠加额外摩擦：SoftBank Robotics
              作为资金充足的本土玩家，拥有数十年的日本市场关系，已经进入养老护理和服务自动化；Unitree 硬件也已进入 JAL 羽田试验。Genki
              的首个客户必须愿意忍受一个无产品供应商、漫长安全评估，以及把预算押给一家没有部署记录、创始人在 Essential 失败后仍未证明自己的实体的风险。投资人应把客户证明缺失列为交割前最高优先级尽调事项。
