  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与定价架构：仅可推断的收入流
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 6 月，Genki Robotics
              没有披露定价、合同条款或收入模型。公司处于隐身模式，没有可用的公开官网，任何公开表面都没有产品规格，也没有确认的商业协议。因此，任何收入模型分析都必须从人形机器人行业结构逻辑、同业公司证据，以及 Genki
              已公开的公共使命表述中构建。


              对一家瞄准日本公共安全和城市维护的任务关键型人形机器人初创公司而言，近期最可能的收入机制，要么是向政府机构或基础设施运营方直接销售硬件，要么是
              Robot-as-a-Service（RaaS）订阅模式：供应商保留硬件资产所有权，按每台部署设备、每个周期收取经常性费用。Agility Robotics 与 Toyota Motor
              Manufacturing Canada 和 GXO（Spanx 工厂）的商业协议均采用 RaaS 结构，证明经常性收入型人形机器人部署在商业上可行。日本 METI 或 NEDO
              项目下的政府补助，以及公共安全采购合同下的里程碑付款，可能补充或先于任何商业收入，尤其考虑到 Genki 公开的公共安全使命与日本 Society 5.0 和 AI Robotics Strategy 框架一致。


              Unitree 公开列出的 G1 基础价格 USD 13,500，为当前开放市场人形机器人平台设定了低成本锚点。Genki
              的任务关键型定位意味着平均售价会显著更高——任务关键型应用历来因可靠性要求、责任覆盖和集成复杂度支撑溢价 ASP——但目前没有确认，也没有标价。收入确认政策未知：基于里程碑的政府合同、RaaS
              经常性费用和一次性硬件销售采用不同收入确认方式；所选机制会实质影响收入质量、营运资本需求和毛利结构。
