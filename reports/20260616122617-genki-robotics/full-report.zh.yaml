      - number: '8.2'
        title: 可比估值分析：行业同业、市场信号与日本需求
        blocks:
          - type: paragraph
            body: >-
              Genki Robotics 最近的可比对象是 Figure AI 的融资轨迹。Figure 2024 年 2 月以 $2.6B 投后估值完成 $675M Series B，当时 80 名员工，背后有
              Microsoft、OpenAI、Nvidia、Amazon 和 Bezos。到 2025 年 9 月，它又以 $39B 估值完成超过 $1B 的 Series C，18 个月抬升 15 倍。估值惊人，但
              Forbes 引用 Omdia 数据称，Figure 2025 年只交付约 150 台人形机器人。其 CEO 在 Bloomberg Tech 跳过现场机器人演示，也拒绝确认 BMW 关系的商业条款。Figure
              还向二级市场经纪商发出停止侵权函，引发治理警讯。Genki 当前为 $1B，只相当于 Figure 现估值的 2.6%，但 Genki 没有任何部署证明；Figure 的商业活动却在扩张：BMW、UPS，以及
              Catalyst Brands 的零售物流协议。到 2026 年，Figure 还提升 Figure 03 产量，开设 BotQ（专门制造设施），并将 Helix AI 大规模用于物流——这些制造和 AI
              集成里程碑，对 Genki 仍完全是假设。


              Agility Robotics 提供了最接地气的商业可比。它的 $150M Series B 由 DCVC 和 Playground Global 共同领投——后者正是 Andy Rubin 自己的 VC
              基金——在 Genki 创始人与商业化最靠前的人形机器人同业之间形成直接投资人网络联系。Agility 2024 年 6 月与 GXO 签署正式 RaaS 商业协议，用于 Spanx 工厂部署；2024 年 4
              月开设 RoboFab（全球首座人形机器人专用工厂，目标年产 10,000 台）；2025 年扩展到 Mercado Libre 的拉美物流；宣布面向 Digit 的硬件创新，提升灵巧性和载荷；并在 2026 年
              2 月依据正式商业 RaaS 协议，在 Toyota TMMC 部署 7 台机器人。即便如此，公司仍在 2024 年 4 月裁员，重新聚焦商业化。Agility 从试点走到 Toyota
              商业部署用了约一年，这暗示任何隐身阶段新进入者的收入时间线大约是 2–4 年。


              Unitree 的 G1 定价 $13,500，给出了竞争价格地板。Unitree 2025 年交付 4,200 台人形机器人（全球出货 87% 来自中国制造商），但在 2026 年 6 月被列入五角大楼
              1260H 中国军方名单，限制其在美国以及潜在日本市场的合作。Japan Airlines 2026 年 5 月在 Haneda Airport 启动 Unitree H1 试验，说明日本确有真实需求，也说明
              Genki 暴露在中国规模玩家的竞争之下。日本 METI 目标是到 2040 年拿下全球 physical AI 30% 份额，日本劳动年龄人口预计到 2060 年下降 31%，形成结构上有吸引力的 20
              年需求叙事。可比估值表 TV004 覆盖这一同业集合的 9 个数据点。
