      - number: '6.3'
        title: 相邻部署验证需求
        blocks:
          - type: paragraph
            body: >-
              四项外部部署为 Genki 所瞄准的客户类型提供了最清晰的需求验证；合起来看，它们既建立了概念验证，也界定了 Genki 将面对的竞争。Japan Airlines 与 GMO AI 合作、在羽田机场开展为期 2
              年的试验，是最直接相关的日本市场证明：航空是典型劳动力短缺环境，买方是机构企业，用例（行李装载、客舱清洁）也正好匹配人形机器人适合承担的枯燥、脏污和危险任务。不过，Japan Airlines
              只确认正在进行“可行性研究和风险评估”，部署机器人是 Unitree H1，而非日本本土供应商产品。Agility Robotics 与 GXO Logistics 签下的多年商业协议（2024 年 6
              月签署），被 Agility CEO 称为“首批部署在客户现场、产生收入并解决真实商业问题的人形机器人”——这为赛道树立了商业基准。随后 Toyota Motor Manufacturing Canada 在
              2026 年 2 月签下 7 台 Digit 机器人，确认 RaaS 模式可以从单一物流试点扩展到汽车生产环境，其中还包括 Toyota 子公司——日本最具标志性的工业买方。Gecko Robotics 与 US
              Navy 签署的 5 年、$54M IDIQ 船体检查合同（覆盖 18 艘 Pacific Fleet
              船只），提供了最强的公共部门采购先例：一旦可靠性得到证明，政府安全和国防买方会把多年、九位数合同交给任务关键环境中的机器人检查方案，尽管这里使用的是非人形爬行机器人。截至 2025 年 11 月，Figure
              AI 已用 F.02 人形机器人参与 BMW 30,000 辆汽车生产，并在 2026 年 5 月与 Catalyst Brands
              签署协议以进一步扩大运营，确认汽车和消费品物流是合适产品可以触达的市场。Agility Robotics 还与拉美最大电商运营商 Mercado Libre 签署商业协议，并于 2025 年 12
              月公布，显示人形机器人 RaaS 客户获取正在从北美制造商向新兴市场物流扩散——这是赛道商业化速度的又一信号。上述部署均不涉及 Genki。反向信号同样重要：Amazon 结束了 Agility Digit
              试点，且没有宣布后续步骤，尽管 Amazon 曾投资 Agility Series B；这说明企业试点即便有战略投资人，也不会自动转化为商业协议。Figure AI 的详细部署后报告确认了客户投入深度：BMW
              Spartanburg 部署运行 1,250+ 小时、装载 90,000+ 件钣金件、参与 30,000+ 辆 X3 生产，整个项目历时 11 个月——这验证汽车生产客户在把人形机器人视为生产级部署前，会要求严苛
              KPI 合规（节拍、放置精度、零干预目标）。Agility Robotics CEO Peggy Johnson
              也从客户角度描述了劳动力逻辑：人类“不愿或无法填补”的物流岗位——超过一百万个空缺仓储岗位——创造了人形机器人部署的拉动需求；客户看重的是机器人无需组织变革管理，就能进入重复、枯燥岗位。没有可部署产品，Genki
              无法达到任何一个基准。
