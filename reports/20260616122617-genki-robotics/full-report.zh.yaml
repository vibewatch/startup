      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >
              Andy Rubin 是 Genki Robotics 已公开确认的联合创始人，也是最醒目的具名负责人。Rubin 共同创造了 Android——这套移动操作系统后来于 2005 年被 Google 收购——并在
              Google 担任高级副总裁，负责移动产品。2013 年，他在 Google 主导一轮激进的机器人收购计划，将 7 家公司纳入 Google，其中最重要的是
              Schaft，一家从东京大学拆分出来的人形机器人公司。这笔收购让 Rubin 直接接触日本学术机器人圈人才池和工业生态；通过 Genki Robotics，他似乎正在重新激活这层关系。Rubin 于 2014
              年离开 Google，随后在 2015 年共同创立 Playground Global，这是一家位于 Palo Alto 的早期风投机构，聚焦深科技和硬件，并于 2023 年 12 月完成规模 $410
              million 的 Fund III。2015 至 2020 年间，Rubin 还共同创立智能手机初创公司 Essential Products；该公司从 Playground
              Global、Tencent、Amazon Alexa Fund 等投资方募得 $330 million，售出约 88,000 台设备后，于 2020 年 2 月关闭。


              Jeff Kunins 是另一个公开与 Genki Robotics 有关联的具名人士，以员工身份出现在公司 LinkedIn 页面。其具体头衔或职能角色尚未公开披露。其他联合创始人、董事会成员、C-suite
              高管和顾问均未公开识别，这与公司整体隐身姿态一致。


              Andy Rubin 的领导权集中带来尖锐的关键人风险。他是公司唯一公开确认的创始人、唯一公开发声者，也是支撑东京基地选择和潜在投资人关系网络的人。Rubin 的声誉记录构成重大的反向治理因素。2018 年 10
              月，The New York Times 报道称，尽管 Google 一项可信的内部调查认定他与下属员工的关系「不当并显示判断力欠佳」，Google 仍向 Rubin 支付了 $90 million
              离职补偿。该报道在 2018 年 11 月引发全球 Google 员工罢工，并触发股东派生诉讼，指控其违反受托责任和浪费公司资产。2019 年 7 月，新解封的离婚法院文件称，Rubin
              取得了一份被描述为「极不公平」的婚前协议，限制配偶赡养费，并在未获得知情同意的情况下剥夺原告根据加州法律享有的夫妻共同财产权。Rubin
              否认最严重的指控，也没有刑事指控被提出；但这段历史形成的治理阴影，是任何机构投资人或企业合作方反复尽调的事项。
