      - number: '4.3'
        title: 融资时间线与投资人信号
        blocks:
          - type: paragraph
            body: >-
              公司概览章节包含完整融资时间线。本节聚焦公开来源可见的资本充足性信号，以及它们对财务 runway 的含义。Genki Robotics 在 2026 年 4 月完成 Series A 后据报投后估值 $1
              billion，这是唯一公开确认的财务里程碑。Crunchbase 2026 年 4 月独角兽报告称，公司进入独角兽时成立一年，暗示其在 2025 年中成立，并在不到 12
              个月内从组建走到独角兽状态——这更像是一位关系网络强的创始人，凭创始人信念从已知机构伙伴（Playground Global）募资，而不是基于已验证产品牵引力。


              Playground Global 的 Fund III（2023 年 12 月关闭，规模 $410 million）在深科技公司种子和 Series A 阶段投出 USD 1 million 至 USD 20
              million 的初始支票。如果 Playground 领投，并将该轮设计为深科技硬件初创公司的传统 Series A，则很可能需要共同投资人参与，才能达到有意义硬件 R&D
              所需资本水平；但没有共同投资人被公开确认。基于 $1B 投后估值和典型 Series A 15–25% primary 持股目标，推断 Series A 规模在 USD 50 million 至 USD 200
              million 区间方向上合理，但该估计置信度很低。确切融资规模、共同投资人名单、清算优先权、按比例跟投权或管理层期权池均未披露。


              该行业可见的估值跃升潜力很大。Figure AI 从 2024 年 2 月 $2.6 billion 的 Series B 估值，升至 2025 年 9 月 $39 billion 的 Series C
              估值，在不到 20 个月内约提升 15x。Genki 以 $1 billion Series A 入场，位于这条潜在轨迹的早期；但从 Series A 走向 Series B
              商业化，需要证明原型稳健性、试点客户结果，以及通向经常性收入的可信路径，而这些尚无公开证据。
