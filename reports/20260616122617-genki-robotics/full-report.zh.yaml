      - number: '4.4'
        title: 行业资本形成与战略投资人信号
        blocks:
          - type: paragraph
            body: >-
              除了 Genki 自身融资记录，人形机器人及相邻 AI 赛道的整体资本形成环境，也为判断 Genki 后续融资能力和战略伙伴管线提供了重要背景。


              Toyota 2025 年 9 月宣布追加 $1.5 billion，投向各阶段创业公司，延续其既有企业风投计划。再叠加其商业化落地的 Agility Robotics RaaS 部署，汽车 OEM
              已经为机器人相邻标的准备了专门火力，其中可能包括与 Genki 这类任务关键型人形机器人创业公司的战略关系。


              Goldman Sachs Research 预计，生成式 AI 可能在十年内把全球 GDP 抬高约 7%，相当于近 $7 trillion。这一宏观论点支撑机构投资者对 AI
              相邻实体平台高估值的胃口，也是资本流入人形机器人赛道的关键推力。反过来，它也带来二元风险：一旦生产率提升论点走弱，全行业估值压缩可能先于 Genki 下一轮融资发生。


              Figure AI 2025 年 1 月公开详述了 Digit 人形机器人部署的工作场所安全规划框架，显示单个场地的安全验证、监管申报和保险承保，会给单位经济增加一层公开同业毛利率类比中看不到的隐性成本。本章任何
              BOM 或烧钱估算都未反映这类合规开销；在 Genki 的任务关键型部署场景里，必须单独建模。


              1X Technologies 宣布计划在 2025 年于数百个家庭测试人形机器人，说明同业公司正在融资支持偏消费者端的部署模式——这扩大了本赛道可供投资者选择的投资叙事，也显示工业 RaaS
              和政府采购之外，替代性部署融资结构正在出现。


              Hugging Face 2025 年 5 月推出两款开源人形机器人平台，对以专有硬件为中心的商业模式施加成本压力。开源生态发展可能压低早期进入者的 BOM 成本，也可能商品化硬件差异，而 Genki
              尚未公开说明自身硬件差异化。


              Tesla 2025 年 6 月起诉一名前 Optimus 机器人工程师，指控其窃取商业秘密。该事件显示 IP 与人才竞争会把法律开销和留才风险压到所有营收前人形机器人创业公司身上。对 Genki
              而言，这一风险尤其尖锐：公司仍处于隐身状态，IP 位置未披露，创始人又曾任职于多家卷入人才和 IP 争议的公司。
