  - id: FE001
    title: 推断的人形机器人技术栈（按竞争对手校准）
    type: stack
    layout: standard
    summary: >-
      面向任务关键型人形机器人的六层推断架构，来自 Boston Dynamics Atlas、Figure AI、Unitree H1/G1 和 Sanctuary Phoenix 收敛出的设计选择。Genki Robotics
      的所有层级均为推断；没有确认架构。
    data:
      layers:
        - label: 任务编排与机队管理
          detail: 基于云的机队管理（类似 Boston Dynamics Orbit）；OTA 固件更新；操作员仪表盘；接入 MES、WMS 和企业系统。没有确认的 Genki 实现。
        - label: AI 基础模型与任务推理
          detail: 视觉-语言-动作（VLA）模型负责场景理解、自然语言指令处理和任务合成。行业趋势转向自研 VLA（Figure Helix、Sanctuary Carbon），而不是第三方 API。Genki 模型提供方未知。
        - label: 实时运动规划与控制
          detail: 用强化学习训练步态合成；用逆运动学处理操作；实时安全避障。训练在仿真中完成，再做 sim-to-real 迁移（Boston Dynamics RAI Institute 路线）。
        - label: 感知与传感器融合
          detail: 3D LiDAR 加双目深度相机提供 360 度空间感知；IMU 用于平衡；手部触觉传感器提供力反馈。Unitree H1/G1 和 Atlas 都把这套传感器组合作为标准配置。
        - label: 执行器、关节与电源系统
          detail: 关节采用永磁同步电机（PMSM）；按配置不同为 23-43 DOF；膝部扭矩 90-360 N.m；可更换锂电池（Unitree H1 为 864 Wh）；Atlas 已展示自主换电。
        - label: 人形物理形态
          detail: 双足全尺寸人形机身；估计重量区间 35-80 kg（Unitree G1 35 kg，Atlas 约 80 kg）；身高 130-180 cm；设计目标是在无需改造基础设施的既有人造环境中运行。
    approximationNotes: 所有层级都从竞争对手实现中推断；没有 Genki 专属架构数据。层级细节反映 2025-2026 年商用人形机器人的行业共识设计，不是已确认的 Genki 选择。
    claimRefs:
