  - id: FM004
    title: 采用漏斗 — 日本服务机器人部署路径
    type: funnel
    layout: standard
    summary: 日本机构采购模式把劳动力危机到签约部署切成分阶段漏斗；每一阶段都是关口，会拖慢收入转化，也验证市场。
