  - id: TV006
    title: 最终尽调问题 — Genki Robotics 估值
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 责任方 / 尽调路径
    rows:
      - - 原型机与产品证明
        - 没有公开或 NDA 数据室中的原型视频、技术规格或硬件演示
        - 没有硬件证据，$1B 估值就是纯期权定价；任何财务模型都站不住
        - 向 Rubin 或 Playground Global 要求管理层演示 + NDA 数据室访问
      - - 客户管线与 LOI
        - 未披露意向书、试点合同或商业 MOU
        - 至少一份已签 LOI 都没有，收入时间和商业可行性无法评估
        - 管理层披露；交叉核对日本 METI 公共安全合同采购管线
      - - 财务模型与 BOM
        - 未披露物料清单、毛利率目标、烧钱速度或资金跑道
        - 没有 P&L 预测，无法承销资本效率，也无法判断 Series B 融资需求
        - 管理账 + 董事会层面财务模型；对照 Agility 和 Figure BOM 基准
      - - 股权结构与清算优先权
        - 未知股份类别结构、反稀释条款或清算瀑布
        - 若存在高级优先权，新资金的实际成本可能远高于表面 $1B
        - 法律顾问披露股权结构；索取已签条款清单和优先权表
      - - 投资人身份与治理
        - 未公开确认领投方；未披露董事会构成
        - 无法判断投资人是否有机器人行业深度、治理权或与使命一致
        - 确认 Playground Global 或其他机构领投方；索取董事会构成和观察员权利条款
      - - 相对中国同行的竞争差异化
        - 没有将 Genki 硬件与 Unitree H1 或 Agibot A2 对比的技术规格
        - 中国玩家年出货 4,200–5,168 台、价格 $13,500，威胁日本溢价；必须证明差异化
        - 要求 IP 格局、日本 NTA 注册下的专利申请，以及硬件路线图对比
    notes: >-
      六项全部会阻断或实质影响投资判断；任何一项都不能用公开证据替代。第 1–3 项是阻断项（没有就无法建模）；第 4–6 项是重大项（影响入场条款和治理）。尽调路径假定可接触可能的 Series A 领投方 Playground
      Global；若 Playground Global 不是领投方，则替换为已确认领投方。
