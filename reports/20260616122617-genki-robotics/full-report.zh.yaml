              Rubin 在 Google 的不当行为举报、Essential 的关停，已经进入永久公共记录；TechCrunch 的存档让这段历史很容易被 LP、采购团队和记者查到。Genki
              仍基本沉默期间，一旦出现新的指控、法院动态或负面治理事实，融资和客户尽调可能在公司拿出足够运营证据为估值辩护之前就收紧。
