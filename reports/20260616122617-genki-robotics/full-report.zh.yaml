      - number: '8.3'
        title: 牛市 / 基准 / 熊市情景、反向证据与投资建议
        blocks:
          - type: paragraph
            body: >-
              Genki 的牛市情景建立在三股叠加顺风上：日本劳动力短缺的紧迫性、政府政策支持（METI AI Robotics Strategy FY2026、Moonshot R&D Program 到 2030
              年推出人形机器人原型），以及战略收购方带来的退出可选性。Meta 2026 年 5 月以未披露金额收购 Assured Robot Intelligence；Qualcomm 2026 年 3 月与 Neura
              Robotics 合作做芯片级集成。若投资人以 $1B 进入，Genki 随后展示可用原型、拿下日本政府或航空试点，并以 $3–5B 完成 Series B，则 $1B 入口可获得 3–5x 回报，类似
              Agility 路径的成功结果。Goldman Sachs 将其人形机器人 TAM 上调至 2035 年 $38B（上调 4 倍），也支撑长期价值创造叙事。不过，基于当前证据，这仍是概率加权后低于 15%
              的结果。


              基准情景是长期隐身。Genki 可能到 2026 年底或 2027 年仍处在原型开发阶段，最终才露出技术演示，并以相对 $1B 小幅上调的估值完成 Series B，或许是
              $1.5–2.5B。在这个情景下，$1B 入口投资人可获得 1.5–2.5x 回报，途中伴随显著执行风险。这是中心情景，估计概率约 45%。


              熊市情景是最实质的风险：18 个月内没有原型出现，中国规模玩家把硬件层商品化，行业估值压缩，Rubin 的治理或专注度受到质疑。Rodney Brooks 的批评是最尖锐的反向信号：这位 iRobot
              联合创始人、MIT 前教授认为，当前人形机器人的灵巧性训练路径存在根本缺陷，因为触觉数据基础设施并不存在，并称这种路线是「纯粹的幻想思维」。TechCrunch
              将此报道为「数十亿美元正在被浪费」的预测。若灵巧性叙事在 2026–2030 年窗口失败，人形机器人市场会回到低 ASP 的任务专用部署，Genki 宽泛的人形机器人使命也会在战略上错位。Essential
              Products 先例说明，Rubin 已经经历过一次高调消费硬件失败。该熊市情景估计概率为 40%；若需要下轮降估，估值底部为 $200–800M。


              按这个分布看，$1B 入口的期望价值不足以补偿风险。建议为 TRACK：不要以 $1B 投资；等到首次原型演示 + 已签客户 LOI 后再重估，届时建议可在公允进入价格下转为 BUY。
