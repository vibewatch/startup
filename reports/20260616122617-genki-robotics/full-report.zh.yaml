  - id: FU001
    title: 客户采用旅程——从紧迫性到签约部署
    type: journey-map
    layout: wide
    summary: 日本机构采购模式把劳动力短缺的紧迫性到签约机队部署拉成五个阶段；Genki Robotics 尚未进入任何阶段。
    data:
      items:
        - id: stage-1-urgency
          label: 阶段 1：结构性劳动力紧缺
          actor: 高管 / 政府政策团队
          description: >-
            日本人口连续第 14 年下降，劳动年龄人口收缩（占总人口 59.6%），叠加 2024 年建筑业加班规则，迫使机构买家评估自动化。政策杠杆包括 METI 30% 全球份额目标、RING Project 补助和
            Society 5.0 要求。
          channels:
            - METI/NEDO 补助公告
            - 行业媒体报道
            - 省厅政策指令
        - id: stage-2-evaluation
          label: 阶段 2：供应商评估与 RFI
          actor: 采购负责人 / 技术委员会
          description: 机构买家发布 RFI、参加展会，并开展内部安全评估。日本公共部门采购要求供应商正式注册。候选名单通常只纳入已有部署证据的供应商。
          channels:
            - 贸易展会（IREX、CES Japan）
            - METI/NEDO 供应商对接活动
            - 供应商直接触达
        - id: stage-3-pilot
          label: 阶段 3：试点 / PoC（6–24 个月）
          actor: 现场经理 / 安全官
          description: 日本机构标准试点持续 6–24 个月，并设定明确 KPI。JAL 的 Haneda 试验为 2 年。试点启动前必须解决政府安全评估和责任框架。试点资金来自供应商、买方 capex 或 NEDO 补助。
          channels:
            - 现场集成团队
            - 安全认证机构
            - NEDO 共同资助申请
        - id: stage-4-commercial
          label: 阶段 4：商业合同（RaaS 或 CapEx）
          actor: 运营与法律团队
          description: >-
            成功试点会转为多年期 RaaS 或 capex 合同。Toyota/Agility 把 1 年试点转成 7 台商业合同。Gecko/Navy 承诺 5 年期
            IDIQ。日本公共部门合同涉及竞争性招标和多年审批；从首次接触算起，总周期通常为 2–5 年。
          channels:
            - 正式招标 / 竞争性采购
            - 高管签批
            - SLA 与维护合同
        - id: stage-5-expansion
          label: 阶段 5：机队扩张与续约
          actor: C-suite / 采购领导层
          description: 已验证部署会扩展到更多站点、更多设备或新用例。RaaS 模式无需一次性大额 capex，即可逐步扩张。没有 Genki 客户进入该旅程的任何阶段。
          channels:
            - 续约谈判
            - 新站点试点
            - 多年期机队协议
    claimRefs:
      - CU008
      - CU009
      - CU015
  - id: FU002
    title: 采用漏斗——日本从发现到机队部署
    type: funnel
    layout: standard
    summary: 日本采用漏斗每推进一阶段，可触达池都会缩小；Genki 尚未出现在任何阶段，总周期估计为 2–5 年。
    data:
      items:
        - label: 1. 政策与劳动力紧迫性对齐
          value: 14
          description: >-
            日本人口连续第 14 年下降；劳动年龄人口预计 20 年内减少约 ~15M；2024 年建筑业加班规则；METI Society 5.0 要求；RING Project（2025 年 6 月）；到 2040 年全球
            physical-AI 30% 目标。
        - label: 2. 政府或企业买家意向
          value: 5
          description: >-
            买家发布 RFI 或启动供应商评估。需要在日本采购主管机构完成供应商注册，或获得 C-suite 直接支持。Spot (BD)、Unitree、GMO AI 和 SoftBank Robotics 的竞争压缩
            Genki 可用窗口。
        - label: 3. 正式试点 / 2 年 PoC
          value: 2
          description: JAL Haneda 试验为 2 年；KyoHA 量产目标为 2027 年；Spot 已用于全球政府 CBRNE 试点。试点启动前必须完成安全风险评估、责任框架和保险审批。Genki 没有试点接触。
        - label: 4. 试点转商业
          value: 1
          description: Toyota/Agility 在 1 年试点后转化，代表已观察到的最快时间线。Amazon/Agility 未续约展示了下行情景。日本公共部门招标还会增加竞争性投标环节。转化是摩擦最高的一关。
        - label: 5. 机队合同与扩张
          value: 0
          description: >-
