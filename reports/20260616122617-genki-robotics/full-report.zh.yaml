      - number: '2.2'
        title: 市场规模测算——全球、日本全国与细分视角
        blocks:
          - type: paragraph
            body: >-
              没有一个已发布数字能可靠捕捉 Genki 的可服务市场。最常被引用的数字——Goldman Sachs 预测到 2035 年全球人形机器人市场达到 $38
              billion——可以作为可信的方向性锚点，但并不适合作为 SAM 代理：它涵盖由中国和美国主导的工业制造应用（EV 装配、物流），而不是日本对安全与维护服务机器人的特定需求。IFR
              将专业服务机器人单列为独立类别，并逐年追踪全球收入，但尚未发布日本特定的人形服务机器人子市场；2024 World Robotics 报告按应用（田间、医疗、检查、物流）追踪专业服务机器人，而不是按 Genki
              所需精度的国家—细分市场组合追踪。


              三个互补视角能给出更干净的规模测算框架。第一是全球人形机器人出货轨迹：2025 年出货 13,317 台（Omdia via Forbes），TrendForce 预计 2026 年超过 50,000
              台（同比增长 700%+），Omdia 预测 2035 年达到 2.6 million 台。日本在全球基数中的份额将由政策、成本和早期部署决定。第二是通过 JARA 数据观察日本国内机器人市场：日本制造约 70%
              的全球工业机器人供给（METI 2022 年数字），但服务机器人国内部署占全国生产的比例，JARA
              并未在人形机器人层面单独追踪。第三是用劳动力成本经济学做自下而上构建：日本关键行业岗位（基础设施检查、灾害响应、养老护理）的劳动力短缺，创造的是可由劳动力缺口规模衡量的预算紧迫性，而不是由机器人市场报告衡量。每个视角都会给出不同数字；尽调缺口在于，这些数字尚未被调和成一个站得住脚的日本服务机器人
              SAM。
