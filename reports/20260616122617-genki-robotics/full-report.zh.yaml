      - 对 Genki 的含义
      - 尽调问题
    rows:
      - - 日本人口连续第 14 年下降；劳动年龄人口占比 59.6%
        - 驱动因素（结构性）
        - 当前；未来 20 年还会加速
        - 带来「产业生存」压力；买方买单是为了业务连续性，不只是提效；当替代在人力运营上不可避免时，支付意愿最高
        - 核实 Genki 的目标垂直领域（公共安全、航空）是否面临最尖锐的近期岗位空缺，而不只是受整体劳动力下降影响
      - - METI 目标到 2040 年拿下全球物理 AI 市场 30% 份额；RING Project；自动配送自 2023 年起获得道路通行
        - 驱动因素（监管）
        - 政策已生效；AI Robotics Strategy 将在 FY2026 正式确定
        - 政府有采购意向，也有补贴管线；NEDO 资助准入提供共同出资路径；降低买方风险感知
        - 确认 Genki 是否符合 METI/NEDO 资助资格；把具体项目映射到其灾害响应和公共安全定位
      - - 日本 Society 5.0 与 Moonshot R&D Program
        - 驱动因素（监管）
        - 长周期（2021–2030 年代）；截至 2025 年 11 月，目标 1、2、3、6 仍在延续
        - 为物理 AI 提供国家战略背书；可能经由 JST 和 NEDO 打开学术合作与采购路径
        - 评估是否有某个 Moonshot Goal 专门资助公共安全场景中的人形 / 服务机器人部署
      - - Rodney Brooks 对灵巧度的批评；共享环境中的安全担忧；VC 怀疑；Automate 2024 约 75% 行业参会者持怀疑态度
        - 约束（技术 + 感知）
        - 当前；解决时间线未知
        - 机器人与人共享空间的场景会放慢采用；需要精细操作的环境短期表现会不足；投资人尽调会标记这一点
        - 用 Genki 的具体用例测试灵巧度要求；记录哪些任务能靠当前操作能力完成，哪些必须等能力进步
      - - 日本机构客户「先试点、再采购」周期长
        - 约束（结构性）
        - 当前；日本公共部门采购的常态
        - 2 年试验（如 JAL-Haneda 模式）拉长收入确认时间；在经常性收入出现前，资本强度上升；现金消耗风险加大
        - 梳理 Genki 的具体试点协议、时间线和转化率预期；按 2–3 年试点到合同节奏压力测试资金续航
      - - 中国人形机器人厂商（Unitree、Agibot）以更低成本主导全球出货；美国竞争者（Boston Dynamics、Agility）在扩张
        - 约束（竞争）
        - 当前；正在加速
        - 面对进口中国或美国平台，Genki 必须证明日本本土定位有价值；如果硬件商品化，定价权和防御性可能受限
        - 评估日本政府采购偏好或技术本地化要求，是否能相对外国平台形成持久护城河
    notes: 驱动因素与约束来自 2025–2026 年公开证据。灵巧度和安全约束是人形机器人的通用问题，并非 Genki 特有；其重要性取决于 Genki 的具体用例和产品设计选择，而这些尚未公开披露。
