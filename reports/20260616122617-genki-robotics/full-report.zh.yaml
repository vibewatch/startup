              接触的任何政府或工业买方，都会把其未经验证的产品与一个经过现场验证、已有销售动作和支持基础设施的竞争对手比较。Genki 要么必须提供有说服力的双足形态优势（例如爬梯、使用人类工具、在人类空间中导航），且
