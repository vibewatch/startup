      - number: '2.3'
        title: 买方、用户和付款方分层及采用路径
        blocks:
          - type: paragraph
            body: >-
              日本公共安全和城市维护机器人市场有分层采购结构，与消费或通用制造场景明显不同。经济买方（持有预算）几乎总是机构或政府主体：市政灾害响应机构、国家基础设施运营方、港口和机场管理机构、电力公用事业公司，或与国防相邻的组织。终端用户通常是运营团队——机场地勤、灾害响应队伍、公用事业巡检班组——他们与机器人交互，但很少控制采购。付款方在许多情况下涉及公共资金、政府补贴，或国家项目（METI、NEDO、Moonshot
              R&D）下的成本分摊；这会加快进入，但也会因采购规则拉长销售周期。


              Japan Airlines 2026 年 5 月在羽田机场的试验（行李搬运和客舱清洁）说明了买方—用户—付款方分离：JAL 持有合同并运营预算（买方 / 付款方），机场地勤是用户，GMO AI &
              Robotics 是集成伙伴。两年试验结构是日本机构采购的典型特征——先试点，再授权全面部署；预算承诺前必须累积 ROI
              证据。每个细分市场的采用触发点不同：灾害响应买方看重安全和不可能性（没有人能进入环境）；基础设施巡检买方看重成本和熟练检查员可得性；航空和物流买方看重特定工种的长期用工短缺。弄清哪个触发点在哪个细分市场已经生效，决定初始销售应集中在哪里。
