      - number: '5.3'
        title: 部署环境：日本任务关键型用例
        blocks:
          - type: paragraph
            body: >-
              日本为 Genki Robotics 提供了任务关键型人形机器人最有说服力的部署环境。Japan Airlines 2026 年 5
              月开始在东京羽田机场试用人形机器人，用于行李装载和客舱清洁，并明确称原因是人口老龄化带来的长期劳动力短缺。日本经济产业省（METI）提出，到 2040 年拿下全球 physical AI 市场 30%
              份额；政府的 Society 5.0 愿景也明确把自主机器人纳入应对人口下降的方案。按制造商份额计算，日本已经掌握全球工业机器人市场约
              70%，这让一家东京创业公司可以在本土深度接触执行器、传感器和精密机械部件。近期机会集中在四个任务关键型垂直领域：机场和交通基础设施运营（行李处理、检查、客舱清洁）、既有设施中的轻物流和仓库拣选、劳动力缺口最尖锐的护理机构辅助，以及危险或难进入位置的基础设施维护与检查。每个垂直领域都对灵巧性、可靠性和安全认证提出不同要求，产品架构必须先满足这些要求，才能规模化部署。日本计划到
              2027 年实现人形机器人本土量产，说明政府正在主动创造首批部署条件；Genki Robotics 在地理和战略位置上都适合竞争这一波初始机会。
