  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 隐身产品姿态与已验证事实
        blocks:
          - type: paragraph
            body: >-
              Genki Robotics 是一家人形机器人创业公司，由 Android 联合创造者、Google 前机器人收购计划负责人 Andy Rubin 在东京注册成立。公司刻意保持隐身：截至 2026
              年中，没有公开网站、没有披露产品规格、没有招聘信息，也没有发布任何部署或时间线公告。Rubin 向 The Information
              确认了该项目，但除承认正在开发原型外，没有给出技术细节。公司名“Genki”在日语中意为充满活力或健康，暗示其目标是适合真实世界运行、具备主动身体能力的机器人，而非实验室展示品。LinkedIn
              页面确认公司作为法律实体存在，并有一支正在形成的团队，但没有提供工程或产品细节。因此，本章所有产品与技术分析都以推断为主，基于已验证的竞争对手基准、日本部署环境，以及 Rubin 在 Google
              搭建人形机器人计划的记录：2013 至 2014 年，他曾监督收购 Schaft 及多家其他机器人公司。投资人必须把关于 Genki
              的每一项技术判断都视为推断，而不是已验证事实；本章也会明确标注每个发现是已验证还是推断。
