  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资事件与估值背景：已知与未知
        blocks:
          - type: paragraph
            body: >-
              Genki Robotics 在 2026 年 4 月拿到 $1 billion 投后 Series A 估值，Axios Pro 的独家报道（付费墙）确认了这一点，Crunchbase News 2026 年
              4 月独角兽盘点也独立佐证。Crunchbase 将其描述为一家成立 1 年、总部在东京的人形机器人初创公司，由 Andy Rubin 共同创办，聚焦公共安全和城市维护，并完成 Series A
              领投轮。公开证据基本止于此：轮次规模未披露，领投方未确认，清算优先权和股权结构未知，稀释比例也未报告。


              对一家隐身阶段、收入前公司来说，披露折价逻辑很重。按同业 20–100x ARR 的收入倍数计算，$1B 估值意味着 Genki 需要 $10M 到 $50M 的
              ARR，才可能在前瞻倍数口径上接近公允价值。目前披露 ARR 为零。因此，整个 $1B 都是期权价值：未来现金流按概率加权后的现值，再被执行、技术、竞争和创始人风险折现。这个结构意味着，任何以 $1B
              进入的新投资人，本质上都在为叙事和履历支付隐含溢价，而不是为已验证的产品市场匹配买单。


              Andy Rubin 的履历是核心论据锚点：他共同创办 Android，负责 Google 机器人收购计划（包括日本 Shaft），并创办深科技硬件 VC Playground Global，后者在 2023 年
              12 月关闭 $410M Fund III。这些资历真实有效。但他此前的消费硬件公司 Essential Products 在 2020 年 2
              月关停，原因是未能打入智能手机市场，说明履历并不能保证执行。TV002 的正反论点分析梳理了这场估值争论两边的完整证据。
