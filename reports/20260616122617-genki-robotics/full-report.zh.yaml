      - number: '5.6'
        title: 关键未知与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              Genki Robotics 在 2026 年中采取的隐身运营姿态，有助于保护早期知识产权——Tesla 2025 年起诉一名前 Optimus
              工程师窃取机器人手部传感器商业秘密，已说明竞争利害——但这也让尽调几乎陷入证据黑洞。Genki 的目标垂直、形态规格、AI 栈供应方、安全认证路径、制造策略，都没有公开信息。开发者社区也看不到信号：没有
              GitHub 仓库、没有公开 SDK、没有与具体技术绑定的招聘、没有会议演讲或学术论文。LinkedIn 确认公司存在，但不揭示技术团队构成、工程能力或工具链偏好。1X 正在推进家庭试验，Hugging Face
              推出单价 USD 3,000 的开源人形机器人，说明硬件部件商品化压力正在加速，并将影响包括 Genki
              在内的所有新进入者。关键投资问题不是人形机器人能否在日本落地——机场、工厂、护理场景的劳动力短缺需求证据很强——而是 Genki 能否形成可防守的技术差异，并在资金充足、拥有多年制造和 AI
              先发优势的现有对手面前，以足够速度执行到首次部署。
