      - number: '7.6'
        title: 地缘政治与供应链风险
        blocks:
          - type: paragraph
            body: >-
              Genki 位于东京，有利于从日本机器人生态招聘，但并不能让公司免受部件、计算平台和渠道控制的地缘政治影响。中国目前领先早期人形机器人出货量，并受益于源自 EV 的硬件栈，可加快传感器、电池和执行器迭代；如果
              Genki 间接采购其中任何有意义份额，日美安全协调升温可能限制采购选项。Pentagon 2026 年 6 月将 Unitree 列入 1260H
              名单，又给出一个信号：机器人硬件供应链正在被放入国家安全视角，而不仅是成本视角。与此同时，平台供应商和商业生态正在围绕特定伙伴整合：Qualcomm 与 Neura 结盟，SoftBank 在打造与 OpenAI
              相关的日本栈，Toyota 正在围绕 AI 和工业自动化加大风投部署。隐身公司如果不披露 OEM、芯片和分销关系，就可能同时在供应获取、生态能见度和未来客户引介上被挤压。
