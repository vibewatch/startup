      - number: '6.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 零客户证明是本章核心发现
            body: >-
              截至 2026 年 6 月，Genki Robotics 没有客户、没有试点、没有 LOI，也没有公开采购记录。对一家 2026 年初成立的隐身公司来说，这并不罕见，但它是本章最大的投资风险。每一个类比部署——从
              JAL 为期 2 年的试验到 Agility 的 Toyota 合同——都涉及已有工作产品和既往现场经验的供应商。Genki 两者都没有。投资人必须把可验证的首个客户接触（与具名方签署 LOI 或
              MOU）作为交割门槛，并在承销近期收入前，压力测试日本 2–5 年机构采购周期。
            calloutType: risk
            claimRefs:
              - CU025
              - CU026
              - CU033
          - type: callout
            title: RaaS 模式降低采用摩擦，但要求资产负债表承载能力
            body: >-
              本赛道所有成功的人形机器人部署——Toyota/Agility、GXO/Agility，以及 Gecko Navy 合同——都采用服务或 IDIQ
              结构，而不是直接硬件销售。这降低买方进入门槛，但要求供应商把机器人放在自身资产负债表上，并吸收部署成本。Genki 已确认 $1B 融资，理论上有资本支持 RaaS
              模式；但目前没有可租赁产品，也没有披露部署成本数据。投资人承诺前，应明确建模 RaaS 商业化路径的资本强度。
            calloutType: insight
            claimRefs:
              - CU010
              - CU015
              - CU019
          - type: callout
            title: 专家共识对人形机器人采用时间线给出反向判断
            body: >-
              至少三位独立专家——Rodney Brooks（iRobot 联合创始人）、Fady Saad（Cybernetix Ventures）和 Nvidia AI Research VP——在 2025
              年表示，人形机器人大规模采用仍需多年；其中一些人认为可能超过十年。自动驾驶汽车类比尤其适合 Genki 的公共安全使命：Waymo
              从首次融资到在有限地域商业化部署，用了十年以上。日本机构采购还会进一步拉长时间线。这一共识并不否定 Genki 的长期潜力，但会实质压缩其在标准 VC 基金生命周期内获得近期客户收入的概率。
