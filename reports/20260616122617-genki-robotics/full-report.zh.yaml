      - number: '2.4'
        title: 增长驱动、采用约束与相互矛盾的估算
        blocks:
          - type: paragraph
            body: >-
              日本采用服务机器人的结构性理由异常强。2024 年，日本总人口连续第 14 年下降，劳动年龄人口占总人口 59.6% 且仍在收缩，65 岁以上人口已达 29.3%。OECD 预计，到 2060
              年日本劳动年龄人口将下降 31%，20 年内约减少 15 million 名劳动者。2024 年 Reuters/Nikkei 调查发现，劳动力短缺——而不是效率——是推动日本企业采用 AI 的主要力量。METI
              已将此正式纳入国家战略：到 2040 年取得全球 physical-AI 市场 30% 份额目标；自 2023 年 4 月起允许自动配送机器人上公共道路；并正在制定 2026 AI Robotics
              Strategy。NEDO 2025 年 6 月的 RING Project 直接通过机器人部署应对区域劳动力短缺。日本 Society 5.0 愿景也明确将网络空间—物理空间融合作为国家战略目标。


              与这些驱动因素相对，若干约束既重大又有充分证据。Rodney Brooks（iRobot 联合创始人、MIT）在一篇详细文章中指出，今天的人形机器人缺乏真实世界操作所需的灵巧性——人手约有 17,000
              个触觉感受器，机器人没有等价物——并称当前训练路径是「pure fantasy thinking」。全尺寸行走人形机器人携带的有害能量是半尺寸模型的 8 倍，在人机共享环境中造成真实安全风险。多位机器人 VC
              告诉 TechCrunch，他们预计大规模采用人形机器人最早也要几年之后，并将其类比自动驾驶汽车（早期乐观、技术缺口长期存在）。这些并非边缘观点：Automate 2024
              上约四分之三机器人行业专业人士表示怀疑人形形态。对 Genki 的含义是，采用会在排除安全共享问题的环境中最快（无人核设施、灾害区域），在人形机器人必须与人并肩工作的环境中最慢。
