      - number: '6.2'
        title: 日本企业采购路径与采用漏斗
        blocks:
          - type: paragraph
            body: >-
              日本机构采购模型会形成一条从政策驱动的紧迫性到签约部署的多年漏斗。JAL 羽田试验展示了典型结构：航空公司在启动时明确把它定位为为期 2 年的可行性和风险评估，没有说明任何商业承诺。Agility
              Robotics 与 Toyota Motor Manufacturing Canada 的交易，是人形机器人赛道最清晰的转化基准：一年试点之后，按 RaaS（robots-as-a-service）模式签下 7
              台 Digit 机器人的商业合同。GXO Logistics 和 Toyota 都选择
              RaaS，而不是直接买断，以推迟大额前期资本支出——这种结构降低买方进入门槛，但要求供应商把资产留在自身资产负债表上。日本大型工业买方并不被动：Toyota 的 Woven Capital 2025 年 9
              月推出 $800M 第二支基金，瞄准日本工业自动化创业公司；Toyota Invention Partners 则以约 $670M
              成立，计划在没有固定基金期限的情况下，长期持有日本早期公司的股权——这为机器人创业公司开辟了一条战略共同开发路径，可与商业采购并行。上述基金均未披露投资 Genki Robotics
              或与其发生商业接触。公共安全买方还会受到安全认证要求、正式招标流程，以及与既有应急响应基础设施互操作性的约束。Boston Dynamics Spot 进入核设施退役、CBRNE 和 EOD
              等政府客户场景，也是在大量现场试验并接入政府工作流之后才发生。日本公共部门从识别供应商到形成签约收入，整体周期估计为两到五年；即便 Genki 产品按计划推出，近期客户证明在结构上也不容易出现。
