      - number: '8.5'
        title: 附录
        blocks:
          - type: callout
            title: 不要以 $1B 投资：等到原型和客户 LOI 出现前维持 TRACK
            body: >-
              $1B 的 Series A 投后估值，对一家完全隐身、收入前、没有披露原型、没有客户、没有财务数据的人形机器人初创公司来说，是昂贵的入场价。投资论据完全建立在 Andy Rubin
              的履历和日本劳动力短缺需求上——两者都不能验证产品可行性。建议为 TRACK，并设置清晰的论点破裂条件：若公司在 18 个月内拿出可工作的硬件原型（即便在 NDA 下）并取得至少一份已签日本客户
              LOI，评级可在基于这些证据谈判出的公允进入价格下转为 BUY。等待的投资人会付更多钱，但技术和商业风险会实质下降。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV012
              - CV042
          - type: callout
            title: Rodney Brooks 对灵巧性的批评是全行业投资论点风险
            body: >-
              Rodney Brooks 是 iRobot 联合创始人、MIT 前教授，也是机器人领域最可信的声音之一。他认为当前人形机器人的灵巧性训练路径存在根本缺陷，并称其为纯粹的幻想思维。他预测 15
              年后成功的机器人不会像人，也会依赖轮式而不是双足行走。TechCrunch 将其报道为人形机器人投资泡沫的证据。Genki 的牛市情景并不要求立即解决灵巧性，但投资人应把 Brooks
              的批评纳入人形机器人论点压力测试，并用它校准日本企业客户真正部署并付费的时间线敏感性。
            calloutType: risk
            claimRefs:
              - CV029
              - CV030
              - CV031
          - type: callout
            title: 日本劳动力危机是结构性顺风，但不是 Genki 专属验证
            body: >-
              日本人口塌陷——2024 年连续第 14 年人口下降，劳动年龄人口预计到 2060 年下降 31%，METI 又提出到 2040 年拿下全球 physical AI 30%
              的目标——为人形机器人创造了全球最具结构吸引力的国家需求画像之一。Japan Airlines 的 Haneda 人形机器人试验（2026 年 5 月）、政府计划在 FY2026 推出的 AI Robotics
              Strategy，以及 Barclays 研究指出日本是主要采用地区，都支撑这一点。但这些信号没有一个是 Genki Robotics 专属。日本需求论点验证的是行业，不是公司。任何用日本劳动力短缺数据作为以
              $1B 投 Genki 理由的投资人，也必须说明为什么将捕获该需求的是 Genki，而不是在日本部署的 Figure AI，或通过 JAL 进入的 Unitree。
            calloutType: insight
            claimRefs:
