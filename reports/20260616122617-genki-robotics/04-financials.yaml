  - id: unit-economics-peer-analogues
    title: "Unit Economics: Peer Analogues and What Cannot Be Known for Genki"
    body: >-
      No unit economics data — gross margin, CAC, payback period, or revenue
      per deployed robot — has been disclosed by Genki Robotics. Financial
      underwriting of Genki's unit economics must rely entirely on peer analogues
      from companies that have advanced further toward commercial deployment,
      none of which have disclosed realized per-unit economics either.


      Figure AI's $675 million Series B with approximately 80 employees provides
      a rough capital-per-headcount benchmark for pre-revenue humanoid R&D
      intensity: approximately USD 8.4 million per employee raised, reflecting
      the hardware-forward nature of the business. Agility Robotics' first two
      commercial RaaS agreements — with GXO and Toyota Manufacturing Canada —
      establish that humanoid robots can be commercially contracted at seven
      units per institutional customer, following a multi-year pilot-to-contract
      cycle, but no per-unit RaaS rate has been disclosed by either party.
      Global humanoid shipments totaled only 13,317 units in 2025, with Figure
      AI, Agility, and Tesla each shipping approximately 150 units, demonstrating
      that the market is still in the single-customer pilot phase for Western
      players. Unitree's G1 at USD 13,500 and its higher-end platforms establish
      that commodity humanoid hardware now exists below USD 25,000, but
      mission-critical deployments require substantially higher-specification
      components, reliability guarantees, and integration services that push
      effective unit economics into a fundamentally different tier.


      Goldman Sachs Research projects significant humanoid demand in structured
      environments where customers may be willing to pay premium pricing for
      robots in dangerous or understaffed roles, directly analogous to Genki's
      stated public safety focus. The unit economics gap for Genki is structural,
      not merely temporal: its stealth posture means no pilot will generate
      publicly verifiable economics data during this diligence window.
