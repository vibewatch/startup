chapter:
  number: 4
  title: Financials
  summary: >-
    Genki Robotics is pre-revenue and operating in full stealth mode as of June
    2026, with no disclosed pricing, customers, BOM, or financial metrics beyond
    a reported $1 billion post-money Series A valuation from April 2026. Financial
    underwriting must rely on structural analogues: Figure AI's 15x valuation
    step-up from Series B to Series C, Agility Robotics' RaaS commercial
    agreements, and Unitree's $13,500 G1 hardware anchor. Capital intensity is
    extreme — a 30–60 person deep-tech team burns an estimated $3–8 million per
    month before any commercial revenue — and the absence of any disclosed BOM,
    gross margin, CAC, or runway constitutes a full blocking diligence gap. The
    chapter concludes that Genki's financials cannot be underwritten without
    direct management-account access, and that technical-skeptic arguments about
    humanoid dexterity timelines compound the risk that capital requirements will
    substantially exceed current consensus estimates before revenue materializes.
sections:
  - id: revenue-model-and-pricing
    title: "Revenue Model and Pricing Architecture: Inferred Streams Only"
    body: >-
      Genki Robotics has disclosed no pricing, contract terms, or revenue model
      as of June 2026. The company operates in stealth mode with no functioning
      public website, no product specifications on any public surface, and no
      confirmed commercial agreements. Any revenue model analysis must therefore
      be constructed from structural logic of the humanoid robotics industry,
      peer company evidence, and the public-mission framing Genki has offered.


      The most likely near-term revenue mechanism for a mission-critical humanoid
      startup targeting public safety and urban maintenance in Japan is either
      direct hardware sale to government agencies or infrastructure operators, or
      a Robot-as-a-Service (RaaS) subscription model in which the provider
      retains hardware-asset ownership and charges a recurring fee per deployed
      unit per period. Agility Robotics' commercial agreements with Toyota Motor
      Manufacturing Canada and GXO (Spanx factory) both operate under RaaS
      structures, demonstrating that recurring-revenue humanoid deployment is
      commercially achievable. Government grant funding under Japan's METI or
      NEDO programs, and milestone payments under public safety procurement
      contracts, could supplement or precede any commercial revenue, particularly
      given Genki's stated public-safety mission alignment with Japan's Society
      5.0 and AI Robotics Strategy frameworks.


      Unitree's publicly listed G1 base price of USD 13,500 establishes the
      current market low-cost anchor for open-market humanoid platforms. Genki's
      mission-critical positioning implies a substantially higher average selling
      price — mission-critical applications have historically supported premium
      ASPs due to reliability requirements, liability coverage, and integration
      complexity — but no confirmation is available and no list price exists.
      Revenue recognition policy is unknown: milestone-based government contracts
      recognize revenue differently from RaaS recurring fees or one-time hardware
      sales, and the chosen mechanism will materially affect revenue quality,
      working-capital requirements, and gross margin structure.
