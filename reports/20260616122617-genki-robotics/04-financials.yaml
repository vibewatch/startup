          note: "Based on 30–60 person deep-tech team proxy and comparable Series A hardware AI startup burn benchmarks"
          claimRef: CI030
        - label: Implied runway from Series A
          low: 12
          high: 36
          unit: months
          note: "Wide range spans high-burn / low-proceeds to low-burn / high-proceeds scenarios; requires management-account verification"
          claimRef: CI001
        - label: Hardware BOM per unit (prototype)
          low: 25
          high: 100
          unit: USD K
          note: "Early-stage full-size humanoid range; Goldman Sachs notes component bottlenecks keep costs elevated at low volume"
          claimRef: CI030
        - label: Valuation to capital raised multiple (sector peer range)
          low: 5
          high: 20
          unit: x
          note: "Figure AI at Series A: ~$675M raised for ~$2.6B post-money ~= 3.9x; step-up expands significantly toward Series C ($39B on ~$2B cumulative)"
          claimRef: CI037
    approximationNotes: >-
      All ranges are estimated from public peer data or structural inference;
      no Genki financial figure has been directly confirmed. Ranges should be
      treated as scenario planning inputs, not investment-grade projections.
