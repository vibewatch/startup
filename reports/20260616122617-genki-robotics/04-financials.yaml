  - id: FI004
    title: Capital intensity waterfall — estimated annual burn structure for a pre-revenue humanoid startup at Genki's stage
    type: waterfall
    layout: standard
    summary: >-
      Indicative breakdown of annual cash consumption across four burn
      categories, plus total; all figures are estimated from peer analogs and
      industry benchmarks, not Genki disclosures.
    data:
      items:
        - label: Engineering and R&D salaries (est.)
          value: -36
          note: 30–60 FTE robotics engineers, AI researchers, mechanical designers in Japan/US; USD 3M/month midpoint
        - label: Hardware prototyping and materials (est.)
          value: -12
          note: Component procurement, actuators, sensors, frame fabrication; 2–4 prototype iterations per year
        - label: AI compute and cloud infrastructure (est.)
          value: -6
          note: GPU compute for model training, simulation, and data collection; growing cost category
        - label: Japan operations, G&A, legal, FX overhead (est.)
          value: -6
          note: Tokyo commercial real estate, compliance, intellectual property, visa/employment overhead
        - label: Total estimated annual burn (midpoint scenario)
          value: -60
          note: "USD 5M/month midpoint; actual figure could be higher with accelerated prototyping or lower with lean team; not confirmed"
    approximationNotes: >-
      All values are midpoint estimates in USD millions per year. Actual burn
      will vary materially with team size, prototype cadence, and compute usage.
      No Genki management-account disclosure supports any of these figures.
    claimRefs:
      - CI007
      - CI028
      - CI029

callouts:
  - calloutType: risk
    title: Full financial diligence is blocked — no revenue, BOM, or cash position disclosed
    body: >-
      Every standard financial underwriting gate is unavailable for Genki
      Robotics. Investors cannot assess revenue quality (null), gross margin
      (null), CAC payback (null), cash runway (unknown), or debt obligations
      (unconfirmed). This is not a gap that can be bridged by analogues; it
      requires direct data-room access to management accounts, the signed Series
      A term sheet, and a CFO-level financial review covering at least six months
      of actuals.
    claimRefs:
      - CI003
      - CI004
      - CI033
      - CI038
  - calloutType: insight
    title: Figure AI's 15x Series B-to-C step-up signals the sectoral valuation narrative available to Genki
    body: >-
      Figure AI progressed from $2.6 billion at Series B (February 2024) to
      $39 billion at Series C (September 2025) in under twenty months, a 15x
      step-up built on commercial traction signals rather than confirmed positive
      margins. Genki's $1 billion Series A entry positions it at the beginning
      of this potential trajectory, but the critical gate between A and B is
      demonstrating a credible path to commercial deployment — something Figure
      required BMW as a reference customer to achieve.
    claimRefs:
      - CI005
      - CI006
      - CI037
  - calloutType: recommendation
    title: Three minimum diligence gates before any financial judgment can be responsibly rendered
    body: >-
      First, obtain the signed Series A term sheet and cap table to confirm round
      size, ownership structure, and any anti-dilution or liquidation provisions.
      Second, review management accounts covering at least six trailing months to
      establish a verified burn rate and cash-on-hand figure. Third, request a
      prototype milestone schedule with evidence of progress — photos, video, or
      engineering specification — to validate that Series A capital is producing
      hardware results sufficient to support a Series B fundraise.
    claimRefs:
      - CI001
      - CI030
      - CI039

