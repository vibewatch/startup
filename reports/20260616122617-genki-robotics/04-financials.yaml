  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: burn-rate
      missingEvidence: >-
        Management accounts covering at least six trailing months, showing
        monthly cash consumption by cost category and cash-on-hand balance.
      whyItMatters: >-
        Without verified burn rate and cash position, runway cannot be calculated
        and the risk of funding gap before Series B cannot be assessed.
      diligencePath: >-
        Request management accounts from Genki's CFO or COO as part of Series A
        data-room review. Cross-check against payroll records and bank statements.
      relatedQuestionRefs:
        - QI002
        - QI022
        - QI023
    - type: private-evidence-only
      severity: blocking
      topic: genki-funding
      missingEvidence: >-
        Signed Series A term sheet or preferred share subscription agreement
        confirming round size, pre-money valuation, share class, liquidation
        preferences, and anti-dilution provisions.
      whyItMatters: >-
        The $1B post-money valuation is unverified at the term-sheet level;
        ownership structure, pro-rata rights, and downside protection are
        entirely unknown and material to IRR modeling.
      diligencePath: >-
        Request the executed Series A term sheet and cap table from Genki
        legal counsel or directly from Playground Global as lead investor.
      relatedQuestionRefs:
        - QI001
    - type: private-evidence-only
      severity: blocking
      topic: revenue-disclosure
      missingEvidence: >-
        Confirmation of pre-revenue status or disclosure of any revenue, LOI,
        pilot contract, or commercial agreement summary, including terms and
        revenue recognition policy.
      whyItMatters: >-
        Revenue recognition policy and contract structure determine revenue
        quality, gross margin profile, and cash conversion cycle — none of
        which can be assessed without this information.
      diligencePath: >-
        Request revenue schedule and any executed LOI, pilot agreement, or
        commercial contract from the data room. Ask for revenue recognition
        policy memo from Genki's accounting function.
    - type: missing-source
      severity: material
      topic: financial-leadership
      missingEvidence: >-
        Confirmation of a CFO, VP Finance, or equivalent financial officer
        appointment on the Genki Robotics leadership team.
      whyItMatters: >-
        Absence of a senior financial officer at Series A stage is a
        governance gap that increases risk of inadequate financial controls,
        inaccurate management accounts, and delayed Series B preparation.
      diligencePath: >-
        Request the Genki organizational chart and confirm financial leadership
        hiring status. If no CFO is present, assess whether a fractional CFO
        or advisors are engaged.
      relatedQuestionRefs:
        - QI012
    - type: missing-source
      severity: material
      topic: japan-policy
      missingEvidence: >-
        Specific documentation of any METI, NEDO, or municipal government grant
        application, award, or co-development agreement with Genki Robotics.
      whyItMatters: >-
        Government non-dilutive funding could materially extend runway and
        provide revenue recognition events; its absence or presence is a
        first-order financial planning variable.
      diligencePath: >-
        Search METI and NEDO public award databases for Genki Robotics corporate
        name; request grant status disclosure from management as part of due
        diligence.
      relatedQuestionRefs:
        - QI026
        - QI019
    - type: private-evidence-only
      severity: material
      topic: investors
      missingEvidence: >-
        Cap table showing all co-investors in the Series A beyond Playground
        Global, including ownership percentages, share class rights, and any
        strategic investor rights provisions.
      whyItMatters: >-
        Co-investor identity and rights affect information flow, governance,
        future dilution expectations, and strategic partnership pipeline — all
        material to financial underwriting.
      diligencePath: >-
        Request full cap table from Genki legal counsel; confirm with Playground
        Global whether any co-investors or strategic investors participated in
        the Series A round.
