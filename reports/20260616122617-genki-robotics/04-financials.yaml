        - Supports outsized valuation narratives for AI-adjacent physical platforms; weakening of this thesis creates sector-wide valuation compression risk ahead of Genki's Series B
        - Medium
    notes: >-
      All entries are sector-level signals, not Genki-specific disclosures.
      Each has a direct financial implication for Genki's cost structure,
      fundraising environment, or strategic partner pipeline that is currently
      unverifiable given the company's stealth posture.
    claimRefs:
      - CI043
      - CI044
      - CI045
      - CI046
      - CI047
      - CI048

figures:
  - id: FI001
    title: Revenue model bridge — how customer activity could convert to gross profit for Genki
    type: flow
    layout: standard
    summary: >-
      Hypothetical revenue conversion path from mission-critical demand through
      procurement, revenue event, and gross margin realization; all intermediate
      nodes are inferred from peer structures, not confirmed Genki disclosures.
    data:
      nodes:
        - id: demand
          label: Mission-critical demand trigger
          detail: "Government or enterprise need: public safety event, infrastructure inspection requirement, or urban maintenance program; Japan labor shortage creates urgency"
        - id: procurement
          label: Procurement or contract event
          detail: "Government RFP award, enterprise pilot agreement, or direct negotiation; Japan institutional procurement typically requires multi-year pilot before commercial commitment"
        - id: revenue-event
          label: Revenue recognition event
          detail: "Hardware delivery (one-time ASP) or RaaS period activation (recurring); revenue timing and policy undisclosed for Genki; both mechanisms used by peers"
        - id: service-cost
          label: Service delivery cost
          detail: "Integration labor, field support, software updates, spare parts, and reliability guarantees; material unknown cost layer that offsets gross revenue"
        - id: gross-profit
          label: Gross margin realization
          detail: "Revenue minus BOM, assembly, service delivery, and integration overhead; unknown for Genki; negative at prototype volume, path to positive margins requires scale"
        - id: gap-node
          label: Financial visibility gap
          detail: "No ASP, BOM, service cost, or gross margin data publicly available; full diligence required before any gross-margin modeling is credible"
      edges:
        - from: demand
          to: procurement
          label: triggers
        - from: procurement
          to: revenue-event
          label: unlocks
        - from: revenue-event
          to: service-cost
          label: offset by
        - from: service-cost
          to: gross-profit
          label: yields
        - from: gross-profit
          to: gap-node
          label: currently blocked by
    approximationNotes: >-
      All nodes beyond demand trigger are inferred from Agility RaaS and peer
      hardware-sale structures; no Genki-specific confirmation exists for any
      step in this chain.
    claimRefs:
      - CI035
      - CI036
      - CI041

  - id: FI002
    title: Unit economics bridge — peer-derived inputs for a mission-critical humanoid RaaS model
    type: flow
    layout: standard
    summary: >-
      Unit economics pathway from hardware BOM through deployment to annual
      service revenue; all values are peer estimates or null for Genki; the
      gross margin node is explicitly unknown.
    data:
      nodes:
        - id: bom
          label: Hardware BOM per unit
          detail: "Est. USD 25K–100K for early-stage full-size humanoid prototype; actuators, compute, sensors, frame; wide range reflects prototype vs. commercial-spec divergence"
        - id: assembly
          label: Assembly and integration cost
          detail: "Unknown for Genki; typically 50–100% of BOM at prototype volume; Japan manufacturing or contracted assembly; reduces at scale"
        - id: deployment
          label: Deployment and customer integration
          detail: "Per-site integration labor, safety validation, workflow adaptation; estimated USD 20K–50K per customer at initial deployment; not disclosed"
        - id: service-revenue
          label: Annual service revenue per unit (RaaS)
          detail: "Peer analog: est. USD 75K–150K per robot per year based on Agility commercial structure (no confirmed rack rate); Genki ASP unknown"
        - id: gross-margin-unit
          label: Gross margin per robot
          detail: "Unknown / null; breakeven not determinable before BOM, ASP, and service cost disclosures; negative at early deployment; path to positive requires disclosed assumptions"
      edges:
        - from: bom
          to: assembly
          label: adds to
        - from: assembly
          to: deployment
          label: precedes
        - from: deployment
          to: service-revenue
          label: enables
        - from: service-revenue
          to: gross-margin-unit
          label: drives
    approximationNotes: >-
      BOM and service revenue are industry estimates from peer companies; none
      are confirmed Genki figures. Assembly cost percentage derived from
      industry norms for prototype robotics manufacturing. Gross margin node is
      explicitly null pending management-account disclosure.
    claimRefs:
      - CI010
      - CI011
      - CI020

  - id: FI003
    title: Financial estimate ranges — key inputs for Genki Robotics scenario modeling
    type: range
    layout: standard
    summary: >-
      Source-backed low and high bounds for five key financial inputs; wide
      ranges reflect the stealth-company information vacuum; all estimates carry
      low confidence and must be superseded by data-room disclosure.
    data:
      items:
        - label: Series A implied proceeds
