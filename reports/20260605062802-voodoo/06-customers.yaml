- id: TU005
  title: Expansion and concentration risk table
  columns:
  - expansion driver
  - concentration risk
  - impact
  - diligence path
  rows:
  - - Cross-promotion across 8B+ lifetime downloads
    - Top-title or genre dependence if legacy game franchises slow
    - Can lower CAC but masks per-title decay
    - Request UA spend, organic/cross-promo mix, and title-level ROAS
  - - LiveOps and IAP in hybrid/casual games
    - Ad-load fatigue and low day-30 retention can cap LTV
    - Supports longer franchise life but requires careful ad balance
    - Review cohort retention, payer conversion, ad complaints, and refund data
  - - Creator and studio partner funnel
    - Dependence on external studios without disclosed rev-share terms
    - Broadens supply but may pressure margins
    - Review partner contracts, revenue shares, and churn
  - - BeReal social advertising
    - Audience stabilization may not become renewed growth
    - Diversifies revenue but could damage authenticity if ads overrun feed
    - Request DAU/MAU, ad load tests, brand lift, and churn after ad exposure
  - - Brand advertiser products
    - Repeat-spend and top-advertiser concentration unknown
    - Could improve monetization quality if brand demand is durable
    - Request advertiser cohort, NRR, top-10 revenue share, and campaign renewal rates
  notes: Risks are stated as diligence paths because public sources do not disclose top-customer, top-title, or
    top-advertiser concentration.
