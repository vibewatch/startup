- id: adoption-scale
  title: Adoption scale and trajectory
  body: 'The strongest public customer signal is reach. Voodoo claims 169 million monthly active users and 1.5 billion
    annual downloads for 2025, after claiming 950 million downloads and 150 million MAUs in 2024. Third-party and
    partner sources are directionally consistent with an eight-billion-plus lifetime-download footprint. The most
    granular title-level proof comes from Mob Control: Udonis reports 302.1 million lifetime downloads, 14.5 million
    average monthly players, 2.4 million average daily players, and 4.7% day-30 retention. Storefront review bases
    are also large: Mob Control has 417K App Store ratings, Paper.io 2 has 2.7M App Store ratings and 2.14M Google
    Play reviews, and BeReal has 1.1M App Store ratings. These are adoption proxies rather than audited active-user
    files; they prove broad usage and feedback volume, not cohort-level LTV or churn.'
  claimRefs:
  - CU002
  - CU003
  - CU004
  - CU012
  - CU013
  - CU014
  - CU016
  - CU017
  - CU024
  - CU025
  tableRefs:
  - TU002
  figureRefs:
  - FU002
- id: named-proof
  title: Named proof and reference quality
  body: The named-customer evidence is uneven because Voodoo’s largest consumers are anonymous app users. The highest-quality
    named proof is therefore not an enterprise logo wall; it is a combination of named products with live storefronts,
    app-store review volumes, named partner/customer-proof pages, and a small set of disclosed advertiser examples
    for BeReal. Mob Control and Paper.io 2 have public storefronts and independent analytics/review corroboration,
    making them strong production proof for game-player adoption. BeReal has official acquisition, app-store, Sifted,
    and ad-study evidence that it remains a meaningful social community, but reported user counts differ between
    30M stabilized monthly users and the earlier 40M-plus acquisition figure. For advertiser customers, BeReal’s
    Nielsen-backed study and Charle’s roundup mention brand activity including Nike, Netflix, Amazon, and Levi’s,
    but they do not disclose spend, renewals, or contract duration.
  claimRefs:
  - CU008
  - CU009
  - CU010
  - CU011
  - CU012
  - CU013
  - CU014
  - CU016
  - CU039
  tableRefs:
  - TU003
  figureRefs:
  - FU003
- id: retention-satisfaction
  title: Retention, satisfaction, and adverse user signals
  body: 'Retention proof is directionally positive but incomplete. Mob Control’s 4.7% day-30 retention and mature-live-game
    player base are the clearest public cohort proxy, while Voodoo’s claim that nearly 80% of 2024 income came from
    games live for more than two years indicates durable monetization across older titles. BeReal’s engagement proof
    is more contested: the acquisition release described more than 40 million active users and half using the app
    at least six days per week, but Sifted later reported stabilization at about 30 million monthly users after
    a declining period. Adverse customer evidence matters because advertising is core to the model. Google Play
    reviews for Paper.io 2 complain that ads can be unescapable or make play unplayable, and Voodoo’s response acknowledged
    the ad-balance problem. That creates an underwriting tension: ads fund scale, but excessive ad friction can
    damage retention and brand safety.'
  claimRefs:
  - CU008
  - CU009
  - CU015
  - CU023
  - CU024
  - CU025
  - CU027
  - CU028
  - CU029
  - CU037
  tableRefs:
  - TU004
  figureRefs:
  - FU004
- id: expansion-concentration
  title: Expansion loops and concentration risks
  body: 'Voodoo’s expansion loop is credible but not fully quantified. The company can cross-promote new games inside
    a massive installed base, use creative and market-intelligence tools to improve user acquisition, and use LiveOps,
    rewarded ads, season passes, and in-app purchases to extend title lifespans. Creator-side partners expand supply:
    Voodoo’s official current claim of over 150 partner studios is supplemented by Udonis’s broader historical claim
    of over 2,000 studio partners. BeReal extends the model into social advertising, with Voodoo reporting €30M
    of 2025 BeReal revenue and strong Japan momentum, but public evidence still does not show advertiser NRR, repeat-spend
    curves, or a safe ad-load ceiling. Concentration risk remains material: Sifted reports games still generate
    90% of revenue, and no public source discloses revenue by top title, top advertiser, studio partner, or geography.'
  claimRefs:
