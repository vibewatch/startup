figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Voodoo turns anonymous users and creators into monetizable loops through games, social apps, ads, and
    publishing.
  data:
    items:
    - label: Consumer discovery
      actor: Mobile app user
      touchpoints:
      - App Store
      - Google Play
      - cross-promotion
      - paid ads
      painpoint: Needs quick entertainment or social connection with low onboarding friction.
      opportunity: Voodoo can acquire and cross-promote across a very large installed base.
    - label: Game or social onboarding
      actor: Player or BeReal/Wizz user
      touchpoints:
      - Tutorial
      - daily notification
      - chat/social feed
      - privacy prompts
      painpoint: Must see value quickly before churn or ad fatigue.
      opportunity: Simple mechanics and daily prompts create repeatable first sessions.
    - label: Engagement loop
      actor: Active user
      touchpoints:
      - Live events
      - season pass
      - daily BeReal post
      - messages
      - missions
      painpoint: Novelty can decay without fresh content or social relevance.
      opportunity: LiveOps and social mechanics extend usage beyond install.
    - label: Monetization event
      actor: Advertiser or paying user
      touchpoints:
      - Rewarded video
      - interstitial
      - IAP
      - no-ads purchase
      - BeReal native ad
      painpoint: Ads can harm user experience if load or reliability is poor.
      opportunity: Brand-safe and native formats convert attention into revenue.
    - label: Creator/studio loop
      actor: External studio or creator
      touchpoints:
      - Academy
      - publishing tools
      - testing dashboard
      - SDK
      - creative feedback
      painpoint: Prototype economics and revenue share are opaque publicly.
      opportunity: Partner supply expands the portfolio without relying only on first-party teams.
  approximationNotes: Qualitative journey synthesized from official publishing, ads, BeReal, storefront, and partner-proof
    sources.
