slug: voodoo
runDate: '2026-06-05'
company:
  name: Voodoo
chapter:
  number: 6
  title: Customers
  summary: 'Voodoo has real and unusually broad customer proof for a private consumer-app company: 169M company-claimed
    MAUs, 1.5B annual downloads, strong Mob Control and Paper.io storefront evidence, and a separate BeReal social
    community. The diligence caveat is durability: public sources expose scale, reviews, and some retention proxies,
    but not advertiser renewals, cohort LTV, studio-partner churn, or top-title/customer concentration.'
sections:
- id: customer-map
  title: 'Who the “customer” is: players, social users, advertisers, and studios'
  body: 'Voodoo is not a classic enterprise software company with a visible account list. Its customer proof is
    distributed across consumer attention and supply-side creation. The largest segment is free-to-play mobile game
    players reached through titles such as Mob Control and Paper.io 2; those users pay indirectly through ad impressions
    and directly through season passes, gems, no-ads purchases, and other in-app purchases. BeReal and Wizz add
    a separate social-app community whose core behavior is not game play: BeReal is a daily authenticity network
    and Wizz is a chat/social discovery app. A third customer class is advertisers and brands buying mobile attention
    through Voodoo game inventory or BeReal’s dual-camera ad formats. A fourth class is creator/publisher-side partners:
    external studios and individual developers who use Voodoo’s publishing, SDK, testing, creative, and Academy
    infrastructure. This makes Voodoo’s customer diligence a two-sided question: verify real consumer engagement,
    then verify whether advertisers and studio partners repeatedly monetize that engagement.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU005
  - CU006
  - CU007
  - CU017
  - CU018
  - CU019
  - CU033
  - CU038
