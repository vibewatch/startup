callouts:
- calloutType: strength
  title: Scale is real, but most users are anonymous
  body: Voodoo has unusually strong public reach proof for a private consumer-app company, yet the proof comes from
    downloads, MAUs, storefronts, and reviews rather than named account references.
  claimRefs:
  - CU002
  - CU003
  - CU004
  - CU012
  - CU039
- calloutType: risk
  title: Ads are both monetization engine and user-experience risk
  body: The same ad inventory that drives revenue also appears in adverse Google Play reviews, so private diligence
    should quantify complaint rates, retention after ad exposure, and ad-load ceilings.
  claimRefs:
  - CU005
  - CU015
  - CU021
  - CU037
- calloutType: recommendation
  title: Ask for cohorts, not more logos
  body: The largest diligence upgrade would be private cohorts by title and app, advertiser renewal data, and partner-studio
    economics; public logos and installs cannot answer durability.
  claimRefs:
  - CU032
  - CU036
  - CU040
