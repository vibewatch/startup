  - id: section-4
    title: BeReal and consumer social app competitive adjacency
    body: >-
      BeReal competes in a far more asymmetric environment than Voodoo's gaming portfolio. Its core mechanic — a
      simultaneous dual-camera notification prompt creating unfiltered daily photos — directly competes for Gen Z
      social time against platforms whose scale exceeds BeReal's by two orders of magnitude.


      Instagram had approximately 2.4 to 3 billion monthly active users in 2026. TikTok had approximately 1.9 to
      2 billion MAU. Snapchat had approximately 850 to 932 million MAU. BeReal's MAU is contested: Voodoo CEO Yazdi
      stated in May 2025 that the user base stabilized at approximately 30 million (having peaked at 73.5 million in
      2022), while other company-referenced sources cite 40 million; external analytics provider Business of Apps
      placed 2024 MAU at 16 million, a 2x to 2.5x discrepancy unresolved in any public source. BeReal generated
      €30 million in advertising revenue in 2025 under Voodoo ownership, having broken even from a $3 million
      monthly cash burn at acquisition — a meaningful operational turnaround, but representing less than 4% of
      Voodoo's 2025 total revenue. Total BeReal lifetime downloads reached 115 million, with approximately 73.5
      million concentrated in the viral 2022 period, indicating organic new-user growth is structurally stalled.


      Instagram and TikTok have both introduced features directly copying BeReal's core mechanic — Instagram Candid
      Stories and TikTok Now (integrated into TikTok's main feed). The ease of feature replication by platforms with
      vastly larger distribution, algorithm-driven discovery, and entrenched social graphs is the most material
      structural threat to BeReal's positioning. BeReal's counter-argument — that its no-algorithm, no-filter,
      no-follower-count design philosophy creates a distinct authentic social norm that cannot be replicated by
      attention-maximizing platforms — has cultural credibility among its 18-to-24-year-old Gen Z demographic.
      Approximately 72% of BeReal's active users open the app within 3 minutes of the daily notification, a daily
      engagement intensity that outpaces Snapchat's comparable retention metric for its core Gen Z cohort.


      Snapchat is the most comparable competitor by demographic alignment and social-graph model: ephemeral,
      peer-to-peer, less algorithmic than Instagram or TikTok. Snapchat's 850–932 million MAU base and over 75% US
      Gen Z penetration (ages 13–34) creates a strong substitution risk for BeReal's target audience. Instagram's
      Gen Z usage declined approximately 9% year-over-year by 2025, reflecting a structural demand shift toward less
      curated platforms — but BeReal competes for that reallocated attention simultaneously against Snapchat, Threads,
      Lemon8, and other authenticity-adjacent entrants. No social graph lock-in analogous to Snapchat's streak
      mechanic or WhatsApp's contact-import moat has been demonstrated at BeReal scale.
