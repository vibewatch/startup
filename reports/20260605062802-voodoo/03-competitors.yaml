  - id: section-2
    title: Direct hybrid-casual publisher profiles
    body: >-
      Rollic Games, owned by Zynga (a Take-Two Interactive subsidiary), is Voodoo's most direct and financially
      powerful competitor in hybrid-casual publishing. Rollic generated $16.57 million in hybrid-casual IAP revenue
      in March 2026, ranking second behind Loom Games. The studio surpassed 3.9 billion lifetime installs across its
      portfolio by Take-Two's FY2026 close (fiscal year ending March 2026). Color Block Jam by Rollic generated
      $42 million in revenue and 21.8 million downloads in a single quarter (Q2 2025), one of the largest quarterly
      performances by a single hybrid-casual title on record. Rollic's monthly IAP peaked at $23.5 million in late
      2025. Rollic benefits from Take-Two's consolidated FY2026 mobile revenue of $3.3 billion (out of $6.7B total
      net bookings), Zynga's global distribution network, and potential access to Rockstar and 2K IP licenses
      unavailable to independent publishers. Its direct titles — Screw Jam, Color Block Jam, Crowd Express, Timeline
      Up, and Knit Out — compete directly with Voodoo's Block Jam 3D and Mob Control for player attention and UA
      auction inventory on the same demand-side platforms. Rollic's concentration in puzzle and live-ops mechanics
      mirrors Voodoo's genre profile, creating the most direct product overlap in the competitive set.


      Homa Games, the third member of the French Triad alongside Voodoo and Madbox, is based in Paris and has raised
      approximately $165 million in total funding from investors including Headline, Northzone, and Idinvest Partners.
      In Q3 2025, Homa ranked second among hybrid-casual publishers by IAP revenue with $17.6 million, narrowly
      trailing Voodoo ($17.9 million). By March 2026 Homa ranked seventh at $7.84 million, a relative weakening.
      Homa generated approximately 70 million downloads in Q3 2025. The company is recognized for data-driven rapid
      prototyping and strong performance in puzzle and arcade sub-genres: All In Hole was the first hybrid-casual title
      to achieve $4 revenue per download (RPD) in August 2024, an RPD record at the time. Homa also operates a
      third-party studio publishing platform analogous to Voodoo's. Its main differentiation from Voodoo is a more
      concentrated puzzle/arcade genre emphasis; its limitation relative to Voodoo is smaller disclosed funding and
      absence of a BeReal-equivalent consumer social asset.


      Tripledot Studios (London, founded 2017) transformed its competitive profile in May 2025 through the acquisition
      of AppLovin's entire mobile games studio portfolio for approximately $800 million, structured as roughly half
      cash and half equity with AppLovin becoming a minority shareholder. Following the deal, Tripledot reached nearly
      $2 billion in annual gross revenue, 25 million daily active users, and 12 studios in 23 cities globally,
      making it one of the top five independent mobile game publishers by revenue. Titles include Woodoku,
      Solitaire.com, and the acquired Lion Studios portfolio (Hexa Sort, Wordle!, Wordscapes via PeopleFun, Project
      Makeover via Magic Tavern). Tripledot's revenue diversification is a structural distinction: no single game
      accounts for more than 10% of net revenue post-acquisition, contrasting with Voodoo's higher concentration in
      Mob Control and Block Jam 3D. Tripledot's primary genre strength is word puzzle and solitaire, with less direct
      overlap with Voodoo's arcade/action-puzzle emphasis — but it competes for the same casual UA inventory, platform
      chart positions, and user attention.


      Supersonic Studios, historically owned by Unity following the ironSource merger in 2022, is in structural
      transition as of the 2026 diligence date. Unity announced on March 27, 2026 that it would shut down the
      ironSource Ads Network on April 30, 2026, and hired a financial advisor to manage Supersonic's divestiture.
      As of October 2024, Supersonic served approximately 190 million monthly active users across 130+ published
      titles with 6.6 billion lifetime downloads since its February 2020 launch. The forced divestiture removes a
      major competitive pressure source from the hybrid-casual publisher landscape; if acquired by a well-capitalized
      operator, competitive pressure could reconsolidate rapidly.
