callouts:
  - calloutType: risk
    title: BeReal's moat is thin and being actively cloned by incumbents 60–100x its size
    body: >-
      BeReal's core mechanic — simultaneous dual-camera unfiltered daily photo — has been directly replicated by
      Instagram (Candid Stories) and TikTok (Now), platforms with 60–100x BeReal's MAU. The social graph is shallow,
      switching costs are near-zero, and no messaging or streak mechanic provides the structural lock-in that
      sustains Snapchat's Gen Z retention. The most credible moat-building path requires product features that will
      take multiple years to develop against entrenched incumbents who can outspend Voodoo substantially.
    claimRefs:
      - CP016
      - CP019
      - CP025
      - CP032

  - calloutType: insight
    title: Supersonic's forced exit creates a material M&A window for hybrid-casual publishers
    body: >-
      Unity's decision to shut down the ironSource Ads Network and divest Supersonic Studios removes one of the
      largest hybrid-casual publishers from the independent competitive pool. Supersonic's 6.6 billion lifetime
      downloads and 190 million monthly active users represent a significant scale asset. If Voodoo or another
      well-capitalized publisher acquires Supersonic's portfolio, the competitive dynamics in hybrid-casual
      publishing could restructure substantially in favor of the acquirer. The absence of a disclosed buyer as of
      the diligence date leaves this outcome unresolved.
    claimRefs:
      - CP013
      - CP014
      - CP036

