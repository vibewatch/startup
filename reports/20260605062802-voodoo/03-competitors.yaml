  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: competitor-revenue-opacity
      missingEvidence: >-
        Total hybrid-casual revenue (IAP plus advertising combined) for Rollic, Homa, and other private publishers
        is not publicly disclosed; only IAP-only revenue is available from third-party tracking services.
      whyItMatters: >-
        Advertising revenue alongside IAP is a meaningful component of hybrid-casual publisher economics.
        Without it, comparisons between Voodoo's total gaming revenue and peers' IAP-only figures
        systematically overstate Voodoo's relative lead, as Voodoo's revenue includes both streams.
      diligencePath: >-
        Request combined IAP plus advertising revenue from AppMagic or Sensor Tower enterprise hybrid-casual
        reports; cross-check Rollic's contribution to Take-Two's Zynga advertising revenue line in SEC filings;
        request Homa revenue breakdown in a private data room if available.
      relatedQuestionRefs:
        - QP002
        - QP019

    - type: missing-source
      severity: material
      topic: BeReal-CPM-advertising-economics
      missingEvidence: >-
        No third-party source provides a direct comparison of BeReal's advertising CPM rates versus Instagram's
        or Snapchat's for the Gen Z 18–24 demographic, nor is BeReal's advertising ARPU independently disclosed
        or verifiable.
      whyItMatters: >-
        BeReal's investment thesis as a monetizable social asset depends on its ability to command a premium
        CPM for authenticated Gen Z inventory. Without comparative CPM data, the advertising revenue ceiling
        for BeReal cannot be assessed relative to incumbent platforms, and the €30M 2025 revenue figure
        cannot be attributed to CPM quality versus simply inventory scale.
      diligencePath: >-
        Obtain BeReal's CPM rate card from Voodoo in the data room; commission primary research using eMarketer
        or WARC Gen Z CPM benchmarks; request advertiser retention and renewal rates for BeReal brand partnerships.
      relatedQuestionRefs:
        - QP011

    - type: missing-source
      severity: minor
      topic: Supersonic-acquisition-outcome
      missingEvidence: >-
        No public source has disclosed the identity of a buyer for Supersonic Studios as of the June 2026
        diligence date. The sale process was announced March 27, 2026 with a financial advisor engaged but
        no transaction has been publicly announced.
      whyItMatters: >-
        The identity of Supersonic's acquirer materially affects competitive dynamics in hybrid-casual
        publishing. If a well-capitalized publisher (Scopely, Voodoo, a major Chinese group) acquires
        Supersonic's 6.6B-download asset base, it could reconcentrate competitive pressure or create a
        new scaled challenger in the category.
      diligencePath: >-
        Monitor public M&A announcements from Unity, Scopely, Voodoo, and large Chinese mobile publishers
        for Supersonic bid announcements; check SEC filings for any material deal disclosures post-April 2026.
      relatedQuestionRefs:
