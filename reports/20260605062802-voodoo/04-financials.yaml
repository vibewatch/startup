  rows:
  - - Hybrid/casual games
    - Free-to-play games monetized through ads and IAP
    - $653M 2025 gaming revenue claimed by company
    - Stronger than legacy hyper-casual because existing portfolio grew
    - Game-level revenue, IAP/ad split, platform fees
  - - Legacy hyper-casual
    - High-volume ad inventory in simple games
    - Hyper-casual now legacy; old model had up to 40% annual declines
    - Lower durability and more eCPM sensitive
    - Remaining revenue share by title vintage
  - - Partner publishing
    - Voodoo scales external/internal titles through UA, monetization and cross-promotion
    - PocketGamer says 10 hybrid-casual games generated $20M-$100M/year
    - Useful proxy but not margin disclosure
    - Studio rev-share and UA recoupment waterfalls
  - - BeReal social app
    - Consumer social advertising and possible paid features
    - About €30M 2025 social-app revenue claimed
    - Early and less proven than games
    - Ad load, ARPDAU, retention cohorts by market
  - - Other apps such as Wizz/Jamble
    - Consumer app growth and monetization experiments
    - Disclosed in product narrative but not separately quantified
    - Promising but not underwritable separately
    - Product P&Ls and acquisition spend by app
  notes: Company-claimed values are separated from third-party proxies; no row should be read as audited segment
