- id: gtm-and-unit-economics
  title: GTM efficiency, publishing economics, and unit-economics gaps
  body: 'The operating model is a scaled consumer acquisition machine. Voodoo uses user acquisition, monetization,
    cross-promotion, and publishing infrastructure to identify and scale titles, while external studios and acquired/internal
    teams supply product capacity. Public sources give useful directional proxies: PocketGamer reported that 10
    hybrid-casual games generated $20 million to $100 million per year, and Voodoo reported $653 million of 2025
    gaming revenue. The underwriting problem is that no reviewed source discloses CAC, payback, ARPDAU, ad eCPM,
    platform fees, gross margin, revenue share with partner studios, or game-by-game contribution margin. Financial
    diligence therefore has to move from public revenue proof to private cohort files: spend by channel, CPI, ROAS
    curves, retention by geography, IAP versus ad split, store fees, and studio rev-share terms.'
  claimRefs:
  - CI006
  - CI028
  - CI029
  - CI030
  - CI031
  - CI041
  - CI042
  tableRefs:
  - TI003
  figureRefs:
  - FI002
- id: bereal-financial-profile
  title: BeReal monetization and adverse evidence
  body: 'BeReal is the main non-game financial swing factor. Voodoo paid €500 million for the asset, reported more
    than 40 million active users at signing, and later said the social-app layer generated about €30 million of
    2025 revenue. Independent reporting supports the turnaround narrative only partially: Sifted said the app was
    loss-making with a declining user base before acquisition and later reached break-even, while TechCrunch said
    BeReal had been running out of funding. Skeptical usage evidence remains material. Sensor Tower reported that
    BeReal MAUs declined on average 2% year over year per month from November 2023 through May 2024, and Business
    of Apps characterized the app as struggling to retain users long term. BeReal can be profitable under light
    advertising and cost control, but public data do not yet prove a durable ad load, ARPDAU, cohort retention,
    or brand-demand curve.'
  claimRefs:
  - CI008
  - CI009
  - CI010
  - CI011
  - CI012
  - CI013
  - CI014
  - CI015
