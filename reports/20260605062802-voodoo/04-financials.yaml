- id: capital-adequacy
  title: Capital adequacy, valuation context, and financing dependency
  body: 'The financing history gives Voodoo strategic flexibility, but it does not substitute for a current cash-flow
    statement. Third-party and investor sources report a Goldman Sachs investment of roughly $200 million in 2018,
    Tencent taking a minority stake at a reported $1.4 billion valuation in 2020, and GBL investing €266 million
    at a €1.7 billion post-money equity value in 2021. Sacra estimates $812 million of total funding and a $2.1
    billion 2022 valuation; PitchBook lists Voodoo as private. Those datapoints explain historical capacity to acquire
    studios and BeReal, but the current balance-sheet picture is unavailable: no reviewed source discloses cash
    on hand, debt, monthly burn, runway, BeReal earnout obligations, or studio acquisition liabilities. Reported
    profitability reduces but does not eliminate financing dependency because consumer-app portfolios still require
    large user-acquisition budgets and platform-fee exposure.'
