- id: financial-verdict
  title: Financial verdict and diligence priorities
  body: 'Voodoo earns a positive revenue-quality mark on scale and growth, a mixed mark on margin evidence, and
    a caution flag on BeReal. The company has better top-line disclosure than many private gaming peers: 2024 revenue,
    2024 EBITDA, 2025 revenue, gaming revenue, and social-app revenue are all publicly stated. However, underwriting
    value requires separating company-claimed performance from independent estimates and from unavailable private
    metrics. The immediate diligence path is narrow and concrete: obtain audited consolidated financials, bridge
    EUR and USD revenue disclosures, reconcile game revenue versus BeReal and other apps, obtain gross margin and
    studio-rev-share schedules, validate user-acquisition payback by cohort, and review cash, debt, earnouts, and
    planned uses of funds. Without those files, the financial case is investable only as a growth-and-profitability
    story, not as a fully modelable cash-flow asset.'
