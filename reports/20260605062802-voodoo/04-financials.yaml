company:
  name: Voodoo
chapter:
  number: 4
  title: Financials
  summary: Voodoo is an unusually transparent private consumer-app company on top-line growth but remains opaque
    on underwriting-grade unit economics. Public evidence supports company-claimed revenue of €623 million in 2024
    and $778 million in 2025, 2024 EBITDA of €135 million, and a strategic mix shift toward longer-lived hybrid/casual
    games plus a nascent BeReal ad business; the largest diligence blockers are cash, debt, burn, gross margin,
    CAC/payback, and cohort-level BeReal monetization.
sections:
- id: revenue-model
  title: Revenue model and mix quality
  body: 'Voodoo monetizes a portfolio of free-to-play mobile games and consumer apps rather than subscription software.
    The highest-confidence financial anchor is company-claimed top-line scale: €623 million of 2024 revenue with
    €135 million of EBITDA, corroborated by Sifted, followed by a company-claimed $778 million of 2025 revenue.
    The reported mix is improving: Voodoo says 80% of 2024 income came from games that had been live for more than
    two years, and it says 2025 gaming revenue reached $653 million, or 90% of the business. That shift matters
    because legacy hyper-casual titles were short-lived and ad-heavy, whereas hybrid/casual franchises can layer
    in in-app purchases, events, and stronger retention. Still, these numbers are not audited public-company statements;
    they should be underwritten as management disclosures supported by selective press corroboration, not full financial
    statements.'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  - CI006
  - CI007
  - CI035
  - CI036
  - CI037
