summary:
  headline: >-
    Voodoo has rare private-company scale and confirmed profitability, but opaque unit economics, B-rated leverage, and
    an unproven BeReal bet make this a track / research-more at any premium multiple.
  overallScore: 6.2
  recommendation: track
  confidence: medium
  riskRating: high
  valuationStance: stretched
