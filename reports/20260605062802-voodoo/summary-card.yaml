  topStrengths:
    - >-
      Unusually large and independently corroborated scale for a private gaming company: €623M 2024 revenue, €135M
      EBITDA, EBITDA-positive since 2017.
    - >-
      Eight billion lifetime downloads and 169 million monthly active users confirm durable consumer reach and
      data-flywheel advantages.
    - >-
      Strategic mix shift from 100% hyper-casual in 2021 to 78% hybrid-casual and social by 2024 de-risks the post-ATT
      revenue model.
    - >-
      Partner publishing platform with 150+ studios creates a diversified supply funnel that individual publishers
      cannot easily replicate.
    - >-
      BeReal acquisition adds a 40M+ user Gen Z social graph at a price potentially below replacement cost if
      monetization executes.
  topRisks:
    - >-
      Platform concentration is structural: Apple App Store and Google Play control distribution, and ATT already caused
      a material 2021–2022 revenue collapse.
    - >-
      B-rated leveraged debt structure under Stan Holding SAS exposes the company to refinancing risk and covenant
      triggers; debt terms are not publicly disclosed.
    - >-
      BeReal user trajectory is contested—peak MAU declined from 73.5M in August 2022 to ~30M by early 2025—and
      social-app monetization ($30M of 2025 revenue) remains small relative to the €500M acquisition cost.
    - >-
      CNIL confirmed a BeReal privacy enforcement investigation related to nudged advertising-tracking consent;
      regulatory exposure is material given the scale of photo and location data.
    - >-
      Key-person risk on CEO Alexandre Yazdi is elevated: no disclosed succession structure, no independent board
      composition, and his departure would be an execution risk of the highest order during a critical integration
      period.
  unresolvedGaps:
    - >-
      Audited consolidated revenue and EBITDA bridge reconciling EUR and USD disclosures across 2024 and 2025 fiscal
      years.
    - >-
      Gross margin, platform fee splits, and studio revenue-share terms required to underwrite revenue quality beyond
      top-line scale.
    - Net debt, cash balance, covenant terms, and liquidity runway under the Stan Holding SAS leveraged structure.
    - >-
      BeReal daily active users, post-acquisition cohort retention, ARPDAU, and contribution margin are not publicly
      disclosed.
    - >-
      Full cap table including option pool size, liquidation preferences, and any ratchet or anti-dilution provisions
      tied to the Goldman, Tencent, and GBL investments.
    - Board composition, independent director names, and governance rights attached to investor minority stakes.
