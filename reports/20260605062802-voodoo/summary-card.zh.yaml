summary:
  headline: Voodoo 拥有罕见的私营公司规模和已确认盈利能力；但单位经济性不透明、B 评级杠杆债务压身，BeReal 赌注也尚未跑通，任何溢价倍数下都更适合观察 / 继续研究。
