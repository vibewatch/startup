  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: BeReal backend architecture
      missingEvidence: >-
        Cloud infrastructure vendor, backend stack, CDN, content moderation pipeline, engineering headcount
        post-acquisition, and ML/recommendation architecture for BeReal.
      whyItMatters: >-
        Voodoo paid €500M for BeReal. Without visibility into the backend architecture, cost structure, and
        engineering capacity, infrastructure continuity risk and integration complexity cannot be assessed.
      diligencePath: >-
        Request BeReal architecture documentation, cloud vendor contracts, engineering org chart, and
        infrastructure cost breakdown from management.
      relatedQuestionRefs:
        - QE020
        - QE024
      relatedTableRefs:
        - TE001
        - TE003
    - type: missing-source
      severity: material
      topic: security and compliance certification
      missingEvidence: >-
        No independent security audit, ISO 27001, SOC 2 report, penetration test disclosure, or third-party
        privacy audit has been located for either Voodoo games platform or BeReal.
      whyItMatters: >-
        Voodoo processes advertising IDs, gameplay data, and social-app content for hundreds of millions of
        users including minors. Absence of independent certification is a material risk for regulated contexts.
      diligencePath: >-
        Request existing security audit reports, pen test findings, data protection impact assessments
        (DPIAs), and any incident history. Ask whether ISO 27001 or SOC 2 is in scope.
      relatedQuestionRefs:
        - QE023
      relatedTableRefs:
        - TE004
    - type: private-evidence-only
      severity: moderate
      topic: SDK version control and partner ecosystem
      missingEvidence: >-
        SDK release cadence, changelog, backward compatibility guarantees, and adoption metrics across the
        150+ partner-studio network are not publicly disclosed.
      whyItMatters: >-
        SDK fragmentation across studios could create inconsistent monetization quality, compliance gaps,
        and technical debt as the partner network scales.
      diligencePath: >-
        Request SDK changelog, partner adoption rate by version, and any version-sunset policy from the
        engineering team.
      relatedQuestionRefs:
        - QE022
      relatedTableRefs:
        - TE003
    - type: missing-source
      severity: moderate
      topic: IP and patent portfolio
      missingEvidence: >-
        No patents, registered game mechanics, ad-format IP, or technology trademarks for Voodoo or BeReal
        have been located in publicly searchable IP databases.
      whyItMatters: >-
        Understanding registered IP is relevant to assessing defensibility of key differentiated features
        such as BeReal's dual-camera ad format and Voodoo's UA technology.
      diligencePath: >-
        Conduct a comprehensive patent search for Voodoo SAS, Stan Holding SAS, and BeReal SAS in EPO,
        USPTO, and INPI databases.
      relatedQuestionRefs:
        - QE029
      relatedTableRefs:
        - TE001
    - type: missing-source
      severity: moderate
      topic: Jamble public metrics
      missingEvidence: >-
        No independent download count, monthly active user figure, GMV, or revenue has been located for
        Jamble in the public domain as of the 2026 diligence date.
      whyItMatters: >-
        Jamble is presented in the 2024 annual results as a strategic new product category (live commerce),
        but without independent data the growth claim cannot be evaluated.
      diligencePath: >-
        Request Jamble user metrics, GMV data, and monetization plan from management. Check for App Store
        and Play Store listings and third-party download trackers.
      relatedQuestionRefs:
        - QE019
      relatedTableRefs:
        - TE001
    - type: missing-source
      severity: low
      topic: platform availability and reliability
      missingEvidence: >-
        No public status page, uptime disclosure, incident history, SLA document, or reliability benchmark
        has been located for Voodoo's game backend or BeReal's app platform.
      whyItMatters: >-
        For a platform serving 169M MAU, undisclosed reliability history and absence of a public status
        page limit diligence on infrastructure resilience.
      diligencePath: >-
        Request internal reliability dashboards, post-mortems, and SLA commitments for both the game
        backend and BeReal infrastructure.
      relatedQuestionRefs:
        - QE030
      relatedTableRefs:
        - TE003
