  - id: section-publishing
    title: Publishing platform and game production engine
    body: >
      Voodoo's publishing platform is the central mechanism that connects the game portfolio to external
      studios and sustains the company's game-production throughput. The public-facing publishing page
      describes a four-stage lifecycle — Prototype, Iterate, Launch, Scale — supported by a suite of tools
      that partner studios can access after signing up. The Testing Dashboard is described as the "fastest way
      to launch and test prototypes." The SDK Package is a unified offering covering analytics, monetization,
      ad mediation, IAP management, LiveOps, and a game backend for multiplayer and social features. The
      Analytics product is described as offering best-in-class dashboards; the AB Testing and Remote
      Configuration product allows experiment management and live game tuning without client app updates.
      IAP Management and the Game Backend round out the stack for launched titles.


      The 2024 annual results press release states that Voodoo tests nearly 2,000 prototypes per year — a
      figure that illustrates the industrial scale of the production pipeline. This prototyping approach relies
      on data-driven retention and monetization thresholds for progression from prototype to soft launch to
      scale. Only a small fraction of prototypes that meet CPI, D1 retention, and engagement benchmarks
      advance through the pipeline.


      A third-party LiveOps analysis of Voodoo's Coffee Pack game (Balancy, January 2026) describes how
      Voodoo implements structured LiveOps systems including daily and weekly missions, milestone rewards,
      event-driven engagement, comeback bundles, and context-sensitive monetization offers that are A/B
      tested before deployment. Remote Configuration allows these event schedules and offers to be adjusted
      without app-store updates. This external case study corroborates the operational sophistication of the
      publishing platform beyond what is stated on the official site.


      The UA component of the publishing platform is notable for its scale. Voodoo's ads page states the
      company has 50+ artists and developers specializing in mobile marketing content, produces 25,000
      creatives per year, and delivers 250 billion ad impressions. The ad network supports brand advertising
      at 300 million daily impressions reaching 150 million MAUs, with 100 million of those daily impressions
      in the US.
    claimRefs:
      - CE005
      - CE006
