    figureRefs:
      - FE004

  - id: section-differentiation
    title: Technology differentiation and evidence gaps
    body: >
      Voodoo's durable product and technology advantages are observable in three areas. First, the publishing
      and UA engine: a pipeline testing nearly 2,000 prototypes per year, producing 25,000 creatives annually
      and delivering 250 billion ad impressions, represents an industrial-scale data flywheel that is difficult
      to replicate quickly. The combination of in-house creative production at scale, first-party audience data
      across 169 million MAUs, and a proprietary ad network with audience reach not fully captured by social
      platforms (25% of network users reportedly unreachable via social media alone) provides a differentiated
      UA surface. Second, the franchise longevity shift: 80% of 2024 revenue came from games that had been
      live for more than two years, reflecting genuine product depth built through LiveOps, remote
      configuration, and iterative A/B testing rather than launch-and-decay hyper-casual mechanics. Third,
      BeReal's product constraint design: the authenticity mechanics (no filters, no likes, dual-camera,
      one-per-day) are observable IP and differentiated within social media; the Nielsen ad study, while
      commissioned, provides the first independent numeric data on BeReal's advertising recall versus
      Instagram, TikTok, Snapchat, Facebook, and Pinterest.


      Key evidence gaps that a technical diligence process should close are: (1) BeReal's post-acquisition
      engineering structure, backend architecture, content moderation approach, and cloud infrastructure
      costs; (2) the provenance and licensing of machine learning models used in ad targeting and
      recommendation; (3) an independent security assessment of Voodoo's ad-tech stack and data flows,
      particularly given first-party IDFA/GAID data volume; (4) SDK version control, release cadence, and
      backward-compatibility commitments for the publishing partner ecosystem; (5) any IP registered in
      the form of patents for game mechanics, ad formats, or analytics methods; and (6) redundancy and
      availability data for the game backend supporting multiplayer and social features across Voodoo's
      portfolio.
    claimRefs:
      - CE005
      - CE010
      - CE011
      - CE025
      - CE026
      - CE037
      - CE039
      - CE040
