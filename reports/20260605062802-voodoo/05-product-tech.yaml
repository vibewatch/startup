  - id: section-bereal
    title: BeReal product and technology
    body: >
      BeReal is a mobile social app founded in 2019 (launched publicly 2020) and acquired by Voodoo in
      June 2024 for €500 million. The product design is distinctive and observable: once per day, all users
      receive a random-time push notification ("It's Time to BeReal") and have a two-minute window to capture
      a simultaneous front-and-back camera photo. The app deliberately removes filters, post-editing,
      follower counts, and public like metrics, positioning itself as the antithesis of curated social media.
      Users cannot view their friends' posts for the day until they have posted their own. Reactions are
      expressed through "RealMoji" face-capture reactions rather than abstracted counts. The simplicity of
      the mechanic and the deliberate product constraints are public, observable, and differentiating.


      BeReal's advertising product is also observable: the front/back dual-camera format is applied to brand
      advertising, with ads appearing in the same format as organic content. A Nielsen study commissioned
      by BeReal and published in March 2026 found that BeReal ranked #1 in EMEA (France, Germany, UK) for
      Strong Ad Recall and Strong Purchase Consideration among social media platforms. The study reported a
      35% relative uplift in purchase consideration and a 23% relative uplift in ad recall versus the
      average of competing platforms (Instagram, TikTok, Snapchat, Facebook, Pinterest). Among EMEA users,
      56% said the front/back ad format made them more likely to click on a brand advertisement. The study
      methodology is disclosed: Nielsen conducted the survey, the UK sample was 2,308 total respondents
      including 600 BeReal users, Germany 2,220 including 593 BeReal users, and France 2,673 including 769
      BeReal users. The limitation is that the study was commissioned by BeReal, creating an independence
      concern.


      BeReal's user base stands at 40 million+ monthly users globally, with top markets in the US, Japan,
      and France; over 50% of users are active six days per week. Voodoo's 2025 year-end communication
      stated BeReal generated €30 million in revenue in 2025 (versus zero at the time of the 2024
      acquisition) and described the audience as "stabilized in France" with "strong growth in Japan." The
      stated path to profitability is by 2027. The adverse pre-acquisition evidence from earlier chapters
      (Sifted: loss-making with declining user base; TechCrunch: running out of funding; Sensor Tower:
      MAU declines averaging 2% per month in late 2023–2024) remains on the record; the 2025 revenue figure
      is a company claim not corroborated by independent financial disclosure.


      BeReal's technical architecture beyond the product layer — backend stack, cloud provider, CDN,
      content moderation infrastructure, and engineering headcount — is not publicly disclosed. The product
      is available on both the Apple App Store and Google Play. In-app purchases are processed by the app
      stores, not by BeReal's own payment stack. Chat, GPS location sharing, and reaction data are all
      collected and described in the May 2026 privacy policy.
