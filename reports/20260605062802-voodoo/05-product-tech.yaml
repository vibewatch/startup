  - id: section-tech-stack
    title: Core technology infrastructure and ad stack
    body: >
      Voodoo's technology infrastructure is observable primarily through job postings, public developer
      materials, and partner interviews rather than direct architectural disclosure. The Engineering and
      Data team page describes the team as "Voodoo's central tech hub" that "creates innovative solutions
      that drive growth with a pragmatic approach, ranging from simple searching to complex machine learning
      systems." Two active senior job postings in 2026 give the clearest public signal of the underlying
      infrastructure: a Senior Data Engineer (Feature Platform) role describes building scalable architecture
      for ML features used in ad targeting, supporting both batch and real-time data processing for offline
      training and online inference; a Senior ML Engineer (Offline Team) role describes developing and
      maintaining ML training infrastructure for ad targeting models, including pipeline optimization and
      scaling data sources for the ad network.


      The ad mediation stack is partially observable. Voodoo's iion interview confirms the company relies on
      "trusted and resilient mediation and network dashboards, stable SDK integrations, and clear placement
      guidelines." Industry reporting and SDK documentation confirm integration with AppLovin MAX, Google
      AdMob, and Unity Ads, using a hybrid waterfall-and-programmatic bidding model. A community VoodooSDK
      repository on GitHub implements a lightweight Unity monetization SDK with synchronous and asynchronous
      initialization, rewarded-ad callbacks (rewarded/failed/skipped), preload and readiness checks, and
      Editor tooling for configuring the Application ID. This third-party implementation confirms the API
      design of the SDK's rewarded-ad surface and its Unity Package Manager distribution method.


      Voodoo uses feature flags and holdouts for safe rollouts and quick reversions, and tracks ad quality
      via ANR and crash rates, ad call latency, retention signals, and complaint data in near-real-time.
      The company's in-house analytics platform is referenced in the privacy policy as a tool used for
      analytics and product improvement alongside third-party services. Specific cloud infrastructure vendors
      (AWS, GCP, Azure) are not disclosed in any public source reviewed.
    claimRefs:
      - CE023
      - CE024
      - CE030
      - CE022
      - CE021
      - CE032
