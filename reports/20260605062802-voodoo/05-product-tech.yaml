  - id: section-trust
    title: Privacy, compliance, and trust controls
    body: >
      Voodoo maintains a GDPR-compliant privacy policy applicable to all its apps and games, last updated
      May 19, 2026. The policy names a Data Protection Officer at dpo@voodoo.io, specifies that apps and
      games are not intended for users under 16, and describes data processing under legal bases including
      contract performance, legal obligation, legitimate interest, and consent. Advertising and monetization
      data processing (using third-party advertising SDKs) is disclosed as relying on consent or legitimate
      interest. The privacy policy explicitly states that advertising partner selection and personalization
      is carried out by advertising and mediation partners "acting as independent data controllers" — a
      disclosure consistent with GDPR Article 26 arrangements. Voodoo also has age-restricted CCPA
      obligations for California users. Crash monitoring, stability logs, and A/B testing are documented
      as separate processing purposes with their respective legal bases.


      BeReal's privacy policy was updated May 13, 2026. It prohibits use by users under 13, applies
      stricter location defaults for minors (approximate city-level location rather than street-level), and
      requires phone number, full name, date of birth, and username for account creation. BeReal explicitly
      states it does not collect or store credit card details — payment is processed by Apple App Store or
      Google Play. The BeReal policy governs GPS location, chat messages, RealMoji reactions, and camera data.


      On ad quality, Voodoo's centralized ad operations approach — documented in a 2025 iion interview with
      Baptiste Durif, Head of Ad Monetisation and User Acquisition Innovation — includes strict written
      guidelines covering creative integrity, placement design, brand safety, frequency, policy compliance,
      and technical performance. Partner studios accept these in writing. New partners go through a small-scale
      test with real-time monitoring before scale-up. Partners who breach standards are paused immediately and
      removed if issues persist. Voodoo uses feature flags and holdouts for quick rollback of any monetization
      solution that degrades quality metrics, even when revenue increases.


      No independent security audit, penetration test certification, ISO 27001, SOC 2, or similar third-party
      technical assurance document has been located in the public domain for either Voodoo's game platform or
      BeReal's backend infrastructure.
    claimRefs:
      - CE018
      - CE019
      - CE020
      - CE021
