company:
  name: Voodoo
chapter:
  number: 5
  title: Product & Tech
  summary: >-
    Voodoo operates two distinct product pillars — a hybrid-casual game portfolio with a data-driven publishing
    platform, and a social-app cluster anchored by BeReal. The game side is mature and publicly observable:
    Mob Control (302M downloads, 14.5M monthly average players) and Paper.io 2 exemplify franchise longevity
    supported by an in-house SDK, a testing dashboard, centralized ad operations, and ML-driven UA. BeReal is
    a product-design outlier — its once-daily dual-camera mechanic is observable and differentiating — but its
    technical architecture, BeReal-side SDK stack, and post-acquisition engineering depth are not publicly
    disclosed. Cross-cutting trust controls (GDPR-compliant privacy policies updated May 2026, centralized ad
    quality ops, feature-flag rollback infrastructure) are well-documented. Key architecture gaps include
    cloud-infrastructure vendor identity, internal backend code provenance, third-party security audits,
    and independent corroboration of BeReal's retention after acquisition.
sections:
  - id: section-portfolio
    title: Product portfolio and module overview
    body: >
      Voodoo's product portfolio spans three categories as of the 2026 diligence date. The first and largest
      is hybrid-casual mobile games, including franchise titles Mob Control (launched April 2021), Paper.io 2,
      and Block Jam 3D. These games are available on both the Apple App Store and Google Play and are
      monetized through a blend of in-app advertising and in-app purchases (IAP). Mob Control is the most
      publicly documented title: it had accumulated 302.1 million all-time downloads and $77.5 million in
      all-time revenue by mid-2026, with 14.5 million monthly active players on average and 2.4 million daily
      active players. Day-30 retention of 4.7% places it in mature live-game territory for the hybrid-casual
      category. The game underwent a transition from hyper-casual to a "mature live services" model,
      adding events, season passes, and crossover collaborations such as the 2024 Transformers partnership.
      Paper.io 2 has added a teams mode and cosmetic customization with 100+ skins and periodic live events.
      Block Jam 3D is a puzzle title that uses satisfying 3D block-placement mechanics with daily puzzles and
      live tournaments.


      The second category is social consumer apps. BeReal, acquired in June 2024 for €500 million, is the
      flagship social product and is described in greater depth in section 4. Wizz, a chat and social platform
      for Gen Z users, has over 15 million iOS downloads and more than 5 million on Google Play, and is
      reportedly used by approximately 25% of US teenagers.


      The third category, and least evidenced, is live commerce. Jamble, a live shopping app, was recently
      launched by Voodoo and was described in the 2024 annual results as experiencing early growth in the
      United States. No independent download or revenue data for Jamble has been located in the public domain
      as of the diligence date.


      Voodoo also operates a partner publishing program serving more than 150 external studios globally,
      providing access to its SDK, analytics, creative production, and UA infrastructure in exchange for a
      revenue-share arrangement whose commercial terms are not publicly disclosed.
    claimRefs:
