      $10M combined) raises questions about competitive positioning that cannot be resolved from public data alone.
    impact: medium
    diligencePath: >-
      Obtain combined IAP plus advertising revenue data from AppMagic or Sensor Tower hybrid-casual reports; triangulate
      against Voodoo's portfolio revenue mix in data room; request CPI benchmarks by franchise.
