      revenue. All cited estimates cover IAP only, understating the total market pool by an unknown but potentially
      significant margin. The $40B casual gaming market figure is Voodoo's own framing, partially corroborated by
      AppMagic/Ripple Reports at $35-38B (IAP only). Voodoo's implied 1.6-1.9% casual gaming market share is approximate
