  - id: EGM002
    description: >-
      Voodoo's gaming revenue breakdown by genre (hyper-casual vs. hybrid-casual vs. partner platform) is not publicly
      disclosed. Only the 22% hyper-casual revenue share is mentioned; the IAP versus advertising revenue split is also
      undisclosed. This prevents a formal SOM calculation, blocks assessment of partner platform economic contribution,
