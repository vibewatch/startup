      - number: '8.5'
        title: 情景、论点破裂触发点与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              基准情景并不是「Voodoo 很便宜」，而是「Voodoo 是一项不错的私人资产，但合理价格取决于仍未公开的证据」。牛市情景需要同时满足几项条件：2025 年经审计收入接近 GBL / 第三方轨迹，EBITDA
              率维持双位数，杠杆降到 Fitch 预期的 4x 以下，BeReal 用户稳定且贡献利润率为正，并且没有新的隐私执法。熊市情景则会在 BeReal
              继续走平、混合休闲组合重新回到爆款驱动波动，或再融资文件暴露沉重优先权、契约或现金外流时出现。因此关键尽调问题并不只是装饰：经审计的 2024–2025 年账目、净债务和现金、广告 / IAP /
              社交应用收入拆分、头部产品集中度、BeReal DAU / MAU 与 ARPDAU、工作室伙伴经济模型、期权池、清算优先权，以及董事会 /
              治理权利。没有这些输入，正确结论是保留上行可选性，但避免按完整平台倍数付款。
