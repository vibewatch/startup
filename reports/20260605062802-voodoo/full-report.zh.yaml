          tone: positive
        - label: 直接混合休闲竞争压力
          value: high
          detail: 'Rollic（2026 年 3 月 #2）、Homa（IAP 偶尔 #2）和 Loom Games（2026 年 3 月 #1）每月轮换头部排名；RPD 领先不再由 Voodoo 独占。'
          tone: negative
        - label: 品类商品化风险
