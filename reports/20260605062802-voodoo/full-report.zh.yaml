companyProfile:
  summary: >-
    Voodoo 是一家总部位于巴黎的私营移动游戏发行商和消费者应用公司，由 Alexandre Yazdi 与 Laurent Ritter 于 2013 年创立。它开创了超休闲移动游戏类型，累计下载量超过 8
    billion，此后转向生命周期更长的混合休闲游戏和社交应用。2024 年 6 月以 €500 million 收购 BeReal，使公司获得一个签约时活跃用户超过 40 million 的 Gen Z 社交网络。公司背后有
    Goldman Sachs、Tencent 和 GBL 支持，2024 年收入 €623 million，2025 年收入 $778 million，自 2017 年起 EBITDA 为正，在 14 个国家约有 800
    名员工。Voodoo 运营一组特许移动游戏（Mob Control、Paper.io、Block Jam）、一个支持 150 多家独立工作室的合作发行平台，以及 BeReal、Wizz、Blitz、Jamble 等消费者应用。
