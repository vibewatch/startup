      - number: '4.5'
        title: 财务结论与尽调优先级
        blocks:
          - type: paragraph
            body: >-
              Voodoo 在规模和增长上拿到正面的收入质量分，在利润率证据上表现混合，在 BeReal 上应打谨慎标记。相比许多私人游戏同行，公司顶线披露更好： 2024 年收入、2024 年 EBITDA、2025
              年收入、游戏收入和社交应用收入都已公开说明。但承销价值需要把公司自称表现、独立估计和缺失的私有指标分开。 眼下尽调路径很窄也很具体：取得经审计合并财务报表，桥接 EUR 与 USD 收入口径，核对游戏收入与
              BeReal 及其他应用，取得毛利率和工作室分成表， 按队列验证获客回本，并审阅现金、债务、earnout 和募资用途计划。没有这些文件，财务故事只适合作为增长与盈利叙事投资，不能作为可完整建模的现金流资产。
