  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: Voodoo 通过游戏、社交应用、广告和发行，把匿名用户与创作者转进可变现循环。
    data:
      items:
        - label: 消费者发现
          actor: 移动应用用户
          touchpoints:
            - App Store
            - Google Play
            - 交叉推广
            - 付费广告
          painpoint: Needs quick entertainment or social connection with low onboarding friction.
          opportunity: Voodoo can acquire and cross-promote across a very large installed base.
        - label: 游戏或社交入门
          actor: 玩家或 BeReal/Wizz 用户
          touchpoints:
            - 教程
            - 每日通知
            - 聊天 / 社交信息流
            - 隐私提示
          painpoint: Must see value quickly before churn or ad fatigue.
          opportunity: Simple mechanics and daily prompts create repeatable first sessions.
        - label: 参与循环
          actor: 活跃用户
          touchpoints:
            - 实时活动
            - 赛季通行证
            - 每日 BeReal 发帖
            - 消息
            - 任务
          painpoint: Novelty can decay without fresh content or social relevance.
          opportunity: LiveOps and social mechanics extend usage beyond install.
        - label: 变现事件
          actor: 广告主或付费用户
          touchpoints:
            - 激励视频
            - 插屏广告
            - IAP
            - 去广告购买
            - BeReal 原生广告
          painpoint: Ads can harm user experience if load or reliability is poor.
          opportunity: Brand-safe and native formats convert attention into revenue.
        - label: 创作者 / 工作室循环
          actor: 外部工作室或创作者
          touchpoints:
            - 学院
            - 发行工具
            - 测试仪表板
            - SDK
            - 创意反馈
          painpoint: Prototype economics and revenue share are opaque publicly.
          opportunity: Partner supply expands the portfolio without relying only on first-party teams.
    approximationNotes: 定性旅程基于官方发行、广告、BeReal、商店页和合作伙伴证明来源综合整理。
    claimRefs:
      - CU001
