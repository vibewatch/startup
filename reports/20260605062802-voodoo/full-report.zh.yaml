              每年 2,000 个原型、25,000 个创意、250B 次展示，再加上自研 ML 广告定向平台，形成小发行商难以复制的数据飞轮。系列转型（收入 80% 来自上线 2+ 年的标题）
              验证了平台能产出耐久产品，而不只是爆款。
