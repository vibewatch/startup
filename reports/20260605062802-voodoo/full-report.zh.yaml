  - id: FR001
    title: 风险热力图——可能性 vs. 影响
    type: matrix
    layout: wide
    summary: 监管 / 隐私执法、平台依赖和 BeReal 变现失败集中在高影响区域。再融资后，财务杠杆风险已经降低，但在 'B' 评级规模下仍偏高。
    data:
      columns:
        - 高可能性
        - 中等可能性
        - 低可能性
      rows:
        - label: 高影响
          values:
            - Apple ATT / 平台政策冲击（已兑现的结构性风险；仍可能出现更多轮冲击）；COPPA 2026 不合规（美国执法活跃，FTC 将其列为优先事项）
            - EU DSA 不合规——BeReal 与 UGC 游戏（执法加速；尚未确认 Voodoo 有相关报告）；BeReal 用户基数重新下滑
            - CEO Yazdi 离任（近期概率低，但会重创转型逻辑）；涉及 BeReal 用户照片的重大数据泄露
        - label: 中等影响
          values:
            - CNIL 重新调查同意合规（CNIL 保留权利；SDK 更新风险持续）；程序化 CPM 压缩 / DSP 集中（结构性、持续）
            - 爆款驱动的产品组合集中风险——旗舰游戏收入下滑；合作工作室供给中断，或转向竞争发行商
            - Tencent 地缘政治监管审查（美国 CFIUS 背景；当前无执法）；计划外收购导致杠杆升至 5x 以上
        - label: 低影响
          values:
            - SDK 版本碎片化引发应用稳定性问题（缓释较充分；剩余影响低）；SIVT 程序化广告欺诈（全行业问题；Voodoo 已有控制措施）
            - Fitch 类比杠杆突破（预期低于 4x；再融资已完成；随 EBITDA 增长可控）；UK Online Safety Act——BeReal 在英国的义务
            - BeReal 竞争功能再次被既有平台复制（已发生；现阶段边际影响有限）；法国 GDPR/ePrivacy 演进超出当前合规姿态
    approximationNotes: 可能性和影响是基于公开证据、Fitch 评级分析和监管执法数据的定性评估。内部概率估计不可得。风险位置为 2026 年中评估，可能随 BeReal 走势和监管变化而变动。
    claimRefs:
      - CR009
      - CR013
      - CR014
      - CR017
      - CR018
      - CR019
      - CR028
      - CR031
      - CR032
      - CR033
