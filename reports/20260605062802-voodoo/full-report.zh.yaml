    sections:
      - number: '4.1'
        title: 收入模式与收入组合质量
        blocks:
          - type: paragraph
            body: >-
              Voodoo 变现的不是订阅软件，而是一组免费游玩的手机游戏和消费者应用。置信度最高的财务锚点，是公司自称的收入规模： 2024 年收入 €623 million、EBITDA €135 million，并得到
              Sifted 佐证；随后公司又称 2025 年收入为 $778 million。 披露的组合正在改善：Voodoo 称，2024 年 80% 的收入来自上线超过两年的游戏；2025 年游戏收入达到 $653
              million，占业务的 90%。 这一变化很关键，因为传统超休闲标题生命周期短、重广告，而混合休闲 / 休闲系列可以叠加应用内购、活动和更强留存。不过，这些数字不是经审计的上市公司报表；
              承销时应把它们视为管理层披露，并由选择性媒体报道支撑，而不是完整财务报表。
