      - number: '7.3'
        title: BeReal 整合、用户轨迹与变现风险
        blocks:
          - type: paragraph
            body: >-
              BeReal 是 Voodoo 最大单笔收购，价格 €500 million；截至 2026 年中，它也是组合中执行风险最高的单一仓位。该应用于 2024 年 6 月被收购时，用户基数下滑， 月度现金烧钱 $3
              million，且没有实质变现。Social Media Today 在 2024 年报道，BeReal 约有 25 million 活跃用户，收购前资金大约还能支撑 10 个月，
              收购为其提供了生命线。独立统计显示，BeReal MAU 于 2022 年 8 月达到 73.5 million 峰值，此后到收购时持续下降。年下载量从 2023 年到 2024 年约下降 60%（从 31.5
              million 到 12.7 million），2025 年又下降 50%。再互动率——跟踪一段不活跃后回归的用户——在 2025 年降至 19%，说明流失持续存在。

              Voodoo 上线轻广告，并称 BeReal 到 2025 年初达到盈亏平衡，每月产生约 $2 million 收入。Sifted 报道，Voodoo CEO Yazdi 承认截至 2025 年初，
              用户基数“停止下降，并稳定在 30 million 月活用户”。但 Fitch 在基准情景中明确假设 BeReal 2025 年仍将亏损，并预计 2027 年前不会产生正 EBITDA 贡献。 Voodoo
              自称盈亏平衡与 Fitch 财务模型之间的差距，构成实质不确定性。

              BeReal 的变现天花板受结构性限制：其真实性品牌与高广告负载相冲突，核心双摄功能又被 Snapchat Dual Camera 和 TikTok Now 复制，削弱竞争差异化。 Ivey Business
              Review 认为 BeReal 缺少明显变现路径，因为广告和数据销售都与其价值主张冲突。Voodoo 2025 年财务结果只披露社交应用收入约 €30 million，而购买价为 €500
              million，意味着收入倍数低于 2x——只有在用户和收入持续增长兑现时才可接受。如果 BeReal 用户基数重新下滑， 或变现实验（扩大广告负载、社交电商、高级功能）未能转化，这笔收购可能同时损害
              Voodoo 的资产负债表和战略重心。
