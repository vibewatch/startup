  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: “客户”是谁：玩家、社交用户、广告主与工作室
        blocks:
          - type: paragraph
            body: >-
              Voodoo 不是传统企业软件公司，没有清晰可见的账户名单。它的客户证明分散在消费者注意力和供给侧创作两端。最大群体是免费游玩的手机游戏玩家， 通过 Mob Control、Paper.io 2
              等标题触达；这些用户通过广告展示间接付费，也通过赛季通行证、宝石、去广告购买和其他应用内购直接付费。 BeReal 和 Wizz 增加了另一个社交应用社区，其核心行为不是游戏：BeReal
              是每日真实感网络，Wizz 是聊天 / 社交发现应用。第三类客户是广告主和品牌， 它们通过 Voodoo 游戏库存或 BeReal 双摄广告格式购买移动注意力。第四类是创作者 / 发行侧伙伴：使用 Voodoo
              发行、SDK、测试、创意和 Academy 基础设施的外部工作室和个人开发者。 因此，Voodoo 的客户尽调是一个双边问题：先验证真实消费者参与，再验证广告主和工作室伙伴是否会反复把这种参与变现。
