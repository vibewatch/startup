      - number: '3.3'
        title: 能力、UA 基础设施与数据飞轮对比
        blocks:
          - type: paragraph
            body: >-
              Voodoo 在混合休闲发行中最可防守的竞争优势，是它的数据飞轮：自研用户获取和游戏测试基础设施，建立在 15 年市场运营、覆盖数百款游戏的超过 8 billion
              累计下载之上。这个行为数据集覆盖会话时长、留存队列、广告参与模式，以及按创意变体和受众分层拆分的 CPI 响应，支撑一条快速原型流水线，每年在自有工作室和 150 多家合作工作室网络中评估约 2,000
              个游戏概念。CEO Yazdi 已把这种数据驱动文化称为公司的长期竞争优势；Block Jam 3D 在 2023 年 6 月成为首款达到 $2 每次下载收入（RPD）的混合休闲游戏，正是这套系统的直接产出。


              150 多家合作工作室网络形成了难以快速复制的供给侧护城河：拿到验证游戏原型的独立工作室，会自我筛选流向能提供最优 UA 资本、测试基础设施和全球分发组合的发行商。Homa 运营类似项目；Supersonic
              的项目因剥离流程面临结构性不确定。Rollic 主要靠内部开发，而不是大型第三方网络，这限制了管线多样性，但提高了质量控制。Tripledot 收购后的模式已包含 12 家自有工作室，但没有运营一个规模类似
              Voodoo 的公开第三方发行项目。


              AppLovin 退出直接游戏发行具有实质相关性：其 MAX mediation 平台和 AppDiscovery DSP 仍是整个休闲发行行业的主要 UA 基础设施，2026 年收入 $5.48
              billion，同比增长 65.9%。Tripledot 交易一半现金、一半股权的结构，使 AppLovin 成为 Tripledot 少数股东，在主导 UA 平台和 Voodoo
              直接竞争对手之间形成商业交织关系。公开来源无法判断这是否影响 Voodoo 获取 AppLovin 库存或拍卖公平性，因此这是重要尽调项。


              在用户获取成本结构上，所有头部混合休闲发行商都面对同一个结构性逆风：在有限移动广告库存上竞争性 UA 出价推高 CPI。数据飞轮优势不体现在绝对 CPI
              水平——这由全市场拍卖动态决定——而体现在向变现用户转化的效率：在竞争对手行动前，识别并支持 LTV/CPI 比率高于平均水平的游戏。Block Jam 3D 的 RPD 领先地位（2023 年 6 月，$2
              RPD）随后被 Rollic 的 Screw Jam（2024 年 4 月，$3 RPD）和 Homa 的 All In Hole（2024 年 8 月，$4 RPD）超越，说明直接竞争组内的 RPD
              军备竞赛正在加剧。
