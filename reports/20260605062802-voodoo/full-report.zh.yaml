  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与模块概览
        blocks:
          - type: paragraph
            body: >
              截至 2026 年尽调日期，Voodoo 的产品组合覆盖三类。第一类也是最大类，是混合休闲手机游戏，包括系列标题 Mob Control（2021 年 4 月上线）、 Paper.io 2 和 Block Jam
              3D。这些游戏同时在 Apple App Store 和 Google Play 上架，通过应用内广告和应用内购（IAP）混合变现。 Mob Control 是公开记录最完整的标题：到 2026 年中，累计下载
              302.1 million，累计收入 $77.5 million，平均月活玩家 14.5 million， 日活玩家 2.4 million。30 日留存 4.7%，使它在混合休闲品类中进入成熟 LiveOps
              游戏区间。该游戏经历了从超休闲到“成熟 LiveOps”模式的转型， 加入活动、赛季通行证，以及 2024 年 Transformers 合作等跨界联动。Paper.io 2 增加了团队模式和外观自定义，拥有
              100+ 皮肤和周期性 LiveOps 活动。 Block Jam 3D 是一款解谜游戏，用有爽感的 3D 方块摆放机制，叠加每日谜题和实时锦标赛。


              第二类是社交消费者应用。BeReal 于 2024 年 6 月以 €500 million 被收购，是旗舰社交产品，并在第 4 节有更深入说明。Wizz 是面向 Gen Z 用户的聊天和社交平台， iOS
              下载超过 15 million，Google Play 下载超过 5 million，据报道约 25% 的美国青少年使用。


              第三类也是证据最少的一类，是直播电商。Jamble 是 Voodoo 近期推出的直播购物应用，2024 年年度业绩称其在美国出现早期增长。截至尽调日期，公开领域没有找到 Jamble 的独立下载或收入数据。


              Voodoo 还运营伙伴发行计划，服务全球 150+ 家外部工作室，向它们提供 SDK、分析、创意制作和 UA 基础设施，换取收入分成；具体商业条款未公开披露。
