        - BeReal 商业逻辑的关键 — 收购理由取决于 MAU 企稳 / 增长
        - MAU 恢复下滑；Z 世代受众迁移到竞争平台
        - 高 — 若用户基础恢复结构性下滑，€500M 收购面临风险
        - 轻变现以保护 UX；扩展功能（视频、聊天）；不加重广告负载
        - MAU 轨迹不稳；再互动率 19%；竞争对手持续模仿核心功能
