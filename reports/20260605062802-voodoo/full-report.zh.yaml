    type: flow
    layout: standard
    summary: Voodoo 的操作系统把数据驱动的产品引擎、规模化分发基础设施、提供资本的外部投资者，以及以 BeReal 为核心的社交 app 层串起来；Apple 和 Google 平台依赖则约束整套系统。
    data:
      nodes:
        - id: founders
          label: 创始人掌控
          detail: Yazdi 和 Ritter 保留多数控制权；战略决策仍由创始人驱动。
          tone: neutral
        - id: product-engine
          label: 产品与发行引擎
          detail: 每年测试 2,000 个原型；150+ 合作工作室；靠数据筛选爆款。
          tone: positive
        - id: gaming-portfolio
          label: 混合休闲游戏组合
