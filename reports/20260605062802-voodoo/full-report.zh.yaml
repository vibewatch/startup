      - number: '5.2'
        title: 发行平台与游戏生产引擎
        blocks:
          - type: paragraph
            body: >
              Voodoo 的发行平台是把游戏组合连接到外部工作室、并维持公司游戏产出通量的核心机制。面向公众的发行页面描述了一个四阶段生命周期——Prototype、Iterate、Launch、Scale——
              伙伴工作室注册后可使用一整套工具来支撑这一流程。官方称 Testing Dashboard 是“启动并测试原型的最快方式”。SDK Package 是一体化产品， 覆盖分析、变现、广告中介、IAP
              管理、LiveOps，以及支持多人和社交功能的游戏后端。Analytics 产品号称提供同类最佳仪表盘； AB Testing and Remote Configuration
              产品允许在不更新客户端应用的情况下管理实验并调整线上游戏。IAP Management 和 Game Backend 补齐了已上线标题的技术栈。


              2024 年年度业绩新闻稿称，Voodoo 每年测试近 2,000 个原型——这一数字体现了生产管线的工业化规模。这种原型方法依赖数据驱动的留存和变现门槛， 决定产品从原型到软启动再到规模化的推进。只有少数达到
              CPI、D1 留存和参与度基准的原型，能继续穿过管线。


              第三方对 Voodoo 游戏 Coffee Pack 的 LiveOps 分析（Balancy，2026 年 1 月）说明，Voodoo 如何落地结构化 LiveOps 系统：
              每日和每周任务、里程碑奖励、事件驱动参与、回归礼包，以及上线前 A/B 测试的情境化变现报价。Remote Configuration 让活动排期和报价无需应用商店更新即可调整。
              这个外部案例研究佐证了发行平台的运营成熟度，超出了官网表述。


              发行平台中的 UA 组件规模突出。Voodoo 广告页面称，公司有 50+ 名专门制作移动营销内容的艺术家和开发者，每年产出 25,000 个创意，并交付 250 billion
              次广告展示。广告网络支持品牌广告，日展示 300 million，触达 150 million MAU，其中 100 million 次日展示在美国。
