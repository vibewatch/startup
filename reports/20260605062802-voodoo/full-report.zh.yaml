      - number: '3.2'
        title: 直接混合休闲发行商画像
        blocks:
          - type: paragraph
            body: >-
              Rollic Games 归 Zynga 所有（Zynga 是 Take-Two Interactive 子公司），是 Voodoo 在混合休闲发行中最直接、财力最强的竞争对手。Rollic 2026 年 3
              月混合休闲 IAP 收入为 $16.57 million，仅次于 Loom Games。到 Take-Two FY2026 结束（财政年度截至 2026 年 3 月），该工作室组合累计安装量超过 3.9
              billion。Rollic 的 Color Block Jam 在一个季度（2025 年 Q2）产生 $42 million 收入和 21.8 million
              次下载，是有记录以来单款混合休闲游戏最大的季度表现之一。Rollic 月度 IAP 在 2025 年末达到 $23.5 million 峰值。Rollic 受益于 Take-Two FY2026 合并移动收入
              $3.3 billion（总净预订 $6.7B）、Zynga 全球分发网络，以及独立发行商拿不到的 Rockstar 和 2K IP 授权潜在通道。其直接产品——Screw Jam、Color Block
              Jam、Crowd Express、Timeline Up、Knit Out——与 Voodoo 的 Block Jam 3D 和 Mob Control 在同一需求侧平台上直接争夺玩家注意力和 UA
              拍卖库存。Rollic 在益智和 live-ops 机制上的集中度，与 Voodoo 的类型画像相似，构成竞争组中最直接的产品重叠。


              Homa Games 是 French Triad 中与 Voodoo、Madbox 并列的第三位成员，总部巴黎，已从 Headline、Northzone、Idinvest Partners
              等投资者处累计融资约 $165 million。2025 年 Q3，Homa 以 $17.6 million IAP 收入在混合休闲发行商中排名第二，仅略低于 Voodoo（$17.9 million）。到
              2026 年 3 月，Homa 以 $7.84 million 排名第七，相对走弱。Homa 2025 年 Q3 产生约 70 million
              次下载。公司以数据驱动快速原型以及益智、街机子类型中的强表现见长：All In Hole 是首款在 2024 年 8 月实现每次下载收入（RPD）$4 的混合休闲游戏，创下当时 RPD 纪录。Homa
              也运营一个类似 Voodoo 的第三方工作室发行平台。与 Voodoo 相比，它的主要差异是更集中押注益智 / 街机类型；主要限制是披露融资更少，也缺少类似 BeReal 的消费者社交资产。


              Tripledot Studios（伦敦，2017 年创立）在 2025 年 5 月通过约 $800 million 收购 AppLovin
              整个移动游戏工作室组合，重塑了竞争画像；交易结构大致一半现金、一半股权，AppLovin 成为少数股东。交易后，Tripledot 年化总收入接近 $2 billion，日活跃用户 25 million，在全球
              23 个城市拥有 12 家工作室，按收入计跻身前五大独立移动游戏发行商。产品包括 Woodoku、Solitaire.com，以及收购来的 Lion Studios 组合（Hexa Sort、Wordle!、通过
              PeopleFun 获得的 Wordscapes、通过 Magic Tavern 获得的 Project Makeover）。Tripledot 的收入多元化是结构性差异：收购后没有任何单款游戏占净收入超过
              10%，与 Voodoo 在 Mob Control 和 Block Jam 3D 上更高的集中度形成对比。Tripledot 的主要类型强项是文字益智和纸牌，与 Voodoo 的街机 /
              动作益智重点直接重叠较少——但它仍争夺同一休闲 UA 库存、平台榜单位置和用户注意力。


              截至 2026 年尽调日期，Supersonic Studios 正处在结构性过渡中。ironSource 于 2022 年并入 Unity 后，Supersonic 历史上归 Unity 所有。Unity 于
              2026 年 3 月 27 日宣布，将在 2026 年 4 月 30 日关闭 ironSource Ads Network，并聘请财务顾问管理 Supersonic 剥离。截至 2024 年 10
              月，Supersonic 在 130 多款已发行游戏中服务约 190 million 月活跃用户，自 2020 年 2 月推出以来累计下载量 6.6
              billion。被迫剥离从混合休闲发行商版图中移除了一个主要竞争压力来源；如果被资金充足的运营商收购，竞争压力可能很快重新集中。
