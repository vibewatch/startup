  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议与入场纪律
        blocks:
          - type: paragraph
            body: >-
              Voodoo 只有在严格控制入场价时才可投，因为公开记录同时支持「资产质量不错」和「信息不透明」两个结论。对一家私人消费应用公司来说，可观察的正面因素异常扎实：公司披露 2024 年收入 €623
              million、EBITDA €135 million、收入增长接近 20%、下载量 950 million、自 2017 年起 EBITDA 为正，并完成银行支持的再融资。GBL 的 2026
              年组合页面又给出更晚的 €689 million 销售额、920 名员工，以及其 14.8% 股权对应 €316 million NAV。这些事实说明 Voodoo
              有规模、有利润，也有股东估值标记，但还不足以拼出可完全审计的企业价值。因此估值立场不能是干净的内在价值估算。除非报价低于或等于保守的中个位数收入倍数，或在扣除债务和优先权后 EBITDA 倍数已清晰去风险，我会把
              Voodoo 视为跟踪 / 继续研究机会。反方论点是，BeReal、隐私 / 监管暴露、平台集中度以及仍为 B 级的杠杆，会在投资者按高溢价社交平台倍数承销时吃掉太多上行空间。
