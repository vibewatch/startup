            title: BeReal 整合是一场长周期赌注，不是快速修补
            body: >-
              Voodoo 买下 BeReal 时，它每月亏损 $3M。几个月内把它拉到盈亏平衡，在运营上值得肯定，但要创造足以支撑 €500M 收购价的收入规模，需要多年用户基数增长。Yazdi 在 2025 年 5 月称
              IPO 时间线为五年，意味着需要耐心资本。
            calloutType: insight
