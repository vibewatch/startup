      - number: '7.4'
        title: 财务杠杆、资本结构与信用风险
        blocks:
          - type: paragraph
            body: >-
              Voodoo 在杠杆化资本结构下运营，Fitch 评级为 'B'。2022 年底，ATT 冲击压缩利润率时，Fitch 定义的杠杆达到 70x——事实上接近困境水平。 公司此后通过自身现金流去杠杆，到 2024
              年底降至 4.8x。2024 年 10 月，Fitch 将评级列入 Rating Watch Negative，理由是 EUR220 million B 级定期贷款和循环信贷安排分别将在 2025 年 11 月和
              2025 年 5 月到期，存在再融资风险。到 2025 年 6 月，Voodoo 完成再融资后，Fitch 确认 'B' 评级并给出 Stable Outlook——公司用 EUR101 million
              账面现金和 EUR179 million 新贷款组合偿还 EUR220 million TLB，最终到期日延至 2029–2030。Fitch 同时因商业原因撤回所有评级。

              尽管再融资成功，实质财务风险仍在。Fitch 的正面敏感性要求 2025–2026 年杠杆保持在 4x 以下；基准情景下公司可以做到，但结果对 BeReal 表现敏感。 EBITDA 规模不大：Fitch 估计
              2024 年 EBITDA 为 EUR 63 million、FCF 为 EUR 14 million——对意外营运资金流出、过去收购 earn-out 付款或新一轮广告收入冲击的缓冲有限。 Fitch 预计
              2025 年 FCF 为收入的 3%，受低资本开支支撑，但被剩余债务的高利息支出部分抵消。公司激进且机会主义的 M&A 策略——截至 2025 年约 20 笔收购，包括 Beach Bum（$300
              million）和 BeReal（€500 million）——如果未来大型收购继续靠债务而非股权融资，将带来持续杠杆风险。

              没有已审阅公开来源披露再融资后的账面现金、详细债务摊销表、既往收购 earn-out 义务，或任何财务契约是否存在违约风险。公司管理层披露仍低于上市公司标准； Voodoo CEO 提到五年 IPO
              时间表，意味着经审计的上市公司式报告还要等数年。
