          label: 少数股东
          detail: Goldman Sachs、Tencent、GBL 提供资本和分发入口。
          tone: positive
        - id: platform-risk
          label: Apple/Google 平台约束
          detail: ATT 政策引发 2021–2022 年危机；结构性依赖两大守门人。
