chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、总部与运营模式
        blocks:
          - type: paragraph
            body: >
              Voodoo 是一家法国科技公司，开发并发行移动游戏和消费者应用，总部位于法国巴黎。公司由 Alexandre Yazdi 和 Laurent Ritter 于 2013
              年创立，自称使命是用标志性应用和游戏娱乐世界。它作为私营公司运营，法律实体为 Stan Holding SAS，该实体也用于安排公司的外部债务融资。


              Voodoo 的运营模式自创立以来变化很大。早期，公司聚焦快速原型的超休闲游戏——简单、免费游玩的移动产品，靠游戏内广告变现。2017 年至 2020 年，这一模式达到高峰，Voodoo 与全球 2,000
              多家合作工作室协作，收入达到数亿美元级别。2021 年以后，Apple App Tracking Transparency 政策变化使超休闲广告收入大幅下滑，公司主动转型。Voodoo
              把投资转向混合休闲游戏——玩法更复杂、生命周期更长，靠广告与应用内购买共同变现——同时切入消费者社交应用，并在 2024 年 6 月以 €500 million 收购 BeReal。


              截至 2026 年尽调日期，Voodoo 运营的多元化组合包括特许移动游戏（Mob Control、Paper.io、Block Jam）、支持 150 多家独立工作室的合作发行平台、BeReal
              社交照片应用，以及 Wizz、Blitz、Jamble 等其他消费者产品。公司 2024 年收入 $670 million（€623 million），月活跃用户 169 million，在 14 个国家约有
              800 名员工。超休闲游戏如今只贡献 22% 收入，低于 2021 年的 100%。
