      - number: '5.6'
        title: 技术差异化与证据缺口
        blocks:
          - type: paragraph
            body: >
              Voodoo 可观察的持久产品和技术优势集中在三处。第一是发行和 UA 引擎：一条每年测试近 2,000 个原型、年产 25,000 个创意、交付 250 billion
              次广告展示的管线，构成小发行商难以快速复制的工业级数据飞轮。规模化自有创意生产、横跨 169 million MAU 的第一方受众数据， 以及一个触达面未被社交平台完全覆盖的自有广告网络（据称 25%
              的网络用户仅靠社交媒体无法触达），共同提供了差异化 UA 表面。 第二是系列寿命延长：2024 年 80% 收入来自上线超过 2 年的游戏，反映出公司通过 LiveOps、远程配置和迭代式 A/B
              测试做出了真实产品深度， 而不是依赖“上线即衰减”的超休闲机制。第三是 BeReal 的产品约束设计：真实感机制（无滤镜、无点赞、双摄、每日一次）是可观察 IP， 并在社交媒体内部形成差异化；Nielsen
              广告研究虽然由公司委托，但给出了 BeReal 广告回忆相对 Instagram、TikTok、Snapchat、Facebook 和 Pinterest 的第一组独立数字数据。


              技术尽调应补齐的关键证据缺口包括：（1）BeReal 收购后的工程组织、后端架构、内容审核方法和云基础设施成本；（2）广告定向和推荐所用机器学习模型的来源和许可； （3）对 Voodoo
              广告技术栈和数据流的独立安全评估，尤其考虑到第一方 IDFA / GAID 数据量；（4）发行伙伴生态所用 SDK 的版本控制、发布节奏和向后兼容承诺； （5）游戏机制、广告格式或分析方法是否以专利形式注册任何
              IP；（6）支撑 Voodoo 组合内多人和社交功能的游戏后端，其冗余和可用性数据。
            claimRefs:
              - CE005
              - CE010
              - CE011
