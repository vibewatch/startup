        - 投资方：Goldman Sachs、Tencent、Groupe Bruxelles Lambert
        - 少数股权投资者；Tencent 提供亚太分发背景
        - 股权层面低到中等；Tencent 地缘政治风险是美国 / 欧盟监管者潜在关注点
