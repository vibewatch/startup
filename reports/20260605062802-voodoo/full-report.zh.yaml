      - number: '7.5'
        title: 爆款驱动的组合集中度与竞争执行风险
        blocks:
          - type: paragraph
            body: >-

              Voodoo 已把战略重心转向混合休闲游戏系列，但收入基础仍明显押在少数成功产品上。Fitch 说得很直白：「视频游戏行业天然由爆款驱动，现金流波动性因此更高。」公开资料里最显眼的旗舰游戏是 Mob
              Control、Paper.io 和 Block Jam，但单款游戏贡献利润、组合内收入占比、以及前三或前五产品依赖度均未披露。Voodoo 称 2024 年收入的 80%
              来自上线超过两年的游戏，这能降低但不能消除产品集中风险：支撑这一耐久性指标的，仍是同一小撮游戏系列。

              移动游戏竞争格局分散、进入门槛低。Fitch 将竞争形容为「激烈」且「进入壁垒低」，并指出 Voodoo 按下载量位列全球第三，但整体市场份额有限。Supercell（2024 年收入 €2.8
              billion，月活 300 million）和 Zynga（Take-Two 以 $12.7 billion 收购）等对手规模更大，也有平台方关系、系列 IP 库和更多元的品类覆盖。Voodoo
              转向「纯休闲」游戏——Yazdi 称单款游戏最高可贡献 €1 billion——更像愿景，尚未在公司当前规模上得到验证。要跑通这条路线，Voodoo
              需要持续投入研发、留住工作室人才、保持创意命中率；这些都缺少独立公开验证。

              合作工作室集中也可能演变成下行情景：Voodoo 的发行平台依赖 150+ 家工作室持续供给原型，收入分成、IP
              归属、工作室独家性等经济条款均未公开披露。如果头部工作室把更好的原型转投条款更优的竞品发行商，或混合休闲因市场饱和而命中率下滑，Voodoo 的发行引擎可能明显放慢。
            claimRefs:
              - CR034
              - CR036
              - CR037
              - CR038
              - CR043
      - number: '7.6'
        title: 治理不透明、关键人物依赖与披露风险
        blocks:
          - type: paragraph
            body: >-
              Voodoo 以 Stan Holding SAS 这一法律实体运营，是一家私人公司，创始人 Alexandre Yazdi 和 Laurent Ritter 仍保留多数控制权。本次审阅的公开资料没有披露
              Voodoo 董事会构成、任何独立董事姓名、审计委员会是否存在，或正式治理政策。作为创始人主导的私人公司，这种不透明并不意外；但以 Voodoo 的规模（2025 年收入 $778
              million）和公开债务历史看，这是重大尽调缺口。依赖本报告的投资者和债权人应把 Voodoo 视为一家集中所有权私人公司，治理风险也按这一口径评估，而不是按上市公司治理标准评估。

              对 CEO Alexandre Yazdi 的关键人物依赖，是首要执行风险。Yazdi 被视为 Voodoo
              超休闲时代以及随后转型至混合休闲和社交应用的主要设计者。他的个人公开沟通，也是公司战略方向最显眼的披露渠道。Maddyness 2026 年 5 月报道，Yazdi 个人取得 DC Company
              多数控制权；该法国数字媒体集团拥有 Konbini 和 Le Gorafi。这意味着他在带领一家收入 $778 million 的公司穿过关键整合与转型阶段的同时，又承担了个人外部投资承诺。Yazdi 并未离开
              Voodoo，但这笔外部个人投资说明他的注意力范围在扩大，构成合理的治理担忧。公开资料没有披露正式继任计划。Voodoo CEO 承认，公司「更多在谈五年维度」的
              IPO，这意味着当前治理和披露水平短期内不太可能实质改善。
            claimRefs:
              - CR030
              - CR031
              - CR032
              - CR040
              - CR044
