      - number: '1.3'
        title: 融资历史、投资者与债务结构
        blocks:
          - type: paragraph
            body: >
              Voodoo 已在三轮主要融资中披露超过 $800 million 股权融资，另有一笔杠杆债务，使其成为 frontier-AI 阵营之外融资最重的法国科技公司之一。第一轮主要融资发生在 2018 年 5
              月，Goldman Sachs 通过 West Street Capital Partners VII 基金投资约 $200 million，这是 2015 年以来法国科技领域最大融资。该轮后，Yazdi 和
              Ritter 仍保持多数控制权。


              2020 年 8 月，Tencent 以未披露金额成为少数股东；该轮给 Voodoo 的估值为 $1.4 billion。Tencent 合作也打开了 Voodoo 进入 APAC 市场的路径，尤其是
              Android 分发渠道和中国游戏受众。Voodoo 2020 年收入约 €360 million。


              2021 年 7 月，比利时投资控股公司 Groupe Bruxelles Lambert（GBL）投资 €266 million，主要认购新发行优先股，以投后股权估值 €1.7 billion 取得 16%
              股权。GBL 与 Goldman Sachs、Tencent 一同成为关键少数股东，创始人继续掌握控制权。


              债务端，Voodoo 发行过 €220 million 定期贷款 B（TLB），Fitch 给予 “B” 评级，后在 2025 年用可用现金和 €179 million 新贷款组合全额偿还。2025 年 4
              月再融资把债务到期日延至 2029–2030 年，也改善了公司的财务灵活性。Voodoo 从银行和机构伙伴联盟获得超过 €175 million 的总再融资。已披露融资总额（股权加债务）超过 $1
              billion；当前准确股权结构比例和 BeReal 收购 earnout 的完整条款未公开披露。
