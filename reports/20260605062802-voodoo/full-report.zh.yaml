      - number: '1.6'
        title: 风险因素、反向背景与尽调标记
        blocks:
          - type: paragraph
            body: >
              Voodoo 带有多项风险因素，对任何后续分析都很重要。结构上最关键的是，它过去和现在都依赖 Apple App Store 与 Google Play。Apple 在 2021 年更新 App Tracking
              Transparency（ATT）政策，对 Voodoo 原有商业模式几乎是生死事件：超休闲收入一年内腰斩，EBITDA 杠杆到 2022 年底飙至
              70x。公司通过根本性重组恢复过来，但这一事件证明，平台政策风险是系统性的，即便最大超休闲发行商也无法完全管理。


              Fitch Ratings 最近在 2025 年 6 月仍把 Voodoo 的 Long-Term Issuer Default Rating 评为 “B”（投机级），随后在 TLB
              偿还后因商业原因撤销评级。“B” 评级反映了规模偏小、BeReal 整合执行风险、竞争激烈、平台和类型多元化有限，以及激进财务政策。Fitch 估计按其定义的 EBITDA 约为 €63
              million，远低于公司自报的 €135 million EBITDA，原因是 Fitch 将开发成本作为运营费用处理，而非资本化资产。


              BeReal 整合风险仍在发生。收购时，BeReal 处于亏损状态（每月现金消耗 $3 million），用户基数下滑，也尚未开始变现。截至 2025 年初，Yazdi 称其用户基数已稳定在法国约 30
              million 月活跃用户，但尚未恢复增长。Yazdi 在 2025 年 5 月提到的五年 IPO 时间线，以及未披露任何退出机制，说明 Voodoo
              已承诺一条较长的私人市场跑道；在这条路上，执行交付比近期流动性事件更重要。投资者应把 BeReal earnout 条款、Tencent 未披露持股比例、GBL 治理权利作为需要 data-room
              访问的尽调项。
            claimRefs:
