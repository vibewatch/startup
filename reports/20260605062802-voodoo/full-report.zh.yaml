          - type: paragraph
            body: >-
              融资历史给了 Voodoo 战略灵活性，但不能替代当前现金流量表。第三方和投资者来源显示，Goldman Sachs 在 2018 年投资约 $200 million；Tencent 在 2020 年以据称
              $1.4 billion 估值取得少数股权；GBL 在 2021 年以 €1.7 billion 投后股权价值投资 €266 million。Sacra 估计累计融资 $812 million，2022 年估值
              $2.1 billion；PitchBook 将 Voodoo 列为私人公司。 这些数据点解释了其历史上收购工作室和 BeReal
              的能力，但当前资产负债表不可见：所审阅来源没有披露账面现金、债务、月度烧钱速度、现金跑道、 BeReal earnout
              义务或工作室收购负债。已报告盈利降低了融资依赖，但没有消除它，因为消费者应用组合仍需要大额获客预算，并暴露于平台费。
