            title: 全球规模下的数据驱动发行
            body: Voodoo 的竞争优势——每年用真实用户数据测试近 2,000 个原型，再决定是否放大——持久且难复制。这台机器已经在三个不同游戏类型（超休闲、混合休闲、中度游戏）中做出数十亿下载量，如今也正被用于社交应用。
            calloutType: strength
