      - number: '5.4'
        title: BeReal 产品与技术
        blocks:
          - type: paragraph
            body: >
              BeReal 是一款移动社交应用，成立于 2019 年（2020 年公开上线），2024 年 6 月被 Voodoo 以 €500 million 收购。产品设计独特且可观察：
              每天一次，所有用户都会在随机时间收到推送通知（“It's Time to BeReal”），并有两分钟窗口同时拍下前后摄像头照片。应用有意移除滤镜、后期编辑、
              粉丝数和公开点赞指标，把自己定位为精修社交媒体的反面。用户必须先发布自己的当日内容，才能查看朋友当天的帖子。反应用“RealMoji”脸部捕捉表达，而不是抽象计数。
              机制的简单性和有意设置的产品约束公开、可观察，也构成差异化。


              BeReal 的广告产品同样可观察：前 / 后双摄格式被用于品牌广告，广告以与自然内容相同的格式出现。BeReal 委托 Nielsen 并于 2026 年 3 月发布的研究发现， 在社交媒体平台中，BeReal
              在 EMEA（法国、德国、英国）的 Strong Ad Recall 和 Strong Purchase Consideration 排名 #1。研究报告称，相比竞品平台
              （Instagram、TikTok、Snapchat、Facebook、Pinterest）平均值，购买考虑度相对提升 35%，广告回忆相对提升 23%。在 EMEA 用户中， 56% 表示前 /
              后广告格式让他们更可能点击品牌广告。研究方法已披露：Nielsen 执行调查，英国样本为 2,308 名总受访者、其中 600 名 BeReal 用户； 德国为 2,220 名、其中 593 名 BeReal
              用户；法国为 2,673 名、其中 769 名 BeReal 用户。限制在于，研究由 BeReal 委托，带来独立性疑虑。


              BeReal 全球月用户超过 40 million，主要市场在美国、日本和法国；超过 50% 的用户每周活跃六天。Voodoo 2025 年年末沟通称，BeReal 在 2025 年产生 €30 million
              收入（2024 年收购时为零），并称受众在“法国趋于稳定”、在“日本强劲增长”。公司给出的盈利路径是到 2027 年。前文来自收购前的反向证据
              （Sifted：亏损且用户基数下降；TechCrunch：资金即将耗尽；Sensor Tower：2023–2024 年末 MAU 平均每月下降 2%）仍在记录中； 2025
              年收入数字是公司声明，未被独立财务披露佐证。


              BeReal 超出产品层的技术架构——后端栈、云服务商、CDN、内容审核基础设施和工程人员规模——没有公开披露。产品同时在 Apple App Store 和 Google Play 上架。
              应用内购由应用商店处理，不由 BeReal 自有支付栈处理。2026 年 5 月隐私政策说明，公司收集聊天、GPS 位置共享和反应数据。
