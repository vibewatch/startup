  - id: FO003
    title: 快照 KPI
    type: kpi
    layout: standard
    summary: 公开可支持的快照指标显示，Voodoo 是一家盈利且高速增长的移动发行商，但当前股权估值未确认，公司口径和 Fitch 口径的 EBITDA 定义也存在明显差异。
