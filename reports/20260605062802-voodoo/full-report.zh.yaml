        - 永久结构性依赖；没有可行的 iOS 替代分发渠道
      - - Google Play 分发与 UAC 需求
        - Alphabet / Google
        - Android 分发渠道；主要 UAC 用户获取需求来源；AdMob 广告填充
        - 关键 — Android 占全球移动游戏下载量大多数
        - Google Play 在数据收集、IAP 计费或 Privacy Sandbox 实施上的政策变化
        - 高 — Privacy Sandbox 推迟但未消除 Android 上的信号丢失风险
        - Android 多元化空间有限；Google UAC 替代方案（Meta、AppLovin）部分可用
        - 风险敞口显著；Google Privacy Sandbox 仍在演进
      - - 程序化 DSP（Google DV360、Trade Desk、Amazon、AppLovin MAX）
        - 多个需求方平台
        - 为 Voodoo 和合作伙伴游戏的游戏内库存填充程序化广告需求
        - 高 — 90%+ 数字展示广告通过程序化交易；少数 DSP 控制大部分支出
        - DSP 算法变化、底价政策变化，或大型广告主撤回
        - 中高 — CPM 压缩会传导至所有广告变现游戏
        - 借助 AppLovin MAX、AdMob、Unity Ads 做聚合多元化；品牌直客合作
        - 结构性依赖 2–3 家主导 DSP；未公开确认私有市场合同
      - - BeReal 用户基础和社交图谱
        - BeReal 用户（截至 2025 年初 MAU 30M+）
