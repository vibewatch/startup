  - id: FM001
    title: 市场规模金字塔——Voodoo 可触达层级
    type: pyramid
    layout: standard
    summary: 从全球移动游戏 TAM 逐层收窄到休闲游戏 SAM、混合休闲子赛道，再到 Voodoo 2025 年实际游戏收入。每层都有不同分析师方法框定；SOM 代理值来自公司披露的游戏收入，并非正式市场份额估计。
    data:
      items:
        - label: 全球移动游戏 TAM（2025）
          value: $126–165B
          detail: >-
            Statista/manataz（$126B，仅 IAP）到 GMI/ResearchAndMarkets（$165B，口径更宽）给出一区间；Precedence Research 中点 $143.96B
            被引用最多。
          tone: neutral
        - label: 休闲移动游戏 SAM（2025）
          value: ~$35–40B
          detail: AppMagic/Ripple Reports 估计休闲 IAP 为 $35–38B；Voodoo CEO Yazdi 引用约 $40B，包含广告收入，相比旧的窄口径「更深也更有韧性」。
