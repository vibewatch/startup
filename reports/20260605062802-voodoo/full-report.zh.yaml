      - number: '5.3'
        title: 核心技术基础设施与广告栈
        blocks:
          - type: paragraph
            body: >
              Voodoo 的技术基础设施主要通过招聘信息、公开开发者材料和伙伴访谈可见，而不是直接架构披露。Engineering and Data 团队页面把该团队描述为 “Voodoo
              的中央技术枢纽”，用“务实方法创造推动增长的创新解决方案，范围从简单搜索到复杂机器学习系统”。2026 年两则活跃高级岗位给出了底层基础设施最清晰的公开信号： Senior Data
              Engineer（Feature Platform）岗位描述了为广告定向所用 ML 功能构建可扩展架构，支持离线训练和在线推理的批处理与实时数据处理； Senior ML Engineer（Offline
              Team）岗位描述了开发和维护广告定向模型的 ML 训练基础设施，包括优化管线并扩展广告网络的数据源。


              广告中介栈可以部分观察到。Voodoo 与 iion 的访谈确认，公司依赖“可信且韧性的中介和网络仪表盘、稳定的 SDK 集成、清晰的版位指南”。 行业报道和 SDK 文档确认其集成 AppLovin
              MAX、Google AdMob 和 Unity Ads，并使用瀑布流与程序化竞价混合模型。GitHub 上的社区 VoodooSDK 仓库实现了一个轻量 Unity 变现
              SDK，包含同步和异步初始化、激励广告回调（rewarded / failed / skipped）、预加载与就绪检查， 以及用于配置 Application ID 的 Editor 工具。这个第三方实现确认了
              SDK 激励广告接口的 API 设计，以及其 Unity Package Manager 分发方式。


              Voodoo 使用功能开关和 holdout 进行安全发布与快速回滚，并近实时跟踪 ANR 和崩溃率、广告调用延迟、留存信号和投诉数据，管理广告质量。
              公司自研分析平台在隐私政策中被列为与第三方服务并用、用于分析和产品改进的工具。所有已审阅公开来源都没有披露具体云基础设施供应商（AWS、GCP、Azure）。
