      - number: '8.4'
        title: BeReal 期权价值与下行
        blocks:
          - type: paragraph
            body: >-
              BeReal 是 Voodoo 估值最大的摆动因素。官方口径是，Voodoo 2024 年 6 月以 €500 million 收购 BeReal，并称其拥有超过 40 million
              活跃用户，还能在产品、增长和基础设施上产生战略协同。独立和后续报道更谨慎：Sifted 称 BeReal 收购前亏损且用户基础下滑，经过 Voodoo
              降本和变现后达到盈亏平衡，用户稳定但没有加速；TechCrunch 将出售描述为 BeReal 的最佳退出；Business of Apps 报告的用户和收入估算则波动较大。上行情景是，Voodoo 把庞大的
              Gen Z 社交图谱转成盈利广告产品，同时不破坏真实性。下行情景是，这项资产变成低增长、低注意力且背着监管包袱的社交网络。noyb 指控 BeReal 反复诱导用户同意广告追踪，Lewis Silkin
              也就同一暗黑模式指控发表法律评论；这些都是真正的负面来源，因为它们把变现直接连到隐私信任和潜在执法风险。
