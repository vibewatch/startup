  - id: FM004
    title: Voodoo 价值链——从工作室创意到变现用户
    type: funnel
    layout: standard
    summary: >-
      Voodoo 的发行商模式把工作室游戏创意转成可变现安装，靠数据驱动测试管线、规模化用户获取和多元化组合变现栈推进。每一阶段都把潜在用户收窄为创收用户；从每年 1.5B 下载到 169M MAU（约
      11%）的隐含留存率，说明系列游戏粘性在混合休闲模型里很关键。
    data:
      items:
        - label: 工作室创意或合作方提案
          value: 100
          detail: Voodoo 自有工作室和 150+ 家合作工作室每年原型开发或评估 2,000+ 款游戏。
          tone: neutral
        - label: 测试与分析闸口
          value: 15
          detail: Voodoo 的数据驱动测试管线用早期 KPI 筛查可行游戏（D1/D7 留存、单次时长、CPI 测试）。这一阶段会淘汰大多数原型。
          tone: neutral
        - label: 全球发行与用户获取
          value: 5
          detail: 通过测试的游戏获得完整 UA 预算、全球发行和本地化；Voodoo 出资做 UA，换取收入分成或完整所有权。
          tone: positive
        - label: 应用安装（年度下载基数）
          value: 2
          detail: 2025 年全部游戏 1.5B 次下载；2024 年为 950M。下载基数处在变现漏斗顶端；多数安装不会转化为长期活跃用户。
          tone: positive
        - label: 活跃月用户
          value: 1
          detail: 2025 年游戏与社交应用合计 169M MAU。按下载量算，年留存约 11%（1.5B 安装 → 169M MAU）。混合休闲系列游戏让 MAU 更集中。
          tone: positive
        - label: 变现用户（IAP 或广告收入）
          value: 0.5
          detail: 公司未披露准确变现用户数。IAP 付费用户只占 MAU 的一部分；广告收入来自覆盖更广的活跃用户基数。休闲游戏行业的 IAP 付费率通常为 MAU 的 1–5%。
          tone: neutral
    approximationNotes: 数值只是可视化用的漏斗序位权重，不代表实际测得的转化率。细节中列出有来源支撑的数字。变现用户阶段值（0.5）反映休闲游戏行业标准 IAP 付费率，并非 Voodoo 专门披露的指标。
