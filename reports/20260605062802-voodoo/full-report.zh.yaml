        - label: 混合休闲子赛道（2025）
          value: ~$9.8B (IAP)
          detail: 据 Ripple Reports，这是增长最快的休闲子层级；2024 年同比增长 37%；预计 2026 年达 $12.5B。该数未计入与 IAP 同时流经同一批游戏的广告收入，计入后总池会扩大。
          tone: positive
        - label: Voodoo 游戏收入（2025，SOM 代理）
          value: $653M
          detail: 公司披露 2025 年游戏收入（占 $778M 总收入的 90%）；相当于休闲游戏 IAP 市场约 1.6–1.9%。这不是正式 SOM；公司未披露按品类拆分的收入。
          tone: neutral
    approximationNotes: 各层不可相加；每层都在上一层基础上收窄。混合休闲 IAP 数字不含同一批游戏产生的广告收入；若计入广告，子赛道规模会更大。Voodoo 的 SOM 代理只使用游戏收入，不包括合作平台收入分成。
