  - id: FP003
    title: 护城河 / 准备度 KPI
    type: kpi
    layout: standard
    summary: 用七个维度压缩总结 Voodoo 的竞争耐久性，覆盖游戏护城河强度、BeReal 护城河弱点和近期竞争风险因素。评估来自保留的公开证据。
