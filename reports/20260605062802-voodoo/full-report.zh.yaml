        - 未知 — 未确认公开安全认证、事件响应计划或漏洞赏金计划
        - 高 — 私人照片和位置数据规模化存在；监管和声誉暴露重大
        - 公开资料中没有独立安全认证、泄露披露或事件历史
      - - App Store 和 Play Store 政策冲击 — 意外规则变化影响激励视频、IAP 或 SDK 数据收集
        - 中 — 平台频繁更新政策；激励视频一直稳定，但 ATT 曾造成重大冲击
        - 高 — 若政策变化影响激励视频或 IAP 计费，会通过共享 SDK 同时传导至 150+ 合作工作室
        - 低中 — Voodoo 是有经验的发行商，会跟踪平台政策变化；但没有结构性对冲
        - 中 — 单一政策冲击可能在准备时间有限时压缩整个组合的 EBITDA 利润率
        - 未披露面向合作工作室网络的应用商店政策冲击应急计划
      - - SDK 稳定性和版本碎片化 — 设备和 OS 版本冲突导致 ANR / 崩溃问题
