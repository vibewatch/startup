      - number: '2.3'
        title: 买方、用户与付费方分层
        blocks:
          - type: paragraph
            body: >
              Voodoo 的业务横跨三个不同的买方—用户—付费方配置；每个配置的预算归属、采用触发点和变现机制都不同。


              在超休闲和混合休闲游戏中，终端用户与消费者付费方是同一个人——一个安装免费游戏的移动消费者，可能购买应用内道具，也可能通过观看广告展示被动产生广告收入。不过，在广告变现游戏里，Voodoo 的直接收入对手方是对
              Voodoo 广告库存出价的移动效果广告主或需求侧平台，主要是希望获客的其他游戏发行商，以及非游戏品牌。因此广告变现是 B2B2C 收入结构，而 IAP 变现是直接 B2C 交易。


              对 Voodoo 支持 150 多家独立工作室的合作发行平台，买方是寻求发行基础设施和用户获取资本的工作室。工作室交出收入分成，换取 Voodoo 的分析测试流水线、全球 UA
              能力和分发触达。预算所有者是工作室创始人或独立团队；采用触发点是需要以 Voodoo 能通过组合级优化吸收的 UA 成本实现全球分发。该板块没有单独披露收入线。


              对 BeReal，截至 2025 年，主要付费对手方是希望通过情境化、真实感投放触达 BeReal Gen Z 用户基数的品牌广告主。终端用户——Gen Z 消费者——既是受众，也是内容创作者。BeReal 于
              2025 年 4 月推出美国广告平台，称月活跃用户 40 million，其中美国用户 5
              million。平台的格式约束（双摄同时拍摄、不能编辑、没有滤镜）限制了广告库存类型，把采用范围收窄到愿意接受真实感约束和更窄程序化格式的品牌。广告平台推出后的第一年，超过 200 个品牌试验了 BeReal
              活动，这说明广告主已有早期兴趣，但还不能证明结构性市场深度。
