      - number: '2.5'
        title: 约束、逆风与规模测算缺口
        blocks:
          - type: paragraph
            body: >
              对 Voodoo 游戏业务而言，结构上最重要的约束是 Apple 2021 年推出的 App Tracking Transparency（ATT）框架持续影响。ATT 要求用户对跨应用追踪给出明确 opt-in
              同意，实际上消除了超休闲发行商过去用来校准用户获取支出的确定性用户级归因。ATT 之后，休闲移动游戏 eCPM 在部分报告期下跌 20–40%，且尚未完全恢复到 2021
              年前水平。这个约束是结构性的，不是周期性的：Apple 没有表现出撤回政策的意愿，Google 也跟进了 Android Privacy Sandbox 限制。Voodoo 转向混合休闲和
              IAP，很大程度上是对这一约束的战略回应，而不只是机会主义扩张；公司自身历史就是最有说明力的例子——ATT 落地后，EBITDA 杠杆到 2022 年底约达 70x。


              第二个约束是平台集中度。Apple App Store 和 Google Play 共同控制西方市场的应用分发，各自对 IAP 交易抽取 15–30%
              佣金，并对应用审批、算法发现和政策执行行使自由裁量权。任一平台发生重大政策变化——新的隐私限制、激励广告标准变化，或禁止某种特定游戏机制——都可能在预警有限的情况下影响 Voodoo 收入。由于核心游戏业务
              100% 依赖移动操作系统应用商店，Voodoo 的整个组合会同时暴露在这一风险下。


              第三个约束是用户获取成本通胀。更多发行商从超休闲转向混合休闲后，对有安装意图用户的竞争加剧，CPI 上升。混合休闲游戏需要显著高于超休闲的 CPI，拉长回本周期，也要求更深的 IAP
              变现来维持单位经济。数据基础设施较弱或类型目录更窄的发行商会处于结构性劣势，但这也抬高了最小可行投资门槛，使该类别越来越难被小型运营方进入。


              BeReal 面临不同约束。它给用户的核心承诺——无滤镜、前后摄像头同时拍摄的真实感——限制了广告库存类型和数量。历史调查发现，变现前 80% 的 BeReal
              用户看重这个平台，正是因为它没有传统广告。下载轨迹为负：年度下载量从 2023 年到 2024 年同比下降 60%，估计 2025 年又下降 50%。最重要的规模测算缺口是 MAU 差异：截至 2025 年 4
              月美国广告平台发布时，Voodoo 和 TechCrunch 引用 40 million MAU，而包括 Online Optimism 在内的外部分析来源把数字放在接近 16 million——两者相差
              2.5x，公开报道中尚未解决，并会实质影响 BeReal 的变现潜力和可触达广告库存。
            claimRefs:
              - CM028
              - CM029
              - CM030
              - CM031
