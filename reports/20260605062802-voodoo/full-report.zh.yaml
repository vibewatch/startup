      - number: '7.2'
        title: 平台依赖与广告市场风险
        blocks:
          - type: paragraph
            body: >-
              Fitch 明确把 Voodoo 对两大分发平台——Apple App Store 和 Google Play——的高度依赖列为关键评级约束，并指出 Apple 收紧隐私政策已对整个手机游戏子行业产生结构性影响。
              对 Voodoo 而言，Apple ATT 框架在 2021 到 2022 年间造成直接收入冲击，使 EBITDA 利润率从健康水平跌至 2022 年的 0.8%，迫使公司战略从超休闲广告转向别处。
              即便已转向混合休闲游戏和应用内购（2024 年收入占比 45%，而 2021 年为 1%），Voodoo 收入基座仍通过广告网络和 BeReal 新生广告产品，大幅暴露于程序化广告。

              2026 年，程序化广告估计占数字展示广告交易的 90%，需求侧平台集中在 Google DV360、The Trade Desk、Amazon 等少数玩家手中。 Digital Applied 报告称，2026
              年程序化供应链 SIVT 欺诈率为 8.7%，对发行商构成结构性效率损耗。Voodoo 的广告变现负责人将隐私驱动的信号丢失列为广告质量五大威胁之一， 与误导性创意、SDK
              冲突导致的性能不稳定、程序化供应漂移，以及 OS 版本碎片化并列。

              平台集中风险有两个方向：政策变化（例如 App Store 审核指南进一步收紧、SDK 数据收集政策变化，或激励视频广告机制调整）可能同时压低整个组合的填充率或变现收益。 单一 App Store
              政策变动若影响激励插屏广告，会沿着所有使用 Voodoo SDK 的 150+ 家伙伴工作室级联，放大收入影响。分发风险还被一个事实加剧： Voodoo 没有实质替代分发渠道——在全球 iOS 上，基于 Web
              的 PWA 分发、侧载和第三方商店都微不足道。
