  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 平台和监管风险是上游传导节点；它们先流向收入压缩，再流向 EBITDA 杠杆恶化，最终落到融资风险和估值受损。BeReal 是并行风险路径，会把广告收入波动直接带入杠杆测算。
    data:
      nodes:
        - id: att_platform
          label: Apple ATT / Play Store 政策
          detail: 结构性平台依赖——政策变化会在产品组合层面压缩广告定向、UA 效率和 IAP 机制
          tone: risk
        - id: regulatory
          label: 监管执法（CNIL / FTC COPPA / DSA）
          detail: 直接罚款、运营层面的同意机制调整，以及信任与安全成本上升
          tone: risk
        - id: bereal_users
          label: BeReal 用户走势
          detail: MAU 稳定在 ~30M；再互动率 19%；一旦重新下滑，变现基础就被抽走
          tone: risk
        - id: ad_revenue
          label: 广告收入（游戏 + BeReal）
          detail: Voodoo 最大单一收入池；由游戏内广告和 BeReal 品牌广告组成
          tone: neutral
        - id: iap_revenue
          label: IAP / 应用内购买收入
          detail: 占 2024 年收入的 45%；波动更小；部分缓冲广告市场敞口
          tone: positive
        - id: ebitda
          label: EBITDA 和 FCF
          detail: 2024 年 Fitch 定义 EBITDA 为 EUR 63M；FCF 为 EUR 14M；抵御反向事件的缓冲很薄
          tone: neutral
        - id: leverage
          label: 债务杠杆（2024 年末 4.8x）
          detail: Fitch 评级为 B；4.0x 触发负面敏感性；已再融资至 2029–2030 年到期
          tone: neutral
        - id: portfolio_concentration
          label: 爆款驱动的产品组合集中
          detail: 收入集中在 Mob Control、Paper.io、Block Jam；未披露单款游戏数据
          tone: risk
        - id: governance
          label: 治理不透明 / CEO 关键人
          detail: 没有独立董事会；没有继任计划；CEO 个人有外部投资
          tone: risk
        - id: investment_thesis
          label: 投资逻辑与估值
          detail: B 评级私营公司；5 年 IPO 窗口；最近披露股权价值 €1.7B
          tone: neutral
      edges:
        - from: att_platform
          to: ad_revenue
          label: CPM 和定向信号压缩
        - from: att_platform
          to: iap_revenue
          label: UA 成本上升拉长新用户回本
        - from: regulatory
          to: ad_revenue
          label: 同意机制变化减少可定向库存
        - from: regulatory
          to: ebitda
          label: 罚款和整改成本直接拖累 EBITDA
        - from: bereal_users
          to: ad_revenue
          label: MAU 下滑减少 BeReal 广告库存
        - from: ad_revenue
          to: ebitda
          label: 广告收入是 EBITDA 最大驱动项
        - from: iap_revenue
          to: ebitda
          label: IAP 提供更稳定的 EBITDA 贡献
        - from: portfolio_concentration
          to: ad_revenue
          label: 单款游戏下滑传导到总广告收入
        - from: ebitda
          to: leverage
          label: EBITDA 下滑推高杠杆率
        - from: leverage
          to: investment_thesis
          label: 杠杆 >4x 触发 Fitch 负面敏感性
        - from: governance
          to: investment_thesis
          label: CEO 离任或董事会弱化损害战略执行
    claimRefs:
      - CR005
      - CR006
      - CR008
      - CR009
      - CR027
      - CR033
      - CR036
      - CR037
      - CR038
      - CR043
  - id: FR003
    title: 依赖图——关键外部依赖
    type: dag
    layout: wide
    summary: Voodoo 的运营模式依赖少数关键外部节点。Apple 和 Google 是集中度最高的两个依赖项，在规模化场景下没有可行替代。程序化 DSP 和 Meta UA 是创收关键路径。
    data:
      nodes:
        - id: voodoo_core
          label: Voodoo / Stan Holding SAS
          detail: 巴黎私营公司；800+ 员工；2025 年收入 $778M；B 评级杠杆主体
          tone: neutral
        - id: apple
          label: Apple App Store
          detail: iOS 唯一分发渠道；30% IAP 费率；ATT 隐私框架执行者
          tone: risk
        - id: google_play
          label: Google Play
          detail: Android 分发渠道；主要 UAC 需求；AdMob 广告填充；Privacy Sandbox 演进
          tone: risk
        - id: dsp_network
          label: 程序化 DSP 网络（DV360、Trade Desk、AppLovin MAX）
          detail: 90%+ 数字展示支出通过程序化交易；少数 DSP 控制大部分预算
          tone: risk
        - id: meta_ua
          label: Meta（Facebook/Instagram UA）
          detail: 移动游戏主导性付费获客渠道；社交游戏曝光份额
          tone: neutral
        - id: bereal_asset
          label: BeReal 社交平台
          detail: €500M 收购；30M MAU；约 $2M/月收入；公司称已盈亏平衡，但 Fitch 口径仍亏损
          tone: risk
        - id: partner_studios
          label: 合作工作室（150+）
          detail: 外部游戏原型供给；收入分成经济性未披露
          tone: neutral
        - id: fitch_financing
          label: 债权人（EUR 179M 新贷款）
          detail: 再融资后债务；2029–2030 年到期；契约未公开披露
          tone: neutral
      edges:
        - from: apple
          to: voodoo_core
          label: iOS 分发、IAP 计费、ATT 政策
        - from: google_play
          to: voodoo_core
          label: Android 分发、UAC、AdMob 填充
        - from: dsp_network
          to: voodoo_core
          label: 程序化广告收入（游戏内 + BeReal）
        - from: meta_ua
          to: voodoo_core
          label: 付费 UA 创意活动
        - from: bereal_asset
          to: voodoo_core
          label: 社交 App 收入与战略多元化
        - from: partner_studios
          to: voodoo_core
          label: 发行平台的游戏原型供给
        - from: fitch_financing
          to: voodoo_core
          label: EUR 179M 债务资本；契约义务
    claimRefs:
      - CR005
      - CR009
      - CR019
      - CR026
      - CR028
      - CR034
      - CR041
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: Voodoo 从规模化质量标的转入价格敏感的观察轨道，因为影响估值的关键输入仍是私有数据。
    data:
      nodes:
        - id: scale
          label: 已观察到规模和盈利能力
        - id: mix
          label: 混合休闲品类占比提升，质量改善
        - id: leverage
          label: B 评级杠杆和再融资约束
        - id: bereal
          label: BeReal 期权价值叠加反向隐私风险
        - id: opacity
          label: 缺少股权结构表和经审计的 2025 年账目
        - id: stance
          label: 观察 / 继续研究；合理到偏高
    approximationNotes: 基于引用的公开证据的定性决策流。
    claimRefs:
      - CV001
      - CV002
      - CV006
      - CV016
      - CV033
      - CV038
