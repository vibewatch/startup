      - number: '3.6'
        title: 图表与证据
        blocks:
          - type: callout
            title: BeReal 护城河很薄，正被规模大 60–100x 的巨头主动克隆
            body: >-
              BeReal 的核心机制——每天一次、前后摄像头同步、不过滤的日常照片——已被 Instagram（Candid Stories）和 TikTok（Now）直接复制， 而两者 MAU 是 BeReal 的
              60–100x。社交图谱浅，切换成本接近零，也没有消息或连续打卡机制提供支撑 Snapchat 在 Gen Z 中留存的结构性锁定。 最可信的护城河建设路径需要多年产品功能开发，还要面对能大幅砸钱超过
              Voodoo 的既有巨头。
            calloutType: risk
            claimRefs:
              - CP016
              - CP019
              - CP025
              - CP032
          - type: callout
            title: Supersonic 被迫退出，为混合休闲发行商打开重要并购窗口
            body: >-
              Unity 决定关闭 ironSource Ads Network 并出售 Supersonic Studios，把最大混合休闲发行商之一移出了独立竞争池。Supersonic 的 6.6 billion
              生命周期下载量和 190 million 月活跃用户，是重要的规模资产。如果 Voodoo 或另一家资本充足的发行商收购 Supersonic 组合，
              混合休闲发行的竞争格局可能明显向收购方重构。截至尽调日期，买方尚未披露，这一结果仍未定。
