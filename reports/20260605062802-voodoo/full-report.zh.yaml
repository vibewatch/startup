      - number: '5.5'
        title: 隐私、合规与信任控制
        blocks:
          - type: paragraph
            body: >
              Voodoo 维护一份适用于所有应用和游戏、符合 GDPR 的隐私政策，最近更新于 2026 年 5 月 19 日。政策列明数据保护官邮箱 dpo@voodoo.io， 说明应用和游戏不面向 16
              岁以下用户，并描述基于合同履行、法律义务、正当利益和同意等法律依据处理数据。广告和变现数据处理（使用第三方广告 SDK）披露为依赖同意或正当利益。
              隐私政策明确表示，广告伙伴选择和个性化由“作为独立数据控制者行事”的广告和中介伙伴执行——这一披露与 GDPR Article 26 安排一致。 Voodoo 对加州用户也有按年龄限制的 CCPA
              义务。崩溃监控、稳定性日志和 A/B 测试被列为独立处理目的，并各自注明法律依据。


              BeReal 隐私政策更新于 2026 年 5 月 13 日。政策禁止 13 岁以下用户使用，对未成年人采用更严格的位置默认设置（近似城市级位置，而非街道级位置），
              并要求注册账号时提供电话号码、全名、出生日期和用户名。BeReal 明确表示不收集或存储信用卡信息——支付由 Apple App Store 或 Google Play 处理。 BeReal 政策覆盖 GPS
              位置、聊天消息、RealMoji 反应和相机数据。


              广告质量方面，Voodoo 的集中式广告运营方法记录在 2025 年 iion 对 Baptiste Durif（Head of Ad Monetisation and User Acquisition
              Innovation）的访谈中， 包括严格书面指南，覆盖创意完整性、版位设计、品牌安全、频率、政策合规和技术表现。伙伴工作室以书面形式接受这些指南。新伙伴先经历小规模测试，并由实时监控跟踪，再进入放量。
              违反标准的伙伴会立即暂停；问题持续则移除。Voodoo 使用功能开关和 holdout 快速回滚任何损害质量指标的变现方案，即便该方案提升收入。


              公开领域没有找到针对 Voodoo 游戏平台或 BeReal 后端基础设施的独立安全审计、渗透测试认证、ISO 27001、SOC 2 或类似第三方技术保证文件。
