  - id: TR001
    title: 监管 / 法律风险登记表
    columns:
      - 规则 / 牌照 / 案件
      - 司法辖区
      - 状态
      - 可能性（复发）
      - 严重性
      - 缓释措施
      - 剩余暴露
      - 尽调路径
    rows:
      - - CNIL €3M 罚款 — IDFV 同意违规（法国 DPA 第 82 条）
        - 法国
        - 已结案（2023 年 7 月）；同意窗口修复后禁令解除；CNIL 保留持续监督权
        - 中 — CNIL 可随时复查合规；合作工作室 SDK 同意机制重做存在风险
        - 中 — 罚款已缴；剩余风险是重新调查、追加处罚和声誉损害
        - 2023 年部署符合 ATT 的新同意窗口；合作伙伴网络采用集中式广告运营标准
        - 复查风险仍在；合作工作室同意流程审计未获独立确认
        - 要求提供 CNIL 审计往来、当前隐私合规方案和合作工作室同意清单
      - - FTC COPPA 2026 规则修订 — 广告定向和第三方共享需单独取得父母同意
        - 美国
        - 生效 — 规则自 2026 年 4 月 22 日全面生效；FTC 在 2026–2030 计划中列为执法重点
        - 高 — Voodoo 的超休闲 / 混合休闲组合会吸引 13 岁以下玩家；SDK 生态覆盖 150+ 工作室，包含第三方分析和广告 SDK
        - 高 — 罚款最高 $51,744 / 次违规 / 天；可能签署同意令；第三方 SDK 责任
        - 美国应用需要集中式同意架构；年龄门槛和父母同意流程未获独立验证
        - 尚未确认 Voodoo 是否已部署符合 COPPA 2026 的同意架构；若第三方 SDK 未取得单独同意就收集儿童数据，暴露很大
        - 要求提供 COPPA 合规方案文件、第三方 SDK 数据流，以及美国前 10 款游戏的年龄门槛部署证据
      - - 欧盟《数字服务法》（DSA）— UGC 平台透明度报告和儿童安全
        - 欧盟
        - 生效 — 自 2025 年 7 月起必须提交年度透明度报告；欧盟委员会已发布儿童安全指南
        - 中高 — BeReal 以及任何带社交或聊天功能的 Voodoo 游戏均在范围内；2025 年针对欧盟平台的执法行动超过 100 起
        - 高 — 不合规罚款最高可达全球年营业额 6%（按 2025 年收入约 $47M）；可能暂停服务
        - 未公开确认 Voodoo 或 BeReal 已提交 DSA 透明度报告或任命欧盟法律代表
        - 公开资料中未找到 Voodoo 或 BeReal 的 DSA 透明度报告；结合执法趋势，这是重大缺口
        - 确认 DSA 合规状态、年度透明度报告提交情况，以及 BeReal 内容审核信任与安全团队人数
      - - GDPR / ePrivacy — 广告 SDK 网络持续收集个人数据
        - 欧盟
        - 持续 — CNIL 确认 2023 年结案，但保留复查权；更广泛的 ePrivacy 改革仍在讨论
        - 中 — GDPR 持续执法；任何新功能或 SDK 集成都可能触发审查
        - 中 — 罚款上限为全球营业额 4%；同意管理带来运营负担
        - 自 2023 年 7 月起采用符合 CNIL 要求的同意窗口；Voodoo 集中管理广告质量和政策合规
        - 持续存在；合作工作室 SDK 更新需重新验证；ePrivacy 演进增加不确定性
        - 要求提供当前 DPA 登记表、数据留存计划和第三方处理方协议
      - - 英国《在线安全法》— UGC 和社交平台义务（BeReal 英国用户）
        - 英国
        - 生效 — UK OSA 适用；Ofcom 执法指南自 2025 年起生效
        - 中 — BeReal 在英国有一定用户基础；UK OSA 施加非法内容移除和儿童安全义务，类似 DSA
        - 中 — Ofcom 罚款最高可达全球收入 10%；可能屏蔽服务
        - 未公开确认 BeReal 的 UK OSA 合规认定或 Ofcom 提交材料
        - 英国合规状态未验证；多司法辖区监管覆盖存在缺口
        - 要求提供 UK OSA 认定状态和 Ofcom 往来
    notes: 可能性和严重性是基于公开监管文件、Fitch 分析和截至 2026 年中执法趋势数据的定性判断。Voodoo 针对这些事项的正式内部合规状态均未公开披露。CNIL 罚款是唯一已确认的负面监管行动。
    enumerationScope:
      coverage: partial
      basis: >-
        Covers all publicly confirmed enforcement actions and active regulatory obligations affecting Voodoo and BeReal
        as of mid-2026; private compliance programs, undisclosed investigations, and future rulemaking are not
        accessible from public sources.
