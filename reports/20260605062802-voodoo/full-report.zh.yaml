  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图分类与层级结构
        blocks:
          - type: paragraph
            body: >-
              Voodoo
              的竞争敞口分成两个结构上不同的战场，需要分别使用分析框架。第一是混合休闲移动游戏发行，竞争由用户获取效率、数据驱动游戏测试基础设施、合作工作室管线和特许产品深度定义。第二是消费者社交应用，BeReal
              在更广泛社交网络板块中，与规模和网络效应都远超 Voodoo 资源的既有巨头竞争。


              在移动游戏发行内，相关竞争层级很窄，也有第三方 IAP 跟踪数据充分记录。截至 2026 年中，Next Big Games 和 AppMagic 识别出五到七家持续占据混合休闲 IAP
              收入前列的发行商：Rollic（Zynga 旗下，Zynga 是 Take-Two Interactive 子公司）、Homa（总部巴黎，独立融资）、Tripledot Studios（总部伦敦，2025 年 5
              月收购 AppLovin 游戏业务后扩大）、Supersonic Studios（历史上归 Unity 所有，目前正在剥离）、Voodoo，以及新兴挑战者 Loom Games 和 iKame Global /
              Zego Studio。French Triad——Homa、Voodoo 和 Madbox——自 2022 年以来约占混合休闲收入（IAP 加广告）的 43%，Rollic 再贡献 26%，留给更广泛市场约
              31%。随着第二梯队发行商放大规模，这一集中度正在收窄。


              本章使用的竞争分类覆盖四层：（1）直接混合休闲同行——收入规模相近、目标类型和 UA 受众重叠的发行商；（2）相邻既有发行商——Supercell、King/Activision Blizzard
              等更大组合运营商，其中度和休闲产品争夺同一消费者注意力；（3）平台和基础设施玩家——AppLovin（只做广告技术，Tripledot 交易后不再是游戏发行商）和 Unity（游戏引擎与
              SDK），它们的平台政策和费率结构决定所有发行商的 UA 与变现经济性；（4）消费者社交相邻市场——Instagram、TikTok 和 Snapchat，它们是 BeReal 的主要竞争威胁。


              Voodoo 游戏组合的现状替代方案，是自然发现和点对点口碑；鉴于超休闲游戏机制商品化，这一路径结构上较弱。对
              BeReal，现状替代方案是用户继续在多个既有社交平台多栖，这是主导竞争风险。内部自建（独立开发者不借助大型发行商自行发行）仍是 Voodoo 合作平台的间接替代方案，但受制于以有竞争力 CPI 放大 UA
              的资本强度。
