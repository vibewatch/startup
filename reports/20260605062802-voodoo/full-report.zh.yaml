      - number: '2.2'
        title: 市场规模测算——TAM、SAM 与证据约束
        blocks:
          - type: paragraph
            body: >
              测算 Voodoo 的市场敞口，需要穿过分析师方法论之间的大量矛盾。2025 年全球移动游戏 TAM 有 $126 billion 到 $165 billion 多种口径，取决于估算是否只包含 IAP
              收入、总消费者支出，还是含广告收入在内的总平台流水。Precedence Research 将 2025 年市场测算为 $143.96 billion，预计 2026 年增长至 $158.5 billion，并在
              2035 年前保持 9.95% CAGR。GMI Insights 和 ResearchAndMarkets 引用的 2025 年数字更高，最高约 $165 billion。Statista 和
              manataz-based 估算则把 2025 年消费者总支出放在约 $126–132 billion。区间差异来自基准年处理、地理范围（中国监管环境和市场隔离带来实质模糊性），以及是否把广告收入与 IAP
              一并纳入的口径不一致。


              Voodoo 自己对 SAM 的描述更细，也因此更可用于投资判断。CEO 称休闲游戏市场约 $40 billion，与 AppMagic 和 Ripple Reports 对休闲 IAP 总额 $35–38
              billion 的估计相符。这个约占全球移动游戏 TAM 25–28% 的部分，就是 Voodoo 游戏收入所在。混合休闲是该 SAM 内增长最快的一层：Ripple Reports 估计 2025 年混合休闲
              IAP 为 $9.8 billion，估计 CAGR 为 28%，2026 年达到 $12.5 billion。


              Voodoo 的发行商级 SOM 无法正式计算，因为公司没有披露按类型拆分的收入，也没有第三方来源提供包含 IAP 与广告收入的完整混合休闲总收入。可以支撑的判断是，Voodoo 披露 2025 年游戏收入
              $653 million（占 $778 million 总收入的 90%），按消费者支出计，约占 $35–40 billion 休闲游戏市场的
              1.6–1.9%。这对碎片化市场中的私营公司而言是有意义的份额，但也显示出它与 Tencent、Scopely、Activision Blizzard King 的规模差距。


              对 BeReal，没有第三方分析师发布过真实感优先照片分享的独立 TAM。最近似的代理是 2025–2026 年 $98–126 billion 的社交网络应用市场，但 BeReal
              可变现池子结构性更小：广告库存仍处早期，尽管声称 MAU 最高可达 40 million，Business of Apps 估计日活跃用户只有 2.93 million，平台也直到 2025
              年才开始产生收入。BeReal 2025 年 €30 million 收入相对于更广泛社交网络市场，说明它仍是相邻小众板块内的早期变现，而非对完整社交媒体 TAM 的可证明占有权。
