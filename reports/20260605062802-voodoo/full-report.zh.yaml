      - number: '3.5'
        title: 护城河耐久性、切换成本与竞争风险登记
        blocks:
          - type: paragraph
            body: >-
              Voodoo 两条业务线的竞争耐久度差异很大。混合休闲发行里，几项护城河相当可守。数据飞轮——来自 8+ billion 次下载的行为信号沉淀——不是新进入者短期能复制的；要堆出同等信号深度，需要多年持续发行量。
              150+ 家伙伴工作室管线带来会自我强化的项目流：已有验证原型的工作室，会选择能给出最好 UA 资金和测试效率的发行商， 进而巩固 Voodoo 的供给优势。Mob Control 和 Block Jam 3D
              的系列深度经过多年 LiveOps 验证，相比从零推出新 IP， 内容延展的边际成本更低。


              Voodoo 混合休闲护城河的主要威胁有四项：（1）品类商品化——摧毁超休闲价值的同一套趋同机制，开始出现在混合休闲解谜里； 2025–2026 年，15+ 家发行商密集推出
              screw-sort、block-sort、color-sort 克隆产品，解谜游戏贡献混合休闲收入的 60%+，街机占 32%；（2）Rollic 激进的 LiveOps 变现强度和 RPD 抬升（Screw
              Jam 的 RPD 为 $3），已经缩小变现深度差距； （3）Tripledot 并购后的规模，下载量已接近 Voodoo，且 AppLovin 是与其商业上深度交织的少数股东；（4）Supersonic 出售，
              最终买方不同，竞争压力可能重新集中。


              Voodoo 游戏消费者的切换成本基本为零：休闲游戏免费安装，不需要账号或数据迁移，同品类产品几分钟内就能替代。锁定效应只存在于系列层面—— 已投入 Block Jam 3D
              进度机制的玩家可能不愿切换——但这远弱于中核或硬核游戏的深进度锁定。对伙伴工作室而言，切换成本中等： 重新谈发行条款、重建测试 API 集成、放弃 Voodoo 的 UA
              资金承诺，都会形成实际摩擦，但不是结构性壁垒。工作室生态里，多家发行商并行合作很常见。


              BeReal 的切换成本在结构上偏低。相比 Facebook、Instagram 或 Snapchat，其社交图谱很浅——用户粉丝少，内容转瞬即逝， 也没有 WhatsApp 或 iMessage
              那种规模的私信锁定。用户明显会同时使用 BeReal 和 Instagram，这限制了 BeReal 捕获排他性日常社交互动、 形成持久留存的能力。Voodoo 为 BeReal
              建护城河最可信的路径，是加深消息功能、扩展公开信息流、增强社交图谱黏性——这些都需要大量产品开发周期， 还要对抗资源远强得多的既有巨头，推动用户行为改变。
            claimRefs:
              - CP004
              - CP023
