      - number: '4.2'
        title: GTM 效率、发行经济性与单位经济缺口
        blocks:
          - type: paragraph
            body: >-
              这套运营模式本质上是一台规模化消费者获客机器。Voodoo 用获客、变现、交叉推广和发行基础设施识别并放大游戏，外部工作室以及被收购 / 内部团队提供产品产能。
              公开来源给出了有用的方向性代理指标：PocketGamer 报道，10 款混合休闲游戏每年产生 $20 million 到 $100 million 收入；Voodoo 披露 2025 年游戏收入为 $653
              million。承销问题在于，所审阅来源没有披露 CAC、回本周期、ARPDAU、广告 eCPM、平台费、毛利率、伙伴工作室收入分成，
              或逐款游戏贡献毛利。因此，财务尽调必须从公开收入证明转向私有队列文件：按渠道拆分投放、CPI、ROAS 曲线、按地区留存、IAP 与广告拆分、商店费用、 以及工作室分成条款。
