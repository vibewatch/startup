      - number: '3.4'
        title: BeReal 与消费者社交应用相邻竞争
        blocks:
          - type: paragraph
            body: >-
              BeReal 所处环境远比 Voodoo 游戏组合更不对称。它的核心机制——同一时间用前后双摄拍摄无滤镜每日照片的通知提示——直接争夺 Gen Z 社交时间，而对手平台规模比 BeReal 高出两个数量级。


              Instagram 在 2026 年约有 2.4 到 3 billion 月活跃用户。TikTok 约有 1.9 到 2 billion MAU。Snapchat 约有 850 到 932 million
              MAU。BeReal 的 MAU 存在争议：Voodoo CEO Yazdi 在 2025 年 5 月称，用户基数已稳定在约 30 million（2022 年峰值为 73.5
              million），其他公司引用来源则称 40 million；外部分析提供商 Business of Apps 将 2024 年 MAU 放在 16 million，形成 2x 到 2.5x
              差异，公开来源中尚未解决。Voodoo 持有 BeReal 后，BeReal 2025 年产生 €30 million 广告收入，并从收购时每月 $3 million
              现金消耗达到盈亏平衡——这是有意义的运营扭转，但占 Voodoo 2025 年总收入不到 4%。BeReal 累计下载量达到 115 million，其中约 73.5 million 集中在 2022
              年病毒式传播期，说明自然新增用户增长在结构上已经停滞。


              Instagram 和 TikTok 都推出过直接复制 BeReal 核心机制的功能——Instagram Candid Stories 和 TikTok Now（整合进 TikTok 主
              feed）。拥有远大得多的分发、算法驱动发现和根深蒂固社交图谱的平台，可以轻易复制功能，这是 BeReal 定位面临的最重要结构性威胁。BeReal
              的反驳是，它没有算法、没有滤镜、没有粉丝数的设计哲学，创造了不同的真实社交规范，无法被以注意力最大化为目标的平台复制；这一说法在 18–24 岁 Gen Z 人群中有文化可信度。约 72% 的 BeReal
              活跃用户会在每日通知后 3 分钟内打开应用，这种日参与强度超过 Snapchat 在核心 Gen Z 队列上的可比留存指标。


              按人口匹配和社交图谱模型看，Snapchat 是最可比的竞争者：内容短暂、点对点，算法化程度低于 Instagram 或 TikTok。Snapchat 的 850–932 million MAU
              基数，以及在美国 Gen Z（13–34 岁）中超过 75% 的渗透率，对 BeReal 目标受众构成强替代风险。到 2025 年，Instagram 的 Gen Z 使用量同比下降约
              9%，反映需求正结构性转向更少策展的平台——但 BeReal 争夺这部分重新分配的注意力时，同时还要面对 Snapchat、Threads、Lemon8 和其他真实感相邻新进入者。BeReal
              规模下尚未证明存在类似 Snapchat streak 机制或 WhatsApp 通讯录导入护城河的社交图谱锁定。
