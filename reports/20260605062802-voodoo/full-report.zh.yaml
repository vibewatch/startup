      - number: '8.3'
        title: 估值视角与公开可比公司
        blocks:
          - type: paragraph
            body: >-
              多个估值视角指向的是一个宽泛、非精确的公允价值区间，而不是单一数字。收入法以 GBL 的 €689 million 销售额为基数，套用 3.0x–4.0x 发行商倍数，债务调整前企业价值约为 €2.1
              billion–€2.8 billion；这与 GBL 穿透估值和 Clay 的 $2.6 billion 估算大体一致，但前提是收入质量和 2025 年利润率桥接站得住。EBITDA 法以 2024 年
              €135 million EBITDA 为基数，套用 12x–16x 盈利型发行商倍数，EV 约为 €1.6 billion–€2.2 billion，低于收入法，因为 Voodoo 的 EBITDA 率远低于
              AppLovin，商业模式也不如 Roblox 那样平台化。公开可比公司进一步拉开分歧：AppLovin 是高利润率广告技术异类，Roblox 享受平台溢价，Unity 更像软件 / 工具链可比，EA /
              Take-Two 则是更成熟的发行商参照。除非 BeReal 证明可持续变现，并且游戏组合的混合休闲复购 / 留存属性得到审计，Voodoo 不应拿到最高平台倍数。
