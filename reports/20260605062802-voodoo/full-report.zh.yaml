figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: Voodoo 的公开记录从 2013 年巴黎超休闲创业公司开始，到 2025 年已成为多元化移动娱乐公司，完成大型社交 app 收购并保持盈利；其间 2021–2022 年的平台开户政策危机几乎动摇公司根基。
    data:
      items:
        - date: '2013'
          label: 在巴黎创立
          detail: Yazdi 和 Ritter 创办 Voodoo，切入消费者移动产品。
          tone: positive
        - date: '2016'
          label: Paper.io 爆红
          detail: 首个重大产品成功验证快速原型模式。
          tone: positive
        - date: 2018-05
          label: Goldman Sachs 投资 $200M
          detail: 2015 年以来法国科技最大融资；创始人保留控制权。
          tone: positive
        - date: 2020-08
          label: Tencent 少数股权
          detail: 未披露金额，对应 $1.4B 估值；打开 APAC 分发。
          tone: positive
        - date: 2021-07
          label: GBL 以 EUR 1.7B 估值投 EUR 266M
          detail: 第三家主要投资者；最后一个已确认的公开股权估值标记。
          tone: positive
        - date: 2021–2022
          label: Apple ATT 危机；收入腰斩
          detail: 超休闲模式崩塌；杠杆飙至 70x；大规模重组。
          tone: warning
        - date: '2023'
          label: 混合休闲转型见效
          detail: Mob Control 和新游戏恢复增长；收入达到 EUR 520M+。
          tone: positive
        - date: 2024-06
          label: 以 EUR 500M 收购 BeReal
          detail: 社交 app，用户 40M；收购时亏损；数月内拉至盈亏平衡。
          tone: neutral
        - date: 2024-12
          label: 收入 EUR 623M；EBITDA EUR 135M
          detail: 年度业绩创新高；增长 20%；下载量 950M。
          tone: positive
        - date: 2025-04
          label: EUR 220M 债务再融资
          detail: TLB 偿还；新结构把到期延至 2029–2030；Fitch 撤销评级。
          tone: positive
        - date: 2025-12
          label: 收入 $778M；MAU 169M
          detail: 持续增长 16%；BeReal 创造 EUR 30M 收入。
          tone: positive
    approximationNotes: null
    claimRefs:
      - CO001
      - CO010
      - CO012
      - CO013
      - CO016
      - CO018
      - CO020
      - CO026
      - CO032
      - CO037
