      - number: '1.4'
        title: 规模、关键指标与财务表现
        blocks:
          - type: paragraph
            body: >
              Voodoo 的公开财务画像显示出真实的规模化轨迹，但仍有重要缺口，无法从公开来源补齐。公司披露 2024 年收入 €623 million，同比增长 20%，EBITDA 为 €135 million（较
              2023 年改善 34%）。2025 年公司披露收入 $778 million，进一步增长 16%。这些数字来自 Voodoo 自身发布的新闻稿，并由 Sifted 和行业媒体佐证。公司自 2017 年以来
              EBITDA 为正。


              用户规模上，Voodoo 的游戏和应用自创立以来累计下载量超过 8 billion，仅 2025 年就有 1.5 billion 次下载。公司 2024 年月活跃用户为 150 million，2025 年为
              169 million。2024 年，公司产生 950 million 次应用下载。这些均为公司披露数字，应视为方向性数据，而非经审计数据。Voodoo 称自己按下载量是全球第五大移动发行商，排在
              Google、Meta、Tencent 和 ByteDance 之后。


              截至 2024 年年度业绩公告，员工数约 800 人，覆盖 14 个国家。Fitch 2025 年 6 月报告估计，按 Fitch 定义的 2024 年 EBITDA 约为 €63 million，FCF 为
              €14 million，显著低于公司自报的 €135 million EBITDA，原因是开发成本处理口径不同。两组数据都指向一个盈利业务。确切当前估值、BeReal
              收购后的精确股权结构，以及按具体游戏或产品线拆分的收入仍有缺口。
