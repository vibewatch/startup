        - 头部工作室把最佳原型转向条款更好的竞争发行商
        - 中 — 发行管线放慢；命中率下降
        - SDK、测试、分析和辅导激励工作室留在生态内；收入分成未披露
        - 工作室经济性和流失未公开披露；收入分成条款是重大尽调缺口
