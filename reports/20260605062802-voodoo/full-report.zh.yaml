      - number: '7.7'
        title: 监控触发点与打破投资论点的事件
        blocks:
          - type: paragraph
            body: >-
              本章审视的任何单一风险即便兑现，也未必足以摧毁投资论点；但若若干风险叠加，风险回报结构会被根本改写。最关键的单一事件，是 BeReal 在稳定后重新出现 MAU 下滑，因为这会同时削弱 €500 million
              收购逻辑、放大广告收入波动，并在 BeReal EBITDA 拖累扩大时，可能触发类 Fitch 口径下调。第二高严重度事件，是重大监管执法——新的 CNIL 调查、FTC COPPA 同意令，或 DSA
              罚款——这会把罚金和整改成本压到整个合作工作室网络上。

              平台政策冲击（Apple App Store 激励视频政策重大调整、ATT 扩展至所有应用类别，或 Google Play 开发者费用上调）会在一到两个季度内压缩整个组合的 EBITDA
              率。财务杠杆恶化——例如意外收购或大额和解后杠杆重新升至 5x 以上——会让新债契约承压，尤其在公司 EBITDA 规模仍小的情况下。

              Yazdi 离任或实质减少运营参与，是最高级别的执行风险，因为公开资料没有继任者，而创始人又是转型战略的中心。最后，如果 BeReal 用户数据或 Voodoo
              广告网络数据发生泄露或网络安全事件，公司会在正试图为社交应用业务建立广告主信任时，同时面临监管调查和声誉损害。

              各情景的监控指标详见否决标准表。尽调问题包括：（a）收购后 BeReal 月度用户群组仪表盘，（b）董事会构成和治理文件，（c）COPPA 与 DSA
              合规项目细节，（d）前五大游戏单款经济模型，（e）当前债务期限表和契约条款，（f）Yazdi 时间分配承诺。
