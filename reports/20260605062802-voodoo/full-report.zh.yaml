  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律、隐私与数据监管风险
        blocks:
          - type: paragraph
            body: >-
              Voodoo 公开记录中有一项已确认监管负面事件：CNIL 于 2022 年 12 月 29 日罚款 €3 million，原因是在用户通过 Apple ATT 提示拒绝跟踪后， Voodoo 仍使用
              IDFV（Identifier for Vendors）跨其手机游戏追踪用户用于广告目的。监管要求公司在三个月内修复同意机制，否则每天额外罚款 €20,000。 到 2023 年 7 月 13 日，CNIL 认定
              Voodoo 已部署合规同意窗口，因此关闭禁令——但明确保留随时重新检查合规的权利。这在发行商层面制造了潜在复查风险， 覆盖所有 Voodoo 标记标题，以及共享同一 SDK
              同意流程的任何伙伴工作室应用。这笔罚款证明公司有过不合规数据收集的书面历史，不能当作干净记录处理。

              展望未来，2026 年监管敞口明显扩大。FTC 修订后的 COPPA 规则于 2026 年 4 月 22 日完全生效，要求针对儿童数据的定向广告和任何第三方数据共享分别取得家长主动同意。 Voodoo
              的超休闲和混合休闲手机游戏组合包含许多视觉风格和机制会吸引 13 岁以下玩家的标题。Bloomberg Law 报道，第三方供应商关系是重点执法领域， 因为收集数据的公司及其分析 / 广告 SDK
              伙伴都会承担责任。Voodoo 的集中式广告运营把数十家第三方 SDK 供应商接入 150+ 家伙伴工作室， 形成了很大的合规边界。按修订规则，FTC 罚款可达每项违规每天 $51,744。

              在欧盟，《数字服务法》（DSA）透明度报告制度于 2025 年 7 月全面可执行。托管用户生成内容或用户间互动的平台——包括 BeReal，以及任何带聊天、社交或社区功能的 Voodoo 游戏—— 必须每年发布
              DSA 透明度报告，维护通知—行动机制，并根据 DSA Article 28 落实儿童安全措施。Tremau 报道，仅 2025 年欧盟平台就遭遇 100+ 起执法行动；2026 年 1 月，荷兰 ACM 对
              Roblox 展开未成年人安全风险调查——这表明游戏平台不再豁免于 DSA 执法。 所审阅来源没有确认 Voodoo 或 BeReal 已提交 DSA 透明度报告或任命欧盟法律代表，而这些都是基线合规义务。DSA
              不合规罚款上限为全球年营业额的 6%。
