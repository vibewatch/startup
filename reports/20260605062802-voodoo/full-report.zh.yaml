            title: BeReal 架构不透明，是产品技术尽调的首要缺口
            body: BeReal 的产品设计公开，但技术基础设施——云厂商、内容审核管线、ML / 推荐栈、收购后工程组织——完全不透明。一笔 €500M 收购配上未披露架构， 带来实质整合和连续性风险，需要拿到内部系统文档。
            calloutType: risk
