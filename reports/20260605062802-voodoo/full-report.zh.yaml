  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与相邻市场
        blocks:
          - type: paragraph
            body: >
              理解 Voodoo 的市场敞口，最好拆成三个不同但相互作用的板块；每个板块都有不同的变现机制、买方关系和竞争动态。


              首要市场是休闲移动游戏——Voodoo CEO Alexandre Yazdi 在公司 2025 年年度业绩中明确称其为“约 $40 billion 的全球市场，更深、更有韧性”。这个 $40 billion
              数字指的是休闲类型的 IAP 收入，包括益智、街机、模拟、超休闲和混合休闲，不包括中度和重度游戏、PC 与主机类别，以及订阅制游戏包。在这一首要市场内，混合休闲子板块——把超休闲的易上手性与更深留存机制、IAP
              加广告的混合变现结合起来——是增长最快的一层。Ripple Reports 和 AppMagic 估计，2025 年混合休闲 IAP 约为 $9.8 billion，并预测 2026 年达到 $12.5
              billion。传统纯超休闲子板块是 Voodoo 的原始地盘，截至 2025 年每年 IAP 收入只有 $600–700 million。尽管下载量巨大——仅 2025 年上半年，前 100
              款超休闲游戏就实现约 2.4 billion 次下载——但该板块的变现结构高度商品化：收入几乎完全依赖广告，且在移动游戏消费者总支出中的占比正在下降。


              第二个市场是移动应用内广告。由于超休闲游戏和许多混合休闲游戏仍主要或部分靠广告变现，Voodoo 的收入取决于更广泛移动应用内广告生态中的需求侧支出。The Business Research Company
              估计该市场 2025 年规模为 $173.35 billion，2026 年预测为 $208.76 billion，至 2030 年 CAGR 为 20.4%。Voodoo
              以发行商身份参与，把游戏组合内的广告库存供给需求侧平台上的效果广告主，而不是作为广告技术公司参与；它能拿到的份额取决于用户库存质量和参与深度，而非技术 IP。


              第三个市场是消费者社交应用，Voodoo 通过 2024 年 6 月以 €500 million 收购 BeReal 进入。BeReal 竞争于社交网络应用板块，The Business Research
              Company 估计该板块 2025 年规模为 $98.37 billion，2026 年预测为 $126.3 billion。BeReal 真正可变现的池子只是其中很窄一片：面向 Gen Z
              用户、以真实感优先的照片分享，而这一人群已被记录为排斥传统广告格式。BeReal 在收购后引入应用内广告，2025 年收入 €30
              million，说明它获得了早期变现立足点，但还不能据此声称可以覆盖更广泛的社交媒体 TAM。


              Voodoo 的相关市场不包括中度和重度主机及 PC 游戏、游戏订阅服务（Apple Arcade、Xbox Game Pass）、PC 浏览器广告生态，以及需要前置购买的 live-service
              游戏。Voodoo 不在这些板块运营，也没有释放进入意图。
