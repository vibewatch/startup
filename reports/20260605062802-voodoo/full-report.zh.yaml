        - 高 — 缺少独立监督会放大未披露关联交易、财务错报和战略误判风险
        - 投资者财团（Goldman、Tencent、GBL）作为少数股东可能持有董事席位；尚未确认
        - 索取董事会构成、董事独立性评估、审计委员会章程，以及所有关联方交易披露
    notes: 可能性和严重性仅反映公开证据记录；未审阅 Voodoo 内部 HR 或治理文件。CEO 外部投资为事实（Maddyness 2026 年 5 月已确认）。董事会构成是已记录的缺口——没有公开来源点名任何董事。
    claimRefs:
      - CR030
      - CR031
      - CR032
      - CR040
  - id: TR005
    title: 缓释措施与否决标准
    columns:
      - 风险
      - 可监测触发因素
      - 阈值 / 事件
      - 行动含义
    rows:
      - - BeReal MAU 稳定后重新下滑
        - 月活用户和日活用户 — 可通过 Sensor Tower、Business of Apps 或公司披露跟踪
        - MAU 连续两个月低于 25M，或 DAU 低于 1.5M
        - 削弱 €500M 收购逻辑；下调 BeReal EBITDA 贡献；尽调要求管理层提供每周同期群看板
      - - BeReal 收入未达到 Fitch 盈亏平衡假设
        - 季度或半年度收入披露，对照 Fitch 2025 年盈亏平衡基准情景
        - BeReal 收入在 2025 H2 仍低于 $2M / 月，或转为负值
        - 杠杆升至 Fitch 负面敏感性阈值以上（>4x）；若 Fitch 恢复覆盖，可能触发评级动作；下调投资逻辑
      - - 监管执法行动（CNIL 重新调查、FTC COPPA 同意令、DSA 罚款）
        - CNIL 新闻稿、FTC 执法数据库、EU DSA 执法登记
        - 任何针对 Voodoo 或 BeReal、带有罚款或强制运营调整的新执法行动
        - 罚款和整改成本压缩 EBITDA；运营调整可能减少广告收入；重新评估合规计划；提高尽调紧迫性
      - - 影响激励视频或 SDK 数据收集的 App Store / Play Store 政策冲击
        - Apple 和 Google 开发者新闻页、App Store Review Guidelines 更新日志
        - 任何实质限制激励插屏广告、SDK 数据收集或 IAP 费率结构的政策更新
        - 一到两个季度内，组合 EBITDA 利润率被压缩；重新测算收入结构假设
      - - 杠杆升至 5x 以上或违反契约
        - Fitch 类口径 EBITDA 杠杆（债务 / EBITDA）；管理层按季度报告
        - 杠杆连续两个报告期超过 5x；出现任何契约豁免请求或信贷协议修订
        - 再融资风险重现；资本成本上升；并购能力受限；必须审查流动性
      - - CEO Yazdi 离任或无法履职
        - 公开公告、领导层变动、LinkedIn、公司新闻稿
        - 宣布 CEO 更替、长期休假，或联合创始人 Laurent Ritter 离开
        - 高严重性执行风险；立即审查接班计划；重新评估对转型逻辑的信心
      - - 涉及 BeReal 用户数据或 Voodoo 广告网络凭证的数据泄露
        - 监管申报（CNIL 72 小时通知）、媒体报道、HaveIBeenPwned、安全研究人员
        - 任何公开确认的 PII、照片数据或广告主凭证泄露
        - GDPR 通知触发 CNIL 调查；广告主信任受损；可能出现集体诉讼；整改成本显著
    notes: 阈值是基于 Fitch 分析、BeReal 用户轨迹数据和标准杠杆契约惯例推导出的研究估计。Voodoo 内部契约阈值和 MAU 管理目标未公开披露。私下尽调时，应将这些触发因素对照实际债务契约和管理层 KPI 验证。
