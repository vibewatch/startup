      - 下行或上行触发因素
    rows:
      - - 牛市
        - 证据升级
        - 2025 年销售额接近或高于 EUR689M，EBITDA 利润率扩大，BeReal 实现盈利增长
        - 4.0x-5.0x 收入或 16x-20x EBITDA 可支撑溢价
        - 触发因素是经审计增长叠加 BeReal 贡献利润率
      - - 基准
        - 公开记录信号混合
        - 收入规模和盈利能力延续，但 BeReal 仍只是稳定，杠杆仍有影响
        - 3.0x-4.0x 收入或 12x-16x EBITDA 支撑 EUR2B 低到中段 EV
        - 触发因素是干净账目和低于 4x 的杠杆
      - - 熊市
        - 执行或监管路径转差
        - BeReal 停滞、隐私执法恶化，或组合集中度回升
        - 1.5x-2.5x 收入或 8x-10x EBITDA 将价值压到近期标记以下
        - 触发因素是用户流失或契约压力
      - - 不交易
        - 证据缺口持续
        - 卖方要求平台型倍数，但不给私下证据
        - 无法为价格背书
        - 触发因素是拒绝提供股权结构和债务包
