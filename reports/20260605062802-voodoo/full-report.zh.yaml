      - number: '1.5'
        title: 里程碑与战略演进
        blocks:
          - type: paragraph
            body: >
              本报告最稳固的事实，是 Voodoo 的里程碑时间线：从 2013 年一个失败的法国问答应用，走到 2024 年以 €500 million
              收购社交媒体资产的多元化移动娱乐公司。公司的战略叙事可分为五个阶段：早期挣扎（2013–2016）；由 Paper.io 和 Helix Jump 推动的超休闲爆发（2016–2020）；Apple ATT
              隐私变化后的危机（2021–2022）；以 Mob Control、Collect Em All 和 Block Jam 为锚的混合休闲反弹（2022–2023）；以及通过收购 BeReal 和推出 Jamble
              直播购物平台切入社交应用的多元化推进（2024 年至今）。


              两笔收购尤其像里程碑事件。2021 年 9 月，Voodoo 以约 €300 million 收购以移动桌游闻名的以色列工作室 Beach Bum，释放出公司不再只做纯超休闲的意图。2024 年 6 月以
              €500 million 收购 BeReal，则是更大赌注：BeReal 当时拥有超过 40 million 活跃用户，但每月亏损 €2.6 million，且尚未开始变现。Voodoo
              通过削减成本和轻量广告，在数月内让 BeReal 达到盈亏平衡；BeReal 2025 年收入 €30 million，用户基数趋于稳定。


              2025 年 4 月完成的债务再融资也是重要里程碑：它赎回了 €220 million TLB，并建立起到期日在 2029–2030 年的新结构，消除了 Fitch 在 2023 年提示的关键近期融资风险。根据
              Voodoo 新闻稿，再融资得到“领先银行和机构联盟”支持，释放出机构对公司扭亏后现金生成能力的信心。
