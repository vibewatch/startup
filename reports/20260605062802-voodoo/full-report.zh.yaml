      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >
              Voodoo 由 Alexandre Yazdi 和 Laurent Ritter 共同创办。两人都是法国创业者，此前在 2012 年创办过 Web 和移动服务公司 Studio Cadet。Yazdi 担任
              CEO，也是公司最大的个人股东。Ritter 与 Yazdi 共同创办公司；截至 2021 年所有主要投资轮结束后，创始人仍保持多数控制权，每位投资者仅取得少数股权。


              Yazdi 的领导风格和战略方向，是理解 Voodoo 身份的核心。他亲自撰写了发布在 voodoo.io 上的公司 10 年回顾，详细讲述公司如何从初期失败走向超休闲主导地位，如何经历 Apple
              隐私政策变化带来的 2021–2022 年危机，以及之后如何反弹。他的公开沟通清楚表明，他把公司的数据驱动、快速原型文化视为长期竞争优势。


              除联合创始人外，Voodoo 领导团队还包括主要产品线负责人。Aymeric Roffé 曾任 Voodoo 旗下 Wizz 社交应用 CEO，在 2024 年 6 月收购后出任 BeReal
              CEO；BeReal 联合创始人 Alexis Barreyat 在过渡期后离开。公开来源没有披露 Voodoo 本身正式董事会构成或独立董事姓名；最可见的治理层是投资者联盟（Goldman
              Sachs、Tencent、GBL），各自持有少数股权，创始人掌握控制权。鉴于 Yazdi 在运营中的中心地位，且公司未披露继任或联席 CEO 架构，对 Yazdi 的关键人物依赖是重要尽调项。
