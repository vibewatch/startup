      - number: '8.2'
        title: 融资、估值与资产负债表背景
        blocks:
          - type: paragraph
            body: >-
              可观察融资记录提供了三个可用估值锚点，但没有完整股权结构表。第一，GBL 2021 年投资 €266 million，取得 16% 少数股权，隐含投后股权价值约 €1.66
              billion，尚未计入后续稀释、债务或期权影响。第二，GBL 报告截至 2026 年 3 月 31 日持股 14.8%，组合价值 €316 million，机械推算股权穿透价值约 €2.14
              billion；但这是股东 NAV 标记，不是交易价格。第三，Clay 报告已披露融资超过 $570 million，并给出约 $2.6 billion 的当前估值；PremierAlts
              只露出带门槛的二级市场页面，因此只能作为弱佐证。Fitch 的信用视角同样重要：Voodoo 用现金和新贷款偿还 €220 million TLB，将到期日延至 2029–2030 年，撤回前仍为 B
              级，并受限于规模偏小、机会型 M&A、竞争和平台集中度。这让企业价值测算对债务高度敏感，也让优先条款、现金余额和再融资文件成为必做尽调输入。
            claimRefs:
