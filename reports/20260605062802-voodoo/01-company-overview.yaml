company:
  name: Voodoo
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Voodoo is a Paris-based mobile game and app publisher founded in 2013 by Alexandre Yazdi and Laurent Ritter. The
    company pioneered the hyper-casual mobile gaming genre, accumulated over 8 billion lifetime downloads, and has since
    executed a strategic pivot toward hybrid-casual games and social apps, capped by the €500 million acquisition of
    BeReal in June 2024. Backed by Goldman Sachs, Tencent, and GBL, and rated 'B' by Fitch, Voodoo generated €623
    million in revenue in 2024 and $778 million in 2025, with 800+ employees across 14 countries and 169 million
    monthly active users.
sections:
  - id: section-1
    title: Identity, headquarters, and operating model
    body: >
      Voodoo is a French technology company that develops and publishes mobile games and consumer apps, headquartered in
      Paris, France. Founded in 2013 by Alexandre Yazdi and Laurent Ritter, the company describes its mission as
      entertaining the world through iconic apps and games. It operates as a private company under the legal entity Stan
      Holding SAS, which was used to structure the company's external debt financing.


      Voodoo's operating model has evolved considerably since founding. In its early years the company focused on
      rapid-prototyping hyper-casual games—simple, free-to-play mobile titles monetized through in-game advertising. At
      the peak of this model, between 2017 and 2020, Voodoo worked with over 2,000 partner studios worldwide and
      generated revenues in the hundreds of millions of dollars. From 2021 onward, the business underwent a deliberate
      transformation driven by Apple's App Tracking Transparency policy changes, which caused hyper-casual ad revenues
      to fall sharply. Voodoo shifted investment toward hybrid-casual games—more complex titles with longer lifecycles
      monetized through a mix of advertising and in-app purchases—and also entered the consumer social app category,
      culminating in the €500 million acquisition of BeReal in June 2024.


      As of the 2026 diligence date, Voodoo operates a diversified portfolio that includes franchise mobile games (Mob
      Control, Paper.io, Block Jam), a partner publishing platform supporting over 150 independent studios, the BeReal
      social photo app, and additional consumer products such as Wizz, Blitz, and Jamble. The company generated $670
      million in revenue in 2024 (€623 million), maintains 169 million monthly active users, and employs approximately
      800 people across 14 countries. Hyper-casual titles now represent only 22% of revenue, down from 100% in 2021.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO033
      - CO034
      - CO035
      - CO040
    figureRefs:
      - FO002

  - id: section-2
    title: Founders, leadership, and governance
    body: >
      Voodoo was co-founded by Alexandre Yazdi and Laurent Ritter, both French entrepreneurs who had previously founded
      Studio Cadet, a web and mobile services company, in 2012. Yazdi serves as CEO and is the company's largest
      individual shareholder. Ritter co-founded the company alongside Yazdi; the founders retained majority control
      after all major investment rounds through 2021, with each investor acquiring only minority stakes.


      Yazdi's leadership style and strategic direction are central to understanding the company's identity. He directly
      authored the company's 10-year retrospective published on voodoo.io, detailing the shift from initial failure to
      hyper-casual dominance, the 2021–2022 crisis caused by Apple's privacy policy changes, and the subsequent
      rebound. His public communications make clear that he views the company's data-driven rapid-prototyping culture as
      its durable competitive advantage.


      Beyond the co-founders, Voodoo's leadership team includes the heads of its major product lines. Aymeric Roffé,
      who was CEO of Voodoo's Wizz social app, became CEO of BeReal following the June 2024 acquisition, while BeReal
      co-founder Alexis Barreyat departed after a transition period. Public sources do not disclose a formal board of
      directors composition or independent director names for Voodoo itself; the most visible governance layer is the
      investor consortium (Goldman Sachs, Tencent, GBL), each holding minority stakes with founders in control.
      Key-person dependence on Yazdi is a material diligence item given his operational centrality and the absence of
      a disclosed succession or co-CEO structure.
    claimRefs:
      - CO003
      - CO006
      - CO007
      - CO008
      - CO009
    tableRefs:
      - TO002

  - id: section-3
    title: Funding history, investors, and debt structure
    body: >
      Voodoo has raised over $800 million in disclosed equity across three major rounds, plus a leveraged debt tranche,
      making it one of the most heavily financed French technology companies outside the frontier-AI cohort. The first
      major round came in May 2018 when Goldman Sachs invested approximately $200 million through its West Street
      Capital Partners VII fund, which was the largest fundraising in the French technology sector since 2015. Yazdi and
      Ritter retained majority control following this investment.


      In August 2020, Tencent became a minority shareholder at an undisclosed investment amount; the round valued
      Voodoo at $1.4 billion. The Tencent partnership also opened Voodoo's path into APAC markets, particularly for
      Android distribution channels and Chinese gaming audiences. Voodoo's 2020 revenues were approximately €360
      million.


      In July 2021, Groupe Bruxelles Lambert (GBL), a Belgian investment holding company, invested €266 million in
      mostly newly-issued preferred shares for a 16% stake at a post-money equity valuation of €1.7 billion. GBL
      joined Goldman Sachs and Tencent as the key minority investors, with the founders retaining control.


      On the debt side, Voodoo issued a €220 million term loan B (TLB) that Fitch rated 'B' and later fully repaid in
      2025 using a combination of available cash and €179 million in new loans. The April 2025 refinancing extended
      debt maturities to 2029–2030 and improved the company's financial flexibility. Voodoo secured over €175 million
      in total refinancing from a consortium of banks and institutional partners. Total disclosed funding (equity plus
      debt) exceeds $1 billion; the exact current cap table percentages and the full terms of the BeReal acquisition
      earnout are not publicly disclosed.
    claimRefs:
      - CO010
      - CO011
      - CO012
      - CO013
      - CO014
      - CO015
      - CO016
      - CO017
    tableRefs:
      - TO003

  - id: section-4
    title: Scale, key metrics, and financial performance
    body: >
      Voodoo's public financial profile reflects a genuine scaling trajectory, though with important gaps that cannot be
      filled from publicly accessible sources. The company reported €623 million in revenue in 2024, representing 20%
      year-over-year growth, with an EBITDA of €135 million (a 34% improvement versus 2023). In 2025 the company
      reported $778 million in revenue, a further 16% increase. These figures are sourced from Voodoo's own published
      press releases and corroborated by Sifted and industry media. The company has been EBITDA-positive since 2017.


      On user scale, Voodoo's games and apps have accumulated over 8 billion total downloads since founding, with 1.5
      billion downloads in 2025 alone. The company had 150 million monthly active users in 2024 and 169 million in
      2025. In 2024 the company generated 950 million app downloads. These are all company-reported figures and should
      be treated as directional rather than audited. Voodoo describes itself as the fifth-largest mobile publisher
      worldwide by download volume, behind Google, Meta, Tencent, and ByteDance.


      Headcount reached approximately 800 employees across 14 countries as of the 2024 annual results announcement.
      Fitch's June 2025 report estimated Fitch-defined EBITDA of approximately €63 million and FCF of €14 million for
      2024, which is materially lower than the company's own EBITDA figure of €135 million, reflecting different
      treatment of development costs. Both figures point to a profitable business. Gaps exist on exact current
      valuation, precise cap table post-BeReal acquisition, and revenue by specific game or product line.
    claimRefs:
      - CO018
      - CO019
      - CO020
      - CO021
      - CO022
