  - id: section-5
    title: Milestones and strategic evolution
    body: >
      The most durable fact for this report is Voodoo's milestone chronology, which spans from a failed French quiz
      app in 2013 to a diversified mobile entertainment company with a €500 million social media acquisition in 2024.
      The company's strategic narrative can be understood in five phases: early struggle (2013–2016); hyper-casual
      explosion driven by Paper.io and Helix Jump (2016–2020); crisis following Apple's ATT privacy changes (2021–2022);
      a hybrid-casual rebound anchored by Mob Control, Collect Em All, and Block Jam (2022–2023); and a diversification
      push into social apps via the BeReal acquisition and the Jamble live-shopping platform (2024–present).


      Two acquisitions stand out as milestone events. In September 2021 Voodoo acquired Beach Bum, an Israeli studio
      known for mobile board games, for approximately €300 million—a signal of the company's intent to move beyond
      pure hyper-casual. The BeReal acquisition in June 2024 for €500 million was a much larger bet: BeReal had over 40
      million active users but was losing €2.6 million monthly and had not yet monetized. Voodoo brought BeReal to
      break-even within a few months through cost cuts and light advertising, and BeReal generated €30 million in
      revenue in 2025 with a stabilized user base.


      The debt refinancing completed in April 2025 is also a material milestone: it redeemed the €220 million TLB and
      established a new structure with maturities in 2029–2030, closing a key near-term financing risk that Fitch had
      flagged in 2023. The refinancing was supported by a "consortium of leading banks and institutions," according
      to Voodoo's press release, signaling institutional confidence in the company's cash generation post-turnaround.
    claimRefs:
      - CO026
      - CO027
      - CO028
      - CO029
      - CO030
      - CO031
      - CO032
    tableRefs:
      - TO004
    figureRefs:
      - FO001

  - id: section-6
    title: Risk factors, adverse context, and diligence flags
    body: >
      Voodoo carries several risk factors that are material to any downstream analysis. The most structurally important
      is its historical and ongoing dependence on Apple's App Store and Google Play. Apple's App Tracking Transparency
      (ATT) policy update in 2021 was effectively an existential event for Voodoo's original business model: it caused
      hyper-casual revenues to fall by half in one year and EBITDA leverage to spike to 70x by end-2022. The company
      recovered through a fundamental restructuring, but the episode confirmed that platform policy risk is systemic
      and not fully manageable by even the largest hyper-casual publishers.


      Fitch Ratings rated Voodoo's Long-Term Issuer Default Rating 'B' (speculative grade) as recently as June 2025,
      when it withdrew the rating for commercial reasons after the TLB was repaid. The 'B' rating reflected small
      scale, execution risks from the BeReal integration, fierce competition, limited platform and genre
      diversification, and an aggressive financial policy. Fitch estimated Fitch-defined EBITDA at approximately €63
      million—far below the company's own reported EBITDA of €135 million—due to different treatment of development
      costs as operating expenses rather than capitalized assets.


      BeReal integration risk is live. At acquisition, BeReal was loss-making ($3 million monthly cash burn), its user
      base was declining, and it had not yet begun to monetize. As of early 2025, Yazdi said the user base had
      stabilized at approximately 30 million monthly users in France but was not yet growing. The five-year IPO horizon
      mentioned by Yazdi in May 2025 and the absence of any disclosed exit mechanism indicate that Voodoo is committed
      to a long private-market runway where execution delivery matters more than near-term liquidity events. Investors
      should treat the BeReal earnout terms, undisclosed Tencent stake percentage, and GBL governance rights as
      diligence items requiring data-room access.
    claimRefs:
      - CO036
      - CO037
      - CO038
      - CO039
      - CO041
      - CO042

