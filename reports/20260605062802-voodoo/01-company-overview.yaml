callouts:
  - calloutType: strength
    title: Data-driven publishing at global scale
    body: >-
      Voodoo's competitive advantage—testing nearly 2,000 prototypes per year with real-user data before scaling—is
      durable and difficult to replicate. This machine has already produced billions of downloads across three distinct
      game genres (hyper-casual, hybrid-casual, midcore) and is now being applied to social apps.
    claimRefs:
      - CO002
      - CO034
      - CO035
  - calloutType: insight
    title: BeReal integration is a long-duration bet, not a quick fix
    body: >-
      Voodoo bought BeReal when it was losing $3M monthly. Bringing it to break-even in months was operationally
      impressive, but generating the scale of revenue needed to justify €500M requires years of user base growth. Yazdi
      stated a five-year IPO horizon in May 2025, implying patient capital is required.
    claimRefs:
      - CO026
      - CO029
      - CO030
      - CO031
  - calloutType: risk
    title: Platform policy dependence is the systemic diligence constraint
    body: >-
      Apple's ATT policy in 2021 drove EBITDA leverage to 70x in one year. Voodoo survived through structural
      reorganization but the dependency on two gatekeepers—Apple and Google—remains the most important risk variable
      for every future chapter in this report.
    claimRefs:
      - CO037
      - CO038
      - CO039

