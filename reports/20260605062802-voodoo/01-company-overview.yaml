  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: current-valuation
      missingEvidence: >-
        The last confirmed public equity valuation is GBL's EUR 1.7 billion from July 2021. Secondary sources estimate
        post-BeReal valuations between $2.1 billion and $2.6 billion, but no primary-source confirmation of a
        post-2021 equity round or valuation update is available in this run.
      whyItMatters: >-
        Valuation is the most critical diligence metric; a four-year gap between the last confirmed equity round and
        the diligence date means any current valuation figure must be treated as estimated.
      diligencePath: >-
        Request current cap table, most recent 409A or independent valuation, and any secondary transactions that
        would imply a post-2021 price.
      relatedQuestionRefs:
        - QO017
      relatedTableRefs:
        - TO001
    - type: private-evidence-only
      severity: material
      topic: cap-table-percentages
      missingEvidence: >-
        The exact current stake percentages for Goldman Sachs, Tencent, and GBL are not publicly disclosed. GBL's
        16% stake at investment is the only confirmed percentage; dilution from the BeReal acquisition (partially
        funded with Voodoo shares) is unknown.
      whyItMatters: >-
        Without a confirmed cap table, governance rights, anti-dilution provisions, and liquidation waterfall cannot
        be assessed. The BeReal earnout payable in Voodoo shares also affects future dilution.
      diligencePath: >-
        Request the current cap table, share certificates, stockholder agreements, and a capitalization summary
        reflecting the BeReal acquisition's share component and earnout.
      relatedQuestionRefs:
        - QO009
        - QO012
      relatedTableRefs:
        - TO003
    - type: enumeration-incomplete
      severity: material
      topic: board-composition
      missingEvidence: >-
        No public source reviewed in this run names Voodoo's board of directors composition, any independent
        directors, or the governance rights attached to minority investor preferred shares.
      whyItMatters: >-
        Board composition determines governance quality, conflict management, and whether minority investor consent
        rights constrain strategic decisions like future M&A, IPO timing, or dividend policy.
      diligencePath: >-
        Request board composition, committee structure, chair identity, and the investor rights agreement documenting
        GBL's preferred share terms and any board seats.
      relatedQuestionRefs:
        - QO008
      relatedTableRefs:
        - TO002
    - type: private-evidence-only
      severity: material
      topic: BeReal-earnout-terms
      missingEvidence: >-
        The €500 million BeReal acquisition included cash, Voodoo shares, and a performance-based earnout. No public
        source specifies the earnout targets, payout timeline, or the cash-versus-share split.
      whyItMatters: >-
        Earnout obligations can create dilution, cash calls, or management-incentive misalignment if BeReal
        performance targets are not met. The total acquisition cost could exceed the stated €500M.
      diligencePath: >-
        Request the BeReal acquisition agreement, earnout schedule, performance metrics, and Voodoo shares issued
        as part of consideration.
      relatedQuestionRefs:
        - QO020
      relatedTableRefs:
        - TO003
    - type: private-evidence-only
      severity: minor
      topic: Tencent-stake-and-rights
      missingEvidence: >-
        Tencent's investment amount, exact stake percentage, and any APAC distribution or technology agreement
        associated with the 2020 investment are not publicly disclosed.
      whyItMatters: >-
        Tencent's Chinese ownership could create regulatory scrutiny in some markets and its governance rights may
        include veto, consent, or information rights that affect strategic flexibility.
      diligencePath: >-
        Request Tencent's investment documentation, current stake percentage, any technology or distribution
        side agreements, and a legal review of any regulatory notification requirements.
      relatedQuestionRefs:
        - QO011
      relatedTableRefs:
        - TO003
    - type: access-blocked
      severity: minor
      topic: BeReal-IPO-exit-tracker
      missingEvidence: >-
        The IPOs.fyi BeReal tracker returned a rate-limit error and could not be read directly; its characterization
