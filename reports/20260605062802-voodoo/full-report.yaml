  - id: FM001
    title: Market sizing pyramid — Voodoo addressable layers
    type: pyramid
    layout: standard
    summary: >-
      Nested market layers from the global mobile gaming TAM to Voodoo's actual 2025 gaming revenue, passing through
      casual gaming SAM and hybrid-casual sub-segment. Each layer is bounded by a different analyst methodology; the SOM
      proxy is derived from company-reported gaming revenue and not a formal market-share estimate.
    data:
      items:
        - label: Global mobile gaming TAM (2025)
          value: $126–165B
          detail: >-
            Range across Statista/manataz ($126B, IAP-only) to GMI/ResearchAndMarkets ($165B, broader scope); Precedence
            Research midpoint $143.96B most cited.
          tone: neutral
        - label: Casual mobile gaming SAM (2025)
          value: ~$35–40B
          detail: >-
            AppMagic/Ripple Reports estimate $35–38B casual IAP; Voodoo CEO Yazdi cited ~$40B inclusive of advertising
            revenue, "deeper and more resilient" versus older narrow definitions.
          tone: positive
        - label: Hybrid-casual sub-segment (2025)
          value: ~$9.8B (IAP)
          detail: >-
            Fastest-growing casual sub-tier per Ripple Reports; 37% YoY growth in 2024; forecast $12.5B in 2026.
            Excludes advertising revenue alongside IAP, which would increase total pool.
          tone: positive
        - label: Voodoo gaming revenue (2025, SOM proxy)
          value: $653M
          detail: >-
            Company-reported 2025 gaming revenue (90% of $778M total); implies ~1.6–1.9% of casual gaming IAP market.
            Not a formal SOM; genre revenue breakdown not disclosed.
          tone: neutral
    approximationNotes: >-
      Layers are not additive; each narrows the prior. The hybrid-casual IAP figure excludes advertising revenue flowing
      through the same titles; including advertising revenue would widen the sub-segment figure. Voodoo's SOM proxy uses
      gaming revenue only and does not include partner platform revenue share.
    claimRefs:
      - CM008
      - CM009
      - CM001
      - CM002
      - CM013
  - id: FM002
    title: Mobile gaming market estimate range (2025)
    type: range
    layout: wide
    summary: >-
      Low, base, and high estimates of the global mobile gaming market size for 2025 in USD billions, drawn from three
      analyst methodologies. The spread reflects scope differences (IAP-only vs. IAP+advertising) and geographic
      treatment, not data quality disagreements per se. All values use USD billions as the unit.
    data:
      items:
        - label: Narrow IAP estimate (Statista / manataz)
          low: 126
          mid: 129
          high: 132
          unit: US$B
          detail: IAP-only consumer spend; excludes in-game advertising revenue; Statista bottom-up model; narrowest scope.
          source: Statista / manataz
          tone: neutral
        - label: Precedence Research midpoint
          low: 140
          mid: 143.96
          high: 150
          unit: US$B
          detail: Precedence Research 2025 base figure; forecast $158.5B in 2026; 9.95% CAGR to 2035; APAC dominance expected.
          source: Precedence Research
          tone: positive
        - label: High-end estimate (GMI / ResearchAndMarkets)
          low: 158
          mid: 162
          high: 165
          unit: US$B
          detail: >-
            Higher scope estimates citing CAGR of 8–19%; methodology not fully disclosed; likely includes broader
            monetization channels; Voodoo CEO's $40B casual segment is roughly 25% of this estimate.
          source: GMI Insights / ResearchAndMarkets
          tone: neutral
    approximationNotes: >-
      Mid values for Statista and GMI rows are author-derived interpolations from range endpoints; they are not point
      estimates from the original source. The spread in estimates is primarily a scope issue (IAP vs. IAP+ads) rather
      than a genuine forecasting disagreement. Voodoo competes in the casual sub-segment, estimated at $35–40B,
      representing roughly 22–28% of any of these TAM ranges.
