      - number: '3.5'
        title: Moat durability, switching costs, and competitive risk register
        blocks:
          - type: paragraph
            body: >-
              Voodoo's competitive durability varies sharply across its two business lines. In hybrid-casual publishing,
              several moat elements are materially defensible. The data flywheel — accumulated behavioral signal from 8+
              billion downloads — is not replicable by a new entrant on a short timeline; building comparable signal
              depth requires years of sustained publishing volume. The 150+ partner-studio pipeline creates a
              self-reinforcing deal flow: studios with validated prototypes select publishers offering the best UA
              capital and testing efficiency, reinforcing Voodoo's supply advantage. Franchise depth in Mob Control and
              Block Jam 3D, measured over multiple years of live operations, reduces the marginal cost of content
              extension relative to launching new intellectual property from scratch.


              The primary threats to Voodoo's hybrid-casual moat are: (1) genre commoditization — the same convergence
              dynamic that destroyed value in hyper-casual is beginning to manifest in hybrid-casual puzzle, evidenced
              by the proliferation of screw-sort, block-sort, and color-sort clone titles across 15+ publishers in the
              2025–2026 period, with puzzle games representing 60%+ of hybrid-casual revenue and arcade 32%; (2)
              Rollic's aggressive live-ops monetization intensity and RPD progression ($3 RPD with Screw Jam), which has
              narrowed the monetization depth gap; (3) Tripledot's post-acquisition scale, now comparable in download
              volume to Voodoo and with AppLovin as a commercially intertwined minority shareholder; and (4) the
              Supersonic divestiture, which may reconcentrate competitive pressure depending on the ultimate buyer.


              Switching costs for Voodoo's gaming consumers are effectively zero: casual games are free to install,
              require no account or data migration, and are substitutable within genre in minutes. Consumer lock-in
              exists only at the franchise level — players invested in Block Jam 3D progression mechanics may resist
              switching — but this is materially weaker than the progression-depth lock-in of midcore or hardcore
              titles. For partner studios, switching costs are moderate: renegotiating publisher terms, rebuilding
              testing API integrations, and forgoing Voodoo's UA capital commitment represents a meaningful friction but
              not a structural barrier. Multi-homing across publishers is common in the studio ecosystem.


              For BeReal, switching costs are structurally low. The social graph is shallow compared to Facebook,
              Instagram, or Snapchat — users have few followers, content is ephemeral, and there is no direct-messaging
              lock-in at the scale of WhatsApp or iMessage. Users demonstrably multi-home across BeReal and Instagram
              simultaneously, which limits BeReal's ability to capture exclusive daily social interaction that would
              create durable retention. Voodoo's most credible moat-building paths for BeReal are messaging feature
              deepening, public feed expansion, and social-graph stickiness — all requiring significant product
              development cycles and behavioral change against entrenched incumbents with far greater resources.
            claimRefs:
              - CP004
              - CP023
              - CP024
              - CP025
              - CP028
              - CP033
              - CP036
