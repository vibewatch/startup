              largest hybrid-casual publishers from the independent competitive pool. Supersonic's 6.6 billion lifetime
              downloads and 190 million monthly active users represent a significant scale asset. If Voodoo or another
              well-capitalized publisher acquires Supersonic's portfolio, the competitive dynamics in hybrid-casual
              publishing could restructure substantially in favor of the acquirer. The absence of a disclosed buyer as
              of the diligence date leaves this outcome unresolved.
