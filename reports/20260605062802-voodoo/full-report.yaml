  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and mix quality
        blocks:
          - type: paragraph
            body: >-
              Voodoo monetizes a portfolio of free-to-play mobile games and consumer apps rather than subscription
              software. The highest-confidence financial anchor is company-claimed top-line scale: €623 million of 2024
              revenue with €135 million of EBITDA, corroborated by Sifted, followed by a company-claimed $778 million of
              2025 revenue. The reported mix is improving: Voodoo says 80% of 2024 income came from games that had been
              live for more than two years, and it says 2025 gaming revenue reached $653 million, or 90% of the
