      - number: '1.4'
        title: Scale, key metrics, and financial performance
        blocks:
          - type: paragraph
            body: >
              Voodoo's public financial profile reflects a genuine scaling trajectory, though with important gaps that
              cannot be filled from publicly accessible sources. The company reported €623 million in revenue in 2024,
              representing 20% year-over-year growth, with an EBITDA of €135 million (a 34% improvement versus 2023). In
              2025 the company reported $778 million in revenue, a further 16% increase. These figures are sourced from
              Voodoo's own published press releases and corroborated by Sifted and industry media. The company has been
              EBITDA-positive since 2017.


              On user scale, Voodoo's games and apps have accumulated over 8 billion total downloads since founding,
              with 1.5 billion downloads in 2025 alone. The company had 150 million monthly active users in 2024 and 169
              million in 2025. In 2024 the company generated 950 million app downloads. These are all company-reported
              figures and should be treated as directional rather than audited. Voodoo describes itself as the
              fifth-largest mobile publisher worldwide by download volume, behind Google, Meta, Tencent, and ByteDance.


              Headcount reached approximately 800 employees across 14 countries as of the 2024 annual results
              announcement. Fitch's June 2025 report estimated Fitch-defined EBITDA of approximately €63 million and FCF
              of €14 million for 2024, which is materially lower than the company's own EBITDA figure of €135 million,
              reflecting different treatment of development costs. Both figures point to a profitable business. Gaps
              exist on exact current valuation, precise cap table post-BeReal acquisition, and revenue by specific game
              or product line.
