            body: >-
              Multiple lenses point to a broad, non-precise fair-value band rather than a single number. A revenue lens
              using GBL's €689 million sales and a 3.0x-4.0x publisher multiple suggests roughly €2.1 billion-€2.8
              billion enterprise value before debt adjustments; that lines up with the GBL look-through and Clay's $2.6
              billion estimate, but it is only as good as the revenue quality and 2025 margin bridge. An EBITDA lens
              using the 2024 €135 million EBITDA and a 12x-16x profitable-publisher multiple gives about €1.6
              billion-€2.2 billion EV, lower than the revenue lens because Voodoo's EBITDA margin is much lower than
              AppLovin's and its model is less platform-like than Roblox. Public comps reinforce the dispersion:
              AppLovin trades as a high-margin adtech outlier, Roblox as a platform premium, Unity as a software/tooling
              comp, and EA/Take-Two as more mature publisher references. Voodoo should not receive the top platform
              multiple unless BeReal proves durable monetization and the game portfolio's hybrid-casual recurrence is
              audited.
