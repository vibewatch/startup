  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape taxonomy and tier structure
        blocks:
          - type: paragraph
            body: >-
              Voodoo's competitive exposure divides into two structurally distinct arenas requiring separate analytical
              frameworks. The first is hybrid-casual mobile game publishing, where competition is defined by
              user-acquisition efficiency, data-driven game-testing infrastructure, partner studio pipelines, and
              franchise depth. The second is consumer social apps, where BeReal competes within the broader social
              networking segment against incumbents whose scale and network effects dwarf Voodoo's resources.


              Within mobile game publishing, the relevant competitive tier is narrow and well-documented by third-party
              IAP tracking data. As of mid-2026, Next Big Games and AppMagic identify five to seven publishers that
              consistently occupy the top positions by hybrid-casual IAP revenue: Rollic (owned by Zynga, a Take-Two
              Interactive subsidiary), Homa (Paris-based, independently funded), Tripledot Studios (London-based,
              enlarged by the May 2025 AppLovin games acquisition), Supersonic Studios (historically owned by Unity,
              currently being divested), Voodoo, and emerging challengers Loom Games and iKame Global / Zego Studio. The
              French Triad — Homa, Voodoo, and Madbox — accounted for approximately 43% of hybrid-casual revenue (IAP
              plus advertising) since 2022, with Rollic adding another 26%, leaving roughly 31% to the broader field.
              This concentration is narrowing as second-tier publishers scale.


              The competitive taxonomy used in this chapter covers four tiers: (1) direct hybrid-casual peers —
              publishers with comparable revenue scale, overlapping target genre and UA audience; (2) incumbent adjacent
              publishers — larger portfolio operators such as Supercell and King/Activision Blizzard whose midcore and
              casual titles compete for the same consumer attention; (3) platform and infrastructure players — AppLovin
              (ad-tech only, no longer a game publisher after the Tripledot transaction) and Unity (game engine and
              SDK), whose platform policies and fee structures set the economics of UA and monetization for all
              publishers; and (4) consumer social adjacency — Instagram, TikTok, and Snapchat, which are the primary
              competitive threats to BeReal.


              The status-quo substitute for Voodoo's gaming portfolio is organic discovery and peer-to-peer word of
              mouth, which is structurally weaker for hyper-casual titles given their commoditized mechanics. For
              BeReal, the status-quo substitute is continued multi-homing across existing social platforms — the
              dominant competitive risk. Internal build (indie developers self-publishing without a major publisher)
              remains an indirect substitute for Voodoo's partner platform, constrained by the capital intensity of
              scaling UA at competitive CPIs.
