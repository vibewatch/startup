            ~$2B gross revenue and 25M DAU (scale 9); monetization depth 6 reflects diverse genre mix with moderate RPD
            vs. puzzle-concentrated peers.
          tone: warning
        - label: Supersonic (divesting)
          x: 9
          'y': 4
          detail: >-
            6.6B lifetime downloads and 190M MAU (scale 9); monetization 4 reflects lower hybrid-casual RPD relative to
            top peers and structural uncertainty from Unity exit.
          tone: negative
        - label: Instagram (BeReal context)
          x: 10
          'y': 9
          detail: >-
            2.4–3B MAU (scale 10); strong Gen Z ad monetization (monetization 9); entirely different competitive arena
            from gaming publishers.
          tone: warning
        - label: BeReal
          x: 2
          'y': 2
          detail: >-
            30–40M MAU contested (scale 2 vs. social giants); €30M 2025 advertising revenue (monetization 2); niche
            player in a market dominated by platforms 50–100x larger.
          tone: negative
    approximationNotes: >-
      Axes are ordinal: x reflects relative distribution scale (download or MAU volume) within each competitive arena; y
      reflects monetization depth (IAP RPD, LTV per user, or advertising ARPU). Gaming and social publishers are placed
