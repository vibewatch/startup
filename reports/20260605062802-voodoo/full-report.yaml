chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, headquarters, and operating model
        blocks:
          - type: paragraph
            body: >
              Voodoo is a French technology company that develops and publishes mobile games and consumer apps,
              headquartered in Paris, France. Founded in 2013 by Alexandre Yazdi and Laurent Ritter, the company
              describes its mission as entertaining the world through iconic apps and games. It operates as a private
              company under the legal entity Stan Holding SAS, which was used to structure the company's external debt
              financing.


              Voodoo's operating model has evolved considerably since founding. In its early years the company focused
              on rapid-prototyping hyper-casual games—simple, free-to-play mobile titles monetized through in-game
              advertising. At the peak of this model, between 2017 and 2020, Voodoo worked with over 2,000 partner
              studios worldwide and generated revenues in the hundreds of millions of dollars. From 2021 onward, the
              business underwent a deliberate transformation driven by Apple's App Tracking Transparency policy changes,
              which caused hyper-casual ad revenues to fall sharply. Voodoo shifted investment toward hybrid-casual
              games—more complex titles with longer lifecycles monetized through a mix of advertising and in-app
              purchases—and also entered the consumer social app category, culminating in the €500 million acquisition
              of BeReal in June 2024.


              As of the 2026 diligence date, Voodoo operates a diversified portfolio that includes franchise mobile
              games (Mob Control, Paper.io, Block Jam), a partner publishing platform supporting over 150 independent
              studios, the BeReal social photo app, and additional consumer products such as Wizz, Blitz, and Jamble.
              The company generated $670 million in revenue in 2024 (€623 million), maintains 169 million monthly active
              users, and employs approximately 800 people across 14 countries. Hyper-casual titles now represent only
              22% of revenue, down from 100% in 2021.
