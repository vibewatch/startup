  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product portfolio and module overview
        blocks:
          - type: paragraph
            body: >
              Voodoo's product portfolio spans three categories as of the 2026 diligence date. The first and largest is
              hybrid-casual mobile games, including franchise titles Mob Control (launched April 2021), Paper.io 2, and
              Block Jam 3D. These games are available on both the Apple App Store and Google Play and are monetized
              through a blend of in-app advertising and in-app purchases (IAP). Mob Control is the most publicly
              documented title: it had accumulated 302.1 million all-time downloads and $77.5 million in all-time
              revenue by mid-2026, with 14.5 million monthly active players on average and 2.4 million daily active
              players. Day-30 retention of 4.7% places it in mature live-game territory for the hybrid-casual category.
              The game underwent a transition from hyper-casual to a "mature live services" model, adding events, season
              passes, and crossover collaborations such as the 2024 Transformers partnership. Paper.io 2 has added a
              teams mode and cosmetic customization with 100+ skins and periodic live events. Block Jam 3D is a puzzle
              title that uses satisfying 3D block-placement mechanics with daily puzzles and live tournaments.


              The second category is social consumer apps. BeReal, acquired in June 2024 for €500 million, is the
              flagship social product and is described in greater depth in section 4. Wizz, a chat and social platform
              for Gen Z users, has over 15 million iOS downloads and more than 5 million on Google Play, and is
              reportedly used by approximately 25% of US teenagers.


              The third category, and least evidenced, is live commerce. Jamble, a live shopping app, was recently
              launched by Voodoo and was described in the 2024 annual results as experiencing early growth in the United
              States. No independent download or revenue data for Jamble has been located in the public domain as of the
              diligence date.


              Voodoo also operates a partner publishing program serving more than 150 external studios globally,
              providing access to its SDK, analytics, creative production, and UA infrastructure in exchange for a
              revenue-share arrangement whose commercial terms are not publicly disclosed.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE028
              - CE029
              - CE027
