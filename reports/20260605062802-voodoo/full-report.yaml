      - number: '1.2'
        title: Founders, leadership, and governance
        blocks:
          - type: paragraph
            body: >
              Voodoo was co-founded by Alexandre Yazdi and Laurent Ritter, both French entrepreneurs who had previously
              founded Studio Cadet, a web and mobile services company, in 2012. Yazdi serves as CEO and is the company's
              largest individual shareholder. Ritter co-founded the company alongside Yazdi; the founders retained
              majority control after all major investment rounds through 2021, with each investor acquiring only
              minority stakes.


              Yazdi's leadership style and strategic direction are central to understanding the company's identity. He
              directly authored the company's 10-year retrospective published on voodoo.io, detailing the shift from
              initial failure to hyper-casual dominance, the 2021–2022 crisis caused by Apple's privacy policy changes,
              and the subsequent rebound. His public communications make clear that he views the company's data-driven
              rapid-prototyping culture as its durable competitive advantage.


              Beyond the co-founders, Voodoo's leadership team includes the heads of its major product lines. Aymeric
              Roffé, who was CEO of Voodoo's Wizz social app, became CEO of BeReal following the June 2024 acquisition,
              while BeReal co-founder Alexis Barreyat departed after a transition period. Public sources do not disclose
              a formal board of directors composition or independent director names for Voodoo itself; the most visible
              governance layer is the investor consortium (Goldman Sachs, Tencent, GBL), each holding minority stakes
              with founders in control. Key-person dependence on Yazdi is a material diligence item given his
              operational centrality and the absence of a disclosed succession or co-CEO structure.
            claimRefs:
              - CO003
              - CO006
              - CO007
              - CO008
              - CO009
