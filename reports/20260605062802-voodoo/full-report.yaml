  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Voodoo is investable only with strict entry discipline because the public record supports both quality and
              opacity. Observable positives are unusually strong for a private consumer-app company: the company
              disclosed €623 million of 2024 revenue, €135 million of EBITDA, almost 20% revenue growth, 950 million
              downloads, EBITDA-positive performance since 2017, and a bank-supported refinancing. GBL's 2026 portfolio
              page adds a later €689 million sales data point, 920 employees, and a €316 million NAV for its 14.8%
              stake. Those facts imply scale, profitability, and a shareholder mark rather than a fully auditable
              enterprise value. The valuation stance therefore cannot be a clean intrinsic-value estimate. I would treat
              Voodoo as a track / research-more opportunity unless the offered entry price is at or below a conservative
              mid-single-digit revenue multiple or a clearly de-risked EBITDA multiple after debt and preferences. The
              anti-thesis is that BeReal, privacy/regulatory exposure, platform concentration, and still-B-rated
              leverage absorb too much of the upside if investors underwrite a premium social-platform multiple.
