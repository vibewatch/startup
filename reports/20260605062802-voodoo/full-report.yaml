companyProfile:
  summary: >-
    Voodoo is a Paris-based private mobile game publisher and consumer-app company founded in 2013 by Alexandre Yazdi
    and Laurent Ritter. It pioneered the hyper-casual mobile gaming genre, accumulating over 8 billion lifetime
    downloads, and has since pivoted toward longer-lifecycle hybrid-casual games and social apps. The €500 million
    acquisition of BeReal in June 2024 added a Gen Z social network with more than 40 million active users at signing.
    Backed by Goldman Sachs, Tencent, and GBL, the company generated €623 million in 2024 revenue and $778 million in
    2025, has been EBITDA-positive since 2017, and employs approximately 800 people across 14 countries. Voodoo operates
    a portfolio of franchise mobile games (Mob Control, Paper.io, Block Jam), a partner publishing platform supporting
    over 150 independent studios, and additional consumer apps including Wizz, Blitz, and Jamble.
