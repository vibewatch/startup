      - number: '4.3'
        title: BeReal monetization and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              BeReal is the main non-game financial swing factor. Voodoo paid €500 million for the asset, reported more
              than 40 million active users at signing, and later said the social-app layer generated about €30 million
              of 2025 revenue. Independent reporting supports the turnaround narrative only partially: Sifted said the
              app was loss-making with a declining user base before acquisition and later reached break-even, while
              TechCrunch said BeReal had been running out of funding. Skeptical usage evidence remains material. Sensor
              Tower reported that BeReal MAUs declined on average 2% year over year per month from November 2023 through
