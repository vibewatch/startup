            body: >-
              The strongest public customer signal is reach. Voodoo claims 169 million monthly active users and 1.5
              billion annual downloads for 2025, after claiming 950 million downloads and 150 million MAUs in 2024.
              Third-party and partner sources are directionally consistent with an eight-billion-plus lifetime-download
              footprint. The most granular title-level proof comes from Mob Control: Udonis reports 302.1 million
              lifetime downloads, 14.5 million average monthly players, 2.4 million average daily players, and 4.7%
              day-30 retention. Storefront review bases are also large: Mob Control has 417K App Store ratings, Paper.io
              2 has 2.7M App Store ratings and 2.14M Google Play reviews, and BeReal has 1.1M App Store ratings. These
              are adoption proxies rather than audited active-user files; they prove broad usage and feedback volume,
              not cohort-level LTV or churn.
