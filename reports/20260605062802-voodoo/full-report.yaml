        title: Retention, satisfaction, and adverse user signals
        blocks:
          - type: paragraph
            body: >-
              Retention proof is directionally positive but incomplete. Mob Control’s 4.7% day-30 retention and
              mature-live-game player base are the clearest public cohort proxy, while Voodoo’s claim that nearly 80% of
              2024 income came from games live for more than two years indicates durable monetization across older
              titles. BeReal’s engagement proof is more contested: the acquisition release described more than 40
              million active users and half using the app at least six days per week, but Sifted later reported
              stabilization at about 30 million monthly users after a declining period. Adverse customer evidence
              matters because advertising is core to the model. Google Play reviews for Paper.io 2 complain that ads can
              be unescapable or make play unplayable, and Voodoo’s response acknowledged the ad-balance problem. That
              creates an underwriting tension: ads fund scale, but excessive ad friction can damage retention and brand
              safety.
