              - CR045
      - number: '7.5'
        title: Hit-driven portfolio concentration and competitive execution risk
        blocks:
          - type: paragraph
            body: >-

              Despite the strategic pivot toward hybrid-casual franchises, Voodoo's revenue base retains meaningful
              concentration risk in a limited number of successful titles. Fitch stated plainly that "the video game
              industry is inherently hits-driven, which increases the volatility of cash flows." Mob Control, Paper.io,
              and Block Jam are the most visible flagship games in the public record, but per-title contribution
              margins, revenue share across the portfolio, and dependence on the top three or five titles are not
              disclosed. Voodoo's claim that 80% of 2024 revenue came from games active for over two years reduces but
              does not eliminate title-concentration risk: the same handful of franchises carry the reported durability
              metric.

              The competitive environment in mobile gaming is fragmented and low-barrier. Fitch characterized
              competition as "fierce" with "low barriers to entry," and Voodoo as third by downloads in the global
              market with limited overall market share. Rivals including Supercell (€2.8 billion revenue in 2024, 300
              million MAUs) and Zynga (acquired by Take-Two for $12.7 billion) operate at meaningfully larger scale and
              benefit from platform-holder relationships, franchise IP libraries, and diversified genre exposure.
              Voodoo's shift into "pure casual" games — which Yazdi described as capable of generating up to €1 billion
              per game — is aspirational but unproven at the company's scale. Execution against this roadmap requires
              sustained development investment, studio talent retention, and creative hit rate, all of which lack
              independent public verification.

              Partner-studio concentration also presents a downside scenario: Voodoo's publishing platform relies on an
              external supply of prototypes from 150+ studios, and the economics of revenue share, IP ownership, and
              studio exclusivity are not publicly disclosed. If leading studios divert better prototypes to competing
              publishers offering more favorable terms, or if the hit rate in hybrid-casual declines due to market
              saturation, the publishing engine could slow meaningfully.
            claimRefs:
              - CR034
              - CR036
              - CR037
              - CR038
              - CR043
      - number: '7.6'
        title: Governance opacity, key-person dependency, and disclosure risk
        blocks:
          - type: paragraph
            body: >-
              Voodoo operates as a private company under the legal entity Stan Holding SAS, with founders Alexandre
              Yazdi and Laurent Ritter retaining majority control. No reviewed public source discloses the composition
              of Voodoo's board of directors, the names of any independent directors, the existence of an audit
              committee, or any formal governance policies. This opacity is consistent with a private, founder-led
              company, but it is a material diligence gap at Voodoo's scale ($778 million in 2025 revenue) and given its
              public debt history. Investors and creditors relying on this report should treat Voodoo as having
              governance risk commensurate with a concentrated-ownership private company rather than a publicly governed
              one.

              Key-person dependency on CEO Alexandre Yazdi is a primary execution risk. Yazdi is identified as the
              primary architect of both the hyper-casual era and the subsequent transformation to hybrid-casual and
              social apps. His personal public communications are the most prominent disclosure channel for strategic
              direction. Maddyness reported in May 2026 that Yazdi took majority personal control of DC Company, the
              French digital media group owning Konbini and Le Gorafi, representing a personal investment commitment
              concurrent with leading a $778 million revenue business through a critical integration and transformation
              phase. While Yazdi is not leaving Voodoo, the personal outside investment signals a broadening attention
              scope that is a legitimate governance concern. No formal succession plan is publicly disclosed. Voodoo's
              CEO acknowledged that the company is "talking more about a five-year horizon" for an IPO, which means the
              current level of governance and disclosure is unlikely to improve materially in the near term.
            claimRefs:
              - CR030
              - CR031
              - CR032
              - CR040
              - CR044
          - type: table
            tableRef: TR004
            claimRefs:
              - CR030
              - CR031
              - CR032
              - CR040
      - number: '7.7'
        title: Monitoring triggers and thesis-break events
        blocks:
          - type: paragraph
            body: >-
              Materialization of any single risk examined in this chapter need not be fatal to the investment thesis,
              but several combinations represent thesis-break scenarios that would fundamentally alter the risk-return
              profile. The most consequential single event would be a resumption of BeReal's MAU decline following
              stabilization, because this would simultaneously impair the €500 million acquisition rationale, increase
              advertising-revenue volatility, and potentially drive a Fitch-analog downgrade if the BeReal EBITDA drag
              widens. The second-highest-severity event is a major regulatory enforcement action — a new CNIL
              investigation, an FTC COPPA consent decree, or a DSA fine — which would impose both financial penalties
              and remediation costs across the full partner-studio network.

              Platform policy shocks (a material change to Apple App Store rewarded-video policies, ATT expansion to all
              app categories, or a Google Play developer-fee increase) would compress EBITDA margins across the
              portfolio within one to two quarters. Financial leverage deterioration — leverage rising back above 5x
              following an unplanned acquisition or a large settlement — would put the new debt covenants at risk given
              the company's small EBITDA scale.

              CEO departure or material reduction in Yazdi's operational involvement would be an execution risk of the
              highest order, given the absence of a disclosed successor and the founder's centrality to the
              transformation strategy. Finally, a data breach or cybersecurity incident involving BeReal's user data or
              Voodoo's ad-network data would trigger both regulatory investigation and reputational damage at a moment
              when the company is seeking to establish advertiser trust for its social-app business.

              Monitoring indicators for each scenario are detailed in the kill criteria table. Diligence asks include:
              (a) BeReal monthly cohort dashboard post-acquisition, (b) board composition and governance documentation,
              (c) COPPA and DSA compliance program details, (d) per-title unit economics for top-5 games, (e) current
              debt schedule and covenant terms, (f) Yazdi time-allocation commitments.
