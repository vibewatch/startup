      - number: '1.6'
        title: Risk factors, adverse context, and diligence flags
        blocks:
          - type: paragraph
            body: >
              Voodoo carries several risk factors that are material to any downstream analysis. The most structurally
              important is its historical and ongoing dependence on Apple's App Store and Google Play. Apple's App
              Tracking Transparency (ATT) policy update in 2021 was effectively an existential event for Voodoo's
              original business model: it caused hyper-casual revenues to fall by half in one year and EBITDA leverage
              to spike to 70x by end-2022. The company recovered through a fundamental restructuring, but the episode
              confirmed that platform policy risk is systemic and not fully manageable by even the largest hyper-casual
              publishers.


              Fitch Ratings rated Voodoo's Long-Term Issuer Default Rating 'B' (speculative grade) as recently as June
              2025, when it withdrew the rating for commercial reasons after the TLB was repaid. The 'B' rating
              reflected small scale, execution risks from the BeReal integration, fierce competition, limited platform
              and genre diversification, and an aggressive financial policy. Fitch estimated Fitch-defined EBITDA at
              approximately €63 million—far below the company's own reported EBITDA of €135 million—due to different
              treatment of development costs as operating expenses rather than capitalized assets.


              BeReal integration risk is live. At acquisition, BeReal was loss-making ($3 million monthly cash burn),
              its user base was declining, and it had not yet begun to monetize. As of early 2025, Yazdi said the user
              base had stabilized at approximately 30 million monthly users in France but was not yet growing. The
              five-year IPO horizon mentioned by Yazdi in May 2025 and the absence of any disclosed exit mechanism
              indicate that Voodoo is committed to a long private-market runway where execution delivery matters more
              than near-term liquidity events. Investors should treat the BeReal earnout terms, undisclosed Tencent
              stake percentage, and GBL governance rights as diligence items requiring data-room access.
            claimRefs:
              - CO036
              - CO037
              - CO038
              - CO039
              - CO041
              - CO042
      - number: '1.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Data-driven publishing at global scale
            body: >-
              Voodoo's competitive advantage—testing nearly 2,000 prototypes per year with real-user data before
              scaling—is durable and difficult to replicate. This machine has already produced billions of downloads
              across three distinct game genres (hyper-casual, hybrid-casual, midcore) and is now being applied to
              social apps.
            calloutType: strength
            claimRefs:
              - CO002
              - CO034
              - CO035
          - type: callout
            title: BeReal integration is a long-duration bet, not a quick fix
            body: >-
              Voodoo bought BeReal when it was losing $3M monthly. Bringing it to break-even in months was operationally
              impressive, but generating the scale of revenue needed to justify €500M requires years of user base
              growth. Yazdi stated a five-year IPO horizon in May 2025, implying patient capital is required.
            calloutType: insight
            claimRefs:
              - CO026
              - CO029
              - CO030
              - CO031
          - type: callout
            title: Platform policy dependence is the systemic diligence constraint
            body: >-
              Apple's ATT policy in 2021 drove EBITDA leverage to 70x in one year. Voodoo survived through structural
              reorganization but the dependency on two gatekeepers—Apple and Google—remains the most important risk
              variable for every future chapter in this report.
            calloutType: risk
            claimRefs:
              - CO037
              - CO038
              - CO039
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and adjacencies
        blocks:
          - type: paragraph
            body: >
              Voodoo's market exposure is best understood across three distinct but interacting segments, each governed
              by different monetization mechanics, buyer relationships, and competitive dynamics.


              The primary market is casual mobile gaming — the segment Voodoo's CEO Alexandre Yazdi explicitly
              characterized as "a global market of around $40 billion, deeper and more resilient" in the company's 2025
              annual results. This $40 billion figure refers to IAP revenue from casual genres including puzzle, arcade,
              simulation, hyper-casual, and hybrid-casual, and excludes midcore and hardcore titles, PC and console
              categories, and subscription gaming bundles. Within this primary market, the hybrid-casual sub-segment —
              combining hyper-casual accessibility with deeper retention mechanics and IAP-plus-ads hybrid monetization
              — is the fastest-growing tier. Ripple Reports and AppMagic estimated hybrid-casual IAP at approximately
              $9.8 billion in 2025 with a forecast to reach $12.5 billion in 2026. The legacy pure hyper-casual
              sub-segment, Voodoo's original territory, generates only $600–700 million in annual IAP revenue as of
              2025. Despite commanding enormous download volumes — the top 100 hyper-casual titles achieved roughly 2.4
              billion downloads in H1 2025 alone — the segment is structurally commoditized on monetization: revenue is
              almost entirely advertising-dependent and declining as a share of total mobile gaming consumer spend.


              The secondary market is mobile in-app advertising. Since hyper-casual games and many hybrid-casual titles
              remain primarily or partially ad-monetized, Voodoo's revenue depends on demand-side spend within the
              broader mobile in-app advertising ecosystem. The Business Research Company estimated this market at
              $173.35 billion in 2025 with a 2026 forecast of $208.76 billion at a CAGR of 20.4% to 2030. Voodoo
              participates as a publisher supplying ad inventory from within its game portfolio to performance
              advertisers on demand-side platforms, rather than as an advertising-technology company; its captured share
              is a function of user inventory quality and engagement depth, not technology IP.


              The tertiary market is consumer social apps, entered through the €500 million acquisition of BeReal in
              June 2024. BeReal competes within the social networking app segment, estimated at $98.37 billion in 2025
              and forecast at $126.3 billion in 2026 by The Business Research Company. BeReal's effective monetizable
              pool is a narrow slice of this: authenticity-first photo sharing for Gen Z users with documented aversion
              to traditional advertising formats. BeReal generated €30 million in revenue in 2025 from in-app
              advertising introduced post-acquisition, representing an early-stage monetization foothold, not a full
              claim on the broader social media TAM.


              Excluded from Voodoo's relevant market are midcore and hardcore console and PC titles, subscription gaming
              services (Apple Arcade, Xbox Game Pass), PC browser advertising ecosystems, and live-service games
              requiring upfront purchases. Voodoo does not operate in these segments and has not signaled intent to
              enter them.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
          - type: table
            tableRef: TM001
            claimRefs: []
      - number: '2.2'
        title: Market sizing — TAM, SAM, and evidence constraints
        blocks:
          - type: paragraph
            body: >
              Sizing Voodoo's market exposure requires navigating substantial contradictions between analyst
              methodologies. The global mobile gaming TAM is variously reported at $126 billion to $165 billion for
              2025, depending on whether estimates include only IAP revenue, total consumer spend, or gross platform
              billing inclusive of advertising revenue. Precedence Research sized the 2025 market at $143.96 billion,
              projecting growth to $158.5 billion in 2026 at a 9.95% CAGR through 2035. GMI Insights and
              ResearchAndMarkets cited higher 2025 figures of up to approximately $165 billion. Statista and
              manataz-based estimates place total 2025 consumer spending closer to $126–132 billion. These ranges
              reflect differing base-year treatments, geographic scope (China's regulatory environment and market
              isolation create material ambiguity), and inconsistent inclusion or exclusion of advertising revenue
              alongside IAP.


              Voodoo's own SAM framing is more granular and therefore more investment-actionable. The CEO's
              characterization of the casual gaming market at approximately $40 billion aligns with AppMagic and Ripple
              Reports estimates of total casual IAP at $35–38 billion. This roughly 25–28% share of the global mobile
              gaming TAM is where Voodoo's gaming revenues reside. Hybrid-casual is the fastest-growing layer within
              this SAM: Ripple Reports estimated hybrid-casual IAP at $9.8 billion in 2025 growing at an estimated 28%
              CAGR, and $12.5 billion in 2026.


              A publisher-level SOM for Voodoo cannot be formally computed because the company does not disclose revenue
              by genre, and no third-party source provides a complete total revenue figure for hybrid-casual inclusive
              of advertising revenue alongside IAP. What is supportable is that Voodoo reported $653 million in gaming
              revenue in 2025 (90% of $778 million total), implying a rough 1.6–1.9% share of the $35–40 billion casual
              gaming market by consumer spend. This is a meaningful share for a private company in a fragmented market,
              but also illustrates the scale gap versus Tencent, Scopely, and Activision Blizzard King.


              For BeReal, no third-party analyst has published a standalone TAM for authenticity-first photo sharing.
              The nearest proxy is the social networking app market at $98–126 billion in 2025–2026, but BeReal's
              monetizable pool is structurally smaller: its ad inventory is nascent, daily active users are estimated at
              only 2.93 million per Business of Apps despite claimed MAU of up to 40 million, and the platform only
              began generating revenue in 2025. BeReal's €30 million in 2025 revenue relative to the broader social
              networking market confirms it is early-stage monetization within a niche adjacency, not a proof of claim
              on the full social media TAM.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
          - type: table
            tableRef: TM002
