      - number: '6.5'
        title: Expansion loops and concentration risks
        blocks:
          - type: paragraph
            body: >-
              Voodoo’s expansion loop is credible but not fully quantified. The company can cross-promote new games
              inside a massive installed base, use creative and market-intelligence tools to improve user acquisition,
              and use LiveOps, rewarded ads, season passes, and in-app purchases to extend title lifespans. Creator-side
              partners expand supply: Voodoo’s official current claim of over 150 partner studios is supplemented by
