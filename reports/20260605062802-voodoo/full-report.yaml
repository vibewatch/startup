      - number: '3.3'
        title: Capability, UA infrastructure, and data flywheel comparison
        blocks:
          - type: paragraph
            body: >-
              Voodoo's most defensible competitive advantage in hybrid-casual publishing is its data flywheel: a
              proprietary user-acquisition and game-testing infrastructure built on more than eight billion lifetime
              downloads across a portfolio of hundreds of titles spanning fifteen years of market operation. This
              behavioral dataset — covering session lengths, retention cohorts, ad-engagement patterns, and CPI
              responses by creative variant and audience segment — underpins a rapid-prototyping pipeline that evaluates
              approximately 2,000 game concepts annually across first-party studios and the 150+ partner-studio network.
              CEO Yazdi has identified this data-driven culture as the company's durable competitive advantage, and
              Block Jam 3D's achievement as the first hybrid-casual title to reach $2 revenue per download (RPD) in June
              2023 is a direct output of that system.


              The 150+ partner-studio network creates a supply-side moat that is difficult to replicate quickly:
              independent studios with validated game prototypes self-select toward publishers offering the most
              favorable combination of UA capital, testing infrastructure, and global distribution. Homa operates a
              comparable program; Supersonic's program faces structural uncertainty given the divestiture process.
              Rollic operates primarily through internal development rather than a large third-party network, limiting
              pipeline diversity while increasing quality control. Tripledot's post-acquisition model now encompasses 12
              owned studios but does not operate a public third-party publishing program analogous to Voodoo's scale.


              AppLovin's transition out of direct game publishing is materially relevant: its MAX mediation platform and
              AppDiscovery DSP remain the primary UA infrastructure for the entire casual publishing sector, generating
              $5.48 billion in 2026 revenue at 65.9% YoY growth. The half-cash, half-equity structure of the Tripledot
              transaction makes AppLovin a minority Tripledot shareholder, creating a commercially intertwined
              relationship between the dominant UA platform and a direct Voodoo competitor. Whether this affects
              Voodoo's access to AppLovin inventory or auction fairness cannot be determined from public sources and is
              a material diligence item.


              In user-acquisition cost structure, all top hybrid-casual publishers face the same structural headwind:
              rising CPIs driven by competitive UA bidding on finite mobile advertising inventory. The data flywheel
              advantage manifests not in absolute CPI levels — which are set by market-wide auction dynamics — but in
              conversion-to- monetized-user efficiency: the ability to identify and back titles with above-average
              LTV/CPI ratios before competitors act. Block Jam 3D's RPD leadership (June 2023, $2 RPD) was subsequently
              exceeded by Rollic's Screw Jam ($3 RPD, April 2024) and Homa's All In Hole ($4 RPD, August 2024),
              indicating the RPD arms race is intensifying across the direct competitive set.
            claimRefs:
              - CP015
              - CP023
              - CP024
              - CP026
