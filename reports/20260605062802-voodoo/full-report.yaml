        title: GTM efficiency, publishing economics, and unit-economics gaps
        blocks:
          - type: paragraph
            body: >-
              The operating model is a scaled consumer acquisition machine. Voodoo uses user acquisition, monetization,
              cross-promotion, and publishing infrastructure to identify and scale titles, while external studios and
              acquired/internal teams supply product capacity. Public sources give useful directional proxies:
              PocketGamer reported that 10 hybrid-casual games generated $20 million to $100 million per year, and
              Voodoo reported $653 million of 2025 gaming revenue. The underwriting problem is that no reviewed source
              discloses CAC, payback, ARPDAU, ad eCPM, platform fees, gross margin, revenue share with partner studios,
              or game-by-game contribution margin. Financial diligence therefore has to move from public revenue proof
              to private cohort files: spend by channel, CPI, ROAS curves, retention by geography, IAP versus ad split,
              store fees, and studio rev-share terms.
