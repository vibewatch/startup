  - id: FE004
    title: Product maturity / capability map
    type: matrix
    layout: wide
    summary: >-
      Evidence is strongest for the game portfolio and UA engine. BeReal product design is publicly observable but its
      engineering depth post-acquisition is opaque. Trust and security controls have public policies but no independent
      certification.
    data:
      columns:
        - Public evidence depth
        - Operational maturity signal
        - Independent corroboration
        - Main diligence gap
      rows:
        - label: Hybrid-casual game portfolio
          values:
            - Strong — app store listings, AppMagic stats, press releases
            - Mature — 302M downloads, franchise live-ops, 80% revenue from 2-year-old titles
            - Partial — Udonis/AppMagic stats; Balancy LiveOps analysis
            - Game-level margin, IAP/ad revenue split, per-cohort LTV
        - label: UA and creative production engine
          values:
            - Strong — Voodoo ads page, iion interview, GameAnalytics case study
            - Mature — 25K creatives/year, 250B impressions, proprietary ad network
            - Partial — third-party case study and iion partner interview; no independent audit
            - UA spend by channel, ROAS curves, CPI benchmarks not disclosed
        - label: Publishing platform (SDK + tools)
          values:
            - Moderate — product page descriptions, community SDK repo on GitHub, job postings
            - Mature — 150+ studios, ~2K prototypes/year, remote config LiveOps in production
            - Limited — community SDK repo only; official developer docs not public
            - SDK release cadence, backward compatibility, partner NPS not publicly disclosed
        - label: BeReal product design
          values:
            - Strong — public app, privacy policy, Nielsen study methodology published
            - Stabilizing — 40M+ MAU, €30M 2025 revenue claimed, Nielsen ad-recall metrics
            - Partial — Nielsen study commissioned by BeReal; MAU independently unverified post-acquisition
            - Backend architecture, content moderation, engineering headcount, post-acquisition churn cohorts
        - label: Trust and compliance
          values:
            - Moderate — privacy policies published and updated May 2026; iion ad-quality interview
            - Operational — centralized ad ops with partner written agreements; feature-flag rollback
            - Weak — no independent security audit, ISO 27001, SOC 2, or bug bounty program found
            - Third-party security certification; GDPR consent-SDK technical audit; DPO oversight scope
    approximationNotes: Maturity ratings are based on publicly available evidence only; internal systems cannot be independently verified.
