  - id: FR001
    title: Risk heatmap — likelihood vs. impact
    type: matrix
    layout: wide
    summary: >-
      Regulatory/privacy enforcement, platform dependency, and BeReal monetization failure cluster in the high-impact
      zone. Financial leverage risk has reduced after refinancing but remains elevated at 'B' scale.
    data:
      columns:
        - High likelihood
        - Medium likelihood
        - Low likelihood
      rows:
        - label: High impact
          values:
            - >-
              Apple ATT / platform policy shock (realized structural risk; potential for additional rounds); COPPA 2026
              non-compliance (US enforcement active and prioritized by FTC)
            - >-
              EU DSA non-compliance — BeReal and UGC games (enforcement accelerating; no Voodoo report confirmed);
              BeReal user-base resumption of decline
            - >-
              CEO Yazdi departure (low near-term probability but catastrophic to transformation thesis); Major data
              breach involving BeReal user photos
        - label: Medium impact
          values:
            - >-
              CNIL re-investigation of consent compliance (CNIL reserved right; ongoing SDK update risk); Programmatic
              CPM compression / DSP concentration (structural, ongoing)
            - >-
              Hit-driven portfolio concentration risk — flagship game revenue decline; Partner-studio supply disruption
              or re-routing to competing publishers
            - >-
              Tencent geopolitical regulatory scrutiny (US CFIUS context; no current enforcement); Leverage rise above
              5x from unplanned acquisition
        - label: Low impact
          values:
            - >-
              SDK version fragmentation causing app-stability issues (well-mitigated; low residual impact); SIVT
              programmatic ad fraud (industry-wide; Voodoo has controls in place)
            - >-
              Fitch-analog leverage breach (below 4x expected; refinancing complete; manageable with EBITDA growth); UK
              Online Safety Act — BeReal UK obligations
            - >-
              BeReal competitive feature copied again by incumbent (already happened; limited marginal impact at this
              stage); French GDPR/ePrivacy evolution beyond current posture
    approximationNotes: >-
      Likelihood and impact are qualitative assessments based on publicly available evidence, Fitch ratings analysis,
      and regulatory enforcement data. Internal probability estimates are not available. Risk positions are mid-2026
      assessments and may shift with BeReal trajectory and regulatory developments.
