      - number: '1.5'
        title: Milestones and strategic evolution
        blocks:
          - type: paragraph
            body: >
              The most durable fact for this report is Voodoo's milestone chronology, which spans from a failed French
              quiz app in 2013 to a diversified mobile entertainment company with a €500 million social media
              acquisition in 2024. The company's strategic narrative can be understood in five phases: early struggle
              (2013–2016); hyper-casual explosion driven by Paper.io and Helix Jump (2016–2020); crisis following
              Apple's ATT privacy changes (2021–2022); a hybrid-casual rebound anchored by Mob Control, Collect Em All,
              and Block Jam (2022–2023); and a diversification push into social apps via the BeReal acquisition and the
              Jamble live-shopping platform (2024–present).


              Two acquisitions stand out as milestone events. In September 2021 Voodoo acquired Beach Bum, an Israeli
              studio known for mobile board games, for approximately €300 million—a signal of the company's intent to
              move beyond pure hyper-casual. The BeReal acquisition in June 2024 for €500 million was a much larger bet:
              BeReal had over 40 million active users but was losing €2.6 million monthly and had not yet monetized.
              Voodoo brought BeReal to break-even within a few months through cost cuts and light advertising, and
              BeReal generated €30 million in revenue in 2025 with a stabilized user base.


              The debt refinancing completed in April 2025 is also a material milestone: it redeemed the €220 million
              TLB and established a new structure with maturities in 2029–2030, closing a key near-term financing risk
              that Fitch had flagged in 2023. The refinancing was supported by a "consortium of leading banks and
              institutions," according to Voodoo's press release, signaling institutional confidence in the company's
              cash generation post-turnaround.
