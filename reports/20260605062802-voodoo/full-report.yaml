  - id: FP003
    title: Moat / readiness KPIs
    type: kpi
    layout: standard
    summary: >-
      Compact competitive durability summary for Voodoo across seven dimensions covering gaming moat strength, BeReal
      moat weakness, and near-term competitive risk factors. Assessments derived from retained public evidence.
    data:
      items:
        - label: Gaming data-flywheel depth
          value: high
          detail: >-
            8B+ lifetime downloads; 2,000+ annual concept tests; first hybrid-casual $2 RPD title; not replicable by new
            entrants on short timeline.
          tone: positive
        - label: Partner studio pipeline moat
          value: high
          detail: >-
            150+ partner studios; self-reinforcing deal flow toward best UA capital and testing infrastructure; Homa is
            comparable but not publicly confirmed at same scale.
          tone: positive
        - label: Direct hybrid-casual competitive pressure
          value: high
          detail: >-
            Rollic (#2 March 2026), Homa (occasional #2 by IAP), and Loom Games (#1 March 2026) trade top rankings
            monthly; RPD leadership no longer exclusively Voodoo-held.
          tone: negative
        - label: Genre commoditization risk
          value: elevated
          detail: >-
            Puzzle/sort-mechanics clones proliferating across 15+ publishers; 60%+ of hybrid-casual revenue from puzzle
            genre under pressure from near-identical mechanics.
          tone: warning
        - label: BeReal authenticity moat
          value: low
          detail: >-
            Feature-cloned by Instagram Candid Stories and TikTok Now; social graph shallow; no streak, messaging, or
            contact-import lock-in comparable to Snapchat.
          tone: negative
        - label: BeReal user switching cost
          value: low
          detail: >-
            Ephemeral content, shallow follower graph, multi-homing with Instagram commonplace; 72% daily engagement is
            ritual-driven but structurally fragile.
          tone: negative
        - label: Supersonic divestiture opportunity
          value: medium
          detail: >-
            Unity exiting the sector removes a major competitive pressure point; acquisition of Supersonic's
            6.6B-download and 190M-MAU asset base by Voodoo or a peer would reshape competitive concentration.
          tone: warning
    approximationNotes: >-
      KPI labels are analytic summaries derived from retained public evidence, not company-reported internal scorecards.
