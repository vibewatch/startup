              - CE010
              - CE013
              - CE018
              - CE020
      - number: '5.6'
        title: Technology differentiation and evidence gaps
        blocks:
          - type: paragraph
            body: >
              Voodoo's durable product and technology advantages are observable in three areas. First, the publishing
              and UA engine: a pipeline testing nearly 2,000 prototypes per year, producing 25,000 creatives annually
              and delivering 250 billion ad impressions, represents an industrial-scale data flywheel that is difficult
              to replicate quickly. The combination of in-house creative production at scale, first-party audience data
              across 169 million MAUs, and a proprietary ad network with audience reach not fully captured by social
              platforms (25% of network users reportedly unreachable via social media alone) provides a differentiated
              UA surface. Second, the franchise longevity shift: 80% of 2024 revenue came from games that had been live
              for more than two years, reflecting genuine product depth built through LiveOps, remote configuration, and
              iterative A/B testing rather than launch-and-decay hyper-casual mechanics. Third, BeReal's product
              constraint design: the authenticity mechanics (no filters, no likes, dual-camera, one-per-day) are
              observable IP and differentiated within social media; the Nielsen ad study, while commissioned, provides
              the first independent numeric data on BeReal's advertising recall versus Instagram, TikTok, Snapchat,
              Facebook, and Pinterest.


              Key evidence gaps that a technical diligence process should close are: (1) BeReal's post-acquisition
              engineering structure, backend architecture, content moderation approach, and cloud infrastructure costs;
              (2) the provenance and licensing of machine learning models used in ad targeting and recommendation; (3)
              an independent security assessment of Voodoo's ad-tech stack and data flows, particularly given
              first-party IDFA/GAID data volume; (4) SDK version control, release cadence, and backward-compatibility
              commitments for the publishing partner ecosystem; (5) any IP registered in the form of patents for game
              mechanics, ad formats, or analytics methods; and (6) redundancy and availability data for the game backend
              supporting multiplayer and social features across Voodoo's portfolio.
            claimRefs:
              - CE005
              - CE010
              - CE011
              - CE025
              - CE026
              - CE037
              - CE039
              - CE040
      - number: '5.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Publishing platform and UA flywheel are the most observable tech moats
            body: >-
              The combination of 2,000 prototypes per year, 25,000 creatives, 250B impressions, and an in-house ML
              ad-targeting platform creates a data flywheel that is difficult for smaller publishers to replicate. The
              franchise shift (80% of revenue from 2+ year-old titles) validates that the platform produces durable
              products, not just hits.
            calloutType: insight
            claimRefs:
              - CE005
              - CE010
              - CE011
              - CE025
              - CE037
          - type: callout
            title: BeReal architecture opacity is the primary product-tech diligence gap
            body: >-
              BeReal's product design is public but its technical infrastructure — cloud vendor, content moderation
              pipeline, ML/recommendation stack, and post-acquisition engineering structure — is entirely opaque. A
              €500M acquisition with undisclosed architecture creates meaningful integration and continuity risk that
              requires access to internal systems documentation.
            calloutType: risk
            claimRefs:
              - CE013
              - CE016
              - CE034
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: 'Who the “customer” is: players, social users, advertisers, and studios'
        blocks:
          - type: paragraph
            body: >-
              Voodoo is not a classic enterprise software company with a visible account list. Its customer proof is
              distributed across consumer attention and supply-side creation. The largest segment is free-to-play mobile
              game players reached through titles such as Mob Control and Paper.io 2; those users pay indirectly through
              ad impressions and directly through season passes, gems, no-ads purchases, and other in-app purchases.
              BeReal and Wizz add a separate social-app community whose core behavior is not game play: BeReal is a
              daily authenticity network and Wizz is a chat/social discovery app. A third customer class is advertisers
              and brands buying mobile attention through Voodoo game inventory or BeReal’s dual-camera ad formats. A
              fourth class is creator/publisher-side partners: external studios and individual developers who use
              Voodoo’s publishing, SDK, testing, creative, and Academy infrastructure. This makes Voodoo’s customer
              diligence a two-sided question: verify real consumer engagement, then verify whether advertisers and
              studio partners repeatedly monetize that engagement.
