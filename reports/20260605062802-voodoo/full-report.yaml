      - number: '2.5'
        title: Constraints, headwinds, and sizing gaps
        blocks:
          - type: paragraph
            body: >
              The most structurally significant constraint for Voodoo's gaming business is the ongoing impact of Apple's
              App Tracking Transparency (ATT) framework, introduced in 2021. ATT requires explicit opt-in consent for
              cross-app tracking, effectively eliminating deterministic user-level attribution that hyper-casual
              publishers had used to calibrate user-acquisition spending. Post-ATT, eCPMs in casual mobile gaming
              dropped 20–40% in some reporting periods and have not fully recovered to pre-2021 levels. The constraint
              is structural, not cyclical: Apple has shown no inclination to reverse the policy, and Google has followed
              with Android Privacy Sandbox restrictions. Voodoo's pivot to hybrid-casual and IAP is in large part a
              strategic response to this constraint rather than purely opportunistic expansion; the company's own
              history is the most instructive example — EBITDA leverage hit approximately 70x by end-2022 following the
              ATT implementation.


              The second constraint is platform concentration. Apple's App Store and Google Play collectively control
              app distribution in Western markets, each taking 15–30% commissions on IAP transactions and exercising
              discretionary authority over app approval, algorithmic discovery, and policy enforcement. A material
              policy change on either platform — new privacy restrictions, changes to rewarded advertising standards, or
              prohibition of a specific game mechanic — could affect Voodoo's revenues with limited warning. Voodoo
              faces this risk across its entire portfolio simultaneously because its core gaming business is 100%
              dependent on mobile operating system storefronts.


              The third constraint is user-acquisition cost inflation. As more publishers shift from hyper-casual to
              hybrid-casual, competition for installation-intent users intensifies and CPIs rise. Hybrid-casual titles
              require materially higher CPIs than hyper-casual, extending payback periods and demanding deeper IAP
              monetization to sustain unit economics. Publishers with inferior data infrastructure or narrower genre
              catalogs face structural disadvantage, but this also raises minimum viable investment thresholds, making
              the category increasingly inaccessible to smaller operators.


              BeReal faces distinct constraints. Its core user promise — unfiltered simultaneous front-and-rear
              authenticity — limits advertising inventory types and volume. Historical surveys found 80% of
              pre-monetization BeReal users valued the platform specifically because it lacked traditional advertising.
              Download trajectories are negative: annual downloads fell 60% year-over-year from 2023 to 2024 and fell an
              estimated 50% again in 2025. The most material sizing gap is the MAU discrepancy: Voodoo and TechCrunch
              cited 40 million MAU as of the April 2025 US ad platform launch, while external analytics sources
              including Online Optimism placed the figure closer to 16 million — a 2.5x range that has not been resolved
              in public reporting and materially affects BeReal's monetization potential and addressable advertising
              inventory.
            claimRefs:
              - CM028
              - CM029
              - CM030
              - CM031
              - CM032
              - CM033
              - CM034
              - CM035
