      - number: '7.2'
        title: Platform dependency and advertising-market risk
        blocks:
          - type: paragraph
            body: >-
              Fitch explicitly cited Voodoo's high dependence on two major distribution platforms — Apple's App Store
              and Google Play — as a key rating constraint, noting that Apple's tightening of its privacy policy has had
              a structural impact on the entire mobile-game sub-sector. For Voodoo, Apple's ATT framework created a
              direct revenue shock between 2021 and 2022 that drove EBITDA margins from healthy levels to 0.8% in 2022,
              forcing the company's strategic pivot away from hyper-casual advertising. Even with the shift to
              hybrid-casual games and in-app purchases (now 45% of revenue in 2024 versus 1% in 2021), Voodoo's revenue
              base retains substantial exposure to programmatic advertising through its ad network and BeReal's nascent
              ad product.

              Programmatic advertising accounted for an estimated 90% of digital display advertising transactions in
              2026, with market concentration anchored in a small number of demand-side platforms including Google
              DV360, The Trade Desk, and Amazon. Digital Applied reported a SIVT fraud rate of 8.7% across programmatic
              supply chains in 2026, representing a structural efficiency drain for publishers. Voodoo's Head of Ad
              Monetization identified privacy-driven signal loss as one of the five biggest threats to ad quality,
              alongside misleading creatives, performance instability from SDK conflicts, programmatic supply drift, and
              fragmentation across OS versions.

              Platform concentration risk operates in two directions: policy changes (e.g., a further tightening of App
              Store review guidelines, changes to SDK data-collection policies, or alterations to rewarded-video ad
              mechanics) can reduce fill rates or monetization yield across the entire portfolio simultaneously. A
              single App Store policy change affecting rewarded interstitial ads would cascade across all 150+ partner
              studios using Voodoo's SDK, multiplying the revenue impact. Distribution risk is compounded by the fact
              that Voodoo has no material alternative distribution surface — web-based PWA distribution, sideloading,
              and third-party stores are de minimis on iOS globally.
            claimRefs:
              - CR009
              - CR028
              - CR029
              - CR035
              - CR036
              - CR037
              - CR038
