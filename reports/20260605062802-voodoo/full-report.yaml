    title: Company milestone timeline
    type: timeline
    layout: wide
    summary: >-
      Voodoo's public record spans from a Parisian hyper-casual startup in 2013 to a diversified mobile entertainment
      company with a major social-app acquisition and sustained profitability by 2025, punctuated by an existential
      platform-policy crisis in 2021–2022.
    data:
      items:
        - date: '2013'
          label: Founded in Paris
          detail: Yazdi and Ritter found Voodoo to build consumer mobile products.
          tone: positive
        - date: '2016'
          label: Paper.io hits
          detail: First major product success validates rapid-prototyping model.
          tone: positive
        - date: 2018-05
          label: Goldman Sachs $200M investment
          detail: Largest French tech fundraising since 2015; founders retain control.
          tone: positive
        - date: 2020-08
          label: Tencent minority stake
          detail: Undisclosed amount at $1.4B valuation; opens APAC distribution.
          tone: positive
        - date: 2021-07
          label: GBL EUR 266M at EUR 1.7B
          detail: Third major investor; last confirmed public equity valuation marker.
          tone: positive
        - date: 2021–2022
          label: Apple ATT crisis; revenues halved
          detail: Hyper-casual model collapses; leverage spikes to 70x; major restructuring.
          tone: warning
        - date: '2023'
          label: Hybrid-casual turnaround
          detail: Mob Control and new titles restore growth; revenue reaches EUR 520M+.
          tone: positive
        - date: 2024-06
          label: BeReal acquired for EUR 500M
          detail: Social app with 40M users; loss-making at acquisition; brought to break-even within months.
          tone: neutral
        - date: 2024-12
          label: EUR 623M revenue; EUR 135M EBITDA
          detail: Record annual results; 20% growth; 950M downloads.
          tone: positive
        - date: 2025-04
          label: EUR 220M debt refinanced
          detail: TLB repaid; new structure extends maturities to 2029–2030; Fitch withdraws rating.
          tone: positive
        - date: 2025-12
          label: $778M revenue; 169M MAU
