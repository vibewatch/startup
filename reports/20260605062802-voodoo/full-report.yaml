      - number: '1.3'
        title: Funding history, investors, and debt structure
        blocks:
          - type: paragraph
            body: >
              Voodoo has raised over $800 million in disclosed equity across three major rounds, plus a leveraged debt
              tranche, making it one of the most heavily financed French technology companies outside the frontier-AI
              cohort. The first major round came in May 2018 when Goldman Sachs invested approximately $200 million
              through its West Street Capital Partners VII fund, which was the largest fundraising in the French
              technology sector since 2015. Yazdi and Ritter retained majority control following this investment.


              In August 2020, Tencent became a minority shareholder at an undisclosed investment amount; the round
              valued Voodoo at $1.4 billion. The Tencent partnership also opened Voodoo's path into APAC markets,
              particularly for Android distribution channels and Chinese gaming audiences. Voodoo's 2020 revenues were
              approximately €360 million.


              In July 2021, Groupe Bruxelles Lambert (GBL), a Belgian investment holding company, invested €266 million
              in mostly newly-issued preferred shares for a 16% stake at a post-money equity valuation of €1.7 billion.
              GBL joined Goldman Sachs and Tencent as the key minority investors, with the founders retaining control.


              On the debt side, Voodoo issued a €220 million term loan B (TLB) that Fitch rated 'B' and later fully
              repaid in 2025 using a combination of available cash and €179 million in new loans. The April 2025
              refinancing extended debt maturities to 2029–2030 and improved the company's financial flexibility. Voodoo
              secured over €175 million in total refinancing from a consortium of banks and institutional partners.
              Total disclosed funding (equity plus debt) exceeds $1 billion; the exact current cap table percentages and
              the full terms of the BeReal acquisition earnout are not publicly disclosed.
