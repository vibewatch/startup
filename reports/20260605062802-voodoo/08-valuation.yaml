    - Voodoo announced BeReal acquisition for €500M
    - Sets a hard capital-allocation hurdle inside Voodoo
    - Deal consideration mix and earnout
  - - User scale
    - Official >40M active users at acquisition versus lower external/statistical estimates
    - Upside if durable; haircut if inflated or declining
