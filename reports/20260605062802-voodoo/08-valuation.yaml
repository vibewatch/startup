- id: bereal-option-value-and-downside
  title: BeReal option value and downside
  body: 'BeReal is the largest swing factor in Voodoo''s valuation. Officially, Voodoo bought BeReal for €500 million in June 2024 and described more than 40 million active users plus strategic synergies from product, growth, and infrastructure. Independent and later reporting is more cautious: Sifted says BeReal had been loss-making with a declining user base before acquisition, was break-even after Voodoo''s cost and monetization work, and had stable rather than accelerating users; TechCrunch framed the sale as BeReal''s best-case exit; Business of Apps reports fluctuating user and revenue estimates. The upside case is that Voodoo converts a large Gen Z social graph into a profitable ad product without destroying authenticity. The downside case is that the asset becomes a low-growth, low-attention social network with regulatory baggage. noyb''s complaint that BeReal repeatedly nudged users toward advertising-tracking consent, and Lewis Silkin''s legal commentary on the same dark-pattern
    allegation, are genuine adverse sources because they connect monetization directly to privacy trust and potential enforcement risk.'
