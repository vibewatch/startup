- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Evidence support
  - What would change the view
  rows:
  - - Thesis - scaled profitable publisher
    - 2024 revenue EUR623M and EBITDA EUR135M with 950M downloads
    - Audited 2025 revenue and EBITDA bridge
  - - Thesis - mix shift improves quality
    - Hybrid/casual pivot and older games contribute most revenue
    - Title-level cohort retention and LTV files
  - - Thesis - shareholder mark supports value
    - GBL 14.8% stake marked at EUR316M in 2026
    - GBL methodology and minority/illiquidity adjustments
  - - Anti-thesis - leverage still constrains
    - Fitch B rating and refinancing dependence despite improved flexibility
    - Net debt schedule and covenant package
  - - Anti-thesis - BeReal may be flat option
    - Break-even and stable users are useful but not growth proof
    - DAU/MAU, ad load, ARPDAU, churn cohorts
  - - Anti-thesis - privacy monetization risk
    - noyb complaint attacks BeReal ad-consent flow
    - CNIL status and consent-remediation evidence
  notes: Rows intentionally preserve contrary evidence rather than netting the thesis to a single score.
