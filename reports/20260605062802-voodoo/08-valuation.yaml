  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: Current cap table, option pool, liquidation preferences, investor rights, and any secondary pricing.
    whyItMatters: Equity valuation and return underwriting can change materially after debt, preference, and dilution adjustments.
    diligencePath: Request the fully diluted cap table, financing documents, and latest board-approved 409A or shareholder mark.
    relatedQuestionRefs:
    - QV026
    - QV028
  - type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: 2025 audited revenue split by ads, in-app purchases, games, BeReal, Wizz, Jamble, and top titles.
    whyItMatters: Multiple selection depends on whether revenue is durable hybrid-casual IAP, volatile advertising, or still-unproven social-app monetization.
    diligencePath: Obtain audited revenue schedule and monthly management accounts by product family.
    relatedQuestionRefs:
    - QV027
  - type: missing-source
    severity: material
    topic: exit-readiness
    missingEvidence: Board minutes, IPO-readiness plan, buyer universe analysis, and investor-rights / governance documents.
    whyItMatters: Exit path and governance rights determine liquidity discount and minority-investor control protections.
    diligencePath: Review board packs, investor-rights agreement, and banker or strategic-buyer materials.
    relatedQuestionRefs:
    - QV025
  - type: conflicting-data
    severity: material
    topic: BeReal-metrics
    missingEvidence: Reconciled BeReal DAU, MAU, retention, revenue, ad load, and contribution margin after acquisition.
    whyItMatters: BeReal is the largest swing factor and public sources differ between official active-user claims and independent usage estimates.
    diligencePath: Pull BeReal product analytics, cohort tables, advertiser pipeline, and post-acquisition P&L.
    relatedQuestionRefs:
    - QV020
    - QV021
    - QV027
  - type: enumeration-incomplete
    severity: minor
    topic: comparable-valuation-table
    missingEvidence: Full live public-company trading multiples and private secondary marks as of the exact investment date.
    whyItMatters: The public-comp table is a representative sample and market values can move materially before pricing.
    diligencePath: Refresh comp sheet from Capital IQ, FactSet, or PitchBook immediately before IC.
    relatedQuestionRefs:
    - QV014
    - QV029
    relatedTableRefs:
    - TV004
