- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Probability signal
  - Assumptions
  - Indicative valuation logic
  - Downside or upside trigger
  rows:
  - - Bull
    - Evidence upgrades
    - 2025 sales near EUR689M or higher, EBITDA margin expands, BeReal grows profitably
    - 4.0x-5.0x revenue or 16x-20x EBITDA could justify premium
    - Trigger is audited growth plus BeReal contribution margin
  - - Base
    - Mixed public record
    - Revenue scale and profitability persist but BeReal remains stable and leverage still matters
    - 3.0x-4.0x revenue or 12x-16x EBITDA supports low-to-mid EUR2B EV
    - Trigger is clean accounts and sub-4x leverage
  - - Bear
    - Adverse execution or regulatory path
    - BeReal stagnates, privacy enforcement worsens, or portfolio concentration returns
    - 1.5x-2.5x revenue or 8x-10x EBITDA compresses value below recent marks
    - Trigger is user churn or covenant pressure
  - - No-deal
    - Evidence gap persists
    - Seller asks for platform multiple without private proof
    - Price cannot be underwritten
    - Trigger is refusal to provide cap table and debt package
  notes: Scenario ranges are illustrative lenses derived from observable revenue/EBITDA and comparable categories, not a DCF.
