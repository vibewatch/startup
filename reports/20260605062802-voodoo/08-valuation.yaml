- id: financing-valuation-and-balance-sheet-context
  title: Financing, valuation, and balance-sheet context
  body: 'The observable financing record has three usable valuation anchors but no complete cap table. First, GBL invested €266 million in 2021 for a 16% minority stake, an implied post-money equity value of roughly €1.66 billion before later dilution, debt, or option effects. Second, GBL reports a 14.8% stake and €316 million portfolio value at March 31, 2026, which mechanically implies an equity look-through of about €2.14 billion, but this is a shareholder NAV mark rather than a transaction price. Third, Clay reports over $570 million disclosed funding and an approximate $2.6 billion current valuation, while PremierAlts exposes only a gated secondary-market profile and therefore should be treated as weak corroboration. Fitch''s credit lens is equally important: Voodoo repaid a €220 million term loan B with cash and new loans, extended maturities to 2029-2030, remained rated B before withdrawal, and was constrained by small scale, opportunistic M&A, competition, and platform concentration.
    That makes enterprise-value math debt-sensitive and makes preferred terms, cash balance, and refinancing documents mandatory diligence inputs.'
  claimRefs:
  - CV011
  - CV012
  - CV013
  - CV014
  - CV015
  - CV016
