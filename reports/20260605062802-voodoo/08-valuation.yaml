- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Diligence path
  rows:
  - - Audited accounts
    - 2024 and 2025 income statement, EBITDA bridge, and cash-flow statement
    - Converts public revenue headlines into underwritable EBITDA and FCF
    - Request audited financials and management QoE
  - - Debt and preferences
    - Net debt, maturity, covenants, liquidation preferences, and option pool
    - Determines equity value and downside protection
    - Review loan agreements and cap table
  - - Revenue mix
    - Ads, IAP, social apps, Jamble/Wizz/BeReal, and top-title concentration
    - Drives multiple selection and durability
    - Obtain monthly revenue by product and title
  - - BeReal cohorts
    - DAU/MAU, retention, ad load, ARPDAU, churn, and country mix
    - Largest swing factor in valuation
    - Pull product analytics export and advertiser pipeline
  - - Regulatory/privacy
    - Status of CNIL/noyb/consent remediation and DSA obligations
    - Monetization could be constrained by privacy enforcement
    - Counsel review and regulator correspondence
  - - Exit readiness
    - IPO timing, buyer universe, board controls, and reporting cadence
    - Determines liquidity discount and governance risk
    - Review board pack, investor rights, and exit plan
  notes: These asks are material because the public record is sufficient for direction but insufficient for final pricing.
