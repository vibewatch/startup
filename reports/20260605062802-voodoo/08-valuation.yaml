- id: scenarios-triggers-and-diligence-asks
  title: Scenarios, thesis-break triggers, and final diligence asks
  body: 'The base case is not that Voodoo is cheap; it is that Voodoo is a good private asset whose fair price depends on evidence still withheld from public sources. A bull case requires audited 2025 revenue near the GBL/third-party trajectory, sustained double-digit EBITDA margin, deleveraging below Fitch''s sub-4x expectation, BeReal user stabilization with positive contribution margin, and no fresh privacy enforcement. A bear case emerges if BeReal remains flat, the hybrid-casual portfolio reverts to hit-driven volatility, or refinancing documents reveal heavy preference, covenants, or cash leakage. The key diligence asks are therefore not cosmetic: audited 2024-2025 accounts, net debt and cash, revenue split by ads/IAP/social apps, top-title concentration, BeReal DAU/MAU and ARPDAU, studio-partner economics, option pool, liquidation preferences, and board/governance rights. Without those inputs, the correct conclusion is to preserve upside optionality but avoid paying a full platform
    multiple.'
  claimRefs:
