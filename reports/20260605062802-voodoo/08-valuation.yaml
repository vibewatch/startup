  title: Recommendation summary table
  columns:
  - Decision element
  - Current stance
  - Evidence basis
  - Investment implication
  rows:
  - - Recommendation
    - Track / research-more
    - Public scale and profitability are strong but private valuation and cap table are opaque
    - Do not issue buy without audited 2025 accounts and entry price
  - - Confidence
    - Medium
    - Multiple independent sources corroborate scale but several critical inputs remain private
    - IC can form a view but not a binding price
  - - Risk rating
    - High
    - Fitch B rating, privacy complaints, platform concentration, and BeReal integration risk remain material
    - Require downside-protection terms
  - - Valuation stance
    - Fair-to-stretched
    - GBL look-through and Clay estimate cluster around low-to-mid EUR/USD 2B while EBITDA lens is lower
    - Avoid platform-like premium unless BeReal proves durable
  - - Decision rule
    - Price-sensitive entry
    - Conservative revenue and EBITDA lenses diverge materially
    - Invest only with valuation discount or evidence upgrades
  notes: Estimates combine official company, shareholder, credit-rating, and public-comparable data; they are not a priced term sheet.
