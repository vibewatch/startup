  - id: portfolio-concentration-risk
    title: Hit-driven portfolio concentration and competitive execution risk
    body: >-

      Despite the strategic pivot toward hybrid-casual franchises, Voodoo's revenue base retains meaningful
      concentration risk in a limited number of successful titles. Fitch stated plainly that "the video game
      industry is inherently hits-driven, which increases the volatility of cash flows." Mob Control, Paper.io,
      and Block Jam are the most visible flagship games in the public record, but per-title contribution
      margins, revenue share across the portfolio, and dependence on the top three or five titles are not
      disclosed. Voodoo's claim that 80% of 2024 revenue came from games active for over two years reduces
      but does not eliminate title-concentration risk: the same handful of franchises carry the reported
      durability metric.

      The competitive environment in mobile gaming is fragmented and low-barrier. Fitch characterized competition
      as "fierce" with "low barriers to entry," and Voodoo as third by downloads in the global market with
      limited overall market share. Rivals including Supercell (€2.8 billion revenue in 2024, 300 million MAUs)
      and Zynga (acquired by Take-Two for $12.7 billion) operate at meaningfully larger scale and benefit from
      platform-holder relationships, franchise IP libraries, and diversified genre exposure. Voodoo's shift
      into "pure casual" games — which Yazdi described as capable of generating up to €1 billion per game —
      is aspirational but unproven at the company's scale. Execution against this roadmap requires sustained
      development investment, studio talent retention, and creative hit rate, all of which lack independent
      public verification.

      Partner-studio concentration also presents a downside scenario: Voodoo's publishing platform relies on
      an external supply of prototypes from 150+ studios, and the economics of revenue share, IP ownership,
      and studio exclusivity are not publicly disclosed. If leading studios divert better prototypes to competing
      publishers offering more favorable terms, or if the hit rate in hybrid-casual declines due to market
      saturation, the publishing engine could slow meaningfully.
