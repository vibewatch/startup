  - id: financial-leverage-risk
    title: Financial leverage, capital structure, and credit risk
    body: >-
      Voodoo operates under a leveraged capital structure rated 'B' by Fitch. At end-2022, when the ATT shock
      compressed margins, Fitch-defined leverage reached 70x — effectively a near-distressed ratio. The company
      has deleveraged organically since, reaching 4.8x at end-2024. In October 2024, Fitch placed the ratings
      on Rating Watch Negative, citing refinancing risk from the EUR220 million term loan B and revolving
      credit facility scheduled to mature in November 2025 and May 2025, respectively. By June 2025, Fitch
      affirmed the 'B' rating with Stable Outlook after Voodoo completed the refinancing — repaying the EUR220
      million TLB with a combination of EUR101 million cash on hand and EUR179 million in new loans with final
      maturities extended to 2029–2030. Fitch simultaneously withdrew all ratings for commercial reasons.

      Despite the successful refinancing, material financial risk remains. Fitch's positive sensitivity required
      leverage to remain below 4x through 2025–2026, a threshold the company can meet under the base case
      but which is sensitive to BeReal performance. The EBITDA scale is small: Fitch estimated EUR 63 million
      of EBITDA and EUR 14 million of FCF in 2024 — modest cushion against unexpected working-capital outflows,
      earn-out payments on past acquisitions, or a renewed ad-revenue shock. Fitch projected FCF of 3% of
      revenue in 2025, supported by low capex but partly offset by high interest payments on the remaining
      debt. The company's aggressive and opportunistic M&A strategy — approximately 20 acquisitions as of 2025
      including Beach Bum ($300 million) and BeReal (€500 million) — represents an ongoing leverage risk if
      further large acquisitions are funded with debt rather than equity.

      No reviewed public source discloses cash on hand post-refinancing, the detailed debt amortization
      schedule, earn-out obligations from past acquisitions, or whether any financial covenants are at risk
      of breach. The company's management disclosures remain below public-company standards; Voodoo's CEO
      stated a five-year IPO horizon, suggesting audited public-company reporting is several years away.
