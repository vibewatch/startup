  - id: governance-key-person-risk
    title: Governance opacity, key-person dependency, and disclosure risk
    body: >-
      Voodoo operates as a private company under the legal entity Stan Holding SAS, with founders Alexandre
      Yazdi and Laurent Ritter retaining majority control. No reviewed public source discloses the composition
      of Voodoo's board of directors, the names of any independent directors, the existence of an audit
      committee, or any formal governance policies. This opacity is consistent with a private, founder-led
      company, but it is a material diligence gap at Voodoo's scale ($778 million in 2025 revenue) and given
      its public debt history. Investors and creditors relying on this report should treat Voodoo as having
      governance risk commensurate with a concentrated-ownership private company rather than a publicly
      governed one.

      Key-person dependency on CEO Alexandre Yazdi is a primary execution risk. Yazdi is identified as the
      primary architect of both the hyper-casual era and the subsequent transformation to hybrid-casual and
      social apps. His personal public communications are the most prominent disclosure channel for strategic
      direction. Maddyness reported in May 2026 that Yazdi took majority personal control of DC Company,
      the French digital media group owning Konbini and Le Gorafi, representing a personal investment
      commitment concurrent with leading a $778 million revenue business through a critical integration and
      transformation phase. While Yazdi is not leaving Voodoo, the personal outside investment signals a
      broadening attention scope that is a legitimate governance concern. No formal succession plan is publicly
      disclosed. Voodoo's CEO acknowledged that the company is "talking more about a five-year horizon" for
      an IPO, which means the current level of governance and disclosure is unlikely to improve materially
      in the near term.
