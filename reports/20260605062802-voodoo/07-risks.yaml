      - - CEO outside investment (DC Company / Konbini / Le Gorafi acquisition, May 2026)
        - Yazdi personally acquired majority of DC Company media group while leading Voodoo through BeReal
            integration and transformation
        - Realized — outside investment is confirmed; attention-dilution risk is present
        - Medium — personal investment is separate from Voodoo operations, but management bandwidth
            is finite during a critical period
        - No evidence that Yazdi is reducing Voodoo operational involvement; DC Company management team
            retained (Geoffrey La Rocca)
        - Confirm Yazdi time-allocation commitment to Voodoo; assess board policy on CEO outside investments
      - - BeReal leadership (Aymeric Roffé as CEO of BeReal)
        - Roffé installed post-acquisition; BeReal co-founder Alexis Barreyat departed; leadership
            continuity at BeReal is critical for user trust and product roadmap
        - Unknown — no adverse public signal on Roffé retention; but no independent assessment of BeReal
            team stability
        - High — key leader departure from BeReal during a critical monetization ramp would signal
            product instability and impair talent retention
        - Aymeric Roffé previously ran Wizz; has Voodoo-internal experience; continuity so far
        - Request BeReal leadership retention data; assess option/incentive package tied to BeReal MAU
            and revenue targets
      - - Board composition and independent governance
        - No public disclosure of board members, independent directors, audit committee, or governance
            framework
        - Permanent gap under current private-company structure
        - High — absence of independent oversight amplifies risk of undisclosed related-party transactions,
            financial misstatement, and strategic misjudgment
        - Investor consortium (Goldman, Tencent, GBL) presumably holds board seats as minority
            shareholders; no confirmation
        - Request board composition, director independence assessments, audit committee charter, and
            any related-party transaction disclosures
    notes: >-
      Likelihood and severity assessments reflect the public evidence record only; internal Voodoo HR or
      governance documents were not reviewed. CEO outside investment is factual (confirmed by Maddyness
      May 2026). Board composition is a documented gap — no public source names any director.
    claimRefs:
      - CR030
      - CR031
      - CR032
      - CR040

  - id: TR005
    title: Mitigation and kill criteria
    columns:
      - Risk
      - Monitorable trigger
      - Threshold / event
      - Action implication
    rows:
      - - BeReal MAU resumption of decline after stabilization
        - Monthly active users and daily active users — trackable via Sensor Tower, Business of Apps, or
            company disclosures
        - MAU falls below 25M for two consecutive months, or DAU falls below 1.5M
        - Impairs €500M acquisition thesis; triggers downgrade of BeReal EBITDA contribution; diligence
            ask for weekly cohort dashboard from management
      - - BeReal revenue missing Fitch break-even assumption
        - Quarterly or semi-annual revenue disclosures vs. Fitch base case of break-even in 2025
        - BeReal revenue remains below $2M/month in H2 2025 or turns negative
        - Leverage rises above Fitch negative sensitivity (>4x); potential rating action if Fitch coverage
            resumed; downgrade investment thesis
      - - Regulatory enforcement action (CNIL re-investigation, FTC COPPA consent decree, DSA fine)
        - CNIL press releases, FTC enforcement database, EU DSA enforcement register
        - Any new enforcement action with financial penalty or required operational change against Voodoo
            or BeReal
        - Fine and remediation costs compress EBITDA; operational change may reduce ad revenue; reassess
            compliance program; escalate diligence urgency
      - - App Store / Play Store policy shock affecting rewarded video or SDK data collection
        - Apple and Google developer news pages, App Store Review Guidelines changelog
        - Any policy update materially restricting rewarded interstitial ads, SDK data collection, or
            IAP fee structure
        - EBITDA margin compression across portfolio within one to two quarters; re-underwrite revenue
            mix assumptions
      - - Leverage rises above 5x or covenant breach
        - Fitch-analog EBITDA leverage (debt/EBITDA); management reported quarterly
        - Leverage exceeds 5x for two consecutive reporting periods; any covenant waiver request or
            credit-agreement amendment
        - Refinancing risk resurfaces; cost of capital rises; M&A capacity constrained; liquidity
            review mandatory
      - - CEO Yazdi departure or incapacity
        - Public announcements, leadership changes, LinkedIn, company press releases
        - Announcement of CEO change, extended leave, or departure of Laurent Ritter as co-founder
        - High-severity execution risk; immediate succession-plan review; reassess transformation-
            thesis confidence
      - - Data breach involving BeReal user data or Voodoo ad-network credentials
        - Regulatory filings (CNIL 72-hour notification), press reports, HaveIBeenPwned, security
            researchers
        - Any publicly confirmed breach of PII, photo data, or advertiser credentials
        - GDPR notification triggers CNIL investigation; advertiser trust impact; potential class-action;
            significant remediation cost
    notes: >-
      Thresholds are research-derived estimates based on Fitch analysis, BeReal user-trajectory data, and
      standard leverage covenant conventions. Internal Voodoo covenant thresholds and MAU management targets
      are not publicly disclosed. These triggers should be validated against actual debt covenants and
      management KPIs during private diligence.
