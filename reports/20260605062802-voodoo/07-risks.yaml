company:
  name: Voodoo
chapter:
  number: 7
  title: Risks
  summary: >-
    Voodoo's material risk profile in 2026 clusters around six themes: (1) a confirmed CNIL privacy enforcement
    action and ongoing EU/US children's-data regulatory pressure with expanding scope and fines; (2) structural
    dependence on Apple App Store and Google Play for distribution and on programmatic advertising networks for
    revenue, amplified by Apple ATT signal loss; (3) BeReal integration execution risk — the asset was acquired
    loss-making for €500 million and remains below its IPO-grade monetization threshold despite break-even;
    (4) financial leverage still rated 'B' and constrained by small EBITDA scale, though Fitch affirmed Stable
    following a June 2025 refinancing that extended maturities to 2029–2030; (5) hit-driven mobile-game
    economics that, despite the shift to hybrid-casual, still expose revenues to portfolio concentration; and
    (6) governance opacity — no independent board or audit committee has been publicly disclosed, and CEO
    Yazdi has recently expanded personal outside investments. Most adverse signals are
    evidenced; the main private diligence gaps are BeReal post-acquisition cohort data, per-title unit
    economics, cyber/incident history, and board/governance documents.

sections:
  - id: legal-regulatory-risk
    title: Legal, privacy, and data-regulation risk
    body: >-
      Voodoo carries one confirmed regulatory adverse action in its public record: the CNIL imposed a €3 million
      fine on December 29, 2022, for using the IDFV (Identifier for Vendors) to track users across its mobile
      games for advertising purposes without their consent after they had declined tracking via Apple's ATT
      prompt. The company was ordered to fix its consent mechanism within three months or face €20,000 per day
      in additional penalties. By July 13, 2023, CNIL closed the injunction after finding Voodoo had deployed
      a compliant consent window — but expressly reserved the right to re-examine compliance at any time. This
      creates a latent re-investigation risk at the publisher level across all Voodoo-labeled titles and any
      partner-studio apps that share the same SDK consent flow. The fine demonstrates a documented history of
      non-compliant data collection and cannot be dismissed as a clean slate.

      Looking forward, the regulatory exposure expands significantly in 2026. The FTC's amended COPPA rule
      took full legal effect on April 22, 2026, imposing separate opt-in parental consent for targeted
      advertising and any third-party data sharing from children's data. Voodoo's portfolio of hyper-casual
      and hybrid-casual mobile games includes many titles whose visual style and mechanics attract players under
      13. Bloomberg Law reported that third-party vendor relationships are a priority enforcement area, because
      both the company collecting data and its analytics/advertising SDK partners face liability. Voodoo's
      centralized ad operations integrate dozens of third-party SDK providers across 150+ partner studios,
      creating a large compliance perimeter. FTC fines can reach $51,744 per violation per day under the
      revised rule.

      In the EU, the Digital Services Act transparency-reporting regime reached full enforceability in July
      2025. Platforms hosting user-generated content or user-to-user interaction — including BeReal and any
      Voodoo game with chat, social, or community features — must publish DSA transparency reports annually,
      maintain notice-and-action mechanisms, and implement child-safety measures under DSA Article 28. Tremau
      reported that over 100 enforcement actions were taken against EU platforms in 2025 alone, and in January
      2026 the Netherlands ACM launched an investigation into Roblox for minor-safety risks — signaling that
      gaming platforms are no longer exempt from DSA enforcement. No reviewed source confirms that Voodoo or
      BeReal has filed a DSA transparency report or appointed an EU legal representative, which are baseline
      compliance obligations. The DSA non-compliance penalty ceiling is 6% of global annual turnover.
