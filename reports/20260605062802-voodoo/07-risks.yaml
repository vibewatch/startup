  - id: kill-criteria-and-monitoring
    title: Monitoring triggers and thesis-break events
    body: >-
      Materialization of any single risk examined in this chapter need not be fatal to the investment
      thesis, but several combinations represent thesis-break scenarios that would fundamentally alter the
      risk-return profile. The most consequential single event would be a resumption of BeReal's MAU decline
      following stabilization, because this would simultaneously impair the €500 million acquisition
      rationale, increase advertising-revenue volatility, and potentially drive a Fitch-analog downgrade if
      the BeReal EBITDA drag widens. The second-highest-severity event is a major regulatory enforcement
      action — a new CNIL investigation, an FTC COPPA consent decree, or a DSA fine — which would impose
      both financial penalties and remediation costs across the full partner-studio network.

      Platform policy shocks (a material change to Apple App Store rewarded-video policies, ATT expansion
      to all app categories, or a Google Play developer-fee increase) would compress EBITDA margins across
      the portfolio within one to two quarters. Financial leverage deterioration — leverage rising back above
      5x following an unplanned acquisition or a large settlement — would put the new debt covenants at risk
      given the company's small EBITDA scale.

      CEO departure or material reduction in Yazdi's operational involvement would be an execution risk of
      the highest order, given the absence of a disclosed successor and the founder's centrality to the
      transformation strategy. Finally, a data breach or cybersecurity incident involving BeReal's user data
      or Voodoo's ad-network data would trigger both regulatory investigation and reputational damage at a
      moment when the company is seeking to establish advertiser trust for its social-app business.

      Monitoring indicators for each scenario are detailed in the kill criteria table. Diligence asks
      include: (a) BeReal monthly cohort dashboard post-acquisition, (b) board composition and governance
      documentation, (c) COPPA and DSA compliance program details, (d) per-title unit economics for top-5
      games, (e) current debt schedule and covenant terms, (f) Yazdi time-allocation commitments.
