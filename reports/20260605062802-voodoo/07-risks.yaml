  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      Platform and regulatory risks are upstream transmission nodes; they flow into revenue compression,
      then into EBITDA leverage deterioration, and ultimately into financing risk and valuation impairment.
      BeReal is a parallel risk path that feeds advertising revenue volatility directly into the leverage
      calculation.
    data:
      nodes:
        - id: att_platform
          label: Apple ATT / Play Store policy
          detail: Structural platform dependency — policy changes compress ad targeting, UA efficiency, and IAP
              mechanics portfolio-wide
          tone: risk
        - id: regulatory
          label: Regulatory enforcement (CNIL / FTC COPPA / DSA)
          detail: Direct financial penalties, operational consent changes, and Trust & Safety cost escalation
          tone: risk
        - id: bereal_users
          label: BeReal user trajectory
          detail: MAU stabilized at ~30M; re-engagement rate 19%; any resumed decline removes monetization
              foundation
          tone: risk
        - id: ad_revenue
          label: Advertising revenue (games + BeReal)
          detail: Voodoo's largest single revenue pool; combines in-game ads and BeReal brand advertising
          tone: neutral
        - id: iap_revenue
          label: IAP / in-app purchase revenue
          detail: 45% of 2024 revenue; less volatile; partially buffers ad-market exposure
          tone: positive
        - id: ebitda
          label: EBITDA and FCF
          detail: EUR 63M Fitch-defined EBITDA in 2024; FCF EUR 14M; small cushion against adverse events
          tone: neutral
        - id: leverage
          label: Debt leverage (4.8x end-2024)
          detail: Fitch-rated B; negative sensitivity at 4.0x; refinanced to 2029–2030 maturities
          tone: neutral
        - id: portfolio_concentration
          label: Hit-driven portfolio concentration
          detail: Revenue concentrated in Mob Control, Paper.io, Block Jam; no per-title disclosure
          tone: risk
        - id: governance
          label: Governance opacity / CEO key-person
          detail: No independent board; no succession plan; CEO personal outside investments
          tone: risk
        - id: investment_thesis
          label: Investment thesis and valuation
          detail: B-rated private company; 5-year IPO horizon; €1.7B equity value last disclosed
          tone: neutral
      edges:
        - from: att_platform
          to: ad_revenue
          label: CPM and targeting signal compression
        - from: att_platform
          to: iap_revenue
          label: UA cost inflation reduces payback on new users
        - from: regulatory
          to: ad_revenue
          label: Consent changes reduce targetable inventory
        - from: regulatory
          to: ebitda
          label: Fine and remediation cost direct EBITDA drag
        - from: bereal_users
          to: ad_revenue
          label: MAU decline reduces BeReal ad inventory
        - from: ad_revenue
          to: ebitda
          label: Ad revenue is largest EBITDA driver
        - from: iap_revenue
          to: ebitda
          label: IAP provides more stable EBITDA contribution
        - from: portfolio_concentration
          to: ad_revenue
          label: Title-level decline cascades to total ad revenue
        - from: ebitda
          to: leverage
          label: EBITDA decline raises leverage ratio
        - from: leverage
          to: investment_thesis
          label: Leverage >4x triggers Fitch negative sensitivity
        - from: governance
          to: investment_thesis
          label: CEO departure or board weakness impairs strategic execution
    claimRefs:
      - CR005
      - CR006
      - CR008
      - CR009
      - CR027
      - CR033
      - CR036
      - CR037
      - CR038
      - CR043

  - id: FR003
    title: Dependency map — critical external dependencies
    type: dag
    layout: wide
    summary: >-
      Voodoo's operating model depends on a small number of critical external nodes. Apple and Google are
      the two highest-concentration dependencies with no viable substitutes at scale. Programmatic DSPs and
      Meta UA represent revenue-generation critical paths.
    data:
      nodes:
        - id: voodoo_core
          label: Voodoo / Stan Holding SAS
          detail: Paris-based private company; 800+ employees; $778M 2025 revenue; B-rated leveraged entity
          tone: neutral
        - id: apple
          label: Apple App Store
          detail: Sole iOS distribution channel; 30% IAP fee; ATT privacy framework enforcer
          tone: risk
        - id: google_play
          label: Google Play
          detail: Android distribution channel; primary UAC demand; AdMob ad fill; Privacy Sandbox evolution
          tone: risk
        - id: dsp_network
          label: Programmatic DSP network (DV360, Trade Desk, AppLovin MAX)
          detail: 90%+ of digital display spend transacted programmatically; few DSPs control most budgets
          tone: risk
        - id: meta_ua
          label: Meta (Facebook/Instagram UA)
          detail: Dominant paid user-acquisition channel for mobile games; social gaming impression share
          tone: neutral
        - id: bereal_asset
          label: BeReal social platform
          detail: €500M acquisition; 30M MAU; ~$2M/month revenue; break-even claimed but loss-making per Fitch
          tone: risk
        - id: partner_studios
          label: Partner studios (150+)
          detail: External game prototype supply; revenue-share economics undisclosed
          tone: neutral
        - id: fitch_financing
          label: Debt creditors (EUR 179M new loans)
          detail: Post-refinancing debt; maturities 2029–2030; covenants not publicly disclosed
          tone: neutral
      edges:
        - from: apple
          to: voodoo_core
          label: iOS distribution, IAP billing, ATT policy
        - from: google_play
          to: voodoo_core
          label: Android distribution, UAC, AdMob fill
        - from: dsp_network
          to: voodoo_core
          label: Programmatic ad revenue (in-game + BeReal)
        - from: meta_ua
          to: voodoo_core
          label: Paid UA creative campaigns
        - from: bereal_asset
          to: voodoo_core
          label: Social app revenue and strategic diversification
        - from: partner_studios
          to: voodoo_core
          label: Game prototype supply for publishing platform
        - from: fitch_financing
          to: voodoo_core
          label: EUR 179M debt capital; covenant obligations
    claimRefs:
      - CR005
      - CR009
      - CR019
      - CR026
      - CR028
      - CR034
      - CR041

