  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: BeReal cohort data
      missingEvidence: Weekly MAU and DAU cohort dashboard post-acquisition showing user trajectory,
        retention curves, re-engagement, and geographic distribution by market.
      whyItMatters: Public data shows annual download declines of 50–60% and a 19% re-engagement rate;
        a private cohort dashboard is required to assess whether stabilization is durable or temporary,
        and to underwrite the €500M acquisition thesis.
      diligencePath: Request Voodoo's BeReal cohort dashboard reconciled to Sensor Tower and Business
        of Apps trend data; obtain monthly MAU/DAU by market for Jan 2024 – Jun 2026.
      relatedQuestionRefs:
        - QR002
        - QR019
      relatedTableRefs:
        - TR002
    - type: missing-source
      severity: material
      topic: DSA compliance status
      missingEvidence: EU DSA transparency report filing by Voodoo or BeReal; confirmation of legal
        representative appointment; Trust & Safety headcount for BeReal content moderation.
      whyItMatters: 100+ enforcement actions against EU platforms in 2025; DSA fines can reach 6% of
        global turnover (~$47M); compliance status is unconfirmed from public sources.
      diligencePath: Request DSA transparency report (if filed), Ofcom OSA compliance submission (UK),
        and BeReal Trust & Safety organizational chart and tooling.
      relatedQuestionRefs:
        - QR031
        - QR012
      relatedTableRefs:
        - TR001
    - type: missing-source
      severity: material
      topic: governance documentation
      missingEvidence: Board composition, independent director names, audit committee charter,
        related-party transaction disclosures, and any formal governance policy documents for
        Stan Holding SAS.
      whyItMatters: Absence of independent board and audit committee oversight is a material risk at
        $778M revenue scale with an aggressive M&A track record; cannot be assessed from public sources.
      diligencePath: Request board composition documentation, investor rights agreement, and any
        third-party governance review or audit committee report.
      relatedQuestionRefs:
        - QR029
      relatedTableRefs:
        - TR004
    - type: private-evidence-only
      severity: material
      topic: cybersecurity posture
      missingEvidence: SOC 2 or ISO 27001 certification, bug-bounty program, incident-response plan,
        and any historical breach disclosure for Voodoo ad-network data or BeReal user data.
      whyItMatters: BeReal hosts private daily-life photo data for 30M+ users; no public security
        certification or breach history is available; a breach would trigger GDPR/CNIL investigation.
      diligencePath: Request third-party security audit report (SOC 2 Type II or equivalent) and
        historical breach/incident log for Voodoo's ad infrastructure and BeReal platform.
      relatedQuestionRefs:
        - QR032
      relatedTableRefs:
        - TR002
    - type: private-evidence-only
      severity: material
      topic: per-title unit economics and concentration
      missingEvidence: Per-game revenue, contribution margin, IAP vs. ad revenue split, and revenue
        concentration in top 3–5 titles for the hybrid-casual portfolio.
      whyItMatters: Hit-driven economics create concentration risk; without per-title data, the
        durability of the 80%-from-2-year-old-games metric and the degree of top-title concentration
        cannot be underwritten.
      diligencePath: Request game-by-game P&L, top-5 title revenue as share of total, and cohort
        LTV curves for Mob Control, Paper.io, and Block Jam.
      relatedQuestionRefs:
        - QR033
      relatedTableRefs:
        - TR004
