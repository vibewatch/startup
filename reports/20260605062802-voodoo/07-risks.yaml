  - id: bereal-integration-risk
    title: BeReal integration, user trajectory, and monetization risk
    body: >-
      BeReal is Voodoo's largest single acquisition at €500 million, and as of mid-2026 it represents the
      single highest-execution-risk position in the portfolio. The app was acquired in June 2024 with a
      declining user base and a monthly cash burn of $3 million, and had no meaningful monetization in place.
      Social Media Today reported in 2024 that BeReal had approximately 25 million active users and roughly
      10 months of funding remaining before the acquisition provided a lifeline. Independent statistics show
      that BeReal peaked at 73.5 million MAUs in August 2022 and had experienced a sustained decline through
      the acquisition. Annual downloads fell approximately 60% from 2023 to 2024 (from 31.5 million to 12.7
      million) and a further 50% in 2025. The re-engagement rate — tracking users who return after periods
      of inactivity — fell to 19% in 2025, indicating persistent churn.

      Voodoo implemented light advertising and reported BeReal at break-even generating approximately $2
      million per month in revenue by early 2025. Sifted reported that Voodoo CEO Yazdi acknowledged the user
      base "stopped declining to stabilize at 30 million monthly users" as of early 2025. However, Fitch
      explicitly assumed BeReal would remain loss-making in 2025 in its base case, and projected no positive
      EBITDA contribution from BeReal before 2027. This gap between Voodoo's claimed break-even and Fitch's
      financial model represents a material uncertainty.

      BeReal's monetization ceiling is structurally constrained: its authenticity brand is antithetical to
      heavy ad load, and its core dual-camera feature was copied by Snapchat Dual Camera and TikTok Now,
      eroding competitive differentiation. Ivey Business Review characterized BeReal as lacking an obvious
      path to monetization, as both advertising and data sales conflict with its value proposition. The Voodoo
      2025 financial results disclosed only approximately €30 million of social-app revenue against a €500
      million purchase price, implying a sub-2x revenue multiple — acceptable only if sustained user and
      revenue growth materialize. If BeReal's user base resumes decline or if monetization experiments
      (expanded ad load, social commerce, premium features) fail to convert, the acquisition could impair
      Voodoo's balance sheet and strategic focus simultaneously.
