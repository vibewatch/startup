companyProfile:
  summary: >-
    Voodoo is a Paris-based private mobile game publisher and consumer-app company founded in 2013 by Alexandre Yazdi and Laurent
    Ritter. It pioneered the hyper-casual mobile gaming genre, accumulating over 8 billion lifetime downloads, and has since pivoted
    toward longer-lifecycle hybrid-casual games and social apps. The €500 million acquisition of BeReal in June 2024 added a Gen Z
    social network with more than 40 million active users at signing. Backed by Goldman Sachs, Tencent, and GBL, the company generated
    €623 million in 2024 revenue and $778 million in 2025, has been EBITDA-positive since 2017, and employs approximately 800 people
    across 14 countries. Voodoo operates a portfolio of franchise mobile games (Mob Control, Paper.io, Block Jam), a partner
    publishing platform supporting over 150 independent studios, and additional consumer apps including Wizz, Blitz, and Jamble.
  foundedDate: '2013-01-01'
  founders:
    - name: Alexandre Yazdi
      role: CEO
      background: Co-founded Studio Cadet (web and mobile services) in 2012; primary strategy, financing, and product figure at Voodoo.
      claimRefs: [CO001, CO003]
    - name: Laurent Ritter
      role: Co-founder
      background: Co-founded Studio Cadet alongside Yazdi; both retained majority control through major investment rounds.
      claimRefs: [CO001, CO003]
  foundingLocation: Paris, France
  headquarters: Paris, France
  productSummary: >-
    Franchise mobile games monetized via advertising and in-app purchases (Mob Control, Paper.io, Block Jam); a partner publishing
    platform for 150+ independent studios; BeReal social photo-sharing app; and ancillary consumer apps (Wizz, Blitz, Jamble).
  customerFocus: >-
    Mobile gamers globally (primarily casual and hyper-casual players across iOS and Android) and Gen Z social-app users via BeReal;
    B2B relationships with 150+ indie game studios on the partner publishing platform.
  businessModel: >-
    Primarily advertising revenue from free-to-play mobile games (rewarded video, interstitials) supplemented by in-app purchases;
    revenue share from partner studio publishing; nascent social-app ad revenue from BeReal. Monetization is shifting toward a higher
    IAP and social-ad mix as the portfolio moves from hyper-casual to hybrid-casual formats.
  stage: late-stage private
  fundingStatus: >-
    Over $800 million in disclosed equity: Goldman Sachs ~$200 million in May 2018, Tencent minority stake at $1.4 billion valuation
    in August 2020, and GBL €266 million for a 16% stake at €1.7 billion post-money in July 2021. Debt-financed through a leveraged
    term loan structure under Stan Holding SAS, rated B by Fitch (rating subsequently withdrawn); refinanced to maturities
    extending to 2029–2030.
  disclosureProfile: private-disclosed
  claimRefs: [CO001, CO003, CO012, CO013, CO018, CO019, CO020, CO021, CO022, CO023, CO024, CO026]
summary:
  headline: >-
    Voodoo has rare private-company scale and confirmed profitability, but opaque unit economics, B-rated leverage, and an unproven
    BeReal bet make this a track / research-more at any premium multiple.
