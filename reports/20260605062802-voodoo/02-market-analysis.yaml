  evidenceGaps:
    - id: EGM001
      description: >-
        No independent third-party source has published a standalone market size for BeReal's specific niche
        (authenticity-first photo sharing for Gen Z). The proxy social networking app TAM ($98B) overstates
        BeReal's monetizable pool by orders of magnitude. BeReal's MAU discrepancy (40M vs 16M) further
        constrains any demand-side estimate. BeReal's declining downloads and contested engagement metrics
        make a reliable monetization forecast impossible without proprietary cohort data.
      impact: medium
      diligencePath: >-
        Commission a primary-research MAU audit via Sensor Tower or data.ai; obtain CPM rate card from BeReal
        advertising platform; request retention cohort data and France/Japan/US monthly active user breakdown
        in data room.
      relatedQuestionRefs:

    - id: EGM002
      description: >-
        Voodoo's gaming revenue breakdown by genre (hyper-casual vs. hybrid-casual vs. partner platform) is not
        publicly disclosed. Only the 22% hyper-casual revenue share is mentioned; the IAP versus advertising
        revenue split is also undisclosed. This prevents a formal SOM calculation, blocks assessment of partner
        platform economic contribution, and obscures geographic ARPU distribution. Voodoo has not confirmed
        whether the $778M figure includes Wizz, Jamble, or Blitz revenue.
      impact: high
      diligencePath: >-
        Request revenue by genre and by monetization type (IAP vs. advertising) in the data room; cross-check
        against AppMagic revenue tracker for major franchises; request partner platform revenue share separately.
      relatedQuestionRefs:
        - QM006

    - id: EGM003
      description: >-
        No analyst source publishes a total hybrid-casual segment revenue estimate inclusive of both IAP and
        advertising revenue. All cited estimates cover IAP only, understating the total market pool by an
        unknown but potentially significant margin. The $40B casual gaming market figure is Voodoo's own
        framing, partially corroborated by AppMagic/Ripple Reports at $35-38B (IAP only). Voodoo's implied
        1.6-1.9% casual gaming market share is approximate and depends on market definition assumptions.
        Rollic's dominance of Q2 2025 hybrid-casual IAP ($42M vs Voodoo's $10M combined) raises questions
        about competitive positioning that cannot be resolved from public data alone.
      impact: medium
      diligencePath: >-
        Obtain combined IAP plus advertising revenue data from AppMagic or Sensor Tower hybrid-casual reports;
        triangulate against Voodoo's portfolio revenue mix in data room; request CPI benchmarks by franchise.
      relatedQuestionRefs:

    - id: EGM004
      description: >-
        No public source discloses Voodoo's user-acquisition cost per install (CPI) by title or genre, the
        effectiveness of Voodoo's post-ATT SKAdNetwork attribution methodology, or the portfolio-level
        retention rate implied by the 1.5B annual downloads versus 169M MAU ratio. These metrics are central
        to assessing whether Voodoo's UA infrastructure provides durable competitive advantage versus Rollic,
        Homa, and new hybrid-casual entrants.
      impact: medium
      diligencePath: >-
        Request CPI trend data by game franchise, attribution methodology documentation, D1/D7/D30 retention
        by title, and LTV/CPI ratios in the data room. Compare against AppMagic publisher-level analytics.
      relatedQuestionRefs:
        - QM003
        - QM007
        - QM012
