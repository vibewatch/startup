  - id: FM004
    title: Voodoo value chain — from studio concept to monetized user
    type: funnel
    layout: standard
    summary: >-
      Voodoo's publisher model converts studio game concepts into monetized installs through a data-driven
      testing pipeline, scaled user acquisition, and a diversified portfolio monetization stack. Each stage
      narrows from potential to revenue-generating users; the implied retention rate from 1.5 billion annual
      downloads to 169 million MAU (roughly 11%) points to the importance of franchise stickiness in the
      hybrid-casual model.
    data:
      items:
        - label: Studio concept or partner pitch
          value: 100
          detail: >-
            2,000+ games prototyped or evaluated annually across Voodoo's first-party studios and 150+ partner studios.
          tone: neutral
        - label: Testing and analytical gate
          value: 15
          detail: >-
            Voodoo's data-driven testing pipeline identifies viable titles via early KPI screens (D1/D7 retention,
            session length, CPI test). Most prototypes are eliminated at this stage.
          tone: neutral
        - label: Global publishing and user acquisition
          value: 5
          detail: >-
            Titles passing testing receive full UA spend, global distribution, and localization; Voodoo funds UA
            in exchange for revenue share or full ownership.
          tone: positive
        - label: App install (annual download base)
          value: 2
          detail: >-
            1.5 billion downloads in 2025 across all titles; 950 million in 2024. Download base is the top of the
            monetization funnel; most installs do not convert to long-term engaged users.
          tone: positive
        - label: Engaged monthly active user
          value: 1
          detail: >-
            169 million MAU across gaming and social apps in 2025. Implied annual retention of roughly 11% of
            downloads (1.5B installs → 169M MAU). Hybrid-casual franchises drive disproportionate MAU concentration.
          tone: positive
        - label: Monetized user (IAP or ad revenue)
          value: 0.5
          detail: >-
            Exact monetized user count not disclosed. IAP payers are a fraction of MAU; advertising revenue is
            generated by a much broader active user base. IAP payer rate in casual gaming industry-wide is typically
            1–5% of MAU.
          tone: neutral
    approximationNotes: >-
      Values are ordinal funnel weights for visualization only; they do not represent measured conversion rates.
      The details carry source-backed figures. The monetized-user stage value (0.5) reflects industry-standard
      IAP payer rates for casual gaming and is not a Voodoo-specific disclosed metric.
    claimRefs:
      - CM022
      - CM023
      - CM037
      - CM025
      - CM026

callouts:
  - id: callout-1
    type: evidence-gap
    title: BeReal MAU discrepancy unresolved
    body: >-
      Voodoo and TechCrunch cited 40 million monthly active users for BeReal as of April 2025. External analytics
      sources including Online Optimism placed the figure at approximately 16 million at the same period, and
      Business of Apps estimated only 2.93 million daily active users. This 2.5x range in MAU figures has not
      been reconciled in any public source and is the most material quantitative gap for assessing BeReal's
      advertising inventory and monetization potential.
    claimRefs:
      - CM015
      - CM031

  - id: callout-2
    type: evidence-gap
    title: Voodoo gaming revenue not disclosed by genre
    body: >-
      No public source discloses Voodoo's revenue split between hyper-casual, hybrid-casual, and partner platform
      titles. The 22% hyper-casual revenue share mentioned by Voodoo is the only disclosed segment ratio. This
      prevents a formal SOM calculation for the hybrid-casual segment and limits visibility into the profitability
      profile of the portfolio transition.
    claimRefs:
      - CM006
      - CM013


