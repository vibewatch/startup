figures:
  - id: FM001
    title: Market sizing pyramid — Voodoo addressable layers
    type: pyramid
    layout: standard
    summary: >-
      Nested market layers from the global mobile gaming TAM to Voodoo's actual 2025 gaming revenue, passing through
      casual gaming SAM and hybrid-casual sub-segment. Each layer is bounded by a different analyst methodology;
      the SOM proxy is derived from company-reported gaming revenue and not a formal market-share estimate.
    data:
      items:
        - label: Global mobile gaming TAM (2025)
          value: $126–165B
          detail: >-
            Range across Statista/manataz ($126B, IAP-only) to GMI/ResearchAndMarkets ($165B, broader scope);
            Precedence Research midpoint $143.96B most cited.
          tone: neutral
        - label: Casual mobile gaming SAM (2025)
          value: ~$35–40B
          detail: >-
            AppMagic/Ripple Reports estimate $35–38B casual IAP; Voodoo CEO Yazdi cited ~$40B inclusive of
            advertising revenue, "deeper and more resilient" versus older narrow definitions.
          tone: positive
        - label: Hybrid-casual sub-segment (2025)
          value: ~$9.8B (IAP)
          detail: >-
            Fastest-growing casual sub-tier per Ripple Reports; 37% YoY growth in 2024; forecast $12.5B in 2026.
            Excludes advertising revenue alongside IAP, which would increase total pool.
          tone: positive
        - label: Voodoo gaming revenue (2025, SOM proxy)
          value: $653M
          detail: >-
            Company-reported 2025 gaming revenue (90% of $778M total); implies ~1.6–1.9% of casual gaming IAP market.
            Not a formal SOM; genre revenue breakdown not disclosed.
          tone: neutral
    approximationNotes: >-
      Layers are not additive; each narrows the prior. The hybrid-casual IAP figure excludes advertising revenue
      flowing through the same titles; including advertising revenue would widen the sub-segment figure. Voodoo's
      SOM proxy uses gaming revenue only and does not include partner platform revenue share.
    claimRefs:
      - CM008
      - CM009
      - CM001
      - CM002
      - CM013

