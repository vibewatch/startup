  - id: section-3
    title: Buyer, user, and payer segmentation
    body: >
      Voodoo's business involves three distinct buyer-user-payer configurations across its market segments, each
      with different budget ownership, adoption triggers, and monetization mechanics.


      In hyper-casual and hybrid-casual gaming, the end-user and consumer payer are the same person — a mobile
      consumer who installs a free-to-play title and may purchase in-app items, or who passively generates
      advertising revenue by consuming ad impressions. However, the immediate revenue counterparty for Voodoo in
      ad-monetized titles is the mobile performance advertiser or demand-side platform bidding on Voodoo's ad
      inventory — primarily other game publishers seeking to acquire users, plus non-gaming brands. This makes
      ad monetization a B2B2C revenue structure while IAP monetization is a direct B2C transaction.


      For Voodoo's partner publishing platform, which supports over 150 independent studios, the buyer is the
      studio seeking publishing infrastructure and user-acquisition capital. Studios surrender a revenue share
      in exchange for Voodoo's analytical testing pipeline, global UA capability, and distribution reach. The
      budget owner is the studio founder or indie team; the adoption trigger is the need for global distribution
      at a UA cost Voodoo can absorb through portfolio-level optimization. This segment does not carry a
      separately disclosed revenue line.


      For BeReal, the primary paying counterparty as of 2025 is the brand advertiser seeking access to BeReal's
      Gen Z user base through contextually authentic placements. The end-user — a Gen Z consumer — is both
      audience and content creator. BeReal launched its US advertising platform in April 2025, citing 40 million
      monthly active users and 5 million in the United States specifically. The platform's format constraints
      (dual-camera simultaneous capture, no editing, no filters) limit advertising inventory types, restricting
      adoption to brands willing to accept authenticity constraints and a narrower programmatic format. Over 200
      brands experimented with BeReal campaigns in the first year following the ad platform launch, a figure that
      indicates early advertiser interest but not yet structural market depth.
