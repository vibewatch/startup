  - id: section-2
    title: Market sizing — TAM, SAM, and evidence constraints
    body: >
      Sizing Voodoo's market exposure requires navigating substantial contradictions between analyst methodologies.
      The global mobile gaming TAM is variously reported at $126 billion to $165 billion for 2025, depending on
      whether estimates include only IAP revenue, total consumer spend, or gross platform billing inclusive of
      advertising revenue. Precedence Research sized the 2025 market at $143.96 billion, projecting growth to
      $158.5 billion in 2026 at a 9.95% CAGR through 2035. GMI Insights and ResearchAndMarkets cited higher 2025
      figures of up to approximately $165 billion. Statista and manataz-based estimates place total 2025 consumer
      spending closer to $126–132 billion. These ranges reflect differing base-year treatments, geographic scope
      (China's regulatory environment and market isolation create material ambiguity), and inconsistent inclusion or
      exclusion of advertising revenue alongside IAP.


      Voodoo's own SAM framing is more granular and therefore more investment-actionable. The CEO's characterization
      of the casual gaming market at approximately $40 billion aligns with AppMagic and Ripple Reports estimates of
      total casual IAP at $35–38 billion. This roughly 25–28% share of the global mobile gaming TAM is where
      Voodoo's gaming revenues reside. Hybrid-casual is the fastest-growing layer within this SAM: Ripple Reports
      estimated hybrid-casual IAP at $9.8 billion in 2025 growing at an estimated 28% CAGR, and $12.5 billion
      in 2026.


      A publisher-level SOM for Voodoo cannot be formally computed because the company does not disclose revenue
      by genre, and no third-party source provides a complete total revenue figure for hybrid-casual inclusive of
      advertising revenue alongside IAP. What is supportable is that Voodoo reported $653 million in gaming revenue
      in 2025 (90% of $778 million total), implying a rough 1.6–1.9% share of the $35–40 billion casual gaming
      market by consumer spend. This is a meaningful share for a private company in a fragmented market, but also
      illustrates the scale gap versus Tencent, Scopely, and Activision Blizzard King.


      For BeReal, no third-party analyst has published a standalone TAM for authenticity-first photo sharing.
      The nearest proxy is the social networking app market at $98–126 billion in 2025–2026, but BeReal's
      monetizable pool is structurally smaller: its ad inventory is nascent, daily active users are estimated
      at only 2.93 million per Business of Apps despite claimed MAU of up to 40 million, and the platform only
      began generating revenue in 2025. BeReal's €30 million in 2025 revenue relative to the broader social
      networking market confirms it is early-stage monetization within a niche adjacency, not a proof of claim
      on the full social media TAM.
