company:
  name: Voodoo
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Voodoo's market exposure spans three bounded segments: casual mobile gaming (hyper-casual and hybrid-casual),
    where the company's CEO characterized the addressable space as approximately $40 billion in 2025; mobile in-app
    advertising, a $173 billion ecosystem that remains the primary monetization mechanism for Voodoo's game portfolio;
    and consumer social apps via BeReal, a niche within the $98 billion social networking app market. The global
    mobile gaming TAM is estimated between $126 billion and $165 billion in 2025 depending on methodology, with
    hybrid-casual the fastest-growing sub-segment at roughly $9.8 billion in IAP revenue and 37% YoY growth in 2024.
    Key growth drivers include hybrid-casual IAP penetration, smartphone expansion in emerging markets, and
    BeReal's Gen Z advertising premium. Structural constraints are Apple's ATT framework (which permanently depressed
    casual ad eCPMs), platform concentration, rising user-acquisition costs, and BeReal's contested MAU base
    (40 million per company versus 16 million per external analytics), which is the most material sizing gap in
    this chapter.

sections:
  - id: section-1
    title: Market boundary, included spend, and adjacencies
    body: >
      Voodoo's market exposure is best understood across three distinct but interacting segments, each governed by
      different monetization mechanics, buyer relationships, and competitive dynamics.


      The primary market is casual mobile gaming — the segment Voodoo's CEO Alexandre Yazdi explicitly characterized
      as "a global market of around $40 billion, deeper and more resilient" in the company's 2025 annual results.
      This $40 billion figure refers to IAP revenue from casual genres including puzzle, arcade, simulation,
      hyper-casual, and hybrid-casual, and excludes midcore and hardcore titles, PC and console categories, and
      subscription gaming bundles. Within this primary market, the hybrid-casual sub-segment — combining hyper-casual
      accessibility with deeper retention mechanics and IAP-plus-ads hybrid monetization — is the fastest-growing
      tier. Ripple Reports and AppMagic estimated hybrid-casual IAP at approximately $9.8 billion in 2025 with a
      forecast to reach $12.5 billion in 2026. The legacy pure hyper-casual sub-segment, Voodoo's original territory,
      generates only $600–700 million in annual IAP revenue as of 2025. Despite commanding enormous download
      volumes — the top 100 hyper-casual titles achieved roughly 2.4 billion downloads in H1 2025 alone — the
      segment is structurally commoditized on monetization: revenue is almost entirely advertising-dependent and
      declining as a share of total mobile gaming consumer spend.


      The secondary market is mobile in-app advertising. Since hyper-casual games and many hybrid-casual titles
      remain primarily or partially ad-monetized, Voodoo's revenue depends on demand-side spend within the broader
      mobile in-app advertising ecosystem. The Business Research Company estimated this market at $173.35 billion
      in 2025 with a 2026 forecast of $208.76 billion at a CAGR of 20.4% to 2030. Voodoo participates as a
      publisher supplying ad inventory from within its game portfolio to performance advertisers on demand-side
      platforms, rather than as an advertising-technology company; its captured share is a function of user
      inventory quality and engagement depth, not technology IP.


      The tertiary market is consumer social apps, entered through the €500 million acquisition of BeReal in June
      2024. BeReal competes within the social networking app segment, estimated at $98.37 billion in 2025 and
      forecast at $126.3 billion in 2026 by The Business Research Company. BeReal's effective monetizable pool
      is a narrow slice of this: authenticity-first photo sharing for Gen Z users with documented aversion to
      traditional advertising formats. BeReal generated €30 million in revenue in 2025 from in-app advertising
      introduced post-acquisition, representing an early-stage monetization foothold, not a full claim on the
      broader social media TAM.


      Excluded from Voodoo's relevant market are midcore and hardcore console and PC titles, subscription gaming
      services (Apple Arcade, Xbox Game Pass), PC browser advertising ecosystems, and live-service games requiring
      upfront purchases. Voodoo does not operate in these segments and has not signaled intent to enter them.
