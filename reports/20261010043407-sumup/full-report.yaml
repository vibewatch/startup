        - date: '2012'
          label: Company Founding & First Card Reader
          detail: >-
            Daniel Klein, Jan Deepen, Marc-Alexander Christ, and Stefan Jeschonnek found SumUp; launch proprietary
            Bluetooth mPOS device.
          tone: positive
        - date: '2013'
          label: Series A Financing & European Expansion
          detail: >-
            Secured €10M Series A from Shortcut Ventures and b-to-v Partners; rolled out operations to the UK, Germany,
            and Austria.
          tone: positive
        - date: '2016'
          label: Latin American Entry & Payment APIs
          detail: >-
            Entered Brazil and broader Latin America; launched remote payments, virtual terminal, and online invoicing
            capabilities.
          tone: neutral
        - date: '2020'
          label: 'POS Acquisitions: Goodtill & Tiller'
          detail: >-
            Acquired Goodtill (hospitality POS) and Tiller Systems (restaurant POS) to expand beyond standalone card
            hardware.
          tone: positive
        - date: '2021'
          label: Fivestars Acquisition & €750M Debt
          detail: >-
            Acquired US merchant loyalty network Fivestars for $317M and closed €750M debt facility led by Goldman
            Sachs.
          tone: neutral
        - date: '2022'
          label: €590M Equity Round at €8B Valuation
          detail: >-
            Raised €590M ($624M) led by Bain Capital Tech Opportunities at an €8B ($8.5B) valuation; achieved EBITDA
            profitability in Q4.
          tone: positive
        - date: '2023'
          label: Series F Financing & Tap to Pay
          detail: >-
            Secured €285M Series F led by Sixth Street Growth; rolled out merchant cash advances and Tap to Pay on
            iPhone.
          tone: neutral
        - date: '2024'
          label: €1.5B Private Credit Refinancing
          detail: >-
            Secured €1.5B private credit facility led by Goldman Sachs to refinance earlier debt; annual transaction
            count topped 1 billion.
          tone: positive
