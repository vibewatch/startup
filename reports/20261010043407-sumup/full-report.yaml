  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Illustrates the conversion of gross transaction volume into merchant revenue, interchange network deductions, and
      net platform gross profit.
    data:
      nodes:
        - label: 1. Merchant Customer Card Tap
          detail: Over 1 billion annual transactions processed across 4M+ merchants globally
        - label: 2. Gross Transaction Volume (GTV)
          detail: Aggregated merchant card transaction volume flowing through SumUp terminals
        - label: 3. Gross Fee Deductions
          detail: 1.69% EU / 2.6% + $0.10 US headline transaction fees collected at checkout
        - label: 4. Scheme Fees & Interchange
          detail: Interchange paid to card issuers and scheme fees paid to Visa, Mastercard, and Amex
        - label: 5. Net Payment Take-Rate
          detail: Net transaction margin remaining with SumUp post-interchange deductions
        - label: 6. Platform Gross Profit
          detail: Consolidated contribution combining net transaction fees with SaaS subscriptions and financial float
      edges:
