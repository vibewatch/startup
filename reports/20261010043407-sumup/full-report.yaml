chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity and Commercial Scale
        blocks:
          - type: paragraph
            body: >-
              Founded in 2012, SumUp has evolved from an early mobile point-of-sale card reader provider into a
              diversified financial technology platform dedicated to micro and small business merchants globally. The
              company maintains dual headquarters in London and Berlin, coordinating product engineering, risk
              management, and localized go-to-market operations across Europe, the United States, Latin America, and
              Australia. Public releases indicate that SumUp serves more than 4 million active business accounts in over
              36 countries, delivering an integrated product ecosystem spanning card readers, point-of-sale software,
              business bank accounts with payment cards, cash advances, and customer loyalty infrastructure. The
              business announced sustained positive EBITDA starting in the fourth quarter of 2022 alongside positive
              operating cash flow generation, representing a pivotal milestone that differentiates SumUp from
              venture-backed peers facing capital headwinds. However, consolidated GAAP revenues, gross margins, and net
              merchant take-rates remain private and unaudited in public registries, leaving observers reliant on
              third-party estimates such as GetLatka's $600 million annual revenue projection for 2025.
            claimRefs:
              - CO001
              - CO004
              - CO005
              - CO008
              - CO010
              - CO013
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO005
              - CO006
              - CO008
              - CO010
      - number: '1.2'
        title: Founding Team and Corporate Governance
        blocks:
          - type: paragraph
            body: >-
              SumUp was launched by a four-member founding group comprising Daniel Klein, Jan Deepen, Marc-Alexander
              Christ, and Stefan Jeschonnek, each bringing background in payments technology, corporate finance, and
              commercial expansion across European technology hubs. Co-founder Daniel Klein serves as Chief Executive
              Officer, retaining central strategic oversight and executive leadership as the enterprise scaled across
              thirty-six operating jurisdictions. Marc-Alexander Christ was instrumental in directing early sales
              partnerships and European merchant expansion, while Stefan Jeschonnek led technical architecture for the
              initial proprietary card-reader hardware and mobile checkout software. Jan Deepen contributed early
              operational infrastructure and logistics systems that supported rapid multi-country rollouts. While
              executive governance has broadened to include senior professional leadership across finance, risk, and
              operations, key-person dependence remains centered around Daniel Klein as the primary strategic architect
              and corporate spokesperson through successive private equity rounds and complex credit syndications.
            claimRefs:
              - CO002
              - CO003
          - type: table
            tableRef: TO002
            claimRefs:
              - CO002
              - CO003
      - number: '1.3'
        title: Capitalization, Debt Facility, and Investor Syndicate
        blocks:
          - type: paragraph
            body: >-
              The enterprise's financing history demonstrates an evolving capital structure characterized by substantial
              venture growth equity followed by large-scale private credit facilities. After raising €590 million ($624
              million) in a June 2022 funding round led by Bain Capital Tech Opportunities that established an €8
              billion ($8.5 billion) valuation benchmark, SumUp navigated a shifting macro financing climate by securing
              an additional €285 million Series F round in December 2023 led by Sixth Street Growth. Notably,
              institutional investment records from Silicon Valley Investment Club indicate that this Series F priced
              SumUp at a $4.1 billion post-money valuation, marking a sharp downward valuation correction compared to
              peak 2022 figures. In May 2024, SumUp finalized its largest balance-sheet transaction: a €1.5 billion
              ($1.62 billion) private credit facility arranged by Goldman Sachs and supported by major global credit
              managers including BlackRock, AllianceBernstein, Apollo Global Management, and Sixth Street. This
              non-dilutive credit refinancing allowed SumUp to reorganize existing debt obligations and fund merchant
              capital advances while avoiding further common shareholder dilution.
            claimRefs:
              - CO006
              - CO007
              - CO009
          - type: table
            tableRef: TO003
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
      - number: '1.4'
        title: Strategic Milestones and Compliance Architecture
        blocks:
          - type: paragraph
            body: >-
              SumUp's strategic trajectory reflects deliberate expansion from single-device hardware distribution to
              software-driven merchant engagement and financial services. Following European geographic expansion from
              2012 to 2016 and an entry into Latin American markets, SumUp executed transformative software acquisitions
              including Goodtill in 2020 for hospitality point-of-sale systems, Tiller Systems for restaurant
              management, and Fivestars in 2021 for merchant customer loyalty networks. Concurrently, the platform has
              institutionalized rigorous payment card compliance frameworks, adhering strictly to global PCI DSS
              standards across all proprietary hardware terminals and mobile payment applications. By managing
              end-to-end data encryption and secure terminal configurations, SumUp shields micro-merchants from payment
              card fraud, APP scams, and potential network non-compliance fines, thereby underpinning customer trust as
              annual transactions exceeded one billion in 2024.
            claimRefs:
              - CO011
              - CO012
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO012
      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Private Credit Shift and Common Equity Preservation
            body: >-
              SumUp's May 2024 €1.5 billion debt financing represents a strategic reliance on private credit to
              refinance maturing facilities and fund merchant scale without triggering equity dilution. However,
              third-party tear sheets citing a $4.1 billion Series F in December 2023 underscore potential valuation
              compression relative to peak $8.5 billion marks.
            calloutType: insight
            claimRefs:
              - CO006
              - CO007
              - CO009
          - type: callout
            title: Consolidated Financial Opacity and Private Multiple Valuation
            body: >-
              While SumUp reports positive EBITDA since late 2022, consolidated audited revenues and net take-rate
              remain withheld from public disclosures, with market observers relying on GetLatka estimates of $600
              million for 2025. Confirming true unit economics and debt covenant margins remains essential for
              underwriting enterprise value.
            calloutType: risk
            claimRefs:
              - CO008
              - CO010
              - CO013
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Definition, Spend Boundaries, and Core Adjacencies
        blocks:
          - type: paragraph
            body: >-
              SumUp operates at the intersection of micro-merchant payment acceptance, point-of-sale software, and
              small-business banking services. The core market boundary is defined by sole proprietors, independent
              mobile service professionals, pop-up vendors, and small hospitality operators who have historically been
              underserved by legacy acquiring banks. By combining low-cost mobile card readers with self-serve
              onboarding, SumUp eliminated traditional merchant account setup friction and monthly equipment lease
              minimums. The company has systematically expanded its product scope across three primary commerce pillars:
              payment acceptance, integrated point-of-sale hardware and software, and business accounts with debit
              cards. Adjacencies now include e-commerce storefronts, digital invoicing, self-service kiosks, and tax
              accounting integrations powered by partnerships such as Sage. However, enterprise multi-lane grocery
              retail, complex multinational supply chain payments, and large-scale corporate banking remain explicitly
              excluded from SumUp's commercial boundary.
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM006
              - CM008
      - number: '2.2'
        title: TAM, SAM, and SOM Addressable Sizing Lenses
        blocks:
          - type: paragraph
            body: >-
              Evaluating SumUp's total addressable market requires looking beyond a single broad payments volume
              estimate. Across its 38 operating countries in Europe and Latin America, the primary market lens centers
              on small-business transaction processing fees and software subscriptions. While global small-merchant card
              transaction volume exceeds tens of billions of dollars annually, addressable net revenue is determined by
              the payments take-rate and monthly software fees. In the hospitality and quick-service sector alone, U.S.
              industry data indicates an employment base of 15.8 million workers across hundreds of thousands of
              independent venues, creating substantial demand for multi-station POS workflows. Outside-in digital
              analytics estimate SumUp's commercial revenue run-rate at approximately $703.8 million, indicating that
              SumUp has captured a meaningful slice of its initial European micro-merchant serviceable market.
              Nonetheless, because consolidated audited financials remain private, definitive market share figures
              across specific geographic regions cannot be independently confirmed.
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM007
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
      - number: '2.3'
        title: Buyer Segmentation, Budget Ownership, and Adoption Workflows
        blocks:
          - type: paragraph
            body: >-
              SumUp's customer base is segmented into three distinct tiers with differing procurement triggers, budget
              ownership, and workflow requirements. The largest volume tier comprises micro-merchants and sole traders
              whose purchase decision is entirely self-serve and driven by immediate point-of-sale necessity without
              recurring overhead. The second tier consists of independent food and beverage establishments—such as
              cafes, bakeries, and quick-service restaurants—where operators manage table floor plans, multi-printer
              order routing, and staff permissions. For these merchants, SumUp offers POS Plus at $49 per month to
              bridge the gap between simple mobile readers and complex legacy POS systems. The third tier includes
              growing hospitality groups that deploy self-service kiosks to increase average order basket size by up to
              25 percent and mitigate frontline staffing shortages. Across all three segments, the business owner acts
              as the sole budget owner and decision-maker, bypassing formal procurement committees.
            claimRefs:
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
      - number: '2.4'
        title: Macro Growth Drivers, Adoption Constraints, and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              The primary macro growth driver underpinning SumUp's expansion is the continuing secular displacement of
              cash by contactless and mobile card payments across everyday micro-transactions. This tailwind is
              augmented by the bundling of financial services into a unified merchant SuperApp, encompassing instant
              payouts, debit cards, and automated tax reporting. Conversely, SumUp faces distinct adoption constraints
              and structural risks. Micro-merchants exhibit inherently high business mortality rates, requiring
              continuous top-of-funnel customer acquisition to replace churned terminals. Furthermore, as merchants
              scale in annual processing volume, SumUp's fixed percentage fee structure becomes economically
              disadvantageous compared to interchange-plus pricing from cloud competitors like Epos Now. Additionally,
              increasing prevalence of authorized push payment scams and phishing attempts requires ongoing investment
              in fraud prevention infrastructure and merchant support to preserve platform trust.
            claimRefs:
              - CM012
              - CM013
              - CM014
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Market Expansion via Micro-SaaS Subscription Tiers
            body: >-
              SumUp is actively expanding beyond purely transactional mPOS transaction fees by introducing fixed-fee
              software tiers like POS Plus ($49/month in the U.S.). This strategy shifts the customer relationship from
              episodic micro-merchant hardware usage toward recurring SaaS software revenue, improving customer
              retention among higher-volume quick-service and cafe operators.
            calloutType: insight
            claimRefs:
              - CM010
              - CM004
          - type: callout
            title: Take-Rate Compression and Micro-Merchant Churn
            body: >-
              Because SumUp relies heavily on sole traders and micro-enterprises with high baseline business failure
              rates, customer acquisition costs must remain exceptionally low. Furthermore, as merchants grow in
              transaction volume, flat-rate transaction pricing faces intense margin competition from specialized POS
              providers like Epos Now offering volume discounts.
            calloutType: risk
            claimRefs:
              - CM012
              - CM009
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Direct Peer Profiles
        blocks:
          - type: paragraph
            body: >-
              SumUp operates across a tiered competitive landscape defined by direct mobile payment facilitators,
              traditional merchant acquiring incumbents, and specialized vertical software platforms. Direct peers such
              as Block's Square and PayPal's Zettle compete aggressively for micro-merchants and mobile sole traders,
              but typically charge higher baseline UK card-present processing rates of 1.75% compared to SumUp's 1.69%
              flat rate. Meanwhile, traditional bank-affiliated acquiring solutions and full-service systems like
              Fiserv's Clover provide comprehensive countertop hardware and enterprise reporting, but impose steep
              monthly software subscriptions ranging from $99 to $289 alongside complex merchant agreements. SumUp
              counters these higher-friction alternatives by focusing on rapid self-onboarding, compact proprietary
              readers, and accessible pay-as-you-go commercial terms.
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP013
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
      - number: '3.2'
        title: Capability Depth and Pricing Model Benchmarks
        blocks:
          - type: paragraph
            body: >-
              Evaluating point-of-sale functionality reveals clear architectural trade-offs between SumUp and category
              specialists. SumUp's hardware line, including the £25 Air and £79 standalone Solo reader, undercuts
              enterprise terminals while eliminating fixed monthly overhead for casual sellers. However, in software
              capability, SumUp provides streamlined catalog and order checkout workflows rather than deep
              multi-location matrix inventory or table management. In pricing, SumUp's UK card-present rate of 1.69%
              undercuts Square's 1.75%, though Square captures online order advantages with a 1.4% plus £0.25 structure
              for larger ticket sizes. High-volume merchants on SumUp can subscribe to SumUp One for £29 monthly,
              dropping transaction fees to 0.99% and protecting margins against competitive displacement.
            claimRefs:
              - CP002
              - CP003
              - CP006
              - CP010
              - CP012
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
              - CP005
              - CP006
              - CP009
              - CP010
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP003
              - CP012
      - number: '3.3'
        title: Switching Costs, Multi-Homing, and Ecosystem Durability
        blocks:
          - type: paragraph
            body: >-
              Micro-merchant payment acceptance historically suffers from low switching barriers, as sole traders can
              readily deploy multiple card readers or multi-home across apps. To insulate its active base, SumUp has
              expanded beyond pure transaction acquiring into an operational software ecosystem. The acquisition and
              integration of FiveStars as SumUp Connect embeds customer loyalty directly onto checkout terminals,
              cross-promoting local shoppers across a multi-tenant network. Additionally, SumUp pairs card acceptance
              with its free Business Account, granting merchants instant access to sales funds, next-day weekend
              settlements, and commercial debit cards. By combining hardware lock-in with banking and automated loyalty,
              SumUp increases the operational friction of defecting to standalone alternatives.
            claimRefs:
              - CP007
              - CP008
              - CP011
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP007
              - CP008
              - CP011
              - CP013
              - CP014
      - number: '3.4'
        title: Displacement Risks and Merchant Tradeoffs
        blocks:
          - type: paragraph
            body: >-
              Despite rapid customer acquisition, adverse merchant feedback and procurement evaluations highlight
              persistent vulnerabilities that cap SumUp's upmarket penetration. The platform's reliance on automated
              chatbot triage, restricted phone support hours, and sluggish escalation paths for frozen accounts
              generates significant merchant frustration during critical weekend trading. Furthermore, intermittent
              Bluetooth pairing latency and reader battery degradation under continuous service prompt maturing
              businesses to migrate toward dedicated enterprise terminals. These operational limitations constrain SumUp
              largely to micro and mobile merchants, leaving high-turnover retailers and full-service dining
              establishments vulnerable to displacement by feature-rich vertical platforms.
            claimRefs:
              - CP009
              - CP010
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Micro-Merchant Economics Favor Transparent Flat-Rate Acquiring
            body: >-
              For mobile sole traders and seasonal vendors processing under £4,000 monthly, SumUp's 1.69% flat
              processing fee and sub-£30 hardware minimize upfront hurdle rates, delivering superior unit cost compared
              to subscription-heavy POS terminals like Clover or Square's slightly higher 1.75% card-present rate.
            calloutType: insight
            claimRefs:
              - CP002
              - CP003
          - type: callout
            title: Customer Support Friction Accelerates Upmarket Churn
            body: >-
              Automated chatbot triage and limited weekend live support represent SumUp's primary operational
              vulnerability, driving growing merchants with multi-terminal setups toward dedicated vertical POS
              platforms when hardware connectivity or payout freezes occur.
            calloutType: risk
            claimRefs:
              - CP009
              - CP010
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams & Platform Monetization Model
        blocks:
          - type: paragraph
            body: >-
              SumUp operates a multi-pillar business model designed to democratize merchant commerce across Europe,
              Latin America, and North America. The cornerstone of the platform remains its transaction processing
              engine, which captures fees on card-present and digital payments across more than 4 million merchants. In
              the United Kingdom and Europe, SumUp charges a standard flat rate of 1.69% per transaction, while in the
              United States, in-person payments incur 2.6% plus ten cents. Hardware devices, including the Solo, Solo
              Lite, and Air card readers, are deliberately sold at or near cost as an acquisition tool to eliminate
              friction for micro-merchants and sole traders. Beyond payment processing, SumUp has built recurring SaaS
              revenue streams through tiered software subscriptions such as POS Plus and POS Pro, alongside bundled
              service packages. Additional monetization is driven by financial services, including merchant cash
              advances and business debit card interchange, creating a diversified ecosystem that lifts net merchant
              take-rate over time.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI008
              - CI013
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI011
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI009
              - CI010
              - CI013
              - CI014
      - number: '4.2'
        title: Pricing Structure, GTM Motion & Sales Efficiency Proxies
        blocks:
          - type: paragraph
            body: >-
              SumUp's go-to-market motion relies heavily on digital inbound marketing, transparent self-serve
              onboarding, and word-of-mouth distribution within small business communities. Unlike legacy merchant
              acquirers that require complex multi-year contracts, terminal leasing commitments, and opaque
              interchange-plus fee schedules, SumUp offers pay-as-you-go pricing with zero monthly software fees on its
              starter tier. Web traffic data indicates that sumup.com attracts approximately 7.5 million monthly
              visitors with an estimated 62% direct traffic share, highlighting strong organic brand awareness that
              suppresses merchant customer acquisition costs. Higher-volume merchants graduate into negotiated pricing
              and paid subscription tiers, which incorporate multi-device management, employee PIN profiles, and
              specialized hospitality tooling acquired through acquisitions like Goodtill and Tiller Systems. This
              low-friction, high-velocity distribution funnel allows SumUp to acquire hundreds of thousands of
              micro-merchants annually without the overhead of enterprise direct sales forces.
            claimRefs:
              - CI001
              - CI002
              - CI008
              - CI014
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI008
      - number: '4.3'
        title: Cost Structure, Unit Economics & Disclosure Opacity
        blocks:
          - type: paragraph
            body: >-
              While SumUp announced reaching positive EBITDA in December 2022 and positive operating cash flow
              thereafter, the company maintains strict confidentiality regarding consolidated unit economics. Key
              performance metrics—including blended gross margins, merchant net revenue retention rates, and cohort
              payback dynamics—are entirely absent from statutory public disclosures. External market researchers
              estimate annual recurring revenue between $600 million and $704 million, implying an average revenue per
              active merchant of approximately $150 to $175 per year. However, transaction gross margins are heavily
              impacted by underlying scheme fees paid to Visa and Mastercard, as well as banking interchange in
              unregulated markets. Furthermore, micro-merchants inherently experience elevated business mortality and
              seasonal inactivity, making cohort retention and cross-sell into the 1 million active business accounts
              critical for long-term customer lifetime value. Underwriters cannot verify whether subscription SaaS
              expansion offsets hardware subsidies and processing margin compression without audited segment accounts.
            claimRefs:
              - CI004
              - CI009
              - CI010
              - CI011
          - type: table
            tableRef: TI003
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI011
      - number: '4.4'
        title: Capital Adequacy, Private Debt & Underwriting Verdict
        blocks:
          - type: paragraph
            body: >-
              SumUp's financing strategy shifted decisively in May 2024 with the closure of a landmark €1.5 billion
              private credit facility led by Goldman Sachs alongside AllianceBernstein, Apollo Global Management, Arini,
              Deutsche Bank, and Fortress Investment Group. This capital was allocated toward refinancing previous debt
              obligations and funding international expansion while avoiding equity dilution. Nevertheless, this
              substantial debt load imposes ongoing interest service requirements that must be covered by operating cash
              flows in a higher-rate macro environment. Meanwhile, secondary market valuation marks reflect considerable
              divergence, with Tracxn recording a $4.1 billion post-money Series E valuation while private growth rounds
              and secondary brokers reference $8.5 billion to $10 billion. Institutional diligence must treat SumUp as a
              track-stage opportunity: while the company demonstrates formidable merchant scale, high organic web
              traffic, and operational EBITDA discipline, the absence of audited consolidated margins, debt covenants,
              and cohort retention prevents institutional underwriting.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI010
              - CI012
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Multi-Product Flywheel Offsets Micro-Merchant Churn
            body: >-
              SumUp's strategic expansion into free business banking accounts—surpassing 1 million accounts in Europe
              and Brazil—functions as a high-retention anchor. By integrating payments with card issuance, merchant cash
              advances, and working capital, SumUp captures interchange revenue and balances micro-merchant mortality
              with higher lifetime customer value.
            calloutType: insight
            claimRefs:
              - CI002
              - CI003
              - CI011
          - type: callout
            title: Private Credit Leverage and Valuation Markdown Uncertainty
            body: >-
              While SumUp successfully secured a €1.5 billion private credit facility led by Goldman Sachs to refinance
              earlier debt, debt service burdens in a higher interest rate environment constrain cash flow. Furthermore,
              secondary market valuation marks diverge sharply—ranging from Tracxn's $4.1 billion post-money record to
              secondary listings at $8.5 billion—presenting substantial valuation uncertainty.
            calloutType: risk
            claimRefs:
              - CI005
              - CI006
              - CI007
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Merchant Product Surface and Workflow
        blocks:
          - type: paragraph
            body: >-
              SumUp presents a broad merchant operating system rather than a standalone card reader. Its current public
              positioning groups the offering around payments, point-of-sale systems, and business accounts, while the
              US product surface adds loyalty, appointments, employee organization, sales reporting, and promotional
              tools [CE001, CE002]. In a merchant workflow, payment capture is the entry point; POS software then
              manages checkout and operations, Connect addresses repeat visits, and the Business app and account extend
              into sales visibility and money movement. The press surface also lists remote payments, online stores,
              invoicing, cash advances, and free business accounts [CE012]. This breadth may reduce tool fragmentation
              for a small business, but neither module adoption nor cross-sell is quantified in the assigned evidence.
              An independent review confirms a wide POS feature set, yet should be treated as directional rather than a
              product-level performance benchmark [CE014].
            claimRefs:
              - CE001
              - CE002
              - CE012
              - CE014
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE012
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE007
              - CE012
      - number: '5.2'
        title: Technical and Operating Architecture
        blocks:
          - type: paragraph
            body: >-
              The strongest technical proof is component-specific. LVGL's case study says Solo Lite combines Zephyr RTOS
              with LVGL on constrained embedded hardware, including a Bluetooth link to the SumUp app; it also describes
              responsive rendering and on-device QR capability [CE003]. Confluent describes a separate backend evolution
              toward an event-driven data mesh, with Confluent Cloud working alongside SumUp microservices hosted in
              Amazon RDS for PostgreSQL [CE004, CE005]. More than 20 teams reportedly use the streaming platform, which
              indicates internal adoption beyond a single proof of concept [CE006]. Contentful supplies another bounded
              layer: content and localization workflows supporting more than 20 languages across five offices [CE007,
              CE008]. Together these sources support a layered architecture, but not a complete payment-authorization,
              settlement, encryption, or disaster-recovery design.
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE003
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE006
              - CE007
              - CE008
          - type: figure
            figureRef: FE001
            claimRefs:
