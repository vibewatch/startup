        - Software and SaaS contribution stagnating below 15% of net revenues
      - - Capital Structure
        - Substantial conventional credit lines fund merchant cash advance assets without excessive equity dilution
        - Large debt facilities create significant senior claim overhang and covenant refinance vulnerability
        - Adverse debt rating action, covenant breach, or liquidity squeeze on loan renewals
      - - Regulatory Compliance
        - Full PCI DSS compliance and regulated banking infrastructure establish defensible operational standard
        - Rising compliance burdens and APP fraud prevention liabilities compress operating margins
        - Enforcement action or material fines from payment schemes or financial regulators
    notes: >-
      Evaluation of core structural drivers influencing long-term enterprise value and risk-adjusted return
      expectations.
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV006
      - CV011
      - CV012
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Key Operating Assumptions
      - Valuation & Return Logic
      - Core Downside Triggers
      - Probability Signal
    rows:
      - - Bull Case
        - Merchant base exceeds 5.5M; software attach accelerates; successful LSE IPO execution
        - Multiple re-rates to 6.0x-8.0x revenue; premium exit valuation exceeding $10B
        - Failure to clear public market listing governance and accounting scrutiny
        - Low (20%)
      - - Base Case
        - Steady 4M+ merchant footprint; transaction growth tracks inflation; stable debt rollover
        - Fair market multiple around 3.5x-4.5x net revenue; valuation remains at $4.0B-$5.5B range
        - Macro SMB discretionary retail softening and ongoing high cost of credit
        - Medium (55%)
      - - Bear Case
        - Elevated SMB churn; merchant loan defaults rise; credit spread widening on debt facilities
        - Distressed down-round or debt restructuring compressing common equity value below $2.5B
        - Severe credit loss spikes or loss of key payment processing partnerships
        - Substantial (25%)
    notes: >-
      Scenario projections model enterprise outcomes under varying macroeconomic, credit refinancing, and software
      adoption environments.
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV009
      - CV010
      - CV013
