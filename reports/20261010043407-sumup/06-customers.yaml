figures:
  - id: FU001
    title: 'Customer journey map: Lifecycle progression from merchant acquisition to multi-product expansion'
    type: journey-map
    summary: Visual map of merchant lifecycle stages from digital discovery and hardware activation through banking attach, loyalty adoption, and up-market multi-location operations.
    data:
      items:
        - label: Digital Discovery & Self-Serve Acquisition
          touchpoints:
            - Direct web traffic (62% direct share on sumup.com)
            - Word-of-mouth referral and peer recommendation
            - Retail partner hardware display or online storefront order
          tone: neutral
        - label: Hardware Activation & Zero-Subscription Setup
          touchpoints:
            - Self-serve merchant digital onboarding in minutes
            - Standalone card reader setup (Solo Lite / Go) with no monthly rental
            - Initial transaction processing at 2.6% plus 10c per tap
          tone: positive
        - label: Daily Core In-Person & Remote Processing
          touchpoints:
            - Point-of-sale checkout using POS Lite or standalone SumUp Terminal
            - Hardware-free invoicing and remote Payment Links
            - Real-time payment confirmation and daily sales tracking
          tone: positive
        - label: Business Account & Banking Cross-Sell
          touchpoints:
            - Free SumUp Business Account opening with Mastercard debit card
            - Next-day and weekend access to settlement funds
            - Direct supplier bill payments and expense debit card usage
          tone: positive
        - label: Software & Compliance Upgrades
          touchpoints:
            - POS Plus premium subscription upgrade
            - Floor plan management and barcode scanner integration
            - Embedded Sage Making Tax Digital automated tax filing
          tone: neutral
        - label: Customer Loyalty & Retention Engagement
          touchpoints:
            - SumUp Connect loyalty program deployment (73.2% non-adoption gap)
            - AutoPilot SMS marketing and repeat customer incentives
            - Customer spending analytics to drive repeat footfall
          tone: warning
        - label: Up-Market Expansion & Multi-Terminal Scaling
          touchpoints:
            - Multi-terminal hardware rollout across commercial stores (e.g. Gong cha)
            - Employee PIN management and multi-printer kitchen tickets
            - Underwriting review for working capital advances under private credit constraints
          tone: warning
    approximationNotes: Lifecycle stages and touchpoints synthesized from SumUp merchant product architecture, official pricing tiers, and empirical small business retention surveys.
    claimRefs:
      - CU002
      - CU004
      - CU005
      - CU014
callouts:
  - calloutType: insight
    title: Micro-Merchant Retention Versus Enterprise POS Moats
    body: SumUp's rapid customer acquisition is enabled by low-barrier hardware pricing, but micro-merchant churn is inherently higher than mid-market software contracts due to small business mortality rates. Long-term platform durability depends heavily on successfully attaching banking accounts, invoicing tools, and loyalty features that embed SumUp directly into the merchant's core operating workflow.
    claimRefs:
      - CU004
      - CU005
      - CU007
  - calloutType: risk
    title: Up-Market Competitive Headwinds and Debt-Gated Expansion
    body: While SumUp maintains strong leadership in European micro-merchant acquiring, its push into larger SMB accounts and the North American market faces intense competition from established incumbents such as Square and Toast. Operating under private-credit financing facilities imposes strict EBITDA and payback constraints that limit aggressive subsidized customer acquisition.
    claimRefs:
      - CU002
      - CU014
