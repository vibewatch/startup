  evidenceGaps:
    - type: missing-source
      severity: material
      topic: cohort-retention-and-churn
      missingEvidence: Audited cohort retention schedules, Net Revenue Retention (NRR), Gross Revenue Retention (GRR), and annualized merchant churn rates disaggregated by micro-merchant versus multi-location accounts.
      whyItMatters: Without verified retention cohorts, it is difficult to determine whether top-line customer growth reflects sustainable lifetime value or high merchant churn offset by continuous front-end acquisition.
      diligencePath: Request historical merchant cohort analysis, trailing 12-month dollar retention rates, and churn by vintage during management diligence.
      relatedQuestionRefs:
        - QU009
    - type: enumeration-incomplete
      severity: minor
      topic: named-customer-proof-table
      missingEvidence: Comprehensive registry of verified mid-market and enterprise customer contracts across all operating jurisdictions.
      whyItMatters: Public references are primarily micro-merchants and select B2B database samples, leaving enterprise contract penetration and average contract value unverified.
      diligencePath: Inspect CRM contract lists, top 50 customer concentration schedules, and franchise agreement terms under NDA.
      relatedTableRefs:
        - TU003
