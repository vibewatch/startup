    title: Customer segmentation table
    columns:
      - Customer Segment
      - Target Buyer / Persona
      - Primary Use Case & Workflows
      - Estimated Scale & Reach
      - Strategic & Revenue Value
      - Diligence Gap / Data Limitation
    rows:
      - - Micro-Merchants & Solo Entrepreneurs
        - Independent café owners, mobile service operators, boutique retail sole traders
        - Card-present mPOS checkout, contactless payments, and digital receipting
        - Core of 4M+ global merchant base across 38 countries
        - Primary driver of payment processing volume, take-rate revenue, and hardware unit sales
        - Audited active merchant counts versus inactive registrations not publicly disclosed
      - - Growing Local Retail & Hospitality
        - Store managers, quick-service restaurant owners, multi-employee retail operators
        - Countertop POS Lite/Terminal checkout, inventory management, barcode scanning, employee PIN tracking
        - Fastest-growing tier among multi-product adopters in Europe and North America
        - Drives software subscription upgrades (POS Plus) and hardware bundle margins
        - Software attach rates and average revenue per user (ARPU) expansion undisclosed
      - - Service Providers & Remote Sellers
        - Tradespeople, consultants, freelance contractors, home service professionals
        - Payment Links, remote invoicing, instant payouts via SumUp Business Account
        - Significant share of mobile app users requiring zero dedicated hardware
        - Expands banking deposit base and card interchange income
        - Cohort-level transaction volume durability and payment link dispute rates unverified
      - - Franchises & Mid-Market Enterprises
        - Franchise procurement heads, multi-location operators (e.g. Gong cha, B2B wholesale)
        - Standardized multi-terminal deployment, Sage MTD accounting integration, supply-chain payment flows
        - 29,304 verified B2B/enterprise organizations tracked in commercial databases
        - Higher processing volume per merchant, lower transaction attrition risk
        - Total enterprise revenue contribution and custom contract discounting terms unavailable
    notes: Segment breakdown synthesized from SumUp official product tiers, press disclosures, and third-party B2B intelligence; merchant counts include free account registrations.
