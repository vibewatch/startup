chapter:
  number: 5
  title: "Product & Technology"
  summary: "SumUp's public product surface spans payment hardware, POS and loyalty software, business accounts, and merchant-management tools. Supplier evidence shows credible embedded-device, streaming-data, and localization capabilities, but externally audited security controls, product-level uptime, and a dated cross-product roadmap remain unavailable."
sections:
  - id: "merchant-product-surface"
    title: "Merchant Product Surface and Workflow"
    body: >-
      SumUp presents a broad merchant operating system rather than a standalone card reader. Its current public
      positioning groups the offering around payments, point-of-sale systems, and business accounts, while the US
      product surface adds loyalty, appointments, employee organization, sales reporting, and promotional tools
      [CE001, CE002]. In a merchant workflow, payment capture is the entry point; POS software then manages checkout
      and operations, Connect addresses repeat visits, and the Business app and account extend into sales visibility
      and money movement. The press surface also lists remote payments, online stores, invoicing, cash advances, and
      free business accounts [CE012]. This breadth may reduce tool fragmentation for a small business, but neither
      module adoption nor cross-sell is quantified in the assigned evidence. An independent review confirms a wide
      POS feature set, yet should be treated as directional rather than a product-level performance benchmark [CE014].
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE012"
      - "CE014"
    tableRefs:
      - "TE001"
      - "TE002"
  - id: "technical-operating-model"
    title: "Technical and Operating Architecture"
    body: >-
      The strongest technical proof is component-specific. LVGL's case study says Solo Lite combines Zephyr RTOS
      with LVGL on constrained embedded hardware, including a Bluetooth link to the SumUp app; it also describes
      responsive rendering and on-device QR capability [CE003]. Confluent describes a separate backend evolution
      toward an event-driven data mesh, with Confluent Cloud working alongside SumUp microservices hosted in Amazon
      RDS for PostgreSQL [CE004, CE005]. More than 20 teams reportedly use the streaming platform, which indicates
      internal adoption beyond a single proof of concept [CE006]. Contentful supplies another bounded layer:
      content and localization workflows supporting more than 20 languages across five offices [CE007, CE008].
      Together these sources support a layered architecture, but not a complete payment-authorization, settlement,
      encryption, or disaster-recovery design.
    claimRefs:
      - "CE003"
      - "CE004"
      - "CE005"
      - "CE006"
      - "CE007"
      - "CE008"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "maturity-differentiation-roadmap"
    title: "Maturity, Differentiation, and Roadmap Evidence"
    body: >-
      Public maturity signals are uneven but tangible. The official engineering index exposes work on journey-level
      service objectives, proactive data-quality monitoring, incident management, OpenAPI, Kubernetes, and financial-
      crime applications, showing that SumUp publishes practitioner material rather than only consumer marketing
      [CE009]. Supplier accounts also describe operational deployments: distributed streaming is used by more than
      20 teams, and the localization stack supports many languages and offices [CE006, CE007]. Differentiation appears
      to come from integration across proprietary payment hardware, merchant software, customer engagement, and
      financial tools, reinforced by a common data layer [CE001, CE002, CE004]. However, roadmap evidence is narrow:
      the LVGL case study explicitly says there are no confirmed plans to use LVGL in future SumUp products [CE013].
      No assigned source provides a dated, portfolio-wide roadmap or independently measured release velocity.
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE004"
      - "CE006"
      - "CE007"
      - "CE009"
      - "CE013"
  - id: "trust-reliability-and-diligence"
    title: "Trust, Reliability, and Evidence Boundaries"
    body: >-
      SumUp's support surface documents user-facing controls and guidance for phishing, authorized push payment fraud,
      compromised profiles, weak or leaked passwords, and trusted-device verification with biometrics or a PIN
      [CE010]. Its engineering page separately describes flow-based service objectives that measure complete user
      journeys and links to an incident-management account [CE009]. These are useful control signals, but they are
      company-issued and do not establish certification scope, control effectiveness, availability, recovery time, or
      incident frequency. The independent review adds an operational caution: its reviewer found setup straightforward
      but email and phone response times slower than expected [CE011]. Public evidence therefore supports a functioning
      reliability and fraud-prevention program, not an independently verified assurance conclusion. Current audit
      reports, penetration-test summaries, product-level uptime histories, privacy-control mappings, and support SLA
      attainment remain diligence gaps [CE015].
    claimRefs:
      - "CE009"
      - "CE010"
      - "CE011"
      - "CE015"
