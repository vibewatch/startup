companyProfile:
  summary: >-
    SumUp 成立于 2012 年，总部位于伦敦和柏林，是一家面向全球 36 个以上市场微型及小型企业的金融科技公司，提供读卡器、销售点软件、带卡商业账户、开票、会员工具和商户融资。公司披露拥有超过 400 万家企业客户，自 2022
    年末起持续实现 EBITDA 盈利，并于 2024 年 5 月完成私人信贷再融资，在延展资产负债表能力的同时保留股权。公开披露仍未厘清合并收入基数、利润率、费率和契约条款。
