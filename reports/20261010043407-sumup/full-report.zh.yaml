      - number: '5.4'
        title: 信任、可靠性与证据边界
        blocks:
          - type: paragraph
            body: >-
              SumUp 的支持页面记录了面向用户的控制和指引，涉及钓鱼、授权推送支付欺诈、账户被入侵、弱密码或密码泄露，以及通过生物识别或 PIN 验证受信设备
              [CE010]。其工程页面另行描述衡量完整用户旅程的流程型服务目标，并链接到事件管理说明
              [CE009]。这些是有用的控制信号，但由公司自行发布，不能证明认证范围、控制有效性、可用性、恢复时间或事件频率。独立评测补充了运营层面的谨慎信号：评测者认为设置简单，但邮件和电话响应慢于预期
              [CE011]。              因此，公开证据支持存在可运行的可靠性和欺诈防范项目，却不足以形成独立验证的保证结论。当前审计报告、渗透测试摘要、产品级可用性历史、隐私控制映射和支持 SLA
              达成情况仍是尽调缺口 [CE015]。
