              - CI007
  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 商户产品界面与工作流
        blocks:
          - type: paragraph
            body: >-
              SumUp 提供的是完整的商户操作系统，而非独立读卡器。当前公开定位聚焦支付、销售点系统和商业账户；美国产品还加入会员、预约、员工组织、销售报告和促销工具 [CE001,
              CE002]。在商户工作流中，支付收款是入口；随后由 POS 软件管理结账和运营，Connect 处理复访，Business
              应用和账户延伸到销售可见性与资金流转。媒体资料还列出远程支付、在线商店、开票、现金预支和免费商业账户 [CE012]。这种广度可能减少小企业的工具碎片化，但现有证据没有量化模块采用率或交叉销售。独立评测确认
              POS 功能范围较广，但应将其视为方向性信息，而非产品级性能基准 [CE014]。
            claimRefs:
              - CE001
              - CE002
              - CE012
