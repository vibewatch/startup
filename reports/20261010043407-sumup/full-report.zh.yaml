      - CP007
      - CP008
      - CP011
      - CP013
      - CP014
  - id: FI001
    title: 收入模型桥接图
    type: flow
    summary: 展示支付交易总额如何转化为商户收入、扣除交换网络费用，并形成平台净毛利。
    data:
      nodes:
        - label: 1. 商户客户刷卡
          detail: 全球 4M+ 商户每年处理超过 1 billion 笔交易
        - label: 2. 交易总额（GTV）
          detail: 经 SumUp 终端流转的商户银行卡交易总额
        - label: 3. 总费用扣除
          detail: 结账时收取的欧盟 1.69% / 美国 2.6% + $0.10 标准交易费
        - label: 4. 卡组织费用与交换费
          detail: 向发卡机构支付交换费，向 Visa、Mastercard 和 Amex 支付卡组织费用
        - label: 5. 净支付抽成
          detail: 扣除交换费后留在 SumUp 的净交易利润率
        - label: 6. 平台毛利
          detail: 将净交易费用与 SaaS 订阅和金融浮存金合并后的贡献
      edges:
        - from: 1. Merchant Customer Card Tap
          to: 2. Gross Transaction Volume (GTV)
          label: 产生
        - from: 2. Gross Transaction Volume (GTV)
          to: 3. Gross Fee Deductions
          label: 计费标准为
        - from: 3. Gross Fee Deductions
          to: 4. Scheme Fees & Interchange
          label: 减去成本
        - from: 3. Gross Fee Deductions
          to: 5. Net Payment Take-Rate
          label: 留存
        - from: 5. Net Payment Take-Rate
          to: 6. Platform Gross Profit
          label: 贡献至
    approximationNotes: 流程节点数值和抽成动态代表概念性的变现机制；确切的交换费和卡组织费用拆分属于非公开数据。
