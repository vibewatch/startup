figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 展示从 2012 年成立到 2024 年信贷再融资期间的关键公司、融资、产品和运营里程碑。
    data:
      items:
        - date: '2012'
          label: 公司成立与首款读卡器
          detail: Daniel Klein、Jan Deepen、Marc-Alexander Christ 和 Stefan Jeschonnek 创办 SumUp；推出自有蓝牙 mPOS 设备。
          tone: positive
        - date: '2013'
          label: A 轮融资与欧洲扩张
          detail: 从 Shortcut Ventures 和 b-to-v Partners 获得 €10M A 轮融资；将业务拓展至英国、德国和奥地利。
          tone: positive
        - date: '2016'
          label: 进入拉美与支付 API
          detail: 进入巴西及更广泛的拉丁美洲市场；推出远程支付、虚拟终端和在线开票功能。
          tone: neutral
        - date: '2020'
          label: POS 收购：Goodtill 与 Tiller
          detail: 收购 Goodtill（酒店业 POS）和 Tiller Systems（餐饮 POS），从独立读卡器硬件拓展出去。
          tone: positive
        - date: '2021'
          label: 收购 Fivestars 与 €750M 债务
          detail: 以 $317M 收购美国商户忠诚度网络 Fivestars，并完成由 Goldman Sachs 主导的 €750M 债务融资工具。
          tone: neutral
        - date: '2022'
          label: €590M 股权轮，估值 €8B
          detail: 由 Bain Capital Tech Opportunities 领投，融资 €590M（$624M），估值 €8B（$8.5B）；第四季度实现 EBITDA 盈利。
          tone: positive
        - date: '2023'
          label: F 轮融资与 Tap to Pay
          detail: 获得由 Sixth Street Growth 领投的 €285M F 轮融资；推出商户现金预支和 iPhone Tap to Pay。
          tone: neutral
        - date: '2024'
          label: €1.5B 私募信贷再融资
          detail: 获得由 Goldman Sachs 领投的 €1.5B 私募信贷融资工具，用于再融资早期债务；年交易笔数超过 10 亿。
          tone: positive
    approximationNotes: 里程碑日期来自新闻稿、公司新闻室档案和财经媒体报道。
    claimRefs:
      - CO012
  - id: FM001
    title: 市场规模透视金字塔
    type: pyramid
    summary: 可触达市场规模从全球支付总额逐层收窄，直至 SumUp 服务的小商户当前运行率。
    data:
      nodes:
        - label: 全球小商户支付额
          value: 45000
