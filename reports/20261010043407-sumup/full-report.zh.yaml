            title: 微型商户留存与企业 POS 壁垒
            body: SumUp 依靠低门槛硬件定价快速获客，但微型商户因小企业死亡率较高，流失天然高于中端软件合同。平台能否长期耐用，很大程度取决于能否成功附加银行账户、开票工具和会员功能，把 SumUp 嵌入商户核心运营流程。
