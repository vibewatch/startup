  - id: FP001
    title: 竞争定位：运营复杂度与商业摩擦
    type: quadrant
    summary: 从运营工作流复杂度和前期商业承诺两个维度，评估 POS 与商户收单平台。
    data:
      xAxis:
        label: 运营工作流复杂度（1 = 微型 / 即插即用，10 = 企业 ERP / 多门店）
      yAxis:
        label: 商业与硬件摩擦（1 = 免费 / 无合同随用随付，10 = 长期锁定 / 高资本开支）
      points:
        - label: SumUp
          x: 2.5
          'y': 1.5
          detail: 低摩擦移动收款，配备基础目录工具
        - label: Square
          x: 5.5
          'y': 2.5
          detail: 覆盖广泛的 SMB 生态，基础软件免费并提供模块化附加功能
        - label: PayPal POS（Zettle）
          x: 3
          'y': 2
          detail: 简易移动终端搭配 PayPal 数字钱包通道
        - label: Clover
          x: 7
          'y': 7.5
          detail: 功能丰富的台面 POS，需要按月支付软件费并签订商户合同
        - label: Toast
          x: 8.5
          'y': 6.5
          detail: 专注餐饮的运营系统，支持多门店管理
        - label: NMI / 白标
          x: 6
          'y': 5
          detail: 模块化支付网关，需要接入 ISO 合作伙伴
    approximationNotes: 定位依据 RFP.wiki、FitSmallBusiness 和 ExpertMarket 记录的公开硬件成本、合同义务及软件能力进行序数综合。
