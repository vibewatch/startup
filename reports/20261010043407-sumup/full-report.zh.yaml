            body: >-
              SumUp 的商户生命周期遵循典型的落地并扩张路径：先将低成本读卡器买家转化为更广泛的商业银行和软件订阅客户。初次接触通常始于独立硬件设备或 Payment Link 软件，随后迅速扩展到带集成借记卡的免费
              SumUp Business Account，以加快资金结算。可是，推动商户继续进入软件变现环节会遇到明显摩擦。美国小企业实证调查显示，73.2%
