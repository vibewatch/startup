        - label: 产品生态扩张（支付、POS 终端、企业账户）
        - label: 收入变现组合（交易手续费与软件订阅）
        - label: 资本结构约束（$1.6B+ 常规债务融资额度）
        - label: 宏观经济与披露不透明（微型商户流失与缺乏经审计的利润率）
