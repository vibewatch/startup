  - id: FU001
    title: 商户客户旅程图：从获客到多产品扩张的生命周期演进
    type: journey-map
    summary: 展示商户从数字发现、硬件激活，到绑定银行服务、采用忠诚度产品并扩展至多门店运营的生命周期阶段。
    data:
      items:
        - label: 数字发现与自助获客
          touchpoints:
            - 直接 Web 流量（sumup.com 的直接访问占比 62%）
            - 口碑转介绍与同行推荐
            - 零售合作伙伴的硬件展示或线上店铺下单
          tone: neutral
        - label: 硬件激活与零订阅设置
          touchpoints:
            - 商户几分钟内完成自助数字入驻
            - 独立读卡器设置（Solo Lite / Go），无月租
            - 首笔交易按每次 2.6% 加 10c 处理
          tone: positive
        - label: 日常线下与远程核心处理
          touchpoints:
            - 使用 POS Lite 或独立 SumUp Terminal 进行 POS 结账
            - 无需硬件的开票与远程 Payment Links
            - 实时支付确认与每日销售跟踪
          tone: positive
        - label: Business Account 与银行交叉销售
          touchpoints:
            - 免费开通带 Mastercard 借记卡的 SumUp Business Account
            - 次日及周末可使用结算资金
            - 直接支付供应商账单并使用费用借记卡
          tone: positive
        - label: 软件与合规升级
          touchpoints:
            - 升级 POS Plus 高级订阅
            - 楼面平面图管理与条码扫描器集成
            - 内嵌 Sage Making Tax Digital 自动报税
          tone: neutral
        - label: 客户忠诚度与留存互动
          touchpoints:
            - 部署 SumUp Connect 忠诚度计划（73.2% 的未采用缺口）
            - AutoPilot 短信营销与复购客户激励
            - 客户消费分析，推动重复到店
          tone: warning
        - label: 向上扩张与多终端规模化
          touchpoints:
            - 在商业门店铺设多终端硬件（如 Gong cha）
            - 员工 PIN 管理与多打印机厨房票据
            - 在私募信贷约束下审核营运资金预支
          tone: warning
    approximationNotes: 生命周期阶段和触点综合自 SumUp 商户产品架构、官方定价层级及小企业留存调查数据。
    claimRefs:
      - CU002
      - CU004
      - CU005
      - CU014
