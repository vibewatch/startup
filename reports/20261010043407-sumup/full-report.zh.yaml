            body: >-
              供应商资料确认了嵌入式 Zephyr/LVGL 实现、已采用的流式数据平台和自动化本地化技术栈。这些都是具体实现信号，但每家供应商都与 SumUp 存在商业关系，不能算独立验证 [CE003, CE004,
