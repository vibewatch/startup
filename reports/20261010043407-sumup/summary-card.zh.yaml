  topStrengths:
    - 商户基础庞大且稳固：覆盖 36 个以上市场、服务超过 400 万家企业客户。
    - 产品生态已从单一读卡器扩展到支付、POS 软件、商业银行和融资。
    - 经营层面实现盈利，加上私募信贷再融资，提升了资本灵活性，也避免了进一步股权稀释。
