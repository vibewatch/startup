  topStrengths:
    - Large and durable merchant footprint with more than 4 million business customers across 36+ markets.
    - >-
      Broader product ecosystem now spans payments, POS software, business banking, and financing rather than only card
      readers.
    - >-
      Operational profitability and private-credit refinancing improved capital flexibility without further equity
      dilution.
  topRisks:
    - >-
      Audited revenue, gross margin, take-rate, and covenant disclosure remain private, limiting underwriting
      confidence.
    - >-
      Heavy leverage and dependence on private credit increase refinancing and downside risk if merchant activity
      softens.
    - Merchant churn, pricing pressure, and regulatory/compliance exposure could compress unit economics.
  unresolvedGaps:
    - >-
      Audited consolidated revenue, gross margin, take-rate, and segment-mix disclosure are still missing from the
      public record.
    - >-
      Debt maturity, covenant, collateral, and liquidation-preference terms are not public, so common-equivalent
      downside remains hard to judge.
    - >-
      Customer retention, concentration, and enterprise revenue contribution are still not visible enough to justify
      premium-comp valuation treatment.
