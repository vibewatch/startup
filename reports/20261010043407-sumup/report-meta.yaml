companyProfile:
  summary: >-
    SumUp is a 2012-founded SMB fintech headquartered in London and Berlin that sells card readers, point-of-sale
    software, business accounts with cards, invoicing, loyalty tools, and merchant financing to micro and small
    businesses across more than 36 markets. The company reports more than 4 million business customers, sustained EBITDA
    profitability since late 2022, and a May 2024 private credit refinancing that preserved equity while extending
    balance-sheet capacity. Public disclosure still leaves the consolidated revenue base, margins, take-rate, and
    covenant terms opaque.
