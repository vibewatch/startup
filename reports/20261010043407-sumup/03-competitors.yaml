callouts:
  - calloutType: insight
    title: Micro-Merchant Economics Favor Transparent Flat-Rate Acquiring
    body: For mobile sole traders and seasonal vendors processing under £4,000 monthly, SumUp's 1.69% flat processing fee and sub-£30 hardware minimize upfront hurdle rates, delivering superior unit cost compared to subscription-heavy POS terminals like Clover or Square's slightly higher 1.75% card-present rate.
    claimRefs:
      - CP002
      - CP003
  - calloutType: risk
    title: Customer Support Friction Accelerates Upmarket Churn
    body: Automated chatbot triage and limited weekend live support represent SumUp's primary operational vulnerability, driving growing merchants with multi-terminal setups toward dedicated vertical POS platforms when hardware connectivity or payout freezes occur.
    claimRefs:
      - CP009
      - CP010
