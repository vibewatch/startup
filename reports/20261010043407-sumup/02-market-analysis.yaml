callouts:
  - calloutType: "insight"
    title: "Market Expansion via Micro-SaaS Subscription Tiers"
    body: "SumUp is actively expanding beyond purely transactional mPOS transaction fees by introducing fixed-fee software tiers like POS Plus ($49/month in the U.S.). This strategy shifts the customer relationship from episodic micro-merchant hardware usage toward recurring SaaS software revenue, improving customer retention among higher-volume quick-service and cafe operators."
    claimRefs:
      - "CM010"
      - "CM004"
  - calloutType: "risk"
    title: "Take-Rate Compression and Micro-Merchant Churn"
    body: "Because SumUp relies heavily on sole traders and micro-enterprises with high baseline business failure rates, customer acquisition costs must remain exceptionally low. Furthermore, as merchants grow in transaction volume, flat-rate transaction pricing faces intense margin competition from specialized POS providers like Epos Now offering volume discounts."
    claimRefs:
      - "CM012"
      - "CM009"
