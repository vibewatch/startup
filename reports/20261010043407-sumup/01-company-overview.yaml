      - "CO007"
      - "CO009"
  - calloutType: "risk"
    title: "Consolidated Financial Opacity and Private Multiple Valuation"
    body: "While SumUp reports positive EBITDA since late 2022, consolidated audited revenues and net take-rate remain withheld from public disclosures, with market observers relying on GetLatka estimates of $600 million for 2025. Confirming true unit economics and debt covenant margins remains essential for underwriting enterprise value."
    claimRefs:
