    title: "Private Credit Shift and Common Equity Preservation"
    body: "SumUp's May 2024 €1.5 billion debt financing represents a strategic reliance on private credit to refinance maturing facilities and fund merchant scale without triggering equity dilution. However, third-party tear sheets citing a $4.1 billion Series F in December 2023 underscore potential valuation compression relative to peak $8.5 billion marks."
