  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: private-credit-debt-terms
      missingEvidence: Audited credit agreement schedules detailing interest covenants, debt amortization timelines, cash sweep provisions, and senior lien structures for the $1.62B facility.
      whyItMatters: Without debt covenant and debt service schedules, common equity downside cannot be assessed under high interest-rate refinancing environments.
      diligencePath: Request confidential lender presentation materials, debt maturity profile, and compliance certificates in private data room review.
      relatedQuestionRefs:
        - QR008
    - type: enumeration-incomplete
      severity: material
      topic: regulatory-legal-risk-register-gap
      missingEvidence: Comprehensive regulatory filing register detailing full cross-border license status, capital adequacy reserves, and supervisory correspondence across all 38 jurisdictions.
      whyItMatters: Public sources only reveal broad operational footprints; local license revocation or regulatory capital calls in key European markets would impair processing continuity.
      diligencePath: Examine compliance audits, EMI passporting documentation, and central bank supervisory letters across primary European operating entities.
      relatedTableRefs:
        - TR001
    - type: missing-source
      severity: material
      topic: consolidated-unit-economics
      missingEvidence: Audited segment revenue, net take-rates across transaction types, hardware gross margins, and merchant cohort churn metrics.
      whyItMatters: Disclosed pricing of 1.69% to 2.6% lacks interchange and network fee deduction details, masking underlying processing gross margin durability.
      diligencePath: Request audited consolidated P&L statements with merchant cohort retention and interchange fee breakdown.
