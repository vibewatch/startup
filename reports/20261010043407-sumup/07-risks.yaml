callouts:
  - calloutType: risk
    title: Senior Private Debt Service and Capital Overhang
    body: SumUp's $1.62 billion private credit financing completed in May 2024 places significant senior debt service obligations ahead of equity holders. Without public visibility into maturity dates, interest covenants, and cash sweep provisions, refinancing risk represents a primary vulnerability under persistent high interest rates.
    claimRefs:
      - CR003
      - CR004
      - CR012
  - calloutType: insight
    title: SoftPOS Proliferation Threatens Terminal Hardware Differentiation
    body: The mainstream rollout of Tap to Pay on commercial smartphones by Apple and Android platforms diminishes the competitive moat of dedicated card reader terminals. SumUp must increasingly drive merchant monetization through software subscriptions, business accounts, and embedded financial services rather than hardware sales.
    claimRefs:
      - CR007
      - CR008
      - CR014
