evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: audited-financial-metrics
    missingEvidence: >-
      Audited consolidated annual GAAP revenue, annual recurring revenue (ARR) breakdown, gross margin percentage, and
      net take-rate disclosures.
    whyItMatters: >-
      Without audited top-line figures and take-rates, valuation multiples rely on third-party estimates (such as
      GetLatka's $600M estimate) rather than verified financial performance.
    diligencePath: >-
      Review UK Companies House statutory accounts for SUMUP PAYMENTS LIMITED and parent holding entities to extract
      audited revenue and operating margin.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: investor-capital-structure
    missingEvidence: >-
      Complete capitalization table detailing liquidation preferences, dividend covenants, voting control, and exact
      secondary share sales across equity series.
    whyItMatters: >-
      Senior debt facilities of €1.5B combined with multi-class preferred equity create complex subordination structures
      that affect common shareholder recovery in downside scenarios.
    diligencePath: >-
      Request confidential cap table disclosures, private credit credit-agreement exhibits, and shareholder register
      filings during confirmatory diligence.
    relatedQuestionRefs: []
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Audited consolidated take-rate, gross margin, and cohort-level merchant retention data broken down by geography
      and product line.
    whyItMatters: >-
      Without segmented revenue disclosures, addressable market conversion and long-term customer lifetime value cannot
      be independently verified against top-down industry benchmarks.
    diligencePath: >-
      Review audited statutory financial filings for core European operating entities (e.g., SumUp Payments Limited in
      the UK and German operating subsidiaries) or request management disclosure during formal diligence.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: merchant-displacement
    missingEvidence: >-
      Audited cohort churn and displacement telemetry measuring how many merchants abandon SumUp for full-stack POS
      suites as annual GMV exceeds $250,000.
    whyItMatters: >-
      Without segmented retention data, it is difficult to determine whether SumUp operates as a permanent operating
      system for mature SMBs or primarily as an entry-level stepping stone.
    diligencePath: >-
      Request management disclosure of net revenue retention (NRR) and logo churn partitioned by merchant annualized
      transaction volume bands.
    relatedQuestionRefs:
      - QP009
  - type: missing-source
    severity: material
    topic: consolidated-financial-reporting
    missingEvidence: >-
      Audited consolidated income statements, balance sheets, and cash flow statements detailing global gross margin,
      merchant take-rate, and regional revenue breakdown.
    whyItMatters: >-
      Without audited segment disclosures, underwriting cannot verify whether transaction margins absorb hardware
      subsidies, interchange, and scheme fees or determine true unit economics.
    diligencePath: >-
      Request audited consolidated IFRS or GAAP annual accounts from management, including segment reporting for
      payments, hardware, and banking services.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: private-credit-covenants
    missingEvidence: >-
      Full credit agreement terms, maturity schedules, interest margins, minimum liquidity covenants, and collateral
      pledges for the €1.5B private credit facility led by Goldman Sachs.
    whyItMatters: >-
      Debt service obligations on a €1.5B credit facility senior to equity directly determine cash flow headroom and
      downside equity dilution risk under adverse macroeconomic conditions.
    diligencePath: >-
      Obtain the credit agreement, compliance certificates, and debt repayment schedule as part of institutional
      diligence.
    relatedQuestionRefs:
      - QI005
  - type: private-evidence-only
    severity: material
    topic: security-assurance
    missingEvidence: >-
      Current independent audit reports, certification scope, penetration-test summaries, privacy-control mappings, and
      remediation status for the merchant product stack.
    whyItMatters: >-
      Company-authored security guidance shows user controls but cannot establish control design, operating
      effectiveness, or residual exposure.
    diligencePath: >-
      Request current SOC or equivalent reports, PCI scope, security certifications, penetration-test executive
      summaries, privacy assessments, and remediation logs.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: material
    topic: service-reliability
    missingEvidence: >-
      Product-level uptime history, incident frequency, recovery objectives, authorization latency, support SLA
      attainment, and merchant-impact metrics.
    whyItMatters: >-
      Journey-level SLO practice is a useful signal, but underwriting reliability requires measured outcomes and
      incident history.
    diligencePath: >-
      Obtain status-page exports, SLO dashboards, severity-one incident reviews, disaster-recovery tests, and support
      queue performance by market.
    relatedQuestionRefs:
      - QE007
  - type: missing-source
    severity: material
    topic: roadmap
    missingEvidence: A dated portfolio roadmap showing committed releases, dependencies, deprecations, and market rollout sequencing.
    whyItMatters: >-
      The assigned sources expose individual product and engineering signals but do not establish delivery commitments
      across the portfolio.
    diligencePath: >-
      Request the board-approved product roadmap, quarterly delivery history, dependency register, and release-quality
      metrics.
    relatedQuestionRefs:
      - QE006
  - type: missing-source
    severity: material
    topic: cohort-retention-and-churn
    missingEvidence: >-
      Audited cohort retention schedules, Net Revenue Retention (NRR), Gross Revenue Retention (GRR), and annualized
      merchant churn rates disaggregated by micro-merchant versus multi-location accounts.
    whyItMatters: >-
      Without verified retention cohorts, it is difficult to determine whether top-line customer growth reflects
      sustainable lifetime value or high merchant churn offset by continuous front-end acquisition.
    diligencePath: >-
      Request historical merchant cohort analysis, trailing 12-month dollar retention rates, and churn by vintage during
      management diligence.
    relatedQuestionRefs:
      - QU009
