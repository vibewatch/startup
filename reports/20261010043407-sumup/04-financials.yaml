callouts:
  - calloutType: "insight"
    title: "Multi-Product Flywheel Offsets Micro-Merchant Churn"
    body: "SumUp's strategic expansion into free business banking accounts—surpassing 1 million accounts in Europe and Brazil—functions as a high-retention anchor. By integrating payments with card issuance, merchant cash advances, and working capital, SumUp captures interchange revenue and balances micro-merchant mortality with higher lifetime customer value."
    claimRefs:
      - "CI002"
      - "CI003"
      - "CI011"
  - calloutType: "risk"
    title: "Private Credit Leverage and Valuation Markdown Uncertainty"
    body: "While SumUp successfully secured a €1.5 billion private credit facility led by Goldman Sachs to refinance earlier debt, debt service burdens in a higher interest rate environment constrain cash flow. Furthermore, secondary market valuation marks diverge sharply—ranging from Tracxn's $4.1 billion post-money record to secondary listings at $8.5 billion—presenting substantial valuation uncertainty."
    claimRefs:
      - "CI005"
      - "CI006"
      - "CI007"
