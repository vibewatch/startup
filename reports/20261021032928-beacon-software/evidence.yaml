evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Exact legal entity records, capitalization table, board composition, voting rights, investor protective
      provisions, and succession plan.
    whyItMatters: >-
      Governance and control determine dilution, acquisition authority, financing flexibility, and exposure to founder
      departures.
    diligencePath: >-
      Request the corporate organization chart, charter documents, cap table, voting agreements, investor side letters,
      board minutes, and key-person succession plan in the management data room.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-scale
    missingEvidence: >-
      Current consolidated revenue, ARR, EBITDA, cash flow, leverage, cash balance, acquisition commitments, headcount,
      and complete office footprint.
    whyItMatters: >-
      Portfolio and funding counts cannot establish operating scale, capital availability, integration burden, or
      valuation support.
    diligencePath: >-
      Obtain audited consolidated statements, current management accounts, debt and liquidity schedules, subsidiary KPI
      rollups, employee census, and legal-entity-by-location list.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: leadership
    missingEvidence: >-
      Complete executive roster, reporting lines, tenure, board membership, leadership changes, and named successors for
      acquisition and technology functions.
    whyItMatters: >-
      Public evidence concentrates strategy and operating claims in the two founders, obscuring management depth and
      key-person dependence.
    diligencePath: >-
      Request the current organization chart, executive biographies, employment agreements, retention data, board
      roster, and leadership-change log.
    relatedQuestionRefs:
      - QO002
      - QO010
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: minor
    topic: funding
    missingEvidence: >-
      A company-issued financing history reconciling the US$475 million total for Series B and C with reports of more
      than US$550 million cumulative external funding.
    whyItMatters: >-
      The difference affects dilution history and prevents precise attribution of earlier capital, although the two
      figures use different denominators.
    diligencePath: >-
      Request the full preferred-stock and financing schedule with dates, primary proceeds, secondary proceeds, and
      post-money capitalization.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      A current count and ARR distribution of eligible acquisition targets, target purchase multiples, portfolio
      end-customer spend, and independently sourced category forecasts on a common geography and period.
    whyItMatters: >-
      Without common denominators, the public target ceiling, portfolio reach, and SMB adoption statistics cannot
      support a dollar TAM, SAM, or SOM.
    diligencePath: >-
      Obtain Beacon's acquisition pipeline and portfolio ARR data, segment it by vertical and geography, and triangulate
      each segment against independent industry datasets.
    relatedQuestionRefs:
      - QM004
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: conversion-economics
    missingEvidence: >-
      Cohort-level AI attach rate, implementation time, average contract value, expansion ARR, retention, gross margin,
      security incidents, and realized acquisition returns.
    whyItMatters: >-
      These metrics determine whether the apparent installed distribution and SMB demand convert into durable
      incremental cash flow.
    diligencePath: >-
      Review board reporting and a representative acquisition cohort, reconcile contracts to billing, and interview
      customers and portfolio general managers.
    relatedQuestionRefs:
      - QM010
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: pricing-comparison
    missingEvidence: >-
      Matched acquisition multiples, seller consideration, earn-out formulas, central-service charges, and realized
      transaction economics across Beacon and named peers.
    whyItMatters: >-
      Without like-for-like terms, investors cannot determine whether Beacon's seller proposition is differentiated or
      whether acquisition competition is compressing returns.
    diligencePath: >-
      Request a cohort-level deal book from Beacon and compare signed purchase agreements, earn-out terms, and
      post-close service allocations with matched peer transactions.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: independent-outcomes
    missingEvidence: >-
      Independent cohort benchmarks for revenue growth, EBITDA change, retention, product velocity, and integration cost
      before and after Beacon ownership.
    whyItMatters: >-
      Company-reported operating improvement does not establish causality or durability relative to established
      consolidators and other AI roll-ups.
    diligencePath: >-
      Obtain subsidiary-level monthly operating data and commission a matched-cohort analysis against comparable
      vertical-software acquisitions over at least 24 months.
    relatedQuestionRefs:
      - QP010
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure-gaps
    missingEvidence: >-
      Audited consolidated income statement, balance sheet, cash-flow statement, and subsidiary financial schedules with
      organic and acquired growth separated.
    whyItMatters: >-
      Without these records, reported profitability and EBITDA growth cannot be reconciled to revenue quality, gross
      margin, working capital, or free cash flow.
    diligencePath: >-
      Request audited statements, monthly management accounts, and acquisition-cohort reporting through the latest
      closed month.
    relatedQuestionRefs:
      - QI001
      - QI004
      - QI005
      - QI008
    relatedTableRefs:
      - TI001
      - TI003
  - type: conflicting-data
    severity: material
    topic: total-funding
    missingEvidence: >-
      A company-prepared capitalization and financing schedule reconciling the $475M database total with contemporary
      reports of more than $500M or $550M.
    whyItMatters: The discrepancy affects capital-deployment analysis and prevents a reliable proceeds-to- acquisitions bridge.
    diligencePath: >-
      Obtain closing documents, gross and net proceeds, issuance dates, fees, and investor allocations for every
      financing.
    relatedQuestionRefs:
      - QI006
      - QI007
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: liquidity-and-obligations
    missingEvidence: >-
      Cash on hand, burn, runway, debt and covenant schedules, acquisition consideration, earn-out liabilities,
      working-capital commitments, and planned capital deployment.
    whyItMatters: >-
      Funding raised is not cash available, and rapid acquisition cadence can create obligations that are invisible in
      announced equity totals.
    diligencePath: >-
      Review treasury statements, lender agreements, purchase-price allocations, earn-out schedules, board budgets, and
      downside liquidity scenarios.
    relatedQuestionRefs:
      - QI002
      - QI006
      - QI007
      - QI008
    relatedTableRefs:
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: pricing-and-retention
    missingEvidence: >-
      Product-level list and realized pricing, contract length, discounting, gross retention, net retention, customer
      acquisition cost, payback, channel fees, and concentration.
    whyItMatters: >-
      These inputs determine whether portfolio revenue is durable and whether growth reflects customer value rather than
      acquisition volume.
    diligencePath: >-
      Request anonymized contracts, billing cohorts, renewal waterfalls, pipeline conversion, and customer-concentration
      schedules for representative subsidiaries.
    relatedQuestionRefs:
      - QI001
      - QI002
      - QI003
      - QI008
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: architecture-gap
    missingEvidence: >-
      Current architecture diagrams, service boundaries, model-provider inventory, data flows, tenancy design and
      portfolio deployment coverage.
    whyItMatters: Without these artifacts, shared-platform reuse and integration complexity cannot be tested.
    diligencePath: >-
      Request a CTO-led architecture review plus diagrams and deployment inventory for a representative set of
      subsidiaries.
    relatedQuestionRefs:
      - QE003
      - QE004
    relatedTableRefs:
      - TE001
      - TE003
  - type: missing-source
    severity: material
    topic: controls-gap
    missingEvidence: >-
      Status history, SLAs, incident logs, security certifications, privacy controls, model-risk policy and reliability
      benchmarks.
    whyItMatters: Named testing tools do not show whether controls are deployed consistently or work in production.
    diligencePath: >-
      Obtain trust-center materials, SOC reports, penetration-test summaries, incident metrics and subsidiary-level
      reliability dashboards.
    relatedQuestionRefs:
      - QE004
      - QE006
      - QE007
    relatedTableRefs:
      - TE002
      - TE003
  - type: missing-source
    severity: material
    topic: developer-signal-gap
    missingEvidence: >-
      A public repository, package, API documentation, engineering talk or practitioner-community proxy with activity
      and adoption evidence.
    whyItMatters: >-
      The absence of a developer surface prevents external assessment of implementation cadence, ecosystem adoption and
      technical depth.
    diligencePath: >-
      Request private repository and release metrics, API documentation, contributor history and references from
      portfolio engineering leaders.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: deployment-outcomes
    missingEvidence: >-
