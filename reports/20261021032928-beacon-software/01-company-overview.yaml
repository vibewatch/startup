company:
  name: Beacon Software
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Beacon Software is a Toronto-based, venture-backed permanent-capital owner of
    vertical software businesses, founded in 2024 by Nilam Ganenthiran and Divya
    Gupta. Its US$225 million Series C in June 2026 brought reported cumulative
    funding above US$550 million and a third-party-reported US$1.4 billion
    valuation, but consolidated revenue, headcount, board composition, and control
    rights remain undisclosed.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: >-
      Beacon Software was founded in 2024 in Toronto by Nilam Ganenthiran and
      Divya Gupta. Ganenthiran previously served as Instacart president and
      invested at D1 Capital Partners; Gupta was previously a Sequoia Capital
      partner. Beacon is not presented as a conventional finite-life buyout fund:
      it acquires profitable or near-profitable vertical software companies,
      intends to hold them indefinitely, and supplies shared engineering,
      artificial-intelligence, go-to-market, and back-office capabilities.
      Subsidiaries retain their brands and operating teams. This structure makes
      the founders' acquisition judgment and the central acceleration team's
      execution important dependencies, while public evidence does not identify a
      broader executive bench or board.
    claimRefs: [CO001, CO002, CO003, CO012, CO013]
    tableRefs: [TO001, TO002]
  - id: capital-and-stakeholders
    title: Capital formation and stakeholder structure
    body: >-
      Beacon raised a US$250 million Series B in November 2025 at a reported
      US$1 billion valuation, followed by a US$225 million Series C on June 9,
      2026. General Catalyst and HarbourVest led the Series C, with several
      returning and new institutional participants. Contemporary reports put
      cumulative external funding above US$550 million after the round, whereas
      Multiples totals US$475 million across the disclosed Series B and Series C;
      the narrower figure therefore should not be presented as lifetime funding.
      Multiples and BetaKit report a US$1.4 billion Series C valuation, but the
      company and its counsel did not publish that valuation in the retained
      source text.
    claimRefs: [CO004, CO005, CO006, CO007]
    tableRefs: [TO003]
  - id: scale-and-milestones
    title: Scale and operating milestones
    body: >-
      By June 2026, independent reporting said Beacon had acquired more than 30
      businesses and was completing roughly one acquisition per week. A
      September 2026 market profile counted 45 portfolio companies, while a
      company-founder post said those companies served more than 22,000
      businesses and institutions. These figures describe portfolio breadth, not
      Beacon's consolidated revenue, ARR, customer contracts, or cash generation.
      The operating thesis also expanded beyond acquisition support: a February
      2026 company release targeted access to OpenAI certifications for 500,000
      Main Street workers, and later company-originated material described the
      acquisition of Haize Labs to add AI testing and safety capability.
    claimRefs: [CO008, CO009, CO010, CO011, CO015, CO016]
    figureRefs: [FO001]
  - id: underwriting-implications
    title: Underwriting implications and unresolved governance
    body: >-
      The evidence establishes substantial capital access and a rapid acquisition
      cadence, but it does not yet establish that the portfolio creates durable
      economic value. Reuters noted that long-term returns from AI-enabled roll-up
      models remain untested. Beacon told Reuters that it was profitable as an
      entity and that targets were consistently profitable, yet no retained source
      provides consolidated revenue, ARR, EBITDA, cash flow, leverage, or purchase
      multiples. The assigned evidence also does not disclose the exact legal
      entity, board membership, voting rights, liquidation preferences, or
      investor consent rights. Those omissions prevent a complete assessment of
      governance, dilution, key-person exposure, and capital available for future
      acquisitions.
    claimRefs: [CO012, CO013, CO014]
