  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: governance
      missingEvidence: >-
        Exact legal entity records, capitalization table, board composition,
        voting rights, investor protective provisions, and succession plan.
      whyItMatters: >-
        Governance and control determine dilution, acquisition authority,
        financing flexibility, and exposure to founder departures.
      diligencePath: >-
        Request the corporate organization chart, charter documents, cap table,
        voting agreements, investor side letters, board minutes, and key-person
        succession plan in the management data room.
      relatedQuestionRefs: [QO010]
      relatedTableRefs: [TO002, TO003]
    - type: private-evidence-only
      severity: material
      topic: financial-scale
      missingEvidence: >-
        Current consolidated revenue, ARR, EBITDA, cash flow, leverage, cash
        balance, acquisition commitments, headcount, and complete office footprint.
      whyItMatters: >-
        Portfolio and funding counts cannot establish operating scale, capital
        availability, integration burden, or valuation support.
      diligencePath: >-
        Obtain audited consolidated statements, current management accounts,
        debt and liquidity schedules, subsidiary KPI rollups, employee census,
        and legal-entity-by-location list.
      relatedQuestionRefs: [QO006]
      relatedTableRefs: [TO001]
    - type: enumeration-incomplete
      severity: material
      topic: leadership
      missingEvidence: >-
        Complete executive roster, reporting lines, tenure, board membership,
        leadership changes, and named successors for acquisition and technology
        functions.
      whyItMatters: >-
        Public evidence concentrates strategy and operating claims in the two
        founders, obscuring management depth and key-person dependence.
      diligencePath: >-
        Request the current organization chart, executive biographies, employment
        agreements, retention data, board roster, and leadership-change log.
      relatedQuestionRefs: [QO002, QO010]
      relatedTableRefs: [TO002]
    - type: conflicting-data
      severity: minor
      topic: funding
      missingEvidence: >-
        A company-issued financing history reconciling the US$475 million total
        for Series B and C with reports of more than US$550 million cumulative
        external funding.
      whyItMatters: >-
        The difference affects dilution history and prevents precise attribution
        of earlier capital, although the two figures use different denominators.
      diligencePath: >-
        Request the full preferred-stock and financing schedule with dates,
        primary proceeds, secondary proceeds, and post-money capitalization.
      relatedQuestionRefs: [QO004]
      relatedTableRefs: [TO001, TO003]
