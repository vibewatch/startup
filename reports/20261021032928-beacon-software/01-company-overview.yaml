callouts:
  - calloutType: risk
    title: Rapid deployment does not prove realized returns
    body: >-
      The acquisition cadence and capital raised are visible, but independent
      reporting explicitly says long-term returns from AI roll-ups remain untested.
    claimRefs: [CO008, CO014]
  - calloutType: assumption
    title: Funding totals use different denominators
    body: >-
      US$475M is the sum of the disclosed Series B and C, while contemporary
      reporting says cumulative funding exceeded US$550M after including earlier
      capital. Neither amount is cash currently available.
    claimRefs: [CO004, CO005, CO006]
