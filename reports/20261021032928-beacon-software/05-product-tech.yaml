      - Prior or current workflow
      - Beacon-enabled solution
      - Publicly evidenced benefit
      - Limitation
    rows:
      - ["Modernize a niche software product", "Local product and operations stack", "Central acceleration team rewrites products and automates operations", "Faster product development is reported as the intended operating effect", "No before/after release-speed, quality or cost measure"]
      - ["Run soccer-club administration", "Club registration and roster workflows", "PowerUp Sports remains a portfolio application surface", "Existing club workflow remains available under its brand", "No migration, uptime or adoption disclosure"]
      - ["Run league competition", "Scheduling, referee assignment and discipline workflows", "E2E Soccer capabilities are combined with PowerUp Sports", "Announced end-to-end scope across club and league administration", "Outcome claims originate from company-announced transaction details"]
      - ["Deploy enterprise AI agents", "Testing and monitoring assembled by each product team", "Haize tooling adds simulation, adversarial tests, guardrails and evaluations", "Named reliability functions are present at the acquired-team level", "No disclosed portfolio coverage, benchmark or incident-reduction result"]
      - ["Build workforce AI skills", "Training sourced independently by small organizations", "OpenAI certifications offered through Beacon's customer network", "Announced target access for 500,000 workers", "Access target is not measured participation or proficiency"]
    notes: >-
      Benefits are limited to what the sources state or directly imply; no row should be read as
      evidence of realized ROI, conversion, reliability, uptime or full portfolio deployment.
    claimRefs: [CE002, CE004, CE005, CE007, CE008]
  - id: TE003
    title: Technology and operating architecture
    columns:
      - Layer or process
      - Publicly described role
      - Dependency
      - Principal risk
    rows:
      - [Portfolio application layer, "Hosts domain-specific customer workflows under acquired brands", "Legacy codebases, local teams and customer trust", "Heterogeneous stacks may constrain reuse and migration"]
      - [Product acceleration layer, "Rewrites products and speeds development", "Central engineers and product managers", "No disclosed throughput, quality gates or subsidiary coverage"]
      - [Operations automation layer, "Automates functions including accounting and payroll", "Access to subsidiary processes and data", "Control, privacy and change-management design is undisclosed"]
      - [AI-native operating-system layer, "Intended shared platform for acquired businesses", "Continued platform development and integration", "Roadmap language may precede production standardization"]
      - [AI reliability layer, "Tests, evaluates and guards enterprise AI agents", "Haize Labs technology and Applied AI Research Group", "No public benchmark, rollout status or control-effectiveness evidence"]
      - [Enablement and distribution layer, "Extends AI training and tools through portfolio customer networks", "Portfolio reach and external partners such as OpenAI", "Announced reach may not convert to product usage or customer outcomes"]
    notes: >-
      This is a conceptual operating-layer map reconstructed from public descriptions, not a
      validated systems diagram; interfaces, infrastructure vendors, data flows and deployment topology are unavailable.
    claimRefs: [CE001, CE002, CE003, CE004, CE005, CE013, CE014, CE015]
