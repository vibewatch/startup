schemaVersion: "report-v2"
artifact: financials
slug: beacon-software
runDate: 2026-10-21
company:
  name: Beacon Software
chapter:
  number: 4
  title: Financials
  summary: >-
    Beacon has demonstrated access to acquisition capital and publicly claims a profitable holdco,
    faster acquisition cadence, and more than 50% portfolio EBITDA growth. The underwriting case
    remains incomplete because consolidated revenue, pricing, gross margin, cash, burn, runway,
    debt, acquisition consideration, and subsidiary-level financials are not disclosed.
sections:
  - id: revenue-model
    title: Revenue model and revenue quality
    body: >-
      Beacon is an acquisition-led holding company rather than a single-product SaaS vendor.
      Reuters reported that it buys profitable niche software companies that typically generate
      less than $20 million of annual recurring revenue, while SiliconANGLE described operating
      support spanning accounting, go-to-market expertise, product improvement, and acquisition
      capital. This establishes recurring software revenue at the portfolio-company level, but it
      does not reveal Beacon's consolidated revenue, revenue mix, recognition policy, organic
      growth, or cash conversion. An independent profile also describes embedded payment,
      banking, and payroll capabilities, but no take rate or contribution is disclosed. The
      resulting revenue quality may benefit from niche recurring software and profitable targets,
      yet it cannot be quantified without subsidiary and consolidation schedules.
    claimRefs: [CI005, CI009, CI010, CI011, CI015, CI016]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: pricing-and-acquisition-efficiency
    title: Pricing and acquisition efficiency
    body: >-
      Public evidence is more informative about Beacon's acquisition throughput than about
      customer monetization. Reuters reported an acquisition pace of about one business every two
      weeks in November 2025; June 2026 coverage reported roughly one per week, and SiliconANGLE
      said deals usually close within 60 days after the process begins. These are useful deployment
      and sourcing proxies, not CAC, payback, sales-cycle, or channel-economics measures for the
      underlying software products. Cash-based founder earn-outs may align sellers with post-close
      performance, but their amounts, duration, hurdles, and balance-sheet treatment are private.
      No retained source provides list prices, realized prices, discounting, contract duration,
      renewal rates, or customer acquisition cost for the portfolio.
    claimRefs: [CI006, CI013, CI014, CI015]
    tableRefs: [TI002]
  - id: capital-and-unit-economics
    title: Capital base, operating leverage, and unit economics
    body: >-
      The June 2026 Series C supplied $225 million for additional acquisitions and development of
      Beacon's AI-native operating system. Contemporary sources put total outside funding above
      $500 million, with SiliconANGLE specifying more than $550 million, while FundedIQ records
      $475 million across two rounds; the difference likely reflects round coverage but cannot be
      reconciled from the retained evidence. Funding raised is not cash available: none of the
      sources discloses cash on hand, burn, runway, debt facilities, acquisition liabilities, or
      working-capital needs. Management's November 2025 claim that Beacon was profitable and its
      June 2026 claim of more than 50% portfolio EBITDA growth are encouraging signals, but neither
      substitutes for audited consolidated results, gross margins, free cash flow, or return on
      invested capital.
    claimRefs: [CI001, CI002, CI003, CI004, CI007, CI008, CI015]
    tableRefs: [TI003]
  - id: financial-verdict
    title: Financial verdict and underwriting blockers
    body: >-
      Beacon's public financial case rests on three linked propositions: acquire already-profitable
      vertical software assets, centralize operating work, and use AI-enabled product modernization
      to increase portfolio earnings. The model has credible early signals in reported acquisition
      cadence and claimed EBITDA growth, but independent coverage cautions that AI roll-ups remain
      untested and may accumulate integration debt. The repeated need for external equity also
      weakens the earlier expectation that the November 2025 financing would be the last round.
      Until management provides consolidated and subsidiary financials, acquisition cohorts,
      earn-out obligations, debt terms, organic versus acquired growth, gross margin, and cash-flow
      bridges, investors cannot distinguish durable operating leverage from capital-funded scale.
    claimRefs: [CI004, CI006, CI007, CI012, CI013, CI015]
tables:
  - id: TI001
    title: Revenue streams and monetization evidence
    columns:
      - Stream or economic source
      - Mechanism
      - Unit
      - Current evidence
      - Revenue-quality view
      - Diligence ask
    rows:
      - - Portfolio vertical software
        - Recurring software fees earned by acquired businesses
        - ARR by subsidiary
        - Targets typically generate less than $20M ARR and are consistently profitable
        - Recurring profile is favorable, but consolidated mix and retention are undisclosed
        - Provide subsidiary ARR, organic growth, NRR, churn, and concentration
      - - Portfolio services
        - Vertical software and services sold through acquired companies
        - Revenue by service line
        - Osler describes a portfolio of critical vertical software and services
        - Service intensity and gross-margin dilution cannot be measured
        - Disclose software-versus-services mix and delivery labor
      - - Embedded financial capabilities
        - Payment processing, banking, and payroll embedded in portfolio products
        - GMV, take rate, or fee revenue
        - Independent profile reports the capability; economics are not disclosed
        - Potentially attractive ancillary revenue, but evidence is low-detail
        - Provide GMV, net take rate, loss exposure, and partner economics
      - - Holdco operating return
        - Portfolio earnings and value creation after acquisition and modernization
        - EBITDA and cash flow
        - Company claims more than 50% portfolio EBITDA growth over the prior year
        - EBITDA growth is not revenue growth or cash conversion
        - Reconcile acquired, organic, and cost-driven EBITDA growth to cash flow
    notes: >-
      Sources are Reuters/Yahoo, Osler, SiliconANGLE, The Next Web, and AI Market Watch; portfolio
      metrics are reported or company-claimed, and no consolidated revenue mix is available.
    claimRefs: [CI005, CI007, CI009, CI011, CI015]
  - id: TI002
    title: Pricing, consideration, and contract evidence
    columns:
      - Economic item
      - Public price or term
      - Realized value
      - Discounts or contingencies
      - Underwriting implication
    rows:
      - - Portfolio software customer pricing
        - Not disclosed
        - Not disclosed
        - Not disclosed
        - ARPU, expansion, churn, and pricing power cannot be tested
      - - Acquisition purchase consideration
        - One RealEstateAPI acquisition was described as an eight-figure transaction
        - Exact amount and valuation multiple not disclosed
        - Working-capital and indemnity terms not disclosed
        - Entry multiples and capital efficiency cannot be calculated
      - - Founder earn-outs
        - Reuters reports cash-based earn-outs
        - Amount and payment timing not disclosed
        - Performance hurdles and forfeiture terms not disclosed
        - Future cash obligations and retention incentives are unquantified
      - - Acquisition process
        - Deals usually close within 60 days after launch of the process
        - Roughly one acquisition per week was reported in June 2026
        - Sourcing cost and failed-deal expense not disclosed
        - Throughput is visible, but acquisition CAC and payback are not
    notes: >-
      Public acquisition terms are examples rather than a complete cohort; null pricing and
      consideration fields mean the retained sources do not disclose the measure.
    claimRefs: [CI006, CI013, CI014, CI015]
  - id: TI003
    title: Unit economics and capital-adequacy scorecard
    columns:
      - Metric
      - Public value or status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - June 2026 financing
        - $225M Series C
        - High
        - Funds acquisition capacity and central platform investment
        - Provide closing balance, fees, and deployment schedule
      - - Total outside funding
        - More than $550M reported by SiliconANGLE; FundedIQ records $475M
        - Medium
        - Conflicting totals prevent a clean capital bridge
        - Reconcile all equity proceeds and transaction dates
      - - Holdco profitability
        - Management said Beacon was profitable in November 2025
        - Medium
        - Profitability could reduce dependence on equity
        - Provide audited net income, EBITDA, and operating cash flow
      - - Typical target ARR
        - Less than $20M
        - Medium
        - Defines deal size but not portfolio revenue
        - Provide ARR distribution and acquired versus organic growth
      - - Acquisition cadence
        - About one per week in June 2026
        - Medium
        - Indicates capital deployment and integration load
        - Provide cohort count, invested capital, and integration milestones
      - - Portfolio EBITDA growth
        - More than 50% over the prior year, company-claimed
        - Medium
        - Central evidence for operating leverage
        - Reconcile organic, acquired, pricing, and cost components
      - - Gross margin and free cash flow
        - Not disclosed
        - Low
        - EBITDA can obscure capitalization, working capital, and central costs
        - Provide consolidated gross margin and free-cash-flow bridge
      - - Cash, burn, runway, debt, and earn-out obligations
        - Not disclosed
        - Low
        - Funding raised does not establish available liquidity
        - Provide cash, monthly burn, debt schedule, covenants, and contingent consideration
    notes: >-
      Values are public reports or management claims as of the cited dates; unavailable fields are
      not estimates, and financing proceeds are not treated as current cash.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006, CI007, CI008, CI013, CI015]
figures:
  - id: FI001
    title: Publicly evidenced capital-to-portfolio-performance mechanism
    type: flow
    summary: >-
      Public evidence describes the operating sequence, but does not disclose the revenue-to-gross-
      profit or EBITDA-to-cash conversion needed for a financial bridge.
    data:
      nodes:
        - id: equity-capital
          label: Equity capital
          detail: $225M Series C in June 2026; total outside funding reported above $500M
        - id: acquire-assets
          label: Acquire software businesses
          detail: Profitable or near-profitable niche vertical software targets
        - id: recurring-base
          label: Portfolio recurring revenue
          detail: Targets typically generate less than $20M ARR
        - id: shared-operations
          label: Central operating support
          detail: Accounting, payroll, go-to-market expertise, and acquisition capital
        - id: ai-modernization
          label: AI and product modernization
          detail: Central platform and acceleration team update products and operations
        - id: portfolio-performance
          label: Portfolio earnings outcome
          detail: More than 50% EBITDA growth over the prior year, company-claimed
      edges:
        - from: equity-capital
          to: acquire-assets
          label: funds acquisitions
        - from: acquire-assets
          to: recurring-base
          label: adds operating businesses
        - from: recurring-base
          to: shared-operations
          label: enters shared model
        - from: shared-operations
          to: ai-modernization
          label: enables modernization
        - from: ai-modernization
          to: portfolio-performance
          label: intended operating leverage
    approximationNotes: >-
      This is a mechanism map, not a quantified waterfall; no revenue, gross-profit, cash-flow, or
      return-on-invested-capital conversion rate is publicly disclosed.
    claimRefs: [CI001, CI005, CI007, CI008, CI009, CI012, CI014]
callouts:
  - calloutType: strength
    title: Capital access and reported operating momentum
    body: >-
      A $225M Series C, faster acquisition cadence, and claimed portfolio EBITDA growth give Beacon
      substantial capacity to execute its acquisition-and-modernization strategy.
    claimRefs: [CI001, CI006, CI007, CI008]
  - calloutType: risk
    title: Funding is not runway
    body: >-
      More than $500M of reported funding does not reveal cash available after acquisitions, and
      the retained evidence contains no burn, debt, covenant, earn-out, or runway schedule.
    claimRefs: [CI002, CI013, CI015]
