  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: financial-disclosure-gaps
      missingEvidence: >-
        Audited consolidated income statement, balance sheet, cash-flow statement, and subsidiary
        financial schedules with organic and acquired growth separated.
      whyItMatters: >-
        Without these records, reported profitability and EBITDA growth cannot be reconciled to
        revenue quality, gross margin, working capital, or free cash flow.
      diligencePath: >-
        Request audited statements, monthly management accounts, and acquisition-cohort reporting
        through the latest closed month.
      relatedQuestionRefs: [QI001, QI004, QI005, QI008]
      relatedTableRefs: [TI001, TI003]
    - type: conflicting-data
      severity: material
      topic: total-funding
      missingEvidence: >-
        A company-prepared capitalization and financing schedule reconciling the $475M database
        total with contemporary reports of more than $500M or $550M.
      whyItMatters: >-
        The discrepancy affects capital-deployment analysis and prevents a reliable proceeds-to-
        acquisitions bridge.
      diligencePath: >-
        Obtain closing documents, gross and net proceeds, issuance dates, fees, and investor
        allocations for every financing.
      relatedQuestionRefs: [QI006, QI007, QI008]
      relatedTableRefs: [TI003]
    - type: private-evidence-only
      severity: material
      topic: liquidity-and-obligations
      missingEvidence: >-
        Cash on hand, burn, runway, debt and covenant schedules, acquisition consideration, earn-out
        liabilities, working-capital commitments, and planned capital deployment.
      whyItMatters: >-
        Funding raised is not cash available, and rapid acquisition cadence can create obligations
        that are invisible in announced equity totals.
      diligencePath: >-
        Review treasury statements, lender agreements, purchase-price allocations, earn-out
        schedules, board budgets, and downside liquidity scenarios.
      relatedQuestionRefs: [QI002, QI006, QI007, QI008]
      relatedTableRefs: [TI002, TI003]
    - type: private-evidence-only
      severity: material
      topic: pricing-and-retention
      missingEvidence: >-
        Product-level list and realized pricing, contract length, discounting, gross retention, net
        retention, customer acquisition cost, payback, channel fees, and concentration.
      whyItMatters: >-
        These inputs determine whether portfolio revenue is durable and whether growth reflects
        customer value rather than acquisition volume.
      diligencePath: >-
        Request anonymized contracts, billing cohorts, renewal waterfalls, pipeline conversion, and
        customer-concentration schedules for representative subsidiaries.
