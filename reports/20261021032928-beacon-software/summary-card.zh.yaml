  topStrengths:
    - 收购融资渠道强劲，包括 2026 年 6 月完成的 US$225 million C 轮融资。
    - 差异化的永久持有逻辑，叠加共享的 AI 和运营能力。
    - 在分散且对任务关键的软件垂直市场中，投资组合覆盖面快速扩大。
    - 通过 Haize Labs 增加了 AI 评估、对抗测试和运行时护栏能力。
  topRisks:
    - 合并收入、现金流、债务、当前股权结构条款和当前进入估值仍未披露。
    - 快速收购节奏可能积累整合、可靠性、安全和运营控制债务。
    - AI 驱动的滚动并购模式长期回报尚未得到验证，而据报道的 EBITDA 增长缺乏独立的队列证据。
    - 投资组合层面的客户集中度、留存、合同经济性和子公司表现均未公开披露。
    - 整个投资组合的治理、法律实体、雇佣控制、事件和监管记录并不完整。
  unresolvedGaps:
    - 获取经审计的合并财务报表、现金、债务、购买义务、业绩支付安排和收购队列经济数据。
    - 核实 C 轮估值和证券条款、完全摊薄股权结构表、投资者权利及当前流动性选项。
    - 审阅投资组合层面的留存、集中度、定价、毛利率、有机增长和客户推荐证据。
    - 通过队列层面的迁移时间、正常运行时间、缺陷、安全事件、AI 采用率和现代化成本，检验整合结果。
    - 审阅完整的治理、法律实体、雇佣、隐私、知识产权、诉讼和监管登记册。
