    title: "Operating proof trails acquisition velocity"
    body: "Weekly acquisition cadence and company-reported EBITDA growth do not resolve whether a rapidly expanding portfolio can avoid integration debt over a full cycle."
    claimRefs: [CP005, CP012, CP013]
