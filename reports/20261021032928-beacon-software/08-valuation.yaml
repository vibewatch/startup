callouts:
  - calloutType: recommendation
    title: Price is the unresolved variable
    body: >-
      Capital access and acquisition velocity are not substitutes for a current fully diluted
      valuation. Proceed only after the Series C terms and cohort cash economics support the
      required return.
    claimRefs: [CV004, CV005, CV007, CV008, CV016]
