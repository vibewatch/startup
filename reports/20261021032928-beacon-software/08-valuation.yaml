artifact: valuation
slug: beacon-software
runDate: 2026-10-21
company:
  name: Beacon Software
chapter:
  number: 8
  title: Valuation
  summary: >-
    Beacon has demonstrated exceptional access to acquisition capital, but the last public
    valuation mark is the $1 billion Series B from November 2025 and the June 2026 Series C
    disclosed no new valuation. The appropriate stance is research-more with high risk and
    strict entry discipline until consolidated operating evidence and current cap-table terms
    support a price.
sections:
  - id: recommendation-and-entry-discipline
    title: Recommendation and entry discipline
    body: >-
      The recommendation is research-more, with low confidence in any point valuation and a
      high risk rating. The last disclosed price was the $1 billion Series B valuation in
      November 2025, while a further $225 million Series C in June 2026 arrived without a new
      valuation disclosure. That sequence prevents a current public mark from being inferred.
      It also weakens reliance on the earlier expectation that the Series B would be Beacon's
      final round. Entry should therefore be conditional on the fully diluted Series C
      capitalization, liquidation preferences, acquisition debt, cash available for deployment,
      and consolidated portfolio economics rather than on the headline amount raised.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006, CV009, CV016]
    tableRefs: [TV001]
  - id: thesis-and-proof-burden
    title: Thesis, anti-thesis, and proof burden
    body: >-
      The thesis is that frequent acquisitions of small profitable vertical-software businesses
      can create a permanent-capital compounding platform when shared AI and operating resources
      improve portfolio economics. Public reporting carries encouraging signals: Beacon said it
      was acquiring roughly one company per week and had produced more than 50 percent portfolio
      EBITDA growth, while a later market profile reported 45 companies serving more than 22,000
      businesses and institutions. The anti-thesis is equally material: those operating figures
      are not audited in the reviewed evidence, current consolidated revenue was not disclosed,
      and independent reporting says the long-run AI roll-up model remains untested.
    claimRefs: [CV007, CV008, CV010, CV011, CV012, CV013, CV014, CV015]
    tableRefs: [TV002]
  - id: scenarios-and-valuation-method
    title: Scenarios and valuation method
    body: >-
      A defensible valuation should use a sum-of-the-parts or acquisition-cohort cash-flow
      approach, not a venture revenue multiple applied to undisclosed consolidated revenue.
      The required model would separate purchase price, organic growth, EBITDA improvement,
      central-platform cost, debt, working capital, earn-outs, and dilution by acquisition
      cohort. None of the reviewed public sources supplies that complete denominator set, so
      numerical bull, base, and bear ranges would create false precision. The scenario table
      instead defines evidence thresholds: validated cohort economics support upside, sustained
      but unverified execution preserves the base research posture, and integration debt or
      financing dependence triggers the downside case.
    claimRefs: [CV002, CV004, CV005, CV007, CV008, CV009, CV010, CV011, CV012, CV016]
    tableRefs: [TV003]
  - id: exit-readiness-and-diligence
    title: Exit readiness, diligence asks, and thesis-break triggers
    body: >-
      Conventional exit readiness is not established because Beacon presents itself as a
      permanent owner and the reviewed public evidence provides no IPO, strategic-sale, or
      distribution timetable. The underwriting path is therefore return-through-compounding:
      investors need evidence that portfolio free cash flow can fund acquisitions and central
      technology without repeated equity rounds. Before investment, diligence should reconcile
      every acquisition cohort, validate the reported EBITDA improvement, disclose retention and
      organic growth, and model preference waterfalls. Thesis-break triggers are another
      valuation-undisclosed financing, materially slower acquisition integration, failure to
      validate portfolio EBITDA gains, or evidence that central costs consume subsidiary cash
      generation.
    claimRefs: [CV005, CV007, CV008, CV009, CV010, CV011, CV013, CV016]
    figureRefs: [FV001]
tables:
  - id: TV001
    title: Recommendation summary table
    columns:
      - Decision field
      - Assessment
      - Decision implication
    rows:
      - [Recommendation, Research more, "Do not underwrite an entry until current price and consolidated economics are disclosed."]
      - [Confidence, Low, "Public financing facts are clear, but the operating and capital-structure denominators are incomplete."]
      - [Risk rating, High, "Integration, financing, dilution, and model-duration risks are not quantifiable from public evidence."]
      - [Valuation stance, "Stretched / unsupported at an unknown current price", "Use the November 2025 $1B mark only as historical context, not as the current value."]
    notes: "Assessments are analyst judgments as of 2026-10-21; no current Series C valuation or complete consolidated financial statements were available in the assigned public evidence."
    claimRefs: [CV002, CV004, CV005, CV009, CV010, CV011, CV016]
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Lens
      - Current evidence
      - What would change the view
    rows:
      - ["Capital access", "Two large priced or announced equity rounds show strong investor sponsorship.", "A current fully diluted valuation and preference schedule would convert funding scale into investable price context."]
      - ["Operating thesis", "Beacon reports weekly acquisition pace and more than 50% portfolio EBITDA growth.", "Audited cohort revenue, EBITDA, organic growth, and free cash flow would validate the claimed operating uplift."]
      - ["Scale", "A September 2026 market profile reports 45 software companies serving more than 22,000 organizations.", "A company-verified portfolio schedule with acquisition dates and revenue contribution would substantiate the scale claim."]
      - ["Anti-thesis", "Independent reporting calls long-term AI roll-up returns untested, while current consolidated revenue remains undisclosed.", "Several mature cohorts sustaining organic growth after integration would reduce the model-duration concern."]
    notes: "Operating and scale figures are company claims or third-party profile figures, not audited results; the table distinguishes capital raised from cash available."
    claimRefs: [CV001, CV004, CV007, CV008, CV010, CV011, CV012, CV013, CV014, CV015]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - [Bull, "Audited cohort data validate organic growth, >50% EBITDA improvement, and self-funded acquisition capacity.", "A premium could be supported only after a cohort cash-flow model establishes durable incremental returns; no public range is supportable today.", "Execution claims may not survive cohort-level normalization.", "Validation of current fully diluted terms plus audited cohort economics."]
      - [Base, "Acquisition pace continues, but consolidated revenue, cash flow, and current valuation remain private.", "Maintain research-more and negotiate price protection; no public range is supportable today.", "Further dilution and integration complexity obscure per-share compounding.", "Continued acquisitions without denominator disclosure."]
      - [Bear, "Integration debt rises, portfolio improvement is not validated, or another equity round is required.", "Downside cannot be quantified without capital structure and cash-flow data; preference overhang could amplify it.", "Multiple compression, financing dependence, and weak organic growth.", "Another valuation-undisclosed round or failure to substantiate EBITDA gains."]
    notes: "Scenarios are qualitative because public evidence lacks current valuation, cap-table terms, consolidated revenue, cash flow, and acquisition-cohort financials; no probabilities or numerical ranges are implied."
    claimRefs: [CV002, CV004, CV005, CV007, CV008, CV009, CV010, CV011, CV012, CV016]
