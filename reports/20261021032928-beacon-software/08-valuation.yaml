      whyItMatters: "Without common denominators, the reported acquisition pace and EBITDA growth cannot support a cash-flow valuation or target return."
      diligencePath: "Review audited statements and a cohort model reconciling purchase price, revenue, EBITDA, central cost, capex, debt, and cash conversion."
