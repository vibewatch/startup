  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: disclosure-gaps
      missingEvidence: >-
        Portfolio-wide outage, security-incident, vulnerability, release-quality, and control-testing
        records by subsidiary and acquisition cohort.
      whyItMatters: >-
        These records are necessary to distinguish a scalable modernization system from hidden
        reliability, security, or integration debt.
      diligencePath: >-
        Review twenty-four months of incident logs, severity and root-cause reports, penetration-test
        results, vulnerability aging, change-failure rates, recovery tests, and board risk reporting.
      relatedQuestionRefs: [QR005]
      relatedTableRefs: [TR002]
    - type: missing-source
      severity: material
      topic: portfolio-scale
      missingEvidence: >-
        Reliable primary or independent corroboration for current portfolio count, served
        organizations, acquisition cadence, and EBITDA growth using defined periods and denominators.
      whyItMatters: >-
        Uncorroborated scale and EBITDA claims can overstate integration capacity and obscure
        acquisition-cohort dispersion.
      diligencePath: >-
        Obtain a dated portfolio schedule and audited cohort-level revenue, EBITDA, churn, and
        acquisition data, then reconcile them to legal entities and management reporting.
      relatedQuestionRefs: [QR009]
      relatedTableRefs: [TR002, TR003]
    - type: private-evidence-only
      severity: material
      topic: financial-model
      missingEvidence: >-
        Consolidated cash, debt, working-capital, purchase-obligation, customer-concentration, and
        subsidiary-level financial schedules.
      whyItMatters: >-
        Funding raised does not establish cash available, and target profitability does not establish
        consolidated cash generation or loss resilience.
      diligencePath: >-
        Review audited consolidated statements, bank and debt schedules, monthly cash forecasts,
        acquisition commitments, covenant headroom, and top-customer exposure by subsidiary.
      relatedQuestionRefs: [QR010]
      relatedTableRefs: [TR003]
