        - A 500,000-worker goal was announced; delivery and exclusivity were not disclosed
        - Partner scope, access, or delivery falls short of the announced goal
        - Medium
        - Contracted service levels, alternative training providers, and completion reporting
        - Medium until delivery data and contractual commitments are reviewed
      - - Acquisition and platform funding
        - Series C investors led by General Catalyst and HarbourVest
        - Capital for acquisitions and the AI-native operating system
        - Osler reported $225 million raised, but cash availability and obligations are not public
        - Acquisition pace or platform investment requires capital beyond available liquidity
        - High
        - Consolidated cash forecast, committed facilities, leverage limits, and pace controls
        - High without audited cash flow, debt, and working-capital schedules
      - - Central modernization capability
        - Beacon acceleration team and retained founders
        - Product rewrites, automation, and operating knowledge
        - Team capacity and founder-retention outcomes are not disclosed
        - Shared-team bottlenecks or founder departures delay integration and customer support
        - High
        - Capacity thresholds, cohort scorecards, succession plans, and staged migrations
        - High while cadence, backlog, and retention are unquantified
    notes: >-
      Dependency register uses announced roles and reported capital only; funding raised is not
