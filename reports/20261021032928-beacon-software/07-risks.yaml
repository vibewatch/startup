callouts:
  - calloutType: risk
    title: Public silence is not a clean incident record
    body: >-
      The assigned evidence does not provide a portfolio-wide incident, outage, litigation, control,
      or customer-concentration record. Underwriting should require those records rather than infer
      safety from the absence of a cited event.
    claimRefs: [CR016]
  - calloutType: recommendation
    title: Gate acquisition pace on integration evidence
    body: >-
      Require cohort-level integration, reliability, retention, and cash-flow scorecards before
      treating rapid acquisition cadence as repeatable value creation.
    claimRefs: [CR003, CR005, CR006, CR016]
