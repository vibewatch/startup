figures:
  - id: FM001
    title: Evidence-constrained market and adoption indicators
    type: pyramid
    summary: >-
      Six source-backed indicators bound Beacon's target and deployment surface without
      asserting a dollar TAM, SAM, or SOM.
    data:
      nodes:
        - label: Typical target ARR ceiling
          value: 20
          unit: USD millions
          detail: Reuters reported that typical targets generated less than this amount.
        - label: Reported acquisition interval
          value: 2
          unit: weeks
          detail: Founder-reported cadence as of November 2025.
        - label: Reported active-user reach
          value: 1000000
          unit: users, minimum
          detail: Company-issued November 2025 portfolio description.
        - label: Planned certification reach
          value: 500000
          unit: workers
          detail: Company-announced 2026 program target, not completed delivery.
        - label: SMBs without full-time IT
          value: 40
          unit: percent
          detail: IDC survey finding from nearly 3,000 SMBs.
        - label: SMBs not using AI
          value: 6.3
          unit: percent
          detail: IDC 2025 survey result, down from 11.2% in 2024.
    approximationNotes: >-
      Node order is analytical only. Values use different units, populations, and
      periods; layer size is not additive, proportional, or a conversion funnel.
    claimRefs: [CM003, CM004, CM007, CM011, CM013, CM014]
callouts:
  - calloutType: risk
    title: Public evidence does not establish a dollar market size
    body: >-
      Treat portfolio reach as an option set, not TAM. Request acquisition-pipeline
      counts, eligible-target ARR, purchase multiples, customer attach rates, expansion
      ARR, retention, and cohort returns before using market size in valuation.
    claimRefs: [CM003, CM005, CM006, CM007, CM009, CM010, CM014, CM016]
