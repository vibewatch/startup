schemaVersion: report-v2
artifact: customers
slug: beacon-software
runDate: 2026-10-21
company:
  name: Beacon Software
chapter:
  number: 6
  title: Customers
  summary: >-
    Beacon reaches a heterogeneous base indirectly through acquired vertical-software
    companies, with the clearest public proof concentrated in PowerUp Sports and a
    company-announced OpenAI training initiative. Portfolio-wide scale is reported,
    but retention, concentration, contract, and cohort economics remain undisclosed.
sections:
  - id: customer-base
    title: A portfolio-mediated customer base
    body: >-
      Beacon's commercial exposure is mediated through acquired software companies
      rather than one homogeneous product. Reuters describes the acquisition target as
      profitable niche vendors serving youth sports leagues, campgrounds, manufacturers,
      and unions, while Beacon's February 2026 announcement adds colleges, schools,
      government services, insurers, first responders, and universities across the
      United States and Canada. An independent profile reported 45 portfolio companies
      serving more than 22,000 businesses and institutions by September 2026, but did
      not disclose the underlying customer list, payer mix, revenue distribution, or
      metric methodology. The resulting breadth diversifies use cases while making
      portfolio-wide customer quality difficult to evaluate: buyers, daily users,
      beneficiaries, and payers differ materially by vertical and subsidiary.
    claimRefs: [CU001, CU002, CU004]
    tableRefs: [TU001]
  - id: adoption-and-durability
    title: Adoption proof is real but narrow
    body: >-
      Public adoption evidence is strongest for PowerUp Sports. AI Market Watch names
      Ontario Soccer and BC Soccer as customers, and Software Advice includes long-term,
      daily-use reviews from Mount Hamilton Youth Soccer Club and Bolton Wanderers
      Soccer Club. Its current page shows 31 reviews, including 30 five-star ratings and
      one four-star rating; the archived Capterra page separately showed 21 reviews and
      a 5.0 overall score. Individual reviewers describe years of production use,
      responsive support, and operational reliance, but also cite setup, mastery,
      mobile administration, and scheduling limitations. These marketplace signals
      demonstrate product-level durability for one subsidiary; they do not establish
      Beacon-wide NRR, GRR, churn, renewal, or customer satisfaction.
    claimRefs: [CU005, CU011, CU012, CU013, CU014]
    tableRefs: [TU002, TU003]
  - id: expansion-and-concentration
    title: Expansion is acquisition-led; organic economics are opaque
    body: >-
      Beacon publicly frames expansion as a combination of continued acquisitions,
      founder continuity, central operating support, and new capabilities distributed
      through portfolio companies. Osler reported that Series C proceeds would support
      continued acquisitions, while Reuters reported a late-2025 pace of one acquisition
      about every two weeks and said founders often remained through cash-based earn-outs.
      Beacon's announced OpenAI initiative aims to make certifications available through
      College Kickstart, Let's Camp, PowerUp Sports, and MAP Policy Partners to 500,000
      Main Street workers in 2026. This is a reach target, not measured adoption or
      revenue expansion. No retained source quantifies cross-sell, expansion ARR,
      renewal uplift, top-customer exposure, channel dependence, or procurement cycle.
      WhatJobs also cautions that reported portfolio performance is company-supplied and
      that the model remains untested over long horizons.
    claimRefs: [CU003, CU006, CU007, CU008, CU009, CU010, CU015, CU016]
    figureRefs: [FU001]
tables:
  - id: TU001
    title: Customer segmentation and evidence boundary
    columns:
      - Segment
      - Buyer / payer
      - Users / beneficiaries
      - Public scale or proof
      - Strategic value
      - Evidence gap
    rows:
      - - Youth sports
        - Clubs, leagues, associations, governing bodies
        - Administrators, coaches, parents, players
        - PowerUp reviews and named soccer organizations
        - Repeated operational workflows and payments
        - No subsidiary revenue, renewal, or customer-count disclosure
      - - Campgrounds and recreation
        - Independent operators and recreation organizations
        - Staff and guests
        - Reuters names campgrounds; Let's Camp is in the training network
        - Fragmented vertical suitable for portfolio acquisition
        - No named end-customer deployment or usage metric retained
      - - Education
        - Colleges, schools, and related institutions
        - Administrators, students, and families
        - College Kickstart named in Beacon's training announcement
        - Institution-level workflows and network distribution
        - No contract size, deployment status, or retention metric
      - - Government and essential services
        - Government services, municipalities, insurers, first responders
        - Public-service staff and residents
        - Beacon announcement identifies these organization types
        - Mission-critical workflows may support durability
        - No procurement record, concentration, or production reference retained
    notes: >-
      Segments combine Reuters reporting, Beacon's company-issued announcement, and an
      independent profile; reported organization categories are not a common customer,
      revenue, or usage denominator.
    claimRefs: [CU001, CU002, CU004, CU006]
  - id: TU002
    title: Customer growth and adoption signals
    columns:
      - Metric
      - Value
      - Period
      - Evidence class
      - Confidence
      - Implication and missing denominator
    rows:
      - - Portfolio businesses and institutions served
        - More than 22,000 across 45 portfolio companies
        - 2026-09-17 profile snapshot
        - Third-party profile
        - Medium
        - Broad reach; methodology, active status, overlap, and subsidiary mix undisclosed
      - - OpenAI certification reach
        - 500,000 Main Street workers
        - 2026 company target
        - Company-announced plan
        - Medium
        - Distribution ambition, not completed training, active use, or paid conversion
      - - PowerUp Software Advice reviews
        - 31 reviews; 30 five-star and 1 four-star
        - Page fetched 2026-10-21
        - Independent review marketplace
        - Medium
        - Strong product sentiment; self-selected sample and no customer-base denominator
      - - PowerUp Capterra reviews
        - 21 reviews; 5.0 overall rating
        - Archived page captured 2023-01-24
        - Independent review marketplace
        - Medium
        - Historical corroboration only; not a current portfolio-wide satisfaction measure
    notes: >-
      Values use different populations, periods, and units and must not be summed or
      treated as a conversion funnel; null portfolio retention and concentration metrics
      remain evidence gaps.
    claimRefs: [CU003, CU004, CU011, CU013, CU014]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Portfolio company
      - Deployment / use case
      - Production vs. pilot
      - Outcome evidence
      - Limitation
    rows:
      - - Ontario Soccer
        - PowerUp Sports
        - Sports administration software
        - Customer status reported; production status not specified
        - Named in independent company profile
        - No direct customer statement or current usage metric retained
      - - BC Soccer
        - PowerUp Sports
        - Sports administration software
        - Customer status reported; production status not specified
        - Named in independent company profile
        - No direct customer statement or current usage metric retained
      - - Mount Hamilton Youth Soccer Club
        - PowerUp Sports
        - Registration, reporting, and club administration
        - Reviewer reported daily use for more than two years
        - Named verified review describes ease of use and support
        - Review is self-selected and does not disclose contract economics
      - - Bolton Wanderers Soccer Club
        - PowerUp Sports
        - Registration, website, reporting, and administration
        - Reviewer reported daily use for more than two years
        - Named verified review describes nine years of use
        - Review is self-selected and does not disclose renewal terms
    notes: >-
      Partial enumeration limited to names present in the assigned fetched evidence;
      marketplace reviews support product use but do not independently verify Beacon's
      portfolio-wide customer claims.
    enumerationScope:
      coverage: partial
      basis: >-
        Named organizations found in the assigned 2026 customer evidence and newly
        fetched historical review pages.
    claimRefs: [CU005, CU011, CU012]
figures:
  - id: FU001
    title: Portfolio-mediated customer expansion path
    type: journey-map
    summary: >-
      Beacon's disclosed path runs from acquisition through continuity and central
      enablement to customer-network distribution, while commercial conversion remains
      unreported.
    data:
      nodes:
        - id: acquire
          label: Acquire a niche software business
          detail: Continued acquisitions are a stated use of Series C proceeds.
        - id: retain
          label: Retain founder continuity
          detail: Reuters reports that founders often remain through cash-based earn-outs.
        - id: onboard
          label: Connect central infrastructure
          detail: Mantle describes Beacon managing entrepreneur partners and multiple entities.
        - id: modernize
          label: Apply engineering and operating support
          detail: Reuters describes a central acceleration team for acquired companies.
        - id: distribute
          label: Distribute capabilities through portfolio products
          detail: Four portfolio companies were named in the OpenAI certification plan.
        - id: measure
          label: Verify adoption and expansion
          detail: Portfolio-wide conversion, renewal, and expansion metrics remain undisclosed.
    approximationNotes: >-
      Ordered evidence map, not a measured funnel; nodes do not imply conversion rates,
      elapsed time, or value-proportional scale.
    claimRefs: [CU003, CU006, CU007, CU008, CU010, CU016]
callouts:
  - calloutType: risk
    title: Product-level reviews cannot substitute for portfolio retention
    body: >-
      PowerUp Sports has unusually positive and durable public reviews, but Beacon does
      not disclose NRR, GRR, churn, renewals, contract length, or customer concentration
      for PowerUp or the broader portfolio.
    claimRefs: [CU011, CU012, CU013, CU014]
