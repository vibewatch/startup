companyProfile:
  summary: >-
    Beacon Software is a Toronto-based permanent-capital owner of vertical software businesses, founded in 2024 by Nilam
    Ganenthiran and Divya Gupta. It acquires profitable niche applications, keeps their brands and operating focus, and
    applies a central acceleration team plus shared AI, engineering, product, and go-to-market capabilities. Beacon
    reported rapid acquisition growth and substantial portfolio reach in 2026, but the private company does not disclose
    the consolidated financial and control information needed to verify portfolio-wide returns.
  founders:
    - name: Nilam Ganenthiran
