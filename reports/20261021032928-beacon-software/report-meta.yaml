  topStrengths:
    - Strong access to acquisition capital, including a US$225 million Series C in June 2026.
    - A differentiated permanent-ownership thesis paired with shared AI and operating capabilities.
    - Rapidly expanding portfolio reach across fragmented, mission-critical vertical software markets.
    - Added AI evaluation, adversarial testing, and runtime-guardrail capability through Haize Labs.
  topRisks:
    - Consolidated revenue, cash flow, debt, current cap-table terms, and a current entry valuation remain undisclosed.
    - Rapid acquisition cadence may accumulate integration, reliability, security, and operating-control debt.
    - >-
      Long-term returns from AI-enabled roll-up models remain untested, while reported EBITDA gains lack independent
      cohort evidence.
    - >-
      Portfolio-wide customer concentration, retention, contract economics, and subsidiary performance are not publicly
      disclosed.
    - >-
      Governance, legal-entity, employment-control, incident, and regulatory records are incomplete across the
      portfolio.
  unresolvedGaps:
    - >-
      Obtain audited consolidated financial statements, cash, debt, purchase obligations, earn-outs, and
      acquisition-cohort economics.
    - >-
      Verify Series C valuation and security terms, the fully diluted cap table, investor rights, and current liquidity
      options.
    - >-
      Review portfolio-level retention, concentration, pricing, gross margin, organic growth, and customer-reference
      evidence.
    - >-
      Test integration outcomes with cohort-level migration time, uptime, defects, security incidents, AI adoption, and
      modernization cost.
    - >-
      Review the complete governance, legal-entity, employment, privacy, intellectual-property, litigation, and
      regulatory register.
