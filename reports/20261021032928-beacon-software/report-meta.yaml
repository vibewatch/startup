  foundingLocation: Toronto, Ontario, Canada
  headquarters: Toronto, Ontario, Canada
  productSummary: >-
    Beacon acquires vertical software companies and provides a shared acceleration layer spanning AI product
    modernization, engineering, back-office automation, product development, and go-to-market support; its developing
    AI-native operating system and Haize Labs capability are intended to make that model repeatable across the
    portfolio.
  customerFocus: >-
    Profitable niche software businesses serving Main Street organizations in verticals such as youth sports, education,
    campgrounds, manufacturing, unions, and government services.
  businessModel: >-
    Permanent ownership of acquired software businesses, with value creation expected from organic growth, AI-enabled
    modernization, shared services, and continued acquisitions.
  stage: Series C / Growth
