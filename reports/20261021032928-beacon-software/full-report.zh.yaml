    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - Bull
        - 经审计的批次数据验证有机增长、>50% EBITDA 改善和自筹收购能力。
        - 只有队列现金流模型证明增量回报可持续后，溢价才可能获得支撑；目前尚无公开信息足以支持任何区间。
        - 执行层面的主张可能经不起批次层面的标准化处理。
        - 验证当前完全稀释条款及经审计的批次经济数据。
      - - Base
        - 收购速度延续，但合并收入、现金流和当前估值仍属非公开信息。
        - 维持“继续研究”判断并争取价格保护；目前尚无公开信息足以支持任何区间。
        - 进一步稀释和整合复杂性遮蔽每股复合增长。
        - 在分母未披露的情况下继续收购。
      - - Bear
        - 整合债务上升、投资组合改善未获验证，或需要再次股权融资。
        - 没有资本结构和现金流数据就无法量化下行空间；优先权悬垂可能放大下行。
        - 倍数压缩、融资依赖和有机增长疲弱。
        - 再次进行未披露估值的融资，或无法证明 EBITDA 增长。
    notes: 情景属于定性判断，因为公开证据缺少当前估值、资本表条款、合并收入、现金流和收购批次财务数据； 不代表任何概率或数值区间。
