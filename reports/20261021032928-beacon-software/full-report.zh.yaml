chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与运营模式
        blocks:
          - type: paragraph
            body: >-
              Beacon Software 由 Nilam Ganenthiran 和 Divya Gupta 于 2024 年在多伦多创立。Ganenthiran 曾任 Instacart 总裁，并在 D1 Capital
              Partners 投资；Gupta 曾任 Sequoia Capital 合伙人。Beacon
              并非传统的有限存续期并购基金：公司收购盈利或接近盈利的垂直软件企业，计划无限期持有，并提供共享工程、人工智能、市场拓展和后台能力。子公司保留自己的品牌和运营团队。因此，创始人的收购判断和中央加速团队的执行成为关键依赖，而公开证据没有显示更完整的高管梯队或董事会。
