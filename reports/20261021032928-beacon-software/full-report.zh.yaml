              - CV007
              - CV008
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
      - number: '8.3'
        title: 情景与估值方法
        blocks:
          - type: paragraph
            body: >-
              可辩护的估值应采用分部加总或收购群组现金流方法，而不是把创投收入倍数套用到未披露的合并收入上。所需模型应按收购群组拆分购买价格、自然增长、EBITDA
              改善、中央平台成本、债务、营运资金、业绩支付和稀释。审阅的公开来源没有提供完整的分母集合，因此给出数字化的牛市、基准和熊市区间会制造虚假精确。情景表改为定义证据门槛：经验证的群组经济性支持上行空间；持续但未经验证的执行维持继续研究的基准姿态；整合债务或融资依赖触发下行情景。
            claimRefs:
              - CV002
