      - number: '8.4'
        title: 退出准备度、尽调要求与论点失效触发器
        blocks:
          - type: paragraph
            body: >-
              Beacon 将自己定位为永久持有者，审阅的公开证据也没有提供
              IPO、战略出售或分配时间表，因此无法确认传统退出准备度。投资判断路径因而是靠复利回报：投资者需要证明组合自由现金流能够在不反复发行股权的情况下资助收购和中央技术。投资前应核对每个收购群组，验证已报告的
              EBITDA 改善，披露留存率和自然增长，并建立优先权瀑布模型。论点失效触发器包括再次发生未披露估值的融资、收购整合明显变慢、无法验证组合 EBITDA 增益，或中央成本吞噬子公司现金创造。
            claimRefs:
