            body: >-
              公开证据更能说明 Beacon 的收购吞吐量，而不是客户变现。Reuters 报道称，2025 年 11 月收购速度约为每两周一家企业；2026 年 6 月的报道称约每周一家，SiliconANGLE
              则称从流程启动到交易通常在 60 天内完成。这些是部署和寻源的代理指标，不是底层软件产品的
              CAC、回本期、销售周期或渠道经济性指标。现金型创始人业绩支付可能让卖方与交割后表现保持一致，但金额、期限、门槛和资产负债表处理方式均属私有信息。留存来源没有提供组合的标价、实际价格、折扣、合同期限、续约率或客户获取成本。
