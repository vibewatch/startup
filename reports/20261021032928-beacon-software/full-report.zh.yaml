              - CV010
              - CV011
              - CV016
      - number: '8.2'
        title: 论点、反论点与证明责任
        blocks:
          - type: paragraph
            body: >-
              论点是：频繁收购小型盈利垂直软件企业，在共享 AI 和运营资源改善组合经济性的情况下，可以打造永久资本复利平台。公开报道给出了鼓舞人心的信号：Beacon 称其约每周收购一家企业，并实现组合 EBITDA
              增长超过 50%；之后的市场资料又称有 45 家公司服务超过 22,000 家企业和机构。反论点同样重要：这些运营数字在审阅证据中未经审计，当前合并收入未披露，独立报道称 AI 滚雪球式并购的长期模式仍未经验证。
            claimRefs:
              - CV007
              - CV008
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
