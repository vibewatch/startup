  summary: >-
    Beacon Software 是一家总部位于多伦多、采用永久资本模式持有垂直软件业务的公司，由 Nilam Ganenthiran 和 Divya Gupta 于 2024
    年创立。公司收购盈利的细分应用，保留品牌和运营重点，并通过中央加速团队以及共享的 AI、工程、产品和市场拓展能力推动业务。Beacon 报告称 2026
    年收购增长迅速、组合覆盖面广，但这家私营公司没有披露足以验证全组合回报所需的合并财务与控制信息。
