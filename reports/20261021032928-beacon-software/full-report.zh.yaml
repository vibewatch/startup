      - number: '1.4'
        title: 投资判断影响与未解决的治理问题
        blocks:
          - type: paragraph
            body: >-
              证据证明 Beacon 资金获取能力强、收购节奏快，但尚未证明组合能创造持久经济价值。Reuters 指出，AI 驱动的滚雪球式并购模式的长期回报仍未经验证。Beacon 向 Reuters
              表示公司实体本身盈利，目标企业也持续盈利，但留存来源没有提供合并收入、ARR、EBITDA、现金流、杠杆或收购倍数。指定证据也没有披露确切法律实体、董事会成员、表决权、清算优先权或投资人同意权。这些缺口使治理、稀释、关键人风险和可用于未来收购的资本都无法完整评估。
            claimRefs:
              - CO012
              - CO013
              - CO014
      - number: '1.5'
        title: 展品
        blocks:
          - type: callout
            title: 快速部署不等于已实现回报
            body: 收购节奏和融资额有据可查，但独立报道明确称 AI 滚雪球式并购的长期回报仍未经验证。
            calloutType: risk
            claimRefs:
