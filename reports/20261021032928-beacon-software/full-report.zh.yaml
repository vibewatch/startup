            title: 融资总额采用不同分母
            body: 4.75 亿美元是披露的 Series B 和 C 之和；同期报道则称计入更早资本后累计融资超过 5.5 亿美元。两者都不等于当前可用现金。
            calloutType: assumption
            claimRefs:
              - CO004
              - CO005
              - CO006
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              Beacon 横跨两个相互关联的市场。上游，公司竞争的是收购由创始人主导、服务主街细分工作流的盈利型垂直软件企业；Reuters 报道称，典型目标 ARR 不到 2,000 万美元，而 Beacon
              将自己定位为永久持有者，为这些企业打造下一代 AI 产品。下游，被收购公司向教育、金融、物流、休闲、制造、政府、保险等领域的既有组织销售工作流软件和 AI 扩展。可投资边界因此不包括广义横向 SaaS、通用 AI
              基础设施和完整的 SMB 技术预算。替代方案包括维持旧产品不变、继续人工处理后台工作、采购独立 AI 点解决方案，或把公司卖给传统金融投资者而非 Beacon。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM008
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM008
              - CM009
              - CM010
              - CM011
              - CM014
      - number: '2.2'
        title: 受证据约束的市场规模测算
        blocks:
          - type: paragraph
            body: >-
              留存证据不支持传统的美元 TAM、SAM 或 SOM。相反，它提供了边界和触达指标：Beacon 在 2025 年 11 月称已收购数十家企业，服务数千家企业客户和超过一百万活跃用户；Reuters
              则报道其大约每两周收购一家企业。2026 年的一项计划瞄准客户网络中的 500,000 名员工，提供 AI 认证。这些数字对应不同人群和时期，且大多由公司发布，不能相乘推导收入。官网提供了一个商业验证点——90
              天内售出一项六位数金额的 AI 项目——但单个案例不能证明整个组合的附加率、定价、留存或可服务支出。因此，估值应基于私有运营数据建立群组模型，而不是把泛化的市场预测资本化。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM011
              - CM013
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM004
              - CM007
              - CM011
              - CM013
              - CM014
      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              收购端的买方是 Beacon，卖方通常是盈利型细分软件公司的创始人；永久持有、现代化资本和共享技术团队是提议的交易理由。下游买方和付款方仍是组合公司原有的企业或机构客户，日常用户则是其运营员工。Beacon 的
              System Dynamics 案例展示了这条路径：既有客户关系引出了与 CFO 的财务自动化讨论，随后形成多年期订阅，并带有一定的结果挂钩定价。这种存量客户路径具有战略意义，因为 IDC 报告称许多 SMB
              没有全职 IT 员工，更偏好嵌入既有软件的 AI。但案例研究和公开组合总数都没有披露可复制的转化率、销售周期或扩张经济性。
            claimRefs:
              - CM001
              - CM003
              - CM008
              - CM009
              - CM010
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM002
              - CM008
              - CM009
              - CM010
              - CM011
              - CM014
              - CM015
              - CM016
      - number: '2.4'
        title: 驱动因素、约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              独立的 SMB 证据支持需求方向，也进一步凸显执行门槛。IDC 发现，AI 从 2024 年面向未来的技术优先级第三位升至 2025 年第一位；受访 SMB 中不使用 AI 的比例从 11.2% 降至
              6.3%。这有利于 Beacon 的嵌入式分销论。采用并非没有摩擦：近 3,000 家受访 SMB 中有 40% 没有全职 IT 员工，不可预测的定价会侵蚀信任，而安全实施是 IDC 2026
              年数据中受访者提到的首要挑战。Beacon
              因而必须让每个组合产品都具备简单部署、可预测的经济性和安全性。估值含义是不对称的：庞大的存量触达可以创造期权价值，但在缺少独立验证的附加率、留存率、毛利率和收购群组回报前，公开证据无法证明需求会转化为持久的增量现金流。
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 展品
        blocks:
          - type: callout
            title: 公开证据无法确立美元计价的市场规模
            body: 把组合触达当作期权集合，而不是 TAM。在把市场规模用于估值前，应索取收购管线数量、合格目标 ARR、收购倍数、客户附加率、扩张 ARR、留存率和群组回报。
            calloutType: risk
            claimRefs:
              - CM003
              - CM005
              - CM006
              - CM007
              - CM009
              - CM010
              - CM014
              - CM016
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争覆盖资本、运营以及“不出售”的选择
        blocks:
          - type: paragraph
            body: >-
              相关市场不是传统的软件功能竞赛。Beacon 首先争夺盈利型、创始人主导的垂直软件公司的控制权，然后争夺收购后改善这些公司的能力。独立报道提到成熟的加拿大整合者 Constellation Software 和
              Valsoft、Thoma Bravo 与 Vista Equity Partners 等专注软件的私募股权机构，以及 Thrive Holdings 和 Titan 等新兴 AI
              滚雪球式并购者。卖方也可以拒绝交易、在内部为现代化融资，使维持现状和内部建设成为真实替代方案，尽管留存来源没有量化它们的普及度。Beacon 的资本基础和每周收购说法使其成为资金充足的新进入者，但
              Constellation 据报道已有超过 1,000 笔收购，赋予老牌竞争者更深的已验证运营记录。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP010
              - CP012
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP016
      - number: '3.2'
        title: 差异化建立在持有期限与共享运营层之上
        blocks:
          - type: paragraph
            body: >-
              Beacon
              所称的切入点，是无限期持有加上内部加速团队：重写产品、自动化会计和工资处理，并加快产品开发。这一主张不同于传统私募股权强调降本和有限期限退出的框架；现金型业绩支付则旨在让创始人在出售后继续参与。运营模式比 AI
              标签更重要：2026 年 Series C 资金既用于收购，也用于 AI 原生业务运营系统。不过，这项能力仍只得到部分验证。据报道的组合 EBITDA 改善是公司提供的数字，留存证据没有给出与
              Constellation、Valsoft 或私募股权持有模式的受控基准比较。
            claimRefs:
              - CP006
              - CP009
              - CP014
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP009
              - CP012
              - CP014
              - CP015
      - number: '3.3'
        title: 分销可在组合内复利，但交易经济性仍不透明
        blocks:
          - type: paragraph
            body: >-
              Beacon 的组合为共享能力提供了内置渠道：公司发布的 OpenAI 公告点名四家组合企业，并设定在 2026 年向覆盖 500,000
              名主街劳动者的客户网络提供认证的目标。这可能增强卖方招募和组合内分销，但并不证明客户采用、实际定价或排他性获取。公开证据描述的是收购模式，而不是标准化 SaaS
              套装。卖方对价、收购倍数、业绩支付公式、服务费和实际经济性在留存材料中均未披露，因此无法与整合者、私募股权或内部建设做同口径定价比较。
            claimRefs:
              - CP007
              - CP008
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP003
              - CP006
              - CP009
              - CP014
              - CP015
      - number: '3.4'
        title: 资本与速度是优势，但尚未形成持久护城河
        blocks:
          - type: paragraph
            body: >-
              Beacon 有足够资本积极追逐收购，第三方资料也称其组合正在扩大。然而，收购速度提升整合风险的速度可能不亚于提升分销的速度。The Next Web 明确指出，AI
              滚雪球式并购模式大体未经验证，可能累积整合债务；Reuters 同样称可比 AI 驱动滚雪球式并购的长期回报仍未经验证。竞争风险因此是双向的：老牌公司可以复制 AI
              现代化叙事或调动更大的收购体系，新进入者也能争夺有吸引力的细分市场。要形成持久优势，Beacon 需要证明中央平台在整合后能持续带来可独立测量的收益，同时不损害服务质量或客户留存。
            claimRefs:
              - CP005
              - CP010
              - CP012
              - CP013
              - CP016
