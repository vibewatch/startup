      - number: '1.2'
        title: 资本形成与利益相关方结构
        blocks:
          - type: paragraph
            body: >-
              Beacon 于 2025 年 11 月以据报道的 US$1 billion 估值完成 US$250 million Series B，随后于 2026 年 6 月 9 日完成 US$225 million
              Series C。General Catalyst 与 HarbourVest 领投 Series C，另有多家老股东和新机构参与。同期报道称本轮后累计外部融资超过 US$550 million，而
              Multiples 统计披露的 Series B 和 Series C 合计为 US$475 million；因此，较窄的数字不应被称为终身融资总额。Multiples 和 BetaKit 报道 Series C
              估值为 US$1.4 billion，但公司及其法律顾问没有在留存原文中公布该估值。
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO007
          - type: table
            tableRef: TO003
            claimRefs:
              - CO003
              - CO004
              - CO005
              - CO011
      - number: '1.3'
        title: 规模与运营里程碑
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 6 月，独立报道称 Beacon 已收购超过 30 家企业，并大约每周完成一笔收购。2026 年 9 月的一份市场资料统计其组合有 45 家公司；公司创始人发布的文章称，这些公司服务超过
              22,000 家企业和机构。这些数字描述的是组合广度，而不是 Beacon 的合并收入、ARR、客户合同或现金创造能力。其运营论也已超出收购支持：公司 2026 年 2 月的公告瞄准让 500,000
              名主街劳动者获得 OpenAI 认证，之后公司材料又称收购 Haize Labs，以增加 AI 测试与安全能力。
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO011
              - CO015
              - CO016
