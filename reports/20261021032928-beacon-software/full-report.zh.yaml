            body: >-
              2026 年 6 月的 Series C 为后续收购和 Beacon AI 原生运营系统的开发提供 2.25 亿美元。同期来源将外部融资总额置于 5 亿美元以上，SiliconANGLE 具体称超过 5.5
              亿美元，而 FundedIQ 记录两轮融资合计 4.75
              亿美元；差异可能来自统计轮次不同，但无法由留存证据调和。已募集融资不等于可用现金：没有来源披露现金余额、消耗、跑道、债务工具、收购负债或营运资金需求。管理层 2025 年 11 月称 Beacon
              已盈利，2026 年 6 月又称组合 EBITDA 增长超过 50%；这些是积极信号，但都不能替代经审计的合并结果、毛利率、自由现金流或投入资本回报。
