  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与进入纪律
        blocks:
          - type: paragraph
            body: >-
              建议为继续研究，对任何点估值的信心较低，风险评级较高。最近一次披露的价格是 2025 年 11 月的 10 亿美元 Series B 估值；2026 年 6 月追加的 2.25 亿美元 Series C
              没有同时披露新估值。因此不能据此推导当前公开市值，也削弱了对 Series B 将是 Beacon 最后一轮融资这一早期预期的依赖。进入投资应以完全摊薄的 Series C
              资本结构、清算优先权、收购债务、可用于部署的现金和合并组合经济性为条件，而不是以 headline 融资额为依据。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV009
              - CV016
          - type: table
            tableRef: TV001
