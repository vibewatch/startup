  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与收入质量
        blocks:
          - type: paragraph
            body: >-
              Beacon 是收购驱动的控股公司，而不是单一产品 SaaS 供应商。Reuters 报道称，公司收购的盈利型细分软件企业通常每年产生不到 2,000 万美元的经常性收入；SiliconANGLE
              则描述了覆盖会计、市场拓展、产品改进和收购资本的运营支持。这证明组合公司层面存在经常性软件收入，但没有揭示 Beacon
              的合并收入、收入结构、确认政策、自然增长或现金转化。独立资料还提到嵌入式支付、银行和工资能力，但没有披露抽成率或贡献。细分经常性软件和盈利目标可能提升收入质量，但没有子公司与合并报表无法量化。
