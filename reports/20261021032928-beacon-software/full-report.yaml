      - CE005
      - CE006
      - CE007
      - CE013
  - id: FU001
    title: Portfolio-mediated customer expansion path
    type: journey-map
    summary: >-
      Beacon's disclosed path runs from acquisition through continuity and central enablement to customer-network
      distribution, while commercial conversion remains unreported.
    data:
      nodes:
        - id: acquire
          label: Acquire a niche software business
          detail: Continued acquisitions are a stated use of Series C proceeds.
        - id: retain
          label: Retain founder continuity
          detail: Reuters reports that founders often remain through cash-based earn-outs.
        - id: onboard
          label: Connect central infrastructure
          detail: Mantle describes Beacon managing entrepreneur partners and multiple entities.
        - id: modernize
          label: Apply engineering and operating support
          detail: Reuters describes a central acceleration team for acquired companies.
        - id: distribute
          label: Distribute capabilities through portfolio products
          detail: Four portfolio companies were named in the OpenAI certification plan.
        - id: measure
          label: Verify adoption and expansion
          detail: Portfolio-wide conversion, renewal, and expansion metrics remain undisclosed.
    approximationNotes: >-
      Ordered evidence map, not a measured funnel; nodes do not imply conversion rates, elapsed time, or
      value-proportional scale.
    claimRefs:
      - CU003
      - CU006
      - CU007
      - CU008
      - CU010
      - CU016
  - id: FR001
    title: Residual risk heatmap
    type: matrix
    summary: >-
      Qualitative prioritization places integration capacity, product migration, and financial transparency above
      partnership delivery and generalized merger review.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual severity
      rows:
        - label: Acquisition integration capacity
          note: Acquisition cadence is reported, while backlog and control-capacity data are missing.
          values:
            - label: High
              tone: negative
            - label: High
              tone: negative
            - label: Early
              tone: warning
            - label: High
              tone: negative
        - label: Product migration reliability and security
          note: Centralized rewrites are reported; portfolio incident and release data are unavailable.
          values:
            - label: Medium-high
              tone: warning
            - label: High
              tone: negative
            - label: Undisclosed
              tone: warning
            - label: High
              tone: negative
        - label: Employment-control integration
          note: A dedicated function was being created across a multi-entity portfolio.
          values:
            - label: High
              tone: negative
            - label: Medium-high
              tone: warning
            - label: Early
              tone: warning
            - label: Medium-high
              tone: warning
        - label: AI claim substantiation
          note: Regulator precedent is contextual and does not identify a Beacon violation.
          values:
            - label: Medium
              tone: warning
            - label: High
              tone: negative
            - label: Undisclosed
              tone: warning
            - label: Medium-high
              tone: warning
        - label: Financial and capital transparency
          note: Funding is reported, but cash, debt, working-capital, and portfolio financials are not.
          values:
            - label: Medium-high
              tone: warning
            - label: High
              tone: negative
            - label: Undisclosed
              tone: warning
            - label: High
              tone: negative
        - label: OpenAI collaboration delivery
          note: The target is announced, but contractual commitments and completions are not public.
          values:
            - label: Medium
              tone: warning
            - label: Medium
              tone: warning
            - label: Announced
              tone: neutral
            - label: Medium
              tone: warning
