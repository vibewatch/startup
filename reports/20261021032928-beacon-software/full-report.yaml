figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Beacon moved from formation to two large priced rounds, portfolio expansion, and an AI-training partnership in
      less than three years.
    data:
      items:
        - date: '2024'
          label: Company founded
          detail: Nilam Ganenthiran and Divya Gupta establish Beacon in Toronto.
          tone: neutral
          claimRefs:
            - CO001
        - date: '2025-11-04'
          label: Series B financing
          detail: Beacon reports a US$250M Series B at a US$1B valuation.
          tone: positive
          claimRefs:
            - CO004
        - date: '2026-02-02'
          label: OpenAI certification initiative
          detail: Company announces a goal to reach 500,000 Main Street workers during 2026.
          tone: positive
          claimRefs:
            - CO011
        - date: '2026-04-15'
          label: E2E Soccer acquisition
          detail: Database profile records Beacon's acquisition of E2E Soccer.
          tone: neutral
          claimRefs:
            - CO015
        - date: '2026-04-15'
          label: PowerUp Sports acquisition
          detail: Database profile records Beacon's acquisition of PowerUp Sports.
          tone: neutral
          claimRefs:
            - CO015
        - date: '2026-06-09'
          label: Series C financing
          detail: Beacon raises US$225M led by General Catalyst and HarbourVest.
          tone: positive
          claimRefs:
            - CO005
        - date: '2026-06-09'
          label: Valuation reported
          detail: Third-party sources report a US$1.4B Series C valuation.
          tone: neutral
          claimRefs:
