      - CO004
      - CO005
      - CO007
      - CO009
      - CO011
      - CO015
      - CO016
  - id: FM001
    title: Evidence-constrained market and adoption indicators
    type: pyramid
    summary: >-
      Six source-backed indicators bound Beacon's target and deployment surface without asserting a dollar TAM, SAM, or
      SOM.
    data:
      nodes:
        - label: Typical target ARR ceiling
          value: 20
          unit: USD millions
          detail: Reuters reported that typical targets generated less than this amount.
        - label: Reported acquisition interval
          value: 2
          unit: weeks
          detail: Founder-reported cadence as of November 2025.
        - label: Reported active-user reach
          value: 1000000
          unit: users, minimum
          detail: Company-issued November 2025 portfolio description.
        - label: Planned certification reach
          value: 500000
          unit: workers
          detail: Company-announced 2026 program target, not completed delivery.
        - label: SMBs without full-time IT
          value: 40
          unit: percent
          detail: IDC survey finding from nearly 3,000 SMBs.
        - label: SMBs not using AI
          value: 6.3
          unit: percent
          detail: IDC 2025 survey result, down from 11.2% in 2024.
    approximationNotes: >-
      Node order is analytical only. Values use different units, populations, and periods; layer size is not additive,
      proportional, or a conversion funnel.
    claimRefs:
      - CM003
      - CM004
      - CM007
      - CM011
      - CM013
      - CM014
  - id: FP001
    title: Competitive positioning by ownership horizon and AI-modernization emphasis
    type: quadrant
    summary: >-
      Ordinal placement separates Beacon's stated permanent-hold, AI-modernization position from established
      consolidators, newer AI roll-ups, and finite-horizon private equity.
    data:
      xAxis:
        label: 'Ownership horizon: shorter / unknown to explicitly permanent'
        min: 1
        max: 5
      yAxis:
        label: 'Central AI-modernization emphasis: low / unknown to explicit'
        min: 1
        max: 5
      points:
        - label: Beacon Software
          x: 5
          'y': 5
          detail: Explicit indefinite-hold position and in-house AI acceleration model.
        - label: Constellation Software
          x: 5
          'y': 2
          detail: Long-duration consolidator comparison; retained evidence does not establish a central AI emphasis.
        - label: Valsoft
          x: 4
          'y': 2
          detail: Similar consolidator strategy; both scores carry material evidence limits.
        - label: Thrive Holdings
          x: 2
          'y': 4
          detail: Accounting-focused AI roll-up; holding horizon is not established.
        - label: Titan
          x: 2
          'y': 4
          detail: IT-focused AI roll-up; holding horizon is not established.
        - label: Traditional software PE
          x: 1
          'y': 2
          detail: Coverage contrasts finite exits and cost optimization with Beacon's model; AI emphasis is unknown.
    approximationNotes: >-
      Scores are 1-5 ordinal analyst assessments derived only from the assigned sources, not measured benchmarks;
      unknown capabilities are scored conservatively and explained in each point.
    claimRefs:
      - CP016
  - id: FI001
    title: Publicly evidenced capital-to-portfolio-performance mechanism
    type: flow
    summary: >-
      Public evidence describes the operating sequence, but does not disclose the revenue-to-gross- profit or
      EBITDA-to-cash conversion needed for a financial bridge.
    data:
      nodes:
        - id: equity-capital
          label: Equity capital
          detail: $225M Series C in June 2026; total outside funding reported above $500M
        - id: acquire-assets
          label: Acquire software businesses
          detail: Profitable or near-profitable niche vertical software targets
        - id: recurring-base
          label: Portfolio recurring revenue
          detail: Targets typically generate less than $20M ARR
        - id: shared-operations
          label: Central operating support
          detail: Accounting, payroll, go-to-market expertise, and acquisition capital
        - id: ai-modernization
          label: AI and product modernization
          detail: Central platform and acceleration team update products and operations
        - id: portfolio-performance
          label: Portfolio earnings outcome
          detail: More than 50% EBITDA growth over the prior year, company-claimed
      edges:
        - from: equity-capital
          to: acquire-assets
          label: funds acquisitions
        - from: acquire-assets
          to: recurring-base
          label: adds operating businesses
        - from: recurring-base
          to: shared-operations
          label: enters shared model
        - from: shared-operations
          to: ai-modernization
          label: enables modernization
        - from: ai-modernization
          to: portfolio-performance
          label: intended operating leverage
    approximationNotes: >-
      This is a mechanism map, not a quantified waterfall; no revenue, gross-profit, cash-flow, or
      return-on-invested-capital conversion rate is publicly disclosed.
    claimRefs:
      - CI001
      - CI005
      - CI007
      - CI008
      - CI009
      - CI012
      - CI014
  - id: FE001
    title: Publicly evidenced product architecture map
    type: stack
    summary: >-
