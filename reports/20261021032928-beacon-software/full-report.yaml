      - CR010
      - CR011
      - CR014
      - CR015
      - CR016
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: The decision chain separates demonstrated capital access from the still-unproven price and operating denominators.
    data:
      nodes:
        - id: historical-mark
          label: $1B Series B mark (Nov 2025)
        - id: financing-structure
          label: Series B reported all-equity and all-primary
        - id: new-capital
          label: $225M Series C (Jun 2026)
        - id: missing-mark
          label: No Series C valuation disclosed
        - id: operating-claims
          label: Weekly M&A and >50% EBITDA-growth claims
        - id: missing-denominators
          label: Consolidated revenue, cash flow, and preferences unavailable
        - id: model-risk
          label: Long-run AI roll-up returns remain untested
        - id: decision
          label: Research more; require price protection
      edges:
        - from: historical-mark
          to: financing-structure
        - from: financing-structure
          to: new-capital
        - from: new-capital
          to: missing-mark
        - from: missing-mark
          to: operating-claims
        - from: operating-claims
          to: missing-denominators
        - from: missing-denominators
          to: model-risk
        - from: model-risk
          to: decision
    approximationNotes: Qualitative decision sequence only; node order does not imply a numerical conversion, probability, or valuation.
