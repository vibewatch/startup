chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Beacon Software was founded in 2024 in Toronto by Nilam Ganenthiran and Divya Gupta. Ganenthiran
              previously served as Instacart president and invested at D1 Capital Partners; Gupta was previously a
              Sequoia Capital partner. Beacon is not presented as a conventional finite-life buyout fund: it acquires
              profitable or near-profitable vertical software companies, intends to hold them indefinitely, and supplies
              shared engineering, artificial-intelligence, go-to-market, and back-office capabilities. Subsidiaries
              retain their brands and operating teams. This structure makes the founders' acquisition judgment and the
              central acceleration team's execution important dependencies, while public evidence does not identify a
              broader executive bench or board.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO012
              - CO013
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO005
              - CO006
              - CO007
              - CO009
              - CO010
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO003
      - number: '1.2'
        title: Capital formation and stakeholder structure
        blocks:
          - type: paragraph
            body: >-
              Beacon raised a US$250 million Series B in November 2025 at a reported US$1 billion valuation, followed by
              a US$225 million Series C on June 9, 2026. General Catalyst and HarbourVest led the Series C, with several
              returning and new institutional participants. Contemporary reports put cumulative external funding above
              US$550 million after the round, whereas Multiples totals US$475 million across the disclosed Series B and
              Series C; the narrower figure therefore should not be presented as lifetime funding. Multiples and BetaKit
              report a US$1.4 billion Series C valuation, but the company and its counsel did not publish that valuation
              in the retained source text.
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO007
          - type: table
            tableRef: TO003
            claimRefs:
              - CO003
              - CO004
              - CO005
              - CO011
      - number: '1.3'
        title: Scale and operating milestones
        blocks:
          - type: paragraph
            body: >-
              By June 2026, independent reporting said Beacon had acquired more than 30 businesses and was completing
              roughly one acquisition per week. A September 2026 market profile counted 45 portfolio companies, while a
              company-founder post said those companies served more than 22,000 businesses and institutions. These
              figures describe portfolio breadth, not Beacon's consolidated revenue, ARR, customer contracts, or cash
              generation. The operating thesis also expanded beyond acquisition support: a February 2026 company release
              targeted access to OpenAI certifications for 500,000 Main Street workers, and later company-originated
              material described the acquisition of Haize Labs to add AI testing and safety capability.
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO011
              - CO015
              - CO016
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO004
              - CO005
              - CO007
              - CO009
              - CO011
              - CO015
              - CO016
      - number: '1.4'
        title: Underwriting implications and unresolved governance
        blocks:
          - type: paragraph
            body: >-
              The evidence establishes substantial capital access and a rapid acquisition cadence, but it does not yet
              establish that the portfolio creates durable economic value. Reuters noted that long-term returns from
              AI-enabled roll-up models remain untested. Beacon told Reuters that it was profitable as an entity and
              that targets were consistently profitable, yet no retained source provides consolidated revenue, ARR,
              EBITDA, cash flow, leverage, or purchase multiples. The assigned evidence also does not disclose the exact
              legal entity, board membership, voting rights, liquidation preferences, or investor consent rights. Those
              omissions prevent a complete assessment of governance, dilution, key-person exposure, and capital
              available for future acquisitions.
            claimRefs:
              - CO012
              - CO013
              - CO014
      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Rapid deployment does not prove realized returns
            body: >-
              The acquisition cadence and capital raised are visible, but independent reporting explicitly says
              long-term returns from AI roll-ups remain untested.
            calloutType: risk
            claimRefs:
              - CO008
              - CO014
          - type: callout
            title: Funding totals use different denominators
            body: >-
              US$475M is the sum of the disclosed Series B and C, while contemporary reporting says cumulative funding
              exceeded US$550M after including earlier capital. Neither amount is cash currently available.
            calloutType: assumption
            claimRefs:
              - CO004
              - CO005
              - CO006
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Beacon operates across two linked markets. Upstream, it competes to acquire profitable, founder-led
              vertical-software businesses serving narrow Main Street workflows; Reuters reported that typical targets
              had less than $20 million of ARR, while Beacon describes itself as a permanent owner that builds the AI
              products those businesses need next. Downstream, the acquired companies sell workflow software and
              AI-enabled extensions to existing organizations in education, finance, logistics, recreation,
              manufacturing, government, insurance, and other niches. The investable boundary therefore excludes broad
              horizontal SaaS, general-purpose AI infrastructure, and the full SMB technology budget. Status-quo
              substitutes include leaving legacy products unchanged, using manual back-office work, buying a standalone
              AI point solution, or selling to a conventional financial sponsor rather than Beacon.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM008
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM008
              - CM009
              - CM010
              - CM011
              - CM014
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              The retained evidence does not support a conventional dollar TAM, SAM, or SOM. It provides boundary and
              reach indicators instead: Beacon said in November 2025 that it had acquired dozens of businesses serving
              thousands of enterprise customers and more than one million active users, while Reuters reported an
              acquisition cadence of about one company every two weeks. A 2026 initiative targeted AI certifications for
              500,000 workers across the customer network. These figures describe different populations and periods, are
              mostly company-issued, and cannot be multiplied into revenue. The official site offers one commercial
              proof point--a six-figure AI project sold within 90 days--but one case cannot establish portfolio-wide
              attach rate, pricing, retention, or addressable spend. Valuation work should therefore model cohorts from
              private operating data rather than capitalize a generic market forecast.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM011
              - CM013
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM004
              - CM007
              - CM011
              - CM013
              - CM014
      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The acquisition-side buyer is Beacon and the seller is usually a founder of a profitable niche software
              company; permanence, modernization capital, and a shared technology team are the proposed reasons to
              transact. The downstream buyer and payer remain the portfolio company's existing business or institutional
              customer, while day-to-day users are its operational staff. Beacon's System Dynamics example shows the
              path: an inherited customer relationship led to a finance-automation discussion with a CFO, then a
              multi-year subscription with some outcome-linked pricing. This installed-base motion is strategically
              important because IDC reports that many SMBs lack full-time IT staff and prefer AI embedded in software
              they already use. However, neither the case study nor public portfolio totals disclose repeatable
              conversion, sales-cycle, or expansion economics.
            claimRefs:
              - CM001
              - CM003
              - CM008
              - CM009
              - CM010
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM002
              - CM008
              - CM009
              - CM010
              - CM011
              - CM014
              - CM015
              - CM016
      - number: '2.4'
        title: Drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Independent SMB evidence supports the direction of demand but also sharpens the execution hurdle. IDC
              found AI moved from the third-ranked forward-looking technology priority in 2024 to first in 2025, and the
              share of surveyed SMBs not using AI fell from 11.2% to 6.3%. That favors Beacon's embedded-distribution
              thesis. Adoption is not frictionless: 40% of nearly 3,000 surveyed SMBs had no full-time IT employee,
              unpredictable pricing can erode trust, and secure implementation was their leading stated challenge in
              IDC's 2026 data. Beacon must therefore deliver simple deployment, predictable economics, and security
              through each portfolio product. The valuation implication is asymmetric: a large installed reach can
              create option value, but without independently verified attach rates, retention, gross margin, and
              acquisition-cohort returns, public evidence cannot show that demand converts into durable incremental cash
              flow.
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Public evidence does not establish a dollar market size
            body: >-
              Treat portfolio reach as an option set, not TAM. Request acquisition-pipeline counts, eligible-target ARR,
              purchase multiples, customer attach rates, expansion ARR, retention, and cohort returns before using
              market size in valuation.
            calloutType: risk
            claimRefs:
              - CM003
              - CM005
              - CM006
              - CM007
              - CM009
              - CM010
              - CM014
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape spans capital, operations, and the decision not to sell
        blocks:
          - type: paragraph
            body: >-
              The relevant market is not a conventional software feature contest. Beacon competes first for control of
              profitable, founder-led vertical-software companies and then for the ability to improve them after
              acquisition. Independent coverage identifies established Canadian consolidators Constellation Software and
              Valsoft, software-focused private-equity firms such as Thoma Bravo and Vista Equity Partners, and newer AI
              roll-ups including Thrive Holdings and Titan. A seller can also decline a transaction and fund
              modernization internally, making status quo and internal build real substitutes even though the retained
              sources do not quantify their prevalence. Beacon's capital base and weekly acquisition claim make it a
              well-funded entrant, but Constellation's reported 1,000-plus acquisition history gives the incumbent a
              much deeper demonstrated operating record.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP010
              - CP012
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP016
      - number: '3.2'
        title: Differentiation rests on ownership horizon and a shared operating layer
        blocks:
          - type: paragraph
            body: >-
              Beacon's stated wedge combines indefinite ownership with an in-house acceleration team that rewrites
              products, automates accounting and payroll, and speeds product development. That proposition differs from
              the cost-reduction and finite-exit framing attributed to traditional private equity, while cash-based
              earn-outs are intended to keep founders involved after a sale. The operating model is more consequential
              than an AI label: capital from the 2026 Series C was earmarked both for acquisitions and for an AI-native
              business operating system. The capability remains only partly verified, however. Reported portfolio EBITDA
              improvement is a company-provided figure, and the retained evidence offers no controlled benchmark against
              Constellation, Valsoft, or private-equity ownership.
            claimRefs:
              - CP006
              - CP009
              - CP014
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP009
              - CP012
              - CP014
              - CP015
      - number: '3.3'
        title: Distribution can compound across the portfolio, while transaction economics remain opaque
        blocks:
          - type: paragraph
            body: >-
              Beacon's portfolio provides a built-in channel for shared capabilities: its company-issued OpenAI
              announcement named four portfolio businesses and set a goal of offering certifications across a customer
              network reaching 500,000 Main Street workers during 2026. This may strengthen seller recruitment and
              cross-portfolio distribution, but it is not evidence of customer adoption, realized pricing, or exclusive
              access. Public evidence describes an acquisition model rather than standardized SaaS packaging. Seller
              consideration, acquisition multiples, earn-out formulas, service charges, and realized economics are
              undisclosed in the retained pool, preventing a like-for-like pricing comparison with consolidators,
              private equity, or internal build.
            claimRefs:
              - CP007
              - CP008
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP003
              - CP006
              - CP009
              - CP014
              - CP015
      - number: '3.4'
        title: Capital and speed are advantages, but not yet a durable moat
        blocks:
          - type: paragraph
            body: >-
              Beacon has enough capital to pursue acquisitions aggressively, and third-party profiles report a growing
              portfolio. Yet acquisition velocity can increase integration risk as quickly as it increases distribution.
              The Next Web explicitly notes that the AI-roll-up model is largely untested and could accumulate
              integration debt; Reuters similarly reports that long-term returns for comparable AI-driven roll-ups
              remain untested. The competitive risk is therefore two-sided: incumbents can copy AI-modernization
              language or deploy larger acquisition playbooks, while newer roll-ups can contest attractive niches.
              Durable advantage would require evidence that Beacon's central platform produces repeatable, independently
              measured gains after integration without weakening service quality or customer retention.
            claimRefs:
              - CP005
              - CP010
              - CP012
              - CP013
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The primary go-to-market motion is acquisition
            body: >-
              Beacon reaches end users by buying vertical-software businesses, then distributing shared technology and
              training through their installed customer networks.
            calloutType: insight
            claimRefs:
              - CP004
              - CP007
              - CP008
          - type: callout
            title: Operating proof trails acquisition velocity
            body: >-
              Weekly acquisition cadence and company-reported EBITDA growth do not resolve whether a rapidly expanding
              portfolio can avoid integration debt over a full cycle.
            calloutType: risk
            claimRefs:
              - CP005
              - CP012
              - CP013
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and revenue quality
        blocks:
          - type: paragraph
            body: >-
              Beacon is an acquisition-led holding company rather than a single-product SaaS vendor. Reuters reported
              that it buys profitable niche software companies that typically generate less than $20 million of annual
              recurring revenue, while SiliconANGLE described operating support spanning accounting, go-to-market
              expertise, product improvement, and acquisition capital. This establishes recurring software revenue at
              the portfolio-company level, but it does not reveal Beacon's consolidated revenue, revenue mix,
              recognition policy, organic growth, or cash conversion. An independent profile also describes embedded
              payment, banking, and payroll capabilities, but no take rate or contribution is disclosed. The resulting
              revenue quality may benefit from niche recurring software and profitable targets, yet it cannot be
              quantified without subsidiary and consolidation schedules.
            claimRefs:
              - CI005
              - CI009
              - CI010
              - CI011
              - CI015
              - CI016
          - type: table
            tableRef: TI001
            claimRefs:
              - CI005
              - CI007
              - CI009
              - CI011
              - CI015
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI005
              - CI007
              - CI008
              - CI009
              - CI012
              - CI014
      - number: '4.2'
        title: Pricing and acquisition efficiency
        blocks:
          - type: paragraph
            body: >-
              Public evidence is more informative about Beacon's acquisition throughput than about customer
              monetization. Reuters reported an acquisition pace of about one business every two weeks in November 2025;
              June 2026 coverage reported roughly one per week, and SiliconANGLE said deals usually close within 60 days
              after the process begins. These are useful deployment and sourcing proxies, not CAC, payback, sales-cycle,
              or channel-economics measures for the underlying software products. Cash-based founder earn-outs may align
              sellers with post-close performance, but their amounts, duration, hurdles, and balance-sheet treatment are
              private. No retained source provides list prices, realized prices, discounting, contract duration, renewal
              rates, or customer acquisition cost for the portfolio.
            claimRefs:
              - CI006
              - CI013
              - CI014
              - CI015
          - type: table
            tableRef: TI002
            claimRefs:
              - CI006
              - CI013
              - CI014
              - CI015
      - number: '4.3'
        title: Capital base, operating leverage, and unit economics
        blocks:
          - type: paragraph
            body: >-
              The June 2026 Series C supplied $225 million for additional acquisitions and development of Beacon's
              AI-native operating system. Contemporary sources put total outside funding above $500 million, with
              SiliconANGLE specifying more than $550 million, while FundedIQ records $475 million across two rounds; the
              difference likely reflects round coverage but cannot be reconciled from the retained evidence. Funding
              raised is not cash available: none of the sources discloses cash on hand, burn, runway, debt facilities,
              acquisition liabilities, or working-capital needs. Management's November 2025 claim that Beacon was
              profitable and its June 2026 claim of more than 50% portfolio EBITDA growth are encouraging signals, but
              neither substitutes for audited consolidated results, gross margins, free cash flow, or return on invested
              capital.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI007
              - CI008
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI006
              - CI007
              - CI008
              - CI013
              - CI015
      - number: '4.4'
        title: Financial verdict and underwriting blockers
        blocks:
          - type: paragraph
            body: >-
              Beacon's public financial case rests on three linked propositions: acquire already-profitable vertical
              software assets, centralize operating work, and use AI-enabled product modernization to increase portfolio
              earnings. The model has credible early signals in reported acquisition cadence and claimed EBITDA growth,
              but independent coverage cautions that AI roll-ups remain untested and may accumulate integration debt.
              The repeated need for external equity also weakens the earlier expectation that the November 2025
              financing would be the last round. Until management provides consolidated and subsidiary financials,
              acquisition cohorts, earn-out obligations, debt terms, organic versus acquired growth, gross margin, and
              cash-flow bridges, investors cannot distinguish durable operating leverage from capital-funded scale.
            claimRefs:
              - CI004
              - CI006
              - CI007
              - CI012
              - CI013
              - CI015
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Capital access and reported operating momentum
            body: >-
              A $225M Series C, faster acquisition cadence, and claimed portfolio EBITDA growth give Beacon substantial
              capacity to execute its acquisition-and-modernization strategy.
            calloutType: strength
            claimRefs:
              - CI001
              - CI006
              - CI007
              - CI008
          - type: callout
            title: Funding is not runway
            body: >-
              More than $500M of reported funding does not reveal cash available after acquisitions, and the retained
              evidence contains no burn, debt, covenant, earn-out, or runway schedule.
            calloutType: risk
            claimRefs:
              - CI002
              - CI013
              - CI015
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product and delivery model
        blocks:
          - type: paragraph
            body: >-
              Beacon delivers modernization through acquired vertical-software businesses rather than through one
              publicly documented end-user SKU. Its disclosed model combines permanent ownership with shared AI,
              engineering, product and go-to-market capabilities. Reuters describes an acceleration team of engineers
              and product managers that rewrites products, automates accounting and payroll, and speeds product
              development. The resulting customer experience therefore remains embedded in portfolio brands and domain
              workflows, while central teams supply technical and operating leverage. Public examples span education,
              recreation, finance and government-adjacent services, but the evidence does not show which portfolio
              products have completed modernization, which remain on legacy stacks, or how much functionality is shared
              rather than locally built.
            claimRefs:
              - CE001
              - CE002
              - CE006
              - CE009
              - CE010
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
              - CE007
              - CE008
      - number: '5.2'
        title: Architecture and technical maturity
        blocks:
          - type: paragraph
            body: >-
              The clearest architectural commitment is Beacon's stated AI-native business operating system, for which
              its June 2026 financing was earmarked alongside additional acquisitions. That is a roadmap and
              capital-allocation signal, not proof of a production-standardized platform. The September acquisition of
              Haize Labs is more specific: its tools cover simulation testing, adversarial testing, runtime guardrails
              and evaluations for enterprise AI agents, and its team became Beacon's Applied AI Research Group. These
              capabilities could strengthen a portfolio-wide control layer, but no allocated source documents model
              providers, APIs, tenancy, data movement, observability, release management or the degree of integration
              between the Haize toolchain and operating portfolio products.
            claimRefs:
              - CE003
              - CE004
              - CE013
              - CE014
          - type: table
            tableRef: TE003
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE013
              - CE014
              - CE015
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE006
              - CE007
              - CE013
      - number: '5.3'
        title: Workflow, deployment and integration evidence
        blocks:
          - type: paragraph
            body: >-
              The E2E Soccer and PowerUp Sports combination is the strongest workflow-level example in the allocated
              evidence. The announced product scope runs from registration and roster management through scheduling,
              referee assignments and discipline tracking, while both companies were expected to retain their brands and
              leadership. This suggests integration through coordinated products rather than immediate brand or
              organizational consolidation. Separately, Beacon and OpenAI announced an enablement program intended to
              make certifications and job-connected training available to 500,000 Main Street workers. Neither
              disclosure provides implementation duration, migration effort, adoption, uptime, error-rate or realized
              customer-outcome data, so product maturity cannot be inferred from breadth of announced scope.
            claimRefs:
              - CE005
              - CE007
              - CE008
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE004
              - CE005
              - CE007
              - CE008
      - number: '5.4'
        title: Differentiation, controls and technical risks
        blocks:
          - type: paragraph
            body: >-
              Beacon's potential differentiation is the combination of permanent ownership, domain distribution, a
              central acceleration team and a reusable AI platform across many small vertical-software businesses. That
              combination could spread scarce engineering and reliability expertise across products that could not fund
              it alone. The evidence does not yet establish that this operating model produces repeatable technical
              outcomes: Reuters explicitly notes that long-term returns from AI roll-ups remain untested, and the
              allocated sources contain no independent benchmark of product quality, deployment speed or reliability.
              They also provide no public status page, SLA, incident history, security certification, privacy
              architecture, software bill of materials or repository/package activity. Diligence should therefore test
              platform reuse and control effectiveness at subsidiary level rather than treating a central-team
              description as proof of integration.
            claimRefs:
              - CE001
              - CE011
              - CE012
              - CE015
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Reliability capability became more concrete
            body: >-
              Haize Labs contributes named testing, guardrail and evaluation functions, giving Beacon a more specific
              control capability than the otherwise high-level AI-platform descriptions.
            calloutType: strength
            claimRefs:
              - CE004
          - type: callout
            title: Architecture remains unauditable from public evidence
            body: >-
              Platform boundaries, deployment maturity, security controls and operational performance remain
              undocumented in the allocated public sources.
            calloutType: risk
            claimRefs:
              - CE014
              - CE015
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: A portfolio-mediated customer base
        blocks:
          - type: paragraph
            body: >-
              Beacon's commercial exposure is mediated through acquired software companies rather than one homogeneous
              product. Reuters describes the acquisition target as profitable niche vendors serving youth sports
              leagues, campgrounds, manufacturers, and unions, while Beacon's February 2026 announcement adds colleges,
              schools, government services, insurers, first responders, and universities across the United States and
              Canada. An independent profile reported 45 portfolio companies serving more than 22,000 businesses and
              institutions by September 2026, but did not disclose the underlying customer list, payer mix, revenue
              distribution, or metric methodology. The resulting breadth diversifies use cases while making
              portfolio-wide customer quality difficult to evaluate: buyers, daily users, beneficiaries, and payers
              differ materially by vertical and subsidiary.
            claimRefs:
              - CU001
              - CU002
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU006
      - number: '6.2'
        title: Adoption proof is real but narrow
        blocks:
          - type: paragraph
            body: >-
              Public adoption evidence is strongest for PowerUp Sports. AI Market Watch names Ontario Soccer and BC
              Soccer as customers, and Software Advice includes long-term, daily-use reviews from Mount Hamilton Youth
              Soccer Club and Bolton Wanderers Soccer Club. Its current page shows 31 reviews, including 30 five-star
              ratings and one four-star rating; the archived Capterra page separately showed 21 reviews and a 5.0
              overall score. Individual reviewers describe years of production use, responsive support, and operational
              reliance, but also cite setup, mastery, mobile administration, and scheduling limitations. These
              marketplace signals demonstrate product-level durability for one subsidiary; they do not establish
              Beacon-wide NRR, GRR, churn, renewal, or customer satisfaction.
            claimRefs:
              - CU005
              - CU011
              - CU012
              - CU013
              - CU014
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
              - CU004
              - CU011
              - CU013
              - CU014
          - type: table
            tableRef: TU003
            claimRefs:
              - CU005
              - CU011
              - CU012
      - number: '6.3'
        title: Expansion is acquisition-led; organic economics are opaque
        blocks:
          - type: paragraph
            body: >-
              Beacon publicly frames expansion as a combination of continued acquisitions, founder continuity, central
              operating support, and new capabilities distributed through portfolio companies. Osler reported that
              Series C proceeds would support continued acquisitions, while Reuters reported a late-2025 pace of one
              acquisition about every two weeks and said founders often remained through cash-based earn-outs. Beacon's
              announced OpenAI initiative aims to make certifications available through College Kickstart, Let's Camp,
              PowerUp Sports, and MAP Policy Partners to 500,000 Main Street workers in 2026. This is a reach target,
              not measured adoption or revenue expansion. No retained source quantifies cross-sell, expansion ARR,
              renewal uplift, top-customer exposure, channel dependence, or procurement cycle. WhatJobs also cautions
              that reported portfolio performance is company-supplied and that the model remains untested over long
              horizons.
            claimRefs:
              - CU003
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
              - CU015
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU003
              - CU006
              - CU007
              - CU008
              - CU010
              - CU016
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Product-level reviews cannot substitute for portfolio retention
            body: >-
              PowerUp Sports has unusually positive and durable public reviews, but Beacon does not disclose NRR, GRR,
              churn, renewals, contract length, or customer concentration for PowerUp or the broader portfolio.
            calloutType: risk
            claimRefs:
              - CU011
              - CU012
              - CU013
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal and regulatory exposure
        blocks:
          - type: paragraph
            body: >-
              The clearest company-specific legal-control signal is Beacon's 2026 employment-counsel posting: it
              described the employment function as being built from the ground up, with one specialist expected to
              establish governance, policies, escalation protocols, and multi-jurisdiction support across Beacon and its
              portfolio. That is evidence of active mitigation, but also of early control maturity during rapid
              acquisition. Separately, SEC enforcement against unrelated advisers demonstrates that unsupported AI
              representations can produce penalties, while the DOJ/FTC merger guidelines describe the frameworks used in
              transaction review. Neither regulator source alleges misconduct by Beacon. The diligence priority is
              therefore evidence of implemented controls, claim substantiation, and transaction review rather than an
              unsupported conclusion that Beacon has or has not had a legal event.
            claimRefs:
              - CR001
              - CR002
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
              - CR007
              - CR010
              - CR011
              - CR012
      - number: '7.2'
        title: Operating, integration, and technical risk
        blocks:
          - type: paragraph
            body: >-
              Reuters reported that Beacon was buying roughly one business every two weeks in late 2025 and using a
              central acceleration team to rewrite products and automate accounting, payroll, and development. That
              model concentrates value creation and execution risk in a shared team: integration throughput, release
              quality, security review, data migration, and portfolio change management must all keep pace with
              acquisitions. Founder retention and cash earn-outs may preserve domain knowledge, but they do not by
              themselves prove standardized controls or successful migrations. The same Reuters report called long-term
              returns for comparable AI-enabled roll-ups untested. The assigned pool provides no portfolio-wide
              incident, outage, security, customer-concentration, or control-testing dataset, so residual severity
              remains high until those records are reviewed.
            claimRefs:
              - CR003
              - CR005
              - CR006
              - CR013
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
              - CR006
              - CR012
              - CR013
              - CR016
      - number: '7.3'
        title: Partner, capital, and financial-model dependencies
        blocks:
          - type: paragraph
            body: >-
              Beacon announced an OpenAI certification collaboration intended to reach 500,000 Main Street workers in
              2026, and Osler reported that the June 2026 Series C would fund both acquisitions and the AI-native
              operating system. Those disclosures show access to partners and capital, but not delivery rates, partner
              economics, subsidiary leverage, cash availability, working capital, or portfolio concentration. Reuters
              reported that targeted businesses were typically below $20 million of annual recurring revenue and
              consistently profitable; that description is not a substitute for audited portfolio financials. A
              low-reputation profile reports a 45-company portfolio and more than 22,000 served organizations, but its
              scale and EBITDA claims are not corroborated in the assigned pool and should not anchor underwriting.
            claimRefs:
              - CR004
              - CR007
              - CR008
              - CR009
              - CR014
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR005
              - CR007
              - CR008
              - CR009
              - CR013
              - CR016
      - number: '7.4'
        title: Monitoring priorities and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The risk view should be updated against measurable evidence, not the absence of public bad news. A thesis
              break would include a material regulatory finding tied to AI claims or acquisition conduct, repeated
              severe outages or security events across migrated products, integration backlogs that rise while
              acquisition cadence remains high, or audited results showing that portfolio growth depends on leverage,
              deteriorating working capital, or concentrated customers. Near-term monitors are completed
              employment-control playbooks, product-migration test results, incident and vulnerability logs, retention
              by acquisition cohort, partner-service commitments, and consolidated cash-flow and debt schedules. Until
              Beacon supplies those records and corroborates reported scale metrics, the heatmap is a qualitative
              prioritization of evidenced mechanisms and documented gaps, not a measured loss forecast.
            claimRefs:
              - CR006
              - CR010
              - CR011
              - CR014
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR006
              - CR010
              - CR011
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Public silence is not a clean incident record
            body: >-
              The assigned evidence does not provide a portfolio-wide incident, outage, litigation, control, or
              customer-concentration record. Underwriting should require those records rather than infer safety from the
              absence of a cited event.
            calloutType: risk
            claimRefs:
              - CR016
          - type: callout
            title: Gate acquisition pace on integration evidence
            body: >-
              Require cohort-level integration, reliability, retention, and cash-flow scorecards before treating rapid
              acquisition cadence as repeatable value creation.
            calloutType: recommendation
            claimRefs:
              - CR003
              - CR005
              - CR006
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The recommendation is research-more, with low confidence in any point valuation and a high risk rating.
              The last disclosed price was the $1 billion Series B valuation in November 2025, while a further $225
              million Series C in June 2026 arrived without a new valuation disclosure. That sequence prevents a current
              public mark from being inferred. It also weakens reliance on the earlier expectation that the Series B
              would be Beacon's final round. Entry should therefore be conditional on the fully diluted Series C
              capitalization, liquidation preferences, acquisition debt, cash available for deployment, and consolidated
              portfolio economics rather than on the headline amount raised.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV009
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV009
              - CV010
              - CV011
              - CV016
      - number: '8.2'
        title: Thesis, anti-thesis, and proof burden
        blocks:
          - type: paragraph
            body: >-
              The thesis is that frequent acquisitions of small profitable vertical-software businesses can create a
              permanent-capital compounding platform when shared AI and operating resources improve portfolio economics.
              Public reporting carries encouraging signals: Beacon said it was acquiring roughly one company per week
              and had produced more than 50 percent portfolio EBITDA growth, while a later market profile reported 45
              companies serving more than 22,000 businesses and institutions. The anti-thesis is equally material: those
              operating figures are not audited in the reviewed evidence, current consolidated revenue was not
              disclosed, and independent reporting says the long-run AI roll-up model remains untested.
            claimRefs:
              - CV007
              - CV008
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV004
              - CV007
              - CV008
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
      - number: '8.3'
        title: Scenarios and valuation method
        blocks:
          - type: paragraph
            body: >-
              A defensible valuation should use a sum-of-the-parts or acquisition-cohort cash-flow approach, not a
              venture revenue multiple applied to undisclosed consolidated revenue. The required model would separate
              purchase price, organic growth, EBITDA improvement, central-platform cost, debt, working capital,
              earn-outs, and dilution by acquisition cohort. None of the reviewed public sources supplies that complete
              denominator set, so numerical bull, base, and bear ranges would create false precision. The scenario table
              instead defines evidence thresholds: validated cohort economics support upside, sustained but unverified
              execution preserves the base research posture, and integration debt or financing dependence triggers the
              downside case.
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV016
      - number: '8.4'
        title: Exit readiness, diligence asks, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Conventional exit readiness is not established because Beacon presents itself as a permanent owner and the
              reviewed public evidence provides no IPO, strategic-sale, or distribution timetable. The underwriting path
              is therefore return-through-compounding: investors need evidence that portfolio free cash flow can fund
              acquisitions and central technology without repeated equity rounds. Before investment, diligence should
              reconcile every acquisition cohort, validate the reported EBITDA improvement, disclose retention and
              organic growth, and model preference waterfalls. Thesis-break triggers are another valuation-undisclosed
              financing, materially slower acquisition integration, failure to validate portfolio EBITDA gains, or
              evidence that central costs consume subsidiary cash generation.
            claimRefs:
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV013
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price is the unresolved variable
            body: >-
              Capital access and acquisition velocity are not substitutes for a current fully diluted valuation. Proceed
              only after the Series C terms and cohort cash economics support the required return.
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV005
              - CV007
              - CV008
              - CV016
