chapter:
  number: 6
  title: "Customers"
  summary: "Agibot has transitioned from exploratory lab robotics to measurable commercial deployments across electronics assembly, semiconductor handling, logistics parcel sorting, and retail guidance. Through its standardized seven-solution framework and flexible Robot-as-a-Service (RaaS) leasing model operating across 17 countries, the company reports scaling to over 15,000 manufactured units by mid-2026 and capturing 43% of global 1H 2026 humanoid shipments. However, commercial adoption remains characterized by significant customer concentration in consumer electronics and pilot-stage industrial deployments, while formal retention metrics (NRR/GRR), fleet payback economics, and multi-year production renewals remain entirely undisclosed."
sections:
  - id: "customer-segmentation-and-commercial-structure"
    title: "Customer Base Segmentation, Buyer Personas, and Commercial Delivery Channels"
    body: "Agibot structures its commercial customer base across four primary buyer segments: high-precision electronics and semiconductor manufacturing, complex warehouse logistics and parcel fulfillment, commercial retail and public infrastructure services, and high-security utility inspection [CU001, CU002]. In industrial manufacturing, procurement is driven by plant operations directors and automation engineers evaluating throughput consistency, sub-millimeter placement precision, and seamless integration with existing Manufacturing Execution Systems (MES) and Automated Guided Vehicles (AGVs) [CU002, CU003]. For commercial retail, airport transit, and hospitality environments, corporate marketing executives and facility managers purchase or lease units to enhance visitor throughput, automate customer inquiry resolution, and capture public attention [CU002, CU004]. To lower high upfront capital expenditure barriers that traditionally stall enterprise humanoid adoption, Agibot operates a dual go-to-market structure combining direct capital sales with a localized Robot-as-a-Service (RaaS) leasing network across 17 countries and regions, including Europe, North America, Australia, New Zealand, and Southeast Asia, featuring minimum rental periods from one day starting at €899 [CU004, CU005, CU006]. While this commercial architecture accelerates top-of-funnel customer trials, actual long-term recurring revenue contributions from enterprise software subscriptions and field maintenance contracts remain unverified private metrics [CU005, CU006]."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU006"
    tableRefs:
      - "TU001"
  - id: "adoption-trajectory-and-deployment-scale"
    title: "Adoption Trajectory, Manufacturing Scale, and Global Fleet Distribution"
    body: "Agibot's customer adoption curve has mirrored an exponential manufacturing expansion, progressing from prototype validation to mass commercial production within 36 months [CU007, CU008]. After taking nearly two years to manufacture its first 1,000 units, the company reached 5,000 units by late 2025, scaled to 10,000 units by March 2026—a 4x acceleration in assembly velocity—and completed its 15,000th unit rollout in June 2026 [CU007, CU008, CU009]. Independent market tracking from Counterpoint Research confirms that this production surge translated directly into commercial delivery leadership: Agibot shipped approximately 9,700 humanoid robots in the first half of 2026, capturing over 43% of total global market shipments [CU009]. Production allocation spans distinct functional platforms, with full-size bipedal A-Series units reaching 1,742 units, agile half-size X-Series units reaching 1,846 units, and industrial G-Series manipulation systems reaching 1,412 units at the 5,000-unit milestone [CU001]. Deployments now encompass eight commercial domains, including intelligent manufacturing, parcel sorting, guided reception, and scientific research [CU001, CU007]. Nonetheless, missing denominator disclosure regarding how many shipped units represent active recurring customer production deployments versus channel stocking, temporary event rentals, or university research grants leaves true industrial operating utilization unverified [CU007, CU009]."
    claimRefs:
      - "CU001"
      - "CU007"
      - "CU008"
      - "CU009"
    tableRefs:
      - "TU002"
    figureRefs:
      - "FU001"
  - id: "named-customer-evidence-and-pilot-maturation"
    title: "Named Customer Proof Points: Production Deployments vs. Early-Stage Pilots"
    body: "Agibot has substantiated its commercial claims with named production and pilot deployments across prominent industrial and service enterprises [CU002, CU010]. In industrial manufacturing, Longcheer Technology operates Agibot robotic workcells handling continuous 24/7 loading and unloading at volumes up to 5,700 consumer electronics units per day [CU002, CU009]. In high-precision semiconductor assembly, deployments at HT-Tech and Intel process up to 1,000,000 and 100,000 chips per day respectively, sustaining disk drop rates below 0.001% [CU002]. In factory logistics, Fulin Precision Engineering deployed nearly 100 Yuanzheng humanoid robots in a partnership valued in tens of millions of yuan to transport standardized containers across multi-hour shifts, while SAIC-GM integrates robotic battery cell handling with sub-second perception latency [CU002, CU010]. In logistics fulfillment, Damon achieves up to 70% of human sorting throughput with 99% second-pass accuracy, and Xiaonan Intelligence reports 50% labor cost reductions sorting 435 irregular soft packages hourly [CU002]. Commercial service references include Anta retail stores reporting 20% foot-traffic gains, Haidilao restaurants streamlining queue guidance, Guangzhou Metro reducing operational costs by 13% while resolving 80% of passenger inquiries, and Shanghai Hongqiao International Airport cutting terminal cleaning expenses by 18% [CU002]. Despite these impressive operational metrics, reference accounts remain heavily concentrated in pilot contracts and marketing partnerships, with comprehensive multi-year renewal history and expansion terms private [CU002, CU011]."
    claimRefs:
      - "CU002"
      - "CU009"
      - "CU010"
      - "CU011"
    tableRefs:
      - "TU003"
  - id: "retention-expansion-and-concentration-vulnerabilities"
    title: "Customer Retention, Expansion Dynamics, and Concentration Risks"
    body: "While Agibot demonstrates initial customer acquisition velocity, its long-term commercial durability faces critical structural uncertainties around retention, fleet expansion economics, and revenue concentration [CU002, CU011, CU012]. Formal cohort retention metrics—such as Net Revenue Retention (NRR), Gross Revenue Retention (GRR), annual customer churn, and contract renewal rates—are completely undisclosed by company management and absent from public filings [CU011, CU012]. Enterprise expansion is currently governed by a 'deployment flywheel' strategy that attempts to transition initial scenario-specific trials into standardized multi-facility rollouts [CU002]. However, the company exhibits acute customer concentration risk: large-scale industrial manufacturing utilization remains anchored primarily to Longcheer Technology and Fulin Precision Engineering, leaving commercial revenue highly vulnerable to capital expenditure cycles within domestic electronics contract manufacturing and automotive component assembly [CU002, CU010, CU012]. Furthermore, aggressive international RaaS expansion across Europe and the Asia-Pacific region relies extensively on local distributors and family office partners such as P&E family office in Australia, creating channel dependency and execution friction around local technical maintenance and warranty resolution [CU005, CU006, CU012]."
    claimRefs:
      - "CU002"
      - "CU005"
      - "CU006"
      - "CU010"
      - "CU011"
      - "CU012"
