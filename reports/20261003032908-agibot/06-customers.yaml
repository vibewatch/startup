figures:
  - id: "FU001"
    title: "Customer journey map"
    type: "journey-map"
    summary: "Customer progression across procurement discovery, pilot validation, facility integration, and fleet expansion loops within Agibot's commercial ecosystem."
    data:
      items:
        - label: "Phase 1: Initial Discovery & Trial"
          touchpoints:
            - "Online Store & RaaS Rental: Low-barrier entry via store.agibot.com offering daily event leasing from €899."
            - "Trade Show Showcases: Multi-scenario live demonstrations at CES Las Vegas and MWC Barcelona."
            - "Executive Partner Conferences: Regional APC gatherings in Shanghai, Melbourne, and London showcasing seven solutions."
        - label: "Phase 2: Pilot Assessment & Feasibility"
          touchpoints:
            - "Scenario Pain-Point Audit: Identifying customer-specific bottlenecks in loading, sorting, or retail greeting."
            - "Technical Feasibility Analysis: Evaluating payload, reach, cycle times, and physical environment constraints."
            - "Benchmarking vs Human Labor: Establishing baseline throughput targets and preliminary ROI models."
        - label: "Phase 3: Controlled Environment Validation"
          touchpoints:
            - "Lab & Workcell Testing: Validating sub-millimeter precision, disk drop rates, or package throughput in test cells."
            - "Software Emulation: Simulating factory workflows using Genie Sim 3.0 and AimDK_X2 control APIs."
            - "Safety & Compliance Clearance: Completing ISO robot safety reviews and plant floor risk assessments."
        - label: "Phase 4: Production Workcell Integration"
          touchpoints:
            - "Hardware Installation: Deploying G2 industrial manipulators or A2 humanoids into dedicated operating stations."
            - "Systems Interconnection: Coordinating robot fleets with factory MES databases and AGV dispatch networks."
            - "Operator Training: Training on-site technicians on battery hot-swapping and routine error clearing."
        - label: "Phase 5: Operational Acceptance & Pilot Sign-off"
          touchpoints:
            - "Continuous Run Testing: Operating through multi-shift endurance runs to measure mean time between assists (MTBA)."
            - "Quality Yield Audits: Measuring defect rates, wafer handling yields, or package sorting accuracy."
            - "Commercial Purchase Conversion: Finalizing enterprise procurement contracts and multi-year maintenance terms."
        - label: "Phase 6: Fleet Scaling & Compounding Expansion"
          touchpoints:
            - "Fleet Scaling: Expanding from single workcells to facility-wide clusters (e.g., Fulin Precision 100-robot fleet)."
            - "Cross-Facility Rollout: Propagating standardized solution packages across multi-site manufacturing networks."
            - "Deployment Flywheel Feedback: Aggregating field telemetry data to retrain foundation models and improve task success."
    approximationNotes: "Framework models standard commercial progression from initial trial leasing to multi-robot factory deployment; individual customer adoption velocity varies by sector and legacy automation maturity."
    claimRefs:
      - "CU002"
      - "CU004"
      - "CU005"
      - "CU006"
      - "CU010"
      - "CU012"
callouts:
  - calloutType: "insight"
    title: "The Deployment Flywheel vs. Traditional Bespoke Robotics"
    body: "Agibot's primary commercial differentiator is its transition away from bespoke, project-based systems integration toward seven standardized scenario solutions [CU002]. In traditional robotics, each customer deployment requires extensive custom engineering, resulting in high integration costs and protracted payback horizons. By standardizing physical workcells, sensor configurations, and foundation model APIs across production loading, logistics sorting, and retail guidance, Agibot reduces on-site integration friction and captures structured field telemetry [CU002, CU005]. As field data accumulates across customer sites, core manipulation and navigation models improve, lowering deployment overhead for subsequent clients and creating a self-reinforcing adoption flywheel [CU002]."
    claimRefs:
      - "CU002"
      - "CU005"
  - calloutType: "risk"
    title: "Customer Concentration and Unaudited Renewal Durability"
    body: "Despite boasting over 15,000 manufactured robots and 12 prominent customer reference stories, Agibot exhibits acute commercial concentration in domestic electronics manufacturing and industrial parts logistics [CU002, CU009, CU010]. Flagship multi-unit deployments are heavily anchored to Longcheer Technology and Fulin Precision Engineering, leaving commercial revenue highly exposed to contract manufacturing factory cycles [CU002, CU010, CU012]. Furthermore, because the company publishes no cohort retention data (NRR/GRR) and many commercial service deployments remain temporary promotional trials, the degree to which shipped robots translate into sticky, multi-year recurring commercial revenue remains the single most critical diligence risk for prospective investors [CU011, CU012]."
    claimRefs:
      - "CU002"
      - "CU009"
      - "CU010"
      - "CU011"
      - "CU012"
