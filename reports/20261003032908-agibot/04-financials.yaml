  - calloutType: "risk"
    title: "Severe Underwriting Gaps Precede Public Listing"
    body: "Agibot's push for a Hong Kong IPO occurs against a backdrop of acute financial opacity. While the company leads global shipment volume tables, the complete absence of disclosed realized ASPs, gross margins, cash burn rates, and customer payback metrics prevents rigorous valuation underwriting. Institutional investors must treat volume leadership as an unverified proxy for commercial sustainability until a formal prospectus is audited."
