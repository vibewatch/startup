callouts:
  - calloutType: "insight"
    title: "Manufacturing Ramp vs. Unit Economics Transparency"
    body: "Agibot's documented acceleration from 1,000 to 15,000 units within 18 months represents an exceptional manufacturing achievement among global humanoid robotics startups. However, this production velocity creates a critical diligence dichotomy: while physical manufacturing capacity and supply chain coordination have been validated through third-party shipment leadership, the underlying unit margins, customer payback horizons, and long-term service maintenance costs remain completely unverified private data points [CO005, CO007, CO013]."
    claimRefs:
      - "CO005"
      - "CO007"
      - "CO013"
  - calloutType: "risk"
    title: "Geopolitical and Market Access Exposure"
    body: "Although Agibot is aggressively expanding its international footprint across Europe, the Asia-Pacific region, and North America via flexible RaaS leasing models, escalating regulatory scrutiny and US policy restrictions targeting foreign-origin robotic hardware introduce significant uncertainty into its long-term global total addressable market [CO006, CO009, CO014]."
    claimRefs:
      - "CO006"
      - "CO009"
      - "CO014"
