callouts:
  - calloutType: "risk"
    title: "Hardware Price Commoditization vs. Software Differentiation"
    body: "Agibot faces pricing pressure from peers such as Unitree that offer developer humanoids starting at $13,500. Unless Agibot can prove that its Genie Operator foundation models and fleet reinforcement learning deliver tangible productivity advantages in industrial settings, hardware margins will compress toward standard contract manufacturing levels."
    claimRefs:
      - "CP002"
      - "CP006"
      - "CP011"
  - calloutType: "insight"
    title: "Rental Models as Lower-Friction Commercial Proving Grounds"
    body: "By launching Robot-as-a-Service leasing starting at €899 per day across 17 international countries, Agibot lowers adoption barriers for exhibition and customer interaction scenarios. This provides an active telemetry collection pipeline without demanding massive upfront capital expenditure from risk-averse enterprise buyers."
    claimRefs:
      - "CP010"
      - "CP012"
