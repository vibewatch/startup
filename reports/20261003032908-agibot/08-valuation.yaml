        - "Factory line audit confirming production yield, component localization, and sustained monthly build cadence."
      - - "Market Share Leadership (Thesis)"
        - "Shipped ~9,700 humanoids in H1 2026 taking over 43% of the global market according to Counterpoint Research."
        - "Verification that shipped units represent binding commercial deliveries rather than internal demo or consignment fleets."
      - - "Valuation Disconnect (Anti-Thesis)"
        - "Eyeing a HK$40B-HK$50B ($5.14B-$6.4B) valuation on unverified revenue represents substantial speculative premium."
        - "Filing of preliminary HKEX prospectus showing audited ARR exceeding $50M and positive gross margins."
      - - "Commercial Fleets & Cash Flow (Anti-Thesis)"
        - "RaaS rental model starting at €899 and early partner pilots do not yet demonstrate cash-flow breakeven or fleet payback."
        - "Evidence of multi-year enterprise contracts with recurring maintenance and software license fees."
    notes: "Core arguments incorporate shipment figures and reported Hong Kong IPO targets."
