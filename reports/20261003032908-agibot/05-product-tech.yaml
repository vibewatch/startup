chapter:
  number: 5
  title: "Product & Technology"
  summary: "Agibot structures its hardware and embodied AI around a unified 'One Robotic Body, Three Intelligences' architecture across bipedal, wheeled, and quadruped form factors. While the company demonstrates rapid scaling and modular software frameworks like AimDK_X2 and ROS 2 compute on Arm, long-term software security guarantees, third-party benchmark parity, and edge thermal limits remain critical diligence gaps."
sections:
  - id: "product-portfolio-and-embodiment"
    title: "Embodied Hardware Platforms and Modular SKU Lineup"
    body: "Agibot delivers physical AI through diverse robotic embodiments tailored to distinct operational workflows across commercial, industrial, and research sectors. The company's hardware portfolio spans full-sized bipedal humanoids (Expedition A2 and A3), compact research humanoids (Lingxi X1 and X2), wheeled industrial manipulators (Jingling G2 and G2 Air), all-terrain quadrupeds (D1 and D2 Max), and commercial service units such as the C5 cleaner. The Expedition A3 serves as an interactive humanoid standing 173 cm tall and weighing 55 kg with a 0.218 kW/kg power-to-weight ratio, featuring ultra-wideband (UWB) swarm positioning and a 10-second battery swap mechanism. For industrial assembly and logistics manipulation, the single-arm G2 Air provides 7 degrees of freedom (DOF) with an isomorphic data collection design that captures real-world demonstration data directly during live task execution. End-effector dexterity is delivered through the OmniHand 3 Ultra-T, utilizing a 22+3 DOF tendon-driven actuation system with full-hand 3D tactile sensing and sub-0.3 second response latency."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
      - "CE009"
    tableRefs:
      - "TE001"
  - id: "architecture-and-operating-intelligence"
    title: "Embodied AI Architecture: One Body and Three Intelligences"
    body: "Agibot's core technical framework operationalizes embodied AI across three distinct functional tiers: Locomotion Intelligence, Manipulation Intelligence, and Interactive Intelligence. Locomotion is governed by the Behavioral Foundation Model (BFM) for one-shot human imitation and the Generative Control Foundation Model (GCFM) for multimodal motion synthesis. Manipulation Intelligence is anchored by the Genie Operator-2 (GO-2) ViLLA foundation model, which leverages an Action Chain-of-Thought architecture to decompose multi-step manipulation tasks, supported by Genie Sim 3.0 digital twins and real-world distributed online learning systems (SOP). Interactive capabilities are driven by WITA Omni, a native end-to-end multimodal model unifying vision, audio, language, and physical gestures. This full-stack AI layer is hosted on Link-U OS and exposed to secondary developers via the AimDK_X2 framework built on ROS 2, enabling modular integration of high-level control APIs across diverse deployment topologies."
    claimRefs:
      - "CE005"
      - "CE006"
      - "CE007"
      - "CE011"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "edge-compute-and-deployment-workflows"
    title: "Edge Compute Infrastructure, Ecosystem Integrations, and Commercial Delivery"
    body: "Deploying general-purpose robots in production environments requires high-efficiency edge processing capable of running perception, motion planning, and transformer inference under strict thermal and battery constraints. Agibot standardizes its heterogeneous compute stack on the Arm architecture across the A2, X2, and D1 platforms, executing on-device AI inference with low latency while offloading distributed training and synthetic digital-twin validation to cloud clusters. Commercial delivery is structured around two distinct operational tracks: direct hardware sales supported by the 'Powered by Agibot' co-development initiative, and flexible Robot-as-a-Service (RaaS) leasing programs deployed across Europe, Australia, and Southeast Asia. The RaaS program facilitates short-term marketing rentals starting at €899 as well as multi-month industrial trials. However, enterprise buyers face material technical risks, including thermal throttling under peak motor torque, software maintainability beyond the baseline support horizon, and lack of audited functional safety certifications."
    claimRefs:
      - "CE008"
      - "CE010"
      - "CE012"
      - "CE013"
      - "CE014"
      - "CE015"
    tableRefs:
      - "TE002"
callouts:
  - calloutType: "insight"
    title: "Data-Engine Co-Design via Isomorphic Hardware"
    body: "Agibot overcomes physical AI data scarcity by integrating UMI-isomorphic teleoperation and MEgo body-free collection rigs directly into production manipulators like the G2 Air, allowing daily customer operations to feed the continuous online learning pipeline."
    claimRefs:
      - "CE003"
      - "CE005"
  - calloutType: "risk"
    title: "Edge Compute Power Budgets and Safety Certification Gaps"
    body: "While Arm-based architectures provide necessary efficiency for on-device inference, enterprise adopters remain exposed to undisclosed thermal limits under continuous heavy loads and unverified international functional safety ratings (ISO 10218/ISO 13849)."
    claimRefs:
      - "CE008"
      - "CE015"
