evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-performance
    missingEvidence: Audited financial statements detailing gross margins, revenue run-rate, ARR breakdown, and cash burn.
    whyItMatters: >-
      Without audited figures, valuation multiples and production-ramp sustainability cannot be validated against cash
      flow.
    diligencePath: Review preliminary Hong Kong IPO prospectus filings or request confidential financial disclosures.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: board-governance
    missingEvidence: Full board of directors roster, independent director representation, and shareholder voting rights breakdown.
    whyItMatters: >-
      Pre-IPO governance structure and minority investor protection terms govern corporate decision-making and exit
      feasibility.
    diligencePath: Examine pre-listing disclosure documents, corporate registry filings, and underwriter governance briefs.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: minor
    topic: customer-concentration
    missingEvidence: Volume breakdown and contract values across industrial deployments beyond Longcheer Technology.
    whyItMatters: >-
      High concentration with a single consumer electronics manufacturer increases vulnerability to client-specific
      factory cycles.
    diligencePath: Interview commercial channel partners and inspect industrial customer case studies in upcoming quarterly reports.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: fleet-unit-economics
    missingEvidence: >-
      Audited multi-year industrial fleet unit economics, including recurring software ARR, gross margins, and customer
      payback metrics.
    whyItMatters: >-
      Without verified ARR and margin figures, enterprise market sizing cannot separate hardware manufacturing revenues
      from high-margin recurring software value.
    diligencePath: >-
      Review subsequent Hong Kong pre-listing IPO prospectus filings or customer procurement audit records for disclosed
      contract economics.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: competitive-pricing
    missingEvidence: >-
      Audited realized transaction pricing and enterprise discount schedules for Agibot A2 and G2 industrial deployments
      versus list prices.
    whyItMatters: >-
      Reported store prices and daily rental rates do not reveal unit economics or volume discounting for multi-unit
      factory deployments.
    diligencePath: >-
      Review commercial customer procurement disclosures or channel partner distribution agreements in target industrial
      sectors.
    relatedQuestionRefs:
      - QP003
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: comparative-performance
    missingEvidence: >-
      Standardized third-party head-to-head operational benchmark data comparing Agibot manipulation success rates
      directly against UBTECH and Unitree in identical industrial tasks.
    whyItMatters: >-
      Published success rates currently derive from vendor-authored research preprints or promotional demonstrations
      rather than uniform industry benchmarks.
    diligencePath: >-
      Execute independent trial evaluations comparing fleet cycle times, intervention frequencies, and mean time between
      failures (MTBF).
    relatedQuestionRefs:
      - QP002
      - QP004
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: blocking
    topic: realized-unit-economics
    missingEvidence: >-
      Audited bill-of-materials costs, component manufacturing yields, and realized average selling prices across
      bipedal and wheeled robot lines.
    whyItMatters: >-
      Without BOM and ASP data, gross margin progression and long-term hardware unit profitability cannot be
      underwritten.
    diligencePath: Review confidential IPO prospectus Annex B detailing manufacturing cost accounting and gross margin schedules.
    relatedQuestionRefs:
      - QI004
      - QI007
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: cash-burn-and-runway
    missingEvidence: Historical monthly operating cash burn, net debt obligations, and liquid cash reserves.
    whyItMatters: Determines company solvency, capital runway duration, and dependency on successful IPO execution.
    diligencePath: Obtain pre-IPO audited financial statements and capital expenditure schedules submitted to the HKEX.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: enumeration-incomplete
    severity: material
    topic: contract-backlog-and-arr
    missingEvidence: Breakdown of signed multi-year RaaS leasing agreements versus one-off pilot rental engagements.
    whyItMatters: Essential to distinguish recurring software/leasing revenue from non-recurring event marketing demonstrations.
    diligencePath: Request customer contract cohort schedules and net retention metrics for commercial fleet deployments.
    relatedQuestionRefs:
      - QI001
      - QI003
    relatedTableRefs:
      - TI001
  - type: missing-source
    severity: material
    topic: edge-compute-thermal-limits
    missingEvidence: >-
      Audited benchmarking data measuring sustained compute throughput, temperature throttling thresholds, and power
      dissipation under heavy continuous multi-joint actuation and vision model inference.
    whyItMatters: >-
      Thermal constraints determine whether bipedal and wheeled robots can execute continuous multi-hour shifts in
      industrial environments without performance degradation or unexpected shutdowns.
    diligencePath: >-
      Request hardware stress-test logs, compute load profiles, and internal MTBF metrics across high-temperature
      operational scenarios from Agibot engineering.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: material
    topic: functional-safety-certifications
    missingEvidence: >-
      Third-party industrial safety certifications, including ISO 10218 (industrial robots), ISO 13849 (machinery safety
      PL levels), and ISO 13482 (personal care robots) for human-robot shared spaces.
    whyItMatters: >-
      Absence of certified collaborative safety mechanisms prevents enterprise buyers from deploying heavy manipulators
      and bipedal humanoids alongside human workers without physical cages.
    diligencePath: >-
      Review vendor certification dossiers and accredited safety audit reports from international testing bodies (e.g.
      TÜV SÜD or UL Solutions).
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: retention-durability
    missingEvidence: >-
      Audited cohort retention metrics including Net Revenue Retention (NRR), Gross Revenue Retention (GRR), annual
      churn rates, and contract renewal frequencies.
    whyItMatters: >-
      Without retention data, investors cannot verify whether early enterprise deployments translate into sticky,
      compounding commercial relationships or temporary pilot trials.
    diligencePath: >-
      Request customer cohort retention schedules and multi-year master service agreement renewal histories during IPO
      due diligence.
    relatedQuestionRefs:
      - QU004
    relatedTableRefs:
      - TU002
  - type: missing-source
    severity: material
    topic: industrial-payback-economics
    missingEvidence: >-
