              Stanley to prepare an initial public offering on the Hong Kong Stock Exchange, targeting a listing
              valuation between HK$40 billion and HK$50 billion ($5.14 billion to $6.4 billion) with a proposed float of
              15% to 25% of shares [CO011]. Operationally, Agibot accelerated production milestones: taking
              approximately two years to reach its first 1,000 units, scaling from 1,000 to 5,000 units by late 2025,
