  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Commercialization Models and Realized Pricing Dynamics
        blocks:
          - type: paragraph
            body: >-
              Agibot approaches commercialization through a bifurcated revenue architecture comprising direct hardware
              capital sales and flexible leasing under a Robot-as-a-Service (RaaS) framework. Direct capital sales
              target institutional showroom navigation, education, and manufacturing lines, offering platforms across
              the A2, X2, and G2 series alongside specialized subsystems like OmniHand. To address customer hesitation
              regarding massive upfront capex, Agibot launched its global online store (store.agibot.com) and RaaS
              leasing network, covering 17 countries and regions across Europe, North America, and Asia-Pacific. The
              RaaS framework establishes entry-level daily rental terms starting at €899 with no maximum duration,
              targeting events, retail demonstrations, and temporary operational tasks. However, official list pricing
              and published entry-level rental rates represent marketing floors rather than realized average selling
              prices (ASPs). Volume discounts, partner subsidies, and localized integrator concessions obscure realized
              revenue per unit. Moreover, the long-term contribution of software subscriptions, customized model
              development via 'Powered by AGIBOT', and recurrent maintenance contracts remains unquantified, creating
              significant uncertainty around underlying revenue durability.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
          - type: table
            tableRef: TI002
            claimRefs:
              - CI002
              - CI004
      - number: '4.2'
        title: Unit Economics, Gross Margin Drivers, and Cost Realities
        blocks:
          - type: paragraph
            body: >-
              Evaluating Agibot's cost structure reveals substantial tension between hardware volume milestones and
              per-unit profitability. The company has aggressively scaled production, advancing from 5,000 to 10,000
              units within a three-month window in early 2026 and reporting 15,000 cumulative manufactured units by
              mid-2026. Management claims that maturing domestic supply chains and manufacturing standardization have
              compressed production cycles and accelerated assembly speed by more than 4x. Nevertheless, gross margin
              dynamics remain entirely opaque. Full-size bipedal humanoids like the A2 Ultra integrate extensive
              precision harmonic reducers, high-density frameless torque motors, multi-axis force sensors, and
              high-performance onboard compute, driving substantial bill-of-materials (BOM) costs. While municipal
              manufacturing subsidies across Guangdong and Jiangsu provinces temporarily subsidize deployments,
              long-term gross margin depends on reaching true automotive-grade component yields and eliminating
              high-touch on-site engineering maintenance. Currently, realized gross margins, warranty loss reserves, and
              fleet field-service expenses are private, preventing independent confirmation of positive unit
              contribution margins.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI003
            claimRefs:
              - CI007
              - CI008
              - CI010
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI003
              - CI005
              - CI007
      - number: '4.3'
        title: Capital Adequacy, Burn Rate Scrutiny, and Public Listing Strategy
        blocks:
          - type: paragraph
            body: >-
              In July 2026, Agibot initiated formal proceedings for an initial public offering on the Hong Kong Stock
              Exchange, seeking to become the first publicly listed Chinese humanoid robotics pure-play. This strategic
              listing maneuver coincides with intensifying institutional scrutiny regarding venture-backed robotics burn
              rates. Following cooling private market valuations and selective hardware financing across global markets,
              Agibot is tapping international institutional public capital to fund ongoing high-intensity R&D and global
              GTM expansion. Crucially, the company's preliminary regulatory filings disclose neither target valuation
              nor capital raise targets, leaving net cash balances, monthly operating burn, and runway length
              undisclosed. Without an audited prospectus detailing historic cash consumption, customer concentration,
              and debt covenants, investors face significant underwriting risks regarding Agibot's dependence on
              sustained external financing versus self-funding operational cash flows.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Severe Underwriting Gaps Precede Public Listing
            body: >-
              Agibot's push for a Hong Kong IPO occurs against a backdrop of acute financial opacity. While the company
              leads global shipment volume tables, the complete absence of disclosed realized ASPs, gross margins, cash
              burn rates, and customer payback metrics prevents rigorous valuation underwriting. Institutional investors
              must treat volume leadership as an unverified proxy for commercial sustainability until a formal
              prospectus is audited.
            calloutType: risk
            claimRefs:
              - CI008
              - CI009
