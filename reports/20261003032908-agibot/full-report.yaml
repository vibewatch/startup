              - CM013
      - number: '2.4'
        title: Growth Catalysts, Regulatory Constraints, and Geopolitical Fracture
        blocks:
          - type: paragraph
            body: >-
              The adoption velocity of humanoid robotics is propelled by structural tailwinds but severely throttled by
              operational bottlenecks and geopolitical fragmentation. The primary secular catalyst is demographic
              contraction across major industrial powerhouses, creating acute manual labor deficits in manufacturing and
              logistics that fixed automation cannot economically solve. Rapid cost reduction across robotic actuators,
              harmonic joints, and multimodal AI foundation models further accelerates hardware viability. Conversely,
              physical deployment faces critical technical limitations, including battery runtimes frequently capped at
              two hours under active load, thermal degradation, and the necessity of shared-autonomy teleoperation when
              navigating unexpected edge cases. More critically, international market access has fractured along
              geopolitical boundaries: on July 28, 2026, the United States Federal Communications Commission (FCC)
              enacted import prohibitions barring uncertified Chinese-made humanoid and quadruped robots, effectively
              walling off North American enterprise procurement for emerging Chinese hardware vendors. This regulatory
              intervention forces domestic Chinese manufacturers to concentrate distribution within domestic
              manufacturing clusters, Southeast Asia, Europe, and Australasia while facing uncertain foreign
              data-security certification.
            claimRefs:
              - CM004
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Geopolitical Market Partition and Western Market Disqualification
            body: >-
              The July 2026 FCC import ban on uncertified Chinese humanoid robotics marks an unprecedented regulatory
              barrier that effectively severs Chinese robotic hardware vendors from direct US enterprise procurement.
              While domestic Chinese demand and regional expansion across Southeast Asia and the Middle East provide
              volume scale, the loss of North American industrial and commercial markets caps total addressable
              enterprise software margins and limits exposure to premier global manufacturing buyers.
            calloutType: risk
            claimRefs:
              - CM014
              - CM015
          - type: callout
            title: The Pilot-to-Production Unit Economics Chasm
            body: >-
              Despite dramatic headline shipment milestones reaching tens of thousands of units across the industry, the
              commercial market remains largely characterized by exploratory trials rather than permanent operational
              line substitution. True enterprise adoption hinges on proving multi-year total cost of ownership,
              including unassisted uptime, mean-time-between-failures, and battery degradation under continuous
              multi-shift industrial manufacturing cycles.
            calloutType: insight
            claimRefs:
              - CM002
              - CM004
              - CM012
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Humanoid and Embodied Robotics Landscape
        blocks:
          - type: paragraph
            body: >-
              The competitive landscape surrounding Agibot spans direct bipedal humanoid developers, quadruped and
              mobile robot manufacturers, and diversified industrial automation giants. Direct domestic peers include
              UBTECH Robotics, which listed in Hong Kong and commercializes the Walker series, and Unitree Robotics,
              which targets consumer and R&D segments with lower hardware pricing and has pursued a STAR Market listing.
              In addition, major consumer electronics and appliance firms like Xiaomi Robotics and Dreame Technology
              have diversified into humanoid and embodied robotics. In specialized functional domains such as commercial
              logistics and customer reception, non-humanoid or wheeled substitutes like Enchanted Tools' Mirokai and
              purpose-built logistics platforms like Agility Robotics' Digit present distinct commercial trade-offs
              against Agibot's bipedal A2 and compact X2 lines.
