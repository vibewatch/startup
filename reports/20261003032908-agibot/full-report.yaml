              - CE014
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Data-Engine Co-Design via Isomorphic Hardware
            body: >-
              Agibot overcomes physical AI data scarcity by integrating UMI-isomorphic teleoperation and MEgo body-free
              collection rigs directly into production manipulators like the G2 Air, allowing daily customer operations
              to feed the continuous online learning pipeline.
            calloutType: insight
            claimRefs:
              - CE003
              - CE005
          - type: callout
            title: Edge Compute Power Budgets and Safety Certification Gaps
            body: >-
              While Arm-based architectures provide necessary efficiency for on-device inference, enterprise adopters
              remain exposed to undisclosed thermal limits under continuous heavy loads and unverified international
              functional safety ratings (ISO 10218/ISO 13849).
            calloutType: risk
            claimRefs:
              - CE008
              - CE015
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation, Buyer Personas, and Commercial Delivery Channels
        blocks:
          - type: paragraph
            body: >-
              Agibot structures its commercial customer base across four primary buyer segments: high-precision
              electronics and semiconductor manufacturing, complex warehouse logistics and parcel fulfillment,
              commercial retail and public infrastructure services, and high-security utility inspection [CU001, CU002].
              In industrial manufacturing, procurement is driven by plant operations directors and automation engineers
              evaluating throughput consistency, sub-millimeter placement precision, and seamless integration with
              existing Manufacturing Execution Systems (MES) and Automated Guided Vehicles (AGVs) [CU002, CU003]. For
              commercial retail, airport transit, and hospitality environments, corporate marketing executives and
              facility managers purchase or lease units to enhance visitor throughput, automate customer inquiry
              resolution, and capture public attention [CU002, CU004]. To lower high upfront capital expenditure
              barriers that traditionally stall enterprise humanoid adoption, Agibot operates a dual go-to-market
              structure combining direct capital sales with a localized Robot-as-a-Service (RaaS) leasing network across
              17 countries and regions, including Europe, North America, Australia, New Zealand, and Southeast Asia,
              featuring minimum rental periods from one day starting at €899 [CU004, CU005, CU006]. While this
              commercial architecture accelerates top-of-funnel customer trials, actual long-term recurring revenue
              contributions from enterprise software subscriptions and field maintenance contracts remain unverified
              private metrics [CU005, CU006].
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU005
              - CU010
              - CU011
      - number: '6.2'
        title: Adoption Trajectory, Manufacturing Scale, and Global Fleet Distribution
        blocks:
          - type: paragraph
            body: >-
              Agibot's customer adoption curve has mirrored an exponential manufacturing expansion, progressing from
              prototype validation to mass commercial production within 36 months [CU007, CU008]. After taking nearly
              two years to manufacture its first 1,000 units, the company reached 5,000 units by late 2025, scaled to
              10,000 units by March 2026—a 4x acceleration in assembly velocity—and completed its 15,000th unit rollout
              in June 2026 [CU007, CU008, CU009]. Independent market tracking from Counterpoint Research confirms that
              this production surge translated directly into commercial delivery leadership: Agibot shipped
              approximately 9,700 humanoid robots in the first half of 2026, capturing over 43% of total global market
              shipments [CU009]. Production allocation spans distinct functional platforms, with full-size bipedal
              A-Series units reaching 1,742 units, agile half-size X-Series units reaching 1,846 units, and industrial
              G-Series manipulation systems reaching 1,412 units at the 5,000-unit milestone [CU001]. Deployments now
              encompass eight commercial domains, including intelligent manufacturing, parcel sorting, guided reception,
              and scientific research [CU001, CU007]. Nonetheless, missing denominator disclosure regarding how many
              shipped units represent active recurring customer production deployments versus channel stocking,
              temporary event rentals, or university research grants leaves true industrial operating utilization
              unverified [CU007, CU009].
            claimRefs:
              - CU001
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU004
              - CU007
              - CU008
              - CU009
              - CU011
              - CU012
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU002
              - CU004
