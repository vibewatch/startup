    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Platform Architecture, and Commercial Stage
        blocks:
          - type: paragraph
            body: >-
              Agibot Innovation (Shanghai) Technology Co., Ltd. was incorporated in February 2023 in Shanghai, China, by
              former Huawei engineers Deng Taihua and Peng Zhihui [CO001]. The enterprise was conceived around the
              thesis of general-purpose embodied AI, combining artificial general intelligence algorithms with modular
              robotic embodiments across industrial and commercial domains [CO002]. Architecturally, Agibot organizes
              its technical development under a framework termed '1 Robotic Body + 3 Intelligence,' which tightly
              couples physical chassis mechanics with interaction, manipulation, and locomotion intelligence layers
              [CO003]. The company operates as a late-venture growth-stage hardware and embodied AI enterprise,
              expanding from domestic manufacturing roots into international direct sales and leasing [CO004]. Its
              commercial product portfolio spans full-sized bipedal humanoids (A2/A3 series), compact interactive
              humanoids (X2 series), wheeled industrial dual-arm manipulation platforms (G2 series), quadruped patrol
              units (D1 series), and commercial cleaning robots (C5) [CO003, CO005]. Through its digital storefront and
              partner ecosystem, Agibot has also introduced a Robot-as-a-Service (RaaS) leasing framework operating
              across 17 countries and regions with entry rates starting from €899 per day [CO006]. While early pilots
              emphasize showroom reception, logistics sorting, and academic research, production-line inspection in
              consumer electronics represents its primary industrial proof point [CO005, CO007].
