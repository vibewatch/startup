              June 2026 [CO007, CO012]. Independent analyst tracking corroborates this surge: Counterpoint Research
              estimated Agibot shipped approximately 9,700 humanoid units in 1H 2026 (43% global share), while Smart
              Analytics Global (SAG) recorded 8,400 units (44% global share), ranking Agibot first globally ahead of
              Unitree [CO005, CO013]. However, SAG analysts highlight that expanding geopolitical friction and US
              restrictions on foreign-made robots pose severe regulatory and market-access headwinds for international
              expansion [CO014].
