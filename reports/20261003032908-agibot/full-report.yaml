      - number: '2.3'
        title: Buyer Segmentation, Budget Allocation, and Adoption Mechanisms
        blocks:
          - type: paragraph
            body: >-
              Enterprise adoption of embodied robotics bifurcates into distinct vertical sectors with conflicting
              operational requirements and budget governance. Industrial manufacturing and consumer electronics assembly
              represent the highest-value segment, where factory managers and VP-level operations executives justify
              capital allocations against chronic line-worker labor shortages and defect reduction. In commercial
              reception, smart retail, and hospitality, regional commercial heads deploy humanoids as interactive brand
              ambassadors and guidance hosts, drawing funds from corporate marketing or customer experience budgets.
              Across research institutions and university laboratories, principal investigators procure compact bipedal
              systems via research grants to advance embodied cognitive models. To accelerate enterprise penetration,
              vendors have introduced Robot-as-a-Service (RaaS) leasing models, lowering upfront capital expenditure
              from six-figure unit purchases to day-rate or monthly operating fees starting at 899 euros in European
              trials. However, enterprise adoption paths remain gated by payback friction: deployed industrial fleets
              have yet to publish verifiable long-term fleet uptime figures, maintenance costs, or multi-year
              return-on-investment calculations that demonstrate superiority over specialized cobots.
            claimRefs:
              - CM002
              - CM003
              - CM006
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
