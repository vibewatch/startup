        title: Capitalization, Production Ramp, and Market Penetration
        blocks:
          - type: paragraph
            body: >-
              Agibot's capitalization profile reflects rapid valuation appreciation supported by sovereign-aligned
              domestic venture capital and strategic technology giants [CO011]. PitchBook data recorded a venture
              valuation of $2.07 billion as of March 2025, supported by backing from Tencent and HongShan Capital Group
