        title: Pricing Models, GTM Motion, and Displacement Dynamics
        blocks:
          - type: paragraph
            body: >-
              Commercial positioning across the humanoid robotics sector exhibits sharp bifurcation between public list
              prices for developer or exhibition hardware and closed-quote contracts for enterprise deployments. Agibot
              has published hardware prices such as $24,240 for its compact X2 interactive humanoid and $44,560 for the
