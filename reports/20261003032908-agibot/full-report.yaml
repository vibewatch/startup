      - number: '3.2'
        title: Product Architecture and Differentiation Durability
        blocks:
          - type: paragraph
            body: >-
              Agibot positions its competitive moat around the tight integration of mechanical hardware and proprietary
              embodied artificial intelligence, framed as '1 Robotic Body + 3 Intelligence' comprising locomotion,
              interaction, and manipulation. On the intelligence layer, Agibot deploys the Genie Operator
              Vision-Language-Action architecture and Genie Envisioner world action model to govern physical execution,
              complemented by the Learning While Deploying reinforcement learning framework across its dual-arm
              platforms. However, competitive pressure remains intense as competing hardware developers provide open
              development kits, ROS2 compatibility, and low-cost bipedal hardware, challenging Agibot's ability to
              maintain software lock-in without sustained fleet-scale task success.
