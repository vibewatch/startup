              Conversely, rivals like Unitree have driven aggressive hardware price discovery with platforms starting
              from $13,500, while enterprise logistics competitors deploy under long-term operational lease structures.
              Agibot's ability to defend gross margins and avoid commoditization hinges on proving clear labor
              displacement economics in high-throughput industrial and service environments.
