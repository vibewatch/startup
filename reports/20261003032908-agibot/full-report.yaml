  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Embodied Hardware Platforms and Modular SKU Lineup
        blocks:
          - type: paragraph
            body: >-
              Agibot delivers physical AI through diverse robotic embodiments tailored to distinct operational workflows
              across commercial, industrial, and research sectors. The company's hardware portfolio spans full-sized
              bipedal humanoids (Expedition A2 and A3), compact research humanoids (Lingxi X1 and X2), wheeled
              industrial manipulators (Jingling G2 and G2 Air), all-terrain quadrupeds (D1 and D2 Max), and commercial
              service units such as the C5 cleaner. The Expedition A3 serves as an interactive humanoid standing 173 cm
              tall and weighing 55 kg with a 0.218 kW/kg power-to-weight ratio, featuring ultra-wideband (UWB) swarm
              positioning and a 10-second battery swap mechanism. For industrial assembly and logistics manipulation,
              the single-arm G2 Air provides 7 degrees of freedom (DOF) with an isomorphic data collection design that
              captures real-world demonstration data directly during live task execution. End-effector dexterity is
              delivered through the OmniHand 3 Ultra-T, utilizing a 22+3 DOF tendon-driven actuation system with
              full-hand 3D tactile sensing and sub-0.3 second response latency.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE009
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
      - number: '5.2'
        title: 'Embodied AI Architecture: One Body and Three Intelligences'
        blocks:
          - type: paragraph
            body: >-
              Agibot's core technical framework operationalizes embodied AI across three distinct functional tiers:
              Locomotion Intelligence, Manipulation Intelligence, and Interactive Intelligence. Locomotion is governed
              by the Behavioral Foundation Model (BFM) for one-shot human imitation and the Generative Control
              Foundation Model (GCFM) for multimodal motion synthesis. Manipulation Intelligence is anchored by the
              Genie Operator-2 (GO-2) ViLLA foundation model, which leverages an Action Chain-of-Thought architecture to
              decompose multi-step manipulation tasks, supported by Genie Sim 3.0 digital twins and real-world
              distributed online learning systems (SOP). Interactive capabilities are driven by WITA Omni, a native
              end-to-end multimodal model unifying vision, audio, language, and physical gestures. This full-stack AI
              layer is hosted on Link-U OS and exposed to secondary developers via the AimDK_X2 framework built on ROS
              2, enabling modular integration of high-level control APIs across diverse deployment topologies.
