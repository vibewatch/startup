  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Addressable Scope, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              The commercial humanoid robotics market occupies a specialized segment within the broader automation and
              embodied artificial intelligence landscape. The core market boundary comprises general-purpose, bipedal or
              dual-arm mobile robotic systems that integrate locomotion, dexterous manipulation, and interactive
              perception into a unified physical platform. Included enterprise expenditure spans hardware unit
              procurement, multi-year Robot-as-a-Service (RaaS) operational leasing, specialized end-effector tooling
              such as dexterous hands, simulation-to-real training datasets, and scenario integration services.
              Conversely, the addressable scope strictly excludes single-purpose bolted industrial robot arms, automated
              guided vehicles (AGVs) and autonomous mobile robots (AMRs) lacking multi-axis upper-limb manipulation,
              fixed kiosks, and pure-play enterprise software pipelines. In customer workflows, humanoids compete
              against stubborn status-quo alternatives: manual human labor with zero upfront capital intensity, mature
              Cartesian gantry automation, and purpose-built articulated arms paired with conveyors. While conventional
              industrial robots execute high-speed repetitive cycles in structured workcells, humanoids target
              unstructured or semi-structured environments where dexterity, spatial adaptability, and collaborative
              mobility eliminate the costly facility re-tooling historically required for fixed robotics.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM002
              - CM003
