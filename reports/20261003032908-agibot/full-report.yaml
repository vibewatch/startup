      - number: '2.2'
        title: Market Sizing Lenses, Commercial Trajectories, and Delivery Divergence
        blocks:
          - type: paragraph
            body: >-
              Industry analysts assess humanoid robotics through diverging sizing lenses spanning conservative near-term
              hardware delivery and expansive long-term embodied artificial intelligence forecasts. According to IDC,
              global humanoid robot shipments reached approximately 18,000 units in 2025, generating $440 million in
              hardware revenue and representing 508% year-over-year expansion. China-based manufacturers established
              early unit leadership, accounting for nearly 90% of global shipments in 2025. Mid-year 2026 tracking by
              Counterpoint Research indicates that first-half shipments surpassed 22,000 units globally—a near 300%
              increase compared to H1 2025—with full-year volume projected to exceed 50,000 units. Longer-term market
              outlooks project total market capitalization, including software, operational platforms, and RaaS
              contracts, to expand from roughly $3 billion in 2025 to $15 billion by 2030 (MarketsandMarkets) and $35.4
              billion by 2033 (SkyQuestt). Hardware shipments exhibit a pronounced structural division: full-size
              humanoids contributed 41.6% of global revenue in 2025 due to complex dual-arm manipulation capabilities,
              while lower-cost compact platforms dominate educational, research, and promotional exhibition tiers.
              Agibot achieved rapid volume expansion, delivering 5,100 to 5,200 units in 2025 and approximately 9,700
              units in H1 2026, though long-term recurring software revenue remains unverified.
            claimRefs:
              - CM001
              - CM005
