      - number: '5.3'
        title: Edge Compute Infrastructure, Ecosystem Integrations, and Commercial Delivery
        blocks:
          - type: paragraph
            body: >-
              Deploying general-purpose robots in production environments requires high-efficiency edge processing
              capable of running perception, motion planning, and transformer inference under strict thermal and battery
              constraints. Agibot standardizes its heterogeneous compute stack on the Arm architecture across the A2,
              X2, and D1 platforms, executing on-device AI inference with low latency while offloading distributed
              training and synthetic digital-twin validation to cloud clusters. Commercial delivery is structured around
              two distinct operational tracks: direct hardware sales supported by the 'Powered by Agibot' co-development
              initiative, and flexible Robot-as-a-Service (RaaS) leasing programs deployed across Europe, Australia, and
              Southeast Asia. The RaaS program facilitates short-term marketing rentals starting at €899 as well as
              multi-month industrial trials. However, enterprise buyers face material technical risks, including thermal
              throttling under peak motor torque, software maintainability beyond the baseline support horizon, and lack
              of audited functional safety certifications.
            claimRefs:
              - CE008
              - CE010
              - CE012
              - CE013
              - CE014
              - CE015
