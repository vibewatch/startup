callouts:
  - calloutType: risk
    title: "Geopolitical Market Partition and Western Market Disqualification"
    body: "The July 2026 FCC import ban on uncertified Chinese humanoid robotics marks an unprecedented regulatory barrier that effectively severs Chinese robotic hardware vendors from direct US enterprise procurement. While domestic Chinese demand and regional expansion across Southeast Asia and the Middle East provide volume scale, the loss of North American industrial and commercial markets caps total addressable enterprise software margins and limits exposure to premier global manufacturing buyers."
    claimRefs:
      - CM014
      - CM015
  - calloutType: insight
    title: "The Pilot-to-Production Unit Economics Chasm"
    body: "Despite dramatic headline shipment milestones reaching tens of thousands of units across the industry, the commercial market remains largely characterized by exploratory trials rather than permanent operational line substitution. True enterprise adoption hinges on proving multi-year total cost of ownership, including unassisted uptime, mean-time-between-failures, and battery degradation under continuous multi-shift industrial manufacturing cycles."
    claimRefs:
      - CM002
      - CM004
      - CM012
