figures:
  - id: FO001
    title: Agibot 发展历程与量产爬坡时间线
    type: timeline
    summary: 2023 年至 2026 年间 Agibot 创立、产品线发布及量产里程碑加速推进的时间线。
    data:
      items:
        - date: 2023-02
          label: 公司成立
          detail: 前华为工程师 Deng Taihua 与 Peng Zhihui 在上海创立 Agibot。
          tone: neutral
        - date: 2023-08
          label: A1 人形机器人亮相
          detail: 发布 Agibot A1 人形机器人样机，确立具身智能技术路线图。
          tone: neutral
        - date: 2024-08
          label: A2 与 X1 产品系列
          detail: 发布下一代全尺寸 A2 与轻量交互型 X1 机器人系列。
          tone: neutral
        - date: 2024-12
          label: 第 1,000 台机器人下线
          detail: 完成第 1,000 台生产，标志着由研发阶段步入首批小批量验证。
          tone: positive
        - date: 2025-03
          label: 一级市场估值标杆
          detail: 在腾讯与 HongShan 参投的风险轮融资中达到 $2.07 billion 估值标杆。
          tone: positive
        - date: 2025-12
          label: 第 5,000 台下线与全球出货登顶
          detail: 达成 5,000 台生产里程碑，并在 2025 年全球出货量中以 39% 份额位列榜首。
          tone: positive
        - date: 2026-01
          label: CES 2026 首次亮相美国市场
          detail: 在 CES 2026 正式进军美国市场，展出 A2、X2、G2、D1 及 OmniHand 灵巧手系统。
          tone: neutral
        - date: 2026-03
          label: 第 10,000 台量产里程碑
          detail: 在第 5,000 台下线后仅 3 个月即突破第 10,000 台大关，爬坡速度加快 4x。
          tone: positive
        - date: 2026-03
          label: 欧洲业务扩张与 RaaS 模式发布
          detail: 在巴塞罗那MWC展示全系产品组合，并在17个市场上线灵活RaaS租赁服务。
          tone: neutral
        - date: 2026-06
          label: 第15,000台机器人下线里程碑
          detail: 第15,000台机器人（G2工业机型）在上海生产线与Longcheer协同下线。
          tone: positive
        - date: 2026-08
          label: 2026年上半年全球出货量登顶
          detail: 独立市场数据证实Agibot在2026年上半年人形机器人出货量位列全球第一，市占率达43%–44%。
          tone: positive
        - date: 2026-08
          label: 地缘政治阻力加剧
          detail: 美国对涉外机器人技术的限制，正成为中国厂商出海扩张的实质性阻力。
          tone: adverse
