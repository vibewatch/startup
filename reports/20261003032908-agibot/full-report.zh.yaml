  summary: >-
    Agibot 成立于 2023 年 2 月，总部位于上海，是一家具身智能机器人公司，面向工业及商业落地场景开发人形、轮式、四足与服务机器人，并提供 RaaS 租赁与定制化方案。公司累计量产已达 15,000 台，拿下领先的 H1
    2026 出货份额，但仍属未上市状态，对收入、毛利率和客户集中度的披露较为有限。
