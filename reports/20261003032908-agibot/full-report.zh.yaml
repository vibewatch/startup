            body: >-
              Agibot 将商业客群划分为四大主要买方板块：高精度电子与半导体制造、复杂仓储物流与包裹履约、商业零售与公共基础设施服务，以及高安全等级公用事业巡检 [CU001,
              CU002]。在工业制造领域，采购主要由厂务总监与自动化工程师把关，核心评估节拍稳定性、亚毫米级放置精度，以及与现有制造执行系统（MES）和自动导引运输车（AGV）的无缝集成 [CU002,
              CU003]。在商业零售、机场枢纽及酒店场景，企业市场总监与物业经理负责采购或租赁设备，意在提升人流吞吐、自动化解答顾客问询并吸引公众眼球 [CU002,
              CU004]。为了打破阻碍企业采纳人形机器人前期大额资本开支的高门槛，Agibot 采取硬件直销与本地化 RaaS 租赁网络双轨并行的 GTM 策略，业务覆盖欧洲、北美、澳大利亚、新西兰及东南亚等 17
              个国家和地区，提供单日起租、€899 起步的租赁方案 [CU004, CU005,
              CU006]。虽然该体系加速了转化漏斗顶部的客户试用，但企业级软件订阅与现场维保合同带来的实际长期经常性收入，仍属未经验证的私有指标 [CU005, CU006]。
