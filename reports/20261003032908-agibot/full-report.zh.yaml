            body: >-
              Agibot 公布了多家知名工商业企业的实名产线与试点案例，以此佐证其商业化能力 [CU002, CU010]。在工业制造领域，Longcheer Technology 运行 Agibot 机器人工作站，执行
              24/7 不间断上下料，日均处理消费电子产品最高达 5,700 件 [CU002, CU009]。在高精半导体封装领域，HT-Tech 与 Intel 的部署产线分别实现日均最高 1,000,000 颗与
              100,000 颗芯片处理量，落料掉盘率控制在 0.001% 以下 [CU002]。在工厂厂内物流场景，Fulin Precision Engineering 在数千万元级合作中部署了近 100 台
              Yuanzheng 人形机器人，负责跨多班次运送标准化周转箱；SAIC-GM 则引入机器人处理电芯搬运，感知延迟达到亚秒级 [CU002, CU010]。在物流履约环节，Damon 达到人工分拣吞吐量的
              70%，二次分拣准确率达 99%；Xiaonan Intelligence 报称每小时分拣 435 irregular soft packages（435 件异形软包），节省了 50% 的人力成本
