      - number: '1.2'
        title: 高管团队、治理结构与关键人物风险
        blocks:
          - type: paragraph
            body: >-
              Agibot 的创始核心融合了通信工程积淀与机器人系统设计经验 [CO001]。联合创始人兼首席技术官 Peng Zhihui 曾入选华为天才少年计划，具备高技术声量与软硬件一体化研发经验；联合创始人 Deng
              Taihua 则提供成体系的经营决策与商业掌舵 [CO001]。              业务落地由合伙人、高级副总裁兼具身智能事业部总裁 Yao Maoqing 博士带队，主抓工业落地与产线集成
              [CO007, CO008]。海外商业化则由各区域负责人统筹，包括欧洲区负责人 William Shi 与亚太区总裁 Abel Deng [CO006, CO009]。尽管执行团队不断扩充，Agibot
              在技术走向、资本号召力和开发者品牌声量上仍对两位创始人存在实质性的关键人物依赖 [CO001,
              CO010]。公司治理目前仍受非上市风投架构管控，在正式提交招股书之前，正式董事会构成、中小股东保护机制以及专门委员会独立性均未对外公开 [CO010, CO011]。
