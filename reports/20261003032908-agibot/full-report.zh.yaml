  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 商业化模式与实际成交价格动态
        blocks:
          - type: paragraph
            body: >-
              Agibot 构建了硬件整机销售与灵活 RaaS 租赁并行的双轨收入架构。直接硬件销售面向展厅导引、高校教育及产线工位，供应 A2、X2 和 G2 系列整机，以及 OmniHand
              等专用子系统。针对客户对前期大额资本支出的顾虑，Agibot 上线了全球线上商城（store.agibot.com）与 RaaS 租赁网络，覆盖欧洲、北美及亚太的 17 个国家和地区。该 RaaS 体系设定了
              €899
              起步且无租期上限的日租门槛，主要承接会展活动、门店展示和短期临时任务。然而，官方公开售价与入门租赁标准仅属营销基准线，并非实际成交均价（ASP）。大客户批量折扣、合作伙伴补贴以及区域集成商让利，均模糊了每台设备的实际创收水平。此外，软件订阅、“Powered
              by AGIBOT”定制模型开发以及常态化维保合同的长期收益贡献仍未量化，使得底层收入的持续性存在极大的不确定性。
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
