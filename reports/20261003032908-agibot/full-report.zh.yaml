      - number: '1.4'
        title: 展品
        blocks:
          - type: callout
            title: 量产提速与单位经济模型透明度
            body: >-
              Agibot 在 18 个月内将产量从 1,000 台拉升至 15,000
              台，在全球人形机器人初创企业中属于罕见的量产突破。然而，这种出货速度带来了尽调上的两难反差：尽管第三方出货量数据验证了其制造产能与供应链协同能力，但底层的单台毛利率、客户回本周期以及长期维保成本，依然完全是未经核实的私有数据
              [CO005, CO007, CO013]。
            calloutType: insight
            claimRefs:
              - CO005
              - CO007
              - CO013
          - type: callout
            title: 地缘政治与市场准入风险
            body: >-
              尽管 Agibot 借助灵活的 RaaS 租赁模式，在欧洲、亚太和北美积极拓展海外业务，但监管审查收紧以及美国针对外国产机器人硬件的政策限制，仍为公司的全球可触达市场空间蒙上了巨大阴影 [CO006,
              CO009, CO014]。
            calloutType: risk
            claimRefs:
              - CO006
