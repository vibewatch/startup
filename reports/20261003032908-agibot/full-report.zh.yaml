  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、可触达空间与既有替代方案
        blocks:
          - type: paragraph
            body: >-
              商用人形机器人属于自动化与具身智能大版图中的细分领域。核心市场边界限定为通用型、双足或双臂移动机器人系统，将移动能力、灵巧操作与交互感知集成于统一的物理本体。企业开支范畴包括硬件整机采购、多年期机器人即服务（RaaS）经营租赁、灵巧手等专用末端夹爪、Sim2Real
              仿真训练数据集以及场景集成服务。相对地，可服务市场严格排除了单用途固定工业机械臂、缺乏多轴上肢操作能力的 AGV 与
              AMR、固定式交互终端以及纯企业级软件管线。在客户实际工作流中，人形机器人面临根深蒂固的既有替代方案竞争：无需预付资本支出的人工劳动力、成熟的直角坐标桁架自动化方案，以及传送带搭配专用关节机械臂的组合。传统工业机器人在结构化工作站内执行高速重复作业，而人形机器人则瞄准非结构化或半结构化环境，凭借灵巧性、空间适应能力和协作移动性，免去了固定机器人以往高昂的产线重构成本。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM013
