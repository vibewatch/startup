      - number: '8.2'
        title: 情景分析与可比同业
        blocks:
          - type: paragraph
            body: >-
              评估 Agibot 的预期投资回报，必须对照自动化、AI 及商用硬件领域的上市与非上市同业建立严谨的情景模型。已上市的机器人与机器视觉自动化标的估值倍数严重分化：商用视觉供应商 Reconova
              Technologies 的 EV/Revenue 为 9.3x，工业自动化厂商 Huayan Robotics 为 6.0x，而在大额负 EBITDA 状态下运行的上市自动驾驶开发商 Kodiak AI 则达到
              48.9x。在基准情景下（设定概率 50%），Agibot 以折价后的 HK$25B 至 HK$32B（$3.2B 至 $4.1B）估值完成香港
              IPO，折让原因在于二级市场投资者需对巨额前期资本开支、硬件质保负债以及缺乏验证的工业经常性收入计入估值折价。乐观情景（概率 25%）要求商业试点项目顺利转变为高毛利软件运维合同——例如在 ASD 的 100
              家零售门店落地及在 Fulin Precision 的汽车产线测试——进而支撑其 HK$40B–HK$50B 的估值上限。反之，悲观情景（概率 25%）考量了地缘政治出口限制、国内人形机器人竞品价格战或 IPO
              推迟等负面冲击，这将导致估值被压缩回 $1.5B 至 $2.0B 区间。
            claimRefs:
              - CV004
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV007
              - CV008
              - CV010
      - number: '8.3'
        title: 退出就绪度与尽调重点
        blocks:
          - type: paragraph
            body: >-
              Agibot 的治理架构正全力转向机构流动性变现，已委任 CICC、CITIC Securities 与 Morgan Stanley 牵头筹备香港上市。部分 Pre-IPO 份额已出现在 EquityZen
              等二级份额转让平台，表明机构与超高净值投资者保持浓厚兴趣。然而，潜在的 Pre-IPO 投资者面临显著的流动性悬空与优先股堆叠不透明风险。鉴于 Agibot
              完成了多轮延展融资且从未披露清算优先权、优先赎回权或老股转让限制条款，外部投资者难以精确测算当前普通股的真实权益价值。此外，尽管公司已展开出海业务布局——在欧洲推出起价 €899 的灵活 RaaS
              租赁框架，并在澳大利亚和新西兰搭建分销伙伴网络——但上述开拓仍处于渠道建设初期，缺乏经审计的边际贡献率佐证。在 Agibot
              递交正式招股说明书披露审计营收、客户集中度及单机毛利率之前，保持审慎观望（track）仍是必要姿态。
            claimRefs:
              - CV004
              - CV007
              - CV011
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: 附表与补充论据
        blocks:
          - type: callout
            title: 审慎入场纪律
            body: Agibot 的实体制造交付能力毋庸置疑位居行业前列，但 HK$40B–HK$50B 的拟定 IPO 估值要求业务容错率趋近于零。在正式配置资金前，机构投资人应耐心等待审计财报发布及机队稼动率数据的进一步明确。
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV007
              - CV008
              - CV015
          - type: callout
            title: 股权结构与稀释盲区
            body: 在完成至少三轮融资及多个延展批次后，清算优先权与赎回权公开披露的缺失，为二级市场老股买家带来严峻的下行风险。
            calloutType: risk
            claimRefs:
              - CV005
              - CV006
              - CV014
              - CV015
