        title: 展品
        blocks:
          - type: callout
            title: 上市前夕面临严峻的投资判断缺口
            body: >-
              Agibot 赴港 IPO
              推进的背后，是财务数据的高度不透明。尽管公司在出货量统计上稳居全球榜首，但实际出货均价、毛利率、现金消耗率及客户回本指标的完全缺位，让严谨的估值推演无从谈起。在经审计的正式招股书出炉前，机构投资者只能将出货量第一视为未经证实的商业可持续性参照指标。
