              - CU012
      - number: '6.4'
        title: 客户留存、增购扩单与集中度风险
        blocks:
          - type: paragraph
            body: >-
              尽管 Agibot 展现出了初期的拓客速度，但围绕客户留存、机队扩单经济性与收入集中度的深层结构性隐忧，为其长期商业韧性打上了问号 [CU002, CU011,
              CU012]。公司管理层完全未披露净收入留存率（NRR）、总收入留存率（GRR）、年度客户流失率及合同续约率等正规队列留存指标，公开申报文件中亦无踪迹 [CU011,
              CU012]。目前企业客户拓展主要依托“部署飞轮”策略，试图将早期针对单一场景的试点转化为跨厂区标准化铺量 [CU002]。但公司面临严重的客户集中度风险：大规模工业制造部署主要绑定 Longcheer
              Technology 与 Fulin Precision Engineering 两家客户，导致商业收入极易受制于国内电子代工与汽车零部件组装的资本开支周期 [CU002, CU010,
              CU012]。此外，欧洲与亚太地区激进的国际 RaaS 扩张高度依赖当地分销商与家族办公室伙伴（如澳大利亚的 P&E family office），形成了渠道依赖，也给海外本地技术运维与售后质保带来执行阻力
              [CU005, CU006, CU012]。
            claimRefs:
              - CU002
              - CU005
              - CU006
              - CU010
              - CU011
              - CU012
      - number: '6.5'
        title: 展品
        blocks:
          - type: callout
            title: 部署飞轮模式与传统定制机器人集成对比
            body: >-
              Agibot 最核心的商业差异化在于摆脱了定制化项目制系统集成，转向七大标准化场景解决方案 [CU002]。在传统机器人领域，每个客户交付都需要大量二次开发，导致集成成本高昂、回本周期漫长。Agibot
              通过在产线上下料、物流分拣及零售导引中统一工站结构、传感器配置与基础模型 API，降低了驻场集成难度，并回传了结构化现场实测数据 [CU002,
              CU005]。随着客户现场数据的持续积累，底层操作与导航模型不断迭代，降低了后续客户的部署成本，由此形成了自我强化的采纳飞轮 [CU002]。
            calloutType: insight
            claimRefs:
              - CU002
              - CU005
          - type: callout
            title: 客户集中度高企与未审计续约持续性隐忧
            body: >-
              尽管声称已制造逾 15,000 台机器人并拥有 12 家知名标杆客户，Agibot 在国内电子制造与工业零部件物流领域仍呈现出高度的商业集中度 [CU002, CU009,
              CU010]。其核心的多台规模化部署深度绑定 Longcheer Technology 与 Fulin Precision Engineering，导致商业收入严重暴露在代工厂扩产周期风险之下 [CU002,
              CU010,
              CU012]。此外，由于公司未披露任何客户队列留存数据（NRR/GRR），且许多商用服务落地仍属短期宣传试点，出货机器人究竟能在多大程度上转化为高粘性、多年期的经常性商业收入，依然是潜在投资者面临的最关键尽调风险
              [CU011, CU012]。
            calloutType: risk
            claimRefs:
              - CU002
              - CU009
              - CU010
              - CU011
              - CU012
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 合规监管、国家情报法合规义务与出口阻力
        blocks:
          - type: paragraph
            body: >-
              Agibot 在中国本土严格且无变通空间的法定监管框架下运营。最为核心的是，2017
              年《国家情报法》第七条明确规定，所有境内企业与公民在收到要求时，均有支持、协助和配合国家情报工作的法定义务。该法律要求绝不受企业服务条款、商业客户协议、云端物理服务器租用归属或海外子机构设立的约束。与此配套的
              2017 年《网络安全法》与 2021 年《数据安全法》推行严格的本土数据本地化存储，并强制企业在发现网络安全漏洞后 48
              小时内直接向工信部报送，先于修复或通知国际终端用户。在海外市场，这一法律背景引发了美国两党的立法反弹。美国国会提出的《美国安全机器人法案》（American Security Robotics
              Act）与《GUARD 法案》等拟议条款，寻求禁止联邦机构采购外国对手制造的地面人形机器人，并责成国家安全机构评估将 Agibot 等厂商列入 FCC 限制清单（FCC Covered
              List）。对中国境外的企业级与公共部门采购团队而言，此类法定风险构成了技术网络隔离无法彻底化解的结构性地缘政治阻碍。
            claimRefs:
              - CR001
              - CR002
              - CR003
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
      - number: '7.2'
        title: 作业可靠性瓶颈、安全架构与物理安全风险
        blocks:
          - type: paragraph
            body: >-
              尽管 Agibot 展现了迅猛的扩产势头，在 2026 年 3 月底仅用三个月便将累计产量从 5,000 台提升至 10,000 台，但通用人形机器人在实现自主运行前仍面临严峻的技术可靠性瓶颈。在 Agibot
              的 GO-1 基础模型基准测试中，现实世界任务的初始完成率仅为 46%，在经过涵盖 217 项任务、逾 100 万条轨迹的训练后，成功率提升至 78%。尽管实证进展显著，但 78%
              的成功率仍远低于工业制造场景无人值守所需的 95% 最低开机率门槛。这一差距也印证了更广泛的行业调研结论：在 Morgan Stanley 针对潜在工业买家的调研中，仅 23%
              的受访者对当前商用人形机器人系统表示满意。算法缺陷之外，硬件与物理安全同样存在短板：商用锂电池组将人形机器人的实际作业时间限制在 1 至 4
              小时之间，迫使企业投入自动化热插拔换电设施，从而带来了热失控风险与机械磨损问题。此外，采用 Agibot
              开源操作数据集的外部高校科研团队反映，在下游策略迁移中出现了性能衰减，不得不进行降权或数据清洗。至关重要的是，Agibot
              旗下平台尚未发布过任何经公开独立的第三方网络安全渗透审计或硬件固件审查报告，使企业采购方直接面临未经验证的遥测回传与网络脆弱性风险。
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR013
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR013
              - CR014
      - number: '7.3'
        title: 供应链依赖、核心零部件卡脖子与合作伙伴集中度
        blocks:
          - type: paragraph
            body: >-
              Agibot 的商业放量策略在算力芯片采购、客户集中度以及海外分散化运维上暴露出突出的脆弱性。硬件架构上，其旗舰款 A3 Ultra 人形机器人依赖 NVIDIA 高端 Thor
              半导体芯片，在其异构计算管线中提供 700 TOPS 算力。鉴于美国对高性能人工智能芯片的出口管制不断扩大，一旦贸易限制进一步收紧、切断西方加速计算芯片供应，Agibot
              将面临持续的供应链断供风险。商业化部署仍重度依赖少数几家制造业试点。尽管其 G2 工业机器人曾在 Longcheer Technology 位于南昌的平板组装线上进行过公开直播，完成了超过 64,800
              次作业，但商业创收规模能否坐实，仍取决于 Longcheer 是否会如期扩产至目标 100 台规模。与此同时，Agibot 依托轻资产的 RaaS 模式拓展 17
              国海外市场，将现场维保、物流配送与技术支持外包给当地第三方合作伙伴。这种做法在各地监管差异巨大的海外市场中，极易引发服务交付质量参差不齐、质保履约纠纷以及合作方运营风险。
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
          - type: table
            tableRef: TR003
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
      - number: '7.4'
        title: 财务披露断层、资本密集度与风险热力图综合评估
        blocks:
          - type: paragraph
            body: >-
              Agibot 面临的最核心财务风险，在于其筹备赴港上市前夕极为严重的信息不透明。2026 年 7 月，Agibot 联席保荐人 CICC、CITIC Securities 与 Morgan Stanley
              启动秘密交表程序，目标 IPO 估值在 HK$40 billion 至 HK$50 billion（$5.14 billion 至 $6.4 billion）之间。然而，相较于在科创板上市、拥有经审计的 60%
              毛利率和正向净利润的国内对手 Unitree Robotics，Agibot
              从未公开过主营业务成本、毛利率、经营净亏损或月度烧钱速度。潜在投资者与商业合作方不得不在缺乏经核实单机经济模型的情况下，去评估一家资本密集型的硬件制造企业。此外，Agibot
              的资产负债表与上交所上市公司上纬新材（Swancor Advanced Materials，代码 688585）深度绑定，持有其 63.6% 的股权，该 A 股持股市值在 RMB 41.7 billion
              上下波动，使公司资产价值直接暴露于国内二级市场的波动之下。正如风险热力图所示，无法规避的法定义务隐患、高度受制于人的半导体出口管制以及缺乏经审计的毛利披露，构成了最核心的投资逻辑破灭触发点，足以支撑审慎观望。
            claimRefs:
              - CR011
              - CR012
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR008
              - CR011
              - CR014
      - number: '7.5'
        title: 展品
        blocks:
          - type: callout
            title: 中国情报法规的域外管辖与结构性风险
            body: 2017 年《国家情报法》第七条确立了不可推卸的法定配合义务，该义务无法通过企业服务条款、商业合同或设立海外子公司加以免除，从而在西方企业和政府采购市场中构成了难以逾越的准入壁垒。
            calloutType: risk
            claimRefs:
              - CR001
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与估值背景
        blocks:
          - type: paragraph
            body: >-
              Agibot 的核心投资逻辑高度依赖极快的量产交付节奏：Counterpoint Research 统计显示，公司于 2026 年上半年出货约 9,700 台人形机器人，斩获全球超 43% 的市场份额，并于
              2026 年 6 月实现第 15,000 台整机下线。该交付速度大幅领先 Agility Robotics、Apptronik 和 1X
              等全球竞手，使这家上海企业跃居中国规模最大的量产人形机器人厂商。然而，在财务业绩获得独立验证前，其估值已显著透支。PitchBook 记录 Agibot 截至 2025 年 3 月投后估值为
              $2.07B，投资平台基准数据则显示其 2023 年 12 月估值为 $574M，并在 A 轮延展轮后突破 RMB 7B（$960M）。更激进的是，路透社报道称 Agibot 计划赴港 IPO，拟发售 15% 至
              25% 股份，冲刺 HK$40B 至 HK$50B（$5.14B 至 $6.4B）目标估值。在缺乏经审计的 ARR 或毛利率盈利能力数据公开佐证的前提下，这一拟定 IPO
              估值相比已确认的一级市场轮次出现了极为夸张的跃升。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
