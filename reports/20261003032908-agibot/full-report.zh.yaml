      - number: '4.2'
        title: 单位经济模型、毛利率驱动因素与真实成本结构
        blocks:
          - type: paragraph
            body: >-
              审视 Agibot 的成本结构，可见其量产规模狂飙与单机盈利能力之间存在显著割裂。公司在 2026 年初仅用三个月便从 5,000 台爬坡至 10,000 台，并在 2026 年中交出累计制造 15,000
              台的成绩单。管理层称，依托日趋成熟的国内供应链与制造标准化，生产周期已被大幅压缩，组装速度提升了 4 倍以上。然而，毛利率表现至今依然完全不透明。A2 Ultra
              等全尺寸双足人形机器人集成了大量精密谐波减速器、高密度无框力矩电机、多维力传感器及高性能车载算力平台，导致物料清单（BOM）成本高居不下。尽管广东和江苏等省市的制造业补贴为前期部署分担了部分成本，但长远毛利表现仍取决于能否达到车规级核心零部件良率，并彻底摆脱重度依赖驻场工程师维护的局面。目前，实际毛利率、质保准备金以及机队外勤运维费用仍属未公开数据，外界尚无法独立验证其单机边际贡献率是否转正。
