      - number: '6.2'
        title: 采纳节奏、量产规模与全球机队分布
        blocks:
          - type: paragraph
            body: >-
              Agibot 的客户采纳曲线折射了其指数级的产能爬坡，在 36 个月内实现了从原型验证到商业量产的跨越 [CU007, CU008]。公司耗时近两年制造出前 1,000 台，到 2025 年底达到 5,000
              台，2026 年 3 月放量至 10,000 台（组装速度提升 4 倍），并在 2026 年 6 月实现第 15,000 台整机下线 [CU007, CU008, CU009]。第三方咨询机构
              Counterpoint Research 的追踪数据显示，这一量产提速直接转化为了商业交付上的领先地位：2026 年上半年 Agibot 出货约 9,700 台人形机器人，拿下全球市场超过 43% 的总出货份额
              [CU009]。在 5,000 台里程碑时，各产品线的产能分配分别为：全尺寸双足 A 系列 1,742 台、轻量半身 X 系列 1,846 台、工业级 G 系列操作平台 1,412 台
              [CU001]。落地场景现已覆盖智能制造、包裹分拣、导引接待及科研教学等八大商业领域 [CU001,
              CU007]。然而，由于缺乏分母端披露，外界无从知晓出货设备中有多少属于真实且持续运转的客户产线部署，有多少属于渠道压货、短期展会租赁或高校科研赠款，其实际工业稼动率仍未得到验证 [CU007, CU009]。
