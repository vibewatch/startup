        - label: 开发者与仿真中间件
          detail: 基于ROS 2的任务级SDK AimDK_X2、Genie Studio智能体及Genie Sim 3.0数字孪生平台
        - label: 具身AI基础模型
          detail: 运动控制（BFM、GCFM）、灵巧操作（GO-2 ViLLA、SOP学习）与人机交互（WITA Omni）
        - label: 操作系统与中间件
