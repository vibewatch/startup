      - number: '1.3'
        title: 资本运作、产能爬坡与市场渗透
        blocks:
          - type: paragraph
            body: >-
              Agibot 的融资历程展现了极高的估值跃升速度，背后有国资背景风投及科技巨头的重金支持 [CO011]。PitchBook 数据显示，截至 2025 年 3 月，在 Tencent 与 HongShan
              Capital Group 的支持下，公司投后估值已达 $2.07 billion [CO011]。到了 2025 年底至 2026 年，据路透社报道，Agibot 已委任 CICC、CITIC
              Securities 及 Morgan Stanley 筹备赴港上市，目标估值在 HK$40 billion 至 HK$50 billion（$5.14 billion 至 $6.4
              billion）之间，计划发售 15% 至 25% 的股份 [CO011]。在生产端，Agibot 的量产节奏显著加快：耗时约两年下线首批 1,000 台，2025 年底前由 1,000 台增至 5,000
              台，2026 年 3 月仅用三个月便从 5,000 台扩充到 10,000 台，并在 2026 年 6 月迎来第 15,000 台下线 [CO007,
              CO012]。第三方分析机构印证了这一放量势头：Counterpoint Research 估计 Agibot 在 1H 2026 出货约 9,700 台人形机器人（全球份额 43%）；Smart
              Analytics Global（SAG）测算其出货量为 8,400 台（全球份额 44%），位列全球第一，领先 Unitree [CO005, CO013]。但 SAG
              分析师指出，地缘政治摩擦升温叠加美国对外国产机器人的准入限制，为公司的出海扩张带来了严峻的监管与市场准入阻力 [CO014]。
