  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 具身硬件平台与模块化产品矩阵
        blocks:
          - type: paragraph
            body: >-
              Agibot 针对商业、工业与科研领域的不同工作流，打造了多款物理具身硬件。其硬件矩阵涵盖全尺寸双足人形机器人（Expedition A2 与 A3）、紧凑型科研人形机器人（Lingxi X1 与
              X2）、轮式工业操作底盘（Jingling G2 与 G2 Air）、全地形四足机器人（D1 与 D2 Max）以及 C5 清洁机等商用服务设备。其中，Expedition A3 主打交互场景，身高 173
              cm，体重 55 kg，推重比达 0.218 kW/kg，配备超宽带（UWB）集群定位与 10 秒快速换电机构。面向工业装配与物流搬运，单臂款 G2 Air 提供 7
              自由度（DOF），采用同构数据采集设计，可在执行任务时直接抓取真实场景演示数据。末端执行器由 OmniHand 3 Ultra-T 支撑，采用 22+3 自由度的线驱方案，搭载全手 3D 触觉感知，响应延迟低于
              0.3 秒。
