      - number: '5.2'
        title: 具身智能架构：一体三智
        blocks:
          - type: paragraph
            body: >-
              Agibot 的核心技术框架将具身智能划分为三个功能层级：运动智能、操作智能与交互智能。运动智能由用于单次人类动作模仿的行为基础模型（BFM）与用于多模态动作生成的生成控制基础模型（GCFM）主导。操作智能以
              Genie Operator-2（GO-2）ViLLA 基础模型为核心，采用动作思维链（Action Chain-of-Thought）架构拆解复杂的多步骤操作任务，底层由 Genie Sim 3.0
              数字孪生与真实世界分布式在线学习系统（SOP）协同支撑。交互能力由原生端到端多模态模型 WITA Omni 驱动，统合视觉、音频、语言及物理手势。整套全栈 AI 运行于 Link-U OS 之上，并通过基于
              ROS 2 构建的 AimDK_X2 框架向二次开发者开放，支持在不同部署形态下模块化调用高阶控制 API。
            claimRefs:
              - CE005
