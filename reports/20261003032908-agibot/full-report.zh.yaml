  - id: FV001
    title: 投资评级逻辑链
    type: flow
    summary: 将Agibot制造出货规模与市占率优势，与其尚未核验的财务数据以及最终维持观望（Track）评级相勾连的决策逻辑链。
    data:
      nodes:
        - id: N1
          label: 出货规模领跑
          detail: 2026年上半年全球出货份额超43%，累计下线量突破15,000台
        - id: N2
          label: 商业化与RaaS版图扩张
          detail: 渗透零售、物流场景，并在欧洲上线日租€899起的租赁业务
        - id: N3
          label: 财务与公司治理不透明
          detail: 营收真实性待验，毛利率未公开，且缺乏股东股权优先权透明度
        - id: N4
          label: 激进的IPO估值预期
          detail: 计划赴港上市，目标估值达 HK$40B-HK$50B（约合 $5.14B-$6.4B）
        - id: N5
          label: 估值脆弱性与下行风险
          detail: 若IPO前硬件变现不及预期，将面临估值倍数压缩或折价融资风险
        - id: N6
          label: 最终结论：持续跟踪（Track）
          detail: 暂不投入成长期资本，待经审计招股书披露及单机经济模型核实后再做决断
      edges:
        - from: N1
          to: N2
          label: 赋能支撑
        - from: N2
          to: N3
          label: 形成鲜明反差
        - from: N3
          to: N4
          label: 加剧不确定性
        - from: N4
          to: N5
          label: 抬升风险敞口
        - from: N5
          to: N6
          label: 决定投资立场
    approximationNotes: 展示从实体业务运营数据推演至估值研判的分析链路。
    claimRefs:
      - CV001
      - CV004
      - CV007
      - CV008
      - CV011
      - CV015
