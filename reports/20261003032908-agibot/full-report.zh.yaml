      - number: '2.3'
        title: 买方细分、预算分配与采纳机制
        blocks:
          - type: paragraph
            body: >-
              企业对具身机器人的采纳分化为诉求各异的垂直行业，各行业的运营要求与预算审批机制大相径庭。工业制造与消费电子组装是货值最高的主战场，厂长与运营副总裁主要依据产线工人长期短缺及良率提升来批复资本开支。在商业迎宾、智慧零售与酒店服务领域，区域商业负责人多将人形机器人作为品牌形象大使与导引接待员，资金通常出自市场推广或客户体验预算。高校与科研机构的课题组负责人则通过科研基金采购紧凑型双足设备，用于训练具身认知模型。为加速企业端渗透，厂商推行机器人即服务（RaaS）租赁模式，将原本动辄六位数的整机采购门槛降为按日或按月计费的运营支出，欧洲试点日租金仅
              899 欧元起步。然而，企业的落地决策仍被回本周期卡住：已部署的工业机队尚未公布过可验证的长期开机率、维保成本或跨年度投资回报测算，无法充分证明其相对于专用协作机器人的经济优越性。
