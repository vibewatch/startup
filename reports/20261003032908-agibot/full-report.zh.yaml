      - number: '2.2'
        title: 市场测算视角、商业化路径与出货分化
        blocks:
          - type: paragraph
            body: >-
              行业分析师对人形机器人市场的测算视角分歧明显，涵盖保守的近期硬件交付预测与宏大的长期具身智能愿景。IDC 数据显示，2025 年全球人形机器人出货量约达 18,000 台，带动硬件收入 $440
              million，同比激增 508%。中国厂商在出货规模上占据先发优势，在 2025 年贡献了全球近 90% 的出货量。Counterpoint Research 发布的 2026
              年中追踪报告指出，上半年全球出货量已突破 22,000 台，较 H1 2025 增长近 300%，全年出货预期将超过 50,000 台。长期来看，涵盖软件、运营平台与 RaaS 合同在内的整体市场规模，预计将从
              2025 年的约 $3 billion 增至 2030 年的 $15 billion（MarketsandMarkets 预测），并在 2033 年达到 $35.4 billion（SkyQuestt
              预测）。硬件出货呈现鲜明的结构性分化：全尺寸人形机器人得益于复杂的双臂操作能力，在 2025 年占据了全球收入的 41.6%；而低成本紧凑型平台则在教育、科研与宣传展演层级占据绝对主流。Agibot
              实现了出货量的快速爬坡，2025 年交付 5,100 至 5,200 台，并在 H1 2026 交付约 9,700 台，但长期的经常性软件收入仍未得到验证。
            claimRefs:
