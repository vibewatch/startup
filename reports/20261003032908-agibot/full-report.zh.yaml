  - id: FU001
    title: 客户旅程全景图
    type: journey-map
    summary: Agibot商业生态中，客户历经采购获客、试点论证、产线集成到机群复制的全流程路径。
    data:
      items:
        - label: 阶段一：初步接触与试用
          touchpoints:
            - 在线商城与RaaS租赁：通过store.agibot.com提供低门槛试用，单日展会租赁定价从€899起。
            - 行业展会演示：在拉斯维加斯CES与巴塞罗那MWC现场呈现多场景实机演示。
            - 高管合作伙伴大会：在上海、墨尔本和伦敦举办区域APC峰会，集中展示七大行业解决方案。
        - label: 阶段二：试点评估与可行性论证
          touchpoints:
            - 场景痛点诊断：排查客户在上下料、分拣或零售迎宾等特定业务环节的执行瓶颈。
            - 技术可行性分析：评估负载、作业半径、节拍时间及物理工况环境约束。
            - 人工作业对标：制定吞吐量基准指标，并搭建初步ROI财务测算模型。
        - label: 阶段三：受控环境验证
          touchpoints:
            - 实验室与工位测试：在测试工位内验证亚毫米级精度、磁盘跌落率或包裹吞吐能力。
            - 软件仿真模拟：借助Genie Sim 3.0及AimDK_X2控制API模拟工厂流水线工序。
            - 安全与合规审查：通过ISO机器人安全认证评估与车间作业环境风险排查。
        - label: 阶段四：产线工位集成
          touchpoints:
            - 硬件实地安装：将G2工业机械臂或A2人形机器人导入专用生产作业工位。
            - 系统互联互通：打通机器人机群与工厂MES系统数据库及AGV调度网络的数据对接。
            - 操作人员培训：培训现场技术人员掌握电池热插拔流程与日常故障排查处置。
        - label: 阶段五：运行验收与试点收官
          touchpoints:
            - 连续负荷测试：开展跨班次耐久运行测试，严密统计平均人工干预间隔时间（MTBA）。
            - 质量良率审计：统计缺陷率、晶圆搬运良率或包裹分拣准确率指标。
            - 商业采购转化：签署正式企业级采购合同，锁定多年期维保支持条款。
        - label: 阶段六：机群扩容与网络复制
          touchpoints:
            - 机群规模扩容：从单一工位向全厂级机群推广（如Fulin Precision部署百台级机器人集群）。
            - 跨厂区复制铺开：将标准化解决方案套件复制至多地生产基地网络。
            - 部署飞轮迭代：汇总现场遥测运行数据回流重新训练基础大模型，持续提升任务执行成功率。
    approximationNotes: 该框架刻画了从初期试验性租赁走向工厂多机器人规模化部署的典型商业路径；不同行业客户的导入节奏因原有自动化基础差异而有所不同。
    claimRefs:
      - CU002
      - CU004
      - CU005
      - CU006
      - CU010
      - CU012
