      - number: '4.3'
        title: 资金充裕度、烧钱速度审视与上市策略
        blocks:
          - type: paragraph
            body: >-
              2026 年 7 月，Agibot
              正式启动赴港上市程序，力图成为首家登陆公开资本市场的中国纯具身智能人形机器人标的。这一上市动作正值机构投资者对风投人形机器人烧钱速度的审视空前严苛之际。随着全球一级市场估值回落以及硬件融资愈发挑剔，Agibot
              意在借助海外公开市场机构资金，支撑后续的高强度研发与全球化渠道拓展。但关键在于，公司前期的监管申报材料中既未公布目标估值，也未透露募资金额，净现金结余、单月经营性烧钱速度与现金跑道长度均未披露。在缺乏经审计招股书披露过往现金消耗、客户集中度及债务契约细节的情况下，投资者在评估
              Agibot 是依赖持续外部输血还是具备自我造血能力时，面临巨大的投资判断风险。
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
