      - number: '3.3'
        title: 定价模式、GTM 路径与替代动态
        blocks:
          - type: paragraph
            body: >-
              人形机器人赛道的商业化定位呈现明显分化：面向开发者或展演场景采取公开挂牌价，而企业级落地则普遍采取非公开定制合同。Agibot 已公布部分硬件售价，例如轻量交互人形机器人 X2 为 $24,240，A2 Lite
              为 $44,560，同时在欧洲推出 €899/天起步的短期租赁方案以降低试用门槛。相比之下，竞手 Unitree 则打出更激进的硬件价格带，入门平台仅需 $13,500
              起；企业物流赛道的对手则多通过长期经营租赁方式切入。Agibot 能否守住毛利率并避免沦为硬件代工，关键在于能否在高吞吐量的工业与服务场景中，拿出明确的人工替代经济效益证明。
