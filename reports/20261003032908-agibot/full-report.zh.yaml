chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司主体、平台架构与商业化阶段
        blocks:
          - type: paragraph
            body: >-
              Agibot Innovation (Shanghai) Technology Co., Ltd. 由前华为工程师 Deng Taihua 与 Peng Zhihui 于 2023 年 2 月在中国上海创立
              [CO001]。公司立足通用具身智能构想，将通用人工智能算法与覆盖工业及商业领域的模块化机器人本体相结合 [CO002]。技术架构上，Agibot 围绕“1 Robotic Body + 3
              Intelligence”框架推进研发，将机械底盘与交互、操作、移动智能层深度耦合 [CO003]。公司目前处于成长期后期，属于典型的硬件与具身智能成长型企业，正由本土制造向海外直销与租赁业务拓展
              [CO004]。其商业化产品矩阵涵盖全尺寸双足人形机器人（A2/A3 系列）、轻量交互人形机器人（X2 系列）、轮式工业双臂操作平台（G2 系列）、四足巡检单元（D1 系列）及商用清洁机器人（C5）[CO003,
              CO005]。借助线上商城和生态合作网络，Agibot 还推出了覆盖 17 个国家和地区的 RaaS 机器人即服务租赁业务，日租金起步价为 €899
              [CO006]。虽然早期试点多集中在展厅接待、物流分拣与高校科研，但消费电子产线质检已成为其最核心的工业验证场景 [CO005, CO007]。
            claimRefs:
