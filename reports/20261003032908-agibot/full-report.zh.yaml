      - number: '2.4'
        title: 增长驱动、监管制约与地缘割裂
        blocks:
          - type: paragraph
            body: >-
              人形机器人的渗透步伐既受结构性红利推升，又被现场运营瓶颈与地缘割裂严重掣肘。最根本的长期驱动力在于各大工业强国的人口结构萎缩，制造业和物流业由此出现严重的体力劳动缺口，而固定自动化方案难以在经济账上划算地补足。机器人执行器、谐波关节成本骤降，叠加多模态
              AI
              基础模型演进，进一步加速了硬件落地可行性。但现实部署中仍面临棘手的技术制约：高负荷连续作业下电池续航通常受限于两小时以内，散热降频问题突出，且在处理长尾突发状况时依然离不开人机协作的远程遥操作接管。更为致命的是，全球市场准入已沿地缘政治边界断裂：2026
              年 7 月 28
              日，美国联邦通信委员会（FCC）出台进口禁令，封禁未经认证的中国产人形及四足机器人，直接阻断了中国新兴硬件厂商对接北美企业级采购的通道。此项监管直接迫使中国本土制造商将出货重心退缩至国内制造业集群、东南亚、欧洲及大洋洲，同时还要应对海外数据安全认证的不确定性。
            claimRefs:
              - CM004
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 展品
        blocks:
          - type: callout
            title: 地缘政治割裂与西方市场准入阻断
            body: >-
              2026 年 7 月 FCC
              针对未经认证的中国产人形机器人颁布的进口禁令，构成了前所未有的监管壁垒，直接切断了中国机器人硬件厂商承接美国企业直采的通道。尽管中国本土需求以及东南亚和中东的区域扩张贡献了出货规模，但失去北美工业与商业市场，实质上压低了企业级软件的长期利润上限，也阻隔了公司接触全球顶尖制造业大客户的机会。
            calloutType: risk
            claimRefs:
              - CM014
              - CM015
          - type: callout
            title: 从试点到量产的单位经济模型鸿沟
            body: >-
              尽管业内动辄宣称数万台的出货里程碑，但商业化市场至今仍以概念摸索与试点为主，尚未形成产线上的永久替代。企业真正实现大规模采纳的关键，在于能否在持续多班倒的工业制造周期中，拿出经受检验的多年期总拥有成本（TCO）证据，包括无辅助开机率、平均无故障工作时间（MTBF）以及电池衰减表现。
            calloutType: insight
            claimRefs:
              - CM002
              - CM004
              - CM012
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 人形与具身机器人竞争格局
        blocks:
          - type: paragraph
            body: >-
              围绕 Agibot 的竞争格局覆盖了双足人形机器人研发商、四足与移动机器人厂商，以及业务多元的工业自动化巨头。直接的国内竞争对手包括已在香港上市并商业化 Walker 系列的 UBTECH
              Robotics，以及主攻低价硬件、面向消费级与科研场景并冲刺科创板上市的 Unitree Robotics。与此同时，Xiaomi Robotics 与 Dreame Technology
              等头部消费电子及家电企业也已跨界进军人形与具身机器人赛道。在商用物流与迎宾接待等专用功能场景中，非人形或轮式替代方案（如 Enchanted Tools 的 Mirokai）以及专用物流平台（如 Agility
              Robotics 的 Digit），与 Agibot 的双足 A2 及轻量 X2 系列形成了鲜明的商业竞争差异。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
      - number: '3.2'
        title: 产品架构与差异化壁垒持久度
        blocks:
          - type: paragraph
            body: >-
              Agibot 将其竞争护城河建立在机械硬件与自研具身智能的紧密结合上，具体概括为包含移动、交互和操作的“1 Robotic Body + 3 Intelligence”体系。在智能层，Agibot 部署了
              Genie Operator 视觉-语言-动作（VLA）架构与 Genie Envisioner 世界动作模型来驱动物理执行，并在其双臂平台上辅以边部署边学习（Learning While
              Deploying）强化学习框架。然而，由于竞对硬件厂商纷纷推出开放开发套件、ROS2 兼容接口及低成本双足硬件，竞争态势依然白热化；如果缺乏机队规模上持续验证的任务成功率，Agibot
              很难长期维持纯软件带来的锁定效应。
