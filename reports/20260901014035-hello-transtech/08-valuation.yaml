- id: TV005
  title: Thesis-break and kill triggers table
  summary: Monitorable events that should force valuation or conviction resets.
  sourceRefs:
  - SV015
  - SV020
  - SV021
  - SV022
  - SV023
  claimRefs:
  - CV035
  - CV040
  - CV042
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Repeat safety / merchant scandal
    - Another 3·15-scale issue or material city enforcement event
    - Damages governance credibility and raises regulatory discount
    - Move toward bear case immediately.
  - - Privacy enforcement
    - Meaningful PIPL or data-security rectification / penalty involving core mobility flows
    - Raises cost and lowers confidence in scale monetization
    - Demand full compliance review before new capital.
  - - Labor-cost shock
    - Evidence 2026 worker-rule implementation materially lifts cost without offsetting yield
    - Compresses margin assumptions
    - Lower valuation range and revise downside case.
  - - Partner pullback
    - CATL, Ant, or Alibaba narrow support or slow commercialization
    - Cuts optionality value and funding comfort
    - Reduce value assigned to adjacencies.
  - - Price / quality deterioration
    - Repeated price hikes alongside worsening review or utilization signals
    - Suggests core business is weaker than assumed
    - Treat current mark as too rich.
  - - Exit-market weakness
    - No credible secondary or IPO path while investor pool contracts further
    - Extends illiquidity and narrows terminal-value support
    - Increase hold-period discount.
  notes: Triggers are designed to be externally monitorable from diligence materials or future disclosures.
- id: TV006
  title: Final diligence asks table
  summary: Highest-value open diligence items before underwriting a fresh round near current marks.
  sourceRefs:
  - SV002
  - SV011
  - SV020
  - SV024
  claimRefs:
  - CV030
  - CV041
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Core revenue and contribution margin
    - Current revenue by line and contribution margin by city / product
    - Needed to know whether $6B implies a reasonable or stretched multiple
    - Request monthly and quarterly operating review packs.
  - - Cash runway and burn
    - Cash on hand, debt, monthly burn, and downside runway
    - Determines whether strategic funding support is optional or necessary
    - Request treasury bridge and 12-18 month downside plan.
  - - Cap table and preferences
    - Liquidation preferences, anti-dilution, secondaries, and related-party rights
    - Private value can differ sharply from common-equity economics
    - Request cap table waterfall and latest financing documents.
  - - Post-3·15 remediation
    - Merchant exits, vehicle removals, audit cadence, and regulator correspondence
    - Direct test of governance quality after a live compliance failure
    - Request remediation dashboard and enforcement tracker.
  - - Robotaxi / battery economics
    - Capex, utilization, milestone funding, and expected ROI
    - Optionality should not receive full credit without economics
    - Request business-case memos and JV governance documents.
  - - Retention after pricing changes
    - Ride frequency, pass renewal, churn, and elasticity after 2026 hikes
    - Shows whether monetization changes improved or harmed core value
    - Request cohort analyses by city and rider segment.
  notes: These asks prioritize issues most likely to change both value and investor confidence, not a full diligence list.
