company:
  name: Hello TransTech
chapter:
  number: 8
  title: Valuation
summary: 'Public evidence supports Hello as a real, large, multi-line mobility platform, but it does not fully support treating the widely cited ~$6B 2026 valuation as an obvious bargain. Third-party market-data sources place Hello near $6B, while CB Insights shows $2.701B total disclosed funding, a September 2025 latest round, and a last explicit historical mark of $5B in December 2018. Against public mobility comps, that private mark is not absurd, but it does require a premium for strategic backing and optionality because public peers such as Meituan and Didi trade around roughly 1.1x and 0.5x revenue respectively. The problem is not scale, but evidence quality: Hello’s current revenue, contribution margin, runway, cap-table preferences, and post-3·15 remediation metrics remain too opaque. This chapter therefore lands on TRACK / selective diligence at medium confidence and high risk, with a public-evidence base case of roughly $4.5B-$6.0B and an expected value near $5.2B.'
sections:
- id: investment-thesis-and-recommendation
  title: Investment thesis and recommendation
  body: Hello is easy to like at the company-quality level. Official, analyst, and reporting sources consistently describe a large local-mobility platform that survived China’s bike-sharing wars, expanded into ride-hailing, battery swap, and robotaxi, and retained strategic backing from Alibaba-linked entities, Ant Group, and CATL. That combination gives the company real scale, adjacency optionality, and a financing cushion that many pure micromobility operators never had. But the valuation call has to be price-sensitive, not admiration-driven. The same public record also shows 2026 bike-price increases, 3·15 enforcement over rental e-bike compliance, privacy and labor obligations that are tightening rather than easing, and limited direct visibility into present revenue, margins, and cash burn. Those factors do not invalidate the company; they mainly cap conviction. The correct recommendation on public evidence is therefore TRACK / selective diligence, not outright buy. At a clear discount
    to the current third-party mark or with access to stronger private operating data, the call could improve. At or above ~$6B without deeper disclosure, investors are paying for ambition and strategic optionality that are only partly proven in public.
  claimRefs:
