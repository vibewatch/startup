  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current revenue, margin, and runway
    missingEvidence: Current revenue by line, contribution margin by city/product, cash on hand, debt schedule, and downside runway.
    whyItMatters: Without those numbers, investors cannot tell whether the ~$6B mark sits near 1x revenue or 3x+ revenue, nor whether strategic capital is optional or essential.
    diligencePath: Request the latest board deck, monthly operating review, and 12-18 month base/downside cash bridge.
    relatedQuestionRefs:
    - QV010
    - QV011
    - QV022
    - QV029
    relatedTableRefs:
    - TV001
    - TV003
    - TV004
    - TV006
  - type: private-evidence-only
    severity: material
    topic: cap table, secondary liquidity, and preferences
    missingEvidence: Liquidation preferences, anti-dilution rights, secondary transaction history, strategic-holder rights, and any related-party protections.
    whyItMatters: Private headline valuation can diverge sharply from the value accruing to new or common-equity investors.
    diligencePath: Request the full cap-table waterfall and the latest financing documents and side letters.
    relatedQuestionRefs:
    - QV004
    - QV014
    - QV027
    - QV029
