  rows:
  - - Scale thesis
    - Hello is one of the few survivors of China’s bike-sharing shakeout and now spans multiple mobility categories
    - Show that scale converts into durable contribution margins rather than just broad usage.
  - - Strategic-backer thesis
    - Alibaba-linked capital, Ant Group, and CATL can support funding, technology, and commercialization
    - Clarify whether support is durable, economically favorable, and not masking weak standalone economics.
  - - Optionality thesis
    - Battery swap and robotaxi add upside beyond core bike sharing
    - Disclose milestone, capex, utilization, and ROI evidence by adjacency.
  - - Economics anti-thesis
    - 2026 price hikes imply the core business still needs active monetization repair
    - Provide post-price-change retention, frequency, and margin data.
  - - Governance anti-thesis
    - 3·15 enforcement and tightening privacy/labor rules can compress multiples quickly
    - Show auditable remediation, compliance investment, and absence of repeat incidents.
  notes: Arguments are directional and should be updated if private financials or cap-table terms become available.
