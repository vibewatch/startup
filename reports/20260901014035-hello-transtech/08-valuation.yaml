- id: scenario-analysis-and-exit-logic
  title: Scenario analysis and exit logic
  body: Scenario analysis is the most honest way to value Hello from public data because current revenue, margins, and preference structures are still partially hidden. The 2026 venture environment allows large private marks to persist, but CB Insights also shows a market that is top-heavy, with fewer active investors and weaker exits in Asia. That means strong companies can stay private longer, but liquidity remains selective and price discipline still matters. In the bear case, investors should assume that 3·15-type governance problems, price-hike backlash, or a weaker exit market push Hello closer to $3B-$4B. The base case, which gives partial credit to platform scale, multimodal breadth, and strategic backers while discounting for opacity and risk, lands around $4.5B-$6.0B. The bull case requires clear proof that core mobility economics are durable and that robotaxi and battery-swap adjacencies are becoming commercial rather than merely strategic narratives; under that outcome, $6.5B-$8.0B
    is plausible. Probability-weighting those scenarios yields an expected value near $5.2B, which is why the current $6B mark looks fair-to-full rather than obviously wrong.
  claimRefs:
  - CV015
  - CV016
  - CV017
  - CV018
