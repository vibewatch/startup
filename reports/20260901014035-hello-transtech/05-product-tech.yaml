- id: sku-asset-map-and-operating-model
  title: SKU, asset map, and operating model
  body: The product map now spans several layers. At the edge closest to the rider are shared bikes, shared e-bikes, passes, memberships, and market-specific packages. Around that sits a partner layer for event activations, advertising, and embedded distribution. Beneath both sits a field-operations layer covering parking management, maintenance, issue handling, and local regulatory adaptation. Hello’s Hong Kong, Singapore, and Australia evidence is especially useful because it shows real localization rather than one static product dropped into every market. Hong Kong used a specific OA60 bike model and localized penalties; Singapore emphasized commuter-bike upgrades and fleet refresh; Logan highlighted e-bikes and scooters with a richer safety-tech stack. Product breadth therefore comes less from one massive menu in the UI than from a modular operating system that can swap vehicle type, fee logic, safety rules, and partner attachments by market.
