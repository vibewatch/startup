  title: Product/service definition table
  columns:
  - Step
  - User action
  - System action
  - Failure mode
  - Why it matters
  rows:
  - - Discover
    - Open app and find nearby vehicle
    - Map surfaces location and availability
    - No vehicle nearby or stale map
    - Availability is part of product quality
  - - Unlock
    - Scan QR or enter vehicle number
    - App authenticates rider and sends unlock command
    - Code scan or unlock failure
    - Software reliability matters as much as hardware
  - - Ride
    - Use bike or e-bike for trip
    - Device tracks location / status and may allow pause
    - Low battery, brake issue, or zone exit
    - Vehicle condition and telemetry matter
  - - Return
    - Park in service zone or P spot and lock vehicle
    - System validates location and ride end
    - Relocation fee or failed ride end
    - Geofencing and parking rules shape trust
  - - Resolve issue
    - Report fault / payment issue
    - Support workflow handles refund or compensation
    - Slow support or rejected dispute
    - Support is part of core product, not an extra
  notes: The “product” includes the workflow controls that govern each step, not just the bike hardware.
