  layout: wide
  summary: Hello acquires and retains different user types through different access and expansion loops, but all of them depend on a reliable ride-return-support experience.
  data:
    nodes:
    - label: Commuter discovery
      detail: Find nearby bike through Hello, Grab, or partner surface
    - label: First useful ride
      detail: Complete a first-/last-mile trip with low onboarding friction
    - label: Repeat-use trigger
      detail: Buy pass or return because search time and parking are manageable
    - label: Expansion loop
      detail: Branch into leisure, partner rewards, or delivery use cases
  approximationNotes: The journey map is expressed as common journey nodes because public sources describe the step sequence and repeat triggers more clearly than they describe exact percentages by segment.
