  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cohort and paying-user data
    missingEvidence: Paying-user counts, pass-renewal cohorts, churn, and segment-level repeat-use metrics across major cities and products.
    whyItMatters: Public customer breadth does not reveal whether the same users monetize repeatedly at durable economics.
    diligencePath: Request monthly cohorts by city, pass type, user segment, and acquisition channel.
    relatedQuestionRefs:
    - QU019
    - QU020
    - QU024
    relatedTableRefs:
    - TU004
    - TU006
  - type: private-evidence-only
    severity: material
    topic: channel dependence
    missingEvidence: Acquisition and ride mix attributable to Alipay, Grab, Ryde, direct app, and other partner channels.
    whyItMatters: Channel dependence can create hidden concentration and bargaining-power risk even when top-line customer growth looks healthy.
    diligencePath: Request new-user, ride, and retained-user mix by channel plus channel economics.
    relatedQuestionRefs:
    - QU013
    - QU018
    - QU024
    relatedTableRefs:
    - TU005
    - TU006
  - type: missing-source
    severity: minor
    topic: campus customer proof
    missingEvidence: Independent reporting or official case studies with concrete campus user counts or campus retention outcomes.
    whyItMatters: Campus is mentioned in official materials, but public evidence is thinner than for Singapore commuters or partner campaigns.
