company:
  name: Hello TransTech
chapter:
  number: 6
  title: Customers
summary: 'Hello’s customer story is unusually broad for a company still remembered mainly as a bike-sharing brand. Public evidence supports mass commuter usage, tourist and leisure riders, delivery-rider support, campus and local-life adjacencies, and partner-led growth channels such as Ryde, Grab, and Razer. Adoption proof is strong on broad registrations, DAU-style claims, cumulative riding scale, and especially on Singapore fleet growth from 1,000 bikes in 2022 to 25,000 by 2026. The weak point is durability measurement: public sources imply repeat use through passes, pay-after-ride, and search-time reduction, but they do not disclose paying-user counts, churn, or cohort retention in enough detail to price customer quality precisely.'
sections:
- id: segment-breadth-and-user-map
  title: Segment breadth and user map
  body: 'Hello’s customer base is broader than the usual image of blue bikes outside a subway stop. Official company pages now describe a platform serving riders across bike sharing, carpooling, ride-hailing, e-bike, battery, and rental workflows, while international material adds more explicit commuter, tourist, and leisure positioning. That breadth matters because the buyer, user, and payer can collapse into the same person for a basic ride but split apart once passes, brand partnerships, or municipal counterparts appear. The strongest core segment is still everyday urban riders, especially commuters seeking first- and last-mile mobility. But the public record also supports tourists, leisure riders, delivery workers, campus users, and partner-led demand surfaces. This should change the diligence frame: Hello is not simply chasing one commuter archetype. It is monetizing repeated urban movement across several contexts, with slightly different channels, price points, and retention logic for each.'
  claimRefs:
  - CU001
  - CU002
  - CU007
  - CU013
