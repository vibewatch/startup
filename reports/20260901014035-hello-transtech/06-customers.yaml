- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Partner channels like Grab / Ryde / Razer
    - Growth tied to third-party platforms or promos
    - Could inflate dependency and reduce margin control
    - Break out rides and new users by channel
  - - Singapore case study depth
    - Public proof concentrated in one market
    - May overstate global repeatability
    - Request market-by-market user and retention data
  - - Regulator-approved scaling
    - Fleet growth depends on compliance and quotas
    - Expansion can slow even with demand
    - Collect permit, quota, and violation trend data
  - - Foreign-tourist usability
    - Helpful for growth in select cities
    - May be seasonal or low-ARPU
    - Measure tourist versus commuter economics
  - - Leisure / community activations
    - Good for brand and off-peak use
    - May be episodic rather than sticky
    - Track repeat usage after events
  notes: The strongest public growth stories are also the most obvious sources of concentration risk.
