- id: adoption-trajectory-and-named-proof
  title: Adoption trajectory and named proof
  body: 'The adoption story is strongest when broad scale proxies are paired with named deployment proof. Public sources establish large historical user and city reach, and current official surfaces continue to claim a very large registered-user base plus substantial cumulative riding distance. International evidence adds more concrete deployment steps: Singapore’s fleet expansion from 1,000 bikes in 2022 to 20,000 by 2025 and 25,000 by 2026; Hong Kong market entry with targeted promotions; and Logan’s trial-based deployment tied to public transport, community facilities, and local jobs. Partner-linked proof is also valuable because it names actual growth channels rather than only vanity counts. Ryde, Razer, foodpanda-related onboarding, and Grab access all show that Hello is pursuing multimodal and ecosystem-led adoption rather than relying solely on riders discovering standalone apps.'
