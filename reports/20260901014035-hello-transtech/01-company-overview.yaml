company:
  name: Hello TransTech
chapter:
  number: 1
  title: Company Overview
  summary: 'Hello TransTech, better known as Hello or Hellobike, is still best understood as China’s largest surviving bike-share latecomer that successfully widened into a broader local-mobility platform. Official and independent sources support a Shanghai-founded business that began with lower-tier-city bike sharing, now claims more than 800 million registered users, operates international HelloRide fleets, and has added battery swapping, ride-hailing, and Robotaxi initiatives. The open record is strategically rich but financially thin: the 2025 CATL-Ant-Alibaba robotaxi push is real, yet Hello remains private after abandoning a U.S. IPO in 2021 and still discloses little audited standalone financial data.'
sections:
- id: identity-and-platform-scope
  title: Identity and platform scope
  body: 'Hello’s identity is materially broader than the old Hellobike label suggests. The company’s own current overview describes a Shanghai-headquartered business founded in September 2016 that now calls itself a local mobility and lifestyle-services platform rather than simply a dockless-bike operator. That framing is supported by third-party company profiles and by the way later reporting covers the business: the core stack now spans shared bikes, shared e-bikes, carpooling, ride-hailing, taxi aggregation, car rental, battery swapping, and a Robotaxi initiative. This matters because later valuation or strategy questions should be anchored on a multi-line mobility ecosystem, not on a single micromobility SKU. The scale narrative has also changed materially over time. Yicai reported more than 300 million registered users and operations in 360-plus Chinese cities by early 2020, while today’s official company profile claims the platform has moved past 800 million registered users. That combination of official claims and historical milestones makes the user-base growth direction credible even though audited monetization disclosures remain missing.'
