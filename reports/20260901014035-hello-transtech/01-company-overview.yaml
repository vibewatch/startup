- id: expansion-from-bikes-to-broader-mobility
  title: Expansion from bikes to broader mobility
  body: Hello’s original wedge was execution, not brand flash. Independent coverage from 2018 consistently shows Hellobike winning by concentrating on China’s second- and third-tier cities while Mobike and Ofo fought a more expensive top-tier battle. Surviving that shakeout mattered because it created the user base and operating know-how that later funded adjacency moves. By 2019 Hello had entered carpooling and ride-hailing, and by 2020 it was already deepening the platform with an e-bike battery-swapping venture alongside CATL and Ant. In 2021 the company launched smart electric bicycles, and in 2022 it rebranded away from a bike-centric identity. The international HelloRide arm is now a meaningful proof point that the operating model can travel, even if on a smaller scale than the mainland core. Singapore is the clearest evidence because it moved from market entry in 2022 to 20,000 licensed bikes in 2025 and 25,000 in 2026. Hong Kong and Australia add visibility but also a reminder that this category remains operationally difficult outside mainland China. Overall, the company’s history looks less like random adjacency sprawl and more like a deliberate broadening from two-wheel urban transport into a fuller local-mobility stack.
