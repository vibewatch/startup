- id: founders-capital-and-private-status
  title: Founders, capital, and private-company status
  body: 'The public leadership picture is founder-led rather than institutionally transparent. TipRanks, Wikipedia, and legacy media reporting consistently name Yang Lei as CEO and place Han Mei, Li Kaizhu, and Jiang Wei in the founding or early-executive group. That provides enough confidence to discuss founder continuity, but not enough to treat governance as fully transparent: the reviewed public record does not surface a current detailed board-rights map, audited stand-alone accounts, or a clean cap-table update. Ownership is also better described in directional rather than definitive terms. Multiple current sources still repeat the view that Ant Group is Hello’s largest shareholder at roughly 36%, and Hello’s early ecosystem integration with Sesame Credit shows why that relationship mattered strategically. But investors should separate “widely cited” from “fully re-verified”; the figure traces back to older prospectus-era reporting, and current public materials do not provide a refreshed ownership table. The private-status point is clearer. Caixin shows Hello formally withdrew its U.S. IPO in 2021 during Beijing’s overseas-listing crackdown, and nothing in the reviewed 2025-2026 evidence suggests a completed listing since then. Hello therefore remains private, strategically connected, and still relatively opaque.'
