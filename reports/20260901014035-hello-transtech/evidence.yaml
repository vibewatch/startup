      investment.
    whyItMatters: Later-stage valuation and dilution cannot be underwritten from strategic-announcement headlines alone.
    diligencePath: >-
      Obtain management materials or paid-database screenshots that disclose the latest round size, post-money
      valuation, and cap-table impact.
    relatedQuestionRefs:
      - QO024
