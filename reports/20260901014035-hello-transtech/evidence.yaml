evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: ownership
    missingEvidence: >-
      A current cap table or refreshed shareholder disclosure showing Ant, Alibaba, founder, and employee ownership by
      legal entity.
    whyItMatters: >-
      Ownership concentration and control rights matter for governance, strategic flexibility, and any eventual
      liquidity path.
    diligencePath: >-
      Request the latest shareholder register, board-rights summary, and any side letters covering Alibaba, Ant, or CATL
      strategic rights.
    relatedQuestionRefs:
      - QO022
      - QO025
    relatedTableRefs:
      - TO003
