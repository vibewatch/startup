  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: hello-specific sam
    missingEvidence: City-by-city ride volume, active riders, pass mix, and take-rate disclosure for Hello’s core bike and e-bike business.
    whyItMatters: Without city-level operating data, public sources can show demand direction but not a real serviceable-addressable-market estimate for Hello itself.
    diligencePath: Request management dashboards by city showing MAUs, rides, ARPU, pass penetration, and fleet utilization.
    relatedQuestionRefs:
    - QM024
    - QM025
    relatedTableRefs:
    - TM002
    - TM004
  - type: private-evidence-only
    severity: material
    topic: battery-swap economics
    missingEvidence: Station count, utilization, attach rate, and gross-margin data for the battery-swap business.
    whyItMatters: Battery swap is a major adjacency claim, but investors cannot tell whether it expands profitability or only capex.
    diligencePath: Request swap-network operating metrics, contribution margin, and regional rollout plans.
    relatedQuestionRefs:
    - QM019
  - type: missing-source
    severity: minor
    topic: pricing cohort data
    missingEvidence: Reliable cohort data on pay-as-you-go versus subscription usage, churn, and retention by rider segment.
    whyItMatters: Packaging indicates segmentation, but the revenue mix behind those packages is not public.
    diligencePath: Ask for cohort retention and pass-conversion analysis by city and product mode.
    relatedQuestionRefs:
    - QM015
    relatedTableRefs:
    - TM003
  - type: missing-source
    severity: minor
    topic: municipal cap data
