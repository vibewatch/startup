  - - 450M+ electric two-wheeler installed base
    - Positive
    - Current
    - Creates a huge adjacent energy and upgrade market
    - Test which share can convert into swap or rental use
  - - Green transport and intelligent-mobility policy
    - Positive
    - Medium term
    - Supports infrastructure and intelligent-driving experimentation
    - Map which city policies help versus constrain fleet growth
  - - Municipal parking zones and fleet caps
    - Negative
    - Current
    - Limit unit growth and raise operational discipline requirements
    - Obtain city-level cap tables and penalty economics
  - - Post-bubble profitability focus
    - Mixed
    - Current
    - Encourages sustainable pricing but reduces subsidy-fueled growth
    - Request unit economics by bike, e-bike, and pass cohort
  - - Battery-swap and robotaxi capex burden
    - Negative
    - Medium term
    - Adjacencies widen TAM but can dilute returns
    - Separate core micro-mobility returns from adjacency investment needs
  notes: The market is no longer constrained mainly by user awareness; it is constrained by regulation, operations, and whether adjacent services clear return thresholds.
