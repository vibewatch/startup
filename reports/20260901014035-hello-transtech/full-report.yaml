      - number: '7.3'
        title: Partner, dependency, and channel-concentration risk
        blocks:
          - type: paragraph
            body: >-
              Hello’s third risk layer is dependency. The company’s most ambitious adjacencies are not clearly
              self-contained. Battery swap and robotaxi development depend on CATL, Ant Group, and Alibaba-linked
              support in capital, batteries, privacy/security know-how, and cloud or model infrastructure. That
              strategic backing is valuable, but it also means some of Hello’s future-option value rests on continued
              commitment from counterparties whose priorities can change. The CATL and Yicai materials make the
              dependency concrete rather than theoretical: CATL supplies batteries and technical support to Hello
              Robotaxi, while Ant and Alibaba are tied to capital formation, security/privacy, AI tooling, and
              computing-power collaboration. International evidence introduces a second form of dependence. Singapore
              growth, Logan deployment, Ryde perks, and Razer campaigns all show that expansion often travels through
              municipal approvals, partner bundles, or campaign-led channels rather than audited, stand-alone demand
              disclosures. Those references prove traction, but they also reveal concentration around a few cities and
              counterparties. The same logic applies inside China where merchant or franchise-style operating layers can
              become a control weakness, as shown by the 3·15 incident. In other words, partner leverage is real, but so
              is partner fragility.
            claimRefs:
              - CR021
              - CR022
