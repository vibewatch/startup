      - number: '8.2'
        title: Financing and private-market context
        blocks:
          - type: paragraph
            body: >-
              The private-market valuation story has two visible anchors. First, CB Insights shows Hello has raised
              about $2.701B in disclosed funding and was still at a Corporate Minority - IV stage as of its latest round
              dated September 18, 2025. Second, Failory’s 2026 Shanghai unicorn list places Hello at $6B. Those two
              datapoints support a still-relevant late-stage private company with continuing strategic capital access,
              but they do not produce clean price discovery on their own. CB Insights also notes that the last explicit
              historical valuation shown on its page is $5B from December 2018. In one sense, that is encouraging: the
              implied step-up to $6B is moderate rather than euphoric, despite a much broader business mix today. In
              another sense, it highlights the core problem. The later marks appear to come through strategic or
              corporate participation rather than broad, fully transparent public-market testing. That means outside
              investors still lack enough evidence on term stack, liquidation preferences, secondary liquidity, and
              current economics to call the present mark decisively cheap.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV036
              - CV037
      - number: '8.3'
        title: Public comparables and sensitivity
        blocks:
          - type: paragraph
            body: >-
              Public comparables do not give a precise fair value for Hello, but they do set useful boundaries. Meituan,
              the closest large Chinese local-services platform, carries roughly $62B of market capitalization and about
              $56B of trailing revenue on the reviewed data sources, or about 1.1x revenue. Didi, which is a better risk
              analogue for multi-line Chinese mobility and still reports bike/e-bike sharing, energy, and
              autonomous-driving adjacencies in its 20-F, trades closer to roughly 0.5x revenue on current market-data
              pages. That spread tells us two things. First, public markets are willing to pay for density and platform
              breadth, but not at unlimited multiples when regulation, pricing pressure, and new-initiative spending
              remain intense. Second, Hello’s ~$6B private mark almost certainly embeds a premium to public mobility
              comps. That premium may be justifiable if Hello’s actual revenue is already several billions and if
              battery-swap and robotaxi optionality deserve real credit. But because those inputs are not publicly
              auditable today, the better use of comparables is not to force false precision; it is to show what revenue
              base or execution proof would be needed to make the mark comfortable.
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV038
              - CV039
          - type: table
            tableRef: TV004
