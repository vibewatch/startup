      - number: '7.4'
        title: Financial opacity, people risk, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              The last layer is a blend of financial opacity and execution breadth. Public evidence supports large scale
              and a still-expanding set of services, but it does not provide enough current data on burn, cash,
              liability structure, paid-user retention, or post-incident remediation to underwrite the company like a
              transparent public issuer. The withdrawn 2021 U.S. IPO is a reminder that financing paths can be reshaped
              by policy, while today’s public materials still say much more about registrations, fleets, and ecosystem
              ambition than about city-level profitability or cohort durability. That matters because Hello is trying to
              coordinate bikes, carpooling, ride-hailing, battery swap, rental, and robotaxi at once. Each line adds its
              own compliance, pricing, staffing, maintenance, and crisis-response burden. Investors should therefore
              monitor not only topline adoption but also the measurable kill criteria underneath it: whether 3·15
              remediation produces auditable closures rather than apologies; whether labor, privacy, or pricing
              oversight turns into direct sanctions; whether partner-heavy projects such as robotaxi absorb capital
              faster than they mature; and whether customer-service friction worsens as monetization tightens. The
              thesis is investable only if the company can prove that governance quality is rising at least as fast as
              scope.
            claimRefs:
