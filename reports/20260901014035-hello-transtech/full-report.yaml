  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and competitor classes
        blocks:
          - type: paragraph
            body: >-
              Hello competes in layers rather than against one neat peer list. The direct micromobility field is the
              now-familiar trio of Hello, Meituan Bike, and Didi Qingju, a structure multiple consumer and industry
              sources still describe today. But the economically important distinction is that only one of those
              operators is still mostly judged as a private mobility specialist. Meituan and Didi sit inside much
              broader public-company ecosystems with stronger disclosure, more cross-subsidy options, and much more
              daily app traffic. That means the real alternative classes include direct bike-share peers, super-app
              incumbents, ride-hailing adjacencies, and historical cautionary examples such as Ofo. The market’s
              post-shakeout structure matters because Hello is no longer fighting dozens of startups for raw bike
              deployment; it is fighting a smaller number of much larger ecosystems that can use shared bikes as a
              retention, traffic, and local-services layer rather than a stand-alone business.
            claimRefs:
