  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and recommendation
        blocks:
          - type: paragraph
            body: >-
              Hello is easy to like at the company-quality level. Official, analyst, and reporting sources consistently
              describe a large local-mobility platform that survived China’s bike-sharing wars, expanded into
              ride-hailing, battery swap, and robotaxi, and retained strategic backing from Alibaba-linked entities, Ant
              Group, and CATL. That combination gives the company real scale, adjacency optionality, and a financing
              cushion that many pure micromobility operators never had. But the valuation call has to be
              price-sensitive, not admiration-driven. The same public record also shows 2026 bike-price increases, 3·15
              enforcement over rental e-bike compliance, privacy and labor obligations that are tightening rather than
              easing, and limited direct visibility into present revenue, margins, and cash burn. Those factors do not
              invalidate the company; they mainly cap conviction. The correct recommendation on public evidence is
              therefore TRACK / selective diligence, not outright buy. At a clear discount to the current third-party
              mark or with access to stronger private operating data, the call could improve. At or above ~$6B without
              deeper disclosure, investors are paying for ambition and strategic optionality that are only partly proven
              in public.
            claimRefs:
              - CV019
              - CV020
              - CV021
              - CV022
              - CV023
