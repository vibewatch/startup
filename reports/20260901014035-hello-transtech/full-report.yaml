        title: Revenue model and packaging
        blocks:
          - type: paragraph
            body: >-
              Hello’s revenue model is visibly broader than a simple dockless-bike fare meter, but the public record
              still leaves the mix opaque. Official company materials and older expansion reporting show monetizable
              activity in shared bikes, shared e-bikes, ride-hailing or carpooling, battery swapping, and now
              robotaxi-related commercialization. The most concrete public pricing evidence sits at the edge of the
              business rather than in consolidated accounts: current HelloRide pages show passes and rider packages, and
              36Kr’s 2026 pricing report shows the logic of the domestic bike business through actual fare changes and
              membership upsell. That matters because the public evidence supports a business built from many low-ticket
              transactions, recurring ride passes, and partner-side monetization rather than from one clean software
              subscription. What it does not support is a precise revenue bridge across those lines. Investors can
              describe the mechanism with confidence, but not the current line-by-line mix or realized margin by
