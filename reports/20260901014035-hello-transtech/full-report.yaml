      - number: '1.4'
        title: Robotaxi pivot and diligence frame
        blocks:
          - type: paragraph
            body: >-
              The most consequential current milestone is the 2025-2026 Robotaxi push. Yicai, CarNewsChina, SCMP, Yahoo
              Finance, Gasgoo, CATL, and Automotive World all support the view that Hello is no longer only
              experimenting at the edge of autonomy; it formed Shanghai Zaofu Intelligent Technology with Ant and CATL
              in June 2025, unveiled the Hello Robot1 vehicle in September 2025, brought Alibaba in as a strategic
              investor the same month, and started demonstration operations in Liyang in October. By late 2025 the
              venture was already talking about production timing and 2027 deployment targets that are large enough to
              matter strategically. Still, the right diligence frame is cautious rather than celebratory. These are
              credible milestones, but they do not substitute for audited economics, clear board rights, or a fully
              verified current valuation. The adverse read is therefore straightforward: Hello has proven strategic
              relevance and partner access, yet remains a founder-centric private company whose most ambitious new
              business line is capital intensive, technically complex, and only early in commercialization.
