      - number: '7.2'
        title: Operational, pricing, and safety risk
        blocks:
          - type: paragraph
            body: >-
              The second risk layer is operational and stems from the uncomfortable economics of low-ticket, asset-heavy
              urban mobility. Multiple 2026 Chinese business outlets reported that Hello, Meituan, and Qingju all
              shifted bike pricing upward while extending included riding time, a pattern that reads more like
              unit-economics repair than unconstrained pricing power. For frequent short-trip commuters, those changes
              can still raise effective spend even if the headline package looks more generous. The same reporting ties
              price moves to replacement cycles, material costs, dispatch labor, and quota-constrained fleets, which
              means margin pressure does not disappear simply because demand exists. Operational fragility also remains
              visible at the product layer. HelloRide’s own help and insurance pages document a fairly complex support
              stack around damaged bikes, parking violations, claims, payments, and accident handling, while app-store
              feedback still flags availability problems, pricing confusion, relocation charges, and support friction.
              Those annoyances matter because switching costs in urban micro-mobility are low. The 3·15 rental-e-bike
              episode shows that safety problems can quickly evolve from isolated merchant abuse into brand-level
              scrutiny. Robotaxi expansion raises the bar further by adding another safety-critical fleet category, a
              separate permit track, and a different technical failure mode set from traditional bike sharing.
