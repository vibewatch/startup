      - number: '2.3'
        title: Buyers, users, payers, and packaging
        blocks:
          - type: paragraph
            body: >-
              The buyer map is more varied than a casual mobility app screen suggests. The user is often a commuter,
              tourist, or short-trip rider choosing speed and affordability over walking or waiting. The payer can be
              that rider through pay-as-you-go pricing or subscription passes, but it can also be a brand partner buying
              fleet-media exposure, an event organizer paying for deployment support, or a fleet or energy operator
              paying for the infrastructure layer around batteries and vehicles. Current HelloRide product pages are
              especially helpful here because they surface explicit segmentation: daily commuter passes,
              tourist-oriented short passes, premium memberships, and market-by-market packaging differences across Hong
              Kong, Singapore, and Australia. Consumer guides reinforce that pricing is deliberately low-friction, while
              parking rules and in-app payment keep usage inside a high-frequency, low-ticket pattern. DiDi’s own
              investor-relations framing supports the broader category logic as well, because one of Hello’s largest
              peers now openly describes shared mobility, energy, and vehicle services as parts of one connected
              ecosystem. In practice, this is a multi-sided market where frequency, trust, and retention matter more
              than one-time ticket size.
            claimRefs:
