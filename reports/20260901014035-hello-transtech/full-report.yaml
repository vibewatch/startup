  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Customer workflow and service definition
        blocks:
          - type: paragraph
            body: >-
              Hello’s product is best understood from the rider’s task flow outward. The public workflow is not just
              “scan a bike and go.” Current HelloRide materials show a repeatable operating sequence: find a nearby bike
              or e-bike, scan a QR code or enter a vehicle number, unlock, optionally pause mid-journey, ride inside
              allowed areas, return the vehicle to a valid zone, then complete payment. That design means the real
              product includes app logic, location awareness, rule enforcement, payments, and post-ride support rather
              than only metal and wheels. The help-center materials and independent rider guides both reinforce this
              point by highlighting service-zone boundaries, P-zone parking, ride-end validation, relocation fees, and
              issue reporting. Put differently, Hello sells a controlled urban-mobility workflow, not only a vehicle.
              The workflow is deliberately optimized for commuter and casual urban use, but it also has enough software
              policy built around it that many of the key customer experiences—good or bad—happen in the app rather than
              on the bike frame.
