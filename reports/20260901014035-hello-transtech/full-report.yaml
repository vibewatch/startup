  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Hello should be analyzed inside the urban short-trip mobility stack, not as a single dockless-bike
              operator and not as a claim on all transportation spending. The company’s own materials, combined with
              current pricing and product pages, show a market that includes shared bikes, shared e-bikes,
              short-duration ride passes, some four-wheel trip aggregation, battery-swap services, and even secondary
              monetization through partnerships and advertising. But the same sources also show what belongs outside the
              boundary: long-distance transport, personal vehicle ownership, and generic autonomous-driving software R&D
              without a trip-access or fleet-operations component. This narrower definition matters because the real
              substitute set is everyday and local: walking, metro access, buses, private e-bikes, taxis, ride-hailing,
              and, in some cities, simply enduring the inconvenience of the last kilometre. Multiple consumer guides and
              market summaries converge on the same core use case: shared bikes win when the trip is too far to walk
              comfortably, too short to justify a car or taxi, and too time-sensitive for uncertain feeder transit.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM022
              - CM025
              - CM030
