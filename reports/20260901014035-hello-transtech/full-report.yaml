  - id: TV005
    title: Thesis-break and kill triggers table
    summary: Monitorable events that should force valuation or conviction resets.
    sourceRefs:
      - SV015
      - SV020
      - SV021
      - SV022
      - SV023
    claimRefs:
      - CV035
      - CV040
