      - number: '2.2'
        title: Sizing lenses and market shape
        blocks:
          - type: paragraph
            body: >-
              A disciplined sizing view has to combine several non-equivalent lenses. Statista treats bike-sharing and
              ride-hailing as separate B2C categories and explicitly uses bottom-up methodologies based on bookings and
              revenue rather than a pure story-stock TAM. TechNode provides a useful historical anchor, showing how
              China’s shared-bike market grew rapidly before consolidating, while Yicai’s user and city counts show that
              Hello had already reached national footprint scale by 2020. The biggest structural lens comes from the
              electric-two-wheeler base: National Business Daily says China’s social ownership has passed 450 million
              units and the category has shifted from raw unit growth into stock replacement, technology competition,
              and international expansion. Those facts matter because Hello’s largest realistic monetization base still
              sits in short-distance mobility and adjacent two-wheel infrastructure, not in fully autonomous fleets.
              Robotaxi is relevant, but as an option layer rather than the core current TAM. The honest output is
              therefore a multi-lens market map: huge demand reservoirs, meaningful serviceable categories, and
              still-incomplete company-specific monetization boundaries.
            claimRefs:
