            tableRef: TV003
            claimRefs:
              - CV031
              - CV032
              - CV033
              - CV034
          - type: figure
            figureRef: FV003
            claimRefs:
              - CV031
              - CV032
              - CV033
              - CV034
      - number: '8.5'
        title: Final diligence and thesis-breaks
        blocks:
          - type: paragraph
            body: >-
              The remaining question is what would move this from trackable to investable. The first answer is better
              core economics: current revenue, contribution margin by business line, cash runway, and the actual effect
              of 2026 pricing changes on frequency and retention. The second is cleaner governance proof: post-3·15
              remediation data, privacy controls, labor exposure mapping, and any city-level enforcement history. The
              third is cap-table clarity and exit mechanics: secondary liquidity, preference stack, anti-dilution
              provisions, and whether strategic holders or related parties shape the next price mark. Investors should
              also be disciplined about thesis-break triggers. Another material safety scandal, meaningful privacy or
              labor enforcement, partner pullback from CATL/Alibaba/Ant, or repeated evidence that pricing needs to rise
              faster than quality improves would all justify a lower multiple. Conversely, auditable proof of healthy
              core mobility margins plus milestone-based commercialization in adjacencies would justify moving closer to
              the bull case. Until that evidence arrives, the right behavior is curiosity with price discipline.
            claimRefs:
              - CV035
              - CV040
              - CV041
              - CV042
