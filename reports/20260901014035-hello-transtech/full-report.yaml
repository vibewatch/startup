chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and platform scope
        blocks:
          - type: paragraph
            body: >-
              Hello’s identity is materially broader than the old Hellobike label suggests. The company’s own current
              overview describes a Shanghai-headquartered business founded in September 2016 that now calls itself a
              local mobility and lifestyle-services platform rather than simply a dockless-bike operator. That framing
              is supported by third-party company profiles and by the way later reporting covers the business: the core
              stack now spans shared bikes, shared e-bikes, carpooling, ride-hailing, taxi aggregation, car rental,
              battery swapping, and a Robotaxi initiative. This matters because later valuation or strategy questions
              should be anchored on a multi-line mobility ecosystem, not on a single micromobility SKU. The scale
              narrative has also changed materially over time. Yicai reported more than 300 million registered users and
              operations in 360-plus Chinese cities by early 2020, while today’s official company profile claims the
              platform has moved past 800 million registered users. That combination of official claims and historical
              milestones makes the user-base growth direction credible even though audited monetization disclosures
              remain missing.
