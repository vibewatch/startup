      - number: '2.4'
        title: Drivers, constraints, and open sizing work
        blocks:
          - type: paragraph
            body: >-
              The strongest demand drivers are easy to identify: dense cities, congestion, high smartphone adoption,
              Alipay-scale digital payments, green-transport policy, and an enormous installed base of two-wheel
              vehicles that can be upgraded, rented, charged, or swapped more intelligently. But the constraint set is
              equally real. The shared-bike market is no longer a hyperscaling subsidy story; it is a regulated
              operations market. TechNode and the consumer guides both emphasize designated parking, higher pricing,
              more disciplined fleets, and a shift toward profitability. National policy documents add another nuance:
              Beijing is promoting green transport and intelligent mobility while also cracking down on disorderly
              competition in batteries and NEVs. That means tailwinds and friction are arriving together. The
              battery-swap and robotaxi adjacencies are attractive because they widen the monetization surface, yet they
              also require more capex, more regulatory approvals, and more partner coordination. The key unresolved
              problem is still Hello-specific: public sources do not isolate a verified SAM or SOM by city, mode, or
              buyer segment. A serious underwriting model still needs bottom-up city caps, ride frequency, pass mix, and
              take-rate assumptions that are not publicly disclosed.
            claimRefs:
