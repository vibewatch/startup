  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked regulatory and legal risk
        blocks:
          - type: paragraph
            body: >-
              Hello’s most important risk category is regulatory because the company now sits at the intersection of
              several Chinese policy regimes at once: local mobility operations, location-heavy data handling, gig-style
              labor, rental-e-bike safety, and autonomous-driving commercialization. The official company product map is
              broad enough that the compliance surface is no longer confined to bike parking or basic vehicle
              maintenance. China’s personal-information regime is especially relevant because a mobility super-app
              inevitably processes routes, whereabouts, payment, and behavioral data; the 2026 Chambers guide and the
              PIPL make clear that tracks and whereabouts fall into sensitive information territory, raising the bar for
              lawful processing, impact assessment, and incident response. April 2026 labor rules add a second layer by
              requiring minimum-pay floors, hours controls, algorithm transparency, and written agreements or employment
              contracts where applicable. The March 2026 3·15 exposure is the clearest proof that enforcement is not
              abstract. Hello-branded rental e-bike operations were publicly tied to overspeeding, plate arbitrage, and
              oversized batteries, after which Shanghai regulators opened on-site investigations and Hello acknowledged
              review or management gaps. That combination of broad exposure and demonstrated enforcement is why
              legal/compliance failure ranks above pure market risk.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
