- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact
  - Exact diligence path
  rows:
  - - Revenue mix by business line
    - Cannot value the business on comparable terms
    - Request audited segment revenue split across bikes, four-wheel, battery swap, and robotaxi
  - - Gross margin and contribution margin
    - Cannot judge whether pricing power exceeds operating burden
    - Request margin bridges by product and city
  - - Cash burn and runway
    - Cannot size financing urgency
    - Request monthly cash flow, restricted cash, and forward capex plan
  - - Debt and project-finance obligations
    - Cannot assess downside or covenant risk
    - Request debt schedule, collateral, guarantees, and maturity ladder
  - - Membership retention and pass economics
    - Cannot judge quality of recurring revenue
    - Request cohort renewal, discounting, and pass-conversion analysis
  - - Partner concentration
    - Cannot gauge bargaining power risk
    - Request revenue and dependency split by top partners / investors
  notes: These are not cosmetic asks; each one directly changes what valuation methods are defensible.
