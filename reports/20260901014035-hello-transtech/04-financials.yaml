company:
  name: Hello TransTech
chapter:
  number: 4
  title: Financials
summary: 'Hello’s financial story is easiest to understand as a scale-and-capital story, not an audited-profit story. Public sources support a multi-line revenue model spanning rides, passes, four-wheel services, battery swap, and emerging robotaxi commercialization; they also support roughly $2.7 billion of cumulative funding, a fresh 2025 strategic investment from Alibaba for robotaxi, and a CNY3 billion robotaxi JV with Ant and CATL. But open sources still do not provide the metrics that determine quality of earnings: revenue mix, gross margin, debt, burn, runway, or consolidated profitability. The best conclusion is that Hello looks commercially large and repeatedly fundable, while remaining too opaque for precise underwriting from public evidence alone.'
sections:
- id: revenue-model-and-packaging
  title: Revenue model and packaging
  body: 'Hello’s revenue model is visibly broader than a simple dockless-bike fare meter, but the public record still leaves the mix opaque. Official company materials and older expansion reporting show monetizable activity in shared bikes, shared e-bikes, ride-hailing or carpooling, battery swapping, and now robotaxi-related commercialization. The most concrete public pricing evidence sits at the edge of the business rather than in consolidated accounts: current HelloRide pages show passes and rider packages, and 36Kr’s 2026 pricing report shows the logic of the domestic bike business through actual fare changes and membership upsell. That matters because the public evidence supports a business built from many low-ticket transactions, recurring ride passes, and partner-side monetization rather than from one clean software subscription. What it does not support is a precise revenue bridge across those lines. Investors can describe the mechanism with confidence, but not the current line-by-line mix or realized margin by product.'
