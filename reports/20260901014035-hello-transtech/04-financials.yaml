- id: TI004
  title: Capital adequacy table
  columns:
  - Item
  - Public anchor
  - Current read
  - Implication
  - Diligence ask
  rows:
  - - Historical fundraising
    - CB Insights ~$2.701B total
    - Substantial capital already consumed or deployed
    - Model is not capital-light
    - Request full cap table and cash bridge
  - - Latest strategic capital
    - Alibaba strategic investment in robotaxi (Sept 2025)
    - Fresh capital support exists
    - Partner backing continues to matter
    - Request amount, structure, and use of proceeds
  - - Robotaxi JV commitment
    - CNY3B initial investment with Ant and CATL
    - New capital program for autonomy
    - Raises execution and funding needs
    - Show entity-level budget and draw schedule
  - - Cash on hand
    - 'null'
    - Unknown
    - Runway cannot be estimated publicly
    - Provide cash, restricted cash, and credit lines
  - - Debt / project finance
    - 'null'
    - Unknown
    - Balance-sheet risk cannot be sized
    - Provide debt schedule, maturities, and covenants
  - - Next-round trigger
    - 'null'
    - Likely tied to growth and capex plans
    - Capital access may remain strategic-partner-shaped
    - Explain base case, downside case, and covenant triggers
  notes: Capital adequacy is the largest financial blind spot after revenue quality.
