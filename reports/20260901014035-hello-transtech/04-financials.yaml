- id: cost-structure-and-capital-needs
  title: Cost structure and capital needs
  body: The core economics remain capital intensive. Shared mobility requires vehicles, maintenance, repositioning, parking compliance, payments, support, and safety operations before any talk of adjacency. Battery swapping adds physical infrastructure and servicing complexity. Robotaxi increases the burden again through JV funding, partner integration, and likely higher hardware and software support requirements. None of that means the company cannot eventually produce attractive returns; it means the burden of proof belongs on utilization, pricing discipline, and partner-backed financing. Public sources are useful here because they reveal repeated strategic-capital injections rather than one self-funding engine. CB Insights records substantial historical capital raised, EqualOcean’s 2020 analysis already described heavy earlier fundraising, and 2025 reporting makes clear that new robotaxi work came with a fresh capital program instead of springing from disclosed free cash flow. That is the signature of a business with real scale and real optionality, but still meaningful financing dependency.
  claimRefs:
  - CI009
  - CI010
  - CI011
  - CI012
  - CI013
