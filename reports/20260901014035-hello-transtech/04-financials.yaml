- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current value / status
  - Quality
  - Diligence ask
  rows:
  - - Shared bike and e-bike rides
    - Unlock plus time-based usage fees
    - Per ride / minute window
    - Clearly active; exact revenue undisclosed
    - High mechanism confidence, low financial precision
    - Break out rides, ARPU, and take rate by mode
  - - Ride passes and memberships
    - Weekly / monthly / tourist packages
    - Per subscriber / pass
    - Visible on current rider-facing pages
    - Mechanism confirmed, attach rate unknown
    - Show pass penetration and renewal by city
  - - Ride-hailing / carpooling
    - Trip commissions or service fees
    - Per trip
    - Historically launched; current mix undisclosed
    - Real product evidence, thin current economics
    - Provide GMV and take rate by four-wheel line
  - - Battery swap and energy services
    - Swap or subscription fees
    - Per swap / subscription
    - Business exists; economics opaque
    - Strategically relevant but under-disclosed
    - Provide station count, utilization, and margin
  - - Partnerships / advertising / activations
    - Brand or event payments tied to fleets
    - Per campaign / package
    - Visible in HelloRide partnership pages
    - Likely incremental rather than core
    - Show annual revenue and gross margin by partner line
  - - Robotaxi commercialization
    - Strategic JV / future operating contracts
    - Per program / fleet
    - Commercialization funded, revenue immaterial or undisclosed
    - Optionality high, current monetization weakly visible
    - Provide pilot revenue and expected deployment economics
  notes: The public record is strongest on mechanism and weakest on mix, realized pricing, and margin by line.
