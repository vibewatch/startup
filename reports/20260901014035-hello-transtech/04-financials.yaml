  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: runway and debt visibility
    missingEvidence: Cash on hand, debt maturities, project-finance obligations, and monthly burn at the parent and key subsidiary levels.
    whyItMatters: Without those numbers, investors cannot distinguish a well-funded operator from a frequently refinanced one.
    diligencePath: Request cash bridge, debt schedule, covenant package, and 12-18 month base/downside runway model.
    relatedQuestionRefs:
    - QI023
    - QI024
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: unit economics by line
    missingEvidence: Gross margin, contribution margin, ARPU, pass-conversion, and cohort retention for bikes, e-bikes, battery swap, and four-wheel services.
    whyItMatters: Revenue breadth only matters if at least some lines generate durable cash contribution.
    diligencePath: Request city-level unit-economics and cohort dashboards by business line.
    relatedQuestionRefs:
    - QI002
    - QI021
    - QI022
    relatedTableRefs:
    - TI001
    - TI003
    - TI005
  - type: missing-source
    severity: minor
    topic: realized domestic pricing books
    missingEvidence: A clean current domestic Hello pricing page showing standard fares and memberships across major Chinese cities.
    whyItMatters: Open sources show current price changes, but not a standardized domestic price book from Hello itself.
    diligencePath: Capture current in-app price cards across representative cities or request internal rate-card exports.
    relatedQuestionRefs:
    - QI004
    relatedTableRefs:
    - TI002
