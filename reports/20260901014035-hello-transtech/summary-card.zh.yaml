  topStrengths:
    - Hello 是中国共享单车洗牌后少数成规模活下来的平台之一，如今已覆盖多个出行品类。
    - Ant Group、Alibaba 关联实体和 CATL 等战略股东，支撑其相关性、融资通道和相邻业务扩张。
    - 公开证据显示其用户触达异常广，包括 800M+ 注册用户，以及可见的国际 HelloRide 扩张。
    - >-
      Battery-swap and robotaxi initiatives provide real optionality beyond core bike sharing. 换电和 robotaxi
      动作为核心共享单车之外提供了真实可选项。
  topRisks:
    - 当前公开证据未充分披露收入、贡献利润率、现金跑道或股权结构优先权。
    - 2026 年 3 月 3·15 租赁电动车曝光显示，治理和商户控制失灵会直接变成估值风险。
    - 隐私、用工、牌照和城市管理规则，都会抬高规模化中国出行平台的成本和折现率。
    - 2026 年单车涨价说明核心业务仍需主动修复 monetization，而不是自然拥有定价权。
    - >-
      Exit timing remains uncertain after the 2021 IPO withdrawal and the still-selective 2026 Asia liquidity backdrop.
      2021 年 IPO 撤回后，叠加 2026 年亚洲流动性仍有选择性，退出时点依旧不确定。
  unresolvedGaps:
    - 当前分业务收入、按城市 / 产品划分的贡献利润率，以及现金跑道尚未公开披露。
