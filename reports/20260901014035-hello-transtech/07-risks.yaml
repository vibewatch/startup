- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - 3·15 remediation failure
    - Public remediation disclosure
    - No auditable vehicle removals, merchant exits, or control upgrades within two quarters
    - Assume governance is weaker than management messaging; downgrade conviction materially.
  - - Privacy enforcement
    - Penalty / order / mandated rectification
    - Material data-related enforcement action involving core mobility or identity flows
    - Re-cut regulatory risk premium and demand detailed compliance evidence before new capital.
  - - Labor-cost shock
    - Implementation of 2026 worker rules
    - Evidence that cost to serve rises without matching yield or efficiency gains
    - Lower margin assumptions and test downside funding need.
  - - Core-bike unit economics
    - Price / quality tradeoff
    - Repeated price hikes alongside worsening complaint signals or utilization slippage
    - Treat core moat as weaker; haircut long-term cash-generation thesis.
  - - Partner concentration
    - Strategic-support change
    - CATL / Ant / Alibaba visibly slow, narrow, or reprice support
    - Reduce value assigned to battery-swap and robotaxi adjacencies.
  - - Robotaxi execution
    - Milestone slippage
    - Meaningful miss versus production, deployment, or safety milestones without credible explanation
    - Move AV optionality toward zero in base case.
  notes: These triggers are designed to be observed from diligence materials or future public reporting rather than inferred from sentiment alone.
