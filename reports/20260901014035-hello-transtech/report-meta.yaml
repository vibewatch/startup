companyProfile:
  summary: >-
    Hello TransTech, formerly Hellobike / Hello Chuxing, is a Shanghai-founded mobility platform
    that expanded from lower-tier-city bike sharing into a broader local-transport stack covering
    shared bikes, shared e-bikes, ride-hailing, carpooling, battery swap, rental, and robotaxi.
    Public sources support more than 800 million registered users, strategic ownership or backing
    from Ant Group, Alibaba-linked entities, and CATL, and growing but still early adjacencies in
    battery infrastructure and autonomous driving. Hello remains private after withdrawing a U.S.
    IPO in 2021, and public financial disclosure remains much thinner than the company’s scale or
    strategic ambition.
