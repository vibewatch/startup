    ride-hailing and taxi aggregation, battery-swap services, vehicle rental, and an emerging
    robotaxi platform through Zaofu Technology.
  customerFocus: >-
    Urban commuters and local mobility users across China, with additional customer proof in
    Singapore, Hong Kong, and Australia through the HelloRide brand and partner-led deployments.
  businessModel: >-
    High-frequency transaction model built on ride unlocks and time-based usage fees, passes and
    packages, ride-hailing and carpooling monetization, battery-swap services, and partner or
    campaign-linked fleet economics.
