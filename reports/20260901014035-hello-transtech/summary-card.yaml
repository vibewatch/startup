  topStrengths:
    - >-
      Hello is one of the few scaled survivors of China’s bike-sharing shakeout and now spans multiple mobility
      categories.
    - >-
      Strategic backing from Ant Group, Alibaba-linked entities, and CATL supports relevance, capital access, and
      adjacency development.
    - >-
      Public evidence supports unusually broad user reach, including 800M+ registered users and visible international
      HelloRide expansion.
    - Battery-swap and robotaxi initiatives provide real optionality beyond core bike sharing.
  topRisks:
    - >-
      Current public evidence does not adequately disclose revenue, contribution margin, runway, or cap-table
      preferences.
    - >-
      The March 2026 3·15 rental e-bike exposure shows governance and merchant-control failures can turn into direct
      valuation risk.
    - >-
      Privacy, labor, licensing, and city-management rules raise the cost and discount rate for a scale China mobility
      platform.
    - >-
      2026 bike-price hikes suggest the core business still needs active monetization repair rather than enjoying
      effortless pricing power.
    - Exit timing remains uncertain after the 2021 IPO withdrawal and the still-selective 2026 Asia liquidity backdrop.
  unresolvedGaps:
    - Current revenue by line, contribution margin by city/product, and cash runway are not publicly disclosed.
    - Liquidation preferences, anti-dilution protections, and strategic-holder rights are not public.
    - Audited post-3·15 remediation metrics and merchant-control data are still missing.
    - Robotaxi and battery-swap economics, capex, and milestone ROI remain insufficiently public.
    - >-
      Retention, churn, and elasticity after 2026 pricing changes are not visible enough to underwrite a premium
      multiple.
