- id: direct-comparison-on-capability-and-pricing
  title: Direct comparison on capability and pricing
  body: At the user level, the three main services can look deceptively similar. Current guides still show very similar unlock economics, usually around RMB1.5 to RMB2 for an initial ride window, along with comparable QR-based access and designated-parking rules. That is exactly why distribution and packaging matter so much. Hello benefits from easy Alipay access and broad city reach, especially outside the biggest urban cores. Meituan benefits from Mobike’s legacy fleet base and the ability to live inside one of China’s biggest consumer super-apps. Didi benefits from a mobility-native demand base that already opens its app for taxis and ride-hailing, making Qingju a natural add-on rather than a separate habit. Meituan’s disclosed investor-relations surface and Didi’s SEC-filings surface do not prove their bike economics are superior, but they do show those competitors are backed by organizations with deeper public-market reporting and potentially more financing flexibility than Hello discloses.
