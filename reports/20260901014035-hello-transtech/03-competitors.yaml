company:
  name: Hello TransTech
chapter:
  number: 3
  title: Competitors
summary: 'Hello’s direct bike-share competition has narrowed to a three-player field, but the strategically important rivalry is really between ecosystems. Public and current consumer evidence supports a market led by Hello, Meituan Bike, and Didi Qingju, with Ofo surviving only as a cautionary benchmark. Hello’s edge appears to be lower-tier-city density, Alipay access, and broader local-mobility scope; Meituan’s and Didi’s edges are super-app traffic, public-company backing, and the ability to treat bikes as one layer in much bigger local-services stacks. That leaves Hello differentiated but not deeply locked in: casual switching costs remain low, while moat strength depends on operational discipline, subscription attachment, and city-level density rather than unique hardware or disclosure-led trust.'
sections:
- id: landscape-and-classes
  title: Landscape and competitor classes
  body: Hello competes in layers rather than against one neat peer list. The direct micromobility field is the now-familiar trio of Hello, Meituan Bike, and Didi Qingju, a structure multiple consumer and industry sources still describe today. But the economically important distinction is that only one of those operators is still mostly judged as a private mobility specialist. Meituan and Didi sit inside much broader public-company ecosystems with stronger disclosure, more cross-subsidy options, and much more daily app traffic. That means the real alternative classes include direct bike-share peers, super-app incumbents, ride-hailing adjacencies, and historical cautionary examples such as Ofo. The market’s post-shakeout structure matters because Hello is no longer fighting dozens of startups for raw bike deployment; it is fighting a smaller number of much larger ecosystems that can use shared bikes as a retention, traffic, and local-services layer rather than a stand-alone business.
