- id: switching-costs-and-distribution-power
  title: Switching costs and distribution power
  body: The most important competitive fact may be that casual riders are not especially loyal. Multiple rider guides imply that many users simply unlock the closest acceptable bike, which keeps casual switching costs low and makes fleet density and placement crucial. However, loyalty is not zero. Passes, memberships, and integrated payment flows can tilt economics toward staying within one ecosystem, especially for commuters who ride frequently enough to care about subscription value. This is where the super-app structure matters. Hello’s advantage is that Alipay lowers friction and has helped the brand travel into many smaller markets; Meituan and Didi enjoy similar convenience once a user is already transacting heavily inside those ecosystems. The result is a market with low hardware lock-in but meaningful distribution lock-in. Operators do not need a customer to love the bike; they need the bike to be available, the parking logic to work, and the surrounding app relationship to be sticky enough that the next ride also happens inside the same ecosystem.
