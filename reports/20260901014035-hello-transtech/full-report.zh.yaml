  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代品
        blocks:
          - type: paragraph
            body: >-
              Hello
              应放在城市短途出行栈里分析，而不是当成单一无桩单车运营商，也不是把所有交通支出都算作它的机会。公司自有材料叠加当前定价和产品页面，显示其市场包括共享单车、共享电单车、短时骑行通票、部分四轮出行聚合、换电服务，甚至通过伙伴和广告获得的二级变现。但同一批来源也说明哪些不在边界内：长途交通、个人车辆拥有，以及没有出行入口或车队运营组件的通用自动驾驶软件
              R&D。这个更窄定义很重要，因为真正的替代集合日常且本地：步行、地铁接驳、公交、私人电单车、出租车、网约车，以及在部分城市里忍受最后一公里不便。多个消费者指南和市场摘要指向同一个核心场景：当路程走起来偏远、又短到不值得叫车或打车、且时间敏感到无法等待不确定接驳时，共享单车就胜出。
