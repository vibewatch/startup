      - number: '2.3'
        title: 买方、用户、付费方与包装
        blocks:
          - type: paragraph
            body: >-
              买方地图比随手打开出行 app
              看到的界面更复杂。用户往往是通勤者、游客或短途骑行者，在速度和低价之间做选择，而不是步行或等待。付费方可以是按次计费或购买通票的骑行者，也可以是购买车队媒体曝光的品牌伙伴、为部署支持付费的活动组织者，或围绕电池和车辆基础设施付费的车队或能源运营商。当前
              HelloRide 产品页在这里特别有用，因为它露出了明确分层：日常通勤通票、游客短时通票、高级会员，以及 Hong Kong、Singapore、Australia
              不同市场的包装差异。消费者指南进一步证明，定价有意保持低摩擦；停车规则和 app 内支付则把使用锁在高频、低客单价模式里。DiDi 自己的投资者关系表述也支持更大的品类逻辑，因为 Hello
              的最大同行之一如今公开把共享出行、能源和车辆服务描述为一个连接生态的组成部分。实际运行中，这是一个多边市场；频次、信任和留存比单次票价更重要。
