companyProfile:
  summary: >-
    Hello TransTech 前身为 Hellobike / Hello Chuxing，是一家起步于上海的出行平台，从低线城市共享单车扩展为更宽的本地交通栈，覆盖共享单车、共享电单车、网约车、顺风车、换电、租赁和
    robotaxi。公开资料支持其注册用户超过 800 million，并获得 Ant Group、Alibaba 关联实体和 CATL 的战略持股或支持；换电基础设施和自动驾驶等邻近业务在增长，但仍处早期。Hello 2021
    年撤回美国 IPO 后仍为私有公司，公开财务披露远薄于其规模和战略野心。
