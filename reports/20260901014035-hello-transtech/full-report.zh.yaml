  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与平台边界
        blocks:
          - type: paragraph
            body: >-
              Hello 的身份已经明显宽过旧 Hellobike 标签。公司当前介绍称，其总部在上海，创立于 2016 年 9
              月，如今定位为本地出行与生活服务平台，而不只是无桩单车运营商。第三方公司画像和后续报道也支持这种框架：核心栈已覆盖共享单车、共享电单车、顺风车、网约车、出租车聚合、汽车租赁、换电和 Robotaxi
              项目。这个变化重要，因为后续估值或战略问题应锚定一个多条线的出行生态，而不是单一微出行 SKU。规模叙事也随时间显著变化。Yicai 报道称，到 2020 年初，Hello 注册用户超过 300
              million、覆盖中国 360 多个城市；当前官方公司资料则称平台注册用户已超过 800 million。官方口径与历史里程碑合在一起，让用户基数增长方向可信，尽管经审计的变现披露仍然缺位。
