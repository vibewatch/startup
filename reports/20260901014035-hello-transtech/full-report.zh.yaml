              注资、伙伴整合，以及可能更高的软硬件支持要求，把负担再加一层。这并不意味着公司最终不能产生有吸引力回报；它意味着举证责任落在利用率、定价纪律和伙伴支持融资上。公开来源在这里有用，因为它们显示了反复的战略资本注入，而不是一个自我供血引擎。CB
              Insights 记录了大量历史融资，EqualOcean 2020 年分析已描述过早期重融资，2025 年报道也清楚表明，新的 robotaxi
              工作伴随一套新资本计划，而不是从已披露自由现金流里自然长出。这是一个具备真实规模和真实选择权、但仍显著依赖融资的业务特征。
