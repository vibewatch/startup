      - number: '8.2'
        title: 融资与私募市场背景
        blocks:
          - type: paragraph
            body: >-
              私募市场估值故事有两个可见锚点。第一，CB Insights 显示 Hello 已披露融资约 $2.701B，最近一轮日期为 2025 年 9 月 18 日，当时仍处于 Corporate Minority -
              IV 阶段。第二，Failory 的 2026 上海独角兽榜将 Hello 估值列为 $6B。这两个数据点说明，公司仍是一家相关性很强的后期私营公司，并且继续拿得到战略资本，但它们本身不能形成干净的价格发现。CB
              Insights 还指出，其页面上最后一个明确历史估值是 2018 年 12 月的 $5B。换一个角度看，这令人鼓舞：尽管今天业务组合宽得多，隐含升至 $6B
              的幅度仍属温和，而非狂热。另一个角度看，它也暴露了核心问题。后续估值似乎更多来自战略或企业参与，而不是经过广泛、完全透明的公开市场检验。也就是说，外部投资人仍缺少足够证据来判断条款堆叠、清算优先权、老股流动性和当前经济性，也就无法断言当前估值明显便宜。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV036
              - CV037
      - number: '8.3'
        title: 公开可比公司与敏感性
        blocks:
          - type: paragraph
            body: >-
              公开可比公司不能给 Hello 精准公允价值，但能划出有用边界。最接近的大型中国本地服务平台 Meituan，在所审阅数据源中市值约 $62B，过去 12 个月收入约 $56B，约为 1.1x 收入。Didi
              更适合作为多线中国出行风险类比，公司仍在 20-F 中披露单车 / 电单车共享、能源和自动驾驶相邻业务；按当前市场数据页，它的交易倍数更接近约 0.5x
              收入。这个价差说明两件事。第一，公开市场愿意为密度和平台宽度付费，但当监管、价格压力和新业务投入依然强烈时，倍数不会无限扩张。第二，Hello 约 $6B 的私募估值几乎肯定包含了相对公开出行可比公司的溢价。如果
              Hello 的实际收入已经达到数十亿美元，并且换电和 Robotaxi
              选择权值得给实质信用，这个溢价或许合理。但由于这些输入今天无法被公开审计，可比公司的更好用法不是强行给出虚假精度，而是反推：需要什么收入基数或执行证明，才能让这个估值站得住。
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV038
              - CV039
