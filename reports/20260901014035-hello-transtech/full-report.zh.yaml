  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与建议
        blocks:
          - type: paragraph
            body: >-
              从公司质量看，Hello 很容易让人认可。官方、分析师和报道来源都一致描绘出一家大型本地出行平台：它熬过了中国共享单车大战，扩张到网约车、换电和 Robotaxi，并保留了阿里系实体、Ant Group 和
              CATL 的战略支持。这套组合给了公司真实规模、相邻业务选择权，以及许多纯微出行运营商从未拥有过的融资缓冲。但估值判断必须看价格，不能被好感驱动。同一组公开记录也显示，2026 年单车涨价、3·15
              围绕租赁电单车合规执法、隐私和劳动义务趋严而非放松，以及当期收入、利润率和现金消耗的直接可见度有限。这些因素并不否定公司，主要是压低确定性。因此，基于公开证据，正确建议是观察 /
              选择性尽调，而不是直接买入。如果价格较当前第三方估值有明显折扣，或能拿到更强的私有经营数据，判断可以上调。若缺少更深入披露还按约 $6B
              或更高价格入场，投资人买到的就是野心和战略选择权，而这些只在公开材料里被部分证明。
            claimRefs:
              - CV019
              - CV020
