        blocks:
          - type: paragraph
            body: >-
              Hello 的收入模型明显宽过简单无桩单车计价器，但公开记录仍让组合不透明。官方公司材料和较早扩张报道显示，变现活动分布在共享单车、共享电单车、网约车或顺风车、换电，以及如今 robotaxi
              相关商业化。最具体的公开定价证据位于业务边缘，而非合并账目：当前 HelloRide 页面显示通票和骑行者套餐，36Kr 的 2026 年定价报道则通过实际费率调整和会员 upsell
              展示国内单车业务逻辑。这很重要，因为公开证据支持的是一个由许多低客单交易、重复骑行通票和伙伴端变现搭成的业务，而不是单一干净的软件订阅。它不能支持的是跨业务线的精确收入桥。投资者可以有信心描述机制，但不能确定当前逐线组合或各产品的实际利润率。
