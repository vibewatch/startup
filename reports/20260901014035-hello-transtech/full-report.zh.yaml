        title: 客户工作流与服务定义
        blocks:
          - type: paragraph
            body: >-
              理解 Hello 产品，最好从骑行者任务流往外看。公开工作流不只是“扫码骑车”。当前 HelloRide 材料显示了一套可复用运营序列：找到附近单车或电单车，扫 QR
              码或输入车辆编号，解锁，中途可选择暂停，在允许区域内骑行，把车辆还到有效区域，然后完成支付。这种设计意味着，真实产品包含 app
              逻辑、位置感知、规则执行、支付和骑后支持，而不只是金属和车轮。帮助中心材料和独立骑行指南也通过强调服务区边界、P-zone 停车、还车验证、调度费和问题上报，强化了这一点。换句话说，Hello
              卖的是受控城市出行工作流，不只是一辆车。该工作流有意为通勤和休闲城市使用优化，但也嵌入足够多软件政策，许多关键客户体验——无论好坏——都发生在 app 里，而不是车架上。
