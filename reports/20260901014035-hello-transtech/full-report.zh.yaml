        - label: 市场地位
          value: 8
          score: 8
          detail: 中国出行版图足够大，也熬过了行业出清；8/10。
        - label: 产品宽度
          value: 8
          score: 8
          detail: 覆盖两轮、四轮、电池和 robotaxi；8/10。
        - label: 客户验证
          value: 7
          score: 7
          detail: 采用代理指标和国际化验证都较强，但仍集中在少数可见地区；7/10。
        - label: 经济性可见度
          value: 4
          score: 4
          detail: 当前收入、贡献利润率和现金跑道仍不透明；4/10。
        - label: 监管 / 治理
          value: 3
          score: 3
          detail: 3·15 曝光叠加隐私和用工监管收紧，分项仍偏弱；3/10。
        - label: 估值支撑
          value: 5
          score: 5
          detail: $6B 估值说得通，但公开数据还不足以完全支撑；5/10。
        - label: 退出准备度
          value: 4
          score: 4
          detail: 二级交易可行，但公开市场准备度尚未验证；4/10。
        - label: 证据质量
          value: 5
          score: 5
          detail: 来源覆盖面不错，但关键财务变量仍未公开；5/10。
