        blocks:
          - type: paragraph
            body: >-
              Hello 的第三层风险是依赖。公司最有野心的邻近业务并不明显自成闭环。换电和 robotaxi 开发依赖 CATL、Ant Group 和 Alibaba 关联支持，范围包括资本、电池、隐私 / 安全
              know-how，以及云或模型基础设施。战略支持很有价值，但也意味着 Hello 部分未来期权价值，取决于优先级可能变化的对手方持续投入。CATL 和 Yicai 材料让这种依赖变得具体，而非理论：CATL 向
              Hello Robotaxi 提供电池和技术支持；Ant 和 Alibaba 则与资本形成、安全 / 隐私、AI 工具和算力合作相关。国际证据又引入第二种依赖。Singapore 增长、Logan 部署、Ryde
              权益和 Razer
              活动都显示，扩张往往通过市政批准、伙伴捆绑或活动主导渠道推进，而不是经审计的独立需求披露。这些引用证明牵引力，也暴露了围绕少数城市和对手方的集中度。同一逻辑也适用于中国国内，商户或类加盟运营层可能成为控制弱点，3·15
              事件已经说明这一点。换句话说，伙伴杠杆真实存在，伙伴脆弱性也一样真实。
