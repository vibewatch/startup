              - CV031
              - CV032
              - CV033
              - CV034
      - number: '8.5'
        title: 最终尽调与投资逻辑破裂点
        blocks:
          - type: paragraph
            body: >-
              剩下的问题是，什么能让这家公司从可跟踪变成可投资。第一是更好的核心经济性：当期收入、按业务线拆分的贡献利润率、现金跑道，以及 2026 年价格调整对使用频次和留存的真实影响。第二是更干净的治理证明：3·15
              后整改数据、隐私控制、劳动敞口图谱，以及任何城市级执法历史。第三是股权结构表清晰度和退出机制：老股流动性、优先股堆叠、反稀释条款，以及战略持有人或关联方是否塑造下一轮估值。投资人也应严守投资逻辑破裂触发器。又一次重大安全丑闻、实质性隐私或劳动执法、CATL
              / Alibaba / Ant
              等伙伴撤退，或反复出现“涨价速度必须快过质量改善”的证据，都足以支持下调倍数。反过来，如果公司拿出可审计证据证明核心出行利润率健康，并在相邻业务里按里程碑商业化，就可以向乐观情景靠拢。在证据出现之前，正确姿态是保持好奇，但坚持价格纪律。
