        title: 财务判断与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              正确的财务判断是建设性但谨慎。公开证据显示，公司拥有大规模代理指标、反复获得战略资本的能力，以及在更成熟市场里越来越克制的定价行为。它没有显示经审计的收入质量、合并盈利能力、毛利率、伙伴集中度、债务结构或跑道。即便正面的盈利线索也只是局部：TechNode
              多年前报道过许多城市盈利，但这不等于证明公司扩张到电池和 robotaxi 后，集团层面盈利可持续。因此，Hello
              足够可投，值得留在严肃尽调清单上；但仅靠公开来源，它仍太不透明，无法精确承销。下一阶段工作必须来自管理层或泄露运营包：收入组合、单位经济性、burn、债务和 cohort
              行为。在此之前，公开记录既不支持危言耸听的资不抵债观点，也不支持自满的盈利质量观点。还有一层谨慎对尽调纪律很重要：公开融资标题会让公司看起来风险已消除，但它们其实只证明公司持续能获得战略支持者。这一区别在财务上重要，因为伙伴支持资本在经济性、治理或时间线信心变化前都可能很充足。投资者因此需要把今天的偿付能力舒适度，与长期回报质量分开看。
