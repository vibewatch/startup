      - number: '1.3'
        title: 从单车扩展到更宽出行
        blocks:
          - type: paragraph
            body: >-
              Hello 最初的切口靠执行，而不是品牌声量。2018 年独立报道一致显示，Hellobike 通过集中做中国二、三线城市胜出，而 Mobike 和 Ofo
              在一线市场打更烧钱的仗。挺过这轮洗牌很关键，因为用户基础和运营 know-how 后来支撑了邻近业务扩张。到 2019 年，Hello 已进入顺风车和网约车；到 2020 年，又与 CATL 和 Ant
              一起推进电单车换电。2021 年，公司推出智能电动自行车；2022 年淡化以单车为中心的身份。国际 HelloRide 业务如今是有意义的验证点，说明运营模型可以出海，哪怕规模小于中国大陆核心。Singapore
              证据最清楚：2022 年进入市场，2025 年拿到 20,000 辆持牌单车，2026 年增至 25,000 辆。Hong Kong 和 Australia
              增加了可见度，也提醒投资者：这一品类在中国大陆之外依然运营难度很高。总体看，公司历史不像随意铺摊子，更像从两轮城市交通有意扩宽到完整本地出行栈。
