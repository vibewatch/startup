  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 版图与竞争者类别
        blocks:
          - type: paragraph
            body: >-
              Hello 的竞争发生在多个层次，而不是一张整齐的同行清单。直接微出行领域是今天仍被多个消费者和行业来源描述的熟悉三家：Hello、Meituan Bike 和 Didi
              Qingju。但经济上更重要的区别是，这些运营商中只有 Hello 主要仍被当作私有出行专家评估。Meituan 和 Didi 位于更宽的上市公司生态里，披露更强、交叉补贴选择更多，日常 app
              流量也大得多。这意味着真实替代类别包括直接共享单车同行、super-app incumbents、网约车邻近业务，以及 Ofo 这类历史警示样本。洗牌后的市场结构很重要，因为 Hello
              不再和几十家创业公司抢原始单车投放；它在对抗少数更大生态，这些生态可以把共享单车用作留存、流量和本地服务层，而不是独立业务。
