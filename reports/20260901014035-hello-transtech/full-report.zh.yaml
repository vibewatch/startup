        - 下调相邻业务价值。
      - - 价格 / 质量恶化
        - 多次涨价，同时评价或使用率信号恶化
        - 暗示核心业务弱于假设
        - 将当前标记视为过高。
      - - 退出市场疲软
        - 投资者池进一步收缩时，没有可信老股交易或 IPO 路径
        - 拉长非流动性，并收窄终值支撑
        - 提高持有期折价。
    notes: 触发项设计成可从尽调材料或未来披露中外部监控。
  - id: TV006
    title: 最终尽调问题表
    summary: Highest-value open diligence items before underwriting a fresh round near current marks.
    sourceRefs:
      - SV002
      - SV011
      - SV020
      - SV024
    claimRefs:
      - CV030
      - CV041
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 核心收入和贡献利润率
        - 按业务线划分的当前收入，以及按城市 / 产品划分的贡献利润率
        - 需要判断 $6B 隐含的倍数是合理还是拉伸
        - 索取月度和季度经营复盘包。
      - - 现金跑道和烧钱速度
        - 账面现金、债务、月度烧钱速度和下行现金跑道
        - 决定战略融资支持是可选还是必要
        - 索取资金桥和 12-18 个月下行计划。
      - - 股权结构表和优先权
        - 清算优先权、反稀释、老股交易和关联方权利
        - 私有价值可能与普通股经济性大幅不同
        - 索取股权结构瀑布和最新融资文件。
      - - 3·15 后整改
        - 商户退出、车辆下架、审计节奏和监管沟通
        - 直接检验一次真实合规失败后的治理质量
        - 索取整改仪表盘和执法跟踪表。
      - - Robotaxi / 换电经济性
        - 资本开支、使用率、里程碑资金和预期 ROI
        - 没有经济性证据时，可选性不应获得完整信用
        - 索取商业案例备忘录和 JV 治理文件。
      - - 涨价后的留存
        - 2026 年涨价后的骑行频次、通票续费、流失和弹性
        - 显示变现调整是改善还是伤害核心价值
        - 索取按城市和骑行者分群划分的队列分析。
    notes: 这些问题优先覆盖最可能改变估值和投资者信心的事项，而不是完整尽调清单。
