      - number: '2.4'
        title: 驱动因素、约束与待完成规模测算
        blocks:
          - type: paragraph
            body: >-
              最强需求驱动很容易识别：高密度城市、拥堵、高智能手机渗透、Alipay
              量级数字支付、绿色交通政策，以及可以更智能升级、租赁、充电或换电的庞大两轮车存量。但约束同样真实。共享单车市场不再是高速扩张的补贴故事，而是一个受监管的运营市场。TechNode
              和消费者指南都强调定点停车、更高定价、更克制车队，以及转向盈利。国家政策文件又加了一层细节：北京在推动绿色交通和智能出行，同时也在整治电池和 NEV 的无序竞争。这意味着顺风和摩擦会同时到来。换电和
              robotaxi 邻近业务有吸引力，因为它们扩大了变现面；但它们也需要更多 capex、更多监管许可，以及更多伙伴协调。关键未解问题仍是 Hello 特定的：公开来源没有按城市、模式或买方分层拆出经核验的 SAM
              或 SOM。严肃承销模型仍需要自下而上的城市上限、骑行频次、通票组合和抽成假设，而这些没有公开披露。
