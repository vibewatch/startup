      - number: '2.2'
        title: 规模测算视角与市场形态
        blocks:
          - type: paragraph
            body: >-
              严谨的市场规模判断必须合并几组并不等价的视角。Statista 将 bike-sharing 和 ride-hailing 作为独立 B2C 类别处理，并明确使用基于订单和收入的自下而上方法，而不是纯故事型
              TAM。TechNode 提供了有用的历史锚点，显示中国共享单车市场如何快速增长后走向整合；Yicai 的用户和城市数量则说明，Hello 到 2020
              年已达全国足迹规模。最大的结构性视角来自电动两轮车基数：National Business Daily 称，中国社会保有量已超过 450 million
              辆，该品类已从原始销量增长转向存量替换、技术竞争和国际扩张。这些事实重要，因为 Hello 最大的现实变现基础仍在短途出行和相邻两轮基础设施，而不是完全自动驾驶车队。Robotaxi
              相关，但更像期权层，不是当前核心 TAM。因此，诚实输出应是一张多视角市场地图：需求水库巨大，可服务类别有意义，但公司特定的变现边界仍不完整。
