  - id: FE003
    title: 部署与本地化路线图
    type: flow
    layout: standard
    summary: 公开证据显示，Hello 按市场调整车辆和规则，而不是套用一套统一的全球模板。
    data:
      nodes:
        - label: 中国核心市场
          detail: 单车、电单车、智能电单车、换电
        - label: 香港
