      - number: '8.4'
        title: 情景分析与退出逻辑
        blocks:
          - type: paragraph
            body: >-
              用公开数据估值 Hello，最诚实的方法是情景分析，因为当前收入、利润率和优先股结构仍部分隐藏。2026 年的风投环境允许大型私募估值继续存在，但 CB Insights
              也显示，市场头部集中，活跃投资人减少，亚洲退出走弱。这意味着强公司可以更久地留在私有市场，但流动性仍有选择性，价格纪律仍然重要。悲观情景下，投资人应假设 3·15 式治理问题、涨价反弹或更弱退出市场把 Hello
              推近 $3B-$4B。基准情景对平台规模、多模态宽度和战略股东给部分信用，同时因不透明和风险打折，落在约 $4.5B-$6.0B。乐观情景要求公司明确证明核心出行经济性可持续，且 Robotaxi
              和换电相邻业务正在商业化，而不只是战略叙事；若达成，$6.5B-$8.0B 具备合理性。按概率加权，这些情景给出的期望价值接近 $5.2B，因此当前 $6B 估值看起来偏合理到偏满，而不是明显错误。
            claimRefs:
              - CV015
              - CV016
              - CV017
              - CV018
              - CV031
              - CV032
              - CV033
              - CV034
              - CV036
              - CV037
