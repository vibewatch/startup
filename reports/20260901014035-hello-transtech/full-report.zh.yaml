      - number: '3.3'
        title: 转换成本与分发权力
        blocks:
          - type: paragraph
            body: >-
              最重要的竞争事实可能是，随意骑行用户并不特别忠诚。多个骑行指南暗示，许多用户只是解锁最近且可接受的单车，这让休闲转换成本偏低，也让车队密度和摆放位置至关重要。不过，忠诚度不是零。通票、会员和一体化支付流程可以把经济性推向留在某一个生态内，尤其是对骑行频繁、会在意订阅价值的通勤者。super-app
              结构在这里变得关键。Hello 的优势是 Alipay 降低摩擦，并帮助品牌进入许多更小市场；当用户已经在 Meituan 或 Didi
              生态里高频交易时，它们也享有类似便利。结果是一个硬件锁定弱、分发锁定有意义的市场。运营商不需要用户爱上一辆车；它们需要车就在旁边、停车逻辑跑通，且周围 app 关系足够黏，让下一次骑行仍发生在同一生态内。
