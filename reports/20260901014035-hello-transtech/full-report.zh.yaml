  - id: FV002
    type: bar
    layout: standard
    title: 估值敏感性——支撑 $6B 标记所需收入
    summary: 在 Hello 私募标记维持 $6B 不变时，不同市值收入倍数隐含的收入门槛。
    approximationNotes: 数值是分析师基于公开可比倍数计算得出；它们不意味着 Hello 目前报告了图中任何收入水平。
    claimRefs:
      - CV008
      - CV010
      - CV013
      - CV014
    data:
      items:
        - label: 0.5x 收入
          value: 12
          unit: USD billions
          detail: $6B / 0.5x = 需要 $12B 收入；大致是 Didi 式公开倍数底部
          claimRefs:
            - CV010
            - CV014
        - label: 1.0x 收入
          value: 6
          unit: USD billions
          detail: $6B / 1.0x = 需要 $6B 收入；成熟平台平价情景
          claimRefs:
            - CV014
        - label: 1.1x 收入
          value: 5.45
          unit: USD billions
          detail: $6B / 1.1x ≈ 需要 $5.45B 收入；接近 Meituan 式公开倍数
          claimRefs:
            - CV008
            - CV014
        - label: 1.5x 收入
          value: 4
          unit: USD billions
          detail: $6B / 1.5x = 需要 $4B 收入；中等私募溢价
          claimRefs:
            - CV014
        - label: 2.0x 收入
          value: 3
          unit: USD billions
          detail: $6B / 2.0x = 需要 $3B 收入；强溢价情景
          claimRefs:
            - CV014
        - label: 3.0x 收入
          value: 2
          unit: USD billions
          detail: $6B / 3.0x = 需要 $2B 收入；激进私募增长溢价
          claimRefs:
            - CV014
  - id: FV003
    type: range
    layout: standard
    title: 估值 / 回报区间
    summary: 基于公开证据给出的 Hello 悲观、基准和乐观估值区间。
    approximationNotes: 所有区间都是分析师估算，锚定当前公开参考、可比倍数和当前风险画像，而不是审计财务报表。
    claimRefs:
      - CV031
      - CV032
      - CV033
      - CV034
    data:
      items:
        - label: 悲观情景（~25%）
          low: 3
          high: 4
          unit: USD billions
          detail: 治理或变现令人失望；退出背景仍然疲弱。
        - label: 基准情形（~55%）
          low: 4.5
          high: 6
          unit: USD billions
          detail: 规模守住，风险仍然实质存在，相邻业务只拿到部分加分。
        - label: 牛市情形（~20%）
          low: 6.5
          high: 8
          unit: USD billions
          detail: 核心经济性经得起验证，robotaxi / 换电里程碑降低可选业务的不确定性。
  - id: FV004
    type: kpi
    layout: standard
    title: 投资 KPI
    summary: 仅基于公开证据的 Hello 尽调评分卡。
    sourceRefs:
      - SV001
      - SV002
      - SV011
      - SV018
      - SV020
    claimRefs:
