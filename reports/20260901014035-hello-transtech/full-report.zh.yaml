        blocks:
          - type: paragraph
            body: >-
              公开领导层画像显示，公司由创始人牵引，但制度透明度不足。TipRanks、Wikipedia 和早期媒体报道持续将 Yang Lei 列为 CEO，并把 Han Mei、Li Kaizhu、Jiang Wei
              放在创始或早期高管群体中。这足以讨论创始团队延续性，但不足以把治理视为完全透明：已审阅公开记录没有给出当前详细董事权利图、经审计的独立账目，或清晰更新的股权表。所有权也更适合用方向性而非定论性语言描述。多个当前来源仍重复
              Ant Group 约持股 36%、为 Hello 最大股东的说法；Hello 早期接入 Sesame Credit
              的生态整合，也解释了这层关系的战略意义。但投资者应区分“广泛引用”和“完全重新核验”：该数字可追溯到较早的招股书时期报道，当前公开材料没有提供更新后的所有权表。私有状态更清楚。Caixin 显示，Hello 在
              2021 年北京收紧境外上市监管期间正式撤回美国 IPO；已审阅的 2025-2026 年证据没有显示其后来完成上市。因此，Hello 仍是私有公司，战略连接强，但透明度依然相对有限。
