  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: Hello 通过不同入口和扩张循环获客、留住不同用户类型，但所有循环都依赖稳定的骑行—还车—支持体验。
    data:
      nodes:
        - label: 通勤者发现
          detail: 通过 Hello、Grab 或合作伙伴入口找到附近车辆
        - label: 首次有效骑行
          detail: 以低上手摩擦完成首程或末程出行
        - label: 复用触发
          detail: 因搜索时间和停车可控而买通票或再次使用
        - label: 扩张循环
          detail: 分叉到休闲、合作伙伴奖励或配送场景
    approximationNotes: 这张旅程图以通用旅程节点呈现，因为公开来源对步骤顺序和复用触发的描述，比对各客群精确占比的描述更清楚。
