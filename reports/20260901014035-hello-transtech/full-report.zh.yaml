      - number: '7.4'
        title: 财务不透明、人员风险与终止标准
        blocks:
          - type: paragraph
            body: >-
              最后一层风险来自财务不透明和执行跨度过大。公开证据能支撑 Hello
              已有相当规模，服务线还在扩张，但要像承销一家透明上市发行人那样判断公司，现有资料还缺少烧钱速度、现金、负债结构、付费用户留存、事故后整改等关键当期数据。2021 年美国 IPO
              撤回提醒投资人，融资路径会被政策重塑；而公司今天的公开材料，讲注册用户、车队和生态雄心远多于讲城市级盈利能力或 cohort 耐久性。问题在于，Hello 正在同时协调单车、顺风车、网约车、换电、租赁和
              Robotaxi。每条线都会叠加合规、定价、用工、维护和危机响应负担。因此，投资人不应只看表层采用率，还要盯住底层可衡量的终止条件：3·15
              整改能否拿出可审计闭环，而不只是道歉；劳动、隐私或价格监管会不会变成直接处罚；Robotaxi
              这类重伙伴项目吸收资本的速度会不会快过成熟速度；变现收紧后，客服摩擦会不会恶化。只有当公司证明治理质量至少跟业务范围同速提升，投资逻辑才具备可投性。
