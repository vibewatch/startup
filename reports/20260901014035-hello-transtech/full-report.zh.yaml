      - number: '1.4'
        title: Robotaxi 转向与尽调框架
        blocks:
          - type: paragraph
            body: >-
              当前最重要的里程碑，是 2025-2026 年的 Robotaxi 推进。Yicai、CarNewsChina、SCMP、Yahoo Finance、Gasgoo、CATL 和 Automotive World
              都支持一个判断：Hello 已不只是站在自动驾驶边缘试验；它在 2025 年 6 月与 Ant 和 CATL 成立 Shanghai Zaofu Intelligent Technology，2025 年 9
              月发布 Hello Robot1，同月引入 Alibaba 作为战略投资者，并在 10 月于 Liyang 启动示范运营。到 2025 年底，该合资公司已开始谈生产节奏和 2027
              年部署目标，规模大到足以影响战略判断。尽调框架仍应谨慎，而不是庆祝。这些里程碑可信，但不能替代经审计的经济性、清晰董事权利，或完全核验的当前估值。反向解读很直接：Hello
              已证明战略相关性和伙伴获取能力，但仍是一家创始人色彩浓厚的私有公司；最有野心的新业务线资本开支重、技术复杂，且商业化仍处早期。
