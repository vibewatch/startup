  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重度排序的监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Hello
              最重要的风险类别是监管，因为公司如今同时处在多个中国政策制度的交叉口：本地出行运营、位置密集型数据处理、零工式劳动、租赁电单车安全，以及自动驾驶商业化。官方公司产品地图已经足够宽，合规面不再局限于单车停车或基础车辆维护。中国个人信息制度尤其相关，因为出行
              super-app 必然处理路线、行踪、支付和行为数据；2026 年 Chambers 指南和 PIPL 都明确，轨迹和行踪属于敏感信息范畴，因此合法处理、影响评估和事件响应门槛更高。2026 年 4
              月劳动规则又加了一层，要求最低报酬底线、工时控制、算法透明，以及在适用情况下签署书面协议或劳动合同。2026 年 3 月 3·15 曝光最清楚证明，执法不是抽象风险。Hello
              品牌租赁电单车运营被公开关联到超速、套牌和超标电池；随后上海监管部门展开现场调查，Hello 承认存在审核或管理漏洞。广泛暴露面叠加已发生执法，正是法律 / 合规失败风险高于纯市场风险的原因。
