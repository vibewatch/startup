  topStrengths:
    - 真实规模已经看得见：截至 2026 年 8 月，约 42,000 辆车、29 座城市、13 个国家，ARR 约 $420M。
    - 与 Waymo 的关系给了 Moove 少见的具名验证：它的自动驾驶车队基础设施层确实有商业价值。
    - 产品边界很具体，围绕车队持有、场站、充电、维护和调度运营展开，而不是停留在自动驾驶概念 PPT。
    - 投资人质量和多轮融资能力说明，机构仍相信 Moove 能继续搭建全球车队基础设施。
  topRisks:
    - 单位经济性、毛利率、现金转化和站点级回报大多仍未公开，ARR 能否沉淀成持久价值还难以判断。
    - 合作伙伴集中度风险不低；大渠道和旗舰自动驾驶项目会左右需求、议价权和续约结果。
    - 自动驾驶运营里的监管和责任负担，可能拖慢上线、推高运营成本，也会压缩名义车队规模能兑现的价值。
    - 商业模式仍然重资产，融资可得性和资产利用率比纯软件公司更关键。
    - 相比当前估值，公开公司级别的信息披露偏弱，下行空间很难精确测算。
  unresolvedGaps:
    - 场站和市场层面的单位经济性，包括毛利、充电桩利用率和投运准备成本。
    - 已签合作伙伴合同条款、续约机制、赔偿责任和保险分摊。
    - 合并口径经审计财务报表、债务明细和现金跑道。
    - 按合作伙伴、市场和客户队列拆分的收入集中度。
    - EBITDA 盈亏平衡和运营纪律能否从个别市场或公告推广到整体业务的证据。
