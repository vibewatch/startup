      lives—even our vehicles—depend on connectivity and technology that runs on complex software. As information
      technology becomes increasingly integral to our daily lives, our dependency on subsequent information systems
      grows. In turn, we experience an increase in vulnerabilities and potential attacks against those systems.
      Cybersecurity rose out of necessity to protect these systems and the information contained within them. Applied to
      vehicles, cybersecurity takes on an even more important role: systems and components that govern safety must be
