evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-disclosure
    missingEvidence: Current board roster, committee structure, and any observer or preference rights after the 2026 round.
    whyItMatters: >-
      Late-stage valuation and control analysis depend on knowing who governs the company and what rights are attached
      to recent financings.
    diligencePath: >-
      Request the current cap table, board deck, and signed term-sheet summaries from the 2024 Series B and 2026 Series
      C.
    relatedQuestionRefs:
      - QO009
      - QO023
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Named list of major corporate customers, revenue concentration, and contract duration data.
    whyItMatters: The overview can cite scale and partnerships, but concentration determines how durable that scale is.
    diligencePath: >-
      Obtain customer cohort data, the top ten account schedule, and any revenue-sharing agreements with key platform
      partners.
    relatedQuestionRefs:
      - QO023
  - type: private-evidence-only
    severity: material
    topic: debt-stack
    missingEvidence: Current debt balances, collateral terms, project-finance structures, and repayment profile.
    whyItMatters: Moove’s combined equity-and-debt funding model is central to its scale story and risk profile.
    diligencePath: Request debt facility summaries, lender covenant schedules, and current balance-by-facility data.
    relatedQuestionRefs:
      - QO013
  - type: conflicting-data
    severity: minor
    topic: city-count
    missingEvidence: >-
      A single dated company-maintained market roster reconciling older investor-page counts with the 29-city 2025-2026
      total.
    whyItMatters: Later chapters need one canonical present-tense market count and clear historic markers to avoid drift.
    diligencePath: >-
      Ask management for a dated market-entry chronology and reconcile it against investor, impact, and financing
      materials.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO004
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-and-founder-table coverage
    missingEvidence: >-
      Full board roster, regional leadership map, and named operating executives beyond the four most visible public
      figures.
    whyItMatters: >-
      The overview can identify the founder and finance bench, but incomplete governance coverage limits key-person and
      control analysis.
    diligencePath: Request an org chart, board list, and country leadership roster current to the Series C close.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-or-investor-map coverage
    missingEvidence: Complete shareholder register, lender list, and partner concentration schedule behind the public headline names.
    whyItMatters: >-
      Public sources name only the most visible investors and partners, not the full economic stack that shapes control
      and downside risk.
    diligencePath: Request the cap table, debt facility list, and top-partner revenue split used internally for board reporting.
    relatedQuestionRefs:
      - QO013
      - QO023
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: moove-specific-som
    missingEvidence: >-
      Partner-level vehicle commitments, expected city-launch schedule, and unit economics by market for Moove’s AV
      business.
    whyItMatters: Without those inputs, top-down market size cannot be translated into a credible Moove share forecast.
    diligencePath: Request the AV pipeline by city, signed launch commitments, and target fleet counts by partner.
    relatedQuestionRefs:
      - QM022
      - QM023
  - type: enumeration-incomplete
    severity: minor
    topic: market-sizing-lens-table coverage
    missingEvidence: >-
      A single apples-to-apples dataset linking robotaxi vehicles, depot megawatts, fleet-operations spending, and
      outsourced-operator take rates.
    whyItMatters: >-
      Top-down estimates use different definitions, so the table is intentionally partial rather than falsely
      exhaustive.
    diligencePath: Build a bottom-up city model from signed launches, expected vehicles per depot, and third-party operator scope.
    relatedQuestionRefs:
