- id: TI002
  title: Pricing / monetization table
  columns:
  - Price / unit / contract
  - Public signal
  - List vs realized pricing
  - Discounts / unknowns
  - Source
  rows:
  - - Legacy DTO contracts
    - 12-48 month terms with 8%-13% annual interest cited in 2022
    - Likely realized economics vary by market and vehicle class
    - Current pricing not publicly refreshed for 2026
    - TechCrunch 2022
  - - Weekly collections from driver earnings
    - Weekly rental / financing deductions from platform revenue
    - Realized collections depend on trip volume and utilization
    - Current schedules, fees, and penalties undisclosed
    - TechCrunch 2022 / Global Fleet 2021
  - - London EV rent-to-buy
    - Flat weekly fee and no upfront costs cited in 2022 Moove Charge coverage
    - Realized pricing depends on vehicle class and market conditions
    - Specific weekly fee not disclosed in reviewed sources
    - Moove Charge
  - - AV operations contracts
    - Likely service or asset-backed contract economics
    - No public realized pricing disclosed
    - Exact per-mile, per-vehicle, or availability fee unknown
    - Series C / Mubadala 2026
  notes: The public record is strong on monetization logic and weak on realized price books, discounts, and take rates.
