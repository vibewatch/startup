  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Cohort payback, delinquencies, residual values, gross margins, and contribution margins by product line.
    whyItMatters: Without these metrics, public ARR growth cannot be converted into a high-confidence view on durable profitability.
    diligencePath: Request product-level P&Ls, loan-book performance, and market-level utilization metrics.
    relatedQuestionRefs:
    - QI005
    - QI010
    - QI024
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: Current cash balance, monthly burn, debt balances, covenants, and collateral or project-finance terms.
    whyItMatters: Moove’s model is asset-heavy enough that liquidity and credit terms can change growth options materially.
    diligencePath: Review treasury dashboard, lender agreements, and 13-week cash forecast.
    relatedQuestionRefs:
    - QI021
    - QI022
    - QI024
  - type: missing-source
    severity: minor
    topic: revenue-streams-table coverage
    missingEvidence: A public source that cleanly discloses AV pricing, take-rate structure, or contract form for autonomous fleet services.
    whyItMatters: The table can describe the revenue logic, but not exact realized pricing for the AV business.
    diligencePath: Request signed customer or partner contract templates and a realized-price waterfall for one live AV market.
    relatedQuestionRefs:
    - QI003
    - QI007
    relatedTableRefs:
    - TI001
    - TI002
