- id: TI004
  title: Capital adequacy table
  columns:
  - Item
  - Public anchor
  - Why it matters
  - Current read
  - Diligence ask
  rows:
  - - 2022 financing mix
    - $65M equity + $40M debt in Series A2
    - Shows blended-capital model from early scale
    - Supportive but already capital intensive
    - Confirm remaining debt balances from early facilities
  - - Aug 2023 funding
    - +$76M and >$335M cumulative
    - Shows continued appetite from Mubadala and BlackRock
    - Positive sponsor support
    - Bridge each tranche to current capital structure
  - - Mar 2024 cumulative capital
    - $250M equity + $210M debt
    - Best disclosed equity/debt split in public sources
    - Useful historical anchor
    - Update to current equity, debt, and project finance totals
  - - India debt facility
    - $10M plus potential extra revolving line
    - Shows country-level credit scaling
    - Supports localized expansion
    - Provide utilization, security, and covenants
  - - Current adequacy
    - Cash, runway, and covenants undisclosed
    - Most important missing financial risk input
    - Insufficient from public record
    - Review treasury and lender packs
  notes: Capital adequacy is the hardest part of the public record to underwrite because the company discloses fundraising more readily than liquidity or debt balances.
