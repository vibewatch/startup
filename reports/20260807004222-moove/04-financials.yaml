- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact
  - Exact diligence path
  rows:
  - - Gross margin by product and market
    - Without it, ARR growth can mask weak economics
    - Request product-level P&Ls and gross-margin bridges
  - - Debt balances, covenants, and collateral
    - Fleet growth may be constrained by lender terms
    - Review current debt schedules and covenant dashboards
  - - Loan-book performance and residual values
    - Legacy financing quality shapes downside risk
    - Request default, delinquency, and recovery tables
  - - Partner concentration and renewal terms
    - Uber / Waymo concentration can distort perceived scale quality
    - Obtain top-account revenue split and contract summary
  - - Cash generation and 13-week forecast
    - Break-even claims need liquidity context
    - Review treasury reporting and runway model
  notes: These are the missing economics that would most change an investor’s willingness to underwrite Moove’s valuation and growth path.
