tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current value / status
  - Quality
  - Diligence ask
  rows:
  - - Drive-to-Own financing
    - Revenue-based vehicle financing and weekly collections from driver earnings
    - Per financed vehicle / contract
    - Legacy core stream; still active globally
    - Recurring but credit-sensitive
    - Show realized APR, defaults, residuals, and payback by market
  - - Autonomous fleet operations
    - Fleet ownership, charging, servicing, and command operations for AV partners
    - Per vehicle / per mile / service contract (exact basis undisclosed)
    - Clearly strategic in 2025-2026; precise contract form undisclosed
    - Potentially sticky but operationally heavy
    - Request one live contract economics pack
  - - Ancillary customer services
    - Insurance and other embedded benefits
    - Per policy / benefit bundle
    - Value-add disclosed, economics not disclosed
    - Supportive but likely secondary
    - Break out take rates and retention impact
  - - Vehicle advertising and other asset monetization
    - Advertiser payments on financed vehicles
    - Per campaign / fleet impression bundle
    - Program launched in South Africa, Ghana, and India
    - Incremental rather than core
    - Show advertiser demand, revenue share, and margin
  notes: Public evidence clearly shows multiple monetization layers, but not a full revenue-mix or realized-margin disclosure.
