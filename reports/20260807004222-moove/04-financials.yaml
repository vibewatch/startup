- id: traction-and-public-operating-metrics
  title: Traction and public operating metrics
  body: 'The topline growth path is one of the clearest parts of the public record. In March 2024, Moove said ARR had exceeded $115 million in 2023. In January 2025, the Kovi acquisition pushed consolidated ARR above $275 million. By October 2025, Moove said it was on course for approximately $400 million in ARR, and by August 2026 it claimed $420 million ARR alongside 42,000 vehicles across 29 cities and 13 countries. Those disclosures make Moove one of the more heavily publicized private fleet operators on current revenue scale. Trips and customer counts also moved meaningfully: more than 30 million financed trips by March 2024, more than 160 million trips by October 2025, and a workforce large enough to support global operations and a fast-expanding AV division. The central caveat is quality of revenue. Public sources do not explain gross versus net ARR, contribution margin by market, or retention. Investors can therefore trust the existence of scale more than they can precisely underwrite
    its quality.'
  claimRefs:
