company:
  name: Moove
chapter:
  number: 5
  title: Product & Technology
  summary: 'Moove’s current product is best described as an operations technology layer wrapped around physical fleet infrastructure. The company does not publicly present itself as an autonomy-software developer; instead it sells the harder physical and operating work around fleets: ownership or financing, depots, charging, maintenance, readiness, and 24/7 command operations. Public sources make the workflow and dependencies reasonably concrete, but they leave major gaps on software architecture, cybersecurity, reliability metrics, and technical defensibility.'
sections:
- id: product-definition-and-module-map
  title: Product definition and module map
  body: 'Moove’s product is easiest to understand as a transition from vehicle access to infrastructure orchestration. The legacy Drive-to-Own business still matters because it established Moove’s competence in financing, asset operations, and customer support around working vehicles. But the AV page shows a broader offer: autonomous fleet ownership and operations, Nest depot infrastructure, charging operations, maintenance and readiness, city-level monitoring, and AI-driven command systems. In practical terms, that is not one monolithic software product. It is a product bundle that mixes capital, depots, service workflows, and a control layer used to keep fleets available. This distinction matters because it explains both Moove’s appeal and its constraints. The company is not claiming to build the autonomous-driving brains. It is claiming to build the operating layer that allows those brains to run reliably at true city scale across multiple markets and partner configurations.'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE008
  - CE009
  tableRefs:
  - TE001
  figureRefs:
  - FE001
- id: operating-architecture-and-workflow
  title: Operating architecture and workflow
  body: 'The public workflow is concrete enough to map. Vehicle capital and supply sit upstream. Depots, charging, inspections, cleaning, and readiness sit in the physical middle. Command operations, monitoring, and utilisation management form the control layer. Partner-facing launch work sits downstream, where Moove plugs into platforms like Waymo. The Waymo materials sharpen this picture because they assign Moove specific responsibilities: fleet operations, charging infrastructure, vehicle supply availability, and depot buildout. Kovi and Moove Charge reinforce the same pattern from other angles by expanding vehicle access and EV-operating capabilities. The right read is that Moove’s architecture is hybrid. It is not pure software, but it is also more systematized than a simple fleet-services contractor. Its real product is the repeatable coordination of physical assets and operating decisions across markets, shifts, incident states, and launch phases.'
  claimRefs:
  - CE005
  - CE006
  - CE010
  - CE011
  - CE013
  - CE014
  - CE029
  - CE030
  - CE031
  tableRefs:
