  - FE003
- id: maturity-differentiation-and-dependencies
  title: Maturity, differentiation, and dependencies
  body: 'Moove’s differentiation is primarily operational breadth. Compared with Waymo, the company owns less of the autonomy stack and none of the rider-facing software surface, but it offers more willingness to finance, own, charge, service, and operationalize fleets. Compared with charging specialists, it aims to own a broader slice of the stack. That breadth is meaningful, but it comes with dependencies that remain visible in public sources. Waymo still controls the AV system and service experience. Uber and other large platforms can offer adjacent infrastructure layers of their own. Depot land, charging, and city-by-city regulatory readiness remain external constraints. Product maturity is therefore mixed: the operating playbook looks real and increasingly global, while the technical defensibility of the command layer remains under-disclosed. Investors should interpret Moove as an industrial operating platform with software elements, not as a self-contained autonomy company. That means
    diligence should test repeatability of execution, not just elegance of product narrative.'
  claimRefs:
  - CE015
  - CE016
  - CE017
  - CE018
  - CE019
  - CE028
  - CE032
  - CE033
  - CE035
  tableRefs:
  - TE005
  figureRefs:
  - FE004
- id: trust-safety-and-quality-controls
  title: Trust, safety, and quality controls
  body: 'The strongest trust evidence is operational, not certification-heavy. Moove has publicly described customer safety training that covers incident reporting, driver readiness, contract understanding, mental health, and regulatory compliance. It also wraps insurance or support benefits into parts of the driver business. For AV operations, the relevant outside context comes from regulators and safety bodies rather than from Moove-specific audits. NHTSA emphasizes that automated-vehicle deployment still requires careful safety validation and cybersecurity safeguards, while the UK’s AV Act shows that self-driving rollout comes with ongoing legal and safety obligations. Waymo’s own safety materials reinforce how much validation, policy discipline, and ongoing testing sit behind commercial AV service. What is missing is equally important: there is no public reliability dashboard, no public cybersecurity assurance note, and no public engineering disclosure that would let outsiders inspect
    the command systems behind the marketing copy. The right quality verdict is therefore cautious confidence in Moove’s operating seriousness, paired with clear requests for deeper technical and safety evidence. In short, process discipline is visible, but measurable software assurance is not.'
  claimRefs:
  - CE020
  - CE021
  - CE022
  - CE023
  - CE024
  - CE025
  - CE026
  - CE027
  - CE034
  - CE036
