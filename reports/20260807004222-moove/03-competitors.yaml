chapter:
  number: 3
  title: Competitors
  summary: Moove’s competition is best understood as a stack, not a peer list. Vertically integrated AV operators such as Waymo and Zoox can bypass third-party infrastructure; Uber can act as both channel partner and competing infrastructure layer; Zeem and ChargePoint pressure the charging/depot slice; and FlexClub, Planet42, Autochek, Virtuo, and Ayvens show how buyers can source vehicle access or fleet management separately. Moove’s advantage is bundle breadth in the physical layer, but its moat remains operational and contractual rather than absolute.
sections:
- id: landscape-and-alternative-classes
  title: Landscape and alternative classes
  body: 'Moove does not compete in only one lane. Its autonomous fleet narrative touches several adjacent budgets: AV operators deciding whether to outsource fleet ownership and physical operations; charging and depot operators selling infrastructure; fleet-leasing incumbents serving enterprise vehicle budgets; and substitute vehicle-access products that solve earlier-stage supply problems. That makes the real landscape more varied than a simple robotaxi peer set. The most direct alternative is vertical integration, where the AV developer or marketplace owns the autonomy stack, rider demand, and much of the operating layer itself. Waymo and Zoox sit closest to that model. Uber is trickier because it can act as demand channel, operating partner, and infrastructure builder at once. Zeem and ChargePoint overlap with only slices of Moove’s stack, especially charging and depot services. FlexClub, Planet42, Autochek, Virtuo, and Ayvens sit further away, but they still matter because they show
    what buyers can source separately if they do not want Moove’s full bundle.'
