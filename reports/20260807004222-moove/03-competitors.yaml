- id: how-moove-compares-on-capability-and-packaging
  title: How Moove compares on capability and packaging
  body: 'Capability comparison matters more than headline valuation. Waymo, Zoox, May Mobility, Motional, and Gatik own more of the autonomy or vehicle-software layer than Moove, but they are not all selling an open fleet-infrastructure service to outside operators. Uber owns more demand, mapping, and marketplace leverage than Moove and is increasingly willing to invest in depots and charging. Zeem and ChargePoint disclose clearer infrastructure packaging and operating commitments for charging than Moove discloses for its AV contracts. Meanwhile, legacy vehicle-access substitutes remain easier to price from a buyer’s perspective because their products are simpler. Moove’s strongest capability position is breadth: it bundles financing or ownership, servicing, charging, and real-world fleet operations into one offer. Its weakest capability position is that it does not own the autonomy stack or the consumer demand surface.'
