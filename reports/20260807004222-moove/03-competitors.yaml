  evidenceGaps:
  - type: missing-source
    severity: minor
    topic: competitor marketing proof
    missingEvidence: Independent procurement or customer-review evidence for several competitor feature claims beyond official websites.
    whyItMatters: Many competitor claims still come from self-description, which is useful for category mapping but weaker for product-performance judgments.
    diligencePath: Pull customer references, deployment contracts, or third-party case studies for each top rival.
    relatedQuestionRefs:
    - QP010
    relatedTableRefs:
    - TP001
    - TP002
  - type: private-evidence-only
    severity: material
    topic: pricing opacity
    missingEvidence: Actual enterprise contract pricing, discounts, exclusivity, and SLAs for Moove, Uber AV partners, Waymo outsourcing, and depot providers.
    whyItMatters: Competitive strength partly depends on contract form and unit economics, which are mostly private.
    diligencePath: Request sample MSAs/SOWs, renewal terms, and pricing schedules from recent AV deployments.
    relatedQuestionRefs:
    - QP014
    - QP017
    relatedTableRefs:
    - TP003
    - TP004
  - type: private-evidence-only
    severity: material
    topic: switching-cost verification
    missingEvidence: Evidence on contract duration, deployment timelines, software integration depth, and asset transferability.
    whyItMatters: Without this, switching-cost claims can be overstated.
    diligencePath: Interview current or former customers and inspect implementation plans plus termination clauses.
    relatedQuestionRefs:
    - QP015
    - QP017
    - QP018
