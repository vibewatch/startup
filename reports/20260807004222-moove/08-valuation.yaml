- id: scenario-and-comparable-framework
  title: Scenario and comparable framework
  body: 'Direct public comparables are imperfect, so scenario discipline matters more than comp worship. Marketplace platforms like Uber and Lyft own demand surfaces that Moove does not. Infrastructure and charging businesses like ChargePoint are narrower and currently much smaller in public market value, but they show how harsh the market can be toward capital-heavy infrastructure with mixed economics. Software-forward fleet or operations platforms like Samsara show how much valuation can expand when disclosure, margins, and control feel cleaner, while operational-infrastructure names such as Trimble are reminders that the market pays differently for assets with stronger reporting and recurring workflow embedment. The least-misleading comp lens for Moove is therefore hybrid: part marketplace adjacency, part operational infrastructure, part fleet-management system. Using that lens, a base case that circles the current 5.0x ARR mark looks defensible, a bull case requires meaningful de-risking,
    and a bear case is still very plausible if execution stumbles. The comp set is most helpful for bracketing upside and downside, not for pretending there is one exact public multiple Moove should trade on today.'
