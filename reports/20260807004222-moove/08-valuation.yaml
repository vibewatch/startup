  - - ChargePoint
    - ~$0.14B market cap
    - Shows how harsh public markets can be on infra-heavy EV exposure
    - Not a direct AV-fleet operator
  - - Lyft
    - ~$6.18B market cap
    - Shows the value of a public ride-hail demand platform even after volatility
    - Owns marketplace surface, not Moove-like infra
  - - Samsara
    - ~$22.27B market cap
    - Shows how highly public markets can value cleaner fleet software narratives
    - Far more software-like disclosure and economics
  - - Trimble
    - ~$18.50B market cap
    - Operational infrastructure can earn stronger valuations when workflow software and disclosure are clearer
    - Broader industrial software mix than Moove
  - - Uber
    - ~$143.44B market cap
    - Upper-bound reminder of what diversified global demand and platform ownership are worth
    - Too large and broad for direct multiple use
