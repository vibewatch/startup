- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Why it matters
  - Observed early warning
  rows:
  - - Flagship partner scope loss
    - Would undermine AV proof and growth confidence
    - Reduced city rollout, narrower scope, or renewal tension
  - - Permit reversal or regulatory delay
    - Could stall launch timing and inflate cost
    - Approval slippage or changed reporting burdens
  - - Weak site economics
    - Could prevent ARR from converting into cash returns
    - Low utilization, poor depot economics, or cost overruns
  - - No durable margin proof
    - Would make 5x ARR look expensive
    - Break-even claim fails to generalize across markets
  notes: These are the events that most clearly break the public bull case.
