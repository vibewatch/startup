company:
  name: Moove
chapter:
  number: 8
  title: Valuation
  summary: 'Moove’s $2.1 billion post-money mark looks defendable, but not obviously cheap. Using the disclosed ~$420 million ARR, the latest financing implies roughly a 5.0x ARR multiple. That feels reasonable for the company’s growth and AV relevance, but only if investors believe capital intensity, partner dependence, and site economics will not permanently suppress cash generation. The best stance from public evidence is constructive support with discipline: positive on trajectory, moderate on confidence, and unwilling to ignore missing unit-economics and contract proof.'
sections:
- id: current-valuation-anchor
  title: Current valuation anchor
  body: 'The cleanest valuation anchor is the one the market itself just set: $2.1 billion post-money against approximately $420 million ARR in August 2026. That implies about a 5.0x ARR multiple on the disclosed topline. On its face, that is not absurd for a company growing this quickly, especially one that has turned a 2024 $750 million mark into a much larger business with clearer AV relevance by 2026. The reason investors should still be careful is that this is not software ARR in the cleanest sense. Moove’s revenue sits inside a capital-hungry, operationally dense model that still depends on sites, vehicles, partners, and regulatory progress. The current mark therefore deserves to be treated as a real market-clearing datapoint, but not as proof that the business has already de-risked its hardest economics. The right read is that public data justify taking the latest round seriously while still reserving judgment on how much of today’s ARR can convert into durable enterprise value.'
  claimRefs:
