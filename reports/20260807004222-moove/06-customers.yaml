- id: retention-satisfaction-and-customer-success
  title: Retention, satisfaction, and customer success
  body: Moove’s public customer evidence is strongest where the company speaks through testimonials and support programs. The impact reports include named customer stories. The India anniversary post includes quotes about income improvement, family security, and vehicle ownership, plus one explicit referral claim. Insurance, incentives, advertising revenue-share, and road-safety training all point to a deliberate customer-success layer designed to improve stickiness and economic well-being. These are meaningful signals because they show Moove understands that access to a vehicle alone is not enough to keep supply productive. At the same time, this remains soft evidence. Public sources do not provide churn, cohort retention, NPS, or repeat-contract data. Investors should therefore treat testimonials and repeated trip volume as positive proxies, not as substitutes for hard customer-retention analytics. The gap between qualitative proof and hard retention data remains one of the biggest open
    diligence items for investors today.
  claimRefs:
  - CU019
  - CU020
  - CU021
  - CU022
  - CU023
  - CU024
  - CU030
  - CU035
  tableRefs:
  - TU004
  figureRefs:
  - FU004
- id: concentration-risk-and-customer-verdict
  title: Concentration risk and customer verdict
  body: The biggest customer risk is concentration disguised as scale. Thousands of drivers, tens of millions of trips, and wide geographic presence can all be true while revenue still depends heavily on a handful of platforms. Public evidence strongly suggests that Uber has historically been the key driver-acquisition channel and that Waymo is now the flagship AV enterprise relationship. That is not necessarily a flaw; partner-led models often scale this way. But it does mean the quality of Moove’s customer base cannot be judged only by fleet or trip counts. The most balanced view is that Moove has genuine customer traction across driver and enterprise segments, with diversification improving as the company moves into AV infrastructure. However, the public record still leaves unanswered how concentrated revenue, gross profit, and renewal risk remain inside those large relationships. That unanswered concentration question is the single biggest qualifier on an otherwise attractive customer
    narrative.
  claimRefs:
  - CU025
  - CU026
  - CU028
  - CU031
  - CU032
  - CU033
  - CU034
  - CU036
