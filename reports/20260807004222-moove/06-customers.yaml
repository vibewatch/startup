company:
  name: Moove
chapter:
  number: 6
  title: Customers
  summary: 'Moove’s customer base is real and growing, but it is structurally mediated by large platforms. On the driver side, public sources show thousands of customers, millions of trips, and meaningful support programs in markets such as India. On the enterprise side, Waymo is strong named proof for AV operations. The main caution is concentration: public evidence says more about usage and testimonials than about churn, renewals, or how much revenue still depends on a few major counterparties.'
sections:
- id: customer-segments-and-channel-structure
  title: Customer segments and channel structure
  body: 'Moove’s customer story is structurally more complex than a standard B2B or B2C startup. In the original model, the economically relevant customer was the mobility entrepreneur: a driver or small operator using Moove-financed vehicles to earn income on ride-hailing or related platforms. But distribution often ran through platform relationships, most notably Uber. In the newer AV model, the named enterprise counterparty becomes the important customer relationship because Moove is selling fleet ownership and operational services to autonomy platforms rather than to individual drivers. Public sources therefore support a two-sided customer map. There are end-driver customers, there are platform-mediated driver cohorts, and there are enterprise partners such as Waymo. That complexity matters because customer breadth can look impressive on jobs, trips, or fleet counts while still being concentrated through a small number of large channels. Investors should therefore carefully separate
    user breadth from channel power every time they assess customer quality.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU012
  - CU013
  - CU014
  tableRefs:
  - TU001
  figureRefs:
