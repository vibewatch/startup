- id: adoption-trajectory-and-named-proof
  title: Adoption trajectory and named proof
  body: 'The public record provides meaningful growth proof even if it does not provide a full customer ledger. Impact materials show jobs created, lives affected, training hours, and trip milestones. India offers the cleanest granular snapshot: over 1 million trips by February 2023, 2.3 million trips across three markets by the first anniversary, more than 1,500 vehicles in the first 10 months, and a customer base approaching or exceeding 2,000. Those are real operating signals, not abstract TAM claims. The enterprise side is more concentrated but also more visible: Waymo is clearly named, Phoenix and Miami are clearly tied to operating scope, and London shows geographic extension. Kovi broadens reach at the fleet level, even if it is not direct third-party customer proof. The result is a customer story with strong depth in a few well-documented channels and weaker visibility on the long tail. It is enough to prove traction, but not enough to prove perfect diversification publicly.'
