chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, origin, and business model
        blocks:
          - type: paragraph
            body: >-
              Moove now presents itself as the infrastructure layer for mobility at scale, not merely as a
              vehicle-financing startup. The homepage and AV operations page consistently describe a three-part
              operating model that combines capital, physical infrastructure, and city-level operations. That framing
              matters because it explains why the company believes its legacy Drive-to-Own business and its newer AV
              operations belong in the same story: both depend on financing fleet assets, keeping them charged and
              serviced, and orchestrating utilization at city scale. Public materials also show that Moove is still
              carrying the older mobility-entrepreneur mission alongside the autonomous pivot. The 2022 Series A
              coverage, the 2024 Waymo partnership announcement, and older Global Fleet coverage all describe a
              revenue-based financing model aimed at underbanked drivers or fleet entrepreneurs. What changed is the
              perimeter. By 2026, Moove is trying to apply the same asset-finance and operating discipline to autonomous
              fleets, depot infrastructure, and 24/7 command operations. The company’s origin remains anchored in a 2020
              Nigeria-founded story, but its headquarters and capital center have clearly shifted toward Dubai and the
              UAE as the business internationalized.
