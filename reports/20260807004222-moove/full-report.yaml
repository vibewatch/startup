            body: >-
              The topline growth path is one of the clearest parts of the public record. In March 2024, Moove said ARR
              had exceeded $115 million in 2023. In January 2025, the Kovi acquisition pushed consolidated ARR above
              $275 million. By October 2025, Moove said it was on course for approximately $400 million in ARR, and by
              August 2026 it claimed $420 million ARR alongside 42,000 vehicles across 29 cities and 13 countries. Those
