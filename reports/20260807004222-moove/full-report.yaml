      - number: '7.3'
        title: Partner, capital, and execution risk
        blocks:
          - type: paragraph
            body: >-
              Moove’s riskiest dependencies sit at the intersection of partners, capital, and rollout timing. Waymo is a
              powerful anchor account, but also a concentration risk because it owns the autonomy stack and rider
              surface. Uber is a valuable historical channel, but its platform power reminds investors how mediated
              customer access can be. Kovi reduces some fleet-density risk, but does not solve permits or partner
              concentration. Meanwhile, the capital required for fleet ownership and Nest buildout creates a second
              layer of exposure: if cost of capital worsens, or site economics underperform, growth can slow even when
              demand stays strong. Fast hiring adds a third layer. Scaling from roughly 150 to 500 AV workers in a year
              may be necessary, but it increases onboarding and coordination risk at the exact moment the product is
              entering more regulated and operationally visible markets. In practice, these risks can stack on top of
              one another instead of appearing one at a time. Correlation between these risks is a material concern.
