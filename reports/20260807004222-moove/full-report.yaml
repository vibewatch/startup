      - number: '7.2'
        title: Operational and quality risk
        blocks:
          - type: paragraph
            body: >-
              Moove’s differentiation concentrates risk in the physical layer. The company is volunteering to own or
              orchestrate depots, charging, maintenance, readiness, and command operations. That is precisely where
              small operational failures can compound into low utilization, missed launches, or unhappy partners.
              Axios’s reporting on depot and land constraints makes this more concrete: even a strong strategy can stall
              if permits, sites, grid access, or facility readiness slip. Public sources do not provide the quality
              metrics that would reduce uncertainty here. There is no public uptime series, no incident dashboard, and
              no operating SLO pack. As a result, investors have to trust the specificity of Moove’s stated workflows
              more than they can verify their consistent quality today. The risk is not only catastrophe; it is also
              quietly mediocre execution that erodes returns over time. Hidden variability is often the enemy in
              operational businesses everywhere.
