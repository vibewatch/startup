              - CV040
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV006
              - CV007
              - CV022
              - CV036
              - CV040
      - number: '8.2'
        title: Thesis vs discount
        blocks:
          - type: paragraph
            body: >-
              The positive case is substantial. Moove has real scale, a credible institutional investor base, a named
              flagship AV relationship, and a growth path from more than $115 million ARR in 2023 to $420 million ARR by
              2026. That is enough to justify taking the company seriously as infrastructure rather than as a niche
              vehicle-financer. The discount case is equally real. Public sources still point to capital intensity,
              partner concentration, regulatory gating, and private-metric opacity. Gasgoo’s profitability warning, The
              Ken’s channel-concentration evidence, and the weak filing visibility all suggest the latest mark should
              not be treated as an automatic bargain. The right investment debate is therefore not whether Moove is
              important, but whether current proof is strong enough to earn more than a moderate premium to risk. This
              is why the thesis can be attractive without being underwritten as if it were already a mature, cleanly
              disclosed software platform.
            claimRefs:
              - CV006
              - CV007
              - CV015
              - CV016
              - CV017
              - CV018
              - CV019
              - CV030
              - CV031
              - CV032
