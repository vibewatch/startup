      - number: '2.2'
        title: Sizing lenses and economic shape
        blocks:
          - type: paragraph
            body: >-
              Public sizing has to be handled as a range, not a single heroic TAM. Robotaxi specialists such as Fortune,
              Future Market Insights, Grand View, and BCG all point toward a fast-growing category, but they are
              measuring different things: some are sizing robotaxi revenue, some fleet value, some infrastructure or
              service layers, and some adoption in vehicles rather than dollars. BCG is especially useful because it
              ties demand to economics rather than just headline TAM. It estimates that entering a city can cost $15
              million to $30 million, that rollout stays gradual, and that operator breakeven may require 15,000 to
              20,000 vehicles across 10 to 15 cities. That suggests Moove’s real SAM is not “all robotaxis” but the
              subset of cities and operators that choose outsourced physical infrastructure. The broader
              fleet-management market is much larger in absolute dollars, but only a slice of it maps to the specialized
              AV-operations layer Moove is pursuing. The honest conclusion is that the TAM is big, the SAM is
              meaningful, and the SOM is still opaque without partner-level rollout data.
