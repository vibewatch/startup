  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risk
        blocks:
          - type: paragraph
            body: >-
              Regulation is not background noise for Moove’s AV strategy; it is part of the product surface. CPUC permit
              stages, NHTSA crash-reporting obligations, UK rollout rules, and the legal framework in the Automated
              Vehicles Act all show that commercialization is permissioned, monitored, and potentially reversible. That
              does not make Moove unusually risky relative to the AV sector; it makes the company highly exposed to
              sector reality. The most important implication is that Moove cannot scale simply by raising capital and
              signing partners. It must keep operating inside market-by-market rulebooks that shape launch timing,
              safety obligations, and liability exposure. Public materials are encouraging because they show frameworks
              are being built. They are risky because they also show those frameworks are detailed, ongoing, and
              expensive to satisfy. This is a business where legal and compliance readiness can be as growth-critical as
              sales execution. It also means new-city expansion is partly a policy execution challenge today globally.
            claimRefs:
              - CR001
