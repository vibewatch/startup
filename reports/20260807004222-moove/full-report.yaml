      - number: '1.2'
        title: Leadership bench, governance visibility, and footprint
        blocks:
          - type: paragraph
            body: >-
              The public leadership record is visible enough to trust the company’s founder continuity, but not complete
              enough to satisfy full late-stage governance diligence. Ladi Delano and Jide Odunsi remain the recurring
              co-founder and co-CEO faces across company materials, while the Series C release adds Delano’s
              advisory-board-chairman title and the 2023 announcement adds Miguel Rodrigues as the first CFO. That
              combination signals an organization that is maturing its finance and public-market readiness
              infrastructure as scale increases. What remains weak is board visibility. The investor page highlights
              investors and impact metrics, but it does not publish a current board roster, committees, or an
              independent-governance framework. Public footprint disclosure also evolved materially over time. The
              investor page still shows an older 11-city footprint, while the 2025 and 2026 financing and Waymo
              materials use a 29-city figure and a broader five-continent or 13-country narrative. The correct reading
              is not that the company is inconsistent about being global; it is that its public-facing surfaces have not
              all been refreshed to the same date standard. Later chapters should therefore treat the 2025-2026
              financing and Waymo materials as the canonical current footprint anchors.
