  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and category definition
        blocks:
          - type: paragraph
            body: >-
              Moove’s current market should not be defined as autonomous-driving software, generic ride hailing, or all
              vehicle financing. The cleaner boundary is the layer that sits between AV developers or mobility platforms
              and live commercial service: fleet ownership or financing, depots, charging, cleaning, maintenance,
              insurance, dispatch tooling, and city operations. The AV operations page and the 2026 Series C release
              both reinforce this narrower framing. That distinction matters because it narrows the addressable spend to
              the budgets that help an AV platform actually keep cars earning fares in a city. It also explains why
              Moove can plausibly bridge from its earlier Drive-to-Own business into autonomy. In both cases the company
              is underwriting vehicles, optimizing uptime, and orchestrating local operations. The difference is that
              the autonomous market raises the infrastructure intensity and lowers tolerance for downtime. In practice,
              Moove competes against internal build, multi-vendor assembly of depot and fleet services, or alternative
              integrated operators rather than against every autonomous-software team in the world.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
