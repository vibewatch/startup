      - number: '1.3'
        title: Funding history, scale, and strategic counterparties
        blocks:
          - type: paragraph
            body: >-
              Moove’s funding arc is unusually clear for a private company at this stage. The 2024 Series B set a $750
              million benchmark while bringing Uber into the round alongside Mubadala, and the 2026 Series C lifted the
              public valuation anchor to $2.1 billion. Company-backed and partner-backed sources align on the size of
              the latest round, the leadership of Mubadala, Woven Capital, and Ion Pacific, and the presence of a
              broader institutional syndicate that includes BlackRock, Franklin Templeton, MUFG, and Uber. The capital
              story also intersects directly with operating scale. By August 2026, Moove says it had reached roughly
              42,000 vehicles across 29 cities and 13 countries, with $420 million ARR and 3,300 employees. Historical
              markers show a credible stair-step: 2024 sources referenced more than 20,000 customers, more than 30
              million trips, and $115 million ARR; late-2024 Waymo materials lifted the mobility-entrepreneur count
              above 30,000 and trips above 50 million; the 2025 Kovi acquisition took fleet count to 36,000 and ARR
              above $275 million before the 2026 Series C step-up. The public record therefore supports a real scaling
              company, even though the current debt stack and concentration profile remain private.
