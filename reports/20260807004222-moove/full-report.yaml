  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Current valuation anchor
        blocks:
          - type: paragraph
            body: >-
              The cleanest valuation anchor is the one the market itself just set: $2.1 billion post-money against
              approximately $420 million ARR in August 2026. That implies about a 5.0x ARR multiple on the disclosed
              topline. On its face, that is not absurd for a company growing this quickly, especially one that has
              turned a 2024 $750 million mark into a much larger business with clearer AV relevance by 2026. The reason
              investors should still be careful is that this is not software ARR in the cleanest sense. Moove’s revenue
              sits inside a capital-hungry, operationally dense model that still depends on sites, vehicles, partners,
              and regulatory progress. The current mark therefore deserves to be treated as a real market-clearing
              datapoint, but not as proof that the business has already de-risked its hardest economics. The right read
              is that public data justify taking the latest round seriously while still reserving judgment on how much
              of today’s ARR can convert into durable enterprise value.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV022
              - CV023
              - CV024
              - CV025
          - type: table
