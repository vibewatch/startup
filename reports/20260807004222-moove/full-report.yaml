      - number: '8.4'
        title: Recommendation and diligence next steps
        blocks:
          - type: paragraph
            body: >-
              The most supportable recommendation is constructive but conditional. Moove’s latest valuation is
              defendable because the company has clearly crossed from story to scale, and because a 5.0x ARR mark is not
              obviously excessive for this growth profile. But it is not compelling enough to justify blind aggression
              while critical proof points remain private. Investors should support continued diligence and engagement,
              not treat the round as a simple bargain. Confidence should be moderate. The main upside trigger is proof
              that margins and site economics are better than feared; the main downside trigger is proof that partner,
              regulatory, or capital constraints are worse than the round narrative implies. In other words, Moove
              deserves a positive watch / selective-back stance, with pricing discipline and explicit kill criteria.
              That stance keeps room to invest, but only with explicit diligence gates around contracts, economics, and
              liability allocation.
