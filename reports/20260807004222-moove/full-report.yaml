      - number: '3.4'
        title: Competitive verdict
        blocks:
          - type: paragraph
            body: >-
              The public record supports a nuanced verdict. Moove is not just another African vehicle-financing startup
              once the Waymo and Kovi milestones are incorporated; it has moved into a distinctive orchestration niche
              around autonomous fleet infrastructure. Yet the evidence also argues against treating that niche as a
              winner-take-all moat. Vertically integrated operators can bypass it, Uber can squeeze it from the channel
              side, charging and depot specialists can unbundle parts of its offer, and incumbents with capital can
              imitate pieces of the service stack. The strongest investment interpretation is that Moove has created a
              relevant position in a hard operational wedge of the AV ecosystem. The weakest interpretation would be to
              confuse that wedge with permanent control over the ecosystem. Competitive durability exists, but it still
              needs to be earned in contracts, execution, and economics rather than assumed from narrative alone. The
              chapter therefore supports a differentiated-but-fragile position: strategically relevant, operationally
              hard, and still exposed to platform power from larger partners and rivals. That framing is important
              because investors should expect negotiation leverage to shift market by market rather than stay
              permanently fixed in Moove’s favor.
            claimRefs:
              - CP032
              - CP033
              - CP034
              - CP035
              - CP036
