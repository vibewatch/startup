            body: >-
              Moove’s differentiation is primarily operational breadth. Compared with Waymo, the company owns less of
              the autonomy stack and none of the rider-facing software surface, but it offers more willingness to
              finance, own, charge, service, and operationalize fleets. Compared with charging specialists, it aims to
              own a broader slice of the stack. That breadth is meaningful, but it comes with dependencies that remain
              visible in public sources. Waymo still controls the AV system and service experience. Uber and other large
              platforms can offer adjacent infrastructure layers of their own. Depot land, charging, and city-by-city
              regulatory readiness remain external constraints. Product maturity is therefore mixed: the operating
              playbook looks real and increasingly global, while the technical defensibility of the command layer
              remains under-disclosed. Investors should interpret Moove as an industrial operating platform with
              software elements, not as a self-contained autonomy company. That means diligence should test
