        title: Trust, safety, and quality controls
        blocks:
          - type: paragraph
            body: >-
              The strongest trust evidence is operational, not certification-heavy. Moove has publicly described
              customer safety training that covers incident reporting, driver readiness, contract understanding, mental
              health, and regulatory compliance. It also wraps insurance or support benefits into parts of the driver
              business. For AV operations, the relevant outside context comes from regulators and safety bodies rather
              than from Moove-specific audits. NHTSA emphasizes that automated-vehicle deployment still requires careful
              safety validation and cybersecurity safeguards, while the UK’s AV Act shows that self-driving rollout
              comes with ongoing legal and safety obligations. Waymo’s own safety materials reinforce how much
              validation, policy discipline, and ongoing testing sit behind commercial AV service. What is missing is
              equally important: there is no public reliability dashboard, no public cybersecurity assurance note, and
              no public engineering disclosure that would let outsiders inspect the command systems behind the marketing
              copy. The right quality verdict is therefore cautious confidence in Moove’s operating seriousness, paired
              with clear requests for deeper technical and safety evidence. In short, process discipline is visible, but
              measurable software assurance is not.
