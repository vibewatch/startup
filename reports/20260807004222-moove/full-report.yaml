  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and alternative classes
        blocks:
          - type: paragraph
            body: >-
              Moove does not compete in only one lane. Its autonomous fleet narrative touches several adjacent budgets:
              AV operators deciding whether to outsource fleet ownership and physical operations; charging and depot
              operators selling infrastructure; fleet-leasing incumbents serving enterprise vehicle budgets; and
              substitute vehicle-access products that solve earlier-stage supply problems. That makes the real landscape
              more varied than a simple robotaxi peer set. The most direct alternative is vertical integration, where
              the AV developer or marketplace owns the autonomy stack, rider demand, and much of the operating layer
              itself. Waymo and Zoox sit closest to that model. Uber is trickier because it can act as demand channel,
              operating partner, and infrastructure builder at once. Zeem and ChargePoint overlap with only slices of
              Moove’s stack, especially charging and depot services. FlexClub, Planet42, Autochek, Virtuo, and Ayvens
              sit further away, but they still matter because they show what buyers can source separately if they do not
              want Moove’s full bundle.
