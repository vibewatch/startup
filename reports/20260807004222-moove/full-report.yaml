            body: >-
              The right risk verdict is not that Moove is unusually fragile. It is that the company has chosen a
              strategically important layer of the AV stack where risk shows up as execution burden, partner dependence,
              and capital drag rather than as pure R&D burn. That can be investable, but only if investors are explicit
              about what would falsify the thesis. The clearest kill criteria are loss of flagship partners, regulatory
              reversals, inability to open or operate depots on time, or proof that economics stay structurally weak
              even after scale arrives. Public mitigations—fresh capital, finance leadership, Kovi, and deeper Waymo
              scope—are meaningful, but incomplete. The business looks more manageable than mysterious, yet still too
              dependent on private operating evidence to wave away the downside casually. Investors should insist on a
              written kill-criteria framework before treating execution risk as tolerable in serious underwriting.
            claimRefs:
              - CR020
              - CR021
              - CR023
              - CR028
              - CR029
              - CR033
              - CR034
              - CR035
          - type: table
            tableRef: TR005
