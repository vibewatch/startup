  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              Moove’s revenue model has widened materially since launch. The original engine was revenue-based vehicle
              finance: drivers accessed vehicles, Moove collected weekly payments from their earnings, and customers
              could work toward ownership over 12 to 48 months. That model still matters because it explains the
              company’s strengths in underwriting productive mobility assets, embedding into platforms, and wrapping
              vehicle access with insurance or other services. By 2026, however, the economic story is no longer only
              about driver finance. The Series C announcement and AV pages frame Moove as a provider of autonomous fleet
              ownership, depots, charging, servicing, and command operations. That means the revenue mix likely includes
              financing spread, operational services, depot or charging economics, and ancillary monetization such as
              advertising or insurance. Public sources are directionally useful but incomplete. They confirm that Moove
              has intentionally layered additional services onto its base product, yet they do not disclose the exact
              split between financing income, operating services, and non-core revenue lines. The business should
              therefore be treated as recurring-ish and service-heavy, not as a pure fintech lender or pure SaaS
              platform.
