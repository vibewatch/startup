      - number: '2.4'
        title: Constraints, contradictions, and market read
        blocks:
          - type: paragraph
            body: >-
              The most important market insight is that this category is real but structurally slower than promotional
              TAM charts imply. Regulation remains fragmented. The UK is moving toward 2026 deployment, but the US still
              depends on permit-by-permit and state-by-state progress. Depot infrastructure is a hard bottleneck: land,
              megawatts, zoning, and dead-mile minimization all matter. Profitability is also unsettled. Gasgoo, Axios,
              and BCG all make different versions of the same point: city-level proof may arrive well before
              company-level profitability. That is why Moove’s pitch is timely. If autonomy does become an
              infrastructure race, integrated fleet operators should matter more. But it is also why investors should
              avoid assuming a smooth, immediate S-curve. The market likely compounds through repeated city launches,
              platform partnerships, and infrastructure buildouts rather than one instantaneous software-like land grab.
              For diligence, the critical missing step is a Moove-specific city-by-city bottom-up model, not another
              top-down TAM headline.
            claimRefs:
              - CM020
              - CM021
              - CM022
              - CM025
              - CM026
              - CM027
              - CM030
              - CM031
              - CM033
              - CM034
