  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and channel structure
        blocks:
          - type: paragraph
            body: >-
              Moove’s customer story is structurally more complex than a standard B2B or B2C startup. In the original
              model, the economically relevant customer was the mobility entrepreneur: a driver or small operator using
              Moove-financed vehicles to earn income on ride-hailing or related platforms. But distribution often ran
              through platform relationships, most notably Uber. In the newer AV model, the named enterprise
              counterparty becomes the important customer relationship because Moove is selling fleet ownership and
              operational services to autonomy platforms rather than to individual drivers. Public sources therefore
              support a two-sided customer map. There are end-driver customers, there are platform-mediated driver
              cohorts, and there are enterprise partners such as Waymo. That complexity matters because customer breadth
              can look impressive on jobs, trips, or fleet counts while still being concentrated through a small number
              of large channels. Investors should therefore carefully separate user breadth from channel power every
              time they assess customer quality.
