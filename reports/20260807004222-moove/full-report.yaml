      - number: '1.4'
        title: Milestones, acquisitions, and adverse context
        blocks:
          - type: paragraph
            body: >-
              The milestone record shows a company broadening from driver finance into a more complex infrastructure and
              operating platform. The critical transitions are not subtle: the 2024 Waymo partnership moved Moove into
              Phoenix and Miami fleet operations, the January 2025 Kovi acquisition deepened Latin American reach while
              adding IoT and driver-behavior software, the October 2025 Waymo expansion made London the first
              international AV market, and the August 2026 Series C explicitly repositioned Moove around autonomous
              fleet ownership and robotics-first depots. Those steps support management’s claim that its category is not
              software autonomy alone but the operating layer underneath commercial deployment. The adverse lens is
              different from a classic scandal. Public caution centers on disclosure and execution. Board structure,
              debt detail, and concentration data are not visible. Older investor pages lag newer footprint claims. And
              the broader sector faces an expensive infrastructure bottleneck around land, power, and profitable depots.
              That is not a reason to dismiss Moove’s progress, but it is a reason to treat the overview as strong on
              growth proof and incomplete on price-setting detail.
