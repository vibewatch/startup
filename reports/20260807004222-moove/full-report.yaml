      - number: '4.3'
        title: Capital adequacy and cost structure
        blocks:
          - type: paragraph
            body: >-
              Moove’s financing history makes it clear that the company scales through a blend of equity, debt, and
              operating leverage rather than software-style capital efficiency. The 2022 Series A2 included both equity
              and debt. The 2023 Mubadala-BlackRock round combined equity, venture debt, and previously undisclosed
              capital. The March 2024 Series B update still disclosed cumulative equity and debt separately, and the
              India business added its own debt facility from Stride. These facts matter because fleet ownership,
              charging, cleaning, and maintenance all consume capital before revenue is realized. The Kovi acquisition’s
              15,000-vehicle annual ordering target and the Series B reference to 45,000 incremental vehicles show how
              much asset growth management still wants to fund. Independent coverage of robotaxi depots and charging
              constraints reinforces the same point from the outside in. Public statements about already-profitable
              markets and a September 2024 EBITDA break-even point are encouraging, but they do not remove the
              structural dependence on debt, credit lines, and asset-level financing. Moove looks financially more like
