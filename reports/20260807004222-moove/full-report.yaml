  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and module map
        blocks:
          - type: paragraph
            body: >-
              Moove’s product is easiest to understand as a transition from vehicle access to infrastructure
              orchestration. The legacy Drive-to-Own business still matters because it established Moove’s competence in
              financing, asset operations, and customer support around working vehicles. But the AV page shows a broader
              offer: autonomous fleet ownership and operations, Nest depot infrastructure, charging operations,
              maintenance and readiness, city-level monitoring, and AI-driven command systems. In practical terms, that
              is not one monolithic software product. It is a product bundle that mixes capital, depots, service
              workflows, and a control layer used to keep fleets available. This distinction matters because it explains
              both Moove’s appeal and its constraints. The company is not claiming to build the autonomous-driving
              brains. It is claiming to build the operating layer that allows those brains to run reliably at true city
              scale across multiple markets and partner configurations.
