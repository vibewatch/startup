      - number: '2.3'
        title: Buyers, payers, and adoption drivers
        blocks:
          - type: paragraph
            body: >-
              The buyer map centers on fleet operators, AV developers, ride-hailing platforms, and infrastructure
              owners, but the payer often changes by contract. Waymo illustrates the operator side: its public ride
              surface proves commercial service demand, while Moove’s partnership shows that a developer can outsource
              live fleet operations. Uber illustrates the distribution and orchestration side: its AV page openly states
              that mapping, regulatory access, insurance, depot tools, and fleet operations are part of
              commercialization. The market is therefore multi-sided. The user is the rider or shipper, the buyer may be
              a platform or AV program leader, and the payer can be the party funding vehicles, depots, or service
              uptime. Macro drivers help, but they do not eliminate execution friction. Safety, congestion, urban
              transport demand, and smart-city policy all support growth. Yet the actual gating variables are
              throughput, power availability, cleaning and maintenance workflows, and a reliable way to amortize
              expensive infrastructure across enough miles or trips.
