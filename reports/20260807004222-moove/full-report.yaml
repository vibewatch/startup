      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The public financial verdict is constructive but incomplete. The positive case is strong enough to matter:
              revenue appears to have scaled quickly, management publicly claimed EBITDA break-even in late 2024, and
              the company has continued to attract debt and equity capital from credible institutions. The negative case
              is equally clear: none of the price-setting or risk-setting metrics that would let an investor underwrite
              this business with precision are public. There is no public cash balance, debt-balance bridge, gross
              margin schedule, delinquency data, unit payback, or partner concentration table, and the easily accessible
              UK filing history reflects only a dormant local entity rather than current group economics. That makes
              Moove look more fundable than fully priceable. The right conclusion is therefore not that the economics
              are weak, but that the economics are still partly hidden inside an asset-heavy, operationally complex
              business. Investors should treat the topline growth and break-even claim as a reason to keep working,
              while reserving judgment on true cash efficiency until direct diligence fills in the unit-economics and
