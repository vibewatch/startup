      - number: '3.3'
        title: Switching costs, channel power, and moat durability
        blocks:
          - type: paragraph
            body: >-
              Moove’s moat looks operational before it looks technological. The company’s advantage, if it endures,
              comes from doing hard physical work that many software-heavy AV players do not want to do: financing or
              owning vehicles, sourcing supply, standing up depots, charging fleets, and running day-to-day operations.
              The Kovi acquisition and Waymo relationship reinforce that position. But the same evidence also sets the
              limits of the moat. Contracts can be re-bid. Depot services can be multi-homed. Charging can be bought
              from specialists. Uber can internalize more of the stack. Waymo can keep more functions in-house. In other
              words, Moove’s integration depth may create real switching friction, but not absolute lock-in. The space
              is attractive precisely because depots, land, charging, and operations are strategic bottlenecks, and that
              means more infrastructure capital is likely to crowd in.
