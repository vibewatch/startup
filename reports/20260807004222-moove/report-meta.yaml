  topStrengths:
    - "Real scale is already visible: roughly 42,000 vehicles, 29 cities, 13 countries, and about $420M ARR by August 2026."
    - "The Waymo relationship gives Moove unusually strong named proof that its AV fleet-infrastructure layer is commercially relevant."
    - "Product scope is concrete and differentiated around fleet ownership, depots, charging, maintenance, and command operations rather than slideware autonomy claims."
    - "Investor quality and repeated access to capital suggest institutional confidence in Moove's ability to keep building global fleet infrastructure."
  topRisks:
    - "Unit economics, gross margin, cash conversion, and site-level returns remain largely private, limiting conviction on whether ARR translates into durable value."
    - "Partner concentration risk is material because major channels and flagship AV programs can shape demand, bargaining power, and renewal outcomes."
    - "Regulatory and liability burdens in AV operations can delay launches, raise operating cost, or compress realized value from nominal fleet scale."
    - "The business model remains capital-intensive, so financing availability and asset utilization matter more than they would in a pure software company."
    - "Public-company-style disclosure is weak relative to the valuation, making downside harder to size with precision."
  unresolvedGaps:
    - "Depot- and market-level unit economics, including margins, charger utilization, and readiness costs."
    - "Signed partner contract terms, renewal mechanics, indemnities, and insurance allocation."
    - "Consolidated audited financial statements, debt schedule, and cash runway detail."
    - "Revenue concentration by partner, market, and customer cohort."
    - "Evidence that EBITDA break-even and operating discipline generalize beyond selected markets or announcements."
disclaimer: This report is an AI-assisted diligence summary based on publicly available information as of 2026-08-07 and is not investment advice. Moove is a private company with limited disclosure, so important financial, contractual, legal, and governance details remain unknown or only indirectly inferable from public sources.
