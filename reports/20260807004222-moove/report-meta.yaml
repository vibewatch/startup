companyProfile:
  summary: Moove is a Nigeria-founded, Dubai-headquartered mobility infrastructure company that expanded from revenue-based vehicle finance into a global operator of fleet ownership, depots, charging, maintenance, and command systems for both driver-led and autonomous fleets. Its strongest current proof points are the Waymo partnership, rapid scale from launch to roughly 42,000 vehicles across 29 cities and 13 countries, and disclosed ARR of about $420 million by the August 2026 Series C.
  foundedDate: '2020-01-01'
  founders:
    - name: Ladi Delano
      role: Co-founder and co-CEO
      background: Public-facing co-founder and co-CEO across 2024-2026 company materials; also identified as advisory board chairman in the 2026 Series C announcement.
      claimRefs: [CO005, CO008, CO009]
    - name: Jide Odunsi
      role: Co-founder and co-CEO
      background: Public-facing co-founder and co-CEO across 2024-2026 company materials.
      claimRefs: [CO005, CO008]
  foundingLocation: Lagos, Nigeria
  headquarters: Dubai, United Arab Emirates
  productSummary: Moove sells a hybrid operating stack that combines vehicle financing or ownership, robotics-first Nest depots, charging, maintenance, readiness workflows, and 24/7 command operations for mobility-platform partners and legacy driver customers.
  customerFocus: Mobility entrepreneurs and drivers in the legacy business, plus enterprise mobility and autonomous-vehicle platforms such as Waymo in the AV business.
  businessModel: Capital-intensive vehicle-as-a-service and fleet-operations model that earns from financed or owned fleet deployment, bundled operations infrastructure, and partner service delivery rather than from pure autonomy software licensing.
  stage: late-stage private / Series C
  fundingStatus: $250M Series C announced on 2026-08-05 at a $2.1B post-money valuation; public materials also describe more than $500M of cumulative equity and debt financing.
  disclosureProfile: private-undisclosed
