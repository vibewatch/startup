company:
  name: Moove
chapter:
  number: 1
  title: Company Overview
  summary: Moove is a Nigeria-founded, UAE-headquartered mobility infrastructure company that has expanded from revenue-based driver financing into a global fleet owner and operator for both manned and autonomous transport. Public 2024-2026 evidence supports a rise from a $750 million Series B benchmark and $115 million ARR in 2024 to a $250 million Series C at a $2.1 billion valuation, roughly 42,000 vehicles across 29 cities and 13 countries, and $420 million ARR by August 2026. The growth narrative is strong and increasingly tied to Waymo and AV infrastructure, but public disclosure still falls short on board structure, debt economics, customer concentration, and margin quality.
sections:
- id: identity-and-business-model
  title: Identity, origin, and business model
  body: 'Moove now presents itself as the infrastructure layer for mobility at scale, not merely as a vehicle-financing startup. The homepage and AV operations page consistently describe a three-part operating model that combines capital, physical infrastructure, and city-level operations. That framing matters because it explains why the company believes its legacy Drive-to-Own business and its newer AV operations belong in the same story: both depend on financing fleet assets, keeping them charged and serviced, and orchestrating utilization at city scale. Public materials also show that Moove is still carrying the older mobility-entrepreneur mission alongside the autonomous pivot. The 2022 Series A coverage, the 2024 Waymo partnership announcement, and older Global Fleet coverage all describe a revenue-based financing model aimed at underbanked drivers or fleet entrepreneurs. What changed is the perimeter. By 2026, Moove is trying to apply the same asset-finance and operating discipline
    to autonomous fleets, depot infrastructure, and 24/7 command operations. The company’s origin remains anchored in a 2020 Nigeria-founded story, but its headquarters and capital center have clearly shifted toward Dubai and the UAE as the business internationalized.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
