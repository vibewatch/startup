- id: leadership-governance-and-operating-footprint
  title: Leadership bench, governance visibility, and footprint
  body: The public leadership record is visible enough to trust the company’s founder continuity, but not complete enough to satisfy full late-stage governance diligence. Ladi Delano and Jide Odunsi remain the recurring co-founder and co-CEO faces across company materials, while the Series C release adds Delano’s advisory-board-chairman title and the 2023 announcement adds Miguel Rodrigues as the first CFO. That combination signals an organization that is maturing its finance and public-market readiness infrastructure as scale increases. What remains weak is board visibility. The investor page highlights investors and impact metrics, but it does not publish a current board roster, committees, or an independent-governance framework. Public footprint disclosure also evolved materially over time. The investor page still shows an older 11-city footprint, while the 2025 and 2026 financing and Waymo materials use a 29-city figure and a broader five-continent or 13-country narrative. The correct
    reading is not that the company is inconsistent about being global; it is that its public-facing surfaces have not all been refreshed to the same date standard. Later chapters should therefore treat the 2025-2026 financing and Waymo materials as the canonical current footprint anchors.
  claimRefs:
  - CO008
  - CO009
  - CO010
  - CO011
  - CO033
  - CO034
  - CO035
  tableRefs:
  - TO002
- id: capital-formation-scale-and-strategic-partners
  title: Funding history, scale, and strategic counterparties
  body: 'Moove’s funding arc is unusually clear for a private company at this stage. The 2024 Series B set a $750 million benchmark while bringing Uber into the round alongside Mubadala, and the 2026 Series C lifted the public valuation anchor to $2.1 billion. Company-backed and partner-backed sources align on the size of the latest round, the leadership of Mubadala, Woven Capital, and Ion Pacific, and the presence of a broader institutional syndicate that includes BlackRock, Franklin Templeton, MUFG, and Uber. The capital story also intersects directly with operating scale. By August 2026, Moove says it had reached roughly 42,000 vehicles across 29 cities and 13 countries, with $420 million ARR and 3,300 employees. Historical markers show a credible stair-step: 2024 sources referenced more than 20,000 customers, more than 30 million trips, and $115 million ARR; late-2024 Waymo materials lifted the mobility-entrepreneur count above 30,000 and trips above 50 million; the 2025 Kovi acquisition
    took fleet count to 36,000 and ARR above $275 million before the 2026 Series C step-up. The public record therefore supports a real scaling company, even though the current debt stack and concentration profile remain private.'
