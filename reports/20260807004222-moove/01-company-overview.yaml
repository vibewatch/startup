    - Lead investor and strategic backer
    - Led 2026 Series C and backed earlier rounds.
    - Likely major governance and follow-on influence.
    - Confirm current ownership, board rights, and whether any protective provisions changed in Series C.
  - - Woven Capital
    - Toyota growth-fund co-lead on Series C
    - Co-led the 2026 round and publicly framed infrastructure as the core bottleneck in AV scale-up.
    - Strategic auto and mobility signal beyond pure capital.
    - Clarify any commercial links to Toyota or portfolio collaboration rights.
  - - Uber
    - Investor and major platform partner
    - Participated in Series B and is repeatedly described as Moove’s largest global fleet partner.
    - Potentially material commercial and signaling influence.
    - Request revenue concentration, contract terms, and any exclusivity or preferred-supplier clauses.
  - - Waymo
    - Anchor AV operating partner
    - Moove manages or prepares fleet operations for Phoenix, Miami, and London.
    - Strategically central to AV story even without disclosed equity control.
    - Confirm ownership of vehicles, economics split, SLA terms, and expansion rights.
  - - Kovi / Brazil acquisition
    - Acquired platform and software asset
    - Added fleet scale, LATAM presence, and IoT software in Jan. 2025.
    - Operationally meaningful for Moove’s AI and LATAM expansion.
    - Validate retention, earn-out terms, and integration milestones.
