    severity: minor
    topic: market-sizing-lens-table coverage
    missingEvidence: A single apples-to-apples dataset linking robotaxi vehicles, depot megawatts, fleet-operations spending, and outsourced-operator take rates.
    whyItMatters: Top-down estimates use different definitions, so the table is intentionally partial rather than falsely exhaustive.
    diligencePath: Build a bottom-up city model from signed launches, expected vehicles per depot, and third-party operator scope.
