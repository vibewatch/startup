chapter:
  number: 2
  title: Market Analysis
  summary: Moove’s market is best framed as the outsourced infrastructure and operations layer required to commercialize robotaxi and high-utilization mobility fleets, not as autonomous-driving software or generic ride hailing. Public 2026 sources support a large long-dated robotaxi TAM and a broader multi-tens-of-billions fleet-management backdrop, but they also show that city-entry costs, depot power, permits, and profitable scale remain hard constraints. The practical conclusion is that Moove’s SAM is real and expanding, yet the company-specific SOM still needs a bottom-up city and partner model rather than a single headline TAM number.
sections:
- id: market-boundary-and-category-definition
  title: Market boundary and category definition
  body: 'Moove’s current market should not be defined as autonomous-driving software, generic ride hailing, or all vehicle financing. The cleaner boundary is the layer that sits between AV developers or mobility platforms and live commercial service: fleet ownership or financing, depots, charging, cleaning, maintenance, insurance, dispatch tooling, and city operations. The AV operations page and the 2026 Series C release both reinforce this narrower framing. That distinction matters because it narrows the addressable spend to the budgets that help an AV platform actually keep cars earning fares in a city. It also explains why Moove can plausibly bridge from its earlier Drive-to-Own business into autonomy. In both cases the company is underwriting vehicles, optimizing uptime, and orchestrating local operations. The difference is that the autonomous market raises the infrastructure intensity and lowers tolerance for downtime. In practice, Moove competes against internal build, multi-vendor
    assembly of depot and fleet services, or alternative integrated operators rather than against every autonomous-software team in the world.'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
  tableRefs:
  - TM001
  figureRefs: []
- id: sizing-lenses-and-economic-shape
  title: Sizing lenses and economic shape
  body: 'Public sizing has to be handled as a range, not a single heroic TAM. Robotaxi specialists such as Fortune, Future Market Insights, Grand View, and BCG all point toward a fast-growing category, but they are measuring different things: some are sizing robotaxi revenue, some fleet value, some infrastructure or service layers, and some adoption in vehicles rather than dollars. BCG is especially useful because it ties demand to economics rather than just headline TAM. It estimates that entering a city can cost $15 million to $30 million, that rollout stays gradual, and that operator breakeven may require 15,000 to 20,000 vehicles across 10 to 15 cities. That suggests Moove’s real SAM is not “all robotaxis” but the subset of cities and operators that choose outsourced physical infrastructure. The broader fleet-management market is much larger in absolute dollars, but only a slice of it maps to the specialized AV-operations layer Moove is pursuing. The honest conclusion is that the TAM
    is big, the SAM is meaningful, and the SOM is still opaque without partner-level rollout data.'
  claimRefs:
  - CM006
  - CM007
  - CM008
  - CM009
  - CM010
  - CM011
  - CM012
  - CM013
  - CM032
  - CM034
