- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk area
  - Visible mitigation
  - Kill trigger
  - Investor check
  rows:
  - - Partner concentration
    - Waymo expansion and broader market ambition
    - Loss or material shrinkage of flagship partner scope
    - Check renewal rights and pipeline depth
  - - Capital intensity
    - $250M Series C and institutional backers
    - Inability to finance fleet / Nest rollout on acceptable terms
    - Check cost of capital and runway
  - - Regulatory gating
    - Named rollout jurisdictions with active frameworks
    - Permit reversal or major approval delay
    - Check regulatory calendar and contingency plans
  - - Operational quality
    - Specific operating scope and fleet-management experience
    - Persistent low utilization, outages, or safety incidents
    - Check city dashboards and incident reviews
  notes: These are the conditions under which an execution story becomes a thesis-break.
