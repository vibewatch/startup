chapter:
  number: 7
  title: Risks
  summary: Moove’s risk profile is high but understandable. The company is exposed to permissioned AV rollout, partner concentration, physical-site and charging bottlenecks, capital intensity, and execution strain from scaling an operationally complex product across cities. The positive read is that these are visible, legible risks rather than mysterious ones. The negative read is that many of the most important mitigants—contract allocation, insurance structure, site economics, and quality metrics—are still private.
sections:
- id: regulatory-and-legal-risk
  title: Regulatory and legal risk
  body: Regulation is not background noise for Moove’s AV strategy; it is part of the product surface. CPUC permit stages, NHTSA crash-reporting obligations, UK rollout rules, and the legal framework in the Automated Vehicles Act all show that commercialization is permissioned, monitored, and potentially reversible. That does not make Moove unusually risky relative to the AV sector; it makes the company highly exposed to sector reality. The most important implication is that Moove cannot scale simply by raising capital and signing partners. It must keep operating inside market-by-market rulebooks that shape launch timing, safety obligations, and liability exposure. Public materials are encouraging because they show frameworks are being built. They are risky because they also show those frameworks are detailed, ongoing, and expensive to satisfy. This is a business where legal and compliance readiness can be as growth-critical as sales execution. It also means new-city expansion is partly
    a policy execution challenge today globally.
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
  - CR006
  - CR007
  - CR022
  tableRefs:
  - TR001
  figureRefs:
  - FR001
- id: operational-and-quality-risk
  title: Operational and quality risk
  body: 'Moove’s differentiation concentrates risk in the physical layer. The company is volunteering to own or orchestrate depots, charging, maintenance, readiness, and command operations. That is precisely where small operational failures can compound into low utilization, missed launches, or unhappy partners. Axios’s reporting on depot and land constraints makes this more concrete: even a strong strategy can stall if permits, sites, grid access, or facility readiness slip. Public sources do not provide the quality metrics that would reduce uncertainty here. There is no public uptime series, no incident dashboard, and no operating SLO pack. As a result, investors have to trust the specificity of Moove’s stated workflows more than they can verify their consistent quality today. The risk is not only catastrophe; it is also quietly mediocre execution that erodes returns over time. Hidden variability is often the enemy in operational businesses everywhere.'
  claimRefs:
  - CR008
  - CR009
  - CR010
  - CR011
  - CR025
  - CR026
  - CR030
  tableRefs:
  - TR002
  figureRefs:
  - FR002
- id: partner-capital-and-execution-risk
  title: Partner, capital, and execution risk
  body: 'Moove’s riskiest dependencies sit at the intersection of partners, capital, and rollout timing. Waymo is a powerful anchor account, but also a concentration risk because it owns the autonomy stack and rider surface. Uber is a valuable historical channel, but its platform power reminds investors how mediated customer access can be. Kovi reduces some fleet-density risk, but does not solve permits or partner concentration. Meanwhile, the capital required for fleet ownership and Nest buildout creates a second layer of exposure: if cost of capital worsens, or site economics underperform, growth can slow even when demand stays strong. Fast hiring adds a third layer. Scaling from roughly 150 to 500 AV workers in a year may be necessary, but it increases onboarding and coordination risk at the exact moment the product is entering more regulated and operationally visible markets. In practice, these risks can stack on top of one another instead of appearing one at a time. Correlation between
    these risks is a material concern.'
  claimRefs:
  - CR012
  - CR013
  - CR014
  - CR015
  - CR016
  - CR017
  - CR018
  - CR019
  - CR027
  - CR031
