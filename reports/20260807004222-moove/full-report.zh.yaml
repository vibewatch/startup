      - number: '2.3'
        title: 买家、付款方与采用驱动因素
        blocks:
          - type: paragraph
            body: >-
              买家地图围绕车队运营商、AV 开发商、网约车平台和基础设施业主，但付款方常随合同而变。Waymo 体现运营商一侧：公开叫车界面证明商业服务需求，Moove 合作说明开发商可以外包在线车队运营。Uber
              体现分发和编排一侧：其 AV 页面直说，地图、监管准入、保险、车场工具和车队运营都是商业化的一部分。因此，市场是多边的。用户是乘客或托运人，买家可能是平台或 AV
              项目负责人，付款方则可能是为车辆、车场或服务可用率出资的一方。宏观驱动有帮助，但不会消除执行摩擦。安全、拥堵、城市交通需求和智慧城市政策都支撑增长。但真正的门槛变量是吞吐量、电力可得性、清洁和维护流程，以及能把昂贵基础设施摊销到足够里程或出行次数上的可靠方法。
