      - number: '5.4'
        title: 信任、安全与质量控制
        blocks:
          - type: paragraph
            body: >-
              最强的信任证据在运营侧，不在认证文件堆里。Moove 公开描述过客户安全培训，内容覆盖事故报告、司机备勤、合同理解、心理健康和合规。它也把保险或支持权益打包进司机业务的一部分。对于 AV
              运营，相关外部背景更多来自监管者和安全机构，而不是 Moove 专属审计。NHTSA 强调，自动驾驶车辆部署仍需要谨慎的安全验证和网络安全防护；英国 AV Act
              则显示，自动驾驶落地伴随持续的法律和安全义务。Waymo 自身安全材料也强化了商业 AV
              服务背后有多少验证、政策纪律和持续测试。缺失项同样重要：没有公开可靠性仪表盘，没有公开网络安全保证说明，也没有公开工程披露，让外部能检查营销文案背后的指挥系统。因此，合理的质量结论是，对 Moove
              的运营严肃性保持谨慎信心，同时明确要求更深的技术和安全证据。简言之，流程纪律可见，可量化的软件保证不可见。
