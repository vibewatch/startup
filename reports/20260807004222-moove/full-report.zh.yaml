      - number: '2.2'
        title: 规模测算视角与经济形态
        blocks:
          - type: paragraph
            body: >-
              公开市场规模只能按区间处理，不能当成单一英雄式 TAM。Fortune、Future Market Insights、Grand View 和 BCG 等 Robotaxi
              专家都指向一个高速增长的类别，但测量对象不同：有的测 Robotaxi 收入，有的测车队价值，有的测基础设施或服务层，还有的按车辆采用量而不是美元计。BCG 尤其有用，因为它把需求和经济性挂钩，而不只是标题级
              TAM。BCG 估计，进入一座城市可能需要 $15 million 到 $30 million，铺开仍会渐进，运营商要达到盈亏平衡可能需要在 10 到 15 个城市部署 15,000 到 20,000
              辆车。这说明 Moove 真正的 SAM 不是「所有 Robotaxi」，而是选择外包物理基础设施的城市和运营商子集。更广义的车队管理市场按绝对美元规模更大，但只有一部分映射到 Moove 正在追逐的专业 AV
              运营层。诚实结论是：TAM 很大，SAM 有意义，但没有合作伙伴级别的铺开数据，SOM 仍然不透明。
