        title: 牵引力与公开运营指标
        blocks:
          - type: paragraph
            body: >-
              收入增长路径是公开记录里最清楚的部分之一。2024 年 3 月，Moove 称 2023 年 ARR 已超过 $115 million。2025 年 1 月，收购 Kovi 将合并 ARR 推高到 $275
              million 以上。到 2025 年 10 月，Moove 称 ARR 有望达到约 $400 million；到 2026 年 8 月，它又称 ARR 为 $420 million，同时拥有覆盖 29 个城市和
              13 个国家的 42,000 辆车。上述披露让 Moove 成为当前收入规模上曝光度较高的私营车队运营商之一。出行次数和客户数也明显增长：到 2024 年 3 月，融资车辆出行超过 30 million 次；到
              2025 年 10 月，出行超过 160 million 次；员工规模也足以支撑全球运营和快速扩张的 AV 部门。核心保留意见在收入质量。公开来源没有解释总额 ARR 与净额
              ARR、各市场贡献毛利，或留存率。因此，投资人更能相信规模确实存在，却还不能精确承销规模质量。
