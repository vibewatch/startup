      - number: '8.3'
        title: 情景与可比框架
        blocks:
          - type: paragraph
            body: >-
              直接可比的上市公司并不完美，因此情景纪律比迷信可比公司更重要。Uber 和 Lyft 这类交易平台掌握 Moove 不具备的需求入口。ChargePoint
              这类基础设施和充电公司范围更窄，当前公开市场价值也小得多，但它们展示了市场会如何严苛看待资本密集、经济性混杂的基础设施。Samsara
              这类偏软件的车队或运营平台显示，一旦披露、利润率和控制都更清楚，估值可以扩张多少；Trimble 这类运营基础设施公司也提醒我们，报告更强、工作流嵌入更深的资产会拿到不同定价。因此，Moove
              最不误导的可比框架是混合型：一部分是交易平台相邻，一部分是运营基础设施，一部分是车队管理系统。沿着这个框架，围绕当前 5.0x ARR
              估值的基准情景站得住；牛市情景需要明显去风险；如果执行失手，熊市情景仍很可能出现。可比公司最有用的是给上行和下行划边界，而不是假装今天存在一个 Moove 应该套用的精确上市倍数。
