      - number: '2.4'
        title: 约束、矛盾与市场判断
        blocks:
          - type: paragraph
            body: >-
              最重要的市场洞察是，类别真实存在，但结构上比宣传式 TAM 图更慢。监管仍然碎片化。英国正走向 2026
              年部署，但美国仍依赖逐许可、逐州推进。车场基础设施是硬瓶颈：土地、兆瓦、分区和空驶里程最小化都重要。盈利能力也未定。Gasgoo、Axios 和 BCG
              用不同版本表达同一点：城市级验证可能远早于公司级盈利。因此，Moove 的叙事正当其时。如果自动驾驶真的变成基础设施竞赛，一体化车队运营商应当更重要。但这也解释了为什么投资人不该假设一条平滑、立即到来的 S
              曲线。市场更可能靠反复开城、平台合作和基础设施建设复利增长，而不是一次瞬时的软件式圈地。尽调的关键缺口不是再找一个自上而下的 TAM 标题，而是建立 Moove 专属的逐城自下而上模型。
