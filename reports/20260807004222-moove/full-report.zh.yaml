  - id: TV004
    title: 可比估值表
    columns:
      - 参照对象
      - 公开价值 / 定价
      - 为什么重要
      - 注意事项
    rows:
      - - Moove
        - 投后估值约 $2.1B，ARR 约 $420M
        - 最新私募市场出清锚点
        - 私募披露仍薄
      - - ChargePoint
        - 市值约 $0.14B
        - 显示公开市场会怎样严苛对待基础设施偏重的 EV 敞口
        - 不是直接的 AV 车队运营商
      - - Lyft
        - 市值约 $6.18B
        - 显示经历波动后，公开网约车需求平台仍有价值
        - 拥有需求入口，而非 Moove 式基础设施
      - - Samsara
        - 市值约 $22.27B
        - 显示公开市场能给更干净的车队软件叙事很高估值
        - 披露和经济性更像软件公司
      - - Trimble
        - 市值约 $18.50B
        - 工作流软件和披露更清晰时，运营基础设施也能拿到更强估值
        - 工业软件组合比 Moove 更宽
      - - Uber
        - 市值约 $143.44B
        - 提醒多元化全球需求和平台所有权的价值上限
        - 规模和业务太大太宽，不能直接套倍数
    enumerationScope:
      coverage: sample
      basis: >-
        This is a deliberately selected sample of adjacent public archetypes used to bracket valuation rather than an
        exhaustive peer universe.
    notes: 这些是边界标记，不是直接可比对象。
