        - 会削弱 AV 验证和增长信心
        - 城市铺开减少、范围收窄或续约紧张
      - - 许可撤回或监管延迟
        - 可能拖慢上线并推高成本
        - 审批滑坡或报告负担变化
      - - 单站经济性弱
        - 可能阻碍 ARR 转化为现金回报
        - 利用率低、场站经济性差或成本超支
      - - 没有可持续利润率验证
        - 会让 5x ARR 显得昂贵
        - 盈亏平衡说法无法跨市场复制
