  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与变现
        blocks:
          - type: paragraph
            body: >-
              Moove 的收入模式自成立以来明显变宽。最初引擎是按收入还款的车辆金融：司机获得车辆，Moove 从其收入中收取每周付款，客户可在 12 到 48
              个月内逐步取得所有权。这个模型仍重要，因为它解释了公司在承保生产性出行资产、嵌入平台，以及把车辆获取与保险或其他服务包在一起上的优势。到 2026 年，经济叙事已不再只是司机金融。C 轮公告和 AV 页面把
              Moove 定位为自动驾驶车队所有权、车场、充电、服务和指挥运营的提供商。这意味着收入组合很可能包括融资利差、运营服务、车场或充电经济性，以及广告或保险等附带变现。公开来源方向上有用，但不完整。它们确认
              Moove 有意在基础产品上叠加更多服务，却没有披露融资收入、运营服务和非核心收入线之间的精确拆分。因此，应把这家公司视为服务占比高、带有一定经常性的业务，而不是纯金融科技贷款人或纯 SaaS 平台。
