        title: 格局与替代类别
        blocks:
          - type: paragraph
            body: >-
              Moove 不是只在一条赛道竞争。它的自动驾驶车队叙事触及几类相邻预算：AV
              运营商决定是否外包车队所有权和物理运营；充电和车场运营商销售基础设施；车队租赁存量玩家服务企业车辆预算；替代性的车辆获取产品解决更早期的供给问题。因此，真实格局比简单的 Robotaxi
              同业集合更复杂。最直接替代是纵向一体化：AV 开发商或市场平台自己拥有自动驾驶技术栈、乘客需求，以及大部分运营层。Waymo 和 Zoox 最接近这个模型。Uber
              更复杂，因为它可以同时做需求渠道、运营合作伙伴和基础设施建设者。Zeem 和 ChargePoint 只与 Moove
              服务栈的部分环节重叠，尤其是充电和车场服务。FlexClub、Planet42、Autochek、Virtuo 和 Ayvens 离得更远，但仍重要，因为它们说明，如果买家不想买 Moove
              的全套捆绑，仍能分别采购哪些东西。
