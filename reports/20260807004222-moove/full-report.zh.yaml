  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块地图
        blocks:
          - type: paragraph
            body: >-
              Moove 的产品最容易理解为从车辆获取转向基础设施编排。传统 Drive-to-Own 业务仍重要，因为它建立了 Moove 围绕营运车辆做融资、资产运营和客户支持的能力。但 AV
              页面展示了更宽的方案：自动驾驶车队所有权和运营、Nest 车场基础设施、充电运营、维护和备勤、城市级监控，以及 AI
              驱动的指挥系统。实际看，这不是一个单体软件产品，而是一组产品束，把资本、车场、服务流程，以及用于保持车队可用的控制层混在一起。这个区分重要，因为它同时解释了 Moove
              的吸引力和约束。公司并不声称要造自动驾驶的大脑。它声称要打造一个运营层，让这些大脑能在多市场、多合作伙伴配置下，以真实城市规模稳定运行。
