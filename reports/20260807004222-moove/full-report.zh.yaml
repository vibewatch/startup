  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与类别定义
        blocks:
          - type: paragraph
            body: >-
              Moove 当前市场不应被定义为自动驾驶软件、泛网约车，或所有车辆金融。更清晰的边界是 AV 开发商或出行平台与上线商业服务之间的那一层：车队所有权或融资、车场、充电、清洁、维护、保险、调度工具和城市运营。AV
              运营页和 2026 年 C 轮公告都强化了这个窄框架。这个区分重要，因为它把可寻址支出收窄到能帮助 AV 平台真正让车辆在一座城市里持续接单赚钱的预算。它也解释了为什么 Moove 能合理地从早期
              Drive-to-Own 业务跨到自动驾驶。两种模式下，公司都在承保车辆、优化可用率、编排本地运营。差别在于，自动驾驶市场提高了基础设施强度，也降低了对停摆的容忍度。实践中，Moove
              的竞争对象不是全球每一支自动驾驶软件团队，而是内部自建、车场和车队服务的多供应商拼装，或其他一体化运营商。
