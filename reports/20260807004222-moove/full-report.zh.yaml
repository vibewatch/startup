            body: >-
              能力对比比标题估值更重要。Waymo、Zoox、May Mobility、Motional 和 Gatik 拥有比 Moove
              更多的自动驾驶或车辆软件层，但它们并不都向外部运营商销售开放的车队基础设施服务。Uber 拥有比 Moove 更多的需求、地图和市场平台杠杆，也越来越愿意投资车场和充电。Zeem 和 ChargePoint
              在充电基础设施打包和运营承诺上，比 Moove 对其 AV 合同披露得更清楚。与此同时，传统车辆获取替代品的产品更简单，买家也更容易定价。Moove
              最强的能力位置是广度：它把融资或所有权、服务、充电和真实世界车队运营打包成一个方案。最弱的位置是，它不拥有自动驾驶技术栈，也不拥有面向消费者的需求入口。
