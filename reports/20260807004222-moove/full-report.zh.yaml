      - number: '3.4'
        title: 竞争结论
        blocks:
          - type: paragraph
            body: >-
              公开记录支持一个更细的结论。纳入 Waymo 和 Kovi 里程碑后，Moove
              已不只是另一家非洲车辆金融创业公司；它已经进入自动驾驶车队基础设施周边一个独特的编排利基。但证据同样不支持把这个利基视为赢家通吃的护城河。纵向一体化运营商可以绕开它，Uber
              可以从渠道侧挤压它，充电和车场专业商可以拆掉它方案中的部分环节，资本充足的存量玩家也能模仿服务栈的一部分。最强的投资解读是，Moove 在 AV
              生态一个艰难的运营切口里建立了相关位置。最弱的解读，是把这个切口误认为对生态的永久控制。竞争耐久性存在，但仍要靠合同、执行和经济性挣出来，不能只从叙事里假定。因此，本章支持一个差异化但脆弱的位置：具备战略相关性，运营难度高，同时仍暴露在更大合作伙伴和竞争对手的平台权力之下。这个框架重要，因为投资人应预期谈判杠杆会逐市场移动，而不是永久固定在
              Moove 一边。
