  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              监管对 Moove 的 AV 战略不是背景噪音，而是产品表面的一部分。CPUC 许可阶段、NHTSA 事故报告义务、英国上线规则和 Automated Vehicles Act
              法律框架都说明，商业化需要许可、被监控，也可能逆转。这并不让 Moove 相比 AV 行业异常高风险；它让公司高度暴露在行业现实中。最重要的含义是，Moove
              不能只靠融资和签约扩张。它必须一直在逐市场规则手册内运营，而这些规则决定上线时点、安全义务和责任敞口。公开材料令人鼓舞，因为它们显示框架正在建立。它们也带来风险，因为它们说明这些框架细致、持续且满足成本高。这是一门法律和合规准备可以和销售执行同样关键的业务。也意味着，当下在全球扩张新城市，一部分就是政策执行战。
