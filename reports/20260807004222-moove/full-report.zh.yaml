      - number: '4.3'
        title: 资本充足性与成本结构
        blocks:
          - type: paragraph
            body: >-
              Moove 的融资历史清楚表明，公司靠股权、债务和运营杠杆的组合扩张，而不是靠软件式资本效率。2022 年 A2 轮同时包含股权和债务。2023 年 Mubadala-BlackRock
              轮结合了股权、venture debt 和此前未披露资本。2024 年 3 月 B 轮更新仍分别披露累计股权和债务，印度业务又从 Stride
              拿到自己的债务工具。这些事实重要，因为车队所有权、充电、清洁和维护都要在收入实现前先消耗资本。Kovi 收购提出 15,000 辆车的年度下单目标，B 轮又提到 45,000
              辆增量车，显示管理层仍想为多大规模的资产增长筹钱。关于 Robotaxi 车场和充电约束的独立报道，也从外部强化了同一点。公司关于若干市场已经盈利、2024 年 9 月达到 EBITDA
              盈亏平衡的公开表述令人鼓舞，但并没有消除对债务、信贷额度和资产级融资的结构性依赖。Moove 在财务上更像车队运营商、贷款人和服务公司的混合体，而不是轻资本市场平台。
