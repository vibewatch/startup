      - number: '1.2'
        title: 管理层厚度、治理可见度与业务足迹
        blocks:
          - type: paragraph
            body: >-
              公开的领导层记录足以相信创始人连续性，但还不足以完成后期公司治理尽调。Ladi Delano 和 Jide Odunsi 在公司材料里反复作为联合创始人兼联合 CEO 出现；C 轮公告又给 Delano
              加上顾问委员会主席头衔，2023 年公告则引入 Miguel Rodrigues 作为首任
              CFO。这个组合说明，规模上来之后，公司在补财务和公开市场准备能力。短板仍是董事会可见度。投资者页面展示投资人和影响力指标，却没有发布现任董事名单、委员会或独立治理框架。公开足迹披露也随时间明显演进。投资者页面仍显示较早的
              11 城市足迹，而 2025 和 2026 年融资及 Waymo 材料使用 29 城市，并叙述覆盖五大洲或 13
              个国家。正确解读不是公司对全球化说法前后不一，而是面向公众的页面没有统一刷新到同一时间标准。因此，后续章节应把 2025-2026 年融资和 Waymo 材料作为当前足迹的权威锚点。
