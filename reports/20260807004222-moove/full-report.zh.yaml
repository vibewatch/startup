chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、起源与商业模式
        blocks:
          - type: paragraph
            body: >-
              Moove 现在把自己定义为支撑大规模出行的基础设施层，而不只是车辆金融创业公司。官网和 AV 运营页都反复给出三件套：资本、物理基础设施、城市级运营。这个框架重要，因为它解释了为什么 Moove 认为传统
              Drive-to-Own 业务和更新的 AV 运营可以放在同一条叙事里：两者都要为车队资产融资，让车辆持续充电和维修，并在城市尺度编排利用率。公开材料也显示，Moove
              在转向自动驾驶的同时，仍保留早期服务出行创业者的使命。2022 年 A 轮报道、2024 年 Waymo 合作公告，以及更早的 Global Fleet
              报道，都把它描述为面向银行服务不足的司机或车队创业者的按收入还款金融模式。变化在边界。到 2026 年，Moove 尝试把同一套资产金融和运营纪律用在自动驾驶车队、车场基础设施和 24/7
              指挥运营上。公司的起点仍是 2020 年尼日利亚创立的故事，但业务国际化后，总部和资本中心已经明显转向迪拜和阿联酋。
