      - number: '8.4'
        title: 建议和下一步尽调
        blocks:
          - type: paragraph
            body: >-
              最站得住的建议是积极但有条件。Moove 最新估值可以辩护，因为公司显然已经从故事走到规模，而且 5.0x ARR
              对这种增长曲线并不明显过高。但关键证据仍在私有范围内，估值还不足以支撑盲目激进。投资人应支持继续尽调和沟通，而不是把本轮简单看成捡便宜。信心应保持中等。主要上行触发点是证明利润率和单站经济性好于担忧；主要下行触发点是证明伙伴、监管或资本约束比本轮叙事暗示的更重。换句话说，Moove
              值得正面观察 / 选择性支持，但要守住定价纪律，并设定明确终止标准。这种立场保留投资空间，但必须围绕合同、经济性和责任分配设下清晰尽调闸门。
