          - type: paragraph
            body: >-
              正面情景的分量不轻。Moove 已经跑出真实规模，有可信的机构投资者基础、一个点名的旗舰 AV 关系，也有一条从 2023 年超过 $115 million ARR 增至 2026 年 $420 million
              ARR 的路径。仅凭这些，市场就该把它当作基础设施公司认真看，而不是小众车辆融资商。折价情景同样成立。公开资料仍指向资本开支重、伙伴集中、监管闸门和私有指标不透明。Gasgoo 的盈利警告、The Ken
              关于渠道集中的证据，以及偏弱的备案可见度，都说明最新估值不应被自动视为便宜。正确的投资讨论因此不是 Moove
              是否重要，而是现有证据是否足够强，能否支撑相对风险高出中等幅度以上的溢价。因此，投资主题可以有吸引力，但不能按一家已经成熟、披露干净的软件平台来承销。
            claimRefs:
