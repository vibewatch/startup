              是有价值的历史渠道，但其平台权力提醒投资人，客户触达可以被中介化到什么程度。Kovi 降低了一部分车队密度风险，但无法解决许可或合作伙伴集中。与此同时，车队所有权和 Nest
              建设所需资本又形成第二层敞口：如果资本成本恶化，或场地经济性不达预期，即便需求强劲，增长也会放慢。快速招聘增加第三层。从约 150 名 AV 员工一年内扩到 500
