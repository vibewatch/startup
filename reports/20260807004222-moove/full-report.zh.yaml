              里程碑记录显示，公司从司机金融扩展成更复杂的基础设施和运营平台。关键转折并不隐蔽：2024 年 Waymo 合作让 Moove 进入 Phoenix 和 Miami 车队运营；2025 年 1 月收购 Kovi
