      - number: '3.3'
        title: 切换成本、渠道权力与护城河耐久性
        blocks:
          - type: paragraph
            body: >-
              Moove 的护城河先是运营，再是技术。若优势能持续，来源不是独有技术，而是很多软件味更重的 AV 玩家不愿做的苦活：融资或持有车辆、组织供给、搭建车场、给车队充电、跑日常运营。Kovi 收购和 Waymo
              关系强化了这个位置。但同一证据也划出了护城河边界。合同可以重新招标。车场服务可以多归属。充电可以向专业商采购。Uber 可以把更多技术栈收回内部。Waymo 可以把更多功能留在自家。换句话说，Moove
              的整合深度可能制造真实切换摩擦，但不是绝对锁定。这个空间有吸引力，正是因为车场、土地、充电和运营都是战略瓶颈，也意味着更多基础设施资本很可能涌入。
