      - number: '1.3'
        title: 融资历史、规模与战略交易对手
        blocks:
          - type: paragraph
            body: >-
              Moove 的融资轨迹在同阶段私营公司里少见地清楚。2024 年 B 轮把估值基准定在 $750 million，同时让 Uber 与 Mubadala 一起入局；2026 年 C 轮把公开估值锚点抬到 $2.1
              billion。公司背书和合作伙伴背书的来源，在最新一轮规模、Mubadala、Woven Capital 和 Ion Pacific 领投，以及 BlackRock、Franklin
              Templeton、MUFG 和 Uber 等更大机构财团参与上相互吻合。融资叙事也直接连着运营规模。到 2026 年 8 月，Moove 称其已达到约 42,000 辆车，覆盖 29 个城市和 13
              个国家，ARR 为 $420 million，员工 3,300 人。历史节点形成可信的台阶：2024 年来源提到超过 20,000 名客户、超过 30 million 次出行和 $115 million
              ARR；2024 年末 Waymo 材料把出行创业者数量提高到 30,000 以上、出行次数提高到 50 million 以上；2025 年收购 Kovi 后，车队规模达到 36,000，ARR 超过 $275
              million，然后才有 2026 年 C 轮的跃升。因此，公开记录支持 Moove 是一家真实扩张中的公司，即便当前债务栈和集中度画像仍未公开。
