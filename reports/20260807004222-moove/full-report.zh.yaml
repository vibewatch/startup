  - id: TV003
    title: 牛市 / 基准 / 熊市情景表
    columns:
      - 情景
      - 收入 / 验证假设
      - 指示性倍数
      - 隐含估值
      - 解读
    rows:
      - - 牛市
        - ARR 复合增长，AV 执行风险明显下降
        - 6.0x-7.0x
        - ~$2.5B-$2.9B
        - 当前定价仍有上行空间
      - - 基准
        - 当前 ARR 证明可持续，但证据缺口仍在
        - 4.5x-5.5x
        - ~$1.9B-$2.3B
        - 当前定价大体公允
      - - 熊市
        - 增长质量转弱，或风险折价扩大
        - 2.5x-3.5x
        - ~$1.05B-$1.47B
        - 本轮定价偏满或显脆弱
    notes: 情景区间使用公开 ARR 和简单倍数范围，不使用管理层预测。
