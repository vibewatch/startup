            body: >-
              Moove 的客户故事结构上比标准 B2B 或 B2C 创业公司复杂。原始模型里，经济上相关的客户是出行创业者：司机或小型运营商使用 Moove
              融资车辆，在网约车或相关平台上赚钱。但分发常通过平台关系完成，最突出的是 Uber。新 AV 模型里，具名企业交易对手变成重要客户关系，因为 Moove
              向自动驾驶平台销售车队所有权和运营服务，而不是卖给单个司机。因此，公开来源支持一张双边客户图：有终端司机客户，有平台中介下的司机群体，也有 Waymo
              等企业合作伙伴。这个复杂性重要，因为就业、出行次数或车队规模上的客户广度看起来可以很漂亮，收入却仍可能集中在少数大渠道。投资人每次评估客户质量，都应仔细拆开用户广度和渠道权力。
