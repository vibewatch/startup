      - number: '5.3'
        title: 成熟度、差异化与依赖
        blocks:
          - type: paragraph
            body: >-
              Moove 的差异化主要是运营广度。与 Waymo
              相比，公司拥有的自动驾驶技术栈更少，也没有面向乘客的软件入口，但更愿意为车队融资、持有车辆、充电、服务并把运营跑起来。与充电专业商相比，它希望拥有更宽的一段技术栈。这种广度有意义，但也带着公开来源里仍可见的依赖。Waymo
              仍控制 AV 系统和服务体验。Uber
              和其他大型平台可以自己提供相邻基础设施层。车场土地、充电和逐城监管准备仍是外部约束。因此，产品成熟度是混合的：运营手册看起来真实且越来越全球化，但指挥层的技术防御性披露不足。投资人应把 Moove
