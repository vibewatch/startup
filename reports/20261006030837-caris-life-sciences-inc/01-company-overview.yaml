callouts:
  - calloutType: "strength"
    title: "Multi-Omic Depth and Comprehensive Sequencing Advantage"
    body: "Unlike diagnostic competitors utilizing narrow targeted gene panels (typically 300 to 600 genes), Caris standardizes on comprehensive Whole Exome Sequencing and Whole Transcriptome Sequencing across both tissue (MI Profile) and blood (Caris Assure). This multi-omic platform generates proprietary clinico-genomic datasets spanning over 1.13 million patients, driving algorithmic precision, biomarker discovery, and clinical trial matching."
    claimRefs:
      - "CO002"
      - "CO010"
  - calloutType: "risk"
    title: "Governance Deficits and Elevated Institutional Risk Scores"
    body: "Caris exhibits material corporate governance vulnerability, highlighted by an ISS Governance QualityScore of 9 out of 10 as of October 2026. Severe decile risk ratings across Board structure (10), Audit controls (9), and Executive Compensation (9) reflect heavy executive authority concentrated in Founder-CEO Dr. David Dean Halbert, creating potential friction with institutional public shareholders."
    claimRefs:
      - "CO007"
      - "CO008"
