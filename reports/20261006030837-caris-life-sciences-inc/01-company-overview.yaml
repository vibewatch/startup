company:
  name: "Caris Life Sciences, Inc."
chapter:
  number: 1
  title: "Company Overview"
  summary: "Caris Life Sciences, Inc. is a commercial-stage TechBio and precision oncology pioneer headquartered in Irving, Texas, specializing in comprehensive molecular profiling via whole exome and whole transcriptome sequencing. Following its June 2025 public listing, the company expanded full-year 2026 revenue guidance to $1.03–$1.04 billion behind accelerated clinical volume growth and positive Adjusted EBITDA."
sections:
  - id: "corporate-identity-foundations"
    title: "Corporate Identity, Stage, and Multi-Omic Business Model"
    body: "Caris Life Sciences, Inc. (Nasdaq: CAI) operates as a leading AI-enabled TechBio precision medicine company focused on transforming cancer diagnostics and personalized therapy selection. Founded in 2008 and headquartered in Irving, Texas, Caris developed a high-throughput molecular profiling infrastructure that couples Whole Exome Sequencing (WES) and Whole Transcriptome Sequencing (WTS) with artificial intelligence and high-performance cognitive computing. The company transitioned to the public equity markets via an initial public offering on June 18, 2025, complementing its primary Nasdaq listing with an announced dual listing on NYSE Texas in August 2026. Commercial operations span dual core modalities: tissue-based profiling via the proprietary MI Profile platform and blood-based comprehensive liquid biopsy profiling through Caris Assure. In addition to clinical therapy selection for oncology patients and treating physicians across community and academic health systems, Caris monetizes its clinico-genomic database through biopharmaceutical research and development services, including prospective and retrospective molecular profiling, companion diagnostics development, and target discovery partnerships."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO005"
    tableRefs:
      - "TO001"
    figureRefs:
      - "FO001"
  - id: "executive-leadership-governance"
    title: "Executive Leadership, Governance Structure, and Key-Person Exposure"
    body: "The executive team is led by Founder, Chairman, and Chief Executive Officer Dr. David Dean Halbert, who established the enterprise in 2008 with a clinical vision centered on comprehensive molecular characterization. Operational execution and commercial scaling are driven by President Dr. David Spetzler, Executive Vice Chairman Brian J. Brille, Senior Vice President and Chief Financial Officer Luke Power, and Senior Vice President and General Counsel J. Russel Denton. Dr. Halbert maintains substantial strategic and governance control over the organization, representing material key-person dependence given his dual executive chairmanship and strategic primacy. Corporate governance evaluation by Institutional Shareholder Services reflects notable structural tension: as of October 1, 2026, Caris received an overall ISS Governance QualityScore of 9 (on a 1–10 scale where 10 denotes highest relative risk), weighed down by severe decile scores of 10 in Board structure, 9 in Audit, and 9 in Executive Compensation, tempered by a decile rank of 5 in Shareholder Rights. To support rapid volume expansion across tissue and liquid biopsy testing, management executed a major commercial field realignment in January 2026, expanding geographic territory divisions from 82 to 146 and lifting total field sales headcount above 300 professionals by July 2026."
    claimRefs:
      - "CO006"
      - "CO007"
      - "CO008"
      - "CO009"
    tableRefs:
      - "TO002"
  - id: "capitalization-liquidity-scale"
    title: "Capitalization Structure, Scale Trajectory, and Commercial Performance"
    body: "Caris maintains strong commercial momentum and substantial liquidity across fiscal 2026. In the second quarter ended June 30, 2026, total revenue reached $263.7 million, representing a 45% year-over-year increase compared to $181.4 million in Q2 2025, driven primarily by 55% growth in molecular profiling services revenue to $252.3 million. GAAP gross margin expanded to 68%, generating positive Adjusted EBITDA of $55.7 million and net cash provided by operating activities of $28.5 million. The quarter marked Caris's fifth consecutive quarter of positive Adjusted EBITDA and positive free cash flow ($6.4 million in Q2 2026, which absorbed $22.1 million in capital expenditures for laboratory capacity). Management raised full-year 2026 revenue guidance to between $1.03 billion and $1.04 billion (27% to 28% annual growth) while reaffirming clinical volume growth expectations of approximately 20%. The company closed Q2 2026 with $793 million in cash and investments, supported by an earlier refinancing of its $400 million term loan facility with Blue Owl and Blackstone, while returning capital through an authorized $100 million share repurchase program ($18 million executed in Q2). As of October 5, 2026, Caris common stock traded at $30.39 on Nasdaq, establishing an equity market capitalization of approximately $8.59 billion against 282.65 million basic shares outstanding."
    claimRefs:
