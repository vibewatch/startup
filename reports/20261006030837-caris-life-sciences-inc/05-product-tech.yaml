company:
  name: "Caris Life Sciences, Inc."
chapter:
  number: 5
  title: "Product & Technology"
  summary: "Caris Life Sciences delivers comprehensive clinical and biopharma molecular profiling by pairing whole-exome DNA sequencing (~23,000 genes) and whole-transcriptome RNA sequencing (~61,000 transcripts) on Illumina NovaSeq systems with extensive immunohistochemistry. Over 1.13 million total profiles and 845,000 matched clinico-genomic profiles feed the Caris CODEai real-world data engine and predictive AI algorithms such as GPSai, FOLFIRSTai, and Caris Detect, creating substantial scientific differentiation while maintaining critical technical dependencies on next-generation sequencing hardware, specialized reagent supply, and complex reimbursement validation."
sections:
  - id: "clinical-product-portfolio"
    title: "Clinical Profiling Portfolio and Specimen Workflows"
    body: "Caris Life Sciences provides precision oncology profiling solutions designed to evaluate tumor biology across DNA, RNA, and protein levels rather than relying on narrow hotspot panels. The core commercial product line comprises Caris MI Profile for solid tumor tissue samples and Caris Assure for non-invasive blood-based liquid biopsy. In clinical practice, ordering physicians route patient biopsies or peripheral blood collections to Caris's centralized laboratory infrastructure in Phoenix, Arizona, where automated extraction, sequencing, and pathology review take place. During the first half of 2026, the company processed approximately 52,800 clinical therapy selection cases in Q1 (comprising 43,600 MI Profile and 9,200 Caris Assure cases) and expanded throughput to approximately 59,200 clinical cases in Q2 (comprising 48,300 MI Profile and 10,700 Caris Assure cases). Furthermore, the portfolio expanded through the launch and MolDX coverage approval of Caris ChromoSeq, a whole-genome tumor profiling assay for myeloid malignancies, as well as the commercial launch of Caris Detect, a multi-cancer early detection blood test designed to identify early-stage circulating signals."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
    tableRefs:
      - "TE001"
    figureRefs:
      - "FE001"
  - id: "laboratory-computational-architecture"
    title: "Laboratory Technology Stack, Informatics, and CODEai Platform"
    body: "The core technological foundation at Caris integrates industrial-scale next-generation sequencing hardware, high-throughput immunohistochemistry, and distributed computing bioinformatics. On tissue samples, Caris conducts whole-exome sequencing (WES) across approximately 23,000 genes with 719 clinically relevant genes sequenced at 1,000x coverage (and the remainder at 400x to 500x) on Illumina NovaSeq instruments, alongside whole-transcriptome sequencing (WTS) covering roughly 61,000 transcripts for gene fusions, expression changes, and immune infiltration signatures. Complementing genomic sequencing, automated Ventana and Dako staining instruments process over 15 clinically relevant immunohistochemical assays using more than 35 validated antibodies. In liquid biopsy workflows under Caris Assure, the laboratory evaluates circulating cell-free DNA (cfDNA) and cell-free RNA (cfRNA) from plasma paired with genomic DNA and RNA sequencing from buffy-coat white blood cells to perform somatic-germline subtraction and filter out clonal hematopoiesis of indeterminate potential (CHIP). At the computational layer, Caris CODEai integrates molecular profiling with longitudinal clinical outcomes, demographic records, and survival data, scaling past 1,130,000 total profiles and 845,000 matched clinico-genomic profiles by mid-2026. Automated financial intelligence aggregators and market listings sometimes cross-index Caris under the ticker symbol CAI on Nasdaq, which historically belonged to CAI International, Inc., a transportation finance and container leasing company founded in 1989 and listed on the NYSE prior to its acquisition; diligence on Caris Life Sciences' clinical informatics stack requires isolating TechBio filings from legacy shipping-container records."
    claimRefs:
      - "CE005"
      - "CE006"
      - "CE007"
      - "CE008"
      - "CE009"
      - "CE014"
      - "CE015"
    tableRefs:
      - "TE002"
  - id: "ai-decision-support-and-governance"
    title: "AI Decision Support, Biopharma Monetization, and Regulatory Quality Controls"
    body: "Beyond descriptive molecular profiling, Caris deploys machine learning and multimodal artificial intelligence algorithms to generate predictive therapy insights and commercialize research datasets. Clinically deployed AI engines include Caris GPSai (Genomic Probability Score), which applies machine learning across whole-exome and whole-transcriptome profiles to resolve tissue of origin in cancers of unknown primary, and Caris FOLFIRSTai, a clinically validated predictor of first-line chemotherapy efficacy in metastatic colorectal cancer. For biopharmaceutical developers, the Caris Discovery platform and CODEai database support target identification, patient stratification, and companion diagnostic co-development across 60,000 square feet of dedicated discovery laboratories, illustrated by antibody-drug conjugate (ADC) discovery partnerships with Merck KGaA. Operating in a highly regulated clinical diagnostic environment, Caris maintains compliance with CLIA, CAP, and HIPAA privacy standards, while securing Medicare administrative coverage determinations via the MolDX program for specialized tests like ChromoSeq. Key technical and operational limitations include substantial reliance on sole-source Illumina sequencing instruments and proprietary flow cells, cold-chain transport dependency for specimen viability, and significant sequencing compute intensity."
    claimRefs:
      - "CE010"
      - "CE011"
      - "CE012"
      - "CE013"
    tableRefs:
      - "TE003"
