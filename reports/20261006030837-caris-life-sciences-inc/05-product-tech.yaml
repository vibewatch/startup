  - calloutType: "insight"
    title: "Comprehensive WES/WTS Sequencing as a Data Moat"
    body: "By standardizing on whole-exome DNA and whole-transcriptome RNA sequencing rather than restricted gene panels, Caris generates over 1 TB of biomarker data per patient. This strategy prevents diagnostic obsolescence as new oncology biomarkers emerge, enables retroactive re-analysis of banked data, and fuels the CODEai real-world clinico-genomic database across 1.13 million total profiles."
