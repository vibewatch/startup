  topStrengths:
    - Differentiated WES/WTS and liquid-biopsy platform with a large clinico-genomic dataset.
    - Rapidly growing clinical revenue base with 59,200 Q2 2026 cases and raised FY2026 guidance.
    - Healthy liquidity and positive operating cash flow support continued platform investment.
  topRisks:
    - Reimbursement and payer adjudication remain the main determinant of realized ASP and margin durability.
    - Legal and regulatory overhangs are still not fully quantified in public disclosures.
    - Valuation already discounts much of the near-term growth, leaving limited upside if execution slows.
  unresolvedGaps:
    - Payer-level realized ASP, denial, appeal, and per-test COGS data for tissue versus blood workflows
    - Exact diluted share-count bridge including options, RSUs, and any future draw or financing effects
    - Current DOJ reserve, claims universe, and likely downside range for the March 2025 CID
    - Customer retention, concentration, and biopharma backlog metrics that would prove durability beyond volume growth
