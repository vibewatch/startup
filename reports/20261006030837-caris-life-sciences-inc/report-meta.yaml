companyProfile:
  summary: >-
    Caris Life Sciences is a public precision-oncology company that combines whole-exome and whole-transcriptome
    profiling, liquid biopsy, and clinico-genomic data services to help clinicians and biopharma partners make treatment
    and discovery decisions. The business is anchored in recurring clinical testing demand, a growing biopharma data
    franchise, and a large molecular database that supports AI-enabled interpretation and product development.
