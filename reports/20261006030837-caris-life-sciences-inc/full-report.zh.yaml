  - id: TV003
    title: 乐观、基准与悲观估值情景框架
    columns:
      - 情景
      - 运营假设
      - 收入与利润率预测
      - 隐含估值与回报逻辑
      - 关键风险与概率信号
    rows:
      - - 乐观情景
        - Detect 快速实现商业化爬坡；MolDX 建立覆盖；临床数量同比增长 >25%；生物制药合作规模扩大。
        - 2027E 收入：$1.35B；毛利率：70%；经营利润率：12-15%；自由现金流：>$180M。
        - EV：$12.5B - $14.0B，依据 EV/收入 9.5 倍–10.5 倍；隐含股价 $42.00 - $48.00（回报 +40% 至 +60%）。
        - 概率：25%。筛查商业化和支付方采用面临较高执行风险。
      - - 基准情景
        - 治疗选择数量同比增长 18%–20%；2026 全年达到 $1.03B–$1.04B；Detect 逐步扩大规模；毛利率稳定在 66%–68%。
        - 2027E 收入：$1.22B；毛利率：67%；经营利润率：5-8%；自由现金流为正，达 $50M-$80M。
        - EV：$8.5B - $9.8B，依据 EV/收入 7.0 倍–8.0 倍；隐含股价 $28.00 - $33.00（回报 -8% 至 +8%）。
        - 概率：55%。与共识目标价（$28.15）一致；公允价值体现风险与回报的平衡。
      - - 悲观情景
        - 临床治疗选择数量增速放缓至 <12%；Detect 遭遇报销障碍；支付方拒付率上升；利率拖累。
        - 2027E 收入：$1.08B；毛利率：58-62%；经营利润率：盈亏平衡至 -2%；自由现金流为负。
        - EV：$4.5B - $5.5B，依据 EV/收入 4.0 倍–5.0 倍；隐含股价 $15.00 - $19.00（回撤 -38% 至 -50%）。
        - 概率：20%。若高债务负担下增长停滞，可能触发下轮融资 / 倍数压缩。
    notes: 情景模型将标准化收入倍数套用于 2026–2027 年预测运营指标，假设稀释后普通股等价股数为 280M–295M。
    claimRefs:
