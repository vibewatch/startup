              的公司治理评估显示，治理结构存在明显张力：截至 2026 年 10 月 1 日，Caris 获得 ISS 治理质量评分 9 分（1–10 分制，10 代表相对风险最高）；董事会结构评分 10、审计评分
              9、高管薪酬评分 9，均处于严重风险十分位，股东权利十分位排名 5 则有所缓冲。为支持组织样本和液体活检检测的快速放量，管理层于 2026 年 1 月大幅重组商业团队，将地理区域从 82 个扩至 146 个，并在
              2026 年 7 月前将外勤销售人数提升至 300 名以上。
