              的实验室产能资本开支）。管理层将 2026 全年收入指引上调至 $1.03 billion–$1.04 billion（年度增长 27%–28%），同时重申临床检测量约 20% 的增长预期。Caris 在
              2026 年第二季度末持有 $793 million 现金及投资，此前已与 Blue Owl 和 Blackstone 完成 $400 million 定期贷款机制再融资；公司同时通过获授权的 $100
              million 股票回购计划返还资本（第二季度执行 $18 million）。截至 2026 年 10 月 5 日，Caris 普通股在 Nasdaq 交易价为 $30.39，对应约 $8.59 billion
              的股权市值，基本流通股为 282.65 million 股。
