            body: >-
              将 Caris 与主要直接竞争者比较，可以看到规模、产品范围和分销能力之间存在明显取舍。Roche 全资拥有的 Foundation Medicine 掌握深厚的制药分销渠道，并凭借 FoundationOne
              CDx 和 FoundationOne Liquid CDx 平台获得广泛 FDA 伴随诊断批准；当肿瘤科医生开具某些靶向疗法时，其检测具有强制性。Guardant Health
              是血液液体活检领域的品类领导者，拥有 Guardant360 CDx 和 FDA 批准的 Shield 结直肠癌筛查检测，且流动性超过 $1 billion。Tempus AI 与 Caris 一样定位于
              TechBio，将基因组分析与算法临床决策工具、生物制药数据授权结合起来，但其经常性数据授权业务扩张更激进。相比之下，NeoGenomics 等专业实验室网络能广泛触达社区肿瘤市场，但缺少 Caris
              那样深度的多组学数据集。
