            body: >-
              Caris Life Sciences 采用双收入商业模式，以临床分子分析服务为主，同时承接生物制药研发合作。2026 年第二季度，总披露收入同比增长 45% 至 $263.7
              million，其中分子分析服务贡献 $252.3 million，占总收入 95.7%。2026 年第二季度临床治疗选择量约为 59,200 例，包括约 48,300 例 MI Profile
