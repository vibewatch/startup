  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              精准肿瘤学诊断和综合基因组分析（CGP）市场技术迭代快、监管壁垒高，支付方报销政策也在变化。Caris Life Sciences 面对多个层级的竞争者：直接综合分析同行（Foundation
              Medicine、Tempus AI、Guardant Health）、相邻临床实验室品牌（NeoGenomics、Exact Sciences、Natera），以及 Illumina
              等上游测序平台供应商。Caris 主要凭借全外显子组和全转录组测序的广度，以及在实体瘤组织上结合免疫组织化学（IHC）来实现差异化；同时，公司拥有覆盖超过 1.13 million
              份肿瘤档案的专有真实世界临床基因组数据库。              不过，Foundation Medicine 和 Guardant Health 等竞争者拥有多项 FDA
              批准的伴随诊断（CDx）适应证主张，可将检测嵌入药品标签；Caris 历来主要依赖通过 CLIA 验证、CAP 认证的实验室自研检测（LDT），因此商业和监管环境有所不同。
