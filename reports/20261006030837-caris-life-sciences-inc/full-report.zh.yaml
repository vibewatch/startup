      - number: '5.2'
        title: 实验室技术栈、信息学与 CODEai 平台
        blocks:
          - type: paragraph
            body: >-
              Caris 的核心技术基础由工业规模下一代测序硬件、高通量免疫组织化学和分布式计算生物信息学组成。在组织样本上，Caris 使用 Illumina NovaSeq 仪器开展全外显子组测序（WES），覆盖约
              23,000 个基因，其中 719 个临床相关基因以 1,000x 深度测序，其余基因深度为 400x–500x；同时开展覆盖约 61,000
              个转录本的全转录组测序（WTS），用于识别基因融合、表达变化和免疫浸润特征。除基因组测序外，自动化 Ventana 和 Dako 染色仪器使用超过 35 种经验证抗体，处理超过 15
              项临床相关免疫组织化学检测。在 Caris Assure 液体活检流程中，实验室从血浆评估循环游离 DNA（cfDNA）和循环游离 RNA（cfRNA），并结合血沉棕黄层白细胞的基因组 DNA 和 RNA
              测序，以进行体细胞—生殖系扣除，过滤意义未明的克隆性造血（CHIP）。在计算层，Caris CODEai 将分子分析与纵向临床结局、人口统计记录和生存数据结合；截至 2026 年中，规模已超过 1,130,000
              份总档案和 845,000 份匹配临床基因组档案。自动化金融情报聚合商和市场列表有时会将 Caris 以 Nasdaq 股票代码 CAI 交叉索引；但该代码历史上属于 CAI International,
              Inc.，一家成立于 1989 年、主营运输融资和集装箱租赁、在被收购前于 NYSE 上市的公司。对 Caris Life Sciences 临床信息学栈的尽调，需要将 TechBio
              披露与旧有集装箱运输记录分开。
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
              - CE014
              - CE015
