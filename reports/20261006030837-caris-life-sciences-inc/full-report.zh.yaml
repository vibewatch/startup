    rows:
      - - 转移性实体瘤的一线治疗选择
        - 靶向小型 NGS panel（50-500 个基因），检测已知可行动突变
        - Caris MI Profile 全外显子组与全转录组测序
        - 识别罕见融合、全外显子组 TMB、HRD 及非热点变异，避免 panel 过时造成遗漏
        - 实验室测序周转时间长于快速单基因 PCR
      - - 组织不可用时的无创治疗选择
        - 重复进行侵入性粗针活检，或仅对 cfDNA 做液体活检检测
        - Caris Assure 血浆与白膜层双重测序
        - 避免侵入性活检并发症；白膜层可分离 CHIP 突变，降低假阳性
        - 早期疾病或存在中枢神经系统屏障的转移灶中，循环肿瘤比例较低
      - - 确定原发部位不明癌症（CUP）的原发部位
        - 反复进行免疫组化染色和诊断影像检查
        - Caris GPSai 机器学习组织来源算法
        - 算法依据基因组与转录组特征进行分类，为靶向治疗提供指导
        - 需要足够的分子信号，并在罕见组织学亚型中完成验证
      - - 预测转移性结直肠癌的化疗反应
        - 在 FOLFOX 与 FOLFIRI 方案之间进行标准经验性选择
        - Caris FOLFIRSTai 人工智能分子预测器
        - 指导一线方案的最优选择，改善无进展生存期和总生存期
        - 仅适用于特定 mCRC 适应症；医生改变临床实践指南的动力不足
    notes: 工作流比较综合了已发表的临床实用性研究和制造商产品规格。
