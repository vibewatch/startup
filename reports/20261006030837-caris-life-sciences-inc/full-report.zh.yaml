      - number: '8.4'
        title: 展示材料
        blocks:
          - type: callout
            title: 投资立场：在当前估值水平继续跟踪
            body: >-
              Caris 股价约为每股 $30.40、企业价值约 $8.6B，市场似乎已合理计入公司 2026 年收入指引上调 （$1.03B–$1.04B）和毛利率扩张。考虑到 $400M 已提取的高级信贷工具、较高 P/E
              估值，以及 Caris Detect 尚待完成的临床和报销验证，投资者应跟踪业绩而非激进建立多头仓位，等待入场倍数接近 EV/销售 额 6.5x，或出现 GAAP 经营利润率扩张的切实证据。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV008
              - CV010
          - type: callout
            title: 不利的倍数压缩与浮动利率债务敞口
            body: >-
              TIKR 分析指出，Caris 股价在 2026 年早些时候回撤 29%，说明新上市精准肿瘤学平台若以三位数或较高 前瞻 P/E 倍数交易，波动性会很高。若临床检测采用放缓，或 $400M 定期贷款的 SOFR
              借款利率维持高位 （SOFR + 500 bps），偿债和倍数压缩将对股权估值构成重大下行风险。
            calloutType: risk
