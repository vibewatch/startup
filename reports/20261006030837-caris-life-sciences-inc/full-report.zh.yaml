figures:
  - id: FO001
    title: Caris Life Sciences 战略企业里程碑时间线
    type: timeline
    summary: 按时间梳理 Caris Life Sciences 自 2008 年开展分子分析以来的发展历程，涵盖 Nasdaq IPO、临床 AI 扩张和 2026 年多癌种早期检测上线。
    data:
      items:
        - date: '2008'
          label: 企业成立
          detail: David Dean Halbert 博士在德州欧文创立公司，立志推动全面分子精准医疗。
          tone: positive
        - date: '2020'
          label: 全外显子组与转录组架构
          detail: 首创面向实体瘤的高通量 WES 与 WTS 联合测序，建立庞大的临床基因组资料库。
          tone: positive
        - date: '2024'
          label: Caris Assure 液体活检上线
          detail: 将全面的全外显子组和全转录组血液分析商业化，用于治疗选择和循环肿瘤动态分析。
          tone: positive
        - date: '2025-06-18'
          label: Nasdaq 首次公开募股
          detail: 以 CAI 为股票代码上市，并将可转换优先工具转换为普通股权。
          tone: positive
        - date: '2026-01-15'
          label: 商业销售重组
          detail: 将商业现场销售区域从 82 个重组为 146 个，以加快肿瘤学领域的采用。
          tone: neutral
        - date: '2026-04-01'
          label: ChromoSeq 上线与 MolDX 批准
          detail: 将面向髓系恶性肿瘤的全基因组和全转录组肿瘤分析检测商业化，Medicare 报销金额为 $3,228。
          tone: positive
        - date: '2026-05-07'
          label: 信贷额度再融资
          detail: 与 Blue Owl 和 Blackstone 以更低的借款成本完成 $400 million 信贷额度再融资，提升资产负债表的灵活性。
          tone: positive
        - date: '2026-06-15'
          label: Caris Detect MCED 商业上线
          detail: 推出多癌种早期检测血液检测，利用超深度全基因组和 cfRNA 测序识别 58 种癌症。
          tone: positive
        - date: '2026-08-05'
          label: FY2026 收入指引上调
          detail: 第二季度业务量创纪录后，将全年收入展望上调至 $1.03–$1.04B，并宣布在 NYSE Texas 双重上市。
          tone: positive
    approximationNotes: 时间线汇总主要历史企业里程碑和 SEC 披露，均已通过官方新闻稿和季度报告核实。
