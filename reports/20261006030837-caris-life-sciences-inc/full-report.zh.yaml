  - id: FI001
    title: 收入模型桥接
    type: flow
    summary: 展示从医生下单、实验室测序到毛利的运营与商业转化链路。
    data:
      nodes:
        - id: ordering
          label: 临床样本接收
          detail: MI Profile 组织检测和 Caris Assure 液体活检每季度从肿瘤科医生处接收 59,200 例临床病例
        - id: sequencing
          label: 实验室测序与分析
          detail: 高通量 WES、WTS 测序，以及 AI 驱动的临床信息学解读
        - id: adjudication
          label: 支付方理赔裁定
          detail: 按 Medicare CDLT 费率及商业支付方合同获得报销，实际 ASP 持续提升
        - id: gross-revenue
          label: 合并收入
          detail: 2026 年 Q2 收入 $263.7M，其中检测业务 $252.3M，生物制药服务 $11.5M
        - id: cogs-deduction
          label: 服务成本
          detail: Q2 服务成本 $84.1M（检测业务成本 $81.3M，制药业务成本 $2.8M）
        - id: gross-profit
          label: 毛利形成
          detail: 毛利 $179.6M，毛利率 68.1%，经营现金流为正
      edges:
        - from: ordering
          to: sequencing
        - from: sequencing
          to: adjudication
        - from: adjudication
          to: gross-revenue
        - from: gross-revenue
          to: cogs-deduction
        - from: cogs-deduction
          to: gross-profit
    approximationNotes: 根据 2026 年 Q2 财务报告，流程图展示从样本接收到合并毛利的运营推进过程。
    claimRefs:
