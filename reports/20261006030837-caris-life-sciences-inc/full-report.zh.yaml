  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户群分层与支付方架构
        blocks:
          - type: paragraph
            body: >-
              Caris Life Sciences
              服务两类客户群体，双方的下单流程、经济买方和价值实现模式不同。主要的病例量和收入引擎是临床肿瘤学业务，包括社区肿瘤科诊所、学术医疗中心、整合式医疗网络（IDN）和医院病理科。在这一临床渠道中，主治肿瘤科医生或病理医生是主要临床决策者和下单用户；商业健康计划、Medicare、Medicare
              Advantage 以及自保雇主健康计划则是主要第三方支付方。由于美国癌症医疗服务分散，社区肿瘤科诊所贡献了绝大多数常规检测量。学术医疗中心和综合癌症中心在 Caris Precision Oncology
              Alliance（POA）下协作，产生高复杂度分析病例，参与生物标志物研究并验证临床效用。第二类客户是全球生物制药和生物技术企业，如 Genentech 及其他精准医疗开发商；它们从 Caris 超过 1.13
              million 份总档案和 845,000 份匹配患者档案中购买去标识化临床基因组数据、转化研究服务和临床试验匹配方案。
