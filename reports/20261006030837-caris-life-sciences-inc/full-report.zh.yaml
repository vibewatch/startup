      - number: '7.4'
        title: 展示材料
        blocks:
          - type: callout
            title: 可监测的投资逻辑破坏触发因素
            body: >-
              若政府事项导致重大准备金、偿还义务或经营限制；付款方层面的实际 ASP 或自由现金流连续两个季度 恶化；Caris Detect 未能带来重复下单和可接受的后续临床工作流；或供应商、隐私、网络安全事件对检测
              造成重大中断，应重新评估投资。上述是投资纪律阈值，并非预测事件一定会发生。
