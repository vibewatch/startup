      - number: '8.3'
        title: 情景分析、催化剂与尽调问题
        blocks:
          - type: paragraph
            body: >
              为测算风险调整后回报，我们在 2 至 3 年投资期限内建立乐观、基准和悲观三种经营情景。乐观情景下， Caris Detect 成功获得广泛临床采用，并取得有利的 Medicare MolDX
              地方覆盖决定，推动整体收入年增速 接近 30–35%，毛利率扩大至 72%，年度自由现金流超过 $200 million。在这一情景下，企业价值可能升至 $12.0B–$14.0B（每股
              $42–$48）。基准情景下，Caris 达成 2026 年收入指引基线（$1.03B–$1.04B）， 依靠核心治疗选择检测（MI Profile 和 Caris Assure）实现年增长 20–23%，同时
              Detect 逐步获得采用， 对应合理市值 $8.5B–$9.5B（每股 $28–$33），与华尔街共识目标价 $28.15 基本一致。


              悲观情景下，付款方覆盖裁定不利、实体瘤分子检测报销率被压低，或多癌种早筛执行延迟，都会使收入增速 降至 15% 以下。由于实验室固定经营成本高，且高级浮动利率债务承担利息义务（$400 million+ 已提取
              债务的 SOFR + 500 bps），净利率将收缩，估值倍数可能压缩至 EV/收入 4.0x–5.0x，对应企业价值 $4.5B–$5.5B（每股
              $16–$19）。关键尽调触发因素包括跟踪季度实际平均售价（ASP）、Detect 的临床 研究终点（Achieve 1 读出后续），以及司法部或联邦民事调查要求相关事项的进展和准备金调整。
            claimRefs:
              - CV002
              - CV003
              - CV010
              - CV011
              - CV012
              - CV013
