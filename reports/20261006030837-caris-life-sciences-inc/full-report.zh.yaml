      - number: '2.3'
        title: 买方分层、支付方流程与预算归属
        blocks:
          - type: paragraph
            body: >
              精准肿瘤学的采用取决于复杂的多方参与结构：临床使用者、下单决策者和财务支付方彼此不同。主要临床决策者是社区肿瘤科医生、学术肿瘤科医生和外科病理医生，他们评估患者病理情况并发起分子检测订单。但这些下单医生并不直接承担检测成本。相反，报销通过政府医疗项目（Medicare
              和由 MAC 依据 MolDX 覆盖政策管理的 Medicare Advantage）以及商业健康险计划流转。每次检测的实际收入取决于覆盖决定、合同网络收费表和医疗政策标准，而非患者自行支付意愿。


              第二类关键客户是生物制药和生物技术开发商。这些企业客户可以使用 Caris 庞大的真实世界多模态临床基因组数据库——截至 2026 年 6 月 30 日，包含超过 1,130,000 份分子档案、超过
              845,000 份匹配临床结局档案、783,000 份全转录组和 733,000
              份全外显子组。生物制药客户以企业研发预算直接授权去标识化分子记录、支持靶点验证，并开展生物标志物驱动的临床试验入组。不同于依赖报销的临床检测，生物制药协议是带有里程碑和交付结构的议价企业合同，提供额外的商业引擎。


              医院医疗系统、整合式医疗网络（IDN）和综合癌症中心是机构采购合作方。这些机构建立标准化电子健康记录（EHR）订单集、临床试验联盟（如 Caris Precision Oncology
              Alliance）和病理转诊流程。采用通常由以下因素触发：综合分析显示更高的治疗获益、实验室周转时间可接受，以及通过避免无效治疗带来正向预算影响。
