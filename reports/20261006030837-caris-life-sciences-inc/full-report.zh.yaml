      - number: '6.4'
        title: 留存持久性、渠道摩擦与集中度风险
        blocks:
          - type: paragraph
            body: >-
              尽管临床病例量强劲增长，Caris 仍存在需要严格投资审查的关键结构性披露和留存风险。由于临床诊断采用按服务收费、按样本下单的模式，而非软件即服务订阅，Caris
              不披露软件行业常见的净收入留存率（NRR）、毛收入留存率（GRR）或医生流失率等指标。商业肿瘤科医生几乎没有技术切换成本，经常在 Foundation Medicine、Guardant
              Health、Tempus AI 和 NeoGenomics
              等竞争平台之间分拆或轮换检测订单。此外，实际收入高度依赖第三方报销周期、覆盖决定和账单回款。例如，管理层警告，由于早期需求增长可能快于实验室产能扩容三倍，Caris Detect
              可能出现履约瓶颈和延期订单；公司同时在推进直接自费商业路径，以绕开缓慢的商业支付方覆盖。在生物制药部门，收入从 2024 财年的 $63.1 million 大幅降至 2025 财年的 $45.3
              million，随后反弹至 2026 财年预计 $75 million–$85 million 的指引区间，暴露出显著的项目型收入波动、集中度和续约不稳定性。
            claimRefs:
              - CU014
              - CU015
              - CU016
      - number: '6.5'
        title: 图表
        blocks:
          - type: callout
            title: 商业重组通过区域密度带来经营杠杆
            body: >-
              Caris 在 2026 年初将销售区域从 82 个扩展至 146 个，标志着公司从机会式客户获取转向有纪律的区域密度经营。外勤团队扩至 300 人以上，直接推动病例量从第一季度的 52,800
              例环比扩大至第二季度的 59,200 例，同时通过加强支付方回款和医生教育，使临床平均销售价格提升 30%。
            calloutType: insight
            claimRefs:
              - CU007
              - CU008
              - CU009
          - type: callout
            title: 按服务收费诊断缺乏合同留存可见度
            body: >-
              不同于经常性软件业务，临床肿瘤诊断检测按样本交易式下单，肿瘤科医生几乎没有切换阻力。Caris
              不披露量化客户留存、净收入留存率（NRR）和生物制药合同积压，投资者因此暴露于无法量化的医生下单流失和生物制药合同波动。
            calloutType: risk
            claimRefs:
              - CU014
              - CU015
              - CU016
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与数据风险
        blocks:
          - type: paragraph
            body: >-
              当前最不确定的法律问题不是已被证明的责任，而是证据缺口。Hudson Labs 报告称，持续存在的法律和监管风险包括 DOJ 调查及内部控制问题；Caris 自身 2026
              年披露也将政府调查和诉讼列为可能重大影响业绩的因素。指定证据池既没有底层政府往来文件，也没有当前准备金估算，因此无法负责任地量化发生概率和损失规模。报销是更可观察的监管机制：管理层将现金生成和收入改善部分归因于报销及
              ASP
              增长，风险披露也明确指出支付方覆盖决定。患者数据规模还使隐私、网络安全和数据处理控制具有实质经济重要性，但证据池没有控制审计、认证、事件登记或恢复指标。因此，法律状态、报销持久性和控制有效性仍是直接尽调事项，而不是已经排除的风险。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR011
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
              - CR005
              - CR006
