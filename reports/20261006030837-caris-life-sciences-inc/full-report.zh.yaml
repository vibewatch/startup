  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、规模口径与替代方案
        blocks:
          - type: paragraph
            body: >
              Caris Life Sciences 处于先进精准肿瘤学诊断和 TechBio
              数据生态中，将核心市场界定为面向癌症患者的高复杂度分子分析。商业边界覆盖两大运营领域：综合临床分子分析服务和生物制药研究服务。临床检测支出由实体瘤和血液恶性肿瘤的诊断评估驱动，包括组织样本检测（MI
              Profile）和液体活检血液检测（Caris Assure），并延伸至多癌种早期检测（Caris Detect）和髓系恶性肿瘤全基因组分析（Caris
              ChromoSeq）。支出包括实验室样本处理、全外显子组测序、全转录组测序、免疫组织化学及 AI 临床解读。不包括常规解剖病理、一般参考实验室血液面板、非分子放射学、手术干预成本及直接肿瘤药物治疗。


              肿瘤诊疗中的现有替代方案包括传统单一生物标志物检测、聚焦型下一代测序（NGS）热点面板（通常覆盖 50–500 个基因），以及医疗机构自有病理实验室检测。与 Foundation
              Medicine、Guardant Health 或本地学术医学中心提供的聚焦面板相比，Caris
              将其全面的全外显子组和全转录组平台定位为信息更丰富的标准，旨在消除窄面板的诊断盲点。在生物制药服务中，支出包括生物标志物发现、转化研究数据集、临床试验患者匹配和伴随诊断验证；竞争者包括合同研究组织、药企自有研发管线和临床数据聚合商。


              市场边界约束显示，尽管 Caris 2026 年第二季度总收入达到 $263.7 million，同比增长 45%，并完成约 59,200
              例临床病例，但实际市场渗透仍受临床检测量、第三方报销决定和治疗选择方案平均销售价格（ASP）稳定性的制约。
