      - number: '7.2'
        title: 运营与产品执行
        blocks:
          - type: paragraph
            body: >-
              Caris 在第二季度披露 Caris Detect
              上市，并在网站展示该检测可用，从而降低了产品发布风险的一项不确定性。剩余风险从上市时点转向临床效用、市场接受度、吞吐量和落地执行：公司自身第一季度风险表述称，技术或运营故障可能推迟商业化或使其无法实现。随着管理层将销售区域从
              82 个扩至 146 个，并继续招聘至约 300
              名商业人员，执行复杂度也随之上升。扩张可以扩大触达，但也会带来爬坡、生产率和协同风险，公开病例量增长无法完全消除这些风险。指定证据没有量化供应商依赖、数据平台韧性、分析失败率、周转时间和产能利用率。投资者应将上市公告视为里程碑，而非持久采用或可靠规模化交付的证明。
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR012
