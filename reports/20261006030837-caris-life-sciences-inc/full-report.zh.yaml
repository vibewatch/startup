      - number: '6.3'
        title: 指名客户验证与生物制药合作
        blocks:
          - type: paragraph
            body: >-
              顶级癌症研究网络和大型生物制药合作伙伴的情况，也能看出临床和商业端的采用进展。机构临床领域中的 Caris Precision Oncology
              Alliance（POA）是一个高端协作网络，覆盖全球领先的学术癌症中心和医疗系统；它提供直接电子健康记录（EHR）集成，让临床医生可以在医院原生流程中电子下单分子分析并查看基因组报告。在商业生物制药领域，Caris
              与 Genentech 建立多年研究合作，利用其大型临床基因组数据库，在未满足医疗需求较高的肿瘤适应证中发现新治疗靶点。在早期检测的消费者和医生诊断领域，Caris 与 Everlywell 合作，为 Caris
              Detect 即将推出的多癌种早期检测（MCED）血液分析准备商业分销和样本采集物流。独立市场报道和华尔街分析师评论也显示其专业曝光度广泛：15 家券商持续覆盖 Caris Life
              Sciences（CAI），平均券商推荐评级（ABR）为 1.67，其中 10 家给出“强力买入”评级。
