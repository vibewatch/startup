  - id: TV002
    title: 投资正反论点综合
    columns:
      - 维度
      - 支柱
      - 核心论点与支持证据
      - 哪些变化会改变判断
    rows:
      - - 市场需求与临床护城河
        - 论点
        - 无可匹敌的多模态数据库已积累超过 1.13M 份档案，全面 WES/WTS 临床检测带动收入同比增长 45%–79%。
        - 临床检测量增速降至 15% 以下，或市场份额被靶向 NGS panel 抢走。
      - - 经营杠杆与现金流
        - 论点
        - 毛利率从 2025 年第一季度的 47% 提升至 2026 年第二季度的 68%，季度经营现金流也转为净流入（$28.5M–$32.9M）。
        - 实验室成本通胀或意外支付方拒付导致毛利率降至 60% 以下。
      - - 管线与早期拦截
        - 论点
        - Caris Detect MCED 和 ChromoSeq（获 MolDX 批准）将总可寻址市场从治疗选择扩展至筛查。
        - Detect 临床验证失败，或 CMS/MolDX 拒绝提供报销覆盖。
      - - 估值与倍数压缩
        - 反论点
        - 按约 8.7 倍 EV/收入和超过 43 倍远期盈利倍数交易，宏观估值倍数收缩时安全边际很小。
        - 股价大幅回落至 $20/股以下，或收入增速持续加速至 35% 以上。
      - - 债务杠杆与资本结构
        - 反论点
        - $400M 已提款高级担保债务，利差为 SOFR + 5.0%，带来显著的年度现金利息负担。
        - 加快偿还债务，或以明显更低的固定利差再融资。
      - - 监管与支付方风险
        - 反论点
        - 依赖 Medicare 承包商 MolDX 的决定，以及商业支付方报销的稳定性。
        - 与主要全国性支付方签署长期网络内主覆盖协议并落地执行。
    notes: 从临床、商业、财务和监管四个层面评估投资证据与运营触发因素。
