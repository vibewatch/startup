      - number: '6.2'
        title: 临床采用轨迹与销售团队扩张
        blocks:
          - type: paragraph
            body: >-
              2025 年及 2026 年上半年，Caris 综合分子分析平台的临床使用快速增长。2025 全年，公司完成约 199,300 例临床治疗选择病例，同比 2024 年增长 22%，其中 170,300
              例为组织样本 MI Profile，29,000 例为血液样本 Caris Assure 液体活检。2026 年 1 月完成战略性商业重组后，这一势头延续。2026 年第一季度临床吞吐量约 52,800 例（包括
              43,600 例 MI Profile 和 9,200 例 Caris Assure），第二季度增至创纪录的 59,200 例（包括 48,300 例 MI Profile 和 10,700 例 Caris
              Assure）。第二季度吞吐量同比临床病例量增长 18%，年化运行率超过 236,000 例。管理层将这一病例量拐点直接归因于激进的商业销售区域重组和扩张：区域从 82 个增至 146 个，外勤销售团队扩至
              300 人以上。同时，受第三方支付方合同执行改善及报销认可扩大影响，2026 年第二季度临床平均销售价格（ASP）增长 30%。
            claimRefs:
