      - number: '5.3'
        title: AI 决策支持、生物制药变现与监管质量控制
        blocks:
          - type: paragraph
            body: >-
              除描述性分子分析外，Caris 还部署机器学习和多模态人工智能算法，生成预测性治疗洞察并商业化研究数据集。临床部署的 AI 引擎包括 Caris
              GPSai（基因组概率评分），它对全外显子组和全转录组档案应用机器学习，以判断原发灶不明癌症的组织来源；以及 Caris
              FOLFIRSTai，这是一款经临床验证的转移性结直肠癌一线化疗疗效预测工具。面向生物制药开发商，Caris Discovery 平台和 CODEai 数据库支持靶点识别、患者分层和伴随诊断共同开发，依托
              60,000 平方英尺的专用发现实验室；其应用案例包括与 Merck KGaA 的抗体偶联药物（ADC）发现合作。Caris 处于高度监管的临床诊断环境中，遵守 CLIA、CAP 和 HIPAA 隐私标准，并通过
              MolDX 计划获得 ChromoSeq 等专业检测的 Medicare 行政覆盖决定。主要技术和运营限制包括高度依赖单一来源的 Illumina
              测序仪器及专有流动槽、对冷链运输以维持样本活性的依赖，以及较高的测序计算强度。
