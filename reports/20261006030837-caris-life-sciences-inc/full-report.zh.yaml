      - number: '7.3'
        title: 财务、合作伙伴与投资论点风险
        blocks:
          - type: paragraph
            body: >-
              财务表现提供了实质性缓冲，但并非绝对保障。Caris 报告第一季度收入为 $216.2 million，第二季度为 $263.7 million；但同期自由现金流从 $22.5 million 降至 $6.4
              million，公司第二季度仍录得小额 GAAP 净亏损。第一季度增长由病例量增长 15% 和 ASP 大幅增长 61% 共同推动，因此付款方实际结算和编码
              的持续性是核心敏感因素，而非次要细节。再融资后的信贷工具延长了资金灵活性，但也保留了对贷款人 和契约的依赖。公开市场证据还释放出情绪风险信号：独立来源显示，业绩发布后股价大幅波动，52 周
              交易区间很宽。如果付款方经济性走弱、法律事项产生重大财务影响、产品发布未能转化为重复业务量， 或现金创造连续多个季度反转，就应重新评估投资逻辑。
            claimRefs:
