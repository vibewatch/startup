  - id: FM001
    title: 市场规模视角
    type: pyramid
    summary: 以金字塔展示精准肿瘤学全流程市场机会，呈现可寻址市场和已实现市场的层级。
    data:
      items:
        - label: 全流程医疗与早期检测 TAM（约 $150B）
          detail: 美国长期肿瘤学全流程 TAM，涵盖多癌种早期检测（$100B）和监测
        - label: 全球下一代测序生态（$27B - $98B）
          detail: 2031–2035 年全球 NGS 仪器、耗材和分子诊断市场
        - label: 全面基因组分析（CGP）市场（$8B - $15B）
          detail: 美国晚期和转移性实体瘤的靶向临床治疗选择市场
        - label: Caris 当前可覆盖临床市场（$2.0B - $3.5B）
          detail: 由全面组织 WES/WTS 和液体活检临床案例构成的即时可覆盖市场
        - label: Caris 2026 指引收入 SOM（$1.03B - $1.04B）
          detail: 2026 全年已实现收入指引，反映商业收入同比增长 27% 至 28%
        - label: Caris 2026 年第二季度运行率实现（收入 $263.7M）
          detail: 2026 年第二季度收入运行率由 59,200 个已完成临床案例支撑
    approximationNotes: 市场规模层级综合行业共识区间和 Caris 已报告财务数据，展示市场如何从广义的全流程医疗逐步收窄至公司已实现的 SOM。
