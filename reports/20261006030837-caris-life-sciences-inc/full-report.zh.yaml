      - number: '2.4'
        title: 增长驱动、采用约束与监管现实
        blocks:
          - type: paragraph
            body: >
              综合精准分析市场的扩张由科学、技术和临床因素共同推动。第一，靶向肿瘤疗法（如 KRAS、BRAF、RET、EGFR 和 HER2
              抑制剂）及免疫疗法快速发展并获得监管批准，使治疗选择前必须进行多基因生物标志物分析。第二，专业临床实践指南（尤其是
              NCCN）越来越多地要求对不同肿瘤类型开展广泛分子检测，推动医生下单。第三，分子分析效率提升——Caris 2026 年第二季度毛利率升至 68%，同比约改善 500
              bps——使高复杂度全外显子组和全转录组检测能够实现可持续的实验室单位经济性。


              但采用也面临重大的结构性约束。第三方支付方报销仍是最关键的阻力。分子诊断检测                           
              面临严格的临床效用门槛、限制性的事前授权流程，以及商业支付方可能拒绝索赔主张的风险。在 Medicare 收费表中，实验室自研检测（LDT）仍受 PAMA 等联邦框架和当地 MAC
              覆盖政策下的报销调整影响。对于新兴液体活检和早期检测模式，要获得广泛的合同报销，需要多年期前瞻性临床效用试验，以证明生存结局和成本效益得到改善。


              此外，社区肿瘤诊疗中的临床惯性、样本物流障碍（如福尔马林固定石蜡包埋肿瘤组织不足）以及对周转时间的敏感性，都会持续制造运营障碍。尽管 Caris 2026 年第二季度经营活动净现金为正 $28.5
              million，自由现金流为正 $6.4 million，但商业销售扩张、多癌种筛查基础设施（Caris Detect）和测序设备等资本密集型投资，仍需要审慎管理流动性和运营。
