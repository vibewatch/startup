      - number: '3.3'
        title: 定价、报销与护城河持久性
        blocks:
          - type: paragraph
            body: >-
              精准肿瘤学诊断的持久性依赖三根支柱：纳入临床指南（NCCN）、在 CMS Medicare 地方覆盖决定（LCD）和商业计划下取得合同报销，以及嵌入医生下单习惯和 EHR
              集成中的转换成本。对于组织样本分析，Caris 2025 财年的平均销售价格（ASP）约为 $4,030，此前报销显著改善；液体活检（Caris Assure）的 ASP 为 $2,800。Guardant
              Health 和 Foundation Medicine 等竞争者为其 CDx 产品建立了成熟的 Medicare 和商业覆盖流程。Caris 护城河面临的主要竞争威胁，是其 FDA
              伴随诊断批准相对不足，使强制检测订单流向同行；此外，PAMA 等联邦框架下的商业实验室报销压力仍在。生物制药数据服务属于可自由裁量的项目型支出，也容易受到药企预算收缩影响。
