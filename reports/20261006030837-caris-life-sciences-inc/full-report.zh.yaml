  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 临床分析产品组合与样本流程
        blocks:
          - type: paragraph
            body: >-
              Caris Life Sciences 提供精准肿瘤学分析方案，从 DNA、RNA 和蛋白质多个层面评估肿瘤生物学，而不是依赖窄热点面板。核心商业产品包括实体瘤组织样本的 Caris MI
              Profile，以及非侵入式血液液体活检的 Caris Assure。在临床实践中，下单医生将患者活检样本或外周血样本送至位于亚利桑那州 Phoenix 的 Caris
              中央实验室，完成自动提取、测序和病理复核。2026 年上半年，公司第一季度处理约 52,800 例临床治疗选择病例（包括 43,600 例 MI Profile 和 9,200 例 Caris
              Assure），第二季度将吞吐量提升至约 59,200 例（包括 48,300 例 MI Profile 和 10,700 例 Caris Assure）。此外，产品组合还通过 Caris ChromoSeq
              的推出及 MolDX 覆盖批准得到扩展；该产品用于髓系恶性肿瘤的全基因组肿瘤分析。公司还商业化推出 Caris Detect，这是一项用于识别早期循环信号的多癌种早期检测血液测试。
            claimRefs:
