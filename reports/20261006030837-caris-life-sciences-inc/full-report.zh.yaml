    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、发展阶段与多组学商业模式
        blocks:
          - type: paragraph
            body: >-
              Caris Life Sciences, Inc.（Nasdaq: CAI）是一家 AI 驱动的 TechBio 精准医疗公司，专注于推动癌症诊断和个体化治疗决策升级。公司成立于 2008 年，总部位于德州
              Irving，已搭建高通量分子分析基础设施，将全外显子组测序（WES）和全转录组测序（WTS）与人工智能、高性能认知计算结合。公司于 2025 年 6 月 18 日通过首次公开募股进入公开股票市场，并于 2026
              年 8 月宣布在 NYSE Texas 双重上市，补充其 Nasdaq 主上市地位。商业运营覆盖两大核心模式：通过自有 MI Profile 平台开展组织样本分析，以及通过 Caris Assure
              开展血液样本的综合液体活检分析。除为肿瘤患者及社区和学术医疗系统中的主治医生选择临床治疗方案外，Caris 还通过生物制药研发服务变现其临床基因组数据库，包括前瞻性和回顾性分子分析、伴随诊断开发及靶点发现合作。
