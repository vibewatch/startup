        blocks:
          - type: paragraph
            body: >-
              管理团队由创始人、董事长兼首席执行官 David Dean Halbert 博士领导。他于 2008 年创办公司，临床愿景聚焦全面分子特征分析。总裁 David Spetzler 博士、执行副董事长 Brian
              J. Brille、高级副总裁兼首席财务官 Luke Power，以及高级副总裁兼总法律顾问 J. Russel Denton 负责运营执行和商业扩张。Halbert
