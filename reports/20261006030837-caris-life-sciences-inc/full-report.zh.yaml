      - CI006
      - CI007
      - CI016
  - id: FE001
    title: Caris 精准肿瘤技术栈
    type: stack
    summary: Caris Life Sciences 平台架构概览，展示数据如何从样本采集流向临床 AI 和生物制药应用。
    approximationNotes: 平台示意图根据已发布的架构图、Nature biotechnology 综述及公司产品申报材料整理。
    claimRefs:
      - CE005
      - CE006
      - CE007
      - CE008
      - CE009
      - CE010
    data:
      layers:
        - label: 应用与决策支持层
          detail: 交互式医生门户、分子肿瘤委员会报告、疗法匹配和生物制药试验支持
          items:
            - 交互式医生门户与分子肿瘤委员会报告
            - Caris GPSai 组织来源预测
            - Caris FOLFIRSTai 化疗疗效评分
            - 生物制药靶点识别与试验支持
        - label: 数据与人工智能层
          detail: Caris CODEai 临床基因组聚合引擎，规模超过 1.13M 份总档案和 845K 份匹配结局
          items:
            - Caris CODEai 平台（>1.13M 份总档案 / >845K 份匹配档案）
            - Cohort Designer 真实世界数据查询引擎
            - 基于临床结局的多模态 AI 训练基础设施
            - 符合 HIPAA 要求的安全数据仓储
        - label: 生物信息学与变异识别层
          detail: 高性能计算集群执行比对、体细胞-生殖系过滤和特征计算
          items:
            - 全外显子组变异识别（SNVs、Indels、CNVs、gLOH、HRD、TMB）
            - 全转录组比对（基因融合、表达、免疫浸润）
            - Buffy Coat 体细胞-生殖系与 CHIP 突变扣除
            - 质量控制与自动化样本指标
        - label: 高通量测序层
          detail: 工业级 NGS 平台运行 WES（719 个基因 1,000x、全外显子组 500x）和 WTS（约 61,000 个转录本）
          items:
            - DNA 全外显子组测序（Illumina NovaSeq 上约 23,000 个基因）
            - RNA 全转录组测序（Illumina NovaSeq 上约 61,000 个转录本）
            - 流动池试剂与自动化液体处理器
            - 每位患者的原始测序输出超过 1 TB
        - label: 组织学与专用检测层
          detail: 自动染色仪器处理超过 15 项 IHC 检测，同时运行液体活检 WGS 流程
          items:
            - 蛋白免疫组化（Ventana 和 Dako 上超过 15 项染色）
            - 超过 35 种经临床验证的诊断抗体
            - Caris Assure 血浆 cfDNA/cfRNA 分离
            - 用于 Caris Detect 和 ChromoSeq 的全基因组测序
        - label: 样本接收与物流层
          detail: 集中完成样本登记和病理验证，再通过冷链运往 Phoenix 实验室
          items:
            - FFPE 实体瘤活检蜡块与病理切片
            - 外周血采集套件（血浆和 Buffy Coat）
            - 直接面向医疗服务提供方的物流与集中冷链接收
            - 病理质量评估与肿瘤细胞富集
  - id: FU001
    title: 客户采用路径与平台扩张闭环
    type: journey-map
    summary: 展示临床肿瘤客户从首次试用下单，到机构全面采用并将临床基因组数据变现的六阶段路径。
    data:
      items:
        - label: 临床发现
          description: 社区和学术肿瘤科医生评估全面检测的证据、NCCN 指南和 MolDX 覆盖范围
          touchpoints:
            - 医学事务团队沟通
            - 同行评审发表数据
            - 与当地病理科会诊
          tone: neutral
        - label: 试点下单
          description: 医生通过直接接入 EHR，首次为难治性或转移性癌症患者下达组织或液体活检订单
          touchpoints:
            - EHR 电子订单接收
            - 组织样本运输物流
            - 周转时间评估
          tone: opportunity
        - label: 常规采用
          description: 在 146 个销售区域配备专属区域经理，推动社区肿瘤诊所扩大采用
          touchpoints:
            - 146 名专属销售区域经理
            - 标准化临床报告门户
            - 第三方支付方账单结算
          tone: positive
        - label: 机构协同
          description: 医疗系统和学术中心将检测纳入标准临床路径，并加入 Precision Oncology Alliance
          touchpoints:
            - Precision Oncology Alliance（POA）成员资格
            - 全系统 EHR 工作流集成
            - 临床试验患者匹配
          tone: positive
        - label: 平台变现
          description: 去标识化患者分子档案进入 CODEai 数据库，推动生物制药二次靶点发现和研究许可
          touchpoints:
            - CODEai 临床基因组数据库（1.13M+ 份档案）
            - 生物制药发现合作（Genentech）
            - 早期检测筛查扩张（Caris Detect）
          tone: opportunity
        - label: 筛查与拦截
          description: 借助 Caris Detect，拓展至人群层面的多癌种早期检测和患者纵向监测
          touchpoints:
            - Everlywell 样本采集渠道
            - 消费者自费诊断门户
            - Mutational cleanse 个性化免疫靶点
          tone: opportunity
    approximationNotes: 路径阶段是对临床工作流整合的定性总结，综合 Caris 商业披露和精准肿瘤领域的标准采用周期。
    claimRefs:
      - CU002
      - CU004
      - CU008
      - CU010
