      - number: '8.2'
        title: 资本结构、融资历史与估值倍数
        blocks:
          - type: paragraph
            body: >
              Caris Life Sciences 以 CAI 为股票代码在 Nasdaq 交易，截至 2026 年 10 月初，盘中市值约为 $8.59B 至 $8.95B（股价约 $30.39 至
              $30.60）。上市前，Caris 筹集了大量机构资本，包括 2025 年 4 月由 Braidwell LP 领投、Millennium Management、Perceptive Advisors 和
              First Light Asset Management 参与的 $168 million 成长融资轮，使其自 2018 年以来筹集的私募股权资本总额达到 $1.86 billion。
              为增强经营流动性、避免立即股权稀释，Caris 于 2026 年 4 月 1 日从 Blue Owl Capital 和 Blackstone 管理的基金取得 $1.2 billion
              高级债务融资协议。该交易先行提供一笔 $400 million 定期贷款工具， 2031 年 4 月到期；另有一笔可用至 2027 年 8 月的 $300 million 延迟提款工具，以及 $500
              million 未承诺增额贷款额度。


              按当前市场价格，Caris 的企业价值约为过去十二个月收入（TTM 收入 $989.6 million）的 8.7 倍， 约为 2026 年前瞻指引收入中值（$1.035 billion）的 EV 8.3
              倍。由于 GAAP 净利润基数很小，静态 市盈率波动很大；但前瞻共识 P/E 仍处于约 43 倍至 136 倍的高位，具体取决于利润正常化和股权激励 处理方式。截至 2026 年中，公司现金头寸为 $793.1
              million，季度经营现金流为正（2026 年第一季度 $32.9 million，第二季度 $28.5 million），在偿付高级有担保债务的同时仍能提供足够的经营续航。
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
