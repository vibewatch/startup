      - number: '2.2'
        title: 市场规模视角：TAM、SAM 与已实现 SOM
        blocks:
          - type: paragraph
            body: >
              评估精准肿瘤学和综合基因组分析市场，需要采用不同分析视角，而不能依赖单一宽泛预测。从宏观 TAM
              看，肿瘤诊断和精准医疗属于持续扩张的全球肿瘤治疗与检测生态。市场研究机构和金融分析师发布的规模估算口径各异，涵盖全球下一代测序、专业综合基因组分析（CGP）以及广义癌症诊断。在美国临床肿瘤市场中，可服务患者群体由实体瘤和血液恶性肿瘤的发病率决定，行业基准估算的临床治疗选择
              TAM 每年约为 $8 billion–$15 billion。


              SAM 收窄至临床指南建议进行广泛分子分析、以选择靶向治疗、免疫疗法或临床试验的晚期及转移性癌症患者。将 Caris 当前产品组合纳入考量——包括组织样本 MI Profile、血液样本 Caris
              Assure，以及新推出的 Caris ChromoSeq 和 Caris
              Detect——美国可触达的临床检测量每年达数十万例。此外，早期癌症检测市场代表一条数十亿美元规模的长期扩张路径，但仍处于商业化早期，且要证明无症状筛查的临床效用。


              SOM 代表 Caris 已实现的商业表现。在商业引擎支持下，Caris 仅在 2026 年第二季度就完成约 59,200 例临床病例（同比增长 18%，环比增长 12%），其中约 48,300 例为 MI
              Profile 组织样本病例，10,700 例为 Caris Assure 液体活检病例。继 2026 年第一季度收入 $216.2 million、第二季度收入 $263.7 million 后，Caris 将
              2026 全年收入指引上调至 $1.03 billion–$1.04 billion（较 2025 年增长 27%–28%），显示检测量仍在保持两位数增长，并已在高复杂度多组学分析细分市场建立领先份额。
