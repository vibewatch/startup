      - number: '5.2'
        title: Laboratory Technology Stack, Informatics, and CODEai Platform
        blocks:
          - type: paragraph
            body: >-
              The core technological foundation at Caris integrates industrial-scale next-generation sequencing
              hardware, high-throughput immunohistochemistry, and distributed computing bioinformatics. On tissue
              samples, Caris conducts whole-exome sequencing (WES) across approximately 23,000 genes with 719 clinically
              relevant genes sequenced at 1,000x coverage (and the remainder at 400x to 500x) on Illumina NovaSeq
              instruments, alongside whole-transcriptome sequencing (WTS) covering roughly 61,000 transcripts for gene
              fusions, expression changes, and immune infiltration signatures. Complementing genomic sequencing,
              automated Ventana and Dako staining instruments process over 15 clinically relevant immunohistochemical
              assays using more than 35 validated antibodies. In liquid biopsy workflows under Caris Assure, the
              laboratory evaluates circulating cell-free DNA (cfDNA) and cell-free RNA (cfRNA) from plasma paired with
              genomic DNA and RNA sequencing from buffy-coat white blood cells to perform somatic-germline subtraction
              and filter out clonal hematopoiesis of indeterminate potential (CHIP). At the computational layer, Caris
              CODEai integrates molecular profiling with longitudinal clinical outcomes, demographic records, and
              survival data, scaling past 1,130,000 total profiles and 845,000 matched clinico-genomic profiles by
              mid-2026. Automated financial intelligence aggregators and market listings sometimes cross-index Caris
              under the ticker symbol CAI on Nasdaq, which historically belonged to CAI International, Inc., a
              transportation finance and container leasing company founded in 1989 and listed on the NYSE prior to its
              acquisition; diligence on Caris Life Sciences' clinical informatics stack requires isolating TechBio
              filings from legacy shipping-container records.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
              - CE014
              - CE015
