      - Conventional Clinical Workflow
      - Caris Technology Solution
      - Measurable Clinical / Workflow Benefit
      - Technical Limitation / Friction
    rows:
      - - First-line therapy selection in metastatic solid tumors
        - Targeted small NGS panel (50-500 genes) testing known actionable mutations
        - Caris MI Profile whole exome and whole transcriptome sequencing
        - Identifies rare fusions, full-exome TMB, HRD, and non-hotspot variants without panel obsolescence
        - Longer laboratory sequencing turnaround time compared to rapid single-gene PCR
      - - Non-invasive therapy selection when tissue is unavailable
        - Repeat invasive core needle biopsy or liquid biopsy testing cfDNA alone
        - Caris Assure dual plasma and buffy-coat sequencing
        - Avoids invasive biopsy complications; buffy coat isolates CHIP mutations to reduce false positives
        - Lower circulating tumor fraction in early-stage disease or sanctuary CNS metastases
      - - Determining primary site for Cancer of Unknown Primary (CUP)
        - Iterative rounds of immunohistochemical stains and diagnostic imaging
        - Caris GPSai machine learning tissue-of-origin algorithm
        - Algorithmic classification from genomic and transcriptomic signatures to guide targeted therapy
        - Requires sufficient molecular signal and validation across rare histology subtypes
      - - Predicting chemotherapy response in metastatic colorectal cancer
        - Standard empiric selection between FOLFOX and FOLFIRI regimens
        - Caris FOLFIRSTai artificial intelligence molecular predictor
        - Guides optimal first-line regimen selection to improve progression-free and overall survival
        - Confined to specific mCRC indications; clinician inertia in altering clinical practice guidelines
