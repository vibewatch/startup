      - number: '6.2'
        title: Clinical Adoption Trajectory and Sales Force Expansion
        blocks:
          - type: paragraph
            body: >-
              Clinical utilization of Caris's comprehensive molecular profiling platform demonstrated rapid acceleration
              across 2025 and the first half of 2026. For the full year 2025, Caris completed approximately 199,300
              clinical therapy selection cases, representing 22% year-over-year volume growth over 2024, divided between
              170,300 tissue-based MI Profile cases and 29,000 blood-based Caris Assure liquid biopsy cases. This
              momentum continued into 2026 following a strategic commercial realignment executed in January 2026.
              Clinical throughput reached approximately 52,800 cases in Q1 2026 (including 43,600 MI Profile and 9,200
              Caris Assure cases) and expanded to a record 59,200 clinical cases in Q2 2026 (including 48,300 MI Profile
              and 10,700 Caris Assure cases). The Q2 2026 throughput represented 18% year-over-year clinical volume
              growth and an annualized run-rate exceeding 236,000 clinical cases. Management attributed this volume
              inflection directly to the aggressive restructuring and expansion of its commercial sales territory
              structure from 82 territories to 146 territories, expanding the field sales force to over 300
              professionals. Concurrently, clinical average selling price (ASP) increased by 30% in Q2 2026 due to
              improved third-party payer contract execution and expanded reimbursement recognition.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
