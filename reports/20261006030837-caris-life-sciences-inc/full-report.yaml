            body: >-
              The executive team is led by Founder, Chairman, and Chief Executive Officer Dr. David Dean Halbert, who
              established the enterprise in 2008 with a clinical vision centered on comprehensive molecular
              characterization. Operational execution and commercial scaling are driven by President Dr. David Spetzler,
              Executive Vice Chairman Brian J. Brille, Senior Vice President and Chief Financial Officer Luke Power, and
