  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Clinical Profiling Portfolio and Specimen Workflows
        blocks:
          - type: paragraph
            body: >-
              Caris Life Sciences provides precision oncology profiling solutions designed to evaluate tumor biology
              across DNA, RNA, and protein levels rather than relying on narrow hotspot panels. The core commercial
              product line comprises Caris MI Profile for solid tumor tissue samples and Caris Assure for non-invasive
              blood-based liquid biopsy. In clinical practice, ordering physicians route patient biopsies or peripheral
              blood collections to Caris's centralized laboratory infrastructure in Phoenix, Arizona, where automated
              extraction, sequencing, and pathology review take place. During the first half of 2026, the company
              processed approximately 52,800 clinical therapy selection cases in Q1 (comprising 43,600 MI Profile and
              9,200 Caris Assure cases) and expanded throughput to approximately 59,200 clinical cases in Q2 (comprising
              48,300 MI Profile and 10,700 Caris Assure cases). Furthermore, the portfolio expanded through the launch
              and MolDX coverage approval of Caris ChromoSeq, a whole-genome tumor profiling assay for myeloid
              malignancies, as well as the commercial launch of Caris Detect, a multi-cancer early detection blood test
              designed to identify early-stage circulating signals.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
