        title: Cost Structure, Operating Leverage, and Margin Progression
        blocks:
          - type: paragraph
            body: >-
              Operating economics for Caris have demonstrated substantial gross margin expansion as testing volumes
              scale across its high-throughput sequencing infrastructure. Consolidated gross margin reached 68% in Q2
              2026 ($179.6 million gross profit), expanding from 63% in Q2 2025 and building upon full-year 2025 gross
              margin of 66%. For the six months ended June 30, 2026, cost of molecular profiling services was $154.2
              million against $463.1 million in segment revenue, generating an underlying molecular profiling service
              gross margin of 66.7%. Cost of services is driven by sequencing consumables, reagents, flow cells,
              molecular pathologist interpretation, and clinical laboratory technician personnel. Operating expenses
              totaled $152.7 million in Q2 2026, including $66.5 million in general and administrative overhead, $53.8
              million in sales and marketing investments to expand the oncologic field force, and $32.4 million in
              research and development funding clinical assay validation. For the first half of 2026, research and
              development expenditures totaled $63.7 million as the organization invested in Caris Detect, Caris
              ChromoSeq, and Caris MI Clarity platforms.
