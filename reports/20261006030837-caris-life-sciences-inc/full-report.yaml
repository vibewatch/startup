      - number: '7.3'
        title: Financial, Partner, and Thesis Risk
        blocks:
          - type: paragraph
            body: >-
              Financial performance supplies meaningful mitigation but not immunity. Caris reported $216.2 million of
              first-quarter revenue and $263.7 million in the second quarter; however, reported free cash flow fell from
              $22.5 million to $6.4 million between those quarters, and the company still reported a small GAAP net loss
              in Q2. First-quarter growth combined 15% case-volume growth with a much larger 61% ASP increase, making
              payer realization and coding durability central sensitivities rather than secondary details. The
              refinanced credit facility extends funding flexibility, but it also preserves lender and covenant
              dependence. Public-market evidence adds a sentiment warning: independent sources show a sharp
              post-earnings move and a wide 52-week trading range. The investment thesis should be re-underwritten if
              payer economics weaken, the legal matter becomes financially material, product launches fail to convert
              into repeat volume, or cash generation reverses for multiple quarters.
