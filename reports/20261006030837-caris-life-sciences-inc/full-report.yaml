              - CV006
              - CV011
              - CV012
      - number: '8.2'
        title: Capital Structure, Financing History, and Valuation Multiples
        blocks:
          - type: paragraph
            body: >
              Caris Life Sciences trades on Nasdaq under ticker CAI with an intraday market capitalization of
              approximately $8.59B to $8.95B as of early October 2026 (trading around $30.39 to $30.60 per share). Prior
              to its public listing, Caris raised significant institutional capital, including a $168 million growth
              financing round in April 2025 led by Braidwell LP with participation from Millennium Management,
              Perceptive Advisors, and First Light Asset Management, bringing total private equity capital raised since
              2018 to $1.86 billion. To strengthen operational liquidity without immediate equity dilution, Caris
              secured a $1.2 billion senior debt financing agreement on April 1, 2026, from funds managed by Blue Owl
              Capital and Blackstone. This transaction funded an initial $400 million term facility maturing in April
              2031, alongside a $300 million delayed draw facility available through August 2027 and a $500 million
              uncommitted accordion.


              At current market pricing, Caris trades at approximately 8.7x Enterprise Value to trailing twelve-month
              revenue ($989.6 million TTM revenue) and roughly 8.3x EV to 2026 forward guided revenue midpoint ($1.035
              billion). Trailing price-to-earnings ratios fluctuate significantly due to small GAAP net income bases,
              but forward consensus P/E stands elevated at approximately 43x to 136x depending on normalization and
              stock-based compensation treatments. The company's cash position stood at $793.1 million as of mid-2026,
              bolstered by positive quarterly operating cash flows ($32.9 million in Q1 2026 and $28.5 million in Q2
              2026), providing adequate operational runway while servicing senior secured obligations.
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
          - type: figure
