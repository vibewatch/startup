              Caris Life Sciences operates a dual-revenue commercial model dominated by clinical molecular profiling
              services alongside biopharmaceutical research and development partnerships. In the second quarter of 2026,
              total reported revenue expanded 45% year-over-year to $263.7 million, with molecular profiling services
              contributing $252.3 million, or 95.7% of total revenue. Clinical therapy selection volume reached
              approximately 59,200 completed cases in Q2 2026, comprising roughly 48,300 MI Profile comprehensive tissue
