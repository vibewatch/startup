chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Stage, and Multi-Omic Business Model
        blocks:
          - type: paragraph
            body: >-
              Caris Life Sciences, Inc. (Nasdaq: CAI) operates as a leading AI-enabled TechBio precision medicine
              company focused on transforming cancer diagnostics and personalized therapy selection. Founded in 2008 and
              headquartered in Irving, Texas, Caris developed a high-throughput molecular profiling infrastructure that
              couples Whole Exome Sequencing (WES) and Whole Transcriptome Sequencing (WTS) with artificial intelligence
              and high-performance cognitive computing. The company transitioned to the public equity markets via an
              initial public offering on June 18, 2025, complementing its primary Nasdaq listing with an announced dual
              listing on NYSE Texas in August 2026. Commercial operations span dual core modalities: tissue-based
              profiling via the proprietary MI Profile platform and blood-based comprehensive liquid biopsy profiling
              through Caris Assure. In addition to clinical therapy selection for oncology patients and treating
              physicians across community and academic health systems, Caris monetizes its clinico-genomic database
              through biopharmaceutical research and development services, including prospective and retrospective
              molecular profiling, companion diagnostics development, and target discovery partnerships.
