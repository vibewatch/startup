      - number: '6.4'
        title: Retention Durability, Channel Friction, and Concentration Exposures
        blocks:
          - type: paragraph
            body: >-
              Despite robust top-line clinical case growth, Caris exhibits critical structural disclosures and retention
              risks that warrant rigorous investment scrutiny. Because clinical diagnostics operates on a
              fee-for-service, per-specimen ordering model rather than software-as-a-service subscriptions, Caris does
              not disclose standard software retention metrics such as Net Revenue Retention (NRR), Gross Revenue
              Retention (GRR), or physician churn rates. Commercial oncologists face negligible technical switching
              costs and routinely split or rotate test orders across competing platforms such as Foundation Medicine,
              Guardant Health, Tempus AI, and NeoGenomics. Furthermore, realized revenues remain highly dependent on
              third-party reimbursement cycles, coverage determinations, and billing collections. For instance,
              management warned of potential fulfillment bottlenecks and back orders for Caris Detect due to rapid early
              demand potentially outpacing the tripling of laboratory capacity, while pursuing a direct self-pay
              commercial route to bypass sluggish commercial payer coverage. In the biopharma division, revenue dropped
              sharply from $63.1 million in FY2024 to $45.3 million in FY2025 before rebounding to an estimated $75
              million to $85 million guidance range for FY2026, exposing substantial project-based lumpy revenue
              concentration and renewal volatility.
            claimRefs:
              - CU014
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Commercial Restructuring Drives Operating Leverage via Territory Density
            body: >-
              Caris's decision to expand its sales territory structure from 82 to 146 territories in early 2026
              represents a pivotal transition from opportunistic account acquisition to disciplined territory density.
              Expanding the field team to over 300 personnel contributed directly to sequential volume expansion from
              52,800 cases in Q1 to 59,200 cases in Q2, while enabling a 30% increase in clinical average selling price
              through tighter payer collections and physician education.
            calloutType: insight
            claimRefs:
              - CU007
              - CU008
              - CU009
          - type: callout
            title: Lack of Contractual Retention Visibility in Fee-for-Service Diagnostics
            body: >-
              Unlike recurring software business models, clinical oncology diagnostic testing is characterized by
              transactional per-specimen ordering where oncologists face no switching friction. With Caris withholding
              quantitative account retention, net revenue retention (NRR), and biopharma contract backlog, investors
              remain exposed to unquantified physician ordering churn and biopharma contract lumpiness.
            calloutType: risk
            claimRefs:
              - CU014
              - CU015
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Legal, and Data Risk
        blocks:
          - type: paragraph
            body: >-
              The highest-uncertainty legal issue is not a proved liability but an evidence gap. Hudson Labs reports
              ongoing legal and regulatory risk that includes a DOJ investigation and internal controls, while Caris's
              own 2026 disclosures list government investigations and litigation among factors that could materially
              affect results. The assigned pool contains neither the underlying government correspondence nor a current
              reserve estimate, so probability and loss magnitude cannot be responsibly quantified. Reimbursement is the
              more observable regulatory mechanism: management attributes improved cash generation and revenue partly to
              reimbursement and ASP gains, while its risk disclosures explicitly identify payer coverage decisions.
              Patient-data scale also makes privacy, cybersecurity, and data-processing controls economically material,
              but the pool contains no control audit, certification, incident register, or recovery metrics. Legal
              status, reimbursement durability, and control effectiveness therefore remain direct diligence items rather
              than cleared risks.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR011
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR011
              - CR013
      - number: '7.2'
        title: Operational and Product Execution
        blocks:
          - type: paragraph
            body: >-
              Caris reduced one element of product-launch risk by reporting the Caris Detect launch in the second
              quarter and displaying the test as available on its website. Residual risk shifts from launch timing to
              clinical utility, market acceptance, throughput, and implementation: the company's own first-quarter risk
              language says technical or operational failures could delay or prevent commercialization. Execution
              complexity also rose as management expanded sales territories from 82 to 146 and continued hiring toward
              roughly 300 commercial staff. That expansion can improve reach, but it also creates ramp, productivity,
              and coordination risk that public case-volume growth cannot fully resolve. Supplier reliance,
              data-platform resilience, assay failure rates, turnaround times, and capacity utilization are not
              quantified in the assigned evidence. Investors should treat launch announcements as milestones, not proof
              of durable adoption or reliable scaled delivery.
            claimRefs:
              - CR008
