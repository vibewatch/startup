      - number: '3.3'
        title: Pricing, Reimbursement, and Moat Durability
        blocks:
          - type: paragraph
            body: >-
              Durability in precision oncology diagnostics relies on three primary pillars: clinical guideline inclusion
              (NCCN), contracted payer reimbursement under CMS Medicare Local Coverage Determinations (LCDs) and
              commercial plans, and switching costs embedded in clinician ordering habits and EHR integrations. For
              tissue-based profiling, Caris achieved an average selling price (ASP) of approximately $4,030 in FY2025
              following significant reimbursement gains, while liquid biopsy (Caris Assure) commanded an ASP of $2,800.
              Competitors like Guardant Health and Foundation Medicine utilize established Medicare and commercial
              coverage pipelines for their CDx offerings. The major competitive threat to Caris's moat stems from its
              relative deficit in FDA companion diagnostic approvals, which directs mandatory test ordering to peers, as
              well as ongoing commercial lab reimbursement pressure under federal frameworks such as PAMA. Additionally,
              biopharma data services—representing discretionary project-based spend—remain vulnerable to pharmaceutical
              budget contractions.
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Structural Deficit in FDA Companion Diagnostic Approvals
            body: >-
              While Caris delivers superior technical depth via whole exome and whole transcriptome profiling,
              competitors like Foundation Medicine and Guardant Health hold regulatory moats via FDA-approved companion
              diagnostics (CDx) explicitly mandated in targeted drug labels. Without equivalent CDx approvals, Caris
              relies strictly on physician preference and clinical education, creating a commercial disadvantage in
              routine clinical workflows.
            calloutType: risk
            claimRefs:
              - CP004
              - CP006
              - CP007
          - type: callout
            title: Real-World Multi-Omic Database as AI Platform Differentiation
            body: >-
              Caris's proprietary database of over 1.13 million tumor profiles—including more than 783,000 whole
              transcriptomes and 733,000 whole exomes—serves as a high-barrier data flywheel. This scale allows Caris to
              train proprietary AI predictive algorithms (such as Caris AI Insights and Caris Detect) that pure clinical
              laboratories cannot easily replicate without massive capital and longitudinal clinical outcome matching.
            calloutType: insight
            claimRefs:
              - CP003
              - CP005
              - CP009
