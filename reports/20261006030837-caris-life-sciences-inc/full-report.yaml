      - number: '6.3'
        title: Named Customer Proof and Biopharma Collaborations
        blocks:
          - type: paragraph
            body: >-
              Proof of clinical and commercial adoption is evidenced across top-tier cancer research networks and major
              biopharmaceutical partnerships. Within the institutional clinical domain, the Caris Precision Oncology
              Alliance (POA) functions as a premier collaborative network encompassing leading academic cancer centers
              and health systems globally, providing direct electronic health record (EHR) integration that allows
              clinicians to electronically order molecular profiling and review genomic reports within native hospital
              workflows. In the commercial biopharma segment, Caris established a multi-year research collaboration with
              Genentech to discover novel therapeutic targets in oncologic indications characterized by high unmet
              medical need, leveraging Caris's large-scale clinico-genomic database. In early-detection consumer and
              physician diagnostics, Caris partnered with Everlywell to prepare the commercial distribution and specimen
              collection logistics for Caris Detect, its forthcoming multi-cancer early detection (MCED) blood assay.
              Independent market coverage and Wall Street analyst reviews further reflect broad professional visibility,
              with 15 brokerage firms maintaining coverage on Caris Life Sciences (CAI) with an average brokerage
              recommendation (ABR) of 1.67, including 10 Strong Buy recommendations.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
          - type: table
