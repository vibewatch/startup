              - CV005
              - CV006
              - CV009
              - CV010
      - number: '8.3'
        title: Scenario Analysis, Catalysts, and Diligence Asks
        blocks:
          - type: paragraph
            body: >
              To determine risk-adjusted returns, we model bull, base, and bear operating scenarios across a 2-to-3-year
              investment horizon. In the bull case, Caris Detect successfully secures broad clinical adoption and
              favorable Medicare MolDX local coverage determinations, accelerating overall revenue growth toward 30–35%
              annually, expanding gross margins to 72%, and generating over $200 million in annual free cash flow. In
              this scenario, enterprise value could appreciate toward $12.0B–$14.0B ($42–$48 per share). In the base
              case, Caris delivers on its guided 2026 baseline ($1.03B–$1.04B) and scales 20–23% annually through core
              therapy selection testing (MI Profile and Caris Assure), while Detect adoption progresses moderately,
              yielding fair market valuation of $8.5B–$9.5B ($28–$33 per share), aligning closely with consensus Wall
              Street price targets of $28.15.


              In the bear scenario, adverse payer coverage rulings, reimbursement rate compression across solid tumor
              molecular profiling, or execution delays in multi-cancer early detection reduce top-line revenue growth
              below 15%. Given high fixed laboratory operating costs and floating-rate senior debt interest obligations
              (SOFR + 500 bps on $400 million+ funded debt), net margins would contract, risking valuation multiple
              compression toward 4.0x–5.0x EV/revenue, or an enterprise valuation of $4.5B–$5.5B ($16–$19 per share).
              Key diligence triggers include monitoring quarterly realized average selling prices (ASPs), clinical study
              endpoints for Detect (Achieve 1 readout follow-up), and any progress or reserve adjustments regarding
              Department of Justice or federal civil investigative demands.
            claimRefs:
              - CV002
              - CV003
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV007
              - CV010
              - CV011
              - CV012
              - CV013
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Investment Stance: Track at Current Valuation Levels'
            body: >-
              With Caris trading near $30.40 per share and an enterprise value around $8.6B, the market appears to
              appropriately price the company's 2026 guidance increase ($1.03B–$1.04B) and gross margin expansion. Given
              the $400M funded senior credit facility, high P/E valuation, and pending clinical and reimbursement
              validations for Caris Detect, investors should track performance rather than initiate aggressive long
              positions, awaiting an entry multiple closer to 6.5x EV/sales or tangible evidence of GAAP operating
              margin expansion.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV008
              - CV010
          - type: callout
            title: Adverse Multiple Compression and Floating Debt Exposure
            body: >-
              TIKR analysis notes Caris stock experienced a 29% pullback earlier in 2026, illustrating high volatility
              for newly listed precision oncology platforms trading at triple-digit or elevated forward P/E multiples.
              In a scenario where clinical test adoption decelerates or SOFR borrowing rates remain elevated on the
              $400M term loan (SOFR + 500 bps), debt servicing and multiple compression pose material downside risk to
              equity valuation.
            calloutType: risk
            claimRefs:
              - CV004
              - CV005
              - CV007
              - CV011
