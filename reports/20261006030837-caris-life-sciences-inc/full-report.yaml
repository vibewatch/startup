      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Monitorable thesis-break triggers
            body: >-
              Re-underwrite the investment if a government matter creates a material reserve, repayment, or operating
              restriction; payer-level realized ASP or free cash flow deteriorates for two consecutive quarters; Caris
              Detect fails to produce repeat ordering and acceptable downstream clinical workflows; or a supplier,
