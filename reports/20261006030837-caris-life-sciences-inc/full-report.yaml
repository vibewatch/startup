              with $793 million in cash and investments, supported by an earlier refinancing of its $400 million term
              loan facility with Blue Owl and Blackstone, while returning capital through an authorized $100 million
              share repurchase program ($18 million executed in Q2). As of October 5, 2026, Caris common stock traded at
              $30.39 on Nasdaq, establishing an equity market capitalization of approximately $8.59 billion against
