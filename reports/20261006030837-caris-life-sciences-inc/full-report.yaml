      - number: '3.2'
        title: Peer Profiles and Core Capabilities
        blocks:
          - type: paragraph
            body: >-
              Evaluating Caris against its primary direct competitors reveals significant structural tradeoffs in scale,
              product scope, and distribution power. Foundation Medicine, fully owned by Roche, commands deep
              pharmaceutical distribution channels and broad FDA companion diagnostic approvals with its FoundationOne
              CDx and FoundationOne Liquid CDx platforms, granting it mandatory testing status when oncologists
              prescribe certain targeted therapies. Guardant Health represents the category leader in blood-based liquid
              biopsy with Guardant360 CDx and its FDA-approved Shield colorectal screening test, supported by a
              substantial commercial footprint and over $1 billion in liquidity. Tempus AI mirrors Caris's TechBio
              positioning by combining genomic profiling with algorithmic clinical decision tools and biopharma data
              licensing, but has scaled its recurring data-licensing business more aggressively. In contrast,
              specialized lab networks like NeoGenomics provide broad community oncology access but lack Caris's deep
              multi-omic dataset.
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
