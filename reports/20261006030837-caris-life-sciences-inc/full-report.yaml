        title: Capitalization Structure, Scale Trajectory, and Commercial Performance
        blocks:
          - type: paragraph
            body: >-
              Caris maintains strong commercial momentum and substantial liquidity across fiscal 2026. In the second
              quarter ended June 30, 2026, total revenue reached $263.7 million, representing a 45% year-over-year
              increase compared to $181.4 million in Q2 2025, driven primarily by 55% growth in molecular profiling
