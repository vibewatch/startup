      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Comprehensive WES/WTS Sequencing as a Data Moat
            body: >-
              By standardizing on whole-exome DNA and whole-transcriptome RNA sequencing rather than restricted gene
              panels, Caris generates over 1 TB of biomarker data per patient. This strategy prevents diagnostic
              obsolescence as new oncology biomarkers emerge, enables retroactive re-analysis of banked data, and fuels
              the CODEai real-world clinico-genomic database across 1.13 million total profiles.
            calloutType: insight
            claimRefs:
              - CE005
              - CE008
              - CE009
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Payer Architecture
        blocks:
          - type: paragraph
            body: >-
              Caris Life Sciences serves two distinct customer constituencies characterized by divergent ordering
              workflows, economic buyers, and value realization models. The primary volume and revenue engine is the
              clinical oncology segment, encompassing community oncology practices, academic medical centers, integrated
              delivery networks (IDNs), and hospital pathology departments. In this clinical channel, the treating
              oncologist or pathologist acts as the primary clinical decision-maker and ordering user, while commercial
              health plans, Medicare, Medicare Advantage, and self-insured employer health plans serve as the primary
              third-party payers. Community oncology practices represent the vast majority of routine testing volume due
              to distributed cancer care delivery patterns across the United States. Academic medical centers and
              comprehensive cancer centers, organized collaboratively under the Caris Precision Oncology Alliance (POA),
              generate high-complexity profiling cases, participate in biomarker research, and validate clinical
              utility. The secondary customer segment consists of global biopharmaceutical and biotechnology
              enterprises, such as Genentech and other precision medicine developers, who purchase access to
              de-identified clinico-genomic data, translational research services, and clinical trial matching solutions
              from Caris's repository of over 1.13 million total profiles and 845,000 matched patient profiles.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
