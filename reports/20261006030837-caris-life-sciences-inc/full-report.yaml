  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Sizing Scope, and Substitutes
        blocks:
          - type: paragraph
            body: >
              Caris Life Sciences operates within the advanced precision oncology diagnostics and TechBio data
              ecosystem, defining its core market around high-complexity molecular profiling for cancer patients. The
              commercial boundary spans two primary operational domains: comprehensive clinical molecular profiling
              services and biopharmaceutical research services. In clinical testing, spend is driven by diagnostic
              evaluation of solid tumors and hematologic malignancies, incorporating tissue-based testing (MI Profile)
              and liquid biopsy blood testing (Caris Assure), augmented by multi-cancer early detection (Caris Detect)
              and whole-genome profiling for myeloid malignancies (Caris ChromoSeq). Spend includes laboratory specimen
              processing, whole exome sequencing, whole transcriptome sequencing, immunohistochemistry, and AI-driven
              clinical interpretation. Excluded spend includes routine anatomic histology, general reference laboratory
              blood panels, non-molecular radiology, surgical intervention costs, and direct oncology pharmaceutical
              therapeutics.


              Status-quo substitutes across oncology care encompass traditional single-biomarker assays, focused
              next-generation sequencing (NGS) hotspot panels (often covering 50 to 500 genes), and institutional
              in-house pathology lab testing. Compared to focused panels offered by competitors such as Foundation
              Medicine, Guardant Health, or local academic medical centers, Caris positions its comprehensive whole
              exome and whole transcriptome platform as an information-rich standard that eliminates the diagnostic
              blind spots of narrow panels. In biopharma services, spend includes biomarker discovery, translational
              research datasets, clinical trial patient matching, and companion diagnostic validation, competing against
              contract research organizations, proprietary pharma R&D pipelines, and clinical data aggregators.


              Evaluating market boundary constraints reveals that while Caris generated $263.7 million in total revenue
              in Q2 2026 (an increase of 45% year-over-year) and completed approximately 59,200 clinical cases, realized
              market capture remains governed by clinical testing volume, third-party reimbursement determination, and
              average selling price (ASP) stability across therapy selection solutions.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
