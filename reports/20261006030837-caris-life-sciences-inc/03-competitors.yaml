callouts:
  - calloutType: "risk"
    title: "Structural Deficit in FDA Companion Diagnostic Approvals"
    body: "While Caris delivers superior technical depth via whole exome and whole transcriptome profiling, competitors like Foundation Medicine and Guardant Health hold regulatory moats via FDA-approved companion diagnostics (CDx) explicitly mandated in targeted drug labels. Without equivalent CDx approvals, Caris relies strictly on physician preference and clinical education, creating a commercial disadvantage in routine clinical workflows."
    claimRefs:
      - "CP004"
      - "CP006"
      - "CP007"
  - calloutType: "insight"
    title: "Real-World Multi-Omic Database as AI Platform Differentiation"
    body: "Caris's proprietary database of over 1.13 million tumor profiles—including more than 783,000 whole transcriptomes and 733,000 whole exomes—serves as a high-barrier data flywheel. This scale allows Caris to train proprietary AI predictive algorithms (such as Caris AI Insights and Caris Detect) that pure clinical laboratories cannot easily replicate without massive capital and longitudinal clinical outcome matching."
    claimRefs:
      - "CP003"
      - "CP005"
      - "CP009"
