company:
  name: "Caris Life Sciences, Inc."
chapter:
  number: 6
  title: "Customers"
  summary: "Caris Life Sciences operates a dual-engine commercial customer architecture serving clinical oncology prescribers across community cancer centers, academic medical institutions, and health networks, alongside biopharmaceutical enterprise partners licensing clinico-genomic datasets and target discovery services. Clinical case adoption expanded to approximately 52,800 cases in Q1 2026 and a record 59,200 cases in Q2 2026, driven by a sales territory restructuring from 82 to 146 territories and commercial sales force expansion to over 300 personnel, yet customer retention metrics, net revenue retention (NRR), and biopharma contract concentration remain undisclosed."
sections:
  - id: "customer-base-segmentation"
    title: "Customer Base Segmentation and Payer Architecture"
    body: "Caris Life Sciences serves two distinct customer constituencies characterized by divergent ordering workflows, economic buyers, and value realization models. The primary volume and revenue engine is the clinical oncology segment, encompassing community oncology practices, academic medical centers, integrated delivery networks (IDNs), and hospital pathology departments. In this clinical channel, the treating oncologist or pathologist acts as the primary clinical decision-maker and ordering user, while commercial health plans, Medicare, Medicare Advantage, and self-insured employer health plans serve as the primary third-party payers. Community oncology practices represent the vast majority of routine testing volume due to distributed cancer care delivery patterns across the United States. Academic medical centers and comprehensive cancer centers, organized collaboratively under the Caris Precision Oncology Alliance (POA), generate high-complexity profiling cases, participate in biomarker research, and validate clinical utility. The secondary customer segment consists of global biopharmaceutical and biotechnology enterprises, such as Genentech and other precision medicine developers, who purchase access to de-identified clinico-genomic data, translational research services, and clinical trial matching solutions from Caris's repository of over 1.13 million total profiles and 845,000 matched patient profiles."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
    tableRefs:
      - "TU001"
    figureRefs:
      - "FU001"
  - id: "clinical-adoption-trajectory"
    title: "Clinical Adoption Trajectory and Sales Force Expansion"
    body: "Clinical utilization of Caris's comprehensive molecular profiling platform demonstrated rapid acceleration across 2025 and the first half of 2026. For the full year 2025, Caris completed approximately 199,300 clinical therapy selection cases, representing 22% year-over-year volume growth over 2024, divided between 170,300 tissue-based MI Profile cases and 29,000 blood-based Caris Assure liquid biopsy cases. This momentum continued into 2026 following a strategic commercial realignment executed in January 2026. Clinical throughput reached approximately 52,800 cases in Q1 2026 (including 43,600 MI Profile and 9,200 Caris Assure cases) and expanded to a record 59,200 clinical cases in Q2 2026 (including 48,300 MI Profile and 10,700 Caris Assure cases). The Q2 2026 throughput represented 18% year-over-year clinical volume growth and an annualized run-rate exceeding 236,000 clinical cases. Management attributed this volume inflection directly to the aggressive restructuring and expansion of its commercial sales territory structure from 82 territories to 146 territories, expanding the field sales force to over 300 professionals. Concurrently, clinical average selling price (ASP) increased by 30% in Q2 2026 due to improved third-party payer contract execution and expanded reimbursement recognition."
    claimRefs:
      - "CU005"
      - "CU006"
      - "CU007"
      - "CU008"
      - "CU009"
    tableRefs:
      - "TU002"
  - id: "institutional-customer-proof"
    title: "Named Customer Proof and Biopharma Collaborations"
    body: "Proof of clinical and commercial adoption is evidenced across top-tier cancer research networks and major biopharmaceutical partnerships. Within the institutional clinical domain, the Caris Precision Oncology Alliance (POA) functions as a premier collaborative network encompassing leading academic cancer centers and health systems globally, providing direct electronic health record (EHR) integration that allows clinicians to electronically order molecular profiling and review genomic reports within native hospital workflows. In the commercial biopharma segment, Caris established a multi-year research collaboration with Genentech to discover novel therapeutic targets in oncologic indications characterized by high unmet medical need, leveraging Caris's large-scale clinico-genomic database. In early-detection consumer and physician diagnostics, Caris partnered with Everlywell to prepare the commercial distribution and specimen collection logistics for Caris Detect, its forthcoming multi-cancer early detection (MCED) blood assay. Independent market coverage and Wall Street analyst reviews further reflect broad professional visibility, with 15 brokerage firms maintaining coverage on Caris Life Sciences (CAI) with an average brokerage recommendation (ABR) of 1.67, including 10 Strong Buy recommendations."
    claimRefs:
      - "CU010"
      - "CU011"
      - "CU012"
      - "CU013"
    tableRefs:
      - "TU003"
  - id: "retention-and-concentration-risks"
    title: "Retention Durability, Channel Friction, and Concentration Exposures"
    body: "Despite robust top-line clinical case growth, Caris exhibits critical structural disclosures and retention risks that warrant rigorous investment scrutiny. Because clinical diagnostics operates on a fee-for-service, per-specimen ordering model rather than software-as-a-service subscriptions, Caris does not disclose standard software retention metrics such as Net Revenue Retention (NRR), Gross Revenue Retention (GRR), or physician churn rates. Commercial oncologists face negligible technical switching costs and routinely split or rotate test orders across competing platforms such as Foundation Medicine, Guardant Health, Tempus AI, and NeoGenomics. Furthermore, realized revenues remain highly dependent on third-party reimbursement cycles, coverage determinations, and billing collections. For instance, management warned of potential fulfillment bottlenecks and back orders for Caris Detect due to rapid early demand potentially outpacing the tripling of laboratory capacity, while pursuing a direct self-pay commercial route to bypass sluggish commercial payer coverage. In the biopharma division, revenue dropped sharply from $63.1 million in FY2024 to $45.3 million in FY2025 before rebounding to an estimated $75 million to $85 million guidance range for FY2026, exposing substantial project-based lumpy revenue concentration and renewal volatility."
    claimRefs:
      - "CU014"
      - "CU015"
      - "CU016"
