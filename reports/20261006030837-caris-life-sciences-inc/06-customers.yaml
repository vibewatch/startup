callouts:
  - calloutType: "insight"
    title: "Commercial Restructuring Drives Operating Leverage via Territory Density"
    body: "Caris's decision to expand its sales territory structure from 82 to 146 territories in early 2026 represents a pivotal transition from opportunistic account acquisition to disciplined territory density. Expanding the field team to over 300 personnel contributed directly to sequential volume expansion from 52,800 cases in Q1 to 59,200 cases in Q2, while enabling a 30% increase in clinical average selling price through tighter payer collections and physician education."
    claimRefs:
      - "CU007"
      - "CU008"
      - "CU009"
  - calloutType: "risk"
    title: "Lack of Contractual Retention Visibility in Fee-for-Service Diagnostics"
    body: "Unlike recurring software business models, clinical oncology diagnostic testing is characterized by transactional per-specimen ordering where oncologists face no switching friction. With Caris withholding quantitative account retention, net revenue retention (NRR), and biopharma contract backlog, investors remain exposed to unquantified physician ordering churn and biopharma contract lumpiness."
    claimRefs:
      - "CU014"
      - "CU015"
      - "CU016"
