    title: "Reimbursement Concentration and Denial Vulnerability"
    body: "Over 95% of revenues derive from molecular profiling services dependent on third-party commercial and government reimbursement. Shifting local coverage determinations, PAMA CDLT rate adjustments, or commercial payer prior-authorization frictions could impair realized ASP gains and pressure gross margins."
