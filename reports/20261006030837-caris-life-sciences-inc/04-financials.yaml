    title: "Operating Leverage and Liquidity Cushion"
    body: "Caris demonstrated operational inflection in the first half of 2026, delivering positive free cash flow of $28.9 million and positive Adjusted EBITDA of $81.9 million. Backed by $793.1 million in liquid assets, the company possesses adequate runway to fund commercial launches of Caris Detect and ChromoSeq without near-term dilutive equity requirements."
