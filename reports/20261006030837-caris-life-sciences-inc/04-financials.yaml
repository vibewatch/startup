company:
  name: "Caris Life Sciences, Inc."
chapter:
  number: 4
  title: "Financials"
  summary: "Caris Life Sciences delivered rapid top-line expansion reaching $263.7 million in Q2 2026 revenue with 68% gross margin, driven by clinical molecular profiling volume growth and average selling price expansion. The company achieved positive operating cash flow and Adjusted EBITDA while holding $793.1 million in cash, cash equivalents, and short-term marketable securities, though forward economics remain exposed to payer reimbursement volatility and diagnostic testing denial dynamics."
sections:
  - id: "revenue-streams-and-pricing-mechanics"
    title: "Revenue Streams and Commercial Pricing Dynamics"
    body: "Caris Life Sciences operates a dual-revenue commercial model dominated by clinical molecular profiling services alongside biopharmaceutical research and development partnerships. In the second quarter of 2026, total reported revenue expanded 45% year-over-year to $263.7 million, with molecular profiling services contributing $252.3 million, or 95.7% of total revenue. Clinical therapy selection volume reached approximately 59,200 completed cases in Q2 2026, comprising roughly 48,300 MI Profile comprehensive tissue cases and 10,700 Caris Assure blood-based liquid biopsy cases. Revenue growth is primarily propelled by a combination of clinical volume acceleration and average selling price (ASP) improvements following operational refinements in billing and payer adjudication. Biopharma R&D services contributed $11.5 million in Q2 2026, reflecting periodic project delivery and milestone timing across pharmaceutical target discovery agreements. Commercial pricing relies heavily on Medicare Clinical Diagnostic Laboratory Test (CDLT) rate schedules under PAMA and negotiated commercial payer fee schedules, rather than transparent list pricing, creating structural dependency on third-party coverage determinations."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI004"
      - "CI005"
    tableRefs:
      - "TI001"
      - "TI002"
  - id: "cost-structure-and-margin-progression"
    title: "Cost Structure, Operating Leverage, and Margin Progression"
    body: "Operating economics for Caris have demonstrated substantial gross margin expansion as testing volumes scale across its high-throughput sequencing infrastructure. Consolidated gross margin reached 68% in Q2 2026 ($179.6 million gross profit), expanding from 63% in Q2 2025 and building upon full-year 2025 gross margin of 66%. For the six months ended June 30, 2026, cost of molecular profiling services was $154.2 million against $463.1 million in segment revenue, generating an underlying molecular profiling service gross margin of 66.7%. Cost of services is driven by sequencing consumables, reagents, flow cells, molecular pathologist interpretation, and clinical laboratory technician personnel. Operating expenses totaled $152.7 million in Q2 2026, including $66.5 million in general and administrative overhead, $53.8 million in sales and marketing investments to expand the oncologic field force, and $32.4 million in research and development funding clinical assay validation. For the first half of 2026, research and development expenditures totaled $63.7 million as the organization invested in Caris Detect, Caris ChromoSeq, and Caris MI Clarity platforms."
    claimRefs:
      - "CI006"
      - "CI007"
      - "CI008"
      - "CI009"
      - "CI010"
    figureRefs:
      - "FI001"
  - id: "capital-adequacy-and-liquidity"
    title: "Capital Adequacy, Cash Flow Generation, and Financing Obligations"
    body: "Caris maintained a liquid balance sheet as of June 30, 2026, reporting $690.9 million in cash and cash equivalents alongside $102.2 million in short-term marketable securities, establishing total liquid reserves of $793.1 million. Net cash provided by operating activities reached $28.5 million in Q2 2026 and $61.4 million across the first six months of 2026, transforming the company from historical cash consumption into positive operational cash generation. Free cash flow for Q2 2026 was positive at $6.4 million, after accounting for $22.1 million in capitalized software and property and equipment purchases, including sequencer capacity expansions. Long-term debt obligations totaled $393.0 million net of debt discounts, following the refinancing of its term loan credit facility in the first half of 2026, which incurred a $25.2 million loss on debt extinguishment. In addition, the Board of Directors authorized a common stock repurchase program of up to $100 million, utilizing $21.4 million through June 30, 2026 with $82.1 million remaining authorized, signaling internal capital confidence despite continuous assay commercialization requirements."
    claimRefs:
      - "CI011"
      - "CI012"
      - "CI013"
      - "CI014"
      - "CI015"
    tableRefs:
      - "TI003"
  - id: "financial-verdict-and-diligence-blockers"
    title: "Financial Quality Verdict and Underwriting Gaps"
    body: "Management raised its full-year 2026 revenue guidance to between $1.03 billion and $1.04 billion, representing 27% to 28% annual growth over 2025 revenue of $812.0 million, while reaffirming expected clinical therapy selection volume growth of approximately 20%. Net loss narrowed to $0.6 million in Q2 2026 ($1.1 million for 1H 2026), bringing the enterprise near GAAP operating breakeven while Adjusted EBITDA expanded to $55.7 million in Q2 2026 ($81.9 million for 1H 2026). However, key diligence blockers persist for institutional underwriting. Realized average selling prices, payer denial rates, and per-test costs of goods sold remain undisclosed on an assay-disaggregated basis between solid tumor tissue sequencing and blood-based liquid biopsies. Furthermore, the longevity of recent ASP expansion is tied to commercial payer adjudication stability and PAMA clinical laboratory pricing revisions. In the absence of published multi-year cohort retention rates for ordering community oncologists and formal biopharmaceutical contracted backlog schedules, revenue visibility beyond 2026 remains constrained."
    claimRefs:
      - "CI001"
      - "CI014"
      - "CI015"
      - "CI016"
