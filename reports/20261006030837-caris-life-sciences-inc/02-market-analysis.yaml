  - id: "sizing-lenses-tam-sam-som"
    title: "Market Sizing Lenses: TAM, SAM, and Realized SOM"
    body: |
      Sizing the precision oncology and comprehensive genomic profiling market requires evaluating distinct analytical lenses rather than relying on a single broad projection. At the macro TAM layer, oncology diagnostics and precision medicine sit within an expanding global oncology therapeutics and testing ecosystem. Sizing estimates published by market researchers and financial analysts reflect varied scopes, spanning global next-generation sequencing, specialized comprehensive genomic profiling (CGP), and broad cancer diagnostics. Within the U.S. clinical oncology market, the addressable patient population is anchored by cancer incidence across solid tumors and hematologic malignancies, creating a clinical therapy selection TAM estimated across industry benchmarks between $8 billion and $15 billion annually.

      The serviceable addressable market (SAM) narrows to advanced and metastatic cancer patients whose clinical guidelines recommend broad molecular profiling to select targeted therapies, immunotherapies, or clinical trials. When factoring in Caris's current product suite—spanning tissue-based MI Profile, blood-based Caris Assure, and newly launched Caris ChromoSeq and Caris Detect—the accessible clinical volume encompasses hundreds of thousands of annual diagnostic cases in the United States. Furthermore, the early cancer detection market represents a multi-billion dollar long-term expansion vector, although it remains in nascent commercialization phases subject to asymptomatic screening utility proof.

      The serviceable obtainable market (SOM) represents Caris's realized commercial performance. Supported by its commercial engine, Caris completed approximately 59,200 clinical cases in Q2 2026 alone (up 18% year-over-year and 12% sequentially), consisting of approximately 48,300 MI Profile tissue cases and 10,700 Caris Assure liquid biopsy cases. Following reported revenue of $216.2 million in Q1 2026 and $263.7 million in Q2 2026, Caris increased its full-year 2026 revenue guidance to between $1.03 billion and $1.04 billion (27% to 28% growth over 2025), confirming sustained double-digit volume adoption and establishing a leading market share within the high-complexity multi-omic profiling segment.
