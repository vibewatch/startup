  - id: "buyer-segmentation-economics"
    title: "Buyer Segmentation, Payer Workflows, and Budget Ownership"
    body: |
      Adoption dynamics in precision oncology depend on a complex multi-stakeholder structure where the clinical user, ordering decision-maker, and financial payer represent distinct entities. The primary clinical decision-makers are community oncologists, academic oncologists, and surgical pathologists who evaluate patient pathology and initiate molecular testing orders. However, these ordering clinicians do not bear direct test costs. Instead, reimbursement flows through government healthcare programs (Medicare and Medicare Advantage administered through MACs under MolDX coverage policies) and private commercial health plans. Realized revenue per test depends on coverage determinations, contracted network fee schedules, and medical policy criteria rather than discretionary patient out-of-pocket spend.

      A second key customer group consists of biopharmaceutical and biotechnology developers. These enterprise clients access Caris's vast real-world multi-modal clinico-genomic database—encompassing more than 1,130,000 total molecular profiles, over 845,000 matched clinical outcome profiles, 783,000 whole transcriptomes, and 733,000 whole exomes as of June 30, 2026. Biopharma customers deploy direct corporate R&D budgets to license de-identified molecular records, support target validation, and conduct biomarker-driven clinical trial enrollment. Unlike reimbursement-mediated clinical testing, biopharma agreements represent negotiated enterprise contracts with milestone and delivery structures, providing an incremental commercial engine.

      Hospital health systems, integrated delivery networks (IDNs), and comprehensive cancer centers represent institutional procurement partners. These entities establish standardized electronic health record (EHR) order sets, clinical trial alliances (such as the Caris Precision Oncology Alliance), and pathology routing protocols. Adoption is triggered when comprehensive profiling demonstrates superior therapeutic yield, acceptable laboratory turnaround times, and positive budget impact through avoided ineffective treatments.
