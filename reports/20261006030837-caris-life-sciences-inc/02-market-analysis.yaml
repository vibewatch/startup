    title: "Multi-Omic Profiling as Commercial Growth Catalyst"
    body: "Caris's deliberate strategy to offer whole exome and whole transcriptome sequencing at scale sets it apart from competitors offering targeted sub-panel testing. By delivering over 114,000 WES/WTS tests across 59,200 clinical cases in Q2 2026, the company combines diagnostic depth with positive cash generation ($28.5 million operating cash flow), proving that comprehensive genomic profiling can achieve commercial profitability under favorable reimbursement dynamics."
    claimRefs:
