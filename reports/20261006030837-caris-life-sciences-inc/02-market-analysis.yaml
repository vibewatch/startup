      - "CM007"
      - "CM010"
      - "CM011"
  - calloutType: "risk"
    title: "Reimbursement Concentration and Payer Verification Barriers"
    body: "Despite robust revenue guidance of $1.03B to $1.04B in 2026, Caris remains structurally dependent on third-party healthcare reimbursement. Expanding beyond core therapy selection into multi-cancer early detection (Caris Detect) will require navigating complex clinical utility requirements and securing coverage across conservative payer networks that traditionally demand long-term clinical trial evidence before granting broad reimbursement."
