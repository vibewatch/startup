  - id: FE001
    title: Claudin-1 product architecture
    type: stack
    summary: >-
      Alentis applies one exposed-CLDN1 target thesis across biology, antibody formats, ADC payloads, clinical
      operations, and partner-enabled development.
    data:
      layers:
        - label: Disease biology
          detail: Exposed non-junctional CLDN1 links tumor expression and fibrosis-associated signaling.
          modules:
            - Exposed non-junctional CLDN1
            - CLDN1+ tumor expression
            - Fibrosis-associated signaling
        - label: Molecular formats
          detail: The target is expressed through a fibrosis mAb, oncology ADCs, and preclinical formats.
          modules:
            - Lixudebart mAb
            - ALE.P02 ADC
            - ALE.P03 ADC
            - Preclinical ADC / bispecific formats
        - label: Execution systems
          detail: Clinical translation depends on biomarker operations, PK, CMC, quality, and partner execution.
          modules:
            - Biomarker assay
            - Dose escalation and PK
            - CMC and quality
            - CSL collaboration
        - label: Patient selection
          detail: CLDN1-positive selection is intended to connect target biology to trial eligibility.
          modules:
            - Tumor specimen
            - CLDN1 cutoff
            - Central or site laboratory
        - label: Clinical readouts
          detail: The registered oncology program measures safety, activity, exposure, and immunogenicity.
          modules:
            - Adverse events
            - Response and survival
            - PK and anti-drug antibodies
        - label: Quality controls
          detail: Manufacturing, pharmacovigilance, data integrity, and vendor controls remain diligence items.
          modules:
            - Release analytics
            - Safety database
            - GxP and vendor oversight
    claimRefs:
      - CE001
      - CE002
      - CE005
      - CE006
      - CE007
      - CE010
      - CE013
      - CE014
  - id: FU001
    title: Customer adoption and expansion path
    type: journey-map
    summary: >-
      The public evidence traces a path from clinical-site recruitment to partner-funded development and potential
      commercialization, with commercial conversion still unverified.
    data:
      nodes:
        - id: clinical-need
          label: Clinical need
          title: CLDN1+ disease need
          details: >-
            Patients with selected advanced or metastatic CLDN1+ cancers and rare kidney/liver diseases are the target
            populations.
          touchpoints:
            - Eligibility and unmet-need populations
            - No public payer or willingness-to-pay evidence
        - id: trial-access
          label: Trial access
          title: Recruiting clinical sites
          details: The ALE.P03 record lists a multicountry Phase 1/2 interventional study with named recruiting hospitals.
          touchpoints:
            - Hospital investigators
            - Central CLDN1 analysis and protocol eligibility
        - id: clinical-readout
          label: Clinical readout
          title: Clinical evidence generation
          details: >-
            ALE.P03 has safety, tolerability, pharmacokinetic, pharmacodynamic and preliminary anti-tumor activity
            endpoints; lixudebart has early interim study coverage.
          touchpoints:
            - Dose escalation and response assessment
            - No completed-outcome or retention cohort disclosed
        - id: partner-expansion
          label: Partner expansion
          title: Partner-funded scale-up
          details: >-
            CSL is disclosed as global co-development and co-promotion partner for lixudebart with funding for multiple
            trials.
          touchpoints:
            - Upfront and milestone economics
            - Global development and commercialization capability
        - id: commercial-proof
          label: Commercial proof
          title: Commercial adoption
          details: >-
            Potential future commercialization and profit sharing are disclosed, but marketed-product sales and
            recurring customer metrics are not.
          touchpoints:
            - Payer coverage and prescribing
            - Renewal, repeat use and concentration remain open
        - id: diligence
          label: Diligence
          title: Evidence gaps
          details: >-
            Commercial conversion, retention, payer access and concentration require evidence not present in the
            retained public sources.
          touchpoints:
            - Request cohort and contract data
            - Validate conversion and concentration
    claimRefs:
      - CU005
      - CU009
      - CU013
      - CU014
      - CU015
