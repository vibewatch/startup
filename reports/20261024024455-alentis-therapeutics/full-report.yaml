chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and platform
        blocks:
          - type: paragraph
            body: >
              Alentis presents itself as a clinical-stage biotech focused on Claudin-1 (CLDN1), with two related but
              distinct development franchises: ADCs for CLDN1-positive solid tumors and antibodies for fibrotic disease.
              Its public site describes the mission as treating cancer and reversing fibrosis, while the investment
              profile identifies Basel, Switzerland as headquarters and attributes the company to research at the
              University of Strasbourg and Inserm. The platform is therefore more specific than a generic oncology
              biotech: the same target biology is used for tumor-selective payload delivery and for anti-inflammatory or
              anti-fibrotic signaling. External scientific review supports CLDN proteins as emerging therapeutic
              targets, but also discloses inventor and company relationships that matter when assessing independence.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO010
              - CO013
              - CO014
      - number: '1.2'
        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >
              The disclosed leadership story combines continuity with a material 2025 transition. Mark Pruzanski became
              CEO after Roberto Iacone's tenure from 2020, with Luca Santarelli identified as board chair; the
              appointment notice describes Pruzanski's prior experience at Versanis Bio and Intercept Pharmaceuticals.
              The public site says a board and scientific advisory board support the executive team, but the assigned
              evidence does not enumerate those bodies or publish a complete governance charter. Key-person dependence
              is consequently meaningful: platform continuity is supported by specialist leadership, while the public
              record leaves succession depth, committee responsibilities, and oversight mechanics only partly
              observable. The founding science also remains closely linked to Thomas Baumert's Strasbourg and Inserm
              research, making scientific continuity and IP stewardship important diligence questions.
            claimRefs:
              - CO003
              - CO006
              - CO020
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
              - CO006
              - CO020
      - number: '1.3'
        title: Financing and scale
        blocks:
          - type: paragraph
            body: >
              The strongest public scale signal is financing rather than commercial revenue. Novo Holdings reported an
              oversubscribed $181.4 million Series D in November 2024, led by OrbiMed with Novo Holdings and Jeito
              Capital as co-leads, and stated that proceeds would fund Phase 1/2 work for ALE.P02 and ALE.P03. Fierce
              Biotech separately described the round as $181.4 million and noted a prior $105 million Series C, giving a
              disclosed minimum of $286.4 million across those two rounds; this is not a complete lifetime-raising
              figure. In October 2026, CSL announced a $355 million initial payment and up to $1.2 billion in commercial
              milestones for lixudebart, with 55%/45% profit sharing, but contingent milestones are not cash available.
              No public source in this pool establishes valuation, current cash, burn, runway, revenue, customers, or
              headcount.
            claimRefs:
              - CO010
              - CO011
              - CO013
              - CO014
          - type: table
            tableRef: TO003
            claimRefs:
              - CO003
              - CO008
              - CO010
              - CO011
              - CO013
              - CO015
      - number: '1.4'
        title: Milestones and underwriting gaps
        blocks:
          - type: paragraph
            body: >
              Alentis has crossed several development milestones: founding research at Strasbourg and Inserm; Series C
              and Series D financing; FDA IND clearance and Fast Track designation for ALE.P02; initial clinical
              evidence for lixudebart; the appointment of Mark Pruzanski; and the CSL collaboration. The 2026
              partnership materially changes execution capacity for the fibrosis program because CSL is described as
              funding Phase 2 and Phase 3 development, while Alentis retains the oncology ADC pipeline. However, the
              positive clinical signals remain early and partly company-reported: the available summaries describe 26
              AAV-RPGN patients and 41 advanced-fibrosis patients, and a trade analysis notes that the interim results
              were not peer-reviewed or fully published. The central underwriting gaps are therefore human efficacy
              durability, cash and runway after the financing and partnership, valuation terms, and complete governance
