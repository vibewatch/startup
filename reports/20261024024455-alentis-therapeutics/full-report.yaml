        title: Exhibits
        blocks:
          - type: callout
            title: Underwriting blocker
            body: >-
              Current cash, burn, runway, debt obligations, realized pricing, and recognized revenue are not disclosed
              in the retained public evidence; the $355 million CSL upfront and $1.2 billion milestone ceiling must not
