  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Platform and mechanism
        blocks:
          - type: paragraph
            body: >-
              Alentis frames its product thesis around exposed, non-junctional Claudin-1 (CLDN1), using the same target
              biology across oncology and fibrosis while changing the therapeutic format. The company describes
              antibodies that target exposed CLDN1 to open the stiff extracellular matrix, block disease signaling, and
              selectively kill tumor cells. Peer-reviewed translational work with disclosed Alentis ties supplies a more
              specific mechanism: an antibody against a conformation-dependent epitope of exposed non-junctional CLDN1
              reverted inflammation-induced profibrogenic signaling and cell fate and suppressed hepatic stellate-cell
              myofibroblast differentiation in patient-derived and humanized models. This supports biological
              plausibility, not clinical efficacy. The platform's main technical promise is target coherence; its main
              risk is that tumor expression, epitope accessibility, payload exposure, and therapeutic window must all
              hold in humans.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE005
              - CE006
              - CE007
              - CE010
              - CE014
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE006
              - CE007
              - CE010
              - CE013
              - CE014
      - number: '5.2'
        title: Pipeline and clinical workflow
        blocks:
          - type: paragraph
            body: >-
              The product map has two clinical branches. ALE.P02 is an investigational CLDN1-targeted ADC for advanced
              or metastatic CLDN1-positive squamous cancers, with a tubulin inhibitor linked to an antibody that
              recognizes a unique CLDN1 epitope exposed on cancer cells. ALE.P03 is another CLDN1 ADC entering
              first-in-human development, with the public trial record specifying monotherapy in selected advanced or
              metastatic CLDN1-positive solid tumors and measuring safety, response, survival, pharmacokinetics, and
              immunogenicity. Lixudebart, formerly ALE.F02, is the fibrosis branch: an anti-CLDN1 monoclonal antibody
              being advanced with CSL across AAV-RPGN, FSGS, and PSC. The workflow therefore moves from
              biomarker-defined patient selection to dose escalation, target and exposure measurements, and
              disease-specific efficacy readouts; public sources do not disclose the operational assay vendor, cutoff,
              turnaround, or screen-failure funnel.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE003
              - CE006
              - CE008
              - CE009
              - CE011
      - number: '5.3'
        title: Maturity, deployment, and dependencies
        blocks:
          - type: paragraph
            body: >-
              Maturity is heterogeneous rather than a single platform-wide stage. The 2026 ClinicalTrials.gov record is
              a government registry for ALE.P03 and reports a sponsor of Alentis Therapeutics AG, a last update posted
              on 2026-07-02, and planned phase I/II outcome collection extending up to four years. The 2026 CSL
              collaboration adds a material development and commercialization dependency for lixudebart: CSL is
              described as funding phase 2 and phase 3 work and sharing global profits, while Alentis retains ALE.P02
              and ALE.P03. The older Series C release records that the platform was being set up to engineer ADCs and
              bispecific antibodies, but it does not establish current manufacturing readiness. There is no public
              evidence here for validated commercial manufacturing, release specifications, batch comparability, uptime,
              integration, or customer-support operations; those are diligence dependencies, not absent-by-proof facts.
            claimRefs:
              - CE010
              - CE011
              - CE013
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
              - CE005
              - CE010
              - CE011
              - CE013
              - CE014
              - CE017
      - number: '5.4'
        title: Differentiation, controls, and open risks
        blocks:
          - type: paragraph
            body: >-
              Differentiation rests on a narrow target thesis, licensed foundational research, and a multi-format
              pipeline rather than on a disclosed software or manufacturing moat. The Science Translational Medicine
              paper states that patents covering anti-CLDN1 antibodies and fibrotic disease applications were licensed
              to Alentis, while also disclosing author and employee interests that should temper independence
              assessment. The FDA Fast Track announcement is a regulatory designation, not proof of safety or efficacy,
              and the ClinicalTrials.gov record shows that ALE.P03 is still being evaluated. The product risk stack is
              therefore clinical translation, biomarker selection, ADC payload and linker execution, and partner
              governance. Public materials also do not provide a security, privacy, cybersecurity, or incident-control
              surface; for a regulated biotech this is a documentation gap to close through technical, quality, and
              vendor diligence rather than a claim that controls do not exist.
            claimRefs:
              - CE014
              - CE015
              - CE016
              - CE017
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Coherent target thesis
            body: >-
              The same exposed-CLDN1 biology links a fibrosis antibody and oncology ADCs, and peer-reviewed preclinical
              work with disclosed Alentis ties provides a mechanistic rationale for the fibrosis branch.
            calloutType: strength
            claimRefs:
              - CE001
              - CE002
              - CE003
          - type: callout
            title: Translation and execution remain unproven
            body: >-
              The assigned evidence does not disclose human efficacy results for ALE.P02 or ALE.P03, validated biomarker
              operations, or ADC CMC reproducibility; these are the central technical diligence blockers.
            calloutType: risk
            claimRefs:
              - CE007
              - CE014
              - CE016
              - CE017
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer and user segments
        blocks:
          - type: paragraph
            body: >-
              Alentis serves a clinical ecosystem rather than a conventional software customer base. The immediate users
              are investigators and clinical sites treating adults with selected CLDN1-positive advanced or metastatic
              solid tumors, while the prospective payer and commercial customer is a biopharmaceutical partner capable
              of funding late-stage development and commercialization. The ALE.P03 registry identifies a multicountry,
              multicenter footprint and lists 41 recruiting locations across eight country or region groupings. That
              footprint is evidence of recruitment access and site participation, not evidence of completed deployments,
              product revenue, or patient outcomes. In fibrosis, CSL is the disclosed strategic customer-like
              counterparty: the collaboration covers co-development, co-promotion and global profit sharing. No public
              source in this pool provides a customer count, payer mix, contract value beyond the deal terms, or a
              denominator for commercial concentration.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU009
              - CU010
      - number: '6.2'
        title: Adoption and clinical traction
        blocks:
          - type: paragraph
            body: >-
              The observable adoption trajectory is clinical-stage progression, not recurring commercial usage. The
              ALE.P03 study is listed as recruiting, interventional and Phase 1/Phase 2, with estimated enrollment of
              180 participants and a broad set of named recruiting facilities. The lixudebart evidence describes an
              ongoing Phase 2 RENAL study and a Phase 1b FEGATO study, while the CSL agreement commits funding to
              additional Phase 2 programs and a planned Phase 3 program. These are meaningful signals that investigators
              and a global partner have accepted the development proposition, but they do not establish enrollment
              completion, conversion from screening to dosing, persistence, renewal, or market demand. The small interim
              RENAL and FEGATO samples reported in the available coverage also limit what can be inferred about future
              adoption. The chapter therefore treats clinical participation as an adoption proxy and keeps commercial
              traction unverified.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU011
      - number: '6.3'
        title: Named customer proof table
        blocks:
          - type: paragraph
            body: >-
              Named proof is strongest where the source identifies a counterparty, study sponsor, trial sites, or a
              concrete development role. CSL is a named global collaboration counterparty, and the clinical registry
              names Alentis as sponsor and lists recruiting hospitals. The evidence supports active execution of a
              clinical program and partner willingness to fund it, but not a marketed therapy or a customer reference
              with independently measured outcomes. The Fast Track and IND materials are regulatory and company
              disclosures about investigational assets; they should not be read as approval, sales, or customer
              satisfaction. The available customer-proof set is therefore partial: it demonstrates named participation
              and access to clinical channels while leaving treatment completion, safety outcomes, and post-trial
              adoption open.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
              - CU013
      - number: '6.4'
        title: Durability, expansion, and concentration
        blocks:
          - type: paragraph
            body: >-
              The CSL arrangement creates a potential expansion loop from Alentis discovery and early clinical work into
              partner-funded Phase 2 and Phase 3 development, co-promotion, and global profit sharing. It also reduces
              near-term dependence on self-funded development for the disclosed lixudebart indications. However, the
              same structure creates counterparty concentration: the public record identifies one major strategic
              partner, and no source here discloses the share of future economics represented by CSL, termination
              rights, minimum commitments, or the status of any additional commercial partners. For oncology, a
              recruiting trial is a channel signal but not a retention cohort. NRR, GRR, churn, renewal rates, contract
              length, repeat purchase, payer coverage, and top-account exposure are not publicly established.
              Underwriting should therefore give credit for partner validation and financing support while treating
              durable customer pull and concentration as unresolved.
            claimRefs:
              - CU013
              - CU014
              - CU015
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU005
              - CU009
              - CU013
              - CU014
              - CU015
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Partner-backed clinical expansion
            body: >-
              CSL's disclosed global collaboration, upfront payment and funding commitment provide stronger
              customer-side validation than a logo list, while still stopping short of proof of marketed demand.
            calloutType: strength
            claimRefs:
              - CU003
              - CU013
          - type: callout
            title: Retention and concentration are unmeasured
            body: >-
              The retained evidence does not disclose commercial customer counts, payer coverage, renewal, churn,
              contract duration, or top-counterparty economics; CSL concentration and clinical-to-commercial conversion
              require diligence.
            calloutType: risk
            claimRefs:
              - CU014
              - CU015
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Clinical and regulatory execution
        blocks:
          - type: paragraph
            body: >-
              The central risk is that Alentis must translate a novel CLDN1 mechanism into reproducible benefit across
              multiple diseases and modalities. The company describes ALE.P02 as an investigational ADC for
              CLDN1-positive squamous cancers, while lixudebart is being developed in rare kidney and liver diseases.
              Publicly described lixudebart evidence is early: the RENAL interim analysis covered 26 patients and the
              FEGATO study 41 patients, and the report carrying those figures says the results were not peer-reviewed or
              published in full. The registered ALE.F02 liver-fibrosis study uses dose escalation, placebo,
              pharmacokinetic endpoints, and adverse-event monitoring, so it is useful for characterization but not
              proof of efficacy. ALE.P02 also depends on biomarker selection; NCI explains that biomarker tests can fail
              because tissue is insufficient, no matching therapy exists, or biomarkers differ across tumor cells or
              change over time. Fast Track and IND milestones therefore reduce process friction but do not remove
              clinical or diagnostic risk.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR006
      - number: '7.2'
        title: Operating quality, safety, and dependency exposure
        blocks:
          - type: paragraph
            body: >-
              Operational risk is concentrated in dose selection, CMC reproducibility, clinical recruitment, and
              reliance on external development capacity. FDA Project Optimus states that poorly characterized oncology
              dose and schedule can create more toxicity without additional efficacy, drive dose reductions, cause
              premature discontinuation, and limit later treatment options. That is directly relevant to an ADC entering
              early clinical development, although the FDA page does not assess ALE.P02 specifically. The public
              ClinicalTrials.gov record for ALE.F02 specifies sequential assignment, four staggered cohorts, a safety
              review committee, and continuous IV dosing, making safety review and operational execution important
              dependencies. Alentis says its pipeline spans oncology ADCs and antibodies, but the assigned sources do
              not disclose linker analytics, drug-to-antibody ratio, scale-up reproducibility, site performance, or
              incident history. Those omissions are gaps, not evidence that no issue exists. Trial participation also
              carries time, discomfort, and risk, as NIH explains, which can affect recruitment and retention in rare
              diseases.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
          - type: table
            tableRef: TR002
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
      - number: '7.3'
        title: Capital, partner, and thesis-break risks
        blocks:
          - type: paragraph
            body: >-
              The CSL collaboration improves external validation and may fund later lixudebart development, but it also
              creates counterparty, governance, and milestone-dependence risk. Trade coverage describes a $355 million
              initial payment, up to $1.2 billion in commercial milestones, and a 55% CSL/45% Alentis global profit
              split; the milestone amount is contingent rather than cash available today. CSL is described as funding
              phase 2 and phase 3 trials and leading global commercialization, so delays or strategic reprioritization
              could affect Alentis's path even if the science remains promising. Public company-data pages estimate
              revenue, employees, and funding, but those figures are explicitly estimates and are not audited cash,
              burn, runway, or valuation disclosures. A thesis break would be signaled by inadequate biomarker
              screenability, unacceptable dose-limiting toxicity, failure to reproduce organ-function signals in
              controlled studies, partner non-performance, or financing terms that expose dilution and runway pressure.
              The next diligence step is a current cash plan, CMC package, trial-level data, and signed collaboration
              mechanics.
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR006
              - CR011
              - CR014
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Highest-conviction risk
            body: >-
              The decisive uncertainty is whether small early clinical signals can reproduce in adequately controlled,
              biomarker-screened studies without dose-limiting toxicity.
            calloutType: risk
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR006
          - type: callout
            title: Immediate diligence gate
            body: >-
              Do not underwrite a lower-risk profile until Alentis provides trial-level data, current cash and runway,
              validated CLDN1 assay operating characteristics, and CMC comparability evidence.
            calloutType: recommendation
            claimRefs:
              - CR005
              - CR010
              - CR014
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and investment thesis
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a track/research-more recommendation with medium confidence and high risk. The
              positive thesis is that Alentis financed two oncology ADC programs, obtained FDA Fast Track designation
              for ALE.P02, and secured a strategically significant lixudebart collaboration. The agreement specifies a
              $355 million initial payment, up to $1.2 billion in contingent commercial milestones, and a 55%/45%
              global-profit split in CSL's favor. The anti-thesis is that these transaction terms are not an equity
              valuation, the largest milestone figure is not guaranteed cash, and disclosed clinical evidence remains
              early. Price discipline therefore matters more than headline capital: no buy case is supportable until
              round terms, current capitalization, runway, and cohort-level efficacy and safety evidence are available.
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV007
              - CV008
              - CV009
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV004
              - CV007
              - CV008
              - CV009
              - CV012
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV006
              - CV012
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV006
              - CV007
              - CV008
              - CV012
              - CV015
      - number: '8.2'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Independent financing coverage consistently places the Series D at approximately $181 million in November
              2024 and says the proceeds were intended to launch or advance ALE.P02 and ALE.P03 clinical trials. The
              current partnership changes the financing context because CSL is reported to fund specified Phase 2 and
              Phase 3 programs, but it does not reveal Alentis's current cash, net burn, equity value, ownership sold,
              or liquidation preferences. Public evidence also does not show whether the initial payment has been
              received net of obligations. An investable entry therefore requires the executed financing and
              collaboration documents, a cash bridge through decisive readouts, and ownership modeling across the
              preference stack. Funding raised and potential milestones should not be treated as cash available or as a
              substitute for a priced valuation.
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
              - CV012
              - CV016
      - number: '8.3'
        title: Scenarios and comparable context
        blocks:
          - type: paragraph
            body: >-
              A milestone-adjusted clinical scenario framework is more suitable than a revenue multiple because Alentis
              is a private clinical-stage company without disclosed commercial revenue in the retained evidence. The
              bull case requires reproducible clinical benefit, acceptable safety, and continued program funding; the
              base case assumes partnership-supported development while pivotal proof and oncology readouts remain
              pending; the bear case assumes efficacy, safety, CMC, or financing setbacks. CRISPR Therapeutics had a
              reported $4.77 billion public market capitalization on October 23, 2026, but that observation is only
              directional context: public liquidity, a different modality and maturity, and company-specific clinical
              progress prevent a direct read-through to Alentis. No numeric Alentis valuation range or probability can
              be defended from the assigned public evidence.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV011
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV011
              - CV012
              - CV014
              - CV015
      - number: '8.4'
        title: Exit readiness, diligence asks and thesis breaks
        blocks:
          - type: paragraph
            body: >-
              The CSL transaction creates a credible strategic-validation signal, but exit readiness remains conditional
              rather than demonstrated. The retained sources establish active clinical programs and external funding
              commitments; they do not establish pivotal efficacy, a regulatory filing timetable, a liquid secondary
              market, or terms for an acquisition or public offering. Diligence should prioritize the Series D cap table
              and preferences, current cash and monthly burn, collaboration milestones and termination rights,
              trial-level efficacy and safety, manufacturing readiness, and financing needs through pivotal data.
              Thesis-break triggers are failure to reproduce clinical benefit, a material safety or CMC setback, loss or
              narrowing of CSL support, or financing terms that transfer disproportionate value to new capital. Positive
              movement requires both better evidence and an entry price that preserves target return.
            claimRefs:
              - CV003
              - CV006
              - CV007
              - CV008
              - CV009
              - CV011
              - CV012
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Track until price and proof converge
            body: >-
              The CSL collaboration improves strategic validation and prospective development funding, but the assigned
              evidence does not support a current equity value or a price-insensitive buy.
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV006
              - CV012
              - CV015
              - CV016
          - type: callout
            title: Milestone headline is not guaranteed value
            body: >-
              The $1.2 billion figure is a contingent maximum tied to future commercial milestones; it is not funding
              raised, cash available, recurring revenue, or disclosed equity value.
            calloutType: risk
            claimRefs:
              - CV004
              - CV012
