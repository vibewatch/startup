  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status quo
        blocks:
          - type: paragraph
            body: >-
              The relevant market is not “all oncology” or “all fibrosis.” It is the addressable use of CLDN1-directed
              medicines in selected CLDN1-expressing squamous cancers and in organ-fibrosis or rare immune-mediated
              diseases where exposed claudin-1 is a proposed therapeutic target. Alentis describes ALE.P02 as an ADC for
              advanced or metastatic CLDN1-positive squamous cancers, including lung, head and neck, cervical, and
              esophageal cancers. Lixudebart is being developed for AAV-RPGN, FSGS, PSC, and other fibrotic diseases.
              Current treatment, surveillance, immunosuppression, supportive care, and physician-directed alternatives
              remain the status quo; no source in the pool establishes a reimbursed price or share for Alentis. The
              resulting boundary is indication-specific and biomarker-constrained, not a population-wide pharmaceutical
              market.
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM007
      - number: '2.2'
        title: Evidence-constrained sizing lenses
        blocks:
          - type: paragraph
            body: >-
              Multiple lenses show why a conventional top-down TAM would overstate near-term opportunity. The JCI review
              reports that MASLD affects 30%–40% of the world’s population, but also describes disease heterogeneity,
              diagnostic difficulty, and only one approved MASH drug as of its April 2025 publication. That broad
              fibrosis context is not equivalent to lixudebart’s eligible population. Population statistics provide
              narrower reference points: SEER projects 42,340 new US liver and intrahepatic bile duct cancer cases in
              2026, while the American Cancer Society projects 22,530 new US esophageal cancer cases. Neither figure is
              a CLDN1-positive prevalence estimate or a forecast of Alentis revenue. A constrained opportunity case
              therefore needs biomarker prevalence, eligible-line definitions, treatment duration, price, and payer
              access evidence.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM014
      - number: '2.3'
        title: Buyer, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The immediate adoption path is specialist and evidence-led. Patients are identified through oncology or
              nephrology/hepatology workflows; treating specialists and clinical trial networks are the users; payers
              and health systems ultimately control reimbursement. For lixudebart, CSL’s agreement with Alentis brings
              global development and commercialization capabilities in nephrology, while CSL and Alentis will co-develop
              and co-promote the asset. The agreement also covers parallel development in AAV-RPGN, FSGS, and PSC, which
              broadens the indication portfolio but increases execution and evidence requirements. For ALE.P02, FDA Fast
              Track applies to advanced or metastatic CLDN1-positive squamous cancers irrespective of organ origin;
              biomarker testing and demonstration of benefit remain prerequisites to adoption. No public source here
              supports a customer, payer, or pricing commitment.
            claimRefs:
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM008
              - CM009
              - CM010
              - CM011
      - number: '2.4'
        title: Drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              The strongest market driver is unmet need in severe or progressive disease. CSL states that AAV-RPGN can
              cause rapid kidney-function loss and end-stage renal disease despite potent immunosuppression; the JCI
              review likewise describes fibrosis as the histologic feature of MASH that correlates with clinical
              outcomes. The principal adoption constraints are clinical validation, biomarker selection, safety, and the
              need to establish benefit in separate diseases rather than extrapolating across organs. The partner
              announcement reports interim results from only 26 AAV-RPGN patients and 41 patients with advanced liver
              fibrosis, and the independent trade summary notes that the interim results were not peer-reviewed or
              published in full. The $355 million upfront and up to $1.2 billion in commercial milestones indicate
              partner willingness to fund development, but milestones are contingent and do not establish market size,
              cash available, or realized revenue.
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Underwriting implication
            body: >-
              The market case is strongest as a portfolio of specialty indication opportunities with partner-backed
              development, not as a proven broad fibrosis or oncology TAM. The key diligence unlocks are CLDN1-positive
              prevalence, eligible-line treatment counts, pricing and reimbursement, and controlled clinical outcomes by
              indication.
            calloutType: insight
            claimRefs:
              - CM004
              - CM008
              - CM013
              - CM014
          - type: callout
            title: Sizing risk
            body: >-
              Public disease-burden statistics are denominators for context only. They do not establish biomarker
              positivity, treatment eligibility, commercial uptake, or Alentis share.
            calloutType: risk
            claimRefs:
              - CM005
              - CM006
              - CM007
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and strategic position
        blocks:
          - type: paragraph
            body: >-
              Alentis competes in two overlapping arenas: precision oncology ADCs and anti-fibrotic antibodies. Its
              direct position is unusually narrow because the company describes itself as the “CLDN1 company” and is
              advancing ALE.P02 and ALE.P03 against CLDN1-positive squamous tumors while lixudebart addresses fibrosis.
              The oncology market already has a validated claudin-targeting precedent: a 2026 Nature Reviews Cancer
              review states that “a monoclonal antibody targeting the CLDN18.2 isoform has reached clinical approval,”
              which establishes target-family feasibility but not CLDN1 efficacy. Alentis therefore faces adjacent
              competition from other CLDN-directed modalities, additional competition from ADCs against different
              antigens and payloads, and status-quo competition from standard chemotherapy or approved targeted
              regimens. In fibrosis, CSL is now a development and commercialization partner rather than a direct peer,
              improving distribution power while also making execution dependent on a large pharmaceutical collaborator.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP012
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP003
              - CP006
              - CP012
              - CP015
      - number: '3.2'
        title: Capability, product and evidence comparison
        blocks:
          - type: paragraph
            body: >-
              The differentiator Alentis claims is not merely the CLDN1 antigen but the proposed disease-state
              selectivity: its ADC targets a unique CLDN1 epitope exposed on cancer cells, while the company says
              healthy-tissue CLDN1 is hidden in tight junctions. That mechanism could create a therapeutic-window
              advantage, but it remains a hypothesis until clinical safety, response and biomarker data are disclosed.
              ClinicalTrials.gov shows that the ALE.P02 study is designed to assess safety, pharmacokinetics,
              pharmacodynamics, preliminary anti-tumor activity and a recommended Phase II dose, so the current evidence
              level is still dose-finding rather than comparative efficacy. ALE.P03 uses a different topoisomerase-I
              payload from ALE.P02's tubulin inhibitor, creating internal payload optionality but not yet a proven moat.
              Public sources do not disclose realized pricing, contracting terms, head-to-head response, or validated
              CLDN1 positivity rates; those cells remain unknown rather than favorable by default.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
      - number: '3.3'
        title: Switching costs, channels and moat durability
        blocks:
          - type: paragraph
            body: >-
              Switching costs in oncology will be set by clinical outcomes, biomarker testing workflow, tolerability and
              physician confidence rather than by software-style lock-in. A central laboratory CLDN1 analysis is
              required in the registered ALE.P02 study, making assay validation, tissue access and screening throughput
              potential adoption constraints. Alentis has a meaningful distribution advantage in fibrosis because CSL
              agreed to fund Phase II and Phase III work and to co-develop and co-promote lixudebart, but the deal also
              allocates 55% of global profits to CSL and 45% to Alentis. That arrangement adds commercial reach while
              reducing Alentis's control of downstream economics. The moat is more durable if the company demonstrates
              reproducible CLDN1 selection, differentiated safety and durable responses across tumor types; it is more
              fragile if other claudin targets, alternative ADC payloads, or standard therapies deliver better efficacy.
              Independent reporting described only 26 subjects in RENAL and 41 subjects in FEGATO, while noting that the
              RENAL interim analysis had not been peer reviewed in full. Independent literature also cautions that CLDN1
              biology can be context-dependent across cancers, so target validation should not be generalized from one
              tumor type.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
      - number: '3.4'
        title: Competitive verdict and diligence priorities
        blocks:
          - type: paragraph
            body: >-
              Alentis has a credible strategic wedge but not a demonstrated competitive moat. The positive signals are a
              focused target thesis, two distinct oncology payloads, a registered Phase I/II program, and a CSL
              partnership that can fund and distribute the lead fibrosis asset. The disconfirming evidence is equally
              material: the clinical study is designed to establish safety and preliminary activity, public data remain
              limited, and a review of claudin biology reports conflicting roles for CLDN1 in different cancer contexts.
              Competitor comparisons should therefore be read as evidence of positioning, not proof of superiority. The
              next underwriting milestones are a reproducible CLDN1 assay funnel, peer-reviewed human response and
              safety data for ALE.P02, payload-specific differentiation versus other ADCs, and evidence that CSL can
              translate partnership funding into regulatory and commercial progress.
            claimRefs:
              - CP014
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Focused target thesis
            body: >-
              Alentis has a coherent CLDN1 platform spanning two ADC payloads and fibrosis, which is strategically
              differentiated from single-indication programs.
            calloutType: strength
            claimRefs:
              - CP001
              - CP007
          - type: callout
            title: Clinical moat is unproven
            body: >-
              The public record supports trial design and target rationale, but not comparative human efficacy, assay
              scale, or a validated therapeutic window.
            calloutType: risk
            claimRefs:
              - CP008
              - CP014
              - CP015
          - type: callout
            title: Diligence priority
            body: >-
              Require CLDN1 assay funnel data, peer-reviewed ALE.P02 safety and response data, and complete CSL
              economics before assigning durable competitive advantage.
            calloutType: recommendation
            claimRefs:
              - CP010
              - CP011
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public traction
        blocks:
          - type: paragraph
            body: >-
              Alentis is developing investigational medicines rather than selling an approved product, so public
              evidence supports a pipeline-financing model rather than recurring commercial revenue. The company
              describes a clinical pipeline of anti-Claudin-1 ADCs and antibodies, with ALE.P02 and ALE.P03 in oncology
              and lixudebart in fibrosis; the official pipeline labels the oncology programs as ongoing clinical studies
              and lists additional fibrosis indications as planned. Synapse's organization snapshot similarly places
              lixudebart in Phase 2 and ALE.P02/ALE.P03 in Phase 1/2, but its data are an external database view and
              should not be treated as audited company financials. No retained source supplies revenue, ARR, commercial
              units, customers, realized pricing, or gross margin. The appropriate financial question is therefore
              whether partnered economics and financing proceeds can fund clinical execution through value inflection,
              not whether current operating metrics resemble a software or marketplace company.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI004
              - CI005
              - CI006
              - CI008
      - number: '4.2'
        title: Monetization and partnership economics
        blocks:
          - type: paragraph
            body: >-
              The October 2026 CSL transaction is the clearest public monetization signal: BioPharm International
              reports a $355 million initial payment, up to $1.2 billion in commercial milestones, and a 55% CSL/45%
              Alentis global-profit split for lixudebart. The payment is a collaboration consideration, not recognized
              revenue or cash available for every corporate purpose; the milestones are contingent and the source does
              not establish accounting treatment, timing, or remaining obligations. Alentis's official pipeline says CSL
              will co-develop and co-commercialize lixudebart in rare kidney and liver diseases while Alentis retains
              its oncology ADC programs. The earlier Series D was $181.4 million and was described as funding Phase I/II
              development and general corporate purposes. Together these transactions create a plausible capital and
              partnering route, but they do not establish realized product economics or a forecast of net cash.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI002
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI013
      - number: '4.3'
        title: Cost structure and capital adequacy
        blocks:
          - type: paragraph
            body: >-
              Public evidence indicates a capital-intensive clinical operating model: the 2024 financing was earmarked
              for Phase I/II trials of ALE.P02 and ALE.P03 plus pipeline development, while the CSL report says CSL will
              fund specified lixudebart Phase 2, Phase 3, FSGS, and PSC trials. The official pipeline still shows
              multiple clinical and planned programs, so trial execution, CMC, regulatory, personnel, and overhead costs
              remain central drivers even where amounts are undisclosed. The Series D article says proceeds also covered
              general corporate purposes, but neither it nor the CSL coverage discloses current cash, quarterly burn,
              runway, debt, working-capital needs, or capex. BioPharm International reports interim RENAL data from 26
              patients and FEGATO data from 41 patients; those enrollment figures show development activity, not a cost
              forecast or efficacy proof. Financial underwriting should therefore model program-by-program cash needs
              and partnership cost-sharing rather than infer runway from headline financing.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
          - type: table
            tableRef: TI003
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI015
              - CI016
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              Alentis has strengthened capital access through a large Series D and a major partnered asset, but the
              public record remains insufficient for a conventional revenue, margin, or cash-runway underwriting. The
              CSL upfront is economically meaningful, yet its contingent milestone structure and profit-sharing terms
              leave timing, net proceeds, and development obligations uncertain. Clinical-stage execution also exposes
              the company to trial duration, enrollment, regulatory, and manufacturing cost overruns. An independent JCI
              review further cautions that disease heterogeneity can cause therapies to work differently across patient
              groups, reinforcing that clinical success cannot be inferred from disease burden or early-stage activity.
              The financial verdict is therefore capital-supported but disclosure-constrained: partnership validation
              lowers near-term financing pressure for lixudebart, while the oncology portfolio and corporate platform
              still require private budgets, burn data, and milestone-by-milestone forecasts before valuation can be
              assessed with confidence.
            claimRefs:
              - CI013
              - CI014
              - CI015
              - CI016
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI009
              - CI013
              - CI014
