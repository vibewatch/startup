  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: disclosure-gaps
      missingEvidence: Current cash balance, burn rate, runway, revenue, customer count, headcount, valuation, and Series D pricing terms.
      whyItMatters: Financing size and contingent partnership economics do not show how long Alentis can operate or what price investors paid.
      diligencePath: Request the latest management accounts, capitalization table, financing documents, cash forecast, and operating plan under NDA.
      relatedQuestionRefs: [QO006, QO010]
      relatedTableRefs: [TO001, TO003]
    - type: enumeration-incomplete
      severity: material
      topic: governance-gap
      missingEvidence: Complete current executive, board, and scientific advisory board roster with committee responsibilities.
      whyItMatters: The platform depends on specialist leadership and investor oversight, but the public record cannot test succession depth or governance coverage.
      diligencePath: Obtain the current board pack, organization chart, committee charter, and key-person continuity plan.
      relatedQuestionRefs: [QO004, QO010]
      relatedTableRefs: [TO002]
    - type: stale
      severity: material
      topic: clinical-data
      missingEvidence: Full peer-reviewed or sponsor-released datasets for lixudebart and human efficacy, safety, and dose data for the oncology ADCs.
      whyItMatters: Early patient counts and preliminary organ-function signals are not sufficient to establish durability, benefit-risk, or probability of technical and regulatory success.
      diligencePath: Request clinical study reports, data-cut tables, protocol endpoints, and the next planned readout package.
      relatedQuestionRefs: [QO008, QO010]
      relatedTableRefs: [TO001]
    - type: missing-source
      severity: material
      topic: milestones
      missingEvidence: Publicly dated evidence for founding, Series C, complete financing history, and each named leadership or board appointment.
      whyItMatters: The timeline is directionally supported but cannot be treated as exhaustive from the assigned pool alone.
      diligencePath: Obtain archived company releases, financing notices, and corporate registry or investor materials covering the full history.
      relatedQuestionRefs: [QO007]
      relatedTableRefs: [TO003]
