company:
  name: Alentis Therapeutics
chapter:
  number: 7
  title: Risks
  summary: Alentis has meaningful clinical, regulatory, biomarker, manufacturing, financing, and partner-execution risks despite visible development and collaboration progress. The public record supports a high-risk, research-more posture because human datasets remain small, several critical operating metrics are undisclosed, and the largest development commitments are contingent.
sections:
  - id: clinical-and-regulatory
    title: Clinical and regulatory execution
    body: >-
      The central risk is that Alentis must translate a novel CLDN1 mechanism into
      reproducible benefit across multiple diseases and modalities. The company
      describes ALE.P02 as an investigational ADC for CLDN1-positive squamous
      cancers, while lixudebart is being developed in rare kidney and liver
      diseases. Publicly described lixudebart evidence is early: the RENAL
      interim analysis covered 26 patients and the FEGATO study 41 patients, and
      the report carrying those figures says the results were not peer-reviewed
      or published in full. The registered ALE.F02 liver-fibrosis study uses
      dose escalation, placebo, pharmacokinetic endpoints, and adverse-event
      monitoring, so it is useful for characterization but not proof of efficacy.
      ALE.P02 also depends on biomarker selection; NCI explains that biomarker
      tests can fail because tissue is insufficient, no matching therapy exists,
      or biomarkers differ across tumor cells or change over time. Fast Track and
      IND milestones therefore reduce process friction but do not remove clinical
      or diagnostic risk.
    claimRefs: [CR001, CR002, CR003, CR004, CR005]
    tableRefs: [TR001]
  - id: operating-quality-and-dependencies
    title: Operating quality, safety, and dependency exposure
    body: >-
      Operational risk is concentrated in dose selection, CMC reproducibility,
      clinical recruitment, and reliance on external development capacity. FDA
      Project Optimus states that poorly characterized oncology dose and schedule
      can create more toxicity without additional efficacy, drive dose
      reductions, cause premature discontinuation, and limit later treatment
      options. That is directly relevant to an ADC entering early clinical
      development, although the FDA page does not assess ALE.P02 specifically.
      The public ClinicalTrials.gov record for ALE.F02 specifies sequential
      assignment, four staggered cohorts, a safety review committee, and
      continuous IV dosing, making safety review and operational execution
      important dependencies. Alentis says its pipeline spans oncology ADCs and
      antibodies, but the assigned sources do not disclose linker analytics,
      drug-to-antibody ratio, scale-up reproducibility, site performance, or
      incident history. Those omissions are gaps, not evidence that no issue
      exists. Trial participation also carries time, discomfort, and risk, as
      NIH explains, which can affect recruitment and retention in rare diseases.
    claimRefs: [CR006, CR007, CR008, CR009, CR010]
    tableRefs: [TR002]
  - id: capital-partner-and-thesis-break
    title: Capital, partner, and thesis-break risks
    body: >-
      The CSL collaboration improves external validation and may fund later
      lixudebart development, but it also creates counterparty, governance, and
      milestone-dependence risk. Trade coverage describes a $355 million initial
      payment, up to $1.2 billion in commercial milestones, and a 55% CSL/45%
      Alentis global profit split; the milestone amount is contingent rather than
      cash available today. CSL is described as funding phase 2 and phase 3
      trials and leading global commercialization, so delays or strategic
      reprioritization could affect Alentis's path even if the science remains
      promising. Public company-data pages estimate revenue, employees, and
      funding, but those figures are explicitly estimates and are not audited
      cash, burn, runway, or valuation disclosures. A thesis break would be
      signaled by inadequate biomarker screenability, unacceptable dose-limiting
      toxicity, failure to reproduce organ-function signals in controlled
      studies, partner non-performance, or financing terms that expose
      dilution and runway pressure. The next diligence step is a current cash
      plan, CMC package, trial-level data, and signed collaboration mechanics.
    claimRefs: [CR011, CR012, CR013, CR014, CR015, CR016]
    tableRefs: [TR003]
    figureRefs: [FR001]
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns: [Risk, Evidence and status, Likelihood, Severity, Mitigation maturity, Residual exposure, Diligence path]
    rows:
      - ["Small and non-peer-reviewed human datasets", "RENAL interim evidence covers 26 patients; FEGATO covers 41; the report says results were not peer-reviewed or fully published.", "high", "critical", "early", "High until controlled and larger datasets are available", "Obtain patient-level baseline balance, endpoint definitions, confidence intervals, and full safety tables."]
      - ["Biomarker selection and assay failure", "ALE.P02 is for CLDN1+ tumors; NCI notes insufficient tissue, absent matched therapy, intratumor heterogeneity, and biomarker change can limit benefit.", "medium", "high", "partial", "High for screen failure and treatment matching", "Audit assay vendor, cutoff, positivity rate, turnaround, screen-failure funnel, and re-biopsy policy."]
      - ["Oncology dose and schedule risk", "FDA Project Optimus warns that poorly characterized dose or schedule can add toxicity without efficacy and cause dose reductions or discontinuation.", "medium", "high", "partial", "Material pending dose-optimization data", "Review randomized dose exploration, exposure-response, dose reductions, and discontinuation rates."]
    enumerationScope:
      coverage: partial
      basis: "Public regulatory and company-adjacent evidence covers the principal disclosed clinical risks, not every legal matter or trial-level event."
    notes: "Rows combine Alentis-related disclosures with independent FDA, NCI, and trade-source context; likelihood and residual exposure are analytical judgments tied to the cited evidence, not company-provided probabilities."
    claimRefs: [CR001, CR002, CR003, CR004, CR006]
  - id: TR002
    title: Operational, quality, and security risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - ["ADC CMC or scale-up variability", "medium", "critical", "undisclosed", "High", "Linker analytics, DAR, release specifications, comparability, and manufacturing capacity are not public."]
      - ["Rare-disease recruitment and retention", "medium", "high", "partial", "Material", "Site-level enrollment, screen failure, discontinuation, and patient burden data are not public."]
      - ["Trial safety-review or dosing execution failure", "medium", "high", "partial", "Material", "ClinicalTrials.gov specifies staggered cohorts and a safety review committee, but no outcome history is shown in the assigned record."]
      - ["Security, privacy, or operational incident", "unknown", "high", "undisclosed", "Unknown", "No assigned source provides a current incident log, security assessment, or privacy-control evidence."]
    notes: "Operational rows preserve unknowns where the assigned pool lacks company-specific incident or CMC disclosures; no absence-of-evidence inference is made."
    claimRefs: [CR007, CR008, CR009, CR010]
  - id: TR003
    title: Partner, dependency, and financial-model risk register
    columns: [Dependency, Counterparty or role, Failure scenario, Severity, Mitigation, Residual exposure, Diligence path]
    rows:
      - ["Lixudebart development and commercialization", "CSL funds later trials and leads global commercialization", "Partner reprioritization or milestone failure slows programs or reduces economics.", "high", "Documented global collaboration with profit share", "Material", "Review termination, governance, funding, decision rights, and milestone definitions."]
      - ["Financing and runway", "Alentis private biotech; public pages provide estimates, not audited cash data", "Burn or dilution exceeds plan before decisive clinical readouts.", "critical", "External financing and collaboration proceeds are possible but current cash is undisclosed", "High", "Obtain latest balance sheet, burn, runway, financing terms, preferences, and downside plan."]
      - ["Clinical biomarker and trial infrastructure", "CROs, sites, and diagnostic workflow", "Insufficient tissue, slow testing, or site underperformance reduces enrollment or interpretability.", "high", "Protocol and biomarker-led development are described", "High", "Request site list, assay validation, turnaround metrics, and screen-failure reconciliation."]
    notes: "The CSL payment and milestone figures are contingent deal economics, not equivalent to cash available; financial estimates from company-data pages are not audited statements."
    claimRefs: [CR011, CR012, CR013, CR014, CR015, CR016]
