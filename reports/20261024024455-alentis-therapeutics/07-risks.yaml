    claimRefs: [CR001, CR003, CR006, CR011, CR014]
callouts:
  - calloutType: risk
    title: Highest-conviction risk
    body: The decisive uncertainty is whether small early clinical signals can reproduce in adequately controlled, biomarker-screened studies without dose-limiting toxicity.
    claimRefs: [CR001, CR003, CR004, CR006]
  - calloutType: recommendation
    title: Immediate diligence gate
    body: Do not underwrite a lower-risk profile until Alentis provides trial-level data, current cash and runway, validated CLDN1 assay operating characteristics, and CMC comparability evidence.
    claimRefs: [CR005, CR010, CR014, CR016]
