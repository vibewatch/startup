      - ["Claudin-family precedent", "Product-specific pricing varies and is not used as a proxy for Alentis", "Approved precedent supplies regulatory and physician familiarity", "Biomarker and label constraints", "Need comparator pricing and outcomes by indication"]
      - ["Standard therapy", "Contract and reimbursement terms vary by regimen", "Existing clinical pathways and coverage", "Established guidelines and physician familiarity", "Need indication-specific cost-effectiveness comparison"]
      - ["Target specificity", "Company describes exposed CLDN1 epitope targeting in cancer cells", "Other literature reports context-dependent CLDN1 roles", "Replicated pathology and biomarker concordance", "Potentially meaningful only if clinical window is demonstrated"]
      - ["Payload optionality", "ALE.P02 and ALE.P03 use different payload classes", "No public head-to-head clinical comparison", "Response and safety by payload", "Optionality is not yet a moat"]
      - ["Clinical execution", "Registered Phase I/II has explicit safety, PK, PD and response endpoints", "Public efficacy remains preliminary or unavailable", "Peer-reviewed readouts and enrollment quality", "Execution risk remains high"]
      - ["Distribution power", "CSL funds and co-promotes lixudebart", "Profit share reduces Alentis control and terms are limited publicly", "Regulatory milestones and launch accountability", "Partner improves reach but creates dependency"]
      - ["Biomarker lock-in", "Central CLDN1 analysis is required in the trial", "Positivity rate, assay vendor and screen failures are not public", "Assay reproducibility and turnaround time", "Operational bottleneck could limit addressable market"]
      - ["Incumbent response", "Claudin-family approval validates buyer awareness", "Other ADCs and approved regimens can compete for the same patients", "Head-to-head or real-world treatment sequencing", "Displacement risk rises if incumbent outcomes are superior"]
    notes: "Public sources do not provide comparable realized prices or net revenue; all unavailable values remain explicitly undisclosed."
    claimRefs: [CP009, CP010, CP011, CP012]
figures:
  - id: FP001
    title: Evidence-backed competitive positioning
    type: quadrant
    summary: Alentis has high target focus and moderate public clinical maturity, while established claudin precedent has stronger maturity and lower single-target concentration.
    data:
      xAxis: "Target focus and differentiation (ordinal 1-5)"
      yAxis: "Clinical maturity and evidence (ordinal 1-5)"
      points:
        - {label: "Alentis ALE.P02", x: 5, y: 2, note: "Focused CLDN1 ADC; registered Phase I/II with efficacy still investigational"}
        - {label: "Alentis ALE.P03", x: 5, y: 1, note: "Focused CLDN1 ADC; public evidence remains early"}
        - {label: "Approved CLDN18.2 antibody class", x: 3, y: 5, note: "Claudin-family precedent with clinical approval"}
        - {label: "Other ADCs", x: 2, y: 3, note: "Alternative antigen and payload competition; program maturity varies"}
        - {label: "Standard therapy", x: 1, y: 5, note: "Established treatment pathways, but not CLDN1-specific"}
        - {label: "Lixudebart + CSL", x: 4, y: 3, note: "Focused fibrosis program with partner-funded development and early clinical evidence"}
    approximationNotes: "Coordinates are ordinal analyst scores grounded in the cited target, trial and partnership evidence; they are not market-share or efficacy measurements."
    claimRefs: [CP002, CP003, CP006, CP012, CP015]
callouts:
  - calloutType: strength
    title: Focused target thesis
    body: "Alentis has a coherent CLDN1 platform spanning two ADC payloads and fibrosis, which is strategically differentiated from single-indication programs."
    claimRefs: [CP001, CP007]
  - calloutType: risk
    title: Clinical moat is unproven
    body: "The public record supports trial design and target rationale, but not comparative human efficacy, assay scale, or a validated therapeutic window."
    claimRefs: [CP008, CP014, CP015]
  - calloutType: recommendation
    title: Diligence priority
    body: "Require CLDN1 assay funnel data, peer-reviewed ALE.P02 safety and response data, and complete CSL economics before assigning durable competitive advantage."
    claimRefs: [CP010, CP011, CP016]
