callouts:
  - calloutType: strength
    title: Coherent target thesis
    body: "The same exposed-CLDN1 biology links a fibrosis antibody and oncology ADCs, and peer-reviewed preclinical work with disclosed Alentis ties provides a mechanistic rationale for the fibrosis branch."
    claimRefs: [CE001, CE002, CE003]
  - calloutType: risk
    title: Translation and execution remain unproven
    body: "The assigned evidence does not disclose human efficacy results for ALE.P02 or ALE.P03, validated biomarker operations, or ADC CMC reproducibility; these are the central technical diligence blockers."
    claimRefs: [CE007, CE014, CE016, CE017]
