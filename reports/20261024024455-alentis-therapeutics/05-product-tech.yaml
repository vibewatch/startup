company:
  name: Alentis Therapeutics
chapter:
  number: 5
  title: Product & Technology
  summary: Alentis is building a focused Claudin-1 platform spanning antibody-drug conjugates for CLDN1-positive solid tumors and monoclonal antibodies for fibrosis. Public evidence is strongest for target biology, candidate-level design, trial registration, and external development partnerships; the decisive gaps remain human efficacy, assay operations, CMC reproducibility, and quality-system detail.
sections:
  - id: platform-and-mechanism
    title: Platform and mechanism
    body: >-
      Alentis frames its product thesis around exposed, non-junctional Claudin-1 (CLDN1), using
      the same target biology across oncology and fibrosis while changing the therapeutic format.
      The company describes antibodies that target exposed CLDN1 to open the stiff extracellular
      matrix, block disease signaling, and selectively kill tumor cells. Peer-reviewed translational
      work with disclosed Alentis ties supplies a more specific mechanism: an antibody against a conformation-dependent
      epitope of exposed non-junctional CLDN1 reverted inflammation-induced profibrogenic signaling
      and cell fate and suppressed hepatic stellate-cell myofibroblast differentiation in
      patient-derived and humanized models. This supports biological plausibility, not clinical
      efficacy. The platform's main technical promise is target coherence; its main risk is that
      tumor expression, epitope accessibility, payload exposure, and therapeutic window must all
      hold in humans.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001]
    figureRefs: [FE001]
  - id: pipeline-and-workflow
    title: Pipeline and clinical workflow
    body: >-
      The product map has two clinical branches. ALE.P02 is an investigational CLDN1-targeted ADC
      for advanced or metastatic CLDN1-positive squamous cancers, with a tubulin inhibitor linked
      to an antibody that recognizes a unique CLDN1 epitope exposed on cancer cells. ALE.P03 is
      another CLDN1 ADC entering first-in-human development, with the public trial record specifying
      monotherapy in selected advanced or metastatic CLDN1-positive solid tumors and measuring
      safety, response, survival, pharmacokinetics, and immunogenicity. Lixudebart, formerly
      ALE.F02, is the fibrosis branch: an anti-CLDN1 monoclonal antibody being advanced with CSL
      across AAV-RPGN, FSGS, and PSC. The workflow therefore moves from biomarker-defined patient
      selection to dose escalation, target and exposure measurements, and disease-specific efficacy
      readouts; public sources do not disclose the operational assay vendor, cutoff, turnaround,
      or screen-failure funnel.
    claimRefs: [CE005, CE006, CE007, CE008, CE009]
    tableRefs: [TE002]
  - id: maturity-and-dependencies
    title: Maturity, deployment, and dependencies
    body: >-
      Maturity is heterogeneous rather than a single platform-wide stage. The 2026 ClinicalTrials.gov
      record is a government registry for ALE.P03 and reports a sponsor of Alentis Therapeutics AG,
      a last update posted on 2026-07-02, and planned phase I/II outcome collection extending up
      to four years. The 2026 CSL collaboration adds a material development and commercialization
      dependency for lixudebart: CSL is described as funding phase 2 and phase 3 work and sharing
      global profits, while Alentis retains ALE.P02 and ALE.P03. The older Series C release records
      that the platform was being set up to engineer ADCs and bispecific antibodies, but it does
      not establish current manufacturing readiness. There is no public evidence here for validated
      commercial manufacturing, release specifications, batch comparability, uptime, integration,
      or customer-support operations; those are diligence dependencies, not absent-by-proof facts.
    claimRefs: [CE010, CE011, CE013]
    tableRefs: [TE003]
  - id: differentiation-and-controls
    title: Differentiation, controls, and open risks
    body: >-
      Differentiation rests on a narrow target thesis, licensed foundational research, and a
      multi-format pipeline rather than on a disclosed software or manufacturing moat. The Science
      Translational Medicine paper states that patents covering anti-CLDN1 antibodies and fibrotic
      disease applications were licensed to Alentis, while also disclosing author and employee
      interests that should temper independence assessment. The FDA Fast Track announcement is a
      regulatory designation, not proof of safety or efficacy, and the ClinicalTrials.gov record
      shows that ALE.P03 is still being evaluated. The product risk stack is therefore clinical
      translation, biomarker selection, ADC payload and linker execution, and partner governance.
      Public materials also do not provide a security, privacy, cybersecurity, or incident-control
      surface; for a regulated biotech this is a documentation gap to close through technical,
      quality, and vendor diligence rather than a claim that controls do not exist.
    claimRefs: [CE014, CE015, CE016, CE017]
    tableRefs: []
