  evidenceGaps:
    - type: missing-source
      severity: material
      topic: fibrosis-sizing
      missingEvidence: CLDN1-positive prevalence, eligible patient counts, treatment duration, and net price by lixudebart indication.
      whyItMatters: Broad fibrosis prevalence cannot be converted into SAM, SOM, or expected revenue without indication and biomarker filters.
      diligencePath: Obtain epidemiology, biomarker-screening, line-of-therapy, payer, and pricing analyses for AAV-RPGN, FSGS, PSC, and other intended indications.
      relatedQuestionRefs: [QM007]
      relatedTableRefs: [TM002]
    - type: private-evidence-only
      severity: material
      topic: commercial-adoption
      missingEvidence: Public payer coverage, reimbursement, pricing, and health-economic evidence.
      whyItMatters: Adoption timing and value capture depend on reimbursement and specialist workflow, not disease burden alone.
      diligencePath: Request CSL/Alentis market-access plans, target product profiles, comparator pricing, and payer research under confidentiality.
      relatedQuestionRefs: [QM004, QM007]
      relatedTableRefs: [TM003]
    - type: conflicting-data
      severity: minor
      topic: clinical-validation
      missingEvidence: Peer-reviewed, controlled, indication-specific efficacy and safety results.
      whyItMatters: Company and partner disclosures are encouraging but small interim datasets do not validate cross-indication demand.
      diligencePath: Review full clinical datasets, statistical analysis plans, biomarker cutoffs, and regulatory interactions as they become available.
      relatedQuestionRefs: [QM006, QM008]
