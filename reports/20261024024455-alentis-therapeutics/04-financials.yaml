company:
  name: Alentis Therapeutics
chapter:
  number: 4
  title: Financials
  summary: Alentis remains a clinical-stage biotech with no public product revenue, but its 2024 Series D and October 2026 CSL collaboration materially extend external financing capacity. The underwriting gap is current cash, burn, runway, realized economics, and the probability-weighted value of contingent milestones.
sections:
  - id: revenue-model-and-traction
    title: Revenue model and public traction
    body: Alentis is developing investigational medicines rather than selling an approved product, so public evidence supports a pipeline-financing model rather than recurring commercial revenue. The company describes a clinical pipeline of anti-Claudin-1 ADCs and antibodies, with ALE.P02 and ALE.P03 in oncology and lixudebart in fibrosis; the official pipeline labels the oncology programs as ongoing clinical studies and lists additional fibrosis indications as planned. Synapse's organization snapshot similarly places lixudebart in Phase 2 and ALE.P02/ALE.P03 in Phase 1/2, but its data are an external database view and should not be treated as audited company financials. No retained source supplies revenue, ARR, commercial units, customers, realized pricing, or gross margin. The appropriate financial question is therefore whether partnered economics and financing proceeds can fund clinical execution through value inflection, not whether current operating metrics resemble a software or marketplace company.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001]
  - id: monetization-and-partnership-economics
    title: Monetization and partnership economics
    body: >-
      The October 2026 CSL transaction is the clearest public monetization signal:
      BioPharm International reports a $355 million initial payment, up to $1.2
      billion in commercial milestones, and a 55% CSL/45% Alentis global-profit
      split for lixudebart. The payment is a collaboration consideration, not
      recognized revenue or cash available for every corporate purpose; the
      milestones are contingent and the source does not establish accounting
      treatment, timing, or remaining obligations. Alentis's official pipeline
      says CSL will co-develop and co-commercialize lixudebart in rare kidney and
      liver diseases while Alentis retains its oncology ADC programs. The earlier
      Series D was $181.4 million and was described as funding Phase I/II
      development and general corporate purposes. Together these transactions
      create a plausible capital and partnering route, but they do not establish
      realized product economics or a forecast of net cash.
    claimRefs: [CI005, CI006, CI007, CI008]
    tableRefs: [TI002]
  - id: cost-structure-and-capital-adequacy
    title: Cost structure and capital adequacy
    body: >-
      Public evidence indicates a capital-intensive clinical operating model: the
      2024 financing was earmarked for Phase I/II trials of ALE.P02 and ALE.P03
      plus pipeline development, while the CSL report says CSL will fund specified
      lixudebart Phase 2, Phase 3, FSGS, and PSC trials. The official pipeline
      still shows multiple clinical and planned programs, so trial execution, CMC,
      regulatory, personnel, and overhead costs remain central drivers even where
      amounts are undisclosed. The Series D article says proceeds also covered
      general corporate purposes, but neither it nor the CSL coverage discloses
      current cash, quarterly burn, runway, debt, working-capital needs, or capex.
      BioPharm International reports interim RENAL data from 26 patients and
      FEGATO data from 41 patients; those enrollment figures show development
      activity, not a cost forecast or efficacy proof. Financial underwriting
      should therefore model program-by-program cash needs and partnership
      cost-sharing rather than infer runway from headline financing.
    claimRefs: [CI009, CI010, CI011, CI012]
    tableRefs: [TI003]
  - id: financial-verdict-and-diligence
    title: Financial verdict and diligence blockers
    body: >-
      Alentis has strengthened capital access through a large Series D and a major
      partnered asset, but the public record remains insufficient for a
      conventional revenue, margin, or cash-runway underwriting. The CSL upfront is
      economically meaningful, yet its contingent milestone structure and
      profit-sharing terms leave timing, net proceeds, and development obligations
      uncertain. Clinical-stage execution also exposes the company to trial
      duration, enrollment, regulatory, and manufacturing cost overruns. An
      independent JCI review further cautions that disease heterogeneity can
      cause therapies to work differently across patient groups, reinforcing
      that clinical success cannot be inferred from disease burden or early-stage
      activity. The financial verdict is therefore capital-supported but
      disclosure-constrained: partnership validation lowers near-term financing
      pressure for lixudebart, while the oncology portfolio and corporate
      platform still require private budgets, burn data, and
      milestone-by-milestone forecasts before valuation can be assessed with
      confidence.
    claimRefs: [CI013, CI014, CI015, CI016]
    figureRefs: [FI001]
callouts:
  - calloutType: risk
    title: Underwriting blocker
    body: Current cash, burn, runway, debt obligations, realized pricing, and recognized revenue are not disclosed in the retained public evidence; the $355 million CSL upfront and $1.2 billion milestone ceiling must not be treated as equivalent to current cash or revenue.
    claimRefs: [CI006, CI016]
  - calloutType: strength
    title: Financing leverage
    body: A $181.4 million Series D and a subsequent CSL collaboration provide stronger external funding and development-partner support than a standalone clinical-stage program, subject to contingent terms and execution.
    claimRefs: [CI005, CI009, CI013]
