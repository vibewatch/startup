      - [Next decision gate, "Price plus clinical proof", "Cap table, runway and cohort-level data are required", "Re-rate only when both evidence and entry terms improve"]
    notes: "Assessments synthesize the retained public evidence; indeterminate valuation does not mean zero value, and transaction payments are not treated as recurring revenue or current cash."
    claimRefs: [CV004, CV007, CV008, CV009, CV012, CV015]
  - id: TV002
    title: Thesis / anti-thesis
    columns: [Lens, Evidence-supported argument, What would strengthen the view, What would weaken the view]
    rows:
      - [Financing, "$181.4M Series D financed oncology clinical development", "Verified cash runway through decisive readouts", "Near-term financing need or punitive preferences"]
      - [Partner validation, "$355M initial payment and CSL-funded specified trials", "Milestone achievement and durable collaboration support", "Termination, narrowed scope or costly retained obligations"]
      - [Clinical optionality, "Fast Track ALE.P02 plus lixudebart and ADC programs", "Reproducible cohort-level efficacy with acceptable safety", "Failed efficacy, safety or CMC milestone"]
      - [Price discipline, "No disclosed equity valuation or preference stack", "Executed term sheet and ownership model at an attractive entry price", "Headline-value extrapolation without price disclosure"]
    notes: "Dollar amounts are reported financing or collaboration terms; milestone maxima are contingent and no row estimates cash available, enterprise value, or investment return."
    claimRefs: [CV001, CV002, CV003, CV004, CV006, CV012, CV016]
  - id: TV003
    title: Bull / base / bear scenarios
    columns: [Scenario, Explicit assumptions, Valuation / return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "Lixudebart generates reproducible clinical benefit; oncology ADCs progress; CSL support continues", "Material re-rating is plausible, but no numeric range is supportable", "Conditional upside; public evidence cannot quantify probability", "Pivotal failure or material safety signal"]
      - [Base, "Partner-funded development advances while pivotal and oncology proof remain pending", "Track until a priced round and risk-adjusted ownership model are available", "Most supportable qualitative case; no numeric probability", "Additional capital required before decisive data"]
      - [Bear, "Efficacy, safety, CMC or execution disappoints and financing tightens", "Down-round, dilution or impaired private value is plausible", "Material downside case; public evidence cannot quantify probability", "Loss of partner support or failed reproducibility"]
      - [Entry discipline, "No public equity price, cap table or preference stack", "Require terms that compensate for binary clinical and liquidity risk", "Mandatory underwriting condition, not a scenario probability", "Missing ownership or runway disclosure"]
    notes: "Scenarios are qualitative because the assigned evidence provides no Alentis equity value, revenue base, cash balance, preference stack, or validated probability-weighted forecast."
    claimRefs: [CV006, CV007, CV008, CV009, CV011, CV012, CV014, CV015]
