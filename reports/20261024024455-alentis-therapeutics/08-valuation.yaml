company:
  name: Alentis Therapeutics
chapter:
  number: 8
  title: Valuation
  summary: Alentis has gained meaningful financing and partner validation, including a $181.4 million Series D and a CSL collaboration with a $355 million initial payment. Public evidence still does not disclose an equity valuation, preference stack, cash runway, or mature clinical dataset, supporting a track/research-more recommendation rather than a price-insensitive investment.
sections:
  - id: recommendation-and-thesis
    title: Recommendation and investment thesis
    body: >-
      The evidence supports a track/research-more recommendation with medium confidence
      and high risk. The positive thesis is that Alentis financed two oncology ADC programs,
      obtained FDA Fast Track designation for ALE.P02, and secured a strategically significant
      lixudebart collaboration. The agreement specifies a $355 million initial payment, up
      to $1.2 billion in contingent commercial milestones, and a 55%/45% global-profit split
      in CSL's favor. The anti-thesis is that these transaction terms are not an equity
      valuation, the largest milestone figure is not guaranteed cash, and disclosed clinical
      evidence remains early. Price discipline therefore matters more than headline capital:
      no buy case is supportable until round terms, current capitalization, runway, and
      cohort-level efficacy and safety evidence are available.
    claimRefs: [CV001, CV003, CV004, CV005, CV007, CV008, CV009, CV015]
    tableRefs: [TV001, TV002]
    figureRefs: [FV001]
  - id: financing-and-entry-discipline
    title: Financing context and entry discipline
    body: >-
      Independent financing coverage consistently places the Series D at approximately
      $181 million in November 2024 and says the proceeds were intended to launch or advance
      ALE.P02 and ALE.P03 clinical trials. The current partnership changes the financing
      context because CSL is reported to fund specified Phase 2 and Phase 3 programs, but
      it does not reveal Alentis's current cash, net burn, equity value, ownership sold, or
      liquidation preferences. Public evidence also does not show whether the initial
      payment has been received net of obligations. An investable entry therefore requires
      the executed financing and collaboration documents, a cash bridge through decisive
      readouts, and ownership modeling across the preference stack. Funding raised and
      potential milestones should not be treated as cash available or as a substitute for
      a priced valuation.
    claimRefs: [CV001, CV002, CV004, CV005, CV006, CV012, CV016]
  - id: scenarios-and-comparables
    title: Scenarios and comparable context
    body: >-
      A milestone-adjusted clinical scenario framework is more suitable than a revenue
      multiple because Alentis is a private clinical-stage company without disclosed
      commercial revenue in the retained evidence. The bull case requires reproducible
      clinical benefit, acceptable safety, and continued program funding; the base case
      assumes partnership-supported development while pivotal proof and oncology readouts
      remain pending; the bear case assumes efficacy, safety, CMC, or financing setbacks.
      CRISPR Therapeutics had a reported $4.77 billion public market capitalization on
      October 23, 2026, but that observation is only directional context: public liquidity,
      a different modality and maturity, and company-specific clinical progress prevent a
      direct read-through to Alentis. No numeric Alentis valuation range or probability can
      be defended from the assigned public evidence.
    claimRefs: [CV006, CV007, CV008, CV009, CV011, CV013, CV014]
    tableRefs: [TV003]
  - id: exit-readiness-and-diligence
    title: Exit readiness, diligence asks and thesis breaks
    body: >-
      The CSL transaction creates a credible strategic-validation signal, but exit readiness
      remains conditional rather than demonstrated. The retained sources establish active
      clinical programs and external funding commitments; they do not establish pivotal
      efficacy, a regulatory filing timetable, a liquid secondary market, or terms for an
      acquisition or public offering. Diligence should prioritize the Series D cap table
      and preferences, current cash and monthly burn, collaboration milestones and
      termination rights, trial-level efficacy and safety, manufacturing readiness, and
      financing needs through pivotal data. Thesis-break triggers are failure to reproduce
      clinical benefit, a material safety or CMC setback, loss or narrowing of CSL support,
      or financing terms that transfer disproportionate value to new capital. Positive
      movement requires both better evidence and an entry price that preserves target return.
    claimRefs: [CV003, CV006, CV007, CV008, CV009, CV011, CV012, CV015, CV016]
