company:
  name: Alentis Therapeutics
chapter:
  number: 6
  title: Customers
  summary: Alentis has public evidence of clinical-site adoption and a major development and commercialization partnership, but its public materials do not disclose commercial customers, revenue concentration, retention, or repeat-purchase metrics. The strongest customer-side signal is CSL's global collaboration and funding commitment; the principal diligence gap is whether clinical participation converts into durable payer or prescriber demand.
sections:
  - id: customer-segments
    title: Customer and user segments
    body: >-
      Alentis serves a clinical ecosystem rather than a conventional software
      customer base. The immediate users are investigators and clinical sites
      treating adults with selected CLDN1-positive advanced or metastatic solid
      tumors, while the prospective payer and commercial customer is a
      biopharmaceutical partner capable of funding late-stage development and
      commercialization. The ALE.P03 registry identifies a multicountry,
      multicenter footprint and lists 41 recruiting locations across eight
      country or region groupings. That footprint is evidence of recruitment
      access and site participation, not evidence of completed
      deployments, product revenue, or patient outcomes. In fibrosis, CSL is
      the disclosed strategic customer-like counterparty: the collaboration
      covers co-development, co-promotion and global profit sharing. No public
      source in this pool provides a customer count, payer mix, contract value
      beyond the deal terms, or a denominator for commercial concentration.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption and clinical traction
    body: >-
      The observable adoption trajectory is clinical-stage progression, not
      recurring commercial usage. The ALE.P03 study is listed as recruiting,
      interventional and Phase 1/Phase 2, with estimated enrollment of 180
      participants and a broad set of named recruiting facilities. The
      lixudebart evidence describes an ongoing Phase 2 RENAL study and a
      Phase 1b FEGATO study, while the CSL agreement commits funding to
      additional Phase 2 programs and a planned Phase 3 program. These are
      meaningful signals that investigators and a global partner have accepted
      the development proposition, but they do not establish enrollment
      completion, conversion from screening to dosing, persistence, renewal,
      or market demand. The small interim RENAL and FEGATO samples reported in
      the available coverage also limit what can be inferred about future
      adoption. The chapter therefore treats clinical participation as an
      adoption proxy and keeps commercial traction unverified.
    claimRefs: [CU005, CU006, CU007, CU008]
    tableRefs: [TU002]
  - id: named-proof
    title: Named customer proof table
    body: >-
      Named proof is strongest where the source identifies a counterparty,
      study sponsor, trial sites, or a concrete development role. CSL is a
      named global collaboration counterparty, and the clinical registry names
      Alentis as sponsor and lists recruiting hospitals. The evidence supports
      active execution of a clinical program and partner willingness to fund
      it, but not a marketed therapy or a customer reference with
      independently measured outcomes. The Fast Track and IND materials are
      regulatory and company disclosures about investigational assets; they
      should not be read as approval, sales, or customer satisfaction. The
      available customer-proof set is therefore partial: it demonstrates
      named participation and access to clinical channels while leaving
      treatment completion, safety outcomes, and post-trial adoption open.
    claimRefs: [CU009, CU010, CU011, CU012]
    tableRefs: [TU003]
  - id: durability-expansion
    title: Durability, expansion, and concentration
    body: >-
      The CSL arrangement creates a potential expansion loop from Alentis
      discovery and early clinical work into partner-funded Phase 2 and Phase
      3 development, co-promotion, and global profit sharing. It also reduces
      near-term dependence on self-funded development for the disclosed
      lixudebart indications. However, the same structure creates counterparty
      concentration: the public record identifies one major strategic partner,
      and no source here discloses the share of future economics represented by
      CSL, termination rights, minimum commitments, or the status of any
      additional commercial partners. For oncology, a recruiting trial is a
      channel signal but not a retention cohort. NRR, GRR, churn, renewal
      rates, contract length, repeat purchase, payer coverage, and top-account
      exposure are not publicly established. Underwriting should therefore
      give credit for partner validation and financing support while treating
      durable customer pull and concentration as unresolved.
    claimRefs: [CU013, CU014, CU015, CU016]
    figureRefs: [FU001]
