figures:
  - id: FU001
    title: Customer adoption and expansion path
    type: journey-map
    summary: The public evidence traces a path from clinical-site recruitment to partner-funded development and potential commercialization, with commercial conversion still unverified.
    data:
      nodes:
        - id: clinical-need
          label: "Clinical need"
          title: CLDN1+ disease need
          details: "Patients with selected advanced or metastatic CLDN1+ cancers and rare kidney/liver diseases are the target populations."
          touchpoints: ["Eligibility and unmet-need populations", "No public payer or willingness-to-pay evidence"]
        - id: trial-access
          label: "Trial access"
          title: Recruiting clinical sites
          details: "The ALE.P03 record lists a multicountry Phase 1/2 interventional study with named recruiting hospitals."
          touchpoints: ["Hospital investigators", "Central CLDN1 analysis and protocol eligibility"]
        - id: clinical-readout
          label: "Clinical readout"
          title: Clinical evidence generation
          details: "ALE.P03 has safety, tolerability, pharmacokinetic, pharmacodynamic and preliminary anti-tumor activity endpoints; lixudebart has early interim study coverage."
          touchpoints: ["Dose escalation and response assessment", "No completed-outcome or retention cohort disclosed"]
        - id: partner-expansion
          label: "Partner expansion"
          title: Partner-funded scale-up
          details: "CSL is disclosed as global co-development and co-promotion partner for lixudebart with funding for multiple trials."
          touchpoints: ["Upfront and milestone economics", "Global development and commercialization capability"]
        - id: commercial-proof
          label: "Commercial proof"
          title: Commercial adoption
          details: "Potential future commercialization and profit sharing are disclosed, but marketed-product sales and recurring customer metrics are not."
          touchpoints: ["Payer coverage and prescribing", "Renewal, repeat use and concentration remain open"]
        - id: diligence
          label: "Diligence"
          title: Evidence gaps
          details: "Commercial conversion, retention, payer access and concentration require evidence not present in the retained public sources."
          touchpoints: ["Request cohort and contract data", "Validate conversion and concentration"]
    claimRefs: [CU005, CU009, CU013, CU014, CU015]
callouts:
  - calloutType: strength
    title: Partner-backed clinical expansion
    body: "CSL's disclosed global collaboration, upfront payment and funding commitment provide stronger customer-side validation than a logo list, while still stopping short of proof of marketed demand."
    claimRefs: [CU003, CU013]
  - calloutType: risk
    title: Retention and concentration are unmeasured
    body: "The retained evidence does not disclose commercial customer counts, payer coverage, renewal, churn, contract duration, or top-counterparty economics; CSL concentration and clinical-to-commercial conversion require diligence."
    claimRefs: [CU014, CU015, CU016]
