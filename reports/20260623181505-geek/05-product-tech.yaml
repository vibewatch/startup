company:
  name: "Geek+"
chapter:
  number: 5
  title: "Product & Technology"
  summary: >-
    Geek+ operates the broadest hardware-plus-software portfolio in warehouse-fulfilment
    robotics, spanning five solution families (Shelf-to-Person, Tote-to-Person, Pallet-to-Person,
    sorting/distribution, and movement/handling) unified by the Hyper+ Core Algorithm Platform,
    the Robot Matrix modular framework, and the Geek+ Brain embodied-intelligence base model launched
    August 2025. The March 2026 RoboShuttle V5 — with 12-metre vertical storage, 48-hour deployment,
    and integrated Robot Arm Picking Station — is the flagship expression of the company's pivot to
    fully unmanned warehousing; RAPS won the 2026 RBR50 Innovation Award. FY2025 R&D spend reached
    RMB 335.1 million, underpinned by 1,867 patents and 408 R&D engineers.
sections:
  - id: product-family-overview
    title: "Solution Families and Product Line Map"
    body: >-
      Geek+ organises its hardware portfolio into five solution families that together cover the
      full intralogistics stack. The Shelf-to-Person (goods-to-person) family — commercialised
      under the PopPick and PopPick Lite brands — moves shelving units to stationary picking
      stations; PopPick supports simultaneous picking from totes and pallets within a single
      footprint, while PopPick Lite integrates conveyor connectivity for inbound and outbound
      workflows in medium-throughput environments. The Tote-to-Person family, centred on the
      RoboShuttle platform, delivers bins from a high-density rack array to ergonomic workstations;
      in March 2026 the company launched RoboShuttle V5, which extends vertical storage capacity
      to 12 metres, enables deployment in as few as 48 hours, and natively integrates the Robot
      Arm Picking Station for fully unmanned picking. The Pallet-to-Person solution is a
      multi-level ASRS for whole-pallet and mixed-SKU B2B and B2C operations, serving retail,
      3PL, FMCG, pharmaceuticals and automotive customers. Sorting and distribution solutions
      handle last-mile cross-docking and parcel sortation. Movement and handling robots — ground
      carriers, towing vehicles and autonomous forklifts — cover internal material transport from
      truck unloading to production-line delivery. Product widths like this are rare among pure-play
      AMR vendors; the company claims to hold the widest single-vendor product range in AMRs
      globally. The product module table enumerates all six major hardware lines with their workflow
      position, maturity and primary industries served, and the product maturity matrix gives a
      capability-strength snapshot across families.
    claimRefs: [CE001, CE002, CE003, CE004, CE005, CE006, CE007, CE008, CE009, CE010]
    tableRefs: [TE001]
    figureRefs: [FE004]

  - id: software-and-ai-platform
    title: "Software Stack, Algorithm Platform and WES Integration"
    body: >-
      The software layer that differentiates Geek+ from hardware-only vendors has three
      interlocking components. The Hyper+ Core Algorithm Platform provides centralised
      real-time scheduling for fleets of more than 5,000 robots, handling path planning,
      congestion resolution, battery management and multi-system task allocation. Because the
      scheduler runs on-premises — not in a public cloud — it also satisfies the data-security
      and network-resilience requirements of regulated industries such as pharmaceuticals. The
      Robot Matrix is a modular general robotics technology platform that accelerates hardware
      R&D by providing reusable mechanical, electrical and software components across product
      lines; the company attributes its ability to maintain breadth across five solution families
      to this shared platform rather than building each product from scratch.
      The Geek+ Software Suite comprises three enterprise-facing layers: the Warehouse Execution
      System (WES) orchestrates picking, moving, sorting and forklift workflows; the RMS (Robot
      Management System) handles fleet health, firmware and diagnostics; and the IOP (Intelligent
      Operations Platform) delivers dashboards, predictive maintenance alerts and operational
      analytics. The suite exposes open APIs and standardised interfaces to integrate with leading
      ERP and WMS platforms including SAP, Oracle, Epicor, Microsoft Dynamics, Infor, Manhattan,
      Blue Yonder and HighJump, reducing deployment barriers for customers already running
      established warehouse management systems. The tech-stack table enumerates each software
      layer with its role, dependencies and diligence asks, and the technology architecture stack
      figure shows the layered relationship from hardware through AI inference.
    claimRefs: [CE011, CE012, CE013, CE014, CE015, CE016, CE026]
    tableRefs: [TE002]
    figureRefs: [FE002]

  - id: embodied-intelligence
    title: "Embodied Intelligence — Geek+ Brain and Robot Arm Picking Station"
    body: >-
      The most material technology advance in the 2025–2026 period is Geek+'s shift from
      mobile-robotics scheduling to embodied intelligence. In August 2025 the company launched
      Geek+ Brain, which it describes as the world's first embodied-intelligence base model
      designed specifically for warehousing scenarios. The model integrates 2D semantic and
      3D geometric perception through a multi-task vision system, uses simulation-enhanced 3D
      prediction to complete occluded scene understanding, and applies reinforcement-learning-based
      grasping strategies to generate optimal pick plans in real time at millisecond latency.
      The primary commercial product built on Geek+ Brain is the Robot Arm Picking Station
      (RAPS). RAPS employs a six-camera Multi-Eyes Vision array and zero-shot learning, meaning
      it can identify and pick most new SKU types without post-training. The company claims 99.99%
      picking accuracy and throughput of up to 700 units per hour, with a model-free plug-and-play
      design that allows deployment within 48 hours. RAPS won the 2026 RBR50 Robotics Innovation
      Award from The Robot Report, a peer-recognised third-party validation. Multiple workflow
      modes — batch picking, order picking, consolidation and batch-to-bulk-container — allow
      operators to tailor the station to specific fulfilment requirements. At LogiMAT 2026 the
      company also unveiled Gino 1, a general-purpose humanoid robot powered by Geek+ Brain that
      performs picking, packing, box handling and inspection tasks. The roadmap table tracks
      embodied-intelligence milestones and upcoming commercial releases. A key diligence question
      remains the degree to which the 99.99% accuracy and 700 UPH figures represent sustained
      production performance across high-variability SKU mixes, as opposed to controlled
      demonstration conditions; independent third-party audit evidence for these metrics is limited.
    claimRefs: [CE017, CE018, CE019, CE020, CE021, CE022, CE035]
    tableRefs: [TE005]
    figureRefs: [FE001]

  - id: deployment-integration-trust
    title: "Deployment, Integration, Trust and Quality Controls"
    body: >-
      Geek+ offers two commercial delivery models: a capital-expenditure system-sale model and
      a Robotics-as-a-Service (RaaS) subscription under which the company retains hardware
      ownership and charges a recurring fee. The interim results (H1 2025) noted that orders
      from subscription-based services exceeded 90% of new order intake, signalling a structural
      shift toward recurring revenue. For greenfield installations the RoboShuttle V5 deploys
      in as few as 48 hours; brownfield integration uses a modular approach that allows RAPS
      configurations to be added incrementally without redesigning an existing footprint. The
      company targets a capex-model ROI of one to two years based on customer deployments across
      apparel, pharmaceuticals, electronics and 3PL. The workflow table maps five representative
      customer jobs to the Geek+ solution and its measured or claimed benefits and limitations.
      On trust and safety, the company holds TÜV certification for robot and workstation safety
      zones, and the trust/compliance table lists the relevant certifications, standards and gaps.
      The software runs in an on-premises model, which the company positions as a data-security
      advantage over cloud-dependent competitors. Integration complexity remains the leading
      barrier to automation adoption according to Interact Analysis research, and operations teams
      frequently cite floor-space re-configuration, WMS connectivity and cutover risk as friction
      points — even for modular AMR solutions like Geek+'s. This is a real constraint the company's
      48-hour deployment claim attempts to address but has not been independently validated at
      scale across heterogeneous legacy WMS environments.
    claimRefs: [CE023, CE024, CE025, CE026, CE028, CE036]
    tableRefs: [TE003, TE004]

  - id: rd-ip-and-technical-moat
    title: "R&D Intensity, IP Portfolio and Technical Moat"
    body: >-
      Geek+ invested RMB 335.1 million in R&D during FY2025, up from RMB 282.0 million in
      FY2024, representing approximately 10.6% of FY2025 revenue. The company employs 408
      dedicated R&D experts, equivalent to 41% of its 1,054 total headcount, and holds
      1,867 patents — a figure it describes as one of the largest patent portfolios in the global
      AMR industry. The investor relations page states the portfolio covers automation performance,
      safety and interoperability, suggesting breadth across hardware and software domains.
      The technical moat rests on three interlocking elements: breadth of hardware families
      (enabling single-vendor end-to-end deployments), the Hyper+ fleet-scheduling depth
      (enabling coordination of fleets that most competitors cannot match in size), and the
      Geek+ Brain embodied-intelligence layer (enabling RAPS to operate without SKU-level
      re-training). The Robot Matrix platform shortens development cycles for new hardware and
      enables the company to maintain five-plus solution families with a headcount of only about
      1,054 employees — a capital efficiency ratio that is notable. The dependency DAG figure
      maps critical technology dependencies, including LIDAR sensor supply chains, edge-AI
      chipsets and WMS partner ecosystems, that represent risk concentration. On the developer
      and practitioner side, Geek+ maintains a public GitHub organisation at github.com/geekplus
      (primarily Python utilities), but the core Hyper+ and Brain codebases are proprietary
      on-premises software with no public repository signal. The AMR sector is experiencing
      commoditisation pressure as multiple Chinese vendors — including Hai Robotics, Hikrobot,
      Quicktron and Standard Robots — converge on similar goods-to-person feature sets,
      which makes the embodied-intelligence differentiation more strategically important
      but also more susceptible to competitive catch-up if the Brain model architecture leaks
      or is replicated. RBR50 recognition for RAPS provides third-party validation of technical
      innovation but does not guarantee sustained competitive distance.
    claimRefs: [CE031, CE032, CE033, CE034, CE038, CE039, CE040]
    figureRefs: [FE003]

