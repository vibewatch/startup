callouts:
  - calloutType: strength
    title: "Broadest hardware portfolio plus proprietary scheduling depth"
    body: >-
      Geek+ is the only vendor with five commercial solution families spanning Shelf-to-Person,
      Tote-to-Person, Pallet-to-Person, sorting and movement, all orchestrated by a single
      proprietary scheduler (Hyper+) capable of coordinating more than 5,000 robots — a fleet
      size that exceeds most AMR deployments. This breadth enables sole-vendor fulfilment deals
      that competitors offering only one or two families cannot match.
    claimRefs: [CE001, CE011, CE028, CE029]
  - calloutType: risk
    title: "Embodied-AI accuracy claims lack independent third-party verification"
    body: >-
      The 99.99% RAPS accuracy and 700 UPH throughput figures are company-stated and supported
      only by the RBR50 peer award and limited customer case evidence. Integration complexity
      is the leading adoption barrier for warehouse automation, and the 48-hour deployment claim
      for RoboShuttle V5 has not been independently validated across heterogeneous legacy WMS
      environments. AMR commoditisation pressure from Chinese competitors converging on similar
      feature sets increases the risk that the Brain moat erodes faster than expected.
    claimRefs: [CE019, CE036, CE037, CE038]
  - calloutType: insight
    title: "Patent portfolio and R&D intensity create legal and knowledge moat"
