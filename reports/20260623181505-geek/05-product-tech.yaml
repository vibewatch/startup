  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: RAPS accuracy third-party validation
      missingEvidence: "Independent third-party audit or industry benchmark report validating Geek+ RAPS 99.99% picking accuracy and 700 UPH throughput across diverse, high-variability production environments."
      whyItMatters: "Arm-picking accuracy in production is the central technical claim supporting the embodied-intelligence strategy; without independent validation, buyers and investors cannot distinguish marketing from operational fact."
      diligencePath: "Request reference site visits or audited operational data from at least two enterprise production deployments; obtain the methodology definition for 'accuracy' (misses, jams, fallbacks to human)."
      relatedQuestionRefs: [QE004, QE014]
      relatedTableRefs: [TE004]
    - type: missing-source
      severity: material
      topic: Hyper+ algorithm architecture
      missingEvidence: "Technical documentation or academic publications explaining the Hyper+ scheduling algorithm architecture — whether it is a centralised solver, distributed multi-agent system or hybrid — and its tested scalability ceiling above 5,000 robots."
      whyItMatters: "Fleet-scheduling depth is a key moat claim; without architecture visibility, it is impossible to assess competitive replicability or failure-mode risk at scale."
      diligencePath: "Search IEEE Transactions on Automation Science and Engineering, ICRA proceedings, and Geek+ patent filings for scheduling algorithm descriptions; contact Geek+ IR for a technical whitepaper."
      relatedQuestionRefs: [QE005]
    - type: missing-source
      severity: material
      topic: hardware supply-chain dependencies
      missingEvidence: "Confirmed identity of key LIDAR sensor, edge AI chip (e.g., NVIDIA Jetson series or custom ASIC) and camera-array suppliers for Geek+ products, and any concentration risk or export-control exposure."
      whyItMatters: "As a China-headquartered hardware manufacturer shipping to 40+ countries, Geek+ faces potential supply-chain disruption from US-China export controls targeting specific semiconductor and sensor components."
      diligencePath: "Review supply-chain disclosures in HKEX filings; cross-reference bill-of-materials with US Commerce BIS entity lists and TSMC/NVIDIA export-control announcements."
      relatedQuestionRefs: [QE026]
    - type: enumeration-incomplete
      severity: minor
      topic: product families sub-variants
      missingEvidence: "A complete list of all regional product sub-variants, model numbers (P-series, M-series, F-series, D-series, G-series) and their specifications, particularly for markets outside Europe and North America."
      whyItMatters: "Product-line breadth is a key differentiation claim; incomplete enumeration may overstate or understate the real competitive offering in specific geographies."
      diligencePath: "Request full product catalogue from Geek+ IR; cross-reference with HKEX listing prospectus product-line disclosures."
      relatedTableRefs: [TE001]
    - type: private-evidence-only
      severity: minor
      topic: RAPS vs competitor arm-picking comparison
      missingEvidence: "Head-to-head technical comparison of Geek+ RAPS against competitor arm-picking systems (e.g., Hai Robotics HAIPICK arm, AutoStore robotic arms) on zero-shot accuracy, deployment time and throughput."
      whyItMatters: "Without a comparative benchmark, the differentiation claim for RAPS rests solely on Geek+'s own marketing; the zero-shot learning claim may be matched by competitors within months."
      diligencePath: "Commission or source an independent benchmark report from Interact Analysis, Gartner or MHI; alternatively, obtain reference customer side-by-side trial data."
      relatedQuestionRefs: [QE010, QE020]
    - type: private-evidence-only
      severity: minor
      topic: on-premises data security certifications
      missingEvidence: "SOC 2 Type II, ISO/IEC 27001, or equivalent third-party data security certification for the Geek+ on-premises software platform."
      whyItMatters: "Enterprise buyers, especially in regulated industries, require documented security certifications; TÜV covers physical safety but not data security."
      diligencePath: "Request certification documentation from Geek+ sales engineering; check for ISO 27001 disclosure in HKEX listing document appendices."
      relatedQuestionRefs: [QE020]
      relatedTableRefs: [TE004]

