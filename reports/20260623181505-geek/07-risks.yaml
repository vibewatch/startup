callouts:
  - calloutType: risk
    title: "Geopolitical and tariff risk is unhedged and escalating"
    body: >-
      With ~75% of revenue overseas and Chinese manufacturing, Geek+ has no contractual
      hedge against US-China tariff escalation. The KPMG 2026 Tariff Survey shows 78% of
      US manufacturers already report higher COGS, and BIS guidance in May 2026 explicitly
      extended license requirements to subsidiaries of China-Group-D5 entities globally.
    claimRefs: [CR004, CR006, CR009, CR034]
  - calloutType: risk
    title: "~590x trailing PE is a single-quarter earnings risk"
    body: >-
      The FY2025 IFRS net loss of RMB 10.4m and non-IFRS profit of RMB 43.8m create a
      razor-thin earnings floor. At ~590x trailing PE, a single earnings disappointment
      could make the multiple undefined, causing a disproportionate share-price correction.
    claimRefs: [CR001, CR002, CR013]
  - calloutType: assumption
    title: "Multiple regulatory risks are forward-looking and cannot be precisely quantified"
    body: >-
      The BIS and CFIUS exposure is a risk vector, not a confirmed event. No evidence
      confirms Geek+ is on the BIS Entity List as of 2026-06-23. The assessment is
      scenario-based, anchored to BIS's published China guidance, not to confirmed
      enforcement actions against Geek+.
    claimRefs: [CR006, CR007, CR033]
