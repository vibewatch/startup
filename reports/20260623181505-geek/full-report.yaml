  - id: TV005
    title: Thesis-Break and Kill Triggers Table
    columns:
      - Trigger
      - Threshold / Event
      - Transmission to Thesis
      - Action Implication
    rows:
      - - Revenue growth deceleration
        - FY2026 reported revenue growth <20% (vs +31.6% FY2025)
        - P/S thesis breaks; consensus downgrades; multiple compression to 3x
        - Exit or reduce on next reporting event
      - - GAAP profitability reversal
        - FY2026H1 IFRS net loss widens to >RMB 100m
        - Profitability inflection thesis fails; adj. profit re-evaluated
        - Exit if accompanied by margin compression
      - - US tariff escalation
        - New US tariff >25% on China-origin robotics hardware effective FY2026
        - Americas order backlog re-tenders; margin compression 3-5pp gross margin
        - Quantify Americas exposure; reduce if >30% of revenue affected
      - - Cornerstone lock-up expiry and block sales
        - Large block sale post lock-up expiry (dates not confirmed)
        - Overhang materialises; daily volume overwhelmed; price dislocation
        - Monitor HKEX block-sale notifications; plan entry after clearing
      - - Competitor market-share gain
        - Symbotic or AutoStore wins ≥3 Geek+ named accounts in one quarter
        - Category moat eroding; scarcity premium evaporates
        - Exit
      - - Balance sheet deterioration
        - Current ratio falls below 1.5x (from 2.4x end-2025)
        - Working capital stress; capex constraints; R&D cut risk
        - Immediate review; exit if below 1.2x
    notes: >-
      Triggers are qualitative monitorable events tied to public disclosure cadence (HKEX interim results, HKEX
      disclosure of interests); thresholds are author judgment, not company guidance.
