  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model, Segment Mix and Geographic Split
        blocks:
          - type: paragraph
            body: >-
              Geek+ generates substantially all revenue from the sale of robotics solutions — integrated hardware and
              software systems designed, delivered and commissioned for warehouse fulfilment and, to a diminishing
              degree, industrial material transport. In FY2025, warehouse-fulfilment revenue reached RMB 3,020.7 million
              (95.3% of total), while industrial material transport contributed RMB 147.9 million (4.6%), and a small
              "others" category (leasing, RaaS, services) accounted for the residual RMB 2.5 million. The sharp rise in
              warehouse-fulfilment share from 90.3% in FY2024 to 95.3% in FY2025 reflects both higher customer demand
              for goods-to-person and tote-to-person solutions and a deliberate phase-down of lower-margin industrial
              transport, whose revenue fell from RMB 226.1m to RMB 147.9m. Revenue is recognised at a point in time upon
              customer acceptance of the delivered and commissioned system; this is a hardware-sale model, not
              subscription SaaS, so revenue quality carries execution-delivery risk and seasonal concentration of
              acceptances. FY2025 new signed orders were RMB 4,137 million (+31.7% YoY), of which nearly 80% came from
              outside Chinese Mainland (+40% YoY) and Americas growth exceeded 50%. Subscription-based orders —
              encompassing RaaS, leasing and software services — grew >90% YoY though from a tiny base. Historically,
              revenue conversion ratios (revenue/order intake) have ranged from 73% to 80%, implying a visible but not
              guaranteed pipeline. Revenue outside Chinese Mainland reached RMB 2,387.1 million (75.3%) at a 46.6% gross
              margin, significantly above the consolidated 35.5%, reflecting greater software content in EMEA/Americas
              projects and the absence of intense local-market price pressure that exists domestically. The pricing
              model is bespoke-system quotation for large integrations; standardised SKU-based pricing is emerging
              (PopPick Lite, FleetSort) to support channel partners, but disclosed list prices are not publicly
              available.
