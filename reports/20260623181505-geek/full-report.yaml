companyProfile:
  summary: >-
    Geek+ (Beijing Geekplus Technology Co., Ltd. / 极智嘉科技) is a Beijing-headquartered warehouse-fulfilment robotics
    company founded in 2015. It sells autonomous mobile robot (AMR) systems spanning goods-to-person picking,
    tote-to-person shuttles, sorting and pallet handling, orchestrated by its Hyper+ algorithm platform and Robot Matrix
    software, and increasingly augmented by AI picking (Robot Arm Picking Station) and the Geek+ Brain
    embodied-intelligence model. The company has shipped more than 72,000 robots to over 40 countries, serves roughly
    950 end customers including 80+ Fortune Global 500 names, and holds the #1 global share of the warehouse-fulfilment
    AMR market. It listed on the Hong Kong Stock Exchange (code 2590) on 9 July 2025 and posted its first adjusted
    (non-IFRS) net profit in FY2025.
