      - number: '6.4'
        title: Retention, Repurchase and Expansion Dynamics
        blocks:
          - type: paragraph
            body: >-
              Geek+ discloses a project-based customer repurchase rate as its primary retention metric rather than an
              annualised NRR or GRR figure standard in SaaS businesses, reflecting the project-delivery nature of the
              AMR deployment model. The FY2025 annual report states approximately 78% overall repurchase rate, and the
              H1 2025 / LogiMAT 2026 announcement states greater than 80%. The CMBI analyst initiation (August 2025)
              citing company data provides more granularity: the 2024 all-customer repurchase rate was 74.6% while the
              key-account repurchase rate was 84.3%, indicating that the most strategically important relationships are
              materially stickier than the tail of the customer base. The YesAsia case is the most quantitatively
              detailed land-and-expand example: the October 2022 Goodman Warehouse deployment (161 AMRs, US$5.9 million)
              achieved payback in 17 months and led directly to a second contract at Mapletree (240 AMRs, May 2025).
              Decathlon's progression from its first Shanghai warehouse in 2018 through additional China sites and then
              three European DCs in 2022 is the most geographically expansive multi-site expansion pattern.
              Subscription-based service orders grew more than 90% YoY in 2025, including recurring maintenance, RaaS
              arrangements and the IOP data intelligence platform, which signals a gradual shift toward recurring
              revenue streams that would eventually allow a more traditional retention metric. The largest single order
              in H1 2025 exceeded RMB 100 million, and multiple such orders were secured in 2025 from emerging markets
              including Latin America and Eastern Europe. The disclosed NRR and GRR figures are absent from public
              reporting; this is a material evidence gap for investors seeking comparability with software or RaaS-first
              peers.
