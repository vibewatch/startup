      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: 590x PE on Thin Earnings — Principal Valuation Risk
            body: >-
              At ~590x trailing PE on near-breakeven IFRS earnings and a 63% decline from the 52-week high, the current
              price demands delivery of sustained 30%+ revenue growth, margin expansion, and GAAP profitability over at
              least two more annual reporting periods before the multiple compresses to a historically reasonable range.
            calloutType: risk
            claimRefs:
              - CV005
              - CV008
              - CV037
          - type: callout
            title: Track — Stretched but Category-Leading
            body: >-
              Geek+ is the genuine revenue leader in warehouse-fulfilment robotics with a credible profitability
              inflection. The Track recommendation reflects an asymmetric risk profile at current prices: substantial
              upside if execution continues, but a 3x P/S bear case (HK$8–13) if growth decelerates or tariffs escalate.
              Re-entry is warranted at or below HK$15 or following confirmation of GAAP breakeven in the FY2026 interim
              report.
            calloutType: recommendation
            claimRefs:
              - CV015
              - CV016
              - CV041
              - CV042
              - CV043
          - type: callout
            title: Valuation Anchored to FY2026E Analyst Consensus and CMBI Initiation
            body: >-
              The base case is derived from analyst consensus revenue of RMB 4.19bn (+32% FY2026E) and the CMBI
              initiation framework of 7.7x FY2026E P/S. Private comparables Exotec and Hai Robotics are excluded for
              lack of public valuation data. All share-price scenarios are illustrative and not investment advice.
            calloutType: assumption
