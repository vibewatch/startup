      - number: '6.3'
        title: Customer Segments, Verticals and Geographic Mix
        blocks:
          - type: paragraph
            body: >-
              Geek+'s customer base spans seven primary verticals: e-commerce (large-SKU, high-volume fulfilment),
              FMCG/grocery (supermarket replenishment and chilled supply chains), apparel and fashion (multi-SKU mixed
              storage including footwear, folded garments, hanging items), 3PL (multi-client, multi-site, shifting
              demand), manufacturing/industrial (intralogistics, WIP, assembly feeding), automotive (parts sequencing,
              kitting, aftermarket distribution) and pharma and healthcare (temperature-controlled and high-accuracy
              dispensing). Per the CMBI analyst initiation report citing China Insights Consultancy (CIC) data, Geek+
              ranks first among global AMR solution providers by revenue in the e-commerce, FMCG and 3PL verticals as of
              2024. Geographically, approximately 75.3% of FY2025 revenue derived from countries and regions outside
              Mainland China (up from 72% in FY2024), with EMEA, the Americas and APAC all showing growth. The Americas
              signed-orders growth of more than 50% YoY in 2025 is the fastest reported regional expansion, driven by US
              customers facing labour shortages, rising e-commerce volumes and cost pressures. EMEA deployments span the
              UK, France, Germany, Italy, Poland, Portugal, the Netherlands and the Nordics, evidenced by named customer
              press releases and trade show showcases at LogiMAT 2026. Asia-Pacific remains significant through both
              legacy China and growing international markets including Japan, South Korea, Singapore and Australia. The
              official apparel industry page confirms that leading retailers including George.com and Bosideng have
              deployed the system for returns management, and STL (UK) is now expanding Geek+ footprint into the German
              textile logistics market. The pharma vertical is evidenced by the Dr. Max Romania deployment (25,000+
              monthly SKUs, 350% efficiency gain) and the Med24 Nordic pharmacy expansion, both cited by robotics.press.
