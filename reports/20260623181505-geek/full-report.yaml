  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Headquarters and Business Model
        blocks:
          - type: paragraph
            body: >-
              Geek+ is the trading brand of Beijing Geekplus Technology Co., Ltd. (北京極智嘉科技股份有限公司), an
              intelligent-logistics robotics company founded in Beijing in 2015 and headquartered there today, with
              regional offices spanning Tokyo, the United States, the United Kingdom, Germany and Singapore. The company
              designs, sells and services autonomous mobile robots (AMRs) for warehouse fulfilment, covering
              goods-to-person picking, tote-to-person shuttles, sorting, and pallet handling, plus a software stack (the
              Hyper+ core algorithm platform and Robot Matrix) and an embodied-intelligence base model branded Geek+
              Brain. Its commercial model blends one-off system sales with subscription and Robotics-as-a-Service (RaaS)
              arrangements, and the business derives the overwhelming majority of revenue from warehouse-fulfilment
              solutions sold to global retailers, third-party logistics providers, apparel brands, grocers and
              manufacturers. On 9 July 2025 Geek+ became the first pure-play AMR warehouse-robotics company to go
              public, listing on the Hong Kong Stock Exchange under stock code 2590, which moved it from a
              venture-backed private firm into a disclosed public company. This chapter establishes the identity,
              leadership, capital base, scale and milestone chronology that later chapters reuse as ground truth.
