      - number: '7.2'
        title: Geopolitical, Trade and Regulatory Risk
        blocks:
          - type: paragraph
            body: >-
              With approximately 75.3% of FY2025 revenue generated outside Mainland China — and the Americas
              representing the fastest-growing region at +50% YoY signed-order growth — Geek+'s financial performance is
              highly sensitive to the state of US-China and broader international trade relations. US Section 301
              tariffs on Chinese goods (maintained and updated by USTR across four product lists) impose direct cost
              headwinds: warehouse-automation hardware assembled and exported from China faces tariffs of up to 25% on
              covered categories, which either erodes Geek+'s margin when absorbed or creates competitive disadvantage
              when passed to customers. The KPMG 2026 Tariff Survey confirms that 78% of US businesses report higher
              cost of goods sold from tariffs, and 82% report declining foreign sales — dynamics directly relevant to
              Western enterprise buyers evaluating Geek+ system costs. Beyond tariffs, the Bureau of Industry and
              Security Export Administration Regulations (EAR) require US entities to obtain BIS licenses before
              exporting advanced computing items to China-headquartered companies or their affiliates, and in May 2026
              BIS extended this guidance explicitly to subsidiaries of China-Group-D5 entities operating outside China.
              CFIUS reviews any US acquisition of, or investment by, Chinese entities in US critical-technology
              companies, and could scrutinise Geek+'s US expansion or any US-based M&A. Separately, the WEF Global Risks
              Report 2026 identifies geoeconomic confrontation and interstate conflict as the top short-term risks
              globally — directly elevating Geek+'s country-of-origin exposure. European customers increasingly apply
              non-price criteria in large procurement decisions, creating reputational friction for China-HQ technology
              vendors. Table TR002 presents the full regulatory / legal risk register with jurisdiction, likelihood,
              severity, mitigation and residual exposure for each regulatory vector.
