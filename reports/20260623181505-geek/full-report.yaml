      - number: '6.2'
        title: Named Customer Deployments and Case Studies
        blocks:
          - type: paragraph
            body: >-
              The most extensively documented deployment is Decathlon, the world's largest sporting-goods retailer.
              Geek+ and Decathlon began collaborating in 2018 in Shanghai, where a first goods-to-person deployment
              tripled labour productivity, increased storage capacity by 40% and delivered ROI in under three years,
              according to an Interact Analysis white paper co-authored with Decathlon and Geek+ and cited in
              mfgrobots.com trade reporting. By early 2022 Geek+ had extended the partnership to Europe, deploying
              hundreds of P-series picking robots and RoboShuttle totes at three European distribution centres — in
              Castelnau (France), Łódź (Poland) and Campania (Italy) — announced in January 2022. Separately, and
              potentially competitively, Exotec announced in March 2026 that it is deploying a seven-site "Skyfleet"
              multi-site automation programme for Decathlon across five European countries (France, UK, Portugal, Italy,
              Germany), indicating that Decathlon is diversifying its European automation partnerships rather than
              consolidating exclusively with Geek+. Nike Japan deployed 200+ Geek+ P-series robots for same-day delivery
              operations, making it one of the company's flagship sports-apparel references. UPS Supply Chain Solutions
              operates Geek+ shelf-to-person robots, as documented with a named photo in The Wire China profile. YesAsia
              Holdings (HKEX: 2209), a Hong Kong e-commerce operator, deployed 161 Geek+ AMRs at the Goodman Warehouse
              in Tsing Yi in October 2022 for US$5.9 million and achieved payback in 17 months, saving approximately
              US$10 million over two years and boosting daily throughput by 150% with 99.99% order accuracy. YesAsia
              contracted a second deployment of 240 AMRs plus 930 intelligent racks at the Mapletree Logistics Hub (May
              2025) — the largest single AMR deployment in Hong Kong's e-commerce sector. The Tmall (Alibaba) deployment
              in Tianjin (approximately 50 robots, ~2016) is confirmed as the company's first commercial customer.
              Additional named accounts confirmed across multiple sources include Walmart, Toyota (plant deployments),
              DHL, Kuehne+Nagel, XPO, H&M, Tommy Hilfiger, Inditex/Zara and Adidas. At LogiMAT 2026 (Stuttgart, March
              2026) Geek+ highlighted its STL partnership expanding into Germany and a Nordic pharmacy expansion (Med24
              Phase 2) as recent production deployments. The Yamada Denki (Japanese electronics retailer) deployment is
              treated as historical or unconfirmed as of the runDate; no 2026 public announcement has been found to
              confirm an active deployment.
