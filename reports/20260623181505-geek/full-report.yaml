  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk Taxonomy and Severity Ranking
        blocks:
          - type: paragraph
            body: >-
              Geek+ operates at the intersection of six distinct risk vectors that individually are material and in
              combination are compounding. This chapter organises those vectors into a unified taxonomy — geopolitical
              and trade, financial and valuation, competitive and operational, and governance and concentration risks —
              and ranks each by likelihood and impact using evidence from the FY2025 annual results, third-party
              regulatory sources, and independent market analysis. The overarching risk rating for this investment is
              HIGH, driven primarily by the geopolitical and valuation exposures. The severity ranking places US-China
              tariff and export-control risk at the highest combined severity (very-high likelihood, critical impact),
              followed by the valuation / PE de-rating risk (very-high likelihood, high impact), and WVR governance risk
              (medium likelihood, high impact). Mitigation maturity is highest for financial risks (balance sheet
              strengthened post-IPO) and lowest for geopolitical risks (no contractual insurance against tariff
              escalation). Table TR001 provides the comprehensive risk-overview snapshot, and the risk heatmap (FR001)
              positions all identified risks on the likelihood-impact grid. Each subsequent section examines a risk
              cluster with source evidence, mitigations, and a monitorable leading indicator.
