  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Solution Families and Product Line Map
        blocks:
          - type: paragraph
            body: >-
              Geek+ organises its hardware portfolio into five solution families that together cover the full
              intralogistics stack. The Shelf-to-Person (goods-to-person) family — commercialised under the PopPick and
              PopPick Lite brands — moves shelving units to stationary picking stations; PopPick supports simultaneous
              picking from totes and pallets within a single footprint, while PopPick Lite integrates conveyor
              connectivity for inbound and outbound workflows in medium-throughput environments. The Tote-to-Person
              family, centred on the RoboShuttle platform, delivers bins from a high-density rack array to ergonomic
              workstations; in March 2026 the company launched RoboShuttle V5, which extends vertical storage capacity
              to 12 metres, enables deployment in as few as 48 hours, and natively integrates the Robot Arm Picking
              Station for fully unmanned picking. The Pallet-to-Person solution is a multi-level ASRS for whole-pallet
              and mixed-SKU B2B and B2C operations, serving retail, 3PL, FMCG, pharmaceuticals and automotive customers.
              Sorting and distribution solutions handle last-mile cross-docking and parcel sortation. Movement and
              handling robots — ground carriers, towing vehicles and autonomous forklifts — cover internal material
              transport from truck unloading to production-line delivery. Product widths like this are rare among
              pure-play AMR vendors; the company claims to hold the widest single-vendor product range in AMRs globally.
              The product module table enumerates all six major hardware lines with their workflow position, maturity
              and primary industries served, and the product maturity matrix gives a capability-strength snapshot across
              families.
