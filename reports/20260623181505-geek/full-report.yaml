      - number: '5.2'
        title: Software Stack, Algorithm Platform and WES Integration
        blocks:
          - type: paragraph
            body: >-
              The software layer that differentiates Geek+ from hardware-only vendors has three interlocking components.
              The Hyper+ Core Algorithm Platform provides centralised real-time scheduling for fleets of more than 5,000
              robots, handling path planning, congestion resolution, battery management and multi-system task
              allocation. Because the scheduler runs on-premises — not in a public cloud — it also satisfies the
              data-security and network-resilience requirements of regulated industries such as pharmaceuticals. The
              Robot Matrix is a modular general robotics technology platform that accelerates hardware R&D by providing
              reusable mechanical, electrical and software components across product lines; the company attributes its
              ability to maintain breadth across five solution families to this shared platform rather than building
              each product from scratch. The Geek+ Software Suite comprises three enterprise-facing layers: the
              Warehouse Execution System (WES) orchestrates picking, moving, sorting and forklift workflows; the RMS
              (Robot Management System) handles fleet health, firmware and diagnostics; and the IOP (Intelligent
              Operations Platform) delivers dashboards, predictive maintenance alerts and operational analytics. The
              suite exposes open APIs and standardised interfaces to integrate with leading ERP and WMS platforms
              including SAP, Oracle, Epicor, Microsoft Dynamics, Infor, Manhattan, Blue Yonder and HighJump, reducing
              deployment barriers for customers already running established warehouse management systems. The tech-stack
              table enumerates each software layer with its role, dependencies and diligence asks, and the technology
              architecture stack figure shows the layered relationship from hardware through AI inference.
