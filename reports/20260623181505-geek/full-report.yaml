              Geek+ was founded by Yong Zheng (郑勇), who remains chairman and chief executive. Zheng is a Tsinghua
              University graduate who worked at ABB and Saint-Gobain in Europe before founding the company in 2015,
              after observing that warehouse automation lagged factory automation. According to The Wire China, citing
              corporate records, Zheng held roughly a 7.3% economic stake through two Tianjin limited partnerships ahead
              of the listing, and the company lists a co-founder leadership bench including a chief technology officer
              and vice-presidents for systems and robot research and development, alongside a chief financial officer.
              The company operates under a weighted-voting-rights (WVR) structure typical of Hong Kong technology
              listings, which concentrates control with the founder and is a recognised governance consideration for
              minority investors. Key-person dependence on the founder is material: the strategic pivot to embodied
              intelligence, the global expansion cadence and investor confidence are all closely tied to Zheng. The
              leadership table enumerates the disclosed executive bench, their functional coverage and the associated
