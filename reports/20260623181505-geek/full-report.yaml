      - number: '2.4'
        title: Growth Drivers and China Policy Tailwind
        blocks:
          - type: paragraph
            body: >-
              Labor shortage is the dominant and persistent demand driver for warehouse automation globally. Interact
              Analysis, Roland Berger and multiple independent analysts describe it as the primary catalyst, becoming
              more acute as demographic trends in developed economies reduce the available warehouse-worker pool.
              E-commerce order volume growth, consumer expectations of next-day and same-day delivery, and rising
              logistics wages collectively make the ROI case for automation self-evident for high-volume operators.

              ROI is demonstrably attractive: Geek+ has a documented 17-month payback period at YesAsia (verified by
              CMBI analysis), with US$10m in savings over two years and 150% throughput increase. More broadly,
              warehouse automation case studies across five real deployments (e-commerce, 3PL, pharma, etc.)
              consistently show positive ROI within projected timelines, though year-1 realisation typically lags vendor
              projections by ~22% due to integration ramp-up.

              China's government policy provides a significant tailwind for Geek+ specifically. The 15th Five-Year Plan
              (2026-2030) designates robotics and embodied intelligence as national strategic priorities, backed by a
              US$140bn state-backed technology investment fund. The International Federation of Robotics confirmed in
              2026 that China has made AI-powered robots the core of its national industrial strategy. CSIS documents
              that China's share of global industrial robot installations rose from about 20% in 2015 to over 50% by
              2025, a trajectory directly relevant to Geek+'s supply-chain cost base and export-support network.

              The Interact Analysis view entering 2026 is that lower interest rates, improving business confidence, and
              easing of the tariff shock that dominated 2025 are unlocking pent-up automation investment. US warehouse
              automation spending in particular is expected to increase in 2026, with stronger revenue growth in 2027 as
              new warehouse construction absorbs the pandemic-era inventory overhang.
            claimRefs:
