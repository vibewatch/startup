      - number: '6.5'
        title: Customer Concentration Risk and Competitive Pressure
        blocks:
          - type: paragraph
            body: >-
              A material customer concentration risk is clearly documented in the CMBI analyst report citing company
              data: in FY2022, FY2023 and FY2024, revenue from the top-five largest customers accounted for 30.8%, 45.3%
              and 42.1% of total revenue respectively, while the single largest customer contributed 9.3%, 15.4% and
              15.5% of total revenue. The high-water mark concentration of 2023 (45.3% from five customers) reflects a
              project-lumpy revenue model where single large contracts can dominate a given year's recognised revenue.
              Geekplus JP — a Japanese company in which Geek+ holds approximately 39.6% equity — operated as a channel
              partner and contributed 7.3% of total FY2024 revenue, making it both a top-five customer and a related
              party whose re-engagement is commercially sensitive. FY2025 concentration data is not yet itemised in
              public filings; the improvement in customer count from ~806 to ~950 and the expansion of the Americas
              pipeline suggests some diversification, but the risk has not been eliminated. Competitive displacement is
              a documented risk: Exotec's March 2026 announcement of a seven-site Skyfleet programme for Decathlon
              covering France, UK, Portugal, Italy and Germany indicates that Decathlon — one of Geek+'s most cited
              reference accounts — is expanding its European automation footprint with a rival supplier rather than
              consolidating exclusively with Geek+. The original Geek+ Decathlon European deployment covered only three
              countries (France, Poland, Italy); Exotec's programme covers five and involves additional inbound and
              outbound automation integration. US-China tariff risk is a further customer-side concern: if US customers
              face procurement friction or supply-chain security certification requirements for Chinese-origin robotics
              hardware, large US orders could be delayed, cancelled or lost to domestic suppliers such as Symbotic or
              Locus Robotics, as flagged by KPMG's 2026 tariff survey showing 44% of US firms investing in automation
              partly to reshore.
