      - number: '4.3'
        title: Balance Sheet, Liquidity, and Capital Adequacy
        blocks:
          - type: paragraph
            body: >-
              The July 2025 HKEX IPO transformed Geek+'s balance sheet from technically insolvent (total equity of −RMB
              6,248.8 million at end-2024, driven by RMB 7.0 billion in redemption liabilities from preference share
              arrangements with pre-IPO investors) to robustly capitalised. At 31 December 2025, total equity stood at
              RMB 3,407.7 million and net current assets were RMB 3,115.8 million. Cash and cash equivalents were RMB
              2,974.8 million and time deposits RMB 180.6 million, together RMB 3,155.4 million (plus restricted cash of
              RMB 137.4m). Total borrowings were RMB 357.9 million — all bank loans denominated in RMB at fixed interest
              rates — down from RMB 413.9m at end-2024. The adjusted current ratio is 2.4x (vs. 0.3x pre-IPO on a
              comparable basis) and the gearing ratio (total liabilities/total assets) fell to 40.4% from 295.0% (or 75%
              excluding redemption liabilities). No assets were pledged and there are no off-balance-sheet arrangements.
              Inventories fell from RMB 1,029.5m to RMB 803.2m, improving working-capital efficiency; trade receivables
              rose from RMB 713.6m to RMB 958.2m, partly reflecting rapid H2 revenue acceleration. Impairment losses on
              receivables increased to RMB 35.4m (from RMB 15.2m) because of growth and seasonal order concentration,
              which merits monitoring. Net cash from investing was −RMB 156.0m (capex and equipment); financing provided
              +RMB 2,437.1m (IPO proceeds dominant). The company states no planned material capital investments beyond
              those disclosed in the IPO prospectus. At the current scale of business, management does not face a
              near-term liquidity crisis: operating cash flow is now positive and the cash pile provides 8+ months of
              total annual revenue as a buffer. However, the R&D acceleration for Gino1 humanoid and Geek+ Brain could
              increase capex if commercialisation timelines lengthen.
