      - number: '4.2'
        title: Income Statement Summary and Profitability Path
        blocks:
          - type: paragraph
            body: >-
              The FY2025 income statement shows the first meaningful inflection in Geek+'s operating economics. Revenue
              of RMB 3,171.0 million and gross profit of RMB 1,125.0 million (+34.4%) produced a 35.5% gross margin, up
              70 basis points from 34.8% in FY2024. Cost of sales was RMB 2,046.0 million, comprising predominantly
              hardware costs (robots, workstations, shelving), with write-downs of inventory of RMB 39.5 million
              (FY2024: RMB 41.5m), signalling normalising inventory quality. Below the gross profit line, opex amounted
              to RMB 1,143.6 million, with the three key components being: R&D (RMB 335.1m, 10.6% of revenue), selling
              and marketing (RMB 538.5m, 17.0%), and administrative (RMB 270.6m, 8.5%). R&D intensity has fallen from
              ~30% of revenue in FY2022 to 10.6% in FY2025 as the portfolio standardises around warehouse solutions;
              CMBI expects this to remain ~10-11% in FY2026E, reflecting the embodied-intelligence R&D investment. The
              operating loss narrowed to RMB 28.8 million (from RMB 127.6m), and the IFRS net loss to RMB 10.4 million
              (from RMB 831.5m, which included RMB 685.8m of non-cash redemption-liability adjustments). Adjusted net
              profit (non-IFRS) of RMB 43.8 million was derived by adding back share-based compensation (RMB 42.1m),
              listing expenses (RMB 33.3m), and removing the redemption-liability benefit (−RMB 21.2m). CMBI projects
              FY2026E revenue of RMB 4,316m (+36%), gross margin of 38%, and adjusted net profit of approximately RMB
              401.6m, implying ~9%+ margin — the first commercially meaningful profit year. StockAnalysis shows
              four-year EBITDA trending from −RMB 797.6m (FY2022) to −RMB 84.6m (FY2024) to −RMB 47.5m (FY2025),
              consistent with the operating leverage narrative but confirming the company has not yet reached
              IFRS-EBITDA breakeven.
