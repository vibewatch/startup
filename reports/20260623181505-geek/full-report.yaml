      - number: '5.4'
        title: Deployment, Integration, Trust and Quality Controls
        blocks:
          - type: paragraph
            body: >-
              Geek+ offers two commercial delivery models: a capital-expenditure system-sale model and a
              Robotics-as-a-Service (RaaS) subscription under which the company retains hardware ownership and charges a
              recurring fee. The interim results (H1 2025) noted that orders from subscription-based services exceeded
              90% of new order intake, signalling a structural shift toward recurring revenue. For greenfield
              installations the RoboShuttle V5 deploys in as few as 48 hours; brownfield integration uses a modular
              approach that allows RAPS configurations to be added incrementally without redesigning an existing
              footprint. The company targets a capex-model ROI of one to two years based on customer deployments across
              apparel, pharmaceuticals, electronics and 3PL. The workflow table maps five representative customer jobs
              to the Geek+ solution and its measured or claimed benefits and limitations. On trust and safety, the
              company holds TÜV certification for robot and workstation safety zones, and the trust/compliance table
              lists the relevant certifications, standards and gaps. The software runs in an on-premises model, which
              the company positions as a data-security advantage over cloud-dependent competitors. Integration
              complexity remains the leading barrier to automation adoption according to Interact Analysis research, and
              operations teams frequently cite floor-space re-configuration, WMS connectivity and cutover risk as
              friction points — even for modular AMR solutions like Geek+'s. This is a real constraint the company's
              48-hour deployment claim attempts to address but has not been independently validated at scale across
              heterogeneous legacy WMS environments.
