      - number: '8.3'
        title: Peer Valuation Context
        blocks:
          - type: paragraph
            body: >-
              The warehouse-robotics and broader automation peer set spans a wide range of valuation multiples,
              reflecting differences in revenue scale, growth rate, profitability profile, revenue mix (pure-play vs.
              conglomerate), and geography of listing. Among the most comparable publicly listed peers, Symbotic
              (SYM.US) carries the highest multiple — approximately 8.6x trailing P/S and $23.2 billion market
              capitalisation as of June 2026 — justified by its U.S. market position and Walmart partnership revenue
              visibility. AutoStore (AUTO.OL) trades at approximately 5.7x trailing P/S at a $3.8 billion market
              capitalisation, with a PE of 33.9x on profitable but modest earnings. Conglomerates KION Group (KGX.DE)
              and Honeywell (HON.US) trade at 0.7x and ~3.2x P/S respectively, but warehouse automation is a sub-segment
              of each and thus suppresses the reported multiple. CMBI's August 2025 initiation note benchmarked Geek+ at
              7.7x 2026E P/S between Symbotic and AutoStore, arguing for a premium to AutoStore on the basis of
              significantly higher growth rates. At the current price of HK$12.50, Geek+ trades at approximately 5.4x
              FY2026E P/S — inside the AutoStore/Symbotic corridor — but the stock has de-rated from an implied ~9x
              FY26E P/S at IPO. The trajectory matters: if FY2026 revenue is delivered at +32% and margins expand as
              forecast, the current 5.4x FY26E P/S is justifiable on a growth-adjusted basis. If revenue misses or
              tariffs compress Americas margins, the stock looks expensive at any multiple above 3x. The peer comps
              table presents the full enumeration with current multiples and relevance notes; the bar chart shows the
              sensitivity of the implied share price to different P/S multiple assumptions.
            claimRefs:
