      - number: '7.5'
        title: Governance, Execution Risk and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              Geek+'s weighted-voting-rights (WVR) structure concentrates governance control in founder and CEO Yong
              Zheng, who held approximately 7.3% of the economic equity pre-IPO but exercises disproportionate voting
              power under HKEX's Chapter 8A WVR framework. This creates a structural misalignment between economic
              ownership and governance control: minority shareholders listed on HKEX hold limited ability to discipline
              management, challenge strategic decisions, or force dividend distributions. Key-person dependence is high:
              the embodied-intelligence strategic pivot, the global expansion cadence, and investor confidence are all
              closely identified with Zheng; the company's relationships with anchor customers including Decathlon,
              Inditex and Toyota are also largely founder-led. The People / Execution Risk Register (TR005) enumerates
              the founder-key-person, execution, and succession risks. Monitoring indicators for thesis-break events
              include: (1) IFRS net profitability failing to materialise by FY2026 results; (2) any BIS Entity-List
              addition or CFIUS enforcement affecting Geek+ entities; (3) anchor-customer (Decathlon or equivalent
              Fortune 500 client) publicly pausing or cancelling orders; (4) share price sustained below HK$10 for 30
              consecutive trading days; (5) founder departure or involuntary WVR dilution; (6) new round of net
              borrowings exceeding RMB 1 billion; or (7) any product-recall or safety incident involving a deployed
              system. Table TR006 formalises these as kill criteria with action implications, and the Risk Transmission
              Map (FR002) shows how each risk vector flows through to revenue, margin and valuation outcomes.
            claimRefs:
