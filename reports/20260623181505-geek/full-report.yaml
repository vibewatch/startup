      - number: '7.4'
        title: Competitive, Operational and Partner Risk
        blocks:
          - type: paragraph
            body: >-
              The warehouse-automation AMR market has become increasingly competitive, with multiple dynamics
              simultaneously compressing Geek+'s pricing power. Amazon Robotics operates an internal fleet of more than
              500,000 robots; as Amazon also offers logistics services to third parties, its internal automation
              capability represents a structural, captive displacement threat for Geek+'s US logistics customers (DHL,
              UPS, XPO). Simultaneously, lower-cost Chinese rivals — Hikrobot (Hikvision subsidiary), Quicktron, and
              Standard Robots — compete aggressively on unit price in Geek+'s core goods-to-person segment.
              Commoditisation risk is material: as the technology matures and hardware becomes more standardised, the
              moat narrows to software and integration quality. Operational risks compound the competitive pressure:
              SupplyChain360 documents integration complexity as a leading barrier in warehouse automation deployments,
              with multi-system ERP and WMS integrations creating project over-run risks and customer churn triggers.
              Geek+'s customer repurchase rate of approximately 78% implies roughly 22% churn annually — manageable but
              consequential given large- ticket order sizes. Supply chain risk is material: Geek+ assembles its robots
              from components predominantly sourced in China, and any interruption to that supply chain (whether from
              export controls on advanced semiconductors, logistics disruption, or component scarcity) would impair
              production timelines. The reshoring trend documented by KPMG — with 26% of US organisations now in formal
              planning or active execution of reshoring — reduces the long-term competitiveness advantage of Chinese
              manufacturing. Tables TR003 and TR004 provide the operational / quality / security and partner /
              dependency risk registers respectively.
            claimRefs:
              - CR018
              - CR019
              - CR028
