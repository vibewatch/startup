      - number: '3.3'
        title: Scale, Funding and Commercial Positioning
        blocks:
          - type: paragraph
            body: >-
              Geek+ raised approximately US$960 million in cumulative pre-IPO funding across roughly twelve rounds from
              investors including Warburg Pincus, GGV Capital, Intel Capital, Vertex Growth and CPE, and subsequently
              raised approximately US$281 million in its July 2025 Hong Kong IPO, totalling approximately US$1.24
              billion of external capital — the largest publicly disclosed figure in the pure-play warehouse-AMR
              category. Exotec raised approximately $335 million in a January 2022 Series D round at above a $2 billion
              valuation. Locus Robotics has raised approximately $413 million in total venture funding but underwent a
              major restructuring in 2024 after failing to close a follow-on raise, indicating capital vulnerability.
              Symbotic (NASDAQ: SYM) is the only publicly-listed peer by revenue scale: FY2025 revenue reached $2.247
              billion (+25.65% year over year) with TTM revenue of $2.52 billion and a $22.7 billion order backlog,
              though its 70 deployed systems primarily serve Walmart and AWG, making it highly customer-concentrated and
              US-centric. Symbotic employs approximately 2,000 people, roughly double Geek+'s 1,054. Quicktron, backed
              by KION Group, Cainiao (Alibaba) and Saudi Aramco, claims 42,000+ AMR installations for 1,000+ clients in
              20+ countries; its total external funding has not been publicly disclosed. Hikrobot, a wholly owned
              Hikvision subsidiary, benefits from Hikvision's manufacturing scale and distribution but has no disclosed
              standalone funding or revenue. Geek+'s Americas order intake grew more than 50% year over year in FY2025,
              the fastest of any disclosed geographic segment, suggesting accelerating competitive success in the
