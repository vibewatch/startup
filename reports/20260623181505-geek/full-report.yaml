  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Scale and Composition
        blocks:
          - type: paragraph
            body: >-
              As of December 31, 2025, Geek+ reported approximately 950 end customers worldwide, up from approximately
              806 in mid-2024 and 800+ disclosed at the July 2025 IPO, reflecting the addition of more than 60 new net
              accounts in the second half of 2025. Of that base, more than 80 are Fortune Global 500 companies,
              confirming the company's penetration at the enterprise tier. The overall customer repurchase rate of
              approximately 78% as of FY2025, and above 80% for H1 2025, reflects a project-based repurchase definition:
              customers that have signed at least one follow-on order. Among key accounts — the company's term for
              top-tier strategic relationships — the repurchase rate was 84.3% in 2024, suggesting stronger stickiness
              in the most commercially significant cohort. Revenue outside Mainland China reached 75.3% of total FY2025
              revenue at a 46.6% gross margin, versus 79.5% in H1 2025, showing that international customers already
              dominate the revenue base. Americas new signed orders grew more than 50% year-on-year in 2025, led by the
              United States, while total new orders reached RMB 4,137 million (+31.7% YoY), with orders from outside
              China accounting for nearly 80% and growing at nearly 40% YoY. Subscription-based service orders grew more
              than 90% YoY in 2025, signalling a gradual mix shift toward recurring revenue from the installed base. The
              company has shipped over 72,000 robots cumulatively to 40+ countries and regions, and its systems have
              collectively fulfilled more than 10 billion orders, according to robotics.press tracking of vendor
              reporting. Geek+ has ranked #1 in global AMR market share for seven consecutive years per Interact
              Analysis, and its Shelf-to-Person sub-segment share reached 48.5% in 2025.
