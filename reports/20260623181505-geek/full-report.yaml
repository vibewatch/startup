      - number: '2.3'
        title: Buyer, User and Payer Segmentation
        blocks:
          - type: paragraph
            body: >-
              Warehouse automation purchases are driven by operations and supply-chain leadership, funded from
              capital-expenditure or, increasingly, operations budgets under Robotics-as-a-Service (RaaS) models. The
              primary payer is the warehouse operator — whether a large e-commerce platform, a branded retailer running
              its own DCs, a third-party logistics (3PL) provider, or a manufacturer with an in-house distribution
              operation. User adoption triggers differ sharply by vertical.

              E-commerce operators represent the most mature and highest-volume buyer segment: companies like Amazon
              have deployed tens of thousands of robots domestically, setting throughput and accuracy benchmarks that
              competitors must match. The e-commerce adoption trigger is peak-season throughput and SKU proliferation
              that manual picking cannot sustain. Third-party logistics providers are the fastest-growing segment in
              2026 because multi-client operations demand flexible, re-deployable automation; RaaS models and short
              implementation cycles (as low as 48 hours for Geek+ RoboShuttle V5) are critical purchase criteria for
              3PLs.

              Retail and apparel buyers (including brands like H&M, Inditex/Zara, Decathlon, and Nike) adopt automation
              driven by omnichannel fulfilment complexity and the need to serve both store replenishment and
              direct-to-consumer orders from the same facility. Grocery buyers are a growing segment with
              high-frequency, time-sensitive picking needs and narrow margins that make labour cost reduction especially
              compelling. Pharma and healthcare operators adopt automation partly for regulatory traceability and
              accuracy requirements beyond pure cost savings. Manufacturing companies with in-house logistics automate
              to integrate factory-to-warehouse flows and reduce internal handling costs.

              Budget ownership sits with the VP Supply Chain or COO in most enterprise buyers; the decision is
              capital-project-approved, meaning sales cycles are 6-18 months for initial deployments. Repeat purchases
              by existing customers occur faster — Geek+'s repurchase rate of approximately 78% and YesAsia's second
              warehouse deployment illustrate the expansion land-and-expand dynamic.
            claimRefs:
