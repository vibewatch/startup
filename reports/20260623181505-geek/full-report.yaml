      - number: '7.3'
        title: Financial, Valuation and Capital Risk
        blocks:
          - type: paragraph
            body: >-
              Geek+ reported an IFRS net loss of RMB 10.4 million in FY2025, a dramatic improvement on the RMB 831.5
              million IFRS loss in FY2024, but the thin margin creates significant earnings risk. Management reports
              non-IFRS adjusted net profit of RMB 43.8 million — primarily a difference attributable to share-based
              compensation and other non-cash charges — but the IFRS headline remains a net loss, creating an
              earnings-quality question that is relevant to the valuation. The current trailing price-to-earnings ratio
              of approximately 590x on thin IFRS earnings is highly compressed and extremely vulnerable: a revenue miss
              of 5-8% or a modest margin step-back would eliminate IFRS earnings entirely and make the PE multiple
              undefined, likely triggering a sharp re-rating. Post-IPO the shares fell from a 52-week high of HK$33.90
              to a 52-week low of HK$11.18 — a decline of approximately 67% — reflecting the market's concern about this
              valuation tension. The IPO cornerstone investors (US$91.3 million total) are subject to lock-up periods,
              and their eventual exit creates a structural selling overhang. On the positive side, the balance sheet was
              significantly strengthened post-IPO: cash and time deposits stood at RMB 3,115.8 million, the current
              ratio improved from 0.3x to 2.4x, and gearing ratio fell from 295% to 40.4%. Operating cash inflow was RMB
              85.7 million in FY2025, demonstrating first sustained cash generation. R&D expenditure at RMB 335.1
              million (approximately 10.6% of revenue) and total borrowings of RMB 357.9 million at year-end reflect
              ongoing capital intensity. The Forbes tech-sector analysis confirms that tariff-driven margin pressure —
              with 32% of technology firms reporting gross margin declines of 1-5% and 22% seeing 6-10% declines —
              creates an additional input-cost headwind for Geek+'s already-thin earnings.
            claimRefs:
