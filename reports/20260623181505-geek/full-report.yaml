  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape
        blocks:
          - type: paragraph
            body: >-
              The global warehouse-automation market in 2026 is contested across four primary technology paradigms:
              free-navigation goods-to-person AMR (Geek+, Locus Robotics, Hikrobot, Quicktron), high-density cube-grid
              ASRS (AutoStore), 3D tote-retrieval ASRS (Exotec Skypod), and fixed-trajectory pallet and case automation
              (Symbotic, Swisslog). Amazon Robotics competes exclusively internally across all paradigms, operating
              2,900+ US facilities, and represents a non-addressable incumbent market rather than a directly won-or-lost
              account. The competitive field enumerated in this chapter includes Geek+, AutoStore, Exotec, Locus
              Robotics, Symbotic, Quicktron, Hikrobot, Swisslog (KION subsidiary), Standard Bots, and Hai Robotics.
              Geek+ is the only listed pure-play AMR company on a major global exchange, a distinction that provides
              both capital access and public reporting obligations absent in most rivals. AutoStore is the scale leader
              in cube-grid ASRS with 1,950+ systems in 65 countries and 1,300+ unique customers. Exotec, a French firm,
              targets the same high-density segment with its Skypod 3D-retrieval platform and claims 50+ global brand
              customers. Locus Robotics, after a 2024 restructuring, launched its Physical-AI Locus Array system in
              April 2026 and acquired Nexera Robotics to add robot-arm picking capability. Standard Bots is a
              manufacturing-floor robotics company and is not a direct warehouse-AMR competitor to Geek+. Interact
              Analysis projects AMRs will account for roughly 30% of total warehouse-automation revenue by 2027, a
              market of approximately $14 billion, with Geek+ holding approximately 23% warehouse-fulfilment share.
