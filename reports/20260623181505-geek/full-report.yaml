      - number: '5.5'
        title: R&D Intensity, IP Portfolio and Technical Moat
        blocks:
          - type: paragraph
            body: >-
              Geek+ invested RMB 335.1 million in R&D during FY2025, up from RMB 282.0 million in FY2024, representing
              approximately 10.6% of FY2025 revenue. The company employs 408 dedicated R&D experts, equivalent to 41% of
              its 1,054 total headcount, and holds 1,867 patents — a figure it describes as one of the largest patent
              portfolios in the global AMR industry. The investor relations page states the portfolio covers automation
              performance, safety and interoperability, suggesting breadth across hardware and software domains. The
              technical moat rests on three interlocking elements: breadth of hardware families (enabling single-vendor
              end-to-end deployments), the Hyper+ fleet-scheduling depth (enabling coordination of fleets that most
              competitors cannot match in size), and the Geek+ Brain embodied-intelligence layer (enabling RAPS to
              operate without SKU-level re-training). The Robot Matrix platform shortens development cycles for new
              hardware and enables the company to maintain five-plus solution families with a headcount of only about
              1,054 employees — a capital efficiency ratio that is notable. The dependency DAG figure maps critical
              technology dependencies, including LIDAR sensor supply chains, edge-AI chipsets and WMS partner
              ecosystems, that represent risk concentration. On the developer and practitioner side, Geek+ maintains a
              public GitHub organisation at github.com/geekplus (primarily Python utilities), but the core Hyper+ and
              Brain codebases are proprietary on-premises software with no public repository signal. The AMR sector is
              experiencing commoditisation pressure as multiple Chinese vendors — including Hai Robotics, Hikrobot,
              Quicktron and Standard Robots — converge on similar goods-to-person feature sets, which makes the
              embodied-intelligence differentiation more strategically important but also more susceptible to
              competitive catch-up if the Brain model architecture leaks or is replicated. RBR50 recognition for RAPS
              provides third-party validation of technical innovation but does not guarantee sustained competitive
              distance.
