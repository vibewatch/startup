  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Scope and Substitutes
        blocks:
          - type: paragraph
            body: >-
              Warehouse automation is broadly defined as systems that reduce human intervention in the storage, picking,
              sortation, and movement of goods within distribution centres, fulfilment centres, and third-party
              logistics facilities. The market boundary relevant to Geek+ centres on goods-movement and goods-to-person
              solutions: autonomous mobile robots (AMRs), automated storage and retrieval systems (AS/RS), warehouse
              management software (WMS/WCS orchestration), conveyor and sortation hardware, and robotic picking arms.
              Excluded from the core boundary are last-mile delivery robots (autonomous delivery vehicles),
              factory-floor industrial arms performing manufacturing operations, construction logistics, and
              agricultural automation. These adjacencies are distinct both in buyer and in capex structure.

              The status-quo substitutes that warehouse automation competes against are significant and
              underappreciated. The default alternative for most operators is manual picking using paper or RF-scanner
              workflows, which remains dominant in the long tail of smaller warehouses. Conveyor-belt batch-picking
              systems installed in the 2000s and early 2010s represent an intermediate-technology incumbent with
              switching-cost implications. Outsourcing fulfilment entirely to a 3PL that does not automate is a third
              path that defers the capex to the service provider. Understanding why buyers still choose substitutes —
              typically initial capex aversion, integration complexity, or perceived operational risk — is central to
              correctly sizing Geek+'s realistically addressable market rather than the total macro-forecast number.

              Adjacent markets include last-mile delivery AMRs, which share sensor and navigation IP but sell to
              different buyers; factory logistics (internal transport in manufacturing plants); and outdoor autonomous
              fork trucks used in yard management. Embodied-intelligence platforms like Geek+ Brain could expand Geek+'s
              addressable boundary into unstructured picking and value-added services, but these are nascent and not
              included in 2026 sizing.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM004
      - number: '2.2'
        title: 'TAM, SAM and AMR Sub-market: Multiple Sizing Lenses'
        blocks:
          - type: paragraph
            body: >-
              Warehouse automation market sizing is characterised by wide analyst dispersion: published 2026 estimates
              range from US$27.4bn (Grand View Research, bottom of the band) to US$36.2bn (Fortune Business Insights,
              top), reflecting different scope decisions on whether WMS-only software, industrial conveyor maintenance
              services, and emerging robot-as-a-service subscription revenue are included. Mordor Intelligence's 2026
              figure of US$34.17bn with a 13.98% CAGR to 2031 sits in the middle of this band; the Business Research
              Company forecasts US$27.46bn in 2026 at 14.8% CAGR; Grand View Research cites approximately US$27.4bn at
              18.7% CAGR through 2030 to US$59.5bn. Precedence Research pegs the 2026 figure higher still, approaching
              US$107bn by 2035 (a wider scope). The canonical range used in this report is US$27.4-34.2bn (consistent
              with the canonical-metrics file).

              The AMR/mobile robot sub-segment, which is Geek+'s primary competitive arena, is estimated separately.
              Grand View Research sizes the AMR market at approximately US$5.5bn in 2026 at 14.4% CAGR through 2033;
              Coherent Market Insights and Business Research Insights cite US$2.75-6.18bn for 2026 at CAGRs of 14-19.5%.
              Interact Analysis, the most cited specialist analyst for this space, projects the total mobile robot
              market to grow from roughly US$4.5bn in 2023 to over US$14bn annually by 2027, implying AMRs and mobile
              robots represent approximately 30% of the broader warehouse automation market by 2027. Geek+ holds
              approximately 23% global warehouse- fulfilment market share and ranks first in AMR market share according
              to Interact Analysis.

              The goods-to-person segment (shelf-to-person, tote-to-person) is the largest AMR sub-segment and Geek+'s
              core commercial territory. Order-fulfilment robots broadly are forecast to account for approximately 50%
              of mobile robot shipments by 2030. AGV-to-AMR transition is ongoing: AGV revenue share of mobile robots is
              projected to fall from ~33% in 2024 to ~20% by 2030 as AMRs capture displaced spend.
