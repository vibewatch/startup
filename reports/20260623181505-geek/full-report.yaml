      - number: '2.5'
        title: Adoption Constraints, Adverse Evidence and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              The warehouse automation market is not without structural headwinds. Interact Analysis documented a 3%
              decline in warehouse automation revenue in 2024 versus 2023, driven by overcapacity at customers,
              macroeconomic tightening, and project deferrals — the first contraction in the modern expansion era. U.S.
              warehouse vacancy rates peaked at approximately 7.4% in Q3 2025, reflecting pandemic-era over-build of
              fulfilment space that reduces the need for new greenfield automation investment. Vendor bankruptcies —
              most notably Attabotics — and divestitures (Zebra Technologies' robotics division) confirm that the
              2024-2025 correction was real, not just a soft patch.

              Integration risk is now the primary adoption barrier beyond upfront capex. SupplyChain360 and Interact
              Analysis both identify legacy WMS/ERP compatibility, operational cutover planning, and workforce change
              management as the hardest constraints to solve. Projects that underestimate integration complexity
              routinely experience year-1 shortfalls of ~22% vs. initial projections, extending effective payback. High
              interest rates in 2023-2025 also raised the hurdle rate on automation CapEx, although the easing rate
              cycle entering 2026 should partially address this.

              Geopolitical risk is a distinct constraint specific to China-headquartered vendors including Geek+.
              US-China tariffs and potential export controls create revenue exposure for the ~75% of Geek+'s revenue
              generated outside Chinese Mainland. Buyers with China supply-chain sensitivity may preference European or
              American AMR vendors despite Geek+'s cost and technology advantages.

              Key sizing and adoption diligence gaps include: (a) the absence of a publicly verified goods-to-person
              segment revenue number; (b) significant analyst estimate variance (US$27-36bn for 2026 warehouse
              automation TAM) from unexplained methodology differences; and (c) Geek+'s own SAM and SOM have not been
              formally disclosed or modelled, making precise serviceable market penetration calculations speculative.
            claimRefs:
