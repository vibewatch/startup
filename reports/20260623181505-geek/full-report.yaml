      - number: '4.4'
        title: Unit Economics, Cost Structure and Operating Leverage
        blocks:
          - type: paragraph
            body: >-
              Geek+'s unit economics are partially observable from public filings. The CMBI case study of YesAsia (a
              direct Geek+ customer, HKEx 2209) demonstrates a real-world payback of approximately 17 months, with
              labour-cost ratios falling ~1.8 percentage points and daily throughput rising 150% after two years. This
              implies a mid-sized AMR deployment pays back in roughly one to two years, which is consistent with the
              ~78% customer repurchase rate — a strong signal that realised customer ROI clears hurdle rates for
              expansion orders. On the supply side, cost of sales for robotics solutions (RMB 2,003.3m in FY2025) covers
              robot structure parts, motors, drive wheels, controllers, and batteries; Geek+ sources key sub-components
              from China's mature electronics and mechanical supply chain, with the top-5 suppliers representing only
              17.5% of total purchases (FY2024), limiting single-vendor concentration risk. Labour is the other major
              cost category: the FY2025 total remuneration charge was RMB 733.3m (23.1% of revenue), up from RMB 624.4m,
              reflecting the 1,054-strong headcount and equity-settled incentives (RMB 42.1m non-cash SBC). Revenue per
              head (RMB 3,171m / 1,054 = ~RMB 3.01m/employee) is high for a hardware company, indicating
              capital-efficient operations. CAC and sales-cycle duration are not disclosed; the CMBI report documents a
              6-8 week manufacturing + 6-8 week shipping + 1-3 month deployment timeline, suggesting a 4-6 month minimum
              elapsed time from order to revenue recognition. The selling and marketing expense ratio fell from 31.4%
              (FY2022) to 17.0% (FY2025), consistent with improving channel maturity and the benefit of anchor key
              accounts driving repeat orders (top-5 customers ~42% of revenue in FY2024). The direct sales / channel mix
              was approximately 67% direct and 33% channel in FY2024. Customer concentration remains a diligence
              concern: the single largest customer contributed 15.5% of total FY2024 revenue; Geek+ JP, an associated
              entity, was one of the top-5 customers and contributed 7.3% in FY2024. Without named customers in annual
              filings, the sustainability of key-account repurchases is hard to independently verify.
            claimRefs:
