            title: 估值锚定 FY2026E 分析师一致预期与 CMBI 首次覆盖框架
            body: >-
              基准情景来自分析师一致预期：FY2026E 收入 RMB 4.19bn（+32%），并套用 CMBI 首次覆盖中的 7.7x FY2026E P/S 框架。Exotec 和 Hai Robotics
              是私募可比公司，但缺少公开估值数据，因此剔除。所有股价情景仅作说明，不构成投资建议。
