        - USTR《Federal Register》更新；BIS 指引发布；季度利润率数据
        - 任何 Geek+ 实体被加入 BIS Entity List，或美国 Section 301 关税扩大至机器人 / AMR 硬件
        - 立即复核持仓；缩小仓位，只保留期权性
      - - IFRS 盈利能力 / 盈利质量
        - 收入每年增长 25%+，吸收固定 SBC 和研发开支；提升 RaaS 经常性收入占比
        - FY2026 IFRS 净利润；非 IFRS 到 IFRS 的差距收窄
        - FY2026 IFRS 净亏损超过 RMB 200m，或非 IFRS 利润未落地
        - 降低仓位；用无利润情景更新估值模型
      - - IPO 后估值 / 市盈率下修
        - 靠收入动能和利润率扩张降低 PE 分母风险
        - PE 倍数相对成长同业；分析师一致预期修订
        - 股价连续 30 个交易日低于 HK$10
        - 退出或对冲；投资论点失效
      - - 治理 / WVR 少数股东风险
        - HKEX WVR 投资者保护契约；重大交易由少数股东投票
        - 董事会构成变化；关联交易规模
        - 创始人显著稀释经济权益但保留 WVR 控制权；或未经少数股东批准的关联交易超过收入 5%
        - 套用治理折价；正式沟通或退出
      - - 竞争商品化
        - Geek+ Brain 具身 AI 和 RoboShuttle V5 做差异化；借助 Hyper+ 形成软件锁定
        - Hikrobot/Quicktron 定价；Geek+ 毛利率轨迹；相对竞争对手的胜率
        - 毛利率连续两个半年度低于 30%
        - 战略复核护城河；可能需要竞争转向或价格回应
    notes: 否决标准是投资者层面的论点破裂阈值，不是公司指引。所有阈值基于可得公开证据和作者判断；部分指标需要非公开管理数据才能精确监测。
