      - number: '6.3'
        title: 客户细分、垂直行业与地域结构
        blocks:
          - type: paragraph
            body: >-
              Geek+ 客户基础覆盖七个主要垂直行业：电商（大 SKU、高吞吐履约）、FMCG / 食品杂货（商超补货和冷链供应链）、服装与时尚（多 SKU
              混合存储，包括鞋履、折叠服装、悬挂品）、3PL（多客户、多站点、需求变化）、制造 / 工业（仓内物流、WIP、装配送料）、汽车（零部件排序、套件、售后分销）以及医药健康（温控和高准确率配药）。根据 CMBI
              分析师首次覆盖报告引用的 China Insights Consultancy（CIC）数据，按 2024 年收入计，Geek+ 在电商、FMCG 和 3PL 垂直行业的全球 AMR
              方案商中排名第一。地域上，FY2025 约 75.3% 收入来自中国大陆以外国家和地区（FY2024 为 72%），EMEA、美洲和 APAC 均增长。2025 年美洲签约订单同比增长超过
              50%，是已披露增速最快的区域，驱动因素是美国客户面对劳动力短缺、电商量上升和成本压力。EMEA 部署覆盖英国、法国、德国、意大利、波兰、葡萄牙、荷兰和北欧，证据来自具名客户新闻稿和 LogiMAT 2026
              行业展展示。亚太仍然重要，既包括中国存量市场，也包括日本、韩国、新加坡和澳大利亚等增长中的国际市场。官方服装行业页面确认，George.com 和 Bosideng
              等领先零售商已将系统用于退货管理，STL（英国）也正把 Geek+ 足迹扩展到德国纺织物流市场。医药垂直行业的证据包括 Dr. Max Romania 部署（每月 25,000+ SKUs，效率提升 350%）和
              Med24 北欧药房扩张，二者均由 robotics.press 引用。
