      - number: '6.5'
        title: 客户集中风险与竞争压力
        blocks:
          - type: paragraph
            body: >-
              CMBI 分析师报告引用公司数据，清楚记录了一项重大客户集中风险：FY2022、FY2023 和 FY2024，前五大客户收入分别占总收入的 30.8%、45.3% 和 42.1%，单一最大客户分别贡献
              9.3%、15.4% 和 15.5%。2023 年五大客户 45.3% 的集中度高点，反映项目制收入模型中，单个大合同可能主导某一年确认收入。Geekplus JP 是 Geek+ 持股约 39.6%
              的日本公司，以渠道伙伴身份运营，并贡献 FY2024 总收入的 7.3%，既是前五大客户，也是关联方，其续约在商业上敏感。FY2025 集中度数据尚未在公开文件中逐项披露；客户数从约 806 增至约
              950、美洲管线扩张，显示一定分散化，但风险尚未消除。竞争替代已有记录：Exotec 2026 年 3 月宣布为 Decathlon 在法国、英国、葡萄牙、意大利和德国部署七站点 Skyfleet 项目，说明
              Geek+ 最常引用的参考客户之一 Decathlon 正在用竞争供应商扩展欧洲自动化足迹，而不是只向 Geek+ 集中。Geek+ 最初的 Decathlon
              欧洲部署仅覆盖三个国家（法国、波兰、意大利）；Exotec
              项目覆盖五个国家，并涉及额外入库和出库自动化集成。美中关税风险也是客户侧顾虑：如果美国客户采购中国原产机器人硬件时遇到摩擦，或必须满足供应链安全认证要求，美国大单可能延迟、取消，或流向
              Symbotic、Locus Robotics 等本土供应商；KPMG 2026 关税调查也指出，44% 美国企业投资自动化的部分原因是回流生产。
