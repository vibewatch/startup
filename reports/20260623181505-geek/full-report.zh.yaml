      - number: '5.2'
        title: 软件栈、算法平台与 WES 集成
        blocks:
          - type: paragraph
            body: >-
              Geek+ 区别于纯硬件厂商的软件层由三个相互咬合的组件构成。Hyper+ Core Algorithm Platform 为超过 5,000
              台机器人组成的车队提供集中式实时调度，处理路径规划、拥堵消解、电池管理和多系统任务分配。调度器部署在本地，而不是公有云，因此也满足医药等受监管行业对数据安全和网络韧性的要求。Robot Matrix
              是模块化通用机器人技术平台，跨产品线提供可复用的机械、电气和软件组件，加快硬件研发；公司把自己能维持五类解决方案宽度，归因于这个共享平台，而不是每个产品从零开发。Geek+ Software Suite
              包含三层面向企业的能力：Warehouse Execution System（WES）编排拣选、搬运、分拣和叉车流程；RMS（Robot Management
              System）管理车队健康、固件和诊断；IOP（Intelligent Operations Platform）提供看板、预测性维护预警和运营分析。该套件开放 API 和标准化接口，可对接
              SAP、Oracle、Epicor、Microsoft Dynamics、Infor、Manhattan、Blue Yonder、HighJump 等主流 ERP 和 WMS
              平台，降低已运行成熟仓库管理系统客户的部署门槛。技术栈表逐项列出每个软件层的角色、依赖和尽调问题，技术架构栈图则展示从硬件到 AI 推理的分层关系。
