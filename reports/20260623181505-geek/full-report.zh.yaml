      - number: '7.5'
        title: 治理、执行风险与终止标准
        blocks:
          - type: paragraph
            body: >-
              Geek+ 的加权投票权（WVR）结构把治理控制集中在创始人兼 CEO 郑勇手中；IPO 前他持有约 7.3% 经济股权，却在 HKEX Chapter 8A WVR
              框架下行使不成比例的投票权。这造成经济所有权与治理控制之间的结构性错配：在 HKEX
              上市的少数股东约束管理层、挑战战略决策或推动分红的能力有限。关键人依赖很高：具身智能战略转向、全球扩张节奏和投资者信心都与郑勇高度绑定；公司与 Decathlon、Inditex、Toyota
              等锚定客户的关系也很大程度由创始人主导。人员 / 执行风险登记表（TR005）列出创始人关键人、执行和继任风险。用于监控投资逻辑破裂事件的指标包括：（1）FY2026 业绩仍未实现 IFRS 净盈利；（2）任何
              BIS Entity List 纳入或 CFIUS 执法影响 Geek+ 实体；（3）锚定客户（Decathlon 或同等级 Fortune 500 客户）公开暂停或取消订单；（4）股价连续 30 个交易日低于
              HK$10；（5）创始人离任或 WVR 非自愿稀释；（6）新一轮净借款超过 RMB 1 billion；或（7）任何已部署系统发生产品召回或安全事故。表 TR006
              将这些正式化为终止标准并列出行动含义，风险传导图（FR002）展示每类风险向收入、利润率和估值结果的传导路径。
