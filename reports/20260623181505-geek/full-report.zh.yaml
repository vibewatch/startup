      - number: '4.3'
        title: 资产负债表、流动性与资本充足性
        blocks:
          - type: paragraph
            body: >-
              2025 年 7 月 HKEX IPO 让 Geek+ 的资产负债表从技术性资不抵债（2024 年末总权益 −RMB 6,248.8 million，源于 IPO 前投资者优先股安排形成的 RMB 7.0
              billion 赎回负债）转为资本充足。2025 年 12 月 31 日，总权益为 RMB 3,407.7 million，净流动资产 RMB 3,115.8 million。现金及现金等价物 RMB
              2,974.8 million，定期存款 RMB 180.6 million，合计 RMB 3,155.4 million（另有限制性现金 RMB 137.4m）。总借款 RMB 357.9
              million——全部为人民币计价、固定利率银行贷款——低于 2024 年末 RMB 413.9m。调整后流动比率为 2.4x（同口径 IPO 前为 0.3x），资产负债率（总负债 / 总资产）从 295.0%
              降至 40.4%（若剔除赎回负债则此前为 75%）。无资产质押，也无表外安排。存货从 RMB 1,029.5m 降至 RMB 803.2m，营运资本效率提升；贸易应收款从 RMB 713.6m 增至 RMB
              958.2m，部分反映 H2 收入快速加速。应收款减值损失从 RMB 15.2m 增至 RMB 35.4m，原因是增长和订单季节性集中，值得持续监测。投资现金流净额为 −RMB 156.0m（capex
              和设备）；融资现金流提供 +RMB 2,437.1m（主要来自 IPO 募资）。公司称，除 IPO
              招股书披露外，没有计划中的重大资本投资。按当前业务规模，管理层不面临短期流动性危机：经营现金流已转正，现金储备相当于全年收入 8 个多月，提供缓冲。不过，如果 Gino1 人形机器人和 Geek+ Brain 的
              R&D 加速，而商业化周期拉长，capex 可能上升。
