        title: 身份、总部与商业模式
        blocks:
          - type: paragraph
            body: >-
              Geek+ 是 Beijing Geekplus Technology Co., Ltd.（北京極智嘉科技股份有限公司）的交易品牌。这家智能物流机器人公司 2015
              年创立于北京，目前总部仍在北京，并在东京、美国、英国、德国和新加坡设有区域办公室。公司设计、销售并服务面向仓储履约的自主移动机器人（AMR），覆盖货到人拣选、箱到人穿梭、分拣和托盘搬运；其软件栈包括 Hyper+
              核心算法平台和 Robot Matrix，并推出名为 Geek+ Brain 的具身智能基础模型。商业模式由一次性系统销售、订阅和
              Robotics-as-a-Service（RaaS）安排构成，绝大多数收入来自向全球零售商、第三方物流商、服装品牌、商超和制造商销售仓储履约解决方案。2025 年 7 月 9 日，Geek+
              在香港联交所以股票代码 2590 上市，成为首家纯 AMR
              仓储机器人上市公司，也从风险资本支持的私营公司转为信息披露完整的上市公司。本章确立身份、领导层、资本基础、规模和里程碑时间线，后续章节均以此作为事实底座。
