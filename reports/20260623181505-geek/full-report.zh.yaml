      - number: '3.4'
        title: 护城河、脆弱点与反向证据
        blocks:
          - type: paragraph
            body: >-
              Geek+ 的主要竞争护城河包括多范式产品宽度、72,000 多台机器人装机基础、52 多个全球服务站和 310
              多名现场工程师，以及上市市场资本通道。装机基础带来重复服务和升级收入，单一范式且车队更小的竞争对手难以匹配；已把 Geek+ Hyper+ 软件接入仓库管理系统的客户，面临不低的切换成本。Geek+ 声称约
              23% 仓储履约市场份额，大约等于第二和第三大玩家份额之和；按当前轨迹，任何单一对手都需要多年超额表现，才可能缩小装机基础差距。最重要的反向证据集中在三类威胁：第一，Amazon Robotics 在 2,900
              多个美国设施运行专属内部工具，形成永久不可触达市场；其 ASCS 平台被 Interact Analysis 称为「迄今最清晰的信号，表明 Amazon 打算直接与成熟 3PL 运营商竞争」——Amazon 扩张
              3PL 物流服务，可能压制 Geek+ 最大客户垂直的需求。第二，中国竞争对手 Hikrobot 和 Quicktron 承担更低 R&D 开销（Hikrobot 借力 Hikvision
              制造；Quicktron 拥有 KION 生产关系），能以结构性更低价格提供有竞争力的 AMR 硬件，挤压中端市场交易经济性。第三，作为总部在中国的硬件供应商，Geek+
              在美国和欧盟政府、国防及关键基础设施合同中面临更强采购逆风，限制这些受监管垂直的 TAM。Locus Robotics 2024 年重组及随后转向 Locus Array，说明纯
              AMR、软件重资产模式需要持续资本；它能否作为独立主体存续仍是现实问题。护城河耐久度和竞争风险登记表按维度总结主要威胁和缓释路径。
