      - number: '4.2'
        title: 利润表摘要与盈利路径
        blocks:
          - type: paragraph
            body: >-
              FY2025 利润表显示 Geek+ 经营经济性首次出现有意义拐点。收入 RMB 3,171.0 million、毛利 RMB 1,125.0 million（+34.4%），带来 35.5% 毛利率，较
              FY2024 的 34.8% 提升 70 个基点。销售成本为 RMB 2,046.0 million，主要由硬件成本构成（机器人、工作站、货架）；存货跌价 RMB 39.5 million（FY2024：RMB
              41.5m），显示库存质量趋于正常。毛利以下，opex 为 RMB 1,143.6 million，三项关键构成为：R&D（RMB 335.1m，占收入 10.6%）、销售和营销（RMB
              538.5m，17.0%）以及行政（RMB 270.6m，8.5%）。随着产品组合围绕仓储解决方案标准化，R&D 强度已从 FY2022 约 30% 收入降至 FY2025 的 10.6%；CMBI 预计
              FY2026E 将维持约 10-11%，反映具身智能 R&D 投入。经营亏损收窄至 RMB 28.8 million（此前 RMB 127.6m），IFRS 净亏损收窄至 RMB 10.4 million（此前
              RMB 831.5m，其中包括 RMB 685.8m 非现金赎回负债调整）。调整后净利润（非 IFRS）RMB 43.8 million，来自加回股权激励（RMB 42.1m）、上市费用（RMB
              33.3m），并扣除赎回负债收益（−RMB 21.2m）。CMBI 预计 FY2026E 收入 RMB 4,316m（+36%）、毛利率 38%、调整后净利润约 RMB 401.6m，意味着 9%+
              利润率——首个具备商业意义的盈利年度。StockAnalysis 显示四年 EBITDA 从 −RMB 797.6m（FY2022）改善到 −RMB 84.6m（FY2024）和 −RMB
              47.5m（FY2025），与经营杠杆叙事一致，但也确认公司尚未达到 IFRS-EBITDA 盈亏平衡。
