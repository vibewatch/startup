              Geek+ 由 Yong Zheng（郑勇）创立，他目前仍担任董事长兼首席执行官。郑勇毕业于清华大学，曾在欧洲的 ABB 和 Saint-Gobain 工作；看到仓储自动化落后于工厂自动化后，他在 2015
