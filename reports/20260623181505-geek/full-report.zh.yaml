      - number: '3.2'
        title: 竞争基础
        blocks:
          - type: paragraph
            body: >-
              仓储自动化买方沿五个轴选择供应商：产品范式是否匹配（哪类机器人能解决 SKU 周转和存储密度问题）、软件和车队调度深度、商业模式（RaaS 还是 capex）、全球服务与备件覆盖、价格。Geek+ 的
              Hyper+ 算法可同时调度 5,000 多台机器人，声称部署周期比行业典型替代方案快五倍；在竞标中，这是有意义的差异点。AutoStore 只通过全球 1,000
              多家集成商组成的伙伴网络分销，而非直接面向终端客户，这削弱客户亲密度，但扩大地域覆盖。Exotec 的 Skypod 系统部署可 3D 自由移动的
              AMR，直接从货架取箱，对巷道空间要求很低，足迹形态不同于立方网格和传统货架。Swisslog 作为 KION 子公司，已在 50 多个国家完成 2,500 多个项目，并既为 AutoStore
              做集成，也提供自有 SynQ 软件平台。AutoStore 在 2026 年推出 CubeVerse（模块化网格扩展产品）和 AutoStore
              Intelligence（软件分析平台），表明要在软件深度上竞争。Locus Robotics 于 2026 年开设欧洲总部，并参加 MODEX 2026 Best New Innovation
              竞赛，显示正在主动调整地域和产品定位。Geek+ 独特之处在于，一个供应商平台内同时提供自由导航 AMR、ASRS 箱到人、分拣和托盘搬运，降低运行混合流程客户的集成复杂度。Geek+、Exotec 和
              Locus Robotics 都提供 RaaS 和订阅商业模式，但 Symbotic（仅 capex）和
              AutoStore（经集成商）仍受限制。本节的功能与能力矩阵比较七家供应商在七个最常被引用范式维度上的差异。
