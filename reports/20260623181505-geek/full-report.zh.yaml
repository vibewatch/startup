  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险分类与严重性排序
        blocks:
          - type: paragraph
            body: >-
              Geek+ 处在六类不同风险向量的交汇处，每一类单独看都重要，叠加后又相互放大。本章把这些向量整理成统一分类——地缘政治与贸易、财务与估值、竞争与运营、治理与集中风险——并依据 FY2025
              年度业绩、第三方监管来源和独立市场分析，按可能性和影响排序。本次投资的总体风险评级为 HIGH，主要由地缘政治和估值敞口驱动。严重性排序中，美中关税与出口管制风险综合严重性最高（可能性 very-high、影响
              critical），其后是估值 / PE 去评级风险（可能性 very-high、影响 high）和 WVR 治理风险（可能性 medium、影响 high）。缓解成熟度最高的是财务风险（IPO
              后资产负债表增强），最低的是地缘政治风险（没有针对关税升级的合同保险）。表 TR001 提供完整风险总览快照，风险热力图（FR001）把所有已识别风险放在可能性 -
              影响网格上。后续每节都会审视一个风险簇，给出来源证据、缓解措施和可监控的领先指标。
