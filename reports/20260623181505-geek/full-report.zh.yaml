  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局
        blocks:
          - type: paragraph
            body: >-
              2026 年全球仓储自动化市场围绕四类主要技术范式竞争：自由导航货到人 AMR（Geek+、Locus Robotics、Hikrobot、Quicktron）、高密度立方网格
              ASRS（AutoStore）、3D 箱式检索 ASRS（Exotec Skypod），以及固定轨迹托盘和箱件自动化（Symbotic、Swisslog）。Amazon Robotics
              只在内部跨所有范式竞争，运营 2,900 多个美国设施；它代表一个不可触达的存量市场，而不是能直接赢下或输掉的客户。本章列出的竞争场包括 Geek+、AutoStore、Exotec、Locus
              Robotics、Symbotic、Quicktron、Hikrobot、Swisslog（KION 子公司）、Standard Bots 和 Hai Robotics。Geek+ 是唯一在全球主要交易所上市的纯
              AMR 公司，这一身份带来资本通道，也带来多数竞争对手没有的公开披露义务。AutoStore 是立方网格 ASRS 的规模龙头，拥有 65 个国家 1,950 多套系统和 1,300 多家独立客户。法国公司
              Exotec 以 Skypod 3D 检索平台瞄准同一高密度细分，并称拥有 50 多家全球品牌客户。Locus Robotics 在 2024 年重组后，于 2026 年 4 月推出 Physical-AI
              Locus Array 系统，并收购 Nexera Robotics 以补足机器人手臂拣选能力。Standard Bots 是制造车间机器人公司，并非 Geek+ 的直接仓储 AMR 竞争对手。Interact
              Analysis 预计，到 2027 年 AMR 将占整体仓储自动化收入约 30%，对应约 $14 billion 市场；Geek+ 拥有约 23% 仓储履约份额。
