  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: IPO 参考与当前市场快照
        blocks:
          - type: paragraph
            body: >-
              Geek+ 于 2025 年 7 月 9 日在 HKEX 上市（代码 2590），上市市值约 HK$22 billion（约 US$2.7–2.8 billion），募资约 HK$2.71 billion（约
              US$281 million）。公开发售部分超额认购 133 倍，国际配售部分超额认购 30 倍，凸显上市时机构和散户热情。基石投资者——Xiong'an Robot（US$41.3m）、Arc
              Avenue（US$25m）、Eastspring Investments（US$15m）和 Yige/Zongteng（US$10m）——合计承诺 US$91.3
              million，既提供定价信号，也形成锁定仓位，解禁后会带来结构性供给压力。截至 2026-06-23，股价约 HK$12.50，较 2025 年 10 月 9 日创下的 52 周高点 HK$33.90 下跌
              63%，较 2026 年 6 月 22 日创下的 52 周低点 HK$11.18 高 12%。市值约 HK$16.72 billion（约 US$2.14 billion），流通股约 1.34 billion
              股。基于接近盈亏平衡的 IFRS 盈利，滚动市盈率约 590x；基于 TTM 收入，市销率约 4.4x；企业价值 / 收入约 3.4x。这些指标反映投资案例的核心张力：Geek+ 是真正的品类领导者，收入增长
              31.6%，非 IFRS 利润转正，资产负债表增强；但其交易倍数把多年持续高质量执行计入价格，容错空间有限。估值区间图在不同情景假设下给出牛 / 基准 / 熊股价区间，上行锚定分析师共识，下行锚定基于 DCF
              的内在价值估计。
