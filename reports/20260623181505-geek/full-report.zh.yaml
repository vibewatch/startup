  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础规模与构成
        blocks:
          - type: paragraph
            body: >-
              截至 2025 年 12 月 31 日，Geek+ 披露全球约有 950 个终端客户，高于 2024 年中约 806 个，以及 2025 年 7 月 IPO 时披露的 800+ 个，意味着 2025
              年下半年净新增超过 60 个账户。其中，超过 80 家为 Fortune Global 500 公司，证明公司已打入企业级客户层。FY2025 约 78% 的整体客户复购率、2025 年上半年超过 80%
              的复购率，采用的是项目制复购定义：客户至少签下一笔追加订单。关键账户——公司对顶级战略关系的称呼——2024 年复购率为 84.3%，说明最具商业意义的客户群粘性更强。FY2025 中国大陆以外收入达到总收入的
              75.3%，毛利率为 46.6%，相比 2025 年上半年为 79.5%，显示国际客户已主导收入基础。2025 年美洲新增签约订单同比增长超过 50%，由美国领跑；总新增订单达到 RMB 4,137
              million（同比 +31.7%），中国以外订单占近 80%，同比增速近 40%。2025 年订阅式服务订单同比增长超过 90%，显示装机基础正逐步向经常性收入转变。根据 robotics.press
              对厂商披露的追踪，公司累计向 40+ 个国家和地区交付超过 72,000 台机器人，系统累计履约超过 10 billion 个订单。按 Interact Analysis 数据，Geek+ 已连续七年位居全球
              AMR 市占率第一，Shelf-to-Person 子板块 2025 年份额达到 48.5%。
