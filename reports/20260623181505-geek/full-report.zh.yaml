      - number: '6.4'
        title: 留存、复购与扩张动态
        blocks:
          - type: paragraph
            body: >-
              Geek+ 披露的核心留存指标是项目制客户复购率，而不是 SaaS 企业常用的年度化 NRR 或 GRR，反映 AMR 部署模式的项目交付属性。FY2025 年报披露整体复购率约 78%，2025 年上半年 /
              LogiMAT 2026 公告披露超过 80%。CMBI 分析师首次覆盖（2025 年 8 月）引用公司数据提供了更细颗粒度：2024 年全客户复购率为 74.6%，关键账户复购率为
              84.3%，说明最具战略意义的关系明显比长尾客户更稳。YesAsia 案例是量化最完整的 land-and-expand 样本：2022 年 10 月 Goodman Warehouse 部署（161 台
              AMR，US$5.9 million）17 个月回本，并直接带来 2025 年 5 月 Mapletree 第二份合同（240 台 AMR）。Decathlon 从 2018
              年首个上海仓出发，随后扩展到中国其他站点，再到 2022 年三个欧洲 DC，是地域跨度最大的多站点扩张模式。2025 年订阅式服务订单同比增长超过 90%，包括经常性维护、RaaS 安排和 IOP
              数据智能平台，显示收入流正逐步转向经常性，最终可能支持更传统的留存指标。2025 年上半年最大单笔订单超过 RMB 100 million，2025 年还从拉美和东欧等新兴市场拿下多笔类似大单。公开报道没有披露
              NRR 和 GRR；对于希望与软件或 RaaS 优先同行比较的投资者，这是一个重要证据缺口。
