      - number: '8.5'
        title: 投资逻辑、反逻辑与最终结论
        blocks:
          - type: paragraph
            body: >-
              牛市逻辑立在四根相互关联的柱子上：（i）Geek+ 是仓储履约 AMR 中可验证的收入领导者，全球市占率约 23%，且是 HKEX 唯一上市纯标的，具备稀缺性溢价；（ii）FY2025 转为调整后净利润（RMB
              43.8m）并实现正经营现金流（RMB 85.7m），确认单位经济模型拐点；（iii）海外收入占比 75.3%、毛利率 46.6%，相比国内业务约 29%
              毛利率，随着地域结构继续迁移，形成结构性利润率扩张杠杆；（iv）美洲订单获取轨迹（2025 年 +50%）和 RaaS 订阅增长（2025 年订单同比
              +90%）显示中期需求动能可持续。反逻辑同样有力：股票基于微薄 IFRS 盈利的滚动 PE 约 590x，较 52 周高点下跌 63%，DCF 模型给出的 5 年增长退出公允价值为
              HK$7.72——比当前价格低约 38%。WVR 治理结构把投票控制集中在创始人郑勇手中，带来少数股东风险。公司约 75%
              收入来自中国大陆以外国家，同时总部在北京：这让其结构性暴露于美中贸易紧张、关税和出口管制风险，而这些风险很难精确定价。基石锁定期到期（时间表未完全披露）构成供给压力；公司尚未连续四个或更多季度公开实现 GAAP
              盈利，意味着共识买入逻辑是在按任何价格买增长的外推。结论：跟踪。HK$12.50 的 Geek+ 是一家世界级公司，但价格拉得很满。估值立场是拉伸，而不只是昂贵，因为 14 名分析师 Strong Buy 共识和
              CMBI 细致的自下而上工作显示存在可信重估路径；但要证明当前倍数合理，公司必须兑现的执行条件（持续 30%+ 收入增长、有意义的 GAAP 盈利、没有关税升级）尚未在多个公开报告期中得到验证。若股价回到或低于
              HK$15（约 3.5x FY2026E P/S），或 FY2026 中期业绩（预计 2026 年 8 月）确认 GAAP 盈亏平衡，风险调整后配置价值会明显改善。
