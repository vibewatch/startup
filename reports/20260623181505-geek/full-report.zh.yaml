      - number: '5.5'
        title: 研发强度、IP 组合与技术护城河
        blocks:
          - type: paragraph
            body: >-
              Geek+ 在 FY2025 投入 RMB 335.1 million 研发，高于 FY2024 的 RMB 282.0 million，约占 FY2025 收入的 10.6%。公司拥有 408
              名专职研发专家，相当于 1,054 名总员工的 41%，并持有 1,867 项专利——公司称这是全球 AMR
              行业最大的专利组合之一。投资者关系页面称，该组合覆盖自动化性能、安全和互操作性，显示硬件和软件领域都有布局。技术护城河靠三点咬合：硬件系列宽度（支持单一厂商端到端部署）、Hyper+
              车队调度深度（能协调多数竞争对手无法匹配规模的车队），以及 Geek+ Brain 具身智能层（让 RAPS 无需按 SKU 重新训练即可运行）。Robot Matrix 平台缩短新硬件开发周期，也让公司用约
              1,054 名员工维持五个以上解决方案系列——这个资本效率比值得注意。依赖 DAG 图映射关键技术依赖，包括 LIDAR 传感器供应链、边缘 AI 芯片组和 WMS
              合作伙伴生态，这些都构成风险集中。开发者和从业者侧，Geek+ 在 github.com/geekplus 维护公开 GitHub 组织（主要是 Python 工具），但核心 Hyper+ 和 Brain
              代码库是专有本地部署软件，没有公开仓库信号。随着多家中国厂商——包括 Hai Robotics、Hikrobot、Quicktron 和 Standard Robots——向类似货到人功能集收敛，AMR
              行业正承受商品化压力；这让具身智能差异化更具战略重要性，但如果 Brain 模型架构泄露或被复刻，也更容易被竞争对手追上。RBR50 对 RAPS 的认可验证了技术创新，但不能保证竞争距离可持续。
