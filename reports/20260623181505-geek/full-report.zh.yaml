      - number: '2.2'
        title: TAM、SAM 与 AMR 子市场：多种测算视角
        blocks:
          - type: paragraph
            body: >-
              仓储自动化市场测算的特点是分析师分歧很大：已发布的 2026 年估计从 US$27.4bn（Grand View Research，区间底部）到 US$36.2bn（Fortune Business
              Insights，顶部）不等，反映各家对是否纳入纯 WMS 软件、工业输送设备维护服务和新兴 robot-as-a-service 订阅收入的范围判断不同。Mordor Intelligence 对 2026
              年的测算为 US$34.17bn，并预计到 2031 年 CAGR 为 13.98%，位于区间中段；Business Research Company 预测 2026 年为 US$27.46bn，CAGR 为
              14.8%；Grand View Research 给出约 US$27.4bn，并预计到 2030 年以 18.7% CAGR 增至 US$59.5bn。Precedence Research 的 2026
              年数字更高，并到 2035 年接近 US$107bn（范围更宽）。本报告采用的标准区间为 US$27.4-34.2bn（与 canonical-metrics 文件一致）。

              AMR / 移动机器人子赛道是 Geek+ 的主要竞争场，需单独测算。Grand View Research 估计 2026 年 AMR 市场约 US$5.5bn，并预计到 2033 年 CAGR 为
              14.4%；Coherent Market Insights 和 Business Research Insights 给出的 2026 年区间为 US$2.75-6.18bn，CAGR 为
              14-19.5%。该领域最常被引用的专业分析机构 Interact Analysis 预计，整体移动机器人市场将从 2023 年约 US$4.5bn 增至 2027 年每年超过 US$14bn，意味着到 2027
              年，AMR 和移动机器人约占更广义仓储自动化市场的 30%。据 Interact Analysis，Geek+ 在全球仓储履约市场拥有约 23% 份额，并位居 AMR 市场份额第一。

              货到人细分（货架到人、箱到人）是最大的 AMR 子赛道，也是 Geek+ 的核心商业领地。广义订单履约机器人预计到 2030 年将占移动机器人出货量约 50%。AGV 向 AMR 的迁移仍在继续：随着 AMR
              吃掉被替代支出，AGV 在移动机器人收入中的份额预计将从 2024 年约 33% 降至 2030 年约 20%。
