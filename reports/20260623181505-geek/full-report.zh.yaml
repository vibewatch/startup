  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、范围与替代方案
        blocks:
          - type: paragraph
            body: >-
              仓储自动化通常指在配送中心、履约中心和第三方物流设施内，减少人在存储、拣选、分拣和货物流转中介入的系统。与 Geek+
              相关的市场边界集中在货物流转和货到人解决方案：自主移动机器人（AMR）、自动存储与检索系统（AS/RS）、仓储管理软件（WMS/WCS
              编排）、输送与分拣硬件，以及机器人拣选臂。核心边界不包括最后一公里配送机器人（自动配送车）、在工厂车间执行制造作业的工业机械臂、建筑物流和农业自动化。这些相邻领域在买方和资本开支结构上都不同。

              仓储自动化要替代的现状方案规模大且常被低估。多数运营商的默认选择仍是人工拣选，配合纸单或 RF 扫描流程；在长尾小型仓库里，这仍占主导。2000 年代和 2010
              年代初安装的输送带批量拣选系统，是中间技术存量，也带来切换成本。把履约完全外包给不做自动化的 3PL 是第三条路，它把资本开支递延给服务商。买方为何仍选择替代方案——通常是回避初始
              capex、集成复杂，或认为运营风险偏高——是正确测算 Geek+ 可现实触达市场的核心，而不是直接套用宏观预测总量。

              相邻市场包括最后一公里配送 AMR，它们共享传感器和导航 IP，但卖给不同买方；工厂物流（制造厂内部运输）；以及用于堆场管理的户外自动叉车。像 Geek+ Brain 这样的具身智能平台，可能把 Geek+
              的可触达边界扩展到非结构化拣选和增值服务，但这些方向仍处早期，未纳入 2026 年测算。
