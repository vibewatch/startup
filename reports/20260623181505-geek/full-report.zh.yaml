      - number: '4.4'
        title: 单位经济性、成本结构与经营杠杆
        blocks:
          - type: paragraph
            body: >-
              Geek+ 的单位经济性可从公开文件中部分观察。CMBI 对 YesAsia（Geek+ 直接客户，HKEx 2209）的案例研究显示，真实回本期约 17 个月，两年后人工成本率下降约 1.8
              个百分点，日吞吐量提升 150%。这意味着中型 AMR 部署大约一到两年回本，与约 78% 客户复购率一致——强烈说明客户实际 ROI 足以跨过扩张订单的门槛率。供给端，机器人解决方案销售成本（FY2025 为
              RMB 2,003.3m）覆盖机器人结构件、电机、驱动轮、控制器和电池；Geek+ 从中国成熟的电子和机械供应链采购关键子部件，前五大供应商仅占总采购额
              17.5%（FY2024），限制单一供应商集中风险。人工是另一项主要成本：FY2025 总薪酬费用为 RMB 733.3m（占收入 23.1%），高于 RMB 624.4m，反映 1,054
              人团队和以权益结算的激励（RMB 42.1m 非现金 SBC）。人均收入（RMB 3,171m / 1,054 = 约 RMB 3.01m / 人）对硬件公司而言较高，说明运营资本效率不错。CAC
              和销售周期时长未披露；CMBI 报告记录 6-8 周制造 + 6-8 周运输 + 1-3 个月部署的时间线，意味着从订单到收入确认至少需要 4-6 个月。销售和营销费用率从 31.4%（FY2022）降至
              17.0%（FY2025），与渠道成熟度提升、核心大客户带动复购（FY2024 前五大客户约占收入 42%）相符。FY2024 直营 / 渠道组合约为 67% 直营、33%
              渠道。客户集中仍是尽调关注点：最大单一客户贡献 FY2024 总收入 15.5%；Geek+ JP 作为联营实体，是前五大客户之一，FY2024 贡献
              7.3%。年报未披露具名客户，因此核心客户复购的可持续性难以独立验证。
