      - number: '4.5'
        title: 财务结论、收入质量与尽调阻断点
        blocks:
          - type: paragraph
            body: >-
              Geek+ FY2025 的财务画像，是一家硬件驱动系统集成商，正处在早期但可信的盈利转型中。31.6% 收入增长显著高于 AutoStore 等同业（下滑），并与 Symbotic 大致可比；35.5%
              毛利率对硬件密集型 AMR 解决方案而言不错。调整后净利润转正是真实的，因为它反映实际运营改善（规模经济、存货跌价下降、SG&A 比率改善），而非一次性收益。不过，仍有几项问题需要谨慎。第一，IFRS
              净亏损（RMB 10.4m）和负 EBITDA（−RMB 47.5m）确认公司在任何标准化口径下尚未完全盈利；Yahoo Finance 和 Morningstar 报道的约 590x 追踪 PE
              反映已披露盈利极薄，StockAnalysis 历史数据显示 FY2025 自由现金流为 −RMB 44.4m。第二，收入质量有一次性风险：系统销售模式让验收集中在 Q4，订单到收入转化率 73-80%
              有波动，应收款减值大幅上升。第三，中美贸易关税带来有意义的成本和需求风险。2026 KPMG Tariff Survey 显示，78% 组织称当前关税推高销货成本，51% 称利润率下降；Geek+
              作为中国硬件出口商，75.3% 收入来自境外，结构上暴露。除「风险中性」资金管理外，管理层未提及对冲计划。第四，订阅 / RaaS 收入低于总收入 1%（FY2025「其他」RMB 2.5m）；所谓订阅订单增长
              >90% 来自几乎可以忽略的基数，尚不具备经济实质。财务结论是：收入轨迹和毛利方向强；如果毛利率守住、opex 杠杆延续，通往 FY2026E 的盈利路径可信；但当前估值（约 4.4x P/S、约 590x
              PE）对执行失误容忍度很低，而 CMBI 的 BUY 评级和 HK$26.7 目标价并非反向信号，只是意味着股价已较 IPO 水平下跌约 50%。
