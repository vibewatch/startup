      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              仓储自动化采购由运营和供应链负责人推动，资金来自资本开支预算，或越来越多地来自
              Robotics-as-a-Service（RaaS）模式下的运营预算。主要付款方是仓库运营商——可能是大型电商平台、自营配送中心的品牌零售商、第三方物流（3PL）提供商，也可能是拥有内部配送运营的制造商。不同垂直行业的采用触发点差异很大。

              电商运营商是最成熟、规模最大的买方群体：Amazon 等公司已在本土部署数万台机器人，设定了吞吐量和准确率基准，竞争对手必须追上。电商采用自动化的触发点，是旺季吞吐需求和 SKU
              激增已经超出人工拣选承载能力。第三方物流提供商是 2026 年增长最快的细分，因为多客户运营需要灵活、可重新部署的自动化；RaaS 模式和短实施周期（Geek+ RoboShuttle V5 最短 48 小时）是
              3PL 的关键采购标准。

              零售和服装买方（包括 H&M、Inditex/Zara、Decathlon、Nike
              等品牌）采用自动化，是被全渠道履约复杂度驱动：同一设施既要服务门店补货，也要处理直面消费者订单。商超买方正在增长，它们的拣选需求高频、时间敏感、利润率窄，因此降低人工成本尤其有吸引力。医药和医疗运营商采用自动化，部分原因是监管可追溯性和准确率要求，而不只是降本。拥有内部物流的制造企业则靠自动化打通工厂到仓库的流程，并降低内部搬运成本。

              多数企业买方的预算归 VP Supply Chain 或 COO 所有；决策按资本项目审批，因此首次部署销售周期为 6-18 个月。现有客户复购速度更快——Geek+ 约 78% 的复购率和 YesAsia
              第二个仓库部署，说明先落地再扩张的 land-and-expand 机制在运转。
