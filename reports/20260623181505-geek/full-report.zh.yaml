  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 解决方案家族与产品线地图
        blocks:
          - type: paragraph
            body: >-
              Geek+ 把硬件产品组合拆成五类解决方案，合起来覆盖完整的仓内物流栈。Shelf-to-Person（货到人）系列以 PopPick 和 PopPick Lite
              品牌商业化，把货架送到固定拣选站；PopPick 能在同一占地里同时拣选料箱和托盘，PopPick Lite 则接入输送线，服务中等吞吐量场景的入库和出库流程。Tote-to-Person 系列以
              RoboShuttle 平台为核心，从高密度货架阵列把料箱送到人体工学工作站；2026 年 3 月，公司推出 RoboShuttle V5，把垂直存储高度扩到 12 米，最快 48 小时即可部署，并原生集成
              Robot Arm Picking Station，支持全无人拣选。Pallet-to-Person 方案是面向整托盘和混合 SKU B2B、B2C 作业的多层
              ASRS，服务零售、3PL、FMCG、医药和汽车客户。分拣与配送方案处理最后一公里交叉转运和包裹分拣。搬运机器人——地面搬运车、牵引车和自动叉车——覆盖从卡车卸货到产线配送的内部物料运输。这样的产品宽度在纯
              AMR 厂商中少见；公司称自己拥有全球 AMR 领域最宽的单一厂商产品范围。产品模块表逐项列出六条主要硬件线的流程位置、成熟度和主要服务行业，产品成熟度矩阵则给出各系列能力强弱快照。
