      - number: '7.3'
        title: 财务、估值与资本风险
        blocks:
          - type: paragraph
            body: >-
              Geek+ FY2025 报告 IFRS 净亏损 RMB 10.4 million，较 FY2024 IFRS 亏损 RMB 831.5 million 大幅改善，但微薄利润率带来显著盈利风险。管理层报告非
              IFRS 调整后净利润 RMB 43.8 million——差异主要来自股权激励和其他非现金费用——但 IFRS 口径仍是净亏损，这构成与估值相关的盈利质量问题。当前基于微薄 IFRS 盈利的滚动市盈率约
              590x，高度压缩且极易受伤：收入少兑现 5–8%，或利润率小幅回撤，都可能完全抹掉 IFRS 盈利，使 PE 倍数失去定义，并很可能触发急剧重估。IPO 后股价从 52 周高点 HK$33.90 跌到 52
              周低点 HK$11.18，跌幅约 67%，反映市场担忧这种估值张力。IPO 基石投资者（合计 US$91.3 million）受锁定期约束，最终退出会形成结构性抛压。积极一面是，IPO
              后资产负债表显著增强：现金和定期存款为 RMB 3,115.8 million，流动比率从 0.3x 改善到 2.4x，资产负债率从 295% 降至 40.4%。FY2025 经营现金流入 RMB 85.7
              million，证明首次实现持续现金生成。R&D 支出 RMB 335.1 million（约占收入 10.6%）和年末总借款 RMB 357.9 million，反映公司仍有资本强度。Forbes
              科技行业分析确认，关税驱动的毛利率压力——32% 科技公司报告毛利率下降 1–5%，22% 报告下降 6–10%——给 Geek+ 已经很薄的盈利再增加投入成本逆风。
