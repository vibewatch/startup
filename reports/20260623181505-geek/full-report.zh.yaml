companyProfile:
  summary: >-
    Geek+（Beijing Geekplus Technology Co., Ltd. / 极智嘉科技）是一家总部位于北京的仓储履约机器人公司，成立于 2015
    年。公司销售自主移动机器人（AMR）系统，覆盖货到人拣选、箱到人穿梭、分拣和托盘搬运，并由 Hyper+ 算法平台与 Robot Matrix 软件调度；同时正叠加 AI 拣选（Robot Arm Picking Station）和
    Geek+ Brain 具身智能模型。公司已向 40 多个国家出货超过 72,000 台机器人，服务约 950 家终端客户，其中包括 80 多家 Fortune Global 500 企业，并拥有全球仓储履约 AMR
    市场第一份额。公司于 2025 年 7 月 9 日在香港联交所上市（代码 2590），FY2025 首次实现调整后（非 IFRS）净利润。
