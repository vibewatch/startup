            body: Geek+ 约 78% 的复购指标计算的是客户是否至少下过一笔追加订单，而不是每年有多少收入续约。没有披露 NRR 或 GRR 时，收入基础相对 SaaS 或 RaaS 原生竞争对手的韧性无法直接比较。
            calloutType: assumption
