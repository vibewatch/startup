      - number: '6.2'
        title: 具名客户部署与案例研究
        blocks:
          - type: paragraph
            body: >-
              资料最完整的部署案例是全球最大体育用品零售商 Decathlon。Geek+ 与 Decathlon 2018 年在上海开始合作，首个货到人部署让劳动生产率提升三倍、存储容量增加
              40%，并在三年内回本；这一数据来自 Interact Analysis 与 Decathlon、Geek+ 联合撰写的白皮书，并被 mfgrobots.com 行业报道引用。到 2022 年初，Geek+
              已把合作扩展到欧洲，在 2022 年 1 月宣布，于三个欧洲配送中心——法国 Castelnau、波兰 Łódź、意大利 Campania——部署数百台 P-series 拣选机器人和 RoboShuttle
              料箱。另一个可能带有竞争意味的进展是，Exotec 在 2026 年 3 月宣布，正为 Decathlon 在五个欧洲国家（法国、英国、葡萄牙、意大利、德国）部署七站点 “Skyfleet”
              多站点自动化项目，说明 Decathlon 正在分散欧洲自动化合作伙伴，而不是只向 Geek+ 集中。Nike Japan 部署了 200+ 台 Geek+ P-series
              机器人用于当日达运营，成为公司旗舰体育服饰参考客户之一。UPS Supply Chain Solutions 运营 Geek+ 货到人机器人，The Wire China 人物报道中有具名照片佐证。香港电商运营商
              YesAsia Holdings（HKEX: 2209）2022 年 10 月在青衣 Goodman Warehouse 部署 161 台 Geek+ AMR，合同金额 US$5.9 million，17
              个月回本，两年节省约 US$10 million，日吞吐量提升 150%，订单准确率达到 99.99%。YesAsia 2025 年 5 月又签下第二个部署，在 Mapletree Logistics Hub
              投入 240 台 AMR 和 930 个智能货架——这是香港电商领域最大单体 AMR 部署。天津 Tmall（Alibaba）部署（约 50 台机器人，约 2016
              年）被确认为公司的首个商业客户。多方来源确认的其他具名账户包括 Walmart、Toyota（工厂部署）、DHL、Kuehne+Nagel、XPO、H&M、Tommy Hilfiger、Inditex/Zara
              和 Adidas。LogiMAT 2026（斯图加特，2026 年 3 月）上，Geek+ 重点展示了 STL 合作向德国扩展，以及北欧药房扩张（Med24 Phase 2）等近期生产部署。Yamada
              Denki（日本电子零售商）部署截至 runDate 被视为历史案例或未确认案例；尚未找到 2026 年公开公告来确认其仍在活跃部署。
