      - number: '8.2'
        title: 分析师覆盖与目标价
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 6 月，S&P Global 调查的 14 名卖方分析师覆盖 Geek+，使其成为同等规模香港新股中覆盖较多的标的之一。共识评级为 Strong Buy——10 名分析师给 Strong
              Buy、4 名给 Buy，没有 Hold、Sell 或 Strong Sell 建议。12 个月平均目标价为 HK$33.07，较 2026-06-23 收盘价 HK$12.50 隐含约 164.6%
              上行。DBS 公开目标价最高，为 HK$35.00，其后是 Daiwa 的 HK$32.00 和 Morgan Stanley 的 HK$29.00，Guotai Haitong 以 HK$21.60
              锚定低端。CMBI 首次覆盖报告（2025 年 8 月 14 日）基于 2026E 市销率 7.7x 给出 HK$26.7 目标价；该倍数选在两家主要上市纯标的之间——Symbotic 约 11x FY26E
              P/S、AutoStore 约 4.4x——并认为 Geek+ 增长更高，应相对 AutoStore 享受溢价。FY2026 收入共识约 RMB 4.19 billion（同比 +32.0%），对应非 GAAP
              远期 P/E 约 60x。买方共识宽度和目标价相对当前股价的溢价幅度值得注意；这确实反映了市场对收入增长和利润率拐点逻辑的信心。不过，HK$21.60–35.00
              的分析师目标价区间意味着，即便最悲观的公开分析师观点，也要求股价先上涨约 73% 才到共识底部——这说明共识本身偏乐观，计入的是持续执行，而不是硬底。
