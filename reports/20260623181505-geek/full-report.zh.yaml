      - number: '2.5'
        title: 采用约束、反向证据与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              仓储自动化市场并非没有结构性逆风。Interact Analysis 记录，2024 年仓储自动化收入较 2023 年下降
              3%，原因包括客户产能过剩、宏观收紧和项目延期——这是现代扩张周期中的首次收缩。美国仓库空置率在 2025 年 Q3 约 7.4%
              见顶，反映疫情时期履约空间过度建设，削弱了新增绿地自动化投资需求。供应商破产——最典型是 Attabotics——以及剥离（Zebra Technologies 的机器人部门）证明，2024-2025
              年调整是真实存在的，并非短期疲软。

              在前期 capex 之外，集成风险现在是主要采用障碍。SupplyChain360 和 Interact Analysis 都指出，旧 WMS/ERP
              兼容、运营切换规划和员工变革管理最难解决。低估集成复杂度的项目，第一年相对初始预测常出现约 22% 缺口，实际回本期被拉长。2023-2025 年高利率也抬高了自动化 CapEx 的门槛率，尽管进入 2026
              年的降息周期应能部分缓解。

              地缘政治风险是包括 Geek+ 在内、总部位于中国的供应商面临的独特约束。中美关税和潜在出口管制，会影响 Geek+ 约 75% 中国大陆以外收入。对中国供应链敏感的买方，即便 Geek+
              具备成本和技术优势，也可能偏好欧洲或美国 AMR 供应商。

              关键测算和采用尽调缺口包括：（a）缺少公开验证的货到人细分收入数字；（b）2026 年仓储自动化 TAM 的分析师估计差异显著（US$27-36bn），方法差异没有充分解释；（c）Geek+ 自身 SAM 和
              SOM 未正式披露或建模，因此精确计算可服务市场渗透率仍带有猜测。
