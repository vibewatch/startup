      - number: '8.3'
        title: 同业估值背景
        blocks:
          - type: paragraph
            body: >-
              仓库机器人和更广义自动化同业的估值倍数跨度很大，反映收入规模、增长率、盈利能力、收入结构（纯标的 vs. 综合集团）和上市地理位置差异。最可比的公开上市同业中，Symbotic（SYM.US）倍数最高——截至
              2026 年 6 月约 8.6x 滚动 P/S、市值 $23.2 billion——由其美国市场地位和 Walmart 合作收入可见度支撑。AutoStore（AUTO.OL）滚动 P/S 约 5.7x，市值
              $3.8 billion，PE 为 33.9x，已盈利但盈利不高。综合集团 KION Group（KGX.DE）和 Honeywell（HON.US）P/S 分别为 0.7x 和约
              3.2x，但仓库自动化只是各自子板块，因此压低了报告倍数。CMBI 2025 年 8 月首次覆盖把 Geek+ 以 7.7x 2026E P/S 对标在 Symbotic 和 AutoStore 之间，理由是
              Geek+ 增速明显更高，应相对 AutoStore 享受溢价。以 HK$12.50 当前价计，Geek+ 约以 5.4x FY2026E P/S 交易，位于 AutoStore / Symbotic
              区间内；但股票已从 IPO 时隐含约 9x FY26E P/S 去评级。轨迹很重要：如果 FY2026 收入按 +32% 兑现，利润率按预测扩张，当前 5.4x FY26E P/S
              在增长调整后可以解释。如果收入不及预期，或关税压缩美洲利润率，任何高于 3x 的倍数都会显贵。同业可比表给出完整列举，包括当前倍数和相关性说明；柱状图展示不同 P/S 倍数假设对隐含股价的敏感性。
