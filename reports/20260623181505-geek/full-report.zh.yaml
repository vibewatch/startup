      - number: '7.2'
        title: 地缘政治、贸易与监管风险
        blocks:
          - type: paragraph
            body: >-
              FY2025 约 75.3% 收入来自中国大陆以外，而美洲又是增长最快区域，签约订单同比 +50%；因此 Geek+ 财务表现高度敏感于美中以及更广泛国际贸易关系的状态。美国 Section 301
              对中国商品的关税（USTR 维护并更新四个产品清单）带来直接成本逆风：中国组装并出口的仓库自动化硬件在覆盖品类上最高面临 25% 关税，若 Geek+ 自行吸收会侵蚀毛利，若转嫁客户则形成竞争劣势。KPMG
              2026 Tariff Survey 确认，78% 美国企业报告关税推高 COGS，82% 报告海外销售下滑——这些动态直接影响西方企业买家评估 Geek+ 系统成本。关税之外，Bureau of
              Industry and Security Export Administration Regulations（EAR）要求美国实体在向中国总部公司或其关联方出口先进计算物项前取得 BIS 许可证；2026 年
              5 月，BIS 又把该指引明确扩展到在中国以外运营的 China-Group-D5 实体子公司。CFIUS 会审查中国实体对美国关键技术公司的任何收购或投资，也可能审查 Geek+ 在美国扩张或任何美国本土
              M&A。另行来看，WEF Global Risks Report 2026 把地缘经济对抗和国家间冲突列为全球短期首要风险，直接抬高 Geek+
              的原产国敞口。欧洲客户在大型采购决策中越来越多使用非价格标准，这给中国总部技术厂商制造声誉摩擦。表 TR002 呈现完整监管 / 法律风险登记表，按司法辖区、可能性、严重性、缓解措施和剩余敞口列示每个监管向量。
