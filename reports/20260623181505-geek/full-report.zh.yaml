          - type: paragraph
            body: >-
              Geek+ 提供两种商业交付模式：资本开支型系统销售，以及 Robotics-as-a-Service（RaaS）订阅，后者由公司保留硬件所有权并收取经常性费用。中期业绩（2025
              年上半年）提到，来自订阅式服务的订单超过新增订单的 90%，显示收入结构正转向经常性收入。绿地安装中，RoboShuttle V5 最快 48
              小时可部署；棕地集成采用模块化方法，可在不重新设计现有占地的情况下逐步加入 RAPS 配置。公司基于服装、医药、电子和 3PL 的客户部署，目标是资本开支模式在一到两年内回本。工作流表把五类代表性客户任务映射到
              Geek+ 方案，并列出已测得或声称的收益和限制。信任与安全方面，公司取得 TÜV 对机器人和工作站安全区的认证，信任 /
              合规表列出相关认证、标准和缺口。软件采用本地部署模式，公司将其定位为相较依赖云的竞争对手在数据安全上的优势。Interact Analysis
              研究显示，集成复杂度仍是自动化采用的首要障碍，运营团队也常把场地重新配置、WMS 连接和切换风险列为摩擦点——即便是 Geek+ 这样的模块化 AMR 方案也不例外。公司 48
              小时部署说法试图解决这一真实约束，但尚未在多样化遗留 WMS 环境中通过大规模独立验证。
