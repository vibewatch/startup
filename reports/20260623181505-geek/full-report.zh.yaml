      - number: '5.3'
        title: 具身智能——Geek+ Brain 与 Robot Arm Picking Station
        blocks:
          - type: paragraph
            body: >-
              2025–2026 年最重要的技术进展，是 Geek+ 从移动机器人调度转向具身智能。2025 年 8 月，公司发布 Geek+
              Brain，并称其为全球首个专为仓储场景设计的具身智能基座模型。该模型通过多任务视觉系统融合 2D 语义和 3D 几何感知，借助仿真增强的 3D
              预测补全被遮挡场景理解，并用基于强化学习的抓取策略，在毫秒级延迟下实时生成最优拣选计划。基于 Geek+ Brain 的主要商业产品是 Robot Arm Picking Station（RAPS）。RAPS
              采用六摄像头 Multi-Eyes Vision 阵列和零样本学习，也就是说，无需后训练即可识别并拣选大多数新 SKU 类型。公司声称拣选准确率 99.99%、吞吐量最高每小时 700
              件，且采用无模型即插即用设计，可在 48 小时内部署。RAPS 获得 The Robot Report 颁发的 2026 RBR50 Robotics Innovation
              Award，属于同行认可的第三方验证。批量拣选、订单拣选、合流和批量转大容器等多种工作流模式，让运营方可以按具体履约需求配置工作站。LogiMAT 2026 上，公司还发布由 Geek+ Brain
              驱动的通用人形机器人 Gino 1，可执行拣选、包装、箱体搬运和检查任务。路线图表追踪具身智能里程碑和即将推出的商业版本。关键尽调问题仍在于，99.99% 准确率和 700 UPH 在多变 SKU
              组合中能多大程度代表持续生产表现，而不是受控演示条件；这些指标的独立第三方审计证据有限。
