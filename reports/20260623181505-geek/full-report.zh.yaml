      - number: '8.6'
        title: 展示材料
        blocks:
          - type: callout
            title: 薄盈利上的 590x PE——主要估值风险
            body: >-
              在接近盈亏平衡的 IFRS 盈利上，滚动 PE 约 590x，且股价较 52 周高点下跌 63%；当前价格要求公司至少再经历两个年度报告期，持续交付 30%+ 收入增长、利润率扩张和 GAAP
              盈利，倍数才会压缩到历史上较合理的区间。
            calloutType: risk
            claimRefs:
              - CV005
              - CV008
              - CV037
          - type: callout
            title: 跟踪——估值拉伸，但仍是品类领导者
            body: >-
              Geek+ 是仓储履约机器人领域真正的收入龙头，盈利拐点也有可信迹象。当前价格下给出“跟踪”建议，核心是风险收益不对称：执行继续跑通，向上空间可观；一旦增长放缓或关税升级，3x P/S 的熊市情景会把股价压到
              HK$8–13。重新入场应等到 HK$15 或以下，或等 FY2026 中期报告确认 GAAP 盈亏平衡之后。
            calloutType: recommendation
