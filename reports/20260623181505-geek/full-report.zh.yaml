      - number: '2.4'
        title: 增长驱动与中国政策顺风
        blocks:
          - type: paragraph
            body: >-
              劳动力短缺是全球仓储自动化最主要且持续的需求驱动。Interact Analysis、Roland Berger
              和多家独立分析机构都将其描述为首要催化剂；随着发达经济体人口结构变化减少可用仓储工人，这一问题更加尖锐。电商订单量增长、消费者对次日达和当日达的预期、物流工资上升，共同让高吞吐运营商采用自动化的 ROI
              逻辑变得直观。

              ROI 已有案例支撑：Geek+ 在 YesAsia 的项目记录了 17 个月回本期（由 CMBI 分析验证），两年节省 US$10m，吞吐量提升
              150%。更广泛看，五个真实部署案例（电商、3PL、医药等）的仓储自动化研究均显示，在预计时间内实现正 ROI；不过由于集成爬坡，第一年实际效果通常比供应商预测低约 22%。

              中国政府政策对 Geek+ 尤其构成显著顺风。第十五个五年规划（2026-2030）将机器人和具身智能列为国家战略重点，并由 US$140bn 国家支持科技投资基金支撑。International
              Federation of Robotics 在 2026 年确认，中国已把 AI 驱动机器人作为国家工业战略核心。CSIS 记录显示，中国在全球工业机器人安装量中的份额从 2015 年约 20% 升至 2025
              年超过 50%；这一路径直接影响 Geek+ 的供应链成本基础和出口支持网络。

              Interact Analysis 对 2026 年初的判断是，利率下降、商业信心改善，以及主导 2025 年的关税冲击缓和，正在释放被压抑的自动化投资。尤其是美国仓储自动化支出预计将在 2026
              年增加；随着新建仓库吸收疫情时期库存积压，2027 年收入增长会更强。
