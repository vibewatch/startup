  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型、分部结构与地域拆分
        blocks:
          - type: paragraph
            body: >-
              Geek+ 几乎全部收入来自机器人解决方案销售——为仓储履约以及逐步缩小的工业物料运输设计、交付并调试的一体化硬件和软件系统。FY2025，仓储履约收入达到 RMB 3,020.7 million（占总收入
              95.3%），工业物料运输贡献 RMB 147.9 million（4.6%），小规模「其他」类别（租赁、RaaS、服务）贡献剩余 RMB 2.5 million。仓储履约收入占比从 FY2024 的 90.3%
              快速升至 FY2025 的 95.3%，既反映客户对货到人和箱到人解决方案需求提升，也体现公司有意压降低毛利工业运输；后者收入从 RMB 226.1m 降至 RMB
              147.9m。收入在交付并调试的系统获得客户验收时一次性确认；这是硬件销售模式，不是订阅 SaaS，因此收入质量带有执行交付风险和验收季节性集中。FY2025 新签订单 RMB 4,137 million（同比
              +31.7%），其中近 80% 来自中国大陆以外（同比 +40%），美洲增长超过 50%。订阅类订单——包括 RaaS、租赁和软件服务——同比增长 >90%，但基数很小。历史收入转化率（收入 / 订单额）在
              73% 到 80% 之间，意味着管线可见但并非确定。中国大陆以外收入达到 RMB 2,387.1 million（75.3%），毛利率 46.6%，显著高于 35.5% 的综合毛利率，反映 EMEA /
