      - number: '7.4'
        title: 竞争、运营与合作伙伴风险
        blocks:
          - type: paragraph
            body: >-
              仓库自动化 AMR 市场竞争越来越激烈，多重动态同时压缩 Geek+ 的定价权。Amazon Robotics 运营超过 500,000 台机器人的内部车队；由于 Amazon
              也向第三方提供物流服务，其内部自动化能力对 Geek+ 美国物流客户（DHL、UPS、XPO）构成结构性、封闭式替代威胁。与此同时，成本更低的中国对手——Hikrobot（Hikvision
              子公司）、Quicktron 和 Standard Robots——在 Geek+
              核心货到人板块积极打价格战。商品化风险很重要：技术成熟、硬件更标准化之后，护城河会收窄到软件和集成质量。运营风险又叠加竞争压力：SupplyChain360 记录，集成复杂度是仓库自动化部署的首要障碍，多系统
              ERP 和 WMS 集成会制造项目超支风险并触发客户流失。Geek+ 约 78% 的客户复购率意味着每年约 22% 流失——可控但后果不轻，因为订单票额很大。供应链风险也重要：Geek+
              机器人主要由中国采购的组件组装，任何供应链中断（无论来自先进半导体出口管制、物流扰动还是组件短缺）都会拖累生产时间表。KPMG 记录的回流趋势——26%
              美国组织已进入回流的正式规划或执行阶段——削弱了中国制造的长期竞争优势。表 TR003 和 TR004 分别提供运营 / 质量 / 安全以及合作伙伴 / 依赖风险登记表。
