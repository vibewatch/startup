      - number: '8.4'
        title: 牛、基准与熊情景分析
        blocks:
          - type: paragraph
            body: >-
              Geek+ 投资案例由三个情景杠杆驱动：（1）收入增长率（P/S 估值的核心驱动），（2）毛利率扩张速度（主要由海外结构推动，海外 GM 46.6% vs. 国内
              29.4%），以及（3）随着公司从接近盈亏平衡走向有意义的 GAAP 盈利，市场愿意支付的 P/S 倍数。牛市情景下，FY2026 收入达到 RMB 4.3–4.5
              billion（+35%+），反映美洲订单加速（2025 年同比 +50%）、EMEA 和亚太企业账户进一步渗透，以及 RaaS 订阅强劲增长。海外占比升至 78% 以上后，毛利率扩张到 38%+，公司实现
              GAAP 净利润 RMB 150–200 million，触发重估至 8x+ FY26E P/S。隐含股价：HK$35–45。基准情景下，收入按共识增长 30–32%，海外 GM 稳在约
              46–47%，调整后净利润增至 RMB 100–150 million。市场给予约 5x FY26E 收入的 P/S 倍数——与 CMBI 中周期估计一致——隐含股价约 HK$22–28。熊市情景下，收入增长降至
              20% 以下——可能来自美国关税扰动、Symbotic 或 AutoStore 的竞争性定价压力，或大型企业资本开支审批放缓——同时利润率停滞或压缩。市场把股票重估到 3x P/S，与 KION / Zebra
              综合集团区间一致。隐含股价：HK$8–13。valueinvesting.io 给出的基于 DCF 的内在价值（5 年增长退出模型 HK$7.72）锚定下行，是共识买方观点的反向参照。值得注意的是，同一来源的
              10 年 DCF 模型隐含约 HK$17.12，说明如果接受更长期增长逻辑，当前股价并非荒唐。
