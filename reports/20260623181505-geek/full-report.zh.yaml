      - number: '3.3'
        title: 规模、融资与商业定位
        blocks:
          - type: paragraph
            body: >-
              Geek+ IPO 前从 Warburg Pincus、GGV Capital、Intel Capital、Vertex Growth 和 CPE 等投资方获得累计约 US$960 million
              融资，覆盖约十二轮；随后在 2025 年 7 月香港 IPO 中募资约 US$281 million，外部资本合计约 US$1.24 billion——这是纯仓储 AMR 品类中公开披露的最大数字。Exotec
              在 2022 年 1 月 Series D 轮融资约 $335 million，估值超过 $2 billion。Locus Robotics 累计获得约 $413 million
              风险投资，但在未能完成后续融资后于 2024 年大规模重组，显示资本脆弱性。Symbotic（NASDAQ: SYM）是唯一收入规模可比的上市同业：FY2025 收入 $2.247 billion（同比
              +25.65%），TTM 收入 $2.52 billion，订单积压 $22.7 billion；但其 70 套已部署系统主要服务 Walmart 和 AWG，客户高度集中且以美国为中心。Symbotic 雇用约
              2,000 人，约为 Geek+ 1,054 人的两倍。Quicktron 背靠 KION Group、Cainiao（Alibaba）和 Saudi Aramco，称其在 20 多个国家为 1,000
              多家客户安装 42,000 多台 AMR；外部融资总额未公开披露。Hikrobot 是 Hikvision 全资子公司，受益于 Hikvision 的制造规模和分销，但未披露独立融资或收入。Geek+
              FY2025 美洲订单额同比增长超过 50%，是所有已披露地域中最快的，说明其在价格最高的企业市场竞争成功正在加速。定价和打包表比较各竞争对手已披露或推断的商业模式。
