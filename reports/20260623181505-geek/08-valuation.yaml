chapter:
  number: 8
  title: "Valuation"
  summary: >-
    As of 2026-06-23 Geek+ (2590.HK) trades at approximately HK$12.50 per share — a market
    capitalisation of roughly HK$16.72 billion — down ~63% from its 52-week high of HK$33.90,
    carrying a trailing P/E of ~590x on near-breakeven IFRS earnings. Fourteen sell-side analysts
    maintain a consensus Strong Buy with an average 12-month target of HK$33.07 (+165% upside),
    but a DCF-based intrinsic-value model places fair value as low as HK$7.72, and the CMBI
    initiation (BUY, TP HK$26.7) acknowledged that multiple compression from current HKEX IPO
    enthusiasm is a real risk. The recommendation is track: the business is a category leader at
    a stretched price, warranting re-entry only on a growth-confirmed P/S compression toward the
    AutoStore/Symbotic midpoint range.
sections:
  - id: ipo-and-market-snapshot
    title: "IPO Reference and Current Market Snapshot"
    body: >-
      Geek+ listed on HKEX (code 2590) on 9 July 2025 at a listing market capitalisation of
      approximately HK$22 billion (~US$2.7–2.8 billion), raising roughly HK$2.71 billion
      (~US$281 million) in the offering. The public tranche was oversubscribed 133 times and
      the international tranche 30 times, underscoring institutional and retail enthusiasm at
      listing. Cornerstone investors — Xiong'an Robot (US$41.3m), Arc Avenue (US$25m),
      Eastspring Investments (US$15m) and Yige/Zongteng (US$10m) — committed a combined
      US$91.3 million, providing a pricing signal and creating lock-up positions that represent
      a structural supply overhang post-expiry. As of 2026-06-23, the share trades at
      approximately HK$12.50, representing a 63% decline from the 52-week high of HK$33.90
      set on 9 October 2025 and a 12% premium to the 52-week low of HK$11.18 set on
      22 June 2026. The market capitalisation stands at approximately HK$16.72 billion
      (~US$2.14 billion) on approximately 1.34 billion shares outstanding. The trailing
      price-to-earnings ratio on near-breakeven IFRS earnings is approximately 590x; the
      price-to-sales multiple on TTM revenue is approximately 4.4x; and the enterprise-value-
      to-revenue ratio is approximately 3.4x. These metrics reflect the tension at the heart
      of the investment case: Geek+ is a genuine category leader with 31.6% revenue growth,
      a positive non-IFRS profit inflection and a strengthened balance sheet, yet it trades
      at multiples that price in sustained premium execution for many years and leave limited
      margin for error. The valuation range figure sets out the bull/base/bear share-price
      range under different scenario assumptions, anchored by analyst consensus on the upside
      and DCF-based intrinsic-value estimates on the downside.
