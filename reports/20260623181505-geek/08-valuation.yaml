  - id: scenario-analysis
    title: "Bull, Base and Bear Scenario Analysis"
    body: >-
      The investment case for Geek+ is driven by three scenario levers: (1) the revenue growth
      rate (the core driver of the P/S-based valuation), (2) the pace of gross-margin expansion
      (principally driven by the overseas mix at 46.6% GM vs. 29.4% domestic), and (3) the
      P/S multiple the market is willing to pay as the company progresses from near-breakeven
      toward meaningful GAAP profitability.
      In the bull scenario, FY2026 revenues come in at RMB 4.3–4.5 billion (+35%+), reflecting
      accelerating Americas orders (which grew +50% YoY in 2025), further penetration of EMEA
      and Asia-Pacific enterprise accounts, and strong RaaS subscription growth. Gross margins
      expand toward 38%+ as overseas mix rises above 78%, and the company achieves GAAP net
      income of RMB 150–200 million, triggering a re-rating to 8x+ FY26E P/S. Implied share
      price: HK$35–45. In the base scenario, revenues grow 30–32% in line with consensus,
      overseas GM holds at approximately 46–47%, and adjusted net profit builds to RMB 100–150
      million. The market awards a P/S multiple of approximately 5x FY26E revenue — consistent
      with the CMBI mid-cycle estimate — implying a share price of approximately HK$22–28.
      In the bear scenario, revenue growth slows below 20% — whether from US tariff disruption,
      competitive pricing pressure from Symbotic or AutoStore, or a slowdown in large enterprise
      capital-expenditure approvals — while margins stagnate or compress. The market re-rates
      the stock to 3x P/S, consistent with the KION/Zebra conglomerate range. Implied share
      price: HK$8–13. The DCF-based intrinsic value from valueinvesting.io (HK$7.72 on the 5-year
      growth-exit model) anchors the downside and serves as the adverse counterpoint to the
      consensus buy-side view. Notably, the 10-year DCF model from the same source implies
      approximately HK$17.12, suggesting the stock is not absurdly priced if one accepts
      the longer-dated growth thesis.
