callouts:
  - calloutType: strength
    title: "Deep enterprise penetration with documented multi-site land-and-expand"
    body: >-
      Geek+'s ~950 customer base includes 80+ Fortune Global 500 accounts and exhibits a documented
      pattern of multi-site expansion — Decathlon (China to three European DCs), YesAsia (Goodman to
      Mapletree) — supporting the ~78% repurchase rate claim with concrete proof points. Subscription
      orders growing >90% YoY signal a mix shift toward recurring revenue that could eventually support
      an NRR-style retention metric.
    claimRefs: [CU001, CU002, CU003, CU009, CU013, CU014, CU030]
  - calloutType: risk
    title: "High customer concentration and documented competitor inroads at flagship account"
    body: >-
      Top-5 customers contributed 42.1% of FY2024 revenue with the single largest at 15.5%, creating
      project-lump risk. Exotec's March 2026 seven-site Skyfleet programme for Decathlon shows that
      the company's most-cited reference account is now dual-sourcing European automation — a direct
      competitive displacement risk for Geek+'s European pipeline.
    claimRefs: [CU016, CU017, CU021, CU022]
  - calloutType: assumption
    title: "Repurchase rate is project-based, not NRR — meaningful but not directly comparable to SaaS peers"
    body: >-
      Geek+'s ~78% repurchase metric counts whether a customer has placed at least one follow-on order,
      not what percentage of revenue renews annually. Without a disclosed NRR or GRR, durability of
      the revenue base versus SaaS or RaaS-native competitors cannot be directly compared.
    claimRefs: [CU003, CU036]
