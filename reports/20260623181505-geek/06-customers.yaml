  - id: FU001
    title: "Customer Adoption Journey Map"
    type: journey-map
    layout: standard
    summary: "Stages a Geek+ enterprise customer traverses from initial contact through multi-site expansion and subscription deepening."
    data:
      nodes:
        - { id: "awareness", label: "Awareness", detail: "Labour shortage or e-commerce growth triggers automation evaluation", phase: "pre-sale" }
        - { id: "pilot", label: "Pilot / PoC", detail: "Single-site pilot with limited robot count; ROI modelling", phase: "pre-sale" }
        - { id: "first-deploy", label: "First Production Deployment", detail: "Full-site AMR deployment; integration with WMS/WES; go-live", phase: "deployment" }
        - { id: "expand-site", label: "Site Expansion", detail: "Scale robot count at existing site or add new site (e.g. YesAsia: Goodman → Mapletree)", phase: "expansion" }
        - { id: "multi-geography", label: "Multi-Geography Rollout", detail: "Cross-border expansion (e.g. Decathlon: China → Europe DCs)", phase: "expansion" }
        - { id: "subscription", label: "Subscription / RaaS Deepening", detail: "IOP data platform, maintenance SLA, RaaS add-ons; recurring revenue", phase: "retention" }
        - { id: "strategic-account", label: "Strategic Account Status", detail: "Key-account (84% repurchase); co-innovation partner; RAPS/Geek+ Brain upgrades", phase: "retention" }
    approximationNotes: "Journey is illustrative and synthesised from documented customer trajectories (YesAsia, Decathlon). Not all customers follow the same path or reach all stages."
