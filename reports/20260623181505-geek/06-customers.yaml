runDate: "2026-06-23"
company:
  name: "Geek+"
chapter:
  number: 6
  title: "Customers"
  summary: >-
    Geek+ serves approximately 950 end customers in 40+ countries as of year-end 2025, including
    over 80 Fortune Global 500 accounts, with a ~78% overall repurchase rate and ~84% key-account
    repurchase rate. Named deployments include Decathlon (Europe DCs in France, Poland, Italy and
    multi-site China), Nike Japan (200+ robots), UPS Supply Chain Solutions, YesAsia (161 then 240
    AMRs, 17-month payback), Walmart, Toyota, DHL, Kuehne+Nagel and STL/Med24. A material concentration
    risk persists — the top-5 customers contributed 42.1% of FY2024 revenue and the single largest
    15.5% — while Exotec has announced a competing 7-site European automation programme for Decathlon.
sections:
  - id: customer-base-scale
    title: "Customer Base Scale and Composition"
    body: >-
      As of December 31, 2025, Geek+ reported approximately 950 end customers worldwide, up from
      approximately 806 in mid-2024 and 800+ disclosed at the July 2025 IPO, reflecting the addition
      of more than 60 new net accounts in the second half of 2025. Of that base, more than 80 are
      Fortune Global 500 companies, confirming the company's penetration at the enterprise tier. The
      overall customer repurchase rate of approximately 78% as of FY2025, and above 80% for H1 2025,
      reflects a project-based repurchase definition: customers that have signed at least one follow-on
      order. Among key accounts — the company's term for top-tier strategic relationships — the repurchase
      rate was 84.3% in 2024, suggesting stronger stickiness in the most commercially significant cohort.
      Revenue outside Mainland China reached 75.3% of total FY2025 revenue at a 46.6% gross margin,
      versus 79.5% in H1 2025, showing that international customers already dominate the revenue base.
      Americas new signed orders grew more than 50% year-on-year in 2025, led by the United States,
      while total new orders reached RMB 4,137 million (+31.7% YoY), with orders from outside China
      accounting for nearly 80% and growing at nearly 40% YoY. Subscription-based service orders grew
      more than 90% YoY in 2025, signalling a gradual mix shift toward recurring revenue from the
      installed base. The company has shipped over 72,000 robots cumulatively to 40+ countries and
      regions, and its systems have collectively fulfilled more than 10 billion orders, according to
      robotics.press tracking of vendor reporting. Geek+ has ranked #1 in global AMR market share for
      seven consecutive years per Interact Analysis, and its Shelf-to-Person sub-segment share reached
      48.5% in 2025.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU006, CU007, CU008, CU024, CU025, CU030, CU031, CU032]
    tableRefs: [TU001, TU002]
    figureRefs: [FU004]
  - id: named-deployments
    title: "Named Customer Deployments and Case Studies"
    body: >-
      The most extensively documented deployment is Decathlon, the world's largest sporting-goods
      retailer. Geek+ and Decathlon began collaborating in 2018 in Shanghai, where a first goods-to-person
      deployment tripled labour productivity, increased storage capacity by 40% and delivered ROI in
      under three years, according to an Interact Analysis white paper co-authored with Decathlon and
      Geek+ and cited in mfgrobots.com trade reporting. By early 2022 Geek+ had extended the partnership
      to Europe, deploying hundreds of P-series picking robots and RoboShuttle totes at three European
      distribution centres — in Castelnau (France), Łódź (Poland) and Campania (Italy) — announced in
      January 2022. Separately, and potentially competitively, Exotec announced in March 2026 that it is
      deploying a seven-site "Skyfleet" multi-site automation programme for Decathlon across five European
      countries (France, UK, Portugal, Italy, Germany), indicating that Decathlon is diversifying its
      European automation partnerships rather than consolidating exclusively with Geek+. Nike Japan deployed
      200+ Geek+ P-series robots for same-day delivery operations, making it one of the company's flagship
      sports-apparel references. UPS Supply Chain Solutions operates Geek+ shelf-to-person robots, as
      documented with a named photo in The Wire China profile. YesAsia Holdings (HKEX: 2209), a Hong
      Kong e-commerce operator, deployed 161 Geek+ AMRs at the Goodman Warehouse in Tsing Yi in October
      2022 for US$5.9 million and achieved payback in 17 months, saving approximately US$10 million over
      two years and boosting daily throughput by 150% with 99.99% order accuracy. YesAsia contracted a
      second deployment of 240 AMRs plus 930 intelligent racks at the Mapletree Logistics Hub (May 2025)
      — the largest single AMR deployment in Hong Kong's e-commerce sector. The Tmall (Alibaba) deployment
      in Tianjin (approximately 50 robots, ~2016) is confirmed as the company's first commercial customer.
      Additional named accounts confirmed across multiple sources include Walmart, Toyota (plant deployments),
      DHL, Kuehne+Nagel, XPO, H&M, Tommy Hilfiger, Inditex/Zara and Adidas. At LogiMAT 2026 (Stuttgart,
      March 2026) Geek+ highlighted its STL partnership expanding into Germany and a Nordic pharmacy
      expansion (Med24 Phase 2) as recent production deployments. The Yamada Denki (Japanese electronics
      retailer) deployment is treated as historical or unconfirmed as of the runDate; no 2026 public
      announcement has been found to confirm an active deployment.
    claimRefs: [CU009, CU010, CU011, CU012, CU013, CU014, CU015, CU019, CU020, CU021, CU022, CU026, CU027, CU037, CU039]
    tableRefs: [TU003]
    figureRefs: [FU001, FU002]
  - id: verticals-and-geography
    title: "Customer Segments, Verticals and Geographic Mix"
    body: >-
      Geek+'s customer base spans seven primary verticals: e-commerce (large-SKU, high-volume
      fulfilment), FMCG/grocery (supermarket replenishment and chilled supply chains), apparel and
      fashion (multi-SKU mixed storage including footwear, folded garments, hanging items), 3PL
      (multi-client, multi-site, shifting demand), manufacturing/industrial (intralogistics, WIP,
      assembly feeding), automotive (parts sequencing, kitting, aftermarket distribution) and pharma
      and healthcare (temperature-controlled and high-accuracy dispensing). Per the CMBI analyst
      initiation report citing China Insights Consultancy (CIC) data, Geek+ ranks first among global
      AMR solution providers by revenue in the e-commerce, FMCG and 3PL verticals as of 2024.
      Geographically, approximately 75.3% of FY2025 revenue derived from countries and regions outside
      Mainland China (up from 72% in FY2024), with EMEA, the Americas and APAC all showing growth.
      The Americas signed-orders growth of more than 50% YoY in 2025 is the fastest reported regional
      expansion, driven by US customers facing labour shortages, rising e-commerce volumes and cost
      pressures. EMEA deployments span the UK, France, Germany, Italy, Poland, Portugal, the Netherlands
      and the Nordics, evidenced by named customer press releases and trade show showcases at LogiMAT
      2026. Asia-Pacific remains significant through both legacy China and growing international markets
      including Japan, South Korea, Singapore and Australia. The official apparel industry page confirms
      that leading retailers including George.com and Bosideng have deployed the system for returns
      management, and STL (UK) is now expanding Geek+ footprint into the German textile logistics market.
      The pharma vertical is evidenced by the Dr. Max Romania deployment (25,000+ monthly SKUs, 350%
      efficiency gain) and the Med24 Nordic pharmacy expansion, both cited by robotics.press.
    claimRefs: [CU005, CU006, CU007, CU023, CU028, CU029, CU033, CU034, CU038]
  - id: retention-and-repurchase
    title: "Retention, Repurchase and Expansion Dynamics"
    body: >-
      Geek+ discloses a project-based customer repurchase rate as its primary retention metric rather
      than an annualised NRR or GRR figure standard in SaaS businesses, reflecting the project-delivery
      nature of the AMR deployment model. The FY2025 annual report states approximately 78% overall
      repurchase rate, and the H1 2025 / LogiMAT 2026 announcement states greater than 80%. The CMBI
      analyst initiation (August 2025) citing company data provides more granularity: the 2024 all-customer
      repurchase rate was 74.6% while the key-account repurchase rate was 84.3%, indicating that the
      most strategically important relationships are materially stickier than the tail of the customer
      base. The YesAsia case is the most quantitatively detailed land-and-expand example: the October 2022
      Goodman Warehouse deployment (161 AMRs, US$5.9 million) achieved payback in 17 months and led
      directly to a second contract at Mapletree (240 AMRs, May 2025). Decathlon's progression from its
      first Shanghai warehouse in 2018 through additional China sites and then three European DCs in 2022
      is the most geographically expansive multi-site expansion pattern. Subscription-based service orders
      grew more than 90% YoY in 2025, including recurring maintenance, RaaS arrangements and the IOP
      data intelligence platform, which signals a gradual shift toward recurring revenue streams that
      would eventually allow a more traditional retention metric. The largest single order in H1 2025
      exceeded RMB 100 million, and multiple such orders were secured in 2025 from emerging markets
      including Latin America and Eastern Europe. The disclosed NRR and GRR figures are absent from
      public reporting; this is a material evidence gap for investors seeking comparability with
      software or RaaS-first peers.
    claimRefs: [CU003, CU004, CU013, CU014, CU015, CU019, CU030, CU031, CU035, CU036]
    tableRefs: [TU004]
    figureRefs: [FU003]
  - id: concentration-risk-adverse
    title: "Customer Concentration Risk and Competitive Pressure"
    body: >-
      A material customer concentration risk is clearly documented in the CMBI analyst report citing
      company data: in FY2022, FY2023 and FY2024, revenue from the top-five largest customers accounted
      for 30.8%, 45.3% and 42.1% of total revenue respectively, while the single largest customer
      contributed 9.3%, 15.4% and 15.5% of total revenue. The high-water mark concentration of 2023
      (45.3% from five customers) reflects a project-lumpy revenue model where single large contracts
      can dominate a given year's recognised revenue. Geekplus JP — a Japanese company in which Geek+
      holds approximately 39.6% equity — operated as a channel partner and contributed 7.3% of total
      FY2024 revenue, making it both a top-five customer and a related party whose re-engagement is
      commercially sensitive. FY2025 concentration data is not yet itemised in public filings; the
      improvement in customer count from ~806 to ~950 and the expansion of the Americas pipeline
      suggests some diversification, but the risk has not been eliminated. Competitive displacement is
      a documented risk: Exotec's March 2026 announcement of a seven-site Skyfleet programme for
      Decathlon covering France, UK, Portugal, Italy and Germany indicates that Decathlon — one of
      Geek+'s most cited reference accounts — is expanding its European automation footprint with a
      rival supplier rather than consolidating exclusively with Geek+. The original Geek+ Decathlon
      European deployment covered only three countries (France, Poland, Italy); Exotec's programme
      covers five and involves additional inbound and outbound automation integration. US-China tariff
      risk is a further customer-side concern: if US customers face procurement friction or supply-chain
      security certification requirements for Chinese-origin robotics hardware, large US orders could be
      delayed, cancelled or lost to domestic suppliers such as Symbotic or Locus Robotics, as flagged
      by KPMG's 2026 tariff survey showing 44% of US firms investing in automation partly to reshore.
    claimRefs: [CU016, CU017, CU018, CU021, CU022]
    tableRefs: [TU005]
