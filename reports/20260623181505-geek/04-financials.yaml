callouts:
  - calloutType: strength
    title: "Profitable inflection — first adj. net profit and positive operating cash flow"
    body: >-
      FY2025 produced the first adjusted net profit (RMB 43.8m) and first H1 positive adjusted EBITDA
      (+RMB 11.62m), supported by real gross-margin expansion (+70 bps to 35.5%) and SG&A leverage.
      Operating cash flow swung from −RMB 108.1m to +RMB 85.7m, confirming quality of the profit turn.
    claimRefs: [CI012, CI015, CI024]
  - calloutType: risk
    title: "Thin IFRS profitability, lofty multiple, and tariff exposure"
    body: >-
      The IFRS net loss remains (RMB 10.4m) and EBITDA is still negative (−RMB 47.5m). The trailing
      PE of ~590x reflects near-zero IFRS earnings and the stock has declined ~two-thirds from its 52-week
      high. US-China tariffs raise cost-of-goods risk for this China-based hardware exporter earning 75% of
      revenue offshore; KPMG's 2026 survey finds 78% of manufacturers report higher COGS under current tariffs.
    claimRefs: [CI035, CI036, CI037, CI038]
  - calloutType: insight
    title: "FY2026 profit scale-up: CMBI models RMB 400m+ adjusted profit at 9%+ margin"
    body: >-
      CMBI projects FY2026E revenue of RMB 4,316m (+36%) and adjusted net profit of ~RMB 401.6m (~9% margin)
      driven by continued gross-margin expansion (38% est.) and SG&A leverage. The order book of RMB 4,137m
      (FY2025 new orders, 73-80% conversion historically) underpins near-term revenue visibility.
    claimRefs: [CI014, CI017, CI007]
