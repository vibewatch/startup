runDate: "2026-06-23"
company:
  name: "Geek+"
chapter:
  number: 4
  title: "Financials"
  summary: >-
    Geek+ (2590.HK) delivered FY2025 revenue of RMB 3,171.0 million (+31.6% YoY), a group gross margin
    of 35.5%, and a first-ever adjusted net profit of RMB 43.8 million (vs. adj. loss RMB 92.2m in FY2024).
    The IFRS net loss narrowed sharply to RMB 10.4 million (from RMB 831.5m), as one-off redemption-liability
    changes ceased post-IPO. The IPO-strengthened balance sheet carries RMB 3,115.8 million in net current
    assets, a 2.4x current ratio, and RMB 357.9 million in borrowings. Operating cash swung to +RMB 85.7m.
    Overseas markets (75.3% of revenue) earn a 46.6% gross margin versus a lower domestic rate, driving
    the margin mix. H1 2025 adjusted EBITDA turned positive (+RMB 11.62m) for the first time. CMBI forecasts
    RMB 4,316m revenue (+36%) and RMB 400m adjusted net profit in FY2026E at 9%+ margin. Diligence risks
    include thin IFRS earnings, a ~590x trailing PE, US-China tariff exposure and customer concentration
    (top-5 customers: ~42% of revenue in FY2024).
sections:
  - id: revenue-model-and-segment-mix
    title: "Revenue Model, Segment Mix and Geographic Split"
    body: >-
      Geek+ generates substantially all revenue from the sale of robotics solutions — integrated hardware
      and software systems designed, delivered and commissioned for warehouse fulfilment and, to a diminishing
      degree, industrial material transport. In FY2025, warehouse-fulfilment revenue reached RMB 3,020.7 million
      (95.3% of total), while industrial material transport contributed RMB 147.9 million (4.6%), and a
      small "others" category (leasing, RaaS, services) accounted for the residual RMB 2.5 million. The sharp
      rise in warehouse-fulfilment share from 90.3% in FY2024 to 95.3% in FY2025 reflects both higher customer
      demand for goods-to-person and tote-to-person solutions and a deliberate phase-down of lower-margin
      industrial transport, whose revenue fell from RMB 226.1m to RMB 147.9m. Revenue is recognised at a point
      in time upon customer acceptance of the delivered and commissioned system; this is a hardware-sale model,
      not subscription SaaS, so revenue quality carries execution-delivery risk and seasonal concentration of
      acceptances. FY2025 new signed orders were RMB 4,137 million (+31.7% YoY), of which nearly 80% came
      from outside Chinese Mainland (+40% YoY) and Americas growth exceeded 50%. Subscription-based orders
      — encompassing RaaS, leasing and software services — grew >90% YoY though from a tiny base. Historically,
      revenue conversion ratios (revenue/order intake) have ranged from 73% to 80%, implying a visible but
      not guaranteed pipeline. Revenue outside Chinese Mainland reached RMB 2,387.1 million (75.3%) at a
      46.6% gross margin, significantly above the consolidated 35.5%, reflecting greater software content in
      EMEA/Americas projects and the absence of intense local-market price pressure that exists domestically.
      The pricing model is bespoke-system quotation for large integrations; standardised SKU-based pricing
      is emerging (PopPick Lite, FleetSort) to support channel partners, but disclosed list prices are not
      publicly available.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006, CI007, CI008]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: income-statement-and-profitability
    title: "Income Statement Summary and Profitability Path"
    body: >-
      The FY2025 income statement shows the first meaningful inflection in Geek+'s operating economics.
      Revenue of RMB 3,171.0 million and gross profit of RMB 1,125.0 million (+34.4%) produced a 35.5%
      gross margin, up 70 basis points from 34.8% in FY2024. Cost of sales was RMB 2,046.0 million, comprising
      predominantly hardware costs (robots, workstations, shelving), with write-downs of inventory of
      RMB 39.5 million (FY2024: RMB 41.5m), signalling normalising inventory quality. Below the gross profit
      line, opex amounted to RMB 1,143.6 million, with the three key components being: R&D (RMB 335.1m,
      10.6% of revenue), selling and marketing (RMB 538.5m, 17.0%), and administrative (RMB 270.6m, 8.5%).
      R&D intensity has fallen from ~30% of revenue in FY2022 to 10.6% in FY2025 as the portfolio
      standardises around warehouse solutions; CMBI expects this to remain ~10-11% in FY2026E, reflecting
      the embodied-intelligence R&D investment. The operating loss narrowed to RMB 28.8 million (from
      RMB 127.6m), and the IFRS net loss to RMB 10.4 million (from RMB 831.5m, which included RMB 685.8m
      of non-cash redemption-liability adjustments). Adjusted net profit (non-IFRS) of RMB 43.8 million
      was derived by adding back share-based compensation (RMB 42.1m), listing expenses (RMB 33.3m), and
      removing the redemption-liability benefit (−RMB 21.2m). CMBI projects FY2026E revenue of RMB 4,316m
      (+36%), gross margin of 38%, and adjusted net profit of approximately RMB 401.6m, implying ~9%+ margin
      — the first commercially meaningful profit year. StockAnalysis shows four-year EBITDA trending from
      −RMB 797.6m (FY2022) to −RMB 84.6m (FY2024) to −RMB 47.5m (FY2025), consistent with the operating
      leverage narrative but confirming the company has not yet reached IFRS-EBITDA breakeven.
    claimRefs: [CI009, CI010, CI011, CI012, CI013, CI014, CI015, CI016, CI017]
    tableRefs: [TI003, TI004]
    figureRefs: [FI002]
  - id: balance-sheet-liquidity-capital
    title: "Balance Sheet, Liquidity, and Capital Adequacy"
    body: >-
      The July 2025 HKEX IPO transformed Geek+'s balance sheet from technically insolvent (total equity of
      −RMB 6,248.8 million at end-2024, driven by RMB 7.0 billion in redemption liabilities from preference
      share arrangements with pre-IPO investors) to robustly capitalised. At 31 December 2025, total equity
      stood at RMB 3,407.7 million and net current assets were RMB 3,115.8 million. Cash and cash equivalents
      were RMB 2,974.8 million and time deposits RMB 180.6 million, together RMB 3,155.4 million (plus
      restricted cash of RMB 137.4m). Total borrowings were RMB 357.9 million — all bank loans denominated
      in RMB at fixed interest rates — down from RMB 413.9m at end-2024. The adjusted current ratio is 2.4x
      (vs. 0.3x pre-IPO on a comparable basis) and the gearing ratio (total liabilities/total assets) fell
      to 40.4% from 295.0% (or 75% excluding redemption liabilities). No assets were pledged and there are
      no off-balance-sheet arrangements. Inventories fell from RMB 1,029.5m to RMB 803.2m, improving
      working-capital efficiency; trade receivables rose from RMB 713.6m to RMB 958.2m, partly reflecting
      rapid H2 revenue acceleration. Impairment losses on receivables increased to RMB 35.4m (from RMB 15.2m)
      because of growth and seasonal order concentration, which merits monitoring. Net cash from investing
      was −RMB 156.0m (capex and equipment); financing provided +RMB 2,437.1m (IPO proceeds dominant).
      The company states no planned material capital investments beyond those disclosed in the IPO prospectus.
      At the current scale of business, management does not face a near-term liquidity crisis: operating cash
      flow is now positive and the cash pile provides 8+ months of total annual revenue as a buffer. However,
      the R&D acceleration for Gino1 humanoid and Geek+ Brain could increase capex if commercialisation
      timelines lengthen.
    claimRefs: [CI018, CI019, CI020, CI021, CI022, CI023, CI024, CI025]
    tableRefs: [TI005, TI006]
    figureRefs: [FI003]
  - id: unit-economics-and-cost-structure
    title: "Unit Economics, Cost Structure and Operating Leverage"
    body: >-
      Geek+'s unit economics are partially observable from public filings. The CMBI case study of YesAsia
      (a direct Geek+ customer, HKEx 2209) demonstrates a real-world payback of approximately 17 months, with
      labour-cost ratios falling ~1.8 percentage points and daily throughput rising 150% after two years.
      This implies a mid-sized AMR deployment pays back in roughly one to two years, which is consistent with
      the ~78% customer repurchase rate — a strong signal that realised customer ROI clears hurdle rates for
      expansion orders. On the supply side, cost of sales for robotics solutions (RMB 2,003.3m in FY2025)
      covers robot structure parts, motors, drive wheels, controllers, and batteries; Geek+ sources key
      sub-components from China's mature electronics and mechanical supply chain, with the top-5 suppliers
      representing only 17.5% of total purchases (FY2024), limiting single-vendor concentration risk. Labour
      is the other major cost category: the FY2025 total remuneration charge was RMB 733.3m (23.1% of revenue),
      up from RMB 624.4m, reflecting the 1,054-strong headcount and equity-settled incentives (RMB 42.1m
      non-cash SBC). Revenue per head (RMB 3,171m / 1,054 = ~RMB 3.01m/employee) is high for a hardware
      company, indicating capital-efficient operations. CAC and sales-cycle duration are not disclosed; the
      CMBI report documents a 6-8 week manufacturing + 6-8 week shipping + 1-3 month deployment timeline,
      suggesting a 4-6 month minimum elapsed time from order to revenue recognition. The selling and
      marketing expense ratio fell from 31.4% (FY2022) to 17.0% (FY2025), consistent with improving
      channel maturity and the benefit of anchor key accounts driving repeat orders (top-5 customers ~42%
      of revenue in FY2024). The direct sales / channel mix was approximately 67% direct and 33% channel
      in FY2024. Customer concentration remains a diligence concern: the single largest customer contributed
      15.5% of total FY2024 revenue; Geek+ JP, an associated entity, was one of the top-5 customers and
      contributed 7.3% in FY2024. Without named customers in annual filings, the sustainability of key-account
      repurchases is hard to independently verify.
    claimRefs: [CI026, CI027, CI028, CI029, CI030, CI031, CI032, CI033, CI034]
    tableRefs: [TI007]
  - id: financial-verdict-and-gaps
    title: "Financial Verdict, Revenue Quality, and Diligence Blockers"
    body: >-
      Geek+'s financial profile in FY2025 is that of a hardware-led systems integrator in early but credible
      profitability transition. Revenue growth of 31.6% is well above sector peers such as AutoStore (declining)
      and broadly comparable with Symbotic; the gross margin of 35.5% is respectable for hardware-intensive
      AMR solutions. The conversion to adjusted net profit is genuine in that it reflects real operational
      improvement (economies of scale, lower inventory write-downs, improved SG&A ratios), not one-time gains.
      However, several issues give rise to caution. First, the IFRS net loss (RMB 10.4m) and negative EBITDA
      (−RMB 47.5m) confirm the company is not yet fully profitable on any standardised basis; the 590x trailing
      PE reported by Yahoo Finance and Morningstar reflects very thin reported earnings, and StockAnalysis's
      historical data shows free cash flow of −RMB 44.4m in FY2025. Second, revenue quality carries one-off
      risk: the system-sale model concentrates acceptances in Q4, the order-to-revenue conversion ratio of
      73-80% is variable, and receivables impairments rose sharply. Third, US-China trade tariffs represent
      a meaningful cost and demand risk. The 2026 KPMG Tariff Survey finds 78% of organisations report higher
      cost of goods sold under current tariffs, and 51% report margin declines; Geek+ as a China-based hardware
      exporter earning 75.3% of revenue offshore is structurally exposed. Management has cited no hedging
      programme beyond "risk-neutral" treasury management. Fourth, subscription/RaaS revenue is below 1% of
      total revenue (RMB 2.5m "others" in FY2025); the claimed >90% growth in subscription orders is from a
      negligible base and is not yet economically material. The financial verdict is: revenue trajectory and
      gross profit are directionally strong; the profitability path to FY2026E is credible if gross margins
      hold and opex leverage continues; but the current valuation (~4.4x P/S, ~590x PE) leaves little margin
      for execution misses, and CMBI's BUY rating at HK$26.7 target is not an adverse signal but implies the
      stock has already declined ~50% from IPO levels.
    claimRefs: [CI035, CI036, CI037, CI038, CI039, CI040, CI041, CI042]
    tableRefs: [TI008]
