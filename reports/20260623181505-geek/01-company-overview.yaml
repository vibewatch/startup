company:
  name: "Geek+"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Geek+ (Beijing Geekplus Technology Co., Ltd.) is the world's largest warehouse-fulfillment robotics vendor by revenue, founded in Beijing in 2015 by CEO Yong Zheng and listed on the Hong Kong Stock Exchange (2590.HK) on 9 July 2025. FY2025 revenue reached RMB3,171.0 million (+31.6% YoY) with a near-break-even net loss of RMB10.4 million, against a post-IPO share-price decline of roughly two-thirds from its 52-week high."
sections:
  - id: identity-and-model
    title: "Identity, Headquarters and Business Model"
    body: >-
      Geek+ is the trading brand of Beijing Geekplus Technology Co., Ltd. (北京極智嘉科技股份有限公司),
      an intelligent-logistics robotics company founded in Beijing in 2015 and headquartered there today,
      with regional offices spanning Tokyo, the United States, the United Kingdom, Germany and Singapore.
      The company designs, sells and services autonomous mobile robots (AMRs) for warehouse fulfilment,
      covering goods-to-person picking, tote-to-person shuttles, sorting, and pallet handling, plus a
      software stack (the Hyper+ core algorithm platform and Robot Matrix) and an embodied-intelligence
      base model branded Geek+ Brain. Its commercial model blends one-off system sales with subscription
      and Robotics-as-a-Service (RaaS) arrangements, and the business derives the overwhelming majority of
      revenue from warehouse-fulfilment solutions sold to global retailers, third-party logistics providers,
      apparel brands, grocers and manufacturers. On 9 July 2025 Geek+ became the first pure-play AMR
      warehouse-robotics company to go public, listing on the Hong Kong Stock Exchange under stock code
      2590, which moved it from a venture-backed private firm into a disclosed public company. This chapter
      establishes the identity, leadership, capital base, scale and milestone chronology that later chapters
      reuse as ground truth.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO031, CO033]
    figureRefs: [FO002]
  - id: leadership-governance
    title: "Founders, Leadership and Governance"
    body: >-
      Geek+ was founded by Yong Zheng (郑勇), who remains chairman and chief executive. Zheng is a Tsinghua
      University graduate who worked at ABB and Saint-Gobain in Europe before founding the company in 2015,
      after observing that warehouse automation lagged factory automation. According to The Wire China,
      citing corporate records, Zheng held roughly a 7.3% economic stake through two Tianjin limited
      partnerships ahead of the listing, and the company lists a co-founder leadership bench including a
      chief technology officer and vice-presidents for systems and robot research and development, alongside
      a chief financial officer. The company operates under a weighted-voting-rights (WVR) structure typical
      of Hong Kong technology listings, which concentrates control with the founder and is a recognised
      governance consideration for minority investors. Key-person dependence on the founder is material:
      the strategic pivot to embodied intelligence, the global expansion cadence and investor confidence are
      all closely tied to Zheng. The leadership table enumerates the disclosed executive bench, their
      functional coverage and the associated key-person and governance diligence asks for later chapters.
    claimRefs: [CO006, CO007, CO008, CO009, CO010, CO011]
    tableRefs: [TO002]
  - id: funding-and-capital
    title: "Funding History, Valuation and Capital Base"
    body: >-
      Before listing, Geek+ raised capital across roughly a dozen private rounds from investors including
      Warburg Pincus, GGV Capital, Intel Capital, Vertex Growth and CPE, with a 2022 round valuing the
      company above US$2 billion. Cumulative investment into the company was reported at approximately
      US$960 million by mid-2025. On 9 July 2025 the company completed its Hong Kong IPO, raising roughly
      HK$2.71 billion (about US$281 million) at a listing market capitalisation in the region of HK$22 billion
      (about US$2.7-2.8 billion). The offering was heavily oversubscribed — the public tranche by about 133x
      and the international tranche by about 30x — and was anchored by cornerstone investors including
      Xiong'an Robot, Arc Avenue, Eastspring Investments and Yige (Zongteng Group). Latham & Watkins acted as
      legal adviser on the listing. Post-IPO the balance sheet strengthened markedly: cash and time deposits
      stood at about RMB3,115.8 million at end-2025, total equity at RMB3,407.7 million, the current ratio at
      2.4x (from 0.3x) and the gearing ratio at 40.4% (from 295.0%). The stakeholder map enumerates the
      principal owners, cornerstone investors and other control-relevant parties with diligence asks.
    claimRefs: [CO012, CO013, CO014, CO015, CO016, CO017, CO018, CO019, CO020]
    tableRefs: [TO003]
  - id: scale-and-traction
    title: "Scale, Traction and Market Position"
    body: >-
      Geek+ has shipped more than 72,000 robots to over 40 countries and regions and serves approximately
      950 end customers, including more than 80 Fortune Global 500 companies, with a customer repurchase rate
      of about 78%. The company reports a global warehouse-fulfilment market share of about 23% — roughly the
      combined share of the second and third largest players — and ranks first in global AMR market share, a
      position it attributes to The Mobile Robot Market research series. Its installed base is supported by a
      service network of more than 52 service stations, 12 spare-parts centres and over 310 engineers. In
      FY2025 the company recorded revenue of RMB3,171.0 million, up 31.6% year over year, with about 75.3% of
      revenue generated outside Chinese Mainland at a 46.6% overseas gross margin, and it signed new orders of
      RMB4,137 million. Americas order intake, led by the United States, grew more than 50% year over year in
      2025. These scale metrics are summarised in the snapshot KPI table and snapshot-KPI figure and underpin
      the traction claims that later chapters on market, customers and financials build upon.
    claimRefs: [CO021, CO022, CO023, CO024, CO025, CO026, CO031, CO034, CO035]
    tableRefs: [TO001]
    figureRefs: [FO003]
  - id: milestones-and-adverse
    title: "Milestone Chronology and Adverse Checks"
    body: >-
      The company's chronology runs from its 2015 founding and early Tmall (Alibaba) deployment through its
      2020 US-office opening, multiple private rounds, the October 2023 launch of the 12-metre RoboShuttle, a
      2024-2025 embodied-intelligence pivot, the July 2025 Hong Kong listing, and 2026 product and geographic
      milestones including the RoboShuttle V5 launch, MODEX 2026 and LogiMAT 2026 showcases, and the 2026 RBR50
      innovation award for its Robot Arm Picking Station. Adverse and disconfirming checks are material and are
      preserved here rather than smoothed over: the shares fell from a 52-week high of about HK$33.90 to a low
      near HK$11.18 — a drawdown of roughly two-thirds — leaving a trailing price-to-earnings multiple reported
      near 590x on thin earnings; the company remained loss-making on an IFRS basis in FY2025 (a RMB10.4 million
      net loss); and as a China-headquartered hardware exporter it is exposed to US-China tariff and
      export-control risk. The milestone table and timeline figure provide the single dated chronology of
      record, tagged by event type and tone, that later chapters reference.
    claimRefs: [CO027, CO028, CO029, CO030, CO032, CO036, CO037, CO038]
    tableRefs: [TO004]
    figureRefs: [FO001]
