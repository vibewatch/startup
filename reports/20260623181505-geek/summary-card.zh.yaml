  topStrengths:
    - 仓储履约 AMR 市场全球份额第一（约 23%），在 40+ 个国家交付 72,000+ 台机器人，服务约 950 个客户（80+ 家 Fortune Global 500）。
    - 盈利拐点已经出现：FY2025 调整后净利润 RMB43.8m（首次转正），H1 调整后 EBITDA 也首次为正，收入增长 31.6% 至 RMB3,171.0m。
    - 需求更分散也更全球化：75.3% 收入来自海外，毛利率更高达 46.6%，客户复购率约 78%，美洲订单同比增长 >50%。
    - >-
      技术栈纵深足（Hyper+ 调度 5,000+ 台机器人、Robot Matrix、RoboShuttle V5、Robot Arm Picking Station、Geek+ Brain），背后是约 RMB335m
      年度研发和强专利基础。
  topRisks:
    - 估值被拉得很满：在很薄的 IFRS 盈利上给到约 590x 过去市盈率，股价较 52 周高点回撤约三分之二，说明定价脆弱、靠预期驱动，也有解禁后抛压。
    - 地缘 / 贸易敞口高：总部在中国、约 75% 收入来自海外的硬件出口商，容易受中美关税、出口管制和采购不信任冲击。
    - 盈利薄且脆弱：FY2025 IFRS 口径仍亏损（RMB10.4m），利润依赖非 IFRS 调整，面对价格竞争或利润率压力时缓冲有限。
    - AMR 竞争激烈且有商品化压力（AutoStore、Exotec、Hai Robotics、Amazon、低成本中国对手），还叠加创始人加权投票权控制和关键人依赖。
  unresolvedGaps:
    - 未披露净 / 总收入留存（NRR/GRR）；复购率是唯一留存代理指标。
    - FY2025 客户集中度细节（头部客户收入占比）尚未公开；FY2024 前五大客户约占 42%。
    - 2026 年 Yamada Denki（或其他具名客户）部署更新尚未确认；若干历史客户关系在当前期间仍未验证。
    - RaaS 与系统销售收入结构能见度有限；在关税和汇率压力下，通往 GAAP 盈利的路径能否持续也不清晰。
