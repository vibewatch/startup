summary:
  headline: >-
    Category-leading warehouse-robotics franchise with its first adjusted profit and #1 global AMR share, but priced for
    perfection as a China-headquartered hardware exporter exposed to tariff, margin and de-rating risk.
  overallScore: 6.5
