    headcount: 1054
  topStrengths:
    - "#1 global share (~23%) of the warehouse-fulfilment AMR market with 72,000+ robots shipped across 40+ countries and ~950 customers (80+ Fortune Global 500)."
    - "Inflection to profitability: FY2025 adjusted net profit of RMB43.8m (first ever) and first positive H1 adjusted EBITDA, on revenue up 31.6% to RMB3,171.0m."
    - "Diversified, globalised demand: 75.3% of revenue earned overseas at a richer 46.6% gross margin, ~78% customer repurchase rate, and Americas orders up >50% YoY."
    - "Deep technology stack (Hyper+ scheduling 5,000+ robots, Robot Matrix, RoboShuttle V5, Robot Arm Picking Station, Geek+ Brain) backed by ~RMB335m annual R&D and a strong patent base."
  topRisks:
    - "Stretched valuation: ~590x trailing P/E on thin IFRS earnings and a ~two-thirds drawdown from the 52-week high signal fragile, expectations-driven pricing and post-lock-up overhang."
    - "Geopolitical/trade exposure: a China-headquartered hardware exporter with ~75% overseas revenue is vulnerable to US-China tariffs, export controls and procurement distrust."
    - "Thin and fragile profitability: FY2025 still posted an IFRS net loss (RMB10.4m) and profit rests on non-IFRS adjustments, leaving limited buffer against price competition or margin pressure."
    - "Intense AMR competition and commoditization (AutoStore, Exotec, Hai Robotics, Amazon, low-cost Chinese rivals) plus founder weighted-voting-rights control and key-person dependence."
  unresolvedGaps:
    - "No disclosed net/gross revenue retention (NRR/GRR); repurchase rate is the only retention proxy."
    - "FY2025 customer-concentration detail (top-customer revenue share) not yet public; FY2024 top-5 was ~42%."
    - "No confirmed 2026 Yamada Denki (or other specific named) deployment refresh; several legacy customer relationships are unverified for the current period."
    - "Limited visibility into RaaS vs system-sale revenue mix and the durability of the path to GAAP profitability under tariff and FX pressure."
