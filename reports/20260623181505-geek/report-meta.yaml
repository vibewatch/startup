companyProfile:
  summary: "Geek+ (Beijing Geekplus Technology Co., Ltd. / 极智嘉科技) is a Beijing-headquartered warehouse-fulfilment robotics company founded in 2015. It sells autonomous mobile robot (AMR) systems spanning goods-to-person picking, tote-to-person shuttles, sorting and pallet handling, orchestrated by its Hyper+ algorithm platform and Robot Matrix software, and increasingly augmented by AI picking (Robot Arm Picking Station) and the Geek+ Brain embodied-intelligence model. The company has shipped more than 72,000 robots to over 40 countries, serves roughly 950 end customers including 80+ Fortune Global 500 names, and holds the #1 global share of the warehouse-fulfilment AMR market. It listed on the Hong Kong Stock Exchange (code 2590) on 9 July 2025 and posted its first adjusted (non-IFRS) net profit in FY2025."
  foundedDate: "2015-01-01"
  founders:
    - name: "Yong Zheng (郑勇)"
      role: "Founder, Chairman & CEO"
      background: "Tsinghua University graduate who previously worked at ABB and Saint-Gobain before founding Geek+ in 2015."
      claimRefs: [CO006, CO007]
  foundingLocation: "Beijing, China"
  headquarters: "Beijing, China"
  productSummary: "AMR-based intralogistics solutions: goods-to-person picking (PopPick), tote-to-person shuttles (RoboShuttle, incl. 12m V5), pallet-to-person, sorting and movement/handling robots, plus the Hyper+ scheduling platform, Robot Matrix, Robot Arm Picking Station and Geek+ Brain embodied-AI model."
  customerFocus: "Large e-commerce, 3PL/logistics, apparel and retail, grocery, automotive and pharma operators worldwide, with about three-quarters of revenue generated outside Chinese Mainland."
  businessModel: "Blends one-off automation system sales with subscription and Robotics-as-a-Service (RaaS) revenue, plus recurring software, spare-parts and maintenance income."
  stage: "Public (HKEX: 2590)"
  fundingStatus: "Public since July 2025 HKEX IPO (raised ~HK$2.71bn / ~US$281m at ~HK$22bn listing cap); cumulative capital raised ~US$960m including pre-IPO rounds from Warburg Pincus, GGV Capital, Intel Capital, Vertex Growth and CPE."
  disclosureProfile: public
  claimRefs: [CO001, CO002, CO004, CO005, CO012, CO033]
summary:
  headline: "Category-leading warehouse-robotics franchise with its first adjusted profit and #1 global AMR share, but priced for perfection as a China-headquartered hardware exporter exposed to tariff, margin and de-rating risk."
  overallScore: 6.5
  recommendation: track
