  - id: basis-of-competition
    title: "Basis of Competition"
    body: >-
      Warehouse-automation buyers select vendors on five axes: product paradigm fit (which robot
      category solves the SKU velocity and storage density problem), software and fleet scheduling
      depth, commercial model (RaaS versus capex), global service and spare-parts reach, and price.
      Geek+'s Hyper+ algorithm can schedule 5,000+ robots simultaneously, with a claimed deployment
      cycle five times faster than typical industry alternatives, a meaningful differentiator in
      competitive bids. AutoStore distributes exclusively through a partner network of 1,000+
      integrators worldwide rather than direct to end customers, which limits its customer intimacy
      but widens geographic reach. Exotec's Skypod system deploys 3D free-roaming AMRs that retrieve
      totes directly from racks, requiring minimal aisle space, a differentiated footprint profile
      versus both cube-grid and conventional shelving. Swisslog, as a KION subsidiary, has completed
      2,500+ projects across 50+ countries and serves as an integrator for AutoStore and its own
      SynQ software platform. AutoStore in 2026 launched CubeVerse (a modular grid-expansion
      product) and AutoStore Intelligence (a software analytics platform), signalling intent to
      compete on software depth. Locus Robotics opened a European headquarters in 2026 and entered
      the MODEX 2026 Best New Innovation competition, demonstrating active geographic and product
      repositioning. Geek+ uniquely offers free-nav AMR, ASRS tote-to-person, sortation and pallet
      handling within a single vendor platform, reducing integration complexity for customers
      operating hybrid workflows. RaaS and subscription commercial models are available from Geek+,
      Exotec and Locus Robotics but remain limited at Symbotic (capex-only) and AutoStore
      (integrator-mediated). The feature and capability matrix in this section compares the seven
      most-referenced paradigm dimensions across seven vendors.
