      "id": "public-proof-stack-and-valuation-lenses",
      "title": "Public proof stack and what each valuation lens says",
      "body": "The bull case for N26 is not imaginary because the operating file improved meaningfully in 2024. The filed annual report shows €422.3 million of gross revenue, €10.35 billion of customer deposits, €10.88 billion of total assets, a €42.0 million net loss versus €102.4 million in 2023, and year-end capital and liquidity ratios that looked strong on the snapshot. The November 2024 company update added the more venture-style markers that public investors care about for valuation framing: roughly €440 million of 2024 revenue guidance, 4.8 million revenue-relevant customers, monthly sign-ups above 200,000, first quarterly profit in Q3 2024, and about €140 billion of annual transaction volume. In other words, N26 is no longer only a regulatory turnaround story. There is a real balance-sheet and monetization engine behind the app.\n\nBut the valuation math is still demanding. Using Sacra's dollar-denominated $486 million 2024 revenue estimate so that private valuations and public market caps are on the same currency basis, N26's post-peak markers imply very different quality bars: about 6.2x revenue at $3 billion, about 12.3x at ~$6 billion, and about 18.5x at the 2021 peak. Public comps like Wise, Nubank, and SoFi sit materially lower, roughly 4.7x to 6.9x. Only Revolut's new $75 billion valuation on $6.0 billion of 2025 revenue lands in the same rough neighborhood as the ~$6 billion N26 marker, and Revolut is doing so with much greater scale and far clearer profit proof. The customer lens is similar. N26 at ~$6 billion implies about $1,250 per revenue-relevant customer, above Monzo's roughly $388 and around Revolut's roughly $1,100. The bank-franchise lens is the counterweight: €10.35 billion of deposits, 26.2% CET1, 435.6% LCR, and 198.0% NSFR mean N26 has built a real regulated banking franchise. But supervisory overhang and opaque round terms still prevent the market from valuing those deposits as though the franchise were fully normalized.",
