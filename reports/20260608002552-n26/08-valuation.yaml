    {
      "id": "scenario-range-and-decision-implication",
      "title": "Scenario range and the decision implication",
      "body": "Once the noisy public evidence is forced into scenario math, the peak mark becomes hard to defend. A bear case around roughly $2.5 billion to $3.5 billion is not a broken-company call; it is what happens if public listed-fintech multiples and the adverse Allianz stake-sale reporting are closer to today's real clearing discipline than optimistic private-market narratives. A base case around roughly $4.0 billion to $5.5 billion gives N26 credit for genuine 2024 progress, recognizes that a regulated deposit franchise can command more than the most punitive public comp outcome, but still discounts the lack of a fresh completed round and the unresolved term stack. A bull case around roughly $5.5 billion to $7.0 billion requires more than just repeating the 2021 halo. It needs sustained profitability beyond one quarter, visible supervisory normalization, and cleaner round or IPO preparation evidence that lets N26 earn a premium closer to Revolut than to listed fintech peers.\n\nThat is why the most supportable public-only recommendation is still research-more rather than buy. The chapter does not say N26 is weak. It says the public file does not yet justify paying as though the 2021 peak still clears. The best synthesis is price-sensitive: ~$6 billion can be argued as an upper live marker if 2024-2025 improvement keeps compounding, but it is already full on today's public evidence; ~$9 billion looks stale; and the downside still has a real public reference point below that. An investor should therefore treat N26 as a company with a much better operating trajectory than the downturn headlines suggested, but with valuation that remains hostage to terms, governance, and whether a real market-clearing event happens above or below the current debate range.",
