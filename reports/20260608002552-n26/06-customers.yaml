  "chapter": {
    "number": 6,
    "title": "Customers",
    "summary": "N26’s customer story is strongest when the headline user base is separated into narrower economic cohorts: the company still markets over 8 million customers across 24 markets, but the more underwriting-relevant figure was 4.8 million revenue-relevant customers by end-2024. Public proof points show fast post-cap acquisition, high product breadth, and real household and freelancer expansion surfaces, yet direct voice-of-customer evidence remains mixed because strong app affinity coexists with persistent blocked-account, support, and complaints-handling friction."
  },
  "sections": [
    {
      "id": "customer-denominators-and-segments",
      "title": "The customer base is broad, but the monetization-relevant denominator is much narrower",
      "body": "N26’s public customer picture only makes sense when three layers are separated. The broadest installed-base claim is the homepage figure of over 8 million customers across 24 markets, while Business of Apps says the company has roughly 10 million registered accounts. The narrower underwriting denominator is the 4.8 million revenue-relevant customers disclosed around the 2024 profitability update, which N26 defines more tightly around verified, active account relationships. That distinction matters because the business is no longer monetizing only through a free current-account funnel: it is increasingly monetizing through premium plans, deposits, savings, investing, joint accounts, and adjacent freelancer or business use cases.\n\nPublic segment evidence points to at least five commercially distinct customer groups. First are free or entry-tier retail users who give N26 brand reach and low-cost acquisition. Second are premium retail subscribers on Smart, Go, and Metal who carry direct subscription revenue and richer travel, savings, and insurance economics. Third are joint-account households that increase share of wallet inside the home. Fourth are parents using under-18 cards that can extend relationship duration across life stages. Fifth are self-employed users, now split between Business Smart and the newer Freelancer Account, showing N26 trying to capture the same person’s personal and business finances instead of forcing them to defect to another bank.",
