      - number: '8.4'
        title: 催化剂、下行触发项，以及会改变判断的尽调事项
        blocks:
          - type: paragraph
            body: >-
              上行路径可以衡量。如果 N26 把一季度盈利转化为耐久的全年盈利，在没有又一次合规冲击的情况下保持客户增长和存款吸收强劲，并以更干净的普通股条款完成新一轮定价融资或进入可信的 IPO
              准备阶段，那么今天的谨慎立场可以上调。如果监管负担明显减轻，情况也一样：更干净的整改档案，会让投资人更多为故事里的银行特许经营部分付价，而不是把 N26
              当作仍受处罚的金融科技公司来承销。这些条件可以把估值讨论从高个位数收入倍数推向私募溢价区间。


              下行触发项同样具体。若要约收购或新一轮融资在 $3 billion 到 $4 billion
              附近出清，会验证更严厉的二级市场价格。沉重的优先权或保底回报包袱，即便标题价格看起来可以接受，也会削弱普通股价值。任何新的治理冲突或 IPO 时点滑坡，也会拉长流动性折价；而投资人已经在质疑创始人与 2021
              年投资人群体是否仍然一致。尽调负担因此并不抽象。在接近公开区间上沿付价之前，投资人应要求查看实时股权结构表、2025
              年融资状态、准确二级交易定价、客户盈利分群，以及整改退出标准的硬证据。在这些事项可见之前，公开证据足以框定 N26 的区间，但不足以抹掉不确定性带来的估值折价。
