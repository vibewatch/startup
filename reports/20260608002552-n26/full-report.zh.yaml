        - 英国主账户、储蓄、切换和消费者参与度强
        - 即便地理重叠窄，也是主账户深度的重要基准
      - - Starling
        - 直接基准 / SME 偏重新银行
        - 中 — 产品基准，直接 EU 重叠低
        - 6.2M 平台账户；£12.7bn 存款
        - 免费企业银行、高主关系指标、Engine 软件角度
        - 展示更强 SME 锁定和主账户地位可以长什么样
      - - Wise
        - 相邻替代品
        - 中 — 跨境消费、FX、资金管理
        - 15.6M 活跃客户；$33.9bn 客户持有额
        - 按用付费、中间价 FX、全球企业资金管理
        - 限制 N26 在旅行和国际资金流动上的定价权
      - - Vivid
