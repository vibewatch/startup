      - number: '6.3'
        title: 直接客户证据很多但好坏参半，账户冻结和客服摩擦持续存在
        blocks:
          - type: paragraph
            body: >-
              对一家消费银行来说，最强的直接客户验证不来自可点名的企业 logo，而来自公开评论页面和投诉轨迹。Trustpilot 的 2026 年 2 月 Wayback 快照显示，N26 在 39,614 条评论中得分
              4/5；Apple 的 App Store 评论页显示，约 12,000 个评分给出 4.6/5。这些样本足够大，能说明确实有大量客户在用这个产品，也认可它的移动优先体验。Selectra、GIROMATCH
              等评论聚合站也把这款应用描述为容易上手、打开很快，并且在预算管理和实时控制上有优势。


              但反向信号也真实存在，应该保留，而不是轻描淡写带过。Trustpilot 摘录里，用户投诉突然关户、资金被长期冻结、反复重新验证、登录失败、争议处理薄弱，以及客服无法解决紧急访问问题。Apple
              评论摘录也显示，身份重新验证和余额冻结是类似痛点。ComplaintsBoard 还给出一个具体的 2025 年案例：用户提交文件后，约 €1,800 被锁定；N26
              自己的支持页面也明确说，账户被临时冻结时，聊天客服无法加快技术审查，也不能提供更多信息。法律和监管层面的材料进一步说明，这不只是零散个案：一家律所的案例文章描述，N26
              在一起非法冻结账户争议后承担了诉讼费用；FinTelegram 则概述了 BaFin 2025 年关于投诉处理缺陷的发现。正确结论不是 N26
              没有产品市场契合，而是它的客户体验已经分裂成两面：日常银行体验很顺，异常处理却很痛。
