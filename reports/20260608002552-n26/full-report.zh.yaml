        - 参与度基准，不是广泛泛欧替代品
      - - Starling
        - 英国全牌照银行
        - 主要在英国零售和 SME
        - FSCS 保护
        - 34.5% 主关系指标和 450k+ 企业客户
        - 主账户和 SME 基准强，但与欧洲大陆 N26 的直接重叠有限
      - - Wise
        - EMI / 资金保管模式
        - 全球跨境和 SME
        - 资金保管，而不是经典银行存款担保
        - 价格透明度信任高，主银行功能信任较低
        - 国际资金流动的强替代品，工资账户银行的替代性较弱
      - - Vivid
        - 卢森堡 / 荷兰监管的电子货币和投资栈
        - 欧洲，尤其是公司和自由职业者
        - 客户资金隔离 / 保管，而不是经典银行 DGS 关系
        - 高收益和券商主张抵消较弱的经典银行信任
        - 竞争主要在 DACH 相关的金融超级应用场景里
      - - Barclays / HSBC
        - 老牌传统银行
        - 英国和国际大众市场
        - FSCS / 法定银行保护
        - 庞大的应用用户基盘和既有工资账户信任
        - 仍是 N26 必须撬动的现状替代品
