  - id: TV003
    title: 可比公司估值表
    columns:
      - 可比对象
      - 估值 / 倍数
      - 最新公开规模锚点
      - 对 N26 的启示
      - 局限
    rows:
      - - Wise
        - $11.01B 市值，对应 $2.33B 2025 年收入（~4.7x）
        - 公开上市的跨境金融科技公司，具备连续市场定价和年报披露。
        - 显示高质量上市金融科技公司当前倍数区间；它远低于 N26 峰值，按收入口径也低于 N26 的 ~$6B 标记。
        - Wise 的存款和贷款驱动程度低于 N26。
      - - Nubank
        - $58.19B 市值，对应 $10.62B TTM 收入（~5.5x）
        - 规模化上市数字银行可比对象，客户和收入基数大得多。
        - 说明即便是很大的数字银行，在公开市场也不会自动享有低十几倍收入倍数。
        - 拉美市场组合、风险画像和盈利背景不同。
      - - SoFi
        - $30.74B 市值，对应 $4.44B TTM 收入（~6.9x）
        - 美国上市数字银行和贷款平台。
        - 支持把谨慎的公开可比上限放在高个位数倍数，而不是 2021 年式峰值。
        - SoFi 的贷款组合和美国市场结构与 N26 明显不同。
      - - Revolut
        - $75B 估值，对应 $6.0B 2025 年收入（~12.5x）
        - 私人高溢价数字银行天花板，规模和盈利能力强得多。
        - Revolut 是证明高溢价私人倍数仍存在的最清晰案例，但也为 N26 主张 ~$6B 或更高估值设下很高门槛。
        - Revolut 比 N26 更大、更赚钱，也更全球化。
      - - Monzo
        - 最新公开二级市场标记 ~$5.9B；FY2026 收入 £1.7B；客户 15.2M
        - 英国私人数字银行，披露的客户和存款基础远大于 N26。
        - 有用的客户和品牌基准：N26 处在 ~$6B 时，市场等于要求它高于 Monzo，尽管披露规模更小。
        - 估值时间和币种不支持干净的同口径收入倍数。
    notes: 公开市场行使用市值和收入页面；私人公司行使用最新可访问估值标记加官方运营披露。本表意在给 N26 划定区间，而不是跨不同商业模式强行制造虚假精确度。
    enumerationScope:
