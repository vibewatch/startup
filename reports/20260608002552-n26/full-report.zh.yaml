  - id: TM002
    title: 规模测算视角表
    columns:
      - 视角
      - 证据 / 数值
      - 地理 / 期间
      - 对 N26 的含义
      - 限制
    rows:
      - - 数字化采用
        - 93% 互联网使用率；67% 网上银行使用率
        - EU，2024
        - 数字分发已成主流，因此应用访问不再是瓶颈。
        - 采用率很少说明主账户份额或变现深度。
      - - 支付账户饱和度
        - EU 各国账户拥有率 69% 到 100%；远程开户上升
        - EU，2021 基准，含 2024/25 EBA 评述
        - 增长更多来自份额迁移和主账户地位，而不是核心市场首次开户。
        - 国家区间很宽，且并非 N26 市场专属。
      - - 数字银行结构性份额
        - 欧元区约 60 家纯数字银行；资产份额 3.9%，2019 年为 3.1%
        - 欧元区，2024 年末
        - 数字银行具有结构性意义，但相对整个银行体系仍然很小。
        - 资产份额不等于活跃用户份额或收入份额。
      - - 家庭存款池
        - €5.675tn 隔夜存款 + €2.152tn 定期存款 + €2.374tn 通知存款 ≈ €10.2tn 总额
        - EU，2023
        - 如果 N26 能成为主要余额平台，吸收存款就是最大的相邻池。
        - 这是 EU 汇总口径，不是 N26 的可触达份额。
      - - 储蓄 / 投资相邻机会
        - 储蓄率 14.8%；金融投资增长 2.6%；尽管储蓄率高，EU 零售参与度仍低于美国
        - 欧元区 / EU，2025-2026 政策框架
        - 支撑 N26 从活期账户延伸到应用内储蓄和投资。
        - 宏观储蓄和零售投资数据不能直接等同于 N26 转化率。
      - - 高端银行业务视角
        - N26 定价为 €0/€4.90/€9.90/€16.90；Monzo 有 1.6m 订阅用户；Revolut 订阅营业额 $541m
        - 欧洲，2024-2026
        - 高端银行业务是真实收入层，不只是装饰性加售。
        - 同业附着率和经济性不能与 N26 直接对比。
      - - 供应商口径冲突的新银行 TAM
        - Mordor 口径 2026 年 $4.10bn，Market Data Forecast 口径 2026 年 $19.66bn
        - 欧洲，供应商报告于 2026 年更新
        - 只能作为方向性边界标记，不能当作单一 TAM。
        - 方法和品类范围明显不一致。
    notes: 本表有意混合用户采纳、余额池、政策和供应商市场视角，而不是硬凑一个宽泛 TAM；各行不能相加。
