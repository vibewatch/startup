      - number: '4.3'
        title: 盈利路径、资本充足率与监管约束
        blocks:
          - type: paragraph
            body: >-
              按公开时间线，N26 在 2024 年 6 月首次实现月度盈利，并在 2024 年 Q3 录得 €2.8 million 净营业收入。文件确认，2024 年明显好于 2023
              年，但还不是干净的全年盈利故事。计提拨备后集团经营结果仍为 -€40.4 million，净亏损为 -€42.0 million。成本纪律改善，但成本基础仍然很重：人员费用 €150.2
              million，一般行政费用 €331.7 million。盈利质量也包含技术项。高级合约收入确认把 €15.3 million 移出 2024 年；同时，为在 CRR III 前优化风险加权资产，公司确认了
              €20.4 million 证券损失。这些项目说明，退出运行率故事强于全年会计头条；但它们也意味着，简单的“首个盈利季度”叙事高估了盈利稳定程度。


              银行资金基础是真正的正面抵消项。存款为模式融资，超额余额被配置到银行债权、证券和贷款资产。这给了 N26 一个可信的资产负债表引擎，但也带来利率敏感性和监管暴露。储蓄利率重置时，存款 beta
              很重要。资产负债表增长时，管理层已预期 2025 年底 CET1 和杠杆率会降低。而 BaFin 2025 年 12 月行动也显示，即便报告 LCR 和 NSFR
              仍强，额外资本要求、特别代表和荷兰抵押贷款限制，也能直接削弱财务灵活性。
