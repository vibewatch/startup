  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 历史锚点、重置信号，以及为什么价格发现仍未完成
        blocks:
          - type: paragraph
            body: >-
              N26 确实有一个干净的公开估值锚点：2021 年 10 月的 Series E。公司自己、CNBC 和 TechCrunch 都将其描述为一轮超过 $900 million 的融资，估值超过 $9
              billion。这个价格重要，因为它是真实定价融资事件，不是数据库估算；但它已经足够久远，现在应被视为历史峰值，而不是可投资的当前价格。此后的公开材料朝相反方向移动。Sacra 和 Business of
              Apps 仍保留约 $6 billion 的峰值后市场数据标记，而 2023 年围绕 Allianz X 试图出售持股的更严厉报道，则指向约 $3
              billion，以及相对峰值的大幅折价。可支持的解读不是一个数字完全正确、其他数字都是假的；而是市场大幅重置，2021 年之后的公开价格发现一直碎片化、靠谈判推进，并且对条款高度敏感，而不是一次干净出清。


              这种不确定性在 2025 年的讨论报道里仍然存在。Sifted、Business Insider / Gründerszene 和 Crowdfund Insider
              都描述了估值下调的新一轮融资讨论，Coatue、Third Point 和 Dragoneer 的部分退出，以及 2021
              年投资人所获经济安排带来的持续复杂性。但这些报道都没有给出已完成价格、最终结构或确定的普通股结果。因此，估值结论很直接。N26
              上一轮公开定价融资真实但陈旧；后续二级交易和数据库标记明显更低；最新一轮媒体周期描述的仍是谈判，而非落定。对承销来说，这让价格纪律比怀念头部估值更重要。
