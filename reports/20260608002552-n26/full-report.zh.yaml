      - number: '6.4'
        title: 留存潜力看得见，但公开的耐久性和集中度数据仍然缺失
        blocks:
          - type: paragraph
            body: >-
              N26 的公开留存线索只能指方向，不能给定论。口碑获客、大额交易量，以及公司向联名账户、家庭卡、储蓄、投资和高端套餐推进，都指向同一套策略：从低参与度备用卡，变成客户的主要金融操作系统。Sacra 估计，约
              30%
              与收入相关的客户会为高端功能付费，且参与度和存款余额更高；这与上述策略相符，也解释了为什么存款和利息收入变得如此重要。面向自由职业者和泛商务场景的产品，也提供了一条可信的落地扩张路径：从个人财务切入自雇人群现金管理。


              但本章无法像软件尽调那样证明耐久性。公开材料里没有 NRR、GRR、logo
              流失率、高端套餐订阅人数、企业客户数，也没有按国家、套餐或存款分群披露的集中度。因此，客户故事在采用率和变现机制层面站得住脚，但还不能推到续约经济性层面。承销上的含义很清楚：N26
              很可能已经有真实的主账户分群，也有可信的扩张路径；但在高置信度承销客户质量之前，私下尽调仍需要拿到套餐层面的订户结构、留存分群、账户冻结发生率、投诉解决 SLA，以及国家层面的客户或存款集中度。
