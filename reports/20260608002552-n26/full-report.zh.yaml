      basis: >-
        Covers the direct pan-European neobank peers plus the adjacent substitutes and incumbent digital banks most
        relevant to N26’s consumer-banking job-to-be-done. Excludes US-only neobanks and non-bank wallets without
        meaningful European overlap.
    rows:
      - - Revolut
        - 直接新银行
        - 极高 — 欧洲范围内零售和企业业务重叠
        - 52.5M 客户；$38bn 客户余额（2024）
        - 规模最大、产品栈最宽，订阅和企业银行业务强
        - 在广度、规模和跨境使用上最危险的直接竞争对手
