  - id: TV004
    title: 估值视角表
    columns:
      - 视角
      - 输入项
      - 含义
      - 重要性
      - 局限
    rows:
      - - 历史定价轮视角
        - 2021 年 Series E 轮估值高于 $9B
        - 真实峰值锚点，但不是当前锚点。
        - 证明 N26 曾经拿到顶级金融科技公司的定价。
        - 2021 年牛市估值不能当作今天的公允价值。
      - - 老股 / 市场数据视角
        - 市场数据汇总约 ~$6B，对比反向股权出售报道称约 ~$3B
        - 当前争议区间明显低于峰值，且仍未收敛。
        - 说明当前估值讨论必须按区间看，也要看清条款。
        - 数据库估值标记和股权出售报道，不等同于一轮干净的新融资。
      - - 公开市场收入倍数视角
        - 按 N26 2024 年 Sacra 估算收入 $486M 计算，Wise 约 4.7x、Nubank 约 5.5x、SoFi 约 6.9x
        - 公开可比公司测算大约指向 ~$2.3B-$3.4B。
        - 这是校验乐观私募叙事最干净的纪律约束。
        - 对一家正在修复的私营金融科技银行，公开可比公司可能低估其稀缺性和可选项价值。
      - - 私募溢价视角
        - Revolut 以 $6.0B 收入计约 12.5x
        - 按 Revolut 式视角，N26 可支撑约 ~$6.1B。
        - 解释了为什么 ~$6B 标记仍有讨论空间。
        - Revolut 的规模、盈利能力和全球触达都远强于 N26。
      - - 客户价值视角
        - N26 在 $3B / $6B / $9B 估值下，每名收入相关客户约 ~$625 / ~$1,250 / ~$1,875；Monzo 约 ~$388；Revolut 约 ~$1,100
        - ~$6B 已经要求 N26 的客户价值高于 Monzo，并大体接近 Revolut。
        - 私募收入质量披露薄弱时，这是有用的交叉校验。
        - 各公司对客户数的定义并不一致。
      - - 银行牌照资产与条款结构视角
        - €10.35B 存款、26.2% CET1、435.6% LCR、198.0% NSFR，加上 2025 年降估值和部分退出报道
        - N26 有真实的受监管牌照资产，但普通股价值仍取决于融资条款和整改风险如何落地。
        - 避免把存款业务按已经完全正常化来估值。
        - 公开来源没有披露当前优先股堆叠或 2025 年最终交易条款。
    notes: 收入倍数行使用 Sacra 的美元收入估算，便于与美元口径的市值和私募估值标记直接对比。监管文件支持的欧元数据单独用于锚定牌照资产质量。
