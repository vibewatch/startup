  - id: TI006
    title: 公开财务缺口表
    columns:
      - 缺失指标
      - 重要性
      - 最佳公开代理指标
      - 剩余阻碍
      - 精确尽调路径
    rows:
      - - ARR 式经常性收入桥接
        - 需要把耐久的经常性经济性，与利率驱动和交易型收入拆开
        - 申报文件中的高端费用，加支付和利息科目
        - 未按收入流或队列披露经常性桥接
        - 要求提供月度收入桥接，拆分为订阅、支付、利差、贷款和合作伙伴产品。
      - - 按收入流拆分的毛利率
        - 决定利润扩张更像软件、支付，还是受监管银行利差
        - 除净利息 / 净佣金和成本总额外没有其他数据
        - 未公开按产品或渠道拆分的服务成本
        - 要求按收入流提供毛利润，包括资金成本、卡组织成本、支持成本和合规开销。
      - - 按市场拆分的 CAC 和回本周期
        - 消费金融科技规模可能看起来漂亮，但付费获客仍然很差
        - 2024 年口碑占比 73%
        - 转介绍驱动的增长不等于完整 CAC 透明度
        - 按国家要求提供付费与自然获客组合、CAC、回本周期和激活情况。
      - - 高端订阅用户和主账户数量
        - 判断订阅耐久性和存款深度所必需
        - 4.8m 收入相关客户
        - 收入相关用户没有拆分为付费、主账户或盈利队列
        - 要求提供高端订阅用户、工资账户用户，以及按分群拆分的平均余额。
      - - NRR、流失率和队列留存
        - 不能只靠客户数增长推断交叉销售质量和 LTV
        - None
        - 没有公开的队列披露
        - 要求提供存款、高端套餐、贷款和财富产品的队列留存表。
      - - 客户集中度
        - 少数市场或高余额队列可能驱动经济性
        - 公司称德国、法国和西班牙是主要市场
        - 未按地域或队列披露收入、存款或信贷集中度
        - 要求提供头部市场和头部分群集中度表。
      - - 2025 年 12 月后准确资本附加要求
        - 缺少监管资本栈，CET1 缓冲很难解读
        - BaFin 确认存在更高资本要求
        - 幅度、缓冲和整改触发条件未公开
        - 要求管理层提供完整资本栈、附加要求函和整改里程碑。
      - - 当前 2025-2026 年末运行率盈利
        - 2024 年监管文件和 2024 年 Q3 新闻周期没有给出当前正常化运行率
        - 2025 年 H2 可持续盈利目标
        - 公开信息没有 FY2025 账目或 2026 退出运行率披露
        - 要求提供自 2025 年 1 月以来的月度 NOI、净利润和资本比率趋势。
    notes: 私营公司透明度不足，在 ARR、毛利率、CAC / 回本周期、NRR 等 SaaS 式指标上尤其严重。2025 年 12 月措施包之后，银行资本细节也不完整。
