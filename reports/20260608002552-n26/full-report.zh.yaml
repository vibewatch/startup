  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 当前判断
      - 判断依据
      - 决策含义
    rows:
      - - 建议
        - 继续研究
        - N26 的运营显然强于 2021-2023 年重置期，但公开记录仍缺少最新成交价格和清晰条款能见度。
        - 不要按面值承销旧峰值或未经证实的新融资传闻。
      - - 信心
        - 中
        - 现有证据足以否定峰值作为陈旧锚点，并框定实时区间，但还不足以锁定一个精确的当前公允价值。
        - 用本章设定价格纪律和尽调优先级，不要假装有虚假的精确度。
      - - 风险评级
        - 高
        - 估值仍取决于监管正常化、轮次条款，以及新价格发现落在公开区间的乐观端还是不利端。
        - 在条款和治理更干净前，先假定下行真实存在。
      - - 估值立场
        - 接近 ~$6B 属于合理至偏满；峰值已偏高
        - ~$6B 只有在高溢价私人金融科技视角下才说得通，而 $9B 现在更像历史峰值，不是当前已验证价值。
        - 把 ~$6B 视为仍需验证的实时上限，把 $9B 视为需要重新挣回的门槛。
      - - 决策含义
        - 只在低于峰值或条款干净时参与
        - N26 也许具备战略重要性，但公开材料不支持照价接受。
        - 在加大投入前，优先做结构化尽调、争取二级折价或等待新轮次清晰。
    notes: 该摘要只基于公开信息，且对条款敏感。它不能替代实时股本结构审查或经谈判形成的私人公司备忘录。
