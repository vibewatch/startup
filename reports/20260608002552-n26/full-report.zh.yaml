        - 随着规模和利息收入改善，亏损大幅收窄。
        - 这仍不是经审计的全年盈利。
    notes: FY2024 申报的集团指标混合了总收入、净收入和部分子项目；这些比较有参考价值，但并非所有行都采用相同的会计定义。
