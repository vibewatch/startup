      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              增长逻辑建立在四个相互强化的驱动因素上。第一，分发已经数字化：受访欧洲客户中 82% 偏好将网站或移动应用作为主要渠道，EU
              互联网银行使用已经主流化。第二，支付轨道正在改善：即时支付监管抬高了全地区对基础速度和便利性的预期。第三，收入栈正在拓宽：可比公司披露显示，一旦应用银行赢得经常性互动，订阅、余额、财富和跨境持有都可以变现。第四，政策正在推动储蓄流向可投资产品，这支持
              N26 进入 ETF 和现金基金式产品，而不是让价值困在低互动的活期账户里。


              约束同样真实。ECB 警告，数字银行存款比传统银行存款更价格敏感、锚定更弱；EBA 数据显示，欺诈和去风险化仍是消费者最关心的问题。Oliver Wyman 调查显示，便利性很高，但安全感知仍落后。AML
              和监管开销不会消退：AMLA 已经启动，BaFin 2025 年 12 月针对 N26
              的措施包显示，即便一家数字银行达到规模，监管信任仍会约束产品宽度和战略自由。竞争强度也从两侧上升：Revolut、Monzo、Wise 等规模化应用银行同业继续在订阅、财富和余额上扩张；Santander
              等传统银行则仍坐拥大得多的存款基础。因此，最稳妥的判断是：N26 身处一个大市场，但低成本、可信任、主账户关系的胜利，远比单纯积累应用安装量更难。
