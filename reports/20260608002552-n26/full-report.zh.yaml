      - number: '1.3'
        title: 资本基础、估值标记与利益相关方图谱
        blocks:
          - type: paragraph
            body: >-
              公开融资记录足以证明 N26 是欧洲资本最充足的私营新银行之一，但不足以重建实时股权结构表。Tracxn 报告其累计融资 $1.72 billion，并将 2021 年 10 月 Series E 确认为一轮
              $900 million、估值 $9 billion 的融资，由 Third Point Ventures 和 Coatue 领投，Dragoneer 与 Earlybird 也参与。Business of
              Apps 和 Sacra 都指向后续估值重置：Allianz 在 2023 年出售股份，隐含估值约 $6 billion。这是后续估值工作的关键公开信号：N26 仍有顶级资本基础，但最新公开定价标记已明显低于
              2021 年峰值。


              已披露的利益相关方，不只包括后期股权投资者。BaFin 是决定性的非经济利益相关方，因为它通过罚款、开户上限、资本要求和任命特别代表，反复约束或塑造 N26
              的增长路径。创始人仍然重要，因为即便经营控制权转向新任高管，他们的剩余持股和象征性影响力仍不透明。监事会也比典型软件公司更重要，因为 N26
              是一家持牌银行，同时在处理整改、产品扩张和潜在未来流动性事件。仍缺失的是股东协议、当前持股比例、董事会席位分配，以及任何 2023 年之后的二级市场定价数据；这些信息会让控制权和估值判断更锋利。
