      - number: '7.2'
        title: 财务改善是真的，但模型仍受利率影响，利润率也脆弱
        blocks:
          - type: paragraph
            body: >-
              N26 2024 年的财务反弹可信，但它也暴露了模型最容易受压的地方。年报显示，总收入 €422.3 million、存款 €10.4 billion，亏损大幅收窄；2024 年 11
              月的增长更新则把一季度盈利与不受限制获客恢复联系起来。但同一批文件也清楚说明，盈利结构仍高度暴露于利率环境和存款增长。净利息收入达到 €144.2 million，并被明确描述为由利率环境变化驱动；Sifted
              报道称，2024 年约一半收入来自利息相关收入。随后 N26 的申报文件解释了这件事为什么在结构上重要：贷款和司库资产对应的是不定期存款，天然带来利率和再融资成本风险。

              如果竞争环境温和，或者银行已经锁定多元、可重复的费用经济性，这种敏感性影响会小一些。但事实相反，N26 自己警告，传统银行、其他金融服务公司和金融科技竞争者都可能压缩利润率。TechCrunch 将其与
              Revolut、Monzo 等已经盈利的对手比较，也凸显了压力：只有当 N26
              能证明盈利在低利率和正常竞争下仍能维持时，投资人或许才会接受更晚到来的盈利爬坡。荷兰按揭贷款禁令的意义也不止于标题观感，因为按揭收入是申报文件中少数被点名的贷款方向之一。合在一起看，财务模型风险不是迫在眉睫的资不抵债；而是当前盈利桥梁异常依赖监管自由度、利率水平和存款驱动的持续增长，同时更广泛的数字银行市场正在变得不那么宽容。
