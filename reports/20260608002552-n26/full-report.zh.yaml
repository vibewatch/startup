  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础很宽，但与变现相关的分母窄得多
        blocks:
          - type: paragraph
            body: >-
              只有把三层拆开，N26 的公开客户图景才说得通。最宽的装机基础口径，是主页所称覆盖 24 个市场、超过 8 million 客户；Business of Apps 则称公司约有 10 million
              注册账户。更窄的承保分母，是 2024 年盈利更新前后披露的 4.8 million 收入相关客户；N26
              对其定义更紧，围绕已验证、活跃的账户关系。这一区分重要，因为业务已不再只通过免费活期账户漏斗变现；它越来越多地通过高级计划、存款、储蓄、投资、联名账户，以及相邻自由职业者或商业使用场景变现。


              公开细分证据指向至少五个商业上不同的客户群。第一类是免费或入门层级零售用户，给 N26 带来品牌触达和低成本获客。第二类是 Smart、Go 和 Metal
              上的高级零售订阅者，贡献直接订阅收入和更丰富的旅行、储蓄与保险经济性。第三类是联名账户家庭，提高家庭内部钱包份额。第四类是使用未成年人卡的父母，可以把关系时长延伸到不同人生阶段。第五类是自雇用户，现在被拆分在
              Business Smart 和更新的 Freelancer Account 之间，显示 N26 想捕获同一个人的个人和商业金融，而不是迫使他们转投另一家银行。
