      - number: '8.2'
        title: 公开证据栈和各估值视角的含义
        blocks:
          - type: paragraph
            body: >-
              N26 的多头情景不是凭空想象，因为 2024 年的经营材料确实明显改善。已提交年报显示，总收入 €422.3 million、客户存款 €10.35 billion、总资产 €10.88
              billion，净亏损从 2023 年的 €102.4 million 收窄到 €42.0 million，年末资本和流动性比率在快照上看起来很强。2024 年 11
              月的公司更新还加入了公开投资人用于估值框架的更偏风投风格指标：约 €440 million 的 2024 年收入指引、4.8 million 名与收入相关客户、月新增注册超过 200,000、2024 年 Q3
              首次实现季度盈利，以及约 €140 billion 年交易量。换句话说，N26 不再只是一个监管转型故事。这个应用背后已经有真实的资产负债表和变现引擎。


              但估值数学仍然苛刻。为了让私募估值和公开市值处在同一币种口径，这里使用 Sacra 以美元计的 2024 年收入估计 $486 million；N26 的峰值后标记对应非常不同的质量门槛：$3 billion
              时约 6.2x 收入，约 $6 billion 时约 12.3x，2021 年峰值时约 18.5x。Wise、Nubank、SoFi 等公开可比公司明显更低，大约在 4.7x 到 6.9x。只有 Revolut
              最新 $75 billion 估值与 $6.0 billion 的 2025 年收入，落在与 N26 约 $6 billion 标记相近的粗略区间；但 Revolut
              的规模大得多，盈利证据也清楚得多。客户视角类似。N26 若按约 $6 billion 估值，对应每名与收入相关客户约 $1,250，高于 Monzo 约 $388，也略高于 Revolut 约
              $1,100。银行特许经营视角是反向支撑：€10.35 billion 存款、26.2% CET1、435.6% LCR 和 198.0% NSFR，说明 N26
              已经搭出一个真实的受监管银行特许经营。但监管阴影和不透明的融资条款，仍阻止市场像特许经营已经完全正常化那样给这些存款定价。
