  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 推荐结论从真实但已陈旧的 2021 年峰值出发，叠加更低的二级市场标记、更强的 2024 年运营证据，以及 2025 年仍未完成的价格发现。
    data:
      nodes:
        - id: peak
          label: 2021 年峰值
          detail: '>$9B Series E 轮确实发生过，但已经是历史。'
        - id: reset
          label: 重估信号
          detail: 2023-2025 年公开标记走向 ~$6B，并在不利情形下指向 ~$3B。
        - id: proof
          label: 2024 年证据
          detail: 收入、存款和 Q3 盈利能力都明显改善。
        - id: terms
          label: 没有清晰新价格
          detail: 2025 年报道写的是谈判、部分退出和条款复杂度，不是已经敲定的新轮融资。
        - id: result
          label: 继续研究
          detail: 接近 ~$6B 属于合理至偏满，峰值估值偏撑，且高度看条款。
      edges:
        - from: peak
          to: reset
