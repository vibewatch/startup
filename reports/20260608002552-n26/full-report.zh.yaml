      - number: '5.3'
        title: 安全、KYC 与最可见的技术界面
        blocks:
          - type: paragraph
            body: >-
              公开技术记录最强的地方，是安全或监管迫使 N26 解释自己的地方。在消费者侧，安全页面描述了一家云托管银行，使用 AI 和机器学习做欺诈与金融犯罪控制，同时给用户应用内直接控制：锁卡、改
              PIN、设消费限额、隐藏敏感数据。设备配对、生物识别认证、3D Secure、双因素认证和实时活动通知，都被定位为账户体验的标准部分。Keyless
              是最具体的公开控制披露：支持文章称它使用零知识生物识别，将自拍转换成加密密钥，并避免存储原始生物识别数据。开户注册 KYC 同样受合规塑形。N26 称，身份验证取决于国籍、居住地和证件类型，提供照片、视频、eID
              和银行账户验证等变体；若客户没有受支持证件，银行就无法为其开户。


              最清楚的工程文档并不面向零售应用，而是 PSD2。N26 的 TPP 支持页面和公开 GitHub 仓库描述了一个 Berlin Group 1.3.6 REST API，配套 OAuth
              2.0、沙盒支持、QWAC 证书要求、OpenAPI 文件、Postman collections，以及季度可用性报告。这些材料暴露了具体运营约束——180 天 AIS 同意、15 分钟 PIS
              窗口、早期同意窗口之外 90 天交易历史限制、未公开速率限制，以及按证书角色区分的访问。它们也显示，N26 的 API 账户模型已从主账户扩展到 Spaces、联名账户和 Instant
              Savings。关键含义是：当监管要求互操作时，银行会发布更精确的技术细节；而对内部核心银行、欺诈模型或事件管理架构，披露就少得多。公开技术披露存在，但不均衡，且由合规驱动。
