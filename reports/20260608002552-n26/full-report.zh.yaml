  - id: TI002
    title: 申报资产负债表、存款和资本指标
    columns:
      - 指标
      - '2024'
      - 2023 / 门槛
      - 解读
      - 注意事项
    rows:
      - - 总资产
        - €10.8788bn
        - €8.3796bn，2023
        - N26 现在已是有实质规模的资产负债表机构，不只是 app 分发故事。
        - 即便盈利改善，资产增长也可能拉低资本比率。
      - - 客户存款
        - €10.3544bn
        - €7.8006bn，2023
        - 存款资金是核心资产负债表引擎。
        - 存款是负债；质量取决于稳定性、定价和监管处理。
      - - 客户贷款
        - €3.1390bn
        - €2.6615bn，2023
        - N26 正把资产负债表容量投向贷款。
        - 组合包括按揭和市政贷款，不只是消费贷款。
      - - 按揭贷款
        - €1.0749bn
        - €562.1m，2023
        - 在 BaFin 冻结荷兰新增发放前，按揭敞口正在扩大。
        - 这是资产负债表存量，不是新增放款量。
      - - 市政贷款
        - €1.7024bn
        - €1.7598bn，2023
        - 部分超额存款投向相对低风险的贷款资产。
        - 市政贷款的经济性不同于核心零售银行。
      - - 集团权益
        - €462.1m
        - €506.0m，2023
        - 资本仍为正且规模可观。
        - 但亏损延续，权益仍然下降。
      - - CET1 比率
        - 26.2%
        - FY2024 达到目标
        - 从申报的年末快照看，资本缓冲较强。
        - 管理层还披露，2024 年 BaFin 对自有资金确认给予容忍。
      - - 杠杆率
        - 4.0%
        - 同比下降 110 bps
        - 该行仍高于最低杠杆要求。
        - 管理层预计，随着资产负债表扩大，到 2025 年底杠杆率会再次走低。
      - - LCR / NSFR
        - 435.6% / 198.0%
        - 最低 LCR 要求为 100%
        - 近期流动性看起来稳健。
        - 强流动性并不能消除监管限制或附加要求。
    notes: 所有数字来自 FY2024 申报报告。客户存款是资产负债表负债，应与贷款、证券和资本指标一起阅读。
