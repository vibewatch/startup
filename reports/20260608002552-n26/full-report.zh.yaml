      - number: '3.2'
        title: 地理、牌照与规模定位
        blocks:
          - type: paragraph
            body: >-
              完整大陆银行牌照重要的地方，就是 N26 最强的地方。它持有德国银行牌照和法定存款保障，因此可以可信地把自己营销为主银行，而不只是一张卡、一个钱包或一层 FX 覆盖。这让它在信任上结构性领先 Wise 和
              Vivid。但公开规模标记把 N26 放在欧洲新银行队伍中段，而不是前沿。Business of Apps 报告，N26 截至 2024 年底有 4.8 million 收入相关客户、约 10 million
              注册账户，以及一个约 $6 billion 的 2023 年二级市场估值标记。相比之下，Revolut 2024 年有 52.5 million 客户和 $38 billion 客户余额；bunq 有 17
              million 用户和超过 €8 billion 存款；Starling 有 6.2 million 平台账户和 £12.7 billion 存款；Monzo 当前公开声称个人和商业客户超过 15
              million。


              地理解释了为什么这些玩家对 N26 的压力并不相同。N26 与 Revolut 和 bunq 的重叠很大，因为三者都营销泛欧洲、移动优先、友好高级计划的银行服务。Monzo 和 Starling
              更集中在英国，因此主要作为主账户地位、储蓄和 SME 锁定的基准。最大的战略负面因素不是商业，而是监管：BaFin 在 2024 年 6 月完全解除 N26 增长上限，但 2025 年 12
              月措施——特别监督员、追加资本要求和荷兰抵押贷款禁令——在竞争对手加速之际，重新打开了信任问题。
