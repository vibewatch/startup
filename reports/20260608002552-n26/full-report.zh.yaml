        - €128.9m，2023
        - 支付和高端订阅仍是第二条主要收入线。
        - 净佣金已扣除佣金支出；它不等于支付总额。
      - - 高端账户费用
        - €68.3m
        - €64.0m，2023
        - 付费层级有实际体量，不是装饰性功能。
