      - number: '1.4'
        title: 增长再加速、监管包袱与里程碑
        blocks:
          - type: paragraph
            body: >-
              N26 的 2024 年经营故事，明显强于 2021-2023 年。BaFin 自 2024 年 6 月 1 日起解除增长限制后，N26 称月度注册数升至 200,000 以上，2024 年收入正朝约 €440
              million 运行，并在 2024 年 Q3 录得 €2.8 million 净营业收入，首次实现季度利润。客户存款超过 €10 billion，公司预期利息收入贡献约一半 2024
              年收入，确认该模式已经比早期卡驱动增长阶段更依赖资产负债表。这些都是有分量的成熟信号：N26 看起来更像一家规模化欧洲零售银行平台，而不是早期新银行实验。


              但反向记录仍是第 1 章的核心，不是脚注。BaFin 2024 年 5 月处罚确认，N26 在 2022 年系统性迟报可疑活动；监管机构 2025 年 12 月措施包又称，N26
              在风险管理、投诉管理和贷款运营中仍缺乏适当业务组织。由此产生的补救措施——特别代表、额外资本要求，以及禁止在荷兰新增抵押贷款发放——说明监管信任已改善到足以允许增长，但还不足以解除密切监管。因此，2026
              年家庭银行和货币市场投资产品上线有两层含义：它们显示 N26 仍在拓宽平台，但也在监管机构要求更好治理和执行质量的同一时点，提高了运营控制门槛。
