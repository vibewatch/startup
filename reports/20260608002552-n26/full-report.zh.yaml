      - number: '5.4'
        title: 平台信号、路线图证据与运营约束
        blocks:
          - type: paragraph
            body: >-
              开发者和平台信号表明，N26 有一个真实的工程组织，但透明度并不高。应用商店页面显示，它维护着一个活跃的移动界面，有当前发布节奏和庞大用户评价基础；GitHub 则暴露出围绕 PSD2 文档的小型公开足迹，以及
              FlowKit 和 Android clean-architecture samples 等遗留开源移动框架。当前招聘信息比官方架构页面补足了更多图景。安全平台岗位广告描述了一个云原生后端环境，使用
              AWS、Docker、Kubernetes、Terraform、Kafka 和 Java/Kotlin/Spring Boot，并强调 “you build it, you run it”
              运营模式，以及用于威胁检测、事件响应和漏洞管理的内部自动化。这是规模化消费者银行可信的平台信号，但离完整公开架构披露仍有很大距离。


              主要警示是，产品扩张并没有消除合规驱动的运营拖累。BaFin 2025 年 12 月措施显示，N26
              仍被迫整改风险、投诉和贷款组织中的缺陷，并配套特别监督员、额外资本要求，以及禁止新增荷兰抵押贷款业务。这会直接影响产品宽度，因为在整改持续时，银行扩张贷款或相邻受监管功能的舒适度会受限。可靠性披露也很薄。第三方监控可以观察宕机信号，但所审阅来源没有发现第一方公开事件台账或详细
              SLA 历史。综合来看，N26 像一个真实的多产品银行平台，具备可信的移动、API 和云工程信号——但它的公开技术透明度仍落后于产品野心，路线图也仍受监管执行质量约束。
