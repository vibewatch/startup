        - 可能支撑 ARPU，但披露不透明
        - 提供佣金表、理赔成本敞口，以及按套餐拆分的附加情况。
      - - 自由职业者企业账户
        - 带返现的自由职业者活期账户，未来扩展企业银行
        - 当前产品仅限自由职业者；更完整的企业银行仍在未来路线图中
