chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、牌照与产品范围
        blocks:
          - type: paragraph
            body: >-
              识别 N26 当前身份，最稳妥的记录来自它自己的主页和政策声明，而不是已经下线的旧档案页。N26 将自己定位为一家受 BaFin 监管的全移动银行，持有完整德国银行牌照，提供最高 €100,000
              的存款保障。主页也给出了当前最宽的覆盖范围口径：N26 称它在 24 个市场运营，服务超过 8 million 名客户。这个数字不能和更窄的财务披露指标 “revenue-relevant” 客户混在一起；后者为
              4.8 million，指已经完成 KYC 且持有开放账户的用户。后续章节必须区分这两者，因为漏斗顶部的装机客户基础和已经变现的客户基础明显分叉。


              商业模式已经比最初的支票账户叙事更宽。公开产品界面显示，N26 的产品栈把免费和付费活期账户，与即时储蓄、股票和 ETF、加密货币，以及相邻贷款或投资产品组合在一起。2026 年，N26
              增加了儿童和家庭银行卡产品，以及一层货币市场基金包装，进一步说明公司想成为更宽的金融操作系统，而不只是由卡驱动的新银行。该模式看起来通过订阅、存款和贷款利息收入，以及基于活动的金融产品变现。最强的保留意见是，头部规模故事仍主要来自公司披露，因此后续承保应把当前客户和产品使用数据视为方向上强劲，但未经独立审计。
