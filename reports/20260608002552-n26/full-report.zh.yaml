  - id: TM004
    title: 增长驱动因素与约束表
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时间
      - 证据 / 含义
      - 尽调追问
    rows:
      - - 以应用优先的分发已进入主流
        - 驱动
        - 当前
        - EU 互联网银行已经进入主流，82% 受访客户偏好应用或网页渠道。
        - 数字化接入不再稀缺后，按国家衡量 N26 的获客成本和激活情况。
      - - 即时支付基线
        - 驱动
        - 近期
        - EU 规则正在把可触达账户的 24/7 即时账户到账户支付变成标配。
        - 检验 N26 是把更快支付能力转化为主账户使用，还是只是在补齐基础能力。
      - - 大规模家庭储蓄池
        - 驱动
        - 结构性
        - EU 家庭存款超过 €10tn，储蓄率仍处高位。
        - 拆分 N26 在活期账户、储蓄和投资包装中的余额结构。
      - - 高端与投资相邻机会
        - 驱动
        - 当前至中期
        - 同业靠订阅、余额和财富业务变现；N26 已拓展到 ETF 和类 MMF 现金基金。
        - 索取高端与投资产品的附着率、单产品收入和交叉销售分群。
      - - 信任和安全感知缺口
        - 约束
        - 当前
        - 仍有相当一部分消费者认为新银行不如网点银行安全。
        - 按市场跟踪信任指标、欺诈损失和投诉趋势。
      - - 存款可迁移性与价格敏感度
        - 约束
        - 结构性
        - ECB 称，数字银行存款价格更敏感、黏性更弱，且常常跨境流动。
        - 评估 N26 的存款 beta、促销利率依赖，以及利率变化后的余额耐久性。
      - - 欺诈与降风险
        - 约束
        - 当前
        - EBA 将支付欺诈和降风险列为 EU 消费者首要问题，脆弱群体和跨境用户尤其受影响。
        - 审查 N26 开户拒绝、误判率和关户原因。
      - - AML 与监管负担
        - 约束
        - 结构性
        - AMLA 已上线，跨境数字银行的合规要求在上升。
        - 梳理 AML、投诉和风险管理的人手、支出和整改积压。
      - - 传统银行与规模化应用银行竞争
        - 约束
        - 当前
        - Revolut、Monzo、Wise 和传统银行都在从不同角度争夺同一个客户钱包。
        - 在余额、订阅、主账户份额和财富附着上对标 N26 与同业。
      - - N26 特有监管阴影
        - 约束
        - 当前
        - BaFin 2025 年 12 月一揽子措施显示，监管信任仍会限制扩张和产品广度。
        - 核实 BaFin 措施是否已关闭，以及是否仍有任何地区或产品在战略上受限。
    notes: 各行把市场层面的驱动因素与 N26 特定的执行约束放在一起，因为 EU 数字银行的采用节奏不只由应用 UX 决定，信任和合规同样关键。
