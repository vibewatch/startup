  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：纳入什么、排除什么
        blocks:
          - type: paragraph
            body: >-
              承保 N26 时，应采用比泛泛的“全球新银行 TAM”更窄的市场边界。公开界面显示，它是一家消费者银行，将活期账户、付费高级计划、即时储蓄、股票和
              ETF，以及现在的货币市场基金式现金产品打包在一起。这意味着，相关支出池是 EU 和 EEA 零售交易银行，加上订阅费、存款和储蓄余额、支付活动，以及应用内投资或现金管理等附着层。公司自己的开户注册、工资
              IBAN 和虚拟卡流程也强化了这一点：这是移动优先的个人金融关系，而不是网点、SME 或企业司库工作流。


              排除项同样重要。N26 目前没有争夺 SME 和企业银行、抵押贷款驱动零售银行、保险制造，或网点顾问收入的完整经济性。这些池子可能通过竞争者间接影响 N26，但不应被偷渡进本章 TAM。EU
              监管正在同时抬高数字零售银行功能的底线：即时支付政策把每个可触达账户推向 24/7 账户到账户转账，而数字化采用率已经很高。2024 年，16-74 岁 EU 居民中 67%
              使用互联网银行，各成员国支付账户渗透率也已经很高；因此市场问题不再是“客户能否数字化银行”，而是“哪家提供商能赢得主账户信任、余额和产品深度”。
