  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 账户、层级与日常银行工作流
        blocks:
          - type: paragraph
            body: >-
              N26
              的产品最好理解为一种应用优先的活期账户工作流，起点是设备信任，而不是网点文件。公开计划页称，注册要经过移动应用、邮箱确认、应用内身份验证和智能手机配对，之后虚拟借记卡才可使用。这样的开户注册设计压低分发成本，也让手机成为认证、银行卡、通知和高级计划增购的控制点。由此形成的日常产品栈，比单一活期账户更宽：应用商店页面还把联名账户、商业账户、Wise
              驱动转账，以及同一移动界面内的钱包优先卡激活暴露出来。落到用户使用上，N26 试图成为日常支付、预算和相邻资金流动的主金融驾驶舱，而不是一层很薄的预付卡外壳。


              分层是这套工作流变现、也是产品范围碎片化的核心。Standard 仍然免费，Smart、Go 和 Metal 则逐级增加更丰富的取现、旅行和支持功能。Spaces 很重要，因为它让 N26
              的账户模型比单一支票余额更模块化：高级用户最多可创建 10 个子账户，可选择附加 IBAN 或银行卡，并用 Shared Spaces 做协作预算。Under 18s
              把同一架构延伸到家庭银行：儿童卡挂在父母管理的 Space 下，配合实时限额和锁卡控制。问题在于产品并非全球统一。ATM
              额度同时取决于计划和客户所在的条款与条件国家，未成年人卡也只在五个国家子集上线。所以，即便是“核心”银行工作流，也应被读作一个可配置、按地区碎片化的产品栈，而不是所有市场都完全相同的一套报价。
