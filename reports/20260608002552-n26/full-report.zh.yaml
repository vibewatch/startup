      - number: '1.2'
        title: 创始人、领导层交接与治理
        blocks:
          - type: paragraph
            body: >-
              N26 由 Valentin Stalf 和 Maximilian Tayenthal 于 2013 年创立，多年来公司的外部叙事与这对联合 CEO
              创始人绑定很深。这个创始人主导模式现在已经明显变化。官方新闻稿显示，来自 UBS 的外部银行高管 Mike Dargan 被任命为 CEO，自 2026 年 4 月生效；Tayenthal 则在 2025
              年底退出运营职责。交接期间，CFO Arnd Schwierholz 和 Marcus W. Mosen 承担临时联合 CEO 职责；监事会在 2026 年 3 月替换 Peter Kleinschmidt，由
              Stefan Ermisch 接任，刷新了成员构成。2026 年 5 月的管理层更新又加入 Aytac Aydin，并扩大 Daniel Lappas 的职责，显示董事会有意在更成熟运营阶段到来前加厚执行层板凳。


              这次转型降低了对单一创始人的运营依赖，但没有消除治理尽调风险。公开记录仍未完整披露当前所有权、完整董事会构成、委员会结构，以及创始人、监事会和后期投资者之间的确切控制分工。这一点重要，因为 N26
              已经不是简单的创始人主导创业公司：它是一家受监管银行，可信度现在取决于职业经理人能否把后上限时代的增长转化为持久的控制纪律。公开来源支持公司正走向机构化治理，但还没有给出足以高信心承保治理质量的完整名单或控制权组合。
