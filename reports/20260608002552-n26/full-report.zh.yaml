      - number: '2.3'
        title: 买方、用户、付费方与采用路径
        blocks:
          - type: paragraph
            body: >-
              对 N26 当前大多数产品而言，买方、用户和付费方是同一个人：做个人银行选择的单个消费者。但不同细分的收入路径差异很大。一类客户把 N26
              当成低摩擦第二账户，用于银行卡控制、旅行或应用体验。另一类是价值更高的主账户目标，可以把工资打到 N26 IBAN，并在平台上留存更多存款。高级旅行者和重度用户最适合 Go 和
              Metal；储蓄者和自主投资者则是单独可变现细分，因为 N26 现在覆盖即时储蓄、免手续费股票和 ETF 入口，以及货币市场基金式现金层。


              因此，采用路径不是简单的注册漏斗。它从轻松的移动开户注册和银行卡即时可用开始，但真正的经济获取发生在后面：客户信任存款保障和安全，把经常性入账迁过来，然后再被交叉销售到高级计划、储蓄或投资功能。可比证据支持这个框架。Monzo
              数据显示，即便是规模化应用银行，也仍要费力把活动转化为主银行地位；Oliver Wyman 2026 年调查显示，应用优先偏好已很普遍，但感知安全性仍落后于有网点的传统银行。对 N26
              来说，这意味着用户获取可以很快，但持久变现仍取决于主账户地位、余额和多产品采用。
