  - id: FE001
    title: N26 产品架构图
    type: stack
    layout: wide
    summary: 可见产品栈从移动端分发和配对设备开户出发，延伸到账户容器、合作伙伴支持的金融轨道，以及一个窄但具体的 PSD2 互操作层。
    data:
      layers:
        - label: 移动分发与访问层
          detail: N26 的 app、虚拟或实体卡、数字钱包、共同或企业账户入口，以及应用商店发布节奏，共同构成面向客户的外壳。
        - label: 身份与信任层
          detail: 邮箱确认、KYC、智能手机配对、Keyless 生物识别、2FA、3D Secure 和推送通知，建立访问和交易信任。
        - label: 账户与资金组织层
          detail: 主账户旁边还有 Spaces、Shared Spaces、18 岁以下关联 Spaces、类共同账户流程，以及 Instant Savings 余额。
        - label: 金融产品轨道
          detail: 股票和 ETF、现成基金、加密货币、贷款、透支和 Installments，都在 app 内呈现为相邻金融模块。
        - label: 合作伙伴与网络层
          detail: Upvest、Bitpanda、Wise、Allianz Assistance、卡组织和移动钱包生态，把功能延伸到 N26 自建轨道之外。
        - label: 受监管互操作层
          detail: PSD2 专用、后备和沙盒接口，为 AISP、PISP 和 CBPII 参与方暴露合规驱动的外部 API 面。
