            body: >-
              最清楚的客户增长信号，出现在 BaFin 于 2024 年中解除开户上限之后。N26 称，月度注册超过 200,000，73% 新客户来自口碑，收入相关客户有望从 4.2 million 增至 2024 年底
              4.8 million。这个组合重要，因为它说明获客并非完全靠营销支出买来；至少按 N26
              自己披露，品牌仍受益于自然推荐。独立报道大体重复了这些数字，足以把这次加速视为真实，尽管按市场拆分的确切客户组合仍是私密信息。


              更强的洞察是，N26 正试图把这些新用户转成更宽的金融关系。2024 年公司更新把更高客户活跃度与股票和 ETF、加密货币、即时储蓄及联名账户相连；Play Store listing
              也把同一组合营销为一个覆盖银行、储蓄、投资、商业财务和共享账户的应用。Joint Accounts 增加第二个成人金融关系，配有专用 IBAN
              和银行卡链接；未成年人卡和自由职业者账户则把平台推入家庭和自雇工作流。这些界面本身不能证明留存，但如果客户把它们用作主金融中心，它们就是提高切换成本和每用户平均收入的可信机制。
