companyProfile:
  summary: >-
    N26 是一家 2013 年创立于柏林的数字银行，持有完整德国银行牌照，并称在 24 个欧洲市场服务超过 8 million 名客户。它的产品栈已从活期账户和银行卡，扩展到储蓄、股票和
    ETF、加密货币，以及更新的家庭和现金管理产品。公开证据显示，N26 在 2024-2025 年的经营面更强，包括首次实现季度盈利、存款基础超过 €10 billion；但 BaFin 行动留下的实质监管和治理包袱，以及 2021
    年融资峰值之后有限的私募市场价格发现，仍压在业务上。
