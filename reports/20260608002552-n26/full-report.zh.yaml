      - number: '4.2'
        title: 变现组合、定价界面与收入确认问题
        blocks:
          - type: paragraph
            body: >-
              理解 N26 的收入质量，应把它看作多元化零售银行组合，而不是单一创业公司收入线。文件称，2024 年利息收入由司库、荷兰抵押贷款、消费贷款和 Bundesbank
              余额驱动；佣金收入则由支付服务和高级账户带动。高级账户费用单项就有 €68.3 million。2024 年 11 月更新也称，利息收入将约占 2024 年总收入一半，高于 2023 年的
              40%；这意味着，通往盈利的路径现在高度依赖余额、利率和资产配置，而不只是银行卡交换费或订阅增购。


              标价确认了一个宽阔但并不完全透明的变现界面。消费者计划仍是免费、每月 €4.90、€9.90 和 €16.90；自由职业者商业账户增加返现，但仍不是完整 SME 银行业务；Instant Savings
              利率明确按计划分层，并随 ECB 环境移动；股票和 ETF 以免手续费销售，但仍有产品成本；2026 年 Flexible Cash Fund
              引入货币市场基金经济性，而不是经典存款利差。缺失的是按收入流拆分的实际收入、各层级订阅者数量、财富产品附着率和合作伙伴收入分成。收入模式站得住；实际变现率组合并不公开。
