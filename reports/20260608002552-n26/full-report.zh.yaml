  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接同业与相邻替代品
        blocks:
          - type: paragraph
            body: >-
              N26
              真正的竞争集合，比泛泛的“欧洲金融科技公司”名单更窄。直接同业是试图在多个欧洲市场赢得主活期账户关系的消费者新银行：Revolut、bunq，以及——更多作为产品和互动基准，而非广泛地理替代品的——Monzo 和
              Starling。Revolut 是最清晰的同类竞争者，因为它争夺同一批跨境领薪用户、高级计划消费、FX 活动、商业账户需求，以及应用内投资或加密货币使用。bunq
              则是最接近的泛欧洲高级替代品，面向想在一个应用里同时获得银行账户、旅行权益和生活方式订阅的富裕外派人士与数字游民。


              Monzo 和 Starling 的地理重叠较弱，因为两者仍以英国为中心，但它们仍为主账户深度、切换、储蓄和 SME 工作流实用性设定标准。Wise 和 Vivid 不应被视为完整直接同业。Wise
              是转账和司库专家，建立在受保护资金和按使用付费定价上，而不是工资账户传统银行替代品。Vivid 是受卢森堡和荷兰监管的电子货币加券商混合体，更侧重返现、闲置现金回报、收单和 SME。Barclays 与 HSBC
              仍是相关替代品，因为很多多栖使用新银行、但没有完全切换的用户，工资存款、信任和关系银行惯性仍留在传统银行。
