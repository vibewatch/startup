  - id: TV005
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值逻辑
      - 概率信号
      - 关键风险
    rows:
      - - 乐观
        - 盈利能力不止维持一个季度，整改进展可见，新的价格发现让 N26 拿到更接近 Revolut、而非上市同业的私募溢价倍数。
        - 大约 ~$5.5B-$7.0B。N26 仍低于旧峰值，但相对上市金融科技公司的公开市场测算可拿到溢价。
        - 有可能，但需要经营兑现，也需要更清晰的条款 / 治理证据。
        - 如果条款偏保护投资人，更好的表面估值仍可能掩盖普通股经济性偏弱。
      - - 基准
        - 2024 年进展真实，但轮次条款仍不透明；估值低于旧峰值，同时高于严苛公开可比公司结果。
        - 大约 ~$4.0B-$5.5B。这个区间认可 N26 的存款、增长和早期盈利，但不按峰值或 IPO 在即的稀缺性付费。
        - 仅凭公开资料看，这是最可信情景：它把经营改善和未完成的价格发现连接起来。
        - 如果 2025 年谈判成交价低于预期，基准区间会迅速压缩。
      - - 悲观
        - 上市金融科技公司的估值纪律和反向老股成交主导；没有干净新轮融资验证溢价，投资人流动性压力持续。
        - 大约 ~$2.5B-$3.5B。这与更严苛的 Allianz 股权出售报道、高个位数公开可比公司倍数纪律一致。
        - 真实下行参照，不是尾部幻想。
        - 如果要约收购或融资轮接近反向公开价格成交，悲观情景可能突然到来。
    notes: 这些是基于公开证据的情景区间，不是精确公允价值声明。实时条款堆叠仍为私有信息，这些区间用于建立谈判纪律。
    claimRefs:
      - CV036
      - CV037
      - CV038
      - CV039
      - CV040
      - CV042
