  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管反复介入，使监管和控制风险始终排在风险清单最前面
        blocks:
          - type: paragraph
            body: >-
              N26 的核心风险不是资产负债表本身脆弱，而是德国监管方在多年整改后仍然发现控制失效。BaFin 2025 年 12
              月的一揽子措施措辞异常直接：它称该行缺乏合规的业务组织，指出风险管理、投诉管理和贷款组织存在严重缺陷，并叠加了特别代表、额外自有资金要求，以及禁止新增荷兰按揭贷款发放。Reuters 和 Banking Dive
              确认，这些不是象征性表态，而是与 2024 年专项审计和 2024 年账目审查挂钩的约束性监管措施。关键在于，合规由此不再只是后台成本，而变成正在影响增长、产品和治理的约束。

              2024 年 5 月 €9.2 million 罚款和 2024 年 6 月增长上限解除，应该放在一起看，而不是当成相互抵消的标题。罚款说明，即便 N26 已为罚金计提准备、也称已经投入大量整改，BaFin
              仍把可疑活动报告滞后的问题视为严重且系统性的失效。随后解除上限重新打开了客户增长，推动盈利和存款扩张；但 N26 自己的申报文件显示，管理层仍预计 2024 年审计会带来额外监管措施，并且到 2026
              年仍在处理治理、风险控制和资金管理方面的未结缺陷。承销含义很直接：N26 能在监管之下增长，但下行情景就是任何新一轮执法——再次限制产品推出、抬高资本拖累，或削弱“控制环境终于正常化”的叙事。
