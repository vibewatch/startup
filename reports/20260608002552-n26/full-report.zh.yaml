      - number: '7.4'
        title: 管理层补强有帮助，但可投性仍取决于可观察触发项的结果
        blocks:
          - type: paragraph
            body: >-
              文件里确实有真实缓释因素，不应忽视。N26 仍是一家持有完整牌照的德国银行，称存款受到最高 €100,000 保护，2024 年末 CET1 比率为 26.2%、LCR 为 423%，并描述了 30
              天流动性缓冲以及可用于紧急融资的 ECB 合格抵押品。公司也显然已经决定，不再不惜一切代价捍卫旧治理架构。相反，它刷新了监事会，任命一位新 CEO（仍需 BaFin 批准），并在新 COO
              之下重组运营、技术和法务。这些动作不能抹掉触发整改的控制失效，但说明管理层和股东如今的行为逻辑是重建可信度，而不只是声称自己可信。

              因此，本章最重要的输出不是静态严重程度分数，而是一套触发框架。如果 BaFin
              撤回特别代表和资本附加要求，荷兰按揭贷款限制解除，投诉积压在没有新执法的情况下恢复正常，剩余风险情景会明显改善。反过来，如果关键招聘审批延迟，访问事件持续复发，或低利率暴露盈利对司库和准备金收入的依赖，当前多头情景会迅速走弱。因此，N26
              只能在持续监控的基础上变得可投：上行取决于整改足够耐久，使盈利能在更干净的治理、较低利率和正常竞争压力下存活。下行则在于，这家银行已经证明，一个控制问题可以多快地从合规成本变成增长、产品和估值风险。
