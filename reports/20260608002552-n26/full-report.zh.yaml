  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 已提交的 FY2024 图景，以及集团结构为何重要
        blocks:
          - type: paragraph
            body: >-
              N26 最强的财务证据，已经不再只是创业公司式的新闻稿指引。N26 SE 提交的 FY2024 合并报告显示，N26 是一个由金融控股公司牵头的集团，N26 Bank SE
              驱动大部分经济性，母公司则为银行提供服务。这一点重要，因为只跟踪收入头条的读者，可能会漏掉受监管银行结构、母公司对银行的支持安排，以及部分披露数字在集团层面、其他数字在 N26 SE
              单体层面的事实。文件也让业务不再那么神秘：2024 年集团总收入达到 €422.3 million，净利息收入 €144.2 million，净佣金收入 €136.4 million，集团净亏损从 2023 年
              €102.4 million 收窄至 €42.0 million。


              同一份文件也把公开新闻周期背后的资产负债表图景变清楚了。2024 年底客户存款为 €10.35 billion，总资产为 €10.88 billion，客户贷款为 €3.14
              billion，包含抵押贷款、市政贷款和消费信贷。以提交文件的年末快照看，流动性和资本指标较强——26.2% CET1、435.6% LCR、198.0% NSFR，以及 4.0%
              杠杆率——但这些比率不应被读成干净的“问题已解决”信号。2025 年监管措施包，以及文件本身提到的 BaFin 容忍和 §44 KWG 检查结果显示，N26
              的资本位置是在主动监管管理之内可接受，而不是在真空中可接受。
