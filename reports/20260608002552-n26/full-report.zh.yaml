      - number: '2.2'
        title: 用多重口径，而不是一个宽泛 TAM 来测算
        blocks:
          - type: paragraph
            body: >-
              测算 N26 市场规模，最稳妥的方法是用多重口径，并把不兼容的单位分开。数字化采用口径显示可触达基础很大：Eurostat 称，2024 年 16-74 岁 EU 居民中 93% 是近期互联网用户，67%
              使用互联网银行。结构性银行口径保守得多：ECB 识别出截至 2024 年底欧元区约 60 家纯数字银行，但其资产份额仍只有 3.9%。资金口径指向真正的奖池：EBA 引用 ECB 的存款数据显示，2023
              年隔夜、通知和定期三类家庭存款合计约 €10.2 trillion；ECB 的家庭门户也显示，进入 2025 年末，储蓄和金融投资活动仍处于较高水平。


              变现口径也反对把 N26 当成单一产品的卡应用。Monzo 报告超过 1.6 million 订阅和 £25.7 billion 存款；Revolut 报告 2024 年订阅营业额 $541
              million、财富收入 $647 million，以及 $38 billion 余额；Wise
              则在不依赖经典传统银行主账户模式的情况下，搭出了可观的持有余额池。这些可比公司信号让高级银行服务、存款获取和投资邻接变得具体。与此同时，供应商新银行市场研究互相矛盾，只能当作方向性标记：Mordor 给出的
              2026 年欧洲规模是 $4.1 billion，而 Market Data Forecast 是 $19.66 billion。两者差距过大，若压成一个干净 TAM，会夸大精确度。
