      - CV044
      - CV046
  - id: TV006
    title: 催化因素与估值风险图
    columns:
      - 触发因素
      - 门槛或事件
      - 估值传导
      - 可能影响
    rows:
      - - 高于 ~$6B 的干净新融资
        - 完成融资轮或要约收购，普通股条款简化
        - 验证当前高端标记，降低不确定性折价。
        - 适度上行重估。
      - - 全年盈利证明
        - 全年净利润为正，或多季度盈利能力明确可持续
        - 支持按高溢价私营金融科技公司估值，而不是纯粹按扭亏逻辑估值。
        - 若增长稳定，区间上移。
      - - 监管正常化
        - 整改进展可见，或关键监管压力解除
        - 让投资人更多为存款业务付费，而不是为风险缓冲打折。
        - 收窄下行折价。
      - - 融资轮在 ~$3B-$4B 附近成交
        - 要约、老股或融资价格接近 2023 年反向参照
        - 证明更严苛的老股交易纪律胜过乐观数据库汇总。
        - 立即下修重置。
      - - 优先权 / 保底回报包袱被证实沉重
        - 新披露显示普通股经济性弱于表面价格暗示
        - 即使表面估值听起来可接受，也会压低有效股权价值。
        - 普通股股东承压。
      - - IPO 时间再次后移或治理压力上升
        - 流动性事件继续后推，或董事会与创始人冲突升级
        - 拉长私募市场折价，提高执行风险。
        - 倍数压缩，入场时点变慢。
    notes: 这些触发因素旨在把估值判断迅速从叙事舒适区推向可观察的承销验证事件。
    claimRefs:
      - CV014
      - CV016
      - CV017
      - CV018
      - CV038
      - CV039
      - CV043
      - CV044
      - CV045
      - CV046
  - id: TV007
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 责任方或尽调路径
    rows:
      - - 股权结构表与优先权
        - 当前优先股堆叠、任何保底回报机制、清算分配瀑布，以及各轮稀释情况。
        - 表面估值可能大幅高估普通股价值。
        - 对章程、附函和投资人权利做法律与财务尽调。
      - - 2025 年融资轮状态
        - 谈判是否形成已签署交易、成交价格是多少、新股与老股分别流转了多少资金。
        - 一笔真实完成的成交价格会解决当下大部分区间争议。
        - 管理层、董事会材料和投资人确认。
      - - 客户盈利队列
        - 按收入相关客户队列和高级订阅层级拆分的贡献利润率及经损失调整后的盈利能力。
        - 必须据此判断 N26 的客户价值应接近 Revolut，还是接近估值较低的私营同业。
        - CFO 材料包加队列分析复核。
      - - 存款经济性
        - 存款 beta、资金收益率假设，以及利润中利率相关部分与经常性收费通道的占比。
        - 决定 2024 年盈利是可持续，还是主要由周期驱动。
        - 结合月度桥接的资金 / 财务尽调。
      - - 监管退出标准
        - 具体整改里程碑、资本附加要求，以及恢复完全正常化增长和产品自由度的条件。
        - 如果看不清监管正常化，银行牌照资产视角就无法成立。
        - 监管尽调、律师复核和董事会风险委员会材料。
      - - 近期老股成交与内部估值标记
        - 409A 估值标记、员工要约，以及 2023 年股权出售周期之后的任何投资人之间转让。
        - 说明公开的 $3B-$6B 争论是否贴合私下真实情况。
        - 董事会材料、转让日志和老股经纪核查。
    notes: 这些是把建议从继续研究推进到价格敏感型投资决定所需的最低问题清单。
    claimRefs:
      - CV018
      - CV041
      - CV043
      - CV044
      - CV045
      - CV046
      - CV048
      - CV049
