      - number: '5.2'
        title: 应用内的储蓄、投资与信贷轨道
        blocks:
          - type: paragraph
            body: >-
              N26 拓宽产品的逻辑，在储蓄、投资和流动性产品嵌入银行应用的方式上最清楚，而不是拆成独立品牌。公开投资界面显示，菜单现在覆盖免手续费股票和
              ETF、现成基金、加密货币，以及全自动储蓄计划，全部被呈现为同一账户关系的延伸。最强的结构性要点是，N26 似乎并不自己拥有每条轨道。股票和 ETF 页面写明 Upvest 是执行和托管合作伙伴；加密货币页面则称
              Bitpanda Asset Management 负责交易和冷存储托管。这种合作伙伴主导设计让 N26 能快速拓宽范围，但也意味着部分经济性、执行质量和控制边界位于银行直接披露的产品栈之外。


              可用性和资格约束几乎和宽度一样重要。N26 自有页面反复提示，投资产品因国家而异，工具数量按市场不同而变化，Instant Savings
              同时取决于会员等级和地理位置。贷款更加碎片化。德国信贷概览称，贷款、透支和 Installments 目前只面向符合资格、在德国开户且有足够交易历史的账户；但 iOS 和 Android
              应用商店文案又营销了更广国家覆盖的透支和信贷。最稳妥的承保结论不是 N26 缺乏宽度——它显然不缺——而是宽度来自一张由产品特定合作伙伴轨道、资格规则和国家上线节奏拼成的网。这支持交叉销售潜力，但也制造 UX
              摩擦，并让头条产品宽度看起来比公开资格矩阵真实情况更平滑。
