          note: 远程 KYC 和基于手机的开户降低摩擦，也抬高 AML 筛查重要性。
        - id: fund
          label: 作为第二账户注资
          note: 客户测试转账、卡消费或储蓄，但尚未把 N26 作为主银行。
        - id: anchor
          label: 用信任和资金流入扎根
          note: 工资入账、存款保护带来的安心感和可靠支付，决定余额能否加深。
        - id: expand
          label: 扩展到高级订阅和投资
          note: 高级计划、即时储蓄、ETF 或灵活现金基金提升 LTV 和切换成本。
      edges:
        - from: discover
          to: onboard
        - from: onboard
          to: fund
        - from: fund
          to: anchor
        - from: anchor
          to: expand
    approximationNotes: 这是定性路径，不是实测转化漏斗。公开证据没有提供 N26 各阶段特定转化率。
