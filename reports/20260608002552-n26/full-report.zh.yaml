      - number: '3.3'
        title: 定价、产品宽度与变现
        blocks:
          - type: paragraph
            body: >-
              N26 的定价仍然清晰且相对易获得：Standard 免费，Smart 每月 €4.90，Go €9.90，Metal €16.90。N26 Business Smart 也为
              €4.90，但仅限以个人法定姓名经营的自由职业者和自雇人士。N26 现在的宽度已经超过早期极简口碑：它提供股票和 ETF、通过 Bitpanda 提供加密货币、带返现的商业子账户，以及覆盖超过 100
              个目的地的旅行 eSIM 计划。问题不是绝对缺产品，而是深度和推出节奏不均。加密货币只在七个市场可用，股票和 ETF 并非覆盖所有国家，商业产品也明显窄于 Revolut Business 和 Starling
              Business 那类多用户、重工作流平台。


              Revolut 在宽度和变现上拉开最远。它的消费者产品栈现在从免费延伸到每月 £55；Revolut Business 从 £10 起步，并扩展到收款、司库、集成和更丰富的团队控制。bunq 比 N26
              建立了更强的生活方式订阅身份，将 pockets、加密货币、投资、eSIM、旅行保险和清晰分层定价组合在一起。Starling 和 Monzo
              国际化程度较低，但各自在本土市场的切换、储蓄或商业账户习惯形成上更深。Wise 只按使用、以中间市场汇率收费，压缩了 N26 的旅行和 FX 故事；对不想完整替换活期账户的跨境用户而言，这会削弱 N26
              订阅变现的差异化。
