chapter:
  number: 7
  title: Risks
  summary: N26’s real risk register is dominated by live supervisory and control risk, not immediate liquidity distress. BaFin’s December 2025 measures, the May 2024 AML-reporting fine, and N26’s own 2024 filings show that remediation is still incomplete even though deposits, customer growth, and profitability improved sharply after the June 2024 cap lift. That leaves a rate-sensitive earnings model, fresh governance transition, customer-friction exposure, and outsourcing-dependent operations vulnerable to any renewed enforcement or execution miss.
sections:
- id: regulatory-and-control-risk
  title: Repeated supervisory intervention keeps regulatory and control risk at the top of the register
  body: |-
    N26’s central risk is not raw balance-sheet fragility but the fact that Germany’s supervisor is still finding control failures after years of remediation. BaFin’s December 2025 package is unusually direct: it says the bank lacked a proper business organization, identifies serious deficiencies in risk management, complaints management, and the organization of lending, and then layers on a special representative, extra own-funds requirements, and a ban on new Dutch mortgage origination. Reuters and Banking Dive confirm that these were not symbolic comments but binding supervisory measures tied to a 2024 special audit and the 2024 accounts review. That matters because it turns compliance from a background cost into a live growth, product, and governance constraint.

                The May 2024 €9.2 million fine and the June 2024 cap lift should be read together rather than as offsetting headlines. The fine showed BaFin still regarded N26’s suspicious-activity-reporting failures as serious and systematic, even though the bank had already provisioned for the penalty and described major remediation spending. The cap lift then reopened customer growth, which helped drive profitability and deposit expansion, but N26’s own filings show management still expected additional supervisory measures from the 2024 audit and was working through open governance, risk-controlling, and treasury-related deficiencies into 2026. The underwriting implication is straightforward: N26 can grow under supervision, but the downside case is any renewed enforcement that again limits product rollout, raises capital drag, or undermines the claim that the control environment is finally normalizing.
