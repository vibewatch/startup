- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - risk
  - monitorable trigger
  - threshold / event
  - action implication
  rows:
  - - Regulatory remediation slippage
    - BaFin orders, leadership approvals, or company disclosures
    - Special representative persists or new measures appear after the stated remediation window
    - Pause any underwriting upgrade and assume growth or product freedom can tighten again.
  - - Rate-sensitive earnings compression
    - ECB rate path, reserve yields, and deposit-growth trend
    - Interest-driven earnings shrink materially without fee growth filling the gap
    - Re-rate the model as more cyclical and lower-quality than the current profit story implies.
  - - Customer-friction deterioration
    - Complaint backlog, blocked-account litigation, public support escalations
    - Formal complaints and access-dispute evidence rise faster than customer growth
    - Assume weaker retention, more regulatory heat, and higher service cost.
  - - Operational reliability deterioration
    - Status monitors and management diligence
    - Repeated login or account-access incidents recur over multiple months without transparent fixes
    - Raise operational and reputation risk and haircut premium-multiple assumptions.
  - - Governance transition stalls
    - Approval status of key hires and board stability
    - CEO / COO / board approvals are delayed or leadership keeps churning
    - Treat control remediation as fragile and extend the high-risk governance window.
  - - Dutch lending restrictions persist
    - Regulatory updates and lending disclosures
    - Netherlands mortgage restrictions remain in force or broaden into other credit products
    - Lower conviction on lending diversification and assume narrower medium-term earnings mix.
  notes: These are observable thesis-break or mitigation markers rather than generic strategic worries.
