- id: governance-mitigants-and-triggers
  title: Management reinforcement helps, but investability still depends on observable trigger outcomes
  body: |-
    There are real mitigants in the file, and they should not be ignored. N26 remains a fully licensed German bank, says deposits are protected up to €100,000, ended 2024 with a 26.2% CET1 ratio and 423% LCR, and describes a 30-day liquidity buffer plus ECB-eligible collateral for emergency funding. The company has also clearly decided not to defend the old governance setup at all costs. Instead, it refreshed the supervisory board, appointed a new CEO subject to BaFin approval, and reorganized operations, technology, and legal under a new COO. Those actions do not erase the control failures that triggered them, but they do mean management and shareholders are now behaving as though credibility has to be rebuilt rather than merely asserted.

                That is why the most important output of this chapter is not a static severity score but a trigger framework. If BaFin removes the special representative and capital add-ons, Dutch mortgage restrictions are lifted, and complaint backlogs normalize without renewed enforcement, the residual risk case improves materially. If instead key hires are delayed in approval, access incidents keep recurring, or lower rates expose how dependent earnings were on treasury and reserve income, the present bull case weakens quickly. N26 is therefore investable only on a monitored basis: the upside rests on remediation becoming durable enough that profitability survives under cleaner governance, lower rates, and normal competitive pressure. The downside is that the bank has already shown how quickly a control problem can move from compliance cost into growth, product, and valuation risk.
