  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: regulatory-exit-criteria
    missingEvidence: Detailed remediation tracker, capital add-on size, special-representative remit, and BaFin exit criteria for the 2025 measures package.
    whyItMatters: These items determine whether the top risk is nearing closure or merely being managed in public without a clear supervisory off-ramp.
    diligencePath: Request the latest board or risk-committee remediation dashboard, supervisor correspondence, and dated closure evidence against each finding.
    relatedQuestionRefs:
    - QR001
    - QR004
    - QR006
    - QR026
    - QR030
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: complaint-metrics
    missingEvidence: Complaint volumes, blocked-account incidence, investigation cycle times, ombudsman outcomes, and formal-resolution SLAs by market.
    whyItMatters: Public anecdotes and legal examples establish risk direction, but only internal service metrics can show whether the customer-friction problem is shrinking or compounding.
    diligencePath: Request monthly complaints and investigations packs, backlog aging, freeze-duration distributions, and legal-escalation counts for 2025-2026.
    relatedQuestionRefs:
    - QR016
    - QR017
    - QR018
    - QR019
    - QR028
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: outsourcing-topology
    missingEvidence: Named critical vendors, material-outsourcing register, vendor concentration, outage SLAs, and postmortem evidence for severe incidents.
    whyItMatters: The filing says technology and outsourcing risk are substantial, but investors still lack visibility into which vendors matter most and how failures are actually governed.
    diligencePath: Request the material-outsourcing inventory, top-vendor scorecards, incident postmortems, and audit results for customer-support and technical-development providers.
    relatedQuestionRefs:
    - QR013
    - QR014
    - QR015
    - QR028
    relatedTableRefs:
    - TR002
    - TR003
  - type: private-evidence-only
    severity: material
    topic: rate-and-country-sensitivity
    missingEvidence: Country-level deposit concentration, product-level margin bridge, Dutch mortgage economics, and sensitivity analysis under lower ECB rates.
    whyItMatters: The current profit story looks strong partly because rates and unrestricted growth aligned in 2024; private sensitivity work is needed to test what remains if either tailwind fades.
    diligencePath: Request product P&Ls, treasury yield bridge, country and deposit-cohort concentration, and rate-down scenario analysis used in 2025 planning.
    relatedQuestionRefs:
    - QR007
    - QR008
    - QR009
    - QR010
    - QR027
    relatedTableRefs:
    - TR003
    - TR005
