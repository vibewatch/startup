chapter:
  number: 2
  title: Market Analysis
  summary: N26's relevant market is best defined as EU and EEA consumer banking plus adjacent digital personal-finance layers rather than as a single generic neobank TAM. Public evidence supports a large opportunity across digital adoption, deposits, premium banking, and in-app investing, but also shows durable constraints from trust, price-sensitive deposits, AML burden, national fragmentation, and contradictory third-party market-size estimates.
sections:
- id: market-boundary
  title: Market boundary and what is in or out
  body: |-
    N26 should be underwritten against a narrower market boundary than a generic “global neobank TAM.” Its public surfaces show a consumer bank that bundles a current account, paid premium plans, instant savings, stocks and ETFs, and now a money-market-fund style cash product. That means the relevant spend pool is EU and EEA retail transaction banking plus the attached layers of subscription fees, deposit and savings balances, payment activity, and in-app investing or cash management. The company's own onboarding, salary-IBAN, and virtual-card flows reinforce that this is a mobile-first personal-finance relationship rather than a branch, SME, or corporate treasury workflow.

    What stays out matters just as much. N26 is not presently competing for the full economics of SME and corporate banking, mortgage-led retail franchises, insurance manufacturing, or branch-based advisory revenue. Those pools may matter indirectly through competitors, but they should not be smuggled into this chapter's TAM. EU regulation is simultaneously raising the floor on digital retail banking functionality: instant-payments policy pushes every reachable account toward 24/7 account-to-account transfers, while digital adoption is already high. With 67% of EU residents aged 16-74 using internet banking in 2024 and payment-account penetration already high across member states, the market question is less “can customers bank digitally?” and more “which provider wins primary-account trust, balances, and product depth?”
