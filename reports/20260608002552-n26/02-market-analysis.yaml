- id: drivers-and-constraints
  title: Growth drivers and adoption constraints
  body: |-
    The growth case rests on four reinforcing drivers. First, distribution is already digital: 82% of surveyed European customers prefer the website or mobile app as their main channel, and EU internet-banking use is mainstream. Second, payment rails are improving: instant-payments regulation raises baseline speed and convenience expectations across the region. Third, the revenue stack is broadening: comparator disclosures show that subscriptions, balances, wealth, and cross-border holdings can all be monetized once an app bank wins recurring engagement. Fourth, policy is nudging savings toward investable products, which supports N26's move into ETF and cash-fund style products rather than leaving value trapped in low-engagement current accounts.

    The constraint side is equally real. The ECB warns that digital-bank deposits are more price-sensitive and less anchored than those of incumbents, while EBA data show fraud and de-risking remain front-of-mind consumer issues. Oliver Wyman's survey shows convenience is high but security perceptions still lag. AML and supervisory overhead are not fading: AMLA is now live, and BaFin's December 2025 measures package against N26 shows that regulator trust can still constrain product breadth and strategic freedom even after a digital bank reaches scale. Competitive intensity is also rising from both sides: scaled app-bank peers such as Revolut, Monzo, and Wise keep expanding across subscriptions, wealth, and balances, while incumbents such as Santander still sit on vastly larger deposit bases. The most defensible view is therefore that N26 operates in a large market, but one where winning low-cost, trusted, primary relationships is much harder than simply accumulating app installs.
