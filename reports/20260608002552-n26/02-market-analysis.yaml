  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: n26-premium-attach-rate
    missingEvidence: N26 does not publicly disclose current paid-plan subscriber count, attach rate by plan, or subscription ARPU by geography.
    whyItMatters: Without attach and ARPU data, the premium-banking lens can only use peer signals and list-price proxies rather than N26-specific monetization depth.
    diligencePath: Request management KPI pack showing paid-plan users, monthly churn, ARPU, and plan mix by major market for the latest four quarters.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM002
    - TM003
  - type: private-evidence-only
    severity: material
    topic: n26-primary-account-share
    missingEvidence: Public sources do not provide N26's primary-account share, salary-deposit penetration, or deposit mix by product and country.
    whyItMatters: Primary-account usage and deposit depth determine whether N26 is mainly a secondary wallet or a durable funding and cross-sell platform.
    diligencePath: Obtain internal cohort data on salary inflows, direct-deposit penetration, balances per active customer, and primary-account ratios in the top five markets.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM003
    - TM005
  - type: conflicting-data
    severity: material
    topic: vendor-neobanking-tam
    missingEvidence: A bottom-up European neobanking market model that reconciles active users, deposits, payment revenue, premium fees, and wealth revenue using consistent category definitions.
    whyItMatters: The headline 2026 market estimates from vendor reports differ too widely to support underwriting or valuation work on their own.
    diligencePath: Build an internal market model from public-company filings, ECB structural data, and country-level adoption statistics instead of relying on vendor TAM headlines.
    relatedQuestionRefs:
    - QM023
    - QM024
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: minor
    topic: cross-country-primary-account-benchmark
    missingEvidence: There is no harmonized public EU dataset for digital-bank primary-account share or salary-account conversion across countries.
    whyItMatters: This makes Monzo, Revolut, Wise, and N26 comparators directionally useful but not cleanly comparable for market-share conversion analysis.
    diligencePath: Use country switching-service data, bank-survey microdata, or direct management disclosures to estimate primary-bank adoption by market.
    relatedQuestionRefs:
    - QM015
    - QM025
    relatedTableRefs:
    - TM005
