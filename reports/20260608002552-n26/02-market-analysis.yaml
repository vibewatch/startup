- id: sizing-lenses
  title: Multiple sizing lenses instead of one broad TAM
  body: |-
    The safest way to size N26's market is to use multiple lenses and keep incompatible units separate. A digital-adoption lens shows a large reachable base: Eurostat says 93% of EU residents aged 16-74 were recent internet users in 2024 and 67% used internet banking. A structural banking lens is much more conservative: the ECB identified about 60 digital-only banks in the euro area at end-2024, yet their asset share was still only 3.9%. A funding lens points to the real prize: EBA's ECB-sourced deposit figures show roughly €10.2 trillion of household deposits across overnight, notice, and term buckets in 2023, while the ECB's household portal still shows elevated savings and financial-investment activity into late 2025.

    A monetization lens also argues against treating N26 as a single-product card app. Monzo reports more than 1.6 million subscriptions and £25.7 billion of deposits; Revolut reported $541 million of subscription turnover, $647 million of wealth revenue, and $38 billion of balances in 2024; Wise has built a sizable holdings pool without relying on a classic incumbent primary-account model. These comparator signals make premium banking, deposit capture, and investing adjacency tangible. At the same time, vendor neobanking market studies are contradictory enough that they should be used only as directional markers: Mordor puts Europe at $4.1 billion in 2026, while Market Data Forecast says $19.66 billion. Those figures are too far apart to collapse into one clean TAM without overstating precision.
