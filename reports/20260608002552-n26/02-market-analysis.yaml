- id: TM005
  title: Comparable monetization and primacy signals
  columns:
  - Company / lens
  - Latest public metric
  - Why it matters for N26
  - Comparability limit
  rows:
  - - Monzo
    - 15.2m customers; 49% of MAUs use Monzo as primary bank; £25.7bn deposits; 1.6m+ subscriptions
    - Shows that primary-account conversion, subscriptions, and deposits can coexist in an app-bank model.
    - UK-centric and not N26 geography matched.
  - - Revolut
    - 52.5m customers; $38bn balances; $541m subscriptions; $647m wealth revenue
    - Shows premium, balance, and wealth monetization at European app-bank scale.
    - Global footprint is broader than N26 and includes non-EU markets.
  - - Wise
    - 15.6m active customers; $33.9bn holdings; $43tn opportunity framing
    - Shows large holdings and strong monetization can exist without classic branch-bank primacy.
    - Wise is more cross-border and infrastructure-oriented than N26.
  - - Santander UK
    - 14m active customers; £176.7bn deposits
    - Highlights the incumbent deposit base app banks compete against for primary balances.
    - UK incumbent benchmark, not a direct N26-like model.
  - - N26 public offer
    - €0/€4.90/€9.90/€16.90 pricing plus savings and investing layers
    - Confirms N26 is pursuing the same multi-product monetization stack, even if public attach data are missing.
    - Public offer reveals pricing but not realized penetration or ARPU.
  notes: Comparator table is intentionally used as a signal set, not as a market-share model; each company optimizes for a different mix of geography, licensing, and product breadth.
