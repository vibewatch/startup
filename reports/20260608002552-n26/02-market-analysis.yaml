- id: TM002
  title: Sizing lens table
  columns:
  - Lens
  - Evidence / value
  - Geography / period
  - Implication for N26
  - Limitation
  rows:
  - - Digital adoption
    - 93% internet use; 67% internet banking
    - EU, 2024
    - Digital distribution is mainstream, so app access is no longer the bottleneck.
    - Adoption says little about primary-account share or monetization depth.
  - - Payment-account saturation
    - 69% to 100% account ownership by EU country; remote opening rising
    - EU, 2021 base with 2024/25 EBA commentary
    - Growth is more about share shift and primacy than first-ever account creation in core markets.
    - Country range is wide and not N26-market specific.
  - - Digital-bank structural share
    - ~60 digital-only euro-area banks; 3.9% asset share vs 3.1% in 2019
    - Euro area, end-2024
    - Digital banks are structurally relevant but still small relative to the banking system.
    - Asset share is not the same as active-user or revenue share.
  - - Household deposit pool
    - €5.675tn overnight + €2.152tn term + €2.374tn notice ≈ €10.2tn total
    - EU, 2023
    - Deposit capture is the largest adjacent pool if N26 can become a primary balances platform.
    - EU aggregate, not N26's addressable share.
  - - Savings / investing adjacency
    - 14.8% saving rate; 2.6% financial-investment growth; EU retail participation still below US despite high savings
    - Euro area / EU, 2025-2026 policy frame
    - Supports N26's move from current accounts into on-app savings and investing.
    - Macro saving and retail-investing stats do not translate directly into N26 conversion rates.
  - - Premium banking lens
    - N26 prices at €0/€4.90/€9.90/€16.90; Monzo 1.6m subscriptions; Revolut $541m subscription turnover
    - Europe, 2024-2026
    - Premium banking is a real revenue layer, not a cosmetic upsell.
    - Peer attach rates and economics are not directly comparable to N26.
  - - Conflicting vendor neobank TAMs
    - Mordor $4.10bn in 2026 vs Market Data Forecast $19.66bn in 2026
    - Europe, vendor reports updated in 2026
    - Use only as directional boundary markers, not a single TAM.
    - Methodology and category scope are clearly inconsistent.
  notes: This table intentionally mixes user-adoption, balance-pool, policy, and vendor-market lenses rather than forcing a single broad TAM; rows are not additive.
