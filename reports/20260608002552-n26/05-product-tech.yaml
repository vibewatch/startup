callouts:
- calloutType: strength
  title: The strongest product signal is breadth inside one regulated mobile shell
  body: Current accounts, Spaces, Instant Savings, investing, crypto, under-18 cards, and credit all show up as extensions of one mobile-bank relationship, which is strategically stronger than a standalone neobank card proposition.
  claimRefs:
  - CE010
  - CE017
  - CE039
- calloutType: risk
  title: Breadth is real, but regional fragmentation and remediation burden are equally real
  body: Product availability differs by country, plan, and even public channel, while BaFin’s 2025 measures show that lending and operating controls still sit under active supervisory pressure.
  claimRefs:
  - CE022
  - CE042
  - CE049
- calloutType: recommendation
  title: Management diligence should go below the PSD2 layer
  body: The next technical diligence step is not asking whether N26 has APIs or mobile engineers — it clearly does. It is asking for core-ledger architecture, incident history, fraud and chargeback KPIs, partner economics, and a country-by-country product availability matrix.
  claimRefs:
  - CE031
  - CE035
  - CE041
