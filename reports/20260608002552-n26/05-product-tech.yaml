- id: TE003
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - N26 solution
  - Public benefit signal
  - Current limitation
  rows:
  - - Open a primary mobile bank account
    - Download app, register, verify identity, pair device, activate card
    - App-native signup with virtual card and smartphone pairing
    - Plans page says account opening and card activation happen from the phone
    - Supported-document and country rules can block onboarding
  - - Organize day-to-day money
    - Keep one main account and manual budget buckets
    - Spaces and Shared Spaces with optional IBANs, card links, and automation rules
    - N26 lets premium users create up to 10 Spaces and invite collaborators
    - Shared Spaces do not provide full shared-ownership economics or card-linked spending
  - - Let a child spend with guardrails
    - Parent funds a child card and monitors usage
    - Under-18 card tied to a parent-managed Space
    - Parents can set limits, see transactions, and lock or unlock the card
    - Product is available only in five countries and children do not get their own app
  - - Earn on cash balances
    - Move idle cash to an interest-bearing balance
    - Instant Savings inside the N26 relationship
    - App-store and plan copy say funds remain flexible and deposit-protected
    - Rates depend on country, plan, and customer cohort
  - - Start investing without leaving the bank app
    - Open a broker separately and fund it manually
    - In-app stocks, ETFs, ready-made funds, crypto, and savings plans
    - N26 says investors can start from €1 and manage everything inside one app
    - Availability, partner rails, and transfer limitations vary by market
  - - Cover short-term liquidity gaps
    - Apply for an external loan or credit line
    - Overdraft, Credit, and Installments in the Finances flow
    - Official pages disclose ranges, rates, and app-native eligibility flow
    - Public availability messages differ across channels and markets
  - - Connect as a regulated TPP
    - Obtain certificates, build Berlin Group integration, monitor changes
    - PSD2 dedicated, fallback, and sandbox APIs with GitHub docs
    - N26 publishes OpenAPI files, Postman collections, and change notices
    - Rate limits and performance details are still only partially disclosed
  - - Secure the account after onboarding
    - Rely on passwords and card hotlines
    - In-app controls, device pairing, Keyless, 2FA, 3D Secure, and push alerts
    - Security page says controls can be changed instantly in-app
    - Public materials do not quantify fraud outcomes or false-positive friction
  notes: Benefits are stated from public product and support materials rather than from audited customer-outcome studies.
