- id: TE004
  title: Technology / operating architecture table
  columns:
  - Layer / process
  - Role
  - Public dependency or evidence
  - Why it matters
  - Current risk / gap
  rows:
  - - Mobile app and paired-device layer
    - Primary user interface for signup, cards, support, savings, and investing
    - Plans page plus app-store listings
    - N26’s distribution and cross-sell engine is mobile-first
    - No deep public architecture for mobile-backend sync or offline resilience
  - - Identity and KYC layer
    - Verify customers and bind devices to accounts
    - Identity-proof and Keyless support docs
    - Controls entry into regulated products and account recovery
    - Country- and document-specific friction can directly reduce conversion
  - - Account and card-control layer
    - Current-account operations, card controls, alerts, and security settings
    - Security page and plans page
    - This is the daily-use core that keeps N26 primary for payments
    - No public incident metrics for card-control or notification reliability
  - - Money-organization layer
    - Spaces, Shared Spaces, joint-account-like money containers
    - Spaces page plus PSD2 repo
    - Shows N26 has a richer internal account model than a single balance
    - Public docs still do not explain the core ledger architecture
  - - Investment and credit partner rails
    - Execution, custody, and liquidity products inside the N26 shell
    - Upvest- and Bitpanda-named official pages plus credit overview
    - Expands breadth without N26 building every rail from scratch
    - Partner economics, SLAs, and risk-sharing are not public
  - - Security platform and cloud operations
    - Internal automation for fraud, security response, and reliable service operation
    - Security page and security-platform job posts
    - Hiring implies real platform engineering beyond front-end UX
    - Job ads are only a proxy for live production architecture
  - - PSD2 interface layer
    - External interoperability for TPPs
    - TPP support pages and PSD2 repo
    - This is the best-documented technical surface N26 exposes publicly
    - It says little about internal core-banking systems beyond the compliance boundary
  notes: The table mixes customer-visible architecture, documented PSD2 interfaces, and hiring-based platform signals because N26 does not publish a single end-to-end architecture whitepaper.
