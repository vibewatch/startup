- id: TE002
  title: Plan / tier comparison
  columns:
  - Plan
  - List price
  - Key everyday features
  - Cash / travel terms
  - Family or saving hooks
  - Current caveat
  rows:
  - - Standard
    - Free
    - Core current account, virtual card, app-based support
    - Germany / rest-Europe baseline often 2 euro withdrawals then €2; non-euro fees can apply
    - Can order one under-18 card for €10
    - Feature floor varies by T&C country and is the most limited tier
  - - Smart
    - €4.90 / month
    - 10 Spaces, premium account UX, more free withdrawals than Standard
    - Germany / rest-Europe baseline often 3 euro withdrawals then €2
    - Can order under-18 cards for up to two children
    - Still lacks the travel-benefit bundle of Go / Metal
  - - Go
    - €9.90 / month
    - 10 Spaces, Shared Spaces, dedicated phone support, travel-oriented premium bundle
    - Worldwide ATM withdrawals and better FX treatment than lower tiers
    - Can order under-18 cards for up to two children
    - Actual ATM rules still vary by T&C country
  - - Metal
    - €16.90 / month
    - Go-like core plus purchase protection and mobile-phone cover
    - Worldwide withdrawals, premium travel benefits, lounge-related perks
    - Can order under-18 cards for up to five children; new-customer savings offer linked to ECB rate
    - Some savings terms differ by country, and not every Metal benefit is equally relevant to every market
  notes: Comparison summarizes the public consumer-plan surface; ATM quotas and FX terms are simplified from support examples and can vary by T&C country.
