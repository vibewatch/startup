- id: security-kyc-and-open-banking-technical-surface
  title: Security, KYC, and the most visible technical surface
  body: |-
    The public technical record is strongest where security or regulation forces N26 to explain itself. On the consumer side, the security page describes a cloud-hosted bank using AI and machine learning for fraud and financial-crime controls, while also giving users direct in-app controls to lock cards, change PINs, set spending limits, and hide sensitive data. Device pairing, biometric authentication, 3D Secure, two-factor authentication, and real-time activity notifications are all positioned as standard parts of the account experience. Keyless is the most specific public control disclosure: the support article says it uses zero-knowledge biometrics, converts the selfie to a cryptographic key, and avoids storing raw biometric data. Onboarding KYC is similarly compliance-shaped. N26 says identity verification depends on nationality, residence, and document type, with photo, video, eID, and bank-account verification variants; if a customer lacks supported documents, the bank simply cannot onboard them.

    The clearest engineering documentation is not for the retail app at all, but for PSD2. N26’s TPP support pages and public GitHub repo describe a Berlin Group 1.3.6 REST API with OAuth 2.0, sandbox support, QWAC certificate requirements, OpenAPI files, Postman collections, and quarterly availability reports. Those materials expose concrete operating constraints — 180-day AIS consents, 15-minute PIS windows, 90-day transaction-history limits outside the early consent window, unpublished rate limits, and differentiated access by certificate role. They also show that N26’s API account model extends beyond the main account to Spaces, joint accounts, and Instant Savings. The implication is important: the bank publishes more precise technical detail when regulation requires interoperability than it does for its internal core-banking, fraud-model, or incident-management architecture. Public technical disclosure exists, but it is uneven and compliance-led.
