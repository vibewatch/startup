  evidenceGaps:
  - type: missing-source
    severity: material
    topic: first-party-status-history
    missingEvidence: A first-party public status page or incident archive covering app, card, payments, savings, and investing availability.
    whyItMatters: Consumer-bank trust depends on operational reliability, but the reviewed source set showed only an unofficial third-party monitor rather than N26-owned uptime evidence.
    diligencePath: Request 12 months of status-page history, incident postmortems, and standard customer-facing uptime commitments.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE005
    - TE006
  - type: missing-source
    severity: material
    topic: core-architecture-disclosure
    missingEvidence: A current architecture or engineering explainer for the core account, payments, fraud, and internal data platform outside the PSD2 boundary.
    whyItMatters: Public technical specificity is concentrated in regulated open-banking docs, which does not fully answer how the core bank platform is built or operated.
    diligencePath: Request internal architecture diagrams, service inventory, resilience patterns, and ownership map for the current-account, card, fraud, and notification stack.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE004
  - type: enumeration-incomplete
    severity: material
    topic: country-availability-matrix
    missingEvidence: A clean country-by-country matrix showing which markets have under-18 cards, Instant Savings, stocks and ETFs, crypto, credit, overdraft, and Installments.
    whyItMatters: Public pages repeatedly say features vary by country, and lending availability is inconsistent across official channels, so product breadth can be overstated without a matrix.
    diligencePath: Request the live market-availability table used by product, support, and compliance teams and reconcile it against app-store copy and help-center copy.
    relatedQuestionRefs:
    - QE012
    relatedTableRefs:
    - TE001
    - TE002
  - type: private-evidence-only
    severity: material
    topic: partner-economics-and-risk-sharing
    missingEvidence: Commercial terms, operational SLAs, and risk-sharing arrangements for Upvest, Bitpanda, Wise, Allianz, and other partner-enabled rails.
    whyItMatters: A meaningful share of N26’s broadened product stack appears partner-enabled, so margin quality and control exposure depend on agreements that are not public.
    diligencePath: Request partner contracts, SLA summaries, outage and loss-allocation clauses, and revenue-share economics by product line.
    relatedQuestionRefs:
    - QE025
    - QE026
    relatedTableRefs:
    - TE004
