- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Current status / maturity
  - Differentiation
  - Public proof
  - Main diligence gap
  rows:
  - - Current account + virtual / physical debit card
    - Retail customer
    - Core / mature
    - App-first onboarding, instant virtual card, wallet activation, smartphone pairing
    - Plans page and app-store listings
    - Need first-party active-user and primary-account rates by market
  - - Premium plans (Smart / Go / Metal)
    - Retail customer upgrading for features
    - Core / mature but region-sensitive
    - Paid tiers layer cash, travel, support, and protection benefits onto one account
    - Plans page plus Go / Metal support pages
    - Need subscriber counts, attach rates, and realized plan mix
  - - Spaces and Shared Spaces
    - Budgeting households, roommates, premium users
    - Core / mature
    - Sub-accounts can link cards and IBANs; Shared Spaces add collaborative budgeting
    - Spaces page and PSD2 docs
    - Need adoption split between individual Spaces, Shared Spaces, and joint accounts
  - - Under 18 family card
    - Parents and children aged 7-17
    - New / limited-country rollout
    - Parent-managed child card tied to a dedicated Space with granular controls
    - Under-18 page
    - Need launch KPIs and rollout roadmap beyond five countries
  - - Instant Savings
    - Cash savers
    - Current / geographically fragmented
    - Integrated savings account with plan- and cohort-specific rates, including ECB-linked Metal offer
    - Plans page and app-store listings
    - Need live country-by-country rate table and deposit balances by plan
  - - Stocks, ETFs, and ready-made funds
    - Retail investors
    - Current / partner-enabled
    - Free stock and ETF trading plus in-app portfolio and savings-plan flow
    - Invest and stocks-and-ETFs pages
    - Need partner economics, asset balances, and trade-activity disclosure
  - - Crypto
    - Retail traders
    - Current / partner-enabled and limited-country
    - 400+ coins with Bitpanda-powered trading and cold custody inside the banking app
    - Crypto page
    - Need take rates, spread mechanics, and custody / insolvency detail
  - - Credit, overdraft, and Installments
    - Eligible borrowing customers
    - Current / highly eligibility-gated
    - Loan, overdraft, and BNPL-like installment products within the bank relationship
    - Credit overview and product pages
    - Need a clean country matrix and credit-performance metrics
  - - PSD2 open-banking interfaces
    - TPPs and integrators
    - Current / well documented
    - Dedicated, fallback, and sandbox interfaces with GitHub-hosted technical docs
    - TPP support page and PSD2 repo
    - Need disclosure of standard rate limits and first-party uptime history
  notes: Matrix reflects publicly visible consumer and partner-enabled modules as of 2026-06-08, not internal SKU packaging or every market rollout variant.
