company:
  name: N26
chapter:
  number: 1
  title: Company Overview
  summary: 'N26 is a Berlin-based digital bank founded in 2013 that publicly claims over 8 million customers across 24 markets, with growth reaccelerating after BaFin lifted its customer cap in June 2024 and the company reporting its first quarterly profit in Q3 2024. The same public record shows a more complicated control story: founders have handed day-to-day leadership to external banking operators, valuation markers have fallen from the 2021 $9 billion Series E peak to a 2023 secondary marker near $6 billion, and BaFin imposed a fresh measures package in December 2025 over governance and lending-control deficiencies.'
sections:
- id: identity-and-product-scope
  title: Identity, license, and product scope
  body: 'The safest current identity record for N26 comes from its own homepage and policy statements rather than from older profile pages that are no longer live. N26 presents itself as a fully mobile bank supervised by BaFin, operating under a full German banking license with deposit protection up to €100,000. The homepage also establishes the broadest current reach claim: N26 says it operates in 24 markets and serves over 8 million customers. That number should not be conflated with the narrower financial-disclosure metric of 4.8 million “revenue-relevant” customers, which refers to users who have completed KYC and hold an open account. For later chapters, the distinction matters because the top-of-funnel installed base and the monetized customer base clearly diverge.


    The business model is now wider than the original checking-account narrative. Public product surfaces show a stack that combines free and paid current accounts with instant savings, stocks and ETFs, crypto, and adjacent lending or investment products. In 2026, N26 added a children-and-family card product and a money-market fund wrapper, reinforcing that the company is trying to become a broader financial operating system rather than just a card-led neobank. The model appears to monetize through subscriptions, interest income on deposits and lending, and activity-based financial products. The strongest caveat is that the headline scale story still comes largely from company disclosures, so later underwriting should treat current customer and product-usage figures as directionally strong but not independently audited.'
