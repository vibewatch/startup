  - id: TV007
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Cap table and preferences
        - Live preference stack, any guaranteed-return mechanics, liquidation waterfall, and dilution by round.
        - Headline valuation can materially overstate common-equity value.
        - Legal and finance diligence on charter, side letters, and investor rights.
      - - 2025 round status
        - >-
          Whether discussions produced a signed deal, what price cleared, and how much primary versus secondary capital
          changed hands.
        - A real completed print would settle much of today's range debate.
        - Management, board materials, and investor confirmations.
      - - Customer profitability cohorts
        - Contribution margin and loss-adjusted profitability by revenue-relevant customer cohort and premium tier.
        - Needed to know whether N26 deserves customer values closer to Revolut or to lower private peers.
        - CFO packet plus cohort analytics review.
      - - Deposit economics
        - Deposit beta, treasury yield assumptions, and the share of earnings tied to rates versus recurring fee rails.
        - Determines whether 2024 profitability is durable or mostly cyclical.
        - Treasury / finance diligence with monthly bridge.
      - - Regulatory exit criteria
        - >-
          Concrete remediation milestones, capital add-ons, and conditions for returning to fully normalized growth and
          product freedom.
        - The bank-franchise lens cannot clear without a view on supervisory normalization.
        - Regulatory diligence, counsel review, and board risk committee materials.
      - - Recent secondary prints and internal marks
        - 409A marks, employee tenders, and any investor-to-investor transfers after the 2023 stake-sale cycle.
        - Shows whether the public $3B-$6B debate matches private reality.
        - Board materials, transfer logs, and secondary-broker checks.
    notes: >-
      These are the minimum asks required to move the recommendation away from research-more and toward a price-aware
      investment decision.
