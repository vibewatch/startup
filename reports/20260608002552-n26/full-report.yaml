        - Roughly ~$5.5B-$7.0B. This keeps N26 below the old peak but allows a premium above public listed-fintech math.
        - Possible, but it requires both operating follow-through and cleaner term / governance evidence.
        - A better headline can still hide weak common-equity economics if terms are investor-protective.
      - - Base
        - >-
          2024 progress is real, but round terms stay opaque and valuation remains below the old peak while above harsh
          public-comp outcomes.
        - >-
          Roughly ~$4.0B-$5.5B. This range gives N26 credit for deposits, growth, and early profitability without paying
          peak or IPO-ready scarcity pricing.
        - Most plausible public-only case because it bridges improved operations with unfinished price discovery.
