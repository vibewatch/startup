      - number: '6.2'
        title: Acquisition recovered quickly after the BaFin cap lift and product breadth now drives deeper engagement
        blocks:
          - type: paragraph
            body: >-
              The clearest customer-growth signals came after BaFin removed the onboarding cap in mid-2024. N26 said
              monthly sign-ups exceeded 200,000, 73% of new customers were acquired through word of mouth, and
              revenue-relevant customers were on track to rise from 4.2 million to 4.8 million by end-2024. That
              combination matters because it suggests customer acquisition is not being bought entirely through
              marketing spend; at least by N26’s own disclosure, the brand still benefits from organic advocacy.
              Independent coverage broadly repeated those figures, which is enough to treat the acceleration as real
              even if the exact customer mix by market remains private.


              The stronger insight is that N26 is trying to turn those new users into broader financial relationships.
              The 2024 company update ties higher customer activity to stocks and ETFs, crypto, instant savings, and
              joint accounts, while the Play Store listing markets the same bundle as one app for banking, saving,
              investing, business finances, and shared accounts. Joint Accounts add a second adult financial
              relationship with a dedicated IBAN and card-linking, while under-18 cards and freelancer accounts push the
              platform into family and self-employed workflows. Those surfaces are not proof of retention on their own,
              but they are credible mechanisms for raising switching costs and average revenue per user if customers
              adopt them as their primary financial hub.
