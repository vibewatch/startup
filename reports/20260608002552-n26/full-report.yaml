      - number: '6.4'
        title: Retention potential is visible, but public durability and concentration data are still missing
        blocks:
          - type: paragraph
            body: >-
              N26’s public retention clues are directional rather than definitive. Word-of-mouth acquisition, large
              transaction volumes, and the company’s push into joint accounts, family cards, savings, investing, and
              premium tiers all point toward a strategy of becoming a primary financial operating system instead of a
              low-engagement spare card. Sacra’s estimate that about 30% of revenue-relevant customers pay for premium
              features, with higher engagement and deposit balances, fits that strategy and helps explain why deposits
              and interest income became so important. Freelancer and business-adjacent products also create a plausible
              land-and-expand path from personal finance into self-employed cash management.


              Still, the chapter cannot prove durability the way a software diligence process would. There is no public
              NRR, GRR, logo churn, premium-tier subscriber count, business-customer count, or concentration disclosure
              by country, plan, or deposit cohort. That means the customer story is supportable at the level of adoption
              and monetization mechanisms, but not at the level of renewal economics. The underwriting implication is
              that N26 likely has a real primary-account cohort and credible expansion paths, yet private diligence
              still needs plan-level subscriber mix, retention cohorts, blocked-account incidence, complaints-resolution
              SLAs, and country-level customer or deposit concentration before customer quality can be underwritten with
              high confidence.
