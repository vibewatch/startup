    rows:
      - - Total assets
        - €10.8788bn
        - €8.3796bn in 2023
        - N26 is now a meaningful balance-sheet institution, not only an app-distribution story.
        - Asset growth can reduce capital ratios even if earnings improve.
      - - Customer deposits
        - €10.3544bn
        - €7.8006bn in 2023
        - Deposit funding is the core balance-sheet engine.
        - Deposits are liabilities; quality depends on stability, pricing, and regulatory treatment.
      - - Customer loans
        - €3.1390bn
        - €2.6615bn in 2023
        - N26 is deploying balance-sheet capacity into lending.
        - The mix includes mortgages and municipal loans rather than only consumer lending.
      - - Mortgage loans
        - €1.0749bn
        - €562.1m in 2023
        - Mortgage exposure was scaling before BaFin froze new Dutch originations.
        - This is a balance-sheet stock, not new-origination volume.
      - - Municipal loans
        - €1.7024bn
        - €1.7598bn in 2023
        - Part of excess deposits are invested in relatively low-risk lending assets.
        - Municipal lending is not the same economics as core retail banking.
      - - Group equity
        - €462.1m
        - €506.0m in 2023
        - Capital remains positive and sizable.
        - Equity still declined because losses continued.
      - - CET1 ratio
        - 26.2%
        - Target met in FY2024
        - Year-end capital headroom looked strong on the filed snapshot.
        - Management also disclosed BaFin tolerance around own-funds recognition in 2024.
      - - Leverage ratio
        - 4.0%
        - Down 110 bps YoY
        - The bank remained above minimum leverage requirements.
        - Management expects leverage to be lower again at end-2025 as the balance sheet grows.
      - - LCR / NSFR
        - 435.6% / 198.0%
        - Minimum LCR requirement is 100%
        - Near-term liquidity looked robust.
        - Strong liquidity does not eliminate supervisory restrictions or add-ons.
