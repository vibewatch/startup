  - id: TI006
    title: Public financial gaps table
    columns:
      - Missing metric
      - Why it matters
      - Best public proxy
      - Remaining blocker
      - Exact diligence path
    rows:
      - - ARR-style recurring revenue bridge
        - Needed to separate durable recurring economics from rate-driven and transactional revenue
        - Premium fees plus payment and interest lines in the filing
        - No disclosed recurring bridge by stream or cohort
        - >-
          Request monthly revenue bridge split into subscriptions, payments, interest spread, lending, and partner
          products.
      - - Gross margin by stream
        - Determines whether profit scales like software, payments, or regulated banking spread
        - None beyond net interest / net commission and cost totals
        - No public cost-of-service split by product or channel
        - Request gross profit by stream, including funding cost, scheme costs, support cost, and compliance overhead.
      - - CAC and payback by market
        - Consumer-fintech scale can look attractive while paid acquisition is still poor
        - 73% word-of-mouth share in 2024
        - Referral-heavy growth is not the same as full CAC transparency
        - Request paid versus organic acquisition mix, CAC, payback, and activation by country.
      - - Premium-subscriber and primary-account counts
        - Necessary to judge subscription durability and deposit depth
        - 4.8m revenue-relevant customers
        - Revenue-relevant users are not disaggregated into paying, primary, or profitable cohorts
        - Request premium subscribers, salary-account users, and average balances by segment.
      - - NRR, churn, and cohort retention
        - Cross-sell quality and lifetime value cannot be inferred from customer-count growth alone
        - None
        - No public cohort disclosures exist
        - Request cohort retention tables for deposits, premium plans, lending, and wealth products.
      - - Customer concentration
        - A few markets or balance-heavy cohorts could drive the economics
        - Company says Germany, France, and Spain are main markets
        - No revenue, deposit, or credit concentration by geography or cohort
        - Request top-market and top-segment concentration schedules.
      - - Exact post-Dec-2025 capital add-ons
        - Without the supervisory stack, CET1 headroom is hard to interpret
        - BaFin confirms higher capital requirements exist
        - Magnitude, buffers, and remediation triggers are not public
        - Request full capital stack, add-on letters, and remediation milestones from management.
      - - Current 2025-2026 exit-rate earnings
        - The 2024 filing and Q3 2024 press cycle do not show today’s normalized run rate
        - H2 2025 sustainable-profitability aspiration
        - No FY2025 accounts or 2026 exit-rate disclosures are public
        - Request monthly NOI, net income, and capital-ratio trend since Jan 2025.
    notes: >-
      Private-company opacity is especially severe for SaaS-style metrics such as ARR, gross margin, CAC/payback, and
