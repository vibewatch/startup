      - number: '1.2'
        title: Founders, leadership transition, and governance
        blocks:
          - type: paragraph
            body: >-
              N26 was founded in 2013 by Valentin Stalf and Maximilian Tayenthal, and for years the company’s external
              story was tightly associated with the founder pair as co-CEOs. That founder-led model is now visibly
              changing. Official press releases show that Mike Dargan, an external banking executive from UBS, was
              appointed CEO effective April 2026, while Tayenthal stepped away from operational duties at the end of
              2025. In the handover period, CFO Arnd Schwierholz and Marcus W. Mosen were tasked with interim co-CEO
              responsibilities, and the supervisory board refreshed its composition in March 2026 by replacing Peter
              Kleinschmidt with Stefan Ermisch. A May 2026 management update added Aytac Aydin and expanded Daniel
              Lappas’s remit, suggesting the board is deliberately deepening execution bench strength ahead of a more
              mature operating phase.


              This transition reduces single-founder operating dependency but does not eliminate governance diligence
              risk. The public record is still incomplete on current ownership, full board composition, committee
              structure, and the exact division of control between founders, supervisory board, and late-stage
              investors. That is important because N26 is no longer a simple founder-led startup: it is a regulated bank
              whose credibility now depends on whether professional operators can convert post-cap growth into durable
              control discipline. Public sources support the direction of travel toward institutional governance, but
              they do not yet provide the full roster or control-rights package needed to underwrite governance quality
              with high confidence.
            claimRefs:
              - CO007
              - CO009
              - CO010
              - CO011
