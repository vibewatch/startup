  - id: TP002
    title: Geography, Licence, and Compliance Comparison
    columns:
      - Provider
      - Banking / licence status
      - Core geography
      - Protection model
      - Compliance or trust signal
      - Competitive implication
    rows:
      - - N26
        - Full German bank
        - 24 European markets
        - German DGS up to €100k
        - June 2024 cap lift but Dec 2025 BaFin special monitor, extra capital and Dutch mortgage restrictions
        - Trusted bank architecture but materially weakened by recurring supervisory issues
      - - Revolut
        - Banking entities plus broad multi-country stack
        - Pan-European plus global expansion
        - Protected where banking entity applies; broad customer-balance base
        - 2024 report says risk function grew 30% while customer balances hit $38bn
        - Best direct rival because it combines scale with bank-adjacent and superapp breadth
      - - bunq
        - Full Dutch bank
        - EU-wide; UK and US expansion ambitions
        - Dutch DGS up to €100k
        - Profitable for consecutive years and pushing new licences
        - High-overlap premium EU peer with stronger momentum than N26
      - - Monzo
        - Full UK bank
        - Primarily UK
        - FSCS protection
        - CASS-enabled switching and large UK customer base support primacy
        - Benchmark for engagement rather than a broad pan-European substitute
      - - Starling
        - Full UK bank
        - Primarily UK retail and SME
        - FSCS protection
        - 34.5% primary-relationship metric and 450k+ business customers
        - Strong primacy and SME benchmark, but limited direct overlap with continental N26
      - - Wise
        - EMI / safeguarded-funds model
        - Global cross-border and SME
        - Safeguarding rather than classic bank deposit guarantee
        - High trust on price transparency, lower trust on primary-bank functionality
        - Powerful substitute for international money movement, weaker substitute for salary-account banking
      - - Vivid
        - Luxembourg/Dutch regulated e-money and investing stack
        - Europe, especially companies and freelancers
        - Customer money segregated / safeguarded rather than classic bank DGS relationship
        - High-yield and brokerage pitch offsets weaker classic-bank trust
        - Competitive mainly in DACH-adjacent finance superapp use cases
      - - Barclays / HSBC
        - Legacy incumbent banks
        - UK and international mass market
        - FSCS / statutory bank protection
        - Large app-user bases and existing salary-account trust
        - Remain the status-quo substitute N26 still has to dislodge
