      - number: '4.4'
        title: Financial verdict and the data that still block underwriting
        blocks:
          - type: paragraph
            body: >-
              N26 is now far enough along that the financial debate is no longer whether there is a business. There
              clearly is: filed revenue is real, deposits are real, the bank has moved close to break-even, and
              monetization spans subscriptions, payments, interest spread, lending, and newer wealth products. But it is
              still not a transparent private-company underwriting case. Public materials do not disclose gross margin
              by stream, ARR-style recurring revenue, premium-plan subscriber counts, revenue concentration, credit
              vintages, CAC by market, payback, churn, or NRR. Even the core denominator is imperfect: “revenue-relevant
              customers” is useful, but it is not the same as paying subscribers, primary-account households, or active
              profit contributors.


              That opacity matters because N26 sits awkwardly between startup and bank lenses. A SaaS-style investor
              cannot see retention, attach, or contribution margin. A banking analyst cannot fully see post-2025 capital
              add-ons, exact supervisory buffers, or the current earnings exit rate after the 2024 filing period. The
              supportable verdict is therefore positive but qualified: N26’s 2024 filing shows a much stronger financial
              institution than the cap-constrained 2021-2023 story suggested, yet the quality of future earnings still
              hinges on rate conditions, treasury management, remediation costs, and disclosure that remains private.
