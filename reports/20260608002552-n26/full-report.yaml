  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Filed FY2024 picture and why the group structure matters
        blocks:
          - type: paragraph
            body: >-
              The strongest financial evidence for N26 is no longer only startup-style press guidance. The FY2024
              consolidated report filed for N26 SE shows that N26 is a group headed by a financial holding company, with
              N26 Bank SE driving most economics and the parent providing services to the bank. That matters because
              readers who only track revenue headlines can miss the regulated-bank structure, the parent-to-bank support
              arrangements, and the fact that some disclosed figures sit at group level while others sit at N26 SE
              standalone level. The filing also makes the business less mysterious: 2024 group gross revenue reached
              €422.3 million, net interest income €144.2 million, net commission income €136.4 million, and group net
              loss narrowed to €42.0 million from €102.4 million in 2023.


              The same filing sharpens the balance-sheet picture behind the public press cycle. Customer deposits ended
              2024 at €10.35 billion and total assets at €10.88 billion, with customer loans of €3.14 billion including
              mortgages, municipal loans, and consumer credit. Liquidity and capital metrics looked strong on the filed
              year-end snapshot—26.2% CET1, 435.6% LCR, 198.0% NSFR, and 4.0% leverage ratio—but those ratios should not
              be read as a clean “problem solved” signal. The 2025 regulatory package and the filing’s own references to
              BaFin tolerance and §44 KWG examination results show that N26’s capital position is acceptable inside
              active supervisory management, not in a vacuum.
