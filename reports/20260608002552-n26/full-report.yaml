      - number: '7.2'
        title: The improved financial picture is real, but the model is still rate-sensitive and margin-fragile
        blocks:
          - type: paragraph
            body: >-
              N26’s 2024 financial rebound is credible, yet it also reveals where the model is most exposed. The annual
              report shows gross revenue of €422.3 million, deposits of €10.4 billion, and much lower losses, while the
              November 2024 growth update tied first-quarter profitability to the return of unrestricted onboarding. But
              the same filings make clear that the earnings mix is still heavily exposed to interest conditions and
              deposit growth. Net interest income reached €144.2 million and was explicitly described as driven by the
              changed rate environment; Sifted reported that roughly half of 2024 revenue came from interest-related
              income. N26’s filing then spells out the structural reason this matters: loans and treasury assets sit
              against non-maturing deposits, creating inherent interest-rate and refinancing-cost risk.

                          That sensitivity would matter less if the competitive backdrop were soft or if the bank had already locked in diversified, repeatable fee economics. Instead, N26 itself warns that traditional banks, other financial-services firms, and fintech competitors could compress margins. TechCrunch’s comparison against already profitable rivals like Revolut and Monzo underlines the pressure: investors may tolerate a delayed earnings ramp only if N26 can show that profitability survives lower rates and normal competition. The Dutch mortgage ban also matters beyond headline optics because mortgage income is one of the few named lending vectors in the filing. Taken together, the financial-model risk is not imminent insolvency; it is that the current earnings bridge is unusually exposed to supervisory freedom, rate levels, and continued deposit-led growth at a time when the broader neobank market is becoming less forgiving.
