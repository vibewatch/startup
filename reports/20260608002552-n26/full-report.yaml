      - number: '4.2'
        title: Monetization mix, pricing surface, and recognition issues
        blocks:
          - type: paragraph
            body: >-
              Revenue quality at N26 is better understood as a diversified retail-bank mix than as a single startup top
              line. The filing says 2024 interest income was powered by treasury, Dutch mortgages, consumer lending, and
              balances at the Bundesbank, while commission income was led by payment services and premium accounts.
              Premium account fees alone were €68.3 million. The November 2024 update also said interest revenue would
              be roughly half of total 2024 revenue, up from 40% in 2023, which means the path to profitability now
              depends heavily on balances, rates, and asset deployment rather than only on card interchange or
              subscription upsell.


              List pricing confirms a broad but not fully transparent monetization surface. Consumer plans remain free,
              €4.90, €9.90, and €16.90 per month; freelancer business accounts add cashback but are still not full SME
              banking; Instant Savings rates are explicitly tiered by plan and move with the ECB environment; stocks and
              ETFs are marketed as fee-free but still carry product costs; and the 2026 Flexible Cash Fund introduces
              money-market-fund economics rather than classic deposit spread. What is missing is realized revenue by
              stream, subscriber counts by tier, attach rates for wealth products, and partner revenue shares. The
              revenue model is supportable; the realized take-rate stack is not public.
