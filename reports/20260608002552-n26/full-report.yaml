  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Historical anchor, reset signals, and why price discovery is still unfinished
        blocks:
          - type: paragraph
            body: >-
              N26 does have one clean public valuation anchor: the October 2021 Series E. The company itself, CNBC, and
              TechCrunch all described a more than $900 million round at a valuation above $9 billion. That mark matters
              because it was a real priced financing event, not a database estimate, but it is now old enough that it
              should be treated as a historical peak rather than an investable current price. The public file since then
              has moved in the opposite direction. Sacra and Business of Apps still carry post-peak market-data markers
              around $6 billion, while much harsher 2023 reporting around Allianz X's attempted stake sale pointed to
              about $3 billion and a steep discount to the peak. The supportable read is not that one number is fully
              right and the others are fake; it is that the market reset hard and public price discovery after 2021 has
              been fragmented, negotiated, and terms-sensitive rather than cleanly cleared.


              That uncertainty is still present in 2025 discussion coverage. Sifted, Business Insider / Gründerszene,
              and Crowdfund Insider all describe fresh-round discussions at a reduced valuation, partial exits for
              Coatue, Third Point, and Dragoneer, and continuing complexity around the economics promised to 2021
              investors. But none of those stories gives a completed price, final structure, or settled common-equity
              outcome. The valuation takeaway is therefore straightforward. N26's last public priced round is real but
              stale; later secondary and database markers are materially lower; and the newest media cycle still
              describes negotiation rather than settlement. For underwriting, that makes price discipline more important
              than headline nostalgia.
