      - number: '8.4'
        title: Catalysts, downside triggers, and the diligence items that would move the call
        blocks:
          - type: paragraph
            body: >-
              The upside path is measurable. If N26 converts first-quarter profit into durable full-year profitability,
              keeps customer growth and deposit gathering strong without another compliance shock, and reaches a fresh
              priced round or credible IPO-preparation stage on cleaner common-equity terms, then today's cautious
              stance can move upward. The same is true if the regulatory burden visibly eases: a cleaner remediation
              file would let investors pay more for the bank-franchise element of the story rather than underwriting N26
              as a still-penalized fintech. Those are the conditions that could move the valuation debate from
              upper-single-digit revenue multiples toward the private-premium range.


              The downside triggers are equally concrete. A tender or round that clears near $3 billion to $4 billion
              would validate the harsher secondary prints. Heavy preference or guaranteed-return overhang would weaken
              common-equity value even if the headline price looked acceptable. And any renewed governance conflict or
              slip in IPO timing would lengthen the liquidity discount just as investors are already questioning whether
              the founders and the 2021 investor cohort remain aligned. The diligence burden is therefore not abstract.
