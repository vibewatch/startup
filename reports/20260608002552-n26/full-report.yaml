      - number: '1.3'
        title: Capital base, valuation markers, and stakeholder map
        blocks:
          - type: paragraph
            body: >-
              The public funding record is strong enough to establish N26 as one of Europe’s best-capitalized private
              neobanks, but not strong enough to reconstruct the live cap table. Tracxn reports $1.72 billion of total
              funding and identifies the October 2021 Series E as a $900 million round at a $9 billion valuation, led by
              Third Point Ventures and Coatue with Dragoneer and Earlybird also participating. Business of Apps and
              Sacra both point to a later valuation reset, with Allianz’s 2023 stake sale implying roughly a $6 billion
              valuation. That is the key public signal for later valuation work: N26 still has a top-tier capital base,
              but the most recent public pricing marker is meaningfully below the 2021 peak.


              The disclosed stakeholder set is broader than just late-stage equity investors. BaFin is a decisive
              non-economic stakeholder because it has repeatedly constrained or shaped N26’s growth path through fines,
              onboarding caps, capital requirements, and the appointment of a special representative. Founders still
              matter because their residual ownership and symbolic influence are not transparent, even as operating
              control shifts to incoming executives. The supervisory board also matters more than in a typical software
              company because N26 is a licensed bank navigating remediation, product expansion, and possible future
              liquidity events simultaneously. What remains missing is the shareholder agreement, current ownership
              percentages, board-seat allocation, and any post-2023 secondary pricing data that would sharpen control
              and valuation judgments.
            claimRefs:
              - CO016
              - CO017
              - CO018
              - CO019
              - CO020
