  - id: TV006
    title: Catalyst and valuation-risk map
    columns:
      - Trigger
      - Threshold or event
      - Valuation transmission
      - Likely effect
    rows:
      - - Clean new financing above ~$6B
        - Completed round or tender with simplified common-equity terms
        - Validates the upper live marker and lowers uncertainty discount.
        - Moderate upside re-rate.
      - - Full-year profitability proof
        - Positive full-year net income or clearly sustainable multi-quarter profitability
        - Supports premium private-fintech rather than purely turnaround valuation logic.
        - Moves range upward if paired with stable growth.
      - - Regulatory normalization
        - Visible remediation progress or removal of key supervisory overhang
        - Lets investors pay more for the deposit franchise and less for risk buffers.
        - Narrows downside discount.
      - - Round clears near ~$3B-$4B
        - Tender, secondary, or financing prints close to adverse 2023 references
        - Confirms harsher secondary discipline rather than optimistic database summaries.
        - Immediate downside reset.
      - - Preference / guaranteed-return overhang proves heavy
        - New disclosure shows the common-equity economics are weaker than headline price suggests
        - Reduces effective equity value even if the headline valuation sounds acceptable.
        - Downside to common stockholders.
      - - IPO timing slips again or governance pressure rises
        - Liquidity event moves further out or board-founder conflict escalates
        - Extends the private-market discount and raises execution risk.
        - Multiple compression and slower entry timing.
    notes: >-
      These triggers are designed to move the valuation call quickly from narrative comfort to observable underwriting
      events.
