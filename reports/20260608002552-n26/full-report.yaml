  - id: TM004
    title: Growth drivers and constraints table
    columns:
      - Driver / constraint
      - Direction
      - Timing
      - Evidence / implication
      - Diligence ask
    rows:
      - - Mainstream app-first distribution
        - Driver
        - Current
        - EU internet banking is already mainstream and 82% of surveyed customers prefer app or web channels.
        - Measure N26 acquisition cost and activation by country now that digital access is no longer scarce.
      - - Instant-payments baseline
        - Driver
        - Near term
        - EU rules are making 24/7 instant account-to-account payments table stakes for reachable accounts.
        - Test whether N26 converts faster-payments capability into primary-account usage or only hygiene parity.
      - - Large household savings pool
        - Driver
        - Structural
        - EU household deposits exceed €10tn and savings rates remain elevated.
        - Break out N26 balance mix across current accounts, savings, and investment wrappers.
      - - Premium and investing adjacency
        - Driver
        - Current to medium term
        - Peers monetize subscriptions, balances, and wealth; N26 has broadened into ETFs and MMF-like cash funds.
        - Request attach rates, revenue per product, and cross-sell cohorts for premium and investing products.
      - - Trust and security perception gap
        - Constraint
        - Current
        - A meaningful share of consumers still see neobanks as less secure than branch-based banks.
        - Track trust metrics, fraud losses, and complaint trends by market.
      - - Deposit portability and price sensitivity
        - Constraint
        - Structural
        - The ECB says digital-bank deposits are more price-sensitive, less anchored, and often cross-border.
        - Assess N26's deposit beta, promotional-rate dependence, and balance durability after rate changes.
      - - Fraud and de-risking
        - Constraint
        - Current
        - >-
          The EBA calls payment fraud and de-risking top EU consumer issues, especially for vulnerable and cross-border
          users.
        - Review N26 onboarding declines, false-positive rates, and account-closure reasons.
      - - AML and supervisory burden
        - Constraint
        - Structural
        - AMLA is live, and compliance expectations are rising for cross-border digital banks.
        - Map headcount, spend, and remediation backlog for AML, complaints, and risk management.
      - - Incumbent and scaled app-bank competition
        - Constraint
        - Current
        - Revolut, Monzo, Wise, and incumbents all compete on the same customer wallet from different angles.
        - Benchmark N26 against peers on balances, subscriptions, primary-account share, and wealth attach.
      - - N26-specific regulatory overhang
        - Constraint
        - Current
        - BaFin's December 2025 package shows that supervisory trust can still restrict expansion and product breadth.
        - >-
          Verify closure status of BaFin measures and whether any geographies or products remain strategically
          constrained.
    notes: >-
      Rows combine market-wide drivers with N26-specific execution constraints because adoption timing in EU digital
      banking is governed as much by trust and compliance as by app UX.
