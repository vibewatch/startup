  - id: TV001
    title: Recommendation summary table
    columns:
      - Dimension
      - Current view
      - Why it lands there
      - Decision implication
    rows:
      - - Recommendation
        - Research-more
        - >-
          N26 is clearly stronger operationally than during the 2021-2023 reset, but the public record still lacks a
          fresh completed price and clean term visibility.
        - Do not underwrite the old peak or a speculative new-round headline at face value.
      - - Confidence
        - Medium
        - >-
          There is enough evidence to reject the peak as stale and to frame a live range, but not enough to pin one
          precise current fair value.
        - Use the chapter to set price discipline and diligence priorities, not to pretend false precision.
      - - Risk rating
        - High
        - >-
          Valuation still depends on regulatory normalization, round terms, and whether fresh price discovery clears
          near the optimistic or adverse end of the public range.
        - Assume downside is real until terms and governance are cleaner.
      - - Valuation stance
        - Fair-to-full near ~$6B; stretched at peak
        - >-
          ~$6B can be argued only through a premium private-fintech lens, while $9B now looks like a historical peak
          rather than a current cleared value.
        - Treat ~$6B as an upper live marker that still needs validation and treat $9B as an earn-back threshold.
      - - Decision implication
        - Only engage below peak or with clean terms
        - N26 may be strategically important, but price-taking is not supported by the public file.
        - Prefer structured diligence, secondary discount, or new-round clarity before leaning in.
