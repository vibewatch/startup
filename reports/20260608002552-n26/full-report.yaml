  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Accounts, tiers, and the everyday banking workflow
        blocks:
          - type: paragraph
            body: >-
              N26’s product is best understood as an app-first current-account workflow that starts with device trust,
              not with branch paperwork. The public plan page says signup runs through the mobile app, email
              confirmation, in-app ID verification, and smartphone pairing before a virtual debit card becomes usable.
              That onboarding design keeps distribution costs low and makes the handset the control point for
              authentication, cards, notifications, and premium upsell. The resulting everyday stack is broader than a
              single current account: app-store listings also expose joint accounts, business accounts, Wise-powered
              transfers, and wallet-first card activation inside the same mobile surface. In practical user terms, N26
              is trying to be the main financial cockpit for day-to-day payments, budgeting, and adjacent money movement
              rather than a thin prepaid-card shell.


              Tiering is central to how that workflow monetizes and where product scope fragments. Standard remains
              free, while Smart, Go, and Metal add progressively richer cash-access, travel, and support features.
              Spaces are important because they make N26’s account model more modular than a single checking balance:
              premium users can create up to 10 sub-accounts, optionally attach IBANs or cards, and use Shared Spaces
              for collaborative budgeting. Under 18s extends that same architecture into family banking by attaching a
              child card to a parent-managed Space with live limits and lock controls. The catch is that the product is
              not globally uniform. ATM allowances depend both on plan and on the customer’s T&C country, and the
              under-18 card is live only in a five-country subset. So even the “core” banking workflow should be read as
              a configurable, region-fragmented product stack rather than one identical offer across all markets.
