      - number: '1.4'
        title: Growth reacceleration, regulatory overhang, and milestones
        blocks:
          - type: paragraph
            body: >-
              N26’s 2024 operating story is clearly stronger than its 2021-2023 one. After BaFin lifted the growth
              restriction effective 1 June 2024, N26 said monthly sign-ups rose above 200,000, revenue was tracking to
              approximately €440 million for 2024, and the company posted its first quarterly profit with €2.8 million
              of net operating income in Q3 2024. Customer deposits surpassed €10 billion and the company expected
              interest income to contribute about half of 2024 revenue, confirming that the model had become more
              balance-sheet driven than in the earlier card-led growth phase. Those are meaningful maturity signals: N26
              looks more like a scaled European retail bank platform and less like an early-stage neobank experiment.


              But the adverse record remains central to chapter 1, not a side note. BaFin’s May 2024 penalty confirmed
              systematically late suspicious-activity reports in 2022, and the regulator’s December 2025 measures
              package said N26 still lacked proper business organization in risk management, complaints management, and
              lending operations. The resulting remedies — a special representative, extra capital requirements, and a
              ban on new mortgage originations in the Netherlands — show that regulatory trust has improved enough to
              allow growth but not enough to remove close supervision. The 2026 product launches for family banking and
              money-market investing therefore matter in two directions: they show that N26 is still broadening the
              platform, but they also raise the bar for operational controls at exactly the moment regulators are
              demanding better governance and execution quality.
