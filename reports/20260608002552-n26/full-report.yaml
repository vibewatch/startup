        - label: Product deepening
          detail: >-
            Savings, investments, crypto, and premium plans widen the relationship and create more monetization surfaces
            within the same app.
          tone: positive
        - label: Household or work expansion
          detail: >-
            Joint Accounts, under-18 cards, Business Smart, and Freelancer Account extend the relationship to a partner,
            child, or self-employed workflow.
          tone: positive
        - label: Exception handling moment
          detail: >-
            When KYC reviews, blocked accounts, or disputes occur, support friction can interrupt trust and become the
            main retention failure point.
          tone: risk
    claimRefs:
      - CU004
      - CU005
      - CU006
      - CU015
      - CU017
      - CU020
      - CU023
      - CU038
      - CU041
  - id: FU002
    title: Adoption / monetization funnel
    type: funnel
    layout: standard
    summary: >-
      Public evidence suggests a large top-of-funnel user base compresses quickly into narrower monetization-relevant
      cohorts.
    data:
      items:
        - label: Registered accounts
          value: 10000000
          unit: accounts
          note: Business of Apps estimate; broader than active or revenue-relevant customers
        - label: Current customers
          value: 8000000
          unit: customers+
          note: Homepage claim of over 8 million customers across 24 markets
        - label: Revenue-relevant customers
          value: 4800000
          unit: customers
          note: Official end-2024 monetization-relevant customer base
        - label: Premium-paying estimate
          value: 1440000
          unit: customers (est.)
          note: Approx. 30% of 4.8 million using Sacra’s estimate; not official N26 disclosure
        - label: Retail users who also own small businesses
          value: 250000
          unit: customers+
          note: Sacra TAM-expansion estimate; signals cross-sell headroom rather than active business adoption
    approximationNotes: >-
      The premium and small-business layers are estimate-based and should be treated as directional slices of the
      customer base, not audited cohorts.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU036
      - CU037
      - CU039
  - id: FU003
    title: Customer proof matrix
    type: matrix
    layout: wide
    summary: N26 has broad direct customer-proof, but the same public surfaces also document support and funds-access risk.
    data:
      columns:
        - Breadth of evidence
        - Positive utility
        - Complaint severity
        - Independence
      rows:
        - label: Trustpilot
          values:
            - label: Strong
              tone: positive
              detail: 39,614 reviews in Feb-2026 snapshot provide a deep retail evidence pool.
            - label: Moderate
              tone: positive
              detail: 4/5 average rating shows plenty of satisfied users despite heavy complaint traffic.
            - label: High
              tone: risk
              detail: Blocked funds, terminations, login failures, and dispute frustrations recur in review excerpts.
            - label: High
              tone: positive
              detail: Independent review platform with direct customer voice.
        - label: Apple App Store
          values:
            - label: Strong
              tone: positive
              detail: About 12K ratings on the iOS reviews page show a large user surface.
            - label: Strong
              tone: positive
              detail: 4.6/5 suggests strong day-to-day product affinity and app quality.
            - label: Medium
              tone: risk
              detail: Negative reviews still cite reverification lockouts, frozen funds, and slow support.
            - label: High
              tone: positive
              detail: Independent platform carrying first-hand user commentary.
        - label: ComplaintsBoard / freeze case
          values:
            - label: Narrow
              tone: neutral
              detail: Single complaint rather than a broad sample.
            - label: Weak
              tone: risk
              detail: Does not speak to everyday app quality or normal transaction flow.
            - label: High
              tone: risk
              detail: Concrete allegation of funds inaccessible after document submission.
            - label: Moderate
              tone: neutral
              detail: Third-party complaint platform, but single-user evidence should stay low confidence.
        - label: Official blocked-account support guidance
          values:
            - label: Moderate
              tone: neutral
              detail: Officially describes a real process affecting some accounts.
            - label: Weak
              tone: neutral
              detail: Not a testimonial and not a satisfaction measure.
            - label: High
              tone: risk
              detail: Confirms support cannot expedite some temporary blocks or give extra information.
            - label: Low
              tone: risk
              detail: Company-authored page, so it is useful as acknowledgement rather than independent proof.
    claimRefs:
      - CU023
      - CU024
      - CU025
      - CU026
      - CU027
      - CU032
      - CU033
      - CU034
  - id: FU004
    title: Customer segment monetization map
    type: matrix
    layout: wide
    summary: >-
      N26’s most valuable segments are the ones that stack subscriptions, deposits, and multi-user relationships rather
      than remaining in the free tier.
    data:
      columns:
        - Acquisition efficiency
        - Engagement depth
        - Revenue leverage
        - Retention potential
      rows:
        - label: Free retail users
          values:
            - label: Strong
              tone: positive
              detail: Free entry tier and easy onboarding support top-of-funnel growth.
            - label: Variable
              tone: neutral
              detail: Some become primary accounts, others may remain low-intensity secondary cards.
            - label: Low
              tone: neutral
              detail: Little direct subscription revenue without upgrade or deposit depth.
            - label: Moderate
              tone: neutral
              detail: Retention depends on whether the user deepens into other products.
        - label: Premium retail subscribers
          values:
            - label: Moderate
              tone: positive
              detail: Require conversion from free or new direct premium signup.
            - label: Strong
              tone: positive
              detail: Higher usage of travel, savings, insurance, and card benefits is implied.
            - label: Strong
              tone: positive
              detail: Recurring monthly fees plus higher deposit and wallet-share potential.
            - label: Strong
              tone: positive
              detail: More features create more switching costs, though renewal data is absent.
        - label: Joint-account households
          values:
            - label: Moderate
              tone: positive
              detail: Requires two existing personal customers from the same country.
            - label: Strong
              tone: positive
              detail: Shared bills and shared balances increase day-to-day relevance.
            - label: Moderate
              tone: positive
              detail: Can drive plan upgrades and deeper deposit flows at the household level.
            - label: Strong
              tone: positive
              detail: Couple finances are sticky once a shared IBAN and cards are in use.
        - label: Freelancer / self-employed users
          values:
            - label: Moderate
              tone: positive
              detail: Cross-sell is easier when a personal customer also needs work-spend tools.
            - label: Strong
              tone: positive
              detail: Business payments, cashback, tax pots, and a second IBAN increase app frequency.
            - label: Strong
              tone: positive
              detail: Business spend and deposits can carry higher ARPU than plain consumer banking.
            - label: Moderate
              tone: positive
              detail: Sticky if N26 captures both personal and work cash management, but product depth is still limited.
        - label: Under-18 family relationships
          values:
            - label: Moderate
              tone: positive
              detail: Parents must already be active N26 customers.
            - label: Moderate
              tone: positive
              detail: Parents interact regularly to top up, set limits, and monitor spending.
            - label: Low
              tone: neutral
              detail: Revenue is indirect today, mostly via plan retention and family stickiness.
            - label: Strong
              tone: positive
              detail: Could extend customer life cycle from parent account into the child’s future adult account.
    claimRefs:
      - CU011
      - CU013
      - CU015
      - CU017
      - CU020
      - CU036
      - CU037
      - CU041
      - CU042
  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: wide
    summary: >-
      N26’s highest residual exposure is where live supervision, rate-sensitive earnings, and customer-friction risk
      overlap.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual severity
      rows:
        - label: Regulatory / control
          values:
            - label: high
              tone: negative
              detail: BaFin action is already live and based on recent audits.
            - label: critical
              tone: negative
              detail: Can affect growth, capital, governance, and lending.
            - label: medium
              tone: warning
              detail: Remediation exists but is not fully proven closed.
            - label: high
              tone: negative
              detail: This is still the chapter’s dominant risk.
        - label: Financial model / rates
          values:
            - label: medium-high
              tone: warning
              detail: Interest-driven earnings remain material.
            - label: high
              tone: negative
              detail: Lower rates or slower growth can quickly compress the bridge to profitability.
            - label: medium
              tone: warning
              detail: Liquidity and capital are strong, but revenue diversification is incomplete.
            - label: medium-high
              tone: warning
              detail: Residual risk stays elevated until fee durability is clearer.
        - label: Customer / complaints
          values:
            - label: medium-high
              tone: warning
              detail: Blocked-account and complaints evidence is persistent.
            - label: high
              tone: negative
              detail: Trust erosion can translate into regulatory and retention damage.
            - label: low-medium
              tone: warning
              detail: Formal routes exist, but service-level disclosure is missing.
            - label: high
              tone: negative
              detail: Exception handling remains a material weak point.
        - label: Operational / outsourcing
          values:
            - label: medium
              tone: warning
              detail: Recent incident evidence is real but not catastrophic.
            - label: high
              tone: negative
              detail: Access incidents hit a bank’s trust surface immediately.
            - label: medium
              tone: neutral
              detail: N26 documents controls, but vendor detail and SLAs are not public.
            - label: medium-high
              tone: warning
              detail: Residual exposure sits above normal consumer-app levels because money access is involved.
        - label: Governance / execution
          values:
            - label: medium
              tone: warning
              detail: Leadership and board refresh are still fresh.
            - label: high
              tone: negative
              detail: Execution quality now determines whether remediation actually sticks.
            - label: medium
              tone: warning
              detail: Experienced hires help, but approval-dependent succession is ongoing.
            - label: medium-high
              tone: warning
              detail: Risk falls only if the new bench stabilizes and control KPIs improve.
    approximationNotes: null
    claimRefs:
      - CR001
      - CR010
      - CR021
      - CR026
      - CR029
      - CR032
      - CR036
      - CR045
      - CR048
  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      N26’s core risks transmit through a few shared channels: regulatory credibility, customer trust, and
      rate-sensitive earnings.
    data:
      nodes:
        - id: n1
          label: BaFin findings
          description: Serious deficiencies in risk, complaints, and lending organization.
        - id: n2
          label: Governance execution
          description: Leadership transition, board refresh, and remediation delivery.
        - id: n3
          label: Customer trust
          description: Blocked-account handling, complaints, and service confidence.
        - id: n4
          label: Operational continuity
          description: Outages, outsourcing quality, and access reliability.
        - id: n5
          label: Customer / deposit growth
          description: Revenue-relevant customer expansion and deposit accumulation.
        - id: n6
          label: Interest-driven earnings
          description: Treasury, reserve, and lending income that currently supports profit.
        - id: n7
          label: Investability / valuation support
          description: Whether N26 can justify a cleaner risk premium.
      edges:
        - from: n1
          to: n2
        - from: n1
          to: n3
        - from: n1
          to: n7
        - from: n2
          to: n4
        - from: n2
          to: n7
        - from: n4
          to: n3
        - from: n3
          to: n5
        - from: n5
          to: n6
        - from: n6
          to: n7
    approximationNotes: null
    claimRefs:
      - CR001
      - CR010
      - CR016
      - CR026
      - CR029
      - CR032
      - CR036
      - CR045
      - CR050
  - id: FR003
    title: Dependency map
    type: dag
    layout: wide
    summary: >-
      N26’s dependencies are unusual for a retail neobank because regulators, deposits, outsourced operations, and
      payment rails all sit close to the customer experience.
    data:
      nodes:
        - id: core
          label: N26 core bank
          description: Deposits, app access, fraud controls, and product distribution.
        - id: reg
          label: BaFin / ECB
          description: Supervision, approvals, and capital requirements.
        - id: rates
          label: Bundesbank / ECB rates
          description: Reserve income and liquidity backstop conditions.
        - id: outs
          label: Outsourced support / tech vendors
          description: Customer service and technical product-development capacity.
        - id: mc
          label: Mastercard / payment rails
          description: Card disputes, chargebacks, and local payment access.
        - id: deps
          label: Retail depositors
          description: Primary funding and trust base.
        - id: mort
          label: Dutch mortgage business
          description: Named lending-expansion node now under restriction.
      edges:
        - from: reg
          to: core
        - from: rates
          to: core
        - from: outs
          to: core
        - from: mc
          to: core
        - from: deps
          to: core
        - from: mort
          to: core
        - from: core
          to: deps
    approximationNotes: null
    claimRefs:
      - CR003
      - CR022
      - CR028
      - CR030
      - CR031
      - CR034
      - CR041
      - CR043
  - id: FR004
    title: Supervisory and governance timeline (2024-2026)
    type: timeline
    layout: wide
    summary: >-
      N26’s recent risk narrative is a sequence of fine, cap lift, profit rebound, renewed BaFin intervention, and
      governance reset.
    data:
      items:
        - label: 2024-05-21 fine
          value: BaFin imposes a legally final €9.2m AML-reporting fine.
          tone: negative
        - label: 2024-06-01 cap lift
          value: BaFin fully lifts the onboarding cap after extended remediation.
          tone: positive
        - label: 2024-11 profit milestone
          value: N26 reports its first quarterly profit and strong post-cap acceleration.
          tone: positive
        - label: 2025 filing warning
          value: FY2024 filings say measures under sections 45ff KWG are expected from the 2024 audit.
          tone: negative
        - label: 2025-12-15 measures package
          value: >-
            BaFin cites serious deficiencies, adds a special representative, extra capital requirements, and Dutch
            mortgage restrictions.
          tone: negative
        - label: 2025-12-15 new CEO named
          value: N26 appoints Mike Dargan, subject to BaFin approval.
          tone: neutral
        - label: 2025-12-30 founder exit from operations
          value: Maximilian Tayenthal steps away from operational duties during leadership transition.
          tone: negative
        - label: 2026-03 to 2026-05 governance build-out
          value: Supervisory-board and management-team reinforcement continues through spring 2026.
          tone: neutral
    approximationNotes: Timeline tone reflects risk impact rather than whether the event was good or bad headline news for the company.
    claimRefs:
      - CR006
      - CR008
      - CR009
      - CR010
      - CR011
      - CR012
      - CR013
      - CR014
  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The recommendation flows from a real but stale 2021 peak into lower secondary markers, stronger 2024 operating
      proof, and still-unfinished 2025 price discovery.
    data:
      nodes:
        - id: peak
          label: 2021 peak
          detail: '>$9B Series E was real, but historical.'
        - id: reset
          label: Reset signals
          detail: 2023-2025 public markers moved toward ~$6B and, adversely, ~$3B.
        - id: proof
          label: 2024 proof
          detail: Revenue, deposits, and Q3 profitability all improved materially.
        - id: terms
          label: No clean new price
          detail: 2025 coverage describes negotiations, partial exits, and term complexity rather than a settled round.
        - id: result
          label: Research-more
          detail: Fair-to-full near ~$6B, stretched at peak, terms-sensitive.
      edges:
        - from: peak
          to: reset
          label: was followed by
        - from: reset
          to: proof
          label: even as
        - from: proof
          to: terms
          label: still lacks
        - from: terms
          to: result
          label: driving
    claimRefs:
      - CV001
      - CV008
      - CV011
      - CV012
      - CV014
      - CV018
      - CV034
      - CV035
      - CV041
      - CV042
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: >-
      Applying comparable revenue multiples to N26's $486M Sacra 2024 revenue anchor shows how quickly the valuation
      range shifts from public-fintech discipline to premium private-neobank pricing.
    data:
      items:
        - label: Wise-like 4.7x
          value: 2.3
        - label: Nubank-like 5.5x
          value: 2.7
        - label: SoFi-like 6.9x
          value: 3.4
        - label: Revolut-like 12.5x
          value: 6.1
        - label: 2021 peak multiple 18.5x
          value: 9
      yAxis:
        label: Implied valuation on $486M revenue (USD B)
    approximationNotes: >-
      Values use current market-cap or valuation markers divided by each comparable's latest public revenue, then
      re-applied to Sacra's $486M 2024 N26 revenue estimate. This is a lens, not a target price.
    claimRefs:
      - CV010
      - CV019
      - CV020
      - CV021
      - CV022
      - CV023
      - CV024
      - CV025
      - CV026
      - CV027
      - CV036
      - CV037
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: >-
      The public-only valuation range still spans from adverse secondary clearing levels to a premium private-fintech
      case, with the peak round sitting outside the supportable base case.
    data:
      items:
        - label: Bear
          low: 2.5
          mid: 3
          high: 3.5
        - label: Base
          low: 4
          mid: 4.8
          high: 5.5
        - label: Bull
          low: 5.5
          mid: 6.3
          high: 7
    approximationNotes: >-
      Ranges reflect blended evidence from secondary markers, public-comp revenue multiples, customer-value comparisons,
      and the stronger FY2024 operating file. They exclude any hidden preference-stack impact.
    claimRefs:
      - CV036
      - CV037
      - CV038
      - CV039
      - CV040
      - CV041
      - CV042
      - CV046
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: compact
    summary: >-
      N26's valuation debate is defined less by the absence of scale and more by the gap between its historical peak,
      current operating progress, and unresolved live clearing price.
    data:
