  - id: FE001
    title: N26 product architecture map
    type: stack
    layout: wide
    summary: >-
      The visible product stack runs from mobile distribution and paired-device onboarding through account containers,
      partner-enabled financial rails, and a narrow but concrete PSD2 interoperability layer.
    data:
      layers:
        - label: Mobile distribution and access layer
          detail: >-
            N26’s app, virtual or physical cards, digital wallets, joint or business-account entry points, and app-store
            release cadence form the customer-facing shell.
        - label: Identity and trust layer
          detail: >-
            Email confirmation, KYC, smartphone pairing, Keyless biometrics, 2FA, 3D Secure, and push notifications
            establish access and transaction trust.
        - label: Account and money-organization layer
          detail: >-
            The main account sits alongside Spaces, Shared Spaces, under-18 linked Spaces, joint-account-like flows, and
            Instant Savings balances.
        - label: Financial product rails
          detail: >-
            Stocks and ETFs, ready-made funds, crypto, loans, overdraft, and Installments are exposed in-app as adjacent
            financial modules.
        - label: Partner and network layer
          detail: >-
            Upvest, Bitpanda, Wise, Allianz Assistance, card schemes, and mobile-wallet ecosystems extend functionality
            beyond N26-built rails.
        - label: Regulated interoperability layer
          detail: >-
            PSD2 dedicated, fallback, and sandbox interfaces expose a compliance-driven external API surface for AISP,
            PISP, and CBPII actors.
