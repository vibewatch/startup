      - number: '3.3'
        title: Pricing, Product Breadth, and Monetization
        blocks:
          - type: paragraph
            body: >-
              N26’s pricing remains clean and relatively accessible: Standard is free, Smart costs €4.90 per month, Go
              €9.90, and Metal €16.90. N26 Business Smart also costs €4.90, but it is restricted to freelancers and
              self-employed individuals operating in their own legal name. N26 now has more breadth than its early
              minimalist reputation suggests: it offers stocks and ETFs, crypto via Bitpanda, business sub-accounts with
              cashback, and travel eSIM plans across more than 100 destinations. The problem is not absolute absence of
              products but uneven depth and rollout. Crypto is available only in seven markets, stocks and ETFs are not
              universal across all countries, and the business offer is materially narrower than the multi-user and
              workflow-heavy platforms from Revolut Business and Starling Business.


              Revolut has pulled furthest ahead on breadth and monetization. Its consumer stack now ranges from free to
              £55 per month, while Revolut Business starts at £10 and scales into payments acceptance, treasury,
              integrations, and richer team controls. bunq has built a stronger lifestyle subscription identity than
              N26, combining pockets, crypto, investing, eSIM, travel insurance, and visibly tiered pricing. Starling
              and Monzo are less international, but each looks deeper in its home market on switching, savings, or
              business-account habit formation. Wise compresses N26’s travel and FX story by charging only for use at
              the mid-market rate, which makes N26’s subscription monetization less differentiated for cross-border
              users who do not want a full current account replacement.
