      - - Rate-sensitive earnings compression
        - ECB rate path, reserve yields, and deposit-growth trend
        - Interest-driven earnings shrink materially without fee growth filling the gap
        - Re-rate the model as more cyclical and lower-quality than the current profit story implies.
      - - Customer-friction deterioration
        - Complaint backlog, blocked-account litigation, public support escalations
