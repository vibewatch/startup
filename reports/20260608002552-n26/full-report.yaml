      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              For most of N26's current products, the buyer, user, and payer are the same person: an individual consumer
              making a personal banking decision. But the revenue path changes materially by segment. One cohort uses
              N26 as a low-friction secondary account for card controls, travel, or app experience. Another cohort is a
              higher-value primary-account target that can route salary to the N26 IBAN and keep more deposits on
              platform. Premium travelers and heavy users are the clearest fit for Go and Metal, while savers and
              self-directed investors are separate monetizable segments because N26 now spans instant savings, fee-free
              stock and ETF access, and a money-market-fund style cash layer.


              The adoption path is therefore not a simple sign-up funnel. It begins with easy mobile onboarding and
              immediate card usability, but real economic capture comes later: trust in deposit protection and security,
              movement of recurring inflows, and then cross-sell into premium, savings, or investing features.
              Comparator evidence supports this framing. Monzo's data suggest that even a scaled app bank still has to
              work hard to convert activity into primary-bank status, while Oliver Wyman's 2026 survey shows that
              app-first preferences are widespread but perceived security still lags branch-based incumbents. For N26,
              that means user acquisition can be fast, but durable monetization still hinges on primacy, balances, and
              multi-product adoption.
