chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, license, and product scope
        blocks:
          - type: paragraph
            body: >-
              The safest current identity record for N26 comes from its own homepage and policy statements rather than
              from older profile pages that are no longer live. N26 presents itself as a fully mobile bank supervised by
              BaFin, operating under a full German banking license with deposit protection up to €100,000. The homepage
              also establishes the broadest current reach claim: N26 says it operates in 24 markets and serves over 8
              million customers. That number should not be conflated with the narrower financial-disclosure metric of
              4.8 million “revenue-relevant” customers, which refers to users who have completed KYC and hold an open
              account. For later chapters, the distinction matters because the top-of-funnel installed base and the
              monetized customer base clearly diverge.


              The business model is now wider than the original checking-account narrative. Public product surfaces show
              a stack that combines free and paid current accounts with instant savings, stocks and ETFs, crypto, and
              adjacent lending or investment products. In 2026, N26 added a children-and-family card product and a
              money-market fund wrapper, reinforcing that the company is trying to become a broader financial operating
              system rather than just a card-led neobank. The model appears to monetize through subscriptions, interest
              income on deposits and lending, and activity-based financial products. The strongest caveat is that the
              headline scale story still comes largely from company disclosures, so later underwriting should treat
              current customer and product-usage figures as directionally strong but not independently audited.
