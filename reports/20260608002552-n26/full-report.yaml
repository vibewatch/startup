  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct Peers vs Adjacent Substitutes
        blocks:
          - type: paragraph
            body: >-
              N26’s true competitive set is narrower than a generic list of “European fintechs.” The direct peers are
              consumer neobanks trying to win the primary current-account relationship across multiple European markets:
              Revolut, bunq, and—more as product and engagement benchmarks than broad geographic substitutes—Monzo and
              Starling. Revolut is the clearest like-for-like rival because it competes for the same cross-border
              salaried users, premium-plan spend, FX activity, business-account demand, and in-app investing or crypto
              usage. bunq is the closest pan-European premium substitute for affluent expats and digital nomads who want
              a bank account, travel perks, and lifestyle subscriptions in one app.


              Monzo and Starling matter less on geographic overlap because both remain UK-centred, but they still set
              the standard for primary-account depth, switching, savings, and SME workflow utility. Wise and Vivid
              should not be treated as full direct peers. Wise is a transfers and treasury specialist built on
              safeguarded funds and pay-as-you-go pricing, not a salary-account incumbent replacement. Vivid is a
              Luxembourg and Dutch regulated e-money plus brokerage hybrid that leans into cashback, returns on idle
              cash, acquiring, and SMEs. Barclays and HSBC remain relevant substitutes because salary deposits, trust,
              and relationship-banking inertia still sit with incumbents for many users who multi-home into neobanks
              rather than fully switch.
