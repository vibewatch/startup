      - number: '5.4'
        title: Platform signals, roadmap evidence, and operating constraints
        blocks:
          - type: paragraph
            body: >-
              Developer and platform signals suggest a real engineering organization, but not a highly transparent one.
              App-store pages show an actively maintained mobile surface, with current release cadence and large
              user-review bases, while GitHub exposes a small public footprint around PSD2 docs plus legacy open-source
              mobile frameworks such as FlowKit and Android clean-architecture samples. Current hiring fills in more of
              the picture than official architecture pages do. Security-platform job ads describe a cloud-native backend
              environment with AWS, Docker, Kubernetes, Terraform, Kafka, and Java/Kotlin/Spring Boot, plus a “you build
              it, you run it” operating model and internal automation for threat detection, incident response, and
              vulnerability management. That is credible platform signal for a scaled consumer bank, but it still sits
              well below a full public architecture disclosure.


              The main caution is that product expansion has not removed compliance-driven operating drag. BaFin’s
              December 2025 measures show that N26 was still being forced to remediate deficiencies in risk, complaints,
              and lending organization, with a special monitor, extra capital requirements, and a ban on new Dutch
              mortgage business. That directly affects product breadth because it constrains how comfortably the bank
              can scale lending or adjacent regulated features while remediation is ongoing. Reliability disclosure is
              also thin. A third-party monitor can observe outage signals, but the reviewed source set did not surface a
              first-party public incident ledger or detailed SLA history. Netting it out, N26 looks like a real
              multi-product banking platform with credible mobile, API, and cloud-engineering signals — but one whose
              public technical transparency still lags its product ambition, and whose roadmap remains bounded by
              regulatory execution quality.
