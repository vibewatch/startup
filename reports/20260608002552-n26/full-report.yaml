        - label: 2021 peak round
          value: 9+
          unit: USD B
        - label: 2023 market-data marker
          value: ~6
          unit: USD B
        - label: Adverse stake-sale print
          value: ~3
          unit: USD B
        - label: Filed FY2024 revenue
