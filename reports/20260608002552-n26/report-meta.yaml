companyProfile:
  summary: >-
    N26 is a 2013-founded Berlin digital bank that operates under a full German banking
    license and says it serves more than 8 million customers across 24 European markets.
    Its product stack has expanded from current accounts and cards into savings, stocks and
    ETFs, crypto, and newer family and cash-management products. Public evidence points to a
    stronger operating profile in 2024-2025, including first quarterly profitability and a
    deposit base above €10 billion, but the business still carries material supervisory and
    governance overhang from BaFin actions and limited private-market price discovery after the
    2021 funding peak.
