  productSummary: >-
    N26 sells a mobile-first consumer-banking stack built around free and premium current
    accounts, debit cards, instant savings, stocks and ETFs, crypto, and adjacent cash-
    management and family-banking products.
  customerFocus: >-
    Retail consumers in Europe seeking a mobile primary bank account or secondary spending,
    savings, and investing relationship, with some adjacent business-banking and family use
    cases.
  businessModel: >-
    The public record indicates N26 monetizes premium subscriptions, interchange, interest
    income on deposits and lending, and commissions from adjacent financial products.
