    "title": "Financials",
    "summary": "N26’s FY2024 filed accounts finally provide an underwriting anchor: group gross revenue reached €422.3 million, customer deposits ended the year at €10.35 billion, CET1 was 26.2%, and net loss narrowed to €42.0 million while November 2024 guidance marked the first profitable quarter. But earnings quality is still constrained by rate dependence, revenue-recognition shifts, and BaFin’s 2025 measures package, while private-company opacity still blocks core metrics such as gross margin, ARR-style recurrence, CAC/payback, NRR, and the exact post-2025 capital stack."
