    {
      "id": "profitability-path-capital-adequacy-and-constraints",
      "title": "Profitability path, capital adequacy, and regulatory constraints",
      "body": "On the public timeline, N26 first crossed monthly profitability in June 2024 and posted €2.8 million of net operating income in Q3 2024. The filing confirms that 2024 was materially better than 2023 but not yet a clean full-year earnings story. Group operating result after provisions was still -€40.4 million and net loss -€42.0 million. Cost discipline improved, yet the cost base remained substantial: personnel expense was €150.2 million and general administrative expense €331.7 million. Earnings quality also contains technical items. Premium-contract revenue recognition shifted €15.3 million out of 2024, while a €20.4 million securities loss was taken to optimize risk-weighted assets ahead of CRR III. Those items mean the exit-rate story is stronger than the full-year accounting headline, but they also mean the simple “first profitable quarter” narrative overstates how settled profitability is.\n\nThe bank’s funding base is the real positive counterweight. Deposits fund the model, and excess balances were placed into bank claims and securities as well as lending assets. That gives N26 a credible balance-sheet engine, but it also creates rate sensitivity and supervisory exposure. As savings rates reset, deposit beta matters. As the balance sheet grows, management already expects lower end-2025 CET1 and leverage ratios. And as BaFin’s December 2025 action showed, additional capital requirements, a special representative, and Dutch mortgage restrictions can directly reduce financial flexibility even while reported LCR and NSFR remain strong.",
