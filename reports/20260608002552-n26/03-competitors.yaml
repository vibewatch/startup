    {
      "id": "geography-license-and-scale",
      "title": "Geography, Licence, and Scale Positioning",
      "body": "N26 is strongest where a full continental banking licence matters. It operates with a German banking licence and statutory deposit protection, so it can credibly market itself as a primary bank rather than only a card, wallet, or FX overlay. That keeps it structurally ahead of Wise and Vivid on trust. But public scale markers place N26 in the middle of the European neobank pack rather than at the frontier. Business of Apps reports 4.8 million revenue-relevant customers at end-2024, around 10 million registered accounts, and a roughly $6 billion 2023 secondary-market valuation marker. Those figures compare with Revolut’s 52.5 million customers and $38 billion of customer balances in 2024, bunq’s 17 million users and more than €8 billion of deposits, Starling’s 6.2 million platform accounts and £12.7 billion of deposits, and Monzo’s current public claim of more than 15 million personal and business customers.\n\nGeography explains why all of those players do not pressure N26 equally. N26’s overlap with Revolut and bunq is substantial because all three market pan-European, mobile-first, premium-friendly banking. Monzo and Starling are more concentrated in the UK, so they matter mainly as benchmarks for primacy, savings, and SME lock-in. The biggest strategic negative is regulatory rather than commercial: BaFin fully lifted N26’s growth cap in June 2024, but the December 2025 measures—special monitor, added capital requirements, and a Dutch mortgage ban—reopened the trust question just as rivals accelerated.",
