evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: leadership-and-board-roster
    missingEvidence: >-
      A current full management-board and supervisory-board roster, including committee assignments and tenure, is not
      publicly available in the reviewed sources.
    whyItMatters: >-
      Governance quality, independence, and escalation paths are central for a regulated bank operating under
      remediation pressure.
    diligencePath: Request the current board pack, committee charters, and management-organogram from the company data room.
    relatedQuestionRefs:
      - QO014
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-control-rights
    missingEvidence: >-
      The live cap table, shareholder agreement terms, board-seat allocation, preference stack, and founder voting
      rights were not publicly disclosed.
    whyItMatters: >-
      Control rights and liquidation preferences drive downside protection, governance leverage, and any future
      liquidity or down-round outcomes.
    diligencePath: Request the current cap table, shareholder agreement, recent secondary-trade history, and investor rights summary.
    relatedQuestionRefs:
      - QO014
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: current-headcount
    missingEvidence: >-
      An official current employee count and geographic split were not found; only a third-party estimate of 1,854
      employees was available.
    whyItMatters: >-
      Headcount is a core efficiency metric for a scaled digital bank and is necessary to judge operating leverage after
      the profitability inflection.
    diligencePath: Request current employee and contractor counts by function and geography from HR or board reporting.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO001
  - type: stale
    severity: material
    topic: post-2024-financials-and-remediation-status
    missingEvidence: >-
      The reviewed sources did not provide audited FY2025 financial statements or a detailed public tracker for
      remediation progress after the December 2025 BaFin measures package.
    whyItMatters: >-
      Sustained profitability and remediation closure are the key variables separating a temporary rebound from a
      durable institutional turnaround.
    diligencePath: >-
      Request FY2025 audited accounts, 2026 YTD management reporting, and the latest remediation tracker shared with
      BaFin or the special representative.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: n26-premium-attach-rate
    missingEvidence: >-
      N26 does not publicly disclose current paid-plan subscriber count, attach rate by plan, or subscription ARPU by
      geography.
    whyItMatters: >-
      Without attach and ARPU data, the premium-banking lens can only use peer signals and list-price proxies rather
      than N26-specific monetization depth.
    diligencePath: >-
      Request management KPI pack showing paid-plan users, monthly churn, ARPU, and plan mix by major market for the
      latest four quarters.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM002
      - TM003
  - type: private-evidence-only
    severity: material
    topic: n26-primary-account-share
    missingEvidence: >-
      Public sources do not provide N26's primary-account share, salary-deposit penetration, or deposit mix by product
      and country.
    whyItMatters: >-
      Primary-account usage and deposit depth determine whether N26 is mainly a secondary wallet or a durable funding
      and cross-sell platform.
    diligencePath: >-
      Obtain internal cohort data on salary inflows, direct-deposit penetration, balances per active customer, and
      primary-account ratios in the top five markets.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM003
      - TM005
  - type: conflicting-data
    severity: material
    topic: vendor-neobanking-tam
    missingEvidence: >-
      A bottom-up European neobanking market model that reconciles active users, deposits, payment revenue, premium
      fees, and wealth revenue using consistent category definitions.
    whyItMatters: >-
      The headline 2026 market estimates from vendor reports differ too widely to support underwriting or valuation work
      on their own.
    diligencePath: >-
      Build an internal market model from public-company filings, ECB structural data, and country-level adoption
      statistics instead of relying on vendor TAM headlines.
    relatedQuestionRefs:
      - QM023
      - QM024
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: minor
    topic: cross-country-primary-account-benchmark
    missingEvidence: >-
