  - id: sizing-gaps
    title: Sizing diligence gaps and contradictory estimates
    body: >
      The most material gap in available market evidence is the absence of an
      analyst-published sizing that matches LumApps' actual product boundary. The
      digital workplace figure ($73.4 B) is too broad; the intranet software figure
      ($4.8 B) excludes the managed-service and frontline-app revenue that Beekeeper
      adds; the HCM deskless figure ($13.5 B) is predominantly HR workflow rather
      than employee communications. LumApps likely competes for a serviceable market
      that aggregates pieces of all three, but no published estimate covers that exact
      combination.

      A second structural gap is the order-of-magnitude spread between the IaaS
      estimate ($23.7 B) and the intranet software estimate ($4.8 B). The difference
      reflects boundary methodology (IaaS includes platform services, hosting, and
      migration; software does not), but neither publisher discloses sufficiently
      detailed methodology to allow an investor to reconstruct the basis. LumApps
      represents a software-plus-services model (SaaS platform with implementation
      and customer success), and its recurring revenue of approximately $150 M post-
      Beekeeper implies it holds a fraction of a percent of even the narrower software
      estimate—creating significant growth headroom but also implying that market
      share gains must be won against a large number of competitors across multiple
      geographies.

      A third gap is competitive share data. Forrester's Wave evaluates 13 vendors on
      capability and strategy dimensions but does not publish revenue share or
      customer count by vendor. Gartner's digital employee experience management
      category page was inaccessible during research (JavaScript-only rendering). As
      a result, LumApps' revenue rank among intranet platform vendors cannot be
      independently confirmed from available public sources.
