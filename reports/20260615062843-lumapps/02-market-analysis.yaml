  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: market penetration
      missingEvidence: >
        LumApps has not publicly disclosed standalone revenue, ARR, or customer-count
        data that would allow precise calculation of its market share within the
        intranet software or IaaS market.
      whyItMatters: >
        Without a precise revenue figure, LumApps' SAM penetration is estimated at
        0.6%–3% depending on boundary—a wide range that makes growth-premium valuation
        highly dependent on boundary assumption.
      diligencePath: >
        Request audited revenue data, customer count by product line, and ARR split
        between the pre-existing LumApps platform and post-Beekeeper frontline segment
        directly from management.
      relatedQuestionRefs:
        - QM021

    - type: conflicting-data
      severity: material
      topic: sizing gaps
      missingEvidence: >
        Multiple analyst firms produce dramatically different market sizes ($4.8 B vs.
        $23.7 B vs. $73.4 B) for overlapping segments without publishing sufficient
        methodology detail to reconcile them.
      whyItMatters: >
        The order-of-magnitude spread means that investor TAM framing can be
        manipulated by boundary choice; without a defensible analyst-endorsed market
        boundary for "intranet and employee experience platforms," comparables are
        unreliable.
      diligencePath: >
        Commission or request a custom market sizing exercise from Forrester, Gartner,
        or IDC that precisely bounds the IaaS market to exclude managed IT services and
        VDI while including frontline communications platforms.
      relatedQuestionRefs:
        - QM007
        - QM030

    - type: missing-source
      severity: minor
      topic: competitive landscape
      missingEvidence: >
        Gartner's Digital Employee Experience Management category page was inaccessible
        (JavaScript rendering block); the Forrester Wave does not disclose revenue share
        or customer count by vendor; no published third-party data names LumApps'
        revenue rank in the intranet segment.
      whyItMatters: >
        Inability to independently verify LumApps' competitive position on a revenue
        or market-share basis limits the precision of SOM estimates and peer comparisons.
      diligencePath: >
        Access Gartner Peer Insights with client credentials, purchase Forrester's
        full Wave document, or engage with Gartner's Magic Quadrant for DEX tools when
        next published.
      relatedQuestionRefs: []

