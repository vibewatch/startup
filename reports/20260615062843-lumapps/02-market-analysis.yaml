  - id: market-sizing
    title: Market sizing — TAM, SAM, and SOM lenses
    body: >
      Five independent lenses produce materially different sizing conclusions for
      LumApps' addressable market, and those differences reflect boundary choices
      rather than analytical error. The Business Research Company estimates the
      global digital workplace market at $73.4 B in 2026 growing at a 24.4% CAGR
      through 2030—a figure that includes cloud infrastructure, VDI, UC&C, and
      consulting services well outside LumApps' product scope. The same publisher
      sizes the intranet-as-a-service market at $23.7 B in 2026 with a 12.3% CAGR
      to $38 B in 2030. Research and Markets reports the pure intranet software
      segment at $4.8 B in 2025 growing at 15.6% CAGR to $22.1 B by 2034, a much
      narrower cut. Mordor Intelligence tracks the HCM for deskless and frontline
      workers market at $13.5 B in 2025, growing to $30.7 B by 2031 at a 14.9%
      CAGR—an adjacent market that became directly relevant after the Beekeeper
      combination. A synthesis from the employee experience platform segment places
      the EXP-specific market at $4.7–7.8 B in 2026 at ~9% CAGR, reflecting a
      tighter definition centered on engagement, analytics, and journey orchestration
      rather than intranet content management.

      The range of estimates creates a genuine sizing dilemma for investors: the
      broadest TAM ($73 B) is misleading because LumApps competes in a narrow slice.
      The more relevant SAM—cloud intranet and EXP platforms sold to enterprises with
      500+ employees globally—likely sits in the $15–25 B range in 2026 when intranet
      IaaS is used as the anchor. The serviceable obtainable market (SOM) is harder
      to isolate; LumApps' own recurring-revenue anchor of approximately $150 M
      (post-Beekeeper, 2025) implies a sub-1% penetration even of the narrow intranet
      software estimate. That leaves very significant headroom but also underlines the
      competitiveness of the segment.

      The CAGR range across these lenses (9%–24%) matters for valuation: if LumApps
      is benchmarked against the digital workplace TAM at 24% CAGR, growth optionality
      looks large; if benchmarked against the narrower EXP market at 9% CAGR, the
      growth premium shrinks substantially. No single published estimate perfectly
      isolates LumApps' SAM, and the company's own communications use the broad
      category language ("digital workplace," "employee experience") without providing
      a precise market sizing.
