chapter:
  number: 2
  title: Market Analysis
  summary: >
    LumApps competes across a nested set of markets: the broadest digital workplace
    category ($73.4 B in 2026 at 24% CAGR), the more relevant intranet-as-a-service
    segment ($23.7 B in 2026 at 12% CAGR), and the narrowest pure-play intranet
    software slice ($4.8 B in 2025 growing at ~16% CAGR). Buyers are IT and HR
    leaders in large enterprises with multi-stakeholder approval cycles averaging
    13 internal and 9 external influencers. Growth is driven by AI features, hybrid-
    work normalization, and the push to include frontline workers; constraints include
    Microsoft's bundled SharePoint offering, low historic adoption rates (13% of
    employees use their intranet daily), and increasing procurement scrutiny. Market
    sizing estimates span an order of magnitude depending on boundary definition,
    and no single published figure fully isolates LumApps' serviceable market.

sections:
  - id: market-boundary
    title: Market boundary, scope, and substitutes
    body: >
      LumApps operates at the intersection of three overlapping market categories.
      The broadest is the digital workplace—the full ecosystem of unified
      communications, endpoint management, enterprise mobility, employee experience
      platforms, and professional services. Most analyst sizing at this level
      ($58–73 B in 2025–2026) includes hardware, consulting, VDI, and UC&C
      infrastructure that LumApps does not sell. A more relevant boundary is the
      intranet-as-a-service segment, which covers cloud-hosted platforms enabling
      internal communication, content management, workflow automation, and mobile
      frontline access. At $23.7 B in 2026, this segment contains most of LumApps'
      direct competitors (Staffbase, Simpplr, Unily, Firstup, Happeo, Powell
      Software). The narrowest defensible boundary is intranet software proper: the
      purpose-built SaaS layer that does not include the managed hosting or consulting
      services wrapped around it, estimated at $4.8 B in 2025.

      The primary status-quo substitutes for LumApps are Microsoft SharePoint (often
      included in existing Microsoft 365 licenses at near-zero incremental cost),
      SharePoint with Viva Connections layered on top, and Google Sites for smaller
      Google Workspace deployments. Secondary substitutes include enterprise messaging
      tools (Microsoft Teams, Slack) used as de-facto intranets and broad HCM suites
      (Workday, SAP SuccessFactors) that embed limited self-service portals. ServiceNow
      Employee Center competes in the service-delivery layer. Each substitute imposes
      a different switching cost profile: SharePoint is entrenched in M365 tenants but
      has well-documented adoption failures (only 13% of employees use any intranet
      daily on average), creating a replacement opportunity. Google Sites is weaker
      and easier to displace. HCM suite portals cover different workflows and are
      rarely seen as full substitutes for a communications-first intranet.

      The adjacent market that expands LumApps' addressable opportunity is HCM for
      deskless and frontline workers, estimated at $13.5 B in 2025 growing at 15%
      CAGR. LumApps' acquisition of Beekeeper in 2025 was explicitly designed to
      claim a share of this adjacent market. Google Cloud's decision to co-market
      LumApps alongside AODocs as a cloud-native intranet alternative for enterprises
      migrating off SharePoint Server is further evidence that the company is
      positioned against the broadest possible market definition.
