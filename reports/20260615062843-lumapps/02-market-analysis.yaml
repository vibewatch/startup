callouts:
  - calloutType: insight
    title: Market boundary choice drives an order-of-magnitude difference in TAM
    body: >
      LumApps-relevant market sizing ranges from $4.8 B (narrow intranet software)
      to $73.4 B (full digital workplace), a 15× spread. Investors and management
      should anchor on the $15–25 B intranet-as-a-service range as the primary SAM
      because it best matches LumApps' current product boundary. Using the digital
      workplace TAM in investor materials overstates the addressable opportunity by
      roughly 3–5×.
    claimRefs:
      - CM001
      - CM003
      - CM006
      - CM047
  - calloutType: risk
    title: Microsoft's bundled SharePoint and low industry adoption rates are persistent headwinds
    body: >
      Microsoft's near-zero incremental cost for SharePoint within Microsoft 365
      licensing forces LumApps to justify incremental spend against a "free" baseline.
      The industry's structural adoption problem (13% daily active users, 6 minutes
      average daily use) means customers are buying a product category with documented
      value-realization risk. LumApps must differentiate on AI-driven adoption
      improvements, governance, and frontline capabilities to overcome both barriers.
    claimRefs:
      - CM024
      - CM026
      - CM042
  - calloutType: assumption
    title: Post-Beekeeper revenue anchor ($150 M) implies sub-1% SAM penetration
    body: >
      LumApps' disclosed combined recurring revenue of approximately $150 M against
      even the narrow $4.8 B intranet software TAM implies roughly 3% market share.
      Against the more appropriate $23.7 B IaaS SAM, penetration is under 1%.
      This suggests very significant growth runway, but it also reflects the reality
      that the intranet market remains highly fragmented across dozens of specialist
      vendors, Google and Microsoft incumbent positions, and open-source alternatives.
    claimRefs:
      - CM003
      - CM006

