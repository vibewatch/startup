  - id: TM004
    title: Growth drivers and adoption constraints
    notes: >
      Direction: positive = tailwind; negative = headwind. Timing: short = within
      12 months, medium = 1–3 years, long = 3+ years. Implications and diligence
      asks are the research author's interpretation of evidence in this chapter.
    claimRefs:
