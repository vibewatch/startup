    columns:
      - Driver / constraint
      - Direction
      - Timing
      - Implication
      - Diligence ask
    rows:
      - - AI features (search, content creation, analytics, agent automation)
        - positive
        - Short / current
        - Differentiates premium vendors; compresses feature gaps; creates upsell path
        - What share of LumApps' 2,200+ customers have activated AI features? What is renewal impact?
      - - Hybrid and remote work normalization (~1 day remote/week globally, stable since 2023)
        - positive
        - Ongoing
        - Sustains demand for digital communications layer that bridges office and home
        - Is hybrid durability enough to justify a multi-year platform contract renewal cycle?
      - - Frontline / deskless worker inclusion (80% of global workforce)
        - positive
        - Short / medium
        - Expands TAM from knowledge workers to operations, retail, healthcare, logistics
        - Can LumApps + Beekeeper win frontline mandates against mobile-first specialists (Staffbase, Blink, Flip)?
      - - 'Declining employee engagement (Gallup: 21% globally in 2024, down from 23%)'
        - positive
        - Ongoing
        - Increases CFO willingness to invest in platforms that demonstrably lift engagement
        - What ROI or engagement-lift evidence does LumApps publish from deployments?
      - - Microsoft 365 / SharePoint bundling at near-zero incremental cost
        - negative
        - Ongoing
        - Forces overlay positioning; requires documented SharePoint adoption failure to justify spend
        - What is LumApps' empirical win rate in competitive evaluations against Microsoft-native deployments?
      - - Long procurement cycle (13 internal + 9 external influencers; 60%+ require trials)
        - negative
        - Ongoing
        - Extends sales cycles; increases CAC; demands structured POC program
        - What is LumApps' average sales cycle length and POC-to-close conversion rate?
      - - EU AI Act (high-risk HR system obligations active 2026) and EU Pay Transparency Directive (June 2026)
        - positive / negative
        - Short / current
        - Compliance demand rewards governed platforms; but delays procurement as buyers validate compliance
        - Does LumApps have a published EU AI Act compliance posture for its AI features?
      - - 'Employee change fatigue (Gartner: 73% of HR leaders say employees fatigued by change)'
        - negative
        - Ongoing
        - Slows deployment momentum; creates adoption risk even after purchase; elevates churn risk
        - What is LumApps' disclosed or estimated net revenue retention? What is its deployment failure rate?

