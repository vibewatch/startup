chapter:
  number: 1
  title: Company Overview
  summary: 'LumApps is a Lyon-founded enterprise intranet and employee-experience software company that now presents itself as an AI employee hub spanning communications, productivity, workflows, and learning. Public evidence shows a step-change in ownership and scale over the last two years: Bridgepoint bought control in a $650 million 2024 deal, then backed the 2025 combination with Beekeeper at a valuation above $1 billion. Current operating disclosures support a large, international enterprise footprint, but they also show inconsistent user-count claims and limited standalone financial transparency.'
sections:
- id: identity-platform
  title: Identity, product scope, and operating footprint
  body: 'LumApps began in Lyon in 2012 and shipped its first product in 2015 for Veolia, giving the company a longer operating history than many newer employee-experience vendors. The product narrative has also expanded materially. Rather than describing itself as a simple social intranet, LumApps now markets an AI employee hub that combines communications, knowledge, productivity, workflows, learning, and enterprise search in one governed experience. That positioning is consistent across the homepage and company profile, which emphasize reducing tool sprawl and turning communication into action for desk-based and frontline workers alike. The company remains strongly anchored in the Google and Microsoft ecosystems, but it also presents itself as a neutral orchestration layer that can sit above HR, IT, and messaging systems. Public footprint claims are sizeable for a private European SaaS vendor: LumApps says it connects more than seven million employees daily, serves over 2,200 enterprise
    customers, and employs more than 600 people across nine offices. Those figures support the view that LumApps has moved beyond a regional intranet vendor into a global enterprise software platform, although later 2026 sources introduce some inconsistency on exact user counts that should be preserved rather than forced into a single rounded number.'
