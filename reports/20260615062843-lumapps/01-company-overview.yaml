- id: scale-proof-and-milestones
  title: Scale proof, customer traction, and milestone record
  body: 'Public milestone evidence shows LumApps building scale through a mixture of partner leverage, customer wins, and selective acquisitions. The historical record on the company page captures the core arc: launch in Lyon, early Google recommendation, international offices by 2017, Microsoft partnership by 2019, then product broadening through Vizir and Teach on Mars before the 2024-2025 capital events. Independent proof points support that arc. Google Cloud’s case study describes a platform that scaled to millions of users, maintained 99.97% uptime over six years, shipped updates every six weeks, and once onboarded a first customer with more than 100,000 users within four months. TechCrunch and Advatera also reinforce enterprise credibility by naming or detailing deployments at Airbus, Publicis Sapient, Electronic Arts, Japan Airlines, and others. Customer quality is therefore easier to verify than standalone financial quality. The main caution is disclosure consistency: historical
    sources cite 400 clients and four million users, Bridgepoint cited roughly 700 clients and five million users in 2024, Business Wire cited 2,000+ clients and seven million users for the combined group in 2025, and LumApps’ own 2026 messaging ranges from 7M+ daily connected employees to more than 10 million users. Those figures are directionally positive, but they should be treated as dated milestones rather than a single audited KPI.'
