summary:
  headline: >-
    LumApps 已经在企业级规模上搭出可信的 AI 员工中枢，合并 ARR 达 $150M，并有 Bridgepoint 支持；但私企信息不透明、Beekeeper 整合风险和偏高的 >$1B 估值，使判断只能停留在观察，直到
    NRR 和毛利率披露。
