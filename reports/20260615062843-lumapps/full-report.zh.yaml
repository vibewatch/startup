              LumApps 披露的合并经常性收入约 $150 M，即便对照较窄的 $4.8 B 内网软件 TAM，也意味着约 3% 市场份额。对照更合适的 $23.7 B IaaS SAM，渗透率低于
              1%。这说明增长跑道很长，但也反映内网市场仍高度碎片化，分散在数十家专业供应商、Google 与 Microsoft 在位地位以及开源替代方案之间。
