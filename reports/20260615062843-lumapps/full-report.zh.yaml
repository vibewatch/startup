          low: 55
          high: 75
          unit: $M
          note: GetLatka 约 ~$63M；区间反映计量方法不确定性（ARR vs. 确认收入）
        - label: EBITDA 利润率（LumApps 独立，合并前）
          low: 8
          high: 18
          unit: '%'
          note: 按投资人评论估算为 10-15%；区间反映调整后与 GAAP 口径不确定性
        - label: 毛利率（估算）
          low: 65
          high: 80
          unit: '%'
          note: SaaS 同业基准；LumApps 尚未公开披露毛利率
        - label: 每名 FTE ARR（LumApps，2025 年 12 月）
          low: 180
          high: 220
          unit: $K
          note: 由 ~$150M ARR ÷ ~752 名员工推导；实际值可能随 Beekeeper 人员整合而不同
        - label: 收入倍数（Bridgepoint 交易）
          low: 8
          high: 12
          unit: ×ARR
          note: 按 $650M 估值 ÷ 交易时约 ~$55-80M ARR 估算；符合市场增长 15% 时 PE SaaS 收购的典型水平
    approximationNotes: 区间估算来自官方披露（ARR、估值）和 SaaS 行业基准。较窄区间表示来源佐证更强；较宽区间仅表示基准化估算。
