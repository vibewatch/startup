  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基数分层与市场足迹
        blocks:
          - type: paragraph
            body: >-
              LumApps 主要面向大型跨国企业买家。Enlyft 市场情报覆盖约 485 个被追踪部署，显示多数 LumApps 客户雇员超过 10,000 人。地域集中明显：被追踪客户中 36%
              注册在法国（反映公司里昂起源），34% 在美国，而美国也是 LumApps 明确的扩张优先级。Enlyft 数据集中最大的两个垂直行业是信息技术与服务（18%）和
              计算机软件（10%），但更广泛客户基础覆盖制造、零售、金融服务、航空、医疗和专业服务组织。2025 年与 Beekeeper
              合并后，客户宇宙从坐班知识工作者显著扩展到制造、酒店和物流中的一线与无桌面员工——这些是 Beekeeper 深耕的细分市场。合并公司在官方公司页面声称一线员工采用率为 87%。主要买方画像包括 HR 与
              People 负责人、内部沟通负责人，以及拥有全球足迹组织中的 IT 或 Digital Workplace 经理；Bridgepoint 的 Beekeeper
              新闻稿将平台定位为服务所有主要行业、从坐班到一线的每位员工。LumApps 公司页面披露全球 2,200+ 企业客户和 7M+ 每日连接员工，这些数字锚定合并 Beekeeper 后的实体。
