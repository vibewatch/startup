      - number: '5.5'
        title: 路线图、实施与技术风险
        blocks:
          - type: paragraph
            body: >-
              LumApps 的技术风险呈现分层特征，主要由最近两次收购驱动。Beekeeper 整合路线图横跨 12 到 24 个月，且两套平台短期内都没有下线计划；但模块路线图、定价层调整和 Beekeeper
              功能迁移路径仍未披露。在整合窗口签下多年 Beekeeper 合同的买家，确实无法确定现有功能是否会迁到不同 SKU 或定价层。Comeen 收购（2026 年 4 月，预计 2026 年 5
              月交割）增加第二个整合项目，不过 Comeen 已在 LumApps Marketplace 中，冷启动风险较低。Agent Studio 在 2025 年 12 月早期访问发布后，正式可用（General
              Availability）原计划 2026 年 6 月推出；任何延迟都会把企业级 AI 编排推到 2026 年下半年。多个第三方评测平台验证了实施复杂度：TrustRadius 和 Capterra
              评论者持续指出，高级管理员配置需要 HTML/CSS 技能，大型企业的后端设置可拖到数月。核心 Employee Hub 的终端用户体验评价良好，但管理员 UX
              复杂度对缺少专职内部沟通团队的组织构成真实采用风险。与 SharePoint、Staffbase 和 Simpplr 的差异化，押在平台的 AI 编排野心、双云可靠性、Google 与 Microsoft
              中立性和一线员工触达上；这些优势会在 2026-2027 年 Beekeeper 整合执行中成形或被侵蚀。
            claimRefs:
              - CE036
              - CE037
              - CE038
              - CE040
