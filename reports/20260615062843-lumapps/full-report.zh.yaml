      - number: '3.2'
        title: 能力、定价与分析师定位比较
        blocks:
          - type: paragraph
            body: >
              LumApps 的竞争优势横跨四个维度：（1）横跨 Google Workspace 和 Microsoft 365 的双生态集成深度，（2）在 2025 年 Gartner IPS Magic Quadrant
              中获得最高 Completeness of Vision 分数，（3）在配套 2025 年 Gartner Critical Capabilities 报告的全部六个用例中得分最高，以及（4）通过 2025
              年合并加入的 Beekeeper 一线触达层。对拥有混合平台环境的全球企业而言，这些是真实差异化。


              不过，分析师证据也暴露竞争弱点。在 Forrester Wave for Intranet Platforms（2026 年 Q2）中，Simpplr 在六项具体标准上超过
              LumApps——元数据、治理、奖励与认可、个性化、内部沟通和员工倾听；这些标准里 Simpplr 均获最高 5 分，而 LumApps 为 3 分。Staffbase 因 Microsoft 应用集成深度获得
              Gartner 专门认可。对优先考虑治理的受监管行业买方，或评估 AI 驱动内容生命周期工具的沟通团队而言，这些评分差距很重要。


              一线能力方面，Beekeeper 后的组合让 LumApps 在 2026 年 6 月 Blink 内网指南中达到“是（通过 Beekeeper，整合中）”，与 Staffbase 的独立一线模块、Firstup
              的全渠道一线交付、Workvivo 的移动优先社交方式形成对比。截至 2026 年中，Beekeeper 产品集完全并入 LumApps
              核心平台仍在推进中；与拥有原生一线模块的平台竞争时，这会造成近期销售叙事混乱。


              竞争集合的定价几乎完全不透明。企业平台——LumApps、Simpplr、Staffbase、Firstup 和 Workvivo——都采用年度合同的定制企业报价。行业基准显示 LumApps 起价约为每用户每月
              $8，与 Simpplr 每用户每月 $7–15 大致相当，而 Microsoft SharePoint 实际包含在每用户每月 $6 起的 M365
              许可中。企业部署的总拥有成本到第三年常常因实施、集成和变革管理成本计入后达到六位数意外开支。


              TrustRadius 企业评论者把 LumApps 的 Google Workspace 集成和多语言搜索列为优势，但也指出深度定制通常需要 HTML/CSS 知识——这是复杂性门槛，而 Simpplr
              专门用更低代码的管理模型对此做市场定位。
