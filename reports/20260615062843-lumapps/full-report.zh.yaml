      - number: '2.5'
        title: 规模尽调缺口与相互矛盾的估计
        blocks:
          - type: paragraph
            body: >
              现有市场证据中最重要的缺口，是没有分析机构发布的规模口径能匹配 LumApps 实际产品边界。数字工作场所数字（$73.4 B）过宽；内网软件数字（$4.8 B）排除了 Beekeeper
              增加的托管服务和一线应用收入；HCM 无桌面数字（$13.5 B）主要是 HR 工作流，而不是员工沟通。LumApps 可能竞争的是一个把三者部分相加的可服务市场，但没有公开估计覆盖这个精确组合。

              第二个结构性缺口，是 IaaS 估计（$23.7 B）与内网软件估计（$4.8 B）之间有一个数量级差距。差异来自边界方法（IaaS
              包含平台服务、托管和迁移；软件不包含），但两个出版方都没有披露足够详细的方法，使投资者无法重建基础。LumApps 代表软件加服务模式（SaaS 平台叠加实施和客户成功），Beekeeper 后约 $150 M
              的经常性收入意味着，即使按较窄软件估计，其份额也只是不到一个百分点的一小部分——这创造显著增长空间，也意味着市场份额必须在多个地区与大量竞争者争夺。

              第三个缺口是竞争份额数据。Forrester Wave 按能力和战略维度评估 13 家供应商，但不公布各供应商收入份额或客户数。Gartner 数字员工体验管理类别页面在研究期间无法访问（仅 JavaScript
              渲染）。因此，无法用现有公开来源独立确认 LumApps 在内网平台供应商中的收入排名。
            claimRefs:
              - CM046
              - CM047
              - CM050
