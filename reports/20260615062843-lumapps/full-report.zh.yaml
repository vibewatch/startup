      - number: '5.4'
        title: 安全、治理与合规
        blocks:
          - type: paragraph
            body: >-
              LumApps 自 2019 年起持有信息安全管理 ISO 27001 认证，并在 2026 年 5 月完成 SOC 2 Type II
              审计且未发现例外，覆盖客户数据资产的安全性、可用性、处理完整性、保密性和隐私。所有静态数据均使用 AES-256 加密，传输中数据也加密。平台托管在 Google Cloud 和 Microsoft Azure
              上，采用多数据中心复制，实现 SLA 支撑的 99.97% 可用性。企业认证通过 Microsoft、Google、SAML V2.0 和 OpenID 的 SSO
              集中管理；管理员无需工程介入，即可在角色、地点和部门层面配置细粒度 RBAC。AI 智能体与 Micro-Apps 在明确治理边界内运行，确保员工自助操作留在 IT 批准范围内。LumApps
              定期做渗透测试，并维护信息安全、事件管理、数据分类和业务连续性等详细安全政策。CTO 兼联合创始人 Elie Mélois 称，银行、医疗和国防客户基础驱动了平台的安全投入姿态；SOC 2 公告提到当时覆盖超过
              400 万用户。公司声称遵守 GDPR。关键披露缺口包括加密密钥管理架构、渗透测试的确切频率与范围，以及具体 SLA 处罚条款——这些均未公开。
