      - number: '1.4'
        title: 规模证明、客户牵引与里程碑记录
        blocks:
          - type: paragraph
            body: >-
              公开里程碑显示，LumApps 靠伙伴杠杆、客户赢单和选择性收购共同放大规模。公司页面的历史记录勾勒出主线：Lyon 起步，早期获得 Google 推荐，2017 年前后开设国际办公室，2019 年建立
              Microsoft 合作，然后通过 Vizir 和 Teach on Mars 拓宽产品，最后进入 2024–2025 年资本事件。独立证据也支撑这条曲线。Google Cloud
              案例研究描述了一个扩展到数百万用户、六年保持 99.97% 正常运行时间、每六周发布更新，并曾在四个月内上线首个 100,000+ 用户客户的平台。TechCrunch 和 Advatera 也通过点名或详述
              Airbus、Publicis Sapient、Electronic Arts、Japan Airlines
              等部署，强化了企业级可信度。因此，相比单体财务质量，客户质量更容易验证。主要提醒在披露一致性：历史来源称 400 家客户和 400 万用户，Bridgepoint 2024 年称约 700 家客户和 500
              万用户，Business Wire 2025 年称合并集团 2,000+ 客户和 700 万用户，而 LumApps 自身 2026 年信息从 7M+ 日活连接员工到超过 1,000
              万用户不等。这些数字方向上积极，但应视为不同时点的里程碑，而不是单一经审计 KPI。
