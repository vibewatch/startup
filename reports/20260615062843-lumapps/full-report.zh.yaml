        - id: ps-revenue
          label: |-
            专业服务收入
            （估算占总收入 10-20%）
        - id: addon-revenue
          label: |-
            附加模块收入
            （Learning、Video、Workflows）
        - id: gross-profit
          label: |-
            毛利润
            （估算 SaaS 利润率 65-80%；
            PS 约 20-40%）
        - id: ebitda
          label: |-
            EBITDA
            （估算合并前 LumApps 为 10-15%）
        - id: expansion
          label: |-
            扩张 ARR
