  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品界面与模块架构
        blocks:
          - type: paragraph
            body: >-
              LumApps 面向三类主要员工触点提供企业员工枢纽：坐班员工使用带品牌、集成 Google 或 Microsoft 的网页门户；一线与无桌面员工获得继承自 2025 年 Beekeeper
              收购的移动优先体验；所有员工可在枢纽内使用嵌入式 Micro-Apps，直接调用第三方系统动作——请假申请、IT 工单、排班视图——无需离开平台。模块图谱包括六个已可生产使用的组件：Employee
              Hub（内联网沟通与知识）、Frontline App、Micro-Apps、Enterprise AI Search、Learning，以及新的 Agent Hub AI 编排层；另有 2026 年 4
              月开始整合的 Comeen 职场管理套件。Micro-Apps 已运行满一年，并确认在零售、酒店、制造和科技行业的 30 家大型企业落地；其无代码构建器让 IT 团队可将
              ServiceNow、Workday、SAP SuccessFactors 和 ADP 集成部署速度提升至传统定制开发的最高 10×。平台支持 30 多种语言，并运行于 Web、iOS 和
              Android。2024–2026 年不同公告批次披露的用户数从 600 万到超过 1,000 万不等，Agent Hub 新闻稿最终采用 1,000 万；该区间更可能反映 Beekeeper
              合并后的口径，而非有机增长。第三方评分持续正面：G2 为 4.4/5（164 条评价），Capterra 为 4.1/5（39 条评价），SoftwareReviews 综合得分 8.7/10，续约意向 97%。
