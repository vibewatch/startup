  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、范围与替代品
        blocks:
          - type: paragraph
            body: >
              LumApps 位于三个重叠市场类别的交汇处。最宽的是数字工作场所——包括统一通信、端点管理、企业移动性、员工体验平台和专业服务的完整生态。多数分析机构在这一层级给出的规模（2025–2026 年 $58–73
              B）包含硬件、咨询、VDI、UC&C 基础设施，而这些并非 LumApps 所售产品。更相关的边界是内网即服务细分市场，覆盖云托管平台，可支持内部沟通、内容管理、工作流自动化和移动一线访问。该细分市场 2026
              年规模为 $23.7 B，包含 LumApps 大多数直接竞争对手（Staffbase、Simpplr、Unily、Firstup、Happeo、Powell
              Software）。最窄且可辩护的边界是真正的内网软件：不包含外围托管服务或咨询服务的专用 SaaS 层，2025 年估计为 $4.8 B。

              LumApps 面对的主要现状替代品，是 Microsoft SharePoint（通常已包含在现有 Microsoft 365 许可中，增量成本接近零）、叠加 Viva Connections 的
              SharePoint，以及面向较小 Google Workspace 部署的 Google Sites。次级替代品包括被当成事实内网使用的企业消息工具（Microsoft
              Teams、Slack），以及嵌入有限自助门户的广义 HCM 套件（Workday、SAP SuccessFactors）。ServiceNow Employee Center
              在服务交付层竞争。每种替代品带来的切换成本不同：SharePoint 深嵌 M365 租户，但采用失败有充分记录（平均只有 13% 员工每天使用任何内网），从而创造替换机会。Google Sites
              更弱，也更容易被替换。HCM 套件门户覆盖不同工作流，很少被视为沟通优先内网的完整替代品。

              扩大 LumApps 可服务机会的邻近市场，是面向无桌面和一线员工的 HCM，2025 年估计为 $13.5 B，CAGR 为 15%。LumApps 2025 年收购
              Beekeeper，明确就是为了拿下这个邻近市场的一部分。Google Cloud 决定把 LumApps 与 AODocs 一起作为云原生内网替代方案进行联合营销，面向从 SharePoint Server
              迁移的企业，这进一步证明公司在尽可能宽的市场定义下进行定位。
