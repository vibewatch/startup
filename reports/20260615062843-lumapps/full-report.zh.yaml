      - number: '8.2'
        title: 估值框架与财务赞助方入场背景
        blocks:
          - type: paragraph
            body: >
              Bridgepoint 2024 年 5 月交易将 LumApps 定价为 $650M——约为过去 12 个月 ARR ~$63M 的 10.3×。对非 AI 私有 SaaS 而言，这是异常高溢价：2026
              年私有软件交易中，低于 5% 能超过 10× ARR；多数非 AI 企业 SaaS 在私有市场按 4–7× 交易。该溢价的理性基础在于盈利能力、作为欧洲血统下一代内联网领导者的战略稀缺性，以及
              Bridgepoint 对整合协同的确信；这些协同将在十二个月后的 Beekeeper 合并中兑现。

              William Blair 作为 LumApps 独家财务顾问，确认交易于 2024 年 7 月 9 日完成。交易按二级买断设计；所有既有机构投资人——Goldman Sachs
              Alternatives、Eurazeo Growth、Bpifrance 和 IRIS——均出售持股。仅 Eurazeo 就产生超过 €210M 的毛出售回款，对其风险基金是 9× MOIC，对成长基金是
              4.4×，确认交易前 PitchBook 约 $255M 估值标记相对于内在价值偏保守。LumApps 在达到 PE 交易成熟度前，仅于 2017–2020 年三轮融资拿到 $102M 风险资本，资本效率异常高。

              2025 年 7 月 Beekeeper 合并后，合并集团重新定价至约 $1.1B，对 $150M 经常性收入约 7.3×。这更接近中档私有 SaaS 估值，也略低于可比 Staffbase 2022
              Series E 隐含倍数约 5.7×（尽管 Staffbase 当时收入基数更小）。Bridgepoint 2024 Annual Report 由 LSE 上市收购方于 2025 年 3
              月发布，提供了最清晰的独立证据，证明该交易重要性和财务赞助方对 LumApps 的组合承诺。GetLatka 对 LumApps「$108M 估值」的追踪标记反映的是 2024 年前 VC
              时代数据库条目，应视为过时历史参考，而非交易现实。
