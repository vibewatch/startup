      - number: '2.2'
        title: 市场规模——TAM、SAM 和 SOM 视角
        blocks:
          - type: paragraph
            body: >
              五个独立视角给出对 LumApps 可服务市场差异很大的规模结论，而差异来自边界选择，不是分析错误。The Business Research Company 估计 2026 年全球数字工作场所市场为 $73.4
              B，到 2030 年 CAGR 为 24.4%——这个数字包括云基础设施、VDI、UC&C 和咨询服务，远超 LumApps 产品范围。同一出版方估计 2026 年内网即服务市场为 $23.7 B，到 2030
              年以 12.3% CAGR 增至 $38 B。Research and Markets 报告称，纯内网软件细分市场 2025 年为 $4.8 B，到 2034 年以 15.6% CAGR 增至 $22.1
              B，是更窄的切口。Mordor Intelligence 跟踪面向无桌面和一线员工的 HCM 市场，2025 年为 $13.5 B，到 2031 年以 14.9% CAGR 增至 $30.7
              B——Beekeeper 合并后，这个邻近市场变得直接相关。员工体验平台细分市场的综合口径则把 EXP 专属市场放在 2026 年 $4.7–7.8 B、约 9%
              CAGR，定义更紧，围绕敬业度、分析和旅程编排，而不是内网内容管理。

              这些估计范围给投资者造成真实的规模判断难题：最宽 TAM（$73 B）具有误导性，因为 LumApps 只在其中很窄一层竞争。更相关的 SAM——面向全球 500+ 员工企业销售的云内网和 EXP
              平台——若以内网 IaaS 为锚，2026 年可能位于 $15–25 B 区间。可服务可获得市场（SOM）更难拆分；LumApps 自身约 $150 M 的经常性收入锚点（Beekeeper 后，2025
              年）意味着，即便按较窄内网软件估计，渗透率也低于 1%。这留下非常大的增长空间，但也凸显该细分市场竞争激烈。

              这些视角之间的 CAGR 区间（9%–24%）对估值重要：若用 24% CAGR 的数字工作场所 TAM 对标 LumApps，增长可选性看起来很大；若用 9% CAGR 的较窄 EXP
              市场对标，增长溢价会大幅收缩。没有任何单一公开估计能完美隔离 LumApps 的 SAM，公司自己的传播也使用宽泛品类语言（“digital workplace”“employee
              experience”），但没有给出精确市场规模。
