      - number: '6.4'
        title: 留存代理指标与客户满意度证据
        blocks:
          - type: paragraph
            body: >-
              公开可得的最可量化留存信号，是 Google Cloud 案例研究中提到的 99% 续约率，当时 LumApps 已超过 400
              万用户。虽然该案例研究没有精确发布日期，但属于一线来源，且与近期独立调查数据一致。SoftwareReviews 2026 报告显示，91% 受访 LumApps 用户打算续约，推荐可能性 82%，正面情绪
              87%，平台整体得分 7.8/10。相对成本的价值满意度为 78%。截至 2025 年夏，FeaturedCustomers 汇总 2,761 个参考评分，综合 4.8/5；对 B2B
              内联网供应商而言，这一规模并不常见。TrustRadius 记录一名来自 10,000+ 员工企业的已验证评论者，称部署后员工参与度提升 65%。不过也存在负面信号。GetApp 已验证评论汇总显示推荐可能性为
              64%（低于 SoftwareReviews 数据），并将 LumApps 描述为存在性价比更高的替代品。eLearning Industry 2025–2026
              年评论提到，后端管理复杂和布局自定义有限是最常见痛点； 北美用户特别指出，法国团队时区差距拖慢支持响应。多条评论称内置分析较基础，限制内部沟通团队获取深度内容表现数据。Simpplr 竞品比较引用 Gartner
              观点称，LumApps 客户可能需要额外资源和支持才能充分利用高级配置选项，显示实施复杂度可能带来账户风险。Net Revenue Retention 未公开披露。
