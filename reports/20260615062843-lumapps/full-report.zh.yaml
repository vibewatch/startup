  - id: TI005
    title: 公开财务缺口与尽调请求
    columns:
      - 缺失指标
      - 对分析的影响
      - 阻塞级别
      - 具体尽调路径
    rows:
      - - 经审计合并集团 GAAP/IFRS P&L（2021-2025）
        - 无法核验实际确认收入与 ARR；法国实体 2019-2020 年仅显示 €12-19M，而公司声称 ARR 为 $36-63M，说明可能存在未公开合并的多实体结构
        - 阻塞
        - 向 CFO 索取经审计集团财务；若已有 Bridgepoint 标准报告，索取 2024 和 2025 年董事会材料
      - - 净收入留存（NRR）—— LumApps 与 Beekeeper 分列
        - 无法判断扩张 / 流失动态；这对 SaaS 估值倍数至关重要；2025 年 SaaS 行业 NRR 中位数为 101%
        - 重要
        - 索取各品牌季度 NRR cohort 数据；另问 logo 留存
      - - 按业务线拆分的毛利率（软件 vs. 专业服务 vs. Beekeeper）
        - 无法判断 Beekeeper 整合或专业服务占比带来的毛利稀释；估计为 65-80%，但未获佐证
        - 重要
        - 索取分部 P&L，拆出软件毛利率与专业服务毛利率；估算云成本协同兑现情况
      - - 客户集中度 —— 前 10 大客户收入占比
        - 若锚定客户流失，无法评估收入风险；在集中型企业市场，前 10 大客户可能贡献 ARR 的 15-30%
        - 重要
        - 索取前 10 大客户 ARR 占总 ARR 百分比；确认合同条款和续约日期
      - - 内生与外延收入贡献
        - 2021 年以来四次收购，加上 Beekeeper，使内生增长率不透明；无法评估 CAC 效率或真实产品驱动增长
        - 重要
        - 索取 2021-2025 年收购贡献 ARR 与内生 ARR 的桥表；确认收购 ARR 如何入账
      - - 合并后整合成本与协同时间表
        - 无法判断合并后真实盈利能力或成本协同兑现；Beekeeper 合并前接近盈亏平衡；整合成本未披露
        - 重要
        - 索取整合预算、预期协同 run-rate，以及完全整合 P&L 的时间表
      - - 地域收入拆分（美洲 vs. EMEA vs. APAC）
        - 无法评估各区域增长率或地理客户集中度；美国扩张被列为优先事项，但收入结构未经验证
        - 次要
        - 索取按区域拆分的收入；与员工数和销售团队配置对照
    notes: 阻塞 = 投资承销前必须取得；重要 = 显著影响判断；次要 = 可提升置信度。所有缺口都源于 LumApps 作为 PE 支持的私营实体运营，没有公开披露义务。
