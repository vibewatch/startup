  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价架构
        blocks:
          - type: paragraph
            body: >
              LumApps 主要通过年度 SaaS 订阅创收，按用户或企业固定费用计价。平台只通过定制企业合同销售；没有公开发布价格。第三方比较平台引用的基础层级指示性起价约为每用户每月 $8，大型企业部署逐单谈判，估计年度
              ACV 在 $50,000 到 $500,000+。定价受用户数、地域范围、所需集成（Google Workspace、Microsoft
              365、Workday、ServiceNow）和合同期限显著影响。多年承诺是企业客户的标准做法，支撑较高的经常性收入可预测性。

              除核心内网 SaaS 订阅外，LumApps 通过产品收购叠加了其他收入流：Novastream 视频层（2021）、Heyaxel 工作流附加模块（2022）、Vizir 聊天机器人能力（2022）以及
              Teach On Mars 移动学习（2023）都贡献增量许可收入。Beekeeper 一线平台（2025 年 7 月收购）增加第二条主要 SaaS
              收入流，面向无桌面员工，价格点不同于核心办公室内网。专业服务（实施、迁移和定制集成）构成有意义的补充收入线，不过 LumApps 不披露其相对软件的占比。

              收入模式在结构上经常性且基于订阅，因此具备有利的单位经济特征（高毛利潜力、多年锁定，以及通过附加模块和席位增长实现扩张的机会）。主要尽调缺口，是缺乏任何关于成交价相对标价、平均折扣率以及专业服务占总收入比例的公开数据。收入结构清晰度很重要，因为专业服务收入通常毛利较低且不可重复。
