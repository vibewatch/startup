      - number: '8.5'
        title: 退出准备度与最终尽调优先事项
        blocks:
          - type: paragraph
            body: >
              Bridgepoint 是上市私募股权集团，AUM 超过 €41B，结构上偏向中期流动性。Beekeeper 联合创始人兼 CEO Cris Grossmann 公开表示，「中期来看，IPO
              或贸易出售都是选项」，并称欧洲和美国都可作为 IPO 地点——对一家私营公司而言，这种退出可选性的披露少见地坦率。合并后集团拥有 $150M ARR，并声称首日即盈利；若资本市场重新愿意以 5–8x ARR
              给成长型软件定价，公司具备在 2027–2029 年窗口提交 IPO 的财务轮廓。出售给大型 HCM 或协作平台（SAP、ServiceNow、Salesforce 或
              Zoom）是另一条退出路径，并可能带来战略溢价，但每个潜在买方在自身企业技术栈中都要面对 Microsoft 相关反垄断审查。

              Bridgepoint 在欧洲企业 SaaS 退出上的记录——2023 年 Kyriba 出售给 Bridgepoint Credit，2024 年 Brevo 登陆
              Euronext——显示，只要规模和增长可信，它更偏好公开上市。LumApps Group 拥有 700 万+ 用户、2,200+ 企业客户和 $150M ARR，足以讲出一个低于 $2B 估值的 IPO
              故事；但这个故事必须拿出经审计的 NRR、毛利率披露和 Beekeeper 独立 ARR，才能经得住机构尽调。连续七年不披露财务指标，是外部投资者信心的最大障碍；任何公开市场流程推进前，都必须补上这个缺口。
            claimRefs:
              - CV031
