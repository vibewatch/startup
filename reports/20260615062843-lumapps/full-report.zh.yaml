      - number: '7.4'
        title: 运营、AI 依赖与宏观 / 预算风险
        blocks:
          - type: paragraph
            body: >-
              LumApps 的 AI Hub 战略对第三方 LLM 提供商形成结构性依赖，包括 Google Gemini、Microsoft Copilot 和 OpenAI
              APIs。任何提供商的定价变化、能力迁移、模型退役或排他安排，都可能扰乱 AI 功能，并迫使整个平台做高成本再集成。考虑到 Microsoft 原生 Copilot 与 M365 集成，可为 M365
              订阅者提供不额外收费的竞争 AI 层，这种依赖尤其尖锐。需求侧，Beekeeper 2025 年 3 月一线研究发现，36% 一线员工不信任 AI 工具，只有 17% 认为 AI
              能改善日常工作——这直接逆风于合并实体在 Beekeeper 客户基础中的 AI 采用命题。ETR 2025 年 4 月宏观调查发现，在地缘政治和经济不确定性下，组织 IT 支出变得更挑剔、更重成本、更重风险，约
              22% 企业计划削减 IT 预算。HR 技术相对有韧性——约 49% HR 负责人预计 2026 年预算增加——但 LumApps 的高端定价和漫长企业销售周期，使其在预算冻结周期中更脆弱。SP Global
              估计 2025–2026 年全球 HR 技术市场为 $42.5B，CAGR 约 12%，提供长期支撑背景；不过员工体验和人员分析中的竞争强度被描述为不断升级，既有厂商和敏捷创业公司都在抢着交付 AI
              个性化功能。创始人兼 CEO Sébastien Ricard 仍是财务赞助方、伙伴和客户关系的核心；2025 年 9 月合并后加入的领导层，在合并实体中的履历仍有限。
