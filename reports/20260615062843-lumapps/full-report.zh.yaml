              自 2015 年 Veolia 成为第一个企业部署以来，LumApps 披露的客户规模显著扩大。Google Cloud 案例研究记录，平台上线四个月内就导入第一个超过 100,000 用户的客户，并在
              Google Cloud 基础设施上实现六年 99.97% 服务可用性。到 2024 年 Bridgepoint 控股投资时，LumApps 独立平台约有 700 家客户、约 500 万用户。2025 年 7 月
              Beekeeper 合并公告披露，合并集团拥有 2,000+ 客户、700 万每日连接用户和约 $150M 经常性收入，宣称规模出现台阶式跃升。2026 年 4 月 Comeen 收购新闻稿把用户数提升到超过
              1,000 万，不过两次披露之间的方法可能已从日活跃转向总注册。Gartner 2025 Critical Capabilities for Intranet Packaged Solutions 报告独立将
              LumApps 评为六个用例全部第一——Employee Engagement、Resource Portal、Employee and Workplace Services、Intelligent
              Assistance、Knowledge Services 和 Work Management——相对于 2,200+ 客户基础，给出强第三方平台广度背书。公司提出到 2030 年达到 1 亿用户，意味着从
