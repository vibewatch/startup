      - number: '7.3'
        title: 监管、隐私与安全风险
        blocks:
          - type: paragraph
            body: >-
              LumApps 为全球企业中超过 700 万每日连接用户处理员工个人数据，跨越多个监管辖区。公司持有 ISO 27001:2022 认证，完成 2024 全年 SOC 2 Type II 审计且无例外，并列入
              CSA STAR Registry。截至 2026 年 6 月，GDPR Enforcement Tracker 未显示针对 LumApps 的 GDPR
              执法行动，也没有公开披露的安全泄露或数据事件。向前看，风险明显更高：EU AI Act 的高风险 AI 条款自 2026 年 8 月起具有约束力；任何处理员工个人数据的 AI 系统——包括 LumApps AI
              Hub 工作流——都需要扩大技术文档、合格声明和 Fundamental Rights Impact Assessments。违反 AI Act 最高可能罚 €35M 或全球年营业额 7%，超过 GDPR 4%
              上限。European Commission 2025 Digital Omnibus 改革提案进一步增加启用 AI 的 SaaS 供应商监管不确定性。欧盟到美国的跨境数据传输仍受 Standard
              Contractual Clauses 和充分性决定约束，可能被法律或政治变化打断。Taylor Wessing 指出，组织必须区分 GDPR 后处理义务与 AI Act
              人类监督要求，从而形成双重合规负担。在跨过任何高风险 AI 部署边界前，LumApps 的 AI 功能合规姿态需要外部法律审查。
