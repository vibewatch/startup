            body: >-
              LumApps 拥有一组具名企业参考客户，横跨航空、网络安全、金融交易所、汽车、科技和工业分销。Japan Airlines（JAL）部署 LumApps，以触达约 36,000
              名员工，覆盖飞行员、空乘、地勤和海外分支。该部署需要日英多语言内容管理、细粒度 SSO 权限设置，以及通过 API 集成将实时航班数据送入员工门户。Palo Alto Networks 是一家全球网络安全公司，在
              40 个办公室拥有超过 10,000 名员工；其从旧 Jive 平台迁移了超过 53,000 个页面，并在 COVID-19 疫情期间不到两个月上线名为 The Loop 的品牌化 LumApps
              内联网，稳定了危机期间的实时信息共享。加拿大交易所运营商 TMX Group 在迁移 Google Workspace 后六个月内实施 LumApps，选择该平台是因为其原生 G Suite
              集成和法英双语内容支持。2025 Gartner Magic Quadrant 新闻稿列出 Google、Workday、Publicis Sapient 和 Airbus 为具名客户。2026 年 4 月
              Comeen 收购新闻稿和 Beekeeper 合并材料点名 Zapier 和 Genuine Parts Company。跨国公用事业公司 Veolia 是 LumApps 2015
              年平台发布时的第一个企业客户。截至 2025 年夏，FeaturedCustomers 汇总 76 条推荐、58 个案例研究和 152 个总参考，2,761 个评分下综合 4.8/5。TrustRadius
              评论者包括来自 National Veterinary Associates（10,000+ 员工）、Global Payments（30+ 国家 24,000 员工）和 Instructure
              的管理员，确认平台在不同行业大型企业中持续生产使用。
