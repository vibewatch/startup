      - number: '2.3'
        title: 买方与细分市场格局
        blocks:
          - type: paragraph
            body: >
              企业内网采购是多方参与的流程。Forrester 2026 年 State of Business Buying 对近 18,000 名全球买方的调查发现，典型企业软件决策涉及 13 名内部利益相关者和 9
              名外部影响者；若采购包含生成式 AI 功能，采购小组规模会翻倍（14 人 vs. 7 人）。采购专业人员如今在 53% 的购买周期中是决策者，从一开始就参与功能、性能规格和价格，而不仅是合同条款。超过 60%
              买方表示承诺采购前会使用试用或试点；金额超过 $10 M 的采购中，78% 先要求试用。这种动态有利于 LumApps 这类提供结构化 PoC 项目的供应商，但也显著拉长销售周期。

              内网和员工体验平台的预算归属分散在三类职能之间：IT（基础设施、安全、集成）、HR（敬业度、入职、人员分析）和 Internal Communications（编辑、活动、治理）。大型企业通常需要跨职能
              steering 模型；中端市场交易往往由 IT 总监单独牵头。预算所有者因用例触发因素而变：驱动因素是工具整合或 Microsoft 迁移时，IT 牵头；驱动因素是敬业度或文化时，HR 或 Comms
              牵头。LumApps 同时定位为 Google Workspace 集成伙伴和企业 HR 技术，意味着它必须在同一销售周期里穿行于两种买方原型。

              细分覆盖五类画像。拥有 5,000+ 员工的全球企业代表最高价值账户，需要多语言支持、多站点治理，并符合 EU 数据驻留规则——这些都是 LumApps 有文档证明的能力。中端市场公司（1,000–5,000
              名员工）是最高量细分，对价格更敏感。一线和无桌面组织——零售商、制造商、医疗系统——通过 Beekeeper 收购变成直接可服务对象，且在 HCM 无桌面市场 15% CAGR
              推动下，是增长最快的子细分。Google Workspace 和 Microsoft 365
              用户代表不同购买画像：前者通常是缺乏强内网传统的较小组织（带来绿地机会），后者则是在位防守者，需要有足够强的理由，才会在 SharePoint
              旁边增加第三方层。受监管行业（金融服务、医疗、制药）是高溢价细分，合规验证周期更长，也偏好拥有 SOC 2、ISO 27001 和 GDPR 认证的供应商。

              该格局中的关键负面信号是采用率：整个市场里，91% 组织运行内网，但只有 13% 员工每天使用，近三分之一从不登录。IDC 报告称，尽管内网本为避免信息查找而设计，员工仍每天花 2.5 小时搜索信息。SWOOP
              Analytics 给出的平均日活使用时长只有 6 分钟。这些数字是全行业数据，并非单独针对
              LumApps，但它们说明销售挑战不只是获得新客户，还要把已许可席位转化为真正活跃用户，而这个指标直接影响续约和扩张经济性。
