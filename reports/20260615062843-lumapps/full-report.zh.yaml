  - id: FV004
    title: 投资 KPI 记分卡
    type: kpi
    layout: standard
    summary: |
      面向 IC 的 LumApps Group 七个投资维度评分；每项按 1–5 分评级，依据为截至 2026 年 6 月可获得的公开证据。
    data:
      items:
        - label: 市场机会
          value: 4
          max: 5
          note: $9–10B TAM，15% CAGR，传统方案渗透率低；估计值由 Bridgepoint 引用
        - label: 产品 / 技术验证
          value: 3
          max: 5
          note: Gartner MQ Leader；AI 功能已上线；Beekeeper 整合推进中
        - label: 客户验证
          value: 4
          max: 5
          note: 2,200+ 企业客户；Airbus、LVMH、Japan Airlines；7M+ 用户
        - label: 财务质量
          value: 2
          max: 5
          note: 未披露 NRR、毛利率、流失；ARR 质量未经审计；不透明是核心卡点
        - label: 竞争护城河
          value: 3
          max: 5
          note: 按规模计为领先 IPS；Google Workspace 集成构成护城河；Microsoft Viva 是结构性威胁
        - label: 估值吸引力
          value: 2
          max: 5
          note: 约 7.3x ARR，高于非 AI SaaS 私有市场 4–7x 中位区间；偏紧但不极端
        - label: 证据质量
          value: 3
          max: 5
          note: 多个独立来源相互印证；但公开渠道没有经审计财务数据
    approximationNotes: |
      评分是作者基于截至 2026 年 6 月公开证据作出的判断。量表：1=很差，2=差，3=中等，4=好，5=优秀。并非来自量化评分模型。
    claimRefs:
      - CV006
      - CV009
      - CV012
      - CV013
      - CV025
      - CV039
      - CV042
