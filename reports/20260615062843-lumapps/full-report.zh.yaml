companyProfile:
  summary: >-
    LumApps 是一家法国私营企业软件公司，2012 年由 Sébastien Ricard 和 Élie Mélois 在 Lyon 创立。公司销售 AI
    员工中枢，把内网沟通、知识管理、生产力集成、工作流、学习和企业搜索整合进一个受治理的体验，覆盖办公室员工和一线员工。Bridgepoint 于 2024 年 7 月以 $650M 交易收购多数股权，随后在 2025 年 7
    月支持其与瑞士一线员工平台 Beekeeper 合并，形成估值超过 $1B、合并经常性收入约 $150M 的实体。并购后的集团服务 2,200+ 企业客户的 7M+ 日活员工，在全球约有 750
    名员工。核心尽调限制在于私营公司不透明（不披露经审计集团财务、NRR 或毛利率）、两家 PE 支持 SaaS 平台合并带来的整合执行风险，以及在 Microsoft Viva 以套件竞争的市场里入场倍数偏高。
