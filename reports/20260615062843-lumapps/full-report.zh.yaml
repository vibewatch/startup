chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品范围与运营足迹
        blocks:
          - type: paragraph
            body: >-
              LumApps 2012 年起步于 Lyon，并在 2015 年为 Veolia 交付首个产品，因此运营历史长于许多更新的员工体验供应商。产品叙事也明显扩张。LumApps
              不再把自己描述成简单的社交内网，而是销售 AI
              员工中枢，把沟通、知识、生产力、工作流、学习和企业搜索整合到一个受治理的体验中。官网和公司介绍的定位一致，都强调减少工具蔓延，并把沟通转化为行动，同时覆盖办公室员工和一线员工。公司仍深度扎根于 Google 和
              Microsoft 生态，但也把自己呈现为可置于 HR、IT 和消息系统之上的中立编排层。对一家欧洲私营 SaaS 供应商而言，公开足迹已经不小：LumApps 称其每天连接超过 700 万名员工，服务
              2,200 多家企业客户，并在 9 个办公室拥有 600 多名员工。上述数字支持一个判断：LumApps 已经从区域性内网供应商，走向全球企业软件平台；不过 2026
              年后续来源对确切用户数给出不一致口径，应保留差异，而不是强行归并成一个四舍五入数字。
