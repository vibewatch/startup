          to: addon-revenue
          label: 追加销售 / 交叉销售
        - from: saas-subscription
          to: gross-profit
          label: 高利润率软件收入
        - from: ps-revenue
          to: gross-profit
          label: 较低利润率服务
        - from: addon-revenue
          to: gross-profit
