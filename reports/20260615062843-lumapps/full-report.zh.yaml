      - number: '4.2'
        title: 收入轨迹与 ARR 增长
        blocks:
          - type: paragraph
            body: >
              LumApps 的收入增长轨迹从早期亏损延伸到合并独角兽。法国官方公司备案（经 Craft.co 报道）显示，FY2019 收入为 €12.0M，FY2020 为 €19.1M，经营亏损分别为 -€3.2M 和
              -€3.7M——早期增长年份 EBIT 利润率为 -27% 和 -19%。到 2020 年 1 月 Series C 公告时，CEO Sébastien Ricard 提到“同比收入增长超过 100%”，意味着
              FY2019 基数翻倍。随后 LumApps 报告截至 FY2021 已连续六年创下收入增长纪录。行业数据服务 GetLatka 将 LumApps 单体 ARR 放在 FY2024 约 $63M，较 2020
              年报告的 $36M ARR 累计增长 75%。

              Bridgepoint 对交易的评论称 LumApps 增速是“市场的两倍”——这意味着相对内网行业 15% 市场 CAGR，年 ARR 增长约 30%。如果准确，这大致对应 $36M 到 $63M
              四年轨迹所隐含的复合年增长率（实际约 15% CAGR，不过 2019–2021 高增长期之后可能已有放缓）。 “市场两倍增长”的叙事与已报道数据呈现的四年 CAGR
              之间存在差异，需要澄清。Bridgepoint 以 $650M 收购单体公司，隐含约 10× 往绩 ARR 收入倍数——对一个 15% 增长市场中声称盈利的 SaaS 领导者而言偏高但仍可解释。

              2025 年 7 月合并公告披露，LumApps+Beekeeper 合并实体总经常性收入约 $150M，并表示到 2030 年翻倍至 $300M 的目标。以 2025 年基数计算，到 2030 年达到
              $300M 需要约每年 15% 的复合增长——低于声称的“市场两倍”增速，说明管理层预计相对过去增长阶段会有所放缓，部分反映规模化挑战和 Beekeeper 合并带来的整合复杂性。
