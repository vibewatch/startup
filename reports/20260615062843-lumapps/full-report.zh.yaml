      - number: '1.2'
        title: 领导团队、治理与伙伴协同
        blocks:
          - type: paragraph
            body: >-
              领导层连续性是 LumApps 故事里较清晰的一部分。公司页面仍将 Sébastien Ricard 标为董事长兼 CEO，联合创始人 Élie Mélois 担任高级技术职务，Vincent Ortiou 担任
              CFO。这一点重要，因为公司近期所有权变化并未伴随创始人退出。Bridgepoint 收购控制权时明确表示，创始人与高级管理层会继续持股；随后 Beekeeper 整合传播周期里，Ricard 和 Mélois
              仍是核心运营者。Beekeeper 合并后，公开领导团队扩容，2025 年 9 月在产品、营销、人事以及战略 / 转型等岗位任命高管，用于拉齐合并后的组织。同时，LumApps
              的商业身份仍与大型平台伙伴深度绑定。Google Workspace 页面把公司定位为优先集成选项和可通过 marketplace 采购的产品；Microsoft 365 页面则明确把 LumApps
              描述为优于以文档为中心的 SharePoint 部署的员工中枢。这样的领导与伙伴结构显示，公司在产品方向上由创始人牵引，在规模化上接受财务监督，在商业上依赖与两大生产力套件生态保持紧密关系。
