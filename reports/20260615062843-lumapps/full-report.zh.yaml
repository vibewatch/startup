  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局——直接同业、在位套件与替代品
        blocks:
          - type: paragraph
            body: >
              LumApps 所处竞争场域分为多层，覆盖直接内网打包解决方案（IPS）同业、套件在位者、邻近敬业度平台和现状替代方案。最关键的直接同业是 Staffbase、Simpplr、Firstup、Unily 和
              Workvivo——每家公司都声称拥有企业级内网或员工体验能力，但定位和融资基础各不相同。


              Staffbase 是收入规模最大的纯内网竞争对手，截至 2024 年 12 月 ARR 已超过 $193M，估值由 2022 年 Series E 定在 $1.1B。公司面向企业多渠道沟通，主打
              Microsoft 优先的集成叙事和 2,500+ 客户，并在 2025 年 9 月发布 Employee AI——其智能体 AI 平台。Simpplr 由 Norwest Venture Partners 和
              Salesforce Ventures 支持，截至 2025 年 9 月 ARR 达 $51.6M，拥有 1,000+ 客户，并在 IPS 同业中获得最高的 Forrester Ability to
              Execute 分数。Unily（CVC Capital Partners）、Firstup 和 Workvivo（被 Zoom 收购）补齐直接同业集合。


              Microsoft Viva 和 SharePoint 代表套件在位者威胁。SharePoint 从每用户每月 $6 起随 Microsoft 365 捆绑，为大多数企业 IT
              环境创造零增量成本替代方案。Viva Connections、Viva Engage 和 Copilot 集成在 Microsoft 生态内延伸员工体验层。对完全标准化在 M365 上的组织而言，留在
              SharePoint/Viva 的成本本质上为零，因此它是主导性现状竞争者，而不是一项独立采购决策。


              2025–2026 年的两个结构性事件实质改变竞争格局。第一，Meta 于 2026 年 6 月 1 日关闭 Workplace from Meta，迫使约 700 万用户迁移。Meta 在 2024 年 5
              月选择 Workvivo 作为唯一首选迁移伙伴，把大批企业买方导向 Zoom 生态，而不是 LumApps 或 Staffbase。第二，Staffbase 和 Unily 都在 2025 年底宣布 AI
              原生平台重设计——Staffbase 在 2025 年 9 月推出 Employee AI，Unily 在 2025 年 10 月推出 Unily Futures 平台（用于站点生成的 Indy AI agent
              和 Glass 对话界面）——压缩了 LumApps 的 AI 差异化窗口。


              现状替代品包括由 IT 管理的传统 SharePoint 内网、企业邮件加 Teams 沟通，以及 DIY 内部自建选项——这些往往是企业交易停滞的最常见原因，而不是客户转向竞争对手。
