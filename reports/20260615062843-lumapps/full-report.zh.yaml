      - number: '1.3'
        title: 所有权从 VC 支持的规模化公司转为 PE 平台
        blocks:
          - type: paragraph
            body: >-
              LumApps 近期历史中决定性的所有权事件，是 Bridgepoint 的多数股权投资。公司与投资方官方公告，加上独立报道，都把 2024 年交易锚定在 $650M
              交易价值。交易看起来主要是控制权转移，而不是典型的一级成长融资：Goldman Sachs Alternatives、Bpifrance Large Venture 和 IRIS 出售股权，Eurazeo
              保留少数股权，管理层继续持股。TechCrunch 补充了有用背景：PitchBook 在交易前给 LumApps 的估值约 $255M，上一轮公开融资是 2020 年的 $70M。Bridgepoint
              将投资逻辑落在国际扩张、AI 驱动产品开发、交叉销售和持续 M&A 上，这也解释了为什么 LumApps 很快推进与 Beekeeper 的大规模战略合并。下一步实质改变了规模叙事。2025
              年宣布、由同一赞助方支持的 Beekeeper 交易，把合并公司估值推到超过 $1B，并给出约 $150M 经常性收入锚点。结果是，这家公司如今不再像独立融资的 SaaS
              规模化公司，而更像一个由赞助方支持的整合平台，所处的内网和员工体验市场本身也在向 AI 和一线员工用例收敛。
