      - number: '5.3'
        title: AI 能力与 Agent Hub
        blocks:
          - type: paragraph
            body: >-
              2025 年 11 月 Agent Hub 发布，是 Beekeeper 合并后 LumApps 最关键的产品公告。它针对企业 AI 采用中的结构性问题：当 AI copilot
              分散在几十个应用和单一套件助手里，员工不知道工作该从哪里开始。Agent Hub 把 LumApps 定位成单一、受治理的工作空间；无论底层智能体调用哪个系统，员工都在这里发现并调用 AI
              智能体。架构包含三部分。Agent Studio 是面向 IT 和开发者的无代码环境，用于构建、管理和串联 agent-to-agent（A2A）工作流，同时连接外部工具、设计自定义提示词。Agent
              Library 提供预构建、自定义和第三方智能体的仓库，包括首个用于自动创建培训课程的 Learning Agent。Smart Orchestrator
              位于路由层，分析每个请求，并将其导向最符合上下文的智能体或企业系统。LumApps 的战略优势来自部署基础：平台已是酒店、制造、医疗和零售等行业超过 1,000 万员工的每日起点，让受治理的 AI
              智能体一上线就有触达。Agent Hub 新闻稿点名的参考客户包括 Ascension Health、Zapier 和 Genuine Parts Company。Comeen 收购（2026 年 4 月）把
              Agent Hub 延伸到实体办公空间，增加 AI 工位预订、数字标牌和访客管理。2026 年路线图目标是 25+ 个开箱即用 agents，并在企业 copilots 之间做更深编排；Agent Studio
              正式可用（General Availability）计划于 2026 年 6 月推出。
