      - number: '5.2'
        title: 架构与集成生态
        blocks:
          - type: paragraph
            body: >-
              LumApps 运行在横跨 Google Cloud 和 Microsoft Azure 的双云基础设施上，具备 SLA 支撑的 99.97%
              可用性、自动备份和多数据中心复制，消除单点故障。集成层是商业核心：Microsoft 365 和 Google Workspace 原生连接器是主要 GTM 抓手，连接器目录还通过 REST 和 GraphQL
              API 延伸到 ServiceNow、Workday、SAP SuccessFactors、Slack、ADP 和 UKG。开发者通过 developer.lumapps.com 官方门户接入平台，文档覆盖
              OAuth2 认证、webhooks、Python SDK，以及用于自定义分析看板的 Data Lake 连接器。公开 GitHub 组织托管 LumX 设计系统（TypeScript，当前仓库 25
              个星标）、扩展模板，以及最初的 AngularJS LumX 框架（历史 1.9k 星标）；虽然核心平台代码仍为私有，这些资产证明开发者社区参与是真实存在的。企业认证通过
              Microsoft、Google、SAML V2.0 和 OpenID 的 SSO 管理；管理员无需工程介入，就能按角色、地点和部门配置细粒度访问。Micro-Apps 可在 LumApps 主页、看板、AI
              搜索、内部邮件，以及 Microsoft Teams、Slack、Google Chat 等协作平台复用。Google Cloud 案例研究独立确认了六周更新节奏；该案例覆盖六年生产部署，并记录整个周期
              99.97% 可用性。
