      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >
              2026 年，内网和员工体验平台市场最强增长驱动因素，是把 AI 集成进搜索、内容创建、分析和工作流自动化。Forrester 2026 年 Q2 Wave 发现，全部 13 家被评估供应商都嵌入了 AI
              能力，但只有约一半参考客户在有意义地使用这些能力——这说明采用缺口同时带来风险（价值被过度承诺）和机会（AI 在生产中成熟后的未来加售）。McKinsey 2025 年调查发现，88%
              组织报告至少一个业务职能经常使用 AI，同比大幅上升，这维持了高管层压力：员工内网必须为 AI 做好准备。World Economic Forum 预计，到 2027 年约 75% 公司将采用
              AI，进一步增加需求压力。

              混合办公常态化是结构性顺风。Trip.com 的一项大型随机试验发现，每周两天远程的混合政策把离职率降低三分之一，且不损害绩效。Gallup 2025 年全球数据显示，2024 年敬业度为 21%（低于前一年的
              23%），经理敬业度为 27%（低于 30%）。敬业度下滑让高管更急于投资内网平台所提供的沟通和文化基础设施。IBM 研究直接量化了 ROI 框架：提供顶级员工体验的组织，收入增长比同业高
              31%。一线机会是增长最快的需求口袋，由零售商、医疗系统和制造商推动，它们希望把数字工作场所延伸到全球 80% 不坐办公室的劳动力。Mordor Intelligence 预计该市场到 2031 年 CAGR 为
              15%。

              约束端，Microsoft 捆绑的 SharePoint 和 Viva 仍是最重要的结构性逆风。SharePoint 已包含在大多数 Microsoft 365 许可中，增量成本接近零；企业只有在能记录
              SharePoint 采用失败时，才有理由增加专业内网。第一年为适当定制 SharePoint 内网投入 $100,000–$400,000 的实施成本，也会增加论证第三方支出的压力。监管演进增加复杂性：EU
              AI Act 于 2024 年生效，广泛的高风险 HR 系统义务在 2026 年启动；EU Pay Transparency Directive 要求各国法律在 2026 年 6 月 7
              日前落地。两者都带来合规投资压力，可能延迟购买周期，但也奖励治理资质强的供应商。采购参与扩大和试用要求拉长购买周期，也进一步约束短期收入可预测性。

              敬业度下滑数据（Gallup）和变革疲劳信号（Gartner：73% HR 领导者称员工对变革疲劳，74%
              称经理没有能力领导变革）形成双面动态：它们强化了更好员工体验平台的理由，但也让部署期间获得高管赞助和用户采用变得更难。
