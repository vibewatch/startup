        title: 可比公司与交易基准
        blocks:
          - type: paragraph
            body: >
              最接近的直接可比公司是 Staffbase。这家总部位于 Chemnitz 的员工沟通平台在 2022 年 3 月估值达到 $1.1B（General Atlantic 领投的 $115M Series E
              轮），2024 年 ARR 为 $193M，对应当前隐含倍数约 5.7x。Staffbase 与 LumApps 功能重叠，但 Staffbase 历来在 Microsoft 365
              集成和企业沟通上更强，LumApps 则在 Google Workspace 和内网深度上领先。Simpplr 估值约 $155M，2025 年 ARR 为 $51.6M，交易倍数约
              3x；这一倍数明显更低，反映其仍处于 VC 阶段、规模也更小。

              Workvivo 交易提供了战略并购参照：Zoom 在 2023 年 4 月以约 $220M 收购这家员工体验平台。按 Workvivo 收购前 ARR 估计在 $20–30M 区间计算，隐含战略倍数为
              7–11x。这个溢价说明，买方愿意为平台相邻性和自有用户基础付钱；若 LumApps 走贸易出售路线，同样可能受益于这种逻辑。

              PitchBook 2025 年 Q4 企业 SaaS 上市可比公司表给出更宽的市场背景：2025 年 Q4，企业 SaaS EV/TTM 收入中位数为 5x，跟踪的 102 家公司中有 76
              家同比倍数下降。Multiples.vc 2026 年 6 月数据把横向 SaaS（内容管理与协作）划在约 1.9–2.9x EV/收入，明显低于 LumApps
              的隐含倍数——这意味着当前估值要么计入并购溢价，要么押注其增长韧性更强。Mordor Intelligence 显示，员工体验平台市场 2025 年规模为 $3.42B，并以 9.35% CAGR 增长至
              2031 年；这为任何可比分析提供可服务市场基础，但若没有披露单位经济模型，本身不足以支撑溢价倍数。
