      - number: '4.3'
        title: 资本结构与融资历史
        blocks:
          - type: paragraph
            body: >
              LumApps 通过三轮融资累计拿到 $102M 风险资本：2017 年 10 月 Series A 轮 $8M（Idinvest Partners），2019 年 4 月 Series B 轮
              $24M（Idinvest Partners），以及 2020 年 1 月由 Goldman Sachs 领投、Bpifrance、Idinvest Partners、Iris Capital 和 Famille
              C 参投的 Series C 轮 $70M。Series C 轮将 LumApps 估值推至约 $255M（PitchBook），资金投向国际扩张、研发提速和早期 M&A。2020 年该轮之后，LumApps
              四年没有再融机构资本，说明其烧钱节制、收入足以自我供血，也为后续 Bridgepoint 收购打下基础。

              2024 年 7 月，Bridgepoint Europe VII 完成控股权收购，LumApps 估值 $650M——较 2020 年估值抬升 2.5×，也让 Eurazeo 获得约 6-8× 回报（其出售
              30%+ 持股，毛回款超过 €210M）。Goldman Sachs Alternatives、Bpifrance 和 IRIS 也全部退出；Eurazeo Growth
              在交割时保留少数股权。Bridgepoint 交易按二级买断设计（PitchBook 分类为 Buyout/LBO），不是一级融资——资金流向既有股东，而非进入 LumApps 经营账户。交易逻辑是借助
              Bridgepoint €62B+ AUM 网络和运营资源，加速美国扩张、AI 产品投入和后续 M&A。

              2025 年 7 月，与 Beekeeper 合并后，新控股母公司 Lynx TopCo SAS 成立，并据法国注册信息成为 LUMAPPS SAS 的法定总裁。公司重组把 LumApps 注册股本从
              €821,500 提高到 €1,014,696。合并时 Beekeeper 约有 $35M HSBC Innovation Banking 债务，承接后纳入合并后的 Lynx TopCo 结构。由于交易主要是既有
              PE 支持实体的合并，而非新融资，LumApps Group 当前现金、净债务和运营续航均未公开。不过，控股股东 Bridgepoint（$75B+ AUM）提供的实际财务兜底，使运营连续性的资本充足风险较低。
