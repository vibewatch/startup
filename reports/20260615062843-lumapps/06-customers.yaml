  - id: retention-satisfaction
    title: Retention Proxies and Customer Satisfaction Evidence
    body: >-
      The most quantifiable retention signal publicly available is the 99
      percent renewal rate stated in the Google Cloud case study, written
      when LumApps had surpassed four million users. While the case study
      does not carry a precise publication date, it is a primary-tier
      source and consistent with more recent independent survey data.
      SoftwareReviews' 2026 report shows 91 percent of surveyed LumApps
      users intend to renew, with 82 percent likelihood to recommend and
      87 percent positive emotional sentiment, scoring the platform 7.8
      out of 10 overall. Cost-relative-to-value satisfaction is reported
      at 78 percent. FeaturedCustomers aggregates 2,761 reference ratings
      at 4.8 out of 5 as of Summer 2025, a scale that is uncommonly large
      for a B2B intranet vendor. TrustRadius captures one verified reviewer
      at a 10,000+ employee firm reporting a 65 percent increase in
      employee engagement after deployment. Adverse signals are present,
      however. GetApp's verified-review aggregate shows 64 percent
      likelihood to recommend (below the SoftwareReviews figure) and
      positions LumApps as having alternatives with better value for
      money. eLearning Industry reviews from 2025–2026 cite backend
      administration complexity and limited layout customization as the
      most recurring frustrations; support response times impaired by the
      France-based team's timezone gaps are specifically flagged by North
      American users. Multiple reviews describe the built-in analytics as
      basic, limiting Internal Communications teams seeking deep
      content-performance data. The Simpplr competitor comparison cites a
      Gartner note that LumApps customers may require additional resources
      and support to fully leverage advanced configuration options,
      identifying implementation complexity as a potential at-risk signal.
      Net Revenue Retention has not been publicly disclosed.
    claimRefs:
