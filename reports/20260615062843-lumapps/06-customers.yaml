  - id: adoption-trajectory
    title: Customer Scale and Adoption Trajectory
    body: >-
      LumApps' disclosed customer scale has expanded materially since the
      first enterprise deployment with Veolia in 2015. The Google Cloud
      case study documents that the platform onboarded its first customer
      with over 100,000 users within four months of launch, achieving
      99.97 percent service uptime over six years on Google Cloud
      infrastructure. By 2024 at the time of Bridgepoint's majority
      investment, LumApps had approximately 700 clients and roughly five
      million users on its standalone platform. The Beekeeper combination
      announcement in July 2025 disclosed the combined group at 2,000+
      clients, 7 million daily connected users, and approximately $150
      million in recurring revenue, representing a step-change in declared
      scale. The April 2026 Comeen acquisition press release elevated the
      stated user count to over 10 million, though the methodology may
      have shifted from daily-active to total-registered between the two
      disclosures. Gartner's 2025 Critical Capabilities for Intranet
      Packaged Solutions report independently placed LumApps first across
      all six evaluated use cases — Employee Engagement, Resource Portal,
      Employee and Workplace Services, Intelligent Assistance, Knowledge
      Services, and Work Management — providing strong third-party
      validation of platform breadth relative to the 2,200+ customer base.
      The company's stated ambition of reaching 100 million users by 2030
      implies roughly 10x growth from the approximately 10 million users
      disclosed in April 2026.
    claimRefs:
      - CU003
      - CU004
      - CU005
      - CU010
      - CU012
      - CU013
      - CU039
