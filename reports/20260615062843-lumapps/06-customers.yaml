  evidenceGaps:
    - type: missing-source
      severity: material
      topic: deployment-model
      missingEvidence: >-
        Average time-to-full-deployment, typical annual contract value range,
        standard contract length, and professional services scope for LumApps
        enterprise deals in 2025-2026.
      whyItMatters: >-
        Without ACV and contract-length data it is impossible to build a
        bottoms-up revenue model or assess quality of the $150M combined ARR
        figure. Implementation complexity is flagged as an at-risk signal in
        Gartner and adverse user reviews, making deployment timeline data
        material for churn risk assessment.
      diligencePath: >-
        Request sales-motion overview and representative deal terms from LumApps
        CFO; triangulate against Latka peer database entries and Bridgepoint
        investor pack.
      relatedQuestionRefs:
        - QU007
        - QU014

    - type: private-evidence-only
      severity: material
      topic: churn-data
      missingEvidence: >-
        Documented customer churn events, failed deployments, or measurable
        attrition data for LumApps or Beekeeper in 2024-2026.
      whyItMatters: >-
        The 99% renewal rate from the Google Cloud case study is historical and
        pre-Beekeeper. The combination with Beekeeper introduces integration
        risk and potential customer overlap. No public churn data exists to
        validate retention assumptions.
      diligencePath: >-
        Review customer departure announcements and G2/Gartner Peer Insights
        for recent churn signals; request post-Beekeeper retention cohort data
        from Bridgepoint or LumApps CFO.
      relatedQuestionRefs:
        - QU011
      relatedTableRefs:
        - TU003

    - type: missing-source
      severity: material
      topic: land-and-expand
      missingEvidence: >-
        Net Revenue Retention (NRR) data, upsell ARR contribution as a percent
        of new ARR, and module cross-sell attach rates for LumApps and Beekeeper
        separately in FY2024-2025.
      whyItMatters: >-
        Land-and-expand economics are a primary SaaS valuation driver. NRR
        above 110% would justify a premium multiple; NRR below 95% would
        signal contraction dynamics. Without NRR the $1B+ combined valuation
        cannot be independently assessed.
      diligencePath: >-
        Request quarterly NRR waterfall (new ARR, expansion ARR, contraction
        ARR, churn ARR) from LumApps CFO or Bridgepoint; look for product-specific
        module upsell and attach rates.
      relatedQuestionRefs:
        - QU022

    - type: private-evidence-only
      severity: material
      topic: customer-concentration
      missingEvidence: >-
        Revenue share from the top 5 and top 10 LumApps customers as a percent
        of total ARR, along with contract renewal dates for anchor accounts.
      whyItMatters: >-
        Enterprise SaaS with heavy large-enterprise concentration can face
        material revenue risk if key accounts churn; typical PE diligence
        flags greater than 30 percent top-10 concentration as an elevated risk.
        LumApps' enterprise skew (majority of customers are 10,000+ employee
        firms) makes this gap material.
      diligencePath: >-
        Request customer-level ARR breakdown in management pack from Bridgepoint
        or LumApps CFO; confirm top-10 account contract renewal schedule.

acknowledgedWarnings:
  - dimension: figureType
    reason: >-
      FU004 uses bar type instead of planned cohort type because LumApps does
      not publicly disclose NRR or time-series retention cohort data; the bar
      figure displays available satisfaction and renewal-proxy metrics from
      SoftwareReviews 2026 and GetApp 2026 as the closest available retention
      proxies.
