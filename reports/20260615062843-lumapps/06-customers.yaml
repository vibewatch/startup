callouts:
  - calloutType: strength
    title: Named Reference Quality is Broad and Cross-Vertical
    body: >-
      LumApps has a deep and diverse named reference base spanning aviation
      (JAL), cybersecurity (Palo Alto Networks), financial exchanges (TMX
      Group), aerospace (Airbus), and industrial distribution (Genuine Parts
      Company). With FeaturedCustomers aggregating 2,761 reference ratings at
      4.8/5 and 58 case studies, the reference base is unusually large for a
      B2B intranet vendor and suggests strong customer referencebility.
    claimRefs:
      - CU007
      - CU021
      - CU023

  - calloutType: risk
    title: Retention Data Is Proxied — Audited NRR Remains Undisclosed
    body: >-
      The 99% renewal rate from the Google Cloud case study is historical and
      pre-Beekeeper. Independent survey data (91% plan to renew per
      SoftwareReviews) is directionally positive but methodologically weaker
      than an audited NRR cohort. Net Revenue Retention has never been
      publicly disclosed by LumApps, limiting assessment of upsell efficiency
      and contraction risk in the combined entity.
    claimRefs:
      - CU016
      - CU017

  - calloutType: risk
    title: Microsoft Viva Bundling Poses Ongoing Churn Risk
    body: >-
      Microsoft Viva is bundled at no additional list cost in Microsoft 365
      E3 and E5 licences, which are near-ubiquitous in large enterprise
      accounts. A Gartner note cited by Simpplr warns that LumApps customers
      may require additional resources to leverage advanced configuration
      options, hinting at implementation complexity that can create
      vulnerable accounts when Microsoft Viva is actively promoted by IT
      departments seeking consolidation.
    claimRefs:
      - CU035
      - CU041

  - calloutType: insight
    title: Frontline Expansion via Beekeeper Meaningfully Diversifies the Base
    body: >-
      The Beekeeper combination in mid-2025 added an entirely new customer
      segment — frontline and deskless workers in manufacturing, retail, and
      hospitality — that classical intranet players rarely serve well. This
      structural diversification reduces the platform's dependence on
      large-enterprise desk-worker deployments and opens a materially larger
      addressable market (80 percent of the global workforce is estimated to
      be deskless). The 87% stated frontline adoption rate is a positive
      leading indicator, though independent evidence for this metric is limited.
    claimRefs:
      - CU011
      - CU040

