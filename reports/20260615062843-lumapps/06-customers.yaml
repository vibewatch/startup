chapter:
  number: 6
  title: Customers
  summary: >-
    The combined LumApps and Beekeeper group serves 2,200+ enterprise customers
    and 7M+ daily connected employees spanning technology, manufacturing, retail,
    aviation, and financial services as of mid-2025, anchored by a
    company-disclosed 99% renewal rate and 91% plan-to-renew per 2026
    independent review platforms. Named production deployments at Japan Airlines,
    Palo Alto Networks, TMX Group, Airbus, Google, and Genuine Parts Company
    demonstrate broad vertical reach and enterprise-scale maturity, while
    Gartner Critical Capabilities top scores across all six evaluated intranet
    use cases and a 4.8/5 FeaturedCustomers rating from 2,761 references
    provide strong third-party validation. Key diligence gaps include
    undisclosed customer concentration, absence of audited post-Beekeeper NRR
    cohort data, and limited transparency on organic growth vs. inorganic
    contribution to the combined $150M recurring revenue figure.

sections:
  - id: customer-segmentation
    title: Customer Base Segmentation and Market Footprint
    body: >-
      LumApps targets large multinational enterprises as its primary buyer
      segment, with Enlyft market-intelligence data covering approximately 485
      tracked deployments showing that the majority of LumApps customers employ
      more than 10,000 people. Geographic concentration is notable: 36 percent
      of tracked clients are domiciled in France (reflecting the company's Lyon
      origins) and 34 percent in the United States, which is LumApps' declared
      expansion priority. The two largest industry verticals are Information
      Technology and Services at 18 percent and Computer Software at 10 percent
      of the Enlyft dataset, though the broader customer base extends across
      manufacturing, retail, financial services, aviation, healthcare, and
      professional services organisations. The 2025 combination with Beekeeper
      materially expanded the customer universe beyond desk-based knowledge
      workers to frontline and deskless employees in manufacturing, hospitality,
      and logistics — segments where Beekeeper had deep traction. The combined
      company claims an 87 percent frontline adoption rate on its official
      company page. Primary buyer personas span HR and People leaders, Internal
      Communications directors, and IT or Digital Workplace managers at
      organisations with global footprints, with Bridgepoint's Beekeeper press
      release positioning the platform as serving every worker from desk to
      frontline across all major industries. The LumApps company page states
      2,200+ enterprise customers worldwide and 7M+ daily connected employees,
      figures anchored to the combined post-Beekeeper entity.
    claimRefs:
      - CU001
      - CU002
      - CU011
      - CU031
      - CU036
      - CU037
      - CU038
    tableRefs:
      - TU001
    figureRefs:
      - FU001

  - id: named-deployments
    title: Named Deployments and Case Study Evidence
    body: >-
      LumApps maintains a portfolio of named enterprise reference customers
      spanning aviation, cybersecurity, financial exchanges, automotive,
      technology, and industrial distribution. Japan Airlines (JAL) deployed
      LumApps to reach approximately 36,000 employees across pilots, flight
      attendants, ground staff, and overseas branches. The deployment required
      multilingual Japanese and English content management, fine-grained SSO
      permission settings, and API integration delivering real-time flight
      data to the employee portal. Palo Alto Networks, a global cybersecurity
      firm with over 10,000 employees across 40 offices, migrated more than
      53,000 pages from its legacy Jive platform and launched a branded
      LumApps intranet called The Loop in under two months during the
      COVID-19 pandemic, stabilising real-time information sharing during the
      crisis. TMX Group, Canada's exchange operator, implemented LumApps
      within six months following its Google Workspace migration, selecting
      the platform for native G Suite integration and bilingual
      French-English content support. The 2025 Gartner Magic Quadrant
      press release cites Google, Workday, Publicis Sapient, and Airbus as
      named customers. The April 2026 Comeen acquisition press release and
      the Beekeeper combination materials name Zapier and Genuine Parts
      Company. Veolia, the multinational utility, was LumApps' very first
      enterprise client at platform launch in 2015. FeaturedCustomers
      aggregates 76 testimonials, 58 case studies, and 152 total references
      rated at 4.8 out of 5 across 2,761 ratings as of Summer 2025. TrustRadius
      reviewers include administrators from National Veterinary Associates
      (10,000+ employees), Global Payments (24,000 employees in 30+ countries),
      and Instructure, confirming sustained production use at large enterprises
      across diverse sectors.
    claimRefs:
