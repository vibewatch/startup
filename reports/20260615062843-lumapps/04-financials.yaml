callouts:
  - calloutType: risk
    title: French Entity Operating Losses Contradict Simple Profitability Narrative
    body: >
      LumApps' official French company filings (via Craft.co, reflecting Registre du Commerce
      et des Sociétés data) show operating losses of -€3.2M (-27% EBIT margin) in FY2019 and
      -€3.7M (-19% EBIT margin) in FY2020 — years when management was reporting strong growth.
      While LumApps became profitable at a group level by 2024 (per CEO and CTO statements),
      the French legal entity concentrates holding costs and R&D, potentially masking group-level
      profitability signals. No audited consolidated group financials are publicly available;
      external due diligence should request the consolidated P&L rather than relying solely
      on the French entity filing.
    claimRefs:
      - CI009
      - CI011
      - CI039

  - calloutType: strength
    title: Bridgepoint Exit Returns Confirm Strong Business Fundamentals
    body: >
      Eurazeo's ~6-8× return on its 30%+ LumApps stake (>€210M gross proceeds vs. a ~€30M cost
      basis) and the clean full exit of Goldman Sachs, Bpifrance, and IRIS at $650M standalone
      valuation demonstrate that multiple sophisticated institutional investors underwrote and
      profited from LumApps' growth story. This investor validation, combined with Bridgepoint's
      commitment of further capital for US expansion and AI product development, provides
      a strong external signal that LumApps' financial performance is real and sustainable.
    claimRefs:
      - CI005
      - CI006
      - CI021
      - CI026

  - calloutType: insight
    title: Revenue Doubling Target Implies Moderate 15% CAGR — Not Re-Acceleration
    body: >
      The $300M by 2030 target from the July 2025 merger announcement requires approximately
      15% CAGR from the ~$150M 2025 base — precisely matching the stated market growth rate,
      not the "double the market" narrative Bridgepoint used to describe LumApps' prior trajectory.
      This suggests the combined entity is targeting market-rate growth, not outperformance,
      possibly reflecting integration complexity, the Beekeeper platform's different market maturity,
      and a more cautious approach at unicorn scale. Investors should probe whether the organic
      LumApps business is being diluted by Beekeeper's slower-growth or lower-margin profile.
    claimRefs:
      - CI016
      - CI017
      - CI018
      - CI037

