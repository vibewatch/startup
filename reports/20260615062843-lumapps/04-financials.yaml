  - id: capital-structure-and-history
    title: Capital Structure and Financing History
    body: >
      LumApps raised $102M in venture capital across three rounds: an $8M Series A in October 2017
      (Idinvest Partners), a $24M Series B in April 2019 (Idinvest Partners), and a $70M Series C
      in January 2020 led by Goldman Sachs with Bpifrance, Idinvest Partners, Iris Capital, and
      Famille C. The Series C valued LumApps at approximately $255M (PitchBook) and funded
      international expansion, R&D acceleration, and initial M&A activity. LumApps did not raise
      further institutional capital for four years after the 2020 round, implying a disciplined burn
      rate and revenue self-sufficiency that underpinned the eventual Bridgepoint acquisition.

      In July 2024, Bridgepoint Europe VII completed a majority-stake acquisition valuing LumApps at
      $650M — a 2.5× valuation step-up from the 2020 round and a ~6-8× return for Eurazeo (which
      sold its 30%+ stake for gross proceeds exceeding €210M). Goldman Sachs Alternatives, Bpifrance,
      and IRIS also exited in full; Eurazeo Growth retained a minority position at close. The
      Bridgepoint deal was structured as a secondary buyout (Buyout/LBO per PitchBook classification),
      not a primary capital raise — meaning proceeds went to existing shareholders rather than into
      LumApps' operating balance sheet. The strategic rationale was accelerated US expansion, AI
      product investment, and further M&A using Bridgepoint's €62B+ AUM network and operational
      resources.

      In July 2025, the Beekeeper combination created a new holding parent, Lynx TopCo SAS, which
      became the legal president of LUMAPPS SAS per the French registry. The corporate restructuring
      increased LumApps' registered share capital from €821,500 to €1,014,696. Beekeeper carried
      approximately $35M in HSBC Innovation Banking debt at the time of merger, the assumption of
      which now sits within the combined Lynx TopCo structure. Because the transaction was primarily
      a combination of existing PE-backed entities rather than a new capital raise, LumApps Group's
      current cash position, net debt, and operating runway are not publicly disclosed. With Bridgepoint
      ($75B+ AUM) as controlling shareholder, however, the effective financial backstop makes capital
      adequacy risk low for operational continuity.
