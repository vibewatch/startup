  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: financial-statements
      missingEvidence: "Audited consolidated group P&L, balance sheet, and cash flow statement for LumApps Group (FY2022-2025), covering all legal entities including French SAS, US corp, Japan KK, and post-merger Beekeeper entities."
      whyItMatters: "Without audited group financials, all revenue, profitability, and margin claims rely solely on company-disclosed press release figures and third-party ARR estimates. French entity filings show operating losses in 2019-2020; later-year and consolidated data are unavailable for external validation."
      diligencePath: "Request board-level financial reporting package from LumApps CFO; if investor data-sharing is available via Bridgepoint LP reporting, leverage that channel."
      relatedQuestionRefs: [QI019, QI027]

    - type: missing-source
      severity: material
      topic: net-revenue-retention
      missingEvidence: "Quarterly NRR cohort data for LumApps standalone and Beekeeper standalone, covering at least FY2022-2025."
      whyItMatters: "NRR is the primary driver of SaaS valuation multiples; without it, the $1B+ combined valuation cannot be independently assessed. The 2025 SaaS industry median NRR is 101% — LumApps may be above or below depending on enterprise expansion vs. seat contraction dynamics."
      diligencePath: "Request NRR waterfall (new ARR, expansion ARR, contraction ARR, churn ARR) segmented by product line from the CFO or investor relations contact."
      relatedQuestionRefs: [QI012]

