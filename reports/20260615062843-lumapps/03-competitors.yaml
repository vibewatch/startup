callouts:
  - calloutType: risk
    title: Simpplr Forrester execution gap is a near-term renewal risk
    body: >
      Simpplr's Forrester Wave Q2 2026 advantage across governance, personalization, and internal communications criteria creates an adverse signal for LumApps renewals in Governance-sensitive verticals (financial services, healthcare, regulated industries). Procurement teams that use Forrester as a primary evaluation framework may shortlist Simpplr ahead of LumApps in the near term.
    claimRefs:
      - CP026
      - CP027
      - CP025

  - calloutType: risk
    title: Microsoft Viva bundling is the highest-severity competitive threat
    body: >
      Microsoft SharePoint and Viva Connections are effectively included at zero incremental cost in M365 E3/E5 licenses. As Copilot AI capabilities expand within M365, the value-add argument for a standalone IPS diminishes for M365-standardized organizations. LumApps' dual-platform story (Google + Microsoft) is its strongest hedge but does not fully neutralize the cost pressure in accounts that have already standardized on Microsoft.
    claimRefs:
      - CP031
      - CP032
      - CP034

  - calloutType: insight
    title: Workplace from Meta shutdown created a one-time displacement opportunity—mostly captured by Workvivo
    body: >
      Meta's June 2026 data deletion deadline forced approximately 7 million enterprise users to select new platforms. Meta's designation of Workvivo as its only preferred migration partner effectively pre-selected most of that cohort for the Zoom ecosystem, limiting the competitive windfall for LumApps and Staffbase. This structural event demonstrates how enterprise distribution channel decisions can shape competitive outcomes independently of product quality.
    claimRefs:
      - CP014
      - CP015
      - CP016

  - calloutType: strength
    title: Google Cloud partnership is a structurally unique AI differentiator
    body: >
      LumApps describes its Google Cloud partnership as unique among IPS vendors—enabling advanced AI capabilities and backend services that competitors cannot easily replicate without a comparable relationship. This provides a potential head-start on Google Workspace AI features and a credibility advantage with Google-centric enterprise buyers.
    claimRefs:
      - CP028
      - CP022

