    - type: enumeration-incomplete
      severity: material
      topic: frontline-reach
      missingEvidence: "The exact feature parity and integration completeness between LumApps core and Beekeeper as of mid-2026 is not independently verified. The Blink guide flags the integration as 'mid-integration' but does not provide a milestone timeline."
