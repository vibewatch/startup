callouts:
  - calloutType: risk
    title: Critical bundling threat from Microsoft Viva nine-module suite
    body: >-
      Microsoft's 2026 consolidation of Viva Connections as the native SharePoint app in Teams,
      combined with nine overlapping Viva modules bundled into M365, makes it progressively harder
      for LumApps to justify premium per-user fees at renewal for enterprises already standardised
      on Microsoft. This is LumApps' single highest-severity competitive risk.
    claimRefs:
      - CR001
      - CR005
      - CR009
      - CR012

  - calloutType: risk
    title: Dual regulatory exposure under GDPR and EU AI Act from August 2026
    body: >-
      LumApps' AI Hub products process employee personal data for millions of users, triggering
      both GDPR and the forthcoming EU AI Act compliance obligations. August 2026 marks the binding
      date for high-risk AI provisions. The combined fine ceiling reaches 7% of global annual
      turnover under the AI Act, materially above GDPR's 4% ceiling.
    claimRefs:
      - CR028
      - CR029
      - CR030
      - CR034

  - calloutType: risk
    title: Simultaneous integrations (Beekeeper + Comeen) amplify execution risk
    body: >-
      Managing two post-acquisition integrations concurrently — Beekeeper (July 2025) and Comeen
      (2026) — while hitting a $300M revenue target by 2030 represents an elevated execution
      challenge. Management bandwidth, culture alignment, and product roadmap coherence all
      require sustained attention without the luxury of serial integration sequencing.
    claimRefs:
      - CR015
      - CR020
      - CR022

