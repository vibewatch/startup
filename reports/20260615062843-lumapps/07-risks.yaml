  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: LBO
      missingEvidence: >-
        LumApps' exact LBO leverage ratio (debt/EBITDA) from the Bridgepoint acquisition, total
        debt quantum, and interest coverage ratio are not publicly disclosed.
      whyItMatters: >-
        Without knowing actual leverage, it is impossible to quantify financial model risk under
        a revenue slowdown scenario or assess debt-service coverage adequacy.
      diligencePath: >-
        Request Bridgepoint portfolio debt profile during management due diligence; cross-check
        against Bridgepoint's annual report footnotes for the LumApps holding.
      relatedQuestionRefs:
        - QR015

    - type: private-evidence-only
      severity: material
      topic: customer-concentration
      missingEvidence: >-
        No public data discloses what percentage of LumApps' combined recurring revenue is
        concentrated in its top 10 or top 20 enterprise customers.
      whyItMatters: >-
        High customer concentration would amplify churn risk and give key clients excessive
        negotiating leverage at renewal, directly threatening revenue visibility.
      diligencePath: >-
        Request customer concentration data (top-5, top-10 ARR as % of total) and cohort
        renewal rates from management; benchmark against SaaS norms of <10% per customer.
      relatedQuestionRefs:
        - QR024

    - type: stale
      severity: minor
      topic: integration
      missingEvidence: >-
        Post-merger headcount evolution and hiring trend data for the combined LumApps–Beekeeper
        entity are not available beyond Q3 2025 disclosures.
      whyItMatters: >-
        Headcount and hiring trajectory post-merger would reveal whether integration is
        proceeding at plan pace or encountering attrition or restructuring.
      diligencePath: >-
        Monitor Revelo Labs / LinkedIn headcount signals quarterly; request attrition rates
        for Beekeeper legacy employees in management briefings.
      relatedQuestionRefs:
        - QR013

    - type: missing-source
      severity: material
      topic: regulatory
      missingEvidence: >-
        LumApps has not published an EU AI Act compliance roadmap, AI feature risk
        classification, or confirmation of which AI Hub features fall within high-risk AI
        categories under the August 2026 binding provisions.
      whyItMatters: >-
        Without this, investors cannot assess whether LumApps will be in compliance at the
        August 2026 enforcement date or faces potential regulatory exposure.
      diligencePath: >-
        Request AI Act compliance documentation, legal opinion on feature risk classification,
        and DPO confirmation during due diligence; check EU AI Office registry once live.
      relatedQuestionRefs:
        - QR006

    - type: private-evidence-only
      severity: material
      topic: regulatory-legal-risk-register
      missingEvidence: >-
        The regulatory/legal risk register (TR001) covers known frameworks but cannot enumerate
        jurisdiction-specific enforcement actions or confidential legal proceedings that have
        not been publicly disclosed by LumApps or regulatory authorities.
      whyItMatters: >-
        Undisclosed regulatory inquiries or ongoing legal disputes could represent material
        liabilities not visible in publicly available information.
      diligencePath: >-
        Request legal counsel representations and regulatory correspondence disclosure
        from LumApps during formal due diligence; conduct searches across EU DPA portals,
        CNIL, Irish DPC, and national court registries for proceedings involving LumApps.
      relatedTableRefs:
        - TR001

    - type: missing-source
      severity: minor
      topic: security
      missingEvidence: >-
        No adverse independent security audit, penetration testing summary, or third-party
        vulnerability disclosure for LumApps' platform is publicly available.
      whyItMatters: >-
        The absence of adverse security signals is confirming but incomplete; an independent
        assessment would quantify residual attack surface risk.
      diligencePath: >-
        Request latest pen-test report executive summary and any responsible-disclosure
        programme history from LumApps trust team during technical due diligence.
      relatedQuestionRefs:
        - QR031
