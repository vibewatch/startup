  - id: exit-readiness-and-diligence-priorities
    title: Exit Readiness and Final Diligence Priorities
    body: >
      Bridgepoint, as a listed private equity group with €41B+ AUM, is structurally oriented toward
      medium-term liquidity. Beekeeper's co-founder and CEO Cris Grossmann publicly stated that
      "midterm, an IPO or a trade sale are options" and cited both Europe and the US as viable IPO
      venues—an unusually candid disclosure of exit optionality for a private company. The combined
      group's $150M ARR and claimed day-one profitability give it the financial profile to file
      for an IPO in the 2027–2029 window if capital markets re-open for growth software at 5–8x ARR
      multiples. A trade sale to a large HCM or collaboration platform (SAP, ServiceNow, Salesforce,
      or Zoom) represents an alternative exit with potential strategic premium, though each suitor faces
      Microsoft antitrust scrutiny in their own enterprise stack.

      Bridgepoint's track record in European enterprise SaaS exits—Kyriba to Bridgepoint Credit in 2023,
      Brevo listed on Euronext in 2024—suggests a preference for public listings where scale and growth
      are credible. LumApps Group's 7M+ user count, 2,200+ enterprise roster, and $150M ARR give it
      the scale for a credible sub-$2B IPO story, but the story requires audited NRR, gross margin
      disclosure, and standalone Beekeeper ARR to survive institutional due diligence. The seven
      successive years of undisclosed financial metrics is the single largest barrier to external
      investor confidence, a gap that must be closed before any public market process proceeds.
