  - id: scenarios-and-return-analysis
    title: Bull / Base / Bear Scenarios and Return Analysis
    body: >
      Three scenario frames bracket the investment case. In the bull scenario, LumApps Group sustains
      20–25% annual ARR growth through 2027 by executing US cross-sell, expanding Beekeeper's frontline
      penetration in manufacturing and logistics, and converting AI product investments into measurable
      NRR improvement above 115%. Under these assumptions, ARR could reach $210–240M by 2027, supporting
      a $1.5–2.0B exit at 7–8x—a 35–80% step-up from today's $1.1B mark and a ~2–3x gross return for
      Bridgepoint from the blended acquisition cost. This scenario requires the integration to proceed
      without material customer churn and the AI product suite to demonstrate measurable productivity ROI.

      In the base scenario, ARR grows at a market-consistent 15% CAGR, reaching ~$175M by 2027 and
      ~$230M by 2030. Exit at 6x ARR in 2028–2029 implies ~$1.05–1.38B valuation, essentially flat
      to slightly above current marks. Combined profitability is preserved, avoiding a dilutive
      financing event, but returns for a PE sponsor are modest—principally driven by debt pay-down
      and platform expansion rather than multiple expansion.

      In the bear scenario, Microsoft Viva deepens its Microsoft 365 integration at zero incremental
      cost, suppressing LumApps' win rates and depressing NRR. Beekeeper integration proves slower
      than expected, incurring meaningful integration costs. ARR growth decelerates to 8–10%, and
      by 2027 exit at 4x ARR (~$640–680M) implies a write-down from the $1.1B post-combination mark.
      This scenario is particularly sensitive to European enterprise budget freezes and the pace
      of AI commoditization in enterprise productivity suites. GetLatka's $108M legacy mark is a useful
      reminder that pre-deal data can misrepresent intrinsic value—the same opacity risk now applies
      to current NRR and churn data.
