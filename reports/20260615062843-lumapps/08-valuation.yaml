        above 70%. Without these metrics, any financial model for LumApps rests on unverifiable assumptions.
      diligencePath: >
        Request financial supplement from management under NDA; benchmark against Staffbase (reported
        ~110% NRR) and Simpplr (~115% NRR) publicly disclosed figures.
      relatedQuestionRefs:
        - QV022

    - type: private-evidence-only
      severity: material
      topic: valuation
      missingEvidence: >
        Full preference waterfall including Bridgepoint's equity carry structure, management equity plan,
        and any debt instruments in the combined group's capital structure.
      whyItMatters: >
        Without the preference stack, the equity value to a secondary buyer could be materially lower
        than the headline $1.1B enterprise value, particularly in the bear case.
      diligencePath: >
        Legal disclosure; requires NDA-level access to shareholder agreement and management equity plan.
      relatedQuestionRefs:
        - QV012

    - type: private-evidence-only
      severity: material
      topic: revenue
      missingEvidence: >
        Standalone Beekeeper ARR pre-combination and the organic vs. inorganic split of LumApps'
        ARR growth (four prior acquisitions since 2021).
      whyItMatters: >
        The "double the market" growth rate claim is unverifiable without isolating organic ARR growth
        from M&A-driven ARR additions; this is critical for projecting sustainable post-PE exit growth.
      diligencePath: >
        Request management commentary on organic ARR growth; review EY-Parthenon commercial DD report
        (not publicly available).

    - type: enumeration-incomplete
      severity: minor
      topic: comparable-valuation-table
      missingEvidence: >
        Valuations for additional employee experience SaaS peers—notably Unily (acquired by ESW Capital
        2021), Powell Software, Blink, and Firstup—are not publicly available as of June 2026.
      whyItMatters: >
        The comparable set is limited to six entries. Additional data points from PE-owned and
        venture-backed peers would strengthen the multiple range and reduce reliance on the two
        best-known comps (Staffbase and Simpplr).
      diligencePath: >
        Monitor PitchBook Vertical Intelligence alerts for new employee experience platform
        transactions; subscribe to Gartner intranet IPS market report for peer financial benchmarks.
      relatedTableRefs:
        - TV004

    - type: stale
      severity: minor
      topic: SaaS-multiples
      missingEvidence: >
        Updated private SaaS transaction multiples for the employee experience vertical specifically
        (not broader horizontal SaaS) as of H1 2026.
      whyItMatters: >
        Horizontal SaaS multiples may overstate or understate the employee experience vertical, which
        has specific attributes (high enterprise retention, frontline expansion opportunity).
      diligencePath: >
        Subscribe to PitchBook Vertical Intelligence or request a Gartner market overview update
        for intranet packaged solutions vertical deal multiples.

