  - id: valuation-framework-and-entry-context
    title: Valuation Framework and Sponsor Entry Context
    body: >
      Bridgepoint's May 2024 deal pegged LumApps at $650M—approximately 10.3x trailing ARR of ~$63M.
      This is an outlier premium for non-AI private SaaS: fewer than 5% of private software transactions
      in 2026 clear 10x ARR, and most non-AI enterprise SaaS trade at 4–7x in the private market.
      The rational basis for the premium lies in profitability, strategic scarcity value as the leading
      European-heritage next-gen intranet, and Bridgepoint's conviction on consolidation synergies that
      would be realized through the Beekeeper combination twelve months later.

      William Blair, acting as exclusive financial advisor to LumApps, confirmed the deal closed on July 9, 2024.
      The transaction was structured as a secondary buyout; all existing institutional investors—Goldman
      Sachs Alternatives, Eurazeo Growth, Bpifrance, and IRIS—sold their stakes. Eurazeo alone generated
      gross sale proceeds exceeding €210M, representing 9x MOIC for its venture funds and 4.4x for growth
      funds, confirming the ~$255M pre-deal PitchBook valuation mark was conservative versus intrinsic value.
      LumApps had raised only $102M in venture capital across three rounds from 2017–2020 before reaching
      PE-deal maturity, an unusually capital-efficient trajectory.

      Following the Beekeeper combination in July 2025, the combined group re-priced at ~$1.1B, a ~7.3x
      multiple on $150M recurring revenue. This is more consistent with mid-range private SaaS valuations
      and somewhat below peer Staffbase's 2022 Series E implied multiple of ~5.7x (though Staffbase's
      revenue base was smaller at that point). The Bridgepoint 2024 Annual Report, published March 2025
      by the LSE-listed acquirer, provides the clearest independent corroboration of the deal's materiality
      and the sponsor's portfolio commitment to LumApps. GetLatka's trailing "$108M valuation" mark for
      LumApps reflects pre-2024 VC-era database entries and should be treated as a stale legacy reference
      rather than a reflection of deal reality.
