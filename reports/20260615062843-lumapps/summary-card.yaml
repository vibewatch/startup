summary:
  headline: >-
    LumApps has built a credible AI employee hub at genuine enterprise scale with $150M combined ARR and Bridgepoint
    sponsorship, but private-company opacity, Beekeeper integration risk, and a stretched >$1B valuation limit
    confidence to a track stance until NRR and gross margin are disclosed.
