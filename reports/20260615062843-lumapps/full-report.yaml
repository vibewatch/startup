              Japan Airlines, and others. Customer quality is therefore easier to verify than standalone financial
              quality. The main caution is disclosure consistency: historical sources cite 400 clients and four million
              users, Bridgepoint cited roughly 700 clients and five million users in 2024, Business Wire cited 2,000+
              clients and seven million users for the combined group in 2025, and LumApps’ own 2026 messaging ranges
              from 7M+ daily connected employees to more than 10 million users. Those figures are directionally
              positive, but they should be treated as dated milestones rather than a single audited KPI.
