      - number: '4.4'
        title: Unit Economics and Operating Efficiency Proxies
        blocks:
          - type: paragraph
            body: >
              LumApps does not publicly disclose gross margin, net revenue retention, customer acquisition cost, or
              sales cycle metrics. Best-practice SaaS benchmarks from Benchmarkit and Baker Tilly provide the relevant
              peer comparisons. At the $50-100M ARR tier, top-quartile SaaS companies achieve ARR per FTE of
              approximately $200,000; at >$100M ARR this rises to $300,000. At $150M combined ARR and approximately 752
              LumApps employees in December 2025 (not including full Beekeeper headcount integration), the implied
              ARR/FTE is approximately $200,000 — at the lower bound of the >$100M ARR benchmark tier, suggesting room
              for efficiency improvement as the two platforms integrate and scale.

              LumApps' disclosed R&D investment of approximately 45% of revenue in FY2021 is substantially above the
              2025 PE-backed median of 34%. For a PE-backed company, Bridgepoint's thesis typically targets S&M
              efficiency below the 47% VC benchmark (PE-backed companies average 33%), implying that LumApps'
              go-to-market costs as a proportion of revenue should fall with scale. The company's stated EBITDA margin
              range around 10-15% at the time of the Bridgepoint acquisition — cited in the Eurazeo deal commentary —
              implies a Rule of 40 score near 40-45% (combining ~30% growth + ~10-15% EBITDA), a strong but not
              exceptional position for enterprise SaaS at this stage.

              Gross margin is the most significant undisclosed unit-economics input. For enterprise SaaS platforms with
              significant professional services and multi-cloud hosting costs, gross margins typically range from 65% to
              80%. LumApps' architecture (heavy Google Workspace and Microsoft 365 integration, multi-tenant cloud, plus
              customer success and implementation labor) suggests a gross margin in the 68-75% range rather than the
              80%+ of pure-software platforms. However, this is entirely estimated; investor due diligence access or
              audited financials would be required to confirm. The addition of Beekeeper's frontline platform
              (mobile-first, lower ASP, potentially higher infrastructure cost per frontline user) may marginally
              compress blended gross margins post-merger.
