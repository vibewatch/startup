      - number: '2.4'
        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >
              The strongest growth driver for the intranet and employee experience platform market in 2026 is the
              integration of AI into search, content creation, analytics, and workflow automation. The Forrester Q2 2026
              Wave found that all 13 evaluated vendors had embedded AI capabilities, yet only about half of reference
              customers were using them meaningfully—indicating an adoption gap that creates both risk (overpromised
              value) and opportunity (future upsell as AI matures in production). McKinsey's 2025 survey found 88% of
              organizations reporting regular AI use in at least one business function, up sharply year over year, which
              sustains executive pressure to ensure the employee intranet is AI-ready. The World Economic Forum projects
              that approximately 75% of companies will have adopted AI by 2027, adding further demand pressure.

              The normalization of hybrid work is a structural tailwind. A major randomized trial at Trip.com found a
              two-day remote hybrid policy cut quits by one-third without denting performance. Gallup's 2025 global data
              shows engagement at 21% in 2024 (down from 23% the year before) and manager engagement at 27% (down from
              30%). These declining engagement metrics create executive-level urgency for investment in the
              communications and culture infrastructure that intranet platforms provide. IBM research quantifies the ROI
              frame directly: organizations that deliver top-tier employee experiences post 31% higher revenue growth
              than peers. The frontline opportunity is the fastest-growing demand pocket, driven by retailers,
              healthcare systems, and manufacturers seeking to extend the digital workplace to the 80% of the global
              workforce that does not sit at a desk. Mordor Intelligence puts this market at a 15% CAGR through 2031.

              On the constraint side, Microsoft's bundled SharePoint and Viva offering remains the most significant
              structural headwind. SharePoint is included in most Microsoft 365 licenses at near-zero incremental cost;
              enterprises justify adding a specialist intranet only when they can document SharePoint's adoption
              failures. Implementation costs of $100,000–$400,000 in year one for a properly customized SharePoint
              intranet create pressure to justify third-party spend. Regulatory evolution adds complexity: the EU AI Act
              entered into force in 2024 with broad high-risk HR system obligations active in 2026, and the EU Pay
              Transparency Directive required national-law implementation by June 7, 2026. Both create compliance
              investment pressure that can delay buying cycles but also reward vendors with strong governance
              credentials. Longer buying cycles driven by expanded procurement involvement and trial requirements
              further constrain short-term revenue predictability.

              Declining engagement data (Gallup) and change-fatigue signals (Gartner: 73% of HR leaders say employees
              are fatigued by change, 74% say managers are not equipped to lead it) create a two-sided dynamic: they
              reinforce the case for a better employee experience platform but also make it harder to secure executive
              sponsorship and user adoption during a deployment.
