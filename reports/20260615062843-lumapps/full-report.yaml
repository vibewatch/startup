      - number: '4.2'
        title: Revenue Trajectory and ARR Growth
        blocks:
          - type: paragraph
            body: >
              LumApps' revenue growth trajectory spans from early-stage losses to a combined unicorn. Official French
              company filings (reported through Craft.co) show €12.0M revenue in FY2019 and €19.1M in FY2020, with
              operating losses of -€3.2M and -€3.7M respectively — an EBIT margin of -27% and -19% in those early growth
              years. By the time of the January 2020 Series C announcement, CEO Sébastien Ricard cited "more than 100%
              year-over-year revenue growth," suggesting a doubling of the base in FY2019. LumApps then reported six
              consecutive years of record-setting revenue growth through FY2021. Industry data service GetLatka places
              LumApps standalone ARR at approximately $63M in FY2024, a 75% cumulative increase from the $36M ARR figure
              reported for 2020.

              Bridgepoint's own commentary on the deal described LumApps' growth rate as "double that of the market" —
              implying approximately 30% annual ARR growth against a 15% market CAGR for the intranet sector. If
              accurate, this maps to a compound annual growth rate roughly consistent with the $36M-to-$63M trajectory
              over four years (approximately 15% CAGR realized, though some slowing may have occurred after the
              high-growth 2019-2021 period). The discrepancy between the "double market growth" narrative and the
              four-year CAGR evident in reported data warrants clarification. The Bridgepoint acquisition at $650M
              standalone implies a revenue multiple of approximately 10× trailing ARR — elevated but plausible for a
              SaaS leader in a 15%-growth market with claimed profitability.

              The combined LumApps+Beekeeper entity at the July 2025 merger announcement disclosed approximately $150M
              in total recurring revenue, with a stated ambition to double to $300M by 2030. At the 2025 base, the
              compounded annual growth required to reach $300M by 2030 is approximately 15% per year — below the claimed
              "double the market" rate and suggesting management is projecting a moderation relative to prior growth
              periods, partly reflecting the scale-up challenge and integration complexity from the Beekeeper
              combination.
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI010
              - CI012
              - CI013
              - CI016
              - CI017
              - CI037
