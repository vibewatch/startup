  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Surface and Module Architecture
        blocks:
          - type: paragraph
            body: >-
              LumApps delivers an enterprise employee hub across three primary worker surfaces: desk-based employees who
              access a branded, Google- or Microsoft-integrated web portal; frontline and deskless workers who receive a
              mobile-first experience inherited from the 2025 Beekeeper acquisition; and all employees who interact with
              embedded Micro-Apps that surface third-party system actions—leave requests, IT tickets, schedule
              views—inside the hub without leaving the platform. The module map includes six production-ready
              components: the Employee Hub (intranet communications and knowledge), the Frontline App, Micro-Apps,
              Enterprise AI Search, Learning, and the new Agent Hub AI orchestration layer, plus the Comeen workplace
              management suite entering integration from April 2026. Micro-Apps reached a one-year milestone with
              confirmed adoption at 30 major enterprises across retail, hospitality, manufacturing, and technology; the
              no-code builder enables IT teams to deploy integrations with ServiceNow, Workday, SAP SuccessFactors, and
              ADP up to 10× faster than traditional custom development. The platform supports over 30 languages and runs
              on web, iOS, and Android. User-count disclosures varied from 6 million to over 10 million across 2024–2026
              announcement vintages, with the Agent Hub press release settling on 10 million; this range likely reflects
              post-Beekeeper combined counting rather than organic growth. Third-party review scores are consistently
              positive: G2 at 4.4/5 from 164 reviews, Capterra at 4.1/5 from 39 reviews, and SoftwareReviews composite
              score of 8.7/10 with 97% renewal intent.
