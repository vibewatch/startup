      - number: '7.3'
        title: Regulatory, Privacy, and Security Risks
        blocks:
          - type: paragraph
            body: >-
              LumApps processes employee personal data for more than seven million daily connected users across global
              enterprises spanning multiple regulatory jurisdictions. The company holds ISO 27001:2022 certification,
              completed a 2024 full-year SOC 2 Type II audit without exceptions, and is listed in the CSA STAR Registry.
              No GDPR enforcement actions appear in the GDPR Enforcement Tracker against LumApps as of June 2026, and no
              public security breaches or data incidents have been disclosed. The forward risk is materially higher: the
              EU AI Act's high-risk AI provisions become binding from August 2026, requiring expanded technical
              documentation, conformity declarations, and Fundamental Rights Impact Assessments for any AI system
              processing employee personal data — a category that includes LumApps' AI Hub workflows. AI Act violations
              carry potential fines up to €35M or 7% of global annual turnover, exceeding GDPR's 4% ceiling. The
              European Commission's 2025 Digital Omnibus reform proposals add further regulatory uncertainty for
              AI-enabled SaaS vendors. Cross-border data transfers from EU to US remain subject to Standard Contractual
              Clauses and adequacy decisions, which can be disrupted by legal or political changes. Taylor Wessing notes
              that organisations must distinguish between GDPR post-processing obligations and AI Act human monitoring
              requirements, creating a dual compliance burden. Combined GDPR and AI Act exposure requires external legal
              review of LumApps' AI feature compliance posture before any high-risk-AI deployment boundary is crossed.
            claimRefs:
              - CR025
              - CR026
              - CR027
              - CR028
              - CR029
