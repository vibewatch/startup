  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Pricing Architecture
        blocks:
          - type: paragraph
            body: >
              LumApps generates revenue principally through annual SaaS subscriptions priced on a per-user or
              enterprise-flat-fee basis. The platform is sold exclusively via custom enterprise contracts; no publicly
              posted pricing exists. Third-party comparison platforms cite indicative starting rates near $8 per user
              per month for basic tiers, with large enterprise deployments negotiated individually and estimated to
              range from $50,000 to $500,000+ ACV annually. Pricing is heavily influenced by user count, geographic
              scope, desired integrations (Google Workspace, Microsoft 365, Workday, ServiceNow), and contract duration.
              Multi-year commitments are standard for enterprise customers, which supports high recurring-revenue
              predictability.

              Beyond the core intranet SaaS subscription, LumApps has layered additional revenue streams through product
              acquisitions: the Novastream video layer (2021), the Heyaxel workflows add-on (2022), Vizir chatbot
              capabilities (2022), and Teach On Mars mobile learning (2023) each contribute incremental license revenue.
              The Beekeeper frontline platform (acquired July 2025) adds a second major SaaS stream targeting deskless
              workers at different price points from the core desk-based intranet. Professional services
              (implementation, migration, and custom integrations) represent a meaningful supplementary revenue line,
              though LumApps does not disclose the proportion relative to software.

              The revenue model is structurally recurring and subscription-based, which provides favorable
              unit-economics characteristics (high gross margin potential, multi-year lock-in, and expansion
              opportunities through add-on modules and seat growth). The principal diligence gap is the absence of any
              public data on realized versus list pricing, average discount rates, and professional services as a share
              of total revenue. Clarity on the mix matters because professional services revenue is typically
              lower-margin and non-recurring.
            claimRefs:
              - CI022
              - CI023
              - CI024
              - CI032
              - CI033
