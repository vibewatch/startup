      - number: '2.3'
        title: Buyer and segment landscape
        blocks:
          - type: paragraph
            body: >
              Enterprise intranet procurement is a multi-stakeholder process. Forrester's 2026 State of Business Buying
              survey of nearly 18,000 global buyers found that the typical enterprise software decision involves 13
              internal stakeholders and 9 external influencers, with buying group size doubling when the purchase
              includes generative-AI features (14 members vs. 7). Procurement professionals are now decision-makers in
              53% of buying cycles, engaging from the outset on features, performance specifications, and price—not just
              contract terms. More than 60% of buyers report using a trial or pilot before committing; for purchases
              above $10 M, 78% require a trial first. This dynamic favors vendors like LumApps that offer structured
              proof-of-concept programs, and it lengthens sales cycles considerably.

              Budget ownership for intranet and employee experience platforms is split across three functions: IT
              (infrastructure, security, integration), HR (engagement, onboarding, people analytics), and Internal
              Communications (editorial, campaign, governance). Large enterprises typically require a cross-functional
              steering model; mid-market deals are often led by the IT director alone. The budget owner varies by
              use-case trigger: when the driver is tool consolidation or Microsoft migration, IT leads; when it is
              engagement or culture, HR or Comms leads. LumApps' positioning as both a Google Workspace integration
              partner and an enterprise HR technology means it must navigate both buyer archetypes in the same sales
              cycle.

              Segment coverage spans five distinct profiles. Global enterprises with 5,000+ employees represent the
              highest-value accounts and require multilingual support, multi-site governance, and compliance with EU
              data-residency rules—all areas where LumApps has documented capabilities. Mid-market firms (1,000–5,000
              employees) are the highest-volume segment and are more price-sensitive. Frontline and deskless
              organizations—retailers, manufacturers, healthcare systems—became directly addressable via the Beekeeper
              acquisition and are the fastest-growing sub-segment given the HCM deskless market's 15% CAGR. Google
              Workspace and Microsoft 365 users represent distinct buying profiles: the former are often smaller
              organizations without a strong intranet tradition (creating a greenfield opportunity), while the latter
              are defending incumbents that require a compelling case to add a third-party layer alongside SharePoint.
              Regulated industries (financial services, healthcare, pharma) represent a premium-priced segment with
              longer compliance validation cycles and a preference for vendors with SOC 2, ISO 27001, and GDPR
              certifications.

              The critical adverse signal in this landscape is adoption: across the market, 91% of organizations run an
              intranet, yet only 13% of employees use it daily and nearly a third never log in at all. IDC reports
              employees spend 2.5 hours per day searching for information despite intranets being designed to prevent
              exactly that. SWOOP Analytics puts average daily active use at just six minutes. These figures are
              industry-wide—they do not single out LumApps—but they indicate that the sales challenge is not only
              acquiring new customers but converting licensed seats into genuinely active users, a metric that directly
              affects renewal and expansion economics.
