            title: Critical bundling threat from Microsoft Viva nine-module suite
            body: >-
              Microsoft's 2026 consolidation of Viva Connections as the native SharePoint app in Teams, combined with
              nine overlapping Viva modules bundled into M365, makes it progressively harder for LumApps to justify
              premium per-user fees at renewal for enterprises already standardised on Microsoft. This is LumApps'
