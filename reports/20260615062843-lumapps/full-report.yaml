      - number: '7.4'
        title: Operational, AI Dependency, and Macro/Budget Risks
        blocks:
          - type: paragraph
            body: >-
              LumApps' AI Hub strategy creates structural dependency on third-party LLM providers including Google
              Gemini, Microsoft Copilot, and OpenAI APIs. Pricing changes, capability shifts, model deprecations, or
              exclusivity arrangements from any of these providers could disrupt AI feature functionality and force
              costly re-integration across the entire platform. This dependency is especially acute given that
              Microsoft's native Copilot integration with M365 provides a competing AI layer at no incremental cost to
              M365 subscribers. On the demand side, Beekeeper's March 2025 frontline study found 36% of frontline
              employees distrust AI tools and only 17% believe AI could improve their day-to-day work — a direct
              headwind to the combined entity's AI adoption thesis among the Beekeeper customer base. ETR's April 2025
              macro survey found organisations becoming more selective, cost-conscious, and risk-aware in IT spending
              amid geopolitical and economic uncertainty, with approximately 22% of enterprises planning IT budget
              reductions. HR tech showed relative resilience — approximately 49% of HR leaders expected budget increases
              for 2026 — but LumApps' premium pricing and long enterprise sales cycles heighten vulnerability during
              budget freeze cycles. SP Global estimates the global HR technology market at $42.5B for 2025–2026 with
              ~12% CAGR, providing a supportive long-run backdrop, though competitive intensity in employee experience
              and people analytics is described as escalating with both incumbents and agile startups racing to deliver
              AI-personalised features. Founder-CEO Sébastien Ricard remains central to sponsor, partner, and customer
              relationships; post-merger September 2025 leadership hires have limited track records in the combined
              entity.
