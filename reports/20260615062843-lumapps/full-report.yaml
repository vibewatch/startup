  productSummary: >-
    LumApps sells an AI employee hub — a governed, cloud-native SaaS platform that unifies internal communications,
    knowledge, productivity integrations (Google Workspace and Microsoft 365), workflow automation, learning (through
    its Teach on Mars acquisition), conversational AI, and enterprise search in a single branded employee experience.
    Post-Beekeeper, the platform also covers frontline and deskless workers through a mobile-first channel. The product
    is delivered as an annual enterprise SaaS subscription priced per user, with integrations available via 50+ no-code
    connectors and the Google Cloud Marketplace.
  customerFocus: >-
    Global enterprise customers (typically 5,000–500,000+ employees), primarily multinational corporations in financial
    services, aviation, retail, technology, and public sector; post-Beekeeper, coverage extends to frontline and
    deskless worker segments.
  businessModel: >-
    Annual SaaS subscription priced per user per month (indicative starting rate ~$8/user/month for basic tiers; actual
    enterprise contracts are negotiated and typically range $50K–$500K+ per year). Additional revenue lines include
    professional services, partner integrations, and the Teach on Mars learning platform.
