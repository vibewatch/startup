companyProfile:
  summary: >-
    LumApps is a private French enterprise software company founded in Lyon in 2012 by Sébastien Ricard and Élie Mélois.
    It markets an AI employee hub that combines intranet communications, knowledge management, productivity
    integrations, workflows, learning, and enterprise search into a single governed experience for desk-based and
    frontline workers. Bridgepoint acquired a majority stake in July 2024 in a $650M deal, then backed the combination
    with Swiss frontline platform Beekeeper in July 2025, creating a combined entity valued at more than $1 billion with
    approximately $150M in combined recurring revenue. The post-merger group serves 7M+ daily employees across 2,200+
    enterprise customers and employs roughly 750 people globally. Core diligence limitations are private-company opacity
    (no audited group financials, NRR, or gross margin disclosed), integration execution risk from combining two
    PE-backed SaaS platforms, and a stretched entry multiple in a market where Microsoft Viva competes as a bundle.
  foundedDate: '2012-10-01'
