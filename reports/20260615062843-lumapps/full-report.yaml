      - number: '5.2'
        title: Architecture and Integration Ecosystem
        blocks:
          - type: paragraph
            body: >-
              LumApps operates on a dual-cloud infrastructure hosted across Google Cloud and Microsoft Azure with
              SLA-backed 99.97% uptime, automated backups, and multi-data-center replication that eliminates any single
              point of failure. The integration layer is the commercial core: native connectors for Microsoft 365 and
              Google Workspace are the primary go-to-market hooks, but the connector catalog extends to ServiceNow,
              Workday, SAP SuccessFactors, Slack, ADP, and UKG via REST and GraphQL APIs. Developers access the platform
              through the official portal at developer.lumapps.com, which documents OAuth2 authentication, webhooks, a
              Python SDK, and a Data Lake connector for custom analytics dashboards. The public GitHub organization
              hosts the LumX design system (TypeScript, 25 stars on the current repo), extension templates, and the
              original AngularJS LumX framework at 1.9k historical stars, providing evidence of genuine developer
              community engagement even though core platform code remains proprietary. Enterprise authentication is
              managed through SSO with Microsoft, Google, SAML V2.0, and OpenID; admins configure granular access by
              role, location, and department without engineering involvement. Micro-Apps are reusable across LumApps
              homepages, dashboards, AI search, internal emails, and collaboration platforms including Microsoft Teams,
              Slack, and Google Chat. The six-week update cadence is independently confirmed by a Google Cloud case
              study that spans six years of production deployment and also records 99.97% uptime over that entire
              period.
