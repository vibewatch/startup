            body: >-
              Public milestone evidence shows LumApps building scale through a mixture of partner leverage, customer
              wins, and selective acquisitions. The historical record on the company page captures the core arc: launch
              in Lyon, early Google recommendation, international offices by 2017, Microsoft partnership by 2019, then
              product broadening through Vizir and Teach on Mars before the 2024-2025 capital events. Independent proof
