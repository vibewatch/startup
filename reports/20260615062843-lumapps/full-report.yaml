            title: French Entity Operating Losses Contradict Simple Profitability Narrative
            body: >
              LumApps' official French company filings (via Craft.co, reflecting Registre du Commerce et des Sociétés
              data) show operating losses of -€3.2M (-27% EBIT margin) in FY2019 and -€3.7M (-19% EBIT margin) in FY2020
              — years when management was reporting strong growth. While LumApps became profitable at a group level by
