  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape — Direct Peers, Incumbents, and Substitutes
        blocks:
          - type: paragraph
            body: >
              LumApps operates in a multi-tier competitive field spanning direct intranet packaged solution (IPS) peers,
              suite incumbents, adjacent engagement platforms, and status-quo alternatives. The most consequential
              direct peers are Staffbase, Simpplr, Firstup, Unily, and Workvivo—each claiming enterprise-grade intranet
              or employee-experience capabilities but with distinct positioning and funding bases.


              Staffbase is the largest pure-play competitor by revenue, having crossed $193 million ARR by December 2024
              with a $1.1 billion valuation set in its 2022 Series E. The company targets enterprise multichannel
              communication with a Microsoft-first integration story and 2,500+ customers, and it announced Employee
              AI—its agentic AI platform—in September 2025. Simpplr, backed by Norwest Venture Partners and Salesforce
              Ventures, reached $51.6 million ARR by September 2025 with 1,000+ customers and earns the highest
              Forrester Ability to Execute score among IPS peers. Unily (CVC Capital Partners), Firstup, and Workvivo
              (Zoom-acquired) round out the direct peer set.


              Microsoft Viva and SharePoint represent the suite incumbent threat. SharePoint is bundled with Microsoft
              365 from $6 per user per month, creating a zero-incremental-cost alternative for the majority of
              enterprise IT environments. Viva Connections, Viva Engage, and Copilot integration extend the
              employee-experience layer within the Microsoft ecosystem. For organizations fully standardized on M365,
              the cost of staying with SharePoint/Viva is essentially zero, making this the dominant status-quo
              competitor rather than a standalone purchase decision.


              Two structural events materially shift the competitive landscape in 2025–2026. First, Meta shut down
              Workplace from Meta on June 1, 2026, forcing approximately 7 million users to migrate. Meta selected
              Workvivo as its only preferred migration partner in May 2024, directing a large cohort of enterprise
              buyers toward the Zoom ecosystem rather than LumApps or Staffbase. Second, both Staffbase and Unily each
              announced AI-native platform redesigns in late 2025—Staffbase with Employee AI (September 2025) and Unily
              with the Unily Futures platform (Indy AI agent for site generation and Glass conversational interface,
              October 2025)—compressing LumApps' window of AI differentiation.


              Status-quo substitutes include legacy SharePoint intranets managed by IT, enterprise email plus Teams for
              communication, and the DIY internal build option—all of which represent the most common reason enterprise
              deals stall rather than go to a competitor.
