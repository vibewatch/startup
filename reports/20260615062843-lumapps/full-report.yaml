              LumApps' AI Hub products process employee personal data for millions of users, triggering both GDPR and
              the forthcoming EU AI Act compliance obligations. August 2026 marks the binding date for high-risk AI
              provisions. The combined fine ceiling reaches 7% of global annual turnover under the AI Act, materially
