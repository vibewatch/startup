      - number: '2.5'
        title: Sizing diligence gaps and contradictory estimates
        blocks:
          - type: paragraph
            body: >
              The most material gap in available market evidence is the absence of an analyst-published sizing that
              matches LumApps' actual product boundary. The digital workplace figure ($73.4 B) is too broad; the
              intranet software figure ($4.8 B) excludes the managed-service and frontline-app revenue that Beekeeper
              adds; the HCM deskless figure ($13.5 B) is predominantly HR workflow rather than employee communications.
              LumApps likely competes for a serviceable market that aggregates pieces of all three, but no published
              estimate covers that exact combination.

              A second structural gap is the order-of-magnitude spread between the IaaS estimate ($23.7 B) and the
              intranet software estimate ($4.8 B). The difference reflects boundary methodology (IaaS includes platform
              services, hosting, and migration; software does not), but neither publisher discloses sufficiently
              detailed methodology to allow an investor to reconstruct the basis. LumApps represents a
              software-plus-services model (SaaS platform with implementation and customer success), and its recurring
              revenue of approximately $150 M post- Beekeeper implies it holds a fraction of a percent of even the
              narrower software estimate—creating significant growth headroom but also implying that market share gains
              must be won against a large number of competitors across multiple geographies.

              A third gap is competitive share data. Forrester's Wave evaluates 13 vendors on capability and strategy
              dimensions but does not publish revenue share or customer count by vendor. Gartner's digital employee
              experience management category page was inaccessible during research (JavaScript-only rendering). As a
              result, LumApps' revenue rank among intranet platform vendors cannot be independently confirmed from
              available public sources.
            claimRefs:
              - CM046
              - CM047
              - CM050
      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Market boundary choice drives an order-of-magnitude difference in TAM
            body: >
              LumApps-relevant market sizing ranges from $4.8 B (narrow intranet software) to $73.4 B (full digital
              workplace), a 15× spread. Investors and management should anchor on the $15–25 B intranet-as-a-service
              range as the primary SAM because it best matches LumApps' current product boundary. Using the digital
              workplace TAM in investor materials overstates the addressable opportunity by roughly 3–5×.
            calloutType: insight
            claimRefs:
              - CM001
              - CM003
              - CM006
              - CM047
          - type: callout
            title: Microsoft's bundled SharePoint and low industry adoption rates are persistent headwinds
            body: >
              Microsoft's near-zero incremental cost for SharePoint within Microsoft 365 licensing forces LumApps to
              justify incremental spend against a "free" baseline. The industry's structural adoption problem (13% daily
              active users, 6 minutes average daily use) means customers are buying a product category with documented
              value-realization risk. LumApps must differentiate on AI-driven adoption improvements, governance, and
              frontline capabilities to overcome both barriers.
            calloutType: risk
            claimRefs:
              - CM024
              - CM026
              - CM042
          - type: callout
            title: Post-Beekeeper revenue anchor ($150 M) implies sub-1% SAM penetration
            body: >
              LumApps' disclosed combined recurring revenue of approximately $150 M against even the narrow $4.8 B
              intranet software TAM implies roughly 3% market share. Against the more appropriate $23.7 B IaaS SAM,
              penetration is under 1%. This suggests very significant growth runway, but it also reflects the reality
              that the intranet market remains highly fragmented across dozens of specialist vendors, Google and
              Microsoft incumbent positions, and open-source alternatives.
            calloutType: assumption
            claimRefs:
