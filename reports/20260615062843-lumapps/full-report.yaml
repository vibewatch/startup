      - number: '8.3'
        title: Comparable Company and Transaction Benchmarks
        blocks:
          - type: paragraph
            body: >
              The nearest direct comparable is Staffbase, the Chemnitz-based employee communications platform that
              reached a $1.1B valuation in March 2022 ($115M Series E led by General Atlantic) with $193M ARR in
              2024—implying a current implied multiple of ~5.7x. Staffbase and LumApps have overlapping functionality,
              though Staffbase has historically been stronger in Microsoft 365 integrations and enterprise
              communications while LumApps leads on Google Workspace and intranet depth. Simpplr, at ~$155M valuation
              and $51.6M ARR in 2025, trades at approximately 3x— a significantly lower multiple reflecting its VC-stage
              status and smaller scale.

              The Workvivo transaction provides a strategic M&A datapoint: Zoom acquired the employee experience
              platform for approximately $220M in April 2023, which—given Workvivo's estimated pre-acquisition ARR in
              the $20–30M range—implies a 7–11x strategic multiple. That premium reflects a buyer's willingness to pay
              for platform adjacency and a captive user base, a dynamic that could benefit LumApps in a trade sale
              scenario.

              Broad market context from PitchBook's Q4 2025 enterprise SaaS public comp sheet shows median enterprise
              SaaS EV/TTM revenue at 5x in Q4 2025 with 76 of 102 tracked companies seeing YoY multiple decreases.
              Multiples.vc June 2026 data segments horizontal SaaS (content management and collaboration) at roughly
              1.9–2.9x EV/revenue, well below LumApps' implied multiple— suggesting the current valuation prices in
              either M&A premium or superior growth persistence. The employee experience platform market size of $3.42B
              in 2025 growing at 9.35% CAGR through 2031 per Mordor Intelligence provides the addressable-market
              foundation for any comparable analysis but does not, by itself, justify a premium multiple absent
              disclosed unit economics.
            claimRefs:
              - CV019
              - CV020
