      - number: '1.2'
        title: Leadership bench, governance, and partner alignment
        blocks:
          - type: paragraph
            body: >-
              Leadership continuity is one of the cleaner parts of the LumApps story. The company page still identifies
              Sébastien Ricard as chairman and CEO, with co-founder Élie Mélois in the senior technology role and
              Vincent Ortiou as CFO. That is important because the company’s recent ownership changes were not
              accompanied by a founder exit. Bridgepoint explicitly said founders and senior management would remain
              invested when it bought control, and the later Beekeeper integration press cycle continued to feature
              Ricard and Mélois as central operators. The public leadership bench broadened after the Beekeeper
              combination, with September 2025 appointments across product, marketing, people, and
              strategy/transformation intended to align the combined organization. At the same time, LumApps’ commercial
              identity remains deeply linked to large platform partners. Its Google Workspace page positions the company
              as a preferred integration option and marketplace-purchasable product, while the Microsoft 365 page
              explicitly frames LumApps as a better employee hub than a document-centric SharePoint deployment. This
              leadership and partner structure suggests a company that is founder-led in product direction, financially
              supervised for scale, and commercially dependent on staying close to the two dominant productivity-suite
              ecosystems.
