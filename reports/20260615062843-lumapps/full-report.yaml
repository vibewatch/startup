      - number: '7.2'
        title: M&A Integration, Sponsor, and Financial Model Risks
        blocks:
          - type: paragraph
            body: >-
              The July 2025 Beekeeper merger created Lynx TopCo SAS as the new holding entity, combining LumApps'
              desk-based intranet with Beekeeper's mobile-first frontline platform. Integrating two architecturally
              distinct products — one optimised for browser-and-app corporate workers, the other for shift-work and
              mobile-only frontline employees — requires harmonising separate data models, permission frameworks, and AI
              feature sets. Beekeeper had not yet reached profitability at the time of the deal, aiming to break even in
              2025; the combined entity's day-one profitability claim rests on LumApps' existing EBITDA position
              absorbing the drag. LumApps' $300M revenue target by 2030 requires roughly doubling the combined $150M
              recurring revenue base in five years. Bridgepoint's leveraged buyout structure introduces debt service
              obligations that reduce strategic flexibility if growth lags; European software LBOs typically carry 4–7×
              EBITDA leverage, and LumApps' exact leverage ratio is undisclosed. Bridgepoint's standard investment
              horizon implies a 2028–2031 exit window, creating time pressure. Compounding integration risk, LumApps
              acquired Comeen in 2026 while still integrating Beekeeper, requiring management to navigate two
              simultaneous platform mergers. Beekeeper's own March 2025 frontline research found persistent retention
              crises in frontline industries driven by low pay, poor digital tools, and high turnover rates — the very
              problem the combined platform must solve at scale to justify the merger thesis.
