      - number: '5.5'
        title: Roadmap, Implementation, and Technical Risks
        blocks:
          - type: paragraph
            body: >-
              LumApps presents a layered technical risk profile driven primarily by its two recent acquisitions. The
              Beekeeper integration spans a 12-to-24-month roadmap with no immediate sunset plans for either platform;
              however, the module roadmap, pricing tier changes, and migration paths for Beekeeper functionality remain
              undisclosed. Buyers who sign multi-year Beekeeper contracts spanning the integration window face genuine
              uncertainty about whether current functionality will move to a different SKU or pricing tier. The Comeen
              acquisition (April 2026, expected close May 2026) adds a second integration project, though Comeen was
              already part of the LumApps Marketplace, reducing the cold-start risk. Agent Studio's General Availability
              was planned for June 2026 following a December 2025 early-access launch; any delay would push
              enterprise-grade AI orchestration into H2 2026. Implementation complexity is a validated signal from
              multiple third-party review platforms: reviewers on TrustRadius and Capterra consistently flag that
              advanced admin configuration requires HTML/CSS skills and that backend setup can stretch for several
              months at large enterprise scale. The core Employee Hub is well-reviewed for end-user experience, but the
              admin UX complexity is a real adoption risk for organizations without a dedicated internal communications
              team. Differentiation from SharePoint, Staffbase, and Simpplr rests on the platform's AI orchestration
              ambition, dual-cloud reliability, Google and Microsoft neutrality, and frontline reach—advantages that
              will crystallize or erode depending on Beekeeper integration execution through 2026-2027.
            claimRefs:
              - CE036
              - CE037
              - CE038
              - CE040
