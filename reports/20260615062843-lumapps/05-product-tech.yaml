  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: integration-risk
      missingEvidence: >-
        Detailed Beekeeper-LumApps technical integration architecture, including which
        infrastructure components will be unified, user-provisioning approach, and whether
        Beekeeper functionality will be rebuilt on LumApps' codebase or maintained separately.
      whyItMatters: >-
        Without the technical integration plan, enterprise buyers cannot assess the risk that
        current Beekeeper functionality will be deprecated or repriced during the 12–24 month
        window, which directly affects multi-year contract decisions.
      diligencePath: >-
        Request a technical integration roadmap document and written contractual commitment on
        feature parity and pricing protection from the LumApps sales team during procurement.
      relatedQuestionRefs:
        - QE020

    - type: private-evidence-only
      severity: material
      topic: security
      missingEvidence: >-
        SOC 2 Type II audit report and detailed encryption key management architecture (whether
        customer-managed or platform-managed keys are supported).
      whyItMatters: >-
        For banking, healthcare, and defense customers, the audit report body and key management
        model determine whether LumApps meets internal security policy requirements for data
        sovereignty and breach notification.
      diligencePath: >-
        Request the full SOC 2 report under NDA and ask specifically about customer-managed
        encryption key options and sub-processor list.
      relatedQuestionRefs: []

    - type: missing-source
      severity: minor
      topic: developer-signal
      missingEvidence: >-
        Independent developer community metrics such as Stack Overflow LumApps tag traffic,
        GitHub contributor count for extension repos, and npm or PyPI SDK download statistics.
      whyItMatters: >-
        The developer platform's commercial viability depends on an active third-party ecosystem;
        the GitHub signal (25 stars on the TypeScript design system) is thin and does not
        confirm whether the extension marketplace is commercially active.
      diligencePath: >-
        Check Stack Overflow for lumapps tag volume; check PyPI download stats for the
        lumapps-sdk package; request extension marketplace usage statistics from LumApps.
      relatedQuestionRefs:
        - QE018

    - type: private-evidence-only
      severity: minor
      topic: "Agent Hub"
      missingEvidence: >-
        Independent third-party benchmarking of Agent Hub AI quality, including agent accuracy,
        latency, hallucination rate, and orchestration reliability across enterprise systems.
      whyItMatters: >-
        Agent Hub is in early access as of end-2025; its performance in production at scale is
        unverified by any independent analyst or customer case study.
      diligencePath: >-
        Request reference customers who have piloted Agent Studio in production; seek independent
        analyst briefing notes or early access program reports from Forrester or Gartner.
      relatedQuestionRefs:
        - QE002
        - QE014
