  - id: security-governance
    title: "Security, Governance, and Compliance"
    body: >-
      LumApps holds ISO 27001 certification for information security management since 2019 and
      completed its SOC 2 Type II audit in May 2026 with no noted exceptions, covering security,
      availability, processing integrity, confidentiality, and privacy across its customer data
      estate. All data is encrypted at rest using AES-256 and in transit. The platform is hosted
      across Google Cloud and Microsoft Azure with multi-data-center replication, achieving
      SLA-backed 99.97% uptime. Enterprise authentication is centralized through SSO with Microsoft,
      Google, SAML V2.0, and OpenID; admins configure granular role-based access controls at the
      role, location, and department level without engineering involvement. AI agents and Micro-Apps
      operate within defined governance boundaries, ensuring that employee self-service actions remain
      inside IT-approved limits. LumApps undergoes regular penetration testing and maintains detailed
      security policies across information security, incident management, data classification, and
      business continuity. Elie Mélois, CTO and co-founder, cited the platform's banking, healthcare,
      and defense customer base as the driver for its security investment posture; the SOC 2
      announcement referenced coverage of more than four million users at the time. GDPR compliance
      is asserted. Key disclosure gaps include the encryption key management architecture, exact
      penetration-testing cadence and scope, and the specific SLA penalty terms—none of which are
      publicly disclosed.
    claimRefs:
      - CE023
      - CE024
      - CE025
      - CE026
      - CE027
