  - id: ai-capabilities
    title: "AI Capabilities and Agent Hub"
    body: >-
      The November 2025 Agent Hub launch is LumApps' most consequential product announcement since
      the Beekeeper merger. It addresses a structural problem in enterprise AI adoption: employees
      do not know where work starts when AI copilots are fragmented across dozens of applications
      and single-suite assistants. Agent Hub resolves this by positioning LumApps as the single
      governed workspace where employees discover and invoke AI agents regardless of which underlying
      system the agent calls. The architecture has three components. Agent Studio is a no-code
      environment for IT and developers to build, manage, and chain agent-to-agent (A2A) workflows
      while connecting external tools and designing custom prompts. Agent Library provides a
      repository of prebuilt, custom, and third-party agents including the inaugural Learning Agent
      for automated training course creation. The Smart Orchestrator sits at the routing layer,
      analyzing each request and directing it to the most context-appropriate agent or enterprise
      system. LumApps' strategic advantage is its deployment base: the platform is already the
      daily starting point for over 10 million employees across hospitality, manufacturing,
      healthcare, and retail, giving governed AI agents immediate reach. Named reference customers
      in the Agent Hub press release include Ascension Health, Zapier, and Genuine Parts Company.
      The Comeen acquisition (April 2026) extends Agent Hub into the physical workplace, adding AI
      desk booking, digital signage, and visitor management. The roadmap through 2026 targets 25+
      out-of-the-box agents and deeper orchestration across enterprise copilots, with Agent Studio
      General Availability planned for June 2026.
    claimRefs:
