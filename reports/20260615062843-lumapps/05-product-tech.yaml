callouts:
  - calloutType: strength
    title: "Dual-Cloud Reliability and Certified Security"
    body: >-
      LumApps' deployment on both Google Cloud and Microsoft Azure, combined with ISO 27001
      certification since 2019 and SOC 2 Type II completion in May 2026 with no exceptions, gives
      it a credible security posture for regulated industries. The independently confirmed 99.97%
      uptime over six years is above the typical SaaS benchmark and reduces the reliability risk
      argument for enterprise procurement.
    claimRefs:
      - CE023
      - CE024
      - CE026
      - CE031

  - calloutType: risk
    title: "Beekeeper Integration Uncertainty Is a Material Buyer Risk"
    body: >-
      The 12-to-24-month Beekeeper integration roadmap creates genuine uncertainty for new buyers:
      module roadmaps, pricing tier changes, and migration paths are not disclosed. Any enterprise
      signing a multi-year Beekeeper contract today is implicitly betting that current functionality
      will remain available at current pricing through the integration window. Combined with the
      Comeen acquisition layered on top, LumApps is managing two simultaneous integration projects
      that compete for engineering and product bandwidth.
    claimRefs:
      - CE036
      - CE037

  - calloutType: recommendation
    title: "Verify Agent Hub and Beekeeper Roadmap Before Signing"
    body: >-
      Prospects evaluating LumApps in 2026 should request specific contractual commitments on
      Agent Studio GA timing, Beekeeper module roadmap, and post-integration pricing before
      signing multi-year deals. The platform's underlying architecture and certifications are
      enterprise-grade, but the simultaneous integration of two acquisitions introduces execution
      risk that should be priced into any commercial negotiation.
    claimRefs:
      - CE015
      - CE036
      - CE037
      - CE040

