  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: technical proof
    missingEvidence: Reproducible benchmark pack, demo logs, baseline comparisons, and failure analysis for Mirendil’s autonomous AI-R&D loop.
    whyItMatters: The $1B valuation can be justified only if Mirendil has a real technical discontinuity rather than a pedigree narrative.
    diligencePath: Run CTO-led technical diligence with external AI-for-science reviewers and require reproducible eval artifacts.
    relatedQuestionRefs:
    - QV009
    - QV030
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: customer proof
    missingEvidence: Signed design partners, paid pilots, usage logs, customer references, and conversion milestones.
    whyItMatters: External pull is necessary to prove the lab-platform thesis can become a commercial company.
    diligencePath: Request partner pipeline, contracts or LOIs, reference calls, and customer success metrics under NDA.
    relatedQuestionRefs:
    - QV010
    - QV028
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: cap table and governance
    missingEvidence: Cap table, liquidation preferences, option pool, side letters, board rights, voting control, and founder vesting.
    whyItMatters: Headline valuation is not enough to judge economic outcome or downside risk after a very large seed round.
    diligencePath: Company counsel and investor counsel should review financing documents before IC approval.
    relatedQuestionRefs:
    - QV031
    relatedTableRefs:
    - TV006
  - type: missing-source
    severity: material
    topic: exit readiness
    missingEvidence: No public evidence of exit process, strategic buyer interest, public-company controls, or mature commercialization milestones.
    whyItMatters: Entry return depends on a later premium financing or strategic path that is not visible publicly.
    diligencePath: Ask management and insiders for next-round milestones, strategic partner map, and follow-on reserve commitments.
    relatedQuestionRefs:
    - QV029
    relatedTableRefs:
    - TV003
  - type: enumeration-incomplete
    severity: minor
    topic: TV004 comparable set
    missingEvidence: Private cap tables, exact valuations, and current secondary marks for several frontier AI labs remain unavailable publicly.
    whyItMatters: The comp table is representative rather than exhaustive, so it should anchor discipline rather than produce a precise valuation multiple.
    diligencePath: Refresh private-market datasets and investor marks during formal diligence.
    relatedQuestionRefs:
    - QV015
