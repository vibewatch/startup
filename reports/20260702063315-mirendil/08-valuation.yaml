- id: risk-rating
  title: Risk rating and thesis-break triggers
  body: 'The risk rating is high because the principal underwriting variables are private. Market demand for better scientific R&D is large and credible, but Gartner’s agentic-AI warning, Crunchbase’s risk-bubble framing, CNBC’s valuation-fear coverage, and the World Economic Forum’s bubble-reckoning analysis all argue against treating the current AI capital market as a stable clearing price. Mirendil’s specific risk is amplified by the same factors that make it attractive: scarce talent, expensive compute, long technical loops, and a broad platform ambition. The company can still be extraordinary, but the investment case should break quickly if the private diligence package does not show benchmark superiority, external customer pull, disciplined burn, defensible rights, and a credible path to a next round at materially higher value without excessive preference overhang.'
