- id: final-diligence-asks
  title: Final diligence asks and decision gate
  body: The final diligence gate should be explicit. At the current reported price, an investor should ask for a full technical benchmark pack, customer or design-partner evidence, compute commitments, burn and runway model, cap table, board rights, liquidation preferences, founder vesting, security posture, and milestone plan before approving any allocation. A smaller observation check or insider-only right can be justified by the quality of the team and the asymmetric category upside, but a full-price primary entry requires evidence that Mirendil has already moved from narrative to durable capability. The key change-of-view event would be private evidence that external scientists or AI builders repeatedly use Mirendil’s system to produce valuable research outputs faster than incumbent workflows, with measurable retention and a credible commercial model.
