- id: valuation-context
  title: Valuation context, market support, and entry discipline
  body: 'The market context explains why the round happened, but it does not fully justify paying the price without more proof. Carta and Crunchbase both show that AI has inflated early-stage pricing: Carta reported record seed post-money valuations and normal seed dilution near 19% to 20%, while Crunchbase reported that 2025 seed funding was unusually concentrated in very large AI rounds. TechCrunch likewise described AI seed companies commanding higher valuations, but it also noted that investors increasingly expect real users, revenue, and faster milestones. Mirendil has the pedigree side of that equation, while public evidence lacks the traction side. Compared with public AI-drug-discovery companies, the entry looks aggressive: Recursion and Schrödinger disclosed public-market valuation anchors with revenue, pipelines, and losses, whereas Mirendil is priced on option value before product proof.'
