- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - Technical benchmark pack shows a durable autonomous AI-R&D loop; first AI-builder/science users convert into design partners; insider and strategic investors compete for follow-on.
    - Illustrative mark $3B-$6B before major dilution; 3x-6x headline markup from $1B entry if follow-on is clean.
    - Compute scaling, safety, reproducibility, and retaining scarce researchers.
    - Would require private benchmark wins, signed design partners, and credible next-round demand.
  - - Base
    - Strong research progress and recruiting, but limited commercial evidence and no broad external product before next financing.
    - Illustrative mark $0.8B-$2B; entry has modest upside and could be flat after dilution or preferences.
    - Delayed productization, unclear revenue model, and need for more capital.
    - Most consistent with public evidence available today.
  - - Bear
    - Benchmarks disappoint, external users do not convert, burn rises, or AI private-market pricing corrects.
    - Illustrative mark $0.2B-$0.7B; down-round, structured bridge, or acqui-hire risk dominates.
    - Overcapitalization, preference stack, key-person loss, and market multiple compression.
    - Triggered by weak diligence package or no measurable milestones within 12-18 months.
  notes: Scenario values are illustrative $B ranges based on stage, scarcity comps, and public-market anchors; they are not management guidance.
