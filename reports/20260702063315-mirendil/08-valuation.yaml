  rows:
  - - Mirendil
    - Seed financing
    - ~$200M seed at roughly $1B post-money; simplified new-investor ownership about 20%.
    - Direct entry price and dilution anchor.
    - No public product, revenue, technical benchmark, cap table, or governance detail.
    - Mirendil, SiliconANGLE, Cryptonomist.
  - - Thinking Machines Lab
    - Frontier-AI seed comp
    - $2B seed at $12B valuation; less than a year old and had not revealed what it was working on.
    - Shows current willingness to price elite frontier-AI teams far above ordinary seed levels.
    - General frontier AI rather than scientific R&D; extreme outlier led by ex-OpenAI CTO.
    - TechCrunch, TechFundingNews.
  - - Safe Superintelligence
    - Frontier-AI private comp
    - Reported $2B at $32B valuation; website/product remained sparse.
    - Shows investors can pay very high prices for exceptional AI founder pedigree before product disclosure.
    - Safety/superintelligence mission is not Mirendil’s AI-for-science commercialization path.
    - TechCrunch plus market-summary source.
  - - Periodic Labs
    - AI-for-science / materials comp
    - $300M seed; later discussions around ~$7B valuation and semiconductor customer traction reported.
    - Closest private AI-science scarcity comp for autonomous labs and materials discovery.
    - Physical-lab model and customer traction may be more concrete than Mirendil public evidence.
    - TechCrunch, TechFundingNews.
  - - Lila Sciences
    - Autonomous science factory comp
    - $350M Series A; $550M total raised; first customer cohort and AI Science Factories described.
    - Shows capital intensity and customer-oriented scientific superintelligence framing.
    - Flagship-originated platform with more public commercialization language than Mirendil.
    - Lila official, Fierce Biotech.
  - - Isomorphic Labs
    - Strategic pharma collaboration
    - $45M upfront and up to $1.7B total value in Lilly collaboration.
    - Milestone economics show one route to monetizing AI-for-science platforms.
    - Alphabet-backed drug discovery differs from Mirendil’s lab-platform breadth.
    - Isomorphic Labs PRNewswire, market-analysis sources.
  - - Recursion Pharmaceuticals
    - Public AI-drug-discovery anchor
    - 2025 public float $2.03B; 2025 revenue $74.7M; R&D $475.3M; net loss $644.8M.
    - Public market sanity check for AI-native discovery with revenue and filings.
    - Public biotech pipeline risk differs from Mirendil’s pre-product platform risk.
    - SEC 10-K, Recursion filing evidence.
  - - Schrödinger
    - Public computational chemistry anchor
    - 2025 public float $1.12B; 2025 revenue $255.9M; R&D $173.1M; net loss $103.3M.
    - Shows that public markets value revenue-bearing computational discovery platforms with discipline.
    - Mature software and drug-discovery mix is not a frontier-AI seed lab.
    - SEC 10-K, Schrödinger filing evidence.
  - - Mistral AI
    - Frontier model-lab comp
    - CNBC reported €11.7B valuation in 2025; TechCrunch reported talks for about €20B in 2026.
    - Shows frontier-lab marks can rise quickly when model adoption, sovereignty, and strategic capital converge.
    - Mistral has models and adoption signals; Mirendil has no public product.
    - CNBC, TechCrunch.
  - - xAI
    - Scaled frontier-AI comp
    - TechCrunch reported $20B Series E and roughly 600M monthly active X/Grok users.
    - Demonstrates the capital scale needed for frontier-model infrastructure.
    - Not comparable on stage, distribution, or risk profile.
    - TechCrunch, CNBC talent-war context.
