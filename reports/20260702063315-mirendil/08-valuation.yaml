tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Decision field
  - Current read
  - Evidence basis
  - Decision implication
  rows:
  - - Recommendation
    - Track / research-more
    - Elite founder-market fit and top-tier seed backers, but public evidence lacks product, revenue, customer, benchmark, and governance proof.
    - Do not approve a full-price buy without private evidence and structure review.
  - - Confidence
    - Medium-low
    - Funding and team facts are well corroborated; value drivers are mostly private and unverified.
    - Position sizing should remain option-like until proof improves.
  - - Risk rating
    - High
    - Pre-product frontier AI, expensive talent and compute, broad technical ambition, and adverse AI-market commentary.
    - Require hard milestones and downside protections before capital commitment.
  - - Valuation stance
    - Expensive
    - ~$1B post-money is far above ordinary seed benchmarks and near public AI-drug-discovery valuation anchors despite no public revenue.
    - Entry must be justified by proprietary technical proof, not category heat alone.
  - - Decision implication
    - Conditional pass only
    - The company merits active diligence because the upside category is real, but current public proof does not clear a buy threshold.
    - Track, seek information rights, and revisit after technical/customer evidence.
  notes: This is an IC decision table, not a generic quality score; the stance is price- and evidence-sensitive at the reported June 2026 financing terms.
