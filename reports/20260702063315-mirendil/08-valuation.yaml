- id: scenario-view
  title: Bull, base, and bear valuation scenarios
  body: The scenario range should be treated as an underwriting discipline, not a forecast precision exercise. The bull case assumes Mirendil demonstrates a proprietary autonomous AI-R&D loop, converts its first technical users into design partners, and earns comparison to scarce frontier-lab assets rather than to ordinary seed software. In that case, a later mark above the entry can be plausible because Thinking Machines, SSI, Periodic, Lila, Mistral, and xAI show that private capital has paid very large prices for frontier-AI scarcity. The base case assumes impressive research progress but no public revenue proof before the next financing; that can preserve option value yet leaves limited upside from a $1 billion entry. The bear case assumes weak benchmarks, governance opacity, or market compression, producing a down-round or structured extension risk rather than a clean markup.
