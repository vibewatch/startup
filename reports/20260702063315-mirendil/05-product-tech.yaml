- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role in system
  - Critical dependency
  - Risk
  rows:
  - - Frontier AI-R&D model layer
    - Generates research ideas, code, analyses, and next-step reasoning
    - High-quality model training, post-training, and research-trace data
    - Undisclosed architecture may not outperform general frontier models enough to matter
  - - Agentic research-loop harness
    - Maintains state across experiment design, coding, execution, debugging, and iteration
    - Tool execution, sandboxing, memory, planning, and feedback loops
    - Long-horizon planning and failure recovery remain weak in external benchmarks
  - - Compute orchestration and kernels
    - Schedules GPU work, manages runs, optimizes kernels, and controls cost
    - NVIDIA GPUs, cloud/data-center capacity, CUDA ecosystem, and budget guardrails
    - Compute access, power, and hardware costs can dominate product economics
  - - Evaluation and checkpoint comparison
    - Scores runs, compares baselines, detects regressions, and supports reproducibility
    - Held-out tasks, contamination controls, human baselines, logging, and audit trails
    - Evaluation leakage or reward hacking can inflate apparent capability
  - - Domain adapters and interfaces
    - Translate scientist goals and domain data into executable research tasks
    - Biology/chemistry/materials/robotics datasets, ontologies, lab tools, and user UX
    - AI-R&D success may not transfer to wet-lab or physical-world science
  - - Security, compliance, and trust layer
    - Prevents unsafe code execution, data leakage, misleading science, and uncontrolled actions
    - Sandboxing, permissions, data rights, monitoring, and review controls
    - No Mirendil trust, security, or compliance surface is public
  enumerationScope:
    coverage: partial
    basis: Architecture layers are inferred from public thesis language and external technical systems, with no claim of complete Mirendil implementation coverage.
