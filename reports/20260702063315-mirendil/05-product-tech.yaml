- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Mirendil proposed solution
  - Measurable benefit (claimed / unproven)
  - Limitation
  rows:
  - - ML experiment design
    - Researchers brainstorm hypotheses, choose baselines, implement variants, and manually track runs
    - Agent proposes experiments and loops through implementation and results interpretation
    - Claimed faster AI-R&D loop; no Mirendil benchmark quantifies speedup
    - Adjacent systems still make incorrect implementations and unfair comparisons
  - - Model training and checkpoint selection
    - Engineers schedule jobs, tune hyperparameters, inspect logs, and compare checkpoints
    - Autonomous loop manages compute and checkpoint comparison as part of the research cycle
    - Potentially lower wasted GPU time and faster iteration
    - No disclosed orchestration layer, budget guardrails, or reproducible checkpoint evidence
  - - Research code debugging
    - Humans read traces, fix bugs, rerun experiments, and validate tests
    - Agent writes and runs code, debugs failures, and uses eval feedback
    - SWE-bench and RE-Bench show agents can solve some realistic coding tasks
    - Benchmarks remain resource-intensive and vulnerable to test gaps or reward hacking
  - - Scientific coding for domain experts
    - Scientists translate domain knowledge into simulation or analysis code, often with specialist engineers
    - Mirendil aims to let experts run their own experiments without frontier-lab expertise
    - Could broaden access to AI-for-science tooling
    - SciCode shows realistic scientific coding remains difficult for current models
  - - Open-ended discovery loops
    - Humans define problems, devise algorithms, validate outputs, and write papers
    - AI system generates ideas, code, experiments, write-up, and review loops
    - AI Scientist and FunSearch show partial demonstrations
    - No proof Mirendil can generalize from AI R&D to wet-lab biology, chemistry, materials, or robotics
  - - Benchmark and evaluation governance
    - Teams curate held-out tests, human baselines, safety reviews, and reproducibility packages
    - Mirendil would need a robust eval harness around autonomous agents
    - Could build trust if transparent and non-contaminated
    - No public eval governance, and external audits show AI benchmarks can be exploitable
  enumerationScope:
    coverage: sample
    basis: Representative user jobs drawn from Mirendil’s stated loop and adjacent benchmark/task literature rather than from observed Mirendil customers.
  notes: Benefits are framed as claimed or potential because Mirendil has not published product metrics or customer workflow studies.
