- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control
  - Mirendil public status
  - Scope
  - Gap
  rows:
  - - Reproducibility package
    - Unknown
    - Executed code, data, seeds, logs, checkpoints, and environment captures
    - No public benchmark pack, run transcript, or reproducibility policy
  - - Sandboxed code execution
    - Unknown
    - Limits LLM-written code from unsafe filesystem, network, process, or package behavior
    - AI Scientist repo explicitly warns that LLM-written code should be containerized and restricted
  - - Hallucination and confabulation guardrails
    - Unknown
    - Prevents plausible but false research claims, structures, or outputs
    - FunSearch and AlphaFold 3 show evaluators/confidence measures are needed, but Mirendil has not disclosed them
  - - Benchmark integrity controls
    - Unknown
    - Hidden tests, isolation, leakage prevention, and anti-reward-hacking audits
    - Berkeley audit shows multiple benchmark vulnerability classes and fake-score paths
  - - Human review and escalation
    - Unknown
    - Defines when humans approve experiments, unsafe domains, or scientific claims
    - No public human-in-the-loop thresholds or safety governance
  - - Data rights and privacy
    - Unknown
    - Research traces, code, proprietary datasets, model outputs, and external user data
    - No public data-rights, retention, customer IP, or privacy posture for research automation
  enumerationScope:
    coverage: partial
    basis: Controls cover the minimum quality and compliance surfaces expected for autonomous research agents based on public technical risks and Mirendil disclosure gaps.
