  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Status / maturity for Mirendil
  - Differentiation if proven
  - Diligence gap
  rows:
  - - Frontier models specialized for AI R&D
    - AI researchers and ML engineers
    - Concept / undisclosed
    - Could outperform generic models on experiment design, code, evals, and checkpoint reasoning
    - Model names, architecture, training data, model card, and eval suite are not public
  - - Autonomous research-loop agent harness
    - Research engineers and future domain scientists
    - Concept / undisclosed
    - Would convert goals into iterative experiment plans, code changes, runs, debugging, and next-step selection
    - No public demo, API, transcript, safety case, or human-in-the-loop policy
  - - Compute-management layer
    - Internal lab operators and advanced users
    - Concept / undisclosed
    - Could allocate GPUs, schedule jobs, compare runs, and reduce wasted frontier-compute cycles
    - No disclosed cloud, cluster, orchestration stack, budget controls, or NVIDIA supply terms
  - - Evaluation and checkpoint-comparison harness
    - ML leads and technical reviewers
    - Concept / undisclosed
    - Could make automated work auditable through metrics, baselines, comparisons, and reproducible artifacts
    - No benchmark pack, held-out eval methodology, contamination controls, or human baselines
  - - Domain-science interfaces
    - Biology, chemistry, materials, robotics, and drug-discovery experts
    - Concept / undisclosed
    - Could let experts run AI-enabled research without becoming frontier AI labs
    - No workflow screenshots, ontology/data connectors, lab integration, or domain validation
  - - External user workspace or product surface
    - Engineers first, less technical scientists later
    - Not disclosed
    - Could package lab-grade tooling for users outside frontier labs
    - No pricing, docs, onboarding, support model, uptime, or release channel
  - - Research-trace / training-data corpus
    - Model-training and post-training teams
    - Private / undisclosed
    - Could become proprietary data around full AI-R&D loops if collected safely
    - No data provenance, consent, IP rights, retention, or privacy policy tied to research traces
