- id: maturity-roadmap-and-disclosure-gaps
  title: Maturity, roadmap, and release gaps
  body: 'The verified maturity score for Mirendil should be set near concept or undisclosed, even though the adjacent literature has working demonstrations. Publicly, Mirendil discloses a mission, a 20-person founding team, investors, and a broad target-user narrative. It does not disclose model names, model cards, eval methodology, datasets, deployment targets, integration surfaces, customer support process, uptime commitments, cloud region posture, compliance certifications, or a phased release plan. That matters because autonomous-research products cannot be diligenced like ordinary productivity tools: a small demo may fail to generalize once feedback loops become slower, goals become ambiguous, experiments require expensive compute, or wet-lab science introduces physical-world latency. The roadmap table therefore intentionally labels most Mirendil rows as “not disclosed.” Any stronger maturity claim would require private evidence such as an internal benchmark suite, reproducible demo,
    design-partner logs, or safety case.'
