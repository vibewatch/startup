- id: dependencies-and-operating-constraints
  title: Critical dependencies and operating constraints
  body: Mirendil’s technical dependency map is unusually concentrated. Frontier AI-R&D models require large-scale compute, and Epoch’s supercomputer dataset shows frontier AI systems have moved toward massive privately owned clusters whose performance, power, and hardware costs are scaling rapidly. NVIDIA’s participation in Mirendil’s financing is strategically relevant because NVIDIA controls core accelerated-computing infrastructure and publishes research resources, proprietary model licenses, and CUDA-oriented code libraries that sit near the ecosystem Mirendil must use. But financing participation is not the same as guaranteed supply, pricing, reserved capacity, or reliability. The product also depends on data rights for research traces, safe execution environments for LLM-written code, reproducible evaluation harnesses, foundation-model tooling, and domain-specific adapters for scientists. If any of those dependencies fails, the platform could remain an internal lab tool rather than
    a general external product.
  claimRefs:
  - CE032
  - CE033
