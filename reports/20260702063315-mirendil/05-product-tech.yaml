- id: architecture-and-operating-loop
  title: Architecture and operating loop
  body: A reasonable diligence model for Mirendil’s architecture has five layers, each still undisclosed for the company itself. The first is a frontier model family or model ensemble specialized for AI-R&D tasks. The second is an agentic harness that plans experiments, edits code, runs jobs, reads logs, and loops on failures. The third is compute orchestration for GPU jobs, kernels, checkpoints, and budget allocation. The fourth is an evaluation harness that compares generated artifacts against tests, scores, baselines, and human expectations. The fifth is a domain interface for scientists who may know biology, chemistry, materials, or robotics but not frontier-model operations. This architecture is not invented from generic “agent” language; it mirrors Mirendil’s own and investor descriptions and is corroborated by open systems such as AI Scientist, FunSearch, MLAgentBench, MLE-bench, RE-Bench, SciCode, and SWE-bench. The gap is that every Mirendil-specific implementation choice remains
    private.
