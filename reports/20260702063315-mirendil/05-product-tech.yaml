    whyItMatters: Without this evidence, public diligence cannot distinguish a defensible technical lead from a plausible narrative.
    diligencePath: Request internal eval results against MLE-bench, RE-Bench, SWE-bench, SciCode-like tasks, plus held-out proprietary tasks and human-baseline comparisons.
