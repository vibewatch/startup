- id: capital-formation-and-stakeholders
  title: Funding, investors, and stakeholder map
  body: Mirendil's financing is already large enough to set expectations for the rest of the report. Official and independent sources agree that the company announced a $200 million seed round in June 2026 at roughly a $1 billion valuation, led by Andreessen Horowitz and Kleiner Perkins with NVIDIA participating. Multiple outlets characterize it as one of the largest AI seed rounds yet disclosed. March 2026 coverage had already reported Mirendil seeking roughly $175 million at the same valuation, so the June close appears to represent a larger final round rather than a wholly different financing story. The capital base gives Mirendil substantial room to build compute-heavy lab infrastructure before revenue pressure arrives, and a simple post-money estimate implies new investors may own about one fifth of the company if the public numbers are directionally correct. Even so, public materials do not disclose cap-table detail, board rights, secondaries, debt, or any commercialization milestones
    that would normally anchor such a valuation.
  claimRefs:
