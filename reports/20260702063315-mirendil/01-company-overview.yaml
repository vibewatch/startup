- id: milestones-scale-and-open-questions
  title: Milestones, scale markers, and unresolved diligence burden
  body: 'Public milestones are tightly clustered because Mirendil is so new. The evidence trail runs from founders departing Anthropic in late 2025, to March 2026 fundraising reports, to late-June investor announcements and company launch materials. The few scale markers available are concentrated around the founding team, not commercial traction: the homepage and investor notes describe a 20-person founding group drawn from major frontier labs, but no broader headcount, office network, customer list, revenue, or benchmark pack has been disclosed. That means later chapters can safely reuse the identity, founders, financing, and mission claims from this chapter, but should treat most operating metrics as open diligence items rather than established facts. The main adverse read is straightforward: Mirendil has elite talent and unusually deep capitalization, yet the public market still lacks enough evidence to underwrite product readiness, governance quality, or commercial conversion. That
    asymmetry should shape every later chapter because it makes almost every forward-looking judgment depend on private diligence rather than public proof.'
