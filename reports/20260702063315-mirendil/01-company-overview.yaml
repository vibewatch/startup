- id: founders-team-and-governance
  title: Founders, bench, and governance visibility
  body: Founder-market fit is Mirendil's clearest strength. Behnam Neyshabur publicly identifies himself as Mirendil's co-founder and CEO after prior work at Anthropic and Google, and his CV, scholar profile, and paper record corroborate meaningful frontier-model credentials across optimization, Minerva, and Gemini-related work. Harsh Mehta is described across investor and profile sources as Mirendil's co-founder and CTO, with earlier work at Anthropic and Google DeepMind and a research track record in optimization and machine learning. Investor writeups also highlight founding operators Shayan Salehian from xAI and Tara Rezaei from MIT and OpenAI. The public bench story is therefore strong on pedigree and technical depth. The governance story is not. Across the website, investor posts, and principal launch coverage, there is still no public board list, governance-rights disclosure, independent-director signal, or detailed legal-entity footprint, leaving key-person and control questions
    unresolved.
  claimRefs:
