- id: market-sizing-lenses
  title: 'Sizing lenses: three overlapping markets, no single TAM'
  body: >-
    Even within a single nominally identical category, public sizing estimates disagree sharply. Grand View
    Research puts the 2026 global AI-in-drug-discovery market at $2.9 billion, rising to $13.8 billion by 2033 at a
    24.8% CAGR. Precedence Research sizes the same nominal category at $7.62 billion in 2026, rising to $17.81
    billion by 2035 at a 9.90% CAGR -- roughly 2.6x Grand View's 2026 figure for what both firms describe as the
    same market, a gap that reflects differing scope and base-year assumptions rather than a simple forecasting
    difference. Agentic AI estimates agree far more closely: Mordor Intelligence's $9.89 billion (2026) and Fortune
    Business Insights' $9.14 billion (2026) sit within 8% of each other, though both count mostly non-science
    enterprise agents. The physical-lab layer is smaller still -- Dimension Market Research sizes the global
    autonomous chemical laboratory market at $5.75 billion in 2026, growing at a 14.5% CAGR to $19.48 billion by
    2035. No public estimate exists for Mirendil's specific cross-domain category, so the best available proxy is
    capital committed to comparable ventures: Mirendil ($200M seed), Periodic Labs ($300M seed, in talks for $500M
    more at a $7.5B valuation), and Lila Sciences ($550M total, $1.3B+ valuation) had together raised over $1
    billion in disclosed private capital by mid-2026, alongside Excelra's estimate of more than $20 billion in
    cumulative AI-drug-discovery investment industry-wide over the past decade-plus. McKinsey's own adoption survey
    shows real deployment running far behind these dollar forecasts.
