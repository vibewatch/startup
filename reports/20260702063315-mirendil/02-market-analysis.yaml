- calloutType: risk
  title: Sizing lenses disagree by up to 2.6x for nominally the same category
  body: Grand View Research and Precedence Research both claim to size the global "AI in drug discovery" market for
    2026, yet their figures differ by roughly 2.6x. Any valuation model that leans on a single third-party TAM
    number for Mirendil's category should be treated with the same skepticism.
  claimRefs:
  - CM009
  - CM010
  - CM011
- calloutType: insight
  title: Adoption lags dollar forecasts by a wide margin
  body: Multi-billion-dollar agentic-AI market forecasts coexist with McKinsey survey data showing no more than 10%
    of organizations scaling agents in any one function, and Gartner's forecast that over 40% of agentic AI projects
    will be canceled by 2027. Revenue realization for Mirendil-style vendors is likely to arrive later and more
    unevenly than headline market-size figures imply.
  claimRefs:
  - CM039
  - CM040
  - CM022
- calloutType: assumption
  title: Buyer economics look like biotech partnerships, not enterprise SaaS
  body: The clearest disclosed payer pattern in this space -- Isomorphic Labs' milestone-based Eli Lilly deal, and
    the scale of capital raised by Periodic Labs and Lila Sciences -- resembles venture-backed biotech partnership
    economics far more than recurring enterprise software revenue. Diligence should test whether Mirendil's own
    commercialization plan assumes the same slower, milestone-based payer path.
  claimRefs:
  - CM024
  - CM021
  - CM017
