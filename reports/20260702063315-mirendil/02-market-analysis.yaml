- id: growth-drivers-constraints-and-diligence-gaps
  title: Growth drivers, adoption constraints, and unresolved sizing gaps
  body: >-
    Several forces push adoption forward. Stanford's 2026 AI Index reports global private AI investment more than
    doubled in 2025 (+127.5% year-over-year), and major cloud providers are hitting record infrastructure spend --
    Google alone reported over $150 billion in 2025 annual capex -- which underwrites the compute frontier labs
    need. Pharma cost pressure compounds this: ZS estimates new US tariffs could add $13-19 billion in industry
    costs and that the largest pharma companies need to cut roughly $32 billion in expenses by 2030, incentivizing
    substitution toward AI tooling that Excelra says is already cutting discovery timelines 40-50% at AI-native
    biotechs with the strongest hybrid business models. Working against this, Epoch AI's data shows frontier
    training compute growing 5x per year since 2020, training cost climbing about 3.5x annually, and power demand
    doubling yearly -- a capital-intensity constraint that requires continuously rising commitments well beyond a
    single $200 million seed round. Federal science funding is simultaneously being cut and carved out for AI: the
    FY2026 NSF budget request would cut total NSF funding by 56.9% (to $3.9 billion from $9.06 billion enacted) even
    as AI is one of the only areas prioritized for increased investment, and the Computing Research Association
    warned the broader cuts would "turn back the clock more than 20 years" on US research capacity. None of this
    resolves two material diligence gaps: no bottoms-up estimate exists for what share of the ~$288 billion pharma
    R&D budget (plus adjacent materials/chemicals R&D) a cross-domain platform could realistically capture, and it
    is not publicly known whether Mirendil's own roadmap includes physical self-driving-lab integration or stays
    software-only -- a choice that determines which of the sizing lenses above actually applies.
