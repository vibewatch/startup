- id: adoption-path-and-enterprise-agentic-gap
  title: 'Adoption path: why dollar forecasts run far ahead of real deployment'
  body: >-
    The gap between headline market forecasts and observed adoption is the single most important adoption
    constraint for any vendor selling autonomous AI systems into research workflows. McKinsey's November 2025
    global survey (1,993 respondents, 105 countries) found 62% of organizations at least experimenting with AI
    agents, but only 23% scaling any agentic use case and no more than 10% scaling within a single business
    function. Gartner goes further, forecasting that more than 40% of agentic AI projects will be canceled by the
    end of 2027 on escalating cost, unclear business value, or inadequate risk controls, and estimates that of
    thousands of vendors marketed as "agentic AI," only about 130 deliver genuine autonomous capability -- the rest
    is "agent washing." A companion Gartner-sourced survey of over 3,400 professionals found only 19% reporting
    significant investment in agentic AI as of January 2025, with 42% investing conservatively and 31% still
    undecided. Layered on top of this general enterprise caution is a science-specific trust problem: Nature's 2026
    reporting on AI's footprint in scientific journals, preprints, and peer review describes a "rapidly evolving"
    but still poorly measured situation, and independent commentary cites a Columbia University audit finding
    roughly 1-in-277 PubMed-indexed papers in 2026 contained AI-hallucinated or fabricated citations, prompting
    arXiv to adopt a 2026 policy banning unverified AI-generated content. Any AI-for-science vendor -- Mirendil
    included -- must clear this credibility bar before buyers will pay for autonomously generated research output.
  claimRefs:
  - CM039
  - CM040
  - CM041
  - CM042
  - CM022
  - CM049
