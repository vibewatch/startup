  evidenceGaps:
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: An independent analyst estimate sized specifically to frontier-lab-grade, cross-domain AI
      research-automation platforms -- not agentic AI broadly, not drug discovery narrowly, and not autonomous labs
      narrowly.
    whyItMatters: Without this, any TAM/SAM/SOM figure attached to Mirendil is necessarily a proxy built from
      adjacent markets that individually diverge by up to 2.6x, weakening any valuation model anchored to a single
      market-size number.
    diligencePath: Commission or request a bespoke bottoms-up sizing study anchored to the specific pharma,
      materials, and government-research sub-segments Mirendil can realistically serve.
    relatedQuestionRefs:
    - QM008
    - QM025
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: product-roadmap
    missingEvidence: Confirmation of whether Mirendil's roadmap includes physical self-driving-lab integration or
      stays software/agent-only.
    whyItMatters: This choice determines whether the smaller, slower-growing autonomous-lab lens or the larger,
      faster-growing agentic-AI lens is the more relevant sizing comparison, and it changes the capital intensity
      Mirendil will need going forward.
    diligencePath: Request Mirendil's product roadmap, hardware partnerships, and any lab-automation vendor
      relationships directly from the company during private diligence.
    relatedQuestionRefs:
    - QM026
  - type: conflicting-data
    severity: material
    topic: market-sizing
    missingEvidence: Reconciliation of Grand View Research's and Precedence Research's roughly 2.6x divergent 2026
      AI-in-drug-discovery market-size estimates.
    whyItMatters: Citing either number alone without the other would materially overstate or understate the size of
      the nearest disclosed adjacent market to Mirendil's biology/drug-discovery use case.
    diligencePath: Request each firm's underlying segment definitions and base-year methodology notes before citing
      either number as authoritative in a valuation model.
    relatedQuestionRefs:
    - QM002
    relatedTableRefs:
    - TM002
  - type: enumeration-incomplete
    severity: minor
    topic: market-sizing
    missingEvidence: A bottoms-up estimate of the specific dollar share of the ~$288 billion global pharma R&D
      budget realistically capturable by cross-domain AI platforms like Mirendil's.
    whyItMatters: Without a capture-rate estimate, the pharma R&D budget is only a boundary, not a usable SAM/SOM
      figure.
    diligencePath: Build a bottoms-up capture-rate model once Mirendil discloses named pilot customers, contract
      sizes, or pipeline detail.
    relatedQuestionRefs:
    - QM027
  - type: stale
    severity: minor
    topic: policy-funding
    missingEvidence: Final FY2026 NSF appropriations once Congress completes the budget cycle -- the CRS and AIP
