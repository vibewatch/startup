tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to Mirendil
  rows:
  - - AI-for-science / cross-domain research-automation platforms (Mirendil's stated category)
    - AI models, agent tooling, and compute built specifically to design, run, and interpret experiments across
      bio/chem/materials
    - Generic wet-lab capex, generic LLM chat subscriptions unrelated to R&D workflows
    - Pharma/biotech/materials R&D leadership, national labs
    - Core category Mirendil targets; no independent sizing exists yet
  - - AI-in-drug-discovery software & services
    - Molecule design, target ID, ADMET prediction, de novo design software sold to pharma/biotech/CROs
    - Wet-lab automation hardware itself, CRO headcount costs, non-pharma science
    - Pharma/biotech R&D, contract research organizations
    - Largest disclosed adjacent software market; overlaps Mirendil's biology/drug-discovery use case
  - - Agentic AI / enterprise AI-agent platforms
    - General-purpose autonomous agent software across customer service, IT, finance, manufacturing
    - Domain-specific scientific reasoning, physical wet-lab integration
    - Enterprise IT/ops buyers across all industries
    - Much larger headline market but mostly non-science; illustrates sizing-lens risk if applied directly
  - - Autonomous / self-driving laboratory hardware+software
    - Lab robotics, closed-loop experimentation platforms, cloud-lab orchestration
    - Pure software-only AI reasoning models without physical lab control
    - Pharma, chemicals, and materials-science operations leaders
    - Closest physical-lab analog to Mirendil's "system that builds systems" thesis
  - - Global pharmaceutical R&D budget (status-quo substitute)
    - In-house pharma discovery, preclinical, and clinical R&D spend
    - Marketing, manufacturing, and commercial spend
    - CFO / Chief R&D Officer of pharma companies
    - The budget pool Mirendil-style tools must ultimately augment or displace
  - - Federal & philanthropic basic-research funding (adjacent status-quo substitute)
    - Government grants (e.g. NSF) funding academic AI-for-science research
    - Corporate/private-lab spend
    - Government agencies, university principal investigators
    - Adjacent, currently volatile funding pool; a policy risk to the academic adoption path
  notes: Rows synthesize category boundaries described across five distinct third-party sources (SM001, SM003,
    SM025, SM014, SM020); no single source defines Mirendil's own category, so this table is the author's boundary
    logic, not one publisher's segmentation.
