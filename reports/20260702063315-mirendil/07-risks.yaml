- id: mitigations-and-kill-criteria
  title: Mitigations, monitoring cadence, and kill criteria
  body: 'The diligence answer is not to avoid every risk; it is to define which risks can be retired with evidence and which should kill the thesis. Mitigations should be staged in the order risks transmit to valuation. First, require private technical proof: eval results, adversarial scientific tasks, citation-verification controls, reproducibility checks, and red-team logs. Second, require legal provenance: founder exit documents, IP assignment chain, inbound invention review, offboarding certifications, model/data access controls, and outside-counsel memo on former-employer exposure. Third, require regulatory segmentation: a written decision tree separating internal research tools, EU GPAI obligations, high-risk AI use cases, FDA-regulated software/device use, and non-clinical drug-discovery workflows. Fourth, require operating redundancy: compute reservation terms, multi-cloud failover, recruiting pipeline, retention economics, and design-partner evidence. The kill criteria are deliberately
    measurable: no reproducible benchmark, no clean IP memo, no credible compliance owner, no named external pilot, or next financing attempted without customer/product proof should move the investment stance toward avoid or severe price reset.'
