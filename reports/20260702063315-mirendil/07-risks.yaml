- id: dependencies-and-partner-transmission
  title: Partner, dependency, and market-transmission risk
  body: 'The partner risk is a dependency graph rather than a single supplier issue. NVIDIA’s participation supports the compute story, but it also spotlights concentration in accelerator access, cloud procurement, and frontier-model tooling that may be scarce, expensive, or preferentially allocated to larger customers. The capital partner dependency is similarly two-sided: a16z and Kleiner Perkins credibility improves fundraising and recruiting, yet CB Insights data show 2025 and Q1 2026 AI funding became top-heavy, with mega-rounds and model developers absorbing a rising share of capital. Scientific buyer budgets are another channel. CRS and C&EN describe proposed FY2026 NSF reductions that, if enacted or echoed across research institutions, could pressure non-pharma buyer budgets just as Mirendil tries to commercialize. Competitive partner risk is also high because Periodic Labs, Lila Sciences, Isomorphic Labs, Anthropic, OpenAI, Google DeepMind, and vertical AI-drug-discovery players
    are all competing for compute, researchers, scientific credibility, and enterprise attention. The mitigation is not generic partnership language; it is redundancy in compute, cloud, talent pipeline, and design-partner channels.'
