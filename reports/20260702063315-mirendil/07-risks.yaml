- id: regulatory-and-legal-exposure
  title: Regulatory and legal exposure
  body: Regulatory risk is not yet a single approval blocker because Mirendil has not disclosed a shipped product or regulated clinical workflow. The risk is path-dependent. If the system is a general-purpose AI research assistant sold in Europe, EU AI Act transparency, copyright, training-content-summary, and systemic-risk obligations may become relevant, and high-risk deployments would require risk management, data governance, logging, documentation, human oversight, robustness, cybersecurity, and accuracy controls before market placement. If Mirendil enters drug discovery, medical software, or clinical decision support, FDA sources show that AI-enabled medical devices and software modifications may require appropriate premarket pathways, lifecycle management, and predetermined change-control plans. The IP/legal posture is equally material. Law-firm analyses and AI trade-secret cases show that model weights, training data, system prompts, and tuning methods are portable assets; ex-frontier-lab
    founders must therefore demonstrate clean-room provenance, exit-certification discipline, monitoring, and written confidentiality controls rather than relying on reputation alone. No public lawsuit or certification record was confirmed, so the mitigation remains a diligence path, not a proven control.
