- id: people-execution-and-financing-risk
  title: People, execution, financing, and customer-conversion risk
  body: 'People risk is unusually concentrated because the public story depends heavily on Behnam Neyshabur, Harsh Mehta, and a 20-person elite bench drawn from Anthropic, xAI, Google DeepMind, and OpenAI. CNBC’s talent-war coverage shows why retention cannot be assumed: big-tech firms are paying exceptional packages for scarce AI researchers, and the same market that helped Mirendil recruit can also pull talent away. Execution risk is more severe than ordinary startup uncertainty because public disclosures show mission, capital, and pedigree before product proof. TechCrunch’s seed-valuation analysis says AI seed investors increasingly expect live products, users, revenue, distribution, and retention earlier, while high prices leave less room for experimentation or pivots. Mirendil’s roughly $1 billion valuation therefore magnifies the consequence of missing technical or customer milestones. Customer risk is still mostly absence-of-evidence: no public design partners, production deployments,
    retention metrics, pricing, or buyer concentration data surfaced. The practical mitigation is a milestone plan with named owners, retention packages, proof-of-work demos, and customer reference checks tied to financing gates.'
