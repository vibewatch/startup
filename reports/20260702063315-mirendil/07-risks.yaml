- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Execution / product proof
    - Reproducible external benchmark or private demo under investor-observed tasks
    - No credible benchmark, demo, or pilot evidence within two quarters after seed close
    - Pause follow-on; require price reset or avoid until product proof exists
  - - Scientific integrity
    - False citation, false claim, or unreproducible experiment rate in blinded tasks
    - Material hallucinations remain above agreed threshold or central claims cannot be verified
    - Block regulated/scientific pilots and require remediation before revenue underwriting
  - - IP / trade-secret provenance
    - Outside-counsel memo and clean-room evidence
    - Counsel cannot confirm founder/team obligations, data provenance, and no restricted former-employer information
    - Do not invest further; treat as thesis-break legal exposure
  - - Regulatory pathway
    - EU/FDA classification memo and named compliance owner
    - No product-use classification, no compliance owner, or regulated claims made before pathway is approved
    - Suspend affected launch; require board-level regulatory remediation
  - - Financing / valuation
    - Runway, burn, insider support, next-round proof standard
    - Next financing attempted without named pilots, benchmark proof, or insider support at valuation above evidence
    - Assume down-round/high dilution; mark valuation as stretched-to-expensive
  - - Talent concentration
    - Founder retention, key-person departures, hiring velocity
    - Either founder leaves, two or more named technical leads depart, or critical roles remain unfilled for two quarters
    - Re-underwrite leadership risk and require succession proof
  - - Compute dependency
    - Reserved capacity, cost per validated scientific task, supplier redundancy
    - No signed compute plan or unit-cost envelope sufficient for roadmap milestones
    - Reduce case probability and require vendor term sheet before scaling burn
  - - Customer conversion
    - Named design partner, SOW, paid pilot, or referenceable outcome
    - No external design partner or buyer-validated workflow by next IC checkpoint
    - Treat market demand as unproven and defer valuation step-up
  notes: Kill criteria are deliberately operationalized as diligence triggers; thresholds should be calibrated with management data before an investment committee vote.
