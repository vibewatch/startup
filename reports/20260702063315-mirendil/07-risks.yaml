company:
  name: Mirendil
chapter:
  number: 7
  title: Risks
  summary: 'Mirendil’s dominant risks are execution, integrity, financing, and key-person concentration rather than classic near-term revenue leakage: the company is publicly pre-product and pre-revenue, yet already priced like a frontier winner. Regulatory, FDA, IP, compute, and public-science-budget risks are manageable only if Mirendil builds auditable controls, keeps trade-secret provenance clean, and converts the seed runway into measurable product proof before the next financing gate.'
sections:
- id: risk-ranking-frame
  title: Severity frame and top risks
  body: 'The risk stack should be ranked from thesis-breaking to manageable because Mirendil has raised ahead of public proof. The highest-severity risk is execution: official and investor sources describe a frontier AI-R&D lab and a 20-person founding bench, while independent coverage and adverse commentary still show no public product, revenue, customers, benchmark pack, or legal/trust surface. That creates a narrow diligence standard: the company must show private evidence that its autonomous research loop works outside founder-controlled demos. The second cluster is technical and integrity risk, because scientific AI that fabricates citations, research claims, or experimental rationales can destroy buyer trust faster than normal SaaS defects. Third is financing/valuation risk: venture data show capital concentrating in fewer, larger AI rounds, Gartner warns many agentic projects will be cancelled, and high seed prices leave less tolerance for pivots. Legal, regulatory, partner, talent,
    and customer risks matter because each can transmit into the same outcome: no credible external adoption before the next financing window.'
