  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: product proof
    missingEvidence: Benchmark pack, blinded demo results, reproducibility metrics, and customer-relevant scientific task evaluations for Mirendil’s AI-R&D system.
    whyItMatters: The highest-ranked execution risk cannot be retired with public mission copy or investor conviction alone.
    diligencePath: Run an investor-observed technical diligence session with pre-agreed tasks, controls, logs, and replication checks.
    relatedQuestionRefs:
    - QR001
    - QR002
    - QR022
    relatedTableRefs:
    - TR002
    - TR005
  - type: private-evidence-only
    severity: blocking
    topic: IP provenance
    missingEvidence: Outside counsel memo, founder departure documents, clean-room records, invention assignments, access logs, and former-employer covenant review.
    whyItMatters: Ex-frontier-lab mobility creates trade-secret exposure that can become thesis-breaking if provenance is not clean.
    diligencePath: Request counsel work product under NDA and interview the founders, general counsel, and security owner about provenance controls.
    relatedQuestionRefs:
    - QR005
    - QR006
    - QR023
    relatedTableRefs:
    - TR001
    - TR005
  - type: private-evidence-only
    severity: material
    topic: security and compliance controls
    missingEvidence: Trust center, security questionnaire, DPA, SOC 2 or equivalent roadmap, incident-response policy, status page, and named security owner.
    whyItMatters: Scientific customers may share sensitive IP and data; absence of controls can block enterprise and regulated pilots.
    diligencePath: Ask management for security architecture, DLP controls, access-control audit, and third-party audit schedule.
    relatedQuestionRefs:
    - QR009
    - QR026
    - QR030
    relatedTableRefs:
    - TR002
  - type: missing-source
    severity: material
    topic: litigation and enforcement search
    missingEvidence: Court-record, regulator, sanctions, and complaint searches confirming no Mirendil-specific actions as of the run date.
    whyItMatters: Public web review found no action, but legal status should be verified through docket and regulatory databases before investment.
    diligencePath: Run PACER/state docket searches, sanctions screening, EU regulator checks, and counsel confirmation under NDA.
    relatedQuestionRefs:
    - QR027
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: burn and runway
    missingEvidence: Monthly burn, compute commitments, vendor obligations, hiring plan, runway, insider reserve commitments, and next-round milestone plan.
    whyItMatters: A $200 million seed gives room to build but does not prove capital efficiency or support the ~$1 billion valuation if milestones slip.
    diligencePath: Review the board-approved operating plan, cloud/GPU contracts, cap table, pro rata rights, and downside financing scenarios.
    relatedQuestionRefs:
    - QR019
    - QR020
    relatedTableRefs:
    - TR003
    - TR004
    - TR005
  - type: private-evidence-only
    severity: material
    topic: customer conversion
    missingEvidence: Named design partners, paid pilots, statements of work, buyer security requirements, workflow outcomes, and referenceability commitments.
    whyItMatters: No public customers are disclosed, so customer risk remains unresolved until external buyer validation exists.
    diligencePath: Interview design partners, review SOWs and pilot success criteria, and verify pricing or procurement status.
    relatedQuestionRefs:
    - QR021
    - QR022
    relatedTableRefs:
    - TR005
  - type: enumeration-incomplete
    severity: minor
    topic: TR001 regulatory register coverage
    missingEvidence: Definitive product claims, deployment geographies, user workflows, and regulated-use boundaries that determine the full legal register.
    whyItMatters: The regulatory register is a severity-ranked map of plausible regimes, not an exhaustive legal opinion.
    diligencePath: Have product counsel classify each planned module after management shares roadmap and customer workflow details.
    relatedQuestionRefs:
    - QR003
    - QR004
    - QR024
    relatedTableRefs:
    - TR001
