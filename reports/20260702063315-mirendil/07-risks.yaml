- id: operational-quality-and-scientific-integrity
  title: Operational, security, and research-integrity risk
  body: 'Mirendil’s product promise is unusually sensitive to quality failures because its users are expected to trust AI systems inside scientific and engineering workflows. Research-integrity sources provide concrete adverse signals: hallucinated citations have appeared in hundreds of NLP conference papers, biomedical audits found fabricated references in one in 277 early-2026 PubMed-indexed papers, and a large arXiv audit estimated 146,932 hallucinated citations in 2025 across major research repositories. Those facts do not prove Mirendil will fail, but they make verification infrastructure a core product requirement, not a nice-to-have. Gartner’s cancellation forecast adds an operational lesson: agents fail when costs, value, and risk controls are not grounded before production. NIST’s AI Risk Management Framework gives a mitigation template around trustworthy design, evaluation, and ongoing risk management. For Mirendil, the diligence ask is an eval suite that tests factuality, citation
    integrity, experimental reproducibility, security boundaries, incident response, and human approval points before any external customer workflow is allowed to depend on model-generated scientific outputs.'
