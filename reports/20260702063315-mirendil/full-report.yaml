          frontier-AI teams.
        - A correction in private AI marks or failed next-round comps would move the stance from expensive to avoid.
      - - 'Anti-thesis: no public product proof'
        - Mirendil has no public benchmark pack, SKU, roadmap, revenue, or customer count as of run date.
        - A reproducible demo and third-party benchmark suite would close the largest evidence gap.
      - - 'Anti-thesis: valuation ahead of fundamentals'
        - The company is priced near or above public AI-for-science companies that disclose revenue and filings.
