  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Final recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              The recommendation is to track Mirendil and proceed only through a conditional research-more path, not a
              clean buy at the reported roughly $1 billion post-money valuation. The strongest evidence is real:
              Mirendil itself says a16z and Kleiner Perkins led a $200 million seed with NVIDIA participating,
              independent coverage reports the same financing at a $1 billion valuation, and the founders have unusually
              relevant frontier-AI research credentials. The underwriting problem is that the price is not supported by
              public fundamentals. There is no disclosed revenue, customer count, benchmark pack, roadmap, cap table,
              preference stack, or board package. A $1 billion entry can be rational only if private diligence proves a
              step-change technical system, credible first users, and enough runway to reach a much higher priced next
              round without punitive structure.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV033
              - CV034
              - CV035
              - CV036
