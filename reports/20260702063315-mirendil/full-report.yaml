        title: 'Customer Base: No Disclosed Customers, Four Plausible Buyer Segments'
        blocks:
          - type: paragraph
            body: >-
              Mirendil has not named a single customer, pilot user, or design partner in any public source reviewed for
              this chapter -- homepage, careers page, investor notes, and press coverage all describe a mission and a
              founding team but never a buyer. Because no direct evidence exists, the buyer map here is necessarily
              inferred from Mirendil's own stated ambition and from how comparable AI-for-science vendors actually
              monetize. Pharma and biotech R&D organizations are the clearest analog: Isomorphic Labs and Recursion both
              sell into this segment through milestone-based collaborations rather than seat licenses, with a Chief R&D
              or Digital officer as budget owner and bench or computational-biology scientists as daily users.
              Universities and academic research labs are a second segment, where the effective payer is a grant or
              foundation budget routed through security-reviewed procurement, and Periodic Labs' public Academic Grant
              Program shows a plausible entry mechanism Mirendil has not replicated. Industrial and materials-science
              labs -- the closest peer being Periodic Labs' undisclosed semiconductor-manufacturer engagement -- are a
              third segment. A fourth, more speculative segment is internal AI-research teams at other labs or large
              enterprises, complicated by the fact that Mirendil's own stated mission of accelerating internal AI R&D
              could position it as a competitor to exactly the kind of team it might otherwise sell to. A fifth analog,
              philanthropic-funded nonprofit science labs such as FutureHouse, illustrates a non-commercial payer model
