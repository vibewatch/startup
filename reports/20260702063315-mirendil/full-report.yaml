    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, mission, and current positioning
        blocks:
          - type: paragraph
            body: >-
              Mirendil presents itself as a frontier AI lab rather than a packaged software vendor. Its homepage,
              Andreessen Horowitz investment note, and Kleiner Perkins profile all converge on the same core thesis:
              build systems that are exceptional at AI research and development, then redesign the research loop around
              those systems so it becomes faster, more capable, and more autonomous. The stated ambition is unusually
              broad. Rather than targeting a single vertical workflow, Mirendil says it wants to democratize frontier AI
              R&D so scientists and domain experts working in biology, chemistry, drug discovery, materials science, and
              robotics do not need to first become frontier AI labs themselves. That framing matters for diligence
              because it positions the company as a lab-grade platform play with potentially massive upside, but also
              means its current public product disclosure is mostly mission-level narrative rather than a customer-ready
              SKU with benchmarks, roadmap milestones, or contract references.
