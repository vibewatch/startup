              show that AI-enabled medical devices and software modifications may require appropriate premarket
              pathways, lifecycle management, and predetermined change-control plans. The IP/legal posture is equally
              material. Law-firm analyses and AI trade-secret cases show that model weights, training data, system
              prompts, and tuning methods are portable assets; ex-frontier-lab founders must therefore demonstrate
              clean-room provenance, exit-certification discipline, monitoring, and written confidentiality controls
              rather than relying on reputation alone. No public lawsuit or certification record was confirmed, so the
