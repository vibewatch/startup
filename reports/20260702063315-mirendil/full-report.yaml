      - number: '8.5'
        title: Exit readiness, liquidity, and overhang
        blocks:
          - type: paragraph
            body: >-
              Exit readiness is low today. Mirendil is not revenue-ready, not filing-ready, and not strategically
              de-risked enough for a near-term M&A or IPO view. The cleanest positive path is a long-duration
              frontier-lab outcome: use the seed to build a system that creates demonstrable research acceleration, then
              raise from insiders or strategic compute and life-science partners at a premium. The negative path is
              equally clear: a rich seed valuation, scarce technical disclosure, and a broad mission can leave the
              company trapped between a high prior price and insufficient evidence for crossover or public investors.
              Public comparables make the discipline visible. Recursion and Schrödinger have real revenue and filings
              yet still show heavy R&D spending and losses, so Mirendil should not be underwritten as if later-stage
              public markets will automatically reward AI-for-science narratives without proof.
            claimRefs:
              - CV017
              - CV018
              - CV019
              - CV020
