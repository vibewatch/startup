  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Technical proof failure
        - No private benchmark or demo shows autonomous AI-R&D performance beyond strong general-purpose models.
        - Undercuts the core claim that the loop is the product.
        - Do not invest at the current price; revisit after reproducible proof.
      - - Customer pull failure
        - No signed design partners, paid pilots, or credible external user pipeline within 12-18 months.
        - Turns the thesis into an internal research lab rather than a platform company.
        - Limit exposure to observation rights or pass.
      - - Runway / burn mismatch
        - Seed plan requires another large raise before meaningful proof or depends on uncommitted compute.
        - Creates down-round and preference-overhang risk.
        - Require milestone-based tranche, lower entry, or protective structure.
      - - Governance opacity
        - Board rights, voting control, liquidation preferences, or founder vesting cannot be diligence-verified.
        - Raises agency risk at an unusually rich pre-product valuation.
        - Block until legal and cap-table package is reviewed.
      - - Market correction
        - Comparable AI seed or frontier-lab marks compress materially or new rounds demand structure.
        - Reduces probability of premium follow-on financing.
        - Move stance from track to avoid unless entry resets materially.
      - - Talent attrition
        - Loss of either founder or multiple core researchers before product proof.
        - Damages the principal asset being underwritten.
        - Treat as thesis break absent exceptional succession evidence.
      - - Safety / integrity failure
        - Research outputs are not reproducible, auditable, or safe enough for scientific users.
        - Blocks customer trust and strategic partnership routes.
        - Pause investment until controls and validation are independently verified.
    notes: >-
      Triggers are designed as monitorable diligence gates because public evidence does not yet support a
      fundamentals-based valuation.
