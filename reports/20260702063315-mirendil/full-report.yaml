      - number: '5.4'
        title: Maturity, roadmap, and release gaps
        blocks:
          - type: paragraph
            body: >-
              The verified maturity score for Mirendil should be set near concept or undisclosed, even though the
              adjacent literature has working demonstrations. Publicly, Mirendil discloses a mission, a 20-person
              founding team, investors, and a broad target-user narrative. It does not disclose model names, model
              cards, eval methodology, datasets, deployment targets, integration surfaces, customer support process,
