            body: >-
              Incumbents attack Mirendil from credibility, distribution, and proof rather than from identical
              positioning. Google DeepMind’s AlphaFold has already become a global scientific tool with hundreds of
              millions of protein structures and millions of researchers, while Isomorphic Labs converts the AlphaFold
