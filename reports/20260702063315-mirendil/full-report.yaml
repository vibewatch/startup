              Grand View Research and Precedence Research both claim to size the global "AI in drug discovery" market
              for 2026, yet their figures differ by roughly 2.6x. Any valuation model that leans on a single third-party
              TAM number for Mirendil's category should be treated with the same skepticism.
            calloutType: risk
            claimRefs:
