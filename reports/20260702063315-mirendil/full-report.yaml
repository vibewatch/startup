  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape boundary and alternative classes
        blocks:
          - type: paragraph
            body: >-
              The competitive set should be drawn around the buyer job rather than around Mirendil’s current corporate
              label. Mirendil is not merely another model company; it is trying to help AI builders and eventually
              scientists run more of the research loop themselves. That job can be served by direct “AI scientist”
              laboratories such as Periodic Labs, Lila Sciences, FutureHouse, and Sakana AI; by incumbents such as
              Google DeepMind, Isomorphic Labs, Anthropic, and OpenAI; by vertical AI-drug-discovery and protein-design
              platforms such as Recursion, Insilico, Chai Discovery, Cradle, and Schrödinger; by infrastructure
              suppliers such as NVIDIA; by internal pharma or technology teams; by CROs and manual bench science; or by
              scientists multi-homing across general LLMs and specialized tools. This wide boundary is adverse for
              Mirendil because buyers can adopt pieces of automation without waiting for a single end-to-end frontier
              lab platform.
