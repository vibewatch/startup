        - driver
        - now - 2028
        - Expands the compute supply frontier labs and their vendors can draw on
        - Confirm what compute commitments (cloud credits, GPU access) back Mirendil's own roadmap
      - - Compute/training cost inflation (Epoch AI -- compute +5x/yr, cost +3.5x/yr, power doubling yearly)
        - constraint
        - ongoing
        - Squeezes margins/opex for any lab-grade research platform; raises the capital intensity of competing credibly
        - Diligence Mirendil's actual compute budget/commitments versus the $200M raised
      - - Enterprise agentic-AI ROI disappointment (Gartner -- over 40% of agentic AI projects canceled by 2027)
        - constraint
        - 2026-2027
        - Buyer skepticism could slow paid adoption of "AI scientist" tools even where technically capable
        - Ask for pilot-to-paid conversion evidence, not just proof-of-concept counts
      - - >-
          AI-native biotech commercial traction (ZS -- 40-50% faster timelines; Excelra -- hybrid models outperforming
          pure pipeline plays)
        - driver
        - now
        - Validates buyer willingness to pay for AI-accelerated discovery when packaged correctly
        - Diligence which business model Mirendil intends -- platform/SaaS, AI-first biotech, or hybrid
      - - Federal basic-research funding cuts outside AI carve-outs (NSF request -56.9%; CRA policy commentary)
        - constraint
        - FY2026 budget cycle
        - Threatens the academic/government adoption path and talent pipeline even as AI itself is prioritized
        - Track the final congressional appropriation versus the request
      - - Reproducibility/trust erosion in AI-assisted science (Nature; 1-in-277 PubMed fake-citation rate)
        - constraint
        - ongoing
        - Raises scrutiny of any AI-generated research output, a reputational risk for an "AI scientist" vendor
        - Ask what verification/QA pipeline Mirendil applies to AI-generated results
      - - Pharma cost pressure & tariff exposure (ZS -- $13-19B tariff cost, ~$32B SG&A cuts by 2030)
        - driver (indirect)
        - 2026-2030
        - Cost pressure pushes pharma toward AI tools that cut R&D cycle time/cost, expanding the addressable budget
        - Diligence typical pharma procurement cycle length and contract size for AI R&D tools
      - - Divergent sizing methodologies (2.6x gap on AI-drug-discovery estimates; two agentic-AI estimates within 8%)
        - constraint (diligence)
