  - id: FE004
    title: Product maturity / capability map
    type: matrix
    layout: wide
    summary: >-
      Adjacent systems demonstrate pieces of Mirendil’s thesis, while Mirendil-specific public maturity remains concept
      or undisclosed.
    data:
