      - number: '5.6'
        title: Trust, quality, and technical risk
        blocks:
          - type: paragraph
            body: >-
              The most material product risk is not whether an agent can produce plausible research artifacts; it is
              whether Mirendil can make those artifacts reproducible, safe, non-hallucinated, non-gamed, and useful to
              external scientists. The AI Scientist and FunSearch literature both emphasize the need for evaluators,
              reproducibility, sandboxing, and guardrails around LLM-generated code. AlphaFold 3 shows how a science
              model can reach major impact when outputs are benchmarked against domain-specific structures and
              accompanied by confidence/error measures, but that standard is not visible at Mirendil. The adverse
              evidence is sharp: Berkeley’s benchmark audit reports that many AI evaluations can be exploited, including
              with fake scores or answer leakage, and Gartner warns that many agentic AI projects remain early
              experiments with unclear value and inadequate risk controls. Mirendil has disclosed no trust center, eval
              governance, data-rights policy, or scientific validation protocol, so technical diligence should treat
              reliability as an unresolved blocker.
