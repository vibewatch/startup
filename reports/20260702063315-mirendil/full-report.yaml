            body: >-
              The public comps most relevant to Mirendil’s financial diligence do not validate a simple high-margin,
              self-serve software curve. Recursion’s 2025 filing shows $74.7 million of revenue, no product sales,
              $475.3 million of R&D expense, $644.8 million of net loss, and $753.9 million of cash and restricted cash.
              Schrödinger is more commercially mature, with $255.9 million of 2025 revenue, $199.5 million of software
              revenue, $56.4 million of drug-discovery revenue, and a 74% software gross margin, yet it still reported a
              $103.3 million net loss. Isomorphic’s Lilly collaboration shows the partner model can include a $45
              million upfront payment and potential milestones up to $1.7 billion, but milestone-heavy economics are
              probability-weighted and back-ended. These examples are not direct proxies for Mirendil’s frontier AI R&D
              platform, but they keep the analysis grounded: AI-for-science revenue can be real, yet losses,
