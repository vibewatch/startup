  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: a category still defined by adjacent markets, not by itself'
        blocks:
          - type: paragraph
            body: >-
              No analyst firm currently sizes a market specific to frontier-lab-grade, cross-domain AI
              research-automation platforms -- the category Mirendil says it occupies. Instead, the addressable
              opportunity is bounded by at least three overlapping, differently-scoped commercial categories plus two
              large status-quo budget pools. Grand View Research's "AI in drug discovery" definition covers software and
              services for molecular screening, target identification, drug optimization, de novo design, and
              preclinical testing sold to pharma, biotech, and contract research organizations. Mordor Intelligence's
              "agentic AI market" is far broader and mostly non-scientific, spanning customer service, IT,
              manufacturing, and financial-services automation across every industry. Dimension Market Research
              separately sizes an "autonomous chemical laboratory" market covering physical lab robotics, closed-loop
              experimentation hardware, and orchestration software -- the closest analog to Mirendil's stated ambition
              to redesign the physical-plus-computational research loop. Behind all three sits the status-quo substitute
              Mirendil-style tools must ultimately augment or displace: global pharmaceutical R&D spending of roughly
              $288 billion in 2024, with Europe alone reporting about €55 billion, plus a separate and currently
              shrinking pool of US federal science funding. None of these five lenses is Mirendil's market; each is only
              a bounding proxy.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM001
