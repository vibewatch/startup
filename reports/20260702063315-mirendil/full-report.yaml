      - number: '2.4'
        title: 'Adoption path: why dollar forecasts run far ahead of real deployment'
        blocks:
          - type: paragraph
            body: >-
              The gap between headline market forecasts and observed adoption is the single most important adoption
              constraint for any vendor selling autonomous AI systems into research workflows. McKinsey's November 2025
              global survey (1,993 respondents, 105 countries) found 62% of organizations at least experimenting with AI
              agents, but only 23% scaling any agentic use case and no more than 10% scaling within a single business
              function. Gartner goes further, forecasting that more than 40% of agentic AI projects will be canceled by
              the end of 2027 on escalating cost, unclear business value, or inadequate risk controls, and estimates
              that of thousands of vendors marketed as "agentic AI," only about 130 deliver genuine autonomous
              capability -- the rest is "agent washing." A companion Gartner-sourced survey of over 3,400 professionals
              found only 19% reporting significant investment in agentic AI as of January 2025, with 42% investing
              conservatively and 31% still undecided. Layered on top of this general enterprise caution is a
              science-specific trust problem: Nature's 2026 reporting on AI's footprint in scientific journals,
              preprints, and peer review describes a "rapidly evolving" but still poorly measured situation, and
              independent commentary cites a Columbia University audit finding roughly 1-in-277 PubMed-indexed papers in
              2026 contained AI-hallucinated or fabricated citations, prompting arXiv to adopt a 2026 policy banning
              unverified AI-generated content. Any AI-for-science vendor -- Mirendil included -- must clear this
              credibility bar before buyers will pay for autonomously generated research output.
            claimRefs:
              - CM039
              - CM040
              - CM041
              - CM042
              - CM022
              - CM049
          - type: figure
            figureRef: FM004
            claimRefs:
              - CM039
              - CM040
              - CM022
      - number: '2.5'
        title: Growth drivers, adoption constraints, and unresolved sizing gaps
        blocks:
          - type: paragraph
            body: >-
              Several forces push adoption forward. Stanford's 2026 AI Index reports global private AI investment more
              than doubled in 2025 (+127.5% year-over-year), and major cloud providers are hitting record infrastructure
              spend -- Google alone reported over $150 billion in 2025 annual capex -- which underwrites the compute
              frontier labs need. Pharma cost pressure compounds this: ZS estimates new US tariffs could add $13-19
              billion in industry costs and that the largest pharma companies need to cut roughly $32 billion in
              expenses by 2030, incentivizing substitution toward AI tooling that Excelra says is already cutting
              discovery timelines 40-50% at AI-native biotechs with the strongest hybrid business models. Working
              against this, Epoch AI's data shows frontier training compute growing 5x per year since 2020, training
              cost climbing about 3.5x annually, and power demand doubling yearly -- a capital-intensity constraint that
              requires continuously rising commitments well beyond a single $200 million seed round. Federal science
              funding is simultaneously being cut and carved out for AI: the FY2026 NSF budget request would cut total
              NSF funding by 56.9% (to $3.9 billion from $9.06 billion enacted) even as AI is one of the only areas
              prioritized for increased investment, and the Computing Research Association warned the broader cuts would
              "turn back the clock more than 20 years" on US research capacity. None of this resolves two material
              diligence gaps: no bottoms-up estimate exists for what share of the ~$288 billion pharma R&D budget (plus
              adjacent materials/chemicals R&D) a cross-domain platform could realistically capture, and it is not
              publicly known whether Mirendil's own roadmap includes physical self-driving-lab integration or stays
              software-only -- a choice that determines which of the sizing lenses above actually applies.
            claimRefs:
