      - number: '3.4'
        title: Substitutes, status quo, and internal build
        blocks:
          - type: paragraph
            body: >-
              The status quo is formidable because scientific R&D buyers do not need to buy a new lab platform to make
              progress. Pharmaceutical companies, universities, and industrial labs can continue to pair human
              scientists with CROs, existing modeling suites, data providers, robotics labs, and general-purpose LLMs.
              NVIDIA’s healthcare stack shows that open models, SDKs, microservices, and GPU-accelerated pipelines are
              increasingly available to teams that want to build internally, and Anthropic’s chemistry work shows that a
              general-purpose frontier model can already assist with concrete analytical chemistry tasks. Gartner’s
              warning on agentic AI is relevant because many buyers may respond to hype by narrowing deployments to
              high-ROI workflow components rather than adopting ambitious autonomous-agent platforms. For Mirendil, the
              substitute threat is not only a named competitor; it is a procurement choice to buy compute, tools, and
