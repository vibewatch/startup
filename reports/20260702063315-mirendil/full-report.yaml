      - number: '6.4'
        title: Status Quo Substitutes and Procurement Friction
        blocks:
          - type: paragraph
            body: >-
              Scientific R&D buyers are not compelled to adopt an unproven autonomous AI-R&D platform; they can continue
              pairing human scientists with CROs, existing modeling suites, data providers, and general-purpose LLMs
              such as Anthropic's chemistry-assistance work or the NVIDIA developer stack. Adoption research reinforces
              how hard the alternative path is: McKinsey's November 2025 global survey found 62% of organizations are at
              least experimenting with AI agents but only 23% are scaling any agentic use case, ZS's 2026 pharma/biotech
              survey found only 17% of technology executives report measurable AI value specifically in research and
              discovery, and Gartner forecasts more than 40% of agentic AI projects will be canceled by the end of 2027
              on cost, unclear value, or risk-control grounds. MIT NANDA's 2025 State of AI in Business research, drawn
              from over 300 disclosed AI initiatives and interviews with 52 organizations, found that roughly 95% of
              enterprise generative-AI pilots fail to scale into production. Procurement mechanics differ by buyer:
              universities typically run vendor security and privacy reviews using EDUCAUSE's HECVAT toolkit, while
              pharma and biotech buyers structure deals as multi-quarter milestone-based collaborations rather than
              software sales cycles, as the Isomorphic Labs and Recursion precedents show. Mirendil has published no
              trust, security, or compliance page, which would be a prerequisite for clearing either pathway once it has
              a product to sell.
