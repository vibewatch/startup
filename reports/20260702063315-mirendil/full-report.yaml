      - - Customer / design partners
        - Signed LOIs, pilot terms, usage logs, renewal intent, and user profiles.
        - External pull separates platform value from internal lab tooling.
        - CEO and GTM owner; customer reference calls under NDA.
      - - Commercial model
        - Pricing, target buyer, deployment mode, services load, and gross-margin path.
        - A $1B entry needs evidence that scientific users can become economic customers.
        - Finance and product leads; review model scenarios and contract templates.
      - - Compute and burn
        - Committed compute, cloud/NVIDIA terms, hiring plan, monthly burn, and runway.
        - Compute and talent markets can consume a large seed before proof.
        - CFO/operations diligence; inspect vendor agreements and board budget.
      - - Cap table and structure
        - Ownership, option pool, SAFEs, debt, liquidation preferences, pro rata, and side letters.
        - Downside and follow-on economics depend on structure as much as headline valuation.
        - Legal counsel and lead investors; review charter and financing docs.
      - - Governance
        - Board composition, protective provisions, information rights, and founder vesting.
        - High-price pre-product rounds require stronger oversight than public materials reveal.
        - Company counsel and board observers; request governance package.
      - - Security / research integrity
        - Data controls, experiment provenance, model-evaluation policy, and misuse mitigations.
        - Scientific automation must be auditable and safe to earn trust.
        - Security/ML governance review plus independent red-team scope.
      - - Exit and follow-on path
        - Next-round milestones, likely insider support, strategic partner interest, and IPO/M&A analogs.
        - The entry only works if the company can clear a materially higher financing or strategic value gate.
        - IC owner; map investor reserves and strategic partner diligence.
    notes: >-
      The asks prioritize evidence that can change the recommendation; each is material to whether expensive becomes
