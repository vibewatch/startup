              blue-chip investor sponsorship, and a sector backdrop where capital is flowing aggressively into AI and
              AI-for-science infrastructure. Carta and Crunchbase both show how concentrated 2026 venture capital has
              become around AI, and Lila and Periodic demonstrate that large science-AI financings are not isolated
