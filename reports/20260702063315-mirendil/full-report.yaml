        title: Product definition and delivery status
        blocks:
          - type: paragraph
            body: >-
              Mirendil’s public product is best understood as a claimed lab operating system for AI R&D, not a
              commercially delivered SKU. The company says it trains frontier models that are exceptional at AI research
              and redesigns the lab around them so the loop becomes faster, more capable, and more autonomous.
              Andreessen Horowitz gives the clearest module description: the system should propose experiments, write
              and run code, interpret results, debug failures, improve kernels, manage compute, compare checkpoints, and
              decide what to try next. That is a specific and valuable workflow, but none of Mirendil’s public surfaces
              disclose a demo, API, pricing page, customer deployment, benchmark pack, roadmap, security page, or
              documentation portal. The delivered object as of the run date is therefore a thesis and team-backed build
              plan, not a verified product asset.
