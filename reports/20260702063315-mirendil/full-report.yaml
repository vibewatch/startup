      - number: '2.3'
        title: Buyer, user, and payer segmentation across science domains
        blocks:
          - type: paragraph
            body: >-
              Pharma and biotech R&D organizations are the clearest identifiable buyer segment: Chief R&D/Digital
              officers control budget, bench and computational-biology scientists are the daily users, and the adoption
              trigger is typically a milestone-based partnership rather than a seat-license sale. Isomorphic Labs'
              January 2024 collaboration with Eli Lilly illustrates the pattern concretely -- $45 million upfront plus
              up to $1.7 billion in milestone payments and tiered royalties for a multi-target small-molecule program, a
              structure that looks far more like biotech partnership economics than enterprise SaaS. ZS's 2026 survey of
              115 pharma/biotech technology executives shows this segment is still early: only 17% report measurable
              value from AI investment in research and discovery specifically (versus 29% in clinical development), even
              though 41% are planning to automate entire R&D discovery workflows with agents. Materials-science and
              chemicals R&D is a second, more hardware-anchored segment served by autonomous-lab vendors. Government
              science agencies form a third, politically volatile segment where program managers control budget on
              behalf of academic PIs, and adoption depends on congressional appropriations rather than direct
              procurement. A fourth, easy-to-miss segment is frontier AI labs themselves -- Periodic Labs and Lila
              Sciences, Mirendil's closest comparables, currently fund this tooling from their own venture-backed
              compute budgets to accelerate their own research loop, and Lila's public messaging already signals an
              intent to sell externally, the same commercialization path Mirendil's mission implies but has not yet
              evidenced with a named customer.
            claimRefs:
              - CM023
              - CM024
              - CM025
              - CM026
              - CM027
