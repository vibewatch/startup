          - type: callout
            title: Adoption lags dollar forecasts by a wide margin
            body: >-
              Multi-billion-dollar agentic-AI market forecasts coexist with McKinsey survey data showing no more than
              10% of organizations scaling agents in any one function, and Gartner's forecast that over 40% of agentic
              AI projects will be canceled by 2027. Revenue realization for Mirendil-style vendors is likely to arrive
              later and more unevenly than headline market-size figures imply.
            calloutType: insight
            claimRefs:
              - CM039
              - CM040
              - CM022
          - type: callout
            title: Buyer economics look like biotech partnerships, not enterprise SaaS
            body: >-
              The clearest disclosed payer pattern in this space -- Isomorphic Labs' milestone-based Eli Lilly deal, and
              the scale of capital raised by Periodic Labs and Lila Sciences -- resembles venture-backed biotech
              partnership economics far more than recurring enterprise software revenue. Diligence should test whether
              Mirendil's own commercialization plan assumes the same slower, milestone-based payer path.
            calloutType: assumption
