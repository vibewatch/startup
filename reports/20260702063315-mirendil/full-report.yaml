            body: >-
              The external benchmark landscape makes Mirendil’s goal credible enough to investigate but not mature
              enough to underwrite as solved. Sakana’s AI Scientist demonstrates an automated loop across idea
              generation, literature search, code, experiments, write-up, and review, yet its authors explicitly report
              limitations such as incorrect implementations, unfair comparisons, weak visual reasoning, numerical
              errors, unsafe process-spawning behavior, and the need for sandboxing. MLE-bench turns 75 Kaggle
              competitions into an ML-engineering evaluation and initially found the strongest setup reached Kaggle
              bronze level in only 16.9% of competitions. RE-Bench is closer to Mirendil’s target because it evaluates
              open-ended ML research engineering against human experts: agents can be very fast and strong in two-hour
              settings, but humans outperform at longer time budgets. SciCode, SWE-bench, and MLAgentBench further show
              that realistic scientific coding, software repair, and ML experimentation remain far from saturated. That
              state of the art argues for cautious feasibility, not product readiness.
