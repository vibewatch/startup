  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model is still a hypothesis, not an operating metric
        blocks:
          - type: paragraph
            body: >-
              Mirendil has not put a revenue model on the public record. Its official site and investor theses describe
              a frontier AI R&D system for AI builders and scientists, but they do not disclose a product SKU, pilot
              customer, list price, paid design partner, ARR, revenue, usage volume, or customer count. That matters
              because the natural monetization paths are meaningfully different: an enterprise research platform would
              look like software ACV and hosted compute margins; a drug-discovery or materials collaboration would look
              like upfront payments, milestones, royalties, and customer concentration; a managed scientific service
              would look like project revenue with lower software-like margin; and an internal-lab/IP model would defer
              monetization until assets or discoveries can be licensed. Public comparables make these paths plausible,
              but not proven for Mirendil. Schrödinger has a software-plus-drug-discovery model; Isomorphic has a pharma
              collaboration model; Recursion has collaboration revenue but no product sales. Mirendil currently
              discloses none of those financial primitives, so the revenue bridge should be treated as a diligence
              framework rather than forecast evidence.
