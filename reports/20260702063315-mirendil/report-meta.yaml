coverageNotes: |
  Mirendil is roughly one month into public existence as of the run date. It has disclosed
  no product, no benchmarks, no roadmap, no revenue, no customers, and no governance or
  legal-entity detail. All figures beyond the $200M seed, ~$1B valuation, and 20-person
  founding team are unavailable from public sources. This report relies on official company
  and investor materials (Mirendil, a16z, Kleiner Perkins), independent launch coverage,
  founder self-disclosure (CV, scholar records), comparable AI-for-science labs used as
  market analogs, and third-party market/regulatory data. Commercial and technical claims
  are company thesis rather than verified maturity; treat forward-looking judgments as
  private-diligence dependent.

