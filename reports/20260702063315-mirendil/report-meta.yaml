companyProfile:
  summary: |
    Mirendil is a San Francisco frontier AI lab that emerged publicly in late June 2026,
    founded in early 2026 by researchers who left Anthropic in late 2025. Co-founder and CEO
    Behnam Neyshabur previously co-led Anthropic's Discovery team and worked at Google on
    Blueshift, Minerva, and Gemini math/code reasoning (co-inventor of the SAM optimizer);
    co-founder and CTO Harsh Mehta built the first version of Anthropic's autoresearch
    platform and earlier worked at Google DeepMind. The company describes a recursive
    improvement loop — better models do better research, and better research produces better
    models — and wants to package a lab-grade autonomous research system for external
    scientists and domain experts. It raised a $200 million seed round at roughly a $1 billion
    valuation, described as one of the largest AI seed rounds yet disclosed, led by Andreessen
    Horowitz and Kleiner Perkins with NVIDIA participating. As of the run date Mirendil has
    disclosed only a 20-person founding team and no product, benchmarks, revenue, customers,
    or board composition.
  foundedDate: "2026-01-01"
  founders:
    - name: Behnam Neyshabur
      role: Co-Founder and CEO
      background: |
        Former co-lead of Anthropic's Discovery team (goal: an "AI Scientist/Engineer").
        Prior Google researcher on Blueshift, contributor to Minerva, and later Gemini math
        and code reasoning; co-inventor of the Sharpness-Aware Minimization (SAM) optimizer.
        Deep frontier-model and optimization pedigree directly relevant to Mirendil's thesis.
      claimRefs: [CO010, CO012, CO013, CO014]
    - name: Harsh Mehta
      role: Co-Founder and CTO
      background: |
        Former Anthropic researcher who built the first version of Anthropic's autoresearch
        platform and initially scaled it as a team of one. Prior Google DeepMind and
        optimization-research experience. Provides direct execution experience for the
        automated AI-R&D and lab-systems thesis.
      claimRefs: [CO011, CO015, CO016]
    - name: Shayan Salehian & Tara Rezaei
      role: Founding engineers / early bench
      background: |
        Investor materials name Shayan Salehian (ex-xAI and X/Twitter ML) and Tara Rezaei
        (MIT graduate, ex-OpenAI researcher) among the founding bench. Part of a disclosed
        20-person founding team drawn from Anthropic, xAI, Google DeepMind, and OpenAI.
        Formal titles and org scope are not publicly disclosed.
      claimRefs: [CO017, CO018, CO003]
  foundingLocation: "San Francisco, CA, USA"
  headquarters: "San Francisco, CA, USA"
  productSummary: |
    No public product, SKU, benchmark, demo, or roadmap has been released as of the run date.
    Mirendil describes (at the thesis level) frontier models specialized for AI research and
    an autonomous research loop spanning experiment design, coding, debugging, compute
    management, and checkpoint comparison, intended first for AI researchers and engineers
    and later for scientists in biology, chemistry, materials science, drug discovery, and
    robotics. All product/technical descriptions are company-claimed rather than verified.
  customerFocus: "AI researchers and engineers first; later scientists and R&D teams in biology, chemistry, materials science, drug discovery, and robotics"
  businessModel: "Undisclosed and pre-commercial; no pricing, revenue model, or contracts publicly documented"
  stage: Seed
  fundingStatus: "$200M seed announced June 2026 at ~$1B valuation, led by Andreessen Horowitz and Kleiner Perkins with NVIDIA participating; March 2026 coverage had reported a ~$175M target at the same valuation"
  claimRefs: [CO001, CO010, CO011, CO004, CO007]

summary:
  headline: |
    Mirendil pairs an elite ex-Anthropic/Google founding team and top-tier backing (a16z,
    Kleiner Perkins, NVIDIA) with a ~$1B seed valuation despite no product, no benchmarks,
    no revenue, and no customers. The talent-and-thesis case is real; the price is
    underwritten almost entirely on founder pedigree and TAM. Research-more / track at the
    current reported price; re-evaluate after the first technical proof points and
    design-partner evidence appear.
  overallScore: 4.5
  recommendation: research-more
  confidence: low
  riskRating: high
  valuationStance: expensive
  keyMetrics:
    valuationUsdM: 1000
    revenueRunRateUsdM: null
    arrUsdM: null
    revenueGrowthYoYPct: null
    grossMarginPct: null
    nrrPct: null
    totalRaisedUsdM: 200
    customerCount: null
    headcount: 20
  topStrengths:
    - "Elite founder-market fit: CEO Behnam Neyshabur (ex-Anthropic Discovery co-lead; Google Minerva/Gemini; SAM optimizer) and CTO Harsh Mehta (built Anthropic's first autoresearch platform) are directly from the frontier the company targets"
    - "Exceptional seed capitalization: $200M is one of the largest AI seed rounds yet disclosed, giving multi-year runway to build compute-heavy lab infrastructure before revenue pressure"
    - "Top-tier validation: Andreessen Horowitz and Kleiner Perkins co-leading with NVIDIA participating signals conviction and potential compute/hardware synergies for scientific AI"
    - "Large, real tailwind: AI-for-science and agentic-AI markets are expanding fast (agentic AI ~42% CAGR to 2031; AI-in-drug-discovery double-digit CAGR), and automated R&D is a credible frontier direction"
    - "Focused 20-person founding bench drawn from Anthropic, xAI, Google DeepMind, and OpenAI concentrates scarce frontier-ML talent"
  topRisks:
    - "Pre-product, pre-revenue at a ~$1B valuation: essentially all value rests on unproven thesis and founder pedigree, with no benchmark, demo, or customer to underwrite the price"
    - "Key-person concentration: credibility and execution depend heavily on Neyshabur and Mehta; no disclosed succession, board, or governance layer"
    - "Crowded, well-funded field: Periodic Labs ($300M seed, ~$7B target), Lila Sciences ($550M raised), Isomorphic Labs (DeepMind, Lilly/Novartis deals), and incumbents already have capital, revenue, or partnerships Mirendil lacks"
    - "Technical/reliability risk: agentic AI reliability and LLM hallucination remain unsolved for rigorous scientific work; Gartner projects >40% of agentic-AI projects canceled by 2027"
    - "Valuation/down-round and AI-bubble exposure: an unproven unicorn seed is vulnerable to a reset if capital markets tighten or milestones slip"
    - "Macro buyer headwind: proposed FY2026 U.S. NSF budget cuts could pressure public-science R&D budgets that ultimately fund scientific-AI adoption"
  unresolvedGaps:
    - "Product and technical proof: no public benchmarks, evaluation methodology, demo environment, or roadmap for the autonomous AI-R&D system"
    - "Revenue, pricing, and commercialization: no revenue model, pricing, pipeline, design partners, or customer evidence of any kind"
    - "Governance and cap table: no public board composition, investor rights, voting control, secondaries, or legal-entity detail"
    - "Burn and runway: $200M raised but monthly burn (compute + elite talent comp) is undisclosed, so runway cannot be estimated"
    - "Headcount and footprint beyond the 20-person founding team, hiring plan, and office network are undisclosed"
    - "Regulatory posture: no disclosed classification or roadmap for EU AI Act / FDA exposure if Mirendil enters regulated scientific domains"

