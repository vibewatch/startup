  - type: conflicting-data
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Reconciliation of Grand View Research's and Precedence Research's roughly 2.6x divergent 2026 AI-in-drug-discovery
      market-size estimates.
    whyItMatters: >-
      Citing either number alone without the other would materially overstate or understate the size of the nearest
      disclosed adjacent market to Mirendil's biology/drug-discovery use case.
    diligencePath: >-
      Request each firm's underlying segment definitions and base-year methodology notes before citing either number as
      authoritative in a valuation model.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
