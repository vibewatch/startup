  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Board composition, investor rights, voting control, and legal entity disclosures for Mirendil.
    whyItMatters: >-
      A pre-product company with a unicorn seed valuation can materially change risk depending on founder control, board
      oversight, and investor protections.
    diligencePath: >-
      Request the cap table, board deck, certificate of incorporation, and side-letter summary from management or
      investors.
