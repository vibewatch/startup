  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      An independent analyst estimate sized specifically to frontier-lab-grade, cross-domain AI research-automation
      platforms -- not agentic AI broadly, not drug discovery narrowly, and not autonomous labs narrowly.
    whyItMatters: >-
      Without this, any TAM/SAM/SOM figure attached to Mirendil is necessarily a proxy built from adjacent markets that
      individually diverge by up to 2.6x, weakening any valuation model anchored to a single market-size number.
    diligencePath: >-
      Commission or request a bespoke bottoms-up sizing study anchored to the specific pharma, materials, and
      government-research sub-segments Mirendil can realistically serve.
    relatedQuestionRefs:
      - QM008
      - QM025
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: product-roadmap
    missingEvidence: >-
      Confirmation of whether Mirendil's roadmap includes physical self-driving-lab integration or stays
      software/agent-only.
    whyItMatters: >-
      This choice determines whether the smaller, slower-growing autonomous-lab lens or the larger, faster-growing
      agentic-AI lens is the more relevant sizing comparison, and it changes the capital intensity Mirendil will need
      going forward.
    diligencePath: >-
      Request Mirendil's product roadmap, hardware partnerships, and any lab-automation vendor relationships directly
      from the company during private diligence.
    relatedQuestionRefs:
