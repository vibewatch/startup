    severity: material
    topic: commercial traction
    missingEvidence: >-
      Any revenue, pilot, design-partner, waitlist, or customer proof that demonstrates Mirendil is more than a lab
      thesis.
    whyItMatters: >-
      The public valuation implies meaningful future commercial value, but no disclosed traction anchors that assumption
      today.
    diligencePath: >-
      Ask management for pipeline, design-partner agreements, pricing framework, and any internal commercialization
      milestones.
    relatedQuestionRefs:
      - QO013
