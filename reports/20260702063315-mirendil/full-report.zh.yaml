        title: 客户基础：未披露客户，四类可能买方
        blocks:
          - type: paragraph
            body: >-
              本章审阅的公开来源里，Mirendil 没有点名任何客户、试点用户或设计伙伴；官网、招聘页、投资人笔记和媒体报道只谈使命和创始团队，从未出现买方。缺少直接证据，下面的买方地图只能从 Mirendil
              自己的目标，以及同类 AI-for-science 厂商的实际变现方式推断。制药和生物技术研发组织是最清晰的参照：Isomorphic Labs 和 Recursion
              都通过按里程碑计费的合作切入这一客群，而不是卖席位许可；预算负责人通常是 Chief R&D Officer 或 Chief Digital
              Officer，日常用户是实验台科学家或计算生物学科学家。高校和学术实验室是第二类，实际付款方是通过安全审查采购流程支出的科研经费或基金会预算；Periodic Labs 公开的 Academic Grant
              Program 展示了一条可能入口，但 Mirendil 还没有复制。工业和材料科学实验室是第三类，最接近的同行案例是 Periodic Labs
              未披露名称的半导体制造商合作。第四类更具猜测性：其他实验室或大型企业的内部 AI 研究团队；但 Mirendil 自称要加速内部 AI 研发，这可能让它与本可销售的团队正面竞争。第五个类比是
              FutureHouse 等由慈善资金支持的非营利科学实验室，代表一种非商业付款模式；Mirendil 尚未表示会走这条路。
