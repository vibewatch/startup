        - 领域专属科学推理、物理湿实验室集成
        - 各行业企业 IT / 运营买方
        - 标题市场大得多，但大多不是科学；若直接套用，会暴露规模测算口径风险
      - - 自主 / 自驱动实验室硬件 + 软件
        - 实验室机器人、闭环实验平台、云实验室编排
        - 没有物理实验室控制的纯软件 AI 推理模型
        - 制药、化学和材料科学运营负责人
        - 与 Mirendil「构建系统的系统」论点最接近的物理实验室类比
