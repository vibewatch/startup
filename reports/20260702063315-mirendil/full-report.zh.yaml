      - number: '7.2'
        title: 监管与法律暴露
        blocks:
          - type: paragraph
            body: >-
              监管风险目前还不是单一审批阻断点，因为 Mirendil 没有披露已交付产品或受监管临床工作流。风险取决于路径。如果系统作为通用 AI 研究助手在欧洲销售，EU AI Act
              的透明度、版权、训练内容摘要和系统性风险义务可能变得相关；高风险部署在投放市场前，还需要风险管理、数据治理、日志、文档、人类监督、稳健性、网络安全和准确性控制。如果 Mirendil
              进入药物发现、医疗软件或临床决策支持，FDA 来源显示，AI 医疗器械和软件修改可能需要合适的上市前路径、生命周期管理，以及预先设定的变更控制计划。IP / 法律姿态同样重要。律所分析和 AI
              商业秘密案件表明，模型权重、训练数据、系统 prompt 和调优方法都是可转移资产；出身前沿实验室的创始人不能只靠声誉，必须证明 clean-room
              来源、离职认证纪律、监控和书面保密控制。没有确认到公开诉讼或认证记录，因此缓释仍是一条尽调路径，不是已证明的控制。
