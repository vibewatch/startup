  - id: TI004
    title: 资本充足性表
    columns:
      - 输入
      - 公开 / 估算值
      - 情景标签
      - 含义
      - 尽调要求
    rows:
      - - 种子轮所得现金余额
        - ~$200M 总融资背景；非受限净现金未披露
        - 公开融资事实 + 不可得的私人现金数据
        - 大额种子轮给了建设时间，但不能说明精确的现金流动性
        - 要求银行余额、受限现金、费用、托管款、预付算力和交割后资产负债表
      - - 月度现金消耗
        - 未知；示例情景使用每月 $3M、$5M 和 $10M
        - 仅为估算情景
        - 现金续航期敏感性主要由这个未披露输入决定
        - 要求过去三个月和董事会计划中的现金消耗，按工资、算力、资本开支、数据和 G&A 拆分
      - - 按 $3M/月计算的现金续航期
        - ~67 个月，未计费用和营运资本影响
        - 仅按种子轮总额估算
        - 若支出受控，足够支撑产品建设
        - 确认前沿 R&D 早期现金消耗是否真能维持在这一低位
      - - 按 $5M/月计算的现金续航期
        - ~40 个月，未计费用和营运资本影响
        - 仅按种子轮总额估算
        - 高薪实验室且算力投入显著时的基础示例情景
        - 用招聘计划、GPU 承诺和供应商预付款验证
      - - 按 $10M/月计算的现金续航期
        - ~20 个月，未计费用和营运资本影响
        - 仅按种子轮总额估算
        - 高现金消耗情景可能在收入证据扎实前就迫使融资
        - 要求下行情景计划、后续投资人储备和基于里程碑的支出闸门
      - - 计划资金用途
        - 算力、顶尖 AI 人才、平台 R&D、数据 / 评估系统，以及可能的科学工作流基础设施
        - 根据使命和成本基准推断
        - 资本密集是该策略的特征，不是偶发费用
        - 要求董事会批准的预算、供应商承诺、云抵扣额度和招聘计划
      - - 债务 / 项目融资义务
        - 公开未披露
        - 不可得的私人资本结构输入
        - 未识别公开债务包袱，但缺失披露不等于没有
        - 要求债务明细、设备融资、云预付款合同、认股权证和附函
      - - 下一轮触发条件
        - 可能是产品 / 基准测试 / 客户证明加算力续航；未披露
        - 推断的里程碑框架
        - 如果模型进展消耗现金却不能转化为收入，融资风险会上升
        - 要求里程碑预算、内部 KPI、储备政策和投资人按比例跟投承诺
    enumerationScope:
      coverage: partial
      basis: >-
        Frames capital adequacy around the public seed amount and scenario math; actual treasury, burn, debt, and board
        plan are private.
    notes: 现金续航期情景只是简单的总融资额计算：$200M 除以示例月度现金消耗；不是管理层指引。
