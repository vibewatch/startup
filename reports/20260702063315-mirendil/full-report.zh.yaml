      - number: '2.5'
        title: 增长驱动、采纳约束与未解规模缺口
        blocks:
          - type: paragraph
            body: >-
              几股力量正在推动采纳。Stanford 2026 AI Index 显示，2025 年全球私人 AI 投资同比增长 127.5%，已翻倍不止；主要云厂商基础设施支出创纪录——仅 Google 2025
              年年度资本开支就超过 $150B——为前沿实验室所需算力提供资金支撑。制药成本压力进一步放大这一动力：ZS 估计，美国新关税可能给行业增加 $13-19B 成本，最大型制药公司到 2030 年需要削减约 $32B
              费用；Excelra 称，混合商业模式最强的 AI 原生生物技术公司已经用 AI 工具把发现周期压缩 40-50%。反向压力也很强。Epoch AI 数据显示，前沿训练算力自 2020 年以来每年增长 5
              倍，训练成本每年约增 3.5 倍，电力需求每年翻倍——这种资本强度要求承诺持续上升，远超单笔 $200M 种子轮。联邦科学经费也在被削减并为 AI 划出特殊空间：FY2026 NSF 预算申请会将 NSF
              总经费削减 56.9%（从已通过的 $9.06B 降至 $3.9B），即便 AI 是少数被优先增加投资的领域之一；Computing Research Association
              警告，更广泛的削减会让美国科研能力“倒退 20 多年”。这些都没有解决两个实质尽调缺口：对于一个跨领域平台能现实捕获约 $288B 制药研发预算（外加邻近材料 /
              化学研发）的多大份额，没有自下而上的估算；外界也不知道 Mirendil 自己的路线图是否包含实体自动驾驶实验室集成，还是停留在纯软件——这个选择决定了上面的哪些规模测算视角真正适用。
