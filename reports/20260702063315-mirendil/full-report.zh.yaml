      - number: '7.5'
        title: 人员、执行、融资与客户转化风险
        blocks:
          - type: paragraph
            body: >-
              人员风险格外集中，因为公开故事高度依赖 Behnam Neyshabur、Harsh Mehta，以及来自 Anthropic、xAI、Google DeepMind 和 OpenAI 的 20
              人精英班底。CNBC 对人才战的报道说明，不能假定留才自然成立：大科技公司正为稀缺 AI 研究员支付异常高的薪酬包，帮助 Mirendil
              招人的同一个市场，也能把人才拉走。执行风险比普通创业不确定性更重，因为公开披露先展示使命、资本和履历，产品证明还没出现。TechCrunch 的种子轮估值分析称，AI
              种子轮投资人越来越早要求上线产品、用户、收入、分发和留存，高价格也减少了试错或转向空间。因此，Mirendil 约 $1 billion
              的估值放大了技术或客户里程碑失手的后果。客户风险目前仍主要是证据缺席：没有公开设计伙伴、生产部署、留存指标、定价或买方集中度数据。可执行的缓释措施，是一份绑定融资闸门的里程碑计划，明确负责人、留任包、proof-of-work
              演示和客户背调。
