      - number: '2.4'
        title: 采纳路径：为什么金额预测远远跑在真实部署前面
        blocks:
          - type: paragraph
            body: >-
              头部市场预测与观测到的采纳之间的差距，是任何把自主 AI 系统卖入研究工作流的供应商面临的最重要采纳约束。McKinsey 2025 年 11 月全球调查（1,993 名受访者、105 个国家）发现，62%
              的组织至少在试验 AI 智能体，但只有 23% 正在规模化任何智能体用例；在单一业务职能内规模化的比例不超过 10%。Gartner 判断更进一步，预测到 2027 年底，超过 40% 的智能体 AI
              项目会因成本上升、商业价值不清或风险控制不足而被取消；它还估计，在数千家自称“智能体 AI”的供应商中，只有约 130
              家真正具备自主能力，其余都是“智能体噱头包装”。叠加在一般企业谨慎之上的，是科学领域特有的信任问题：Nature 2026 年关于 AI
              在科学期刊、预印本和同行评审中足迹的报道，把局面描述为“快速演变”但仍缺乏充分测量；独立评论引用 Columbia University 审计，称 2026 年 PubMed 收录论文中约每 277 篇就有 1
              篇含有 AI 幻觉或伪造引用，促使 arXiv 在 2026 年采取政策，禁止未经验证的 AI 生成内容。任何 AI for Science 供应商——包括
              Mirendil——都必须先跨过这道可信度门槛，买方才会为自主生成的研究产出付费。
            claimRefs:
              - CM039
              - CM040
