      - number: '3.6'
        title: 护城河耐久性与负面结论
        blocks:
          - type: paragraph
            body: >-
              Mirendil 最可防守的潜在护城河，是一个在完整内部研究流程上训练出的闭环 AI
              研发系统，而不是给科学家套壳的通用聊天机器人。耐久性问题在于，公开证据尚未证明它拥有能让这类系统难以复制的稀缺资产：专有实验数据、商业伙伴工作流、经过验证的基准测试、信任 /
              合规资料，或进入科学预算的独家分发。多个负面信号指向相反方向。Sakana 明确预期，模型提供商和开放模型会持续改进并商品化基础层。Gartner 警告，许多智能体项目仍由炒作推动，若没有清晰
              ROI，存在取消风险。Excelra 认为，随着基础模型商品化，数据护城河比算法更重要；Big Tech 和领先制药公司也是直接竞争者或内部自建者。因此，承销结论应谨慎：如果 Mirendil
