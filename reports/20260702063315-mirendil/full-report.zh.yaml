              Mirendil 的技术依赖图谱异常集中。前沿 AI 研发模型需要大规模算力，Epoch 的超级计算机数据集显示，前沿 AI 系统正在转向庞大的私有集群，其性能、功耗和硬件成本都在快速扩张。NVIDIA 参投
              Mirendil 具有战略意义，因为 NVIDIA 控制核心加速计算基础设施，并发布研究资源、专有模型许可证和以 CUDA 为中心的代码库，这些都靠近 Mirendil
