  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与交付状态
        blocks:
          - type: paragraph
            body: >-
              Mirendil 的公开产品，最适合理解为一个声称用于 AI 研发的实验室操作系统，而不是已经商业交付的 SKU。公司称自己训练擅长 AI
              研究的前沿模型，并围绕这些模型重塑实验室，让闭环更快、更强、更自主。Andreessen Horowitz
              给出了最清晰的模块描述：系统应能提出实验、编写并运行代码、解释结果、调试失败、改进内核、管理算力、比较检查点，并决定下一步尝试什么。这是一个具体且有价值的工作流，但 Mirendil
              的所有公开界面都没有披露演示、API、定价页、客户部署、基准测试包、路线图、安全页面或文档门户。因此，截至本次报告日期，已交付对象是一个由命题和团队支撑的建设计划，而不是经过验证的产品资产。
