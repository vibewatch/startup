      - 来源状态
      - 投资测算含义
    rows:
      - - 平台订阅或企业许可
        - 未披露 / 未观察到标价
        - 席位数、用量上限、企业折扣、支持、安全和托管算力转嫁均未知
        - Mirendil 官方和投资人来源描述使命，不披露定价
        - 无法建模 ARR、ACV、NRR、CAC 回收期或软件毛利
      - - 研究合作合同
        - Mirendil 未披露；公开可比公司使用预付款、里程碑、版税和研究活动
        - 靶点数量、预付款规模、里程碑概率、排他性和报销安排未知
        - Schrödinger 和 Isomorphic 申报 / 公告显示类似结构
        - 只有审阅条款清单后，才使用概率加权的里程碑经济性
      - - 按用量计费的 GPU 或工作流费用
        - 未披露
        - 实际毛利取决于 GPU-hour 成本、调度、利用率，以及算力是包含在价格内还是转嫁
        - Lambda 和 NVIDIA 来源只能为输入类别提供基准，不代表 Mirendil 定价
        - 在算力采购和计费单位明确前，毛利无法用于投资测算
      - - 托管项目或服务费
        - 未披露
        - 折扣、人员杠杆、验收标准和 IP 所有权未知
        - 没有公开的 Mirendil 客户 SOW
        - 如果早期收入依赖创始人科学家的定制劳动，收入质量可能较低
      - - 内部科学资产的许可 / 版税
        - 未披露
        - 时间、开发风险、版税基数和合作方经济性未知
        - 可比药物发现申报显示这种模式，但不能证明 Mirendil 已采用
        - 作为上行情景可选性处理，而非基础情景收入
    enumerationScope:
      coverage: partial
      basis: >-
        Covers monetization mechanisms that could map to the public mission and comparable filings; it is not a company
        pricing sheet.
    notes: Mirendil 没有公开标价、实际成交价、折扣或合同收入；各行故意把缺失的公司数据与可比机制分开。
