chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、使命与当前定位
        blocks:
          - type: paragraph
            body: >-
              Mirendil 把自己定位为前沿 AI 实验室，而不是打包软件供应商。它的官网、Andreessen Horowitz 投资札记和 Kleiner Perkins 介绍，都指向同一个核心命题：打造极擅长 AI
              研发的系统，再围绕这些系统重塑研究闭环，让研究更快、更强、更自主。它的野心异常宽。Mirendil 并不瞄准单一垂直流程，而是称要让前沿 AI
              研发大众化，使从事生物、化学、药物发现、材料科学和机器人研究的科学家与领域专家，不必先把自己变成前沿 AI
              实验室。尽调中这个框架很关键：它把公司放在实验室级平台的位置，潜在上行巨大；但也意味着，当前公开产品披露主要还是使命叙事，并非带有基准、路线图节点或合同背书的可购买 SKU。
