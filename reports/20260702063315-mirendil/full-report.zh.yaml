      - - IP / 商业秘密来源
        - 外部律师备忘录和洁净室证据
        - 律师无法确认创始人 / 团队义务、数据来源，以及没有受限前雇主信息
        - 不要继续投资；视为打破投资论点的法律暴露
      - - 监管路径
        - 欧盟 / FDA 分类备忘录和具名合规负责人
        - 没有产品用途分类、没有合规负责人，或路径获批前提出受监管主张
        - 暂停受影响发布；要求董事会级监管整改
      - - 融资 / 估值
        - 资金期限、烧钱速度、内部投资方支持、下一轮证明标准
        - 下一轮融资在没有具名试点、基准证明或内部投资方支持的情况下启动，且估值高于证据支撑
        - 假设会降价轮 / 高稀释；将估值标记为偏高至昂贵
      - - 人才集中
        - 创始人留任、关键人物离职、招聘速度
        - 任一创始人离职、两名或以上具名技术负责人离开，或关键岗位空缺两个季度
        - 重新承销领导层风险，并要求接班证明
      - - 算力依赖
        - 预留产能、每项已验证科学任务成本、供应商冗余
        - 没有签署的算力计划，或单位成本范围不足以支撑路线图里程碑
        - 下调情景概率，并在扩大烧钱前要求供应商条款清单
      - - 客户转化
        - 具名设计伙伴、SOW、付费试点或可引用成果
