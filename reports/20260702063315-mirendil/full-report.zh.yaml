      - number: '7.4'
        title: 合作伙伴、依赖与市场传导风险
        blocks:
          - type: paragraph
            body: >-
              合作伙伴风险是一张依赖图，不是单一供应商问题。NVIDIA
              参与支持了算力故事，但也凸显加速器获取、云采购和前沿模型工具链上的集中度；这些资源可能稀缺、昂贵，或优先分配给更大客户。资本伙伴依赖同样有两面性：a16z 和 Kleiner Perkins
              的背书提升融资与招聘可信度，但 CB Insights 数据显示，2025 年和 2026 年 Q1 的 AI 融资变得头部化，巨额融资轮和模型开发者吸收了越来越高的资本份额。科学买方预算是另一条通道。CRS 和
              C&EN 描述了拟议的 FY2026 NSF 削减；如果落地，或在研究机构间形成回声，可能在 Mirendil 尝试商业化时挤压非药企买方预算。竞争性合作伙伴风险也高，因为 Periodic Labs、Lila
