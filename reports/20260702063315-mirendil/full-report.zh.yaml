  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 技术基准测试包显示自主 AI 研发闭环具备耐久性；首批 AI 构建者 / 科学用户转为设计合作伙伴；内部和战略投资人竞争跟投。
        - 示意估值在重大稀释前为 $3B-$6B；若后续融资干净，$1B 入场价的账面涨幅为 3x-6x。
        - 算力扩展、安全、可复现性，以及留住稀缺研究员。
        - 需要私下基准测试胜出、签约设计合作伙伴，以及可信的下一轮需求。
      - - 基准
        - 研究进展和招聘强劲，但商业证据有限，下一轮融资前也没有广泛外部产品。
        - 示意估值 $0.8B-$2B；入场上行有限，稀释或优先权之后可能持平。
        - 产品化延迟、收入模型不清，还需要更多资本。
        - 与当下公开证据最一致。
      - - 悲观
        - 基准测试不及预期，外部用户未转化，烧钱上升，或 AI 私募市场定价修正。
        - 示意估值 $0.2B-$0.7B；主要风险变成下轮降价、结构化过桥或人才收购。
        - 资本过剩、优先权堆叠、关键人物流失和市场倍数压缩。
        - 若尽调材料薄弱，或 12-18 个月内没有可衡量里程碑，就会触发。
    notes: 情景估值是基于阶段、稀缺可比对象和公开市场锚点给出的示意 $B 区间，不是管理层指引。
