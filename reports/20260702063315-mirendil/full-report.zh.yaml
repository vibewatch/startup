            body: >-
              最直接的竞争不是另一家种子阶段网站，而是一组试图打通推理到实验闭环的前沿 AI for Science 组织。Periodic Labs 是概念上最接近的同行：公开报道称其正在为材料和化学打造 AI
              科学家与自主实验室，已完成 $300M 种子轮，之后又被讨论为数十亿美元估值。Lila Sciences 同样有威胁，因为其官方材料称拥有先进 AI 与自主实验室，能够生成假设、运行实验并从实时数据中学习；其
