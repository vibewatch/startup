              最重要的产品风险，不是智能体能否生成貌似可信的研究产物；而是 Mirendil 能否让这些产物可复现、安全、无幻觉、难以被刷分，并且对外部科学家有用。AI Scientist 和 FunSearch
              文献都强调，需要评估器、可复现性、沙箱化，以及围绕 LLM 生成代码的防护栏。AlphaFold 3 显示，当输出用特定领域结构做基准测试，并配有置信度 / 误差指标时，科学模型可以产生重大影响；但
              Mirendil 看不到这个标准。负面证据很尖锐：Berkeley 的基准测试审计报告称，许多 AI 评测可以被利用，包括假分数或答案泄漏；Gartner 警告，许多智能体 AI
              项目仍是早期实验，价值不清且风险控制不足。Mirendil 没有披露信任中心、评测治理、数据权利政策或科学验证协议，因此技术尽调应把可靠性视为未解决的阻断项。
