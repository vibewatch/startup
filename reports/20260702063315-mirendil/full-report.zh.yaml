      - number: '2.2'
        title: 规模测算视角：三个重叠市场，没有单一 TAM
        blocks:
          - type: paragraph
            body: >-
              即便名义上是同一品类，公开规模测算也分歧很大。Grand View Research 估算 2026 年全球药物发现 AI 市场为 $2.9B，到 2033 年按 24.8% CAGR 增至
              $13.8B。Precedence Research 对同一名义品类的估算是 2026 年 $7.62B，到 2035 年按 9.90% CAGR 增至 $17.81B——2026 年数字约为 Grand
              View 的 2.6 倍；差距反映的是范围和基准年假设不同，而不是简单预测差异。智能体 AI 估算更接近：Mordor Intelligence 的 $9.89B（2026）和 Fortune Business
              Insights 的 $9.14B（2026）相差不到 8%，不过两者纳入的大多是非科学企业智能体。实体实验室层更小——Dimension Market Research 将 2026
              年全球自主化学实验室市场定为 $5.75B，到 2035 年按 14.5% CAGR 增至 $19.48B。Mirendil 的具体跨领域品类没有公开测算，因此最好的可用代理是投向可比公司的资本：到 2026
              年中，Mirendil（$200M 种子轮）、Periodic Labs（$300M 种子轮，正洽谈再融 $500M、估值 $7.5B）和 Lila Sciences（累计 $550M、估值
              $1.3B+）合计已披露超过 $1B 私募资本；与此同时，Excelra 估计过去十多年全行业 AI 药物发现累计投资超过 $20B。McKinsey 自己的采纳调查显示，真实部署远远落后于这些金额预测。
