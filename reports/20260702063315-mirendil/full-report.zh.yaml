  - id: TI005
    title: 公开财务缺口表
    columns:
      - 缺失的私人指标
      - 对投资测算的影响
      - 精确尽调路径
      - 严重性
    rows:
      - - 收入 / ARR / 订单额
        - 无法测试收入质量、估值倍数或牵引力
        - 要求月度已确认收入、订单额、递延收入、已签合同、管线，以及审计就绪的收入政策
        - 阻断
      - - 定价和包装
        - 无法区分订阅、用量、合作、服务或 IP 经济性
        - 要求定价备忘录、标价、折扣权限、试点定价和产品包装路线图
        - 阻断
      - - 客户和设计伙伴证明
        - 无法证明外部付费意愿，或从实验室论点转向市场需求的转化
        - 要求 NDA 下的已签客户名称、试点、LOI、设计伙伴范围和转化条款
        - 重大
      - - 算力承诺和有效 GPU 成本
        - 如果预留容量或资本开支很大，毛利和现金消耗可能错上数倍
        - 要求 GPU 合同、云抵扣额度、预留容量排期、利用率数据和取消条款
        - 阻断
      - - 工资和招聘计划
        - 顶尖 AI 人才能迅速把大额种子轮变成高固定现金消耗
        - 要求组织架构、已签录用通知、薪酬区间、留才包和 24 个月招聘计划
        - 重大
      - - 现金、受限现金、债务和附函
        - 仅靠融资总额无法验证现金续航期和下行保护
        - 要求交割后资产负债表、债务明细、认股权证、投资人附函和董事会批准的预算
        - 阻断
      - - 按工作流拆分的单位经济性
        - 无法按交付成本给工作流、合作或服务定价
        - 要求工作流级贡献毛利、算力分摊、支持时间、错误 / 返工率和客户 SLA 假设
        - 重大
      - - 里程碑或版税经济性
        - 可比上行可能后置且需概率加权，而不是当前收入
        - 要求合作分配瀑布、里程碑概率、靶点所有权、版税基数和终止权
        - 重大
    enumerationScope:
      coverage: partial
      basis: >-
        Enumerates the public financial diligence blockers that remain after reviewing official, filing, market, and
        adverse sources through 2026-07-02.
    notes: 该表有意以缺口为导向，因为公开证据不足以支撑标准收入和单位经济性投资测算。
    claimRefs:
