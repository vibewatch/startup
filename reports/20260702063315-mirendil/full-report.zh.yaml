companyProfile:
  summary: >
    Mirendil 是一家旧金山前沿 AI 实验室，2026 年 6 月底首次公开亮相，由 2025 年底离开 Anthropic 的研究员在 2026 年初创立。联合创始人兼 CEO Behnam Neyshabur 曾共同领导
    Anthropic 的 Discovery 团队，并在 Google 参与 Blueshift、Minerva 和 Gemini 数学 / 代码推理工作（Sharpness-Aware
    Minimization（SAM）优化器共同发明人）；联合创始人兼 CTO Harsh Mehta 搭建过 Anthropic 自动研究平台的第一版，此前任职 Google
    DeepMind。公司描述的是一个递归式改进闭环——更好的模型产出更好的研究，更好的研究又产出更好的模型——并希望把实验室级自主研究系统打包给外部科学家和领域专家使用。公司以约 $1B 估值完成 $200M
    种子轮，被称为迄今披露的最大 AI 种子轮之一，由 Andreessen Horowitz 和 Kleiner Perkins 领投，NVIDIA 参投。截至本次报告日期，Mirendil 只披露了 20
    人创始团队，没有产品、基准测试、收入、客户或董事会构成。
