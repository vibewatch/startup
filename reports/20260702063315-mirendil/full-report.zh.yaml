      - number: '7.3'
        title: 运营、安全与研究诚信风险
        blocks:
          - type: paragraph
            body: >-
              Mirendil 的产品承诺对质量失败格外敏感，因为用户预期会在科学和工程工作流里信任 AI 系统。研究诚信来源给出具体负面信号：数百篇 NLP 会议论文出现过幻觉引用，生物医学审计在 2026 年初
              PubMed 索引论文中发现每 277 篇就有 1 篇包含伪造参考文献，一项大型 arXiv 审计估计，2025 年主要研究库里共有 146,932 条幻觉引用。这些事实不能证明 Mirendil
              会失败，但它们让验证基础设施成为核心产品要求，而非锦上添花。Gartner 的取消预测还给出运营教训：成本、价值和风险控制没有在投产前落地，智能体就会失败。NIST 的 AI Risk Management
              Framework 提供了一套围绕可信设计、评估和持续风险管理的缓释模板。对 Mirendil
              来说，尽调应要求一套评测套件，在任何外部客户工作流依赖模型生成的科学输出前，先测试事实性、引用完整性、实验可复现性、安全边界、事件响应和人工批准点。
