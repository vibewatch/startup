        - 当前版本已有记录错误、安全问题，范式转移能力也不确定
      - - Google DeepMind / AlphaFold
        - 既有科学平台
        - Alphabet 支持的全球研究工具；披露结构数 200M+
        - 学术和非商业研究人员、蛋白质与生物分子科学用户
