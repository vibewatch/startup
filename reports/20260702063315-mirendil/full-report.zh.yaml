      - number: '7.6'
        title: 缓释措施、监测节奏与否决标准
        blocks:
          - type: paragraph
            body: >-
              尽调答案不是回避所有风险，而是定义哪些风险能靠证据消除，哪些风险应直接杀死论点。缓释应按风险传导到估值的顺序分阶段推进。第一，要求非公开技术证明：评测结果、对抗性科学任务、引用验证控制、可复现性检查和红队日志。第二，要求法律来源证明：创始人离职文件、IP
              转让链、引入发明审查、离职认证、模型 / 数据访问控制，以及外部律师关于前雇主暴露的备忘录。第三，要求监管分层：一棵书面决策树，区分内部研究工具、EU GPAI 义务、高风险 AI 用例、FDA 监管的软件 /
              设备用途，以及非临床药物发现工作流。第四，要求运营冗余：算力预留条款、多云故障切换、招聘管线、留任经济学和设计伙伴证据。否决标准必须刻意可衡量：没有可复现基准、没有干净 IP
              备忘录、没有可信合规负责人、没有点名外部试点，或在没有客户 / 产品证明的情况下尝试下一轮融资，都应把投资立场推向回避或大幅价格重置。
