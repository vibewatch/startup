              SKU、定价模型、安全资料包、集成接口、客户名单或基准测试套件。几家竞争对手已经披露更清晰的购买标准：Lila 欢迎商业伙伴；Recursion 有临床管线和上市公司投资者界面；Isomorphic 披露了与
