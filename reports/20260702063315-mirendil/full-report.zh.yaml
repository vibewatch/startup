  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 严重性框架与首要风险
        blocks:
          - type: paragraph
            body: >-
              Mirendil 在公开证据出现前就已融资，风险栈应从足以推翻论点到可管理依次排序。最高严重性风险是执行：官方和投资人来源描述的是一家前沿 AI 研发实验室和 20
              人创始班底，独立报道和负面评论仍显示没有公开产品、收入、客户、基准测试包或法律 /
              信任界面。由此形成一条狭窄的尽调标准：公司必须拿出非公开证据，证明自主研究闭环能在创始人控制的演示之外运转。第二类是技术与完整性风险，因为会编造引用、研究主张或实验理由的科学 AI，摧毁买方信任的速度会快过普通
              SaaS 缺陷。第三是融资 / 估值风险：风投数据显示资本集中到更少、更大的 AI 轮次，Gartner
              警告许多智能体项目会被取消，高种子轮价格也让转向空间变小。法律、监管、合作伙伴、人才和客户风险都重要，因为它们最终可能导向同一个结果：下一轮融资窗口前，没有可信的外部采用。
