  - id: TV006
    title: 最终尽调请求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 技术基准
        - 可复现评测套件、基线对比、失败模式和 demo 日志。
        - 估值押注的是技术不连续性，而不只是强团队。
        - 由 CTO 牵头技术尽调，并引入外部 AI 科学评审。
      - - 客户 / 设计合作伙伴
        - 签署 LOI、试点条款、使用日志、续约意向和用户画像。
        - 外部拉动把平台价值和内部实验室工具区分开。
        - CEO 和 GTM 负责人；在 NDA 下做客户访谈。
      - - 商业模式
        - 定价、目标买方、部署模式、服务负载和毛利率路径。
        - $1B 入场价需要证明科学用户能变成有经济价值的客户。
        - 财务和产品负责人；审阅模型情景和合同模板。
      - - 算力与烧钱
        - 已承诺算力、云 / NVIDIA 条款、招聘计划、月烧钱和 runway。
        - 在形成验证前，算力和人才市场可能吃掉大笔种子轮资金。
        - CFO / 运营尽调；检查供应商协议和董事会预算。
      - - 股权结构与条款
        - 所有权、期权池、SAFE、债务、清算优先权、按比例跟投权和 side letter。
        - 下行和后续融资经济性同样取决于条款，而不只是账面估值。
        - 法律顾问和领投方；审阅章程和融资文件。
      - - 治理
        - 董事会构成、保护性条款、信息权和创始人归属。
        - 高价产品前轮次需要比公开材料显示的更强监督。
        - 公司法律顾问和董事会观察员；索取治理包。
      - - 安全 / 研究完整性
        - 数据控制、实验来源、模型评测政策和滥用缓释。
        - 科学自动化必须可审计且安全，才赢得信任。
        - 安全 / ML 治理审查，加独立红队范围。
      - - 退出和后续融资路径
        - 下一轮里程碑、潜在内部支持、战略伙伴兴趣和 IPO / M&A 类比。
        - 只有公司能跨过明显更高的融资或战略价值门槛，入场才成立。
        - IC 负责人；梳理投资人储备和战略伙伴尽调。
    notes: 这些请求优先寻找能改变建议的证据；每一项都关系到「昂贵」能否变成「可忍受」或「回避」。
    claimRefs:
      - CV035
      - CV036
      - CV040
      - CV041
