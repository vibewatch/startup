            body: >-
              现在的退出准备度低。Mirendil 没有收入准备度，不具备申报准备度，也还没有充分战略性去风险，无法形成近期 M&A 或 IPO
              观点。最干净的正向路径是长期前沿实验室结果：用种子轮资金搭建一个能创造可展示研究加速的系统，再从内部人或战略算力与生命科学伙伴处以溢价融资。负向路径同样清楚：高种子轮估值、稀缺技术披露和宽使命，可能让公司卡在高前轮价格与不足以说服跨阶段或公开市场投资人的证据之间。公开可比公司让纪律可见。Recursion
              和 Schrödinger 有真实收入和申报文件，却仍表现出重 R&D 支出和亏损，因此不能假设后期公开市场会在没有证明时自动奖赏 AI-for-science 叙事。
