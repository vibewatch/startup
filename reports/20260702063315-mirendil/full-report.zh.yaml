  - id: TE002
    title: 工作流 / 用例表
    columns:
      - 用户任务
      - 当前工作流
      - Mirendil 拟议解决方案
      - 可衡量收益（声称 / 未证实）
      - 限制
    rows:
      - - ML 实验设计
        - 研究员头脑风暴假设、选择基线、实现变体，并手工跟踪运行
        - 智能体提出实验，并循环推进实现和结果解读
        - 声称可加快 AI-R&D 循环；Mirendil 没有给出量化提速的基准
        - 同类系统仍会做出错误实现和不公平比较
      - - 模型训练和检查点选择
        - 工程师调度任务、调超参数、看日志，并比较检查点
        - 自主循环把算力管理和检查点比较纳入研究周期
        - 可能减少浪费的 GPU 时间，并加快迭代
        - 未披露编排层、预算护栏或可复现的检查点证据
      - - 研究代码调试
        - 人类阅读追踪、修 bug、重跑实验并验证测试
        - 智能体编写并运行代码、调试失败，并使用评测反馈
        - SWE-bench 和 RE-Bench 表明，智能体能解决一部分真实编码任务
        - 基准仍耗资源，且容易受测试缺口或奖励黑客影响
      - - 面向领域专家的科学编码
        - 科学家把领域知识转成仿真或分析代码，通常还需要专业工程师
        - Mirendil 希望让专家不用具备前沿实验室能力，也能跑自己的实验
        - 可能扩大 AI 科学工具的使用面
        - SciCode 显示，真实科学编码对当前模型仍然困难
      - - 开放式发现循环
        - 人类定义问题、设计算法、验证输出并撰写论文
        - AI 系统生成想法、代码、实验、写作稿，并跑评审循环
        - AI Scientist 和 FunSearch 展示了部分样例
        - 没有证据表明 Mirendil 能从 AI-R&D 泛化到湿实验生物学、化学、材料或机器人
      - - 基准和评测治理
        - 团队维护留出测试、人类基线、安全审查和可复现包
        - Mirendil 需要围绕自主智能体搭建稳健的评测框架
        - 如果透明且未被污染，可能建立信任
        - 没有公开评测治理；外部审计显示 AI 基准可能被利用
    enumerationScope:
