        title: 替代方案、现状流程与内部自建
        blocks:
          - type: paragraph
            body: >-
              现状流程很强，因为科学研发买方不需要购买新的实验室平台，也能继续前进。制药公司、大学和工业实验室可以继续把人类科学家与 CRO、现有建模套件、数据提供商、机器人实验室和通用 LLM 配对。NVIDIA
              的医疗堆栈显示，开放模型、SDK、微服务和 GPU 加速管线正越来越容易被想要内部自建的团队取得；Anthropic 的化学工作也显示，通用前沿模型已经可以辅助具体分析化学任务。Gartner 对智能体 AI
              的警告相关，因为许多买方可能会面对炒作，转而把部署收窄到高 ROI 工作流组件，而不是采纳雄心勃勃的自主智能体平台。对 Mirendil
              而言，替代威胁不只是某个具名竞争对手；它也是一种采购选择：分别购买算力、工具和服务，同时把数据和实验判断留在内部。
