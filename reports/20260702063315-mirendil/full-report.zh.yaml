      - number: '5.2'
        title: 架构与运行闭环
        blocks:
          - type: paragraph
            body: >-
              Mirendil 架构的合理尽调模型有五层，每一层对公司自身仍未披露。第一层是专门面向 AI
              研发任务的前沿模型族或模型组合。第二层是智能体框架，用于规划实验、编辑代码、运行作业、读取日志并围绕失败循环。第三层是面向 GPU
              作业、内核、检查点和预算分配的算力编排。第四层是评测框架，用测试、分数、基线和人类预期来比较生成产物。第五层是面向科学家的领域界面，他们可能懂生物、化学、材料或机器人，但不懂前沿模型运维。这个架构不是从泛泛的“智能体”话术中编出来的；它贴合
              Mirendil 自身和投资人的描述，也得到 AI Scientist、FunSearch、MLAgentBench、MLE-bench、RE-Bench、SciCode 和 SWE-bench
              等开放系统佐证。缺口在于，所有 Mirendil 特定的实现选择仍是私密信息。
