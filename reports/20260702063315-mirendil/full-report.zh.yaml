    columns:
      - 论点
      - 证据方向
      - 什么会改变判断
    rows:
      - - 正方：精英级创始人-市场匹配
        - 创始人和创始团队来自前沿 AI 机构，正面契合自动化 AI R&D。
        - 若私人背调显示执行弱、留任差或创始人冲突，信念会下降。
      - - 正方：超大品类期权
        - 智能体 AI、AI 药物发现和自主实验室市场，均预计将在 2026 年基数上快速增长。
        - 如果用例坍缩为狭窄内部工具，TAM 应大幅折价。
      - - 正方：私人市场稀缺溢价
        - Thinking Machines、SSI、Mistral、xAI、Periodic 和 Lila 显示，投资者愿为稀缺前沿 AI 团队支付高溢价。
        - 私募 AI 估值回调，或下一轮可比融资失利，都会把立场从「昂贵」推到「回避」。
      - - 反向论点：缺少公开产品验证
        - 截至运行日，Mirendil 没有公开基准测试包、SKU、路线图、收入或客户数量。
        - 可复现 demo 和第三方基准测试套件，能补上最大的证据缺口。
      - - 反向论点：估值跑在基本面前面
        - 公司定价接近甚至高于已披露收入和文件的上市 AI 科学公司。
        - 更低入场价格、强优先权保护，或证明其能力处于同类领先的私下证据，才可能让价格变得可接受。
      - - 反向论点：炒作周期与执行风险
        - Gartner、Crunchbase、CNBC 和 WEF 的资料显示，智能体 AI 项目取消、AI 风险泡沫和估值修正都已引发担忧。
        - 若能证明烧钱克制、客户主动拉动、融资按里程碑推进，风险会下降。
    notes: 这些论点把前文运营章节、估值可比对象和负面市场证据合并判断。
