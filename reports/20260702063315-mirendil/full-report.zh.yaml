  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 最终建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              建议是跟踪 Mirendil，只通过有条件的继续研究路径推进，而不是按报道中约 $1 billion 的投后估值直接买入。最强证据确实存在：Mirendil 自称 a16z 和 Kleiner Perkins
              领投 $200 million 种子轮，NVIDIA 参与；独立报道也称这笔融资估值 $1 billion；创始人的前沿 AI
              研究资历异常匹配。承销问题在于，公开基本面撑不起这个价格。没有披露收入、客户数量、基准测试包、路线图、股权结构表、清算优先栈或董事会材料。只有在非公开尽调证明其技术系统有阶跃式突破、首批用户可信，并且跑道足以支撑它在没有惩罚性结构的情况下，以高得多的价格进入下一轮时，$1
              billion 的入场价才可能合理。
