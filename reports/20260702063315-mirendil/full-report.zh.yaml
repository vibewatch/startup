      - 可监测触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 执行 / 产品证明
        - 外部可复现基准，或投资者观察任务下的私人演示
        - 种子轮交割后两个季度内，没有可信基准、演示或试点证据
        - 暂停后续投资；要求价格重设，或在产品证明出现前回避
      - - 科学诚信
        - 盲测任务中的虚假引用、虚假主张或不可复现实验比例
        - 重大幻觉仍高于约定阈值，或核心主张无法验证
