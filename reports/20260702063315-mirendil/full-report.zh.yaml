        title: 上市和后期可比公司提醒：不要假设干净的软件经济性
        blocks:
          - type: paragraph
            body: >-
              与 Mirendil 财务尽调最相关的上市可比公司，并不支持一条简单的高毛利、自助式软件曲线。Recursion 2025 年申报显示收入 $74.7M、没有产品销售、研发费用 $475.3M、净亏损
              $644.8M、现金及受限现金 $753.9M。Schrödinger 商业成熟度更高，2025 年收入 $255.9M，其中软件收入 $199.5M、药物发现收入 $56.4M、软件毛利率
              74%，但仍报告净亏损 $103.3M。Isomorphic 与 Lilly 的合作显示，伙伴模式可以包括 $45M 预付款和最高 $1.7B
              潜在里程碑，但以里程碑为主的经济学需要按概率加权，且回款靠后。这些例子不是 Mirendil 前沿 AI 研发平台的直接代理，但能让分析保持落地：AI for Science
              收入可以真实存在，但亏损、集中度、长周期和资本强度往往仍是核心。
