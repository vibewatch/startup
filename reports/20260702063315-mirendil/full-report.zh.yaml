            body: >-
              Mirendil 的使命意味着其成本结构更接近前沿实验室，而不是传统轻量 SaaS 初创公司。公司必须支付顶级 AI
              研究员薪酬，运行或租用加速器，建设评测和实验基础设施，获取科学数据，并可能在任何收入抵消这些费用之前，支持特定领域实验室工作流。公开来源没有披露 Mirendil 的月度现金消耗、算力合同、云积分、GPU
              获取条款、实验室资本开支或招聘计划。外部基准显示了这一缺口的重要性：Epoch 估计全球 AI 算力已扩展到约等于 2,000 万块 H100，AI 资本开支正接近每年 $1T；arXiv
              前沿训练成本论文估计，算力最密集训练运行的摊销成本自 2016 年以来每年增长 2.4 倍；Lambda 公布了按 GPU 小时计价的 H100 和 B200 云价格。这些来源没有揭示 Mirendil
