  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 参考意义
      - 局限
      - 来源依据
    rows:
      - - Mirendil
        - 种子轮融资
        - 约 $200M 种子轮，投后估值约 $1B；简化计算下新投资人持股约 20%。
        - 直接锚定入场价格和稀释。
        - 没有公开产品、收入、技术基准、股权结构或治理细节。
        - Mirendil、SiliconANGLE、Cryptonomist。
      - - Thinking Machines Lab
        - 前沿 AI 种子轮可比对象
        - $2B 种子轮，估值 $12B；成立不到一年，且尚未披露具体在做什么。
        - 显示市场愿意把精英前沿 AI 团队定价到远高于普通种子轮的水平。
        - 泛前沿 AI，而非科学研发；由前 OpenAI CTO 领衔，是极端离群案例。
        - TechCrunch、TechFundingNews。
      - - Safe Superintelligence
        - 前沿 AI 私募可比对象
        - 据报融资 $2B，估值 $32B；网站 / 产品信息仍很稀疏。
        - 显示投资人能在产品披露前，因顶级 AI 创始人履历支付极高价格。
        - 安全 / 超级智能使命，不是 Mirendil 的 AI 科学商业化路径。
        - TechCrunch 及市场综述来源。
      - - Periodic Labs
        - AI 科学 / 材料可比对象
        - $300M 种子轮；据报后来讨论约 $7B 估值，并已有半导体客户牵引。
        - 在自主实验室和材料发现方向上，是最接近的私募 AI 科学稀缺可比对象。
        - 实体实验室模型和客户牵引可能比 Mirendil 的公开证据更具体。
        - TechCrunch、TechFundingNews。
      - - Lila Sciences
        - 自主科学工厂可比对象
        - $350M A 轮；累计融资 $550M；已描述首批客户群和 AI Science Factories。
        - 显示资本强度和面向客户的科学超级智能叙事。
        - Flagship 孵化的平台，公开商业化表述比 Mirendil 更多。
        - Lila 官方、Fierce Biotech。
      - - Isomorphic Labs
        - 战略药企合作
        - 与 Lilly 合作的预付款 $45M，总潜在价值最高 $1.7B。
        - 里程碑经济学展示 AI 科学平台变现的一条路径。
        - Alphabet 支持的药物发现，与 Mirendil 的宽口径实验室平台不同。
        - Isomorphic Labs PRNewswire、市场分析来源。
      - - Recursion Pharmaceuticals
        - 上市 AI 药物发现锚点
        - 2025 年公开流通市值 $2.03B；2025 年收入 $74.7M；研发 $475.3M；净亏损 $644.8M。
        - 给已有收入和监管文件的 AI 原生发现公司提供公开市场理性校验。
        - 上市 biotech 管线风险不同于 Mirendil 的产品前平台风险。
        - SEC 10-K、Recursion 文件证据。
      - - Schrödinger
        - 上市计算化学锚点
        - 2025 年公开流通市值 $1.12B；2025 年收入 $255.9M；研发 $173.1M；净亏损 $103.3M。
        - 显示公开市场会给有收入的计算发现平台估值，但要求纪律。
        - 成熟软件与药物发现混合业务，不是前沿 AI 种子轮实验室。
        - SEC 10-K、Schrödinger 文件证据。
      - - Mistral AI
        - 前沿模型实验室可比对象
        - CNBC 报道 2025 年估值 €11.7B；TechCrunch 报道 2026 年洽谈估值约 €20B。
        - 模型采用、主权叙事和战略资本汇合时，前沿实验室估值可以快速上行。
        - Mistral 有模型和采用信号；Mirendil 没有公开产品。
        - CNBC、TechCrunch。
      - - xAI
        - 规模化前沿 AI 可比对象
        - TechCrunch 报道 $20B Series E，X/Grok 月活用户约 600M。
        - 说明前沿模型基础设施需要的资本尺度。
        - 阶段、分发和风险画像都不可比。
        - TechCrunch、CNBC 人才战背景。
    enumerationScope:
