          label: 可比市场愿为稀缺性付溢价
        - id: n5
          label: AI 估值与智能体执行风险
        - id: n6
          label: $1B 入场价显得昂贵
        - id: n7
          label: 跟踪 / 继续研究，不买入
      edges:
        - from: n1
          to: n2
          label: 支撑关注
        - from: n2
          to: n4
          label: 匹配稀缺性可比公司
        - from: n3
          to: n6
          label: 削弱基本面支撑
        - from: n4
          to: n6
          label: 能解释价格，但无法证明
        - from: n5
          to: n6
          label: 提高安全边际要求
        - from: n6
          to: n7
          label: 推导立场
        - from: n3
          to: n7
          label: 设置尽调关口
    claimRefs:
      - CV001
      - CV002
      - CV024
      - CV026
      - CV035
      - CV036
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 重大尽调结果会怎样影响据报 $1B 入场价附近的公允私募估值。
    data:
      items:
        - label: 基准测试证明
          value: 1.5
          note: 强独立评估可能带来最大溢价。
        - label: 设计伙伴拉动
          value: 1
          note: 签约外部用户降低平台风险折价。
        - label: 算力 / 续航清晰度
          value: 0.4
          note: 已落实资源降低融资风险折价。
        - label: 干净交易结构
          value: 0.3
          note: 有利条款保护入场经济性。
        - label: 无产品证明
          value: -0.7
          note: 当前最大的公开证据折价。
        - label: AI 市场回调
          value: -0.8
          note: 可比公司压缩直接冲击下一轮概率。
        - label: 治理不透明
          value: -0.4
          note: 缺乏董事会 / 控制权细节，抬高代理风险。
    approximationNotes: 数值只是围绕 $1B 参考标记、以 $B 计的示意性调整，不是正式 DCF。
    claimRefs:
      - CV005
      - CV006
      - CV022
      - CV024
      - CV035
      - CV040
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 下一轮验证周期后，乐观、基准和悲观三种私募市场估值区间（$B）。
    data:
      items:
        - label: 悲观
          low: 0.2
          mid: 0.45
          high: 0.7
          note: 验证薄弱或市场压缩会带来降轮 / 结构化过桥风险。
        - label: 基准
          low: 0.8
          mid: 1.2
          high: 2
          note: 研究进展保住期权价值，但公开牵引有限，压住上调空间。
        - label: 乐观
          low: 3
          mid: 4.5
          high: 6
          note: 专有基准测试胜出和设计伙伴支撑稀缺性溢价。
    approximationNotes: 区间以十亿美元计，刻意给得很宽，因为公司仍处于产品前阶段且未上市。
    claimRefs:
      - CV012
      - CV013
      - CV014
      - CV016
      - CV018
      - CV021
      - CV037
      - CV038
      - CV039
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: IC 打分在市场规模和团队质量，与验证、经济性、风险、估值、证据质量之间取平衡。
    data:
      items:
        - label: 市场规模
          value: Strong
          score: 8
          note: 智能体 AI、AI 药物发现和自主实验室都在增长。
        - label: 创始人 / 护城河
          value: Strong
          score: 8
          note: 前沿 AI 领域的创始人与市场匹配，是最能支撑投资假设的优势。
        - label: 技术证明
          value: Unproven publicly
          score: 3
          note: 未披露基准测试或产品。
        - label: 客户证明
          value: Absent publicly
          score: 2
          note: 未披露收入、试点或客户数量。
        - label: 经济性
          value: Unmodeled
          score: 3
          note: 烧钱、算力条款和利润率模型均未公开。
        - label: 风险
          value: High
          score: 3
          note: 智能体 AI 项目取消和泡沫风险要求保持纪律。
        - label: 估值
          value: Expensive
          score: 2
          note: $1B 入场价远超公开基本面。
        - label: 证据质量
          value: Mixed
          score: 4
          note: 融资和团队已获交叉印证；价值驱动因素仍属私下信息。
    approximationNotes: 分数是 1-10 的尽调启发式评分，仅基于公开证据和当前私募市场可比标的。
    claimRefs:
      - CV001
      - CV002
      - CV022
      - CV026
      - CV027
      - CV028
      - CV033
      - CV035
      - CV036
