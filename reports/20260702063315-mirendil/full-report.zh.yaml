    rows:
      - - AI-for-science / 跨领域研究自动化平台（Mirendil 自称类别）
        - AI 模型、智能体工具和算力，专门用于设计、运行并解读生物 / 化学 / 材料领域实验
        - 通用湿实验室资本开支、与研发工作流无关的通用 LLM 聊天订阅
