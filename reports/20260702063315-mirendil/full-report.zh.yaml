  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局边界与替代类别
        blocks:
          - type: paragraph
            body: >-
              竞争集合应围绕买方要完成的任务来划定，而不是围绕 Mirendil 当前的公司标签。Mirendil 并不只是又一家模型公司；它试图帮助 AI
              构建者，并最终帮助科学家，把更多研究闭环掌握在自己手里。这个任务可以由 Periodic Labs、Lila Sciences、FutureHouse 和 Sakana AI 等直接“AI
              科学家”实验室承担；也可以由 Google DeepMind、Isomorphic Labs、Anthropic 和 OpenAI 等既有巨头承担；还可以由 Recursion、Insilico、Chai
              Discovery、Cradle 和 Schrödinger 等垂直 AI 药物发现和蛋白设计平台承担；NVIDIA 等基础设施供应商、制药或科技公司内部团队、CRO
              与人工实验科学，也都是替代路径；科学家还可以在通用 LLM 和专业工具之间多栖使用。这个宽边界对 Mirendil 不利，因为买方可以先采纳自动化组件，而不必等待一个端到端前沿实验室平台。
