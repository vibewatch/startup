              风险评级为高，因为主要承销变量都是非公开的。市场对更好科学研发的需求庞大且可信，但 Gartner 对 agentic AI 的警告、Crunchbase 的风险泡沫框架、CNBC 对估值恐惧的报道，以及
              World Economic Forum 的泡沫清算分析，都不支持把当前 AI 资本市场视为稳定出清价。Mirendil
              的特定风险被其吸引力来源放大：稀缺人才、昂贵算力、漫长技术闭环和宽平台野心。公司仍可能极其出色，但如果非公开尽调包不能显示基准优势、外部客户拉力、有纪律的烧钱、可防御权利，以及在没有过度清算优先权悬置的情况下，以显著更高估值进入下一轮的可信路径，投资论点就应迅速破裂。
