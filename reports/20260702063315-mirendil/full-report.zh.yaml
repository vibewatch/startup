  - id: TV005
    title: 破坏投资论点和终止触发器表
    columns:
      - 触发器
      - 阈值
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 技术验证失败
        - 没有私下基准测试或 demo 能证明自主 AI 研发表现超过强通用模型。
        - 削弱「闭环才是产品」这一核心主张。
        - 不要按当前价格投资；等可复现验证后再看。
      - - 客户拉动失败
        - 12-18 个月内没有签约设计合作伙伴、付费试点或可信外部用户管线。
        - 投资论点从平台公司变成内部研究实验室。
        - 只保留观察权敞口，或放弃。
      - - 现金 runway / 烧钱错配
        - 种子轮计划在形成实质验证前就需要再融一大轮，或依赖未承诺算力。
        - 制造下轮降价和优先权压顶风险。
        - 要求按里程碑分批拨款、更低入场价或保护性结构。
      - - 治理不透明
        - 董事会权利、投票控制、清算优先权或创始人归属无法通过尽调核实。
        - 在异常昂贵的产品前估值上抬高代理风险。
        - 在法律和股权结构包审完前阻断。
      - - 市场修正
        - 可比 AI 种子轮或前沿实验室估值明显压缩，或新一轮要求结构化条款。
        - 降低高溢价后续融资的概率。
        - 除非入场价实质重置，否则把立场从跟踪改为回避。
      - - 人才流失
        - 产品验证前，两位创始人任一离开，或多名核心研究员流失。
        - 损害正在承销的主要资产。
        - 除非有极强接班证据，否则视为投资论点破裂。
      - - 安全 / 完整性失败
        - 研究输出对科学用户而言不够可复现、可审计或安全。
        - 堵住客户信任和战略合作路径。
        - 暂停投资，直到控制和验证经过独立核实。
    notes: 这些触发器被设计成可监控的尽调关口，因为公开证据尚不足以支撑基于基本面的估值。
    claimRefs:
