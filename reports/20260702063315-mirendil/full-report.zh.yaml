        blocks:
          - type: paragraph
            body: >-
              外部基准测试格局让 Mirendil 的目标足够可信，值得调查，但还不成熟到可以按已解决问题承销。Sakana 的 AI Scientist
              展示了一个覆盖想法生成、文献搜索、代码、实验、撰写和评审的自动化闭环，但作者明确报告了限制，包括实现错误、不公平比较、弱视觉推理、数值错误、不安全的进程派生行为，以及对沙箱化的需求。MLE-bench 把 75
              场 Kaggle 竞赛转化为 ML 工程评测，初始结果显示最强配置只在 16.9% 的竞赛中达到 Kaggle 铜牌水平。RE-Bench 更接近 Mirendil 的目标，因为它用人类专家对照评估开放式 ML
              研究工程：在两小时设定中，智能体可以很快、很强，但时间预算拉长后人类表现更好。SciCode、SWE-bench 和 MLAgentBench 进一步显示，真实的科学编码、软件修复和 ML
              实验仍远未饱和。这个技术现状支持审慎的可行性判断，而不是产品就绪结论。
