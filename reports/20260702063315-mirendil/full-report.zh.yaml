  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：品类仍由邻近市场定义，而非自成一类
        blocks:
          - type: paragraph
            body: >-
              目前没有分析机构专门测算前沿实验室级、跨领域 AI 研究自动化平台市场——也就是 Mirendil
              自称所在的品类。相反，可服务机会只能由至少三个相互重叠、口径不同的商业品类，再加两个大型现状预算池来框定。Grand View Research 对“药物发现中的 AI”的定义，覆盖面向制药、生物技术和 CRO
              销售的分子筛选、靶点识别、药物优化、从头设计和临床前测试软件与服务。Mordor Intelligence 的“智能体 AI
              市场”宽得多，也大多不属于科学领域，横跨客户服务、IT、制造和金融服务自动化。Dimension Market Research
              另行测算“自主化学实验室”市场，覆盖实体实验室机器人、闭环实验硬件和编排软件——这是最接近 Mirendil 所称重塑物理 + 计算研究闭环的类比市场。三者背后还有 Mirendil
              式工具最终必须增强或替代的现状预算池：2024 年全球制药研发支出约 $288B，其中仅欧洲就约 €55B，另有一个独立且目前在收缩的美国联邦科学资金池。这五个视角都不是 Mirendil
              的市场；每一个都只是边界代理。
