            body: >-
              既有巨头不是以完全相同的定位攻击 Mirendil，而是从可信度、分发和证明入手。Google DeepMind 的 AlphaFold
              已经成为全球科学工具，拥有数亿个蛋白结构和数百万研究者；Isomorphic Labs 则把 AlphaFold 血统转化为药物发现合作，背后有 Alphabet 资源。Recursion 和 Insilico
              比 Mirendil 更窄，但在药物发现工作流上更成熟：Recursion 是 Nasdaq 上市的临床阶段 TechBio，拥有管线、合作和专有操作系统；Insilico 宣传 AI
              驱动管线和药物发现软件模块。Chai Discovery 和 Cradle 是抗体或蛋白工程中更窄的产品化切口，Schrödinger 则提供深植市场的分子发现物理软件。结论不是其中任何一家能取代
              Mirendil 的完整命题；而是每一家都可能在 Mirendil 发出已披露产品之前，先吸收预算、数据权利、信任和工作流所有权。
