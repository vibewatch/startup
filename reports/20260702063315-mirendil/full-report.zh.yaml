      - number: '2.3'
        title: 科学领域中的买方、用户和付款方分层
        blocks:
          - type: paragraph
            body: >-
              制药和生物技术研发组织是最清晰可识别的买方群体：首席研发 / 数字官掌握预算，实验台科学家和计算生物学科学家是日常用户，采纳触发点通常是基于里程碑的合作，而不是席位许可销售。Isomorphic Labs
              2024 年 1 月与 Eli Lilly 的合作具体展示了这种模式——$45M 预付款，加上最高 $1.7B 的里程碑付款和分层特许权使用费，用于多靶点小分子项目；这种结构更像生物技术合作经济学，而不是企业
              SaaS。ZS 对 115 名制药 / 生物技术高管的 2026 年调查显示，这一群体仍处早期：只有 17% 称 AI 投资在研究和发现环节产生了可衡量价值（临床开发为 29%），尽管 41%
              正计划用智能体自动化整个研发发现流程。材料科学和化学研发是第二个、更依赖硬件的群体，由自主实验室供应商服务。政府科学机构构成第三个、政治波动更大的群体，项目经理代表学术 PI
              掌握预算，采纳取决于国会拨款，而不是直接采购。第四个容易被忽略的群体是前沿 AI 实验室本身——Periodic Labs 和 Lila Sciences 是 Mirendil
              最接近的可比公司，目前用自己的风投资金支持的算力预算来建设这类工具，以加速自身研究闭环；Lila 的公开信息已经释放了对外销售意图，这条商业化路径也由 Mirendil 的使命所暗示，但 Mirendil
              尚未用具名客户证明。
