  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式仍是假设，不是运营指标
        blocks:
          - type: paragraph
            body: >-
              Mirendil 尚未把收入模式写入公开记录。其官网和投资人命题描述了一个面向 AI 构建者和科学家的前沿 AI 研发系统，但没有披露产品
              SKU、试点客户、标价、付费设计伙伴、ARR、收入、使用量或客户数。关键在于，自然变现路径差异很大：企业研究平台会表现为软件 ACV
              和托管算力毛利；药物发现或材料合作会表现为预付款、里程碑、特许权使用费和客户集中度；托管科学服务会表现为项目收入，软件式毛利更低；内部实验室 / IP
              模式会把变现推迟到资产或发现可以授权之后。公开可比公司让这些路径看起来合理，但没有证明 Mirendil 会走哪条路。Schrödinger 是软件 + 药物发现模式；Isomorphic
              是制药合作模式；Recursion 有合作收入但没有产品销售。Mirendil 目前没有披露这些财务基本项，因此收入桥应视为尽调框架，而不是预测证据。
