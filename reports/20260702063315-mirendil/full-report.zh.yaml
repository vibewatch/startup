  - id: TM004
    title: 增长驱动因素与约束表
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时间
      - 影响
      - 尽调问题
    rows:
      - - 前沿实验室 AI 投资激增（2025 年私营 AI 投资 +127.5%，Stanford HAI）
        - 驱动
        - 现在 - 2027
        - 可用于押注 AI for science 的资本更多，Mirendil 的 $200M 种子轮就是一例
        - 跟踪资金是集中到通用 LLM，还是流向科学专用平台
      - - 云 / 算力基础设施支出创新高（Google 2025 年 capex >$150B，Stanford HAI）
        - 驱动
        - 现在 - 2028
        - 扩展了前沿实验室及其供应商可调动的算力供给边界
        - 确认 Mirendil 自身路线图背后有哪些算力承诺（云额度、GPU 访问）
      - - 算力 / 训练成本膨胀（Epoch AI -- 算力 +5x/年、成本 +3.5x/年、电力每年翻倍）
        - 约束
        - 持续
        - 挤压任何实验室级研究平台的利润率 / 运营开支；也抬高可信竞争所需的资本强度
        - 尽调 Mirendil 的实际算力预算 / 承诺，相对于已融资的 $200M
      - - 企业智能体 AI ROI 不及预期（Gartner -- 到 2027 年，超过 40% 的智能体 AI 项目被取消）
        - 约束
        - 2026-2027
        - 买方怀疑可能拖慢「AI 科学家」工具的付费采用，即便技术上能跑
        - 索要试点转付费证据，而不只是 POC 数量
      - - AI 原生生物技术公司商业牵引（ZS -- 时间线加快 40-50%；Excelra -- 混合模式表现优于纯管线玩法）
        - 驱动
        - 现在
        - 只要包装得当，买方愿意为 AI 加速发现付费这一点得到验证
        - 尽调 Mirendil 打算走哪种商业模式 -- 平台 / SaaS、AI-first 生物技术公司，还是混合模式
      - - AI 专项之外的联邦基础研究经费削减（NSF 申请 -56.9%；CRA 政策评论）
        - 约束
        - FY2026 预算周期
        - 即便 AI 本身受优先支持，学术 / 政府采用路径和人才供给仍受到威胁
        - 跟踪最终国会拨款与申请额的差异
      - - AI 辅助科学中的可复现性 / 信任侵蚀（Nature；PubMed 假引文率 1/277）
        - 约束
        - 持续
        - 抬高外界对任何 AI 生成研究成果的审查强度，是「AI 科学家」供应商的声誉风险
        - 询问 Mirendil 对 AI 生成结果采用什么验证 / QA 流水线
      - - 制药成本压力与关税敞口（ZS -- $13-19B 关税成本，2030 年前约 $32B SG&A 削减）
        - 驱动（间接）
        - 2026-2030
        - 成本压力推动制药企业采用能缩短 R&D 周期 / 降低成本的 AI 工具，从而扩大可服务预算
        - 尽调 AI R&D 工具在制药企业的典型采购周期长度和合同规模
      - - 市场规模测算方法分化（AI 药物发现估算差距 2.6x；两个智能体 AI 估算相差在 8% 内）
        - 约束（尽调）
        - 持续
        - Mirendil 的精准品类还没有单一可信 TAM 数字；规模测算必须按多套口径推进
        - 委托自下而上的定制测算，锚定 Mirendil 现实可触达的制药 / 材料 R&D 预算
    notes: 方向 / 时间是作者对引用来源的综合判断，不是某一出版方的单一预测；「驱动（间接）」和「约束（尽调）」标记那些通过成本压力或证据不确定性起作用、而非直接作用于需求的因素。
