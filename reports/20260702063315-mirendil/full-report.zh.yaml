      - number: '6.4'
        title: 现状替代方案与采购摩擦
        blocks:
          - type: paragraph
            body: >-
              科学研发买方没有被迫采用尚未验证的自主 AI 研发平台；他们可以继续把人类科学家与 CRO、现有建模套件、数据提供商，以及 Anthropic 化学辅助工作或 NVIDIA 开发者栈这类通用 LLM
              搭配使用。采用研究进一步说明，另一条路有多难：McKinsey 2025 年 11 月全球调查发现，62% 的组织至少在试用 AI 智能体，但只有 23% 正在规模化任何智能体用例；ZS 2026 年制药 /
              生物技术调查发现，只有 17% 技术高管称 AI 在研究和发现环节带来可衡量价值；Gartner 预测，到 2027 年底，超过 40% 智能体 AI 项目会因成本、价值不清或风险控制问题被取消。MIT
              NANDA 2025 State of AI in Business 研究基于 300 多个已披露 AI 项目和 52 家组织访谈，发现约 95% 企业生成式 AI
              试点未能扩展到生产。采购机制因买方不同而异：高校通常使用 EDUCAUSE 的 HECVAT
              工具包做供应商安全和隐私审查；药企和生物技术买方则按多季度、里程碑制合作组织交易，而不是走软件销售周期，Isomorphic Labs 和 Recursion 的先例已经说明这一点。Mirendil
              没有发布信任、安全或合规页面；一旦有产品要卖，这会是通过任一路径的前置条件。
