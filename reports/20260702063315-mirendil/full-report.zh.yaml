  - id: TE003
    title: 技术 / 运营架构表
    columns:
      - 层 / 组件
      - 系统角色
      - 关键依赖
      - 风险
    rows:
      - - 前沿 AI-R&D 模型层
        - 生成研究想法、代码、分析和下一步推理
        - 高质量模型训练、后训练和研究轨迹数据
        - 未披露架构，可能不足以显著胜过通用前沿模型
      - - 智能体研究循环框架
        - 在实验设计、编码、执行、调试和迭代中维持状态
        - 工具执行、沙箱、记忆、规划和反馈循环
        - 外部基准中，长周期规划和失败恢复仍偏弱
      - - 算力编排和内核
        - 调度 GPU 任务、管理运行、优化内核并控制成本
        - NVIDIA GPU、云 / 数据中心容量、CUDA 生态和预算护栏
        - 算力获取、电力和硬件成本可能主导产品经济性
      - - 评测和检查点比较
        - 给运行打分、比较基线、发现回归，并支撑可复现
        - 留出任务、污染控制、人类基线、日志和审计轨迹
        - 评测泄漏或奖励黑客会抬高表观能力
      - - 领域适配器和接口
