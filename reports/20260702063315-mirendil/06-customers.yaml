  approximationNotes: Flow stages are modeled on Isomorphic Labs, Recursion, and Periodic Labs GTM patterns and on the HECVAT/vendor-security literature; no stage beyond initial awareness is confirmed for Mirendil.
  claimRefs:
  - CU001
  - CU029
  - CU035
  - CU036
  - CU017
callouts:
- calloutType: risk
  title: Zero named customers is the chapter's central finding
  body: No public source discloses a named Mirendil customer, pilot user, design partner, letter of intent, or beta program. Every adoption, retention, and concentration metric in this chapter is therefore a diligence gap rather than an underwriting input.
  claimRefs:
  - CU001
  - CU028
- calloutType: insight
  title: The job board is a free, verifiable leading indicator
  body: All 14 of Mirendil's open roles are technical (Member of Technical Staff across agent harness, inference, kernels, pretraining, RL, platform, security). A future shift toward sales, partnerships, or customer-success postings would be an early, checkable signal that commercialization is approaching.
  claimRefs:
  - CU011
  - CU012
- calloutType: assumption
  title: Adjacent peer evidence benchmarks the bar, it is not Mirendil's own record
  body: The Named Customer Proof table and Customer Proof Matrix cite Isomorphic Labs, Recursion, Periodic Labs, and Lila Sciences to show what real customer proof looks like in this category. None of these engagements belongs to Mirendil; they establish the evidentiary standard Mirendil has not yet met.
  claimRefs:
  - CU018
  - CU020
  - CU024
  - CU027
- calloutType: recommendation
  title: Track the job board and a future trust/security page as commercialization tripwires
  body: Because Mirendil has not published trust, security, or compliance materials, it cannot yet clear a university HECVAT-style review or a pharma vendor-security review. Re-checking the Ashby job board and the company's public site every 60-90 days for GTM hires or a security page is a low-cost way to detect the shift from research lab to commercial vendor.
  claimRefs:
  - CU013
  - CU036
  - CU029
