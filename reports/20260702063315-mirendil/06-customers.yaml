- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion Driver / Concentration Risk
  - Type
  - Impact
  - Diligence Path
  rows:
  - - A first design partner would likely represent 100% of any near-term revenue
    - Concentration risk
    - High -- mirrors Recursion's disclosed pattern in which two customers were substantially all 2025 revenue
    - Request pipeline count and revenue share by prospective segment once any deal signs
  - - Business-model ambiguity (platform license vs. milestone collaboration vs. internal IP)
    - Concentration / expansion ambiguity
    - High -- different models imply very different expansion economics and switching costs
    - Obtain management's GTM and commercial-model roadmap
  - - No GTM / sales / customer-success hiring yet
    - Expansion-capacity risk
    - Medium -- constrains ability to originate or expand accounts even once a design partner signs
    - Track the Ashby job board for GTM-function postings as a leading indicator
  - - Milestone-based expansion precedent among peers (Isomorphic Labs' Novartis deal grew from one to three programs)
