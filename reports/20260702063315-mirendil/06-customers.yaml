  - type: missing-source
    severity: blocking
    topic: named customer proof
    missingEvidence: A named Mirendil customer, design partner, pilot agreement, or letter of intent.
    whyItMatters: Without any named commercial engagement, customer durability, retention, and concentration cannot be assessed for the subject company itself.
    diligencePath: Request management disclosure of any signed design-partner agreements, NDAs, or pilot MOUs, including counterparty identity and scope.
