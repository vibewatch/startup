    - Confirm whether Mirendil intends a similar milestone-expansion structure
  - - Compute-dependency concentration on NVIDIA (per the Product & Technology chapter) could gate delivery capacity
    - Concentration risk (supply-side)
    - Medium -- a compute bottleneck could cap how many simultaneous engagements Mirendil can support
    - Confirm reserved GPU capacity earmarked for customer-facing vs. internal research use
  notes: Concentration assessments are analyst-inferred from peer disclosure patterns; no Mirendil-specific concentration data exists to quantify directly.
