- id: retention-expansion-concentration-and-verdict
  title: Retention, Expansion, Concentration, and the Customer Verdict
  body: 'No public source discloses net revenue retention, gross revenue retention, churn, renewal rate, or contract length for Mirendil, and the company does not appear on independent review platforms such as G2, Capterra, or Gartner Peer Insights. These are not gaps unique to Mirendil among pre-commercial peers, but they are gaps nonetheless, and every cell in the retention table below is null by necessity rather than by a disclosed zero. The more actionable finding is forward-looking: if and when Mirendil signs an initial design partner, revenue concentration risk is likely to be severe at the outset, mirroring Recursion''s own disclosed pattern in which two customers represented substantially all 2025 revenue. Whether that concentration resolves into durable, expanding relationships -- as Isomorphic Labs'' Novartis deal did when it grew from one program to three -- or into a single, exposed relationship depends on a business-model choice Mirendil has not yet disclosed: platform license, milestone-based scientific collaboration, or internally retained IP monetized later. Each implies different expansion mechanics and different metrics for a future diligence pass. The verdict for this chapter is therefore procedural rather than substantive: Mirendil''s customer story cannot yet be underwritten, only mapped by analogy, and the single highest-value diligence action available today is requesting direct confirmation of any named design partner, pilot agreement, or letter of intent, however early-stage.'
