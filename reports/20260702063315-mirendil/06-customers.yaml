- id: TU006
  title: Buyer procurement pathway and status quo substitute table
  columns:
  - Buyer Segment
  - Status Quo Substitute
  - Procurement Mechanism / Friction
  - Typical Cycle (Peer Evidence)
  - Diligence Implication
  rows:
  - - Pharma / biotech R&D
    - CROs, internal computational-biology teams, general-purpose LLMs, existing modeling suites
    - Multi-quarter scientific diligence plus milestone-based deal structuring, per Isomorphic Labs and Recursion precedent
    - Isomorphic Labs' Novartis relationship expanded materially only about 13 months after the original deal (Jan 2024 to Feb 2025)
    - A first pharma deal for Mirendil would likely take many quarters even after a working product exists
  - - Universities / academic labs
    - Existing HPC clusters, open-source tools, general LLM subscriptions
    - HECVAT-style security and privacy vendor review coordinated by EDUCAUSE, Internet2, and REN-ISAC member institutions
    - Not time-quantified in the public record; HECVAT is the stated de facto review instrument
    - Mirendil would need SOC2-style security documentation and a HECVAT response before campus-wide adoption
  - - Industrial / materials labs (semiconductor, robotics)
    - Internal R&D teams, contract engineering, general-purpose LLMs
    - Direct business-development relationship-building, per the Periodic Labs precedent, with no public RFP process disclosed
    - Not time-quantified; Periodic Labs' engagement was disclosed within roughly 12 months of its own launch
    - Bilateral BD relationships, rather than formal procurement, may be the fastest path to a first customer
  - - Internal AI-research teams at other labs
    - Build in-house on open models and the NVIDIA developer stack
    - Internal build-vs-buy evaluation, complicated by competitive overlap since Mirendil could be seen as a rival lab rather than a vendor
    - Not quantified in the public record
    - This segment may be the least likely near-term buyer given the competitive overlap documented in the Competitors chapter
  - - General enterprise / agentic AI buyers (all segments)
    - Status-quo human workflows plus narrow point-solution AI tools
    - Broad market skepticism after high pilot-failure rates
    - 'MIT NANDA: about 95% of GenAI pilots fail to scale; Gartner: 40%+ of agentic AI projects forecast canceled by 2027'
    - Even a working Mirendil product would face buyer skepticism independent of its own execution
  notes: Cycle-time figures are drawn from disclosed peer timelines and adoption research, not from any Mirendil-specific procurement record.
