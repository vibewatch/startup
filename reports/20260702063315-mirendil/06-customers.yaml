- id: adjacent-frontier-ai-for-science-customer-proof
  title: 'Adjacent Customer Proof: What ''Good'' Looks Like Among Mirendil''s Peers'
  body: 'Because Mirendil itself offers no customer evidence, this chapter benchmarks it against the clearest available proof from its closest competitive peer set. Isomorphic Labs discloses two named pharma collaborations: Eli Lilly (upfront payment plus up to $1.7 billion in milestones) and Novartis ($37.5 million upfront, up to $1.2 billion in milestones, expanded from one program to as many as three in February 2025). Recursion goes further, publishing named testimonials on its own partners page from Bayer AG''s Joerg Moeller and Roche''s James Sabry, and disclosing collaboration economics of up to $1.5 billion (Bayer), $213 million received to date (Roche/Genentech), and $134 million in milestones logged to date (Sanofi). Recursion''s 2025 Form 10-K also discloses that two customers represented substantially all of its 2025 operating revenue -- real proof, but proof of extreme concentration. Periodic Labs, whose founders come from the same frontier-lab talent pool as Mirendil''s team, states directly on its own homepage that it is training custom AI agents for an unnamed semiconductor manufacturer''s heat-dissipation problem, corroborated independently by Observer''s reporting that its customer base also includes space and defense companies. Lila Sciences sits at the weak end of this spectrum: it says it is welcoming its first commercial cohort and attends BIO 2026''s Partnering program, but names no specific pharma customer. Mirendil currently has none of this -- not a testimonial, not an unnamed engagement, not a partnering-directory listing.'
