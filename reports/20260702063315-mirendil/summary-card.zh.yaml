summary:
  headline: >
    Mirendil 拿着前 Anthropic/Google 顶级创始团队和 a16z、Kleiner Perkins、NVIDIA 一线背书，却在没有产品、基准、收入和客户时拿到约 $1B
    种子估值。人才和逻辑都成立，但价格几乎全靠创始人履历和 TAM 支撑。当前据报价格下应继续研究 / 观察；等首批技术证据和设计伙伴证据出现后再重估。
