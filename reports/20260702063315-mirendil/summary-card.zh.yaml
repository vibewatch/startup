  shortDescription: |
    Frontier AI lab building systems that excel at AI research and development, aiming to
    democratize frontier AI R&D so scientists in biology, chemistry, drug discovery,
    materials science, and robotics can use advanced AI without first becoming AI labs
    themselves. Founded early 2026 by ex-Anthropic and ex-Google researchers Behnam
    Neyshabur (CEO) and Harsh Mehta (CTO). Raised a $200M seed at roughly a $1B valuation
    in June 2026, led by Andreessen Horowitz and Kleiner Perkins with NVIDIA participating.
    Pre-product and pre-revenue at announcement.
