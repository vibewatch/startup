  topStrengths:
    - >-
      创始人与市场高度匹配：CEO Behnam Neyshabur（前 Anthropic Discovery 联合负责人；Google Minerva/Gemini；SAM optimizer）和 CTO Harsh
      Mehta（搭建 Anthropic 首个 autoresearch 平台）都直接来自公司要攻的前沿领域
    - 种子轮资本极厚：$200M 是迄今披露的最大 AI 种子轮之一，足以在收入压力到来前支撑多年、算力很重的实验室基础设施建设
    - 顶级背书：Andreessen Horowitz 和 Kleiner Perkins 联合领投，NVIDIA 参与，释放出对科学 AI 的信心，也可能带来算力 / 硬件协同
    - >-
      大且真实的顺风：AI-for-science 和 agentic AI 市场在快速扩张（agentic AI 到 2031 年约 42% CAGR；AI-in-drug-discovery 为双位数 CAGR），自动化 R&D
      是可信的前沿方向
    - 20 人创始团队来自 Anthropic、xAI、Google DeepMind、OpenAI，稀缺 frontier-ML 人才集中度高
  topRisks:
    - 估值约 $1B，却仍无产品、无收入：价值几乎全压在未验证逻辑和创始人履历上，没有基准、demo 或客户来承销这个价格
    - 关键人集中：可信度和执行高度依赖 Neyshabur 与 Mehta；公司未披露继任、董事会或治理层安排
    - >-
      赛道拥挤且资金充足：Periodic Labs（$300M 种子轮、目标估值约 $7B）、Lila Sciences（已融资 $550M）、Isomorphic Labs（DeepMind，Lilly/Novartis
      交易）和既有巨头已经有资金、收入或合作，Mirendil 暂时没有
    - 技术 / 可靠性风险：严谨科学工作需要的 agentic AI 可靠性和 LLM 幻觉问题仍未解决；Gartner 预计到 2027 年，超过 40% 的 agentic-AI 项目会被取消
    - 估值下修和 AI 泡沫暴露：未经验证的独角兽种子轮，一旦资本市场收紧或里程碑延误，很容易被重置
    - 宏观买方逆风：美国 FY2026 NSF 预算拟削减，可能压制公共科学 R&D 预算，而后者最终会资助科学 AI 采用
  unresolvedGaps:
    - 产品和技术证据：没有公开基准、评估方法、demo 环境，也没有 autonomous AI-R&D 系统路线图
    - 收入、定价和商业化：没有收入模型、定价、pipeline、设计伙伴或任何客户证据
    - 治理和股权结构：董事会构成、投资人权利、投票控制、老股交易或法律实体细节均未公开
    - 烧钱和现金跑道：虽已融资 $200M，但月度烧钱（算力 + 精英人才薪酬）未披露，现金跑道无法估算
    - 20 人创始团队之外的员工数和办公地点、招聘计划、办公室网络均未披露
    - 监管姿态：若 Mirendil 进入受监管科学领域，公司未披露 EU AI Act / FDA 暴露的分类或路线图
