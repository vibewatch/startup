company:
  name: Mirendil
chapter:
  number: 3
  title: Competitors
  summary: Mirendil competes in a crowded AI-for-science stack where direct autonomous-science labs, Alphabet/DeepMind assets, AI-drug-discovery platforms, open research agents, general LLMs, internal pharma AI, CROs, and manual R&D all solve adjacent pieces of the same job. Its differentiation is broad AI-R&D automation, but durability is unproven because better-funded peers already show autonomous labs, public tools, partnerships, pipelines, or commercial packaging.
sections:
- id: landscape-boundary-and-alternative-classes
  title: Landscape boundary and alternative classes
  body: The competitive set should be drawn around the buyer job rather than around Mirendil’s current corporate label. Mirendil is not merely another model company; it is trying to help AI builders and eventually scientists run more of the research loop themselves. That job can be served by direct “AI scientist” laboratories such as Periodic Labs, Lila Sciences, FutureHouse, and Sakana AI; by incumbents such as Google DeepMind, Isomorphic Labs, Anthropic, and OpenAI; by vertical AI-drug-discovery and protein-design platforms such as Recursion, Insilico, Chai Discovery, Cradle, and Schrödinger; by infrastructure suppliers such as NVIDIA; by internal pharma or technology teams; by CROs and manual bench science; or by scientists multi-homing across general LLMs and specialized tools. This wide boundary is adverse for Mirendil because buyers can adopt pieces of automation without waiting for a single end-to-end frontier lab platform.
