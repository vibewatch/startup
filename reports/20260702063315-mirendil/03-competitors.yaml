- id: capability-pricing-and-distribution-comparison
  title: Capability, pricing, and distribution comparison
  body: 'Feature comparison reveals that Mirendil is currently strongest as an ambition statement and weakest as a purchasable artifact. Its public materials describe frontier models for AI R&D, autonomous research loops, and eventual support for scientists, but they do not disclose a named SKU, pricing model, security package, integration surface, customer list, or benchmark suite. Several competitors already disclose sharper buying criteria: Lila is welcoming commercial partners; Recursion has a clinical pipeline and public-company investor surface; Isomorphic discloses a Lilly collaboration with upfront and milestone economics; Cradle states a software subscription model and no royalties; NVIDIA publishes developer tools and open models; and AlphaFold Server is publicly available for non-commercial research. A buyer that wants a platform today can therefore multi-home: use broad LLMs for reasoning, specialized tools for molecular or protein work, and incumbent infrastructure for deployment,
    while treating Mirendil as a future option rather than an immediate replacement.'
