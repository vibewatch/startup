- id: incumbents-and-adjacent-platforms
  title: Incumbents and adjacent AI-science platforms
  body: 'Incumbents attack Mirendil from credibility, distribution, and proof rather than from identical positioning. Google DeepMind’s AlphaFold has already become a global scientific tool with hundreds of millions of protein structures and millions of researchers, while Isomorphic Labs converts the AlphaFold lineage into drug-discovery partnerships with Alphabet resources behind it. Recursion and Insilico are narrower than Mirendil but more mature in the drug-discovery workflow: Recursion is a Nasdaq-listed clinical-stage TechBio with a pipeline, partnerships, and a proprietary operating system, while Insilico advertises an AI-driven pipeline and drug-discovery software modules. Chai Discovery and Cradle are narrower productized wedges in antibody or protein engineering, and Schrödinger supplies entrenched physics-based software for molecular discovery. The implication is not that any one of them replaces Mirendil’s full thesis; it is that each can absorb budget, data rights, trust, and
    workflow ownership before Mirendil ships a disclosed product.'
