- id: direct-ai-scientist-peers
  title: Direct AI-scientist peers and funding intensity
  body: 'The most direct competition is not another seed-stage website but a cohort of frontier AI-for-science organizations trying to close the reasoning-to-experiment loop. Periodic Labs is the closest conceptual peer because public coverage says it is building AI scientists and autonomous laboratories for materials and chemistry, raised a $300 million seed, and later was discussed at a multibillion-dollar valuation. Lila Sciences is similarly threatening because its official materials claim advanced AI plus autonomous labs that generate hypotheses, run experiments, and learn from real-time data, while its Series A materials say it has raised $550 million and is opening its platform to commercial partners. FutureHouse and Sakana are less obviously commercial substitutes but are strategically important: they make automated scientific agents and paper-generation workflows visible, open, and culturally accessible. Mirendil’s direct-peer moat therefore depends on whether it can prove broader
    AI-R&D automation before better-capitalized and more domain-anchored peers own the reference cases.'
