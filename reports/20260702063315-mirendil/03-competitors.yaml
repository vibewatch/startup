  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: data moat
    missingEvidence: Mirendil proprietary dataset inventory, workflow logs, experiment/failure corpus, and exclusive partner-data rights.
    whyItMatters: Differentiation durability depends on compounding data and workflow assets that public sources do not yet prove.
    diligencePath: Request a data-room session covering data provenance, volumes, exclusivity, governance, and benchmark uplift from each data source.
    relatedQuestionRefs:
    - QP019
    relatedTableRefs:
    - TP004
  - type: missing-source
    severity: material
    topic: pricing and packaging
    missingEvidence: Standard pricing, pilot contract model, discounts, support obligations, and success metrics for Mirendil and direct AI-scientist peers.
    whyItMatters: Without public or private pricing evidence, margin, procurement friction, and competitive discounting cannot be compared reliably.
    diligencePath: Ask management and reference customers for pilot SOWs, pricing sheets, service levels, discount policy, and conversion criteria.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP003
  - type: enumeration-incomplete
    severity: minor
    topic: TP001 competitor profile table coverage
    missingEvidence: A full census of stealth AI-scientist labs, university spinouts, CRO automation offerings, and internal pharma AI programs.
    whyItMatters: The visible competitor set is enough for landscape analysis but not enough to rule out quiet entrants with private customer traction.
    diligencePath: Run management reference checks, investor landscape calls, pharma innovation-office interviews, and patent/job-posting sweeps before final underwriting.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP001
  - type: private-evidence-only
    severity: material
    topic: direct-peer customer metrics
    missingEvidence: Revenue, customer counts, pilot conversion, retention, and expansion metrics for Mirendil, Periodic Labs, Lila Sciences, and other direct peers.
    whyItMatters: Funding and mission statements do not reveal whether buyers will actually shift scientific R&D budgets to frontier AI-scientist platforms.
    diligencePath: Ask each company or investors for customer cohort data, contracted backlog, reference calls, and renewal or expansion evidence.
    relatedQuestionRefs:
    - QP026
    relatedTableRefs:
    - TP001
    - TP003
  - type: missing-source
    severity: minor
    topic: trust and safety artifacts
    missingEvidence: Published security, audit, model-evaluation, lab-safety, and research-integrity artifacts for Mirendil and direct peers.
    whyItMatters: Scientific buyers will need stronger validation than ordinary enterprise AI buyers before delegating experiments or research outputs.
    diligencePath: Request security documentation, eval cards, red-team reports, lab-safety protocols, and customer validation packages.
    relatedQuestionRefs:
    - QP021
    relatedTableRefs:
    - TP002
    - TP004
