- id: moat-durability-and-adverse-verdict
  title: Moat durability and adverse verdict
  body: 'Mirendil’s most defensible potential moat is a closed-loop AI-R&D system trained on the full internal research process, not a generic chatbot wrapped for scientists. The durability problem is that public evidence does not yet prove ownership of the scarce assets that would make such a system hard to copy: proprietary experimental data, commercial partner workflows, validated benchmarks, trust/compliance artifacts, or exclusive distribution into scientific budgets. Multiple adverse signals point the other way. Sakana explicitly expects model providers and open models to keep improving and commoditizing the base layer. Gartner warns that many agentic projects are still hype-driven and risk cancellation without clear ROI. Excelra argues that data moats matter more than algorithms as foundation models commoditize, while Big Tech and leading pharmas are direct competitors or internal builders. The underwriting conclusion is therefore cautious: Mirendil may be differentiated if it productizes
    an end-to-end lab-grade research loop, but today the public moat is mainly talent and capital, not durable customer lock-in.'
