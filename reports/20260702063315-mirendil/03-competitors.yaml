- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Alternative
  - Price / unit / contract model
  - Included capabilities
  - Discounts / unknowns
  - Implication for Mirendil
  rows:
  - - Mirendil
    - Not disclosed
    - Frontier AI-R&D system and lab redesign thesis
    - No public SKU, list price, pilot terms, or service packaging
    - Must prove willingness to pay and contract path privately
  - - Periodic Labs
    - Not disclosed
    - AI scientists and autonomous labs for physical-world materials data
    - No customer pricing or enterprise packaging found
    - May be a talent/data arms race rather than near-term software sale
  - - Lila Sciences
    - Not disclosed
    - Scientific agents, autonomous science platform, AI Science Factories, security claim
    - Official source says first customer cohort is being welcomed but not priced
    - More commercial posture than Mirendil in public record
  - - Isomorphic Labs
    - $45M upfront plus up to $1.7B milestones in Lilly partnership
    - Small-molecule discovery against multiple targets using AlphaFold-linked platform
    - Deal economics are partnership-specific and exclude royalties from headline milestone cap
    - Shows pharma will pay for credible AI-first science when proof and partner fit exist
  - - Recursion
    - No platform list price; public company with partnered and proprietary pipeline economics
    - Recursion OS, automated wet lab, proprietary data, clinical pipeline
    - Enterprise / pharma economics are not reducible to a public SaaS price
    - A mature vertical platform can sell outcomes before horizontal tooling
  - - Cradle
    - Software subscription fee; no royalties stated
    - Protein engineering collaboration with privacy, security, and IP ownership claims
    - Exact subscription price not disclosed in fetched page
    - A narrow wedge can be easier for buyers to approve than Mirendil’s broad platform
  - - AlphaFold Server
    - Free non-commercial research access disclosed
    - AlphaFold 3 structure and interaction prediction for non-commercial scientists
    - Commercial use and enterprise support are not priced in cited page
    - Free incumbent tools lower willingness to pay for baseline capabilities
  - - General LLM / internal build
    - Subscription, API, cloud/GPU, and service contracts; no equivalent unified price
    - Reasoning, coding, chemistry assistance, internal orchestration, and CRO execution
    - Total cost depends on data, compute, validation, staff, and governance
    - Creates a credible “compose the stack” fallback while Mirendil matures
  notes: Most frontier AI-for-science labs are pre-commercial or partnership-led, so “Not disclosed” means no public list price or standard contract unit was found in reviewed sources.
