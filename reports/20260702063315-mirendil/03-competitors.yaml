tables:
- id: TP001
  title: Competitor profile table
  columns:
  - Competitor / alternative
  - Category
  - Scale / funding
  - Target segment
  - Differentiation
  - Limitation for Mirendil substitution
  rows:
  - - Mirendil
    - Focal company / direct AI-R&D automation lab
    - $200M seed led by a16z and Kleiner Perkins with NVIDIA participating
    - AI researchers first, then scientists in drug discovery, chemistry, biology, robotics, and other domains
    - Broad frontier AI-R&D loop and “system that builds systems” positioning
    - No public SKU, pricing, benchmarks, customer proof, or revenue disclosure
  - - Periodic Labs
    - Direct AI-scientist peer
    - $300M seed; later reports discussed a roughly $7B to $7.5B valuation
    - Materials and chemistry discovery, beginning with superconductors
    - Autonomous labs that run physical experiments and collect new real-world data
    - Public evidence is still mainly launch/fundraising coverage rather than customer packaging
  - - Lila Sciences
    - Direct autonomous science-factory peer
    - $550M total raised after $350M Series A close
    - Life science, chemistry, materials, energy, defense, aerospace, and other strategic science programs
    - AI Science Factories that connect models, instruments, hypotheses, experiments, and real-time learning
    - Very broad platform claim; commercial terms and independent customer outcomes remain limited publicly
  - - FutureHouse
    - Direct non-profit research-agent peer
    - Non-profit; funding not benchmarked here
    - Biology and complex-science researchers, including postdoctoral fellows
    - AI agents and fellowship model for automating scientific discovery
    - Non-profit and research-program orientation may limit direct enterprise replacement
  - - Sakana AI Scientist
    - Direct research-automation demonstration
    - Research system rather than enterprise vendor pricing
    - Machine-learning researchers and open research community
    - Automates idea generation, experiments, writing, and reviewing in an open-ended loop
    - Current version has documented errors, safety issues, and uncertain paradigm-shifting capability
  - - Google DeepMind / AlphaFold
    - Incumbent science platform
    - Alphabet-backed global research tool; 200M+ structures disclosed
    - Academic and non-commercial researchers, protein and biomolecular science users
    - Nobel-recognized AlphaFold lineage, public server, and enormous adoption footprint
    - Focused on biomolecular structure rather than general AI-R&D platform for every lab
  - - Isomorphic Labs
    - Incumbent AI drug-discovery company
    - Alphabet subsidiary; Lilly deal has $45M upfront and up to $1.7B milestones
    - Pharma partners pursuing small-molecule therapeutics
    - DeepMind/AlphaFold lineage plus dedicated AI-first drug design team
    - Therapeutics-focused and partnership-led rather than democratized horizontal AI-R&D tooling
  - - Recursion
    - Adjacent AI-drug-discovery incumbent
    - Nasdaq-listed large accelerated filer with clinical-stage pipeline
    - Biopharma partners and patients in oncology, rare disease, neuroscience, immunology
    - Recursion OS, >50PB proprietary data, automated wet lab, and clinical assets
    - Narrower drug-discovery scope; likely absorbs vertical pharma budgets before horizontal AI-R&D budgets
  - - Insilico Medicine
    - Adjacent AI-drug-discovery platform
    - Private platform with Phase II and Phase I pipeline programs disclosed
    - Drug discovery, target ID, biology, chemistry, and pharma AI users
    - Generative AI and automation from target ID through molecule generation
    - Public pricing and third-party customer outcomes are incomplete in reviewed sources
  - - Internal build / CRO / general LLM stack
    - Substitute and status quo
    - Buyer-funded; uses existing budgets, CRO contracts, cloud/GPU, and LLM subscriptions
    - Pharma, biotech, universities, industrial R&D, and internal AI teams
    - Keeps proprietary data in house and lets buyers compose tools à la carte
    - May be slower and fragmented, but has lower platform switching risk than adopting a new pre-product lab
