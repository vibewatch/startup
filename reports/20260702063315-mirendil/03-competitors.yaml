- id: TP004
  title: Moat durability / competitive-risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Elite AI-R&D talent can build a unique research loop
    - Direct peers also recruit ex-OpenAI, DeepMind, Google, Anthropic, robotics, and science talent
    - High
    - Request team-by-team capability map, retention plan, and evidence of unique internal workflows
  - - End-to-end research-loop data creates compounding advantage
    - Periodic, Lila, Recursion, and internal pharma teams can generate proprietary experiment or workflow data too
    - High
    - Review data provenance, exclusivity, volume, feedback-loop frequency, and benchmark uplift
  - - Broad horizontal platform expands beyond any one vertical
    - Vertical platforms may win budgets first because they solve narrower high-ROI workflows with clearer validation
    - Medium
    - Demand customer segmentation and proof that broad AI-R&D beats wedge-first adoption
  - - Independence from big AI labs is valuable to external scientists
    - OpenAI, Anthropic, NVIDIA, DeepMind, and open models can release cheaper baseline science capabilities
    - High
    - Benchmark Mirendil against general LLMs, open models, and incumbent science tools on buyer tasks
  - - Scientific autonomy will create large productivity gains
    - Gartner warns many agentic AI projects are hype-driven, low-ROI, or too costly to productionize
    - High
    - Require ROI evidence, failure-mode logs, human-in-the-loop design, and deployment economics
  - - Trust can be built after product launch
    - Research-integrity and hallucination concerns make scientific buyers demand verification before delegation
    - Medium
    - Review validation, provenance, audit, safety, and publication-integrity controls before pilots
  - - Capital gives enough time to build
    - Well-funded Lila and Periodic plus Alphabet-backed Isomorphic can outspend or out-partner Mirendil
    - High
    - Compare runway, compute commitments, partner exclusivity, and customer pipeline in diligence
  - - No pricing disclosed preserves option value
    - Unclear packaging slows procurement and lets substitutes set buyer expectations
    - Medium
    - Request packaging, pilots, discounts, support model, and success-fee / milestone options
  notes: Severity is an evidence-backed diligence judgment rather than a scored probability; mitigation cells are specific asks for private diligence.
