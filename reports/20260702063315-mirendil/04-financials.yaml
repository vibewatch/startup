- id: TI004
  title: Capital adequacy table
  columns:
  - Input
  - Public / estimated value
  - Scenario label
  - Implication
  - Diligence ask
  rows:
  - - Cash on hand from seed proceeds
    - ~$200M gross financing context; unrestricted net cash not disclosed
    - Public financing fact + unavailable private cash
    - Large seed gives build time but not exact treasury liquidity
    - Request bank balance, restricted cash, fees, escrow, prepaid compute, and post-close balance sheet
  - - Monthly burn
    - Unknown; illustrative cases use $3M, $5M, and $10M per month
    - Estimated scenario only
    - Runway sensitivity is dominated by this undisclosed input
    - Request trailing three-month and board-plan burn by payroll, compute, capex, data, and G&A
  - - Runway at $3M/month
    - ~67 months before fees and working-capital effects
    - Estimated from gross seed only
    - Long enough for product build if spend stays controlled
    - Confirm whether early-stage burn can actually stay this low for frontier R&D
  - - Runway at $5M/month
    - ~40 months before fees and working-capital effects
    - Estimated from gross seed only
    - Base illustrative case for a highly paid lab with meaningful compute
    - Validate with hiring plan, GPU commitments, and vendor prepayments
  - - Runway at $10M/month
    - ~20 months before fees and working-capital effects
    - Estimated from gross seed only
    - High-burn case could force financing before robust revenue proof
    - Request downside plan, follow-on investor reserves, and milestone-based spending gates
  - - Planned use of funds
    - Compute, elite AI talent, platform R&D, data/evaluation systems, and possible scientific workflow infrastructure
    - Inferred from mission and cost benchmarks
    - Capital intensity is a feature of the strategy, not an incidental expense
    - Request board-approved budget, vendor commitments, cloud credits, and hiring plan
  - - Debt / project-finance obligations
    - None disclosed publicly
    - Unavailable private capital-structure input
    - No public debt overhang identified, but absence is not proof of none
    - Request debt schedule, equipment financing, cloud prepayment contracts, warrants, and side letters
  - - Next-round trigger
    - Likely product/benchmark/customer proof plus compute runway, not disclosed
    - Inferred milestone framework
    - Financing risk rises if model progress consumes cash without revenue conversion
    - Request milestone budget, internal KPIs, reserve policy, and investor pro-rata commitments
  enumerationScope:
    coverage: partial
    basis: Frames capital adequacy around the public seed amount and scenario math; actual treasury, burn, debt, and board plan are private.
  notes: 'Runway scenarios are simple gross-proceeds calculations: $200M divided by illustrative monthly burn; they are not management guidance.'
