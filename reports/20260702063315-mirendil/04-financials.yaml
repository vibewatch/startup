- id: pricing-and-gtm-inputs
  title: Pricing, GTM efficiency, and revenue recognition inputs are unavailable
  body: The public record does not support SaaS-style metrics such as CAC payback, NRR, ACV expansion, sales cycle, cloud gross margin, or usage retention for Mirendil. Those metrics should not be forced into the underwriting model until the company discloses whether it is selling software access, research collaborations, compute-heavy usage, outsourced scientific work, or internally generated intellectual property. The closest public benchmark is Schrödinger, where software ACV, software revenue, hosted revenue transition, gross margin, and large-customer ACV are disclosed; that illustrates the level of evidence needed before Mirendil can be evaluated as an enterprise platform. If management says Mirendil is instead building a partner-driven discovery business, diligence should pivot to term sheets, target ownership, cost sharing, and milestone probability rather than subscription metrics. For now, list pricing is zero percent observable, realized pricing is zero percent observable, and
    revenue recognition is an open accounting question rather than a data point.
  claimRefs:
  - CI014
  - CI015
  - CI016
  - CI017
  - CI018
  - CI038
