tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current value / status
  - Quality
  - Diligence ask
  rows:
  - - Enterprise AI-R&D platform access
    - Potential subscription, enterprise license, or hosted platform access for AI builders and scientists
    - Seat, team, workspace, model run, or compute quota
    - None disclosed / pre-revenue
    - Plausible but unpriced; company has not named a SKU
    - Request product packaging, design-partner agreements, list price, usage metering, and revenue-recognition policy
  - - Research collaboration revenue
    - Upfront payment plus research funding, target milestones, royalties, or option fees similar to public AI-drug-discovery comps
    - Target, program, collaboration, or milestone
    - None disclosed for Mirendil
    - Comparable-supported mechanism, not Mirendil proof
    - Request executed LOIs, term sheets, target ownership, milestone waterfalls, and cost-sharing terms
  - - Usage-based compute / agent execution
    - Customer pays for autonomous experiment, code, evaluation, or simulation workflows that consume GPU and data resources
    - GPU-hour, experiment, workflow, or token-like unit
    - None disclosed
    - Economically possible but gross margin unknown
    - Request metering plan, customer-facing usage unit, cloud/GPU cost schedule, and utilization assumptions
  - - Managed scientific R&D service
    - Mirendil team or system performs a research work package for a customer before platform self-service maturity
    - Project, FTE-equivalent, study, or deliverable
    - None disclosed
    - Could bridge early revenue but may dilute software margins
    - Request pilot SOWs, staffing model, service gross margin, IP ownership, and acceptance criteria
  - - Internal lab / IP creation
    - Company creates scientific discoveries or AI assets and later licenses, spins out, or monetizes them
    - Asset, model, target, molecule, or patent family
    - None disclosed
    - High optionality but longest cash conversion cycle
    - Request internal program list, ownership map, patent filings, valuation policy, and exit/licensing strategy
  - - Grants or non-dilutive research funding
    - Public, foundation, or industrial grant funding to support specific research infrastructure
    - Grant, award, or research contract
    - None disclosed
    - No public evidence for Mirendil
    - Request grant applications, awards, reimbursement conditions, and restrictions on commercial use
