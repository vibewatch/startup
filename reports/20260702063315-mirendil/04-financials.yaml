- id: cost-structure-and-unit-economics
  title: The cost stack is likely compute- and talent-heavy, but the actual burn is private
  body: 'Mirendil’s mission implies a cost structure closer to a frontier lab than a conventional lightweight SaaS startup. The company must pay elite AI researchers, run or rent accelerators, build evaluation and experiment infrastructure, acquire scientific data, and potentially support domain-specific lab workflows before any revenue offsets those expenses. Public sources do not disclose Mirendil’s monthly burn, compute contracts, cloud credits, GPU access terms, lab capex, or recruiting plan. External benchmarks show why this omission is material: Epoch estimates global AI compute has expanded to the equivalent of roughly 20 million H100s and AI capex is approaching $1 trillion per year; the arXiv frontier-training-cost paper estimates the amortized cost of the most compute-intensive training runs has grown 2.4x annually since 2016; and Lambda posts H100 and B200 cloud prices in dollars per GPU-hour. Those sources do not reveal Mirendil’s spend, but they do identify the cost drivers
    diligence must quantify before any gross-margin or runway conclusion is reliable.'
  claimRefs:
  - CI030
  - CI031
