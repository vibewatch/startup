- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact on underwriting
  - Exact diligence path
  - Severity
  rows:
  - - Revenue / ARR / bookings
    - Cannot test revenue quality, valuation multiple, or traction
    - Request monthly recognized revenue, bookings, deferred revenue, signed contracts, pipeline, and auditor-ready revenue policy
    - Blocking
  - - Pricing and packaging
    - Cannot distinguish subscription, usage, collaboration, services, or IP economics
    - Request pricing memo, list price, discounting authority, pilot pricing, and product packaging roadmap
    - Blocking
  - - Customer and design-partner proof
    - Cannot prove external willingness to pay or conversion from lab thesis to market demand
    - Request signed customer names under NDA, pilots, LOIs, design-partner scope, and conversion terms
    - Material
  - - Compute commitments and effective GPU cost
    - Gross margin and burn can be wrong by multiples if reserved capacity or capex is large
    - Request GPU contracts, cloud credits, reserved-capacity schedules, utilization data, and cancellation terms
    - Blocking
  - - Payroll and hiring plan
    - Elite AI talent can rapidly turn a large seed into high fixed burn
    - Request org chart, signed offers, compensation bands, retention packages, and 24-month hiring plan
    - Material
  - - Cash, restricted cash, debt, and side letters
    - Runway and downside protection cannot be verified from gross round size alone
    - Request post-close balance sheet, debt schedule, warrants, investor side letters, and board-approved budget
    - Blocking
  - - Unit economics by workflow
    - Cannot price workflows, collaborations, or services against cost to deliver
    - Request workflow-level contribution margin, compute allocation, support time, error/rework rates, and customer SLA assumptions
    - Material
  - - Milestone or royalty economics
    - Comparable upside may be back-ended and probability-weighted rather than current revenue
    - Request collaboration waterfall, milestone probability, target ownership, royalty base, and termination rights
    - Material
  enumerationScope:
