- id: financial-verdict-and-diligence-blockers
  title: 'Financial verdict: capitalized enough to build, not disclosed enough to underwrite'
  body: 'The financial verdict is deliberately split. Positively, Mirendil has a large reported seed round, blue-chip investor sponsorship, and a sector backdrop where capital is flowing aggressively into AI and AI-for-science infrastructure. Carta and Crunchbase both show how concentrated 2026 venture capital has become around AI, and Lila and Periodic demonstrate that large science-AI financings are not isolated outliers. Negatively, Mirendil’s public financial evidence does not yet support an investable revenue-quality or unit-economics conclusion. Sequoia’s AI infrastructure critique asks where the revenue will come from to support the GPU buildout, and Gartner warns that many agentic projects may be cancelled because of cost, unclear value, and risk-control failures. Mirendil may ultimately prove that its autonomous R&D loop creates valuable scientific output, but today the underwriteable inputs are insufficient: no pricing, no customer pipeline, no burn, no compute obligations, no
    gross margin, no debt schedule, and no milestone economics.'
