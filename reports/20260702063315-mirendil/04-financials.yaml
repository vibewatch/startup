- id: capital-adequacy-and-runway
  title: Seed capital is substantial, but runway depends almost entirely on undisclosed burn
  body: The financial underwriting anchor is the reported $200 million seed financing, not revenue. A simple gross-cash framing gives Mirendil meaningful build time, but the range is wide because the burn denominator is unknown. If gross proceeds were available for operations and the lab burned $3 million per month, the proceeds alone would imply about 67 months of pre-fee runway; at $5 million per month, about 40 months; at $10 million per month, about 20 months. These are not company forecasts, and they exclude financing fees, equipment deposits, prepaid compute, legal costs, hiring acceleration, and any strategic commitments. The scenario is still useful because it converts the absence of public burn disclosure into an explicit diligence variable. The next financing trigger is therefore not a calendar date by itself; it is the combination of model capability, product packaging, customer proof, compute commitments, and whether the company can show capital efficiency before the seed cash
    is consumed.
