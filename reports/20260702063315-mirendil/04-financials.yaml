- id: TI002
  title: Pricing / monetization table
  columns:
  - Price / unit / contract
  - List vs. realized pricing
  - Discounts / unknowns
  - Source status
  - Underwriting implication
  rows:
  - - Platform subscription or enterprise license
    - Not disclosed / no list price observed
    - Seat count, usage caps, enterprise discounting, support, security, and hosted-compute pass-through are unknown
    - Mirendil official and investor sources describe mission, not pricing
    - Cannot model ARR, ACV, NRR, CAC payback, or software gross margin
  - - Research collaboration contract
    - Not disclosed for Mirendil; public comps use upfronts, milestones, royalties, and research activities
    - Target count, upfront size, milestone probability, exclusivity, and reimbursement are unknown
    - Schrödinger and Isomorphic filings / releases show comparable structures
    - Use probability-weighted milestone economics only after reviewing term sheets
  - - Usage-based GPU or workflow charge
    - Not disclosed
    - Realized margin depends on GPU-hour cost, scheduling, utilization, and whether compute is included or passed through
    - Lambda and NVIDIA sources benchmark the input category, not Mirendil pricing
    - Gross margin is not underwriteable until compute procurement and billing units are known
  - - Managed project or services fee
    - Not disclosed
    - Discounts, staffing leverage, acceptance criteria, and IP ownership are unknown
    - No Mirendil customer SOWs are public
    - Early revenue could be lower quality if it depends on bespoke founder-scientist labor
  - - Licensing / royalty from internal scientific assets
    - Not disclosed
    - Timing, development risk, royalty base, and partner economics are unknown
    - Comparable drug-discovery filings show this pattern but not Mirendil adoption
    - Treat as upside optionality, not base-case revenue
  enumerationScope:
    coverage: partial
    basis: Covers monetization mechanisms that could map to the public mission and comparable filings; it is not a company pricing sheet.
  notes: No Mirendil list price, realized price, discounting, or contract revenue is public; rows intentionally separate unavailable company data from comparable mechanisms.
