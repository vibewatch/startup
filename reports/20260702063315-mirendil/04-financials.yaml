- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Value / null
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - ARR / revenue run rate
    - null
    - Low
    - Anchor for valuation, growth, and customer proof
    - Request monthly revenue bridge by product, customer, contract date, and recognition basis
  - - Customer count / design partners
    - null
    - Low
    - Distinguishes internal lab work from external demand
    - Request signed pilots, unpaid pilots, design-partner list, conversion terms, and churn status
  - - Average contract value
    - null
    - Low
    - Defines whether GTM is enterprise, collaboration, usage, or services-led
    - Request ACV distribution, upfronts, minimums, and expansion history
  - - Gross margin
    - null
    - Low
    - Frontier AI revenue quality depends heavily on compute pass-through and utilization
    - Request gross margin by product, cloud/GPU cost allocation, support cost, and data-acquisition cost
  - - GPU / compute cost per workflow
    - null
    - Low
    - Determines whether usage scales profitably or consumes seed capital
    - Request GPU inventory, cloud contracts, reserved capacity, effective hourly rate, and utilization by workload
  - - CAC and sales cycle
    - null
    - Low
    - Long scientific enterprise cycles can delay cash conversion
    - Request pipeline stages, sales-cycle cohort, founder-led vs. sales-led motion, and win/loss data
  - - CAC payback
    - null
    - Low
    - Requires gross margin, sales spend, and recognized revenue that are not public
    - Request sales and marketing spend by cohort, gross profit by customer, and payback calculation
  - - NRR / expansion
    - null
    - Low
    - Validates repeatable value and platform stickiness
    - Request renewal base, expansion events, downgrades, and usage-retention cohorts
  - - R&D expense as % of revenue
    - null
    - Low for Mirendil; high in public comps
    - Shows whether AI-for-science revenue can absorb discovery and platform spend
    - Request monthly R&D payroll, compute, data, and lab spend versus any recognized revenue
  - - Cash burn / runway
    - null
    - Low
    - Most important near-term solvency variable because public revenue is absent
    - Request monthly cash operating burn, capex, prepaid compute, unrestricted cash, and board-approved operating plan
