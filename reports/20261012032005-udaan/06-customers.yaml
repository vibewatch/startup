callouts:
  - calloutType: "risk"
    title: "The Trade Credit Dilemma in Informal Kirana Commerce"
    claimRefs:
      - "CU005"
      - "CU006"
      - "CU007"
    body: >
      In India's unorganized general trade sector, traditional wholesalers have long extended informal, relationship-based
      credit to kirana merchants. In its initial high-growth phase, Udaan attempted to digitize this dynamic through aggressive
      unsecured credit underwriting, providing credit lines to drive app order volumes. However, the dispersion of micro-retailers
      and absence of formal financial documentation led to significant default rates and bad debts. Udaan's recent turnaround
      pivot—curtailing credit risk, accepting a 20% revenue contraction to ₹4,561.4 crore in FY25, and slashing core EBITDA burn
      by 40% via localized clusters—demonstrates that disciplined working capital governance and unit-level profitability have
      superseded unconstrained top-line expansion as the platform prepares for its public markets debut.

