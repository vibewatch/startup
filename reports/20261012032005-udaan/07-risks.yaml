    title: "Capital Structure Fragility and Refinancing Dependencies"
    body: "Despite raising $160 million in structured financing in 2026 and $114 million in Series G equity in 2025, Udaan remains heavily dependent on private credit flexibility and creditor forbearance. Having previously restructured creditor claims following a convertible bond default, any failure to achieve sustained operating EBITDA profitability could jeopardize its IPO readiness and trigger sharp dilution or covenant acceleration."
