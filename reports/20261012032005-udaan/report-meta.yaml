companyProfile:
  summary: >-
    Udaan is a Bengaluru-founded B2B commerce platform focused on fast-moving consumer goods, staples, chemists, and
    HoReCa procurement. It combines a marketplace, logistics network, and embedded trade-credit products to serve small
    retailers and institutional buyers, while its recent restructuring pushed the business toward dense regional
    clusters and a pre-IPO operating model.
