      - number: '8.3'
        title: 估值情景与市场可比公司
        blocks:
          - type: paragraph
            body: >-
              我们的情景框架以 FY25 ₹4,561 crore 营收和同业交易倍数为锚，模拟 Udaan 在乐观、基准和悲观经营路径下的估值。基准情景（概率 55%）中，Udaan 每年实现温和的 5% 至 10%
              营收增长，达到 ₹4,800 至 ₹5,200 crore，并以 2027 年末实现 EBITDA 盈亏平衡为目标。按 2.5x 至 3.0x 净营收的保守公开上市倍数计算，企业价值为 $1.4 billion
              至 $1.9 billion，相对当前 $1.8 billion 的 Series G 估值，回报基本持平（0.8x 至 1.05x）。行业可比公司进一步印证了估值约束：SoftBank 支持的竞品
              ElasticRun 在 FY23 净亏损激增 72% 至 ₹618 crore 后，被 HSBC 将估值下调 50% 至 $800 million，并被迫从全国规模收缩为区域暗店网络。乐观情景（概率
              25%）中，高毛利自有品牌和 HoReCa360 加速渗透，推动年增长 20% 至 ₹6,500 crore，并以 4.0x 营收释放 $2.6 billion 至 $3.2 billion
              的退出估值。相反，悲观情景（概率 20%）预计估值压缩至 $700 million 至 $900 million（营收的 1.2x 至 1.5x），前提是债务到期迫使公司进行稀释性资本重组，或快商平台进一步侵蚀
              kirana 的补货量。
