            title: 资本结构重置与估值修复逆风
            body: >-
              Udaan 于 2025 年中完成 $114 million Series G，但估值仍为 $1.8 billion，较 2021 年峰值 $3.2 billion 低
              44%。关键业务负责人离职、高层持续流失，加上 ₹300 crore 风险债务，使公司在 18 个月内准备国内上市时几乎没有执行容错。
