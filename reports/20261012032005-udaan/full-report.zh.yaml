  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与当前估值背景
        blocks:
          - type: paragraph
            body: >-
              Udaan 完成了由 M&G Investments 和 Lightspeed Venture Partners 领投的 $114 million Series G 股权融资，估值约 $1.8
              billion，较此前持平。这一估值比公司 2021 年 1 月达到的 $3.2 billion 私募峰值低 43.8%，反映出印度风险投资支持的 B2B
              商业生态正在经历更广泛的市场重置。自成立以来，公司通过股权、可转债和结构化债务工具累计融资超过 $1.95 billion 至 $2.7 billion，共完成 20
              轮融资。股权结构表的战略性整合包括：Swiggy 以价值 ₹500 crore 的 Lynk Logistics 转让取得 Udaan 2.8% 股权，并直接注入 ₹75 crore 现金，额外取得 0.4%
              股权。虽然 2024 年 1 月较早的结构化债务转换确立了 $1.75 billion 的基准估值，但当前 $1.8 billion 股权估值对应公司 FY25 追踪营收约 2.8x 至
              3.2x。相较于经历类似重组的私营同业，这一倍数算合理；但鉴于公司缺乏公开审计资产负债表披露，对新资本并没有足够的安全边际。因此，在营运资金表现得到验证前，我们启动覆盖，给出 Track
              建议、高风险评级和中等置信度。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV008
              - CV012
              - CV014
