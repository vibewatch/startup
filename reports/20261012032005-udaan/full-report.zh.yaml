      - number: '2.3'
        title: 买方分层、预算归属与采用路径
        blocks:
          - type: paragraph
            body: >-
              eB2B 采用者包括社区 Kirana、Tier-2/3 城镇 Bharat 商户、机构 HoReCa
              买家和独立药房。小商户受营运资本、仓储和分销加价约束，采购频率、满足率、透明定价、定期配送与正规信贷是主要采用触发点。horeca360 服务的机构买家客单和复购更高，使 Udaan 能在
              Bengaluru、Hyderabad 等枢纽取得更高毛贡献率。
