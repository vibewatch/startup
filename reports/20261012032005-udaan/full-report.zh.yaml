    summary: 将运营收缩、单位经济性、融资结构和退出催化剂串联至“跟踪”建议的分析链。
    data:
      nodes:
        - label: 1. 运营收缩
          detail: 从 80 多座城市收缩至 16 个高密度集群；总收入降至 ₹4,561 Cr
          tone: warning
        - label: 2. 单位经济性转向
          detail: 年度 EBITDA 烧钱减少 40%，贡献利润率扩大 300+ bps
          tone: positive
        - label: 3. 当前融资基准
          detail: 以 $1.8B 平价估值获得 $114M Series G 股权融资，避免折价轮稀释
          tone: neutral
        - label: 4. 资本结构悬置
          detail: 存在债权人重组、可转债转换和私募信贷债务历史
          tone: negative
        - label: 5. 退出催化剂与注册地
          detail: NCLT 实体整合并反向迁册至印度，目标在 2028 年初上市
          tone: positive
        - label: 6. 建议：跟踪
          detail: 在经审计的 FY26 现金流及债务到期披露确认安全之前，暂不改变立场
          tone: warning
    approximationNotes: 该流程序列梳理了从经营表现到最终投资立场的决策门控路径。
