  - id: TV001
    title: 建议汇总表
    columns:
      - 指标 / 维度
      - 立场 / 评级
      - 关键证据与依据
      - 决策含义
    rows:
      - - 建议
        - 跟踪
        - 单位经济性正在扭转，但收入质量和债务契约仍需核实。
        - 维持跟踪立场；在投入资金前，等待经审计的 FY26 财务报表和现金续航披露。
      - - 置信度
        - 中
        - 公开披露确认融资 $114M 股权资金及年度烧钱减少 40%，但债务到期细节仍不透明。
        - 足以勾勒风险收益方向，但仍需对营运资金开展验证性尽调。
      - - 风险评级
        - 高
        - 债务重组、过往债券违约、高管频繁更替，以及即时零售和 Reliance 的激烈竞争。
        - 高风险意味着必须严控进入估值，并设置清晰的下行保护。
      - - 估值立场
        - 合理
        - 当前 $1.8B 估值是在峰值 $3.2B 下跌 44% 后平价融资形成的，收入定价倍数为 2.8x-3.2x。
        - 相较私募市场基准，当前估值合理，但给新资金留下的安全边际有限。
    notes: 估值立场和建议综合了已报道的 Series G 股权条款、历史融资轮次及 B2B 同业估值基准。
    claimRefs:
      - CV001
      - CV002
      - CV006
      - CV009
      - CV014
  - id: TV002
    title: 投资论点 / 反论点表
    columns:
      - 维度
      - 投资论点
      - 反论点 / 反向证据
      - 什么会改变判断
    rows:
      - - 市场领导力与网络密度
        - 保持 eB2B 头部地位，在 16 个高密度、盈利的消费集群服务 200,000 家活跃 Kirana 店。
        - 从 80 多座城市收缩至 16 座，使 FY25 收入从峰值 ₹10,000 Cr 降至 ₹4,561 Cr。
        - 在不扩大 EBITDA 烧钱的情况下，二、三线城市的交易量增长、市场份额回升已有明确表现。
      - - 单位经济性与利润率改善
        - 集群模式使贡献利润率提升 300+ bps，并连续三年将 EBITDA 年度烧钱减少 40%。
        - 原材料成本占运营费用超过 75%，毛利率极易受到价格战冲击。
        - 连续多个季度保持集团 EBITDA 为正并产生自由现金流。
      - - 资本结构与融资
        - 从 M&G 和 Lightspeed 获得 $114M Series G 股权融资，维持 $1.8B 的稳定估值基准。
        - 债券违约后的过往债务重组，以及对可转债和私募信贷的依赖，造成清算优先权悬置。
        - 清晰的资本结构披露显示不存在清算优先权悬置或高级债务契约负担。
      - - 战略协同与整合
        - 收购 ShopKirana 和 Lynk Logistics 将 Info Edge、Swiggy 纳入股权结构表，并扩大 FMCG 覆盖。
        - 不同供应链的整合复杂度和执行风险，可能推迟原定 2028 年 IPO。
        - 合并仓储网络已有并购完成后的利润率扩张和运营整合里程碑记录。
    notes: 投资论点和反论点驱动因素，用历史烧钱及债权人重组记录检验扭转的持续性。
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV006
      - CV008
      - CV009
      - CV010
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 估值 / 隐含倍数
      - 关键下行触发因素
      - 概率信号
    rows:
      - - 乐观情景
        - 2027 年实现集团 EBITDA 盈亏平衡；收入按 20% CAGR 增长至 ₹6,500 Cr；2028 年 IPO 成功，收入倍数为 4.0x。
        - $2.6B - $3.2B 估值（相对 $1.8B 入场估值回报 1.4x - 1.8x）
        - 无法维持 FMCG 配送密度，或主要品牌供应商合作意外流失。
        - 概率 25%；取决于快速执行及温和的公开市场环境。
      - - 基准情景
        - 收入温和增长 5-10% 至 ₹4,800-₹5,200 Cr；现金流盈亏平衡推迟至 2028 年；退出收入倍数为 2.5x-3.0x。
        - $1.4B - $1.9B 估值（相对 $1.8B 入场估值回报 0.8x - 1.05x）
        - 即时零售侵蚀 Kirana 采购频次；库存营运资金周期拉长。
        - 概率 55%；反映扭转进展与行业利润率压力并存。
      - - 悲观情景
        - EBITDA 烧钱重新加速；债权人债务义务触发资本重组；按收入 1.2x-1.5x 进行折价轮或结构化救助。
        - $700M - $900M 估值（相对 $1.8B 入场估值回报 0.4x - 0.5x）
        - 无法为私募债务工具再融资；债权人介入或领导层剧烈更替。
        - 概率 20%；过往债务重组历史和 B2B 同业估值减记强化了这一情景。
    notes: 情景分析以 FY25 收入基数 ₹4,561 Cr、历史同业交易倍数及债务契约为基础，模拟退出结果。
    claimRefs:
      - CV004
      - CV006
      - CV007
      - CV009
      - CV011
      - CV014
