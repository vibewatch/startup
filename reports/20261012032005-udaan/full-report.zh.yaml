      - number: '2.4'
        title: 采用约束、资本密集度与尽调不确定性
        blocks:
          - type: paragraph
            body: >-
              数字 B2B 平台受低分销毛利、营运资本占用和信用风险约束。传统 Kirana 依赖批发商滚动赊账，数字平台必须用资产负债表放贷或金融科技合作匹配。Udaan
              债券偿付紧张后重组债权人主张的债权，说明慢周转库存和长期应收款会放大增长期债务脆弱性。因此从 80 城退至 16 个集群，长期可行性取决于配送密度、仓库吞吐和订单贡献利润，而非全国覆盖。
            claimRefs:
              - CM007
              - CM008
              - CM012
              - CM013
              - CM015
      - number: '2.5'
        title: 展品
        blocks:
          - type: callout
            title: B2B 批发中的营运资本拖累与债务压顶
            body: 市场规模虽达 $100–$200 billion，B2B 分销平台仍面临贸易信贷周期拉长和库存成本造成的流动性风险。Udaan 的债权人重组说明，不带集群贡献利润就快速做大收入，会严重消耗资本。
            calloutType: risk
            claimRefs:
              - CM007
              - CM013
              - CM015
          - type: callout
            title: 集群密度胜过地理广度
            body: Udaan 从 80 城精简至 16 个集群，说明印度零售市场边界由物流密度而非全国覆盖决定。在核心枢纽取得更高采购钱包份额，比碎片化泛印度触达带来更高吞吐和单位经济。
            calloutType: insight
            claimRefs:
              - CM008
              - CM010
              - CM011
              - CM012
