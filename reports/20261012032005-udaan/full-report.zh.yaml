      - number: '8.2'
        title: 运营扭转与战略反方论点
        blocks:
          - type: paragraph
            body: >-
              Udaan 的核心投资逻辑，是把业务从不受约束的地域扩张，纪律性地切换到以集群为单位的单元经济。FY24 至 FY26 期间，管理层有意将运营城市从超过 80 座收缩至 16 个高密度区域集群，优先在
              200,000 家活跃零售门店中推进 FMCG 和 HoReCa 分销。这一战略性收缩使 总运营收入 从 FY22 的峰值 ₹10,000 crore 降至 FY25 约 ₹4,561
              crore，但也成功将净亏损降低 37% 至 ₹1,055 crore。运营纪律使 EBITDA 现金消耗连续三个财年同比下降 40%，贡献利润率扩大 300
              多个基点。反方论点则指向严重的资产负债表包袱和结构性利润率上限。原材料采购仍占运营费用的 75%
              以上，使本就微薄的毛利暴露于快商和资金雄厚的现代贸易集团的激进定价竞争。历史债务违约促成了结构化债权人重组，公司还依赖 BlackRock 提供的 $45 million 私募信贷；高级管理层频繁变动——包括
              FMCG 业务负责人和前集团 CFO 离职——凸显了垂直业务重组期间的执行摩擦。
            claimRefs:
