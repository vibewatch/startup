      - number: '3.3'
        title: 定价架构、信贷与单位经济权衡
        blocks:
          - type: paragraph
            body: >-
              印度批发交易受价格敏感度、营运资本和交易速度影响。Udaan 通过合作非银行金融公司和 UdaanCapital 提供嵌入式授信，缓解小商户现金约束而不直接承担放贷风险。Reliance JioMart
              利用采购杠杆取得优惠条件并把节省传给零售商，偶尔通过 Udaan 网络分销 Campa Cola。平台因此必须维持较低毛利并严控物流效率。
