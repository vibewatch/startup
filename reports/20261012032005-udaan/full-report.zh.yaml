        title: 展品
        blocks:
          - type: callout
            title: 快商分流本地 Kirana 需求
            body: >-
              Blinkit、JioMart、Amazon Now 和 Flipkart 激进铺开快商，对 Udaan 构成下游风险。终端消费者通过 10–15 分钟暗店配送购买 FMCG 后，社区 Kirana
              销售周转下滑，批发补货预算和营运资本周转受挤压。
            calloutType: risk
            claimRefs:
              - CP005
              - CP008
          - type: callout
            title: 微市场集群物流密度
            body: Udaan 转向 2–3 公里微市场集群，把仓库收敛为 16 城 25 个战略设施，聚焦高周转 FMCG 和主食的路线密度与效率，支持毛利率稳定和亏损收窄。
            calloutType: strength
            claimRefs:
              - CP009
