        title: 展品
        blocks:
          - type: callout
            title: 从无边界规模转向核心单位经济
            body: Udaan 从百货、电子和小城市场的激进扩张，退回 16 个核心配送枢纽，退出非必需品类，聚焦高频 FMCG 和杂货。FY25 收入下降 20%，换来了净亏损下降 37% 和更可守的单位利润结构。
