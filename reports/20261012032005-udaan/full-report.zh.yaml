              印度 B2B 分销市场正在重排，Udaan 面对企业集团、横向电商和快商三类挑战者。Reliance Retail 的 JioMart Wholesale 依托 3,100 多家门店和 Smart Bazaar
              快速扩张；Amazon Business、Flipkart Wholesale 依托全国物流；非组织化 mandi 分销商则凭非正式授信和灵活履约守住关系壁垒。
