      - number: '1.3'
        title: 运营规模、品类聚焦与战略里程碑
        blocks:
          - type: paragraph
            body: >-
              Udaan 主要经营必需消费品、高周转杂货、FMCG 和自有品牌主食，淡化生活方式、百货等损害单位经济的品类。平台覆盖超过 300 万注册企业用户，其中 170 万为活跃 Kirana
              零售店、药店和机构客户；核心网络由 16 个主要城市及半城市集群的 25 个区域配送中心组成。udaanExpress 负责履约，UdaanCapital 提供嵌入式营运资本。FY25 监管披露显示，净亏损下降
              37% 至 ₹1,055 crore，经营收入下降 20% 至 ₹4,561 crore。公司目标是依靠区域密度和自有品牌利润扩张实现集团 EBITDA 盈利，并在重组后走向国内上市。
