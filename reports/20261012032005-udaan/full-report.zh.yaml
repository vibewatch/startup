      - number: '2.2'
        title: 市场规模、增长轨迹与分歧明显的行业预测
        blocks:
          - type: paragraph
            body: >-
              Deloitte 和 FICCI 估算，印度零售市场从 2024 年 $1.06 trillion 以 10% CAGR 增至 2030 年 $1.93 trillion。Redseer 预计印度 eB2B
              市场从 2022 年 $5–6 billion 增至 2030 年 $90 billion–$100 billion，CAGR 四成至 45%，零售商平台占交易量七成至 80%；Bessemer 的牛市预测则为
              2030 年 $200 billion，前提是传统分销加速去中介化。
