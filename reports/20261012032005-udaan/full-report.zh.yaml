        title: 能力矩阵与运营差异化
        blocks:
          - type: paragraph
            body: >-
              Udaan 把运营集中在 2–3 公里微市场集群，在 16 城运营超过 25 个配送仓，聚焦 FMCG 和主食以提升配送频次和钱包渗透。该密度模式区别于 Amazon、Flipkart
              的枢纽—辐射网络，后者服务日常易腐主食的单位成本更高。收购 ShopKirana 后，Udaan 进一步加深印度中部商户网络，整合区域供应商关系。
