              - CV014
      - number: '8.4'
        title: 退出准备度、注册地迁移与尽调要求
        blocks:
          - type: paragraph
            body: >-
              Udaan 的流动性路径以预计于 2028 年初进行的 IPO 为核心，并辅以关键的公司治理重组。在 国家公司法法庭 批准后，公司已将技术、物流和批发交易业务整合至 Hiveloop Ecommerce
              Private Limited 旗下。目前，公司正执行 反向迁移，将母公司的注册地从新加坡迁回印度，为在印度交易所上市扫清监管障碍。不过，要具备公开市场可行性，公司必须在 2027 年末前实现可持续的集团
              EBITDA 盈亏平衡，并解决若干重大尽调缺口。潜在投资者必须审查五项强制尽调内容：第一，覆盖 FY24 至
              FY26、用于确认不受限制现金跑道的经审计现金流量表；第二，完整披露债务到期安排、利息覆盖率和可转债清算优先权；第三，UdaanCapital 的信贷损失拨备和应收账款账龄；第四，ShopKirana 和
              Lynk Logistics 收购后的贡献利润率记分卡；第五，在快商竞争加剧下，各集群的 kirana 留存率。
            claimRefs:
              - CV007
              - CV013
      - number: '8.5'
        title: 附录
        blocks:
          - type: callout
            title: 投资立场：资产负债表透明度待确认
            body: 尽管 Udaan 将 EBITDA 消耗每年削减 40%、并聚焦 16 个核心消费集群，展现了运营纪律，但考虑到历史债务重组、可转债包袱以及缺乏经审计现金流披露，当前 $1.8B 私募估值几乎没有安全边际。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV006
              - CV009
              - CV014
