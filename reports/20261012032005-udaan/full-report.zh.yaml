            body: >-
              Udaan 的单位经济扭转靠区域邮编集群模式。集群转型让所有微集群贡献利润为正，客户钱包份额提升 20%、每位零售商购买商品数增加 25%、平均订单金额上升。收入链路把数字需求导入微履约中心，收取分销费并用
