        title: 切换动态、护城河韧性与替代威胁
        blocks:
          - type: paragraph
            body: >-
              小零售商在 Udaan、区域现金批发商和 mandi 分销商之间拆单几乎没有摩擦。KPMG 显示只有 63% 非组织化商户对数字支付感兴趣。Blinkit 等快商已运营超过 2,243 家暗店并实现调整后
              EBITDA 盈利，用 10–15 分钟配送绕过 Kirana，压低 B2B 平台最终服务的补货量。
