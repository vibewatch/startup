      - Udaan 方案
      - 可衡量收益
      - 限制 / 摩擦
    rows:
      - - 零售库存采购
        - 亲自前往批发市场、多方经纪谈判、人工安排运输
        - 通过 Android 移动应用订购 1,600+ 个 SKU，并按计划送货上门
        - 消除线下奔波、价格不透明与分散的经纪费
        - 最低订单量要求可能挤压小型 kirana 的现金储备；也会出现阶段性缺货
      - - 商户 KYC 与入驻
        - 提交纸质文件、贸易核验，处理周期长达数周
        - 用手机号数字化入驻，并上传 GSTIN 或市政商店许可证
        - 直接在应用内完成 KYC 核验，用时不到 10 分钟
        - 文件要求会排除没有正式市政许可证的未注册微型商户
      - - 贸易信贷融资
        - 非正式经销商赊账，利率偏高或必须严格货到付款
        - 嵌入式 UdaanCapital 信贷额度，与非银行金融合作伙伴共同融资
        - 无需实物抵押即可获得机构化营运资金；还款透明
        - 授信上限取决于交易历史与第三方 NBFC 的风险偏好
      - - 订单追踪与结算
        - 手工纸质收据、运输途中无跟踪，与承运商靠口头解决争议
        - 应用内订单追踪、自动税务开票与集成式 UPI 支付网关
        - 数字化交付凭证、实时货运状态与自动记账
        - 退货接收受严格的品类检验窗口与退货指引约束
    notes: 工作流对比综合 Udaan 平台能力、移动端入驻文件与零售分销惯例；偏远邮编地区的服务水平差异尚未披露。
