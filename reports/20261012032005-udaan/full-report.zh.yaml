        title: 市场边界、结构范围与排除品类
        blocks:
          - type: paragraph
            body: >-
              印度商业版图由超过 1,500 万家独立 Kirana 门店和小商户支撑，传统贸易约占零售量 83%，基础杂货中超过 90%。Udaan 的可服务市场，是把传统 B2B 商户采购数字化，连接小零售商与 FMCG
              制造商和农业磨坊。公司聚焦主食、品牌包装食品、日常个护和机构餐饮用品，持续退出高资本占用的生活方式及消费电子品类。
