chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、创始背景与治理
        blocks:
          - type: paragraph
            body: >-
              Udaan 于 2016 年由 Amod Malviya、Vaibhav Gupta 和 Sujeet Kumar 在 Bengaluru 创立，三人此前均是 Flipkart
              高管，目标是把印度分散的小零售供应链数字化。公司通过电子 B2B（eB2B）交易市场，把制造商、全国及区域品牌、批发商直接连接到独立社区 Kirana 零售商、药店和机构餐饮运营商，覆盖主食、杂货和
              FMCG。核心国内业务由 Hiveloop E-Commerce 承载，历史上置于注册地在新加坡的控股架构下。随着公司转向公开市场，治理和高管体系制度化；联合创始人 Vaibhav Gupta 出任
              CEO，推动收紧单位经济、削减冗余人力并重构公司实体。2025 年 1 月，NCLT 批准把运营整合到 Hiveloop E-Commerce，公司通过新加坡控股主体反向合并，将印度总部确立为计划 IPO
              前的主要上市实体。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO004
              - CO005
              - CO015
      - number: '1.2'
        title: 资本化历程、估值重置与重组
        blocks:
          - type: paragraph
            body: >-
              Udaan 早期高速增长，2018 年完成 $225 million 融资后成为独角兽；2021 年 1 月融资后投后估值一度达 $3.2 billion。资本环境转弱和广覆盖 B2B
              电商的高消耗，促使公司从不计成本扩张转向收缩。2023 年 12 月，公司完成 $340 million 融资，含债务转换和股权，由 M&G Investments 与 Lightspeed Venture
              Partners 领投，估值降至约 $1.8 billion。为补充流动性，Udaan 于 2025 年中完成 $114 million 延长版 Series G，估值维持 $1.8
              billion；债务、可转债和股权累计融资 $1.95 billion。公司退出非核心百货和电子品类，将仓库从 80 个城市缩至 16 个核心枢纽，并多轮精简人员。
            claimRefs:
