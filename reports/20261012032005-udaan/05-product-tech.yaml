callouts:
  - calloutType: strength
    title: "Regional Cluster Density Bolstered by ShopKirana Sourcing Integration"
    body: "The $23.13 million all-stock acquisition of ShopKirana provides Udaan with mature operational hubs across Tier-2 and Tier-3 urban markets in Indore, Bhopal, and Lucknow. Integrating ShopKirana's local retailer relationships and FMCG distribution nodes reinforces Udaan's micro-market operating strategy, supporting higher order frequencies, improved truckload density, and lower last-mile fulfillment expense."
    claimRefs:
      - CE008
      - CE009
      - CE010
      - CE011
  - calloutType: risk
    title: "Working Capital Friction and Physical Distribution Bottlenecks"
    body: "Despite continuous software enhancements and mobile app updates, Udaan remains fundamentally tethered to physical warehousing, transportation logistics, and short-term trade credit. As demonstrated by past creditor restructurings after a bond default and ongoing retailer complaints regarding stock-outs and delivery delays, operational leverage remains vulnerable to supply-chain disruptions and receivable collection cycles."
    claimRefs:
      - CE013
      - CE014
