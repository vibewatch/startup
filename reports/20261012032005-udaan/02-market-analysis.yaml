callouts:
  - calloutType: "risk"
    title: "Working Capital Drag and Debt Overhang in B2B Wholesale"
    body: "While gross market sizing estimates range up to $100-$200 billion, venture-backed B2B distribution platforms face structural liquidity risks from extended trade credit cycles and inventory holding costs. Udaan's recent creditor restructuring highlights how rapid topline scaling without cluster-level contribution profitability risks severe capital depletion."
    claimRefs:
      - "CM007"
      - "CM013"
      - "CM015"
  - calloutType: "insight"
    title: "Cluster Density Supersedes Geographic Breadth"
    body: "Udaan's rationalization from 80 cities to 16 dense clusters demonstrates that addressable market capture in Indian retail is bounded by logistics density rather than national footprint. Winning high procurement wallet share within core urban hubs generates superior warehouse throughput and unit economics compared to fragmented pan-India reach."
    claimRefs:
      - "CM008"
      - "CM010"
      - "CM011"
      - "CM012"
