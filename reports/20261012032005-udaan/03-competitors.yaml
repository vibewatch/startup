callouts:
  - calloutType: "risk"
    title: "Quick Commerce Siphoning Local Kirana Demand"
    body: "The aggressive rollout of quick commerce networks by Blinkit, JioMart, Amazon Now, and Flipkart poses a structural downstream risk to Udaan. As end consumers increasingly purchase daily FMCG essentials via 10-15 minute dark-store delivery, neighborhood kirana stores face declining sales velocity, compressing their wholesale reordering budgets and working capital turnover."
    claimRefs:
      - "CP005"
      - "CP008"
  - calloutType: "strength"
    title: "Micro-Market Cluster Logistics Density"
    body: "By reorienting operations into 2-3 km micro-market clusters and streamlining warehouse footprints to 25 strategic facilities across 16 cities, Udaan has focused on route density and operational efficiency in high-turnover FMCG and staples, supporting gross margin stabilization and loss reduction."
    claimRefs:
      - "CP009"
      - "CP011"
