              - CO015
      - number: '1.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Strategic Transition from Unconstrained Scale to Core Unit Economics
            body: >-
              Udaan's corporate trajectory highlights a fundamental shift common among high-burn Indian eB2B platforms.
              Having expanded aggressively across general merchandise, electronics, and small-town geographies, the
              enterprise incurred massive logistics and inventory overheads. By deliberately curtailing operations to 16
              core distribution hubs, exiting non-essential categories, and refocusing on high-frequency FMCG and
              groceries, Udaan demonstrated that top-line contraction (down 20% in FY25) was a required trade-off to
              achieve a 37% reduction in net losses and build a defensible unit-level margin profile.
            calloutType: insight
            claimRefs:
              - CO008
              - CO009
              - CO012
          - type: callout
            title: Capital Structure Reset and Valuation Recovery Headwinds
            body: >-
              While Udaan successfully raised $114 million in Series G funding in mid-2025, its valuation remained
              capped at $1.8 billion—a steep 44% decline from its 2021 peak of $3.2 billion. Moreover, persistent senior
              leadership turnover, including the departure of key business heads, alongside debt obligations totaling
              ₹300 crore in venture debt, leaves the enterprise with narrow margin for execution error as it prepares
              for a domestic public listing within an 18-month window.
            calloutType: risk
            claimRefs:
              - CO006
              - CO007
              - CO011
              - CO015
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Structural Scope, and Excluded Segments
        blocks:
          - type: paragraph
            body: >-
              India's commerce landscape is anchored by a vast, distributed network of over 15 million independent
              kirana storefronts and small merchants that form the primary distribution channel for food staples,
              groceries, and fast-moving consumer goods. Traditional trade accounts for approximately 83 percent of
              overall retail volume and exceeds 90 percent in foundational grocery categories, operating through deeply
              entrenched, multi-tiered wholesale and sub-distributor relationships. Udaan's addressable market boundary
              is defined by the digital transformation of this traditional B2B merchant procurement workflow, connecting
              small retailers directly with FMCG manufacturers and agricultural millers. Rather than pursuing an
              unconstrained universal catalog, Udaan's commercial scope focuses on high-frequency essential
              categories—specifically food staples, branded packaged foods, daily personal care, and institutional food
              service supplies—while systematically exiting capital-intensive discretionary lifestyle and consumer
              electronics categories that bloated historical working capital.
            claimRefs:
              - CM002
              - CM005
              - CM008
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM002
              - CM005
              - CM008
              - CM011
      - number: '2.2'
        title: Market Sizing, Growth Trajectories, and Divergent Industry Forecasts
        blocks:
          - type: paragraph
            body: >-
              Estimates of India's retail and business-to-business commerce addressable market reflect significant
              divergence between top-down macroeconomic consumption aggregates and bottom-up platform-accessible
              wholesale spend. Macroeconomic research by Deloitte and FICCI values India's total retail sector at $1.06
              trillion in 2024, forecasting expansion to $1.93 trillion by 2030 at a 10 percent compound annual growth
              rate driven by rising domestic consumption and urbanizing Tier-2 and Tier-3 markets. However, the
              specialized business-to-business ecommerce (eB2B) segment accessible to digital procurement platforms
              represents a more constrained subset. Redseer Strategy Consultants projects the Indian eB2B market to
              expand from $5-6 billion in 2022 to between $90 billion and $100 billion by 2030 at a CAGR of 40 to 45
              percent, with retailer-focused platforms comprising 70 to 80 percent of addressable transaction volume. In
              contrast, venture capital perspectives such as Bessemer Venture Partners present an aggressive bull-case
              projection of $200 billion by 2030, assuming accelerated disintermediation of traditional distributor
              networks.
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM005
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM008
      - number: '2.3'
        title: Buyer Segmentation, Budget Ownership, and Adoption Pathways
        blocks:
          - type: paragraph
            body: >-
              The commercial adoption of eB2B digital platforms is governed by distinct merchant buyer profiles spanning
              neighborhood kiranas, Bharat merchants in Tier-2 and Tier-3 towns, institutional HoReCa buyers, and
              independent pharmacy operators. Unorganized kirana store owners operate on tight working capital cycles
              and limited physical storage space, making procurement frequency, product fill rates, and transparent
              pricing their primary operational adoption triggers. In semi-urban and rural markets, small merchants face
              restricted product selections and severe distributor markups, driving adoption toward digital platforms
              that bundle scheduled deliveries with access to formal trade credit financing. Furthermore, institutional
              food service buyers through the horeca360 initiative exhibit larger basket sizes and higher recurring
              purchase frequency, enabling Udaan to capture superior gross contribution margins across hotels,
              restaurants, and commercial caterers within concentrated metropolitan hubs such as Bengaluru and
              Hyderabad.
            claimRefs:
              - CM002
              - CM005
              - CM006
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM005
              - CM006
              - CM010
      - number: '2.4'
        title: Adoption Constraints, Capital Intensity, and Diligence Uncertainties
        blocks:
          - type: paragraph
            body: >-
              Despite expansive top-line market projections, digital B2B trade platforms face intense structural
              constraints rooted in low gross distribution margins, intense working capital absorption, and counterparty
              credit risks. Traditional kiranas rely extensively on informal, rolling credit extended by local
              wholesalers, which digital platforms must match either through balance-sheet lending or fintech
              partnerships, exposing operators to collection cycles and provisioning expenses. Recent financial distress
              across Indian venture-backed B2B distribution companies, including debt restructuring and creditor claims
              following bond repayment strain at Udaan, underscores the fragility of growth-era debt structures when
              capital is tied up in slow-turning inventory and extended receivables. Consequently, Udaan's retrenchment
              from 80 cities to 16 dense clusters demonstrates that long-term enterprise viability requires prioritizing
              local delivery density, warehouse throughput, and order contribution profitability over broad,
              unconstrained national territory coverage.
            claimRefs:
              - CM007
              - CM008
              - CM012
              - CM013
              - CM015
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Working Capital Drag and Debt Overhang in B2B Wholesale
            body: >-
              While gross market sizing estimates range up to $100-$200 billion, venture-backed B2B distribution
              platforms face structural liquidity risks from extended trade credit cycles and inventory holding costs.
              Udaan's recent creditor restructuring highlights how rapid topline scaling without cluster-level
              contribution profitability risks severe capital depletion.
            calloutType: risk
            claimRefs:
              - CM007
              - CM013
              - CM015
          - type: callout
            title: Cluster Density Supersedes Geographic Breadth
            body: >-
              Udaan's rationalization from 80 cities to 16 dense clusters demonstrates that addressable market capture
              in Indian retail is bounded by logistics density rather than national footprint. Winning high procurement
              wallet share within core urban hubs generates superior warehouse throughput and unit economics compared to
              fragmented pan-India reach.
            calloutType: insight
            claimRefs:
              - CM008
              - CM010
              - CM011
              - CM012
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: B2B Commerce Landscape and Competitor Segmentation
        blocks:
          - type: paragraph
            body: >-
              India's business-to-business retail distribution market is undergoing a structural realignment as
              tech-enabled platforms, national corporate giants, and hyperlocal fulfillment networks contest the supply
              chains of millions of neighborhood kiranas and small businesses. In this crowded competitive landscape,
              Udaan confronts three distinct categories of challengers: well-capitalized corporate conglomerates, scaled
              horizontal e-commerce platforms, and fast-growing quick commerce networks that indirectly erode local
              store turnover. Reliance Retail's JioMart Wholesale represents the most formidable direct corporate
              incumbent, scaling rapidly by integrating cash-and-carry infrastructure with over 3,100 physical stores
              and Smart Bazaar hypermarket formats. Simultaneously, horizontal retail leaders Amazon Business and
              Flipkart Wholesale leverage substantial multi-category marketplace catalogs and established national
              logistics backbones, while unorganised mandi distributors retain deep relationship moats through informal
              credit lines and flexible fulfillment terms across regional commercial clusters.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP011
      - number: '3.2'
        title: Capability Matrix and Operating Differentiation
        blocks:
          - type: paragraph
            body: >-
              Evaluating platform differentiation requires examining how each market participant balances geographic
              density, catalog breadth, and delivery economics. Following several quarters of business reorganisation
              and cost restructuring, Udaan has concentrated its operational footprint around micro-market fulfillment
              clusters that segment urban centers into 2 to 3 kilometer radii. Operating more than 25 distribution
              warehouses across 16 primary cities, Udaan prioritizes fast-moving consumer goods and essential food
              staples to maximize delivery frequency and drive customer wallet penetration. This localized density model
              contrasts sharply with the hub-and-spoke logistics architectures maintained by horizontal competitors
              Amazon and Flipkart, which excel at general merchandise and consumer electronics but face higher
              distribution unit costs when servicing daily perishable staples. Furthermore, Udaan's strategic
              acquisition of retail-tech startup ShopKirana has deepened its merchant network across Central India,
              allowing the combined business to integrate complementary regional supplier linkages and defend its core
              grocery merchant base.
            claimRefs:
              - CP003
              - CP009
              - CP011
              - CP012
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
              - CP005
              - CP009
              - CP012
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP006
              - CP007
      - number: '3.3'
        title: Pricing Architecture, Credit, and Unit Economics Tradeoffs
        blocks:
          - type: paragraph
            body: >-
              Commercial engagement across India's wholesale retail tier is heavily governed by price sensitivity,
              working capital access, and transaction velocity. While traditional unorganised mandi brokers secure
              retailer loyalty by extending rolling 15 to 30 day credit cycles, tech platforms must balance balance
              sheet discipline against user retention. Udaan facilitates embedded working capital financing through
              partner non-banking financial companies under its UdaanCapital umbrella, providing credit lines that
              alleviate small merchant cash constraints without absorbing direct underwriting risk. In contrast,
              corporate players like Reliance JioMart exploit massive purchasing leverage with fast-moving consumer
              goods manufacturers to secure favorable wholesale procurement terms, passing volume savings to retailers
              while occasionally partnering with platforms for distribution, such as distributing Campa Cola across
              Udaan's retail network. These pricing dynamics force B2B platforms to operate with constrained gross
              margins and maintain strict logistics efficiency.
            claimRefs:
              - CP004
              - CP010
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP001
              - CP004
              - CP010
              - CP013
      - number: '3.4'
        title: Switching Dynamics, Moat Durability, and Substitute Threats
        blocks:
          - type: paragraph
            body: >-
              A fundamental strategic risk confronting Udaan is the minimal friction small retailers face when
              multi-homing across alternative procurement channels. Kirana owners routinely place split orders across
              Udaan, regional cash-and-carry wholesalers, and local mandi distributors depending on spot pricing
              discounts and next-day SKU availability. In addition, small retailers exhibit gradual digital adoption,
              with KPMG research indicating that only 63 percent of unorganised merchants express interest in digital
              payment mechanisms, illustrating structural friction in digital commerce penetration. More critically, the
              rapid operational expansion of consumer quick-commerce platforms like Blinkit, which operates over 2,243
              dark stores and delivers adjusted EBITDA profitability, presents a compounding displacement threat. By
              delivering groceries directly to end consumers in ten to fifteen minutes, quick commerce bypasses
              neighborhood kirana stores entirely, reducing the aggregate retail replenishment volumes that B2B
              platforms ultimately service.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP014
              - CP015
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Quick Commerce Siphoning Local Kirana Demand
            body: >-
              The aggressive rollout of quick commerce networks by Blinkit, JioMart, Amazon Now, and Flipkart poses a
              structural downstream risk to Udaan. As end consumers increasingly purchase daily FMCG essentials via
              10-15 minute dark-store delivery, neighborhood kirana stores face declining sales velocity, compressing
              their wholesale reordering budgets and working capital turnover.
            calloutType: risk
            claimRefs:
              - CP005
              - CP008
          - type: callout
            title: Micro-Market Cluster Logistics Density
            body: >-
              By reorienting operations into 2-3 km micro-market clusters and streamlining warehouse footprints to 25
              strategic facilities across 16 cities, Udaan has focused on route density and operational efficiency in
              high-turnover FMCG and staples, supporting gross margin stabilization and loss reduction.
            calloutType: strength
            claimRefs:
              - CP009
              - CP011
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Pricing Architecture
        blocks:
          - type: paragraph
            body: >-
              Udaan generates revenue across business-to-business wholesale e-commerce, logistics and fulfillment
              services, embedded trade credit financing via udaanCapital, and expanding private label brands. In FY25,
              Udaan's operating revenue contracted by 20% to Rs 4,561 crore as management executed a deliberate
              strategic pullback from non-essential discretionary categories, including lifestyle, electronics, general
              merchandise, and home and kitchen, to focus resources entirely on high-frequency grocery, FMCG, and
              staples. Monetization across wholesale categories relies on dynamic spot pricing and volume tiering, where
              Udaan captures wholesale gross margins between brand manufacturer list prices and retail kirana delivery
              prices. In parallel, udaanCapital operates as a critical monetization and retention engine, disbursing
              short-term working capital credit and invoice financing to kirana stores and small suppliers. While Bain's
              2026 e-retail research highlights that grocery accounts for the vast majority of retail but remains
              structurally underpenetrated online at approximately 1.5%, capturing profitable wholesale revenue requires
              overcoming low category take rates and high inventory handling costs.
            claimRefs:
              - CI001
              - CI002
              - CI010
              - CI012
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI010
          - type: table
            tableRef: TI002
            claimRefs:
              - CI002
              - CI010
              - CI014
      - number: '4.2'
        title: Cost Structure, Gross Margins, and Operational Rationalization
        blocks:
          - type: paragraph
            body: >-
              Udaan's cost structure underwent substantial contraction during FY25 as part of an aggressive
              restructuring program initiated to contain historical cash burn. Singapore regulatory filings show that
              employee benefit expenses fell by 22% during FY25 to Rs 500 crore, reflecting continuous workforce
              rationalization and operational decentralization across functional teams. Finance costs, primarily
              expenses incurred on servicing debt and credit facilities, halved from prior-year levels to Rs 185 crore.
              Other operating expenses—encompassing logistics freight, warehousing leases, outsourced manpower, legal
              retainers, and marketing—declined from Rs 724 crore in FY24 to Rs 545 crore in FY25. Management asserts
              that annual EBITDA burn decreased by 40% annually over the last three years, with group-level EBITDA
              profitability targeted within 18 months. Furthermore, company disclosures cite over 60% year-on-year
              revenue expansion in continuing businesses during CY2024 alongside an expansion of more than 300 basis
              points in contribution margins, supplemented by an additional 100 basis point gain year-to-date in CY2025.
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI008
              - CI009
          - type: table
            tableRef: TI003
            claimRefs:
              - CI001
              - CI004
              - CI008
              - CI009
      - number: '4.3'
        title: Cluster-Level Unit Economics and Revenue Conversion Bridge
        blocks:
          - type: paragraph
            body: >-
              The core mechanism driving Udaan's reported unit economics turnaround is its operational reorganization
              into a regional pin-code cluster model. Rather than serving expansive pan-India territories with unified
              national logistics, Udaan reorganized operations across high-density geographic micro-clusters. According
              to senior finance leadership disclosures, this cluster transition pushed all operating micro-clusters into
              contribution-margin positivity, driven by a 20% increase in customer wallet share, a 25% increase in
              products purchased per retailer, and a corresponding rise in average order value. The revenue conversion
              flow bridges digital kirana demand generation directly into local micro-fulfillment hubs, capturing
              distribution fees and merchant transaction volumes while offering udaanCapital credit lines to accelerate
              inventory turnover. Operational logistics expenses fell to Rs 545 crore as cluster density reduced
              last-mile delivery miles and eliminated unprofitable non-essential handling overhead.
            claimRefs:
              - CI003
              - CI005
              - CI010
              - CI014
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI003
              - CI005
              - CI010
              - CI014
      - number: '4.4'
        title: Capital Adequacy, Burn Rate, and Financing Dependency
        blocks:
          - type: paragraph
            body: >-
              Udaan's capital adequacy profile reflects an ongoing reliance on structured equity infusions to navigate
              legacy debt obligations and fund its path toward public listing. In mid-2025, Udaan secured $114 million
              in a flat Series G equity financing round led by existing sponsors M&G Investments and Lightspeed Venture
              Partners at an unchanged valuation of $1.8 billion, following a larger $340 million round in late 2023
              that converted convertible notes into equity. However, independent financial reporting indicates that
              venture-backed B2B companies in India remain severely burdened by growth-era debt; Udaan had to
              restructure creditor claims following a bond default, underscoring how fixed debt service obligations
              compete directly with operating liquidity. While workforce reductions decentralized FMCG sales teams and
              brought self-reported Glassdoor headcounts into the 1,001 to 5,000 employee range, Udaan has not disclosed
              audited balance sheet cash balances, bank credit covenants, or receivables delinquency aging, leaving
              forward cash runway as an unresolved diligence blocker.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI011
              - CI013
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Debt Service Overhead and Creditor Restructuring
            body: >-
              Udaan's growth-era debt overhang and creditor claim restructuring after a bond default highlight acute
              capital structure vulnerabilities, where ongoing interest and principal obligations compete directly with
              operating working capital.
            calloutType: risk
            claimRefs:
              - CI004
              - CI006
          - type: callout
            title: Cluster-Level Efficiency vs Top-Line Scale Trade-Off
            body: >-
              The strategic transition from pan-India coverage to regional pin-code clusters enabled Udaan to achieve
              contribution margin positivity across active clusters and reduce EBITDA burn by 40%, but resulted in an
              explicit 20% contraction in FY25 operating scale.
            calloutType: insight
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI008
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Buyer Workflow and Digital Merchant Onboarding
        blocks:
          - type: paragraph
            body: >-
              Udaan's core customer value proposition centers on replacing the fragmented, manual procurement workflows
              traditionally endured by independent kiranas, chemists, and institutional buyers across India. Rather than
              negotiating with disparate middlemen or traveling to congested wholesale mandis, retail merchants interact
              with Udaan through a dedicated mobile commerce interface that aggregates over 1,600 stock keeping units
              across high-velocity staples, packaged consumer goods, and pharmaceutical essentials. Digital onboarding
              is engineered for rapid adoption in non-metro trade hubs, allowing merchants to register with a mobile
              number and complete Know Your Customer verification in under ten minutes by submitting either a Goods and
              Services Tax Identification Number or a municipal Shop License. The app provides end-to-end visibility
              across catalog pricing, scheduled repeat orders, delivery status tracking, and digital tax invoices,
              reducing administrative overhead for mom-and-pop store operators. Furthermore, to overcome chronic working
              capital constraints that limit merchant purchase volumes, the workflow embeds short-term credit facilities
              via UdaanCapital directly at the checkout stage, enabling qualified retailers to finance inventory
              purchases through non-banking financial partner lines.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
      - number: '5.2'
        title: Core Product Modules and Category Footprint
        blocks:
          - type: paragraph
            body: >-
              The platform's commercial architecture is structured around core high-frequency trade verticals, dominated
              by Food & FMCG alongside Healthcare & Pharma, supplemented by staples and private label merchandise. In
              packaged consumer goods, Udaan acts as a scaled regional distribution partner for prominent domestic
              brands—such as Reliance's Campa Cola beverage line and specialty food makers—leveraging its extensive
              buyer base to drive product penetration into retail stores. The Healthcare & Pharma module provides a
              dedicated procurement environment for retail pharmacies, requiring licensed merchant credentials and
              delivering compliant healthcare supplies. To augment distributor margins and enhance merchant wallet
              share, Udaan has developed proprietary private label offerings in commodity staples, aiming to capture
              higher gross margins than branded wholesale items. Cross-cutting these merchandise categories is
              UdaanCapital, the platform's proprietary fintech module. UdaanCapital provides customized credit lines
              that finance trade payables and receivables across buyers and sellers, integrating directly with India's
              Unified Payments Interface rails and automated tax invoicing tools to support seamless transaction
              settlement and ledger reconciliation.
            claimRefs:
              - CE001
              - CE003
              - CE004
              - CE005
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE003
              - CE004
              - CE005
      - number: '5.3'
        title: Operating Stack, Micro-Markets, and ShopKirana Integration
        blocks:
          - type: paragraph
            body: >-
              Udaan executes its commerce operations through what executive leadership defines as a hybrid model uniting
              a high-availability mobile platform with technology-guided on-ground sales and fulfillment capabilities.
              Rather than relying on a centralized, long-haul logistics grid, the company has deployed a hyper-local
              micro-market strategy that clusters fulfillment centers, inventory hubs, and delivery routes within
              bounded urban zones to achieve operational density and control delivery costs. This operating framework
              was materially scaled through the acquisition of Indore-based ShopKirana in an all-stock deal valued at
              $23.13 million by regulatory filings from Info Edge. ShopKirana's established operational networks in
              central and northern Tier-2/3 cities—including Indore, Bhopal, Lucknow, Agra, Surat, and Meerut—were
              folded into Udaan's national supply-chain framework. This regional consolidation is designed to accelerate
              contribution margin gains across level-1 warehousing and level-2 distribution tiers. Management reports
              that disciplined cluster routing and fixed-cost reductions of 20 percent helped trim EBITDA burn by 40
              percent in 2024, positioning the operating stack to target sustainable unit profitability ahead of planned
              public market milestones.
            claimRefs:
              - CE008
              - CE009
              - CE010
              - CE011
              - CE012
              - CE015
