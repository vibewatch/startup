chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Founding Pedigree, and Governance
        blocks:
          - type: paragraph
            body: >-
              Udaan was founded in Bengaluru in 2016 by former Flipkart senior executives Amod Malviya, Vaibhav Gupta,
              and Sujeet Kumar to digitize India's fragmented small-retail supply chain. The company operates an
              electronic business-to-business (eB2B) marketplace connecting manufacturers, national and regional brands,
              and wholesalers directly with independent neighborhood kirana retailers, chemists, and institutional
              foodservice operators across staples, groceries, and fast-moving consumer goods (FMCG). The operating
              entity conducts its core domestic activities through Hiveloop E-Commerce, while historically sitting under
              a Singapore-domiciled holding structure.


              Governance and executive leadership have undergone substantial formalization as the firm transitioned from
              a founder-triumvirate operational structure toward public-market readiness. Co-founder Vaibhav Gupta
              assumed the role of Chief Executive Officer, steering the organization through a multi-year restructuring
              initiative aimed at tightening unit economics, rationalizing redundant workforce overhead, and
              re-architecting corporate entity holdings. In January 2025, the company obtained approval from the
              National Company Law Tribunal (NCLT) to consolidate operations under Hiveloop E-Commerce, executing a
              reverse merger mechanism from its Singapore holding vehicle to establish its domestic India headquarters
              as the primary listing entity ahead of a planned IPO.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO004
              - CO005
              - CO015
      - number: '1.2'
        title: Capitalization History, Valuation Reset, and Restructuring
        blocks:
          - type: paragraph
            body: >-
              Udaan expanded rapidly during its early expansion phase, achieving unicorn status in 2018 upon closing a
              $225 million round and eventually securing a peak post-money valuation of $3.2 billion following its
              January 2021 financing. However, the subsequent capital environment and operational burn inherent to
              broad-line B2B e-commerce prompted a sharp strategic pivot away from growth-at-all-costs expansion. In
              December 2023, Udaan closed a $340 million financing round consisting of debt conversion and equity led by
              UK-based M&G Investments and Lightspeed Venture Partners, resetting its valuation downward to
              approximately $1.8 billion.


              To solidify liquidity without aggressive dilutive haircuts, Udaan concluded an extended Series G equity
              funding round totaling $114 million in mid-2025, co-led by M&G Investments and Lightspeed Venture Partners
              at an unchanged flat valuation of $1.8 billion. Cumulative institutional capital raised across debt,
              convertible notes, and equity reached $1.95 billion. The financing followed disciplined operational
              interventions, including shedding non-core general merchandise and electronics categories, trimming
              warehouse footprints from 80 cities down to 16 core distribution hubs, and executing multiple rounds of
              workforce rationalization to extend balance-sheet runway toward operational self-sustainability.
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
