      - number: '1.3'
        title: Operating Scale, Category Focus, and Strategic Milestones
        blocks:
          - type: paragraph
            body: >-
              Udaan's operational model focuses primarily on essential consumer goods, high-velocity groceries, FMCG,
              and private-label staples, deliberately de-emphasizing discretionary categories like lifestyle and general
              merchandise where margin leakage and high inventory holding costs impaired unit economics. The platform
              supports over 3 million registered business users, including 1.7 million active kirana retail stores,
              chemists, and institutional clients supplied via a core network of 25 regional distribution centers across
              16 primary urban and semi-urban clusters. Logistics and trade credit are delivered via proprietary service
              layers: udaanExpress manages order fulfillment, while UdaanCapital provides embedded working capital
              solutions to solve liquidity constraints for independent store owners.


              Financially, regulatory disclosures for fiscal year 2025 reflected a 37% decline in net losses to ₹1,055
              crore, accompanied by a 20% contraction in operating revenue to ₹4,561 crore resulting from vertical
              exits. The enterprise has set a target of reaching group-level EBITDA profitability on the back of
              regional cluster density and private-label margin expansion. Significant milestones trace the company's
              trajectory from initial platform launch and hyper-expansion to post-restructuring legal consolidation
              under Hiveloop E-Commerce, charting a measured path toward its targeted domestic public listing.
            claimRefs:
              - CO012
              - CO013
              - CO014
              - CO015
              - CO016
          - type: figure
            figureRef: FO001
