  - id: FO001
    title: Udaan Strategic Corporate and Financing Milestones
    type: timeline
    summary: >-
      Chronological evolution of Udaan from founding and hyper-growth unicorn status to structural down-round and
      operational restructuring.
    data:
      items:
        - date: 2016-06
          label: Company Founding
          detail: >-
            Founded in Bengaluru by former Flipkart executives Amod Malviya, Vaibhav Gupta, and Sujeet Kumar to digitize
            B2B retail trade.
          tone: positive
        - date: 2018-09
          label: Unicorn Status Achieved
          detail: Secured $225M in Series C financing, achieving unicorn status faster than any previous Indian startup.
          tone: positive
        - date: 2019-10
          label: Series D Mega-Round
          detail: Raised $585M led by Tencent, Altimeter, and DST Global to expand fulfillment logistics across India.
          tone: positive
        - date: 2021-01
          label: Peak Valuation at $3.2B
          detail: Completed funding round valuing the B2B platform at $3.2 billion amid pandemic digital commerce surge.
          tone: positive
        - date: 2022-11
          label: Workforce Restructuring
          detail: Initiated multi-phase workforce layoffs, trimming over 10% of staff to curb high cash burn.
          tone: negative
