      - number: '5.4'
        title: Mobile App Telemetry, System Reliability, and Operational Risks
        blocks:
          - type: paragraph
            body: >-
              Technical telemetry from the Google Play ecosystem reveals that the flagship Udaan Android application
              represents a substantial native deployment, requiring Android 4.4 or higher, incorporating 60 software
              libraries, and requesting 21 platform permissions within an application package size of 42.52 megabytes.
              While the application maintains broad market penetration with over 12 million cumulative installs and an
              average rating of 4.13 stars across more than 180,000 user reviews, technical and operational stress
              points persist. Merchant feedback indicates recurring service disruptions, including local warehouse
              stock-outs, delayed delivery turnarounds, and unresponsive customer service escalation paths during
              shipment discrepancies. More critically, the broader operating architecture remains exposed to severe
              working capital and liquidity challenges. Macro industry analysis from Boston Consulting Group underscores
              that scaling connected commerce in India requires heavy investment in future-ready logistics and digital
              infrastructure. When capital markets tightened, Udaan's inventory-heavy model triggered creditor
              restructurings following a bond default, demonstrating that technology automation cannot fully insulate
              B2B distribution platforms from the cash-flow volatility inherent in physical trade receivables and
              warehouse carrying costs.
            claimRefs:
              - CE006
              - CE007
              - CE013
              - CE014
              - CE015
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Regional Cluster Density Bolstered by ShopKirana Sourcing Integration
            body: >-
              The $23.13 million all-stock acquisition of ShopKirana provides Udaan with mature operational hubs across
              Tier-2 and Tier-3 urban markets in Indore, Bhopal, and Lucknow. Integrating ShopKirana's local retailer
              relationships and FMCG distribution nodes reinforces Udaan's micro-market operating strategy, supporting
              higher order frequencies, improved truckload density, and lower last-mile fulfillment expense.
            calloutType: strength
            claimRefs:
              - CE008
              - CE009
              - CE010
              - CE011
          - type: callout
            title: Working Capital Friction and Physical Distribution Bottlenecks
            body: >-
              Despite continuous software enhancements and mobile app updates, Udaan remains fundamentally tethered to
              physical warehousing, transportation logistics, and short-term trade credit. As demonstrated by past
              creditor restructurings after a bond default and ongoing retailer complaints regarding stock-outs and
              delivery delays, operational leverage remains vulnerable to supply-chain disruptions and receivable
              collection cycles.
            calloutType: risk
            claimRefs:
              - CE013
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Kirana Network Scale, Supplier Ecosystem, and Market Share
        blocks:
          - type: paragraph
            body: >
              Udaan was founded in 2016 by former senior Flipkart executives with the explicit objective of modernizing
              and digitizing India's highly fragmented general trade ecosystem. According to enterprise disclosures and
              industry reporting, the platform has assembled an active commercial network connecting over 3 million
              small retail kiranas and more than 25,000 suppliers nationwide (CU001). Within the multi-category
              business-to-business e-commerce landscape, research by Redseer Strategy Consultants indicates that
              retailer-facing platforms represent 70% to 80% of total eB2B volume, with Udaan commanding an estimated
              55% to 60% market share in this segment, while corporate claims place its reach at up to 70% of organized
              eB2B distribution (CU002, CU003).

              This extensive footprint enables neighborhood micro-enterprises to aggregate procurement across packaged
              groceries, staples, fast-moving consumer goods (FMCG), and general merchandise. By providing direct access
              to national brands and primary manufacturers, Udaan bypasses multiple layers of traditional wholesale
              intermediaries, offering small proprietors transparent unit pricing, predictable delivery schedules, and
              higher fulfillment fill rates. The scale of this network established Udaan as the primary digital
              wholesale channel across major metropolitan areas and tier-1 distribution corridors, serving as the
              benchmark eB2B supply partner for kiranas seeking inventory resilience.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU005
              - CU006
      - number: '6.2'
        title: 'Operating Realignment: Credit Risk, Cluster Economics, and Financial Contraction'
        blocks:
          - type: paragraph
            body: >
              Between FY22 and FY25, Udaan undertook a substantial strategic shift to repair its underlying unit
              economics and address severe working capital vulnerabilities. Historical market analyses observe that
              Udaan's early reliance on aggressive trade credit disbursement—underwriting unsecured working capital
              directly to micro-retailers to spur app adoption—led to substantial credit defaults and bad debt
              write-offs as informal merchants struggled with collection shocks and inventory overhangs (CU005). In
              response, management curtailed unsecured lending lines, eliminated non-core discretionary product lines,
              and instituted a disciplined regional cluster operating architecture spanning its primary geographic hubs.

              This structural rationalization produced a controlled contraction in consolidated revenues, which declined
              by nearly 20% from ₹5,706.6 crore in FY24 to ₹4,561.4 crore in FY25 (CU007). However, operational
              discipline simultaneously narrowed consolidated losses by approximately 37%, reducing net deficits from
              ₹1,674.1 crore in FY24 to ₹1,055.4 crore in FY25 while decreasing core EBITDA burn by 40% year-on-year
              (CU006, CU007). In June 2024, Udaan raised $114 million in fresh Series G equity funding from M&G
              Investments and Lightspeed Venture Partners at an unchanged post-money valuation of approximately $1.8
              billion, securing essential runway to execute its cluster-led pathway toward operating break-even ahead of
              a planned public debut (CU006, CU008).
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
      - number: '6.3'
        title: Regional Deepening via ShopKirana and Tier-2/3 Footprint
        blocks:
          - type: paragraph
            body: >
              To consolidate its merchant density across central and northern India without incurring prohibitive
              organic customer acquisition costs, Udaan executed the strategic acquisition of retail-technology startup
              ShopKirana (CU009). Founded in 2015, ShopKirana developed deep procurement relationships with traditional
              retailers across non-metro manufacturing and commercial clusters, maintaining a resilient presence in
              Tier-2 and Tier-3 urban centers including Indore, Bhopal, Lucknow, Agra, Surat, and Meerut (CU010). This
              acquisition added proven regional warehouse infrastructure and feet-on-street merchant coverage, enabling
              Udaan to cross-sell staples and FMCG assortments directly into previously fragmented distributor
              territories.

              Integrating ShopKirana's regional supply lines reinforces Udaan's multi-category density, improving
              dropsize throughput per delivery vehicle and insulating unit margins from the higher shipping overhead
              typical of lower-tier geographies. Furthermore, localized merchant onboarding allows Udaan to refine
              product assortments according to regional consumer taste preferences and unbranded staple milling
              patterns. By shifting focus from sheer pan-India app installs to defensible geographic clusters with high
              order repeat rates, the combined entity protects its regional wholesale dominance against encroachment
              from national modern retail conglomerates and legacy wholesale mandi cartels.
            claimRefs:
              - CU009
              - CU010
              - CU011
          - type: table
            tableRef: TU003
            claimRefs:
              - CU009
              - CU010
              - CU011
      - number: '6.4'
        title: Macro Retail Shifts and Hyperlocal Quick Commerce Headwinds
        blocks:
          - type: paragraph
            body: >
              The operating landscape for Udaan's core customer base is increasingly shaped by the dramatic rise of
              hyperlocal quick commerce delivery services across urban India. Platforms including Blinkit, Swiggy
              Instamart, Zepto, and Reliance Retail's JioMart have aggressively expanded localized dark store
              footprints, with Blinkit posting 95.4% year-on-year growth in net order value and expanding to 2,243
              fulfillment nodes in Q4 FY26, alongside JioMart scaling its hyperlocal store-backed model to 2 million
              daily orders across 3,100+ retail stores (CU013, CU014). Major marketplace operators like Flipkart also
              launched dedicated quick delivery networks to capture convenience-driven consumer spending in metropolitan
              centers (CU012).

              These rapid delivery ecosystems present a dual dynamic for Udaan's kirana clientele. On one front, instant
              delivery platforms divert high-margin impulse packaged goods and top-up grocery purchases away from
              offline neighborhood stores in Tier-1 cities, compressing retail footfall and placing margin pressure on
              standalone merchants. Conversely, small store proprietors must respond by optimizing inventory turnover,
              replenishing stock in smaller, higher-frequency batches, and focusing on localized staples and fresh
              perishables. This structural retail evolution compels Udaan to refine its supply chain logistics, ensuring
              same-day or next-day warehouse replenishment to preserve kirana relevance amidst an intensifying battle
              for end-consumer wallet share.
            claimRefs:
              - CU012
              - CU013
              - CU014
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Trade Credit Dilemma in Informal Kirana Commerce
            body: >
              In India's unorganized general trade sector, traditional wholesalers have long extended informal,
              relationship-based credit to kirana merchants. In its initial high-growth phase, Udaan attempted to
              digitize this dynamic through aggressive unsecured credit underwriting, providing credit lines to drive
              app order volumes. However, the dispersion of micro-retailers and absence of formal financial
              documentation led to significant default rates and bad debts. Udaan's recent turnaround pivot—curtailing
              credit risk, accepting a 20% revenue contraction to ₹4,561.4 crore in FY25, and slashing core EBITDA burn
              by 40% via localized clusters—demonstrates that disciplined working capital governance and unit-level
              profitability have superseded unconstrained top-line expansion as the platform prepares for its public
              markets debut.
            calloutType: risk
            claimRefs:
              - CU005
              - CU006
              - CU007
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Capital Structure, Debt Service, and Financial Model Risks
        blocks:
          - type: paragraph
            body: >-
              Udaan's financial model remains constrained by substantial structured indebtedness accumulated during
              aggressive growth cycles. To address impending maturities and simplify its balance sheet ahead of public
              listing preparations, the company announced an approximately $160 million structured financing transaction
              comprising fresh equity, new debt, and debt-to-equity conversions. As part of this arrangement, a leading
              global investment manager committed approximately $45 million in fresh debt through its private credit
              platform. This financing follows earlier debt distress across India's venture-backed B2B sector, where
              Udaan had to restructure creditor claims following a convertible bond default. The platform had previously
              raised $350 million in structured convertible instruments over four quarters, creating an overhang of
              creditor claims and potential dilution. Although a $114 million Series G equity round in June 2025
              anchored its valuation at $1.8 billion, debt service obligations and ongoing liquidity needs remain
              primary vulnerabilities if operational cash flow falls short.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR012
      - number: '7.2'
        title: Operational Execution, Supply Chain Friction, and Talent Attrition
        blocks:
          - type: paragraph
            body: >-
              Transforming B2B e-commerce operations from subsidized hyper-growth to sustainable unit economics has
              introduced substantial internal friction. Udaan executed aggressive cost-cutting programs, reducing fixed
              overhead through multiple workforce reductions that eliminated more than 1,000 contract and on-roll jobs.
              While these measures helped narrow losses, the business has suffered destabilizing executive turnover,
              including the resignation of FMCG business head Vinay Shrivastava alongside earlier departures of the
              group CFO and senior vertical leaders. These departures coincided with a sweeping internal reorganization
              that merged essentials and discretionary product verticals. Furthermore, trading inventory risks remain
              pronounced, with material procurement costs accounting for 75.3% of total expenses and rising despite
              stagnant top-line revenue. Integrating ShopKirana's regional Tier 2 and Tier 3 network presents further
              execution complexity across warehousing systems, SKU standardization, and localized supplier
              relationships.
            claimRefs:
              - CR006
              - CR007
              - CR010
              - CR011
          - type: table
            tableRef: TR002
            claimRefs:
              - CR006
              - CR007
              - CR010
              - CR011
      - number: '7.3'
        title: Regulatory Compliance, Trademark Disputes, and Corporate Redomiciliation
        blocks:
          - type: paragraph
            body: >-
              Udaan operates under evolving legal and regulatory frameworks governing foreign direct investment in
              Indian multi-brand retail and e-commerce. To comply with FDI regulations, the platform maintains a
              separate wholesale trade and technology infrastructure model that requires ongoing regulatory scrutiny. In
              March 2026, Udaan initiated a corporate reverse flip to transition its holding structure from Singapore to
              India ahead of its domestic IPO, exposing the company to cross-border tax liabilities, stamp duties, and
              regulatory approvals across jurisdictions. Concurrently, intellectual property and trademark protections
              require constant defense. In one notable dispute, a Delhi court permanently restrained Sainus
              Pharmaceutical from using the 'Udaan' mark after trademark infringement proceedings initiated by RSPL
              Health. While Udaan maintained its $1.8 billion valuation mark in its Series G round, regulatory delays in
              corporate redomiciliation or trademark complications could introduce significant timing friction to its
              public market roadmap.
            claimRefs:
              - CR004
              - CR008
              - CR011
          - type: table
            tableRef: TR001
            claimRefs:
              - CR003
              - CR004
              - CR008
      - number: '7.4'
        title: Market Consolidation, Competitive Threats, and Investment Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              Competitive dynamics in Indian B2B e-commerce are intensifying as well-capitalized rivals pursue strategic
              scale. Rival platform Jumbotail secured $120 million in funding led by SC Ventures and absorbed Solv
              India, creating a formidable combined network serving over 500,000 retailers across 400 cities. Meanwhile,
              Udaan's gross revenue remained largely flat in FY24 at Rs 5,706.6 crore compared to Rs 5,609.3 crore in
              FY23, well below its historical peak of Rs 9,900 crore. Industry research indicates that while market
              consolidation has improved customer service benchmarks and operational density for surviving incumbents,
              top-line deceleration limits operating leverage. Management has curtailed annual EBITDA burn by roughly
              36% to 40% year-on-year, yet sustained viability depends on defending cluster margins against
              deep-pocketed competitors like Amazon Business and JioMart Partners. Key kill criteria include credit
              facility covenant breaches, customer churn following credit tightening, or renewed revenue contraction.
            claimRefs:
              - CR009
              - CR012
              - CR013
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR006
              - CR007
              - CR008
              - CR010
              - CR012
              - CR013
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Capital Structure Fragility and Refinancing Dependencies
            body: >-
              Despite raising $160 million in structured financing in 2026 and $114 million in Series G equity in 2025,
              Udaan remains heavily dependent on private credit flexibility and creditor forbearance. Having previously
              restructured creditor claims following a convertible bond default, any failure to achieve sustained
              operating EBITDA profitability could jeopardize its IPO readiness and trigger sharp dilution or covenant
              acceleration.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Current Valuation Context
        blocks:
          - type: paragraph
            body: >-
              Udaan closed a $114 million Series G equity round led by M&G Investments and Lightspeed Venture Partners,
              holding its valuation flat at approximately $1.8 billion. This mark represents a 43.8% contraction from
              the company's peak private valuation of $3.2 billion achieved in January 2021, reflecting a broader market
              reset across India's venture-backed B2B commerce ecosystem. Cumulative capital raised across equity,
              convertible notes, and structured debt facilities exceeds $1.95 billion to $2.7 billion across 20
              financing rounds since inception. Strategic cap table consolidation includes Swiggy taking a 2.8% equity
              stake in Udaan through the transfer of Lynk Logistics valued at ₹500 crore, supplemented by a direct ₹75
              crore cash infusion for an additional 0.4% ownership. While earlier structured debt conversions in January
              2024 established a baseline valuation of $1.75 billion, the current $1.8 billion equity valuation prices
              the company at approximately 2.8x to 3.2x trailing FY25 revenues. This multiple is fair relative to
              private peers undergoing comparable restructuring, but it does not provide an attractive margin of safety
              for new capital given the lack of public audited balance sheet disclosures. Consequently, we initiate
              coverage with a Track recommendation, a high risk rating, and a medium confidence level pending verified
              working capital performance.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV008
              - CV012
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV009
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV007
              - CV009
              - CV013
              - CV014
      - number: '8.2'
        title: Operating Turnaround and Strategic Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The central investment thesis for Udaan rests on its disciplined operating transition from unconstrained
              geographic expansion to cluster-level unit economics. Between FY24 and FY26, management intentionally
              retrenched operations from over 80 cities to 16 high-density regional clusters, prioritizing FMCG and
              HoReCa distribution across 200,000 active retail storefronts. This strategic pruning reduced gross
              operating revenue from a peak of ₹10,000 crore in FY22 to approximately ₹4,561 crore in FY25, but
              successfully lowered net losses by 37% to ₹1,055 crore. Operating discipline delivered a 40%
              year-over-year reduction in EBITDA cash burn across three consecutive fiscal cycles, accompanied by a
              300-plus basis point expansion in contribution margins. Conversely, the anti-thesis underscores severe
              balance sheet overhang and structural margin ceilings. Raw material procurement still comprises over 75%
              of operating expenses, leaving thin gross margins exposed to aggressive pricing competition from quick
              commerce players and well-capitalized modern trade conglomerates. Furthermore, historical debt defaults
              prompted structured creditor reorganizations and reliance on $45 million in private credit from BlackRock,
              while senior executive churn—including the departure of the FMCG business head and former group
              CFO—highlights execution friction during vertical restructuring.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV009
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV008
              - CV009
              - CV010
      - number: '8.3'
        title: Valuation Scenarios and Market Comparables
        blocks:
          - type: paragraph
            body: >-
              Our scenario framework models Udaan's valuation across bull, base, and bear operating paths anchored
              against FY25 revenue of ₹4,561 crore and peer transaction multiples. In our base case (55% probability),
              Udaan generates modest 5% to 10% annual top-line growth to reach ₹4,800 to ₹5,200 crore, targeting EBITDA
              breakeven by late 2027. Under a conservative public listing multiple of 2.5x to 3.0x net revenue, this
              yields an enterprise value between $1.4 billion and $1.9 billion, implying essentially flat returns (0.8x
              to 1.05x) relative to the current $1.8 billion Series G mark. Sector comparables reinforce this valuation
              constraint: SoftBank-backed competitor ElasticRun suffered a 50% valuation markdown to $800 million by
              HSBC after FY23 net losses surged 72% to ₹618 crore, forcing a parallel retrenchment from national scale
              into regional dark store networks. In our bull case (25% probability), accelerated penetration of
              high-margin private labels and HoReCa360 drives 20% annual expansion to ₹6,500 crore, unlocking a $2.6
              billion to $3.2 billion exit at 4.0x revenue. In contrast, our bear case (20% probability) envisions a
              valuation compression to $700 million to $900 million (1.2x to 1.5x revenue) if debt maturities force a
              dilutive recapitalization or if quick commerce platforms further erode kirana replenishment volumes.
            claimRefs:
              - CV004
              - CV006
              - CV007
              - CV011
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV006
              - CV007
              - CV009
              - CV011
              - CV014
      - number: '8.4'
        title: Exit Readiness, Domicile Transition, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Udaan's pathway to liquidity is structurally anchored on an initial public offering targeted for early
              2028, supported by critical corporate governance restructuring. Following National Company Law Tribunal
              approval, the company consolidated its technology, logistics, and wholesale trading operations under
              Hiveloop Ecommerce Private Limited. It is currently executing a reverse flip to transition its parent
              corporate domicile from Singapore back to India, removing regulatory friction for domestic listing on
              Indian bourses. However, public market viability requires achieving sustainable group-level EBITDA
              breakeven by late 2027 and resolving several material diligence gaps. Prospective investors must
              scrutinize five mandatory diligence items: first, audited cash flow statements bridging FY24 through FY26
              to confirm unencumbered cash runway; second, full disclosure of debt maturity schedules, interest
              coverage, and convertible note liquidation preferences; third, UdaanCapital's credit-loss provisioning and
              receivables aging; fourth, post-acquisition contribution margin scorecards for ShopKirana and Lynk
              Logistics; and fifth, cluster-level kirana retention rates under intensifying quick commerce competition.
            claimRefs:
              - CV007
              - CV013
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Investment Stance: Track Pending Balance Sheet Transparency'
            body: >-
              While Udaan's 40% annual reduction in EBITDA burn and focus on 16 core consumption clusters demonstrate
              operating discipline, the current $1.8B private valuation provides little margin of safety given
              historical debt restructuring, convertible debt overhang, and the absence of audited cash flow
              disclosures.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV006
              - CV009
              - CV014
