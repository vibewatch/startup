  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Dimension
      - Investment Thesis
      - Anti-Thesis / Counter-Evidence
      - What Would Change The View
    rows:
      - - Market Leadership & Network Density
        - Retains top eB2B position serving 200,000 active kiranas across 16 dense profitable consumption clusters.
        - Geographic retrenchment from 80+ cities to 16 shrank revenue from ₹10,000 Cr peak to ₹4,561 Cr in FY25.
        - >-
          Demonstrated volume growth and market share recovery across Tier 2 and Tier 3 cities without widening EBITDA
          burn.
      - - Unit Economics & Margin Improvement
        - >-
          Cluster-led model improved contribution margin by 300+ bps and cut EBITDA burn by 40% annually for three
          years.
        - >-
          Raw material costs comprise over 75% of operating expenses, leaving gross margins highly vulnerable to price
          wars.
        - Sustained positive group EBITDA and free cash flow generation across consecutive quarterly reporting periods.
      - - Capital Structure & Financing
        - Secured $114M Series G equity from M&G and Lightspeed, maintaining a stable $1.8B valuation benchmark.
        - >-
          Past debt restructuring after bond defaults and reliance on convertible notes and private credit create
          preference overhang.
        - >-
          Clean capital structure disclosure showing no liquidation preference overhang or senior debt covenant
          encumbrances.
      - - Strategic Synergies & Consolidation
        - >-
          Acquisitions of ShopKirana and Lynk Logistics integrate Info Edge and Swiggy onto the cap table and deepen
          FMCG reach.
        - >-
          Integration complexity and execution risks across disparate supply chains could delay targeted 2028 IPO
          timeline.
        - >-
          Documented post-close margin expansion and operational integration milestones across combined warehouse
          networks.
    notes: >-
      Thesis and anti-thesis drivers evaluate turnaround durability against historical cash burn and creditor
      restructuring records.
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV006
      - CV008
      - CV009
      - CV010
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Core Assumptions
      - Valuation / Implied Multiple
      - Key Downside Triggers
      - Probability Signal
    rows:
      - - Bull Case
        - >-
          Reaches group EBITDA breakeven by 2027; revenue expands at 20% CAGR to ₹6,500 Cr; successful 2028 IPO at 4.0x
          revenue multiple.
        - $2.6B - $3.2B valuation (1.4x - 1.8x return on $1.8B entry)
        - Failure to maintain FMCG delivery density or unexpected loss of major brand supplier partnerships.
        - 25% probability; contingent on rapid execution and benign public market environment.
      - - Base Case
        - >-
          Modest 5-10% revenue expansion to ₹4,800-₹5,200 Cr; cash flow breakeven delayed to 2028; exit at 2.5x-3.0x
          revenue multiple.
        - $1.4B - $1.9B valuation (0.8x - 1.05x return on $1.8B entry)
        - Quick commerce encroachment on kirana purchase frequency; extended inventory working capital cycles.
        - 55% probability; reflects balanced turnaround progress alongside ongoing sector margin pressures.
      - - Bear Case
        - >-
          EBITDA burn re-accelerates; creditor debt obligations trigger recapitalization; down-round or structured
          rescue at 1.2x-1.5x revenue.
        - $700M - $900M valuation (0.4x - 0.5x return on $1.8B entry)
        - Inability to refinance private debt facilities; creditor intervention or disruptive leadership turnover.
        - 20% probability; highlighted by past debt restructuring history and B2B peer valuation write-downs.
    notes: >-
      Scenario analysis models exit outcomes based on FY25 revenue base of ₹4,561 Cr, historical peer transaction
      multiples, and debt covenants.
    claimRefs:
      - CV004
      - CV006
      - CV007
      - CV009
      - CV011
      - CV014
