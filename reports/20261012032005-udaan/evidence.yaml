    sourceType: regulatory
    reputationTier: high
    independence: independent
    topics:
      - financials
      - revenue
      - net-loss
      - FY25
    keyQuote: >-
      According to regulatory filings in Singapore, where the startup is domiciled, Udaan reported a 37% decline in net
      loss to ₹1,055 crore. Its operating revenue fell 20% in FY25 to ₹4,561 crore. The company said the revenue
      contraction happened on account of it exiting certain verticals in the non-essentials categories such as
      lifestyle, general merchandise, while increasing focus on groceries. Udaan had raised $114 million in funding from
      existing investors M&G Prudential (UK) and Lightspeed Venture Partners in June at a flat valuation of $1.8
      billion.
