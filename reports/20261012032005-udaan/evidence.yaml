evidenceGaps:
  - type: missing-source
    severity: material
    topic: FY26 audited financial statements
    missingEvidence: Audited FY26 profit-and-loss, cash flow statement, and balance sheet filing from Singapore ACRA or Indian MCA.
    whyItMatters: >-
      Essential to verify whether operating revenue contraction has bottomed out and whether unit-level contribution
      margins achieved positive EBITDA.
    diligencePath: >-
      Inspect upcoming MCA filings for Hiveloop E-Commerce Private Limited or Singapore ACRA annual statutory returns
      upon completion of FY26 audit.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: minor
    topic: Cap-table liquidation preferences
    missingEvidence: >-
      Detailed breakdown of Series E and Series G investor liquidation preferences, senior debt covenants, and
      anti-dilution provisions.
    whyItMatters: >-
      Influences common equity valuation and employee stock option pool recovery following the down-round reset from
      $3.2B to $1.8B.
    diligencePath: Review draft red herring prospectus (DRHP) cap-table disclosure upon official domestic IPO filing.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Audited category-level SKU volume and take-rate data isolating Udaan's true serviceable obtainable market (SOM)
      across its 16 active geographic clusters.
    whyItMatters: >-
      Broad macro eB2B projections of $100B mask extreme variance in gross margins between low-margin staples (1-3%) and
      higher-margin private labels or HoReCa supplies.
    diligencePath: Request management cluster-level contribution P&L and category breakdown across FMCG, staples, and HoReCa.
    relatedQuestionRefs:
      - QM009
  - type: missing-source
    severity: material
    topic: competitor-pricing-and-margins
    missingEvidence: >-
      Audited category-level gross margin and realized take-rate disclosures across Udaan and competing wholesale
      distributors.
    whyItMatters: >-
      Without granular category take-rate data, comparing price realization between Udaan, JioMart Wholesale, and
      traditional mandi brokers remains dependent on management commentary.
    diligencePath: >-
      Review future draft red herring prospectus (DRHP) filings and statutory auditor reports for detailed category
      segment economics.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: debt-and-liquidity
    missingEvidence: >-
      Audited FY26 balance-sheet disclosure detailing Udaan's exact cash reserves, outstanding debt notes, covenant
      structures, and receivables financing facilities.
    whyItMatters: >-
      Without audited debt maturity and cash balance disclosures, underwriting cannot verify whether the $114M Series G
      provides sufficient runway to reach group EBITDA profitability.
    diligencePath: >-
      Request management's latest audited balance sheet, credit facility schedules, and monthly cash flow statements
      under NDA.
    relatedQuestionRefs:
      - QI005
  - type: conflicting-data
    severity: minor
    topic: headcount-and-payroll
    missingEvidence: >-
      Exact payroll rosters and full-time employee counts reconciling Glassdoor self-reported bands (1,001 to 5,000
      employees) with official corporate reporting.
    whyItMatters: >-
      Reconciling exact headcount is required to accurately model personnel run rate, sales rep productivity, and
      fixed-cost leverage.
    diligencePath: Obtain certified monthly payroll summaries and organizational breakdown by business unit.
  - type: missing-source
    severity: material
    topic: unit-economics-and-cluster-margins
    missingEvidence: >-
      Audited cluster-level contribution margins (CM1 and CM2) broken down by operating geography and post-close
      ShopKirana integration performance.
    whyItMatters: >-
      Without granular cluster-level unit economics, underwriters cannot verify whether Udaan's micro-market density
      strategy generates sustainable cash flows or merely subsidizes delivery in low-margin Tier-2/3 pin codes.
    diligencePath: >-
      Request management's city-level unit economics deck, warehouse-level CM1/CM2 contribution margin reports, and
      audited post-acquisition integration scorecards for ShopKirana.
    relatedQuestionRefs:
      - QE009
    relatedTableRefs:
      - TE001
      - TE003
  - type: private-evidence-only
    severity: material
    topic: fintech-credit-quality
    missingEvidence: >-
      Detailed loan book performance data for UdaanCapital, including 30+ and 90+ day delinquency rates, first-loss
      default guarantees, and partner NBFC risk-sharing agreements.
    whyItMatters: >-
      Working capital credit is a central retailer acquisition and retention driver; unhedged credit defaults or adverse
      NBFC term revisions directly impair marketplace liquidity.
    diligencePath: >-
      Examine UdaanCapital's NBFC partnership contracts, default reserve arrangements, historical NPA write-offs, and
      merchant credit scoring model performance.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE001
  - type: private-evidence-only
    severity: material
    topic: Named customer proof table coverage and merchant identity confidentiality
    missingEvidence: >-
      Audited merchant-by-merchant store registrations, proprietor names, and individual account GMV totals across
      Tier-2/3 regional clusters.
    whyItMatters: >-
      Individual kirana merchant store names and proprietor identities are proprietary and confidential under privacy
      agreements; coverage is verified via regional operating cluster rollups.
    diligencePath: Obtain anonymized cohort transaction logs and cluster-level merchant retention scorecards from management.
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: Regulatory and litigation exposure
    missingEvidence: >-
      Comprehensive non-public schedule of pending regulatory notices, labor compliance disputes, and intellectual
      property litigation across state jurisdictions in India.
    whyItMatters: >-
      Unanticipated statutory penalties, trademark challenges, or FDI compliance inquiries could impede Udaan's proposed
      reverse flip to India or delay its IPO filing.
    diligencePath: >-
      Obtain formal litigation disclosure certificate and statutory auditor legal correspondence from Udaan's counsel
      during pre-IPO legal due diligence.
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: blocking
    topic: UdaanCapital credit performance and receivables quality
