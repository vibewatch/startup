      items:
        - label: Evaluate
          detail: Preconfigured sandbox and self-guided virtual labs
          touchpoints: ["Buyer hands-on demo", "Lab completion and time-spent signals"]
        - label: Build consensus
          detail: Workshops and cross-team engagement during the sales process
          touchpoints: ["Internal stakeholders", "Architecture and platform review"]
        - label: Migrate
          detail: Move an integration landscape or VM/container estate onto Kubernetes
          touchpoints: ["Cluster profiles", "Migration execution"]
        - label: Deploy
          detail: Operate clusters across cloud, data center, and edge environments
          touchpoints: ["Named healthcare and enterprise deployments", "Fleet governance"]
        - label: Operate at scale
          detail: Upgrade and manage large fleets with stated availability outcomes
          touchpoints: ["100-cluster GE Healthcare update", "Thousands of RapidAI edge devices"]
        - label: Expand and renew
