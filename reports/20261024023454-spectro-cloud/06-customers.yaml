  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention
      missingEvidence: Customer-level NRR, GRR, logo churn, renewal cohorts, average contract length, and gross retention by segment.
      whyItMatters: Named deployments demonstrate use but cannot establish durable recurring revenue or whether customer value persists after implementation.
      diligencePath: Request a monthly cohort schedule for the last eight quarters, reconciled to billings and segmented by enterprise, public sector, cloud provider, and channel.
      relatedQuestionRefs: [QU005]
    - type: enumeration-incomplete
      severity: material
      topic: customer-count
      missingEvidence: Current active-account count, production-account count, pilot count, and customer concentration by ARR or total contract value.
      whyItMatters: Without denominators, the named references cannot be translated into penetration, concentration, or representative adoption.
      diligencePath: Obtain a customer master and ARR concentration schedule with production status, start date, renewal date, and channel attribution.
      relatedQuestionRefs: [QU002, QU008]
      relatedTableRefs: [TU003]
    - type: missing-source
      severity: minor
      topic: adverse-customer-evidence
      missingEvidence: Independent complaint, failed-deployment, procurement-delay, or churn records specific to Spectro Cloud.
      whyItMatters: The available pool contains positive and disclosure-gap evidence but does not independently test implementation friction or customer dissatisfaction.
      diligencePath: Conduct reference calls with former customers and implementation partners and request redacted support-ticket and renewal-loss summaries.
      relatedQuestionRefs: [QU007]
