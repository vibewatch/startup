chapter:
  number: 6
  title: Customers
  summary: >-
    Spectro Cloud has credible named-use evidence across healthcare, telecom, public sector, and
    edge operations, but public materials do not establish customer count, recurring retention,
    contract duration, or customer concentration. The strongest proof is operational rather than
    financial: GE Healthcare reports 100 clusters upgraded within four hours without downtime,
    while customer and partner references describe deployments ranging from hospital edge devices
    to self-guided sales evaluation.
sections:
  - id: customer-segments
    title: Segments and buying motion
    body: >-
      The customer base is best understood as infrastructure operators buying a control plane for
      heterogeneous Kubernetes, VM, and edge estates rather than as a homogeneous developer-software
      audience. Spectro Cloud's own current positioning names enterprises, public-sector organizations,
      neoclouds, and sovereign clouds, with platform engineering and infrastructure operations teams as
      core users. The available named references span healthcare, telecom, public sector, agtech, and
      technology organizations. This breadth supports a multi-vertical use case, but the public record
      does not disclose how many accounts sit in each segment, whether deployments are production-wide,
      or how revenue is split between direct enterprise sales and partners. The buying motion appears
      consultative: Instruqt describes preconfigured hands-on labs and workshops intended to accelerate
      buyer evaluation and internal consensus, while the GE Healthcare case describes a concrete
      operational problem involving hundreds of clusters. Those are stronger adoption signals than logo
      display, but neither source discloses contract value or renewal terms.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-trajectory
    title: Adoption proof and operating outcomes
    body: >-
      Public evidence supports several layers of adoption, with materially different confidence. A named
      GE Healthcare case reports hundreds of clusters across AWS and on-premises VMware and says Palette
      updated 100 clusters within four hours without downtime; that is a specific deployment and outcome
      claim, although it is presented in a case-study format and lacks an independently audited baseline.
      Spectro Cloud's customer page supplies additional named-user testimony: RapidAI describes thousands
      of edge devices running life-critical AI workloads, and another customer describes moving an entire
      integration landscape to Kubernetes in two months. Instruqt provides a separate customer/partner
      account of hands-on labs used to shorten the demo stage and monitor completion rates and time spent.
      These sources show multiple adoption surfaces—production operations, migration, edge scale, and
      pre-sales evaluation—but they do not provide an active-account denominator, usage cohort, renewal
      rate, or standardized before-and-after measurement across customers.
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU002]
  - id: durability-concentration
    title: Retention, expansion, and concentration diligence
    body: >-
      The evidence is insufficient to underwrite durability or concentration. The company and investor
      materials emphasize customer experience, support, and expansion into edge and AI infrastructure,
      while the independent material frames the platform as serving global organizations and a broad
      set of deployment environments. However, no retained source supplies NRR, GRR, logo churn,
      renewal cohorts, average contract length, top-customer share, or revenue by channel. Named
      deployments should therefore be treated as reference quality and use-case proof, not as retention
      proof. The strategic fit of healthcare, telecom, government, and distributed edge accounts may
      create expansion potential because one control plane can be reused across sites, but that is an
      analytical hypothesis rather than a measured land-and-expand result. Diligence should request
      cohort-level retention, customer-level ARR concentration, production-versus-pilot status, channel
      economics, and evidence that support intensity remains acceptable as fleet size grows.
    claimRefs: [CU010, CU011, CU012, CU013]
    tableRefs: [TU003]
callouts:
  - calloutType: strength
    title: Named operational proof is stronger than logo proof
    body: The GE Healthcare account includes a concrete fleet size, upgrade timing, and no-downtime outcome, giving the customer thesis an operational anchor even though the case-study format limits independent verification.
    claimRefs: [CU005, CU006]
  - calloutType: risk
    title: Retention and concentration remain open
    body: Public sources do not disclose customer count, cohort retention, contract duration, or top-account concentration; named references cannot substitute for those denominators.
    claimRefs: [CU010, CU011, CU012]
