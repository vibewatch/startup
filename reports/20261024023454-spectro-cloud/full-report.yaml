chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating scope
        blocks:
          - type: paragraph
            body: >-
              Spectro Cloud was founded in 2019 and is headquartered in San Jose, California. Its current company
              positioning extends beyond Kubernetes cluster administration: Palette and PaletteAI are presented as
              lifecycle and governance layers across VMs, Kubernetes, edge, regulated and air-gapped environments, and
              AI infrastructure. That breadth points to a subscription software model serving platform and operations
              teams rather than a single-purpose developer tool. A newly retained partner announcement adds concrete
              evidence of the ecosystem strategy by placing Saturn Cloud's managed AI layer on Palette-managed clusters.
              The public record still does not establish legal-entity scope, a complete office footprint, current
              customer count, or audited revenue.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO005
