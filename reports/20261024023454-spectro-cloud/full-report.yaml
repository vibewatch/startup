              The leadership page continues to place all three founders in core operating roles: Tenry Fu as CEO, Saad
              Malik as CTO, and Gautam Joshi as VP Engineering. It also identifies Ronnie Ghosh as CFO and names
              investor-affiliated and independent board members, including representatives associated with Stripes,
              Sierra Ventures, and Goldman Sachs. This continuity can support strategic and technical cohesion, but it
              also concentrates product, engineering, and external narrative ownership in the founding group. Public
              materials do not establish executive tenure, succession planning, board voting rights, or material
              leadership departures, so governance depth should not be inferred from names alone.
