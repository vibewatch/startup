evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: Current ARR, GAAP revenue, gross margin, services mix, cash burn, runway, and the contribution of PaletteAI.
    whyItMatters: >-
      The reported financing and valuation cannot be tested against current operating performance without absolute
      financial measures.
    diligencePath: >-
      Request monthly management accounts, an ARR bridge, bookings, gross margin by offering, cash balances, and the
      board-approved forecast.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: customers
    missingEvidence: Current customer count, ARR concentration, gross and net retention, cohort behavior, renewals, and backlog.
    whyItMatters: >-
      Named customers and partner announcements do not establish recurring revenue quality, concentration, or
      durability.
    diligencePath: >-
      Obtain a customer-level ARR schedule, cohort retention analysis, top-customer contracts, churn records, and
      renewal pipeline.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: funding-and-valuation
    missingEvidence: >-
      A reconciled capitalization table and executed financing schedule covering every round, security, amount,
      valuation, and preference.
    whyItMatters: >-
      Conflicting public totals and disclosure status affect ownership, downside protection, and common-equity
      economics.
    diligencePath: >-
      Review the fully diluted capitalization table, stock purchase documents, certificates, side letters, and closing
      statements.
    relatedQuestionRefs:
      - QO009
      - QO010
    relatedTableRefs:
      - TO001
