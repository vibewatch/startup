  evidenceGaps:
    - type: conflicting-data
      severity: material
      topic: fedramp-status
      missingEvidence: >-
        A current FedRAMP Marketplace record and authorization package identifying the exact
        Palette VerteX service, boundary, authorization type, status, and sponsoring agency.
      whyItMatters: >-
        Company and partner descriptions conflict, so regulated-market access and procurement
        readiness cannot be underwritten from public marketing claims alone.
      diligencePath: >-
        Obtain the package identifier and authorization letter from management, then reconcile
        them directly with the current FedRAMP Marketplace and agency sponsor.
      relatedQuestionRefs: [QR001]
      relatedTableRefs: [TR001]
    - type: missing-source
      severity: material
      topic: incidents-legal
      missingEvidence: >-
        Current incident, outage, claim, litigation, enforcement, privacy, sanctions, recall, and
        license records across the jurisdictions and products in scope.
      whyItMatters: >-
        The assigned source pool does not establish either the presence or absence of these
        matters, and material undisclosed events could change risk severity.
      diligencePath: >-
        Review incident registers, insurer loss runs, legal letters, regulator correspondence,
        privacy assessments, customer notices, and management representations.
      relatedQuestionRefs: [QR009]
      relatedTableRefs: [TR001, TR002]
    - type: private-evidence-only
      severity: material
      topic: financial-transparency
      missingEvidence: >-
        Current cash, monthly burn, committed spend, audited revenue, ARR bridge, gross margin,
        support burden, retention, and board-approved runway plan.
      whyItMatters: >-
        Financing proceeds and cumulative capital raised do not show cash available or the
        operating milestones achievable before another financing.
      diligencePath: >-
        Reconcile bank statements, general ledger, audited financials, ARR cohorts, support costs,
        and the board operating plan to financing documents and preference terms.
      relatedQuestionRefs: [QR003]
      relatedTableRefs: [TR003]
