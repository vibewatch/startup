callouts:
  - calloutType: risk
    title: Compliance kill criterion
    body: >-
      Do not underwrite regulated-market access as proven unless the exact Palette VerteX service,
      authorization boundary, status, sponsoring agency, and current FedRAMP record reconcile with
      the public claims; failure to reconcile them before investment approval breaks the
      regulated-market portion of the thesis.
    claimRefs: [CR001, CR002, CR016]
  - calloutType: recommendation
    title: Operating and financial diligence threshold
    body: >-
      Require primary cash, burn, revenue, retention, concentration, support-load, and incident
      evidence plus a production-scale proof of upgrade, rollback, and disconnected operation.
      Round size, marketing outcomes, and survey-level market pain cannot substitute for those
      company-specific controls and economics.
    claimRefs: [CR005, CR006, CR010, CR012, CR013, CR014]
