company:
  name: Spectro Cloud
chapter:
  number: 7
  title: Risks
  summary: >-
    Spectro Cloud's most consequential risks are unresolved evidence: public sources conflict
    on FedRAMP status, NIST's active FIPS validation has a defined scope and caveat, and financing
    and growth claims do not establish current cash, revenue quality, or runway. Operational
    exposure is also elevated by the breadth of environments the platform is expected to manage.
sections:
  - id: ranked-risk-posture
    title: Ranked residual-risk posture
    body: >-
      The highest-priority diligence item is the inconsistency between Spectro Cloud's current
      Palette VerteX page, which calls the offering FedRAMP Moderate certified, and Corsec's
      description of FedRAMP Moderate as in process. That inconsistency is observable in public
      materials and therefore receives a high residual rating until the exact service, boundary,
      authorization type, agency sponsor, and marketplace record are reconciled. The next tier
      combines financial opacity with execution breadth: third-party sources disagree on whether
      the Series D disclosed a valuation, while no retained source establishes current cash,
      burn, revenue quality, or runway. Funding raised is not cash available. The heatmap is a
      qualitative evidence map rather than a statistical probability model; placement reflects
      the strength of the observed exposure signal and the potential underwriting impact.
    claimRefs: [CR001, CR002, CR004, CR012, CR013, CR014]
    figureRefs: [FR001]
  - id: regulatory-legal
    title: Regulatory and legal exposure
    body: >-
      NIST provides the strongest independent compliance evidence in the assigned pool: the
      Spectro Cloud Cryptographic Library is listed as an active FIPS 140-3 Level 1 software
      module with a July 22, 2029 sunset date. The same certificate carries a caveat that there
      is no assurance of the minimum strength of generated sensitive security parameters, so
      validation should not be generalized into a claim that every deployment, configuration,
      or surrounding control is certified. FedRAMP requires separate verification. The generic
      FedRAMP site describes its Marketplace as the searchable database for certified services,
      authorizing agencies, and recognized assessors, but the fetched page does not itself
      identify Spectro Cloud. No retained source establishes a complete current litigation,
      enforcement, privacy, sanctions, or licensing history; that is an evidence gap, not proof
      that no such matter exists.
    claimRefs: [CR001, CR002, CR003, CR004, CR016]
    tableRefs: [TR001]
  - id: operational-quality-security
    title: Operational, quality, and security execution
    body: >-
      Palette's scope is itself an execution risk. Company and directory materials describe one
      control plane spanning public cloud, data centers, bare metal, edge, VMs, containers, and
      AI infrastructure. Each additional environment expands the compatibility, upgrade,
      observability, rollback, and support matrix. A low-reputation review aggregator reports a
      learning curve, documentation gaps, initial configuration complexity, and some performance
      degradation at very large scale; these observations need direct customer corroboration but
      identify concrete test areas. Spectro Cloud's syndicated 2025 survey adds market context:
      42% of 455 production-Kubernetes respondents named cost as the top challenge, 88% reported
      year-over-year TCO increases, half ran production Kubernetes at the edge, and more than half
      still had highly manual snowflake clusters. These are industry statistics, not Spectro
      Cloud incident rates, but they describe the operating conditions the product must overcome.
    claimRefs: [CR005, CR006, CR007, CR008, CR009, CR010]
    tableRefs: [TR002]
  - id: partners-financial-model
    title: Partner, capital, and business-model dependencies
    body: >-
      Spectro Cloud's expansion plan depends on product investment, customer support, and a wider
      alliance and go-to-market network. Goldman Sachs' Series C release explicitly allocated
      proceeds to those areas. A later analyst post identifies AMD Ventures, Ericsson, LG
      Technology Ventures, and Maximus as strategic Series D participants and flags a possible
      tension between closer commercial alignment and vendor-neutral positioning. That is a
      monitorable dependency rather than proof that neutrality has already weakened. Financial
      underwriting is more constrained: Multiples reports a $100 million Series D, $260 million
      total capital, and a $1 billion valuation, while Megadeal says neither the Series C nor
      Series D valuation was publicly disclosed. Until primary financing documents, audited
      revenue, customer concentration, gross margin, burn, and current cash are produced, the
      round size should be treated as financing history rather than runway evidence.
    claimRefs: [CR011, CR012, CR013, CR014, CR015]
    tableRefs: [TR003]
