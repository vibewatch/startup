  evidenceGaps:
    - type: missing-source
      severity: material
      topic: reliability
      missingEvidence: Current public SLA, service-status history, incident record, and fleet upgrade success rates.
      whyItMatters: Reliability and support burden cannot be underwritten from qualitative lifecycle claims alone.
      diligencePath: Request 24 months of availability, severity-one incidents, upgrade failures, recovery times, and support escalations by deployment mode.
      relatedQuestionRefs: [QE007, QE008]
      relatedTableRefs: [TE002, TE003]
    - type: missing-source
      severity: material
      topic: fedramp
      missingEvidence: Official marketplace record and authorization boundary for each Palette VerteX deployment model.
      whyItMatters: Partner-reported milestones do not establish the present authorization scope or customer shared-responsibility boundary.
      diligencePath: Obtain the official FedRAMP package identifier, agency authorization details, boundary diagram, and current status directly from the marketplace or data room.
      relatedQuestionRefs: [QE006, QE007]
      relatedTableRefs: [TE001]
    - type: private-evidence-only
      severity: material
      topic: performance
      missingEvidence: Independent benchmarks for deployment time, upgrade reliability, control-plane scale, edge recovery, and operational cost.
      whyItMatters: Product differentiation and economic benefit remain mechanism-based rather than quantitatively demonstrated.
      diligencePath: Run a reference workload against named alternatives and inspect production telemetry from representative cloud, regulated, and disconnected-edge customers.
      relatedQuestionRefs: [QE005, QE008]
      relatedTableRefs: [TE002, TE003]
    - type: missing-source
      severity: material
      topic: roadmap
      missingEvidence: Current SKU map, supported-version matrix, deprecation policy, and evidence-based PaletteAI roadmap.
      whyItMatters: The support scope is broad, and public sources do not show how engineering capacity or compatibility commitments scale with it.
      diligencePath: Review the current product catalog, release train, end-of-support policy, backlog, and engineering ownership by module.
      relatedQuestionRefs: [QE002, QE004]
      relatedTableRefs: [TE001]
