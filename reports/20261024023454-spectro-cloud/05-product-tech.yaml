      network diagram and does not assert undocumented data paths.
    claimRefs: [CE006, CE010, CE015]
callouts:
  - calloutType: risk
    title: Certification scope is narrower than platform scope
    body: >-
      FIPS 140-3 Level 1 validates a named cryptographic software module in approved
      configurations. It does not by itself validate every Palette component,
      customer deployment, key-management process, or FedRAMP authorization boundary.
    claimRefs: [CE011, CE012, CE013, CE014]
