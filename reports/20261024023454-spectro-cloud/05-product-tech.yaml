schemaVersion: "report-v2"
artifact: product-tech
slug: spectro-cloud
runDate: 2026-10-24
company:
  name: Spectro Cloud
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Palette is a Kubernetes lifecycle-management platform spanning cloud, data center,
    bare metal, edge, containers, and virtual machines, with profiles as its core
    standardization mechanism. Public technical evidence is strongest for edge
    artifact construction and a FIPS 140-3 Level 1 cryptographic module, while
    current reliability, performance, FedRAMP authorization scope, and PaletteAI
    roadmap evidence remain incomplete.
sections:
  - id: product-surface
    title: Product surface and user workflow
    body: >-
      Palette addresses platform-engineering and IT-operations workflows rather than
      a single Kubernetes distribution. External partner and directory descriptions
      consistently frame the product as a management layer for deploying and
      operating Kubernetes across public cloud, on-premises infrastructure, and edge
      locations. The product surface also extends to virtual machines, giving buyers
      a common operating interface during mixed VM-and-container transitions.
      Palette's profile system is the main workflow abstraction: administrators define
      repeatable infrastructure and application layers, while developers consume
      governed environments rather than assembling every cluster component. The
      available deployment model includes SaaS, self-hosted, and air-gapped options,
      but that breadth increases the number of configurations, upgrade paths, and
      support boundaries that diligence must test.
    claimRefs: [CE001, CE002, CE004, CE008]
    tableRefs: [TE001]
  - id: architecture-and-deployment
    title: Architecture, deployment, and integration model
    body: >-
      Public descriptions indicate a layered control model: a central Palette
      management plane defines profiles, policy, RBAC, and fleet operations, while
      workload-cluster control planes enforce decisions locally. That separation is
      particularly relevant at the edge, where intermittent connectivity makes
      local operation necessary. Cluster profiles coordinate infrastructure,
      Kubernetes, and add-on layers through deployment and upgrade cycles. For edge
      deployments, the public CanvOS repository provides unusually concrete
      implementation evidence: it uses Earthly-based builds to create installer,
      provider, and pre-staged artifacts, with explicit operating-system,
      Kubernetes-distribution, registry, secure-boot, and hardening choices. Amazon
      EKS Hybrid Nodes is a documented integration path, although the supporting
      announcement remains company-issued and does not establish fleet-scale
      performance independently.
    claimRefs: [CE003, CE005, CE006, CE007, CE010, CE015]
    tableRefs: [TE002, TE003]
    figureRefs: [FE001]
  - id: maturity-controls-and-risk
    title: Maturity, security controls, and technical risk
    body: >-
      Product maturity is supported by a broad feature history and a live public edge
      build surface, but independent operational proof is uneven. NIST's certificate
      record identifies the Spectro Cloud Cryptographic Library v2 as an active FIPS
      140-3 Level 1 software module used in supported products such as Palette
      VerteX. The certificate is meaningful evidence for the validated module, not a
      blanket certification of the entire platform, and it explicitly carries a
      caveat concerning minimum strength assurance for generated sensitive security
      parameters. Corsec describes FedRAMP milestones, but it is Spectro Cloud's
      certification partner; the fetched FedRAMP landing page does not identify
      Spectro Cloud in its captured text. Across the retained materials, reliability
      benefits are qualitative: there is no controlled benchmark, current public SLA,
      quantified incident history, or independently measured upgrade-success record.
    claimRefs: [CE009, CE011, CE012, CE013, CE014, CE016]
tables:
