      - Primary user
      - Publicly evidenced status
      - Differentiation
      - Diligence gap
    rows:
      - [Palette core, "Platform engineering and IT operations", "Marketed and described by WWT, CDW, and EdgeIR", "Unified Kubernetes lifecycle across heterogeneous locations", "Current SKU boundaries, release cadence, and support matrix"]
      - [Cluster profiles and workspaces, "Platform administrators and development teams", "Profiles described by WWT; workspaces introduced in Palette 2.0", "Reusable full-stack definitions with RBAC and governance", "Current policy engine, drift behavior, and migration compatibility"]
      - [Palette Edge and CanvOS, "Edge infrastructure and operations teams", "Public CanvOS build documentation is available", "Custom installer, provider, and pre-staged edge artifacts", "Production adoption, update failure rates, and long-term hardware compatibility"]
      - [Palette VerteX, "Government and regulated-enterprise operators", "FIPS 140-3 Level 1 module is active; partner reports FedRAMP milestones", "Validated cryptographic module embedded in a regulated-market product", "Official authorization listing, authorization boundary, and shared-responsibility controls"]
    notes: >-
      Status is limited to the retained public sources as of 2026-10-24; product-wide
      certifications and production maturity are not inferred from module-level validation.
    claimRefs: [CE001, CE002, CE004, CE008, CE010, CE011, CE014]
  - id: TE002
    title: Workflow and use-case evidence
    columns:
      - User job
      - Current workflow burden
      - Palette approach
      - Publicly described benefit
      - Limitation
    rows:
      - ["Standardize multi-environment clusters", "Teams assemble and maintain different stacks by location", "Reusable profiles span infrastructure and application layers", "More consistent deployment and upgrade configuration", "No retained controlled comparison quantifies time or error reduction"]
      - ["Operate EKS across cloud and on-premises nodes", "Hybrid-node bootstrap and lifecycle work can be manual", "Palette onboards nodes and manages EKS Hybrid Nodes from one interface", "Single fleet-management surface including upgrades", "Evidence is a company announcement rather than an independent production benchmark"]
      - ["Prepare remote edge systems", "Edge devices need customized OS, Kubernetes, and pre-staged content", "CanvOS builds installer and provider artifacts with configurable images", "Little-to-no-touch artifact path and offline pre-staging", "Build flexibility creates dependency and configuration-management burden"]
      - ["Give developers governed self-service", "Central platform teams can become provisioning bottlenecks", "Profiles, workspaces, and virtual-cluster concepts expose curated environments", "Qualitative reduction in setup and provisioning overhead", "No current adoption, latency, or developer-productivity denominator is public"]
    notes: >-
      Benefits are source-described mechanisms rather than independently measured outcomes;
      unavailable denominators are stated as diligence limitations.
    claimRefs: [CE002, CE003, CE005, CE007, CE008, CE010, CE016]
  - id: TE003
    title: Technology architecture, dependencies, and risks
    columns:
      - Layer or component
      - Role
      - Key dependency
      - Principal technical risk
    rows:
      - ["Palette management plane", "Fleet visibility, policy administration, profiles, and lifecycle actions", "SaaS or customer-hosted control environment", "Control-plane availability and version compatibility are not quantified publicly"]
      - ["Cluster-local control and enforcement", "Runs workload-cluster control plane and applies policy locally", "Kubernetes distributions, agents, and local connectivity", "Behavior during prolonged disconnection and reconciliation is not independently tested"]
      - ["Profile stack", "Combines infrastructure, Kubernetes, and application-service layers", "CNCF components, cloud APIs, and version compatibility", "Large compatibility matrix can increase regression and support burden"]
      - ["CanvOS edge build chain", "Creates installer, provider, pre-staged, and signed artifacts", "Earthly, Kairos, registries, OS images, and customer keys", "Supply-chain, signing-key, and reproducibility controls require customer-specific review"]
      - ["VerteX cryptographic boundary", "Provides validated cryptography in supported Spectro Cloud solutions", "Validated module configuration and approved mode", "Module validation does not extend automatically to every platform component or deployment"]
    notes: >-
      Architecture is reconstructed from assigned partner, company, developer, and
      regulatory sources; undocumented internals are not inferred.
    claimRefs: [CE002, CE006, CE010, CE011, CE012, CE016]
