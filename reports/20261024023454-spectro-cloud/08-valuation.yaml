  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Assessment, Decision implication]
    rows:
      - [Recommendation, research-more, Do not underwrite a buy before price and recurring-revenue evidence are verified]
      - [Confidence, medium, Product and financing evidence is credible but economic disclosure is incomplete]
      - [Risk rating, high, "Financing terms, margin, retention, and commercialization risks remain material"]
      - ["Valuation stance", stretched on public evidence, "Reported price lacks a comparable denominator and common-equity bridge"]
    notes: "Assessment synthesizes retained financing, product, market-data, transaction, and adverse evidence; no target return or absolute valuation range is inferred."
    claimRefs: [CV001, CV002, CV003, CV010, CV011, CV014, CV016]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Argument, Supporting evidence, What would change the view]
    rows:
      - [AI infrastructure control point, "PaletteAI and Palette span heterogeneous Kubernetes and AI environments", "Verified recurring revenue and retention would support durable platform economics"]
      - [Financing momentum, "More than $100M Series D and $260M cumulative capital reported in July 2026", "A down round or material preference stack would weaken the signal"]
      - [Commercial relevance, "The company names enterprise and public-sector users and large VM migration initiatives", "Customer concentration or project-only revenue would weaken scalability"]
      - [Valuation opacity, "Public sources conflict on whether a $1B-plus mark was disclosed", "Financing documents and a fully diluted common-equity bridge would resolve it"]
    notes: "Rows separate strategic and operating evidence from unresolved price evidence; customer references and case-study outcomes are not treated as ARR or revenue."
    claimRefs: [CV001, CV002, CV003, CV006, CV007, CV010, CV011, CV013]
  - id: TV003
    title: Bull, base, and bear scenario
    columns: [Scenario, Assumptions, Valuation or return logic, Key risks, Probability signal]
    rows:
      - [Bull, "AI production adoption converts to durable subscriptions; enterprise references convert into strong retention and software margins", "A $1B mark is investable only if verified economics justify a premium to mature public infrastructure software", "Execution, competition, and strategic-channel conflict", "Upside is plausible but unverified"]
      - [Base, "Palette and PaletteAI grow, but public-sector cycles and implementation work slow conversion", "Maintain research-more; no absolute valuation or target return is supportable before revenue and security terms are disclosed", "Unknown ARR, margin, dilution, net debt, and common-equity terms", "Most consistent with current public evidence"]
      - [Bear, "AI positioning does not translate into recurring revenue and financing terms absorb downside", "A down round, preference overhang, or weak economics would require repricing; downside cannot be bounded publicly", "Multiple compression, procurement delays, configuration complexity, preference overhang", "Material downside remains unresolved"]
    notes: "Scenarios are conditional, not forecasts. Nutanix's 5.62x enterprise-value/revenue and Multiples' 7.7x CloudBees valuation/revenue use different denominators and cannot produce a Spectro Cloud range."
    claimRefs: [CV002, CV003, CV008, CV009, CV010, CV011, CV012, CV015, CV016]
