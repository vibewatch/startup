company:
  name: Spectro Cloud
chapter:
  number: 1
  title: Company Overview
  summary: Spectro Cloud is a San Jose-based, 2019-founded private infrastructure software company whose scope now spans Kubernetes, VMs, edge, regulated deployments, and AI infrastructure. Public sources support a July 2026 Series D and continued founder leadership, but funding totals, valuation disclosure, headcount, revenue, and customer economics remain unreconciled or private.
sections:
  - id: identity-and-operating-scope
    title: Identity and operating scope
    body: >-
      Spectro Cloud was founded in 2019 and is headquartered in San Jose, California. Its current company positioning extends beyond Kubernetes cluster administration: Palette and PaletteAI are presented as lifecycle and governance layers across VMs, Kubernetes, edge, regulated and air-gapped environments, and AI infrastructure. That breadth points to a subscription software model serving platform and operations teams rather than a single-purpose developer tool. A newly retained partner announcement adds concrete evidence of the ecosystem strategy by placing Saturn Cloud's managed AI layer on Palette-managed clusters. The public record still does not establish legal-entity scope, a complete office footprint, current customer count, or audited revenue.
    claimRefs: [CO001, CO002, CO003, CO005]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership and governance
    body: >-
      The leadership page continues to place all three founders in core operating roles: Tenry Fu as CEO, Saad Malik as CTO, and Gautam Joshi as VP Engineering. It also identifies Ronnie Ghosh as CFO and names investor-affiliated and independent board members, including representatives associated with Stripes, Sierra Ventures, and Goldman Sachs. This continuity can support strategic and technical cohesion, but it also concentrates product, engineering, and external narrative ownership in the founding group. Public materials do not establish executive tenure, succession planning, board voting rights, or material leadership departures, so governance depth should not be inferred from names alone.
    claimRefs: [CO004]
    tableRefs: [TO002]
  - id: financing-and-stakeholders
    title: Financing and stakeholders
    body: >-
      The financing sequence is clearer than the capital total. Public profiles consistently identify seed, Series A, Series B, a 2023 investment, the November 2024 Series C, and a July 2026 Series D; Goldman Sachs led the two latest named rounds. GovConWire and Tracxn report that the Series D brought total capital to $260 million, while Indexed.vc reports $242.5 million and the Multiples page uses both $263 million and $260 million in different places. Tracxn and Multiples also report a $1 billion July 2026 valuation, but Megadeal says the company did not publicly disclose one. The valuation should therefore remain a third-party report rather than a verified financing fact.
    claimRefs: [CO006, CO007, CO008, CO009, CO010, CO011, CO012]
    tableRefs: [TO003]
  - id: scale-milestones-and-gaps
    title: Scale, milestones, and unresolved diligence
    body: >-
      The milestone record shows steadily larger financings and an October 2025 PaletteAI launch before the strategic Series D. Operating scale is less certain. Tracxn reports 310 employees as of September 30, 2026, whereas Indexed.vc shows a 51–200 band and Exa describes around 203 employees. Goldman Sachs's 2024 release repeats the company's claim of three consecutive years of triple-digit ARR growth, but neither the absolute ARR denominator nor GAAP revenue is disclosed. No retained source provides current customer count, retention, concentration, gross margin, cash burn, or runway. Those omissions prevent a reliable conversion of financing momentum into an operating-performance conclusion.
    claimRefs: [CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
callouts:
  - calloutType: strength
    title: Founder continuity with institutional governance
    body: The three founders remain in the principal product and engineering roles, while the published board includes investor-affiliated and independent members.
    claimRefs: [CO004]
  - calloutType: risk
    title: Public scale figures do not reconcile
    body: Funding totals, valuation disclosure, and employee counts conflict across current public profiles, while absolute revenue and customer economics remain undisclosed.
    claimRefs: [CO009, CO010, CO011, CO012, CO013, CO014, CO015]
  - calloutType: recommendation
    title: Anchor the next diligence step in primary records
    body: The capitalization table, executed financing documents, management accounts, customer cohort schedule, HR roster, and board-rights matrix are necessary to replace reported figures with decision-grade evidence.
    claimRefs: [CO009, CO010, CO011, CO012, CO013, CO014, CO015]
