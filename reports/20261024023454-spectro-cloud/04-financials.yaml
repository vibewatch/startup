company:
  name: Spectro Cloud
chapter:
  number: 4
  title: Financials
  summary: Spectro Cloud describes a recurring enterprise-infrastructure software model priced against managed infrastructure, with expansion tied to clusters, nodes, cores, and GPUs. The July 2026 financing and product expansion indicate capital support for AI and go-to-market growth, but public evidence remains insufficient to underwrite ARR, realized pricing, margins, burn, runway, or customer concentration.
sections:
  - id: monetization-and-revenue-quality
    title: Monetization and revenue quality
    body: >-
      The clearest public monetization description is a recurring B2B subscription model rather than a seat-based SaaS model. Sacra reports that cloud and virtualized environments are priced by kilo-Core-hours, edge and bare-metal deployments by managed node, and PaletteAI by managed GPU. That structure aligns expansion revenue with infrastructure under management, but it also makes realized revenue sensitive to deployment mix, utilization, and customer architecture. The same source describes direct sales plus systems integrators, channel partners, and AWS and Azure marketplaces, with Launchpads and Liftoff Kits packaging software, reference architecture, and professional services around an initial outcome. These are company-market claims, not audited revenue disclosures. The November 2024 Goldman Sachs release reports three consecutive years of triple-digit ARR growth, but gives no ARR amount, cohort data, or independent corroboration. The revenue-quality conclusion is therefore positive on mechanism and unresolved on scale, retention, discounting, and recognition.
    claimRefs: [CI001, CI002, CI003, CI004, CI015]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: cost-structure-and-unit-economics
    title: Cost structure and unit economics
    body: >-
      Spectro Cloud's operating model is likely more service-intensive than a single-environment SaaS product, because the platform spans operating systems, Kubernetes distributions, networking, storage, GPU drivers, AI frameworks, air-gapped deployments, and edge hardware. Sacra explicitly describes qualification of those combinations, enterprise support, technical account management, and professional services as sources of added revenue and headcount requirements, while noting that self-hosted deployments shift hosting costs to customers but increase release-engineering and support complexity. Official documentation illustrates implementation work: an edge deployment requires building installer and provider artifacts, initializing hosts, creating a cluster profile, and validating repeatable deployment. Those facts support a diligence focus on gross-margin drivers and implementation burden, not a precise margin estimate. No public source in this pool discloses gross margin, CAC, payback, support cost per deployment, utilization, or cash burn, so unit-economics fields remain open rather than modeled.
    claimRefs: [CI005, CI006, CI007, CI008]
    tableRefs: [TI003]
  - id: capital-adequacy-and-underwriting-verdict
    title: Capital adequacy and underwriting verdict
    body: >-
      Spectro Cloud announced a $100 million Series D on July 15, 2026, and the assigned evidence describes the proceeds as supporting PaletteAI expansion, enterprise production adoption, and broader go-to-market. Sacra reports approximately $260 million of disclosed cumulative capital after the round, while other data services in the pool disagree on totals and round counts; the discrepancy is itself a diligence issue, not a basis for selecting a preferred number. The Goldman Sachs release confirms a $75 million Series C in November 2024 and says proceeds would fund product innovation, customer support, and go-to-market partnerships. The capital event improves near-term financing capacity in directional terms, but cash on hand, post-financing burn, runway, debt, liquidation preferences, and next-round triggers are not disclosed. The underwriting verdict is research-more: the recurring model and financing access are credible positive signals, while missing private-company financial statements and cash-flow data prevent a margin, runway, or valuation-based investment conclusion.
    claimRefs: [CI009, CI010, CI011, CI012]

tables:
  - id: TI001
    title: Revenue streams
    columns: [Stream, Mechanism, Unit or basis, Current value/status, Quality and diligence ask]
    rows:
      - [Core Palette subscriptions, "Recurring B2B infrastructure software", "Managed infrastructure; cloud/virtualized pricing described by kilo-Core-hours", "Mechanism described; realized revenue unavailable", "Company description; obtain contracts, renewal cohorts, discounts, and recognition policy"]
      - [Edge and bare-metal deployments, "Recurring platform subscription", "Managed node", "Mechanism described; node counts and realized price unavailable", "Company/third-party description; obtain per-node price book, deployment mix, and support burden"]
      - [PaletteAI, "AI infrastructure management subscription", "Managed GPU; Sacra also describes token metering and quotas as product capabilities", "Product and pricing basis described; ARR contribution unavailable", "Third-party analysis; obtain GPU utilization, expansion, churn, and attach-rate data"]
      - [Professional services and Launchpads/Liftoff Kits, "Packaged implementation and services around an initial outcome", "Contract-specific; unit and mix undisclosed", "Presence described; revenue share and margin unavailable", "Obtain services revenue, delivery cost, deferred revenue, and implementation-to-subscription conversion"]
    notes: "Mechanisms are described in company or third-party materials; no source provides realized price, revenue mix, or accounting recognition by stream."
    claimRefs: [CI001, CI002, CI005]
  - id: TI002
    title: Pricing and monetization
    columns: [Offering or motion, List or contract basis, Realized pricing, Discount or unknown, Underwriting implication]
    rows:
      - [Cloud and virtualized Palette, "Kilo-Core-hours: managed CPU cores multiplied by time", null, "No public list price or discount schedule", "Usage-linked expansion may scale with infrastructure, but revenue volatility depends on utilization and contract terms"]
      - [Edge and bare-metal Palette, "Per managed node", null, "No public list price, minimums, or services bundle", "Predictable site-count basis is possible; deployment complexity may raise delivery cost"]
      - [PaletteAI, "Flat fee per managed GPU", null, "No public GPU price, utilization assumptions, or attach-rate disclosure", "AI growth can increase contract value; economics depend on GPU footprint and customer workload"]
      - [Channel and marketplace motion, "Direct sales, systems integrators, channel partners, AWS and Azure marketplaces", null, "Partner margin, marketplace fees, and bookings attribution undisclosed", "Distribution may widen reach but can reduce net revenue or control of customer relationship"]
    notes: "The table separates described pricing bases from realized revenue; null cells mean the assigned sources did not disclose a public price or discount."
    claimRefs: [CI001, CI002, CI013]
  - id: TI003
    title: Unit economics and capital inputs
    columns: [Metric, Value, Confidence, Why it matters, Diligence ask]
    rows:
      - [ARR, null, "Unavailable; company claimed triple-digit ARR growth without amount", "Scale and growth quality cannot be tested", "Obtain monthly ARR bridge, cohort retention, churn, expansion, and reconciliation to GAAP revenue"]
      - [Gross margin, null, "Unavailable", "Support, certification, and integration intensity may materially affect software margins", "Obtain gross-margin history by subscription, services, deployment type, and support tier"]
      - [CAC/payback, null, "Unavailable", "Enterprise and public-sector cycles can consume cash before expansion", "Obtain bookings by channel, sales-cycle length, fully loaded CAC, payback, and partner economics"]
      - ["Cash, burn, and runway", null, "Unavailable after Series D", "Funding raised is not cash available; runway determines financing dependency", "Obtain latest balance sheet, monthly cash burn, debt schedule, restricted cash, and board-approved runway plan"]
    notes: "Null values are deliberate evidence gaps, not zeroes or estimates; financing totals do not establish cash available or runway."
    claimRefs: [CI003, CI008, CI010, CI011, CI012]

