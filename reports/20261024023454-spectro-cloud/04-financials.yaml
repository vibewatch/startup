    title: Revenue model bridge
    type: flow
    summary: Customer infrastructure activity is converted into recurring platform charges, with services and channel layers affecting revenue quality and margin.
    data:
      nodes:
        - id: customer-infrastructure
          label: "Managed customer infrastructure"
          note: "Cloud, virtualized, edge, bare-metal, VM, and GPU environments"
        - id: palette-platform
          label: "Palette / PaletteAI control plane"
          note: "Recurring platform subscription"
        - id: usage-basis
          label: "Measured basis"
          note: "Kilo-Core-hours, managed nodes, or managed GPUs"
        - id: expansion
          label: "Expansion motion"
          note: "More clusters, sites, business units, or GPUs"
        - id: services
          label: "Launchpads, Liftoff Kits, and support"
          note: "Implementation and technical-account-management layer"
        - id: gross-profit-question
          label: "Gross-profit outcome"
          note: "Depends on support, certification, integration, and services burden; public value unavailable"
    claimRefs: [CI001, CI005, CI006, CI008]

callouts:
  - calloutType: strength
    title: Infrastructure-linked expansion model
    body: The described pricing bases connect recurring revenue to managed infrastructure growth rather than seats, creating a plausible land-and-expand mechanism across clusters, sites, and GPUs.
    claimRefs: [CI001, CI002]
  - calloutType: risk
    title: Public economics are insufficient for underwriting
    body: ARR growth is company-claimed, while ARR level, revenue, gross margin, burn, runway, customer concentration, and realized pricing remain undisclosed in the assigned evidence.
    claimRefs: [CI003, CI008, CI012]
  - calloutType: recommendation
    title: Request a finance data room before valuation work
    body: A buyer or investor should obtain the ARR bridge, cohort and renewal data, contract pricing, gross-margin build, cash position, burn, debt, and financing terms before relying on a revenue multiple or runway conclusion.
    claimRefs: [CI012, CI013]

