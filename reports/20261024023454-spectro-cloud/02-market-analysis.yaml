      - [Spectro Cloud SAM / SOM, Current, "Undisclosed target mix", null, null, "Requires company account, pricing, geography, and win-rate data", low, "Public evidence cannot isolate serviceable or obtainable market"]
    notes: >-
      Values preserve publisher names, periods, global geography, and stated units.
      They are not averaged or normalized; null means the company-specific value is
      unsupported by available public evidence.
