      - [IT and telecom, "Cloud or network-platform leader", "Platform and operations teams", "Cloud or network program", "Hybrid, multi-cloud, and distributed orchestration", "Not publicly established", "Scale, portability, and edge operations"]
      - [Healthcare, "Healthcare IT or platform leader", "Reliability and application teams", "Clinical or digital infrastructure", "Compliant high-availability operations", "Not publicly established", "Downtime and governance risk"]
      - [Public sector and defense, "Program CIO or security authority", "Platform and mission teams", "Agency or program procurement", "Sovereign, air-gapped, and compliant infrastructure", "Not publicly established", "Security and sovereignty mandates"]
      - [Distributed retail and manufacturing, "Edge-platform or operations leader", "Site reliability and field operations", "Store, plant, or edge program", "Remote provisioning and lifecycle management", "Not publicly established", "Site count, connectivity, and field-service cost"]
      - [Neocloud and AI infrastructure, "AI infrastructure leader", "GPU platform and model-serving teams", "AI infrastructure program", "GPU cluster governance and distributed inference", "Not publicly established", "Utilization, portability, and production control"]
    notes: >-
      Segments and user roles are drawn from market research and company-issued
      positioning. Payer and budget-owner fields remain unverified at contract level.
    claimRefs: [CM005, CM006, CM007, CM011, CM012, CM013, CM014]
