  - type: private-evidence-only
    severity: critical
    topic: audited consolidated financials
    missingEvidence: Revenue, gross margin, EBITDA, capex, cash and debt for the operating group.
    whyItMatters: This is the main blocker preventing a confident buy recommendation.
    diligencePath: Request audited group accounts and latest board deck.
