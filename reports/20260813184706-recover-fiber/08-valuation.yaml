company:
  name: Recover Fiber
chapter:
  number: 8
  title: Valuation
  summary: 'Recover has enough market, customer, product and policy evidence to justify serious investor attention, but not enough public financial disclosure to justify underwriting a premium growth multiple with confidence. The company’s prior valuation anchor—roughly $1.1B in the 2022 Goldman Sachs-led round—was set before many of the customer and operating milestones now visible publicly, but it was also set before investors had to confront today’s tougher scrutiny around climate-industrial economics. The right stance is track, not buy: Recover looks like a category-relevant platform in recycled cotton, yet entry discipline should remain strict until margin, concentration and runway become transparent. Base-case fair value clusters around the prior unicorn mark; upside exists if Recover proves cross-hub consistency and converts recent proof into durable economics, while downside is material if execution or financing needs disappoint.'
sections:
- id: investment-thesis-and-anti-thesis
  title: Investment thesis versus anti-thesis
  body: 'The core thesis for Recover is attractive and coherent. It sits at the intersection of a large textile-waste problem, tightening policy pressure, rising brand demand for recycled content, and a technically credible operating platform that already serves real customers across multiple textile hubs. Public evidence since the 2022 round shows further commercial maturation: active customers, spinning partners, new factories, H&M’s multi-year agreement, and broader product packaging through yarns and fabrics. The anti-thesis is equally clear. This is an industrial scaling business, not an asset-light software company. Mechanical-recycling quality limits remain real, customer concentration is still opaque, and public financial transparency is far below what investors normally need to validate a premium unicorn price. The right investment posture is therefore not binary. Recover deserves continued attention and potentially serious engagement, but only with valuation discipline and diligence
    focused on unit economics, concentration and capital adequacy.'
