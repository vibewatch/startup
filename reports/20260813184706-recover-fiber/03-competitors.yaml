callouts:
- calloutType: strength
  title: Recover’s real advantage is pragmatic cotton-chain execution
  body: Many circular-textiles competitors still market technology, future plants, or regenerated-fiber promise. Recover’s public evidence is stronger on actually serving cotton-rich supply chains today through operating hubs, customer programs, traceability and lab support. That does not make it unassailable, but it does make it more operationally legible than several peers.
  claimRefs:
  - CP009
  - CP017
  - CP018
  - CP025
- calloutType: risk
  title: Switching costs are meaningful but not software-like
  body: Brands and mills can qualify one recycled-fiber program and still multi-home with others, especially when they are comparing cotton, polyester, cellulosic and chemical routes under one sustainability budget. Recover must keep winning on reliability and quality because the public record does not suggest hard lock-in.
  claimRefs:
  - CP020
  - CP021
  - CP022
  - CP023
  - CP026
- calloutType: risk
  title: Chemical and regenerated-fiber rivals are the main displacement threat
  body: Recover’s biggest medium-term threat is not another small generic recycler; it is the set of better-capitalized or better-positioned platforms that can promise virgin-like quality, higher recycled percentages, or simpler treatment of blended waste for premium product categories.
