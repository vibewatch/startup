  rows:
  - - Recover
    - Mechanical recycled cotton specialist
    - 84,300 MT/year disclosed capacity at end-2024; $100M 2022 round
    - Brands, spinners, mills, integrated manufacturers
    - Cotton-specific mechanical recycling, multi-hub footprint, traceability and lab support
    - Mechanical quality limits and incomplete public economics disclosure
  - - Circ
    - Chemical / regenerated textile-to-textile recycler
    - Backed by major investors; H&M/TENCEL launch highlighted in 2026
    - Brands seeking polycotton circularity and regenerated outputs
    - Turns polycotton waste into reusable raw materials with strong brand partnerships
    - More infrastructure-heavy and not cotton-mechanical specific
  - - Infinited Fiber
    - Regenerated circular fiber platform
    - Markets Infinna as 100% textile-waste fiber
    - Brands wanting cotton-like regenerated fiber
    - Virgin-like feel claims and 100% textile-waste story
    - Public source set here gives little evidence on realized scale or pricing
  - - Worn Again
    - Closed-loop textile-recycling technology
    - Technology-led circularity message
    - Brands seeking closed-loop fashion narratives
    - Strong anti-downcycling narrative and fiber-to-fiber messaging
    - Public source set gives limited current scale / commercialization detail
  - - BlockTexx
    - Advanced chemistry / separation platform
    - Commercial-scale facility messaging in Australia
    - Blended textiles, end-to-end recovery customers
    - S.O.F.T. separation and end-to-end ecosystem
    - Geographic concentration and non-cotton-specific positioning in retained sources
  - - Syre
    - Circular polyester platform
    - Announces very large 2032 production ambition
    - Polyester-focused brands and mills
    - Virgin-quality circular polyester positioning
    - Competes for sustainability budgets but not the same cotton-specific material lane
  - - Circulose
    - Cellulosic recycled pulp platform
    - Expanding brand network in 2026 press on homepage
    - Brands and fiber manufacturers using regenerated cellulosics
    - Growing brand network and textile-waste-to-cellulose positioning
    - Different product form and reliance on downstream fiber conversion partners
  notes: Profile table mixes direct cotton-specific peers with adjacent fiber-to-fiber alternatives because brands often compare circular-material pathways across budgets rather than within one technical category.
