companyProfile:
  summary: |
    Recover was established as an independent entity around 2020 out of the Ferre family’s long-running textile recycling heritage,
    while its operating entity Recover Textile Systems SL was incorporated in late 2019. The company produces recycled cotton fiber and
    cotton fiber blends through a mechanical recycling process and supports adoption with lab services, tracer verification, digital
    traceability work, and increasingly higher-level yarn and fabric offerings. Recover’s production and service footprint spans Spain,
    Bangladesh, Pakistan, Vietnam, and El Salvador, allowing it to serve major textile hubs and global brand programs.
  foundedDate: '2020-01-01'
  founders:
    - name: Alfredo Ferre / Ferre family spinout team
      role: Founding steward / spinout leadership
      background: Fourth-generation textile-recycling operator from the Hilaturas Ferre family whose recycling heritage dates back to 1947; later transitioned from CEO into product and innovation leadership at Recover.
      claimRefs:
        - CO003
        - CO004
  foundingLocation: Banyeres de Mariola, Valencia, Spain
  headquarters: Banyeres de Mariola, Valencia, Spain
  productSummary: |
    Recover’s core products are recycled cotton fiber and cotton fiber blends sold into spinners, mills, integrated manufacturers,
    and global brands. The broader product system now includes ready-to-use yarn and fabric platforms, lab testing, tracer verification,
    and digital traceability support designed to make recycled-cotton adoption easier across the supply chain.
  customerFocus: Global fashion brands, retailers, spinners, mills, and integrated textile manufacturers seeking scalable recycled-cotton inputs and related traceability / quality support.
  businessModel: B2B sale of recycled fiber and fiber blends with adjacent monetization and retention support through quality testing, traceability, co-development, and expanding yarn / fabric modules.
  stage: Growth / private unicorn
  fundingStatus: $100M June 2022 growth investment led by Goldman Sachs Asset Management alongside STORY3 Capital at an approximately $1.1B reported valuation; no comparably detailed later financing terms are public in the retained source set.
