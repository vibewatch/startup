  topStrengths:
    - "Recover has stronger public customer proof than many circular-material peers, including H&M, Primark, C&A, Lands’ End, Valdese, Prosperity, and Intradeco ecosystem evidence."
    - "The company already operates across multiple textile hubs and reported 84.3k MT/year of capacity at end-2024, which is unusual for a recycled-cotton platform."
    - "Policy tailwinds around textile waste, recycled content, and traceability should structurally benefit credible fiber-to-fiber recyclers."
    - "Recover’s trust stack — labs, ISO systems, tracers, RMDF work, and digital traceability pilots — can reduce adoption friction for major accounts."
    - "The 2022 Goldman / STORY3 round validates institutional investor interest in Recover’s strategic relevance."
  topRisks:
    - "Public financial transparency is still inadequate: no audited consolidated revenue, gross margin, cash, debt, or runway is available in the retained public record."
    - "Mechanical-recycling quality ceilings and cross-hub consistency risk remain material as Recover expands capacity and product scope."
    - "Customer concentration and contract-volume durability are opaque despite broad named-customer proof."
    - "Policy and DPP tailwinds can also become execution burdens if delegated rules or industry readiness evolve unfavorably."
    - "Further capital needs before new hubs and product layers fully stabilize could pressure valuation and dilution."
  unresolvedGaps:
    - "Audited consolidated financials and a current cap-table / debt picture are still missing."
    - "Top-customer revenue, volume, renewal, and concentration data are not public."
    - "Hub-level quality metrics, utilization, yield, and complaint rates are not publicly disclosed."
    - "Public evidence does not show how much production is fully covered by tracer, RMDF, and TextileGenesis workflows."
    - "Public comps for late-stage textile-circularity businesses remain too heterogeneous and under-disclosed for precise multiple-based pricing."
