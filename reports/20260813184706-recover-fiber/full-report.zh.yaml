      - number: '2.6'
        title: 展品
        blocks:
          - type: callout
            title: Recover 的市场废料充足，但合格原料不足
            body: 限制性试剂不是总体废弃纺织品数量，而是可追溯、可分拣、规格兼容，并能穿过回收流程进入主流工厂且不发生质量崩塌的纺织废料。这就是巨大废料统计能够与仍然很小的实际 SAM 共存的原因。
            calloutType: insight
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM036
          - type: callout
            title: 自上而下的 TAM 数字会高估可投资现实
            body: 宽口径市场报告和棉花市场相邻数字有助于提供背景，但会掩盖真实瓶颈：捕获率、分拣深度、混纺表现、工厂采用，以及回收链条中利润率为负的环节。投资人应从可处理原料自下而上推 SAM，而不是从时尚零售支出自上而下推。
            calloutType: risk
            claimRefs:
              - CM003
              - CM004
              - CM011
              - CM033
              - CM037
          - type: callout
            title: 监管、可追溯和品牌采购终于开始同向发力
            body: 单独收集、DPP 准备、再生成分预期和长期品牌采购信号开始相互强化。这一组合提高了 Recover 这类公司把可持续兴趣转成经常性工业需求的概率，而不是停留在孤立试点项目。
            calloutType: strength
            claimRefs:
