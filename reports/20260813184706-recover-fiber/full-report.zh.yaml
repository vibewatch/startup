      - number: '1.5'
        title: 里程碑、当前动能和尚未解决的尽调问题
        blocks:
          - type: paragraph
            body: >-
              Recover 近期里程碑显示真实商业动能。2025 年，公司在 2024 年初启动产品开发后宣布与 H&M 达成多年协议，借 Intradeco 扩展到中美洲，通过 TextileGenesis 以及与
              Target 开发相关的 RMDF / Tracing Textile Waste 工作深化可追溯基础设施，并继续放大 Primark 和 C&A
              相关验证点。与此同时，公司自己的材料承认，扩大再生棉并非没有摩擦。2024 年亮点明确提到，孟加拉国动荡提醒市场，供应链韧性、透明度和社会条件仍是现实运营风险。Retail Dive 也指出，Recover
              拒绝评论估值，同时承认机械再生纤维会在反复循环后最终降级。再加上控股公司层面融资说法与稀疏公开收入披露之间的缺口，投资人仍缺少当前收入运行率、毛利率、客户集中度、精确当前董事会席位，以及各生产地域对应业务占比的直接证据。Recover
              看起来商业相关性强、战略位置好，但公开记录更能证明增长方向，而不是证明当下现金经济性。
