            body: >-
              公开客户证据更擅长证明扩张，不足以证明留存。Recover 与 H&M 的关系从开发工作加深为多年供货协议。Primark 的合作从早期采用演进为全球规模的 RColorBlend 项目，并且到 2025
              年仍持续释放合作信息。C&A 将双方合作表述为长期且战略性。公司不断扩充纱线、面料和可追溯工具，也符合 先落地再扩张逻辑：一旦买方或供应链伙伴信任 Recover
              纤维，公司就能横向进入更多品类、结构或地区。但这些都不能替代硬留存指标。公开资料没有
              净留存率（NRR）、总留存率（GRR）、续约率、流失率、队列曲线或平均合同期限。因此，公开证据能支持「关系粘性足以继续扩张」，却不能支持更强的「收入高度耐久且分散」。这个区别对承销很关键。新的客户看板会显著提高信心——而且是显著提高。
