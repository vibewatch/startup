      - number: '4.4'
        title: 公开牵引力与缺失的私域指标
        blocks:
          - type: paragraph
            body: >-
              Recover 有足够公开牵引力证明它不是一个科研项目。公司报告 2024 年底全球产能为 84,300 MT/year，活跃客户 156 个，纺纱合作伙伴 141 个，已开发定制面料 756 款。欧盟
              Transition Pathways 案例研究给出了更早快照：2024 年初产能 65,000 MT/year、员工 350 人、客户 322 个。Tracxn 还给出截至 2026 年 6 月员工 397
              人的后续估计。合在一起，这些来源显示增长，但它们不是等价财务指标，也不会自动对齐。更重要的是，没有任何来源提供合并收入、毛利、EBITDA、烧钱速度、现金余额、工厂利用率、坏账或队列经济性。Empresia
              披露的一个类销售公开数据点——Recover Textile Systems SL 的 €2.5M
              ventas——几乎肯定不足以单独代表整个运营集团，应被视为狭窄法律实体快照，而不是承销答案。因此，本章对运营动能的信心高于对财务质量的信心。
