      - number: '7.3'
        title: 伙伴、客户和人员 / 执行风险
        blocks:
          - type: paragraph
            body: >-
              Recover 的增长路径依赖网络。公司依靠废料供应商、纺纱厂、织厂、数字可追溯系统、区域制造伙伴和锚定全球品牌。这些依赖在运转顺畅时是优势，在权力集中到 Recover
              直接控制之外时就是风险。Intradeco 帮助打开美洲市场，但也成为区域依赖。TextileGenesis 和 RMDF
              式流程有助于可追溯性，但系统采用仍取决于多层供应链中的第三方。客户证据很强，但头部品牌关系很可能在销量、信号和下游影响力上占据不成比例的权重。人员风险也需要关注。Recover 从 H&M、Coats Group
              和其他大型组织引入高管，大幅升级管理层；但这轮换新本身也带来整合和关键人风险，尤其是 Alfredo Ferre 从 CEO 转向产品和创新领导，而 Anders Sjöblom
              接手增长执行。领导层升级可以改善结果，也会在快速扩张时提高错位成本。
