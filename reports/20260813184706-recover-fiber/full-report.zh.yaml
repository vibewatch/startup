            body: >-
              Recover 的客户体系至少包含四类经济属性不同的群体。H&M、Primark、C&A、Lands’ End 和 Perry Ellis
              等全球品牌和零售商，自上而下拉动需求并提供信誉背书。纺纱厂和织厂是运营用户，必须验证纤维、纱线或面料性能。Intradeco 和 Prosperity Textile
              等垂直一体化制造商和区域伙伴，则在靠近生产市场的位置提供规模化转化能力。最后，Valdese Weavers 等家纺和专业合作伙伴，把 Recover
              的终端市场从基础服装拓宽出去。因此，买方、用户和付款方往往不是同一个主体。品牌可能赞助可持续目标，织厂可能验证性能，制造合作伙伴可能承担大部分运营负担。这种分层很重要，因为采用和粘性来自网络匹配，不只是 logo
              数量。Recover 披露的 141 家纺纱合作伙伴说明，客户基础更像生态系统，而不是简单的零售商名单。采购控制权也可能在层级之间移动。
