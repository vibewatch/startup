  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              Recover 的核心投资逻辑有吸引力，也自洽。它踩在几个交叉点上：巨大的纺织废弃物问题、收紧的政策压力、品牌对再生含量上升的需求，以及一个技术上可信、已经服务多个纺织枢纽真实客户的运营平台。2022
              年融资以来的公开证据显示，公司进一步商业成熟：活跃客户、纺纱合作伙伴、新工厂、H&M
              多年协议，以及通过纱线和面料做出的更完整产品包装。反向逻辑同样清楚。这是工业扩张业务，不是轻资产软件公司。机械回收的质量上限仍真实存在，客户集中度仍不透明，公开财务透明度也远低于投资人验证高价独角兽通常需要的水平。因此，正确投资姿态不是二选一。Recover
              值得继续关注，也可能值得认真接触，但前提是估值纪律，以及围绕单位经济、集中度和资本充足性的尽调。
