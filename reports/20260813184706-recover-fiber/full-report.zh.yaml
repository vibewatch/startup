figures:
  - id: FO001
    title: Recover 公司里程碑时间线
    type: timeline
    layout: wide
    summary: 从传统业务根基到当前多枢纽扩张阶段的关键里程碑。
    data:
      items:
        - date: '1914'
          label: Ferre 纺织业务创立
          detail: 工业化前身在西班牙投产。
          tone: neutral
        - date: '1947'
          label: 纺织废料回收启动
          detail: 家族企业开始把纺织废料回收成棉纱。
          tone: positive
        - date: 2019-11
          label: 西班牙运营公司注册成立
          detail: Recover Textile Systems SL 的法律实体以 Caldrah Europe SL 名义设立。
          tone: neutral
        - date: '2020'
          label: Recover 独立成立
          detail: 在 STORY3 支持的交接后，公司进入独立扩张阶段。
          tone: positive
        - date: 2022-03
          label: 孟加拉枢纽启用
          detail: 公司在核心成衣制造地区大幅扩产。
          tone: positive
        - date: 2022-06
          label: Goldman 领投 $100M 融资
          detail: 据报道，少数股权投资估值约 $1.1B。
          tone: positive
        - date: 2024-01
          label: Anders Sjöblom 出任 CEO
          detail: 领导权从 Alfredo Ferre 交给一名前 H&M 高管。
          tone: positive
        - date: '2024'
          label: 越南工厂投产
          detail: Recover 在东南亚新增回收产能。
          tone: positive
        - date: '2024'
          label: 孟加拉动荡
          detail: 公司提到逆境，也强调需要更有韧性的供应链。
          tone: negative
        - date: '2025'
          label: H&M 与 Intradeco 里程碑
          detail: Recover 签下 H&M 多年协议，并与 Intradeco 在萨尔瓦多启动合资公司。
          tone: positive
        - date: '2025'
          label: Target 可追溯性试点
