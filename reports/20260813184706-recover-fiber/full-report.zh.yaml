chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、法律结构和商业模式
        blocks:
          - type: paragraph
            body: >-
              Recover
              不是消费时尚品牌，而是一家机械再生棉材料供应商。核心主张是把工业后和消费后纺织废料转成再生棉纤维和富棉混纺，再重新接入纱线、面料、服装、配饰和家纺供应链。官方产品页显示，产品组合覆盖纯再生棉、再生棉混纺、纱线和可按规格采购的面料；Tracxn
              和欧盟委员会 Transition Pathways 案例研究等独立描述则把公司定位为规模化的纺织用再生棉纤维和纤维混纺制造商。法律实体图景比品牌故事更复杂：连接西班牙商业登记的注册聚合资料显示，Recover
              Textile Systems SL 于 2019 年底以 Caldrah Europe SL 的旧名注册成立，Recover Holdco Inc 列为唯一所有者。与此同时，Recover
              自己的叙事强调，公司在 2020 年从 Ferre 家族更悠久的纺织业务中独立，成为循环材料公司。最干净的尽调口径是：品牌化创业公司是一个建立在 1947 年回收传承上的 2020
              年分拆项目；当前西班牙运营实体在法律上始于 2019 年，并位于控股公司结构之内。
