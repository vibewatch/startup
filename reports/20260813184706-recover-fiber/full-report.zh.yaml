          detail: 品牌或零售商设定再生材料目标
        - label: 材料与合作伙伴寻源
          detail: 评估 Recover、纺纱商、织造厂和合作伙伴
        - label: 开发与合格验证
          detail: 测试纤维、纱线或面料的成本、质量和可追溯性
        - label: 在系列或产品线中发布
          detail: 材料进入商业化产品范围
        - label: 重复发布并扩展品类
          detail: 客户扩展到更多 SKU、市场或地区
        - label: 生态深化
          detail: 更多织造厂、纱线、面料或区域合作伙伴接入同一客户
