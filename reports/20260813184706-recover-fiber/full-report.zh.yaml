      - number: '2.3'
        title: 买方、用户、付款方和采用路径
        blocks:
          - type: paragraph
            body: >-
              Recover
              的商业动作为多边结构。其产出的技术用户往往是纺纱厂、纱线生产商或面料厂，它们必须让纤维跑过工业流程且不出现质量失败。经济发起方往往是品牌、零售商或采购组织，它们需要低影响材料投入、合规准备，或可见的循环性验证点。付款方会随项目变化：品牌可能通过更长期包销或共同开发付费，垂直一体化制造商或
              JV 伙伴则可能承担运营转化成本。H&M 和 Primark 材料显示，主流零售商如何成为需求锚点；Intradeco 则显示制造伙伴如何同时成为运营方和进入市场渠道。Target 相关 RMDF
              工作又增加一层：可追溯和文档已经进入采购流程，不只是可持续叙事。采用路径因此分阶段展开：废料要先被收集和分拣；回收商要产出符合规格的纤维；纺纱厂和织造厂要验证混纺表现；品牌要批准外观、耐用性和主张佐证；认证加可追溯系统要把故事带到审计，并最终带到数字产品护照。这就是为什么该市场不是简单的每公斤价格商品销售。它是一种集成式销售，需要工艺信任、质量信任、数据信任和供应连续性信任。
