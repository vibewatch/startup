      - number: '8.2'
        title: 估值背景、入场纪律与可比公司
        blocks:
          - type: paragraph
            body: >-
              最强的公开估值锚点仍是 2022 年 6 月那轮融资：Goldman Sachs Asset Management 牵头的 $100M 少数股权投资，广泛报道给 Recover 的估值约为
              $1.1B。这个锚有用，但不够。它说明公司曾在成熟支持方参与下迈过独角兽门槛；却不能说明，经历几年运营扩张，以及公开市场对气候制造企业保持怀疑后，那个价格仍然合理。可比公司分析也不完美，因为 Recover
              横跨多个同业集合：Lenzing 等上市存量企业，Circ 和 Infinited Fiber 等私营纺织品到纺织品回收商，Syre 等循环聚酯新进入者，以及 Circulose
              等纤维素玩家。许多同业要么不公开披露可用估值数据，要么通过不同聚合物和工艺类型变现。这里使用可比公司 的最佳方式是看方向。Recover
              看起来比一些技术前置型同业更商业成熟，但对后期价格来说，透明度低于投资人预期。这个组合支持中性偏谨慎的入场姿态，而不是激进的动量承销。
