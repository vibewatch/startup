      - number: '3.3'
        title: 切换成本、多供应商并用和分销权力
        blocks:
          - type: paragraph
            body: >-
              这个品类的切换成本有意义，但不是绝对。纺纱厂或织造厂一旦认证某种再生纤维，并调好混纺配方、色差一致性和性能，就可能不愿快速切换；尤其当下游客户已经批准特定主张或认证时更是如此。但公开记录也暗示，买方能够、也很可能会多供应商并用。H&M
              等品牌同时与 Recover 和 Circ 合作，市场报告也显示，在棉、聚酯和纤维素路径上，既有和新兴供应商范围很广。这意味着 Recover
              没有软件式锁定。分销权力来自合作伙伴触达、可靠性和品类信任。Recover 靠近纺织枢纽的足迹、从西班牙、孟加拉国、越南、巴基斯坦和萨尔瓦多服务品牌的能力，以及其实验室 /
              示踪系统，都降低了采用摩擦。但大型既有企业有另一种权力：全球销售网络、资产负债表韧性，以及横跨多个品类的既有采购关系。因此，竞争问题在于：在替代材料系统变得足够容易、足够便宜并能替代主要客户账户之前，Recover
              能否持续赢得再生棉项目的“首选务实方案”。
