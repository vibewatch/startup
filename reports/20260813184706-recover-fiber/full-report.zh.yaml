      - CV010
      - CV011
      - CV012
      - CV029
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 相对于 2022 年上一轮融资锚点的情景估值区间。
    data:
      items:
        - label: 悲观估值（$B）
          low: 0.5
          base: 0.65
          high: 0.8
        - label: 基准估值（$B）
          low: 1
          base: 1.1
          high: 1.2
        - label: 乐观估值（$B）
          low: 1.5
          base: 1.65
          high: 1.8
    approximationNotes: 区间带有判断性，并与公开证据质量挂钩；由于收入或 EBITDA 指标未公开，区间并非基于这些指标。
