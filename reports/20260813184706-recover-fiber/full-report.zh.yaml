      - number: '7.4'
        title: 财务 / 模型风险、缓释措施与终止标准
        blocks:
          - type: paragraph
            body: >-
              披露缺口放大了财务风险。Recover
              拥有高质量战略支持方和可信的需求证据，但公开记录仍未披露合并收入、毛利率、现金余额、债务敞口或现金跑道。这意味着，如果产能爬坡慢于预期、客户认证时间拉长，或区域扰动迫使营运资本激增，投资人无法判断公司能吸收多少运营波动。对一个很可能需要持续
              资本开支、库存融资和质控支出的制造模型来说，这尤其重要。正确解读不是 Recover 财务弱，而是外部人尚无法证明其财务韧性。实际做法是带着终止标准审视：如果头部客户集中度高、跨枢纽质量差异持续存在、DPP /
              可追溯性准备仍不完整，或新宣布的枢纽稳定前还需要另一轮大额融资，风险收益会明显改写。公开证据支持谨慎乐观，不支持掉以轻心。
