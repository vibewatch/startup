      - number: '6.4'
        title: 扩张、集中度风险与采购摩擦
        blocks:
          - type: paragraph
            body: >-
              Recover
              似乎有多条扩张路径：更多品牌、更深的既有品牌渗透、更多纺纱厂和织厂、纱线与面料等新产品层，以及更多区域生产节点。不过，集中度风险仍很难量化。少数大型全球品牌很可能在信号和销量上占据不成比例的权重，一些伙伴依赖——尤其是一体化制造商和区域织厂——也可能调节
              Recover
              接触终端客户的能力。采购摩擦同样不低。材料公司每进入一个新客户或品类，都要反复证明质量、可追溯性和成本竞争力。这会拖慢导入，也会让漏斗顶端看起来好于实际收入。因此，客户侧结论是：真实采用和生态广度证据为正面，但在公司披露续约、合同和钱包份额数据之前，对耐久性和集中度只能给中等信心。如今这些数字仍未公开。更细的分层会让集中度分析更锋利。
