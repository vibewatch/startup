      - number: '1.3'
        title: 资本结构与所有权姿态
        blocks:
          - type: paragraph
            body: >-
              公开记录中，Recover 的标志性融资事件仍是 2022 年 6 月少数股权融资。Recover 自身公告、Retail Dive 和 Tracxn 在核心事实上一致：Goldman Sachs Asset
              Management 领投 $100 million 投资，STORY3 Capital Partners 仍为大股东；第三方报道把该交易与约 $1.1 billion 投后估值关联起来。Recover
              借这轮融资把自己定位为品类定义型再生棉平台，覆盖更广义的棉花市场，资金用于全球扩张、产能增长和技术开发。后续领导层公告还将 Fortress Investment Group 和 Eldridge
              Industries 列为机构支持方，但本次尽调资料中的公开材料没有说明它们入场时间、持股比例或董事会权利。来自西班牙注册资料的来源补充了有用的法律细节：Recover Holdco Inc 看起来是
              Recover Textile Systems SL 的唯一所有者，该实体运营公司层面的登记股本只有 €3,000，PwC 列为审计师。这并不意味着业务本身资本不足；它意味着真实资本结构在西班牙 opco
              之上，投资人需要控股公司层面的文件，而不是只看本地公司摘录，才能理解稀释、控制和现金流动。
