companyProfile:
  summary: >
    Recover 大约在 2020 年从 Ferre 家族长期纺织回收业务中独立出来；其运营实体 Recover Textile Systems SL 则于 2019
    年底注册成立。公司通过机械回收工艺生产再生棉纤维和棉纤维混纺，并用实验室服务、示踪验证、数字可追溯工作以及层级越来越高的纱线和面料产品来推动采用。Recover
    的生产和服务足迹覆盖西班牙、孟加拉国、巴基斯坦、越南和萨尔瓦多，使其能够服务主要纺织枢纽和全球品牌项目。
