      - number: '2.4'
        title: 增长驱动因素和需求拉动
        blocks:
          - type: paragraph
            body: >-
              Recover 所在品类的需求拉动越来越来自监管和运营，而不只是声誉。Waste Framework Directive 要求从 2025 年起单独收集纺织品，ESPR
              则把纺织品列为优先产品组，推动市场走向耐用性、可回收性、再生成分披露和数字产品护照。Recover 自己的政策评论准确指出了协同：WFD 能提高废料捕获，ESPR
              及相关规则则创造下游再生投入需求。可追溯要求也在加压。Recover 的 DPP 文章和与 Target 的 RMDF
              工作显示，品牌现在需要材料来源和监管链信息，而不是泛泛的可持续声明。环境经济性同样重要。Recover 的影响方法文章称，1kg 其再生棉相较传统棉可节水 99.9%、CO2 减排 93%；Global
              Fashion Agenda 聚焦文章也把扩大再生棉定位为对气候压力和原材料稀缺的回应。客户侧，H&M 的长期采购信号、持续的 Primark
              项目以及品牌主导的产品开发工作，降低了再生棉被困在小型试点中的风险。结果是，监管、品牌承诺、可追溯基础设施和资源节省叙事指向同一方向：市场对高质量再生纤维的可信需求，超过当前系统能够轻松供应的量。
