      - CV003
      - CV007
      - CV009
      - CV029
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 对把价值推高或压低至既有估值锚上下的因素做方向性评分。
    data:
      items:
        - label: 具名客户证明
