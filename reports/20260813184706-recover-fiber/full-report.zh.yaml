        blocks:
          - type: paragraph
            body: >-
              仅基于公开证据，Recover
              应评为观察，信心中等，风险高；估值处在偏高到合理的边界，很大程度取决于交易结构。公司看起来比许多气候制造叙事更可信，因为它有真实客户、真实产能和真实政策顺风。但缺少经审计的合并财务可见度，使我们无法上调到买入。如果新一轮定价明显高于
              2022
              年估值，却没有明显更好的披露，立场很可能转向偏高。相反，如果投资人能拿到保护性结构、强信息权，以及接近上一轮锚点或更好的价格，风险收益会更有意思。下一步最有价值的尽调，不是做更多主题市场研究；而是在账户、枢纽和产品族层面做一手财务和运营承销。Recover
              可能值得投资。但在公开透明度达到足够水平前，还不能无视价格。
