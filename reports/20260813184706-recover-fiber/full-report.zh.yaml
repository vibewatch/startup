        - label: 执行风险
          value: High
          status: negative
          detail: 跨枢纽质量和资本开支纪律很关键
        - label: 估值把握度
          value: Medium-low
          status: negative
          detail: 既有独角兽锚点有用，但不足以支撑溢价信心
    claimRefs:
      - CV004
      - CV008
      - CV014
      - CV031
      - CV032
      - CV040
