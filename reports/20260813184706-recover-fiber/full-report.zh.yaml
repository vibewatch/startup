      - CR022
      - CR023
      - CR024
      - CR025
      - CR026
  - id: FV001
    title: 投资建议逻辑
    type: flow
    layout: standard
    summary: 市场证明、风险和估值锚如何组合成观察建议。
    data:
      nodes:
        - id: v1
          label: 大量废料 + 政策机会
        - id: v2
          label: 真实客户与产能证明
        - id: v3
          label: 工业执行与质量风险
        - id: v4
          label: 财务不透明与资本密集度
        - id: v5
          label: 既有独角兽估值锚（~$1.1B）
        - id: v6
          label: 观察，不买入
      edges:
        - from: v1
          to: v6
          label: 赋予战略意义
        - from: v2
          to: v6
          label: 支撑可信度
        - from: v3
          to: v6
          label: 避免激进投资测算
        - from: v4
          to: v6
          label: 要求价格纪律
        - from: v5
          to: v6
          label: 提供锚点，但不保证价值
    claimRefs:
