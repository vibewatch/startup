      - number: '8.3'
        title: 乐观 / 基准 / 悲观情景与终止触发
        blocks:
          - type: paragraph
            body: >-
              乐观情景是，Recover 从再生棉品类领导者复利成长为再生棉采用的默认供应链平台，拥有更强可追溯性、更多织厂、更广产品层，以及对全球品牌账户更深的渗透。在这种情况下，2022
              年独角兽估值可能显得保守，而不是激进。基准情景更克制：Recover 继续增长，并保持强战略相关性，但毛利可见度、资本开支
              需求和客户不透明，把公允价值锚在上一轮融资附近，直到更好的数据出现。悲观情景是，政策顺风变现比预期更慢，机械质量上限压住高端使用场景，新足迹扩张完全稳定前还需要新资本。即便公司仍有战略吸引力，估值也会被大幅压缩。因此，终止触发集中在集中度、质量一致性、DPP
              / 可追溯性准备度和融资需求上，而不是公司到底有没有真实需求。
