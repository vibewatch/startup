      - number: '4.3'
        title: 成本结构、营运资本和资本强度
        blocks:
          - type: paragraph
            body: >-
              按软件标准看，Recover 资本密集；按工业循环标准看，它相对务实。其模式需要原料采购和认证、破碎与回收运营、质量控制、跨主要纺织枢纽物流，以及持续扩建工厂或合资企业。公司称 2022 年 Goldman
              领投资金将加速全球扩张和产能；2024 年亮点提到越南新工厂，Intradeco JV
              则瞄准美洲近岸需求。这种运营画像意味着可观资本开支、与库存和应收账款绑定的营运资本，以及实验室、认证和供应链管理上的持续支出。与此同时，Recover
              的机械回收路线可能避开某些对手承担的化工厂复杂度。但这不应被误读为资本需求低。公开证据仍留下关键成本问题：投入品良率损失、各枢纽劳动强度、货运负担、维护性资本开支，以及营运资本中有多少由客户资助、有多少靠自身融资。审慎结论是，Recover
              的模式可以规模化，但很可能不是轻资产负债表模式。
            claimRefs:
              - CI015
              - CI016
              - CI017
