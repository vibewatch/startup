      - number: '4.5'
        title: 资本充足性、融资依赖和结论
        blocks:
          - type: paragraph
            body: >-
              Recover 的融资故事有支撑，但不完整。公司在 2022 年 6 月获得一轮 $100M 少数股权融资，由 Goldman Sachs Asset Management 领投，STORY3 Capital
              共同参与；公开报道把该轮估值放在约 $1.1B。Recover
              明确把这笔资本与全球扩张和产能增长绑定，后续公开证据也显示公司继续扩展足迹。这支持一种判断：该轮资金支持了真实规模化活动，而不只是修补资产负债表。不过，投资人仍无法用公开数据判断资本是否充足，因为没有披露手头现金、烧钱速度、月度资本开支运行率、债务结构、项目融资敞口或下一轮触发条件。注册资料来源补充了有用结构事实——例如
              Recover Holdco Inc 持有西班牙实体、PwC 是其审计师——但没有给出合并集团现金状况。财务结论因此是：战略融资能力和商业需求上谨慎正面，但利润率路径和现金跑道仍卡住。Recover
              看起来融资能力尚可；但还谈不上财务完全透明。
