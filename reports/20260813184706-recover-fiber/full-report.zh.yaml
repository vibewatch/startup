  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接同行、相邻玩家、既有巨头和替代品
        blocks:
          - type: paragraph
            body: >-
              Recover 的竞争格局，比一串制造“再生纺织品”的公司名单更宽。一端是直接或近直接同行，它们试图帮助品牌以商业规模用再生棉或纺织来源纤维替代原生投入。另一端是 Circ、Infinited
              Fiber、Worn Again、BlockTexx、Syre 和 Circulose
              等化学或再生纤维公司，它们用不同科学、材料和下游主张争夺类似的循环预算。市场报告又加上第三层既有玩家：Lenzing、Birla Cellulose、Unifi、Procotex、Boer Group
              以及其他成熟纤维或回收企业，它们能向现有全球客户网络交叉销售。最后，现状替代方案仍强：当技术风险、价格或供应连续性让纺织到纺织方案显得太难时，品牌可以继续购买原生棉、传统 MMCFs
              或瓶到纤维再生合成材料。Recover 自身材料和 Tracxn
              画像显示，公司直接赛道是机械再生棉和棉混纺投入，卖入纱线、面料和成衣供应链。这个赛道比整体纺织回收市场更窄；但如果公司能在富棉应用中保持更高质量和可追溯性，而通用回收商难以做到，它也具备防守性。
