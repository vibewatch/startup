      - number: '1.2'
        title: 传承、领导层和治理
        blocks:
          - type: paragraph
            body: >-
              Recover 最强可信度信号在于，它的创业叙事扎根于真实产业谱系，而不是一个从零开始的环保概念。Ferre 家族纺织业务可追溯至 1914 年；Recover 自身领导层材料和欧盟 Transition
              Pathways 画像都称，该家族从 1947 年开始把纺织废料回收成棉纱。因此，Alfredo Ferre 的重要性不只在于高管身份，更在于他连接了传统工艺经验与规模化商业化。2024
              年，他从首席执行官转到聚焦产品、创新和可持续发展的角色，Anders Sjöblom 则在 H&M Group 担任高管后接任 CEO。Recover 还任命 Matthew Neville
              为首位全球首席商务官，并将 Hans Ploos van Amstel
              提升为董事会主席，说明公司正在为全球零售客户管理、财务纪律和董事会层面的监督配班，而不只是依靠家族守护。公开来源看，治理仍有些不透明，因为本轮研究没有拿到当前完整控股公司董事会名单和所有权拆分；但现有证据确实显示，Goldman
              在 2022 年获得董事会代表席位，公司也持续招募拥有大型品牌和转型背景的资深高管。
