      - number: '1.4'
        title: 运营足迹与商业规模
        blocks:
          - type: paragraph
            body: >-
              Recover 已从以西班牙为中心的传承业务扩展为地域分散的纤维网络。2022 年可持续发展报告把西班牙和孟加拉国称为 Recover 自营枢纽，把巴基斯坦称为授权生产设施；后续官方更新在 2024
              年加入越南，并在 2025 年启动了与 Intradeco 的萨尔瓦多合资企业。公司自己的 H&M
              公告把这概括为横跨欧洲、亚洲和美洲的五个回收枢纽，与其近期运营叙事方向一致。公开规模披露随日期和方法不同而变化，因此应把它们当成有时间戳的快照，而不是一个干净的当前指标。欧盟 Transition
              Pathways 画像称，2024 年初 Recover 拥有 65,000 metric tons per year 破碎产能、350 名员工和 322 个客户。Recover 的 2024
              年可持续发展亮点随后披露，年纤维产能为 84,300 metric tons，活跃客户 156 个，已开发定制面料 756 款，纺纱合作伙伴 141 个；同一报告称员工队伍在西班牙、孟加拉国和越南接近 300
              人。Tracxn 则列出截至 2026 年 6 月员工 397 人。最稳妥解读是，Recover
              仍在快速扩张，不同披露统计的是不同对象——活跃直接客户、更广义客户生态，或不同员工快照——而不是公司发生了剧烈收缩。
