  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 从客户工作流看 Recover 交付什么
        blocks:
          - type: paragraph
            body: >-
              Recover 卖的不是单一 SKU，而是一组再生棉投入品和层级越来越高的供应链资产。官方材料把低影响再生棉纤维和棉纤维混纺描述为核心产品。近期发布显示，公司有意向上抽象：Recover Yarns
              打包可直接使用的纱线开发成果，Recover Fabrics
              则为品牌打包可直接使用的面料选项。从工作流看，客户买的不只是“再生纤维”；它买的是一种摩擦更低、可把再生棉接入商业纺织项目的方法。这个框架很重要，因为它解释了为什么实验室服务、可追溯、认证和开发支持都属于产品故事。Recover
              的产品因此更适合被理解为一个模块化工业产品，覆盖原材料、半成品纺织投入和降低认证痛苦的保证层。这也解释了为什么产品表面随着时间扩张：增加纱线和面料模块，可以让客户采用循环材料时不必自己解决每个技术步骤。
            claimRefs:
