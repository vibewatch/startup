      - number: '4.2'
        title: GTM 动作与销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              Recover 的 GTM 看起来由企业客户和供应链驱动。H&M 协议称，合作从 2024 年初开始，直到 2025
              年底才进入规模化商业导入；这是一个强信号，说明认证周期可能长达许多个月。对一家材料公司而言，这并不意外，因为其产出必须在多个制造步骤中满足性能、可追溯和成本约束。Recover
              披露的客户数和纺纱合作伙伴数显示，公司一旦通过认证，商业触达面可以很广。但公开证据仍更擅长展示 logo 和伙伴数量，而不是
              CAC、回本周期、转化率或销售配额生产率等效率指标。现有最佳代理指标是：与大品牌的多年合同、Intradeco
              这类区域分销战略合作，以及暗示销售管线深度的定制面料开发活动。它们指向有意义的需求，也指向劳动密集型商业动作：技术销售、产品开发和供应链赋能可能混在一起。公开数据因此更能支持需求验证，而不是销售效率验证。
