  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入来源、变现和确认复杂度
        blocks:
          - type: paragraph
            body: >-
              Recover 的公开材料描述的是以 B2B 为主的收入模式：向纱线纺纱厂、织造厂和垂直一体化服装供应链销售再生棉纤维和棉混纺投入品。Tracxn
              扩展了这个图景，称公司还提供面料和无品牌基础服装，说明业务谱系从原材料供应延伸到更集成的产品项目。Recover
              自身材料又增加两层变现：实验室服务和示踪验证。按绝对金额看，它们可能不如纤维销售重要，但如果能帮助公司赢得认证、保护留存或支撑更好定价，就会改善收入质量。收入确认复杂度看起来中等，并不简单。H&M
              这类多年协议、与织造厂和品牌的共同开发工作，以及区域合资企业，都意味着商业化分阶段展开：样品、认证批次和规模化经常性订单可能跨越很长时间，而不是马上发生。公开来源没有披露 Recover
              只确认纤维销售、服务费，还是也确认收入分成 / 联名经济性。因此，投资人可以在高层次清楚描述模式，但还不能把公开信息转成可靠的分收入流桥。
