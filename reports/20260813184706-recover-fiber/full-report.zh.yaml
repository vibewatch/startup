      - number: '5.2'
        title: 机械回收架构和交付工作流
        blocks:
          - type: paragraph
            body: >-
              Recover 的运营架构从纺织废料开始，以可重新进入服装价值链的合格纤维或纺织投入结束。欧盟 Transition Pathways 案例研究描述的流程是：将材料切成更小片，使用预处理抗静电喷剂，然后放入
              Recover 的回收机器处理。Recover 的解释文章和技术评审说明了这件事为何重要：富棉材料可以机械回收，也可以化学回收，但 Recover
              的商业路线是机械路径，并通过混纺、质量控制和供应链集成来强化。工作流并不只发生在工厂内部。它还包括废料可追溯、实验室分析、质量管理、品牌或工厂认证，以及越来越多通过 TextileGenesis 和 RMDF
              相关流程开展的数字监管链试点。正是这种物理加工和保证基础设施的组合，把一个商品化回收步骤变成了商业产品系统。该模式仍然运营强度高，因为原料波动、跨站点标准化和下游性能都必须持续管理。
            claimRefs:
