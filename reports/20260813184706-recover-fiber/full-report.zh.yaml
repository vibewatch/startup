  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、相邻领域和替代品
        blocks:
          - type: paragraph
            body: >-
              Recover
              参与的不是整个服装市场，甚至不是完整回收经济。它真正的市场位于更窄区域：可在纺织供应链中替代部分原生棉或低影响替代品的再生棉和富棉材料投入。相关支出包括再生纤维、纱线、面料开发以及帮助品牌、织造厂和纺纱厂大规模采购可信再生棉的可追溯赋能服务。它不包括成衣零售利润、转售平台、维修以及普通市政废弃物管理，尽管这些类别会影响整体循环结果。公司自己的
              2022 年融资新闻稿有参考价值，因为它把 Recover 放在更广义的 $50 billion 棉花市场中；品牌想部分替代的是这个经济相邻市场，而不是 Recover
              今天能够服务的精确支出。现状替代品因此不只是原生棉，还包括低端机械回收商、提供再生纤维素的化学回收商、再生聚酯供应商；当收集和分拣经济性跑不通时，有时替代选项只是继续填埋或焚烧。核心市场问题不是纺织废料是否存在——废料量远超今天系统吸收能力——而是是否有足够废料能在品牌和工厂可接受的经济性下转化为达到回收等级、符合规格的投入品。
