  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Recover 所处政策环境整体有利于纺织品回收，但远非没有风险。Waste Framework Directive、单独收集规则和 Ecodesign for Sustainable Products
              Regulation 可以扩大原料供给和再生含量需求，也会制造执行风险。如果规则对可回收性、再生含量、可追溯性或产品护照字段的定义，行业短期内落不了地，回收企业可能承担合规成本，却拿不到匹配变现。Recover
              自己的政策文字也点出危险：收集义务可能让纺织品数量增长快于合格分拣原料的供给；如果定义过松，最低再生含量规则也可能忽视纤维到纤维回收商的需求。这里审阅的运营实体，在公开法律实体来源中没有明显诉讼或破产事件，但这些来源也再次说明，承销取决于实体结构、所有权和申报边界。因此，法律风险不太像某一起可见诉讼，更像监管设计、定义制定，以及立法雄心与工业准备度之间的落差。
