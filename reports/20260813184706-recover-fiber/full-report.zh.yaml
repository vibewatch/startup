      - number: '2.2'
        title: 市场规模视角与受证据约束的 TAM / SAM 逻辑
        blocks:
          - type: paragraph
            body: >-
              给 Recover 做市场规模判断，最稳的办法是保留多重视角，而不是假装一个数字能概括业务。资本市场宽口径来自 MarketsandMarkets：其预测纺织回收市场将从 2025 年的 $8.41
              billion 增至 2030 年的 $11.88 billion。这个方向有用，但口径过宽，涵盖多种材料、工艺和终端用途。监管-工业视角来自 EEA 和 BCG：欧盟 2020 年产生 6.95 million
              tonnes 纺织废料；BCG 估计欧洲 2025 年产生约 15.2 million tonnes 纺织废料，其中 13.3 million tonnes 为消费后废料。但目前只有约 1.5 million
              tonnes 被收集和分拣，形成一个有可能走向纺织到纺织回收的基础。分子视角进一步收窄 Recover 的相关性：BCG 估计，在已收集和分拣的消费后废料中，棉、聚酯 / 涤棉合计占分子
              79%。最后，公司规划视角说明，投资人应谨慎看待自上而下的野心。Recover 自写和第三方报道的扩张目标曾从 2025 年 200,000 metric tons 再生棉到 2026 年 350,000
              metric tons 不等，而公司披露的 2024 年底产能为 84,300 metric tons。可信结论是：废料池巨大，真正可处理的 SAM 小得多，Recover 当前 SOM
              取决于执行和原料经济性，而不是理论需求不足。
