          value: 3.5
          detail: 正向护城河贡献因素
        - label: 财务不透明
          value: -4.5
          detail: 最大折价因素
        - label: 执行 / 质量风险
          value: -3.5
          detail: 重大工业风险
        - label: 战略投资者支持
          value: 2.5
          detail: 有帮助，但单独不够
