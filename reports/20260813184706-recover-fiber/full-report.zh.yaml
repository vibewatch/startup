      - number: '2.5'
        title: 约束、经济性和矛盾证据
        blocks:
          - type: paragraph
            body: >-
              Recover
              市场的主要约束，不是废料不存在，也不是可持续话术不存在。难点在于把低质量、混合且受污染的纺织废料转成可重复、商业上可接受的纤维。多方来源都指向这一点。机械回收比化学回收更便宜、更容易部署，尤其适合资本较少的地区，但每轮循环都会让纤维降级；除非混纺经过精细工程设计，产出往往会被推向低价值或低性能应用。Recover
              自己的 Rieter/Birla 试验文章承认，许多环锭纺纱线在普通工业实践中仍遇到 20% 再生棉上限。BCG 补充称，即使有政策支持，欧洲到 2035 年把纺织到纺织回收扩大至约 15%，也可能需要
              €8-11 billion 一次性资本开支和 €5-6.5 billion 经常性运营开支，价值链部分环节还会面临被压缩甚至为负的 EBIT 利润率。EEA 和 MDPI
              来源也强调，欧洲各地收集、分拣和报告系统仍不一致。这些约束解释了为什么 Recover
              的市场应被视为受供应和执行约束，而不是受需求约束。它们也解释了为什么公司相关来源中的目标彼此矛盾不只是小披露瑕疵——那是在提示，市场成形仍领先于全规模工业验证。
