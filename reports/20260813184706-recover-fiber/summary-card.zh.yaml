  topStrengths:
    - Recover 的公开客户证据强过许多循环材料同业，包括 H&M、Primark、C&A、Lands’ End、Valdese、Prosperity 和 Intradeco 生态证据。
    - 公司已跨多个纺织枢纽运营，并报告 2024 年末产能达到 84.3k MT/year；这在再生棉平台中并不常见。
    - 围绕纺织废弃物、再生成分和可追溯性的政策顺风，会结构性利好可信的 fiber-to-fiber 回收商。
    - Recover 的信任栈包括实验室、ISO 体系、示踪剂、RMDF 工作和数字追溯试点，可降低大客户采用摩擦。
    - 2022 年 Goldman / STORY3 轮融资验证了机构投资人对 Recover 战略相关性的兴趣。
  topRisks:
    - 公开财务透明度仍不足：保留的公开记录里没有经审计合并收入、毛利率、现金、债务或现金跑道。
    - 随着 Recover 扩产并扩展产品范围，机械回收的质量上限和跨枢纽一致性风险仍然重大。
    - 具名客户证据虽广，客户集中度和合同量耐久性仍不透明。
    - 若授权规则或行业准备度走向不利，政策和 DPP 顺风也可能变成执行负担。
    - 新枢纽和产品层完全稳定前若还需融资，估值和稀释都会承压。
  unresolvedGaps:
    - 经审计合并财务，以及最新股权结构表 / 债务图景仍然缺失。
    - 头部客户收入、销量、续约和集中度数据没有公开。
    - 枢纽层面的质量指标、利用率、良率和投诉率未公开披露。
    - 公开证据没有说明多少产量已被示踪剂、RMDF 和 TextileGenesis 工作流完整覆盖。
    - 后期纺织循环企业的公开可比公司过于异质，披露也不足，难以做精确倍数定价。
