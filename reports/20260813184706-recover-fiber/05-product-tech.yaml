    severity: material
    topic: quality consistency
    missingEvidence: Defect rates, complaint rates, test turnaround and cross-hub consistency metrics.
    whyItMatters: Without these, the quality-control story cannot be independently stress-tested.
    diligencePath: Obtain QA dashboards and customer complaint logs.
