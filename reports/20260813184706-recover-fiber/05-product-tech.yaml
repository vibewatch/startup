  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: yield and scrap
    missingEvidence: Plant-level yield, scrap, and rework data by waste type and hub.
    whyItMatters: These metrics determine whether quality claims scale economically.
    diligencePath: Request manufacturing KPIs and mass-balance reports by site.
    relatedQuestionRefs:
    - QE005
    - QE022
  - type: private-evidence-only
    severity: material
    topic: roadmap conversion
    missingEvidence: Adoption data for newly launched yarn and fabric platforms.
    whyItMatters: Launch announcements do not prove customer pull or revenue contribution.
    diligencePath: Review product-line pipeline, order conversion and repeat-rate data.
    relatedQuestionRefs:
    - QE003
    - QE013
  - type: missing-source
    severity: minor
    topic: IP position
    missingEvidence: Clear public disclosure of patents, trade secrets, or exclusive licenses underpinning Recover’s process.
    whyItMatters: This would sharpen the moat assessment beyond operational know-how.
    diligencePath: Request IP schedule and freedom-to-operate memo.
    relatedQuestionRefs:
    - QE016
    - QE017
  - type: private-evidence-only
    severity: material
    topic: traceability coverage
    missingEvidence: Share of production currently covered by TextileGenesis, tracers, RMDF-compatible documentation and certifications.
    whyItMatters: Coverage determines whether trust tools are real at scale or only partial overlays.
    diligencePath: Request production coverage metrics by partner and hub.
