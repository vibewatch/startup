callouts:
- calloutType: strength
  title: Recover’s product is the material plus the adoption machinery
  body: The most credible technical moat is not only the recycling machine. It is the combination of quality control, blending know-how, labs, tracer systems, and increasingly pre-packaged yarn/fabric solutions that reduce the work customers must do to use recycled cotton.
  claimRefs:
  - CE004
  - CE005
  - CE013
  - CE027
  - CE033
- calloutType: risk
  title: Mechanical quality ceilings still matter
  body: Even with process improvements, mechanical recycling remains constrained by feedstock quality and fiber degradation. Recover’s own content about ring-yarn blend ceilings is a reminder that the technology has real physical limits.
  claimRefs:
  - CE017
  - CE024
  - CE025
- calloutType: insight
  title: Recent roadmap items are adoption tools, not new science
  body: Yarns, fabrics, RMDF alignment and digital traceability all make the commercial system easier to use. They deepen product maturity, but they do not eliminate the underlying dependence on consistent waste inputs and disciplined operations.
  claimRefs:
  - CE020
  - CE021
  - CE029
  - CE035
  - CE036
