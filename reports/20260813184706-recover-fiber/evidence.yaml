evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: Current holdco-level revenue, gross margin and cash-flow disclosure for 2025-2026.
    whyItMatters: The public record proves valuation and strategic momentum more clearly than operating economics.
    diligencePath: Request management accounts, audited financial statements and board reporting packs.
    relatedQuestionRefs:
      - QO023
  - type: private-evidence-only
    severity: material
    topic: ownership
    missingEvidence: Exact ownership percentages, security types and board rights for STORY3, Goldman, Fortress and Eldridge.
    whyItMatters: Investor control, dilution and downside economics cannot be inferred from public press releases.
    diligencePath: Obtain cap table, shareholder agreement, side letters and latest financing documents.
    relatedQuestionRefs:
      - QO024
  - type: missing-source
    severity: minor
    topic: board composition
    missingEvidence: >-
      A complete current board roster for the holdco and operating entities, with appointment dates and committee
      responsibilities.
    whyItMatters: Governance quality and investor influence cannot be fully assessed from partial announcement-based evidence.
    diligencePath: Request current board list and charter documents or registry extracts for each relevant entity.
    relatedQuestionRefs:
      - QO025
  - type: conflicting-data
    severity: minor
    topic: scale metrics
    missingEvidence: A reconciled definition for capacity, customer-count and headcount metrics across 2024-2026 disclosures.
    whyItMatters: >-
      Different methodologies can make growth look faster or slower than it really is and complicate cross-chapter
      analysis.
    diligencePath: Ask management for metric definitions, monthly bridge tables and regional breakdowns.
    relatedQuestionRefs:
      - QO014
      - QO015
  - type: missing-source
    severity: minor
    topic: ownership structure
    missingEvidence: >-
      Direct holdco-level documents connecting Recover Holdco Inc, the Spanish opco and international manufacturing
      affiliates.
    whyItMatters: >-
      Without entity-level mapping, it is hard to assign assets, liabilities and governance to the right legal
      perimeter.
    diligencePath: Collect a corporate structure chart, intercompany agreements and local registry extracts for each hub country.
    relatedQuestionRefs:
      - QO012
      - QO024
  - type: private-evidence-only
    severity: material
    topic: unit economics
    missingEvidence: Project-level unit economics showing margin by hub, utilization level and customer program.
    whyItMatters: Without bottom-up economics, headline TAM does not translate into investable capacity.
    diligencePath: Request hub-level cost stacks, realized selling prices and contribution margins.
    relatedQuestionRefs:
      - QM025
  - type: missing-source
    severity: material
    topic: feedstock mix
    missingEvidence: A reconciled split of Recover’s actual post-industrial versus post-consumer input mix by region.
    whyItMatters: The company’s real SAM depends heavily on how much of its feedstock can come from harder post-consumer streams.
    diligencePath: Request input-mix disclosures by hub and by product family.
    relatedQuestionRefs:
      - QM023
  - type: stale
    severity: minor
    topic: regulatory timing
    missingEvidence: >-
      A dated implementation calendar mapping textile-specific ESPR, DPP and national EPR milestones into procurement
      deadlines.
    whyItMatters: Rules are directionally clear but precise commercial timing is still moving.
    diligencePath: Track delegated acts, national rules and customer compliance roadmaps quarterly.
    relatedQuestionRefs:
      - QM024
  - type: conflicting-data
    severity: minor
    topic: capacity ambitions
    missingEvidence: A dated bridge between historical company-plan targets and realized capacity / throughput.
    whyItMatters: Conflicting targets can distort valuation if they are mistaken for achieved scale.
    diligencePath: Ask management to reconcile target announcements with current nameplate and utilized capacity.
    relatedQuestionRefs:
      - QM009
      - QM010
  - type: access-blocked
    severity: minor
    topic: independent mill economics
    missingEvidence: Independent spinner or mill case studies quantifying defect rates and economics at higher recycled-cotton blends.
    whyItMatters: Brand-side interest is visible, but technical-user economics are less public.
    diligencePath: Source partner interviews, mill presentations or diligence calls with spinners and fabric makers.
    relatedQuestionRefs:
      - QM011
      - QM014
      - QM025
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: Public per-unit pricing, discount structure and minimum-volume commitments across Recover and rival platforms.
    whyItMatters: Pricing power and margin durability cannot be inferred confidently from marketing pages alone.
    diligencePath: Request customer contracts, quotes and pricing waterfalls by product family.
    relatedQuestionRefs:
      - QP014
      - QP023
  - type: private-evidence-only
    severity: material
    topic: exclusivity
    missingEvidence: Evidence on how exclusive Recover’s large-brand relationships actually are in volume or share-of-wallet terms.
    whyItMatters: Logo lists overstate moat if customers are trialing multiple suppliers simultaneously.
    diligencePath: Review contract terms, preferred-supplier status and actual order concentration.
    relatedQuestionRefs:
      - QP024
  - type: missing-source
    severity: minor
    topic: competitor realized scale
    missingEvidence: Plant throughput, utilization and revenue scale for several rival platforms in the retained source set.
    whyItMatters: Technology narratives can differ materially from commercial reality.
    diligencePath: Collect annual reports, plant announcements and capacity utilization data for each named rival.
    relatedQuestionRefs:
      - QP005
      - QP006
      - QP007
      - QP008
      - QP009
      - QP010
  - type: private-evidence-only
    severity: material
    topic: share of future category value
    missingEvidence: >-
      Bottom-up evidence on how much circular-material spend will sit in mechanical cotton versus regenerated
      cellulosics or chemical blend-recovery routes.
    whyItMatters: This mix will determine whether Recover’s lane compounds or becomes a narrow niche.
    diligencePath: Build customer-by-customer material roadmaps and compare substitution paths.
    relatedQuestionRefs:
      - QP025
  - type: access-blocked
    severity: minor
    topic: customer switching history
    missingEvidence: Case studies showing when mills or brands switched away from one recycler to another and why.
    whyItMatters: Observed switching behavior is better evidence of moat than marketing claims.
    diligencePath: Interview spinners, mills and brand material teams on actual qualification and requalification decisions.
    relatedQuestionRefs:
      - QP015
      - QP016
      - QP024
  - type: private-evidence-only
    severity: critical
    topic: consolidated financials
    missingEvidence: Audited consolidated revenue, gross margin, EBITDA, cash flow and cash balance for the operating group.
    whyItMatters: Without consolidated accounts, valuation and runway cannot be underwritten.
    diligencePath: Request audited group financials, management accounts and monthly cash reports.
    relatedQuestionRefs:
      - QI021
      - QI024
      - QI025
  - type: private-evidence-only
    severity: material
    topic: unit economics
    missingEvidence: Customer-level pricing, input-cost, yield-loss and freight data by hub and product family.
    whyItMatters: This is necessary to test whether capacity growth improves or dilutes gross margin.
    diligencePath: Obtain price lists, invoices, BOMs, yield reports and product margin bridges.
    relatedQuestionRefs:
      - QI005
      - QI012
      - QI013
  - type: private-evidence-only
    severity: material
    topic: working capital
    missingEvidence: Receivables aging, payment terms, inventory turns and supplier prepayment needs.
    whyItMatters: Enterprise industrial businesses often fail because of working-capital strain before demand fails.
    diligencePath: Review AR/AP aging, inventory schedules and customer terms by region.
    relatedQuestionRefs:
      - QI014
      - QI021
  - type: missing-source
    severity: material
    topic: debt and contingent obligations
    missingEvidence: Any debt, leases, guarantees or JV obligations associated with factory openings and regional partnerships.
    whyItMatters: These can materially alter equity value and runway.
    diligencePath: Request debt agreements, leases, JV operating agreements and board-approved capex schedules.
    relatedQuestionRefs:
      - QI022
      - QI023
  - type: missing-source
    severity: minor
    topic: revenue-recognition policy
    missingEvidence: How Recover recognizes revenue for samples, development work, service fees and long-term supply arrangements.
    whyItMatters: Recognition policy affects quality of reported growth and gross profit timing.
    diligencePath: Request accounting policy memo and sample customer contracts.
    relatedQuestionRefs:
      - QI004
  - type: private-evidence-only
    severity: material
    topic: yield and scrap
    missingEvidence: Plant-level yield, scrap, and rework data by waste type and hub.
    whyItMatters: These metrics determine whether quality claims scale economically.
    diligencePath: Request manufacturing KPIs and mass-balance reports by site.
    relatedQuestionRefs:
      - QE005
      - QE022
  - type: private-evidence-only
    severity: material
    topic: roadmap conversion
    missingEvidence: Adoption data for newly launched yarn and fabric platforms.
