  evidenceGaps:
  - type: private-evidence-only
    severity: critical
    topic: consolidated financials
    missingEvidence: Audited consolidated revenue, gross margin, EBITDA, cash flow and cash balance for the operating group.
    whyItMatters: Without consolidated accounts, valuation and runway cannot be underwritten.
    diligencePath: Request audited group financials, management accounts and monthly cash reports.
    relatedQuestionRefs:
    - QI021
    - QI024
    - QI025
  - type: private-evidence-only
    severity: material
    topic: unit economics
    missingEvidence: Customer-level pricing, input-cost, yield-loss and freight data by hub and product family.
    whyItMatters: This is necessary to test whether capacity growth improves or dilutes gross margin.
    diligencePath: Obtain price lists, invoices, BOMs, yield reports and product margin bridges.
    relatedQuestionRefs:
    - QI005
    - QI012
    - QI013
  - type: private-evidence-only
    severity: material
    topic: working capital
    missingEvidence: Receivables aging, payment terms, inventory turns and supplier prepayment needs.
    whyItMatters: Enterprise industrial businesses often fail because of working-capital strain before demand fails.
    diligencePath: Review AR/AP aging, inventory schedules and customer terms by region.
    relatedQuestionRefs:
    - QI014
    - QI021
  - type: missing-source
    severity: material
    topic: debt and contingent obligations
    missingEvidence: Any debt, leases, guarantees or JV obligations associated with factory openings and regional partnerships.
    whyItMatters: These can materially alter equity value and runway.
    diligencePath: Request debt agreements, leases, JV operating agreements and board-approved capex schedules.
    relatedQuestionRefs:
    - QI022
    - QI023
  - type: missing-source
    severity: minor
    topic: revenue-recognition policy
    missingEvidence: How Recover recognizes revenue for samples, development work, service fees and long-term supply arrangements.
    whyItMatters: Recognition policy affects quality of reported growth and gross profit timing.
    diligencePath: Request accounting policy memo and sample customer contracts.
