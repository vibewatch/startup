company:
  name: Recover Fiber
chapter:
  number: 4
  title: Financials
  summary: Recover’s public financial picture is directionally positive but underwriting-grade disclosure is thin. The business model appears to center on B2B sales of recycled cotton fiber and blends, with adjacent monetization from fabrics, garments, traceability and lab services. Public evidence supports commercial traction, capacity expansion and outside capital access, but does not disclose consolidated revenue, gross margin, burn, cash, or plant-level utilization. The financial verdict is therefore that Recover looks like a capital-intensive industrial growth story with real demand proof and strategic backers, but still requires primary diligence to underwrite margin path, cash needs, and whether the disclosed legal-entity revenue snapshots are representative of the operating group.
sections:
- id: revenue-model-and-monetization
  title: Revenue streams, monetization, and recognition complexity
  body: 'Recover’s public materials describe a primarily B2B revenue model selling recycled cotton fiber and cotton-blend inputs into yarn spinners, mills, and vertically integrated apparel supply chains. Tracxn broadens that picture by saying the company also offers fabrics and unbranded basic garments, which suggests a spectrum from raw material supply to more integrated product programs. Recover’s own materials add two other monetization layers: lab services and tracer verification. Those likely matter less than fiber sales in absolute dollars, but they can improve revenue quality if they help the company win qualification, protect retention, or justify better pricing. Recognition complexity appears moderate rather than trivial. Multi-year agreements such as the H&M deal, co-development work with mills and brands, and regional joint ventures imply staged commercialization where samples, qualification batches, and scaled recurring orders may happen over long periods rather than instantly.
    Public sources do not disclose whether Recover books only fiber sales, service fees, or any revenue-sharing / co-branding economics. As a result, investors can describe the model clearly at a high level but cannot yet convert public information into a reliable stream-by-stream revenue bridge.'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  - CI006
  - CI007
  tableRefs:
  - TI001
  - TI002
