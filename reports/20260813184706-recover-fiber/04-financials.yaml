- id: cost-structure-working-capital-and-capex
  title: Cost structure, working capital, and capital intensity
  body: 'Recover looks capital intensive by software standards but relatively pragmatic by industrial-circularity standards. Its model requires feedstock sourcing and qualification, shredding and recycling operations, quality control, logistics across major textile hubs, and continued expansion of factories or joint ventures. The company says the 2022 Goldman-led capital would accelerate global expansion and production capacity, while 2024 highlights cite a new Vietnam factory and the Intradeco JV targets nearshoring demand in the Americas. That operating profile implies meaningful capex, working capital tied to inventory and receivables, and ongoing spend on labs, certifications and supply-chain management. At the same time, Recover’s mechanical-recycling route likely avoids some of the chemical-plant complexity borne by certain rivals. That should not be confused with low capital needs. Public evidence still leaves open essential cost questions: input yield losses, labor intensity by hub,
    freight burden, maintenance capex, and how much of working capital is customer-funded versus self-financed. The prudent conclusion is that Recover’s model can scale, but probably not on a light-balance-sheet basis.'
  claimRefs:
  - CI015
