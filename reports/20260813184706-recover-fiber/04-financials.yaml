- id: public-traction-and-missing-financials
  title: Public traction versus missing private metrics
  body: 'Recover has enough public traction to show it is not a science project. The company reports 84,300 MT/year of global capacity at end-2024, 156 active customers, 141 spinning partners and 756 custom fabrics developed. The EU Transition Pathways case study offers an earlier snapshot: 65,000 MT/year capacity, 350 workers and 322 customers at the beginning of 2024. Tracxn adds a later headcount estimate of 397 employees as of June 2026. Together these sources indicate growth, but they are not equivalent financial metrics and they do not reconcile automatically. More importantly, none of them provides consolidated revenue, gross profit, EBITDA, burn, cash balance, plant utilization, bad debt, or cohort economics. The one public sales-like datapoint from Empresia - €2.5M of ventas for Recover Textile Systems SL - is almost certainly insufficient on its own to represent the full operating group and should be treated as a narrow legal-entity snapshot, not an underwriting answer. This chapter
    therefore has stronger confidence in operating momentum than in financial quality.'
  claimRefs:
  - CI023
  - CI024
  - CI025
  - CI026
