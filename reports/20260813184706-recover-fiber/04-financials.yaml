    - Cannot judge scale or growth quality
    - Collect audited group revenue by entity, geography and product family
  - - Gross margin by hub and product
    - Cannot test economics of capacity growth
    - Obtain plant P&Ls and freight / duty allocations
  - - Plant utilization and scrap rates
    - Capacity figures are not revenue
    - Review monthly throughput, downtime and yield data by site
  - - Accounts receivable aging
    - Enterprise customers can hide cash stress
    - Request aging, write-offs and top-customer terms
  - - Inventory turns and waste sourcing terms
    - Working capital may be material
    - Review raw-material contracts and inventory policies
  - - Capex budget by expansion site
    - Need to size future financing needs
    - Get board-approved capex plans for Vietnam, El Salvador and any further hubs
  - - Debt, leases and JV obligations
    - Hidden liabilities can distort valuation
    - Collect debt schedule, leases and JV agreements
  notes: Public traction is real, but financial visibility is still far below underwriting standard.
