- id: capital-adequacy-and-financial-verdict
  title: Capital adequacy, financing dependence, and verdict
  body: Recover’s financing story is supportive but incomplete. The company raised a $100M minority equity round in June 2022 led by Goldman Sachs Asset Management alongside STORY3 Capital, and public reporting placed the round at roughly a $1.1B valuation. Recover explicitly tied that capital to global expansion and capacity growth, and subsequent public evidence shows continued footprint buildout. That supports the view that the round funded real scaling activity rather than only balance-sheet repair. However, investors still cannot underwrite capital adequacy from public data because there is no disclosed cash-on-hand, burn, monthly capex run-rate, debt stack, project-finance exposure, or next-round trigger. Registry sources add useful structural facts - such as ownership by Recover Holdco Inc and PwC as auditor for the Spanish entity - but not the consolidated group cash position. The financial verdict is therefore cautiously favorable on strategic capital access and commercial demand,
    but blocked on margin path and runway. Recover looks financeable; it does not yet look fully financially transparent.
  claimRefs:
  - CI031
  - CI032
  - CI033
  - CI034
  - CI035
  - CI036
  - CI037
