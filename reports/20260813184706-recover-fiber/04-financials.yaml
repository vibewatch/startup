callouts:
- calloutType: insight
  title: The public record proves traction, not margin quality
  body: Recover has credible operating signals - capacity, customers, partnerships and fresh factory openings - but none of these substitutes for gross-margin or cash-flow disclosure. The biggest financial mistake would be to mistake commercial momentum for proven economics.
  claimRefs:
  - CI023
  - CI024
  - CI025
  - CI026
- calloutType: risk
  title: Enterprise materials sales likely create slow and expensive qualification cycles
  body: The H&M timeline from early-2024 development to late-2025 scaled commercial introduction suggests that even successful programs can take many quarters to convert. That raises CAC, application-engineering and working-capital demands relative to simpler commodity sales.
  claimRefs:
  - CI009
  - CI010
  - CI011
- calloutType: risk
  title: Registry revenue snippets are not enough to underwrite the group
  body: Empresia’s €2.5M sales datapoint and other registry fragments may reflect only one entity, one perimeter, or one dated filing context. They are useful clues but unsafe as a proxy for consolidated group revenue or margin.
  claimRefs:
  - CI027
  - CI028
  - CI029
  - CI036
