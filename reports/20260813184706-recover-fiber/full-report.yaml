        title: Exhibits
        blocks:
          - type: callout
            title: Recover is easy to respect and hard to price
            body: >-
              The company has better commercial proof than many circular-material peers, which makes it compelling. But
              the lack of public financial transparency makes exact valuation judgment far weaker than the quality of
              the strategic narrative.
