      - number: '1.4'
        title: Operating footprint and commercial scale
        blocks:
          - type: paragraph
            body: >-
              Recover has expanded from a Spain-centered heritage business into a geographically distributed fiber
              network. The 2022 sustainability report described Spain and Bangladesh as Recover-operated hubs and
              Pakistan as a licensed production facility; later official updates added Vietnam in 2024 and an El
              Salvador joint venture with Intradeco that started operating in 2025. The company’s own H&M announcement
              summarizes this as five recycling hubs across Europe, Asia and the Americas, which is directionally
              consistent with its recent operating story. Public scale disclosures vary by date and methodology, so they
              should be read as dated snapshots rather than one clean current metric. The EU Transition Pathways profile
              said that at the beginning of 2024 Recover had 65,000 metric tons per year of shredding capacity, 350
              employees and 322 customers. Recover’s 2024 sustainability highlights later reported 84,300 metric tons of
              annual fiber capacity, 156 active customers, 756 custom fabrics developed and 141 spinning partners, while
              the same report said the workforce was nearly 300 employees across Spain, Bangladesh and Vietnam. Tracxn
              meanwhile lists 397 employees as of June 2026. The most defensible interpretation is that Recover is still
              scaling quickly and that different disclosures count different things—active direct customers, broader
              customer ecosystem, or distinct employee snapshots—rather than that the company has shrunk dramatically.
