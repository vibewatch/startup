  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct peers, adjacents, incumbents, and substitutes'
        blocks:
          - type: paragraph
            body: >-
              Recover’s competitive landscape is broader than a list of companies making “recycled textiles.” At one end
              are direct or near-direct peers trying to help brands replace virgin inputs with recycled cotton or
              textile-derived fibers at commercial scale. At another are chemical or regenerated-fiber companies such as
              Circ, Infinited Fiber, Worn Again, BlockTexx, Syre and Circulose that attack similar circularity budgets
              through different science, materials and downstream claims. Market reports add a third layer of
              incumbents: Lenzing, Birla Cellulose, Unifi, Procotex, Boer Group and other established fibers or
              recycling players that can cross-sell into existing global customer networks. Finally, the status quo
              alternative remains strong: brands can simply keep buying virgin cotton, conventional MMCFs or
              bottle-to-fiber recycled synthetics when technical risk, price or supply continuity make
              textile-to-textile options feel too hard. Recover’s own materials and Tracxn profile suggest the company’s
              direct lane is mechanically recycled cotton and cotton-blend inputs sold into yarn, fabric and garment
              supply chains. That lane is narrower than the total textile recycling market but it is also defensible if
              the company can maintain superior quality and traceability in cotton-rich applications where generic
              recyclers struggle.
            claimRefs:
