              Recover has enough public traction to show it is not a science project. The company reports 84,300 MT/year
              of global capacity at end-2024, 156 active customers, 141 spinning partners and 756 custom fabrics
              developed. The EU Transition Pathways case study offers an earlier snapshot: 65,000 MT/year capacity, 350
