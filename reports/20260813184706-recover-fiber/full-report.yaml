  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: 'Customer segmentation: who buys, who uses, who pays'
        blocks:
          - type: paragraph
            body: >-
              Recover’s customer system includes at least four economically distinct groups. Global brands and retailers
              such as H&M, Primark, C&A, Lands’ End and Perry Ellis create top-down demand and credibility. Spinners and
              mills act as operational users that must qualify fiber, yarn or fabric performance. Vertically integrated
              manufacturers and regional partners such as Intradeco and Prosperity Textile provide scaled conversion
              capacity close to production markets. Finally, home-textile and specialty partners like Valdese Weavers
              broaden Recover’s end-market scope beyond apparel basics. This means buyer, user and payer are often not
              the same entity. A brand may sponsor the sustainability target, a mill may validate performance, and a
              manufacturing partner may carry much of the operational burden. That segmentation matters because adoption
              and durability are driven by network fit, not only by logo count. Recover’s reported 141 spinning partners
              underscore that the customer base is an ecosystem rather than a simple retailer list. It also means
              procurement control can move between tiers.
