  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risk
        blocks:
          - type: paragraph
            body: >-
              Recover operates in a policy environment that is broadly favorable to textile recycling but far from
              risk-free. The Waste Framework Directive, separate-collection rules and the Ecodesign for Sustainable
              Products Regulation can expand feedstock availability and demand for recycled content, yet they also
              create execution hazards. If rules define recyclability, recycled content, traceability or
              product-passport fields in ways the industry cannot operationalize quickly, recyclers can face compliance
              cost without matched monetization. Recover’s own policy writing highlights the danger: collection
              obligations may increase textile volumes faster than suitable sorted feedstock becomes available, and
              minimum-recycled-content rules can miss the needs of fiber-to-fiber recyclers if definitions are too
              loose. Public legal-entity sources do not show obvious litigation or insolvency events in the operating
              entities reviewed here, but they do reinforce that underwriting depends on entity structure, ownership and
              filing perimeter. Legal risk is therefore less about one visible lawsuit and more about regulatory design,
              definition-setting and the gap between legislative ambition and industrial readiness.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
