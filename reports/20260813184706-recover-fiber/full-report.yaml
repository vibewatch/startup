      - number: '7.4'
        title: Financial/model risk, mitigations, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              Financial risk is amplified by disclosure gaps. Recover has high-quality strategic backers and credible
              demand proof, but the public record still does not disclose consolidated revenue, gross margin, cash
              balance, debt exposure or runway. That means investors cannot tell how much operating volatility the
              company can absorb if capacity ramps slower than expected, if customers take longer to qualify, or if
              regional disruptions force working-capital spikes. This is especially important in a manufacturing model
              that likely requires continuing capex, inventory financing and quality-control spend. The right
              interpretation is not that Recover is financially weak; it is that financial resilience remains unproven
              to outsiders. The practical answer is a kill-criteria mindset: if top-customer concentration is high, if
              cross-hub quality variance persists, if DPP / traceability readiness remains partial, or if another large
              funding round is needed before newly announced hubs stabilize, the risk-reward changes materially. Public
              evidence supports cautious optimism, not complacency.
            claimRefs:
