chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, legal structure, and business model
        blocks:
          - type: paragraph
            body: >-
              Recover operates as a mechanically recycled-cotton materials supplier rather than a consumer fashion
              label. The core proposition is to turn post-industrial and post-consumer textile waste into recycled
              cotton fiber and cotton-rich blends that can be reintegrated into yarn, fabric, apparel, accessories and
              home-textile supply chains. Official product pages show a portfolio spanning pure recycled cotton,
              recycled cotton blends, yarns and ready-to-specify fabrics, while independent descriptions from Tracxn and
              the European Commission’s Transition Pathways case study describe the company as a scaled manufacturer of
              recycled cotton fiber and fiber blends for textiles. The legal-entity picture is more nuanced than the
              brand story: registry aggregators tied to the Spanish mercantile register identify Recover Textile Systems
              SL, incorporated in late 2019 under the prior name Caldrah Europe SL, with Recover Holdco Inc listed as
              sole owner. In parallel, Recover’s own narrative emphasizes that the business was established as an
              independent circular-materials company in 2020 from the Ferre family’s much older textile operation. The
              clean diligence framing is that the branded startup is a 2020 spin-out built on a 1947 recycling heritage,
              while the current Spanish operating entity dates legally from 2019 and sits inside a holdco structure.
