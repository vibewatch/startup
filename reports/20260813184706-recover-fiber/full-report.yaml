      - number: '2.2'
        title: Sizing lenses and evidence-constrained TAM / SAM logic
        blocks:
          - type: paragraph
            body: >-
              The strongest market-sizing approach for Recover is to preserve multiple lenses rather than pretend one
              number captures the business. A broad capital-markets lens comes from MarketsandMarkets, which projects
              the textile recycling market to grow from $8.41 billion in 2025 to $11.88 billion by 2030. That is
              directionally useful but too broad because it includes multiple materials, processes and end uses. A
              regulatory-industrial lens comes from the EEA and BCG: the EU generated 6.95 million tonnes of textile
              waste in 2020, while BCG estimates Europe generated roughly 15.2 million tonnes of textile waste in 2025,
              of which 13.3 million tonnes were post-consumer. Yet only about 1.5 million tonnes are currently collected
              and sorted into a base that could plausibly move toward textile-to-textile recycling. A molecule lens
              further narrows Recover’s relevance: BCG estimates cotton and polyester/polycotton together represent 79%
              of molecules in post-consumer collected and sorted waste. Finally, a company-planning lens shows why
              investors should be cautious with top-down ambition. Recover-authored and third-party-reported expansion
              targets have ranged from 200,000 metric tons of recycled cotton by 2025 to 350,000 metric tons by 2026,
              while the company’s disclosed end-2024 capacity was 84,300 metric tons. The credible conclusion is that
              the waste pool is enormous, the truly processable SAM is much smaller, and Recover’s current SOM remains a
              function of execution and feedstock economics rather than a shortage of theoretical demand.
            claimRefs:
              - CM003
              - CM008
              - CM009
              - CM010
