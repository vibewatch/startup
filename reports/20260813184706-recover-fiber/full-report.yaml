        title: Exhibits
        blocks:
          - type: callout
            title: Policy tailwinds can still become implementation risk
            body: >-
              Recover benefits from a world moving toward textile circularity, but the same policy shift can create
              painful compliance costs or feedstock distortions if rules are poorly staged or defined. The company’s own
              policy commentary repeatedly warns that industrial readiness matters.
            calloutType: risk
