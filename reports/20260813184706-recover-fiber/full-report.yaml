  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, adjacencies, and substitutes
        blocks:
          - type: paragraph
            body: >-
              Recover does not participate in the entire apparel market, nor even in the full recycling economy. Its
              actual market sits in a narrower zone: recycled cotton and cotton-rich material inputs that can replace
              some virgin cotton or lower-impact alternatives inside textile supply chains. That means the relevant
              spend includes recycled fiber, yarn, fabric-development and traceability-enabling services that help
              brands, mills and spinners source credible recycled cotton at scale. It excludes finished-garment retail
              margins, resale platforms, repair, and generic municipal waste management even though those categories
              influence overall circularity outcomes. The company’s own 2022 financing release is useful because it
              places Recover inside the broader $50 billion cotton market, which is the economic adjacency brands are
              trying to partially displace rather than the precise spend Recover can address today. Status-quo
              substitutes are therefore not only virgin cotton, but also lower-grade mechanical recyclers, chemical
              recyclers offering regenerated cellulosics, recycled polyester suppliers, and in some cases simply
              continued landfill-or-incineration disposal when collection and sorting economics fail. The central market
              question is not whether textile waste exists—there is far more waste than today’s system can absorb—but
              whether enough waste can be converted into recycling-grade, spec-compliant inputs with acceptable
              economics for brands and mills.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
          - type: table
            tableRef: TM001
            claimRefs:
