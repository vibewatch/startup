      - number: '5.2'
        title: Mechanical recycling architecture and delivery workflow
        blocks:
          - type: paragraph
            body: >-
              Recover’s operating architecture starts with textile waste and ends with a qualified fiber or textile
              input that can re-enter the apparel value chain. The EU Transition Pathways case study describes the
              process as cutting material into smaller pieces, using a preparatory anti-static spray and then processing
              it inside Recover’s recycling machine. Recover’s explanatory articles and technical reviews show why this
              matters: cotton-rich materials can be recycled mechanically or chemically, but Recover’s commercial route
              is the mechanical path, reinforced by blending, quality control and supply-chain integration. The workflow
              is not purely factory-internal. It includes waste traceability, lab analysis, quality management, brand or
              mill qualification, and increasingly digital chain-of-custody pilots through TextileGenesis and
              RMDF-linked processes. This combination of physical processing and assurance infrastructure is what turns
              a commodity recycling step into a commercial product system. The model remains operationally intensive
              because feedstock variability, cross-site standardization and downstream performance all have to be
              managed continuously.
