              in June 2022 led by Goldman Sachs Asset Management alongside STORY3 Capital, and public reporting placed
              the round at roughly a $1.1B valuation. Recover explicitly tied that capital to global expansion and
              capacity growth, and subsequent public evidence shows continued footprint buildout. That supports the view
              that the round funded real scaling activity rather than only balance-sheet repair. However, investors
              still cannot underwrite capital adequacy from public data because there is no disclosed cash-on-hand,
              burn, monthly capex run-rate, debt stack, project-finance exposure, or next-round trigger. Registry
              sources add useful structural facts - such as ownership by Recover Holdco Inc and PwC as auditor for the
