      - number: '6.4'
        title: Expansion, concentration risk, and procurement friction
        blocks:
          - type: paragraph
            body: >-
              Recover appears to have multiple expansion vectors: more brands, deeper existing-brand penetration, more
              spinners and mills, new product layers such as yarns and fabrics, and more regional production nodes.
              However, concentration risk remains hard to quantify. A handful of large global brands likely matter
              disproportionately to signaling and volume, and some partner dependencies—especially integrated
              manufacturers and regional mills—may mediate access to end customers. Procurement friction is also
              nontrivial. Materials companies must prove quality, traceability, and cost competitiveness repeatedly
              across each new customer or category. This slows onboarding and can make the top of funnel look better
              than realized revenue. The customer verdict is therefore positive on proof of real adoption and ecosystem
              breadth, but only medium confidence on durability and concentration until the company discloses renewal,
              contract, and share-of-wallet data. Today, those numbers remain private. Better segmentation would sharpen
              concentration analysis.
            claimRefs:
              - CU029
