      - number: '8.4'
        title: Final recommendation, confidence, and diligence asks
        blocks:
          - type: paragraph
            body: >-
              Based on public evidence alone, Recover should be rated track with medium confidence, high risk, and a
              stretched-to-fair boundary that depends heavily on deal structure. The company looks more credible than
              many climate-manufacturing narratives because it has real customers, real capacity and a real policy
              tailwind. But the absence of audited consolidated financial visibility keeps us from moving to buy. If a
              new round priced materially above the 2022 valuation without materially better disclosure, the stance
              would likely shift toward stretched. If instead an investor could access protective structure, strong
              information rights and a price closer to the prior anchor or better, the risk-reward becomes more
              interesting. The most valuable next diligence step is not more thematic market research; it is primary
              financial and operational underwriting at the account, hub and product-family level. Recover may be
              investable. It is not yet publicly transparent enough to be price-insensitive.
            claimRefs:
