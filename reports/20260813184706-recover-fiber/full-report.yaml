      - number: '2.5'
        title: Constraints, economics, and contradictory evidence
        blocks:
          - type: paragraph
            body: >-
              The main constraint on Recover’s market is not the absence of waste or the absence of sustainability
              rhetoric. It is the difficulty of turning low-quality, mixed and contaminated textile waste into
              repeatable, commercially acceptable fiber. Multiple sources converge on this point. Mechanical recycling
              is cheaper and easier to deploy than chemical recycling, especially in lower-capital geographies, but it
              degrades fibers with each cycle and often pushes the output toward lower-value or lower-performance
              applications unless blends are carefully engineered. Recover’s own Rieter/Birla trial article concedes
              that many ring-spun yarns still hit a 20% recycled-cotton ceiling in ordinary industrial practice. BCG
              adds that even with policy support, scaling textile-to-textile recycling in Europe toward roughly 15% by
              2035 could require €8-11 billion of one-off capex and €5-6.5 billion of recurring opex, with some links in
              the value chain facing compressed or negative EBIT margins. EEA and MDPI sources also emphasize that
              collection, sorting and reporting systems remain inconsistent across Europe. These constraints explain why
              Recover’s market should be treated as supply-constrained and execution-constrained rather than
              demand-constrained. They also explain why contradictory targets in company-linked sources are not a small
              disclosure nuisance—they are a signal that market formation is still ahead of industrial proof at full
              scale.
            claimRefs:
              - CM033
              - CM034
              - CM035
              - CM036
              - CM037
              - CM038
              - CM039
              - CM040
          - type: table
            tableRef: TM005
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
              - CM031
              - CM032
              - CM033
              - CM034
              - CM039
      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Recover’s market is waste-rich but feedstock-poor
            body: >-
              The limiting reagent is not discarded textiles in aggregate; it is traceable, sorting-ready,
              specification-compatible textile waste that can move through recycling and into mainstream mills without
              quality breakdowns. That is why gigantic waste statistics can coexist with a still-small practical SAM.
            calloutType: insight
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM036
          - type: callout
            title: Top-down TAM numbers can overstate investable reality
            body: >-
              Broad market reports and cotton-market adjacency numbers are useful context, but they hide the real
              chokepoints: capture rates, sorting depth, blend performance, mill adoption and negative-margin links in
              the recycling chain. Investors should bottom-up the SAM from processable feedstock, not top-down it from
              retail fashion spend.
            calloutType: risk
            claimRefs:
              - CM003
              - CM004
              - CM011
              - CM033
              - CM037
          - type: callout
            title: Regulation, traceability and brand procurement are finally converging
            body: >-
              Separate collection, DPP readiness, recycled-content expectations and long-term brand procurement signals
              are starting to reinforce each other. That combination improves the odds that companies like Recover can
              convert sustainability interest into recurring industrial demand rather than isolated pilot programs.
            calloutType: strength
            claimRefs:
