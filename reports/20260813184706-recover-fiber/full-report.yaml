      - number: '1.2'
        title: Heritage, leadership, and governance
        blocks:
          - type: paragraph
            body: >-
              Recover’s strongest credibility signal is that its startup narrative is rooted in a real industrial
              lineage rather than a greenfield concept. The Ferre family textile business dates to 1914, and both
              Recover’s own leadership materials and the EU Transition Pathways profile say the family began recycling
              textile waste into cotton yarns in 1947. Alfredo Ferre therefore matters not simply as an executive but as
              the continuity bridge between legacy know-how and scaled commercialization. In 2024 he moved from chief
              executive into a product, innovation and sustainability-focused role, while Anders Sjöblom took over as
              CEO after senior leadership work at H&M Group. Recover also added Matthew Neville as its first global
              chief commercial officer and elevated Hans Ploos van Amstel into board-chair leadership, signaling that
              the company is staffing for global retail account management, financial discipline and board-level
              oversight rather than only family stewardship. Governance remains somewhat opaque from public sources
              because a full current holdco board roster and ownership split are not available in this run, but
              available evidence does show Goldman gained board representation in 2022 and that the company has
              continued recruiting senior executives with large-brand and transformation backgrounds.
