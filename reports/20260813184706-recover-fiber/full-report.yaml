      - number: '7.3'
        title: Partner, customer and people / execution risk
        blocks:
          - type: paragraph
            body: >-
              Recover’s growth path is network-dependent. The company relies on waste suppliers, spinners, mills,
              digital-traceability systems, regional manufacturing partners and anchor global brands. Those dependencies
              are a strength when they work and a risk when they concentrate power outside Recover’s direct control.
              Intradeco helps open the Americas, but also becomes a regional dependency. TextileGenesis and RMDF-style
              workflows help with traceability, but system adoption still depends on third parties across many
              supply-chain tiers. Customer proof is strong, yet top-brand relationships likely matter disproportionately
              for volume, signaling and downstream influence. People risk also deserves attention. Recover has
              materially upgraded leadership with executives from H&M, Coats Group and other large organizations, but
              that refresh itself creates integration and key-person risk, especially as Alfredo Ferre shifted from CEO
              to product and innovation leadership while Anders Sjöblom took over growth execution. Leadership upgrades
              can improve outcomes; they also raise the cost of misalignment during rapid expansion.
