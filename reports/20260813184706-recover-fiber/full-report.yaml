  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue streams, monetization, and recognition complexity
        blocks:
          - type: paragraph
            body: >-
              Recover’s public materials describe a primarily B2B revenue model selling recycled cotton fiber and
              cotton-blend inputs into yarn spinners, mills, and vertically integrated apparel supply chains. Tracxn
              broadens that picture by saying the company also offers fabrics and unbranded basic garments, which
              suggests a spectrum from raw material supply to more integrated product programs. Recover’s own materials
              add two other monetization layers: lab services and tracer verification. Those likely matter less than
              fiber sales in absolute dollars, but they can improve revenue quality if they help the company win
              qualification, protect retention, or justify better pricing. Recognition complexity appears moderate
              rather than trivial. Multi-year agreements such as the H&M deal, co-development work with mills and
              brands, and regional joint ventures imply staged commercialization where samples, qualification batches,
              and scaled recurring orders may happen over long periods rather than instantly. Public sources do not
              disclose whether Recover books only fiber sales, service fees, or any revenue-sharing / co-branding
              economics. As a result, investors can describe the model clearly at a high level but cannot yet convert
              public information into a reliable stream-by-stream revenue bridge.
