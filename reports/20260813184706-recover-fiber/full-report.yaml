      - number: '3.3'
        title: Switching costs, multi-homing, and distribution power
        blocks:
          - type: paragraph
            body: >-
              Switching costs in this category are meaningful but not absolute. A spinner or mill that has qualified a
              recycled fiber and dialed in blend recipes, shade consistency and performance may hesitate to switch
              quickly, especially if downstream customers have approved specific claims or certifications. But the
              public record also implies that buyers can and likely do multi-home. Brands such as H&M are simultaneously
              working with Recover and Circ, while market reports show a wide field of incumbent and emerging suppliers
              across cotton, polyester and cellulosic pathways. That means Recover does not enjoy software-style
              lock-in. Distribution power instead comes from partner access, reliability and category trust. Recover’s
              footprint close to textile hubs, its ability to serve brands from Spain, Bangladesh, Vietnam, Pakistan and
              El Salvador, and its lab / tracer systems all reduce adoption friction. Yet larger incumbents bring
              another form of power: global sales networks, balance-sheet durability, and existing procurement
              relationships across many categories. The competitive question is therefore whether Recover can keep
              winning the “first practical choice” for recycled-cotton programs before alternative material systems
              become easy enough and cheap enough to displace it in major accounts.
