  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis versus anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The core thesis for Recover is attractive and coherent. It sits at the intersection of a large
              textile-waste problem, tightening policy pressure, rising brand demand for recycled content, and a
              technically credible operating platform that already serves real customers across multiple textile hubs.
              Public evidence since the 2022 round shows further commercial maturation: active customers, spinning
              partners, new factories, H&M’s multi-year agreement, and broader product packaging through yarns and
              fabrics. The anti-thesis is equally clear. This is an industrial scaling business, not an asset-light
              software company. Mechanical-recycling quality limits remain real, customer concentration is still opaque,
              and public financial transparency is far below what investors normally need to validate a premium unicorn
              price. The right investment posture is therefore not binary. Recover deserves continued attention and
              potentially serious engagement, but only with valuation discipline and diligence focused on unit
              economics, concentration and capital adequacy.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
