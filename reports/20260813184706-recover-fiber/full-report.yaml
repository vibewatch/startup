        - Relevant for textile-to-textile cellulosic pathway
        - Different feedstock and conversion model
      - - Syre
        - Circular polyester platform
        - Private / ambition-led scale narrative
        - Relevant for investor attention and sustainability budgets
        - Different polymer lane and timeline
    notes: Comparable set is directional and heterogeneous by design.
    claimRefs:
      - CV010
      - CV014
      - CV015
      - CV016
      - CV017
      - CV018
  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Quality inconsistency across hubs
        - Persistent variance or complaint trend
        - Breaks “scaled trusted supplier” thesis
        - Move from track to avoid unless price resets
      - - Traceability / DPP readiness gap
        - Large customers cannot obtain needed product-level evidence
        - Weakens compliance moat and demand pull
        - Cut growth and multiple assumptions
      - - Customer concentration revealed as extreme
        - Top few accounts dominate volume or margin
        - Reduces durability and bargaining power
        - Require structure or lower entry price
      - - New capital need before current hubs stabilize
        - Near-term financing without strong operating proof
        - Raises dilution and questions economics
        - Avoid premium pricing
      - - Product-layer launches fail to attach
        - Yarns/fabrics do not convert into repeat economics
        - Undercuts expansion thesis
        - Keep value tethered to raw-material economics only
    notes: Kill triggers turn narrative risks into monitorable decisions.
    claimRefs:
      - CV024
      - CV025
      - CV026
      - CV027
      - CV028
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Consolidated financials
        - Revenue, gross margin, EBITDA, cash and debt
        - Determines whether any premium to prior mark is justified
        - Management / finance diligence
      - - Customer concentration
        - Top-account revenue and volume mix
        - Tests durability and bargaining power
        - Sales ops / finance
      - - Hub-level quality metrics
        - Rejects, complaints, yields, QA variance
        - Tests whether scale is truly repeatable
        - Operations / QA
      - - Traceability coverage
        - Percent of volume covered by RMDF, tracers and TextileGenesis
        - Tests regulatory-readiness moat
        - Sustainability / product
      - - Capex and utilization roadmap
        - Expansion spend and ramp timing by hub
        - Tests dilution risk and timing
        - Finance / operations
      - - Product-line economics
        - Fiber vs yarn vs fabric contribution margins
        - Tests whether new modules deepen value or only complexity
        - Commercial / finance
    notes: The path from track to buy runs through disclosure, not more storytelling.
    claimRefs:
      - CV033
      - CV034
      - CV035
      - CV036
      - CV037
      - CV038
      - CV039
      - CV040
