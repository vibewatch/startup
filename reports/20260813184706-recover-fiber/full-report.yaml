      - number: '8.3'
        title: Bull/base/bear cases and kill triggers
        blocks:
          - type: paragraph
            body: >-
              The bull case is that Recover compounds from a category leader in recycled cotton into the default
              supply-chain platform for recycled-cotton adoption, with stronger traceability, more mills, broader
              product layers and deeper account penetration across global brands. In that case, the 2022 unicorn
              valuation can prove conservative rather than aggressive. The base case is more measured: Recover continues
              to grow and retains strong strategic relevance, but margin visibility, capex demands and customer opacity
              keep fair value tethered near prior financing levels until better data emerges. The bear case is that
              policy tailwinds take longer to monetize than expected, mechanical quality limits cap premium use cases,
              and new capital is required before recent footprint expansions fully stabilize. That would compress
              valuation sharply even if the company remains strategically interesting. Kill triggers therefore center on
              concentration, quality consistency, DPP/traceability readiness and funding need—not on whether the company
              has any real demand at all.
            claimRefs:
              - CV019
              - CV020
