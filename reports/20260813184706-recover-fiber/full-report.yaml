      - number: '8.2'
        title: Valuation context, entry discipline, and comparables
        blocks:
          - type: paragraph
            body: >-
              The strongest public valuation anchor remains the June 2022 round: a $100M minority equity investment led
              by Goldman Sachs Asset Management, with widespread reporting that it valued Recover at about $1.1B. That
              anchor is useful, but insufficient. It tells us the company once cleared a unicorn threshold with
              sophisticated backers; it does not tell us whether that price remains justified after several more years
              of operational scaling and public-market skepticism around climate-manufacturing businesses. Comparable
              analysis is also imperfect because Recover straddles multiple peer sets: public incumbents such as
              Lenzing, private textile-to-textile recyclers like Circ and Infinited Fiber, circular-polyester entrants
              like Syre, and cellulosic players like Circulose. Many peers either do not disclose usable valuation data
              publicly or monetize through different polymers and process types. The best use of comps here is
              directional. Recover appears more commercially mature than some technology-forward peers, but less
              transparent than investors would like for a late-stage price. That combination supports a
              neutral-to-cautious entry stance rather than aggressive momentum underwriting.
            claimRefs:
