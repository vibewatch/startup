- id: adoption-trajectory-and-named-proof
  title: Adoption trajectory and named customer proof
  body: The public record is unusually rich in named customer proof. Recover’s 2024 highlights report 156 active customers, 141 spinning partners and 756 custom fabrics developed, while the EU Transition Pathways case study offers a larger but earlier 322-customer snapshot. Those counts suggest a broad commercial surface area, even if the definitions are not fully reconciled. Named customer proof is strongest where there is evidence of production use, multi-year expansion or repeated collaboration. H&M moved from product development beginning in early 2024 to a multi-year agreement announced in late 2025. Primark’s relationship dates back to 2020 and expanded into a global-scale RColorBlend range in 2022. C&A described a four-year strategic partnership in 2023. Lands’ End, Perry Ellis, Valdese and Prosperity all show downstream use cases that place Recover material in actual product lines rather than abstract pilots. This breadth does not answer every diligence question, but it does move
    Recover well past “one showcase customer” territory.
  claimRefs:
