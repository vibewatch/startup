company:
  name: Recover Fiber
chapter:
  number: 6
  title: Customers
  summary: 'Recover’s customer evidence is stronger than many early industrial-climate companies: it has named relationships with H&M, Primark, C&A, Lands’ End, Perry Ellis, Valdese Weavers, Prosperity Textile and Intradeco, plus company-level counts showing 156 active customers and 141 spinning partners at end-2024. The customer base is multi-sided: global brands create demand and proof, while spinners, mills and integrated manufacturers operationalize adoption and repeat volume. The biggest remaining unknowns are retention and concentration. Public evidence shows meaningful repeat and expansion signals, but not NRR, GRR, wallet share, top-customer concentration, or contract-volume durability.'
sections:
- id: segments-buyers-and-customer-shape
  title: 'Customer segmentation: who buys, who uses, who pays'
  body: Recover’s customer system includes at least four economically distinct groups. Global brands and retailers such as H&M, Primark, C&A, Lands’ End and Perry Ellis create top-down demand and credibility. Spinners and mills act as operational users that must qualify fiber, yarn or fabric performance. Vertically integrated manufacturers and regional partners such as Intradeco and Prosperity Textile provide scaled conversion capacity close to production markets. Finally, home-textile and specialty partners like Valdese Weavers broaden Recover’s end-market scope beyond apparel basics. This means buyer, user and payer are often not the same entity. A brand may sponsor the sustainability target, a mill may validate performance, and a manufacturing partner may carry much of the operational burden. That segmentation matters because adoption and durability are driven by network fit, not only by logo count. Recover’s reported 141 spinning partners underscore that the customer base is an ecosystem
    rather than a simple retailer list. It also means procurement control can move between tiers.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
  - CU007
  - CU008
