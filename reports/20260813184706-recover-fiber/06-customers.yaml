- id: durability-retention-and-expansion
  title: Durability, repeat usage, and expansion signals
  body: 'Public customer evidence is better at showing expansion than at showing retention. Recover’s H&M relationship deepened from development work into a multi-year supply agreement. Primark’s partnership evolved from early adoption to a global-scale RColorBlend program and continued partnership messaging through 2025. C&A framed its collaboration as long-term and strategic. The company’s growing catalog of yarn, fabric and traceability tools also suggests land-and-expand logic: once a buyer or supply-chain partner trusts Recover fiber, the company can widen into more categories, constructions or geographies. But none of this is a substitute for hard retention metrics. There is no public NRR, GRR, renewal rate, churn rate, cohort curve or average contract duration. Public evidence therefore supports the statement “relationships are sticky enough to expand,” but not the stronger statement “revenues are highly durable and diversified.” That distinction matters for underwriting. Fresh customer
    dashboards would materially improve confidence. materially.'
  claimRefs:
  - CU021
  - CU022
  - CU023
  - CU024
  - CU025
  - CU026
  - CU027
  - CU028
