callouts:
- calloutType: strength
  title: Recover has more than vanity-logo proof
  body: The combination of active-customer counts, spinning-partner counts, custom-fabric development and multiple named brand or mill relationships suggests Recover is already embedded in a real commercial ecosystem. This looks materially stronger than a company relying on one showcase pilot.
  claimRefs:
  - CU009
  - CU010
  - CU011
  - CU013
  - CU018
- calloutType: risk
  title: Retention visibility is the biggest customer diligence hole
  body: Public evidence supports repeat and expansion narratives, but not NRR, GRR, renewal timing, contract volumes or churn. That makes it dangerous to confuse proof of adoption with proof of durable revenue quality.
  claimRefs:
  - CU022
  - CU023
  - CU024
  - CU026
- calloutType: risk
  title: Concentration may hide inside the ecosystem
  body: Even with many active customers, a small number of global brands or conversion partners may still dominate economics or signaling value. Recover needs to prove diversification by revenue and volume, not only by relationship count.
  claimRefs:
  - CU030
  - CU031
  - CU032
  - CU033
  - CU034
