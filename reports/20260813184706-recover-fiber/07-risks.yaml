company:
  name: Recover Fiber
chapter:
  number: 7
  title: Risks
  summary: 'Recover’s risk profile is dominated by execution, feedstock quality, policy design, and financial opacity rather than by a single existential legal problem already visible in public sources. The highest-severity risks are: (1) policy implementation that expands textile collection faster than sorter/recycler readiness; (2) mechanical-recycling quality limits that constrain product performance or customer repeat; (3) multi-hub operational inconsistency across a growing footprint; (4) partner and customer dependence embedded in mills, integrated manufacturers and large-brand accounts; and (5) capital-intensity and runway uncertainty because public disclosures still omit margin, burn and debt details. Mitigations exist—labs, ISO systems, traceability, policy engagement, geographic diversification and upgraded leadership—but residual exposure remains meaningful.'
sections:
- id: regulatory-and-legal-risk
  title: Regulatory and legal risk
  body: 'Recover operates in a policy environment that is broadly favorable to textile recycling but far from risk-free. The Waste Framework Directive, separate-collection rules and the Ecodesign for Sustainable Products Regulation can expand feedstock availability and demand for recycled content, yet they also create execution hazards. If rules define recyclability, recycled content, traceability or product-passport fields in ways the industry cannot operationalize quickly, recyclers can face compliance cost without matched monetization. Recover’s own policy writing highlights the danger: collection obligations may increase textile volumes faster than suitable sorted feedstock becomes available, and minimum-recycled-content rules can miss the needs of fiber-to-fiber recyclers if definitions are too loose. Public legal-entity sources do not show obvious litigation or insolvency events in the operating entities reviewed here, but they do reinforce that underwriting depends on entity structure,
    ownership and filing perimeter. Legal risk is therefore less about one visible lawsuit and more about regulatory design, definition-setting and the gap between legislative ambition and industrial readiness.'
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
  - CR006
  - CR007
  - CR008
  - CR009
  - CR010
