callouts:
- calloutType: risk
  title: Policy tailwinds can still become implementation risk
  body: Recover benefits from a world moving toward textile circularity, but the same policy shift can create painful compliance costs or feedstock distortions if rules are poorly staged or defined. The company’s own policy commentary repeatedly warns that industrial readiness matters.
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
- calloutType: risk
  title: The highest residual risk is not “can the process work?” but “can it work consistently at scale?”
  body: Public evidence already proves Recover can operate. The harder question is whether the company can keep quality, documentation and partner execution aligned across more hubs, more products and more customers.
  claimRefs:
  - CR011
  - CR013
  - CR016
  - CR018
  - CR020
- calloutType: risk
  title: Financial opacity amplifies every other risk
  body: Because public sources still omit margin, burn, debt and runway, investors cannot tell how much room Recover has to absorb operational mistakes or slower customer conversion. That uncertainty should widen the required margin of safety.
  claimRefs:
  - CR031
  - CR032
  - CR033
  - CR034
