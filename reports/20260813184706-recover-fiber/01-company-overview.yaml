  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: Current holdco-level revenue, gross margin and cash-flow disclosure for 2025-2026.
    whyItMatters: The public record proves valuation and strategic momentum more clearly than operating economics.
    diligencePath: Request management accounts, audited financial statements and board reporting packs.
    relatedQuestionRefs:
    - QO023
  - type: private-evidence-only
    severity: material
    topic: ownership
    missingEvidence: Exact ownership percentages, security types and board rights for STORY3, Goldman, Fortress and Eldridge.
    whyItMatters: Investor control, dilution and downside economics cannot be inferred from public press releases.
    diligencePath: Obtain cap table, shareholder agreement, side letters and latest financing documents.
    relatedQuestionRefs:
    - QO024
  - type: missing-source
    severity: minor
    topic: board composition
    missingEvidence: A complete current board roster for the holdco and operating entities, with appointment dates and committee responsibilities.
    whyItMatters: Governance quality and investor influence cannot be fully assessed from partial announcement-based evidence.
    diligencePath: Request current board list and charter documents or registry extracts for each relevant entity.
    relatedQuestionRefs:
    - QO025
  - type: conflicting-data
    severity: minor
    topic: scale metrics
    missingEvidence: A reconciled definition for capacity, customer-count and headcount metrics across 2024-2026 disclosures.
    whyItMatters: Different methodologies can make growth look faster or slower than it really is and complicate cross-chapter analysis.
    diligencePath: Ask management for metric definitions, monthly bridge tables and regional breakdowns.
    relatedQuestionRefs:
    - QO014
    - QO015
  - type: missing-source
    severity: minor
    topic: ownership structure
    missingEvidence: Direct holdco-level documents connecting Recover Holdco Inc, the Spanish opco and international manufacturing affiliates.
    whyItMatters: Without entity-level mapping, it is hard to assign assets, liabilities and governance to the right legal perimeter.
    diligencePath: Collect a corporate structure chart, intercompany agreements and local registry extracts for each hub country.
    relatedQuestionRefs:
    - QO012
    - QO024
