- id: capitalization-and-ownership
  title: Capitalization and ownership posture
  body: 'The defining financing event in the public record remains Recover’s June 2022 minority equity round. Recover’s own announcement, Retail Dive and Tracxn align on the core facts: Goldman Sachs Asset Management led a $100 million investment while STORY3 Capital Partners remained the majority shareholder, and third-party coverage associated the transaction with an approximately $1.1 billion post-money valuation. Recover used the financing story to position itself as a category-defining recycled-cotton platform operating in the broader cotton market, with capital earmarked for global expansion, capacity growth and technology development. Later leadership announcements also list Fortress Investment Group and Eldridge Industries among institutional supporters, but public materials in this diligence set do not specify their entry dates, ownership percentages or board rights. Spanish registry-derived sources add useful legal detail: Recover Holdco Inc appears as sole owner of Recover Textile
    Systems SL, the entity has only €3,000 of stated share capital at the operating-company level, and PwC is listed as auditor. That does not imply the business itself is undercapitalized; it implies the real capitalization picture sits above the Spanish opco, so investors need holdco-level documents, not only local company extracts, to understand dilution, control and cash movements.'
