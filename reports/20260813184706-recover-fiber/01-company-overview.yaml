callouts:
- calloutType: strength
  title: Recover has moved from heritage story to repeatable brand-side commercial proof
  body: 'The strongest proof that Recover is more than a legacy mill rebrand is the accumulation of multi-year and multi-party commercial milestones: Primark since 2020, product-development work with H&M leading to a 2025 supply agreement, the Intradeco JV in the Americas, and participation in traceability pilots tied to Target developments. Those are the milestones expected when a materials platform crosses from marketing narrative into supply-chain relevance.'
  claimRefs:
  - CO028
  - CO031
  - CO033
  - CO042
- calloutType: risk
  title: The public record still under-discloses today’s economics
  body: Recover has ample public evidence of strategic momentum but limited direct evidence of present-day cash economics. The legal-opco records show only partial local information, while holdco-level revenue, margins, customer concentration, dilution and debt are absent from retained public sources. The valuation story is therefore much easier to prove than the earnings-power story.
  claimRefs:
  - CO011
  - CO014
  - CO024
  - CO036
- calloutType: risk
  title: Supply-chain resilience remains a real operating issue, not a theoretical one
  body: Recover’s own 2024 highlights explicitly cited unrest in Bangladesh as a reminder that circular supply chains still depend on fragile real-world manufacturing geographies. Because Recover’s scale story depends on hubs close to both waste streams and garment production, geopolitical, labor and compliance shocks in those locations can hit both growth and execution at the same time.
  claimRefs:
  - CO025
  - CO035
