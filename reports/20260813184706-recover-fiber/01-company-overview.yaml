- id: milestones-risks-and-open-questions
  title: Milestones, current momentum, and unresolved diligence questions
  body: Recover’s recent milestone trail shows real commercial momentum. In 2025 it announced a multi-year H&M agreement after product-development work that began in early 2024, expanded with Intradeco into Central America, deepened traceability infrastructure through TextileGenesis and the RMDF / Tracing Textile Waste work tied to Target developments, and continued scaling Primark and C&A-related proof points. At the same time, the company’s own materials acknowledge that scaling recycled cotton is not frictionless. The 2024 highlights explicitly describe Bangladesh unrest as a reminder that supply-chain resilience, transparency and social conditions remain live operating risks. Retail Dive also noted that Recover declined to comment on valuation while acknowledging that mechanically recycled fibers eventually degrade over repeated cycles. Combined with the gap between holdco-level financing claims and sparse public revenue disclosure, that means investors still lack direct evidence on
    current run-rate revenue, gross margins, customer concentration, exact current board seats and the exact share of business tied to each production geography. Recover looks commercially relevant and strategically well positioned, but the public record is still much better at proving growth direction than proving present-day cash economics.
