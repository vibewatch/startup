    - Test project-level unit economics under realistic utilization assumptions
  - - Traceability and trust requirements
    - mixed
    - current
    - Raise adoption friction in the short term but reward players that can prove chain of custody
    - Assess how much traceability cost is borne by Recover vs brands vs manufacturers
  notes: Driver and constraint rows mix regulatory, technical and economic forces because all three shape real adoption in textile-to-textile recycling.
