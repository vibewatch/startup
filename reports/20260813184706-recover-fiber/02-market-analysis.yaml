- id: constraints-economics-and-contradictions
  title: Constraints, economics, and contradictory evidence
  body: The main constraint on Recover’s market is not the absence of waste or the absence of sustainability rhetoric. It is the difficulty of turning low-quality, mixed and contaminated textile waste into repeatable, commercially acceptable fiber. Multiple sources converge on this point. Mechanical recycling is cheaper and easier to deploy than chemical recycling, especially in lower-capital geographies, but it degrades fibers with each cycle and often pushes the output toward lower-value or lower-performance applications unless blends are carefully engineered. Recover’s own Rieter/Birla trial article concedes that many ring-spun yarns still hit a 20% recycled-cotton ceiling in ordinary industrial practice. BCG adds that even with policy support, scaling textile-to-textile recycling in Europe toward roughly 15% by 2035 could require €8-11 billion of one-off capex and €5-6.5 billion of recurring opex, with some links in the value chain facing compressed or negative EBIT margins. EEA and
    MDPI sources also emphasize that collection, sorting and reporting systems remain inconsistent across Europe. These constraints explain why Recover’s market should be treated as supply-constrained and execution-constrained rather than demand-constrained. They also explain why contradictory targets in company-linked sources are not a small disclosure nuisance—they are a signal that market formation is still ahead of industrial proof at full scale.
