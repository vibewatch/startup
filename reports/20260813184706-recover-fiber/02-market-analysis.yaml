- id: TM005
  title: Sizing contradictions and unresolved market gaps
  columns:
  - Issue
  - Evidence A
  - Evidence B
  - Why it matters
  - Diligence next step
  rows:
  - - Recover capacity target
    - 200,000 MT by 2025 in the 2021 Global Fashion Agenda spotlight
    - 350,000 MT by 2026 per Retail Dive citing the 2022 release
    - Ambition moved quickly and may outpace physical build-out
    - Request dated capacity bridge by hub and by product line
  - - Current realized capacity
    - 84,300 MT/year disclosed at end-2024
    - Higher long-range company targets remain unproven in public sources
    - Investors need realized capacity, not only target capacity
    - Validate nameplate vs utilized capacity for each site
  - - True serviceable market size
    - Broad forecasts show a multibillion-dollar recycling market
    - Feedstock-ready sorting base in Europe is only about 1.5Mt today
    - TAM can look huge while execution SAM stays narrow
    - Build bottom-up SAM from sorting-ready cotton / polycotton streams
  - - Buyer readiness
    - Large brands publicly support recycled-content growth
    - Technical mills still face quality and blend ceilings
    - Demand intent does not equal industrial adoption
    - Interview spinner and mill partners on defect rates and blend economics
  - - Policy timing
    - ESPR and DPP direction is clear
    - Specific textile implementation timelines and metrics are still evolving
    - Delayed rules can slow ROI and procurement urgency
    - Track delegated acts, eco-modulated fees and national EPR rules country by country
  notes: This table preserves contradictory sizing evidence rather than forcing false precision; market diligence should reconcile these tensions before using a single revenue multiple.
