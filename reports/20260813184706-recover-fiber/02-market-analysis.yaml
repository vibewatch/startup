- id: buyer-user-payer-map
  title: Buyer, user, payer, and adoption path
  body: 'Recover’s commercial motion is multi-sided. The technical user of its output is often a spinner, yarn producer or fabric mill that must actually run the fiber through industrial processes without quality failures. The economic sponsor is often a brand, retailer or sourcing organization that wants lower-impact material inputs, compliance readiness, or a visible circularity proof point. The payer can shift depending on the program: brands may pay through longer-term offtake or co-development, while vertically integrated manufacturers or JV partners may carry operational conversion costs. The H&M and Primark materials show how a mainstream retailer becomes the demand anchor, while Intradeco shows how a manufacturing partner can become both operator and route-to-market channel. The Target-related RMDF work adds another layer: traceability and documentation are becoming part of the buying workflow, not just the sustainability narrative. Adoption therefore follows a staged path: waste
    must be collected and sorted; the recycler must produce spec-compliant fiber; spinners and mills must validate blend performance; brands must approve aesthetics, durability and claims substantiation; and certification plus traceability systems must carry the story through to audit and, eventually, digital product passports. This is why the market is not simply a price-per-kilo commodity sale. It is an integration sale requiring process trust, quality trust, data trust and supply-continuity trust.'
