  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: unit economics
    missingEvidence: Project-level unit economics showing margin by hub, utilization level and customer program.
    whyItMatters: Without bottom-up economics, headline TAM does not translate into investable capacity.
    diligencePath: Request hub-level cost stacks, realized selling prices and contribution margins.
    relatedQuestionRefs:
    - QM025
  - type: missing-source
    severity: material
    topic: feedstock mix
    missingEvidence: A reconciled split of Recover’s actual post-industrial versus post-consumer input mix by region.
    whyItMatters: The company’s real SAM depends heavily on how much of its feedstock can come from harder post-consumer streams.
    diligencePath: Request input-mix disclosures by hub and by product family.
    relatedQuestionRefs:
    - QM023
  - type: stale
    severity: minor
    topic: regulatory timing
    missingEvidence: A dated implementation calendar mapping textile-specific ESPR, DPP and national EPR milestones into procurement deadlines.
    whyItMatters: Rules are directionally clear but precise commercial timing is still moving.
    diligencePath: Track delegated acts, national rules and customer compliance roadmaps quarterly.
    relatedQuestionRefs:
    - QM024
  - type: conflicting-data
    severity: minor
    topic: capacity ambitions
    missingEvidence: A dated bridge between historical company-plan targets and realized capacity / throughput.
    whyItMatters: Conflicting targets can distort valuation if they are mistaken for achieved scale.
    diligencePath: Ask management to reconcile target announcements with current nameplate and utilized capacity.
    relatedQuestionRefs:
    - QM009
    - QM010
  - type: access-blocked
    severity: minor
    topic: independent mill economics
    missingEvidence: Independent spinner or mill case studies quantifying defect rates and economics at higher recycled-cotton blends.
    whyItMatters: Brand-side interest is visible, but technical-user economics are less public.
    diligencePath: Source partner interviews, mill presentations or diligence calls with spinners and fabric makers.
    relatedQuestionRefs:
    - QM011
    - QM014
    - QM025
