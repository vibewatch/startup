- id: growth-drivers-and-demand-pull
  title: Growth drivers and demand pull
  body: 'Demand pull for Recover’s category is increasingly regulatory and operational rather than purely reputational. The Waste Framework Directive requires separate textile collection from 2025, while the ESPR places textiles among priority product groups and pushes the market toward durability, recyclability, recycled-content disclosure and digital product passports. Recover’s own policy commentary correctly points out the synergy: WFD can increase waste capture while ESPR and related rules create downstream demand for recycled inputs. Additional pressure comes from traceability requirements. Recover’s DPP article and RMDF work with Target show that brands now need material-origin and chain-of-custody information, not just generic sustainability claims. Environmental economics also matter. Recover’s impact methodology article says 1kg of its recycled cotton can save 99.9% water and 93% CO2 versus conventional cotton, while the Global Fashion Agenda spotlight positions scaling recycled
    cotton as a response to both climate pressure and raw-material scarcity. On the customer side, long-term procurement signals from H&M, ongoing Primark programs and brand-led product-development work reduce the risk that recycled cotton stays trapped in tiny pilots. The result is a market where regulation, brand commitments, traceability infrastructure and resource-saving narratives all point in the same direction: more credible demand for high-quality recycled fiber than the current system can easily supply.'
