runDate: '2026-08-13'
company:
  name: Recover Fiber
chapter:
  number: 2
  title: Market Analysis
  summary: Recover sells into a narrow but fast-forming market at the intersection of textile-to-textile recycling, recycled-cotton substitution, and compliance-driven supply-chain transformation. Public sources support multiple sizing lenses—from a $50 billion global cotton market adjacency, to an $8.4 billion 2025 textile recycling market, to a much tighter European feedstock bottleneck where only about 1.5 million tonnes of post-consumer textiles are currently collected and sorted despite waste generation many times larger. Adoption is being pulled by regulation, recycled-content commitments, water and carbon savings, and traceability demands, but constrained by feedstock quality, sorting economics, mixed-fiber complexity, and the technical limits of mechanical recycling.
sections:
- id: market-boundary-and-substitutes
  title: Market boundary, adjacencies, and substitutes
  body: 'Recover does not participate in the entire apparel market, nor even in the full recycling economy. Its actual market sits in a narrower zone: recycled cotton and cotton-rich material inputs that can replace some virgin cotton or lower-impact alternatives inside textile supply chains. That means the relevant spend includes recycled fiber, yarn, fabric-development and traceability-enabling services that help brands, mills and spinners source credible recycled cotton at scale. It excludes finished-garment retail margins, resale platforms, repair, and generic municipal waste management even though those categories influence overall circularity outcomes. The company’s own 2022 financing release is useful because it places Recover inside the broader $50 billion cotton market, which is the economic adjacency brands are trying to partially displace rather than the precise spend Recover can address today. Status-quo substitutes are therefore not only virgin cotton, but also lower-grade mechanical
    recyclers, chemical recyclers offering regenerated cellulosics, recycled polyester suppliers, and in some cases simply continued landfill-or-incineration disposal when collection and sorting economics fail. The central market question is not whether textile waste exists—there is far more waste than today’s system can absorb—but whether enough waste can be converted into recycling-grade, spec-compliant inputs with acceptable economics for brands and mills.'
