callouts:
- calloutType: insight
  title: Recover’s market is waste-rich but feedstock-poor
  body: The limiting reagent is not discarded textiles in aggregate; it is traceable, sorting-ready, specification-compatible textile waste that can move through recycling and into mainstream mills without quality breakdowns. That is why gigantic waste statistics can coexist with a still-small practical SAM.
  claimRefs:
  - CM008
  - CM009
  - CM010
  - CM011
  - CM036
- calloutType: risk
  title: Top-down TAM numbers can overstate investable reality
  body: 'Broad market reports and cotton-market adjacency numbers are useful context, but they hide the real chokepoints: capture rates, sorting depth, blend performance, mill adoption and negative-margin links in the recycling chain. Investors should bottom-up the SAM from processable feedstock, not top-down it from retail fashion spend.'
  claimRefs:
  - CM003
  - CM004
  - CM011
  - CM033
  - CM037
- calloutType: strength
  title: Regulation, traceability and brand procurement are finally converging
  body: Separate collection, DPP readiness, recycled-content expectations and long-term brand procurement signals are starting to reinforce each other. That combination improves the odds that companies like Recover can convert sustainability interest into recurring industrial demand rather than isolated pilot programs.
