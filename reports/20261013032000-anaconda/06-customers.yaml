callouts:
  - calloutType: "insight"
    title: "The 200-Employee Licensing Tipping Point"
    body: "Anaconda's 2020 commercial terms established a 200-employee threshold that fundamentally reshaped its customer dynamics. While small teams and academic users remain on free tiers, mid-market and enterprise organizations face a binary choice: purchase commercial subscriptions for compliance and vendor support, or re-engineer package pipelines around community conda-forge and alternative packaging tools like uv."
