callouts:
  - calloutType: insight
    title: Strategic Shift from Python Packaging to Governed Enterprise AI Infrastructure
    body: Anaconda aggressive 2026 acquisitions of Outerbounds (Metaflow orchestration), Kilo Code (VS Code agent swarms), and Enkrypt AI (autonomous red-teaming) mark a deliberate effort to defend against cloud-native and lightweight package manager commoditization by building an integrated, governed AI Dev Factory.
    claimRefs:
      - CO008
      - CO009
      - CO010
      - CO013
  - calloutType: risk
    title: Commercial Monetization and Private Financial Transparency Gap
    body: While Anaconda claims more than 50 million users and $150 million in annual recurring revenue, the company has not publicly disclosed audited GAAP revenue, paid customer counts, net retention rates, or operating cash burn, leaving the sustainability of its $1.5 billion valuation dependent on unverified private disclosures.
    claimRefs:
      - CO003
      - CO006
      - CO007
      - CO015
