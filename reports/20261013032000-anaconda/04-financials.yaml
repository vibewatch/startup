callouts:
- calloutType: strength
  title: Defensible Compliance-Driven Conversion Engine
  body: Anaconda's 200-employee commercial licensing threshold functions as an automated top-down sales catalyst. By transforming
    ubiquitous open-source adoption into a mandatory enterprise compliance discussion, Anaconda bypasses typical cold-outbound
    sales friction and commands sustained nine-figure ARR ($150M) with reported operational profitability.
  claimRefs:
  - CI001
  - CI002
  - CI011
- calloutType: risk
  title: Community Backlash and Channel Migration Headwinds
  body: Aggressive monetization of open-source distribution carries meaningful switching and attrition risks. Academic institutions
    and cost-sensitive development teams have actively migrated toward free alternatives such as conda-forge, Mamba, and pip,
    creating a long-term risk of eroding top-of-funnel developer mindshare.
  claimRefs:
  - CI008
  - CI009
  - CI010
- calloutType: recommendation
  title: Mandatory Pre-Investment Financial Diligence Priorities
  body: Underwriters must condition any transaction on receiving an audited ARR waterfall, explicit gross margins across hosting
    versus software licenses, verified NRR cohort data, and customer concentration figures to assess whether nine-figure ARR
    can withstand community alternative pressure.
  claimRefs:
  - CI014
  - CI015
  - CI016
