evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: audited-financials
    missingEvidence: Audited GAAP financial statements, verified ARR bridge, gross margins, and cash burn metrics.
    whyItMatters: >-
      Reported $150M ARR and $1.5B valuation cannot be independently validated without audited revenue and cash flow
      disclosures.
    diligencePath: >-
      Request audited financial statements, historical ARR bridges, and current cash runway reports from management
      under NDA.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: leadership-and-founder-table
    missingEvidence: >-
      Comprehensive officer roster including full executive committee, compensation structures, and board of directors
      observer rights.
    whyItMatters: >-
      Partial enumeration leaves unverified whether recent executive turnover extends beyond the CEO transition into
      engineering and sales leadership.
    diligencePath: >-
      Examine formal board minutes, cap table voting agreements, and senior executive employment agreements during
      confirmatory diligence.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder-or-investor-map
    missingEvidence: >-
      Full capitalization table including share class preferences, secondary transaction history, and detailed cloud
      partnership commercial terms.
    whyItMatters: >-
      Without share class seniority and exact ownership breakdown, downside protection and investor alignment cannot be
      quantified.
    diligencePath: >-
      Request the fully diluted capitalization table, investor rights agreements, and commercial revenue-share contracts
      with AWS and Microsoft.
    relatedQuestionRefs:
      - QO003
      - QO005
    relatedTableRefs:
