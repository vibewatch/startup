        - Cloud Hyperscaler ML Platform
        - Embedded in AWS multibillion cloud ecosystem
        - Cloud-first enterprise engineering teams
        - Deep AWS infrastructure integration, fully managed endpoints & compute
        - Cloud lock-in; fragmented developer experience for local workstation testing
