  - id: TP002
    title: Feature / capability matrix
    columns:
      - Buying Criteria
      - Anaconda
      - Databricks
      - Posit (RStudio)
      - Hyperscaler ML (SageMaker / Vertex)
    rows:
      - - Binary Package Governance & CVE Curation
        - Strong (19,000+ curated packages, SBOM/CVE intelligence, main-x)
        - Moderate (Managed cluster runtimes, custom Docker containers)
        - Moderate (Posit Package Manager with CRAN/PyPI mirrors)
        - Weak to Moderate (VPC endpoints, base container images)
      - - Multi-Agent Swarms & MCP Security Testing
        - Emerging (Kilo Code swarms in VS Code, Enkrypt AI red-teaming)
        - Emerging (Databricks Mosaic AI agent frameworks)
        - Minimal (Traditional scripting and notebook execution)
        - Moderate (Bedrock / Vertex agent orchestration frameworks)
      - - Distributed Cloud Compute & Lakehouse Storage
        - Moderate (Kubernetes control plane, Metaflow orchestration)
        - Industry Leading (Delta Lake, serverless Spark, Photon engine)
        - Moderate (Integrates with external compute clusters)
        - Industry Leading (Elastic cloud compute, distributed training clusters)
      - - Local Desktop & Workstation IDE Integration
        - Strong (Navigator, VS Code Kilo Desktop, JetBrains, Excel)
        - Moderate (Databricks Connect, VS Code remote extensions)
        - Strong (RStudio IDE desktop and server)
        - Weak (Cloud-hosted notebook instances preferred)
    notes: Evaluations reflect published feature sets and release announcements through October 2026; private capabilities or unreleased features are not assumed.
    claimRefs:
      - CP005
      - CP006
      - CP007
      - CP008
  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Vendor & Offering
      - Pricing & Contract Model
      - Included Capabilities
      - Enterprise Discounts & Unknowns
      - Customer Budget Implication
    rows:
      - - Anaconda Platform & Business
        - Tiered subscriptions + platform fee and consumption charges
        - Conda curation, package governance, Kilo agent swarms, Enkrypt red-teaming
        - '>200 employee commercial license requirement enforced; private discounts undisclosed'
        - Requires dedicated software governance budget beyond raw cloud compute
      - - Databricks Platform
        - Consumption-based DBU (Databricks Units) + committed contracts
        - Unified data lakehouse, governance (Unity Catalog), MLflow, compute runtimes
        - Enterprise volume discounts applied against annual cloud commitments
        - Billed via cloud marketplace or direct enterprise agreement based on compute
      - - Posit Team / Connect
        - Per-user and per-server annual license subscriptions
        - RStudio IDE, Posit Connect deployment server, Posit Package Manager
        - Academic and small-team tier discounts; enterprise quotes require direct sales
        - Predictable seat-based pricing without variable cloud consumption volatility
      - - AWS SageMaker
        - Pay-as-you-go cloud compute & storage consumption
        - Studio notebooks, training jobs, endpoint inference, model registry
        - EDP (Enterprise Discount Program) commitments apply across AWS spend
        - Absorbed directly into general AWS infrastructure spend; high variable cost risk
    notes: Pricing models synthesized from vendor pricing pages and distributor documentation; realized net discounts and private custom enterprise contracts remain undisclosed.
    claimRefs:
      - CP009
      - CP010
      - CP011
