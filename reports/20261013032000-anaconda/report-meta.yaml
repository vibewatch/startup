companyProfile:
  summary: >-
    Anaconda is an Austin-based open-core Python and AI development platform that combines its widely used open-source
    distribution with paid enterprise governance, security, and agentic AI tooling. Founded in 2012 by Peter Wang and
    Travis Oliphant, the company claims more than 50 million users and over one million organizations, and it raised
    $150 million at a $1.5 billion valuation in 2025. Under CEO David DeSanto, Anaconda has expanded through
    acquisitions of Outerbounds, Kilo Code, and Enkrypt AI to push deeper into governed enterprise AI infrastructure.
  founders:
    - name: Peter Wang
      role: Co-founder, Chief AI and Innovation Officer
      background: Open-source Python ecosystem builder who helped found Anaconda and continues to steer technical strategy.
      claimRefs:
        - CO001
        - CO005
    - name: Travis Oliphant
      role: Co-founder
      background: Creator of NumPy and SciPy who co-founded Anaconda and later stepped back from day-to-day operations.
