callouts:
  - calloutType: "insight"
    title: "The 200-Employee Commercial Threshold as the Primary Monetization Engine"
    body: "Anaconda's revenue capture is fundamentally decoupled from individual developer willingness-to-pay. By embedding a contractual clause requiring organizations with over 200 employees or contractors to purchase commercial licenses, Anaconda transforms a free developer tool into an involuntary enterprise compliance obligation. This structural lever converts passive developer popularity into top-down commercial deals managed by enterprise procurement and legal departments."
    claimRefs:
      - "CM010"
      - "CM013"
  - calloutType: "risk"
    title: "Open-Source Community Alienation and Downstream Substitution Pressure"
    body: "Aggressive commercial licensing enforcement risks eroding Anaconda's grassroots open-source goodwill. As developers encounter audit warnings and restrictions, alternative package management tooling—including Mamba, Poetry, Pipenv, and native uv—gains mindshare. If developer mindshare fractures, Anaconda's bottom-up adoption funnel could weaken, jeopardizing long-term enterprise pipeline replenishment."
    claimRefs:
      - "CM014"
      - "CM015"
