        title: 软件供应链安全、治理控制与新兴风险
        blocks:
          - type: paragraph
            body: >-
              尽管 Anaconda 强调治理和供应链信任，但软件包精选与运行时执行安全之间存在明显技术边界。包括 Forrester Total Economic Impact
              报告在内的独立研究显示，综合企业客户的软件包安全管理时间减少 80%，可防范漏洞风险降低 60%。不过，AI 智能体工作流带来了新的威胁面。Enkrypt AI 研究发现，在超过 25,000 个 Model
              Context Protocol（MCP）服务器中扫描的智能体工具，有 73% 存在漏洞。在这一背景下，Anaconda 的 MCP
              实现是只读元数据顾问，而不是主动执行沙箱；如果下游智能体在配置渠道之外调用未经验证的 shell 工具，组织仍会暴露于风险中。
