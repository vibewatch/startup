  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类定义与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Anaconda 位于开发者生产力、开源软件供应链安全与企业 AI/ML 平台基础设施的交汇处。公司过去被视为将 Python 与 NumPy、SciPy、Pandas
              打包在一起的科学计算发行版，如今已将核心商业产品重新定位为企业 AI
              开发工厂和治理层。在这一边界内，可寻址支出包括精选软件包仓库商业订阅、安全漏洞源、软件物料清单（SBOM）审计、容器编译和模型编排框架。相反，市场边界明确排除商品化的非托管公共软件包仓库、原始公共云 GPU
              算力基础设施、通用数据仓库和消费者 AI 应用。现状替代方案根深蒂固：软件工程组织常依赖非托管 pip 和公共 PyPI 仓库、内部 Docker 与 bash
              脚本，以及手工维护的内部软件包镜像。这些内部变通方案虽不产生直接软件许可费，却让受监管企业暴露于已知安全缺陷、未经审查的开源许可证和损坏的生产依赖树之下，从而构成采用受治理商业发行版的经济理由。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: 市场规模视角：TAM、SAM 与受证据约束的边界
        blocks:
          - type: paragraph
            body: >-
              评估 Anaconda 的市场机会，需要交叉验证自上而下的开发者生态人口、企业安全合规支出，以及自下而上的软件许可门槛。从上层看，Anaconda 处于更广泛的全球开发者基础中，Python
              是现代人工智能的基础编程语言；第三方估计全球 Python 数据从业者超过 45M 至 50M。企业在 AI 治理、安全软件包分发和机器学习运营上的 IT 支出，构成约 $3.5B 至 $5.5B
              的可服务寻址市场，需求来自企业对可复现环境和符合政策的 AI 模型的要求。不过，Anaconda 的可服务可获得市场（SOM）受到商业许可执行的严格限制：服务条款仅要求拥有超过 200
              名员工或承包商的组织购买商业许可。虽然 Anaconda 报告截至 2025 年年中 ARR 已超过
              $150M，但公开市场基准缺乏经审计的第三方市场份额申报。独立市场规模测算仍分散在软件供应链安全、开发者工具和企业 ML 平台等不同软件细分领域，尽调团队应谨慎看待单一整体 TAM 数字。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
