  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值执行摘要与投资建议
        blocks:
          - type: paragraph
            body: >-
              Anaconda 是现代企业数据科学与机器学习生态中的基础软件分发资产之一。公司起步于开源打包方案，累计用户超过 5,000 万，软件包下载量达 210 亿次，并覆盖《财富》500 强企业的
              95%。Anaconda 通过对员工超过 200 人的组织执行商业许可规则，把无处不在的开发者触达转化为据报 1.5 亿美元的 ARR 基线。2025 年 7 月完成 1.5 亿美元 C 轮融资后，公司获得 15
              亿美元投后估值基准，累计股权融资额达到 2.1 亿美元。该估值对应 10.0 倍 ARR 的入场收入倍数。对一家开源平台公司而言，这样的商业规模很亮眼，但公开证据无法审计核实已确认的 GAAP
              收入、客户流失率、毛利率或现金消耗率。因此，建议继续研究，置信度为中等、风险评级为高，估值判断偏高。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV012
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
