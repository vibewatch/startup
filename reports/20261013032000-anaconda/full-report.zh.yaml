        title: 留存动态、商业摩擦与集中度风险
        blocks:
          - type: paragraph
            body: >-
              尽管分发触达强大，Anaconda 仍因商业许可执行和开源渠道替代方案而面临显著的留存与扩张阻力。对超过 200
              名员工的组织强制执行商业许可，在习惯不受限制开源访问的开发者社区中造成明显摩擦和公开反弹。对成本敏感的商业组织而言，社区运营的 conda-forge 渠道提供了可行替代：企业可以配置精简的 Miniconda
              安装，仅从社区仓库获取软件包，绕过 Anaconda Inc. 的专有默认渠道和相关订阅费，同时不牺牲软件包功能。与此同时，uv、pixi 等新一代打包替代方案迅速获得开发者关注，为纯 Python
              环境提供更快性能。在新兴 AI 工作流中，安全研究发现 73% 的公共 Model Context Protocol（MCP）服务器存在可利用漏洞，凸显 Anaconda 新发布的 Model Context
              Protocol 安全网关的企业治理机会。然而，Anaconda 对经审计净收入留存（NRR）、毛收入留存（GRR）和 logo
              流失指标严格保密，投资承销方必须把客户终身价值和扩张持久性视为尚未解决的关键尽调缺口。
            claimRefs:
              - CU003
              - CU004
              - CU009
              - CU010
              - CU014
      - number: '6.5'
        title: 展示
        blocks:
          - type: callout
            title: 200 名员工许可拐点
            body: >-
              Anaconda 2020 年的商业条款设定了 200 名员工门槛，根本性地重塑了客户动态。小团队和学术用户仍可使用免费层，但中型市场和企业组织只有二选一：购买商业订阅以获得合规和供应商支持，或围绕社区
              conda-forge 及 uv 等替代打包工具重构软件包流水线。
            calloutType: insight
            claimRefs:
              - CU003
              - CU004
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管合规与商业许可风险敞口
        blocks:
          - type: paragraph
            body: >-
              企业采用 AI 开发平台所处的法律和监管环境日益严格。主要合规框架，尤其是欧盟 AI 法案、Colorado SB205 和 NIST AI 风险管理框架，要求对生产 AI
              系统进行正式风险分类、对抗性红队测试并保留完备审计轨迹。企业 AI 治理评估显示，早期组织部署经常没有明确问责安排，也未能盘点自主智能体行为，随着监管执行临近，审计轨迹缺口可能变得严重。对 Anaconda
              而言，这些行业普遍存在的治理缺口既是市场驱动力，也是合规负债：供应商提供风险分级蓝图和集中式审计日志以支持 GDPR、HIPAA、CCPA
              义务，但企业客户若无法证明合规具有可辩护性，可能增加客户反弹或引发对平台遥测的审查。同时，Anaconda 要求超过 200 名员工或承包商的组织购买 Business
              许可。这一商业许可边界仍是开发者主导采用的主要摩擦点，需要主动合规审计、席位核对和供应商管理，以避免许可争议和采购延误。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR010
          - type: table
            tableRef: TR001
            claimRefs:
