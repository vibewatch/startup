      - number: '3.2'
        title: 功能能力、打包治理与智能体安全
        blocks:
          - type: paragraph
            body: >-
              Anaconda 的核心护城河来自 Conda 软件包管理器和包含逾 19,000 个二进制软件包的深度精选仓库，系统性消除了标准 pip 工作流中常见的原生 C、C++ 依赖编译冲突。现代 Anaconda
              Platform 将云管理控制平面与客户自有 Kubernetes 数据平面在架构上隔离，确保企业专有源代码、模型和训练数据集不离开内部边界。2026 年，Anaconda
              通过三项战略收购积极扩大差异化：Outerbounds 借助 Metaflow 提供生产 ML 编排；Kilo Code 将多智能体群组直接集成进 Microsoft Visual Studio
              Code，并可访问超过 500 个模型；Enkrypt AI 则针对 Model Context Protocol 工具，在 300
              个攻击向量上执行自动化红队测试。第三方经济分析显示，企业买方获得显著生产力提升，包括软件包安全管理开销下降 80%。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP012
              - CP013
