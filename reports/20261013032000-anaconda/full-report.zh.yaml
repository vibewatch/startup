    title: 公司里程碑时间线
    type: timeline
    summary: Anaconda 从 2012 年的基础 Python 发行版发展为 2026 年受治理的企业 AI 智能体平台。
    data:
      items:
        - label: 以 Continuum Analytics 创立
          date: '2012'
          detail: Peter Wang 和 Travis Oliphant 在得克萨斯州奥斯汀创立 Continuum Analytics，打造 Conda 和开源 Anaconda Distribution。
          tone: positive
          claimRefs:
            - CO001
        - label: 创建 PyData 社区
          date: '2013'
          detail: 创建 PyData 会议系列，组织开源科学 Python 生态。
          tone: neutral
          claimRefs:
            - CO001
        - label: 公司更名为 Anaconda
          date: '2017'
          detail: 从 Continuum Analytics 更名为 Anaconda, Inc.，使公司身份与旗舰发行版保持一致。
          tone: neutral
          claimRefs:
            - CO001
        - label: B 轮融资与云扩张
          date: '2022'
          detail: 以 $372M 估值完成 B 轮融资，并收购 PythonAnywhere，扩展云端 Python 环境。
          tone: positive
          claimRefs:
            - CO006
        - label: Anaconda AI Platform 上线
          date: May 2025
          detail: 推出 Anaconda AI Platform，为企业数据科学提供受治理、经过安全扫描的开源 Python 软件包。
          tone: positive
          claimRefs:
            - CO002
        - label: C 轮独角兽融资
          date: July 2025
