      - number: '1.3'
        title: 资本结构、战略合作与并购驱动的平台扩张
        blocks:
          - type: paragraph
            body: >-
              Anaconda 已通过多轮机构风险投资扩大企业平台并推动技术整合。公司完成由 Insight Partners 领投的 $150M C 轮融资，投后估值 $1.5B。Anaconda 并未只依赖内部研发，而是在
              2026 年积极动用资产负债表，在六个月内完成三项战略收购。收购 Outerbounds 带来了基于 Metaflow 的生产编排能力；Metaflow 是最初由 Netflix 创建的开源框架。随后，公司收购
              Kilo Code，新增集成于 VS Code 的智能体编码环境，据报道其活跃开发者社区超过 500 万人。最后，公司收购 Enkrypt AI，为模型和 Model Context
              Protocol（MCP）服务器嵌入运行时护栏及自动化红队安全能力。商业上，Anaconda 借助与主要云厂商的合作交付 Anaconda AI Catalyst，包括与 Amazon Web Services
              的战略合作，以及与 Microsoft Azure Machine Learning 和 Python in Excel 的深度集成。
            claimRefs:
