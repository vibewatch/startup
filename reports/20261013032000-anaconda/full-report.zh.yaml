        - 对员工超过 200 人的企业强制许可，把庞大开发者使用量转化为稳定企业 ARR
        - 社区反弹与开发者敌意侵蚀品牌，推动迁移至免费开源工具
        - 净收入留存率跌破 100%，或受监管企业账户中的开发者公开抵制
      - - 智能体 AI 开发工厂扩张
        - 收购 Outerbounds Metaflow 和 Kilo Code，让公司延伸至全生命周期智能体 AI 编排
        - 整合收购代码库的执行复杂度上升，同时云超大规模厂商免费捆绑原生智能体工作流
        - 智能体集群无法实现有意义的付费客户采用；企业偏好原生云技术栈
      - - 资本结构与下行风险
        - 累计融资 $210M，投资方包括 Insight Partners、Snowflake Ventures 和 General Catalyst
        - 未披露的清算优先权和二级估值折价给次级持有人带来下行风险
        - 下轮融资、引入优先级债务工具或资本重组稀释现有股权
    notes: 核心投资论点与结构性运营风险及监测指标的综合。
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV006
      - CV007
      - CV009
  - id: TV003
    title: 牛市 / 基准 / 熊市情景表
    columns:
      - 情景
      - 核心假设
      - 估值 / 倍数逻辑
      - 关键下行触发点
      - 概率信号
    rows:
      - - 乐观情景
        - AI 开发工厂和 Outerbounds 采用推动 ARR 年增 >30%；NRR 超过 120%
        - $2.5B–$3.0B 估值（远期 ARR 的 12x–14x），由战略性公开 IPO 或云超大规模厂商收购支撑
        - 企业销售摩擦，或智能体集群无法实现规模化变现
        - 25%（要求企业 AI 商业化执行毫无瑕疵）
      - - 基准情景
        - 通过有纪律的商业执行，ARR 同比增长 15%–20%；NRR 稳定在 105%–110%
        - $1.5B–$1.8B 估值（远期 ARR 的 7x–8x），反映成熟基础设施开发工具市场倍数
        - 云超大规模厂商定价压力，以及企业越来越抵触由审计驱动的许可续期
        - 50%（与私营公司历史轨迹最一致）
      - - 悲观情景
        - 收入增速放缓至 10% 以下；开发者转向免费工具，侵蚀商业续约基础
        - $800M–$1.0B 估值（远期 ARR 的 4x–5x），伴随倍数显著收缩
        - 企业反对许可审计；云厂商原生捆绑软件包治理
        - 25%（若开源信任和留存恶化，将出现实质性下行）
      - - 下行阈值
        - 收入绝对值收缩、客户高流失，或围绕软件包许可条款遭遇不利法律裁决
        - 低于 $600M 的困境资本重组或甩卖交易
        - 优先级清算权完全抹去普通股和次级股权持有人权益
        - 击杀触发点：ARR 同比收缩 >15%，或毛利率降至 60% 以下
    notes: 情景预测以报告的 $150M 基准 ARR 为参照，采用标准基础设施软件的倍数区间。
    claimRefs:
      - CV002
      - CV004
      - CV010
      - CV011
      - CV013
