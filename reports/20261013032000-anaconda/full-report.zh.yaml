          label: 变现与商业政策
          detail: 对员工超过 200 人的组织执行付费商业许可，据报道带来 $150M ARR
        - id: platform-expansion
          label: 并购与平台扩张
          detail: 收购 Outerbounds 和 Kilo Code，把能力拓展到企业级智能体编排
        - id: valuation-benchmark
          label: 估值与倍数基准
          detail: Series C 轮以 $1.5B 定价、对应 $150M ARR，意味着按远期经常性收入计算的入场倍数为 10.0x
        - id: risk-overhang
