              - CO015
      - number: '1.2'
        title: 高管领导、治理与人才交接
        blocks:
          - type: paragraph
            body: >-
              Anaconda 从开源数据科学工具供应商转向企业 AI 基础设施提供商的过程中，领导层发生了重大变化。2025 年 10 月，Anaconda 任命 David DeSanto 为 CEO，接替自 2024
              年初领导公司的 Barry Libert。DeSanto 拥有二十多年企业网络安全和 DevSecOps 经验，曾任 GitLab 首席产品官，负责推动平台扩展至原生 AI 开发者工作流。DeSanto
              就任后，联合创始人 Peter Wang 转任首席 AI 与创新官，继续负责开源生态并拓展外部开发者关系，同时淡出日常公司行政管理。NumPy 和 SciPy 等基础 Python 库的创建者、联合创始人
              Travis Oliphant 此前也已退出日常运营，但其技术遗产仍为 Anaconda 带来持久的社区善意。历史信誉集中在 Peter Wang 身上，使关键人物风险持续存在；不过，从大型上市软件供应商引入
              DevSecOps 高管，降低了对纯技术创始人的依赖。
            claimRefs:
              - CO001
              - CO004
              - CO005
