      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 智能体 AI 审计缺口与许可摩擦构成主要剩余风险
            body: >-
              Anaconda 通过源码构建的精选机制和控制平面隔离强化了开源软件包安全，但企业快速转向自主多智能体开发，也在《欧盟人工智能法案》和 Colorado SB205
              框架下引入了严重的审计追踪与治理责任。对员工超过 200 人的组织执行商业许可，仍是运营上的摩擦点，需要透明管理客户审计。
