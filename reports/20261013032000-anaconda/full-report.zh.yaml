  - id: FI001
    title: Anaconda 商业变现与企业转化流程
    type: flow
    summary: 展示 Anaconda 如何将开源开发者使用转化为高利润企业合规和 AI 平台订阅合同的分步转化管道。
    data:
      nodes:
        - id: dev-adoption
          label: 开源采用
          description: 个人开发者下载 Anaconda Distribution 和 Conda 软件包，用于开源 AI 与数据科学。
        - id: threshold-trigger
          label: 200 人政策触发点
          description: 组织规模超过 200 人门槛，按服务条款依法必须取得商业业务许可。
        - id: compliance-audit
          label: 采购与合规接洽
          description: 企业 IT、采购和法务部门与 Anaconda 商业销售团队接洽，以弥补许可暴露。
        - id: commercial-licensing
          label: 商业仓库许可
          description: 组织采购付费商业许可，以合规访问软件包镜像和精选仓库。
        - id: platform-expansion
          label: 受治理平台增购
          description: 扩展至 Anaconda AI Platform、AI Catalyst（AWS）和智能体工作区，推动多产品企业 ARR。
        - id: retained-profitability
          label: 现金流转正规模
          description: 高利润订阅现金流支撑报告的九位数 ARR（$150M），实现运营自立。
      edges:
        - from: dev-adoption
          to: threshold-trigger
          label: 企业员工规模增长
        - from: threshold-trigger
          to: compliance-audit
          label: 服务条款执行
        - from: compliance-audit
          to: commercial-licensing
          label: 合同正式化
        - from: commercial-licensing
          to: platform-expansion
          label: AI 治理交叉销售
        - from: platform-expansion
          to: retained-profitability
          label: 经常性 ARR 扩张
