  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 这是一条端到端的分析决策链：把 Anaconda 的开发者规模、商业化、并购扩张、估值倍数和下行风险串起来，最终给出“继续研究”的建议。
    data:
      nodes:
        - id: scale-distribution
          label: 用户基础与分发
          detail: 50M+ 名开发者、21B+ 次软件包下载，以及覆盖 95%《财富》500 强企业，构成了强大的初始触达面
