  - id: FE001
    title: 产品架构图
    type: stack
    summary: Anaconda 的六层架构栈，覆盖本地开发者界面、智能体编排、安全治理、软件包精选、容器编译和企业部署边界。
    data:
      layers:
        - label: 开发者界面与本地工具
          detail: Anaconda Desktop、Navigator、Anaconda CLI（ana）、JupyterLab、VS Code 扩展和本地 conda 环境运行器。
        - label: 智能体编排与模型目录
          detail: Kilo Code 智能体集群、AI Workspaces、包含 77 个精选开源模型的 Model Catalog，以及托管 / 本地推理服务器。
        - label: 安全与运行时护栏
          detail: Enkrypt AI 红队测试、Model Context Protocol（MCP）策略顾问、通过 NVD/NIST 进行 CVE 跟踪，以及运行时护栏。
        - label: 软件包精选与分发
          detail: Anaconda Defaults 频道、包含 13,000+ 个源代码构建软件包的 main-x 扩展频道、软件包加密签名和 SPDX SBOM。
        - label: 容器编译与打包
          detail: FastBakery 容器构建引擎无需 Dockerfile，即可将 conda 和 PyPI 依赖编译为可复现容器镜像。
        - label: 企业基础设施与边界
          detail: 气隙隔离的本地部署、AWS Marketplace 集成、Amazon VPC 私有边界和企业 SSO 目录同步。
