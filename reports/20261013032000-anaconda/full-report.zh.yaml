      - number: '2.3'
        title: 买方细分、预算归属与采购路径
        blocks:
          - type: paragraph
            body: >-
              Anaconda 平台的商业势头体现为多方参与的企业采购动态：开发者自下而上采用，企业自上而下执行合规。在企业环境中，个人数据科学家、ML 研究员或量化分析师是主要用户，需要即时访问数千个 Python 库、本地
              GPU 推理和交互式笔记本，不愿受到行政流程拖延。但预算归属和采购权限主要掌握在首席信息安全官（CISO）、企业基础设施副总裁或平台工程负责人手中。商业采购触发点很少只是开发者需求，更多来自法律团队发现组织在
              200 名员工商业门槛下违规使用发行版、IT 安全审计发现未修补的开源漏洞，或金融服务、国防和医疗行业的监管要求。采购通常借助 AWS Marketplace 使用预先承诺的企业云支出，以便企业 IT
              部门审批预算。
            claimRefs:
              - CM003
              - CM010
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
      - number: '2.4'
        title: 宏观增长驱动因素与企业采用约束
        blocks:
          - type: paragraph
            body: >-
              Anaconda 的采用同时受加速的结构性顺风和开源许可、开发者工作流阻力的明显摩擦影响。企业大举投入生成式 AI 和自主智能体工作流，强力推动增长；AI
              生成代码将更高的漏洞率和不透明的第三方依赖带入企业代码库。平台遥测所引用的研究显示，未经审查的智能体工具和第三方依赖经常引入关键攻击向量，迫使安全团队要求集中式运行时护栏和基于源码构建的软件包注册表。一项委托
              Forrester Total Economic Impact 研究称，客户组织运营效率提高 80%，可防范攻击带来的安全漏洞风险降低 60%。但采用也遇到明显阻力：对超过 200
              名用户的组织执行付费商业条款，引发开发者社区反弹，推动其探索 Poetry、Pipenv、Mamba 等轻量级开源替代方案。此外，企业在 IT
              合理化周期中会压缩数据科学预算，除非能紧密纳入更广泛的企业平台协议，否则单独购买开发者工作站许可会遭到抵触。
            claimRefs:
              - CM004
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 展示
        blocks:
          - type: callout
            title: 200 名员工商业门槛：主要变现引擎
            body: >-
              Anaconda 的收入获取从根本上脱离了个人开发者的付费意愿。通过写入要求拥有超过 200 名员工或承包商的组织购买商业许可的合同条款，Anaconda
              把免费开发者工具变成企业被动承担的合规义务。这一结构性杠杆将被动的开发者人气转化为由企业采购和法务部门管理的自上而下商业交易。
            calloutType: insight
            claimRefs:
              - CM010
              - CM013
          - type: callout
            title: 开源社区疏离与下游替代压力
            body: >-
              激进执行商业许可可能侵蚀 Anaconda 在基层开源社区积累的 goodwill。开发者遇到审计警告和限制后，Mamba、Poetry、Pipenv 及原生 uv
              等替代软件包管理工具会获得更多关注。若开发者心智分裂，Anaconda 自下而上的采用漏斗可能走弱，长期企业销售管道补充也会受损。
            calloutType: risk
            claimRefs:
              - CM014
              - CM015
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接、既有与相邻竞争格局
        blocks:
          - type: paragraph
            body: >-
              Anaconda 处于开源开发者工具与企业软件供应链治理的关键交汇点。公司拥有超过 5,000 万社区用户、约 300 名员工，据报道已在 95% 的《财富》500 强企业中实现软件采用，作为默认 Python
              科学发行版占据无可比拟的开发者心智。不过，其竞争环境横跨多个细分品类，对商业扩张构成挑战。直接及相邻替代方案包括 Databricks、Snowflake 等统一分析平台，Posit（前身为 RStudio）和
              MathWorks MATLAB 等统计计算专业工具，以及 AWS SageMaker、Google Vertex AI、Microsoft Azure Machine Learning
              等公共云超大规模厂商。与此同时，以标准 PyPI、pip、virtualenv 和容器化 Docker 环境为核心的现状替代方案，仍存在于偏好内部工具而非商业治理订阅的工程组织中。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
