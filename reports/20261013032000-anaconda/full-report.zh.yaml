      - number: '1.4'
        title: 战略里程碑与产品演进
        blocks:
          - type: paragraph
            body: >-
              Anaconda 的公司发展经历了三个阶段：建立开源社区、将企业治理变现，以及整合智能体 AI 平台。2012 至 2017 年，公司通过开发 Conda、建立 PyData 会议网络，解决科学 Python
              中复杂的 C 扩展依赖问题。2018 至 2024 年，公司借助 Anaconda Enterprise、通过 2022 年收购 PythonAnywhere
              获得的云笔记本环境，以及商业仓库许可，将这些工作流变现。当前阶段始于 2025 年并在 2026 年加速，Anaconda 将自身重新定位为把多智能体群组与自动化漏洞测试结合起来的 AI 开发工厂。2026 年
              10 月，Anaconda 扩展平台，将 Kilo 智能体群组与 Enkrypt AI 对抗性安全扫描器一起部署到开发者 IDE 中。Enkrypt AI 扫描 25,264 个 MCP 服务器中的
              268,210 个智能体工具，发现 73% 的受评估工具存在安全漏洞，凸显了这一治理层的紧迫性。
