chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、创立与规模
        blocks:
          - type: paragraph
            body: >-
              Anaconda, Inc. 是一家总部位于得克萨斯州奥斯汀的企业软件与开发者工具公司，是 Python 数据科学和人工智能工作流的主要入口。公司由 Travis Oliphant 和 Peter Wang 于
              2012 年以 Continuum Analytics 之名创立，并在 2017 年更名为 Anaconda，以统一围绕其广泛使用的开源发行版打造商业身份。Anaconda
              采用混合开放核心商业模式，将免费社区发行版与商业层结合，提供精选软件包仓库、漏洞扫描和面向受监管企业的合规控制。公司自称在全球拥有超过 50M 个人用户，覆盖逾 100 万 家组织，其中包括超过半数《财富》500
              强企业。不过，社区触达虽极其广泛，商业变现仍属非公开信息；第三方报告称，在 2025 年 7 月估值 $1.5B 后，公司 ARR 约为 $150M。Anaconda
              长期因免费层的许可执行引发社区摩擦和开发者反弹，部分开发者因此转向 Mamba、Poetry 等替代工具。投资者必须严格区分漏斗顶端的免费发行版采用与签约企业订阅。
            claimRefs:
