          detail: 社区摩擦、云超大规模服务商的替代方案，以及缺少经审计的利润率数据，构成实质性的下行风险
        - id: recommendation-stance
          label: 投资立场与尽调门槛
          detail: 偏高的估值立场决定了“继续研究”的建议，前提是能够取得审计确认材料
      edges:
        - from: scale-distribution
          to: commercial-policy
          label: 商业化
        - from: commercial-policy
          to: platform-expansion
          label: 产品延伸
        - from: platform-expansion
          to: valuation-benchmark
          label: 估值锚点
        - from: valuation-benchmark
          to: risk-overhang
          label: 风险调整
        - from: risk-overhang
          to: recommendation-stance
          label: 决策结果
    approximationNotes: 按顺序评估定性触达能力和据报道的私募融资指标，在证据约束下形成投资建议。
