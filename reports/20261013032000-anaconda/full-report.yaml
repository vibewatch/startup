      - number: '5.2'
        title: Operating Architecture, Packaging Pipeline, and AI Stack
        blocks:
          - type: paragraph
            body: >-
              The Anaconda technical architecture operates across six primary layers spanning developer tooling, model
              catalogs, security guardrails, package curation, container compilation, and enterprise hosting perimeters.
              At the package foundation, Anaconda engineers build and cryptographically sign binaries from source,
              providing Software Bills of Materials (SBOMs) compliant with SPDX 2.2.1 specifications down to individual
              file checksums. Automated policy filters continuously evaluate packages against the National Vulnerability
              Database (NVD) and NIST CVE repositories, restricting vulnerable libraries before they reach practitioner
              channels. For enterprise production deployments, the FastBakery engine compiles conda and PyPI
              dependencies into reproducible container images without requiring custom Dockerfiles, while local
              inference runtimes allow practitioners to execute curated open-source models within private VPCs or
              air-gapped on-premises perimeters.
