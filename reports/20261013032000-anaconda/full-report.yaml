      - number: '8.4'
        title: Recommendation Logic, Governance Overhang & Diligence Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              Our analytical recommendation framework synthesizes developer adoption scale, commercial conversion proof,
              strategic product expansion, and valuation entry discipline against unmitigated risk factors. While
              Anaconda has demonstrated clear commercial proof points through $150M in reported ARR and strategic M&A
              across Outerbounds and Kilo Code, the lack of transparency into cap-table preferences and audited customer
              retention dictates caution. Private company governance introduces material uncertainty: public records do
              not disclose whether earlier Series C investors hold senior liquidation preferences, participation rights,
              or downside ratchets that would dilute common equity in a modest exit. Before allocating growth capital at
              or above the $1.5B valuation mark, institutional investors must establish clear confirmatory diligence
              requirements. Key kill criteria include any recorded decline in trailing enterprise ARR greater than 15%
              YoY, gross margins deteriorating below 60%, or evidence of net customer churn in large enterprise accounts
              migrating to unencumbered open-source alternatives.
