      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Defensible Compliance-Driven Conversion Engine
            body: >-
              Anaconda's 200-employee commercial licensing threshold functions as an automated top-down sales catalyst.
              By transforming ubiquitous open-source adoption into a mandatory enterprise compliance discussion,
              Anaconda bypasses typical cold-outbound sales friction and commands sustained nine-figure ARR ($150M) with
