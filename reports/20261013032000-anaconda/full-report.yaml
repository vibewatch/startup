      - number: '3.2'
        title: Feature Capabilities, Packaging Governance, and Agent Security
        blocks:
          - type: paragraph
            body: >-
              Anaconda's core moat originates in its Conda package manager and deeply curated repository of over 19,000
              binary packages, which systematically eliminates native C and C++ dependency compilation conflicts that
              plague standard pip workflows. The modern Anaconda Platform enforces architectural separation between a
              cloud-managed control plane and customer-owned Kubernetes data planes, ensuring enterprise proprietary
              source code, models, and training datasets never leave internal perimeters. During 2026, Anaconda
              aggressively broadened its differentiation through three strategic acquisitions: Outerbounds provides
              production ML orchestration via Metaflow, Kilo Code introduces multi-agent swarms integrated directly into
              Microsoft Visual Studio Code with access to over 500 models, and Enkrypt AI delivers autonomous
              red-teaming across 300 attack vectors to evaluate Model Context Protocol tools. Third-party economic
              analysis indicates enterprise buyers experience substantial productivity gains, including an 80% reduction
              in package security overhead.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP012
              - CP013
          - type: table
            tableRef: TP002
            claimRefs:
