      - CV009
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Core Assumptions
      - Valuation / Multiple Logic
      - Key Downside Triggers
      - Probability Signal
    rows:
      - - Bull Case
        - ARR expands >30% annually propelled by AI Dev Factory and Outerbounds adoption; NRR exceeds 120%
        - $2.5B–$3.0B valuation (12x–14x forward ARR) supported by strategic public IPO or cloud hyperscaler acquisition
        - Enterprise sales friction or failure of agent swarms to monetize at scale
        - 25% (requires flawless enterprise AI monetization execution)
      - - Base Case
        - ARR expands 15%–20% YoY through disciplined commercial enforcement; NRR holds steady at 105%–110%
        - $1.5B–$1.8B valuation (7x–8x forward ARR) reflecting mature infrastructure devtools market multiples
        - Hyperscaler pricing pressure and increasing enterprise resistance to audit-driven license renewals
        - 50% (most consistent with historical private company trajectory)
      - - Bear Case
        - Revenue growth decelerates below 10%; developer defections to free tools erode commercial renewal base
        - $800M–$1.0B valuation (4x–5x forward ARR) marked by significant multiple contraction
        - Enterprise pushback on licensing audits; cloud providers bundle package governance natively
        - 25% (material downside if open-source trust and retention degrade)
      - - Downside Threshold
        - Absolute revenue contraction, high customer churn, or adverse legal defeat regarding package licensing terms
        - Sub-$600M distressed recapitalization or fire-sale transaction
        - Senior liquidation preferences entirely wiping out common and junior equity holders
        - 'Kill trigger: ARR contraction >15% YoY or gross margin dropping below 60%'
    notes: >-
      Scenario projections evaluated against $150M reported baseline ARR across standard infrastructure software
      multiple bands.
    claimRefs:
      - CV002
      - CV004
      - CV010
      - CV011
      - CV013
