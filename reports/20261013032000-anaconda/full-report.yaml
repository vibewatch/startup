        - label: Agent Orchestration & Model Catalog
          detail: >-
            Kilo Code agent swarms, AI Workspaces, Model Catalog with 77 vetted open-source models, and hosted/local
            inference servers.
        - label: Security & Runtime Guardrails
          detail: >-
            Enkrypt AI red-teaming, Model Context Protocol (MCP) policy adviser, CVE tracking via NVD/NIST, and runtime
            guardrails.
        - label: Package Curation & Distribution
          detail: >-
            Anaconda Defaults channel, main-x extended channel with 13,000+ source-built packages, cryptographic package
            signing, and SPDX SBOMs.
        - label: Container Compilation & Packaging
