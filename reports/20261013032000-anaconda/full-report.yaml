            title: Strategic Shift from Python Packaging to Governed Enterprise AI Infrastructure
            body: >-
              Anaconda aggressive 2026 acquisitions of Outerbounds (Metaflow orchestration), Kilo Code (VS Code agent
              swarms), and Enkrypt AI (autonomous red-teaming) mark a deliberate effort to defend against cloud-native
              and lightweight package manager commoditization by building an integrated, governed AI Dev Factory.
