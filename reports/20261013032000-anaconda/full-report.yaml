      governance, package curation, container compilation, and enterprise deployment perimeters.
    data:
      layers:
        - label: Developer Interface & Local Tools
          detail: >-
            Anaconda Desktop, Navigator, Anaconda CLI (ana), JupyterLab, VS Code extension, and local conda environment
