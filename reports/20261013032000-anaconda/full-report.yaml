  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Buyer Profiles
        blocks:
          - type: paragraph
            body: >-
              Anaconda's commercial ecosystem exhibits a pronounced bifurcation between its massive open-source user
              community and a concentrated tier of paid enterprise accounts. Over 50 million data science practitioners,
              students, and academic researchers utilize the free Anaconda Distribution to manage numerical Python
              environments, package dependencies, and local Jupyter notebook workflows. Because individual and
              small-team usage carries no direct software licensing cost, this community layer operates primarily as an
              ecosystem on-ramp and developer mindshare engine rather than an immediate revenue generator. Commercial
              monetization formally engages at the enterprise tier, initiated in 2020 when Anaconda updated its terms of
              service to require paid commercial subscriptions for organizations exceeding 200 employees. Enterprise
              buyers are typically IT directors, chief security officers, and enterprise architecture leaders seeking
              centralized package mirroring, vulnerability tracking against National Vulnerability Database (NVD) CVE
              feeds, and Software Bills of Materials (SBOMs) to secure their internal software supply chains. At the
              highest tier, regulated financial institutions, healthcare providers, and defense contractors deploy
              self-hosted or air-gapped instances of Package Security Manager to ensure deterministic compliance across
              private cloud, Docker, and Kubernetes clusters without outbound internet access.
