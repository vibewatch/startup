      - number: '8.3'
        title: Valuation Benchmarks, Comparable Multiples & Scenario Analysis
        blocks:
          - type: paragraph
            body: >-
              At a $1.5B post-money valuation on $150M reported ARR, Anaconda trades at 10.0x trailing revenue. In the
              current software market, where mature infrastructure devtools typically command 6.0x–8.0x revenue
              multiples and high-growth AI infrastructure trades between 12.0x–15.0x, Anaconda's current valuation
              reflects an embedded growth premium. Under our base-case scenario, assuming 15%–20% sustainable annual
              recurring revenue growth and steady enterprise renewals, the company justifies an enterprise value range
              of $1.5B–$1.8B (7.0x–8.0x forward ARR). Under an optimistic bull-case scenario where Outerbounds
              orchestration and Kilo Code agent swarms drive net revenue retention above 120%, valuation could expand to
              $2.5B–$3.0B upon an eventual public listing or hyperscaler acquisition. Conversely, our bear-case scenario
              reveals severe downside vulnerability: should community defection and hyperscaler bundling cause revenue
              growth to stall below 10%, multiples would likely compress to 4.0x–5.0x ARR, implying an enterprise value
              of $800M–$1.0B. A downside threshold of sub-$600M could occur if senior liquidation preferences compound
              in a distressed recapitalization.
            claimRefs:
