          date: "2020"
          detail: Third-party review identifies the founding year and founders.
        - label: Public launch of Cloaked app and web platform after beta
          date: "2023-10-03"
          detail: Launch release introduced unlimited secure identities across phone, email, username, and password workflows.
        - label: Launch materials disclose $29M raised and early investor slate
          date: "2023-10-03"
          detail: The same release listed Lux Capital, Human Capital, General Catalyst, and other backers.
        - label: About-page refresh documents current feature set
          date: "2026-07-28"
