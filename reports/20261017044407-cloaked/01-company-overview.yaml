schemaVersion: report-v2
artifact: company-overview
slug: cloaked
runDate: 2026-10-17
company:
  name: Cloaked
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Cloaked presents as a founder-led New York privacy platform whose consumer alias,
    data-removal, and call-protection bundle now extends into enterprise employee
    identity protection. The assigned refresh evidence supports current product breadth
    and public usage signals, but it still leaves current valuation, revenue, headcount,
    and board visibility materially under-disclosed.
sections:
  - id: identity-and-scope
    title: Identity and product scope
    body: >-
      Cloaked's own current materials describe the company as a privacy-first identity
      management system rather than a single-point data-removal utility. The product
      stack now combines masked identities, data-removal workflows, call protection,
      password management, monitoring, and private-payment functionality, with the
      current public surfaces still marking Cloaked Pay as limited access or beta
      rather than broad GA. The onboarding guide also shows that the product is meant
      to work across mobile, web, browser-extension, and Mac contexts, which matters
      because the value proposition is ongoing identity-layer replacement rather than
      one-time cleanup. The enterprise site extends the same logic into workforce
      protection by positioning exposed employee identity data as reconnaissance
      material that can enable impersonation and unauthorized account access.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO014]
    tableRefs: [TO001]
  - id: leadership-capital-and-governance
    title: Leadership, capital visibility, and governance
    body: >-
      Public leadership disclosure in the assigned pool is narrow and founder-centric.
      The clearest named roles still come from the 2023 launch release, which identifies
      Arjun Bhatnagar as CEO and Abhijay Bhatnagar as President; that same release also
      anchors the last directly verifiable investor list in this chapter's evidence set.
      A later commercially affiliated review still describes Cloaked as founded in 2020
      by the same brothers and headquartered in New York, which helps corroborate
      identity but does not solve the refresh-era disclosure gap around current
      valuation, financing mix, debt, or board composition. In practice, the company
      remains visibly founder-led, while outside readers still need a current cap-table
      and governance packet before treating the public record as a reliable diligence
      baseline.
    claimRefs: [CO007, CO008, CO013, CO015]
    tableRefs: [TO002, TO003]
  - id: scale-signals-and-milestones
    title: Scale signals, external challenge points, and milestone readout
    body: >-
      Cloaked's current homepage markets large usage totals, including 170+ million
      calls screened, 19+ million accounts masked, and 3.3+ billion broker records
      removed. Those company-reported activity metrics indicate usage but do not
      substitute for disclosed paying-customer, revenue, or retention figures. The
      Google Play listing describes removal from 120+ brokers, while the
      homepage uses a broader 1,000+ sites formulation. Security.org further says only
      350+ of those advertised sites are actual data brokers or people-search sites,
      underscoring that the three quantities use different denominators and should not
      be treated as interchangeable. A commercially affiliated review also flags that
      VoIP-based alias numbers may be rejected by some services and cannot place 911
      calls. The net read is a product with clear public activity and feature breadth,
      but one that still asks investors to bridge disclosure gaps without audited public
      operating data.
    claimRefs: [CO009, CO010, CO011, CO012, CO015]
    figureRefs: [FO001]
