        - label: Homepage markets current scale metrics
          date: "2026"
          detail: Consumer homepage claims 170+ million calls screened, 19+ million accounts masked, and 3.3+ billion records removed.
    claimRefs: [CO002, CO003, CO006, CO008, CO009, CO013]
callouts:
  - calloutType: insight
    title: Founder-led platform widening beyond consumer privacy
    body: >-
      The assigned pool shows Cloaked evolving from consumer aliasing into a broader
      privacy stack with data removal, monitoring, payments, and an enterprise employee-
      protection pitch, which increases surface area and monetization paths but also
      raises the diligence burden on execution quality.
    claimRefs: [CO002, CO005, CO014]
  - calloutType: risk
    title: Public disclosure quality still lags product visibility
    body: >-
      The chapter can verify current feature breadth and some usage/activity signals,
      but it still cannot directly support current valuation, revenue, headcount, board
      composition, or customer-count basics from the assigned refresh evidence alone.
    claimRefs: [CO009, CO010, CO011, CO012, CO015]
