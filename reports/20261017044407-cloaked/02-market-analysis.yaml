slug: "cloaked"
runDate: "2026-10-17"
company:
  name: "Cloaked"
chapter:
  number: 2
  title: "Market Analysis"
  summary: >-
    Cloaked competes in a converging consumer privacy and identity-safety market by combining
    preventive identity masking with remedial data removal and monitoring. Public evidence
    supports a North American consumer footprint, an emerging enterprise adjacency, and meaningful
    company-reported usage, but it does not support a defensible monetary TAM, SAM, SOM, or CAGR.
sections:
  - id: "market-boundary"
    title: "Market boundary and substitutes"
    body: >-
      The investable market is narrower than cybersecurity as a whole and broader than data-broker
      removal alone. Cloaked bundles two linked jobs: preventing new exposure through masked contact
      details and reducing existing exposure through removals, monitoring, and recovery support.
      Adjacent functions such as VPN, password management, dark-web alerts, scam-call screening, and
      identity-theft insurance strengthen the bundle but should not be counted as wholly incremental
      addressable spend when buyers already purchase them separately. The relevant substitutes are
      manual opt-outs, browser or carrier controls, standalone privacy tools, password managers, and
      broader identity-protection suites. This boundary avoids counting enterprise network security,
      credit monitoring, antivirus, or the entire identity-theft market as directly addressable
      Cloaked spend.
    claimRefs: ["CM001", "CM002", "CM003", "CM006", "CM010", "CM012"]
    tableRefs: ["TM001"]
  - id: "sizing-without-false-precision"
    title: "Sizing without false precision"
    body: >-
      The assigned evidence does not contain an independent market estimate with a stated
      methodology, geography, period, and category definition, so a monetary TAM/SAM/SOM would be
      false precision. The defensible sizing lens is therefore a sequence of progressively narrower
      scopes: a broad privacy problem, the bundled consumer category, the currently supported United
      States and Canada footprint, paid household plans, the new enterprise employee-protection
      motion, and Cloaked's reported foothold. Company-reported operating counters demonstrate
      activity, not market size or recurring revenue. TechCrunch's greater-than-350,000 paying
      customer figure and Cloaked's greater-than-400,000-user community figure also use different
      denominators and should not be merged into one growth series.
    claimRefs: ["CM004", "CM013", "CM014", "CM015", "CM016"]
    tableRefs: ["TM002"]
    figureRefs: ["FM001"]
  - id: "buyers-users-and-budgets"
    title: "Buyers, users, payers, and adoption paths"
    body: >-
      Consumer adoption starts with an individual or household paying a recurring subscription to
      reduce unwanted exposure, calls, and account-level data leakage. The product's individual,
      couple, and family packaging makes the household the practical budget owner, while the end
      users experience aliases, removals, and alerts. Enterprise adoption is structurally different:
      the employer pays, employees receive protection, and a CISO or security team evaluates
      workforce exposure and aggregate risk. Public evidence establishes the enterprise use case but
      not pricing, contract value, procurement duration, renewal behavior, or budget classification.
      That makes the enterprise segment strategically relevant but not yet quantifiable as a
      serviceable revenue pool.
    claimRefs: ["CM004", "CM005", "CM007", "CM008"]
    tableRefs: ["TM003"]
  - id: "drivers-and-constraints"
    title: "Adoption drivers, constraints, and valuation relevance"
    body: >-
      Demand is supported by fragmented point solutions, persistent data-broker exposure, and the
      appeal of preventing disclosure before responding to misuse. Independent testing supplies a
      tangible outcome: one reviewer reported 40 exposures removed in 16 days, although 22 broker
      sites remained in progress. Adoption is constrained by workflow friction and category
      mismatch. The same review found no custom-removal service and reported that many automation
      packs required confirmations or CAPTCHAs while the app remained open. Buyers seeking credit or
      financial-account monitoring may instead prefer a broader identity suite. For valuation, the
      category can support subscription and enterprise expansion narratives, but absent independent
      market sizing, segment mix, retention, and willingness-to-pay evidence, operating counters
      should not be converted into revenue or market-share assumptions.
    claimRefs: ["CM001", "CM003", "CM009", "CM010", "CM011", "CM012", "CM013"]
