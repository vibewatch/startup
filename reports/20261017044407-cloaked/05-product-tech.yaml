    title: Product module and maturity matrix
    columns:
      - Module
      - Primary user
      - Public status or maturity
      - Differentiation
      - Diligence gap
    rows:
      - [Masked email and phone identities, Consumer or employee, Live across current product surfaces, Per-context contact compartmentalization, Routing uptime and alias acceptance rates]
      - [Data removal, Consumer or employee, Live paid workflow with gradual removals, Combines remediation with future-use aliases, Reconciled broker universe and verified removal persistence]
      - [Call Guard, Consumer, Live but externally reported outcomes are mixed, Screens unwanted calls before user interaction, False-positive and spam-reduction telemetry by carrier]
      - [Dark-web and SSN alerts, Consumer, Live company-claimed feature, Monitoring bundled with prevention and remediation, Monitored-field coverage and alert precision]
      - [VPN and password management, Consumer, Listed as included supporting tools, Consolidates several privacy utilities, Technical specifications and comparative performance]
      - [Cloaked Pay, Consumer, Beta or invite-only, Extends masking to payment credentials, General availability date and issuer or network dependencies]
    notes: >-
      Status reflects assigned public sources accessed 2026-10-17; company claims are not
      treated as independent performance verification, and unavailable operating metrics are
      stated as diligence gaps.
    claimRefs: [CE001, CE003, CE005, CE009, CE010, CE016]
  - id: TE002
    title: Workflow and use-case assessment
    columns:
      - User job
      - Existing exposure or workflow
      - Cloaked intervention
      - Public evidence of benefit
      - Limitation
    rows:
      - [Create an online account, Share a reusable real email or phone number, Generate a dedicated alias and inbox, Current product and App Store descriptions confirm the workflow, Some services may reject VoIP numbers]
      - [Reduce existing broker exposure, Submit opt-outs separately and monitor reappearance, Send removals and repeat requests during a paid subscription, Review reports takedowns generally begin in about 14 business days, Coverage denominator is inconsistent across public surfaces]
      - [Reduce unwanted calls, Receive and manually screen unknown calls, Call Guard screens suspected spam and scams, Public testimonials and reviews report both positive and negative outcomes, No carrier-level efficacy or false-positive data]
      - [Protect employee contact data, Leave personal details exposed across broker and open-web sources, Mask contact details and reduce exposed inputs, Enterprise page explains the social-engineering threat model, No public deployment case or enterprise reliability evidence in the pool]
    notes: >-
      Benefits are limited to what the cited public sources describe; no controlled outcome
      study, common baseline, or independently measured performance series was available.
    claimRefs: [CE002, CE004, CE006, CE007, CE010, CE013, CE016]
  - id: TE003
    title: Technology and operating architecture
    columns:
      - Layer or process
      - Publicly supported role
      - Key dependency
      - Principal technical risk
    rows:
      - [Client surfaces, Web dashboard browser extensions and mobile apps provide access, App stores browsers and client compatibility, Version fragmentation and unsupported environments]
      - [Identity abstraction, Generates and manages email phone password and TOTP identities, Communications routing and credential storage, Service interruption or rejected virtual numbers]
      - [Exposure remediation, Scans sources and sends removal or repeat-removal requests, Broker cooperation identity verification and ongoing subscription, Slow incomplete or reversible removals]
      - [Active detection and filtering, Screens calls and monitors dark-web or SSN signals, Detection feeds carrier behavior and alert quality, False positives missed threats and unclear coverage]
      - [Data protection and assurance, Reported client-side encryption zero-knowledge access and isolated databases, Correct implementation key management and audit scope, No direct technical dossier or audit report in assigned evidence]
    notes: >-
      This is an evidence-bounded operating model, not a reverse-engineered software
      architecture; control implementation and assurance scope remain unverified.
    claimRefs: [CE006, CE007, CE011, CE012, CE016]
figures:
  - id: FE001
    title: Evidence-bounded product architecture map
    type: stack
    summary: >-
      The stack separates customer-facing surfaces, privacy operations, and support controls
      while marking the payment layer as not yet generally available.
    data:
      layers:
        - label: Customer access
          modules: [Web dashboard, Browser extensions, iOS app, Android app]
          detail: Public distribution surfaces
        - label: Identity abstraction
          modules: [Masked email, Masked phone, Passwords, TOTP codes]
          detail: Per-context credentials and communications
        - label: Active defense
          modules: [Call Guard, Dark-web alerts, SSN alerts]
          detail: Detection and call screening
        - label: Exposure remediation
          modules: [Broker scanning, Removal requests, Repeat removals]
          detail: Ongoing paid operational workflow
        - label: Recovery and support
          modules: [Identity-theft insurance, Restoration support]
          detail: Post-incident assistance subject to terms
        - label: Payment masking roadmap
          modules: [Cloaked Pay]
          detail: Beta or invite-only in current evidence
    approximationNotes: >-
      Layer order is analytical and does not assert the company's internal implementation;
      the map includes only components named in assigned sources.
    claimRefs: [CE002, CE005, CE006, CE007, CE011, CE016]
callouts:
  - calloutType: insight
    title: Prevention is the clearest product thesis
    body: >-
      Alias-based compartmentalization can reduce the link between a future merchant breach
      and a user's underlying contact identity, a distinct workflow from removing records
      that are already exposed.
    claimRefs: [CE002, CE013]
  - calloutType: risk
    title: Public product metrics are not reconciled
    body: >-
      Current public surfaces cite 1,000+, 140+, and over 120 covered sources without a common
      definition, while no independent removal-success or persistence series is available.
    claimRefs: [CE003, CE004]
