schemaVersion: "report-v2"
artifact: product-tech
slug: cloaked
runDate: 2026-10-17
company:
  name: Cloaked
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Cloaked has assembled a broad consumer-privacy workflow around identity aliases, data
    removal, call screening, monitoring, insurance, and credential tools, with distribution
    across mobile, browser, and web surfaces. The public record is materially thinner on
    architecture, control testing, reliability, integration performance, and feature-level
    maturity; Cloaked Pay remains beta or invite-only, and even current broker-coverage
    claims are inconsistent across company-controlled surfaces.
sections:
  - id: product-workflow
    title: Product surfaces and customer workflow
    body: >-
      The product is best understood as a privacy workflow rather than a single point tool.
      A user can replace a real email address or phone number with a Cloaked identity, receive
      communications in dedicated inboxes, ask the service to remove already-exposed records,
      screen unwanted calls, monitor breach signals, and use supporting VPN, password, and
      insurance features. That breadth is visible on current company surfaces and is also
      acknowledged by a competitor review, but breadth should not be mistaken for equal depth
      across modules. The enterprise surface applies the same prevention logic to employee
      contact data as an input to social-engineering risk. Public materials describe the
      workflow clearly, while providing little outcome evidence that isolates the incremental
      benefit of each module.
    claimRefs: [CE001, CE002, CE003, CE009, CE013]
    tableRefs: [TE001, TE002]
  - id: operating-architecture
    title: Operating architecture and dependencies
    body: >-
      Public evidence supports a layered operating model: browser, web, and mobile clients sit
      above identity generation and communications routing; broker-removal operations and
      monitoring services address existing exposure; call screening and insurance support
      address ongoing incidents. A favorable affiliate review describes client-side
      encryption, zero-knowledge access, and per-user databases, but the assigned evidence
      contains no first-party technical documentation, cryptographic design, service-level
      objectives, status history, or independent penetration-test report. The architecture
      map therefore distinguishes observed product surfaces from reported controls and does
      not infer implementation details that the public sources do not disclose.
    claimRefs: [CE002, CE006, CE011, CE012]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity-deployment-roadmap
    title: Maturity, deployment, support, and roadmap
    body: >-
      Cloaked says the platform exited beta in October 2023, and current App Store metadata
      shows an actively updated iPhone application. Distribution spans a web dashboard,
      browser extensions, and iOS and Android apps according to a September 2026 review.
      Operationally, data removal is not instantaneous: that review says successful takedowns
      generally begin within about fourteen business days after paid activation, with repeat
      work required when listings return. Product maturity is uneven. Cloaked Pay is still
      described as beta or invite-only, and cancellation can make communications identities
      unusable for calls and texts, increasing switching work for customers who have adopted
      them broadly.
    claimRefs: [CE005, CE006, CE007, CE008, CE014, CE015]
  - id: differentiation-trust-risk
    title: Differentiation, trust, and technical risk
    body: >-
      Cloaked's most distinctive product thesis is preventive compartmentalization: aliases
      can limit how one merchant's leak connects to a user's underlying identity. The same
      model creates dependencies on routing availability, VoIP acceptance, and the customer's
      ability to migrate accounts before cancellation. A competitor-authored comparison
      argues that monitoring and financial-protection depth trail fuller identity-protection
      suites, while an affiliate review flags 911 and verification-service limitations for
      virtual numbers. Publicly repeated certification claims are positive signals, not a
      substitute for current audit reports or control scope. Mixed third-party reports on
      Call Guard and inconsistent broker-count claims make performance telemetry, support
      data, and assurance documents priority diligence items.
    claimRefs: [CE004, CE009, CE010, CE011, CE012, CE016]
tables:
