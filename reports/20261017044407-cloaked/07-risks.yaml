chapter:
  number: 7
  title: "Risks"
  summary: "Cloaked's principal disclosed risks are product-scope gaps, dependence on its alias and telecom infrastructure, and public claim inconsistency rather than a confirmed enforcement or incident record. The investment case should remain conditional on primary legal, insurance, security-assurance, continuity, and operating evidence that the assigned public source pool does not provide."
sections:
  - id: "risk-ranking"
    title: "Risk ranking and decision frame"
    body: >-
      The highest residual exposure is the gap between the breadth implied by an all-in-one privacy
      platform and the narrower protection documented by reviewers. SecurityHero reports no credit
      monitoring, financial-account monitoring, or independently verified dark-web detection, while
      Proton describes verification and call-filtering limitations around phone aliases. Those gaps
      matter because the product handles contact, credential, identity, and payment-adjacent workflows:
      a failure can interrupt access as well as reduce protection. The ranking below therefore treats
      unsupported assurance as uncertainty, not as proof of a breach or violation. High-severity risks
      require contractual, technical, or operating evidence before investment; medium risks require
      monitorable remediation milestones and owner-level accountability.
    claimRefs: ["CR001", "CR002", "CR003", "CR004", "CR011", "CR014"]
    tableRefs: ["TR002"]
  - id: "regulatory-legal-assurance"
    title: "Regulatory, legal, and assurance exposure"
    body: >-
      The public evidence establishes explicit boundaries but not a complete compliance posture.
      Cloaked's feature page limits availability to the United States and Canada and states that the
      services must not be used for FCRA purposes. Public descriptions of data-removal coverage also
      diverge materially: the company advertises more than 1,000 people-search sites and brokers,
      Proton reports more than 400 brokers, and Batten reports more than 140. These may reflect
      different definitions, products, or vintages, but the denominator is not reconciled. Insurance
      language also varies by consumer and enterprise context. None of those discrepancies proves
      non-compliance; together they make claim substantiation, policy scope, and current assurance
      documentation gating diligence items.
    claimRefs: ["CR005", "CR009", "CR012", "CR013", "CR015", "CR016"]
    tableRefs: ["TR001"]
  - id: "operational-security-execution"
    title: "Operational, quality, and security execution"
    body: >-
      Phone masking is the clearest operational fault line. Proton says Cloaked uses VoIP numbers that
      may fail SMS verification at finance apps, government portals, and other services, and that
      inactive numbers can be recycled unless locked. Batten separately warns that alias numbers
      cannot place emergency calls. These are workflow constraints, not evidence of a platform-wide
      outage, but they can create support load, failed onboarding, or user lockout if the product is
      treated as a primary line. Product breadth adds execution risk: Cloaked Pay is described as beta
      or invite-only, and independent verification of dark-web detection is not present in the assigned
      evidence. Mitigation maturity should be judged from test results, incident history, and support
      metrics rather than feature-page availability.
    claimRefs: ["CR001", "CR002", "CR003", "CR004", "CR011", "CR014", "CR016"]
  - id: "dependencies-and-kill-criteria"
    title: "Dependencies, monitoring indicators, and thesis-break triggers"
    body: >-
      Cloaked's value proposition creates a concentrated dependency: aliases used across many accounts
      remain tied to Cloaked's infrastructure, so a shutdown, prolonged outage, loss of number inventory,
      or abrupt pricing change can force users to update external accounts. Enterprise positioning also
      depends on telecom acceptance, data-broker response, and insurance partners whose performance is
      not controlled solely by Cloaked. The thesis should break if verified removal coverage remains
      irreconcilable, critical workflows repeatedly reject aliases, portability and continuity testing
      cannot meet contractual recovery objectives, material security findings remain open past agreed
      deadlines, or policy documents do not support marketed insurance and compliance boundaries.
      Monthly monitoring should track alias-delivery success, verification rejection, removal aging,
      incident severity, support backlog, partner concentration, and policy exceptions.
    claimRefs: ["CR006", "CR007", "CR008", "CR010", "CR012", "CR013", "CR015"]
    tableRefs: ["TR003"]
    figureRefs: ["FR001"]
