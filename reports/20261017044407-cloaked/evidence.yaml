evidenceGaps:
  - type: missing-source
    severity: material
    topic: capital-disclosure
    missingEvidence: >-
      Current valuation, 2026 financing split between equity and any growth capital, debt/credit facilities, and
      liquidation preference details.
    whyItMatters: Without current capital-structure data, the chapter cannot judge dilution, pricing, or downside protection.
    diligencePath: Request the latest financing deck, cap table, and board-approved term documents.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: leadership-and-governance-disclosure
    missingEvidence: >-
      Current executive biographies, board composition, committee structure, and any material leadership changes since
      launch.
    whyItMatters: >-
      The leadership table can name the founder-executives, but it cannot test management depth or independent oversight
      from the assigned pool alone.
    diligencePath: >-
      Request an org chart, board list, director bios, and any governance presentations used in fundraising or customer
      diligence.
    relatedQuestionRefs:
      - QO003
      - QO008
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: operating-metrics
    missingEvidence: Current revenue, ARR, gross margin, cash burn, paying-customer count, enterprise customer count, and headcount.
    whyItMatters: Activity metrics and app reviews do not establish monetization quality, efficiency, or current scale.
    diligencePath: Request a KPI pack with revenue, cohort, retention, and org-size history through the current quarter.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: milestone-coverage
    missingEvidence: Additional dated milestones for financing, partnerships, regulatory events, and leadership changes.
    whyItMatters: >-
      The assigned pool supports a usable but thin timeline, leaving the milestone chronology less complete than the
      chapter quality bar targets.
    diligencePath: >-
      Add dated financing, governance, and adverse-event materials to a future refresh pool before redrafting the
      timeline.
    relatedQuestionRefs:
      - QO007
  - type: missing-source
    severity: material
    topic: market-sizing-gap
    missingEvidence: An independent market estimate with explicit category boundary, geography, period, value, CAGR, and methodology.
    whyItMatters: >-
      Without a compatible estimate, monetary TAM, SAM, SOM, market share, and valuation-growth assumptions would be
      speculative.
    diligencePath: >-
      Commission or obtain analyst and industry datasets, reconcile their included spend to the boundary in TM001, and
      document every transformation.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: enterprise-segment
    missingEvidence: >-
      Enterprise customer count, seats, ACV, pipeline conversion, procurement duration, renewals, and verified budget
      ownership.
    whyItMatters: >-
      The enterprise adjacency cannot be translated into a serviceable revenue pool or adoption curve without commercial
      evidence.
    diligencePath: >-
      Request the enterprise pipeline and contract cohort, interview reference CISOs, and reconcile signed contracts to
      billing and renewal records.
    relatedQuestionRefs:
      - QM003
      - QM004
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: segment-economics
    missingEvidence: >-
      Paying-customer mix by geography and plan, retention cohorts, customer acquisition cost, willingness to pay, and
      household-versus-enterprise revenue mix.
    whyItMatters: >-
      Public operating counters cannot establish penetration, durable demand, or the valuation-relevant serviceable
      market.
    diligencePath: >-
      Obtain anonymized billing and cohort exports by plan and country, then tie customer counts to revenue and renewal
      behavior.
    relatedQuestionRefs:
      - QM008
      - QM009
    relatedTableRefs:
      - TM002
      - TM003
  - type: private-evidence-only
    severity: material
    topic: competitor-scale
    missingEvidence: >-
      Comparable customer counts, revenue scale, funding, retention, and enterprise contract values for Cloaked and its
      principal competitors.
    whyItMatters: >-
