schemaVersion: "report-v2"
artifact: customers
slug: cloaked
runDate: 2026-10-17
company:
  name: Cloaked
chapter:
  number: 6
  title: Customers
  summary: >-
    Cloaked's current Startup Jobs-syndicated job copy claims more than 600,000
    paying members, while its consumer site publishes large cumulative usage
    totals and testimonials describing less spam and data exposure. The public
    record still does not establish retention, cohort durability, named
    enterprise deployments, contract economics, or customer concentration.
sections:
  - id: customer-segments-and-buyers
    title: Customer segments and buying logic
    body: >-
      Cloaked serves at least two distinct buying contexts. Consumers and families
      buy a bundled privacy membership for masked contact details, data removal,
      call screening, monitoring, insurance, VPN access, and password management;
      availability is currently framed around the United States and Canada.
      Enterprise messaging instead addresses employers and security teams seeking
      to reduce the exposed personal information attackers can use against
      employees. The independent review evidence suggests that frequent alias use
      is the clearest consumer buying reason, whereas a buyer focused only on data
      removal may prefer a specialist. Public evidence does not disclose segment
      revenue, plan mix, enterprise seat count, or payer-level economics, so the
      relative commercial value of these segments remains unknown.
    claimRefs: [CU007, CU008, CU009, CU010]
    tableRefs: [TU001]
  - id: adoption-scale-and-trajectory
    title: Adoption scale and trajectory
    body: >-
      Current public surfaces indicate substantial use, but the metrics are not a
      comparable cohort or time series. Company-issued recruiting copy says more
      than 600,000 paying members use Cloaked. The official About page separately
      says the community exceeds 400,000 users, while the homepage reports more
      than 19 million accounts masked, 170 million calls screened, and 3.3 billion
      broker records removed. These figures use different units, have no common
      observation period, and do not disclose active-user definitions or unique
      customer denominators. They therefore demonstrate claimed operating scale,
      not independently verified customer growth, retention, or per-member
      engagement.
    claimRefs: [CU001, CU002, CU003, CU004, CU005]
    tableRefs: [TU002]
  - id: proof-quality-and-durability
    title: Customer proof, outcomes, and durability
    body: >-
      The strongest named public proof in the assigned evidence consists of
      consumer testimonials selected for Cloaked's homepage. Those testimonials
      describe fewer spam calls, removal of exposed information, and reduced
      stress, but they do not provide deployment dates, baseline measurements, or
      independently audited outcomes. Third-party reviewers report similar themes:
      aliases and spam reduction are common positives, while removal can take
      weeks, records may reappear, and some services reject VoIP numbers. This is
      useful product-fit evidence but not a retention dataset. No reviewed source
      discloses NRR, GRR, churn, renewal rates, contract length, cohort curves,
      satisfaction methodology, or support-resolution performance.
    claimRefs: [CU006, CU010, CU011, CU012, CU014, CU015, CU016]
    tableRefs: [TU003]
  - id: expansion-and-concentration
    title: Expansion paths and concentration risk
    body: >-
      Cloaked's apparent expansion path runs from a consumer's first exposure scan
      or alias through broader use of removal, call screening, monitoring, and
      family coverage; the company is also positioning an enterprise product
      around employee privacy as a security control. That creates plausible
      cross-sell and B2B expansion surfaces, but the evidence does not show actual
      conversion rates, enterprise production deployments, procurement duration,
      annual contract value, or renewals. Cancellation may also create switching
      friction because a reviewed source reports that calls and texts through
      existing identities stop after cancellation. Without customer-level revenue
      or contract disclosure, top-customer, channel, and partner concentration
      cannot be quantified and should remain explicit diligence items.
    claimRefs: [CU007, CU008, CU013, CU016]
    figureRefs: [FU001]
