  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surfaces and customer workflow
        blocks:
          - type: paragraph
            body: >-
              The product is best understood as a privacy workflow rather than a single point tool. A user can replace a
              real email address or phone number with a Cloaked identity, receive communications in dedicated inboxes,
              ask the service to remove already-exposed records, screen unwanted calls, monitor breach signals, and use
              supporting VPN, password, and insurance features. That breadth is visible on current company surfaces and
              is also acknowledged by a competitor review, but breadth should not be mistaken for equal depth across
              modules. The enterprise surface applies the same prevention logic to employee contact data as an input to
              social-engineering risk. Public materials describe the workflow clearly, while providing little outcome
              evidence that isolates the incremental benefit of each module.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE009
              - CE013
          - type: table
            tableRef: TE001
            claimRefs:
