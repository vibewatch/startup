      - number: '3.2'
        title: Capability, verification, and trust posture
        blocks:
          - type: paragraph
            body: >-
              Cloaked's strongest visible advantage is prevention plus remediation in one product: masked contact
              details reduce new exposure while removal and monitoring address existing exposure. The assigned
              comparisons nevertheless expose a trust gap around the removal module. Security.org says its Cloaked
              assessment relied on published claims rather than a parallel hands-on test and found no independent
              removal audit; Optery, a direct competitor, likewise emphasizes screenshot-based proof that it says
              Cloaked lacks. Those observations should not be mistaken for neutral proof of Optery's superiority, but
              they identify a diligence issue that Cloaked's own feature breadth does not resolve. All About Cookies
              adds hands-on adverse evidence: it reported mobile glitches and no custom removals, while also crediting
              Cloaked with broad site coverage and privacy-specific certifications.
            claimRefs:
              - CP001
              - CP002
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP002
            claimRefs:
