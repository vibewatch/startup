  - id: FM001
    title: Evidence-constrained addressable-market layers
    type: pyramid
    summary: >-
      The pyramid narrows from the broad problem to Cloaked's observed foothold without converting operating metrics
      into a monetary TAM.
    data:
      items:
        - label: Broad privacy and online-safety need
          value: Not monetarily sized
          detail: Fragmented point tools and persistent personal-data exposure establish the problem, not a revenue pool.
        - label: Bundled consumer privacy and identity safety
          value: Not monetarily sized
          detail: Aliases, removals, monitoring, VPN, password management, and recovery support define the relevant bundle.
        - label: Currently supported consumer geography
          value: United States and Canada
          detail: No country-level user mix or independent spending estimate is available.
        - label: Paid household packaging
          value: Individual, couple, and family
          detail: Family coverage extends to four people in the independent review.
        - label: Enterprise employee-protection adjacency
          value: New rollout; no public ACV
          detail: Employer-paid workforce privacy is a separate buying motion from consumer subscriptions.
        - label: Observed company foothold
          value: More than 350,000 paying customers
          detail: Company statement reported by TechCrunch on 2026-03-19; not independently audited.
    approximationNotes: >-
      Qualitative layers are ordered by narrowing scope; widths do not encode value, and only the final layer contains a
      supported customer count.
