      - number: '2.3'
        title: Buyers, users, payers, and adoption paths
        blocks:
          - type: paragraph
            body: >-
              Consumer adoption starts with an individual or household paying a recurring subscription to reduce
              unwanted exposure, calls, and account-level data leakage. The product's individual, couple, and family
              packaging makes the household the practical budget owner, while the end users experience aliases,
              removals, and alerts. Enterprise adoption is structurally different: the employer pays, employees receive
              protection, and a CISO or security team evaluates workforce exposure and aggregate risk. Public evidence
              establishes the enterprise use case but not pricing, contract value, procurement duration, renewal
              behavior, or budget classification. That makes the enterprise segment strategically relevant but not yet
              quantifiable as a serviceable revenue pool.
            claimRefs:
              - CM004
              - CM005
              - CM007
              - CM008
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM010
              - CM012
      - number: '2.4'
        title: Adoption drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Demand is supported by fragmented point solutions, persistent data-broker exposure, and the appeal of
              preventing disclosure before responding to misuse. Independent testing supplies a tangible outcome: one
              reviewer reported 40 exposures removed in 16 days, although 22 broker sites remained in progress. Adoption
              is constrained by workflow friction and category mismatch. The same review found no custom-removal service
              and reported that many automation packs required confirmations or CAPTCHAs while the app remained open.
              Buyers seeking credit or financial-account monitoring may instead prefer a broader identity suite. For
              valuation, the category can support subscription and enterprise expansion narratives, but absent
              independent market sizing, segment mix, retention, and willingness-to-pay evidence, operating counters
              should not be converted into revenue or market-share assumptions.
            claimRefs:
              - CM001
              - CM003
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
