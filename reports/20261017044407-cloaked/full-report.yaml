    columns:
      - Scenario
      - Explicit assumptions
      - Valuation / return logic
      - Probability signal
      - Key risks and downside triggers
    rows:
      - - Bull
        - >-
          Paying-member growth converts to strong retention; enterprise expansion adds durable recurring revenue;
          margins scale.
        - >-
          No defensible public range; underwrite only after verified ARR, margins, ownership, and terms support the
          target return.
        - Company reports 600k+ paying members and substantial activity metrics.
        - Reject if cohorts, enterprise renewals, or contribution margins do not validate the scale narrative.
      - - Base
        - Financing funds continued execution, but growth capital and equity economics remain mixed or uncertain.
        - Hold valuation stance at unknown until the capital split, post-money price, burn, and runway are disclosed.
        - Independent outlets corroborate the financing, while core financial disclosures remain absent.
        - Pause if financing covenants, preferences, or acquisition payback materially impair common-equity returns.
      - - Bear
        - >-
          Acquisition spending fails to create durable retention; product constraints or cancellation friction weaken
          conversion.
        - >-
          Downside cannot be quantified without cap-table and financial data; protect against a down round and
          preference overhang.
        - Independent review identifies service limitations and switching consequences.
        - >-
          Stop if retention deteriorates, metrics cannot reconcile to billings, or new financing subordinates incoming
          equity.
    notes: >-
      Scenarios are evidence-gated frameworks rather than forecasts; no probability percentages or valuation amounts are
      assigned because the required financial and transaction inputs are absent.
