      - number: '4.2'
        title: Public traction and revenue quality
        blocks:
          - type: paragraph
            body: >-
              Cloaked says it has more than 400,000 users and reports substantial cumulative activity: more than 170
              million calls screened, 19 million accounts masked, and 3.3 billion records removed. Those counters
              indicate product usage, but they are not revenue, ARR, paid subscribers, or current-period volume, and the
              sources do not provide denominators or cohort dates. Coverage quality also needs reconciliation. Cloaked
              markets removal from more than 1,000 sites, while Security.org says only 350-plus are data brokers or
              people-search sites and the balance are general company or retailer sites; it also notes the coverage has
              not been independently audited. The counters therefore support adoption signals, not durable revenue
              quality.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
      - number: '4.3'
        title: Cost structure and unit-economics gaps
        blocks:
          - type: paragraph
            body: >-
              The bundle requires more than static software access: call screening, account masking, recurring
              broker-site removal, monitoring, and an enterprise exposure-control motion all imply ongoing service and
              infrastructure work. Public activity volumes do not disclose the unit cost of those obligations, the share
              handled automatically, insurance economics, communications charges, support labor, or broker-removal
              exception handling. The assigned evidence contains no gross margin, CAC, payback period, churn, retention,
              net revenue retention, contribution margin, or realized price data. As a result, neither the scaling
              advantage of the software components nor the potential margin drag from service-intensive components can
              be quantified. The diligence package should separate consumer and enterprise cohorts and reconcile every
              operating metric to billings and recognized revenue.
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
              - CI016
          - type: table
            tableRef: TI003
            claimRefs:
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.4'
        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >-
              Third-party sources agree that Cloaked completed a large 2026 financing, but not on a clean underwriting
              denominator. Venture Capital Tracker describes $375 million of mixed equity/growth funding in March 2026,
              reports $375 million of total disclosed equity funding, and says the valuation is not public. Tracxn
              instead reports $404 million of total funding across three rounds. These figures may reflect different
              dates, instruments, or inclusion rules; funding raised must not be treated as cash on hand or runway. With
              no cash balance, burn, debt terms, preference stack, committed uses, or next-round trigger in the assigned
              sources, capital adequacy remains unknown. The financial verdict is therefore research-more: visible
              monetization and usage are encouraging, but revenue quality, margin path, and financing dependency cannot
              yet be underwritten.
            claimRefs:
              - CI013
              - CI014
              - CI015
              - CI016
