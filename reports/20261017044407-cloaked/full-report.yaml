  - id: FU001
    title: Customer adoption and expansion journey
    type: journey-map
    summary: >-
      The public customer journey has several plausible expansion surfaces, but conversion and durability remain
      unreported.
    data:
      nodes:
        - label: Exposure discovery
          detail: A consumer or employer identifies exposed personal information, spam, scams, or impersonation risk.
          touchpoints:
            - Free safety scan
            - Employer risk assessment
        - label: Initial protection
          detail: The user adopts masked email or phone identities; reviews identify aliases as the clearest buying reason.
          touchpoints:
            - Consumer app
            - Browser and mobile workflows
        - label: Bundle activation
          detail: >-
            The account adds removal, call screening, monitoring, passwords, VPN access, or insurance-supported
            recovery.
          touchpoints:
            - Privacy dashboard
            - Call Guard
            - Data removal
        - label: Household expansion
          detail: A payer may extend coverage to a couple or family, but attach rates and member activation are not disclosed.
          touchpoints:
            - Couple plan
            - Family plan
        - label: Enterprise expansion
          detail: >-
            Employers are offered employee-privacy protection, but named production deployments and contract metrics are
            absent.
          touchpoints:
            - Enterprise security buyer
            - Employee users
        - label: Renewal or exit
          detail: >-
            Durability is unmeasured; cancellation can require migration because calls and texts through identities
            reportedly stop.
          touchpoints:
            - Renewal decision
            - Identity migration
    approximationNotes: >-
      The stages are an evidence-based operating journey, not a measured funnel; no conversion rate, stage population,
      or common time basis is available.
    claimRefs:
      - CU008
      - CU010
      - CU011
      - CU013
