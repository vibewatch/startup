      - number: '5.2'
        title: Operating architecture and dependencies
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a layered operating model: browser, web, and mobile clients sit above identity
              generation and communications routing; broker-removal operations and monitoring services address existing
              exposure; call screening and insurance support address ongoing incidents. A favorable affiliate review
              describes client-side encryption, zero-knowledge access, and per-user databases, but the assigned evidence
              contains no first-party technical documentation, cryptographic design, service-level objectives, status
              history, or independent penetration-test report. The architecture map therefore distinguishes observed
              product surfaces from reported controls and does not infer implementation details that the public sources
              do not disclose.
            claimRefs:
              - CE002
              - CE006
