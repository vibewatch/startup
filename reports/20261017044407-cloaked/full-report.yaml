        title: Exhibits
        blocks:
          - type: callout
            title: Breadth is the clearest differentiation
            body: >-
              Cloaked combines preventive aliases with removal and protection modules in one subscription, a scope that
              dedicated removal vendors do not reproduce.
            calloutType: strength
            claimRefs:
