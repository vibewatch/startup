chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and product scope
        blocks:
          - type: paragraph
            body: >-
              Cloaked's own current materials describe the company as a privacy-first identity management system rather
              than a single-point data-removal utility. The product stack now combines masked identities, data-removal
              workflows, call protection, password management, monitoring, and private-payment functionality, with the
              current public surfaces still marking Cloaked Pay as limited access or beta rather than broad GA. The
              onboarding guide also shows that the product is meant to work across mobile, web, browser-extension, and
              Mac contexts, which matters because the value proposition is ongoing identity-layer replacement rather
              than one-time cleanup. The enterprise site extends the same logic into workforce protection by positioning
              exposed employee identity data as reconnaissance material that can enable impersonation and unauthorized
              account access.
