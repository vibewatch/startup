  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Public operating and financing signals narrow to research-more because price, economics, and capital terms remain
      unverified.
    data:
      nodes:
        - id: operating-proof
          label: Operating proof
          detail: Company reports member and activity scale.
        - id: financing-capacity
          label: Financing capacity
          detail: Independent outlets report a $375M Series B and growth-financing package.
        - id: capital-terms
          label: Capital terms
          detail: Valuation and the equity-versus-growth-capital split are undisclosed.
        - id: economic-proof
          label: Economic proof
          detail: ARR, margins, burn, runway, retention, and acquisition efficiency are unavailable.
        - id: downside-test
          label: Downside test
          detail: Product constraints, cancellation friction, and preference overhang require diligence.
        - id: recommendation
          label: Research more
          detail: Set price and return targets only after the evidence gaps close.
      edges:
        - from: operating-proof
          to: financing-capacity
        - from: financing-capacity
          to: capital-terms
        - from: capital-terms
          to: economic-proof
        - from: economic-proof
          to: downside-test
        - from: downside-test
          to: recommendation
    approximationNotes: The sequence is analytical and does not imply value-proportional node sizes or conversion rates.
    claimRefs:
      - CV001
      - CV003
      - CV009
      - CV011
      - CV015
      - CV016
