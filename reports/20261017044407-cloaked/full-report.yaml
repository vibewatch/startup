      - CU016
  - id: FR001
    title: Residual risk heatmap
    type: matrix
    summary: >-
      Public-evidence ranking highlights coverage reconciliation, alias continuity, telecom acceptance, and insurance
      substantiation as the highest residual diligence risks.
    data:
      columns:
        - label: Likelihood
          detail: Observed constraint or evidence-based probability category
        - label: Impact
          detail: Potential effect on users, claims, operations, or investment thesis
        - label: Mitigation maturity
          detail: Maturity visible in the assigned public evidence
        - label: Residual severity
          detail: Risk remaining before private diligence
      rows:
        - label: Broker-coverage claim reconciliation
          note: Public counts use unreconciled definitions and vintages.
          values:
            - label: High
            - label: High
            - label: Low
            - label: High
        - label: Alias infrastructure continuity
          note: Switching work grows with every account tied to an alias.
          values:
            - label: Medium
            - label: High
            - label: Unknown
            - label: High
        - label: VoIP and verification acceptance
          note: Reviewer evidence identifies bank, government, and platform restrictions.
          values:
            - label: High
            - label: High
            - label: Partial
            - label: High
        - label: Emergency-call misuse
          note: Relevant when an alias is treated as a primary line.
          values:
            - label: High if misused
            - label: High
            - label: Basic
            - label: High
        - label: Insurance scope substantiation
          note: Consumer and enterprise coverage need policy-level reconciliation.
          values:
            - label: Medium
            - label: High
            - label: Unknown
            - label: High
        - label: Monitoring and feature-depth gap
          note: Credit, financial-account, and independently tested detection coverage is limited or unverified.
          values:
            - label: High
            - label: Medium
            - label: Developing
            - label: Medium-High
