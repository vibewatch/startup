              - CE007
              - CE011
              - CE016
      - number: '5.3'
        title: Maturity, deployment, support, and roadmap
        blocks:
          - type: paragraph
            body: >-
              Cloaked says the platform exited beta in October 2023, and current App Store metadata shows an actively
              updated iPhone application. Distribution spans a web dashboard, browser extensions, and iOS and Android
              apps according to a September 2026 review. Operationally, data removal is not instantaneous: that review
              says successful takedowns generally begin within about fourteen business days after paid activation, with
              repeat work required when listings return. Product maturity is uneven. Cloaked Pay is still described as
              beta or invite-only, and cancellation can make communications identities unusable for calls and texts,
              increasing switching work for customers who have adopted them broadly.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE014
              - CE015
      - number: '5.4'
        title: Differentiation, trust, and technical risk
        blocks:
          - type: paragraph
            body: >-
              Cloaked's most distinctive product thesis is preventive compartmentalization: aliases can limit how one
              merchant's leak connects to a user's underlying identity. The same model creates dependencies on routing
              availability, VoIP acceptance, and the customer's ability to migrate accounts before cancellation. A
              competitor-authored comparison argues that monitoring and financial-protection depth trail fuller
              identity-protection suites, while an affiliate review flags 911 and verification-service limitations for
              virtual numbers. Publicly repeated certification claims are positive signals, not a substitute for current
              audit reports or control scope. Mixed third-party reports on Call Guard and inconsistent broker-count
              claims make performance telemetry, support data, and assurance documents priority diligence items.
            claimRefs:
              - CE004
              - CE009
              - CE010
              - CE011
              - CE012
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Prevention is the clearest product thesis
            body: >-
              Alias-based compartmentalization can reduce the link between a future merchant breach and a user's
              underlying contact identity, a distinct workflow from removing records that are already exposed.
            calloutType: insight
            claimRefs:
              - CE002
              - CE013
          - type: callout
            title: Public product metrics are not reconciled
            body: >-
              Current public surfaces cite 1,000+, 140+, and over 120 covered sources without a common definition, while
              no independent removal-success or persistence series is available.
            calloutType: risk
            claimRefs:
              - CE003
              - CE004
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and buying logic
        blocks:
          - type: paragraph
            body: >-
              Cloaked serves at least two distinct buying contexts. Consumers and families buy a bundled privacy
              membership for masked contact details, data removal, call screening, monitoring, insurance, VPN access,
              and password management; availability is currently framed around the United States and Canada. Enterprise
              messaging instead addresses employers and security teams seeking to reduce the exposed personal
              information attackers can use against employees. The independent review evidence suggests that frequent
              alias use is the clearest consumer buying reason, whereas a buyer focused only on data removal may prefer
              a specialist. Public evidence does not disclose segment revenue, plan mix, enterprise seat count, or
              payer-level economics, so the relative commercial value of these segments remains unknown.
            claimRefs:
              - CU007
              - CU008
              - CU009
              - CU010
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU007
              - CU008
              - CU009
              - CU010
              - CU016
      - number: '6.2'
        title: Adoption scale and trajectory
        blocks:
          - type: paragraph
            body: >-
              Current public surfaces indicate substantial use, but the metrics are not a comparable cohort or time
              series. Company-issued recruiting copy says more than 600,000 paying members use Cloaked. The official
              About page separately says the community exceeds 400,000 users, while the homepage reports more than 19
              million accounts masked, 170 million calls screened, and 3.3 billion broker records removed. These figures
              use different units, have no common observation period, and do not disclose active-user definitions or
              unique customer denominators. They therefore demonstrate claimed operating scale, not independently
              verified customer growth, retention, or per-member engagement.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
      - number: '6.3'
        title: Customer proof, outcomes, and durability
        blocks:
          - type: paragraph
            body: >-
              The strongest named public proof in the assigned evidence consists of consumer testimonials selected for
              Cloaked's homepage. Those testimonials describe fewer spam calls, removal of exposed information, and
              reduced stress, but they do not provide deployment dates, baseline measurements, or independently audited
              outcomes. Third-party reviewers report similar themes: aliases and spam reduction are common positives,
              while removal can take weeks, records may reappear, and some services reject VoIP numbers. This is useful
              product-fit evidence but not a retention dataset. No reviewed source discloses NRR, GRR, churn, renewal
              rates, contract length, cohort curves, satisfaction methodology, or support-resolution performance.
            claimRefs:
              - CU006
              - CU010
              - CU011
              - CU012
              - CU014
              - CU015
              - CU016
          - type: table
            tableRef: TU003
            claimRefs:
              - CU006
              - CU015
      - number: '6.4'
        title: Expansion paths and concentration risk
        blocks:
          - type: paragraph
            body: >-
              Cloaked's apparent expansion path runs from a consumer's first exposure scan or alias through broader use
              of removal, call screening, monitoring, and family coverage; the company is also positioning an enterprise
              product around employee privacy as a security control. That creates plausible cross-sell and B2B expansion
              surfaces, but the evidence does not show actual conversion rates, enterprise production deployments,
              procurement duration, annual contract value, or renewals. Cancellation may also create switching friction
              because a reviewed source reports that calls and texts through existing identities stop after
              cancellation. Without customer-level revenue or contract disclosure, top-customer, channel, and partner
              concentration cannot be quantified and should remain explicit diligence items.
            claimRefs:
              - CU007
              - CU008
              - CU013
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU008
              - CU010
              - CU011
              - CU013
              - CU014
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Paid-scale claim is material but self-reported
            body: >-
              Current Startup Jobs-syndicated recruiting copy claims 600,000+ paying members. This is stronger than a
              generic user-registration figure, but the source does not define active status, observation date, plan
              mix, or geography.
            calloutType: strength
            claimRefs:
              - CU001
          - type: callout
            title: Public proof stops before retention
            body: >-
              Usage totals and testimonials indicate adoption and perceived outcomes, but no assigned source provides
              retention cohorts, renewals, enterprise contracts, or customer concentration needed to assess durability.
            calloutType: risk
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk ranking and decision frame
        blocks:
          - type: paragraph
            body: >-
              The highest residual exposure is the gap between the breadth implied by an all-in-one privacy platform and
              the narrower protection documented by reviewers. SecurityHero reports no credit monitoring,
              financial-account monitoring, or independently verified dark-web detection, while Proton describes
              verification and call-filtering limitations around phone aliases. Those gaps matter because the product
              handles contact, credential, identity, and payment-adjacent workflows: a failure can interrupt access as
              well as reduce protection. The ranking below therefore treats unsupported assurance as uncertainty, not as
              proof of a breach or violation. High-severity risks require contractual, technical, or operating evidence
              before investment; medium risks require monitorable remediation milestones and owner-level accountability.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR011
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR011
              - CR014
      - number: '7.2'
        title: Regulatory, legal, and assurance exposure
        blocks:
          - type: paragraph
            body: >-
              The public evidence establishes explicit boundaries but not a complete compliance posture. Cloaked's
              feature page limits availability to the United States and Canada and states that the services must not be
              used for FCRA purposes. Public descriptions of data-removal coverage also diverge materially: the company
              advertises more than 1,000 people-search sites and brokers, Proton reports more than 400 brokers, and
              Batten reports more than 140. These may reflect different definitions, products, or vintages, but the
              denominator is not reconciled. Insurance language also varies by consumer and enterprise context. None of
              those discrepancies proves non-compliance; together they make claim substantiation, policy scope, and
              current assurance documentation gating diligence items.
            claimRefs:
              - CR005
              - CR009
              - CR012
              - CR013
              - CR015
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR005
              - CR009
              - CR012
              - CR013
              - CR015
              - CR016
      - number: '7.3'
        title: Operational, quality, and security execution
        blocks:
          - type: paragraph
            body: >-
              Phone masking is the clearest operational fault line. Proton says Cloaked uses VoIP numbers that may fail
              SMS verification at finance apps, government portals, and other services, and that inactive numbers can be
              recycled unless locked. Batten separately warns that alias numbers cannot place emergency calls. These are
              workflow constraints, not evidence of a platform-wide outage, but they can create support load, failed
              onboarding, or user lockout if the product is treated as a primary line. Product breadth adds execution
              risk: Cloaked Pay is described as beta or invite-only, and independent verification of dark-web detection
              is not present in the assigned evidence. Mitigation maturity should be judged from test results, incident
              history, and support metrics rather than feature-page availability.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR011
              - CR014
              - CR016
      - number: '7.4'
        title: Dependencies, monitoring indicators, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Cloaked's value proposition creates a concentrated dependency: aliases used across many accounts remain
              tied to Cloaked's infrastructure, so a shutdown, prolonged outage, loss of number inventory, or abrupt
              pricing change can force users to update external accounts. Enterprise positioning also depends on telecom
              acceptance, data-broker response, and insurance partners whose performance is not controlled solely by
              Cloaked. The thesis should break if verified removal coverage remains irreconcilable, critical workflows
              repeatedly reject aliases, portability and continuity testing cannot meet contractual recovery objectives,
              material security findings remain open past agreed deadlines, or policy documents do not support marketed
              insurance and compliance boundaries. Monthly monitoring should track alias-delivery success, verification
              rejection, removal aging, incident severity, support backlog, partner concentration, and policy
              exceptions.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR010
              - CR012
              - CR013
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR003
              - CR005
              - CR007
              - CR010
              - CR012
              - CR013
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR010
              - CR012
              - CR015
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Investment kill criteria
            body: >-
              Pause or reject if primary diligence cannot reconcile removal coverage, substantiate insurance and
              security-assurance scope, demonstrate alias portability and recovery objectives, or show that
              critical-workflow rejection and serious security findings remain within agreed thresholds.
            calloutType: risk
            claimRefs:
              - CR002
              - CR005
              - CR010
              - CR012
              - CR013
              - CR015
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Decision and price discipline
        blocks:
          - type: paragraph
            body: >-
              The appropriate public-evidence recommendation is research-more, not buy or pass. Cloaked reports
              substantial usage and activity across paying members, masked accounts, screened calls, and removed
              records, while the latest financing gives the company resources to keep expanding. Those signals support
              continued diligence, but they do not establish revenue quality, retention, margins, or an investable entry
              price. The post-money valuation, equity-versus-growth-capital split, preference stack, and return
              structure remain undisclosed in the retained sources. Any investment decision should therefore be
              conditional on a data-room bridge from operating activity to recurring revenue and on a complete
              capitalization schedule.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV009
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV009
              - CV011
              - CV015
              - CV016
      - number: '8.2'
        title: Financing context without false precision
        blocks:
          - type: paragraph
            body: >-
              SecurityWeek reported a $375 million Series B and growth-financing package and more than $400 million
              raised in total. Tech Funding News separately reported that the valuation and allocation between equity
              and growth capital were not disclosed, while describing General Catalyst's Customer Value Fund as
              acquisition financing intended to reduce equity dilution. FundedIQ records only the $375 million round and
              explicitly excludes undisclosed amounts, which helps explain why public totals differ. Its broad
              information-technology round-size median shows that the financing is unusually large, but it is not a
              comparable-company valuation benchmark and cannot support a post-money estimate.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV007
              - CV009
              - CV011
              - CV012
              - CV014
      - number: '8.3'
        title: Bull, base, and bear underwriting
        blocks:
          - type: paragraph
            body: >-
              The bull case requires the company-reported scale indicators to convert into durable paid retention and
              enterprise expansion at attractive contribution margins. The base case assumes the financing supports
              product and go-to-market execution, but keeps valuation unscored until revenue quality and financing terms
              are verified. The bear case centers on high acquisition spend, weak retention, feature or geography
              constraints, and customer friction when cancelling or migrating aliases. None of the three cases can carry
              a defensible dollar valuation range from the assigned public evidence; each instead defines the evidence
              and downside triggers required before price can be underwritten.
            claimRefs:
              - CV004
              - CV009
              - CV010
              - CV011
              - CV012
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV007
              - CV009
              - CV011
              - CV012
              - CV014
              - CV015
      - number: '8.4'
        title: Exit readiness and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              Cloaked's enterprise positioning creates a plausible second growth vector beyond consumer subscriptions,
              but the retained enterprise page provides neither customer outcomes nor contract economics. Exit readiness
              therefore cannot be assessed from public product breadth or financing size alone. Priority diligence
              should obtain audited revenue and gross-margin history, cohort retention by plan, consumer acquisition
              payback, enterprise bookings and renewals, cash burn, debt or growth-financing covenants, liquidation
              preferences, and the fully diluted capitalization table. Thesis-break triggers are a material down round,
              retention deterioration after acquisition spending, financing covenants that subordinate new equity, or an
              inability to reconcile company-reported member and activity metrics to billings.
            claimRefs:
              - CV003
              - CV004
              - CV007
              - CV013
              - CV015
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Research more; do not price from financing size
            body: >-
              The $375M package is evidence of financing access, not evidence of the post-money valuation, cash
              available, or common-equity return. Require the full transaction and operating data set.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV015
              - CV016
          - type: callout
            title: Public scale metrics do not substitute for economics
            body: >-
              Member and activity metrics use different labels and periods and remain company-issued. Reconcile each
              metric to paid cohorts, billings, retention, and contribution margin.
            calloutType: risk
            claimRefs:
              - CV007
              - CV008
              - CV009
