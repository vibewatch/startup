  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and list pricing
        blocks:
          - type: paragraph
            body: >-
              The clearest monetization is a direct consumer membership sold by covered person. An independent review
              listed Individual, Couple, and Family plans, with monthly or discounted annual billing and the same
              feature bundle across tiers; this makes household size, rather than feature gating, the visible price
              discriminator. The same review describes a free personalized risk report before purchase, no free trial,
