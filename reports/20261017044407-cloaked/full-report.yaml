  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              Buyers can solve the privacy-exposure problem through several materially different routes: Cloaked's
              integrated consumer bundle, dedicated removal vendors such as Incogni and Optery, identity-monitoring
              suites such as Aura, narrower removal specialists such as CrabClear, or manual opt-outs combined with
              separate alias, password, VPN, and monitoring tools. Cloaked's own history and product pages show a
              deliberate expansion from masked identities into removal, scam blocking, monitoring, insurance, and
              payments. That breadth makes the relevant competitive boundary wider than data-removal vendors alone. It
              also means buyer choice turns on whether consolidation is worth more than specialist depth, transparent
              removal evidence, or lower entry pricing. Public scale evidence is thin: Cloaked claims more than 400,000
              users, while comparable funding and customer-scale data for the alternatives are not established by the
              assigned evidence.
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP012
              - CP014
              - CP015
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP008
              - CP010
              - CP012
              - CP014
              - CP015
          - type: figure
            figureRef: FP001
            claimRefs:
