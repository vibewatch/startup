  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The investable market is narrower than cybersecurity as a whole and broader than data-broker removal
              alone. Cloaked bundles two linked jobs: preventing new exposure through masked contact details and
              reducing existing exposure through removals, monitoring, and recovery support. Adjacent functions such as
              VPN, password management, dark-web alerts, scam-call screening, and identity-theft insurance strengthen
              the bundle but should not be counted as wholly incremental addressable spend when buyers already purchase
              them separately. The relevant substitutes are manual opt-outs, browser or carrier controls, standalone
              privacy tools, password managers, and broader identity-protection suites. This boundary avoids counting
              enterprise network security, credit monitoring, antivirus, or the entire identity-theft market as directly
              addressable Cloaked spend.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM006
              - CM010
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
              - CM006
              - CM010
              - CM012
      - number: '2.2'
        title: Sizing without false precision
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence does not contain an independent market estimate with a stated methodology,
              geography, period, and category definition, so a monetary TAM/SAM/SOM would be false precision. The
              defensible sizing lens is therefore a sequence of progressively narrower scopes: a broad privacy problem,
              the bundled consumer category, the currently supported United States and Canada footprint, paid household
              plans, the new enterprise employee-protection motion, and Cloaked's reported foothold. Company-reported
              operating counters demonstrate activity, not market size or recurring revenue. TechCrunch's
              greater-than-350,000 paying customer figure and Cloaked's greater-than-400,000-user community figure also
              use different denominators and should not be merged into one growth series.
            claimRefs:
              - CM004
