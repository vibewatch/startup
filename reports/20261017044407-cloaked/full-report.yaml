              - CP013
              - CP015
      - number: '3.3'
        title: Pricing and packaging pressure
        blocks:
          - type: paragraph
            body: >-
              Published comparisons place Cloaked above removal-only entry plans and above Aura's stated starting price,
              although the products are not like-for-like. Security.org listed Cloaked's annual Individual plan at
              $119.99, versus $95.88 for Incogni, while All About Cookies listed Cloaked from $9.99 per month and Aura
              from $7.00 per month. Optery's own comparison listed a $39 annual Core tier, and CrabClear's review showed
              how removal specialists can compete on geography, cadence, household coverage, or threat-response workflow
              rather than bundle breadth. These are list prices reported by publishers or competitors, not realized
              revenue, retention evidence, or a normalized price per successful removal. Cloaked can defend a premium
              only when buyers value enough of the bundled tools to avoid separate subscriptions and setup.
            claimRefs:
              - CP003
              - CP006
              - CP010
              - CP012
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP006
              - CP010
              - CP012
              - CP014
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Cloaked's moat appears to be integration and distribution across a recurring privacy workflow, not a
              publicly demonstrated technical lead in broker removal. A single household or employer relationship can
              span aliases, removal, call protection, monitoring, passwords, insurance, and emerging payments, which may
              create convenience switching costs and broader engagement than a specialist product. The same breadth
              creates execution risk because focused rivals can undercut price, publish more granular removal evidence,
              or concentrate product resources on one outcome. Multi-homing is also easy in principle: Optery explicitly
              encourages Cloaked users to run its free report alongside Cloaked. Without independent outcome benchmarks,
              enterprise renewal evidence, or disclosed channel economics, breadth should be treated as a promising
              distribution advantage rather than a proven durable moat.
            claimRefs:
              - CP005
              - CP008
              - CP009
              - CP011
              - CP013
              - CP015
              - CP016
