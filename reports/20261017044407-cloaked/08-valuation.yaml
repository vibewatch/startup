      severity: material
      topic: unit-economics
      missingEvidence: >-
        ARR or billings, gross margin, burn, runway, CAC, contribution margin, and retention cohorts
        segmented by consumer plan and enterprise customer.
      whyItMatters: >-
        Activity and member counts cannot establish revenue quality, capital efficiency, or a
        supportable valuation multiple.
      diligencePath: >-
