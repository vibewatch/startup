  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: valuation-gap
      missingEvidence: >-
        Post-money valuation, equity-versus-growth-capital allocation, fully diluted capitalization,
        liquidation preferences, debt or growth-financing covenants, and ownership offered.
      whyItMatters: >-
        These terms determine dilution, preference overhang, common-equity downside, and whether
        the entry price can support a target return.
      diligencePath: >-
        Obtain executed financing documents, the pro forma cap table, side letters, debt schedules,
        and a counsel-reviewed preference waterfall.
