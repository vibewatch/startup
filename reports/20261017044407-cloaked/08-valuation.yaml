schemaVersion: "report-v2"
artifact: valuation
slug: cloaked
runDate: 2026-10-17
company:
  name: Cloaked
chapter:
  number: 8
  title: Valuation
  summary: >-
    Cloaked has raised substantial capital and reports meaningful operating scale, but the
    retained public evidence does not disclose valuation, financing mix, unit economics, or
    preference terms. The evidence therefore supports a research-more recommendation with
    unknown valuation stance, medium confidence, and high underwriting risk.
sections:
  - id: decision
    title: Decision and price discipline
    body: >-
      The appropriate public-evidence recommendation is research-more, not buy or pass. Cloaked
      reports substantial usage and activity across paying members, masked accounts, screened
      calls, and removed records, while the latest financing gives the company resources to keep
      expanding. Those signals support continued diligence, but they do not establish revenue
      quality, retention, margins, or an investable entry price. The post-money valuation,
      equity-versus-growth-capital split, preference stack, and return structure remain
      undisclosed in the retained sources. Any investment decision should therefore be
      conditional on a data-room bridge from operating activity to recurring revenue and on a
      complete capitalization schedule.
    claimRefs:
      - CV007
      - CV008
      - CV009
      - CV015
      - CV016
    tableRefs:
      - TV001
    figureRefs:
      - FV001
  - id: financing-context
    title: Financing context without false precision
    body: >-
      SecurityWeek reported a $375 million Series B and growth-financing package and more than
      $400 million raised in total. Tech Funding News separately reported that the valuation and
      allocation between equity and growth capital were not disclosed, while describing General
      Catalyst's Customer Value Fund as acquisition financing intended to reduce equity dilution.
      FundedIQ records only the $375 million round and explicitly excludes undisclosed amounts,
      which helps explain why public totals differ. Its broad information-technology round-size
      median shows that the financing is unusually large, but it is not a comparable-company
      valuation benchmark and cannot support a post-money estimate.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
    tableRefs:
      - TV002
  - id: scenarios
    title: Bull, base, and bear underwriting
    body: >-
      The bull case requires the company-reported scale indicators to convert into durable paid
      retention and enterprise expansion at attractive contribution margins. The base case
      assumes the financing supports product and go-to-market execution, but keeps valuation
      unscored until revenue quality and financing terms are verified. The bear case centers on
      high acquisition spend, weak retention, feature or geography constraints, and customer
      friction when cancelling or migrating aliases. None of the three cases can carry a
      defensible dollar valuation range from the assigned public evidence; each instead defines
      the evidence and downside triggers required before price can be underwritten.
    claimRefs:
      - CV004
      - CV009
      - CV010
      - CV011
      - CV012
      - CV014
      - CV015
    tableRefs:
      - TV003
  - id: exit-readiness
    title: Exit readiness and final diligence asks
    body: >-
      Cloaked's enterprise positioning creates a plausible second growth vector beyond consumer
      subscriptions, but the retained enterprise page provides neither customer outcomes nor
      contract economics. Exit readiness therefore cannot be assessed from public product breadth
      or financing size alone. Priority diligence should obtain audited revenue and gross-margin
      history, cohort retention by plan, consumer acquisition payback, enterprise bookings and
      renewals, cash burn, debt or growth-financing covenants, liquidation preferences, and the
      fully diluted capitalization table. Thesis-break triggers are a material down round,
      retention deterioration after acquisition spending, financing covenants that subordinate
      new equity, or an inability to reconcile company-reported member and activity metrics to
      billings.
    claimRefs:
      - CV003
      - CV004
      - CV007
      - CV013
      - CV015
tables:
  - id: TV001
    title: Recommendation summary
    columns:
      - Decision field
      - Current view
      - Evidence basis
      - Decision implication
    rows:
      - - Recommendation
        - Research more
        - Large financing and company-reported operating scale coexist with missing price and economics.
        - Do not set an entry price until data-room evidence closes the named gaps.
      - - Confidence
        - Medium
        - Financing is independently reported, but most operating metrics are company-issued.
        - Treat scale as a diligence lead rather than verified revenue quality.
      - - Risk rating
        - High
        - Capital structure, retention, margins, burn, and financing covenants are undisclosed.
        - Require downside protection and full terms before investment committee review.
      - - Valuation stance
        - Unknown
        - No retained source provides the post-money valuation or a model-ready financial baseline.
        - Avoid a precise range or multiple.
      - - Return and exit
        - Not supportable publicly
        - Comparable transactions, exit timing, ownership, and dilution are not established.
        - Build returns only after price, ownership, preference, and exit assumptions are evidenced.
    notes: >-
      Public-evidence decision summary as of 2026-10-17; unknown fields are gaps, not zero values
      or negative findings.
    claimRefs:
      - CV001
      - CV003
      - CV009
      - CV015
      - CV016
  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - Side
      - Argument
      - Supporting evidence
      - What would change the view
    rows:
      - - Thesis
        - The financing provides substantial capacity to fund product and distribution expansion.
        - $375M Series B and growth financing; more than $400M total raised reported by SecurityWeek.
        - Evidence that restrictive financing terms or inefficient acquisition consume that capacity.
      - - Thesis
        - Company-reported usage and activity indicate meaningful consumer reach.
        - 600k+ paying members on a company job page and 170M calls, 19M accounts, and 3.3B records on the homepage.
        - Cohort evidence showing weak paid retention or low activity-to-revenue conversion.
      - - Anti-thesis
        - Financing size cannot establish an attractive entry valuation.
        - Valuation and equity-versus-growth-capital split were not disclosed.
        - A verified post-money price, fully diluted capitalization, and clean preference schedule.
      - - Anti-thesis
        - Product breadth can create switching friction and execution risk without proving durable economics.
        - Independent review notes cancellation consequences, coverage qualifications, and geographic limits.
        - Strong renewal cohorts, low complaint rates, and demonstrated multi-product contribution margins.
    notes: >-
      Thesis arguments distinguish reported facts from underwriting judgments; operating metrics
      remain company claims unless independently verified.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV007
      - CV009
      - CV011
      - CV012
      - CV014
  - id: TV003
    title: Bull, base, and bear scenarios
    columns:
      - Scenario
      - Explicit assumptions
      - Valuation / return logic
      - Probability signal
      - Key risks and downside triggers
    rows:
      - - Bull
        - Paying-member growth converts to strong retention; enterprise expansion adds durable recurring revenue; margins scale.
        - No defensible public range; underwrite only after verified ARR, margins, ownership, and terms support the target return.
        - Company reports 600k+ paying members and substantial activity metrics.
        - Reject if cohorts, enterprise renewals, or contribution margins do not validate the scale narrative.
      - - Base
        - Financing funds continued execution, but growth capital and equity economics remain mixed or uncertain.
        - Hold valuation stance at unknown until the capital split, post-money price, burn, and runway are disclosed.
        - Independent outlets corroborate the financing, while core financial disclosures remain absent.
        - Pause if financing covenants, preferences, or acquisition payback materially impair common-equity returns.
      - - Bear
        - Acquisition spending fails to create durable retention; product constraints or cancellation friction weaken conversion.
        - Downside cannot be quantified without cap-table and financial data; protect against a down round and preference overhang.
        - Independent review identifies service limitations and switching consequences.
        - Stop if retention deteriorates, metrics cannot reconcile to billings, or new financing subordinates incoming equity.
    notes: >-
      Scenarios are evidence-gated frameworks rather than forecasts; no probability percentages or
      valuation amounts are assigned because the required financial and transaction inputs are absent.
    claimRefs:
      - CV003
      - CV004
      - CV007
      - CV009
      - CV011
      - CV012
      - CV014
      - CV015
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Public operating and financing signals narrow to research-more because price, economics, and
      capital terms remain unverified.
    data:
      nodes:
        - id: operating-proof
          label: Operating proof
          detail: Company reports member and activity scale.
        - id: financing-capacity
          label: Financing capacity
          detail: Independent outlets report a $375M Series B and growth-financing package.
        - id: capital-terms
          label: Capital terms
          detail: Valuation and the equity-versus-growth-capital split are undisclosed.
        - id: economic-proof
          label: Economic proof
          detail: ARR, margins, burn, runway, retention, and acquisition efficiency are unavailable.
        - id: downside-test
          label: Downside test
          detail: Product constraints, cancellation friction, and preference overhang require diligence.
        - id: recommendation
          label: Research more
          detail: Set price and return targets only after the evidence gaps close.
      edges:
        - from: operating-proof
          to: financing-capacity
        - from: financing-capacity
          to: capital-terms
        - from: capital-terms
          to: economic-proof
        - from: economic-proof
          to: downside-test
        - from: downside-test
          to: recommendation
    approximationNotes: >-
      The sequence is analytical and does not imply value-proportional node sizes or conversion rates.
    claimRefs:
      - CV001
      - CV003
      - CV009
      - CV011
      - CV015
      - CV016
callouts:
  - calloutType: recommendation
    title: Research more; do not price from financing size
    body: >-
      The $375M package is evidence of financing access, not evidence of the post-money valuation,
      cash available, or common-equity return. Require the full transaction and operating data set.
    claimRefs:
      - CV001
      - CV003
      - CV015
      - CV016
  - calloutType: risk
    title: Public scale metrics do not substitute for economics
    body: >-
      Member and activity metrics use different labels and periods and remain company-issued.
      Reconcile each metric to paid cohorts, billings, retention, and contribution margin.
    claimRefs:
      - CV007
      - CV008
      - CV009
