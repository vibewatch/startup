schemaVersion: "report-v2"
artifact: financials
slug: cloaked
runDate: 2026-10-17
company:
  name: Cloaked
chapter:
  number: 4
  title: Financials
  summary: >-
    Cloaked has a visible consumer subscription model with independently reported list prices,
    a free risk-report acquisition funnel, and an enterprise-facing offer, but the allocated
    public evidence does not disclose revenue, margins, retention, burn, or runway. Public
    financing figures also use inconsistent scopes, so capital adequacy remains ununderwritable
    without a management financial package.
sections:
  - id: revenue-model-and-pricing
    title: Revenue model and list pricing
    body: >-
      The clearest monetization is a direct consumer membership sold by covered person. An
      independent review listed Individual, Couple, and Family plans, with monthly or discounted
      annual billing and the same feature bundle across tiers; this makes household size, rather
      than feature gating, the visible price discriminator. The same review describes a free
      personalized risk report before purchase, no free trial, and a 30-day money-back guarantee,
      indicating a scan-to-subscription acquisition path. Cloaked also operates an enterprise
      site focused on employee identity exposure, but the assigned evidence gives no seat price,
      contract term, or realized discount. These are list-price and packaging observations, not
      evidence of recognized revenue or mix.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI012]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-and-revenue-quality
    title: Public traction and revenue quality
    body: >-
      Cloaked says it has more than 400,000 users and reports substantial cumulative activity:
      more than 170 million calls screened, 19 million accounts masked, and 3.3 billion records
      removed. Those counters indicate product usage, but they are not revenue, ARR, paid
      subscribers, or current-period volume, and the sources do not provide denominators or
      cohort dates. Coverage quality also needs reconciliation. Cloaked markets removal from
      more than 1,000 sites, while Security.org says only 350-plus are data brokers or
      people-search sites and the balance are general company or retailer sites; it also notes
      the coverage has not been independently audited. The counters therefore support adoption
      signals, not durable revenue quality.
    claimRefs: [CI006, CI007, CI008, CI009, CI010, CI011]
  - id: cost-structure-and-unit-economics
    title: Cost structure and unit-economics gaps
    body: >-
      The bundle requires more than static software access: call screening, account masking,
      recurring broker-site removal, monitoring, and an enterprise exposure-control motion all
      imply ongoing service and infrastructure work. Public activity volumes do not disclose the
      unit cost of those obligations, the share handled automatically, insurance economics,
      communications charges, support labor, or broker-removal exception handling. The assigned
      evidence contains no gross margin, CAC, payback period, churn, retention, net revenue
      retention, contribution margin, or realized price data. As a result, neither the scaling
      advantage of the software components nor the potential margin drag from service-intensive
      components can be quantified. The diligence package should separate consumer and
      enterprise cohorts and reconcile every operating metric to billings and recognized revenue.
    claimRefs: [CI007, CI008, CI009, CI010, CI011, CI012, CI016]
    tableRefs: [TI003]
  - id: capital-adequacy-and-verdict
    title: Capital adequacy and financial verdict
    body: >-
      Third-party sources agree that Cloaked completed a large 2026 financing, but not on a clean
      underwriting denominator. Venture Capital Tracker describes $375 million of mixed
      equity/growth funding in March 2026, reports $375 million of total disclosed equity funding,
      and says the valuation is not public. Tracxn instead reports $404 million of total funding
      across three rounds. These figures may reflect different dates, instruments, or inclusion
      rules; funding raised must not be treated as cash on hand or runway. With no cash balance,
      burn, debt terms, preference stack, committed uses, or next-round trigger in the assigned
      sources, capital adequacy remains unknown. The financial verdict is therefore
      research-more: visible monetization and usage are encouraging, but revenue quality, margin
      path, and financing dependency cannot yet be underwritten.
    claimRefs: [CI013, CI014, CI015, CI016]
tables:
  - id: TI001
    title: Revenue streams and mechanisms
    columns: [Stream, Mechanism, Unit, Public status, Revenue quality, Diligence ask]
    rows:
      - [Individual membership, Direct recurring subscription, One person, Publicly listed, List price only, "Paid subscribers, realized ARPU, refunds, and monthly versus annual mix"]
      - [Couple membership, Direct recurring subscription, Two people, Publicly listed, Household bundle, "Paid households, seat activation, realized discount, and retention"]
      - [Family membership, Direct recurring subscription, Up to four people, Publicly listed, Household bundle, "Paid households, member utilization, realized discount, and retention"]
      - [Enterprise offer, Direct or brokered contract not disclosed, Seat or contract unknown, Public enterprise surface, Commercial terms unavailable, "Customer count, seats, ACV, term, channel share, and renewal rate"]
      - [Free risk report, Lead-generation funnel, Scan or prospect, Publicly available, No direct revenue established, "Scan starts, qualified conversion, paid conversion, and acquisition cost"]
    notes: >-
      Public list-price and packaging snapshot from Security.org plus Cloaked's enterprise
      positioning; no source discloses recognized revenue, mix, realized discounts, or channel
      economics, and null economics are presented as diligence asks rather than estimates.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI012]
  - id: TI002
    title: Consumer list pricing and packaging
    columns: [Plan, Monthly list price, Annual list price, Effective monthly, Covered people, Commercial caveat]
    rows:
      - [Individual, "$12.49", "$119.99", "$9.99", 1, "Realized price, tax, refund, and discount mix unavailable"]
      - [Couple, "$19.99", "$174.99", "$14.99", 2, "Realized price, utilization, and retention unavailable"]
      - [Family, "$29.99", "$299.99", "$24.99", 4, "Subscriber plus three members; utilization unavailable"]
      - [Enterprise, null, null, null, null, "No public seat price, minimum commitment, contract term, or discount schedule"]
    notes: >-
      Consumer prices are Security.org's reviewed list prices as accessed on 2026-10-17;
      enterprise fields are null because the assigned public evidence provides no commercial
      terms. List price is not realized revenue.
    claimRefs: [CI001, CI002, CI003, CI004, CI012]
  - id: TI003
    title: Unit economics and capital adequacy diligence
    columns: [Metric, Public value, Confidence, Why it matters, Specific diligence request]
    rows:
      - [ARR or recognized revenue, null, Unavailable, Establishes scale and revenue quality, "Monthly revenue bridge by consumer plan and enterprise cohort, tied to the general ledger"]
      - [Gross margin, null, Unavailable, Tests the cost of bundled services and communications, "Gross margin by product and cohort, including telecom, removal, insurance, support, and hosting costs"]
      - [CAC and payback, null, Unavailable, Determines acquisition efficiency, "Blended and channel CAC, paid conversion, contribution margin, and cohort payback by plan"]
      - [Churn and retention, null, Unavailable, Determines durability of subscription revenue, "Logo and revenue retention cohorts by plan, billing cadence, channel, and customer vintage"]
      - [Cash burn and runway, null, Unavailable, Determines financing dependency, "Current unrestricted cash, monthly net burn, committed uses, downside case, and runway calculation"]
      - [Debt and financing obligations, null, Unavailable, Determines senior claims and liquidity risk, "Debt schedule, covenants, growth-financing terms, preference stack, and conversion rights"]
    notes: >-
      All public values are intentionally null because the assigned evidence does not disclose
      the metric. Reported funding is not substituted for cash, burn, or runway; each row names
      the management evidence needed to close the gap.
    claimRefs: [CI013, CI014, CI015, CI016]
figures:
  - id: FI001
    title: Publicly visible consumer revenue path
    type: flow
    summary: >-
      The observable funnel reaches subscription billing, while conversion, realized revenue,
      service cost, and gross profit remain undisclosed.
    data:
      nodes:
        - id: exposure-scan
          label: Free risk report
          detail: Public pre-purchase exposure scan used as an acquisition entry point.
        - id: plan-selection
          label: Household plan selection
          detail: Individual, Couple, or Family coverage determines the visible consumer tier.
        - id: billing-choice
          label: Monthly or annual billing
          detail: Annual billing carries a lower effective monthly list price.
        - id: bundled-service
          label: Bundled privacy services
          detail: The same feature bundle is reported across consumer tiers.
        - id: ongoing-activity
          label: Screening, masking, and removal
          detail: Company counters show cumulative activity but not paid-period usage.
        - id: financial-output
          label: Revenue and gross profit
          detail: Recognized revenue, realized price, service cost, and gross margin are unavailable.
    approximationNotes: >-
      Ordered conceptual flow only; it does not imply conversion rates, proportional volume, or
      disclosed accounting treatment.
    claimRefs: [CI004, CI005, CI007, CI008, CI009, CI016]
callouts:
  - calloutType: risk
    title: Activity is not ARR
    body: >-
      User and cumulative activity counters lack paid-user, period, retention, and revenue
      denominators; they cannot support an ARR or revenue estimate.
    claimRefs: [CI006, CI007, CI008, CI009, CI016]
  - calloutType: recommendation
    title: Require a reconciled financial package
    body: >-
      Proceed only after management reconciles plan-level billings to recognized revenue and
      supplies gross margin, CAC/payback, retention, cash, burn, debt, and financing terms.
    claimRefs: [CI013, CI014, CI015, CI016]
