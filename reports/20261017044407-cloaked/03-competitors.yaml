      - [Incogni, "Removal specialist", "Not established in assigned evidence", "Buyers prioritizing broker removal", "Lower cited annual entry price and a cited Deloitte audit", "Security.org tested Incogni but did not run a parallel Cloaked test"]
      - [Optery, "Removal specialist", "Not established in assigned evidence", "Buyers seeking tiered removal and screenshot reporting", "Free exposure reporting, tiered coverage, and custom-removal claims", "Comparison evidence is issued by Optery, a direct competitor"]
      - [Aura, "Identity and financial monitoring bundle", "Not established in assigned evidence", "Buyers prioritizing identity, credit, and financial monitoring", "Lower cited starting price and broader identity-monitoring scope", "All About Cookies reports fewer household seats and less specialist removal depth"]
      - [CrabClear and other removal-first vendors, "Removal specialists", "Not established in assigned evidence", "Buyers prioritizing recurring removal, geography, or household economics", "Focused workflows without paying for a full security bundle", "CrabClear authored the alternatives comparison and did not publish an audited success ranking"]
      - [Manual opt-outs plus separate tools, "Status quo / internal assembly", "Not applicable", "Price-sensitive or privacy-technical users", "Maximum tool choice and no single-vendor dependency", "Requires recurring effort and has no consolidated outcome evidence in the assigned pool"]
    notes: >-
      Profiles reflect only the assigned 2026 source set; absent scale, funding, pricing, or
      performance evidence is shown as not established rather than estimated.
    claimRefs: [CP001, CP004, CP005, CP008, CP010, CP012, CP014, CP015]
