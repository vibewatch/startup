schemaVersion: "report-v2"
artifact: competitors
slug: cloaked
runDate: 2026-10-17
company:
  name: Cloaked
chapter:
  number: 3
  title: Competitors
  summary: >-
    Cloaked competes as a broad privacy bundle rather than a removal-only specialist:
    aliases, monitoring, call protection, insurance, and related tools widen its use case,
    while independent and competitor-authored comparisons identify lower-cost, more
    auditable, or more specialized removal alternatives. The public evidence supports
    breadth as differentiation, but not durable removal-performance superiority.
sections:
  - id: competitive-landscape
    title: Competitive landscape and buyer alternatives
    body: >-
      Buyers can solve the privacy-exposure problem through several materially different
      routes: Cloaked's integrated consumer bundle, dedicated removal vendors such as
      Incogni and Optery, identity-monitoring suites such as Aura, narrower removal
      specialists such as CrabClear, or manual opt-outs combined with separate alias,
      password, VPN, and monitoring tools. Cloaked's own history and product pages show a
      deliberate expansion from masked identities into removal, scam blocking, monitoring,
      insurance, and payments. That breadth makes the relevant competitive boundary wider
      than data-removal vendors alone. It also means buyer choice turns on whether
      consolidation is worth more than specialist depth, transparent removal evidence, or
      lower entry pricing. Public scale evidence is thin: Cloaked claims more than 400,000
      users, while comparable funding and customer-scale data for the alternatives are not
      established by the assigned evidence.
    claimRefs: [CP001, CP004, CP005, CP012, CP014, CP015]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: capability-and-trust
    title: Capability, verification, and trust posture
    body: >-
      Cloaked's strongest visible advantage is prevention plus remediation in one product:
      masked contact details reduce new exposure while removal and monitoring address
      existing exposure. The assigned comparisons nevertheless expose a trust gap around
      the removal module. Security.org says its Cloaked assessment relied on published
      claims rather than a parallel hands-on test and found no independent removal audit;
      Optery, a direct competitor, likewise emphasizes screenshot-based proof that it says
      Cloaked lacks. Those observations should not be mistaken for neutral proof of Optery's
      superiority, but they identify a diligence issue that Cloaked's own feature breadth
      does not resolve. All About Cookies adds hands-on adverse evidence: it reported
      mobile glitches and no custom removals, while also crediting Cloaked with broad site
      coverage and privacy-specific certifications.
    claimRefs: [CP001, CP002, CP007, CP008, CP009, CP010, CP011, CP012, CP013]
    tableRefs: [TP002]
  - id: pricing-and-packaging
    title: Pricing and packaging pressure
    body: >-
      Published comparisons place Cloaked above removal-only entry plans and above Aura's
      stated starting price, although the products are not like-for-like. Security.org
      listed Cloaked's annual Individual plan at $119.99, versus $95.88 for Incogni, while
      All About Cookies listed Cloaked from $9.99 per month and Aura from $7.00 per month.
      Optery's own comparison listed a $39 annual Core tier, and CrabClear's review showed
      how removal specialists can compete on geography, cadence, household coverage, or
      threat-response workflow rather than bundle breadth. These are list prices reported
      by publishers or competitors, not realized revenue, retention evidence, or a
      normalized price per successful removal. Cloaked can defend a premium only when
      buyers value enough of the bundled tools to avoid separate subscriptions and setup.
    claimRefs: [CP003, CP006, CP010, CP012, CP014]
    tableRefs: [TP003]
  - id: moat-and-displacement
    title: Moat durability and displacement risk
    body: >-
      Cloaked's moat appears to be integration and distribution across a recurring privacy
      workflow, not a publicly demonstrated technical lead in broker removal. A single
      household or employer relationship can span aliases, removal, call protection,
      monitoring, passwords, insurance, and emerging payments, which may create convenience
      switching costs and broader engagement than a specialist product. The same breadth
      creates execution risk because focused rivals can undercut price, publish more
      granular removal evidence, or concentrate product resources on one outcome.
      Multi-homing is also easy in principle: Optery explicitly encourages Cloaked users to
      run its free report alongside Cloaked. Without independent outcome benchmarks,
      enterprise renewal evidence, or disclosed channel economics, breadth should be
      treated as a promising distribution advantage rather than a proven durable moat.
    claimRefs: [CP005, CP008, CP009, CP011, CP013, CP015, CP016]
