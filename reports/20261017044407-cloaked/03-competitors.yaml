    title: Feature, capability, and proof matrix
    columns:
      - Buying criterion
      - Cloaked
      - Incogni
      - Optery
      - Aura
      - Removal-first / manual alternative
    rows:
      - ["Masked identities", "Phone and email aliases are core", "Not supported by assigned evidence", "Competitor says it does not offer bundle features", "Email masking is listed by All About Cookies", "Usually requires a separate tool"]
      - ["Removal scope", "Company claims 1,000+ sites; reviewers distinguish brokers from other sites", "Security.org cites 420+ automated brokers plus custom removals", "Optery claims tiered broker coverage and custom removals", "All About Cookies cites 425+ brokers", "Varies by specialist or manual target list"]
      - ["Outcome verification", "Dashboard progress claimed; no independent removal audit found by Security.org", "Security.org cites a Deloitte audit", "Optery claims before-and-after screenshot reports", "Privacy reports not listed in the comparison", "No common proof standard"]
      - ["Custom removals", "Independent and competitor comparisons report none", "Security.org reports custom removals on a higher tier", "Optery claims unlimited custom requests on Ultimate", "All About Cookies reports none", "Possible manually, but labor-intensive"]
      - ["Monitoring and protection breadth", "Dark-web alerts, call protection, VPN, password tools, and insurance", "Removal-focused", "Removal-focused", "Identity, credit, financial, antivirus, and privacy tools", "Must be assembled separately"]
      - ["Enterprise posture", "Company frames employee personal-data exposure as an attack path", "Not established in assigned evidence", "Business tier mentioned by competitor source", "Not established in assigned evidence", "Internal security teams can combine controls but evidence is absent"]
    notes: >-
      Cells distinguish company claims, competitor claims, and independent-review findings;
      "not supported" means the assigned source set did not establish the capability.
    claimRefs: [CP001, CP002, CP005, CP007, CP008, CP009, CP010, CP011, CP012, CP013, CP015]
  - id: TP003
    title: Published pricing and packaging comparison
    columns:
      - Provider
      - Referenced offer
      - Published price
      - Included scope
      - Comparability caveat
    rows:
      - [Cloaked, "Individual, annual", "$119.99/year ($9.99/month equivalent)", "Integrated privacy bundle", "Security.org-reported price; current official checkout not captured in fetched text"]
      - [Incogni, "Standard, annual", "$95.88/year ($7.99/month equivalent)", "Dedicated removal", "Security.org-reported price and unlike-for-like scope"]
      - [Optery, "Core, annual", "$39/year", "Entry paid removal tier", "Competitor-authored comparison; coverage changes by tier"]
      - [Aura, "Starting plan", "From $7.00/month", "Removal plus identity/security monitoring", "Publisher-reported starting price, not normalized by seats or outcomes"]
      - [CrabClear, "Current plan", "Exact price not present in fetched evidence", "Removal-first workflow with EU/GDPR positioning", "Publisher is also the vendor and directs readers to live pricing"]
    notes: >-
      List prices come from 2026 comparison pages, not contracts or realized pricing; taxes,
      promotions, seats, country eligibility, cadence, and covered-site definitions differ.
    claimRefs: [CP003, CP006, CP010, CP012, CP014]
figures:
  - id: FP001
    title: Privacy-suite breadth versus removal specialization
    type: quadrant
    summary: >-
      Evidence-backed ordinal positioning shows Cloaked and Aura emphasizing suite breadth,
      while Incogni, Optery, and removal-first vendors emphasize specialist removal.
    data:
      points:
        - label: Cloaked
          x: 5
          y: 3
          detail: "Broad integrated suite; removal depth and outcomes remain less independently verified."
        - label: Incogni
          x: 1
          y: 5
          detail: "Narrower feature set with removal focus and cited independent audit."
        - label: Optery
          x: 2
          y: 5
          detail: "Removal specialist with tiered and screenshot-based proof claims."
        - label: Aura
          x: 5
          y: 2
          detail: "Broad identity and financial monitoring suite with less removal specialization."
        - label: CrabClear
          x: 1
          y: 4
          detail: "Removal-first positioning with EU/GDPR and recurring-cleanup emphasis."
        - label: Kanary
          x: 2
          y: 4
          detail: "Higher-touch threat mitigation and escalation rather than a broad consumer bundle."
    approximationNotes: >-
      X (1=narrow, 5=broad suite) and Y (1=generalist, 5=removal specialist) are analyst
      ordinal scores derived from the assigned sources, not measured performance benchmarks.
    claimRefs: [CP016]
callouts:
  - calloutType: strength
    title: Breadth is the clearest differentiation
    body: >-
      Cloaked combines preventive aliases with removal and protection modules in one
      subscription, a scope that dedicated removal vendors do not reproduce.
    claimRefs: [CP001, CP012, CP015]
  - calloutType: risk
    title: Removal efficacy remains the key proof gap
    body: >-
      The strongest adverse evidence concerns verification: assigned sources did not
      establish an independent Cloaked removal audit or equivalent before-and-after proof.
    claimRefs: [CP008, CP009, CP013, CP016]
