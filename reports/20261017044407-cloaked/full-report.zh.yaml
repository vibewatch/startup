        title: 避免虚假精确的市场测算
        blocks:
          - type: paragraph
            body: >-
              指定证据没有提供具备明确方法论、地域、期间和品类定义的独立市场估算，因此给出金额化 TAM / SAM / SOM
              会制造虚假的精确感。更稳妥的测算视角，是依次收窄范围：广义隐私问题、消费者组合品类、目前有支持的美国和加拿大覆盖范围、付费家庭套餐、新推出的企业员工保护业务，以及 Cloaked
              已披露的立足点。公司自报的运营计数说明了活跃度，而非市场规模或经常性收入。TechCrunch 所说的超过 350,000 名付费客户，与 Cloaked 所说的超过 400,000
              名用户也使用不同分母，不应合并成一条增长序列。
