              的混合股权 / 成长资本融资，披露股权融资总额为 $375 million，并称估值未公开。Tracxn 则称其三轮融资总额为 $404
              million。这些数字可能反映不同日期、工具或纳入规则；募集到的资金不能当作手头现金或
