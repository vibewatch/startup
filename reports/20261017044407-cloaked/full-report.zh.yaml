      - number: '8.3'
        title: 乐观、基准与悲观投资判断
        blocks:
          - type: paragraph
            body: >-
              乐观情景要求公司自报的规模指标转化为持久的付费留存，并以有吸引力的贡献毛利实现企业扩张。基准情景假设融资支持产品和市场进入执行，但在收入质量和融资条款得到验证前不评估估值。悲观情景则集中于高获客支出、留存疲弱、功能或地域约束，以及取消或迁移别名时的客户摩擦。基于指定公开证据，三种情景都无法给出可辩护的美元估值区间；每种情景只能定义在价格进入投资判断前必须取得的证据和下行触发器。
