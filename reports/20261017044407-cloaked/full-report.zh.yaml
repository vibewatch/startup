  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与买家替代方案
        blocks:
          - type: paragraph
            body: >-
              买家可以通过多条差异很大的路径解决隐私暴露问题：Cloaked 的一体化消费者组合、Incogni 和 Optery 等专业删除服务商、Aura 等身份监控套件、CrabClear
              等更窄的删除专家，或手动退出再搭配独立的别名、密码、VPN 和监控工具。Cloaked
              自身历史和产品页面显示，它有意从别名身份扩展到删除、诈骗拦截、监控、保险和支付。因此，竞争边界比单纯的数据删除服务商更宽。买家的选择也取决于整合便利是否胜过专家深度、透明的删除证据或更低的入门价格。公开规模证据很薄：Cloaked
              自称拥有超过 400,000 名用户，但指定证据并未建立替代方案的可比融资和客户规模数据。
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP012
              - CP014
              - CP015
