  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              可投资市场比整个网络安全市场窄，却又不止于数据经纪商删除。Cloaked
              包含两项相连的任务：用别名联系方式阻止新的暴露，再靠删除、监控和恢复支持降低既有暴露。VPN、密码管理、暗网提醒、诈骗电话筛选和身份盗窃保险等相邻功能能增强组合，但如果买家本来就分别购买这些服务，就不应把它们全部计作增量可寻址支出。替代方案包括手动退出、浏览器或运营商控制、独立隐私工具、密码管理器和更广泛的身份保护套件。这个边界避免把企业网络安全、信用监控、杀毒软件或整个身份盗窃市场都算作
              Cloaked 可直接获取的支出。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM006
              - CM010
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
