              天退款保证，说明其获客路径是从扫描转向订阅。Cloaked 还运营着一个聚焦员工身份暴露的企业网站，但指定证据没有给出席位价格、合同期限或实际折扣。这些是标价和套餐观察，不是确认收入或收入组合的证据。
