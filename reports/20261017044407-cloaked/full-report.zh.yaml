        blocks:
          - type: paragraph
            body: >-
              SecurityWeek 报道了一笔 $375 million 的 B 轮及成长融资组合，并称累计融资超过 $400 million。Tech Funding News
              另称估值以及股权与成长资本的分配未披露，同时描述 General Catalyst 的 Customer Value Fund 是旨在减少股权稀释的收购融资。FundedIQ 只记录 $375 million
              这轮，并明确排除未披露金额，这有助于解释公开总额为何不同。其广义信息技术轮次规模中位数显示，这笔融资异常庞大，但它不是可比公司的估值基准，也不能支持投后估值估算。
