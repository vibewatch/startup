      - CI016
  - id: FE001
    title: 受证据约束的产品架构图
    type: stack
    summary: 该架构将客户触点、隐私运营和支持控制分开，同时标明支付层尚未普遍开放。
    data:
      layers:
        - label: 客户访问
          modules:
            - 网页控制面板
            - 浏览器扩展
            - iOS 应用
            - Android 应用
          detail: 公开分发触点
        - label: 身份抽象
          modules:
            - 屏蔽电子邮件
            - 屏蔽电话
            - 密码
            - TOTP 代码
          detail: 按场景区分的凭证与通信
        - label: 主动防御
          modules:
            - Call Guard
            - 暗网警报
            - SSN 警报
          detail: 检测与通话筛查
        - label: 暴露修复
          modules:
            - 数据经纪商扫描
            - 移除请求
            - 重复移除
          detail: 持续的付费运营流程
        - label: 恢复与支持
          modules:
            - 身份盗窃保险
            - 恢复支持
          detail: 事故后的援助受条款约束
        - label: 支付屏蔽路线图
          modules:
            - Cloaked Pay
          detail: 现有证据显示处于测试或仅限邀请阶段
    approximationNotes: 分层顺序是分析性的，不代表公司的内部实现；图中只包含指定来源提到的组件。
    claimRefs:
      - CE002
      - CE005
      - CE006
      - CE007
      - CE011
      - CE016
  - id: FU001
    title: 客户采用与扩张旅程
    type: journey-map
    summary: 公开客户旅程存在多个合理的扩张触点，但转化和持久性仍未披露。
    data:
      nodes:
        - label: 发现暴露
          detail: 消费者或雇主发现个人信息暴露、垃圾信息、诈骗或冒充风险。
          touchpoints:
            - Free safety scan
            - Employer risk assessment
        - label: 初始保护
          detail: 用户采用屏蔽电子邮件或电话身份；评测认为别名是最明确的购买理由。
          touchpoints:
            - Consumer app
            - Browser and mobile workflows
        - label: 激活套餐
          detail: 账户增加数据移除、通话筛查、监控、密码、VPN 访问或保险支持的恢复服务。
          touchpoints:
            - Privacy dashboard
            - Call Guard
            - Data removal
        - label: 家庭扩张
          detail: 付款人可以把覆盖范围扩展至情侣或家庭，但附加率和成员激活率未披露。
          touchpoints:
            - Couple plan
            - Family plan
        - label: 企业扩张
          detail: 雇主可以购买员工隐私保护，但具名的生产部署和合同指标均缺失。
          touchpoints:
            - Enterprise security buyer
            - Employee users
        - label: 续约或退出
          detail: 持久性尚未测量；据报取消服务后，经由这些身份的通话和短信会停止，因此可能需要迁移。
          touchpoints:
            - Renewal decision
            - Identity migration
    approximationNotes: 这些阶段构成以证据为基础的运营旅程，而非实测漏斗；没有可用的转化率、阶段人数或统一时间基准。
    claimRefs:
      - CU008
      - CU010
      - CU011
      - CU013
      - CU014
      - CU016
  - id: FR001
    title: 剩余风险热力图
    type: matrix
    summary: 公开证据排序显示，覆盖范围勾稽、别名连续性、电信接受度和保险证明是最高的剩余尽调风险。
    data:
      columns:
        - label: 可能性
          detail: 已观察到的约束或基于证据的概率类别
        - label: 影响
          detail: 对用户、理赔、运营或投资论点的潜在影响
        - label: 缓解成熟度
          detail: 指定公开证据中可见的成熟度
        - label: 剩余严重度
          detail: 私人尽调前仍存的风险
      rows:
        - label: 数据经纪商覆盖量声明勾稽
          note: 公开计数采用尚未勾稽的定义和数据年份。
          values:
            - label: 高
            - label: 高
            - label: 低
            - label: 高
        - label: 别名基础设施连续性
          note: 每增加一个绑定别名的账户，切换工作就会增加。
          values:
            - label: 中
            - label: 高
            - label: Unknown
            - label: 高
        - label: VoIP 与验证接受度
          note: 评测证据发现银行、政府和平台限制。
          values:
            - label: 高
            - label: 高
            - label: 部分
            - label: 高
        - label: 紧急呼叫误用
          note: 别名被当作主号码时尤为相关。
          values:
            - label: 误用时高
            - label: 高
            - label: 基础
            - label: 高
        - label: 保险范围证明
          note: 消费者和企业覆盖需要按保单层面勾稽。
          values:
            - label: 中
            - label: 高
            - label: Unknown
            - label: 高
        - label: 监控与功能深度缺口
          note: 信贷、金融账户和经独立测试的检测覆盖有限或未经验证。
          values:
            - label: 高
            - label: 中
            - label: 发展中
            - label: 中高
    approximationNotes: 定性类别是有证据支持的尽调判断，不是实测事故概率；未推断数值概率、损失估算或事故率。
    claimRefs:
      - CR001
      - CR002
      - CR004
      - CR010
      - CR012
      - CR015
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 由于价格、经济性和资本条款仍未验证，公开运营与融资信号最终指向继续研究。
    data:
      nodes:
        - id: operating-proof
          label: 运营证明
          detail: 公司报告会员和活跃度规模。
        - id: financing-capacity
          label: 融资能力
          detail: 独立媒体报道 $375M B 轮及成长融资组合。
        - id: capital-terms
          label: 资本条款
          detail: 估值以及股权资本与成长资本的分拆未披露。
        - id: economic-proof
          label: 经济性证明
          detail: ARR、利润率、烧钱、现金跑道、留存和获客效率均不可得。
        - id: downside-test
          label: 下行测试
          detail: 产品限制、取消摩擦和优先股堆叠需要尽调。
        - id: recommendation
          label: 继续研究
          detail: 只有在证据缺口补齐后，才设定价格和回报目标。
      edges:
        - from: operating-proof
          to: financing-capacity
        - from: financing-capacity
          to: capital-terms
        - from: capital-terms
          to: economic-proof
        - from: economic-proof
          to: downside-test
        - from: downside-test
          to: recommendation
    approximationNotes: 该顺序是分析性的，不代表节点大小与价值成比例，也不代表转化率。
    claimRefs:
      - CV001
      - CV003
      - CV009
      - CV011
      - CV015
      - CV016
