  - id: TV003
    title: 乐观、基准与悲观情景
    columns:
      - 情景
      - 明确假设
      - 估值 / 回报逻辑
      - 概率信号
      - 关键风险与下行触发因素
    rows:
      - - 乐观
        - 付费会员增长转化为强劲留存；企业扩张带来持久的经常性收入；利润率随规模提升。
        - 没有可辩护的公开区间；只有经验证的 ARR、利润率、持股和条款足以支撑目标回报后，才纳入投资判断。
        - 公司报告有 600k+ 名付费会员，且活跃度指标可观。
        - 如果队列、企业续约或贡献利润率无法验证规模叙事，就拒绝投资。
      - - 基准
        - 融资支持持续执行，但成长资本与股权经济性仍混杂或不确定。
        - 在披露资本拆分、投后价格、烧钱和现金跑道前，估值立场维持未知。
        - 独立媒体交叉印证融资，但核心财务披露仍缺失。
        - 如果融资契约、优先权或获客回本期显著损害普通股回报，就暂停。
      - - 悲观
        - 获客支出未能带来持久留存；产品限制或取消摩擦削弱转化。
        - 没有股权结构表和财务数据无法量化下行；应防范下轮融资和优先权悬空。
        - 独立评测发现服务限制和切换后果。
        - 如果留存恶化、指标无法与账单金额勾稽，或新融资使新进入的股权处于次位，就停止投资。
    notes: 情景是由证据约束的分析框架，而非预测；由于缺少必要的财务和交易输入，未赋予概率百分比或估值金额。
    claimRefs:
      - CV003
      - CV004
