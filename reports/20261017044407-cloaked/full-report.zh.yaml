  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与标价
        blocks:
          - type: paragraph
            body: >-
              最清晰的变现方式，是按受保护人员销售直接面向消费者的会员。独立评测列出了 Individual、Couple 和 Family
