        title: 领导层、资本透明度与治理
        blocks:
          - type: paragraph
            body: >-
              指定证据池中的公开领导层披露很窄，且以创始人为中心。最清晰的具名职位仍来自 2023 年的发布稿，其中确认 Arjun Bhatnagar 为 CEO、Abhijay Bhatnagar
              为总裁；同一发布稿也锁定了本章证据集中最后一份可直接核实的投资者名单。后来一篇商业关联的评测仍称 Cloaked 由这对兄弟于 2020
              年创立、总部位于纽约，这能帮助交叉确认身份，却无法解决刷新期关于当前估值、融资构成、债务或董事会构成的披露缺口。实际上，公司仍明显由创始人主导；但外部读者若要把公开记录当作可靠的尽调基线，仍需当前股权结构表和治理材料。
