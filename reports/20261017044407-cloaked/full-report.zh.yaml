      - number: '8.4'
        title: 退出准备度与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              Cloaked
              的企业定位在消费者订阅之外提供了合理的第二增长向量，但保留的企业页面没有客户结果或合同经济性。因此，仅凭公开产品广度或融资规模无法评估退出准备度。优先尽调应取得经审计的收入和毛利历史、按套餐划分的队列留存、消费者获客回本、企业订单和续约、现金烧钱、债务或成长融资契约、清算优先权，以及完全摊薄的股权结构表。论点失效触发器包括重大下轮融资、获客支出后的留存恶化、使新股权处于次位的融资契约，或无法将公司自报的会员数和活跃度指标与账单勾稽。
            claimRefs:
