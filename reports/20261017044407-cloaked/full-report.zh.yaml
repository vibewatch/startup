      - number: '3.2'
        title: 能力、验证与信任姿态
        blocks:
          - type: paragraph
            body: >-
              Cloaked 最明显的优势，是在一个产品里同时提供预防和补救：别名联系方式减少新暴露，删除和监控则处理既有暴露。但指定比较也暴露出删除模块的信任缺口。Security.org 称其 Cloaked
              评估依赖已发布的自报信息，而非平行的实操测试，并未发现独立删除审计；直接竞争者 Optery 同样强调基于截图的证明，并称 Cloaked 缺少这一证明。这些观察不应被误读为 Optery
              更优的中立证据，但它们指出了 Cloaked 的功能广度无法解决的尽调问题。All About Cookies 还提供了实操层面的反向证据：报告移动端故障和没有定制删除，同时认可 Cloaked
              的广泛网站覆盖和隐私专项认证。
            claimRefs:
              - CP001
              - CP002
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP005
