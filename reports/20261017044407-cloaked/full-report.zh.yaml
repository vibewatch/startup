chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与产品范围
        blocks:
          - type: paragraph
            body: >-
              Cloaked 当前自有材料将公司描述为以隐私为先的身份管理系统，而不是单一的数据删除工具。如今的产品栈把别名身份、数据删除流程、来电保护、密码管理、监控和私密支付功能组合在一起；当前公开页面仍将 Cloaked
              Pay 标为限量访问或测试阶段，而非全面上线。上手指南还显示，该产品可用于移动端、网页、浏览器扩展和 Mac
              环境，这一点很关键，因为它的价值主张是持续替换身份层，而不是一次性清理。企业网站则把同一逻辑延伸到员工保护：暴露的员工身份数据会成为侦察材料，进而助推冒充和未授权账户访问。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO014
          - type: table
            tableRef: TO001
            claimRefs:
