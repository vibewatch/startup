            body: >-
              Cloaked 称平台已于 2023 年 10 月退出测试阶段，当前 App Store 元数据显示 iPhone 应用仍在积极更新。根据 2026 年 9 月的评测，其分发覆盖网页仪表盘、浏览器扩展，以及
              iOS 和 Android 应用。从运营上看，数据删除并非即时完成：该评测称，付费激活后通常约十四个工作日才开始成功删除，且当列表重新出现时需要重复处理。产品成熟度并不均衡。Cloaked Pay
              仍被描述为测试版或仅限邀请，取消服务还可能使通信身份无法继续用于电话和短信，增加已广泛采用这些身份的客户的迁移工作。
