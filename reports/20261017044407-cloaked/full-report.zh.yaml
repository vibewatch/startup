  - id: FP001
    title: 隐私套件广度与移除专业化对比
    type: quadrant
    summary: 有证据支持的序位显示，Cloaked 和 Aura 强调套件广度，而 Incogni、Optery 及以移除为先的厂商强调专业化移除。
    data:
      points:
        - label: Cloaked
          x: 5
          'y': 3
          detail: 广泛的一体化套件；移除深度和结果的独立验证较少。
        - label: Incogni
          x: 1
          'y': 5
          detail: 功能集更窄，专注移除，并有独立审计引用。
        - label: Optery
          x: 2
          'y': 5
          detail: 移除专家，提供分层且基于截图的证明说法。
        - label: Aura
          x: 5
          'y': 2
          detail: 广泛的身份与财务监控套件，但移除专业化程度较低。
        - label: CrabClear
          x: 1
          'y': 4
          detail: 以移除优先，强调 EU/GDPR 和定期清理。
        - label: Kanary
          x: 2
          'y': 4
          detail: 侧重高触达的威胁缓解与升级，而非广泛的消费者套餐。
    approximationNotes: X（1=窄，5=广）和 Y（1=综合型，5=移除专家）是分析师根据指定来源得出的序位评分，不是实测业绩基准。
