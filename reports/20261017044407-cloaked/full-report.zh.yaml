      - number: '3.3'
        title: 定价与套餐压力
        blocks:
          - type: paragraph
            body: >-
              已发表的比较显示，Cloaked 的价格高于仅提供删除的入门套餐，也高于 Aura 公布的起始价，但这些产品并非完全可比。Security.org 列出 Cloaked 年度 Individual 套餐为
              $119.99，Incogni 为 $95.88；All About Cookies 列出 Cloaked 月费起价 $9.99，Aura 为 $7.00。Optery 自己的比较列出 Core 年费
              $39，CrabClear
              的评测则展示了删除专家如何靠地域、频率、家庭覆盖或威胁响应流程竞争，而不是靠组合广度。这些是出版商或竞争对手报告的标价，不是实际收入、留存证据或每次成功删除的标准化价格。只有当买家足够看重组合工具、愿意省去独立订阅和设置成本时，Cloaked
              才能守住溢价。
            claimRefs:
              - CP003
              - CP006
              - CP010
              - CP012
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP006
              - CP010
              - CP012
              - CP014
      - number: '3.4'
        title: 壁垒持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              Cloaked
              的壁垒似乎来自持续隐私工作流中的整合与分发，而不是公开证明的经纪商删除技术领先。单个家庭或雇主关系可以覆盖别名、删除、来电保护、监控、密码、保险和逐步推出的支付功能，这可能带来便利性迁移成本和比专家产品更广的参与度。但同样的广度也制造执行风险：专注型竞争者可以压低价格、发布更细的删除证据，或把产品资源集中到单一结果。多重使用在原则上也很容易：Optery
              明确鼓励 Cloaked 用户在使用 Cloaked 的同时运行其免费报告。在没有独立结果基准、企业续约证据或已披露渠道经济性的情况下，应把广度视为有希望的分发优势，而非已验证的持久壁垒。
