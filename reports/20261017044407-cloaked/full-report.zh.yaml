      - number: '7.3'
        title: 运营、质量与安全执行
        blocks:
          - type: paragraph
            body: >-
              电话隐藏是最明显的运营薄弱点。Proton 称 Cloaked 使用 VoIP 号码，这些号码可能无法通过金融应用、政府门户和其他服务的短信验证，且非活跃号码如果未锁定可能被重新分配。Batten
              另行警告，别名号码无法拨打紧急电话。这些是工作流约束，不是平台级宕机的证据；但若产品被当作主号码使用，可能造成支持负担、上手失败或用户被锁定。产品广度也增加执行风险：Cloaked Pay
              被描述为测试版或仅限邀请，指定证据中也没有暗网检测的独立验证。应根据测试结果、事件历史和支持指标，而不是功能页面上的可用性，判断缓解措施的成熟度。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR011
              - CR014
              - CR016
      - number: '7.4'
        title: 依赖、监控指标与论点失效触发器
        blocks:
          - type: paragraph
            body: >-
              Cloaked 的价值主张造成了集中式依赖：跨多个账户使用的别名都绑定在 Cloaked
              基础设施上，因此停服、长期宕机、号码库存损失或突然涨价，都可能迫使用户更新外部账户。企业定位还依赖电信接受度、数据经纪商响应和保险合作伙伴，而这些表现并非完全由 Cloaked
              控制。如果已验证的删除覆盖仍无法勾稽、关键工作流反复拒绝别名、可迁移性和连续性测试无法达到合同恢复目标、重大安全发现超过约定期限仍未关闭，或政策文件无法支持宣传的保险与合规边界，论点就应失效。月度监控应跟踪别名送达成功率、验证拒绝、删除时长、事件严重度、支持积压、合作伙伴集中度和政策例外。
