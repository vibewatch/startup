        blocks:
          - type: paragraph
            body: >-
              Cloaked 最独特的产品主张是预防性隔离：别名可以限制某一商家的泄露与用户底层身份之间的连接。但这一模式也依赖路由可用性、VoIP
              接受度，以及客户能否在取消服务前迁移账户。一篇竞争者撰写的比较称，其监控和金融保护深度落后于更完整的身份保护套件；一篇关联评测则指出虚拟号码在 911
              和验证服务上存在限制。反复出现的认证宣传是积极信号，却不能替代当前审计报告或控制范围。关于 Call Guard 的第三方报告不一，经纪商数量口径也不一致，因此性能遥测、支持数据和保证材料应列为优先尽调事项。
