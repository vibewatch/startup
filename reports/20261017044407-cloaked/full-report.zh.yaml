      - number: '1.3'
        title: 规模信号、外部挑战点与里程碑判断
        blocks:
          - type: paragraph
            body: >-
              Cloaked 当前首页展示了很大的使用总量，包括筛选 170+ million 个电话、隐藏 19+ million 个账户，以及删除 3.3+ billion
              条经纪商记录。这些公司自报的活跃度指标说明有人在使用产品，但不能替代已披露的付费客户数、收入或留存数据。Google Play 页面称其可从 120+ 家经纪商处删除信息，而首页使用更宽泛的 1,000+
              个网站口径。Security.org 进一步称，这些宣传覆盖的网站中只有 350+ 个是真正的数据经纪商或人员搜索网站，说明三个数量使用了不同分母，不应互相替代。一篇商业关联评测还指出，基于 VoIP
              的别名号码可能被部分服务拒绝，也不能拨打 911。总体来看，这是一个公开活跃度和功能广度都很清晰的产品，但投资人仍需在缺乏经审计公开运营数据的情况下补齐披露缺口。
