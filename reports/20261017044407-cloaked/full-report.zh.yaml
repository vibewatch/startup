        title: 风险排序与决策框架
        blocks:
          - type: paragraph
            body: >-
              最大的剩余暴露，是一体化隐私平台所暗示的广度，与评测者记录的更窄保护范围之间的差距。SecurityHero 称没有信用监控、金融账户监控或独立验证的暗网检测；Proton
              则描述了电话别名在验证和来电过滤上的限制。这些缺口很重要，因为产品处理联系方式、凭据、身份和支付相关工作流：一旦失败，既可能打断访问，也可能降低保护。以下排序因此把未经支持的保障视为不确定性，而不是数据泄露或违规的证明。高严重度风险在投资前需要合同、技术或运营证据；中等风险则需要可监控的修复里程碑和负责人问责。
            claimRefs:
