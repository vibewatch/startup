  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 决策与价格纪律
        blocks:
          - type: paragraph
            body: >-
              基于公开证据，恰当的建议是继续研究，而不是买入或放弃。Cloaked
              报告了付费会员、隐藏账户、筛选电话和删除记录等方面的大量使用和活跃度，最新融资也为其继续扩张提供了资源。这些信号支持继续尽调，但不能证明收入质量、留存、利润率或可投资入场价。保留来源没有披露投后估值、股权与成长资本的拆分、优先股堆叠或回报结构。因此，任何投资决定都应以数据室提供的运营活跃度到经常性收入的桥接，以及完整资本化明细为前提。
