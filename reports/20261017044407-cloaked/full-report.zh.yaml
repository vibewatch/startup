    rows:
      - - 正论
        - 这轮融资为产品和分销扩张提供了充足资金。
        - $375M B 轮及成长融资；SecurityWeek 报道累计融资超过 $400M。
        - 证据显示苛刻的融资条款或低效获客正在消耗这笔资金。
      - - 正论
        - 公司自报的使用量和活跃度表明已触达大量消费者。
        - 公司招聘页面显示有 600k+ 名付费会员，官网显示 170M 次通话、19M 个账户和 3.3B 条记录。
        - 队列证据显示付费留存弱，或活跃度转化为收入的效率低。
      - - 反论
        - 融资规模本身无法证明入场估值有吸引力。
        - 估值以及股权资本与成长资本的分拆均未披露。
        - 已验证的投后价格、完全摊薄资本结构和清晰的优先权安排。
      - - 反论
        - 产品覆盖面可能带来切换摩擦和执行风险，但不能证明经济性持久。
        - 独立评测指出取消服务的后果、覆盖范围限制和地域限制。
        - 强劲的续约队列、低投诉率，以及已证明的多产品贡献利润率。
    notes: 正论把报道事实与投资判断区分开来；运营指标除非经过独立验证，否则仍属于公司自述。
