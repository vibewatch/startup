      - number: '2.3'
        title: 买家、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              消费者采用始于个人或家庭购买持续订阅，以减少不想要的暴露、来电和账户级数据泄露。产品设置了个人、情侣和家庭套餐，使家庭成为实际预算所有者，而终端用户使用别名、删除和提醒功能。企业采用逻辑不同：由雇主付费，员工获得保护，CISO
              或安全团队评估员工暴露和总体风险。公开证据证明了企业用例，但没有说明价格、合同金额、采购周期、续约行为或预算归类。因此，企业细分在战略上很重要，但尚无法量化为可服务的收入池。
            claimRefs:
              - CM004
              - CM005
              - CM007
              - CM008
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM010
              - CM012
      - number: '2.4'
        title: 采用驱动因素、约束与估值关联
        blocks:
          - type: paragraph
            body: >-
              需求受到零散点式解决方案、持续存在的数据经纪商暴露，以及在滥用发生前阻止披露的吸引力支撑。独立测试给出了具体结果：一名评测者称 16 天内删除了 40 条暴露记录，但仍有 22
              个经纪商网站处于处理中。流程摩擦和品类错配限制了采用。同一评测称没有定制删除服务，并报告许多自动化包需要在应用保持打开时进行确认或填写
              CAPTCHA。寻求信用或金融账户监控的买家，可能会转向更全面的身份保护套件。就估值而言，这一品类可以支撑订阅和企业扩张叙事；但在缺少独立市场规模、细分组合、留存和支付意愿证据的情况下，不应把运营计数换算成收入或市场份额假设。
            claimRefs:
              - CM001
              - CM003
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
