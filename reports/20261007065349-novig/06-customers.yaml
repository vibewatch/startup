  evidenceGaps:
    - type: "private-evidence-only"
      severity: "material"
      topic: "retention-and-concentration"
      missingEvidence: "Absolute funded-account counts, monthly cohorts, 30/60/90-day repeat trading, churn, repeat deposits, customer acquisition cost, lifetime value, and revenue concentration."
      whyItMatters: "Short-window acquisition growth cannot establish durable customer economics or channel concentration without cohort and unit-economic evidence."
      diligencePath: "Request anonymized monthly acquisition cohorts by source, geography, deposit rail, trade frequency, net revenue, and 30/60/90-day retention."
      relatedQuestionRefs:
        - "QU004"
        - "QU005"
    - type: "enumeration-incomplete"
      severity: "material"
      topic: "named-customer-proof"
      missingEvidence: "Named end-customer references with permission to verify production use, trading frequency, funding history, and satisfaction."
      whyItMatters: "The public record contains anonymous user cohorts but no named end customer, so reference quality and longitudinal behavior cannot be independently tested."
      diligencePath: "Obtain three referenceable customers across acquisition channels and conduct calls covering onboarding, repeat use, losses, support, and competing platforms."
      relatedQuestionRefs:
        - "QU003"
      relatedTableRefs:
        - "TU003"
    - type: "missing-source"
      severity: "material"
      topic: "campaign-denominators"
      missingEvidence: "Absolute pre- and post-campaign counts for downloads, funded users, first-time depositors, active users, notional volume, and net revenue."
      whyItMatters: "Percentage growth can look large from a small base and does not show whether higher activity translated into revenue or retained liquidity."
      diligencePath: "Reconcile management's campaign dashboard to transaction logs and financial reporting for identical 20-day windows."
      relatedQuestionRefs:
        - "QU002"
        - "QU006"
    - type: "conflicting-data"
      severity: "minor"
      topic: "coinflow-cohort-timing"
      missingEvidence: "A dated denominator and cutoff for Coinflow's statement that 50% of first-time purchasers in Q4 2026 used Coinflow rails."
      whyItMatters: "The case study is dated April 2026 while the stated Q4 2026 period had not occurred, and the run date is only October 7, 2026, so the figure is not used in this chapter."
      diligencePath: "Ask Coinflow and Novig for the intended quarter, publication date, cohort definition, absolute count, and supporting payment export."
      relatedQuestionRefs:
