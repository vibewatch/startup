callouts:
  - calloutType: "insight"
    title: "Acquisition is visible; durable economics are not"
    body: "The reported campaign metrics consistently show rapid acquisition and activity, but they share a short measurement window and omit absolute user counts, customer acquisition cost, retained cohorts, and revenue. The evidence supports momentum, not a conclusion about lifetime value."
    claimRefs:
      - "CU004"
      - "CU005"
      - "CU006"
      - "CU007"
      - "CU014"
  - calloutType: "risk"
    title: "Attention did not transfer cleanly to the product"
    body: "Weekly mentions rose sharply after the campaign, yet 5W reported that only 4% of campaign posts named the Novig app. The result creates a measurable risk that celebrity attention overstates product awareness and retained demand."
    claimRefs:
      - "CU008"
      - "CU009"
