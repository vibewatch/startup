company:
  name: "Novig"
chapter:
  number: 6
  title: "Customers"
  summary: "Novig has recent evidence of rapid retail acquisition: management told CNBC that first-time depositors rose more than 218% and trading volume nearly 94% in the 20 days after its September 2026 campaign versus the preceding 20 days. The evidence remains acquisition-heavy, however; the assigned public sources do not disclose absolute user counts, cohort retention, churn, customer concentration, or named end-customer references."
sections:
  - id: "customer-segments"
    title: "A retail, sports-only customer perimeter"
    body: >-
      Novig's observable user proposition is retail access to sports event contracts. Its
      captured homepage displayed live markets across baseball, basketball, football, hockey,
      and tennis, alongside an order book, account statistics, rankings, and a Discord
      community link. Independent reporting also describes a deliberate 21-and-over policy and
      a sports-only catalog, which narrows the eligible audience relative to prediction
      platforms that admit users from age 18 or list non-sports events. Funding preference is
      another useful segmentation axis: Coinflow's partner case study says Novig expanded
      beyond ACH to card and crypto rails because users wanted more choice. Geography remains
      conditional rather than uniform; one trade publication reported access in 47 states while
      identifying Arizona, Michigan, and Nevada as closed, and continuing state litigation
      makes that footprint subject to change.
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU012"
      - "CU015"
      - "CU016"
    tableRefs:
      - "TU001"
  - id: "adoption-trajectory"
    title: "Strong acquisition signals, limited denominator visibility"
    body: >-
      The clearest adoption evidence is a set of short-window, management-supplied comparisons
      reported by CNBC and repeated by Briefs.co. Across the 20 days before and after the
      September campaign launch, trading volume rose nearly 94%, first-time depositors rose
      more than 218%, and app downloads rose more than 187%. September active users were
      reported up 96% month over month and 260% year over year. These measures point in the
      same direction, but none includes an absolute baseline, a definition of an active user,
      acquisition cost, or a retained-user cohort. A separate Covers report, citing Aldrin
      Research, put notional trading volume at $1.14 billion since the September 9 NFL kickoff
      and ranked Novig sixth among 11 reporting operators over the first three weeks. Notional
      turnover is evidence of activity, not revenue or retention, and the NFL-centered window
      may not represent off-season demand.
    claimRefs:
      - "CU004"
      - "CU005"
      - "CU006"
      - "CU007"
      - "CU013"
    tableRefs:
      - "TU002"
    figureRefs:
      - "FU001"
  - id: "customer-proof"
    title: "Public proof stops at anonymous cohorts"
    body: >-
      Public customer proof is cohort-level rather than account-level. CNBC reports movement in
      first-time depositors and active users, while Coinflow documents a live payment
      integration and reports a 90% increase in Coinflow payment volume from October 2025 to
      March 2026 and acceptance improving from 86% to about 95%. Those data support production
      usage and reduced funding friction, but Coinflow is a supplier with a commercial interest
      in the case study, and neither source identifies an end customer, publishes an absolute
      cohort size, or follows users after acquisition. The assigned evidence therefore cannot
      establish renewal-like behavior, repeat-deposit frequency, repeat-trading retention, or
      revenue quality. The named-customer exhibit records the three strongest public cohort
      observations rather than relabeling partners, celebrities, or sports teams as customers.
    claimRefs:
      - "CU005"
      - "CU007"
      - "CU010"
      - "CU011"
      - "CU012"
      - "CU014"
    tableRefs:
      - "TU003"
  - id: "durability-and-concentration"
    title: "Durability depends on conversion after the attention spike"
    body: >-
      The September campaign produced measurable attention but ambiguous brand transfer.
      Forbes reported weekly social mentions rising from 392 to 4,633 in the four days after
      launch, while 5W's analysis said only 4% of campaign posts named the Novig app itself.
      That combination is consistent with a powerful awareness event, not proof of durable
      customer economics. Regulatory access is a second concentration risk: a syndicated
      Covers report listed lawsuits involving Massachusetts, New Mexico, New York, Washington,
      and Wisconsin, while Novig's own federal comment confirms that it writes as the owner of
      a designated contract market listing event contracts. The assigned public evidence
      discloses no NRR, GRR, churn, contract length, repeat-deposit cohorts, top-customer
      exposure, or channel-attributed revenue. Management data is therefore required to test
      whether celebrity-led acquisition converts into recurring, geographically durable usage.
    claimRefs:
      - "CU002"
      - "CU008"
      - "CU009"
      - "CU014"
      - "CU015"
      - "CU016"
