evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: >-
      Audited financial statements or verified disclosures regarding Novig's net fee revenue, unit economics, gross
      margins, and monthly cash burn rate.
    whyItMatters: >-
      Without fee take-rate data, financial sustainability and the viability of commission-free order-book sports
      trading cannot be independently modeled.
    diligencePath: >-
      Review future institutional investor disclosures, secondary offering prospectuses, or confidential management
      presentation materials.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: net-take-rate
    missingEvidence: >-
      Audited financial statements disclosing realized net exchange fee capture (basis points) relative to gross
      notional trading volume across retail and institutional tiers.
    whyItMatters: >-
      Without verified net take rate data, converting notional turnover figures ($1.14B NFL volume) into actual gross
      revenue and net contribution margin remains speculative.
    diligencePath: >-
      Review confidential financial disclosure deck, merchant processor statements, and institutional clearing fee
      agreements during management diligence.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: market-share-velocity
    missingEvidence: >-
      Comprehensive market-wide volume reporting across all regulated and offshore sports prediction venues to reconcile
      Aldrin Research's 1.7% weekly market share estimate with Covers' sixth-place ranking.
    whyItMatters: >-
      Determines whether Novig's sports specialization is capturing meaningful category share or remaining a niche
      long-tail participant against Kalshi and Polymarket.
    diligencePath: >-
      Obtain Aldrin Research full prediction market dataset and CFTC monthly contract volume filings for DCM
      registrants.
    relatedQuestionRefs:
      - QM003
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: liquidity
    missingEvidence: >-
      Normalized bid-ask spreads, executable order-book depth, fill rates, and time-to-fill by sport and contract type
      across Novig and peers.
    whyItMatters: Headline volume and fee schedules cannot establish best execution or liquidity durability.
    diligencePath: >-
      Request venue-level order-book snapshots and cohort execution logs, then run matched-contract tests across the
      same events and timestamps.
    relatedQuestionRefs:
      - QP002
      - QP005
      - QP007
    relatedTableRefs:
      - TP001
      - TP002
      - TP003
  - type: private-evidence-only
    severity: material
    topic: customer-retention
    missingEvidence: >-
      Customer acquisition cost, funded-account conversion, repeat-trader retention, and contribution margin by
      acquisition channel.
    whyItMatters: >-
      The campaign generated attention, but the assigned evidence does not show whether awareness became durable,
      economic liquidity.
    diligencePath: >-
      Obtain monthly cohorts split by campaign, partnership, organic, and referral source with funded conversion and
      ninety-day retention.
    relatedQuestionRefs:
      - QP006
      - QP007
  - type: conflicting-data
    severity: material
    topic: pricing
    missingEvidence: >-
      A timestamped, contract-level comparison of all-in fees, spreads, rebates, idle-cash yield, and promotional
      credits.
    whyItMatters: >-
      Published fee headlines use different trade types and denominators and can overstate a venue's realized price
      advantage.
    diligencePath: Reconcile official rulebooks and execute test orders on matched contracts under controlled size and timing.
    relatedQuestionRefs:
      - QP004
      - QP005
    relatedTableRefs:
      - TP002
      - TP003
  - type: missing-source
    severity: material
    topic: strategic-direction
    missingEvidence: >-
      Primary competitor roadmaps covering sports investment, API access, market-maker incentives, and planned
      distribution partnerships.
    whyItMatters: >-
      Large incumbents and broad exchanges could narrow Novig's sports specialization advantage faster than historical
      comparisons imply.
    diligencePath: >-
      Review current official product documentation, rulebooks, market-maker terms, and management statements for each
      priority competitor.
    relatedQuestionRefs:
      - QP002
      - QP008
    relatedTableRefs:
      - TP001
      - TP002
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: Realized market-maker fee schedules, net revenue, take rate, rebates, gross margin, CAC, retention, and payback.
    whyItMatters: >-
      Without these inputs, reported notional volume cannot be converted into revenue quality, contribution margin, or
      customer economics.
    diligencePath: >-
      Request monthly matched and settled notional, payer-level fees and rebates, recognized revenue, variable costs,
      and acquisition cohorts.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current unrestricted and restricted cash, debt, monthly burn, committed obligations, use of funds, and next-round
      trigger.
    whyItMatters: Capital raised and private valuation do not establish cash available or operating runway.
    diligencePath: Obtain the latest balance sheet, cash-flow statement, debt schedule, board-approved budget, and financing plan.
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: revenue-recognition
    missingEvidence: Accounting policy for market-maker fees, rebates, contract settlement, and gross-versus-net revenue presentation.
    whyItMatters: Revenue mix and recognition determine whether reported activity produces durable, comparable accounting revenue.
    diligencePath: >-
      Review audited financial statements, revenue footnotes, representative market-maker contracts, and rebate
      accounting.
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: regulatory-cost
    missingEvidence: Actual legal, compliance, clearing, and state-access costs associated with the federal exchange strategy.
    whyItMatters: >-
      Multi-state litigation and regulated-market operations may create material cash needs, but the assigned sources do
      not quantify them.
    diligencePath: >-
      Request legal accruals, outside-counsel budgets, regulatory staffing costs, clearing costs, and contingency
      scenarios.
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: matching-engine-performance
    missingEvidence: >-
      Audited matching engine tick-to-trade latency, order matching throughput benchmarks under peak NFL live
      concurrency, and failover failback telemetry.
    whyItMatters: >-
      High concurrency during major live sporting events stresses order routing and WebSocket data distribution; lack of
      latency SLAs prevents technical validation of exchange resilience against high-frequency market-maker arbitrage.
    diligencePath: >-
      Request engineering architecture documentation, load testing reports, peak live concurrency latency percentiles
      (p95/p99), and matching engine disaster recovery runbooks.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE001
      - TE003
  - type: private-evidence-only
    severity: material
    topic: retention-and-concentration
    missingEvidence: >-
      Absolute funded-account counts, monthly cohorts, 30/60/90-day repeat trading, churn, repeat deposits, customer
      acquisition cost, lifetime value, and revenue concentration.
    whyItMatters: >-
      Short-window acquisition growth cannot establish durable customer economics or channel concentration without
      cohort and unit-economic evidence.
    diligencePath: >-
      Request anonymized monthly acquisition cohorts by source, geography, deposit rail, trade frequency, net revenue,
      and 30/60/90-day retention.
    relatedQuestionRefs:
      - QU004
      - QU005
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      Named end-customer references with permission to verify production use, trading frequency, funding history, and
      satisfaction.
    whyItMatters: >-
      The public record contains anonymous user cohorts but no named end customer, so reference quality and longitudinal
      behavior cannot be independently tested.
    diligencePath: >-
      Obtain three referenceable customers across acquisition channels and conduct calls covering onboarding, repeat
      use, losses, support, and competing platforms.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: campaign-denominators
    missingEvidence: >-
      Absolute pre- and post-campaign counts for downloads, funded users, first-time depositors, active users, notional
      volume, and net revenue.
    whyItMatters: >-
      Percentage growth can look large from a small base and does not show whether higher activity translated into
      revenue or retained liquidity.
    diligencePath: >-
      Reconcile management's campaign dashboard to transaction logs and financial reporting for identical 20-day
      windows.
    relatedQuestionRefs:
      - QU002
      - QU006
  - type: conflicting-data
    severity: minor
    topic: coinflow-cohort-timing
    missingEvidence: >-
      A dated denominator and cutoff for Coinflow's statement that 50% of first-time purchasers in Q4 2026 used Coinflow
      rails.
    whyItMatters: >-
      The case study is dated April 2026 while the stated Q4 2026 period had not occurred, and the run date is only
      October 7, 2026, so the figure is not used in this chapter.
    diligencePath: >-
      Ask Coinflow and Novig for the intended quarter, publication date, cohort definition, absolute count, and
      supporting payment export.
    relatedQuestionRefs:
      - QU007
  - type: private-evidence-only
    severity: material
    topic: capital-burn-and-litigation-costs
    missingEvidence: >-
      Audited monthly operating cash burn figures, ongoing multi-state litigation legal expenses, and realized
