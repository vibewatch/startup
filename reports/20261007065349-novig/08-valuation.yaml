  - id: "valuation-context-and-pricing-discipline"
    title: "Capital Structure, Historical Valuation, and Pricing Discipline"
    body: "Novig's capital structure has expanded rapidly through consecutive institutional rounds. In August 2025, the company closed an $18M Series A, which was followed in February 2026 by a $75M Series B led by Pantera Capital with participation from Multicoin Capital, Makers Fund, Edge Equity, and legacy backers Forerunner, Perceptive Ventures, and NFX. The Series B closed at a $500M post-money valuation, bringing total cumulative capital raised to north of $105M. By autumn 2026, media reports and sources familiar with ongoing fundraising indicated that Novig was soliciting interest and negotiating terms for a new round expected to value the sports exchange at up to $2.0B—representing a 300% valuation expansion in less than eight months. Entering an investment at a $2.0B mark requires extreme pricing discipline. When benchmarked against annualized notional trading volume of approximately $4B reported at Series B, a $2.0B headline valuation implies a notional enterprise multiple of roughly 0.5x notional volume. However, because Novig operates as a zero-commission exchange for individual retail users and relies on proprietary or institutional market-maker arrangements for platform economics, its net revenue multiple is dramatically higher than that of traditional gaming operators. Traditional digital sportsbooks trade at 2x to 4x net gaming revenue, whereas Novig's implied valuation prices in immediate federal preemption immunity, nationwide dominance in sports derivatives, and successful monetization of high-frequency liquidity providers."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV007"
      - "CV008"
      - "CV011"
      - "CV014"
      - "CV016"
    tableRefs:
      - "TV001"
    figureRefs:
      - "FV001"
  - id: "scenarios-and-diligence-recommendation"
    title: "Scenario Analysis, Exit Pathways, and Diligence Strategy"
    body: "Evaluating Novig across discrete macroeconomic and regulatory scenarios clarifies the risk-reward asymmetry facing late-stage investors. In the Bull Scenario (20% probability), federal courts uphold Commodity Exchange Act preemption under the Supremacy Clause against state gaming enforcers, cementing Novig's nationwide footprint; trading volume compounds past $15B annualized, and institutional maker fees yield a sustainable 0.5% net take-rate, supporting a $3.5B to $5.0B enterprise valuation upon public listing or strategic acquisition by a global financial exchange. In the Base Scenario (50% probability), litigation results in a fragmented geographic landscape where several large states successfully restrict event contracts or impose local oversight; annualized notional volume stabilizes near $5B to $7B, supporting an equity valuation between $1.0B and $1.5B and requiring disciplined entry below the $2.0B asking mark. In the Bear Scenario (30% probability), state enforcement prevails or the CFTC adopts restrictive rulemakings regarding sports event contracts, severing retail bank payment rails and forcing Novig back into state-by-state gaming licensure; trading volume collapses, driving the valuation down to $300M to $500M and triggering down-round dilution. Given the wide valuation dispersion, unresolved state preemption litigation across five jurisdictions, and the absence of audited net revenue disclosures, the formal diligence recommendation is Track with a Medium confidence rating and High risk rating. Prospective investors must monitor four critical thesis-break triggers: federal court rulings on state preemption in New York and Wisconsin, audited disclosure of monthly net fee realization, user retention post-NFL season, and CFTC regulatory proceedings on sports event contract definitions."
