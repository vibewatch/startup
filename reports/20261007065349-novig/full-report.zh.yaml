  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义、零售流程与订单簿机制
        blocks:
          - type: paragraph
            body: >-
              Novig 将核心产品定义为专为体育预测打造的现代金融交易所，结构上不同于传统体育博彩平台承担风险、与用户对赌的模式。传统庄家会限制盈利账户并抽取 5% 至 10% 的 vigorish；Novig
              则让体育零售用户和量化交易者通过开放式中央限价订单簿（CLOB）交易。用户在应用内对价格 $0.01 至 $0.99 的二元赛事合约挂买卖单；赛事确认后，合约以 $1.00 结算，若结果未发生则以 $0.00
              结算。平台覆盖胜负盘、让分、大小分、实时比赛结果和专门的同场多腿串关，品类包括
              NFL、大学橄榄球、MLB、WNBA、NBA、网球和国际足球联赛。零售用户既可以按自定义概率阈值挂出限价单成为定价方，也可以立即吃掉已有买单成为价格接受方。去掉传统庄家利润后，Novig
              实现真正的点对点执行，价格发现反映市场共识，而非防御性的庄家调盘。

              客户流程覆盖桌面端和移动端，提供实时赔率计算与自定义投注单。交易者浏览活跃体育赛事，查看实时成交量和隐含概率，构建单场或多场串关，并在赛前单场市场免佣金交易。Novig 还以 Novig Ranks
              跟踪交易者表现，并通过官方 Discord
              社区讨论实时市场。不过，订单簿流动性本质上是双边的，零售订单能否成交取决于做市商持续参与，以及买卖价差附近的深度。传统体育博彩平台在庄家限额内保证即时接受对手盘；Novig
              的小众道具盘或流动性不足的市场，若没有相反方向的挂单，就可能延迟成交或部分成交。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
