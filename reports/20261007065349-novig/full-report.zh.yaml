        title: 护城河耐久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              Novig 的短期护城河由体育专门化、醒目低费率、订单簿用户体验、评测者所称的联邦交易所地位以及注意力驱动的分发共同构成，但没有任何一项被独立证明具有耐久性。Covers 报道，NFL 活动前三周 Novig 在
              11 家披露数据的运营商中排名第六，自 9 月 9 日以来名义交易量为 $1.14 billion；同一来源显示 Kalshi 与 Polymarket 的估值高得多。PredictReport
              进一步指出，NFL 和 MLB 之外的订单簿较薄、闲置现金无收益、也没有公开记录的
              API。这些弱点创造了替代路径：综合交易所可以用更广的流动性补贴体育业务，传统平台可以向熟悉的用户交叉销售，另一家体育交易所也能在单场比赛上争夺可执行价格。因此，投资逻辑不在于永久零费率，而在于可重复的流动性、留存、高效获客和可信结算——但这些指标在现有证据中都未披露。
