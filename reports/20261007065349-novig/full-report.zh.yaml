      - number: '8.2'
        title: 资本结构、历史估值与定价纪律
        blocks:
          - type: paragraph
            body: >-
              Novig 通过连续机构轮融资迅速扩充资本结构。2025 年 8 月，公司完成 $18M 的 A 轮融资；2026 年 2 月，Pantera Capital 领投 $75M 的 B 轮，Multicoin
              Capital、Makers Fund、Edge Equity 以及老股东 Forerunner、Perceptive Ventures 和 NFX 参投。B 轮收盘后投后估值为 $500M，累计融资超过
              $105M。到 2026 年秋季，媒体报道和熟悉募资进展的消息人士称，Novig 正为新一轮融资征集意向并谈判条款，预计体育交易所估值最高可达 $2.0B——不到 8 个月估值扩大 300%。以 $2.0B
              估值入场，需要极强的定价纪律。若以 B 轮披露的约 $4B 年化名义交易量作基准，$2.0B 的 headline 估值相当于约 0.5 倍名义交易量的企业价值倍数。但 Novig
              面向个人散户运营零佣交易所，并依靠自营或机构做市商安排支撑平台经济性，因此其净收入倍数会远高于传统博彩运营商。传统数字体育博彩平台按净博彩收入的 2–4 倍交易；Novig
              的隐含估值则已经计入立即获得联邦优先适用豁免、主导全国体育衍生品市场，以及成功从高频流动性提供者身上变现。
