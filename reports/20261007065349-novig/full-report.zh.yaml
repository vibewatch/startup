      - number: '1.2'
        title: 管理层、治理结构与关键人物依赖
        blocks:
          - type: paragraph
            body: >-
              Novig 由联合创始人、首席执行官 Jacob Fortinsky 和首席技术官 Kelechi Ukah 领导。Fortinsky 在 2016 年交易 Brexit
              及之后选举的政治预测合约后开始关注赛事预测；他在 Harvard 就读期间与 Ukah 一同研究体育博彩平台的低效，并逐步搭建体育交易所的数学基础。Ukah
              负责核心交易所基础设施、撮合引擎、市场连接和订单路由系统。到 2026 年初，公司全职员工从 14 人增至 50 多人，覆盖交易所运营、软件工程、监管合规和量化市场结构；外部跟踪数据库显示，截至 2026
              年中关联员工总数为 92 人。

              治理与资本结构由知名加密领域和早期风险投资机构支撑。Pantera Capital 领投 Novig 的 $75 million Series B，管理合伙人 Paul Veradittakit
              公开支持点对点交易所的市场机制。股权结构表中的机构投资者还包括 Multicoin Capital、Makers Fund、Edge Equity、Y Combinator、Lux
              Capital、NFX、Forerunner Ventures 和 Perceptive Ventures，NFL 名人堂四分卫 Joe Montana
              也提供了天使投资。董事席位尚未公开列明，但机构投资者对资本部署、监管诉讼和全国扩张拥有显著影响。公司在监管定位、联邦牌照执行和高曝光营销决策上高度依赖 Fortinsky。
