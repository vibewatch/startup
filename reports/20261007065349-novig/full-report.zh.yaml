      - number: '7.2'
        title: 交易所流动性深度、市场完整性与负责任交易治理
        blocks:
          - type: paragraph
            body: >-
              作为消除传统庄家优势的纯点对点赛事合约交易所，Novig 的运营可行性完全取决于零售参与者与机构流动性提供方之间持续的撮合流动性。NFL
              周日主要赛程和焦点比赛通常订单簿充足、买卖价差紧；但第三方评测记录，小众球员道具盘、非高峰对阵和实时比赛市场经常订单簿较薄，导致限价单无法成交和执行延迟。高交易量赛程期间，移动应用有时还会出现延迟和高峰登录缓慢。

              为应对社会和监管对年轻零售交易者日益增长的审视，Novig 于 2026 年 8 月 13 日把完整的负责任交易框架写入 Ludlow Exchange 规则手册第 14 章。该框架确立业内唯一的全国 21+
              年龄要求——不同于允许 18 岁交易的 Kalshi 和 Polymarket——             
              并要求用户存款和亏损控制、身份验证，同时限制“无风险”下注之类的促销主张。虽然这种自律立场降低了问题赌博暴露，但只允许 21 岁以上用户会限制年轻人群的漏斗顶端获客，合规成本还会带来需向 CFTC
              报告的持续监控义务。
