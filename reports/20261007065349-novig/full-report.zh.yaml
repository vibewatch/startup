      - number: '8.3'
        title: 情景分析、退出路径与尽调策略
        blocks:
          - type: paragraph
            body: >-
              把 Novig 放进不同宏观和监管情景中评估，可以看清后期投资者面临的风险收益不对称。牛市情景（概率 20%）下，联邦法院依据最高法条款认定《商品交易法》优先适用于州博彩执法，Novig
              因而巩固全国布局；交易量复合增长至年化 $15B 以上，机构做市费带来可持续的 0.5% 净抽成率，支持其上市或被全球金融交易所战略收购时达到 $3.5B–$5.0B 企业估值。基准情景（概率
              50%）下，诉讼造成地域割裂，数个大州成功限制事件合约或施加地方监管；年化名义交易量稳定在 $5B–$7B，支持 $1.0B–$1.5B 股权估值，投资者需在 $2.0B 要价以下纪律性入场。熊市情景（概率
              30%）下，州执法胜出，或 CFTC 对体育事件合约制定限制性规则，切断散户银行支付通道，迫使 Novig 回到逐州博彩牌照模式；交易量崩塌，估值降至
              $300M–$500M，并触发低价轮稀释。鉴于估值分布很宽、五个司法辖区的州级优先适用诉讼尚未解决，且缺少经审计的净收入披露，正式尽调建议为“跟踪”，信心为中等、风险为高。潜在投资者必须盯住四个关键论点失效触发点：纽约和威斯康星州级优先适用问题的联邦法院裁决、经审计的月度净费用变现披露、NFL
              赛季结束后的用户留存，以及 CFTC 对体育事件合约定义的监管程序。
