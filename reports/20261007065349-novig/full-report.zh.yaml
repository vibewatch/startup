  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、可寻址支出与产品替代
        blocks:
          - type: paragraph
            body: >-
              Novig
              的可寻址边界横跨高频体育博彩与联邦监管的赛事衍生品。公司将交易架构完全集中在体育结果，包括主要职业和大学赛事的赛前让分、大小分、胜负盘、球员道具盘、期货和实时衍生品。这个有意划定的产品边界排除了政治、宏观经济和娱乐赛事合约；这些品类在
              Kalshi、Polymarket 等综合预测平台占主导。Novig 因而让订单簿直接对接传统零售体育博彩生态。传统博彩平台通过设置不对称赔率收取内含庄家利润，即 vigorish 或 vig，双向盘口平均为
              5% 至 10%。Novig 去掉庄家这一交易对手，让用户点对点执行合约；仓位在二元边界（$1 或
              $0）结算，赛前单场直投撮合不收零售佣金。相关市场支出包括休闲用户下注、被风险厌恶的传统平台限制或封禁的专业用户交易额，以及寻求量化体育敞口而不愿承担资产负债表交易对手摩擦的机构流动性。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
