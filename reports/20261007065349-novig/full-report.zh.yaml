      - number: '2.2'
        title: 市场规模口径、交易速度与渗透底线
        blocks:
          - type: paragraph
            body: >-
              评估体育赛事衍生品市场时，必须区分博彩总周转额和交易所实际捕获的净收入。把媒体版权、真钱博彩周转和辅助分析数据合并计算，体育博彩与预测数据的 TAM 每年超过 $20 billion；其背后的全球博彩额超过
              $119 billion。SAM 聚焦美国受监管的线上体育博彩和赛事衍生品，在交易所机制合规运行的州，预计为 $12 billion 至 $15 billion 的博彩平台总收入。Novig 的 SOM
              是从活跃交易所流动性中提取的费用和机构数据变现，目前集中在高频参与者与量化做市商。Novig 于 2026 年 8 月 4 日推出受 CFTC 监管的预测市场后，周转快速扩大：2026 NFL
              赛季前三周累计名义交易量达 $1.14 billion，至 2026 年 10 月初累计跟踪交易量超过 $1.7 billion。但二元合约的面值为
              $1，名义交易量代表周转而非平台收入，后者仍受较低机构费率限制。
