            body: >-
              分发能力正转向能同时整合流动性与获客的品牌。Novig 选择集中式明星持股营销和 Mets 合作，而不是争取每个联盟的赞助；SCCG 报告称 Kalshi 与 Polymarket
              已建立更多大联盟关系。活动提升了认知，但品牌转移并不理想：5W Research 称 Novig 的提及量增长接近一个数量级以上，而只有 4% 的活动帖子提到应用。信任定位也有所不同。Covers 报道
