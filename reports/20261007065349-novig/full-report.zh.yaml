      - number: '2.4'
        title: 增长催化剂、监管摩擦与结构性逆风
        blocks:
          - type: paragraph
            body: >-
              体育预测交易所的扩张受联邦结构性顺风推动，却受到强烈辖区摩擦限制。主要增长动力来自 CFTC 的联邦监管定位。2026 年 6 月 16 日，CFTC 将 Novig 的运营实体 Ludlow Exchange
              LLC 指定为
              DCM，使其能够依据《商品交易法》全国交易体育合约。这一联邦框架让原本无法在州级体育博彩平台下注的机构资本——包括对冲基金和自营交易团体——得以把体育作为资产类别交易。与此同时，州博彩监管机构带来强烈阻力。Wisconsin、Massachusetts、New
              Mexico、New York 和 Washington 五州将联邦赛事合约指为无牌赌博，促使 Novig 提前提起联邦诉讼，主张宪法至上条款排除州法适用。Arizona、Michigan 和 Nevada
              三州也完全不在 Novig 的运营范围内。除监管暴露外，公司还面临营销留存难题：2026 年 9 月由持股合作方 Sydney Sweeney 出镜的活动把社交触达扩大到 3.98 billion 次，但 96%
              的讨论集中在明星而非应用，说明大众流行文化热度很难转化为持续活跃的交易流动性。
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
