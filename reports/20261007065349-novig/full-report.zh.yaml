  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 州级优先适用之争、CFTC 规则制定暴露与辖区摩擦
        blocks:
          - type: paragraph
            body: >-
              Novig 的核心法律论点是：子公司 Ludlow Exchange LLC 于 2026 年 6 月 16 日取得 CFTC 的 DCM
              资格后，受排他性的联邦衍生品管辖，依据美国宪法至上条款排除州赌博法规。州博彩机构正立即且激烈地挑战这一联邦优先适用理论。全国上线后（2026 年 8 月 4 日），Novig 主动在 New
              York、Massachusetts、Washington、New Mexico 和 Wisconsin 五个辖区提起联邦诉讼，要求禁止州官员对其交易所合约执行州赌博法。

              初步司法程序显示法律环境动荡。在 Wisconsin，Novig 将总检察长 Josh Kaul 和州博彩管理官 John Dillett 列为被告；联邦法官此前于 2026 年 7 月 28 日驳回 CFTC
              自身请求的初步禁令，认为该机构未能证明联邦优先适用主张胜诉的可能性。在 New York，联邦法院也拒绝立即发布阻止州执法的临时限制令。除州级执法外，Novig 还面临主要联邦监管者的重大风险：CFTC 于
              2026 年 6 月提出的规则将禁止与裁判决定、球员受伤和单个投球等具体比赛动作相关的赛事合约，而这些合约占 Novig 只做体育交易量的很大部分。
