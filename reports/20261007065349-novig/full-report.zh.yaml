          date: '2021-06-01'
          detail: Jacob Fortinsky 与 Kelechi Ukah 构想 Novig，旨在消除体育博彩水钱与封号问题。
        - label: 机构种子融资
          date: '2023-08-22'
          detail: Novig 获得 $2.5M 种子资金，由 Lux Capital、Y Combinator 及天使投资人 Joe Montana 支持。
        - label: Colorado 州博彩牌照
          date: '2023-10-15'
          detail: 获得 Colorado 体育博彩牌照，按州规试点免佣金交易所模式。
        - label: 退出 Colorado 市场
          date: '2024-04-15'
          detail: 放弃 Colorado 体育博彩牌照，转向轻资产、多州运营模式。
        - label: 抽奖框架上线
          date: '2024-09-01'
          detail: 在 42 个州推出双币抽奖平台，使用 Novig Coins 和可兑换的 Novig Cash。
        - label: Series A 融资轮
          date: '2025-08-11'
          detail: 以 $90M 投后估值融资 $18M Series A，用于扩大工程与流动性。
        - label: 联邦 CFTC DCM 申请
          date: '2026-01-21'
          detail: 向 CFTC 正式申请指定合约市场认定，以支持全国性交易所运营。
        - label: Series B 融资轮
          date: '2026-02-18'
          detail: 完成由 Pantera Capital 领投的 $75M Series B，估值 $500M，使累计融资超过 $105M。
        - label: CFTC DCM 监管批准
          date: '2026-06-16'
          detail: 获得 CFTC 授予的历史性联邦 DCM 认定，获准在 50 州推出体育预测交易所。
        - label: New York Mets 商业合作
          date: '2026-08-20'
          detail: 宣布与 MLB 球队 New York Mets 建立企业营销合作关系。
        - label: Sydney Sweeney 活动上线
          date: '2026-09-01'
          detail: 与股权持有人 Sydney Sweeney 推出高曝光全国广告活动，引发广泛媒体关注。
        - label: 估值增至 $2B
