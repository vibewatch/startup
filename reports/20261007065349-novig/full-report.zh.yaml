  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 核心投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              Novig 试图把体育事件合约定义为受联邦监管的金融衍生品，而不是由各州发牌的体育博彩，以此重塑美国体育博彩市场。看多论点的核心是监管可扩张性：作为受 CFTC 监管的指定合约市场，Novig
              无需逐州应对博彩委员会，就能在 47 个以上州开展全国性点对点事件交易。去掉传统体育博彩运营商的抽水（“vig”）后，散户和机构交易者都能获得更好的赔率与定价透明度，推动 2026 年 NFL 赛季前 3
              周的名义交易量达到 $1.14B。股权合作伙伴 Sydney Sweeney 主导的高强度消费者营销还展现了强劲的漏斗上层转化，月活用户环比增长 96%，首次入金用户增长
              218%。反论点则指出了威胁股权资本的结构性弱点。第一，Novig
              的免佣点对点模式没有披露净收入，也没有长期变现费率机制，单位经济性尚未在规模上得到验证。第二，威斯康星、纽约、马萨诸塞、新墨西哥和华盛顿的州检察长及博彩委员会认为体育事件合约违反州刑法，属于非法博彩，迫使
              Novig 陷入高风险优先适用诉讼。联邦法院若作出不利裁决，可能突然限制其进入关键可服务地区。第三，流动性深度仍集中在 NFL 早期比赛；成熟竞争对手 Kalshi 和 Polymarket
              拥有巨额资本储备（$1B+ 轮融资）及多品类订单簿，Novig 很难匹敌。
