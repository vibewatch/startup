    title: 公司演进与监管里程碑时间线
    type: timeline
    summary: Novig 从 2021 年大学时期构想到州级转向、联邦 CFTC 认定及 $2 billion 估值的时间脉络。
    approximationNotes: 里程碑日期对应公开新闻公告与监管申报确认。
