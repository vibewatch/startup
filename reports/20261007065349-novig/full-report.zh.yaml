              - CE008
              - CE010
          - type: callout
            title: 做市商不对称与流动性集中
            body: >-
              传统体育博彩平台让休闲用户与庄家风险对赌；Novig 则依赖通过开发者 API
              接入的算法做市商，提供紧密的双边订单簿。如果量化做市商在高波动体育时刻撤掉报价，零售用户就会面对流动性不足的价差或无法成交的订单，平台的核心零 vig 价值主张也会受到考验。
            calloutType: risk
