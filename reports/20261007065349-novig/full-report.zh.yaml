      - number: '3.2'
        title: 能力与定价取舍
        blocks:
          - type: paragraph
            body: >-
              当来源披露当前产品事实时，能力比较较为可靠；当营销页面取代经审计的市场深度数据时，比较就很弱。              Novig 的官方和独立对比页面都确认它只做体育，并允许用户挂价。Covers
              对费用主张作了限定：赛前单场直投目前不收交易费，但实时交易、部分期货和串关可能收取吃单费。Kalshi 提供广泛菜单和交易所规模；Polymarket 延伸至更多国际及小众体育和非体育赛事；ProphetX
              提供另一套体育订单簿；DraftKings 则以单合约收费提供熟悉的跨界路径。因此，Novig
              的价格优势取决于交易类型、价差和可用规模。现有来源无法证明撮合合约的实际全包成本或可执行深度，不能把醒目的费率表当作最佳执行的证据。
