            body: >-
              Novig 放弃 Colorado 最初的州级体育博彩牌照，转经抽奖模式，既保留了资本，又能迭代获客并积累足够交易规模，从而支持激进的联邦 CFTC 指定合约市场申请。2026 年 6 月取得 DCM
