      - number: '2.3'
        title: 参与者分层、流动性供给与采用流程
        blocks:
          - type: paragraph
            body: >-
              Novig 的双边市场由四类参与者构成：休闲零售用户、量化专业交易者、专有机构做市商和商业体育合作方。休闲用户追求有竞争力的价格、易用的移动端交易以及没有庄家优势；促销激励和社交媒体获客推动其参与。面对
              DraftKings、FanDuel 等传统平台的下注限额或封号，量化专业用户看中 Novig
              不限额的交易所定位和直接市场接入（DMA）。另一侧，机构做市商持续提供双边流动性，通过自动返佣和对非流动或复杂盘口收取 1% 至 4%
              的价差佣金获利。商业体育组织和企业合作方则是不断发展的机构客户，可购买数据授权和体育赞助分发服务，New York Mets 营销合作就是例子。不同于允许 18 岁用户开户的竞争对手，Novig 严格要求年满
              21 岁，使零售人群符合州级博彩标准，但牺牲了年轻成年用户的早期增长速度。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
