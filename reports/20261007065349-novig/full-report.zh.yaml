        title: 展示项
        blocks:
          - type: callout
            title: 支付通道是转化催化剂
            body: >-
              Novig 与 Coinflow 的集成说明，支付基础设施对体育交易用户转化至关重要。公司从受限的 ACH 单一入金切换到信用卡和加密货币多通道后，支付量增长 90%，交易批准率提升至
              95%，此前阻碍获客的关键开户瓶颈因此缓解。
            calloutType: insight
