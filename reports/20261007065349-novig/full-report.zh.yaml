      - number: '1.3'
        title: 融资历史、运营规模与营销曝光
        blocks:
          - type: paragraph
            body: >-
              Novig 于 2023 年 8 月完成约 $2.5 million 的早期种子轮融资，由 Lux Capital 和 Y Combinator 支持；随后于 2025 年 8 月以 $90 million
              估值完成 $18 million Series A。2026 年 2 月 18 日，公司完成由 Pantera Capital 领投的 $75 million Series B，累计股权融资超过 $105
              million（含早期历史轮次则为 $108 million），投后估值达到 $500 million。到 2026 年 9 月，在全国部署 CFTC 交易所后，多家媒体报道称 Novig 以 $2
              billion 估值获得追加成长融资，七个月内资本规模翻了四倍。

              2025 至 2026 年，平台交易速度大幅提升。公司称 2025 年交易量增长 10 倍，年化交易额超过 $4 billion；到 2026 年中，累计平台交易量超过 $5 billion。2026 NFL
              赛季最初三周，Aldrin Research 记录 Novig 的名义交易额为 $1.14 billion，在所有披露数据的美国预测市场中排名第六。为提升大众品牌认知，Novig 在 2025 年末和 2026
              年采取激进营销：2026 年 8 月与 New York Mets 建立 MLB 官方球队合作，2026 年 9 月推出由持股合作演员 Sydney Sweeney
              出镜的高曝光广告。活动让品牌提及量增长接近一个数量级、潜在触达扩大到 3.98 billion 次，但独立媒体测量显示，96% 的公开讨论集中在 Sweeney 的创意表现，而非 Novig
              交易应用本身，暴露出品牌转移不对称和媒体反噬风险。
