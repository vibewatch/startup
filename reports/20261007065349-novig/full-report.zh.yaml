      - number: '7.3'
        title: 促销合作方声誉、资本集中与商业依赖
        blocks:
          - type: paragraph
            body: >-
              Novig 的快速增长高度依赖集中的促销合作和高资本获客。2026 年 9 月，公司推出由演员 Sydney Sweeney 主演的“Just Sports”广告攻势；她同时是持股战略合作方。首席执行官
              Jacob Fortinsky 承认，活动在 NFL 赛季前消耗了 Novig 营销预算的大部分。5W Research 和 Peak Metrics
              的独立媒体分析发现严重的品牌转移不对称：品牌提及量增长接近一个数量级、触达扩大到 3.98 billion 次，但 96% 的公开社交讨论聚焦 Sweeney 的创意表现及相关运动员反弹，而不是 Novig
              交易产品；只有 4% 提到应用。

              Novig 还依赖机构做市商持续撮合订单，依赖商业联盟关系（包括遵守 NFL 对裁判判罚或可知事件的合约限制），并依赖银行转账和信用卡处理通道。公司虽于 2026 年 2 月完成 Pantera Capital
              领投的 $75 million Series B，并据报道于 2026 年 9 月以 $2 billion
              估值获得后续融资，但要维持高现金消耗获客策略并同时应对五起联邦诉讼，公司容易受到做市商费率压缩和上诉法院不利裁决的影响。
