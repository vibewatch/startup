        title: 展示项
        blocks:
          - type: callout
            title: 体育博彩平台 vig 的结构性去中介化
            body: Novig 通过取消 5% 至 10% 的零售庄家利润，挑战传统体育博彩平台。Novig 超过 90% 的交易以点对点方式完成，说明当价格更优、下注条件不惩罚用户时，体育用户确实愿意采用交易所限价订单簿。
            calloutType: insight
            claimRefs:
