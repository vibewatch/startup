  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              Novig 面对的是分层竞争，而不是单一同行集合。直接交易所竞争者包括 Kalshi、Polymarket；它们赛事菜单更广、公开估值更高，拥有更多跨品类流动性与分发能力。ProphetX
              是最接近的体育专门交易所。DraftKings、FanDuel 等传统平台可以凭借熟悉的界面和既有客户关系，把赛事合约带给体育用户。Underdog、Gemini、Crypto.com 和 OG
              等相邻应用，则把预测合约与幻想体育、加密资产或更广泛的交易体验打包。传统体育博彩平台仍是现状替代品：它能立即提供固定赔率，而交易所允许用户接受或挂出价格，但要承担无法成交的风险。用户自己的定价模型不是交易场所，也不能创造交易对手流动性；它只会提高比较多个交易所的价值。因此，Novig
              赢得的是“专注体育价格发现”这一具体任务，而不是替代完整的预测市场栈。
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP006
              - CP009
