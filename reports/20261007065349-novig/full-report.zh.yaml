chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、产品架构与运营模式演变
        blocks:
          - type: paragraph
            body: >-
              Novig（Novig Betting, Inc.）由 Harvard 毕业生 Jacob Fortinsky 和 Kelechi Ukah 于 2021 年创办，总部登记在纽约 Brooklyn 的 20
              Jay Street。平台源于对传统体育博彩平台的不满：后者会限制或封禁盈利用户，同时收取被称为 vigorish 的隐性加价。Novig
              不采用“庄家对赌”模式，不让用户亏损直接变成庄家收入，而是运营开放式体育订单簿交易所，让零售参与者与机构流动性提供方直接交易体育合约。市场赔率与成交价格完全由订单簿上的供需决定，不再扣除传统体育博彩平台的庄家利润。

              Novig 的监管路径经历了三个运营阶段。公司最初按州级体育博彩框架运营，并于 2023 年 10 月取得 Colorado 运营牌照。但由于州博彩委员会维护既有税收收益、对其施压，Novig 于 2024 年
              4 月交回 Colorado 牌照。2024 年 9 月，公司转为双币抽奖框架，在 42 个州同时使用免费游玩的 Novig Coins 和可兑换的 Novig Cash。California、New
              Jersey 等关键辖区开始禁止模拟赌博的抽奖产品后，Novig 于 2026 年 1 月向 Commodity Futures Trading
              Commission（CFTC）申请成为受联邦监管的指定合约市场（DCM）。              CFTC 于 2026 年 6 月授予 DCM
              资格，允许公司在统一的联邦市场监控和规则下全国交易赛事合约，并要求参与者至少 21 岁。
