      - number: '3.2'
        title: Capability and pricing trade-offs
        blocks:
          - type: paragraph
            body: >-
              The capability comparison is strongest where the sources expose current product facts and weakest where
              promotional pages substitute for audited market-depth data. Novig's official and independent comparison
              pages agree that it is sports-only and allows users to post prices. Covers narrows the fee claim: pregame
              straight trades currently carry no trading fee, but live trades, certain futures, and parlays can carry
              taker fees. Kalshi offers a broad menu and exchange scale; Polymarket extends into more international and
              niche sports as well as non-sports events; ProphetX provides another sports order book; and DraftKings
              provides a familiar crossover path with per-contract charges. This makes Novig's price advantage
              conditional on the trade type, spread, and available size. The source set does not establish realized
              all-in cost or executable depth for matched contracts, so headline fee schedules should not be treated as
              proof of best execution.
