      - number: '1.3'
        title: Financing History, Operational Scale, and Promotional Exposure
        blocks:
          - type: paragraph
            body: >-
              Novig raised an early seed round of approximately $2.5 million in August 2023 backed by Lux Capital and Y
              Combinator, followed by an $18 million Series A in August 2025 at a $90 million valuation. On February 18,
              2026, the company closed a $75 million Series B led by Pantera Capital, bringing total equity capital
              raised to over $105 million ($108 million including historical early rounds) and establishing a post-money
              valuation of $500 million. By September 2026, following nationwide CFTC exchange deployment, multiple
              media outlets reported that Novig raised additional growth financing at a $2 billion valuation,
              quadrupling its capitalization within seven months.


              Platform trading velocity accelerated dramatically through 2025 and 2026. After reporting 10x volume
              growth during 2025 to achieve an annualized trading run rate exceeding $4 billion, cumulative platform
              volume surpassed $5 billion by mid-2026. During the initial three weeks of the 2026 NFL season, Aldrin
              Research recorded $1.14 billion in notional trading handle on Novig, positioning it sixth among all
              reporting U.S. prediction market venues. To build mainstream brand awareness, Novig executed an aggressive
              marketing strategy in late 2025 and 2026, securing an official MLB franchise partnership with the New York
              Mets in August 2026 and launching a high-profile advertising campaign featuring equity-partner actress
              Sydney Sweeney in September 2026. While the campaign drove a ninefold increase in brand mentions and
              expanded potential reach to 3.98 billion impressions, independent media measurement showed that 96% of
              public commentary centered on Sweeney's creative portrayal rather than the Novig trading application
              itself, demonstrating significant brand-transfer asymmetry and media backlash risks.
