  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Addressable Spend, and Product Substitutes
        blocks:
          - type: paragraph
            body: >-
              The addressable boundary for Novig bridges high-velocity sports wagering and federally supervised event
              derivatives. Novig concentrates its transaction architecture entirely on sports outcomes, including
              pregame spreads, totals, moneylines, player props, futures, and in-play derivatives across major
              professional and collegiate competitions. This deliberate product boundary excludes political,
              macroeconomic, and entertainment event contracts that dominate generalized prediction platforms such as
              Kalshi and Polymarket. In doing so, Novig positions its order book directly against the traditional retail
              sportsbook ecosystem. Conventional sportsbooks extract a built-in house margin—commonly known as the
              vigorish or vig—averaging 5% to 10% on two-way lines by pricing asymmetric odds. Novig disintermediates
              the bookmaker counterparty, facilitating peer-to-peer contract execution where positions settle at binary
              boundaries ($1 or $0) and order matching incurs zero retail commission on pregame straight wagers. The
              relevant market spend encompasses recreational bettor stakes, sharp bettor turnover currently restricted
              or limited by risk-averse sportsbooks, and institutional liquidity seeking quantitative sports exposure
              without balance-sheet counterparty friction.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM004
