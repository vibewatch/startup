  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition, Retail Workflow, and Order Book Mechanics
        blocks:
          - type: paragraph
            body: >-
              Novig defines its core product as a modern financial exchange engineered specifically for sports
              prediction, departing structurally from the risk-bearing, against-the-house model of traditional
              sportsbooks. Rather than competing against an odds-making house that limits winning accounts and extracts
              5% to 10% in vigorish, retail sports fans and quantitative traders interact through an open central limit
              order book (CLOB). Inside the Novig application, users place bids and offers on binary event contracts
              priced between $0.01 and $0.99 that settle at $1.00 upon verified event resolution or $0.00 if the outcome
              fails. The platform covers moneyline winners, point spreads, over/under totals, in-game live outcomes, and
              specialized multi-leg same-game parlays across NFL, college football, MLB, WNBA, NBA, tennis, and
              international soccer leagues. Retail users can act as price-makers by posting resting limit orders at
              custom probability thresholds or price-takers executing instantly against resting bids. By eliminating the
              traditional bookmaker hold, Novig delivers true peer-to-peer execution where price discovery reflects
              aggregate market consensus rather than defensive sportsbook odds shading.


              The customer workflow operates across desktop and mobile application touchpoints with real-time odds
              calculation and custom bet slips. Traders browse active sports events, inspect live traded volumes and
              implied probabilities, construct single or multi-event parlay slips, and execute transactions
              commission-free on pregame straight markets. Novig supplements core order matching with specialized
              community and gamification surfaces, including Novig Ranks for trader performance tracking and an official
              Discord community for real-time market discussion. However, because order-book liquidity is fundamentally
              two-sided, retail order fulfillment depends on continuous market-maker engagement and depth at tight
              bid-ask spreads. Unlike retail sportsbooks that guarantee instant counterparty acceptance up to house
              limits, illiquid or niche prop markets on Novig can experience execution delays or partial fills if
              resting opposite-side limit orders are absent.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
