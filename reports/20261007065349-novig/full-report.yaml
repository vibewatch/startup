      - number: '8.3'
        title: Scenario Analysis, Exit Pathways, and Diligence Strategy
        blocks:
          - type: paragraph
            body: >-
              Evaluating Novig across discrete macroeconomic and regulatory scenarios clarifies the risk-reward
              asymmetry facing late-stage investors. In the Bull Scenario (20% probability), federal courts uphold
              Commodity Exchange Act preemption under the Supremacy Clause against state gaming enforcers, cementing
              Novig's nationwide footprint; trading volume compounds past $15B annualized, and institutional maker fees
              yield a sustainable 0.5% net take-rate, supporting a $3.5B to $5.0B enterprise valuation upon public
              listing or strategic acquisition by a global financial exchange. In the Base Scenario (50% probability),
              litigation results in a fragmented geographic landscape where several large states successfully restrict
              event contracts or impose local oversight; annualized notional volume stabilizes near $5B to $7B,
              supporting an equity valuation between $1.0B and $1.5B and requiring disciplined entry below the $2.0B
              asking mark. In the Bear Scenario (30% probability), state enforcement prevails or the CFTC adopts
              restrictive rulemakings regarding sports event contracts, severing retail bank payment rails and forcing
              Novig back into state-by-state gaming licensure; trading volume collapses, driving the valuation down to
              $300M to $500M and triggering down-round dilution. Given the wide valuation dispersion, unresolved state
              preemption litigation across five jurisdictions, and the absence of audited net revenue disclosures, the
              formal diligence recommendation is Track with a Medium confidence rating and High risk rating. Prospective
              investors must monitor four critical thesis-break triggers: federal court rulings on state preemption in
              New York and Wisconsin, audited disclosure of monthly net fee realization, user retention post-NFL season,
              and CFTC regulatory proceedings on sports event contract definitions.
