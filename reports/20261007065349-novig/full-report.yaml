  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: A disclosed payer, but no disclosed take rate
        blocks:
          - type: paragraph
            body: >-
              Novig describes a two-sided exchange rather than a sportsbook that earns from customer losses. In a
              founder interview, the company said institutional market makers are the paying side and retail trading is
              commission-free. CNBC separately reported the founder's description that the platform makes money from
              trading activity rather than game outcomes. The official site shows an active order-book interface and
              per-market traded amounts, which supports the existence of transaction activity but not the amount
              recognized as revenue. No assigned source provides a market-maker fee schedule, realized take rate,
              revenue mix, contract duration, rebate structure, or revenue-recognition policy. The mechanism is
              therefore intelligible, while the economics remain unavailable for underwriting.
            claimRefs:
              - CI001
              - CI002
              - CI016
