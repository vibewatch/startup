      - number: '3.3'
        title: Distribution, trust, and multi-homing
        blocks:
          - type: paragraph
            body: >-
              Distribution power is shifting toward brands that can combine liquidity with customer acquisition. Novig
              chose a concentrated celebrity-equity campaign and a Mets partnership rather than trying to win every
              league sponsorship; SCCG reports that Kalshi and Polymarket have secured more major-league relationships.
              The campaign delivered awareness but imperfect brand transfer: 5W Research reported more than a ninefold
              increase in Novig mentions while only 4% of campaign posts named the app. Trust positioning is also
              differentiated. Covers reports that Novig requires users to be 21 or older and accepted an NFL request to
              exclude specified manipulable or objectionable markets. These choices may support a sports-specific trust
              narrative, but they do not remove regulatory or liquidity risk. Because exchanges price the same event
              independently, active users have a rational reason to multi-home and compare price, spread, and fillable
              size rather than accept platform lock-in.
            claimRefs:
              - CP009
              - CP011
              - CP012
              - CP013
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP006
              - CP010
              - CP012
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Novig's near-term moat is a bundle of sports specialization, low headline fees, order-book UX, federal
              exchange status as reported by reviewers, and attention-led distribution. None is independently proven
              durable. Covers reports that Novig ranked sixth among eleven reporting operators during the first three
              weeks of NFL activity, despite $1.14 billion of notional volume since September 9; the same source reports
              much higher valuations for Kalshi and Polymarket. PredictReport further flags thin books outside NFL and
              MLB, no yield on idle cash, and no documented public API. Those weaknesses create displacement paths:
              general exchanges can subsidize sports from broader liquidity, sportsbook incumbents can cross-sell
              familiar users, and another sports exchange can compete on a single game's executable price. The
              investment case therefore depends less on a permanent zero-fee claim than on repeat liquidity, retention,
              efficient acquisition, and trusted settlement—metrics not disclosed in the assigned evidence.
            claimRefs:
              - CP007
              - CP008
              - CP010
              - CP011
              - CP012
              - CP015
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Fee leadership is not execution leadership
            body: >-
              A zero fee on a defined trade type does not prove a lower all-in cost when spreads, available size,
              idle-cash economics, and exit liquidity are not normalized.
            calloutType: risk
            claimRefs:
              - CP002
              - CP007
