      - number: '1.2'
        title: Executive Leadership, Governance Structure, and Key-Person Dependency
        blocks:
          - type: paragraph
            body: >-
              Novig is led by its co-founders, Chief Executive Officer Jacob Fortinsky and Chief Technology Officer
              Kelechi Ukah. Fortinsky became fascinated by event forecasting after trading political prediction
              contracts around Brexit in 2016 and subsequent elections, later formulating the mathematical basis for a
              sports trading exchange alongside Ukah while analyzing sportsbook inefficiencies as undergraduates at
              Harvard. Ukah directs core exchange infrastructure engineering, matching engines, market connectivity, and
              order routing systems. By early 2026, the company's full-time headcount expanded from 14 employees to more
              than 50 personnel, spanning exchange operations, software engineering, regulatory compliance, and
              quantitative market-structure specialists, with external tracking databases recording 92 total associated
              employees by mid-2026.


              Governance and capitalization are anchored by prominent crypto-focused and early-stage venture capital
              institutions. Pantera Capital led Novig's $75 million Series B round, with Managing Partner Paul
              Veradittakit championing peer-to-peer exchange market mechanics. Institutional investors on the cap table
              also include Multicoin Capital, Makers Fund, Edge Equity, Y Combinator, Lux Capital, NFX, Forerunner
              Ventures, and Perceptive Ventures, alongside angel backing from NFL Hall of Fame quarterback Joe Montana.
              While board seats have not been publicly itemized, institutional venture backers maintain significant
              influence over strategic capital deployment, regulatory legal battles, and national expansion initiatives.
              The company exhibits substantial key-person dependence on Fortinsky for public regulatory positioning,
              federal licensing execution, and high-profile marketing decisions.
