      - number: '4.2'
        title: Notional trading volume is traction, not revenue
        blocks:
          - type: paragraph
            body: >-
              The public traction record is strong but consists primarily of company-reported or third-party-reported
              notional volume. AlleyWatch relayed a company claim of more than $4 billion in annualized volume after
              tenfold growth during 2025. CNBC later reported Novig's claims of more than $5 billion in cumulative
              volume and more than $8 billion in annualized volume. Covers, citing Aldrin Research, reported $1.14
              billion of notional volume from September 9 through the first three weeks of the NFL season. These periods
              and definitions differ, so they should not be combined into a growth series. None is ARR or accounting
              revenue, and no public conversion rate from notional trading activity to recognized revenue is supplied.
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI016
      - number: '4.3'
        title: Marketing created attention, but efficiency is unmeasured
        blocks:
          - type: paragraph
            body: >-
              Public GTM evidence centers on the Sydney Sweeney campaign rather than a repeatable sales-efficiency
              dataset. 5W Research reported that brand mentions increased more than ninefold after launch, while only 4%
              of the measured posts named the Novig app. The same source relayed the CEO's statement that the campaign
              consumed the bulk of the marketing budget before the NFL season. Those observations establish reach and
              budget concentration, not CAC, activation, retention, deposit conversion, or payback. The evidence also
              does not quantify market-maker acquisition costs or incentives. A financially useful GTM assessment
              therefore requires channel-level spend and cohort outcomes rather than social attention alone.
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI016
      - number: '4.4'
        title: Financing is visible; available cash and obligations are not
        blocks:
          - type: paragraph
            body: >-
              The founder told AlleyWatch that Novig had raised $108 million in total, including a $75 million Series B
              led by Pantera Capital. CNBC independently reported the Series B and described total capital raised as
              more than $105 million, broadly corroborating the scale while preserving different wording and dates. The
              Wall Street Journal then reported new financing at a $2 billion valuation without disclosing the amount.
              Funding raised is not cash on hand: the assigned sources provide no balance-sheet cash, monthly burn,
              debt, project-finance obligations, runway, use-of-funds schedule, or next-round trigger. Capital needs may
              also be influenced by the cost of defending the federal exchange model, because Novig has pursued
              litigation involving five states.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI013
              - CI014
              - CI016
      - number: '4.5'
        title: 'Financial verdict: promising activity, insufficient revenue proof'
        blocks:
          - type: paragraph
            body: >-
              Novig has an identifiable payer, visible market activity, reported volume growth, regulatory progress, and
              substantial external financing. Those facts support a credible commercialization thesis, but not a
              financeable base case. EquityZen's public profile explicitly places revenue and financial information
              behind an accreditation workflow, while the broader assigned evidence set supplies no audited revenue,
              take rate, gross margin, operating expense, cash, burn, or runway. The key diligence blocker is a monthly
              bridge from matched notional volume to gross revenue, rebates, transaction and clearing costs,
              contribution margin, and cash movement. Until that bridge and cohort-level acquisition economics are
              produced, revenue quality, margin scalability, and capital adequacy should remain unverified rather than
              estimated.
            claimRefs:
              - CI015
              - CI016
          - type: table
