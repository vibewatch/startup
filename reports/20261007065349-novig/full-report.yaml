      - number: '2.3'
        title: Participant Segmentation, Liquidity Provision, and Adoption Workflows
        blocks:
          - type: paragraph
            body: >-
              Novig's two-sided marketplace balances four distinct participant segments: recreational retail bettors,
              quantitative sharp traders, proprietary institutional market makers, and commercial sports partners.
              Recreational retail traders seek competitive pricing, user-friendly mobile execution, and absence of house
              edge, driven by promotional incentives and social media brand acquisition. Quantitative sharp bettors, who
              face restrictive wager limits or outright account closures on legacy sportsbooks like DraftKings and
              FanDuel, adopt Novig for its non-limiting exchange posture and direct market access (DMA). On the opposing
              side, institutional market makers provide continuous two-sided liquidity, capturing automated rebates and
              spread commissions ranging from 1% to 4% on illiquid or complex lines. Furthermore, commercial sports
              organizations and enterprise partners represent an evolving institutional segment for data licensing and
              sports sponsorship distribution, exemplified by Novig's marketing collaboration with the New York Mets.
              Unlike competing prediction exchanges that onboard participants at age 18, Novig enforces a strict
              21-and-over age gate, aligning its retail demographic with state-level gaming standards while sacrificing
              early adult user onboarding velocity.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM009
