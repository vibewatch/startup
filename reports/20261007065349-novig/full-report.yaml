      - number: '2.4'
        title: Growth Catalysts, Regulatory Friction, and Structural Headwinds
        blocks:
          - type: paragraph
            body: >-
              The expansion trajectory of sports prediction exchanges is propelled by structural federal tailwinds and
              constrained by intense jurisdictional friction. A primary growth driver is the federal regulatory posture
              under the Commodity Futures Trading Commission (CFTC). On June 16, 2026, the CFTC designated Novig's
              operating entity, Ludlow Exchange LLC, as a Designated Contract Market (DCM), enabling nationwide sports
              contract trading under the Commodity Exchange Act. This federal umbrella allows institutional
              capital—including hedge funds and proprietary trading groups barred from wagering on state sportsbooks—to
              trade sports as an asset class. Conversely, the market faces acute friction from state gaming regulators.
              Five states—Wisconsin, Massachusetts, New Mexico, New York, and Washington—have challenged federal event
              contracts as unlicensed gambling, prompting Novig to file preemptive federal lawsuits arguing
              constitutional Supremacy Clause preemption. Additionally, three states (Arizona, Michigan, and Nevada)
              remain entirely excluded from Novig's operating footprint. Beyond regulatory exposure, Novig faces
              critical marketing retention hurdles: while its September 2026 campaign featuring equity partner Sydney
              Sweeney expanded social reach to 3.98 billion, 96% of discourse centered on the talent rather than the
              app, emphasizing the difficulty of converting broad pop-culture buzz into sustained active trading
              liquidity.
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Structural Disintermediation of the Sportsbook Vig
            body: >-
              Novig's exchange model challenges traditional sportsbooks by removing the 5% to 10% retail house margin.
              Over 90% of Novig's trades are executed peer-to-peer, establishing that sports bettors actively embrace an
              exchange limit order book when offered superior pricing and non-punitive wagering terms.
            calloutType: insight
            claimRefs:
              - CM003
              - CM004
          - type: callout
            title: Dual Jurisdictional Friction and Marketing Conversion Drag
            body: >-
              Novig's addressable expansion faces a double bottleneck: state attorneys general are actively challenging
              federal CFTC preemption across five jurisdictions, while viral pop-culture marketing campaigns generated
              massive attention that skewed 96% toward celebrity talent rather than app adoption.
            calloutType: risk
            claimRefs:
              - CM014
              - CM015
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              Novig competes in a layered field rather than a single peer set. Direct exchange competitors include
              Kalshi and Polymarket, whose broader event menus and larger reported valuations give them more
              cross-category liquidity and distribution, and ProphetX, the closest like-for-like sports-focused
              exchange. Incumbent sportsbook brands such as DraftKings and FanDuel can use familiar interfaces and
              existing customer relationships to bring event contracts to sports bettors. Adjacent apps, including
              Underdog, Gemini, Crypto.com, and OG, bundle prediction contracts with fantasy, crypto, or broader trading
              experiences. The traditional sportsbook remains the status-quo substitute: it supplies a fixed line
              immediately, whereas an exchange lets users accept or post prices but exposes them to fill risk. A
              bettor's internal pricing model is not a venue and cannot create counterparty liquidity; it instead
              increases the value of comparing multiple exchanges. Novig therefore wins a specific job—focused sports
              price discovery—rather than replacing the full prediction-market stack.
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP006
              - CP009
              - CP016
