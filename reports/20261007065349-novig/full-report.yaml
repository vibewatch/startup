  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Core Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              Novig presents an ambitious attempt to reshape US sports wagering by treating event contracts as federally
              regulated financial derivatives rather than state-licensed sports betting. The bull thesis centers on
              regulatory scalability: operating as a CFTC-regulated Designated Contract Market allows Novig to offer
              nationwide peer-to-peer event trading across 47 or more states without navigating individual state gaming
              commissions. Eliminating traditional sports betting operator hold (the 'vig') produces superior odds and
              pricing transparency for retail and institutional traders alike, which catalyzed $1.14B in notional volume
              during the first three weeks of the 2026 NFL season. Furthermore, high-velocity consumer marketing led by
              equity partner Sydney Sweeney demonstrated powerful top-of-funnel conversion, lifting active users by 96%
              month-over-month and first-time depositors by 218%. Conversely, the anti-thesis highlights structural
              vulnerabilities that threaten equity capital. First, Novig's commission-free peer-to-peer model lacks
              disclosed net revenue and long-term monetized take-rate mechanics, leaving unit economics unproven at
              scale. Second, state attorneys general and gaming commissions in Wisconsin, New York, Massachusetts, New
              Mexico, and Washington argue that sports event contracts constitute illegal wagering under state penal
              codes, forcing Novig into high-stakes preemption litigation. An adverse judicial outcome in federal court
              could abruptly restrict access to key addressable territories. Third, liquidity depth remains concentrated
              in early NFL matchups, with established competitors Kalshi and Polymarket holding massive capital reserves
              ($1B+ rounds) and multi-category order books that Novig cannot easily match.
            claimRefs:
