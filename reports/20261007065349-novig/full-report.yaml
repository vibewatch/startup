figures:
  - id: FO001
    title: Corporate Evolution and Regulatory Milestone Timeline
    type: timeline
    summary: >-
      Chronological trajectory of Novig from university ideation in 2021 through state pivots, federal CFTC designation,
      and $2 billion valuation.
    approximationNotes: Milestone dates correspond to public press announcements and regulatory filing confirmations.
    data:
      items:
        - label: Ideation at Harvard
          date: '2021-06-01'
          detail: Jacob Fortinsky and Kelechi Ukah conceptualize Novig to eliminate sportsbook vigorish and account bans.
        - label: Institutional Seed Financing
          date: '2023-08-22'
          detail: Novig secures $2.5M in seed funding backed by Lux Capital, Y Combinator, and angel investor Joe Montana.
        - label: Colorado State Wagering License
          date: '2023-10-15'
          detail: Secures Colorado sports betting license to pilot commission-free exchange model under state rules.
        - label: Colorado Market Withdrawal
          date: '2024-04-15'
          detail: Relinquishes Colorado sports wagering license to pivot toward an asset-light, multi-state operational model.
        - label: Sweepstakes Framework Launch
          date: '2024-09-01'
          detail: Rolls out dual-currency sweepstakes platform across 42 states using Novig Coins and redeemable Novig Cash.
        - label: Series A Financing Round
          date: '2025-08-11'
          detail: Raises $18M Series A funding at a $90M post-money valuation to scale engineering and liquidity.
        - label: Federal CFTC DCM Application
          date: '2026-01-21'
          detail: >-
            Files formal application with the CFTC for Designated Contract Market designation to enable nationwide
            exchange.
        - label: Series B Financing Round
          date: '2026-02-18'
          detail: Closes $75M Series B led by Pantera Capital at $500M valuation, expanding total funding to over $105M.
        - label: CFTC DCM Regulatory Approval
          date: '2026-06-16'
          detail: >-
            Receives historic federal DCM designation from CFTC, authorizing 50-state sports prediction exchange
            rollout.
        - label: New York Mets Commercial Deal
          date: '2026-08-20'
          detail: Announces corporate marketing partnership with MLB franchise New York Mets.
        - label: Sydney Sweeney Campaign Launch
          date: '2026-09-01'
          detail: >-
            Debuts high-profile national ad campaign with equity-holder Sydney Sweeney, sparking widespread media
            attention.
        - label: Valuation Quadrupling to $2B
          date: '2026-09-30'
          detail: Reports surface indicating Novig secured growth financing at a $2B valuation following $1.14B in NFL handle.
    claimRefs:
