  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: State Preemption Battles, CFTC Rulemaking Exposure, and Jurisdictional Friction
        blocks:
          - type: paragraph
            body: >-
              Novig's core legal thesis rests on the assertion that its subsidiary Ludlow Exchange LLC, having obtained
              Designated Contract Market (DCM) designation from the Commodity Futures Trading Commission (CFTC) on June
              16, 2026, operates under exclusive federal derivatives jurisdiction that preempts state gambling
              regulations via the U.S. Constitution's Supremacy Clause. This federal preemption doctrine is facing
              immediate and aggressive challenges from state gaming authorities. Following its nationwide launch on
              August 4, 2026, Novig proactively filed federal lawsuits across five separate jurisdictions—New York,
              Massachusetts, Washington, New Mexico, and Wisconsin—seeking to enjoin state officials from enforcing
              state gambling statutes against its exchange contracts.


              Initial judicial proceedings indicate substantial legal turbulence. In Wisconsin, where Novig named
              Attorney General Josh Kaul and state gaming administrator John Dillett, a federal judge previously denied
              a preliminary injunction requested by the CFTC itself on July 28, 2026, ruling that the agency failed to
              establish a likelihood of success on its federal preemption claim. In New York, the federal court declined
              to grant an immediate temporary restraining order blocking state enforcement. Beyond state-level
              enforcement, Novig faces significant regulatory risk from its primary federal regulator: the CFTC's June
              2026 proposed rulemaking would prohibit event contracts tied to officiating decisions, player injuries,
              and discrete in-game actions such as individual pitches—contract structures that represent a major portion
              of Novig's sports-only trading volume.
            claimRefs:
              - CR001
