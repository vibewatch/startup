chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Product Architecture, and Operating Model Evolution
        blocks:
          - type: paragraph
            body: >-
              Novig (Novig Betting, Inc.) was established in 2021 by Harvard graduates Jacob Fortinsky and Kelechi Ukah,
              with headquarters registered at 20 Jay Street in Brooklyn, New York. The platform was created out of
              frustration with incumbent sportsbooks that limit or ban profitable bettors while charging hidden markups
              known as vigorish. Rather than operating an against-the-house wagering model where customer losses
              directly generate bookmaker revenue, Novig operates an open order-book sports exchange where retail
              participants and institutional liquidity providers trade sports contracts directly against one another.
              Market odds and transaction pricing are established entirely through supply and demand on an order book
              without traditional sportsbook margin deductions.


              Novig's regulatory path has evolved across three distinct operational phases. The company initially
              launched under traditional state sports wagering frameworks, securing an operator license in Colorado in
              October 2023. However, encountering resistance from state gaming commissions protective of incumbent tax
              yields, Novig returned its Colorado license in April 2024. In September 2024, Novig migrated to a
              dual-currency sweepstakes framework using free-to-play Novig Coins alongside redeemable Novig Cash across
              42 states. After key jurisdictions including California and New Jersey moved to prohibit
              gambling-simulating sweepstakes products, Novig applied to the Commodity Futures Trading Commission (CFTC)
              in January 2026 to become a federally regulated Designated Contract Market (DCM). The CFTC granted DCM
              designation in June 2026, authorizing nationwide trading in event contracts under uniform federal market
              surveillance and rules requiring participants to be at least 21 years old.
