            body: >-
              Novig's capital structure has expanded rapidly through consecutive institutional rounds. In August 2025,
              the company closed an $18M Series A, which was followed in February 2026 by a $75M Series B led by Pantera
              Capital with participation from Multicoin Capital, Makers Fund, Edge Equity, and legacy backers
              Forerunner, Perceptive Ventures, and NFX. The Series B closed at a $500M post-money valuation, bringing
              total cumulative capital raised to north of $105M. By autumn 2026, media reports and sources familiar with
              ongoing fundraising indicated that Novig was soliciting interest and negotiating terms for a new round
              expected to value the sports exchange at up to $2.0B—representing a 300% valuation expansion in less than
              eight months. Entering an investment at a $2.0B mark requires extreme pricing discipline. When benchmarked
              against annualized notional trading volume of approximately $4B reported at Series B, a $2.0B headline
              valuation implies a notional enterprise multiple of roughly 0.5x notional volume. However, because Novig
              operates as a zero-commission exchange for individual retail users and relies on proprietary or
              institutional market-maker arrangements for platform economics, its net revenue multiple is dramatically
              higher than that of traditional gaming operators. Traditional digital sportsbooks trade at 2x to 4x net
              gaming revenue, whereas Novig's implied valuation prices in immediate federal preemption immunity,
              nationwide dominance in sports derivatives, and successful monetization of high-frequency liquidity
              providers.
