      - number: '7.2'
        title: Exchange Liquidity Depth, Market Integrity, and Responsible Trading Governance
        blocks:
          - type: paragraph
            body: >-
              As a pure peer-to-peer event contract exchange that eliminates the traditional bookmaker house edge,
              Novig's operational viability depends entirely on continuous matching liquidity across retail participants
              and institutional liquidity providers. While major NFL Sunday slates and marquee games experience liquid
              books with tight bid-ask spreads, third-party reviews document that niche player props, off-peak
              match-ups, and live in-game markets frequently suffer from thin order-book depth, resulting in unfilled
              limit orders and execution latency. Furthermore, mobile application access occasionally experiences
              latency and peak-load login delays during high-volume sports slates.


              To address mounting societal and regulatory scrutiny over young retail traders, Novig codified a
              comprehensive responsible trading framework into Chapter 14 of its Ludlow Exchange rulebook on August 13,
              2026. This framework established the industry's only nationwide 21+ age requirement—diverging from
              competitors Kalshi and Polymarket which permit trading at 18—alongside mandatory user deposit and loss
              controls, identity verification, and restrictions on promotional incentives such as 'risk-free' betting
              claims. Although this self-regulatory stance mitigates problem gambling exposure, restricting platform
              eligibility strictly to users aged 21 and older limits top-of-funnel customer acquisition among younger
              demographics, while compliance overhead imposes recurring surveillance obligations reportable to the CFTC.
