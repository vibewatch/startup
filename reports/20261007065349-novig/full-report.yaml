      - number: '2.2'
        title: Market Sizing Lenses, Trading Velocity, and Penetration Floors
        blocks:
          - type: paragraph
            body: >-
              Evaluating the addressable market for sports event derivatives requires distinguishing gross wagering
              turnover from net exchange revenue capture. The total addressable market for sports betting and prediction
              data exceeds $20 billion annually when aggregating media rights, real-money wagering turnover, and
              auxiliary analytical feeds, within an underlying global betting handle that exceeds $119 billion. The
              serviceable addressable market (SAM) focuses on US regulated online sports wagering and event derivatives
              across states where exchange mechanics operate compliantly, estimated between $12 billion and $15 billion
              in gross operator revenue. Novig's serviceable obtainable market (SOM) represents the fee capture and
              institutional data monetization extracted from active exchange liquidity, currently concentrated in
              high-frequency participants and quantitative market makers. Since launching its CFTC-regulated prediction
              market on August 4, 2026, Novig demonstrated rapid turnover expansion, accumulating $1.14 billion in
              notional trading volume across the first three weeks of the 2026 NFL season, and expanding past $1.7
              billion in cumulative tracked volume by early October 2026. However, because binary contracts carry a
              nominal face value of $1, notional volume measures turnover rather than platform revenue, which remains
              bounded by a tight institutional take rate.
            claimRefs:
              - CM005
