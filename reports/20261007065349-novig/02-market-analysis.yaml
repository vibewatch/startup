  title: "Market Analysis"
  summary: "Novig operates at the convergence of the $119B global sports betting economy and the emerging federally regulated event-derivatives market, deploying an exchange-first model that replaces traditional bookmaker margin with peer-to-peer liquidity. While sports contracts face favorable federal regulatory momentum under CFTC oversight, commercial expansion is tightly bounded by multi-state preemption battles, strict 21+ participant gating, and substantial retail-to-institutional liquidity concentration."
sections:
  - id: "market-boundary-and-substitutes"
    title: "Market Boundary, Addressable Spend, and Product Substitutes"
    body: "The addressable boundary for Novig bridges high-velocity sports wagering and federally supervised event derivatives. Novig concentrates its transaction architecture entirely on sports outcomes, including pregame spreads, totals, moneylines, player props, futures, and in-play derivatives across major professional and collegiate competitions. This deliberate product boundary excludes political, macroeconomic, and entertainment event contracts that dominate generalized prediction platforms such as Kalshi and Polymarket. In doing so, Novig positions its order book directly against the traditional retail sportsbook ecosystem. Conventional sportsbooks extract a built-in house margin—commonly known as the vigorish or vig—averaging 5% to 10% on two-way lines by pricing asymmetric odds. Novig disintermediates the bookmaker counterparty, facilitating peer-to-peer contract execution where positions settle at binary boundaries ($1 or $0) and order matching incurs zero retail commission on pregame straight wagers. The relevant market spend encompasses recreational bettor stakes, sharp bettor turnover currently restricted or limited by risk-averse sportsbooks, and institutional liquidity seeking quantitative sports exposure without balance-sheet counterparty friction."
    claimRefs:
      - "CM001"
      - "CM002"
      - "CM003"
      - "CM004"
    tableRefs:
      - "TM001"
  - id: "market-sizing-and-growth-lenses"
    title: "Market Sizing Lenses, Trading Velocity, and Penetration Floors"
    body: "Evaluating the addressable market for sports event derivatives requires distinguishing gross wagering turnover from net exchange revenue capture. The total addressable market for sports betting and prediction data exceeds $20 billion annually when aggregating media rights, real-money wagering turnover, and auxiliary analytical feeds, within an underlying global betting handle that exceeds $119 billion. The serviceable addressable market (SAM) focuses on US regulated online sports wagering and event derivatives across states where exchange mechanics operate compliantly, estimated between $12 billion and $15 billion in gross operator revenue. Novig's serviceable obtainable market (SOM) represents the fee capture and institutional data monetization extracted from active exchange liquidity, currently concentrated in high-frequency participants and quantitative market makers. Since launching its CFTC-regulated prediction market on August 4, 2026, Novig demonstrated rapid turnover expansion, accumulating $1.14 billion in notional trading volume across the first three weeks of the 2026 NFL season, and expanding past $1.7 billion in cumulative tracked volume by early October 2026. However, because binary contracts carry a nominal face value of $1, notional volume measures turnover rather than platform revenue, which remains bounded by a tight institutional take rate."
    claimRefs:
      - "CM005"
      - "CM006"
      - "CM007"
      - "CM008"
    tableRefs:
      - "TM002"
    figureRefs:
      - "FM001"
  - id: "buyer-and-participant-segmentation"
    title: "Participant Segmentation, Liquidity Provision, and Adoption Workflows"
    body: "Novig's two-sided marketplace balances four distinct participant segments: recreational retail bettors, quantitative sharp traders, proprietary institutional market makers, and commercial sports partners. Recreational retail traders seek competitive pricing, user-friendly mobile execution, and absence of house edge, driven by promotional incentives and social media brand acquisition. Quantitative sharp bettors, who face restrictive wager limits or outright account closures on legacy sportsbooks like DraftKings and FanDuel, adopt Novig for its non-limiting exchange posture and direct market access (DMA). On the opposing side, institutional market makers provide continuous two-sided liquidity, capturing automated rebates and spread commissions ranging from 1% to 4% on illiquid or complex lines. Furthermore, commercial sports organizations and enterprise partners represent an evolving institutional segment for data licensing and sports sponsorship distribution, exemplified by Novig's marketing collaboration with the New York Mets. Unlike competing prediction exchanges that onboard participants at age 18, Novig enforces a strict 21-and-over age gate, aligning its retail demographic with state-level gaming standards while sacrificing early adult user onboarding velocity."
    claimRefs:
      - "CM009"
      - "CM010"
      - "CM011"
      - "CM012"
    tableRefs:
      - "TM003"
  - id: "growth-drivers-and-structural-constraints"
    title: "Growth Catalysts, Regulatory Friction, and Structural Headwinds"
    body: "The expansion trajectory of sports prediction exchanges is propelled by structural federal tailwinds and constrained by intense jurisdictional friction. A primary growth driver is the federal regulatory posture under the Commodity Futures Trading Commission (CFTC). On June 16, 2026, the CFTC designated Novig's operating entity, Ludlow Exchange LLC, as a Designated Contract Market (DCM), enabling nationwide sports contract trading under the Commodity Exchange Act. This federal umbrella allows institutional capital—including hedge funds and proprietary trading groups barred from wagering on state sportsbooks—to trade sports as an asset class. Conversely, the market faces acute friction from state gaming regulators. Five states—Wisconsin, Massachusetts, New Mexico, New York, and Washington—have challenged federal event contracts as unlicensed gambling, prompting Novig to file preemptive federal lawsuits arguing constitutional Supremacy Clause preemption. Additionally, three states (Arizona, Michigan, and Nevada) remain entirely excluded from Novig's operating footprint. Beyond regulatory exposure, Novig faces critical marketing retention hurdles: while its September 2026 campaign featuring equity partner Sydney Sweeney expanded social reach to 3.98 billion, 96% of discourse centered on the talent rather than the app, emphasizing the difficulty of converting broad pop-culture buzz into sustained active trading liquidity."
    claimRefs:
      - "CM013"
      - "CM014"
      - "CM015"
      - "CM016"
