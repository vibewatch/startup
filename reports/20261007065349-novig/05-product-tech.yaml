chapter:
  number: 5
  title: "Product & Technology"
  summary: "Novig operates a specialized sports prediction market and central limit order book engineered to replace traditional sportsbook vigorish with peer-to-peer exchange execution. Following designation as a federal Designated Contract Market by the CFTC in June 2026, the company deployed a multi-rail fintech infrastructure combining low-latency matching, developer APIs for algorithmic market makers, and dual payment rails spanning ACH, cards, and crypto settlement via Coinflow. Technical differentiation rests on real-time order matching and institutional API connectivity, while primary engineering and operational risks center on exchange reliability during live sports concurrency, multi-rail payment fraud, and state regulatory preemption."
sections:
  - id: "product-workflow-and-market-mechanics"
    title: "Product Definition, Retail Workflow, and Order Book Mechanics"
    body: "Novig defines its core product as a modern financial exchange engineered specifically for sports prediction, departing structurally from the risk-bearing, against-the-house model of traditional sportsbooks. Rather than competing against an odds-making house that limits winning accounts and extracts 5% to 10% in vigorish, retail sports fans and quantitative traders interact through an open central limit order book (CLOB). Inside the Novig application, users place bids and offers on binary event contracts priced between $0.01 and $0.99 that settle at $1.00 upon verified event resolution or $0.00 if the outcome fails. The platform covers moneyline winners, point spreads, over/under totals, in-game live outcomes, and specialized multi-leg same-game parlays across NFL, college football, MLB, WNBA, NBA, tennis, and international soccer leagues. Retail users can act as price-makers by posting resting limit orders at custom probability thresholds or price-takers executing instantly against resting bids. By eliminating the traditional bookmaker hold, Novig delivers true peer-to-peer execution where price discovery reflects aggregate market consensus rather than defensive sportsbook odds shading.\n\nThe customer workflow operates across desktop and mobile application touchpoints with real-time odds calculation and custom bet slips. Traders browse active sports events, inspect live traded volumes and implied probabilities, construct single or multi-event parlay slips, and execute transactions commission-free on pregame straight markets. Novig supplements core order matching with specialized community and gamification surfaces, including Novig Ranks for trader performance tracking and an official Discord community for real-time market discussion. However, because order-book liquidity is fundamentally two-sided, retail order fulfillment depends on continuous market-maker engagement and depth at tight bid-ask spreads. Unlike retail sportsbooks that guarantee instant counterparty acceptance up to house limits, illiquid or niche prop markets on Novig can experience execution delays or partial fills if resting opposite-side limit orders are absent."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
      - "CE005"
    tableRefs:
      - "TE001"
  - id: "architecture-and-operating-stack"
    title: "Technology Architecture, API Infrastructure, and Payments Integration"
    body: "Novig's technology stack combines high-throughput exchange infrastructure with distributed cloud microservices designed to process high-velocity market data streams. The core matching engine and backend services are built utilizing systems programming languages (Rust, Go, C++) to guarantee deterministic low-latency execution and high concurrent throughput during peak live sporting events. Backend microservices handle order validation, user account balances, compliance surveillance, and event settlement pipelines, deployed across distributed cloud infrastructure. For power users and quantitative liquidity providers, Novig maintains a developer-first algorithmic trading API, allowing automated trading desks and institutional market makers to ingest real-time market data, manage positions programmatically, and stream two-sided quotes directly into the central limit order book. The client-facing layer is developed using modern frontend frameworks (React, Vue) paired with design systems in Figma, ensuring synchronized real-time state management between trader order slips and market boards.\n\nA pivotal component of Novig's operational architecture is its payments and settlement stack, which underwent a foundational transformation through an enterprise integration with Coinflow. Novig initially launched with guaranteed ACH bank transfers, which provided baseline regulatory compliance but constrained conversion because users resisted mandatory bank-linking upon initial onboarding. In late 2025, Coinflow completed an on-site integration with Novig's engineering and operations team, introducing credit card pay-ins, cryptocurrency deposit and payout rails, and instant stablecoin settlement. This integration expanded payment volume by over 90% between October 2025 and March 2026, increased transaction acceptance rates from 86% to approximately 95%, drove an 81% decline in bank-level fraud declines, and delivered 98% chargeback indemnification. By outsourcing multi-rail payment complexity to Coinflow, Novig scaled transaction processing across a lean operations team of 10 to 12 personnel while onboarding 50% of first-time Q4 purchasers through Coinflow rails."
    claimRefs:
      - "CE006"
      - "CE007"
      - "CE008"
      - "CE009"
      - "CE010"
      - "CE011"
    tableRefs:
      - "TE002"
    figureRefs:
      - "FE001"
  - id: "differentiation-security-and-technical-risks"
    title: "Technological Differentiation, Regulatory Compliance, and Reliability Gaps"
    body: "Novig's competitive differentiation centers on regulatory positioning, institutional liquidity connectivity, and transparent market governance. By securing federal Designated Contract Market (DCM) designation from the Commodity Futures Trading Commission (CFTC) under Ludlow Exchange LLC in June 2026, Novig established a single nationwide federal regulatory framework that preempts fragmented state sports wagering regimes. Novig's DCM rules codify institutional market integrity standards, including explicit 21-and-over age verification nationwide—diverging from competitors that accept 18-year-old participants—and strict prohibition of easily manipulated or officiating-dependent markets in compliance with NFL league guidelines. To protect market stability, the exchange enforces automated surveillance to detect market manipulation, wash trading, and insider activity, while customer deposits remain segregated under CFTC regulatory standards.\n\nDespite these technical and regulatory advantages, Novig faces critical technological and operational risks. Live sports trading concentrates massive transaction concurrency around instantaneous sporting events (such as game-ending drives or home runs), placing immense stress on order routing, WebSocket price broadcasts, and data ingestion pipelines where milliseconds of latency can create toxic arbitrage between retail traders and algorithmic market makers. Furthermore, while the Coinflow partnership reduced bank fraud declines by 81%, chargeback protection declines increased, reflecting ongoing friction in filtering high-risk transactions before execution. Operationally, Novig's aggressive federal expansion has triggered active state-level legal challenges in Wisconsin, New York, Massachusetts, New Mexico, and Washington, exposing the platform to potential state-enforced geoblocking or operational injunctions. Finally, while celebrity marketing featuring equity partner Sydney Sweeney generated a ninefold surge in brand mentions, media analysis showed 96% of conversation focused solely on Sweeney rather than Novig's software platform, highlighting the persistent challenge of translating top-of-funnel brand visibility into sticky, active order-book volume."
    claimRefs:
      - "CE012"
      - "CE013"
      - "CE014"
      - "CE015"
      - "CE016"
    tableRefs:
      - "TE003"
