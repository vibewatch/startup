  - id: TP002
    title: Feature and capability matrix
    columns: [Buying criterion, Novig, Kalshi, Polymarket, ProphetX, DraftKings Predictions]
    rows:
      - ["Primary scope", "Sports only", "Sports plus broad non-sports events", "Broad sports and non-sports events", "Sports only", "Sports-led crossover plus other event categories"]
      - ["Price control", "Take or post an order", "Exchange trading; detailed order controls not compared here", "Market trading; U.S. product details vary", "Take or post an order", "Available contracts through a familiar branded product"]
      - ["Pregame straight-trade fee signal", "No trading fee reported", "Transaction fees reported", "Taker fees reported by Novig comparison", "2% of net gains reported for straight trades", "Per-contract fee reported"]
      - ["Sports breadth", "Deep major U.S. sports focus", "Strong major-league coverage", "Broadest international and niche sports range in Novig comparison", "Moneylines, spreads, totals, and player markets", "Familiar sports and combination-contract experience"]
      - ["Trust posture", "21+; CFTC-designated exchange reported", "CFTC-designated exchange reported", "Regulated U.S. product described, exact contract venue must be checked", "CFTC approval reported", "Underlying exchange and settlement rules must be checked"]
      - ["Key unknown", "Executable depth by market and time", "Comparable sports-only spread and fill data", "U.S.-specific depth and fee by contract", "Comparable fill depth", "All-in cost and depth on matched contracts"]
    notes: >-
      Cells synthesize the assigned official and independent comparisons as of the run
      date; unknown cells remain explicit because no normalized execution benchmark was
      available.
    claimRefs: [CP001, CP002, CP003, CP004, CP005, CP006, CP013, CP014, CP015]
  - id: TP003
    title: Pricing and packaging comparison
    columns:
      - Platform
      - Published or reported model
      - Included capability
      - Discount or unknown
      - Competitive implication
    rows:
      - [Novig, "No trading fee on pregame straight trades", "Sports order book and posted prices", "Live trades, certain futures, and parlays may carry taker fees", "Strong acquisition hook, but spread and depth determine realized value"]
      - [Kalshi, "Transaction fees; schedule varies by market", "Broad exchange and non-sports categories", "No normalized matched-contract comparison in assigned evidence", "Scale and breadth can outweigh headline fee differences"]
      - [Polymarket, "Taker fees reported; maker incentives may apply", "Broad event and sports range", "Exact fee depends on category and product", "Range and liquidity can offset Novig's sports-only fee advantage"]
      - [ProphetX, "2% of net gains per straight-trade market reported", "Sports order book and limit prices", "Parlays use a separate taker-fee structure", "Closest fee-and-execution comparison for sports-only users"]
      - [DraftKings Predictions, "Per-contract charge reported", "Familiar branded crossover experience", "Supplying-exchange economics not independently normalized", "Distribution convenience competes with Novig's lower headline fee"]
    notes: >-
      These are current published or reported schedules, not realized customer pricing;
      promotions, spreads, rebates, contract type, and available order size can change the
      all-in result.
    claimRefs: [CP002, CP003, CP004, CP005, CP006, CP009]
figures:
