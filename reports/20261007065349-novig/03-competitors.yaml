      - [ProphetX, "Sports-focused prediction exchange", "Public scale not established in assigned evidence", "Sports traders price-shopping another order book", "Users can take or post prices; sports-only focus", "Smaller reported scale and fill depth remains unverified"]
      - [DraftKings Predictions, "Sportsbook-adjacent event-contract product", "Parent-brand scale; product-level funding not applicable", "Existing DraftKings users entering prediction markets", "Familiar interface and crossover distribution", "Per-contract charges reduce price appeal for fee-sensitive traders"]
      - ["Traditional sportsbook", "Status-quo substitute", "Not quantified in assigned evidence", "Bettors prioritizing immediate execution", "House-posted odds and familiar bet flow", "Users cannot set an exchange order; winning users may face limits"]
    notes: >-
      Values are reported, not audited; competitor valuations come from Covers on
      2026-09-30, and unavailable product-level scale is shown explicitly rather than
      estimated.
