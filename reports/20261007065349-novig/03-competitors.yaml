artifact: competitors
slug: novig
runDate: 2026-10-07
company:
  name: Novig
chapter:
  number: 3
  title: Competitors
  summary: >-
    Novig occupies a defensible but narrow sports-first position: its strongest visible
    differentiation is order-book control and no trading fee on pregame straight trades,
    while Kalshi and Polymarket lead on breadth and scale and ProphetX is the closest
    sports-exchange substitute. The moat remains execution-dependent because independent
    evidence flags thinner secondary-market liquidity, no public API, and the need to
    multi-home for non-sports contracts.
sections:
  - id: landscape-and-alternatives
    title: Landscape and buyer alternatives
    body: >-
      Novig competes in a layered field rather than a single peer set. Direct exchange
      competitors include Kalshi and Polymarket, whose broader event menus and larger
      reported valuations give them more cross-category liquidity and distribution, and
      ProphetX, the closest like-for-like sports-focused exchange. Incumbent sportsbook
      brands such as DraftKings and FanDuel can use familiar interfaces and existing
      customer relationships to bring event contracts to sports bettors. Adjacent apps,
      including Underdog, Gemini, Crypto.com, and OG, bundle prediction contracts with
      fantasy, crypto, or broader trading experiences. The traditional sportsbook remains
      the status-quo substitute: it supplies a fixed line immediately, whereas an exchange
      lets users accept or post prices but exposes them to fill risk. A bettor's internal
      pricing model is not a venue and cannot create counterparty liquidity; it instead
      increases the value of comparing multiple exchanges. Novig therefore wins a specific
      job—focused sports price discovery—rather than replacing the full prediction-market
      stack.
    claimRefs: [CP001, CP003, CP004, CP005, CP006, CP009, CP016]
    tableRefs: [TP001]
  - id: capability-and-economics
    title: Capability and pricing trade-offs
    body: >-
      The capability comparison is strongest where the sources expose current product
      facts and weakest where promotional pages substitute for audited market-depth data.
      Novig's official and independent comparison pages agree that it is sports-only and
      allows users to post prices. Covers narrows the fee claim: pregame straight trades
      currently carry no trading fee, but live trades, certain futures, and parlays can
      carry taker fees. Kalshi offers a broad menu and exchange scale; Polymarket extends
      into more international and niche sports as well as non-sports events; ProphetX
      provides another sports order book; and DraftKings provides a familiar crossover
      path with per-contract charges. This makes Novig's price advantage conditional on
      the trade type, spread, and available size. The source set does not establish
      realized all-in cost or executable depth for matched contracts, so headline fee
      schedules should not be treated as proof of best execution.
    claimRefs: [CP001, CP002, CP003, CP004, CP005, CP006, CP014, CP015]
    tableRefs: [TP002, TP003]
  - id: distribution-trust-and-multihoming
    title: Distribution, trust, and multi-homing
    body: >-
      Distribution power is shifting toward brands that can combine liquidity with
      customer acquisition. Novig chose a concentrated celebrity-equity campaign and a
      Mets partnership rather than trying to win every league sponsorship; SCCG reports
      that Kalshi and Polymarket have secured more major-league relationships. The campaign
      delivered awareness but imperfect brand transfer: 5W Research reported more than a
      ninefold increase in Novig mentions while only 4% of campaign posts named the app.
      Trust positioning is also differentiated. Covers reports that Novig requires users
      to be 21 or older and accepted an NFL request to exclude specified manipulable or
      objectionable markets. These choices may support a sports-specific trust narrative,
      but they do not remove regulatory or liquidity risk. Because exchanges price the
      same event independently, active users have a rational reason to multi-home and
      compare price, spread, and fillable size rather than accept platform lock-in.
    claimRefs: [CP009, CP011, CP012, CP013, CP014]
    figureRefs: [FP001]
  - id: moat-and-displacement-risk
    title: Moat durability and displacement risk
    body: >-
      Novig's near-term moat is a bundle of sports specialization, low headline fees,
      order-book UX, federal exchange status as reported by reviewers, and attention-led
      distribution. None is independently proven durable. Covers reports that Novig ranked
      sixth among eleven reporting operators during the first three weeks of NFL activity,
      despite $1.14 billion of notional volume since September 9; the same source reports
      much higher valuations for Kalshi and Polymarket. PredictReport further flags thin
      books outside NFL and MLB, no yield on idle cash, and no documented public API.
      Those weaknesses create displacement paths: general exchanges can subsidize sports
      from broader liquidity, sportsbook incumbents can cross-sell familiar users, and
      another sports exchange can compete on a single game's executable price. The
      investment case therefore depends less on a permanent zero-fee claim than on repeat
      liquidity, retention, efficient acquisition, and trusted settlement—metrics not
      disclosed in the assigned evidence.
    claimRefs: [CP007, CP008, CP010, CP011, CP012, CP015]
