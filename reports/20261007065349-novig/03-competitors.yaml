        - label: Novig
          x: 5
          y: 3
          detail: "Sports-only focus; emerging scale with concentrated brand distribution."
        - label: Kalshi
          x: 2
          y: 5
          detail: "Broad-category exchange with leading scale signals."
        - label: Polymarket
          x: 2
          y: 5
          detail: "Broad market and sports range with major partnership reach."
        - label: ProphetX
          x: 5
          y: 2
          detail: "Sports-only exchange; assigned evidence does not establish comparable scale."
        - label: DraftKings Predictions
          x: 3
          y: 4
          detail: "Sportsbook crossover supported by an established consumer brand."
        - label: FanDuel Predicts
          x: 3
          y: 4
          detail: "Familiar sports-brand distribution with broader event-contract access."
    approximationNotes: >-
      Ordinal 1-5 analyst scores: x measures broad-category (1) to sports-only (5), while
      y measures relative distribution and scale signals (1 emerging to 5 leading).
      Scores synthesize cited qualitative evidence and are not audited market-share data.
    claimRefs: [CP003, CP004, CP005, CP006, CP010, CP012]
callouts:
  - calloutType: risk
    title: Fee leadership is not execution leadership
    body: >-
      A zero fee on a defined trade type does not prove a lower all-in cost when spreads,
      available size, idle-cash economics, and exit liquidity are not normalized.
    claimRefs: [CP002, CP007, CP009, CP015]
