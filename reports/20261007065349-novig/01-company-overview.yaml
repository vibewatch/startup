callouts:
  - calloutType: "insight"
    title: "Regulatory Arbitrage to Federal Designation"
    body: "Novig's willingness to abandon its initial state-by-state sports wagering license in Colorado and transition through a sweepstakes model allowed the startup to preserve capital, iterate on user acquisition, and build sufficient operational handle to support an aggressive federal CFTC Designated Contract Market application. Achieving DCM status in June 2026 positions Novig under a single nationwide regulatory umbrella, bypassing fragmented state gaming commission hurdles."
    claimRefs:
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO005"
  - calloutType: "risk"
    title: "Brand Attention Asymmetry in Influencer Campaigns"
    body: "While Novig's multi-million-dollar celebrity marketing campaign featuring equity-holder Sydney Sweeney generated a ninefold spike in total brand mentions, independent media analysis from Peak Metrics revealed that 96% of conversation focused solely on Sweeney rather than Novig's trading technology. The company faces the challenge of converting transient pop-culture notoriety into dedicated sports trading liquidity."
    claimRefs:
      - "CO012"
      - "CO013"
