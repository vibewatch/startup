chapter:
  number: 7
  title: "Risks"
  summary: "Novig's transition from a state-licensed sportsbook and sweepstakes platform to a federally regulated Designated Contract Market (DCM) concentrated its existential risks in multi-state regulatory preemption litigation and prospective CFTC rulemaking on discrete sports event contracts. While Novig codified an industry-first 21+ responsible trading framework and holds substantial venture runway following its $75 million Series B and reported $2 billion valuation, ongoing federal lawsuits against five state attorneys general, pending CFTC restrictions on in-game and officiating contracts, and marketing backlash from celebrity-driven promotional campaigns create material thesis-break vulnerabilities."
sections:
  - id: "regulatory-and-legal-preemption-risks"
    title: "State Preemption Battles, CFTC Rulemaking Exposure, and Jurisdictional Friction"
    body: "Novig's core legal thesis rests on the assertion that its subsidiary Ludlow Exchange LLC, having obtained Designated Contract Market (DCM) designation from the Commodity Futures Trading Commission (CFTC) on June 16, 2026, operates under exclusive federal derivatives jurisdiction that preempts state gambling regulations via the U.S. Constitution's Supremacy Clause. This federal preemption doctrine is facing immediate and aggressive challenges from state gaming authorities. Following its nationwide launch on August 4, 2026, Novig proactively filed federal lawsuits across five separate jurisdictions—New York, Massachusetts, Washington, New Mexico, and Wisconsin—seeking to enjoin state officials from enforcing state gambling statutes against its exchange contracts.\n\nInitial judicial proceedings indicate substantial legal turbulence. In Wisconsin, where Novig named Attorney General Josh Kaul and state gaming administrator John Dillett, a federal judge previously denied a preliminary injunction requested by the CFTC itself on July 28, 2026, ruling that the agency failed to establish a likelihood of success on its federal preemption claim. In New York, the federal court declined to grant an immediate temporary restraining order blocking state enforcement. Beyond state-level enforcement, Novig faces significant regulatory risk from its primary federal regulator: the CFTC's June 2026 proposed rulemaking would prohibit event contracts tied to officiating decisions, player injuries, and discrete in-game actions such as individual pitches—contract structures that represent a major portion of Novig's sports-only trading volume."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR004"
      - "CR005"
      - "CR006"
      - "CR007"
    tableRefs:
      - "TR001"
  - id: "operational-liquidity-and-governance-risks"
    title: "Exchange Liquidity Depth, Market Integrity, and Responsible Trading Governance"
    body: "As a pure peer-to-peer event contract exchange that eliminates the traditional bookmaker house edge, Novig's operational viability depends entirely on continuous matching liquidity across retail participants and institutional liquidity providers. While major NFL Sunday slates and marquee games experience liquid books with tight bid-ask spreads, third-party reviews document that niche player props, off-peak match-ups, and live in-game markets frequently suffer from thin order-book depth, resulting in unfilled limit orders and execution latency. Furthermore, mobile application access occasionally experiences latency and peak-load login delays during high-volume sports slates.\n\nTo address mounting societal and regulatory scrutiny over young retail traders, Novig codified a comprehensive responsible trading framework into Chapter 14 of its Ludlow Exchange rulebook on August 13, 2026. This framework established the industry's only nationwide 21+ age requirement—diverging from competitors Kalshi and Polymarket which permit trading at 18—alongside mandatory user deposit and loss controls, identity verification, and restrictions on promotional incentives such as 'risk-free' betting claims. Although this self-regulatory stance mitigates problem gambling exposure, restricting platform eligibility strictly to users aged 21 and older limits top-of-funnel customer acquisition among younger demographics, while compliance overhead imposes recurring surveillance obligations reportable to the CFTC."
    claimRefs:
      - "CR008"
      - "CR009"
      - "CR010"
      - "CR011"
      - "CR012"
    tableRefs:
      - "TR002"
    figureRefs:
      - "FR001"
  - id: "partner-capital-and-execution-vulnerabilities"
    title: "Promotional Partner Reputation, Capital Concentration, and Commercial Dependencies"
    body: "Novig's rapid growth has relied heavily on concentrated promotional partnerships and capital-intensive customer acquisition. In September 2026, Novig launched its 'Just Sports' advertising blitz starring actress Sydney Sweeney, who also serves as an equity-holding strategic partner. Chief Executive Jacob Fortinsky acknowledged that the campaign consumed the bulk of Novig's marketing budget leading into the NFL season. Independent media analysis by 5W Research and Peak Metrics revealed severe brand-transfer asymmetry: while brand mentions surged ninefold and reach expanded to 3.98 billion impressions, 96% of public social discourse focused on Sweeney's creative portrayal and associated athlete backlash rather than the Novig trading product, while only 4% mentioned the application.\n\nNovig also maintains critical counterpart dependencies on institutional market makers for continuous order matching, commercial league relationships including adherence to NFL contract restrictions on officiating or knowable events, and payment rails for bank transfers and credit card processing. Although Novig secured $75 million in Series B financing in February 2026 led by Pantera Capital and reportedly raised follow-on capital at a $2 billion valuation in September 2026, sustaining its high-burn customer acquisition strategy and defending five concurrent federal lawsuits makes the company vulnerable to market-maker fee compression and adverse appellate court rulings."
    claimRefs:
      - "CR013"
      - "CR014"
      - "CR015"
      - "CR016"
    tableRefs:
      - "TR003"
