- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Thesis pillar
  - Support
  - Anti-thesis
  - What changes the view
  rows:
  - - Growth and customer access
    - Mercor moved from a $2B mark and ~$75M run-rate in early 2025 to a $10B mark and ~$450M annualized revenue by September 2025, with OpenAI, Anthropic, and Meta cited as customers
    - That revenue is reported gross of contractor payouts and appears concentrated in a few labs
    - Show net revenue, take rate, and top-customer concentration
  - - Product up-stack optionality
    - APEX, Enterprise AI, assessments, and RL Studio suggest a path toward benchmark and workflow infrastructure
    - Public adoption proof for these product layers is still thin; they may be sales aids rather than durable revenue streams
    - Disclose attach rate, repeat usage, and customer references for product modules
  - - Market tailwind
    - AI Index and market reports still support expanding demand for high-quality human-data workflows
    - Growing market size does not prevent multiple compression if Mercor looks more like services than software
    - Show that Mercor is converting growth into stickier economics, not just volume
  - - Competitive position
    - Mercor appears well placed after Scale AI disruption and has a strong frontier-lab narrative
    - Appen and peers also market expert RLHF, agentic evaluation, and integrity products; category convergence can erode differentiation
    - Prove benchmark realism and product depth are translating into revenue mix shift
  - - Trust recovery
    - Breach remediation and litigation dismissal reduce some headline risk
    - Meta pauses, class actions, and any second incident would quickly re-open downside
    - Provide independent evidence of post-breach control improvements and customer retention
  notes: The anti-thesis is not hypothetical. It is built directly from the public evidence on accounting, concentration, breach fallout, and category convergence.
