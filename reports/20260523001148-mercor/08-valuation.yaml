- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Why it matters
  - Action implication
  rows:
  - - Customer concentration breaks the wrong way
    - A clearly material top-customer pause, non-renewal, or revenue-share loss after 2026
    - Mercor does not yet have public diversification evidence strong enough to absorb a large lab loss
    - Move from TRACK to avoid or demand a much lower price
  - - Second material security incident
    - Another serious breach or confirmed deeper damage from the 2026 incident
    - Would undermine the trust thesis behind benchmark, workflow, and enterprise expansion
    - Treat as thesis-break until controls are externally validated
  - - Labor / contractor cost shock
    - Evidence that contractor, privacy, or classification costs materially change unit economics
    - Would push Mercor closer to services economics while also lowering growth confidence
    - Re-rate toward public labor-platform multiples
  - - Software attach fails to show up
    - No credible benchmark / workflow revenue proof after another funding or growth step
    - Without up-stack conversion, the $10B mark rests on volume and narrative more than product economics
    - Keep a TRACK stance even if revenue stays large
  - - Disclosure still opaque at the next price-setting event
    - No net revenue bridge, no concentration disclosure, no clear post-breach controls by the next financing or secondary window
    - Investors would still be underwriting too much on faith
    - Pass on the round or require a steeper discount
  notes: Kill triggers are framed for investors evaluating whether Mercor deserves a software-like premium or should be marked closer to services and marketplace comps.
