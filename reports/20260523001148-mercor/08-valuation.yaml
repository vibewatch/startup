company:
  name: Mercor
chapter:
  number: 8
  title: Valuation
  summary: Mercor's $10 billion Series C mark captures a real frontier-AI workflow franchise, but it also assumes that benchmark and workflow products will mature into software-like economics faster than the public record currently proves. Public evidence supports exceptional growth, major-customer relevance, and credible up-stack ambition, yet concentration, breach fallout, legal or labor complexity, and gross-versus-net revenue opacity make the current price look stretched. Recommended stance is TRACK with medium confidence and high risk until Mercor either derisks the evidence set or offers a better entry price.
sections:
- id: investment-thesis-antithesis
  title: Investment Thesis and Anti-Thesis
  body: 'Mercor deserves valuation attention because the company has assembled three things the market clearly wants: very fast growth, access to frontier-AI customers, and a believable path to move beyond pure recruiting into benchmarks, evaluation, and workflow tooling. The official financing history shows Mercor stepping from a $250 million Series A valuation to $2 billion in February 2025 and then to $10 billion in October 2025. Independent reporting adds real operating proof to that narrative, including a $75 million run-rate by February 2025, roughly $450 million annualized revenue by September 2025, and customer names such as OpenAI, Anthropic, and Meta. Product evidence from Mercor''s research, APEX, Enterprise AI, assessments, and RL Studio pages matters because it suggests the company is trying to build repeatable workflow and benchmark assets rather than remain only a labor broker. The anti-thesis is that Mercor is still priced as if that up-stack transition has already worked.
    Public sources say revenue is reported gross of contractor payouts, customer concentration remains high, breach fallout interrupted customer trust, and litigation plus labor complexity can still raise operating friction. In short, Mercor looks strategically important, but the current mark leaves little room for execution misses.'
