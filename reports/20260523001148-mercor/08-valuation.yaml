  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: comparable-valuation-table
    missingEvidence: Private-peer revenue denominators, term sheets, and secondary pricing for Scale AI, Surge AI, Turing, and other adjacent comps are not publicly clean enough for a tighter comparable set.
    whyItMatters: Mercor's premium can only be benchmarked precisely if private peers have better revenue and term disclosure.
    diligencePath: Collect secondary-market marks, pitch materials, and term-sheet detail from brokers or the data room before issuing a definitive entry price.
    relatedQuestionRefs:
    - QV010
    - QV011
    - QV012
    - QV013
    - QV024
    relatedTableRefs:
    - TV004
  - type: private-evidence-only
    severity: material
    topic: net-revenue-quality
    missingEvidence: Gross billings, contractor payouts, take rate, net revenue, gross margin, and any recurring software revenue are not publicly disclosed.
    whyItMatters: Without a gross-to-net bridge, investors cannot know whether Mercor deserves marketplace or software-style valuation treatment.
    diligencePath: Request a monthly revenue-quality bridge and cohort view from management under NDA.
    relatedQuestionRefs:
    - QV003
    - QV018
    - QV019
    - QV026
    - QV031
    relatedTableRefs:
    - TV001
    - TV006
  - type: private-evidence-only
    severity: material
    topic: cap-table-preferences
    missingEvidence: Preference stack, participation rights, and any secondary-specific terms at or near the $10B mark are not public.
    whyItMatters: A stretched headline valuation can still produce poor investor outcomes if terms are investor-favorable above the common-equity level.
    diligencePath: Review round documents and current cap-table waterfall with counsel before underwriting any return case.
    relatedQuestionRefs:
    - QV027
    - QV032
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: customer-concentration-and-retention
    missingEvidence: Mercor does not publicly disclose top-customer revenue shares, renewal cadence, or retention by product line.
    whyItMatters: Concentration is the main valuation swing factor and directly shapes the bull, base, and bear outcomes.
    diligencePath: Request top-10 customer mix, churn history, paused-account detail after the breach, and product-level expansion metrics.
    relatedQuestionRefs:
    - QV004
    - QV015
    - QV016
    - QV021
    - QV022
    relatedTableRefs:
    - TV003
    - TV005
    - TV006
  - type: stale
    severity: material
    topic: post-breach-trust-remediation
    missingEvidence: Public reporting confirms the incident and litigation, but independent evidence of completed remediation and customer trust recovery is still sparse.
    whyItMatters: The breach matters most if it constrains Mercor's ability to win or expand enterprise and benchmark-sensitive work.
    diligencePath: Ask for the incident report, customer retention notes, and third-party assurance of remediated controls.
