- id: financing-context-comparable-valuation
  title: Financing Context and Comparable Valuation
  body: Mercor now sits awkwardly between two comp buckets. On one side are labor marketplaces and data-service platforms such as Appen, Upwork, and Fiverr, which public market data show trading around roughly 1x revenue. Those businesses are valued as transaction or services engines with limited software scarcity. On the other side sits Palantir, which trades at a radically higher multiple because investors view it as a software control plane with durable product lock-in, strong gross margins, and deep mission-critical embeds. Mercor's current mark clearly assumes it belongs closer to the second bucket than the first, but public evidence is not there yet. What supports the premium is the unusual combination of frontier-AI customer access, extreme growth, and visible product efforts around APEX, Enterprise AI, assessments, and RL Studio. What limits the premium is the lack of public net-revenue, take-rate, margin, or retention data, plus the fact that the headline revenue number is gross
    of contractor payouts. The valuation debate is therefore not whether Mercor is a good company; it is whether investors should underwrite a software-like future before the accounting and customer-mix evidence catches up.
