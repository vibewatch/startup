- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Net revenue and take rate
    - Gross billings, contractor payouts, Mercor take rate, and any recurring software revenue split
    - This is the single most important bridge between a marketplace valuation and a software valuation
    - Finance data room and controller review
  - - Top-10 customer mix and retention
    - Revenue concentration, renewal cadence, paused accounts after the breach, and expansion by product line
    - Concentration is the central downside variable in the current model
    - CFO data room plus customer-reference work
  - - Post-breach trust remediation
    - Independent evidence of control improvements, scoped impact, and customer reassurance after the LiteLLM incident
    - Without trust repair, benchmark and enterprise upsell becomes harder to underwrite
    - Security diligence, incident report, and customer checks
  - - Contractor and legal exposure
    - Jurisdictional contractor mix, policy-enforcement data, disputes, and any reserves or outside-counsel memos
    - Mercor's moat partly relies on labor orchestration that can also generate compliance cost
    - Legal diligence with employment and privacy counsel
  - - Cap table and preferences
    - Preference stack, participation rights, and any secondary terms at the $10B mark
    - A stretched valuation can still be investable if terms are unusually clean, and vice versa
    - Corporate counsel review and round-document analysis
  notes: These asks are ordered by what most directly changes valuation confidence. None are finalize-later nice-to-haves at the current price.
