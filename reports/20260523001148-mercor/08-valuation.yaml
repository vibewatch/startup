- id: TV004
  title: Comparable valuation table
  enumeration: true
  enumerationScope:
    coverage: partial
    basis: 'Covers the most decision-relevant public and private analogs visible from the fetched source set: direct labor-data platforms, freelancer marketplaces, and a software-control extreme. Private peers with no reliable revenue denominator are included only where valuation context is still useful.'
  columns:
  - Comparable
  - Status
  - Revenue metric
  - Multiple / valuation
  - Relevance
  - Limitation
  rows:
  - - Mercor
    - Private (subject)
    - ~$450M annualized gross revenue in Sep 2025; company later claimed $1B annualized in 2026
    - $10B valuation; ~22x on Sep-2025 gross run-rate or ~10x on the later company claim
    - Sets the entry point investors must underwrite
    - Gross-vs-net economics remain undisclosed
  - - Appen
    - Public
    - ~$0.23B revenue
    - ~1x revenue ($0.23B market cap)
    - Direct human-data and evaluation comp showing how public markets price service-heavy platforms
    - Mature, slower-growth public company with different customer mix
  - - Upwork
    - Public
    - ~$0.79B revenue
    - ~1.4x revenue ($1.08B market cap)
    - Useful marketplace comp for how transaction-heavy labor platforms are valued
    - Broader freelancer marketplace, not frontier-AI infrastructure
  - - Fiverr
    - Public
    - ~$0.42B revenue
    - ~0.9x revenue ($0.39B market cap)
    - Another marketplace anchor for the downside valuation frame
    - SMB freelancer focus differs from Mercor's expert-AI niche
  - - Palantir
    - Public
    - ~$5.22B revenue
    - ~63x revenue ($328.14B market cap)
    - Shows the upside available to software control-plane businesses with strong lock-in
    - Much more productized, disclosed, and entrenched than Mercor
  - - Scale AI
    - Private
    - Revenue denominator not cleanly public in the fetched set
    - About $29B implied value from Meta's 49% deal per Axios/CNBC
    - Closest category leader for AI-data infrastructure and a reminder that narrative can stay expensive
    - Opaque revenue and terms limit clean multiple comparison
  - - Turing / similar talent-data peers
    - Private
    - Not enough reliable public denominator in the fetched valuation source set
    - Turing reached $2.2B valuation in March 2025
    - Shows Mercor's $10B mark is well above adjacent talent-data peers
    - Sparse public economics and term details
  notes: Public company numbers come from CompaniesMarketCap snapshots fetched for this run. Private-company rows are valuation context rows, not clean like-for-like multiple rows.
