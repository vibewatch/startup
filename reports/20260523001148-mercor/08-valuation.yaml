- id: final-diligence-asks
  title: Exit Readiness and Final Diligence Asks
  body: 'Mercor is not a finalize-now diligence story at this price. The company may eventually earn a much richer multiple, but that outcome depends on facts the public record does not yet settle. The first blocking item is a revenue-quality bridge that separates gross billings, contractor payouts, Mercor take rate, net revenue, and any recurring software-like revenue. The second is a top-customer view: investors need to know how concentrated the revenue base is, what portion was disrupted by the breach, and whether newer products are broadening the account mix. Third, Mercor needs to show trust repair in a way public markets or late-stage private investors can underwrite, ideally with post-breach control improvements and independent assurance rather than only narrative. Fourth, the contractor and legal stack needs clearer quantification, because a company that spans many jurisdictions and monitors time so tightly may be more exposed to labor, privacy, or classification disputes than a
    typical software vendor. Until those asks are answered, the best posture is to keep Mercor on the watch list, not to pay a price that already anticipates favorable answers.'
