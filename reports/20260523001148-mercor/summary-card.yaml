  topStrengths:
    - >-
      Frontier-AI customer relevance is real: public reporting names OpenAI, Anthropic, and Meta, and Mercor says it
      serves the top five AI labs and six of the Magnificent Seven.
    - >-
      Mercor has grown unusually fast, moving from a $2B mark in February 2025 to $10B in October 2025 while public
      sources reported major revenue acceleration.
    - >-
      APEX, Enterprise AI, assessments, and RL Studio provide credible evidence that Mercor is trying to move up the
      stack from labor aggregation into benchmark and workflow infrastructure.
    - >-
      The company's contractor operations and payout stack appear sophisticated enough to support global expert
      workflows at scale.
  topRisks:
    - Revenue appears concentrated in a small number of AI labs, and public retention data are not disclosed.
    - >-
      Mercor's most visible revenue numbers appear gross of contractor payouts, while net revenue, take rate, margin,
      and cash metrics remain undisclosed.
    - >-
      The 2026 breach, paused Meta work, and class-action fallout create a trust overhang that matters directly to the
      valuation multiple.
    - >-
      Mercor operates a complex global contractor system that can create labor, privacy, and compliance risk in addition
      to execution burden.
    - >-
      At $10B, Mercor is priced far above public labor-platform comps and requires meaningful software-like re-rating to
      look attractive.
  unresolvedGaps:
    - Gross-to-net revenue bridge, take rate, gross margin, and any recurring software revenue split are not public.
    - Top-10 customer concentration, paused-account detail after the breach, and product-level retention are not public.
    - Independent evidence of post-breach trust remediation and control improvements remains limited.
    - Contractor-jurisdiction mix, dispute rates, and any legal reserves for labor or privacy exposure are not public.
    - Cap-table terms, preference stack, and secondary pricing mechanics at the $10B mark are not public.
