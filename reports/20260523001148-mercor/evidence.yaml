    severity: material
    topic: reliability-metrics
    missingEvidence: Public uptime, SLA, incident-rate, and recovery-time metrics across interview, matching, and payout systems.
    whyItMatters: >-
      Engineering posts show Mercor runs operationally critical infrastructure, but investors still cannot quantify
      reliability or customer-facing service levels.
    diligencePath: Request status-page history, internal SLOs, postmortems, and customer support metrics.
    relatedQuestionRefs:
      - QE028
    relatedTableRefs:
