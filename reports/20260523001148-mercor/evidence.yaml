evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board composition, voting rights, and investor preference terms.
    whyItMatters: >-
      Mercor has repriced rapidly; hidden control and preference rights can materially affect underwriting and exit
      outcomes.
    diligencePath: Request the latest board deck, cap table, and financing documents from management.
    relatedQuestionRefs:
      - QO034
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: Verified employee headcount by function and geography.
    whyItMatters: Hiring intensity is visible but actual fixed-cost scale is not, making operating leverage hard to model.
    diligencePath: Request an HR roster cut or payroll summary reconciled to office and contractor counts.
    relatedQuestionRefs:
      - QO035
    relatedTableRefs:
      - TO005
  - type: conflicting-data
    severity: minor
    topic: traction
    missingEvidence: >-
      A reconciled candidate/applicant metric dictionary explaining 300k processed candidates versus 468k evaluated
      applicants.
    whyItMatters: Metric-definition drift complicates cohort and conversion analysis for later customer and financial chapters.
    diligencePath: >-
      Ask Mercor to define candidate pool, evaluated applicants, interviewed applicants, and placed experts with
      consistent denominators.
    relatedQuestionRefs:
      - QO017
      - QO018
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: market-size
    missingEvidence: A public estimate specifically isolating high-skill expert post-training, evaluation, and benchmark spend.
    whyItMatters: >-
      Without a constrained SAM, valuation work must rely on outer-bound market proxies and adoption logic instead of
      precision.
    diligencePath: Request procurement budgets or third-party spend studies from frontier labs and enterprise AI teams.
    relatedQuestionRefs:
      - QM029
      - QM030
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-budgets
    missingEvidence: A public split of spend between benchmark creation, expert evaluation, RLHF, and contractor pass-through.
    whyItMatters: Mercor's real market depth depends on recurring budget lines, not just aggregate AI-spend headlines.
    diligencePath: Ask buyers for budget ownership, program frequency, and spend by workflow category.
    relatedQuestionRefs:
      - QM030
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: minor
    topic: market-boundary
    missingEvidence: A consistent taxonomy separating staffing, post-training services, and benchmark infrastructure across vendors.
    whyItMatters: Vendor categories blur together, which can distort competitive and valuation comparisons later in the report.
    diligencePath: Normalize vendor offerings into labor marketplace, services, and software layers during primary research.
    relatedQuestionRefs:
      - QM001
      - QM002
      - QM029
    relatedTableRefs:
      - TM001
  - type: private-evidence-only
    severity: material
    topic: win-rates
    missingEvidence: Vendor-level win rates, renewal rates, and realized pricing discounts across the competitive set.
    whyItMatters: Without commercial outcome data, competitive strength can only be inferred from positioning and public events.
    diligencePath: Request customer references, RFP history, and expansion data from Mercor management.
    relatedQuestionRefs:
      - QP029
    relatedTableRefs:
      - TP005
  - type: missing-source
    severity: material
    topic: lock-in
    missingEvidence: >-
      Evidence that Mercor's benchmark and evaluation products have recurring product-level retention rather than
      one-off project demand.
    whyItMatters: Durable valuation premiums require some form of lock-in beyond expert sourcing speed.
    diligencePath: Request product attach rates, repeat usage, and API or workflow retention metrics.
    relatedQuestionRefs:
      - QP030
    relatedTableRefs:
      - TP004
  - type: conflicting-data
    severity: minor
    topic: vendor-size
    missingEvidence: Comparable, same-date revenue or GMV figures across Mercor, Surge, and Scale.
    whyItMatters: Private valuation headlines alone can obscure whether Mercor is winning on scale or only on narrative.
    diligencePath: Normalize valuation, revenue, and customer-base disclosures before final valuation work.
    relatedQuestionRefs:
      - QP021
      - QP022
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: liquidity
    missingEvidence: Current cash balance, restricted cash, monthly burn, and 12-month runway plan.
    whyItMatters: >-
      Large private rounds and profitability anecdotes do not reveal whether Mercor can absorb growth shocks, breach
      costs, or slower collections without raising again.
    diligencePath: Request the latest balance sheet, monthly cash-flow bridge, and management forecast with downside cases.
    relatedQuestionRefs:
      - QI017
      - QI018
      - QI019
    relatedTableRefs:
      - TI004
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Net take rate, gross margin, and payment-cost burden by workflow, customer type, and geography.
    whyItMatters: >-
      Mercor's reported scale appears to include contractor pass-through, so investors need gross-to-net detail to
      choose the right valuation framework.
    diligencePath: Request bill-rate versus worker-rate data, payout-fee burden, bad-debt history, and margin by major program.
    relatedQuestionRefs:
      - QI027
    relatedTableRefs:
      - TI001
      - TI003
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: Revenue share, contract length, and renewal behavior for the top customers and top workflows.
    whyItMatters: >-
      A few accounts may drive a disproportionate share of revenue, which can make both growth and downside much more
      volatile than the headline run-rate suggests.
    diligencePath: Request top-10 customer concentration, by-account gross billings, and cohort retention or repeat-purchase metrics.
    relatedQuestionRefs:
      - QI022
      - QI023
      - QI030
    relatedTableRefs:
      - TI005
  - type: missing-source
    severity: minor
    topic: gross-margin-disclosure
    missingEvidence: A public disclosure that reconciles gross billings, contractor payouts, net revenue, and contribution margin.
    whyItMatters: Without that bridge, public comparisons to software or services peers remain apples-to-oranges.
    diligencePath: Ask management for a monthly gross-to-net bridge and a memo defining revenue-recognition policy.
    relatedQuestionRefs:
      - QI028
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: enterprise-integrations
    missingEvidence: Public API, integration, or customer-implementation documentation for Mercor Enterprise AI.
    whyItMatters: >-
      Without technical integration evidence, it is hard to tell whether Enterprise AI is a repeatable product layer or
