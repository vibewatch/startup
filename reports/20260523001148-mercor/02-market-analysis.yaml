company:
  name: Mercor
chapter:
  number: 2
  title: Market Analysis
  summary: 'Mercor serves a narrower market than top-down AI-spending narratives suggest: premium expert labor and evaluation infrastructure for frontier-model improvement. Public third-party reports support strong category growth in data annotation, AI training datasets, and enterprise AI investment, while technical papers show why human judgment still matters in post-training. The same evidence also shows that customer concentration, labor scrutiny, and automation substitutes can cap the practical SAM.'
sections:
- id: market-boundary
  title: Market boundary and job-to-be-done
  body: Mercor is easiest to misunderstand when it is described as either “HR tech” or “data labeling.” Both are incomplete. The company's current market sits at the intersection of premium labor marketplaces, AI post-training services, and evaluation infrastructure. Public company pages and TechCrunch reporting show Mercor supplying domain experts—doctors, lawyers, engineers, bankers, consultants—to frontier AI labs that need judgment-heavy work such as rankings, evaluations, forms, reports, and benchmark tasks. That means Mercor is no longer selling the same product as an applicant-tracking system, a traditional staffing firm, or a commodity crowdsourcing marketplace. Its core job-to-be-done is getting scarce expert knowledge into frontier-model improvement loops quickly enough for labs and enterprises to pay for it. That narrower definition matters because it sharply reduces the true serviceable market versus top-down AI-spend headlines while also clarifying which competitors and risks
    actually matter.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
  - CM025
  - CM029
  tableRefs:
  - TM001
  figureRefs:
