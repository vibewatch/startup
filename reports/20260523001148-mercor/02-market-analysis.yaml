- id: drivers-and-constraints
  title: Growth drivers and adoption constraints
  body: 'The strongest demand driver is technical. OpenAI''s InstructGPT and Anthropic''s Constitutional AI both show that alignment and model-quality improvement remain feedback-intensive, even when some of the feedback loop is automated. Mercor, Labelbox, Appen, iMerit, and CloudFactory all now market expert-centric RLHF, evaluation, and alignment services, which indicates that the market has already shifted from low-skill labeling toward higher-judgment work. Mercor also benefited from a one-off industry event: Meta''s investment in Scale AI created neutrality concerns that pushed some labs to seek alternatives. But the same market has important friction. Labor-rights scrutiny, trade-secret sensitivity, and low switching costs keep buyers cautious and pricing competitive. Automation-focused substitutes such as Snorkel can also eat into the lower-value layers of human-data spend. The net result is a fast-growing market with real urgency, but not one where top-down TAM alone guarantees
    durable spend or easy renewal economics. In practice, buyers still need trust, security, and measurable model gains before broad rollout.'
