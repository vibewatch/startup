- id: TM005
  title: Sizing and adoption diligence gaps table
  columns:
  - Gap
  - What is public now
  - Why insufficient
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Expert post-training SAM
    - Outer-bound annotation and dataset TAMs only
    - No public slice isolates premium expert tasks
    - Can overstate upside if top-down TAM is used naively
    - Request spend by workflow and domain from buyers
  - - Buyer concentration
    - Named labs and enterprise interest
    - No customer-level spend distribution
    - Revenue durability cannot be inferred from logos
    - Request customer concentration and renewal data
  - - Budget ownership
    - Research and product leaders inferred
    - No public procurement map by function
    - Hard to model sales motion and cycle length
    - Interview buyers and collect org charts
  - - Recurring versus project spend
    - One-off benchmark and eval demand visible
    - No public repeat-purchase rates
    - Limits retention and NRR analysis
    - Ask for program frequency and cohort retention
  - - Net spend versus pass-through
    - Gross market and gross-revenue language common
    - Unknown labor pass-through ratios distort market sizing
    - Can misread gross throughput as net revenue opportunity
    - Reconcile vendor take-rates and contractor payout shares
  notes: This table makes explicit where public market data stops and primary diligence has to begin.
