  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board composition, voting rights, and investor preference terms.
    whyItMatters: Mercor has repriced rapidly; hidden control and preference rights can materially affect underwriting and exit outcomes.
    diligencePath: Request the latest board deck, cap table, and financing documents from management.
    relatedQuestionRefs:
    - QO034
    relatedTableRefs:
    - TO002
    - TO003
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: Verified employee headcount by function and geography.
    whyItMatters: Hiring intensity is visible but actual fixed-cost scale is not, making operating leverage hard to model.
    diligencePath: Request an HR roster cut or payroll summary reconciled to office and contractor counts.
    relatedQuestionRefs:
    - QO035
    relatedTableRefs:
    - TO005
  - type: conflicting-data
    severity: minor
    topic: traction
    missingEvidence: A reconciled candidate/applicant metric dictionary explaining 300k processed candidates versus 468k evaluated applicants.
    whyItMatters: Metric-definition drift complicates cohort and conversion analysis for later customer and financial chapters.
    diligencePath: Ask Mercor to define candidate pool, evaluated applicants, interviewed applicants, and placed experts with consistent denominators.
