company:
  name: Mercor
chapter:
  number: 1
  title: Company Overview
  summary: Mercor has evolved from an AI recruiting startup into a premium expert marketplace for AI post-training and evaluation work. Public sources support a funding climb from a $3.6 million seed in 2023 to a $10 billion Series C in October 2025, alongside rapid revenue growth and emerging profitability. The same sources also surface meaningful legal, security, and concentration risks that now sit beside the company's growth narrative.
sections:
- id: identity-business-model
  title: Identity and business model
  body: 'Mercor now presents itself less as a generic hiring startup and more as an expert marketplace feeding frontier AI systems. The homepage frames the company as a platform organizing human intelligence for the AI economy, while the experts page shows the operating reality: Mercor recruits specialists such as doctors, lawyers, engineers, and finance professionals for remote contract work that advances AI systems. The product promise is speed and fit. Mercor uses AI interviewing, matching, and workflow automation to decide who should work on a project and then manages payment through the marketplace. That positioning matters because it explains both the valuation reset and the company''s risk profile for investors. Mercor is no longer competing only with recruiting software or staffing agencies. It is now competing in the higher-growth but more contentious post-training, evaluation, and human-in-the-loop AI data market, where customer budgets are large, switching costs are low, and data-rights
    questions are sharper.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO015
  - CO016
  tableRefs:
  - TO001
  figureRefs:
  - FO001
- id: founders-governance
  title: Founders, leadership, and governance
  body: 'Fetched public sources consistently identify Mercor''s founding trio as Brendan Foody, Adarsh Hiremath, and Surya Midha rather than the alternate names sometimes repeated in secondary summaries. PR Newswire, KTVU, and Forbes each tie the founders to Bay Area debate networks, Harvard and Georgetown dropouts, and the Thiel Fellowship. The founder story remains central to Mercor''s brand: extremely young operators who moved from dorm-room recruiting software to AI-lab infrastructure in under three years. That mythology helps fundraising, but it also raises classic key-person and maturity questions. Mercor has started to professionalize around the edges, adding former Uber executive Sundeep Jain as its first president and drawing senior hires from OpenAI and Scale. Still, the company remains strongly founder-defined, and governance visibility is limited outside selectively disclosed board participation from Benchmark and major investors.'
  claimRefs:
  - CO005
  - CO006
  - CO007
  - CO031
  - CO032
  - CO033
  tableRefs:
  - TO002
  - TO003
- id: funding-scale
  title: Funding, scale, and operating footprint
  body: Mercor's financing path is unusually steep even by 2025 AI standards. The company went from a $3.6 million seed in 2023 to a $250 million Series A valuation in 2024, then to a $2 billion Series B in February 2025 and a $10 billion Series C in October 2025. The resulting disclosed primary capital base is roughly $483.6 million. Publicly reported traction climbed alongside that capital. CNBC reported 300,000 processed candidates and more than 100,000 interviews by February 2025, while TechCrunch reported 468,000 evaluated applicants and a $75 million ARR run rate at roughly the same point. By September 2025, TechCrunch said Mercor was approaching a $450 million run-rate and had produced $6 million of first-half profit. Careers data fetched in this run also shows the company hiring aggressively across engineering, operations, finance, and enterprise roles while claiming profitability and multi-office expansion across San Francisco, New York, and London.
  claimRefs:
  - CO008
  - CO009
