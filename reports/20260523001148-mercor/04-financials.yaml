- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - What public sources say instead
  - Why insufficient
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Cash balance and short-term liquidity
    - Large rounds and profitability anecdotes
    - Round size does not equal cash remaining
    - Runway cannot be tested
    - Request latest cash balance, restricted cash, and forecast
  - - Monthly burn and operating cash flow
    - Profit and run-rate snippets only
    - Accounting profit does not reveal cash conversion
    - Downside planning remains speculative
    - Request monthly P&L plus cash-flow statement
  - - Net take rate by workflow
    - Gross revenue and payout figures
    - Need to separate throughput from net economics
    - Valuation multiple selection can be distorted
    - Request gross billings, expert payouts, and Mercor net revenue by program
  - - Gross margin by domain and customer type
    - Expert hourly examples and payout scale only
    - No view on contribution margin after labor and payment costs
    - Cannot compare Mercor to software or services peers cleanly
    - Request margin bridge by use case
  - - Customer concentration and contract duration
    - Subset-brand concentration reported qualitatively
    - No denominator or renewal data
    - Revenue quality and durability remain open
    - Request top-10 customer share, contract length, and cohort retention
  - - Breach and compliance downside cost
    - Paused Meta work and contractor suits reported
    - No reserve or remediation-cost disclosure
    - Could change burn and financing needs materially
    - Request incident cost estimate, legal reserves, and remediation budget
  notes: These are the minimum missing inputs that block a clean underwriting model even though the growth narrative is unusually strong.
