- id: TI004
  title: Capital adequacy table
  columns:
  - Field
  - Public value / status
  - Source / timing
  - Implication
  - Gap or next ask
  rows:
  - - Disclosed primary capital
    - $483.6M total across seed, Series A, B, and C
    - 2023-2025 public financing announcements
    - Mercor has raised enough equity to fund aggressive internal build-out
    - Need cap table, preference stack, and any secondaries
  - - Latest priced round
    - $350M Series C at $10B valuation
    - Oct 2025
    - Late-stage equity materially reduced immediate financing pressure
    - Need cash proceeds net of fees and any investor rights
  - - Use of proceeds
    - Talent network, matching, faster delivery, broader capability build
    - Series B and Series C posts
    - Capital appears earmarked for both supply and product layers
    - Request actual post-close budget allocation
  - - Cash on hand
    - Not publicly disclosed
    - n/a
    - Cannot test runway despite large round sizes
    - Request latest balance sheet and liquidity schedule
  - - Monthly burn
    - Not publicly disclosed
    - n/a
    - Impossible to convert valuation and fundraising into runway
    - Request cash burn by month and planned hiring spend
  - - Debt / project finance obligations
    - No public debt or facility disclosed in fetched sources
    - n/a
    - Positive on surface, but not enough to rule out obligations
    - Request debt schedule, vendor financing, and contingent liabilities
  - - Next-round trigger
    - Likely tied more to growth, trust, and concentration shocks than nominal cash scarcity
    - Inferred from rapid scale and breach risk
    - Large private raises do not remove need for contingency planning
    - Model downside case where customer reviews slow growth or margin
  notes: Mercor's public fundraising story is strong, but public liquidity data remains too sparse to underwrite runway from announcements alone.
