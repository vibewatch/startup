  - Unknowns
  rows:
  - - Finder / matching economics
    - Hourly finder's fee plus matching rate
    - Realized economics reported by TechCrunch, not list pricing
    - Mercor likely earns a spread rather than flat SaaS seats
    - Exact take-rate ladder by customer, domain, or contract type
  - - Top expert upside
    - Up to $200 per hour
    - Realized third-party-reported example
    - Premium domains can support high-value projects
    - How often these rates occur and what gross margin they leave
  - - Finance / IR expert listings
    - $80-$160 per hour
    - Observed marketplace signal
