- id: unit-economics-profitability
  title: Unit economics and operating leverage
  body: Mercor's growth arc is unusually steep. Public sources move from a $75 million run rate and reported profitability in February 2025 to roughly $450 million annualized revenue by September 2025, then to Mercor's own 2026 claim of having crossed $1 billion in annualized revenue earlier that year. KTVU separately quoted Brendan Foody saying the company crossed a $100 million revenue run rate by March 2025 and was extremely profitable. Those data points create a plausible operating-leverage story, especially because TechCrunch also reported $6 million of first-half 2025 profit. But the same evidence points to a heavy pass-through labor base rather than a purely software-like margin structure. Daily contractor payouts rose from more than $1.5 million in late 2025 to over $2 million in Mercor's 2026 post, while internal posts describe payments, contract systems, and control upgrades as critical scaling work. The result is encouraging top-line proof without the public gross-margin, take-rate,
    or cash-conversion detail needed to convert momentum into a fully underwritten model.
