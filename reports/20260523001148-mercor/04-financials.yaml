  - - Equity research expert listings
    - $120 per hour
    - Observed marketplace signal
    - Supports finance-domain demand from AI buyers
    - Whether this reflects representative or promotional pricing
  - - Payout onboarding
    - First Stripe payment held for seven days; bank account and SMS 2FA required
    - Operational policy
    - Adds friction and support workload to payout operations
    - Actual payout-failure rate and support cost per contractor
  notes: Public pricing evidence is sparse and mostly worker-facing or management-reported; realized customer pricing remains a diligence item.
