company:
  name: Mercor
chapter:
  number: 4
  title: Financials
  summary: Mercor's public financial picture combines extraordinary growth proof with unusually sparse unit-economics disclosure. The company has disclosed about $483.6 million of primary capital, moved from a $75 million run rate in February 2025 to roughly $450 million by September 2025, and later claimed to have crossed a $1 billion annualized run rate in 2026. But public sources still do not reveal cash, burn, runway, take rate, or gross margin, so investors can underwrite momentum more confidently than revenue quality.
sections:
- id: revenue-model-quality
  title: Revenue model and revenue quality
  body: 'Mercor''s public financial story is impressive but structurally easy to misread. The business is not a classic SaaS model with clean seat-based subscription revenue. Public reporting and Mercor''s own docs instead describe a marketplace-and-services model: customers pay Mercor to source, vet, and coordinate domain experts for AI model training, evaluations, and related workflow design, and Mercor then pays those experts through its own payout stack. That distinction matters because Mercor''s fastest-growing headline numbers appear to include gross customer billings before contractor payouts. TechCrunch explicitly reported that Mercor counts the total amount customers pay before experts receive their portion. That accounting choice may be common in this category, but it means investors need to separate throughput from net economics before treating headline run-rate figures like software revenue. Public worker-side pricing signals and reported hourly fee mechanics suggest real monetization
    power, yet the exact take rate and realized discounting remain undisclosed.'
  claimRefs:
