- id: capital-adequacy
  title: Capital adequacy and financing dependency
  body: 'Mercor does not look capital-starved on the surface. The company disclosed roughly $483.6 million of primary capital across seed, Series A, Series B, and Series C, culminating in a $350 million Series C at a $10 billion valuation in October 2025. Management also gave unusually concrete use-of-funds language: grow the talent network, improve matching, and speed delivery. Those priorities are sensible for a company simultaneously trying to defend marketplace liquidity and build more productized evaluation capabilities. The problem is that disclosed financing history is not the same as disclosed liquidity. Mercor does not publish cash on hand, monthly burn, runway months, or any debt schedule in the sources reviewed for this chapter. That omission matters because the company now carries real downside sensitivity to customer concentration, legal and breach remediation costs, and the internal-control investment required by hypergrowth. The funding chronology is therefore strong evidence
    of access to capital, but it is still not enough to conclude runway is safe under stress.'
