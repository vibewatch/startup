tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Revenue stream
  - Mechanism
  - Unit / denominator
  - Current value / status
  - Quality / margin read
  - Diligence ask
  rows:
  - - Expert marketplace work
    - Client buys access to domain experts for model training and evaluation
    - Hours or project scopes
    - Core current stream
    - Likely healthy demand but labor pass-through heavy
    - Break out gross billings, expert payouts, and Mercor take rate by workflow
  - - Matching / finder economics
    - Mercor layers a finder or matching rate onto expert work
    - Hourly spread / placement fee
    - Publicly reported by TechCrunch
    - Shows monetization beyond pure payroll processing
    - Provide standard contract templates and realized fee schedules
  - - Benchmark and evaluation services
    - Mercor sells benchmark design, eval environments, and related data work
    - Project or program fee
    - Growing strategic layer
    - Potentially better margin than pure staffing if reusable assets attach
    - Disclose attach rate of benchmarks to marketplace work
  - - Enterprise AI workflow design
    - Mercor is expanding into enterprise agent and workflow products
    - Program fee or software-enabled services
    - Emerging
    - Could improve mix if less labor-intensive
    - Show recurring revenue and software/services split
  - - Gross contractor throughput
    - Customers pay Mercor a gross amount before expert payouts
    - Gross billings
    - Material to headline revenue
    - Can inflate scale optics if mistaken for net revenue
    - Reconcile billings, payouts, net revenue, and deferred revenue
  - - Payout operations
    - Mercor administers weekly payouts through Stripe and sometimes Wise
    - Payment rail / transaction flow
    - Operational backbone
    - Necessary but potentially fee-bearing and compliance-heavy
    - Quantify payment costs, failures, and payout float exposure
  notes: Rows separate what public sources say Mercor sells from what underwriters still need to model gross-to-net economics accurately.
