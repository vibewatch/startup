company:
  name: Mercor
chapter:
  number: 3
  title: Competitors
  summary: Mercor competes in a fast-converging field of human-data, RLHF, and evaluation vendors rather than against a single direct rival. Its main edge today is premium expert supply and a cleaner neutrality narrative after Meta's Scale AI deal, while its main weakness is thinner workflow lock-in than software-centric competitors. The competitive race is therefore shifting from who can source labor fastest to who can own the recurring evaluation workflow before matching becomes commoditized.
sections:
- id: landscape
  title: Landscape structure and direct peer set
  body: Mercor competes inside a crowded but still rapidly reshuffling human-data market. The direct peer set includes Scale AI, Surge AI, Labelbox, Appen, iMerit, CloudFactory, Invisible, Toloka, and a growing set of automation-centric substitutes such as Snorkel. These vendors do not all solve the same problem in the same way. Scale and Appen approach the market from scale and broad service breadth. Labelbox approaches it from workflow software plus an expert network. Mercor approaches it from a premium-expert marketplace that is trying to climb into benchmark and evaluation software. That distinction matters because buyers are not choosing among identical vendors. They are choosing combinations of neutrality, expert depth, workflow control, enterprise governance, and turnaround speed. Mercor therefore does not need to beat every competitor on every axis, but it does need to hold a clear edge where high-value human judgment matters most and where buyers are least willing to accept generic
    crowd-work.
  claimRefs:
  - CP001
  - CP002
  - CP003
  - CP004
  - CP005
  - CP006
  - CP007
  - CP031
  tableRefs:
  - TP001
