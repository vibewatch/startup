- id: moat-durability
  title: Moat durability and competitive risk
  body: 'Mercor''s strongest competitive case is that it can source premium experts quickly and convert them into economically useful post-training workflows faster than slower or more software-centric rivals. But that is not yet a durable moat on its own. Software-first vendors such as Labelbox and Snorkel are trying to own the workflow layer where lock-in is usually created. Managed-service incumbents such as Appen and iMerit can sell governance, breadth, and established buyer relationships. Meanwhile, marketplace advantages tend to erode if experts multi-home or if matching becomes easier to automate. Mercor''s move into benchmarks and evaluation environments is therefore strategically important: it is an attempt to create product-level stickiness above the labor marketplace. Investors should view the company as competitively advantaged today in some urgent buyer situations, but still racing to build a more durable right to win before the market matures and before today''s neutrality
    tailwind fades. Until recurring product attachment is proven, the company should be treated as a strong but still transitional competitor rather than an already-defended category winner.'
