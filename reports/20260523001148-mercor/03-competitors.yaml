- id: switching-distribution
  title: Switching cost, multi-homing, and distribution
  body: 'The category appears structurally multi-homed. Experts can likely work across more than one marketplace, and buyers can test multiple vendors because most offerings are still sold as projects or custom programs rather than as deeply embedded system-of-record software. That weakens pure marketplace moats. At the same time, the market is shaped by episodic distribution shocks. Mercor clearly benefited when Meta''s investment in Scale AI raised neutrality concerns and CNBC reported OpenAI was winding down work with Scale. But those gains can prove temporary if Mercor does not convert the demand shock into repeat workflows or harder product lock-in. Appen shows the opposite model: a public incumbent with governance breadth and a longer enterprise track record. Mercor''s challenge is to keep its speed and neutrality narrative while building enough workflow ownership that buyers do not simply rotate to the next acceptable vendor when market conditions change.'
  claimRefs:
  - CP013
  - CP014
  - CP015
  - CP019
  - CP020
  - CP021
  - CP022
  - CP024
  - CP027
  - CP029
  - CP033
  tableRefs:
