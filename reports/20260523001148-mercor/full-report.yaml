      - number: '2.2'
        title: Sizing the opportunity
        blocks:
          - type: paragraph
            body: >-
              Public market-sizing sources offer only outer bounds. MarketsandMarkets projects a $3.6 billion data
              annotation and labeling market by 2027 and a $9.58 billion AI training dataset market by 2029, but both
              categories include far more than Mercor's premium expert niche. Stanford HAI's 2025 AI Index, summarized
              by IBM, shows the broader demand backdrop: corporate AI investment reached $252.3 billion in 2024, U.S.
              private AI investment reached $109.1 billion, and newly funded generative AI startups nearly tripled.
              Those figures support the claim that buyer budgets are forming rapidly, but they do not reveal how much
              labs spend specifically on expert contractors, benchmark creation, or workflow-rich evaluation
              environments. The practical conclusion is that Mercor's TAM is smaller than generic AI-investment or
              annotation headlines suggest, but still grows inside a much larger wave of frontier-model spending and
              commercialization. That mismatch between top-down spend and bottom-up serviceable budgets is one of the
              central diligence challenges for this company, and it should keep investors skeptical of any single
              gigantic TAM slide.
