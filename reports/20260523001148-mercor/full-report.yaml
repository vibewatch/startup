  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segments and Market Reach
        blocks:
          - type: paragraph
            body: >-
              Mercors customer base is anchored in frontier AI labs — organizations building and refining large language
              models and multimodal AI systems that require large-scale human feedback data. TechCrunch described Mercor
              as the go-to provider for AI labs building training datasets as of October 2025, and Bloomberg reinforced
              this characterization in a detailed April 2026 profile. Public scale signals are stronger on throughput
              than on active workforce size: CNBC said Mercor had processed 300,000 candidates by February 2025, and
              Mercor later said it had more than 30,000 experts on its roster by October 2025. Beyond frontier labs,
              Mercor has launched two additional customer-facing segments: an Enterprise AI product targeting large
              organizations seeking AI-assisted hiring and workforce management, and a Research portal aimed at academic
              and government AI programs seeking domain-expert evaluators. The Experts product line represents a premium
              tier within the marketplace, giving AI labs access to credentialed domain specialists for tasks requiring
              advanced reasoning or subject-matter knowledge. Geographic reach on the worker side is global, though no
              breakdown of customer geography by revenue has been disclosed. The customer segmentation picture that
              emerges from public evidence is one of concentrated demand from a small number of high-value AI lab
              relationships driving the vast majority of revenue, with diversification into enterprise and research
              segments at an early stage.
