        title: Adoption Trajectory and Revenue Growth
        blocks:
          - type: paragraph
            body: >-
              Mercors revenue growth trajectory is among the most striking in the AI tooling sector. The company grew
              from approximately $2 million in monthly revenue to $2 million per day — roughly a 30-fold increase — over
              the course of 2025. This growth was corroborated by multiple independent sources: TechCrunch reported a
              $450 million annualized revenue run rate in September 2025, Forbes confirmed this figure in its AI Cloud
              100 coverage, and Bloomberg provided additional color in its April 2026 profile. The funding trajectory
              tells a parallel story: a $34 million Series A in February 2024, a $100 million Series B at $2 billion
              valuation in February 2025, and a further $350 million Series C at a $10 billion valuation in October 2025
              — a 40x valuation increase over roughly 20 months. The growth pattern is consistent with a company
              capturing rapidly expanding demand from AI labs scaling their model training operations. CNBC coverage of
              Scale AI losing OpenAI and Google as clients suggests that some portion of Mercors growth came from
              customers migrating from or supplementing Scale AI relationships. The adoption funnel from registered
              worker to active project deployment is not publicly detailed, but the documentation at
              talent.docs.mercor.com indicates structured onboarding and project milestone systems that support rapid
              scaling of new customer deployments.
