      - number: '7.2'
        title: Operational, Security, and Quality Risk
        blocks:
          - type: paragraph
            body: >-
              In March 2026, Mercor confirmed it had suffered a cyberattack that exposed personal data of some users.
              TechCrunch reported the breach, and within days a federal class-action lawsuit was filed — Gill v.
              Mercorio Corporation — in the Northern District of California, alleging negligent data security practices.
              Claim Depot and CourtListener both confirm the case is active. TechCrunch noted in a follow-up piece that
              the simultaneous occurrence of the breach and the Scale AI litigation created compounding reputational
              risk. Mercor maintains a Trust Center at trust.mercor.com, but has not disclosed any SOC 2 Type II
              certification, ISO 27001 certification, or NIST CSF conformance assessment. The 2024 NIST CSF establishes
              best-practice controls for organizations handling sensitive personal data; Mercors conformance is unknown.
              On the operational quality side, Mercors own blog post describing how the platform nearly failed during a
              10x volume spike reveals infrastructure fragility that has not been remediated in any publicly described
              way. Rest of World documented systematic quality challenges among AI annotation workers across the
              industry, suggesting supply-side quality risk is not unique to Mercor but is material given that output
              quality is Mercors core value proposition. No published error rates, SLA breach rates, or quality audit
              results are available.
