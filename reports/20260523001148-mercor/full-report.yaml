  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and job-to-be-done
        blocks:
          - type: paragraph
            body: >-
              Mercor is easiest to misunderstand when it is described as either “HR tech” or “data labeling.” Both are
              incomplete. The company's current market sits at the intersection of premium labor marketplaces, AI
              post-training services, and evaluation infrastructure. Public company pages and TechCrunch reporting show
              Mercor supplying domain experts—doctors, lawyers, engineers, bankers, consultants—to frontier AI labs that
              need judgment-heavy work such as rankings, evaluations, forms, reports, and benchmark tasks. That means
              Mercor is no longer selling the same product as an applicant-tracking system, a traditional staffing firm,
              or a commodity crowdsourcing marketplace. Its core job-to-be-done is getting scarce expert knowledge into
              frontier-model improvement loops quickly enough for labs and enterprises to pay for it. That narrower
              definition matters because it sharply reduces the true serviceable market versus top-down AI-spend
              headlines while also clarifying which competitors and risks actually matter.
