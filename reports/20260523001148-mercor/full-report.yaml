      - number: '7.3'
        title: Partner, Dependency, and People Risk
        blocks:
          - type: paragraph
            body: >-
              Customer concentration is a structural risk for Mercor. Evidence from multiple journalists points to a
              revenue base dominated by frontier AI lab relationships. The direct precedent is striking: Scale AI lost
              OpenAI and Google as customers within a short period, resulting in a 14% workforce reduction. Reuters
              confirmed OpenAI wound down Scale AI work in June 2025. If Mercors top-one or top-two customers reduced
              engagement at a similar pace, the revenue impact could be catastrophic absent rapid replacement. Mercor
              has attempted to diversify through Enterprise AI and Research segments, but no revenue contribution from
              these segments has been disclosed. On the people side, the founding team consists of young engineers;
              press coverage from KTVU and Times of India highlights their technical capability but also the absence of
              experienced operating executives in public disclosures. Rest of World and Time magazine both documented
              wage and labor-rights concerns among AI annotators working for platforms similar to Mercor; these concerns
              apply directly to Mercors global expert network, which the company said exceeded 30,000 people by October
              2025. The talent portal documentation shows that Mercor has structured dispute-resolution pathways and
