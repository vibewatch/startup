      - number: '1.3'
        title: Funding, scale, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Mercor's financing path is unusually steep even by 2025 AI standards. The company went from a $3.6 million
              seed in 2023 to a $250 million Series A valuation in 2024, then to a $2 billion Series B in February 2025
              and a $10 billion Series C in October 2025. The resulting disclosed primary capital base is roughly $483.6
              million. Publicly reported traction climbed alongside that capital. CNBC reported 300,000 processed
              candidates and more than 100,000 interviews by February 2025, while TechCrunch reported 468,000 evaluated
              applicants and a $75 million ARR run rate at roughly the same point. By September 2025, TechCrunch said
              Mercor was approaching a $450 million run-rate and had produced $6 million of first-half profit. Careers
              data fetched in this run also shows the company hiring aggressively across engineering, operations,
              finance, and enterprise roles while claiming profitability and multi-office expansion across San
              Francisco, New York, and London.
