      - number: '3.2'
        title: Capability breadth and packaging
        blocks:
          - type: paragraph
            body: >-
              Capability overlap across the category is increasing. Mercor, Scale, Labelbox, and Appen now all market
              some combination of RLHF, evaluations, alignment, or benchmark-style services. That convergence lowers
              simple feature-based differentiation and pushes competition toward execution. Mercor still stands out by
              explicitly marketing domain-expert labor and high-skill categories, while software-centric rivals
              emphasize workflow tooling, data operations, and factory-like control. Packaging reinforces that divide.
              Public list pricing is scarce across the peer set, which means buyers usually negotiate custom enterprise
              deals and evaluate vendors on speed, trust, neutrality, and quality rather than headline rate cards. In
              practice, this makes the competitive contest less about whose website publishes a price and more about
              whose combination of expert supply, product control, and governance best fits a specific program. That
              tends to favor specialists in narrow use cases and broader incumbents in large enterprise rollouts,
              especially when procurement teams want references, security controls, and proven integration depth.
