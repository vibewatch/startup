        title: Mitigations, Kill Criteria, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Mercors publicly observable mitigations are partial and largely undocumented. The Trust Center at
              trust.mercor.com provides basic security-posture signaling. The talent portal contract and legal support
              documentation indicates that Mercor has legal frameworks in place for worker relationships. The company
              made a public breach disclosure in March 2026, suggesting a functioning incident-response capability.
              However, no SOC 2 report, insurance disclosures, capacity SLAs, quality audit results, or regulatory
              reserve amounts have been published. For investment monitoring purposes, kill criteria should include: an
              adverse AB 5 ruling or DOL enforcement action; an adverse court finding or new trade-secret dispute
              showing improper use of competitor customer materials; a second material security breach within 12 months;
              or confirmed loss of more than 50% of revenue from a single customer departure. Early-warning signals to
              monitor include CourtListener docket updates for the breach case and any new competitor litigation, DOL
              and NLRB enforcement trackers, Mercors Trust Center updates, and monthly ARR bridge data from the company.
              The most critical diligence asks remain: a legal memo quantifying AB 5 exposure, a SOC 2 Type II report or
              equivalent, a top-10 customer revenue breakdown, and confirmation of insurance coverage for cyber and E&O
              risk.
