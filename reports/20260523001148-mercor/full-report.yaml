companyProfile:
  summary: >-
    Mercor is a fast-growing private AI labor-and-evaluation company founded in January 2023 by Brendan Foody, Adarsh
    Hiremath, and Surya Midha. The company began with AI-assisted recruiting and has since expanded into supplying
    domain experts, benchmarks, and workflow infrastructure for frontier-model training, evaluation, and
    enterprise-agent projects. Public evidence ties Mercor to customers such as OpenAI, Anthropic, and Meta, while
    product pages and docs show APEX benchmarks, Enterprise AI, assessments, and RL Studio as the clearest signs of a
    move up the stack beyond pure marketplace volume.
