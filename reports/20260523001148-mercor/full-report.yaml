      - number: '1.4'
        title: Milestones and adverse events
        blocks:
          - type: paragraph
            body: >-
              Mercor's acceleration has come with visible friction. On the positive side, the company benefited from a
              structural shift in the AI data supply chain after Meta's investment in Scale AI unsettled large model
              labs that wanted neutral vendors. That created room for Mercor to position itself as a premium expert
              marketplace for post-training work. Yet Mercor also encountered the same category of risks that accompany
              handling sensitive workflows and contractor knowledge at scale. Scale AI sued Mercor and former Scale
              employee Eugene Ling in September 2025, alleging trade-secret misappropriation tied to customer strategy
              documents. Court records show the case was later dismissed with prejudice in January 2026, which removes
              one litigation overhang but does not erase the underlying concern around expert knowledge leakage. More
              seriously for current operations, a March 2026 breach tied to LiteLLM malware triggered customer reviews;
              TechCrunch reported that Meta paused contracts while OpenAI investigated its exposure. Together, those
              episodes make information-security maturity and enterprise trust immediate diligence topics rather than
              distant scaling concerns.
