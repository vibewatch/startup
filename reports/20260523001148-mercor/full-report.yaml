            body: >-
              The biggest open issue in Mercor's financial chapter is not whether the company can raise money; it is
              whether investors can convert the public growth narrative into a trustworthy revenue-quality view.
              TechCrunch said a subset of big brands accounts for an outsized share of revenue, and the Scale AI
              litigation described single customer opportunities worth millions of dollars. That combination implies
              large-account upside but also concentration exposure. The April 2026 breach adds another financial risk
              layer because TechCrunch reported Meta paused contracts and other model makers were reviewing
              relationships, even as five contractors pursued lawsuits over alleged data exposure. Category volatility
              also remains real: CNBC reported Scale AI cut 14% of its workforce while trying to win back customers
