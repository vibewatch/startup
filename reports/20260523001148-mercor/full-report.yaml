chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Mercor now presents itself less as a generic hiring startup and more as an expert marketplace feeding
              frontier AI systems. The homepage frames the company as a platform organizing human intelligence for the
              AI economy, while the experts page shows the operating reality: Mercor recruits specialists such as
              doctors, lawyers, engineers, and finance professionals for remote contract work that advances AI systems.
              The product promise is speed and fit. Mercor uses AI interviewing, matching, and workflow automation to
              decide who should work on a project and then manages payment through the marketplace. That positioning
              matters because it explains both the valuation reset and the company's risk profile for investors. Mercor
              is no longer competing only with recruiting software or staffing agencies. It is now competing in the
              higher-growth but more contentious post-training, evaluation, and human-in-the-loop AI data market, where
              customer budgets are large, switching costs are low, and data-rights questions are sharper.
