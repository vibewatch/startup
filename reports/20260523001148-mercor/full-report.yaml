      - number: '8.4'
        title: Bull / Base / Bear Scenarios and Return Analysis
        blocks:
          - type: paragraph
            body: >-
              The bull case is not just more volume. It requires Mercor to convert its benchmark and workflow assets
              into stickier software-like spend while broadening beyond a few frontier labs. In that version of the
              story, APEX and Enterprise AI become real budget lines, RL Studio and assessments improve matching and
              delivery economics, the breach fades without a second incident, and concentration falls enough that
              customers view Mercor as infrastructure rather than a vendor of convenience. That can support a $12
              billion to $18 billion outcome over time. The base case is more mixed: revenue keeps growing, Mercor
              repairs trust, and product assets help sales, but customer concentration remains meaningful and
              gross-to-net quality stays opaque. In that world the valuation likely settles into a $7 billion to $10
              billion range, which means the current mark already captures much of the upside. The bear case explicitly
              combines the known risk vectors: a major customer pause or loss, prolonged breach or class-action fallout,
              rising labor or contractor-compliance costs, or failure of the benchmark and software layers to monetize
              beyond thought leadership. Then Mercor can be valued closer to services and labor platforms, producing a
              much lower $2.5 billion to $5 billion range.
            claimRefs:
              - CV011
