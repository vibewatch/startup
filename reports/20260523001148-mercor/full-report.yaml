      - number: '8.5'
        title: Valuation Risks and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              Four risks dominate the downside. First is concentration: public reporting repeatedly points to a revenue
              base anchored by only a few AI labs, which means one paused or lost relationship can move the valuation
              far more than it would at a diversified software company. Second is trust and security: Mercor's 2026
              breach and resulting litigation matter not only because of direct cost, but because they challenge the
              credibility required to handle sensitive enterprise and model-development workflows. Third is legal and
              labor exposure. Mercor's own docs show a globally distributed contractor machine with
              jurisdiction-specific payment constraints, time-tracking oversight, and human review of disputes; that
              operating complexity is part of the moat, but it is also part of the risk stack. Fourth is narrative risk.
              If APEX, Enterprise AI, RL Studio, and assessments do not translate into software-like attachment,
              investors may eventually decide Mercor is better framed as a premium labor-and-services marketplace. That
              would compress the multiple even if top-line growth remains good. A second material security incident,
              clear customer churn after the breach, or evidence of margin pressure from legal or contractor costs would
              each break the current thesis quickly.
            claimRefs:
