  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and revenue quality
        blocks:
          - type: paragraph
            body: >-
              Mercor's public financial story is impressive but structurally easy to misread. The business is not a
              classic SaaS model with clean seat-based subscription revenue. Public reporting and Mercor's own docs
              instead describe a marketplace-and-services model: customers pay Mercor to source, vet, and coordinate
              domain experts for AI model training, evaluations, and related workflow design, and Mercor then pays those
              experts through its own payout stack. That distinction matters because Mercor's fastest-growing headline
              numbers appear to include gross customer billings before contractor payouts. TechCrunch explicitly
              reported that Mercor counts the total amount customers pay before experts receive their portion. That
              accounting choice may be common in this category, but it means investors need to separate throughput from
              net economics before treating headline run-rate figures like software revenue. Public worker-side pricing
              signals and reported hourly fee mechanics suggest real monetization power, yet the exact take rate and
              realized discounting remain undisclosed.
