      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The buyer map for Mercor-like services is unusually asymmetric. The buyer is often a research operations
              leader, model-evals lead, or enterprise AI product owner. The user may be a post-training or benchmarking
              team. The payer is a model-development or enterprise transformation budget. The supply-side professional
              is both a labor input and the product itself, because the company is monetizing expert judgment rather
              than just software seats. That structure helps explain why the market can move so fast: a single lab can
              award meaningful spend quickly when model-quality bottlenecks become urgent. It also explains why the
              market can reverse just as quickly. A handful of frontier labs matter disproportionately, status-quo
              employers may resist sharing the workflows that make experts valuable, and enterprise buyers still force
              security, IP, and trust reviews before scaling programs. Mercor therefore benefits from budget urgency but
              still faces procurement drag and elongated proof-of-value cycles in regulated domains. That makes
              reference quality and trust posture unusually important competitive weapons.
