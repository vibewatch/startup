      - number: '8.2'
        title: Recommendation and Valuation Stance
        blocks:
          - type: paragraph
            body: >-
              Recommended stance: TRACK with MEDIUM confidence, HIGH risk, and a STRETCHED valuation view at the current
              $10 billion mark. The call is intentionally price-sensitive. A buy case today would require stronger proof
              than the public record currently provides: audited or at least cleaner net-revenue disclosure, evidence
              that benchmarks and workflow products are lifting attachment and margin, and signs that post-breach trust
              remediation has stabilized key customers. At $10 billion against the September 2025 $450 million gross
              annualized run-rate, Mercor screens at about 22x gross revenue. Even if one uses Mercor's own 2026 claim
              of having crossed a $1 billion annualized run-rate, the mark is still about 10x gross revenue on a metric
              that remains unaudited and includes pass-through contractor spend. That is not obviously absurd for a
              company with software ambitions, but it is too rich for a business that still carries marketplace,
              compliance, and incident-response risk. The practical conclusion is to watch the story rather than chase
              it: a lower entry price around $6 billion to $7.5 billion, or hard proof that Mercor's benchmark and
              workflow layers are changing the business mix, would make the risk-reward more attractive.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV032
              - CV033
              - CV039
              - CV040
              - CV041
