  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Legal, and Litigation Risk
        blocks:
          - type: paragraph
            body: >-
              Mercors most significant regulatory exposure is worker misclassification. The company publicly disclosed
              more than 30,000 experts on its roster by October 2025, alongside 300,000 processed candidates earlier
              that year. Californias AB 5 imposes the ABC test for worker classification, and the California DIR and FTB
              have both published specific guidance on how the law applies to gig-economy platforms. The 2024 federal
              DOL independent contractor rule further tightens the economic-reality test at the federal level, and the
              IRS has published parallel guidance on the same question. A 2024 California Supreme Court decision on AB 5
              in a major trucking case signals continued judicial willingness to expand gig-worker protections beyond
              their original scope. If Mercors annotators were reclassified as employees in California, the company
              would face potential liability for back wages, benefits, payroll taxes, and penalties across a meaningful
              share of its expert network. No reserve amount or legal-exposure estimate has been disclosed. On the
              litigation front, Scale AI filed a trade-secrets lawsuit in September 2025 alleging that Mercor
              misappropriated proprietary customer data and pricing information. Court records later show the case was
              voluntarily dismissed with prejudice in January 2026, but Bloomberg, TechCrunch, and Axios coverage still
              highlight the underlying trade-secret and customer-acquisition controls risk. The EU AI Act, which entered
              into force in 2024, creates additional risk: AI systems used in employment and worker allocation decisions
              are classified as high-risk, potentially requiring conformity assessments before deployment in EU markets.
            claimRefs:
              - CR001
              - CR002
              - CR003
