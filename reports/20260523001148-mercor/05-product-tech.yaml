company:
  name: Mercor
chapter:
  number: 5
  title: Product & Technology
  summary: Mercor's product stack now extends well beyond AI recruiting. Public pages and engineering posts show a coordinated system that sources experts, runs AI interviews, builds benchmark and evaluation assets, experiments with enterprise-agent workflows, and manages the payments and compliance layers required to deliver human-feedback work at scale. The strongest public product signal is Mercor's APEX benchmark family and engineering depth; the weakest is the still-limited public evidence on integrations, certifications, and paid adoption of newer product layers.
sections:
- id: product-surface
  title: Product surface and customer workflow
  body: 'Mercor''s product is broader than the label “AI recruiting startup” suggests. The current public surface combines an expert marketplace, an AI interviewing and matching system, benchmark products, and an emerging enterprise workflow-design offering. Mercor''s research pages emphasize benchmarks, evaluation environments, and large-scale human datasets, while the experts page shows the operating substrate underneath: a globally distributed pool of professionals who can be interviewed, matched, managed, and paid for work that improves AI systems. The company''s Enterprise AI post pushes the product surface one step further, arguing that the bottleneck in enterprise agents is not only model intelligence but also the lack of evidence-backed workflow design. That framing turns Mercor from a staffing intermediary into a provider of workflow capture, expert judgment, and evaluation infrastructure. The customer buys a coordinated operating system for high-skill human feedback, benchmark
    reuse, and eventually recurring enterprise workflow systems rather than a single standalone feature.'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE009
  - CE016
  - CE020
  - CE021
  - CE044
  tableRefs:
  - TE001
  - TE002
  figureRefs:
  - FE002
- id: architecture-ops
  title: Architecture and operating model
  body: 'Mercor''s most revealing product evidence comes from its engineering posts rather than its homepage. The Monty interviewer write-up describes a live operational system that runs roughly 10,000 conversations a day, with each session isolated in its own Modal container and launched from a warm pool that keeps start times under 200 milliseconds. The Contracts-service rewrite shows a separate but equally important architecture truth: internal delivery systems matter as much as user-facing AI. Mercor publicly described rewriting a bottlenecked service in a week, improving capability by over 10,000x and reliability by more than 75x because prior contract volume and latency assumptions were breaking under growth. That makes the architecture more operational than purely model-centric. Mercor depends on internal orchestration, billing, payouts, and worker-management systems that tie software, human labor, and customer trust together. In practice, its product stack is a human-data operating
    system, not just a matching algorithm.'
  claimRefs:
  - CE005
  - CE006
  - CE022
  - CE023
  - CE024
  - CE025
  - CE026
  - CE031
  - CE032
  - CE044
