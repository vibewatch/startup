    - Mercor marketplace plus AI interviewer and matching
    - Faster expert onboarding and filtering at scale
    - Exact conversion rates are not public
  - - Train or evaluate frontier models
    - Collect preference data, benchmarks, and domain judgments
    - Mercor experts plus benchmark assets and eval environments
    - Higher-skill feedback than commodity labeling
    - Needs proof of recurring product attachment
  - - Benchmark agent performance
    - Assemble bespoke test tasks and rubrics internally
    - APEX, APEX-Agents, and APEX-SWE provide reusable evaluation assets
    - Improves comparability across models and tasks
    - Public benchmarks do not equal paid customer adoption
  - - Operationalize enterprise agents
    - Guess workflows, prompts, and tool calls by hand
    - Mercor Enterprise AI proposes workflow discovery and codification
    - Can reduce use-case guesswork
    - Public documentation remains high-level
  - - Run global contractor programs
    - Invoice customers, track hours, and pay workers across jurisdictions
    - Contracts, payments docs, and time tracking tools support delivery
    - Enables labor coordination at large scale
    - Public SLA, error-rate, and audit data remain sparse
  - - Protect customer trust
    - Vet workers and constrain unsafe model-evaluation behavior
    - Background checks, LLM rules, and data-use policies formalize controls
    - Raises baseline trust posture for sensitive workflows
    - No public certification depth or full trust-center detail
  notes: Benefits are described from the fetched workflow evidence; unsupported performance claims remain explicitly constrained as diligence gaps.
