- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Profile and interview ingestion
    - Transforms resumes, interviews, and public profiles into searchable candidate signals
    - Mercor data pipelines and AI parsing
    - Data quality and privacy sensitivity
  - - AI interviewing runtime
    - Runs live interview sessions for candidates
    - Modal containers, warm pools, and room setup state
    - Cold starts, session reliability, and infrastructure dependency
  - - Matching and contract orchestration
    - Routes talent to listings and manages offers or contract state
    - Core internal services including Contracts
    - Scaling bugs can block delivery and payouts
  - - Benchmark and eval asset pipeline
    - Builds APEX datasets, leaderboards, rubrics, and evaluation environments
    - Mercor research team plus expert contributors
    - Benchmark contamination, low external adoption, or expensive refresh cycles
  - - Enterprise agent workflow layer
    - Maps real work into agent tasks, prompts, tool calls, and eval loops
    - Mercor Enterprise AI and customer workflow discovery
    - Public docs do not yet show deep integration or API evidence
  - - Operations and payout layer
    - Tracks time, invoices clients, and pays contractors globally
    - Stripe, Wise, Insightful/Workpuls, finance controls
    - Payment failures, fraud, and jurisdictional compliance
  - - Trust and policy controls
    - Background checks, LLM-use rules, and data governance constrain behavior
    - Mercor docs and internal review processes
    - Sparse public evidence on certifications or enforcement maturity
  notes: Because Mercor sells outcome-oriented expert workflows, architecture includes both software systems and human-operations control layers.
