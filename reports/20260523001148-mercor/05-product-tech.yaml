- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Expert marketplace
    - AI labs and enterprises needing domain specialists
    - Core / live
    - Large roster of professionals across high-skill domains
    - Need active expert counts by domain and repeat utilization
  - - AI interviewer (Monty)
    - Candidates and internal ops teams
    - Scaled / live
    - Automated interviews at large volume with role-specific context
    - Need objective interview-quality and false-negative metrics
  - - Matching and offer engine
    - Mercor ops and hiring teams
    - Core / live
    - Pairs profiles, interviews, assessments, and availability to roles
    - Need precision or conversion metrics by segment
  - - APEX benchmark family
    - AI labs and model-eval teams
    - Live / expanding
    - Economically realistic benchmarks across professional, consumer, and SWE work
    - Need attach rate from benchmark visibility to paid workflow
  - - Enterprise AI / agent design
    - Enterprise transformation teams
    - Emerging / early commercial
    - Moves beyond labor supply toward workflow codification and agent deployment
    - Need named customer deployments and repeat usage metrics
  - - Contracts / payouts infrastructure
    - Mercor finance and operations
    - Critical internal platform
    - Complex billing and global contractor payout management are core to delivery
    - Need failure-rate, recovery-time, and controls evidence
  - - Trust and compliance layer
    - Customers, contractors, Mercor risk teams
    - Operational but not fully disclosed
    - Background checks, LLM-use rules, time tracking, and data policies are explicit
    - Need public certifications, trust-center depth, and incident metrics
  notes: This matrix treats internal delivery systems as product-critical because Mercor sells coordinated expert workflows, not just a static software seat.
