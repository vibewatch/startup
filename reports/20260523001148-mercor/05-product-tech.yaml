- id: trust-risk
  title: Trust, controls, and technical risk
  body: Mercor has more public process documentation than many young AI startups, but the trust picture is still mixed. The docs index exposes a wide set of contractor-facing guides covering data use, LLM restrictions, payments, time tracking, and background checks. Those policies matter because Mercor is intermediating sensitive workflows and, according to TechCrunch, handling datasets and procedures that customers treat as trade secrets. The same docs also reveal how much of the product experience depends on disciplined operations rather than model magic. Workers are background-checked, tracked, and restricted in how they can use outside LLMs. Yet the April 2026 breach demonstrates that documentation is not the same thing as mature trust posture. TechCrunch reported claimed theft of source code, API keys, candidate data, and employer data, exactly the type of material that could damage both customer confidence and product credibility. Until Mercor provides deeper public certification and
    incident-response evidence, trust remains the company's most immediate technical risk.
  claimRefs:
