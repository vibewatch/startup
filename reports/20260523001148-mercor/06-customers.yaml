- id: S3
  title: Named Customer Proof and Evidence Quality
  body: The quality of customer proof for Mercor is limited by the confidential nature of AI lab vendor relationships. No frontier AI lab has publicly confirmed Mercor as a vendor. The evidence base rests on journalist characterizations, company blog posts, and the implicit signal from the Scale AI litigation — which, by alleging trade secret misappropriation of customer relationships, implies that Mercor was actively competing for or winning AI-lab business that Scale AI considered its own. TechCrunch described AI labs using Mercor to build training datasets in a detailed October 2025 piece; Mercors own Disrupt 2024 blog post showed live AI evaluation workflows that presuppose real customer deployments. The Forbes AI Cloud 100 inclusion provides third-party analyst validation that investors and industry observers view Mercors customer base as credible. The named customer proof table in this chapter catalogues all publicly attributable customer references; the result is a sparse but directionally
    consistent picture. For diligence purposes, the absence of named references is a material gap. Any investment decision should require production of customer reference letters or LOIs from at least the top three revenue-contributing customers.
  claimRefs:
  - CU003
  - CU004
  - CU008
  - CU011
  - CU012
  - CU014
