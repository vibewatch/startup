  - TU003
  figureRefs:
  - FU003
- id: S4
  title: Retention, Expansion, and Concentration Risk
  body: 'Mercors retention and expansion economics are almost entirely opaque. No net revenue retention, gross revenue retention, churn rate, or cohort data has been publicly disclosed. The company has not published customer satisfaction scores, renewal rates, or multi-year contract details. The only indirect evidence of retention comes from the revenue growth narrative: a 30x revenue increase over a single year implies that either existing customers expanded dramatically, new customers were acquired at pace, or both. Concentration risk is a primary structural concern. The revenue appears overwhelmingly sourced from a small number of frontier AI lab relationships; if even one or two of those customers reduce spend — as OpenAI and Google did with Scale AI — the impact on Mercors revenue could be severe. The Scale AI lawsuit adds an additional dimension: allegations that Mercor poached customer relationships raise the possibility of contested contract terms or customer-level legal risk. On
    the worker supply side, Rest of World has reported quality and retention challenges among AI data annotators broadly, and Mercors structured onboarding and milestone-based access systems suggest the company is aware of these dynamics. The talent.docs.mercor.com documentation indicates Mercor uses contractual mechanisms to manage worker access, which may serve as a retention tool for quality workers.'
