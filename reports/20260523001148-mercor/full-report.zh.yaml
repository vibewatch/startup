      - number: '4.2'
        title: 单位经济与运营杠杆
        blocks:
          - type: paragraph
            body: >-
              Mercor 的增长弧线异常陡峭。公开来源显示，公司从 February 2025 的 $75 million 收入运行率和已报道盈利，走到 September 2025 约 $450 million
              年化收入，再到 Mercor 自己声称在 2026 早些时候已跨过 $1 billion 年化收入。 KTVU 另引述 Brendan Foody 称，公司到 March 2025 已跨过 $100
              million 收入运行率，并且极其盈利。 这些数据点拼出一个可信的运营杠杆故事，尤其 TechCrunch 还报道公司在 2025 上半年实现 $6 million 利润。
              但同一组证据也指向一个重度转付的劳动力基础，而不是纯软件式利润率结构。 每日承包商付款从 late 2025 超过 $1.5 million，上升到 Mercor 2026 帖子中的超过 $2
              million；内部帖子还把支付、合同系统和控制升级描述为关键扩张工作。 结果是，收入端证明令人鼓舞，但公开毛利率、抽佣率或现金转化细节仍不足，无法把动能转成可完整承销的模型。
