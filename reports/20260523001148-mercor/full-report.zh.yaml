  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局结构与直接同业
        blocks:
          - type: paragraph
            body: >-
              Mercor 身处一个拥挤但仍在快速洗牌的人类数据市场。直接同业包括 Scale AI、Surge
              AI、Labelbox、Appen、iMerit、CloudFactory、Invisible、Toloka，以及 Snorkel 等越来越多的自动化导向替代品。
              这些供应商并不都以同一种方式解决同一个问题。Scale 和 Appen 从规模与广泛服务宽度切入市场。 Labelbox 从工作流软件加专家网络切入。Mercor
              则从高端专家市场切入，并试图爬升到基准和评估软件。 这个差异很重要，因为买方不是在一组完全相同的供应商之间选择。 他们选择的是中立性、专家深度、工作流控制、企业治理和交付速度的组合。 因此，Mercor
              不必在每个维度击败每个竞争对手，但它必须在高价值人类判断最重要、买方最不愿接受泛化众包的地方守住清晰优势。
