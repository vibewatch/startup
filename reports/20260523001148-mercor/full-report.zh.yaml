  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              Mercor 值得估值关注，因为公司已经凑齐了市场明确想要的三样东西：极快增长、接触前沿 AI 客户的入口，以及从纯招聘走向基准、评估和工作流工具的可信路径。 官方融资历史显示，Mercor 从 $250
              million Series A 估值，跃升到 February 2025 的 $2 billion，再到 October 2025 的 $10 billion。 独立报道为这个叙事补上真实运营证明，包括到
              February 2025 的 $75 million 收入运行率、到 September 2025 约 $450 million 年化收入，以及 OpenAI、Anthropic、Meta 等客户名称。
              Mercor 的研究、APEX、Enterprise AI、评估和 RL Studio 页面提供的产品证据很重要，因为它们说明公司试图建设可重复的工作流和基准资产，而不是只做劳动力经纪。 反向逻辑是，Mercor
              的定价已经像这场向上游迁移已经成功一样。公开来源称收入按承包商付款前总额口径报告，客户集中度仍高，泄露后续打断了客户信任，诉讼和劳动复杂性仍会增加运营摩擦。 简言之，Mercor
              看起来具备战略重要性，但当前估值标记给执行失误留下的空间很小。
