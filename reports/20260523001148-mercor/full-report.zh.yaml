      - number: '8.5'
        title: 估值风险与投资逻辑失效触发点
        blocks:
          - type: paragraph
            body: >-
              下行主要由四个风险主导。第一是集中度：公开报道反复显示，收入基础只锚在少数 AI 实验室上，因此一段关系暂停或流失，对估值的冲击会远大于多元化软件公司。第二是信任和安全：Mercor 的 2026
              年数据泄露及后续诉讼之所以重要，不只是直接成本，而是它挑战了 Mercor 处理敏感企业流程和模型开发工作流所需的可信度。第三是法律和劳工风险。Mercor
              自己的文档显示，它运营着一台全球分布的承包商机器，包含按司法辖区而异的付款限制、工时追踪监督，以及争议人工复核；这套运营复杂性是护城河的一部分，也同样压在风险堆栈里。第四是叙事风险。如果
              APEX、Enterprise AI、RL Studio 和评估产品不能转化为软件式绑定，投资人最终可能把 Mercor
              归类为高端劳动力与服务市场。即使营收增长仍然不错，倍数也会被压缩。第二次重大安全事件、泄露后明确的客户流失，或法律 / 承包商成本挤压利润率的证据，都会迅速击穿当前投资逻辑。
