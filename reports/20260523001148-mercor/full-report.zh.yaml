        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              表面看，Mercor 并不缺资本。公司披露从种子轮、Series A、Series B 到 Series C 共约 $483.6 million 新股融资，并在 October 2025 以 $10
              billion 估值完成 $350 million Series C。 管理层还给出异常具体的资金用途：扩大人才网络、改善匹配、加快交付。
              对一家既要防守市场流动性、又要建设更产品化评估能力的公司来说，这些优先级合理。 问题在于，已披露融资历史不等于已披露流动性。Mercor
              在本章审阅的来源中没有公布手头现金、月度烧钱速度、现金跑道月数或任何债务安排。 这个缺口很重要，因为公司如今对客户集中、法律和泄露补救成本，以及高速增长要求的内控投资，都有真实下行情景敏感性。
              因此，融资时间线是公司能拿到资本的强证据，但仍不足以断定压力情景下现金跑道安全。
