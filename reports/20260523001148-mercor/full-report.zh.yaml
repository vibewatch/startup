      - number: '3.3'
        title: 切换成本、多栖与分发
        blocks:
          - type: paragraph
            body: >-
              这个品类看起来在结构上就是多栖的。专家很可能同时在多个市场工作，买方也可以测试多家供应商，因为大多数供给仍按项目或定制方案销售，而不是深度嵌入的记录系统软件。
              这削弱了纯市场护城河。同时，市场又会受到阶段性分发冲击塑形。 Meta 投资 Scale AI 引发中立性担忧、CNBC 报道 OpenAI 正在收尾与 Scale 的合作时，Mercor 显然从中受益。 但如果
              Mercor 不能把这次需求冲击转化成重复工作流或更硬的产品锁定，这些收益可能只是暂时的。 Appen 展示了相反模式：它是上市老牌厂商，具备治理宽度和更长的企业记录。 Mercor
              的挑战，是一边保持速度和中立性的叙事，一边建立足够多的工作流所有权，让买方不会在市场条件变化时简单轮换到下一个可接受供应商。
