  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与收入质量
        blocks:
          - type: paragraph
            body: >-
              Mercor 的公开财务故事很亮眼，但结构上很容易被误读。 这不是一个有干净席位订阅收入的经典 SaaS 模型。公开报道和 Mercor 自有文档描述的是市场加服务模式：客户付钱给 Mercor，让它为 AI
              模型训练、评估和相关工作流设计寻找、筛选并协调领域专家；Mercor 再通过自己的付款栈向这些专家付款。 这个差异很重要，因为 Mercor 增长最快的表观数字似乎包含承包商付款前的客户总账单额。
              TechCrunch 明确报道，Mercor 统计的是专家拿到自己份额之前客户支付的总额。 这种会计选择在该品类中也许常见，但意味着投资者必须先拆分吞吐量与净经济性，才可以把表观收入运行率当作软件收入处理。
              公开的劳动者侧定价信号和已报道小时费率机制显示公司具备真实货币化能力，但确切抽佣率和实际折扣仍未披露。
