      - number: '4.4'
        title: 负面信号与承销阻碍
        blocks:
          - type: paragraph
            body: >-
              Mercor 财务章节最大的未解问题，不是公司能不能融资，而是投资者能不能把公开增长叙事转化成可信的收入质量判断。 TechCrunch 称，一小部分大品牌贡献了过大的收入份额；Scale AI
              诉讼则描述了价值数百万美元的单一客户机会。 这种组合意味着大客户上行空间，也意味着集中度暴露。April 2026 泄露事件又增加一层财务风险，因为 TechCrunch 报道 Meta
              暂停合同，其他模型厂商正在审查关系，同时五名承包商就所谓数据暴露提起诉讼。 品类波动性也真实存在：CNBC 报道，Scale AI 在 Meta 交易后试图赢回客户时裁员 14%。 Appen
              这类上市老牌厂商的披露展示了 Mercor 尚未提供的东西：定期业绩、更清晰的服务分部，以及更透明的报告。 在 Mercor
              披露现金、烧钱速度、抽佣率、利润率和集中度指标之前，承销应把公司视为财务表现异常突出、但仍部分不透明。
