  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品形态与客户工作流
        blocks:
          - type: paragraph
            body: >-
              Mercor 的产品比「AI 招聘初创公司」这个标签更宽。 当前公开产品形态结合了专家市场、AI 面试与匹配系统、基准产品，以及新兴的企业工作流设计供给。 Mercor
              的研究页面强调基准、评估环境和大规模人类数据集；专家页则展示底层运营基座：一个全球分布的专业人士池，可以被面试、匹配、管理并为改善 AI 系统的工作获得报酬。 公司的 Enterprise AI
              帖子把产品边界又往前推了一步，主张企业智能体的瓶颈不只是模型智能，也包括缺少有证据支撑的工作流设计。 这种叙事把 Mercor 从人力中介转成工作流捕捉、专家判断和评估基础设施提供商。
              客户买到的不是单一独立功能，而是一套协调高技能人类反馈、基准复用，并最终支持经常性企业工作流系统的操作系统。
