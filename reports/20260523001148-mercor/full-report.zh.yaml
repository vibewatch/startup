  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份定位与商业模式
        blocks:
          - type: paragraph
            body: >-
              Mercor 现在展示给市场的，不再像一家泛招聘初创公司，而更像为前沿 AI 系统供给专家的市场。 官网将公司定位为给 AI 经济组织人类智能的平台；专家页则揭示运营实况：Mercor
              招募医生、律师、工程师、金融专业人士等专家，让他们以远程合同工形式推进 AI 系统。 产品承诺是速度和匹配度。Mercor 借助 AI 面试、匹配和工作流自动化判断谁适合哪个项目，再通过市场管理付款。
              这个定位很关键，因为它同时解释了估值重估和投资者面对的风险画像。Mercor 不再只和招聘软件或人力派遣机构竞争。 它如今进入增长更快、争议也更大的后训练、评估和人在回路 AI
              数据市场；这里客户预算大、切换成本低，数据权利问题也更尖锐。
