  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与待完成任务
        blocks:
          - type: paragraph
            body: >-
              Mercor 被描述成「HR 科技」或「数据标注」时最容易被误读。这两个标签都不完整。 公司当前市场位于高端劳动力市场、AI 后训练服务和评估基础设施的交汇处。 公司公开页面和 TechCrunch
              报道显示，Mercor 向前沿 AI 实验室提供领域专家——医生、律师、工程师、银行家、顾问——处理排名、评估、表单、报告和基准任务等高度依赖判断的工作。 这意味着 Mercor
              不再销售与申请人追踪系统、传统人力派遣公司或商品化众包市场相同的产品。 它的核心待完成任务，是足够快地把稀缺专家知识送进前沿模型改进回路，让实验室和企业愿意为此付费。
              这个更窄的定义很重要：它大幅压低了相较自上而下 AI 支出标题的真实可服务市场，也更清楚地指出哪些竞争对手和风险真正重要。
