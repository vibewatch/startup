  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 净收入和抽成率
        - 总账单额、承包商付款、Mercor 抽成率，以及任何经常性软件收入拆分
        - 这是市场平台估值与软件估值之间最关键的一座桥
        - 财务数据室和财务主管审阅
      - - Top-10 客户结构和留存
        - 收入集中度、续约节奏、泄露后暂停账户，以及按产品线拆分的扩张
        - 集中度是当前模型里的核心下行变量
        - CFO 数据室加客户访谈
      - - 泄露后信任修复
        - LiteLLM 事件后，控制改进、影响范围和客户安抚的独立证据
        - 没有信任修复，基准测试和企业增购更难承销
        - 安全尽调、事件报告和客户核查
      - - 承包商和法律敞口
        - 分司法辖区的承包商结构、政策执行数据、争议，以及任何准备金或外部律师备忘录
        - Mercor 的护城河部分靠劳动力编排；这也会带来合规成本
        - 劳动和隐私律师参与法律尽调
      - - 股权结构表和优先权
        - 优先股堆叠、参与权，以及 $10B 估值下任何老股条款
        - 如果条款异常干净，偏高估值仍可能可投；反过来也一样
        - 公司律师审阅和融资文件分析
    notes: 这些问题按对估值信心的直接影响排序。在当前价格下，没有一项是“之后再补”的锦上添花。
    claimRefs:
      - CV031
      - CV039
      - CV040
      - CV041
      - CV042
