      - number: '5.4'
        title: 信任、控制与技术风险
        blocks:
          - type: paragraph
            body: >-
              Mercor 比许多年轻 AI 初创公司拥有更多公开流程文档，但信任画像仍然复杂。 文档索引暴露了一大组面向承包商的指南，覆盖数据使用、LLM 限制、付款、工时追踪和背景调查。 这些政策很重要，因为 Mercor
              正在中介敏感工作流，并且据 TechCrunch 报道，处理客户视为商业秘密的数据集和流程。 同一批文档也揭示，产品体验多大程度取决于纪律化运营，而不是模型魔法。 工人要接受背景调查、被追踪，并在外部 LLM
              使用上受到限制。 但 April 2026 泄露事件说明，文档不等于成熟信任姿态。TechCrunch 报道称，被盗材料包括源代码、API 密钥、候选人数据和雇主数据，正是会损害客户信心和产品可信度的类型。 在
              Mercor 提供更深的公开认证和事件响应证据之前，信任仍是公司最直接的技术风险。
