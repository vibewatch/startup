      - number: '7.4'
        title: 缓释、终止标准与尽调要求
        blocks:
          - type: paragraph
            body: >-
              Mercor 公开可观察的缓释措施是部分性的，而且大多没有文档支撑。 trust.mercor.com 的 Trust Center 提供了基础安全姿态信号。人才门户合同和法律支持文档显示，Mercor
              为工人关系搭建了法律框架。 公司在 March 2026 公开披露泄露事件，说明具备可运转的事件响应能力。 但是，公司没有发布 SOC 2 报告、保险披露、容量 SLA、质量审计结果或监管准备金金额。
              从投资监控角度看，终止标准应包括：AB 5 不利裁决或 DOL 执法行动；法院作出不利认定，或出现新的商业秘密争议，显示公司不当使用竞争对手客户材料；12
              个月内发生第二次重大安全泄露；或确认因单一客户流失而失去超过 50% 收入。 需要监控的早期预警信号包括 CourtListener 上泄露案件案卷更新、任何新的竞争对手诉讼、DOL 和 NLRB
              执法追踪器、Mercor Trust Center 更新，以及公司提供的月度 ARR 桥接数据。 最关键的尽调要求仍是：量化 AB 5 暴露的法律备忘录、SOC 2 Type II
              报告或等同材料、前十大客户收入拆分，以及网络和 E&O 风险保险覆盖确认。
