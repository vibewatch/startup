        - 会削弱支撑基准测试、工作流和企业扩张的信任逻辑
        - 在控制措施获得外部验证前，视为投资逻辑破裂
      - - 劳工 / 承包商成本冲击
        - 有证据显示承包商、隐私或分类成本实质改变单位经济模型
        - 会把 Mercor 推向更接近服务的经济模型，同时降低增长信心
        - 重估至上市劳动力平台倍数
      - - 软件附加未显现
        - 又一轮融资或增长台阶之后，仍无可信基准 / 工作流收入证据
        - 如果没有上移产品栈转化，$10B 估值更多靠规模和叙事，而非产品经济模型
        - 即使收入规模仍大，也维持观察立场
      - - 下一个定价事件披露仍不透明
        - 到下一轮融资或老股窗口时，仍没有净收入桥接、集中度披露或清晰的泄露后控制措施
        - 投资人仍需要凭信念承销过多不确定性
        - 放弃该轮，或要求更大折扣
    notes: 否决触发因素用于投资人判断 Mercor 是否配得上软件式溢价，还是应更接近服务和市场平台可比公司的估值。
