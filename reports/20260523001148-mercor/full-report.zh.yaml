      - number: '8.3'
        title: 融资背景与可比估值
        blocks:
          - type: paragraph
            body: >-
              Mercor 如今尴尬地夹在两组可比公司之间。一边是 Appen、Upwork、Fiverr 等劳动力市场和数据服务平台，公开市场数据显示这些公司大约按 1x 收入交易。
              这类业务被市场当作交易或服务引擎估值，软件稀缺性有限。另一边是 Palantir；它的交易倍数高得多，因为投资者把它视为软件控制平面，具备持久产品锁定、强毛利率和深度关键任务嵌入。 Mercor
              当前估值标记显然假设它更接近第二组，而不是第一组，但公开证据还没到位。 支撑溢价的是前沿 AI 客户入口、极端增长，以及围绕 APEX、Enterprise AI、评估和 RL Studio 的可见产品努力。
              限制溢价的是缺少公开净收入、抽佣率、利润率或留存数据，加上表观收入数字按承包商付款前总额口径列示。 因此，估值争论不是 Mercor
              是不是一家好公司，而是投资者是否应在会计和客户组合证据追上之前，就承销一个软件式未来。
            claimRefs:
              - CV008
