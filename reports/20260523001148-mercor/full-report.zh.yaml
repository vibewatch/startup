      - number: '8.4'
        title: Bull / Base / Bear 情景与回报分析
        blocks:
          - type: paragraph
            body: >-
              乐观情景不只是量更大。Mercor 还要把基准测试和工作流资产转成更黏的软件式支出，并把客户面从少数前沿实验室拓宽。按这条叙事，APEX 和 Enterprise AI 会成为真实预算项，RL Studio
              和评估产品改善匹配和交付经济性，数据泄露事件在没有第二次事故后淡出，客户集中度也降到足以让客户把 Mercor 看成基础设施，而不是顺手采购的供应商。长期看，这能支撑 $12 billion 到 $18
              billion 的结果。基准情景更混合：收入继续增长，Mercor 修复信任，产品资产帮助销售，但客户集中度仍然明显，从总额到净额的质量依旧不透明。那种情况下，估值大概率落在 $7 billion 到 $10
              billion 区间，也就是说当前标记已经计入大部分上行。悲观情景则明确叠加已知风险：大客户暂停或流失、数据泄露或集体诉讼后果拖长、劳动力或承包商合规成本上升，或者基准测试和软件层无法在观点输出之外变现。届时
              Mercor 会更接近服务和劳动力平台估值，落到低得多的 $2.5 billion 到 $5 billion 区间。
