      - number: '3.4'
        title: 护城河耐久性与竞争风险
        blocks:
          - type: paragraph
            body: >-
              Mercor 最强的竞争论点，是它能快速找到高端专家，并比更慢或更偏软件的竞争对手更快把他们转化成有经济价值的后训练工作流。 但单靠这一点还不是持久护城河。Labelbox 和 Snorkel
              等软件优先厂商正在争夺通常产生锁定效应的工作流层。 Appen 和 iMerit 等托管服务老牌厂商可以销售治理、宽度和已建立的买方关系。 与此同时，如果专家多栖，或匹配变得更容易自动化，市场型优势往往会被侵蚀。
              因此，Mercor 进军基准和评估环境具有战略重要性：这是在劳动力市场之上创造产品级粘性的尝试。
              投资者应把公司视为在部分紧迫买方场景中拥有当下竞争优势，但它仍在市场成熟、当下中立性顺风消退之前，争取建立更持久的胜出权。
              在经常性产品绑定得到证明之前，公司应被视为强劲但仍处于过渡期的竞争者，而不是已经设防的品类赢家。
