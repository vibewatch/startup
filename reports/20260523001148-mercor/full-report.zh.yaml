        title: 伙伴、依赖与人员风险
        blocks:
          - type: paragraph
            body: >-
              客户集中是 Mercor 的结构性风险。多名记者的证据指向一个由前沿 AI 实验室关系主导的收入基础。 直接先例很刺眼：Scale AI 在短时间内失去 OpenAI 和 Google 客户，导致裁员
              14%。Reuters 确认 OpenAI 在 June 2025 收尾与 Scale AI 的合作。 如果 Mercor 前一或前二大客户以类似速度减少合作，在没有快速替代的情况下，收入冲击可能是灾难性的。
              Mercor 已尝试通过 Enterprise AI 和 Research 细分多元化，但没有披露这些细分的收入贡献。 人员侧，创始团队由年轻工程师组成；KTVU 和 Times of India
              的媒体报道强调了他们的技术能力，但公开披露中也缺少经验丰富的运营高管。 Rest of World 和 Time magazine 都记录过与 Mercor 类似平台上的 AI
              标注员工资和劳动权利担忧；这些担忧直接适用于 Mercor 的全球专家网络，公司称该网络到 October 2025 已超过 30,000 人。 人才门户文档显示，Mercor
              已建立争议解决路径和合同框架，说明公司意识到这一暴露，但没有披露独立劳动审计。
