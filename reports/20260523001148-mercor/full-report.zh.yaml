      - number: '1.3'
        title: 融资、规模与运营版图
        blocks:
          - type: paragraph
            body: >-
              即便按 2025 AI 标准看，Mercor 的融资曲线也异常陡峭。 公司从 2023 的 $3.6 million 种子轮，走到 2024 估值 $250 million 的 Series A，再到
              February 2025 的 $2 billion Series B 和 October 2025 的 $10 billion Series C。 由此形成的已披露新股融资约 $483.6
              million。公开报道的业务牵引力也跟着资本一起上升。 CNBC 报道称，到 February 2025 公司已处理 300,000 名候选人、完成超过 100,000 场面试；TechCrunch
              则在大致同一时间报道，Mercor 已评估 468,000 名申请人，年经常性收入（ARR）运行率为 $75 million。 到 September 2025，TechCrunch 称 Mercor 接近
              $450 million 收入运行率，并在上半年实现 $6 million 利润。 本次获取的招聘数据还显示，公司一边声称已盈利，一边在工程、运营、财务和企业岗位上激进招聘，并把办公室扩展到 San
              Francisco、New York 和 London。
