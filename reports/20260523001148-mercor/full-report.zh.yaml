      - number: '6.2'
        title: 采用轨迹与收入增长
        blocks:
          - type: paragraph
            body: >-
              Mercor 的收入增长轨迹是 AI 工具领域最醒目的案例之一。公司在 2025 从大约每月 $2 million 收入，增长到每日 $2 million——约 30 倍。
              多个独立来源印证了这一增长：TechCrunch 报道 September 2025 年化收入运行率为 $450 million，Forbes 在 AI Cloud 100
              报道中确认了这一数字，Bloomberg 在 April 2026 人物报道中提供了更多背景。 融资轨迹讲述了平行故事：February 2024 的 $34 million Series A、February
              2025 以 $2 billion 估值完成的 $100 million Series B，以及 October 2025 以 $10 billion 估值完成的又一轮 $350 million Series
              C——约 20 个月估值增长 40x。 这种增长模式符合一家抓住 AI 实验室扩张模型训练运营需求的公司。CNBC 关于 Scale AI 失去 OpenAI 和 Google 客户的报道说明，Mercor
              的部分增长可能来自客户从 Scale AI 关系迁移出来，或在原关系之外补充 Mercor。 从注册工人到活跃项目部署的采用漏斗没有公开细节，但 talent.docs.mercor.com
              的文档显示，公司有结构化入职和项目里程碑系统，可支持新客户部署快速扩张。
