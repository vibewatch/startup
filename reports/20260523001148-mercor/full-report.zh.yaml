      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              最强的需求驱动来自技术。OpenAI 的 InstructGPT 和 Anthropic 的 Constitutional AI 都表明，即便部分反馈回路已经自动化，对齐和模型质量提升仍然高度依赖反馈。
              Mercor、Labelbox、Appen、iMerit 和 CloudFactory 如今都在营销以专家为中心的 RLHF、评估和对齐服务，说明市场已经从低技能标注转向更高判断力的工作。 Mercor
              还受益于一次性行业事件：Meta 投资 Scale AI 引发中立性担忧，推动一些实验室寻找替代方案。 但同一市场也存在重要摩擦。劳动权利审视、商业秘密敏感性和低切换成本，让买方保持谨慎，也让定价更有竞争性。
              Snorkel 等自动化导向替代品也可能吃掉人类数据支出的低价值层。 结果是，这个市场增长快、紧迫性真实，但并不是只靠自上而下 TAM 就能保证持久支出或轻松续约经济。
              实际操作中，买方仍需要信任、安全和可衡量的模型收益，才会大规模铺开。
