      - number: '3.2'
        title: 能力宽度与产品包装
        blocks:
          - type: paragraph
            body: >-
              这个品类的能力重叠正在加深。Mercor、Scale、Labelbox 和 Appen 现在都在营销 RLHF、评估、对齐或基准式服务的某种组合。 这种收敛削弱了简单基于功能的差异化，并把竞争推向执行力。
              Mercor 仍然突出，因为它明确营销领域专家劳动力和高技能类别；软件中心化的竞争对手则强调工作流工具、数据运营和工厂式控制。
              产品包装也强化了这个分野。直接同业普遍缺少公开标价，意味着买方通常会谈定制化企业合同，并按速度、信任、中立性和质量评估供应商，而不是看表面价目表。
              实际上，竞争焦点不是谁的网站公布了价格，而是谁的专家供给、产品控制和治理组合最适合某个具体项目。
              这往往有利于窄用例里的专业厂商，以及大规模企业铺开中的更宽老牌厂商，尤其当采购团队需要客户背书、安全控制和已验证的集成深度时。
