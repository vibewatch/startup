      - number: '8.6'
        title: 退出准备度与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              以这个价格看，Mercor 还不是可以立即拍板的尽调案例。公司最终可能拿到更高倍数，但这个结果取决于公开记录尚未回答的事实。第一项阻断问题是收入质量桥接：把总账单、承包商支出、Mercor
              抽成率、净收入，以及任何经常性软件式收入拆开。第二是头部客户视图：投资人需要知道收入基础有多集中、数据泄露影响了多少收入、较新的产品是否在拓宽账户组合。第三，Mercor
              要用公开市场或后期私募投资人能纳入承销判断的方式证明信任修复，理想状态是拿出泄露后的控制改进和独立保证，而不只是叙事。第四，承包商和法律堆栈需要更清晰量化，因为一家跨多司法辖区、又严密监控工时的公司，可能比典型软件供应商更容易卷入劳工、隐私或分类争议。在这些问题回答前，最佳姿态是把
              Mercor 留在观察名单，而不是支付一个已经预设乐观答案的价格。
