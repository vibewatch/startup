              Newswire、KTVU 和 Forbes 都把这些创始人与 Bay Area 辩论网络、Harvard 和 Georgetown 辍学经历、Thiel Fellowship 联系起来。 创始人故事仍是
              Mercor 品牌核心：一群极年轻的操盘者不到三年就从宿舍招聘软件转向 AI 实验室基础设施。 这个神话有利于融资，但也引出典型的关键人物和成熟度问题。Mercor 已开始在外围补强专业管理，引入前 Uber
              高管 Sundeep Jain 担任首任总裁，并从 OpenAI 和 Scale 招揽资深人才。 不过，公司仍高度由创始人定义；除 Benchmark 和主要投资者选择性披露的董事会参与外，治理能见度有限。
