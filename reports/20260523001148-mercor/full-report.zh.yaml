      - number: '6.3'
        title: 具名客户证明与证据质量
        blocks:
          - type: paragraph
            body: >-
              Mercor 的客户证明质量受 AI 实验室供应商关系保密性质限制。没有前沿 AI 实验室公开确认 Mercor 是供应商。 证据基础来自记者描述、公司博客帖子，以及 Scale AI
              诉讼给出的隐含信号——该诉讼指控 Mercor 侵占客户关系商业秘密，意味着 Mercor 正在积极竞争或赢得 Scale AI 认为属于自己的 AI 实验室业务。 TechCrunch 在 October
              2025 的详细文章中描述 AI 实验室使用 Mercor 构建训练数据集；Mercor 自己的 Disrupt 2024 博客帖子展示了实时 AI 评估工作流，这些工作流预设了真实客户部署。 Forbes AI
              Cloud 100 入选则提供第三方分析师验证，说明投资者和行业观察者认为 Mercor 的客户基础可信。 本章的具名客户证明表梳理了所有可公开归因的客户引用；结果是稀疏但方向一致的图景。
              从尽调角度看，缺少具名背书是重大缺口。任何投资决定都应要求至少前三大收入贡献客户出具客户推荐信或 LOI。
