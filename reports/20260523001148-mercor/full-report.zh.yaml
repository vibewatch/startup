            body: >-
              建议立场：观察，置信度中，风险高；按当前 $10 billion 标记看，估值偏高。
              这个判断刻意保持价格敏感。今天要形成买入逻辑，需要比公开记录更强的证明：经审计或至少更干净的净收入披露，基准和工作流产品正在提升绑定率和利润率的证据，以及泄露后信任补救已经稳定关键客户的迹象。 用当前 $10
              billion 对比 September 2025 的 $450 million 总额年化收入运行率，Mercor 看起来约为 22x 总额收入。 即便采用 Mercor 自称 2026 已跨过 $1
              billion 年化收入运行率，估值标记仍约为 10x 总额收入；而这个指标未经审计，且包含转付承包商支出。
              对一家有软件抱负的公司来说，这并非显然荒谬，但对于一家仍带有市场、合规和事件响应风险的业务而言，价格过高。 实际结论是观察而不是追高：若入场价格降到约 $6 billion 至 $7.5
