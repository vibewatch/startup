      - number: '6.4'
        title: 留存、扩张与集中度风险
        blocks:
          - type: paragraph
            body: >-
              Mercor 的留存和扩张经济性几乎完全不透明。公司没有公开披露净收入留存（NRR）、总收入留存（GRR）、流失率或队列数据。 公司也没有发布客户满意度评分、续约率或多年合同细节。
              唯一间接留存证据来自收入增长叙事：一年内收入增长 30x，意味着现有客户大幅扩张、新客户高速获取，或两者同时发生。 集中度风险是首要结构性担忧。收入似乎压倒性来自少数前沿 AI
              实验室关系；如果其中一两家客户减少支出——就像 OpenAI 和 Google 对 Scale AI 所做的那样——对 Mercor 收入的冲击可能很严重。 Scale AI 诉讼又增加了一个维度：关于
              Mercor 挖走客户关系的指控，提高了合同条款被争议或客户层面法律风险的可能性。 在工人供给侧，Rest of World 报道过 AI 数据标注员普遍面临的质量和留存挑战；Mercor
              的结构化入职和基于里程碑的访问系统说明公司意识到了这些动态。 talent.docs.mercor.com 文档显示，Mercor 使用合同机制管理工人访问权限，这可能成为留住优质工人的工具。
