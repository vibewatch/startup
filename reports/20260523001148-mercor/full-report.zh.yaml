      - number: '7.2'
        title: 运营、安全与质量风险
        blocks:
          - type: paragraph
            body: >-
              March 2026，Mercor 确认遭遇网络攻击，部分用户个人数据暴露。 TechCrunch 报道了这起泄露；几天内，一起联邦集体诉讼就在 California Northern District
              提起——Gill v. Mercorio Corporation——指控公司存在疏忽的数据安全实践。 Claim Depot 和 CourtListener 都确认该案仍在审理。TechCrunch
              在后续报道中指出，泄露与 Scale AI 诉讼同时发生，形成叠加声誉风险。 Mercor 在 trust.mercor.com 维护 Trust Center，但没有披露任何 SOC 2 Type II
              认证、ISO 27001 认证或 NIST CSF 符合性评估。 2024 NIST CSF 为处理敏感个人数据的组织建立最佳实践控制；Mercor 是否符合仍未知。 在运营质量侧，Mercor
              自己的博客文章描述平台在 10x 流量峰值下几乎失效，暴露出基础设施脆弱性；公司没有以任何公开描述的方式说明已补救。 Rest of World 记录了整个行业 AI
              标注工人面临的系统性质量挑战，说明供给侧质量风险并非 Mercor 独有，但考虑到输出质量是 Mercor 的核心价值主张，这一风险很重要。 目前没有公开错误率、SLA 违约率或质量审计结果。
