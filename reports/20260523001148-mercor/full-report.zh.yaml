      - number: '2.2'
        title: 机会规模测算
        blocks:
          - type: paragraph
            body: >-
              公开市场规模来源只能给出外边界。MarketsandMarkets 预计，到 2027 数据标注市场将达到 $3.6 billion，到 2029 AI 训练数据集市场将达到 $9.58
              billion，但这两个类别都远大于 Mercor 的高端专家利基。 Stanford HAI 的 2025 AI Index 经 IBM 摘要后显示了更宽的需求背景：2024 企业 AI 投资达到 $252.3
              billion，美国私人 AI 投资达到 $109.1 billion，新获融资的生成式 AI 初创公司数量接近三倍。
              这些数字支持「买方预算正在快速形成」这一判断，但没有揭示实验室具体在专家承包商、基准创建或带有丰富工作流的评估环境上花多少钱。 实际结论是：Mercor 的总可用市场（TAM）小于泛 AI
              投资或标注市场标题暗示的规模，但仍在更大的前沿模型支出和商业化浪潮中增长。 自上而下支出与自下而上可服务预算之间的错配，是这家公司最核心的尽调难题之一，也应让投资者对任何单张巨大 TAM 幻灯片保持怀疑。
