  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户细分与市场覆盖
        blocks:
          - type: paragraph
            body: >-
              Mercor 的客户基础锚定在前沿 AI 实验室——这些组织构建并打磨大语言模型和多模态 AI 系统，需要大规模人类反馈数据。 TechCrunch 在 October 2025 将 Mercor 描述为 AI
              实验室构建训练数据集的首选供应商，Bloomberg 在 April 2026 的详细人物报道中强化了这一描述。 公开规模信号在吞吐量上强于活跃劳动力规模：CNBC 称 Mercor 到 February
              2025 已处理 300,000 名候选人；Mercor 后来称，到 October 2025 名单中已有超过 30,000 名专家。 除前沿实验室外，Mercor
              还推出了两个面向客户的新细分：Enterprise AI 产品，面向寻求 AI 辅助招聘和劳动力管理的大型组织；Research 门户，面向寻找领域专家评估者的学术和政府 AI 项目。 Experts
              产品线代表市场内的高端层，让 AI 实验室可以接触到具备资质的领域专家，用于需要高级推理或主题知识的任务。 工人侧地理覆盖为全球，但公司没有披露按收入划分的客户地域构成。
              公开证据勾勒出的客户细分图景是：少数高价值 AI 实验室关系贡献绝大多数收入，企业和研究细分的多元化仍处早期。
