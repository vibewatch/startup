  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与诉讼风险
        blocks:
          - type: paragraph
            body: >-
              Mercor 最大的监管暴露是工人错误分类。公司公开披露，到 October 2025 名单中已有超过 30,000 名专家，同年早些时候还处理了 300,000 名候选人。 California 的 AB 5
              对工人分类施加 ABC 测试，California DIR 和 FTB 也都发布了该法律如何适用于零工经济平台的具体指引。 2024 federal DOL
              独立承包商规则进一步收紧了联邦层面的经济现实测试，IRS 也就同一问题发布了平行指引。 California Supreme Court 在 2024 一起重大卡车运输案中围绕 AB 5
              作出的裁决，显示司法机构仍愿意把零工工人保护扩展到最初范围之外。 如果 Mercor 的标注员在 California
              被重新分类为雇员，公司将面临欠薪、福利、工资税和罚金方面的潜在责任，影响其专家网络中相当大一部分人。 公司没有披露准备金金额或法律暴露估计。诉讼方面，Scale AI 在 September 2025
              提起商业秘密诉讼，指控 Mercor 侵占专有客户数据和定价信息。 法院记录后来显示，该案在 January 2026 被自愿且不可再诉地驳回，但 Bloomberg、TechCrunch 和 Axios
              的报道仍突出底层商业秘密和客户获取控制风险。 EU AI Act 已于 2024 生效，也带来额外风险：用于就业和工人分配决策的 AI 系统被归为高风险，部署到 EU 市场前可能需要进行合规评估。
