            body: >-
              Mercor 最能说明产品的证据来自工程帖子，而不是官网。 Monty 面试官文章描述了一个实时运营系统：每天运行约 10,000 场对话，每个会话隔离在自己的 Modal 容器里，并从暖池启动，把启动时间压到
              200 milliseconds 以下。 Contracts-service 重写展示了另一条同样重要的架构真相：内部交付系统和面向用户的 AI 一样重要。 Mercor
              公开描述称，公司在一周内重写一个瓶颈服务，将能力提升超过 10,000x、可靠性提升超过 75x，因为原先关于合同量和延迟的假设已经被增长打穿。 这让架构更像运营系统，而不是纯模型中心系统。 Mercor
              依赖内部编排、计费、付款和工人管理系统，把软件、人力劳动和客户信任绑在一起。 实际上，它的产品栈是人类数据操作系统，而不只是匹配算法。
