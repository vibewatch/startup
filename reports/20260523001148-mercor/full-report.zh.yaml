      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              Mercor 类服务的买方地图异常不对称。买方通常是研究运营负责人、模型评估负责人或企业 AI 产品负责人。 用户可能是后训练团队或基准测试团队。付款方来自模型开发预算或企业转型预算。
              供给侧专业人士既是劳动力投入，也是产品本身，因为公司货币化的是专家判断，而不只是软件席位。 这种结构解释了市场为什么能跑得很快：当模型质量瓶颈变得紧迫时，单个实验室可以迅速给出有意义的预算。
              它也解释了市场为什么可能同样快速反转。少数前沿实验室权重过大；既有雇主可能不愿分享让专家有价值的工作流；企业买方在扩大项目之前仍会强制进行安全、IP 和信任审查。 因此，Mercor
              受益于预算紧迫性，但在受监管领域仍会遇到采购拖累和拉长的价值验证周期。 这让客户背书质量和信任姿态成为异常重要的竞争武器。
