      - number: '1.4'
        title: 里程碑与负面事件
        blocks:
          - type: paragraph
            body: >-
              Mercor 的加速伴随着可见摩擦。积极一面是，Meta 投资 Scale AI 后，想要中立供应商的大模型实验室开始不安，AI 数据供应链发生结构性转移，公司从中受益。 这给 Mercor
              留出空间，把自己定位成面向后训练工作的高端专家市场。 但 Mercor 也遇到同一类风险：当公司大规模处理敏感工作流和承包商知识时，泄露、滥用和信任问题会随之而来。 Scale AI 于 September
              2025 起诉 Mercor 和前 Scale 员工 Eugene Ling，指控其围绕客户战略文件侵占商业秘密。 法院记录显示，该案后来在 January 2026
              被不可再诉地驳回，移除了一项诉讼阴影，但没有抹去围绕专家知识外泄的底层担忧。 对当前运营更严重的是，March 2026 与 LiteLLM 恶意软件相关的泄露事件触发客户审查；TechCrunch 报道称
              Meta 暂停了合同，OpenAI 则调查自身暴露面。 这些事件合在一起，让信息安全成熟度和企业信任成为眼前尽调重点，而不是遥远的扩张问题。
