- id: kitchen-os-and-data-platform
  title: 'Kitchen OS and data platform: public proof points to routing, forecasting, and menu-control systems around the kitchens'
  body: 'The most credible public technical evidence comes from Rebel’s own architecture language plus Google Cloud and Times of India reporting, not from a public API or engineering-doc portal. Rebel explicitly says it uses microservice solutions for multi-channel ordering and a brand-wise polygon for brand-level reach control. Google Cloud describes the adjacent stack in more concrete terms: Places, Geocoding, JavaScript, and Directions APIs for location capture and routing; BigQuery for forecasting and recommendation data; Kubernetes Engine for key applications; and a cloud migration driven by the failure of the original on-prem setup to scale reliably. Times of India adds the kitchen-control perspective, describing one-click menu suppression across brands, procedure-based kitchen stations rather than brand-based lines, central inventory logic, and an AI customer-service layer. Put together, that evidence supports a real internal kitchen operating system and data platform whose job is
    to synchronize menus, kitchen lines, demand forecasts, delivery promises, and service recovery. The caveat is boundary definition: Rebel clearly has serious internal systems, but it does not publish third-party developer documentation or a customer-visible technical architecture comparable to a horizontal software vendor.'
