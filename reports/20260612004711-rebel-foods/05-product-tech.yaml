  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: kitchen-os-internals
    missingEvidence: Detailed internal architecture documents for menu rules, kitchen orchestration, failure handling, and service ownership boundaries.
    whyItMatters: The public evidence proves the existence of serious internal systems but not how resilient they are under high load, partner complexity, or failure scenarios.
    diligencePath: Request architecture diagrams, service inventory, incident postmortems, change-management process, and owner map for the kitchen OS/control plane.
    relatedQuestionRefs:
    - QE008
    - QE022
    relatedTableRefs:
    - TE003
  - type: private-evidence-only
    severity: material
    topic: named-audits-and-certificates
    missingEvidence: Named third-party audit results, certificate artifacts, expiry dates, and corrective-action history for the kitchen and safety program.
    whyItMatters: Safety is central to the product proposition, so investors need evidence stronger than generalized quality-check language or app-store claims.
    diligencePath: Request HACCP or equivalent certificate copies, audit schedules, non-conformance summaries, and kitchen-incident logs by city and brand.
    relatedQuestionRefs:
    - QE020
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: quickies-sla-and-unit-economics
    missingEvidence: Current QuickiES fulfillment rate, average prep-plus-delivery time, cancellation rate, rider economics, and city-by-city rollout criteria.
    whyItMatters: Faster-delivery promises can create customer delight or operational debt depending on whether the same kitchens and rider pools can sustain the SLA.
    diligencePath: Request QuickiES KPI deck covering launch cohorts, SLA attainment, cancellations, refunds, rider staffing, and unit economics by zone.
    relatedQuestionRefs:
    - QE023
    relatedTableRefs:
    - TE005
  - type: missing-source
    severity: material
    topic: support-resolution-metrics
    missingEvidence: Published CSAT, complaint-resolution time, refund-cycle time, delivered-late rate, and support-escalation outcomes for EatSure.
    whyItMatters: Public complaints show the pain surface, but investors cannot judge whether those issues are edge cases or systemic without denominator metrics.
    diligencePath: Request customer-support dashboard with SLA attainment, refund timing, reopen rate, complaint volume, and channel split for app, web, and partner orders.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: minor
    topic: partner-and-offline-format-economics
    missingEvidence: Unit economics and operating playbooks for Wendy’s dine-in, takeaway, partner brands, and ONDC versus Rebel-owned delivery-first brands.
    whyItMatters: The same stack may not travel cleanly across dine-in, partner, and marketplace channels, which affects capital intensity and support complexity.
    diligencePath: Request format-by-format P&Ls, kitchen overlap maps, staffing models, and channel-specific service-level metrics.
    relatedQuestionRefs:
    - QE018
    relatedTableRefs:
    - TE001
    - TE005
  - type: stale
    severity: minor
    topic: current-network-counts
    missingEvidence: A single current reconciled company-published count for kitchens, cities, brands-per-kitchen, and customers that resolves 2019, 2024, and 2025-vintage numbers.
    whyItMatters: The public scale story is directionally strong but not harmonized enough to underwrite current capacity without management reconciliation.
    diligencePath: Ask management for a current network snapshot by geography, kitchen type, partner/owned split, and active-brand density per kitchen.
    relatedQuestionRefs:
    - QE021
    relatedTableRefs:
    - TE001
    - TE005
