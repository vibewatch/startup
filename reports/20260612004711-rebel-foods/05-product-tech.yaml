- id: trust-safety-support-controls
  title: 'Trust, safety, and support controls: strong published process claims, thinner independent proof'
  body: Trust and quality controls are unusually central to Rebel’s product story because EatSure is marketed not just as fast delivery but as assured delivery. About EatSure and the FAQ repeatedly anchor the promise in medically certified people, 200+ quality checks, double-sealed packaging, dish-level ingredient transparency, and live temperature tracking of handlers. The FAQ goes further with operational controls—hand washing every 20 minutes, protective gear, disinfection cadences, separate vegetable and meat storage, FIFO, defined cooking temperatures, 24x7 CCTV, immediate packaging, and delivery hygiene steps. The Google Play data-safety panel and privacy policy add another trust layer around collected data, deletion requests, and encrypted transit. The problem is that public verification depth does not fully match marketing specificity. Store surfaces claim certified kitchens and stringent audits, but do not link named certificates or audit summaries. Meanwhile, May 2026 reviews and
    complaint-board records show that misleading ETAs, missing refunds, cold food, and support breakdowns still occur. The net view is that Rebel has a richly specified trust operating model, but real-world support quality still appears to be the weak point where product promises meet operational strain.
