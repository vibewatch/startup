  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Key public evidence
  - Dependency
  - Risk
  rows:
  - - Brand and channel entry points
    - Capture demand from brand sites, EatSure, ONDC, and marketplaces
    - Homepage, brand sites, EatSure home/FAQ, Outlook
    - Fresh content, menu sync, and channel parity
    - Menu or channel drift can create customer confusion or stock-outs
