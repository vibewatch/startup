- id: roadmap-signals-and-product-risks
  title: 'Roadmap signals and product risks: faster delivery, broader channels, and partner formats raise execution pressure'
  body: 'The 2024-2026 roadmap signals point in one direction: Rebel is trying to turn its kitchen stack into a broader, faster, and more channel-flexible food platform. Financial Express described EatSure as a foodcourt-on-an-app and reported a target of serving 120 cities while running 5 to 20 brands per kitchen. Outlook Business then showed the next operational leap: QuickiES 15-minute delivery in Mumbai, with scale-up contingent on demand and feasibility. The App Store and Google Play pages show active 2026 release work around Elite, BOGO presentation, attribution tooling, and slot fixes, which implies the customer app is still being optimized as a growth lever rather than maintained passively. At the same time, Wendy’s partner updates show that the same shared stack can support dine-in and takeaway formats in addition to delivery. The risk is that each new surface—rapid delivery, ONDC access, loyalty mechanics, partner brands, dine-in footprints—adds operational complexity. Rebel’s
    moat still looks strongest where software and kitchen physics reinforce each other; the core diligence question is whether the support, SLA, and audit systems are scaling as quickly as the surface area of the product.'
