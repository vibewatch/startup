- id: eatsure-customer-surfaces
  title: 'EatSure customer surfaces: the control plane combines multi-brand ordering, tracking, support, and loyalty'
  body: 'EatSure is better understood as Rebel’s customer-facing control plane than as a generic food-ordering app. The current homepage and FAQ emphasize a single order spanning multiple restaurants, while Google Play and the App Store describe one seamless order across 15+ brands, live tracking, loyalty or wallet mechanics, first-order promotions, support, and multiple payment options. The FAQ adds the workflow detail that matters operationally: orders are sent to the restaurant after confirmation, the respective restaurant’s delivery executives fulfill them, customers can add instructions or track progress in My Orders, and the Virtual Surebot Cookie handles cancellations and complaints. That creates a tighter workflow loop than a thin marketplace front end: menu discovery, cross-brand basket creation, order confirmation, kitchen execution, rider communication, refund or wallet handling, and repeat purchase all sit on the same surface. The customer promise is therefore convenience plus
    trust, but it also concentrates product risk because latency, refunds, and support failures are exposed directly inside the EatSure surface rather than being hidden behind third-party marketplaces.'
