    - Convenience and lower ordering friction across cuisines
    - Service failure hits the whole basket at once
  - - Offer-led checkout and retention
    - Apply first-order, BOGO, Elite, or wallet value
    - EatSure promotions, SurePoints/Wallet, Elite program
    - Raises repeat intent and basket-value experimentation
    - Promotions increase refund/support complexity if service slips
  - - Order tracking and exception handling
    - Track order, add instructions, cancel, contact support
    - My Orders, live tracking, Surebot Cookie, support email/chat
    - Customers can self-serve many mid-order tasks
    - Public reviews still report ETA, cancellation, and refund frustration
  - - Kitchen preparation under shared assets
    - Route ordered items into shared cooking lines
    - Assembly-line kitchen stations plus multi-brand kitchen model
    - Higher asset reuse and faster scaling across brands
    - Complex menus create execution dependence on forecasting and line discipline
  - - Assured-safety decision making
    - Check ingredients, calories, safety promise, packaging
    - Dish transparency, 200+ checks, temperature tracking, double sealing
    - Trust is productized rather than left implicit
    - Formal certificates and audit summaries are not publicly linked
  - - Partner or offline format extension
    - Access Wendy’s, ONDC, or dine-in experiences on shared stack
    - Shared kitchen plus partner/franchise and channel integrations
    - Extends demand beyond owned D2C brands
    - Each new format adds ops variance and support burden
