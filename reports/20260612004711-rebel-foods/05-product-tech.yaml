tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Shared cloud-kitchen network
    - Rebel brand teams and partner brands
    - GA at scale
    - One kitchen can host multiple food missions and reuse labor/equipment across brands
    - Current kitchen-level utilization, throughput, and margin by format are not public
  - - Occasion-based brand portfolio
    - End consumers across meal occasions
    - GA
    - Brand architecture maps price points and occasions instead of forcing one master brand
    - Public portfolio logic is clear, but current revenue mix by brand is not disclosed
  - - EatSure app and web control plane
    - Consumers ordering across brands
    - GA
    - Single order across multiple restaurants or brands with tracking, wallet, loyalty, and support
    - Cross-brand basket attach, repeat rates, and support-resolution metrics are private
  - - Multi-channel ordering and menu-control layer
    - Kitchen managers and channel operators
    - GA but internally described
    - Microservices and one-click menu suppression across brands suggest centralized operational control
    - No public architecture doc or uptime history for this control plane
  - - Kitchen automation and patented machinery
    - Kitchen operations teams
    - GA claims
    - Automation is positioned as the way Rebel standardizes food output and reduces skill dependence
    - Named machinery specs, capex payback, and failure modes are not public
  - - Routing, ETA, and delivery-intelligence layer
    - Customers, riders, dispatch teams
    - GA
    - Maps APIs and forecasting improve ETA accuracy and local-market demand allocation
    - Current post-2019 ETA accuracy, rider utilization, and breach rates are not public
  - - Data platform and personalization layer
    - Growth, CRM, and kitchen planning teams
    - GA but opaque
    - BigQuery, recommendations, forecasting, and AI-driven service/personalization sit close to kitchen operations
    - Current model performance, feature importance, and governance controls are private
  - - Partner and offline format layer
    - Wendy’s, ONDC users, dine-in customers
    - Expansion stage
    - Rebel can extend the shared operating stack into partner QSR and non-pure-delivery formats
    - Unit economics and operational differences between own-brand, partner, dine-in, and ONDC channels are not public
  notes: Rows distinguish clearly visible modules from the adoption, utilization, and economics evidence that still requires management diligence.
