      financing risk matters to the thesis.
    diligencePath: >-
      Request cash waterfall, lender agreements, covenant package, payable/receivable aging, and 12-month base/downside
      liquidity forecast.
    relatedQuestionRefs:
      - QI013
      - QI018
      - QI025
    relatedTableRefs:
