evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: public-scale-reconciliation
    missingEvidence: >-
      A single current company-approved footprint table reconciling kitchens, internet restaurants, cities, countries,
      customers, and Wendy’s touchpoints.
    whyItMatters: >-
      Current official pages and partner/media coverage disagree on several headline scale metrics, which weakens
      valuation comparability and later chapter reuse.
    diligencePath: >-
      Request the latest board or finance-approved corporate fact sheet and operating footprint deck, then normalize
      every public KPI against that source of truth.
    relatedQuestionRefs:
      - QO005
      - QO024
      - QO026
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: governance-and-leadership-map
    missingEvidence: >-
      A current board roster, committee structure, shareholder list, and named executive roster directly from management
      or statutory filings.
    whyItMatters: >-
      Leadership succession is visible, but control rights and board oversight are not, which limits diligence on
      governance quality and key-person dependency.
    diligencePath: >-
      Request the latest annual return, cap table, board materials, and organization chart; reconcile them with founder,
      investor, and functional leadership interviews.
    relatedQuestionRefs:
      - QO010
      - QO026
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: valuation-and-capital-history
    missingEvidence: >-
      Executed financing documents or management-approved cap table showing exact Series G, KKR, debt, and secondary
      mechanics.
    whyItMatters: >-
      Public round amounts, post-money markers, and investor economics are not fully harmonized, so headline valuation
      and dilution remain medium-confidence only.
    diligencePath: >-
      Request financing closing decks, debt schedules, and the current fully diluted capitalization table, then rebuild
      the funding chronology from primary documents.
    relatedQuestionRefs:
      - QO011
      - QO012
      - QO013
    relatedTableRefs:
      - TO003
      - TO004
  - type: private-evidence-only
    severity: material
    topic: brand-level-economics
    missingEvidence: Brand-level revenue mix, Wendy’s store economics, EatSure cohort metrics, and current headcount by geography.
    whyItMatters: >-
      Chapter 1 can support group-level revenue and losses, but not which brands or channels actually drive durable
      profitability and capital efficiency.
    diligencePath: >-
      Request internal brand P&Ls, same-store sales cohorts, Wendy’s partnership economics, and a current people
      dashboard before underwriting channel quality.
    relatedQuestionRefs:
      - QO014
      - QO017
      - QO018
      - QO022
    relatedTableRefs:
      - TO001
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: chronology-completeness
    missingEvidence: >-
      Legal closing dates and primary documents for the Wendy’s expansion rights, Smoor acquisition, leadership
      succession approvals, and financing closings.
    whyItMatters: >-
      The public chronology is good enough for narrative analysis but still uses announcement dates for some events,
      which can blur governance and financing sequencing.
    diligencePath: >-
      Request signed agreements, board resolutions, and closing notices so the milestone table can be upgraded from
      public chronology to legal chronology.
    relatedQuestionRefs:
      - QO019
      - QO020
      - QO021
      - QO023
      - QO025
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: som-gap
    missingEvidence: >-
      Brand-level order volume, average order value, contribution margin, and direct-versus-aggregator mix for Rebel
      Foods.
    whyItMatters: >-
      Without these operating metrics, the chapter cannot convert broad India market data into a defendable
      Rebel-specific SOM or share-of-wallet model.
    diligencePath: >-
      Request management cohort data by brand, city tier, channel, and kitchen vintage, plus a bridge from GMV to
      contribution margin.
    relatedQuestionRefs:
      - QM023
  - type: conflicting-data
    severity: material
    topic: estimate-dispersion
    missingEvidence: >-
      A reconciled definition table explaining whether each published estimate measures GMV, platform revenue, or
      cloud-kitchen segment revenue.
    whyItMatters: >-
      Published market sizes span from USD 734 million to USD 61.19 billion for ostensibly similar delivery markets,
      which can mislead valuation if treated as interchangeable.
    diligencePath: >-
      Ask management and sector experts to map each vendor estimate to its numerator, denominator, geography, and
      inclusion of discounts, grocery, or restaurant-owned channels.
    relatedQuestionRefs:
      - QM007
      - QM022
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: minor
    topic: tier-2-expansion
    missingEvidence: >-
      Public city-tier order mix and kitchen productivity data that isolates tier-2 and tier-3 contribution for Rebel
      Foods or peers.
    whyItMatters: >-
      Public reports agree that smaller cities matter, but they do not quantify how much of Rebel's demand or
      profitability already comes from those corridors.
    diligencePath: >-
      Request city-tier GOV, AOV, repeat rate, and payback data from management; compare with peer city-level
      disclosures if available.
    relatedQuestionRefs:
      - QM014
      - QM015
  - type: missing-source
    severity: minor
    topic: merchant-and-payment-infrastructure
    missingEvidence: >-
      A cleaner official dataset linking food-delivery transactions specifically to UPI and merchant acceptance by city
      and restaurant segment.
    whyItMatters: >-
      Digital-payment adoption is clearly a tailwind, but current public datasets are system-wide and do not isolate
      food-delivery checkout behavior.
    diligencePath: >-
      Supplement RBI and NPCI system data with aggregator payment-mix disclosures or merchant acquirer datasets during
      live diligence.
    relatedQuestionRefs:
      - QM012
  - type: missing-source
    severity: material
    topic: aggregator-realized-take-rates
    missingEvidence: >-
      Actual 2026 merchant contracts or cohort-level realized take rates for Swiggy and Zomato, including commissions,
      ads, and incentive offsets.
    whyItMatters: >-
      Public list surfaces and partner guides do not show what Rebel or peer operators actually pay after ads, promos,
      and negotiated terms.
    diligencePath: >-
      Request current partner agreements or anonymized monthly P&Ls by brand and city from Rebel and at least one peer
      operator.
    relatedQuestionRefs:
      - QP012
      - QP024
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: eatsure-demand-share
    missingEvidence: Current share of Rebel orders and repeat customers coming from EatSure versus Swiggy, Zomato, and other channels.
    whyItMatters: >-
      Without channel mix and repeat-rate data, it is impossible to prove that EatSure is already a durable demand moat
      rather than a convenience layer.
    diligencePath: >-
      Obtain channel-mix, repeat-rate, CAC, and contribution-margin data for EatSure versus aggregator channels over the
      last four quarters.
    relatedQuestionRefs:
      - QP014
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: material
    topic: kitchen-utilization-and-brand-profitability
    missingEvidence: >-
      Kitchen-level utilization, prep times, waste, labor leverage, and brand-level contribution margins for Rebel and
      close peers.
    whyItMatters: >-
      The operational moat thesis depends on whether multi-brand utilization actually converts into superior economics
      rather than just more complexity.
    diligencePath: >-
      Request city-level kitchen scorecards, brand profitability cuts, and external-brand launcher churn for the last 12
      months.
    relatedQuestionRefs:
      - QP023
    relatedTableRefs:
      - TP004
  - type: conflicting-data
    severity: minor
    topic: rebel-scale-disclosure-variation
    missingEvidence: >-
      A reconciled current count for Rebel internet restaurants and country footprint across official and
      investor-facing materials.
    whyItMatters: >-
      Different public surfaces emphasize different scale numbers, which complicates apples-to-apples benchmarking in
      the competitor table.
    diligencePath: >-
      Ask management for one current canonical scale slide covering kitchens, cities, countries, brands, and active
      customer counts.
    relatedQuestionRefs:
      - QP002
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: blocking
    topic: realized-pricing-and-channel-take-rate
    missingEvidence: Realized net price after coupons, cancellations, refunds, and marketplace commissions by brand and channel.
    whyItMatters: >-
      Public promo pages prove demand capture but do not show whether direct orders or aggregator orders are
      contribution positive after incentives.
    diligencePath: >-
      Request weekly brand-by-channel order economics, coupon leakage, refund rates, and aggregator commission schedules
      for FY24-FY25.
    relatedQuestionRefs:
      - QI003
      - QI012
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: blocking
    topic: sales-efficiency-and-payback
    missingEvidence: CAC, payback period, repeat-order retention, and direct-order cohort performance by brand and city.
    whyItMatters: >-
      Margin expansion depends on whether EatSure and brand density lower acquisition cost and improve repeat economics,
      but public sources do not prove that mechanism.
    diligencePath: >-
      Request monthly cohort retention, CAC by acquisition channel, payback by brand, and city-level kitchen utilization
      for the last 24 months.
    relatedQuestionRefs:
      - QI019
      - QI025
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: blocking
