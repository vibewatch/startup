chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, model, and public footprint
        blocks:
          - type: paragraph
            body: >-
              Rebel’s current official materials support a broader identity than the shorthand “cloud kitchen startup.”
              The homepage describes a global internet-restaurant chain built on an operating system for launching and
              scaling brands, while What We Do frames the company as a multi-brand answer to different consumer “food
              missions.” EatSure adds the consumer interface that turns this operating stack into a multi-restaurant
              ordering product, and current public expansion materials show Rebel also using franchising and partner
              channels rather than only delivery-only kitchens. The main caveat is that current scale disclosures are
              not internally harmonized. The Who We Are page says 70+ cities and 10 countries, while What We Do says 75
              cities and 3 countries. Independent 2024-2025 coverage also shifts between 4,000 and 5,000 internet
              restaurants. The reusable conclusion for the rest of the report is therefore directional rather than
              absolute: Rebel is a large late-stage food platform with 450+ kitchens and meaningful multi-brand reach,
              but the exact public footprint still needs normalization from management materials.
