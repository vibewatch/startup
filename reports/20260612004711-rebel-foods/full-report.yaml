      - number: '8.2'
        title: 'Comparable context: even the secondary range still asks investors to pay public-premium multiples'
        blocks:
          - type: paragraph
            body: >-
              The cleanest public valuation test for Rebel is a revenue-multiple comparison, not a DCF. There is no
              public IPO filing, no audited FY25 or FY26 financial package, no cap-table / liquidation waterfall
              disclosure, and no brand- level EBITDA bridge that would justify precision. On that limited evidence, the
              key question is whether Rebel's current observable private marks sit below, at, or above what public
              food-delivery and food-commerce investors already pay for better disclosed businesses.

              The answer is uncomfortable. DoorDash trades around 4.6x sales and is the clear high-quality ceiling in
              the set; it also comes with public-company reporting, positive adjusted profitability, and deep liquidity.
              Swiggy screens around 2.7x FY26 revenue after going public and still carries meaningful losses. Delivery
              Hero, Deliveroo, and Just Eat Takeaway all sit near roughly 1.0x to 1.4x revenue. Rebel's late-2024 KKR
              secondary range of roughly ₹6,800 crore to ₹7,315 crore implies about 4.8x to 5.2x trailing FY24 revenue,
              which is richer than Swiggy, Delivery Hero, Deliveroo, and Just Eat, and only slightly above DoorDash's
              public multiple. That might be defensible if Rebel offered DoorDash-like growth conversion, audited
              economics, and disclosure. Public evidence today does not show that, so the current private ask still
              looks stretched rather than obviously attractive.
