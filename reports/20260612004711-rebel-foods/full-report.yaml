      - number: '7.2'
        title: Regulatory, legal, and food-safety exposure
        blocks:
          - type: paragraph
            body: >-
              Rebel operates inside a dense Indian compliance stack that is unusually unforgiving for delivery-first
              food brands. FSSAI's framework is not a single licence obligation but a package of licensing, recall,
              advertising, packaging, audit, and labelling rules that sit on top of local municipal enforcement. That
              matters because shared-kitchen, multi-brand operations can turn one hygiene or labelling lapse into a
              cross-brand trust event. Rebel's own public record shows this is not abstract: a Telangana High Court
              order confirms GHMC issued a 2019 closure notice and physically seized shutters at a Hyderabad site, while
              the company's writ was dismissed for non-prosecution in April 2026. Court records also show commercial
              disputes around vendor payments and SARFAESI-linked premises possession, which means the legal tail is not
              limited to food regulation. The compliance surface is wider still because Rebel's privacy policy confirms
              extensive user-data collection, data sharing with delivery partners and government agencies, and
              AWS-hosted storage outside India, creating another regulatory vector if a breach, deceptive-claims issue,
              or grievance-handling failure accompanies a food-safety incident. Gig-worker and wage legislation do not
              apply to Rebel in exactly the same way as to Swiggy and Zomato, but they shape the labor-cost environment
              around delivery partners and in-kitchen staffing and therefore still affect system economics.
            claimRefs:
