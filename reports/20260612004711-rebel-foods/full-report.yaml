      - number: '3.2'
        title: Capability, pricing surface, and distribution power
        blocks:
          - type: paragraph
            body: >-
              Rebel's strongest documented advantage is breadth from one kitchen base: it can run a portfolio spanning
              pizza, biryani, wraps, bowls, desserts, and partner brands while routing those brands through Rebel OS,
              EatSure, and marketplace channels. That is broader than a single-theme specialist such as BBK or
              FreshMenu, but breadth is not the same thing as demand ownership. Public disclosures for Swiggy and Zomato
              are much richer than for EatSure, showing millions of transacting users, hundreds of thousands of
              restaurant partners, and massive order volumes. That asymmetry matters because the commercial surface is
              often set by the aggregator, not the kitchen operator. DoorDash's publicly posted 15%, 25%, and 30% plans
              are a useful global benchmark for how distribution platforms package reach, visibility, and loyalty
              access. Deliveroo Editions, Uber Eats, and DoorDash all emphasize customer acquisition, coverage
              expansion, and operational tooling as the product they sell to merchants. For Rebel, the implication is
              that it can improve unit economics through kitchen utilization and menu mix, but it does not fully control
              the route to market whenever the customer is acquired on Swiggy or Zomato.
