    sections:
      - number: '5.1'
        title: 'Multi-brand kitchen stack: Rebel is selling a shared operating model, not isolated restaurant apps'
        blocks:
          - type: paragraph
            body: >-
              Rebel Foods’ own surfaces consistently frame the company as a kitchen-and-software system for
              manufacturing and distributing many food occasions from shared assets. The homepage calls Rebel the
              world’s largest chain of internet restaurants powered by an operating system for building and scaling
              brands globally, while the What We Do and Who We Are pages make the architecture explicit: one kitchen,
              multiple brands; occasion-led portfolio design; microservice-based multi-channel ordering; patented
              machinery; and automation intended to standardize output across kitchens. That matters because the product
              is not just Faasos, Behrouz, or Oven Story as standalone restaurant brands. The real product is the
              asset-sharing logic that lets Rebel map brands to meals, map meals to kitchen lines, and reuse labor,
              hardware, menus, and delivery rails across multiple demand missions. Public evidence is strongest on the
              existence of that stack and the breadth of its brand portfolio. It is weaker on unit-level adoption or
              brand-by-brand economics, so investors should treat the kitchen operating model as real but still
              partially black-boxed on utilization and margin quality.
