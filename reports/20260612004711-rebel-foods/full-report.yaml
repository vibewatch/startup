        title: 'Scenario logic: the upside requires disclosure and execution, while the downside needs less imagination'
        blocks:
          - type: paragraph
            body: >-
              The upside case for Rebel is not fictional. The company still controls widely recognized digital-first
              brands, continues to add omnichannel capacity, and operates in a market where both IMARC and Expert Market
              Research see continued structural growth in cloud kitchens and online food delivery. If core brands keep
              compounding, the offline / omnichannel push works, weaker portfolio assets stop absorbing capital, and
              management can show that burn discipline translates into durable EBITDA progress, the business can
              plausibly support a value range that starts with the KKR secondary band and reopens a path toward the
              prior unicorn framing.

              But the downside is easier to explain with public evidence. Forbes' 2026 review of ghost-kitchen economics
              argued that operators remain squeezed by paid-acquisition dependence, low loyalty, and delivery fees that
              can absorb 15% to 30% of order value. Restaurant Business' reporting on Reef shows how quickly the model
              can run into sales, profitability, and regulatory problems when scaled carelessly. Rebel's own portfolio
              pruning, office consolidation, and the Smoor overhang suggest management already recognizes this pressure.
              That makes the base case narrower than the headline brand narrative implies: value support exists around
              the current secondary range, but not at a price-insensitive premium, and a further markdown is easy to
              justify if audited growth, margin, or financing evidence disappoints.
