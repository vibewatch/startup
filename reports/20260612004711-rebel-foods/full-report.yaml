  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - trigger
      - threshold / event
      - transmission to thesis
      - action implication
    rows:
      - - New financing reset
        - Any priced round or large secondary below ~$700M equity value
        - Confirms that even the late-2024 secondary anchor was too optimistic and increases dilution / preference risk.
        - Move stance from research-more toward avoid unless terms become clearly compensating.
      - - Audited growth and margin miss
        - FY25/FY26 audited revenue growth stalls while EBITDA or burn does not improve materially
        - Breaks the argument that FY24 was the start of durable operating leverage.
        - Re-underwrite on a lower multiple band closer to Swiggy / Deliveroo / JET comparables.
      - - Portfolio drag persists
        - More closures, office consolidation, or evidence that acquired / external brands keep losing money
        - Suggests capital is still trapped in non-core assets and brand aggregator logic is not self-funding.
        - Require portfolio cleanup before paying above the KKR band.
      - - Direct-order / omnichannel proof absent
        - No evidence that offline, Wendy's, EatSure, or direct ordering materially improve margin capture
        - Keeps Rebel exposed to third-party platform fees and low customer ownership.
        - Hold off on a premium multiple until channel mix proof is available.
      - - IPO readiness stalls
        - No public draft filing, audited package, or governance upgrade before the next liquidity window
        - Reduces confidence that a public-market exit will validate the current private marks.
        - Treat Rebel as a private hold with uncertain exit timing, not as an imminent IPO story.
    notes: >-
      Triggers are investor-defined monitoring thresholds. They are meant to translate the valuation debate into
      observable events that would force a recommendation change.
    claimRefs:
      - CV013
      - CV018
      - CV022
