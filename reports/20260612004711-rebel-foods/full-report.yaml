        - High delivery mix can keep operating leverage elusive despite top-line growth
        - What is Rebel's kitchen-level contribution margin after aggregator fees and discounts?
      - - Customer-acquisition and visibility spend
        - Negative
        - Now
        - Discounting and sponsored placement can erode unit economics
        - What payback period does Rebel achieve on paid visibility or promo-led acquisition?
      - - Competition intensity
