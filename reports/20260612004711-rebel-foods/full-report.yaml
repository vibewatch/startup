      - number: '7.5'
        title: Mitigations, monitors, and thesis-break criteria
        blocks:
          - type: paragraph
            body: >-
              Rebel does have real mitigation surfaces. The company has built a meaningful own-app brand in EatSure,
              continues to pitch automation and kitchen standardization, and has shown it can still raise large
              institutional rounds. It also has several ways to stretch brand distribution: franchising, licensing,
              platform services, and physical food-court formats. The problem is that most of those mitigants are still
              process or growth levers rather than proof that the channel and margin structure has structurally
              improved. The highest-value diligence items are therefore measurable. Investors should ask for
              trailing-12-month order mix by channel, commission rates by platform, current FSSAI licence inventory and
              inspection history by kitchen, brand-level refund and complaint rates, and current debt, lease, and
              covenant schedules. The cleanest kill criteria are also measurable: if direct-order penetration remains
              low while commission and input costs stay elevated, if another food-safety or municipal action hits a
              shared kitchen, if Wendy's or offline formats underperform despite continued capex, or if the next
              financing event prices materially below the late-2024 round, then Rebel's omnichannel story starts to look
              like complexity layered onto a still platform-dependent base rather than a genuine de-risking of the
              model.
