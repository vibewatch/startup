  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue architecture and public traction
        blocks:
          - type: paragraph
            body: >-
              Rebel Foods looks financially more like a multi-brand food operator than a software company. Public FY24
              and FY25 coverage repeatedly shows that the business still books almost all operating revenue from the
              sale of food rather than from software, subscriptions, or other recurring high-margin lines. Entrackr put
              the sale-of-food share at 96.7% of FY24 operating revenue and 97% of FY25 operating revenue, while smaller
              ancillary lines such as services, commission, delivery, royalty, and other fees remain visible but not
              materially disclosed in a clean segment note. That matters because the quality of revenue is operationally
              real but structurally lower-margin than a SaaS-style business, and it means underwriting depends on
              kitchen throughput, order mix, and procurement discipline more than on pure software monetization.


              The public-facing commercial surface reinforces that interpretation. EatSure is positioned as Rebel's
              direct-order foodcourt-on-an-app, letting customers combine restaurants in a single order, while brand
              landing pages push promotions such as first-order discounts, free-delivery thresholds, and group-order
              incentives. Those pages prove demand capture and direct-order intent, but they do not reveal realized
              pricing after coupons, cancellations, refunds, or aggregator commissions. The franchise page adds one hard
              B2B price point—a INR 10 lakh LoI payment before full franchise fees and deposits—yet even there the full
              economic stack remains private. Rebel Launcher likewise proves partner-brand scaling capability, but not
              its take rate.


              Scale is no longer the main public question. Rebel says it operates 4,000+ internet restaurants across
              450+ kitchens in 70+ cities and 10 countries, and media coverage places the current footprint at more than
              450 cloud kitchens including 75 Indian cities. Financial Express also shows why scale alone is not enough:
              Rebel is pursuing a blended network of cloud kitchens, EatSure food courts, company-operated outlets,
              franchise outlets, and partner-brand expansion because direct demand capture and multi-format density
              matter to margin improvement. The core diligence task is therefore not proving that the network exists; it
              is proving which part of that network actually creates attractive contribution profit.
            claimRefs:
