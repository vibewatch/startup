      - number: '2.5'
        title: Underwriting Implications and Remaining Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              The correct underwriting stance is disciplined optimism. The public data clearly support that Rebel
              operates inside a large, still-growing digital food market, but the evidence also shows that the market
              can be oversized or undersized depending on the definition. The cleanest practical lens is not “all
              foodservice” and not even every published online-delivery estimate. It is repeat digital meal occasions in
              urban and increasingly tier-2 corridors where mobile apps, online payments, and aggregator discovery
              already shape behavior. The cloud-kitchen slice is the best pure-format proxy, but it understates the
              hybrid routes Rebel now uses through food courts, franchised dine-in-plus-cloud-kitchen formats, and
              partner brands.


              What public evidence still cannot prove is Rebel's true serviceable market or economic share of that
              demand. The company does not publicly disclose order frequency, average order value, contribution margin
              by brand, direct-versus-aggregator mix, or city-tier productivity. Without those metrics, any precise SAM
              or SOM model would be an assumption stack rather than a verified fact. Investors should therefore preserve
              the contradictory market estimates on purpose, use them as boundary checks, and focus live diligence on
              cohort-level repeat behavior, channel mix, and kitchen productivity rather than on one giant headline TAM.
            claimRefs:
              - CM016
              - CM040
              - CM050
              - CM051
              - CM052
      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Definition-sensitive market, not a single TAM
            body: >-
              Rebel Foods clearly participates in a large digital meal market, but the public evidence is too
              definition-sensitive to justify one headline TAM. Preserving the estimate spread is analytically safer
              than collapsing it.
