  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk thesis
        blocks:
          - type: paragraph
            body: >-
              Rebel's risk profile is best understood as a chain rather than a single point failure. The highest-ranked
              exposure is aggregator dependence: the public competition record shows a Zomato-Swiggy duopoly, alleged
              bundled delivery, and commission ranges that can consume a large share of order contribution margin, while
              Rebel is still building its own direct channel through EatSure. Second is food-safety, municipal, and
              data-compliance exposure across a dense multi-brand kitchen network where one operational miss can travel
              across brands, cities, and regulators faster than in a single-brand QSR chain. Third is execution
              complexity from running 10-15 brands per kitchen, scaling franchised and licensed formats such as Wendy's
              and Oven Story, and pushing the model into offline food courts and new geographies simultaneously. Fourth
              is financing and valuation risk: losses have narrowed, but public evidence still points to a business that
              required large 2024-2025 capital infusions, carries legacy dispute and SARFAESI history, and is navigating
              valuation pressure between a $1.4 billion round and a later reported $800-860 million KKR process. The
              residual question for investors is not whether Rebel has growth surfaces; it is whether those surfaces
              reduce dependence quickly enough before compliance costs, commodity inflation, and platform bargaining
              power re-compress margins.
            claimRefs:
