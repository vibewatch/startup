  - id: TV004
    title: Comparable valuation table
    columns:
      - comparable
      - current anchor
      - multiple / valuation / status
      - relevance to Rebel
      - limitation
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the most decision-useful public and private references surfaced in this run: Rebel's own late-2024
        financing anchors plus selected listed food-delivery peers with direct investor-relations or market-data pages.
        It is not an exhaustive census of all global restaurant-tech or marketplace comparables.
    rows:
      - - Rebel Foods Series G primary headline
        - Dec-2024 financing coverage
        - ~$1.4B headline mark
        - Latest widely cited primary-round valuation anchor and IPO narrative reference.
        - Round included large secondary sales and does not disclose the current cap table or preference terms.
      - - Rebel Foods / KKR secondary
        - Late-2024 secondary reporting
        - ~$800M-$860M; roughly ₹6,800-7,315 crore
        - >-
          Most realistic observable live private anchor; better reflects where a later investor seemed willing to
          transact.
        - Secondary pricing is not the same as broad new-money demand and may be term-sensitive.
      - - DoorDash
        - Jun-2026 public market + LTM revenue
        - ~$67.35B market cap; ~4.58x sales
        - Best quality ceiling in the set for food-delivery scale, liquidity, and disclosure.
        - Much deeper profitability, public float, and investor disclosure than Rebel.
      - - Swiggy
        - Jun-2026 public market + FY26 revenue
        - ~₹625.97B market cap; ~2.72x revenue
        - Closest listed Indian food-delivery reference with public-company reporting and ongoing losses.
        - Marketplace model and quick-commerce exposure differ from Rebel's owned-brand cloud-kitchen mix.
      - - Deliveroo
        - Last public market reference + 2024 revenue
        - ~$3.54B market cap; ~1.36x revenue
        - Shows how public markets value a smaller delivery platform with weaker leverage than DoorDash.
        - Historical reference only after public-market consolidation; not an Indian owned-brand operator.
      - - Just Eat Takeaway
        - Last public market reference + 2024 revenue
        - ~$4.76B market cap; ~1.29x revenue
        - Useful lower-multiple benchmark for a mature, disclosure-rich delivery operator.
        - International portfolio and restructuring history make it a harsher but imperfect analog.
      - - Delivery Hero
        - Jun-2026 public market + 2024 revenue
        - ~$13.44B market cap; ~1.05x revenue
        - Demonstrates how public investors discount scale when delivery economics remain capital intensive.
        - Multi-region platform with quick-commerce and marketplace exposure differs from Rebel's brand-owned model.
    notes: >-
      Public-comp multiples use directly cited market-cap and revenue pages. Rebel rows are financing anchors, not
