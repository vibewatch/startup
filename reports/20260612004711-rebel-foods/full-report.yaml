      - number: '2.3'
        title: Buyer Segments, Budget Owners, and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              Rebel's buyer map is consumer-led rather than procurement-led, but it is still segmented in ways that
              matter for valuation. The user is usually an individual eater or household, yet the payer and budget owner
              shift by occasion: weekday solo orders are controlled by a young professional or student using a personal
              wallet; family and sharing orders move to a household budget owner; office-led orders may be reimbursed or
              centrally approved. Rebel's own meal-mission framing supports this occasion-based segmentation, and
              third-party market reports also describe urban professionals, students, and families as the core delivery
              cohorts.


              The adoption path is now heavily app-mediated. IMARC says mobile applications account for 79% of the
              market, and the consumer base sits on top of 1.03 billion internet users and 1.06 billion mobile
              connections in India. Digital payment infrastructure removes checkout friction while aggregators still
              dominate discovery, which means the buyer journey often runs from hunger occasion to aggregator app to
              brand selection to digital payment to repeat ordering. That is why the most important budget owner
              question for Rebel is not enterprise procurement; it is how much of each meal mission the company can
              capture from urban, digitally connected, convenience-seeking households before the same demand leaks to
              substitutes such as independent restaurants, home cooking, or a rival platform-promoted brand.
            claimRefs:
              - CM018
              - CM019
              - CM020
              - CM024
              - CM025
