      - number: '4.3'
        title: Capital adequacy, debt, and financing dependence
        blocks:
          - type: paragraph
            body: >-
              Public evidence is strong enough to prove financing dependence, but not strong enough to compute runway
              with confidence. The company has a long equity history, including the 2021 USD 175 million Series F at a
              USD 1.4 billion valuation, and later public funding reports point to a 2025/2026 USD 210 million
              Temasek/Evolvence round plus a separate USD 25 million QIA check. Yet those later valuation and
              primary-versus-secondary details are not reconciled cleanly across sources. ET's August 2024 reporting
              suggested a secondary leg around a USD 700 million valuation, while IPO Central later reported a USD 1.4
              billion valuation. That is too wide a spread to underwrite current value without signed round documents.


              Debt is clearer than equity. Financial Express described an earlier USD 13.2 million Alteria/InnoVen debt
              raise, and Entrackr's September 2025 filing-based report said Rebel approved 15,000 NCDs at INR 1 lakh
              each, raising INR 150 crore at a 13.9% coupon due in September 2028. The Company Check also lists about
              INR 687 crore of open charges and INR 186.5 crore of settled loans. That combination—priced debt, visible
              charges, and continued loss-making operations—shows the business is not financing growth on equity alone.


              The most uncomfortable public number is the March 2025 cash balance. Entrackr said cash and bank balances
              were only about INR 56 crore at fiscal year-end, versus roughly INR 336 crore of FY25 net loss. That does
              not prove an immediate liquidity crunch because cash can change quickly after debt or equity closes, but
              it does mean public investors cannot underwrite runway from the outside. Without unrestricted cash,
              covenant detail, working-capital timing, or a board-approved use-of-funds plan, the prudent conclusion is
              that Rebel likely remained dependent on fresh funding, direct-order mix improvement, and tighter cost
              control through 2025-2026.
