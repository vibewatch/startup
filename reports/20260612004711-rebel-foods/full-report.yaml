          uncertainty.
      - - >-
          Public comps suggest Rebel is already being asked to trade at or above Swiggy-like and DoorDash-like sales
          multiples without equivalent disclosure.
        - anti-thesis
        - >-
          Audited margin quality, direct-ordering proof, and public-offering readiness would justify a narrower
          disclosure discount.
      - - >-
          Ongoing restructuring and weak acquired-brand performance suggest not every part of the portfolio deserves
          premium capital.
        - anti-thesis
        - >-
          Demonstrated exits from weak assets and proof that core brands drive most profits would improve underwriting
