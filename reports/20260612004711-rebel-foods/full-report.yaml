  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct peers, aggregators, substitutes, and global analogs'
        blocks:
          - type: paragraph
            body: >-
              Rebel Foods competes on more than one board at once, so the most important comparison is not
              brand-versus-brand but stack-versus-stack. The first class is direct Indian multi-brand cloud-kitchen
              peers such as Curefoods and EatClub/Box8, which also use delivery-first menus, standardized kitchens, and
              app-led demand capture. The second class is category specialists such as Biryani By Kilo and FreshMenu:
              they do not match Rebel's full cuisine span, but they can still win the same order mission by being more
              legible on premium biryani, freshly cooked global bowls, or health-oriented meals. The third class is
              omnichannel quick-service challengers like Wow! Momo, whose offline footprint and delivery presence create
              a different but still relevant substitute for urban convenience food. The fourth class is the real power
              center of the ecosystem: Swiggy and Zomato, which own the discovery surface, payments flow, and restaurant
              partner graph at Indian scale. The fifth class is global infrastructure or integrated-delivery analogs
              such as CloudKitchens, Kitopi, Wonder, DoorDash, Uber Eats, Deliveroo Editions, and Kitchen United. They
              matter because they show where value accrues when the category matures: either the kitchen operating
              system, the marketplace demand layer, or a tightly integrated hybrid of both.
