  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: 'Recommendation: the business is real, but the price support depends on which valuation anchor you trust'
        blocks:
          - type: paragraph
            body: >-
              Rebel Foods has enough operating substance to stay investable. The official site still presents the
              company as the world's largest chain of internet restaurants, and management-backed public reporting says
              the platform spans more than 450 kitchens across 70-plus cities while running a broad portfolio of owned
              brands, Wendy's franchise operations, and the EatSure consumer app. FY24 was also directionally better:
              revenue rose to ₹1,420 crore, losses narrowed to ₹378 crore, and public reporting says monthly burn
              roughly halved as management tightened costs. Those facts explain why Temasek and Evolvence could still
              back a $210 million round in December 2024.

              The valuation problem is that the live private-market anchor is much weaker than the headline funding
              round. Bloomberg-style coverage of the Series G round used a $1.4 billion valuation, but other reporting
              around the same period pointed to a $1.0 billion mark, a $750 million deal-level valuation, and then a
              KKR-linked secondary range around $800 million to $860 million. A mostly-secondary round can still be
              useful price discovery, but it is not the same thing as new-money demand chasing a higher mark. The
              investment conclusion should therefore be evidence-sensitive and price-sensitive: research-more / track at
              the old unicorn mark, and only consider a firmer underwriting stance near the verified late-2024 secondary
              band after private diligence closes the disclosure gap.
