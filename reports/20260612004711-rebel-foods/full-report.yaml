        blocks:
          - type: callout
            title: Secondary price beats headline price as the real underwriting anchor
            body: >-
              The KKR / late-2024 secondary band is the most credible live valuation signal in public evidence. Treat
              the old $1.4 billion mark as an optimistic historical headline, not as the base case.
            calloutType: recommendation
            claimRefs:
              - CV006
              - CV018
              - CV049
          - type: callout
            title: Disclosure is the main reason this is not a buy
            body: >-
              Rebel may deserve a premium to weaker delivery peers, but it has not yet earned a DoorDash-like multiple
              because investors still cannot inspect audited post-FY24 financials, the cap table, or an IPO-ready filing
              set.
            calloutType: risk
            claimRefs:
              - CV044
              - CV045
              - CV047
              - CV048
          - type: callout
            title: Bull case needs both better economics and better evidence
            body: >-
              A return toward the old unicorn valuation requires more than category growth. It requires brand-level
              profitability proof, portfolio clean-up, and a public-exit path willing to reward those results.
            calloutType: assumption
            claimRefs:
              - CV024
              - CV025
              - CV050
