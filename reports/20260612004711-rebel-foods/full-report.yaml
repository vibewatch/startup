  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              Rebel Foods should not be framed as a play on all Indian foodservice spend. The official company materials
              position Rebel as an internet-restaurant operator that matches brands to recurring meal missions such as
              lunch, dinner, snacks, and group occasions, and its current format now spans delivery-first brands, food
              courts, and dine-in-plus-cloud-kitchen franchise bundles. That means the core boundary is digitally
              ordered, branded, off-premise meal demand and the supply infrastructure that serves it. The boundary can
              stretch outward into chain-led QSR and hybrid food-court formats, but it should not absorb the entire
              dine-in, full-service, or independent-restaurant universe just because all of those businesses sell food.


              The excluded categories matter as much as the included ones. Home cooking, untracked offline neighborhood
              ordering, dine-in-led full-service spend, and grocery or quick-commerce baskets are all important
              substitutes, but they are not Rebel's core addressable spend unless they migrate into repeat app-led
              ordering occasions. Fortune's broader foodservice dataset reinforces that point: India remains heavily
              dine-in and full-service, so Rebel's opportunity is a fast-growing subset rather than the whole category.
              Put differently, Rebel competes first for digitally mediated meal occasions, not for every rupee Indian
              households spend on eating.
            claimRefs:
              - CM003
              - CM004
              - CM006
              - CM046
              - CM049
