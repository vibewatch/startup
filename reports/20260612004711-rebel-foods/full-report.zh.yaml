      - - 市场平台存在感作为增长加速器
        - 平台佣金、广告和排序逻辑可能压缩利润率，或把需求导向竞争对手
        - 高
        - 按品牌和城市收集实际抽成率、广告 ROI 和排序敏感性
      - - 云厨房基础设施作为护城河
