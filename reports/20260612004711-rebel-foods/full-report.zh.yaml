      - number: '2.3'
        title: 买方分层、预算所有者与采用路径
        blocks:
          - type: paragraph
            body: >-
              Rebel
              的买方地图由消费者驱动，而不是由采购驱动，但分层方式仍会影响估值。用户通常是个人食客或家庭，但付款人和预算所有者会随场景变化：工作日单人订单由使用个人钱包的年轻白领或学生控制；家庭和分享订单转向家庭预算所有者；办公室订单可能报销或集中审批。Rebel
              自己的用餐任务框架支持这种按场景分层，第三方市场报告也把城市白领、学生和家庭描述为核心外卖人群。


              采用路径现在高度由应用媒介化。IMARC 称移动应用占市场的 79%，消费者基础建立在印度 1.03 billion 互联网用户和 1.06 billion
              移动连接之上。数字支付基础设施降低结账摩擦，聚合平台仍主导发现，因此买方旅程往往从饥饿场景出发，进入聚合平台应用，再到品牌选择、数字支付和复购。因此，Rebel
              最重要的预算所有者问题不是企业采购，而是在同一需求流向独立餐厅、家庭烹饪或竞品平台推广品牌之前，公司能从城市、数字连接、追求便利的家庭中捕获每个用餐任务的多少份额。
