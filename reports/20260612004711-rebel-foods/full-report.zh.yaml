        title: 融资历史、规模标记与未解决的估值算术
        blocks:
          - type: paragraph
            body: >-
              公开记录支持一条清晰的后期融资叙事，尽管并非每一类工具都能干净对账。Rebel 在 2021 年完成 Qatar Investment Authority 领投融资后成为独角兽，随后在 2024 年 12
              月又完成 Temasek 领投、Evolvence 参与的 $210 million Series G 轮。Entrackr 补充称，公司过去两年还通过五个批次筹集了近 $50 million
              债务。公开规模披露足以证明公司已有实质体量：FY24 收入达到 Rs 1,420 crore，亏损收窄至 Rs 378 crore，管理层已开始谈论 18 到 24 个月内 IPO、2029 年达到 800
              个厨房，以及更广泛的城市扩张。薄弱点在估值算术。ET Retail 和 Bloomberg 将 2024 年融资对应到 $1.4 billion 估值，而 Business Standard 另行报道的 KKR
              投资估算隐含估值区间低得多。这个差异足够重大，在审阅融资文件前，当前估值只能按中等置信度处理。
