            body: >-
              里程碑轨迹显示，Rebel 正从互联网餐厅规模转向混合平台，把自有品牌、合作品牌和线下存在混在一起。EatSure 2024 年推出团体点餐，以及 2026 年 Jammu
              智能美食广场，都用实体触点和多品牌结账强化了「应用里的美食广场」这一命题。Wendy's 现在是重要合作渠道：Wendy's 官方材料称，Rebel 不到 40 个月就在印度做到 200 个网点；2025
              年扩张报道也显示，该网络背后仍有持续资本开支。与此同时，公司仍在重塑品牌组合。围绕 Smoor 的报道表明，2022 年品牌聚合策略并没有转化为一致强劲的表现；到 2025 年 7 月，据报道 Rebel
              正在探索出售股权，同时关闭 Gurugram 和 Bengaluru 办公室，把团队整合到孟买。这并不推翻规模叙事，但意味着公司下一阶段同样关乎修剪组合和执行纪律，而不只是增长。
