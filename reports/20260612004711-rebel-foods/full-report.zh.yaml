  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接同行、聚合平台、替代品与全球类比
        blocks:
          - type: paragraph
            body: >-
              Rebel Foods 同时在不止一张棋盘上竞争，所以最重要的比较不是品牌对品牌，而是栈对栈。第一类是印度本土多品牌云厨房直接同行，如 Curefoods 和
              EatClub/Box8，它们也使用外卖优先菜单、标准化厨房和应用驱动的需求捕获。第二类是品类专家，如 Biryani By Kilo 和 FreshMenu：它们覆盖不了 Rebel
              的完整菜系跨度，但凭借更清晰的高端 biryani、新鲜现做全球碗餐或健康餐定位，仍能赢下同一用餐任务。第三类是 Wow! Momo
              这类全渠道快餐挑战者，其线下网点和外卖存在，为城市便利食品提供了不同但仍相关的替代。第四类是生态系统真正的权力中心：Swiggy 和
              Zomato，它们在印度规模上掌握发现界面、支付流和餐厅合作伙伴图谱。第五类是全球基础设施或一体化配送类比，如 CloudKitchens、Kitopi、Wonder、DoorDash、Uber
              Eats、Deliveroo Editions 和 Kitchen United。它们重要，是因为展示了品类成熟后价值会流向哪里：厨房操作系统、市场需求层，或两者紧密整合的混合体。
