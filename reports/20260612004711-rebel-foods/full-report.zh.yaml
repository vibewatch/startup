            - INR 150 crore NCDs，利率 13.9%；INR 687 crore 未结押记
            - 2025 年 3 月现金 INR 56 crore
        - id: what-it-implies
          label: 含义
          values:
            - 食品销售模式承担有意义的货品成本负担
            - 即使亏损收窄，厨房网络和公司层仍然昂贵
            - 促销纪律帮助利润率，但重新加大广告投放会抵消收益
            - 模式仍依赖有成本的外部资本
            - 只看账面现金，相对年度亏损和债务义务显得偏小
        - id: missing-proof
          label: 缺失证据
          values:
            - 库存周转、损耗和供应商账期
            - 按城市和品牌拆分的厨房利用率
            - CAC、回本周期、复购队列和直接下单占比
            - 契约、抵押品、摊还计划、贷款人救济
            - 不受限制现金、融资后余额和管理层现金跑道预测
