      - number: '3.3'
        title: 切换成本、锁定效应与真正可持续的东西
        blocks:
          - type: paragraph
            body: >-
              公开记录支持一个中等护城河，但不支持强锁定叙事。Rebel 的可持续层在运营内部：多品牌启动工具、加盟和 launcher
              方法论、厨房标准化，以及让一个实体厨房跨多个菜系和需求渠道保持产出的能力。这些资产可以提高加盟商、使用 launcher 的外部品牌，以及已经运行 Rebel
              工作流的内部团队的切换成本。但客户侧切换成本更弱。消费者几乎没有摩擦地在
              Swiggy、Zomato、EatSure、直营应用和线下连锁之间多栖；最热门的品类——pizza、biryani、wraps、bowls、小食和甜点——也已经有强替代。DoorDash、Uber Eats 和
              Deliveroo 的证据表明，忠诚度计划、需求聚合和商户工具，可能比任何一个厨房运营商的菜单宽度更耐久。因此，Rebel
              最强的位置，是厨房利用率、速度和跨品牌篮子设计最重要的地方；最弱的位置，是市场触达依赖租来的发现，或专家品牌能在窄用餐任务上定位更清晰的地方。
