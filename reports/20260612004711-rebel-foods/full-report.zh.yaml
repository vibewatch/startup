  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议：业务真实存在，但价格支撑取决于你信任哪一个估值锚
        blocks:
          - type: paragraph
            body: >-
              Rebel Foods 有足够运营实质，仍值得纳入可投资范围。官网仍把公司描述为全球最大的互联网餐厅连锁，管理层背书的公开报道称平台覆盖 70 多个城市、450 多个厨房，运营宽泛的自有品牌组合、Wendy's
              特许经营业务和 EatSure 消费者 App。FY24 的方向也更好：收入升至 ₹1,420 crore，亏损收窄至 ₹378 crore，公开报道称管理层收紧成本后月度 burn 大约减半。这些事实解释了
              Temasek 和 Evolvence 为什么仍能在 2024 年 12 月支持一轮 $210M 融资。

              估值问题在于，当前私募市场锚点比头条融资轮弱得多。关于 Series G 的 Bloomberg 风格报道使用了 $1.4B 估值，但同一时期的其他报道指向 $1.0B 标记、一笔交易层面的 $750M
              估值，随后又出现 KKR 相关二级交易约 $800M 至 $860M 的区间。以二级交易为主的轮次仍可提供有用的价格发现，但它不同于新钱追逐更高估值。投资结论因此应对证据和价格敏感：在旧独角兽估值上应继续研究 /
              观察；只有在私下尽调补上披露缺口之后，才应在经验证的 2024 年末二级交易区间附近考虑更坚定的承销立场。
