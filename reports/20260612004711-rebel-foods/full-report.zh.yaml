  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 方向
      - 什么会改变观点
    rows:
      - - Rebel 在自有品牌、EatSure 和 Wendy's 上仍有真实的消费者规模和品牌宽度。
        - 投资逻辑
        - 如果品牌层面的贡献和队列数据证明复购经济性强，投资理由会更扎实。
      - - FY24 的收入增长、亏损和烧钱速度都好于 FY23。
        - 投资逻辑
        - 如果 FY25 和 FY26 经审计报表确认改善延续，这轮修复才算可持续。
      - - KKR 老股交易区间可能比旧独角兽标题价更接近当前真实成交价。
        - 投资逻辑
        - 如果新一轮新股融资高于老股区间且条款干净，会验证更高估值。
      - - 同一家公司在同一大致时期内被描述为 $1.4B、$1.0B、$750M 和 $800-860M。
        - 反向逻辑
        - 对齐后的股权结构表、逐轮定价备忘录和当前优先股堆叠，会降低这种不确定性。
      - - 上市可比公司显示，在没有同等披露的情况下，Rebel 已被要求按接近或高于 Swiggy、DoorDash 的销售倍数交易。
        - 反向逻辑
        - 经审计的利润率质量、直接订餐证明和上市准备度，可以支撑更窄的披露折价。
      - - 持续重组和收购品牌表现疲弱说明，组合里并非每一块都值得拿到溢价资本。
        - 反向逻辑
        - 如果公司能证明已退出弱资产，并证明核心品牌贡献大部分利润，承销信心会提高。
    notes: 这些论点有意围绕估值展开。反向逻辑不是说 Rebel 没有业务，而是说现有证据太薄，撑不起不看价格的乐观情景。
