        - Rebel 值得继续尽调，但不能只凭公开证据承销旧独角兽价格。
      - - 信心
        - 中
        - 经营牵引力真实存在，但公开估值记录和披露材料彼此不一致。
      - - 风险评级
        - 高
        - 如果经审计增长、利润率或融资条款不及预期，进一步减记很容易成立。
      - - 估值立场
        - 偏高
        - 即便按 2024 年末老股交易区间，隐含倍数也高于多数上市食品配送同业。
      - - 入场纪律
        - 先看老股区间，不看新股标题价
        - 尽调起点应放在已验证的 KKR $800M-$860M 区间或更低，而不是较早的 $1.4B 锚点。
      - - 持有 / 退出姿态
        - 只有披露改善，才适合持有 3-5 年
        - 真正上行需要经审计证明、更干净的股权结构条款，以及可信的 IPO / 退出路径。
    notes: 这项判断对价格敏感。「偏高」不是说 Rebel 没有产品或品牌价值，而是说在披露有限时，现有公开证据不足以支撑支付高溢价的私人市场倍数。
