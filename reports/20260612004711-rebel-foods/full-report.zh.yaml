        blocks:
          - type: paragraph
            body: >-
              对 Rebel 最干净的公开估值测试，是收入倍数比较，而不是 DCF。公司没有公开 IPO 文件，没有经审计的 FY25 或 FY26 财务包，没有股权结构表 / 清算瀑布披露，也没有品牌层面 EBITDA
              桥能支持精确估值。在这组有限证据下，关键问题是 Rebel 当前可观察到的私募估值，低于、等于还是高于公开食品配送和食品商业投资者已经为披露更充分的公司支付的价格。

              答案并不舒服。DoorDash 约按 4.6x 销售额交易，是这组公司里清晰的高质量上限；它还附带上市公司报告、正向调整后盈利和深厚流动性。Swiggy 上市后约按 FY26 收入 2.7x
              筛选，仍有显著亏损。Delivery Hero、Deliveroo 和 Just Eat Takeaway 都大致落在约 1.0x 到 1.4x 收入。Rebel 2024 年末 KKR 二级交易区间约
              ₹6,800 crore 至 ₹7,315 crore，意味着约 4.8x 至 5.2x 的 FY24 往绩收入倍数，高于 Swiggy、Delivery Hero、Deliveroo 和 Just
              Eat，只略高于 DoorDash 的公开倍数。如果 Rebel 能提供 DoorDash
              式增长转化、经审计经济性和披露，这或许可以辩护。今天的公开证据没有显示这些条件，因此当前私募要价仍显偏高，而不是显然有吸引力。
