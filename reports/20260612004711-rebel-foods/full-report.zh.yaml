      - number: '7.2'
        title: 监管、法律与食品安全敞口
        blocks:
          - type: paragraph
            body: >-
              Rebel 处在印度一套密集且对外卖优先食品品牌尤其严苛的合规体系中。FSSAI
              框架不是单一许可证义务，而是一揽子许可、召回、广告、包装、审计和标签规则，叠加地方市政执法。共享厨房、多品牌运营之所以重要，是因为一次卫生或标签失误可能变成跨品牌信任事件。Rebel
              自己的公开记录说明这不是抽象风险：Telangana High Court 命令确认，GHMC 曾在 2019 年向海得拉巴一处场地发出关闭通知并实际查封卷帘门；公司提起的 writ 又在 2026 年 4
              月因未推进诉讼被驳回。法院记录还显示围绕供应商付款和 SARFAESI 相关场地占有的商业纠纷，说明法律尾部不止食品监管。合规面还更宽：Rebel
              隐私政策确认公司广泛收集用户数据，与配送伙伴和政府机构共享数据，并把数据存储在印度境外的 AWS
              上；一旦食品安全事件伴随数据泄露、误导性宣传或投诉处理失败，就会多出一条监管向量。零工和工资立法并不以完全相同方式适用于 Rebel 与
              Swiggy、Zomato，但它们会塑造配送伙伴和厨房用工周边的劳动力成本环境，因此仍会影响系统经济性。
