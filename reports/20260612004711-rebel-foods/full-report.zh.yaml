      - number: '3.2'
        title: 能力、定价界面与分销权力
        blocks:
          - type: paragraph
            body: >-
              Rebel 有文件支撑的最强优势，是从同一个厨房基座延展出的宽度：它可以运营覆盖 pizza、biryani、wraps、bowls、甜点和合作品牌的组合，并通过 Rebel OS、EatSure
              和市场渠道路由这些品牌。这比 BBK 或 FreshMenu 这类单主题专家更宽，但宽度不等于需求所有权。Swiggy 和 Zomato 的公开披露远比 EatSure
              丰富，显示数百万交易用户、数十万餐厅合作伙伴和巨量订单。这个不对称很重要，因为商业界面往往由聚合平台设定，而不是由厨房运营商设定。DoorDash 公开发布的 15%、25% 和 30%
              方案，是观察分销平台如何包装覆盖、可见性和会员触达的有用全球基准。Deliveroo Editions、Uber Eats 和 DoorDash 都把获客、覆盖扩张和运营工具强调为卖给商户的产品。对 Rebel
              的含义是：它可以通过厨房利用率和菜单组合改善单位经济性，但只要客户是在 Swiggy 或 Zomato 上被获取，公司就不能完全控制上市路径。
