          - type: callout
            title: 乐观情景既需要更好的经济性，也需要更好的证据
            body: 估值回到旧独角兽水平，不只需要品类增长。还需要品牌层面盈利证明、组合清理，以及一条愿意奖励这些结果的公开退出路径。
            calloutType: assumption
            claimRefs:
