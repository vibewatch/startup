  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: Rebel 的推荐结论一边来自真实运营规模和改善中的 FY24 财务，另一边则被容易折价的私募市场信号和较大的披露折扣抵消。
