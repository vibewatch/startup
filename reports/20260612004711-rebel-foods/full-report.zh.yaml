      - number: '2.2'
        title: 规模测算视角与相互矛盾的市场估计
        blocks:
          - type: paragraph
            body: >-
              公开规模证据支持多种视角，而不是一个干净的 TAM。最宽的外部边界是印度餐饮服务，Fortune 给出的 2026 年规模为 USD 126.43 billion。更可比的店外消费邻近市场是印度
              QSR，Mordor 估计 2026 年为 USD 30.37 billion。最窄的特定形态视角是云厨房：ETRetail 引用 Wazir Advisors 的预测，称该市场将从 FY22 的 USD 800
              million 增至 FY26 的 USD 1.9 billion；IMARC 则称该细分市场 2025 年达到 USD 1.24 billion，并可在 2034 年增至 USD 3.69
              billion。这些估计方向一致：纯外卖厨房已具备意义，但仍远小于整体餐饮服务。


              最棘手的矛盾在在线食品配送内部。Renub 和 Research and Markets 发布的 2025 年估计为 USD 46.34 billion，IMARC 发布的是 USD 55.58
              billion，Expert Market Research 发布的是 USD 61.19 billion。与此同时，Technavio 只把 2025 年印度食品配送市场放在 USD 734.2
              million。这个跨度过大，不能简单视作预测噪声。它几乎肯定反映了不同分子：高端是偏宽的 GMV
              式生态系统价值，低端是窄得多的收入或服务市场口径。对尽调而言，这个矛盾有用而不尴尬，因为它迫使投资人区分总数字点餐流水，以及 Rebel Foods 这类运营商真正可货币化的收入池。
