      - number: '8.4'
        title: 退出准备度与最终尽调：门槛变量是披露，而不是知名度
        blocks:
          - type: paragraph
            body: >-
              最后的投资问题不是 Rebel 有没有品牌、厨房或消费者需求，而是投资者能否足够清楚地看见头条之下的东西，从而承销当前价格。DoorDash、Delivery Hero、Just Eat
              Takeaway、Deliveroo 和 Swiggy 等公开同业都有投资者关系和年报基础设施，让投资者检查收入质量、风险因素和资本结构。Rebel 今天没有同等公开记录。

              这个缺口重要，因为未解决事项正是决定私募交易真实回报结果的因素：以二级交易为主的轮次之后，当前股权结构表和清算优先栈是什么；经审计的 FY25/FY26 财务；核心品牌与被收购品牌的盈利能力；EatSure
              的单元经济；Wendy's 的贡献；下一次融资或 IPO 流程会验证还是反驳 2024 年末二级交易标记。在这些文件可得之前，最可辩护的姿态是有纪律的好奇，而不是确信。保持跟踪公司，围绕 2024
              年末二级交易区间或更低价格锚定谈判；只有管理层能把叙事转化为可达申报文件级别的证据，才值得上调判断。
            claimRefs:
