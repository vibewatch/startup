      - number: '2.5'
        title: 承销含义与剩余尽调缺口
        blocks:
          - type: paragraph
            body: >-
              正确的承销姿态是有纪律的乐观。公开数据清楚支持 Rebel
              处在一个规模大、仍在增长的数字食品市场中，但证据也显示，市场会因定义不同而被高估或低估。最干净的实务视角，不是「全部餐饮服务」，甚至也不是每一个已发布的在线配送估计，而是城市和越来越多二线走廊里的重复数字用餐场景；在那里，移动应用、在线支付和聚合平台发现已经塑造行为。云厨房切片是最好的纯形态代理，但它低估了
              Rebel 现在通过美食广场、加盟的堂食加云厨房形态以及合作品牌使用的混合路径。


              公开证据仍无法证明的是 Rebel 对该需求的真实可服务市场和经济份额。公司不公开订单频率、平均订单价值、按品牌贡献利润率、直接订单与聚合平台组合，或城市层级生产率。没有这些指标，任何精确的 SAM 或 SOM
              模型都只是一个假设堆，而不是已验证事实。因此，投资人应刻意保留相互矛盾的市场估计，把它们用作边界校验，并把现场尽调重点放在队列级复购行为、渠道结构和厨房生产率上，而不是一个巨大的头部 TAM。
            claimRefs:
              - CM016
              - CM040
              - CM050
              - CM051
              - CM052
