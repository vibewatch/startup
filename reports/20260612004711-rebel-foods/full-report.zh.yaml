      - number: '5.2'
        title: EatSure 客户界面：控制平面组合多品牌点餐、追踪、支持与忠诚度
        blocks:
          - type: paragraph
            body: >-
              EatSure 更应被理解为 Rebel 面向客户的控制平面，而不是普通食品点餐应用。当前官网和 FAQ 强调一笔订单横跨多家餐厅；Google Play 和 App Store 则描述可跨 15+
              个品牌无缝下单、实时追踪、忠诚度或钱包机制、首单促销、客服和多种支付方式。FAQ 加上了运营上重要的工作流细节：订单确认后发送给餐厅，由对应餐厅的配送员履约；客户可以添加备注或在 My Orders
              中追踪进度；Virtual Surebot Cookie
              处理取消和投诉。这形成了比薄市场前端更紧的工作流闭环：菜单发现、跨品牌篮子创建、订单确认、厨房执行、骑手沟通、退款或钱包处理、复购，都在同一界面上。客户承诺因此是便利加信任，但产品风险也被集中起来，因为延迟、退款和客服故障直接暴露在
              EatSure 界面里，而不是藏在第三方市场平台后面。
