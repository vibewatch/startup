  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - FY24 后经审计财务
        - FY25 和 FY26 经审计收入、毛利率、EBITDA、现金消耗和现金余额桥
        - FY24 的改善令人鼓舞，但估值判断取决于 2024 年融资后趋势是否延续。
        - 索取经审计报表和管理层桥表；与 ROC 申报和董事会批准账目核对。
      - - 股权结构表和优先股堆叠
        - 当前持股、清算优先权、棘轮条款、ESOP 稀释，以及以老股为主的 2024 年融资条款
        - 如果优先股堆叠很重，私人交易的回报结果可能与标题估值大幅不同。
        - 谈判入场价格前，取得律师审阅过的股权结构表和融资文件。
      - - 品牌层面单位经济性
        - 按 Behrouz、Faasos、Oven Story、EatSure、Wendy's 和收购品牌拆分的收入、贡献利润率和复购率
        - 没有品牌结构，投资者无法判断增长来自可持续的核心品牌，还是来自吃资本的长尾资产。
        - 向财务和运营团队索取分部 / 品牌层面仪表盘和队列数据。
      - - 渠道结构和客户所有权
        - 市场平台订单、EatSure / 直接订单、线下 / 全渠道销售和 Wendy's 履约经济性的拆分
        - 如果第三方平台拿走太多利润和客户数据，品牌总需求的价值会打折。
        - 核查直接订单占比、留存曲线、CAC / 回本周期和市场平台佣金率。
      - - 重组和组合计划
        - Smoor 战略、外部品牌资本计划，以及关停或扩张品牌的明确标准
        - 公开记录已经显示，IPO 前存在办公室关闭和品牌精简压力。
        - 核查有关组合配置、关停决策和收购品牌表现的董事会材料。
      - - 退出准备和 IPO 材料包
        - 申报时间表、治理升级、风险因素材料和公开股票承销银行反馈
        - Rebel 如果真正已准备 IPO，和只是有 IPO 愿望，投资逻辑会显著不同。
        - 向承销团银行或管理层询问准备工作流、草稿材料和治理行动清单。
    notes: 这些是把 Rebel 从有趣故事变成可承销私人估值所需的最低尽调要求。若公司无法提供，建议应维持在继续研究 / 观察。
