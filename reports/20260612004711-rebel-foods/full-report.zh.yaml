  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入架构与公开牵引力
        blocks:
          - type: paragraph
            body: >-
              从财务上看，Rebel Foods 更像多品牌食品运营商，而不是软件公司。FY24 和 FY25 的公开报道反复显示，公司几乎全部经营收入仍来自食品销售，而不是软件、订阅或其他高毛利经常性收入线。Entrackr
              把食品销售占比列为 FY24 经营收入的 96.7%、FY25 经营收入的
              97%；服务、佣金、配送、特许权使用费和其他费用等较小附属收入线可见，但没有在干净分部注释中披露到实质程度。这很重要，因为收入质量在运营上真实，但结构性利润率低于 SaaS
              式业务，也意味着承销更依赖厨房吞吐、订单组合和采购纪律，而不是纯软件货币化。


              面向公众的商业界面也强化了这一判断。EatSure 被定位为 Rebel
              的直营点单「应用内美食广场」，让客户在一笔订单里组合多家餐厅；品牌落地页则推动首单折扣、免配送费门槛、团体点餐激励等促销。这些页面证明了需求捕获和直营订单意图，但不揭示优惠券、取消、退款或聚合平台佣金后的实际定价。加盟页面给出了一个硬
              B2B 价格点——完整加盟费和押金之前需支付 INR 10 lakh LoI 款项——但即便如此，完整经济栈仍然保密。Rebel Launcher 同样证明了合作品牌扩张能力，但不证明其抽成率。


              规模已经不再是主要公开问题。Rebel 称其在 70+ 个城市和 10 个国家，通过 450+ 个厨房运营 4,000+ 家互联网餐厅；媒体报道则把当前足迹放在超过 450 个云厨房、包括 75
              个印度城市。Financial Express 也说明了为什么单靠规模不够：Rebel 正在追求一个混合网络，由云厨房、EatSure
              美食广场、公司运营门店、加盟门店和合作品牌扩张构成，因为直接需求捕获和多形态密度会影响利润率改善。因此，核心尽调任务不是证明网络存在，而是证明网络哪一部分真正创造有吸引力的贡献利润。
