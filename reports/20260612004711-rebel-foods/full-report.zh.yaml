companyProfile:
  summary: >-
    Rebel Foods 是一家总部位于孟买、成立于 2011 年的食品科技公司，在印度率先把云厨房 / 互联网餐厅模式做出规模。公司运营一组数字优先的食品品牌，经营 EatSure 这个多品牌点餐层，也管理 Wendy's
    India 线上外卖等授权或合作模式，并越来越多通过美食广场、线下门店以及 Rebel Launcher
    的品牌启动基础设施推进全渠道形态。公开证据支持其规模、品牌宽度和持续投资人关注度，但也显示公司仍在平台依赖、运营复杂度和私人公司披露不完整之间找平衡。
