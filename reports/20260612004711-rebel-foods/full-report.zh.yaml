  - id: TP003
    title: 定价 / 打包对比
    columns:
      - 运营商 / 类别
      - 公开价格或抽佣表面
      - 包含能力
      - 直接下单或忠诚度钩子
      - 公开未知项
      - 含义
    rows:
      - - Rebel / EatSure
        - 面向消费者的 App 承诺多品牌点餐且不加收配送费；实际抽佣率未披露
        - 多品牌点餐、厨房路由、组合交叉销售
        - EatSure 的购物篮便利和可信品牌分组
        - 当前直接订单占比、实际折扣和贡献利润率未公开
        - 有利于做大购物篮，但公开证据还没有证明其在平台规模上拥有独立需求护城河
      - - EatClub / Box8
        - 以价值感切入外卖定位；未保留公开佣金表
        - 在主要大城市用单一 App 承接自有品牌点单
        - 以 App 驱动优惠和便利性定位
        - 规模、贡献利润率和确切获客组合不透明
        - 便利性和价值感有竞争力，但保留证据显示其基础设施深度弱于 Rebel
      - - FreshMenu
        - 日常定价和每周菜单轮换，而非披露佣金
        - 现点现做的全球风味碗餐
        - 菜单新鲜感和高端定位
        - 当前网络规模以及直营与平台混合比例未在保留证据中公开
        - 菜系差异化更强，分销经济性差异化较弱
      - - BBK
        - 高端 handi biryani，承诺下单后现做并在 70-90 分钟送达
        - 专门菜单，堂食加线上外卖
        - 品类权威和高端场景价值
        - 没有当前平台佣金或会员经济性的公开清单
        - 单一用餐任务品牌强，但不是跨品类的广谱栈替代品
      - - Swiggy / Zomato 市场平台
        - 公开文件显示规模和商户入驻能力；全球可比平台显示佣金和广告界面可能相当重要
        - 发现、物流、促销、支付、评分和商户工具
        - 大流量池和跨服务生态
        - 谈判条款、广告投放效率和商户层面的实际抽成率仍属私密
        - 分销权力可能吸走品类经济性中的很大一块
      - - DoorDash / Uber / Deliveroo 可比平台
        - DoorDash 发布 15%、25%、30% 套餐；Uber 和 Deliveroo 将需求与工具或仅配送站点打包
        - 市场平台需求、广告工具、会员权益、直营点单工具，或交钥匙厨房扩张
        - DashPass、Uber 商户工具、Editions 扩张套餐
        - 印度特定经济性不能与美国 / 英国模型一一对应
        - 证明平台主导的打包方式可以变成面向商户的主导商业界面
    notes: 本表比较公开商业界面，不比较真实实现的商户经济性。多数印度运营商不披露合同层面的抽成率或广告投放强度。
