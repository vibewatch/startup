      - 规模 / 融资
      - 目标客群
      - 差异化
      - 局限
    rows:
      - - Rebel Foods
        - 直营多品牌互联网餐厅运营商
        - 70+ 城市有 450+ 间厨房；2024/25 公开报道显示以 $1.4B 估值融资 $210M
        - 城市餐饮配送买家，以及需要多菜系覆盖的合作品牌
        - Rebel OS、EatSure、启动 / 加盟工具，用一套厨房底座承载宽菜系组合
        - 自有需求透明度低于平台规模；公开证据更能证明运营能力，而不是留存或定价权
      - - Curefoods / EatFit
        - 直营多品牌餐饮品牌集团
        - 留存公开材料显示 EatFit 是 Curefoods 品牌，Curefoods 将 Cakezone Foodtech 和 Fan Hospitality 列为重要子公司
        - 健康导向和主流城市餐饮配送用户
        - 品牌集团结构覆盖健康餐、甜品 / 餐厅子公司
        - 留存公开材料没有清楚披露当前集团整体厨房数和已兑现经济模型
      - - EatClub / Box8
        - 直营性价比配送同业
        - EatClub 将自己定位为配送 App；Box8 公开服务印度主要大都市
        - 追求性价比的城市办公室和家庭配送订单
        - App 引导下单，并在印度家常餐上拥有强城市覆盖
        - 留存官网页面披露的门店数、融资和直接订单结构，少于 Rebel 或公开市场聚合平台
      - - FreshMenu
        - 高端邻近替代品
        - 归档的 2026 年网站称有 7M+ 顾客，并提供每周轮换的全球碗餐菜单
        - 寻找高端、现点现做全球餐食的城市职场人
        - 菜系定位鲜明、日常定价明确，而不是巨型平台式海量供给
        - 品类宽度更窄，且规模化厨房网络护城河证据更少
      - - Biryani By Kilo
        - 品类专家和全渠道替代品
        - 29+ 城市有 70+ 家堂食门店；Devyani 的收购兴趣凸显其战略价值
        - 高端 biryani 和 kebab 需求场景
        - 下单后烹制的 handi biryani、高端品类权威、堂食加配送
        - 用餐任务远窄于 Rebel 的组合，并集中在 biryani 场景
      - - Wow! Momo / Wow! China
        - 全渠道 QSR 挑战者
        - FY2025-26 新开 200 家后，在 90+ 城市拥有 850+ 家门店
        - 冲动消费、零食、QSR 和配送场景
        - 线下规模、高频品牌记忆和多品牌扩张
        - 不是同口径云厨房栈；重门店模型的资本和人工结构不同
      - - Swiggy + Zomato
        - 平台分发既有玩家
        - Swiggy 在 2025 年 12 月季度的餐饮配送 GOV 为 INR 8,959 crore；Zomato FY25 餐饮配送 NOV 为 INR 32,862 crore，平均餐厅合作伙伴 297k
        - 寻求需求、物流和曝光的餐厅与云厨房
        - 在印度规模上掌握发现、支付、促销和消费者流量
        - 平台租用而非拥有厨房侧差异化，因此商户仍可多平台经营
      - - CloudKitchens / Kitopi / Wonder
        - 全球基础设施和一体化配送类比对象
        - CloudKitchens 称有 600+ 个品牌；Kitopi 称在 7 个国家有 200+ 个网点；Wonder 加入 Grubhub 以获得全国分发
        - 希望低资本开支扩张或获得一体化用餐时段分发的品牌
        - 展示价值如何迁移到厨房基础设施或打包需求
        - 目前不是印度直接既有玩家，但能提示护城河力量可能向哪里集中
    notes: 画像行混合了公开规模、融资和运营代理指标，因为多数厨房运营商没有完整披露私有利用率、留存和利润率。
