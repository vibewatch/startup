  - id: TV005
    title: 投资逻辑破裂和否决触发项表
    columns:
      - 触发项
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 新融资重置
        - 任何定价轮或大额老股交易低于 ~$700M 股权价值
        - 证明连 2024 年末老股锚点都过于乐观，并提高稀释 / 优先权风险。
        - 除非条款明确给出补偿，否则立场应从继续研究转向回避。
      - - 经审计增长和利润率不及预期
        - FY25/FY26 经审计收入增长停滞，同时 EBITDA 或烧钱速度没有实质改善
        - 打破 FY24 是持久经营杠杆起点的论点。
        - 按更低倍数区间重新承销，靠近 Swiggy / Deliveroo / JET 可比对象。
      - - 组合拖累持续
        - 更多关店、办公室整合，或证据显示收购 / 外部品牌继续亏钱
        - 说明资本仍困在非核心资产里，品牌聚合器逻辑无法自我供血。
        - 在支付高于 KKR 区间的价格前，要求先清理组合。
      - - 缺少直接订餐 / 全渠道证明
        - 没有证据表明线下、Wendy's、EatSure 或直接订餐能实质改善利润捕获
        - Rebel 仍暴露在第三方平台费用和低客户所有权之下。
        - 等到渠道结构证据出现后，再考虑溢价倍数。
      - - IPO 准备停滞
        - 下一个流动性窗口前，没有公开草稿申报、审计包或治理升级
        - 降低公开市场退出验证当前私人估值的信心。
        - 把 Rebel 视为退出时间不确定的私人持仓，而不是临近 IPO 故事。
    notes: 这些触发项是投资者定义的监测阈值，目的是把估值争论转成可观察事件，一旦发生就必须调整建议。
    claimRefs:
