        - id: comp
          label: 上市可比公司测试
          detail: KKR 区间倍数高于 Swiggy、Delivery Hero、Deliveroo 和 Just Eat，接近 DoorDash。
        - id: disclosure
          label: 披露缺口
          detail: 没有公开 FY25/FY26 审计、没有股权结构表 / 优先权披露，也没有 IPO 申请稿。
        - id: call
          label: 推荐结论
