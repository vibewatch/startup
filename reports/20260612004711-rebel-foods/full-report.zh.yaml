      - number: '3.4'
        title: 全球类比与反向证据
        blocks:
          - type: paragraph
            body: >-
              全球可比公司让风险判断更锋利。CloudKitchens 和 Kitopi 展示了一条路径：拥有实体和软件层，让许多品牌以更低资本扩张。Wonder
              展示了另一条路径：把自有概念和大型配送网络结合起来，让需求和食品生产更靠近。最重要的反例是 REEF。它从亏损的幽灵厨房撤退，转向授权 Reef
              OS，这是反向证据，说明如果利用率和合规守不住，纯外卖产能本身不是护城河。这个教训可直接迁移到印度。行业增长很快，数字支付持续扩张，外卖聚合平台仍然强势，但快速市场增长并不保证运营商层面的防御力。因此，评估
              Rebel 时，不应把它当成泛泛的「云厨房领导者」，而应把它看作一个厨房操作系统：它试图在市场平台、全渠道连锁和基础设施型进入者压缩品牌层剩余价值之前，把宽度转化为可持续经济性。
