      - number: '7.4'
        title: 财务、执行与扩张风险
        blocks:
          - type: paragraph
            body: >-
              Rebel 的财务故事在 FY24 明显改善，但它仍是一张风险清单，不是已经解决的案例。ET 报道收入增长、亏损减少
              42%，得益于广告和员工开支强度下降；但同一篇文章也提醒，食用油、小麦和蔬菜通胀仍压迫利润率，而且难以转嫁。这种脆弱性解释了融资节奏：多家媒体报道 Temasek 领投的 $210M Series G
              轮，随后又有 QIA 资本支持全渠道扩张；另一个 KKR 流程则通过一份涉及股权和 CCPS 的 CCI 文件，被报道为估值低得多的
              $800-860M。含义不是迫在眉睫的困境，而是公司在推进更重资本的形态时明显依赖持续的投资者信心：160 家 Wendy's 门店、7 个线下美食广场、计划在 200 个城市开 800 个厨房，以及长期
              1,000+ 个点位和 250-300 家 Oven Story 门店的野心。国际执行风险叠在这套组合之上。Rebel 公开称业务覆盖印度、西亚、UAE 和
              UK，可靠性较低的来源则指向很大的员工数和订单量。战略逻辑可以理解，但并行动作越多，管理层注意力被稀释、营运资金吃紧或本地化表现不佳的概率就越高，也越可能拖慢从单店层面盈利主张到耐久合并现金生成的路径。
