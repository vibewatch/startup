chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、模式与公开足迹
        blocks:
          - type: paragraph
            body: >-
              Rebel 现有官方材料支撑的公司身份，已经宽于「云厨房初创公司」这个简称。官网把它描述为一家全球互联网餐厅连锁，由一套用于启动和扩张品牌的运营系统驱动；What We Do
              则把公司定位为多品牌方案，用不同品牌回答消费者不同的「用餐任务」。EatSure 加上了消费者界面，把这套运营栈变成多餐厅点餐产品；当前公开扩张材料也显示，Rebel
              不只使用纯外卖厨房，还在使用加盟和合作渠道。主要保留意见在于，当前规模披露内部并不统一。Who We Are 页面写的是 70+ 个城市、10 个国家，What We Do 写的是 75 个城市、3
              个国家。2024-2025 年独立报道也在 4,000 到 5,000 家互联网餐厅之间切换。因此，报告后续可复用的结论应是方向性而非绝对数：Rebel 是一个拥有 450+
              个厨房、具备实质多品牌触达的大型后期食品平台，但精确公开足迹仍需要管理层材料校准。
