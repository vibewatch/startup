        title: 图表
        blocks:
          - type: callout
            title: 二级价格比头条价格更适合作为真实承销锚
            body: KKR / 2024 年末二级交易区间，是公开证据中最可信的当前估值信号。应把旧 $1.4B 标记视为乐观的历史头条，而不是基准情景。
            calloutType: recommendation
            claimRefs:
              - CV006
              - CV018
              - CV049
          - type: callout
            title: 披露是它不能被评为买入的主因
            body: Rebel 也许应相对较弱配送同业享有溢价，但还没有赢得 DoorDash 式倍数，因为投资者仍无法查看经审计的 FY24 后财务、股权结构表或 IPO 就绪的申报文件包。
            calloutType: risk
            claimRefs:
              - CV044
              - CV045
              - CV047
