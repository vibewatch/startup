  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 核心自有品牌继续复合增长，全渠道扩张跑通，组合精简降低拖累，经审计数字显示 EBITDA 进展足以重新打开 IPO 兴趣。
        - 公允价值约 ₹9,000-11,500 crore；这开始重建通往旧独角兽叙事的路径，但仍需要私人市场给出溢价倍数。
        - 需要清晰的品牌层面盈利能力、更干净的披露，以及没有新的融资重置。
        - 中低
      - - 基准
        - 收入增长仍然可观，烧钱纪律大体守住，但上市市场投资者仍会因私营公司的不透明要求显著折价。
        - 公允价值约 ₹6,500-8,000 crore，中心接近 2024 年末 KKR 老股交易区间；除非披露改善，否则相对该区间的上行有限。
        - 公司不错，但如果价格高于老股锚点，安全边际有限。
        - 中高
      - - 悲观
        - 增长或品牌盈利能力不及预期，收购品牌亏损继续吃掉资本，市场倍数压缩到 Swiggy / Deliveroo / Just Eat / Delivery Hero 区间。
        - 公允价值约 ₹4,500-6,000 crore；即便消费者需求没有崩塌，再次减记也说得通。
        - 披露仍然薄弱，而市场不再愿意给一家私营运营商支付 DoorDash 式倍数。
        - 中
      - - 可观察私人市场锚点
        - 最可靠的已验证实时市场读数，是 2024 年末 KKR / 老股交易区间，而不是更早的新股标题价。
        - 隐含价值 ₹6,800-7,315 crore；可作为谈判锚点，但不能证明价格便宜。
        - 老股交易可能对条款敏感，也不会披露完整优先股堆叠。
        - 当前
    notes: 情景区间是分析师估算，基于 Rebel 最后一份公开 FY24 收入基数、上市同业倍数，以及有记录的 2024 年末私人市场估值锚点。它们不是管理层指引。
