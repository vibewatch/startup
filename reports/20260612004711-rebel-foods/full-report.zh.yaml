  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 多品牌厨房栈：Rebel 卖的是共享运营模式，不是孤立餐厅应用
        blocks:
          - type: paragraph
            body: >-
              Rebel Foods 自有界面一贯把公司描述为厨房加软件系统，用共享资产生产和分发许多用餐场景。官网称 Rebel 是全球最大的互联网餐厅连锁，由一套用于在全球打造和扩张品牌的操作系统驱动；What We Do
              和 Who We Are 页面则明确写出架构：一个厨房、多个品牌；按场景设计组合；基于微服务的多渠道点餐；专利机器；以及意在跨厨房标准化产出的自动化。这很重要，因为产品不只是作为独立餐厅品牌的
              Faasos、Behrouz 或 Oven Story。真正的产品，是资产共享逻辑：让 Rebel
              把品牌映射到餐食，把餐食映射到厨房产线，并跨多个需求任务复用人力、硬件、菜单和配送轨道。公开证据最强之处，是这套栈确实存在且品牌组合很宽；较弱之处，是单元级采用或逐品牌经济性。因此，投资人应把厨房运营模式视为真实存在，但在利用率和利润率质量上仍部分黑箱。
