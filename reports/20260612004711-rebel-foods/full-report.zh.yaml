      - number: '7.3'
        title: 运营、渠道与合作伙伴依赖风险
        blocks:
          - type: paragraph
            body: >-
              Rebel 投资逻辑的运营核心，是共享基础设施和技术能抵消外卖链条的脆弱性。公开证据支持效率野心，但也凸显上限。CCI 案件是锚点来源：它记录的市场中，餐厅据称无法在主导平台上自配送，佣金可达 20% 中段到
              30% 高段，平台还运营自有厨房项目和自有品牌。对 Rebel 来说，获客发现、配送可靠性、折扣压力和可见性算法，都受制于同样有能力偏向关联供给的交易对手。Rebel 用 EatSure、Rebel
              OS、Rebel Launcher 和授权交易作出回应；Outlook 显示公司投入 D2C 渠道、平台服务模式，以及 Wendy's 云厨房独家许可。但多元化也带来自身复杂度：一个厨房可跑 10-15
              个品牌，品牌页面确认多品牌组合仍在运转，共享厨房的故障模式——错品退款、食品质量漂移、声誉外溢损害——会随着每新增一个菜系而放大。行业研究进一步强化了模型对聚合平台佣金、包装和自有订单占比的敏感性：如果自有渠道渗透率没有超过有意义的门槛，佣金负担会让一个增长中的厨房网络仍然结构性地利润率偏薄。
