              条——说明装机用户群已具备相当规模，并不是刚上线的新应用。但同样是这些公开界面，也解释了本章为什么不能有把握地认定留存足够耐久。2026 年 5 月的 Google Play
              近期评论提到无骑手可用、付款后延迟两小时、订单取消后又被标记为已送达、退款处理差；Consumer Complaints Court 这个独立投诉板也出现相同主题。合在一起看，结论应当平衡：Rebel
              有复购需求脚手架，也有广泛认知，但公开证据没有披露 NRR、GRR、流失率或客户队列，近期服务质量问题也会实质拖累留存耐久性。公开复购代理指标存在，但硬核续约经济性仍未进入披露记录。
