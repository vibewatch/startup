      - number: '2.4'
        title: 增长驱动、渠道权力与采用约束
        blocks:
          - type: paragraph
            body: >-
              增长逻辑是真实的。云厨房和 QSR 看起来快于大盘增长，供应商报告和公开文件都指向同一套赋能栈：广泛移动连接、城市时间稀缺、数字支付采用、更丰富的应用 UX
              和更密集的物流网络。外卖平台本身仍显示出有意义的规模增长——Swiggy 报告 2025 年 12 月季度食品配送 GOV 同比增长 20.5%，Eternal 报告 FY25 食品配送 NOV 达 INR
              32,862 crore、订单 853 million、平均月交易客户 20.6 million。即使 Rebel 小于这些分销商，这些公开竞品仍确认，底层点餐习惯足够大且活跃。


              摩擦逻辑同样重要。ICRA 称，由于店外消费组合利润率更低、同店销售为负、竞争限制定价权，QSR 经营杠杆仍难释放。Technavio 和 Nexdigm
              都描述了一个由前两大平台控制、高度集中的分销层；ETRetail/Wazir 则把对聚合平台的依赖、直接客户所有权弱以及高可见性投放，列为云厨房核心短板。Eternal
              自己的股东信也强化了这一点：市场并不会走向温和寡头，管理层明确预期竞争加剧。对 Rebel 而言，市场增长并不能消除渠道风险。公司受益于更大的数字点餐习惯，但仍必须在别人的需求入口里赢得发现、复用和利润率。
