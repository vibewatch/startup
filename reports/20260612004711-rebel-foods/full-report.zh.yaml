      - number: '1.2'
        title: 创始人延续、管理层交接与治理不透明
        blocks:
          - type: paragraph
            body: >-
              创始人延续对 Rebel 仍然重要，但公开图景在运营层比治理层更清楚。公开报道和官方 ESOP 材料把公司追溯到 2011 年，并将起点指向 Jaydeep Barman 和 Kallol
              Banerjee；后续平台材料也把 Ankush Grover、Sagar Kochhar 等创始人和业务负责人放进当前运营叙事。近期关键变化是 2025 年 7 月的交接：Grover 出任
              CEO，Barman 转任董事长兼集团 CEO，核心职能向 Grover 汇报。这让接班安排可见且可信。不可见的是背后的董事会和控制权架构。Rebel
              自己的领导力页面重理念、轻姓名，公开披露界面仍不给出现任董事会名单、股权结构表或控制权地图。因此，后续尽调可以依赖领导层变更本身，但不能依赖一张干净的治理结构图。
