      - number: '8.3'
        title: 情景逻辑：上行需要披露和执行，下行不需要太多想象
        blocks:
          - type: paragraph
            body: >-
              Rebel 的上行情景并非虚构。公司仍控制着认知度很高的数字优先品牌，继续增加全渠道产能，并处在一个 IMARC 和 Expert Market Research
              都认为云厨房和在线食品配送会继续结构性增长的市场。如果核心品牌持续复利、线下 / 全渠道推进跑通、较弱的组合资产不再吸收资本，且管理层能证明 burn 纪律会转化为耐久 EBITDA 进展，业务就有可能支撑一个从
              KKR 二级交易区间起步、并重新打开通往此前独角兽叙事路径的价值区间。

              但下行情景更容易用公开证据解释。Forbes 在 2026 年对幽灵厨房经济性的回顾认为，运营商仍被付费获客依赖、低忠诚度和可吸收订单价值 15% 至 30% 的配送费挤压。Restaurant Business
              关于 Reef 的报道显示，模型一旦草率扩张，很快就会遇到销售、盈利和监管问题。Rebel 自身的组合精简、办公室整合和 Smoor
              阴影说明管理层已经认识到这种压力。因此，基准情景比头条品牌叙事更窄：当前二级交易区间附近存在价值支撑，但不是价格不敏感的溢价；如果经审计增长、利润率或融资证据令人失望，进一步下调估值很容易成立。
            claimRefs:
