      - number: '4.4'
        title: 财务结论与尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              公开记录支持一个有层次但不完整的正面判断。Rebel Foods 有真实规模、真实收入，也有真实证据显示 FY24 和 FY25
              亏损收窄。核心收入流不是假的，也不是纯粹依赖市场平台；客户正在大规模购买自有品牌食品，公司也建立了通过 EatSure、加盟形态、Rebel Launcher
              和线下延伸捕获需求的多种方式。成本纪律看起来也真实，尤其是 FY24 广告重置，以及每赚 1 卢比所需支出从 1.31x 改善到 1.23x。


              但同一套公开记录不足以支撑公司已经稳稳迈向可持续盈利的承销跳跃。收入仍压倒性来自食品销售，而不是高毛利经常性软件收入。直营订单采用、加盟扩张和合作品牌服务可能随着时间改善结构，但没有一项公开披露到足以建模实际利润率的细度。可见债务票息高达
              13.9%，未结清抵押负担不小，2025 年 3 月报告现金余额相对年度亏损偏低。QuickiES 在 2026 年关闭又增加了一个反向信号：更快配送形态的试验，可能比公开利润率画像更快消耗现金。


              因此，我的财务结论是有条件的。Rebel
              看起来像一家规模化、纪律性增强、且自有渠道经济性有希望的食品运营商，而不是一家利润率路径已经被证明的公司。应把公司承销为一个大型交易型食品网络，其上行取决于直营订单渗透、更好的渠道组合和更严格的厨房级贡献经济性。在管理层提供签署版融资文件和完整内部运营模型之前，把现金跑道、估值以及加盟
              / Rebel Launcher 货币化视为尽调关键阻碍。
