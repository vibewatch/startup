      - number: '5.3'
        title: 厨房 OS 与数据平台：公开证据指向围绕厨房的路由、预测和菜单控制系统
        blocks:
          - type: paragraph
            body: >-
              最可信的公开技术证据来自 Rebel 自己的架构语言，以及 Google Cloud 和 Times of India 报道，而不是公开 API 或工程文档门户。Rebel
              明确称其使用用于多渠道点餐的微服务解决方案，以及用于品牌级覆盖控制的按品牌 polygon。Google Cloud 用更具体的术语描述了相邻栈：用于位置捕获和路由的
              Places、Geocoding、JavaScript 和 Directions APIs；用于预测和推荐数据的 BigQuery；用于关键应用的 Kubernetes
              Engine；以及因原有本地部署无法可靠扩展而推动的云迁移。Times of India 加上了厨房控制视角，描述跨品牌一键下架菜单、基于流程而非品牌的厨房工位、中央库存逻辑和 AI
              客服层。合在一起，这些证据支持一个真实的内部厨房操作系统和数据平台，其任务是同步菜单、厨房产线、需求预测、配送承诺和服务补救。保留意见在边界定义：Rebel
              显然拥有严肃的内部系统，但没有发布可与横向软件供应商相比的第三方开发者文档或客户可见技术架构。
