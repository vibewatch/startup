      - - 优惠驱动结账与留存
        - 使用首单、BOGO、Elite 或钱包权益
        - EatSure 促销、SurePoints/Wallet、Elite 计划
        - 提高复购意愿，也便于测试客单价
        - 服务滑坡时，促销会增加退款和支持复杂度
      - - 订单追踪与异常处理
        - 追踪订单、添加备注、取消订单、联系支持
        - My Orders、实时追踪、Surebot Cookie、支持邮箱 / 聊天
        - 许多订单中途任务可由顾客自助完成
        - 公开评论仍提到 ETA、取消和退款挫败感
      - - 共享资产下的厨房备餐
        - 将已下单菜品路由到共享烹饪线
        - 流水线厨房工位加多品牌厨房模型
        - 资产复用率更高，跨品牌扩张更快
        - 菜单复杂后，执行更依赖预测和产线纪律
      - - 安全承诺下的决策
        - 查看食材、热量、安全承诺和包装
        - 菜品透明度、200+ 项检查、温度追踪、双重封签
        - Rebel 把信任做成产品功能，而不是默认前提
        - 正式证书和审计摘要没有公开链接
      - - 合作伙伴或线下业态延伸
        - 在共享栈上接入 Wendy’s、ONDC 或堂食体验
        - 共享厨房加合作伙伴 / 特许经营和渠道集成
        - 把需求延伸到自有 D2C 品牌之外
        - 每个新业态都会增加运营差异和支持负担
    notes: 这张工作流表同时覆盖直接观察到的顾客步骤，以及公开产品界面明确描述的厨房和支持流程。
