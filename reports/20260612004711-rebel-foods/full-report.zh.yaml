      - number: '4.3'
        title: 资本充足性、债务与融资依赖
        blocks:
          - type: paragraph
            body: >-
              公开证据足以证明融资依赖，但不足以有把握地计算现金跑道。公司有很长的股权融资历史，包括 2021 年以 USD 1.4 billion 估值完成的 USD 175 million Series
              F；后续公开融资报道则指向 2025/2026 年 Temasek/Evolvence 的 USD 210 million 轮次，加上另一个 QIA 的 USD 25 million 支票。但这些后续估值和新股
              / 老股细节在来源之间没有干净对齐。ET 2024 年 8 月报道暗示一段老股交易估值约 USD 700 million，而 IPO Central 后来报道估值为 USD 1.4
              billion。这个区间过宽，没有签署版轮次文件就无法承销当前价值。


              债务比股权更清楚。Financial Express 描述了早前一笔 USD 13.2 million 的 Alteria/InnoVen 债务融资；Entrackr 2025 年 9
              月基于文件的报道称，Rebel 批准发行 15,000 份 NCD，每份 INR 1 lakh，以 13.9% 票息筹集 INR 150 crore，2028 年 9 月到期。The Company Check
              还列出约 INR 687 crore 未结清抵押负担，以及 INR 186.5 crore 已结清贷款。定价债务、可见抵押负担和持续亏损运营合在一起，说明业务并不只靠股权为增长融资。


              最令人不安的公开数字是 2025 年 3 月现金余额。Entrackr 称，财政年末现金和银行余额只有约 INR 56 crore，而 FY25 净亏损约 INR 336
              crore。这不能证明公司立即出现流动性危机，因为债务或股权到账后现金可能快速变化，但确实意味着外部公开投资人无法承销现金跑道。没有不受限现金、契约细节、营运资本时点或董事会批准的资金用途计划，审慎结论是：2025-2026
              年，Rebel 很可能仍依赖新融资、直营订单结构改善和更严格成本控制。
