      - number: '4.2'
        title: 成本结构与单位经济性代理
        blocks:
          - type: paragraph
            body: >-
              公开材料中判断 Rebel Foods 单位经济性的最佳入口，是成本桶趋势，而不是真正的贡献利润率披露。FY24 经营收入升至约 INR 1,420 crore，亏损收窄至约 INR 378
              crore，可见桥接解释了原因：总费用几乎没有增长，员工成本小幅下降，广告从约 INR 197 crore 大幅降至约 INR 133 crore。Entrackr 的外部单位代理指标称，Rebel 为赚取
              FY24 每 1 卢比经营收入花费 INR 1.31。这仍在亏损，但相比上一年已有实质改善。


              FY25 没有打破模型，但削弱了增长叙事。Entrackr 基于 FY25 文件的报道显示，收入仍增长至约 INR 1,617 crore，亏损再次改善至约 INR 336 crore，但收入增幅放缓至约
              14%，EBITDA 利润率仍为负，为 -10.39%。材料成本升至约 INR 678.5 crore，经纪和佣金升至约 INR 243 crore，广告回升至约 INR 153 crore。每赚 1
              卢比所需支出的效率代理改善到 INR 1.23，但这仍意味着公司尚未进入自我供血状态。


              缺失指标恰恰是投资人最想要的指标。没有公开来源给出获客成本、回本周期、厨房利用率、品牌级贡献利润率、复购留存，或聚合平台与直营订单队列之间的干净拆分。EatSure
              订单占比提升很可能有帮助，因为它应能降低第三方佣金并改善数据所有权，但公开来源没有证明收益幅度。因此，单位经济性判断应保持谨慎：业务已经显示出真实成本纪律和温和利润率改善，但仍缺少足以证明按品牌、城市或渠道实现可持续单单盈利的披露。
