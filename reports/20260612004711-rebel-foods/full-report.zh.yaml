  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 当前锚点
      - 倍数 / 估值 / 状态
      - 与 Rebel 的相关性
      - 局限
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the most decision-useful public and private references surfaced in this run: Rebel's own late-2024
        financing anchors plus selected listed food-delivery peers with direct investor-relations or market-data pages.
        It is not an exhaustive census of all global restaurant-tech or marketplace comparables.
    rows:
      - - Rebel Foods Series G 新股标题价
        - Dec-2024 融资报道
        - ~$1.4B 标题估值
        - 最新被广泛引用的新股轮估值锚点，也是 IPO 叙事参照。
        - 该轮包含大额老股出售，且未披露当前股权结构表或优先权条款。
      - - Rebel Foods / KKR 老股交易
        - 2024 年末老股交易报道
        - ~$800M-$860M；约 ₹6,800-7,315 crore
        - 最现实、可观察的实时私人市场锚点；更能反映后续投资者似乎愿意交易的位置。
        - 老股定价不等于广泛的新资金需求，也可能对条款敏感。
      - - DoorDash
        - Jun-2026 公开市场 + LTM 收入
        - ~$67.35B 市值；~4.58x 销售额
        - 这组可比中质量最高的上限，覆盖食品配送规模、流动性和披露。
        - 盈利能力、公众流通股和投资者披露都远深于 Rebel。
      - - Swiggy
        - Jun-2026 公开市场 + FY26 收入
        - ~₹625.97B 市值；~2.72x 收入
        - 最接近的印度上市食品配送参照，有上市公司报告且仍在亏损。
        - 市场平台模式和即时零售敞口不同于 Rebel 的自有品牌云厨房组合。
      - - Deliveroo
        - 最后公开市场参照 + 2024 收入
        - ~$3.54B 市值；~1.36x 收入
        - 说明公开市场如何给规模较小、经营杠杆弱于 DoorDash 的配送平台定价。
        - 公开市场整合后的历史参照；不是印度自有品牌运营商。
      - - Just Eat Takeaway
        - 最后公开市场参照 + 2024 收入
        - ~$4.76B 市值；~1.29x 收入
        - 对成熟、披露充分的配送运营商来说，是有用的低倍数基准。
        - 国际组合和重组历史让它成为更严苛但不完美的类比对象。
      - - Delivery Hero
        - Jun-2026 公开市场 + 2024 收入
        - ~$13.44B 市值；~1.05x 收入
        - 说明当配送经济性仍然资本密集时，公开市场投资者会如何折价规模。
        - 多区域平台，同时有即时零售和市场平台敞口，不同于 Rebel 的品牌自有模式。
    notes: 上市可比倍数直接使用引用的市值和收入页面。Rebel 各行是融资锚点，不是可观察的公开市场倍数，应视为价格参照，而非完整可比筛选。
