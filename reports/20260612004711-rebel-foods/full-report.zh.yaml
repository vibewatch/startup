          detail: 云厨房和在线配送需求仍大，第三方市场研究显示还在增长。
        - label: 品牌组合强度
          value: 7
          detail: Rebel 仍控制一批有认知度、数字优先的品牌，并负责 Wendy's India 履约。
        - label: 财务趋势
          value: 6
          detail: FY24 在收入、亏损和据报道的烧钱速度上明显改善，但 FY24 之后没有公开经审计桥接。
        - label: 估值纪律
          value: 4
          detail: KKR 区间倍数高于多数上市可比公司，只略低于 DoorDash。
        - label: 披露质量
          value: 3
          detail: 本轮未找到公开 FY25/FY26 审计、优先股堆叠细节或 IPO 申请稿。
        - label: 执行风险
          value: 4
          detail: 重组、办公室关闭，以及 Smoor / 外部品牌压力显示组合清理尚未完成。
        - label: 退出准备度
          value: 3
          detail: 上市同业提供可用于申报级别的 IR 基础设施；Rebel 的尽调界面仍主要由媒体报道驱动。
