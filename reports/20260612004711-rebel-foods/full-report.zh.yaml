      - number: '7.5'
        title: 缓释、监控项与投资逻辑破裂标准
        blocks:
          - type: paragraph
            body: >-
              Rebel 确实有真实的缓释界面。公司已经用 EatSure 建成一个有意义的自有 App
              品牌，持续讲自动化和厨房标准化，也证明自己仍能拿到大额机构轮次。它还可以用特许经营、授权、平台服务和实体美食广场形态延展品牌分发。问题在于，大多数缓释因素仍是流程或增长杠杆，而不是渠道和利润率结构已经结构性改善的证明。因此，价值最高的尽调项都应可量化。投资者应索取过去
              12 个月按渠道划分的订单结构、按平台划分的佣金率、当前按厨房列示的 FSSAI 许可证清单和检查历史、按品牌列示的退款和投诉率，以及当前债务、租约和 covenant
              时间表。最干净的否决标准也可量化：如果直订渗透率仍低而佣金和投入成本维持高位，如果又有食品安全或市政行动击中共享厨房，如果 Wendy's 或线下形态在持续 capex
              下仍表现不佳，或者下一次融资事件定价显著低于 2024 年末轮次，那么 Rebel 的全渠道故事就开始像是在仍依赖平台的底座上叠加复杂度，而不是真正给模式降风险。
