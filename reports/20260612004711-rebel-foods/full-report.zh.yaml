  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的风险逻辑
        blocks:
          - type: paragraph
            body: >-
              Rebel 的风险画像更像一条链，而不是单点故障。排名最高的敞口是对聚合平台的依赖：公开竞争记录显示 Zomato-Swiggy 双寡头格局、被指控的捆绑配送，以及可能吃掉订单贡献利润大部分的佣金区间，而
              Rebel 仍在靠 EatSure 建设自有直达渠道。第二是食品安全、市政和数据合规敞口；在密集的多品牌厨房网络里，一次运营失误会比单品牌 QSR 链更快地穿透品牌、城市和监管方。第三是执行复杂度：每个厨房跑
              10-15 个品牌，扩张 Wendy's、Oven Story 等特许经营和授权形态，同时把模式推向线下美食广场和新地理区域。第四是融资与估值风险：亏损已经收窄，但公开证据仍指向一个需要 2024-2025
              年大额资本注入、背负历史纠纷和 SARFAESI 记录、并在 $1.4B 轮次与后续据报 $800-860M 的 KKR 流程之间承受估值压力的业务。投资者的剩余问题不是 Rebel
              有没有增长界面，而是这些界面能否足够快地降低依赖，赶在合规成本、大宗商品通胀和平台议价权再次压缩利润率之前。
