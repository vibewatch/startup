  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与现状替代品
        blocks:
          - type: paragraph
            body: >-
              Rebel Foods 不应被定义为押注印度全部餐饮服务支出的公司。官方材料把 Rebel
              定位为互联网餐厅运营商，将品牌匹配到午餐、晚餐、小食、团体场景等重复用餐任务；当前形态也覆盖外卖优先品牌、美食广场，以及堂食加云厨房的加盟组合。因此，核心边界是数字化下单、品牌化、店外消费的用餐需求，以及服务这类需求的供给基础设施。边界可以向连锁主导的
              QSR 和混合美食广场形态外扩，但不能因为所有这些业务都卖食物，就把整个堂食、全服务或独立餐厅宇宙都吸进去。


              被排除的类别和被纳入的类别一样重要。家庭烹饪、未被追踪的线下社区点餐、堂食主导的全服务支出，以及杂货或即时零售篮子，都是重要替代品；但除非它们迁移成由应用驱动的重复点餐场景，否则并不是 Rebel
              的核心可触达支出。Fortune 更宽的餐饮服务数据强化了这一点：印度仍高度依赖堂食和全服务，所以 Rebel 的机会是一个快速增长的子集，而不是整个品类。换句话说，Rebel
              首先争夺的是数字化媒介下的用餐场景，而不是印度家庭花在吃饭上的每一卢比。
