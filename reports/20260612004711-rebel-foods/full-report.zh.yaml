  - id: FM004
    title: Rebel Foods 数字餐饮采用流程
    type: flow
    layout: standard
    summary: 品类采用路径从一次用餐场景开始，经由聚合平台发现和数字支付进入重复下单；Rebel 试图在这条流程里保住品牌层面的忠诚度。
    data:
      nodes:
        - id: need
          label: 用餐任务
          detail: 午餐、晚餐、零食、犒赏或团体场景产生即时需求。
        - id: discover
          label: 发现
          detail: 用户进入聚合平台应用或数字点餐界面，浏览品牌和促销。
        - id: choose
          label: 品牌选择
          detail: 菜系、价格、配送承诺和过往体验决定 Rebel 品牌能否赢得购物篮。
        - id: pay
          label: 数字结账
          detail: UPI、钱包或银行卡支付降低摩擦，并支持快速复购。
        - id: fulfil
          label: 厨房履约
          detail: 云厨房或混合厨房网络执行订单，并交给配送物流。
        - id: repeat
          label: 复购 / 忠诚
          detail: 品牌记忆或自有渠道迁移，决定 Rebel 能否捕获未来频次，还是继续租用需求。
      edges:
        - from: need
          to: discover
          label: 打开应用
        - from: discover
          to: choose
          label: 比较品牌和优惠
        - from: choose
          to: pay
          label: 下单
        - from: pay
          to: fulfil
          label: 分配到厨房和骑手
        - from: fulfil
          to: repeat
          label: 评估品质并复购
    approximationNotes: 这是一张工作流地图，不是披露的转化漏斗。公开证据只能定性支持每个阶段，不能支持阶段之间的转化率。
    claimRefs:
      - CM018
      - CM019
      - CM020
      - CM022
      - CM023
      - CM024
      - CM043
      - CM045
      - CM048
