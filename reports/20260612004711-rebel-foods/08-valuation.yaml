  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - argument
      - direction
      - what would change the view
    rows:
      - - Rebel still has real consumer-facing scale and brand breadth across owned brands, EatSure, and Wendy's.
        - thesis
        - Brand-level contribution and cohort data showing strong repeat economics would strengthen the case.
      - - FY24 showed better revenue growth, lower losses, and lower burn than FY23.
        - thesis
        - Audited FY25 and FY26 statements confirming that the improvement continued would make the gain durable.
      - - The KKR secondary range may be a more realistic current clearing price than the older unicorn headline.
        - thesis
        - A new primary round above the secondary range with clean terms would validate a higher mark.
      - - The same company was described at $1.4B, $1.0B, $750M, and $800-860M within the same broad period.
        - anti-thesis
        - A reconciled cap-table, round-by-round pricing memo, and current preference stack would reduce that uncertainty.
      - - Public comps suggest Rebel is already being asked to trade at or above Swiggy-like and DoorDash-like sales multiples without equivalent disclosure.
        - anti-thesis
        - Audited margin quality, direct-ordering proof, and public-offering readiness would justify a narrower disclosure discount.
      - - Ongoing restructuring and weak acquired-brand performance suggest not every part of the portfolio deserves premium capital.
        - anti-thesis
        - Demonstrated exits from weak assets and proof that core brands drive most profits would improve underwriting confidence.
    notes: >-
      Arguments are intentionally valuation-centered. The anti-thesis is not that Rebel lacks a business; it is that the
      current evidence set is too thin for a price-insensitive bull case.
