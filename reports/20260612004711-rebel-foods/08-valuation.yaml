company:
  name: Rebel Foods
chapter:
  number: 8
  title: Valuation
  summary: >-
    Public evidence supports a price-sensitive research-more recommendation on Rebel Foods rather than a buy call.
    FY24 revenue improved to ₹1,420 crore and net loss narrowed to ₹378 crore, but late-2024 valuation signals
    ranged from roughly $750 million to $1.4 billion and the KKR secondary band still implies DoorDash-like trailing
    revenue multiples without DoorDash-like disclosure. Until Rebel supplies audited post-FY24 financials,
    cap-table/preference detail, and cleaner core-brand economics, the valuation stance remains stretched with high
    risk and only medium confidence.
sections:
  - id: recommendation-thesis
    title: "Recommendation: the business is real, but the price support depends on which valuation anchor you trust"
    body: >-
      Rebel Foods has enough operating substance to stay investable. The official site still presents the company as the
      world's largest chain of internet restaurants, and management-backed public reporting says the platform spans more
      than 450 kitchens across 70-plus cities while running a broad portfolio of owned brands, Wendy's franchise
      operations, and the EatSure consumer app. FY24 was also directionally better: revenue rose to ₹1,420 crore,
      losses narrowed to ₹378 crore, and public reporting says monthly burn roughly halved as management tightened
      costs. Those facts explain why Temasek and Evolvence could still back a $210 million round in December 2024.

      The valuation problem is that the live private-market anchor is much weaker than the headline funding round.
      Bloomberg-style coverage of the Series G round used a $1.4 billion valuation, but other reporting around the same
      period pointed to a $1.0 billion mark, a $750 million deal-level valuation, and then a KKR-linked secondary range
      around $800 million to $860 million. A mostly-secondary round can still be useful price discovery, but it is not
      the same thing as new-money demand chasing a higher mark. The investment conclusion should therefore be
      evidence-sensitive and price-sensitive: research-more / track at the old unicorn mark, and only consider a firmer
      underwriting stance near the verified late-2024 secondary band after private diligence closes the disclosure gap.
