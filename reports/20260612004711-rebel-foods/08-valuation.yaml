  - id: TV006
    title: Final diligence asks table
    columns:
      - topic
      - missing evidence
      - why it matters
      - owner / diligence path
    rows:
      - - Audited post-FY24 financials
        - FY25 and FY26 audited revenue, gross margin, EBITDA, cash burn, and cash-balance bridge
        - FY24 improvement is encouraging, but the valuation call depends on whether the trend persisted after the 2024 round.
        - Request audited statements and management bridge; reconcile against ROC filings and board-approved accounts.
      - - Cap table and preference stack
        - Current ownership, liquidation preferences, ratchets, ESOP dilution, and terms on the mostly-secondary 2024 round
        - Return outcomes in a private deal can differ materially from headline valuation if the stack is heavy.
        - Obtain counsel-reviewed cap table and financing docs before negotiating entry price.
      - - Brand-level unit economics
        - Revenue, contribution margin, and repeat-rate by Behrouz, Faasos, Oven Story, EatSure, Wendy's, and acquired brands
        - Without brand mix, investors cannot tell whether growth is coming from durable core brands or capital-hungry tail assets.
        - Ask for segment / brand-level dashboards and cohort data from finance and operating teams.
      - - Channel mix and customer ownership
        - Split between marketplace orders, EatSure / direct orders, offline / omnichannel sales, and Wendy's fulfilment economics
        - Gross brand demand is less valuable if third-party platforms capture too much of the margin and customer data.
        - Review direct-order share, retention curves, CAC / payback, and marketplace commission rates.
      - - Restructuring and portfolio plan
        - Smoor strategy, external-brand capital plan, and explicit criteria for shutting or scaling brands
        - The public record already shows office closures and brand-pruning pressure ahead of IPO.
        - Review board materials on portfolio allocation, closure decisions, and acquired-brand performance.
      - - Exit readiness and IPO package
        - Timeline for filing, governance upgrades, risk-factor deck, and public-equity-bank feedback
        - The investment case changes materially if Rebel is truly IPO-ready versus simply IPO-aspirational.
        - Ask syndicate banks or management for readiness workstreams, draft materials, and governance action list.
    notes: >-
      These are the minimum diligence asks required to turn Rebel from an interesting story into an underwritable private
      valuation. Failure to provide them should keep the recommendation at research-more / track.
