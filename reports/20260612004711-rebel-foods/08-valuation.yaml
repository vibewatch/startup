  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: cap-table-preferences
      missingEvidence: Current cap table, liquidation preferences, ratchets, and dilution terms after the mostly-secondary 2024 round.
      whyItMatters: Headline valuation is not enough to judge real investor returns if the preference stack or dilution overhang is heavy.
      diligencePath: Request counsel-reviewed financing documents and a current cap-table waterfall from management before setting entry price.
      relatedQuestionRefs:
        - QV033
      relatedTableRefs:
        - TV006
    - type: missing-source
      severity: material
      topic: post-fy24-financials
      missingEvidence: Audited FY25 and FY26 revenue, EBITDA, cash-burn, and cash-balance statements for Rebel Foods.
      whyItMatters: The public valuation debate is still anchored on FY24 numbers, so investors cannot confirm whether operating improvements persisted.
      diligencePath: Obtain audited or board-approved post-FY24 financial statements and reconcile them against ROC filings or lender materials.
      relatedQuestionRefs:
        - QV013
        - QV029
      relatedTableRefs:
        - TV003
        - TV006
    - type: missing-source
      severity: material
      topic: brand-level-unit-economics
      missingEvidence: Brand, channel, and geography-level revenue, contribution margin, repeat rate, and CAC / payback data for core brands, EatSure, Wendy's, and acquired assets.
      whyItMatters: Investors cannot tell whether value comes from durable core brands or from lower-quality, capital-consuming tail assets.
      diligencePath: Request brand-level operating dashboards and cohort analyses from finance and operating teams.
      relatedQuestionRefs:
        - QV029
        - QV034
      relatedTableRefs:
        - TV002
        - TV006
    - type: conflicting-data
      severity: material
      topic: valuation-anchors
      missingEvidence: Reconciled explanation of why public sources describe Rebel at about $700M, $750M, $800M-$860M, $1.0B, and $1.4B across the 2024 financing window.
      whyItMatters: Price discipline is impossible if investors cannot distinguish primary valuation, secondary clearing price, and legacy mark.
      diligencePath: Ask management and investors for a round-by-round pricing memo, transaction mix, and current mark-setting rationale.
      relatedQuestionRefs:
        - QV007
      relatedTableRefs:
        - TV004
    - type: stale
      severity: minor
      topic: current-trading
      missingEvidence: Current 2026 quarterly trading, direct-order mix, and brand-level profitability indicators after the 2024 raise.
      whyItMatters: A 2026 investment decision based mostly on FY24 numbers risks anchoring on an out-of-date operating picture.
      diligencePath: Request a monthly KPI pack covering order mix, kitchen productivity, direct-order share, and contribution margin through the latest quarter.
      relatedQuestionRefs:
        - QV029
      relatedTableRefs:
        - TV001
        - TV005
