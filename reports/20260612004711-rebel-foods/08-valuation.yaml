    title: Recommendation summary table
    columns:
      - decision field
      - current view
      - decision implication
    rows:
      - - Recommendation
        - research-more / track
        - Keep Rebel in diligence, but do not underwrite the old unicorn price on public evidence alone.
      - - Confidence
        - medium
        - Operating traction is real, but the public valuation record and disclosure set are inconsistent.
      - - Risk rating
        - high
        - A further markdown is easy to justify if audited growth, margins, or financing terms disappoint.
      - - Valuation stance
        - stretched
        - Even the late-2024 secondary range implies richer multiples than most public food-delivery peers.
      - - Entry discipline
        - Secondary band first, not primary headline
        - Start diligence around the verified $800M-$860M KKR range or lower, not the older $1.4B anchor.
      - - Hold / exit posture
        - 3-5 year hold only if disclosure improves
        - Real upside requires audited proof, cleaner cap-table terms, and a credible IPO / exit path.
    notes: >-
      The call is price-sensitive. "Stretched" does not mean Rebel lacks product or brand value; it means the current
      public evidence does not justify paying a premium-private multiple with limited disclosure.
