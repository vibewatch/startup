figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      Rebel's recommendation is driven by genuine operating scale and improving FY24 financials on one side, offset by
      markdown-prone private-market signals and a large disclosure discount on the other.
    data:
      nodes:
        - id: scale
          label: Official scale
          detail: 4,000+ internet restaurants, 450+ kitchens, 70+ cities, 10 countries, 2M+ customers.
        - id: trend
          label: FY24 financial trend
          detail: Revenue rose to ₹1,420 crore and net loss narrowed to ₹378 crore, with burn reportedly halving.
        - id: mark
          label: Current valuation signal
          detail: Live private references cluster around $750M-$860M, well below the older $1.4B headline.
        - id: comp
          label: Public comp test
          detail: KKR-range multiples sit above Swiggy, Delivery Hero, Deliveroo, and Just Eat, and near DoorDash.
        - id: disclosure
          label: Disclosure gap
          detail: No public FY25/FY26 audit, no cap-table / preference disclosure, and no draft IPO filing.
        - id: call
          label: Recommendation
          detail: Research-more / track at stretched valuation until diligence closes the gap.
      edges:
        - from: scale
          to: trend
          label: Real operating footprint supports attention
        - from: trend
          to: mark
          label: Better FY24 numbers enabled fresh capital and secondary liquidity
        - from: mark
          to: comp
          label: Private price still needs a public-multiple test
        - from: comp
          to: disclosure
          label: Premium multiple is hard to defend without premium disclosure
        - from: disclosure
          to: call
          label: Missing evidence caps conviction
