  - id: diligence-and-exit
    title: "Exit readiness and final diligence: disclosure, not awareness, is the gating variable"
    body: >-
      The final investment question is not whether Rebel has brands, kitchens, or consumer demand. It is whether an
      investor can underwrite the current price with enough clarity on what sits underneath the headline. Public peers
      such as DoorDash, Delivery Hero, Just Eat Takeaway, Deliveroo, and Swiggy all maintain investor-relations and
      annual-report infrastructure that lets investors inspect revenue quality, risk factors, and capital structure.
      Rebel does not offer an equivalent public record today.

      That gap matters because the unresolved items are exactly the ones that determine real return outcomes in a private
      deal: the current cap table and liquidation stack after a mostly-secondary round, audited FY25/FY26 financials,
      core-brand versus acquired-brand profitability, EatSure's unit economics, Wendy's contribution, and whether the
      next financing or IPO process will validate or contradict the late-2024 secondary marks. Until those documents are
      available, the most defensible posture is disciplined curiosity rather than conviction. Keep the company active,
      anchor negotiation around the late-2024 secondary band or lower, and be willing to upgrade only if management can
      convert the narrative into filing-grade evidence.
