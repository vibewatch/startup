- id: milestones-risks
  title: Omnichannel milestones, partner expansion, and adverse signals
  body: 'The milestone pattern shows Rebel moving from internet-restaurant scale into a hybrid platform that mixes owned brands, partner brands, and offline presence. EatSure’s 2024 group-ordering launch and the 2026 Jammu smart foodcourt both strengthen the “foodcourt-on-an-app” thesis with physical touchpoints and multi-brand checkout. Wendy’s is now a major partner channel: official Wendy’s materials say Rebel reached 200 Indian locations in under 40 months, while 2025 expansion coverage shows continued capex behind that network. At the same time, the company is still reshaping its portfolio. Reporting around Smoor suggests that the 2022 brand-aggregation strategy did not translate into uniformly strong performance, and by July 2025 Rebel was reportedly exploring a stake sale while closing Gurugram and Bengaluru offices to consolidate teams in Mumbai. That does not negate the scale story, but it does mean the company’s next phase is as much about pruning and execution discipline as it
    is about growth.'
