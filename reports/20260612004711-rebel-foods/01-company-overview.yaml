    missingEvidence: Executed financing documents or management-approved cap table showing exact Series G, KKR, debt, and secondary mechanics.
    whyItMatters: Public round amounts, post-money markers, and investor economics are not fully harmonized, so headline valuation and dilution remain medium-confidence only.
    diligencePath: Request financing closing decks, debt schedules, and the current fully diluted capitalization table, then rebuild the funding chronology from primary documents.
