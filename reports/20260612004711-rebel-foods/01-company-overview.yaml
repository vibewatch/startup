  - type: enumeration-incomplete
    severity: material
    topic: governance-and-leadership-map
    missingEvidence: A current board roster, committee structure, shareholder list, and named executive roster directly from management or statutory filings.
    whyItMatters: Leadership succession is visible, but control rights and board oversight are not, which limits diligence on governance quality and key-person dependency.
    diligencePath: Request the latest annual return, cap table, board materials, and organization chart; reconcile them with founder, investor, and functional leadership interviews.
