- id: capital-scale
  title: Funding history, scale markers, and unresolved valuation arithmetic
  body: 'The public record supports a clear late-stage financing narrative even though it does not reconcile every instrument cleanly. Rebel became a unicorn in 2021 after a Qatar Investment Authority-led round and then raised a further $210 million Series G in December 2024 led by Temasek with Evolvence participation. Entrackr adds that the company also raised nearly $50 million of debt through five tranches over the prior two years. Public scale disclosures are strong enough to establish meaningful size: FY24 revenue reached Rs 1,420 crore, losses narrowed to Rs 378 crore, and management was already speaking about an IPO within 18 to 24 months, 800 kitchens by 2029, and broader city expansion. The weak point is valuation arithmetic. ET Retail and Bloomberg tie the 2024 round to a $1.4 billion valuation, while Business Standard separately reports a KKR investment estimate at a much lower implied valuation range. That discrepancy is material enough that current valuation should be treated
    as medium-confidence until financing documents are reviewed.'
  claimRefs:
