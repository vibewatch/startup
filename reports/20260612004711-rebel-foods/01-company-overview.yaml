- id: leadership-governance
  title: Founder continuity, executive transition, and governance opacity
  body: Founder continuity still matters at Rebel, but the public picture is clearer at the operating layer than at the governance layer. Public reporting and official ESOP material trace the company back to 2011 and tie that origin to Jaydeep Barman and Kallol Banerjee, while later platform materials also surface founders and business leaders such as Ankush Grover and Sagar Kochhar in the current operating story. The key recent development is the July 2025 transition in which Grover became CEO and Barman moved to chairman and group CEO, with core functions set to report to Grover. That makes the succession visible and credible. What is not visible is the board and control architecture behind it. Rebel’s own leadership page is philosophy-heavy and name-light, and the public disclosure surface still does not give a current board roster, cap table, or control-rights map. That means later diligence can rely on the leadership change itself, but not on a clean governance diagram.
  claimRefs:
  - CO011
  - CO013
