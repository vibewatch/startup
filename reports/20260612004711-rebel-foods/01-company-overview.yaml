  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: public-scale-reconciliation
    missingEvidence: A single current company-approved footprint table reconciling kitchens, internet restaurants, cities, countries, customers, and Wendy’s touchpoints.
    whyItMatters: Current official pages and partner/media coverage disagree on several headline scale metrics, which weakens valuation comparability and later chapter reuse.
    diligencePath: Request the latest board or finance-approved corporate fact sheet and operating footprint deck, then normalize every public KPI against that source of truth.
    relatedQuestionRefs:
    - QO005
    - QO024
    - QO026
