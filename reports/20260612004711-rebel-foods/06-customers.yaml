company:
  name: Rebel Foods
chapter:
  number: 6
  title: Customers
  summary: Rebel Foods has credible public proof of broad customer reach across its owned brands, EatSure direct app, Wendy's India, IRCTC travel occasions, and a growing Rebel Launcher partner roster. The evidence is strongest on breadth and deployment scale; it is weakest on retention, cohort, and concentration disclosure, with recent app-review complaints showing that service reliability remains a live durability risk.
sections:
- id: customer-surfaces-and-segmentation
  title: Customer surfaces and segmentation
  body: 'Rebel''s customer map is broader than a single delivery brand. Official pages describe a company built around food missions—lunch, dinner, snacks, and group occasions—then matched to owned brands such as Faasos, Behrouz, Lunchbox, and Oven Story. Public direct-channel evidence shows that EatSure functions as the consumer aggregation layer for that portfolio: Google Play says one order can combine 15+ brands, the App Store says the app serves 80+ Indian cities, and the New Delhi service page lists dozens of local catchments plus Wendy''s nodes. That evidence supports a segmentation model with at least six surfaces: direct households ordering through EatSure, Tier 2/3 city consumers reached through catchment expansion, Wendy''s India diners, rail travelers ordering through IRCTC, external food brands using Rebel Launcher, and franchise operators paying for Rebel''s stack. The important nuance is that public proof is strongest on breadth and coverage, not on disclosed revenue mix by
    segment.'
  claimRefs:
  - CU001
  - CU002
  - CU004
  - CU005
  - CU006
  - CU007
  - CU008
  - CU009
  - CU034
