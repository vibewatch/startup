- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver / concentration risk
  - Current evidence
  - Impact
  - Diligence path
  rows:
  - - Tier-2 catchment expansion
    - 120-city goal and 550-600 catchment target after 315 current catchments
    - Expands TAM, but execution risk rises in thinner-density markets
    - Request city-level order density, payback, and closure data
  - - Wendy's partner concentration
    - 200 India locations today with a 500-store ambition; 70% of a future 700-kitchen estate expected to include Wendy's
    - Large partner success can also create capex and allocation concentration
    - Request Wendy's share of GMV, contribution margin, and renewal rights
  - - IRCTC travel channel
    - Authorized brand presence across 400+ stations and a 155k+ daily meal system
    - Adds a distinct use occasion and brand discovery path
    - Request Rebel brand order share, repeat rate, and refund data in IRCTC channel
  - - Launcher partner breadth
    - 20+ external brands publicly disclosed
    - Diversifies revenue beyond owned brands but increases partner-support complexity
    - Request top-partner ranking by GMV, launch cohorts, and churn
  - - Direct-app service reliability
    - May 2026 reviews cite no-driver availability, ETA slippage, cancellations, and refunds
    - Can erode repeat behavior even if acquisition remains strong
    - Request on-time delivery %, cancellation %, and complaint-resolution SLA
  - - Aggregator / direct mix disclosure
    - No public split across EatSure, Swiggy/Zomato, offline, IRCTC, and franchise channels
    - Unknown concentration can hide channel-margin dependence
    - Request LTM channel mix with CAC, take rate, refunds, and contribution margin
  notes: Expansion proof is strong; concentration disclosure is weak and requires management data rather than public web research.
