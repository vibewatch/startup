  rows:
  - - Direct EatSure households
    - Buyer=user=payer households
    - Single-brand and mixed-basket food delivery
    - 80+ cities; 15+ brands per order; 313K Google Play reviews; 43K App Store ratings
    - Core direct relationship and data loop
    - No MAU, order frequency, or cohort disclosure
  - - Tier 2 / Tier 3 city consumers
    - Urban delivery households outside metros
    - Catchment expansion via cloud kitchens and food courts
    - 75-city current footprint; 120-city target; 315 catchments with 550-600 target
