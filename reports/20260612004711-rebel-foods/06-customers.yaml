  - - Wendy's India diners
    - Burger QSR consumers; dine-in and delivery users
    - Licensed global QSR expansion under Rebel operations
    - 200 India locations; 185 cloud kitchens; 12 dine-in; 50+ cities
    - Largest disclosed partner-brand scale signal
    - No same-store sales or renewal economics
  - - Rail passengers on IRCTC
    - Passenger buyer and train-seat user
    - Pre-booked meal delivery to train coaches
    - Authorized on 400+ stations through IRCTC's system
    - Adds travel occasion beyond home delivery
    - Rebel's share of IRCTC orders not disclosed
  - - Launcher partner brands
    - Food operators / institutions / aggregators
    - Use Rebel OS, supply chain, and cloud capabilities
    - 20+ external brands publicly named under Launcher
    - B2B revenue diversification beyond owned brands
    - No partner GMV or churn disclosure
  - - Franchise operators
    - F&B entrepreneurs and regional partners
    - Operate Oven Story dine-in plus multi-brand cloud kitchen formats
    - Rs 90L-1cr investment; 9-year term; 3.5-year payback claim
    - Shows willingness to pay for Rebel's operating stack
    - Unit economics are company-claimed, not independently verified
  notes: Public evidence supports broad segment breadth, but not disclosed mix by GMV, contribution margin, or repeat frequency.
