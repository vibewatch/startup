- id: named-customer-proof-and-adoption
  title: Named customer proof and adoption
  body: 'Named customer proof exists, but it is uneven across segment types. On the B2B side, public evidence is strongest for Wendy''s India and for the external brands Rebel says it has brought onto Rebel Launcher and EatSure. Financial Express names Naturals, Mad Over Donuts, Anand Sweets, and others as Launcher partners, while the App Store shows those same brands merchandised inside EatSure, which is enough to classify them as production relationships rather than hypothetical logos. Wendy''s is even stronger: official Wendy''s, Financial Express, and Economic Times sources jointly show a scaled operating relationship spanning cloud kitchens, dine-in stores, and branded menu launches. On the B2C side, Google Cloud and app listings prove usage scale, but public evidence is still more deployment-oriented than cohort-oriented; we can see where customers are served and which offers they receive, but not how long they stay or how profitable each cohort becomes.'
  claimRefs:
