- id: retention-repeat-and-satisfaction
  title: Retention, repeat usage, and satisfaction
  body: 'The retention picture is directionally positive but quantitatively incomplete. Rebel clearly invests in repeat loops: EatSure Elite, SurePoints, free-delivery thresholds, free-dish incentives, and Buy One Get One Free all point to an active loyalty architecture. Large review counts—313K on Google Play and 43K on the App Store—also imply a meaningfully large installed base rather than a newly launched app. But those same public surfaces also show why the chapter cannot claim durable retention with confidence. Recent May 2026 Google Play reviews describe no-driver availability, two-hour delays after payment, cancellations later marked delivered, and poor refund resolution; Consumer Complaints Court shows the same themes on an independent complaint board. That combination supports a balanced view: Rebel has repeat-demand scaffolding and broad awareness, but public evidence does not disclose NRR, GRR, churn, or customer cohorts, and recent service-quality lapses are a credible drag
    on durability. Public repeat proxies exist, but hard renewal economics remain outside the disclosed record.'
  claimRefs:
  - CU026
  - CU027
  - CU028
  - CU029
  - CU030
  - CU031
  - CU032
  tableRefs:
  - TU004
- id: expansion-concentration-and-gaps
  title: Expansion, concentration, and gaps
  body: 'Expansion proof is stronger than concentration disclosure. Financial Express shows a 120-city ambition, a 315-to-550/600 catchment plan, and a Rebel Launcher roster with 20+ external brands. IRCTC adds a distinct travel occasion where several Rebel brands already appear on the authorized list. At the same time, the public record implies one visible concentration pocket: Wendy''s is already a 200-location partner brand, 185 of those locations were cloud kitchens as of March 2025, and 70% of a future 700-kitchen network is expected to include Wendy''s. That does not mean Rebel is single-brand dependent—the owned portfolio and Launcher roster are broad—but it does mean any customer chapter should treat Wendy''s as the clearest large-scale partner exposure. The bigger diligence problem is disclosure: none of the reviewed public sources publish top-brand GMV, top-channel mix, repeat cohorts, or partner churn. Those are the missing links between visible adoption and durable, diversified
    monetization.'
