- id: TM004
  title: Growth Drivers and Constraints Table
  columns:
  - Driver / Constraint
  - Direction
  - Timing
  - Implication
  - Diligence Ask
  rows:
  - - Internet and smartphone penetration
    - Positive
    - Now
    - Expands reachable app-ordering base beyond metro elites
    - What share of Rebel orders comes from first-time digital-ordering cohorts?
  - - UPI and digital-payment ubiquity
    - Positive
    - Now
    - Reduces checkout friction and supports repeat lower-ticket ordering
    - What is Rebel's payment-method mix by city and brand?
  - - Cloud-kitchen and QSR formats outgrowing market
    - Positive
    - Medium term
    - Supports capacity expansion and multi-brand kitchen density
    - Which Rebel brands have the best repeat rate and contribution margin in dense corridors?
  - - Competitor platform scale (Swiggy / Eternal)
    - Positive for category, negative for bargaining power
    - Now
    - Confirms habit formation but concentrates discovery outside Rebel's owned channels
    - How much of Rebel's volume is dependent on each aggregator?
  - - Off-premise mix diluting margins
    - Negative
    - Now
    - High delivery mix can keep operating leverage elusive despite top-line growth
    - What is Rebel's kitchen-level contribution margin after aggregator fees and discounts?
  - - Customer-acquisition and visibility spend
    - Negative
    - Now
    - Discounting and sponsored placement can erode unit economics
    - What payback period does Rebel achieve on paid visibility or promo-led acquisition?
  - - Competition intensity
    - Negative
    - Near term
    - Public platforms expect more competition rather than a gentler duopoly
    - How exposed is Rebel to share loss in promoted cuisine categories like biryani, pizza, and burgers?
  - - Tier-2 and tier-3 expansion
    - Mixed positive
    - Medium term
    - Can widen SAM, but public evidence still lacks hard productivity data
    - What are order density, delivery times, and payback by city tier?
  notes: Timing reflects public evidence from 2025-2026 market reports and public-company filings. Implications are written from Rebel's perspective and should be validated with management data.
