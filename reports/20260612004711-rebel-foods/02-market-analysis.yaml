- id: FM004
  title: Digital Meal Adoption Flow for Rebel Foods
  type: flow
  layout: standard
  summary: The category adoption path runs from a meal occasion through aggregator-led discovery and digital payment into repeat ordering, with Rebel trying to retain brand-level loyalty inside that flow.
  data:
    nodes:
    - id: need
      label: Meal mission
      detail: Lunch, dinner, snack, indulgence, or group occasion creates immediate demand.
    - id: discover
      label: Discovery
      detail: User enters an aggregator app or digital ordering surface to browse brands and promotions.
    - id: choose
      label: Brand selection
      detail: Cuisine, price, delivery promise, and prior experience determine whether a Rebel brand wins the basket.
    - id: pay
      label: Digital checkout
      detail: UPI, wallet, or card payment removes friction and enables quick repeat behavior.
    - id: fulfil
      label: Kitchen fulfilment
      detail: Cloud-kitchen or hybrid kitchen network executes the order and hands it to delivery logistics.
    - id: repeat
      label: Repeat / loyalty
      detail: Brand recall or owned-channel migration determines whether Rebel captures future frequency or keeps renting demand.
    edges:
    - from: need
      to: discover
      label: Open app
    - from: discover
      to: choose
      label: Compare brands and offers
    - from: choose
      to: pay
      label: Place order
    - from: pay
      to: fulfil
      label: Route to kitchen and rider
    - from: fulfil
      to: repeat
      label: Assess quality and reorder
  approximationNotes: This is a workflow map, not a disclosed conversion funnel. Public evidence supports each stage qualitatively but not the conversion rate between stages.
