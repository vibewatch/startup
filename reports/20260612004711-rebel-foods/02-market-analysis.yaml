company:
  name: Rebel Foods
chapter:
  number: 2
  title: Market Analysis
  summary: 'Rebel Foods sits inside a large but definition-sensitive Indian digital food market. Public sources support three concentric lenses: a USD 126.43 billion 2026 foodservice outer TAM, a USD 30.37 billion 2026 QSR adjacency, and a much narrower cloud-kitchen slice measured at roughly USD 1.24 billion in 2025 or USD 1.9 billion by FY26. Broad online-food-delivery estimates vary even more sharply—from Technavio''s USD 734 million narrow revenue lens to USD 46.34-61.19 billion ecosystem estimates—so the most defensible underwriting anchor is repeat digitally ordered meal occasions, not a single giant TAM headline.'
sections:
- id: market-boundary-and-substitutes
  title: Market Boundary, Included Spend, and Status-Quo Substitutes
  body: "Rebel Foods should not be framed as a play on all Indian foodservice spend. The official company materials position Rebel as an internet-restaurant operator that matches brands to recurring meal missions such as lunch, dinner, snacks, and group occasions, and its current format now spans delivery-first brands, food courts, and dine-in-plus-cloud-kitchen franchise bundles. That means the core boundary is digitally ordered, branded, off-premise meal demand and the supply infrastructure that serves it. The boundary can stretch outward into chain-led QSR and hybrid food-court formats, but it should not absorb the entire dine-in, full-service, or independent-restaurant universe just because all of those businesses sell food.\n\nThe excluded categories matter as much as the included ones. Home cooking, untracked offline neighborhood ordering, dine-in-led full-service spend, and grocery or quick-commerce baskets are all important substitutes, but they are not Rebel's core addressable spend\
    \ unless they migrate into repeat app-led ordering occasions. Fortune's broader foodservice dataset reinforces that point: India remains heavily dine-in and full-service, so Rebel's opportunity is a fast-growing subset rather than the whole category. Put differently, Rebel competes first for digitally mediated meal occasions, not for every rupee Indian households spend on eating."
  claimRefs:
  - CM003
  - CM004
  - CM006
  - CM046
  - CM049
  tableRefs:
