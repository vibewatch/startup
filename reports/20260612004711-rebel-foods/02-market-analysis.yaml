- id: sizing-lenses-and-contradictions
  title: Sizing Lenses and Contradictory Market Estimates
  body: "The public sizing evidence supports multiple lenses, not one clean TAM. The broadest outer boundary is India foodservice, which Fortune puts at USD 126.43 billion in 2026. A more comparable off-premise adjacency is India QSR, which Mordor sizes at USD 30.37 billion in 2026. The narrowest format-specific lens is cloud kitchens: ETRetail, citing Wazir Advisors, projected USD 1.9 billion by FY26 from USD 800 million in FY22, while IMARC says the segment reached USD 1.24 billion in 2025 and can grow to USD 3.69 billion by 2034. Those estimates are directionally consistent that delivery-only kitchens are meaningful but still much smaller than total foodservice.\n\nThe hardest contradiction sits inside online food delivery itself. Renub and Research and Markets publish a USD 46.34 billion 2025 estimate, IMARC publishes USD 55.58 billion, and Expert Market Research publishes USD 61.19 billion. Technavio, meanwhile, places the 2025 India food-delivery market at only USD 734.2 million. The\
    \ spread is too wide to treat as simple forecasting noise. It almost certainly reflects different numerators: broad GMV-like ecosystem values at the high end and a much narrower revenue or service-market lens at the low end. For diligence purposes, that contradiction is useful rather than embarrassing, because it forces investors to distinguish between total digital-ordering flow and the monetizable revenue pool available to operators such as Rebel Foods."
