- id: underwriting-implications-and-gaps
  title: Underwriting Implications and Remaining Diligence Gaps
  body: "The correct underwriting stance is disciplined optimism. The public data clearly support that Rebel operates inside a large, still-growing digital food market, but the evidence also shows that the market can be oversized or undersized depending on the definition. The cleanest practical lens is not “all foodservice” and not even every published online-delivery estimate. It is repeat digital meal occasions in urban and increasingly tier-2 corridors where mobile apps, online payments, and aggregator discovery already shape behavior. The cloud-kitchen slice is the best pure-format proxy, but it understates the hybrid routes Rebel now uses through food courts, franchised dine-in-plus-cloud-kitchen formats, and partner brands.\n\nWhat public evidence still cannot prove is Rebel's true serviceable market or economic share of that demand. The company does not publicly disclose order frequency, average order value, contribution margin by brand, direct-versus-aggregator mix, or city-tier\
    \ productivity. Without those metrics, any precise SAM or SOM model would be an assumption stack rather than a verified fact. Investors should therefore preserve the contradictory market estimates on purpose, use them as boundary checks, and focus live diligence on cohort-level repeat behavior, channel mix, and kitchen productivity rather than on one giant headline TAM."
  claimRefs:
  - CM016
