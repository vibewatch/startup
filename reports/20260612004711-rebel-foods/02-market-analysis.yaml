callouts:
- calloutType: insight
  title: Definition-sensitive market, not a single TAM
  body: Rebel Foods clearly participates in a large digital meal market, but the public evidence is too definition-sensitive to justify one headline TAM. Preserving the estimate spread is analytically safer than collapsing it.
  claimRefs:
  - CM012
  - CM013
  - CM014
  - CM015
  - CM016
- calloutType: risk
  title: Aggregator concentration is the main structural market risk
  body: Delivery habit formation benefits Rebel, but Swiggy and Eternal/Zomato still control the discovery layer, while public QSR and cloud-kitchen evidence shows off-premise mix and visibility spending pressure margins.
  claimRefs:
  - CM033
  - CM041
  - CM042
  - CM043
  - CM044
  - CM045
- calloutType: assumption
  title: SOM still needs management data
  body: Public market evidence is sufficient for boundary setting, but not for a clean Rebel-specific SOM. Investors need cohort-level repeat, AOV, kitchen productivity, and channel-mix data before turning this chapter into a revenue model.
  claimRefs:
  - CM050
  - CM051
  - CM052
