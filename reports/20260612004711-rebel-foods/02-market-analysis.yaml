  title: Market Definition Table
  columns:
  - Segment / Category
  - Included Spend
  - Excluded Spend
  - Buyer / Payer
  - Relevance to Rebel Foods
  rows:
  - - Core digital meal ordering
    - Meals ordered through aggregator apps or Rebel-owned digital surfaces for delivery or pickup
    - Offline walk-in meals with no digital ordering trail
    - Consumer buyer / consumer or household payer
    - Core demand pool for Rebel's brands and internet-restaurant model
  - - Cloud-kitchen supply format
    - Delivery-only branded kitchens serving multiple cuisines from shared infrastructure
    - Standalone dine-in restaurant capex and table-service labor
    - Operator buyer / end-customer payer
    - Primary supply format historically associated with Rebel
  - - Hybrid food courts and dine-in plus cloud kitchen
    - Digitally ordered meals plus locations that combine dine-in frontage with delivery kitchens
    - Traditional full-service dine-in expansion with no app-led demand engine
    - Household or group buyer / household payer
    - Relevant because Rebel's current format is no longer purely dark-kitchen
  - - QSR adjacency
    - Repeatable branded meals with fast prep, strong packaging, and high off-premise mix
    - Fine dining, banquet, or experience-led foodservice
    - Consumer buyer / consumer payer
    - Important comparable set for menu, pricing, and frequency behavior
  - - Excluded total foodservice spend
    - Large dine-in-led full-service and independent restaurant spend outside digital ordering
    - None
    - Household buyer / household payer
    - Useful TAM ceiling but not a direct Rebel revenue pool
  - - Status-quo substitutes
    - Home cooking, neighborhood takeout, independent restaurants, rival aggregator-promoted brands, and dine-in occasions
    - None
    - Consumer or household
    - Defines the demand Rebel must convert rather than assume
  notes: Boundary logic follows Rebel's own operating model plus external foodservice data; included and excluded categories are analytical definitions, not company-disclosed TAM buckets.
