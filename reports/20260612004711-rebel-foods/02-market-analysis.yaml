  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: som-gap
    missingEvidence: Brand-level order volume, average order value, contribution margin, and direct-versus-aggregator mix for Rebel Foods.
    whyItMatters: Without these operating metrics, the chapter cannot convert broad India market data into a defendable Rebel-specific SOM or share-of-wallet model.
    diligencePath: Request management cohort data by brand, city tier, channel, and kitchen vintage, plus a bridge from GMV to contribution margin.
    relatedQuestionRefs:
    - QM023
  - type: conflicting-data
    severity: material
    topic: estimate-dispersion
    missingEvidence: A reconciled definition table explaining whether each published estimate measures GMV, platform revenue, or cloud-kitchen segment revenue.
    whyItMatters: Published market sizes span from USD 734 million to USD 61.19 billion for ostensibly similar delivery markets, which can mislead valuation if treated as interchangeable.
    diligencePath: Ask management and sector experts to map each vendor estimate to its numerator, denominator, geography, and inclusion of discounts, grocery, or restaurant-owned channels.
    relatedQuestionRefs:
    - QM007
    - QM022
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: minor
    topic: tier-2-expansion
    missingEvidence: Public city-tier order mix and kitchen productivity data that isolates tier-2 and tier-3 contribution for Rebel Foods or peers.
    whyItMatters: Public reports agree that smaller cities matter, but they do not quantify how much of Rebel's demand or profitability already comes from those corridors.
    diligencePath: Request city-tier GOV, AOV, repeat rate, and payback data from management; compare with peer city-level disclosures if available.
    relatedQuestionRefs:
    - QM014
    - QM015
  - type: missing-source
    severity: minor
    topic: merchant-and-payment-infrastructure
    missingEvidence: A cleaner official dataset linking food-delivery transactions specifically to UPI and merchant acceptance by city and restaurant segment.
    whyItMatters: Digital-payment adoption is clearly a tailwind, but current public datasets are system-wide and do not isolate food-delivery checkout behavior.
    diligencePath: Supplement RBI and NPCI system data with aggregator payment-mix disclosures or merchant acquirer datasets during live diligence.
    relatedQuestionRefs:
    - QM012
