- id: growth-drivers-and-adoption-frictions
  title: Growth Drivers, Channel Power, and Adoption Constraints
  body: "The growth case is real. Cloud kitchens and QSRs appear to be growing faster than the broader market, and both vendor reports and public filings point to the same enabling stack: widespread mobile connectivity, urban time scarcity, digital payment adoption, richer app UX, and denser logistics networks. Delivery platforms themselves still show meaningful scale growth—Swiggy reported 20.5% YoY food-delivery GOV growth in the December 2025 quarter, while Eternal reported FY25 food-delivery NOV of INR 32,862 crore with 853 million orders and 20.6 million average monthly transacting customers. Even if Rebel is smaller than those distributors, those public competitors confirm that the underlying meal-ordering habit remains large and active.\n\nThe friction case is just as important. ICRA says QSR operating leverage remains elusive because off-premise mix carries lower margins, same-store sales are negative, and competition constrains pricing power. Technavio and Nexdigm both describe\
    \ a highly concentrated distribution layer controlled by the top two platforms, while ETRetail/Wazir identifies aggregator dependence, weak direct customer ownership, and high visibility spend as core cloud-kitchen drawbacks. Eternal's own shareholder letter reinforces that the market is not moving to a gentle oligopoly; management explicitly expects competition to intensify. For Rebel, that means market growth does not eliminate channel risk. The company benefits from a larger digital-ordering habit, but it still has to win discovery, repeat usage, and margin inside someone else's demand gateway."
