- id: global-analogs-and-adverse-evidence
  title: Global analogs and adverse evidence
  body: 'Global comparables sharpen the risk assessment. CloudKitchens and Kitopi show one path: own the physical and software layer that lets many brands expand with lower capital. Wonder shows another: combine owned concepts with a major delivery network so demand and food production move closer together. REEF is the counterexample that matters most. Its retreat from unprofitable ghost kitchens toward licensing Reef OS is adverse evidence that delivery-only capacity is not a moat if utilization and compliance do not hold. That lesson transfers directly to India. The sector is growing quickly, digital payments keep expanding, and delivery aggregators remain powerful, but rapid market growth does not guarantee operator-level defensibility. Rebel should therefore be judged less as a generic ''cloud kitchen leader'' and more as a kitchen operating system trying to convert breadth into durable economics before marketplaces, omnichannel chains, and infrastructure-led entrants compress the value
    left at the brand layer.'
