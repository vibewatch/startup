- id: switching-costs-and-moat-durability
  title: Switching costs, lock-in, and what is actually durable
  body: 'The public record supports a moderate moat, but not a hard lock-in story. Rebel''s durable layer sits inside operations: multi-brand launch tooling, franchise and launcher playbooks, kitchen standardization, and the ability to keep one physical kitchen productive across multiple cuisines and demand channels. Those assets can raise switching costs for franchisees, for external brands using the launcher, and for internal teams that already run Rebel''s workflows. But customer-side switching costs are weaker. Consumers can multi-home across Swiggy, Zomato, EatSure, direct apps, and offline chains with almost no friction, and the most popular categories—pizza, biryani, wraps, bowls, snacks, and desserts—already have strong substitutes. The evidence from DoorDash, Uber Eats, and Deliveroo suggests that loyalty programs, demand aggregation, and merchant tooling can be more durable than any one kitchen operator''s menu breadth. Rebel therefore looks strongest where kitchen utilization,
    speed, and cross-brand basket design matter most, and weakest where market access depends on rented discovery or where a specialist can out-position it on a narrow meal mission.'
