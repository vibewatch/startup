- id: TP003
  title: Pricing / packaging comparison
  columns:
  - operator / class
  - public price or take-rate surface
  - included capabilities
  - direct-order or loyalty hook
  - public unknowns
  - implication
  rows:
  - - Rebel / EatSure
    - Consumer-facing app promise of multi-brand ordering without extra delivery charge; realized take rate undisclosed
    - Multi-brand ordering, kitchen routing, portfolio cross-sell
    - EatSure basket convenience and trusted-brand grouping
    - Current direct-order share, realized discounts, and contribution margins are not public
    - Good for basket building, but public proof does not yet show a standalone demand moat on marketplace scale
  - - EatClub / Box8
    - Value-led food-delivery positioning; no retained public commission schedule
    - Single-app ordering for owned brands in major metros
    - App-led offers and convenience positioning
    - Scale, contribution margin, and exact customer-acquisition mix are opaque
    - Competitive on convenience and value, but the retained set shows less infrastructure depth than Rebel
  - - FreshMenu
    - Everyday pricing and weekly menu rotation rather than commission disclosure
    - Cooked-to-order global bowls
    - Menu novelty and premium positioning
    - Current network size and direct-vs-marketplace mix are not public in the retained set
    - More differentiated on cuisine than on distribution economics
  - - BBK
    - Premium handi biryani with 70-90 minute cooked-after-order delivery promise
    - Specialist menu, dine-in plus online delivery
    - Category authority and premium occasion value
    - No public list of current platform commissions or loyalty economics
    - Strong meal-mission brand, but not a broad stack substitute across categories
  - - Swiggy / Zomato marketplaces
    - Public docs show scale and partner onboarding; global analogs suggest meaningful commission and ads surfaces
    - Discovery, logistics, promotions, payments, ratings, and partner tooling
    - Large traffic pools and cross-service ecosystems
    - Negotiated terms, ad spend efficiency, and merchant-level realized take rates remain private
    - Distribution power can absorb a large share of the category economics
  - - DoorDash / Uber / Deliveroo analogs
    - DoorDash posts 15%, 25%, 30% plans; Uber and Deliveroo package demand plus tooling or delivery-only sites
    - Marketplace demand, ad tools, loyalty access, direct-order tooling, or turnkey kitchen expansion
    - DashPass, Uber merchant tools, Editions expansion packages
    - India-specific economics do not map one-for-one from U.S./UK models
    - Useful proof that platform-led packaging can become the dominant merchant-facing commercial surface
  notes: This table compares public commercial surfaces, not true realized merchant economics. Most Indian operators do not disclose contract-level take rates or ad spend intensity.
