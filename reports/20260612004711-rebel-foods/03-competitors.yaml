  evidenceGaps:
  - type: missing-source
    severity: material
    topic: aggregator-realized-take-rates
    missingEvidence: Actual 2026 merchant contracts or cohort-level realized take rates for Swiggy and Zomato, including commissions, ads, and incentive offsets.
    whyItMatters: Public list surfaces and partner guides do not show what Rebel or peer operators actually pay after ads, promos, and negotiated terms.
    diligencePath: Request current partner agreements or anonymized monthly P&Ls by brand and city from Rebel and at least one peer operator.
    relatedQuestionRefs:
    - QP012
    - QP024
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: eatsure-demand-share
    missingEvidence: Current share of Rebel orders and repeat customers coming from EatSure versus Swiggy, Zomato, and other channels.
    whyItMatters: Without channel mix and repeat-rate data, it is impossible to prove that EatSure is already a durable demand moat rather than a convenience layer.
    diligencePath: Obtain channel-mix, repeat-rate, CAC, and contribution-margin data for EatSure versus aggregator channels over the last four quarters.
    relatedQuestionRefs:
    - QP014
    relatedTableRefs:
    - TP004
  - type: private-evidence-only
    severity: material
    topic: kitchen-utilization-and-brand-profitability
    missingEvidence: Kitchen-level utilization, prep times, waste, labor leverage, and brand-level contribution margins for Rebel and close peers.
    whyItMatters: The operational moat thesis depends on whether multi-brand utilization actually converts into superior economics rather than just more complexity.
    diligencePath: Request city-level kitchen scorecards, brand profitability cuts, and external-brand launcher churn for the last 12 months.
    relatedQuestionRefs:
    - QP023
    relatedTableRefs:
    - TP004
  - type: conflicting-data
    severity: minor
    topic: rebel-scale-disclosure-variation
    missingEvidence: A reconciled current count for Rebel internet restaurants and country footprint across official and investor-facing materials.
    whyItMatters: Different public surfaces emphasize different scale numbers, which complicates apples-to-apples benchmarking in the competitor table.
    diligencePath: Ask management for one current canonical scale slide covering kitchens, cities, countries, brands, and active customer counts.
    relatedQuestionRefs:
    - QP002
    relatedTableRefs:
    - TP001
