tables:
- id: TP001
  title: Competitor profile table
  columns:
  - competitor
  - category
  - scale/funding
  - target segment
  - differentiation
  - limitation
  rows:
  - - Rebel Foods
    - Direct multi-brand internet restaurant operator
    - 450+ kitchens in 70+ cities; $210M raised at $1.4B valuation in 2024/25 public reporting
    - Urban meal-delivery buyers and partner brands needing multi-cuisine coverage
    - Rebel OS, EatSure, launcher/franchise tools, broad cuisine portfolio from one kitchen base
    - Owned demand is less transparent than marketplace scale; public proof is stronger on operations than on retention or pricing power
  - - Curefoods / EatFit
    - Direct multi-brand food house
    - Public retained set shows EatFit as a Curefoods brand and Curefoods lists Cakezone Foodtech plus Fan Hospitality as material subsidiaries
    - Health-oriented and mainstream urban food-delivery users
    - Brand-house structure spanning healthy meals and dessert/restaurant subsidiaries
    - Current group-wide kitchen count and realized economics are not cleanly disclosed in the retained public set
  - - EatClub / Box8
    - Direct value-delivery peer
    - EatClub markets itself as a delivery app; Box8 publicly serves major Indian metros
    - Value-seeking urban office and home-delivery orders
    - App-led ordering plus strong city coverage for Indian comfort food
    - Retained official pages reveal less about store count, funding, and direct-order mix than Rebel or public-market aggregators
  - - FreshMenu
    - Premium adjacent substitute
    - Archived 2026 site claims 7M+ customers and a weekly rotating global-bowls menu
    - Urban professionals seeking premium, cooked-to-order global meals
    - Distinct cuisine positioning and everyday pricing rather than giant marketplace assortment
    - Narrower category breadth and less evidence of a scaled kitchen-network moat
  - - Biryani By Kilo
    - Category specialist and omnichannel substitute
    - 70+ dine-in outlets across 29+ cities; acquisition interest from Devyani underscores strategic value
    - Premium biryani and kebab demand missions
    - Cook-after-order handi biryani, premium category authority, dine-in plus delivery
    - Much narrower food mission than Rebel’s portfolio and concentrated around biryani occasions
  - - Wow! Momo / Wow! China
    - Omnichannel QSR challenger
    - 850+ stores across 90+ cities after 200 openings in FY2025-26
    - Impulse, snack, QSR and delivery occasions
    - Offline scale, high-frequency brand recall, and multi-brand expansion
    - Not a like-for-like cloud-kitchen stack; store-heavy model carries different capital and labor profile
  - - Swiggy + Zomato
    - Marketplace distribution incumbents
    - Swiggy food-delivery GOV INR 8,959 crore in Dec-2025 quarter; Zomato FY25 food-delivery NOV INR 32,862 crore with 297k average restaurant partners
    - Restaurants and cloud kitchens seeking demand, logistics, and visibility
    - Own discovery, payments, promotions, and consumer traffic at Indian scale
    - They rent rather than own kitchen-side differentiation, so merchants can still multi-home
  - - CloudKitchens / Kitopi / Wonder
    - Global infrastructure and integrated-delivery analogs
    - CloudKitchens says 600+ brands; Kitopi says 200+ locations in 7 countries; Wonder added Grubhub for national distribution
    - Brands wanting low-capex expansion or integrated mealtime distribution
    - Show how value can migrate toward kitchen infrastructure or bundled demand
    - Not direct India incumbents today, but useful indicators of where moat power may consolidate
  notes: Profile rows mix public scale, funding, and operating proxies because private utilization, retention, and margin disclosures are incomplete for most kitchen operators.
