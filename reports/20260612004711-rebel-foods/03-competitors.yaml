- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - moat claim
  - threat
  - severity
  - mitigation / diligence ask
  rows:
  - - Rebel OS and multi-brand kitchen utilization
    - Competitors can copy category mix or use third-party infrastructure to lower launch friction
    - Medium
    - Test whether kitchen-level utilization and prep-time advantages remain materially better than peers
  - - EatSure owned-demand channel
    - Swiggy and Zomato still own larger discovery pools and consumer habit loops
    - High
    - Request current order-mix split by channel and repeat-rate comparison between EatSure and aggregators
  - - Portfolio breadth across many food missions
    - Specialists such as BBK or FreshMenu can win premium or narrow occasions with sharper identity
    - Medium
    - Track category share by brand family and whether cross-sell truly improves retention
  - - Launcher and franchise expansion
    - Know-how can spread outward, reducing the exclusivity of Rebel’s kitchen playbook
    - Medium
    - Review external-brand economics, churn, and exclusivity terms for launcher/franchise partners
  - - Marketplace presence as growth accelerator
    - Platform commissions, ads, and ranking logic can compress margins or divert demand to rivals
    - High
    - Gather actual take-rate, ads ROI, and ranking sensitivity by brand and city
  - - Cloud-kitchen infrastructure as a moat
    - REEF shows underutilized capacity can retrench quickly if throughput disappoints
    - High
    - Benchmark kitchen utilization, labor leverage, and compliance incidents against best and worst peers
  - - Omnichannel QSR threat
    - Wow! Momo and similar chains can pair offline brand recall with app-based reorders
    - Medium
    - Assess whether Rebel loses repeat snack and impulse missions to store-based chains
  - - Global consolidation risk
    - Wonder + Grubhub and platform-led models show demand plus fulfillment can recombine
    - Medium
    - Monitor whether Indian marketplaces or large QSRs build stronger integrated kitchen networks
  notes: Severity reflects competitive durability risk to Rebel over the next 24-36 months, not insolvency risk or one-year revenue volatility.
