- id: TR006
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Aggregator dependence
    - Direct-order share and blended platform commission
    - Direct orders remain below 25% and blended commissions do not improve over two consecutive quarters
    - Pause aggressive rollout and prioritize channel mix and pricing over footprint growth
  - - Food-safety or municipal enforcement
    - Closure notice, recall, or major contamination event at a shared kitchen
    - Any repeat closure-style action or a multi-brand recall in a core city
    - Freeze new brand launches in affected market and commission independent audit
  - - Financing and valuation pressure
    - Next equity or structured capital raise
    - Raise prices materially below late-2024 levels or comes with restrictive covenants
    - Re-underwrite IPO timing and downside dilution before funding further expansion
  - - Omnichannel capex strain
    - Offline food-court or Wendy's unit payback
    - Site-level payback extends beyond 24 months or store cohort underperforms plan for two reporting cycles
    - Slow physical expansion and redirect capital to fewer higher-conviction locations
  - - Labor and delivery-cost inflation
    - Social-security levy implementation or wage resets
    - Delivery ecosystem cost stack rises without matching price power
    - Reprice menus, renegotiate platform terms, and cut low-contribution SKUs
  - - Data and privacy incident
    - Material breach, regulator notice, or grievance failure trend
    - Any incident requiring mass customer notification or formal regulatory action
    - Suspend marketing campaigns that deepen data collection until controls are remediated
  notes: These are analyst-derived diligence triggers intended to convert the public risk register into monitorable underwriting thresholds rather than management guidance.
