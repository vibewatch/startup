- id: operational-and-partner-dependency
  title: Operational, channel, and partner dependency risk
  body: 'The operational core of the Rebel thesis is that shared infrastructure and technology can offset the fragility of the delivery stack. Public evidence supports the efficiency ambition, but it also highlights the limits. The CCI case is the anchor source: it records a market where restaurants allegedly cannot self-deliver on dominant platforms, where commissions can reach the mid-20s to high-30s, and where the platforms operate their own kitchen programs and private labels. For Rebel, that means customer discovery, delivery reliability, discounting pressure, and visibility algorithms are all shaped by counterparties that also have the ability to privilege affiliated supply. Rebel has responded with EatSure, Rebel OS, Rebel Launcher, and licensing deals; Outlook shows the company investing in a D2C channel, a platform-service model, and an exclusive Wendy''s cloud-kitchen licence. But that diversification brings its own complexity: 10-15 brands can run from one kitchen, brand pages
    confirm a still-live multi-brand portfolio, and shared-kitchen failure modes—wrong-item refunds, food-quality drift, and spillover reputation damage—scale with every added cuisine. Industry research reinforces the sensitivity of the model to aggregator commissions, packaging, and direct-order mix: if own-channel penetration does not exceed a meaningful threshold, the commission burden can keep even a growing kitchen network structurally margin-thin.'
