  evidenceGaps:
  - type: missing-source
    severity: material
    topic: channel-mix
    missingEvidence: Trailing-12-month order or GOV split across EatSure, Swiggy, Zomato, licensed stores, and offline food-court channels.
    whyItMatters: Without current channel mix, it is impossible to verify whether Rebel is actually de-risking platform dependence or only adding complexity on top of the same aggregator base.
    diligencePath: Request monthly order mix, blended commission rates, and gross-margin by channel for the last 12 months.
    relatedQuestionRefs:
    - QR028
    relatedTableRefs:
    - TR004
  - type: private-evidence-only
    severity: material
    topic: fssai-licences-and-inspections
    missingEvidence: Current FSSAI licence numbers, inspection scores, show-cause notices, recall files, and complaint history by kitchen and brand.
    whyItMatters: Food-safety risk is one of the top residual exposures, and public rules alone do not show whether Rebel's internal compliance record is clean across hundreds of kitchens.
    diligencePath: Obtain the full licence registry, recent inspection reports, audit findings, and any internal CAPA tracker for top markets.
    relatedQuestionRefs:
    - QR029
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: debt-and-lease-obligations
    missingEvidence: Current debt covenants, secured-creditor schedule, leased-premises exposure, and payable aging by major counterparty.
    whyItMatters: Valuation pressure and the historical SARFAESI matter make treasury and covenant risk material to any IPO or expansion underwriting case.
    diligencePath: Request board-approved financing summary, covenant headroom analysis, and site-level lease-obligation schedule.
    relatedQuestionRefs:
    - QR030
    relatedTableRefs:
    - TR005
  - type: missing-source
    severity: minor
    topic: wendys-contract-economics
    missingEvidence: The Wendy's development agreement economics, rollout obligations, royalty structure, and cure rights are not public in the retained source set.
    whyItMatters: Licensed-brand expansion is a real growth lever, but contract economics determine whether it improves or worsens Rebel's capital intensity and downside exposure.
    diligencePath: Request the Wendy's India development agreement summary, target cadence, royalty stack, and cohort economics.
    relatedQuestionRefs:
    - QR019
    relatedTableRefs:
    - TR004
  - type: missing-source
    severity: minor
    topic: security-attestations
    missingEvidence: No public security attestation, incident timeline, or DPDPA-readiness memo was surfaced beyond the privacy policy itself.
    whyItMatters: A public privacy policy confirms the data surface but does not prove security maturity, incident response capability, or regulator-readiness.
    diligencePath: Request ISO or SOC-style attestations, recent pentest results, subprocessor inventory, and internal incident-handling SLA.
    relatedQuestionRefs:
    - QR027
    relatedTableRefs:
    - TR002
