companyProfile:
  summary: >-
    Rebel Foods is a Mumbai-based food-tech company founded in 2011 that pioneered the Indian cloud-kitchen
    / internet-restaurant model at scale. The company operates a broad portfolio of digital-first food brands,
    runs the EatSure multi-brand ordering layer, manages licensed or partner formats such as Wendy's India
    online delivery, and increasingly pushes omnichannel formats including food courts, offline stores, and
    brand-launch infrastructure through Rebel Launcher. Public evidence supports meaningful scale, brand breadth,
    and continued investor relevance, but also shows a business still balancing platform dependence,
    operational complexity, and incomplete private-company disclosure.
