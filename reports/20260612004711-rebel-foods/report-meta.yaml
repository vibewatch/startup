  productSummary: Rebel builds and scales delivery-first food brands through shared kitchens, kitchen automation, supply-chain infrastructure, ordering software, EatSure's multi-brand consumer app, and partner or franchise formats.
  customerFocus: Mass-premium urban consumers ordering delivery-first meals and snacks, plus franchise or licensing partners and external brands using Rebel's operating infrastructure.
  businessModel: Revenue is primarily food sales across owned and partner brands, supplemented by EatSure demand capture, franchise or licensing fees, brand incubation, and related platform services.
  stage: late-stage private / unicorn
