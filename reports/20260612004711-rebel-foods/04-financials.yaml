  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: realized-pricing-and-channel-take-rate
    missingEvidence: Realized net price after coupons, cancellations, refunds, and marketplace commissions by brand and channel.
    whyItMatters: Public promo pages prove demand capture but do not show whether direct orders or aggregator orders are contribution positive after incentives.
    diligencePath: Request weekly brand-by-channel order economics, coupon leakage, refund rates, and aggregator commission schedules for FY24-FY25.
    relatedQuestionRefs:
    - QI003
    - QI012
    relatedTableRefs:
    - TI002
  - type: private-evidence-only
    severity: blocking
    topic: sales-efficiency-and-payback
    missingEvidence: CAC, payback period, repeat-order retention, and direct-order cohort performance by brand and city.
    whyItMatters: Margin expansion depends on whether EatSure and brand density lower acquisition cost and improve repeat economics, but public sources do not prove that mechanism.
    diligencePath: Request monthly cohort retention, CAC by acquisition channel, payback by brand, and city-level kitchen utilization for the last 24 months.
    relatedQuestionRefs:
    - QI019
    - QI025
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: blocking
    topic: liquidity-and-runway
    missingEvidence: Unrestricted cash, monthly burn, working-capital timing, debt covenants, and post-funding cash-to-company.
    whyItMatters: The public cash figure is too small relative to annual losses to infer runway, and visible debt plus charges show financing risk matters to the thesis.
    diligencePath: Request cash waterfall, lender agreements, covenant package, payable/receivable aging, and 12-month base/downside liquidity forecast.
    relatedQuestionRefs:
    - QI013
    - QI018
    - QI025
    relatedTableRefs:
    - TI004
  - type: conflicting-data
    severity: material
    topic: valuation-and-primary-secondary-split
    missingEvidence: Signed financing documents or cap-table materials reconciling ET's 2024 secondary-price signal with later 2025/2026 funding reports.
    whyItMatters: Current valuation, dilution, and available cash from recent rounds cannot be underwritten from public articles that point to materially different pricing levels.
    diligencePath: Request round documents, investor-side mark letters, and board materials showing primary proceeds, secondary proceeds, and post-money valuation.
    relatedQuestionRefs:
    - QI016
    - QI017
    - QI024
    relatedTableRefs:
    - TI004
    - TI005
  - type: missing-source
    severity: material
    topic: brand-level-contribution-margin
    missingEvidence: Brand-, kitchen-, and city-level gross margin and contribution-margin disclosure plus realized franchise economics.
    whyItMatters: Without this data, investors cannot tell whether growth in brands, food courts, franchise units, and partner-brand programs improves profitability or only adds operating complexity.
    diligencePath: Request monthly operating model by brand/city, franchise P&L, and Rebel Launcher contract economics with renewal rates.
    relatedQuestionRefs:
    - QI020
    - QI024
    - QI025
    relatedTableRefs:
    - TI003
    - TI005
