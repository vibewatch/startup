- id: cost-structure-and-unit-economics-proxies
  title: Cost structure and unit-economics proxies
  body: |-
    The best public read on Rebel Foods' unit economics comes from cost-bucket trends rather than true contribution-margin disclosure. FY24 operating revenue rose to about INR 1,420 crore while losses narrowed to about INR 378 crore, and the visible bridge shows why: total expenses barely grew, employee costs edged down, and advertising dropped sharply from about INR 197 crore to about INR 133 crore. Entrackr's outside-in unit proxy said Rebel spent INR 1.31 to earn one rupee of FY24 operating revenue. That is still loss-making, but it is a materially better place than the prior year.

    FY25 did not break the model, but it did weaken the growth narrative. Entrackr's FY25 filing-derived coverage shows revenue still grew to about INR 1,617 crore and losses improved again to about INR 336 crore, yet the topline increase slowed to roughly 14% and EBITDA margin remained negative at -10.39%. Materials cost rose to about INR 678.5 crore, brokerage and commission to about INR 243 crore, and advertising rebounded to about INR 153 crore. The rupee-on-rupee efficiency proxy improved to INR 1.23 spent per rupee earned, but that still implies the company has not crossed into self-funding territory.

    The missing metrics are precisely the ones an investor would want most. No public source gives customer acquisition cost, payback, kitchen utilization, brand-level contribution margin, repeat-order retention, or a clean split between aggregator and direct-order cohorts. EatSure's rising share of orders likely helps because it should reduce third-party commissions and improve data ownership, but public sources stop short of proving the magnitude of that benefit. The unit-economics judgment is therefore cautious: the business has shown real cost discipline and modest margin improvement, yet it still lacks the disclosure needed to prove durable per-order profitability by brand, city, or channel.
