  - - Monthly burn
    - Not public
    - Low
    - Runway cannot be computed credibly without monthly or quarterly cash burn
    - Provide monthly burn split into cash operating loss, capex, and financing costs
  - - Runway months
    - Not public
    - Low
    - Outside investors cannot tell whether 2025 debt and 2025/2026 equity fully bridge the next raise
