- id: TI005
  title: Public financial gaps table
  columns:
  - missing private metric
  - impact
  - exact diligence path
  rows:
  - - Brand- and channel-level revenue split
    - Cannot tell whether direct orders, Wendy's franchise rights, Rebel Launcher, or offline formats are truly mix-shifting the business
    - Request audited FY24-FY25 revenue bridge by brand, channel, and geography
  - - Realized contribution margin by brand / kitchen / city
    - Cannot underwrite whether scale improves profit or merely spreads fixed cost across loss-making nodes
    - Request contribution margin waterfalls by brand and by city cohort
  - - CAC, payback, repeat rate, and direct-order retention
    - Without sales-efficiency metrics, the margin case for EatSure and promotions remains narrative-driven
    - Request monthly cohort retention, CAC by channel, and payback by brand
  - - Unrestricted cash, working-capital cycle, and runway
    - Visible cash and visible debt do not reveal actual runway or refinancing pressure
    - Request cash waterfall, vendor payable days, receivable terms, and 12-month liquidity forecast
  - - Round-by-round primary versus secondary split and current valuation
    - Public valuation signals conflict too widely for underwriting dilution or mark-to-market value
    - Request signed financing documents, cap table, and board-approved valuation materials
  - - Franchise and Rebel Launcher contract economics
    - The company discloses an LoI payment and partner-brand counts, but not fee take, payback, or failure rates
    - Request franchise P&L, average setup cost, royalty terms, and partner retention cohorts
  notes: These are the material blockers to underwriting Rebel Foods from public evidence alone. The strongest public data proves scale, losses, and financing activity, but not the private metrics required for a confident margin or runway model.
