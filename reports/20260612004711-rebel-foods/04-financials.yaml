    - Public reports show a USD 25 million QIA investment and a later USD 210 million Temasek/Evolvence report, but valuation and proceeds are not fully reconciled
    - Low-Medium
    - Equity availability matters because public cash is thin relative to losses and debt service
    - Provide signed round documents, secondary/primary split, and actual cash-to-company
