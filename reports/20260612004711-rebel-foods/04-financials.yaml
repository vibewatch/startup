- calloutType: insight
  title: Revenue quality is operational, not software-like
  body: Public evidence consistently shows food sales dominate the P&L. That makes Rebel Foods more underwritable than a vanity-GMV story, but less deserving of software-style multiple assumptions without stronger mix evidence.
  claimRefs:
  - CI017
  - CI040
  - CI051
- calloutType: risk
  title: Visible debt and thin disclosed cash keep financing risk alive
  body: The public record shows priced NCD debt, large open charges, and only modest disclosed cash at March 2025. Without post-round cash detail, runway remains a diligence item rather than a solved question.
  claimRefs:
  - CI035
  - CI037
  - CI045
  - CI053
- calloutType: recommendation
  title: Do not underwrite valuation until the round documents reconcile
  body: Public sources point to both a ~USD 700 million secondary-price signal and a later USD 1.4 billion funding report. Treat current valuation as unresolved until the primary-versus-secondary split and signed cap table are available.
  claimRefs:
  - CI031
  - CI048
  - CI049
  - CI050
