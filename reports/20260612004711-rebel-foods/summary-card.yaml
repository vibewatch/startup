  topStrengths:
    - >-
      Rebel has real operating scale: public sources consistently support roughly 450 kitchens, thousands of internet
      restaurants, broad brand coverage, and multi-city reach.
    - >-
      The company owns meaningful consumer surfaces through EatSure, a portfolio of recognized digital-first brands, and
      partner formats such as Wendy's that broaden distribution.
    - >-
      FY24/FY25 public reporting points to improving revenue scale, narrowing losses, and continued ability to attract
      institutional capital despite a tougher funding market.
  topRisks:
    - >-
      The core model still depends heavily on aggregator economics, discounting, and delivery-platform bargaining power,
      which can re-compress margins even as revenue grows.
    - >-
      Public valuation markers are inconsistent across the same period, and the mostly-secondary late-2024 capital
      context suggests the headline unicorn mark may overstate current clearing price.
    - >-
      Rebel's multi-brand, multi-kitchen footprint creates food-safety, compliance, execution, and capital-allocation
      risk that is not yet offset by filing-grade disclosure.
  unresolvedGaps:
    - >-
      Audited post-FY24/FY25 financial statements, cap-table detail, liquidation preferences, and current debt or
      covenant schedules are not publicly available.
    - >-
      Public sources do not provide brand-level profitability, channel mix, repeat-order cohorts, or
      direct-versus-aggregator contribution economics.
    - >-
      Kitchen-level FSSAI licence inventory, inspection history, and food-safety incident disclosure remain incomplete
      in the public record.
    - >-
      The current valuation anchor is unresolved because late-2024 sources cite roughly $750 million, $800-860 million,
      $1.0 billion, and $1.4 billion outcomes.
