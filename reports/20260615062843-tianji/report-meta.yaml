summary:
  headline: Tianji has real commercial momentum and technical differentiation, but sparse financial disclosure and a stretched unicorn valuation make it a track-not-buy story for new capital today.
  overallScore: 6.3
  recommendation: track
  confidence: medium
  riskRating: high
  valuationStance: stretched
