companyProfile:
  summary: Tianji is a Dongguan-based private robotics company whose strongest public evidence combines force-control technical depth, rapid dual-arm shipment growth, and unusually strong strategic backing from Hillhouse, Meituan, Tencent, and other major Chinese investors. The underwriting debate is whether that traction reflects durable infrastructure value in humanoid and precision-manufacturing robotics, or an early lead being capitalized at a valuation that already discounts several years of successful scale-up despite sparse financial disclosure.
  foundedDate: '2015-05-18'
  founders:
    - name: Chen Xi
      role: Chairman, General Manager, Legal Representative, and founding leader
      background: Public registry filings identify Chen Xi as Tianji's top executive and a 15.23% beneficial owner; company history also references a 2017 robot-subsidiary launch that explains later press descriptions of the business as a 10-year-old company.
      claimRefs:
        - CO001
        - CO008
        - CO011
