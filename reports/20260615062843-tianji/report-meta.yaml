  foundingLocation: Dongguan, Guangdong, China
  headquarters: Dongguan, Guangdong, China
  productSummary: Tianji develops force-controlled dual-arm robots, humanoid arm subsystems, integrated controllers, and software around in-house MEMS joint torque sensing. Its Marvin family is positioned both as a precision-manufacturing robot platform and as infrastructure for humanoid OEMs and embodied-AI developers.
  customerFocus: Precision-manufacturing operators across 3C, automotive, new energy, medical, food, footwear, and construction-machinery workflows, plus humanoid robot OEMs, embodied-AI companies, and research institutions.
  businessModel: Hardware-led B2B sales with integration, training, maintenance, and technical-support attach, plus ecosystem-style supply relationships where Tianji's dual-arm platforms become a subsystem inside customer humanoid robots.
  stage: Series B
  fundingStatus: RMB 1 billion Series B and B+ rounds closed in May 2026 at a reported RMB 8-10 billion post-money valuation, with use of proceeds focused on R&D, mass-production expansion, and global commercial scaling.
