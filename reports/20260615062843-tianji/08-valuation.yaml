  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: financial-opacity
      missingEvidence: >
        Audited revenue, gross margin, operating expenses, cash position, burn rate, and balance
        sheet for Tianji Intelligent for fiscal year 2025 and H1 2026. No financial statements
        have been publicly filed, disclosed in press materials, or referenced in secondary sources.
      whyItMatters: >
        Without confirmed revenue, all implied revenue multiples and scenario model assumptions
        remain estimates. The difference between RMB 250M and RMB 550M estimated revenue creates
        a 2× range in implied valuation multiple (15× vs. 32×), materially affecting whether
        the RMB 8–10B entry price is defensible or speculative.
      diligencePath: >
        Request audited FY2025 financial statements and H1 2026 management accounts directly
        from Tianji management under NDA. Review Changying Precision (300115.SZ) annual report
        for any subsidiary revenue line items or material disclosure obligations regarding Tianji.
      relatedQuestionRefs:
        - QV019
        - QV021

    - type: private-evidence-only
      severity: blocking
      topic: preference-stack-terms
      missingEvidence: >
        Specific terms of Series B and B+ liquidation preferences, anti-dilution provisions,
        participation rights, and pro-rata rights. The B/B+ structure likely introduces stacked
        liquidation preferences but the exact multiple and participation terms are not disclosed.
      whyItMatters: >
        The preference stack governs downside protection and upside sharing across bear and base
        case scenarios. Without these terms, the effective return profile for B investors and
        the dilution exposure for earlier shareholders cannot be modeled.
      diligencePath: >
        Review Series B and B+ term sheets and the amended shareholder agreement, obtainable
        from Tianji's legal counsel under standard investor due diligence procedures.
      relatedQuestionRefs:
        - QV028

    - type: missing-source
      severity: material
      topic: secondary-market-pricing
      missingEvidence: >
        No secondary market transactions or pre-IPO share trading data for Tianji equity were
        found. The absence of secondary market evidence prevents independent validation of the
        RMB 8–10B post-money mark beyond investor-reported figures.
      whyItMatters: >
        Secondary market pricing could either confirm or discount the primary-round valuation,
        providing an independent mark for portfolio management and capital allocation decisions.
      diligencePath: >
        Monitor Changying Precision (300115.SZ) for related-party transaction disclosures or
        equity stake changes. Check platforms such as CartaX, Forge Global, or equivalent
        Chinese pre-IPO trading platforms for any Tianji share listings.
      relatedQuestionRefs:
        - QV035

    - type: enumeration-incomplete
      severity: minor
      topic: comparable-valuation-table
      missingEvidence: >
        Complete mapping of all Chinese embodied-AI component/infrastructure companies with
        disclosed valuations in 2025–2026. The comparable table includes primary 2026 unicorn
        comparables but omits several earlier-stage or undisclosed-valuation peers.
      whyItMatters: >
        A more complete comparable set could reveal whether Tianji's infrastructure-layer
        discount is systematic or idiosyncratic, and whether force-control component providers
        are uniformly valued below OEM peers.
      diligencePath: >
        Systematic sweep of IT Juzi, Tianyancha, and Qichacha databases for Chinese embodied-AI
        component companies with closed rounds in 2024–2026.
      relatedTableRefs:
        - TV003
      relatedQuestionRefs:
        - QV032

