  - id: valuation-context-and-financing-analysis
    title: Valuation Context, Financing Analysis, and Implied Multiples
    body: >
      The May 25, 2026 Series B/B+ close marks Tianji's first externally-priced round since
      early-stage financing within the Changying Precision ecosystem. The combined RMB 1 billion
      raise was structured as back-to-back B and B+ tranches—both closed simultaneously according
      to all public reporting—with post-money valuation cited at RMB 8 billion by EqualOcean and
      "nearly RMB 10 billion" by 36kr and Gasgoo. The variance between these figures likely
      reflects currency conversion timing and whether accrued preference or management fee
      adjustments were applied; both estimates imply unicorn status above the $1 billion USD
      threshold. Crunchbase and InforCapital converted the figure to approximately $1.5 billion USD
      implying a CNY/USD rate near 7.0, while Yicai's own calculation at $147.4M raise / 1B CNY
      implies 6.79 CNY/USD. The range of USD equivalent valuations ($1.1B–$1.5B) reflects
      methodological differences rather than disagreement about the underlying RMB figure.

      Revenue is not publicly disclosed. However, Tianji's reported commercial milestones allow
      a bottom-up revenue estimate. In 2025, the company delivered over 2,000 force-controlled
      dual-arm units in four months to more than 100 clients; separately, the company claims over
      30,000 cumulative industrial collaborative arm shipments since founding. Assuming an ASP of
      RMB 100K–200K for the Marvin Series dual-arm robots (consistent with industrial-grade
      collaborative arm pricing in the Chinese market), 2025 dual-arm segment revenue was
      approximately RMB 200M–400M. Adding legacy industrial arm revenue (estimated RMB 50M–150M
      based on 800+ cumulative customers and lower-ASP SCARA/SR-series) implies total 2025
      revenue in the range of RMB 250M–550M. At RMB 8B post-money valuation, the EV/revenue
      multiple is approximately 15×–32×. At RMB 10B, it is 18×–40×.

      These multiples are high by conventional industrial-robotics standards but are consistent
      with the 2026 Chinese embodied-AI investment cohort, where 18 disclosed deals exceeded
      RMB 1 billion in Q1 2026 alone and approximately 20 companies achieved "near-unicorn"
      (>RMB 10B) valuations according to EmbodiedGlobal and Crunchbase data. Hillhouse's
      parallel investment in TARS Robotics at a $513M seed at a $1.9B USD valuation for a company
      with zero revenue corroborates that the market is applying option-value frameworks rather
      than conventional multiples. The B/B+ tranche structure also introduces liquidation
      preference stacking: if either tranche carries a 1× or higher non-participating liquidation
      preference, early exit or down-round scenarios would return capital to B/B+ investors before
      earlier or common shareholders, compressing effective equity value at lower exit prices.
      The specific preference terms have not been publicly disclosed.
