  - id: comparable-company-analysis
    title: Comparable Company and Funding Analysis
    body: >
      The 2026 China embodied-AI cohort provides the most relevant comparable set for Tianji,
      given the absence of public Chinese robotics peers with similar positioning. Galaxea AI
      raised $435M across two rounds (Feb and Apr 2026) at a reported $1.4B USD valuation—a
      pure-play humanoid OEM with two years of operation. Spirit AI raised $435M Series A total
      at a $1.5B valuation (Feb–Apr 2026), positioning itself as a "universal brain" software
      layer for robots. EngineAI raised $200M Series B at a $1.5B valuation for full humanoid
      and quadruped robots. TARS Robotics attracted a $513M seed at $1.9B valuation—one year old
      with no revenue. These four peers suggest a Chinese embodied-AI valuation range of $1.4B–
      $1.9B USD for early-commercial or pre-revenue companies as of Q1–Q2 2026.

      Tianji's $1.1–$1.5B USD valuation sits at the lower end of this cohort despite having the
      strongest demonstrated commercial traction: 2,000+ units shipped in 2025, 10,000+ units
      in Q1 2026 backlog, 45 OEM customers, and over 10 years of industrial robotics experience.
      This discount relative to pure-play OEM peers likely reflects: (a) infrastructure-layer
      positioning (components supplier rather than end-product brand), (b) Changying Precision
      governance constraints, and (c) the absence of disclosed standalone financials.

      For global context, Figure.ai (US) raised $1B+ Series C at a $39B valuation—a magnitude
      above the Chinese cohort reflecting US market premium, but also illustrating the potential
      ceiling for leading humanoid platforms if the sector matures. Unitree Robotics filed for
      a Shanghai Stock Exchange IPO in March 2026 targeting a $3–7B valuation, providing a
      public market reference point for a Chinese company with strong unit volume but competing
      in a different product tier (consumer/professional quadruped robots).

      For M&A comparables, AgiBot's $290M acquisition of Swancor Advanced Materials in 2025
      demonstrated that Chinese embodied-AI companies can access public market liquidity through
      reverse merger structures, establishing an alternative exit pathway for Tianji investors
      beyond a direct IPO.
