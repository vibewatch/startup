chapter:
  number: 8
  title: Valuation
  summary: >
    Tianji Intelligent completed a combined Series B and B+ round of RMB 1 billion (approximately
    $140–147M USD) in May 2026, co-led by Hillhouse/GL Ventures and Meituan Strategic Investment,
    with Tencent, Gaorong, GGV/Granite Asia, and Luminous Ventures participating. The post-money
    valuation was reported at RMB 8 billion (EqualOcean) to "nearly RMB 10 billion" (36kr, Gasgoo),
    equivalent to approximately $1.1–1.5B USD, certifying unicorn status. No audited revenues,
    gross margins, or financials have been publicly disclosed. Based on disclosed order data—over
    2,000 dual-arm units delivered in four months of 2025 and a Q1 2026 backlog exceeding 10,000
    units—and industry ASP estimates of RMB 100K–200K per dual-arm unit, the implied enterprise
    value/revenue multiple ranges from approximately 20× to 40×. This is high but consistent with
    the 2026 China embodied-AI funding cohort, where sector peers Galaxea ($1.4B), Spirit AI ($1.5B),
    EngineAI ($1.5B), and TARS Robotics ($1.9B) command similar or higher multiples on smaller
    commercial track records. The bullish thesis rests on Tianji's infrastructure positioning
    serving 45 OEM clients, proven mass-delivery capability, and the 15th Five-Year Plan tailwind.
    The anti-thesis centers on no disclosed financials, pilot-heavy humanoid market, IFR's explicit
    May 2026 warning that humanoid capabilities "remain limited to demonstrators or pilot projects"
    in real-world production, and governance overhang from Changying Precision's controlling stake.
    Bull/base/bear scenarios place fair value in the range of RMB 4–30 billion, and the overall
    stance is conditional-hold for current investors at the Series B entry price, with caution on
    new money at this valuation until audited financials are available.

sections:
  - id: investment-thesis-and-anti-thesis
    title: Investment Thesis and Anti-Thesis
    body: >
      The investment thesis for Tianji at a RMB 8–10 billion valuation rests on four interlocking
      arguments. First, market structure: China's humanoid robotics sector is consolidating around
      a small number of infrastructure providers, and Tianji's force-control expertise—evidenced
      by 289 authorized patents, proprietary MEMS joint torque sensors, and the only mass-produced
      force-controlled humanoid dual-arm in the world—positions it as a near-unavoidable component
      for OEM integrators. Serving 45 global humanoid OEM manufacturers creates structural stickiness
      and cross-portfolio diversification that single-OEM plays lack. Second, commercial traction:
      delivering 2,000+ dual-arm units in four months of 2025 and accumulating over 10,000 units
      of Q1 2026 backlog provides the strongest near-term commercial proof in the Chinese force-control
      segment. Third, policy tailwind: China's 15th Five-Year Plan (2026–2030) designates
      AI-powered robots as a core national strategic priority, and as of May 2026, the IFR confirmed
      China accounts for 54% of global industrial robot installations—creating a large domestic
      addressable base for infrastructure upgrades as humanoid adoption scales. Fourth, investor
      quality: the round was co-led by Hillhouse (which simultaneously led the $513M TARS Robotics
      seed round), Meituan (a potential humanoid deployment customer), and included Tencent—suggesting
      conviction from the highest tier of Chinese venture capital.

      The anti-thesis is equally substantive. Most critically, Tianji has disclosed no audited
      revenue, gross margin, cash burn, or balance sheet data. Any multiple calculation rests on
      estimated rather than confirmed financials. Second, customer concentration is opaque: while
      45 OEM customers are cited, their individual identities, financial health, and order
      concentration are undisclosed, making it impossible to assess revenue dependency on any
      single buyer. Third, the IFR noted explicitly in May 2026 that despite impressive public
      demonstrations—including the humanoid robot half-marathon in Beijing—"actual capabilities
      in real-world production scenarios are currently limited to demonstrators or pilot projects."
      This directly challenges the revenue ramp assumptions embedded in the current valuation.
      Fourth, the Changying Precision governance overhang (27% of equity, controlling parent)
      creates principal-agent risk: Changying's priorities as an Apple/Tesla supply chain
      manufacturer may diverge from Tianji's standalone growth trajectory. Fifth, the strategic
      investor mix (Meituan, Tencent) introduces information asymmetry risks for financial
      investors: corporate strategics may exercise influence over partnerships, supply chain
      access, or exit timing in ways that create friction with pure return maximization.
