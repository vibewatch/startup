  - id: buyer-segments-adoption
    title: Buyer Segments and Adoption Pathways
    body: >
      Tianji's buyer base splits into three distinct segments with different budget dynamics, technical
      requirements, and adoption timelines. The primary and fastest-growing buyer class is humanoid-robot
      OEM manufacturers—companies building complete humanoid robots that require high-performance arms.
      As of Q1 2026 Tianji serves 45 such OEMs globally, including a reported 30+ domestic Chinese humanoid
      manufacturers. These buyers typically integrate Tianji's force-controlled dual arms as a bill-of-material
      component, making Tianji a Tier-1 arm supplier in the emerging humanoid value chain. This OEM segment
      is characterised by small initial orders (prototyping and algorithm-training phase), rapidly scaling
      to production quantities once platform designs are locked. The buyer is typically the robotics company's
      hardware engineering team; the payer is the OEM's capital budget. OEM adoption is triggered by the
      inability to develop proprietary force-sensing arms in-house—the MEMS torque sensor R&D cycle and
      production ramp take 3–5 years, making it more efficient to source from Tianji.


      The second buyer class is precision-manufacturing operators—primarily 3C electronics assembly,
      automotive component lines, and shoe/apparel manufacturing—who need flexible automation for tasks that
      rigid industrial robots cannot perform reliably. Tianji's application cases page identifies 3C
      electronics, shoe/garment manufacturing, construction machinery, and automotive manufacturing as
      active verticals. China's electronics sector is the world's largest user of precision robots (64%
      of global electronics-robot stock), and new demands from consumer electronics assembly—where many
      tasks remain manual due to delicacy requirements—create strong pull for force-sensitive arms. Budget
      ownership in this segment shifts to factory operations and automation capex teams, with payback periods
      of 18–36 months typical for cobot investments.


      The third segment is research institutions and embodied AI algorithm-development companies, who purchase
      force-controlled arms as a training and dataset-collection platform. This segment has high willingness
      to pay for leading-edge hardware but modest volume; it serves as an important early adopter and
      reference customer class that validates Tianji's technology before high-volume OEM deployments.
      Pricing for this segment tends to be higher on a per-unit basis, subsidising the R&D cost of ongoing
      platform improvements. Adoption is triggered by the emergence of embodied-AI large-model research
      requiring physical world interaction at scale.
