callouts:
  - calloutType: risk
    title: IFR Cautions Against Near-Term Humanoid Mass Deployment
    body: >
      The International Federation of Robotics explicitly states that "mass adoption as universal humanoid
      factory helpers will not happen within the near- and medium-term future" and that the 15th 5YP
      places humanoid commercialisation "towards the end of the plan's period" (circa 2030). IFR further
      notes that current humanoid capabilities "are currently limited to demonstrators or pilot projects."
      Tianji's most valued growth catalyst—OEM humanoid customers scaling to mass production—faces a
      credible structural timeline risk from this expert-level assessment.
    claimRefs:
      - CM006
      - CM007
      - CM009

  - calloutType: insight
    title: Tianji's Order Backlog as a Bottom-Up Market Signal
    body: >
      With 10,000+ units in Q1 2026 backlog across 45 OEM customers, Tianji's commercial traction is the
      most granular bottom-up signal available for the force-controlled arm sub-market. This exceeds what
      any available top-down analyst market model captures for this specific sub-segment, and serves as a
      real-money proxy for near-term addressable unit demand. However, these are orders (not deliveries
      or revenue), and the 45 OEM clients span a wide range of funding and commercialisation maturity.
    claimRefs:
      - CM020
      - CM021

  - calloutType: assumption
    title: Force-Controlled Arm Sub-Market Not Directly Supported by Published Data
    body: >
      No published analyst report cleanly sizes the force-controlled dual-arm segment as supplied by Tianji
      to humanoid OEMs. The $300–600M analytic estimate in this chapter is an inference from order volume
      and industry ASP comparables. All downstream revenue and valuation projections should apply wide
      confidence intervals to this estimate.
    claimRefs:
      - CM020

