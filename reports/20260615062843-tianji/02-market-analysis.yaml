  - id: market-sizing-investment
    title: Market Sizing and Investment Landscape
    body: >
      Market sizing for force-controlled humanoid arms involves layering three data anchors because no
      single report covers the sub-segment cleanly. First, the IFR confirms China as the world's largest
      robot market, with an operational stock of ~2 million units (4.5× Japan's) and local suppliers
      growing from 30% to 57% of domestic installations between 2020 and 2024. For electronics—the sector
      where force-controlled dexterous manipulation is most urgently needed—China hosts 64% of global
      industry robot installations, and Chinese manufacturers supply 59% of that. Second, MarketsandMarkets
      sizing shows the China humanoid-robot market at $400 million in 2025 rising to $2.8 billion by 2030
      (47.6% CAGR); the global intelligent-robotics market adds another lens at $14 billion (2025) to $50
      billion (2030) at 29% CAGR. Third, the China-specific investment wave provides a real-money proxy:
      embodied-AI startups in China raised approximately 30 billion yuan (~$4 billion) in Q1 2026 alone,
      with capital shifting from concept-stage bets to companies that can demonstrate commercial closed-loops
      and engineering execution depth.


      Tianji's achieved commercial metrics further bound the estimate from the demand side. An order backlog
      exceeding 10,000 units in Q1 2026, 45 active OEM customers (humanoid robot manufacturers and embodied
      AI unicorns), and 800+ legacy industrial customers collectively imply an annual addressable unit volume
      in the low-tens-of-thousands for force-controlled dual-arm systems in the near term—growing to
      potentially hundreds of thousands as humanoid OEMs scale toward mass production. At a $5,000–$15,000
      per-arm estimated ASP (inferred from industry cobot pricing; Tianji has not publicly disclosed pricing),
      the addressable revenue for force-controlled dual arms could plausibly reach $300–600 million annually
      by 2027 for the China-addressable slice. This is an analytic estimate, not a published figure, and
      should be treated with high uncertainty.


      The China Development Report 2025 (a government advisory document) forecasts the broader embodied
      intelligence industry reaching 400 billion yuan by 2030 and exceeding 1 trillion yuan by 2035. These
      figures reflect a wide industrial-AI scope and should not be mapped directly onto Tianji's TAM; they
      provide directional policy ambition rather than bottom-up demand sizing.
