  - id: china-embodied-ai-peers
    title: China Embodied-AI Peers and Capital Market Context
    body: >-
      China's embodied-AI startup ecosystem attracted $5.6 billion in venture investment through mid-May
      2026 across 176 deals — matching China's full-year 2021 record and exceeding the $4.3 billion raised
      across all of 2025, according to Crunchbase data. The most heavily funded peers include Galaxea AI
      ($435 million total in 2026, $1.4 billion valuation), EngineAI ($200 million Series B, $1.5 billion
      valuation), TARS Robotics ($513 million seed, $1.9 billion valuation), and Spirit AI ($435 million
      combined Series A, $1.5 billion valuation). These companies are primarily full-system humanoid robot
      builders, not force-control component suppliers, and they compete for the same humanoid platform
      customer budget at a different layer of the stack.

      Figure AI, the highest-valued standalone humanoid robotics company globally, closed its Series C
      at a post-money valuation of $39 billion with more than $1 billion in committed capital. Figure's
      AI platform (Helix) targets homes and commercial operations as a full end-to-end system, making it
      a different class of competitor from Tianji: it competes for the humanoid platform budget but not
      for the force-control arm component supply relationship.

      AgiBot's July 2025 acquisition of 63.62% of publicly listed Swancor Advanced Materials for
      approximately $290 million illustrates the liquidity-path dynamics that matter for competitive
      context: China humanoid AI startups are increasingly pursuing reverse-merger structures for public
      listing, with Unitree Robotics filing for an IPO on the Shanghai Stock Exchange in March 2026
      targeting a $3 billion to $7 billion valuation as a key capital-market benchmark. Agilink, spun out
      of AgiBot in 2026, specifically focuses on dexterous hand technology licensed to the broader
      robotics market, making it a nascent but direct component-supply competitor to Tianji.

      China precision-robot manufacturers (ROKAE, Estun, AUBO, Fairino) represent an important incumbent
      segment with existing factory and customer relationships that could extend into humanoid arm supply,
      but their product pages were inaccessible or uninformative during this research run, and their
      specific overlap with Tianji's force-control architecture cannot be verified from public sources.
