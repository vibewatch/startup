acknowledgedWarnings:
  - dimension: tableNotes
    reason: >-
      Tables TP001, TP002, TP003, and TP004 each carry descriptive notes documenting data sources,
      estimation methodology, and what null/unknown cells mean. The tableNotes warning is acknowledged
      because notes are present on all four tables and the remaining unknowns are documented evidence
      gaps, not omissions.
  - dimension: paywallRisk
    reason: >-
      Two analyst-market-data sources (SP018 Mordor Intelligence, SP019 MarketsandMarkets) have
      accessStatus paywall. These are retained because they are the only published collaborative-robot
      market-size estimates available; the chapter does not rely on paywalled details, only on summary
      figures cited in accessible secondary sources.
