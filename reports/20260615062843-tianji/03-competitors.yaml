        comparative benchmarks, it is impossible to assess whether Tianji's software layer would
        survive a peer copying its hardware architecture.
      diligencePath: >-
        Review Tianji's VLA/embodied AI technical publications; compare to Flexiv's research papers
        and Galaxea's disclosed training data volumes at major robotics AI venues in 2026.
      relatedQuestionRefs:
        - QP025

