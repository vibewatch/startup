company:
  name: Guangdong Tianji Intelligent System Co., Ltd.
chapter:
  number: 3
  title: Competitors
  summary: >-
    Tianji occupies a narrow but high-value niche as a force-controlled dual-arm humanoid component
    supplier that has no direct public-data equivalent among either legacy cobot incumbents (ABB YuMi,
    Universal Robots) or the new class of full-system embodied-AI peers (Figure AI, Galaxea AI,
    EngineAI). Global cobot incumbents lack dual-arm force-control products targeting humanoid OEM
    applications; China embodied-AI startups primarily compete at the full-robot-system level rather
    than the arm-component supply tier. Flexiv and Agile Robots represent the closest force-control
    technology peers but have not publicly demonstrated shipment scale comparable to Tianji's Q1 2026
    claim of 10,000+ units. Displacement risk is real but deferred: the largest near-term threats are
    internal arm design by major humanoid OEM customers and low-cost Chinese copycats, not established
    cobot incumbents. The chapter preserves substantial uncertainty around China precision-robot peers
    (ROKAE, Estun, AUBO) whose websites were inaccessible during this research run.

sections:
  - id: competitive-landscape
    title: Competitive Landscape Overview
    body: >-
      Tianji competes across three overlapping but structurally distinct competitive segments. The first
      segment consists of global dual-arm and collaborative robot incumbents — primarily ABB (YuMi),
      Universal Robots, and to a lesser extent Kawasaki and Yaskawa — that hold dominant positions in
      general-purpose cobot automation but have not launched dedicated force-control dual-arm products
      targeting humanoid robot OEM assembly. These incumbents bring significant distribution scale,
      ecosystem trust, and installed-base inertia but are architecturally oriented toward tabletop
      small-parts assembly rather than humanoid torso integration.

      The second segment comprises force-control and adaptive robot specialists — chiefly Flexiv and
      Agile Robots — that share Tianji's technical positioning around force-torque sensing and AI-assisted
      manipulation but appear to focus on single-arm industrial deployments rather than the humanoid OEM
      supply chain. The third segment is the embodied-AI full-system layer: China-based humanoid startups
      (Galaxea AI, EngineAI, TARS Robotics, Unitree Robotics, AgiBot) and US-based peers (Figure AI,
      Hark) that raise capital at valuations orders of magnitude above Tianji's and compete for the same
      end-market budget at the platform level, not the component tier.

      Against this landscape, Tianji's defensible position rests on being the only public-data supplier
      shipping force-controlled humanoid arms at five-digit quarterly volumes to a multi-OEM customer
      base — a scale claim that no reviewed source attributes to any direct peer as of June 2026. China
      accounted for 54% of annual global industrial robot installations as of 2024, per the IFR World
      Robotics 2025 Report, and China's local supplier share in domestic installations rose from 30% in
      2020 to 57% in 2024, underscoring both the structural advantage and the intensifying domestic
      competition that Tianji must navigate.
