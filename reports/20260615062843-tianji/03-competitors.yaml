callouts:
  - calloutType: risk
    title: Agilink and Internal Arm Design Are the Clearest Near-Term Threats
    body: >-
      The competitive threat most likely to materialise in the 2026–2028 window is not an incumbent
      cobot player (too slow product cycle) or a full-system embodied-AI startup (different supply tier),
      but rather (1) AgiBot's Agilink spinout pursuing a direct licensed-component model for dexterous
      hands with a path to dual-arm force-control, and (2) Tianji's largest OEM customers reaching the
      scale at which in-house arm design becomes economically rational. Both scenarios erode the OEM
      dependency that underpins Tianji's moat without requiring a new entrant to build from scratch.
    claimRefs:
      - CP014
      - CP024
      - CP030
      - CP034

  - calloutType: assumption
    title: China Precision-Robot Peer Data Gap Is Potentially Material
    body: >-
      ROKAE, Estun, AUBO, and Fairino collectively represent an established tier of China-based cobot and
      precision-robot manufacturers with existing factory relationships that could be extended into humanoid
      OEM supply. Their product overlap with Tianji's specific force-control niche cannot be assessed from
      currently available public data. If any of these peers have launched or are near-launching
      force-control dual-arm products, Tianji's domestic competitive position would be more contested
      than the current evidence suggests.
    claimRefs:
      - CP021
      - CP022

