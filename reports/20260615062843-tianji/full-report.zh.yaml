  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与客户应用
        blocks:
          - type: paragraph
            body: >-
              Tianji 的商业产品组合分为四层。旗舰层是 Marvin 人形机器人力控双臂系列：Marvin M3（每臂 3 kg 负载、615 mm 臂展、±0.05 mm 重复定位精度、7.5 kg
              机身重量）、Marvin M6CCS（6 kg、696 mm、±0.03 mm、11 kg、交叉腕配置）和 Marvin M6SRS（6 kg、686 mm、±0.03 mm、标准腕）。三款机型都在七轴上配备
              MEMS 关节扭矩传感器，并使用 EtherCAT 通信，周期时间 ≤1 ms。第二层是 Pilot 7，这是一款单臂 7 轴协作机器人，额定 7 kg 负载、1,066 mm 臂展、±0.03 mm
              重复定位精度，并具备 IP54 密封。第三层覆盖工业机器人：EVO 六轴系列（4–25 kg、IP67）、TR 系列（最高 8 kg、IP67、±0.02 mm）、SR SCARA 系列（3–20 kg）和
              SRX8 高速 SCARA。机器人硬件由 TRC-Micro、SRC-Micro 控制器，以及 MotoSim EG-VRC 离线仿真软件套件支撑。

              客户应用集中在三类垂直场景。3C 电子精密装配中，Tianji 的力控臂执行 PCB 插装、连接器耦合和对扭矩敏感的拧螺丝任务，这些任务超过传统刚性协作机器人的精度上限。具身 AI 研发中，这些手臂作为人形机器人
              OEM 团队的数据采集平台，用来训练需要高保真真实世界力反馈数据的基础模型。精密制造中——包括汽车子装配、制鞋和金属表面处理——力顺应能力让抛光、打磨和软材料搬运任务可以落地。公司称，截至 2026 年
              Q1，已服务超过 45 家人形机器人 OEM 客户，历史工业客户超过 800 家。Tianji 在 2025 年前四个月交付了超过 2,000 台力控人形机器人双臂单元，2026 年 Q1 订单超过 10,000
              台——按公司说法，它已成为全球出货量最大的人形机器人力控手臂供应商。
