          - type: callout
            title: 天机在手订单是自下而上的市场信号
            body: >
              2026 年 Q1，天机在 45 家 OEM 客户中拥有 10,000+
              台在手订单，这一商业牵引是力控机械臂子市场目前最细颗粒度的自下而上信号。它超过任何可用自上而下分析师市场模型对该特定子赛道的捕捉，并可作为近期可服务单位需求的真实资金代理。但这些是订单，不是交付或收入；45 家
              OEM 客户的融资和商业化成熟度跨度很大。
            calloutType: insight
