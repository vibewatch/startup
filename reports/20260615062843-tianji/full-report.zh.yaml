      - number: '7.4'
        title: 客户集中、市场时点与竞争风险
        blocks:
          - type: paragraph
            body: >
              Tianji 最具战略意义的客户层——45 家全球人形机器人 OEM 和具身 AI 独角兽账户——也是最不透明、最集中的风险敞口。任何 Series B 公告渠道（EqualOcean、Gasgoo、Yicai
              Global、Pandaily、RobotToday）都未披露单个客户名称；公司官网和应用案例页也没有列出任何商业账户。2026 年 Q1 10,000+
              台积压订单未说明这些是具约束力的采购订单、意向书还是框架协议，也没有公开数据说明 45 家客户之间的订单规模分布。如果少数账户——比如三到五家——贡献了大部分积压订单，Tianji
              面临的客户集中风险就接近一家只有单一战略锚定客户的公司。任何主要 OEM
              客户融资受阻、项目取消或转向竞争方案，都会对收入造成过大冲击。市场时点是增长论点最根本的风险。IFR——全球最可信的机器人行业机构之一——在 2026
              年中明确指出，尽管公开演示很有吸引力，人形机器人「在真实生产场景中的实际能力目前仍局限于演示或试点项目」。这一观点意味着，45 家正在做人形机器人的 OEM 客户本身还处于试点 / 商业化前阶段，因此
              Tianji 手臂被采购用于集成和测试，而不是用于持续性生产收入。若其 OEM 客户商业化时间线延迟 12–24 个月，复购率会大幅下降，¥8B 估值也会面临下修。AgiBot、Agile Robots
              等公司也提供竞争性力控机械臂方案，说明 Tianji 产品差异化正承受活跃竞争压力。Stanford HAI AI Index 确认，全球 AI 和机器人投资在 2024–2025
              年达到创纪录水平；历史上，这一模式通常与周期顶部融资动力和后续估值修正相关。
