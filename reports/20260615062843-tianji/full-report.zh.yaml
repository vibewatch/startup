      - number: '2.5'
        title: 图表
        blocks:
          - type: callout
            title: IFR 警示近期人形机器人大规模部署不现实
            body: >
              International Federation of Robotics 明确表示，「作为通用人形工厂助手的大规模采用不会在近期和中期发生」，并称「十五五」把人形机器人商业化放在「规划期末」（约 2030
              年）。IFR 进一步指出，当前人形机器人能力「目前局限于演示机或试点项目」。天机最有价值的增长催化剂——OEM 人形机器人客户放量量产——因此面对来自专家评估的可信结构性时间风险。
            calloutType: risk
            claimRefs:
              - CM006
              - CM007
