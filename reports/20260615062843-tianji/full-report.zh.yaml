  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              天机面对三个相互重叠但结构不同的竞争细分。第一类是全球双臂和协作机器人在位者，主要包括 ABB（YuMi）、Universal Robots，以及程度较低的 Kawasaki 和 Yaskawa。它们在通用
              cobot 自动化中占据主导地位，但尚未推出面向人形机器人 OEM 组装的专用力控双臂产品。这些在位者拥有显著的渠道规模、生态信任和装机基础惯性，但架构上更偏向桌面小件装配，而非人形躯干集成。

              第二类是力控和自适应机器人专家，主要是 Flexiv 和 Agile Robots。它们与天机在力 / 扭矩感知和 AI 辅助操作上技术定位相近，但似乎更聚焦单臂工业部署，而非人形机器人 OEM
              供应链。第三类是具身 AI 整机系统层：中国人形机器人创业公司（Galaxea AI、EngineAI、TARS Robotics、Unitree Robotics、AgiBot）和美国同行（Figure
              AI、Hark）。它们融资估值比天机高出数量级，并在平台层而非组件层争夺同一终端市场预算。

              在这一格局下，天机的可防守位置建立在一点上：它是公开数据中唯一以五位数季度规模向多 OEM 客户群出货力控人形机械臂的供应商——截至 2026 年 6 月，本次审阅来源没有把类似规模归因给任何直接同行。IFR
              World Robotics 2025 Report 显示，截至 2024 年，中国占全球年度工业机器人安装量 54%，且中国本土供应商在国内安装中的份额从 2020 年 30% 升至 2024 年
              57%，同时凸显天机必须应对的结构优势和愈发激烈的国内竞争。
