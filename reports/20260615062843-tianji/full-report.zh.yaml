      - number: '4.4'
        title: 财务结论与尽调阻断项
        blocks:
          - type: paragraph
            body: >
              Tianji 的财务画像结构性不透明，难以承保。公司从未披露任何期间的收入、毛利率、净亏损或现金余额；私营公司架构也没有监管披露义务。因此，RMB 8–10 billion
              的估值完全压在战略叙事上——订单积压规模、专利组合、投资人背书，以及身处创投资金创纪录涌入的赛道——而不是经审计的财务基本面。


              三类风险需要提高权重。第一，IFR 在 2026 年 5 月的分析明确称，人形机器人在工厂内大规模采用「在近中期不会发生」，直接削弱支撑该估值的需求假设。第二，中国具身 AI 融资潮（截至 2026 年 5
              月中旬已投入 $5.6 billion）带有政策放大的炒作周期特征：多家资金充足的竞争者同时争夺全球约 45 家人形机器人 OEM 账户。第三，已披露的 2026 年 Q1 10,000+
              台积压订单来自公司口径且未经审计；它到底是确定采购订单，还是软性意向书，对任何收入预测都很关键。


              积极面在于，Tianji 在 2025 年四个月交付 2,000
              台的表现，是目前最强的生产执行信号，把它同纯原型阶段的同行区分开。投资人名单（Hillhouse、Tencent、Meituan）在中国科技生态中有可信度。不过，任何严肃的投资或合作尽调，都必须拿到经审计财务、董事会层面的收入确认、客户合同对积压订单分类的确认，以及对
              Everwin 持续资本和制造关系的判断。
