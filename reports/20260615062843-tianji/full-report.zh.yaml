      - number: '5.3'
        title: 控制软件栈与开发者接口
        blocks:
          - type: paragraph
            body: >-
              Tianji 的软件平台包括 MotoSim EG-VRC 离线机器人仿真，以及 MotoPlus C 语言二次开发 SDK。MotoSim EG-VRC
              结合虚拟机器人控制（VRC）和虚拟示教器（VPP），让工程师在部署到实体硬件前离线仿真并编程机器人路径。支持的控制器型号包括 NX100、YRC1000、DX100、DX200、FS100 和
              TRCmicro——这一命名方式与 Yaskawa Electric 的控制器产品线高度相似，也反映 Tianji 创始团队来自 Yaskawa-Everwin 联合研发项目的工程传承。对 Yaskawa
              工具链的依赖，可能限制 Tianji 独立做出软件能力差异化的空间。

              MotoPlus SDK 允许用户把 C 语言任务直接嵌入机器人控制器，以原生速度执行，并覆盖任务控制、机器人运动、I/O 和网络通信 API。这让软件层成为一个面向开发者的平台，可在 OEM
              集成流程中定制力控行为。补充力控功能包括基于传感器和视觉的传送带跟踪、使用专有算法的力反馈装配 / 打磨 / 抛光模式，以及软浮动（伺服浮动）位置与力协同控制功能，让机械臂在运行中顺应外力。硬件控制层使用
              TRC-Micro 控制器（单相 AC220/230 V、IP20、200,000 步存储、10,000 条命令缓存、0–40 °C 工作范围）和 SRC-Micro 控制器（三相 AC220
              V、IP20、8.15 kg）。可选外设包括专有示教器、数字和模拟 I/O 板，以及现场总线通信单元。
