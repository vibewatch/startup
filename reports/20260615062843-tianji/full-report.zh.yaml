      - number: '5.5'
        title: 质量、安全、合规与技术风险
        blocks:
          - type: paragraph
            body: >-
              Marvin M6CCS 具备 CE 标志、ISO/TS 15066:2016（协作机器人安全与人机交互）、ISO 13849-1 PLd(Cat.3)（控制系统功能安全）、EN
              60204-1:2018（电气设备安全）、EN IEC 61000-6-4-2，以及 EN ISO
              12100:2010。这些认证列在官方产品规格页上；但未发现独立测试实验室证书、公告机构评估报告或公开可查的认可记录。公司称，截至 2026 年 Q1，产线一次通过率超过
              99.5%，但外部审计数据没有佐证。TCP 最高速度 2 m/s 和 180°/s 关节速度均为公司指定参数，尚未获得独立验证。

              四类重大技术风险需要尽调关注。第一，所有量化性能主张——5 ms 控制延迟、1.89 mm 平均轨迹误差、160 Hz 扭矩带宽、≤0.3 N·m MEMS 精度——完全基于 Tianji 自身内部测试；截至
              2026 年 6 月，未发现第三方基准、学术论文或独立实验室验证。第二，MotoSim EG-VRC 仿真软件和 TRCmicro/NX100/YRC1000 控制器命名方式显示其显著承袭 Yaskawa
              Electric 平台，可能限制软件 IP 独立性。第三，未发现 Marvin 力控臂系列公开可得的 MTBF 数据、长期耐久性统计或安全事故报告。第四，Bloomberg 2026 年 4
              月关于中国人形机器人热潮的报道指出，整个品类普遍存在性能主张被过度包装的担忧——这一风险也结构性适用于 Tianji 未验证的基准数字。
