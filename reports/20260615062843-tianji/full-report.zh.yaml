      - number: '4.3'
        title: 单位经济、成本结构与经营杠杆
        blocks:
          - type: paragraph
            body: >
              天机成本结构由四个驱动因素塑造：自研 MEMS 关节扭矩传感器开发、一体化关节模块制造、运动控制软件和精密装配。公司称其在机器人关节中实现全球首个自研 MEMS 关节扭矩传感器量产，规格包括绝对精度 ≤0.3
              N·m、±0.03 mm 重复定位精度和 160 Hz 扭矩环带宽。这些传感器是天机独有的关键 BOM 输入；其良率、单位成本和产能约束均未披露。


              员工构成显示公司已在研发上重投入：300+ 总员工中有 140+ 名研发工程师（约 47%），运营 16,500 m² 设施，并拥有 289 项授权专利和 33 项软件著作权。母公司长盈精密服务 Apple 和
              Tesla 供应链的精密制造经验，可能通过共享工装、工艺良率和采购规模带来 COGS 杠杆，但任何公司间供货安排的财务条款未披露。


              公司未公布毛利率数据。可比中国工业 cobot 厂商在规模化运营时报告硬件毛利率为 30–45%，但天机的力控双臂产品更复杂、包含更多自研 BOM 内容，并面向价格竞争较弱的新兴 OEM
              市场；若销量和良率假设兑现，这些因素可能支撑更高毛利。QCC 2025 年参保员工数为 166 人，显著低于公司材料声称的 300+ 人，说明部分人员可能是承包商、实习生或子公司员工。
