      - number: '3.2'
        title: 全球 Cobot 在位者与力控同行
        blocks:
          - type: paragraph
            body: >-
              ABB YuMi（IRB 14000）于 2015 年推出，是全球首款真正协作式双臂机器人，仍是双臂 cobot 类别的全球在位标杆。YuMi 具备 14 轴、单臂 559 mm 臂展和 500 g
              负载，针对小件电子装配中的人机并肩协作优化。ABB 产品页面和营销把 YuMi 明确定位于桌面装配场景，未描述用于人形机械臂集成或 OEM 组件供货的逐关节力 / 扭矩感知。ABB Group
              规模庞大——年收入超过 $30+ billion、拥有 1,000+ 名机器人工程师和全球销售基础设施——有足够资源进入邻近市场，但截至 2026 年 6 月，未发现其拥有专用人形机械臂组件产品的公开证据。

              Universal Robots 是按装机量计的全球 cobot 市场领导者，提供 UR Series（高性能）和 e-Series（灵活 / 高性价比）单臂平台，负载从 3 kg 到 30 kg。UR
              不提供双臂配置，其生态围绕 PolyScope 软件和 1,000+ 家分销伙伴构建，面向通用工厂自动化。根据 Mordor Intelligence 和 MarketsandMarkets
              的市场报告，这些在位者服务的 cobot 市场预计将以 20–22% CAGR 增长，到 2030 年达到数十亿美元规模，这会吸引资本和新产品计划进入。

              Flexiv 是一家美中力控机器人创业公司，把其「自适应机器人」定位为把工业级力控与视觉感知、AI 结合，面向需要容忍位置误差和抗扰动的任务。在可公开获取的竞争数据中，Flexiv 的技术姿态与天机最接近。但
              Flexiv 似乎供应单臂平台，用于高混合 / 低批量工业流程，而不是双臂人形机器人 OEM 组件；本次审阅来源均未披露其产量和收入。Agile Robots 是源自中国、在亚洲扩张的力控创业公司，曾在
              Robot Technology Japan（RTJ）2026 展示力控技术和人形机器人产品，显示其正在具身 AI 空间积极竞争。
