      - number: '5.4'
        title: 技术差异化与 IP 位置
        blocks:
          - type: paragraph
            body: >-
              Tianji 的核心技术差异化主张，建立在七个自由度全部集成关节 MEMS 扭矩感知上，这与 Flexiv Rizon 系列采用外部腕部六维力传感器的方案不同。ABB 的 YuMi 双臂协作机器人每臂额定负载仅
              500 g，而 Marvin M6CCS 为 6 kg——12× 的负载优势，对 Tianji 瞄准的装配任务有实质意义。Universal Robots 的 e-Series 协作机器人和 Fairino
              产品线未披露 MEMS 关节感知架构或扭矩带宽规格，无法做点对点直接比较，但显示设计路径存在差异。

              公司在官网自称拥有 289 项授权专利和 33 项软件著作权，QCC 注册信息部分佐证了这一点。2026 年近期专利活动包括 2026 年 4
              月获授权的机器人运动规划和力控方法发明专利，以及已提交的多阶微分跟踪器控制方法、冗余机械臂 DH 参数自动标定、关节模块扭矩控制方法发明专利。近期专利申请的广度显示，公司仍在积极开发支撑 MEMS
              感知架构的算法层。据 RobotToday 行业简报，2026 年 Q1 公司发布了四款新力控人形机器人手臂产品型号，反映产品路线图仍在推进。鉴于 MotoSim 底层来自 Yaskawa
              工具链传承，软件层专利的独立性和可执行性仍不确定。
