  - id: FE001
    title: 产品架构图
    type: stack
    layout: wide
    summary: 对天机产品架构做分层拆解，从物理传感一直到应用层，展示各层关键组件。
    data:
      layers:
        - id: sensing
          label: 传感层——MEMS 关节扭矩传感器
          detail: 每条机械臂 7 个关节均配置自研 MEMS 扭矩传感器；绝对精度 ≤0.3 N·m，带宽 160 Hz，重复性 ≤0.15 N / ≤0.05 N·m（公司声称）。公司声称这是全球首次以这种密度实现商业部署。
        - id: actuation
          label: 驱动层——一体化关节模块
          detail: 自包含执行器内嵌 MEMS 传感器、电机、编码器和本地控制电子单元。8 kHz 扭矩闭环；双绝对编码器；62.5% 负载自重比（M6S Lite）。
        - id: comms
          label: 通信层——EtherCAT 总线
          detail: 确定性实时现场总线（IEC 61158）连接关节和控制器；周期时间 ≤1 ms。标准协议，背后有广泛的工业供应商生态。
        - id: controller
          label: 控制器层——TRC-Micro / SRC-Micro + 双臂主板
          detail: 单块主板上的一主二从双臂架构；公司声称延迟 5 ms，平均轨迹误差 1.89 mm。TRC-Micro：AC220 V 单相、200,000 步、10,000 条指令。
        - id: software
          label: 软件层——MotoSim EG-VRC + MotoPlus SDK
          detail: MotoSim EG-VRC：带 VRC+VPP 的离线仿真；控制器模型继承 Yaskawa。MotoPlus：C 语言嵌入式 SDK，提供 task/robot/IO/network API，供 OEM 定制。
        - id: application
          label: 应用层——力控功能 + 客户集成
          detail: 力反馈装配和打磨、传送带跟踪（传感器和视觉模式）、软浮动协同控制。客户通过 EtherCAT、MotoPlus SDK 和示教器完成集成。
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE011
      - CE021
      - CE023
      - CE025
  - id: FE002
    title: 客户工作流 / 运行流程
    type: flow
    layout: wide
    summary: 从客户识别需求，到集成、调试、生产部署，完整呈现天机力控机械臂在 OEM 或工厂场景中的落地流程。
    data:
      nodes:
        - id: need
          label: 客户识别力控需求
          detail: OEM 团队或工厂识别出任务需求：传统协作机器人能力之外的亚毫米级柔顺性，或 >0.5 N·m 扭矩精度
        - id: selection
          label: 产品选择（Marvin / Pilot 7 / EVO）
          detail: 按负载（M3 3 kg、M6 6 kg、Pilot 7 7 kg）、臂展和协作安全认证要求（M6CCS 的 ISO/TS 15066）选择机械臂
        - id: simulation
          label: 用 MotoSim EG-VRC 做离线仿真
          detail: 工程师用 VRC+VPP 离线编写机器人路径；在实体硬件部署前验证覆盖范围并避开碰撞
        - id: integration
          label: 集成 EtherCAT 和 MotoPlus SDK
          detail: 集成商通过 EtherCAT 将机械臂接入主机；用 MotoPlus C SDK 嵌入定制力控任务，匹配 OEM 特定行为
        - id: force_cal
          label: 力传感器标定和调参
          detail: 建立 MEMS 传感器基线；针对目标任务调节阻抗 / 柔顺参数（螺丝扭矩、插入力、抛光压力）
        - id: prod_deploy
          label: 生产部署
          detail: 机械臂进入产线；MotoSim 路径在实体硬件上执行；实时 EtherCAT 遥测闭合控制回路
        - id: data_acq
          label: 力反馈数据采集（AI 路径）
          detail: OEM 团队用遥操作或示教模式采集高保真力轨迹，用于训练基础模型
        - id: scale
          label: 放量 / 扩展
          detail: 成功部署带来重复订单；天机 2026 年 Q1 的 10,000 台积压订单，反映这一循环已覆盖 45 家 OEM 客户
      edges:
        - from: need
          to: selection
          label: 规格匹配
        - from: selection
          to: simulation
          label: 离线编程
        - from: simulation
          to: integration
          label: 部署程序
        - from: integration
          to: force_cal
          label: 调校控制
        - from: force_cal
          to: prod_deploy
          label: 可投产
        - from: prod_deploy
          to: data_acq
          label: AI 路径（OEM 研发）
        - from: prod_deploy
          to: scale
          label: 工厂路径
        - from: data_acq
          to: scale
          label: 模型成熟 → 更多机械臂
    claimRefs:
      - CE027
      - CE028
      - CE034
      - CE039
