        - label: 中国协作机器人与先进机械臂市场
          value: ~$1.9B (2025E) → $2.8B (2028)
          tier: 3
          note: WorldMetrics/Mordor 协作机器人估算；CAGR 约 20%；作为 Tianji 存量工业细分的代理
        - label: 中国人形机器人市场（所有组件）
