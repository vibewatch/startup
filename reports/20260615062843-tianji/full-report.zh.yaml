      - number: '2.3'
        title: 买方细分与采用路径
        blocks:
          - type: paragraph
            body: >
              天机买方基础分为三个清晰细分，预算机制、技术要求和采用时间线各不相同。第一类、也是增长最快的买方，是人形机器人 OEM 制造商——这些公司打造完整人形机器人，需要高性能机械臂。截至 2026 年
              Q1，天机在全球服务 45 家此类 OEM，其中据报包括 30+ 家中国本土人形机器人制造商。这些买方通常把天机力控双臂作为物料清单组件集成进去，使天机成为新兴人形机器人价值链中的 Tier-1 机械臂供应商。该
              OEM 细分初始订单通常较小（原型和算法训练阶段），一旦平台设计锁定，就会快速放大到生产数量。买方通常是机器人公司的硬件工程团队；付款方是 OEM 的资本预算。OEM
              采用的触发点，是无法在内部开发自有力感知机械臂——MEMS 扭矩传感器研发周期和产能爬坡需要 3–5 年，因此向天机采购更高效。


              第二类买方是精密制造运营方，主要包括 3C 电子组装、汽车零部件产线和鞋服制造。这些场景需要柔性自动化，刚性工业机器人难以可靠完成。天机应用案例页面列出 3C
              电子、鞋服制造、工程机械和汽车制造等活跃垂直行业。中国电子行业是全球最大精密机器人用户（占全球电子机器人存量
              64%），而消费电子组装的新需求——许多任务因精细度要求仍依赖人工——对力敏机械臂形成强拉动。该细分的预算归属转向工厂运营和自动化 capex 团队，cobot 投资典型回本周期为 18–36 个月。


              第三类是研究机构和具身 AI 算法开发公司，它们购买力控机械臂作为训练和数据集采集平台。该细分愿意为前沿硬件支付高价格，但量不大；作为重要早期采用者和标杆客户，它在高量 OEM
              部署之前验证天机技术。该细分单台定价通常更高，用来补贴持续平台改进的研发成本。采用触发点来自具身 AI 大模型研究兴起，需要在规模化物理世界交互中训练。
