      - number: '2.4'
        title: 增长驱动与逆风
        blocks:
          - type: paragraph
            body: >
              最主要的结构性驱动，是中国具身 AI 政策生态。「十五五」规划要求机器人作为国家产业战略核心支柱，带来层层传导的采购激励、研发补贴和监管清晰度（2026
              年国家人形机器人标准体系就是体现之一）。增值税退税结构（机器人产品 17% 退税）降低机器人持有的有效成本，加快企业采用决策。政府在 2022–2025 年间向机器人研发投入 $15
              billion，已经形成密集的上游供应商生态——组件制造商、传感器专家、算法研究者——相较支持较弱的市场，天机面临的供应链风险更低。


              第二个驱动，是精密制造中的结构性劳动力质量缺口。需要亚毫米级灵巧度的任务——尤其是消费电子、微组件组装和高精密仪器制造——无法可靠交给刚性传统机器人。中国制造业工资上升，且人工劳动质量波动容忍度收紧（受
              Apple、Tesla 和全球 OEM 质量规范驱动），能够完成精细装配的力敏机器人手臂需求因此结构性增加。这也是过去全球 cobot 增长的同一驱动。


              但 IFR 自身评估提出了不可忽视的实质逆风。IFR 明确表示，「作为通用人形工厂助手的大规模采用不会在近期和中期发生」，并称「十五五」目标把人形机器人商业化放在「规划期末」——也就是约 2030 年。IFR
              还指出，真实生产场景中的当前人形机器人能力「目前局限于演示机或试点项目」。这意味着天机最重要的近期市场——向 OEM 供应人形机械臂——依赖 OEM
              客户成功跨过从试点到规模化的门槛，而这一风险既不小，也不完全由天机控制。


              其他逆风包括：（1）核心组件供应链瓶颈，中国人形机器人行业仍依赖进口精密执行器、特种轴承和部分半导体元件；（2）场景碎片化，行业高管指出，人类擅长的近 80% 操作任务涉及触觉感知，但触觉传感器接口标准缺位，导致
              OEM 之间出现碎片化、互不兼容的实现；（3）过度融资风险，仅 2026 年 Q1 中国具身 AI 行业就融资约 300
              亿元人民币，这一速度引发资本配置纪律和潜在市场拥挤担忧。分析师已注意到投资从概念阶段转向商业验证，但 2025 年国内已有 140+ 家人形机器人制造商、发布 330+ 款机型，整合压力不可避免，并非所有 OEM
              客户都能存活下来成为长期买方。
