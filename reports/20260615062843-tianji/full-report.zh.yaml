  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >
              Tianji 在 RMB 8–10 billion 估值下的投资论点，由四个相互咬合的判断支撑。第一，市场结构：中国人形机器人行业正在围绕少数基础设施提供商整合，Tianji 的力控专长——289
              项授权专利、自有 MEMS 关节扭矩传感器，以及全球唯一批量生产的力控人形机器人双臂——让它成为 OEM 集成商几乎绕不开的组件。服务 45 家全球人形机器人 OEM 制造商，带来结构性粘性和跨组合分散，而单一
              OEM 标的缺少这种特征。第二，商业牵引力：2025 年四个月交付 2,000+ 台双臂单元，并累积 2026 年 Q1 10,000+
              台积压订单，是中国力控赛道最强的近期商业证明。第三，政策顺风：中国第十五个五年规划（2026–2030）将 AI 驱动机器人列为国家核心战略优先事项；截至 2026 年 5 月，IFR
              确认中国占全球工业机器人装机量的 54%，为人形机器人采用放大后的基础设施升级创造了庞大本土可服务市场。第四，投资人质量：本轮由 Hillhouse（同时领投 TARS Robotics $513M
              种子轮）、Meituan（潜在人形机器人部署客户）共同领投，并包括 Tencent，显示中国最高层级风投资本给出信心。

              反论点同样实质。最关键的是，Tianji 没有披露经审计收入、毛利率、现金消耗或资产负债表数据。任何倍数计算都基于估计，而非确认财务。第二，客户集中度不透明：虽然提到 45 家 OEM
              客户，但其身份、财务健康状况和订单集中度均未披露，无法评估收入对任何单一买家的依赖。第三，IFR 在 2026 年 5
              月明确指出，尽管公开演示令人印象深刻——包括北京人形机器人半程马拉松——「真实生产场景中的实际能力目前仍局限于演示或试点项目」。这直接挑战当前估值中隐含的收入爬坡假设。第四，Changying Precision
              治理悬置（27% 股权、控股母公司）带来委托代理风险：Changying 作为 Apple / Tesla 供应链制造商的优先事项，可能偏离 Tianji
              的独立增长轨迹。第五，战略投资人组合（Meituan、Tencent）为财务投资人引入信息不对称风险：企业战略方可能在合作、供应链接入或退出时点上施加影响，并与纯粹回报最大化产生摩擦。
