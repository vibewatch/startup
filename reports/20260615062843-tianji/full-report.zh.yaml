    layout: standard
    summary: >
      以 2026 年 5 月 Series B 入场估值 RMB 8B 为锚，估算牛市、基准和熊市情景下的退出估值区间 （RMB 十亿）。基准情景三年回报为 1–2.25×。牛市情景对应潜在 4–7.5× 回报；熊市情景意味着
      Pre-B 股权持有人亏损本金。
