        - from: proof
          to: moat
          label: 验证基础设施需求
        - from: moat
          to: valuation
          label: 支撑平台溢价
        - from: risk
          to: valuation
          label: 形成不确定性折价
        - from: valuation
          to: recommendation
          label: 导向有条件持有
        - from: risk
          to: recommendation
          label: 阻止无条件买入
