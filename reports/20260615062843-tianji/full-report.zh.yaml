      - number: '3.3'
        title: 中国具身 AI 同行与资本市场背景
        blocks:
          - type: paragraph
            body: >-
              Crunchbase 数据显示，到 2026 年 5 月中旬，中国具身 AI 创业生态通过 176 笔交易吸引 $5.6 billion 风险投资，已追平中国 2021 年全年纪录，并超过 2025 年全年
              $4.3 billion 融资总额。融资最密集的同行包括 Galaxea AI（2026 年累计 $435 million，估值 $1.4 billion）、EngineAI（$200 million
              Series B，估值 $1.5 billion）、TARS Robotics（$513 million 种子轮，估值 $1.9 billion）和 Spirit AI（合并 Series A $435
              million，估值 $1.5 billion）。这些公司主要是人形机器人整机制造商，而非力控组件供应商；它们在技术栈不同层级争夺同一人形机器人平台客户预算。

              Figure AI 是全球估值最高的独立人形机器人公司，Series C 完成后投后估值达到 $39 billion，承诺资本超过 $1 billion。Figure 的 AI
              平台（Helix）面向家庭和商业运营，作为完整端到端系统落地，因此与天机属于不同类型竞争者：它争夺人形机器人平台预算，但不争夺力控机械臂组件供货关系。

              AgiBot 于 2025 年 7 月以约 $290 million 收购上市公司 Swancor Advanced Materials 63.62% 股权，说明竞争背景中值得关注的流动性路径：到中国人形 AI
              创业公司越来越多通过反向并购结构寻求上市；Unitree Robotics 于 2026 年 3 月向上海证券交易所提交 IPO，目标估值 $3 billion 至 $7
              billion，成为关键资本市场标杆。Agilink 于 2026 年从 AgiBot 拆分，专注于向更广泛机器人市场授权灵巧手技术，使其成为天机新兴但直接的组件供应竞争者。

              中国精密机器人制造商（ROKAE、Estun、AUBO、Fairino）构成重要在位者群体，已有工厂和客户关系，可能延伸到人形机械臂供应；但其产品页面在本次研究中无法访问或信息不足，因此无法从公开来源验证它们与天机力控架构的具体重叠。
