      - number: '1.3'
        title: 融资历史与资本结构
        blocks:
          - type: paragraph
            body: >-
              天机智能于 2026 年 5 月 25 日完成 Series B 与 B+ 合并融资，总额 RMB 10 亿（Yicai Global 折合 $147 million USD）。本轮由 GL
              Ventures（高瓴资本旗下高瓴创投）和美团战投共同领投，腾讯控股、高榕资本、光合创投、GGV Capital / Granite Asia（纪源资本）等共同投资。高鹄资本担任独家财务顾问。

              投后估值在不同来源间不一致：EqualOcean 报道为 RMB 80 亿（约 $1.1 billion USD），而 Yicai Global、Gasgoo 和 36kr 均报道为「接近 RMB 100
              亿」（约 $1.4–1.5 billion USD）。Crunchbase 给出的美元等值为 $1.5 billion。较高区间可能反映 B 与 B+ 合并后的抬升：EqualOcean 报道合并后的 B
              轮投后估值，其他媒体则反映最终 B+ 后估值。两种口径都让天机按美元定义成为独角兽（估值 >$1B）。

              Series B 之前，天机至少完成过一轮 Series A（QCC 登记显示青岛隐山创业投资基金 / GLP Capital 为 A 轮投资方，2024 年入股）和一轮 Series A+（无锡 GGV /
              Granite Asia 于 2025 年 12 月入股）。QCC 股东登记中可见的其他早期投资方包括招银国际、赛富和腾讯关联实体腾元投资。Series B 之前累计融资未被公开量化为单一数字。

              公布的 Series B 资金用途覆盖三项优先事项：深化 MEMS 传感器、一体化关节模块和运动控制算法研发；扩充产能以实现 10,000
              台批量交付能力；建设全球销售网络，在北美和其他国际市场提供本地化技术支持。

              收入、毛利率和年经常性收入（ARR）均未公开披露，这与天机作为上市母公司旗下民营子公司的状态一致。当前估值隐含显著的未来增长预期，但这些预期尚未用当前财务表现独立验证。
