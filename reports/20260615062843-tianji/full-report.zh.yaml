      - number: '1.2'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              QCC 官方工商登记显示，陈曦是广东天机智能系统的法定代表人、董事长和总经理。他也是受益所有人，直接持有公司约 6.22%，并通过关联咨询合伙企业持有额外间接权益。

              董事会和高管团队包括：邹锐，董事，持股约 5.97%；董中浪，董事；安杰，董事；段凯铧，监事。黄乃豪担任财务负责人。非执行董事完整名单及董事会委员会结构未公开披露。

              公司的研发中心由安川电机和长盈精密共同派出的工程人才共同创立，把安川世界级伺服电机和运动控制技术，与长盈精密的精密制造能力和系统集成经验结合起来。这一安排体现了天机技术路径的工业血统，也部分解释了其机器人产品线较强的机械精度。

              天机已与三所高校建立研究合作：香港科技大学、上海交通大学和哈尔滨工业大学。这些联合实验室聚焦探索新的机器人技术，并把最新科学进展应用到天机产品中。QCC 登记列出约 20
              家与领导层和公司结构有关的关联公司和法律实体。

              治理结构显示，天机更像一家企业子公司，而不是独立创始人主导的创业公司：最大单一股东是上市母公司深圳长盈精密，持股约 27%；其次是 CLH 142 (HK) Limited，持股约
              19.72%，其最终受益所有权未公开披露。陈曦作为个人受益所有人持有约 15.23%。鉴于陈曦同时担任董事长、CEO 并持有受益权益，关键人风险集中在他身上。未见重大领导层变动报道。
