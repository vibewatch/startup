      - number: '2.2'
        title: 市场规模与投资格局
        blocks:
          - type: paragraph
            body: >
              力控人形机械臂的市场测算需要叠加三组数据锚点，因为没有单一报告能干净覆盖该子赛道。第一，IFR 确认中国是全球最大机器人市场，运行存量约 2 million 台（日本的 4.5
              倍），本土供应商在国内安装中的份额从 2020 年的 30% 增至 2024 年的 57%。在电子行业——最急需力控灵巧操作的领域——中国承载全球 64% 的工业机器人安装量，中国厂商供应其中
              59%。第二，MarketsandMarkets 测算显示，中国人形机器人市场从 2025 年 $400 million 升至 2030 年 $2.8 billion（47.6%
              CAGR）；全球智能机器人市场提供另一视角，从 2025 年 $14 billion 升至 2030 年 $50 billion，CAGR 为 29%。第三，中国特定投资浪潮提供真实资金代理指标：仅 2026 年
              Q1，中国具身 AI 创业公司融资约 300 亿元人民币（约 $4 billion），资本从概念阶段押注转向能证明商业闭环和工程执行深度的公司。


              天机已实现的商业指标进一步从需求侧约束估计。2026 年 Q1 超过 10,000 台在手订单、45 家活跃 OEM 客户（人形机器人制造商和具身 AI 独角兽），以及 800+
              历史工业客户，合起来意味着短期内力控双臂系统年可服务单位量在数万台低位区间；一旦人形机器人 OEM 走向量产，可能增长到数十万台。按每臂 $5,000–$15,000 的估计 ASP（由行业 cobot
              定价推断；天机未公开披露价格），中国可服务范围内的力控双臂年收入到 2027 年可能合理达到 $300–600 million。这是分析估计，不是已发表数字，应按高不确定性处理。


              《中国发展报告 2025》（政府咨询文件）预测，更广义的具身智能产业到 2030 年达到 4000 亿元人民币，到 2035 年超过 1 万亿元人民币。这些数字反映宽泛的工业 AI
              范畴，不应直接映射到天机的总可用市场（TAM）；它们提供的是政策雄心方向，而不是自下而上的需求测算。
