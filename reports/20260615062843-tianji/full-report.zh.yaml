  - id: FV001
    title: 建议逻辑流
    type: flow
    layout: standard
    summary: |
      将市场机会、商业验证和风险因素的证据串联起来，再经过估值纪律校验，得出有条件持有建议。
    data:
      nodes:
        - id: market
          label: 市场：2030 年中国具身 AI 超 RMB 400B（十五五规划）；中国占全球机器人装机量 54%
        - id: proof
          label: 商业验证：2025 年 4 个月出货 2,000+ 台；2026 年 Q1 在手订单 10,000+ 台；45 家 OEM 客户
        - id: moat
          label: 护城河：MEMS 扭矩传感器专利；力控 IP；289 项授权专利；基础设施锁定
        - id: risk
          label: 风险：无经审计财务；IFR 警示人形机器人大规模生产「仅为演示机」；治理悬而未决
        - id: valuation
          label: 估值：投后 RMB 8–10B；隐含收入倍数 20–40×；偏高但符合行业
        - id: recommendation
          label: 建议：有条件持有——Series B 入场估值仍可辩护；没有经审计财务前避免追加新资金
      edges:
        - from: market
