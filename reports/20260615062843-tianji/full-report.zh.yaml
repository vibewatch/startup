      - number: '8.3'
        title: 可比公司与融资分析
        blocks:
          - type: paragraph
            body: >
              鉴于缺少定位相似的中国公开机器人同行，2026 年中国具身 AI cohort 是 Tianji 最相关的可比集合。Galaxea AI 在 2026 年 2 月和 4 月两轮合计融资 $435M，报道称估值
              $1.4B USD——一家运营两年的纯人形机器人 OEM。Spirit AI 在 2026 年 2–4 月合计完成 $435M Series A，估值 $1.5B，定位为机器人「通用大脑」软件层。EngineAI
              以 $1.5B 估值完成 $200M Series B，产品覆盖全尺寸人形机器人和四足机器人。TARS Robotics 以 $1.9B 估值获得 $513M
              种子轮——公司成立一年且没有收入。这四家同行显示，截至 2026 年 Q1–Q2，中国具身 AI 对早期商业化或收入前公司的估值区间为 $1.4B– $1.9B USD。

              Tianji 的 $1.1–$1.5B USD 估值位于这一 cohort 低端，尽管它展示了最强的商业牵引力：2025 年出货 2,000+ 台，2026 年 Q1 积压订单 10,000+ 台，45 家
              OEM 客户，以及 10 年以上工业机器人经验。相对纯 OEM 同行的折价，可能反映三点：(a) 基础设施层定位（组件供应商，而非终端产品品牌）；(b) Changying Precision 治理约束；(c)
              缺少披露的独立财务。

              全球背景下，Figure.ai（美国）以 $39B 估值完成 $1B+ Series C——量级高于中国 cohort，反映美国市场溢价，也显示若行业成熟，领先人形机器人平台的潜在估值天花板。Unitree
              Robotics 于 2026 年 3 月提交 Shanghai Stock Exchange IPO 申请，目标估值 $3–7B，为一家销量强劲、但产品层级不同（消费 /
              专业四足机器人）的中国公司提供了公开市场参照。

              并购可比方面，AgiBot 2025 年以 $290M 收购 Swancor Advanced Materials，显示中国具身 AI 公司可以通过反向并购结构接入公开市场流动性，为 Tianji
              投资人建立了直接 IPO 之外的另一条退出路径。
