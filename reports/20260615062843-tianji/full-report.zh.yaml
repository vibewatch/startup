      - number: '5.2'
        title: 核心硬件架构：MEMS 传感器与一体化关节
        blocks:
          - type: paragraph
            body: >-
              Marvin 系列的底层支撑，是关节级 MEMS（micro-electromechanical systems）扭矩传感器；Tianji 称，这是全球首个在机器人关节中商业规模部署的自研 MEMS
              关节扭矩传感器。M6CCS 的七个关节各自标配一枚 MEMS 扭矩传感器，无需外部腕部六维力传感器即可做逐关节力测量——这与只把力感知放在腕部的竞争方案形成对比。根据公司发布的产品规格，绝对扭矩测量精度为
              ≤0.3 N·m，扭矩环带宽达到 160 Hz；力重复性标为 ≤0.15 N 和 ≤0.05 N·m。截至 2026 年 6 月，这些数字均为公司口径，尚未获得独立验证。

              一体化关节模块标称实现 8 kHz 扭矩闭环控制频率，并为每个关节使用双绝对值编码器做位置反馈。Marvin M6S Lite 版本的负载自重比达到 62.5%：8 kg 臂体承载 5 kg 负载。通信使用
              EtherCAT，周期时间 ≤1 ms；双臂系统采用一主二从架构，通过单块主板同步两条 7 轴手臂。公司称端到端控制延迟为 5 ms，内部基准测试下平均轨迹误差为 1.89 mm。Marvin M6CCS 的
              TCP 最高速度为 2 m/s，关节最高速度为 180°/s。Marvin 系列物理防护等级为 IP54，低于工业 EVO 和 TR 系列的
              IP67。截至本次报告日期，未发现第三方基准测试、学术论文或独立实验室报告可佐证 MEMS 性能规格。
