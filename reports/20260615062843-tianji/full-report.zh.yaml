  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与 GTM 经济性
        blocks:
          - type: paragraph
            body: >
              天机的收入引擎以硬件为中心：公司直接向人形机器人 OEM 制造商、精密电子组装商和工业自动化集成商销售力控双臂机器人系统。B2B 直销渠道是唯一已确认的 GTM
              动作；未披露渠道伙伴、分销商或经销商计划。标价、合同条款和实际 ASP 均未公开。


              产品组合分为两个板块。成熟的工业协作机器人业务到 2022 年底已服务 800 多家客户，超过 10,000 台 cobot
              在运行，为收入提供了一个无法单独量化的基线底盘。更新、战略优先级更高的力控人形双臂产品线，在 2025 年四个月内向 100 多家客户交付超过 2,000 台，并在 2026 年初披露，在 45 家全球人形机器人
              OEM 账户中拥有超过 10,000 台在手订单。


              天机表述的长期收入雄心超过硬件，延伸到完整人形机器人平台和具身 AI 服务层，但这些类别尚未公布商业产品、定价或时间表。截至 2026 年 6
              月研究日期，硬件单元销售仍是唯一已确认收入机制，公司没有公布任何时期的收入、毛利率或盈利数据。
