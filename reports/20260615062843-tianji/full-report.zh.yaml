  - id: FR002
    title: 风险传导级联——从出口管制到估值
    type: dag
    layout: standard
    summary: >
      展示上游地缘政治和供应链风险如何穿过 Tianji 的运营层，最终影响估值。主传导路径是： 美国出口管制升级，带来芯片 / 执行器供应中断，继而拖慢产品路线图，削弱 OEM 需求催化， 并压缩估值。另一条并行路径则是人形机器人
      OEM 需求节奏延后，直接造成收入不及预期。
    data:
      nodes:
        - id: us-export-controls
          label: 美国 BIS 出口管制升级
        - id: chip-supply
          label: 高端芯片 / 执行器供应受限
        - id: product-roadmap-delay
          label: 力控臂产品路线图延迟
        - id: oem-adoption-slow
          label: 人形机器人 OEM 采用时间表后移
        - id: changying-conflict
          label: Changying 产能优先分配（Apple/Tesla）
        - id: supply-bottleneck
          label: 零部件供应瓶颈
        - id: revenue-shortfall
          label: 收入低于 ¥8B 估值假设
        - id: valuation-compression
          label: 估值压缩 / 下轮降价融资
        - id: market-froth
          label: 全行业 VC 回撤（具身 AI）
        - id: oem-funding-risk
          label: OEM 客户融资中断
      edges:
        - from: us-export-controls
          to: chip-supply
          label: 限制获取
        - from: chip-supply
          to: product-roadmap-delay
          label: 约束研发
        - from: product-roadmap-delay
          to: oem-adoption-slow
          label: 削弱竞争力
        - from: changying-conflict
          to: supply-bottleneck
          label: 优先保障 Apple/Tesla
        - from: supply-bottleneck
          to: product-roadmap-delay
          label: 限制生产
        - from: oem-adoption-slow
          to: revenue-shortfall
          label: 减少机械臂订单
        - from: market-froth
          to: oem-funding-risk
          label: 触发回撤
        - from: oem-funding-risk
