        title: 工业客户基础与垂直分层
        blocks:
          - type: paragraph
            body: >
              Tianji 已建立超过 1,000 个账户的传统工业机器人客户基础；截至 2026 年，超过 20,000 台机器人在线稳定运行，高于 2024 年底的 800 个客户和 10,000 台。这一路径意味着约
              25% 的账户增长和 100% 的装机增长，时间跨度约两年，与公司自称作为高端品牌、在中国协作机器人 / SCARA 销量中接近头部的定位一致。核心服务垂直包括 3C
              电子（印刷电路板装配、检测、取放）、汽车和汽车电子（焊接、装配、质量控制）、新能源（电池装配和测试）、医疗器械、家电、食品加工、鞋服制造，以及工程机械集成。Tianji
              官网为每个垂直场景保留专门应用案例页，公司称自己在各行业已开发出「成熟应用」。商业模式是直销 B2B，方案中捆绑咨询、培训和售后维护。尽管客户基础规模不小，任何公开渠道都没有具名企业
              logo、参考账户或已发布案例研究；因此，对工业客户基础的独立验证只能依赖 Baidu Baike、FairPlus 展商目录和 QCC 工商注册的第三方计数。客户基础在地理上集中于中国珠三角制造集群，这与
              Tianji 的 Dongguan 总部和 Changying Precision（Everwin）母公司背景一致。
