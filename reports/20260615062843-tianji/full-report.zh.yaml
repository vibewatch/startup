              ROKAE、Estun、AUBO 和 Fairino 合起来代表中国 cobot 和精密机器人制造商中已有基础的一层，拥有现成工厂关系，可能延伸到人形机器人 OEM
              供应。现有公开数据无法评估它们与天机特定力控细分的产品重叠。如果这些同行中的任何一家已经推出或即将推出力控双臂产品，天机在国内的竞争位置会比当前证据显示的更拥挤。
