      - number: '8.4'
        title: 牛市 / 基准 / 熊市情景分析
        blocks:
          - type: paragraph
            body: >
              以 RMB 8–10B 的 Series B/B+ 入场估值为锚，未来三年（2026–2029）Tianji 投资人面临的结果可拆成三种情景。

              牛市情景（30% 概率信号）：到 2027 年，中国制造业落地顺利，叠加「十五五」政策刺激，人形机器人 OEM 年需求加速到 100,000+ 台。Tianji
              成功从零部件扩到完整人形机器人产品，收入结构不再只靠组件。到 2028 年，收入达到 RMB 2–3B，公司按 15–20× 收入冲刺 HKEX 或上海 SSE IPO，对应估值 RMB 30–60B。若按
              Series B 的 RMB 8B 入场价计算，回报倍数为 3.75–7.5×，三年 CAGR 约 55–90%。

              基准情景（50% 概率信号）：人形机器人继续渗透，但节奏仍以试点为主，符合 IFR 2026 年 5 月的判断。订单从 10,000 台增至 2028 年的 40,000–60,000 台。收入达到 RMB
              800M–1.5B。公司实现 EBITDA 盈亏平衡，并在 2028–2029 年寻求流动性事件（HKEX 上市或战略并购），按 10–12× 收入估值，对应 RMB 8B–18B。以 RMB 8B
              入场估值计算，回报倍数为 1–2.25×，CAGR 约 0–30%——对承担 VC 风险来说够用，但并不突出。

              熊市情景（20% 概率信号）：人形机器人落地慢于预期，主要 OEM 客户因非结构化环境能力瓶颈未解，推迟商业化铺开。订单积压按低于预期的 ASP 转化；竞争性力控供应商（包括日本 /
              欧洲成熟协作机器人厂商，以及新入场、已融资的中国同行）侵蚀 Tianji 定价权。到 2028 年，收入仍低于 RMB 400M。B/B+ 清算优先权栈意味着，只要退出估值高于 RMB
              1B，财务投资人可收回本金，但股权增值很少甚至为负。若按 8× 收入退出，估值约 RMB 3–4B——早期（B 轮前）股东账面亏损 50–60%。

              概率加权后的预期估值：到 2028 年约 RMB 16–18B，意味着从 RMB 8B 入场价算起，预期倍数为 2–2.25×。考虑到执行风险高、信息不透明，这是一笔合理但说服力不足的 VC 回报。
