      - number: '8.5'
        title: 退出准备度、打破投资假设的触发点与最终尽调要求
        blocks:
          - type: paragraph
            body: >
              退出路径分析显示，Tianji 未来 2–3 年存在流动性事件窗口。Robotphoenix 先例（2026 年 5 月在 HKEX 上市，募资 $86M，首日收涨
              80%）说明，中国机器人初创公司可以在港交所成功上市，并获得市场正反馈。Unitree 的 SSE 申报也证明了中国境内路径。只要收入超过 RMB 500M，且能证明盈利轨迹，Tianji
              走任一路线都有可行性。Changying Precision 母公司背景可能让独立 IPO 变复杂（公开市场可能折价看待关联方结构），因此近期更可能的路径，是作为独立子公司在 HKEX
              上市，或被战略买家并购。潜在战略买家包括 Meituan（机器人配送整合）、Tencent（平台 AI-硬件整合），或希望补齐人形机器人能力的一线工业集团。

              若出现以下触发点，判断应从「有条件持有」转为「回避」：（1）披露经审计的 2025 年收入低于 RMB 200M，说明订单量向收入转化弱于估计；（2）2026 年 Q1 10,000 台订单积压中，任何公开
              OEM 客户取消订单或下调订单量；（3）中国竞争对手以显著更低 ASP 交付可比力控人形机器人手臂；（4）Tianji 或 Changying Precision 被列入 Entity
              List，或受到同等级出口限制；（5）Changying Precision 财务状况明显恶化，被迫折价出售 Tianji 股权；（6）行业出现下轮融资事件，重新压低可比估值基准。

              最终建议是，现有 Series B 投资人有条件持有：入场估值偏激进，但结合行业可比公司、商业牵引力和 Hillhouse 的信号，仍可辩护。若没有经审计财务，新资金按 RMB 8–10B
              入场，信息风险过高，更适合等待并验证。最高优先级的单项尽调要求，是取得经审计的 FY2025 财务报表和 H1 2026 管理账，以确认或修正隐含倍数。
