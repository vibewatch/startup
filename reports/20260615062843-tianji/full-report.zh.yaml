  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义
        blocks:
          - type: paragraph
            body: >
              天机的相关市场由三层同心需求构成。最外层是中国工业机器人生态，它提供政策、供应链和客户基础设施，所有产品线都依托其上。到 2022 年，中国工业机器人市场已达到 $10.2 billion，占全球 $53.6
              billion 总量的 38%；IFR 的 World Robotics 2025 数据显示，当年全球 54%
              的机器人安装部署在中国工厂。这一结构性需求优势又被「十五五」规划（2026–2030）强化：规划明确把机器人置于中国现代产业体系核心，并要求数千个下属行业和区域规划与这些目标对齐。


              在这一生态内部，更贴近天机的是用于精密制造的广义协作机器人和先进机械臂市场。市场研究预计，全球协作机器人（cobot）市场将从 2025 年约 $1.9 billion，以约 20% CAGR 增长到 2030
              年代中期；亚洲贡献 40%+ 收入份额，汽车和电子是锚定垂直行业。中国国产 cobot 份额预计 2023–2028 年以 20.1% CAGR 增长，达到 $2.8
              billion，驱动来自电子、汽车和金属机械等行业，而天机 3 kg 至 20 kg 负载产品矩阵正好映射这些场景。


              天机最窄、相关性最高的可服务层，是人形机器人 OEM 供应链中新兴的力控双臂子赛道。这是一个新的快速增长赛道，尚无干净的独立市场规模出版物。MarketsandMarkets
              报告元数据显示，中国人形机器人市场整体预计从 $0.40 billion（2025）增长到 $2.80 billion（2030），CAGR 为 47.6%。在其中，天机瞄准力控机械臂和关节模块组件层，以 B2B
              方式供应 OEM
              机器人集成商。该层较组装终端产品具备结构性更高的毛利率，但也要求深度传感器和控制系统集成，因此可信供应商数量有限。天机的可服务市场（SAM）不包括：完整人形机器人组装（天机当前供应机械臂而非整机）、重载工业六轴机器人（>20
              kg 负载、焊接 / 喷涂）、自主移动机器人（AMR）、物流自动化，以及消费或医疗机器人。
