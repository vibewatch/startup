      - number: '1.5'
        title: 里程碑、规模与认可
        blocks:
          - type: paragraph
            body: >-
              天机历史可分为三个阶段：2015–2020 年作为长盈精密内部自动化事业部的工业自动化孵化期；2020–2023 年更名并推出商业机器人产品线的机器人产品开发期；以及 2024
              年至今以力控人形双臂系统为中心的具身 AI 基础设施阶段。

              关键运营里程碑证实商业化牵引在加速。到 2022 年底，公司已服务 800 多家工业客户，超过 10,000 台机器人稳定在线运行——这些数字仍在官网关于页面作为公司进入人形机器人转向的基线被引用。2021
              年，机器人销量同比增长 6 倍，显著超过同期中国全国工业机器人产量 49% 的增长。公司同年还获得中国工信部「专精特新小巨人」称号。

              2025 年，天机在四个月内向 100 多家客户交付超过 2,000 台力控人形双臂单元，标志公司从原型走向量产。Robots Today
              将其报道为全球行业内首次力控人形双臂大批量交付，但这一「首次」说法尚未对所有全球竞争者做独立核验。2026 年 Q1，天机披露其人形机械臂产品在手订单超过 10,000 台，覆盖 45
              家全球人形机器人制造商和具身 AI 公司。产线一次通过率据报超过 99.5%。公司还在 2026 年 Q1 推出四款力控人形机械臂新品。

              2026 年 6 月，QCC 登记数据确认与哈尔滨工业大学的一项采购合同已完成，天机入选「第十一届中国最具投资价值企业百强榜」。公司持有 289 项授权专利和 33
              项软件著作权，并被认定为国家高新技术企业、广东省专精特新小巨人企业和广东省机器人骨干企业。截至本次报告日期，公开来源审阅未发现诉讼、监管处罚或产品召回。
