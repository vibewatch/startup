      - number: '4.2'
        title: 资本结构、融资历史与资金用途
        blocks:
          - type: paragraph
            body: >
              天机智能起源于深圳市长盈精密技术股份有限公司（300115.SZ）的内部自动化事业部，并在 2015 年正式重新注册为广东天机智能系统有限公司。Series B
              之前的历史资金主要来自母公司资本化，未单独拆分披露。截至 2026 年 5 月中国工商登记，天机注册资本约 RMB 177.8 million，实缴 RMB 120 million。长盈保留公司约 27%
              股权；CLH 142 (HK) Limited 持有约 19.7%，CEO 陈曦持有约 15.2%。


              2026 年 5 月，天机完成合并 Series B 与 B+ 融资，总额 RMB 10 亿（约 USD 140–147 million），由 GL Ventures / Hillhouse Capital
              与美团战投共同领投，腾讯、高榕资本、光合创投和 GGV Capital / Granite Asia 跟投。交易把投后估值抬升至 RMB 80–100 亿，使天机进入独角兽行列。


              公司披露资金分三类用途：技术研发（深化 MEMS 传感器、关节模块和运动控制算法）、大规模产能扩张（提高自动化率和一次通过率，以支撑超过 10,000
              台批量交付），以及全球销售网络建设（主要是北美客户获取和本地化技术支持）。各项具体资本预算未公布。天机的资产负债表、账面现金、月度烧钱速度，以及任何债务或信贷额度义务均完全未披露。
