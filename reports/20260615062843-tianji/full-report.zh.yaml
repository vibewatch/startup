      - number: '7.2'
        title: 融资、估值与治理风险
        blocks:
          - type: paragraph
            body: >
              Tianji 2026 年 5 月 Series B 融资约 ¥1B（≈$140M USD），投后估值 EqualOcean 报道约 ¥8B，Gasgoo 报道「接近 ¥10B」，Crunchbase 则折算为约
              $1.5B USD。这些估计之间的差距更多反映汇率折算时点和估值方法差异，而不是对轮次规模存在实质分歧。无论采用哪一口径，在 Tianji
              未于任何公开文件披露经审计财务、收入、毛利率或烧钱率的情况下，其估值都意味着在任何合理 2025 年收入假设上远高于 40× 的估计收入倍数。这一估值溢价完全建立在人形机器人 OEM 增长轨迹上，必须靠 45 家
              OEM 客户持续且加速的需求来消化；而这些客户的身份和财务健康状况完全不透明。公司治理结构引入了从公开来源很难充分评估的委托代理风险。Embodied Global 和 EqualOcean 均将
              Changying Precision Technology（Shenzhen Stock Exchange: 300115.SZ）列为 Tianji 主要股东。Changying 是上市硬件制造商，核心标签是
              Apple 和 Tesla 供应链组件供应商。它持有 Tianji 股权，至少带来三类治理风险：(1) 在产能受限阶段，母公司可能优先满足自身供应链承诺，而非 Tianji 生产需求；(2) Changying
              维持 Apple / Tesla 关系的战略利益，可能限制 Tianji 进入某些客户细分或开展可能产生冲突的国际合作；(3) Tianji 少数股东看不到 Changying
              股东权利的具体条款（董事席位、否决权、关联交易审批门槛）。更广泛的中国具身 AI 融资背景放大了这些治理风险：Crunchbase 报道，截至 2026 年 5 月中旬，中国机器人公司已通过 176 笔交易融资
              $5.6B，形成全赛道泡沫化动力，而历史上这类动力往往出现在估值正常化周期之前。
