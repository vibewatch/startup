      - number: '3.4'
        title: 护城河持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              天机的可防守位置由三项相互扣合的优势构成：（1）力控人形机械臂 OEM 供货中的先发规模——没有公开资料显示任何同行已出货可比规模；（2）人形机器人 OEM 依赖天机力 / 扭矩反馈
              API、固件校准和基于天机硬件训练的运动规划软件，由此产生集成锁定；（3）289 项授权专利构成的自研 IP 基础，提高近距离复制成本。IFR 数据确认，中国本土工业机器人供应商份额在 2024 年达到
              57%，说明天机进入的是一个优先利好中国供应商的本土优先竞争环境。

              但替代风险很实质。最明确的威胁是，天机 45 家 OEM
              客户——每家都已经集成天机硬件——一旦达到足够规模，可能投资自研力控机械臂，从而消除供应依赖。第二个威胁是低成本中国复制者：同一个制造生态给了天机成本优势，也让追随者能快速模仿，尤其是专利无法完全保护的核心机械和电子架构。Bloomberg
              对中国机器人融资热潮的报道把这一环境描述为引发「对泡沫的新担忧」，指出快速商业投资与有限可验证真实世界部署之间存在反差——这一风险也适用于天机自身市场主张。最后，IFR 在 2026 年 5
              月警示称，「真实世界人形机器人部署仍处于演示机或试点阶段」，削弱了支撑天机增长叙事的长期市场假设。
