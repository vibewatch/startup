      - number: '6.3'
        title: 科研与高校采用
        blocks:
          - type: paragraph
            body: >
              在商业客户基础之外，Tianji 还与三所中国顶尖工科高校设有正式联合研发中心：Hong Kong University of Science and Technology、Shanghai Jiao Tong
              University 和 Harbin Institute of Technology。Tianji 将这些合作描述为「核心技术联合实验室」，重点探索新的机器人技术，并把科研进展应用到 Tianji
              商业产品中。高校伙伴既是早期验证客户，也是共同开发协作者，让 Tianji 接入学术研究人才和论文发表通道，增强技术可信度。2026 年 6 月 QCC 工商注册更新——最新一条可独立验证的客户证据——记录了一则
              2026 年 6 月 9 日的「哈尔滨工业大学天机机械臂自购备案成交公告」。这是公开记录中唯一具名客户采购记录，确认至少一所中国顶尖研究机构已从合作协议推进到实际设备采购。HIT
              记录提供了有意义的验证，但不证明商业收入的重大性；研究机构采购量通常远小于工业或 OEM 销售。高校层对技术可信度和人才获取有战略重要性，而非收入主轴；这三所机构构成有意义但非核心的客户细分。
