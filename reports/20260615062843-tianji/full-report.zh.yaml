          - type: callout
            title: 公开数据未直接支撑力控机械臂子市场规模
            body: |
              没有已发表分析师报告能干净测算天机供应人形机器人 OEM 的力控双臂赛道。本章 $300–600M 的分析估计，是从订单量和行业 ASP 可比项推断得出。所有下游收入和估值预测都应对该估计采用较宽置信区间。
