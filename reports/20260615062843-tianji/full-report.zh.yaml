chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、创立与公司结构
        blocks:
          - type: paragraph
            body: >-
              广东天机智能系统有限公司是一家总部位于中国广东省东莞市松山湖高新区的机器人公司。公司是深圳市长盈精密技术股份有限公司（长盈精密；股票代码 300115.SZ）的子公司，后者是深圳上市精密制造商，也是 Apple
              和 Tesla 供应链核心供应商。

              中国官方统一社会信用代码登记显示，该法律实体成立于 2015-05-18，原名广东天机工业智能系统有限公司（USCC: 91441900337900581C）。2021 年 4
              月，公司更名为现名广东天机智能系统有限公司，同期战略转向人形机器人和具身 AI。另一实体广东天机机器人有限公司也在 2017 年成立，承担机器人产品开发职能；公司在产品和公关材料中常把 2017
              年称为「创立」年份，因此与 2015 年登记时间形成轻微叙事差异。

              公司注册资本为 RMB 177.78 million，实缴资本为 RMB 120 million。总部位于东莞松山湖高新区工业西三路 6 号 3 栋（邮编
              523000），作为运营基地；另在上海（闵行区）、昆山（江苏）和宜宾（四川）设有办公室。2025 年年报显示，公司参保员工 166 人；截至 2026 年本次报告日期，官网披露总员工 300+ 人、研发人员
              140+ 人。

              天机经营范围包括工业智能系统设计、机器人开发与制造、工业智能装备集成，以及工业智能系统咨询。范围还包括货物和技术进出口，并保留了 2020 年新增的二类医疗器械（口罩）等历史条目，反映 COVID
              期间的运营转向，但之后已被弱化。公司持有 289 项授权专利和 33 项软件著作权。公司愿景是「推动机器智能在工业和商业领域的应用，立志成为机器人行业的全球领导者」。

              市场传播中的官方品牌名为「TIANJI」或「Tianji Robotics」（天机智能），但法律实体名称沿用中国政府分类口径。公司当前 URL 为 www.tianjizn.com；截至 2026 年，旧域名
              www.tianji-robot.com 已无法解析。
