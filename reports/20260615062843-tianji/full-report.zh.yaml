      - number: '1.4'
        title: 产品组合与技术能力
        blocks:
          - type: paragraph
            body: >-
              天机旗舰产品线是 Marvin 系列力控人形双臂系统，包含三款型号：Marvin M3（3 kg 负载、615 mm 臂展、±0.05 mm 重复定位精度、7 轴）、Marvin M6CCS（6 kg
              负载、696 mm 臂展、±0.03 mm 重复定位精度、交叉腕）和 Marvin M6SRS（6 kg 负载、686 mm 臂展、±0.03 mm 重复定位精度、传统腕）。Marvin 系列面向人形机器人
              OEM，以及具身 AI 研究和商业场景。

              Pilot 7 是公司的旗舰协作机器人，具备 7 轴关节、7 kg 负载、1,066 mm 臂展、±0.03 mm 重复定位精度和 IP54 防护等级。更广泛的工业机器人组合包括：TR
              系列垂直多关节机器人（TR8：8 kg 负载、818 mm 臂展、±0.02 mm 重复定位精度、IP67 防护）；EVO 系列覆盖 4–25 kg 负载和 565–1,825 mm 臂展，全系 IP67
              防护；SR/SRD/SRZ/SRDZ/SPPR 系列 SCARA 机器人；以及高速 SRX8-652 SCARA 变体。公司还销售 DL 系列协作机器人、Nebula 通用运动控制器、TRC-Micro 和
              SRC-Micro 控制器，以及 MotoSim 离线仿真软件。TIANJI Fusion 控制系统支撑整个产品线。

              公司称自己是全球首家自研 MEMS 关节扭矩传感器并将其部署到机器人关节中的具身智能公司。关键技术规格包括：力控绝对精度 ≤0.3 N·m；扭矩环带宽 160 Hz；控制延迟最低 5 ms；平均轨迹误差 1.89
              mm；双臂一主二从毫秒级同步控制。Marvin M6S Lite 实现 62.5% 载重自重比（8 kg 臂体承载 5 kg 负载，8 kHz 扭矩闭环）。认证包括 CE、ISO/TS 15066、ISO
              13849-1 PLd (Cat. 3) 和 EN 60204-1:2018。

              产品矩阵覆盖人形机械臂 3–20 kg 负载，以及更广组合的 3–25 kg 负载，应用场景从算法调试、远程遥操作，到复杂商业和工业生产流程，包括 3C
              电子、汽车电子、新能源、医疗器械、家电、食品和鞋服制造。公司运营 16,500 m² 设施；截至 2026 年 5 月，产线报告一次通过率超过 99.5%。
