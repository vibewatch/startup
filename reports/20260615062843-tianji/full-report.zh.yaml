      - number: '6.2'
        title: 人形机器人 OEM 生态与 2026 年 Q1 订单激增
        blocks:
          - type: paragraph
            body: >
              2025–2026 年最具商业意义的客户变化，是 45 家全球人形机器人 OEM 制造商和具身 AI 独角兽，成为 Tianji 最有战略价值的客户层。仅 2025 年四个月，Tianji 就向 100
              多个账户交付超过 2,000 台力控双臂单元，并称这是行业首次实现此类系统的大规模交付。到 2026 年 Q1 末，力控人形机器人手臂积压订单超过 10,000
              台，成为增长最快、曝光最高的细分业务。这一层客户是人形机器人制造商，他们把 Tianji 的 Marvin 双臂平台嵌入自家系统，作为物理操作层，并与自己的 AI 栈协同部署。Tianji
              将这种关系描述为向这些公司提供「小脑和双手」，加快具身 AI 从实验室走向商业环境。公司产线声称一次通过率超过 99.5%，并以此向 OEM 客户证明规模化可靠性。Series B
              募资将用于北美扩张，组建本地销售和技术支持团队，切入领先国际具身 AI 公司的核心供应链，显示其野心不止于当前中国 OEM 集中度。OEM 模式让 Tianji
              深度嵌入人形机器人生态，但也带来双边风险：需求完全与人形机器人 OEM 客户是否愿意继续投入并放大自有项目相关；具身 AI 投资一旦放缓，手臂订单可能迅速连锁下滑。
