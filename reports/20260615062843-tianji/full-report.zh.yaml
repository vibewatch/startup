      - number: '8.2'
        title: 估值背景、融资分析与隐含倍数
        blocks:
          - type: paragraph
            body: >
              2026 年 5 月 25 日 Series B/B+ 交割，是 Tianji 自 Changying Precision 生态内早期融资以来首个外部定价轮。合计 RMB 1 billion 融资采用连续 B 与
              B+ 两个 tranche 结构——所有公开报道均称两者同时完成——投后估值 EqualOcean 报道为 RMB 8 billion，36kr 和 Gasgoo 报道为「接近 RMB 10
              billion」。这些数字差异可能来自汇率换算时点，以及是否计入应计优先权或管理费调整；两种估计都意味着公司跨过 $1 billion USD 的独角兽门槛。Crunchbase 和 InforCapital
              将该数字折算为约 $1.5 billion USD，隐含 CNY/USD 汇率接近 7.0；Yicai 自己按 $147.4M 融资额 / 1B CNY 计算，则隐含 6.79
              CNY/USD。美元等值估值范围（$1.1B–$1.5B）反映方法差异，而不是对底层人民币数字存在分歧。

              收入没有公开披露。不过，Tianji 报告的商业里程碑允许自下而上估算收入。2025 年，公司在四个月内向 100 多家客户交付超过 2,000 台力控双臂单元；另据公司称，自成立以来工业协作臂累计出货超过
              30,000 台。假设 Marvin Series 双臂机器人的 ASP 为 RMB 100K–200K（与中国市场工业级协作臂定价一致），2025 年双臂分部收入约为 RMB
              200M–400M。再加入传统工业臂收入（基于 800+ 累计客户和较低 ASP 的 SCARA/SR 系列，估计 RMB 50M–150M），意味着 2025 年总收入区间为 RMB 250M–550M。按
              RMB 8B 投后估值计算，EV/revenue 倍数约为 15×–32×；按 RMB 10B 计算，则为 18×–40×。

              这些倍数按传统工业机器人标准偏高，但与 2026 年中国具身 AI 投资 cohort 一致：2026 年 Q1 单季就有 18 笔披露交易超过 RMB 1 billion，约 20 家公司达到
              EmbodiedGlobal 和 Crunchbase 数据所称的「近独角兽」（>RMB 10B）估值。Hillhouse 同期以 $1.9B USD 估值投资 TARS Robotics $513M
              种子轮，而该公司收入为零，这佐证市场正在套用期权价值框架，而非传统倍数。B/B+ tranche 结构也引入了清算优先权堆叠：如果任一 tranche 带有 1× 或更高的非参与型清算优先权，早期退出或
              down-round 场景会先向 B/B+ 投资人返还资本，再轮到更早期或普通股股东，从而在较低退出价格下压缩有效股权价值。具体优先权条款未公开披露。
            claimRefs:
