            title: Agilink 与内部机械臂设计是近期最清晰威胁
            body: >-
              2026–2028 年窗口中，最可能落地的竞争威胁不是在位 cobot 玩家（产品周期太慢），也不是整机具身 AI 创业公司（供应层级不同），而是：（1）AgiBot 拆分出的 Agilink
              以授权组件模式切入灵巧手，并有路径走向双臂力控；（2）天机最大 OEM 客户达到让内部机械臂设计具备经济合理性的规模。两种情景都会削弱支撑天机护城河的 OEM 依赖，无需新进入者从零搭建。
