      - number: '6.4'
        title: 留存、集中度风险与尽调缺口
        blocks:
          - type: paragraph
            body: >
              本章最主要的分析难点，是 Tianji 客户关系质量几乎完全不透明。净收入留存率、毛留存率、流失数据、平均合同期限、按 cohort 的复购统计，公开渠道均不可得。公司只披露了顶层数量指标（1,000+
              个账户、20,000+ 台）和两个相隔约两年的汇总快照；据此只能推得粗略增长趋势，无法把留存和新客获取拆开。对于人形机器人 OEM 层，10,000 台积压订单没有说明其中多少是首次试单，多少是同一 OEM
              的复购，也没有披露 45 家客户之间的订单规模分布。客户集中度是重大风险。如果 45 家人形机器人 OEM 客户中即便少数几家贡献了大多数手臂订单，任何一家流失或融资受阻，都会对 Tianji
              的人形机器人收入造成不成比例的冲击。Bloomberg 2026 年 4 月对中国机器人热潮的分析明确指出，集中度和炒作动力仍是该领域组件供应商未解决的问题，并指出持续客户需求尚未在 VC
              驱动的原型周期之外得到独立证明。工业分部（1,000+ 个账户）提供了更分散的基础，但它相对高速增长的人形机器人层，对总收入贡献多少仍未知。Tianji
              仍是私有且披露不足的公司；所有垂直领域都缺少独立具名客户，这是持续存在的证据缺口，使留存和韧性判断无法获得更高置信度。
