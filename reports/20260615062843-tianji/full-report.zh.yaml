  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 地缘政治、监管与出口管制风险
        blocks:
          - type: paragraph
            body: >
              Tianji 在 Series B 新闻材料中突出强调国际扩张野心，但这一目标正撞上加速升级的中美科技竞争，带来有意义的监管风险。近年，美国 Bureau of Industry and
              Security（BIS）扩大了 Entity List 和 Export Administration Regulations 限制，瞄准具备军民两用技术能力的中国公司，包括
              AI、先进半导体和机器人领域。截至研究日期，Tianji 本身未公开出现在任何受限名单上；但其母公司 Changying Precision 与 Apple、Tesla 的供应链关系，让 Tianji
              间接暴露于力控执行器、先进伺服驱动或 AI 推理硬件的军民两用出口管制升级风险。若假设性进入 Entity List，Tianji 的北美扩张计划，以及从美国供应商或关联方采购组件的能力，都会受到实质阻碍。IFR
              2026
              年中全球机器人评估确认，尽管公开演示频繁，人形机器人「在真实生产场景中的实际能力目前仍局限于演示或试点项目」，这为需求预期加上市场成熟度折扣。与此同时，中国加速国内机器人政策：第十五个五年规划（2026–2030）将
              AI 驱动机器人列为国家核心战略优先事项，既创造支持性的本土市场，也加剧来自国家支持同行的竞争强度。安全标准方面，Association for Advancing Automation（A3）在近八年开发后，于
              2025 年初发布修订版 ISO 10218 工业机器人安全标准。此次大修整合了原先放在 ISO/TS 15066
              中的协作机器人安全要求，新增工业机器人网络安全要求，并引入新的机器人分类标准及配套功能安全测试方法。北美认证机构（ANSI R15.06、CSA Z434）正在采纳新版 10218。Tianji
              若在新版标准合规认证上延迟，可能推迟美国市场销售。另一个因素是，美国 OSHA 没有专门机器人安全标准，监管环境模糊；这给 Tianji
              市场进入留下灵活性，也让企业客户缺少清晰合规路线图，可能拖慢大规模采购决策。
