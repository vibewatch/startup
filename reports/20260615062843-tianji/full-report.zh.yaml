      - number: '7.3'
        title: 运营、供应链与产品可靠性风险
        blocks:
          - type: paragraph
            body: >
              Tianji 从 2025 年前四个月约 2,000 台力控双臂交付，提升到仅 2026 年 Q1 订单 10,000+ 台，单季爬坡超过 5×。公司称一次通过率超过
              99.5%，但该数字为自报且未经审计。在这种规模下，生产质量一旦失效——尤其是力控故障发生在靠近人类工人的现场事故——Tianji
              将面临显著品牌损害、产品责任索赔，以及在安全标准仍在演进且尚未定稿的司法辖区遭遇监管审视。机器人事故往往在编程、维护、安装等非常规运行条件下更容易发生，而早期 OEM
              部署正常见这些场景：集成工程师会把机械臂能力推到已测试参数之外。2025 年 ISO 10218 修订版专门加入工业机器人网络安全要求，反映 AI 驱动协作系统攻击面扩大。嵌入 AI 模型的力控手臂（如
              Tianji Marvin 平台）会面临对抗操纵、prompt-injection 或模型投毒风险，而传统机器人安全标准并未覆盖这些问题。美国 OSHA 明确认可机器人行业没有具体 OSHA
              标准，形成监管真空；在 ANSI R15.06（北美采纳 ISO 10218 2025）定稿前，美国企业客户会面临认证不确定性。供应链集中度是重大运营风险。Changying Precision
              既是主要股东，也很可能凭借制造专长成为关键硬件供应商（伺服驱动、结构件）。Changying 的 Apple / Tesla 供应承诺与 Tianji
              爬坡需求若发生产能冲突，可能引入交期延误，进而违背客户交付承诺。robozaps 人形机器人市场数据库跟踪到全球 26 家人形机器人制造商、合计 $4B+
              VC——它们都在争夺同一批有限的合格力控工程人才、精密伺服供应商和 AI 加速硬件。Tianji 作为双臂力控系统批量生产先行者的优势是真实的，但不是永久的。
