        - 与管理层签署有约束力的 NDA；要求按客户层级拆分收入
      - - 在手订单转化率
        - Q1 2026 10,000 台在手订单的 ASP；在手订单中有约束力采购订单 vs. 意向书的比例
        - 有约束力与非约束性在手订单的区分，对收入质量评估很关键
        - 管理层访谈；查阅采购订单样本
      - - IP 自由实施
        - MEMS 关节扭矩传感器专利版图 vs. 日本 / 德国在位者；中国专利覆盖
        - 核心差异化技术；在位者 IP 挑战可能打断生产
        - IP 律师审查 WIPO/CNIPA 专利版图；出具自由实施意见
      - - 治理和关联交易
        - Tianji 与长盈精密之间所有交易的范围和条款（供应、制造、IP、债务）
        - 长盈既是 27% 股东又是供应商，形成系统性关联方风险
        - 查阅长盈精密 300115.SZ 年报披露；与 Tianji 直接审查合同
    claimRefs:
      - CV042
