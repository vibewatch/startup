    - type: private-evidence-only
      severity: material
      topic: governance-structure
      missingEvidence: >
        Board composition including number of Changying-designated directors; minority
        investor governance rights (anti-dilution, liquidation preference, veto rights);
        related-party transaction approval thresholds; independent director appointment.
      whyItMatters: >
