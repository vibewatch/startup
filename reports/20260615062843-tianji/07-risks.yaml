  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: financial-opacity
      missingEvidence: >
        Audited revenue, gross margin, operating expenses, cash position, and burn rate
        for fiscal year 2025 and the first half of 2026.
      whyItMatters: >
        Without revenue data, the ¥8B valuation multiple cannot be calculated precisely,
        the adequacy of Series B proceeds for the announced expansion plan cannot be
        evaluated, and the likelihood of a down-round in the next 12–18 months cannot be
        assessed. This is a blocking gap for any investment or partnership decision.
      diligencePath: >
        Request audited financial statements for FY2025; request management accounts for
        H1 2026; review Changying Precision (300115.SZ) financial disclosures for any
        Tianji-related subsidiary revenue lines.
      relatedQuestionRefs:
