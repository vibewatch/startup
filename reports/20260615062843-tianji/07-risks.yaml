    - type: private-evidence-only
      severity: blocking
      topic: customer-concentration
      missingEvidence: >
        Names of the 45 humanoid OEM customers; order-size distribution across accounts;
        top-3 and top-5 revenue concentration; customer credit quality and funding status.
      whyItMatters: >
        All 45 OEM customer names are undisclosed. Without names, the credit risk, funding
        health, and order-firmness of the customer base cannot be assessed. If the top-3
        customers represent >50% of backlog, concentration risk is equivalent to a single
        strategic-customer dependency.
      diligencePath: >
        Request customer concentration schedule (top-3, top-5 revenue share) as a diligence
        prerequisite; conduct back-channel checks with component distributors in the Dongguan
        humanoid ecosystem; review public funding announcements of Chinese embodied AI unicorns
        for potential Tianji customer identification.
