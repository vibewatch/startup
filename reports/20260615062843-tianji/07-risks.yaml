company:
  name: Guangdong Tianji Intelligent System Co., Ltd.

chapter:
  number: 7
  title: Risks
  summary: >
    Tianji faces a multi-layer risk profile that spans geopolitical, regulatory, governance,
    operational, and market-timing dimensions. The May 2026 Series B priced the company at
    approximately ¥8B post-money with no public revenue disclosure, implying a >40× estimated
    revenue multiple that requires sustained humanoid OEM demand to justify. Changying Precision
    (Shenzhen Stock Exchange: 300115.SZ) controls a major equity stake while simultaneously
    being a core hardware supplier to Apple and Tesla supply chains, creating governance and
    supply-chain prioritization conflicts. All 45 humanoid OEM customer names are undisclosed,
    making concentration risk unquantifiable. The IFR (International Federation of Robotics)
    noted as recently as mid-2026 that humanoid capabilities in real-world production scenarios
    remain "currently limited to demonstrators or pilot projects," exposing Tianji's growth
    narrative to meaningful demand-timing risk. Safety compliance obligations are evolving rapidly
    with the 2025 ISO 10218 major overhaul and emerging US/EU cybersecurity requirements, and
    OSHA maintains no specific robotics safety standards, creating a regulatory vacuum that
    cuts both ways. China-US technology competition escalation adds export-control headwinds
    that could constrain access to advanced chips and future international customers. Together
    these factors place Tianji in the high-growth/high-risk quadrant typical of the 2026
    Chinese embodied AI unicorn cohort.

sections:
  - id: geopolitical-regulatory-export-control
    title: Geopolitical, Regulatory, and Export-Control Risks
    body: >
      Tianji's international expansion ambitions—prominently flagged in its Series B press
      materials—collide with an accelerating China-US technology competition that imposes
      meaningful regulatory risk. The US Bureau of Industry and Security (BIS) has in recent
      years expanded Entity List and Export Administration Regulations restrictions targeting
      Chinese companies with dual-use technology capabilities, including in AI, advanced
      semiconductors, and robotics. While Tianji itself has not been publicly cited on any
      restricted list as of the research date, the company's Changying Precision parent's
      supply-chain relationships with Apple and Tesla create indirect exposure to any escalation
      in dual-use export controls on force-control actuators, advanced servo drives, or AI
      inference hardware. A hypothetical Entity List designation would materially impede
      Tianji's planned North America expansion and its ability to source components from
      US suppliers or affiliates. The IFR's mid-2026 global robotics assessment confirmed that
      despite public demonstrations, humanoid robot "actual capabilities in real-world
      production scenarios are currently limited to demonstrators or pilot projects," adding
      a market-readiness caveat that restrains demand expectations. China has simultaneously
      accelerated its domestic robotics policy: the 15th Five-Year Plan (2026–2030) designates
      AI-powered robots as a core national strategic priority, creating a supportive home market
      but also increasing competitive intensity from state-backed peers.
      On the safety standards front, the Association for Advancing Automation (A3) published
      the revised ISO 10218 industrial robot safety standard in early 2025 after nearly eight
      years of development. The overhaul integrates collaborative-robot safety requirements
      previously housed in ISO/TS 15066, adds cybersecurity requirements for industrial robots,
      and introduces new robot classification criteria with corresponding functional safety
      test methodologies. North American certification bodies (ANSI R15.06, CSA Z434) are
      in the process of adopting the new 10218. Any delay in Tianji's compliance certification
      under the revised standard could defer US market sales. Separately, the US OSHA maintains
      no specific robotics safety standards, creating an ambiguous regulatory environment that
      gives Tianji market entry flexibility but also leaves enterprise customers without a
      clear compliance roadmap, potentially slowing large-scale procurement decisions.
