  - id: customer-concentration-market-timing
    title: Customer Concentration, Market Timing, and Competitive Risks
    body: >
      Tianji's most strategically important customer tier—the 45 global humanoid OEM and
      embodied AI unicorn accounts—is also its most opaque and most concentrated risk
      exposure. No individual customer names have been disclosed across any of the Series B
      announcement channels (EqualOcean, Gasgoo, Yicai Global, Pandaily, RobotToday), and the
      company's own website and application-case pages name zero commercial accounts.
      The 10,000+ unit Q1 2026 order backlog does not clarify whether these represent binding
      purchase orders, letters of intent, or framework agreements, and there is no public
      data on the distribution of order sizes across the 45 customers. If a small number of
      accounts—say, three to five—represent the majority of that backlog, Tianji faces
      customer-concentration risk comparable to a company with a single strategic anchor
      customer. A funding disruption, program cancellation, or competitive switch at any
      major OEM customer would have outsized impact on revenue.
      Market timing poses the most fundamental risk to the growth thesis. The IFR—one of the
      most credible global robotics industry bodies—explicitly noted in mid-2026 that despite
      compelling public demonstrations, humanoid robots' "actual capabilities in real-world
      production scenarios are currently limited to demonstrators or pilot projects." This
      view implies that the 45 OEM customers building humanoid robots are themselves operating
      at a pilot/pre-commercial stage, which means Tianji's arms are being purchased for
      integration and testing rather than for recurring production revenue. A 12–24 month
      delay in the commercialization timeline of its OEM customers would substantially reduce
      re-order rates and expose the ¥8B valuation to downward revision. AgiBot and Agile
      Robots, among others, offer competing force-control robotic arm solutions, confirming
      that Tianji's product differentiation is under active competitive pressure. The Stanford
      HAI AI Index confirms that global AI and robotics investment reached record levels in
      2024–2025, a pattern historically associated with peak-cycle funding dynamics and
      subsequent valuation correction.
