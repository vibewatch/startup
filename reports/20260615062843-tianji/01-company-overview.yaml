  - id: leadership-governance
    title: Leadership and Governance
    body: >-
      Chen Xi (陈曦) is the legal representative, Chairman (董事长), and General Manager (经理) of
      Guangdong Tianji Intelligent System, as recorded in the QCC official business registry. He is also
      a beneficial owner holding approximately 6.22% of the company directly, with additional indirect
      stakes through affiliated consulting partnerships.

      The board and senior leadership team includes Zou Rui (邹锐), a director holding approximately
      5.97% ownership; Dong Zhonglang (董中浪), a director; An Jie (安杰), a director; and Duan Kaihua
      (段凯铧), a supervisor. Huang Naihao (黄乃豪) serves as the financial executive. The full complement
      of non-executive directors and the board's committee structures are not publicly disclosed.

      The company's R&D center was co-founded with engineering talent jointly dispatched from Yaskawa
      Electric and Changying Precision (Everwin Precision), combining Yaskawa's world-class servo motor
      and motion-control technology with Changying Precision's precision manufacturing capabilities and
      system-integration experience. This arrangement reflects the industrial lineage of Tianji's
      technical approach and partially explains the strong mechanical precision in its robot product line.

      Tianji has established research partnerships with three universities: Hong Kong University of
      Science and Technology, Shanghai Jiao Tong University, and Harbin Institute of Technology. These
      joint laboratories are focused on exploring new robotics technologies and applying the latest
      scientific advances to Tianji's products. The QCC registry lists approximately 20 affiliated
      companies and legal entities connected to the leadership and corporate structure.

      The governance structure reflects Tianji's status as a corporate subsidiary rather than an
      independent founder-led startup: the largest single shareholder is the publicly traded parent
      (Shenzhen Everwin Precision) at approximately 27%, followed by CLH 142 (HK) Limited at
      approximately 19.72%, whose ultimate beneficial ownership is not publicly disclosed. Chen Xi holds
      approximately 15.23% as an individual beneficial owner. Key-person risk is concentrated in
      Chen Xi given his combined Chairman, CEO, and beneficial-owner roles. Material leadership changes
      have not been reported.
