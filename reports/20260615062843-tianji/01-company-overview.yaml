figures:
  - id: FO001
    title: Tianji Company Milestone Timeline
    type: timeline
    layout: wide
    summary: >-
      Chronological view of Tianji's founding, financing, product, and scale milestones from 2015 to
      mid-2026, illustrating the pivot from industrial automation subsidiary to embodied AI unicorn.
    data:
      items:
        - label: "Legal entity founded"
          date: "2015-05-18"
          detail: >-
            Guangdong Tianji Industrial Intelligent System Co., Ltd. established as automation subsidiary
            of Changying Precision (300115.SZ) in Songshan Lake, Dongguan
          tone: positive
        - label: "Robot product arm launched"
          date: "2017-01-01"
          detail: >-
            Guangdong Tianji Robot Co., Ltd. established; R&D team co-founded with Yaskawa Electric and
            Changying Precision engineering talent; commercial robot product development begins
          tone: positive
        - label: "6x sales growth; Little Giant award"
