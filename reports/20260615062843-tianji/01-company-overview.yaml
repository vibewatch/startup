  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: financials
      missingEvidence: >-
        Revenue, ARR, gross margin, and unit economics for Tianji Intelligent; company is a private
        subsidiary that has disclosed no financial statements.
      whyItMatters: >-
        Without revenue data, the RMB 8–10B valuation cannot be assessed on a revenue-multiple basis,
        making it impossible to determine whether the valuation is reasonable or stretched.
      diligencePath: >-
        Request financials from parent company (Changying Precision 300115.SZ annual report); conduct
        bilateral financial due diligence; review any public regulatory filings by Changying that
        consolidate Tianji.
      relatedQuestionRefs:
        - QO012

    - type: missing-source
      severity: material
      topic: prior-rounds
      missingEvidence: >-
        Specific amounts, terms, and full investor list for Series A and Series A+ rounds; only investor
        identities are available via QCC; the dollar amounts remain undisclosed.
      whyItMatters: >-
        Total lifetime capital raised and per-round dilution cannot be calculated, limiting the ability
        to assess the cap table evolution and founder/management stake dilution.
      diligencePath: >-
        Request cap table from the company; review Changying Precision press releases and periodic
        disclosures for mentions of Tianji funding; check CNIPA patent filings for investment dates.
