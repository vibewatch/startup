            Renamed from Guangdong Tianji Industrial Intelligent System Co., Ltd. to Guangdong Tianji
            Intelligent System Co., Ltd.; strategic pivot toward broader embodied AI positioning
          tone: neutral
        - label: "800+ clients; 10,000+ robots online"
          date: "2022-12-31"
