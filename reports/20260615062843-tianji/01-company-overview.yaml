company:
  name: Guangdong Tianji Intelligent System Co., Ltd.
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Guangdong Tianji Intelligent System Co., Ltd. (天机智能), a wholly-owned subsidiary spun out of
    Shenzhen Everwin Precision Technology (300115.SZ), completed a combined RMB 1 billion ($147 M USD)
    Series B and B+ round in May 2026 co-led by GL Ventures (Hillhouse) and Meituan Strategic Investment,
    reaching a post-money valuation of RMB 8–10 billion and joining the unicorn ranks. Founded as an
    industrial-automation entity in May 2015 and formally pivoting to force-controlled humanoid dual-arm
    robots around 2021–2024, the company reported Q1 2026 orders exceeding 10,000 units across 45 global
    humanoid robot OEMs, positioning it as the world's largest shipping force-control humanoid arm supplier.
sections:
  - id: identity-corporate-structure
    title: Identity, Founding, and Corporate Structure
    body: >-
      Guangdong Tianji Intelligent System Co., Ltd. (广东天机智能系统有限公司) is a Dongguan-based robotics
      company registered in the Songshan Lake High-Tech Zone, Guangdong Province, China. The company
      operates as a subsidiary of Shenzhen Everwin Precision Technology Co., Ltd. (长盈精密; stock code
      300115.SZ), a Shenzhen-listed precision manufacturer that serves as a core supplier to Apple and
      Tesla supply chains.

      The legal entity was established on 2015-05-18 under the name Guangdong Tianji Industrial Intelligent
      System Co., Ltd. (广东天机工业智能系统有限公司), according to China's official unified social credit code
      registry (USCC: 91441900337900581C). In April 2021, the company was renamed to its current form,
      Guangdong Tianji Intelligent System Co., Ltd., coinciding with a strategic pivot toward humanoid
      robotics and embodied AI. A separate entity, Guangdong Tianji Robot Co., Ltd. (广东天机机器人有限公司),
      was also established in 2017 as the robot product development arm; the company often references 2017
      as its "founding" in product and PR materials, creating a minor narrative discrepancy versus the 2015
      registration.

      The company's registered capital stands at RMB 177.78 million, with paid-in capital of RMB 120
      million. Its headquarters at Building 3, No. 6 Gongye West 3rd Road, Songshan Lake Hi-Tech Zone,
      Dongguan (postal code 523000), serves as the operational base, with additional offices in Shanghai
      (Minhang District), Kunshan (Jiangsu), and Yibin (Sichuan). The company maintains 166 insured
      employees as of the 2025 annual report, with 300+ total staff and 140+ R&D personnel reported on
      the official website as of the 2026 run date.

      Tianji's business scope encompasses industrial intelligent system design, robot development and
      manufacturing, industrial intelligent equipment integration, and industrial intelligent system
      consulting. The scope also includes goods and technology import/export, and residual legacy entries
      from 2020 for second-class medical devices (face masks), reflecting COVID-era operational pivots
      that have since been de-emphasized. The company holds 289 authorized patents and 33 software
      copyrights. The company's vision is "advancing the application of machine intelligence in industrial
      and commercial fields, aiming to become a global leader in the robotics industry."

      The official brand name in market communications is "TIANJI" or "Tianji Robotics" (天机智能), though
      the legal entity name references the Chinese governmental classification. The company's current URL
      is www.tianjizn.com, and its legacy domain www.tianji-robot.com is unresolvable as of 2026.
