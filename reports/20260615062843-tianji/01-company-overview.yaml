    body: >-
      No revenue, ARR, or margin data are publicly available for Tianji. The RMB 8–10B valuation implies
      significant forward expectations. Unicorn valuations in the 2026 embodied AI wave may reflect market
      optimism rather than current commercial traction, as noted in third-party unicorn tracking analysis.
    claimRefs:
