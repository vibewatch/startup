  - id: technical-differentiation-and-ip-position
    title: Technical Differentiation and IP Position
    body: >-
      Tianji's primary technical differentiation claim rests on joint-integrated MEMS torque sensing
      across all seven degrees of freedom, contrasting with the external wrist force-torque sensor
      approach used by Flexiv's Rizon series. ABB's YuMi dual-arm collaborative robot is rated at
      only 500 g payload per arm, compared to the Marvin M6CCS's 6 kg — a 12× payload advantage that
      is material for the assembly tasks Tianji targets. Universal Robots' e-Series cobots and
      Fairino's product line do not disclose MEMS joint-sensing architectures or torque bandwidth
      specifications, preventing direct point-to-point comparison but suggesting differentiated
      design approaches.

      The company holds 289 authorized patents and 33 software copyrights as self-reported on its
      official website and partially corroborated by the QCC registry. Recent 2026 patent activity
      includes granted invention patents for robot motion planning and force control methods in April
      2026, and filed invention patents for a multi-order differential tracker control method, DH
      parameter auto-calibration for redundant arms, and a joint module torque control method. The
      breadth of recent patent filings suggests active development of the algorithmic layers that
      underpin the MEMS sensing architecture. Four new force-control humanoid arm product models were
      announced in Q1 2026, per RobotToday's industry briefing, reflecting continued product roadmap
      execution. The independence and enforceability of software-layer patents remain uncertain given
      the Yaskawa toolchain heritage underlying MotoSim.
