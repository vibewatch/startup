  - id: core-hardware-architecture-mems-sensors-integrated-joints
    title: "Core Hardware Architecture: MEMS Sensors and Integrated Joints"
    body: >-
      The Marvin series is underpinned by joint-level MEMS (micro-electromechanical systems) torque
      sensors that Tianji claims were the world's first self-developed MEMS joint torque sensors
      deployed in robot joints at commercial scale. Each of the seven joints on the M6CCS carries a
      MEMS torque sensor as standard, enabling per-joint force measurement without an external wrist
      force-torque sensor — a design contrast to competitor approaches that locate force sensing only
      at the wrist. According to the company's published product specifications, the absolute torque
      measurement accuracy is ≤0.3 N·m and the torque-loop bandwidth reaches 160 Hz; force
      repeatability is specified at ≤0.15 N and ≤0.05 N·m. These figures are company-claimed and
      have not been independently verified as of June 2026.

      The integrated joint module achieves a stated 8 kHz torque closed-loop control rate and uses
      dual absolute-value encoders per joint for position feedback. The Marvin M6S Lite variant
      achieves a 62.5% load-to-weight ratio: a 5 kg payload on an 8 kg arm body. Communication
      uses EtherCAT with a ≤1 ms cycle time, and the dual-arm system adopts a one-master-two-slave
      architecture that synchronizes two 7-axis arms through a single motherboard. The company claims
      5 ms end-to-end control latency and a 1.89 mm average trajectory error under its internal
      benchmarking. The Marvin M6CCS reaches a TCP maximum speed of 2 m/s and joint maximum speed
      of 180°/s. Physical protection is rated IP54 for the Marvin series, which is less robust than
      the IP67 rating of the industrial EVO and TR series. No third-party benchmark, academic
      publication, or independent laboratory report corroborating the MEMS performance specifications
      has been identified as of the run date.
