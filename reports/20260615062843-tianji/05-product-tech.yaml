  evidenceGaps:
    - type: missing-source
      severity: material
      topic: mems-world-first-claim
      missingEvidence: >-
        Independent academic paper, patent prior-art search result, or third-party benchmark report
        that either confirms or disputes Tianji's claim to be the world's first company to
        commercially deploy self-developed MEMS joint torque sensors in robot joints at scale.
      whyItMatters: >-
        The "world's first MEMS joint torque sensor" claim is the primary technical moat narrative
        in all investor and marketing communications. If a competitor can document an earlier or
        concurrent commercial deployment — whether Unitree, UFACTORY, or a non-Chinese supplier —
        the differentiability claim is significantly weakened.
      diligencePath: >-
        Search IEEE Xplore and Google Scholar for MEMS torque sensors in robot joints published
        before 2024; check WIPO PatentScope for MEMS joint torque sensor patents with priority
        dates predating Tianji's filings; request written disclosure from Tianji legal team on
        prior-art search findings.
      relatedQuestionRefs:
        - QE009

    - type: missing-source
      severity: material
      topic: unverified-performance-claims
      missingEvidence: >-
        Independent third-party benchmark reports or test-laboratory data validating Tianji's
        stated performance specifications: 5 ms control latency, 1.89 mm average trajectory error,
        160 Hz MEMS torque bandwidth, and ≤0.3 N·m absolute accuracy under real-world operating
        conditions.
      whyItMatters: >-
        Investors and OEM customers making procurement decisions based on these specs cannot
        independently verify them from public sources. If post-deployment performance diverges
        materially from stated specs, it creates product liability exposure and OEM customer
        churn risk. Bloomberg's April 2026 adverse reporting specifically flagged unverifiable
        performance claims as a category-wide concern for Chinese humanoid robotics startups.
      diligencePath: >-
        Request Tianji's internal test reports, ISO/TS 15066 compliance test data, and
        independent test-lab certificates; commission independent third-party hardware benchmarking
        under standardized conditions (e.g. ISO 9283 manipulation robot performance evaluation)
        before investment close.
      relatedQuestionRefs:
        - QE010

    - type: private-evidence-only
      severity: minor
      topic: oem-customer-identity
      missingEvidence: >-
        Specific names, headquarters, funding status, and platform architectures of the 45 OEM
        humanoid robot customers that placed orders for Tianji's arms in Q1 2026; also the
        split of orders across customer concentration (e.g., top-3 customers as share of backlog).
      whyItMatters: >-
        Order concentration is a critical risk factor. If three or fewer OEM customers represent
        more than 60% of the 10,000+ unit backlog, a single OEM failure to commercialize its
        humanoid platform would materially impair Tianji's near-term revenue realization.
      diligencePath: >-
        Request customer list with order volumes under NDA from Tianji; assess each OEM's
        financial health (VC-funded vs. revenue-generating), product stage (prototype vs.
        commercial), and expected deployment timeline.
      relatedQuestionRefs:
        - QE024
