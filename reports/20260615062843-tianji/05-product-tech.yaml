  - id: FE002
    title: Customer workflow / operating flow
    type: flow
    layout: wide
    summary: >-
      End-to-end flow from customer requirement identification through integration, commissioning,
      and production deployment of Tianji's force-control arms in an OEM or factory setting.
    data:
      nodes:
        - id: need
          label: "Customer identifies force-control need"
          detail: "OEM team or factory identifies tasks requiring sub-mm compliance or >0.5 N·m torque precision beyond conventional cobot capability"
        - id: selection
          label: "Product selection (Marvin / Pilot 7 / EVO)"
          detail: "Choose arm based on payload (M3 3 kg, M6 6 kg, Pilot 7 7 kg), reach, and collaboration-safety certification requirements (ISO/TS 15066 for M6CCS)"
        - id: simulation
          label: "Offline simulation with MotoSim EG-VRC"
          detail: "Engineer programs robot path offline using VRC+VPP; validates coverage and avoids collision before physical hardware is deployed"
        - id: integration
          label: "EtherCAT and MotoPlus SDK integration"
          detail: "Integrator connects arms to host via EtherCAT; embeds custom force-control tasks using MotoPlus C SDK for OEM-specific behavior"
        - id: force_cal
          label: "Force sensor calibration and tuning"
          detail: "MEMS sensor baselines established; impedance/compliance parameters tuned for target task (screw torque, insertion force, polishing pressure)"
        - id: prod_deploy
          label: "Production deployment"
          detail: "Arm(s) enter production line; MotoSim path executes on physical hardware; real-time EtherCAT telemetry closes the control loop"
        - id: data_acq
          label: "Force-feedback data acquisition (AI path)"
          detail: "OEM teams use teleoperation or demonstration mode to capture high-fidelity force trajectories for training foundation models"
        - id: scale
          label: "Scale / expand"
          detail: "Successful deployment drives repeat orders; Tianji's Q1 2026 10,000-unit backlog reflects this cycle across 45 OEM customers"
      edges:
        - from: need
          to: selection
          label: "Specs match"
        - from: selection
          to: simulation
          label: "Program offline"
        - from: simulation
          to: integration
          label: "Deploy program"
        - from: integration
