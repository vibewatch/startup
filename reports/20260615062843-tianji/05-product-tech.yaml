figures:
  - id: FE001
    title: Product architecture map
    type: stack
    layout: wide
    summary: >-
      Layered decomposition of Tianji's product architecture from physical sensing through to the
      application layer, showing the key components at each tier.
    data:
      layers:
        - id: sensing
          label: "Sensing Layer — MEMS Joint Torque Sensors"
          detail: >-
            Self-developed MEMS torque sensors on all 7 joints of each arm; absolute accuracy ≤0.3 N·m,
            bandwidth 160 Hz, repeatability ≤0.15 N / ≤0.05 N·m (company-claimed). World-first claim
            for commercial deployment at this density.
        - id: actuation
          label: "Actuation Layer — Integrated Joint Modules"
          detail: >-
            Self-contained actuators embedding MEMS sensor, motor, encoder, and local control electronics.
            8 kHz torque closed-loop; dual absolute encoders; 62.5% load-to-weight ratio (M6S Lite).
        - id: comms
          label: "Communication Layer — EtherCAT Bus"
          detail: >-
            Deterministic real-time fieldbus (IEC 61158) connecting joints to the controller; ≤1 ms
            cycle time. Standard protocol with broad industrial supplier ecosystem.
        - id: controller
          label: "Controller Layer — TRC-Micro / SRC-Micro + Dual-Arm Motherboard"
          detail: >-
            One-master-two-slave dual-arm architecture on a single motherboard; claimed 5 ms latency and
            1.89 mm avg trajectory error. TRC-Micro: AC220 V single-phase, 200,000 steps, 10,000 commands.
        - id: software
          label: "Software Layer — MotoSim EG-VRC + MotoPlus SDK"
          detail: >-
            MotoSim EG-VRC: offline simulation with VRC+VPP; Yaskawa-heritage controller models.
            MotoPlus: C-language embedded SDK with task/robot/IO/network API for OEM customization.
        - id: application
          label: "Application Layer — Force-Control Features + Customer Integration"
          detail: >-
            Force-feedback assembly and grinding, conveyor tracking (sensor and vision modes), soft-float
            co-control. Customer integration via EtherCAT, MotoPlus SDK, and teach pendant.
    claimRefs:
