company:
  name: Guangdong Tianji Intelligent System Co., Ltd.
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Tianji's product platform centers on its Marvin humanoid dual-arm series — M3, M6CCS, and M6SRS — differentiated by self-developed MEMS joint torque sensors on all seven axes, a one-master-two-slave dual-arm architecture, and 8 kHz torque-loop integrated joints. The hardware stack is supported by MotoSim EG-VRC offline simulation software, a MotoPlus C-language developer SDK, and force-control features for assembly, grinding, and conveyor-tracking applications. Key technical risks include unverified quantitative performance claims (5 ms latency, 160 Hz sensor bandwidth), significant Yaskawa software heritage that complicates independent IP attribution, and the complete absence of publicly available MTBF or independent safety certification records.

sections:
  - id: product-portfolio-and-customer-applications
    title: Product Portfolio and Customer Applications
    body: >-
      Tianji's commercial product portfolio spans four tiers. The flagship tier is the Marvin humanoid
      force-control dual-arm family: the Marvin M3 (3 kg payload per arm, 615 mm reach, ±0.05 mm
      repeatability, 7.5 kg body weight), Marvin M6CCS (6 kg, 696 mm, ±0.03 mm, 11 kg, cross-wrist
      configuration), and Marvin M6SRS (6 kg, 686 mm, ±0.03 mm, standard-wrist). All three models
      carry MEMS joint torque sensors across seven axes and use EtherCAT communication with ≤1 ms
      cycle time. The second tier is the Pilot 7, a single-arm 7-axis collaborative robot rated for
      7 kg payload at 1,066 mm reach with ±0.03 mm repeatability and IP54 sealing. The third tier
      covers industrial robots: the EVO six-axis family (4–25 kg, IP67), the TR series (up to 8 kg,
      IP67, ±0.02 mm), the SR SCARA family (3–20 kg), and the SRX8 high-speed SCARA. Supporting the
      robot hardware are TRC-Micro and SRC-Micro controllers and the MotoSim EG-VRC offline simulation
      software suite.

      Customer applications concentrate in three verticals. In 3C electronics precision assembly,
      Tianji's force-control arms perform PCB insertion, connector coupling, and torque-sensitive
      screw-driving tasks that exceed the accuracy ceiling of conventional rigid cobots. In embodied
      AI research and development, the arms serve as data-acquisition platforms for humanoid robot
      OEM teams training foundation models that require high-fidelity real-world force-feedback data.
      In precision manufacturing — including automotive sub-assembly, shoe production, and metal
      finishing — the force-compliance capabilities enable polishing, grinding, and soft-material
      handling tasks. The company reports over 45 humanoid robot OEM customers as of Q1 2026 and
      more than 800 historical industrial clients. Tianji delivered more than 2,000 force-controlled
      humanoid dual-arm units in the first four months of 2025, and Q1 2026 orders exceeded 10,000
      units — making it the claimed world's largest shipping force-control humanoid arm supplier.
