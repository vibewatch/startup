callouts:
  - calloutType: strength
    title: MEMS-Integrated Joint Sensing at Scale
    body: >-
      Tianji's claimed deployment of MEMS torque sensors on all seven joints of a force-control dual-arm
      system — rather than only at the wrist — represents a materially differentiated hardware architecture
      versus the ABB YuMi (500 g/arm limit) and Flexiv's external wrist sensor design. With 10,000+ Q1
      2026 orders across 45 OEM customers and 2,000+ units shipped in 2025, there is meaningful
      commercial validation of the product concept, even if the underlying performance specs remain
      unverified by independent parties.
    claimRefs:
      - CE001
      - CE007
      - CE034
      - CE042

  - calloutType: risk
    title: Unverified Performance Claims
    body: >-
      All quantitative performance figures — 5 ms control latency, 1.89 mm average trajectory error,
      160 Hz torque bandwidth, and ≤0.3 N·m MEMS accuracy — are exclusively sourced from Tianji's own
      product pages and internal testing. No independent benchmark, academic publication, or third-party
      test lab has validated these claims as of June 2026. Diligence should require physical testing or
      access to certified test reports before relying on these figures in investment theses.
    claimRefs:
      - CE003
      - CE012
      - CE013
      - CE036

  - calloutType: risk
    title: Yaskawa Software Heritage and IP Uncertainty
    body: >-
      The MotoSim EG-VRC simulation software and the TRCmicro/NX100/YRC1000 controller naming
      conventions directly mirror Yaskawa Electric's MotoSim product line — consistent with Tianji's
      founding-team engineering roots in the Yaskawa-Everwin joint R&D program. This heritage creates
      material uncertainty around the independence of Tianji's software IP portfolio and could limit
      future licensing freedom or platform differentiation relative to Yaskawa's own robotics
      business.
    claimRefs:
      - CE024
      - CE037

