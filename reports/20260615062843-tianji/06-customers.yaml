callouts:
  - calloutType: strength
    title: "First-Mover Mass Delivery in Humanoid Dual-Arms"
    body: >
      Tianji's achievement of 2,000+ force-controlled dual-arm deliveries in four months
      of 2025 and a 10,000-unit backlog by Q1 2026 positions it as the uncontested
      volume leader in this nascent sub-component category. The 45 OEM customer count
      demonstrates ecosystem breadth that reinforces supply-chain lock-in potential.
    claimRefs:
      - CU014
      - CU015
      - CU013

  - calloutType: risk
    title: "Humanoid OEM Customer Concentration Is the Primary Diligence Concern"
    body: >
      All 45 humanoid OEM customer names are undisclosed. The Q1 2026 backlog is
      correlated entirely with a sector whose funding health drives demand. A VC
      pullback or failure of top OEM customers to commercialize would cascade to Tianji's
      arm segment with no diversification buffer. Bloomberg's 2026 analysis explicitly
      flagged this systemic risk for Chinese robotics component suppliers.
    claimRefs:
      - CU027
      - CU033
      - CU031

  - calloutType: risk
    title: "Zero Independent Named Customer Evidence in Commercial Segments"
    body: >
      No named enterprise logos, published production case studies, G2/Capterra reviews,
      or customer-quoted testimonials exist in the public record for any commercial segment.
      The HIT procurement record is the only independently verifiable named-customer event.
      This opacity prevents retention, churn, and satisfaction judgments entirely.
    claimRefs:
      - CU032
      - CU034
      - CU008

  - calloutType: insight
    title: "Dual-Tier Customer Structure Creates Divergent Risk Profiles"
    body: >
      Tianji's 1,000+ industrial cobot accounts provide a fragmented, low-correlation
      revenue base while the 45 humanoid OEM customers provide high-growth but highly
      correlated exposure. Series B investors are funding the OEM tier's growth; the
      industrial base effectively underwrites operational continuity.
    claimRefs:
      - CU001
      - CU013
      - CU030

