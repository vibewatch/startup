  - id: research-university-adoption
    title: Research and University Adoption
    body: >
      Alongside its commercial customer base, Tianji maintains formal joint research and
      development centers at three leading Chinese technical universities: the Hong Kong
      University of Science and Technology, Shanghai Jiao Tong University, and Harbin
      Institute of Technology. These collaborations are described by Tianji as "core
      technology joint laboratories" focused on exploring new robotics technologies and
      applying scientific advances to Tianji's commercial products. University partners
      function as both early-validation customers and co-development collaborators, providing
      Tianji with access to academic research talent and publication pipelines that reinforce
      its technical credibility.
      A June 2026 QCC business-registry update—the most recent independently verifiable
      customer evidence—records a "哈尔滨工业大学天机机械臂自购备案成交公告" (Harbin Institute
      of Technology Tianji robotic arm self-purchase procurement announcement) dated June 9,
      2026. This constitutes the only named customer procurement record in the public record
      and confirms that at least one top-tier Chinese research institution has moved beyond
      a partnership agreement to an actual equipment purchase. While the HIT record provides
      meaningful validation, it does not establish commercial revenue materiality; research
      institution procurement volumes are typically small relative to industrial or OEM sales.
      The university tier is strategically important for technology credibility and talent
      acquisition rather than revenue, and these three institutions represent a meaningful
      but not primary customer segment.
    claimRefs:
      - CU020
      - CU021
      - CU022
      - CU023
      - CU024
      - CU025
    tableRefs:
      - TU004
    figureRefs: []

  - id: concentration-risk-and-gaps
    title: Retention, Concentration Risk, and Diligence Gaps
    body: >
      The primary analytical challenge in this chapter is the near-total opacity of Tianji's
      customer relationship quality. No net revenue retention rate, gross retention rate,
      churn data, average contract length, or cohort-level repeat-purchase statistics are
      publicly available. The company has disclosed only top-line count metrics (1,000+
      accounts, 20,000+ units) and two aggregate snapshots separated by roughly two years,
      from which a crude growth trend can be inferred but retention cannot be separated
      from new-customer acquisition. For the humanoid OEM tier, the 10,000-unit backlog
      does not clarify what share represents first-time trial orders versus repeat purchases
      by the same OEM, nor does it reveal the distribution of order sizes across the 45 customers.
      Customer concentration is a material risk. If even a small number of the 45 humanoid
      OEM customers account for the majority of arm orders, any single defection or funding
      disruption would disproportionately affect Tianji's humanoid revenue. Bloomberg's
      April 2026 analysis of China's robotics boom explicitly flagged concentration and
      hype dynamics as unresolved concerns for component suppliers in this space, noting
      that sustained customer demand had not yet been demonstrated independently of VC-driven
      prototype cycles. The industrial segment (1,000+ accounts) provides a more diversified
      base, but its contribution to total revenue relative to the fast-growing humanoid tier
      is unknown. Tianji's disclosure profile remains private and undisclosed, and the
      absence of independently named customers across any vertical is a persistent
      evidence gap that prevents higher-confidence retention or durability judgments.
    claimRefs:
      - CU026
