company:
  name: Guangdong Tianji Intelligent System Co., Ltd.

chapter:
  number: 6
  title: Customers
  summary: >
    Tianji operates two distinct customer tiers: over 1,000 industrial robot buyers across
    7 verticals (3C, automotive, new energy, medical, food, footwear, construction machinery)
    with 20,000+ units deployed, and a newer humanoid OEM tier of 45 global robot makers and
    embodied AI unicorns whose Q1 2026 force-controlled arm backlog surpassed 10,000 units.
    Named customer logos are entirely undisclosed; a June 2026 Harbin Institute of Technology
    procurement record provides the sole independently verifiable named customer proof.
    No NRR, churn, or contract-duration data is publicly available, making retention and
    concentration risk the principal diligence gaps for this chapter.

sections:
  - id: industrial-customer-base
    title: Industrial Customer Base and Vertical Segmentation
    body: >
      Tianji has built a traditional industrial robot customer base of more than 1,000 accounts,
      with over 20,000 robot units operating stably online as of 2026, up from 800 customers
      and 10,000 units at end-2024. This trajectory represents roughly 25 percent account growth
      and 100 percent unit growth over approximately two years, consistent with the company's
      stated positioning as a high-end brand ranking near the top of Chinese cobot/SCARA sales.
      The core verticals served are 3C electronics (printed-circuit-board assembly, inspection,
      pick-and-place), automotive and automotive electronics (welding, assembly, quality control),
      new energy (battery assembly and testing), medical devices, home appliances, food processing,
      footwear and apparel manufacturing, and construction machinery integration. Tianji's website
      maintains dedicated application-case pages for each vertical, and the company describes
      itself as having developed "mature applications" in each sector. The business model is
      direct-sales B2B with consulting, training, and after-sales maintenance bundled into the
      offering. Despite the size of the customer base, no named enterprise logos, reference
      accounts, or published case studies appear on any public channel, making independent
      verification of the industrial base limited to third-party counts from Baidu Baike,
      the FairPlus exhibitor directory, and the QCC business registry. The customer base
      is geographically concentrated in China's Pearl River Delta manufacturing cluster,
      consistent with Tianji's Dongguan headquarters and Changying Precision (Everwin) parentage.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
