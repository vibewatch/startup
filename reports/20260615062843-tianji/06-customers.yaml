  - id: humanoid-oem-ecosystem
    title: Humanoid OEM Ecosystem and Q1 2026 Order Surge
    body: >
      The most commercially significant customer development of 2025–2026 is the emergence
      of 45 global humanoid robot OEM manufacturers and embodied AI unicorns as Tianji's
      most strategically valuable customer tier. In just four months of 2025, Tianji
      delivered over 2,000 force-controlled dual-arm units to more than 100 accounts,
      achieving what it claims was the industry's first mass delivery of such systems.
      By the end of Q1 2026, the order backlog for force-controlled humanoid arms exceeded
      10,000 units, making this the fastest-growing and highest-profile segment.
      Customers in this tier are humanoid robot makers who embed Tianji's Marvin dual-arm
      platform as the physical manipulation layer of their systems, deploying it alongside
      their own AI stacks. Tianji describes the relationship as providing these companies
      with the "cerebellum and hands" to accelerate the transition of embodied AI from the
      lab to commercial environments. The company's production line maintains a claimed
      first-pass yield above 99.5 percent, which it uses to reassure OEM customers of
      reliability at scale. Series B proceeds will fund a North America expansion with
      localized sales and technical support teams aimed at penetrating the core supply
      chains of leading international embodied AI companies, signaling ambition beyond
      the current Chinese OEM concentration. The OEM model embeds Tianji deeply in the
      humanoid ecosystem but creates bilateral risk: demand is entirely correlated with
      the willingness of humanoid OEM customers to fund and scale their own programs,
      and any slowdown in embodied AI investment could rapidly cascade into reduced arm orders.
    claimRefs:
      - CU011
      - CU012
      - CU013
      - CU014
      - CU015
