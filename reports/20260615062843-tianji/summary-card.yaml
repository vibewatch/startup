  topStrengths:
    - >-
      Tianji appears to have one of the strongest commercial proof points in China's force-controlled humanoid-arm
      supply chain, with 2,000+ units delivered in four months of 2025 and 10,000+ units of Q1 2026 backlog.
    - >-
      Vertical integration into MEMS joint torque sensing and a 289-patent portfolio create a more defensible product
      position than many pure integrators or application-layer peers.
    - >-
      Investor quality is unusually strong for this stage, with Hillhouse/GL Ventures, Meituan, Tencent, Gaorong, GGV,
      and Luminous validating strategic relevance.
    - >-
      The company sells into both traditional industrial automation and humanoid OEM ecosystems, giving it multiple
      commercialization paths if one segment slows.
    - >-
      Dongguan/Songshan Lake location and Changying Precision relationships place Tianji inside one of China's densest
      manufacturing and robotics supply chains.
  topRisks:
    - >-
      No audited revenue, margin, burn, cash, or working-capital disclosure is public, preventing clean underwriting of
      the RMB 8-10 billion valuation.
    - >-
      The current humanoid OEM demand narrative may be ahead of end-market reality; IFR still characterizes real-world
      humanoid deployment as largely demonstrator or pilot stage.
    - >-
      Customer concentration is opaque because the 45 global OEM accounts and most industrial buyers are unnamed, making
      repeat-purchase and dependency analysis impossible.
    - >-
      Changying Precision's large shareholding and supply-chain role introduce governance and related-party
      prioritization risk for minority investors.
    - >-
      At current pricing, upside for new money depends on several years of execution against manufacturing, compliance,
      and international expansion targets that remain only partially verified.
  unresolvedGaps:
    - Audited 2024-2026 revenue, gross margin, operating loss, capex, and cash-runway data.
    - Customer concentration, repeat-order cadence, contract length, and retention by OEM versus industrial segment.
    - >-
      Exact legal and economic terms of the B and B+ tranches, including any preference stack, ratchets, or investor
      side letters.
    - Verified international revenue mix and concrete North America expansion milestones beyond stated hiring plans.
    - >-
      Reconciliation of public headcount disclosures (166 insured employees in registry data versus 300+ staff on the
      company website).
