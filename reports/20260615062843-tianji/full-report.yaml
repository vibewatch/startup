              joint-sensing architectures or torque bandwidth specifications, preventing direct point-to-point
              comparison but suggesting differentiated design approaches.

              The company holds 289 authorized patents and 33 software copyrights as self-reported on its official
              website and partially corroborated by the QCC registry. Recent 2026 patent activity includes granted
              invention patents for robot motion planning and force control methods in April 2026, and filed invention
