      - number: '1.5'
        title: Milestones, Scale, and Recognition
        blocks:
          - type: paragraph
            body: >-
              Tianji's history spans three distinct phases: an industrial automation incubation period (2015–2020) as
              the internal automation division of Changying Precision; a robotics product development phase (2020–2023)
              during which the company renamed itself and launched its commercial robot lineup; and the current embodied
              AI infrastructure phase (2024–present) centered on force-controlled humanoid dual-arm systems.

              Key operational milestones confirm accelerating commercial traction. By the end of 2022, the company had
              served more than 800 industrial clients with more than 10,000 robots running stably online — figures still
              cited on the official about page as the baseline from which the company entered its humanoid pivot. In
              2021, robot sales grew 6x year-over-year, significantly outpacing China's national industrial robot
              production growth of 49% for the same period. That year the company also received its national
              "Specialized, Sophisticated, and Novel Little Giant" (专精特新小巨人) designation from China's Ministry of
              Industry and Information Technology (MIIT).

              In 2025, Tianji delivered more than 2,000 force-controlled humanoid dual-arm units within four months to
              over 100 customers, marking the company's transition from prototype to mass production. Robots Today
              reported this as the first mass delivery of force-controlled humanoid dual arms in the industry globally,
              though this "first" claim has not been independently verified against all global competitors. In Q1 2026,
              Tianji disclosed that orders on hand exceeded 10,000 units for its humanoid arm products, across 45 global
              humanoid robot manufacturers and embodied AI companies. The production line was reported to exceed 99.5%
              first-pass yield. The company also launched four new products in the force-controlled humanoid arm
              category in Q1 2026.

              In June 2026, QCC registry data confirms a procurement contract with Harbin Institute of Technology was
              completed, and Tianji received placement on the "Top 100 Most Valuable Companies" list
              (第十一届中国最具投资价值企业百强榜). The company holds 289 authorized patents and 33 software copyrights and has been
              recognized as a National High-Tech Enterprise, a Guangdong Province Specialized Little Giant enterprise,
              and a backbone enterprise in Guangdong's robotics industry. No lawsuits, regulatory sanctions, or product
              recalls were identified across public sources reviewed as of the run date.
