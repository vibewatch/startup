      - number: '5.5'
        title: Quality, Safety, Compliance, and Technical Risks
        blocks:
          - type: paragraph
            body: >-
              The Marvin M6CCS carries CE marking, ISO/TS 15066:2016 (collaborative robot safety and human-robot
              interaction), ISO 13849-1 PLd(Cat.3) (functional safety for control systems), EN 60204-1:2018 (electrical
              equipment safety), EN IEC 61000-6-4-2, and EN ISO 12100:2010. These certifications are listed on the
              official product specification page; however, no independent test-laboratory certificates, notified-body
              assessment reports, or publicly available accreditation records have been identified. The company reports
              a production-line first-pass yield exceeding 99.5% as of Q1 2026, a figure that is not corroborated by
              external audit data. The TCP maximum speed of 2 m/s and the 180°/s joint speed are company-specified
              parameters that have not been independently validated.

              Four material technical risks warrant diligence attention. First, all quantitative performance claims — 5
              ms control latency, 1.89 mm average trajectory error, 160 Hz torque bandwidth, and ≤0.3 N·m MEMS accuracy
              — are based exclusively on Tianji's own internal testing; no third-party benchmark, academic paper, or
              independent laboratory validation has been identified as of June 2026. Second, the MotoSim EG-VRC
              simulation software and TRCmicro/NX100/YRC1000 controller naming conventions indicate significant heritage
              from Yaskawa Electric's platform, potentially limiting software IP independence. Third, no publicly
              available MTBF data, long-term durability statistics, or safety incident reports for the Marvin
              force-control arm series have been identified. Fourth, Bloomberg's April 2026 reporting on China's
              humanoid robotics boom flagged broad concerns about overhyped performance claims across the category — a
              risk that is structurally applicable to Tianji's unvalidated benchmarks.
