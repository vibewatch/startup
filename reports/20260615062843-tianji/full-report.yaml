            body: |
              Tianji Intelligent emerged from Shenzhen Everwin Precision Technology (300115.SZ) as an
              internal automation division and was formally re-incorporated as Guangdong Tianji Intelligent
              System Co., Ltd. in 2015. Historical funding prior to the Series B consisted primarily of
              parent-company capitalization and has not been separately broken out. As of the May 2026
              Chinese business registry, Tianji's registered capital stood at approximately RMB 177.8
              million with RMB 120 million paid in. Everwin retains approximately 27% of the company; CLH
              142 (HK) Limited holds approximately 19.7% and CEO Chen Xi holds approximately 15.2%.

              In May 2026, Tianji closed combined Series B and B+ financing rounds totaling RMB 1 billion
              (approximately USD 140–147 million) co-led by GL Ventures / Hillhouse Capital and Meituan
              Strategic Investment, with Tencent, Gaorong Capital, Luminous Ventures, and GGV Capital /
