  - id: FV003
    title: Valuation / Return Range — Bull / Base / Bear by Exit Year
    type: range
    layout: standard
    summary: >
      Estimated exit valuation range (RMB billions) under bull, base, and bear cases, anchored to the May 2026 Series B
      entry valuation of RMB 8B. The base case returns 1–2.25× over three years. The bull case represents a potential
      4–7.5× return; the bear case implies capital loss for pre-B equity holders.
    data:
      items:
        - label: Bull Case (2028–2029 exit)
          low: 30
          mid: 45
          high: 60
          unit: RMB B
          note: 100K+ annual units; full platform expansion; 15–20× revenue
        - label: Base Case (2028–2029 exit)
          low: 8
          mid: 12
          high: 18
          unit: RMB B
          note: 40–60K annual units; component leadership; 10–12× revenue
        - label: Bear Case (2027–2028 exit)
          low: 1.6
          mid: 3
          high: 4
          unit: RMB B
          note: Slower adoption; pricing pressure; 8–10× revenue on RMB 200–400M
        - label: Series B Entry Valuation (May 2026)
          low: 8
          mid: 9
          high: 10
          unit: RMB B
          note: RMB 8–10B disclosed range; used as baseline for return calculations
