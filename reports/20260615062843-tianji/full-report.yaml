      - number: '7.3'
        title: Operational, Supply-Chain, and Product-Reliability Risks
        blocks:
          - type: paragraph
            body: >
              Tianji's production ramp from approximately 2,000 force-controlled dual-arm deliveries in the first four
              months of 2025 to 10,000+ unit orders in Q1 2026 alone represents a >5× escalation in a single quarter.
              While the company claims a first-pass yield above 99.5%, this figure is self-reported and unaudited. A
              production quality failure at this scale—particularly one resulting in a field incident involving
              force-control malfunction near human workers—would expose Tianji to significant brand damage,
              product-liability claims, and potential regulatory scrutiny in jurisdictions where safety standards are
              evolving but not yet final. Robot accidents occur disproportionately during non-routine operating
              conditions such as programming, maintenance, and setup, precisely the scenarios common in early OEM
              deployments where integration engineers are pushing arm capabilities beyond tested parameters. The 2025
              ISO 10218 revision specifically added cybersecurity requirements for industrial robots, reflecting the
              growing attack surface of AI-driven collaborative systems. Force- control arms with embedded AI models (as
              in Tianji's Marvin platform) are subject to adversarial manipulation, prompt-injection, or model-poisoning
              risks that traditional robot safety standards did not address. The US OSHA explicitly acknowledges there
              are no specific OSHA standards for the robotics industry, creating a regulatory vacuum that means US
              enterprise customers will face certification uncertainty until the ANSI R15.06 (North American adoption of
              ISO 10218 2025) is finalized. Supply-chain concentration is a material operational risk. Changying
              Precision is both the major shareholder and a likely key hardware supplier (servo drives, structural
              components) given its manufacturing expertise. Any capacity conflict between Changying's Apple/Tesla
              supply commitments and Tianji's ramp requirements could introduce lead-time delays that breach customer
              delivery commitments. The robozaps humanoid market database tracked 26 humanoid robot makers with $4B+ VC
              globally—all competing for the same limited pool of qualified force-control engineering talent, precision
              servo suppliers, and AI acceleration hardware. Tianji's advantage as an early mover in mass production of
              dual-arm force-control systems is real but not permanent.
            claimRefs:
              - CR021
