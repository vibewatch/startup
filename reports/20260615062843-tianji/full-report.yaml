      - number: '1.4'
        title: Product Portfolio and Technical Capabilities
        blocks:
          - type: paragraph
            body: >-
              Tianji's flagship product line is the Marvin Series of force-controlled humanoid dual-arm systems,
              featuring three models: the Marvin M3 (3 kg payload, 615 mm reach, ±0.05 mm repeatability, 7-axis), the
              Marvin M6CCS (6 kg payload, 696 mm reach, ±0.03 mm repeatability, cross-wrist), and the Marvin M6SRS (6 kg
              payload, 686 mm reach, ±0.03 mm repeatability, traditional wrist). The Marvin series targets humanoid
              robot OEMs and embodied AI research and commercial scenarios.

              The Pilot 7 is the company's flagship collaborative robot, featuring 7-axis articulation, 7 kg payload,
              1,066 mm reach, ±0.03 mm repeatability, and IP54 ingress protection. The broader industrial robot
              portfolio includes: the TR Series vertical articulated robots (TR8: 8 kg payload, 818 mm reach, ±0.02 mm
              repeatability, IP67 protection); the EVO Series spanning 4–25 kg payloads and 565–1,825 mm reach with full
              IP67 protection; the SR/SRD/SRZ/SRDZ/SPPR Series SCARA robots; and the high-speed SRX8-652 SCARA variant.
              The company also sells the DL Series collaborative robots, Nebula general motion controllers, TRC-Micro
              and SRC-Micro controllers, and the MotoSim offline simulation software. The TIANJI Fusion control system
              underpins the entire product lineup.

              The company claims to be the world's first embodied intelligence company to self-develop MEMS joint torque
              sensors and deploy them in robot joints. Key technical specifications include: force-control absolute
              accuracy ≤0.3 N·m; torque loop bandwidth of 160 Hz; control latency as low as 5 ms; average trajectory
              error of 1.89 mm; and dual-arm one-master-two-slave millisecond-level synchronous control. The Marvin M6S
              Lite achieves a load-to-weight ratio of 62.5% (8 kg arm body carrying a 5 kg payload with 8 kHz torque
              closed loop). Certified to CE, ISO/TS 15066, ISO 13849-1 PLd (Cat. 3), and EN 60204-1:2018.

              The product matrix spans 3–20 kg payloads for humanoid arm and 3–25 kg for the broader portfolio, covering
              application scenarios from algorithm debugging and remote-control teleoperation to complex commercial and
              industrial production processes including 3C electronics, automotive electronics, new energy, medical
              devices, home appliances, food, and shoe/clothing manufacturing. The company operates 16,500 m² of
              facilities, and the production line reported a first-pass yield above 99.5% as of May 2026.
