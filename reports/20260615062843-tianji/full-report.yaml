  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Definition
        blocks:
          - type: paragraph
            body: >
              Tianji's relevant market spans three concentric layers of demand. At the broadest level, China's
              industrial-robot ecosystem provides the policy, supply-chain, and customer infrastructure on which all
              product lines depend. By 2022 China's industrial-robot market had reached $10.2 billion—38% of the $53.6
              billion global total—and the IFR's World Robotics 2025 data shows that 54% of all global robot
              installations that year were deployed in Chinese facilities. This structural demand advantage is
              reinforced by the 15th Five-Year Plan (2026–2030), which explicitly places robotics at the heart of
              China's modern industrial system and mandates thousands of subordinate sectoral and regional plans to
              align with those objectives.


              Within that ecosystem, the more proximate market is the broader collaborative-robot and advanced-arm
              segment used in precision manufacturing. Market research projects the global collaborative-robot (cobot)
              market to grow from approximately $1.9 billion in 2025 at roughly 20% CAGR toward the mid-2030s, with Asia
              commanding 40%+ revenue share and automotive and electronics as the anchor verticals. China's domestic
              cobot share is forecast to grow at 20.1% CAGR from 2023 to 2028, reaching $2.8 billion—driven by
              electronics, automotive, and metal-machinery sectors where Tianji's product matrix (3 kg to 20 kg payload)
              maps directly.


              Tianji's narrowest, highest-relevance addressable layer is the emerging force-controlled dual-arm
              sub-segment within humanoid-robot OEM supply chains. This is a new and rapidly growing segment with no
              clean standalone market-sizing publication. The China humanoid-robot market as a whole is projected to
              grow from $0.40 billion (2025) to $2.80 billion (2030) at 47.6% CAGR per MarketsandMarkets report
              metadata. Within that, Tianji targets the force-controlled arm and joint-module component layer—supplied
              B2B to OEM robot integrators—which carries a structurally higher gross-margin profile than assembled
              end-products but also requires deep sensor and control-system integration that limits the number of
              credible suppliers. Excluded from Tianji's SAM are: complete humanoid robot assembly (Tianji currently
              supplies arms, not full robots), heavy-industrial six-axis robots (>20 kg payload, welding/painting),
              autonomous-mobile robots (AMRs), logistics automation, and consumer or healthcare robots.
