  - id: TV005
    title: Thesis-Break and Kill Triggers
    notes: >
      Triggers are illustrative; actual thresholds require investor discretion based on full due diligence findings and
      portfolio context. No binding investment advice is implied.
    columns:
      - Trigger
      - Threshold / Event
      - Transmission to Thesis
      - Action Implication
    rows:
      - - Audited revenue confirms weakness
        - Disclosed FY2025 revenue < RMB 200M
        - >-
          Implies implied multiple > 40×; insufficient revenue base to justify RMB 8B valuation; re-benchmarks all
          scenario assumptions
        - Exit or significantly reduce position; reassess base-case scenario to bear
      - - Backlog cancellation
        - Any named OEM customer reduces order by >20% or cancels publicly
        - Customer concentration risk becomes concrete; undermines proof-of-demand narrative
        - Request full customer list; immediately reassess revenue quality
      - - Force-control competitor at lower ASP
        - Chinese-funded peer achieves comparable MEMS torque sensor performance at >30% lower ASP
        - Tianji's pricing power and margin structure at risk; platform moat is narrower than presented
        - Deepen technical diligence; verify MEMS patent breadth and freedom to operate
      - - Export restriction
        - Entity List designation for Tianji or Changying Precision; or broad force-control actuator export restriction
        - North American expansion blocked; 45-OEM global supply model disrupted; potential loss of non-China customers
        - Immediate legal review; scenario shift to China-only base case
      - - Changying financial stress
        - Changying Precision (300115.SZ) announces write-down of Tianji stake or distressed share sale
        - Signals loss of confidence in Tianji's growth; could trigger forced equity overhang sale
        - Monitor 300115.SZ filings; negotiate shareholder governance protections
      - - Sector down-round
        - Two or more 2026 cohort peers (Galaxea, Spirit, EngineAI, TARS) raise at lower valuations than prior rounds
        - Re-benchmarks entire cohort; Tianji's $1.1–1.5B mark at risk of markdown
        - Establish mark-to-market protocol; stress-test liquidation preference waterfall
