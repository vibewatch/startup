      - number: '1.3'
        title: Funding History and Capital Structure
        blocks:
          - type: paragraph
            body: >-
              Tianji Intelligent completed combined Series B and B+ financing rounds totaling RMB 1 billion ($147
              million USD per Yicai Global) on May 25, 2026. The round was co-led by GL Ventures (the venture arm of
              Hillhouse Capital / 高瓴创投) and Meituan Strategic Investment (美团战投), with co-investors including Tencent
              Holdings, Gaorong Capital (高榕资本), Luminous Ventures (光合创投), and GGV Capital / Granite Asia (纪源资本). Cygnus
              Equity (高鹄资本) served as the exclusive financial advisor.

              Post-money valuation figures vary across sources: EqualOcean reported RMB 8 billion (~$1.1 billion USD),
              while Yicai Global, Gasgoo, and 36kr each reported "nearly RMB 10 billion" (~$1.4–1.5 billion USD).
              Crunchbase pegged the USD equivalent at $1.5 billion. The higher range likely reflects a combined B and B+
              step-up, with EqualOcean reporting a consolidated post-B valuation and other media reflecting the final
              post-B+ figure. Both readings make Tianji a unicorn in the US-dollar definition (>$1B valuation).

              Prior to the Series B, Tianji had completed at least one Series A round (QCC registry records Qingdao
              Yinshan Venture Investment Fund / GLP Capital as A-round investor, with entry in 2024) and a Series A+
              round (Wuxi GGV / Granite Asia entry recorded December 2025). Other earlier investors visible in the QCC
              shareholder registry include CMBI Digital (招银国际), SAIF Partners (赛富), and a Tencent-linked entity (腾元投资).
              Total pre-Series B funding is not publicly quantified as a single figure.

              The announced use of Series B proceeds spans three priorities: deepening MEMS sensor, integrated joint
              module, and motion-control algorithm R&D; expanding production capacity to achieve 10,000-unit batch
              delivery capability; and building a global sales network with localized technical support in North America
              and other international markets.

              Revenue, gross margin, and ARR figures are not publicly disclosed, consistent with Tianji's status as a
              private subsidiary of a listed parent. The valuation implies significant future growth expectations that
              have not been independently validated against current financial performance.
