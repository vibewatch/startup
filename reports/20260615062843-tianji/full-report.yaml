      - number: '2.4'
        title: Growth Drivers and Headwinds
        blocks:
          - type: paragraph
            body: >
              The dominant structural driver is China's embodied-AI policy ecosystem. The 15th Five-Year Plan mandates
              robotics as a core pillar of national industrial strategy, creating a cascading set of procurement
              incentives, R&D subsidies, and regulatory clarity (the 2026 national humanoid-robot standard system is one
              expression of this). The VAT refund structure (17% rebate for robotic products) lowers the effective cost
              of robot ownership, accelerating enterprise adoption decisions. The government's $15 billion R&D
              allocation to robotics through 2022–2025 has created a dense upstream supplier ecosystem—component makers,
              sensor specialists, algorithm researchers—that reduces Tianji's supply-chain risk relative to what it
              would face in a less-supported market.


              The second driver is the structural labour-quality gap in precision manufacturing. Tasks requiring
              sub-millimetre dexterity—particularly in consumer electronics, micro-component assembly, and
              high-precision instrument manufacturing—cannot be reliably delegated to rigid traditional robots. As
              Chinese manufacturing wages have risen and the tolerance for manual-labour quality variation has tightened
              (driven by Apple, Tesla, and global OEM quality specifications), demand for force- sensitive robotic arms
              capable of performing delicate assembly has structurally increased. This is the same driver that has
              historically underpinned cobot growth globally.


              However, the IFR's own assessment introduces material headwinds that must not be dismissed. The IFR
              explicitly states that "mass adoption as universal humanoid factory helpers will not happen within the
              near- and medium-term future" and that the 5YP targets humanoid commercialisation "towards the end of the
              plan's period"—i.e., circa 2030. IFR also notes that actual humanoid capabilities in real-world production
              scenarios "are currently limited to demonstrators or pilot projects." This implies that Tianji's most
              important near-term market—supplying OEMs with humanoid arms—depends on OEM customers successfully
              crossing the pilot-to-scale barrier, a risk that is neither trivial nor fully in Tianji's control.


              Additional headwinds include: (1) a supply-chain bottleneck on core components, with China's humanoid
              robot sector still reliant on imported precision actuators, specialty bearings, and certain semiconductor
              elements; (2) scenario fragmentation—as noted by industry executives, nearly 80% of manipulation tasks
              that humans excel at involve tactile sensing, but standards for tactile-sensor interfaces are absent,
              creating fragmented, incompatible implementations across OEMs; (3) overfunding risk, with China's embodied
              AI sector raising ~30 billion yuan in Q1 2026 alone—a pace that invites concerns about capital allocation
              discipline and potential market overcrowding. Analysts have noted a shift from concept-stage to
              commercial-validation investing, but with 140+ domestic humanoid manufacturers and 330+ models released in
              2025, consolidation pressure is inevitable and not all OEM customers will survive to become long-term
              buyers.
            claimRefs:
