      - number: '4.4'
        title: Financial Verdict and Diligence Blockers
        blocks:
          - type: paragraph
            body: |
              Tianji presents a structurally opaque financial profile that resists underwriting. The company
              has never disclosed revenue, gross margin, net loss, or cash balance for any period, and the
              private-company structure creates no regulatory disclosure obligation. The RMB 8–10 billion
              valuation therefore rests entirely on strategic narrative — order backlog volume, patent
              portfolio, investor pedigree, and position in a sector receiving record venture capital
              deployment — rather than on audited financial fundamentals.

              Three specific risks deserve elevated weight. First, the IFR's May 2026 analysis explicitly
              states that mass adoption of humanoid robots in factories "will not happen within the near-
              and medium-term future," directly undermining the demand thesis behind the valuation. Second,
              the China embodied-AI funding wave ($5.6 billion invested through mid-May 2026) has
              characteristics of a policy-amplified hype cycle, where multiple well-funded competitors
              target the same 45-or-so global humanoid OEM accounts simultaneously. Third, the disclosed
              Q1 2026 backlog of 10,000+ units is company-claimed and unaudited; the distinction between
              firm purchase orders and soft letters of intent is material to any revenue forecast.

              On the positive side, Tianji's demonstrated 2025 delivery of 2,000 units in four months is
              the strongest available production-execution signal, distinguishing it from pure-prototype
              peers. The investor roster (Hillhouse, Tencent, Meituan) carries credibility in China's tech
              ecosystem. Any serious investment or partnership diligence must, however, obtain audited
              financials, board-level revenue confirmations, customer-contract confirmation on backlog
              categorization, and a view on Everwin's ongoing capital and manufacturing relationship.
