            body: >
              The primary analytical challenge in this chapter is the near-total opacity of Tianji's customer
              relationship quality. No net revenue retention rate, gross retention rate, churn data, average contract
              length, or cohort-level repeat-purchase statistics are publicly available. The company has disclosed only
              top-line count metrics (1,000+ accounts, 20,000+ units) and two aggregate snapshots separated by roughly
              two years, from which a crude growth trend can be inferred but retention cannot be separated from
              new-customer acquisition. For the humanoid OEM tier, the 10,000-unit backlog does not clarify what share
              represents first-time trial orders versus repeat purchases by the same OEM, nor does it reveal the
              distribution of order sizes across the 45 customers. Customer concentration is a material risk. If even a
              small number of the 45 humanoid OEM customers account for the majority of arm orders, any single defection
              or funding disruption would disproportionately affect Tianji's humanoid revenue. Bloomberg's April 2026
              analysis of China's robotics boom explicitly flagged concentration and hype dynamics as unresolved
