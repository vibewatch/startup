  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Geopolitical, Regulatory, and Export-Control Risks
        blocks:
          - type: paragraph
            body: >
              Tianji's international expansion ambitions—prominently flagged in its Series B press materials—collide
              with an accelerating China-US technology competition that imposes meaningful regulatory risk. The US
              Bureau of Industry and Security (BIS) has in recent years expanded Entity List and Export Administration
              Regulations restrictions targeting Chinese companies with dual-use technology capabilities, including in
              AI, advanced semiconductors, and robotics. While Tianji itself has not been publicly cited on any
              restricted list as of the research date, the company's Changying Precision parent's supply-chain
              relationships with Apple and Tesla create indirect exposure to any escalation in dual-use export controls
              on force-control actuators, advanced servo drives, or AI inference hardware. A hypothetical Entity List
              designation would materially impede Tianji's planned North America expansion and its ability to source
              components from US suppliers or affiliates. The IFR's mid-2026 global robotics assessment confirmed that
              despite public demonstrations, humanoid robot "actual capabilities in real-world production scenarios are
              currently limited to demonstrators or pilot projects," adding a market-readiness caveat that restrains
              demand expectations. China has simultaneously accelerated its domestic robotics policy: the 15th Five-Year
              Plan (2026–2030) designates AI-powered robots as a core national strategic priority, creating a supportive
              home market but also increasing competitive intensity from state-backed peers. On the safety standards
              front, the Association for Advancing Automation (A3) published the revised ISO 10218 industrial robot
              safety standard in early 2025 after nearly eight years of development. The overhaul integrates
              collaborative-robot safety requirements previously housed in ISO/TS 15066, adds cybersecurity requirements
              for industrial robots, and introduces new robot classification criteria with corresponding functional
              safety test methodologies. North American certification bodies (ANSI R15.06, CSA Z434) are in the process
              of adopting the new 10218. Any delay in Tianji's compliance certification under the revised standard could
              defer US market sales. Separately, the US OSHA maintains no specific robotics safety standards, creating
              an ambiguous regulatory environment that gives Tianji market entry flexibility but also leaves enterprise
              customers without a clear compliance roadmap, potentially slowing large-scale procurement decisions.
            claimRefs:
