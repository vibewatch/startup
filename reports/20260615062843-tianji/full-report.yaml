      - number: '8.5'
        title: Exit Readiness, Thesis-Break Triggers, and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >
              Exit pathway analysis suggests a 2–3-year window for a liquidity event. The Robotphoenix precedent (HKEX
              listing in May 2026, raising $86M, closing first day +80%) demonstrates that Chinese robotics startups can
              successfully list on the Hong Kong exchange with positive market reception. Unitree's SSE filing
              establishes a domestic Chinese pathway as well. Either route is achievable for Tianji if revenue exceeds
              RMB 500M with demonstrable profitability trajectory. The company's Changying Precision parentage could
              complicate a standalone IPO (public markets may discount the related-party structure), making HKEX listing
              as an independent subsidiary or M&A by a strategic acquirer the more likely near-term path. Strategic
              acquirers could include Meituan (for robot-delivery integration), Tencent (platform AI-hardware
              integration), or a Tier 1 industrial conglomerate seeking humanoid capabilities.

              Thesis-break triggers that would shift the assessment from conditional-hold to avoid include: (1)
              disclosure of audited 2025 revenues below RMB 200M, indicating that the order-volume-to-revenue conversion
              is weaker than estimated; (2) any public OEM customer cancellation or order-volume reduction in the
              10,000-unit Q1 2026 backlog; (3) emergence of a Chinese competitor delivering comparable force-control
              humanoid arms at significantly lower ASPs; (4) Entity List designation or equivalent export restriction on
              Tianji or Changying Precision; (5) material deterioration in Changying Precision's financial position that
              forces a distressed equity sale of the Tianji stake; and (6) a down-round financing event in the sector
              that re-benchmarks comparable valuations.

              The final recommendation is conditional-hold for existing Series B investors: the entry valuation is
              aggressive but defensible given sector comps, commercial traction, and Hillhouse conviction signal. New
              money at RMB 8–10B without audited financials carries excessive information risk and warrants a
              wait-and-verify posture. The single highest-priority diligence ask is access to audited FY2025 financial
              statements and H1 2026 management accounts, which would allow the implied multiple to be confirmed or
              revised.
