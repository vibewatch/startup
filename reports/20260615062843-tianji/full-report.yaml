  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >-
              Tianji competes across three overlapping but structurally distinct competitive segments. The first segment
              consists of global dual-arm and collaborative robot incumbents — primarily ABB (YuMi), Universal Robots,
              and to a lesser extent Kawasaki and Yaskawa — that hold dominant positions in general-purpose cobot
              automation but have not launched dedicated force-control dual-arm products targeting humanoid robot OEM
              assembly. These incumbents bring significant distribution scale, ecosystem trust, and installed-base
              inertia but are architecturally oriented toward tabletop small-parts assembly rather than humanoid torso
              integration.

              The second segment comprises force-control and adaptive robot specialists — chiefly Flexiv and Agile
              Robots — that share Tianji's technical positioning around force-torque sensing and AI-assisted
              manipulation but appear to focus on single-arm industrial deployments rather than the humanoid OEM supply
              chain. The third segment is the embodied-AI full-system layer: China-based humanoid startups (Galaxea AI,
              EngineAI, TARS Robotics, Unitree Robotics, AgiBot) and US-based peers (Figure AI, Hark) that raise capital
              at valuations orders of magnitude above Tianji's and compete for the same end-market budget at the
              platform level, not the component tier.

              Against this landscape, Tianji's defensible position rests on being the only public-data supplier shipping
              force-controlled humanoid arms at five-digit quarterly volumes to a multi-OEM customer base — a scale
              claim that no reviewed source attributes to any direct peer as of June 2026. China accounted for 54% of
              annual global industrial robot installations as of 2024, per the IFR World Robotics 2025 Report, and
              China's local supplier share in domestic installations rose from 30% in 2020 to 57% in 2024, underscoring
              both the structural advantage and the intensifying domestic competition that Tianji must navigate.
            claimRefs:
