              sensors, joint modules, and motion-control algorithms), large-scale production expansion
              (increasing automation rate and first-pass yield to support batch deliveries beyond 10,000
              units), and global sales network construction (primarily North America customer acquisition
              and localized technical support). No specific capital budget per bucket has been published.
