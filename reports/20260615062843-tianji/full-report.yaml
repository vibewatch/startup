  - id: FE001
    title: Product architecture map
    type: stack
    layout: wide
    summary: >-
      Layered decomposition of Tianji's product architecture from physical sensing through to the application layer,
      showing the key components at each tier.
    data:
      layers:
        - id: sensing
          label: Sensing Layer — MEMS Joint Torque Sensors
          detail: >-
            Self-developed MEMS torque sensors on all 7 joints of each arm; absolute accuracy ≤0.3 N·m, bandwidth 160
            Hz, repeatability ≤0.15 N / ≤0.05 N·m (company-claimed). World-first claim for commercial deployment at this
            density.
        - id: actuation
          label: Actuation Layer — Integrated Joint Modules
          detail: >-
            Self-contained actuators embedding MEMS sensor, motor, encoder, and local control electronics. 8 kHz torque
            closed-loop; dual absolute encoders; 62.5% load-to-weight ratio (M6S Lite).
        - id: comms
          label: Communication Layer — EtherCAT Bus
          detail: >-
            Deterministic real-time fieldbus (IEC 61158) connecting joints to the controller; ≤1 ms cycle time. Standard
            protocol with broad industrial supplier ecosystem.
        - id: controller
          label: Controller Layer — TRC-Micro / SRC-Micro + Dual-Arm Motherboard
          detail: >-
            One-master-two-slave dual-arm architecture on a single motherboard; claimed 5 ms latency and 1.89 mm avg
            trajectory error. TRC-Micro: AC220 V single-phase, 200,000 steps, 10,000 commands.
        - id: software
          label: Software Layer — MotoSim EG-VRC + MotoPlus SDK
          detail: >-
            MotoSim EG-VRC: offline simulation with VRC+VPP; Yaskawa-heritage controller models. MotoPlus: C-language
            embedded SDK with task/robot/IO/network API for OEM customization.
        - id: application
          label: Application Layer — Force-Control Features + Customer Integration
          detail: >-
            Force-feedback assembly and grinding, conveyor tracking (sensor and vision modes), soft-float co-control.
            Customer integration via EtherCAT, MotoPlus SDK, and teach pendant.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE011
      - CE021
      - CE023
      - CE025
  - id: FE002
    title: Customer workflow / operating flow
    type: flow
    layout: wide
    summary: >-
      End-to-end flow from customer requirement identification through integration, commissioning, and production
      deployment of Tianji's force-control arms in an OEM or factory setting.
    data:
      nodes:
        - id: need
          label: Customer identifies force-control need
          detail: >-
            OEM team or factory identifies tasks requiring sub-mm compliance or >0.5 N·m torque precision beyond
            conventional cobot capability
        - id: selection
          label: Product selection (Marvin / Pilot 7 / EVO)
          detail: >-
            Choose arm based on payload (M3 3 kg, M6 6 kg, Pilot 7 7 kg), reach, and collaboration-safety certification
            requirements (ISO/TS 15066 for M6CCS)
        - id: simulation
          label: Offline simulation with MotoSim EG-VRC
          detail: >-
            Engineer programs robot path offline using VRC+VPP; validates coverage and avoids collision before physical
            hardware is deployed
        - id: integration
          label: EtherCAT and MotoPlus SDK integration
          detail: >-
            Integrator connects arms to host via EtherCAT; embeds custom force-control tasks using MotoPlus C SDK for
            OEM-specific behavior
        - id: force_cal
          label: Force sensor calibration and tuning
          detail: >-
            MEMS sensor baselines established; impedance/compliance parameters tuned for target task (screw torque,
            insertion force, polishing pressure)
        - id: prod_deploy
          label: Production deployment
          detail: >-
            Arm(s) enter production line; MotoSim path executes on physical hardware; real-time EtherCAT telemetry
            closes the control loop
        - id: data_acq
          label: Force-feedback data acquisition (AI path)
          detail: >-
            OEM teams use teleoperation or demonstration mode to capture high-fidelity force trajectories for training
            foundation models
        - id: scale
          label: Scale / expand
          detail: >-
            Successful deployment drives repeat orders; Tianji's Q1 2026 10,000-unit backlog reflects this cycle across
            45 OEM customers
      edges:
        - from: need
          to: selection
          label: Specs match
        - from: selection
          to: simulation
          label: Program offline
        - from: simulation
          to: integration
          label: Deploy program
        - from: integration
          to: force_cal
          label: Tune control
        - from: force_cal
          to: prod_deploy
          label: Production ready
        - from: prod_deploy
          to: data_acq
          label: AI path (OEM R&D)
        - from: prod_deploy
          to: scale
          label: Factory path
        - from: data_acq
          to: scale
          label: Model matures → more arms
    claimRefs:
      - CE027
      - CE028
      - CE034
      - CE039
