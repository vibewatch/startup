      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Valuation Premium Without Revenue Disclosure Is the Defining Diligence Gap
            body: >
              Tianji's ¥8B post-Series B valuation is premised entirely on the humanoid OEM demand trajectory. No
              audited revenue, gross margin, or burn rate is publicly available. At any plausible ¥100–200M revenue
              estimate, the implied multiple exceeds 40×, requiring Tianji to triple or quadruple revenue in the next
              12–18 months to reach a defensible valuation floor. This is possible but highly execution-dependent in a
              market the IFR describes as still "limited to demonstrators or pilot projects."
            calloutType: risk
            claimRefs:
              - CR011
              - CR016
              - CR034
          - type: callout
            title: Changying Precision Dual Role Creates Structural Governance Risk
            body: >
              Changying Precision (300115.SZ) is simultaneously Tianji's controlling shareholder, its inferred hardware
              supply partner, and a publicly listed company whose primary strategic relationships are with Apple and
              Tesla. This triple overlap creates principal- agent conflicts that minority Series B investors cannot
              fully evaluate given the absence of public shareholder agreement terms, related-party transaction
              disclosures, or independent board representation.
            calloutType: risk
            claimRefs:
              - CR014
              - CR015
              - CR023
          - type: callout
            title: IFR Characterization of Humanoid Readiness Raises Market Timing Risk
            body: >
              The IFR's June 2026 assessment that humanoid capabilities "are currently limited to demonstrators or pilot
              projects" in real production settings directly challenges Tianji's Q1 2026 10,000-unit backlog narrative.
              If the OEM customers that placed those orders are themselves in pilot/prototype mode, re-order rates at
              commercial scale are uncertain and potentially far below the velocity needed to sustain ¥8B valuation.
            calloutType: risk
            claimRefs:
              - CR034
              - CR033
              - CR035
          - type: callout
            title: ISO 10218 (2025) Overhaul Creates Both Risk and Mitigation Opportunity
            body: >
              The 2025 ISO 10218 revision integrated collaborative-robot safety standards, added cybersecurity
              requirements, and introduced new robot classification criteria. Companies that achieve early compliance
              certification under the new standard will be better positioned for US and EU enterprise sales. Tianji can
              use the transition as a competitive moat if it certifies ahead of peers, but risks competitive
              disadvantage if it delays.
            calloutType: insight
            claimRefs:
