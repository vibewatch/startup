            body: >-
              Tianji's primary technical differentiation claim rests on joint-integrated MEMS torque sensing across all
              seven degrees of freedom, contrasting with the external wrist force-torque sensor approach used by
              Flexiv's Rizon series. ABB's YuMi dual-arm collaborative robot is rated at only 500 g payload per arm,
              compared to the Marvin M6CCS's 6 kg — a 12× payload advantage that is material for the assembly tasks
