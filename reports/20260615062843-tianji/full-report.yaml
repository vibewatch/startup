  - id: TV006
    title: Final Diligence Asks
    notes: >
      Diligence items reflect gaps identified from publicly available information only. Completion of these items is a
      prerequisite to any investment decision at the current valuation.
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner / Diligence Path
    rows:
      - - Audited financials
        - FY2025 and H1 2026 audited revenue, gross margin, EBITDA, cash
        - Converts all implied multiples to confirmed multiples; critical for any new investment decision
        - Request from Tianji management; review Changying Precision 300115.SZ annual report for subsidiary disclosure
      - - Cap table and preference stack
        - Full cap table, preference multiples, anti-dilution provisions, liquidation waterfall for B and B+ tranches
        - Determines downside protection and upside sharing for B investors; necessary to model bear-case returns
        - Request from Tianji legal; review Series B/B+ term sheets and shareholder agreement
      - - Customer concentration
        - Top 5 customer names, revenue share, and contract structure (spot vs. framework agreement)
        - 45 OEM names undisclosed; concentration of top 3 customers could represent >80% of backlog
        - Binding NDA with management; request revenue breakdown by customer tier
      - - Backlog conversion rate
        - ASP for Q1 2026 10,000-unit backlog; percentage of backlog under binding purchase orders vs. letters of intent
        - Binding vs. non-binding backlog distinction is material to revenue quality assessment
        - Management interview; review sample purchase orders
      - - IP freedom to operate
        - MEMS joint torque sensor patent landscape vs. Japanese/German incumbents; China patent coverage
        - Key differentiating technology; incumbent IP challenge could disrupt production
        - IP counsel review of WIPO/CNIPA patent landscape; freedom-to-operate opinion
      - - Governance and related-party transactions
        - Scope and terms of all transactions between Tianji and Changying Precision (supply, manufacturing, IP, debt)
        - Changying as 27% shareholder and supplier creates systemic related-party risk
        - Review Changying Precision 300115.SZ annual report disclosures; direct contractual review with Tianji
