      - number: '4.3'
        title: Unit Economics, Cost Structure, and Operating Leverage
        blocks:
          - type: paragraph
            body: |
              Tianji's cost structure is shaped by four drivers: proprietary MEMS joint torque sensor
              development, integrated joint-module manufacturing, motion-control software, and precision
              assembly. The company claims world-first status in in-house MEMS joint torque sensor
              production for robot joints, with specifications including absolute accuracy ≤0.3 N·m,
              ±0.03 mm repeatability, and 160 Hz torque loop bandwidth. These sensors are a key BOM
              input unique to Tianji; their yield, unit cost, and capacity constraints are undisclosed.

              Staff composition signals heavy R&D pre-investment: 140+ R&D engineers out of 300+ total
              (approximately 47%), operating across 16,500 m² of facilities and backed by 289 authorized
              patents and 33 software copyrights. The parent Everwin Precision's precision manufacturing
              expertise for Apple and Tesla supply chains may provide COGS leverage through shared
              tooling, process yield, and procurement scale, but the financial terms of any inter-company
              supply arrangement are undisclosed.

              No gross-margin figures have been published. Comparable Chinese industrial cobot makers
              operating at scale report hardware gross margins in the 30–45% range, but Tianji's
              force-control dual-arm products are more complex, carry more proprietary BOM content, and
              address a less price-competitive emerging OEM market — all of which could support higher
              margins if volume and yield assumptions prove out. The QCC insurance-registration count of
              166 insured employees for 2025 is materially below the 300+ claimed in company materials,
              suggesting a portion of that headcount is contractors, interns, or subsidiary staff.
