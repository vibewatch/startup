      - number: '1.1'
        title: Identity, Founding, and Corporate Structure
        blocks:
          - type: paragraph
            body: >-
              Guangdong Tianji Intelligent System Co., Ltd. (广东天机智能系统有限公司) is a Dongguan-based robotics company
              registered in the Songshan Lake High-Tech Zone, Guangdong Province, China. The company operates as a
              subsidiary of Shenzhen Everwin Precision Technology Co., Ltd. (长盈精密; stock code 300115.SZ), a
              Shenzhen-listed precision manufacturer that serves as a core supplier to Apple and Tesla supply chains.

              The legal entity was established on 2015-05-18 under the name Guangdong Tianji Industrial Intelligent
              System Co., Ltd. (广东天机工业智能系统有限公司), according to China's official unified social credit code registry
              (USCC: 91441900337900581C). In April 2021, the company was renamed to its current form, Guangdong Tianji
              Intelligent System Co., Ltd., coinciding with a strategic pivot toward humanoid robotics and embodied AI.
              A separate entity, Guangdong Tianji Robot Co., Ltd. (广东天机机器人有限公司), was also established in 2017 as the
              robot product development arm; the company often references 2017 as its "founding" in product and PR
              materials, creating a minor narrative discrepancy versus the 2015 registration.

              The company's registered capital stands at RMB 177.78 million, with paid-in capital of RMB 120 million.
              Its headquarters at Building 3, No. 6 Gongye West 3rd Road, Songshan Lake Hi-Tech Zone, Dongguan (postal
              code 523000), serves as the operational base, with additional offices in Shanghai (Minhang District),
              Kunshan (Jiangsu), and Yibin (Sichuan). The company maintains 166 insured employees as of the 2025 annual
              report, with 300+ total staff and 140+ R&D personnel reported on the official website as of the 2026 run
              date.

              Tianji's business scope encompasses industrial intelligent system design, robot development and
              manufacturing, industrial intelligent equipment integration, and industrial intelligent system consulting.
              The scope also includes goods and technology import/export, and residual legacy entries from 2020 for
              second-class medical devices (face masks), reflecting COVID-era operational pivots that have since been
              de-emphasized. The company holds 289 authorized patents and 33 software copyrights. The company's vision
              is "advancing the application of machine intelligence in industrial and commercial fields, aiming to
              become a global leader in the robotics industry."

              The official brand name in market communications is "TIANJI" or "Tianji Robotics" (天机智能), though the legal
              entity name references the Chinese governmental classification. The company's current URL is
              www.tianjizn.com, and its legacy domain www.tianji-robot.com is unresolvable as of 2026.
