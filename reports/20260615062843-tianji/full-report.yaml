      - CV034
      - CV035
      - CV036
      - CV037
      - CV038
  - id: FV004
    title: Investment KPIs — IC-Ready Scoring
    type: kpi
    layout: standard
    summary: >
      Scoring across seven investment committee dimensions (0–10) based on available public evidence. Market opportunity
      and commercial proof are the strongest dimensions; governance and financial transparency are the weakest.
    data:
      items:
        - label: Market Opportunity
          score: 8
          rationale: RMB 400B+ China 2030 target; 15th Five-Year Plan; 54% global share; strong policy support
        - label: Commercial Proof
          score: 7
          rationale: 2,000+ units shipped 2025; 10,000+ Q1 2026 backlog; 45 OEM clients; first mass-production globally
        - label: Competitive Moat
          score: 7
          rationale: >-
            289 patents; MEMS sensor IP; infrastructure positioning; 10yr industrial robotics experience; 30K+
            industrial arm installs
        - label: Unit Economics
          score: 4
          rationale: >-
            No disclosed revenue, margin, or burn rate; estimated only from order volume and ASP proxies; significant
            uncertainty
        - label: Risk Profile
          score: 3
          rationale: >-
            High: governance overhang; financial opacity; IFR humanoid readiness warning; customer concentration;
            export-control exposure
        - label: Valuation Discipline
          score: 4
          rationale: >-
            RMB 8–10B is aggressive at 20–40× estimated revenue; sector-consistent but not a bargain entry; liquidation
            preference terms undisclosed
        - label: Evidence Quality
          score: 5
          rationale: >-
            Multiple credible sources for financing terms; no primary financial documents; customer names undisclosed;
            information asymmetry is high
    claimRefs:
      - CV001
      - CV002
      - CV007
      - CV008
