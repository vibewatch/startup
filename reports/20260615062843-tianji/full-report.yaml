      - number: '3.4'
        title: Moat Durability and Displacement Risk
        blocks:
          - type: paragraph
            body: >-
              Tianji's defensible position is built on three interlocking advantages: (1) a first-mover scale in
              force-control humanoid arm OEM supply — no peer is publicly documented to have shipped comparable volumes;
              (2) integration lock-in arising from humanoid OEMs' dependency on Tianji's force-torque feedback APIs,
              firmware calibration, and motion-planning software trained on Tianji hardware; and (3) a proprietary IP
              base (289 authorized patents) that raises the cost of close replication. IFR data confirms China's local
              industrial robot supplier share reached 57% in 2024, indicating that Tianji is entering a domestic-first
              competitive environment that favors Chinese suppliers.

              However, displacement risk is material. The clearest threat is that Tianji's 45 OEM customers — each of
              which already integrates Tianji's hardware — could invest in developing in-house force-control arms once
              they reach sufficient scale, eliminating the supply dependency. The second threat is low-cost Chinese
              copycats: the same manufacturing ecosystem that gave Tianji its cost advantage enables fast follower
              imitation, particularly for core mechanical and electronic architectures not fully protected by patents.
              Bloomberg's coverage of the China robotics funding boom characterized the environment as raising "fresh
              concern over hype," noting the contrast between rapid commercial investment and limited verifiable
              real-world deployment — a risk that applies to Tianji's own market claims. Finally, the IFR itself
              cautioned in May 2026 that "real-world humanoid deployment remains demonstrator or pilot stage," tempering
              the long-term market assumptions that underpin Tianji's growth narrative.
