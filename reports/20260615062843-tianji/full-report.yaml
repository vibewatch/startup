      affect valuation. The primary cascade path runs from US export-control escalation through chip/actuator supply
      disruption to product roadmap delay, which collapses the OEM demand catalyst and compresses valuation. A parallel
      path runs from humanoid OEM demand timing slip directly to revenue shortfall.
