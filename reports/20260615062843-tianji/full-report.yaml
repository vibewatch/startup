      - number: '5.3'
        title: Control Software Stack and Developer Interface
        blocks:
          - type: paragraph
            body: >-
              Tianji's software platform includes MotoSim EG-VRC offline robot simulation and the MotoPlus C-language
              secondary development SDK. MotoSim EG-VRC combines virtual robot control (VRC) and a virtual programming
              pendant (VPP), enabling engineers to simulate and program robot paths offline before deploying to physical
              hardware. The controller models supported include NX100, YRC1000, DX100, DX200, FS100, and TRCmicro — a
              naming convention that closely mirrors Yaskawa Electric's controller product line and reflects Tianji's
              founding-team engineering heritage from the Yaskawa-Everwin joint R&D program. This Yaskawa toolchain
              dependency may constrain Tianji's ability to independently differentiate software capabilities.

              The MotoPlus SDK allows users to embed C-language tasks directly into the robot controller, executing at
              native speed with API coverage for task control, robot motion, I/O, and network communication. This
              positions the software tier as a developer-accessible platform for customizing force-control behaviors in
              OEM integration workflows. Supplementary force-control features include sensor-based and vision-based
              conveyor tracking, a force-feedback assembly, grinding, and polishing mode using proprietary algorithms,
              and a soft-float (servo-float) position-and-force co-control function that allows a robot arm to yield to
              external forces during operation. The hardware control layer uses TRC-Micro controllers (single-phase
              AC220/230 V, IP20, 200,000 step memory, 10,000 command buffer, 0–40 °C operating range) and SRC-Micro
              controllers (three-phase AC220 V, IP20, 8.15 kg). Optional peripherals include a proprietary teach
              pendant, digital and analog I/O boards, and field bus communication units.
