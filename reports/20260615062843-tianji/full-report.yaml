      - number: '7.2'
        title: Funding, Valuation, and Governance Risks
        blocks:
          - type: paragraph
            body: >
              Tianji's May 2026 Series B raised approximately ¥1B (≈$140M USD) at a post-money valuation reported at
              approximately ¥8B by EqualOcean and "nearly ¥10B" by Gasgoo, while Crunchbase converted the figure to
              approximately $1.5B USD. The gap between these estimates reflects currency conversion timing and
              valuation-methodology differences rather than material disagreement about the round size. In all cases,
              Tianji's valuation implies an estimated revenue multiple well above 40× on any plausible 2025 revenue
              assumption, given that the company has disclosed no audited financials, revenue, gross margin, or burn
              rate in any publicly accessible document. This valuation premium is premised entirely on the humanoid OEM
              growth trajectory and must be serviced by sustained and accelerating demand from the 45 OEM customers—a
              demand base whose individual identities and financial health are entirely opaque. The corporate governance
              structure introduces a principal-agent risk that is difficult to fully assess from public sources.
              Embodied Global and EqualOcean both identify Changying Precision Technology (Shenzhen Stock Exchange:
              300115.SZ) as Tianji's major shareholder. Changying is a publicly listed hardware manufacturer primarily
              known as a core component supplier to Apple and Tesla supply chains. Its ownership stake in Tianji creates
              at least three governance risks: (1) the parent may prioritize its own supply chain commitments over
              Tianji's production needs during constrained capacity periods; (2) Changying's strategic interests in
              maintaining its Apple/Tesla relationships could constrain Tianji from pursuing certain customer segments
              or international partnerships that might create conflicts; and (3) minority investors in Tianji have no
              visibility into the terms under which Changying's shareholder rights operate (board seats, veto rights,
              related-party transaction approval thresholds). The broader China embodied AI funding context amplifies
              these governance risks: Crunchbase reported that Chinese robotics companies raised $5.6B across 176 deals
              through mid-May 2026, creating sector-wide froth dynamics that historically precede valuation
              normalization cycles.
