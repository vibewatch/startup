  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >
              The investment thesis for Tianji at a RMB 8–10 billion valuation rests on four interlocking arguments.
              First, market structure: China's humanoid robotics sector is consolidating around a small number of
              infrastructure providers, and Tianji's force-control expertise—evidenced by 289 authorized patents,
              proprietary MEMS joint torque sensors, and the only mass-produced force-controlled humanoid dual-arm in
              the world—positions it as a near-unavoidable component for OEM integrators. Serving 45 global humanoid OEM
              manufacturers creates structural stickiness and cross-portfolio diversification that single-OEM plays
              lack. Second, commercial traction: delivering 2,000+ dual-arm units in four months of 2025 and
              accumulating over 10,000 units of Q1 2026 backlog provides the strongest near-term commercial proof in the
              Chinese force-control segment. Third, policy tailwind: China's 15th Five-Year Plan (2026–2030) designates
              AI-powered robots as a core national strategic priority, and as of May 2026, the IFR confirmed China
              accounts for 54% of global industrial robot installations—creating a large domestic addressable base for
              infrastructure upgrades as humanoid adoption scales. Fourth, investor quality: the round was co-led by
              Hillhouse (which simultaneously led the $513M TARS Robotics seed round), Meituan (a potential humanoid
              deployment customer), and included Tencent—suggesting conviction from the highest tier of Chinese venture
              capital.

              The anti-thesis is equally substantive. Most critically, Tianji has disclosed no audited revenue, gross
              margin, cash burn, or balance sheet data. Any multiple calculation rests on estimated rather than
              confirmed financials. Second, customer concentration is opaque: while 45 OEM customers are cited, their
              individual identities, financial health, and order concentration are undisclosed, making it impossible to
              assess revenue dependency on any single buyer. Third, the IFR noted explicitly in May 2026 that despite
              impressive public demonstrations—including the humanoid robot half-marathon in Beijing—"actual
              capabilities in real-world production scenarios are currently limited to demonstrators or pilot projects."
              This directly challenges the revenue ramp assumptions embedded in the current valuation. Fourth, the
              Changying Precision governance overhang (27% of equity, controlling parent) creates principal-agent risk:
              Changying's priorities as an Apple/Tesla supply chain manufacturer may diverge from Tianji's standalone
              growth trajectory. Fifth, the strategic investor mix (Meituan, Tencent) introduces information asymmetry
              risks for financial investors: corporate strategics may exercise influence over partnerships, supply chain
              access, or exit timing in ways that create friction with pure return maximization.
