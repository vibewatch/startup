      - number: '8.4'
        title: Bull / Base / Bear Scenario Analysis
        blocks:
          - type: paragraph
            body: >
              Three scenarios frame the range of outcomes for Tianji investors over a three-year horizon (2026–2029),
              anchored to the Series B/B+ entry valuation of RMB 8–10B.

              Bull case (30% probability signal): Humanoid OEM demand accelerates to 100,000+ units per year by 2027,
              driven by successful deployments in Chinese manufacturing and the policy stimulus from the 15th Five-Year
              Plan. Tianji successfully expands into complete humanoid robot products, diversifying beyond components.
              Revenue reaches RMB 2–3B by 2028, and the company pursues an HKEX or Shanghai SSE IPO at 15–20× revenue,
              implying a valuation of RMB 30–60B. From the Series B entry price of RMB 8B, this represents a 3.75–7.5×
              return multiple, or approximately 55–90% CAGR over three years.

              Base case (50% probability signal): Humanoid adoption continues but at pilot-heavy pace consistent with
              the IFR's May 2026 characterization. Orders grow from 10,000 units to 40,000–60,000 units by 2028. Revenue
              reaches RMB 800M–1.5B. The company achieves EBITDA break-even and pursues a 2028–2029 liquidity event
              (HKEX listing or strategic M&A) at 10–12× revenue, implying a valuation of RMB 8B–18B. At entry valuation
              of RMB 8B, this represents a 1–2.25× multiple, or roughly 0–30% CAGR—adequate but not outstanding for
              venture-style risk.

              Bear case (20% probability signal): Humanoid adoption is slower than projected, with major OEM customers
              delaying commercial rollout due to unresolved capability limitations in unstructured environments. Order
              backlog converts at lower ASPs than expected, and competitor force-control providers (including
              established Japanese/European cobot makers and new-entry Chinese funded peers) erode Tianji's pricing
              power. Revenue stays below RMB 400M through 2028. The B/B+ liquidation preference stack means that
              financial investors recover principal at any exit above RMB 1B, but equity appreciation is minimal or
              negative. At a 8× revenue exit, valuation is approximately RMB 3–4B—a 50–60% loss on paper for earlier
              (pre-B) shareholders.

              Probability-weighted expected valuation: approximately RMB 16–18B by 2028, which implies a 2–2.25×
              expected multiple from the RMB 8B entry—a reasonable but not compelling venture return given the high
              execution risk and information opacity.
            claimRefs:
