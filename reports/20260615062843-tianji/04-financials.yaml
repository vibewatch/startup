company:
  name: Guangdong Tianji Intelligent System Co., Ltd.
chapter:
  number: 4
  title: Financials
  summary: >
    Tianji Intelligent completed a combined Series B and B+ round of RMB 1 billion in May 2026,
    achieving a post-money valuation of RMB 8–10 billion on zero disclosed revenue — a structure
    typical of China's 2026 embodied-AI hype cycle. Capital is directed at production scale-up,
    R&D deepening, and a nascent global sales network. All unit-economic, gross-margin, and cash-flow
    metrics remain private and must be obtained through direct diligence.

sections:
  - id: revenue-model
    title: Revenue Model and GTM Economics
    body: |
      Tianji's revenue engine is hardware-centric: it sells force-control dual-arm robotic systems
      directly to humanoid OEM manufacturers, precision-electronics assemblers, and industrial
      automation integrators. The B2B direct-sales channel is the only confirmed GTM motion; no
      channel-partner, distributor, or reseller program has been disclosed. List pricing, contract
      terms, and realized ASPs are not public.

      The product portfolio spans two segments. The established industrial collaborative-robot
      business had served more than 800 customers with over 10,000 cobot units in operation by end
      of 2022, providing a baseline revenue floor that cannot be separately quantified. The newer
      and strategically higher-priority force-control humanoid dual-arm line delivered more than
      2,000 units to over 100 customers in a four-month window in 2025, and entered 2026 with a
      disclosed order backlog exceeding 10,000 units across 45 global humanoid OEM accounts.

      Tianji's stated long-term revenue ambition extends beyond hardware into full humanoid robot
      platforms and embodied-AI service layers, but no commercial product, pricing, or timeline for
      these categories has been announced. As of the June 2026 research date, hardware unit sales
      remain the sole confirmed revenue mechanism, and the company has published no revenue,
      gross-margin, or profitability figures for any period.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI006
      - CI007
      - CI008
      - CI009
    tableRefs:
