  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: revenue and ARR
      missingEvidence: >
        No revenue, ARR, or gross-profit figures for any period have been disclosed; Tianji is a
        private company without any public financial reporting obligation.
      whyItMatters: >
        Without revenue data, it is impossible to compute a defensible valuation multiple, capital
        efficiency ratio, or growth trajectory; the RMB 10B valuation is entirely narrative-based.
      diligencePath: >
        Request audited income statements for 2024 and 2025, a revenue-recognition policy memo,
        and board-approved management accounts for H1 2026.
      relatedQuestionRefs:
        - QI003

    - type: private-evidence-only
      severity: blocking
      topic: burn rate and cash balance
      missingEvidence: >
        Monthly operating costs, capex schedule, and current cash balance after Series B close
        are entirely undisclosed; no balance sheet or cash-flow statement is available.
      whyItMatters: >
        Without confirmed burn and cash position, capital-adequacy runway calculations are purely
        speculative and cannot anchor a financing or partnership decision.
      diligencePath: >
        Request a board-level cash-flow report, trailing 12-month operating cost data, and
        post-close pro-forma balance sheet from Tianji management.
      relatedQuestionRefs:
        - QI008

    - type: missing-source
      severity: material
      topic: backlog order quality
      missingEvidence: >
        The 10,000-unit Q1 2026 backlog is a company-stated figure with no documentation of
        the contractual form; binding versus soft-commitment split is unknown.
      whyItMatters: >
        If a material share of the backlog represents non-binding letters of intent or framework
        agreements, projected 2026 revenue would be significantly lower than implied.
      diligencePath: >
        Review customer purchase agreements, delivery schedules, and cancellation-clause terms
        for the top 10 accounts by backlog volume.
      relatedQuestionRefs:
        - QI007
        - QI014

    - type: private-evidence-only
      severity: material
      topic: revenue segmentation
      missingEvidence: >
        Tianji does not separately disclose revenue from the industrial cobot legacy business
        versus the humanoid force-control dual-arm segment; total revenue is also undisclosed.
      whyItMatters: >
        Investors and partners need to understand growth dynamics in the higher-value humanoid
        arm segment independently from the lower-growth legacy cobot base.
      diligencePath: >
        Request segment income statements or management-account breakdowns separating cobot and
        humanoid arm revenue and margin contributions.
      relatedQuestionRefs:
        - QI020

    - type: private-evidence-only
      severity: material
      topic: Everwin inter-company arrangements
      missingEvidence: >
        The financial terms of Tianji's inter-company manufacturing support, procurement
        relationships, or any credit guarantees from Everwin Precision are not publicly disclosed.
      whyItMatters: >
        If Tianji's apparent COGS advantage relies on below-market inter-company transfer pricing
        from Everwin, the true standalone cost structure could be materially higher, affecting
        post-IPO gross-margin expectations.
      diligencePath: >
        Request all inter-company agreements, arm's-length pricing study, and any parent
        guarantees or letters of comfort in the legal due-diligence package.

