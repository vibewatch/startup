callouts:
  - calloutType: risk
    title: Valuation Exceeds Auditable Revenue
    body: >
      Tianji carries a RMB 8–10 billion valuation with zero disclosed revenue and no near-term
      IPO or secondary-market disclosure obligation. At an estimated RMB 160M–400M in 2025
      humanoid arm revenue, the implied revenue multiple ranges from roughly 25× to 60×. Any
      investment or partnership decision that relies on the valuation requires first confirming
      actual revenue through direct financial-statement review.
    claimRefs:
      - CI006
      - CI011
      - CI028
      - CI035

  - calloutType: assumption
    title: Order Backlog May Include Non-Firm Commitments
    body: >
      The 10,000+ unit Q1 2026 backlog is a company-provided and unaudited figure. Without
      reviewing underlying purchase agreements, it is unknown what share constitutes legally
      binding orders versus soft letters of intent or framework agreements with OEM customers.
      The distinction materially affects any revenue-timing forecast.
    claimRefs:
      - CI002
      - CI008
      - CI030
      - CI038

  - calloutType: insight
    title: Parent Everwin Provides COGS Leverage and Contingency Capital
    body: >
      Everwin Precision's role as a core Apple/Tesla precision-manufacturing supplier confers
      structural COGS advantages — shared tooling, supply-chain relationships, and precision
      assembly yield learning curves — that independent robotic startups cannot replicate at the
      same capital intensity. This parent relationship also represents an implicit capital backstop
      that may not be fully priced into the standalone-startup valuation framework investors apply.
    claimRefs:
      - CI014
      - CI015
      - CI027
      - CI036

