- id: deployment-and-channel
  title: Deployment model, partner channels, and pipeline signals
  body: "Dexory's customer acquisition motion is designed to feel low-friction even for operationally complex warehouse environments. Official pages describe a subscription rather than CapEx purchase, fast installation in under two weeks, minimal IT involvement, and compatibility with existing WMS, ERP, or cargo-management systems. That matters because the company is selling into operators that cannot tolerate layout changes or prolonged downtime. Partner references make the route-to-market broader than direct sales alone. Tailscale shows Dexory already supporting a global fleet of deployed robots in messy customer networks, while C5MI and K\xF6rber show Dexory being packaged with process expertise and enterprise execution software. Raymond Storage Concepts appears in the ODW deployment, reinforcing a systems-integration-led motion in North America. The Nashville HQ, support base, and customer innovation center indicate Dexory is investing in pipeline conversion and implementation capacity,\
    \ not just demand generation. The commercial pattern therefore looks strongest where Dexory can sell a fast, low-disruption deployment into 3PL or warehouse-operator environments and then expand through additional sites, units, or partner-led introductions."
  claimRefs:
  - CU005
  - CU006
  - CU023
  - CU024
  - CU025
  - CU033
  - CU034
  - CU035
  - CU036
  - CU042
