chapter:
  number: 6
  title: Customers
  summary: Dexory has real customer adoption, with the strongest public proof concentrated in logistics operators such as ODW Logistics, Romark Logistics, Maersk, DCL Logistics, and Linfox BevChain. Public evidence supports fast deployment and meaningful ROI claims, but it is still thin on churn, renewal quality, and revenue concentration, so the chapter proves traction more clearly than durability.
sections:
- id: customer-mix
  title: Customer mix, verticals, and geographic spread
  body: 'Dexory''s clearest public customer fit is the warehouse operator rather than the end-consumer brand. The deepest references come from third-party logistics providers and logistics operators that need higher inventory accuracy, faster cycle counting, and less disruption to live warehouse throughput. ODW Logistics, Romark Logistics, Maersk, and Linfox BevChain all fit that pattern: the buyer is usually a warehouse or automation leader, the daily user is operations or inventory staff, and the economic payer is the site or network owner trying to protect OTIF, reduce labor drag, and avoid claim disputes. Public sector spread is broader than the named deep cases alone suggest. Independent coverage and Dexory''s own segment pages place the company across logistics, retail and ecommerce, manufacturing, pharmaceuticals, and air cargo, with logo-level references to DB Schenker, Yusen Logistics, GE Appliances, Vente-Unique, and other operators. The geographic footprint is also wide in public
    materials, spanning the UK, continental Europe, North America, Australia, and APAC. That said, the evidence depth is uneven: only a handful of accounts have measurable outcomes, while many other names appear only as logos or in broad customer lists.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU026
  - CU027
  - CU028
  - CU029
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: named-proof
  title: Named deployments, production proof, and ROI disclosure
  body: 'The strongest named proof comes from Maersk, ODW Logistics, Romark Logistics, DCL Logistics, and Linfox BevChain. Maersk is the broadest brand name, but the public evidence splits into two different levels of maturity: an initial Dexory-authored trial story covering Kettering and Tamworth in the UK, and a later EMG Maersk workflow case on handheld discrepancy resolution. That gives real operational substance, but not yet a clean network-wide production narrative across Maersk. ODW is the richest deployment proof set in this chapter: Dexory and ODW both describe under-24-hour full audits, frequent autonomous scans, resolution of up to 90% of issues before pick, and expansion from the initial deployment into four more units. Romark adds a fresh 2026 proof point around no-shift-disruption deployment at a Pennsylvania confectionery site, while DCL contributes the cleanest third-party ROI metrics with 14% better pallet accuracy, 10x faster counting, and 16 labor hours saved per day.
    Linfox BevChain strengthens APAC coverage and adds a safety angle, but it is still a vendor-authored case study rather than an independent customer publication.'
