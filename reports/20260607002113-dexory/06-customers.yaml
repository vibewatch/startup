- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver or concentration risk
  - Impact
  - Public evidence
  - Implication
  - Diligence path
  rows:
  - - ODW multi-unit rollout
    - Positive expansion signal
    - Initial deployment followed by four more units
    - Suggests a land-and-expand motion inside 3PL networks
    - Request unit economics and payback by additional site
  - - Romark additional-facility pathway
    - Positive expansion signal
    - Official and customer pages mention pathway to more facilities
    - Indicates network-level upside beyond a single site
    - Request signed rollout schedule and conditions
  - - "Channel leverage via C5MI, K\xF6rber, Raymond, Peak"
    - Positive pipeline signal
    - Partner ecosystem can source enterprise leads and implementation support
    - May accelerate logo growth without proportional sales hiring
    - Request partner-sourced pipeline and closed-won mix
  - - Proof concentration in a few logistics operators
    - Material concentration risk
    - Most deep outcome proof sits in Maersk, ODW, Romark, DCL, and Linfox
    - Breadth is weaker than the broader logo strip implies
    - Request top-10 customer revenue concentration and sector mix
  - - Trial-to-production ambiguity
    - Material diligence risk
    - Maersk network case is explicitly framed as a trial, while other logo references are undefined
    - Large logos may overstate production maturity
    - Request site-by-site production, pilot, and churn status
  - - Retention metric opacity
    - Material diligence risk
    - No public NRR, GRR, churn, or renewal data
    - Durability cannot be underwritten from public sources alone
    - Request cohort retention and renewal dashboards
  - - Adoption prerequisites still exist
    - Moderate adoption friction
    - Site survey, queueing, Wi-Fi, dock, and ambient requirements remain
    - Fast deployment does not mean zero implementation work
    - Request implementation timeline by customer and failed-install history
  - - Warehouse-operator concentration
    - Strategic exposure
    - Evidence is strongest in 3PL and warehouse-operator contexts
    - Less proof today for direct shipper-wide standardization deals
    - Request pipeline split between operators, brands, and partners
  notes: This concentration/risk artifact separates true expansion signals from the public-proof gaps that still block a clean durability assessment.
