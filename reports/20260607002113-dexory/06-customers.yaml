  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: public retention metrics for Dexory customers
    missingEvidence: Net revenue retention, gross revenue retention, logo churn, renewal rate, and contract term by cohort.
    whyItMatters: Without durability metrics, the chapter can prove adoption but cannot quantify whether customers expand, renew, or quietly churn.
    diligencePath: Request customer cohort retention dashboard, renewal schedule, and churn bridge for the last 24 months.
    relatedQuestionRefs:
    - QU023
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: customer concentration by revenue and contract exposure
    missingEvidence: Top-10 customer revenue mix, largest single-account share, and exposure by vertical and geography.
    whyItMatters: A few warehouse-operator accounts could represent a disproportionate share of ARR or deployment footprint, materially changing risk.
    diligencePath: Request customer concentration schedule with ARR, gross margin, contract end date, and deployment count by account.
    relatedQuestionRefs:
    - QU024
    relatedTableRefs:
    - TU005
  - type: enumeration-incomplete
    severity: material
    topic: named customer proof table coverage
    missingEvidence: A complete list of production customers, pilots, churned accounts, and stage by site or region.
    whyItMatters: Official pages show many logos, but only a subset have outcome-rich evidence; the gap obscures true breadth versus marketing breadth.
    diligencePath: Request a customer deployment ledger showing each named account's stage, site count, go-live date, and measured outcomes.
    relatedQuestionRefs:
    - QU021
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: minor
    topic: independent customer satisfaction and reference depth
    missingEvidence: Unfiltered third-party review exports, reference calls, or independent case studies for additional named accounts.
    whyItMatters: FeaturedCustomers shows some external validation, but public review volume is still thin relative to Dexory's logo footprint.
    diligencePath: Collect reference calls from at least three customers across 3PL, manufacturing, and aviation; request peer-review exports where available.
    relatedQuestionRefs:
    - QU022
    relatedTableRefs:
    - TU004
