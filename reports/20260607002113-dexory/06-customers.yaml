      tone: neutral
    - label: Initial deployment
      detail: A robot and DexoryView are installed in a selected facility, usually with no layout change and limited IT lift.
      tone: neutral
    - label: Daily operational use
      detail: Teams shift from manual audits toward daily or weekly scans, live discrepancy resolution, and dashboard-led exception handling.
