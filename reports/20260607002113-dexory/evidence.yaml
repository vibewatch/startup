evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-board-rights
    missingEvidence: >-
      Current cap table, board seat allocation, observer rights, protective provisions, and priced-round valuation
      step-ups after the public Series C disclosures.
    whyItMatters: These control terms determine who actually governs the company and how downside or dilution risk is shared.
    diligencePath: >-
      Request the latest cap table, investor-rights agreement, voting agreements, and any board-consent schedule from
      management or counsel.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO002
      - TO003
      - TO005
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Current revenue, ARR, gross margin, burn, runway, customer concentration, and cash-collection metrics.
    whyItMatters: >-
      The company looks commercially credible, but valuation, efficiency, and downside underwriting cannot be completed
      from product and funding headlines alone.
    diligencePath: >-
      Request monthly financials, KPI pack, cohort retention, gross-margin bridge, and management’s current budget
      versus actuals.
    relatedQuestionRefs:
      - QO026
    relatedTableRefs:
      - TO001
      - TO005
  - type: missing-source
    severity: material
    topic: debt-terms
    missingEvidence: The lender identity, collateral package, maturity, and covenants behind the 2025 MR01 charges.
    whyItMatters: >-
      Secured debt can constrain optionality, increase default sensitivity, and alter the effective seniority stack
      despite strong equity funding headlines.
    diligencePath: >-
      Pull the underlying charge PDFs and debt agreements, then reconcile them against board approvals and current cash
      balances.
    relatedQuestionRefs:
      - QO023
      - QO025
    relatedTableRefs:
      - TO004
      - TO005
  - type: access-blocked
    severity: minor
    topic: independent-employee-and-legal-adverse-checks
    missingEvidence: >-
      A clean independent read on employee sentiment and any non-obvious litigation or layoff history from review sites
      or court-linked records.
    whyItMatters: >-
      The reviewed public record does not show a major controversy, but absence of evidence is not evidence of absence
      for cultural or employment-related risk.
    diligencePath: >-
      Re-run adverse checks with accessible court and labor databases, then supplement with direct employee-reference
      calls rather than blocked review sites.
    relatedQuestionRefs:
      - QO027
    relatedTableRefs:
      - TO005
  - type: conflicting-data
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      A third-party market estimate that isolates warehouse intelligence or autonomous inventory-scanning spend as a
      distinct market line item.
    whyItMatters: >-
      Without a standalone category, any Dexory SAM or SOM figure remains a report-side approximation rather than a
      published benchmark.
    diligencePath: >-
      Request analyst reports or customer budget data that break warehouse automation spend into inventory visibility,
      cycle counting, and digital-twin subcategories.
    relatedQuestionRefs:
      - QM011
      - QM026
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing-and-contracts
    missingEvidence: Publicly verifiable pricing, contract size, budget line, and payback data for Dexory deployments.
    whyItMatters: >-
      Buyer urgency is visible, but the chapter cannot convert buyer interest into a robust SOM without understanding
      ACV, pricing mechanics, and procurement friction.
    diligencePath: >-
      Request price sheets, signed customer contracts, and cohort payback data segmented by 3PL, retail, and
      manufacturing buyer type.
    relatedQuestionRefs:
      - QM025
      - QM026
  - type: private-evidence-only
    severity: material
    topic: expansion-rates
    missingEvidence: >-
      Public cohort data showing how often pilots convert into multi-site rollouts and how quickly deployments expand
      across a network.
    whyItMatters: >-
      Customer anecdotes prove value, but not the repeatability of network expansion or the speed at which Dexory can
      compound revenue after a first site.
    diligencePath: >-
      Obtain deployment-cohort dashboards covering pilot conversion, expansion timelines, retained sites, and
      partner-led wins.
    relatedQuestionRefs:
      - QM024
      - QM026
  - type: missing-source
    severity: minor
    topic: buyer-budget-line
    missingEvidence: >-
      Named public evidence for whether Dexory is usually funded from operations, automation, digital transformation, or
      inventory-control budgets.
    whyItMatters: >-
      Budget ownership determines sales cycle shape, sponsor map, and whether Dexory competes against WMS projects,
      labor initiatives, or capex programs.
    diligencePath: >-
      Interview current customers and partners about budget owner, sign-off path, and whether the commercial model is
      treated as opex or capex.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: minor
    topic: vertical-mix-and-geography
    missingEvidence: A current installed-base breakdown by vertical, warehouse size, and geography.
    whyItMatters: >-
      The market boundary and SAM proxy depend on where Dexory is actually winning today, not only on where it could
      theoretically sell.
    diligencePath: Request customer-count distribution by sector, region, and facility type, plus win-loss notes for missed segments.
    relatedQuestionRefs:
      - QM012
      - QM026
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Public list pricing, realized ACV, and module-level discounting are not disclosed for Dexory, Gather AI, Verity,
      Corvus, Locus, Exotec, or the major suite incumbents in the retained source set.
    whyItMatters: >-
      Without contract-level pricing it is not possible to size Dexory's pricing power, compare it credibly to overlay
      peers, or quantify the true economic advantage of incumbent bundle pricing.
    diligencePath: >-
      Request sample MSAs, order forms, and realized ACV ranges by warehouse size and vertical. Validate any pricing
      narrative with customer references and procurement-level win/loss data.
    relatedQuestionRefs:
      - QP014
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: deployment-scale-opacity
    missingEvidence: >-
      Current live-site counts, active-robot counts, and annual deployment velocity are still private for many
      scan-native vendors, including Dexory, Gather AI, and Corvus.
    whyItMatters: >-
      Public scale matters because installed-base density affects referenceability, services burden, and the durability
      of any data flywheel or customer-trust moat.
    diligencePath: >-
      Ask management for live sites, annual gross adds, gross churn, and cohort expansion by vertical. Cross-check with
      case-study references and named-customer deployment maps.
    relatedQuestionRefs:
      - QP019
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: contract-stickiness
    missingEvidence: >-
      Contract duration, renewal rates, net retention, and migration pain are not public for Dexory or most direct
      peers. Verity's near-zero churn claim is unusual rather than representative.
    whyItMatters: >-
      Switching-cost quality is central to underwriting competitive durability. A low-friction initial deployment only
      becomes a moat if customers expand and renew rather than multi-home or churn.
    diligencePath: >-
      Request cohort retention, renewal terms, professional-services burden, and examples of customers expanding from
      pilot to network-wide rollout. Speak directly with former customers if available.
    relatedQuestionRefs:
      - QP020
    relatedTableRefs:
      - TP005
  - type: missing-source
    severity: material
    topic: competitive-win-loss
    missingEvidence: >-
      Public win-loss evidence showing Dexory displacing Gather AI, Verity, Corvus, or suite incumbents is sparse, and
      the retained sources are mostly vendor marketing plus funding or profile coverage.
    whyItMatters: >-
      Without hard displacement evidence it is difficult to separate real competitive advantage from category-level
      marketing convergence, especially when bundle economics or adjacent automation projects may decide the deal.
    diligencePath: >-
      Request named competitive bake-offs, renewal decisions, and displacement examples from management and customers.
      Supplement with third-party channel checks across 3PL and manufacturing buyers.
    relatedQuestionRefs:
      - QP025
    relatedTableRefs:
      - TP006
  - type: private-evidence-only
    severity: material
    topic: gross-margin
    missingEvidence: Segmented gross margin by subscription, implementation, support, and hardware servicing.
    whyItMatters: >-
      Without gross margin by stream, it is impossible to tell whether recurring software economics are strong enough to
      absorb robot depreciation and support costs.
    diligencePath: >-
      Request cohort P&L, robot servicing cost schedules, and a stream-level gross margin bridge for the last four
      quarters.
    relatedQuestionRefs:
      - QI027
    relatedTableRefs:
      - TI003
      - TI005
      - TI006
  - type: private-evidence-only
    severity: material
    topic: current-trading
    missingEvidence: Current 2026 ARR, revenue run rate, net revenue retention, and renewal/cohort data.
    whyItMatters: >-
      Funding announcements can mask weak underlying commercial efficiency, so underwriting needs current recurring
      revenue and retention rather than only case studies.
    diligencePath: Request board deck KPIs, monthly recurring revenue bridge, and trailing-12-month cohort retention tables.
