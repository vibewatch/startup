    - label: Dexory investment decision
      detail: 'Start with public evidence only: funding structure, commercial proof, comp set, and missing economics.'
      tone: neutral
    - label: 'Step 1: Is there real commercial proof?'
      detail: Named global customers, ROI anecdotes, and live 2026 deployments say yes.
      tone: positive
    - label: 'Step 2: Is valuation observable?'
      detail: No. Series C size is public, but post-money valuation is not.
      tone: risk
    - label: 'Step 3: Does capital stack matter?'
      detail: Yes. Both Series B and Series C included debt or expanded debt facilities.
      tone: risk
    - label: 'Step 4: Can comps support premium pricing?'
      detail: Only if Dexory proves software-like economics closer to Descartes, Manhattan, or Symbotic than to Zebra or GXO.
