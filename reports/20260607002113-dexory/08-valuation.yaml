  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Signal
  - Decision implication
  rows:
  - - Recommendation
    - Research-more
    - Public evidence insufficient for round-price acceptance
    - Advance only with full data room and meaningful price discipline
  - - Confidence
    - Low-medium
    - Business quality is more visible than economics
    - Confidence upgrades only after ARR, margin, and retention disclosure
  - - Risk rating
    - High
    - Capital intensity, valuation opacity, and debt/preference uncertainty
    - Treat new money as structured-risk capital, not clean growth equity
  - - Valuation stance
    - Stretched at undisclosed round terms
    - Public evidence supports a lower band than a typical $100M+ equity round would imply
    - Anchor negotiations to a discount or ratchet tied to audited KPIs
  - - Public-evidence value band
    - $250M-$350M base; $150M-$220M downside; $400M+ only with proof
    - Range driven by opaque revenue and comp dispersion
    - Do not underwrite upside without audited software economics
  - - Most likely next step
    - Diligence-first, price-second
    - Named customers and product proof justify work; undisclosed price does not justify immediate commitment
    - Request full round docs before term-sheet engagement
  notes: Public-evidence assessment only; valuation bands combine a low-confidence revenue estimate with public comparable market-cap-to-revenue bands and should not be mistaken for a fairness opinion.
