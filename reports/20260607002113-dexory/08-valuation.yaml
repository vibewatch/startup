- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Theme
  - Thesis
  - Anti-thesis
  - What changes the view
  rows:
  - - Warehouse data moat
    - Scan-count growth, named customers, and broader storage coverage suggest Dexory is building a hard-to-replicate data layer.
    - Scan-count claims are company-reported and do not prove monetization or retention quality.
    - Audited ARR by module and evidence that data layer drives pricing or renewal uplift.
  - - Customer proof
    - Romark and official case studies indicate real operating value with low disruption.
    - A handful of case studies may not generalize across the installed base or prove portfolio-wide payback.
    - A deployment roster with before/after KPI distribution across the customer base.
  - - Capital efficiency
    - Mixed equity-plus-debt rounds let Dexory scale faster than a pure equity path.
    - Growth debt and undisclosed preferences can sharply reduce equity upside in a flat or down round.
    - Debt schedules, covenants, and waterfall terms from the Series B and Series C docs.
  - - Comp positioning
    - Dexory should trade above GXO and Zebra because it owns more software and data.
    - Dexory has not yet earned Descartes, Manhattan, or Symbotic-style multiples on public evidence.
    - Gross margin mix, retention, and software attach rates that justify a premium band.
  - - Narrative quality
    - The company clearly resonates with customers and investors around warehouse visibility.
    - The absence of disclosed valuation and revenue quality metrics leaves narrative outrunning evidence.
    - A clean 2026 valuation mark plus audited 2025-2026 operating metrics.
  notes: This table deliberately contrasts the strongest bullish framing with the strongest evidence-backed counterpoint; unresolved items are diligence gates, not stylistic caveats.
  claimRefs:
  - CV012
  - CV018
  - CV019
  - CV031
  - CV032
