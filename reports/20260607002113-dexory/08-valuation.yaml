slug: dexory
runDate: '2026-06-07'
company:
  name: Dexory
chapter:
  number: 8
  title: Valuation
  summary: Dexory closed a large but undisclosed-price 2025 Series C, added a 2026 British Business Bank extension, and showed meaningful customer and product traction, yet the public record still lacks audited ARR, gross margin, retention, and cap-table terms. Public comparables suggest Dexory deserves a premium to services-heavy logistics operators but not a blind software multiple, which leaves the current stance at research-more with a cautious public-evidence valuation band centered around roughly $250 million to $350 million and no support for accepting undisclosed round terms without deeper diligence.
sections:
- id: valuation-context
  title: Valuation context, opacity, and capital stack
  body: Dexory entered 2026 with impressive momentum but weak public price discovery. The company disclosed a $165 million Series C in October 2025 and then added a £8.5 million British Business Bank tranche in March 2026, yet it never disclosed the post-money valuation. That matters more here than for a routine growth round because Dexory has already layered growth debt into both its 2024 Series B and 2025 Series C structures. Public investors can see capital inflow, customer logos, scan-count growth, and a new North American headquarters, but they still cannot see current ARR, margin mix, retention, or debt terms. City A.M. additionally reported a £12 million loss for the year ended March 2024, which reinforces that Dexory remains in a scale-up phase rather than a self-funding software model. In practical terms, public evidence can justify interest in the business, but not blind acceptance of undisclosed round pricing or dilution terms.
