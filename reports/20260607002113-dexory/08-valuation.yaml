  - CV042
- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Illustrative revenue band
  - Illustrative multiple band
  - Implied value band
  - What must be true
  - Probability signal
  rows:
  - - Bear
    - $25M-$30M
    - 6x-7x
    - $150M-$220M
    - ROI remains case-study-specific, debt overhang matters, and buyers treat Dexory as logistics-tech with modest software premium.
    - High if ARR is close to the public estimate and retention is weak
  - - Base
    - $30M-$35M
    - 8.5x-10x
    - $255M-$350M
    - Dexory proves sticky workflow value, moderate software margin quality, and continued customer expansion without disclosing a premium growth profile.
    - Most plausible on current public evidence
  - - Bull
    - $35M-$40M
    - 12x-14x
    - $420M-$560M
    - ARR is materially above public estimates, renewal quality is strong, and software-like economics justify a premium platform multiple.
    - Requires private diligence to validate
  - - Probability-weighted public-evidence view
    - $30M-$35M midpoint
    - ~9x
    - $270M-$320M
    - Current evidence supports curiosity, not acceptance of an undisclosed premium mark.
    - Use as negotiation anchor, not a go/no-go substitute
  notes: Scenario bands are illustrative sensitivity outputs, not management forecasts; revenue bands widen around the only public estimate because that estimate is internally inconsistent on funding history.
