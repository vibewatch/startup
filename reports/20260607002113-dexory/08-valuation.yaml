    - Services model understates what a real software layer can earn.
  - - Mytra
    - Private
    - $120M Series C disclosed; valuation undisclosed
    - $120M new capital in Jan 2026
    - Funding appetite, not multiple
    - Shows investors will fund warehouse automation when deployment scale inflects.
    - No valuation disclosed, so it is a sentiment comp rather than a hard multiple comp.
  - - Berkshire Grey
    - M&A / take-private
    - Public-market robotics platform
    - $375M SoftBank take-private in 2023
    - Downside precedent
    - Useful cautionary comp for robotics valuation compression.
    - Older transaction and public-market path differ from Dexory's private route.
