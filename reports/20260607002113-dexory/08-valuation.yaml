  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current-arr-and-margin
    missingEvidence: Audited ARR, recognized revenue, gross margin, and software-versus-hardware mix for FY2025 and LTM 2026.
    whyItMatters: Every valuation band in this chapter moves materially once the revenue base and margin quality are known.
    diligencePath: Request the audited FY2025 package, LTM 2026 management accounts, and revenue-by-module bridge from finance.
    relatedQuestionRefs:
    - QV031
    relatedTableRefs:
    - TV003
    - TV004
    - TV006
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-debt-terms
    missingEvidence: Series B and Series C debt schedules, covenants, liquidation preferences, ratchets, anti-dilution clauses, and any secondary transactions.
    whyItMatters: A strong operating business can still produce weak equity outcomes if structured claims sit ahead of new capital.
    diligencePath: Review executed financing documents with counsel and build a current cap-table waterfall before any pricing discussion.
    relatedQuestionRefs:
    - QV032
    - QV034
    relatedTableRefs:
    - TV006
    - TV007
  - type: private-evidence-only
    severity: material
    topic: customer-quality
    missingEvidence: Top-10 customer concentration, GRR, NRR, and upcoming renewal schedule.
    whyItMatters: Named logos support the story, but valuation only deserves a premium if the customer base is sticky and diversified enough.
    diligencePath: Request cohort analysis, contract summary, renewal dates, and customer-reference calls led by commercial diligence.
    relatedQuestionRefs:
    - QV033
    relatedTableRefs:
    - TV006
  - type: missing-source
    severity: material
    topic: actual-series-c-pricing
    missingEvidence: Post-money valuation, share price, option-pool expansion, and any valuation reset between the October 2025 close and March 2026 extension.
    whyItMatters: Round size without share price is not enough to decide whether Dexory is attractively or expensively priced.
    diligencePath: Request the signed closing memo, cap-table snapshot, and extension-side-letter terms from counsel and the CFO.
    relatedQuestionRefs:
    - QV034
    relatedTableRefs:
    - TV001
    - TV007
  - type: private-evidence-only
    severity: minor
    topic: portfolio-wide-roi-generalization
    missingEvidence: Deployment roster plus before/after KPI distribution across the installed base, not just the best published case studies.
    whyItMatters: The upside valuation case weakens if strong ROI is limited to a few flagship customers or unusually favorable sites.
    diligencePath: Request customer KPI exports by site and run a structured sample of reference calls across warehouse types and geographies.
    relatedQuestionRefs:
    - QV035
    relatedTableRefs:
    - TV002
    - TV006
