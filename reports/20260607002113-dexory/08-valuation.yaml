- id: comparable-benchmarking
  title: Comparable benchmarking across software, robotics, and logistics
  body: 'A Dexory multiple should sit somewhere between services-heavy logistics operators and premium automation or warehouse-software platforms. Public market references make that point clearly. GXO and Zebra trade at much lower revenue multiples because they carry more operational or hardware exposure, while Descartes, Manhattan Associates, and Symbotic command materially richer ratios because they own software, automation IP, or scarce platform position. Private-market references also show a split: Mytra still raised $120 million in 2026 after visible commercial step-ups, Nomagic added a smaller extension round rather than a large step-up, and Berkshire Grey ended up selling for only about $375 million after its public-market journey disappointed. Dexory is therefore not a clean pure-software comp and not a plain 3PL comp. The right lens is a hybrid: premium to services, discount to the best software platforms, and heavily conditioned on whether the company can prove software-like economics
    rather than just hardware-enabled visibility wins.'
  claimRefs:
  - CV020
  - CV021
  - CV022
  - CV023
  - CV024
  - CV025
  - CV026
  - CV027
  - CV028
  - CV041
