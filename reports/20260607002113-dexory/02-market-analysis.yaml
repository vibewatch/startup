chapter:
  number: 2
  title: Market Analysis
  summary: Dexory sells into a narrow but growing warehouse-intelligence layer inside the broader warehouse automation market. Public data supports a large automation TAM and clear demand drivers such as e-commerce throughput, labor intensity, and the need for accurate inventory data, but it does not isolate a clean standalone market for autonomous inventory scanning and digital twins. The practical buyer case is strongest in large 3PL and contract-logistics warehouses where daily cycle counts, WMS reconciliation, and non-disruptive inventory visibility matter more than full robotic material movement.
sections:
- id: market-boundary
  title: Market boundary and status-quo substitutes
  body: Dexory sits inside the warehouse-intelligence layer rather than the full warehouse-automation stack. Its core promise is not robotic picking or goods-to-person storage; it is continuous inventory truth. DexoryView combines autonomous scanning robots, a digital twin, and AI analytics to reconcile what the WMS says with what is physically in racks. Included spend therefore covers automated cycle counting, stock-integrity monitoring, discrepancy detection, space-utilization analytics, and warehouse-health inspections. Adjacent spend includes WMS, OMS, and transport systems that remain systems of record and execution, plus broader warehouse-automation categories such as AS/RS, sortation, and picking robots. The closest status-quo substitute is still manual cycle counting, floor walks, and periodic audits. That boundary matters because Dexory can often be sold as a lighter overlay on an existing warehouse, especially where operators want better data without redesigning the facility or
    disrupting live operations.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
