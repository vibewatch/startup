- id: gaps-and-contradictions
  title: Gaps, contradictions, and what remains unproven
  body: The main analytical risk is false precision. Public sources readily size warehouse automation and warehouse robotics, but they do not cleanly isolate spend on autonomous inventory scanning, digital twins, or warehouse-intelligence overlays. That matters because using the full automation TAM would overstate Dexory's addressable pool, while using the robotics TAM would still capture many workflows Dexory does not serve. The most defensible view is a constrained slice inside existing warehouse-automation budgets where buyers are paying for visibility, cycle counting, and discrepancy management rather than material movement itself. Public case studies also show clear operational value, but not enough detail on budget line, contract size, attach rates, win rates, or expansion cadence to convert buyer interest into a robust SOM. The chapter therefore preserves a low-confidence SAM proxy and treats pricing, site economics, and conversion from pilot to network rollout as diligence asks rather
    than proven facts.
