  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: sizing-gap
    missingEvidence: A third-party market estimate that isolates warehouse intelligence or autonomous inventory-scanning spend as a distinct market line item.
    whyItMatters: Without a standalone category, any Dexory SAM or SOM figure remains a report-side approximation rather than a published benchmark.
    diligencePath: Request analyst reports or customer budget data that break warehouse automation spend into inventory visibility, cycle counting, and digital-twin subcategories.
    relatedQuestionRefs:
    - QM011
    - QM026
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing-and-contracts
    missingEvidence: Publicly verifiable pricing, contract size, budget line, and payback data for Dexory deployments.
    whyItMatters: Buyer urgency is visible, but the chapter cannot convert buyer interest into a robust SOM without understanding ACV, pricing mechanics, and procurement friction.
    diligencePath: Request price sheets, signed customer contracts, and cohort payback data segmented by 3PL, retail, and manufacturing buyer type.
    relatedQuestionRefs:
    - QM025
    - QM026
  - type: private-evidence-only
    severity: material
    topic: expansion-rates
    missingEvidence: Public cohort data showing how often pilots convert into multi-site rollouts and how quickly deployments expand across a network.
    whyItMatters: Customer anecdotes prove value, but not the repeatability of network expansion or the speed at which Dexory can compound revenue after a first site.
    diligencePath: Obtain deployment-cohort dashboards covering pilot conversion, expansion timelines, retained sites, and partner-led wins.
    relatedQuestionRefs:
    - QM024
    - QM026
  - type: missing-source
    severity: minor
    topic: buyer-budget-line
    missingEvidence: Named public evidence for whether Dexory is usually funded from operations, automation, digital transformation, or inventory-control budgets.
    whyItMatters: Budget ownership determines sales cycle shape, sponsor map, and whether Dexory competes against WMS projects, labor initiatives, or capex programs.
    diligencePath: Interview current customers and partners about budget owner, sign-off path, and whether the commercial model is treated as opex or capex.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM003
  - type: missing-source
    severity: minor
    topic: vertical-mix-and-geography
    missingEvidence: A current installed-base breakdown by vertical, warehouse size, and geography.
    whyItMatters: The market boundary and SAM proxy depend on where Dexory is actually winning today, not only on where it could theoretically sell.
    diligencePath: Request customer-count distribution by sector, region, and facility type, plus win-loss notes for missed segments.
    relatedQuestionRefs:
    - QM012
    - QM026
