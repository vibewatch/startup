- id: FM004
  title: Value-chain map — from manual inventory checks to operational intelligence
  type: flow
  layout: wide
  summary: Dexory is best understood as a data overlay that converts periodic inventory checks into a continuous warehouse-data loop linked to action.
  data:
    nodes:
    - id: manual
      label: Manual counts and floor walks
      detail: Periodic, labor-heavy, and operationally disruptive inventory checks
    - id: wms
      label: System of record
      detail: WMS retains location and stock records but not continuous physical truth
    - id: scan
      label: Autonomous scan layer
      detail: Robots capture racks, pallets, and warehouse conditions without pausing work
    - id: twin
      label: Digital twin and analytics
      detail: Data is reconciled into live visibility, trend analysis, and warehouse health signals
    - id: tasks
      label: Exception resolution
      detail: Teams correct discrepancies, investigate risks, and improve layout or process
    - id: outcomes
      label: Operational outcomes
      detail: Better stock integrity, faster audits, less search time, and clearer customer service execution
    edges:
    - from: manual
      to: wms
      label: Periodic updates only
    - from: wms
      to: scan
      label: Continuous physical verification added
    - from: scan
      to: twin
      label: Data converted into live operational view
    - from: twin
      to: tasks
      label: Discrepancies and risks become actionable
    - from: tasks
      to: outcomes
      label: Labor and service benefits realized
  approximationNotes: This flow is conceptual, but each step is directly grounded in Dexory product descriptions and customer case-study language. It illustrates where Dexory fits in the warehouse system stack, not a quantified funnel.
