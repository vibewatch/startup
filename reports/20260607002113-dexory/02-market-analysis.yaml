- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - E-commerce throughput and tighter service windows
    - tailwind
    - Current
    - More volume and faster delivery commitments increase the value of accurate, continuously updated warehouse data
    - Map Dexory wins to customer service-level targets and peak-season pain
  - - Large warehousing labor base and wage pressure
    - tailwind
    - Current
    - Labor-intensive cycle counting and search work becomes a clearer automation target as wages rise
    - Quantify labor removed or redeployed per deployed site
  - - Digital twins and AI as capacity tools
    - tailwind
    - Current to medium term
    - Dexory can position itself as the data foundation for capacity unlocks and AI-driven operations, not only cost takeout
    - Test whether customers buy Dexory for accuracy first, capacity second, or AI roadmap credibility
  - - Subscription and rapid deployment economics
    - tailwind
    - Current
    - Lighter commercial model can make Dexory easier to buy than full warehouse redesign projects
    - Validate actual pricing, payback, and churn by cohort
  - - 3PL share of warehouse automation spend
    - tailwind
    - Current
    - Outsourced operators are meaningful buyers because they need reusable, multi-site tools across customer portfolios
    - Measure concentration of Dexory revenue in 3PLs versus shippers
  - - Capital cost and budget scarcity
    - constraint
    - Current
    - Even lighter automation projects compete with other site capex and can stall on ROI scrutiny
    - Confirm average ACV, proof-of-value hurdle, and approval chain
  - - Integration and internal capability gaps
    - constraint
    - Current
    - Poor WMS integration or limited in-house automation skill can stop deployment from scaling beyond pilots
    - Review implementation timelines, data requirements, and partner dependence
  - - Partial suitability of robotics
    - constraint
    - Ongoing
    - Warehouse automation pays back fastest in repetitive tasks; more variable workflows can blunt the case for hardware-heavy solutions
    - Identify the exact workflows where Dexory wins versus where manual processes still dominate
  notes: Drivers and constraints are linked to adoption timing and buyer logic, not just broad market sentiment. Several entries are direction-of-travel observations rather than audited company-specific outcomes.
