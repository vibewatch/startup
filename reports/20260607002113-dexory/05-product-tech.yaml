- id: deployment-proof-differentiation-and-roadmap
  title: Deployment proof, differentiation, and roadmap
  body: |-
    Dexory has more real deployment proof than many warehouse-robotics startups that still mostly sell pilots. Official customer case studies show DB Schenker scanning 40,000 pallet locations daily in VNA aisles and reporting a 6% inventory-accuracy gain within three months; Yusen cutting wall-to-wall checks from more than 100 hours per month to two hours per day while eliminating another 205 hours of annual checks; a block-stack deployment at Yusen using 3D models and WMS matching to reach 97-98% daily accuracy; Romark validating inventory between shifts without stopping AGVs; and Menzies Aviation using nightly audits and exception reporting to cut manual checks and recover revenue from dwell-time and location issues. These examples suggest Dexory's strongest technical moat is not just perception hardware but repeatable deployment into messy warehouses without halting operations.

    The roadmap direction is also visible. Dexory has operated in live warehouses since 2023, layered customer-specific modules such as block-stack scanning and rental-pallet tracking into the core platform, launched a next-generation robot plus Storage Health at Manifest in February 2026, announced Adapt in April 2026 for later global availability, and showcased an 18-metre robot and a Nashville demo-and-R&D site in May 2026. Public developer-signal reinforces that this is a broad engineering organisation rather than a thin integration layer: Dexory is hiring across software, field service, assembly/build, and graduate rotations spanning autonomy, AI/perception, and platform engineering, with explicit references to Python, Linux, ROS, PyTorch, TensorFlow, Docker, Kubernetes, AWS, Golang, TypeScript, and React. The main public gap is that roadmap visibility is better on feature launches than on GA timing, attach rates, and customer adoption by module.
