  rows:
  - - Autonomous scanning robot
    - Warehouse operations, engineering, and site leadership
    - Live and mature; current 14m system with 2026 next-gen refresh
    - High-reach, non-disruptive wall-to-wall scanning with LiDAR, cameras, and extendable-tower safety
    - Need BOM, service-cost, and field-maintenance data by site
  - - DexoryView core digital twin
    - Ops managers, inventory control, continuous-improvement teams
    - Live and mature
    - Turns robot scans into a live warehouse model with discrepancy, location, utilisation, and exception workflows
    - No public data-model, tenancy, or retention architecture
  - - DexoryView Integrity
    - Inventory control and 3PL account teams
    - Live and heavily evidenced
    - Pick Count, Block Count, Double Deep, Rental Pallet Tracker, Item Search, Client Segmentation, Task Manager
    - Need named WMS mappings and configuration effort by warehouse type
  - - Storage Health
    - Ops, HSE, and inventory teams
    - New 2026 launch; customer value plausible but early
    - AI inspection layer for rack damage, pallet defects, hygiene, and obstruction risks during every scan
    - Need customer adoption, false-positive rate, and workflow-governance data
  - - DexoryView Optimise
    - CI teams, warehouse managers, and industrial engineers
    - Live in public feature pages, but proof is more qualitative than Integrity
    - Congestion, slotting, replenishment, consolidation, and smart-suggestion workflows use the same scan data as integrity checks
    - Need before/after KPIs by module rather than generic optimisation language
  - - DexoryView Adapt
    - Site leadership, network ops, and multi-site decision makers
    - Announced April 2026; later-this-year availability
    - Adds reasoning across physical data, site rules, and cross-site knowledge to recommend action, not just surface exceptions
    - Need GA timing, pricing, customer references, and guardrail detail for recommendations
  notes: Rows mix currently deployed modules with 2026 launch-stage capabilities; maturity labels reflect public deployment proof rather than internal adoption data.
