- id: autonomy-sensing-and-data-pipeline
  title: Autonomy, sensing, and data pipeline
  body: |-
    The public architecture is unusually specific for a private robotics company. Dexory says the current robot scans up to 10,000 pallet locations per hour and reaches 14 metres today, while official and independent 2026 launch coverage says the next generation extends scanning range to 60 feet and was later shown with an 18-metre tower. Safety documentation goes deeper than normal marketing copy: the robot uses 2D and 3D lidars, 3D cameras, sensor redundancy, functional braking logic, and higher-level path replanning that increases safety margin around humans. Dexory also discloses vertical safety as a differentiated requirement because the tower extends and retracts while scanning, so the perception field must scale with height rather than only ground-level motion.

    Dexory's data pipeline is also reasonably legible. The robot captures identifiers, quantities, volume, dimensions, and condition signals; compares them with warehouse-system records; and feeds a cloud-based DexoryView platform that can centrally administer more than 1,000 devices and exchange information over secure, encrypted, real-time channels. Official workflow pages repeatedly say the system integrates into WMS processes, closes the data loop against customer records, and can be deployed in roughly two weeks without major infrastructure changes or warehouse-layout redesign. What remains missing is the integration detail a technical buyer would want before underwriting implementation risk: the reviewed public source set does not surface named connectors, published API schemas, authentication patterns, or a concrete SSO / ERP integration reference architecture.
