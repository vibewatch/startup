- id: trust-safety-privacy-and-technical-risks
  title: Trust, safety, privacy, and technical risks
  body: |-
    Public trust controls are real but unevenly disclosed. On the positive side, Dexory publishes an unusually detailed warehouse-robot safety explainer, a privacy policy that names global privacy regimes, cloud providers and breach-notification expectations, and a security-disclosure policy with safe-harbour language and a responsible-reporting channel. The product materials also position Storage Health as a second-order safety layer that can catch damaged racks, unstable pallets, and obstruction risks higher up or deeper into storage locations where manual checks are weak. Combined with the case-study evidence that deployments can run without shutting down operations, the product appears designed to remove some of the classic risks of forklifts, drones, and manual high-rack audits.

    The technical-risk side is mostly about what remains undisclosed. Dexory does not publicly expose named API connectors, ERP or WMS compatibility matrices, uptime commitments, or a public status page, and the reviewed source set did not surface a named external security certification such as SOC 2 or ISO 27001. The security-disclosure process is constructive, but it is not a substitute for independently auditable controls. There is also a broader human-factors risk that applies to all warehouse robotics: independent worker-safety research suggests automation can lower severe injuries while increasing repetitive, non-severe strain if job design, pacing, and change management are handled poorly. Dexory's own materials frame the system as enabling more exception-focused work, but Dexory-specific ergonomic or workforce-outcome disclosure remains limited. Public differentiation is therefore strong on execution and workflow fit, but thinner on externally verifiable assurance and disclosed IP.
