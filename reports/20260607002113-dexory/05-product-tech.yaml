  - - Edge perception and scan processing
    - Matches assets, gaps, volume, and condition signals to warehouse reality
    - Barcode / RFID / QR recognition, 3D models, image processing, and local compute
    - No public benchmark on accuracy by label type, lighting, or aisle density
  - - Fleet communications and cloud control
    - Moves robot data into DexoryView and shares tasks / state across fleet
    - Communication agents, encrypted real-time channels, cloud-based platform, central admin for 1000+ devices
    - No public latency, tenancy, or cloud-architecture reference
  - - Warehouse-system reconciliation
    - Closes the loop between physical state and system records
    - WMS data quality, customer master data, and warehouse-specific rules
    - Named connectors, auth patterns, SSO, and ERP references are not publicly documented
  - - Application workflows
    - Expose Integrity, Optimise, Storage Health, Adapt, and Task Manager to operators
    - Role-based users, exception workflows, mobile/tablet access, and site-specific logic
    - Public materials show outcomes, not workflow-governance or admin controls
  - - Deployment and support layer
    - Maps the facility, installs docking, validates scans, and supports rollout under subscription
    - On-site engineers, docking space, customer process fit, and ongoing service coverage
    - No public uptime SLA, support tier matrix, or escalation commitments
  notes: This table reconstructs the public operating architecture from official product, safety, and jobs materials; it is not an internal system diagram.
