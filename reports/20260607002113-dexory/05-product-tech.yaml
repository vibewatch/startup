- id: TE002
  title: Workflow / use-case table
  columns:
  - user job
  - current workflow
  - Dexory solution
  - measurable benefit / proof
  - limitation
  rows:
  - - Daily wall-to-wall inventory validation
    - Manual counts, floor walks, forklift or drone checks, then WMS reconciliation
    - Autonomous robot scans racks daily and syncs exceptions into DexoryView and WMS workflows
    - Yusen cut 100+ monthly audit hours to two hours per day; DB Schenker scans 40k pallet locations daily
    - Public sources do not show named connector, auth, or data-latency details
  - - Validate pick faces and fast-moving locations
    - Teams work from WMS lists and manually confirm exceptions
    - Integrity Pick Count cross-checks WMS data against LiDAR scans and highlights only exceptions
    - Official pages claim exception-led checking and fewer low-value manual loops
    - No public false-positive / false-negative metrics
  - - See block-stacked or double-deep inventory
    - Manual counting, pallet moves, and guesswork on rear or deep stock
    - Block Count and Double Deep scanning use LiDAR, long-range vision, and logical-location mapping
    - Yusen block-stack deployment reported 97-98% daily accuracy and sub-30-minute scans
    - No public explanation of edge cases for opaque packaging or mixed stacks
  - - Turn alerts into operational action
    - Spreadsheet or radio-based follow-up after discrepancies are found
    - Task Manager assigns owners, priorities, and deadlines on mobile and tablet
    - Official product pages show closed-loop tasking instead of standalone reporting
    - No public API for pushing tasks into third-party systems
  - - Optimise slotting, replenishment, and flow
    - Warehouse engineers analyse layouts and travel paths manually or with stale reports
    - Optimise layer surfaces congestion, slotting, consolidation, and replenishment opportunities from live scan data
    - Public pages claim faster picking and better utilisation from the same data spine
    - Independent KPI proof is still lighter than Integrity proof
  - - Monitor storage quality and safety
    - Periodic manual safety walks with weak visibility at height
    - Storage Health flags rack damage, unstable pallets, shrink wrap, and hygiene issues during every scan
    - 2026 launch materials position it as a background inspection layer for HSE and inventory teams
    - Customer adoption and precision/recall are not yet public
  notes: Benefits mix corroborated case-study outcomes with module-level company claims; public proof is strongest for inventory integrity and weaker for optimisation and safety-inspection precision.
