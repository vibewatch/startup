- id: TE006
  title: Capability comparison / maturity table
  columns:
  - capability
  - current public state
  - evidence quality
  - operational implication
  - diligence gap
  rows:
  - - Inventory integrity
    - Mature and broadly evidenced
    - 'High: multiple official modules and customer cases'
    - Dexory appears strongest where physical-vs-system reconciliation is the buyer pain point
    - Need retained-customer and contract-expansion data by module
  - - Deep storage visibility
    - Mature for double-deep and block stack in public materials
    - 'Medium-High: official case study plus product pages'
    - Supports use in 3PL and other high-density environments where rear-pallet visibility matters
    - Need error rates by storage type and packaging profile
  - - Space and flow optimisation
    - Live but more qualitative
    - 'Medium: feature pages and commentary, lighter quantified proof'
    - Could expand value beyond stock accuracy into throughput and utilisation
    - Need hard before/after KPIs by customer and module
  - - Safety inspection / storage health
    - New 2026 module with clear problem statement
    - 'Medium: official and trade coverage, limited customer proof so far'
    - Potentially expands buyer set to HSE and site leadership, not just inventory control
    - Need production references and workflow precision data
  - - Reasoning / root-cause analysis
    - Announced but pre-GA
    - 'Medium-Low: concept and architecture are public, adoption is not'
    - Could become Dexory's most scalable software differentiator if recommendations generalise across sites
    - Need GA evidence, adoption, guardrails, and measurable user outcomes
  - - Open integrations and assurance transparency
    - Partially visible
    - 'Low: public materials describe outcomes, not interfaces or certifications'
    - This is the main underwritten implementation risk for a technical buyer
    - Need named connectors, API / auth docs, and external assurance artifacts
  notes: This comparison scores publicly visible maturity rather than internal product readiness; low evidence quality often reflects disclosure limits rather than product weakness.
