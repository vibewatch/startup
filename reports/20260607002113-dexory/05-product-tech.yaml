  evidenceGaps:
  - type: missing-source
    severity: material
    topic: public-integration-docs
    missingEvidence: Named WMS / ERP connectors, API schemas, authentication methods, SSO options, and a reference implementation for customer data exchange.
    whyItMatters: Integration friction is one of the main underwritten risks for a warehouse software deployment even when the robot hardware itself is proven.
    diligencePath: Request product architecture docs, connector inventory, API samples, and at least one implementation runbook from a live enterprise deployment.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE003
    - TE006
  - type: missing-source
    severity: material
    topic: external-security-assurance
    missingEvidence: Independent security attestations, uptime commitments, public status reporting, and customer-facing operational controls documentation.
    whyItMatters: Policy documents alone do not establish the assurance posture that a regulated or security-sensitive buyer would require.
    diligencePath: Request SOC 2 / ISO documentation if it exists, security architecture overviews, incident-response summaries, and standard customer SLA language.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: patent-estate
    missingEvidence: Granted patent numbers, published applications, licensing strategy, and a clear map of which product capabilities are defensibly patented versus execution-led.
    whyItMatters: Dexory may still have meaningful IP, but public differentiation currently relies more on deployment proof and full-stack execution than on disclosed patent rights.
    diligencePath: Run counsel-led patent and trademark diligence on Dexory and prior entity names such as BotsAndUs, then reconcile any filings with product modules and jurisdictions.
    relatedQuestionRefs:
    - QE027
    relatedTableRefs:
    - TE001
    - TE006
  - type: private-evidence-only
    severity: minor
    topic: adapt-adoption-and-guardrails
    missingEvidence: Customer references, pricing, GA timing, precision metrics, and operator-governance rules for DexoryView Adapt and Storage Health.
    whyItMatters: The highest-upside new software layers are the least proven publicly, so valuation should not over-credit them without rollout evidence.
    diligencePath: Ask for the 2026 product roadmap, pilot-to-production conversion data, module attach rates, and sample outputs from live sites using Adapt or Storage Health.
    relatedQuestionRefs:
    - QE022
    relatedTableRefs:
    - TE001
    - TE005
    - TE006
