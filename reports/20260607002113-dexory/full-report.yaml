        - $250M-$350M base; $150M-$220M downside; $400M+ only with proof
        - Range driven by opaque revenue and comp dispersion
        - Do not underwrite upside without audited software economics
      - - Most likely next step
        - Diligence-first, price-second
        - Named customers and product proof justify work; undisclosed price does not justify immediate commitment
        - Request full round docs before term-sheet engagement
    notes: >-
      Public-evidence assessment only; valuation bands combine a low-confidence revenue estimate with public comparable
      market-cap-to-revenue bands and should not be mistaken for a fairness opinion.
