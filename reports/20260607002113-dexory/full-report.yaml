chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and footprint
        blocks:
          - type: paragraph
            body: >-
              Dexory’s cleanest public identity anchors are unusually strong for a private logistics software and
              robotics business. Companies House shows Dexory Limited was incorporated on 19 February 2015 and is
              active, while Dexory’s current about surfaces preserve the same 2015 founding and the BotsAndUs-to-Dexory
              rebrand path. The company’s own history pages also explain the strategic pivot: the technology started
              with retail and travel inventory use cases, then moved into warehouse operations when customers asked for
              the same real-time data capture inside logistics sites. That matters because Dexory now presents less as a
              single-purpose robot vendor and more as a warehouse-intelligence platform built around autonomous data
              capture, AI, and digital twin software.


              The current footprint also looks materially larger and more international than a narrow UK robotics
              startup. Dexory’s careers page claims 200 people across seven countries, two offices, and 33
              nationalities, while its privacy notice and March 2026 Nashville announcement confirm a U.K. legal base in
              Wallingford plus a North American operating presence in Nashville. The product story has also advanced
              quickly in 2026: the next-generation robot extends scan range to 60 feet, Storage Health adds condition
              monitoring on every scan, and DexoryView Adapt pushes the narrative from visibility toward evidence-backed
              operational decisions. The one caveat is that most of these scale and capability claims remain
              company-owned rather than audited.
