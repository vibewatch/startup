      - number: '8.2'
        title: Commercial proof versus sector frictions
        blocks:
          - type: paragraph
            body: >-
              Dexory has more evidence of commercial relevance than many warehouse-robotics startups. Official and
              customer-backed materials show specific customer outcomes, named global operators, a larger scan dataset,
              and 2026 product improvements that widen coverage across more storage formats. The Nashville expansion and
              Romark deployment are especially useful because they move the story beyond prototype theatre and toward
              repeatable operational use. Even so, the downside case remains real because warehouse-automation adoption
              is still constrained by capex, integration burden, and slow payback. Supply Chain Dive highlights $1
              million deployment costs and multi-year payback periods, while Automation World stresses that robots
              amplify broken processes when orchestration is weak. That tension is central to Dexory valuation: the
              company may be right that buyers want immediate intelligence rather than disruptive retrofits, but public
              evidence still shows a sector where ROI generalization is difficult and selective deployments can look
              better than fleet-wide economics.
