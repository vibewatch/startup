  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold or event
      - Transmission to thesis
      - Action implication
    rows:
      - - ARR far below expectation
        - Audited ARR below $25M
        - Compression toward low-end logistics-tech multiples and little support for a premium Series C mark.
        - Do not proceed without a major valuation reset.
      - - Weak software economics
        - Gross margin below 50% or software revenue de minimis
        - Dexory looks more like capital-intensive hardware/services than a premium data platform.
        - Re-rate comp set toward Zebra/GXO and cut valuation band sharply.
      - - Punitive debt or preferences
        - Covenants, liquidation stack, or ratchets materially subordinate new equity
        - Good operating performance may still translate into poor equity outcomes.
        - Walk away or require senior protections and price reset.
      - - Concentrated customer base
        - Top customers dominate revenue and renewal exposure
        - Named-logo strength becomes concentration risk rather than proof of repeatability.
        - Require concentration discount and customer reference diligence.
      - - ROI claims do not generalize
        - Only a few flagship sites show strong metrics
        - Commercial story is too narrow to justify software-like multiple expansion.
        - Treat Dexory as a selective tooling vendor, not a scalable platform.
    notes: >-
      These triggers are deliberately phrased as underwriteable diligence events so the chapter can translate evidence
      gaps into decision rules rather than generic cautions.
    claimRefs:
      - CV016
      - CV018
      - CV031
      - CV032
      - CV040
      - CV042
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Current ARR and revenue mix
        - Audited ARR, recognized revenue, and software-versus-hardware split for FY2025 and LTM 2026.
        - This is the single largest variable in the valuation range.
        - Request audited financial package and board materials.
      - - Gross margin and contribution profile
        - Gross margin by module, deployment cohort, and service line.
        - Premium multiple logic only works if software-like economics are real.
        - Request management accounts and cohort margin bridge.
      - - Debt, preferences, and ratchets
        - Term sheets, debt schedules, covenants, liquidation preference stack, and anti-dilution provisions.
        - Capital-structure overhang can dominate equity outcomes even if the business grows.
        - Review executed financing documents with counsel.
      - - Customer quality
        - Top-10 customer concentration, GRR, NRR, and upcoming renewals.
        - Named logos are useful only if the book is sticky and diversified enough.
        - Run cohort analysis and reference calls.
      - - Portfolio-wide ROI generalization
        - Deployment roster with before/after KPIs across all live customers.
        - A few strong case studies are not enough to justify software-like valuation.
        - Request customer KPI export and sample-site interviews.
      - - Actual 2025-2026 share price
        - Post-money valuation, option-pool changes, and any secondary activity.
        - Without a clean price marker, round-size headlines do not tell investors what they are paying for.
        - Request cap-table snapshot and signed Series C closing memo.
    notes: >-
      These asks are intentionally valuation-linked; each one would move the range or recommendation materially if
      answered, so they are not generic diligence wishlist items.
    claimRefs:
      - CV031
      - CV032
      - CV037
      - CV038
