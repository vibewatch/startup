      - - Descartes
        - Public
        - $0.72B TTM
        - $6.46B market cap
        - ~9.0x
        - Useful ceiling for a logistics software and network-intelligence outcome.
        - Pure software economics are likely better than Dexory's current blended model.
      - - Manhattan Associates
        - Public
        - $1.10B TTM
        - $8.73B market cap
        - ~7.9x
        - Warehouse-software benchmark for a proven orchestration layer.
        - Less hardware exposure and longer public operating history than Dexory.
      - - Zebra
        - Public
        - $5.39B TTM
        - $11.05B market cap
        - ~2.1x
