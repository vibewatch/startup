      - number: '8.4'
        title: Scenario ranges, recommendation, and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Because public revenue data are weak, scenario logic must combine a cautious revenue band with comp-based
              multiple bands rather than pretend precision. The only public revenue estimate we found is GetLatka’s
              $28.6 million figure, but that same page also incorrectly says Dexory is bootstrapped and has raised no
              venture capital, so it is usable only as a directional anchor. On that basis, a bear valuation around $150
              million to $220 million reflects a lower-growth logistics-tech outcome. A base range around $250 million
              to $350 million assumes moderate software premium and somewhat stronger revenue than the third-party
              estimate. An upside band above $400 million is possible only if current ARR is meaningfully above the
              public estimate and if gross margins, retention, and renewal behavior look closer to premium warehouse
              software than to capital-intensive integrators. That leaves the present recommendation as research-more:
              the business is interesting, but the public record does not justify paying an undisclosed premium mark.
