  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation context, opacity, and capital stack
        blocks:
          - type: paragraph
            body: >-
              Dexory entered 2026 with impressive momentum but weak public price discovery. The company disclosed a $165
              million Series C in October 2025 and then added a £8.5 million British Business Bank tranche in March
              2026, yet it never disclosed the post-money valuation. That matters more here than for a routine growth
              round because Dexory has already layered growth debt into both its 2024 Series B and 2025 Series C
              structures. Public investors can see capital inflow, customer logos, scan-count growth, and a new North
              American headquarters, but they still cannot see current ARR, margin mix, retention, or debt terms. City
              A.M. additionally reported a £12 million loss for the year ended March 2024, which reinforces that Dexory
              remains in a scale-up phase rather than a self-funding software model. In practical terms, public evidence
              can justify interest in the business, but not blind acceptance of undisclosed round pricing or dilution
              terms.
            claimRefs:
              - CV001
