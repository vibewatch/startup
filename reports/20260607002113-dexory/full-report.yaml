      - number: '2.4'
        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              The strongest tailwinds are structural rather than cyclical. E-commerce growth keeps compressing delivery
              windows; labor remains large and expensive in warehousing; and operators increasingly need real-time data
              before they can use AI productively. McKinsey argues AI-enabled warehouse tools can unlock 7-15%
              additional capacity and that digital twins can create near-10% capacity gains without new real estate.
              Independent market reports likewise tie adoption to labor shortages, wage inflation, and faster
              fulfillment requirements. But the same sources also show why the market is not frictionless. McKinsey
              finds 71% of respondents cite capital cost and 61% cite lack of internal experience as leading barriers.
              Interact Analysis says budget is the top barrier for mobile robots, that full deployments can average
              about $1 million, and that ROI can still take two to three years. AutomationWorld adds that robots amplify
              broken WMS logic and deliver best payback only in repetitive, high-volume tasks. Dexory benefits from
              being lighter-weight than a full facility redesign, but it still has to clear data-integration, budget,
              and business-case hurdles.
