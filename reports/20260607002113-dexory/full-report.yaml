  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              Dexory sits inside the warehouse-intelligence layer rather than the full warehouse-automation stack. Its
              core promise is not robotic picking or goods-to-person storage; it is continuous inventory truth.
              DexoryView combines autonomous scanning robots, a digital twin, and AI analytics to reconcile what the WMS
              says with what is physically in racks. Included spend therefore covers automated cycle counting,
              stock-integrity monitoring, discrepancy detection, space-utilization analytics, and warehouse-health
              inspections. Adjacent spend includes WMS, OMS, and transport systems that remain systems of record and
              execution, plus broader warehouse-automation categories such as AS/RS, sortation, and picking robots. The
              closest status-quo substitute is still manual cycle counting, floor walks, and periodic audits. That
              boundary matters because Dexory can often be sold as a lighter overlay on an existing warehouse,
              especially where operators want better data without redesigning the facility or disrupting live
              operations.
