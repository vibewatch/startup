            body: >-
              The strongest named proof comes from Maersk, ODW Logistics, Romark Logistics, DCL Logistics, and Linfox
              BevChain. Maersk is the broadest brand name, but the public evidence splits into two different levels of
              maturity: an initial Dexory-authored trial story covering Kettering and Tamworth in the UK, and a later
              EMG Maersk workflow case on handheld discrepancy resolution. That gives real operational substance, but
              not yet a clean network-wide production narrative across Maersk. ODW is the richest deployment proof set
              in this chapter: Dexory and ODW both describe under-24-hour full audits, frequent autonomous scans,
